      - number: '4.2'
        title: 牵引力、增长与单位经济信号
        blocks:
          - type: paragraph
            body: >-
              顶线故事很吸睛，尽管底层经营报表仍是私有的。CNBC 和 TechCrunch 均指向 Replit 年化收入到 2025 年末从 $2.8 million 增至 $150 million；2026 年 3
              月报道和 Replit 自己的文章又把下一个目标描述为 2026 年底约 $1 billion ARR 或收入运行率。CNBC
              还报道公司仍未盈利，这一点重要，因为它意味着增长跑在可见经营杠杆之前。公开采用指标解释了收入为什么可能快速放大：CNBC 和 Replit 自己 2026 年 3 月的文章都指向 50 million-plus
              用户，CNBC 称 Replit 有 500,000 个专业商业客户，并进入超过 85% 的 Fortune
              500。单位经济读数更混杂。官方文档显示多种成本控制、积分包、预算和用量限制，意味着支出会随客户行为显著移动。Sacra 的估算更进一步，暗示 2026 年收入运行率更高，且由于模型访问成本随 Agent
              使用摆动，毛利率高度波动。这些估算是有用的方向线索，不是审计答案。正确结论是，Replit 可能有强劲的变现速度和真实扩张机制，但公开数据仍太薄，无法有信心地支撑毛利率、回本周期或留存质量。
