  - id: TE003
    title: 技术与运营架构表
    columns:
      - 层级或组件
      - 角色
      - 主要依赖
      - 运营含义
      - 风险或注意事项
    rows:
      - - 浏览器项目编辑器
        - 提示、编辑、预览和发布的主要用户界面
        - Replit Web 应用和 Agent 控制平面
        - 工作流集中，配置负担低
        - 主要控制面依赖 Replit UI 和编排
      - - 后台任务工作进程
        - 合并前在隔离副本中运行已批准工作
        - 任务系统和底层 Agent 执行环境
        - 支持并行工作和更安全的审查流程
        - 高自主运行可能推高花费和复杂度
      - - 托管 Postgres 路径
        - 按开发 / 生产隔离持久化应用数据
        - 基于 Neon 的托管 Postgres 和 Replit 凭证接入
        - 比内存原型更安全
        - 公开 SLA 和恢复指标有限
      - - App Storage
        - 处理文件和二进制资产
        - 由 Google Cloud Storage 支撑的存储层
        - 让应用把图片、文档和媒体留在 Replit 工作流里
        - 仍需管住存储和带宽成本
      - - 发布运行时
        - 通过静态、自动伸缩、预留 VM 或定时模式托管应用
        - Google Cloud 基础设施和 Replit 部署工具
        - 从快照到公开 URL 的路径由 Replit 掌控
        - 地域默认值和运行时行为仍由 Replit 控制
      - - 连接器与 MCP 底座
        - 让应用或外部客户端访问第三方工具和 Replit 资源
        - OAuth、服务主体、透明代理和 MCP 客户端
        - 把产品能力扩展到本地代码生成之外
        - 密钥处理和提示注入防护也压在信任负担里
      - - 企业数据连接器
