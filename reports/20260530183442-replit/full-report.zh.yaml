  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 竞品
      - 公开自助入门档
      - 更高档 / 团队价格
      - 使用量或点数模型
      - 企业包装
      - 含义
    rows:
      - - Replit
        - Starter 免费；Core $20/mo，按年计费
        - Pro $95/mo，按年计费；Enterprise 定制
        - 月度点数和 agent 并发档位
        - Enterprise 增加定制席位上限、SSO/SAML 和隐私控制
        - 入门价有竞争力，但支出可预测性取决于点数消耗
      - - Cursor
        - 免费
        - Teams $40/user/mo；Enterprise 定制
        - Agent 限额，加按量计费的 Bugbot 和云端 agent 容量
        - Enterprise 增加共享使用额度、SCIM、审计日志、服务账户、访问控制
        - 面向专业开发者的包装很强，企业加购路径清晰
      - - Windsurf
        - 免费
        - Pro $20/mo；Max $200/mo；Teams $40/user/mo；Enterprise 定制
        - 套餐额度外，额外使用按 API 价格计费
        - 面向企业和政府定位，配套安全控制
        - 定价对开发者清晰，但直接部署价值不如 Replit 可见
      - - Lovable
        - 免费
        - Pro $25/mo；Business $50；Enterprise 平台费
        - 月度点数、每日点数、充值，以及按量计费的云端 + AI
        - Enterprise 增加 SSO、SCIM、审计日志和发布控制
        - 团队友好的应用构建经济性强，尤其适合非工程师
      - - Bolt.new
        - 免费
        - Pro $25/mo；Teams $30/member/mo；Enterprise 定制
        - token 额度和结转
        - Enterprise 增加 SSO、审计日志、合规支持和 SLA
        - 入门价格可负担，但 token 消耗重时仍可能放大成本敏感度
      - - v0
        - 免费，含 $5 月度点数
        - Team $30/user/mo；Business $100/user/mo；Enterprise 定制
        - 模型级 token 定价加点数
        - Enterprise 增加 SAML SSO、RBAC、支持 SLA，且不使用客户数据训练
        - 定价更利好已经适应 Vercel 经济模型的 Web 构建者
      - - GitHub Copilot + Codespaces
        - Copilot Free $0
        - Copilot Pro $10/user/mo；Pro+ $39/user/mo；Codespaces 算力起价 $0.18/hr，另加 $0.07/GB-month 存储
        - Copilot 使用高级请求 / AI 点数；Codespaces 使用按量计费的算力 / 存储
        - Business 和 Enterprise 档增加集中管理和策略控制
        - 既有技术栈按席位看可能便宜，但成本会随用量和基础设施扩张
      - - Claude Code / Anthropic
        - Claude Pro 月付 $20
        - Team 标准席位按年计费 $20/用户/月；高级席位 $100；Enterprise 席位 + 用量
        - 订阅席位叠加按 API 费率扩张的用量
        - Enterprise 增加 SSO、SCIM、审计日志、分析和支出控制
        - 对高级技术用户很强，但企业用量越重，总成本越高
      - - Devin / Cognition
        - $20 入门套餐
        - 历史团队版可用价格为 $500/月，另加按量付费
        - 入门付款后按 ACU 计量用量
        - 保留的官方来源未清楚披露 Enterprise 条款
        - 潜力很强，但保留的公开证据让买方担心成本约束
    notes: 本表混合了公开标价和厂商披露的用量结构，不尝试估算实际折扣、谈判后的企业最低承诺或真实计算支出。
