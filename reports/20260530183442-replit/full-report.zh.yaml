      - number: '4.3'
        title: 资本充足性、融资历史与战略资本
        blocks:
          - type: paragraph
            body: >-
              资本可见度好于经营可见度。TechCrunch、PRNewswire 和 Replit 自己 2026 年 3 月公告都支持同一个核心融资事实：Replit 以 $9B 估值完成 $400M Series
              D。此前 2025 年 9 月一轮也同样得到充分印证，融资 $250M、估值 $3B，并以 $150M 年化收入作为当时增长标记。Replit 2026 年 3
              月文章称，新资本将用于国际扩张、产品开发和基础设施容量，这在财务上相关，因为这些用途对应一个计算密集、企业野心强的平台的成本结构。战略投资者同样重要。Georgian 领投 Series D；Visa
              后来进行未披露金额投资，与嵌入式智能体支付相连；Accenture Ventures 投资，同时围绕企业软件创建建立市场进入合作；Google Cloud 的多年合作则让 Google 保持 Replit
              的主要云提供商地位。这些关系可能不只是美化股权结构表：它们可以提升企业可信度、伙伴牵引分发和产品变现。但公开证据仍未达到投资者严谨判断资本充足性所需水平。没有保留来源披露账上现金、月度烧钱、风险债务、最低流动性门槛或现金跑道月数，因此融资结论是“资金充足，但外部还无法建模”。
