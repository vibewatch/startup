  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR 与 GAAP 收入
        - 董事会级或经审计的 2026 年收入包
        - 弥合 $150M 已验证锚点和 $253M 估计锚点之间的差距
        - 索取最新董事会材料或经审计管理账目
      - - 毛利率与烧钱
        - 毛利率、推理成本、托管成本、经营亏损和现金消耗
        - 当前估值假定业务能规模化，进入更健康的远期倍数
        - 审阅财务包和工作负载层面的毛利率桥接表
      - - NRR 与合约耐久性
        - 企业客户的分群留存、扩张、ACV、期限和流失
        - 如果变现浅，采用面再广也不够
        - 索取销售和财务分群表
      - - 股权结构表
        - 优先权分配瀑布、参与权、二级交易，以及任何异常投资人保护
        - 私募结构可能让真实回报测算偏离 $9B 名义估值
        - 审阅章程、融资文件和二级交易文件
      - - 经事件调整的经济性
        - 定价或安全事件后的流失、额度补偿和支持成本
        - 负面事件会同时改变毛利率和客户信任
        - 索取事后复盘，以及分群层面的流失和额度补偿数据
      - - 企业销售管道质量
        - 管道转化、合作伙伴来源量和渠道依赖
        - 区分真正的企业 GTM 成熟度与合作伙伴带动的叙事动量
        - 向 GTM 负责人索取漏斗数据
      - - 退出就绪度
        - 面向 IPO 或战略出售的上市公司控制、审计节奏和治理就绪度
        - 当前证据支持可选项，不支持准备就绪
        - 审阅审计工作流和董事会治理包
    notes: 这些资料请求按对估值的影响排序。前四项最可能实质改变建议；后三项影响信心和下行保护。
    claimRefs:
      - CV018
      - CV030
      - CV031
      - CV037
      - CV041
      - CV044
