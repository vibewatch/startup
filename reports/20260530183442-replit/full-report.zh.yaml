      - number: '6.3'
        title: 使用如何从提示词转成工作流再到推广
        blocks:
          - type: paragraph
            body: >-
              客户故事对于采用如何展开的描述出奇一致。Replit
              很少被呈现为始于正式平台迁移的重型转型。相反，使用往往从单个运营者或小团队看到痛点工作流开始，他们跑一次由提示词驱动的实验，并比传统软件采购快得多地得到一个可运行内部应用。Plaid
              借黑客松时刻为支持和收入团队重建 SLA 仪表盘。Rokt 用内部黑客松让数百名员工并行构建应用。Leatherman 用平台在部门之间传播构建者文化。Northern Health 和 GenAIPI 都用
              Replit 避免六位数外部开发报价，并基本靠创始人主导执行交付。


              这种使用模式解释了 Replit 的扩张机制。初始胜利往往是内部工具、仪表盘、门户或工作流助手。结果足够好后，会加入更多同事、发布更多应用，讨论也从实验转向控制：协作限制、私有工作区、SSO、SCIM、RBAC
              和私有部署。自助式 Enterprise 在这里重要，因为它缩短了从草根式使用到受管理推广的一步。同一模式也推动切换成本。团队一旦有自定义应用进入生产、用户接受了工作流训练，并接好身份或部署控制，离开
              Replit 就不再是把一个代码编辑器换成另一个，而是重建运营工具并重新培训内部用户。这是一个真实扩张循环，尽管公开续约和 cohort 数据仍缺失。
