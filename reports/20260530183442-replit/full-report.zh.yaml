  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分层地图与买方 / 用户 / 付款方结构
        blocks:
          - type: paragraph
            body: >-
              Replit 的公开客户故事已不再局限于个人编码者。保留的定价、Pro、SMB、Enterprise、Education 和 2026
              年博客界面显示，它有意设计了分层的客户地图。低端上，定价页仍支持爱好者和试用用户的探索路径。Pro/Core 界面则瞄准每天构建、需要更多算力、私有工作区、协作和可预测支持的人群。独立 SMB
              用例页直接面向没有技术团队、但仍想构建自定义 CRM、仪表盘、门户和工作流自动化的企业主与运营者。Enterprise 界面进一步拓宽买方集合，明确把销售、营销、运营、财务、HR 和法务与工程一起纳入目标。


              这很重要，因为 Replit 实际上在向不同角色出售不同东西。在个人和教育场景中，用户和买方往往合并成一个人：学生、创始人或开发者。在 SMB
              场景中，买方通常是希望不用雇开发团队也能获得软件产出的企业主或运营者。在企业中，最终用户可能是分析师、PM、运营负责人或工程师；但一旦 SSO、SCIM、RBAC 和部署治理进入图景，付款方越来越像由
              IT、安全或采购控制的预算。公开教育证据真实但弱于企业证据：Replit
              明确向学生、教育者和校园负责人营销，合作伙伴页面也显示政府和教育路径，但没有提供直接具名的政府客户部署。总体看，证据支持一条正在拓宽的买方漏斗，从学习者和个人构建者延伸到跨职能企业团队。
