chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与可见规模
        blocks:
          - type: paragraph
            body: >-
              Replit 现在不再主要把自己包装成浏览器
              IDE，而是一个面向所有有想法人群的智能体软件创建平台。官方材料称，产品让用户用自然语言构建应用，之后仍留在同一环境里推进，身份验证、数据库、托管、监控和第三方集成已经接好。这个定位重要，因为公司明确把非传统构建者和工程师一起纳入目标客户：它在
              2026 年 4 月的自有传播中称，产品经理、运营人员、创始人、学生和小企业主都在平台上交付生产软件。定价阶梯也强化了这一市场进入形态。Starter 免费，Core 和 Pro
              是年度订阅层级，打包月度积分和并行 Agent 容量，说明 Replit 同时靠席位和用量变现。规模声明仍大多来自公司自报，但在官方和合作伙伴材料中反复出现，也得到第三方报道的部分印证：用户超过 50
              million，进入 85% 的 Fortune 500，专业商业客户达数十万。即便后续章节还要检验留存和单位经济，第一章的核心身份已经清楚：Replit 卖的是更快的软件创建，而不只是更便宜的编码工具。
