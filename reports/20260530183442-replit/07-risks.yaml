    {
      "id": "RR002",
      "title": "Pricing trust and enterprise procurement friction can cap otherwise strong adoption",
      "body": "Replit’s model risk is closely tied to how it monetizes intelligence. The company is explicit that AI usage, publishing, databases, and other services draw from usage-based credits, and it defends effort-based pricing as a way to align user charges with Replit’s own compute costs. That can be economically rational, but it also means that longer chats, larger projects, and more autonomous workflows can produce bigger bills even when the visible code change seems small. The official documentation offers spend limits, shutdown limits, budgets, and per-user caps, yet the docs frame many of those controls as settings customers must proactively configure. The legal surface adds another trust challenge: Replit’s terms allow subscription refunds within limits but treat usage-based charges as non-refundable. In practice, this is exactly the combination that tends to create disputes when product behavior is still evolving.\n\nExternal evidence shows the problem is not hypothetical. InfoWorld, The Register, Trustpilot, and a hostile developer essay all describe versions of the same complaint: surprise charges, weak warning surfaces, expensive editing of existing code, or support escalation after trust has already broken. Replit’s self-serve enterprise motion reduces friction for standard buyers by making SSO, SCIM, pooled credits, and immediate provisioning available without a long sales cycle. But the same public materials say larger commitments, custom terms, or special procurement requirements still require assisted sales. That means Replit has lowered entry friction without fully removing diligence friction. The commercial upside is obvious if buyers accept the model; the risk is that billing opacity, refund rigidity, or incomplete trust materials convert curiosity into one-time usage rather than durable enterprise expansion.",
