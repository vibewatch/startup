    {
      "id": "RR003",
      "title": "Security, privacy, and legal uncertainty are manageable only if disclosure quality improves",
      "body": "Publicly, Replit now looks much more serious on security than many vibe-coding peers. The company’s security pages describe executive oversight, zero-trust internal design, isolation on GCP, enterprise controls, CVE monitoring, Security Agent reviews, and read-only production investigation paths. For enterprise buyers, that is the right mitigation direction. The harder question is whether disclosure depth is keeping pace with the claims. Replit’s privacy policy says the company collects service-usage information and may use information to improve machine-learning systems, while the terms say public apps are MIT-licensed and may be used to improve the service. Those disclosures create understandable legal and procurement questions around data scope, IP posture, and where exactly the boundary sits between product telemetry and model improvement. They also put more pressure on buyers to understand DPA terms, regional hosting, and privacy responsibilities before broader rollout.\n\nThe regulatory environment is also tightening. The FTC’s AI materials emphasize transparency and accountability, while the EU AI Act introduces specific transparency rules and broader GPAI obligations that become more important through 2026. Replit may be able to comply, but public-web materials retained for this chapter do not yet substitute for a full trust-center packet, a formal postmortem library, or counsel-grade compliance mapping. The Axios report on public app exposures shows why this matters: when non-technical or lightly governed users can publish internal tools quickly, privacy and access-control mistakes scale fast. This chapter therefore does not allege a source-backed live enforcement case or lawsuit; instead, the legal and regulatory risk is that contract, privacy, AI-governance, and disclosure obligations are all rising at the same moment that Replit is pushing deeper into enterprise production use.",
