  - id: TM002
    title: Status-Quo and Adjacent Alternatives
    columns:
      - Alternative
      - Why buyers use it
      - Limitation vs Apeel
      - Market implication
    rows:
      - - Refrigeration and cold chain
        - Slows spoilage across produce categories
        - Energy and infrastructure intensive
        - Apeel competes on incremental extension rather than total replacement.
      - - Plastic packaging and wraps
        - Protects freshness and presentation
        - Faces sustainability pressure
        - Plastic reduction can help category conversion.
      - - Waxes and traditional treatments
        - Established packhouse practices
        - Can be less differentiated and less data-rich
        - Incumbent inertia is real.
      - - Freshness sachets / atmosphere systems
        - Alternative shelf-life tools
        - Different workflow and efficacy profile
        - Category remains multi-modal rather than winner-take-all.
    notes: Apeel competes against operational habits and adjacent freshness tools, not just direct edible-coating startups.
    claimRefs:
      - CM010
      - CM011
      - CM023
      - CM035
  - id: TM003
    title: Buyer / User / Payer Segmentation
    columns:
      - Segment
      - Likely buyer
      - Likely user
      - Budget logic
    rows:
      - - Retail produce teams
        - Category or produce leader
        - Store, DC, and replenishment teams
        - Shrink reduction and shelf-life extension.
      - - Suppliers / packhouses
        - Operations or commercial lead
        - Packing-line and QC teams
        - Export reach and spoilage reduction.
      - - Quality-control teams
        - Operations or food-safety budget
        - QC inspectors and managers
        - Measurement and spec compliance.
      - - Strategic sustainability owners
        - ESG or innovation sponsor
        - Cross-functional stakeholder
        - Waste, water, and carbon goals can support adoption but rarely close the sale alone.
    notes: >-
      Budget ownership likely sits with operators capturing spoilage economics, while ESG value supports but does not
      replace ROI.
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM019
      - CM020
  - id: TM004
    title: Adoption Constraints and Diligence Gaps
    columns:
      - Constraint
      - Public evidence
      - Commercial effect
      - Next diligence ask
    rows:
      - - Workflow integration
        - Supplier and retail pages emphasize integration
        - Can slow deployments or limit categories
        - Request implementation timelines by crop and partner type.
      - - Consumer trust
        - Misinformation and fact-check coverage is visible
        - Can reduce retailer appetite in sensitive channels
        - Request churn or delayed-rollout examples tied to misinformation.
      - - Regulatory / labeling nuance
        - Regulatory and transparency pages are active
        - Creates channel-specific friction
        - Request regulatory matrix by market and crop.
      - - Pricing opacity
        - Public sources do not disclose pricing
        - Makes bottom-up SOM modeling weak
        - Request category-level unit economics and realized payback cases.
    notes: The decisive missing market input is not TAM but paid ROI and adoption friction by crop, route, and customer type.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM036
