        - Product directly touches food
        - FAQs, fact checks, and labeling pages are active
        - Continue transparency and retailer education.
      - - Implementation complexity
        - Workflow integration is required
        - Supplier and QC pages stress operational fit
        - Standardize deployment playbooks.
      - - Category variance
        - Performance differs by crop
        - Avocado and mandarin materials are crop-specific
        - Publish category-specific proof.
      - - Opaque IP base
        - No public patent map in retained sources
        - Outside investors cannot fully score defensibility
        - Provide IP and manufacturing know-how overview.
    notes: >-
