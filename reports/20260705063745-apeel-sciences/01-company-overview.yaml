company:
  name: Apeel Sciences
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Apeel Sciences is a private Goleta-based food technology company built around plant-derived produce coatings and a
    broader fresh-produce optimization narrative. The strongest public evidence supports a 2012 founding, retailer and
    supplier penetration, measurable food-waste impact, and a well-funded Series E-era capital base, while later
    valuation and headcount figures remain conflicting across third-party databases.
sections:
  - id: identity-and-mission
    title: Identity, Mission, and Public Narrative
    body: >-
      The public record on Apeel is strongest when it stays close to the company’s own product and mission language.
      Apeel Sciences was founded in 2012. Apeel Sciences is headquartered at 71 South Los Carneros Road in Goleta,
      California. Apeel describes its core mission as using food to protect food by reinforcing the natural peel of
      fresh produce. Apeel sells plant-derived coatings that aim to retain taste, juiciness, and nutrients for longer.
      TexAu places Apeel in Goleta, California and describes the company as a global retailer-network player. Apeel’s
      store-locator and retail-facing pages indicate distribution through retailers including Walmart, Costco, Kroger,
      Whole Foods, Trader Joe’s, Albertsons, and EDEKA. Apeel separately said it prevented more than 60M pieces of fruit
      from going to waste in 2023. Apeel’s product-information page says Edipeel is made of plant-based mono- and
      diglycerides. Apeel’s public identity combines produce shelf-life extension with retailer and supplier workflow
      improvement, not just an ingredient story. This combination of retained sources is enough to support a clear
      diligence view, but not enough to erase the unresolved gaps that matter for underwriting.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO020
      - CO021
      - CO025
      - CO026
      - CO036
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: leadership-and-capital
    title: Leadership, Capital, and Disclosure Posture
    body: >-
      Leadership and capital are both visible, but not equally well disclosed. Apeel’s founding narrative is anchored on
      James Rogers. Apeel publicly highlights co-founder Jenny Du in a company interview, indicating founder visibility
      beyond the CEO narrative. Public disclosure on current board composition is sparse in the retained source set.
      Tracxn still classifies Apeel as a Series E company. Tracxn reports that Apeel has raised $640M across nine
      funding rounds. Tracxn lists Apeel’s latest fully corroborated round as a $250M Series E on 2021-08-18 at a $2B
      post-money valuation. Tracxn names Temasek, GIC, IFC, and Andreessen Horowitz among Apeel’s investors. GetLatka
      reports Apeel reached $150M of revenue in 2024. GetLatka says Apeel previously reported $102.6M of revenue in
      2022. Growjo estimates Apeel currently generates about $102.6M of annual revenue. Apeel remains a private company
      with incomplete disclosure on board structure, detailed financial statements, and cap-table mechanics. This
      combination of retained sources is enough to support a clear diligence view, but not enough to erase the
      unresolved gaps that matter for underwriting.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO037
    tableRefs:
      - TO002
      - TO003
    figureRefs:
      - FO002
  - id: scale-metrics-and-customers
    title: Scale Metrics, Customers, and Impact Claims
    body: >-
      The scale story is meaningful, but the KPI file is mixed between directly stated impact figures and inconsistent
      third-party operating metrics. Public revenue estimates are directionally positive but not fully consistent across
      third-party databases. Tracxn’s legal-entity view shows 108 employees as of December 2024 for one Apeel entity.
      GetLatka reports 184 employees in November 2025. Growjo estimates Apeel has 473 employees and negative employee
      growth. Headcount disclosure is materially conflicted across public databases and should not be treated as a
      single settled KPI. Apeel reports that since 2021 it has prevented 145.63M pieces of fruit from going to waste.
      Apeel reports conserving roughly 2.789B liters of water since 2021. Apeel reports avoiding about 273.4K metric
      tons of CO2-equivalent emissions since 2021. Apeel’s product-information page says Organipeel adds citric acid and
      baking soda to plant-based mono- and diglycerides. The company frames safety and purity as top priorities and says
      ingredients are food-grade and safe for human consumption. This combination of retained sources is enough to
      support a clear diligence view, but not enough to erase the unresolved gaps that matter for underwriting.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO022
      - CO023
      - CO024
      - CO027
      - CO028
    tableRefs:
      - TO004
    figureRefs: []
  - id: milestones-and-adverse-events
    title: Milestones and Adverse Events
    body: >-
      Apeel’s milestone trail includes product expansion, retailer and supplier enablement, and a visible misinformation
      backlash that now sits inside the company’s public narrative. Apeel offered free coating services during the 2024
      East Coast port strike to protect suppliers facing spoilage delays. The Apeel Leverage initiative was launched to
      showcase operational and supply-chain benefits for fresh produce partners. AgFunder reports that Apeel navigated
      layoffs and an organized misinformation campaign while repositioning the business. Apeel’s leadership page
      explicitly says the company became a target of a coordinated online disinformation campaign. A legal complaint
      filed by Apeel against GreenSmoothieGirl shows the company escalated misinformation disputes into litigation.
      SalesTools AI claims Apeel raised a $250M Series F in 2025. The reported 2025 Series F is not corroborated by
      stronger public databases such as Tracxn or GetLatka, which still anchor Apeel around its 2021 Series E and $2B
      valuation marker. This combination of retained sources is enough to support a clear diligence view, but not enough
      to erase the unresolved gaps that matter for underwriting.
    claimRefs:
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
      - CO034
      - CO035
    tableRefs: []
    figureRefs:
      - FO003
