  topStrengths:
    - Real public evidence of retailer and supplier adoption across multiple produce categories.
    - Clear sustainability tailwind tied to food-waste reduction, water conservation, and carbon avoidance.
    - Product scope now includes category workflow and quality-management tools, not just a single coating SKU.
    - Public revenue markers suggest Apeel is a real scaled business rather than a pre-revenue science bet.
  topRisks:
    - Financial disclosure is incomplete on gross margin, runway, customer concentration, and retention.
    - The company carries a meaningful misinformation and trust burden because the product directly touches food.
    - Public financing data conflict on whether any post-2021 round actually closed and at what valuation.
    - Workflow integration and support burden could compress margins if deployments are labor-intensive.
    - Large retailer and supplier relationships may create concentration risk that the public record cannot quantify.
  unresolvedGaps:
    - Current cap table, liquidation preferences, and corroborated evidence for any post-2021 financing round.
    - Gross margin, burn, runway, and customer concentration data needed for a true late-stage underwriting memo.
    - Cohort retention, contract length, and expansion attach rates by crop and customer type.
    - Board composition, governance detail, and internal compliance oversight beyond the high-level ESG pages.
    - Crop-level efficacy dispersion and implementation burden across customer cohorts.
