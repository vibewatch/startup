evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board
    relatedTableRefs:
      - TO002
    missingEvidence: A current board roster, ownership map, and voting-right summary.
    whyItMatters: Governance and control determine how much founder or investor influence exists after multiple large rounds.
    diligencePath: Request board materials, cap table, and charter documents from management.
    relatedQuestionRefs:
      - QO023
  - type: conflicting-data
    severity: material
    topic: headcount
    relatedTableRefs:
      - TO003
    missingEvidence: A management-confirmed employee count and reorganization history.
    whyItMatters: Public databases disagree sharply on staffing levels, making operating-scale inference unreliable.
    diligencePath: Request HR headcount by geography and a chronology of layoffs or restructurings.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: series-f
    relatedTableRefs:
      - TO004
    missingEvidence: Primary documentation for the claimed 2025 Series F and valuation mechanics.
    whyItMatters: Without a primary announcement or filing, the reported post-2021 valuation remains weakly supported.
    diligencePath: Request financing closing documents or investor announcement links that verify round size and valuation.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public price sheets or realized customer payback data by crop.
    whyItMatters: Market size only translates into revenue if category economics clear customer budgets.
    diligencePath: Request SKU-level pricing, shrink reduction case studies, and margin share assumptions.
    relatedQuestionRefs:
      - QM023
  - type: enumeration-incomplete
    severity: minor
    topic: regional-size
    missingEvidence: Regional revenue opportunity by crop and route to market.
    whyItMatters: Top-down TAM does not show where Apeel’s actual win-rate or deployability is highest.
    diligencePath: Build a bottom-up SAM model by region, crop, and partner type.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: share
    missingEvidence: Apeel’s actual customer count, deployed volume, and market share by category.
    whyItMatters: Without penetration data, valuation discussions default to narrative instead of evidence.
    diligencePath: Request deployment counts, protected-volume data, and crop-level cohort retention.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Current commercial pricing or contract terms across Apeel and the top peer set.
    whyItMatters: Feature comparisons do not show who can actually clear procurement hurdles with attractive economics.
    diligencePath: Request win-loss data, quote sheets, and category payback comparisons.
    relatedQuestionRefs:
      - QP023
  - type: enumeration-incomplete
    severity: minor
    topic: peer-set
    missingEvidence: A wider long list of regional and crop-specific alternatives.
    whyItMatters: The global competitive field is larger than the visible English-language startup set.
    diligencePath: Build a geo-specific competitor map by crop, modality, and channel.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer retention and replacement data when Apeel goes head-to-head with other freshness modalities.
    whyItMatters: Moat quality depends on observed switching behavior, not only on public product descriptions.
    diligencePath: Request churn, replacement, and win-back case studies from commercial leadership.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: margin
    missingEvidence: Gross margin and contribution margin by crop or customer channel.
    whyItMatters: Late-stage valuation without margin shape is underwriting theater rather than analysis.
    diligencePath: Request gross-margin bridge, services burden, and cohort contribution margins.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash on hand, monthly burn, and debt or structured-finance obligations.
    whyItMatters: Capital adequacy cannot be assessed from public coverage alone.
    diligencePath: Request treasury snapshot, cash burn, and financing-covenant detail.
    relatedQuestionRefs:
      - QI024
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Management-confirmed staffing baseline with explanation of database variance.
    whyItMatters: Efficiency metrics swing sharply depending on which headcount source one believes.
    diligencePath: Request actual FTE counts by quarter and a layoff chronology.
    relatedQuestionRefs:
      - QI025
  - type: missing-source
    severity: material
    topic: efficacy
    missingEvidence: Public crop-by-crop performance distributions and failure modes.
    whyItMatters: Technology quality depends on how consistently results repeat across produce categories and routes to market.
    diligencePath: Request controlled efficacy studies by crop, shipment duration, and customer cohort.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: ip
    missingEvidence: A current patent, know-how, and manufacturing-defensibility map.
    whyItMatters: Without an IP map, outside investors cannot score technical durability versus coating peers.
    diligencePath: Request IP schedules, manufacturing SOP differentiation, and core trade-secret summary.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: minor
    topic: support-burden
    missingEvidence: Quantified implementation and support burden per new customer deployment.
    whyItMatters: Broader architecture can improve defensibility while still hurting margins if support is heavy.
    diligencePath: Request onboarding timelines, service attach, and support staffing ratios.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: blocking
    topic: retention
    relatedTableRefs:
      - TU003
    missingEvidence: Net revenue retention, gross retention, and churn by customer cohort.
    whyItMatters: Customer durability is the core difference between a compelling late-stage asset and a fragile solution sale.
    diligencePath: Request quarterly cohort retention, renewal schedules, and churn drivers.
    relatedQuestionRefs:
      - QU023
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-retailer, and top-channel revenue share.
    whyItMatters: Named logos are not enough if a few accounts dominate economics.
    diligencePath: Request concentration tables by customer, geography, and category.
    relatedQuestionRefs:
      - QU024
  - type: missing-source
    severity: minor
    topic: contracts
    missingEvidence: Typical contract length and deployment timeline by customer type.
    whyItMatters: Expansion velocity and renewal risk depend on contract structure.
    diligencePath: Request standard commercial terms and pilot-to-production conversion data.
    relatedQuestionRefs:
      - QU025
  - type: private-evidence-only
    severity: blocking
    topic: runway
    relatedTableRefs:
      - TR001
    missingEvidence: Runway, burn, and liquidity stress scenario data.
    whyItMatters: Financial opacity prevents investors from separating reputational noise from existential financing risk.
    diligencePath: Request cash runway, downside plan, and financing contingency triggers.
    relatedQuestionRefs:
      - QR028
  - type: missing-source
    severity: material
    topic: customer-impact
    missingEvidence: Quantified evidence on customer losses or delayed rollouts caused by misinformation.
    whyItMatters: The core risk is commercial impairment, not just bad press.
    diligencePath: Request lost-deal, delayed-rollout, and churn analysis tied to trust events.
    relatedQuestionRefs:
      - QR029
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board, committee, and compliance-process detail.
    whyItMatters: Late-stage governance quality matters most when reputational and financial risks are both elevated.
    diligencePath: Request governance package, policies, and oversight cadence.
    relatedQuestionRefs:
      - QR030
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    relatedTableRefs:
      - TV004
    missingEvidence: Current cap table, liquidation preferences, and any structured round terms after 2021.
    whyItMatters: Valuation without preference and dilution detail can materially misread investor outcomes.
    diligencePath: Request full cap table, round docs, liquidation preferences, and any secondary details.
    relatedQuestionRefs:
      - QV028
  - type: private-evidence-only
    severity: blocking
    topic: margins-retention
    missingEvidence: Gross margin, cohort retention, and customer concentration data.
    whyItMatters: These are the variables that determine whether the public revenue base deserves a premium or a discount.
    diligencePath: Request margin by cohort, NRR / GRR, and top-customer revenue concentration.
    relatedQuestionRefs:
      - QV029
  - type: conflicting-data
    severity: material
    topic: latest-valuation
    missingEvidence: Primary corroboration for any post-2021 round and its valuation.
    whyItMatters: The spread between the corroborated $2B anchor and the rumored $4.2B case drives the recommendation outcome.
    diligencePath: Request investor announcement, board consent, or legal closing materials for any later financing.
    relatedQuestionRefs:
      - QV030
