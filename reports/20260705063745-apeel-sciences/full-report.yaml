              the product touches food directly, reputational attacks can spill into customer and retailer behavior
              faster than in enterprise software. Apeel’s risk profile is high because commercial trust and disclosure
              quality are both fragile relative to the valuation narrative. In short, Apeel’s biggest risks are not
