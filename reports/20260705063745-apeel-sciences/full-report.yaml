      - number: '2.4'
        title: Segmentation, Geography, and Remaining Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Category economics differ by crop, geography, and route to market, so public top-down estimates only get
              investors part of the way. Europe matters strategically because public market coverage repeatedly
              references regulatory and sustainability drivers there. International customer proof appears strongest
              where Apeel can tie shelf-life extension to export and distribution economics. Category economics vary by
              crop because avocados, mandarins, cucumbers, and citrus have different spoilage and ripeness dynamics. The
              public market data do not disclose Apeel’s actual market share. The broader TAM story is less important
              than proof that Apeel can repeatedly win budget inside fresh-produce workflows. Apeel’s public evidence
              supports a multi-region opportunity, but it does not prove that every region is equally monetizable. The
              public file preserves contradictory sizing lenses and should not be collapsed into one synthetic TAM
              number without caveats. This combination of retained sources is enough to support a clear diligence view,
              but not enough to erase the unresolved gaps that matter for underwriting.
