  - id: TV001
    title: Bull / Base / Bear Thesis Summary
    columns:
      - Case
      - Core assumption
      - What must be true
      - What breaks it
    rows:
      - - Bull
        - Apeel becomes embedded in retailer and supplier workflows
        - Growth, margins, and analytics upsell prove durable
        - Trust shocks fade and category ROI scales.
      - - Base
        - Real business with moderate growth and mixed disclosure
        - Revenue grows but margins stay partly opaque
        - Valuation remains disciplined.
      - - Bear
        - Trust and workflow friction limit scaling
        - Growth slows and support burden rises
        - Financing quality and retention disappoint.
      - - Current public-data verdict
        - Base leaning cautious
        - Needs primary evidence before price-taking
        - Public web alone is not enough for a buy call.
    notes: The scenario table keeps the recommendation anchored in evidence quality as much as in business quality.
