      - number: '4.3'
        title: Cost Structure and Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Apeel’s model likely sits between software and field-service economics, which makes gross-margin detail
              especially important. Growjo estimates Apeel has 473 employees and revenue per employee of roughly $217K.
              GetLatka instead says Apeel had 184 employees in November 2025. Tracxn shows 108 employees for one legal
              entity as of December 2024. Public headcount disagreement makes any externally computed
              revenue-per-employee metric unstable. Apeel’s model likely carries non-trivial service and implementation
              costs because it interfaces with suppliers, retailers, and QC workflows. Category-specific deployment,
              ripeness measurement, and supplier enablement all suggest labor and field-support intensity. The company’s
              port-strike response shows management was willing to absorb short-term service cost to protect partner
              relationships. AgFunder says Apeel went through layoffs, which may have been a response to cost pressure
              and changing go-to-market realities. The public file supports a business with real revenue but leaves
              sales efficiency almost entirely unobservable. CAC, payback period, and sales-cycle data are not disclosed
              publicly. Apeel’s customer mix probably spans retailers, suppliers, exporters, and possibly analytics
              buyers, which can blur revenue-recognition patterns. Apeel’s capital intensity is lower than building
              refrigerated infrastructure but higher than selling pure software. The company therefore sits in an
              awkward middle ground where gross margin path matters disproportionately for valuation. This combination
              of retained sources is enough to support a clear diligence view, but not enough to erase the unresolved
              gaps that matter for underwriting.
