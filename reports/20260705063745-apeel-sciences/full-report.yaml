      - number: '8.3'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              Recommendation quality hinges on the difference between a real business and a fully underwritable one. The
              most plausible recommendation from public data alone is research-more rather than buy or avoid. Confidence
              in any recommendation should stay medium because the business is clearly real but key underwriting inputs
              are private. Risk rating should be high because commercial trust, financial opacity, and concentration
              risk all remain unresolved. Valuation stance should be stretched rather than outright impossible because
              the base $2B marker already embeds substantial execution expectations. A revenue-multiple framework is
              more defensible than a DCF because public cash-flow and margin data are missing. Comparable references
              should include produce-preservation vendors, post-harvest incumbents, and workflow-adjacent quality
              systems rather than pure SaaS alone. Market-size reports support long-term category potential but do not
              by themselves justify a venture valuation step-up. Preference-stack and dilution risk are impossible to
              score without current financing documents. Exit readiness is constrained by the lack of public evidence on
              margins, governance detail, and dependable retention metrics. The final diligence asks should focus on cap
              table, runway, cohort retention, concentration, and crop-level payback. This combination of retained
              sources is enough to support a clear diligence view, but not enough to erase the unresolved gaps that
              matter for underwriting.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV017
              - CV018
              - CV019
              - CV027
              - CV028
              - CV029
          - type: table
            tableRef: TV004
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV033
              - CV034
              - CV036
              - CV037
      - number: '8.4'
        title: Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is clear and concentrated in a small number of high-value diligence asks. A
              thesis-break trigger would be evidence that the trust controversy materially reduces sell-through or
              account retention. A second thesis-break trigger would be management failing to corroborate later
              financing claims with primary evidence. A third thesis-break trigger would be discovering that services
              intensity structurally compresses gross margin. Apeel is investable enough to justify more diligence, but
              not transparent enough to justify price-taking behavior. The best public stance is to stay disciplined on
              entry valuation and demand primary evidence before underwriting any step-up from the Series E anchor. In
              public-data terms, Apeel looks like a research-more, high-risk, stretched-valuation case rather than an
              obvious avoid. The valuation verdict improves materially only if management can prove strong margins,
              durable retention, and a cleaner financing narrative than the public web shows. This combination of
              retained sources is enough to support a clear diligence view, but not enough to erase the unresolved gaps
              that matter for underwriting.
            claimRefs:
              - CV030
              - CV031
              - CV032
