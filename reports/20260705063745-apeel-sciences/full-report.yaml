    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Apeel’s valuation discussion only works if the market, customer, and product stories are tied back to
              underwriting discipline. Apeel’s public value proposition still supports a premium to generic packaging or
              commodity post-harvest vendors. The premium case depends on Apeel being more than a coating company and
              becoming part of customer workflow and data systems. Apeel’s customer and market evidence are real enough
              to reject a blanket avoid rating based solely on demand skepticism. Apeel’s trust shocks and disclosure
              gaps are also real enough to reject a strong-buy style stance. The strongest bull-side argument is that
              Apeel sits on a large waste-reduction problem with real retailer and supplier proof. The strongest
              anti-thesis is that public evidence still does not show margin quality, retention, or a clean post-2021
              valuation record. The company’s sustainability and market narrative raise strategic appeal, but they
              should not crowd out financial rigor. This combination of retained sources is enough to support a clear
