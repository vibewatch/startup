      - number: '1.3'
        title: Scale Metrics, Customers, and Impact Claims
        blocks:
          - type: paragraph
            body: >-
              The scale story is meaningful, but the KPI file is mixed between directly stated impact figures and
              inconsistent third-party operating metrics. Public revenue estimates are directionally positive but not
              fully consistent across third-party databases. Tracxn’s legal-entity view shows 108 employees as of
              December 2024 for one Apeel entity. GetLatka reports 184 employees in November 2025. Growjo estimates
              Apeel has 473 employees and negative employee growth. Headcount disclosure is materially conflicted across
              public databases and should not be treated as a single settled KPI. Apeel reports that since 2021 it has
              prevented 145.63M pieces of fruit from going to waste. Apeel reports conserving roughly 2.789B liters of
              water since 2021. Apeel reports avoiding about 273.4K metric tons of CO2-equivalent emissions since 2021.
              Apeel’s product-information page says Organipeel adds citric acid and baking soda to plant-based mono- and
              diglycerides. The company frames safety and purity as top priorities and says ingredients are food-grade
              and safe for human consumption. This combination of retained sources is enough to support a clear
              diligence view, but not enough to erase the unresolved gaps that matter for underwriting.
