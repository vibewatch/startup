      - number: '3.3'
        title: Distribution, Switching Costs, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Channel reach and workflow integration matter at least as much as material science. Apeel’s store-locator
              and retail pages imply stronger named-retailer visibility than many early-stage direct peers show
              publicly. Competitor websites generally do not post public pricing, which keeps direct price competition
              opaque. Switching costs are likely moderate because freshness tools sit inside operational workflows, QC
              specs, and vendor relationships. Multi-homing is plausible because customers can combine coatings with
              atmosphere, packaging, and analytics solutions. The status quo remains a real competitor because many
              produce programs can still rely on refrigeration, packaging, or faster turns. Apeel has better public
              retailer visibility than many startup peers, but that does not automatically guarantee lower churn or
              better margins. The competitive set extends to packaging and controlled-atmosphere solutions because
              customers buy outcomes, not categories. This combination of retained sources is enough to support a clear
              diligence view, but not enough to erase the unresolved gaps that matter for underwriting.
            claimRefs:
              - CP015
              - CP016
              - CP020
              - CP021
              - CP028
              - CP029
              - CP031
          - type: table
            tableRef: TP003
            claimRefs:
