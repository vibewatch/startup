      - number: '1.4'
        title: Milestones and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Apeel’s milestone trail includes product expansion, retailer and supplier enablement, and a visible
              misinformation backlash that now sits inside the company’s public narrative. Apeel offered free coating
              services during the 2024 East Coast port strike to protect suppliers facing spoilage delays. The Apeel
              Leverage initiative was launched to showcase operational and supply-chain benefits for fresh produce
              partners. AgFunder reports that Apeel navigated layoffs and an organized misinformation campaign while
              repositioning the business. Apeel’s leadership page explicitly says the company became a target of a
              coordinated online disinformation campaign. A legal complaint filed by Apeel against GreenSmoothieGirl
              shows the company escalated misinformation disputes into litigation. SalesTools AI claims Apeel raised a
              $250M Series F in 2025. The reported 2025 Series F is not corroborated by stronger public databases such
              as Tracxn or GetLatka, which still anchor Apeel around its 2021 Series E and $2B valuation marker. This
              combination of retained sources is enough to support a clear diligence view, but not enough to erase the
              unresolved gaps that matter for underwriting.
