chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Public Narrative
        blocks:
          - type: paragraph
            body: >-
              The public record on Apeel is strongest when it stays close to the company’s own product and mission
              language. Apeel Sciences was founded in 2012. Apeel Sciences is headquartered at 71 South Los Carneros
              Road in Goleta, California. Apeel describes its core mission as using food to protect food by reinforcing
              the natural peel of fresh produce. Apeel sells plant-derived coatings that aim to retain taste, juiciness,
              and nutrients for longer. TexAu places Apeel in Goleta, California and describes the company as a global
              retailer-network player. Apeel’s store-locator and retail-facing pages indicate distribution through
              retailers including Walmart, Costco, Kroger, Whole Foods, Trader Joe’s, Albertsons, and EDEKA. Apeel
              separately said it prevented more than 60M pieces of fruit from going to waste in 2023. Apeel’s
              product-information page says Edipeel is made of plant-based mono- and diglycerides. Apeel’s public
              identity combines produce shelf-life extension with retailer and supplier workflow improvement, not just
              an ingredient story. This combination of retained sources is enough to support a clear diligence view, but
              not enough to erase the unresolved gaps that matter for underwriting.
