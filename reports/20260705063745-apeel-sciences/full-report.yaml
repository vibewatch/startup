  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The first diligence step is deciding what market Apeel actually serves. Mordor Intelligence sizes the
              edible films and coatings for fruits and vegetables market at about $1.05B in 2026. Mordor forecasts that
              market to reach about $1.46B by 2031 at a 6.84% CAGR. The Business Research Company says the edible
              coatings for produce market reached about $1.12B in 2025. GII’s summary of the same TBRC market view
              describes edible coatings as thin consumable layers that reduce moisture loss, slow ripening, and preserve
              quality. Grand View Research estimates the broader edible films and coatings market at $2.81B in 2024 and
              $4.25B by 2030. MarkWide frames functional edible coatings as shaped by regulatory compliance, especially
              in Europe. The narrow market lens implies a ~$1B niche, while the broader edible-films lens implies a
              multi-billion-dollar adjacency. The public file preserves contradictory sizing lenses and should not be
              collapsed into one synthetic TAM number without caveats. Apeel’s market is not just post-harvest
              chemicals; it sits at the intersection of produce quality, supply-chain resilience, and sustainability
              reporting. This combination of retained sources is enough to support a clear diligence view, but not
              enough to erase the unresolved gaps that matter for underwriting.
