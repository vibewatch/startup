  - id: TV004
    title: Comparable valuation table
    columns:
      - Dimension
      - Assessment
      - Why
      - Implication
    rows:
      - - Recommendation
        - research-more
        - Real business, incomplete underwriting file
        - Do more work before taking price.
      - - Confidence
        - Medium
        - Good product/customer evidence, weak margin and financing clarity
        - Avoid overprecision.
      - - Risk rating
        - High
        - Trust, concentration, and opacity risks stack together
        - Demand downside protection or a better price.
      - - Valuation stance
        - Stretched
        - Even the best public anchor already prices in significant execution
        - Resist paying up without primary evidence.
    notes: >-
      The scorecard intentionally privileges evidence quality; the recommendation would improve only with primary
      financial and financing disclosure.
