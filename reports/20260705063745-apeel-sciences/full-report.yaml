  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Map and Type of Competition
        blocks:
          - type: paragraph
            body: >-
              Apeel’s competitive arena is broader than a few edible-coating startups. Hazel Technologies positions
              itself around shelf-life extension solutions for produce and floral categories. Sufresca markets natural
              edible coatings for produce. Mori describes its solution as a natural protective layer derived from silk
              protein. Ryp Labs commercializes StixFresh stickers that slow produce spoilage. Nabaco focuses on natural
              barrier technologies for harvests and packaging. RipeLocker competes from the controlled-atmosphere side
              of perishables preservation. GreenPod Labs is positioned around freshness packaging and active
              preservation. AgroFresh is a scaled incumbent in post-harvest produce quality extension. AgroSustain
              emphasizes nature-based pre- and post-harvest protection. The public file supports a crowded and
              multi-modal competitive field rather than a clean blue-ocean thesis. Competitor websites are themselves an
              adverse evidence source because they show that credible alternatives already exist across several product
              forms. This combination of retained sources is enough to support a clear diligence view, but not enough to
              erase the unresolved gaps that matter for underwriting.
