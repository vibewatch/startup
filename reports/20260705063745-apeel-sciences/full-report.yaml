            body: >-
              Apeel’s financial file starts with credible topline signals, even though the company does not publicly
              publish detailed statements. GetLatka reports Apeel reached $150M of revenue in 2024. GetLatka reports
              Apeel previously generated $102.6M of revenue in 2022. A simple comparison of those two GetLatka markers
              implies substantial growth over the 2022-2024 period. Growjo estimates current annual revenue at about
              $102.6M, showing that public revenue databases still disagree on the base. The retained public file is
              directionally supportive on revenue growth but not precise enough to treat every number as audited.
              Apeel’s revenue model appears B2B and workflow-linked rather than consumer-subscription based.
              Supplier-facing messaging implies revenue should scale with produce throughput, distribution footprint, or
              coated-volume economics. Retail-facing messaging implies additional value capture through sell-through,
              shrink reduction, and category-performance improvement. RipeTrack implies a possible software or analytics
              upsell layered on top of the coating business. The public file supports a revenue-bearing but
              disclosure-constrained business rather than a pre-revenue science project. This combination of retained
              sources is enough to support a clear diligence view, but not enough to erase the unresolved gaps that
