      - number: '2.2'
        title: Buyers, Users, and Workflow Entry Point
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to a workflow sale rather than a consumer packaged-goods sale. Apeel’s category
              tailwind is anchored in spoilage reduction rather than consumer packaged-goods branding. The buyer is
              often an operator in the fresh-produce supply chain rather than an end consumer. The user can be a
              retailer produce team, a supplier, a packhouse operator, or a quality-control team. The payer is likely to
              be the retailer, supplier, or exporter who captures the shrink and sell-through economics. Apeel’s
              retail-facing pages show the company is selling a performance-based ROI narrative rather than only a
              sustainability narrative. Apeel’s supplier-facing pages emphasize distribution-footprint expansion and
              low-touch integration. The company’s Develop page cites a German household study of more than 7,500
              mandarins and more than 190 households. That same Develop page reports 15% fewer Apeel-protected mandarins
              wasted at home in the cited study. Port-strike coverage shows that supply-chain disruption can temporarily
              increase the value of shelf-life extension services. Apeel’s RipeTrack product suggests the addressable
              market extends beyond coatings into produce analytics and ripeness management. This combination of
              retained sources is enough to support a clear diligence view, but not enough to erase the unresolved gaps
              that matter for underwriting.
