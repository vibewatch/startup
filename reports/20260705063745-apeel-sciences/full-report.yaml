      - number: '2.3'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Apeel benefits from genuine food-waste and sustainability tailwinds, but buyers still need a clear
              operational payback story. FAO describes its food-loss and food-waste database as the largest online
              collection of food-loss and waste data. ReFED says 29% of the 240M tons in the U.S. food supply went
              unsold or uneaten in 2024. Apeel’s impact narrative depends on water, carbon, and food-waste savings being
              valued by retailers and suppliers. The market opportunity is larger when the lens includes analytics and
              category management rather than only surface coatings. Operational integration at packhouses and retail
              distribution centers is a meaningful adoption constraint. Consumer trust and misinformation are adoption
              constraints because the product directly touches fresh produce. Organic treatment, labeling, and safety
              interpretation are also adoption constraints in some channels. Food-waste intensity provides the macro
              rationale for the category, but willingness to pay depends on crop-level payback and operational
              complexity. Public diligence still lacks directly disclosed pricing, gross-margin economics, and attach
              rates by crop or retailer cohort. This combination of retained sources is enough to support a clear
              diligence view, but not enough to erase the unresolved gaps that matter for underwriting.
            claimRefs:
              - CM007
              - CM008
              - CM019
              - CM022
              - CM023
              - CM024
