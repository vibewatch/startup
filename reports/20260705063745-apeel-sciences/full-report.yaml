      - number: '3.2'
        title: Differentiation, Scope, and Selection Criteria
        blocks:
          - type: paragraph
            body: >-
              The core diligence question is not whether alternatives exist; it is whether Apeel is meaningfully harder
              to replace inside a produce workflow. Apeel’s plant-derived coatings compete most directly with Sufresca
              and Mori on the edible-layer narrative. Apeel competes with Ryp Labs and RipeLocker more on category
              economics than on identical product form factor. AgroFresh represents incumbent channel and relationship
              power in post-harvest operations. Apeel’s differentiation claim is strongest where customers value a
              coating plus operational and data layer rather than a single preservation accessory. RipeTrack broadens
              Apeel’s product scope beyond the coating itself. Incumbents can pressure Apeel through bundled
              relationships and scale in post-harvest operations. Retailers may prefer category-level outcome proof over
              the technical purity of any one freshness modality. Apeel’s Leverage initiative suggests the company knows
              it must sell broader supply-chain improvement, not only a coating ingredient. Apeel’s product categories,
              regulatory messaging, and analytics tools suggest a wider product scope than a single-SKU coating startup.
              This combination of retained sources is enough to support a clear diligence view, but not enough to erase
              the unresolved gaps that matter for underwriting.
