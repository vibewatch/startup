companyProfile:
  summary: >-
    Apeel Sciences is a late-stage private food-technology company built around plant-derived edible coatings that
    extend the shelf life of fresh produce. Its public narrative has expanded from a single coating technology into a
    broader retailer-and-supplier workflow story that includes quality control, ripeness analytics, and sustainability
    reporting. Public evidence supports real commercial adoption and measurable food-waste impact, but financial,
    governance, and financing disclosure remain materially incomplete.
