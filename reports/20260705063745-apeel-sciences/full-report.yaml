      - number: '8.2'
        title: Anchor Valuation and Scenario Ranges
        blocks:
          - type: paragraph
            body: >-
              The most defensible public anchor remains the 2021 Series E marker. The cleanest public valuation anchor
              is Tracxn’s $2B post-money mark for Apeel’s 2021 Series E. GetLatka’s $150M 2024 revenue marker is the
              strongest recent public revenue input for valuation work. That combination implies a revenue multiple
              above 13x on the best-supported public numbers. A rumored $4.2B valuation would imply a near-28x revenue
              multiple on the same $150M revenue base. That higher implied multiple is difficult to defend from public
              evidence alone. A bull case would assume repeatable 20%+ growth, acceptable margins, and successful upsell
              into analytics and supply-chain services. A base case would assume continued adoption with moderate growth
              but persistent opacity on margins and concentration. A bear case would assume growth stalls because
              misinformation, channel friction, or operational burden erode deployment quality. If one applied a 8x to
              12x multiple to the $150M revenue marker, the implied enterprise-value range would be roughly $1.2B to
              $1.8B. If one applied a 13x to 16x multiple, the range would be about $1.95B to $2.4B. A public-data case
              above $3B would require confidence in growth durability and margin quality that the retained source set
              does not provide. The $2B anchor therefore looks closer to fair-to-stretched than obviously attractive.
              The rumored $4.2B case looks expensive on public data alone. This combination of retained sources is
              enough to support a clear diligence view, but not enough to erase the unresolved gaps that matter for
              underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
