  - id: TU004
    title: Durability and Concentration Gaps
    columns:
      - Unknown
      - Why it matters
      - Public clue
      - Next diligence ask
    rows:
      - - NRR / GRR / churn
        - Core durability metric
        - Not publicly disclosed
        - Request cohort retention and renewal rates.
      - - Customer concentration
        - Large retailers can dominate outcomes
        - Named logos exist but mix is private
        - Request top-customer and top-channel exposure.
      - - Contract length
        - Renewal timing shapes risk
        - No public contract data
        - Request standard terms and renewal cadence.
      - - Expansion rates
        - Land-and-expand quality matters
        - Leverage and analytics suggest upsell path
        - Request attach rates into new categories and tools.
    notes: >-
      The missing customer metrics are exactly the ones that differentiate a sticky category platform from a useful but
      replaceable vendor.
