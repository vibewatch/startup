  - id: TI004
    title: Financial Diligence Blockers
    columns:
      - Missing input
      - Why public file is weak
      - Underwriting risk
      - Next ask
    rows:
      - - Gross margin
        - No public disclosure
        - Cannot test operating leverage
        - Request cohort margin by crop and channel.
      - - Burn / runway
        - No public cash data
        - Cannot judge next-round dependency
        - Request monthly burn and cash-on-hand.
      - - Customer concentration
        - Named logos exist but revenue mix does not
        - Concentration could dominate outcomes
        - Request top-10 customer revenue share.
      - - Sales efficiency
        - No CAC or payback data
        - Go-to-market scalability is opaque
        - Request funnel, payback, and cycle data.
    notes: These blockers are structural and prevent a strong buy-style financial conclusion from public data alone.
