chapter:
  number: 4
  title: Financials
  summary: >-
    Apeel’s public financial file is usable but incomplete: several third-party databases now converge on a roughly
    $150M 2024 revenue marker, while detailed margin, burn, and cash figures remain private. The best-supported capital
    record still points to a 2021 $250M Series E and roughly $640M lifetime funding, leaving valuation quality and
    capital efficiency highly sensitive to assumptions about customer concentration, gross margin, and post-layoff cost
    structure.
sections:
  - id: revenue-model-and-traction
    title: Revenue Model and Public Traction
    body: >-
      Apeel’s financial file starts with credible topline signals, even though the company does not publicly publish
      detailed statements. GetLatka reports Apeel reached $150M of revenue in 2024. GetLatka reports Apeel previously
      generated $102.6M of revenue in 2022. A simple comparison of those two GetLatka markers implies substantial growth
      over the 2022-2024 period. Growjo estimates current annual revenue at about $102.6M, showing that public revenue
      databases still disagree on the base. The retained public file is directionally supportive on revenue growth but
      not precise enough to treat every number as audited. Apeel’s revenue model appears B2B and workflow-linked rather
      than consumer-subscription based. Supplier-facing messaging implies revenue should scale with produce throughput,
      distribution footprint, or coated-volume economics. Retail-facing messaging implies additional value capture
      through sell-through, shrink reduction, and category-performance improvement. RipeTrack implies a possible
      software or analytics upsell layered on top of the coating business. The public file supports a revenue-bearing
      but disclosure-constrained business rather than a pre-revenue science project. This combination of retained
      sources is enough to support a clear diligence view, but not enough to erase the unresolved gaps that matter for
      underwriting.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI015
      - CI016
      - CI017
      - CI018
      - CI036
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: capital-base-and-valuation-context
    title: Capital Base and Valuation Context
    body: >-
      Capitalization is visible enough to frame underwriting, but not enough to settle the latest valuation. Tracxn says
      Apeel has raised about $640M across nine funding rounds. GetLatka reports $610.2M of total funding across seven
      rounds, indicating public round-count disagreement. Tracxn’s latest detailed round is a $250M Series E in August
      2021 at a $2B valuation. SalesTools publishes a low-confidence claim that Apeel raised a $250M Series F in 2025.
      Because the Series F claim lacks strong corroboration, underwriting should anchor on the better-documented Series
      E until management proves otherwise. A 2021 $2B valuation against a 2024 $150M revenue marker implies a trailing
      multiple above 13x. A rumored $4.2B valuation would imply a much more aggressive revenue multiple near 28x on the
      same $150M revenue base. That spread is why funding-quality evidence matters more than topline round headlines.
      This combination of retained sources is enough to support a clear diligence view, but not enough to erase the
      unresolved gaps that matter for underwriting.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI030
      - CI031
      - CI032
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: cost-structure-and-efficiency
    title: Cost Structure and Efficiency Proxies
    body: >-
      Apeel’s model likely sits between software and field-service economics, which makes gross-margin detail especially
      important. Growjo estimates Apeel has 473 employees and revenue per employee of roughly $217K. GetLatka instead
      says Apeel had 184 employees in November 2025. Tracxn shows 108 employees for one legal entity as of December
      2024. Public headcount disagreement makes any externally computed revenue-per-employee metric unstable. Apeel’s
      model likely carries non-trivial service and implementation costs because it interfaces with suppliers, retailers,
      and QC workflows. Category-specific deployment, ripeness measurement, and supplier enablement all suggest labor
      and field-support intensity. The company’s port-strike response shows management was willing to absorb short-term
      service cost to protect partner relationships. AgFunder says Apeel went through layoffs, which may have been a
      response to cost pressure and changing go-to-market realities. The public file supports a business with real
      revenue but leaves sales efficiency almost entirely unobservable. CAC, payback period, and sales-cycle data are
      not disclosed publicly. Apeel’s customer mix probably spans retailers, suppliers, exporters, and possibly
      analytics buyers, which can blur revenue-recognition patterns. Apeel’s capital intensity is lower than building
      refrigerated infrastructure but higher than selling pure software. The company therefore sits in an awkward middle
      ground where gross margin path matters disproportionately for valuation. This combination of retained sources is
      enough to support a clear diligence view, but not enough to erase the unresolved gaps that matter for
      underwriting.
    claimRefs:
      - CI011
      - CI012
      - CI014
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
    tableRefs:
      - TI004
    figureRefs: []
  - id: financial-verdict-and-blockers
    title: Financial Verdict and Diligence Blockers
    body: >-
      The retained file is enough to reject a pre-revenue framing, but not enough to clear a clean late-stage
      underwriting memo. Public sources do not disclose gross margin, contribution margin, or net revenue retention.
      Public sources also do not disclose cash on hand, burn rate, or runway. Apeel’s public financial story is
      investable enough to merit diligence but not transparent enough to underwrite cleanly. Margin path,
      working-capital needs, and customer concentration are the three biggest missing financial inputs. Any next-round
      dependency judgment requires management disclosure because neither runway nor debt obligations are public. Food &
      Wine recognition and supply-chain partnerships help narrative quality, but they are not substitutes for hard unit
      economics. This combination of retained sources is enough to support a clear diligence view, but not enough to
      erase the unresolved gaps that matter for underwriting.
    claimRefs:
      - CI019
      - CI020
      - CI033
      - CI034
      - CI035
      - CI037
    tableRefs: []
    figureRefs:
      - FI003
      - FI004
      - FI005
