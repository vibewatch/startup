  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: margin
      missingEvidence: Gross margin and contribution margin by crop or customer channel.
      whyItMatters: Late-stage valuation without margin shape is underwriting theater rather than analysis.
      diligencePath: Request gross-margin bridge, services burden, and cohort contribution margins.
      relatedQuestionRefs:
        - QI023
    - type: private-evidence-only
      severity: blocking
      topic: runway
      missingEvidence: Cash on hand, monthly burn, and debt or structured-finance obligations.
      whyItMatters: Capital adequacy cannot be assessed from public coverage alone.
      diligencePath: Request treasury snapshot, cash burn, and financing-covenant detail.
      relatedQuestionRefs:
        - QI024
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: Management-confirmed staffing baseline with explanation of database variance.
      whyItMatters: Efficiency metrics swing sharply depending on which headcount source one believes.
      diligencePath: Request actual FTE counts by quarter and a layoff chronology.
      relatedQuestionRefs:
        - QI025

