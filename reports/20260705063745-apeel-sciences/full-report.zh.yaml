    sections:
      - number: '1.1'
        title: 身份、使命与公开叙事
        blocks:
          - type: paragraph
            body: >-
              Apeel 的公开记录最有力的部分，都贴近公司自己的产品和使命表述。Apeel Sciences 创立于 2012 年。 Apeel Sciences 总部位于加利福尼亚州 Goleta 的 71 South
              Los Carneros Road。Apeel 将核心使命描述为 “用食物保护食物”，做法是强化新鲜果蔬的天然表皮。Apeel 销售植物来源涂层，目标是让风味、多汁度和营养保持更久。 TexAu 将 Apeel
              定位在加州 Goleta，并称其为一家拥有全球零售商网络的公司。Apeel 的门店定位器和面向零售的页面显示， 其渠道覆盖 Walmart、Costco、Kroger、Whole Foods、Trader
              Joe’s、Albertsons 和 EDEKA 等零售商。 Apeel 另称，其在 2023 年避免超过 60M 个水果被浪费。Apeel 的产品信息页称 Edipeel 由植物基单、双甘油酯制成。 Apeel
              的公开身份不是单纯的原料故事，而是把果蔬货架期延长，与零售商和供应商工作流改善绑在一起。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
