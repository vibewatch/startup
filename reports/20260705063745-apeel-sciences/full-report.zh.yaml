              公开材料支持 Apeel 是真实产品栈，而不是一页可食用涂层说明。Apeel 的涂层旨在强化水果和蔬菜的天然表皮。 产品页面信息强调，面向多个果蔬品类提供植物基保护。Apeel 面向常规果蔬的涂层 Edipeel
              被描述为植物基单、双甘油酯。 Apeel 面向有机果蔬的涂层 Organipeel 被描述为柠檬酸、小苏打和植物基单、双甘油酯。RipeTrack 是一款数字成熟度管理产品，
              可采集量化质量数据。RipeTrack 定位为入库和出库 QC、问责和品类表现的系统。当前产品架构除了涂层本身，还包括品类分析、 QC 工具和透明度内容。RipeTrack 还把 Apeel
              路线图从保鲜果蔬，扩展到监测质量并围绕成熟度训练决策。 公开证据支持的产品栈，比化学品公司更宽，但比完整企业软件平台更窄。本次留存来源足以支撑清晰的尽调判断， 但还不足以抹平影响投资判断的未解缺口。
