      - number: '4.2'
        title: 资本基础与估值背景
        blocks:
          - type: paragraph
            body: >-
              资本化足以框定投资判断，但不足以坐实最新估值。Tracxn 称 Apeel 在九轮融资中累计募资约 $640M。GetLatka 报告七轮总融资 $610.2M，说明公开轮次数存在分歧。Tracxn
              最新详细轮次是 2021 年 8 月以 $2B 估值完成的 $250M Series E 轮。 SalesTools 发布了可信度较低的说法，称 Apeel 在 2025 年完成 $250M Series F
              融资。由于 Series F 说法缺少强佐证， 管理层证明前，投资判断应锚定记录更好的 Series E。2021 年 $2B 估值相对于 2024 年 $150M 收入标记，意味着基于历史收入的倍数超过
              13x。传闻中的 $4.2B 估值，基于同一 $150M 收入基数，将意味着接近 28x 的激进收入倍数。这个差距说明，
              融资质量证据比表层融资轮次标题更重要。本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
