      - number: '6.3'
        title: 留存、扩张与耐久性
        blocks:
          - type: paragraph
            body: >-
              扩张逻辑可见，但留存数学不可见。公开材料不披露活跃客户数。公开材料也不披露 NRR、GRR 或流失率。 公司客户表面跨越地理区域，因为 EDEKA
              和柏林贸易展内容表明，除美国零售商外，欧洲也有相关性。供应商和零售页面暗示从一个品类或路线起步， 再扩展到更广部署的“先落地、再扩张”路径。RipeTrack 为现有涂层客户提供了进入分析的潜在扩张向量。
              公司公开证明大多是生产相邻或商业营销质量，而不是合同层面的推荐信。虚假信息可能造成获客或扩张摩擦，因为零售商对购物者顾虑敏感。 Apeel 的应对是投入透明度、标签和公开事实核查内容。Food & Wine
              这类认可有助消费者叙事，但不是直接留存证据。 最大的客户尽调缺口不是客户是否存在，而是部署能否可预测地续约并扩大。向分析和供应链服务扩张，如果能加深工作流集成，可能提高耐久性。
              本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
