  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概要
        blocks:
          - type: paragraph
            body: >-
              Apeel 的风险异常可见，因为公司不得不公开回应这些风险。Apeel 的 FAQ 页面高度围绕虚假信息、纠正、撤回和诉讼引用。 Apeel 发布了与 Robyn Openshaw 和
              GreenSmoothieGirl.com 相关的诉讼解决页面。AgFunder 报告称，Apeel 面临裁员和有组织的虚假信息行动。 Apeel
              首页现在直接回应在线虚假信息，并称公司因挑战现状而成为目标。Apeel 维护多个关于 FDA 安全性和不准确社交媒体说法的事实核查页面。 标签透明度是 Apeel
              公开沟通中的明确风险缓释策略。由于产品直接接触食物，声誉攻击比在企业软件中更快外溢到客户和零售商行为。 Apeel 风险画像偏高，因为相对于估值叙事，商业信任和披露质量都很脆弱。简言之，Apeel
              最大的风险并不隐藏； 它们可见于公司自己的网站架构和外部报道。留存来源集合支持较高剩余暴露评级，尽管缓释动作可见。本次留存来源足以支撑清晰的尽调判断， 但还不足以抹平影响投资判断的未解缺口。
