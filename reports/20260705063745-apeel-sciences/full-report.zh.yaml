      - number: '3.3'
        title: 分销、转换成本与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              渠道触达和工作流集成至少与材料科学同样重要。Apeel 的门店定位器和零售页面暗示，其公开可见的知名零售商覆盖强于许多早期直接同行。
              竞争对手网站通常不公布公开定价，因此直接价格竞争仍不透明。转换成本可能中等，因为保鲜工具嵌在运营工作流、QC 规格和供应商关系中。
              多供应商并用是可能的，因为客户可以组合涂层、气调、包装和分析解决方案。现状本身仍是真实竞争对手，因为许多果蔬项目仍可依靠冷藏、包装或更快周转。 Apeel
              的公开零售商能见度好于许多初创同行，但这不自动保证更低流失或更好利润率。竞争集合延伸到包装和气调解决方案，因为客户买的是结果，不是品类。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
