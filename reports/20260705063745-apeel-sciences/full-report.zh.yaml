      - number: '7.2'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管材料并非灾难性，但它们位于信任问题的中心。针对 GreenSmoothieGirl 的法院诉状显示，公司把虚假信息视为法律问题， 而不只是 PR 问题。Apeel
              的隐私政策围绕网站和合作伙伴数据处理形成数据治理风险面。伦理和企业合规页面显示公司关注治理， 但不能替代完整的董事会或政策披露。Apeel
              的监管定位有助缓释安全风险，但监管解读仍是品类信任的核心。有机和标签争议即使在成分获准时，
              也会造成市场准入摩擦。公司对董事会构成、股权结构和详细财务控制的公开披露仍有限。最强的公开缓释信号是监管信息、透明度内容和主动法律防御。
              留存来源集合中的公开风险材料尚未显示召回或食品安全执法行动。这个缺席有帮助，但不等于证明系统在所有市场条件下都是低风险。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
