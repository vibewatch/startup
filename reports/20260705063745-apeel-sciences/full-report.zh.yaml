              留存材料足以否定“无收入”叙事，但不足以清除一份干净后期投资备忘录所需的疑点。公开来源不披露毛利率、贡献利润率或净收入留存。 公开来源也不披露现金余额、烧钱速度或现金跑道。Apeel
