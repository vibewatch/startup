      - number: '6.4'
        title: 集中度风险与客户结论
        blocks:
          - type: paragraph
            body: >-
              大型客户标识可见度有利于可信度，但可能掩盖集中度风险。因此，Apeel 的客户证明看起来真实，但仍经过筛选。集中度风险可能有意义，
              因为少数大型零售商能不成比例地影响品类经济性。供应商依赖也有意义，因为涂层采用必须嵌入生鲜果蔬链上游。 零售商证明和供应商证明并不保证这两类渠道之间的收入组合均衡。Apeel
              的客户故事在品类价值和零售商存在上强于硬性的合同耐久指标。 柏林 Fruit Logistica 参展说明公司仍在投入国际渠道开发。因此，Apeel 看起来确有商业落地，但外部无法按客户队列层面衡量。
              客户群似乎按工作流多元化，但按大型零售商或供应商的集中度仍可能很高。没有客户队列指标，投资人必须依靠间接证明和管理层尽调来判断耐久性。 Apeel
              的客户材料含有真实证明，但证据标准仍低于后期投资人理想上用于续约分析的水平。本次留存来源足以支撑清晰的尽调判断， 但还不足以抹平影响投资判断的未解缺口。
