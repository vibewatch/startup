  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              第一步尽调要先判断 Apeel 实际服务哪个市场。Mordor Intelligence 估计，水果和蔬菜可食用薄膜及涂层市场在 2026 年约 $1.05B。 Mordor 预测该市场到 2031 年达到约
              $1.46B，CAGR 为 6.84%。The Business Research Company 称果蔬可食用涂层市场在 2025 年达到约 $1.12B。GII 对同一 TBRC
              市场观点的摘要，将可食用涂层描述为可食用薄层，可减少水分流失、放慢成熟并保持品质。 Grand View Research 估计，更广义的可食用薄膜和涂层市场 2024 年为 $2.81B，到 2030 年为
              $4.25B。MarkWide 将功能性可食用涂层描述为受监管合规塑造，欧洲尤其如此。窄口径市场视角指向约 $1B 的细分市场；更宽的可食用薄膜视角则指向数十亿美元相邻市场。
              公开材料保留了互相矛盾的规模测算视角，不能在没有限定条件的情况下合成一个 TAM 数字。Apeel 的市场不只是采后化学品；
              它落在果蔬品质、供应链韧性和可持续性报告的交叉点。本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
