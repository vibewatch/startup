      - number: '8.2'
        title: 锚定估值与情景区间
        blocks:
          - type: paragraph
            body: >-
              最可防守的公开锚点仍是 2021 年 Series E 标记。最干净的公开估值锚点是 Tracxn 对 Apeel 2021 年 Series E 给出的 $2B 投后估值。GetLatka 的 2024 年
              $150M 收入标记，是估值工作中最强的近期公开收入输入。该组合基于最有支撑的公开数字， 意味着收入倍数高于 13x。传闻中的 $4.2B 估值，基于同一 $150M 收入基数，将意味着接近 28x 的收入倍数。
              仅靠公开证据很难支撑这个更高隐含倍数。多头情景会假设可重复的 20%+ 增长、可接受利润率，以及成功向分析和供应链服务追加销售。
              基准情景会假设持续采用和中等增长，但毛利与集中度仍不透明。熊市情景会假设增长停滞，因为虚假信息、渠道摩擦或运营负担侵蚀部署质量。 若对 $150M 收入标记套用 8x 到 12x 倍数，隐含企业价值区间约为
              $1.2B 到 $1.8B。若套用 13x 到 16x 倍数， 区间约为 $1.95B 到 $2.4B。高于 $3B 的公开数据情景需要对增长耐久性和毛利质量有信心，而留存来源集合并不提供这种信心。 因此，$2B
              锚点看起来更接近公允到偏高，而不是显然有吸引力。传闻中的 $4.2B 情景仅凭公开数据看偏贵。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
