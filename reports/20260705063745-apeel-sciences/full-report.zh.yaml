      - number: '3.2'
        title: 差异化、范围与选择标准
        blocks:
          - type: paragraph
            body: >-
              核心尽调问题不是有没有替代方案，而是 Apeel 在果蔬工作流里是否明显更难被替换。Apeel 的植物来源涂层，在可食用层叙事上最直接对标 Sufresca 和 Mori。Apeel 与 Ryp
              Labs、RipeLocker 的竞争更多围绕品类经济性，而不是完全相同的产品形态。 AgroFresh 代表采后运营中的在位渠道和关系力量。客户若看重“涂层 + 运营和数据层”，而不是单一保鲜配件，Apeel
              的差异化主张最强。 RipeTrack 将 Apeel 的产品范围扩展到涂层之外。在位者可以凭采后运营中的打包关系和规模压迫 Apeel。零售商可能更偏好品类层面的结果证明，
              而不是某一种保鲜方式的技术纯度。Apeel Leverage 计划显示，公司知道自己必须销售更宽的供应链改善，而不只是涂层成分。 Apeel 的产品品类、监管表述和分析工具显示，其产品范围比单 SKU
              涂层初创公司更宽。本次留存来源足以支撑清晰的尽调判断， 但还不足以抹平影响投资判断的未解缺口。
