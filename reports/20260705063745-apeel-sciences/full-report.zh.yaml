      - number: '2.2'
        title: 买方、用户与工作流切入点
        blocks:
          - type: paragraph
            body: >-
              留存来源指向工作流销售，而不是包装消费品销售。Apeel 的品类顺风来自减少腐损，而不是 CPG 品牌化。买方通常是新鲜果蔬供应链中的运营方，
              而不是终端消费者。用户可以是零售商果蔬团队、供应商、分选包装厂运营人员或质控团队。付款方很可能是能拿到损耗降低和动销经济收益的零售商、 供应商或出口商。Apeel 面向零售的页面显示，公司销售的是基于绩效的
              ROI 叙事，而不只是可持续叙事。Apeel 面向供应商的页面强调分销覆盖扩张和低接触集成。 公司 Develop 页面引用了一项德国住户研究，覆盖超过 7,500 个蜜橘和超过 190 个家庭。同一
              Develop 页面报告称，该研究中受 Apeel 保护的蜜橘在家庭端浪费减少 15%。港口罢工报道显示，供应链扰动会临时提高货架期延长服务的价值。Apeel 的 RipeTrack 产品显示，
              可服务市场从涂层延伸到果蔬分析和成熟度管理。本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
