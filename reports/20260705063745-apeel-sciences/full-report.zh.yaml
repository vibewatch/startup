      - number: '8.4'
        title: 尽调追问与投资论点推翻触发点
        blocks:
          - type: paragraph
            body: >-
              剩余工作很清楚，集中在少数高价值尽调追问上。若有证据显示信任争议实质性压低终端售出率或账户留存，投资论点就应被推翻。第二个触发点，是管理层无法用一手证据核验后续融资说法。第三个触发点，是发现服务投入强度会结构性压低毛利率。Apeel
              足够值得继续尽调，但透明度不足，不能按对方价格照单全收。公开资料能支持的最佳立场，是严守入场估值纪律；任何相对 Series E 锚点的上调，都必须先拿到一手证据。仅看公开数据，Apeel
              更像一个继续研究、高风险、估值偏高的案子，而不是显然应回避。只有管理层证明毛利强、留存稳，并给出比公开网页资料更干净的融资叙事，估值判断才会明显改善。现有来源足以支撑清晰的尽调观点，但不足以抹平投资判断最在意的未解缺口。
