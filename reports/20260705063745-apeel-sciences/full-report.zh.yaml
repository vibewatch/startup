companyProfile:
  summary: >-
    Apeel Sciences 是一家后期私有食品科技公司，核心是植物来源可食用涂层，用来延长新鲜果蔬货架期。 它的公开叙事已经从单一涂层技术，扩展成面向零售商和供应商的工作流故事，涵盖质控、成熟度分析和可持续性报告。
    公开证据支持其商业化落地真实、食品浪费减量可衡量，但财务、治理和融资披露仍明显不完整。
