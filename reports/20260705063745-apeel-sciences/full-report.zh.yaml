      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Apeel 受益于真实的食品浪费和可持续性顺风，但买方仍需要清楚的运营回报故事。FAO 称其食物损失和浪费数据库是最大的线上食物损失与浪费数据集合。 ReFED 称 2024 年美国食品供应中的 240M
              吨里，有 29% 未售出或未被食用。Apeel 的影响叙事依赖零售商和供应商看重节水、
              减碳和减少食物浪费。若视角纳入分析和品类管理，而不只是表面涂层，市场机会会更大。分选包装厂和零售配送中心的运营集成是重要采用约束。
              消费者信任和虚假信息也是采用约束，因为产品直接接触新鲜果蔬。有机处理、标签和安全解读在一些渠道同样构成采用约束。
              食物浪费强度为该品类提供宏观理由，但支付意愿取决于具体作物的回报和运营复杂度。公开尽调仍缺少直接披露的定价、毛利经济性，
              以及按作物或零售商客户队列的附加率。本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
