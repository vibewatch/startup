            body: >-
              Apeel 的财务材料从可信的收入顶线信号开始，尽管公司没有公开发布详细报表。GetLatka 报告 Apeel 2024 年收入达到 $150M。 GetLatka 报告 Apeel 2022 年曾产生
              $102.6M 收入。简单对比这两个 GetLatka 标记，意味着 2022–2024 年期间增长可观。 Growjo 估计当前年收入约
              $102.6M，说明公开收入数据库仍对基数有分歧。留存公开材料对收入增长方向支持正面，但还不精确， 不能把每个数字都当成已审计。Apeel 的收入模式看起来是 B2B
              且与工作流挂钩，而不是消费订阅。面向供应商的信息暗示， 收入应随果蔬吞吐量、分销覆盖或涂覆体量经济性扩张。面向零售的信息暗示，公司可通过动销、损耗降低和品类表现改善获取更多价值。 RipeTrack
              暗示，涂层业务之上可能叠加软件或分析追加销售。公开材料支持 Apeel 是有收入但披露受限的业务，而不是无收入科研项目。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
