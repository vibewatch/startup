      - number: '6.2'
        title: 采用证据与使用场景
        blocks:
          - type: paragraph
            body: >-
              采用证据来自品类材料、零售商能见度和供应商支持行为。reliable-ripe-avocado 和 avocado-testing 页面显示牛油果中有品类特定客户证明。 Develop
              页面的蜜橘研究提供了另一个作物特定证明点。Apeel 的 Leverage 计划旨在展示客户在供应链表现、市场触达和零售表现上的结果。 港口罢工报道显示，Apeel
              主动支持面临物流扰动腐损风险的供应商客户。围绕牛油果和 Food & Wine 认可的新闻中心报道， 说明公司持续努力打造对购物者友好的品类证明。Apeel
              的零售商证明，在客户标识和可得性能见度上强于精确账户数量。 由于客户指标私有，公开采用情况必须从具名证明、品类材料和供应商支持行为推断。Apeel
              的品类契合度似乎在腐损、成熟度和补货给买方造成显性经济痛点的地方最强。 公开材料支持其客户相关性覆盖牛油果、蜜橘、黄瓜和更宽果蔬品类。Apeel
              最好的公开客户证明是运营性的：门店、品类、供应商服务和品类特定工具。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
