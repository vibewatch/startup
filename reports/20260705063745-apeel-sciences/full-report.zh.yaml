  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局地图与竞争类型
        blocks:
          - type: paragraph
            body: >-
              Apeel 的竞争场域比几个可食用涂层初创公司更宽。Hazel Technologies 将自己定位为面向果蔬和花卉品类的货架期延长解决方案。 Sufresca 销售用于果蔬的天然可食用涂层。Mori
              将其方案描述为源自丝蛋白的天然保护层。Ryp Labs 商业化了减缓果蔬腐损的 StixFresh 贴纸。Nabaco 聚焦用于收获物和包装的天然屏障技术。RipeLocker
              从易腐品气调保鲜侧切入。GreenPod Labs 定位于保鲜包装和主动保鲜。AgroFresh 是采后果蔬品质延长领域的规模化在位者。AgroSustain 强调基于自然的采前和采后保护。
              公开材料支持的是拥挤且多模态的竞争场，而不是干净的蓝海命题。竞争对手网站本身也是反向证据，因为它们显示几种产品形态中已经存在可信替代品。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
