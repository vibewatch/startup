      - number: '7.3'
        title: 运营与商业风险
        blocks:
          - type: paragraph
            body: >-
              运营执行风险来自新鲜果蔬复杂度、集中度和现场支持负担。公开人数分歧和裁员报道提高了执行与士气风险。Apeel 的供应链集成造成对供应商、
              零售商和质控执行的运营依赖。港口罢工支持报道显示，公司暴露于新鲜果蔬链的物流扰动。客户集中度风险可能高，
              因为具名大型零售商和供应商工作流对故事很重要。竞争风险真实存在，因为替代保鲜方法和涂层已经存在。财务模型风险仍然较高， 因为公开材料没有披露烧钱速度、现金跑道和毛利数据。传闻中的 2025 年 Series F
              如果弱于叙事报道，可能造成融资预期风险。 Apeel 的信任负担持续到管理层现在把公开页面位置拿来放反驳内容。公司的透明度回应是一种缓释，也证明风险已经具备商业相关性。 因此，Apeel
              的风险栈是跨职能的：法律、商业、监管和运营风险互相强化。本次留存来源足以支撑清晰的尽调判断， 但还不足以抹平影响投资判断的未解缺口。
