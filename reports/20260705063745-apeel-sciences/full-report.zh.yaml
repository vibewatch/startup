      - number: '8.3'
        title: 建议、信心与风险评级
        blocks:
          - type: paragraph
            body: >-
              推荐结论的质量，取决于 Apeel
              到底只是一门真实生意，还是足以让投资人完整承销的生意。仅看公开资料，最稳妥的建议是继续研究，而不是买入或回避。任何建议的置信度都应维持中等：业务显然真实，但关键投资判断输入仍不公开。风险评级应为高，因为商业信任、财务不透明和集中度风险都没有解开。估值立场应是偏高，而不是完全不可能，因为
              $2B 的基准已经嵌入大量执行预期。公开现金流和利润率数据缺失，收入倍数框架比 DCF 更站得住。可比参照应包括农产品保鲜供应商、采后处理既有厂商，以及工作流相邻的质量系统，而不只是纯
              SaaS。市场规模报告支持长期品类潜力，但不能单独证明风险投资估值上调合理。没有当前融资文件，就无法评估优先权堆栈和稀释风险。缺少公开的利润率、治理细节和可靠留存指标，也限制了退出准备度判断。最后的尽调追问应集中在股权结构、现金跑道、分群留存、集中度和按作物计算的回本。现有来源足以支撑清晰的尽调观点，但不足以抹平投资判断最在意的未解缺口。
            claimRefs:
