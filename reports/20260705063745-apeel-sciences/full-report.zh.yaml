  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分
        blocks:
          - type: paragraph
            body: >-
              公开材料清楚显示，Apeel 服务的是一条果蔬运营链，而不是一个整齐的买方画像。Apeel 的门店定位器和零售页面显示， 公司产品与 Walmart、Costco、Kroger、Whole
              Foods、Trader Joe’s、Albertsons 和 EDEKA 等零售商相关。 面向零售的叙事围绕果蔬部门差异化和更耐放的果蔬。面向供应商的叙事围绕分销扩张和低接触集成。因此，Apeel
              似乎同时切入零售商和供应商工作流，而不是只押注果蔬链一端。公司产品页面和品类页面暗示，其作物项目不止单一作物客户群。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
