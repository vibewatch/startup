            body: >-
              Apeel 的模型可能介于软件和现场服务经济性之间，因此毛利细节尤其重要。Growjo 估计 Apeel 有 473 名员工，每名员工收入约 $217K。GetLatka 则称 Apeel 2025 年 11
              月有 184 名员工。Tracxn 显示截至 2024 年 12 月，某个法律实体有 108 名员工。 公开人数分歧让任何外部计算的人均收入指标都不稳定。Apeel
              的模式可能承担不低的服务和实施成本，因为它要对接供应商、零售商和 QC 工作流。
              品类特定部署、成熟度测量和供应商赋能都指向劳动力和现场支持强度。公司在港口罢工中的回应显示，管理层愿意吸收短期服务成本来保护合作伙伴关系。 AgFunder 称 Apeel
              经历裁员，这可能是对成本压力和市场进入现实变化的回应。公开材料支持这是有真实收入的业务， 但销售效率几乎完全不可观察。CAC、回本周期和销售周期数据都未公开披露。Apeel
              的客户组合可能横跨零售商、供应商、出口商， 也可能包括分析买方，这会模糊收入确认模式。Apeel 的资本强度低于建设冷链基础设施，但高于销售纯软件。因此，公司处在尴尬的中间地带，
              毛利路径对估值影响格外大。本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
