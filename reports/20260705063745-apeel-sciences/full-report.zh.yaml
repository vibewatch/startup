      - number: '2.4'
        title: 细分、地理与剩余规模缺口
        blocks:
          - type: paragraph
            body: >-
              品类经济性因作物、地理和市场路径而异，因此公开自上而下估计只能把投资人带到一半。欧洲具有战略重要性，因为公开市场报道反复提到那里的监管和可持续性驱动因素。 国际客户证据最强的地方，是 Apeel
              能把货架期延长与出口和分销经济性绑定起来。品类经济性因作物而异，因为牛油果、蜜橘、黄瓜和柑橘类的腐损与成熟度动态不同。 公开市场数据没有披露 Apeel 的实际市场份额。更宽的 TAM 故事不如证明 Apeel
              能在新鲜果蔬工作流里反复拿到预算重要。 Apeel 的公开证据支持多区域机会，但不能证明每个区域的变现能力相同。公开材料保留了互相矛盾的规模测算视角，不能在没有限定条件的情况下合成一个 TAM 数字。
              本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
