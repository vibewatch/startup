  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Apeel 的估值讨论只有在市场、客户和产品故事重新回到投资纪律时才成立。Apeel 的公开价值主张仍支持其相对通用包装或大宗采后供应商享有溢价。 溢价情景取决于 Apeel
              不只是涂层公司，而是成为客户工作流和数据系统的一部分。Apeel 的客户和市场证据足够真实， 可以否定单纯基于需求怀疑的一刀切回避评级。Apeel 的信任冲击和披露缺口也足够真实，可以否定强买入式立场。
              多头侧最强论点是：Apeel 处在一个巨大的减废问题上，并有真实零售商和供应商证据。最强反论点是：公开证据仍没有显示毛利质量、 留存，或干净的 2021
              年后估值记录。公司的可持续和市场叙事提高战略吸引力，但不应挤掉财务严谨性。 本次留存来源足以支撑清晰的尽调判断，但还不足以抹平影响投资判断的未解缺口。
