companyProfile:
  summary: >-
    Apeel Sciences is a late-stage private food-technology company built around plant-derived edible coatings that extend the shelf life of fresh produce.
    Its public narrative has expanded from a single coating technology into a broader retailer-and-supplier workflow story that includes quality control,
    ripeness analytics, and sustainability reporting. Public evidence supports real commercial adoption and measurable food-waste impact, but financial,
    governance, and financing disclosure remain materially incomplete.
  foundedDate: '2012-06-17'
  founders:
    - name: James Rogers
      role: Founder and CEO
      background: Public sources tie Rogers to Apeel's 2012 founding and the original plant-derived coating thesis.
      claimRefs: [CO001, CO005]
    - name: Jenny Du
      role: Co-founder
      background: Apeel still highlights Du in company materials, showing continuing founder visibility beyond the CEO narrative.
      claimRefs: [CO006]
  foundingLocation: Goleta / Santa Barbara, California, USA
  headquarters: Goleta, California, USA
  productSummary: >-
    Apeel sells plant-derived coatings for conventional and organic produce, plus workflow tools such as RipeTrack for ripeness and quality management.
    The company's pitch is to reduce spoilage, extend sell-through windows, and improve supplier and retailer category economics.
  customerFocus: >-
    Fresh-produce suppliers, exporters, packhouses, retailers, and quality-control teams managing avocados, mandarins, cucumbers, citrus, and adjacent categories.
  businessModel: >-
    B2B workflow sale tied to produce throughput, shrink reduction, category performance, and in some cases analytics or QC tooling attached to the coating relationship.
  stage: Late-stage private / Series E-corroborated
  fundingStatus: >-
    Best corroborated public capital record is a $250M Series E in 2021 at a $2B valuation and roughly $640M lifetime funding.
    Public web sources also contain a lower-confidence 2025 Series F claim that needs primary corroboration before investors underwrite it.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO004, CO009, CO010, CO012, CO021, CE008, CE024, CU001]
