  - id: TP003
    title: Switching Cost and Distribution Power
    columns:
      - Factor
      - Observed pattern
      - Why it matters
      - Investor implication
    rows:
      - - Workflow integration
        - Moderate
        - Adoption lives inside packhouse and retail routines
        - Creates some stickiness but not a lock.
      - - Channel relationships
        - Important
        - Incumbents and scaled vendors can bundle solutions
        - Distribution strength can overwhelm product purity.
      - - Multi-homing
        - Likely
        - Customers can stack tools
        - Apeel should not be modeled as monopoly infrastructure.
      - - Pricing transparency
        - Low
        - Public price sheets are absent
        - Comparative win-rate is hard to underwrite externally.
    notes: Operational fit and channel leverage matter more than simplistic software-style switching-cost claims.
    claimRefs:
      - CP016
      - CP020
      - CP021
      - CP031
  - id: TP004
    title: Moat Durability Risk Register
    columns:
      - Risk
      - Why it exists
      - Evidence signal
      - What would mitigate it
    rows:
      - - Commoditization
        - Coating approaches may converge
        - Multiple credible coating startups exist
        - Show crop-level efficacy and retention advantage.
      - - Bundling by incumbents
        - Scaled vendors control relationships
        - AgroFresh represents incumbent reach
        - Demonstrate unique ROI and attach economics.
      - - Trust displacement
        - Consumer and retailer scrutiny is real
        - Misinformation history raises sensitivity
        - Sustain public transparency and category proof.
      - - Outcome competition
        - Customers buy reduced waste, not categories
        - Atmosphere and packaging players compete on the same KPI
        - Own the workflow and data layer in addition to chemistry.
    notes: Apeel’s moat is plausible but conditional; it must keep winning on outcomes, trust, and operational fit.
    claimRefs:
