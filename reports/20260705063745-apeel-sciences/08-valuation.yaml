    columns:
      - Multiple band
      - Implied EV on $150M revenue
      - Interpretation
      - Probability read
    rows:
      - - 8x
        - $1.2B
        - Cautious late-stage industrial / workflow case
        - Plausible bear-to-base floor
      - - 10x
        - $1.5B
        - Healthy growth but limited margin visibility
        - Reasonable base reference
      - - 13x
        - $1.95B
        - Roughly the public Series E anchor
        - Corroborated current benchmark
      - - 16x
        - $2.4B
        - Requires stronger quality and confidence
        - Bullish but still plausible with proof
    notes: >-
      Multiples above this range would require better public evidence on margins, retention, or a corroborated post-2021
      financing step-up.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV004
    title: Comparable valuation table
    columns:
      - Dimension
      - Assessment
      - Why
      - Implication
    rows:
      - - Recommendation
        - research-more
        - Real business, incomplete underwriting file
        - Do more work before taking price.
      - - Confidence
        - Medium
        - Good product/customer evidence, weak margin and financing clarity
        - Avoid overprecision.
      - - Risk rating
        - High
        - Trust, concentration, and opacity risks stack together
        - Demand downside protection or a better price.
      - - Valuation stance
        - Stretched
        - Even the best public anchor already prices in significant execution
        - Resist paying up without primary evidence.
    notes: >-
      The scorecard intentionally privileges evidence quality; the recommendation would improve only with primary
      financial and financing disclosure.
