- id: dynamics
  title: Funding dynamics and consolidation pressure
  body: 'The 2025-2026 funding race reshaped the field and widened the gap Oyster must navigate. Deel''s $300 million Series E at a $17.3 billion valuation and Rippling''s continued mega-rounds gave the leaders war chests to out-spend mid-tier players on product development, pricing and distribution, accelerating feature-parity pressure across the category. Ongoing EOR funding and M&A activity is consolidating the mid-market, raising the risk that sub-scale providers are acquired or squeezed out rather than growing into independent leaders. For Oyster this cuts two ways: consolidation could make it an attractive acquisition target for a larger platform seeking emerging-market depth and a mission brand, or it could leave it fighting a war of attrition on price against far deeper-pocketed rivals. Distribution and partner access increasingly favor platforms with large integration marketplaces, which Oyster only partially offsets through partnerships such as its 2026 Vistra tie-up. The net picture is a well-run challenger operating in a market whose economics reward scale it does not yet have.'
  claimRefs:
  - CP026
  - CP028
  - CP032
