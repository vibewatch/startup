- id: moat
  title: Switching cost, moat durability and adverse evidence
  body: 'Switching costs in EOR are moderate: once payroll, contracts and benefits for a distributed workforce run on one provider, migrating risks compliance gaps and employee disruption — but larger customers frequently multi-home across providers by region, which caps lock-in and pressures pricing. Core EOR mechanics are increasingly commoditized, pushing differentiation toward country depth, compliance quality, service and price. Against that backdrop, Oyster''s moat is real but narrow: its emerging-markets talent focus, B Corp mission brand and compliance depth resonate with values-driven, globally-distributed buyers, yet offer limited protection against the price and breadth advantages of giants who out-invest it. The clearest displacement risk is that Deel and Rippling simply out-spend mid-tier players. Notably, adverse evidence cuts against the leaders too: the Deel-Rippling corporate-espionage lawsuit — Rippling alleging Deel planted a spy to steal sales data, later drawing a DOJ probe and dueling counterclaims — reveals an unusually hostile top-of-market dynamic and litigation overhang that a mission-led player like Oyster can position against.'
