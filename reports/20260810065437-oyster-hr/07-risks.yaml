company:
  name: Oyster HR
chapter:
  number: 7
  title: Risk Analysis
  summary: Oyster's risk profile is dominated by regulatory/legal exposure inherent to the Employer-of-Record model — worker misclassification, permanent-establishment and cross-border labor-law risk — compounded by an opaque financial picture (private, undisclosed revenue, a ~30% 2023 layoff and a January 2026 CEO transition), heavy dependence on third-party local entities, banking/FX rails and cloud infrastructure, and intense competition from far larger, better-capitalized rivals; mitigations exist (SOC 2, GDPR, in-house legal experts, B Corp discipline) but key metrics needed to size residual exposure are not public.
sections:
- id: overview
  title: Risk overview and severity ranking
  body: 'Oyster''s risk profile is shaped by the Employer-of-Record model it operates. Ranking by likelihood times impact, the highest-severity risks are regulatory/compliance liability and financial opacity; dependency and security risks sit medium-high; and the January 2026 people/leadership transition is medium but timely. These risks are not isolated — they transmit: a compliance error or misclassification finding can cascade into litigation, reputational damage, customer churn and financing difficulty, while an entity, banking or cloud-partner failure degrades the platform and, in turn, customers'' compliant employment. The breadth of Oyster''s footprint magnifies exposure: operating across 180+ jurisdictions multiplies the regulatory surface area, since each country adds licensing, tax, benefits and privacy obligations that must be monitored continuously. After known mitigations — SOC 2, GDPR, in-house legal experts and B Corp governance — the largest residual exposures are regulatory/misclassification liability, financial opacity and competitive pressure, none of which can be fully closed from public data. This chapter works through the regulatory/legal, operational, dependency, financial and people dimensions, then sets out mitigations, kill triggers and diligence asks.'
  claimRefs:
  - CR036
  - CR035
  - CR037
  - CR038
  - CR039
  - CR007
  - CR040
  figureRefs:
  - FR001
- id: regulatory
  title: Regulatory and legal risk
  body: 'Regulatory and legal exposure is the defining risk of Oyster''s model. Worker misclassification — treating an employee as an independent contractor — is treated by U.S. regulators, including the DOL under the FLSA and the IRS, as a serious violation, and Oyster''s contractor product must actively police it. The stakes are concrete: courts have imposed multi-million-dollar penalties for misclassification, misclassified contractors can themselves sue for back pay, benefits and tax consequences, and class actions and settlements are a rising 2026 trend. Permanent-establishment risk — where in-country activity inadvertently creates a taxable presence — is a recognized EOR hazard that customers rely on Oyster to manage, and general EOR legal issues around contract enforceability and benefits compliance impose a continuous burden. Local employment laws change frequently across 180+ countries, so regulatory change is structural and can invalidate templates or raise costs with little notice. Data-privacy law adds another layer, since Oyster processes sensitive worker PII across borders under GDPR and transfer rules. Finally, the sector''s litigation temperature is elevated: the Deel-Rippling corporate-espionage lawsuit and related DOJ scrutiny show how quickly legal conflict and regulatory attention can escalate for the whole category.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR008
  - CR009
  - CR010
  - CR011
  - CR041
  - CR045
  tableRefs:
