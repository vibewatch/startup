summary:
  headline: Oyster HR 是使命驱动的 EOR 独角兽，拥有 B Corp 认证和强 G2 口碑；但合规基础设施市场正走向商品化，资本更厚的对手压得很紧，$1.2 billion 估值下单位经济性完全不透明。
