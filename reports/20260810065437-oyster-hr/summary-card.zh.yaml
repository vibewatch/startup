  topStrengths:
    - 唯一获得 B Corp 认证的 EOR 平台，用使命差异化和治理约束锁住价值观驱动的企业买家。
    - Team Member 安置中有 47% 来自新兴市场，说明公司与长期人才分布趋势和社会影响叙事结构性对齐。
    - G2 四个类别 Leader 和 Best ROI 认可显示，即使面对更大对手，客户满意度仍有支撑。
    - SOC 2 Type II 和公益公司结构共同建立企业级信任。
  topRisks:
    - Deel（估值 $17.3B）、Rippling 和 Remote 资本更厚、产品套件更宽，威胁 Oyster 的价格竞争力和销售能力。
    - 收入、ARR 和毛利率完全未披露，$1.2B 估值无法与财务基本面做基准比较。
    - 2026 年 1 月 CEO 从 Jamous 交棒给 Moussa，正赶上 AI 驱动产品投资关键期，执行风险上升。
    - 合规自动化规模化之后，EOR 市场商品化可能压缩每席价格。
  unresolvedGaps:
    - Oyster 未公开披露收入、ARR、毛利率和现金消耗率。
    - Series D 优先权结构、董事会权利和 Silver Lake Waterman 条款未公开。
    - 客户数量和企业客户集中度未披露。
