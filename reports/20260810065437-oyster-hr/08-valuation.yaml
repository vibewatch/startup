    statement: 'Valuation stance: full but not indefensible. At ~$1.2B on ~$96.6M estimated 2024 revenue, Oyster trades near a low-teens EV/Revenue multiple — a premium to the ~3.4x public-SaaS median but consistent with scaled peer pricing.'
