  - id: CV002
    statement: 'The market supports the thesis: the EOR market is a multi-billion-dollar category (roughly $6-7B in 2026) growing at a high-single-to-double-digit CAGR on the secular shift to cross-border hiring.'
    type: third-party-reported
    topic: market
    sourceRefs:
    - SV003
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV003
    statement: Product differentiation — emerging-market entity depth, a compliance-plus-experts model, B Corp trust and a growing AI layer — gives Oyster a defensible niche rather than a me-too position.
    type: inferred
    topic: product
    sourceRefs:
    - SV001
    - SV005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV004
    statement: Demand support comes from high review satisfaction (4.4-4.6/5), structural switching costs, and named references (Lokalise, Quora, Printify), suggesting sticky, expandable customer relationships.
    type: third-party-reported
    topic: customers
    sourceRefs:
    - SV006
    - SV007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV005
    statement: 'The anti-thesis is stark: Oyster is a sub-scale player financially opaque about revenue and retention, exposed to EOR regulatory risk, and competing against far larger, better-capitalized rivals in a commoditizing market.'
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV008
    - SV009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV006
    statement: 'On scale, the gap is severe: Deel is valued ~$17.3B on ~$1.4B revenue and Rippling ~$16.8B, dwarfing Oyster''s $1.2B and pressuring its ability to out-invest in product, entities and go-to-market.'
