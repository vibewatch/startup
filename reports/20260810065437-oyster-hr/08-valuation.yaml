- id: recommendation
  title: Recommendation, confidence and stance
  body: 'The recommendation is a cautious ''Watch / diligence-gated'' stance: not a clear buy at $1.2B without disclosure, but a credible franchise worth continued tracking and a conditional bid if key metrics check out. The risk rating is medium-high — regulatory exposure, financial opacity and competitive intensity, partly offset by genuine product differentiation and market tailwinds. Confidence is medium: the market and product picture is well-evidenced, but the financial and retention picture rests on estimates and inference rather than disclosed data, and a regulatory-filing search confirms Oyster is a private, non-reporting issuer with no audited financials to verify revenue. On valuation, the stance is ''full but not indefensible'' — at roughly $1.2B on ~$96.6M estimated 2024 revenue, Oyster sits near a low-teens EV/Revenue multiple, a premium to the ~3.4x public-SaaS median but consistent with how scaled peers are priced. A realistic path is a venture-style 4-7 year hold to an IPO or, more likely, a strategic exit, with upside contingent on Oyster compounding into a clear category-challenger position rather than being squeezed by the leaders.'
  claimRefs:
