- id: comps
  title: Comparable valuation
  body: 'The comparable set is anchored by scaled EOR peers and public-SaaS multiples. Deel is valued near $17.3B on ~$1.4B revenue (~12x) at roughly 15% EBITDA; Rippling near $16.8B; Remote around $3B; Velocity Global around $2B; and the public-SaaS median EV/Revenue had compressed to ~3.4x as of March 2026. Against these, Oyster''s ~$1.2B on ~$96.6M estimated revenue implies a low-teens multiple — closer to the scaled-private end than the depressed public median, which is only justifiable if one believes in sustained premium growth and moat durability. Deel is the pivotal benchmark: its scale, revenue and profitability set the reference against which Oyster''s smaller position is judged, and its $300M 2025 Series E and ~$12.6B secondary show selective capital availability with cautious repricing. Independent 2026 SaaS-valuation analyses, including HR/workforce-specific commentary, broadly support mid-single-digit revenue multiples for the sub-sector — well below Oyster''s implied mark — reinforcing a conservative multiple assumption in any valuation bridge and underlining how growth-dependent Oyster''s current valuation is.'
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  - CV040
  tableRefs:
  - TV004
- id: exit
  title: Exit readiness, triggers and diligence asks
  body: 'On exit, the more probable path is a strategic acquisition by a larger HR/payroll or PEO player, with an IPO less likely near-term; ongoing consolidation in EOR makes M&A the base-case outcome for a #3-5 player. Exit readiness today is moderate — Oyster has scale, a recognizable brand and B Corp differentiation, but undisclosed financials and a January 2026 CEO transition reduce near-term IPO readiness. A disciplined investor should predefine thesis-break triggers that would void the thesis: a material misclassification or compliance judgment, a security breach, a down round, sustained share loss to Deel or Rippling, or disclosure of weak retention or burn. To get to conviction, the final diligence asks are specific: audited revenue, growth, burn and runway; NRR/GRR and customer concentration; an owned-versus-partner entity map; the banking-partner list; SLA and incident history; and a country-level compliance and litigation exposure map. Until those are answered, the summary KPIs — $1.2B valuation, ~$96.6M estimated revenue, ~$286M raised, 180+ countries, 40%+ emerging-market hires, 4.4-4.6/5 satisfaction, medium-high risk — should be read as a provisional, disclosure-gated picture rather than a settled valuation.'
