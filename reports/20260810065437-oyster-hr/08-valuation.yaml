company:
  name: Oyster HR
chapter:
  number: 8
  title: Valuation & Investment View
  summary: 'At its September 2024 Series D Oyster was valued at $1.2 billion on ~$59M raised (total ~$286M) against a third-party-estimated ~$96.6M of 2024 revenue, implying roughly a low-teens EV/Revenue multiple — rich versus the ~3.4x March-2026 public-SaaS median but in line with scaled peer Deel (~$17.3B on ~$1.4B revenue); the investment view is a cautious, condition-heavy ''Watch / diligence-gated'' stance: a large durable market and differentiated emerging-market, B Corp positioning are offset by financial opacity, EOR regulatory risk and competition from far larger, better-capitalized rivals, so entry discipline and disclosure are prerequisites.'
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'The bull thesis is that Oyster is a differentiated, mission-led leader in a large, structurally growing global-employment market, with defensible emerging-market and compliance depth that can compound into durable, sticky revenue. The market supports it: EOR is a multi-billion-dollar category (roughly $6-7B in 2026) growing at a high-single-to-double-digit CAGR on the secular shift to cross-border hiring, and even conservative assumptions leave room for multiple multi-billion-dollar outcomes, so the addressable opportunity is not the binding constraint — execution and capital are. Product differentiation (emerging-market entity depth, a compliance-plus-experts model, B Corp trust and a growing AI layer) gives Oyster a real niche, and demand signals — 4.4-4.6/5 satisfaction, structural switching costs and named references like Lokalise, Quora and Printify — suggest sticky, expandable relationships. The anti-thesis is equally clear and must be weighed: Oyster is a sub-scale player, financially opaque about revenue and retention, exposed to EOR regulatory risk, and competing against far larger rivals. The scale gap is severe — Deel is valued near $17.3B on ~$1.4B revenue and Rippling near $16.8B, dwarfing Oyster''s $1.2B and pressuring its ability to out-invest in product, entities and go-to-market.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV036
  - CV041
  tableRefs:
