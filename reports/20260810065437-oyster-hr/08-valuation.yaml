  claims:
  - id: CV001
    statement: The bull thesis is that Oyster is a differentiated, mission-led leader in a large, structurally growing global-employment market, with defensible emerging-market and compliance depth that can compound into durable, sticky revenue.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV001
