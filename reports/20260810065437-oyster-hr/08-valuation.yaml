- id: entry
  title: Financing context and entry discipline
  body: 'The financing context frames entry. Oyster raised $59M Series D at $1.2B in September 2024, led by Silver Lake Waterman — a modest step-up from ~$1B in 2022 — in a market that has repriced growth SaaS sharply lower, which itself signals limited pricing power. In total Oyster has raised roughly $286M, a meaningful base but a fraction of what Deel and Rippling command, constraining relative firepower. Because value has been set across multiple priced rounds, a stack of liquidation preferences sits ahead of common in any downside exit, a structural factor that matters for both entry price and deal structure. What the $1.2B appears to price in is durable niche leadership and continued growth; it does not obviously price a path to challenging the category leaders. The implication for entry discipline is concrete: anchor to revenue-multiple reality rather than headline valuation, seek preference/structure protection given the downside tail, and condition any bid on disclosed retention, burn and runway. In a repriced market, paying up for an unverified growth story is exactly the mistake discipline is meant to prevent.'
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV039
- id: scenarios
  title: Scenarios and sensitivity
  body: 'Scenario analysis spans a wide outcome range. In the bull case, Oyster compounds 25-35%+ annually, deepens its emerging-market moat, harvests AI-driven efficiency and reaches a clear category-challenger position, supporting a $2.5-4B+ exit valuation. The base case has steady ~15-25% growth keeping Oyster a solid #3-5 player, with value roughly tracking revenue at a flat-to-modestly-compressed multiple, implying a ~$1.5-2.5B outcome over a multi-year hold. The bear case is a real capital-impairment scenario: competition and pricing pressure stall growth, a compliance/misclassification event or down round hits, and value compresses toward or below the last round — and because liquidation preferences sit ahead of common in a capital-intensive model, a meaningful share of an equity investment could be impaired despite Oyster''s real revenue. Value is highly sensitive to both growth and the exit multiple: at ~$96.6M revenue, each 2x turn of EV/Revenue moves enterprise value by roughly $193M, so multiple compression is as decisive as growth. A reasonable weighting of ~25% bull / 50% base / 25% bear yields a blended outcome modestly above the current mark but with a fat downside tail.'
