companyProfile:
  summary: >-
    Oyster HR is a San Francisco-based, remote-first global employment platform co-founded
    in 2019 by Tony Jamous and Jack Mardack. It operates as an Employer of Record in 180+
    countries, handling payroll, benefits, and compliance for client companies that lack
    local legal entities. Oyster is the only EOR to hold B Corp certification and raised
    $59M in a Series D at a $1.2B valuation in September 2024, bringing total raised to
    ~$286M. In January 2026, Hadi Moussa succeeded Jamous as CEO, with Jamous moving to
    Executive Chairman.
  foundedDate: '2019-01-01'
  founders:
  - name: Tony Jamous
    role: Co-Founder and Executive Chairman
    background: >-
      Lebanese-born entrepreneur and former tech CEO; founded Oyster in 2019 with a mission
      to democratize global employment opportunity. Led company through all four funding rounds.
    claimRefs:
    - CO004
    - CO005
  - name: Jack Mardack
    role: Co-Founder
    background: >-
      Co-founded Oyster with Jamous in 2019; background in global HR and employment law.
    claimRefs:
    - CO004
  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA (fully remote; legal domicile)
  productSummary: >-
    Employer of Record (EOR) service acting as the legal employer in 180+ countries; Global Payroll
    module for companies with existing entities; Global Contractors engagement and payment solution;
    Oyster AI chatbot for compliance questions; People Partner Services on-demand HR advisory.
  stage: Series D unicorn
  fundingStatus: >-
    $59M Series D (Sept 2024, Silver Lake Waterman, $1.2B post-money); ~$286M total raised.
    Prior investors include Emergence Capital, ServiceNow, Stripes, Connect Ventures.
  customerFocus: >-
    Growth-stage and mid-market technology companies hiring globally distributed teams
    across 180+ countries, with particular strength in placing talent in emerging markets.
  businessModel: >-
    SaaS + services: per-seat monthly fees for EOR and payroll; contractor fees per engagement.
    Revenue scales with headcount managed; gross margin compressed by in-country compliance costs.
