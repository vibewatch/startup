judgment:
  recommendation: track
  confidence: medium
  rationale: >-
    Oyster operates in a large and structurally growing market as more companies hire globally,
    and its B Corp mission-lock and EOR compliance infrastructure create genuine differentiation.
    However, the company faces intense competition from much larger, better-funded rivals (Deel
    at $17.3B, Rippling, Remote), does not disclose revenue or margins, and its $1.2B valuation
    provides limited return visibility without an IPO path or acquisition. The January 2026 CEO
    transition introduces execution risk during a critical growth phase.
  keyStrengths:
  - Only B Corp-certified EOR, creating mission-driven brand and governance differentiation
  - 47% emerging-market Team Member share aligns platform with long-term talent demographics
  - G2 Leader in 4 categories (Spring 2026) and Best ROI recognition signal customer satisfaction
  - SOC 2 Type II and public-benefit corporation structure build enterprise trust
  keyRisks:
  - Intense competition from Deel ($17.3B), Rippling, Remote with larger engineering and sales teams
  - Revenue, ARR, and unit economics are entirely undisclosed, making value assessment opaque
  - CEO transition (Jamous to Moussa in Jan 2026) introduces leadership continuity risk
  - Pricing pressure as EOR market commoditizes basic compliance features
  mainGaps:
  - No public revenue, ARR, or customer count disclosure
  - Full board composition and governance terms not publicly available
  - Silver Lake Waterman Series D preference terms and secondary structure not disclosed
  - No public information on path to profitability or IPO timeline
