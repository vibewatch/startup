  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named customer proof
    missingEvidence: Dated, quantified customer case studies and a fuller reference list beyond Lokalise, Quora and Printify.
    whyItMatters: Public proof is limited to a handful of names with little quantified outcome data, so the Named customer proof table is a partial enumeration.
    diligencePath: Request 5-10 reference customers with quantified outcomes and consent to speak.
    relatedQuestionRefs:
    - QU011
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Net/gross revenue retention, churn, renewal and cohort data.
    whyItMatters: Retention economics are undisclosed and can only be inferred from reviews and switching costs.
    diligencePath: Request NRR/GRR, logo and revenue churn, and cohort curves under NDA.
    relatedQuestionRefs:
    - QU017
    - QU015
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Customer count and revenue concentration (top-10 / top-customer share).
    whyItMatters: Concentration risk cannot be quantified without an account count and revenue distribution.
    diligencePath: Request total active customers and revenue concentration metrics.
