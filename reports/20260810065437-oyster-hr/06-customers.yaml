chapter:
  number: 6
  title: Customers & Demand
  summary: Oyster sells global-employment infrastructure to distributed, remote-first companies from SMBs to mid-market, with publicly named references including Lokalise, Quora and Printify and HRIS/PEO partners such as BambooHR and TriNet; independent reviews rate the product highly (roughly 4.4-4.6/5) for usability, compliance and support, but Oyster discloses no customer count, revenue-retention or concentration metrics, so demand durability must be inferred from ratings, continued fundraising and third-party signals rather than hard cohort data.
sections:
- id: segmentation
  title: Customer segmentation and demand base
  body: 'Oyster sells global-employment infrastructure to distributed, remote-first companies, spanning SMBs and scaling startups through to mid-market employers that need to hire internationally without standing up local entities. The economic buyer is usually a founder, People/HR leader or finance lead, while the day-to-day users are HR and payroll operators managing global hires. Geographically the base is broad — customers hire across 180+ countries — with a deliberate tilt toward emerging markets, where 40%+ of Oyster''s placed hires sit, reflecting the company''s DEI-forward, B Corp positioning that appeals to mission-aligned buyers. By vertical the base skews toward technology, SaaS and digital-first businesses comfortable with distributed teams, though the model applies across knowledge-work sectors. Acquisition runs through direct self-serve and sales motions, partner channels with HRIS and PEO players, and an embedded/no-code option that lets other platforms offer global hiring. Adoption itself is driven by a small set of recurring use cases: a compliant first international hire, multi-country payroll, contractor conversion, and global benefits administration.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU032
