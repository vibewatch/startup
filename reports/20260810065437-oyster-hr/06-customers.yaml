  - FU003
- id: retention
  title: Retention, satisfaction and durability
  body: 'On durability the picture is mixed: strong satisfaction signals but no disclosed retention economics. Independent review platforms rate Oyster favorably — G2 scores cluster around 4.4/5, and Software Advice shows roughly 4.6/5 across about 91 verified reviews, with ease of use the strongest attribute and value-for-money the weakest. Aggregated across G2, Capterra, GetApp and Software Advice, ratings sit consistently in the 4.4-4.6 range, a solid signal. However, Oyster discloses no net or gross revenue retention, churn or renewal rates, which is a material gap for judging demand durability. Retention must therefore be inferred from two structural facts: high review satisfaction, and the heavy switching costs of EOR — changing provider means transferring the legal employment of real people across borders, which strongly discourages churn once a customer is live. EOR billing is per-employee-per-month on rolling terms, so ''contract length'' tracks the employment relationship rather than long fixed commitments, and repeat monthly usage is built into the model. Net: the qualitative case for sticky, durable demand is reasonable, but it is unproven by the hard cohort metrics a buyer should demand.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU035
  - CU038
  - CU039
