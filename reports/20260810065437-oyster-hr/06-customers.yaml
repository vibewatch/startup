- id: adoption
  title: Adoption trajectory and usage
  body: 'Because Oyster is private and discloses no customer count, adoption must be read from proxies. Continued fundraising — a $59M Series D at a $1.2B valuation in September 2024 — plus steady product investment point to sustained customer growth, and the platform''s country-level intelligence now automates employment and compliance for more than 180 countries. Real usage is evidenced by payroll volume: Oyster has reported remitting ''hundreds of millions'' to workers in emerging markets in 2023, a proxy for the money actually flowing through the system. Customers deploy the product as pure cloud SaaS with no local setup, onboarding a new hire in as little as 48 hours through automated contract, compliance and payroll workflows. The typical journey starts with discovery and a single, low-friction first hire — effectively a one-employee pilot — before expanding into more countries and headcount, then settling into ongoing monthly payroll and benefits administration. Repeat usage is structural rather than campaign-driven: once live, customers transact payroll every month for every managed employee, so demand recurs by design.'
  claimRefs:
  - CU007
  - CU009
  - CU010
  - CU008
  - CU033
  - CU036
  - CU037
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: proof
  title: Named customer proof and references
  body: 'Oyster''s public reference set is credible but thin. The company publicly names Lokalise, a localization-software firm; Quora, an established consumer-tech company; and Printify, a print-on-demand marketplace, as customers using the platform for compliant cross-border employment. These are production customers rather than pilots, and they span three distinct business models — B2B SaaS, consumer internet and e-commerce marketplace — which demonstrates breadth of fit. Beyond direct customers, Oyster has attracted HRIS and PEO partners such as BambooHR and TriNet, and was selected by The Josh Bersin Company as a Trusted Content Partner for its Galileo AI assistant, a form of third-party validation of Oyster''s compliance content and platform quality. The weakness is depth of proof: Oyster publishes only a handful of names and limited quantified outcome metrics, and the case studies lack dated, hard ROI figures. The reference quality is therefore ''named but lightly evidenced'' — good enough to confirm real enterprise adoption, but not yet the rich, metricized proof a late-stage diligence process would ideally see.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU034
