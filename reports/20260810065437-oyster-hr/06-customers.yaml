  - FU004
- id: expansion
  title: Expansion, concentration and demand risk
  body: 'Expansion is a natural strength of the EOR model: a customer that hires one worker abroad tends to add more countries and headcount over time, expanding seat count within the account, and Oyster''s embedded/no-code offering lets partner platforms resell global hiring to widen reach. The concentration picture, though, is opaque — because Oyster publishes no customer count or revenue-concentration data, top-customer risk is unquantifiable from public sources and needs management-level diligence. Channel reliance on HRIS/PEO partners and embedded integrations adds reach but also dependency, since a partner''s strategy shift could remove a slice of joint demand. On the adverse side, demand faces real pressure: Oyster competes for the same buyers as far larger rivals Deel and Rippling, whose scale pressures win rates and pricing; review complaints cluster on pricing and value; and structural EOR-model risks such as permanent-establishment and misclassification exposure can make some buyers hesitate. Balancing these, the demand thesis rests on a durable secular tailwind — the continued growth of remote and cross-border hiring — plus Oyster''s differentiated emerging-markets and B Corp positioning, which together support demand durability even against scaled competitors.'
