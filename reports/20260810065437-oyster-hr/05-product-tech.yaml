- id: differentiation
  title: Differentiation, roadmap and maturity
  body: 'Oyster''s product edge is depth-in-focus rather than breadth. Its differentiation rests on emerging-market entity and compliance depth, a ''technology plus human experts'' delivery model, its B Corp trust brand, and increasingly AI-assisted workflows. The defensible assets are less patents than accumulated jurisdictional know-how, localized legal templates, the entity/partner network, and the proprietary employment data generated by operating across 180+ countries — data that can sharpen automation and advice over time, and which feeds Oyster AI. But this moat is real yet replicable: rivals can build or buy comparable coverage, so durability hinges on execution and trust, not exclusivity. On roadmap, Oyster ships regularly, publishing quarterly product updates (e.g., Q1 2026) and launches like Oyster AI, and extends reach through partnerships such as the 2026 Vistra tie-up for entity formation and tax. Relative to Deel and Rippling, the platform is mature on core EOR/payroll but narrower on adjacent IT, spend and immigration tooling; independent reviews echo this, praising usability, compliance and support while noting narrower breadth. Oyster AI itself is early-stage, so its productivity impact remains to be proven.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
