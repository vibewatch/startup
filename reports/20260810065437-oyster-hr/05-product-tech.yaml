chapter:
  number: 5
  title: Product & Technology
  summary: Oyster is a cloud SaaS global-employment platform whose modules (EOR, global payroll, contractors, benefits, analytics and the 2025-launched Oyster AI) sit on top of a network of owned and partner local entities, payment/FX rails, and a compliance engine; it differentiates on emerging-market entity depth, compliance automation plus human HR experts, SOC 2 / GDPR trust posture, and an integration API, while depending critically on third-party entities, banking rails and regulatory stability.
sections:
- id: product
  title: Product definition and modules
  body: 'In customer-workflow terms, Oyster is a cloud application that lets a company hire, contract, pay, insure and offboard workers across 180+ countries without opening local entities. A user picks a country, generates a compliant employment contract, and Oyster — as Employer of Record — runs payroll, statutory benefits and taxes on the customer''s behalf. The platform is organized into modules: Employer of Record, Global Payroll, Global Contractors, benefits/insurance, time-off and analytics, unified in one dashboard, with compliant offboarding closing the lifecycle. In September 2025 Oyster added Oyster AI, an AI-powered assistant that answers compliance, hiring and payroll questions faster. Core use cases are a compliant first international hire, converting contractors to employees, running multi-country payroll, and administering global benefits. The headline experience is speed: Oyster markets onboarding a new hire in as little as 48 hours, which is really the automation of contract generation, compliance checks and payroll setup that would otherwise take weeks of manual entity work.'
  claimRefs:
