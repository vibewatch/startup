- id: capital
  title: Capital adequacy, burn and financial verdict
  body: 'Oyster''s capital position looks adequate but opaque. It has raised roughly USD 286-300M across rounds, most recently the USD 59M Series D in September 2024, earmarked for platform, compliance and talent investment rather than pure survival. The September 2023 layoffs — cutting about 30% of roles — were an adverse signal of prior over-hiring and cash pressure, but they also reset the cost base, and post-layoff messaging plus the efficiency-oriented 2026 CEO transition point toward a profitability/durable-unit-economics posture rather than growth-at-all-costs. With a 2024 raise and a leaner base, Oyster likely holds multi-year runway, but exact cash, burn and runway are undisclosed. The overall financial verdict: recurring per-seat revenue is a genuine quality positive; the cautions are undisclosed financials, service-heavy margins, payroll-float/working-capital exposure and intensifying price competition. The binding diligence blockers are the absence of audited financials, revenue mix, CAC/payback, gross margin and burn — every one of which a serious investor must obtain before underwriting.'
