  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Audited revenue, revenue mix by product/segment, and confirmed growth.
    whyItMatters: Revenue quality and mix drive the entire valuation case; only opaque estimates exist.
    diligencePath: Obtain audited financials and a revenue-by-product/segment schedule.
    relatedQuestionRefs:
    - QI013
    - QI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, gross margin and burn/runway figures.
    whyItMatters: These determine capital efficiency and downside; none are public.
    diligencePath: Request sales-efficiency, P&L and treasury data in diligence.
    relatedQuestionRefs:
    - QI007
    - QI018
  - type: missing-source
    severity: minor
    topic: float
    missingEvidence: Disclosure of payroll-float balances and any interest income.
    whyItMatters: Float is both a working-capital burden and a rate-sensitive income source.
    diligencePath: Request treasury and float-income breakdown.
