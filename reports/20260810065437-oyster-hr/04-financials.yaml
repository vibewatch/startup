- id: traction
  title: Public traction versus private disclosure
  body: 'There is a sharp gap between what is public and what is private. Publicly verifiable: the USD 1.2B valuation, the USD 59M Series D, and ~USD 286-300M raised. Private/estimated: revenue and ARR. Third-party trackers estimate revenue near USD 96.6M for 2024, up from ~USD 76.6M (2023) and ~USD 56.3M (2022) — implying roughly 27-35% annual growth — but Oyster does not confirm these, so they carry low confidence and opaque methodology. A SEC EDGAR search returns no registered-company filings, consistent with a private, non-reporting issuer with no audited public financials. If the estimates hold, Oyster''s growth is solid but well below the ~63% Sacra attributes to Deel, reinforcing its mid-tier standing. The honest read is that revenue quality (recurring, per-seat) is a positive, but the numbers themselves are directional rather than dependable, and the entire mix, margin and growth picture rests on estimates a buyer would need to validate in a data room.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI026
