chapter:
  number: 4
  title: Financials
  summary: Oyster monetizes through per-employee EOR subscriptions (~$699/employee/month), low-cost contractor plans, People Services, payroll and FX spread; it is a private, non-reporting issuer whose revenue (third-party-estimated near ~$96.6M for 2024) is undisclosed, whose EOR model is more service- and capital-intensive than pure SaaS, and whose ~$286-300M raised plus the 2024 Series D fund a post-layoff drive toward efficiency.
sections:
- id: streams
  title: Revenue streams, pricing and recognition
  body: 'Oyster monetizes through several layered streams. The flagship is the Employer of Record subscription, priced at USD 699 per employee per month — roughly USD 8,388 per seat per year at list. Around it sit a low-cost contractor-management plan (~USD 29 per contractor per month, free for up to two), a payroll product, and ''People Services'' HR advisory billed around USD 300 per hour. Layered on top is an FX/payment margin — commonly cited near 1-1.5% — earned on converting and remitting cross-border payroll, which scales with payment volume. A crucial recognition nuance: because gross payroll flows through Oyster to workers, only the net service fee (subscription plus spread) is genuine Oyster revenue; pass-through payroll must be excluded, a distinction that separates headline ''money moved'' claims from real top line. Independent software directories and pricing guides corroborate the per-seat model and Oyster''s relatively transparent published pricing versus quote-only rivals. The design is a tiered land-and-expand: free/cheap contractors as the wedge, higher-value EOR seats and services as the expansion.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
