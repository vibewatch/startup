      - number: '7.3'
        title: Operational, quality and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the highest-consequence failure is a compliance or payroll error: a mistaken contract, tax
              filing or statutory-benefit calculation can create direct legal and financial liability across
              jurisdictions, and such errors scale with volume unless automation and expert review keep pace with growth
              to 180+ jurisdictions. Reliability is a related concern — Oyster publishes no uptime SLA or incident
              history, so operational dependability is asserted rather than evidenced, which matters because customers
              depend on timely payroll. Security is a structural exposure: holding worker PII, bank details and payroll
              data makes Oyster an attractive breach target, and while SOC 2 Type II and GDPR alignment mitigate the
              risk, they do not eliminate it. The newest operational risk is AI: as Oyster leans harder on automation in
              compliance-sensitive workflows, an incorrect automated answer on tax or employment law could propagate
              liability at scale unless it stays tightly human-supervised. Together these define an operational-risk
              surface where accuracy, uptime, security and responsible AI must all hold simultaneously.
            claimRefs:
