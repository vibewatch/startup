  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              Oyster's risk profile is shaped by the Employer-of-Record model it operates. Ranking by likelihood times
              impact, the highest-severity risks are regulatory/compliance liability and financial opacity; dependency
              and security risks sit medium-high; and the January 2026 people/leadership transition is medium but
              timely. These risks are not isolated — they transmit: a compliance error or misclassification finding can
              cascade into litigation, reputational damage, customer churn and financing difficulty, while an entity,
              banking or cloud-partner failure degrades the platform and, in turn, customers' compliant employment. The
              breadth of Oyster's footprint magnifies exposure: operating across 180+ jurisdictions multiplies the
              regulatory surface area, since each country adds licensing, tax, benefits and privacy obligations that
              must be monitored continuously. After known mitigations — SOC 2, GDPR, in-house legal experts and B Corp
              governance — the largest residual exposures are regulatory/misclassification liability, financial opacity
              and competitive pressure, none of which can be fully closed from public data. This chapter works through
              the regulatory/legal, operational, dependency, financial and people dimensions, then sets out mitigations,
              kill triggers and diligence asks.
            claimRefs:
              - CR036
              - CR035
              - CR037
