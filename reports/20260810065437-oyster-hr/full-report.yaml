chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Oyster HR is a remote-first global employment platform built to let companies hire, pay, and care for
              employees and contractors in more than 180 countries without incorporating local legal entities. Operating
              as an Employer of Record (EOR), Oyster becomes the legal employer of a client's international hires and
              handles contracts, payroll, statutory benefits, taxes, and ongoing compliance. The company markets
              onboarding in as little as 48 hours and pairs automated software with in-house HR experts. The registered
              corporate entity is Oyster HR, Inc., and the company describes itself as US-incorporated and distributed,
              with 2026 corporate communications datelined from San Francisco. Its positioning leans heavily on
              emerging-markets access and a mission-driven, B Corp identity, differentiating it from pure
              compliance-and-payroll rivals. Management frames global employment as 'the future of all employment,' the
              strategic thesis that underpins every downstream chapter of this report.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO035
              - CO030
              - CO031
