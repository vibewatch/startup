  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing and recognition
        blocks:
          - type: paragraph
            body: >-
              Oyster monetizes through several layered streams. The flagship is the Employer of Record subscription,
              priced at USD 699 per employee per month — roughly USD 8,388 per seat per year at list. Around it sit a
              low-cost contractor-management plan (~USD 29 per contractor per month, free for up to two), a payroll
              product, and 'People Services' HR advisory billed around USD 300 per hour. Layered on top is an FX/payment
              margin — commonly cited near 1-1.5% — earned on converting and remitting cross-border payroll, which
              scales with payment volume. A crucial recognition nuance: because gross payroll flows through Oyster to
              workers, only the net service fee (subscription plus spread) is genuine Oyster revenue; pass-through
              payroll must be excluded, a distinction that separates headline 'money moved' claims from real top line.
              Independent software directories and pricing guides corroborate the per-seat model and Oyster's relatively
