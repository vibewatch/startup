      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Under the hood, Oyster is a multi-tenant SaaS layer sitting atop three deeper layers: a network of owned
              and partner local legal entities that make it the legal employer; integrated payroll and FX/payment rails
              that convert and remit salaries in local currencies (taking a spread and holding a salary deposit for
              float); and a jurisdiction-specific compliance/rules engine of localized templates and statutory-benefit
              logic, backstopped by in-house HR and legal experts. The entity network is the operational backbone and a
              deliberate trade-off: a mix of owned entities and vetted local partners buys faster country coverage at
              the cost of some direct control. Oyster also publishes a developer API and documentation for programmatic
              hiring, data sync and integration into HRIS, ATS, accounting and identity systems, positioning it inside a
              broader people stack. Critical dependencies follow directly from this design — third-party entities and
              partners, banking/FX providers, cloud infrastructure, and the stability of local employment regulation.
              Notably, Oyster does not publicly detail its cloud provider, data-residency model or uptime SLAs, leaving
              real questions for technical diligence.
