  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is that Oyster is a differentiated, mission-led leader in a large, structurally growing
              global-employment market, with defensible emerging-market and compliance depth that can compound into
              durable, sticky revenue. The market supports it: EOR is a multi-billion-dollar category (roughly $6-7B in
              2026) growing at a high-single-to-double-digit CAGR on the secular shift to cross-border hiring, and even
              conservative assumptions leave room for multiple multi-billion-dollar outcomes, so the addressable
              opportunity is not the binding constraint — execution and capital are. Product differentiation
              (emerging-market entity depth, a compliance-plus-experts model, B Corp trust and a growing AI layer) gives
              Oyster a real niche, and demand signals — 4.4-4.6/5 satisfaction, structural switching costs and named
              references like Lokalise, Quora and Printify — suggest sticky, expandable relationships. The anti-thesis
              is equally clear and must be weighed: Oyster is a sub-scale player, financially opaque about revenue and
              retention, exposed to EOR regulatory risk, and competing against far larger rivals. The scale gap is
              severe — Deel is valued near $17.3B on ~$1.4B revenue and Rippling near $16.8B, dwarfing Oyster's $1.2B
              and pressuring its ability to out-invest in product, entities and go-to-market.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV036
              - CV041
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV003
              - CV004
      - number: '8.2'
        title: Recommendation, confidence and stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation is a cautious 'Watch / diligence-gated' stance: not a clear buy at $1.2B without
              disclosure, but a credible franchise worth continued tracking and a conditional bid if key metrics check
              out. The risk rating is medium-high — regulatory exposure, financial opacity and competitive intensity,
              partly offset by genuine product differentiation and market tailwinds. Confidence is medium: the market
              and product picture is well-evidenced, but the financial and retention picture rests on estimates and
              inference rather than disclosed data, and a regulatory-filing search confirms Oyster is a private,
              non-reporting issuer with no audited financials to verify revenue. On valuation, the stance is 'full but
              not indefensible' — at roughly $1.2B on ~$96.6M estimated 2024 revenue, Oyster sits near a low-teens
              EV/Revenue multiple, a premium to the ~3.4x public-SaaS median but consistent with how scaled peers are
              priced. A realistic path is a venture-style 4-7 year hold to an IPO or, more likely, a strategic exit,
              with upside contingent on Oyster compounding into a clear category-challenger position rather than being
              squeezed by the leaders.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV037
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV009
              - CV008
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV001
              - CV005
      - number: '8.3'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing context frames entry. Oyster raised $59M Series D at $1.2B in September 2024, led by Silver
              Lake Waterman — a modest step-up from ~$1B in 2022 — in a market that has repriced growth SaaS sharply
              lower, which itself signals limited pricing power. In total Oyster has raised roughly $286M, a meaningful
              base but a fraction of what Deel and Rippling command, constraining relative firepower. Because value has
              been set across multiple priced rounds, a stack of liquidation preferences sits ahead of common in any
              downside exit, a structural factor that matters for both entry price and deal structure. What the $1.2B
              appears to price in is durable niche leadership and continued growth; it does not obviously price a path
              to challenging the category leaders. The implication for entry discipline is concrete: anchor to
              revenue-multiple reality rather than headline valuation, seek preference/structure protection given the
              downside tail, and condition any bid on disclosed retention, burn and runway. In a repriced market, paying
              up for an unverified growth story is exactly the mistake discipline is meant to prevent.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV039
      - number: '8.4'
        title: Scenarios and sensitivity
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis spans a wide outcome range. In the bull case, Oyster compounds 25-35%+ annually, deepens
              its emerging-market moat, harvests AI-driven efficiency and reaches a clear category-challenger position,
              supporting a $2.5-4B+ exit valuation. The base case has steady ~15-25% growth keeping Oyster a solid #3-5
              player, with value roughly tracking revenue at a flat-to-modestly-compressed multiple, implying a
              ~$1.5-2.5B outcome over a multi-year hold. The bear case is a real capital-impairment scenario:
              competition and pricing pressure stall growth, a compliance/misclassification event or down round hits,
              and value compresses toward or below the last round — and because liquidation preferences sit ahead of
              common in a capital-intensive model, a meaningful share of an equity investment could be impaired despite
              Oyster's real revenue. Value is highly sensitive to both growth and the exit multiple: at ~$96.6M revenue,
              each 2x turn of EV/Revenue moves enterprise value by roughly $193M, so multiple compression is as decisive
              as growth. A reasonable weighting of ~25% bull / 50% base / 25% bear yields a blended outcome modestly
              above the current mark but with a fat downside tail.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV038
          - type: table
            tableRef: TV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV021
              - CV022
          - type: figure
