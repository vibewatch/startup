      - number: '7.4'
        title: Partner and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Oyster's model rests on external dependencies, and each is a potential point of failure. It depends on a
              network of owned and third-party local entities to act as legal employer, so the partner portion of that
              network places some compliance and service quality outside direct control. Cross-border pay relies on
              banking and FX partners, meaning a banking-partner failure, de-risking event or payment outage would
              directly disrupt payroll and worker trust. The platform runs on undisclosed cloud infrastructure, so cloud
              outage or provider concentration is a dependency risk that cannot be sized without disclosure. Capability
              partnerships add a further layer: the 2026 Vistra tie-up for entity formation and tax extends reach but
              creates partner-dependency, since a partner's exit would leave a capability gap. Underlying all of this is
              capital-provider dependency — as a private, cash-consuming company, Oyster depends on supportive capital
              markets, and the 2023 ~30% layoff plus the modest valuation step-up suggest sensitivity to financing
              conditions. These dependencies cascade, which is why the dependency map treats them as a chain feeding the
              platform's core promise.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
          - type: table
            tableRef: TR003
            claimRefs:
