        blocks:
          - type: paragraph
            body: >-
              Oyster was co-founded by Tony Jamous and Jack Mardack, and Jamous led the company as CEO from founding
              through 2025. In January 2026 the company executed a founder-led leadership transition: Hadi Moussa became
              Chief Executive Officer while Jamous moved into a newly created Executive Chairman role focused on
              long-term vision, mission stewardship, and strategy. Moussa arrives with an operator pedigree spanning
              Coople (CEO), Coursera, Deliveroo, Airbnb, and Facebook, and holds a Harvard MBA. Governance visibility is
              partial, but at least one named board member — OpenAI VP Leah Belsky — publicly endorsed the transition,
              signalling AI-oriented board influence. The transition is a double-edged signal: it brings scale-stage
              operating experience, yet founder concentration persists because Jamous founded, scaled, and still chairs
              the business, keeping continuity of vision tied to one person. Key-person dependence therefore remains a
              governance watch-item for underwriting.
