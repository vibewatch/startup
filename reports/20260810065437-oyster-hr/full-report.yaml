  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and structure
        blocks:
          - type: paragraph
            body: >-
              Oyster competes in a stratified market. At the top sit two mega-scaled, full-suite platforms: Deel, valued
              around $17.3 billion after a $300M Series E in October 2025 with $1B+ ARR and a suite spanning EOR,
              payroll, contractors, immigration and IT; and Rippling, valued around $16.8 billion, which treats EOR as
              one module inside a broader HR-IT-finance system of record. A middle tier includes Remote (an EOR-native
              peer valued near $3 billion with rapid payroll growth), payroll-led Papaya Global, enterprise-focused
              Globalization Partners, and Velocity Global. Regional specialists like Multiplier compete on price and
              APAC depth. Beyond direct rivals, the true status quo for many enterprises remains local-entity setup,
              contractor engagement, and legacy payroll/PEO incumbents they already use. Within this structure Oyster is
              a mid-tier, EOR-focused challenger — credible and well-funded, but a fraction of the leaders' scale.
