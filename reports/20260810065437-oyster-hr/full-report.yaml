      - number: '3.2'
        title: Capability, pricing and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On product breadth, Oyster covers EOR, global payroll and contractor management with strong compliance
              depth but lacks the adjacent IT, spend-management and immigration bundles that Deel and Rippling use to
              widen wallet share; 180+ country coverage is now table stakes rather than a differentiator. On price,
              Oyster's headline EOR rate of roughly $699 per employee per month sits mid-market — broadly in line with
              Remote, modestly above Deel's ~$599, below enterprise-priced Globalization Partners (~$899-1,200
              equivalent), and above discount challenger Multiplier. On go-to-market, Deel and Rippling wield far larger
              sales, marketing and integration ecosystems, giving them distribution advantages Oyster cannot match
              dollar-for-dollar; Oyster partially offsets this through partnerships such as its 2026 Vistra tie-up. On
              trust, Oyster leans on B Corp certification and compliance messaging where rivals emphasize scale and
              enterprise references. Remote's disclosure that it grew revenue ~50% per employee without adding headcount
              sets an efficiency bar Oyster is implicitly measured against.
