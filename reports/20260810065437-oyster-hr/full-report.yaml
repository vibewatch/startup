      - number: '7.5'
        title: Financial, model and people/execution risk
        blocks:
          - type: paragraph
            body: >-
              Financially, Oyster is opaque: burn, runway and unit economics are not public, and without disclosed
              revenue the true capital intensity is unknown, though the 2024 raise implies continued cash consumption.
              The model carries specific financial hazards — as an EOR it holds customer salary deposits before
              remitting them, creating float and associated fiduciary, fraud and working-capital risk, and converting
              salaries across many currencies exposes it to FX volatility and settlement risk. Competitive pressure
              compounds the financial picture: Oyster competes with far larger, better-capitalized rivals such as Deel
              (~$17B, ~$1.4B revenue, a $300M 2025 Series E) and Rippling, whose scale pressures pricing and the ability
              to out-invest, and Oyster's own valuation rose only modestly from ~$1B (2022) to $1.2B (2024), signaling
              limited pricing power and some flat/down-round risk. On people and execution, Oyster announced a January
              2026 CEO transition — Hadi Moussa as CEO with co-founder Tony Jamous moving to Executive Chairman — during
              a critical scaling phase, following a ~30% workforce cut in 2023; as a fully distributed company it also
              faces talent-retention and coordination risk for specialized legal/payroll expertise.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR043
          - type: table
            tableRef: TR004
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR025
              - CR026
      - number: '7.6'
        title: Mitigations, kill triggers and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Oyster does have real mitigations. Security and trust risk are addressed through SOC 2 Type II
              attestation, GDPR alignment and a public trust center that supports buyer due diligence. The primary
              mitigation for compliance-error risk is human: in-house HR and legal experts backstop the compliance
              engine and catch edge cases automation would miss. B Corp certification adds governance discipline and a
              mission anchor that can support consistent compliance and stakeholder trust. But mitigations only go so
              far, and a buyer should define explicit thesis-break triggers: a major compliance or misclassification
              judgment, a security breach, loss of a key banking or entity partner, a down round, or further
              senior-leadership churn. To close the biggest gaps, priority diligence asks include revenue, burn and
              runway; net-revenue retention and customer concentration; an owned-versus-partner entity map; the
              banking-partner list; incident and SLA history; and litigation/enforcement exposure by country. In short,
              the mitigations are credible but the residual, hard-to-close risks — regulatory liability, financial
              opacity and competitive pressure — are exactly the ones that most affect the investment thesis.
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR042
