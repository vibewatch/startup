      - number: '2.2'
        title: Market sizing across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single number bounds this opportunity, so we triangulate. The EOR segment itself is sized by multiple
              trackers in the mid-single-digit billions for 2026, with estimates clustering around $6-7 billion and
              projected compound growth of roughly 9-11% into the late 2020s. However, published figures diverge
              sharply: some sources assert double-digit CAGRs above 15% and 2030 values well beyond $10 billion,
              differences driven by inconsistent definitions of what counts as EOR versus broader payroll. Surrounding
              the EOR slice is the global payroll-outsourcing market, an order of magnitude larger at tens of billions,
              plus a payroll-software market in the low tens of billions. Framed as layers, TAM is the
              multi-tens-of-billions payroll-and-employment-services pool, SAM is the ~$6-7 billion EOR segment, and SOM
              is Oyster's low-single-digit share of that segment — its estimated ~$96.6M revenue implies only
              low-single-digit penetration. We carry the estimate spread forward as an explicit diligence gap rather
              than pretending to a single precise figure.
