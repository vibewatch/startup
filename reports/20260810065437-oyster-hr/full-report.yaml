      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal exposure is the defining risk of Oyster's model. Worker misclassification — treating
              an employee as an independent contractor — is treated by U.S. regulators, including the DOL under the FLSA
              and the IRS, as a serious violation, and Oyster's contractor product must actively police it. The stakes
              are concrete: courts have imposed multi-million-dollar penalties for misclassification, misclassified
              contractors can themselves sue for back pay, benefits and tax consequences, and class actions and
              settlements are a rising 2026 trend. Permanent-establishment risk — where in-country activity
              inadvertently creates a taxable presence — is a recognized EOR hazard that customers rely on Oyster to
              manage, and general EOR legal issues around contract enforceability and benefits compliance impose a
              continuous burden. Local employment laws change frequently across 180+ countries, so regulatory change is
              structural and can invalidate templates or raise costs with little notice. Data-privacy law adds another
              layer, since Oyster processes sensitive worker PII across borders under GDPR and transfer rules. Finally,
              the sector's litigation temperature is elevated: the Deel-Rippling corporate-espionage lawsuit and related
              DOJ scrutiny show how quickly legal conflict and regulatory attention can escalate for the whole category.
            claimRefs:
              - CR001
              - CR002
