      - number: '2.3'
        title: Buyers, segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              The EOR buying center splits across three roles: the buyer (founders, HR/People leaders, or
              talent-acquisition teams), the user (hiring managers and the remote employees themselves), and the payer
              (an HR/People or finance budget that competes with headcount and benefits, not a software line item).
              Demand differs by segment: SMBs and startups adopt an EOR to make one or two international hires quickly,
              whereas enterprises use it to test new markets or cover countries where they lack entities. The typical
              adoption path starts with a single cross-border hire — often a contractor first — then expands to multiple
              countries and can standardize onto one platform for global payroll and compliance, which is where
              retention and expansion economics kick in. This land-and-expand motion means early low-value contractor
              relationships are strategically important as the entry wedge into higher-value EOR employment.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM035
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM015
              - CM019
          - type: figure
            figureRef: FM003
            claimRefs:
              - CM015
              - CM013
              - CM019
              - CM014
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is powered by durable secular drivers. The normalization of remote and distributed work is the
              primary tailwind, with surveys showing a large and rising share of companies hiring internationally and
              elevated hybrid adoption versus pre-2020. Emerging-market talent adds a second driver: it offers cost and
              availability advantages, and hiring there without local entities is exactly what EORs enable — a
              structural fit for Oyster's emerging-markets tilt. Category signals reinforce this, with peers reporting
              triple-digit platform growth. But adoption faces real constraints. Compliance complexity and
              permanent-establishment/tax risk are the leading brakes, since errors expose clients to back-taxes and
              penalties; switching costs are moderate once a workforce sits on one provider; and trust is a gating
              factor that rewards brand, certifications and track record. Pricing is under competitive pressure from
              free-contractor tiers, a value headwind, and a partial return-to-office trend is a demand headwind —
              though cross-border talent access looks more durable than fully-remote domestic policies. EORs are also
              more capital- and operations-intensive than pure SaaS.
            claimRefs:
