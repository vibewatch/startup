      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory liability is the defining risk
            body: >-
              Misclassification and permanent-establishment exposure sit at the core of the EOR model; a major adverse
              judgment is the single most important thesis-break trigger.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
