            body: >-
              Because Oyster processes sensitive worker PII and payroll data across borders, trust and quality controls
              are central rather than peripheral. Oyster maintains SOC 2 Type II attestation and GDPR-aligned data
              practices, published via its official security page and a public trust center that centralizes security,
              privacy and compliance documentation for buyer diligence — the baseline assurances enterprise buyers
              require for HR/payroll data. Data-privacy and cross-border-transfer controls are core obligations given
              the nature of the data. Service quality and compliance accuracy are controlled through a blend of
              automated rules and human HR/legal review, with People Services experts backstopping edge cases — the same
              'tech + experts' model that differentiates the product. The most important forward-looking caution is AI
              risk: as Oyster leans harder on automation in compliance-sensitive workflows, an incorrect automated
              answer on tax or employment law could create real liability, so AI must be tightly supervised and
