      - number: '4.2'
        title: Cost structure, margins and unit economics
        blocks:
          - type: paragraph
            body: >-
              Oyster's cost structure is heavier than pure SaaS. Each EOR seat carries local-entity operations,
              compliance labor, payroll processing and support, so gross margins are structurally lower than software's
              70-80% norm. The peer benchmark is instructive: Sacra estimates scaled leader Deel reached ~USD 1.4B
              annualized revenue in early 2026 at only ~15% EBITDA margin — evidence that EOR economics can be
              profitable at scale but never SaaS-fat. Oyster is roughly a fifteenth of that scale, limiting its ability
              to fund a features-and-pricing war. Working capital adds another wrinkle: payroll float and cross-border
              settlement mean Oyster typically holds about a month of salary deposit, a treasury dynamic absent in
              software — though that float is also a potential interest-income upside in a higher-rate environment. On
              go-to-market, Oyster blends fast self-serve onboarding for SMBs with sales-assisted motions for enterprise
              multi-country deals, implying a blended CAC and a sales cycle that stretches from days to months by
              segment. Crucially, CAC, payback, gross margin and revenue mix are all undisclosed and remain core
              diligence unknowns.
