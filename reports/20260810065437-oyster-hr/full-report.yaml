  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacencies
        blocks:
          - type: paragraph
            body: >-
              Oyster competes in the Employer of Record (EOR) segment of the global-employment stack. An EOR becomes the
              legal employer of a client's workers in a foreign jurisdiction, absorbing payroll, tax, statutory benefits
              and compliance liability so the client can hire without incorporating locally. The addressable spend is
              cross-border employment services; it explicitly excludes domestic-only payroll processing, staffing-agency
              margins, and one-off entity-setup or immigration filings, even though buyers often conflate these.
              Bordering the market are several adjacencies Oyster can expand into or be squeezed by: domestic PEO,
              global payroll software, contractor-management platforms, HRIS/HCM suites, and entity-formation services.
              The two status-quo substitutes for an EOR are setting up a local legal entity — slow and expensive — or
              engaging workers as independent contractors, which is cheaper but carries misclassification liability.
              Understanding this boundary matters because Oyster's realistic market is the EOR slice, not the far larger
              payroll universe it is sometimes marketed against.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM026
              - CM034
              - CM035
          - type: table
            tableRef: TM001
            claimRefs:
