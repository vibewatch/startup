company:
  name: Oyster HR
chapter:
  number: 1
  title: Company Overview
  summary: Oyster HR is a remote-first, B Corp-certified Employer of Record (EOR) that lets companies hire, pay, and manage staff in 180+ countries without local entities; it reached a $1.2B valuation on a $59M Series D in September 2024 and installed a new CEO, Hadi Moussa, in January 2026.
sections:
- id: identity
  title: Identity and business model
  body: Oyster HR is a remote-first global employment platform built to let companies hire, pay, and care for employees and contractors in more than 180 countries without incorporating local legal entities. Operating as an Employer of Record (EOR), Oyster becomes the legal employer of a client's international hires and handles contracts, payroll, statutory benefits, taxes, and ongoing compliance. The company markets onboarding in as little as 48 hours and pairs automated software with in-house HR experts. The registered corporate entity is Oyster HR, Inc., and the company describes itself as US-incorporated and distributed, with 2026 corporate communications datelined from San Francisco. Its positioning leans heavily on emerging-markets access and a mission-driven, B Corp identity, differentiating it from pure compliance-and-payroll rivals. Management frames global employment as 'the future of all employment,' the strategic thesis that underpins every downstream chapter of this report.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO035
  - CO030
  - CO031
  figureRefs:
  - FO002
- id: leadership
  title: Founders, leadership and governance
  body: 'Oyster was co-founded by Tony Jamous and Jack Mardack, and Jamous led the company as CEO from founding through 2025. In January 2026 the company executed a founder-led leadership transition: Hadi Moussa became Chief Executive Officer while Jamous moved into a newly created Executive Chairman role focused on long-term vision, mission stewardship, and strategy. Moussa arrives with an operator pedigree spanning Coople (CEO), Coursera, Deliveroo, Airbnb, and Facebook, and holds a Harvard MBA. Governance visibility is partial, but at least one named board member — OpenAI VP Leah Belsky — publicly endorsed the transition, signalling AI-oriented board influence. The transition is a double-edged signal: it brings scale-stage operating experience, yet founder concentration persists because Jamous founded, scaled, and still chairs the business, keeping continuity of vision tied to one person. Key-person dependence therefore remains a governance watch-item for underwriting.'
  claimRefs:
  - CO004
  - CO007
  - CO008
  - CO009
  - CO010
  - CO034
  tableRefs:
  - TO002
- id: funding
  title: Funding, valuation and investors
  body: Oyster's defining financing event is a $59 million Series D announced in September 2024, led by Silver Lake Waterman, which set a $1.2 billion post-money valuation. The step-up was notable because it landed during a wave of late-stage tech down-rounds. Reporting placed cumulative capital raised at roughly $286 million at the time, though Oyster's own 2026 communications describe 'nearly $300 million' raised — a modest but real discrepancy this report preserves rather than reconciles away. The investor base is anchored by Emergence Capital, an early lead that has followed across rounds, alongside Stripes, Georgian, G2 Venture Partners, and Endeavor Catalyst. Oyster said the Series D would fund platform development, deeper compliance features, and talent programs. No priced round newer than September 2024 is public as of the run date, so the $1.2B mark is the freshest hard valuation anchor available for the valuation chapter.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO032
  - CO033
  tableRefs:
  - TO003
- id: metrics
  title: Cover metrics, scale and disclosure gaps
  body: 'Oyster is a private, largely undisclosed reporter of financials: it does not publish revenue, ARR, customer count, or an exact headcount. Third-party trackers estimate revenue near $76.6 million in 2023 (up from ~$56.3 million in 2022) and roughly $96.6 million in 2024, but these are external estimates the company has not confirmed, so we tag them low-confidence. Headcount is estimated in the mid-hundreds, and no reliable public active-customer count exists. What is disclosable is impact scale: as of January 2026, 47% of Team Members hired through Oyster operated in emerging countries, and the company claims hundreds of millions of dollars in salaries and taxes routed to emerging economies. The honest cover position is that the $1.2B valuation is the only hard, recent metric; revenue, customers, and headcount are diligence gaps carried into later chapters with explicit null placeholders and diligence paths.'
  claimRefs:
  - CO020
  - CO021
  - CO028
  - CO029
  - CO022
  - CO023
