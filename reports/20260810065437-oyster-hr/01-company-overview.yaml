- id: milestones
  title: Milestones and adverse events
  body: Oyster's chronology runs from a 2019 founding through rapid pandemic-era growth, a 2021 unicorn-class trajectory, mid-2023 B Corp certification, a September 2023 restructuring that cut about 30% of roles, the September 2024 Series D at $1.2B, a September 2025 Oyster AI launch, a January 2026 CEO transition, and 2026 product and partnership milestones including a Vistra tie-up and industry awards. The single most important adverse event is the 2023 layoff round, which management attributed to macro conditions and a push toward profitability; it tempers the growth narrative and is corroborated independently. The founding-year record itself is inconsistent — Oyster says 2019 while some databases list 2020 — a small but instructive example of the disclosure noise this report resolves by preserving both readings. Together these milestones frame Oyster as a resilient, mission-led scale-up that has weathered a downturn while continuing to raise and ship.
  claimRefs:
  - CO005
