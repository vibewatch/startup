  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or company-confirmed revenue, ARR and growth figures for 2023-2026.
    whyItMatters: Revenue quality and growth rate drive the valuation multiple; only low-confidence third-party estimates exist today.
    diligencePath: Request management accounts or an investor data-room revenue schedule.
    relatedQuestionRefs:
    - QO015
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: A verifiable active-customer / account count for Oyster.
    whyItMatters: Customer scale is central to traction and concentration analysis but is entirely undisclosed.
    diligencePath: Ask Oyster for active-account totals and logo concentration.
    relatedQuestionRefs:
    - QO017
  - type: missing-source
    severity: minor
    topic: financing
    missingEvidence: Disclosure of any venture debt or credit facilities.
    whyItMatters: Debt affects the preference stack and downside recovery in the valuation chapter.
    diligencePath: Review financing agreements and UCC filings for secured debt.
    relatedQuestionRefs:
    - QO014
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: An exact, company-confirmed employee headcount as of 2026.
    whyItMatters: Headcount underpins efficiency and burn estimates used later.
    diligencePath: Confirm via HRIS export or filings.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: material
    topic: ownership
    missingEvidence: A full board roster and priced cap-table ownership percentages behind the leadership table and investor map.
    whyItMatters: Board composition and ownership drive control analysis; only named leaders and investors are public, so the leadership and investor exhibits are partial.
    diligencePath: Request the board roster and a certified cap table from management.
    relatedTableRefs:
    - TO002
    - TO003
