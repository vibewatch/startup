  evidenceGaps:
  - type: conflicting-sources
    severity: material
    topic: market-size
    missingEvidence: A reconciled EOR market-size and CAGR figure using a consistent definition.
    whyItMatters: Sizing drives the SOM and valuation TAM narrative, yet published estimates differ by more than 2x.
    diligencePath: Commission or triangulate a bottom-up EOR estimate from provider revenues and seat counts.
    relatedQuestionRefs:
    - QM021
    - QM005
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: A defensible Oyster market-share number.
    whyItMatters: Share underpins the competitive and valuation chapters but neither numerator nor denominator is disclosed cleanly.
    diligencePath: Obtain Oyster revenue and a bottom-up market denominator.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: minor
    topic: segmentation
    missingEvidence: Oyster's actual revenue mix by buyer segment and geography.
    whyItMatters: Segment mix determines growth durability and pricing power.
    diligencePath: Request a revenue-by-segment and by-region breakdown from management.
