chapter:
  number: 2
  title: Market Analysis
  summary: Oyster sells into the Employer of Record (EOR) segment of the global employment stack — a market variously sized at roughly $6-7B in 2026 growing ~10% annually — nested inside the far larger global payroll and cross-border hiring economy; demand is driven by remote work and emerging-market talent access but constrained by compliance risk, switching costs, and price competition.
sections:
- id: boundary
  title: Market boundary and adjacencies
  body: 'Oyster competes in the Employer of Record (EOR) segment of the global-employment stack. An EOR becomes the legal employer of a client''s workers in a foreign jurisdiction, absorbing payroll, tax, statutory benefits and compliance liability so the client can hire without incorporating locally. The addressable spend is cross-border employment services; it explicitly excludes domestic-only payroll processing, staffing-agency margins, and one-off entity-setup or immigration filings, even though buyers often conflate these. Bordering the market are several adjacencies Oyster can expand into or be squeezed by: domestic PEO, global payroll software, contractor-management platforms, HRIS/HCM suites, and entity-formation services. The two status-quo substitutes for an EOR are setting up a local legal entity — slow and expensive — or engaging workers as independent contractors, which is cheaper but carries misclassification liability. Understanding this boundary matters because Oyster''s realistic market is the EOR slice, not the far larger payroll universe it is sometimes marketed against.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM026
  - CM034
  - CM035
  tableRefs:
  - TM001
  figureRefs:
  - FM004
- id: sizing
  title: Market sizing across multiple lenses
  body: 'No single number bounds this opportunity, so we triangulate. The EOR segment itself is sized by multiple trackers in the mid-single-digit billions for 2026, with estimates clustering around $6-7 billion and projected compound growth of roughly 9-11% into the late 2020s. However, published figures diverge sharply: some sources assert double-digit CAGRs above 15% and 2030 values well beyond $10 billion, differences driven by inconsistent definitions of what counts as EOR versus broader payroll. Surrounding the EOR slice is the global payroll-outsourcing market, an order of magnitude larger at tens of billions, plus a payroll-software market in the low tens of billions. Framed as layers, TAM is the multi-tens-of-billions payroll-and-employment-services pool, SAM is the ~$6-7 billion EOR segment, and SOM is Oyster''s low-single-digit share of that segment — its estimated ~$96.6M revenue implies only low-single-digit penetration. We carry the estimate spread forward as an explicit diligence gap rather than pretending to a single precise figure.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM027
  - CM031
