      - number: '3.3'
        title: 切换成本、护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              EOR 的切换成本处于中等：一旦分布式员工队伍的薪资、合同和福利跑在某个供应商上，迁移会带来合规缺口和员工扰动风险；但大客户常按地区多供应商并用，锁定上限因此受限，价格也被压住。核心 EOR
              机制越来越商品化，差异化被推向国家深度、合规质量、服务和价格。在这个背景下，Oyster 的护城河真实但窄：新兴市场人才重点、B Corp
              使命品牌和合规深度，会打动价值观驱动的全球分布式买家，却难以抵挡巨头在价格和宽度上的优势。最清晰的替代风险，是 Deel 和 Rippling
              直接用支出碾压中端玩家。值得注意的是，反向证据也指向头部：Deel-Rippling 企业间谍诉讼——Rippling 指控 Deel 安插间谍窃取销售数据，随后引发 DOJ
              调查和双方反诉——暴露了市场顶端异常敌对的竞争动态和诉讼包袱，Oyster 这样的使命驱动玩家可以借此反向定位。
