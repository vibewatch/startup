      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求由持久的长期驱动因素支撑。远程和分布式工作的常态化是第一顺风，调查显示，国际招聘的公司占比庞大且仍在上升，混合办公采用率也高于 2020
              年前。新兴市场人才是第二驱动：它提供成本和可得性优势，而无需本地实体即可在那里招聘正是 EOR 的能力——这与 Oyster
              对新兴市场的倾斜结构性契合。品类信号也强化这一点，同业报告平台增长达到三位数。但采用也面临真实约束。合规复杂性和常设机构 /
              税务风险是最大刹车，因为错误会让客户暴露在补税和罚款下；一旦员工队伍落在某个供应商上，切换成本为中等；信任则是门槛因素，奖励品牌、认证和履历。免费承包商层级给价格带来竞争压力，是价值逆风；部分回办公室趋势也是需求逆风——不过跨境人才获取看起来比全远程国内政策更持久。EOR
              也比纯 SaaS 更吃资本和运营。
