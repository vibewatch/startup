      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律暴露是 Oyster 模型的定义性风险。员工错分——把雇员当作独立承包商处理——被美国监管机构视为严重违规，包括适用 FLSA 的 DOL 和 IRS，Oyster
              的承包商产品必须主动管控。赌注很具体：法院已对错分处以数百万美元罚金，被错分承包商也可自行起诉追讨欠薪、福利和税务后果，集体诉讼和和解是 2026
              年上升趋势。常设机构风险——一国境内活动意外形成应税存在——是公认的 EOR 危险，客户依赖 Oyster 管理；围绕合同可执行性和福利合规的一般 EOR 法律问题也施加持续负担。180+
              个国家的本地雇佣法频繁变化，因此监管变化是结构性的，可能几乎不提前通知就让模板失效或抬高成本。数据隐私法又叠加一层，因为 Oyster 在 GDPR 和传输规则下跨境处理敏感员工
              PII。最后，行业诉讼温度偏高：Deel-Rippling 企业间谍诉讼和相关 DOJ 审查说明，法律冲突与监管注意力可以很快升级到整个品类。
