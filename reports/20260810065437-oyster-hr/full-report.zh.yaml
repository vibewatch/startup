      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Oyster
              的模式架在一串外部依赖上，每一环都可能失灵。它依靠自有实体和第三方本地实体网络担任法定雇主，因此伙伴覆盖的那部分网络，把部分合规和服务质量放在了直接控制之外。跨境发薪依赖银行和外汇伙伴；一旦银行伙伴失败、去风险化或支付宕机，工资发放和员工信任会被直接打断。平台运行在未披露的云基础设施上，因此云宕机或供应商集中度本身就是依赖风险，在没有披露前无法量化。能力合作又叠加一层：2026
              年与 Vistra 在实体设立和税务上的合作扩大了覆盖，但也制造了伙伴依赖，因为伙伴退出会留下能力缺口。更底层的是资本提供方依赖——Oyster 是一家消耗现金的私营公司，依赖资本市场继续支持；2023 年约
              30% 裁员和估值小幅上调，都说明它对融资环境敏感。这些依赖会层层传导，因此依赖图把它们视为一条链，最终指向平台的核心承诺。
