  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与结构
        blocks:
          - type: paragraph
            body: >-
              Oyster 身处一个分层市场。最上层是两家超大规模、全套件平台：Deel 在 2025 年 10 月完成 $300M Series E 后估值约 $17.3B，ARR 超过 $1B，套件覆盖
              EOR、薪资、承包商、移民和 IT；Rippling 估值约 $16.8B，把 EOR 当作更广泛 HR-IT-财务记录系统中的一个模块。中间层包括 Remote（EOR 原生同业，估值接近
              $3B，薪资增长迅速）、薪资主导的 Papaya Global、聚焦企业的 Globalization Partners，以及 Velocity Global。Multiplier 等区域专家靠价格和 APAC
              深度竞争。直接竞争者之外，许多企业真正的现状仍是本地实体设立、承包商合作，以及他们已经使用的传统薪资 / PEO 厂商。在这个结构中，Oyster 是中端、聚焦 EOR
              的挑战者——可信且资金充足，但规模只是头部公司的零头。
