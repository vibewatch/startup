      - number: '2.3'
        title: 买家、细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              EOR 购买中心分成三类角色：买方（创始人、人力 / HR 负责人或招聘团队）、用户（招聘经理和远程员工本人）以及付款方（人力 / HR
              或财务预算，它竞争的是员工人数和福利预算，而不是软件科目）。不同细分需求不同：SMB 和创业公司用 EOR
              快速完成一两个国际招聘；企业则用它测试新市场，或覆盖自己没有实体的国家。典型采用路径从一次跨境招聘开始——往往先是承包商——随后扩展到多个国家，并可能在一个平台上标准化全球薪资和合规，留存与扩张经济性也在这里启动。这种先落地再扩张的动作意味着，早期低价值的承包商关系具有战略意义，是进入更高价值
              EOR 雇佣的入口楔子。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM035
