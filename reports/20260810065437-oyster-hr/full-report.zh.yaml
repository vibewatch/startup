        title: 收入流、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Oyster 通过多层收入流变现。旗舰产品是名义雇主订阅，定价为 USD 699/员工/月——按标价约 USD 8,388/席位/年。周围还有低成本承包商管理计划（约 USD
              29/承包商/月，最多两个免费）、薪资产品，以及约 USD 300/小时计费的 “People Services” HR 咨询。再往上叠加 FX/支付利差——通常被引用在约
              1-1.5%——来自跨境薪资的换汇和汇款，随支付量放大。一个关键确认细节是：因为总薪资流经 Oyster 再到员工，真正的 Oyster
              收入只有净服务费（订阅加利差）；代付薪资必须排除在外，这把“资金流转”口径与真实收入区分开。独立软件目录和定价指南印证了按席位模式，也印证 Oyster
              相比只给报价的对手，公开定价更透明。这个设计是分层的先落地再扩张：免费 / 低价承包商作为楔子，更高价值的 EOR 席位和服务作为扩张。
