        title: 成本结构、利润率与单位经济
        blocks:
          - type: paragraph
            body: >-
              Oyster 的成本结构比纯 SaaS 更重。每个 EOR 席位都带着本地实体运营、合规劳动、薪资处理和支持，因此毛利率结构上低于软件 70-80% 的常态。同业标杆很有参考价值：Sacra 估计，规模化头部
              Deel 在 2026 年初达到约 USD 1.4B 年化收入，EBITDA 利润率也只有约 15%——说明 EOR 经济性在规模化后可以盈利，但永远不会像 SaaS 那样厚。Oyster
              规模大约只有其十五分之一，限制了它为功能与价格战供血的能力。营运资本还有一层复杂性：薪资资金沉淀和跨境结算意味着 Oyster
              通常持有约一个月薪资押金，这是软件没有的资金管理动态——不过在高利率环境下，沉淀资金也可能带来利息收入上行。上市路径上，Oyster 把 SMB 的快速自助入职与企业多国交易的销售辅助动作混合在一起，意味着混合
              CAC 和销售周期会按细分从数天拉到数月。关键在于，CAC、回本期、毛利率和收入结构全部未披露，仍是核心尽调未知数。
