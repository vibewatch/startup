  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Oyster 竞争的是全球雇佣技术栈中的名义雇主（EOR）细分市场。EOR
              在境外司法辖区成为客户员工的法律雇主，承担薪资、税务、法定福利和合规责任，让客户无需本地注册即可招聘。可触达支出是跨境雇佣服务；它明确不包括纯国内薪资处理、人力派遣机构利差、一次性实体设立或移民申请，尽管买家常把这些混在一起。市场边缘还有几类相邻领域，Oyster
              可以扩张进去，也可能被挤压：国内 PEO、全球薪资软件、承包商管理平台、HRIS/HCM 套件和实体设立服务。EOR
              的两个现状替代方案是设立本地法律实体——慢且昂贵——或把员工作为独立承包商合作，后者更便宜但带来错分责任。理解这条边界很重要，因为 Oyster 的现实市场是 EOR
              切片，而不是营销中有时拿来对标的更大薪资宇宙。
            claimRefs:
              - CM001
              - CM002
