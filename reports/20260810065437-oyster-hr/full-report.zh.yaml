      - number: '2.2'
        title: 多重口径下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有一个单一数字能框住这个机会，因此我们做三角测算。多个追踪器把 EOR 细分市场本身估在 2026 年约 $5B-$7B 量级，估算集中在 $6-7B 左右，并预计到 2020 年代末复合增速约
              9-11%。但公开数字分歧很大：有些来源给出 15% 以上的双位数 CAGR，以及远高于 $10B 的 2030 年市场规模；差异来自对 EOR 与更广义薪资市场边界定义不一致。围绕 EOR
              切片的是全球薪资外包市场，规模大一个数量级、达数百亿美元；另有低数百亿美元级的薪资软件市场。分层看，TAM 是数百亿美元的薪资和雇佣服务池子，SAM 是约 $6-7B 的 EOR 细分市场，SOM 是
              Oyster 在该细分中的低个位数份额——其估计约 $96.6M 收入意味着渗透率只有低个位数。我们把估算区间作为明确尽调缺口延续下去，而不是假装存在一个精确数字。
