  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重度排序
        blocks:
          - type: paragraph
            body: >-
              Oyster 的风险轮廓由其运营的名义雇主模型决定。按可能性乘以影响排序，严重度最高的风险是监管 / 合规责任和财务不透明；依赖和安全风险处于中高；2026 年 1 月的人事 /
              领导层交接为中等但时间敏感。这些风险并非彼此孤立，而会传导：一次合规错误或错分认定，可能级联为诉讼、声誉受损、客户流失和融资困难；实体、银行或云伙伴故障会削弱平台，进而影响客户的合规雇佣。Oyster
              的足迹广度放大暴露：在 180+ 司法辖区运营会成倍增加监管表面积，因为每个国家都增加许可、税务、福利和隐私义务，且必须持续监控。扣除已知缓释——SOC 2、GDPR、内部法律专家和 B Corp
              治理——最大的剩余暴露是监管 / 错分责任、财务不透明和竞争压力，这些都无法用公开数据完全关闭。本章依次拆解监管 / 法律、运营、依赖、财务和人员维度，并列出缓释措施、终止触发点和尽调问题。
            claimRefs:
              - CR036
              - CR035
              - CR037
              - CR038
              - CR039
              - CR007
              - CR040
