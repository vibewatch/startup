  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Oyster 是一款云应用，让公司无需开设本地实体，就能在 180+ 个国家招聘、签约、发薪、投保和离职。用户选择一个国家，生成合规雇佣合同；Oyster
              作为名义雇主代表客户跑薪资、法定福利和税务。平台按模块组织：Employer of Record、Global Payroll、Global Contractors、福利 /
              保险、休假和分析，在一个仪表盘中统一，并用合规离职闭合生命周期。2025 年 9 月，Oyster 增加了 Oyster AI，这个 AI
              助手可以更快回答合规、招聘和薪资问题。核心用例包括合规完成第一位国际雇员招聘、把承包商转为员工、运行多国薪资，以及管理全球福利。头部体验是速度：Oyster 主打最快 48
              小时让新员工入职，实质是把合同生成、合规检查和薪资设置自动化；若靠手工设立实体，原本需要数周。
