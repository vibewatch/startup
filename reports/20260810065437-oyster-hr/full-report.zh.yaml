        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Oyster HR 是一个远程优先的全球雇佣平台，让公司无需设立本地法律实体，就能在 180 多个国家招聘、支付并照护员工和承包商。作为名义雇主（EOR），Oyster
              成为客户国际雇员的法律雇主，处理合同、薪资、法定福利、税务和持续合规。公司主打最快 48 小时入职，用自动化软件搭配内部 HR 专家。注册公司实体为 Oyster HR,
              Inc.；公司称自己在美国注册、分布式运营，2026 年企业通讯的署名地点来自 San Francisco。它的定位高度押注新兴市场触达和使命驱动的 B Corp
              身份，以此区别于纯合规和薪资对手。管理层把全球雇佣定义为“所有雇佣的未来”，这条战略判断贯穿本报告后续每一章。
