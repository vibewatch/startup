  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与需求基础
        blocks:
          - type: paragraph
            body: >-
              Oyster 向分布式、远程优先公司销售全球雇佣基础设施，覆盖 SMB、扩张中的创业公司，以及需要在没有本地实体的情况下国际招聘的中端雇主。经济买家通常是创始人、人力 / HR
              负责人或财务负责人；日常用户则是管理全球雇员的 HR 和薪资运营人员。地域上客户基础很广——客户在 180+ 个国家招聘——并有意向新兴市场倾斜，Oyster 安置的雇员中 40%+ 位于这些市场，呼应公司
              DEI 前置、B Corp 的定位，也吸引使命一致的买家。按行业看，客户偏向技术、SaaS 和数字优先业务，这些公司更习惯分布式团队，不过该模型适用于知识工作部门。获客来自直接自助和销售动作、与 HRIS 和
              PEO 玩家合作的伙伴渠道，以及让其他平台提供全球招聘的嵌入式 / no-code 选项。采用本身由少数重复用例驱动：合规完成第一位国际招聘、多国薪资、承包商转员工，以及全球福利管理。
