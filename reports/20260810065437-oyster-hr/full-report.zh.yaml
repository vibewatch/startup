        title: 图表
        blocks:
          - type: callout
            title: 细分领导者，估值接近规模化同业
            body: Oyster 的低十几倍 EV/Revenue 远高于约 3.4x 的上市 SaaS 中位数，因此估值已经计入溢价增长，容错空间很小。
            calloutType: insight
            claimRefs:
              - CV010
