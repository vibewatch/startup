              底层看，Oyster 是一个多租户 SaaS 层，下面压着三层更深的东西：自有和伙伴本地法律实体网络，使其成为法律雇主；集成的薪资与
              FX/支付通道，用本地货币换汇并汇出薪资（收取利差并持有薪资押金以形成资金沉淀）；以及面向各司法辖区的合规 / 规则引擎，内含本地化模板和法定福利逻辑，并由内部 HR
              与法律专家兜底。实体网络是运营骨架，也是一项有意取舍：自有实体与经审查本地伙伴混合，换来更快国家覆盖，但牺牲部分直接控制。Oyster 也发布开发者 API 和文档，用于程序化招聘、数据同步，并接入
              HRIS、ATS、会计和身份系统，把自己放进更广泛的人力技术栈。关键依赖也直接来自这个设计——第三方实体和伙伴、银行 / FX 提供商、云基础设施，以及本地雇佣监管稳定性。值得注意的是，Oyster
              不公开详述云服务商、数据驻留模型或可用性 SLA，给技术尽调留下真实问题。
