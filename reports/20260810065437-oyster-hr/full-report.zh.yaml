      - number: '7.5'
        title: 财务、模式与人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              财务上，Oyster 不透明：现金消耗、资金可支撑期和单元经济均未公开；没有披露收入，真实资本强度无从判断，不过 2024 年融资暗示公司仍在消耗现金。模式本身也有特定财务风险——作为
              EOR，它先持有客户工资备付款再汇出，形成资金沉淀，并带来受托责任、欺诈和营运资金风险；跨多币种换发工资，也让它暴露在汇率波动和结算风险中。竞争压力进一步压住财务图景：Oyster 面对 Deel（约
              $17B、约 $1.4B 收入、2025 年 $300M Series E 轮）和 Rippling 等规模大得多、资本更充足的对手；对手规模挤压定价，也挤压其在产品、实体和商业化上继续砸钱的能力。Oyster
              自身估值仅从约 $1B（2022）小幅升至 $1.2B（2024），说明定价权有限，也存在平轮 / 下轮风险。人员与执行层面，Oyster 宣布 2026 年 1 月 CEO 交接——Hadi Moussa 出任
              CEO，联合创始人 Tony Jamous 转任执行董事长——这个节点正处在关键规模化阶段；此前 2023 年公司已裁员约 30%。作为全分布式公司，它还面临专业法律 / 薪资人才的留存和协同风险。
