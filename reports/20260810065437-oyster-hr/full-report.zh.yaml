              年收入接近 USD 96.6M，高于 2023 年约 USD 76.6M、2022 年约 USD 56.3M——意味着年增长约 27-35%——但 Oyster 未确认这些数字，因此置信度低，方法也不透明。SEC
              EDGAR 搜索没有注册公司申报，符合一家私营、非报告发行人且没有公开审计财务的状态。如果估算成立，Oyster 增长稳健，但明显低于 Sacra 归因于 Deel 的约
