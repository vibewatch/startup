      - number: '6.2'
        title: 采用轨迹与使用
        blocks:
          - type: paragraph
            body: >-
              Oyster 是私营公司，不披露客户数，因此采用情况必须从代理指标读取。持续融资——2024 年 9 月以 $1.2B 估值完成 $59M Series
              D——加上稳定产品投入，指向客户持续增长；平台的国家级智能如今已为 180 多个国家自动化雇佣和合规。真实使用可由薪资流水佐证：Oyster 曾报告 2023
              年向新兴市场员工汇出“数亿美元”，这是资金确实流经系统的代理指标。客户以纯云 SaaS 方式部署产品，无需本地设置，通过自动化合同、合规和薪资工作流，最快 48
              小时让新员工入职。典型旅程从发现和一次低摩擦首聘开始——实质上是一个单员工试点——随后扩展到更多国家和员工人数，再进入持续月度薪资和福利管理。重复使用是结构性的，而不是活动驱动的：一旦上线，客户每月为每名受管员工处理薪资，需求设计上就会复现。
