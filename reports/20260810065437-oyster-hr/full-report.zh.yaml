              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV001
              - CV005
      - number: '8.3'
        title: 融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              融资背景决定进入纪律。Oyster 2024 年 9 月由 Silver Lake Waterman 领投 $59M Series D 轮，估值 $1.2B；这只比 2022 年约 $1B 小幅上调，而增长型
              SaaS 市场已大幅重定价，本身就说明定价权有限。Oyster 累计融资约 $286M，基数不小，但只是 Deel 和 Rippling
              可动用资本的一小部分，限制了相对火力。公司经历多轮定价融资，任何下行情形下，清算优先权都会排在普通股之前；这项结构因素同时影响进入价格和交易结构。$1.2B
              看起来定价了持久细分领导地位和持续增长；它并未明显定价一条挑战品类头部的路径。进入纪律的含义很具体：锚定收入倍数现实，而不是标题估值；考虑下行尾部风险，争取优先权 /
              结构保护；任何出价都以披露留存、现金消耗和资金可支撑期为条件。在重定价后的市场里，为未经验证的增长故事支付高价，正是纪律要防止的错误。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV039
      - number: '8.4'
        title: 情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              情景分析覆盖很宽的结果区间。多头情形下，Oyster 年复合增长 25-35%+，加深新兴市场护城河，收获 AI 驱动效率，并达到清晰的品类挑战者位置，支撑 $2.5-4B+ 退出估值。基准情形是稳定约
              15-25% 增长，让 Oyster 保持扎实的第 3-5 名玩家地位；价值大体跟随收入，倍数持平到小幅压缩，意味着多年持有后的结果约
              $1.5-2.5B。空头情形是真实的资本受损场景：竞争和价格压力让增长停滞，合规 / 误分类事件或下轮融资发生，价值压缩到上一轮估值附近或以下——而在资本密集型模式里，清算优先权排在普通股前面，即便 Oyster
              有真实收入，股权投资也可能有相当部分受损。价值对增长和退出倍数都高度敏感：在约 $96.6M 收入下，EV/Revenue 每变动 2x，企业价值就约变动 $193M，因此倍数压缩和增长一样关键。按约 25%
              多头 / 50% 基准 / 25% 空头加权，混合结果略高于当前标记，但下行尾部很厚。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV038
          - type: table
            tableRef: TV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV021
              - CV022
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV020
              - CV038
              - CV010
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV017
              - CV018
              - CV019
      - number: '8.5'
        title: 可比估值
        blocks:
          - type: paragraph
            body: >-
              可比集以规模化 EOR 同业和上市 SaaS 倍数为锚。Deel 估值接近 $17.3B，收入约 $1.4B（约 12x），EBITDA 约 15%；Rippling 接近 $16.8B；Remote 约
              $3B；Velocity Global 约 $2B；截至 2026 年 3 月，上市 SaaS 中位 EV/Revenue 已压缩到约 3.4x。对照这些公司，Oyster 约 $1.2B 估值和约 $96.6M
              估算收入，隐含低十几倍的倍数——更接近规模化私营公司的上沿，而不是低迷的上市中位数；只有相信其能保持溢价增长和护城河韧性，这才说得通。Deel 是关键标尺：它的规模、收入和盈利能力设定了评价 Oyster
              较小位置的参照；其 2025 年 $300M Series E 轮和约 $12.6B 二级交易，显示资本仍有选择性供给，但重定价也更谨慎。独立的 2026 年 SaaS 估值分析，包括 HR /
              劳动力细分评论，大体支持该子行业中个位数收入倍数——显著低于 Oyster 的隐含标记——因此任何估值桥都应采用保守倍数假设，也凸显 Oyster 当前估值对增长的依赖。
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV040
          - type: table
            tableRef: TV004
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV029
      - number: '8.6'
        title: 退出准备度、触发器与尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出路径上，更可能由更大的 HR / 薪资或 PEO 玩家战略收购；短期 IPO 概率较低。EOR 持续整合，使 M&A 成为第 3-5 名玩家的基准结果。Oyster 目前退出准备度中等——有规模、可识别品牌和
              B Corp 差异化，但未披露财务和 2026 年 1 月 CEO 交接削弱了近期 IPO 准备度。纪律型投资者应预先定义会让投资假设失效的触发器：重大误分类或合规判决、安全漏洞、下轮融资、持续向 Deel 或
              Rippling 丢份额，或披露留存 / 现金消耗偏弱。要形成投资确信，最后尽调问题很具体：经审计收入、增长、现金消耗和资金可支撑期；NRR / GRR 与客户集中度；自有与伙伴实体地图；银行伙伴清单；SLA
              和事故历史；以及国家层面的合规和诉讼暴露地图。在这些问题回答前，摘要 KPI——$1.2B 估值、约 $96.6M 估算收入、约 $286M 融资、180+ 个国家、40%+ 新兴市场招聘、4.4-4.6/5
              满意度、中高风险——都应视为一张以披露为闸门的临时图景，而不是已定估值。
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
