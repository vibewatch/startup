      - number: '5.4'
        title: 信任、安全、隐私与质量
        blocks:
          - type: paragraph
            body: >-
              Oyster 跨境处理敏感员工 PII 和薪资数据，因此信任与质量控制不是边缘事项，而是核心。Oyster 维持 SOC 2 Type II 认证和符合 GDPR
              的数据实践，并通过官方安全页面和公共信任中心发布，集中提供安全、隐私与合规文档，供买家尽调——这是企业买家处理
              HR/薪资数据所需的基本保证。考虑到数据性质，数据隐私和跨境传输控制是核心义务。服务质量和合规准确性靠自动化规则与人类 HR/法律审查共同控制，People Services
              专家兜住边缘案例——这也是让产品差异化的“技术 + 专家”模型。最重要的前瞻警惕是 AI 风险：Oyster 在合规敏感工作流中越依赖自动化，税务或雇佣法上的错误自动回答就越可能制造真实责任，因此 AI
              必须受到严密监督和人工复核。总体看，信任姿态稳健，适合企业级采购；但公开可靠性 SLA 和更深入架构披露仍是买家应补齐的缺口。
