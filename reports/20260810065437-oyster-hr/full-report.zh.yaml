      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，后果最重的失败是合规或薪资错误：合同、税务申报或法定福利计算一旦出错，就可能在多个司法辖区制造直接法律和财务责任；如果自动化和专家审查跟不上扩张到 180+
              司法辖区的速度，这类错误会随规模放大。可靠性是相关问题——Oyster 不公布可用性 SLA 或事故历史，因此运营可靠性更多停留在主张，缺少证据；客户依赖准时发薪，这一点很关键。安全是结构性暴露：持有员工
              PII、银行信息和薪资数据，让 Oyster 成为有吸引力的泄露目标；SOC 2 Type II 和 GDPR 对齐能缓释风险，但不能消除风险。最新的运营风险是 AI：Oyster
              在合规敏感工作流中越依赖自动化，税务或雇佣法上的错误自动回答就越可能规模化传播责任，除非始终保持严格人工监督。合在一起，这些构成一张运营风险面，准确性、可用性、安全和负责任 AI 必须同时守住。
