      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >-
              耐久性图景是混合的：满意度信号强，但留存经济性未披露。独立评论平台给 Oyster 的评分不错——G2 分数集中在 4.4/5 左右，Software Advice 约 91 条已验证评论显示约
              4.6/5，易用性最强，性价比最弱。汇总 G2、Capterra、GetApp 和 Software Advice 后，评分稳定落在 4.4-4.6 区间，是扎实信号。不过，Oyster
              不披露净收入留存、毛收入留存、流失率或续约率，这是判断需求耐久性的实质缺口。因此留存只能从两项结构事实推断：高评论满意度，以及 EOR
              的高切换成本——更换供应商意味着跨境转移真实员工的法律雇佣关系，会强烈抑制客户上线后的流失。EOR
              按员工每月、滚动条款计费，因此“合同期限”跟随雇佣关系，而非长期固定承诺；重复月度使用内置在模型中。净结论：粘性和需求耐久性的定性论点合理，但还没有买家应要求的硬同期群指标证明。
