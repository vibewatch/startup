      - number: '6.5'
        title: 扩张、集中度与需求风险
        blocks:
          - type: paragraph
            body: >-
              扩张是 EOR 模型的天然强项：客户一旦在海外雇佣一名员工，往往会随时间增加更多国家和员工人数，账户内席位随之扩张；Oyster 的嵌入式 / no-code
              产品也让伙伴平台转售全球招聘，从而扩大触达。但集中度图景不透明——Oyster 不公布客户数或收入集中度数据，因此公开来源无法量化大客户风险，需要管理层级尽调。对 HRIS/PEO
              伙伴和嵌入式集成的渠道依赖增加触达，也增加依赖，因为伙伴策略变化可能拿走一部分共同需求。负面侧，需求面临真实压力：Oyster 与规模大得多的 Deel 和 Rippling
              争夺同一批买家，后者的规模会压制胜率和定价；评论投诉集中在价格和价值；常设机构和错分暴露等 EOR 模型结构性风险也会让部分买家犹豫。综合看，需求判断依靠一股持久的长期顺风——远程与跨境招聘持续增长——加上
              Oyster 差异化的新兴市场与 B Corp 定位，两者共同支撑需求耐久性，即使面对规模化竞争者。
