  - id: direct-adjacent-profiles-and-positioning
    title: Direct, adjacent, and substitute positioning
    body: |-
      CoreWeave is the most dangerous scaled direct alternative when the buyer wants a large enterprise AI cloud rather than a neutral broker. Its public materials combine AI-native infrastructure, Kubernetes access, storage, observability, dedicated inference, and transparent on-demand, spot, and reserved pricing. Lambda overlaps differently: it offers clearer self-serve economics and faster first-touch access, with public instance pricing and 1-Click clusters scaling from tens to 2,000+ GPUs, while also advertising SOC 2 Type II and single-tenant options. Vast.ai is the clearest price-floor competitor because it markets a live supply-demand marketplace across 20,000+ GPUs and 40+ data centers with no long-term contracts. SambaNova is less a neutral market rival than an incumbent-style alternative stack aimed at inference-heavy enterprises, sovereign deployments, and customers willing to adopt a vertically integrated platform plus a GPU alternative narrative.

      The adjacent set competes by removing only part of the pain that Andromeda solves. NVIDIA Run:ai competes for orchestration mindshare rather than for raw capacity ownership: it pools resources across public, private, hybrid, and on-prem environments and is now bundled more tightly into NVIDIA's software stack. RunPod and Modal attack the lower-friction end of the market with usage-based, developer-first workflows. RunPod offers pods, serverless, and clusters with public hourly and per-second economics, while Modal routes workloads across clouds and regions with serverless per-second billing and startup credits. These alternatives are not perfect substitutes for brokered procurement of large dedicated clusters, but they are credible substitutes for overflow, experimentation, inference, and teams that value immediate elasticity over a managed multi-provider sourcing process.
