  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-win-loss-and-take-rate
      missingEvidence: Recent win-loss data showing when Andromeda wins or loses against CoreWeave, Lambda, Vast.ai, hyperscalers, or direct bilateral contracts, plus the realized take rate and gross margin by deal type.
      whyItMatters: Public product and pricing pages show overlap, but not whether Andromeda converts that overlap into durable economics.
      diligencePath: Request the last 12 months of competitive opportunities, lost-deal reasons, realized pricing, and gross margin or take-rate by customer segment and cluster type.
      relatedQuestionRefs:
        - QP019
        - QP021
        - QP026
        - QP028
      relatedTableRefs:
        - TP003
        - TP004
    - type: private-evidence-only
      severity: material
      topic: provider-concentration-and-exclusivity
      missingEvidence: The top-provider concentration of Andromeda's supply base, any exclusivity or preferred-pricing arrangements, and evidence on whether top suppliers also sell direct to the same accounts.
      whyItMatters: Supplier breadth is a core moat claim, but concentration or easy supplier forward integration could materially weaken it.
      diligencePath: Request the top ten providers by GMV or capacity, concentration percentages, exclusivity terms, churn, and cases where providers competed directly for the same customer.
      relatedQuestionRefs:
        - QP025
        - QP028
      relatedTableRefs:
        - TP001
        - TP004
    - type: private-evidence-only
      severity: material
      topic: enterprise-trust-proof
      missingEvidence: Completed customer security reviews, audit artifacts, and regulated-account references showing that Andromeda can clear enterprise or public-sector trust requirements as reliably as direct clouds.
      whyItMatters: Hyperscalers and several rivals publish deeper trust surfaces, so trust parity cannot be assumed from Andromeda's sparse public materials.
      diligencePath: Ask for recent security questionnaires, audit reports, red-team results, and a list of customers that selected Andromeda in trust-sensitive evaluations.
      relatedQuestionRefs:
        - QP003
        - QP017
        - QP020
      relatedTableRefs:
        - TP002
        - TP004
    - type: private-evidence-only
      severity: material
      topic: customer-usage-patterns
      missingEvidence: Segment mix for training versus inference, average contract duration, and the share of customers using Andromeda as overflow versus primary infrastructure.
      whyItMatters: The durability of a brokered market layer depends heavily on whether demand is bursty overflow, multi-provider risk management, or long-duration primary deployment.
      diligencePath: Request cohort-level usage data, contract lengths, attach rates for managed services, and the percentage of spend routed through a single provider versus multiple providers.
      relatedQuestionRefs:
        - QP022
        - QP023
        - QP028
      relatedTableRefs:
        - TP001
        - TP004
