  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Competitive threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Neutral aggregation and supplier discovery
        - Direct clouds and marketplaces make supplier search easier and can sell direct without a broker
        - High
        - Lambda, Vast, RunPod, and CoreWeave all expose direct buying paths or public price anchors
        - Ask for win-loss data showing where Andromeda beats known direct clouds on speed, quality, or total cost
      - - Certification and cluster qualification
        - Upstream providers can add their own benchmark, support, or dedicated-inference packaging
        - High
        - CoreWeave and Lambda both market integrated platform controls while hyperscalers and NVIDIA keep adding software layers
        - Request proof that Andromeda's certification materially improves deployment success or procurement time
      - - One invoice and one support path
        - Multi-homing through Run:ai, Modal, or direct clouds keeps switching costs moderate
        - Medium
        - Run:ai orchestrates hybrid fleets and Modal routes across clouds; usage-based clouds avoid long commitments
        - Measure account penetration, renewal rates, and how many customers still buy direct elsewhere
      - - Supplier breadth as a moat
        - Provider-owned clouds and hyperscalers control upstream capacity and can forward-integrate commercially
        - High
        - CoreWeave scale, hyperscaler trust, and direct owned capacity all weaken the need for an intermediary in some deals
        - Map top-provider concentration, exclusivity, and whether suppliers are also competing directly for the same demand
      - - Trust and regulatory readiness
        - Hyperscalers, Lambda, Modal, RunPod, and CoreWeave publish more detailed trust or compliance materials than Andromeda
        - High
        - AWS, Google Cloud, and Azure lead on compliance breadth; several newer rivals still show clearer audited trust artifacts than Andromeda's sparse trust page
        - Request customer security questionnaires, regulated-account references, and evidence of closed deals won on compliance rather than price
      - - Durable independent orchestration layer
        - Orchestration gets bundled into upstream stacks and may not remain an independent moat category
        - Medium
        - NVIDIA now owns Run:ai, while the European Commission said Run:ai is not a significant market position on its own today
        - Ask whether Andromeda's control-layer features are meaningfully differentiated from what suppliers or NVIDIA software can bundle
    notes: Severity reflects risk to Andromeda's pricing power and retention rather than to outsourced GPU demand itself; the central question is whether market-fragmentation value survives direct-cloud maturation.
