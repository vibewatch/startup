  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / class
      - Public pricing signal
      - Contract model
      - Included capabilities
      - Unknowns / discounting
      - Implication
    rows:
      - - Andromeda
        - No public list pricing in retained sources
        - Brokered project or enterprise deal with standardized terms and unified billing
        - Supplier discovery, benchmarking, certification, routing, contracts, support
        - Realized take rate, discounting, and pass-through economics remain private
        - Must justify margin through speed, quality, and simplification rather than sticker-price transparency
      - - CoreWeave
        - Detailed on-demand and spot pricing plus reserved discounts up to 60%
        - Usage-based, reserved capacity, and dedicated inference offerings
        - Full-stack AI cloud, storage, observability, security, and expert services
        - Enterprise negotiated terms still matter; some dedicated plans remain sales-led
        - Strong benchmark for large-cluster buyers and a direct threat to broker spreads
      - - Lambda
        - Transparent per-hour instance pricing and published 1-Click cluster cards
        - Self-serve first-come instances plus dedicated clusters and private cloud
        - Instances, clusters, superclusters, trust controls, and direct cloud access
        - Enterprise discounts and non-public private-cloud pricing remain opaque
        - Lowers search cost for buyers who can standardize on one provider quickly
      - - Vast.ai
        - Live supply-demand pricing with on-demand, interruptible, and reserved options
        - Marketplace-style usage with no long-term contracts required
        - Search, API-driven provisioning, and broad GPU inventory across hosts
        - Reliability and service quality vary more with the host base than in fully managed clouds
        - Creates a transparent commodity floor under non-regulated or flexible workloads
      - - RunPod
        - Public hourly GPU cards plus per-second serverless billing
        - Pods, serverless workers, and reserved cluster-style options
        - Development, inference, and cluster packaging under one self-serve umbrella
        - Enterprise support and the heaviest compliance packaging are less visible than hyperscalers
        - Strong substitute for bursty inference or quick experimentation
      - - Modal
        - Per-second serverless billing, free credits, and explicit startup or research grants
        - Serverless execution with enterprise plan upsell
        - Cross-cloud routing, autoscaling, training, inference, and batch execution
        - Dedicated long-duration cluster economics are not the core public message
        - Good for elastic workloads, less direct for brokered multi-provider procurement
      - - AWS / Azure / GCP
        - Mix of public list cards and negotiated committed-use economics
        - Existing cloud contracts, enterprise agreements, and reserved consumption programs
        - Native accelerator instances, networking, storage, and audited compliance controls
        - Effective realized price can vary materially with commitments and existing account leverage
        - Procurement rides incumbent budgets, making displacement expensive even when raw list pricing is higher
      - - Internal build / DGX SuperPOD
        - No simple public usage price; economics look like capex plus operations rather than cloud opex
        - Owned or managed AI data center deployment
        - Full-stack compute, networking, storage, and workload-management environment
        - True total cost depends on utilization, deployment speed, staffing, and financing structure
        - Credible only where sustained demand is large enough to amortize complexity
    notes: Public pricing transparency is much higher for direct clouds and serverless platforms than for Andromeda's broker model; the key underwriting question is whether Andromeda's workflow value outweighs that visibility gap.
