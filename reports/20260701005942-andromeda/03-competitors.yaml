chapter:
  number: 3
  title: Competitors
  summary: 'Andromeda competes less against one single startup than against four solution classes: provider-owned GPU clouds led by CoreWeave and Lambda, price-transparent marketplaces like Vast.ai, orchestration or serverless adjacencies such as NVIDIA Run:ai, RunPod, and Modal, and the status-quo path of hyperscalers or internal build. Its clearest wedge is neutral multi-provider procurement, qualification, and unified contracting, but durability is conditional because direct clouds publish pricing, hyperscalers dominate trust, and upstream infrastructure or orchestration vendors can bundle away parts of the broker value proposition.'
sections:
  - id: landscape-and-alternative-classes
    title: Landscape and alternative classes
    body: |-
      Andromeda's buyer is not choosing among a neat list of GPU startups. The real choice set breaks into at least five classes. First are direct provider-owned AI clouds such as CoreWeave and Lambda that sell their own capacity, contracts, and support stack. Vast.ai sits close to that class on budget overlap even though it is structurally different: it is itself a marketplace, but one that leaves price formation and many commercial terms closer to the underlying hosts. Second are incumbent hyperscalers — AWS, Google Cloud, and Azure — that remain the default status quo for many enterprises because they combine accelerator inventory with audited compliance programs and existing budget relationships. Third are adjacent orchestration and elasticity products such as NVIDIA Run:ai, RunPod, and Modal that remove enough operational friction for some teams to avoid a brokered procurement layer entirely. Fourth is internal build or on-prem deployment using systems such as NVIDIA DGX SuperPOD. Fifth is direct bilateral contracting with providers, which is the pre-broker status quo that Andromeda says it simplifies through benchmarking, standardized terms, and one invoice.

      This framing matters because Andromeda's strongest public differentiation is not absolute price leadership or unique ownership of supply. Its home and provider flows describe a neutral market layer that sources, benchmarks, certifies, and standardizes capacity across 100+ providers and more than 1,000 completed transactions. That is strongest when a buyer values supplier discovery, qualification, and commercial simplification more than allegiance to any single cloud. It is weakest when the buyer already trusts one provider, can self-serve the needed GPUs in minutes, or has enough scale to justify a direct contract or internal build. The likely entrant set therefore matters as much as the named rivals: every supplier that gains better orchestration, better compliance packaging, or better sales coverage can move one step closer to replicating some part of the broker layer.
