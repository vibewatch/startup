tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / class
      - Category
      - Scale / funding signal
      - Target customer
      - Differentiation
      - Limitation
    rows:
      - - Andromeda
        - Neutral broker / market layer
        - 100+ providers; 1,000+ transactions; sparse public trust surface
        - AI labs, startups, enterprises, and platform teams needing external GPU capacity across multiple suppliers
        - Sources, benchmarks, certifies, and standardizes third-party supply with one invoice and one support channel
        - Does not publicly show hyperscaler-level compliance depth or transparent list pricing
      - - CoreWeave
        - Direct AI-native cloud
        - Public Nasdaq company; nearly $100B revenue backlog; >1 GW active power in Q1 2026
        - Frontier labs, enterprises, and customers that want large dedicated AI infrastructure from one provider
        - Full-stack AI cloud with storage, observability, security, transparent on-demand or spot pricing, and committed-capacity options
        - Customer concentration, leverage, and lease-mismatch risk; not a neutral multi-provider broker
      - - Lambda Cloud
        - Direct AI cloud
        - 100,000+ cloud sign-ups; 5,000+ hardware or private-cloud customers; $863M total equity raised after 2025 Series D
        - AI developers, training teams, and enterprises seeking self-serve plus large dedicated clusters
        - Straightforward published pricing, self-serve instances, 1-Click clusters, and SOC 2 Type II trust posture
        - Primarily sells its own capacity rather than aggregating fragmented external supply
      - - Vast.ai
        - Marketplace substitute
        - 20,000+ GPUs; 40+ data centers; 68+ GPU types on a supply-demand exchange
        - Price-sensitive researchers, startups, and overflow buyers willing to self-manage more variability
        - Real-time market pricing, no long-term contracts, and broad host diversity
        - Lower managed-procurement, support, and enterprise-trust depth than the best direct clouds or hyperscalers
      - - SambaNova
        - Adjacent incumbent / inference stack
        - $350M+ 2026 Series E; Intel strategic collaboration; sovereign and SoftBank-linked deployments
        - Enterprises, sovereign programs, and service providers prioritizing inference economics over neutral supply aggregation
        - Vertically integrated inference platform with a GPU-alternative narrative and strong sovereign angle
        - Less a direct broker substitute for general outsourced multi-provider training procurement
      - - 'NVIDIA Run:ai'
        - Orchestration adjacency
        - NVIDIA-owned enterprise software platform with cloud-hosted and hybrid deployment paths
        - Enterprises managing GPUs across public cloud, private cloud, hybrid, or on-prem environments
        - Dynamic GPU orchestration, policy controls, and heterogeneous resource pooling
        - Does not supply compute directly and is less neutral after NVIDIA ownership
      - - RunPod / Modal
        - Serverless and elastic-cloud adjacency
        - RunPod says 1M+ developers; Modal markets instant autoscaling from 0 to 1000+ GPUs
        - Developers, inference teams, and overflow buyers who value speed and per-second economics
        - Low-friction deployment, transparent or usage-based pricing, and strong burst elasticity
        - Weaker fit for brokered procurement, long-duration multi-provider sourcing, and the heaviest regulated accounts
      - - AWS / Azure / GCP
        - Incumbent status quo
        - Global cloud scale and the deepest public compliance catalogs in the set
        - Enterprises, governments, and regulated teams already buying through established cloud accounts
        - Existing procurement path, audited compliance breadth, and direct access to accelerator instances
        - Not neutral and can be expensive, capacity-constrained, or single-provider by design
      - - Internal build / DGX SuperPOD
        - Internal substitute
        - Turnkey AI data center path that can scale to tens of thousands of GPUs
        - Well-capitalized labs, sovereign programs, and enterprises with sustained demand and platform talent
        - Maximum control and no intermediary take rate once deployed
        - High capital intensity, deployment complexity, and slower time-to-value for smaller buyers
    notes: The table covers the main direct, adjacent, incumbent, and substitute routes evidenced in the retained source set; it is a selected 2026 buying landscape rather than an exhaustive census of every GPU cloud.
    enumerationScope:
      coverage: partial
      basis: Selected 2026 competitors and substitutes were built from retained official product, pricing, trust, filings or ratings, and regulatory sources covering the buyer paths most likely to intercept outsourced multi-provider GPU spend.
