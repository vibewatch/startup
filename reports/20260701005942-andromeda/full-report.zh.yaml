      - number: '4.3'
        title: 成本结构、利润率类比与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开材料表面上指向轻资产模型，但不能最终证明它拥有轻资产损益表或资产负债表。由于 Andromeda 似乎采购第三方容量，而不是运营自己的大型机队，最明显的直接云成本——自有 GPU
              折旧、数据中心建设和超大规模云厂商级电力采购——应在结构上低于 CoreWeave 或 Amazon
              等供应商。即便如此，公司似乎仍承担真实服务交付成本：工作负载验证、基准测试、合同标准化、支持、可观测性，以及潜在的预先安排或预留容量。这点重要，因为若经纪商预付供应商、担保承诺，或在供应商义务已固定后才向客户收款，它仍可能变成重营运资本模式。保留的公开来源没有披露
              Andromeda 的这些机制。


              上市公司类比让风险更尖锐。DigitalOcean 文件显示，其云模型远轻于 CoreWeave，但即便 DigitalOcean 也在 2026 年 Q1 因数据中心扩张成本先于收入到来，毛利率从 61%
              压缩到 56%，并且仍承担有意义的资本开支 和长期机房租约。CoreWeave 是另一端极值：文件和 Fitch 显示 take-or-pay 收入可见性，但也显示严重集中度、庞大债务结构，以及专门为客户合同
              资本开支融资而设置的资产级工具。Amazon 文件则显示，直接云所有权可以把资本需求、预付款和履约义务放大到多大。在这个背景下，Andromeda 2026 年 3
              月融资提高了外界对其有资本增长的信心，但公开证据仍未披露手头现金、现金消耗、续航期、债务或任何供应商侧担保。因此，无法仅凭公开证据承保前瞻资本充足性。
