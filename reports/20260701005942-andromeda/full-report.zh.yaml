      - number: '2.2'
        title: 受证据约束的规模测算视角与估计区间
        blocks:
          - type: paragraph
            body: >-
              自上而下的品类视角很直接，即便公司特定切片并不直接。The Business Research Company 估计，全球 GPUaaS 收入将从 2025 年的 $5.8B 增至 2026 年的
              $7.39B，并在 2030 年达到 $19.34B，CAGR 为 27.2%。S&P Global 的 451 Research 买方洞察页面进一步说明这已经是一个真实品类：其 GPUaaS 市场监测器追踪全球
              22 家供应商的收入和增长预期。这是宽口径 TAM 背景，但不能直接称为 Andromeda 的可服务市场，因为其中混合了超大规模云厂商、专业云和托管服务层，经济性差异很大。


              更有用的市场视角来自 2026 年观察到的价格卡。官方定价和市场汇总显示，H100 等价容量在很宽区间内出清：Presenc 引用 2026 年 Q2 spot 约 $1.20-$2.00 / 小时，按需约
              $1.80-$3.50；RunPod H100 标价 $2.89-$3.29；Lambda H100 标价 $3.99；CoreWeave 公开 HGX H100 节点定价折算约 $6.16 /
              H100-hour 按需；Google Cloud 公开 A3 High 和 A3 Mega 价格卡折算折扣前约 $11.06-$11.68 / H100-hour。Cyfuture
              的市场文章保留了另一端极值，称部分高端 超大规模云厂商层级仍达到约 $14.19 / 小时。这不是应被平滑掉的噪音；它证明市场正按工作负载关键性、支持水平、配额访问和合同结构分层，而不是收敛为一个商品价格。


              最窄的公开 Andromeda 相关视角只是下限，不是真正的 SAM。DCD 报道称，Andromeda 集群可以在数小时内提供最多 2,000 块 H100，价格为每 GPU-hour
              $2.40-$3.00。若这条公开报价全年满载，代表约 $42.0M-$52.6M 的年化原始算力支出。这个数字远不能作为 Andromeda 的 TAM，但可作为可见公开市场流动性底线。公开证据仍无法切分更广泛
              GPUaaS 市场中有多少既是多供应商，又对信任敏感到需要经纪商；也无法判断 Andromeda 能把其中多少支出捕获为收入，而非转手 GMV。正确结论因此受证据约束：品类很大且在增长，但精确 SAM 和 SOM
              仍披露不足。
