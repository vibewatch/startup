  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层和购买中心形态
        blocks:
          - type: paragraph
            body: >-
              Andromeda 的公开客户画像，在细分层面最清楚，在具名账户层面并不清楚。官方文案、隐私政策和客户需求表都一致显示，买方动作瞄准的是 AI
              团队：它们需要突发或大规模训练与推理容量，又不想签多年期超大规模云承诺。直接买方通常是能指定 GPU 类型、数量、区域、时间和时长的基础设施、研究或平台负责人。实际使用者看起来是 ML 研究员、平台工程师和
              SRE 式基础设施团队；账户一旦足够大，经济买方又可能上移到财务、采购、安全或法务。这个拆分很重要，因为 Andromeda 卖的不是自助式商品 API，而是围绕集群的一层重服务采购和运营能力。


              公开招聘补上了缺失的分层细节。Solutions Engineer 岗位明确面向前沿实验室、AI
              原生创业公司和企业，并把工程领导、平台团队，以及安全或基础设施负责人列为核心利益相关方。隐私政策也单独说明，平台服务 AI
              团队和企业客户，同时收集财务和账单数据，这支持了付款方与使用者分离的判断。在供给侧，Andromeda
              也实际把供应商当作渠道客户或交易对手来服务：数据中心、云供应商、电信运营商和其他运营方通过同一平台把集群推向市场。因此，本章更合适的框架是一个双边市场，需求侧有三类尤其重要：NFDG 或 AI Grant
              创业公司、保密的大型 AI 实验室，以及做结构化评估的企业技术买方。


              地理上，公司以美国为中心，但不只服务美国。公开职位集中在 San
              Francisco，以及北美或全球远程覆盖；官方页面则承诺可提供全球算力，并收集供应商位置数据。由此形成的细分画像可信、商业逻辑也顺，但仍缺最影响承保判断的拆分：活跃客户数、按细分市场划分的收入、地域组合，以及需求里还有多少来自
              NFDG 生态。
