      - number: '8.3'
        title: 情景区间、下行触发因素和价格敏感性
        blocks:
          - type: paragraph
            body: >-
              牛市、基准和熊市情景，更多由营收线之下的东西驱动，而不是由顶线故事驱动。牛市情景不是 Andromeda 变成超大规模云厂商；而是当前约 $100M
              规模大多反映的是净额、高价值的经纪经济性，建立在有黏性的采购和运营关系上，供应商和客户集中度可控，公司还能继续把供给碎片化转化成持久战略位置。在这种情况下，高端 AI 基础设施倍数仍能站住，当前进入价格也能成立。


              基准情景更克制，也更符合公开证据。Andromeda
              仍是一家真实且有用的公司，但市场发现，总额转手收入、客户多云并用、高接触服务负担和融资复杂度中的某种组合，让业务无法享受高端私有市场倍数偏爱的那种干净软件式持久性。在这个世界里，当前估值只算勉强站得住，主要还要靠公司长进估值。熊市情景很直接：如果据报收入基础的经济性弱于表面，如果直连云厂商补上工作流缺口，如果客户或供应商集中度很高，或者治理和融资不透明迫使公司接受不利于投资人的条款，下行空间会迅速打开，因为当前价格给分母失望留下的余地比叙事暗示的更小。
