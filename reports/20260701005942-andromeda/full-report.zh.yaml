      - number: '8.4'
        title: 退出准备度和真正影响决策的尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开材料足以说明 Andromeda
              为什么值得关注，却不足以说明新投资人为什么应无摩擦接受当前价格。缺失材料不是装饰性的。投资人仍需要一座经审计或由管理层认证的收入桥，区分总市场交易量、确认收入和净价差；还需要清晰了解客户和供应商集中度、真实续约和留存数据，以及定义
              2026 年 3 月标题估值在普通股等价经济性上到底意味着什么的融资文件。没有这些材料，当前估值更应被描述为可能合理但证据不足。


              这也限制了退出承保信心。能够支撑的持有逻辑，是中期长进倍数的案例，而不是近期上调估值或干净战略退出的案例。超大规模云厂商和直接 AI 云仍主导信任、采购关系和基础设施深度，而 Andromeda
              周围公开可见的创始人板凳厚度已比最初叙事更薄。如果尽调能证明 Andromeda
              拥有一个有黏性、多元化、具备净经济性且融资有纪律的经纪层，建议可以上调。否则，正确反应是耐心：跟踪公司、保持访问通道，并要求业务用比公开记录更硬的证据赚到高端估值。
