  - id: FI002
    title: 单位经济桥——模型要规模化必须满足什么条件
    type: flow
    layout: standard
    summary: 把公开可见的需求和定价信号，与真正决定利润率质量的隐含变量连接起来——抽成率、支持负担和营运资本。
    data:
      nodes:
        - id: large_accounts
          label: 大客户需求
          detail: 公开买方画像集中在基础设施消耗大的客户和预留型工作负载。
        - id: price_dispersion
          label: 直接云宽价格带
          detail: 官方价格卡按打包方式和服务级别不同，区间从约 ~$2.89 到 ~$49.24 / H100-hour。
        - id: andromeda_spread
          label: Andromeda 抽成率 / 价差
          detail: 未公开的变量，用来把客户活动转化为确认收入。
        - id: service_cost
          label: 服务交付成本
          detail: 基准测试、合同标准化、解决方案支持和供应商协调。
        - id: working_capital
          label: 营运资本负担
          detail: 取决于预购、担保和付款条件，可能保持轻，也可能变重。
        - id: margin_outcome
          label: 利润率结果
          detail: 如果净经纪经济性跑出规模，回报可能很有吸引力；如果总额转手和服务成本占主导，利润率可能一般。
      edges:
