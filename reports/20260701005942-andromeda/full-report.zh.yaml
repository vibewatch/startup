      - number: '6.2'
        title: 采用轨迹和具名客户证据
        blocks:
          - type: paragraph
            body: >-
              现有证据足以说明 Andromeda 已有真实采用，但还不足以说明公开客户证据很强。官方页面撑住了漏斗顶端和运营规模叙事：100 多家供应商、1,000 多笔交易、超过 10 亿 GPU
              小时活动，以及横跨多家供应商的数十个集群。独立报道随后补上重要商业化标记。DCD 报道称，到 2025 年 6 月，该集群已经向非 NFDG 客户开放，公布了报价、快速 onboarding，并可提供最高
              2,000 张 H100。Upstarts 和 SiliconANGLE 又补充说，公司 2025 年运行收入约 $100M，同时服务 Moushey
              大多不愿具名的知名创业公司和实验室。合在一起，这些足以证明真实生产需求已经存在，尽管证据仍以汇总指标为主，而不是具体账户。


              具名证据薄得多。本轮最清楚的显式名称是 ElevenLabs 和 Pika：Upstarts 称两家公司都使用了早期投资组合集群，SaaS Sentinel 也重复了这一点。这些引用重要，因为它们把
              Andromeda 连接到爆发式 AI 工作负载，而不是泛泛的创业公司 logo；但它们仍够不上最好的客户证据形式。Andromeda 没有第一方案例研究，没有 ElevenLabs 或 Pika
              的客户引语把生产使用归因于 Andromeda，也没有部署时长、训练吞吐、节省金额、正常运行时间或合同扩张等公开部署结果。Cursor、Perplexity、Browserbase 和其他 AI Grant
              公司对渠道分析有意义，因为 AI Grant 称更大额投资会附带 Andromeda Cluster 访问权；但这些名称的直接部署仍只与生态相关，并未被公开确认。


              因此，正确结论应克制，而不是宣传式。Andromeda
              看起来已经从只服务投资组合公司的实验，走向了一个真实的保密算力市场，既有创业公司需求，也有更大实验室需求；但对一家声称已有显著规模的公司来说，公开引用集仍异常稀疏。投资人应把汇总采用指标视为支撑证据，把具名客户证据视为真实但不完整。
