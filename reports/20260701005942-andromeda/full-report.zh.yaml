      - number: '1.4'
        title: 里程碑、商业化路径与当前风险信号
        blocks:
          - type: paragraph
            body: >-
              里程碑故事重要，因为 Andromeda 的公开身份滞后于其运营历史。Upstarts 显示，项目在 2023 年末交接给 Moushey，2024 年初为 NFDG 支持的公司扩展到 4,000 多块
              GPU，随后走向更广泛的商业化。DCD 增加了 2025 年 6 月这个重要检查点：在 2026 年 3 月公开发布前，Andromeda Cluster 已按公开单 GPU 价格向非 NFDG
              公司销售。2026 年 3 月 16 日的隐私政策修订是最清晰的公开法律标记，3 月 18 日的 X 帖和网站亮相则是最干净的外部发布标记。同一周也带来了 Paradigm 融资和最强公开估值锚点。截至 2026
              年 7 月本报告运行日，公司仍在法务、财务、合作伙伴、采购、解决方案、软件和可靠性岗位活跃招聘，说明它正围绕资本与需求故事搭建运营底盘。


              风险信号比典型困境公司红旗更隐蔽，但确实存在。DCD 2025 年报道称，Meta 围绕 NFDG 的部分收购谈判会如何影响 Andromeda 尚不清楚；Upstarts 后来称 Friedman 和
              Gross
              已不再与公司保持活跃关系。问题恰恰在于，创始人曾是早期供应、资本和客户叙事的中心，因此这带来连续性疑问。信任和隐私页面显示管理层重视法律与安全基础设施，但相对于收入和估值叙事，公开信任页面仍很稀疏。再加上董事会披露不透明、资本结构细节未解、客户数量未公开，本章应把
              Andromeda 描述为一家高速扩张、似乎已盈利的算力市场；但其可投资性仍取决于管理层会议中对所有权、治理和集中度风险的确认。
