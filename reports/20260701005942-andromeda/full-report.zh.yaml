      - number: '5.4'
        title: 信任、质量和技术风险
        blocks:
          - type: paragraph
            body: >-
              信任与控制披露确实存在，但相对产品承诺仍偏薄。隐私政策是目前最实质的公开控制文件。文件称，Andromeda 运营的是纯商业平台，会收集详细的客户和供应商基础设施数据，用 Cookie
              支持认证和核心功能，可按需提供
              DPA，并维护访问控制、传输和静态加密，以及持续监控。官网和第三方报道也暗示，基础设施上架前会经过供应商资质审核和安全筛查。这些都是正面信号，但大多仍是公司自己的说法。公开信任中心除了标题页几乎没有更多内容，本轮也没有发现第一方公开状态页、具名外部认证、已发布
              SLA 文件或事件复盘。


              这个缺口很关键，因为 Andromeda
              明确把产品卖点放在跨第三方基础设施的可靠性、标准化和信任上。如果基准方法、认证门槛、供应商整改规则和事件历史继续不透明，买方就只能很大程度上凭信任接受公司的质量主张。运营依赖图也不简单：供应商供给可能收紧，网络或存储缺陷可能打断训练任务，编排错误可能把作业路由错位，服务很重的支持模式在需求超过专业人员供给时也会变成瓶颈。正确结论不是产品不成熟，而是商业工作流走在公开信任界面前面。因此，投资人或企业买方应把基准方法、供应商质量控制、状态报告和自动化深度视为剩余技术尽调里最重要的议题。
