  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发条件
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 领导连续性失效
        - Wil Moushey 离任，或在没有可信继任与董事会地图的情况下失去运营控制
        - 公开的创始人 / 运营者叙事失去剩下的连续性锚。
        - 暂停，或从第一性原理重新核算。
      - - 收入质量低于预期
        - 尽调显示披露收入大多是总额转手收入，或利润率显著低于投资者假设
        - 即便名义收入真实，有效估值倍数也会急剧上升。
        - 按更低净收入或更低倍数假设重新给公司估值。
      - - 集中度偏高
        - 少数客户或供应商主导 GMV、确认收入或容量，替代路径薄弱
        - 中立性和多元化不再是护城河，而变成口号。
        - 下调确信度、压缩倍数，并重估下行。
      - - 直接云替代上升
        - 具名客户越来越多地把耐久工作负载迁往直接供应商或内部采购
        - 经纪层变成过渡便利，而不是耐久基础设施。
        - 削减乐观情景概率，并把基准情景视为上限。
      - - 融资条款对投资者不友好
        - 优先权、可转债或合同绑定债务，实质性压低新股权或普通股等价上行
        - 名义估值不再反映可投资经济性。
        - 拒绝当前条款，或要求重置。
    notes: 这些触发条件旨在直接转化为估值受损，而不是泛泛的运营担忧。
    claimRefs:
      - CV009
      - CV037
      - CV041
      - CV045
      - CV046
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 经审计收入桥接与会计政策
        - 确认收入、GMV、take rate、principal-agent 政策，以及 2024 年至当前 2026 年退出 run-rate 的 cohort 桥接
        - 如果投资者不知道收入实际代表什么，当前倍数就没有意义。
        - 财务尽调、审计师材料包和财务总监备忘录。
      - - 客户留存与集中度
        - NRR、GRR、流失、客户数量、头部账户占比，以及分细分市场支出扩张
        - 分母质量之外，耐久性是最大未解变量。
        - RevOps 导出、董事会 KPI 材料和客户访谈。
      - - 供应商集中度与 SLA 韧性
        - 头部供应商占比、替代矩阵、利用率历史、故障历史，以及 SLA 或赔付信用框架
        - 中立聚合只有能顶住供应商故障或重新定价，才有价值。
        - 运营尽调和供应商侧合同审查。
      - - 股权结构与融资条款
        - 证券类型、清算优先权、参与权、反稀释条款、老股出售、补充协议，以及任何与客户合同绑定的债务
        - 名义估值可能显著高估真实股权价值。
        - 律师审查融资文件和股权结构。
      - - 治理与继任
        - 当前董事会、投票控制、创始人权利、运营者继任和升级责任归属
        - 治理不透明是这个投资论点最快破裂的路径之一。
        - 董事会材料包、章程文件和管理层访谈。
      - - 信任、合规与企业就绪材料包
        - 出口管制、制裁、隐私、安全、事件和 DPA 材料，以及真实认证状态
        - 退出就绪和溢价倍数延续都需要不止一个稀疏的信任页面。
        - 法务、安全和企业客户尽调。
    notes: 如果这些问题无法清楚回答，正确反应是继续跟踪公司，而不是追当前价格。
    claimRefs:
      - CV008
      - CV013
      - CV016
      - CV017
      - CV042
      - CV043
      - CV048
