  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 这张定性热力图按发生可能性和影响程度梳理 Andromeda 的主要风险；治理不透明、供应商依赖和资本—产能复杂性占据右上角。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 重大影响
      rows:
        - label: 高可能性
          values:
            - 信任披露薄弱
            - 执行资源缺口
            - 客户多供应商并用
            - 治理 / 连续性不透明
        - label: 中等可能性
          values:
            - 设施 / 安全不透明
            - 合规控制缺口
            - 供应商可靠性 / 可替代性
            - 资本—产能 / 贷款方依赖
        - label: 低可能性
          values:
            - 公开诉讼意外
            - 单个关键岗位招聘失误
            - 制裁 / 出口执法事件
            - 客户集中度冲击
    approximationNotes: 可能性和影响程度是基于公开来源作出的定性判断，并非量化概率模型。
    claimRefs:
      - CR042
      - CR045
      - CR046
      - CR047
      - CR048
