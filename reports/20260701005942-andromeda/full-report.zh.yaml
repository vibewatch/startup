      - number: '7.2'
        title: 监管、法律、隐私和信任风险
        blocks:
          - type: paragraph
            body: >-
              即便没有确认的公开诉讼或执法行动直接指向 Andromeda，监管和法律风险仍然重要。核心原因在结构上：Andromeda 公开把自己描述为连接客户和基础设施供应商的全球 GPU
              市场，而隐私政策确认公司会处理联系人、账户、账单和服务使用信息。这意味着公司不只是营销 GPU；它还集中管理敏感交易对手、合同和数据流。BIS 和 Federal Register
              材料显示，先进计算控制现在已经直接覆盖规避、目的地风险和受控芯片扩散。OFAC 框架让制裁合规不仅适用于美国实体，也适用于使用美国原产货物或服务的外国实体。与此同时，FTC
              指引让隐私承诺和事件响应都具备运营后果。Andromeda
              的缓释姿态可见但不完整：公司正在招聘承担隐私和出口职责的商业律师，但本轮审阅的信任中心仍很稀疏，没有提供谨慎企业买方或投资人预期看到的认证、状态或事件历史细节。因此，正确的承保姿态不是假设存在隐藏问题，而是把出口筛查、制裁筛查、事件响应、DPA
              流程和信任证据列为放行前尽调要求。
