      - - Andromeda 公开报价
        - DCD 保留了每 H100 小时 $2.40-$3.00、最多 2,000 个 H100 可在数小时内交付的信息
        - 单一窄口径公开报价，不是挂牌目录
        - 可能代表总额计算转售经济性、经纪式预留费率，或薄利转手报价
        - 本轮留存的唯一 Andromeda 公开价格；没有抽成率披露
      - - CoreWeave 直连云
        - H100 按需 $49.24/小时；spot $19.71/小时；承诺用量折扣最高 60%
        - 挂牌标价
        - 主云服务商通常直接确认基础设施收入
        - 高端打包、网络和服务等级让直接比较并不完美
      - - Lambda 直连云
        - H100 $3.99/GPU 小时；集群规模 16 到 2,000+ 个 GPU；预留容量通过销售协商
        - 挂牌标价加协商型预留交易
        - 直接供应商经济性，不是中立经纪
        - 对更大的预留训练集群是有用基准
      - - RunPod 开发者与集群路径
        - H100 PCIe $2.89/小时，H100 SXM $3.29/小时，覆盖 pods、serverless 和集群
        - 挂牌标价
        - 用量驱动的直接云和 serverless 经济性
        - 最适合作为自助买家的低摩擦价格底
      - - Vast 市场
        - 按需、可中断和预留条款；可中断便宜 50%+；1/3/6 个月预留；不要求长期合同
        - 实时市场价格
        - 市场式经济性，锁定有限，按秒计费
        - 说明透明交易所式供给会如何挤压价差
    notes: 本表有意把 Andromeda 唯一公开报价与官方竞品价格卡放在一起，用来框定变现语境，不主张它们的实际成交价可以苹果对苹果比较。
