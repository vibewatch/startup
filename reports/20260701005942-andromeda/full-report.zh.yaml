      - number: '4.2'
        title: GTM 动作、价格框架与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              GTM 动作看起来更像企业级顾问式销售，而不是自助服务。Andromeda 的客户表单要求买方填写 GPU 类型、数量、期望开始日期和所需周数；供应商表单要求卖方填写最低可预订 GPU
              和最短周期。这是协商式基础设施采购的语言，不是低摩擦 SaaS 扩张。Upstarts 和 SiliconANGLE 描述的买方集合也支持这一判断：其中包括每年在基础设施上花费约 $250M-$500M 的 AI
              公司。若这些买方具有代表性，销售周期更可能取决于集群验证、法律条款和时间线保障，而不是数字化需求生成。因此，公开证据不支持经典 CAC 或回本期计算，但支持一个收入密度代理指标：公开员工数信号约 17 到 20
              人，对应报告约 $100M run-rate，意味着每名员工收入约 $5.0M-$5.9M。


              定价参照集也说明了 Andromeda 的可能角色。CoreWeave、Lambda、RunPod 和 Vast 都发布明确价格或合同结构，但这些结构差异很大：CoreWeave 的 H100 按需价格远高于
              RunPod 和 Lambda 标价，而 Vast 强调按秒、可中断和短期预留条款。这种离散度说明，该市场的经济价值不只是原始 GPU 访问；它还围绕合同周期、在线保障、网络、支持和验证打包。Andromeda
              的公开材料符合这种解释。公司不发布价目表，但主打标准化合同、基准测试和单一运营界面。可能的结果是，当客户为采购确定性和供应商标准化付费时，Andromeda 获胜；当买方只想买最便宜的可见 H100 hour
              时，它并不占优。
