  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与替代方案类别
        blocks:
          - type: paragraph
            body: >-
              Andromeda 的买方并不是在一张整齐的 GPU 初创公司清单中选择。真实选择集合至少分成五类。第一类是 CoreWeave 和 Lambda 这类供应商自有 AI
              云，销售自己的容量、合同和支持栈。Vast.ai 在预算重叠上接近这一类，尽管结构不同：它本身也是市场，但让价格形成和许多商业条款更贴近底层主机。第二类是存量 超大规模云厂商——AWS、Google Cloud
              和 Azure。对许多企业而言，它们仍是默认现状，因为它们把加速器库存、经审计的合规计划和既有预算关系打包在一起。第三类是相邻的编排和弹性产品，如 NVIDIA Run:ai、RunPod 和
              Modal；它们为部分团队去掉足够多运营摩擦，使其完全避开经纪式采购层。第四类是使用 NVIDIA DGX SuperPOD 等系统做内部建设或 on-prem 部署。第五类是与供应商直接双边签约，也就是
              Andromeda 称其通过基准测试、标准条款和一张发票来简化的经纪商出现前现状。


              这种框架重要，因为 Andromeda 最强的公开差异化不是绝对价格领先，也不是独家拥有供应。它的主页和供应商流程描述的是一个中立市场层，跨 100+ 供应商和 1,000
              多笔已完成交易采购、基准测试、认证并标准化容量。当买方重视供应商发现、资质验证和商业简化，超过忠于任何单一云时，这一点最强。当买方已经信任某一家供应商、能在几分钟内自助拿到所需
              GPU，或规模足以支撑直接合同或内部建设时，这一点最弱。因此，潜在进入者集合与具名对手同样重要：任何供应商只要获得更好的编排、更好的合规包装或更好的销售覆盖，都能向复制经纪层某一部分再迈近一步。
