        - 买方和供应商表单以及官方工作流都指向跨第三方供应商的预留或排期容量采购。
        - 合约 GPU 小时、集群预留或最低消费承诺
        - 有公开依据
        - 如果按净额确认且按账户续约，可能是有吸引力的经常性收入。
        - 提供承诺采购与其他全部活动之间的产品级收入拆分。
