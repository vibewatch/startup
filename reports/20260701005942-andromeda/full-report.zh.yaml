      - - Lambda Cloud
        - 直接 AI 云
        - 100,000+ 云注册；5,000+ 硬件或私有云客户；2025 年 Series D 后累计股权融资 $863M
        - 寻求自助服务加大型专用集群的 AI 开发者、训练团队和企业
        - 清晰公开定价、自助实例、1-Click 集群，以及 SOC 2 Type II 信任姿态
        - 主要销售自有容量，而不是聚合碎片化外部供给
      - - Vast.ai
        - 市场型替代方案
        - 供需交易所上有 20,000+ 块 GPU、40+ 个数据中心、68+ 种 GPU 类型
        - 价格敏感的研究员、初创公司和溢出买方，愿意自行管理更高波动
        - 实时市场定价、无长期合约、主机多样性广
        - 托管采购、支持和企业信任深度低于最强的直接云或超大规模云厂商
      - - SambaNova
        - 邻近既有厂商 / 推理栈
        - 2026 年 Series E 超 $350M；与 Intel 战略合作；主权和 SoftBank 相关部署
        - 更看重推理经济性、而非中立供给聚合的企业、主权项目和服务商
        - 垂直整合推理平台，讲 GPU 替代叙事，主权角度很强
        - 不太像通用外包多供应商训练采购的直接经纪替代
      - - NVIDIA Run:ai 编排平台
        - 编排邻近方案
        - NVIDIA 旗下企业软件平台，支持云托管和混合部署路径
        - 在公有云、私有云、混合或本地环境管理 GPU 的企业
        - 动态 GPU 编排、策略控制和异构资源池化
        - 不直接供应算力，归属 NVIDIA 后中立性下降
      - - RunPod / Modal
        - 无服务器与弹性云邻近方案
        - RunPod 称有 1M+ 开发者；Modal 宣传可从 0 即时自动扩展到 1000+ 块 GPU
        - 看重速度和按秒计费经济性的开发者、推理团队和溢出买方
        - 低摩擦部署、透明或用量定价，以及强突发弹性
        - 不太适合经纪式采购、长期多供应商寻源，以及最重监管账户
      - - AWS / Azure / GCP
        - 既有默认方案
        - 全球云规模；本组最深的公开合规目录
        - 已通过既有云账户采购的企业、政府和受监管团队
        - 既有采购路径、已审计合规广度，以及直接访问加速器实例
        - 不中立，且可能价格高、容量受限，或设计上就是单供应商
      - - 内部建设 / DGX SuperPOD
        - 内部替代方案
        - 可扩展到数万块 GPU 的交钥匙 AI 数据中心路径
        - 资金充足、需求持续且有平台人才的实验室、主权项目和企业
        - 部署后控制力最高，且无中介抽成
        - 资本开支重、部署复杂，对小买方来说见效更慢
    notes: 本表覆盖留存来源能证明的主要直接、邻近、既有和替代路径；它是 2026 年买方格局选样，不是所有 GPU 云的完整普查。
