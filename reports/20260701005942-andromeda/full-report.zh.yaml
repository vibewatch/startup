        - 直接云和市场把供应商搜索做得更容易，也能绕过经纪商直接销售
        - 高
        - Lambda、Vast、RunPod 和 CoreWeave 都提供直接购买路径或公开价格锚
        - 索取赢单 / 输单数据，证明 Andromeda 在速度、质量或总成本上能击败已知直接云
      - - 认证与集群资格评估
        - 上游供应商可以加入自己的基准测试、支持或专用推理打包
