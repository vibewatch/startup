        - ~8.7x P/S，基于 ~$6.23B TTM 收入；市值 ~$54.3B
        - 最好的公开纯 AI 云可比，反映当前投资者胃口。
        - 自有基础设施、take-or-pay 合同和极高集中度，让它成为非常不同的模式。
      - - DigitalOcean
        - 2026 年 7 月市值 / TTM 收入
        - ~17.4x 收入；基于 ~$0.94B TTM 收入，市值 ~$16.38B
        - 有用的轻资产公开云参照，且有备案支持的多元化和合同结构。
        - 更广泛的 SMB 云平台，披露更强，市场平台不透明度低得多。
      - - Nebius Group
        - 2026 年 7 月市值 / 当前收入
        - ~135x 收入；基于 ~$0.52B 收入，市值 ~$70.11B
        - 显示 2026 年市场愿意为 AI 基础设施期权价值拉伸到多远。
        - 投机性太强，垂直差异也太大，不能当作干净可比。
      - - Amazon / AWS 语境
        - 2026 年 7 月全公司市值
        - ~$2.563T 市值
        - 只适合作为现有巨头的信任、采购和捆绑上限，说明它们如何压制经纪商价值。
        - 全公司语境，不是中立 GPU 中介的直接估值倍数。
    notes: 这是本章明确选出的完整可比篮子：标的标记估值，加上三个公开 AI / 云参照和一个现有巨头语境行。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive for the explicitly chosen valuation basket in this chapter — Andromeda, CoreWeave, DigitalOcean,
        Nebius Group, and Amazon / AWS context as the full set of named references.
