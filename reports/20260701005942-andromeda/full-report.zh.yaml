        - 官方和媒体来源描述了基准测试、认证和价格指数，但没有披露单独变现。
        - 潜在嵌入式价差或订阅
        - 公开信息不清
        - 可能被打包进计算经济性，而不是单独销售。
        - 明确基准测试和价格情报是单独变现，还是嵌入抽成率。
      - - 供应商侧激活与资格评估
        - 供应商工作流要求详细入驻和标准化条款，但没有公开供应商费率表。
        - Unknown
