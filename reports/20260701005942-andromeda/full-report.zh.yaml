  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险栈和投资含义
        blocks:
          - type: paragraph
            body: >-
              Andromeda 的公开风险栈并不均匀。最高的剩余风险，是 Nat Friedman 和 Daniel Gross
              退居幕后之后，治理和连续性仍不透明，公开控制权披露也很薄。这很重要，因为两位创始人曾是早期供给、赞助方和客户叙事的核心，而 Wil Moushey
              现在看起来是运营重心。第二个风险是运营和供应商依赖：Andromeda 的价值主张建立在采购、基准测试、签约和支持第三方供给上，而不是自有标准化超大规模云栈。第三个风险是客户集中和多云并用，因为业务公开服务保密
              AI 实验室，仍未披露客户数和留存数据，且至少一位早期具名用户现在公开在 Google Cloud 上扩张。第四个风险是资本容量和利润率复杂度。Strategic Compute Finance 岗位和
              Moushey
              自己的评论都说明，贷款方关系、承保和营运资本架构是正在发生的问题，不是后台细节。第五个风险是出口管制、制裁、隐私和信任上的合规执行。招聘和供应商广度显示了公开缓释动作，但成熟控制的公开证据仍有限。投资含义很直接：Andromeda
              仍可能值得投，但前提是管理层能在资本投入前，用具体内部证据补上这些披露和控制缺口。
