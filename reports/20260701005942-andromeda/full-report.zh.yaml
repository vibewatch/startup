  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 当前证据
      - 哪些证据会改变观点
    rows:
      - - 中立经纪切入点
        - 官方流程和独立报道支持一个真实需求：多供应商寻源、资质审核和统一签约。
        - 证明客户续约和扩张，是因为 Andromeda 在速度、结果或经济性上明显胜过直接采购。
      - - 真实商业规模
        - 公开报道支持 ~$100M 2025 年 run-rate，加上 100+ 家供应商、1,000+ 笔交易和超过 10 亿 GPU-hour 活动量。
        - 经审计的已确认收入桥接和客户数量披露，会把规模从「看起来可信」变成「可以承销」。
      - - 轻资产上行
        - 如果 Andromeda 不拥有大部分供给也能赚净价差，这个模式相对资本更重的云厂商可能值得溢价。
        - 拿出 principal-agent 会计处理、毛利率和营运资本机制，证明收入在经济上干净。
      - - 反论点：分母质量仍未知
        - 公开来源仍未显示，披露收入基数到底是总额转手收入，还是净经纪经济性。
        - 管理层认证的收入确认备忘录和 cohort 经济性，可能显著提高确信度。
      - - 反论点：耐久性和多云风险仍未解决
        - 具名客户证据很薄，没有公开 NRR 或 GRR，且至少一个早期用户正明显转向 Google Cloud 扩容。
        - 留存、集中度和钱包份额数据能说明 Andromeda 是黏性平台，还是好用的过渡层。
      - - 反论点：治理和融资不透明度仍高
        - 创始人似乎已不再活跃，控制权地图很薄，公开融资报道也缺少证券条款和优先权细节。
        - 董事会、继任和融资文件会显示，名义估值能否干净映射到可投资经济性。
    notes: 投资论点最强的地方是真实市场需求和表观规模；反论点最强的地方是隐藏经济性、隐藏集中度和隐藏条款。
