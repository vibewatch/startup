      - number: '3.2'
        title: 直接、相邻与替代定位
        blocks:
          - type: paragraph
            body: >-
              当买方想要大型企业 AI 云，而不是中立经纪商时，CoreWeave 是最危险的规模化直接替代方案。其公开材料把 AI 原生 基础设施、Kubernetes
              访问、存储、可观测性、专用推理，以及透明的按需、spot 和预留定价组合在一起。Lambda 的重叠方式不同：它提供更清晰的自助经济性和更快的首次触达，公开实例定价和 1-Click clusters
              可从数十块扩展到 2,000+ 块 GPU，同时还宣传 SOC 2 Type II 和单租户选项。Vast.ai 是最清晰的价格底线竞争者，因为它宣传一个覆盖 20,000+ 块 GPU 和 40+
              个数据中心的实时供需市场，且没有长期合约。SambaNova 与其中立市场对手属性较弱，更像面向推理密集型企业、主权部署，以及愿意采用垂直整合平台加 GPU 替代叙事客户的存量式替代栈。


              相邻集合通过只移除 Andromeda 解决痛点的一部分来竞争。NVIDIA Run:ai 争夺的是编排心智，而不是原始容量所有权：它把公共、私有、混合和 on-prem 环境中的资源池化，现在也被更紧地打进
              NVIDIA 软件栈。RunPod 和 Modal 攻击市场中低摩擦的一端，采用按用量、开发者优先的流程。RunPod 提供 pods、serverless 和
              clusters，并公开按小时和按秒经济性；Modal 则用 serverless
              按秒计费和初创公司抵扣额度，在云和区域之间路由工作负载。这些替代方案并不能完美替代大型专用集群的经纪式采购，但对溢出、实验、推理，以及更看重即时弹性而非托管式多供应商采购流程的团队而言，它们是可信替代品。
