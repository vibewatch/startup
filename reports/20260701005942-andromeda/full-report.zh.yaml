            body: 公开价格卡、serverless 弹性和 NVIDIA 主导的编排打包，意味着 Andromeda 不能只依赖市场混乱；它需要证明资质验证和统一签约能为买方创造可衡量价值。
            calloutType: risk
            claimRefs:
