chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品模式与总部信号
        blocks:
          - type: paragraph
            body: >-
              即便部分成立细节仍模糊，公开证据已相当清楚地说明 Andromeda 想成为什么。官网主页、洞察页、客户页、供应商页和隐私页面都指向一个双边算力市场：买方说明工作负载需求，供应方提交
              GPU、网络、地点和可用性细节；Andromeda 对供应做基准测试、标准化合同、路由需求，并给客户一个统一账单和支持关系。这个组合说明，Andromeda 更像 AI
              算力的中立市场基础设施层，而不是拥有大部分所售硬件的传统云运营商。官方文案中的产品叙事也一致：公司试图把采购、认证、定价和运营包进一个界面，让碎片化的 GPU 容量可用起来。


              公司身份字段更窄。官方页脚和隐私政策把法律实体标为 Andromeda Cluster, Inc.。Built In、公司 X 账号和 Gaebler 都指向 San Francisco
              作为当前基地，Gaebler 还给出 228 Grant Ave 这个邮寄地址信号。这个信息有用，但不应被视为总部最终结论，因为官网并未公布街道地址。创立时间也需要细分：Upstarts 把 Wil
              Moushey 的招募放在 2023 年 11 月下旬，而 2026 年 3 月的发布文章称团队已花三年时间搭建算力市场基础设施。因此，后续章节最稳妥的事实底座是：项目起源于 2023 年末，运营基地在 San
              Francisco，当前商业模式以撮合并运营第三方算力为核心，而不是直接拥有超大规模云厂商级足迹。
