  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              最干净的市场定义，应先界定 GPU 即服务（GPUaaS）包含什么，再收窄到 Andromeda 的实际赛道。The Business Research Company 将 GPUaaS 定义为按需虚拟化 GPU
              访问，用于机器学习、高性能计算和高级可视化，客户无需拥有硬件。其市场定义包括 GPU 托管、工作负载编排、资源配置，以及训练或优化服务。Andromeda
              自己的表述更窄也更具体：它不只是出租自有集群，而是作为市场基础设施，对第三方供应做基准测试、标准化合同、路由工作负载，并在 AI 构建者与基础设施供应商之间运营单一支持关系。这意味着，最相关的支出池是外包 GPU
              容量，加上让异构供应可用起来所需的协调层。


              重要相邻市场大于 Andromeda 的直接品类。AWS、Google Cloud 和 Azure 的超大规模云厂商加速器实例是核心替代品，因为买方可以直接预留或突发使用 H100 和 H200
              级集群。RunPod、Lambda、CoreWeave 和 Vast 等专业自有 GPU
              云是另一组替代品；它们在没有中立经纪商居中的情况下销售按需、spot、可中断或预留容量。与电信运营商、加密矿工、MSP，以及主权云或初创云直接双边交易，也属于现状采购路径，因为这些正是 Andromeda
              称其聚合的原始供应。


              排除项或仅相邻支出同样重要，可约束估值纪律。购买 GPU、融资服务器、建设数据中心、租赁电力，或为内部自有集群签长期容量，不等于购买经纪式外包算力。模型 API 支出也不是直接等价物：API
              推理可以替代一部分推理用例，但买不到专用集群控制权。实务结论是，应把 Andromeda 放在外包、多供应商训练与推理基础设施市场和采购流程中分析，而不是整个 AI 资本开支浪潮。
