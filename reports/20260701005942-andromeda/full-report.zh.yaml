      - CE017
      - CE018
      - CE024
      - CE031
      - CE037
      - CE038
  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制领域
      - 公开状态
      - 范围
      - 缺口
      - 来源信号
    rows:
      - - 隐私和控制者 / 处理者模型
        - 已公开声明
        - 商用平台、控制者 / 处理者区分；在 GDPR 或 UK GDPR 场景下可按要求提供 DPA
        - 未发现公开模板 DPA 或已谈妥的企业隐私附件
        - 隐私政策
      - - 核心安全控制
        - 已公开声明
        - 访问控制、传输和静态加密，以及持续监控
        - 未发现公开 SOC 2、ISO 27001、渗透测试摘要或等效审计材料
        - 隐私政策和信任中心框架页
      - - 提供方质量筛查
        - 公开声称
        - 上线前需满足性能和安全要求，并通过企业级基准验证
        - 公开基准测试套件、阈值和重新认证节奏未披露
        - 官网、提供方工作流和 SiliconANGLE
      - - 可靠性工程纪律
        - 招聘信号强
        - SLO、错误预算、复盘、可观测性和面向 GPU 基础设施的事故响应
        - 没有公开正常运行时间指标、状态页或面向客户的事故档案
        - Built In 和 RemoteOK 职位描述
      - - 公开信任披露界面
        - 稀疏
        - 存在信任中心，隐私政策也较详细
        - 相比公司对可靠性和标准化的主张，披露界面仍偏薄
        - 信任中心和已审阅的官方页面
    notes: 公司披露隐私的内容多于可由外部验证的安全或可靠性表现。
    claimRefs:
