  - id: TI005
    title: 公开财务缺口
    columns:
      - 缺失指标
      - 对承销的影响
      - 精确尽调路径
    rows:
      - - 总额 / 净额收入确认政策
        - 没有它，估值倍数和收入质量都不可信。
        - 索取 ASC 606 备忘录，并按产品线调节 GMV 到已确认收入。
      - - 抽成率 / 经纪价差
        - 无法把客户支出或交易数量转成贡献经济性。
        - 索取按合同类型和主要账户 cohort 划分的抽成率历史。
      - - 账面现金、烧钱和资金续航
        - 仅凭公开材料无法评估资本充足性。
        - 索取月度管理账、现金桥和 13 周现金预测。
      - - 毛利率与服务交付成本
        - 没有收入成本细节，利润率路径仍是猜测。
        - 索取按工作负载类别划分的毛利率和支持成本分摊。
      - - 客户集中度与合同期限
        - 如果一两个实验室贡献多数收入，小团队模式风险很高。
        - 索取前 10 大客户明细、期限摘要和按 cohort 续约情况。
      - - 营运资本条款和担保
        - 所谓轻资产经纪商仍可能因预购或担保消耗现金。
        - 索取 DSO、DPO、预付款政策、供应商条款和任何信用证。
      - - 债务、信贷或项目融资义务
        - 隐藏杠杆会实质改变承销和下行风险。
        - 索取债务时间表、契约包和任何表外承诺。
      - - 经审计的 2024-2025 财务报表
        - 媒体报道不足以确认盈利质量或资产负债表强度。
        - 开放尽调室，提供经审计财务、董事会预算和与 cap table 联动的资金管理摘要。
    notes: 这些缺口是具体阻碍，导致公开材料今天还无法支撑完整投资承销决策。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-critical missing financial inputs identified in this chapter, rather than every
        possible private-company diligence request.
    claimRefs:
      - CI015
      - CI016
      - CI041
      - CI043
      - CI044
      - CI046
      - CI047
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 功能
      - 差异化
      - 成熟度 / 状态
      - 尽调缺口
    rows:
      - - 买方需求录入与寻源工作流
        - AI 实验室、创业公司或企业基础设施买家
        - 收集 GPU 类型、数量、地区和时间线等工作负载需求，然后启动寻源和定价
        - 把碎片化容量发现变成一个结构化录入动作
        - 已上线且公开可见
        - 没有公开证据显示其已有自助 API、调度器插件或客户可配置的策略界面
      - - 提供方接入和认证流程
        - 数据中心、云厂商、电信运营商或其他算力提供方
        - 采集 GPU、网络、存储、位置、接口和可用性数据，再把集群送入资质认证和需求匹配
        - 在供给触达买方之前，先把异质供给标准化
        - 已上线，且公开可见
        - 基准测试套件、通过阈值和补救规则尚未公开
      - - 基准测试、定价和合同标准化
        - 买方和提供方的商业运营人员
        - 对供给跑基准测试，在网络内定价，标准化 SLA 和合同，并暴露价格指数信号
        - 把市场情报和交易执行结合起来，而不是只做被动挂牌
        - 公开说法中已上线，方法不透明
        - 价格指数、基准测试权重或合同模板的方法尚未公开
      - - 多提供方编排和控制平面
        - 内部平台团队和客户技术团队
        - 在 VM、Kubernetes、裸金属和调度器上抽象一层，用于训练或推理任务的开通、生命周期管理和路由
        - 基于异质算力底座建立一层统一控制层
        - 正在积极建设，招聘信号强
        - 没有公开架构文档、API 参考或发布说明证明功能完整度
      - - 运维、可观测性和事故支持层
        - 客户平台团队和 Andromeda 运维人员
        - 提供可观测性、故障排查、可靠性监控、事故响应和部署后优化
        - 承诺提供类似超大云厂商的支持，但不要求客户直接管理每个提供方
        - 真实存在，且在扩张
        - 公开 MTTR、正常运行时间和事故历史指标缺失
      - - 解决方案工程和 POC 流程
        - 技术买方、安全负责人和平台团队
        - 负责演示、参考架构、评估计划、成本建模，以及从 POC 到生产的交接
        - 让平台比单纯经纪式原始容量更容易购买和部署
        - 活跃且团队配置清晰
        - 关于完整部署流程的公开客户案例仍然稀少
    notes: 各行反映公开工作流页面、招聘材料和独立报道中明确可见的产品界面，而不是所有内部子系统。
    enumerationScope:
