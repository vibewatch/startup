      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向几个不同需求分段，而不是一个泛泛的「AI 公司」买方。前沿实验室和训练密集型模型构建者是最清晰的第一类：Andromeda 自己的需求表要求潜在客户填写 GPU
              类型、集群规模、开始日期和所需周数；SiliconANGLE 报道称，部分当前目标客户每年在基础设施上花费 $250M-$500M。这与开发者刷卡买一块 GPU 完全不是同一种采购动作。第二类是风投支持的 AI
              初创公司和扩张期公司，需要快速获得 H100 或 H200 级容量，不想等待超大规模云厂商分配或签僵硬的多年合约。第三类是企业 AI 平台和受监管 HPC 团队；它们可以直接使用 AWS、Azure 或
              Google，但当配额、交付期或成本形成约束时，仍会在意溢出容量、地域多样性或替代供应商。


              在这些分段中，用户、买方和付款方并不是同一个人。可能的终端用户是研究员、训练工程师、推理工程师和平台团队。买方通常是基础设施或平台负责人，决定一个工作负载应跑在
              超大规模云厂商、专业云、自有集群还是经纪式供应上。真正为有意义承诺付款的一端更集中：云财务负责人、采购，或 CFO 支持的基础设施预算会批准预留或长周期容量。Andromeda
              表单间接体现了这种分工：它询问时间、周期、最低可预订容量和价格；S&P 对企业 AI 决策者和买方标准的表述也呼应这一点。更小或容错性更高的工作负载走另一条路径，通常通过 Vast 或较低层级 RunPod
              库存等 spot 或可中断市场出清。


              Andromeda 的供应侧也分层。公司称，容量存在于电信和加密挖矿数据中心、传统
              MSP、主权云、初创云，甚至其他实验室的资产负债表上。其供应商流程显示了为何这重要：卖方必须披露网络、存储、地点、最低周期和价格，这意味着这个市场实质上是在技术匹配、合同形态和时间跨度之间做匹配。因此，采用路径更接近基础设施采购，而不是软件自助服务：定义工作负载，指定
              GPU 和周期，对候选集群做基准测试，确认合同与运营要求，在合适底座上部署，然后才考虑续约或多供应商扩张。
