    title: 收入模型桥——从工作负载请求到确认收入
    type: flow
    layout: wide
    summary: 展示买方需求、供应商供给、合同和支持如何转化为 Andromeda 收入，同时标出总额确认还是净额确认这个未解步骤。
    data:
      nodes:
        - id: buyer_brief
          label: 买方工作负载简报
          detail: 客户在需求入口提交 GPU 类型、数量、开始日期、区域和所需周数。
        - id: supply_match
          label: 多供应商供应匹配
          detail: Andromeda 在 100+ 家供应商之间做基准测试并寻找容量。
        - id: contracting
          label: 标准化合同
          detail: 标准化合同、一张发票和一个支持渠道。
        - id: deployment
          label: 部署和持续支持
          detail: 集群认证、可观测性、支持和故障排查。
        - id: recognized_revenue
          label: 确认收入
          detail: 可能是按总额转售基础设施，也可能只确认净经纪经济收益；公开政策未披露。
        - id: gross_profit
          label: 毛利 / 贡献
          detail: 取决于抽成率、支持成本，以及任何预付款或担保负担。
      edges:
        - from: buyer_brief
          to: supply_match
        - from: supply_match
          to: contracting
        - from: contracting
          to: deployment
        - from: contracting
          to: recognized_revenue
        - from: deployment
          to: gross_profit
        - from: recognized_revenue
          to: gross_profit
    approximationNotes: 该流程有证据支撑，但不是定量图：未解步骤在于 Andromeda 是按总额确认基础设施支出，还是只确认净经济收益。
