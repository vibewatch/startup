      - number: '3.3'
        title: 定价、信任与切换动态
        blocks:
          - type: paragraph
            body: >-
              公开定价透明度，是这个市场可能比 Andromeda 估值叙事更快商品化的最清晰原因之一。CoreWeave 发布了大量按需和 spot 价格卡，并为承诺用量提供最高 60% 的预留折扣。Lambda
              发布直接的每小时费率和自助实例访问。Vast.ai、RunPod 和 Modal 都披露透明或按用量计费的经济性，让买方能快速对标替代方案；Vast 还明确宣传没有长期合约。Andromeda
              自己的公开材料更强调流程、认证和统一支持，而不是公布标价。这本身并不说明模式弱——经纪式基础设施本就应靠更好的总结果而非原始标价来销售——但确实意味着，买方可以很快锚定直接云或 serverless
              替代方案，并要求 Andromeda 用速度、质量和合同简化来证明任何价差。


              信任和切换成本则朝另一个方向作用。CoreWeave、Lambda、Modal、RunPod，尤其是 AWS、Google Cloud 和 Azure，都比 Andromeda
              当前稀疏的信任页面公开了多得多的安全与合规控制细节。超大规模云厂商的信任姿态明显最强，因为它们发布广泛的合规目录、第三方证明和受监管行业覆盖。多宿主在技术和商业上也可行。Run:ai
              为编排异构环境而生；Modal 跨云路由；Vast、RunPod 和 Lambda 依赖短周期或按用量结构；最大买方仍可选择内部建设。结果是，这个市场存在有意义但并非不可逾越的锁定。只有当客户把
              Andromeda 深度嵌入供应商资质验证、SLA 标准化和持续多供应商运营时，其切换成本才可能真实存在；若客户主要只是从一个已知供应商租一个集群，切换成本就弱得多。
