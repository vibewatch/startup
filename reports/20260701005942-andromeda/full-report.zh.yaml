      - number: '6.3'
        title: 持久性、扩张路径和集中度风险
        blocks:
          - type: paragraph
            body: >-
              持久性是公开材料最薄弱的地方。已审阅来源没有披露
              NRR、GRR、流失率、续约率、合同期限、队列曲线，甚至没有披露当前客户数。这不代表业务没有留存，而是外部投资人无法从公开证据核验。可用的最好代理指标只有方向性。官方和第三方来源显示，公司有可重复的交易流，部署后仍持续介入的服务层，以及一位匿名创始人告诉
              Upstarts：他们的公司继续与 Andromeda 合作，是因为它像外包工程团队，比超大规模云厂商更灵活。与此同时，同一位创始人也主动给出核心持久性警示：如果创业公司规模足够大，最终可能把这些能力收回内部。


              扩张路径看得见，但转化率看不见。Solutions Engineer 岗位描述了一套 land-and-expand 动作：靠演示、POC、客户 ROI
              和战略账户里的成功生产交接来扩张。合作岗位更进一步，明确点名 GPU 供应商、AI 实验室、OEM、VC 基金和加速器都是渠道放大器，并称合作 KPI 与收入贡献、利用率和增长挂钩。这说明 Andromeda
              试图同时扩大直接企业式销售，以及把需求导向平台的投资组合或生态渠道。采购、算力交易和业务人员岗位也暗示，公司正在实时平衡客户需求、供应商经济性和合同结构。


              同样的特征也制造集中度风险。业务起源于 NFDG 生态，Upstarts
              称许多投资组合公司仍是客户，即使它们已不再享受优先待遇。客户不透明也让头部账户风险无法量化：最大的实验室很可能最保密，也最难作为引用。采购摩擦也不轻。法务、安全、出口、财务和定制供给岗位都说明，大账户的签约和留存是高接触流程，而不是低摩擦自助动作。并且，由于
              Andromeda 往往凭借分数化采购和 SRE 层取胜，一些成熟客户最终可能把这项能力内化。因此，商业故事具备扩张能力，但公开层面还没有足够持久性，无法在没有管理层室数据的情况下承保。
