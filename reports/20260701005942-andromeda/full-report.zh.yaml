  - id: TI004
    title: 资本充足性
    columns:
      - 项目
      - 公开数值 / 状态
      - 为什么重要
      - 可比对象 / 背景
      - 尽调问题
    rows:
      - - 账面现金
        - Andromeda 未披露
        - 缺少该数据，无法判断 2026 年 3 月融资后的资产负债表韧性。
        - CoreWeave 和 DigitalOcean 在文件中明确披露流动性。
        - 提供季末现金、受限现金和可用循环信贷额度。
      - - 月度烧钱
        - Andromeda 未披露
        - 仅凭估值或融资新闻推不出资金续航。
        - DigitalOcean 和 Amazon 披露现金流和资本开支细节；Andromeda 没有。
        - 提供月度运营开支消耗、任何资本开支，以及营运资本波动。
      - - 资金续航月数
        - Andromeda 未披露
        - 需要它判断下一轮融资是可选项还是被迫事项。
        - DigitalOcean 称现有现金和信贷至少覆盖 12 个月；Andromeda 没有类似表述。
        - 按董事会批准模型提供基准、计划和下行三种资金续航月数。
      - - 最近融资用途
        - 公开表述是扩大客户基础和团队建设；具体分配未知
        - 决定资金流向增长、预购、债务服务，还是防御性流动性。
        - 招聘数据体现财务、采购、合作伙伴和计算市场岗位需求。
        - 提供 2026 和 2027 年 sources-and-uses 预算。
      - - 下一轮触发条件
        - 未披露
        - 必须知道未来融资取决于增长、利润率还是隐藏承诺。
        - CoreWeave 使用与合同支持资本开支绑定的资产级融资；如果 Andromeda 真正轻资产，可能不需要。
        - 说明触发下一次融资或信贷工具的里程碑。
      - - 债务 / 项目融资义务
        - 未发现 Andromeda 公开披露
        - 即便是经纪商，如果担保供给或为预留融资，也会加杠杆。
        - CoreWeave 的 DDTL 5.0 以 SOFR + 4.50% 为合同资本开支融资，并带 DSCR 契约。
        - 提供债务时间表、担保、信用证和预留承诺。
      - - 营运资本与租赁敞口
        - 未公开披露
        - 如果回款滞后于供应商付款，可能成为隐藏资本强度驱动因素。
        - DigitalOcean 披露长期 co-lo 租赁义务；Amazon 披露 AWS 预付款和履约义务。
        - 提供 DSO、DPO、未实现收入、预付款和任何租赁承诺。
      - - 相对上市可比公司的披露深度
        - 低
        - 不透明本身就是融资风险，因为投资人只能盲承销。
        - CoreWeave、DigitalOcean 和 Amazon 都披露了 Andromeda 缺失的合同、流动性或义务细节。
        - 开放包含经审计财务和合同摘要的数据室。
    notes: 本表关注前瞻资本充足性，而不是重复融资轮历史；反复出现的主题是，上市可比公司披露现金、债务和义务，因此能被承销，Andromeda 则不能。
