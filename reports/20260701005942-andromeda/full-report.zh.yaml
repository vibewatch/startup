      - number: '3.4'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              Andromeda 故事中可持久的部分，不是它拥有最多 GPU 或最广合规目录，而是外包 GPU
              市场足够碎片化，中立协调层有存在价值。如果买方确实需要供应商发现、性能验证、标准化合同、一张发票，以及跨许多独立供应商的统一运营界面，那么 Andromeda 占据了一个真实切入口；单一 neo-cloud
              或单一超大规模云厂商都很难干净复制。这个切入口 应在溢出采购、多供应商风险管理，以及不愿过早押注单一直接供应商的买方中最强。


              问题在于，公开证据也显示这个切入口可能很快变薄。CoreWeave 的规模和积压订单证明，直接供应商可以建立强大的企业分销和基础设施控制优势；但 Fitch
              的分析也显示，这些对手自身承担客户集中度、杠杆和租约错配风险。NVIDIA 对 Run:ai 的所有权，以及 European Commission 认为 Run:ai
              目前并非主导性编排层，提醒我们：编排很可能向上打包进更大的基础设施栈，而不是永久作为稀缺独立层存在。同时，Lambda、Vast、RunPod、Modal 和 CoreWeave
              的公开定价，为市场大部分区域设置了可见商品参照点。因此，竞争结论是有条件的：Andromeda
              在中立聚合和采购简化上强于直接云，但在披露的信任深度、上游供应控制和直接预算所有权上更弱。只有当认证、路由和商业标准化转化为比客户直接采购更好的经济性或更快采购速度时，它的护城河才耐久。
