  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现信号与公开牵引
        blocks:
          - type: paragraph
            body: >-
              公开证据足以描述 Andromeda 的变现表层，但不足以把这个表层转成清晰的收入质量模型。官方流程文案持续显示一个双边 GPU 采购层：买方说明 GPU
              类型、数量、时间线和周期；供应商披露容量、最低可预订规模、周期和条款；Andromeda
              对供应做基准测试、标准化合同、路由需求，然后提供一张发票加一个支持渠道。这让公司的经济形态更接近高接触度基础设施经纪商或市场层，而不是拥有大部分所售硬件的传统云。同一份材料也说明，收入确认是核心尽调问题。坐在买方和供应商之间的公司，可以按总额或净额确认经济性，取决于合同控制权；保留的公开来源没有说明
              Andromeda 采用哪种政策。


              牵引比会计处理更清楚。官方页面称有 100+ 供应商、1,000+ 笔已完成交易、跨众多供应商的数十个集群，以及超过 10 亿 GPU-hour 活动量。独立报道给出了最强收入锚点：Upstarts 和
              SiliconANGLE 都把 2025 年收入 run-rate 放在约 $100M，2024 年收入超过 $50M，并称自推出以来盈利。Data Center Dynamics 还保留了本轮检索中唯一的公开
              Andromeda 价格线索：面向非 NFDG 买方，最多 2,000 块 H100，价格为每 GPU-hour $2.40-$3.00。这些事实支持真实商业规模，但核心承保问题仍未解决：Andromeda
              报告的收入，主要反映的是净经纪经济性，还是大得多的总额 转手基数。
