  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 判断仍偏谨慎：真实牵引力和 2026 年可比公司行情虽有支撑，但经济性、集中度和条款仍是隐藏变量。
    data:
      nodes:
        - id: traction
          label: 真实市场拉力
          detail: 100+ 家供应商、1,000+ 笔交易，且报道称 2025 年年化收入约 ~$100M。
          tone: positive
        - id: market
          label: AI 基础设施倍数支撑
          detail: 2026 年上市可比公司仍以溢价交易，但估值分化很大。
          tone: positive
        - id: denominator
          label: 分母风险
          detail: 收入按总额还是净额入账、真实利润率质量都未披露。
          tone: negative
        - id: durability
          label: 持久性风险
          detail: 留存、集中度、供应商替代和多供应商并用仍缺乏证据。
          tone: warning
        - id: terms
          label: 治理与条款不透明
          detail: 创始人连续性证据更薄，融资条款仍未公开。
          tone: negative
        - id: decision
          label: 决策
          detail: 继续跟踪，并守住价格纪律，直到尽调补上隐藏变量缺口。
          tone: neutral
      edges:
        - from: traction
          to: decision
        - from: market
          to: decision
        - from: denominator
          to: decision
        - from: durability
          to: decision
        - from: terms
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV035
      - CV037
      - CV038
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有收入质量强到让投资者愿意基于接近报道称约 ~$100M 的收入基数给出溢价倍数，当前估值才更容易站住。
    data:
      items:
        - label: 8x 倍数所需收入
          value: 187.5
          detail: 支撑 $1.5B 估值所需的收入（百万美元），假设采用更保守的 AI 基础设施倍数。
          tone: negative
        - label: 按 CoreWeave P/S 所需收入
          value: 172
          detail: 按 CoreWeave 约 ~8.7x 的上市 P/S 估算，所需收入约为多少百万美元。
          tone: warning
        - label: 15x 倍数所需收入
          value: 100
          detail: 当前报道称 2025 年年化收入锚点所隐含的门槛。
          tone: neutral
        - label: 按 DigitalOcean P/S 所需收入
          value: 86.2
          detail: 按 DigitalOcean 当前约 ~17.4x 的上市倍数估算，所需收入约为多少百万美元。
          tone: positive
        - label: 当前公开年化收入
          value: 100
          detail: 目前 Andromeda 可使用的最佳公开收入分母。
          tone: warning
    approximationNotes: 敏感性柱状图只用公开快照做简单估值算术，不调整稀释、总额 / 净额会计处理或优先权悬置。
    claimRefs:
      - CV004
      - CV018
      - CV019
      - CV024
      - CV025
      - CV032
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅看公开证据，只有 Andromeda 的隐藏经济性落在投资者有利一侧，区间中枢才会围绕当前估值。
    data:
      items:
        - label: 悲观情景
          low: 400
          mid: 600
          high: 800
          displayValue: $0.4B-$0.8B
          detail: 收入的经济性或持久性低于表面数据暗示。
          tone: negative
        - label: 基准情景
          low: 1000
          mid: 1300
          high: 1800
          displayValue: $1.0B-$1.8B
          detail: 业务真实存在，但市场仍会因留存、集中度和条款不透明而打折。
          tone: warning
        - label: 乐观情景
          low: 2200
          mid: 2900
          high: 3600
          displayValue: $2.2B-$3.6B
          detail: 净经济性强，分散度改善，经纪层证明有粘性。
          tone: positive
    approximationNotes: 区间来自公开锚点和简单倍数纪律构建的情景输出，不追求 DCF 精度。
    claimRefs:
      - CV032
      - CV036
      - CV037
      - CV039
      - CV040
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Andromeda 在市场真实度和潜在资本效率上得分较好，但公开证据充分性和下行保护明显较弱。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: 前文和当前来源都支持 GPU 采购确有碎片化问题。
          tone: positive
        - label: 商业验证
          score: 7
          detail: 报道规模有意义，但具名客户证据仍然薄弱。
          tone: positive
        - label: 资本效率潜力
          score: 7
          detail: 如果收入主要按净额计算、供给仍由外部承担，中立经纪商可以很有吸引力。
          tone: positive
        - label: 证据质量
          score: 4
          detail: 关键估值输入仍来自报道或推断的分母，不是审计口径。
          tone: warning
        - label: 治理 / 控制可见度
          score: 3
          detail: 创始人连续性证据更薄，公开董事会 / 控制权细节仍然稀少。
          tone: negative
        - label: 下行保护
          score: 3
          detail: 优先权结构、集中度和真实利润率结构仍未知。
          tone: negative
    approximationNotes: 得分是以引用的公开证据为锚的 0-10 序数判断，不是管理层披露的 KPI。
    claimRefs:
      - CV004
      - CV009
      - CV013
      - CV016
      - CV032
      - CV042
      - CV043
