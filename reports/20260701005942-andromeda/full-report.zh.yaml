      - number: '1.2'
        title: 创始人、当前领导层与治理不透明
        blocks:
          - type: paragraph
            body: >-
              创始人故事一致，但公开高管名单并不完整。Built In 和 Gaebler 都称 Andromeda Cluster 由 Nat Friedman 和 Daniel Gross
              创立。独立来源随后补上这件事为何重要：DCD 和 CB Insights 把 Friedman 定位为 GitHub 前 CEO、NFDG 联合创始人；Daniel Gross 自己的网站和 DCD 则把他与
              Apple、Y Combinator、NFDG 以及如今的 Meta 算力工作联系起来。这个组合让创始人在稀缺 AI 基础设施、客户引荐和资本获取上具备异常强的创始人与市场契合度。Upstarts
              补上缺失的运营桥梁：Gross 在 2023 年末招募 Wil Moushey 来运营该项目，第三方 2026 年 3 月报道则称 Moushey 为 CEO。


              治理透明度远弱于创始人与市场契合度。官网没有公开董事会名单、高管团队页面，也没有清晰的所有权或控制权地图。相反，当前公开可见的运营班底主要来自活跃招聘：法务、财务、合作伙伴、采购、业务运营、解决方案工程、软件和
              SRE 岗位都在招聘。这显示公司确实在搭组织，但也意味着部分重要管理职能仍在补人，或至少尚未公开点名。因此，关键人物依赖度较高。Moushey
              似乎是当前运营重心，而创始人仍主导历史叙事和赞助方网络。Friedman 与 Gross 后来转向 Meta，以及 Upstarts 称他们不再与 Andromeda
              保持活跃关系，是公开记录中最重要的领导层变化；在董事会、所有权和继任细节直接确认前，应一直作为尽调重点。
