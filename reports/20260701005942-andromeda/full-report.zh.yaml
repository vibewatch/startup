  - id: TU006
    title: 企业采购和证明可见度摩擦表
    columns:
      - 摩擦点
      - 公开信号
      - 对客户的影响
      - 商业含义
      - 尽调要求
    rows:
      - - 安全 / 数据处理审查
        - 隐私政策说明可按请求提供 DPA，并描述仅限业务用途的数据处理
        - 企业买家部署前可能需要正式的法务和安全审查
        - 可能拉长企业导入；但一旦成交，账户质量也更高
        - 要求提供标准安全材料包、DPA 模板和合规路线图
      - - 多方参与的技术评估
        - Solutions Engineer 岗位说明购买流程涉及高管、平台团队和安全负责人
        - 交易需要协调技术验证，不是简单的自助下单
        - 抬高售前成本，也更依赖稀缺的高级人才
        - 要求提供每笔交易的利益相关方中位数，以及按分部的转化率
      - - 关键收入合同
        - Built In 招聘摘要强调关键收入协议、隐私 / 出口和金融合作
        - 大额交易可能需要定制合同工作和合规审查
        - 可能拖慢成交，或缩小买家池
        - 要求提供平均红线修订周期和标准条款例外
      - - 实时供需匹配
        - Compute Trader 和业务岗位围绕把线索匹配到算力、最大化利用率
        - 客户在生产启动前可能需要定制寻源
        - 供给侧复杂度可能改善利润率，但也制造执行风险
        - 要求提供即时满足与逐步撮合的需求占比
      - - 客户背书不透明
        - 审阅材料未出现官方案例库或具名客户引语集
        - 潜在客户缺少公开证据来降低采购决策风险
        - 可能抬高 CAC，让企业销售更难
        - 要求提供客户背书计划细节，以及 NDA 下可背书客户名单
      - - 公开信任中心内容稀疏
        - 相比企业级主张，信任中心公开的实质内容很少
        - 重视安全的客户可能需要更深入的线下尽调
        - 削弱大客户公开转化支撑
        - 询问信任中心内容、SLA 披露和事故历史透明度路线图
