      - number: '1.3'
        title: 融资历史、估值锚点与规模指标
        blocks:
          - type: paragraph
            body: >-
              最强的清晰融资锚点是 2026 年 3 月的 Paradigm 交易。Upstarts 称，公司从 Paradigm 获得新融资，估值 $1.5B，且 Paradigm 对 Andromeda 的总投资现为
              $60M。Raising.fi 和 Gaebler 都重复了 $60M 这一数字，Gaebler 将该事件归为风险股权融资；SiliconANGLE 则称，尽管 Paradigm
              的累计投资达到这一水平，新近完成那一融资批次 的确切规模并不清楚。实务结论是，估值和赞助方身份有较好锚定，但轮次标签、证券类型和公司累计融资额没有。这个缺口重要，因为 NFDG
              似乎也曾在拆分独立前为前身集群投入超过 $100M，公开来源没有清楚区分拆分独立前资产建设与当前公司的股权资本。


              运营规模看起来比股权结构披露更扎实。官方和独立来源都指向 100+ 供应商和 1,000+ 笔交易，官方文案还补充了超过 10 亿 GPU-hour 活动量，以及跨众多供应商的数十个集群。Upstarts 和
              SiliconANGLE 都报道，2025 年收入 run-rate 约 $100M，2024 年收入超过 $50M，且自推出以来已经盈利。但几项重要指标仍缺失或只有区间：客户数量未公开披露，员工数只能从
              Built In 的 17 人和 Upstarts 的约 20 人侧面观察，也没有公开来源清楚确认二级交易、债务工具或拆分独立后完整资本结构。因此，后续章节应把估值、收入
              run-rate、供应商广度和交易量作为可复用锚点，同时明确提示客户集中度、融资机制和团队规模仍有保留。
