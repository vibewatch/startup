      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动清晰可见，且相互强化。S&P 称，在过去两年大部分时间里，AI 技术和云基础设施一直位居企业技术支出意向最高的类别；其买方洞察笔记称，专业 GPUaaS
              供应增长，是因为许多企业买不到足够芯片来运营自有系统。Andromeda 自己的市场文章补充了时间错配：AI 研究周期以周计，而数据中心建设需要 12 到 24
              个月。RunPod、Lambda、CoreWeave、Vast 和超大规模云厂商 价格卡带来更多供应和更高价格透明度，也进一步扩大买方集合，使溢出、实验和中端市场推理在经济上变得可行；这在 2023-2024
              年短缺高峰期并不成立。


              制动力不只是「短缺」，而是结构性的。Andromeda 的核心论点是，原始供应存在，但不可互换。网络、存储、集群健康度、地理位置、可预订周期和支持质量，都会实质改变一块名义相同 H100
              的价值。CoreWeave 的基准测试简报和 NVIDIA 的 H100 架构页面说明了原因：真实训练价值取决于 MFU、可靠性、NVLink、InfiniBand
              和周边软件栈，而不只是芯片名称。SesameDisk 还补充了买方现实：当发布日期很硬时，配额、区域限制、排队时间和账号状态往往比标价更重要。这有助于解释，为什么 超大规模云厂商等价价格能长期高于
              neo-cloud spot 底价，而市场不会立刻把价差套利掉。


              供应缓解也仍是局部的。Presenc 认为，瓶颈已从 H100 绝对稀缺转向 HBM3e 内存、CoWoS 封装、机柜电力和数据中心部署。这些最后一公里摩擦对 Andromeda
              很重要，因为它们提高了已认证第三方供应的价值；但它们也抬高了信任门槛：买方需要证明集群能按规格运行并保持在线。估值含义因此是双向的。正面看，碎片化、不可互换、受信任约束的市场，正是中立经纪商能创造价值的地方。负面看，单位价格下行和难以横向比较的价格卡，使外部很难仅凭公开数据推断持久抽佣率。关键尽调保留意见
              不是市场是否存在，而是 Andromeda 能否在单位价格通缩压缩价差前，从协调、认证和运营中捕获足够多的经常性经济性。
