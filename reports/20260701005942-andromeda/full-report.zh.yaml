        - 据称上线以来一直盈利
        - 中
        - 若属实，说明基础设施经纪商可能有强单位经济性，或 opex 异常精简。
        - 按季度披露 EBITDA、营业利润和自由现金流。
      - - 买方支出代理指标
        - 公开目标包括每年在计算上花费约 $250M-$500M 的买家
        - 中
        - 支撑大账户、企业式销售动作，也带来集中度风险。
        - 提供客户支出分层和头部账户集中度。
      - - 人均收入代理指标
        - ~$5.0M-$5.9M / 员工
        - 中
        - 显示收入密度高，但也可能反映总额列报或账户集中。
        - 把年化收入规模、员工数和岗位结构对齐到真实人均净收入。
      - - 销售周期代理指标
        - 起始日期和周数需预先提交；供应商披露最短期限和最低可预订 GPU 数
        - 中
        - 暗示这是顾问式基础设施采购，而非无摩擦自助转化。
        - 分享从首次通话到签约和部署的中位周期。
      - - 毛利率
        - 未公开披露
        - 低
        - 这是承销收入质量最核心的缺失输入。
        - 按产品或合同类型提供毛利率 % 和毛利额。
      - - CAC / 回本期
        - 未公开披露
        - 低
        - 需要用它区分高效企业销售与不稳定的创始人主导大单。
        - 提供销售和营销支出、新 ARR 或 GMV cohort 数据，以及回本期分析。
      - - 抽成率 / 价差
        - 未公开披露
        - 低
        - 没有它，年化收入规模无法转译为 GMV、贡献利润或竞争耐久度。
        - 按工作负载类别披露净抽成率或经纪价差。
      - - 营运资本强度
        - 未公开披露
        - 低
        - 回款和应付决定了一个看似轻资产的模式是否仍然耗现金。
        - 提供 DSO、DPO、预付款条款，以及任何供应商担保或预留承诺。
    notes: 这些接近空白的状态反映私营公司不透明；公开类比和估算都已清楚标注，没有被转成虚假的精确度。
