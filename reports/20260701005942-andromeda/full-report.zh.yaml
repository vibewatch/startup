      - number: '5.2'
        title: 架构、部署与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开运营模式是一套分层控制与支持栈，位于客户、供应商和异构执行环境之间。官方流程页面显示市场两侧都会收集结构化元数据，当前工程岗位则补上缺失的技术细节：Andromeda
              正在建设编排、资源配置、生命周期管理、API、服务和控制平面，用来抽象 VM、Kubernetes、bare metal 和基于调度器的环境。供应商表单明确接受 Kubernetes、Slurm 和 VM
              接口；软件工程岗位又把范围扩展到「VMs, Kubernetes, bare metal, schedulers」。这有力证明，公司在规范化多个基础设施底座，而不是强行要求一个栈。


              部署似乎也有意采用服务主导模式。解决方案工程岗位描述了技术发现、演示、POC、参考架构、基准测试和成本建模，然后才平滑交接到生产。站点可靠性岗位随后说明生产支持的形态：跨多个供应商配置 Kubernetes
              集群，使用 Terraform、Helm 和自动化工具，运营可观测性栈，并主导事故和事后复盘。最详细的公开技术信号来自高级 SRE 岗位，点名 topology-aware
              scheduling、InfiniBand、RoCE、NVLink、NCCL、CUDA、distributed PyTorch、GPU telemetry 和自愈自动化是核心关注点。一位现任 Andromeda
              基础设施工程师自发布的 GitHub CV 也方向性支持同一图景，提到 GitOps、KubeRay、Slurm、Weka、VAST、Prometheus、Grafana、Loki
              和内部编排工具；不过，该来源应被视为从业者信号，而不是经审计的公司披露。
