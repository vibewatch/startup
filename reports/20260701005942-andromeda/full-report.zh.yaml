  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              从客户流程看，Andromeda 提供的是一条托管路径，把碎片化 GPU 供应变成可部署的 AI 基础设施。买方定义 GPU 类型、数量、区域和时间线等工作负载需求；Andromeda
              随后在大型供应商网络中采购、基准测试并定价容量，标准化商业包，并给出可部署配置，配一张发票、一个支持渠道和一层统一可观测性。供应商从市场另一侧进入，提交集群细节，包括 GPU
              类型、数量、价格、网络、存储、位置、接口类型和预订窗口。官方文案称，这些集群随后会被基准测试、规范化、认证，并按标准化条款匹配给合格需求。


              因此，这个产品比泛泛的「GPU marketplace」标签更具体。可见模块包括买方需求录入、供应商接入、认证与基准测试、价格和合同标准化、部署路由，以及持续运营支持。公司自己的长篇洞察页尤其重要，因为它把
              GPU 市场缺失的部分框定为交易基础设施，而不是原始硬件所有权：基准测试、标准合同、匹配、运营和信任。SiliconANGLE 与 Upstarts 也强化了这一解读：Andromeda
              是一个验证基础设施、管理采购复杂性，并在众多供应商之间充当中立撮合者的层，而不是被某个单一云锁定的运营商。
