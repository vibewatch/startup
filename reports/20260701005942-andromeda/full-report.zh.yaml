  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：跟踪——公司重要，但当前价格仍需要分母和治理证据
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，对当前 $1.5B 锚点下的 Andromeda，结论是跟踪，不是买入，也不是否定。正面案例真实存在。前文已经证明，市场确实需要更窄的 GPU 经纪和采购层；公开材料也仍支持有意义的牵引：100
              多家供应商、1,000 多笔交易、超过 10 亿 GPU 小时活动、据报道约 $100M 的 2025 年运行率，以及公司为 AI 买方解决真实供给碎片化问题的迹象。在 2026 年，公开 AI
              基础设施公司仍以异常宽、且有时偏高的倍数交易，15x 收入的标题数字并不会自动出局。


              负面案例同样真实，而且对决策更关键。Andromeda 的估值仍压在一个没有公开审计、甚至没有清楚分类的分母上：它到底是净经纪经济性，还是总额转手收入？同一份材料仍缺公开
              NRR、GRR、客户数、供应商集中度和股权结构细节；Nat Friedman 和 Daniel Gross
              退居幕后之后，创始人连续性也明显弱了。这意味着，只有在隐藏变量都朝有利于投资人的方向发展时，当前价格才可能公平。没有这些证据，正确姿态是保持接触，坚持价格和条款纪律，不要把一门真实生意误当作已经完全承保的生意。
