      - number: '7.3'
        title: 运营、合作方和客户依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Andromeda 更像市场运营方和托管采购层，而不是自给自足的云。Upstarts 称，公司从 CoreWeave
              等供应商和其他运营方租赁供给，而不是承担硬件所有权风险；采购和业务人员岗位则显示，供给获取、供应商经济性，以及从线索到容量的匹配仍是核心且活跃的职能。SemiAnalysis 提供了有用的反向视角，把
              Andromeda 描述成架在多家 neocloud 之上的分数化 SRE
              和采购层。这个模式有吸引力，因为它避开了部分固定资产敞口，但也把风险推向合作方可靠性、供应商集中度、替代速度和质量控制。客户侧风险遵循同样模式。DCD 显示 NFDG
              之外已有真实商业化，但公开证据在市场活动上远强于在多元收入集中度上。Upstarts
              明确表示大型实验室业务保密，同一篇文章也给出了公开材料里最强的反向留存信号：一位匿名创始人说，公司最终可能把这项能力收回内部。ElevenLabs 在 2026 年扩大使用 Google Cloud，也说明早期与
              Andromeda 相邻的客户可以在别处多云并用。结果是，平台确实有需求和供给证据，但仍明显依赖外部供应商、不透明大客户和高接触人工执行。
