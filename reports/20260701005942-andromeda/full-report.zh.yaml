companyProfile:
  summary: >-
    Andromeda 是一家总部位于 San Francisco 的私营公司，为需要灵活算力、又不想承担超大规模云厂商式长期承诺的 AI 团队撮合并运营第三方 GPU 集群访问。公司源自围绕 Nat Friedman 和 Daniel
    Gross 网络搭建的 Andromeda Cluster，如今由 CEO Wil Moushey 运营，并把自己定位成中立市场层：对供应商做基准测试、标准化合同、整合账单，并帮助买方在碎片化供应中部署和管理大规模算力。
