      - number: '7.4'
        title: 财务模型、团队和否决标准
        blocks:
          - type: paragraph
            body: >-
              财务和执行风险不是典型困境信号，而是规模与控制信号。Upstarts 报道公司已盈利，2025 年收入运行率为
              $100M，但这些数字没有回答更重要的尽调问题：营运资本、交易对手融资、对冲、信用敞口或贷款方支持。事实上，公开招聘模式指向相反方向：Strategic Compute Finance 岗位明确提到 capex
              规划、情景建模、交易结构设计和贷款方关系，这意味着平台扩张需要围绕容量做真正的金融工程，而不只是写更多软件。组织图在公开层面同样未完成。开放岗位横跨法务、财务、采购、合作、解决方案、软件和
              SRE，而官方页面仍没有给出清晰董事会或控制权地图。因此，否决标准应具体、可监控：如果 Moushey 离开且没有继任图谱，就是治理失败；如果无法证明筛查、DPA
              或事件控制，就是合规失败；如果少数客户、渠道或供应商主导交易量，就是集中度失败；如果管理层无法证明贷款方深度、流动性韧性和利润率承受力，就是资本失败。这些不是理论问题；它们正是一个高速增长算力市场停止复合增长、变得不可融资的条件。
