        - GPU 小时或短期预留
        - 有公开依据但范围窄
        - 能证明 Andromeda 可以清掉紧急需求，但单个报价看不出利润率或可重复性。
        - 披露短期溢出需求相对较长期预留合同的收入占比。
      - - 多供应商计费与支持层
        - 官网称买家获得一张发票、一个支持渠道和标准化合同。
        - 附着在基础设施支出上的服务包
        - 有公开依据
        - 即便原始 GPU 价格商品化，也可能支撑溢价经济性。
        - 拆出不属于纯转手计算的支持、解决方案或平台收入。
