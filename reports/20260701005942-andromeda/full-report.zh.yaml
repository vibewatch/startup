  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Andromeda 方案
      - 公开收益信号
      - 限制
    rows:
      - - 快速拿到大规模训练集群
        - 供给分散，多年期合同常常太僵，难以匹配突发需求
        - 通过一个界面完成聚合采购、基准测试、定价、标准化合同和部署
        - 更快接入合格容量，同时只有一张发票、一个支持关系
        - 公开来源没有量化中位部署时间，也没有按工作负载类型披露成功率
      - - 在不自建机群的情况下运行推理或短周期工作负载
        - 团队可能需要尖峰容量，而不是永久承诺
        - 在全球供给之间路由训练和推理任务，并从多个提供方租用资源
        - 客户先不用建自有集群，也能轻资产获取算力
        - 公开资料没有拆分推理使用、训练使用和类似现货的工作流
      - - 把第三方容量推向市场
        - 提供方硬件各不相同，也没有标准路径触达合格企业需求
        - 接收集群规格，对环境跑基准测试并认证，再标准化交易结构、路由合格需求
        - 让闲置或碎片化供给更快变成收入
        - 公开资质标准和失败处理规则未披露
      - - 执行技术评估或 POC
        - 复杂买方在投入生产前，需要证明吞吐、成本、可靠性和安全性
        - 解决方案工程师负责发现需求、演示、POC、参考架构和成功标准映射
        - 技术信任更高，向生产交接更干净
        - 公开证据没有显示转化率或平均 POC 周期
      - - 运维和调试生产 GPU 集群
        - 故障可能来自硬件、存储、网络 Fabric、驱动、编排或 ML 框架
        - SRE 和平台团队提供可观测性、GPU 健康检查、事故响应和复盘驱动的修复
        - 买方把困难的集群调试工作外包给专业团队
        - 自动化与专家人工介入各占多大比例，公开信息仍不清楚
    notes: 这些用例优先覆盖官方工作流界面和当前技术招聘材料中描述的客户与提供方任务。
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE013
      - CE015
      - CE018
      - CE021
      - CE023
      - CE024
      - CE029
      - CE030
      - CE031
      - CE040
  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 公开证据
      - 关键依赖
      - 观察到的风险
    rows:
      - - 接入和元数据层
        - 以结构化形式采集买方需求属性和提供方基础设施属性
        - 官方客户和提供方表单直接公开所需字段
        - 市场两端都提供真实、完整的元数据
        - 坏元数据可能误导供给路由，或让工作负载规格不足
      - - 资质审核、认证和市场标准化层
        - 对供给跑基准测试、验证性能、规范化报价并标准化条款
        - 官网、洞察页和独立报道都描述了基准测试和认证功能
        - 可重复执行的基准测试，以及合同纪律
        - 公开基准测试方法和阈值仍不透明
      - - 控制平面和路由层
        - 把异质基础设施转成可开通容量，并将训练或推理工作负载调度到全球供给上
        - 软件工程和 SRE 岗位描述了编排、开通、生命周期管理和多提供方集群演进
        - 内部 API、服务、自动化和调度器抽象
        - 路由或生命周期 bug 可能伤害成本、性能或可用性
      - - 执行底座
        - 在 VM、Kubernetes、裸金属、Slurm 及相关调度环境上运行工作负载
        - 提供方工作流和工程岗位都明确点名这些环境
        - 提供方就绪度、驱动栈、调度器正确性和硬件健康
        - 异质环境会抬高集成和支持复杂度
      - - 可靠性和可观测性层
        - 监控 GPU 健康、Fabric 吞吐、系统指标和事故状态，并支持响应和补救
        - 高级 SRE 和站点可靠性岗位列出 SLO、错误预算、遥测、复盘和深度可观测性
        - GPU 遥测、Fabric 健康数据和有能力的值班人员
        - 缺少公开状态或事故指标，外部验证很难
      - - 客户技术合作层
        - 连接售前、评估、架构和生产交接
        - 解决方案工程岗位要求演示、POC、参考架构，以及在工程和安全团队之间拉齐干系人
        - 高质量客户互动和可重复使用的赋能资产
        - 如果自动化落后于需求，服务密集型交付可能很难扩展
    notes: 架构表强调公开证据中可见的层和依赖，不声称公司尚未披露的内部实现细节。
    claimRefs:
