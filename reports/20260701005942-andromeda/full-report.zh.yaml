  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商 / 类别
      - 公开定价信号
      - 合同模式
      - 包含能力
      - 未知项 / 折扣
      - 含义
    rows:
      - - Andromeda
        - 留存来源未见公开标价
        - 经纪式项目或企业交易，采用标准化条款和统一账单
        - 供应商发现、基准测试、认证、路由、合同、支持
        - 实际抽成率、折扣和成本转嫁口径仍未公开
        - 必须靠速度、质量和流程简化支撑利润，而不是靠标价透明度
      - - CoreWeave
        - 按需和 spot 价格披露细，预留折扣最高 60%
        - 按量使用、预留容量和专用推理产品
        - 全栈 AI 云、存储、可观测性、安全和专家服务
        - 企业议价条款仍然重要；部分专用方案仍靠销售推进
        - 大型集群买家的强参照，也直接威胁经纪价差
      - - Lambda
        - 透明的按小时实例价格和公开的 1-Click 集群卡片
        - 自助先到先得实例，加上专用集群和私有云
        - 实例、集群、超级集群、信任控制和直接云访问
        - 企业折扣和非公开私有云价格仍不透明
        - 能快速标准化到单一供应商的买家，搜寻成本被压低
      - - Vast.ai
        - 实时供需定价，覆盖按需、可中断和预留选项
        - 市场式按量使用，不要求长期合同
        - 搜索、API 驱动供给，以及跨主机的广泛 GPU 库存
        - 可靠性和服务质量更受主机基础影响，波动大于全托管云
        - 为非监管或灵活工作负载压出透明的商品化底价
      - - RunPod
        - 公开按小时 GPU 卡片，加上按秒计费的 serverless
        - Pods、serverless workers 和预留集群式选项
        - 开发、推理和集群打包在同一自助入口下
        - 企业支持和最重的合规打包不如超大规模云厂商可见
        - 对突发推理或快速实验是强替代
      - - Modal
        - 按秒 serverless 计费、免费额度，以及明确的创业公司或研究资助
        - Serverless 执行，向企业计划上售
        - 跨云路由、自动扩缩、训练、推理和批处理执行
        - 专用长周期集群经济性不是公开叙事核心
        - 适合弹性工作负载，对经纪式多供应商采购的替代性较弱
      - - AWS / Azure / GCP
        - 公开标价卡与协商后的承诺用量经济性并存
        - 既有云合同、企业协议和预留消费计划
        - 原生加速器实例、网络、存储和经审计的合规控制
        - 实际成交价会随承诺量和既有账户议价能力大幅变化
        - 采购挂在既有预算上；即便原始标价更高，替换成本也高
      - - 自建 / DGX SuperPOD
        - 没有简单的公开用量价格；经济性更像资本开支加运营，而不是云端运营开支
        - 自有或托管 AI 数据中心部署
        - 全栈计算、网络、存储和工作负载管理环境
        - 真实总成本取决于利用率、部署速度、人员配置和融资结构
        - 只有持续需求足够大、能摊薄复杂度时才可信
    notes: 直接云和 serverless 平台的公开价格透明度远高于 Andromeda 的经纪模式；承销关键是 Andromeda 的工作流价值能否抵消这道可见性缺口。
