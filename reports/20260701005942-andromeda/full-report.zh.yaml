      - number: '8.2'
        title: 融资背景和可比公司纪律
        blocks:
          - type: paragraph
            body: >-
              本章最难的地方在于，当前价格必须同时放进两套很不同的参照系里判断。一方面，按正常承保标准，Andromeda 仍然披露不足。公开来源集中指向 2026 年 3 月 Paradigm 支持的一轮融资，估值
              $1.5B，Paradigm 总投资约 $60M；但它们没有披露该轮是否带有优先权、可转债、老股转让，或任何会实质改变标题数字之下经济性的投资人保护条款。SEC 的公开 Form D
              数据基础设施存在，但本轮保留的公开证据仍没有为 Andromeda 本身找到清晰的证券类型或优先清偿栈桥接。


              另一方面，2026 年公开市场里的 AI 和云参照，并没有给投资人一个简单的「私有市场显然太贵」答案。CoreWeave 在 StockAnalysis 上约为 8.7x
              P/S，但拥有更重的自有基础设施模式；DigitalOcean 到 2026 年 7 月约为 17.4x TTM 收入，尽管它是更宽的云业务；Nebius 则以极端的三位数收入倍数交易，反映的更多是 AI
              基础设施期权价值，而不是当下现金收益纪律。这个宽区间不能证明 Andromeda 便宜；它证明，当市场相信增长和战略位置真实存在时，仍愿意为 AI
              基础设施稀缺性付钱。因此，估值问题更窄也更尖锐：Andromeda 据报收入的经济性，是否比公开材料目前允许投资人核验的程度更干净、更持久、更不易受集中度拖累？
