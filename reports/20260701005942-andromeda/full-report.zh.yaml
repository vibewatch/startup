        - CoreWeave 和 Lambda 都主打集成平台控制；超大规模云厂商和 NVIDIA 也在持续加软件层
        - 要求证明 Andromeda 的认证能实质提升部署成功率或缩短采购时间
      - - 一张发票、一条支持路径
        - 通过 Run:ai、Modal 或直接云做多宿主，切换成本仍然适中
        - 中
        - Run:ai 编排混合算力池，Modal 跨云路由；按量云避免长期承诺
        - 衡量账户渗透率、续约率，以及仍在其他地方直接采购的客户数量
      - - 供应商广度作为护城河
        - 供应商自有云和超大规模云厂商控制上游容量，并可向前整合商业化
        - 高
        - CoreWeave 的规模、超大规模云厂商的信任基础和直接自有容量，都会在部分交易中削弱中介必要性
        - 梳理头部供应商集中度、排他性，以及供应商是否也在直接争夺同一需求
      - - 信任与监管就绪度
        - 超大规模云厂商、Lambda、Modal、RunPod 和 CoreWeave 发布的信任或合规材料比 Andromeda 更详细
        - 高
        - AWS、Google Cloud 和 Azure 在合规广度上领先；几家较新的对手也拿出比 Andromeda 稀疏信任页更清晰的审计信任材料
        - 索取客户安全问卷、受监管账户参考，并证明赢下合规导向交易靠的是合规而非价格
      - - 耐久的独立编排层
        - 编排被打包进上游技术栈后，未必还能作为独立护城河品类存在
        - 中
        - NVIDIA 现在拥有 Run:ai；欧洲委员会则称 Run:ai 今天本身并不具备显著市场地位
        - 询问 Andromeda 控制层功能相对供应商或 NVIDIA 软件可打包能力，是否有实质差异
    notes: 严重性衡量的是 Andromeda 定价权和留存风险，而不是外包 GPU 需求本身；核心问题是，直接云成熟后，市场碎片化带来的价值还能不能留住。
