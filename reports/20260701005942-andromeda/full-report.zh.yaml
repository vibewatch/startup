      - number: '4.4'
        title: 财务结论、收入质量观点与承保阻碍
        blocks:
          - type: paragraph
            body: >-
              Andromeda 的公开财务案例有吸引力，但单独看还不到投资级。正面看，公司似乎找到了真实经济切入口：大型 GPU 买方想要更快访问、更多供应商选择，并减少直接云或超大规模云厂商未必总能解决的双边签约摩擦。如果
              Andromeda 在已承诺工作负载上收取净经纪价差，同时避免大规模自有基础设施资本开支，那么报告所称盈利、约 $100M run-rate 规模和小团队结合起来，可能意味着非常有吸引力的收入质量和资本效率。公开
              $1.5B 估值锚点，对应粗略约 15x run-rate 收入倍数，或约 30x 2024 年收入；若利润率确实很高且现金转换强，这对一家私营 AI 基础设施中介而言激进但并不荒唐。


              问题在于，缺失项恰恰是判断这种乐观解释是否成立所需的输入。没有公开抽佣率披露，没有公开总额 / 净额会计政策，没有经审计毛利率，没有现金或现金消耗
              披露，没有债务或担保明细，也没有客户集中度数据。这意味着投资人无法判断收入基础是否耐久、服务交付是增厚利润率还是依赖大量人力，或隐藏营运资本义务是否会迫使进一步融资。最干净的财务结论因此偏谨慎：相对于直接云，Andromeda
              的模式可能更轻资本；但若没有管理层会议级数据集，公开证据仍不足以承保收入质量、利润率路径或资本充足性。
