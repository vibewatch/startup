chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and headquarters signal
        blocks:
          - type: paragraph
            body: >-
              Public evidence is unusually clear on what Andromeda is trying to be even if some formation details stay
              fuzzy. Official home, insights, customer, provider, and privacy surfaces all describe a two-sided compute
              market: buyers specify workload needs, suppliers submit GPU, network, location, and availability details,
              and Andromeda benchmarks supply, standardizes contracts, routes demand, and gives customers one billing
              and support relationship. That combination makes the company better understood as a neutral market
              infrastructure layer for AI compute than as a conventional cloud operator that owns most of the hardware
              it sells. The product narrative is also consistent across official copy: the company is trying to make
              fragmented GPU capacity usable by wrapping procurement, certification, pricing, and operations into one
              interface.


              The corporate-identity fields are narrower. Official footers and the privacy policy identify the legal
              entity as Andromeda Cluster, Inc. Built In, the company's X profile, and Gaebler all point to San
              Francisco as the current base, with Gaebler giving 228 Grant Ave as a mailing address signal. That is
              useful but should not be treated as the final word on headquarters because the official site does not
              publish a street address. Founding timing also needs nuance: Upstarts places Wil Moushey's recruitment in
              late November 2023, while the March 2026 launch post says the team had already spent three years building
              the market infrastructure for compute. The safest ground truth for later chapters is therefore late-2023
              project origin, San Francisco operating base, and a current business model centered on brokering and
              operating third-party compute rather than owning a hyperscaler-scale footprint outright.
