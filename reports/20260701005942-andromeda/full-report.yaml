      - number: '6.3'
        title: Durability, expansion paths, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public file gets weakest. No reviewed source disclosed NRR, GRR, churn, renewal
              rates, contract lengths, cohort curves, or even a current customer count. That does not mean the business
              lacks retention; it means outside investors cannot verify it from public evidence. The best available
              proxies are directional. Official and third-party sources show repeatable transaction flow, a services
              layer that stays involved after deployment, and an anonymous founder telling Upstarts that their company
              keeps working with Andromeda because it acts like an outsourced engineering team and is more flexible than
              a hyperscaler. At the same time, that same founder volunteered the core durability caveat: if the startup
              gets large enough, it may eventually bring those capabilities in-house.


              Expansion paths are visible even if conversion rates are not. The Solutions Engineer role describes a
              land-and-expand motion built on demos, POCs, customer ROI, and successful production handoffs across
              strategic accounts. The partnerships role goes further, explicitly naming GPU providers, AI labs, OEMs, VC
              funds, and accelerators as channel multipliers and saying partnership KPIs are tied to revenue
              contribution, utilization, and growth. That suggests Andromeda is trying to scale both direct
              enterprise-style sales and a portfolio or ecosystem channel that routes demand to the platform. The
              procurement, compute-trader, and business-staff roles also imply a live balancing act between customer
              demand, provider economics, and contract structure.


              Those same features create concentration risk. The business originated inside the NFDG ecosystem, and
              Upstarts says many portfolio companies remain customers even if they no longer receive preferential
              treatment. Customer opacity also makes top-account risk impossible to size: the biggest labs are likely
              the most confidential and the hardest to reference. Procurement friction is non-trivial as well. Legal,
              security, export, finance, and custom-supply roles all suggest that closing and keeping large accounts is
              a high-touch process rather than a low-friction self-serve motion. And because Andromeda often wins by
              being a fractional procurement and SRE layer, some mature customers may eventually internalize that
              capability. The commercial story is therefore expansion-capable but not yet publicly durable enough to
              underwrite without management-room data.
