      - number: '1.4'
        title: Milestones, commercialization path, and current risk signals
        blocks:
          - type: paragraph
            body: >-
              The milestone story matters because Andromeda's public identity lags its operating history. Upstarts shows
              a late-2023 handoff to Moushey, early-2024 scaling to more than 4,000 GPUs for NFDG-backed companies, and
              then a broader commercialization path. DCD adds an important checkpoint in June 2025: before the March
              2026 public launch, the Andromeda Cluster was already being sold to non-NFDG companies at published
              per-GPU prices. The March 16, 2026 privacy-policy revision is the clearest public legal marker, while the
              March 18 X post and website reveal are the cleanest external launch markers. The same week also produced
              the Paradigm financing and the strongest public valuation anchor. As of the July 2026 run date, active
              hiring across legal, finance, partnerships, procurement, solutions, software, and reliability roles shows
              the company is still building its operating chassis around that capital and demand story.


              The risk signals are subtler than a classic distressed-company red flag, but they are real. DCD's 2025
              coverage said it was unclear what Meta's partial acquisition talks around NFDG would mean for Andromeda,
              and Upstarts later said Friedman and Gross no longer have an active relationship with the company. That
              creates a continuity question precisely because the founders were central to the initial supply, capital,
              and customer narrative. The trust and privacy surfaces help show that management takes legal and security
              infrastructure seriously, yet the public trust surface is still sparse relative to the revenue and
              valuation narrative. Combined with opaque board disclosure, unresolved capital-stack details, and no
              public customer count, the chapter should present Andromeda as a fast-scaling and apparently profitable
              compute marketplace whose investability still depends on management-room confirmation of ownership,
              governance, and concentration risk.
