      - number: '8.2'
        title: Financing context and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The hardest part of this chapter is that the current price has to be judged against two very different
              reference sets at once. On one hand, Andromeda still looks under-disclosed by normal underwriting
              standards. Public sources cluster around a March 2026 Paradigm-backed financing at a $1.5 billion
              valuation and about $60 million of total Paradigm investment, but they do not disclose whether the round
              carried preferences, convertibles, secondaries, or any investor protections that materially change the
              economics beneath the headline. The SEC's public Form D dataset infrastructure exists, yet the retained
              public evidence in this run still does not surface a clean security-type or preference-stack bridge for
              Andromeda itself.


              On the other hand, 2026 public-market AI and cloud references are not giving investors a simple "private
              is obviously overpriced" answer. CoreWeave screens around 8.7x P/S on StockAnalysis with a much heavier
              owned-infrastructure model, DigitalOcean screens around 17.4x TTM revenue in July 2026 despite being a
              broader cloud business, and Nebius trades at an extreme triple-digit revenue multiple that reflects
              AI-infrastructure option value more than present-day cash-yield discipline. That wide band does not prove
              Andromeda is cheap; it proves the market is still willing to pay for AI-infrastructure scarcity when it
              believes the growth and strategic position are real. The valuation question is therefore narrower and
              sharper: is Andromeda's reported revenue economically cleaner, more durable, and less concentration-prone
              than the public file currently allows investors to verify?
            claimRefs:
