      - number: '4.4'
        title: Financial verdict, revenue-quality view, and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The public case for Andromeda is financially intriguing but not investment-grade on its own. On the
              positive side, the company appears to have found a real economic wedge: large GPU buyers want faster
              access, more supplier choice, and less bilateral contracting friction than direct clouds or hyperscalers
              always provide. If Andromeda is collecting a net brokerage spread on committed workloads while avoiding
              large owned-infrastructure capex, the combination of reported profitability, ~$100 million run-rate scale,
              and small headcount could imply very attractive revenue quality and capital efficiency. The public $1.5
              billion valuation anchor then screens to a rough 15x run-rate revenue multiple or about 30x 2024 revenue,
              which is aggressive but not absurd for a private AI-infrastructure intermediary if margins are genuinely
              high and cash conversion is strong.


              The problem is that the missing inputs are exactly the ones needed to decide whether that optimistic
              interpretation is correct. There is no public take-rate disclosure, no public gross-vs-net accounting
              policy, no audited gross margin, no cash or burn disclosure, no debt or guarantee schedule, and no
              customer concentration data. That means investors cannot tell whether the revenue base is durable, whether
              service delivery is margin-accretive or labor-heavy, or whether hidden working-capital obligations could
              force more financing. The cleanest financial verdict is therefore cautious: Andromeda’s model may be
              capital-light relative to direct clouds, but public evidence is still insufficient to underwrite revenue
              quality, margin path, or capital adequacy without a management-room data set.
