  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The current mark becomes easier to defend only if revenue quality is strong enough that investors accept a premium
      multiple on something close to the reported ~$100M base.
    data:
      items:
        - label: Revenue needed at 8x
          value: 187.5
          detail: Required revenue in USD millions to support a $1.5B value at a more conservative AI-infrastructure multiple.
          tone: negative
        - label: Revenue needed at CoreWeave P/S
          value: 172
          detail: Approximate revenue in USD millions needed at CoreWeave's ~8.7x public P/S.
          tone: warning
        - label: Revenue needed at 15x
          value: 100
          detail: The threshold implied by the current reported 2025 run-rate anchor.
          tone: neutral
        - label: Revenue needed at DigitalOcean P/S
          value: 86.2
          detail: Approximate revenue in USD millions needed at DigitalOcean's ~17.4x current public multiple.
          tone: positive
        - label: Current public run-rate
          value: 100
          detail: The best retained public denominator for Andromeda today.
          tone: warning
    approximationNotes: >-
      Sensitivity bars use simple valuation arithmetic on public snapshots and do not adjust for dilution, gross-vs-net
      accounting, or preference overhang.
    claimRefs:
      - CV004
      - CV018
      - CV019
      - CV024
      - CV025
      - CV032
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Using only public evidence, the range centers around the current mark only if Andromeda's hidden economics land in
      investors' favor.
    data:
      items:
        - label: Bear case
          low: 400
          mid: 600
          high: 800
          displayValue: $0.4B-$0.8B
          detail: Revenue turns out less economic or less durable than the headline suggests.
          tone: negative
        - label: Base case
          low: 1000
          mid: 1300
          high: 1800
          displayValue: $1.0B-$1.8B
          detail: The business is real, but the market still discounts opacity on retention, concentration, and terms.
          tone: warning
        - label: Bull case
          low: 2200
          mid: 2900
          high: 3600
          displayValue: $2.2B-$3.6B
          detail: Net economics are strong, diversification improves, and the broker layer proves sticky.
          tone: positive
    approximationNotes: Ranges are scenario outputs built from public anchors and simple multiple discipline rather than DCF precision.
    claimRefs:
      - CV032
      - CV036
      - CV037
      - CV039
      - CV040
      - CV041
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Andromeda scores well on market reality and potential capital efficiency, but much worse on public evidence
      sufficiency and downside protection.
    data:
      items:
        - label: Market need
          score: 8
          detail: Earlier chapters and current sources support a real fragmentation problem in GPU procurement.
          tone: positive
        - label: Commercial proof
          score: 7
          detail: Reported scale is meaningful, though named-customer proof is still thin.
          tone: positive
        - label: Capital-efficiency potential
          score: 7
          detail: A neutral broker can be attractive if revenue is mostly net and supply remains external.
          tone: positive
        - label: Evidence quality
          score: 4
          detail: Key valuation inputs still come from reported or inferred, not audited, denominators.
          tone: warning
        - label: Governance / control visibility
          score: 3
          detail: Founder continuity is thinner and public board / control detail remains sparse.
          tone: negative
        - label: Downside protection
          score: 3
          detail: Preference stack, concentration, and true margin structure remain unknown.
          tone: negative
    approximationNotes: Scores are ordinal 0-10 judgments anchored to cited public evidence, not management-reported KPIs.
    claimRefs:
      - CV004
      - CV009
      - CV013
      - CV016
      - CV032
      - CV042
      - CV043
