      - number: '5.3'
        title: Maturity, Differentiation, and Support
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity signal is not a published API manual or certification badge set; it is the
              consistency of live commercial and operational evidence. Official pages already show a two-sided workflow,
              100-plus providers, and standardized support language. Independent reporting adds that Andromeda manages
              procurement detail, monitors reliability issues, and has already processed real transactions at scale.
              Hiring reinforces that this is an operating business, not a brochure: software engineers are building
              productized orchestration and control planes, solutions engineers are running structured evaluations and
              reference architectures, and reliability teams are expected to own incident response, GPU-specific
              observability, and multi-provider cluster performance.


              Andromeda’s differentiation therefore looks operational rather than purely hardware-based. It claims to
              combine provider qualification, benchmark-driven normalization, price discovery, contract standardization,
              workload routing, and customer support into one neutral layer that can offer the consistency of a
              hyperscaler without requiring Andromeda to own the underlying fleet. That should make the model more
              capital efficient than owning every cluster outright, but it also means the product depends on provider
              quality, internal support depth, and orchestration correctness. Public maturity is thus uneven. The buyer
              and provider workflows appear live, the routing and support stack looks real, and the long-term “liquidity
              layer” thesis is coherent. But the public file still lacks a formal roadmap, a public API or SDK surface,
              and detailed technical documentation explaining how much of the workflow is automated versus how much
              still depends on expert human intervention.
