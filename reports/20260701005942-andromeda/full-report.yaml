  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Leadership continuity fails
        - Wil Moushey departs or loses operating control without a credible succession and board map
        - The public founder / operator narrative loses its remaining continuity anchor.
        - Pause or re-underwrite from first principles.
      - - Revenue quality disappoints
        - >-
          Diligence shows reported revenue is mostly gross pass-through or materially lower-margin than investors
          assumed
        - The effective valuation multiple rises sharply even if the headline top line is real.
        - Re-cut the company on lower net revenue or lower multiple assumptions.
      - - Concentration is high
        - >-
          A small set of customers or providers dominate GMV, recognized revenue, or capacity with weak substitution
          paths
        - Neutrality and diversification stop being a moat and become a slogan.
        - Lower confidence, compress the multiple, and reassess downside.
      - - Direct-cloud substitution rises
        - Named customers increasingly move durable workloads to direct providers or in-house procurement
        - The broker layer becomes interim convenience rather than durable infrastructure.
        - Cut bull-case probability and treat the base case as an upper bound.
      - - Financing terms are investor-unfriendly
        - >-
          Preferences, convertibles, or contract-linked debt materially subordinate new equity or common-equivalent
          upside
        - Headline valuation no longer reflects investable economics.
        - Decline at current terms or require a reset.
    notes: These triggers are designed to translate directly into valuation impairment rather than generic operating concern.
