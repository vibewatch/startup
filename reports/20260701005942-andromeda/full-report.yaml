  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest market definition starts with what GPU-as-a-service includes before narrowing to Andromeda's
              actual lane. The Business Research Company defines GPUaaS as on-demand virtualized GPU access for machine
              learning, high-performance computing, and advanced visualization without the customer owning the hardware.
              Its market definition includes managed GPU hosting, workload orchestration, resource provisioning, and
              training or optimization services. Andromeda's own framing is narrower and more specific: it is not merely
              renting a first-party cluster, but acting as market infrastructure that benchmarks third-party supply,
              standardizes contracts, routes workloads, and operates a single support relationship between AI builders
              and infrastructure providers. That means the most relevant spend pool is outsourced GPU capacity plus the
              coordination layer needed to make heterogeneous supply usable.


              Important adjacent markets are larger than Andromeda's direct category. Hyperscaler accelerator instances
              from AWS, Google Cloud, and Azure are a core substitute because they let buyers reserve or burst into
              H100- and H200-class clusters directly. Specialist first-party GPU clouds such as RunPod, Lambda,
              CoreWeave, and Vast are another substitute set; they sell on-demand, spot, interruptible, or reserved
              capacity without a neutral broker in the middle. Direct bilateral deals with telcos, crypto miners, MSPs,
              and sovereign or startup clouds are also in-bound as a status-quo procurement path because they are the
              raw supply Andromeda says it aggregates.


              The excluded or only adjacent spend is just as important for valuation discipline. Buying GPUs, financing
              servers, building data centers, leasing power, or signing long-term capacity for an internally owned
              cluster is not the same as buying brokered outsourced compute. Nor is model-API spend a direct equivalent:
              API inference can substitute for some inference use cases, but it does not buy dedicated cluster control.
              The practical takeaway is that Andromeda should be analyzed against outsourced, multi-provider training
              and inference infrastructure markets and procurement workflows, not against the entire AI capex wave.
