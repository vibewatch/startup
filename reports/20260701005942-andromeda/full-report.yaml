      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real market is outsourced GPU liquidity, not total AI infrastructure spend
            body: >-
              The broad GPUaaS category is already multi-billion-dollar, but Andromeda should not be valued against all
              AI capex, hyperscaler build-out, or model-API consumption. Its actual arena is the narrower slice where
              buyers need outsourced multi-provider capacity plus trust, contracting, and operating support.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM038
          - type: callout
            title: Fragmentation is what creates room for a broker
            body: >-
              The wide spread between spot, specialist-cloud, and hyperscaler-equivalent H100 pricing is evidence that
              the market is not a single commodity pool. As long as networking, reliability, support, and contract terms
              vary this much, a neutral certification and routing layer can still add real value.
            calloutType: strength
            claimRefs:
              - CM014
              - CM017
              - CM018
              - CM023
              - CM026
              - CM027
          - type: callout
            title: Price deflation can expand demand while compressing take rates
