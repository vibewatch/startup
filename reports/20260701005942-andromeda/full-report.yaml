  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Recommendation: track — the company matters, but the current price still needs denominator and governance
          proof
        blocks:
          - type: paragraph
            body: >-
              The public-evidence call on Andromeda at the current $1.5 billion anchor is track, not buy and not
              dismiss. The positive case is real. Earlier chapters already established a genuine market need for a
              narrower GPU brokerage and procurement layer, and the public file still supports meaningful traction:
              100-plus providers, 1,000-plus transactions, billion-plus GPU-hour activity, a reported ~$100 million 2025
              run-rate, and signs that the company solved a real supply-fragmentation problem for AI buyers. In a 2026
              market where public AI-infrastructure names still trade at unusually wide and sometimes elevated
              multiples, a 15x revenue headline is not automatically disqualifying.


              The negative case is just as real, and it is more decision-critical. Andromeda's valuation still rests on
              a denominator that has not been publicly audited or even clearly classified as net broker economics versus
              gross pass-through revenue. The same file still lacks public NRR, GRR, customer count, provider
              concentration, and cap-table detail, while founder continuity is visibly weaker after Nat Friedman and
              Daniel Gross stepped back from an active role. That means the current mark may be fair only if the hidden
              variables break in investors' favor. Without that proof, the right posture is to stay engaged, insist on
              price and term discipline, and refuse to confuse a real business with a fully underwritten one.
            claimRefs:
