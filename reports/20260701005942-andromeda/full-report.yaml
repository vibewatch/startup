      - number: '3.3'
        title: Pricing, trust, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is one of the clearest reasons this market can commoditize faster than
              Andromeda's valuation narrative implies. CoreWeave publishes extensive on-demand and spot cards plus
              reserved discounts of up to 60% for committed usage. Lambda publishes straightforward per-hour rates and
              self-serve instance access. Vast.ai, RunPod, and Modal all expose transparent or usage-based economics
              that let buyers benchmark alternatives quickly, and Vast explicitly markets no long-term contracts.
              Andromeda's own public materials are much more explicit about workflow, certification, and unified support
              than about posted list pricing. That does not make the model weak by itself — brokered infrastructure
              should be sold on better total outcomes rather than raw sticker price — but it does mean buyers can anchor
              quickly on direct-cloud or serverless alternatives and ask Andromeda to justify any spread through speed,
              quality, and contract simplification.


              Trust and switching costs cut the other direction. CoreWeave, Lambda, Modal, RunPod, and especially AWS,
              Google Cloud, and Azure all put far more public detail around security and compliance controls than
              Andromeda's sparse trust surface currently shows. Hyperscalers retain the strongest trust posture by a
              wide margin because they publish broad compliance catalogs, third-party attestations, and
              regulated-industry coverage. Multi-homing is also technically and commercially plausible. Run:ai is built
              to orchestrate heterogeneous environments; Modal routes across clouds; Vast, RunPod, and Lambda rely on
              short-duration or usage-based constructs; and internal build remains available for the largest buyers. The
              result is a market with meaningful but not prohibitive lock-in. Andromeda's switching costs are likely
              real only when a customer has embedded the company deeply into supplier qualification, SLA normalization,
              and ongoing multi-provider operations. They are weaker when the customer is mainly renting one cluster
              from one known provider.
