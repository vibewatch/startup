      - number: '1.2'
        title: Founders, current leadership, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              The founder story is consistent even though the public executive roster is not. Built In and Gaebler both
              describe Andromeda Cluster as founded by Nat Friedman and Daniel Gross. Independent sources then fill in
              why that matters: DCD and CB Insights position Friedman as the former GitHub chief executive and NFDG
              cofounder, while Daniel Gross's own site and DCD connect him to Apple, Y Combinator, NFDG, and now Meta
              compute work. That combination gives the founders unusually strong founder-market fit for scarce AI
              infrastructure, customer introductions, and capital access. Upstarts adds the missing operational bridge:
              Gross recruited Wil Moushey in late 2023 to run the project, and third-party March 2026 coverage names
              Moushey as CEO.


              Governance transparency is much weaker than founder-market fit. The official site exposes no public board
              roster, no executive-team page, and no clean ownership or control map. Instead, the clearest public view
              of the operating bench comes from active hiring: legal, finance, partnerships, procurement, business
              operations, solutions engineering, software, and SRE roles are all open. That shows real organizational
              build-out, but it also implies that some important management functions are still being staffed or at
              least not publicly named. Key-person dependence is therefore high. Moushey appears to be the present
              operating center of gravity, while the founders still dominate the historical narrative and sponsor
              network. The later move of Friedman and Gross to Meta, and Upstarts' claim that they no longer have an
              active relationship with Andromeda, is the most material leadership change in the public record and should
              remain a diligence focus until board, ownership, and succession details are confirmed directly.
