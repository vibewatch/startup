companyProfile:
  summary: >-
    Andromeda is a San Francisco-based private company that brokers and operates access to third-party GPU clusters for
    AI teams that want flexible capacity without long-term hyperscaler-style commitments. The company grew out of the
    Andromeda Cluster built around Nat Friedman and Daniel Gross's network, now operates under CEO Wil Moushey, and
    positions itself as a neutral market layer that benchmarks providers, standardizes contracts, consolidates billing,
    and helps buyers deploy and manage large-scale compute across fragmented supply.
