      - number: '5.4'
        title: Trust, Quality, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Trust and control disclosures exist, but they are thin relative to the product promise. The privacy policy
              is the most substantive public control document. It says Andromeda operates a business-only platform,
              collects detailed customer and provider infrastructure data, uses cookies for authentication and core
              functionality, offers a DPA on request, and maintains access controls, encryption in transit and at rest,
              and ongoing monitoring. The homepage and third-party reporting also imply provider qualification and
              security screening before infrastructure is listed. Those are positive signals, but they are still mostly
              company assertions. The public trust center exposes little more than a title page, and this run did not
              surface a first-party public status page, named external certifications, published SLA documents, or
              incident postmortems.


              That gap matters because Andromeda’s product is explicitly sold on reliability, standardization, and trust
              across third-party infrastructure. If benchmark methodology, certification thresholds,
              provider-remediation rules, and incident history stay opaque, buyers have to accept the company’s quality
              assertions largely on faith. The operational dependency map is also non-trivial: provider supply can
              tighten, networking or storage defects can break training runs, orchestration mistakes can misroute jobs,
              and a services-heavy support model can become a bottleneck if demand outgrows specialized staff. The right
              conclusion is not that the product is immature; it is that the commercial workflow looks ahead of the
              public trust surface. Investors or enterprise buyers should therefore view benchmark methodology,
              provider-quality controls, status reporting, and automation depth as the most important remaining
              technical diligence topics.
