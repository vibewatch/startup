      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The durable part of Andromeda's story is not that it has the most GPUs or the broadest compliance catalog.
              It is that the outsourced GPU market is fragmented enough for a neutral coordination layer to matter. If
              buyers truly need supplier discovery, performance qualification, standardized contracts, one invoice, and
              one operational interface across many independent providers, then Andromeda occupies a real wedge that
              neither a single neo-cloud nor a single hyperscaler can reproduce cleanly. That wedge should be strongest
              in overflow sourcing, multi-provider risk management, and buyers that distrust committing too early to one
              direct supplier.


              The problem is that public evidence also shows how quickly this wedge can thin out. CoreWeave's scale and
              backlog demonstrate that direct providers can build formidable enterprise distribution and
              infrastructure-control advantages, yet Fitch's analysis also shows those rivals carry
              customer-concentration, leverage, and lease-mismatch risks of their own. NVIDIA's ownership of Run:ai and
              the European Commission's view that Run:ai is not a dominant orchestration layer today are a reminder that
              orchestration is likely to be bundled upward into bigger infrastructure stacks, not left as a permanently
              scarce independent layer. Meanwhile, posted pricing from Lambda, Vast, RunPod, Modal, and CoreWeave sets a
              visible commodity reference point under large parts of the market. The competitive conclusion is therefore
              conditional: Andromeda is stronger than direct clouds on neutral aggregation and procurement
              simplification, but weaker on disclosed trust depth, upstream supply control, and direct budget ownership.
              Its moat is durable only if certification, routing, and commercial normalization are translating into
              better economics or faster procurement than customers could achieve by going direct.
