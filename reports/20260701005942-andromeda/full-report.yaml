      - number: '7.2'
        title: Regulatory, legal, privacy, and trust risks
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal risk profile is material even without any confirmed public lawsuit or enforcement
              action tied directly to Andromeda. The core reason is structural: Andromeda publicly describes itself as a
              global GPU marketplace that sits between customers and infrastructure providers, while its privacy policy
              confirms that it processes contact, account, billing, and service-usage information. That means the
              company does not merely market GPUs; it centralizes sensitive counterparties, contracts, and data flows.
              BIS and Federal Register materials show that advanced-computing controls now directly address
              circumvention, destination risk, and controlled-chip diffusion. OFAC's framework makes sanctions
              compliance relevant not just to U.S. entities but also to foreign entities using U.S.-origin goods or
              services. At the same time, FTC guidance makes privacy promises and incident response operationally
              consequential. Andromeda's mitigation posture is visible but incomplete: the company is hiring commercial
              counsel with privacy and export responsibilities, yet the trust center reviewed in this run remains sparse
              and does not offer the kind of certification, status, or incident-history detail a cautious enterprise
              buyer or investor would expect. The right underwriting stance is therefore not to assume a hidden problem,
              but to treat export screening, sanctions screening, incident response, DPA process, and trust evidence as
              gating diligence asks.
