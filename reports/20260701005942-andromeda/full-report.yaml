      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The main growth drivers are visible and mutually reinforcing. S&P says AI technology and cloud
              infrastructure have remained among the highest enterprise technology spending-intent categories for most
              of the last two years, while its buyer-insight note says specialist GPUaaS supply grew because many
              businesses could not buy enough chips to operate their own systems. Andromeda's own market essay adds the
              timing mismatch: AI research cycles move in weeks, while data centers take twelve to twenty-four months to
              build. More supply and more price transparency from RunPod, Lambda, CoreWeave, Vast, and hyperscaler cards
              broaden the buyer set further by making overflow, experimentation, and mid-market inference economically
              plausible in ways they were not during the 2023-2024 shortage peak.


              The braking forces are not merely 'shortage'; they are structural. Andromeda's core thesis is that raw
              supply exists but is not fungible. Networking, storage, cluster health, geographic location, bookable
              duration, and support quality all materially change the value of a nominally identical H100. CoreWeave's
              benchmark brief and NVIDIA's H100 architecture page show why: real training value depends on MFU,
              reliability, NVLink, InfiniBand, and the surrounding software stack, not just chip name. SesameDisk adds a
              buyer-side reality check that quotas, regional limits, queue times, and account status often matter more
              than list pricing when a launch date is hard. That helps explain why hyperscaler-equivalent prices can
              stay far above neo-cloud spot floors without the market immediately arbitraging them away.


              Supply relief also remains partial. Presenc argues that the bottleneck has shifted from outright H100
              scarcity toward HBM3e memory, CoWoS packaging, rack power, and data-center deployment. Those last-mile
              frictions matter for Andromeda because they increase the value of already-qualified third-party supply,
              but they also raise the trust bar: buyers need proof that clusters will perform at spec and stay up. The
              valuation implication is therefore two-sided. On the positive side, a fragmented, non-fungible,
              trust-constrained market is exactly where a neutral broker can add value. On the negative side, falling
              unit prices and apples-to-oranges price cards make it hard to infer durable take rates from public data
              alone. The key diligence caveat is not whether the market exists; it is whether Andromeda can capture
              enough recurring economics from coordination, certification, and operations before unit-price deflation
              compresses the spread.
