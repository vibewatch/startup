  - id: TI004
    title: Capital adequacy
    columns:
      - Item
      - Public value / status
      - Why it matters
      - Comparable / context
      - Diligence ask
    rows:
      - - Cash on hand
        - Undisclosed for Andromeda
        - Cannot judge balance-sheet resilience after the March 2026 financing without it.
        - CoreWeave and DigitalOcean disclose liquidity explicitly in filings.
        - Provide quarter-end cash, restricted cash, and available revolver capacity.
      - - Monthly burn
        - Undisclosed for Andromeda
        - Runway cannot be derived from valuation or fundraising headlines alone.
        - DigitalOcean and Amazon disclose cash-flow and capex detail; Andromeda does not.
        - Provide monthly opex burn, any capex, and working-capital swing.
      - - Runway months
        - Undisclosed for Andromeda
        - Needed to understand whether a next round is optional or forced.
        - >-
          DigitalOcean states existing cash and credit should cover at least 12 months; no such Andromeda statement
          exists.
        - Provide base, plan, and downside runway by board-approved model.
      - - Use of recent funding
        - Publicly framed as customer-base growth plus team buildout; detailed allocation unknown
        - Determines whether funds are going to growth, pre-buys, debt service, or defensive liquidity.
        - Careers data shows finance, procurement, partnerships, and compute-market hiring.
        - Provide uses-and-sources budget for 2026 and 2027.
      - - Next-round trigger
        - Undisclosed
        - Necessary to know whether future financing depends on growth, margin, or hidden commitments.
        - >-
          CoreWeave uses asset-level facilities tied to contract-backed capex; Andromeda may not need that if truly
          asset-light.
        - State the milestone that would trigger another raise or credit facility.
      - - Debt / project-finance obligations
        - No public Andromeda disclosure found
        - Even brokers can become levered if they guarantee supply or finance reservations.
        - CoreWeave’s DDTL 5.0 financed contract capex at SOFR + 4.50% with DSCR covenants.
        - Provide debt schedule, guarantees, letters of credit, and reservation commitments.
      - - Working-capital and lease exposure
        - Not publicly disclosed
        - May be the hidden capital-intensity driver if collections lag supplier obligations.
        - >-
          DigitalOcean discloses long-dated co-lo lease obligations; Amazon discloses AWS prepayments and performance
          obligations.
        - Provide DSO, DPO, unearned revenue, prepayments, and any lease commitments.
      - - Disclosure depth versus public comps
        - Low
        - Opacity itself is a financing risk because it forces investors to underwrite blind.
        - >-
          CoreWeave, DigitalOcean, and Amazon all disclose contract, liquidity, or obligation detail that Andromeda
          lacks.
        - Open a data room with audited financials and contract summaries.
    notes: >-
      This table focuses on forward adequacy rather than repeating round chronology; the recurring theme is that public
      comparables can be underwritten because they disclose cash, debt, and obligations, while Andromeda does not.
