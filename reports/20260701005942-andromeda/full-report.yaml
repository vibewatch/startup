  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buying-center shape
        blocks:
          - type: paragraph
            body: >-
              Andromeda's public customer picture is clearest at the segment level, not the named-account level.
              Official copy, the privacy policy, and customer-intake form consistently show a buy-side motion aimed at
              AI teams that need bursty or large-scale training and inference capacity without signing multiyear
              hyperscaler commitments. The immediate buyer is usually an infrastructure, research, or platform lead who
              can specify GPU type, quantity, region, timing, and duration. The operational users appear to be ML
              researchers, platform engineers, and SRE-style infra teams, while the economic buyer can shift upward to
              finance, procurement, security, or legal once the account gets large enough. That split matters because
              Andromeda is not selling a self-serve commodity API; it is selling a services-heavy procurement and
              operating layer around clusters.


              Public recruiting adds the missing segmentation detail. The Solutions Engineer role explicitly targets
              frontier labs, AI-native startups, and enterprises, and names engineering leaders, platform teams, and
              security or infrastructure owners as core stakeholders. The privacy policy separately says the platform
              serves AI teams and enterprises as customers while collecting financial and billing data, which supports a
              payer or user split. On the supply side, Andromeda is also effectively serving providers as channel
              customers or counterparties: data centers, cloud providers, telcos, and other operators bring clusters to
              market through the same platform. That makes the chapter's right framing a two-sided marketplace with
              three especially important demand pools: NFDG or AI Grant startups, confidential large AI labs, and
              enterprise technical buyers running structured evaluations.


              Geographically, the company looks US-centered but not US-only. Public job posts are concentrated around
              San Francisco plus North America or global remote coverage, while official pages promise compute from
              across the globe and collect provider location data. The result is a segmentation profile that is credible
              and commercially coherent, but still missing the most underwriting-relevant splits: active customer count,
              revenue by segment, geography mix, and how much of demand still comes from the NFDG ecosystem.
