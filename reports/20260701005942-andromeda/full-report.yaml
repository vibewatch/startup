  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited revenue bridge and accounting policy
        - >-
          Recognized revenue, GMV, take rate, principal-agent policy, and cohort bridge from 2024 through current 2026
          exit run-rate
        - The present multiple is only meaningful if investors know what revenue actually represents.
        - Finance diligence, auditor package, and controller memo.
      - - Customer retention and concentration
        - NRR, GRR, churn, customer count, top-account share, and spend expansion by segment
        - Durability is the largest unresolved variable after denominator quality.
        - RevOps export, board KPI deck, and reference calls.
      - - Provider concentration and SLA resilience
        - Top-provider share, substitution matrix, utilization history, outage history, and SLA or credit framework
        - Neutral aggregation is valuable only if it can survive provider failure or repricing.
        - Operations diligence and provider-side contract review.
      - - Cap table and financing terms
        - >-
          Security type, liquidation preferences, participation, ratchets, secondaries, side letters, and any debt tied
          to customer contracts
        - Headline valuation can materially overstate real equity value.
        - Counsel review of financing documents and cap table.
      - - Governance and succession
        - Current board, voting control, founder rights, operator succession, and escalation ownership
        - Governance opacity is one of the fastest ways for this thesis to break.
        - Board package, charter set, and management interviews.
      - - Trust, compliance, and enterprise-readiness packet
        - Export-control, sanctions, privacy, security, incident, and DPA materials plus real certification status
        - Exit readiness and premium multiple persistence both require more than a sparse trust page.
        - Legal, security, and enterprise diligence.
    notes: >-
      If these asks cannot be answered cleanly, the right response is to keep tracking the company rather than chase the
      current price.
