      - number: '8.4'
        title: Exit readiness and the diligence asks that actually move the decision
        blocks:
          - type: paragraph
            body: >-
              The public file is good enough to show why Andromeda deserves attention and not good enough to show why a
              new investor should accept the current price without friction. The missing materials are not cosmetic.
              Investors still need an audited or management-certified revenue bridge that distinguishes gross
              marketplace volume from recognized revenue and net spread, a clean read on customer and provider
              concentration, real renewal and retention data, and the financing documents that define what the March
              2026 headline valuation actually means in common-equivalent economics. Without those items, the current
              mark is better described as plausible but under-evidenced.


              That also limits exit-underwriting confidence. The supportable hold logic is a medium-duration
              grow-into-the-multiple case, not a near-term markup or clean strategic-exit case. Hyperscalers and direct
              AI clouds still dominate trust, procurement relationships, and infrastructure depth, while the public
              founder bench around Andromeda is thinner than the original story. If diligence can prove that Andromeda
              owns a sticky, diversified broker layer with net economics and disciplined financing, the recommendation
              can move up. If not, the correct response is patience: track the company, keep access warm, and require
              the business to earn the premium with harder evidence than the public record currently provides.
