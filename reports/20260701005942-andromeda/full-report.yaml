  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call stays cautious because real traction and a receptive 2026 comp tape still collide with hidden economics,
      hidden concentration, and hidden terms.
    data:
      nodes:
        - id: traction
          label: Real market pull
          detail: 100+ providers, 1,000+ transactions, and reported ~$100M 2025 run-rate.
          tone: positive
        - id: market
          label: AI infra multiple support
          detail: Public 2026 comps still trade at premium but highly dispersed valuations.
          tone: positive
        - id: denominator
          label: Denominator risk
          detail: Gross-vs-net revenue treatment and true margin quality remain undisclosed.
          tone: negative
        - id: durability
          label: Durability risk
          detail: Retention, concentration, provider substitution, and multihoming remain under-evidenced.
          tone: warning
        - id: terms
          label: Governance and term opacity
          detail: Founder continuity is thinner and financing terms are still not public.
          tone: negative
        - id: decision
          label: Decision
          detail: Track and keep price discipline until diligence closes the hidden-variable gap.
          tone: neutral
      edges:
        - from: traction
          to: decision
        - from: market
          to: decision
        - from: denominator
          to: decision
        - from: durability
          to: decision
        - from: terms
          to: decision
    approximationNotes: null
    claimRefs:
