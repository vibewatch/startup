- id: TI002
  title: Pricing / monetization
  columns:
  - Surface / comparable
  - Public price or contract signal
  - List vs. realized pricing
  - Revenue-recognition implication
  - Source / caveat
  rows:
  - - Andromeda public quote
    - DCD preserved $2.40-$3.00 per H100-hour and up to 2,000 H100s available within hours
    - One narrow public quote, not a posted catalog
    - Could represent gross compute resale economics, a brokered reservation rate, or a thinly margined
