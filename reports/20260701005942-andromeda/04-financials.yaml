- id: TI001
  title: Revenue streams
  columns:
  - Stream / monetization surface
  - Public evidence
  - Likely unit
  - Public status
  - Revenue-quality note
  - Diligence ask
  rows:
  - - Brokered committed cluster placements
    - Buyer and provider forms plus official workflow point to reserved or scheduled capacity procurement
      across third-party providers.
    - Contracted GPU-hours, cluster reservation, or minimum-spend commitment
    - Supportable
    - Could be attractive recurring revenue if recognized net and renewed at account level.
    - Provide product-level revenue split between committed placements and all other activity.
  - - Urgent / overflow placements
    - DCD preserved a public quote for up to 2,000 H100s available within hours at $2.40-$3.00 per GPU-hour.
    - GPU-hour or short reservation
    - Supportable but narrow
    - Useful proof that Andromeda can clear urgent demand, but one quote does not reveal margin or repeatability.
    - Disclose share of revenue from short-duration overflow versus longer reserved contracts.
  - - Multi-provider billing and support layer
    - Official site says buyers get one invoice, one support channel, and standardized contracts.
    - Service bundle attached to infrastructure spend
    - Supportable
    - Could justify premium economics even when raw GPU prices commoditize.
    - Break out any support, solutions, or platform revenue that is not pure pass-through compute.
  - - Benchmarking / pricing intelligence
    - Official and press sources describe benchmarking, certification, and a pricing index, but do not
      disclose separate monetization.
    - Potential embedded spread or subscription
    - Publicly ambiguous
    - May be bundled into compute economics rather than sold separately.
    - Clarify whether benchmarking and pricing intelligence are monetized separately or embedded in take
      rate.
  - - Provider-side activation and qualification
    - Provider workflow requires detailed onboarding and standardized terms, but no provider fee schedule
      is public.
    - Unknown
    - Not disclosed
    - Could improve supply quality but may or may not generate direct revenue.
    - Disclose whether providers pay onboarding, certification, or success fees.
  - - Accounting presentation of activity
    - No retained source states whether Andromeda books gross customer spend or only its net economics.
    - GMV vs. recognized revenue
    - Not disclosed
    - This is the biggest single revenue-quality issue in the chapter.
    - Provide ASC 606 principal-agent policy and a GMV-to-revenue bridge.
