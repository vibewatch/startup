- id: TI005
  title: Public financial gaps
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Gross-vs-net revenue recognition policy
    - Without this, valuation multiples and revenue quality cannot be trusted.
    - Request ASC 606 memo plus GMV-to-recognized-revenue reconciliation by product line.
  - - Take rate / broker spread
    - No way to translate customer spend or transaction count into contribution economics.
    - Request take-rate history by contract type and by major account cohort.
  - - Cash on hand, burn, and runway
    - Capital adequacy cannot be evaluated from the public file.
    - Request monthly management accounts, cash bridge, and 13-week cash forecast.
  - - Gross margin and service-delivery cost
    - Margin path remains conjectural without cost-of-revenue detail.
    - Request gross margin by workload class and support-cost allocation.
  - - Customer concentration and contract duration
    - A small-team model is risky if one or two labs drive most of the revenue.
    - Request top-10 customer schedule, duration summary, and renewals by cohort.
  - - Working-capital terms and guarantees
    - A supposedly asset-light broker can still consume cash through pre-buys or guarantees.
    - Request DSO, DPO, prepayment policy, provider terms, and any letters of credit.
  - - Debt, credit, or project-finance obligations
    - Hidden leverage would materially change underwriting and downside risk.
    - Request debt schedule, covenant package, and any off-balance-sheet commitments.
  - - Audited 2024-2025 financial statements
    - Press reporting is not enough to confirm quality of earnings or balance-sheet strength.
    - Open a diligence room with audited financials, board budget, and cap-table-linked treasury summary.
  notes: These gaps are the specific blockers that prevent the public file from supporting a full investment
    underwriting decision today.
  enumerationScope:
    coverage: partial
    basis: Rows capture the most decision-critical missing financial inputs identified in this chapter,
      rather than every possible private-company diligence request.
