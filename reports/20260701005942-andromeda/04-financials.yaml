  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: take-rate-and-revenue-recognition
    missingEvidence: Management-level revenue-recognition policy, gross-vs-net presentation, and take-rate
      or spread disclosure by product or contract type.
    whyItMatters: Without this, investors cannot tell whether the public revenue run-rate refers to GMV-like
      gross billings or to true net revenue, making revenue quality and valuation multiples unreliable.
    diligencePath: Request CFO memo on ASC 606 principal-agent treatment, a revenue waterfall from GMV
      to recognized revenue, and sample customer and provider contracts.
    relatedQuestionRefs:
    - QI003
    - QI005
    - QI006
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly operating burn, working-capital swing, and forward
      runway under base and downside cases.
    whyItMatters: Capital adequacy cannot be underwritten from valuation headlines alone; missing cash
      and burn data make it impossible to judge whether the March 2026 financing meaningfully de-risked
      the business.
    diligencePath: Request monthly management accounts, cash bridge, 13-week cash forecast, and board
      materials covering runway and fundraising triggers.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-service-costs
    missingEvidence: Gross margin by workload type, support or solutions-engineering cost allocation,
      and any provider rebates, pre-buys, or reservation commitments.
    whyItMatters: The key debate is whether Andromeda is a high-margin coordination layer or a lower-margin
      reseller that absorbs service-delivery and capacity costs.
    diligencePath: Request contribution-margin analysis by customer cohort, cost-of-revenue definitions,
      and any reservation or prepayment schedules with providers.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-retention
    missingEvidence: Named top customers, share of revenue by top 5 accounts, contract duration, renewal
      rates, and net revenue retention.
    whyItMatters: A broker can look efficient on small headcount, but that efficiency is much less durable
      if one or two labs dominate revenue or if renewals are short-lived.
    diligencePath: Request customer concentration schedule, cohort retention analysis, contract duration
      summary, and pipeline-to-backlog conversion data.
    relatedQuestionRefs:
    - QI008
    - QI015
    - QI016
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-guarantees-and-working-capital
    missingEvidence: Any credit facilities, provider guarantees, payment terms, off-balance-sheet commitments,
      and DSO or DPO policy for buyer and supplier contracts.
    whyItMatters: A marketplace can still become capital intensive if it commits to providers ahead of
      collections or carries supplier guarantees that are not obvious from the website surface.
    diligencePath: Request debt schedule, treasury policy, large supplier agreements, and collections
      and payables aging reports.
    relatedQuestionRefs:
    - QI013
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: minor
    topic: andromeda-audited-financials
    missingEvidence: Audited income statement, balance sheet, and cash flow statements for 2024 and 2025.
    whyItMatters: The public file currently relies on press reporting and company workflow pages; audited
      statements would convert several medium-confidence claims into high-confidence facts.
    diligencePath: Request audited financials, auditor letters, and the board-approved operating plan
      tied to the March 2026 round.
    relatedQuestionRefs:
    - QI017
    - QI023
    - QI028
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
