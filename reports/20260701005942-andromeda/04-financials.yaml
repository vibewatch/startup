- id: gtm-pricing-and-sales-efficiency
  title: GTM motion, price framing, and sales-efficiency proxies
  body: |-
    The GTM motion looks enterprise and consultative rather than self-serve. Andromeda’s customer form asks buyers to identify GPU type, quantity, desired start date, and required number of weeks, while the provider form asks sellers for minimum bookable GPUs and minimum duration. That is the language of negotiated infrastructure procurement, not low-friction SaaS expansion. Upstarts and SiliconANGLE reinforce the same read by describing a buyer set that includes AI companies spending roughly $250 million to $500 million a year on infrastructure. If those buyers are representative, sales cycles likely hinge on cluster qualification, legal terms, and timeline assurance more than on digital demand generation. Public evidence therefore does not support a classical CAC or payback calculation, but it does support a revenue-density proxy: a reported ~$100 million run-rate against a public headcount signal of roughly 17 to 20 employees implies about $5.0 million to $5.9 million of revenue per employee.

    The pricing reference set also says something important about Andromeda’s likely role. CoreWeave, Lambda, RunPod, and Vast all publish explicit price or contract structures, but those structures vary sharply: CoreWeave’s H100 on-demand rate is far above RunPod and Lambda list rates, while Vast emphasizes per-second, interruptible, and short reserved terms. That dispersion suggests the economic value in this market is not just raw GPU access; it is packaged around contract duration, uptime guarantees, networking, support, and qualification. Andromeda’s public materials fit that interpretation. The company does not publish a price list, but it does market standardized contracts, benchmarking, and one operational interface. The likely consequence is that Andromeda wins when customers are paying for procurement certainty and supplier normalization, not when buyers simply want the cheapest visible H100 hour.
