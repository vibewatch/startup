- id: cost-structure-and-capital-adequacy
  title: Cost structure, margin analogs, and capital adequacy
  body: |-
    The public file implies an asset-light model on the surface, but it does not conclusively prove an asset-light P&L or balance sheet. Because Andromeda appears to source third-party capacity rather than operate its own giant fleet, the most obvious direct-cloud costs—owned GPU depreciation, data-center buildout, and hyperscaler-scale power procurement—should be structurally lower than at providers such as CoreWeave or Amazon. Even so, the company still appears to absorb real service-delivery cost: workload qualification, benchmarking, contract standardization, support, observability, and potentially pre-arranged or reserved capacity. That matters because a broker can still become working-capital heavy if it prepays providers, guarantees commitments, or collects from customers after supplier obligations are already fixed. No retained public source discloses those mechanics for Andromeda.

    The public-company analogs sharpen the risk. DigitalOcean’s filings show a much lighter cloud model than CoreWeave, yet even DigitalOcean reported gross margin compression from 61% to 56% in Q1 2026 because data-center expansion costs arrived ahead of revenue, and it still carries meaningful capex and long-dated co-location leases. CoreWeave is the opposite extreme: filings and Fitch show take-or-pay revenue visibility, but also severe concentration, very large debt structures, and asset-level facilities sized specifically to finance customer-contract capex. Amazon’s filings show just how far direct-cloud ownership can scale capital requirements, prepayments, and performance obligations. Against that backdrop, Andromeda’s March 2026 financing improves confidence that capital was available for growth, but public evidence still does not reveal cash on hand, burn, runway, debt, or any provider-side guarantees. That makes forward adequacy impossible to underwrite from public evidence alone.
