    - Only public Andromeda price retained in this run; no take-rate disclosure
  - - CoreWeave direct cloud
    - H100 on-demand $49.24/hour; spot $19.71/hour; up to 60% committed-usage discounts
    - Posted list pricing
    - Principal cloud provider typically recognizes infrastructure revenue directly
    - Premium packaging, networking, and service levels make direct comparison imperfect
  - - Lambda direct cloud
    - H100 $3.99/GPU-hour; clusters from 16 to 2,000+ GPUs; reserved capacity via sales
    - Posted list pricing plus negotiated reserved deals
    - Direct provider economics, not neutral brokerage
    - Useful benchmark for larger reserved training clusters
  - - RunPod developer and cluster path
    - H100 PCIe $2.89/hour and H100 SXM $3.29/hour across pods, serverless, and clusters
    - Posted list pricing
    - Usage-led direct cloud and serverless economics
    - Best read as the low-friction price floor for self-serve buyers
  - - Vast marketplace
    - On-demand, interruptible, and reserved terms; interruptible 50%+ cheaper; 1/3/6 month reserved;
      no long-term contracts required
    - Live market pricing
    - Marketplace-style economics with limited lock-in and per-second billing
    - Shows how transparent exchange-style supply can pressure spreads
