chapter:
  number: 4
  title: Financials
  summary: Public evidence supports Andromeda as a fast-growing, apparently profitable GPU brokerage with
    real revenue scale and a likely asset-lighter model than provider-owned AI clouds, but the public
    file still omits take rate, revenue-recognition policy, gross margin, cash, burn, runway, and customer
    concentration. Relative to direct-cloud comparables, that leaves revenue quality and capital adequacy
    directionally promising but not yet underwriteable.
sections:
- id: revenue-model-and-public-traction
  title: Revenue model, monetization signals, and public traction
  body: |-
    Public evidence is strong enough to describe Andromeda’s monetization surface, but not strong enough to convert that surface into a clean revenue-quality model. Official workflow copy consistently shows a two-sided GPU procurement layer: buyers specify GPU type, quantity, timeline, and duration; providers disclose capacity, minimum bookable size, duration, and terms; Andromeda benchmarks supply, standardizes contracts, routes demand, and then presents one invoice plus one support channel. That makes the company look economically closer to a high-touch infrastructure broker or market layer than to a conventional cloud that owns most of the hardware it sells. The same file also shows why revenue recognition is a core diligence issue. A company that sits between buyers and providers can book economics gross or net depending on contract control, and no retained public source says which policy Andromeda uses.

    The traction side is clearer than the accounting side. Official pages claim 100+ providers, 1,000+ transactions completed, dozens of clusters across many providers, and more than a billion GPU-hours of activity. Independent reporting adds the strongest revenue anchors: Upstarts and SiliconANGLE both place 2025 revenue run-rate around $100 million, more than $50 million of 2024 revenue, and profitability since launch. Data Center Dynamics also preserves the only public Andromeda price cue retained in this run: up to 2,000 H100s at $2.40 to $3.00 per GPU-hour for non-NFDG buyers. Those facts support real commercial scale, but they still leave the central underwriting question unresolved: whether Andromeda’s reported revenue primarily reflects net brokerage economics or a much larger gross pass-through base.
