    - ~$100M
    - medium
    - Best public scale anchor for current commercial relevance.
    - Tie reported run-rate to audited recognized revenue and monthly exit ARR equivalent.
  - - 2024 revenue base
    - '>$50M'
    - medium
    - Shows that 2025 scale was not from zero; helps frame growth velocity.
    - Provide full-year 2024 revenue and monthly progression into 2025.
  - - Profitability since launch
    - Reported profitable since launch
    - medium
    - If true, suggests strong unit economics or unusually lean opex for an infrastructure broker.
    - Disclose EBITDA, operating income, and free cash flow by quarter.
  - - Buyer spend proxy
    - Public targets include buyers spending ~$250M-$500M annually on compute
    - medium
    - Supports large-account, enterprise-style selling motion and concentration risk.
    - Provide customer spend buckets and top-account concentration.
  - - Revenue per employee proxy
    - ~$5.0M-$5.9M per employee
    - medium
    - Suggests high revenue density, but could also reflect gross reporting or concentrated accounts.
    - Reconcile run-rate, headcount, and role mix to true net revenue per employee.
  - - Sales cycle proxy
    - Start date and weeks requested up front; providers disclose minimum duration and minimum bookable
      GPUs
    - medium
    - Implies consultative infrastructure procurement rather than frictionless self-serve conversion.
    - Share median cycle from first call to contract signature and deployment.
  - - Gross margin
    - Not publicly disclosed
    - low
    - The core missing input for underwriting revenue quality.
    - Provide gross margin % and dollars by product or contract type.
  - - CAC / payback
    - Not publicly disclosed
    - low
    - Needed to distinguish efficient enterprise selling from lumpy founder-led deal flow.
    - Provide sales and marketing spend, new ARR or GMV cohort data, and payback analysis.
  - - Take rate / spread
    - Not publicly disclosed
    - low
    - Without this, run-rate cannot be translated into GMV, contribution margin, or competitive durability.
    - Disclose net take rate or broker spread by workload class.
  - - Working-capital intensity
    - Not publicly disclosed
    - low
    - Collections and payables determine whether an apparently asset-light model still consumes cash.
    - Provide DSO, DPO, prepayment terms, and any provider guarantees or reservations.
