- id: architecture-deployment-and-operating-model
  title: Architecture, Deployment, and Operating Model
  body: 'The public operating model is a layered control and support stack that sits between customers, providers, and heterogeneous execution environments. Official workflow pages show structured metadata collection on both sides of the market, while current engineering roles add the missing technical detail: Andromeda is building orchestration, provisioning, lifecycle-management, APIs, services, and control planes that abstract over VMs, Kubernetes, bare metal, and scheduler-based environments. The provider form explicitly accepts Kubernetes, Slurm, and VM interfaces, and the software-engineering role expands that picture to “VMs, Kubernetes, bare metal, schedulers,” which is strong evidence that the company is normalizing multiple infrastructure substrates rather than forcing one stack.


    Deployment also appears intentionally services-led. The solutions-engineering role describes technical discovery, demos, POCs, reference architectures, benchmarking, and cost modeling before clean handoff into production. Site-reliability roles then describe what production support looks like: provisioning Kubernetes clusters across multiple providers, using Terraform, Helm, and automation tooling, operating observability stacks, and leading incidents and postmortems. The most detailed public technical signal comes from the senior SRE role, which names topology-aware scheduling, InfiniBand, RoCE, NVLink, NCCL, CUDA, distributed PyTorch, GPU telemetry, and self-healing automation as core concerns. A self-published GitHub CV from a current Andromeda infrastructure engineer directionally supports the same picture, pointing to GitOps, KubeRay, Slurm, Weka, VAST, Prometheus, Grafana, Loki, and in-house orchestration tooling, though that source should be treated as practitioner signal rather
    than audited company disclosure.'
