- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Andromeda solution
  - Public benefit signal
  - Limitation
  rows:
  - - Secure a large training cluster quickly
    - Supply is fragmented and multiyear contracts are often too rigid for bursty demand
    - Aggregate sourcing, benchmarking, pricing, standardized contracts, and deployment through one interface
    - Faster access to qualified capacity with one invoice and one support relationship
    - Public sources do not quantify median time to deploy or success rate by workload type
  - - Run inference or shorter-duration workloads without owning a fleet
    - Teams may need capacity in spikes rather than permanent commitments
    - Route training and inference jobs across global supply and lease access from multiple providers
    - Asset-light customer access without building a proprietary cluster first
    - No public split between inference usage, training usage, and spot-like workflows
  - - Bring third-party capacity to market
    - Providers have heterogeneous hardware and no standard route to qualified enterprise demand
    - Intake cluster specs, benchmark and certify the environment, then standardize deal structure and route qualified demand
    - Faster path from idle or fragmented supply to revenue
    - Public qualification criteria and failure-handling rules are not disclosed
  - - Execute a technical evaluation or POC
    - Complex buyers need proof on throughput, cost, reliability, and security before production commitment
    - Solutions engineers run discovery, demos, POCs, reference architectures, and success criteria mapping
    - Higher technical trust and cleaner handoff into production
    - Public evidence does not show conversion rate or average POC duration
  - - Operate and debug production GPU clusters
    - Failures can originate in hardware, storage, network fabric, drivers, orchestration, or ML frameworks
    - SRE and platform teams provide observability, GPU health checks, incident response, and postmortem-driven fixes
    - Buyers outsource difficult cluster-debugging work to specialized staff
    - The degree of automation versus expert human intervention is still unclear publicly
  notes: The use cases prioritize customer and provider jobs described in the official workflow surfaces and current technical hiring materials.
