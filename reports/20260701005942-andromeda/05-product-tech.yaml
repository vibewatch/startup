    - Software-engineering and SRE roles describe orchestration, provisioning, lifecycle management, and multi-provider cluster evolution
    - Internal APIs, services, automation, and scheduler abstractions
    - Routing or lifecycle bugs could harm cost, performance, or availability
  - - Execution substrates
    - Runs workloads across VMs, Kubernetes, bare metal, Slurm, and related scheduler environments
    - Provider workflow plus engineering roles explicitly name these environments
    - Provider readiness, driver stacks, scheduler correctness, and hardware health
    - Heterogeneous environments raise integration and support complexity
  - - Reliability and observability layer
    - Monitors GPU health, fabric throughput, system metrics, and incident conditions, then supports response and remediation
    - Senior SRE and site-reliability roles name SLOs, error budgets, telemetry, postmortems, and deep observability
