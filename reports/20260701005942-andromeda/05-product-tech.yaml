  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-methodology
    missingEvidence: Public documentation of the benchmark suite, scoring logic, pass thresholds, failure handling, and re-certification cadence used in Andromeda's certification engine.
    whyItMatters: Certification and standardization are central to the product promise, but outsiders cannot independently assess quality without the methodology.
    diligencePath: Request the provider benchmark rubric, sample scorecards, remediation workflow, and governance process for certification updates.
    relatedQuestionRefs:
    - QE004
    - QE026
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-and-status-reporting
    missingEvidence: First-party uptime reporting, public status history, incident postmortems, customer-impact metrics, and service-level attainment data.
    whyItMatters: The product sells operational reliability and support across third-party GPU environments, so incident transparency is a key trust input for enterprise buyers.
    diligencePath: Request the current status page or internal incident log, MTTR metrics, major postmortems, and any customer-facing SLA or SLO scorecards.
    relatedQuestionRefs:
    - QE019
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: automation-depth
    missingEvidence: Clear disclosure of which deployment, routing, failover, and support steps are fully automated versus expert-assisted or manual.
    whyItMatters: Product scalability and gross-margin potential depend heavily on how much of the workflow can run without high-touch operator involvement.
    diligencePath: Ask management for an architecture walkthrough showing control-plane automation boundaries, operator runbooks, and staff-to-cluster ratios.
    relatedQuestionRefs:
    - QE009
    - QE012
    - QE021
    relatedTableRefs:
    - TE003
    - TE005
  - type: private-evidence-only
    severity: material
    topic: provider-concentration-and-quality-controls
    missingEvidence: Provider concentration by capacity or revenue, provider churn, recertification failure rates, and contractual fallback mechanisms when supply degrades.
    whyItMatters: The asset-light model increases dependence on third-party capacity quality and continuity, which can become the dominant product risk if concentration is high.
    diligencePath: Request provider concentration analysis, top-provider dependency, recertification statistics, and sample contingency workflows for provider outages or underperformance.
    relatedQuestionRefs:
    - QE014
    - QE016
    relatedTableRefs:
    - TE001
    - TE003
    - TE004
