- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - What it does
  - Differentiation
  - Maturity / status
  - Diligence gap
  rows:
  - - Buyer demand intake and sourcing workflow
    - AI lab, startup, or enterprise infrastructure buyer
    - Collects workload requirements including GPU type, quantity, region, and timeline, then starts sourcing and pricing
    - Turns fragmented capacity discovery into one structured intake motion
    - Live and publicly visible
    - No public evidence of self-serve API, scheduler plug-in, or customer-configurable policy surface
  - - Provider onboarding and certification workflow
    - Data center, cloud, telco, or other compute provider
    - Captures GPU, network, storage, location, interface, and availability data, then routes clusters into qualification and demand matching
    - Standardizes heterogeneous supply before it reaches buyers
    - Live and publicly visible
    - Benchmark suite, pass thresholds, and remediation rules are not published
  - - Benchmarking, pricing, and contract normalization
    - Buyer and provider commercial operators
    - Benchmarks supply, prices it across the network, standardizes SLAs and contracts, and exposes a pricing index signal
    - Combines market intelligence with transaction execution instead of acting as a passive listing board
    - Live in public narrative, methodology opaque
    - No public methodology for the pricing index, benchmark weighting, or contract templates
  - - Multi-provider orchestration and control plane
    - Internal platform team and customer technical teams
    - Abstracts over VMs, Kubernetes, bare metal, and schedulers for provisioning, lifecycle management, and routing of training or inference jobs
    - Creates one control layer across heterogeneous compute substrates
    - Active build-out with strong hiring signal
    - No public architecture docs, API reference, or release notes proving feature completeness
  - - Operations, observability, and incident support layer
    - Customer platform teams and Andromeda operations staff
    - Provides observability, troubleshooting, reliability monitoring, incident response, and post-deployment optimization
    - Promises hyperscaler-like support without requiring customers to manage every provider directly
    - Real and expanding
    - Public MTTR, uptime, and incident-history metrics are absent
  - - Solutions engineering and POC motion
    - Technical buyers, security owners, and platform teams
    - Runs demos, reference architectures, evaluation plans, cost modeling, and POC-to-production handoffs
    - Makes the platform easier to buy and deploy than raw brokered capacity alone
    - Active and clearly staffed
    - Public customer case studies on full deployment motion are still sparse
  notes: Rows reflect the product surfaces explicitly visible in public workflow pages, hiring material, and independent reporting rather than every internal subsystem.
  enumerationScope:
    coverage: partial
    basis: The matrix focuses on the main externally evidenced product layers that buyers or providers encounter and does not claim to enumerate every internal tool or service.
