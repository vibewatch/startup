  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: First-party customer quotes, case studies, or reference calls from named Andromeda users such as ElevenLabs, Pika, or a non-NFDG enterprise account.
    whyItMatters: Independent named references would sharply reduce uncertainty around production status, outcomes, and reference quality.
    diligencePath: Request three referenceable current customers under NDA, with at least one non-NFDG startup and one enterprise or major lab account.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal timing, contract mix, repeat-account share, and time-bucket cohort data.
    whyItMatters: Without those metrics, outside investors cannot separate a fast-growing but fragile brokerage from a durable infrastructure platform.
    diligencePath: Request cohort tables by segment, including logo retention, dollar retention, contract duration, and top-10-customer concentration.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: channel-and-customer-concentration
    missingEvidence: A channel-sourced versus direct-sourced customer split and top-customer revenue concentration disclosure.
    whyItMatters: The chapter can see Andromeda expanding beyond NFDG, but it cannot size how dependent current revenue still is on the founding ecosystem or a handful of large confidential accounts.
    diligencePath: Request customer origin by channel, top-1 and top-5 customer shares, and revenue mix for NFDG-origin versus external accounts.
    relatedQuestionRefs:
    - QU017
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: procurement-friction-and-close-rates
    missingEvidence: Average sales-cycle length, security-review pass rates, standard redline cycle time, and evaluation-to-production conversion by segment.
    whyItMatters: These operating metrics determine whether Andromeda's high-touch motion is scalable or whether support and contracting become a bottleneck.
    diligencePath: Request funnel analytics from lead through scoping, POC, security review, production, and expansion for startup, lab, and enterprise cohorts.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU006
