- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Frontier AI labs / model builders
    - 'Buyer: infra/research lead; user: training engineers; payer: finance/procurement'
    - Large training and high-intensity inference clusters
    - Official pages and jobs repeatedly cite leading AI labs and top-customer training runs
    - Large spend, high urgency, strong repeat-usage potential
    - No named lab customer or revenue split disclosed
  - - AI-native startups / AI Grant companies
    - 'Buyer: founder/platform lead; user: research and ML infra teams; payer: startup finance'
    - Burst training runs, early inference, flexible cluster access
    - AI Grant offers Andromeda Cluster access; Upstarts names ElevenLabs and Pika as early users
    - Early-volume channel and founder-network flywheel
    - Current active-customer count and retention by cohort not public
  - - Enterprise AI / platform teams
    - 'Buyer: exec sponsor plus platform, security, and procurement stakeholders; user: internal AI platform teams'
    - Structured evaluations, POCs, production handoffs
    - Solutions Engineer role explicitly targets enterprises and strategic accounts
    - Higher ACV and land-and-expand potential
    - No named enterprise deployment reference surfaced
  - - Inference-heavy AI operators
    - 'Buyer: platform or serving lead; user: inference/SRE teams; payer: finance'
    - Shorter-duration or variable-demand inference workloads
    - Official insights and jobs cite training and inference routing across providers
    - Matches shift toward flexible, non-multiyear demand
    - No named inference customer publicly confirmed
  - - Compute providers / supply-side counterparties
    - 'Buyer: provider BD or infra lead; user: cluster operators; payer: provider organization'
    - Bring idle or fragmented GPU capacity to market
    - Provider form, partnerships role, and procurement role all show structured provider onboarding
    - Supply breadth is core to customer value and utilization
    - Provider concentration and revenue mix by supplier are undisclosed
  - - VC / accelerator channel
    - 'Buyer: fund or accelerator partner; user: portfolio company infra teams; payer: varies by deal structure'
    - Channel access for portfolio compute needs
    - Head of Partnerships role says VC funds and accelerators are deliberate distribution partners
    - Efficient customer acquisition and ecosystem lock-in
    - Creates concentration risk if demand remains too NFDG-weighted
  notes: Rows segment the visible demand and channel surfaces; they do not imply exhaustive customer counts or revenue shares because Andromeda does not disclose those publicly.
