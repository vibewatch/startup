- id: TU006
  title: Enterprise procurement and proof-visibility friction table
  columns:
  - Friction point
  - Public signal
  - Customer impact
  - Commercial implication
  - Diligence ask
  rows:
  - - Security / data-processing review
    - Privacy policy offers a DPA on request and describes business-only processing
    - Enterprise buyers likely need formal legal and security review before deployment
    - Can lengthen enterprise onboarding but also improves account quality once closed
    - Request standard security packet, DPA template, and compliance roadmap
  - - Multi-stakeholder technical evaluation
    - Solutions Engineer role names executives, platform teams, and security owners in the buying process
    - Deals require coordinated technical validation, not simple self-serve checkout
    - Increases pre-sales cost and dependency on scarce senior talent
    - Request median stakeholders per deal and conversion by segment
  - - Revenue-critical contracting
    - Built In jobs summary highlights revenue-critical agreements, privacy/export, and finance partnership
    - Large deals likely involve custom contract work and compliance review
    - May slow close times or narrow the buyer pool
    - Request average redline cycle length and standard term exceptions
  - - Live supply-demand matching
    - Compute Trader and business-staff roles center on matching leads to capacity and maximizing utilization
    - Customers may need custom sourcing before production starts
    - Supply-side complexity can improve margins but creates execution risk
    - Request percentage of demand filled immediately versus brokered over time
  - - Reference opacity
    - No official case study library or named customer quote set surfaced in reviewed materials
    - Prospects have less public proof to de-risk purchase decisions
    - Can raise CAC and make enterprise selling harder
    - Request reference program details and list of referenceable customers under NDA
  - - Sparse public trust center
    - Trust center exposes little substantive content relative to enterprise-grade claims
    - Security-conscious customers may need deeper offline diligence
    - Weakens public conversion support for larger accounts
    - Ask for roadmap for trust-center content, SLA disclosure, and incident-history transparency
  notes: This extra table turns procurement friction into a concrete diligence agenda; it substitutes for a retention cohort figure because public time-bucket retention data was not found.
  claimRefs:
