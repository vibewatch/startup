- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: |-
    There is enough evidence to conclude that Andromeda has real adoption, but not enough to conclude that public customer proof is strong. Official pages anchor the top-of-funnel and operating-scale story: 100-plus providers, 1,000-plus transactions, billion-plus GPU-hour activity, and dozens of clusters across many providers. Independent reporting then adds important commercialization markers. DCD reported that by June 2025 the cluster had already opened to non-NFDG customers, with quoted pricing, fast onboarding, and up to 2,000 H100s available. Upstarts and SiliconANGLE add that the business reached about a $100 million 2025 run rate while serving notable startups and labs that Moushey largely declines to name. Put together, that is credible proof of live production demand, even if it is still mostly aggregate rather than account specific.

    Named proof is much thinner. The cleanest explicit names in this run are ElevenLabs and Pika: Upstarts says both took advantage of the early portfolio cluster, and SaaS Sentinel repeats that point. Those references matter because they link Andromeda to breakout AI workloads rather than to generic startup logos, but they still stop short of the best form of customer proof. There is no first-party case study from Andromeda, no customer quote from ElevenLabs or Pika attributing production usage to Andromeda, and no public deployment outcome such as deployment duration, training throughput, savings, uptime, or contract expansion. Cursor, Perplexity, Browserbase, and other AI Grant companies are relevant to channel analysis because AI Grant says larger investments come with access to the Andromeda Cluster, but direct deployment by those names remains only ecosystem-linked, not publicly confirmed.

    The right conclusion is therefore disciplined rather than promotional. Andromeda appears to have moved beyond a portfolio-only experiment into a real confidential compute market with both startup and larger-lab demand, yet the public reference set is still unusually thin for a business claiming meaningful scale. Investors should treat the aggregate adoption metrics as supportive, and the named-customer proof as real but incomplete.
