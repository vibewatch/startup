- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - VC and accelerator partnerships channel portfolio companies into Andromeda
    - Expansion driver
    - Efficient early-customer acquisition and founder-trust flywheel
    - Quantify how much pipeline and revenue still originate from NFDG or AI Grant versus direct sales
  - - Opening to non-NFDG buyers widened addressable demand beyond a captive portfolio
    - Expansion driver
    - Reduces pure ecosystem dependence and supports external commercialization
    - Request cohort of non-NFDG accounts and their revenue contribution since mid-2025
  - - Services-led POC and strategic-account motion can expand into larger production relationships
    - Expansion driver
    - Supports land-and-expand if evaluations convert
    - Request win rate, expansion ARR, and staffing leverage per solutions engineer
  - - Confidential large AI labs may represent outsized but unnameable accounts
    - Concentration risk
    - Potentially high ACV but impossible to size from public evidence
    - Request top-5 customer share, top-1 customer share, and renewal visibility
  - - Portfolio-origin customer base may remain disproportionately tied to the NFDG ecosystem
    - Concentration risk
    - Channel concentration can weaken bargaining power and external validation
    - Map customer origin by channel and test whether non-NFDG logos now dominate growth
  - - Some mature customers may internalize procurement and SRE capabilities over time
    - Concentration risk
    - Could cap long-term retention for the most sophisticated accounts
    - Ask for churn reasons and examples of customers graduating off the platform
  - - Procurement, legal, security, and export review appear high-touch for larger deals
    - Concentration risk / friction
    - Longer cycles and heavier sales-support burden can slow expansion
    - Request average sales cycle, security-review pass rate, and contract-close bottlenecks
  notes: The expansion case is credible, but the public record still does not reveal top-customer concentration, channel mix, or how sticky large confidential lab accounts really are.
