  topStrengths:
    - 100+ 家供应方、1,000+ 笔交易和据报 ~$100M 2025 收入运行率，指向真实市场活动。
    - 中立的多供应方寻源、标准化合同和托管运营，切中了 GPU 采购真实摩擦。
