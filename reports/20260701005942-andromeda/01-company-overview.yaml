  evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-date and early-incorporation evidence for TO004
    missingEvidence: A certificate of incorporation, founding announcement, or other direct primary record that fixes the exact legal founding date of Andromeda Cluster, Inc.
    whyItMatters: Later chapters need a stable founding-date anchor, and public narrative sources only support late-2023 project origin rather than a precise incorporation day.
    diligencePath: Request formation documents or the company's first board or financing memo and reconcile them against the late-2023 recruitment and March 2026 launch narrative.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance and board disclosure for TO002 and TO003
    missingEvidence: Current board composition, observer rights, voting control, and any founder or investor governance agreements.
    whyItMatters: Without board and control-right visibility, the founder transition to Meta and current CEO concentration cannot be evaluated confidently for downside control or succession risk.
    diligencePath: Request the current board list, investor-rights summary, and cap-table governance memo from management or counsel.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: capital-stack and secondaries disclosure for TO001 and TO003
    missingEvidence: A financing summary showing the exact March 2026 tranche size, total lifetime capital raised, whether any secondaries occurred, and how earlier NFDG funding should be classified.
    whyItMatters: Valuation alone does not show dilution, cash actually added to the company, or whether sponsor capital built assets that sit outside the current corporate equity story.
    diligencePath: Obtain the board-approved financing memo or investor deck that reconciles Paradigm capital, pre-spinout NFDG funding, and any secondary component.
    relatedQuestionRefs:
    - QO014
    - QO015
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: debt or credit facilities for TO001
    missingEvidence: Any lender names, facility sizes, borrowing bases, or working-capital arrangements used to support Andromeda's compute business.
    whyItMatters: Credit access can materially shape working capital, inventory risk, and resilience in a compute brokerage model, but public evidence only hints at the issue.
    diligencePath: Ask management and finance for a debt schedule or a no-debt confirmation tied to the current balance sheet.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
