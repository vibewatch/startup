- id: capital-history-and-scale-metrics
  title: Funding history, valuation anchor, and scale metrics
  body: |-
    The strongest clean financing anchor is the March 2026 Paradigm transaction. Upstarts says the company raised new funding from Paradigm at a $1.5 billion valuation and that Paradigm's total investment in Andromeda now stands at $60 million. Raising.fi and Gaebler both repeat the $60 million figure, while Gaebler classifies the event as venture equity and SiliconANGLE says the exact size of the newly closed tranche was unclear even as Paradigm's aggregate investment reached that level. The practical takeaway is that valuation and sponsor identity are reasonably well anchored, but round labeling, security type, and lifetime company capital are not. That matters because NFDG also appears to have financed the precursor cluster with more than $100 million before the spinout, and public sources do not clearly separate pre-spinout asset build from current-company equity.

    Operational scale looks stronger than the cap-table disclosure. Official and independent sources line up on 100+ providers and 1,000+ transactions, and official copy adds billion-plus GPU-hour activity plus dozens of clusters across many providers. Upstarts and SiliconANGLE both report a 2025 revenue run rate of about $100 million after more than $50 million in 2024, with profitability since launch. But several important metrics are still absent or only range-bound: customer count is not publicly disclosed, headcount is only observable as 17 on Built In versus about 20 in Upstarts, and no public source cleanly confirms secondaries, debt facilities, or a full post-spinout capital stack. Later chapters should therefore treat valuation, revenue run rate, provider breadth, and transaction volume as reusable anchors while keeping customer concentration, financing mechanics, and workforce scale explicitly caveated.
