  topStrengths:
    - Real marketplace activity signaled by 100+ providers, 1,000+ transactions, and a reported ~$100M 2025 run rate
    - Neutral multi-provider sourcing, standardized contracts, and managed operations address real GPU procurement friction
    - Strong founder and sponsor pedigree gave Andromeda early access to frontier AI demand and capital
  topRisks:
    - Governance and succession remain opaque after Nat Friedman and Daniel Gross stepped back from active involvement
    - Public customer retention, concentration, and gross-vs-net revenue quality are not disclosed
    - Third-party provider dependence and sparse public trust/compliance detail could compress margins and durability
  unresolvedGaps:
    - Audited or diligence-room bridge for recognized revenue, take rate, gross margin, and cash conversion
    - Customer and provider concentration, NRR/GRR, contract length, and SLA performance data
    - Cap table, secondary or preference terms, debt or guarantees, and a clear governance or succession map
