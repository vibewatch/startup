companyProfile:
  summary: Andromeda is a San Francisco-based private company that brokers and operates access to third-party GPU clusters for AI teams that want flexible capacity without long-term hyperscaler-style commitments. The company grew out of the Andromeda Cluster built around Nat Friedman and Daniel Gross's network, now operates under CEO Wil Moushey, and positions itself as a neutral market layer that benchmarks providers, standardizes contracts, consolidates billing, and helps buyers deploy and manage large-scale compute across fragmented supply.
  founders:
    - name: Nat Friedman
      role: Founder
      background: Former GitHub chief executive and NFDG cofounder whose network seeded the original cluster narrative.
      claimRefs: [CO009, CO013]
    - name: Daniel Gross
      role: Founder
      background: NFDG cofounder and veteran AI/search operator who helped originate the compute-market thesis and later moved to Meta.
      claimRefs: [CO009, CO014]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: Marketplace and managed-operations layer for sourcing, certifying, pricing, contracting, deploying, and supporting GPU clusters across many third-party providers.
  customerFocus: AI-native startups, frontier labs, and enterprise AI teams that need burst or scaled training and inference infrastructure.
  businessModel: Brokered GPU procurement and operations with standardized contracts, consolidated billing, and support around third-party supply.
  stage: Private / growth
  fundingStatus: March 2026 Paradigm-backed financing at a $1.5B valuation with $60M of disclosed Paradigm capital to date; full lifetime capital and preference stack remain opaque.
