callouts:
- calloutType: insight
  title: The real market is outsourced GPU liquidity, not total AI infrastructure spend
  body: The broad GPUaaS category is already multi-billion-dollar, but Andromeda should not be valued against all AI capex, hyperscaler build-out, or model-API consumption. Its actual arena is the narrower slice where buyers need outsourced multi-provider capacity plus trust, contracting, and operating support.
  claimRefs:
  - CM001
  - CM005
  - CM007
  - CM038
- calloutType: strength
  title: Fragmentation is what creates room for a broker
  body: The wide spread between spot, specialist-cloud, and hyperscaler-equivalent H100 pricing is evidence that the market is not a single commodity pool. As long as networking, reliability, support, and contract terms vary this much, a neutral certification and routing layer can still add real value.
  claimRefs:
  - CM014
  - CM017
  - CM018
  - CM023
  - CM026
  - CM027
- calloutType: risk
  title: Price deflation can expand demand while compressing take rates
  body: Public price cards suggest raw GPU access is cheaper and more abundant than it was in 2024, but those same trends can make broker economics harder to underwrite if value does not shift decisively into operations, reliability, and procurement convenience. Public sources still do not reveal Andromeda's take rate, buyer mix, or renewal economics.
  claimRefs:
  - CM021
  - CM023
  - CM037
  - CM038
  - CM040
  - CM042
