  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Andromeda-specific SAM, SOM, and take rate
    missingEvidence: No retained public source discloses Andromeda's customer mix, GMV, take rate, average contract duration, renewal rate, or geography mix, so a clean company-specific SAM or SOM cannot be constructed.
    whyItMatters: Without those operating disclosures, investors cannot tell how much of the broad GPUaaS market is truly reachable by Andromeda or how much of routed spend converts into durable revenue.
    diligencePath: Ask management for buyer mix, GMV versus revenue, average contract duration, average markup or take rate, and cohort-level renewal behavior by workload type.
    relatedQuestionRefs:
    - QM009
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: Budget-owner and procurement chain visibility
    missingEvidence: Public sources imply that infrastructure, procurement, and finance budgets matter, but they do not identify the exact budget owner, approver chain, or champion persona for named Andromeda customers.
    whyItMatters: Sales-cycle length, renewal risk, and expansion motion depend heavily on whether the true economic buyer is a CTO, central cloud-finance team, or procurement function.
    diligencePath: Request anonymized procurement-case studies showing who signed the contract, what duration was approved, and what performance or savings evidence closed the deal.
    relatedQuestionRefs:
    - QM013
    - QM024
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: 2026 H100 price comparability across providers
    missingEvidence: The retained market record mixes spot rates, self-serve single-GPU rates, full-node reserved pricing, and support-heavy enterprise bundles. That preserves reality but prevents a clean apples-to-apples margin benchmark.
    whyItMatters: If price-card rows are not normalized for uptime, networking, reserved duration, and support, they can overstate commoditization risk or understate the premium buyers still pay for reliability and trust.
    diligencePath: Rebuild the comparison from signed contract examples or normalized quotes that hold GPU type, duration, support level, network fabric, and geography constant across providers.
    relatedQuestionRefs:
    - QM007
    - QM019
    - QM026
    - QM028
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: Public buyer vertical and geography mix
    missingEvidence: Retained public sources do not disclose what share of Andromeda demand comes from frontier labs, startups, enterprises, or specific geographies.
    whyItMatters: Segment mix determines sales efficiency, regulatory exposure, concentration risk, and how resilient demand remains if frontier-training budgets slow.
    diligencePath: Ask management for revenue or GMV mix by customer segment, workload class, and geography, even if only in high-level buckets.
    relatedQuestionRefs:
    - QM010
    - QM027
    relatedTableRefs:
    - TM003
