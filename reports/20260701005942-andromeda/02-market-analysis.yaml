- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Enterprise AI and cloud spending intent
    - driver
    - current
    - Sustains demand for outsourced GPU capacity even as unit prices fall
    - Validate whether Andromeda is actually capturing budget from that spend-intent wave or only benefiting from general market excitement
  - - Businesses unable to buy enough chips or servers directly
    - driver
    - current
    - Pushes buyers toward GPUaaS specialists and brokers rather than owned clusters
    - Test how much of Andromeda's pipeline comes from allocation failure at hyperscalers or OEM channels
  - - More specialist supply and price transparency
    - driver
    - current to near-term
    - Expands accessible workloads, especially overflow training and cost-sensitive inference
    - Confirm whether price transparency increases Andromeda conversion or merely narrows take-rate spread
  - - Reliability and benchmark premium
    - driver
    - current
    - Creates willingness to pay for certified, support-heavy supply rather than the absolute lowest sticker price
    - Ask for evidence that customers choose Andromeda for uptime / performance, not just access
  - - Cluster non-fungibility and architecture differences
    - constraint
    - structural
    - Makes the market hard to commoditize and slows fully automated matching
    - Review how Andromeda benchmarks fabric, storage, and performance versus what buyers actually care about
  - - Trust, security, SLA, and procurement burden
    - constraint
    - structural
    - Lengthens adoption cycles and keeps some buyers on hyperscaler or owned-cluster defaults despite higher cost
    - Request examples of enterprise security review, contract cycle length, and renewal drivers
  - - HBM, CoWoS, rack power, and data-center build bottlenecks
    - constraint
    - current to medium-term
    - Means supply relief is incomplete and location-specific, preserving volatility in availability and pricing
    - Ask how much Andromeda supply is already contracted, energized, and benchmarked versus still theoretical
  - - Unit-price deflation and apples-to-oranges price cards
    - constraint
    - current
    - Can expand demand while simultaneously compressing broker economics and obscuring gross-margin benchmarks
    - Get management-level disclosure on take rate, pass-through GMV, services mix, and how pricing is normalized across providers
  notes: This table mixes demand drivers with adoption constraints because both determine valuation relevance; the most important open question is whether Andromeda captures durable economics from trust and coordination as raw compute prices fall.
