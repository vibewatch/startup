- id: sizing-lenses
  title: Evidence-constrained sizing lenses and estimate ranges
  body: |-
    The top-down category lens is straightforward even if the company-specific slice is not. The Business Research Company estimates global GPUaaS revenue at $7.39 billion in 2026, up from $5.8 billion in 2025 and reaching $19.34 billion in 2030 at a 27.2% CAGR. S&P Global's 451 Research buyer-insight page reinforces that this is already a real category by disclosing that its GPUaaS market monitor tracks revenue and growth expectations across 22 providers worldwide. That is the broad TAM backdrop, but it is too wide to call Andromeda's serviceable market because it mixes hyperscalers, specialist clouds, and managed-service layers with very different economics.

    A more useful market lens comes from observed 2026 price cards. Official pricing and market roundups show H100-equivalent capacity clearing across a wide band: Presenc cites roughly $1.20-$2.00 per hour for spot and about $1.80-$3.50 on-demand in Q2 2026; RunPod lists H100 at $2.89-$3.29; Lambda lists H100 at $3.99; CoreWeave's public HGX H100 node pricing implies about $6.16 per H100-hour on-demand; and Google Cloud's public A3 High and A3 Mega cards imply about $11.06-$11.68 per H100-hour before discounts. Cyfuture's market write-up preserves the other extreme by arguing that some premium hyperscaler tiers still reach about $14.19 per hour. This is not noise to smooth away: it is evidence that the market is fragmented by workload criticality, support level, quota access, and contract structure rather than converging to one commodity price.

    The narrowest public Andromeda-relevant lens is a lower bound, not a true SAM. DCD reported that the Andromeda cluster could offer up to 2,000 H100s within hours at $2.40-$3.00 per GPU-hour. If that public quote were fully utilized for a year, it would represent roughly $42.0 million to $52.6 million of annualized raw compute spend. That number is far too narrow to serve as Andromeda's TAM, but it is useful as a visible open-market liquidity floor. Public evidence still cannot isolate how much of the broader GPUaaS market is both multi-provider and trust-sensitive enough to require a broker, nor what share of that spend Andromeda can capture as revenue rather than pass-through GMV. The right conclusion is therefore evidence-constrained: the category is large and growing, but precise SAM and SOM remain under-disclosed.
