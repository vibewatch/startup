- id: buyer-segmentation
  title: Buyer, user, payer, and adoption path
  body: |-
    The public evidence points to several distinct demand segments rather than one generic 'AI company' buyer. Frontier labs and training-heavy model builders are the clearest first segment: Andromeda's own intake form asks prospects to specify GPU type, cluster size, start date, and the number of weeks needed, and SiliconANGLE reports that some current target customers spend $250 million to $500 million per year on infrastructure. That is a very different buying motion from a developer swiping a card for one GPU. A second segment is venture-backed AI startups and scale-ups that need fast access to H100- or H200-class capacity without waiting for hyperscaler allocations or signing rigid multi-year contracts. A third segment is enterprise AI platform and regulated HPC teams that can use AWS, Azure, or Google directly but still care about overflow, geographic diversity, or alternative suppliers when quotas, lead times, or cost become constraining.

    The user, buyer, and payer are not the same person in any of those segments. The likely end users are researchers, training engineers, inference engineers, and platform teams. The buyer is usually the infrastructure or platform lead who decides whether a workload should run on hyperscaler, specialist cloud, owned cluster, or brokered supply. The payer for meaningful commitments is more centralized: cloud-finance owners, procurement, or CFO-backed infrastructure budgets authorize reserved or long-duration capacity. That split is visible indirectly in Andromeda's forms, which ask for timing, duration, minimum bookable capacity, and price, and in S&P's framing of enterprise AI decision-makers and buyer criteria. Smaller or fault-tolerant workloads follow a different path and often clear through spot or interruptible marketplaces such as Vast or lower-tier RunPod inventory.

    Andromeda's supply side is also segmented. The company says capacity exists in telco and crypto data centers, legacy MSPs, sovereign clouds, startup clouds, and even on the balance sheet of other labs. Its provider workflow shows why that matters: sellers must disclose networking, storage, location, minimum durations, and pricing, which means the market is really a matching problem across technical fit, contract shape, and time horizon. The adoption path is therefore closer to infrastructure procurement than to software self-serve: define workload, specify GPUs and duration, benchmark candidate clusters, clear contracting and operational requirements, deploy on the right substrate, and only then consider renewal or multi-provider expansion.
