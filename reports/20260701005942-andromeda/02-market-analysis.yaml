- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Brokered multi-provider GPU compute
    - Outsourced training or inference clusters, workload routing, benchmarking, standardized contracts, billing, SLAs, and operational support across third-party providers
    - Owned-cluster capex, chip purchases, data-center construction, and pure model-API spend
    - AI labs, startups, platform teams, and centralized cloud/procurement budgets
    - Core category Andromeda is trying to own
  - - Specialist first-party GPU clouds
    - On-demand, spot, interruptible, or reserved capacity sold directly by RunPod, Lambda, CoreWeave, Vast, and similar operators
    - Neutral-broker matching economics and cross-provider standardization
    - ML engineers, infra leads, and training teams paying direct cloud bills
    - Primary substitute set and most immediate clearing-price benchmark
  - - Hyperscaler accelerator instances
    - AWS P5, Google A3, Azure ND H100/H200 and associated cluster tooling
    - Cross-provider brokerage, third-party bare-metal supply, and neutral market routing
    - Enterprise cloud budgets, regulated HPC teams, and strategic accounts
    - Status-quo premium substitute and trust benchmark
  - - Direct bilateral provider contracts
    - Dedicated agreements with telcos, crypto miners, MSPs, sovereign clouds, or startup clouds
    - Marketplace aggregation, one-invoice consolidation, and common benchmarks
    - Infra buyers and procurement teams willing to negotiate bespoke deals
    - Supply path that Andromeda claims to standardize and aggregate
  - - Self-owned or financed clusters
    - GPU, server, networking, power, and facility spend for internally controlled capacity
    - Any outsourced market-service layer
    - CFO, finance, and infrastructure teams using capex or committed leases
    - Important adjacency but outside Andromeda's direct serviced market
  - - Model-API or application spend
    - Tokenized model access, application-layer AI subscriptions, and software tooling on top of compute
    - Dedicated GPU reservations and bare-metal cluster control
    - Product, application, or experimentation budgets
    - Can substitute for some inference jobs but is outside the brokered GPU market boundary
  notes: Included spend is limited to outsourced GPU capacity and the market-making services around it; excluded spend captures owned infrastructure, chip capex, and model-API consumption that should not be rolled into Andromeda's direct market.
