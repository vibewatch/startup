  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Andromeda (subject)
        - March 2026 private mark vs reported 2025 run-rate / 2024 revenue floor
        - $1.5B; ~15x reported 2025 run-rate and ~30x the >$50M 2024 floor
        - The exact underwriting question at issue.
        - Revenue basis, gross-vs-net treatment, and financing terms remain undisclosed.
      - - CoreWeave
        - June 30 2026 P/S and trailing revenue
        - ~8.7x P/S on ~$6.23B TTM revenue; ~$54.3B market cap
        - Best public pure-play AI cloud reference for current investor appetite.
        - Owned infrastructure, take-or-pay contracts, and extreme concentration make it a very different model.
      - - DigitalOcean
        - July 2026 market cap / TTM revenue
        - ~17.4x revenue; ~$16.38B market cap on ~$0.94B TTM revenue
        - Useful asset-lighter public cloud reference with filing-backed diversification and contract mix.
        - Broader SMB cloud platform with stronger disclosure and far less marketplace opacity.
      - - Nebius Group
        - July 2026 market cap / current revenue
        - ~135x revenue; ~$70.11B market cap on ~$0.52B revenue
        - Shows how far the market will stretch for AI-infrastructure option value in 2026.
        - Too speculative and too vertically different to treat as a clean comp.
      - - Amazon / AWS context
        - July 2026 whole-company market cap
        - ~$2.563T market cap
        - Useful only as a trust, procurement, and bundling ceiling for incumbents that can pressure broker value.
        - Whole-company context, not a direct valuation multiple for a neutral GPU intermediary.
    notes: 'This is the full explicitly chosen comp basket for this chapter: the subject mark plus three public AI/cloud references and one incumbent context row.'
