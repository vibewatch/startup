  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Neutral brokerage wedge
        - Official workflows and independent reporting support a real need for multi-provider sourcing, qualification, and unified contracting.
        - Proof that customers renew and expand because Andromeda meaningfully beats direct procurement on speed, outcomes, or economics.
      - - Real commercial scale
        - Public reporting supports ~$100M 2025 run-rate plus 100+ providers, 1,000+ transactions, and billion-plus GPU-hour activity.
        - An audited recognized-revenue bridge and customer-count disclosure would turn scale from plausible into underwriteable.
      - - Asset-light upside
        - If Andromeda earns net spread without owning most supply, the model could deserve a premium relative to capital-heavier clouds.
        - Show principal-agent accounting, gross margin, and working-capital mechanics that confirm revenue is economically clean.
      - - 'Counter: denominator quality is still unknown'
        - Public sources still do not show whether the reported revenue base is gross pass-through or net brokerage economics.
        - A management-certified revenue-recognition memo and cohort economics could materially improve conviction.
      - - 'Counter: durability and multihoming risk are unresolved'
        - Named customer proof is thin, no NRR or GRR is public, and at least one early user is visibly scaling with Google Cloud.
        - Retention, concentration, and wallet-share data would show whether Andromeda is a sticky platform or a useful interim layer.
      - - 'Counter: governance and financing opacity remain high'
        - Founders no longer appear active, the control map is thin, and public round coverage omits security terms and preference detail.
        - Board, succession, and financing documents would show whether the headline valuation maps cleanly to investable economics.
    notes: The thesis is strongest on real market need and apparent scale; the anti-thesis is strongest on hidden economics, hidden concentration, and hidden terms.
