  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Revenue assumption
      - Valuation logic
      - Implied equity value
    rows:
      - - Bull
        - Management proves that current scale is mostly net, high-margin brokerage economics with manageable concentration and rising lender / provider leverage.
        - ~$120M-$150M near-term recognized revenue or run-rate equivalent with strong renewal behavior
        - ~18x-24x revenue for a scarce AI-infrastructure broker with improving trust and durability
        - $2.2B-$3.6B
      - - Base
        - The business is real and still growing, but public gaps on retention, concentration, and financing terms persist long enough to cap enthusiasm.
        - ~$100M-$120M with mixed but acceptable economic quality
        - ~10x-15x revenue on a still-premium but evidence-discounted multiple
        - $1.0B-$1.8B
      - - Bear
        - Revenue proves gross or thin-margin, direct clouds close the workflow gap, or concentration / governance issues cut the premium.
        - ~$80M-$100M with lower implied net economics and weaker durability
        - ~5x-8x revenue closer to a harsher infrastructure or broker-style discipline band
        - $0.4B-$0.8B
      - - Current mark
        - Today's public anchor already assumes the company is at least in the upper half of the base case.
        - ~$100M reported 2025 run-rate
        - ~$1.5B headline valuation
        - $1.5B
    notes: These scenarios are public-evidence discipline tools, not management guidance; they widen the range because revenue quality, concentration, and financing terms are still opaque.
