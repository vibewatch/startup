  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-recognition
      missingEvidence: Audited recognized revenue, GMV, take rate, and a principal-agent accounting memo that reconciles reported growth with economic reality.
      whyItMatters: The current valuation can screen fair or stretched depending on whether the denominator is net spread or gross pass-through.
      diligencePath: Request controller and auditor materials plus a monthly bridge from GMV to recognized revenue.
      relatedQuestionRefs:
        - QV006
        - QV010
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-overhang
      missingEvidence: Security type, liquidation preferences, participation, ratchets, secondaries, side letters, and any contract-linked debt or convertibles.
      whyItMatters: Headline valuation can materially misstate what a new investor or later buyer is actually underwriting.
      diligencePath: Obtain the full cap table, financing documents, and any lender or side-letter package from counsel and finance.
      relatedQuestionRefs:
        - QV008
        - QV023
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: retention-concentration
      missingEvidence: NRR, GRR, churn, active customer count, top-account share, and renewal behavior by segment.
      whyItMatters: The current price assumes more durability than the public file can presently prove.
      diligencePath: Request board KPI decks, cohort tables, and customer-reference calls keyed to the top revenue accounts.
      relatedQuestionRefs:
        - QV011
        - QV024
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: provider-concentration
      missingEvidence: Top-provider share, substitution matrix, SLA framework, and any outage or failure-rate history.
      whyItMatters: Neutral aggregation loses value quickly if a small number of providers dominate supply or cannot be replaced.
      diligencePath: Review provider scorecards, concentration reports, and operational escalation documents.
      relatedQuestionRefs:
        - QV025
      relatedTableRefs:
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: governance-control-map
      missingEvidence: Board composition, voting control, founder rights, succession planning, and ownership of key operating and compliance decisions.
      whyItMatters: Governance opacity raises the risk that the current narrative overstates institutional maturity.
      diligencePath: Request the board package, charter documents, ownership summary, and succession plan.
      relatedQuestionRefs:
        - QV007
        - QV030
      relatedTableRefs:
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: trust-compliance
      missingEvidence: Export-control, sanctions, privacy, DPA, incident-response, and certification materials that go beyond the sparse public trust surface.
      whyItMatters: Exit readiness and premium multiple persistence both require more enterprise-grade proof than the public file currently supplies.
      diligencePath: Request the security packet, policy stack, incident history, and legal/compliance ownership map.
      relatedQuestionRefs:
        - QV026
        - QV028
      relatedTableRefs:
        - TV006
