      - - Risk rating
        - high
        - Revenue-quality, concentration, governance, and financing-term risk can all impair the thesis quickly.
      - - Valuation stance
        - stretched
        - Roughly 15x reported 2025 run-rate is not insane in 2026 AI infrastructure, but it still assumes favorable hidden economics.
      - - Entry discipline
        - price and term sensitive
        - Only invest if diligence validates net economics and if documents do not reveal punitive preference or debt overhang.
      - - Hold / exit posture
        - grow into the multiple
        - The supportable case is a medium-duration hold, not a near-term markup or easy strategic exit.
