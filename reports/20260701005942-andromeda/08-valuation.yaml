company:
  name: Andromeda
chapter:
  number: 8
  title: Valuation
  summary: 'Andromeda''s March 2026 $1.5 billion mark is not obviously absurd against the much richer 2026 AI-infrastructure public tape, but public evidence still does not justify buying the price with confidence. The reported ~$100 million 2025 run-rate implies roughly 15x revenue, which sits above CoreWeave''s current public ~8.7x P/S but below DigitalOcean''s ~17.4x TTM multiple and far below Nebius''s triple-digit revenue multiple; the problem is that Andromeda still does not publicly disclose whether that revenue is mostly net broker economics, what retention and concentration look like, or what the financing terms actually say. Recommendation: track with medium confidence, high risk, and a stretched valuation stance until diligence resolves denominator quality, governance continuity, and cap-table opacity.'
sections:
  - id: V801
    title: 'Recommendation: track — the company matters, but the current price still needs denominator and governance proof'
    body: |-
      The public-evidence call on Andromeda at the current $1.5 billion anchor is track, not buy and not dismiss. The positive case is real. Earlier chapters already established a genuine market need for a narrower GPU brokerage and procurement layer, and the public file still supports meaningful traction: 100-plus providers, 1,000-plus transactions, billion-plus GPU-hour activity, a reported ~$100 million 2025 run-rate, and signs that the company solved a real supply-fragmentation problem for AI buyers. In a 2026 market where public AI-infrastructure names still trade at unusually wide and sometimes elevated multiples, a 15x revenue headline is not automatically disqualifying.

      The negative case is just as real, and it is more decision-critical. Andromeda's valuation still rests on a denominator that has not been publicly audited or even clearly classified as net broker economics versus gross pass-through revenue. The same file still lacks public NRR, GRR, customer count, provider concentration, and cap-table detail, while founder continuity is visibly weaker after Nat Friedman and Daniel Gross stepped back from an active role. That means the current mark may be fair only if the hidden variables break in investors' favor. Without that proof, the right posture is to stay engaged, insist on price and term discipline, and refuse to confuse a real business with a fully underwritten one.
    claimRefs:
      - CV004
      - CV007
      - CV009
      - CV032
