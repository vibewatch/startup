  - id: V803
    title: Scenario range, downside triggers, and price sensitivity
    body: |-
      The bull, base, and bear cases are driven less by top-line storytelling than by what sits beneath the top line. The bull case is not that Andromeda becomes a hyperscaler; it is that the current ~$100 million scale mostly reflects net, high-value brokerage economics on sticky procurement and operating relationships, that provider and customer concentration are manageable, and that the company keeps converting supply fragmentation into a durable strategic position. In that case, a premium AI-infrastructure multiple can still hold and the present entry can work.

      The base case is more restrained and, on public evidence, more honest. Andromeda remains a real and useful company, but the market learns that some mix of gross pass-through revenue, customer multihoming, high-touch service burden, and financing complexity keeps the business from enjoying the clean software-like durability that a premium private multiple would prefer. In that world, the current mark is only modestly defensible and mostly requires the company to grow into it. The bear case is straightforward: if the reported revenue base proves less economic than it looks, if direct clouds close the workflow gap, if customer or provider concentration is high, or if governance and financing opacity force investor-unfriendly terms, downside opens quickly because the present price leaves less room for denominator disappointment than the narrative suggests.
