company:
  name: Andromeda
chapter:
  number: 7
  title: Risks
  summary: Andromeda's highest residual risks are governance and continuity opacity after the founders stepped back, heavy dependence on third-party supply and secretive customers, and under-disclosed capital-capacity and compliance controls for a global GPU marketplace. Public mitigation effort is visible in specialized hiring and provider breadth, but the current public file still leaves clear thesis-break triggers around leadership continuity, provider and customer concentration, sanctions/export/privacy execution, and liquidity resilience.
sections:
- id: ranked-risk-stack
  title: Severity-ranked risk stack and investment implication
  body: 'Andromeda''s public risk stack is not evenly distributed. The highest residual risk is governance and continuity opacity after Nat Friedman and Daniel Gross stepped back and public control disclosure remained thin. That matters because the founders were central to the original supply, sponsor, and customer narrative, while Wil Moushey now appears to be the operating center of gravity. The second risk is operational and provider dependence: Andromeda''s value proposition is built on sourcing, benchmarking, contracting, and supporting third-party supply rather than owning a standardized hyperscale stack. The third risk is customer concentration and multihoming, because the business openly serves secretive AI labs, still withholds customer counts and retention data, and at least one early named user now publicly scales on Google Cloud. The fourth risk is capital-capacity and margin complexity. The Strategic Compute Finance role and Moushey''s own comments show that lender relationships,
    underwriting, and working-capital architecture are live issues rather than back-office detail. The fifth risk is compliance execution across export controls, sanctions, privacy, and trust. Public mitigation is visible in hiring and provider breadth, but public proof of mature controls is still limited. The investment implication is straightforward: Andromeda can still be investable, but only if management can close these disclosure and control gaps with concrete internal evidence before capital is committed.'
