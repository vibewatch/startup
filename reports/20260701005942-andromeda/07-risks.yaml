- id: operational-partner-and-customer-dependencies
  title: Operational, partner, and customer dependency risks
  body: 'Operationally, Andromeda looks more like a market operator and managed-procurement layer than a self-contained cloud. Upstarts says the company leases supply from providers such as CoreWeave and other operators rather than taking hardware ownership risk, while the procurement and business-staff roles show that supply acquisition, provider economics, and lead-to-capacity matching remain central, active functions. SemiAnalysis adds a useful adverse lens by describing Andromeda as a fractional SRE and procurement layer sitting on top of multiple neoclouds. That model can be attractive because it avoids some fixed-asset exposure, but it also pushes risk into partner reliability, provider concentration, substitution speed, and quality control. Customer-side risk follows the same pattern. DCD shows real commercialization beyond NFDG, yet public proof is still far stronger on marketplace activity than on diversified revenue concentration. Upstarts makes clear that large-lab business is
    confidential, and the same article carries the strongest disconfirming retention signal in the public file: an anonymous founder says the company may eventually bring the capability in-house. ElevenLabs'' 2026 Google Cloud expansion underscores that early Andromeda-adjacent customers can multihome elsewhere. The result is a platform with real evidence of demand and supply, but still meaningful dependence on external providers, opaque major customers, and high-touch human execution.'
