- id: financial-people-and-kill-criteria
  title: Financial model, people, and kill criteria
  body: 'The financial and execution risks are not classic distress signals; they are scale-and-control signals. Upstarts reports profitability and a $100 million 2025 revenue run rate, but those figures do not answer the more important diligence questions around working capital, counterparty financing, hedging, credit exposure, or lender support. In fact, the public hiring pattern points the other way: the Strategic Compute Finance role explicitly calls out capex planning, scenario modeling, deal structuring, and lender relationships, which implies that scaling the platform requires real financial engineering around capacity and not just more software. The org chart is similarly unfinished in public. Open roles span legal, finance, procurement, partnerships, solutions, software, and SRE, while official pages still do not provide a clear board or control map. That is why the kill criteria should be concrete and monitorable: governance failure if Moushey departs without a succession map;
    compliance failure if screening, DPA, or incident controls cannot be evidenced; concentration failure if a few customers, channels, or providers dominate volume; and capital failure if management cannot show lender depth, liquidity resilience, and margin tolerance. Those are not theoretical asks; they are the exact conditions under which a fast-growing compute marketplace can stop compounding and become unfinanceable.'
