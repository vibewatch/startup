- id: TR005
  title: Mitigation and kill criteria table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Governance / continuity opacity
    - Leadership and governance disclosure
    - Moushey departure, founder-control ambiguity unresolved, or management cannot provide a board and succession map before close
    - Treat as thesis-break until governance and control are documented
  - - Compliance execution
    - Export, sanctions, privacy, and trust evidence
    - No documented screening workflow, no DPA/security packet, or any material data incident or enforcement event
    - Pause or decline until controls are evidenced and incident scope is understood
  - - Provider concentration and reliability
    - Capacity substitution and provider share
    - Top-3 providers dominate a majority of capacity without rapid substitution plan or SLA evidence
    - Haircut conviction, widen downside case, or require stronger contractual protection
  - - Customer concentration and multihoming
    - Top-customer / channel share and reference quality
    - A few confidential labs or AI Grant-linked channels dominate spend, or named references move strategic workloads elsewhere
    - Re-underwrite retention assumptions and consider no-go if diversification is weak
  - - Capital capacity and margin resilience
    - Liquidity and lender support
    - Management cannot show lender depth, working-capital policy, or margin tolerance under procurement shocks
    - Treat as valuation and financing kill trigger; require reprice or walk away
  - - Execution bandwidth
    - Role-fill progress and operating metrics
    - Open critical roles stay unfilled or deployment / POC / utilization metrics deteriorate as growth scales
    - Reduce confidence and demand operating proof before underwriting aggressive upside
