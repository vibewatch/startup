  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation-enforcement
    missingEvidence: Direct court, arbitration, or regulator records showing whether Andromeda has faced litigation, claims, or enforcement actions.
    whyItMatters: The public file does not show whether hidden legal disputes, demand letters, or investigations could affect contracts, trust, or insurance.
    diligencePath: Request a litigation schedule, outside-counsel negative-assurance summary, and disclosure of threatened claims or regulator inquiries.
    relatedQuestionRefs:
    - QR010
  - type: private-evidence-only
    severity: material
    topic: trust-certifications-incidents
    missingEvidence: SOC 2 or equivalent reports, security architecture packet, incident log, and public or private uptime history.
    whyItMatters: Sparse trust disclosure makes it hard to judge whether reliability and security controls match the scale and confidentiality of customer workloads.
    diligencePath: Ask for the latest trust packet, third-party attestations, incident register, and named owner for customer-security reviews.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: minor
    topic: facility-safety-environment
    missingEvidence: Any public permit, safety, or environmental disclosures tied to supplier facilities or Andromeda-operated infrastructure support.
    whyItMatters: Even an asset-light model can be disrupted if critical facilities, clusters, or counterparties lack safety, export, or environmental readiness.
    diligencePath: Request the list of critical facilities and counterparties plus any required permits, safety reviews, and environmental compliance attestations.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: concentration
    missingEvidence: Top-customer share, top-provider share, NFDG or AI Grant channel share, and churn or expansion by cohort.
    whyItMatters: The platform can look diversified in narrative form while still depending on a few customers, providers, or sponsor-linked channels.
    diligencePath: Request top-1, top-5, and top-10 revenue or GMV concentration by customer, provider, and channel plus substitution plans.
    relatedQuestionRefs:
    - QR021
    - QR032
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: capital-capacity
    missingEvidence: Working-capital policy, lender commitments, hedging approach, credit-loss exposure, and deal-level margin bridges.
    whyItMatters: The finance role suggests material balance-sheet and financing complexity, but the public record does not show whether growth is safely financeable.
    diligencePath: Request debt or lender summaries, weekly liquidity framework, margin-sensitivity cases, and any customer or supplier financing terms.
    relatedQuestionRefs:
    - QR022
    - QR023
    - QR024
    - QR025
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: export-sanctions-screening
    missingEvidence: Written export-control, sanctions-screening, and counterparty-escalation procedures plus ownership-screening and denied-party tooling evidence.
    whyItMatters: BIS and OFAC obligations are material to a global GPU marketplace, and the public file does not show whether Andromeda can operationalize them at scale.
    diligencePath: Request the compliance manual, screening workflow screenshots, escalation examples, country restrictions, and responsible executive sign-off.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR009
    - QR031
    relatedTableRefs:
    - TR001
    - TR005
