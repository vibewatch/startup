company:
  name: "Apptronik"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Apptronik is a privately held Austin humanoid-robotics company with deep university and NASA lineage, unusually heavy strategic backing, and a rapidly expanding 2026 commercialization story. The public record is strong on product direction, financing, and named partners, but still opaque on pricing, governance, and customer conversion metrics."
sections:
  - id: "identity-and-product"
    title: "Identity and product posture"
    body: |
      Apptronik presents itself as a humanoid-robotics platform company rather than a single-product hardware vendor. Its own materials describe Apollo as a stack that combines advanced hardware, embodied AI, and fleet-level tools, with applications spanning manufacturing, warehousing, and retail. The public identity story is consistent across the company’s homepage, press materials, and investor-facing summaries: Austin headquarters, 2016 founding, and a University of Texas at Austin origin. What is still missing is the commercial detail that would let a buyer model the business cleanly, especially a public list price, published throughput numbers, or a stable revenue disclosure.
    claimRefs: [CO001, CO002, CO003, CO012, CO014, CO015]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership, founders, and governance"
    body: |
      The named leadership bench is clear enough to establish the company’s technical and commercial center of gravity. Jeff Cardenas and Nick Paine are consistently presented as co-founders, with Cardenas in the CEO seat and Paine as CTO; later public materials add Kay Sheils as CFO and Animesh Garg as CSO. The same sources also point to Gordon Daugherty as the first outside board director, which is helpful but still far short of a full governance picture. That matters because a company this private can look more transparent than it is: public leadership names do not substitute for board composition, shareholder control rights, or any formal key-person risk schedule.
    claimRefs: [CO009, CO010, CO013, CO014]
    tableRefs: [TO002]
  - id: "capital-and-traction"
    title: "Capital, valuation, and traction"
    body: |
      Apptronik’s capital story is the clearest part of the public record. The company announced a $350 million Series A in February 2025, then a $520 million extension in February 2026 that took the Series A above $935 million and total capital to nearly $1 billion. The investor list expanded from B Capital, Capital Factory, and Google into a broader strategic syndicate that now includes Mercedes-Benz, PEAK6, AT&T Ventures, John Deere, and QIA. Independent summaries then pushed the valuation conversation to $5.5 billion, while the company itself stayed careful and only described the 2026 extension as a multiple of its prior valuation. That gap between what is disclosed and what is inferred is the core diligence issue here.
    claimRefs: [CO005, CO006, CO007, CO008, CO012, CO015]
    tableRefs: [TO003]
  - id: "milestones-and-gaps"
    title: "Milestones and remaining diligence gaps"
    body: |
      The milestone trail shows a company that is moving steadily from research lineage into commercialization, but not yet into a fully legible operating business. The public chronology runs from the 2016 spinout and Apollo’s robotic lineage, through the 2025 financing milestones, into the 2026 extension, production ramp, and the newer commercial-robot narrative. The same chronology also exposes what Apptronik does not yet publish: no public list price, no customer-site throughput metrics, no official board roster, and no clean, current headcount number. Those gaps are not minor polish items; they are the main blockers to turning a compelling robotics story into a fully underwritten operating case.
    claimRefs: [CO003, CO004, CO006, CO008, CO011, CO015, CO016]
    figureRefs: [FO001]
