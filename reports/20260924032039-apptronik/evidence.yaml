evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A public board roster, investor control rights, and any governance documents that show how the company is
      controlled.
    whyItMatters: A private robotics company can look well covered on leadership while still being opaque on control and succession.
    diligencePath: >-
      Request corporate governance documents, cap table excerpts, and board composition from the company or a financing
      memo.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: material
    topic: pricing
    missingEvidence: Public Apollo pricing, contract terms, and customer conversion / throughput metrics.
    whyItMatters: >-
      Without pricing and conversion data, it is impossible to tell whether the deployment model is economically proven
      or still purely experimental.
    diligencePath: Obtain direct customer references, a pilot contract excerpt, and any internal pricing sheet or proposal template.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: private-evidence-only
    severity: blocking
    topic: sam-som
    missingEvidence: >-
      A public source that isolates Apptronik's serviceable addressable market or a vertical-level deployment count by
      factory, warehouse, or retail segment.
    whyItMatters: >-
      Without it, the chapter can bracket the market with broad TAMs and category signals but cannot defend a precise
      near-term SAM or SOM.
    diligencePath: >-
      Seek a third-party market study focused on industrial humanoid deployments or disclosed contract volumes by
      vertical.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A dated primary financing announcement or board-confirmed valuation that reconciles the $5.0B, $5.3B, and $5.5B
      private-market signals.
    whyItMatters: >-
      The current valuation signal is assembled from secondary marks and a paywalled report title, so the exact current
      mark remains approximate.
    diligencePath: Confirm the latest round or mark from an investor release, filing, or cap-table source.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: deployment-metrics
    missingEvidence: Customer-published throughput, uptime, or task-volume metrics from Mercedes-Benz, GXO, or Jabil.
    whyItMatters: >-
      Without site-level KPIs, Apptronik's conversion from pilots to scaled operations remains qualitative rather than
      measurable.
    diligencePath: Request published or customer-authorized operating metrics from the named pilot and manufacturing partners.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue, ARR, or signed contract economics for Apollo deployments
    whyItMatters: >-
      Without disclosed revenue, it is impossible to judge revenue quality or whether pilots are converting into
      repeatable sales.
    diligencePath: >-
      Request management financials, customer invoices, or board reporting that reconciles pilots, deployments, and
      recognized revenue.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public list price, realized price, or contract structure for Apollo units and services
    whyItMatters: >-
      Unit pricing determines gross profit potential, payback period, and whether the business is a product sale, lease,
      or services model.
    diligencePath: Ask for order forms, MSAs, pilot terms, or a pricing sheet that separates hardware, software, and support.
    relatedQuestionRefs:
      - QI002
      - QI007
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A reconciled employee count and date stamp from management or payroll
    whyItMatters: Public headcount estimates range widely, which makes burn and scaling assumptions difficult to anchor.
    diligencePath: Reconcile HR records against public profiles and market-data vendor snapshots.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: blocking
    topic: runway
    missingEvidence: Cash balance, burn rate, and runway projection
    whyItMatters: Capital adequacy is the key underwriting question for a hardware-heavy company that has not disclosed revenue.
    diligencePath: Obtain the latest cash-flow forecast, balance sheet, and financing plan from management.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: blocking
    topic: operating-metrics
    missingEvidence: >-
      Public uptime, throughput, intervention rate, recovery rate, and cost-per-task numbers for Apollo in live
      deployments.
    whyItMatters: >-
      Without those numbers, the chapter cannot compare Apollo against competing humanoids or judge whether the product
      is reliable enough for scaled industrial rollout.
    diligencePath: Obtain partner-side deployment metrics or a customer case study with specific performance numbers.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: safety-compliance
    missingEvidence: Public safety certification, incident reporting, privacy, and data-governance documents for Apollo deployments.
    whyItMatters: >-
      Humanoids interact with people, so the absence of formal compliance detail leaves a real safety and operational
      risk unresolved.
    diligencePath: >-
      Request a safety case, certification pack, and incident-response or SLA documentation from Apptronik or its
      deployment partners.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: blocking
    topic: retention
    missingEvidence: Public NRR, GRR, churn, renewal length, or cohort data by customer.
    whyItMatters: Without retention data, the chapter cannot distinguish an early pilot from durable repeated usage.
    diligencePath: Ask management for customer cohorts, renewals, or contract summaries and look for customer-authored disclosures.
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: deployment-kpis
    missingEvidence: Public robot counts, hours worked, throughput, or pilot-to-production conversion by named customer.
    whyItMatters: The customer story remains at the level of relationships, not measurable operating proof.
    diligencePath: Request customer case studies, site-level KPIs, or partner disclosures.
    relatedQuestionRefs:
      - QU002
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, concentration by account, or a disclosed account mix.
    whyItMatters: A small disclosed customer set can mask revenue concentration and renewal risk.
    diligencePath: Seek financial disclosure, board reporting, or management commentary on account concentration.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: minor
    topic: adverse-proof
    missingEvidence: Public complaints, blocked pilots, or failed deployments tied to Apollo customers.
    whyItMatters: The public record is bullish but still under-sampled on disconfirming evidence.
    diligencePath: Check customer forums, procurement records, and adverse trade coverage.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: legal-regulatory-status
    missingEvidence: >-
      A docket, regulator, or customer-safety check confirming whether Apptronik or Apollo currently faces any
      litigation, enforcement action, or recall exposure.
    whyItMatters: >-
      The company is pushing toward real deployments, so any undisclosed legal or regulatory issue could change the risk
      ranking quickly.
    diligencePath: >-
      Search federal/state dockets and relevant safety regulators, then request counsel confirmation and customer-side
      incident summaries.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incident-data
    missingEvidence: Public incident, recall, injury, or failure reports tied specifically to Apollo deployments.
    whyItMatters: >-
      Safety claims are central to the humanoid thesis, and incident history is the clearest external check on those
      claims.
    diligencePath: >-
      Review recalls, incident databases, customer disclosures, and insurance summaries; request internal incident logs
      if diligence advances.
    relatedQuestionRefs:
      - QR005
      - QR006
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements, a current revenue bridge, and any public ARR or run-rate disclosure tied to the 2026
      financing mark.
    whyItMatters: >-
      Without audited economics, the valuation can only be triangulated from financing marks and narrative proof, which
      leaves wide error bars.
    diligencePath: >-
      Request board-approved financials, management's ARR bridge, and any investor materials that show current revenue
      quality.
    relatedQuestionRefs:
      - QV001
      - QV007
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      The current cap-table, liquidation preferences, and any side-letter or control-rights schedule for the 2026
      financing stack.
    whyItMatters: >-
      Entry discipline depends on dilution and liquidation overhang, and the public record does not reveal how much of
      the upside is already encumbered.
    diligencePath: Ask management and counsel for the signed financing documents and the latest cap-table schedule.
    relatedQuestionRefs:
      - QV002
      - QV007
