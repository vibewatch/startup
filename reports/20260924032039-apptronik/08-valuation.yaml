  evidenceGaps:
    - type: missing-source
      severity: material
      topic: financials
      missingEvidence: Audited financial statements, a current revenue bridge, and any public ARR or run-rate disclosure tied to the 2026 financing mark.
      whyItMatters: Without audited economics, the valuation can only be triangulated from financing marks and narrative proof, which leaves wide error bars.
      diligencePath: Request board-approved financials, management's ARR bridge, and any investor materials that show current revenue quality.
      relatedQuestionRefs: [QV001, QV007]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: The current cap-table, liquidation preferences, and any side-letter or control-rights schedule for the 2026 financing stack.
      whyItMatters: Entry discipline depends on dilution and liquidation overhang, and the public record does not reveal how much of the upside is already encumbered.
      diligencePath: Ask management and counsel for the signed financing documents and the latest cap-table schedule.
      relatedQuestionRefs: [QV002, QV007]
