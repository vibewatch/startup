  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, What would change the view]
    rows:
      - ["Apptronik has enough technical depth to deserve a platform premium, but the market still has to see repeatable deployments", "If Apollo produces recurring deployments and customer expansion, the premium becomes more defensible"]
      - ["Named partnerships and commercial relationships reduce the chance that this is just a demo story", "If those relationships remain non-binding pilots or do not convert into repeat business, the thesis weakens"]
      - ["The company has already accumulated a large capital base, which helps execution", "If the next financing is mostly rescue capital or comes at weaker terms, dilution risk rises"]
      - ["The public record still lacks audited economics and cap-table detail", "If management discloses those terms along with unit-level metrics, the valuation gap narrows"]
    notes: >
      Each row pairs a thesis or anti-thesis with the single fact that would most
      likely move the recommendation.
    claimRefs: [CV002, CV003, CV005, CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Repeat deployments appear in public KPIs and the company shows cleaner operating disclosure", "The mark can hold a premium range around 6.5B-8.0B or higher if growth converts into repeat revenue", "Hardware reliability and manufacturing ramp remain the main failure modes", "Low-to-moderate because the proof burden is still high"]
      - ["Base", "Apptronik keeps raising capital and winning attention but disclosure stays thin", "The current 5.0B-6.0B zone looks plausible as a holding pattern rather than a discount", "Slow pilot conversion and future dilution", "Highest because the public evidence mostly supports patience"]
      - ["Bear", "Deployment proof stalls and the company must raise again before hard KPI disclosure", "Down-round risk pushes the valuation toward 3.0B-4.0B or lower", "Preference overhang, customer concentration, and commercialization failure", "Meaningful if repeat usage does not materialize"]
    notes: >
      Scenario values are qualitative ranges inferred from public financing marks
      and operating evidence; they are not a discounted-cash-flow model or an
      assertion of formal fair value.
    claimRefs: [CV008, CV009, CV011, CV012, CV013, CV014]
