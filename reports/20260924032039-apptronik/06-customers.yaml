      - ["capital raised in latest public round", "$520M Series A-X and >$935M total Series A capital", "2026-02-12", "Trending Topics coverage", medium, "supports continued scaling", "customer conversion rate"]
      - ["public customer focus", "factories and warehouses first", "2026-06-29", "New Market Pitch", medium, "clarifies go-to-market", "active account count"]
      - ["public operating KPI disclosure", "not disclosed", "2026-09-24", "assigned source set", medium, "indicates evidence gap not traction", "customer-level throughput and renewals"]
    notes: >-
      Mixed quantitative and qualitative trajectory table; the last row is an
      explicit gap so the reader does not mistake disclosure silence for weak
      demand.
    claimRefs:
      - CU003
      - CU004
      - CU006
      - CU008

  - id: TU003
