    columns:
      - customer
      - segment
      - deployment/use case
      - production vs pilot
      - outcome
      - limitation
    rows:
      - ["Mercedes-Benz", "automotive", "factory workflow validation", "pilot/commercial agreement", "first publicly announced commercial deployment", "no disclosed unit count or utilization"]
      - ["GXO Logistics", "logistics/3PL", "warehouse and logistics work", "pilot/partnership", "confirms logistics exposure", "no public throughput or renewal data"]
      - ["Jabil", "manufacturing/contract manufacturing", "Apollo production path", "production collaboration", "strengthens repeatable manufacturing story", "public customer-site KPI not disclosed"]
    notes: >-
      Public named relationships are treated as proof of market access, not
      proof of scaled recurring revenue; the table is intentionally limited to
      the relationships visible in the assigned evidence set.
    enumerationScope:
      coverage: sample
      basis: >-
        Named Apollo customer and production-path relationships surfaced in the
        assigned prefetched sources.
    claimRefs:
      - CU004
      - CU007
      - CU012

figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Apollo’s public customer journey runs from industrial discovery to pilots
      and commercial agreements, with a production path emerging but public KPI
      disclosure still missing.
    data:
      nodes:
        - id: discovery
          label: Industrial discovery
          stage: manufacturing and warehouse workflows
          signal: Apollo homepage positions Apollo for factory, warehouse, and retail work.
        - id: pilot
          label: Pilot or commercial agreement
          stage: Mercedes-Benz and GXO Logistics
          signal: Publicly announced industrial relationships, but no site-level KPI disclosure.
        - id: production
          label: Production path
          stage: Jabil collaboration
          signal: Coverage describes a move toward repeatable manufacturing support.
        - id: scale
          label: Scale-up financing
          stage: 2025-2026 capital raises
          signal: Funding supports expansion and broader deployment.
        - id: service
          label: Service and support
          stage: field reliability and deployment operations
          signal: Apptronik still needs public support, renewal, and uptime proof.
        - id: proof-gap
          label: Proof gap
          stage: missing KPIs and renewals
          signal: No public uptime, throughput, retention, or cohort data.
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU008
      - CU010
      - CU013

