company:
  name: Apptronik
chapter:
  number: 6
  title: Customers
  summary: >-
    Apptronik’s public customer footprint is real but narrow: Mercedes-Benz,
    GXO Logistics, and Jabil point to industrial pilots and a production path,
    yet the company still does not publish the operating KPIs that would prove
    repeatable rollout or retention. The chapter therefore reads as an
    industrial beachhead with meaningful expansion potential and high
    concentration risk.
sections:
  - id: customer-segmentation
    title: Customer base and use-case segmentation
    body: >-
      Apptronik’s public customer story is concentrated in industrial settings.
      The company’s own product page frames Apollo around manufacturing,
      warehouse, and retail workflows, while recent coverage narrows the near
      term focus further to factories and warehouses first. That matters because
      the buyer is usually an operations or automation leader, the user is a
      frontline site team, and the value proposition is labor relief, repetitive
      task support, and safer material handling rather than a broad consumer or
      home use case. The key diligence issue is that Apptronik can clearly name
      the industrial environments it wants, but not yet the public operating
      metrics that show how many deployments have crossed from trial into
      durable repeat use.
    claimRefs:
      - CU001
      - CU002
      - CU011
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-proof
    title: Named deployments and adoption trajectory
    body: >-
      The strongest public proof is still a small set of named enterprise
      relationships. Apptronik has publicly tied Apollo to Mercedes-Benz and
      GXO Logistics, and later coverage added Jabil as a production-path signal.
      That combination is meaningful: Mercedes-Benz shows automotive-floor
      validation, GXO shows logistics exposure, and Jabil suggests that Apptronik
      is trying to move from pilots toward a repeatable manufacturing pathway.
      Still, the record remains partner-heavy and metric-light. The company has
      not published the sort of customer scoreboard that would answer how many
      robots are active, how often they work, or how often a pilot becomes a
      recurring deployment.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU002
      - TU003

  - id: durability-risk
    title: Retention, expansion, and concentration risk
    body: >-
      The durability question is where the public record gets thin. Apptronik
      does not disclose renewal rates, NRR, GRR, churn cohorts, or customer-level
      revenue mix, so the company’s customer quality has to be inferred from a
      handful of marquee relationships and the scale of the funding behind them.
      That creates two risks at once. First, the customer base may be more
      concentrated than the headline relationships suggest, because the public
      set of named relationships is still small. Second, expansion may be real
      but unproven, since the company has not yet shown whether pilots turn into
      repeatable production or multi-site rollouts. Until Apptronik publishes
      harder operating proof, the customer story remains promising but not yet
      fully durable.
    claimRefs:
      - CU009
      - CU010
      - CU012
      - CU013

