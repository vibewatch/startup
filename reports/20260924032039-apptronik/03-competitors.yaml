company:
  name: Apptronik
chapter:
  number: 3
  title: Competitors
  summary: "Apptronik's competitive set is crowded but still mostly pre-scale: Tesla, Figure, Agility, and Boston Dynamics all compete for the same industrial automation spend, yet the public scoreboard is uneven. Apptronik's differentiators are partner breadth and AI leverage, but its moat still depends on converting pilots into measurable operating proof."
sections:
  - id: landscape
    title: Competitive landscape
    body: "Apptronik's real competition is not just other humanoids. A buyer can choose a pilot-only humanoid, a more mature warehouse robot, fixed automation, internal build, or simply manual labor. That means the purchase decision blends technical capability with deployment friction, serviceability, and whether the customer wants a general-purpose platform or a narrower, more immediately purchasable tool. Apptronik's public position is strongest where the task is repetitive industrial work, but the company still lacks the sort of customer-published operating numbers that would make its lead look durable. In practice, the category looks crowded on logos and thin on transparent KPI reporting, which makes status quo and internal automation viable substitutes, not afterthoughts."
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP007
      - CP011
      - CP012
    tableRefs:
      - TP001
  - id: scoreboard
    title: Public proof versus promise
    body: "The peer comparison here is less about headline funding and more about what a buyer can verify. Figure and Agility appear ahead on public proof because their advocates publish operating numbers, while Apptronik's public record is still mostly partner names, manufacturing intent, and future plans. Tesla and Atlas matter as strategic pressure, but their commercial availability is still limited enough that they function more like long-dated threats than current procurement options. The practical takeaway is that Apptronik is competing in a proof race, not a demo race, and every additional public KPI from a peer raises the bar for Apollo."
    claimRefs:
      - CP005
      - CP006
      - CP008
      - CP013
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: wedge
    title: Distribution, pricing, and moat durability
    body: "Apptronik's best wedge is not a unique humanoid body plan; it is the combination of AI leverage, a manufacturing path, and enterprise partners that can turn pilots into field learning. Jabil makes the production story more credible, and Google DeepMind gives the software stack real technical depth, but neither is a moat until it produces measurable cost or uptime advantages. The risk is that hardware form factors and general-purpose autonomy could commoditize faster than deployment relationships harden. In that world, the winners are the vendors that can turn pilots into repeatable operations and quote-based deals into standardized buying channels."
    claimRefs:
      - CP009
      - CP010
      - CP012
      - CP013
      - CP014
    tableRefs:
      - TP003
