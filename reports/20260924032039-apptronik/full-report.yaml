      - number: '1.3'
        title: Capital, valuation, and traction
        blocks:
          - type: paragraph
            body: >
              Apptronik’s capital story is the clearest part of the public record. The company announced a $350 million
              Series A in February 2025, then a $520 million extension in February 2026 that took the Series A above
              $935 million and total capital to nearly $1 billion. The investor list expanded from B Capital, Capital
              Factory, and Google into a broader strategic syndicate that now includes Mercedes-Benz, PEAK6, AT&T
              Ventures, John Deere, and QIA. Independent summaries then pushed the valuation conversation to $5.5
              billion, while the company itself stayed careful and only described the 2026 extension as a multiple of
              its prior valuation. That gap between what is disclosed and what is inferred is the core diligence issue
              here.
