  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Apollo is and where it fits
        blocks:
          - type: paragraph
            body: >-
              Apptronik presents Apollo as a human-centered humanoid robot built first for manufacturing and logistics,
              with later use cases in healthcare, the home, retail, and other physically demanding settings. The public
              product story is broader than a single task robot: Apollo is framed as a platform for collaborative work
              in human-centered spaces, not as a lab demo. That matters because the near-term diligence question is not
              whether Apptronik can describe a compelling robot, but whether the company can show that the same platform
              is useful, repeatable, and supportable in real factory and warehouse environments. The company has strong
              partner names, but the public record still leaves deployment maturity and measurable task performance only
              partially answered.
