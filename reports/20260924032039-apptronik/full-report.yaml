  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Apptronik's real competition is not just other humanoids. A buyer can choose a pilot-only humanoid, a more
              mature warehouse robot, fixed automation, internal build, or simply manual labor. That means the purchase
              decision blends technical capability with deployment friction, serviceability, and whether the customer
              wants a general-purpose platform or a narrower, more immediately purchasable tool. Apptronik's public
              position is strongest where the task is repetitive industrial work, but the company still lacks the sort
              of customer-published operating numbers that would make its lead look durable. In practice, the category
              looks crowded on logos and thin on transparent KPI reporting, which makes status quo and internal
              automation viable substitutes, not afterthoughts.
