    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Apptronik’s public customer story is concentrated in industrial settings. The company’s own product page
              frames Apollo around manufacturing, warehouse, and retail workflows, while recent coverage narrows the
              near term focus further to factories and warehouses first. That matters because the buyer is usually an
