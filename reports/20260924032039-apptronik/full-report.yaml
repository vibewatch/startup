        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >
              The named leadership bench is clear enough to establish the company’s technical and commercial center of
              gravity. Jeff Cardenas and Nick Paine are consistently presented as co-founders, with Cardenas in the CEO
              seat and Paine as CTO; later public materials add Kay Sheils as CFO and Animesh Garg as CSO. The same
              sources also point to Gordon Daugherty as the first outside board director, which is helpful but still far
              short of a full governance picture. That matters because a company this private can look more transparent
              than it is: public leadership names do not substitute for board composition, shareholder control rights,
