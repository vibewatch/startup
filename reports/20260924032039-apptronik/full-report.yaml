      - number: '5.3'
        title: Deployment, integration, and trust gaps
        blocks:
          - type: paragraph
            body: >-
              Public reporting shows Apollo in designated areas at factories and warehouses with Mercedes-Benz, GXO, and
              Jabil, and CNBC says those areas use external sensors and light curtains so the robot pauses if a person
              crosses the boundary. That is a cautious rollout model, not a fully open-field autonomy story. Independent
              commentary is more skeptical: the public evidence is still partner-heavy and metric-light, with no visible
              Apollo scoreboard for uptime, throughput, intervention rate, or cost per task. The trust and safety
              picture is therefore incomplete. Apptronik looks serious about industrial deployment, but the public
              record still leaves certification, incident, recovery, and privacy documentation open.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
