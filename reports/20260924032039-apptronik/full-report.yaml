        title: Operational, quality, and security risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Apptronik is no longer a lab with a few engineers; it needs manufacturing, service, IT, and
              security functions that look like a real industrial hardware business. The job posting and press releases
              imply growing on-prem infrastructure, backups, and high-availability expectations, while Jabil and Robot
              Park show how much the company depends on repeatable physical execution. This is why the largest residual
              exposure here is not one isolated bug but the possibility that Apollo 3 arrives without durable unit
              economics, serviceability, or field reliability. The clearest diligence ask is still public or
              customer-side evidence of uptime, intervention rate, mean time to recover, and safety incidents.
