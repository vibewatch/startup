  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Apptronik's public materials define the market around physically demanding work in human-built
              environments, not consumer companionship or home service robotics. The company centers Apollo on
              manufacturing, warehouse, logistics, and retail back-of-house workflows, while the broader category still
              competes with manual labor and conventional automation. That matters because the market boundary is
              narrower than "all robots" and wider than a single factory pilot: the near-term spend is tied to
              repetitive tasks, structured facilities, and budgets that care about labor relief, uptime, and integration
              cost. The excluded set includes consumer/home robots and fixed automation that does the job more cheaply
              when humanoid form is not needed.
            claimRefs:
              - CM001
              - CM002
              - CM003
