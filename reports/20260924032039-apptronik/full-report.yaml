        title: Distribution, pricing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Apptronik's best wedge is not a unique humanoid body plan; it is the combination of AI leverage, a
              manufacturing path, and enterprise partners that can turn pilots into field learning. Jabil makes the
              production story more credible, and Google DeepMind gives the software stack real technical depth, but
              neither is a moat until it produces measurable cost or uptime advantages. The risk is that hardware form
              factors and general-purpose autonomy could commoditize faster than deployment relationships harden. In
