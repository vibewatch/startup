  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price context
        blocks:
          - type: paragraph
            body: >
              Apptronik now sits in a classic late-private valuation gap: the company has enough capital to keep
              scaling, but not enough public operating proof to justify a precise intrinsic valuation. The public record
              shows a 2025 Series A that was already unusually large, a 2026 extension that took total capital above
              $1B, and a reported mark above $5.5B. That combination supports a cautious track call rather than a buy.
              The current price already assumes that Apollo can move from strategic interest to repeatable deployment
              economics, and the public sources do not yet show audited financials, ARR, or a disclosed cap-table stack
              that would let us underwrite the downside with confidence.
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
      - number: '8.2'
        title: What supports the premium and what does not
        blocks:
          - type: paragraph
            body: >
              The strongest thesis is that Apptronik is not a one-dimensional robotics prototype. The company points to
              a decade of work out of UT Austin, 15 robotic systems before Apollo, a DeepMind partnership, and named
              commercial relationships that suggest a serious platform effort rather than a science project. The
              anti-thesis is that these signals still stop short of hard operating proof. The company page describes
              fleet-level deployment, but the current public narrative still leans on manufacturing scale, future use
              cases, and strategic validation instead of customer-by-customer deployment economics. That leaves the
              valuation dependent on whether the next phase produces repeatable robots-in-operation metrics instead of
              more headline financing.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Why the valuation stays stretched
        blocks:
          - type: paragraph
            body: >
              The downside case is not that Apptronik lacks technical credibility; it is that the public evidence still
              does not clear the bar for a premium mark. StartEngine's retail offering language explicitly warns that
              valuation is not static and that investors should not assume the stake will rise in value. New Market
              Pitch goes further, arguing that the company is priced into execution mode and needs hard proof such as
              customer expansion, robot counts, hours worked, and failure rates. That framing matters because the
              company has already raised enough capital to make dilution a real issue, while the cap-table and
              preference stack remain undisclosed. If the next round arrives before clear operating proof, the premium
              can compress quickly.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Scenario frame and diligence gate
        blocks:
          - type: paragraph
            body: >
              The valuation logic is best thought of as a scenario problem rather than a point estimate. In the bull
              case, Apptronik starts producing repeatable deployments, discloses stronger operating KPIs, and earns a
              rerating on the back of clearer economics and lower perceived execution risk. In the base case, the
              company keeps attracting capital and partner attention, but the public evidence remains too thin to
              justify more than a monitoring stance. In the bear case, deployment proof lags, additional capital is
              required, and the market reprices the company as a promising but still pre-commercial robotics platform.
              The diligence gate is straightforward: I would want audited financials, a current revenue bridge, a
              cap-table and preference schedule, and customer-level deployment metrics before moving this from track to
              buy.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
