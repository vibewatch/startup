          - type: paragraph
            body: >-
              The cost side is also under-disclosed. Apptronik's public materials point to hardware, field deployment,
              fleet tools, services, and manufacturing support, which implies a capital-intensive operating model with
              meaningful service-delivery, inventory, and support costs. But no reviewed source gives gross margin, cash
              balance, burn, runway, or capex detail, so the company cannot be underwritten as a conventional software
              business and should not be treated like one. Public headcount signals are similarly inconsistent: the
              company itself said it had over 150 employees in 2025, StartEngine cited 195 employees, and Tracxn later
