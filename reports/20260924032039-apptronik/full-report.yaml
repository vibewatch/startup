      - number: '4.2'
        title: Capital profile and valuation
        blocks:
          - type: paragraph
            body: >-
              Apptronik has already raised a very large amount of private capital for a company that still does not
              publish public operating metrics. The official 2025 press release says the company closed a $350 million
              Series A and then a $403 million total round in March 2025; later market-data sources move the estimate
              closer to $956 million raised and a $5.5 billion valuation, while Forge and New Market Pitch both put the
              valuation in the $5.3 billion range. The point is not that one source is correct and the others are wrong.
              It is that the public capital picture is now large enough to require execution-level proof, but the exact
              numerator remains fuzzy enough that underwriting should treat the numbers as estimates rather than audited
              facts. That makes financing dependency, future dilution, and the absence of cash/runway disclosure central
              diligence issues.
