  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk stack and thesis breakpoints
        blocks:
          - type: paragraph
            body: >-
              Apptronik's headline risk is that the market is now pricing the company for execution while public proof
              remains pre-scale. The strongest public signals are Robot Park and Apollo 3, but those same sources still
              describe Apollo 2 as a prototype for scaled pilots and data collection. That makes safety, regulatory
              friction, and the missing KPI scoreboard the near-term thesis breakpoints: if Apollo 3 slips again or the
              next public reveal still lacks throughput, uptime, and intervention data, the company will look
              well-funded but not yet de-risked. We did not surface public litigation or recall evidence in the reviewed
              material, but that remains an open diligence item rather than a cleared risk.
