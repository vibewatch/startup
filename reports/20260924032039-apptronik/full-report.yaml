      - number: '5.2'
        title: How the stack works
        blocks:
          - type: paragraph
            body: >-
              The most useful technical breadcrumb is Apptronik's own hiring language. It points to motion-capture,
              teleoperation, synthetic data generation, retargeting, and whole-body reinforcement learning pipelines,
              which suggests a sim-to-real development loop rather than a fixed-function machine. Apptronik also says
              Apollo combines advanced hardware, embodied AI, and fleet-level tools, which implies the company is trying
              to operate a deployed robot fleet rather than only sell hardware. The result looks like a vertically
              integrated robotics stack: body, control software, data pipelines, and support tooling. That is a credible
              architecture for a humanoid program, but the public sources do not yet reveal enough technical detail to
              judge repeatability, benchmark performance, or how much of the stack is actually field-proven.
