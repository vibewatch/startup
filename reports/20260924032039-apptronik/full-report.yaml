      - number: '6.3'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The durability question is where the public record gets thin. Apptronik does not disclose renewal rates,
              NRR, GRR, churn cohorts, or customer-level revenue mix, so the company’s customer quality has to be
              inferred from a handful of marquee relationships and the scale of the funding behind them. That creates
              two risks at once. First, the customer base may be more concentrated than the headline relationships
              suggest, because the public set of named relationships is still small. Second, expansion may be real but
              unproven, since the company has not yet shown whether pilots turn into repeatable production or multi-site
              rollouts. Until Apptronik publishes harder operating proof, the customer story remains promising but not
              yet fully durable.
            claimRefs:
