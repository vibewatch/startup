      - number: '2.3'
        title: Buyer map, adoption triggers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer path looks operational rather than consumer-led. The primary buyer and budget owner are usually
              operations, plant, or warehouse leaders who need help with repetitive physical tasks, labor shortages, and
              throughput pressure. Apptronik's own materials point to a deployment model that starts in factories and
              warehouses, then expands into retail back-of-house and only later into healthcare, eldercare, or the home.
              The main constraints are not just technical; they are proof, cost, safety, and the need to show concrete
              throughput gains instead of partner logos. Until those metrics are public, adoption remains a
              pilot-to-production question rather than a fully proven category shift.
