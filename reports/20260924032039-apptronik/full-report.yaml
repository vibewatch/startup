      - number: '7.3'
        title: Partner, concentration, and financing risks
        blocks:
          - type: paragraph
            body: >-
              The company also carries concentration risk. The public narrative depends on a short list of named
              counterparties - Mercedes-Benz, GXO, Jabil, and Google DeepMind - so any one relationship shifting could
              slow both customer proof and product learning. On top of that, Apptronik is now being discussed at a
              roughly $5B valuation, which means private-market liquidity and follow-on capital discipline matter almost
              as much as product milestones. If the next financing or secondary pricing compresses, or if partner access
              to data or model support weakens, the thesis should be repriced quickly. The right mitigants are
              milestone-based spend, broader customer diversification, and explicit data/model rights.
