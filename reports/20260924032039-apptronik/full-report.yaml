chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product posture
        blocks:
          - type: paragraph
            body: >
              Apptronik presents itself as a humanoid-robotics platform company rather than a single-product hardware
              vendor. Its own materials describe Apollo as a stack that combines advanced hardware, embodied AI, and
              fleet-level tools, with applications spanning manufacturing, warehousing, and retail. The public identity
              story is consistent across the company’s homepage, press materials, and investor-facing summaries: Austin
              headquarters, 2016 founding, and a University of Texas at Austin origin. What is still missing is the
              commercial detail that would let a buyer model the business cleanly, especially a public list price,
              published throughput numbers, or a stable revenue disclosure.
