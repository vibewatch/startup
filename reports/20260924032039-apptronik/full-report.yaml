        title: Milestones and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >
              The milestone trail shows a company that is moving steadily from research lineage into commercialization,
              but not yet into a fully legible operating business. The public chronology runs from the 2016 spinout and
              Apollo’s robotic lineage, through the 2025 financing milestones, into the 2026 extension, production ramp,
              and the newer commercial-robot narrative. The same chronology also exposes what Apptronik does not yet
              publish: no public list price, no customer-site throughput metrics, no official board roster, and no
              clean, current headcount number. Those gaps are not minor polish items; they are the main blockers to
              turning a compelling robotics story into a fully underwritten operating case.
