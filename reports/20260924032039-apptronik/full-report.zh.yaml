      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Apptronik 已不再只是几名工程师的实验室项目；要成为真正的工业硬件企业，就得配齐制造、服务、IT
              和安全职能。招聘信息和新闻稿显示，公司对本地基础设施、数据备份和高可用性的要求正在提高；Jabil 与 Robot Park
              也表明，公司高度依赖稳定、可重复的实体执行。因此，最大的剩余风险并非某个孤立技术漏洞，而是 Apollo 3 arrives
              时仍可能缺乏可持续的单位经济性、可维护性或现场可靠性。最需要补齐的尽调证据仍是公开渠道或客户侧的运行率、人工介入率、平均恢复时间和安全事故数据。
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR010
              - CR011
