  - number: 7
    title: 风险剖析
    sections:
      - number: '7.1'
        title: 风险矩阵与投资逻辑破局点
        blocks:
          - type: paragraph
            body: >-
              Apptronik 面临的首要风险，是市场已按其能够规模化执行来定价，公开实证却仍处于规模化之前。Robot Park 和 Apollo 3 是最有分量的公开信号，但同一批来源仍将 Apollo 2
              描述为供大规模试点和数据采集使用的原型机。因此，安全、监管阻力和 KPI 披露不足都是近期投资逻辑的破局点：如果 Apollo 3
              再次延期，或下一次公开亮相仍没有吞吐量、运行率和人工介入数据，公司就会显得资金充足，却还未消除核心风险。所审阅材料未发现公开诉讼或召回证据，但仍须进一步尽调，不能据此认为风险已排除。
            claimRefs:
              - CR003
              - CR004
