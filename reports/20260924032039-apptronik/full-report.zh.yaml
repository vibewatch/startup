  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资评级建议与价格背景
        blocks:
          - type: paragraph
            body: >
              Apptronik 处于晚期非上市公司常见的估值判断困境：资金足以支撑继续扩张，却缺乏足够的公开运营实证来准确估算内在价值。公开记录显示，其 2025 年 Series A 规模已非同寻常，2026
              年延展轮使累计融资超过 $1B，报道估值超过 $5.5B。相比买入，现有证据更支持谨慎观察。当前价格已计入 Apollo
              从战略关注走向可复制部署、并跑通商业经济模型的预期；但公开资料尚未披露经审计财务数据、ARR 或股权结构，因此难以有把握地评估下行风险。
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV011
              - CV013
