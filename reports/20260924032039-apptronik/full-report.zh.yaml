      - number: '8.2'
        title: 估值溢价的支撑逻辑与落空项
        blocks:
          - type: paragraph
            body: >
              多头逻辑最有力之处，是 Apptronik 不只是一个机器人原型项目。公司提到 UT Austin 十年研发积累、Apollo 之前的 15 套机器人系统、DeepMind
              合作，以及多家具名商业伙伴，更像是在认真搭建平台，而非停留在科研项目。反方则指出，这些信号仍不等于扎实的运营实证。公司官网虽称其具备车队级部署能力，但公开叙事仍主要依赖制造规模、未来用例和战略背书，缺少逐个客户的部署经济性数据。后续估值取决于下一阶段能否交出可复制的在役机器人指标，而非再添融资头条。
            claimRefs:
              - CV002
              - CV003
              - CV005
