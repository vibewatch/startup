      - number: '7.3'
        title: 合作伙伴、集中度与融资风险
        blocks:
          - type: paragraph
            body: >-
              Apptronik 还面临合作伙伴集中风险。公开叙事依赖少数具名伙伴——Mercedes-Benz、GXO、Jabil 和 Google
              DeepMind；其中任何一段关系生变，都可能拖慢客户验证和产品学习。此外，当前市场普遍按约 $5B 估值讨论
              Apptronik，私募二级市场的流动性和后续融资纪律几乎与产品里程碑同样重要。如果下一轮融资或老股交易估值承压，或伙伴减少数据共享、模型支持，投资逻辑就应迅速重估。可行的缓释措施包括按里程碑控制支出、拓宽客户群，并明确约定数据和模型相关权利。
