        blocks:
          - type: paragraph
            body: >-
              Apptronik 至今仍未公布运营指标，但已在一级市场筹得巨额资金。公司 2025 年官方新闻稿称，先完成 $350 million Series A 融资，后于 2025 年 3 月将该轮融资总额扩至
              $403 million；此后市场数据来源将累计融资估至接近 $956 million，估值报为 $5.5 billion；Forge 与 New Market Pitch 则均将估值列在 $5.3
              billion
              左右。重点不在于判定哪家来源对错，而在于公开融资规模已大到需要执行成果来支撑；但融资总额的准确口径仍不清晰，投资判断应将这些数字视为估算，而非经审计的事实。融资依赖、未来稀释风险，以及现金余额和现金跑道未披露，都是尽调重点。
