  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Apptronik
              面对的竞争远不止其他人形机器人。买方可以选择仍在试点的人形机器人、更成熟的仓储机器人、固定自动化设备、自研方案，也可以继续用人工。采购时要权衡技术能力、部署阻力和可维护性，还要看客户需要通用平台，还是更垂直、能更快采购的工具。Apptronik
              在重复性工业作业场景的公开定位最鲜明，但缺少客户公布的运营数据，尚不足以证明优势能持续。行业里合作伙伴背书多、透明 KPI 数据少，因此继续沿用现有方案或内部自建自动化都是有力替代选项，并非次要考量。
