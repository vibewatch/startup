              同行比较的重点不在融资头条，而在买方能核实什么。Figure 与 Agility 看来在公开实证上领先，因为其支持方公开了运营数据；Apptronik 的公开记录仍多为合作伙伴名称、制造意向与未来规划。Tesla
              与 Atlas 构成了不可忽视的战略压力，但商业供货仍有限，更像是远期威胁而非当前的采购选项。实际结论是，Apptronik 参与的是实证较量，而非演示比拼；同行每公布一项公开 KPI，Apollo
