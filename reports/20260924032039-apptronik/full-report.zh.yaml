      - number: '1.3'
        title: 资本、估值与业务进展
        blocks:
          - type: paragraph
            body: >
              资本叙事是 Apptronik 公开记录中最清晰的部分。公司于 2025 年 2 月宣布 $350 million Series A 融资，随后于 2026 年 2 月完成 $520 million 延展轮，将
              Series A 总额推高至 $935 million 以上，总资本接近 $1 billion。投资方名单从 B Capital、Capital Factory 与 Google 扩充为更广泛的战略财团，现已纳入
              Mercedes-Benz、PEAK6、AT&T Ventures、John Deere 以及 QIA。第三方摘要随后将估值讨论推至 $5.5 billion，但公司自身保持谨慎，仅将 2026
              年延展轮描述为上一轮估值的数倍。已披露信息与推断数据之间的断层，构成本案尽调的核心议题。
