      - number: '6.3'
        title: 留存、增购与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户关系能否持续，是公开资料最薄弱的一环。Apptronik
              未披露续约率、NRR、GRR、按客户队列统计的流失情况或客户收入构成，外界只能根据少数标杆合作和融资规模推测客户质量。由此产生两项风险：一是具名客户很少，实际客户集中度可能远高于新闻呈现的程度；二是客户扩张可能确有其事，但仍未验证：公司尚未展示试点能否转为可复制的生产线应用或多地点部署。在
              Apptronik 公布更扎实的运营实证前，客户故事虽有潜力，但持久性尚未充分验证。
            claimRefs:
              - CU009
