  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Apollo 的产品定义与适用场景
        blocks:
          - type: paragraph
            body: >-
              Apptronik 将 Apollo 定位为以人为本的人形机器人，先服务制造和物流，未来再拓展到医疗、家庭、零售及其他高强度体力作业场景。它的产品定位不止是执行单一任务的机器人：Apollo
              被描述为适用于人类工作场所的协作平台，而非实验室演示机。近期尽调的重点不是 Apptronik
              能否描绘一款吸引人的机器人，而是能否证明同一平台在真实工厂和仓库里实用、可复制且易于维护。公司拥有知名合作伙伴，但公开资料仍未充分回答部署成熟度和任务表现如何。
