  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Apptronik 的公开材料把目标市场界定为人造环境中的高强度体力工作，不包括消费级陪伴机器人或家用服务机器人。Apollo
              主要面向制造、仓储、物流和零售后场流程，但这类市场仍要与人工劳动和传统自动化竞争。近期支出取决于重复性任务和结构化场地，也取决于买方对减轻用工压力、设备正常运行和集成成本的考量。因此，目标市场比「所有机器人」窄，却不止一个工厂试点。消费级
              / 家用机器人不在范围内；若固定自动化设备无需人形形态就能更便宜地完成任务，也属于排除项。
