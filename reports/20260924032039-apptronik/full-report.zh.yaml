            body: >
              Apptronik 将自身定位为人形机器人平台公司，而非单一硬件供应商。官方材料将 Apollo 描述为融合先进硬件、具身 AI
              与车队级工具的技术栈，应用覆盖制造、仓储和零售。其官网、新闻材料及面向投资人的摘要，对公司身份的描述一致：总部位于 Austin，2016 年创立，源自 University of Texas at
