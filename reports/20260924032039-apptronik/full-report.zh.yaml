            body: >-
              公开报道显示，Apollo 已在 Mercedes-Benz、GXO 和 Jabil 的工厂与仓库指定区域运行；CNBC
              称这些区域装有外部传感器和安全光幕，人员越界时机器人会暂停。这种部署方式较为谨慎，并非在完全开放的场景中自主作业。独立评论更为审慎：公开证据多是伙伴背书，量化指标很少；目前看不到 Apollo
              的运行率、吞吐量、人工介入率或单任务成本数据。安全与信任状况因此仍不明朗。Apptronik 显然重视工业部署，但公开资料仍未交代认证、事故、故障恢复和隐私合规情况。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户客群与应用场景细分
        blocks:
          - type: paragraph
            body: >-
              Apptronik 公开披露的客户案例集中在工业场景。公司产品页面将 Apollo
              定位于制造、仓储和零售流程，近期报道则进一步明确近期优先进入工厂和仓库。这关系到商业模式能否成立：买方通常是运营或自动化负责人，使用者是一线团队，价值在于缓解用工压力、承担重复性任务并提升物料搬运安全，而非面向宽泛的消费或家庭应用。关键尽调问题是，Apptronik
              虽能明确指出目标工业场景，却尚未公开能说明有多少部署已从试用转为持续、重复使用的运营指标。
            claimRefs:
              - CU001
              - CU002
              - CU011
