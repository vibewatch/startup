              - CV014
      - number: '8.3'
        title: 估值维持高企的原因与承压风险
        blocks:
          - type: paragraph
            body: >
              下行风险不在于 Apptronik 缺乏技术可信度，而在于公开证据尚未达到支撑估值溢价的门槛。StartEngine 面向散户的募资说明明确提醒，估值并非固定不变，投资者不应假设持股必然升值。New Market
              Pitch
              则直言公司估值已按进入执行阶段定价，亟需客户扩张、机器人数量、运行工时和故障率等硬指标支撑。这一点很关键：巨额融资已使股权稀释成为现实风险，而股权结构表和优先股堆叠仍未公开。如果下一轮融资早于明确的运营实证，高估值溢价可能迅速收缩。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 情景推演框架与尽调准入关口
        blocks:
          - type: paragraph
            body: >
              估值更适合用情景分析，而非单点预测。乐观情景下，Apptronik 逐步实现可复制部署，披露更扎实的运营
              KPI，并凭更清晰的经济模型和更低的预期执行风险获得估值上修。基准情景下，公司继续吸引资本和伙伴关注，但公开证据仍不足，建议维持观察。悲观情景下，部署实证落后、公司需要追加融资，市场会将其重新定价为前景可期但仍处商业化前期的机器人平台。尽调门槛明确：若要从观察上调为买入，需先取得经审计财务报表、最新收入拆解、股权结构表和优先权安排，以及客户层面的部署指标。
