      - number: '6.2'
        title: 具名落地案例与采纳轨迹
        blocks:
          - type: paragraph
            body: >-
              最有力的公开证据仍只是少数具名企业关系。Apptronik 公开将 Apollo 与 Mercedes-Benz、GXO Logistics 联系起来，后续报道又提到 Jabil
              是其量产路径上的合作方。这几段关系各有意义：Mercedes-Benz 代表汽车制造场景验证，GXO 带来物流场景，Jabil 则显示 Apptronik
              正试图从试点走向可复制的制造路径。不过，现有资料仍多是伙伴名单，缺少量化指标。公司尚未发布客户运营数据，无法看出在役机器人数量、运行频次，或试点转为持续部署的比例。
