      - ["Adjacent automation", "Humanoid deployments where the form factor adds value versus fixed automation", "Conveyors, arms, AMRs, and other cheaper non-humanoid substitutes", "Manufacturing engineering and operations", "Useful adjacency but not pure humanoid TAM"]
      - ["Retail back-of-house", "Inventory, replenishment, and back-room handling", "Front-of-house service robots and consumer assistant devices", "Store operations and retail labor budgets", "Minor adjacency in the current public product set"]
      - ["Future healthcare / eldercare / home", "Future service workflows beyond current industrial focus", "Current industrial deployments", "Hospitals, eldercare operators, or households", "Downstream optionality, not the current core"]
      - ["Status quo manual labor", "Labor spend tied to repetitive physical work", "Robotics purchases", "Operations budgets measured against productivity and safety", "The main substitute and adoption benchmark"]
