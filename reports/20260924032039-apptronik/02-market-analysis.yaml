    claimRefs: [CM001, CM002, CM003, CM005, CM014]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns: [publisher, year, geography, value, CAGR, methodology, confidence, limitation]
    rows:
      - ["StartEngine", "2026", "global", "$38B", "n/a", "Goldman Sachs humanoid-robot TAM cited on the page", "medium", "Secondary citation and broad category; not Apptronik-specific"]
      - ["TSG Invest", "2025", "global", "$5T", "n/a", "Morgan Stanley long-horizon robotics estimate cited in the memo", "medium", "Extremely long-dated and very broad"]
      - ["Forge Global", "2026", "US/private market", "$5.3B", "n/a", "Indicated private-market valuation from Forge Price", "medium", "Valuation signal, not a market-size estimate"]
      - ["The Information", "2026", "global/private market", "$5B", "n/a", "Reported funding talks in the page title", "high", "Paywalled title snippet; not a closed financing"]
    notes: >-
      These rows are deliberately non-comparable lenses: external TAM quotes,
      private-market marks, and a reported valuation talk. They bracket market
      appetite but do not produce a defensible Apptronik SAM/SOM.
    claimRefs: [CM007, CM008, CM009, CM010, CM011]
  - id: TM003
    title: Segment / buyer map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - ["Factories", "Operations or plant leadership", "Line workers and technicians", "Manufacturing capex or pilot budget", "Material handling, line-side tasks, inspection, and repetitive workflows", "Manufacturing ops or industrial engineering", "Labor shortages and repetitive tasks without factory redesign"]
      - ["Warehouses and logistics sites", "Warehouse or logistics operations", "Warehouse associates", "Automation or RaaS budget", "Pick-pack-move, trailer unloading, and sorting", "Warehouse operations", "Throughput pressure and labor availability"]
      - ["Retail back-of-house", "Store operations", "Retail associates", "Retail labor or ops budget", "Inventory, replenishment, and back-room tasks", "Store operations", "Physical strain and staffing gaps"]
      - ["Early production partners", "Strategic operations or engineering leadership", "Robotics, manufacturing, and support teams", "Strategic capex or partner budget", "Integration, testing, and support for repeatable machines", "Manufacturing engineering plus operations", "Need for a production path and field proof"]
    notes: >-
      Buyer and payer roles are inferred from the public deployment language and
      named customer contexts, not from disclosed procurement contracts.
    claimRefs: [CM001, CM002, CM003, CM005, CM006, CM011, CM013]
figures:
  - id: FM001
    title: Evidence-constrained sizing stack
    type: pyramid
    layout: standard
    summary: >-
      A layered view of the public market signals around Apptronik, from broad
      humanoid TAM claims down to current private-market pricing and the
      company's still-limited operating proof.
    data:
      items:
        - label: Broad humanoid TAM
          detail: Goldman Sachs via StartEngine cites $38B by 2035.
          tone: opportunity
        - label: Long-horizon robotics TAM
          detail: Morgan Stanley via TSG Invest cites $5T by 2050.
          tone: opportunity
        - label: Private-market valuation
          detail: Forge Global shows a $36.97 price and $5.3B valuation.
          tone: neutral
        - label: Reported valuation talks
          detail: The Information title says talks were at a $5B valuation.
          tone: neutral
        - label: Industrial proof layer
          detail: Mercedes, GXO, and Jabil exposure is real, but metrics are thin.
          tone: risk
        - label: Near-term serviceable slice
          detail: Factories and warehouses first; consumer and home are downstream.
          tone: opportunity
    approximationNotes: >-
      This is a layered evidence stack, not a numeric roll-up. The available
      sources do not isolate a defensible Apptronik SAM or SOM, so heterogeneous
      market and valuation signals are shown together rather than forced into a
      single arithmetic estimate.
    claimRefs: [CM001, CM005, CM007, CM008, CM009, CM010, CM011, CM012, CM013, CM014]
