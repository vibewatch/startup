chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Apptronik is targeting industrial humanoid robotics first: factories,
    warehouses, logistics, and adjacent back-of-house workflows. Public sizing
    signals range from a $38B 2035 humanoid TAM to a $5T long-horizon robotics
    projection, but the sources available here still do not support a precise
    Apptronik SAM/SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Apptronik's public materials define the market around physically demanding
      work in human-built environments, not consumer companionship or home
      service robotics. The company centers Apollo on manufacturing, warehouse,
      logistics, and retail back-of-house workflows, while the broader category
      still competes with manual labor and conventional automation. That matters
      because the market boundary is narrower than "all robots" and wider than a
      single factory pilot: the near-term spend is tied to repetitive tasks,
      structured facilities, and budgets that care about labor relief, uptime,
      and integration cost. The excluded set includes consumer/home robots and
      fixed automation that does the job more cheaply when humanoid form is not
      needed.
    claimRefs: [CM001, CM002, CM003, CM005, CM014]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and valuation signals
    body: >-
      The available market-sizing evidence is better treated as a stack of
      lenses than as one clean TAM. Two secondary pages cite very different
      long-horizon estimates for humanoid or robotics demand, and the private
      market pricing pages show that investors are willing to ascribe multi-
      billion-dollar value to the company even though the operating proof is
      still limited. That mix supports a high-conviction view that the category
      is large, but a low-conviction view on any exact near-term SAM or SOM.
      The figure below intentionally layers those heterogeneous signals instead
      of pretending they are directly comparable.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-constraints
    title: Buyer map, adoption triggers, and constraints
    body: >-
      The buyer path looks operational rather than consumer-led. The primary
      buyer and budget owner are usually operations, plant, or warehouse leaders
      who need help with repetitive physical tasks, labor shortages, and
      throughput pressure. Apptronik's own materials point to a deployment model
      that starts in factories and warehouses, then expands into retail
      back-of-house and only later into healthcare, eldercare, or the home. The
      main constraints are not just technical; they are proof, cost, safety,
      and the need to show concrete throughput gains instead of partner logos.
      Until those metrics are public, adoption remains a pilot-to-production
      question rather than a fully proven category shift.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM013, CM014]
    tableRefs: [TM003]
