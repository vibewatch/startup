  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Audited revenue, ARR, or signed contract economics for Apollo deployments
      whyItMatters: Without disclosed revenue, it is impossible to judge revenue quality or whether pilots are converting into repeatable sales.
      diligencePath: Request management financials, customer invoices, or board reporting that reconciles pilots, deployments, and recognized revenue.
      relatedQuestionRefs: [QI005, QI008]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Public list price, realized price, or contract structure for Apollo units and services
      whyItMatters: Unit pricing determines gross profit potential, payback period, and whether the business is a product sale, lease, or services model.
      diligencePath: Ask for order forms, MSAs, pilot terms, or a pricing sheet that separates hardware, software, and support.
      relatedQuestionRefs: [QI002, QI007]
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: A reconciled employee count and date stamp from management or payroll
      whyItMatters: Public headcount estimates range widely, which makes burn and scaling assumptions difficult to anchor.
      diligencePath: Reconcile HR records against public profiles and market-data vendor snapshots.
      relatedQuestionRefs: [QI006]
    - type: missing-source
      severity: blocking
      topic: runway
      missingEvidence: Cash balance, burn rate, and runway projection
      whyItMatters: Capital adequacy is the key underwriting question for a hardware-heavy company that has not disclosed revenue.
      diligencePath: Obtain the latest cash-flow forecast, balance sheet, and financing plan from management.
      relatedQuestionRefs: [QI005]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - [Apollo pilot deployment revenue, time-limited proof-of-value pilots and early deployments, site or pilot, announced but not monetized publicly, medium, Are pilots paid and what portion converts?]
      - [Apollo production deployments, robot units or fleet contracts at customer sites, unit or site, future or early-stage; no public active-robot count, low, How many robots are on recurring contract?]
      - [Service and support, installation training maintenance and spare parts, site per year, implied by field robotics model; margin undisclosed, low, What is the attach rate and service margin?]
      - [Fleet software and monitoring tools, telemetry updates and fleet-level management, site per month, described on the homepage but not priced separately, low, Is software bundled or billed separately?]
    notes: Public materials support the deployment and support model, but none of the reviewed sources disclose a revenue mix or realized operating revenue by stream.
    claimRefs: [CI001, CI004, CI010, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns: [price/unit/contract, list vs realized pricing, discounts/unknowns, source]
    rows:
      - ["$80,000 per Apollo unit", "implied secondary estimate", "not a published list price; realized pricing unknown", "Forge cites B Capital / Howard Morgan"]
      - ["$25 per security", "secondary investment price", "not an operating price; no revenue relevance", "StartEngine"]
      - ["$5.3B to $5.5B valuation band", "capital-market valuation not product pricing", "total capital and cap table still inconsistent across sources", "Forge / Tracxn / New Market Pitch"]
      - ["Commercial agreement terms", "undisclosed", "no public unit economics or discounting disclosed", "Apptronik and Mercedes-Benz / GXO references"]
    notes: This table separates product monetization from investor-market pricing because the public record only exposes an implied robot price and private-market share pricing, not a disclosed list price.
    claimRefs: [CI005, CI006, CI008, CI009]
  - id: TI003
    title: Unit economics table
    columns: [metric, value or null, confidence, why it matters, diligence ask]
    rows:
      - [gross margin, null, none, Determines whether Apollo can scale profitably once deployments start, Disclose product and service gross margin by program]
      - [cash balance, null, none, The core indicator of short-term financing dependency, Provide latest balance sheet cash]
      - [burn rate, null, none, Needed to estimate runway and next-round timing, Provide monthly burn and forecast]
      - [runway, null, none, Tells us how much time remains before another raise is needed, Provide runway under base and downside cases]
      - [headcount, 150+ to 504 across public sources, low to medium, Proxy for payroll scale and operating burn, Reconcile HR and payroll numbers]
      - [customer count, at least 3 named strategic customers, low, Concentration and conversion risk remain opaque, Disclose paying customer count and active robots]
    notes: Values are either unavailable or inconsistent across public sources; where the table shows a range, it reflects public-source disagreement rather than a management disclosure.
    claimRefs: [CI006, CI007, CI009, CI011, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Apollo appears to move from industrial pilot demand to deployment fees, support revenue, and eventual fleet-scale economics, but the public record still hides the pricing and conversion step.
    data:
      nodes:
        - id: demand
          label: Industrial demand
          detail: Manufacturing and warehouse labor pain points
        - id: pilots
          label: Pilots and proof-of-value
          detail: Mercedes-Benz, GXO, and Jabil references
        - id: deployments
          label: Commercial deployments
          detail: Unit or fleet rollouts, if pilots convert
        - id: support
          label: Services and support
          detail: Installation, training, maintenance, spares
        - id: software
          label: Fleet software
          detail: Telemetry and management tools
        - id: capital
          label: Private capital
          detail: Funding required before public revenue disclosure
      edges:
        - from: demand
          to: pilots
        - from: pilots
          to: deployments
        - from: deployments
          to: support
        - from: deployments
          to: software
        - from: support
          to: capital
    approximationNotes: The bridge is conceptual because the reviewed sources do not disclose a public pricing sheet, revenue mix, or cash-flow statement.
    claimRefs: [CI001, CI002, CI003, CI004]
