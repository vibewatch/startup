company:
  name: Apptronik
chapter:
  number: 4
  title: Financials
  summary: >-
    Apptronik's financial profile is capital-rich but disclosure-poor: public sources point to roughly $0.4B-$1.0B of cumulative funding and a valuation around $5.3B-$5.5B, yet no audited revenue, ARR, gross margin, cash balance, or runway figures are publicly disclosed. The underwriting view therefore depends on private-market estimates, pilot-to-production conversion, and whether Apollo can turn industrial deployments into repeatable revenue.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Apptronik presents Apollo as an industrial robot platform for manufacturing, warehouse, and retail workflows, so the most plausible operating revenue is tied to deployments, support, and integration rather than pure software licensing. The reviewed sources do not disclose a public list price, realized contract value, or revenue mix, which means the revenue bridge still has to be inferred from product positioning, strategic customer logos, and a small amount of third-party pricing commentary. The clearest public monetization clue is the secondary-market estimate that Apollo may be priced around $80,000 per unit, but that figure is not company-published and should be treated as directional only. The revenue streams table and pricing table below separate company-described activity from market inference so the reader can see what is known, what is implied, and what is still absent.
    claimRefs: [CI001, CI004, CI005, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-valuation
    title: Capital profile and valuation
    body: >-
      Apptronik has already raised a very large amount of private capital for a company that still does not publish public operating metrics. The official 2025 press release says the company closed a $350 million Series A and then a $403 million total round in March 2025; later market-data sources move the estimate closer to $956 million raised and a $5.5 billion valuation, while Forge and New Market Pitch both put the valuation in the $5.3 billion range. The point is not that one source is correct and the others are wrong. It is that the public capital picture is now large enough to require execution-level proof, but the exact numerator remains fuzzy enough that underwriting should treat the numbers as estimates rather than audited facts. That makes financing dependency, future dilution, and the absence of cash/runway disclosure central diligence issues.
    claimRefs: [CI002, CI003, CI006, CI008, CI009]
  - id: economics-and-gaps
    title: Cost structure, unit economics, and diligence gaps
    body: >-
      The cost side is also under-disclosed. Apptronik's public materials point to hardware, field deployment, fleet tools, services, and manufacturing support, which implies a capital-intensive operating model with meaningful service-delivery, inventory, and support costs. But no reviewed source gives gross margin, cash balance, burn, runway, or capex detail, so the company cannot be underwritten as a conventional software business and should not be treated like one. Public headcount signals are similarly inconsistent: the company itself said it had over 150 employees in 2025, StartEngine cited 195 employees, and Tracxn later listed 504 employees, which is a useful reminder that even basic operating-scale metrics remain fluid. The unit economics table below makes the missing inputs explicit and ties each gap to a specific diligence ask.
    claimRefs: [CI007, CI011, CI012]
    tableRefs: [TI003]
