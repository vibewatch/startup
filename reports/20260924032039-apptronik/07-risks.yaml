  name: Apptronik
chapter:
  number: 7
  title: Risks
  summary: "Apptronik's public risk profile is still dominated by execution: Apollo is moving from prototype-like pilots toward a product, but public proof remains metric-light while concentration, manufacturing, and valuation risks all rise as the company prices in a $5B-plus outcome. The sharpest thesis break is another delayed reveal without published throughput, uptime, or customer-scale numbers."
sections:
  - id: risk-overview
    title: Risk stack and thesis breakpoints
    body: |-
      Apptronik's headline risk is that the market is now pricing the company for execution while public proof remains pre-scale. The strongest public signals are Robot Park and Apollo 3, but those same sources still describe Apollo 2 as a prototype for scaled pilots and data collection. That makes safety, regulatory friction, and the missing KPI scoreboard the near-term thesis breakpoints: if Apollo 3 slips again or the next public reveal still lacks throughput, uptime, and intervention data, the company will look well-funded but not yet de-risked. We did not surface public litigation or recall evidence in the reviewed material, but that remains an open diligence item rather than a cleared risk.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR007
      - CR009
      - CR014
      - CR015
    tableRefs:
      - TR001
    figureRefs:
      - FR001

  - id: operational-risks
    title: Operational, quality, and security risks
    body: |-
      Operationally, Apptronik is no longer a lab with a few engineers; it needs manufacturing, service, IT, and security functions that look like a real industrial hardware business. The job posting and press releases imply growing on-prem infrastructure, backups, and high-availability expectations, while Jabil and Robot Park show how much the company depends on repeatable physical execution. This is why the largest residual exposure here is not one isolated bug but the possibility that Apollo 3 arrives without durable unit economics, serviceability, or field reliability. The clearest diligence ask is still public or customer-side evidence of uptime, intervention rate, mean time to recover, and safety incidents.
    claimRefs:
      - CR001
      - CR002
      - CR008
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR002

  - id: partner-capital-risks
    title: Partner, concentration, and financing risks
    body: |-
      The company also carries concentration risk. The public narrative depends on a short list of named counterparties - Mercedes-Benz, GXO, Jabil, and Google DeepMind - so any one relationship shifting could slow both customer proof and product learning. On top of that, Apptronik is now being discussed at a roughly $5B valuation, which means private-market liquidity and follow-on capital discipline matter almost as much as product milestones. If the next financing or secondary pricing compresses, or if partner access to data or model support weakens, the thesis should be repriced quickly. The right mitigants are milestone-based spend, broader customer diversification, and explicit data/model rights.
    claimRefs:
      - CR006
      - CR007
      - CR011
      - CR012
      - CR013
    tableRefs:
      - TR003
