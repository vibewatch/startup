companyProfile:
  summary: >-
    WorkOS provides developer APIs and components that help B2B software vendors become enterprise-ready through SSO,
    SCIM directory sync, audit logs, RBAC, AuthKit, and related identity infrastructure. The company is led by founder
    and CEO Michael Grinich, is headquartered in San Francisco, and has paired its March 2026 $100M Series C with
    growing traction among AI-native and developer-first software companies. Public disclosures support a
    private-disclosed company profile with strong commercial adoption but incomplete operating transparency.
