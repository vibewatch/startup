runDate: "2026-10-09"
company:
  name: "WorkOS"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a modular, usage- and connection-based revenue model, but it does not disclose WorkOS revenue, ARR, gross margin, retention, burn, or runway. The reported March 2026 financing expands capital resources, yet funding raised is not cash available; underwriting therefore remains contingent on private financial and cohort evidence."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing"
    body: |
      WorkOS appears to monetize through subscriptions and usage rather than a single seat license. Multiples.vc classifies the model as usage-based and subscription, while RFP.wiki reports a modular schedule: AuthKit is free through the first 1 million monthly active users and then priced per additional MAU block; Enterprise SSO and Directory Sync are priced per production connection; Audit Logs, Radar, custom domains, and higher support tiers add separate charges. These are reported list prices, not realized contract values or recognized revenue. The architecture can support recurring expansion as a customer's user base, enterprise connections, or add-on consumption grows, but public evidence does not disclose product-level revenue mix, discounting, annual commitments, or revenue-recognition policy.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "traction-and-sales-efficiency"
    title: "Traction and Sales-Efficiency Proxies"
    body: |
      The strongest public traction metric is historical rather than current: Multiples.vc says WorkOS served more than 200 paying customers around its June 2022 Series B. The assigned sources provide no current paying-customer count, revenue, ARR, contract-size distribution, or concentration data. Company-selected testimonials offer workflow proxies, not company unit economics. One customer says SSO launched in less than a week; another says its prior in-house process required two to four hours to provision each connection and that WorkOS connection pricing fit projected growth. Those examples indicate potential implementation and onboarding value, but they do not establish WorkOS CAC, sales-cycle length, payback, retention, or general customer ROI.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI016"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit Economics"
    body: |
      Public sources identify operating-cost categories but not their dollar impact. WorkOS's July 2026 postmortem describes a shared database connection-pool failure affecting authentication and user-management traffic, followed by transaction fixes, observability work, workload isolation, overload protection, and expanded load testing. The status page also announced a required October platform upgrade with expected transient latency. These disclosures show that cloud capacity, database engineering, telemetry, reliability work, and incident response are real service-delivery inputs. They do not quantify hosting cost, support cost, SLA credits, gross margin, or cash burn. RFP.wiki separately notes that WorkOS is private and does not publish audited profitability or EBITDA, leaving margin durability unverified.
    claimRefs:
      - "CI011"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: |
      Multiples.vc reports $195 million raised across three rounds, including a $100 million Series C in March 2026. RFP.wiki characterizes that round as occurring at a $2 billion valuation. A Tracxn page still reports $99 million and lists the 2022 Series B as the latest round, illustrating stale private-market aggregation rather than a second current capital figure. EquityZen's page describes shareholder secondary transactions and gates valuation, cap-table, and financial data behind enrollment; those transactions are liquidity for selling holders, not proceeds to WorkOS. No assigned source states cash on hand, burn, runway, debt, or financing obligations. The financial verdict is therefore mixed: monetization is legible and recent financing is substantial, but revenue quality, margin path, capital adequacy, and financing dependency cannot be underwritten from public evidence.
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI016"
