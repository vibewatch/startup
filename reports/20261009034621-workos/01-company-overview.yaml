company:
  name: "WorkOS"
chapter:
  number: 1
  title: "Company Overview"
  summary: "WorkOS provides developer APIs that abstract complex enterprise identity and compliance requirements—including SSO, SCIM directory sync, RBAC, and audit logs—enabling B2B software vendors to become enterprise-ready with minimal engineering overhead. Following its March 2026 $100M Series C led by Meritech and Sapphire at a $2.0B valuation, the company has increasingly anchored its commercial narrative on authentication and authorization infrastructure for autonomous AI agents."
sections:
  - id: "identity-and-founding"
    title: "Company Identity and Foundation"
    body: "WorkOS was founded in 2019 by Chief Executive Officer Michael Grinich following his earlier tenure at Nylas. While developer teams traditionally spent months building custom integrations for fragmented enterprise identity providers such as Okta, Microsoft Entra ID (Azure AD), Ping Identity, and Active Directory Federation Services, WorkOS introduced normalized RESTful APIs and modern language SDKs that abstract these protocols into turn-key building blocks. The corporate entity is headquartered in San Francisco, California, and maintains a distributed workforce spanning San Francisco, New York, and remote locations. The company acquired Dublin-based UI framework creator Modulz in 2022 to absorb the core engineering team behind Radix, subsequently launching AuthKit to pair back-end identity APIs with customizable front-end authentication components."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership and Key-Person Risk"
    body: "Operational leadership remains heavily centered on founder and CEO Michael Grinich, who drives core product vision, developer evangelism, and financing strategy. Executive leadership also features Developer Experience Vice President Zeno Rocha, who joined through the 2022 Modulz acquisition and spearheads community-facing developer tools and open-source interface components. Governance disclosures remain private; while institutional sponsors Meritech Capital Partners, Sapphire Ventures, and Greenoaks Capital maintain substantial economic stakes, WorkOS has not publicly disclosed exact post-Series C board composition, voting control thresholds, or independent director oversight structures, representing a material key-person dependence on founder Grinich."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization and Financing History"
    body: "WorkOS has raised approximately $199 million in total lifetime equity financing across multiple institutional rounds. The company announced an $80 million Series B financing round in June 2022 led by Greenoaks Capital with participation from Lightspeed Venture Partners, Abstract Ventures, and angel investor Lachy Groom, bringing cumulative funding at that time to approximately $100 million. In March 2026, WorkOS closed a $100 million Series C funding round led by Meritech Capital Partners and Sapphire Ventures, alongside Audacious, Craft Ventures, Abstract Ventures, and Greenoaks Capital, establishing a post-money valuation of $2.0 billion. EquityZen facilitates private secondary liquidity for accredited investors and early shareholders, though official cap-table distribution, share classes, liquidation preferences, and secondary transaction pricing remain undisclosed."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-reliability"
    title: "Operational Scale and Reliability Track Record"
    body: "The platform's commercial adoption expanded rapidly alongside the generative artificial intelligence boom, counting high-growth technology companies such as OpenAI, Anthropic, xAI, Perplexity, Cursor, Vercel, Stripe, and Airtable among its customer base. Independent private software trackers report that WorkOS reached $30 million in annual recurring revenue as of late 2025, up from $20 million reported five months prior, though management has demurred on releasing audited operating financials, cash burn, or gross margins. Platform reliability is critical given its position in the core authentication path of client applications. On July 16, 2026, WorkOS suffered a major service disruption lasting over two hours caused by latent ORM database connection starvation during an AuthKit Analytics logging wave, leading to peak login error rates of ~85% on SSO and ~73% on AuthKit before engineers disabled analytics writes to restore availability."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
