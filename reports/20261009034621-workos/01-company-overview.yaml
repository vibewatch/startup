callouts:
  - calloutType: "insight"
    title: "Strategic Positioning at the Intersection of Enterprise SaaS and AI Agents"
    body: "WorkOS transitioned from an enterprise-readiness utility (SSO and SCIM) into critical infrastructure for generative AI platforms including OpenAI, Anthropic, and Perplexity. As autonomous AI agents proliferate inside enterprises, trust, permissioning, and auditable actions become binding bottlenecks, elevating WorkOS's strategic relevance but concentrating infrastructure dependency."
    claimRefs:
      - "CO012"
      - "CO014"
  - calloutType: "risk"
    title: "Critical Path Availability and Latent Failure Modes"
    body: "The July 2026 service disruption demonstrated that embedding optional analytical telemetry into synchronous authentication paths creates catastrophic connection-starvation risks under burst traffic. Because WorkOS sits in the critical authentication path for premier AI and SaaS tools, multi-hour outages impose severe reputational and client operational damage."
    claimRefs:
      - "CO016"
