    title: Enterprise Data Residency and Architectural Separation Matrix
    columns:
      - Architectural Plane
      - Typical Data Types
      - Geographic Placement
      - WorkOS Architectural Pattern
      - Diligence Limitation
    rows:
      - - Customer Content Plane
        - Application database records, files, AI prompts, model responses
        - Strictly In-Region (e.g. EU / Local Data Centers)
        - Managed independently by customer applications outside WorkOS boundaries
        - Customers assume sole responsibility for maintaining regional data isolation
      - - Processing & Inference Plane
        - Search indexing, vector computations, GPU/CPU model inference
        - Regionalized / In-Region Compute Clusters
        - Not directly executed by WorkOS; decoupled from identity evaluation
        - WorkOS does not provide localized AI inference infrastructure
      - - Control & Identity Plane
        - Authentication metadata, login events, SSO configurations, tokens
        - Centralized Global Cloud Infrastructure (primarily US)
        - Centralized global metadata routing to preserve directory sync consistency
        - Unacceptable to sovereign defense and strict post-Schrems II regulatory mandates
