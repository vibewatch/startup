callouts:
  - calloutType: risk
    title: Single Point of Failure in Critical Authentication Runtime Paths
    body: >
      WorkOS sits directly in the synchronous authentication path of downstream SaaS applications. As demonstrated during the July 16, 2026 incident where peak SSO login error rates reached 85%, application-level defects such as connection pool starvation immediately cascade to end-user login failures across all client applications. Technical due diligence must verify that critical auth pathways maintain complete isolation from auxiliary analytics, bounded concurrency controls, and robust circuit breakers.
    claimRefs:
      - CE013
      - CE014
  - calloutType: insight
    title: The Sovereign Enclave Limitation of Selective Data Residency
    body: >
      While WorkOS's selective data residency model successfully resolves compliance friction for standard commercial SaaS by decoupling localized content storage from global authentication routing, it cannot satisfy sovereign defense or strict post-Schrems II regulatory enclaves that forbid cross-border metadata transmission. Buyers requiring zero-trust geographic isolation must evaluate private or self-hosted identity alternatives.
    claimRefs:
      - CE010
      - CE011
      - CE012
