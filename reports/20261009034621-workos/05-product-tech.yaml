    title: Core Operating Stack and Shared Platform Components
    columns:
      - Layer / Subsystem
      - Technology Components
      - Primary Architectural Role
      - Systemic Failure Mode & Mitigation
    rows:
      - - Cloud Infrastructure
        - Amazon Web Services (AWS), Terraform
        - Multi-tenant compute hosting, network isolation, and declarative provisioning
        - Regional service degradation mitigated by automated infrastructure scaling
      - - Application Runtime
        - Node.js, TypeScript, React
        - Core API execution, SDK interfaces, and frontend AuthKit component rendering
        - Unhandled client payload variations mitigated by strict runtime type validation
      - - Primary Persistence
        - PostgreSQL
        - Relational state storage for user sessions, tenant bindings, and configurations
        - Connection starvation mitigated by nested transaction removal and shorter timeouts
      - - Messaging & Event Delivery
        - Amazon SQS, Amazon Kinesis, Outbox Pattern
        - Asynchronous webhook dispatch, directory sync updates, and audit event queues
        - Out-of-order delivery mitigated by consumer-side idempotency keys and deduplication
