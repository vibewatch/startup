evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-financials
    missingEvidence: >-
      Audited financial statements confirming exact ARR, net revenue retention (NRR), gross margins, and operational
      cash burn.
    whyItMatters: >-
      A $2.0B post-money valuation represents a stretched ~67x multiple on $30M ARR unless gross margin and retention
      demonstrate elite compounding.
    diligencePath: >-
      Request confidential disclosure schedules or CFO financial reviews under non-disclosure agreement during formal
      diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership
    missingEvidence: Comprehensive organization chart detailing Chief Technology Officer, General Counsel, and Vice President of Sales.
    whyItMatters: Confirms executive bench depth and operational redundancy beyond founder Michael Grinich.
    diligencePath: Review executive compensation filings, management bios, or request an official leadership census.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent third-party verification of WorkOS's exact B2B SaaS enterprise-readiness SAM and SOM segment
      penetration.
    whyItMatters: >-
      Public estimates rely on bottom-up connection pricing models ($125/connection) and disclosed paying customer
      counts (1,000+ accounts), leaving contract concentration and net revenue retention unverified.
    diligencePath: >-
      Review private investor data room metrics on enterprise ACV distribution, logo churn, and connection expansion
      rates across customer cohorts.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: adoption-constraints
    missingEvidence: >-
      Comprehensive churn analysis and competitive displacement rates between WorkOS, Auth0, and modern authentication
      alternatives.
    whyItMatters: >-
      While review aggregators note pricing friction at $125/connection/month, exact customer migration volumes and
      gross retention rates are not publicly reported.
    diligencePath: >-
      Request customer reference calls and historical win/loss reports covering competitive displacements from legacy
      IAM and developer auth vendors.
    relatedQuestionRefs:
