      - number: '5.2'
        title: 云架构、共享基础能力与工程技术栈
        blocks:
          - type: paragraph
            body: >
              在底层，WorkOS 运行着一个主要托管在 Amazon Web Services（AWS）上的分布式多租户平台，采用 TypeScript 和 Node.js 运行时，后端使用 PostgreSQL
              关系数据库、Terraform 管理的基础设施，以及 SQS 和 Kinesis 等消息队列机制。平台工程团队构建标准化内部能力，包括 outbox-pattern 事务消息队列、事件流管道、出站 webhook
              分发系统和事务邮件交付，让模块化产品服务扩展时无需重复建设关键基础能力。


              WorkOS 面临的基础工程挑战，是把上游目录和身份服务商不可预测的行为规范化为幂等、可安全重放的下游操作。外部 SCIM 客户端经常发送部分更新、在临时网络超时后重试，并以乱序方式交付更新，因此 WorkOS
              处理程序强制执行严格幂等和最终一致性。同样，审计日志管道把高吞吐、低成本的有序追加写入路径与索引化分页读取路径分开，在保持快速查询留存窗口的同时不降低事件接收性能。此外，内部平台项目优先建设可复现的开发循环和代理式持续集成管道，以加快各服务的构建和部署反馈。
            claimRefs:
              - CE005
