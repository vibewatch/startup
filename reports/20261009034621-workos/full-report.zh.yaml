      - number: '1.4'
        title: 运营规模与可靠性记录
        blocks:
          - type: paragraph
            body: >-
              随着生成式人工智能热潮发展，平台商业采用迅速扩大，客户包括 OpenAI、Anthropic、xAI、Perplexity、Cursor、Vercel、Stripe 和 Airtable
              等高增长科技公司。独立私人软件追踪机构称，WorkOS 截至 2025 年末的年化经常性收入达到 $30 million；五个月前披露的数字为 $20
              million。不过，管理层一直没有公布经审计的运营财务数据、现金消耗或毛利率。鉴于 WorkOS 位于客户应用的核心身份验证路径，平台可靠性至关重要。2026 年 7 月 16 日，AuthKit
              Analytics 日志流量期间潜在的 ORM 数据库连接耗尽导致 WorkOS 发生重大服务中断，持续超过两小时；工程师禁用分析写入后才恢复可用性，SSO 峰值登录错误率约为 ~85%，AuthKit 约为
              ~73%。
            claimRefs:
              - CO014
              - CO015
              - CO016
