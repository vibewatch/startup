  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与买方经济性
        blocks:
          - type: paragraph
            body: >
              WorkOS 的客户主要分为开发者驱动的 B2B SaaS 初创公司、高增长 AI
              原生应用，以及寻求快速达到企业级要求的中型市场软件厂商。在典型采购流程中，技术买方是工程经理、技术负责人或产品经理；他们面对迫在眉睫的企业采购阻碍，尤其是企业 IT
              要求支持单点登录（SSO）和自动员工目录配置（SCIM）。工程团队接入 WorkOS 统一 API 后，可以消除持续数月的内部开发积压，无需从零构建定制身份服务商（IdP）连接器。


              但随着软件厂商扩张，付款方动态会发生变化。商业合同从开发者自助层转向由财务和管理层监督的销售辅助企业合同。WorkOS 围绕专职客户管理和高管业务评审组织商业扩张，追踪 AuthKit、Directory
              Sync 和 Audit Logs 的净收入留存与多产品采用。与此同时，市场评估和同行比较指出，按连接计费会给那些向低 ACV 客户账户部署 SSO 的 SaaS
              厂商带来利润压力；连接量增长后，他们会对成本更加敏感，并与 Okta 等完整 IAM 套件或专业替代方案进行比较。
