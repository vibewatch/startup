      - number: '5.4'
        title: 系统可靠性、级联故障模式与运营治理
        blocks:
          - type: paragraph
            body: >
              身份与会话管理正处于每个客户登录的关键运行路径上，因此平台可用性和故障隔离至关重要。2026 年 7 月 16 日，WorkOS 在 08:00 至 10:10 UTC 发生严重服务中断：SSO
              登录的总体错误和超时率约为 58%（峰值 85%），AuthKit 交互式登录为 45%（峰值 73%），令牌交换和会话刷新流程为 41%。Directory Sync 和 Audit Logs
              未受影响，调查确认没有客户数据损坏或未授权访问。


              事后复盘显示，事故由并发会话创建请求异常激增触发，暴露出关键架构缺陷。ORM 库中的嵌套数据库事务在持有主要事件事务、准备写入 AuthKit Analytics
              时，意外获取了第二个数据库连接。高并发下，工作线程陷入经典的持有并等待死锁，耗尽共享 PostgreSQL 连接池，并让所有共置的 User Management 端点缺少连接。直到 10:07 UTC
              工程团队通过运行时控制禁用分析写入路径，正常服务才恢复。随后，WorkOS 进行了架构修复：把非关键分析与同步身份验证请求解耦、缩短连接借用超时、加强取消处理，并实施有界并发过载保护。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 合规治理、安全审计与商业摩擦点
        blocks:
          - type: paragraph
            body: >
              WorkOS 通过独立第三方评估维持积极的安全合规状态，以满足企业安全审查。其 Trust Center 确认，公司持续保持 SOC 2 Type II 合规，由 Baker Tilly（原 Moss
              Adams）审计，观察期覆盖至 2025 年 5 月；同时具备 PCI-DSS SAQ-D Service Provider Attestations of Compliance（AOC）。此外，专门安全公司
              Latacora 每半年执行一次独立渗透测试，近期评估于 2025 年 4 月、2025 年 10 月和 2026 年 4 月完成。


              尽管合规证明较为扎实，WorkOS 在扩张中的 B2B SaaS 厂商之间仍面临商业和技术摩擦。SSOJet、LoginRadius 等外部市场分析和竞争者评估强调，WorkOS 每个活跃企业 SSO 连接每月
              $125 的标价（按层级折扣至 $100、$80 和 $65），会压缩那些销售较低层级 B2B 订阅的厂商利润，因为身份验证成本可能超过客户合同价值。此外，WorkOS 擅长抽象企业 SAML 和
              SCIM，但具有复杂消费者规模 CIAM 需求、渐进式画像、原生消费者注册或自定义域名白标需求的 SaaS 厂商，经常报告需要借助第三方混合身份方案补足能力；自定义域名还需额外支付 $99/month。
            claimRefs:
              - CE004
              - CE011
              - CE015
              - CE016
      - number: '5.6'
        title: 展示项
        blocks:
          - type: callout
            title: 关键身份验证运行路径中的单点故障
            body: >
              WorkOS 直接处于下游 SaaS 应用的同步身份验证路径。2026 年 7 月 16 日事故期间，SSO 登录峰值错误率达到
              85%，这说明连接池耗尽等应用级缺陷会立即级联成所有客户应用的终端用户登录失败。技术尽调必须确认关键身份验证路径与辅助分析完全隔离，具备有界并发控制和稳健的熔断机制。
            calloutType: risk
