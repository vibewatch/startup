  - id: TP003
    title: 定价与套餐比较
    columns:
      - 解决方案
      - 定价模式
      - 免费层额度
      - 企业 SSO 起始价格
      - 隐性费用或超额成本
      - 对 SaaS 买方的经济影响
    rows:
      - - WorkOS
        - 混合免费增值 MAU 模式，加上按连接收费的 SSO/SCIM 费用
        - AuthKit 每月最多 100 万月活用户免费
        - 前 15 个连接每个每月 $125
        - 超出免费层后每 100 万 MAU 每月 $2,500，每月 $99 的审计日志，每月 $99 的自定义域名
        - 初创公司上线阶段无需付费；企业客户规模扩大后，成本线性陡增
      - - Auth0 / Okta
        - 按用户分层订阅，另加企业功能
        - 有限免费层（最多 7,500 名活跃用户）
        - 基础价格从每月 $35 起；企业 SSO 需进入定制档位
        - 超额用户费用，以及高级企业功能的附加费用
        - 对成长中的 B2B SaaS 软件公司而言，最低年度承诺费用高
      - - Microsoft Entra
        - 按用户按月许可，与 Microsoft 云服务捆绑
        - 外部身份的免费层最多支持 50,000 个 MAU
        - P1 功能在免费层以上按每名活跃用户 $0.00325 收费
        - 高级治理和条件访问需要升级到 P2
        - 对以 Microsoft 为中心的组织极具成本效益；单独使用时体验较差
      - - AWS Cognito
        - 按使用量、按 MAU 计费的云服务
        - 每月最多 50,000 个 MAU 免费
        - 标准用户每个 MAU $0.0055；SAML 按登录次数收费
        - 数据传输费及其他 AWS 云服务费用
        - 前期成本几乎为零，但内部工程和维护负担很重
      - - Toolradar 跟踪的同类产品
        - 固定月度软件订阅或按席位收费
        - 5 个直接替代方案中有 2 个提供免费计划
        - 商业同类产品每名用户每月收费 $3 至 $6
        - 实施咨询费，以及年度合同锁定
        - 定价打包方式分散，买家必须比较按用户与按连接计费的结果
      - - Keycloak (Self-hosted)
        - 开源软件许可（Apache 2.0）
        - 整个平台完全免费下载
        - 无论连接数量多少，软件许可费均为 $0
        - 云服务器托管、存储、DevOps 人员和维护
        - 供应商软件许可成本为零，但需要投入大量运营人员
    notes: 定价依据供应商官方文档、Toolradar 基准和 SaaSTrueCost 买家分析汇总而成，时间截至 2026 年。
