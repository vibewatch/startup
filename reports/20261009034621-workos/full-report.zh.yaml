      - CR008
      - CR010
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将企业客户拓展势头、估值倍数压力和运营暴露连接至“继续研究”立场的决策流程。
    data:
      nodes:
        - id: node-traction
          label: 企业开发者获客势头
          detail: 付费客户超过 1,000 家，包括 OpenAI、Anthropic、Cursor 和 Vercel
        - id: node-valuation
          label: C 轮估值基准
          detail: Meritech 和 Sapphire 领投 $100M 轮融资后，投后估值为 $2.0B
        - id: node-disclosures
          label: 运营披露缺口
          detail: 预估 $30M-$100M 收入对应 20x-66x 的高估值倍数，且没有经审计的 NRR 或利润率
        - id: node-reliability
          label: 基础设施风险评估
          detail: 2026 年 7 月的连接池中断显示系统性影响范围很大
        - id: node-recommendation
          label: 最终建议：继续研究
          detail: 在完成经审计的财务核验并确认价格纪律前，不给出无保留的买入评级
        - id: node-mitigation
          label: 尽调要求
          detail: 核实私有股权结构表中的优先权悬置、经审计的 ARR 及架构 SLA
    approximationNotes: 将定性与定量标准串联起来，映射至建议结论的逻辑顺序。
