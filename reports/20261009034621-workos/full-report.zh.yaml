      - number: '6.3'
        title: 留存持久性、扩张动力与集中度脆弱性
        blocks:
          - type: paragraph
            body: >
              WorkOS 的客户留存和持久性直接来自深度基础设施绑定：企业 SaaS 厂商一旦接入 WorkOS，用于管理企业账户的身份验证令牌、目录同步 webhook
              和审计日志，切换身份服务商就会产生巨大的工程迁移成本，带来用户登录中断风险，还需要协调数百个企业 IT 部门更新证书和元数据。这种架构锁定支撑核心企业账户的稳健毛留存。


              但定价模式匹配、传统生态边界和平台可靠性风险，给扩张持久性带来明显逆风。行业评论指出，对于终端客户要求在入门级套餐中提供 SSO 的 SaaS 厂商，WorkOS
              的按连接计费可能成为财务负担，促使客户自建连接器或评估其他 CIAM 厂商。此外，WorkOS 直接位于同步身份验证运行路径，因而系统中断——例如 2026 年 7 月 16 日 SSO 错误率达到 85%
              的服务中断——会直接级联成下游客户的终端用户登录失败。这些可用性事件，加上 Microsoft 和 Anthropic 等平台巨头不断出现的原生代理身份能力，会挑战 WorkOS 在企业市场的定价权和扩张速度。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 头部 AI 生态采用与高速客户拉动
            body: >
              WorkOS 已吸引 OpenAI、Cursor 和 Perplexity 等一批高度集中的旗舰 AI 与开发者工具客户。拿下这些定义品类的平台，验证了 WorkOS API
              的开发者体验，也在现代工程团队中对传统 CIAM 厂商形成了强大的竞争护城河。
            calloutType: strength
            claimRefs:
              - CU006
              - CU009
              - CU010
          - type: callout
            title: 按连接定价与传统厂商挤压带来的商业摩擦
            body: >
              独立市场评估和候选客户评价指出，WorkOS 的按连接定价会给试图在低价订阅计划中提供 SSO 的 SaaS 厂商设置很高的成本门槛。随着 Okta 等传统厂商和云超大规模厂商扩大原生开发者工具，WorkOS
              在长期企业合同续签时会面对利润压力和采购阻力。
            calloutType: risk
            claimRefs:
              - CU004
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按优先级排序的运营与安全暴露
        blocks:
          - type: paragraph
            body: >-
              可用性是证据支持的最高严重度风险，因为 WorkOS 位于身份验证路径上，平台故障可能阻止下游用户登录。WorkOS 报告称，2026 年 7 月 16 日事故影响了 08:00 至 10:10 UTC 左右的
              User Management、AuthKit 和 SSO；SSO 登录峰值错误与超时约为 85%，AuthKit 交互式登录为 73%，令牌交换和会话刷新为
              74%。披露的根因并非数据库本身故障，而是事务库缺陷与工作负载隔离不足叠加：低优先级分析任务在保留第一个连接的同时等待第二个连接。WorkOS
              还称，客户端重试和排队流量维持了连接池耗尽状态。公司报告称已在当天完成遏制并永久修复为使用同一连接，但更广泛的隔离、过载保护和故障测试效果仍未经独立验证。如果关键身份验证路径再次发生事故、补救里程碑未完成或严重事故反复出现，应将其视为打破投资论点的信号。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
