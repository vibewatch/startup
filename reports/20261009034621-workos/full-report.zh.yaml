      - number: '1.3'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              WorkOS 通过多轮机构融资累计筹得约 $199 million。公司在 2022 年 6 月宣布完成 $80 million Series B，由 Greenoaks Capital
              领投，Lightspeed Venture Partners、Abstract Ventures 和天使投资人 Lachy Groom 参与；当时累计融资约 $100 million。2026 年 3
              月，WorkOS 完成 $100 million Series C，由 Meritech Capital Partners 和 Sapphire Ventures 领投，Audacious、Craft
              Ventures、Abstract Ventures 和 Greenoaks Capital 跟投，投后估值达到 $2.0 billion。EquityZen
              为合格投资者和早期股东提供私人二级流动性，但官方股权结构表分布、股份类别、清算优先权和二级交易价格仍未披露。
