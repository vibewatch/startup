            - label: 中
            - label: 高
            - label: 已披露的防护措施正在推进或已列入计划
        - label: 计划维护延迟
          values:
            - label: 中
            - label: 中
            - label: 仅提供提前通知
        - label: 合同救济不足
          values:
            - label: 标准条款下为高
            - label: 高
            - label: 可协商；企业客户结果未披露
        - label: 连接成本压缩
          values:
            - label: 中
            - label: 高
            - label: 存在批量定价；群组经济性未披露
        - label: 财务与集中度不透明
          values:
            - label: 高
            - label: 高
            - label: 需要私下尽调
    approximationNotes: 所有定位均为分析师基于所引证据作出的定性判断，并非经过测量的概率、损失估算或独立核验的控制评级。
    claimRefs:
