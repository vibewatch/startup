      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业 SaaS 与 AI 代理交汇处的战略定位
            body: >-
              WorkOS 已从企业级就绪工具（SSO 和 SCIM）转型为 OpenAI、Anthropic 和 Perplexity 等生成式 AI 平台的关键基础设施。随着自主 AI
              代理在企业内部扩散，信任、权限管理和可审计操作成为硬约束瓶颈，WorkOS 的战略相关性因此上升，但基础设施依赖也更集中。
            calloutType: insight
            claimRefs:
              - CO012
              - CO014
          - type: callout
            title: 关键路径可用性与潜在故障模式
            body: >-
              2026 年 7 月的服务中断表明，把可选的分析遥测嵌入同步身份验证路径，在突发流量下会造成灾难性的连接耗尽风险。WorkOS 位于头部 AI 和 SaaS
              工具的关键身份验证路径，多小时中断会严重损害声誉并扰乱客户运营。
            calloutType: risk
            claimRefs:
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              WorkOS 将自身的市场品类定义为企业级开发者基础设施，把复杂的 B2B 合规和身份能力模块化为标准化 API 与托管界面。核心产品边界包括企业单点登录（通过 SAML 和 OIDC 协议实现的
              SSO）、目录同步（SCIM 和 HRIS 配置）、面向 IT 管理员的自助 Admin Portals、服务 SOC 2 等合规框架的标准化审计日志，以及细粒度授权。这一范围有意将 WorkOS 与
              Okta、Microsoft Entra ID 等通用员工身份服务商，以及面向消费者的身份工具区分开来。WorkOS 不负责管理企业设备上的内部员工访问策略，而是让多租户 SaaS 开发者顺畅服务企业 IT
              组织。WorkOS 的现状替代方案主要是内部 DIY 开发：工程团队花数月编写和维护脆弱的定制 SAML 集成与目录连接器，或复杂配置传统身份中间件。WorkOS
              把身份协议差异抽象到标准化端点之后，将持续数月的合规阻塞压缩成数天完成的集成。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: 可服务市场规模与受限估值视角
        blocks:
          - type: paragraph
            body: >-
              估算企业级开发者平台市场时，需要把宏观身份管理支出与 B2B SaaS 赋能这一细分部分拆开。行业估计显示，广义企业身份与访问管理（IAM）市场全球规模约 $16 billion，涵盖员工访问、治理、客户 IAM
              和特权访问。在这一宏观品类中，B2B SaaS 企业级就绪软件的可服务地址市场（SAM）估计约为 $1.8 billion，代表高增长 B2B SaaS 公司和 AI
              应用开发者为自动化企业接入与合规而支付的软件支出。WorkOS 的可服务可获得市场（SOM）受其按连接计费的商业模式约束：SSO 和 Directory Sync 每个活跃企业连接每月收费
              $125。多连接部署下，每位客户平均年合同价值约 $20,000；截至 2025 年末，WorkOS 已在超过 1,000 个付费客户账户中实现 $30 million ARR。高速增长体现为同比收入增速超过
              100%，动力来自快速扩张的软件平台中的开发者采用。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
      - number: '2.3'
        title: 买方画像、预算权与采购动态
        blocks:
          - type: paragraph
            body: >-
              WorkOS 采用开发者驱动增长（DLG）的市场进入方式，根本改变了传统企业采购流程。过去，软件身份验证和合规决策需要管理层自上而下批准、漫长的供应商评估和集中式安全委员会签字。如今的 B2B SaaS
              组织里，开发者和技术负责人——尤其是工程副总裁、首席技术官和平台架构师——掌握自主信用卡预算，并能做出具有约束力的架构基础设施决策。开发者利用 WorkOS
              的沙盒和文档自助集成，以解决迫在眉睫的企业销售阻碍，例如企业客户要求在签约前支持 SAML
              身份验证。自助信用卡的初始使用一旦嵌入应用核心代码库，就会随着企业客户数量增长，自然扩展为六位数企业合同。为承接不断扩大的客户层，WorkOS
              逐步在自下而上的自助模式外增加专职企业客户经理，形成既能处理复杂采购谈判、又能保持开发者速度的混合市场进入引擎。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、架构护城河与采用约束
        blocks:
          - type: paragraph
            body: >-
              推动 WorkOS 采用的首要增长动力，是现代 B2B 软件公司持续向高端市场迁移。软件初创公司扩大规模后，要拿下 Fortune 500
              企业账户，就必须满足严格的安全、审计和目录管理要求。OpenAI、Anthropic、Cursor 和 Perplexity 等 AI 原生平台快速扩散，进一步推高了需求：AI
              公司必须迅速赢得企业信任，并接入企业目录服务商。不过，市场渗透受到实质约束。客户评价指出，WorkOS 每个连接每月 $125
              的费用，相比按用户计费模式或免费增值替代方案，会让早期初创公司感到价格压力。此外，外部安全分析认为，WorkOS 的身份治理深度不如 Okta 等全套
              IAM，因而不适合内部企业目录管理。更关键的是，把身份验证外包会让 WorkOS 直接进入客户软件的关键运营路径。2026 年 7 月 16 日的服务中断导致 SSO 和 AuthKit 登录流程的 5xx
              错误率升高，持续超过两小时；可靠性中断会直接影响终端用户访问，是企业市场扩张的关键风险因素。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 开发者主导的采购权
            body: B2B 软件采购的结构性转变，让工程负责人可以先通过自助 API 做出具有约束力的架构承诺，而无需等待高管或中央 IT 采购正式介入。
            calloutType: insight
            claimRefs:
              - CM008
          - type: callout
            title: 按连接计费的逆风
            body: 每连接 $125/月的收费能从企业账户扩张中带来丰厚收入，但小型初创公司拿它与按用户计费或免费增值模式比较时，会感到采用阻力和成本压力。
            calloutType: risk
            claimRefs:
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              企业身份验证和身份基础设施市场可分为五类：成熟的传统身份套件、开发者优先身份验证平台、专门的即插即用 SSO 替代方案、云超大规模厂商身份服务，以及内部定制实现。如今属于 Okta 的
              Auth0，是客户身份与访问管理领域的传统领导者，协议覆盖广，并与企业采购关系深厚。但与即插即用的开发者 API 相比，Auth0 和 Okta 的部署往往配置周期长、集成开销大。Microsoft Entra
              External ID 借助现有企业 Office 365 许可和 Azure 基础设施打包身份能力；AWS Cognito 则以较低成本支持 AWS
              云环境集成，但开发者体验和开箱即用的企业配置能力较弱。在开发者优先身份领域，WorkOS 率先把 SAML、OIDC 和 SCIM 目录同步等企业联邦协议抽象出来。面向开发者的挑战者 Clerk
              更强调消费者和产品驱动的身份验证流程，Descope 与 FusionAuth 则提供工作流画布编排或自托管部署替代方案。同时，SSOJet 等专门的直接竞争者也已出现，利用 AI 辅助配置和偏向 B2B
              的默认设置缩短上市时间。最后，工程团队经常考虑内部定制开发；但自建 SAML、SCIM 和目录连接会带来持续维护负担及协议合规边缘情况，远超初始开发工作量。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
      - number: '3.2'
        title: 架构、协议支持与运营可靠性
        blocks:
          - type: paragraph
            body: >-
              将 WorkOS 与替代身份方案比较，可以看到协议完整性、开发者抽象层和基础设施韧性之间存在明显取舍。WorkOS 统一抽象 SAML、OIDC 和 SCIM 2.0 目录同步，并配套 Admin
              Portal，把身份服务商配置工作直接交给企业 IT 管理员。这一架构把 SaaS 工程团队实现企业级就绪所需的开发时间从数月缩短至数天。相比之下，SSOJet 等专门挑战者专注于带自动属性映射的 B2B
              偏好配置；Okta/Auth0 等传统套件虽然支持更多协议边缘情况，却要求更高的管理配置投入。然而，依赖多租户托管身份网关会引入关键的可用性和延迟依赖。2026 年 7 月 16 日，WorkOS 在 08:00
              至 10:10 UTC 之间发生持续数小时的重大服务中断；并发会话创建激增导致数据库连接池耗尽，User Management API、AuthKit 和 SSO 登录流程均出现延迟升高、超时和 HTTP 5xx
              失败。身份验证直接位于每个下游客户应用的关键登录路径，因此这类基础设施事故会直接损害客户收入运营，也凸显单一供应商集中身份管理的运营风险。
