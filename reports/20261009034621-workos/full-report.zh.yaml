        title: 展示项
        blocks:
          - type: callout
            title: 终止标准：关键路径可靠性故障反复出现
            body: 如果再次发生重大身份验证路径事故，并呈现相同的共享资源或重试放大模式；如果私有尽调无法证明已披露的隔离和过载保护；或客户合同使下行风险明显高于可追回的 SLA 与责任保护，则暂停投资。
