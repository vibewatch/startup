      - number: '7.2'
        title: 合同、数据与监管暴露
        blocks:
          - type: paragraph
            body: >-
              WorkOS 公布的条款把相当大的下行风险分配给订阅者。网站通知后，WorkOS
              可自行决定在月度续费时调整费用；服务按现状提供，不承诺不中断或无错误运行；赔偿总额上限为六个月订阅费，若订阅者没有付款义务，则上限为 $100。独立工作流服务商必须直接取得许可，WorkOS
              不承担这些第三方工作流造成的兼容性问题。WorkOS-bot 补充条款造成一个更窄的产品数据治理问题，因为条款称通用 Data Processing Addendum
              不适用于该服务。这些规定不能证明客户总会接受标准条款，协商后的企业订单可能不同。指定证据没有监管申报、法院记录、执法行动、专利纠纷或独立审计控制报告，因此不能把未发现此类证据解读为不存在法律、隐私或安全暴露。投资尽调应取得已签署的企业协议、DPA
              条款、子处理商名单、保险限额，以及任何争议或监管往来。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
