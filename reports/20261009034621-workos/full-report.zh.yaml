              - CO010
              - CO014
              - CO015
      - number: '1.2'
        title: 管理层与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              运营领导仍高度集中在创始人兼 CEO Michael Grinich 身上，他主导核心产品愿景、开发者布道和融资策略。管理团队还包括开发者体验副总裁 Zeno Rocha；他通过 2022 年收购 Modulz
              加入 WorkOS，负责面向社区的开发者工具和开源界面组件。治理披露仍属私有信息。Meritech Capital Partners、Sapphire Ventures 和 Greenoaks Capital
              持有较大经济权益，但 WorkOS 尚未公开披露 Series C 后的董事会构成、表决权控制门槛或独立董事监督安排，因此公司对创始人 Grinich 存在实质性的关键人物依赖。
