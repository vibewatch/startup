chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立基础
        blocks:
          - type: paragraph
            body: >-
              WorkOS 由 CEO Michael Grinich 于 2019 年创立，此前他曾在 Nylas 任职。过去，开发者团队往往要花数月为 Okta、Microsoft Entra ID（Azure
              AD）、Ping Identity 和 Active Directory Federation Services 等分散的企业身份服务商编写定制集成；WorkOS 则推出标准化 RESTful API 和现代语言
              SDK，把这些协议抽象成开箱即用的构建模块。公司实体总部位于 California 的 San Francisco，员工分布在 San Francisco、New York 及远程地点。2022
              年，公司收购总部位于 Dublin 的 UI 框架开发商 Modulz，吸收其 Radix 核心工程团队，随后推出 AuthKit，把后端身份 API 与可定制的前端身份验证组件结合起来。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
