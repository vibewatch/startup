            body: >
              WorkOS 的采用轨迹显示其在现代软件平台中大幅扩张：从 2022 年年中超过 200 个付费客户的早期 traction，增长到 2026 年为知名 AI 和 SaaS
              企业提供身份基础能力。公开客户证据显示，OpenAI、Cursor、Perplexity、Sierra、Plaid、Vercel、Stripe、Scale 和 Airtable 等高流量 AI
              工具与开发者平台均有关键部署。对快速增长的 AI 原生产品而言，Cursor 从 Auth0 完整迁移至 WorkOS，以获得更快登录和透明定价，说明产品初始市场匹配度强，并能加快运营。


              客户引用主要集中在技术结果：软件厂商普遍称，SSO 接入从数月定制开发压缩至数天，复杂身份管理则交由 WorkOS 的自助 Admin Portal。除外部客户应用外，WorkOS 还通过 Atlas 和 WOW
              CLI 等项目验证内部平台采用范式，展示开发者优先的脚手架如何让非技术人员在统一 SSO 和 Doppler 密钥管理下安全交付和管理内部工具。不过，关于付费客户总数、客户标识流失和合同 ACV
              分布的完整公开披露仍严格受限，需要直接开展商业尽调。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
