      - number: '5.3'
        title: 数据驻留取舍与跨境控制平面
        blocks:
          - type: paragraph
            body: >
              随着全球数据主权法规和区域合规要求趋严，WorkOS 倡导一种称为选择性数据驻留的架构范式。在该设计中，SaaS 应用把数据拓扑拆成两部分：高流量、敏感的客户内容平面——例如应用数据库、上传文件、生成式 AI
              提示词和模型推理结果——严格固定在区域内（例如欧洲联盟数据中心）；认证、会话验证和计费元数据则由集中式控制平面在全球管理。


              WorkOS 在现代企业架构中记录了这种选择性驻留模式，并强调 Slack、Airtable 和 OpenAI
              等领先平台如何将客户内容保留在区域边界内，同时通过集中的美国基础设施路由低流量登录请求和会话令牌。从工程角度看，这种拆分避免 SaaS
              厂商承担在每个司法辖区运行完全隔离的多区域数据库副本和同步身份目录栈的运营负担。但它也暴露出固有的架构限制：受严格 post-Schrems II GDPR
              执法约束的高度监管机构、政府国防承包商和主权实体，会把跨境身份验证路由视为不可接受的合规风险，从而限制 WorkOS 在零信任主权隔离区的可部署范围。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE009
              - CE010
