      - number: '7.3'
        title: 依赖、财务模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              商业模式形成两层相互关联的依赖。第一，WorkOS 把应用接入分散的身份服务商市场，因此客户既依赖 WorkOS 的集成，也依赖其背后的外部服务商和工作流。第二，独立采购评论称，低连接量时 SSO 和
              Directory Sync 起价为每连接每月 $125，另有模块费用；一名竞争者认为，按连接计费和 API
              集成会让预算更难预测，也让切换代价更高。竞争者证据是方向性信息而非独立基准，因此只能支持尽调假设，不能证明成本结论。公开运营证据同样稀薄：EquityZen
              把当前估值、股权结构表、融资历史、收入和财务细节放在会员及认证投资者验证之后。指定来源中没有任何一项能确定当前收入、利润率、现金消耗、资金续航、客户集中度或云服务商集中度。因此，投资论点仍应以私有财务报表、按
              cohort 划分的定价经济性、依赖关系图、事故/SLA 抵扣历史和集中度披露为前提。
            claimRefs:
              - CR004
              - CR013
              - CR014
              - CR015
              - CR016
