            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV010
              - CV014
              - CV015
      - number: '8.3'
        title: 情景分析、退出路径与尽调要求
        blocks:
          - type: paragraph
            body: >-
              为覆盖不同商业轨迹下的潜在回报，我们按 3 至 5 年投资期限建立乐观、基准和悲观情景。乐观情景假设企业快速扩张，WorkOS 成功将 面向代理的身份认证和深度 SCIM 集成变现，收入升至 $150
              million ARR，并通过 IPO 或高溢价战略收购获得 25x 倍数， 对应 $3.75 billion 估值。基准情景假设有机增长稳健，ARR 达到 $80 million、倍数为 18x，对应
              $1.44 billion 估值； 相较 March 2026 投后基线，价值小幅收缩，也凸显入场价格纪律的必要性。悲观情景反映倍数向公开 SaaS 市场中位数收缩， $50 million 收入按 10x
              ARR 计为 $500 million 估值；触发因素包括 Okta 等传统身份服务商竞争加剧，或主要客户集中度发生变化。
              在投入资本前，潜在投资者必须解决尚存的尽调缺口：经审计财务报表、准确的付费客户合同层级、清算优先权结构，以及经过验证的正常运行时间可靠性。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: $2.0B 估值下需要审慎的入场纪律
            body: >-
              WorkOS 代表开发者导向身份认证领域的顶级基础设施，其进入多个定义行业的 AI 应用便是证明。然而，在缺乏经验证财务披露的情况下， 以 $2.0 billion
              估值进行投资判断会带来过高的倍数风险。在私募尽调验证收入留存、单位毛利和清算优先权结构之前，投资者应保持 继续研究的立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV014
          - type: callout
            title: 集中式身份认证基础设施的运营爆炸半径
            body: >-
              July 16, 2026 的服务中断凸显，身份服务商是数字业务的单点故障。AuthKit Analytics 的数据库连接池死锁导致两小时窗口内 SSO 峰值错误率达到 85%，交互式登录达到
              73%。企业买方要求近乎无懈可击的可靠性，因此运营韧性是估值的关键变量。
            calloutType: risk
            claimRefs:
              - CV010
              - CV015
