      - 决策含义
    rows:
      - - 建议
        - research-more
        - Series C 定价为 $2B，但核心 ARR、NRR 和利润率仍未披露
        - 在获得详细财务披露前，不作无条件资本承诺
      - - 信心
        - 中
        - 头部客户基础的验证度高；财务审计透明度有限
        - 通过私有数据室和客户访谈交叉核验商业指标
      - - 风险评级
        - 高
        - 高倍数脆弱性、连接池中断历史和平台竞争
        - 要求结构性下行保护和清算优先权顺位
      - - 估值立场
        - stretched
        - 按 $30M-$100M 收入区间计算的隐含倍数为 20x 至 66x，高于同行中位数
        - 争取二级市场入场折价或结构化成长股权条款
    notes: 基于 2026 年 3 月 Series C 参数和私有跟踪指标综合得出的事实评估。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
  - id: TV002
    title: 正 / 反论点表
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 哪些情况会改变判断
    rows:
      - - 投资正论
        - 开发者优先的企业身份与智能体安全领域的品类领导者
        - 1,000+ 付费客户，包括 OpenAI、Anthropic、Cursor、Replit 和 Vercel
        - 企业客户流失，或新 SaaS 客户接入放缓
      - - 融资验证
        - 头部成长型风投支持，总募资超过 $198M
        - Series C 由 Meritech 和 Sapphire 共同领投，Greenoaks 参与
        - 后续融资轮次出现下调估值，或加入限制性债务契约
      - - 反论：倍数
        - 估值跑在可公开验证的运营和财务基本面前面
        - 基于未验证 $30M-$100M 收入数字的隐含倍数为 20x-66x
        - 经审计披露显示 ARR >$80M 且毛利率 >80%
      - - 反论：可靠性
        - 关键认证基础设施一旦中断，影响半径可能是灾难性的
        - 2026 年 7 月 16 日中断期间，SSO 登录错误率最高达 85%，AuthKit 登录错误率最高达 73%
        - 多区域 active-active 冗余，以及经独立审计的零中断记录
    notes: 对比性论点矩阵，将商业进展与估值及运营风险因素综合比较。
    claimRefs:
      - CV002
      - CV005
      - CV008
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 目标 ARR
      - 假设倍数
      - 隐含估值
      - 概率信号
      - 下行情景触发因素与假设
    rows:
      - - 乐观情景
        - $150M
        - 25.0x
        - $3,750M
        - 25%
        - AuthKit 和智能体认证快速普及；企业 ACV 扩张
      - - 基准情景
        - $80M
        - 18.0x
        - $1,440M
        - 50%
        - B2B 开发者客户稳步增长；倍数压缩至软件行业常态
      - - 悲观情景
        - $50M
        - 10.0x
        - $500M
        - 25%
        - Okta/Auth0 价格战、企业预算冻结或重大中断引发客户流失
    notes: 假设基准 ARR 未经验证，情景模型覆盖 3-5 年投资周期。
    claimRefs:
      - CV007
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: WorkOS 自 2019 年成立至 2026 年末的公司、融资、收购和运营关键里程碑。
    approximationNotes: 日期来自 WorkOS 和科技媒体发布的公开新闻稿、状态公告及技术复盘。
    claimRefs:
      - CO001
      - CO005
      - CO009
      - CO010
      - CO015
      - CO016
    data:
      items:
        - label: 公司成立
          detail: Michael Grinich 创立 WorkOS，为企业 SSO、SCIM 和目录同步提供标准化 API。
          date: '2019-01-01'
        - label: 收购 Modulz 与 Series B
          detail: WorkOS 完成由 Greenoaks 领投的 $80M Series B，并收购 Modulz，将 Radix UI 工程团队纳入公司。
          date: '2022-06-01'
        - label: $30M ARR 里程碑
          detail: 第三方私有跟踪记录显示，WorkOS 在 1,000+ 客户中实现 $30M 年经常性收入。
          date: '2025-11-04'
        - label: $100M Series C，估值 $2B
          detail: WorkOS 完成由 Meritech 和 Sapphire 领投的 $100M Series C，将产品重点扩展至 AI 智能体身份和 MCP。
          date: '2026-03-02'
        - label: 认证服务重大中断
          detail: 数据库 ORM 连接耗尽，导致 SSO 和 AuthKit 登录流程中断 2 小时，之后禁用分析写入。
          date: '2026-07-16'
        - label: Audit Logs API 错误升高
          detail: Audit Logs API 的错误短暂升高两分钟（HTTP 500/408），通过运营监控解决。
          date: '2026-10-01'
        - label: 基础设施平台升级
          detail: 在计划维护窗口内完成核心基础设施升级，覆盖事件和 webhook 系统。
          date: '2026-10-10'
  - id: FM001
    title: B2B SaaS 企业身份市场规模分层
    type: pyramid
    summary: 从全球云 IAM 到 WorkOS 可服务的企业级连接基础盘，逐层收窄市场规模。
    approximationNotes: TAM/SAM 估算代表行业分析师共识；SOM 和运行速率层反映 WorkOS 报告的客户指标及每条连接每月 $125 的定价模型。
    claimRefs:
      - CM003
      - CM005
      - CM006
    data:
      items:
        - label: 全球企业 IAM 市场（TAM）
          value: 16000
          unit: USD M
          detail: 覆盖劳动力和消费者细分市场的广义企业身份与访问管理市场。
        - label: 云与 SaaS 身份基础设施
          value: 5000
          unit: USD M
          detail: 面向 SaaS 应用和现代云目录协议的专业云 IAM 支出。
        - label: B2B SaaS 企业就绪度（SAM）
          value: 1800
          unit: USD M
          detail: 面向模块化 SSO、SCIM 和审计日志基础设施的可触达 B2B 软件支出。
        - label: 高增长 B2B SaaS 与 AI 供应商
          value: 450
          unit: USD M
          detail: 正积极向上拓展企业买家的快速增长、开发者优先的软件供应商。
        - label: 活跃连接型机会（SOM）
          value: 120
          unit: USD M
          detail: 基于多租户 SSO 和 Directory Sync 连接量的短期可捕获空间。
        - label: WorkOS 合同运行速率基线
          value: 30
          unit: USD M
          detail: 截至 2025 年末，在 1,000+ 付费客户账户中验证的 ARR 里程碑。
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: WorkOS 兼具出色的开发者易用性和快速企业就绪能力，但要在超大规模云厂商的分发能力与开源自主性之间取舍。
    data:
      xAxis:
        label: 开发者易用性与价值实现时间（0-10 序数）
      yAxis:
        label: 企业治理与协议深度（0-10 序数）
      points:
        - label: WorkOS
          x: 9
          'y': 7
          detail: 即插即用的统一 API 和 Admin Portal；专注于 B2B 企业 SSO/SCIM 就绪能力。
          tone: positive
        - label: Okta / Auth0
          x: 5
          'y': 9
          detail: 成熟的 IAM 领导者，企业协议深度很强，但实施复杂度高。
          tone: neutral
        - label: Microsoft Entra
          x: 4
          'y': 9
          detail: 具备超大规模企业触达和深度目录治理能力，但企业优先定位带来开发者摩擦。
          tone: neutral
        - label: AWS Cognito
          x: 4
          'y': 6
          detail: 在 AWS 上提供高性价比云集成，但缺乏现代开发者易用性和开箱即用的门户。
          tone: warning
        - label: Clerk
          x: 9
          'y': 5
          detail: 为 B2B/B2C SaaS 提供出色的开发者 UI 组件，企业协议深度正在形成。
          tone: neutral
        - label: SSOJet
          x: 8
          'y': 6
          detail: 以 AI 辅助配置加速 B2B 部署，市场覆盖仍处于早期。
          tone: neutral
        - label: Keycloak
          x: 3
          'y': 8
          detail: 开源自主性强且无许可费，但自托管部署重、运营负担大。
          tone: warning
    approximationNotes: 分数是有证据支持的序数评估，基于公开文档和竞争基准中的开发者工作流、API 架构及企业功能覆盖得出。
