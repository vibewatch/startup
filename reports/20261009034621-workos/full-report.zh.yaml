  - id: FE001
    title: WorkOS 企业身份平台架构栈
    type: stack
    summary: WorkOS 开发者基础设施的多层架构概览，从身份协议延伸至数据持久化。
    data:
      layers:
        - label: 展示层与开发者 SDK
          detail: 托管客户端界面、开发者 SDK 和 IT 管理员自助配置门户。
          modules:
            - AuthKit UI 组件（Radix UI）
            - 特定语言 SDK（Node、Python、Go、Ruby）
            - 面向企业 IT 的托管 Admin Portal
        - label: 核心身份与企业基础组件
          detail: 用于企业单点登录、员工目录同步和合规日志的协议标准化引擎。
          modules:
            - 企业 SSO 引擎（SAML 2.0 / OIDC）
            - 目录同步引擎（SCIM 2.0 / HRIS）
            - Audit Logs 服务（仅追加事件存储）
            - 会话管理与 MFA 服务
        - label: 共享平台子系统
          detail: 跨产品共用的后端事件基础设施、队列基础组件和流量过载防护。
          modules:
            - Outbox 模式队列与事务性 Outbox
            - 事件分发管道（Webhook）
            - 速率限制与过载保护
        - label: 云持久化与基础设施
          detail: 多租户关系型数据存储、异步缓冲流和 AWS 上的声明式云资源。
          modules:
            - 关系型数据库（PostgreSQL 多租户池）
            - 流式与队列缓冲区（AWS SQS 与 Kinesis）
            - AWS 上的 Terraform 云基础设施
        - label: 外部身份提供商与客户目录
          detail: 通过标准企业协议集成的上游第三方企业目录和身份提供商。
          modules:
            - Okta、Microsoft Entra ID、Google Workspace IdP
            - Workday、BambooHR、Rippling 目录服务
        - label: 下游 B2B SaaS 应用工作流
          detail: 客户 SaaS 应用在运行时工作流中使用 WorkOS 令牌、webhook 和身份断言。
          modules:
            - 企业 B2B SaaS 应用后端
            - 客户审计日志接入与 SIEM 导出管道
    approximationNotes: 分层表示综合自经验证的技术披露、平台工程规格和复盘图。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: WorkOS 客户参与从开发者发现到企业多产品扩张的端到端生命周期阶段。
    data:
      items:
        - label: 开发者发现与评估
          stage: 发现与评估
          persona: Lead Software Engineer
          goal: Identify prebuilt enterprise auth APIs to clear upcoming deal blocker
          touchpoints:
            - WorkOS 文档和 SDK 快速入门
            - 开发者自助注册沙盒
            - 社区 Slack 支持渠道
          friction: Evaluating per-connection pricing impact on unit economics
        - label: 沙盒原型与 AuthKit 设置
          stage: 原型与 AuthKit 设置
          persona: Frontend & Product Engineer
          goal: Scaffold hosted authentication UI and integrate initial user sessions
          touchpoints:
            - 基于 Radix 的 AuthKit 组件
            - localhost 重定向 URI 和测试凭据
            - WorkOS Node 和 Python SDK 库
          friction: Coordinating frontend auth state with legacy backend sessions
        - label: 实施与生产上线
          stage: 生产实施
          persona: Product Engineer
          goal: Integrate SAML SSO and SCIM Directory Sync into production SaaS
          touchpoints:
            - 统一 REST 和 GraphQL API 端点
            - AuthKit UI 组件定制
            - WorkOS 托管 Admin Portal 配置
          friction: Navigating IdP XML assertion quirks and certificate rotations
        - label: 企业 IT 接入与目录同步
          stage: 企业 IT 接入
          persona: Customer Enterprise IT Administrator
          goal: Connect corporate Okta or Microsoft Entra ID directory seamlessly
          touchpoints:
            - WorkOS Admin Portal 自助链接
            - 自动化 SCIM 员工生命周期 webhook 配置
            - 实时目录同步状态监控
          friction: Corporate security review of centralized US control-plane routing
        - label: 多租户企业扩张
          stage: 企业扩张
          persona: Enterprise Engineering Lead
          goal: Roll out SAML and SCIM across multi-tenant enterprise customer tiers
          touchpoints:
            - 专属客户成功和技术支持
            - 企业组织管理 API
            - 自动化审计日志和合规报告
          friction: Margin pressure from cumulative per-connection subscription charges
        - label: 账户扩张与治理标准化
          stage: 治理标准化
          persona: VP Engineering & Finance Buyer
          goal: Standardize identity, audit logging, and agent auth across portfolio
          touchpoints:
            - 专属客户经理业务复盘
            - Audit Logs 导出与 SIEM 集成
            - Agent Auth 与多团队 SKU 授权
          friction: Annual contract renewal negotiations over scaling connection costs
    approximationNotes: 旅程阶段与触点综合自 WorkOS 技术文档、客户管理岗位说明和客户案例。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: 按可能性、影响与缓解成熟度划分的风险热力图
    type: matrix
    summary: 定性定位将已有证据的事件影响，与尚未验证的复发、合同、商业及披露风险区分开来。
