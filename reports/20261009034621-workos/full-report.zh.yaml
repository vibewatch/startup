      - number: '3.3'
        title: 定价经济性、客户摩擦与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              WorkOS 采用混合变现策略：一方面提供激进的免费增值用户层，另一方面收取较高的按连接企业费用。AuthKit 为最多 1 million MAU 提供免费用户管理，让 B2B SaaS
              初创公司无需前期资金承诺就能尽早嵌入 WorkOS。应用开始服务要求企业单点登录或 SCIM 目录同步的企业买家后，才进入变现阶段。WorkOS 的公开价为：第 1 至 15 个连接每连接每月 $125，第 16
              至 30 个连接降至每连接 $100，第 31 至 50 个连接为 $80。SpendHound 的独立合同追踪显示，SMB 在 WorkOS 上的实际平均年度支出约为
              $5,253，但随着企业财务团队反对持续连接成本并审视按用户计费软件的投资回报，SMB 支出同比下降了 20.2%。此外，买方还要承担其他附加费：免费额度之外每增加 1 million 活跃用户每月收费
              $2,500；每 million 条审计日志事件 $99；自定义身份验证域名每月 $99。这套定价带来结构性摩擦：高迁移成本和关键目录集成保护 WorkOS
              已建立账户免于立即被替代，但连接价格过高会促使高增长软件厂商在企业连接量变大后评估多重接入，或迁移到 Keycloak 等自托管框架。
