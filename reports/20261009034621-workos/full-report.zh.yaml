  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 企业基础能力与模块化产品版图
        blocks:
          - type: paragraph
            body: >
              WorkOS 把核心企业级能力打包成模块化开发者 API 和预构建前端组件。产品基础是企业单点登录（SSO），它统一 Okta、Microsoft Entra ID（原 Azure AD）、Google
              Workspace、Ping Identity 和 OneLogin 等身份系统中不同的身份服务商（IdP）协议，包括 SAML 2.0 和 OpenID Connect（OIDC）。SaaS
              开发团队无需自行编写复杂协议解析器、处理时钟偏差、管理证书轮换或应对各服务商特有的 XML 断言问题，WorkOS 提供统一抽象层，输出标准化用户身份令牌和租户绑定。


              Directory Sync 与 SSO 配套，通过 SCIM 2.0（System for Cross-domain Identity Management）和自定义 webhook
              自动完成企业用户生命周期的配置与撤销。SaaS 应用直接接收客户 HRIS 和企业目录系统中的员工生命周期事件，就能实时维护角色分配，并在员工离职时立即撤销访问权限。除了身份同步，WorkOS 还提供基于
              Radix 基础能力构建的托管式可定制身份验证用户界面 AuthKit，以及面向企业合规审计、用于提供不可变事件流的结构化 Audit Logs。客户平台进入高吞吐多租户环境后，WorkOS
              将这些模块定位为一体化套件，以满足企业采购要求，同时不占用内部工程团队的核心产品开发带宽。
            claimRefs:
