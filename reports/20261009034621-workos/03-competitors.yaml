    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale and backing
      - Target customer segment
      - Key differentiation
      - Strategic limitation
    rows:
      - - Okta / Auth0
        - Incumbent identity suite
        - "Public corporation (NASDAQ: OKTA); market leader in enterprise IAM"
        - Mid-market to large global enterprises and customer IAM deployments
        - Comprehensive protocol coverage, mature compliance certifications, and enterprise sales channels
        - High implementation complexity, protracted sales cycles, and heavyweight administration
      - - Microsoft Entra External ID
        - Hyperscaler cloud suite
        - Microsoft division; massive enterprise distribution across Azure and Office 365
        - Organizations and ISVs standardizing on the Microsoft cloud and identity ecosystem
        - Zero-friction procurement bundling, deeply integrated Azure compliance, and unified enterprise billing
        - Rigid configuration workflows, developer friction, and tight Microsoft cloud dependency
      - - AWS Cognito
        - Hyperscaler developer service
        - Amazon Web Services cloud division; global hyper-scale cloud footprint
        - Cloud-native developers and infrastructure teams hosting applications on AWS
        - Low baseline service cost, tight AWS IAM integration, and native serverless connectivity
        - Primitive enterprise SSO/SCIM abstractions, high configuration complexity, and poor DX
      - - Clerk
        - Developer-first auth platform
        - Venture-backed scaleup; high adoption among Next.js and React developers
        - B2B/B2C SaaS startups, product-led growth companies, and modern web applications
        - Turnkey pre-built UI components, exceptional developer ergonomics, and native session management
        - Historically tailored toward self-serve web apps; enterprise SSO/SCIM depth remains emerging
      - - SSOJet
        - Specialized enterprise SSO vendor
        - Early-stage venture-backed challenger
        - B2B SaaS developer teams requiring rapid enterprise SSO and SCIM deployment
        - AI-assisted IdP configuration, opinionated B2B defaults, and streamlined attribute mapping
        - Smaller ecosystem footprint, unproven multi-year reliability track record, and early brand awareness
      - - Keycloak
        - Open-source self-hosted IAM
        - CNCF open-source project; backed by Red Hat and extensive global community
        - Enterprise teams demanding on-premise governance, complete data sovereignty, and zero vendor lock-in
        - Completely free open-source software license, zero per-connection fees, and full source-code control
        - Substantial DevOps deployment toil, self-managed high-availability maintenance, and manual upgrades
      - - Internal Custom Build
        - Status quo / in-house build
        - In-house engineering organization; internal engineering resource allocation
        - Engineering teams with unique bespoke compliance demands or low connection volume
        - Tailored exactly to internal codebase architecture with no third-party vendor dependencies
        - Massive recurring protocol maintenance overhead, security patch toil, and edge-case fragility
    notes: >-
      Profiles synthesize independent technical analyses, commercial tracking, and vendor documentation across commercial and open-source alternatives.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative sample of leading commercial incumbents, cloud hyperscalers, developer platforms, open-source alternatives, and status quo options solving B2B enterprise authentication as of 2026.
