callouts:
  - calloutType: insight
    title: The Per-Connection Pricing Moat and Vulnerability
    body: >-
      WorkOS's choice to price enterprise SSO per connection ($125/month) rather than per seat aligns pricing with B2B SaaS sales success: developers only pay when closing enterprise accounts.
      However, this pricing mechanism creates an economic threshold where fast-scaling SaaS customers face escalating marginal costs, driving procurement teams to demand enterprise credits or evaluate alternative architectures.
    claimRefs:
      - CP006
      - CP011
      - CP014
      - CP015
  - calloutType: risk
    title: Single-Point-of-Failure Operational Risk
    body: >-
      Centralizing enterprise authentication into WorkOS creates an existential dependency for SaaS applications.
      The July 16, 2026 database connection pool outage demonstrated that authentication downtime halts customer sign-in workflows across all downstream applications, underscoring that reliability is the primary moat in identity infrastructure.
    claimRefs:
      - CP010
      - CP012
