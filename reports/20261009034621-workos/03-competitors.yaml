  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Solution
      - Pricing model
      - Free tier allowance
      - Enterprise SSO entry price
      - Hidden fees or overage costs
      - Economic implication for SaaS buyers
    rows:
      - - WorkOS
        - Hybrid freemium MAU plus per-connection SSO/SCIM fee
        - Up to 1 million monthly active users free on AuthKit
        - $125 per connection per month for first 15 connections
        - $2,500/M MAU overage, $99/M audit logs, $99/mo custom domain
        - Cost-free startup launch; steep linear cost growth as enterprise customer base scales
      - - Auth0 / Okta
        - User-based tiered subscription with enterprise add-ons
        - Limited free tier (up to 7,500 active users)
        - Starts at $35/mo baseline; enterprise SSO gated to custom tiers
        - Overage user charges, add-on costs for advanced enterprise features
        - Expensive minimum annual commitments for growing B2B SaaS software companies
      - - Microsoft Entra
        - Per-user monthly licensing bundled with Microsoft cloud
        - Free tier up to 50,000 MAUs on external identities
        - $0.00325 per active user above free tier for P1 features
        - Premium governance and conditional access require P2 step-up
        - Highly cost-effective for Microsoft-centric organizations; poor standalone ergonomics
      - - AWS Cognito
        - Usage-based per-MAU cloud billing
        - Up to 50,000 monthly active users free
        - $0.0055 per MAU for standard users; SAML priced per sign-in
        - Data transfer and supplementary AWS cloud service charges
        - Negligible upfront cost, but heavy in-house engineering and maintenance overhead
      - - Toolradar-tracked peers
        - Fixed monthly software subscription or per-seat fee
        - 2 of 5 direct alternatives tracked offer free plans
        - Commercial peers range from $3 to $6 per user per month
        - Implementation consulting fees and annual contract lock-in
        - Fragmented packaging models forcing buyers to compare per-user vs per-connection math
      - - Keycloak (Self-hosted)
        - Open-source software license (Apache 2.0)
        - Entire software platform is completely free to download
        - $0 software license fees regardless of connection count
        - Cloud server hosting, storage, DevOps staffing, and maintenance
        - Zero vendor software license cost, but substantial operational staffing investment
    notes: >-
      Pricing reflects official vendor documentation, Toolradar benchmarks, and SaaSTrueCost buyer analyses compiled in 2026.
