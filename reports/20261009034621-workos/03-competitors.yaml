    rows:
      - - SAML 2.0 & OIDC Enterprise SSO
        - Native drop-in universal API with self-service Admin Portal
        - Comprehensive protocol suite with deep custom identity rules
        - Native Azure SAML/OIDC federation with enterprise directory ties
        - Basic SAML/OIDC support requiring manual AWS console setup
        - Supported via modern API and dashboard configurations
        - AI-assisted configuration with opinionated B2B SaaS defaults
        - Full open-source protocol compliance via self-hosted server
      - - SCIM 2.0 Directory Sync
        - Normalized real-time webhooks across major HRIS and IdPs
        - Deep enterprise provisioning engine across hundreds of SaaS apps
        - Built-in Microsoft Graph provisioning and Azure AD sync
        - Minimal native SCIM support; requires custom Lambda adapters
        - Emerging enterprise directory sync capabilities
        - Automated attribute mapping with intelligent B2B defaults
        - User federation and LDAP/SCIM integration via plugins
      - - Developer Experience & SDKs
        - Modern language-specific SDKs and comprehensive documentation
        - Extensive SDK library but steep architectural complexity
        - Enterprise-focused documentation; complex developer workflows
        - Fragmented documentation requiring AWS IAM domain expertise
        - Best-in-class React/Next.js frontend UI components
        - Streamlined developer APIs designed for rapid onboarding
        - Java-centric configuration with steep administrative learning curve
      - - Self-Service Admin Portal
        - Fully hosted embeddable Admin Portal for customer IT admins
        - Admin consoles available but typically managed by internal IT
        - Azure portal management requiring enterprise tenant access
        - No turnkey embeddable customer-facing setup portal
        - Modern hosted customer account management portals
        - Built-in customer self-onboarding portal for enterprise admins
        - Requires building custom admin portal interfaces in-house
      - - Outage & Reliability Track Record
        - Major 2.1-hour database connection pool outage on July 16, 2026
        - High enterprise SLA backed by global geographic redundancy
        - Backed by hyperscale Microsoft Azure global infrastructure
        - Resilient AWS cloud infrastructure with regional failover
        - Cloud-managed availability across modern edge infrastructure
        - Emerging platform track record with limited historical disclosures
        - Reliability entirely dependent on customer infrastructure operations
    notes: >-
      Matrix evaluates core capabilities required by enterprise software buyers based on published product documentation and incident disclosures as of 2026.
