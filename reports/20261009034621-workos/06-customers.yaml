  - calloutType: risk
    title: Commercial Friction from Per-Connection Pricing and Incumbent Squeeze
    body: >
      Independent market assessments and candidate reviews highlight that WorkOS's per-connection pricing model imposes substantial cost hurdles for SaaS vendors attempting to offer SSO on low-tier subscription plans. As incumbents like Okta and hyperscalers expand native developer tooling, WorkOS faces margin pressure and procurement resistance in long-term enterprise contract renewals.
    claimRefs:
      - CU004
      - CU014
      - CU015
