figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: End-to-end lifecycle stages of WorkOS customer engagement from developer discovery to enterprise multi-product expansion.
    data:
      items:
        - label: Developer Discovery & Evaluation
          stage: Discovery & Evaluation
          persona: Lead Software Engineer
          goal: Identify prebuilt enterprise auth APIs to clear upcoming deal blocker
          touchpoints:
            - WorkOS documentation and SDK quickstarts
            - Self-serve developer sandbox registration
            - Community Slack support channels
          friction: Evaluating per-connection pricing impact on unit economics
        - label: Sandbox Prototyping & AuthKit Setup
          stage: Prototyping & AuthKit Setup
          persona: Frontend & Product Engineer
          goal: Scaffold hosted authentication UI and integrate initial user sessions
          touchpoints:
            - Radix-based AuthKit components
            - Localhost redirect URIs and test credentials
            - WorkOS Node and Python SDK libraries
          friction: Coordinating frontend auth state with legacy backend sessions
        - label: Implementation & Production Launch
          stage: Production Implementation
          persona: Product Engineer
          goal: Integrate SAML SSO and SCIM Directory Sync into production SaaS
          touchpoints:
            - Unified REST and GraphQL API endpoints
            - AuthKit UI component customization
            - WorkOS hosted Admin Portal configuration
          friction: Navigating IdP XML assertion quirks and certificate rotations
        - label: Enterprise IT Onboarding & Directory Sync
          stage: Enterprise IT Onboarding
          persona: Customer Enterprise IT Administrator
          goal: Connect corporate Okta or Microsoft Entra ID directory seamlessly
          touchpoints:
            - Self-serve WorkOS Admin Portal link
            - Automated SCIM employee lifecycle webhook provisioning
            - Real-time directory sync status monitoring
          friction: Corporate security review of centralized US control-plane routing
        - label: Multi-Tenant Enterprise Expansion
          stage: Enterprise Expansion
          persona: Enterprise Engineering Lead
          goal: Roll out SAML and SCIM across multi-tenant enterprise customer tiers
          touchpoints:
            - Dedicated customer success and technical support
            - Enterprise organization management APIs
            - Automated audit logging and compliance reporting
          friction: Margin pressure from cumulative per-connection subscription charges
        - label: Account Expansion & Governance Standardization
          stage: Governance Standardization
          persona: VP Engineering & Finance Buyer
          goal: Standardize identity, audit logging, and agent auth across portfolio
          touchpoints:
            - Dedicated Account Manager business reviews
            - Audit Logs export and SIEM integration
            - Agent Auth and multi-team SKU licensing
          friction: Annual contract renewal negotiations over scaling connection costs
    approximationNotes: Journey stages and touchpoints synthesized from WorkOS technical documentation, account management job specifications, and customer case studies.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU010
      - CU011
      - CU013
callouts:
  - calloutType: strength
    title: Marquee AI Ecosystem Adoption and High-Velocity Customer Pull
    body: >
      WorkOS has captured an exceptional concentration of flagship AI and developer tooling customers, including OpenAI, Cursor, and Perplexity. Securing these category-defining platforms validates the developer experience of WorkOS's APIs and establishes a formidable competitive moat against legacy CIAM incumbents among modern engineering teams.
