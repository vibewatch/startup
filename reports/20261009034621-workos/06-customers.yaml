  title: Customers
  summary: WorkOS anchors its commercial adoption on high-velocity B2B SaaS builders and leading AI-native application platforms, citing marquee production deployments across OpenAI, Cursor, Perplexity, Vercel, and Stripe. While the platform demonstrates powerful initial deal velocity and developer-led conversion by abstracting complex SAML and SCIM protocols, long-term expansion faces friction from per-connection pricing overhead on lower-ACV tiers, broad incumbent IAM inertia, and platform-level availability dependencies during synchronous authentication flows.
sections:
  - id: customer-segmentation-and-buyer-dynamics
    title: Customer Base Segmentation and Buyer Economics
    body: >
      WorkOS segments its customer base primarily across developer-led B2B SaaS startups, high-growth AI-native applications, and mid-market software vendors seeking rapid upmarket enterprise readiness. In typical customer procurement workflows, the technical buyer is an engineering manager, tech lead, or product manager who faces immediate enterprise procurement blockers—specifically corporate IT demands for single sign-on (SSO) and automated employee directory provisioning (SCIM). By integrating WorkOS's unified APIs, engineering teams eliminate multi-month internal development backlogs and avoid building custom identity provider (IdP) connectors from scratch.


      However, payer dynamics diverge as software vendors expand. Commercial contracts transition from self-serve developer tiers to sales-assisted enterprise contracts overseen by finance and executive leadership. WorkOS structures its commercial expansion around dedicated account management and executive business reviews, tracking net revenue retention and multi-product adoption across AuthKit, Directory Sync, and Audit Logs. At the same time, market evaluations and peer comparisons note that per-connection pricing structures create margin pressure for SaaS vendors deploying SSO to low-ACV customer accounts, prompting cost sensitivity and competitive evaluations against full IAM suites like Okta or specialized alternatives as connection volumes scale.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-deployment-proof
    title: Adoption Trajectory, Enterprise Deployments, and Reference Quality
    body: >
      WorkOS's adoption trajectory reflects substantial expansion among modern software platforms, growing from early traction of over 200 paying customers in mid-2022 to powering identity plumbing for prominent AI and SaaS enterprises by 2026. Public customer evidence highlights mission-critical deployments across high-volume AI tooling and developer platforms including OpenAI, Cursor, Perplexity, Sierra, Plaid, Vercel, Stripe, Scale, and Airtable. For fast-growing AI-native products, rapid integration timelines—such as Cursor migrating fully from Auth0 to WorkOS for faster logins and transparent pricing—demonstrate strong initial product-market fit and operational acceleration.


      Reference quality remains heavily anchored in technical outcomes: software vendors consistently report compressing SSO onboarding timelines from multiple months of custom development to days, while delegating complex identity administration to WorkOS's self-serve Admin Portal. Beyond external customer applications, WorkOS validates internal platform adoption paradigms through initiatives like Atlas and the WOW CLI, demonstrating how developer-first scaffolding enables non-technical personnel to ship and manage internal tools securely under unified SSO and Doppler secret management. Nonetheless, comprehensive public disclosures regarding aggregate paying customer counts, logo churn, and contract ACV distributions remain closely held, necessitating direct commercial diligence.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU002
      - TU003
  - id: retention-durability-and-expansion-friction
    title: Retention Durability, Expansion Dynamics, and Concentration Vulnerabilities
    body: >
      Customer retention and durability for WorkOS derive directly from deep infrastructure entanglement: once an enterprise SaaS vendor integrates WorkOS to manage authentication tokens, directory synchronization webhooks, and audit logging for corporate accounts, switching identity providers incurs significant engineering migration costs, risks user login disruption, and requires coordinating certificate and metadata updates across hundreds of enterprise IT departments. This architectural lock-in fosters resilient gross retention across core enterprise accounts.


      Conversely, expansion durability faces critical headwinds from pricing model alignment, incumbent ecosystem boundaries, and platform reliability risks. Industry commentary highlights that WorkOS's per-connection pricing can become a financial burden for SaaS vendors whose end-customers require SSO on entry-level tiers, incentivizing customers to build in-house connectors or evaluate alternative CIAM vendors. Furthermore, because WorkOS sits directly on the synchronous authentication runtime path, system outages—such as the July 16, 2026 service disruption where SSO error rates reached 85%—cascade directly into end-user login failures for downstream customers. These availability events, coupled with emerging native agent-identity capabilities from platform giants like Microsoft and Anthropic, challenge WorkOS's pricing power and expansion velocity in the enterprise market.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
