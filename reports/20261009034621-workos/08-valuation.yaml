callouts:
  - calloutType: "recommendation"
    title: "Prudent Entry Discipline Required at $2.0B Valuation"
    body: "WorkOS represents premier infrastructure in developer-centric authentication, demonstrated by its presence across industry-defining AI applications. However, underwriting a $2.0 billion valuation in the absence of verified financial disclosures introduces excessive multiple risk. Investors should maintain a research-more stance until private diligence validates revenue retention, unit gross margins, and liquidation preference structures."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV007"
      - "CV014"
  - calloutType: "risk"
    title: "Operational Blast Radius of Centralized Auth Infrastructure"
    body: "The July 16, 2026 service disruption highlights that identity providers serve as single points of failure for digital businesses. A database connection pool deadlock in AuthKit Analytics caused peak error rates of 85% on SSO and 73% on interactive login over a two-hour window. Enterprise buyers demand ironclad reliability, making operational resilience a critical valuation variable."
    claimRefs:
      - "CV010"
      - "CV015"
