company:
  name: "WorkOS"
chapter:
  number: 7
  title: "Risks"
  summary: "The strongest evidenced risk is operational concentration in a synchronous authentication service: WorkOS disclosed a roughly 130-minute July 2026 disruption with severe peak error rates and a shared-resource failure mode. Contractual limits, connection-based cost growth, third-party workflow dependencies, and sparse public financial and concentration data leave material residual exposure despite documented remediation."
sections:
  - id: "ranked-risk-assessment"
    title: "Ranked Operational and Security Exposure"
    body: "Availability is the highest-severity evidenced risk because WorkOS sits in authentication paths where a platform failure can prevent downstream users from signing in. WorkOS reported that its July 16, 2026 incident affected User Management, AuthKit, and SSO from approximately 08:00 to 10:10 UTC; peak errors and timeouts reached about 85% for SSO login, 73% for AuthKit interactive login, and 74% for token exchange and session refresh. The disclosed root cause was not database failure itself but a transaction-library defect combined with insufficient workload isolation: lower-priority analytics work waited for a second connection while retaining the first. WorkOS also described client retries and queued traffic as sustaining the exhausted-pool state. The company reported a same-day containment and a permanent same-connection fix, but the effectiveness of broader isolation, overload protection, and failure testing is not independently verified. A recurrence affecting critical authentication paths, missed remediation milestones, or repeated severe incidents should be treated as a thesis-break signal."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "contractual-and-regulatory-exposure"
    title: "Contractual, Data, and Regulatory Exposure"
    body: "WorkOS's published terms allocate meaningful downside to subscribers. Fees may change at WorkOS's discretion for monthly renewals after website notice, the service is offered as-is without a promise of uninterrupted or error-free operation, and aggregate damages are capped at six months of subscription fees or $100 for a subscriber with no payment obligation. Separate workflow providers must be licensed directly, while WorkOS disclaims responsibility for compatibility problems caused by those third-party workflows. The WorkOS-bot supplemental terms create a narrower product-specific data-governance issue because they state that the general Data Processing Addendum does not apply to that service. These provisions do not establish that customers always accept the standard terms; negotiated enterprise orders may differ. The assigned evidence includes no regulator filing, court record, enforcement action, patent dispute, or independently audited control report, so absence of such evidence cannot be read as absence of legal, privacy, or security exposure. Investment diligence should obtain executed enterprise agreements, DPA terms, subprocessor lists, insurance limits, and any dispute or regulatory correspondence."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR010"
    tableRefs:
      - "TR001"
  - id: "dependency-financial-and-execution-risk"
    title: "Dependency, Financial-Model, and Execution Risk"
    body: "The commercial model creates two linked dependencies. First, WorkOS connects applications to a fragmented identity-provider landscape, so customers depend on WorkOS's integrations as well as the external providers and workflows behind them. Second, independent procurement commentary reports SSO and Directory Sync pricing that starts at $125 per connection per month at low volumes, with additional module charges; a competitor argues that connection-based pricing and API integration can make budgets harder to predict and switching costly. The competitor evidence is directional rather than an independent benchmark, so it supports a diligence hypothesis rather than a verified cost conclusion. Public operating evidence is also thin: EquityZen gates current valuation, cap-table, funding-history, revenue, and financial detail behind membership and accreditation verification. No source in the assigned pool establishes current revenue, margins, burn, runway, customer concentration, or cloud-provider concentration. The investment case should therefore remain conditional on private financial statements, cohort-level pricing economics, dependency maps, incident/SLA-credit history, and concentration disclosures."
    claimRefs:
      - "CR004"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
