      - number: '7.2'
        title: Contractual, Data, and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              WorkOS's published terms allocate meaningful downside to subscribers. Fees may change at WorkOS's
              discretion for monthly renewals after website notice, the service is offered as-is without a promise of
              uninterrupted or error-free operation, and aggregate damages are capped at six months of subscription fees
              or $100 for a subscriber with no payment obligation. Separate workflow providers must be licensed
              directly, while WorkOS disclaims responsibility for compatibility problems caused by those third-party
              workflows. The WorkOS-bot supplemental terms create a narrower product-specific data-governance issue
              because they state that the general Data Processing Addendum does not apply to that service. These
              provisions do not establish that customers always accept the standard terms; negotiated enterprise orders
              may differ. The assigned evidence includes no regulator filing, court record, enforcement action, patent
              dispute, or independently audited control report, so absence of such evidence cannot be read as absence of
              legal, privacy, or security exposure. Investment diligence should obtain executed enterprise agreements,
              DPA terms, subprocessor lists, insurance limits, and any dispute or regulatory correspondence.
            claimRefs:
              - CR001
              - CR002
