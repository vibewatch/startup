      - number: '7.3'
        title: Dependency, Financial-Model, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The commercial model creates two linked dependencies. First, WorkOS connects applications to a fragmented
              identity-provider landscape, so customers depend on WorkOS's integrations as well as the external
              providers and workflows behind them. Second, independent procurement commentary reports SSO and Directory
              Sync pricing that starts at $125 per connection per month at low volumes, with additional module charges;
              a competitor argues that connection-based pricing and API integration can make budgets harder to predict
              and switching costly. The competitor evidence is directional rather than an independent benchmark, so it
              supports a diligence hypothesis rather than a verified cost conclusion. Public operating evidence is also
              thin: EquityZen gates current valuation, cap-table, funding-history, revenue, and financial detail behind
              membership and accreditation verification. No source in the assigned pool establishes current revenue,
              margins, burn, runway, customer concentration, or cloud-provider concentration. The investment case should
              therefore remain conditional on private financial statements, cohort-level pricing economics, dependency
              maps, incident/SLA-credit history, and concentration disclosures.
            claimRefs:
              - CR004
              - CR013
              - CR014
              - CR015
              - CR016
