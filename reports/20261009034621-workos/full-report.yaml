  - id: FE001
    title: WorkOS Enterprise Identity Platform Architecture Stack
    type: stack
    summary: Multi-tier architectural overview of WorkOS developer infrastructure from identity protocols to data persistence.
    data:
      layers:
        - label: Presentation & Developer SDKs
          detail: Hosted client interfaces, developer SDKs, and IT administrator self-service configuration portals.
          modules:
            - AuthKit UI Components (Radix UI)
            - Language-Specific SDKs (Node, Python, Go, Ruby)
            - Hosted Admin Portal for Enterprise IT
        - label: Core Identity & Enterprise Primitives
          detail: >-
            Protocol normalization engines for enterprise single sign-on, employee directory sync, and compliance
            logging.
          modules:
            - Enterprise SSO Engine (SAML 2.0 / OIDC)
            - Directory Sync Engine (SCIM 2.0 / HRIS)
            - Audit Logs Service (Append-Only Event Store)
            - Session Management & MFA Service
        - label: Shared Platform Subsystems
          detail: Common backend event infrastructure, queuing primitives, and traffic overload safeguards across products.
          modules:
            - Outbox-Pattern Queues & Transactional Outbox
            - Event Distribution Pipeline (Webhooks)
            - Rate Limiting & Overload Protection
        - label: Cloud Persistence & Foundation Infrastructure
          detail: Multi-tenant relational data stores, asynchronous buffer streams, and declarative cloud resources on AWS.
          modules:
            - Relational Database (PostgreSQL Multi-Tenant Pools)
            - Streaming & Queue Buffers (AWS SQS & Kinesis)
            - Terraform Cloud Infrastructure on AWS
        - label: External Identity Providers & Customer Directories
          detail: >-
            Upstream third-party corporate directories and identity providers integrated via standard enterprise
            protocols.
          modules:
            - Okta, Microsoft Entra ID, Google Workspace IdPs
            - Workday, BambooHR, Rippling Directory Services
        - label: Downstream B2B SaaS Application Workflows
          detail: Customer SaaS applications consuming WorkOS tokens, webhooks, and identity assertions in runtime workflows.
          modules:
            - Enterprise B2B SaaS Application Backends
            - Customer Audit Log Ingestion & SIEM Export Pipes
    approximationNotes: >-
      Layered representation synthesized from verified technical disclosures, platform engineering specifications, and
      post-mortem diagrams.
