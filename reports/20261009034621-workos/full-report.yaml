      - number: '3.2'
        title: Architecture, Protocol Support, and Operational Reliability
        blocks:
          - type: paragraph
            body: >-
              Comparing WorkOS against alternative identity solutions reveals sharp architectural and operational
              tradeoffs across protocol completeness, developer abstraction, and infrastructure resilience. WorkOS
              provides a unified abstraction across SAML, OIDC, and SCIM 2.0 directory synchronization, paired with an
              Admin Portal that offloads identity provider setup directly to enterprise IT administrators. This
              architecture reduces development time from months to days for SaaS engineering teams seeking enterprise
              readiness. In contrast, specialized challengers like SSOJet focus on opinionated B2B configurations with
              automated attribute mapping, while incumbent suites like Okta/Auth0 offer deeper protocol edge-case
              support but demand higher administrative configuration toil. However, relying on a multi-tenant managed
              identity gateway introduces critical availability and latency dependencies. On July 16, 2026, WorkOS
              suffered a major multi-hour service disruption between 08:00 and 10:10 UTC, where a surge in concurrent
              session creation caused database connection pool exhaustion, leading to elevated latency, timeouts, and
              HTTP 5xx failures across the User Management API, AuthKit, and SSO sign-in flows. Because authentication
              sits directly in the critical login path of every downstream customer application, such infrastructure
              incidents directly impair customer revenue operations and highlight the operational risks of single-vendor
              identity centralization.
            claimRefs:
              - CP005
              - CP008
              - CP010
              - CP011
              - CP012
