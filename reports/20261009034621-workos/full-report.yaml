      - number: '6.3'
        title: Retention Durability, Expansion Dynamics, and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >
              Customer retention and durability for WorkOS derive directly from deep infrastructure entanglement: once
              an enterprise SaaS vendor integrates WorkOS to manage authentication tokens, directory synchronization
              webhooks, and audit logging for corporate accounts, switching identity providers incurs significant
              engineering migration costs, risks user login disruption, and requires coordinating certificate and
              metadata updates across hundreds of enterprise IT departments. This architectural lock-in fosters
              resilient gross retention across core enterprise accounts.


              Conversely, expansion durability faces critical headwinds from pricing model alignment, incumbent
              ecosystem boundaries, and platform reliability risks. Industry commentary highlights that WorkOS's
              per-connection pricing can become a financial burden for SaaS vendors whose end-customers require SSO on
              entry-level tiers, incentivizing customers to build in-house connectors or evaluate alternative CIAM
              vendors. Furthermore, because WorkOS sits directly on the synchronous authentication runtime path, system
              outages—such as the July 16, 2026 service disruption where SSO error rates reached 85%—cascade directly
              into end-user login failures for downstream customers. These availability events, coupled with emerging
              native agent-identity capabilities from platform giants like Microsoft and Anthropic, challenge WorkOS's
              pricing power and expansion velocity in the enterprise market.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
