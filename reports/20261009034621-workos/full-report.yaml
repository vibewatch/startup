      - number: '5.2'
        title: Cloud Architecture, Shared Primitives, and Engineering Operating Stack
        blocks:
          - type: paragraph
            body: >
              Under the hood, WorkOS operates a distributed multi-tenant platform hosted primarily on Amazon Web
              Services (AWS) using TypeScript and Node.js runtimes, backed by PostgreSQL relational databases,
              Terraform-managed infrastructure, and message-queuing mechanisms including SQS and Kinesis. The platform
              engineering team builds standardized internal capabilities—including outbox-pattern transactional message
              queues, event streaming pipelines, outbound webhook distribution systems, and transactional email
              delivery—allowing modular product services to scale without duplicating mission-critical primitives.


              A foundational engineering challenge within WorkOS is normalizing unpredictable upstream directory and
              identity provider behaviors into idempotent, replay-safe downstream operations. Because external SCIM
              clients frequently emit partial updates, retry upon transient network timeouts, and deliver updates out of
              sequence, WorkOS handlers enforce strict idempotency and eventual consistency. Similarly, the audit
              logging pipeline separates high-throughput, cheap ordered-append write paths from indexed, paginated read
              paths to maintain fast query retention windows without degrading event ingestion performance. Furthermore,
              internal platform initiatives prioritize reproducible development loops and agentic continuous integration
              pipelines to accelerate build and deployment feedback across services.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
