chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Foundation
        blocks:
          - type: paragraph
            body: >-
              WorkOS was founded in 2019 by Chief Executive Officer Michael Grinich following his earlier tenure at
              Nylas. While developer teams traditionally spent months building custom integrations for fragmented
              enterprise identity providers such as Okta, Microsoft Entra ID (Azure AD), Ping Identity, and Active
              Directory Federation Services, WorkOS introduced normalized RESTful APIs and modern language SDKs that
              abstract these protocols into turn-key building blocks. The corporate entity is headquartered in San
              Francisco, California, and maintains a distributed workforce spanning San Francisco, New York, and remote
              locations. The company acquired Dublin-based UI framework creator Modulz in 2022 to absorb the core
              engineering team behind Radix, subsequently launching AuthKit to pair back-end identity APIs with
              customizable front-end authentication components.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
