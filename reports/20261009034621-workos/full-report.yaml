  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Financing Context
        blocks:
          - type: paragraph
            body: >-
              WorkOS represents a critical infrastructure layer in enterprise identity and developer tooling,
              functioning as an enterprise-readiness suite that unifies single sign-on (SSO), Directory Sync (SCIM),
              user management, and agentic authentication for modern software vendors. The primary investment thesis
              rests on structural tailwinds in B2B SaaS and AI native applications, where developer velocity demands
              turnkey enterprise compliance rather than multi-quarter in-house engineering efforts. Over 1,000 paying
              organizations, including rapid-scale AI software providers like Anthropic, OpenAI, Cursor, Perplexity,
              Replit, and Vercel, have integrated WorkOS into their core production architectures. In March 2026, WorkOS
              finalized a $100 million Series C financing round co-led by Meritech Capital Partners and Sapphire
              Ventures, lifting cumulative private equity funding to at least $198 million and establishing a post-money
              valuation mark of $2.0 billion. This step represents a substantial uplift from its June 2022 Series B
              valuation of $525 million, reflecting strong institutional conviction in its developer-first distribution
              and expanding product footprint across AuthKit and agentic security integrations.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
      - number: '8.2'
        title: Valuation Discipline, Multiple Stance, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Despite exceptional customer caliber and platform efficiency, public evidence does not supply the
              operating transparency necessary to validate the $2.0 billion headline valuation. External benchmarks and
              secondary tracker data record annualized recurring revenue of $30 million as of October 2025 across
              approximately 95 employees, alongside broad company assertions referencing $100 million in cumulative or
              gross volume milestones. At a $2.0 billion enterprise value, a $30 million to $100 million revenue base
              implies an enterprise-value-to-revenue multiple between 20x and 66x, placing WorkOS at the extreme upper
              decile of private developer infrastructure comparables. The core anti-thesis highlights this valuation
              overhang: absence of verified net revenue retention (NRR), gross retention, customer acquisition cost
              efficiency, and gross margin details creates material downside vulnerability if growth decelerates.
              Furthermore, critical operational dependencies surfaced during the July 16, 2026 service disruption, where
              connection pool starvation degraded SSO and AuthKit authentication for over two hours, demonstrating that
              core identity infrastructure carries severe operational and contractual SLA exposure.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
