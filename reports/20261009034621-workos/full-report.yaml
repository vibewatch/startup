      - number: '1.4'
        title: Operational Scale and Reliability Track Record
        blocks:
          - type: paragraph
            body: >-
              The platform's commercial adoption expanded rapidly alongside the generative artificial intelligence boom,
              counting high-growth technology companies such as OpenAI, Anthropic, xAI, Perplexity, Cursor, Vercel,
              Stripe, and Airtable among its customer base. Independent private software trackers report that WorkOS
              reached $30 million in annual recurring revenue as of late 2025, up from $20 million reported five months
              prior, though management has demurred on releasing audited operating financials, cash burn, or gross
              margins. Platform reliability is critical given its position in the core authentication path of client
              applications. On July 16, 2026, WorkOS suffered a major service disruption lasting over two hours caused
              by latent ORM database connection starvation during an AuthKit Analytics logging wave, leading to peak
              login error rates of ~85% on SSO and ~73% on AuthKit before engineers disabled analytics writes to restore
              availability.
