      - number: '5.3'
        title: Data Residency Trade-Offs and Cross-Border Control Planes
        blocks:
          - type: paragraph
            body: >
              As data sovereignty regulations and regional compliance mandates intensify globally, WorkOS advocates an
              architectural paradigm known as selective data residency. Under this design pattern, SaaS applications
              bifurcate their data topologies into high-volume, sensitive customer content planes—such as application
              databases, uploaded files, generative AI prompts, and model inference results—which remain strictly pinned
              in-region (such as within European Union data centers), and centralized control planes that manage
              authentication, session validation, and billing metadata globally.


              WorkOS documents this selective residency model in modern enterprise architectures, highlighting how
              leading platforms like Slack, Airtable, and OpenAI maintain customer content within regional boundaries
              while routing low-volume login requests and session tokens through centralized United States
              infrastructure. From an engineering perspective, this split prevents SaaS vendors from bearing the
              operational overhead of running completely isolated, multi-region database replicas and synchronized
              identity directory stacks across every jurisdiction. However, this approach exposes an inherent
              architectural limitation: highly regulated institutions, government defense contractors, and sovereign
              entities operating under strict post-Schrems II GDPR enforcement consider cross-border authentication
              routing an unacceptable compliance risk, restricting WorkOS's addressable deployment footprint in
              zero-trust sovereign enclaves.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
