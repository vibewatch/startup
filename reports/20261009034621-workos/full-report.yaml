      - number: '6.2'
        title: Adoption Trajectory, Enterprise Deployments, and Reference Quality
        blocks:
          - type: paragraph
            body: >
              WorkOS's adoption trajectory reflects substantial expansion among modern software platforms, growing from
              early traction of over 200 paying customers in mid-2022 to powering identity plumbing for prominent AI and
              SaaS enterprises by 2026. Public customer evidence highlights mission-critical deployments across
              high-volume AI tooling and developer platforms including OpenAI, Cursor, Perplexity, Sierra, Plaid,
              Vercel, Stripe, Scale, and Airtable. For fast-growing AI-native products, rapid integration timelines—such
              as Cursor migrating fully from Auth0 to WorkOS for faster logins and transparent pricing—demonstrate
              strong initial product-market fit and operational acceleration.


              Reference quality remains heavily anchored in technical outcomes: software vendors consistently report
              compressing SSO onboarding timelines from multiple months of custom development to days, while delegating
              complex identity administration to WorkOS's self-serve Admin Portal. Beyond external customer
              applications, WorkOS validates internal platform adoption paradigms through initiatives like Atlas and the
              WOW CLI, demonstrating how developer-first scaffolding enables non-technical personnel to ship and manage
              internal tools securely under unified SSO and Doppler secret management. Nonetheless, comprehensive public
              disclosures regarding aggregate paying customer counts, logo churn, and contract ACV distributions remain
              closely held, necessitating direct commercial diligence.
