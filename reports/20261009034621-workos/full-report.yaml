  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Operational and Security Exposure
        blocks:
          - type: paragraph
            body: >-
              Availability is the highest-severity evidenced risk because WorkOS sits in authentication paths where a
              platform failure can prevent downstream users from signing in. WorkOS reported that its July 16, 2026
              incident affected User Management, AuthKit, and SSO from approximately 08:00 to 10:10 UTC; peak errors and
              timeouts reached about 85% for SSO login, 73% for AuthKit interactive login, and 74% for token exchange
              and session refresh. The disclosed root cause was not database failure itself but a transaction-library
              defect combined with insufficient workload isolation: lower-priority analytics work waited for a second
              connection while retaining the first. WorkOS also described client retries and queued traffic as
              sustaining the exhausted-pool state. The company reported a same-day containment and a permanent
              same-connection fix, but the effectiveness of broader isolation, overload protection, and failure testing
              is not independently verified. A recurrence affecting critical authentication paths, missed remediation
              milestones, or repeated severe incidents should be treated as a thesis-break signal.
            claimRefs:
