  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              WorkOS defines its market category around enterprise-ready developer infrastructure, modularizing complex
              B2B compliance and identity capabilities into standardized APIs and hosted interfaces. The core product
              perimeter encompasses Enterprise Single Sign-On (SSO via SAML and OIDC protocols), Directory Sync (SCIM
              and HRIS provisioning), self-service Admin Portals for IT administrators, standardized Audit Logs for
              compliance frameworks like SOC 2, and fine-grained authorization. This scope deliberately separates WorkOS
              from general workforce identity providers like Okta and Microsoft Entra ID or consumer-focused identity
              tools. Instead of managing internal employee access policies across corporate devices, WorkOS enables
              multi-tenant SaaS developers to serve enterprise IT organizations seamlessly. The status-quo substitutes
              for WorkOS consist primarily of internal DIY software development—where software engineering teams spend
              months building and maintaining fragile custom SAML integrations and directory connectors—or complex
              configuration of legacy identity middleware. WorkOS abstracts these identity protocol variations behind
              normalized endpoints, transforming a months-long compliance blocker into a streamlined integration
              completed in days.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
