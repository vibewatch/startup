        title: Exhibits
        blocks:
          - type: callout
            title: Prudent Entry Discipline Required at $2.0B Valuation
            body: >-
              WorkOS represents premier infrastructure in developer-centric authentication, demonstrated by its presence
              across industry-defining AI applications. However, underwriting a $2.0 billion valuation in the absence of
              verified financial disclosures introduces excessive multiple risk. Investors should maintain a
              research-more stance until private diligence validates revenue retention, unit gross margins, and
              liquidation preference structures.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
