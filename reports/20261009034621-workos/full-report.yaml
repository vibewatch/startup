      - number: '3.3'
        title: Pricing Economics, Customer Friction, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              WorkOS employs a hybrid monetization strategy combining an aggressive freemium user layer with steep
              per-connection enterprise charges. Its AuthKit product provides user management free for up to 1 million
              monthly active users, allowing B2B SaaS startups to embed WorkOS early without upfront capital
              commitments. Monetization activates when applications sell to enterprise buyers requiring corporate single
              sign-on or SCIM directory sync, where WorkOS charges list pricing of $125 per connection per month for the
              first tier of connections (1 to 15 connections), discounting to $100 per connection for tiers 16 to 30,
              and $80 for connections 31 to 50. Independent contract tracking from SpendHound reveals that actual
              average SMB annual spend on WorkOS sits around $5,253 per year, but SMB spend contracted by 20.2%
              year-over-year as corporate finance teams pushed back on recurring connection costs and scrutinized
              per-user software return on investment. Furthermore, buyers face secondary add-ons, including $2,500 per
              month per additional 1 million active users after the free allowance, $99 per million audit log events,
              and $99 per month for custom authentication domains. This pricing structure creates structural friction:
              while high switching costs and mission-critical directory integrations protect WorkOS from immediate
              displacement in established accounts, high connection prices incentivize high-growth software vendors to
              evaluate multi-homing or migration to self-hosted frameworks like Keycloak once enterprise connection
              volumes become substantial.
            claimRefs:
              - CP006
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Per-Connection Pricing Moat and Vulnerability
            body: >-
              WorkOS's choice to price enterprise SSO per connection ($125/month) rather than per seat aligns pricing
              with B2B SaaS sales success: developers only pay when closing enterprise accounts. However, this pricing
              mechanism creates an economic threshold where fast-scaling SaaS customers face escalating marginal costs,
              driving procurement teams to demand enterprise credits or evaluate alternative architectures.
            calloutType: insight
            claimRefs:
              - CP006
              - CP011
              - CP014
              - CP015
          - type: callout
            title: Single-Point-of-Failure Operational Risk
            body: >-
              Centralizing enterprise authentication into WorkOS creates an existential dependency for SaaS
              applications. The July 16, 2026 database connection pool outage demonstrated that authentication downtime
              halts customer sign-in workflows across all downstream applications, underscoring that reliability is the
              primary moat in identity infrastructure.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
