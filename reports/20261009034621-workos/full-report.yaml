      - number: '8.3'
        title: Scenario Analysis, Exit Pathways, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              To capture potential return outcomes across varied commercial trajectories, we model bull, base, and bear
              scenarios across a 3-to-5 year investment horizon. The bull scenario models rapid enterprise expansion
              where WorkOS successfully monetizes agentic authentication and deep SCIM integration, scaling revenue
              toward $150 million ARR and commanding a 25x multiple ($3.75 billion valuation) via an initial public
              offering or premium strategic acquisition. The base scenario assumes steady organic growth to $80 million
              ARR at an 18x multiple ($1.44 billion valuation), resulting in modest value compression relative to the
              March 2026 post-money baseline and emphasizing the necessity of entry price discipline. The bear scenario
              reflects multiple contraction toward public SaaS medians of 10x ARR on $50 million revenue ($500 million
              valuation), triggered by heightened competition from incumbent identity providers like Okta or major
              customer concentration shifts. Prior to capital deployment, prospective investors must resolve outstanding
              diligence gaps regarding audited financial statements, exact paying customer contract tiers, liquidation
              preference structures, and verified uptime reliability.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
