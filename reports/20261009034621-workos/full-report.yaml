      - - Microsoft Entra
        - Per-user monthly licensing bundled with Microsoft cloud
        - Free tier up to 50,000 MAUs on external identities
        - $0.00325 per active user above free tier for P1 features
        - Premium governance and conditional access require P2 step-up
        - Highly cost-effective for Microsoft-centric organizations; poor standalone ergonomics
      - - AWS Cognito
        - Usage-based per-MAU cloud billing
        - Up to 50,000 monthly active users free
        - $0.0055 per MAU for standard users; SAML priced per sign-in
        - Data transfer and supplementary AWS cloud service charges
