            body: >-
              Operational leadership remains heavily centered on founder and CEO Michael Grinich, who drives core
              product vision, developer evangelism, and financing strategy. Executive leadership also features Developer
              Experience Vice President Zeno Rocha, who joined through the 2022 Modulz acquisition and spearheads
              community-facing developer tools and open-source interface components. Governance disclosures remain
