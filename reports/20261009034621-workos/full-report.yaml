  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Solutions
        blocks:
          - type: paragraph
            body: >-
              The market for enterprise authentication and identity infrastructure spans five distinct categories:
              established incumbent identity suites, developer-first authentication platforms, specialized drop-in SSO
              alternatives, cloud hyperscaler identity services, and internal custom implementations. Auth0, now
              operating within Okta, represents the incumbent leader in customer identity and access management with
              extensive protocol reach and entrenched enterprise procurement relationships. However, Auth0 and Okta
              deployments are frequently characterized by lengthy configuration cycles and complex integration overhead
              compared to drop-in developer APIs. Cloud hyperscalers such as Microsoft Entra External ID leverage
              existing enterprise Office 365 licensing agreements and Azure infrastructure to bundle identity
              capabilities, whereas AWS Cognito provides cost-effective integration across AWS cloud environments at the
              expense of developer ergonomics and turnkey enterprise provisioning. In developer-first identity, WorkOS
              pioneered the developer-first abstraction layer across enterprise federation protocols such as SAML, OIDC,
              and SCIM directory synchronization. Developer-focused challengers including Clerk emphasize
              consumer-facing and product-led authentication workflows, whereas Descope and FusionAuth provide
              workflow-canvas orchestration or self-hosted deployment alternatives. Concurrently, specialized direct
              challengers such as SSOJet have emerged with AI-assisted configuration and opinionated B2B defaults
              designed to accelerate time-to-market. Finally, engineering teams frequently consider internal custom
              builds; yet building in-house SAML, SCIM, and directory connections incurs substantial ongoing maintenance
              burdens and protocol compliance edge cases that exceed the initial development effort.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
