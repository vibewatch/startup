      - number: '2.2'
        title: Addressable Market Sizing and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the enterprise-ready developer platform market requires separating macro identity management spend
              from the specialized B2B SaaS enablement slice. Industry estimates place the broad enterprise identity and
              access management (IAM) sector at roughly $16 billion globally, covering workforce access, governance,
              customer IAM, and privileged access. Within this macro category, the serviceable addressable market (SAM)
              for B2B SaaS enterprise-readiness software is estimated at approximately $1.8 billion. This SAM represents
              the software spend of high-growth B2B SaaS companies and AI application developers needing automated
              enterprise onboarding and compliance. WorkOS's serviceable obtainable market (SOM) is governed by its
              connection-based economic model, which charges $125 per month per active enterprise connection for SSO and
              Directory Sync. At an annualized contract value averaging approximately $20,000 per customer across
              multi-connection deployments, WorkOS's demonstrated market capture reached $30 million in ARR by late 2025
              across more than 1,000 paying customer accounts. This rapid expansion reflects over 100% year-over-year
              revenue velocity, driven by developer adoption in rapidly scaling software platforms.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
