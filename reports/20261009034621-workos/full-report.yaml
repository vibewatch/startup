            body: >-
              Pause investment if another material authentication-path incident demonstrates the same shared-resource or
              retry-amplification pattern, if disclosed isolation and overload protections cannot be evidenced in
              private diligence, or if customer contracts leave downside materially above recoverable SLA and liability
              protection.
