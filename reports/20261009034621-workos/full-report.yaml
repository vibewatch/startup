  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Enterprise Primitives and Modular Product Footprint
        blocks:
          - type: paragraph
            body: >
              WorkOS packages core enterprise readiness capabilities into modular developer APIs and prebuilt front-end
              components. At the foundation of its offering is enterprise Single Sign-On (SSO), which normalizes
              disparate Identity Provider (IdP) protocols—including SAML 2.0 and OpenID Connect (OIDC)—across identity
              systems such as Okta, Microsoft Entra ID (formerly Azure AD), Google Workspace, Ping Identity, and
              OneLogin. Rather than requiring SaaS development teams to custom-build complex protocol parsers, handle
              clock skew, manage certificate rotations, and account for vendor-specific XML assertion quirks, WorkOS
              presents a unified abstraction layer that exposes standardized user identity tokens and tenant bindings.


              Complementing SSO is Directory Sync, which automates enterprise user lifecycle provisioning and
              deprovisioning via SCIM 2.0 (System for Cross-domain Identity Management) and custom webhooks. By
              ingesting employee lifecycle events directly from customer HRIS and corporate directory systems, SaaS
              applications can maintain real-time role assignments and immediately revoke access when employees depart.
              Beyond identity synchronization, WorkOS offers AuthKit, a hosted, customizable authentication user
              interface built on top of Radix primitives, alongside structured Audit Logs designed to provide immutable
              event streams for enterprise compliance audits. As customer platforms scale into high-velocity
              multi-tenant environments, WorkOS positions these modules as an all-in-one suite to satisfy enterprise
              procurement demands without diverting internal engineering bandwidth from core product development.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
