company:
  name: "Open Cosmos"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2015 and based in Harwell, Oxfordshire, Open Cosmos is a European small-satellite infrastructure and data services provider that has raised over $390 million across multiple funding rounds, culminating in a €300 million ($348 million) Series C in September 2026 led by Lightrock. The company couples end-to-end mission design, manufacturing across four European facilities, and sovereign orbital connectivity with shared-constellation Earth observation and AI analytics."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Footprint, and Business Architecture"
    body: "Open Cosmos was founded in 2015 by Chief Executive Officer Rafel Jorda Siquier alongside Aleix Megias Homar, establishing its operational headquarters at the Harwell space cluster in Oxfordshire, United Kingdom. The company was conceived to simplify and democratise access to space infrastructure and orbital data, addressing systemic barriers in mission lead time, capital intensity, and data distribution. Over a decade of execution, Open Cosmos has expanded from launching standalone technology demonstrators for volcano and wildlife tracking into an integrated multinational space enterprise with manufacturing, engineering, and software facilities operating across the UK, Spain, Portugal, and Greece. Across these four locations, the company employs close to 400 personnel, providing sovereign industrial depth rare among venture-backed European space hardware providers. Its commercial architecture is organised around four vertically integrated platforms: OpenOrbit delivers turnkey spacecraft design, assembly, integration, testing, launch brokering, and in-orbit operations; OpenConstellation provides a shared orbital infrastructure model where institutional and commercial partners co-fund and mutually access constellation capacity; ConnectedCosmos offers sovereign broadband and direct-to-device IoT communications; and DataCosmos ingests multi-sensor satellite imagery to deliver AI-driven Earth observation analytics. This integrated structure allows non-traditional space users, including regional governments, emergency responders, and natural resource managers, to access actionable orbital intelligence without deploying proprietary satellite fleets."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance Architecture"
    body: "The leadership architecture of Open Cosmos reflects a blend of technical aerospace engineering roots and seasoned institutional governance. Founder and Chief Executive Officer Rafel Jorda Siquier has led the company since inception, serving as its primary public advocate and strategic architect. Co-founder Aleix Megias Homar contributed to early mission engineering and technical design, establishing the initial hardware foundations before the organisation scaled into mass manufacturing. Executive leadership encompasses functional operational leads spanning commercial revenue, data platforms, and corporate communications across its distributed European hubs. Because technical mission delivery and investor syndication remain heavily concentrated around Jorda Siquier, Open Cosmos exhibits material key-person dependence typical of founder-led aerospace ventures. To institutionalise oversight and meet rigorous sustainability standards required by European public and institutional customers, Open Cosmos implemented formal corporate governance and impact monitoring frameworks. The governance structure explicitly benchmarks operations against the United Nations Sustainable Development Goals and the European Union environmental taxonomy. Internal corporate disclosures indicate that in 2023, 73% of Open Cosmos missions directly aligned with EU taxonomy objectives, with corporate governance tracking environmental metrics, mission safety, and regulatory compliance across its operating subsidiaries in the UK and European Union member states."
    claimRefs:
      - "CO002"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-scale"
    title: "Capitalization Trajectory, Commercial Traction, and Diligence Realities"
    body: "Open Cosmos pursued a disciplined financing strategy through its early lifecycle, raising just $7 million in external capital prior to late 2023 by prioritising organic commercialisation and customer-funded development. In September 2023, the company closed a $50 million Series B round backed by impact investors ETF Partners, Trill Impact, and A&G, supported by corporate and venture participants including Accenture Ventures, Santander InnoEnergy Climate Tech Fund, and Claret Capital Partners. This culminated in September 2026 with a landmark €300 million ($348 million) Series C equity round led by Lightrock, with participation from ETF Partners, Institut Català de Finances, Entrepreneurs First, the UK National Security Strategic Investment Fund, Convex Group, Phoenix Court, and two major international pension funds. The financing vaulted Open Cosmos to a $1 billion unicorn valuation, reflecting surging demand for sovereign European space assets. In commercial press announcements, Open Cosmos reported five consecutive years of profitable growth and over $370 million in cumulative customer contracts signed across a three-and-a-half-year period. However, independent diligence reveals significant information asymmetries: commercial intelligence databases such as LeadIQ estimate baseline annual revenue between only $1 million and $10 million as of mid-2026, while the claimed 100% mission success rate lacks full disclosure of completed versus ongoing orbital missions. Furthermore, reported headcount figures range from 287 on automated tracker databases to close to 400 in official announcements, requiring verified audited financial statements and launch logs to substantiate sovereign manufacturing claims."
