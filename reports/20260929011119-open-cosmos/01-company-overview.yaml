callouts:
  - calloutType: "insight"
    title: "The Sovereign Space Imperative as a Valuation Driver"
    body: "Open Cosmos's valuation trajectory from a $7 million early-stage business to a $1 billion unicorn reflects geopolitical shifts in European aerospace procurement. By operating four distributed manufacturing hubs across the UK, Spain, Portugal, and Greece, and securing backing from the UK National Security Strategic Investment Fund, Open Cosmos positions its shared OpenConstellation and ConnectedCosmos infrastructure as an autonomous European counterweight to non-sovereign commercial satellite mega-constellations."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO013"
      - "CO014"
  - calloutType: "risk"
    title: "Asymmetry Between Claimed Contract Backlog and Verified Operational Revenue"
    body: "While Open Cosmos headlines $370 million in cumulative contracts signed over three and a half years and five consecutive years of profitable growth, private commercial intelligence trackers such as LeadIQ estimate annual revenue at only $1 million to $10 million as of late 2026. Without access to audited financial statements, investors cannot independently determine the timing of contract milestones, cancellation clauses, or gross margin realization across its hardware and data services."
    claimRefs:
      - "CO015"
      - "CO016"
