  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 具备清晰边界的端到端航天基础设施市场
        blocks:
          - type: paragraph
            body: >-
              该细分市场窄于整个太空经济，又宽于单纯的卫星制造。Open Cosmos
              提供覆盖总装、集成与测试、发射协调、在轨运营、数据交付、保险和许可办理的端到端任务服务，并延伸至共享对地观测基础设施、图像处理以及主权宽带与 IoT
              连接。因此，本章测算口径包含交钥匙小卫星任务及配套数据或连接服务的支出，剔除了火箭发射商收入、无关的地理空间软件、通用云基础设施以及大型航天器项目（除非 Open Cosmos
              是签约的任务或服务商）。现有替代方案包括政府自建专属星座、向其他运营商采购影像、地面监测与通信手段，或直接推迟采购计划。
