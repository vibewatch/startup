      - number: '3.3'
        title: 切换成本、锁定机制与大宗化风险
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 各业务的客户留存和护城河强弱不一：专属任务合同能锁定硬件客户，共享数据服务则靠资源互换形成网络效应。交钥匙任务合同的切换成本很高：客户与 Open Cosmos
              签订多年期协议，涵盖卫星设计、元器件集成、总装、测试、发射协调、监管许可和在轨测控。载荷或任务架构一旦集成进 OpenOrbit
              卫星平台，迁往其他平台就要重新设计、重新认证并改造飞控软件，耗时不短。DataCosmos 与 OpenConstellation
              也能借助网络效应增强数据层黏性：加入的机构越多、贡献的卫星资源越丰富，星座重访频次越高，共享池内的单位数据成本也越低。但在标准化光学对地观测与商用 IoT
              追踪领域，产品同质化带来的价格压力仍然突出；其他小卫星运营商和标准化立方星平台都在持续压价。此外，电信业务还面临非对称竞争：巨型星座运营商高度垂直整合，且能受益于补贴支持的低成本发射。尽管 Open Cosmos
              于 2026 年 9 月获得 €300 million 的 C 轮融资以将工厂节拍推升至日产一颗卫星，但若想在日趋大宗化的卫星硬件竞争中守住定价权，必须持续深耕星载边缘 AI 处理与低时延主权星间链路技术。
