        title: 图表
        blocks:
          - type: callout
            title: 合同在手订单与已确认收入的背离
            body: >-
              Open Cosmos 三年半内拿下超 $370 million 合同的宣称数据，凸显出欧洲市场对主权自主航天系统的庞大需求。然而，第三方情报估计其年收入仅在 $1 million 至 $10 million
              之间，折射出航天基础设施合同往往履约周期漫长且按里程碑分期确认收入。投资机构必须重点审查经审计的现金周转周期与合同撤约条款。
            calloutType: insight
