      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 任务成功率宣传掩盖了已知的发射链条失利
            body: >-
              TNW 指出官方宣称的 100% 任务成功率缺乏统计分母，而维基百科与供应商清单均明确记载 DOVER 载荷在 Virgin Orbit
              任务中损毁失利。尽职调查应当将发射失败、在轨调试、服役寿命、异常故障以及客户最终验收综合统筹在同一个任务维度的统计基数中予以调和。
            calloutType: risk
            claimRefs:
