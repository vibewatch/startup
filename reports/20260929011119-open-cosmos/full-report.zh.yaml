  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与战略同业群体
        blocks:
          - type: paragraph
            body: >-
              围绕 Open Cosmos 的竞争格局横跨三个独立的业务板块：交钥匙小卫星制造、共享对地观测（EO）数据基础设施，以及近地轨道（LEO）电信连接。在 LEO 宽带与通信连接领域，Open Cosmos
              正面遭遇资本实力雄厚的巨头，例如 SpaceX 旗下的 Starlink 星座与 Eutelsat 旗下的 OneWeb 卫星群。Starlink 与 OneWeb
              部署了数千或数百颗高通量通信卫星，专为全球消费级与企业级宽带场景优化；Open Cosmos 则将 ConnectedCosmos 定位为服务欧洲主权通信和直连设备 IoT 的平台。2026 年 1 月 22
              日，在获得列支敦士登 Ka-band 频谱许可后，Open Cosmos 借助 Rocket Lab 的 Electron 火箭将首批两颗自有 LEO 电信卫星送入 1,050 km
              圆形轨道，验证了向在轨电信运营的延伸。在对地观测与卫星平台制造板块，Open Cosmos 既与专注商业航天（NewSpace）的硬件厂商及立方星制造商竞争，也面对传统航天主承包商。Open Cosmos
              并未要求政府客户全额投资专属星座，而是推出 OpenConstellation 共享在轨基础设施，由机构合作伙伴共同投入在轨资产、共享数据访问权，从而提高重访频率并将时延压低至 30
              minutes。不过，商业航天数据聚合商与既有的国防采购惯性依然是强劲替代方案，采购方往往持续青睐老牌主权军工承包商或传统地球同步轨道运营商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
