      - number: '6.2'
        title: 商业落地进程、签约体量与标杆案例
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 的商业落地呈现出前端签约额快速扩张与在轨履约交付节点不透明并存的鲜明对比。2023 年初至 2026 年 9 月间，公司累计签订逾 $370 million 客户合同；其中 2025
              自然年拿下约 $175 million，主要来自政府与企业采购用于洪涝和山火等自然灾害监测的对地观测数据。这一商业增长势头支撑了公司对外披露的连续五年盈利性扩张，并促成了 2026 年 9 月的 €300
              million C 轮股权融资。标杆案例印证了其航天器制造与在轨交付的工程可行性：在 IoT 电信领域，西班牙卫星运营商 Sateliot 于 2020 年 7 月委托 Open Cosmos 研制并运营 5G
              IoT 低轨纳卫星星座，并在 2021 年 3 月成功发射商业验证微纳卫星；同批次拼车任务中，Lacuna Space 部署了一颗由 Open Cosmos 英国 Harwell 基地研制的 IoT
              通信卫星。在主权遥感领域，Open Cosmos 交付了希腊首个国家卫星星座，完成了 Menut 与 Platero 等机构级对地观测平台，并联同 UK Space Agency 和 ESA 交付了联合资助的
