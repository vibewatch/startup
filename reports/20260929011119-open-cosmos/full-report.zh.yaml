          - type: callout
            title: 切勿将融资或签约宣传口径直接折算为现金跑道
            body: >-
              €300 million 轮次融资、累计签约合同额、LeadIQ
              年收入预估以及公司宣称的盈利状态，各自采用了不同的统计口径和时间跨度，来源也没有将这些数字勾稽起来。在判断企业流动性或利润率韧性前，应查验经审计的财务报表、现金余额、融资条款、里程碑排期，以及从在手订单到确认收入的对账表。
            calloutType: recommendation
