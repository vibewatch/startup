      - number: '7.3'
        title: 融资助力规模扩张，公开证据未现转化经济性
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月的融资规模可观，但不应直接视为可动用现金或已落实的现金跑道。TNW 与 YourInfoDaily 报道称这笔 €300 million 的 C
              轮融资旨在扩张制造与服务能力，同时也转述了公司关于连续五年盈利以及三年半签约逾 $370 million 的主张。LeadIQ 则独立测算其 2026 年 8 月年收入仅为 $1 million 至 $10
              million。然而，年收入、累计签约总额、会计利润与现金回款属于不同维度与周期的统计指标，现有公开信源完全未对四者展开勾稽与调和。从公司关于希腊 SmallSat 项目及英国 TacSys
              认证供应商资质的发文中，虽可见其在公共部门业务上的渗透，但未披露任何客户维度的收入基数或任务订单金额。因此，后续投资跟踪应重点关注验收卫星交付量、已签发射档期的冗余安排、经审计的收入与经营现金转化效率、客户集中度、频谱连续性以及独立安全背书。足以推翻投资逻辑的触发事件包括：核心牌照遗失或被暂停、持续无法锁定发射工位、扩产投入未能转化为验收交付，或经审计的现金消耗速度实质性超过合同回款。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
