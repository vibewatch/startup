      - number: '3.2'
        title: 能力对比、频谱权益与主权定位
        blocks:
          - type: paragraph
            body: >-
              在欧洲航天基础设施领域，差异化取决于主权诉求、频谱优先权与运营速度。Open Cosmos 依托近 400 名专业人员，在英国
              Harwell、西班牙巴塞罗那、葡萄牙科英布拉/波尔图与希腊雅典布局了四大制造枢纽。这种覆盖欧洲多国的本地化布局，帮助公司直接获得国家级战略支持，例如英国国家安全战略投资资金（NSSIF）以及希腊国家卫星星座项目；在与非欧洲竞争者竞争时，也由此筑起深厚的机构合作护城河。监管执行同样敏捷：通过列支敦士登取得
              Ka-band
              频谱申报后仅用两个半月便发射了业务化电信载荷，并在西班牙卫星登记框架下开展运营。相比之下，美国巨型星座虽具备吞吐量与规模优势，却难以满足欧洲战略自主对本地数据托管与本土硬件制造的要求。在小卫星制造领域，Open
              Cosmos 交付了从 3U、16U 纳卫星到 MANTIS 等 12U 微卫星的多元平台，并宣称在轨任务成功率为 100%。尽管具备技术优势，Open Cosmos 依然受制于发射资源，只能依赖 Rocket
              Lab、SpaceX 拼车发射以及国际运载火箭进入轨道，直接承受外部发射班期延误及对手掌控发射定价权的风险。
