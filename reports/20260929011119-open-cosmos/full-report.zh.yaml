        title: 主权与低时延驱动落地，交付履约构成制约
        blocks:
          - type: paragraph
            body: >-
              落地驱动力源自欧洲对自主可控通信与观测设施的需求、共享模式对小型国家的吸引力，以及 Open Cosmos 宣称下一代卫星能将情报交付时延从长达 48 hours 压缩至最快 30
              minutes。产能说法和最新融资或可扩大供给，但都不能证明产能利用率或单位经济性稳健。TNW 明确区分了日产一颗卫星的设计产能与实际产出，KuCoin
              则指出，发射窗口紧缺和对外部发射商的依赖是全行业的结构性瓶颈。因此，估值判断应看已核实的合同转化、经常性服务占比、发射通道保障和守住利润率的能力，而不是笼统的航天融资总额或 9 月融资事件。
