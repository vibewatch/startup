      - number: '1.2'
        title: 创始人、高管团队与治理架构
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 的管理层兼具航空航天工程底色与成熟的机构治理经验。创始人兼首席执行官 Rafel Jorda Siquier 自成立起便执掌公司，是核心的对外发言人兼战略设计师。联合创始人 Aleix
              Megias Homar
              参与了早期任务工程与技术方案设计，在团队迈向规模化量产前奠定了最初的硬件基础。高管团队则覆盖分布式欧洲业务枢纽的商业化收入、数据平台与企业传播等职能条线。鉴于技术任务交付与投资银团协调高度集中在 Jorda
              Siquier 一人身上，公司呈现出创始人主导型航天企业典型的关键人依赖风险。为推行制度化监管并满足欧洲公共及机构客户严苛的可持续发展标准，Open Cosmos
              建立了规范的公司治理与社会影响力监测体系。其治理架构明确对照联合国可持续发展目标（UN SDGs）与欧盟环境分类标准（EU Taxonomy）来评估运营。公司内部披露显示，2023 年 Open Cosmos 有
              73% 的任务直接符合欧盟分类标准目标；公司治理机制也持续跟踪其在英国和欧盟成员国各运营子公司的环境指标、任务安全及合规情况。
