      - number: '7.2'
        title: 牌照进展有据可查，持续合规义务仍未明朗
        blocks:
          - type: paragraph
            body: >-
              现有证据能证明许可事项与运营相关，但不能证明监管要求已全部满足。Open Cosmos 将许可办理与保险纳入端到端服务，TNW 亦报道首批 ConnectedCosmos 卫星在提交 Ka-band
              频谱申报后仅用两个半月便完成交付。然而，两家信源均未披露申报权益持有方、续期条件、覆盖司法管辖区、频率协调节点、保额上限或违规罚则。安全也有同样的证据边界：官方网站宣称具备安全可靠的主权 LEO
              网络，但既有信源中并无独立的第三方认证、渗透测试报告、SLA
              履约历史或安全事故记录。这并不表明存在事故或合规硬伤，但未披露事故同样不能推导为从未发生。在查阅原始申报材料与安全保证档案之前，频谱延续性、任务许可、安全内控以及政府采购合规资质，仍属亟待重点核实的尽调要项，而非已经落地的风险缓解项。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR015
              - CR016
