  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 发射通道受制与工厂产能爬坡主导核心剩余风险
        blocks:
          - type: paragraph
            body: >-
              在所有受审视的风险中，发射通道保障与制造履约风险位居首位，二者直接卡在业务交付的必经之路上。供应商清单显示，2023 年 1 月至 2024 年 8 月期间 Open Cosmos 有六次明确点名的任务搭乘
              Falcon 9 发射，而 KuCoin
              的行业综合报道称发射运力短缺仍是持续瓶颈；早期采用联盟号（Soyuz）任务虽显示出历史发射渠道的多样性，却无法作为当下的后备预案。与此相对，公司将四座工厂合计“日产一颗卫星”描述为潜在产能而非已验证产出，独立行业报道更公开质疑利润率纪律能否在激进扩产中得以维持。Virgin
              Orbit 发射任务中 DOVER 载荷损失，说明在轨任务成功率不能替代对发射链可靠性的评估。公司的风险应对举措仅部分可见：虽然 Open Cosmos
              将航天保险与发射任务协同纳入服务范畴，且历史上曾借助多家服务商发射，但公开证据未披露未来的发射窗口排期、保险赔付限额、验收良品率、供应商集中度或补发重飞的经济性成本。这些关键信息的缺席，使发射与生产端仍面临极高的剩余风险暴露。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
