      - number: '1.3'
        title: 资本化路径、商业落地与尽调现实
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 在早期发展阶段保持克制的融资节奏，优先依赖自我造血和客户资金推进研发，在 2023 年底前仅筹得 $7 million 外部资金。2023 年 9 月，公司完成 $50 million 的
              B 轮融资，由影响力投资机构 ETF Partners、Trill Impact 和 A&G 支持，参与方包括 Accenture Ventures、Santander InnoEnergy Climate
              Tech Fund 与 Claret Capital Partners 等产业及创投机构。2026 年 9 月，公司又完成 €300 million（$348 million）C 轮股权融资，由
              Lightrock 领投，ETF Partners、Institut Català de Finances、Entrepreneurs First、UK National Security Strategic
              Investment Fund、Convex Group、Phoenix Court 以及两家大型国际养老基金跟投。该轮融资将 Open Cosmos 推上 $1 billion
              的独角兽估值，反映出欧洲市场对自主可控航天资产的旺盛需求。在商业新闻通稿中，Open Cosmos 声称连续五年实现盈利性增长，且在三年半内累计签订逾 $370 million
              的客户合同。然而，独立尽调揭示出严重的信息不对称：截至 2026 年中，LeadIQ 等商业情报数据库估计其基准年收入仅在 $1 million 至 $10 million 之间；公司所宣称的 100%
              任务成功率，也未完整拆解已完成与仍在轨运行的任务数量。此外，员工人数在自动化追踪数据库中显示为 287 人，官方公告中却报出近 400 人。要证实其主权制造实力，仍有待经审计的财务报表与发射记录核实。
