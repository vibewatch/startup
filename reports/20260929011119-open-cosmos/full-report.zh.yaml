chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营版图与业务架构
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 由首席执行官 Rafel Jorda Siquier 与 Aleix Megias Homar 于 2015 年创立，运营总部设在英国牛津郡的 Harwell
              航天产业集群。公司创立初衷是降低航天基础设施与在轨数据的获取门槛，打破任务交付周期长、资金壁垒高、数据分发难等系统性痛点。经过十余年深耕，Open Cosmos
              已从发射用于火山监测和野生动物追踪的单点技术验证卫星，发展为业务横跨英国、西班牙、葡萄牙和希腊的跨国航天企业，在四国均设有制造、工程与软件基地。公司在四地合计拥有近 400
              名员工。在欧洲风投支持的航天硬件企业中，如此扎实的本土制造基础与自主运营能力并不多见。四大垂直整合平台撑起公司的业务架构：OpenOrbit
              提供交钥匙航天器设计、总装、集成、测试、发射协调与在轨运营；OpenConstellation 采用共享在轨基础设施模式，由机构与商业伙伴共同出资并共享星座运力；ConnectedCosmos
              提供主权宽带与直连设备的 IoT 通信；DataCosmos 则汇集多传感器卫星图像，输出 AI
              驱动的对地观测分析。这种一体化结构让地方政府、应急响应部门和自然资源管理机构等非传统航天用户无需自建卫星编组，就能直接获取具备决策价值的在轨情报。
