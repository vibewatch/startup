      - - 基准情景
        - 稳步执行 $370M 合同积压订单；工厂产能利用率趋稳；4 家工厂保持温和利润率水平
        - 在连续 5 年盈利记录与软硬件混合倍数支撑下，企业价值达 $1.2B 至 $1.8B
