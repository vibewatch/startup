            body: 通过引入星载推理并复用星间链路，Open Cosmos 绕过了对传统地面站过境周期的机械依赖，将对地观测情报交付周期从 48 hours 压缩至 30 minutes，赋能林火监测等高时效场景。
            calloutType: insight
            claimRefs:
