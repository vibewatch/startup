      - number: '5.4'
        title: 技术依赖、发射瓶颈与运营尽调盲区
        blocks:
          - type: paragraph
            body: >-
              尽管硬件研发迭代迅速——在拿到 Ka-band 无线电频率批复后仅用两个半月便部署了首批 ConnectedCosmos 卫星——但其运营体系仍面临关键的外部依赖。最突出的一点是，Open Cosmos
              不运营自己的运载火箭，发射完全依赖 SpaceX、Blue Origin 等商业发射商以及欧洲航天局的任务排期。全球发射运力紧缺、班期推迟以及拼车分离机构调度，构成了超出公司控制范围的重大运营瓶颈。此外，尽管
              Open Cosmos 宣称在轨飞行任务成功率为 100%
              成功率，但公开报道并未验证成功部署且正常在轨工作的卫星累计分母到底是多少。同样，宣称的“日产一颗卫星”制造能力仅代表理论工装设备峰值，并非经过真实飞行业绩验证的稳定常态。技术维度的尽职调查亟需直接核验累计飞行遥测数据、核心供应商依赖关系以及确定的发射排期表。
            claimRefs:
              - CE010
              - CE011
              - CE014
