  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群细分、买方画像与商业化模式
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 的客群结构横跨主权政府实体、机构级航天局、地方管理部门与商业企业运营商。各细分群体深度对接公司垂直整合产品架构中的不同层级。主权与机构类客户是合同总额的核心贡献者，通过 OpenOrbit
              采购定制化卫星硬件与专属任务运营，用以构建本国或区域航天自主能力。典型机构客户包括欧洲多国政府以及 UK Space Agency 和欧洲航天局（ESA）等航天机构，后者通过 InCubed 计划联合资助了
              MANTIS 等卫星任务。第二类核心客群是 OpenConstellation
              共享基础设施参与方，地方政府、科研联合体与环境监测部门通过共筹资金并共享在轨传感器数据，无需自筹巨资打造独立星座即可获得高频对地观测能力。电信、IoT 以及精准农业领域的商业企业客户，则主要对接
              ConnectedCosmos 与
              DataCosmos，按分层订阅模式采购主权通信链路与实时地球情报流。各板块的战略价值分化明显：政府大单能锁定多年期资本投入并建立极高的准入壁垒，但招投标周期漫长；商业数据采购方虽能贡献更高毛利的经常性软件收入，但受制于时延与数据整合阻力，业务放量更为平缓。
