  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 端到端航天任务基础设施与平台化交付
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos
              构建了端到端小卫星任务交付模式，将定制化与标准化航天器研制、空间环境试验认证、发射任务协同、在轨运行测控及下游数据分发融为一体。公司未将自身局限于单纯的元器件供应商或纯粹的数据聚合商，而是把硬件制造与星地云软件平台深度打通。其面向市场的主力产品整合在四大业务平台中：OpenOrbit
              提供交钥匙卫星平台设计、载荷集成与任务管控；OpenConstellation 作为共享卫星网络，让机构与商业用户按需获取分布式对地观测能力；ConnectedCosmos 提供主权宽带与直连 IoT
              链路；DataCosmos 则是用于汇集和处理卫星图像的在线智能平台。通过统一各平台间的软硬件接口，Open Cosmos 显著降低了区域航天项目与商业运营商的非经常性工程壁垒。
