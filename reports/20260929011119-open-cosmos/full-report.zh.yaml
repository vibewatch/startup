      - number: '4.3'
        title: 公开商业进展、资金充裕度与投资评审结论
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 在欧洲商业航天领域展现出强劲的商业势头，官方披露在 2023 年初至 2026 年 9 月期间累计签订逾 $370 million
              的客户合同。这一落地进展涵盖重量级标杆客户承诺，包括国家级对地观测星座（例如希腊主权卫星项目）、Sateliot 等运营商的商用 IoT 星座，以及与欧洲航天局（ESA）和 Accenture
              等机构合作伙伴共建的战略气候数据项目。截至 2026 年底的前十二个月内，新增合同签约额据报道达到约 $175 million，较往期运行节奏显著加速。


              2026 年 9 月 14 日，公司的资金实力获得实质性夯实：完成由 Lightrock 领投的 €300 million（约合 $346 million 至 $348 million）C 轮股权融资，ETF
              Partners、Institut Català de Finances、Entrepreneurs First、UK National Security Strategic Investment
              Fund（NSSIF）、Phoenix Court 及两家大型国际养老基金参与跟投。此轮融资确立了独角兽量级的投后估值（各市场信源报道介于 $1.0 billion 至 $2.0 billion
              之间），并为四家工厂的工业自动化改造和星座扩建提供资金余量。从投资判断看，宣称的五年盈利增长和合同储备显示出商业可行性；但公司未公开经审计的现金消耗、净利率、客户集中度及收入确认数据，机构仍难以看清这些关键环节。
