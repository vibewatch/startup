              已披露的买方包括政府、公共机构、商业企业、航天局以及能源或基础设施运营商。按产品架构，买方可选择四种路径：用 OpenOrbit 采购专属任务、共享 OpenConstellation 基础设施、从
              DataCosmos 获取影像与算法服务，或采用 ConnectedCosmos 主权宽带与
              IoT。共享基础设施能够降低无力单独建设专属星座的小型国家的准入门槛。然而，既有证据未披露任一客群的签约主体、预算科目、采购周期、席位规模、计费单位或续约机制。因此，买方图谱中的付款方与预算决策者直接标注为未披露，而非从产品用途进行主观推断。
