      - number: '5.3'
        title: 多基地协同制造与地面段运营测控
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos
              的工业化落地依托于横跨欧洲的多基地制造网络，在英国、西班牙、葡萄牙和希腊均设有运营基地。公司宣称，旗下洁净室与总装车间的综合产能上限可达日产一颗卫星，展现出自动化流水线作业而非传统手工作坊式的航天工程形态。技术创新与系统架构由
              CTO 部门统筹，下辖负责航天器工程的 OpenSat 团队、负责软件研发的 OpenApp 团队，以及负责地面管控的 OpenOPS 任务测控中心。为支撑日益扩张的星座在轨飞控，Open Cosmos
              部署了自动化任务控制系统，统一负责过境测控规划、星群指令分发以及遥测健康诊断。公司在自动化架构师岗位招聘中重点考察 Python 与 Bash 脚本开发、CI/CD
              流水线编排及事件驱动分布式架构能力，旨在将产线测试与在轨运行测控无缝衔接。
            claimRefs:
