        - label: 传统国家级航空航天主承包商
          x: 0.9
          'y': 0.4
        - label: 商业遥感影像分销商与聚合商
          x: 0.35
          'y': 0.2
    approximationNotes: 序数评分基于已公开的欧洲制造足迹、本土股权归属，以及涵盖卫星平台制造、电信和数据分析的平台架构整合度。
    claimRefs:
      - CP003
      - CP006
      - CP007
      - CP012
  - id: FI001
    title: Open Cosmos 综合价值转化与毛利率瀑布图
    type: flow
    summary: 直观呈现将客户需求与任务融资逐步转化为运营基础设施及高毛利经常性数据情报的过程。
    data:
      nodes:
        - id: capital-inflow
          label: 1. 资本与合同签约额
          detail: €300M C 轮股权融资，加上跨政府及商业合作伙伴的 $370M+ 多年期客户合同预订额
        - id: satellite-manufacturing
          label: 2. 工业化卫星生产
          detail: 跨欧洲 4 处基地开展洁净室制造，配备标准化的 3U–16U 及 12U 航天器平台
        - id: launch-deployment
          label: 3. 发射与在轨交付
          detail: 整合第三方拼单发射服务商（SpaceX、Rocket Lab、Arianespace），建立星座覆盖能力
        - id: shared-constellation
          label: 4. OpenConstellation 网络
          detail: 互联轨道星群借助星载 AI，将地球观测数据延迟从 48 小时大幅降低至 30 分钟
        - id: data-processing
          label: 5. 星载与云端数据处理
          detail: 传感器异常的实时 AI 边缘分类，以及自动化数据流水线摄取
        - id: intelligence-monetization
          label: 6. DataCosmos 与 ConnectedCosmos 服务
          detail: 高毛利下游软件数据交付、经常性物联网遥测以及主权安全分析服务
      edges:
        - from: capital-inflow
          to: satellite-manufacturing
          label: 资本配置与研发
        - from: satellite-manufacturing
          to: launch-deployment
          label: 航天器集成
        - from: launch-deployment
          to: shared-constellation
          label: 轨道注入
        - from: shared-constellation
          to: data-processing
          label: 传感器原始数据流
        - from: data-processing
          to: intelligence-monetization
          label: 处理后情报与遥测数据
    approximationNotes: 基于平台架构披露信息展现 Open Cosmos 的结构性运营模式；各阶段财务利润率为定性表征。
    claimRefs:
      - CI001
      - CI006
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 涵盖轨道载荷、卫星平台、测控自动化、通信链路、数据平台及终端用户情报的六层功能架构。
    data:
      layers:
        - label: 第 6 层：终端用户情报与应用
          detail: 向政府机构、海事运营商及企业客户交付的决策支持仪表盘、应急警报与自动化地理空间分析。
        - label: 第 5 层：DataCosmos 处理与云平台
          detail: 云端托管遥感影像目录、算法处理流水线、计算机视觉特征提取及安全客户 API 集成端点。
        - label: 第 4 层：ConnectedCosmos 主权通信
          detail: Ka 频段卫星宽带、直接到设备的物联网数据中继及星间链路，实现绕过地面过境等待的低延迟下行。
        - label: 第 3 层：OpenOPS 与任务测控自动化
          detail: 自动化星群指挥与控制、过境排期、健康遥测监控以及容器化 CI/CD 运营工作流。
        - label: 第 2 层：模块化卫星平台与星载 AI
          detail: 具备模块化载荷接口、支持实时推理的边缘计算处理器，以及集成电源与热控管理的标准化卫星平台。
        - label: 第 1 层：多工厂制造与发射集成
          detail: 位于英国、西班牙、葡萄牙和希腊的 4 处欧洲制造基地，统筹硬件组装、环境试验及商业发射集成。
    approximationNotes: 基于技术平台披露资料，对 Open Cosmos 空天地一体化云基础设施的功能性呈现。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 贯穿 Open Cosmos 机构级与企业级采购生命周期的客户采纳与扩张阶段。
    data:
      items:
        - label: 初步接洽与架构定义
          touchpoints:
            - 双边可行性研究
            - OpenOrbit 任务范围界定
            - 频谱与合规咨询
        - label: 任务验证与试点部署
          touchpoints:
            - 在轨验证卫星发射
            - 传感器校准与测试
            - 初始下行链路验证
        - label: 运营调试与交付
          touchpoints:
            - 全星座集成
            - 自动化 MOC 飞行控制运营
            - 实时数据流访问
        - label: 共享星座扩展
          touchpoints:
            - OpenConstellation 资源共享池化
            - 多传感器互惠数据共享
            - DataCosmos AI 分析订阅
        - label: 主权网络扩容与续约
          touchpoints:
            - 下一代卫星在轨补网
            - ConnectedCosmos 主权 5G 链路
            - 长期数据供应合同
        - label: 生态集成与第三方应用
          touchpoints:
            - 云端 API 应用开发
            - 下游分析集成
            - 跨机构数据联合
    approximationNotes: 各阶段反映从 Open Cosmos 平台资料梳理出的标准航天采购与数据服务采纳模式。
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU007
      - CU010
      - CU016
  - id: FR001
    title: 残余风险热力图与逻辑证伪监测指标
    type: matrix
    summary: 定性优先级将已有证据支持的风险因素与尚待验证的缓释措施区分开，并为每项风险匹配可监测的逻辑证伪条件。
    data:
      columns:
        - 发生概率
        - 影响程度
        - 缓释成熟度
        - 监测指标 / 逻辑证伪条件
      rows:
        - label: 发射获取通道
          values:
            - label: 高
              detail: 行业运力面临瓶颈，且近期命名的 6 次发射任务均依赖同一种运载火箭系列。
              tone: negative
            - label: 高
              detail: 入轨前无法开展任何部署或客户验收。
              tone: negative
            - label: 部分具备
              detail: 历史上曾使用 Soyuz 火箭且服务内含保险，但未披露未来备选发射清单。
              tone: neutral
            - label: 触发证伪
              detail: 屡次无法获得所需发射工位，或丢失核心任务且无资金支持复飞。
              tone: negative
        - label: 制造产能爬坡
          values:
            - label: 中
              detail: 披露的每天 1 颗卫星仅代表设计产能，非持续实际产出。
              tone: neutral
            - label: 高
              detail: 交付量与成本控制决定在手合同能否转化为已验收里程碑。
              tone: negative
            - label: 尚未验证
              detail: 未见公开的良率、吞吐量、返工率或单件成本序列数据。
              tone: negative
            - label: 触发证伪
              detail: 扩产后已验收交付量未见增长，同时单机经济模型或进度表现恶化。
              tone: negative
        - label: 发射失利
          values:
            - label: 中
              detail: DOVER 提供了历史有效载荷损失案例；未来发生频次尚未量化。
              tone: neutral
            - label: 高
              detail: 失利会带来补造、保险、交付排期及客户里程碑违约风险。
              tone: negative
            - label: 部分具备
              detail: 保险属于服务范围，但未公开赔付限额与免责条款。
              tone: neutral
            - label: 触发证伪
              detail: 发生无保险覆盖的重大损失，或在不推迟其他项目的情况下无法筹措复飞费用。
              tone: negative
        - label: 频谱与准入许可
          values:
            - label: 中
              detail: 此前通过 Ka 频段申请支持了快速部署，但后续持续合规条件尚不可见。
              tone: neutral
            - label: 高
              detail: 互联服务高度依赖持续有效的运营授权。
              tone: negative
            - label: 部分具备
              detail: 许可由内部团队负责办理；证据池中未收录申报的一手原始凭据。
              tone: neutral
            - label: 触发证伪
              detail: 遗失、暂停或错过必需申报及运营许可的关键里程碑。
              tone: negative
        - label: 现金转换
          values:
            - label: 中
              detail: 大额融资支持了业务扩张，但合同回款节奏与营运资金结算节点尚未披露。
              tone: neutral
            - label: 高
              detail: 资本需求高，里程碑回款延迟也可能拖累交付。
              tone: negative
            - label: 部分具备
              detail: 融资已有确凿证据；经审计的现金流与合同转收入对账明细尚未公开。
              tone: neutral
            - label: 触发证伪
              detail: 经审计的现金消耗显著超出客户回款，且交付履约负担持续加重。
              tone: negative
        - label: 安全核验
          values:
            - label: Unknown
              detail: 未指派有关安全事件频次或控制有效性的独立证据。
              tone: neutral
            - label: 高
              detail: 政府连接与数据服务涉及重大的可用性与信任后果。
              tone: negative
            - label: 尚未验证
              detail: 厂商自述其服务具备安全与主权属性，但证据池中未见独立安全核验。
              tone: negative
            - label: 触发证伪
              detail: 出现重大内控失效、丧失政府采购资质，或无法提供当期安全核验凭证。
              tone: negative
    approximationNotes: 截至 2026-09-29 的分析师定性评估；发生概率与影响程度并非原始数据披露的统计概率，标注“未知”亦不代表未曾发生安全事件。
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR009
      - CR011
      - CR014
      - CR016
  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    summary: 贯通主权市场顺风、运营成果验证、估值定价不确定性与审慎投资立场的决策分析框架。
    data:
      nodes:
        - id: N01
          label: 主权市场需求顺风
          description: 欧洲对战略自主权的需求激增，且已签署超 $370M 客户合同
        - id: N02
          label: 欧洲工业制造版图
          description: 拥有 4 座运营中的欧洲制造基地，自述具备每天 1 颗卫星的产能，且实现连续 5 年盈利
        - id: N03
          label: 核心运营瓶颈
          description: 发射运力严重紧缺，业务根本上受制于包括 SpaceX 在内的外部发射服务商
        - id: N04
          label: 估值口径分歧
          description: 报道的估值从 $1.0B 独角兽基准到匿名消息所称的 $2.0B 不等
        - id: N05
          label: 规模扩张资本稀释
          description: €300M 资本投放阶段面临固定成本开支扩张与毛利受压风险
        - id: N06
          label: 有条件观望建议
          description: 恪守严谨的投资纪律，要求核验确切的发射排期并对合同毛利开展专项审计
    approximationNotes: 将宏观与微观驱动因素映射至最终投资立场的定性分析路径。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
