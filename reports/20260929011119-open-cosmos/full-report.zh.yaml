        - 20%（受资本密集和发射资源波动影响）
      - - 极端下行情景（致命情景）
        - 在轨星座发生灾难性故障，或丧失关键 Ka 频段频谱运营权
        - 严格基于实体工厂资产、测试设备与剩余专利组合清算，清算价值 <$250M
        - 客户合同被永久取消，航天任务彻底失败
        - 5%（鉴于迄今保持 100% 任务历史成功率，发生概率较低）
    notes: 情景估值基于据报 $1B 至 $2B 的 C 轮估值基准，建立风险调整后产出模型。
