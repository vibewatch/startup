  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业收入架构与商业化变现模式
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 的收入来自四条业务线：交钥匙航天任务、共享在轨基础设施、下游对地观测情报和主权连接服务。公司早期核心业务立足于
              OpenOrbit，面向机构与商业运营商提供专属卫星设计、制造、发射协调、测试与在轨运营的端到端任务交付。借助
              OpenConstellation，公司逐步转向共享基础设施模式：多个地方和主权客户共同出资或订阅共享在轨载荷，显著降低单一运营方的资本开支，同时带来高毛利的运营服务收入。


              太空数据与分析服务的变现依托于 DataCosmos 云平台，客户可通过该平台对光学、高光谱及各类对地观测传感器数据进行检索、处理并提取业务洞察。在连接领域，ConnectedCosmos 在获得列支敦士登
              Ka-band
              频谱监管批复后发射了首批验证载荷，以直连设备物联网（IoT）链路与卫星宽带实现商业变现。各任务通常采用定制化多年期机构合同，而非固定目录价；合同规模从单星示范任务到多星主权星座项目不等。付款条款往往结合硬件交付里程碑、经常性数据订阅及运营支持服务费；公开目录价尚未披露。
