      - number: '4.2'
        title: 营业成本结构、资本开支动因与服务交付经济性
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos
              的运营模式兼有专业航天硬件制造和经常性云端情报服务。公司在英国、西班牙、葡萄牙和希腊设有四处制造基地，卫星装配已走向工业化，设计产能最高为每天一颗。采用标准化纳卫星（3U、16U）与微卫星（12U）构型，也能减少不同任务间重复投入的非经常性工程（NRE）成本。营业成本（COGS）的核心构成包括经飞行验证的航电设备与结构硬件、第三方光学及高光谱载荷采购支出、向
              SpaceX、Rocket Lab 与 Arianespace 等服务商支付的拼车发射服务费，以及地面站下行数据带宽费用。


              人力是运营开支的重要组成部分，支撑着分布在四个欧洲国家的约 400 名专业工程师、软件开发人员和任务操作员。尽管在轨硬件研发属于重资产领域，但公司公开披露自 2020 年起即实现运营盈利（EBITDA
              为正），且截至 2026 年 9 月已实现连续五年盈利性扩张。不过，硬件交付与软件分析业务各自的真实毛利率结构仍属保密核心财务数据。得益于可复用的云端处理管线，DataCosmos
              软件层在服务交付成本上具备结构性优势；相比之下，早期空间段研制和发射任务需要大量前期营运资金，也容易受到发射排期延误影响。
