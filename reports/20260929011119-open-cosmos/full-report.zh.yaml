      - number: '5.2'
        title: OpenConstellation 子系统与星载边缘计算
        blocks:
          - type: paragraph
            body: >-
              OpenConstellation
              的核心技术壁垒在于模块化、高互通的星座架构，实现了仪器载荷与标准卫星平台的彻底解耦。该平台借助标准化的机械、电气、热控及数据接口，能够兼容光学传感器、电信收发机、空间态势感知探测器与 IoT 中继载荷。下一代
              OpenConstellation 卫星最具代表性的技术能力，是星载人工智能处理单元与星间通信链路的结合。传统低轨航天任务受制于漫长的数据下行时延，往往需要等待数小时才能连上指定地面站窗口回传原始数据。Open
              Cosmos 卫星直接在轨运行计算机视觉推理与异常分类算法，将具备行动价值的情报交付周期从最长 48 hours 压缩至约 30
              minutes，这对林火监测、海上拦截以及防灾减灾等场景至关重要。随后，DataCosmos 的自动化数据管线会对这些分析结果统一归类并分发。
            claimRefs:
