              Open Cosmos 从估值 $7 million 的早期企业跃升为 $1 billion 的独角兽，折射出欧洲航空航天采购领域的地缘政治变局。凭借在英国、西班牙、葡萄牙和希腊布局的四座分布式制造基地，并依托
              UK National Security Strategic Investment Fund 的注资背书，Open Cosmos 将旗下的 OpenConstellation 共享架构与
