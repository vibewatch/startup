figures:
  - id: FO001
    title: Open Cosmos 企业与运营里程碑时间线
    type: timeline
    summary: 按时间梳理 Open Cosmos 从创立、商业化到星座部署和机构融资的关键节点。
    data:
      items:
        - label: 公司创立
          date: '2015-09-01'
          detail: Rafel Jorda Siquier 在英国牛津郡创立 Open Cosmos，旨在降低进入轨道的门槛。
          tone: positive
        - label: 种子轮与早期资本
          date: '2020-12-31'
          detail: 在仅引入 $7M 外部资本的精简资本基础下，实现了内生性 EBITDA 盈利。
          tone: positive
        - label: MENUT 卫星发射
          date: '2023-01-15'
          detail: 成功发射专用于森林砍伐、野火及海岸侵蚀监测的 MENUT 卫星。
          tone: positive
        - label: B 轮融资
          date: '2023-09-11'
          detail: 完成由 ETF Partners、Trill Impact 和 A&G 领投的 $50 million B 轮融资，以扩大 OpenConstellation 规模。
          tone: positive
        - label: CONIDA 平台选型合作
          date: '2023-09-15'
          detail: 获秘鲁航天局（CONIDA）选定，为其提供国家级地理空间数据分发服务。
          tone: positive
        - label: 列支敦士登频谱接入
          date: '2026-06-15'
          detail: 完成 Ka 频段频谱申报，并在两个月内发射首批 ConnectedCosmos 电信卫星。
          tone: positive
        - label: 独角兽 C 轮融资
          date: '2026-09-14'
          detail: 完成由 Lightrock 领投、按 $1B 估值进行的 €300M（$348M）C 轮融资，参投方包括 NSSIF 与养老基金。
          tone: positive
        - label: 商业积压订单里程碑
          date: '2026-09-14'
          detail: 据报在 3.5 年内跨英国、西班牙、葡萄牙和希腊工厂签署了 $370M+ 合同。
          tone: positive
    approximationNotes: 日期反映公司披露及经证实新闻报道中确定的官方公告日期或指定项目周期。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO008
      - CO012
      - CO013
