      - number: '6.3'
        title: 客户留存机制、扩单阻力与客户集中度现实
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos 的两类业务采购节奏不同，客户留存表现也各异。OpenOrbit
              的专属航天器研制与发射合同通常按项目推进；客户往往要等首颗卫星成功完成在轨验证后，才会考虑扩建星座。OpenConstellation
              则靠数据共享扩容：参与机构向资源池注入卫星资产或传感器数据流，换取全球多传感器数据的互惠访问权，进而带来网络效应和更高的切换成本。然而，公司尚未披露净收入留存率（NRR）、总收入留存率（GRR）或年度客户流失率。LeadIQ
              等第三方商业数据库估计，截至 2026 年 8 月，Open Cosmos 过去 12 个月的收入仅为 $1 million 至 $10 million，与对外宣称的 $370 million
              签约总额形成巨大反差，表明已确认收入仅占多年期合同总额的一小部分。此外，客户集中度风险极高：主权政府项目、欧洲机构联合体以及 Sateliot
              等核心商业客户合计贡献了累计合同额的绝大部分。工业软件下游客户的采纳，也受 Planet Labs、Airbus 等成熟卫星数据厂商竞争和商业火箭运力短缺等瓶颈制约。
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU012
              - CU014
              - CU015
              - CU016
