chapter:
  number: 6
  title: "Customers"
  summary: "Open Cosmos serves government agencies, commercial telecom operators, and institutional Earth observation users through sovereign missions and shared infrastructure, reporting over $370 million in customer contracts signed over three and a half years and five consecutive years of profitable growth. However, named customer deployments remain heavily concentrated among early-stage pilots and European institutional partners, while independent platforms report baseline revenue estimates between $1 million and $10 million, exposing material contract-to-revenue conversion lag and customer concentration risks."
sections:
  - id: "customer-segmentation-and-value-proposition"
    title: "Customer Base Segmentation, Buyer Personas, and Commercial Models"
    body: "Open Cosmos segments its customer base across sovereign government entities, institutional space agencies, regional authorities, and commercial enterprise operators. Each segment engages with distinct layers of the company's vertically integrated product architecture. Sovereign and institutional clients represent the primary drivers of contract value, procuring bespoke satellite hardware and dedicated mission operations through OpenOrbit to establish national or regional space capabilities. Representative institutional customers include European governments and space agencies such as the UK Space Agency and the European Space Agency, which co-fund missions like MANTIS through the InCubed programme. A second critical segment comprises shared-infrastructure participants within OpenConstellation, where regional governments, research consortia, and environmental authorities pool resources and share orbital sensor data to access high-revisit Earth observation without funding independent constellations. Commercial enterprise clients, particularly in telecommunications, IoT, and precision agriculture, interact through ConnectedCosmos and DataCosmos, purchasing sovereign connectivity links and real-time Earth intelligence feeds via tiered subscriptions. Strategic value varies significantly across segments: government contracts provide multi-year capital commitments and high procurement moats but introduce extended tender cycles, while commercial data consumers generate higher-margin recurring software revenues but exhibit slower adoption due to latency and data integration frictions."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
    figureRefs: []
  - id: "adoption-trajectory-and-deployment-proof"
    title: "Commercial Adoption Trajectory, Contract Scale, and Named Deployments"
    body: "The adoption trajectory of Open Cosmos demonstrates rapid top-line contract expansion contrasted with opaque operational deployment milestones. Between early 2023 and September 2026, the company signed over $370 million in cumulative customer contracts, including approximately $175 million secured during the 2025 calendar year from governments and enterprises for Earth observation data addressing natural disasters such as floods and wildfires. This commercial momentum supported five consecutive years of self-reported profitable growth, culminating in a €300 million Series C equity round in September 2026. Named production deployments validate the operational viability of its spacecraft manufacturing and orbital delivery. In the IoT telecommunications vertical, Spanish satellite operator Sateliot contracted Open Cosmos in July 2020 to build and operate a low-Earth-orbit nanosatellite constellation for 5G IoT connectivity, launching commercial demonstration SmallSats in March 2021. Concurrently, Lacuna Space deployed an IoT communications satellite manufactured at Open Cosmos' Harwell facility on the same rideshare flight. For sovereign remote sensing, Open Cosmos delivered Greece's first satellite constellation, institutional Earth observation platforms including Menut and Platero, and the co-funded MANTIS spacecraft with the UK Space Agency and ESA. In emerging markets, the Guinean government initiated bilateral negotiations in April 2024 to explore satellite internet partnerships targeting rural digital divide mitigation. Despite these public milestones, contract conversion timelines remain protracted, and production deployments are shadowed by unverified mission denominators."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs: []
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics, Expansion Friction, and Customer Concentration Realities"
    body: "Customer durability and revenue retention at Open Cosmos are governed by the bifurcated nature of space infrastructure procurement versus downstream data consumption. Dedicated spacecraft build and launch contracts under OpenOrbit are inherently episodic, requiring successful on-orbit demonstration before customers commit to constellation expansions. Expansion within OpenConstellation relies on a data-sharing mutualisation mechanism: participating organisations contribute satellite assets or sensor feeds to the pool in exchange for reciprocal access to global multi-sensor data, creating strong network effects and switching costs. However, commercial retention metrics—including net revenue retention, gross revenue retention, and annual logo churn—remain completely undisclosed. Third-party commercial databases such as LeadIQ estimate Open Cosmos' trailing annual revenue between only $1 million and $10 million as of August 2026, contrasting sharply with the $370 million in headline contract signings and indicating that recognized revenue represents only a fraction of multi-year contract values. Furthermore, customer concentration risk is exceptionally high: sovereign government programmes, European institutional consortia, and anchor commercial accounts like Sateliot account for the vast majority of cumulative contract value. Downstream adoption among industrial software users remains constrained by competition from established satellite data incumbents like Planet Labs and Airbus, alongside external bottlenecks such as global launch capacity shortages on commercial rockets."
