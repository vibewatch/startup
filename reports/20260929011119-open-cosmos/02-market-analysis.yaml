company:
  name: "Open Cosmos"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Open Cosmos addresses a bounded stack spanning small-satellite missions, shared
    Earth-observation infrastructure, data products, and secure connectivity, with
    governments and infrastructure operators prominent in the buyer set. The assigned
    evidence indicates strong capital formation and more than $370 million of company-reported
    contracts, but it does not disclose a defensible TAM, SAM, SOM, pricing base, or budget-owner
    map; those omissions materially limit market-share and valuation conclusions.
sections:
  - id: "market-boundary"
    title: "A bounded end-to-end space-infrastructure market"
    body: >-
      The relevant market is narrower than the entire space economy and broader than
      satellite manufacturing alone. Open Cosmos presents an end-to-end mission service
      covering assembly, integration and testing, launch campaign support, in-orbit
      operations, data delivery, insurance, and licensing. It then extends into shared
      Earth-observation infrastructure, imagery processing, and sovereign broadband and
      IoT connectivity. This chapter therefore includes spend for turnkey small-satellite
      missions and the attached data or connectivity services. It excludes launch-provider
      revenue, unrelated geospatial software, generic cloud infrastructure, and large
      spacecraft programs unless Open Cosmos is the contracted mission or service provider.
      Status-quo substitutes include a government-owned dedicated constellation, buying
      imagery from another operator, terrestrial monitoring and communications, or delaying
      procurement.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM006"
    tableRefs:
      - "TM001"
  - id: "sizing-without-false-precision"
    title: "Sizing evidence is directional, not a TAM"
    body: >-
      None of the assigned sources supplies category revenue, procurement spend, or a
      bottom-up fleet and service model from which a credible TAM, SAM, or SOM can be
      calculated. Two independent articles instead report different, period-specific
      measures of global space financing: $11.3 billion for the first half of 2026 in
      TNW and more than $16.5 billion year to date in KuCoin's derivative report. These
      are capital-flow indicators, not customer spend. Open Cosmos also reports more than
      $370 million of contracts signed over three and a half years, while KuCoin reports
      approximately $175 million in contracts in the prior year. Those company-level
      figures indicate demand traction but do not establish addressable-market size,
      recognized revenue, backlog conversion, or obtainable share.
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM011"
      - "CM014"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption-paths"
    title: "Public-sector sovereignty leads; budget ownership remains opaque"
    body: >-
      The disclosed buyer universe includes governments, institutions, businesses, space
      agencies, and energy or infrastructure operators. Four adoption paths follow from
      the product architecture: procure a dedicated mission through OpenOrbit, share
      infrastructure through OpenConstellation, consume imagery and algorithms through
      DataCosmos, or deploy sovereign broadband and IoT through ConnectedCosmos. Shared
      infrastructure can reduce the entry barrier for smaller states that cannot justify
      a standalone constellation. However, the assigned evidence does not identify the
      contracting authority, budget line, procurement cycle, user seat, pricing unit, or
      renewal mechanism for any segment. As a result, payer and budget-owner assignments
      in the buyer map remain explicitly undisclosed rather than inferred from product use.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM010"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Sovereignty and latency support adoption, while execution constrains it"
    body: >-
      Adoption is supported by European demand for controlled communications and observation
      infrastructure, the appeal of shared systems for smaller states, and Open Cosmos's
      claim that next-generation satellites can compress intelligence delivery from as much
      as 48 hours to as little as 30 minutes. Capacity claims and recent financing may enable
      supply, but neither proves utilization or durable unit economics. TNW carefully
      distinguishes one-satellite-per-day capacity from actual output, while KuCoin identifies
      launch availability and dependence on external launch providers as an industry
      bottleneck. For valuation, the market case should therefore be tied to verified contract
      conversion, recurring service mix, launch access, and margin retention rather than to
      broad space-financing totals or the September funding round.
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM012"
      - "CM013"
      - "CM015"
callouts:
  - calloutType: "risk"
    title: "Do not treat financing as market demand"
    body: >-
      Global venture funding and Open Cosmos's €300 million round measure capital supplied
      to companies, not customer expenditure. Investment underwriting should wait for a
      dated backlog bridge, recognized revenue, recurring-service mix, and segment margins.
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM011"
      - "CM016"
