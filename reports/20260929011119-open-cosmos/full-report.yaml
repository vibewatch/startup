  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Thesis-Break / View-Change Trigger
    rows:
      - - Sovereign Market Demand
        - European governments prioritizing autonomous orbital intelligence and secure communications infrastructure
        - >-
          European public procurement cycles are notoriously protracted, fragmented, and vulnerable to budget
          reallocations
        - Cancellation or material restructuring of anchor UK Space Agency or European national constellation contracts
      - - Manufacturing & Scale
        - >-
          Operating four manufacturing facilities in UK, Spain, Portugal, and Greece with stated 1 satellite/day
          capacity
        - >-
          Daily rate reflects theoretical assembly capability rather than sustained orbital commissioning and launch
          throughput
        - Persistent backlog accumulation where completed satellite payloads remain unlaunched over six months
      - - Commercial & Financial Discipline
        - Five consecutive profitable years with more than $370M in customer contracts signed since 2022
        - >-
          €300M capital infusion risks triggering aggressive overhead inflation and margin compression across 400
          employees
        - Operating cash flow turning negative for two consecutive reporting periods during manufacturing scale-up
      - - Launch & Partner Dependencies
        - Diversified launch partnerships across commercial vendors in the United States, India, and Japan
        - >-
          Near-monopoly launch dominance by SpaceX leaves deployment schedules captive to US commercial launch
          availability
        - >-
          Launch provider slips exceeding two quarters that delay operational activation of ConnectedCosmos
          constellation
    notes: Analytical framework evaluating core commercial growth drivers against structural operational friction.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Rapid adoption of 30-minute EO data; ConnectedCosmos captures major European defense contracts; launch slots
          secured
        - $2.5B to $3.5B enterprise value based on premium recurring data revenue multiple (12x to 15x forward ARR)
        - Launch capacity bottlenecks cap orbital constellation expansion
        - 25% (supported by €300M round scale and sovereign defense prioritization)
      - - Base Case
        - >-
          Steady execution on $370M contract backlog; factory utilization stabilizes; modest margin retention across 4
          facilities
        - >-
          $1.2B to $1.8B enterprise value supported by 5-year profitable track record and blended hardware/service
          multiples
        - Overhead inflation and margin dilution from multi-country scaling
        - 50% (aligned with demonstrated commercial discipline and historical trajectory)
      - - Bear Case
        - >-
          Extended launch manifest slips (>6 months); sovereign procurement delays; hardware margin compression below
          15%
        - >-
          $400M to $600M enterprise value reflecting multiple compression to 2x trailing contract volume or down-round
          recap
        - Capital overhang from €300M Series C and liquidation preference subordination
        - 20% (driven by capital intensity and volatile launch availability)
      - - Severe Downside (Kill Scenario)
        - Catastrophic in-orbit constellation failures or loss of critical Ka-band spectrum operating rights
        - >-
          <$250M liquidation value based strictly on physical facility assets, test machinery, and residual patent
          portfolio
        - Permanent customer contract cancellations and complete mission failure
        - 5% (remote given historical 100% mission success rate to date)
    notes: Scenario valuations model risk-adjusted outcomes based on reported $1B to $2B Series C valuation marks.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV013
