  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: End-to-End Space Mission Infrastructure and Platform Delivery
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos delivers an end-to-end small satellite mission delivery model that combines custom and
              standardized spacecraft development, environmental qualification, launch campaign coordination, orbital
              operations, and downstream data distribution. Rather than operating purely as a component vendor or
              pure-play data aggregator, the company integrates hardware manufacturing with space-to-cloud software
              platforms. Its primary market-facing offerings are structured across four operational platforms:
              OpenOrbit, which provides turnkey bus design, payload integration, and mission management;
              OpenConstellation, a shared satellite infrastructure network enabling institutional and commercial users
              to access distributed Earth observation; ConnectedCosmos, providing sovereign broadband and direct IoT
              links; and DataCosmos, an online intelligence platform for ingesting and processing satellite imagery. By
              standardizing interfaces across these platforms, Open Cosmos lowers non-recurring engineering barriers for
              regional space programs and commercial operators.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
