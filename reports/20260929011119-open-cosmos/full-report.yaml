  - id: FR001
    title: Residual-risk heatmap and thesis-break monitors
    type: matrix
    summary: >-
      Qualitative prioritization separates evidenced risk drivers from still-unverified mitigations and attaches a
      monitorable thesis-break condition to each.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Monitor / thesis-break condition
      rows:
        - label: Launch access
          values:
            - label: High
              detail: Industry capacity bottleneck plus six named recent missions on one launcher family.
              tone: negative
            - label: High
              detail: No deployment or customer acceptance occurs before orbital insertion.
              tone: negative
            - label: Partial
              detail: Historical Soyuz use and insurance-inclusive service, but no future fallback manifest.
              tone: neutral
            - label: Break
              detail: Repeated inability to secure required slots or loss of an anchor mission without a funded re-flight.
              tone: negative
        - label: Manufacturing ramp
          values:
            - label: Medium
              detail: The disclosed one-satellite-per-day figure is capacity, not sustained output.
              tone: neutral
            - label: High
              detail: Delivery volume and cost discipline determine conversion of contracts into accepted milestones.
              tone: negative
            - label: Unverified
              detail: No public yield, throughput, rework, or unit-cost series.
              tone: negative
            - label: Break
              detail: >-
                Accepted deliveries fail to rise after expansion while unit economics or schedule performance
                deteriorate.
              tone: negative
        - label: Launch loss
          values:
            - label: Medium
              detail: DOVER provides a historical payload-loss example; future frequency is not quantified.
              tone: neutral
            - label: High
              detail: Loss creates replacement, insurance, schedule, and customer-milestone exposure.
              tone: negative
            - label: Partial
              detail: Insurance is in the service scope, but limits and exclusions are not disclosed.
              tone: neutral
            - label: Break
              detail: A material uninsured loss or re-flight obligation cannot be funded without delaying other programmes.
              tone: negative
        - label: Spectrum and licensing
          values:
            - label: Medium
              detail: A prior Ka-band filing supported rapid deployment, but ongoing conditions are unavailable.
              tone: neutral
            - label: High
              detail: Connected services depend on continuing authority to operate.
              tone: negative
            - label: Partial
              detail: Licensing is offered in-house; primary filing evidence was not in the pool.
              tone: neutral
            - label: Break
              detail: Loss, suspension, or missed milestone on a required filing or operating licence.
              tone: negative
        - label: Cash conversion
          values:
            - label: Medium
              detail: A large round funds expansion, but contract receipts and working-capital timing are not disclosed.
              tone: neutral
            - label: High
              detail: Capital intensity and delayed milestone receipts can constrain delivery.
              tone: negative
            - label: Partial
              detail: Financing is evidenced; audited cash flow and contract-to-revenue reconciliation are not.
              tone: neutral
            - label: Break
              detail: Audited cash consumption materially outruns customer receipts while delivery obligations expand.
              tone: negative
        - label: Security assurance
          values:
            - label: Unknown
              detail: No independent incident frequency or control-effectiveness evidence was assigned.
              tone: neutral
            - label: High
              detail: Government connectivity and data services carry material availability and trust consequences.
              tone: negative
            - label: Unverified
              detail: The service is described as secure and sovereign without independent assurance in the pool.
              tone: negative
            - label: Break
              detail: Material control failure, loss of procurement eligibility, or inability to provide current assurance.
              tone: negative
    approximationNotes: >-
      Qualitative analyst assessment as of 2026-09-29; likelihood and impact are not source-reported probabilities, and
