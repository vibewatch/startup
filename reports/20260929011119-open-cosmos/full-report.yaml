      - number: '7.3'
        title: Funding supports scale, but public evidence does not show conversion economics
        blocks:
          - type: paragraph
            body: >-
              The September 2026 financing is substantial but should not be treated as cash available or runway. TNW and
              YourInfoDaily report a €300 million Series C intended to expand manufacturing and services, while also
              repeating company claims of five consecutive profitable years and more than $370 million of contracts
              signed over three and a half years. LeadIQ separately estimates August 2026 annual revenue at $1 million
              to $10 million, but annual revenue, cumulative signed contract value, accounting profit, and cash receipts
              are different metrics and periods; the sources do not reconcile them. Public-sector exposure is also
              visible through company posts about Greece's SmallSat programme and UK TacSys approved-provider status,
              yet no customer-level revenue denominator or task-order value is disclosed. Investment monitoring should
              therefore focus on accepted satellite output, contracted launch redundancy, audited revenue and operating
              cash conversion, customer concentration, spectrum continuity, and independent security assurance.
              Thesis-break events are loss or suspension of a required licence, repeated inability to secure launch
              slots, failure to convert funded capacity into accepted deliveries, or audited cash consumption that
              materially outruns contract receipts.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
