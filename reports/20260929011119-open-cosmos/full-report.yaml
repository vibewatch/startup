  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Launch access and the factory ramp dominate residual exposure
        blocks:
          - type: paragraph
            body: >-
              Launch access and manufacturing execution rank above the other reviewed risks because both sit directly on
              the delivery path. The supplier listing records six named Open Cosmos missions on Falcon 9 from January
              2023 through August 2024, while KuCoin's syndicated industry coverage calls launch-capacity shortages a
              continuing bottleneck; older Soyuz missions show some historical provider diversity but not a current
              fallback plan. At the same time, the company describes one satellite per day across four factories as
              capacity, not demonstrated output, and independent coverage explicitly questions whether margin discipline
              will survive the ramp. The DOVER payload loss on Virgin Orbit also shows why an in-orbit success claim
              cannot substitute for launch-chain reliability. Mitigations are only partially visible: Open Cosmos
              includes insurance and launch campaigns in its service scope and has flown through more than one provider,
              but public evidence does not disclose future slots, policy limits, accepted-unit yield, supplier
              concentration, or re-flight economics. Those omissions keep launch and production risk at high residual
              exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
