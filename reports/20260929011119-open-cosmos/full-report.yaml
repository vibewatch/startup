      - number: '2.4'
        title: Sovereignty and latency support adoption, while execution constrains it
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by European demand for controlled communications and observation infrastructure, the
              appeal of shared systems for smaller states, and Open Cosmos's claim that next-generation satellites can
              compress intelligence delivery from as much as 48 hours to as little as 30 minutes. Capacity claims and
              recent financing may enable supply, but neither proves utilization or durable unit economics. TNW
              carefully distinguishes one-satellite-per-day capacity from actual output, while KuCoin identifies launch
              availability and dependence on external launch providers as an industry bottleneck. For valuation, the
              market case should therefore be tied to verified contract conversion, recurring service mix, launch
              access, and margin retention rather than to broad space-financing totals or the September funding round.
