  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Revenue Architecture and Monetization Models
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos generates revenue across four distinct commercial pillars spanning turnkey space missions,
              shared orbital infrastructure, downstream Earth observation intelligence, and sovereign connectivity. The
              core offering historically rested on OpenOrbit, an end-to-end mission delivery service providing dedicated
              satellite design, manufacturing, launch brokering, testing, and in-orbit operations for institutional and
              commercial operators. Through OpenConstellation, the company transitioned toward a shared infrastructure
              paradigm where multiple regional and sovereign customers contribute or subscribe to shared orbital
              payloads, dramatically reducing single-operator capex while creating high-margin operational service
              revenue.


              Monetization for space data and analytics is delivered via DataCosmos, a cloud-based platform enabling
              customers to search, process, and derive operational insights from optical, hyperspectral, and Earth
              observation sensor data. In connectivity, ConnectedCosmos monetizes direct-to-device Internet of Things
              (IoT) links and satellite broadband, having launched initial demonstration assets following Liechtenstein
              Ka-band spectrum regulatory approvals. Pricing across missions is structured primarily through bespoke
              multi-year institutional contracts rather than fixed catalog pricing, with contract values spanning
              single-satellite demonstration missions to multi-satellite sovereign constellation agreements. Commercial
              terms frequently combine milestone-based hardware delivery payments with recurring data subscription and
              operational support retainers, though published list prices remain undisclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
