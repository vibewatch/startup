  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Stance
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos presents a highly differentiated profile within the European space technology landscape by
              coupling sovereign infrastructure positioning with an audited five-year track record of profitable growth.
              The company closed a €300 million (approximately $346 million to $348 million) Series C funding round in
              September 2026, led by Lightrock and ETF Partners with significant backing from European development
              institutions and pension funds. However, valuation marks surrounding this round diverge substantially
              between a reported $1 billion unicorn milestone and anonymous insider accounts pegging post-money
              enterprise value near $2 billion. In light of this valuation spread and the capital intensity required to
              scale mass satellite manufacturing across four European facilities, our formal investment recommendation
              is Hold / Staged Co-Investment with Medium confidence. Investors should resist paying ahead of operational
              milestones and instead condition capital deployment on verifiable orbital deliveries and sovereign
              contract margin realization.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV013
      - number: '8.2'
        title: Core Diligence Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis rests on Europe's accelerating demand for sovereign space infrastructure, where
              Open Cosmos serves as a premier prime contractor delivering end-to-end mission design, orbital
              connectivity, and AI-enabled Earth observation data services. With more than $370 million in customer
              contracts signed over the past three and a half years and roughly $175 million booked in 2025 alone,
              commercial traction is tangible. The anti-thesis, however, centers on severe operational dependencies and
              execution friction. Open Cosmos remains entirely reliant on external launch providers, primarily SpaceX
              and Blue Origin, creating vulnerability to launch scarcity and multi-month deployment slips. Furthermore,
              independent industry observers caution that the company's advertised production capacity of one satellite
              per day across its UK, Spanish, Portuguese, and Greek facilities represents theoretical factory throughput
              rather than sustained orbital delivery, leaving margin discipline vulnerable as headcount and fixed
              overhead expand.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Scenario Analysis and Valuation Multiple Discipline
        blocks:
          - type: paragraph
            body: >-
              Evaluating Open Cosmos requires weighing its historical capital efficiency against the sharp step-up in
              valuation implied by its Series C round. Prior to September 2026, the company had raised approximately $63
              million in equity, demonstrating rare capital discipline for a hardware manufacturer. The €300 million
              Series C expands total funding beyond $390 million and prices the business at an implied trailing revenue
              multiple that could exceed 10x if the $2 billion valuation figure is accurate, or a more palatable 5x to
              6x at the $1 billion mark. Under our base-case scenario, steady European institutional procurement yields
              a fair valuation range between $1.2 billion and $1.8 billion. A bull-case scenario driven by rapid
              adoption of 30-minute latency Earth observation and ConnectedCosmos services justifies $2.5 billion to
              $3.5 billion, while a bear-case scenario plagued by launch delays and margin dilution compresses fair
              value to $400 million to $600 million.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
      - number: '8.4'
        title: Recommendation Decision Logic and Trade-Offs
        blocks:
          - type: paragraph
            body: >-
              Our recommendation framework systematically traces the interaction between external sovereign macro
              drivers, company-specific operational accomplishments, structural bottlenecks, and entry valuation terms.
              The macro backdrop is exceptionally favorable, with global venture investment in space startups surging
              past $11.3 billion in the first half of 2026 and European governments aggressively prioritizing strategic
              autonomy. Open Cosmos has captured this momentum alongside peers like The Exploration Company.
              Nonetheless, an investment decision cannot treat macro tailwinds as a substitute for microeconomic price
              discipline. Because satellite hardware delivery schedules are bounded by launch vehicle availability
              rather than factory floor capacity, expanding fixed overhead without guaranteed launch slots creates cash
              drag. Consequently, our decision logic dictates holding back primary equity participation unless entry
              terms reflect conservative base-case valuation assumptions and strong downside liquidation protections.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.5'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos' scale, profitable operating foundation, and institutional shareholder syndicate position the
              company for a dual-track liquidity path over a 3-to-5-year horizon, encompassing either a European public
              listing or a strategic acquisition by a major defense and aerospace prime. Achieving an exit at premium
              multiples depends on successfully converting raw satellite hardware manufacturing into high-margin
              recurring data services. Before committing capital to secondary liquidity or follow-on tranches,
              prospective investors must resolve critical diligence asks: obtaining the definitive Series C term sheet
              to determine liquidation preference seniority, auditing segment-level gross margins between hardware and
              data services, and inspecting binding launch manifest agreements. Immediate thesis-break triggers include
              two or more consecutive quarters of negative operating cash flow, launch manifest delays exceeding six
              months, or contract cancellations from anchor European government customers.
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV014
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Disciplined Hold / Staged Co-Investment'
            body: >-
              Open Cosmos presents a compelling combination of European sovereign tailwinds and a rare five-year
              profitable operating record, but conflicting post-Series C valuation marks ($1B to $2B) and launch
              bottleneck risks warrant pricing discipline. Investors should pace commitments to verified orbital
              delivery milestones rather than theoretical factory capacity.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV013
          - type: callout
            title: Launch Dependency and Execution Friction
            body: >-
              Despite four operational manufacturing facilities across Europe, Open Cosmos remains fundamentally exposed
              to third-party launch scarcity and schedule delays. Any disruption in global launch cadence will directly
              impair the conversion of its $370 million customer contract backlog into recognized data intelligence
              revenue.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV009
