      - number: '5.2'
        title: OpenConstellation Subsystems and Onboard Edge Computing
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of OpenConstellation is its modular, interoperable constellation
              architecture that decouples instrument payloads from standard satellite buses. The platform accommodates
              optical sensors, telecommunications transceivers, space situational awareness detectors, and IoT relay
              packages through standardized mechanical, electrical, thermal, and data interfaces. A defining technical
              capability in next-generation OpenConstellation spacecraft is onboard artificial intelligence processing
              coupled with inter-satellite communication links. Conventional low Earth orbit missions suffer from
              significant downlink latency, frequently requiring hours to wait for an assigned ground-station pass
              before transmitting raw payloads. By executing computer vision inference and anomaly classification
              directly on orbit, Open Cosmos satellites compress actionable intelligence delivery times from up to 48
              hours down to approximately 30 minutes, which is vital for wildfire tracking, maritime interdiction, and
              disaster response. Automated data pipelines in DataCosmos subsequently catalog and distribute these
              products.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
