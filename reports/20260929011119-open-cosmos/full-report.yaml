      - number: '6.3'
        title: Retention Dynamics, Expansion Friction, and Customer Concentration Realities
        blocks:
          - type: paragraph
            body: >-
              Customer durability and revenue retention at Open Cosmos are governed by the bifurcated nature of space
              infrastructure procurement versus downstream data consumption. Dedicated spacecraft build and launch
              contracts under OpenOrbit are inherently episodic, requiring successful on-orbit demonstration before
              customers commit to constellation expansions. Expansion within OpenConstellation relies on a data-sharing
              mutualisation mechanism: participating organisations contribute satellite assets or sensor feeds to the
              pool in exchange for reciprocal access to global multi-sensor data, creating strong network effects and
              switching costs. However, commercial retention metrics—including net revenue retention, gross revenue
              retention, and annual logo churn—remain completely undisclosed. Third-party commercial databases such as
              LeadIQ estimate Open Cosmos' trailing annual revenue between only $1 million and $10 million as of August
              2026, contrasting sharply with the $370 million in headline contract signings and indicating that
              recognized revenue represents only a fraction of multi-year contract values. Furthermore, customer
              concentration risk is exceptionally high: sovereign government programmes, European institutional
              consortia, and anchor commercial accounts like Sateliot account for the vast majority of cumulative
              contract value. Downstream adoption among industrial software users remains constrained by competition
              from established satellite data incumbents like Planet Labs and Airbus, alongside external bottlenecks
              such as global launch capacity shortages on commercial rockets.
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU012
              - CU014
              - CU015
              - CU016
