      - number: '7.2'
        title: Licensing progress is visible, but continuing obligations are not
        blocks:
          - type: paragraph
            body: >-
              The available evidence confirms that licensing is operationally relevant, not that the full regulatory
              posture is cleared. Open Cosmos includes licensing and insurance in its end-to-end service, and TNW
              reports that its first ConnectedCosmos satellites were delivered within two and a half months of securing
              Ka-band spectrum filings. Neither source, however, publishes the filing holder, renewal conditions,
              coverage jurisdictions, coordination milestones, insurance limits, or consequences of non-compliance. The
              same evidence boundary applies to security: the official site describes a secure, sovereign LEO network,
              but the assigned source set contains no independent certification, penetration-test result, service-level
              history, or incident log. This is not evidence that incidents or compliance problems exist, nor is the
              absence of a disclosed incident proof that none occurred. Until primary filings and assurance records are
              reviewed, spectrum continuity, mission licensing, security controls, and procurement eligibility remain
              material diligence items rather than verified mitigations.
            claimRefs:
              - CR004
