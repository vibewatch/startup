      - number: '4.2'
        title: Operating Cost Structure, Capex Drivers, and Service Delivery Economics
        blocks:
          - type: paragraph
            body: >-
              The operating economics of Open Cosmos reflect a hybrid between specialized aerospace hardware
              manufacturing and recurring cloud intelligence delivery. Operating across four manufacturing sites in the
              United Kingdom, Spain, Portugal, and Greece, the company has industrialized satellite assembly with an
              architected throughput capacity of up to one satellite per day. By employing standardized nanosatellite
              (3U, 16U) and microsatellite (12U) form factors, Open Cosmos limits recurring non-recurring engineering
              (NRE) overhead across missions. Key cost of goods sold (COGS) drivers encompass flight-proven avionics and
              structural hardware components, third-party optical and hyperspectral payload procurement, ride-share
              launch broker fees across providers such as SpaceX, Rocket Lab, and Arianespace, and ground station
              downlink bandwidth.


              Labor constitutes a substantial operating expenditure baseline, supporting approximately 400 specialized
              engineers, software developers, and mission operators across four European jurisdictions. Despite the
              capital-intensive nature of orbital hardware development, company disclosures report operational
              profitability (positive EBITDA) since 2020 and five consecutive years of profitable expansion through
              September 2026. However, exact gross margin profiles for hardware delivery versus software analytics
              remain closely held private figures. Service-delivery costs are structurally lower on the DataCosmos
              software tier due to reusable cloud processing pipelines, whereas initial space segment manufacturing and
              launch campaigns require significant up-front working capital and carry launch schedule slip dependencies.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
