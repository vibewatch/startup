  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Strategic Peer Groups
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding Open Cosmos spans three distinct operational segments: turnkey small
              satellite manufacturing, mutualized Earth observation (EO) data infrastructure, and low Earth orbit (LEO)
              telecommunications connectivity. In the LEO broadband and connectivity domain, Open Cosmos directly faces
              massive capital-intensive incumbents such as SpaceX's Starlink constellation and Eutelsat's OneWeb fleet.
              While Starlink and OneWeb deploy thousands or hundreds of high-throughput communications satellites
              optimized for global consumer and enterprise broadband, Open Cosmos positions its ConnectedCosmos
              architecture around sovereign European communications and direct-to-device IoT. Open Cosmos validated this
              transition into orbital telecom operations on January 22, 2026, launching its first two proprietary LEO
              telecom spacecraft aboard a Rocket Lab Electron rocket into a 1,050 km circular orbit following Ka-band
              spectrum authorization from Liechtenstein. In the Earth observation and satellite platform manufacturing
              segment, Open Cosmos competes against specialized NewSpace hardware providers, cubesat manufacturers, and
              traditional aerospace primes. Instead of requiring government customers to fully capitalize dedicated
              constellations, Open Cosmos offers OpenConstellation, a shared satellite infrastructure where
              institutional partners pool orbital assets and share data access to achieve high revisit frequencies and
              reduced latency down to 30 minutes. However, commercial space data aggregators and status-quo national
              defense procurements represent persistent substitutes that continue to favor established sovereign
              contractors or legacy geostationary operators.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
