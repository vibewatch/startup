      - number: '6.2'
        title: Commercial Adoption Trajectory, Contract Scale, and Named Deployments
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Open Cosmos demonstrates rapid top-line contract expansion contrasted with
              opaque operational deployment milestones. Between early 2023 and September 2026, the company signed over
              $370 million in cumulative customer contracts, including approximately $175 million secured during the
              2025 calendar year from governments and enterprises for Earth observation data addressing natural
              disasters such as floods and wildfires. This commercial momentum supported five consecutive years of
              self-reported profitable growth, culminating in a €300 million Series C equity round in September 2026.
              Named production deployments validate the operational viability of its spacecraft manufacturing and
              orbital delivery. In the IoT telecommunications vertical, Spanish satellite operator Sateliot contracted
              Open Cosmos in July 2020 to build and operate a low-Earth-orbit nanosatellite constellation for 5G IoT
              connectivity, launching commercial demonstration SmallSats in March 2021. Concurrently, Lacuna Space
              deployed an IoT communications satellite manufactured at Open Cosmos' Harwell facility on the same
              rideshare flight. For sovereign remote sensing, Open Cosmos delivered Greece's first satellite
              constellation, institutional Earth observation platforms including Menut and Platero, and the co-funded
              MANTIS spacecraft with the UK Space Agency and ESA. In emerging markets, the Guinean government initiated
              bilateral negotiations in April 2024 to explore satellite internet partnerships targeting rural digital
              divide mitigation. Despite these public milestones, contract conversion timelines remain protracted, and
              production deployments are shadowed by unverified mission denominators.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
