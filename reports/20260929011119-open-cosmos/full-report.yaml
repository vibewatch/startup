              - CO009
              - CO010
      - number: '1.3'
        title: Capitalization Trajectory, Commercial Traction, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos pursued a disciplined financing strategy through its early lifecycle, raising just $7 million
              in external capital prior to late 2023 by prioritising organic commercialisation and customer-funded
              development. In September 2023, the company closed a $50 million Series B round backed by impact investors
              ETF Partners, Trill Impact, and A&G, supported by corporate and venture participants including Accenture
              Ventures, Santander InnoEnergy Climate Tech Fund, and Claret Capital Partners. This culminated in
              September 2026 with a landmark €300 million ($348 million) Series C equity round led by Lightrock, with
              participation from ETF Partners, Institut Català de Finances, Entrepreneurs First, the UK National
              Security Strategic Investment Fund, Convex Group, Phoenix Court, and two major international pension
              funds. The financing vaulted Open Cosmos to a $1 billion unicorn valuation, reflecting surging demand for
              sovereign European space assets. In commercial press announcements, Open Cosmos reported five consecutive
              years of profitable growth and over $370 million in cumulative customer contracts signed across a
              three-and-a-half-year period. However, independent diligence reveals significant information asymmetries:
              commercial intelligence databases such as LeadIQ estimate baseline annual revenue between only $1 million
              and $10 million as of mid-2026, while the claimed 100% mission success rate lacks full disclosure of
              completed versus ongoing orbital missions. Furthermore, reported headcount figures range from 287 on
              automated tracker databases to close to 400 in official announcements, requiring verified audited
              financial statements and launch logs to substantiate sovereign manufacturing claims.
