    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation Stance
        - Hold / Staged Co-Investment
        - €300M Series C round closed September 2026 led by Lightrock and ETF Partners
        - Avoid aggressive unpriced primary participation; await valuation clarity and delivery milestones
      - - Confidence Level
        - Medium Confidence
        - Conflicting valuation marks ($1B vs $2B) and absence of audited segment financial reports
        - Size position conservatively; require full capitalization table and preference disclosures
      - - Risk Rating
        - High Operational & Financing Risk
        - Severe dependence on external launch providers (SpaceX, Blue Origin) and capital intensity of 4 factories
        - Incorporate downside protection through senior liquidation preference or structured warrants
      - - Valuation Stance
        - Fair to Fully Valued
