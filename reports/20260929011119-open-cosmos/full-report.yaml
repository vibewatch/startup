  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: A bounded end-to-end space-infrastructure market
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than the entire space economy and broader than satellite manufacturing
              alone. Open Cosmos presents an end-to-end mission service covering assembly, integration and testing,
              launch campaign support, in-orbit operations, data delivery, insurance, and licensing. It then extends
              into shared Earth-observation infrastructure, imagery processing, and sovereign broadband and IoT
              connectivity. This chapter therefore includes spend for turnkey small-satellite missions and the attached
              data or connectivity services. It excludes launch-provider revenue, unrelated geospatial software, generic
              cloud infrastructure, and large spacecraft programs unless Open Cosmos is the contracted mission or
              service provider. Status-quo substitutes include a government-owned dedicated constellation, buying
              imagery from another operator, terrestrial monitoring and communications, or delaying procurement.
