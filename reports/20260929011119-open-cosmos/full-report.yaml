chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Business Architecture
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos was founded in 2015 by Chief Executive Officer Rafel Jorda Siquier alongside Aleix Megias
              Homar, establishing its operational headquarters at the Harwell space cluster in Oxfordshire, United
              Kingdom. The company was conceived to simplify and democratise access to space infrastructure and orbital
              data, addressing systemic barriers in mission lead time, capital intensity, and data distribution. Over a
              decade of execution, Open Cosmos has expanded from launching standalone technology demonstrators for
              volcano and wildlife tracking into an integrated multinational space enterprise with manufacturing,
              engineering, and software facilities operating across the UK, Spain, Portugal, and Greece. Across these
              four locations, the company employs close to 400 personnel, providing sovereign industrial depth rare
              among venture-backed European space hardware providers. Its commercial architecture is organised around
              four vertically integrated platforms: OpenOrbit delivers turnkey spacecraft design, assembly, integration,
              testing, launch brokering, and in-orbit operations; OpenConstellation provides a shared orbital
              infrastructure model where institutional and commercial partners co-fund and mutually access constellation
              capacity; ConnectedCosmos offers sovereign broadband and direct-to-device IoT communications; and
              DataCosmos ingests multi-sensor satellite imagery to deliver AI-driven Earth observation analytics. This
              integrated structure allows non-traditional space users, including regional governments, emergency
              responders, and natural resource managers, to access actionable orbital intelligence without deploying
              proprietary satellite fleets.
