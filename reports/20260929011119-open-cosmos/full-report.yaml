      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              The leadership architecture of Open Cosmos reflects a blend of technical aerospace engineering roots and
              seasoned institutional governance. Founder and Chief Executive Officer Rafel Jorda Siquier has led the
              company since inception, serving as its primary public advocate and strategic architect. Co-founder Aleix
              Megias Homar contributed to early mission engineering and technical design, establishing the initial
              hardware foundations before the organisation scaled into mass manufacturing. Executive leadership
              encompasses functional operational leads spanning commercial revenue, data platforms, and corporate
              communications across its distributed European hubs. Because technical mission delivery and investor
              syndication remain heavily concentrated around Jorda Siquier, Open Cosmos exhibits material key-person
              dependence typical of founder-led aerospace ventures. To institutionalise oversight and meet rigorous
              sustainability standards required by European public and institutional customers, Open Cosmos implemented
              formal corporate governance and impact monitoring frameworks. The governance structure explicitly
              benchmarks operations against the United Nations Sustainable Development Goals and the European Union
              environmental taxonomy. Internal corporate disclosures indicate that in 2023, 73% of Open Cosmos missions
              directly aligned with EU taxonomy objectives, with corporate governance tracking environmental metrics,
              mission safety, and regulatory compliance across its operating subsidiaries in the UK and European Union
              member states.
            claimRefs:
              - CO002
              - CO009
              - CO010
              - CO011
