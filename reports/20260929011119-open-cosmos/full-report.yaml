      - number: '2.3'
        title: Public-sector sovereignty leads; budget ownership remains opaque
        blocks:
          - type: paragraph
            body: >-
              The disclosed buyer universe includes governments, institutions, businesses, space agencies, and energy or
              infrastructure operators. Four adoption paths follow from the product architecture: procure a dedicated
              mission through OpenOrbit, share infrastructure through OpenConstellation, consume imagery and algorithms
              through DataCosmos, or deploy sovereign broadband and IoT through ConnectedCosmos. Shared infrastructure
              can reduce the entry barrier for smaller states that cannot justify a standalone constellation. However,
              the assigned evidence does not identify the contracting authority, budget line, procurement cycle, user
              seat, pricing unit, or renewal mechanism for any segment. As a result, payer and budget-owner assignments
