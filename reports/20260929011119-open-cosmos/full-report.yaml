      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract Backlog vs Recognized Revenue Divergence
            body: >-
              Open Cosmos' headline signing of over $370 million in customer contracts across three and a half years
              highlights tremendous market appetite for sovereign European space systems. However, third-party
              intelligence estimates placing annual revenue between $1 million and $10 million indicate that space
              infrastructure contracts feature extended delivery timelines and milestone-based revenue recognition.
              Investors must scrutinize audited cash conversion cycles and contract cancellation provisions.
            calloutType: insight
            claimRefs:
