      - number: '4.3'
        title: Public Commercial Traction, Capital Adequacy, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Open Cosmos has demonstrated commercial momentum in European space technology, reporting more than $370
              million in cumulative customer contracts signed between early 2023 and September 2026. This commercial
              traction includes significant anchor customer commitments such as national Earth observation
              constellations (including Greece's sovereign satellite program), commercial IoT constellations for
              operators like Sateliot, and strategic climate data programs with institutional partners including the
              European Space Agency and Accenture. Reported annual contract awards reached approximately $175 million in
              the trailing twelve months leading into late 2026, representing a meaningful acceleration over historical
              run-rates.


              Capital adequacy was substantially reinforced on September 14, 2026, when Open Cosmos secured €300 million
              (approximately $346 million to $348 million) in Series C equity financing led by Lightrock, with
              participation from ETF Partners, Institut Català de Finances, Entrepreneurs First, the UK National
              Security Strategic Investment Fund (NSSIF), Phoenix Court, and two major international pension funds. This
              raise established a headline post-money valuation at unicorn scale ($1.0 billion to $2.0 billion reported
              across market sources) and provides a runway surplus intended to fund four-factory industrial automation
              and constellation expansion. From an underwriting standpoint, while reported five-year profitable growth
              and contract backlog demonstrate genuine commercial viability, the lack of audited public financial
              disclosures regarding cash burn rates, net margins, customer concentration, and realized revenue
              recognition leaves material blind spots for institutional underwriting.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
