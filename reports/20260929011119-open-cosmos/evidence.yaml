evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-revenue-recognition
    missingEvidence: >-
      Audited financial statements confirming revenue recognition, gross margin breakdown between hardware manufacturing
      and data services, and current annual recurring revenue (ARR).
    whyItMatters: >-
      Validates whether the reported $370 million in contract signings translates into recognized revenue and sustains
      the claimed five years of profitable growth.
    diligencePath: >-
      Review UK Companies House statutory accounts for Open Cosmos Ltd and request confidential management accounts
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: orbital-mission-denominators-and-executive-roster
    missingEvidence: >-
      Comprehensive manifest of all orbital satellite missions launched to date, along with the complete non-executive
      board and executive committee directory.
    whyItMatters: >-
      Establishes the exact denominator behind the claimed 100% mission success rate and verifies board governance
      oversight.
    diligencePath: Cross-check public space-track catalogs, Jonathan's Space Report, and Companies House director appointments.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A category-level spend dataset or bottom-up buyer, unit, price, geography, and adoption model that can support
      TAM, SAM, and SOM.
    whyItMatters: >-
      Without a customer-spend denominator, capital raised and company contract values cannot establish market size or
      obtainable share.
    diligencePath: >-
      Obtain third-party space-infrastructure and Earth-observation spend data, then reconcile it to Open Cosmos's
      product scope, geographies, pricing units, and capacity.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Named contracting authorities, budget lines, procurement stages, sales-cycle lengths, pricing units, and renewal
      structures by buyer segment.
    whyItMatters: >-
      Buyer interest cannot be converted into sales-cycle, win-rate, retention, or serviceable-market assumptions
      without knowing who controls the budget.
    diligencePath: >-
      Request a redacted contract cohort and procurement map segmented by government, agency, institution, energy,
      infrastructure, data, and connectivity buyer.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: contracts-and-revenue
    missingEvidence: >-
      A reconciled schedule connecting signed contract value, remaining backlog, recognized revenue, recurring revenue,
      cancellations, cash collection, and contract period.
    whyItMatters: >-
      The $370 million contract claim, approximately $175 million prior-year report, and LeadIQ's $1 million to $10
      million revenue estimate use different and opaque denominators.
    diligencePath: >-
      Reconcile contract-level bookings to audited revenue and cash collection by year, customer type, product line, and
      recurring versus mission revenue.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Quantified evidence for launch slots, spectrum and licensing lead times, factory utilization, deployment cadence,
      customer ROI, switching costs, and service margins.
    whyItMatters: >-
      These constraints determine whether apparent sovereign demand becomes deployed capacity, recurring usage, and
      defensible economics.
    diligencePath: >-
      Request launch manifests, licensing timelines, utilization records, deployment milestones, renewal cohorts,
      customer ROI studies, and segment gross margins.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited annual statutory financial statements including detailed profit and loss statements, balance sheet cash
      balances, and cash flow from operations.
    whyItMatters: >-
      While Open Cosmos reports positive EBITDA and profitable growth, audited financial statements are necessary to
      confirm cash conversion, revenue recognition timing, and debt service obligations.
    diligencePath: >-
      Obtain statutory accounts filed with Companies House (UK) and regional registries for European operating
      subsidiaries, or request an investor data room financial pack.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: unit-margins
    missingEvidence: >-
      Segmented gross margin reporting distinguishing turnkey hardware satellite delivery (OpenOrbit) from recurring
      software data licensing (DataCosmos).
    whyItMatters: >-
      Turnkey hardware missions typically carry lower gross margins and working capital drag, whereas cloud intelligence
      commands software-tier margins; understanding margin mix is critical for valuation underwriting.
    diligencePath: >-
      Request management presentation breaking down COGS by launch fees, hardware BOM, sensor payloads, and cloud
      operations.
    relatedQuestionRefs:
      - QI008
  - type: enumeration-incomplete
    severity: material
    topic: orbital-throughput-and-launch-manifests
    missingEvidence: >-
      Independent audit of cumulative satellites manufactured, successfully placed into orbit, and operational
      on-station across all four European facilities, alongside contracted launch manifests through 2027.
    whyItMatters: >-
      Diligence cannot verify whether the stated capacity of one satellite per day translates into realized launch
      throughput or validate the denominator underlying the claimed 100% orbital success rate.
    diligencePath: >-
      Request comprehensive flight logs, space agency licensing records, satellite registry entries, and commercial
      launch contracts under NDA.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited customer renewal rates, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annual logo churn
      for DataCosmos and ConnectedCosmos services.
    whyItMatters: >-
      Without retention and recurring revenue metrics, investors cannot verify whether downstream software and data
      subscriptions are replacing episodic satellite manufacturing contracts.
    diligencePath: >-
      Request audited revenue schedules under non-disclosure agreement detailing customer cohort retention, annual
      recurring revenue (ARR), and backlog recognition schedules.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Complete customer master registry detailing non-public defense, intelligence, and commercial constellation
      customer accounts and individual contract values.
    whyItMatters: >-
      Public customer disclosures represent only a subset of the $370 million contracted volume, leaving customer
      concentration and counterpart credit quality unverified.
    diligencePath: >-
      Obtain customer concentration breakdown from management showing top-10 customer shares of contracted backlog and
      trailing billings.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-evidence-gap
    missingEvidence: >-
      Primary spectrum filings, mission licences, insurance schedules, public-procurement conditions, and regulator
      correspondence.
    whyItMatters: >-
      Operating authority, launch eligibility, coverage rights, and loss protection cannot be verified from company
      descriptions or secondary reporting.
    diligencePath: >-
      Request a jurisdiction-by-jurisdiction licence register and policy schedule, then verify each identifier and
      current status with the issuing authority or insurer.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-assurance
    missingEvidence: >-
      Mission-level denominator, accepted-unit throughput, yield, rework, anomaly, outage, security-control, and
      service-level records.
    whyItMatters: >-
      Capacity and mission-success headlines do not establish repeatable production quality, operating reliability, or
      security performance.
    diligencePath: >-
      Review the complete mission and factory KPI ledger, independent quality audits, security assurance reports,
      customer SLAs, and incident register.
    relatedQuestionRefs:
      - QR004
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-comparability
    missingEvidence: >-
      Audited revenue, gross margin, operating cash flow, cash balance, financing terms, backlog composition, milestone
      receipts, cancellations, and customer concentration.
    whyItMatters: >-
      Funding raised and signed contract value do not establish cash available, runway, recognized revenue,
      profitability quality, or working-capital resilience.
    diligencePath: >-
      Obtain audited accounts, bank evidence, financing documents, customer-level backlog, milestone schedules, and a
      contract-to-revenue-and-cash bridge.
    relatedQuestionRefs:
