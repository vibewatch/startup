  title: "Product & Technology"
  summary: "Open Cosmos delivers end-to-end small satellite mission infrastructure spanning modular spacecraft manufacturing across four European factories, onboard AI edge processing that cuts intelligence delivery from 48 hours to 30 minutes, and the shared OpenConstellation platform for mutualised Earth observation and connectivity."
sections:
  - id: "end-to-end-space-mission-service-model"
    title: "End-to-End Space Mission Infrastructure and Platform Delivery"
    body: "Open Cosmos delivers an end-to-end small satellite mission delivery model that combines custom and standardized spacecraft development, environmental qualification, launch campaign coordination, orbital operations, and downstream data distribution. Rather than operating purely as a component vendor or pure-play data aggregator, the company integrates hardware manufacturing with space-to-cloud software platforms. Its primary market-facing offerings are structured across four operational platforms: OpenOrbit, which provides turnkey bus design, payload integration, and mission management; OpenConstellation, a shared satellite infrastructure network enabling institutional and commercial users to access distributed Earth observation; ConnectedCosmos, providing sovereign broadband and direct IoT links; and DataCosmos, an online intelligence platform for ingesting and processing satellite imagery. By standardizing interfaces across these platforms, Open Cosmos lowers non-recurring engineering barriers for regional space programs and commercial operators."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "openconstellation-architecture-edge-ai"
    title: "OpenConstellation Subsystems and Onboard Edge Computing"
    body: "The core technical differentiator of OpenConstellation is its modular, interoperable constellation architecture that decouples instrument payloads from standard satellite buses. The platform accommodates optical sensors, telecommunications transceivers, space situational awareness detectors, and IoT relay packages through standardized mechanical, electrical, thermal, and data interfaces. A defining technical capability in next-generation OpenConstellation spacecraft is onboard artificial intelligence processing coupled with inter-satellite communication links. Conventional low Earth orbit missions suffer from significant downlink latency, frequently requiring hours to wait for an assigned ground-station pass before transmitting raw payloads. By executing computer vision inference and anomaly classification directly on orbit, Open Cosmos satellites compress actionable intelligence delivery times from up to 48 hours down to approximately 30 minutes, which is vital for wildfire tracking, maritime interdiction, and disaster response. Automated data pipelines in DataCosmos subsequently catalog and distribute these products."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "industrial-manufacturing-ground-automation"
    title: "Multi-Factory Manufacturing and Ground Segment Operations"
    body: "Industrial execution at Open Cosmos is organized around a multi-facility European manufacturing footprint, with operational sites located across the United Kingdom, Spain, Portugal, and Greece. The company reports an aggregate manufacturing capacity capable of producing up to one satellite per day across its cleanrooms and assembly bays, reflecting an automated flow line approach rather than artisanal space engineering. Technical innovation and system architecture are driven by the CTO division, which coordinates the OpenSat spacecraft engineering teams, the OpenApp software developers, and the OpenOPS mission control division. To support growing constellation flight operations, Open Cosmos deploys automated mission control systems that handle pass scheduling, fleet command and control, and telemetry health diagnostics. Ongoing technical recruitment for automation architects emphasizes Python and Bash scripting, CI/CD pipeline orchestration, and event-driven distributed frameworks to seamlessly bridge production testing with operational orbital control."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE009"
      - "CE013"
    tableRefs:
      - "TE003"
  - id: "technical-dependencies-launch-bottlenecks"
    title: "Technical Dependencies, Launcher Constraints, and Operational Diligence Gaps"
    body: "Despite rapid hardware development cycles—demonstrated by deploying initial ConnectedCosmos satellites within two and a half months of securing Ka-band radio frequency filings—the operating architecture faces critical external dependencies. Most prominently, Open Cosmos does not operate its own launch vehicles and remains fundamentally dependent on commercial launch providers such as SpaceX, Blue Origin, and European agency manifests. Global launch capacity shortages, manifest delays, and rideshare dispenser scheduling represent major operational bottlenecks beyond company control. Furthermore, while Open Cosmos reports a 100% mission success rate across its orbital flights, public reporting leaves the precise cumulative denominator of successfully deployed and operating satellites unverified. Similarly, the stated one-satellite-per-day manufacturing capacity reflects maximum tooling throughput rather than verified steady-state flight heritage. Technical diligence requires direct verification of cumulative flight telemetry, supplier dependencies, and firm launch manifests."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE014"
