chapter:
  number: 7
  title: "Risks"
  summary: "The highest residual risks are execution rather than demand: Open Cosmos must turn a claimed one-satellite-per-day capacity into accepted output while relying on externally supplied launch capacity. A €300 million round reduces immediate financing pressure but does not establish cash availability, runway, contract-to-revenue conversion, regulatory continuity, or independently verified security and reliability."
sections:
  - id: "ranked-operating-risks"
    title: "Launch access and the factory ramp dominate residual exposure"
    body: >-
      Launch access and manufacturing execution rank above the other reviewed risks because both sit directly on the delivery path. The supplier listing records six named Open Cosmos missions on Falcon 9 from January 2023 through August 2024, while KuCoin's syndicated industry coverage calls launch-capacity shortages a continuing bottleneck; older Soyuz missions show some historical provider diversity but not a current fallback plan. At the same time, the company describes one satellite per day across four factories as capacity, not demonstrated output, and independent coverage explicitly questions whether margin discipline will survive the ramp. The DOVER payload loss on Virgin Orbit also shows why an in-orbit success claim cannot substitute for launch-chain reliability. Mitigations are only partially visible: Open Cosmos includes insurance and launch campaigns in its service scope and has flown through more than one provider, but public evidence does not disclose future slots, policy limits, accepted-unit yield, supplier concentration, or re-flight economics. Those omissions keep launch and production risk at high residual exposure.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "regulatory-security-and-assurance"
    title: "Licensing progress is visible, but continuing obligations are not"
    body: >-
      The available evidence confirms that licensing is operationally relevant, not that the full regulatory posture is cleared. Open Cosmos includes licensing and insurance in its end-to-end service, and TNW reports that its first ConnectedCosmos satellites were delivered within two and a half months of securing Ka-band spectrum filings. Neither source, however, publishes the filing holder, renewal conditions, coverage jurisdictions, coordination milestones, insurance limits, or consequences of non-compliance. The same evidence boundary applies to security: the official site describes a secure, sovereign LEO network, but the assigned source set contains no independent certification, penetration-test result, service-level history, or incident log. This is not evidence that incidents or compliance problems exist, nor is the absence of a disclosed incident proof that none occurred. Until primary filings and assurance records are reviewed, spectrum continuity, mission licensing, security controls, and procurement eligibility remain material diligence items rather than verified mitigations.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"
    figureRefs: []
  - id: "financial-counterparty-and-kill-criteria"
    title: "Funding supports scale, but public evidence does not show conversion economics"
    body: >-
      The September 2026 financing is substantial but should not be treated as cash available or runway. TNW and YourInfoDaily report a €300 million Series C intended to expand manufacturing and services, while also repeating company claims of five consecutive profitable years and more than $370 million of contracts signed over three and a half years. LeadIQ separately estimates August 2026 annual revenue at $1 million to $10 million, but annual revenue, cumulative signed contract value, accounting profit, and cash receipts are different metrics and periods; the sources do not reconcile them. Public-sector exposure is also visible through company posts about Greece's SmallSat programme and UK TacSys approved-provider status, yet no customer-level revenue denominator or task-order value is disclosed. Investment monitoring should therefore focus on accepted satellite output, contracted launch redundancy, audited revenue and operating cash conversion, customer concentration, spectrum continuity, and independent security assurance. Thesis-break events are loss or suspension of a required licence, repeated inability to secure launch slots, failure to convert funded capacity into accepted deliveries, or audited cash consumption that materially outruns contract receipts.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
    figureRefs: []
