callouts:
  - calloutType: "risk"
    title: "The mission-success headline excludes a visible launch-chain loss"
    body: "TNW notes that the reported 100% mission-success ratio lacks a denominator, while Wikipedia and the supplier listing identify DOVER as lost on the Virgin Orbit mission. Diligence should reconcile launch failures, in-orbit commissioning, operating lifetime, anomalies, and customer acceptance in one mission-level denominator."
    claimRefs:
      - "CR002"
      - "CR009"
  - calloutType: "recommendation"
    title: "Do not convert funding or contract headlines into runway"
    body: "The €300 million round, cumulative signed-contract claim, LeadIQ annual-revenue estimate, and company profitability claim use different definitions and periods. Require audited statements, cash balances, financing terms, milestone schedules, and a backlog-to-revenue bridge before underwriting liquidity or margin resilience."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
