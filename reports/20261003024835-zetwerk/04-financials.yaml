callouts:
  - calloutType: "insight"
    title: "Revenue Scale Masked by Low-Margin Commodity Pass-Through"
    body: "While Zetwerk's consolidated revenue surged 40.4% to ₹15,913.32 crore in FY26, over 41% of the top-line stems from Terra91's raw material and commodity trading operations. This commodity aggregation segment generates high gross volume but paper-thin gross margins, significantly diluting consolidated profit margins relative to pure-play manufacturing platforms."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI005"
  - calloutType: "risk"
    title: "Working Capital Burn Outpaces Adjusted EBITDA Gains"
    body: "Despite reporting ₹421.34 crore in adjusted EBITDA for FY26, operating cash flows deteriorated to an outflow of ₹681.53 crore as inventories and receivables expanded to over ₹3,579 crore. Zetwerk's cash-generative profile remains heavily constrained by extended customer payment terms, necessitating continuous working capital debt facilities."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI009"
  - calloutType: "recommendation"
    title: "De-Leveraging via IPO Proceeds is Essential for Bottom-Line Health"
    body: "Allocating ₹1,800 crore of the proposed ₹2,600 crore fresh IPO issue toward debt reduction is a vital strategic measure. By paying down a substantial portion of its ₹1,936.16 crore in total borrowings, Zetwerk can eliminate significant finance costs (which exceeded ₹366 crore in FY26) and improve its trajectory toward positive consolidated cash flows."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
