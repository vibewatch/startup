company:
  name: "Zetwerk"
chapter:
  number: 4
  title: "Financials"
  summary: "Zetwerk achieved consolidated operating revenue of ₹15,913.32 crore in FY26, rebounding 40.4% year-over-year behind strong growth in its core Manufacturing Business, but underlying gross profitability remains diluted by low-margin raw material trading. While adjusted EBITDA rose to ₹421.34 crore, reported net losses widened sharply to ₹1,606.17 crore due to large exceptional items and civil infrastructure write-offs, while negative operating cash flow (-₹681.53 crore) underscores continuous working capital absorption that makes the proposed ₹1,800 crore IPO debt prepayment essential for balance sheet stabilization."
sections:
  - id: "revenue-streams-and-vertical-mix"
    title: "Revenue Streams, Vertical Mix, and Pricing Mechanics"
    body: "Zetwerk operates as a technology-enabled contract manufacturing and B2B procurement platform structured across two principal operating divisions: the core Manufacturing Business and the Ecosystem Business (Terra91). In FY26, consolidated revenue from operations expanded 40.4% to ₹15,913.32 crore, rebounding vigorously from ₹11,331.86 crore in FY25. The Manufacturing Business served as the primary growth driver, expanding 50.0% to generate ₹9,374.68 crore, or 58.9% of consolidated operational turnover. Within manufacturing, Energy Products represents the dominant vertical, delivering ₹6,507.57 crore in revenue driven by utility-scale renewable components, solar mounting structures, and transmission equipment. Meanwhile, the Terra91 Ecosystem Business aggregated industrial commodities, ferrous metals, and petrochemicals, contributing ₹6,538.55 crore. Commercial monetization differs markedly across these activities: custom manufacturing relies on cost-plus and build-to-print quotation tied to bill of materials, whereas commodity trading captures transactional spreads on spot market transactions."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-margin-dynamics"
    title: "Cost Architecture, Procurement Drivers, and Operating Margins"
    body: "Zetwerk's cost profile reflects the high procurement volume inherent in managed marketplace manufacturing and commodity trade aggregation. In FY26, total operational expenditures reached ₹16,141.73 crore, dominated by purchase of stock-in-trade at ₹9,879.75 crore (61.2% of total costs) and direct material consumption of ₹3,963.67 crore (24.6% of total costs). Employee benefit expenses rose 34.9% to ₹643.77 crore as the company scaled engineering and global operational talent. Adjusted EBITDA improved 30.6% to ₹421.34 crore, though operating margins remained thin at 2.65%, moderating slightly from 2.85% in FY25. On a reported basis, restated consolidated net loss widened by 333% to ₹1,606.17 crore. This loss was heavily impacted by ₹835.84 crore in exceptional non-cash adjustments related to the conversion ratios of preference share instruments in continuing operations, alongside a ₹453.00 crore impairment loss recognized upon classifying the Civil Infrastructure Works business as discontinued."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI002"
  - id: "working-capital-and-cash-flow-absorption"
    title: "Working Capital Cycle and Operating Cash Flow Absorption"
    body: "The central underwriting challenge for Zetwerk is the divergence between accounting operating profit and cash conversion. Despite positive adjusted EBITDA, cash flow from operations remained negative for the third consecutive fiscal year, with net operating cash outflows widening to ₹681.53 crore in FY26 compared to outflows of ₹386.30 crore in FY25 and ₹281.50 crore in FY24. This recurring deficit is driven by significant working capital requirements: as of March 31, 2026, trade receivables stood at ₹2,329.93 crore and inventories reached ₹1,249.58 crore, against trade payables of ₹2,199.28 crore and acceptances of ₹1,014.45 crore. Furthermore, revenue concentration has escalated, with the top 10 enterprise clients accounting for 35.90% of total revenue in FY26, up from 26.90% in FY25. Although repeat customers generated 80.15% of Manufacturing Business revenue, extended collection cycles and customer concentration amplify credit risk and liquidity strain."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "capital-structure-and-ipo-adequacy"
    title: "Capital Structure, Leverage Profile, and IPO Underwriting Verdict"
    body: "Zetwerk's aggressive physical and geographic expansion—now encompassing 26 owned operating facilities across India, the United States, Germany, and Spain—has been supported by substantial debt accumulation. Total borrowings climbed to ₹1,936.16 crore by March 31, 2026, comprising ₹1,460.83 crore in short-term working capital borrowings and ₹475.33 crore in long-term debt, resulting in ₹366.22 crore in annual finance charges. To address this financial leverage, Zetwerk filed its Updated Draft Red Herring Prospectus (UDRHP-I) in August 2026 for a public listing comprising a fresh issue of up to ₹2,600.00 crore and an offer for sale of up to 96,837,455 equity shares. Management plans to earmark ₹1,800.00 crore of fresh proceeds toward prepaying or repaying company and subsidiary debt. Successful debt retirement is the critical catalyst required to eliminate finance cost drag and establish positive post-IPO free cash flows."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
