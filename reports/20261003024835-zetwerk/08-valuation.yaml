        - "Supply chain bottlenecks, working capital delays, customer concentration shock"
        - "25% - requires rapid margin expansion in precision components"
      - - "Base Case"
        - "Revenue CAGR of 22-26%; adjusted EBITDA margin stabilizes at 3.0-3.5%; ₹18,000M debt repaid as planned"
        - "$3.2B to $3.6B valuation (1.3x-1.5x FY27E revenue), delivering stable market-rate returns"
        - "Persistent trading gross margin dilution, competitive pricing pressure in renewables"
        - "55% - consistent with historical organic volume expansion and current run rate"
      - - "Bear Case"
        - "Revenue growth slows below 12%; international units generate continuing impairment; working capital strain persists"
