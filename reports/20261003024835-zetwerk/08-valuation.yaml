    body: "Prospective public investors should anchor entry discipline around Zetwerk's private transaction valuation of $3.0B to $3.1B (~1.6x FY26 revenue). While contract electronics peers in India command higher multiples, Zetwerk's ₹1,606.2 Cr reported statutory loss and significant marketplace trading revenue mandate a conservative multiple cap until operating margins prove durable."
