company:
  name: "Zetwerk"
chapter:
  number: 8
  title: "Valuation"
  summary: "Zetwerk approaches its Indian public listing following an updated draft red herring prospectus (UDRHP) filed in August 2026 for a ₹26,000 million fresh issue, with recent private rounds benchmarking the company at $3.0B to $3.1B. While FY26 operating revenue scaled 40.4% YoY to ₹15,913.3 Cr ($1,885M) with positive adjusted EBITDA of ₹421.3 Cr, reported net loss widened sharply to ₹1,606.2 Cr due to exceptional and impairment charges, leaving public market underwriting heavily dependent on balance sheet deleveraging and post-listing unit economics."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis and Underwriting Recommendation"
    body: "Zetwerk operates as India's leading B2B managed-marketplace contract manufacturer, connecting over 1,800 enterprise customers across energy, industrial components, electronics, and aerospace with vetted supplier facilities. The core investment thesis rests on Zetwerk capturing the secular manufacturing decentralization shift under 'Make in India' and global supply-chain diversification, demonstrating massive revenue scale that reached ₹15,913.3 Cr in FY26. However, the anti-thesis is driven by severe statutory accounting net losses of ₹1,606.2 Cr in FY26, large working-capital requirements inherent in pass-through procurement, and execution risks across capital-intensive overseas plants. Balancesheet deleveraging through ₹1,800 Cr of planned IPO debt repayment provides near-term relief, but long-term equity returns require sustainable operating cash flows. Consequently, the underwriting recommendation is established as track with medium confidence, a high risk rating, and a fair valuation stance pending post-listing earnings disclosure."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV013"
    tableRefs:
      - "TV001"
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "financing-history-and-valuation-benchmarking"
    title: "Financing Trajectory and Private Valuation Benchmarking"
    body: "Zetwerk's capitalization history reflects rapid private valuation expansion across more than 19 financing rounds, scaling from an initial seed valuation in 2018 to unicorn status in 2021 and culminating in an estimated $3.0B to $3.1B benchmark across late-stage Series F and pre-IPO transactions. In March 2025, late-stage tranches led by institutional investors including ARK Investment Management, followed by a ₹500 Cr pre-IPO investment by Bharat Value Fund in 2025-2026, pegged the firm's equity valuation at approximately $3.0B to $3.1B. Relative to FY26 operating revenue of ₹15,913.3 Cr (~$1.89B), this private mark implies an enterprise multiple of approximately 1.6x trailing revenue. While this valuation multiple appears modest compared to pure-play electronics manufacturing peers like Dixon Technologies or Kaynes Technology which trade above 4x to 8x revenue, Zetwerk's lower gross margin profile and heavy trading component justify a valuation discount."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV014"
  - id: "scenario-modeling-and-dilution-overhang"
    title: "Scenario Modeling, Dilution Overhang, and IPO Readiness"
    body: "Zetwerk's capital structure ahead of its proposed IPO comprises a substantial fresh issue of ₹26,000 million alongside an offer-for-sale (OFS) of up to 96,837,455 equity shares from promoters and early venture backers including Peak XV Partners, Accel, and Lightspeed. Out of the ₹26,000 million fresh issue proceeds, management plans to allocate ₹18,000 million (nearly 69%) toward the repayment or prepayment of outstanding borrowings, substantially de-risking the corporate balance sheet. In our base case scenario, Zetwerk consolidates its manufacturing footprint, sustains 25-30% revenue expansion, and gradually improves adjusted EBITDA margins from 2.6% to 4.5%, justifying an IPO market valuation between $3.2B and $3.6B. Downside triggers include sustained high net losses, inventory write-downs, or extended receivable cycles that consume working capital."
    claimRefs:
      - "CV011"
      - "CV012"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
