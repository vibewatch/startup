companyProfile:
  summary: >-
    Zetwerk is a Bengaluru-based managed-marketplace contract manufacturing platform that combines custom production,
    supplier coordination, owned facilities, and manufacturing software. The company reported ₹15,913.3 crore of FY26
    operating revenue, 1,802 customers, and 26 owned facilities across India, Spain, the United States, and Germany,
    while the latest public evidence still points to a capital-intensive, pre-IPO business model.
