  topStrengths:
    - 'Scale is real: FY26 revenue reached ₹15,913.3 crore and grew 40.4% year over year.'
    - The business has a broad enterprise footprint across energy, industrials, electronics, renewables, and aerospace.
    - The proposed IPO includes meaningful debt repayment, which should reduce finance-cost drag if executed.
  topRisks:
    - >-
      Working-capital absorption remains heavy, with negative operating cash flow and large receivables/inventory
      balances.
    - Customer and supplier concentration remain material, limiting visibility into resilient margins and collections.
    - Reported statutory losses still include sizable exceptional and impairment charges.
    - Final IPO pricing, legal process outcomes, and current cash reconciliation remain unresolved.
  unresolvedGaps:
    - Final red herring prospectus price band and issue pricing consensus.
    - >-
      Primary reconciliation of cumulative capital raised, the pre-IPO round, exact post-money valuation, and current
      cash availability.
    - Vertical-level gross margin, take-rate, and factory-utilization schedules by manufacturing line.
    - Current board roster, succession depth, and any material leadership changes after the August filing.
