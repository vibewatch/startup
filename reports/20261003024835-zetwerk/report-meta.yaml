summary:
  headline: >-
    Zetwerk is a late-stage contract-manufacturing platform nearing IPO with strong FY26 growth, but working-capital
    intensity, concentration, and exceptional charges keep the thesis at track rather than buy.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
