              - CV016
      - number: '8.2'
        title: 融资历程与一级市场估值对标
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 的资本运作史展现了一级市场估值的迅猛跃升：历经 19 轮以上融资，从 2018 年的种子轮估值起步，2021 年跻身独角兽行列，最终在后期 F 轮与 Pre-IPO 交易中推升至预估 $3.0B
              至 $3.1B 的基准。2025 年 3 月，由 ARK Investment Management 等机构投资者领投的后期融资，以及 Bharat Value Fund 在 2025-2026 年完成的
              ₹500 Cr Pre-IPO 投资，将公司股权估值锁定在约 $3.0B 至 $3.1B。对应其 FY26 的 ₹15,913.3 Cr（约合 $1.89B）营业收入，这一一级市场对标估值隐含约 1.6x
              的历史市销率（P/S）。相较于 Dixon Technologies 或 Kaynes Technology 等估值在 4x 至 8x 市销率以上的纯电子代工同业，该估值倍数看似相对克制，但 Zetwerk
              偏低的毛利率结构以及偏重大宗贸易的业务成色，完全支撑这一估值折价。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 情景建模、稀释压力与 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 在拟议 IPO 前夕的资本结构包括规模可观的 ₹26,000 million 新股发行，以及发起人和 Peak XV Partners、Accel、Lightspeed 等早期风投机构出让至多
              96,837,455 股普通股的老股转让（OFS）。在 ₹26,000 million 新股募资中，管理层计划将其中的 ₹18,000 million（近
              69%）用于偿还或提前偿还未结清借款，以实质性修复资产负债表。在基准情景（base case）下，Zetwerk 整合生产基地网络，保持 25% 至 30% 的营收增速，并将调整后 EBITDA 利润率从
              2.6% 逐步改善至 4.5%，对应合理的 IPO 上市估值在 $3.2B 至 $3.6B 之间。悲观触发因素包括净亏损持续居高不下、存货跌价减值，或应收账款周转周期拉长导致营运资金持续承压。
            claimRefs:
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 核心图表
        blocks:
          - type: callout
            title: 坚守 IPO 定价倍数纪律
            body: >-
              二级市场潜在投资者应以 Zetwerk 一级市场交易估值 $3.0B 至 $3.1B（约合 FY26 收入的 1.6x）作为入场安全边际。尽管印度本土电子代工同行享有更高的估值倍数，但 Zetwerk 报表录得的
              ₹1,606.2 Cr 法定亏损以及体量庞大的平台贸易流水，决定了在营业利润率证明其持续性之前，必须设置审慎的估值倍数上限。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
