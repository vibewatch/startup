      - number: '2.4'
        title: 宏观催化要素、供给瓶颈与落地约束
        blocks:
          - type: paragraph
            body: >-
              受结构性宏观动力催化，平台化合同制造模式加速铺开，但也伴随着突出的实际运营阻力。核心增长动力包括跨国企业在「中国+1」（China+1）战略下的供应链多元化布局、印度生产挂钩激励（PLI）计划的政策补贴（对电子产品增量生产给予
              4% 至 6% 的激励），以及大规模可再生能源电网建设。需求端催化与供给端瓶颈直接迎头相撞：受制于核心零部件制造产能吃紧，电力变压器等关键工业设备的交货周期在印度长达 30 至 36 个月，在美国更达 36 至
              42 个月。加之客户迁移门槛高、多级供应商质量参差不齐、营运资金占用大以及客户缺乏刚性采购量承诺，平台渗透阻力重重。在 Zetwerk 统筹 26 个国家 6,979 家供应商服务超 1,800
              家客户的过程中，保障标准化交付水准与化解客户集中度风险，始终是关乎生死的运营考验。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 核心图表
        blocks:
          - type: callout
            title: B2B 制造平台的两难困局：轻资产网络表象与重资产资金占用现实
            body: >-
              Zetwerk 对外标榜为依托 Zetwerk OS 调度 6,979 家第三方供应商的轻资产科技平台，其底层财务特征却更像背负沉重存货与应收账款的传统制造集团。FY26 录得 INR 15,913.3
              crore 收入的背后，是 INR 9,879.8 crore 的库存商品采购与 INR 3,963.7 crore 的原材料消耗，导致合并调整后 EBITDA 利润率薄至
              2.65%。工业制造对资本的刚性需求，平台始终无法绕开。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM009
              - CM011
              - CM016
          - type: callout
            title: 买方结构性隐患：无保量承诺前提下客户集中度持续攀升
            body: >-
              在缺乏长期采购协议的背景下，Zetwerk 的高速营收扩张伴随着收入集中度的进一步走高。FY26 公司前十大客户贡献了 35.9% 的合并收入，而 FY24 该比例仅为
              22.4%。由于工业买方采用短期采购订单，且有权在不承担严厉违约责任的前提下取消、推迟或削减订单量，核心客户所在领域的任何景气下行，都会引发剧烈的收入波动。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场定位与直接竞对图谱
        blocks:
          - type: paragraph
            body: >-
              围绕 Zetwerk 的竞争格局主要分为三类：科技驱动的托管型平台、传统 EPC 与合同制造老牌厂商，以及专业电子制造服务商（EMS）。与 Moglix 这类横向工业品采购平台，或
              Infra.Market、OfBusiness 这类原材料归集商不同，Zetwerk
              将核心业务聚焦于工业零部件、消费电子与可再生能源基础设施的来图定制制造与工程交付。印度传统合同制造长期依赖高度分散、靠人脉驱动的中小加工厂，供应商寻源、进度追踪与质量检测普遍缺乏统一标准。Zetwerk 将横跨
              20 多个工业领域的逾 10,000 家认证制造供应商聚合成托管型平台，为大型企业买方提供统一兜底履约。然而，OfBusiness
              等竞对在大宗采购领域已形成深厚的本土规模并连续多年实现经营性盈利；而在更依赖专业工程能力与重资产设备、而非平台撮合调度的垂直细分赛道，垂直平台与区域 EMS 厂商亦占据着坚固阵地。
            claimRefs:
              - CP001
