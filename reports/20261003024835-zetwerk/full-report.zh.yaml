      - number: '3.4'
        title: 核心图表
        blocks:
          - type: callout
            title: 软件调度充当履约控制层而非独立软件产品
            body: >-
              Zetwerk 的演进历程印证了单凭软件无法打破工业采购的不透明性，客户需要的是确定的生产交付成果与履约责任兜底。借助深植于线下制造执行环节的自研操作系统，Zetwerk 在 10,000
              家供应商间建立起实体管控机制，构筑起纯软件厂商难以复制的壁垒。
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 大宗自营贸易带来的营运资金拖累
            body: 制造服务业务虽具备更高的利润率和轻资产属性，但大额商品采购仍占据收入大头。替企业买方垫付资金并承担库存与营运资金风险，使公司不仅直面工业开支周期性下滑的冲击，还背负着高昂的财务成本。
            calloutType: risk
            claimRefs:
              - CP009
