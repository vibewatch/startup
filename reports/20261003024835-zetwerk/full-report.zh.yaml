    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与经营模式
        blocks:
          - type: paragraph
            body: >-
              Zetwerk Manufacturing Businesses Limited 于 2017 年 12 月 6 日注册为私营公司，申报文件与第三方资料则将 2018 年视为商业启动或创立年份 [CO001,
              CO002]。公司注册地与总部设于班加罗尔 Bellandur
              [CO004]。其经营模式并非单纯撮合交易的黄页式平台，而是借助第三方供应商、自有工厂与软件系统，统一统筹定制制造、供应商筛选、排产、质控、物流以及库存调度
              [CO003]。这种混合架构虽然拓宽了工艺覆盖面与业务地域，却也让交付履约极度依赖供应商管控和跨国协作，无法单靠软件跑通。为筹备首次公开募股，该法人主体已于 2026 年 2 月变更为公众有限公司 [CO001,
              CO016]。
            claimRefs:
