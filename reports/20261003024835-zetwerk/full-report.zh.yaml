      - number: '1.2'
        title: 领导层与治理结构
        blocks:
          - type: paragraph
            body: >-
              招股文件将 Amrit Pratik Acharya 与 Srinath Ramakkrushnan 认定为发起人，Zetwerk 当下的官方对外资料则分别将二人列为首席执行官与首席运营官
              [CO005]。同一官方材料显示，Ankit Fatehpuria 担任首席财务官，Rahul Sharma 担任电子业务董事总经理，Vishal Chaudhary 担任航空航天与国防业务董事总经理
              [CO006]。这一团队配置让财务与各大关键垂直行业有了明确的业务负责人，但现有分配证据未载明完整的董事会名录、高管接班计划，亦未披露核心高管之下的副手梯队深度。因此，业务重心依然高度系于两位发起人高管及各垂直业务负责人；这属于尽调推导出的风险结论，而非管理层已有交接安排的证据。
