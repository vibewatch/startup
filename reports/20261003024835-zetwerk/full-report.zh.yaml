      - number: '6.3'
        title: 标杆交付案例与客户背书验证
        blocks:
          - type: paragraph
            body: >-
              其商业可行性得到了高门槛制造领域国内外工业巨头长期生产合同的印证。在可再生能源与输配电领域，Zetwerk 为西门子歌美飒（Siemens Gamesa）、NextPower（原 Nextracker）及
              NTPC Renewable Energy 等全球开发商代工核心电站配套部件、光伏跟踪支架结构件及风机组件。在精密电子与 IT硬件领域，公司为 boAt（Imagine Marketing）与 Acer
              India Private Limited 等知名品牌提供表面贴装 PCBA、智能消费音频硬件和计算设备。此外，公司为印度国防研究与发展组织（DRDO）下属电子与雷达研发所（LRDE）、印度空军以及 Bharat
              Heavy Electricals 供应商交付关键国防与重工业项目，证明了其对严苛军工及航空级质量规范的履约能力。
            claimRefs:
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: 客户获客漏斗与留存机制
        blocks:
          - type: paragraph
            body: >-
              客户生命周期始于线上询价单（RFQ）提交与自动化可制造性设计（DFM）分析，可实现秒级报价与快速打样。合同敲定后，Zetwerk 借助自主研发的 ProcureZ 撮合引擎将生产工序分配给合规第三方供应商；在
              FY26，单笔订单平均分拆至 7 家并行供应商协同生产，大幅压缩工期。ZAQ（Zetwerk Assured Quality）与 ZApps 追踪系统实现全流程车间数据监控，使公司能够稳定实现超过 80%
              的准时全额交付率（OTIF），远高于印度高度碎片化制造行业 30% 至 40%
              的平均水平。最初的单笔采购，往往逐步沉淀为多年期经常性供货协议及照付不议（take-or-pay）保量合约，并向买方集团旗下的其他事业部持续渗透。
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU013
      - number: '6.5'
        title: 客户集中度、波动性与采购隐患
        blocks:
          - type: paragraph
            body: >-
              尽管客户总数多达 1,802 家，Zetwerk 的收入却呈现出向少数核心大型企业客户高度集中的态势。在 FY26，前十大客户贡献了持续经营业务收入的 35.90%（₹57,135.56 million），较
              FY25 的 26.89% 与 FY24 的 22.37% 显著攀升。更严峻的是，客户留存本身波动剧烈：制造业务的净金额留存率（NRR）在 FY25 骤降至 87.13%，随后在 FY26 回升至
              120.24%，多年中位数为 128.85%。尽管在 Zetwerk 成立至今的八年历程中，前十大客户的平均合作年限达 2.8
              年，但招股材料未披露单一最大买方的集中度数据，一旦核心买方采购转向、推迟资本开支或改为自主生产，公司将直面业绩下行冲击。
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU014
      - number: '6.6'
        title: 核心图表
        blocks:
          - type: callout
            title: IPO 前夕前十大客户集中度持续攀升
            body: >-
              Zetwerk 前十大企业客户在 FY26 贡献了 35.90% 的持续经营收入，高于 FY25 的 26.89% 与 FY24 的
              22.37%。由于上市前申报文件未披露单一买方集中度，核心可再生能源或消费电子大客户若突发合同调整或转为自主生产，将带来巨大的收入和利润波动风险。
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
          - type: callout
            title: 核心客户钱包份额扩张得到数据验证
            body: >-
              尽管 FY25 客户留存指标出现波动，但在 80.15% 的老客户复购收入占比及 ₹123,700.09 million 制造在手订单的支撑下，Zetwerk 制造业务平均订单金额仍从 FY24 的 ₹45.94
              million 翻倍增长至 FY26 的 ₹91.74 million。
            calloutType: strength
            claimRefs:
              - CU004
              - CU006
              - CU007
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与财务抗风险能力
        blocks:
          - type: paragraph
            body: >-
              当前最大的潜在风险在于商业财务模型本身，而非单次账面会计亏损。Zetwerk 在 2024 至 2026 财年的各年度中，经营活动净现金流均为负值，FY26 净流出达 ₹6,815.29
              million；此为经营现金流，并非对烧钱总额的推算。UDRHP 招股书亦披露了评级机构 CRISIL 于 2026 年 6 月 3 日出具的 CRISIL A-/Negative/CRISIL A2+
              评级，独立报道称该负面展望与退出土建工程业务引发的潜在拨备或亏损有关。Inc42 另行报道称 FY26 净亏损为 ₹1,606.2
              crore，但非经常性损益与终止经营计提意味着该数字不应被视作常态化经营消耗。Neoma 先前的 Pre-IPO 研报进一步印证了这种结构性担忧：实体库存与应收账款导致该模式的营运资金消耗远超纯软件交易平台。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: 法律、监管与公司治理风险
        blocks:
          - type: paragraph
            body: >-
              本次发行依据印度证券交易委员会（SEBI）ICDR 规则第 6(2) 条推进，因为公司自述不符合第 6(1)(b) 条的准入要求；此属发行合规准入事实，并非监管执法处罚结论。更直接的实际运营风险包括 UDRHP
              招股书中提及的尚未取得的消防安全许可（NOC），以及发电机和美国工厂相关制造许可。申报文件还披露了印度中央调查局（CBI）针对子公司 Kryfs Power Components 的起诉书，以及牵涉董事
              Srinath Ramakkrushnan 的待决所得税诉讼。FY24 至 FY26 期间的多份审计报告保留意见进一步暴露了内控短板，包括 FY26
              无法验证数据库审计追踪功能是否有效维持，以及关于通过中介机构垫付资金的披露缺陷。虽然行政报批、法律应诉与指定 IPO 法律顾问展示了合规流程成熟度，但均不足以证明能取得有利的诉讼裁决或审批许可。
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.3'
        title: 运营与交易对手方依赖
        blocks:
          - type: paragraph
            body: >-
              尽管有技术系统加持，Zetwerk 平台在运营底层依然高度受制于第三方。FY26 来自第三方供应商外协加工的产品，占制造与生态两大板块合并收入的 80.46%，前十大供应商则占持续经营支出的
              38.18%。下游集中度同样在上升：前十大客户在 FY26 占持续经营收入的 35.90%，相比之下 FY25 为 26.89%，FY24 为
              22.37%。这些指标同时叠加了质量、交付、定价与账款回收多重风险。Zetwerk
              自行发布的海外制造指引亦承认，跨国代工存在质控波动、交付周期拉长、政经局势不稳定及监管复杂性等难题。企业黄页信息显示其梅萨（Mesa）基地取得了 ISO 9001:2015 和 AS9100D
              认证，但这仅属于公司自填资料层面的证据，不能视作针对集团全盘内控的独立第三方审计。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
      - number: '7.4'
        title: 风险对冲、监控指标与逻辑证伪标准
        blocks:
          - type: paragraph
            body: >-
              公司的风险应对成熟度并不均衡。许可报批、网络安全防护、供应商入库出库把关、客户信用评估、新合同中的关税转嫁条款以及聘请外部法律顾问等均属可查证的举措，但既有资料无法独立印证其实际有效性。公司自述在过去三个财年未发生过引发数据泄露并严重扰乱经营的
              IT
              故障或网络安全事件；这种带有前置条件的发行人单方声明，并不能证明未发生过任何安全事故。因此，后续追踪应紧盯经营活动现金流、应收账款周转天数、前十大客户与供应商集中度、行政审批进展、信用评级走势以及重大诉讼节点。逻辑证伪（thesis-break）的触发事件包括：持续无法筹措营运资金、丧失或被暂停关键经营许可、遭遇重大不利司法判决，或因频繁质量事故导致客户流失；在此并未人为设定缺乏依据的量化阈值。
            claimRefs:
              - CR006
              - CR010
              - CR012
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR010
              - CR012
              - CR015
      - number: '7.5'
        title: 核心图表
        blocks:
          - type: callout
            title: 切勿将账面会计亏损等同于实际烧钱规模
            body: >-
              Inc42 报道称 FY26 净亏损为 ₹1,606.2 crore，而申报文件披露的经营活动现金流为净流出 ₹6,815.29
              million。两项指标口径与分母各不相同；投资研判时应当编制调节表对账现金流变化，不可相互混淆替代。
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
          - type: callout
            title: 基于证据锁定的叫停标准
            body: 若营运资金筹措渠道中断、关键工厂许可证被暂扣、重大不利司法判决冲击业务运营，或频发质量事故损害客户留存，应立即叫停本投资逻辑。具体数值触发线目前仍属尽调信息缺口，不应主观编造量化门槛。
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与研判建议
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 作为印度领先的托管型 B2B 合同制造平台，将能源、工业零部件、电子和航空航天领域的逾 1,800 家大型企业客户与认证工厂连接起来。看多逻辑（thesis）在于 Zetwerk
              深度受益于「印度制造」（Make in India）与全球供应链多元化的制造业重构浪潮，展现出庞大的营收体量（FY26 达 ₹15,913.3
              Cr）。反向逻辑（anti-thesis）则源于严峻的法定会计亏损（FY26 净亏损达 ₹1,606.2 Cr）、通道型集采业务高企的营运资金占用，以及海外重资产工厂的交付风险。拟通过 IPO 募资偿还
              ₹1,800 Cr 债务有助于资产负债表短期去杠杆，但长期的股权回报仍取决于可持续的经营现金流。因此，在上市后财报披露前，投资建议定为「观察」，置信度「中」，风险评级「高」，估值立场「合理」。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
