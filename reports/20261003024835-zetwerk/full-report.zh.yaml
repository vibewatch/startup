      - number: '2.3'
        title: 买方客群划分、采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              接入制造平台的大型企业买方可划分为三类典型画像：公用事业级能源开发商、全球工业与汽车
              OEM，以及快节奏消费电子品牌。采购决策权通常分散在集团采购部门、工程负责人和项目总监手中。能源与公用事业开发商采购支架跟踪机构、电力变压器铁芯硅钢片及管道，预算走资本开支（Capex）项目，随宏观周期大幅波动。精密部件与航空航天
              OEM 采购的是经常性运营开支（Opex）零部件，受 ISO 9001:2015 与 AS9100D 严苛质控标准约束，要求高精度尺寸公差并贯穿数百家供应商的可追溯性。消费硬件与电子 OEM
              则借助来图加工（build-to-print）与原始设计制造（ODM）模式，以应对高度压缩的季节性新品发布周期。这类客户关系虽拉动了营收规模，但企业端采购机制也带来了明显隐患：客户普遍不签署具有约束力的长期采购承诺，且在
              FY26，前十大客户集中度已攀升至 Zetwerk 合并收入的 35.9%。
