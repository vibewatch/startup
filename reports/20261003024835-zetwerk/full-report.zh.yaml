      - number: '3.3'
        title: 商务包装、定价权衡与护城河壁垒
        blocks:
          - type: paragraph
            body: >-
              工业合同制造与托管型平台的商业合作条款，反映出走量吞吐与利润质量之间的结构性博弈。Zetwerk
              的收入结构由自营贸易合同、撮合及制造服务以及项目制工程交付混合构成。在自营贸易模式下，平台承担库存与交付风险以赚取贸易毛利差价；服务类收入依靠项目管理费与平台费，资金周转效率更高。一旦模具认证、质量稽核与定制化工作流嵌入投产产线，工业买方的替换门槛相当可观。即便如此，大型客户仍会同时对接多家区域代工厂及专业
              EMS 厂商，以规避供应商锁定并反向压低单价。此外，要在数以千计的独立合作工厂间维持高准时交付率，公司还得持续承担运营管理负担，并配备充裕的营运资金授信及庞大的质检团队，才能遏制因良率缺陷引发的客户流失。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
