      - number: '5.3'
        title: 质量控制、行业资质认证与技术依赖
        blocks:
          - type: paragraph
            body: >-
              Zetwerk OS 的质量管理主要依托 ZAQ 质控模块与工厂端资质认证执行。在电子制造服务（EMS）领域，Zetwerk 在班加罗尔、钦奈和诺伊达的工厂内运营 15 条表面贴装技术（SMT）产线，取得 ISO
              9001、医疗器械标准 ISO 13485 以及航空航天标准 AS9100D 等认证。检测流程整合了产线在线自动 3D 光学检测（AOI）、3D X
              射线检测、在线电路测试以及功能性环境测试。尽管有上述质控手段，技术与运营风险依然集中在混合运作架构中：统筹跨越 26 个国家的多级生产，让 Zetwerk
              始终暴露在供应商执行良率波动、第三方车间数据采集滞后，以及合作工厂资金链或原材料短缺的风险之下。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: 核心图表
        blocks:
          - type: callout
            title: 借助并行制造放大运营杠杆
            body: >-
              Zetwerk 的商业模式并非为每个 SKU 都购置重型工业母机，而是依托 Zetwerk OS
              以总包承揽方身份将生产任务分发给第三方加工厂，从而获得结构性利润杠杆。这种并行制造能力可将单笔巨额采购订单拆解为不同组件模块，交由数十家专业工厂同步加工，在大幅压缩交货周期的同时维系轻资产投资资本回报率。
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: 分布式供应商网络的质量波动风险
            body: >-
              班加罗尔、钦奈与梅萨的自有工厂虽严格遵循 AS9100D 与 ISO 13485 标准运转，但要将均一的过程管控推广至 6,979 家第三方代工伙伴，仍是悬而未决的运营隐患。鉴于 Zetwerk
              承担直接合同履约责任，下游合作厂的任何质量缺陷或交付延误，都会直接反噬 Zetwerk 的财务报表并危及客户合作。
            calloutType: risk
            claimRefs:
              - CE002
              - CE012
              - CE013
