      - number: '2.2'
        title: 市场规模测算：耐用品采购 TAM 与平台渗透上限
        blocks:
          - type: paragraph
            body: >-
              来自 Redseer 报告的独立行业评估测算显示，制造平台的潜在市场总量（TAM）在 2026 财年（Fiscal 2026）：印度市场达到 INR 10.26 trillion 至 INR 12.57
              trillion（USD 120.65 billion 至 USD 147.91 billion），美国市场达到 INR 2.07 trillion 至 INR 6.26 trillion（USD 24.32
              billion 至 USD 73.60 billion）。受长期政策红利、地缘供应链重构以及数字化供应商整合驱动，该平台 TAM 预计到 2031 财年（Fiscal 2031）：印度市场将扩张至 INR
              17.68 trillion 至 INR 20.00 trillion（USD 208.01 billion 至 USD 235.27 billion），美国市场将扩张至 INR 26.76 trillion 至
              INR 30.95 trillion（USD 314.81 billion 至 USD 364.09 billion）。在印度本土，更广泛的耐用品制造业依托电子等快速扩张的垂直门类支撑，印度国内电子总产值已从
              FY15 的 INR 1.9 lakh crore 跃升至 FY25 的 INR 11.3 lakh crore。Zetwerk
              的可服务市场（SAM）则限定于协同复杂度高、设计迭代快且多级供应链分散的品类，涵盖能源产品、精密产品以及高价值关键部件。其可获取市场（SOM）则体现在 2026 财年（Fiscal 2026）持续经营业务录得的
              INR 15,913.3 crore 收入，其中核心制造贡献 INR 9,374.7 crore，数字贸易与生态采购平台贡献 INR 6,538.6 crore。
            claimRefs:
