      - number: '1.3'
        title: 融资历程、估值与核心股东
        blocks:
          - type: paragraph
            body: >-
              现有证据中最为明确的历史融资节点为 2021 年 8 月的 E 轮：Liquidity 报道称，该轮融资规模为 $150 million，由 D1 Capital Partners 领投，投后估值达 $1.33
              billion，Avenir 与 IIFL 连同老股东跟投 [CO008]。BounceWatch 另行记录了 2024 年 3 月 Wheelhouse Ventures 出资的 INR 1.65
              billion F 轮投资，但该数据库条目在既定证据库中缺乏一手材料印证 [CO009]。Inc42 报道称公司累计募资超 $900 million，且最新 Pre-IPO 轮以超 $3 billion
              的估值完成 ₹500 crore 融资；其公司介绍页面给出的累计融资额更为具体，达 $929.62 million-plus [CO015]。上述数据代表已完成融资及交易估值信号，并不等同于账面可用现金。2026
              年 8 月的申报文件进一步提出至多 ₹26 billion 的新股发行与老股出让方案，且募资中有相当大比例拟用于偿还债务，使得资本结构与发行后股权架构成为核心尽调事项 [CO016]。
