      - number: '5.2'
        title: 产品模块、Zetwerk OS 架构与实体工厂布局
        blocks:
          - type: paragraph
            body: >-
              企业的核心技术底座是 Zetwerk OS，这是一套旨在标准化协同分散的第三方与自有工厂资产的集成软件体系。其系统架构由五大核心引擎构成：用于 AI 智能推荐供应商及产能匹配的
              ProcureZ；用于项目全周期管理与进度追踪的 ZISO（Zetwerk Integrated Systems Orchestrator）；基于移动端的车间工单调度与执行追踪系统 ZPS（Zetwerk
              Production System）；用于质检计划制定与不良品追溯的 ZAQ（Zetwerk Assured Quality）；以及负责出入库物流追踪的 ZHIP。在实体资产布局上，Zetwerk 将遍布 26
              个国家 6,979 家第三方制造伙伴网络与印度、西班牙、美国、德国的 26 座自有制造基地相结合，涵盖精密机加工、钣金成形、压铸、锻造及电子制造服务（EMS）。
