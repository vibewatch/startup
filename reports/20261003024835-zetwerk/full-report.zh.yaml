    rows:
      - - 印度制造平台 TAM
        - Redseer 报告（2026 年 8 月 UDRHP）
        - INR 10.26T - 12.57T ($120.7B - 147.9B)
        - INR 17.68T - 20.00T ($208.0B - 235.3B)
        - CAGR ~10.0% - 11.5%
        - 自下而上统计耐用品制造运营支出与资本支出，按印度市场可由数字化平台承接的系数折算。
        - 覆盖印度耐用品采购中能被数字化平台聚合、进而提升供应商产能利用率的可触达市场。
      - - 美国制造平台 TAM
        - Redseer 报告（2026 年 8 月 UDRHP）
        - INR 2.07T - 6.26T ($24.3B - 73.6B)
        - INR 26.76T - 30.95T ($314.8B - 364.1B)
        - CAGR ~35.0% - 40.0%
        - 涵盖美国制造业回流、清洁能源和高端硬件领域的可承接耐用品采购需求。
        - 受 IRA 与《芯片法案》（CHIPS Act）政策激励及再工业化浪潮拉动高速增长，受制于跨境物流与关税壁垒。
      - - 印度电子制造业产值池
        - Zetwerk EMS 行业报告（FY25）
        - 规模达 INR 11.3 lakh crore（FY25）
        - 预计年增长率 >20%
        - CAGR >20%（FY15-25 录得 6x 增长）
        - 汇总印度电子与信息技术部（MeitY）产值追踪数据及国内 EMS 行业总值。
        - 反映电子 EMS 组装、移动硬件、穿戴设备与 IT 整机组装制造的可触达市场规模。
      - - Zetwerk 可获取市场（SOM）
        - Zetwerk 经审计 UDRHP / Inc42 FY26
        - 规模达 INR 15,913.3 crore ($1,872M)
        - 在手订单 >INR 12,370 crore
        - 同比增速 40.4%（FY25-FY26）
        - 持续经营业务经审计合并收入，由制造业务（58.9%）与生态系统业务（41.1%）构成。
        - 受制于缺乏长期采购承诺、营运资金上限及客户集中度较高。
    notes: 按 UDRHP 惯例采用 1 美元 = 85 印度卢比（USD 1 = INR 85）折算；SOM 数值反映扣除已终止土建基础设施业务后的 FY26 经审计持续经营业务收入。
