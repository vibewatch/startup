      - number: '1.4'
        title: 业务规模与尽调研判
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 3 月 31 日，申报文件披露公司拥有 1,802 家客户，在印度、西班牙、美国和德国设有 26 座自有制造工厂，员工总数达 3,554 人，另有 6,422 名合同工 [CO010,
              CO011, CO012]。FY26 营业收入达 ₹15,913.3 crore，较 FY25 同比增长 40.4%，而申报的会计净亏损则扩大至 ₹1,606.2 crore [CO013,
              CO014]。该亏损额并非衡量现金消耗的指标，营收亦不可直接视作 ARR。迅猛的规模扩张、分散的生产网络以及将大笔 IPO
              募资投向偿债的方案，均印证了其重资产、高资本消耗的后期工业制造属性，绝非轻资产的软件撮合平台 [CO003, CO011, CO016]。申报文件是带时间戳规模指标中最权威的既定证据源，而 2026 年 10
              月的客户数、员工规模与估值数字仍属未经验证的信息缺口，不可主观外推。
