  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 运营与财务假设
      - 估值与回报逻辑
      - 核心风险与下行触发因素
      - 概率评估
    rows:
      - - 乐观情景
        - FY28 前收入复合年均增长率（CAGR）达 35%；调整后 EBITDA 利润率提升至 5.5%；海外工厂实现满负荷运转
        - 估值达 $4.2B 至 $4.8B（对应 1.8x-2.0x FY28E 收入），较最近一轮私募估值溢价 35-50%
        - 供应链瓶颈、营运资金回款拖延、客户集中度波动冲击
        - 25%——前提是精密零部件业务利润率迅速释放
      - - 基准情景
        - 收入 CAGR 为 22-26%；调整后 EBITDA 利润率稳定在 3.0-3.5%；按计划偿还 ₹18,000M 债务
        - 估值达 $3.2B 至 $3.6B（对应 1.3x-1.5x FY27E 收入），提供符合市场基准的稳健回报
        - 贸易业务持续摊薄整体毛利率、可再生能源领域面临竞价承压
        - 55%——契合历史内生业务规模增速与当前运行节奏
      - - 悲观情景
        - 收入增速放缓至 12% 以下；海外业务持续计提资产减值；营运资金压力持续难解
        - 估值回落至 $2.0B 至 $2.4B（对应 0.9x-1.0x 收入），较最近一轮私募估值倍数回落 20-35%
        - 创投基金减持老股造成抛压、营运资金周转长期承压拖累
        - 20%——若 IPO 后持续现金消耗迫使进行进一步稀释性融资，则触发该情景
    notes: 情景分析参考过去 $3.0B-$3.1B 私募估值基准及 IPO 资本结构，对远期收入倍数进行建模测算。
