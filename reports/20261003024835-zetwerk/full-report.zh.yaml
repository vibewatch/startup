    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI007
  - id: FE001
    title: Zetwerk OS 多层技术架构图
    type: stack
    summary: 展示 Zetwerk OS 的技术架构分层，涵盖数字化客户交互界面、核心履约引擎、实体车间运营及混合制造基础设施。
    data:
      layers:
        - label: 客户与供应商交互层
          detail: 提供全流程可视度与自助服务能力的数字化网页门户及协同沟通界面。
          modules:
            - ZApps 客户门户
            - ZApps 供应商仪表盘
            - CAD/BOM 导入解析接口
        - label: 核心运营与编排引擎
          detail: 统筹协调多工厂协同制造的集中式智能算法与项目规划模块。
          modules:
            - ProcureZ 供应商匹配引擎
            - ZISO 全球项目编排器
            - OMS 订单管理系统
        - label: 车间与生产执行层
          detail: 部署在自营及合作工厂的现场生产管理工具与质量保障机制。
          modules:
            - ZPS 生产管理系统（移动端/平板端）
            - ZAQ 质量保障管理体系
            - ZINTO 库存与物料溯源系统
        - label: 履约与供应链协同层
          detail: 端到端物流智能调度与工业原材料集采服务。
          modules:
            - ZHIP 多式联运物流调度中心
            - Terra91 原材料集采平台
        - label: 自营先进制造基地
          detail: 分布在全球各地的自营先进制造及电子制造基地。
          modules:
            - 15 条 SMT 电子表面贴装产线（印度）
            - 航空航天精密机械加工厂（亚利桑那州梅萨）
            - 欧洲精密工程制造基地（西班牙、德国）
        - label: 分布式制造合作伙伴网络
          detail: 由第三方中小微制造工坊构成的去中心化供应网络。
          modules:
            - 6,979 家经严格审核的制造合作伙伴
            - 覆盖 26 个国家的多层次机加工车间
            - 标准化数字化准入与审计节点
    approximationNotes: 模块分类依据 Zetwerk UDRHP-I 第 'Our Operations and Manufacturing Platform - Zetwerk OS' 章节的披露内容整理。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户全生命周期旅程图
    type: journey-map
    summary: 端到端客户全生命周期：从线上即时询价报价、并行产能分配，到质量受控的订单履约，直至拓展沉淀为多年期框架合同。
    approximationNotes: 各阶段与关键运营触点综合自 Zetwerk 的 UDRHP 运营披露、Lightspeed 案例分析及 LeadIQ 商业调研报告。
    data:
      items:
        - label: 1. 数字化需求发现与 RFQ 询价提交
          touchpoints:
            - OEM 或 EPC 买家通过 Zetwerk 网页端门户上传技术图纸与 CAD 规格文件
            - 自研即时报价引擎进行可制造性分析（DFM），数分钟内完成报价测算
        - label: 2. 供应商智能匹配与产能调配
          touchpoints:
            - ProcureZ 引擎全方位评估供应商工艺能力、历史品控表现与车间空闲产能
            - FY26 每笔订单平均分流至 7 家并行供应商加工，消除单一交付瓶颈
        - label: 3. 样品试制与小批验证
          touchpoints:
            - 落实严苛的技术评审、打样试制与全套质检流程
            - 首批试产物料按客户 ppm 缺陷容忍度与环保合规标准完成验证导入
        - label: 4. 规模量产与车间实时跟单
          touchpoints:
            - 贯彻 Zetwerk 质量保障（ZAQ）体系，覆盖自原料进厂至成品装配全流程
            - ZApps 外部门户向买家提供实时进度看板与质检遥测数据
        - label: 5. 准时物流与质检验收交付
          touchpoints:
            - 为跨国货物运输提供跨境多式联运及报关清关一站式协同
            - 准时完全交付率（OTIF）持续稳定在 80%+，远高于 30-40% 的行业平均水平
        - label: 6. 客户深度经营与钱包份额扩张
          touchpoints:
            - 从单次单件零部件采购订单逐步拓展至多年期照付不议（take-or-pay）协议
            - 客户钱包份额持续攀升，驱动平均订单金额从 FY24 的 ₹45.94M 提升至 FY26 的 ₹91.74M
    claimRefs:
      - CU006
      - CU007
      - CU011
      - CU013
