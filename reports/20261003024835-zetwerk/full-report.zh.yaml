      - number: '3.2'
        title: 能力差异化与制造操作系统
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 最核心的运营差异化优势来自其自主研发的制造操作系统（Zetwerk
              OS），该系统在分布式工厂网络中充当控制中枢，负责供应商匹配、排产监控及质检把关。在定制工业制造中，企业级订单通常牵涉多家二级甚至三级供应商、数十种非标机械设计以及长达数月的交付周期。早期纯 SaaS
              工具虽试图解决供应商协同痛点，但客户真正买单的是对生产交付结果承担端到端合同履约责任，而非单卖软件。原始设计制造（ODM）、电子制造服务（EMS）与联合设计制造（JDM）等竞品模式，在设计归属、工程介入深度与上市周期之间各有取舍。传统纯
              EMS 厂商严格依照客户定型规格代工且几乎不涉足设计所有权，ODM 厂商提供现成方案却把持知识产权。Zetwerk 主要以 EMS
              与来图加工模式切入，并在国防、航空航天及高精密铸造等领域逐步向上游自有和控股工厂延伸，以此牢牢把控交付节奏并守住利润率。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
