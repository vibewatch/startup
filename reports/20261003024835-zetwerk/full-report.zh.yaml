      - number: '4.2'
        title: 成本结构、采购驱动要素与营业利润率
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 的成本特征反映了托管平台制造与大宗贸易集采天然的高采购量属性。FY26 公司总营业支出达 ₹16,141.73 crore，其中库存商品采购达 ₹9,879.75 crore（占总成本的
              61.2%），直接原材料消耗为 ₹3,963.67 crore（占总成本的 24.6%）。随着工程与海外运营团队扩招，员工福利开支增长 34.9% 至 ₹643.77 crore。调整后 EBITDA 同比增长
              30.6% 至 ₹421.34 crore，但营业利润率依然微薄，仅为 2.65%，略低于 FY25 的 2.85%。从财报列报口径看，重述后的合并净亏损同比扩大 333% 至 ₹1,606.17
              crore。该项亏损主要受到两笔重大非经常性损益拖累：一是持续经营业务中与优先股转股比例相关的 ₹835.84 crore 非现金调整，二是将土建基础设施业务（Civil Infrastructure
              Works）划归终止经营时计提的 ₹453.00 crore 减值损失。
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI009
      - number: '4.3'
        title: 营运资金周转周期与经营现金流消耗
        blocks:
          - type: paragraph
            body: >-
              对 Zetwerk 开展投资判断的核心难点，在于会计营业利润与现金回收之间的背离。尽管调整后 EBITDA 为正，但经营活动现金流已连续三个财年录得负值，且 FY26 净经营现金流出扩大至 ₹681.53
              crore，相较之下 FY25 流出 ₹386.30 crore，FY24 流出 ₹281.50 crore。这种持续失血主要源于沉重的营运资金需求：截至 2026 年 3 月 31 日，应收账款达
              ₹2,329.93 crore，存货达 ₹1,249.58 crore，而对应的应付账款为 ₹2,199.28 crore，承兑汇票为 ₹1,014.45 crore。同时，收入集中度进一步攀升，前十大企业客户在
              FY26 贡献了 35.90% 的总收入，高于 FY25 的 26.90%。尽管老客户贡献了制造业务 80.15% 的收入，但账期拉长叠加客户集中度过高，放大了信用违约风险与流动性承压。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI011
      - number: '4.4'
        title: 资本结构、杠杆状况与 IPO 研判结论
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 在工厂实体与海外版图上的激进扩张（目前在印度、美国、德国与西班牙共运营 26 座自有工厂），很大程度上是由高额负债支撑的。截至 2026 年 3 月 31 日，总借款攀升至 ₹1,936.16
              crore，包括 ₹1,460.83 crore 的短期营运资金借款与 ₹475.33 crore 的长期债务，产生年化财务费用 ₹366.22 crore。为化解这一财务杠杆，Zetwerk 于 2026 年
              8 月提交了更新后的红鲱鱼招股书草案（UDRHP-I），拟公开发行包括至多 ₹2,600.00 crore 的新股发行与至多 96,837,455 股普通股的老股转让。管理层计划将新股募资中的 ₹1,800.00
              crore 专门用于提前偿还或偿还公司及子公司债务。能否顺利压降债务，是消除利息费用拖累并在上市后实现自由现金流转正的关键催化剂。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: 核心图表
        blocks:
          - type: callout
            title: 营收规模被低毛利大宗商品通道业务虚增
            body: >-
              尽管 Zetwerk 在 FY26 合并收入同比大增 40.4% 至 ₹15,913.32 crore，但其中超过 41% 的流水来自 Terra91
              的原材料及大宗商品贸易业务。该大宗集采板块流水虽大，毛利率却薄如蝉翼，导致整体利润率相较纯制造平台被大幅摊薄。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: callout
            title: 营运资金失血速度超过调整后 EBITDA 增幅
            body: >-
              尽管 FY26 录得 ₹421.34 crore 调整后 EBITDA，但随着存货与应收款项膨胀至超过 ₹3,579 crore，经营现金流恶化至净流出 ₹681.53 crore。客户账期过长严重压制了
              Zetwerk 的自身造血能力，迫使其不断依赖短期营运资金借款维系周转。
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI009
          - type: callout
            title: 借助 IPO 募资去杠杆是修复盈利底线的必由之路
            body: >-
              将拟募资的 ₹2,600 crore 新股发行款中的 ₹1,800 crore 用于压降债务，是一项关键的战略动作。偿还 ₹1,936.16 crore 总借款中的大头后，Zetwerk
              能够削减沉重的财务利息负担（FY26 超过 ₹366 crore），并加速推动合并报表经营现金流回正。
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI014
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运营模式与制造交付流程
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 是一家深度介入交付的托管型 B2B 制造平台，而非被动提供销售线索的撮合黄页。在客户履约流程中，工业机械、可再生能源、消费电子与航空航天领域的大型买方与 Zetwerk
              签署买卖自营合同，并将计算机辅助设计（CAD）工程图纸及物料清单（BOM）上传至 Zetwerk OS。Zetwerk 的工程系统自动将 CAD
              图纸拆解为零部件级工序，评估可制造性设计（DFM）指标，基于历史采购数据匹配并生成具竞争力的报价，再将生产任务分发给混合工厂网络。Zetwerk
              在分散的制造基地间统筹并行生产，在大幅压缩采购周期的同时，对最终交付产品的商务与质量承担全部责任。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
