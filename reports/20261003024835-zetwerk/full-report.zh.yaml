  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、采购范围与制造平台模式
        blocks:
          - type: paragraph
            body: >-
              现代合同制造与 B2B
              平台的目标市场，在结构上由耐用品采购界定，而非笼统的工业总产值。耐用品涵盖能源设备、精密零部件、消费硬件与资本品等门类，特征是基于严苛规格、公差与工程图纸加工的离散型工程零部件及总成。Zetwerk
              作为聚合与调度中枢，将分散的原始设备制造商（OEM）与分布在 26
              个国家的小微第三方制造供应商连接起来。平台将制造交付与重资产所有权解耦，汇总零散的工厂产能，从而缩短交付周期并协同多级生产排期。不过，该平台的目标范围明确排除了大宗低附加值非耐用品消耗品、原材料采掘以及未协同的民用建筑工程。Zetwerk
              战略性剥离非核心的土建基础设施业务（Civil Infrastructure Works），正印证了其聚焦高精度耐用品与工业合同制造的取向。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
