  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、垂直行业结构与定价机制
        blocks:
          - type: paragraph
            body: >-
              Zetwerk 作为科技驱动的合同制造与 B2B 采购平台，主要划分为两大核心运营板块：制造核心业务（Manufacturing Business）与生态业务（Terra91 Ecosystem
              Business）。在 FY26，合并营业收入同比增长 40.4% 至 ₹15,913.32 crore，较 FY25 的 ₹11,331.86 crore 明显增长。制造板块为最核心的增长引擎，同比大增
              50.0% 录得 ₹9,374.68 crore，占合并营业额的 58.9%。在制造板块内部，能源产品（Energy Products）占据绝对主导，在公用事业级可再生能源部件、光伏支架及输电设备带动下贡献了
              ₹6,507.57 crore 营收。与此同时，负责工业大宗商品、黑色金属及石化产品归集的 Terra91 生态业务贡献了 ₹6,538.55
              crore。这两类业务的商业变现逻辑截然不同：定制制造依托基于物料清单的成本加成与来图报价，而大宗商品贸易则通过现货交易捕获买卖价差。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
