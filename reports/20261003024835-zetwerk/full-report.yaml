      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The offer document identifies Amrit Pratik Acharya and Srinath Ramakkrushnan as the promoters, while
              Zetwerk's current media resources list them as chief executive officer and chief operating officer,
              respectively [CO005]. The same official resource lists Ankit Fatehpuria as chief financial officer, Rahul
              Sharma as managing director for the electronics business, and Vishal Chaudhary as managing director for
              aerospace and defence [CO006]. This roster gives visible functional ownership across finance and major
              verticals, but the assigned evidence does not establish a complete board roster, executive succession
              plan, or the depth of deputies below these leaders. Dependence therefore remains most material around the
              two promoter-executives and the specialist vertical heads; this is a diligence conclusion, not evidence
              that a leadership transition is planned.
            claimRefs:
              - CO005
              - CO006
