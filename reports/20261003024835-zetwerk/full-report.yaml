        - Evidence of proprietary manufacturing share exceeding 75% with stable gross margins
      - - Profitability & Unit Economics
        - Adjusted EBITDA rose 30.6% YoY to ₹421.3 Cr; restated continuing loss reduced to ₹41.1 Cr
        - Headline statutory net loss widened 333% to ₹1,606.2 Cr including exceptional items
        - Demonstrated positive statutory profit after tax and elimination of one-off impairment charges
      - - Capital Structure & Deleveraging
        - ₹18,000 million of ₹26,000 million IPO fresh issue targeted for debt prepayment
        - Substantial pre-IPO indebtedness incurred to finance working capital and inventory
        - Successful completion of debt retirement reducing annual financing charges by >60%
      - - Global & Sector Footprint
        - Operating network spans 26 facilities across India, US, Germany, and Spain
        - Execution complexity, tariff exposure, and higher fixed overhead across international plants
        - Consistent double-digit ROCE and positive operational cash flows from overseas subsidiaries
