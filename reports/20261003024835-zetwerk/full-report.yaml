      - number: '2.3'
        title: Buyer Segmentation, Procurement Workflow, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Enterprise buyers engaging manufacturing platforms fall into three distinct operational archetypes:
              utility-scale and energy developers, global industrial and automotive OEMs, and high-velocity consumer
              technology brands. Procurement authority is split between central procurement organizations, engineering
              heads, and project directors. Energy and utility developers procure structural tracking mechanisms, power
              transformer laminations, and piping under capital-expenditure project budgets that fluctuate with
              macroeconomic cycles. Precision components and aerospace OEMs procure recurring, operational-expenditure
              parts governed by strict ISO 9001:2015 and AS9100D quality standards, demanding tight dimensional
              tolerances and traceability across hundreds of suppliers. Consumer hardware and electronics OEMs utilize
              build-to-print and original design manufacturing (ODM) models to meet compressed seasonal product launch
              cycles. While these buyer relationships create substantial top-line momentum, enterprise procurement
              practices introduce significant vulnerability: customers generally do not execute firm, long-term purchase
              commitments, and top-10 customer concentration increased to 35.9% of Zetwerk's consolidated revenue in
              FY26.
            claimRefs:
              - CM005
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Macro Growth Catalysts, Supply Bottlenecks, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of platform-mediated contract manufacturing is propelled by structural macro catalysts alongside
              acute operational friction. Key growth drivers include multinational supply-chain diversification under
              China+1 strategies, active government subsidies under India's Production Linked Incentive (PLI) framework
              (providing 4% to 6% incentives on incremental electronics production), and large-scale renewable power
              grid expansions. These demand catalysts collide directly with supply-side bottlenecks: lead times for
              critical industrial equipment such as power transformers range from 30 to 36 months in India and 36 to 42
              months in the United States due to severely constrained core component manufacturing. Furthermore,
              platform adoption faces severe friction from customer switching barriers, multi-tier supplier quality
              heterogeneity, working-capital intensity, and absence of volume commitments. As Zetwerk coordinates more
              than 1,800 customers across 6,979 suppliers in 26 countries, maintaining standardized delivery performance
              and managing customer concentration remain existential operational challenges.
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The B2B Manufacturing Platform Dilemma: Asset-Light Network vs. Balance Sheet Capital Intensity'
            body: >-
              While Zetwerk markets itself as an asset-light technology platform coordinating 6,979 third-party
              suppliers via Zetwerk OS, its underlying financial profile resembles an inventory- and receivables-heavy
              manufacturing conglomerate. Generating INR 15,913.3 crore in FY26 revenue required INR 9,879.8 crore in
              stock-in-trade purchases and INR 3,963.7 crore in raw materials, resulting in a thin consolidated adjusted
              EBITDA margin of 2.65%. The platform cannot escape the capital demands of industrial manufacturing.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM009
              - CM011
              - CM016
          - type: callout
            title: 'Structural Buyer Vulnerability: Rising Customer Concentration Without Volume Commitments'
            body: >-
              Zetwerk's rapid top-line growth is accompanied by escalating revenue concentration in an environment
              devoid of long-term purchase agreements. In FY26, the company's top ten customers generated 35.9% of
              consolidated revenue, up from 22.4% in FY24. Because industrial buyers procure on short-term purchase
              orders with the right to cancel, defer, or reduce order quantities without severe penalty, any downturn in
              primary customer segments presents severe revenue volatility.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Positioning and Direct Peer Landscape
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Zetwerk divides into technology-enabled managed marketplaces,
              traditional EPC and contract manufacturing incumbents, and specialized electronics EMS providers. Unlike
              horizontal procurement platforms such as Moglix or raw material aggregators like Infra.Market and
              OfBusiness, Zetwerk centers its core offering on custom build-to-print manufacturing and project execution
              across industrial components, consumer electronics, and renewable infrastructure. Traditional contract
              manufacturing in India has historically operated through fragmented, relationship-driven SME machine shops
              where supplier discovery, production tracking, and quality assurance remained unstandardized. Zetwerk
              aggregates over 10,000 verified manufacturing suppliers across more than 20 industrial sectors into a
              managed platform, offering enterprise buyers centralized accountability. However, competitors like
              OfBusiness maintain established domestic scale in bulk procurement with multi-year operational
              profitability, while niche platforms and regional EMS providers contest specific vertical segments where
              specialized engineering and capital equipment outweigh marketplace coordination.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
      - number: '3.2'
        title: Capability Differentiation and Manufacturing Operating System
        blocks:
          - type: paragraph
            body: >-
              Zetwerk's primary operational differentiation rests on its proprietary manufacturing operating system
              (Zetwerk OS), which functions as a control layer across supplier matching, progress monitoring, and
              quality inspection across distributed factory networks. In custom industrial manufacturing, an enterprise
              order frequently demands multiple sub-tier suppliers, dozens of custom mechanical designs, and multi-month
              production schedules. While early SaaS tools attempted to address supplier communication, customer
              adoption required taking end-to-end contractual ownership of production and delivery outcomes rather than
              offering standalone software. Competing models such as Original Design Manufacturing (ODM), Electronics
              Manufacturing Services (EMS), and Joint Development Manufacturing (JDM) establish distinct trade-offs
              between design ownership, engineering involvement, and speed to market. While pure-play EMS incumbents
              manufacture strictly against finalized customer specifications with limited design ownership, ODM
              providers offer ready-made platforms but retain intellectual property. Zetwerk operates predominantly
              across EMS and build-to-print execution models, increasingly backward-integrating into owned and
              controlled production facilities in defense, aerospace, and high-precision casting to control delivery
              schedules and protect margins.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Commercial Packaging, Pricing Trade-Offs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial terms across industrial contract manufacturing and managed marketplaces reflect a structural
              tension between volume throughput and margin quality. Zetwerk's revenue architecture combines principal
              trading contracts, facilitation and manufacturing services, and project-based engineering execution. In
              trading arrangements, the platform absorbs inventory and delivery risk to capture gross spread, whereas
              services revenue provides higher capital efficiency through project management and platform fees.
              Industrial buyers exhibit substantial switching barriers once tooling qualification, quality audits, and
              custom enterprise workflows are integrated into an active production line. Nevertheless, enterprise
              customers multi-home across regional fabricators and specialized EMS providers to prevent supplier lock-in
              and negotiate unit pricing concessions. Furthermore, maintaining high delivery reliability across
              thousands of independent partner facilities introduces ongoing operational overhead, requiring substantial
              working capital facilities and persistent quality control teams to prevent defect-driven customer churn.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Software Orchestration as Control Layer Rather Than Standalone Product
            body: >-
              Zetwerk's evolution highlights that software alone cannot solve industrial procurement opacity; customers
              demanded guaranteed production outcomes and delivery accountability. By embedding its proprietary
              operating system into physical execution, Zetwerk created operational control mechanisms across 10,000
              suppliers that pure software providers cannot replicate.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Working Capital Drag in High-Volume Principal Trading
            body: >-
              While manufacturing services offer higher margins and asset-light characteristics, high-volume goods
              procurement continues to dominate revenue. Absorbing inventory and working capital risk on behalf of
              enterprise buyers leaves the business exposed to industrial spending downturns and substantial financing
              costs.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Vertical Mix, and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Zetwerk operates as a technology-enabled contract manufacturing and B2B procurement platform structured
              across two principal operating divisions: the core Manufacturing Business and the Ecosystem Business
              (Terra91). In FY26, consolidated revenue from operations expanded 40.4% to ₹15,913.32 crore, rebounding
              vigorously from ₹11,331.86 crore in FY25. The Manufacturing Business served as the primary growth driver,
              expanding 50.0% to generate ₹9,374.68 crore, or 58.9% of consolidated operational turnover. Within
              manufacturing, Energy Products represents the dominant vertical, delivering ₹6,507.57 crore in revenue
              driven by utility-scale renewable components, solar mounting structures, and transmission equipment.
              Meanwhile, the Terra91 Ecosystem Business aggregated industrial commodities, ferrous metals, and
              petrochemicals, contributing ₹6,538.55 crore. Commercial monetization differs markedly across these
              activities: custom manufacturing relies on cost-plus and build-to-print quotation tied to bill of
              materials, whereas commodity trading captures transactional spreads on spot market transactions.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
      - number: '4.2'
        title: Cost Architecture, Procurement Drivers, and Operating Margins
        blocks:
          - type: paragraph
            body: >-
              Zetwerk's cost profile reflects the high procurement volume inherent in managed marketplace manufacturing
              and commodity trade aggregation. In FY26, total operational expenditures reached ₹16,141.73 crore,
              dominated by purchase of stock-in-trade at ₹9,879.75 crore (61.2% of total costs) and direct material
              consumption of ₹3,963.67 crore (24.6% of total costs). Employee benefit expenses rose 34.9% to ₹643.77
              crore as the company scaled engineering and global operational talent. Adjusted EBITDA improved 30.6% to
              ₹421.34 crore, though operating margins remained thin at 2.65%, moderating slightly from 2.85% in FY25. On
              a reported basis, restated consolidated net loss widened by 333% to ₹1,606.17 crore. This loss was heavily
              impacted by ₹835.84 crore in exceptional non-cash adjustments related to the conversion ratios of
              preference share instruments in continuing operations, alongside a ₹453.00 crore impairment loss
              recognized upon classifying the Civil Infrastructure Works business as discontinued.
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI009
      - number: '4.3'
        title: Working Capital Cycle and Operating Cash Flow Absorption
        blocks:
          - type: paragraph
            body: >-
              The central underwriting challenge for Zetwerk is the divergence between accounting operating profit and
              cash conversion. Despite positive adjusted EBITDA, cash flow from operations remained negative for the
              third consecutive fiscal year, with net operating cash outflows widening to ₹681.53 crore in FY26 compared
              to outflows of ₹386.30 crore in FY25 and ₹281.50 crore in FY24. This recurring deficit is driven by
              significant working capital requirements: as of March 31, 2026, trade receivables stood at ₹2,329.93 crore
              and inventories reached ₹1,249.58 crore, against trade payables of ₹2,199.28 crore and acceptances of
              ₹1,014.45 crore. Furthermore, revenue concentration has escalated, with the top 10 enterprise clients
              accounting for 35.90% of total revenue in FY26, up from 26.90% in FY25. Although repeat customers
              generated 80.15% of Manufacturing Business revenue, extended collection cycles and customer concentration
              amplify credit risk and liquidity strain.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI011
      - number: '4.4'
        title: Capital Structure, Leverage Profile, and IPO Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Zetwerk's aggressive physical and geographic expansion—now encompassing 26 owned operating facilities
              across India, the United States, Germany, and Spain—has been supported by substantial debt accumulation.
              Total borrowings climbed to ₹1,936.16 crore by March 31, 2026, comprising ₹1,460.83 crore in short-term
              working capital borrowings and ₹475.33 crore in long-term debt, resulting in ₹366.22 crore in annual
              finance charges. To address this financial leverage, Zetwerk filed its Updated Draft Red Herring
              Prospectus (UDRHP-I) in August 2026 for a public listing comprising a fresh issue of up to ₹2,600.00 crore
              and an offer for sale of up to 96,837,455 equity shares. Management plans to earmark ₹1,800.00 crore of
              fresh proceeds toward prepaying or repaying company and subsidiary debt. Successful debt retirement is the
              critical catalyst required to eliminate finance cost drag and establish positive post-IPO free cash flows.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue Scale Masked by Low-Margin Commodity Pass-Through
            body: >-
              While Zetwerk's consolidated revenue surged 40.4% to ₹15,913.32 crore in FY26, over 41% of the top-line
              stems from Terra91's raw material and commodity trading operations. This commodity aggregation segment
              generates high gross volume but paper-thin gross margins, significantly diluting consolidated profit
              margins relative to pure-play manufacturing platforms.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: callout
            title: Working Capital Burn Outpaces Adjusted EBITDA Gains
            body: >-
              Despite reporting ₹421.34 crore in adjusted EBITDA for FY26, operating cash flows deteriorated to an
              outflow of ₹681.53 crore as inventories and receivables expanded to over ₹3,579 crore. Zetwerk's
              cash-generative profile remains heavily constrained by extended customer payment terms, necessitating
              continuous working capital debt facilities.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI009
          - type: callout
            title: De-Leveraging via IPO Proceeds is Essential for Bottom-Line Health
            body: >-
              Allocating ₹1,800 crore of the proposed ₹2,600 crore fresh IPO issue toward debt reduction is a vital
              strategic measure. By paying down a substantial portion of its ₹1,936.16 crore in total borrowings,
              Zetwerk can eliminate significant finance costs (which exceeded ₹366 crore in FY26) and improve its
              trajectory toward positive consolidated cash flows.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Operating Model and Manufacturing Workflow
        blocks:
          - type: paragraph
            body: >-
              Zetwerk operates as a managed B2B manufacturing platform rather than a passive lead-generation directory.
              In customer workflow terms, enterprise buyers across industrial machinery, renewable energy, consumer
              electronics, and aerospace engage Zetwerk on a principal-to-principal basis, submitting computer-aided
              design (CAD) packages and bill-of-materials (BOM) specifications into Zetwerk OS. Zetwerk's engineering
              systems decompose CAD drawings into component-level process steps, assess design-for-manufacturing (DFM)
              requirements, generate competitive quotes benchmarked against historical procurement data, and allocate
              production across its hybrid network. By coordinating simultaneous manufacturing across distributed
              facilities, Zetwerk compresses procurement lead times while assuming commercial and quality ownership of
              the delivered output.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Product Modules, Zetwerk OS Architecture, and Asset Footprint
        blocks:
          - type: paragraph
            body: >-
              The core technology backbone of the enterprise is Zetwerk OS, a suite of integrated software modules
              designed to standardize execution across distributed third-party and captive assets. The architecture
              consists of five core operating engines: ProcureZ for AI-driven supplier recommendation and capacity
              matching; ZISO (Zetwerk Integrated Systems Orchestrator) for program management and timeline tracking; ZPS
              (Zetwerk Production System) for mobile-first shop-floor tracking and work-order management; ZAQ (Zetwerk
              Assured Quality) for inspection planning and defect logging; and ZHIP for inbound/outbound logistics and
              tracking. On the physical asset layer, Zetwerk combines a network of 6,979 third-party manufacturing
              partners with 26 captive manufacturing facilities in India, Spain, the US, and Germany, covering precision
              machining, fabrication, die casting, forging, and electronics manufacturing services (EMS).
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Quality Controls, Certifications, and Technical Dependencies
        blocks:
          - type: paragraph
            body: >-
              Quality management across Zetwerk OS is enforced through ZAQ and site-level certifications. In electronics
              manufacturing services (EMS), Zetwerk operates 15 surface-mount technology (SMT) lines across facilities
              in Bengaluru, Chennai, and Noida, maintaining ISO 9001, medical-device standard ISO 13485, and
              aerospace-standard AS9100D. Testing workflows incorporate in-line automated 3D optical inspection (AOI),
              3D X-ray inspection, in-circuit testing, and functional environmental testing. Despite these controls,
              technical and operational risks remain concentrated in the hybrid operating architecture: coordinating
              multi-tier production across 26 countries exposes Zetwerk to supplier execution variances, shop-floor data
              collection latency in third-party facilities, and supplier financial or raw-material bottlenecks.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating Leverage Through Parallel Manufacturing
            body: >-
              Zetwerk's operational model achieves structural margin leverage not by owning heavy capital machinery for
              every SKU, but by acting as a principal contractor that distributes production across third-party shops
              using Zetwerk OS. This parallel manufacturing capability allows a single large purchase order to be broken
              into sub-assemblies across dozens of specialized facilities, simultaneously reducing lead times and
              maintaining asset-light return on invested capital.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Quality Variance Across Distributed Vendor Network
            body: >-
              While captive plants in Bengaluru, Chennai, and Mesa operate under stringent AS9100D and ISO 13485
              certifications, extending consistent process control to 6,979 third-party manufacturing partners remains
              an ongoing operational vulnerability. Zetwerk's contractual liability on a principal-to-principal basis
              means quality defects or delivery delays from sub-tier vendors fall directly onto Zetwerk's balance sheet
              and customer relationships.
            calloutType: risk
            claimRefs:
              - CE002
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Architecture and Segment Diversity
        blocks:
          - type: paragraph
            body: >-
              Zetwerk operates as a two-sided managed manufacturing marketplace and precision execution partner catering
              to diversified industrial buyers across three primary operating segments: Energy Products, Precision
              Products, and Capital Goods, complemented by an Ecosystem Business supplying raw materials and
              commodities. As of March 31, 2026, the company served a total customer base of 1,802 accounts, comprising
              1,613 domestic buyers in India and 189 international enterprise accounts. The customer architecture spans
              multiple distinct buyer archetypes, including tier-1 global equipment OEMs, engineering procurement and
              construction (EPC) contractors, high-growth consumer technology hardware brands, and public-sector
              utilities. While the core Manufacturing Business generates high-margin build-to-print component
              production, the Ecosystem Business functions as a volume and working-capital facilitator for SME supplier
              partners and materials purchasers.
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU013
      - number: '6.2'
        title: Adoption Trajectory, Wallet Share Expansion, and Order Book
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Zetwerk's Manufacturing Business demonstrates substantial commercial scaling,
              with segment revenue advancing 50.0% year-over-year to ₹93,746.76 million in FY26 from ₹62,491.02 million
              in FY25 and ₹60,818.51 million in FY24. Growth is characterized by increasing average order value, which
              expanded from ₹45.94 million in FY24 to ₹58.93 million in FY25 and ₹91.74 million in FY26, reflecting
              deeper wallet penetration among major industrial buyers. Commercial revenue durability remains high, with
              repeat customers generating 80.15% of Manufacturing Business revenue in FY26, compared to 84.80% in FY25
              and 78.11% in FY24. Furthermore, the company concluded FY26 with a robust Manufacturing Business order
              book of ₹123,700.09 million, providing forward revenue visibility across multi-quarter capital goods and
              infrastructure programs.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Production Proof Points and Reference Validation
        blocks:
          - type: paragraph
            body: >-
              Commercial validation is substantiated by long-term production contracts with major domestic and
              multinational industrial corporations across high-barrier manufacturing sectors. In the renewable energy
              and power transmission vertical, Zetwerk manufactures critical balance-of-plant components, structural
              solar tracker parts, and wind turbine assemblies for global developers including Siemens Gamesa, NextPower
              (formerly Nextracker), and NTPC Renewable Energy. In precision electronics and IT hardware, the company
              delivers surface-mount PCBAs, smart consumer audio products, and computing hardware for prominent brands
              including boAt (Imagine Marketing) and Acer India Private Limited. Additionally, mission-critical defense
              and heavy industrial contracts with DRDO's LRDE, the Indian Air Force, and Bharat Heavy Electricals
              suppliers demonstrate compliance with stringent defense and aerospace quality protocols.
            claimRefs:
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Customer Acquisition Funnel and Retention Mechanics
        blocks:
          - type: paragraph
            body: >-
              The customer lifecycle begins with digital RFQ submission and automated design-for-manufacturing (DFM)
              analysis, enabling instant quoting and rapid prototyping. Upon contract award, Zetwerk leverages its
              proprietary ProcureZ matchmaking platform to allocate manufacturing steps across qualified third-party
              suppliers, splitting individual orders across an average of 7 parallel suppliers in FY26 to compress
              production cycles. Zetwerk Assured Quality (ZAQ) and ZApps tracking portals maintain continuous shop-floor
              telemetry, allowing the company to consistently achieve on-time in-full (OTIF) delivery exceeding 80%,
              well above the fragmented Indian manufacturing average of 30-40%. Initial transactional purchases
              frequently convert into multi-year recurring supply agreements and take-or-pay volume arrangements,
              driving expansion across buyer divisions.
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU013
      - number: '6.5'
        title: Customer Concentration, Volatility, and Procurement Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Despite broad account breadth across 1,802 clients, Zetwerk exhibits significant and rising revenue
              concentration among its largest enterprise accounts. In FY26, the company's top 10 customers contributed
              35.90% of continuing operations revenue (₹57,135.56 million), representing a marked increase from 26.89%
              in FY25 and 22.37% in FY24. This concentration is compounded by volatility in underlying customer
              retention: Net Revenue Retention (NRR) in the Manufacturing Business compressed sharply to 87.13% in FY25
              before rebounding to 120.24% in FY26, yielding a multi-year median of 128.85%. While top-10 customers have
              maintained an average relationship tenure of 2.8 years out of Zetwerk's eight-year operational history,
              the absence of single-buyer concentration disclosures creates downside vulnerability to procurement
              shifts, delayed capex cycles, or supplier insourcing.
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU014
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Rising Top-10 Customer Concentration Ahead of IPO
            body: >-
              Zetwerk's top 10 enterprise customers generated 35.90% of continuing revenue in FY26, escalating from
              26.89% in FY25 and 22.37% in FY24. In the absence of single-buyer concentration disclosures in the pre-IPO
              filings, sudden contract reassessments or insourcing by anchor renewable energy or consumer electronics
              clients present substantial revenue and margin volatility risk.
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
          - type: callout
            title: Demonstrated Wallet Share Expansion Across Core Accounts
            body: >-
              Despite volatility in FY25 retention metrics, Zetwerk increased its Manufacturing Business average order
              value from ₹45.94 million in FY24 to ₹91.74 million in FY26, underpinned by an 80.15% repeat customer
              revenue share and a ₹123,700.09 million manufacturing order book.
            calloutType: strength
            claimRefs:
              - CU004
              - CU006
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and financial resilience
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is financial-model risk rather than the accounting loss alone. Zetwerk
              reported negative net cash flow from operating activities in each of Fiscals 2024-2026, reaching ₹6,815.29
              million in FY26; this is operating cash flow, not an estimate of cash burn. The UDRHP also records a
              CRISIL A-/Negative/CRISIL A2+ rating dated June 3, 2026, while independent reporting links the negative
              outlook to possible provisions or losses from the civil engineering exit. Inc42 separately reported a FY26
              net loss of ₹1,606.2 crore, but exceptional and discontinued-operation charges mean that figure should not
              be treated as recurring operating consumption. Neoma's earlier pre-IPO note reinforces the structural
              concern: physical inventory and receivables make the model more working-capital intensive than a pure
              software marketplace.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The offer itself is proceeding under SEBI ICDR Regulation 6(2), because the company states that it does
              not meet the Regulation 6(1)(b) eligibility requirement; that is an offer-eligibility fact, not an
              enforcement finding. More direct operating exposures include pending fire no-objection certificates and
              generator or U.S. manufacturing permissions identified in the UDRHP. The filing also discloses a CBI
              charge sheet against subsidiary Kryfs Power Components and a pending proposed income-tax prosecution
              involving director Srinath Ramakkrushnan. Auditor-report modifications spanning FY24-FY26 add a controls
              dimension, including the FY26 inability to verify database audit-trail maintenance and disclosures
              concerning funds advanced through intermediaries. Applications, legal responses, and appointed IPO counsel
              show process maturity, but none establishes a favorable case or permit outcome.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.3'
        title: Operational and counterparty dependencies
        blocks:
          - type: paragraph
            body: >-
              Zetwerk's platform remains operationally exposed to third parties despite its technology layer. Products
              sourced from third-party suppliers represented 80.46% of combined Manufacturing and Ecosystem segment
              revenue in FY26, while the top 10 suppliers represented 38.18% of continuing-operation expenses.
              Downstream concentration also increased: the top 10 customers accounted for 35.90% of continuing revenue
              in FY26, versus 26.89% in FY25 and 22.37% in FY24. These metrics create simultaneous quality, delivery,
              pricing, and collection risk. Zetwerk's own overseas-manufacturing guidance recognizes quality-control
              variation, longer lead times, political or economic instability, and regulatory complexity. A directory
              listing reports ISO 9001:2015 and AS9100D certification for the Mesa operation, but this is
              company-profile evidence rather than an independent audit of group-wide controls.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
      - number: '7.4'
        title: Mitigation, monitoring, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is uneven. Permit applications, cyber safeguards, supplier input/output controls,
              customer credit underwriting, tariff pass-through clauses in newer contracts, and external legal advisers
              are identifiable measures, but the available sources do not independently test their effectiveness. The
              company says it had no IT failures or cybersecurity incidents resulting in data leaks that significantly
              disrupted operations during the last three Fiscals; this scoped issuer statement is not proof that no
              incident occurred. Monitoring should therefore emphasize operating cash flow, receivable days, top-10
              customer and supplier shares, approval status, credit-rating direction, and material litigation
              milestones. Thesis-break events are a sustained inability to fund working capital, loss or suspension of a
              material operating permit, a material adverse legal order, or repeated quality failures that impair
              customer retention; no unsupported numeric threshold is assigned.
            claimRefs:
              - CR006
              - CR010
              - CR012
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR010
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate accounting loss with cash burn
            body: >-
              Inc42 reported a FY26 net loss of ₹1,606.2 crore, while the filing reported negative operating cash flow
              of ₹6,815.29 million. The measures have different definitions and denominators; underwriting should use a
              reconciled cash bridge rather than substituting one for the other.
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
          - type: callout
            title: Evidence-gated kill criteria
            body: >-
              Pause the thesis if working-capital funding becomes unavailable, a material facility permit is suspended,
              a material adverse legal order impairs operations, or repeated quality failures damage retention. Exact
              numeric triggers remain a diligence gap rather than a fabricated threshold.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Underwriting Recommendation
        blocks:
          - type: paragraph
            body: >-
              Zetwerk operates as India's leading B2B managed-marketplace contract manufacturer, connecting over 1,800
              enterprise customers across energy, industrial components, electronics, and aerospace with vetted supplier
              facilities. The core investment thesis rests on Zetwerk capturing the secular manufacturing
              decentralization shift under 'Make in India' and global supply-chain diversification, demonstrating
              massive revenue scale that reached ₹15,913.3 Cr in FY26. However, the anti-thesis is driven by severe
              statutory accounting net losses of ₹1,606.2 Cr in FY26, large working-capital requirements inherent in
              pass-through procurement, and execution risks across capital-intensive overseas plants. Balancesheet
              deleveraging through ₹1,800 Cr of planned IPO debt repayment provides near-term relief, but long-term
              equity returns require sustainable operating cash flows. Consequently, the underwriting recommendation is
              established as track with medium confidence, a high risk rating, and a fair valuation stance pending
              post-listing earnings disclosure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV011
              - CV016
      - number: '8.2'
        title: Financing Trajectory and Private Valuation Benchmarking
        blocks:
          - type: paragraph
            body: >-
              Zetwerk's capitalization history reflects rapid private valuation expansion across more than 19 financing
              rounds, scaling from an initial seed valuation in 2018 to unicorn status in 2021 and culminating in an
              estimated $3.0B to $3.1B benchmark across late-stage Series F and pre-IPO transactions. In March 2025,
              late-stage tranches led by institutional investors including ARK Investment Management, followed by a ₹500
              Cr pre-IPO investment by Bharat Value Fund in 2025-2026, pegged the firm's equity valuation at
              approximately $3.0B to $3.1B. Relative to FY26 operating revenue of ₹15,913.3 Cr (~$1.89B), this private
              mark implies an enterprise multiple of approximately 1.6x trailing revenue. While this valuation multiple
              appears modest compared to pure-play electronics manufacturing peers like Dixon Technologies or Kaynes
              Technology which trade above 4x to 8x revenue, Zetwerk's lower gross margin profile and heavy trading
              component justify a valuation discount.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Scenario Modeling, Dilution Overhang, and IPO Readiness
        blocks:
          - type: paragraph
            body: >-
              Zetwerk's capital structure ahead of its proposed IPO comprises a substantial fresh issue of ₹26,000
              million alongside an offer-for-sale (OFS) of up to 96,837,455 equity shares from promoters and early
              venture backers including Peak XV Partners, Accel, and Lightspeed. Out of the ₹26,000 million fresh issue
              proceeds, management plans to allocate ₹18,000 million (nearly 69%) toward the repayment or prepayment of
              outstanding borrowings, substantially de-risking the corporate balance sheet. In our base case scenario,
              Zetwerk consolidates its manufacturing footprint, sustains 25-30% revenue expansion, and gradually
              improves adjusted EBITDA margins from 2.6% to 4.5%, justifying an IPO market valuation between $3.2B and
              $3.6B. Downside triggers include sustained high net losses, inventory write-downs, or extended receivable
              cycles that consume working capital.
            claimRefs:
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Discipline on IPO Pricing Multiples
            body: >-
              Prospective public investors should anchor entry discipline around Zetwerk's private transaction valuation
              of $3.0B to $3.1B (~1.6x FY26 revenue). While contract electronics peers in India command higher
              multiples, Zetwerk's ₹1,606.2 Cr reported statutory loss and significant marketplace trading revenue
              mandate a conservative multiple cap until operating margins prove durable.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
