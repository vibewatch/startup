  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer lifecycle from instant digital RFQ and parallel supplier allocation through quality-assured
      fulfillment and expansion into multi-year contracts.
    approximationNotes: >-
      Stages and operational touchpoints synthesized from Zetwerk's UDRHP operating disclosures, Lightspeed case study,
      and LeadIQ commercial analysis.
    data:
      items:
        - label: 1. Digital Discovery & RFQ Submission
          touchpoints:
            - OEM or EPC buyer uploads design specifications and CAD files via Zetwerk web portal
            - Proprietary instant quoting engine performs DFM review and estimates pricing within minutes
        - label: 2. Supplier Matching & Capacity Allocation
          touchpoints:
            - ProcureZ engine evaluates supplier capabilities, quality history, and shop-floor capacity
            - Order split across 7 parallel suppliers on average in FY26 to eliminate delivery bottlenecks
        - label: 3. Prototyping & Pilot Qualification
          touchpoints:
            - Stringent technical review with sample fabrication and inspection protocols
            - Initial pilot batch qualified against customer ppm defect tolerances and environmental standards
        - label: 4. Full-Scale Production & Shop-Floor Tracking
          touchpoints:
            - Zetwerk Assured Quality (ZAQ) deployed from raw material receipt to finished assembly
            - ZApps external portals provide buyers with real-time milestone visibility and QA telemetry
        - label: 5. On-Time Logistics & Quality Sign-Off
          touchpoints:
            - Cross-border logistics and customs facilitation for international shipments
            - Consistently achieving 80%+ on-time in-full (OTIF) delivery versus 30-40% industry average
        - label: 6. Land-and-Expand Account Growth
          touchpoints:
            - Expansion from transactional single-part purchase orders into multi-year take-or-pay agreements
            - Wallet share growth driving average order value from ₹45.94M in FY24 to ₹91.74M in FY26
