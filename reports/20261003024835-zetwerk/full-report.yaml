  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & Financial Assumptions
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Revenue CAGR of 35% through FY28; adjusted EBITDA margin expands to 5.5%; overseas facilities reach full
          utilization
        - $4.2B to $4.8B valuation (1.8x-2.0x FY28E revenue), generating 35-50% upside from last private round
        - Supply chain bottlenecks, working capital delays, customer concentration shock
        - 25% - requires rapid margin expansion in precision components
      - - Base Case
        - Revenue CAGR of 22-26%; adjusted EBITDA margin stabilizes at 3.0-3.5%; ₹18,000M debt repaid as planned
        - $3.2B to $3.6B valuation (1.3x-1.5x FY27E revenue), delivering stable market-rate returns
        - Persistent trading gross margin dilution, competitive pricing pressure in renewables
        - 55% - consistent with historical organic volume expansion and current run rate
      - - Bear Case
        - >-
          Revenue growth slows below 12%; international units generate continuing impairment; working capital strain
          persists
        - $2.0B to $2.4B valuation (0.9x-1.0x revenue), reflecting 20-35% multiple compression from last private marks
        - Secondary share overhang from selling venture funds, prolonged working capital drag
        - 20% - triggered if post-IPO cash burn forces additional dilutive financing
    notes: >-
      Scenario analysis models forward revenue multiples against trailing $3.0B-$3.1B private marks and IPO capital
      structure.
