chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Zetwerk Manufacturing Businesses Limited was incorporated as a private company on December 6, 2017, while
              its filing and third-party profiles describe 2018 as the commercial launch or founding year [CO001,
              CO002]. Its registered and corporate office is in Bellandur, Bengaluru [CO004]. The operating model is
              broader than a referral marketplace: Zetwerk coordinates custom manufacturing, supplier selection,
              production, quality, logistics, and inventory through a mix of third-party suppliers, owned facilities,
              and software [CO003]. That hybrid design can widen process and geographic coverage, but it also leaves
              execution dependent on supplier controls and cross-border coordination rather than on software alone. The
              legal entity converted to a public limited company in February 2026 as it prepared for an initial public
              offering [CO001, CO016].
