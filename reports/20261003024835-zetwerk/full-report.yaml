      - number: '1.4'
        title: Scale and diligence posture
        blocks:
          - type: paragraph
            body: >-
              As of March 31, 2026, the filing reports 1,802 customers, 26 owned manufacturing facilities across India,
              Spain, the United States, and Germany, and 3,554 employees plus 6,422 contract labourers [CO010, CO011,
              CO012]. FY26 operating revenue was ₹15,913.3 crore, up 40.4% from FY25, while the reported accounting net
              loss widened to ₹1,606.2 crore [CO013, CO014]. The loss is not a measure of cash burn, and revenue is not
              ARR. The combination of rapid scale, a dispersed production network, and an IPO structure that directs
              substantial proceeds toward borrowing repayment supports a late-stage, capital-intensive profile rather
              than a low-capital software marketplace analogy [CO003, CO011, CO016]. The filing is the strongest
              assigned source for dated scale metrics, while October 2026 customer, workforce, and valuation figures
              remain unverified gaps rather than values to extrapolate.
            claimRefs:
