              - CO006
      - number: '1.3'
        title: Funding, valuation, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              The clearest historical financing marker in the assigned evidence is the August 2021 Series E: Liquidity
              reported a $150 million round led by D1 Capital Partners at a $1.33 billion valuation, with Avenir and
              IIFL joining existing investors [CO008]. BounceWatch separately records a March 2024 Series F investment
              of INR 1.65 billion from Wheelhouse Ventures, but that database entry lacks primary confirmation in the
              assigned source set [CO009]. Inc42 reports more than $900 million raised and a latest ₹500 crore pre-IPO
              round at a valuation above $3 billion; its company profile gives a more precise cumulative figure of
              $929.62 million-plus [CO015]. These are funding raised and transaction valuation signals, not cash
              available. The August 2026 filing adds a proposed fresh issue of up to ₹26 billion and an offer for sale,
              with a large debt-repayment allocation, making capital structure and post-offer ownership central
              diligence items [CO016].
            claimRefs:
              - CO008
              - CO009
              - CO015
              - CO016
