  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Procurement Scope, and Manufacturing Platform Model
        blocks:
          - type: paragraph
            body: >-
              The addressable market for modern contract manufacturing and B2B platforms is structurally defined by
              durable goods procurement rather than broad industrial output. Durable goods represent discrete,
              engineered components and assemblies defined by rigorous specifications, tolerances, and drawings across
              energy equipment, precision components, consumer hardware, and capital goods. Zetwerk operates as an
              aggregation and orchestration layer connecting distributed original equipment manufacturers (OEMs) with
              fragmented third-party manufacturing suppliers across 26 countries. By decoupling manufacturing execution
              from heavy captive asset ownership, the platform pools uncoordinated factory capacity to shorten customer
              delivery cycles and orchestrate multi-tier production schedules. However, addressable platform scope
              deliberately excludes commoditised high-volume non-durable supplies, raw material extraction, and
              uncoordinated civil construction projects. Zetwerk's strategic divestment of its non-core Civil
              Infrastructure Works division underscores this strict focus on high-precision durable goods and industrial
              contract manufacturing.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.2'
        title: 'Market Sizing: Durable Goods Procurement TAM and Constrained Platform Potential'
        blocks:
          - type: paragraph
            body: >-
              Independent industry assessments from the Redseer Report establish that the Total Addressable Market (TAM)
              for manufacturing platforms in Fiscal 2026 reaches INR 10.26 trillion to INR 12.57 trillion (USD 120.65
              billion to USD 147.91 billion) in India and INR 2.07 trillion to INR 6.26 trillion (USD 24.32 billion to
              USD 73.60 billion) in the United States. Driven by secular policy tailwinds, geopolitical supply
              rebalancing, and digital supplier integration, this platform TAM is projected to expand by Fiscal 2031 to
              INR 17.68 trillion to INR 20.00 trillion (USD 208.01 billion to USD 235.27 billion) in India and INR 26.76
              trillion to INR 30.95 trillion (USD 314.81 billion to USD 364.09 billion) in the United States. Within
              India, broader durable goods manufacturing is anchored by rapidly scaling verticals such as electronics,
              where total domestic electronics production expanded from INR 1.9 lakh crore in FY15 to INR 11.3 lakh
              crore in FY25. Zetwerk's Serviceable Addressable Market (SAM) is bounded by categories with high
              coordination intensity, rapid design revision cycles, and high multi-tier supply dispersion, encompassing
              Energy Products, Precision Products, and high-value capital components. Its Serviceable Obtainable Market
              (SOM) is demonstrated by its Fiscal 2026 continuing operations revenue of INR 15,913.3 crore, where core
              manufacturing contributed INR 9,374.7 crore alongside INR 6,538.6 crore from its digital trade and
              ecosystem procurement platform.
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
