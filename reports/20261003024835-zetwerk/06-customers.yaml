chapter:
  number: 6
  title: "Customers"
  summary: "Zetwerk served 1,802 commercial customers across India and global markets in FY26, anchored by strong repeat order behavior (80.15% repeat revenue) and an expanding ₹123,700.09 million manufacturing order book, but faces escalating revenue concentration as its top 10 accounts expanded to 35.90% of continuing revenue."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Architecture and Segment Diversity"
    body: "Zetwerk operates as a two-sided managed manufacturing marketplace and precision execution partner catering to diversified industrial buyers across three primary operating segments: Energy Products, Precision Products, and Capital Goods, complemented by an Ecosystem Business supplying raw materials and commodities. As of March 31, 2026, the company served a total customer base of 1,802 accounts, comprising 1,613 domestic buyers in India and 189 international enterprise accounts. The customer architecture spans multiple distinct buyer archetypes, including tier-1 global equipment OEMs, engineering procurement and construction (EPC) contractors, high-growth consumer technology hardware brands, and public-sector utilities. While the core Manufacturing Business generates high-margin build-to-print component production, the Ecosystem Business functions as a volume and working-capital facilitator for SME supplier partners and materials purchasers."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-scale"
    title: "Adoption Trajectory, Wallet Share Expansion, and Order Book"
    body: "The adoption trajectory of Zetwerk's Manufacturing Business demonstrates substantial commercial scaling, with segment revenue advancing 50.0% year-over-year to ₹93,746.76 million in FY26 from ₹62,491.02 million in FY25 and ₹60,818.51 million in FY24. Growth is characterized by increasing average order value, which expanded from ₹45.94 million in FY24 to ₹58.93 million in FY25 and ₹91.74 million in FY26, reflecting deeper wallet penetration among major industrial buyers. Commercial revenue durability remains high, with repeat customers generating 80.15% of Manufacturing Business revenue in FY26, compared to 84.80% in FY25 and 78.11% in FY24. Furthermore, the company concluded FY26 with a robust Manufacturing Business order book of ₹123,700.09 million, providing forward revenue visibility across multi-quarter capital goods and infrastructure programs."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-customer-deployments"
    title: "Production Proof Points and Reference Validation"
    body: "Commercial validation is substantiated by long-term production contracts with major domestic and multinational industrial corporations across high-barrier manufacturing sectors. In the renewable energy and power transmission vertical, Zetwerk manufactures critical balance-of-plant components, structural solar tracker parts, and wind turbine assemblies for global developers including Siemens Gamesa, NextPower (formerly Nextracker), and NTPC Renewable Energy. In precision electronics and IT hardware, the company delivers surface-mount PCBAs, smart consumer audio products, and computing hardware for prominent brands including boAt (Imagine Marketing) and Acer India Private Limited. Additionally, mission-critical defense and heavy industrial contracts with DRDO's LRDE, the Indian Air Force, and Bharat Heavy Electricals suppliers demonstrate compliance with stringent defense and aerospace quality protocols."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "customer-journey-expansion"
    title: "Customer Acquisition Funnel and Retention Mechanics"
    body: "The customer lifecycle begins with digital RFQ submission and automated design-for-manufacturing (DFM) analysis, enabling instant quoting and rapid prototyping. Upon contract award, Zetwerk leverages its proprietary ProcureZ matchmaking platform to allocate manufacturing steps across qualified third-party suppliers, splitting individual orders across an average of 7 parallel suppliers in FY26 to compress production cycles. Zetwerk Assured Quality (ZAQ) and ZApps tracking portals maintain continuous shop-floor telemetry, allowing the company to consistently achieve on-time in-full (OTIF) delivery exceeding 80%, well above the fragmented Indian manufacturing average of 30-40%. Initial transactional purchases frequently convert into multi-year recurring supply agreements and take-or-pay volume arrangements, driving expansion across buyer divisions."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU011"
      - "CU013"
    figureRefs:
      - "FU001"
  - id: "concentration-and-procurement-risks"
    title: "Customer Concentration, Volatility, and Procurement Vulnerabilities"
    body: "Despite broad account breadth across 1,802 clients, Zetwerk exhibits significant and rising revenue concentration among its largest enterprise accounts. In FY26, the company's top 10 customers contributed 35.90% of continuing operations revenue (₹57,135.56 million), representing a marked increase from 26.89% in FY25 and 22.37% in FY24. This concentration is compounded by volatility in underlying customer retention: Net Revenue Retention (NRR) in the Manufacturing Business compressed sharply to 87.13% in FY25 before rebounding to 120.24% in FY26, yielding a multi-year median of 128.85%. While top-10 customers have maintained an average relationship tenure of 2.8 years out of Zetwerk's eight-year operational history, the absence of single-buyer concentration disclosures creates downside vulnerability to procurement shifts, delayed capex cycles, or supplier insourcing."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU008"
      - "CU014"
