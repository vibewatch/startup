company:
  name: "Zetwerk"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Zetwerk is a Bengaluru-based manufacturing platform that combines a third-party supplier network with owned facilities and operating software. Its August 2026 offer document reports 1,802 customers, 26 owned facilities across four countries, and FY26 operating revenue of ₹15,913.3 crore, but current valuation, cumulative funding, and post-filing governance remain partly dependent on third-party reporting."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Zetwerk Manufacturing Businesses Limited was incorporated as a private company on
      December 6, 2017, while its filing and third-party profiles describe 2018 as the
      commercial launch or founding year [CO001, CO002]. Its registered and corporate
      office is in Bellandur, Bengaluru [CO004]. The operating model is broader than a
      referral marketplace: Zetwerk coordinates custom manufacturing, supplier selection,
      production, quality, logistics, and inventory through a mix of third-party suppliers,
      owned facilities, and software [CO003]. That hybrid design can widen process and
      geographic coverage, but it also leaves execution dependent on supplier controls and
      cross-border coordination rather than on software alone. The legal entity converted
      to a public limited company in February 2026 as it prepared for an initial public
      offering [CO001, CO016].
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO016"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The offer document identifies Amrit Pratik Acharya and Srinath Ramakkrushnan as the
      promoters, while Zetwerk's current media resources list them as chief executive
      officer and chief operating officer, respectively [CO005]. The same official resource
      lists Ankit Fatehpuria as chief financial officer, Rahul Sharma as managing director
      for the electronics business, and Vishal Chaudhary as managing director for aerospace
      and defence [CO006]. This roster gives visible functional ownership across finance and
      major verticals, but the assigned evidence does not establish a complete board roster,
      executive succession plan, or the depth of deputies below these leaders. Dependence
      therefore remains most material around the two promoter-executives and the specialist
      vertical heads; this is a diligence conclusion, not evidence that a leadership
      transition is planned.
    claimRefs:
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "funding-and-stakeholders"
    title: "Funding, valuation, and stakeholders"
    body: >-
      The clearest historical financing marker in the assigned evidence is the August 2021
      Series E: Liquidity reported a $150 million round led by D1 Capital Partners at a
      $1.33 billion valuation, with Avenir and IIFL joining existing investors [CO008].
      BounceWatch separately records a March 2024 Series F investment of INR 1.65 billion
      from Wheelhouse Ventures, but that database entry lacks primary confirmation in the
      assigned source set [CO009]. Inc42 reports more than $900 million raised and a latest
      ₹500 crore pre-IPO round at a valuation above $3 billion; its company profile gives a
      more precise cumulative figure of $929.62 million-plus [CO015]. These are funding
      raised and transaction valuation signals, not cash available. The August 2026 filing
      adds a proposed fresh issue of up to ₹26 billion and an offer for sale, with a large
      debt-repayment allocation, making capital structure and post-offer ownership central
      diligence items [CO016].
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "scale-and-diligence-posture"
    title: "Scale and diligence posture"
    body: >-
      As of March 31, 2026, the filing reports 1,802 customers, 26 owned manufacturing
      facilities across India, Spain, the United States, and Germany, and 3,554 employees
      plus 6,422 contract labourers [CO010, CO011, CO012]. FY26 operating revenue was
      ₹15,913.3 crore, up 40.4% from FY25, while the reported accounting net loss widened
      to ₹1,606.2 crore [CO013, CO014]. The loss is not a measure of cash burn, and revenue
      is not ARR. The combination of rapid scale, a dispersed production network, and an
      IPO structure that directs substantial proceeds toward borrowing repayment supports
      a late-stage, capital-intensive profile rather than a low-capital software marketplace
      analogy [CO003, CO011, CO016]. The filing is the strongest assigned source for dated
      scale metrics, while October 2026 customer, workforce, and valuation figures remain
      unverified gaps rather than values to extrapolate.
    claimRefs:
      - "CO003"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
