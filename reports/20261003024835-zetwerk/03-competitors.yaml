callouts:
  - calloutType: "insight"
    title: "Software Orchestration as Control Layer Rather Than Standalone Product"
    body: "Zetwerk's evolution highlights that software alone cannot solve industrial procurement opacity; customers demanded guaranteed production outcomes and delivery accountability. By embedding its proprietary operating system into physical execution, Zetwerk created operational control mechanisms across 10,000 suppliers that pure software providers cannot replicate."
    claimRefs:
      - "CP005"
      - "CP006"
  - calloutType: "risk"
    title: "Working Capital Drag in High-Volume Principal Trading"
    body: "While manufacturing services offer higher margins and asset-light characteristics, high-volume goods procurement continues to dominate revenue. Absorbing inventory and working capital risk on behalf of enterprise buyers leaves the business exposed to industrial spending downturns and substantial financing costs."
    claimRefs:
      - "CP009"
      - "CP011"
