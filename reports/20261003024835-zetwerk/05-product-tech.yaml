callouts:
  - calloutType: "insight"
    title: "Operating Leverage Through Parallel Manufacturing"
    body: "Zetwerk's operational model achieves structural margin leverage not by owning heavy capital machinery for every SKU, but by acting as a principal contractor that distributes production across third-party shops using Zetwerk OS. This parallel manufacturing capability allows a single large purchase order to be broken into sub-assemblies across dozens of specialized facilities, simultaneously reducing lead times and maintaining asset-light return on invested capital."
    claimRefs:
      - "CE003"
      - "CE004"
  - calloutType: "risk"
    title: "Quality Variance Across Distributed Vendor Network"
    body: "While captive plants in Bengaluru, Chennai, and Mesa operate under stringent AS9100D and ISO 13485 certifications, extending consistent process control to 6,979 third-party manufacturing partners remains an ongoing operational vulnerability. Zetwerk's contractual liability on a principal-to-principal basis means quality defects or delivery delays from sub-tier vendors fall directly onto Zetwerk's balance sheet and customer relationships."
    claimRefs:
      - "CE002"
      - "CE012"
      - "CE013"
