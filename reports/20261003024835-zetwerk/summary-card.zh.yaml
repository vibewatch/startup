  topStrengths:
    - 规模切实确立：FY26 收入达 ₹15,913.3 crore，同比增长 40.4%。
    - 业务覆盖广泛的企业级客户群，横跨能源、工业、电子、可再生能源和航空航天。
    - 拟议 IPO 募资包含大额偿债安排，若顺利实施，有望减轻财务成本拖累。
