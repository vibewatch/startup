callouts:
  - calloutType: "risk"
    title: "Do not equate accounting loss with cash burn"
    body: "Inc42 reported a FY26 net loss of ₹1,606.2 crore, while the filing reported negative operating cash flow of ₹6,815.29 million. The measures have different definitions and denominators; underwriting should use a reconciled cash bridge rather than substituting one for the other."
    claimRefs:
      - "CR005"
      - "CR007"
  - calloutType: "recommendation"
    title: "Evidence-gated kill criteria"
    body: "Pause the thesis if working-capital funding becomes unavailable, a material facility permit is suspended, a material adverse legal order impairs operations, or repeated quality failures damage retention. Exact numeric triggers remain a diligence gap rather than a fabricated threshold."
    claimRefs:
      - "CR005"
      - "CR008"
      - "CR010"
      - "CR013"
