company:
  name: "Zetwerk"
chapter:
  number: 7
  title: "Risks"
  summary: "Zetwerk's most consequential disclosed risks are cash conversion, supplier and customer concentration, pending operating approvals, and multi-jurisdiction litigation. The FY26 filing shows negative operating cash flow of ₹6,815.29 million, top-10 supplier and customer concentration of 38.18% and 35.90%, respectively, and several pending facility approvals; mitigations exist, but public evidence does not close incident, concentration, or case-outcome gaps."
sections:
  - id: "risk-ranking-and-financial-resilience"
    title: "Risk ranking and financial resilience"
    body: "The highest residual exposure is financial-model risk rather than the accounting loss alone. Zetwerk reported negative net cash flow from operating activities in each of Fiscals 2024-2026, reaching ₹6,815.29 million in FY26; this is operating cash flow, not an estimate of cash burn. The UDRHP also records a CRISIL A-/Negative/CRISIL A2+ rating dated June 3, 2026, while independent reporting links the negative outlook to possible provisions or losses from the civil engineering exit. Inc42 separately reported a FY26 net loss of ₹1,606.2 crore, but exceptional and discontinued-operation charges mean that figure should not be treated as recurring operating consumption. Neoma's earlier pre-IPO note reinforces the structural concern: physical inventory and receivables make the model more working-capital intensive than a pure software marketplace."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "legal-regulatory-and-governance"
    title: "Legal, regulatory, and governance exposure"
    body: "The offer itself is proceeding under SEBI ICDR Regulation 6(2), because the company states that it does not meet the Regulation 6(1)(b) eligibility requirement; that is an offer-eligibility fact, not an enforcement finding. More direct operating exposures include pending fire no-objection certificates and generator or U.S. manufacturing permissions identified in the UDRHP. The filing also discloses a CBI charge sheet against subsidiary Kryfs Power Components and a pending proposed income-tax prosecution involving director Srinath Ramakkrushnan. Auditor-report modifications spanning FY24-FY26 add a controls dimension, including the FY26 inability to verify database audit-trail maintenance and disclosures concerning funds advanced through intermediaries. Applications, legal responses, and appointed IPO counsel show process maturity, but none establishes a favorable case or permit outcome."
    claimRefs:
      - "CR001"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-and-counterparty-dependencies"
    title: "Operational and counterparty dependencies"
    body: "Zetwerk's platform remains operationally exposed to third parties despite its technology layer. Products sourced from third-party suppliers represented 80.46% of combined Manufacturing and Ecosystem segment revenue in FY26, while the top 10 suppliers represented 38.18% of continuing-operation expenses. Downstream concentration also increased: the top 10 customers accounted for 35.90% of continuing revenue in FY26, versus 26.89% in FY25 and 22.37% in FY24. These metrics create simultaneous quality, delivery, pricing, and collection risk. Zetwerk's own overseas-manufacturing guidance recognizes quality-control variation, longer lead times, political or economic instability, and regulatory complexity. A directory listing reports ISO 9001:2015 and AS9100D certification for the Mesa operation, but this is company-profile evidence rather than an independent audit of group-wide controls."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR013"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "mitigation-monitoring-and-kill-criteria"
    title: "Mitigation, monitoring, and thesis-break criteria"
    body: "Mitigation maturity is uneven. Permit applications, cyber safeguards, supplier input/output controls, customer credit underwriting, tariff pass-through clauses in newer contracts, and external legal advisers are identifiable measures, but the available sources do not independently test their effectiveness. The company says it had no IT failures or cybersecurity incidents resulting in data leaks that significantly disrupted operations during the last three Fiscals; this scoped issuer statement is not proof that no incident occurred. Monitoring should therefore emphasize operating cash flow, receivable days, top-10 customer and supplier shares, approval status, credit-rating direction, and material litigation milestones. Thesis-break events are a sustained inability to fund working capital, loss or suspension of a material operating permit, a material adverse legal order, or repeated quality failures that impair customer retention; no unsupported numeric threshold is assigned."
    claimRefs:
      - "CR006"
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR016"
    figureRefs:
      - "FR001"
