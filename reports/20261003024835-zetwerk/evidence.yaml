evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-and-valuation
    missingEvidence: >-
      A primary, security-by-security reconciliation of cumulative capital raised, the July 2026 pre-IPO round, exact
      post-money valuation, and current cash availability.
    whyItMatters: >-
      Third-party databases provide inconsistent aggregate funding signals, and neither funding raised nor a transaction
      valuation establishes cash on hand.
    diligencePath: >-
      Reconcile the final RHP capital table, share issuances, preference terms, debt schedule, and audited cash balance
      to executed financing documents.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      A complete current board roster, executive biographies, reporting lines, deputy coverage, succession plans, and
      material leadership changes after the August filing.
    whyItMatters: >-
      Promoter and specialist-leader dependence cannot be sized from titles alone, and public-company governance quality
      depends on board independence and succession depth.
    diligencePath: >-
      Obtain the final RHP management chapter, board committee charters, organization chart, employment agreements, and
      management-reference interviews.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: current-scale
    missingEvidence: >-
      Customer, employee, contract-labour, and facility counts updated from March 31, 2026 to the October 3, 2026 run
      date.
    whyItMatters: >-
      The filed scale metrics are dated and should not be presented as an October operating snapshot without an updated
      denominator.
    diligencePath: Request an October management KPI pack and reconcile it to the final RHP operating-statistics tables.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: tam-segmentation
    missingEvidence: >-
      Granular bottom-up market sizing specifically isolating managed marketplace take rates from gross durable goods
      procurement across individual industrial sub-segments in India.
    whyItMatters: >-
      Gross procurement TAM aggregates total factory output rather than the software coordination fee and margin take
      rate capturable by platform operators.
    diligencePath: Review Redseer proprietary durable goods database annexures and DRHP segment take-rate disclosures post-listing.
    relatedQuestionRefs:
      - QM001
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-retention
    missingEvidence: Audited cohort Net Revenue Retention (NRR) and gross churn rates across top 100 enterprise manufacturing buyers.
    whyItMatters: >-
      Without formal long-term volume contracts, understanding whether OEM buyer spend expands predictably
      year-over-year is critical for underwriting valuation.
    diligencePath: Examine statutory DRHP Annexure on key performance indicators and customer repeat transaction metrics.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-win-rates
    missingEvidence: >-
      Audited enterprise win/loss rates, customer churn, and contract renewal figures comparing Zetwerk against
      specialized EMS and domestic fabrication peers.
    whyItMatters: >-
      Without objective contract renewal and churn data, differentiation durability against traditional machine shop
      multi-homing cannot be independently verified.
    diligencePath: >-
      Review DRHP confidential customer annexures or conduct direct procurement interviews with Fortune 500
      manufacturing supply officers.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin and take rate breakdown by discrete manufacturing vertical (Energy vs Precision vs Aerospace)
      and factory utilization metrics.
    whyItMatters: >-
      Without vertical-level gross margin and facility utilization data, investors cannot verify whether recent margin
      stability is structural or a temporary mix effect.
    diligencePath: >-
      Request management's confidential vertical-level contribution margin schedules and plant-level capacity
      utilization reports during pre-IPO roadshow diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: telemetry-coverage
    missingEvidence: >-
      Granular breakdown of what percentage of third-party supplier machines have live IoT telemetry vs mobile manual
      logging via ZPS.
    whyItMatters: >-
      Direct automated telemetry reduces the risk of supplier reporting lag or fabricated progress updates during
      critical project milestones.
    diligencePath: Request ZPS deployment audit across tier-1 and tier-2 vendor base during technical management meetings.
    relatedQuestionRefs:
      - QE001
  - type: missing-source
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: >-
      Public developer platform metrics (e.g. GitHub repos, API developer forums) are not maintained by Zetwerk due to
      its B2B industrial nature.
    whyItMatters: Validates technical engagement and software developer adoption for proprietary internal systems like Zetwerk OS.
    diligencePath: >-
      Review engineering recruitment listings, technical architecture conference talks, and internal software
      whitepapers.
    relatedQuestionRefs:
      - QE001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-disclosure
    missingEvidence: >-
      Audited single largest customer revenue share and individual top-10 customer identity breakdown in pre-IPO
      filings.
    whyItMatters: >-
      Top 10 customer concentration rose to 35.90% in FY26 (from 22.37% in FY24), but individual client contributions
      and single-buyer vulnerability remain undisclosed.
    diligencePath: >-
      Review subsequent Red Herring Prospectus (RHP) disclosures and request audited customer concentration schedule
      during management diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: Exhaustive contract-level enumeration of all 1,802 commercial customer relationships and contract values.
    whyItMatters: >-
      Public disclosure only reveals prominent customer logos and selected case studies, leaving long-tail customer
      health and SME retention unverified.
    diligencePath: Request customer cohort revenue waterfall and account-level revenue distribution schedule under NDA.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: independent-cyber-incident-history
    missingEvidence: >-
      Independent incident records, regulator notices, customer notifications, and current penetration-test or SOC
      findings through the run date.
    whyItMatters: >-
      The filing's scoped statement about data leaks and significant disruption does not prove the absence of other
      incidents or control weaknesses.
    diligencePath: >-
      Obtain the incident register, DPDP readiness assessment, current SOC reports, penetration-test remediation log,
      and customer notifications.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
