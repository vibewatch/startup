  - type: conflicting-data
    severity: material
    topic: TAM-methodology
    missingEvidence: >-
      Analyst K-12 SIS estimates diverge by more than 50x ($0.2B to $41B) with no public methodology reconciliation
      available. Global Growth Insights reports $41.43B while CivicIQ's contract database implies $0.2B for SIS alone;
      neither estimate directly represents PowerSchool's SAM.
    whyItMatters: >-
      TAM drives growth expectations and valuation multiples; a 50x error in TAM framing produces a 50x error in implied
      greenfield opportunity. Investors using the $41B figure for PowerSchool analysis will materially overstate
      remaining penetration headroom.
    diligencePath: >-
      Normalize each estimate by identifying included/excluded spend categories, geographies, and education levels;
      accept only the post-normalization $1–2.4B North American platform range as the working SAM for investment
      analysis.
