  - type: missing-source
    severity: material
    topic: SAM-methodology
    missingEvidence: >-
      No single analyst publishes a well-bounded North American K-12 full-platform administrative software market size
      that matches PowerSchool's actual product scope (SIS + LMS + assessment + SpEd + HR). The closest proxy (Apps Run
      the World US K-12 software) is derived from a global estimate with a regional share assumption, not a direct US
      market measurement.
    whyItMatters: >-
      Without a clean SAM boundary, PowerSchool's penetration ratio (and therefore remaining growth headroom) cannot be
      independently verified. The 30–72% penetration range is too wide to anchor valuation analysis.
    diligencePath: >-
      Commission a boundary-specific market sizing from HolonIQ or Ariadne Analytics using PowerSchool's actual product
      scope as the definitional boundary; cross-reference with CoSN district technology budget survey data.
    relatedQuestionRefs:
