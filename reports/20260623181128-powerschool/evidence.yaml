evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-private-ownership
    missingEvidence: >-
      Exact ownership percentages held by Bain Capital, Vista Equity Partners, and Onex Corporation; debt facility
      principal, interest rate, covenant terms, and maturity dates; management equity incentive plan and option pool
      details.
    whyItMatters: >-
      Capital structure, governance rights, and debt covenants directly affect strategic flexibility, the likelihood of
      a future exit or secondary transaction, and the priority of claims in a distress scenario. Without this, the
      investor map can only reflect announced names, not economic or control weights.
    diligencePath: >-
      Request the current capitalization table, the full credit agreement for acquisition debt, and the shareholder
      rights agreement from management or Bain Capital.
    relatedQuestionRefs:
