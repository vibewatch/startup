    severity: blocking
    topic: post-private-financials
    missingEvidence: >-
      FY2024 and FY2025 revenue, ARR, gross margin, net income/loss, free cash flow, and headcount; breach remediation
      costs; litigation reserve; any publicly disclosed post-take-private revenue guidance or management update.
    whyItMatters: >-
      The breach and CEO transition occurred after the last public financial filing; any assessment of execution
      continuity, growth trajectory, or breach financial impact requires post-private data that is unavailable from
      public sources.
    diligencePath: >-
      Request board materials, management accounts, or a data-room package covering revenue, ARR, gross margin, EBITDA,
