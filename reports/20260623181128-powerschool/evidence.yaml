  - type: missing-source
    severity: material
    topic: post-breach-churn
    missingEvidence: >-
      No public data is available on PowerSchool customer churn, contract cancellations, or competitive displacement
      attributable specifically to the December 2024 data breach. The company went private in October 2024 and is no
      longer required to file public quarterly disclosures.
    whyItMatters: >-
      The breach is the most proximate near-term risk to ARR. Without churn data, the investment thesis cannot
      distinguish between a manageable reputational hit and a materially accelerating customer loss.
    diligencePath: >-
      Request management data on: (1) percentage of ARR under active contract review citing the breach; (2) districts
