  - id: legal-regulatory-risk
    title: Legal, Regulatory, and Compliance Risk
    body: >
      PowerSchool faces an exceptionally broad and multi-jurisdictional legal and regulatory
      exposure arising from the December 2024 breach, the Naviance third-party tracking lawsuit,
      and ongoing privacy enforcement trends in K-12 technology. The consolidated class action
      litigation—MDL-3142, In re PowerSchool Holdings, Inc. and PowerSchool Group, LLC Customer
      Security Breach Litigation, in the U.S. District Court for the Southern District of California
      under Judge Roger T. Benitez—combined 55 separate federal actions alleging negligence, breach
      of contract, and unjust enrichment on behalf of students, parents, teachers, and school
      districts. As of March 2026, plaintiffs survived a motion to dismiss, with privacy and unjust
      enrichment claims proceeding to merits litigation. No global settlement has been announced;
      the case continues to advance toward potential trial or settlement conference.

      A separate and precedent-setting development occurred on March 18, 2026, when the S.D. Cal.
      court denied Bain Capital's motion to dismiss, allowing claims for aiding and abetting,
      negligence, negligence per se, unjust enrichment, and California unfair competition violations
      to proceed against the PE parent. The court found that Bain exercised de facto control over
      PowerSchool's cybersecurity operations, workforce decisions, and capital expenditures both
      before and after the acquisition, including directing the offshoring of IT and cybersecurity
      functions in ways that allegedly worsened the breach trajectory. This is the first known
      federal ruling allowing a PE firm to be held potentially liable for a portfolio company's
      data breach based on operational control theory, creating a novel and material precedent for
      investor-level exposure.

      The Naviance platform litigation resulted in a $17.25 million settlement filed February 24,
      2026 in the Northern District of Illinois (preliminary approval by Judge Jorge Alonso), affecting
      10+ million current and former Naviance users who alleged that PowerSchool embedded Heap Inc.
      analytics tracking code without student or parental consent. Separately, a pre-breach privacy
      lawsuit filed May 2024 (Cherkin v. PowerSchool, N.D. Cal.) survived partial dismissal in
      March 2025, with privacy intrusion and unjust enrichment claims proceeding.

      On the regulatory front, North Carolina Attorney General Jeff Jackson announced an investigation
      on February 6, 2025, affecting nearly 4 million North Carolinians, and issued a formal Civil
      Investigative Demand to PowerSchool in June 2025 requiring disclosure of cybersecurity measures,
      breach root causes, and response communications. Canada's privacy commissioner launched a
      parallel investigation in February 2025. The Ontario Information and Privacy Commissioner
      released final findings in November 2025, ordering affected Ontario institutions to demonstrate
      security compliance within six months. The U.S. Department of Education launched a FERPA
      compliance review following the breach; no formal enforcement action had been publicly announced
      as of June 2026, but FERPA's enforcement mechanism—conditioning federal funding—creates
      existential exposure for PowerSchool if the DOE moves to formal proceedings. Texas filed its
      own attorney general action alleging failure to implement basic security including MFA, adequate
      access controls, and encryption, despite PowerSchool's marketing materials claiming highest
      security standards. Under FERPA and numerous state privacy laws, PowerSchool operates as a
      school official data custodian with strict data use limitations and breach notification
      obligations; in at least one jurisdiction (Student Data Privacy Consortium National DPA, used
      in 26+ states), contractual MFA requirements were allegedly violated.
