        abetting, negligence, negligence per se, unjust enrichment, and California unfair competition
        to proceed against Bain as parent company—the first known federal ruling of its kind holding
        a PE firm potentially liable for a portfolio company data breach on an operational control theory.
      type: observed
      topic: legal-risk
      sourceRefs:
        - SR004
