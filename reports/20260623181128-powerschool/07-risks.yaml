        - NC AG enforcement action filed; or 5+ additional state AGs joining formal investigation
        - NC AG civil or criminal action against PowerSchool; or multi-state settlement demand above $50 million
        - "High risk — accelerates district churn evaluation cycle; increases legal reserve requirements materially"
      - - SIS market share erosion (competitive churn)
        - Additional statewide procurement switches from PowerSchool to Infinite Campus or Skyward
        - Second statewide migration announced (post–North Carolina); or ARR churn rate exceeds 5% per year
        - "High risk — structurally undermines SIS market leadership thesis; triggers valuation downside scenario"
      - - CEO / CISO / CLO executive departure during active litigation
        - Resignation announcement or departure of Pietri, Gay, or Bisignano before 12-month tenure
        - Any C-suite departure during active MDL, state AG investigation, or DOE review
        - "Medium risk — continuity risk for regulatory and customer relationships; signals internal instability to counterparties"
    notes: >
      Triggers are designed to be monitorable from public sources (court dockets, SEC-equivalent
      regulatory filings, state AG press releases, news reporting, Civic IQ contract data). Thresholds
      are analyst judgments calibrated to PowerSchool's approximately $741 million pre-breach revenue
