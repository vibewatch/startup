  claims:
    - id: CR001
      statement: >
        Between December 19 and December 28, 2024, a threat actor used stolen subcontractor
        credentials to access PowerSchool's PowerSource customer support portal—which lacked
        mandatory multi-factor authentication—and systematically exfiltrated student and teacher
        database records from thousands of school districts across North America.
      type: observed
      topic: security-risk
      sourceRefs:
        - SR010
        - SR014
        - SR003
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR001
        - QR002

    - id: CR002
      statement: >
        The PowerSchool December 2024 breach exposed personally identifiable information of
        approximately 62 million students and 9.5 million teachers including full names, addresses,
        dates of birth, Social Security numbers, medical information, disability accommodations,
        IEPs, disciplinary records, grade histories, and family financial data across 6,500+ school
        districts in the U.S., Canada, and other countries.
      type: observed
      topic: security-risk
      sourceRefs:
        - SR005
        - SR010
        - SR014
        - SR026
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR002

    - id: CR003
      statement: >
        PowerSchool paid approximately $2.85 million in Bitcoin to the attacker in late December 2024,
        receiving a video purportedly showing the deletion of stolen data; despite this payment,
        the same threat actor began extorting individual school districts in May 2025 using samples
        of the stolen data, demonstrating that the ransom payment failed to ensure data destruction.
      type: observed
      topic: security-risk
      sourceRefs:
        - SR003
        - SR013
        - SR029
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR003
        - QR031

    - id: CR004
      statement: >
        Matthew D. Lane, a 19-year-old college student from Assumption University in Worcester,
        Massachusetts, pleaded guilty in May 2025 to cyber extortion conspiracy, cyber extortion,
        unauthorized computer access, and aggravated identity theft; U.S. District Judge Margaret
        Guzman sentenced Lane on October 15, 2025 to four years in federal prison and $14.1 million
        in restitution.
      type: observed
      topic: security-risk
      sourceRefs:
        - SR005
        - SR010
        - SR021
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR004

    - id: CR005
      statement: >
        The Ontario Information and Privacy Commissioner released formal findings in November 2025
        concluding that PowerSchool's absent mandatory MFA, always-on remote maintenance access,
        limited log retention, and delayed detection all materially contributed to the breach's
        severity, and ordered affected Ontario institutions to demonstrate compliance with security
        and oversight recommendations within six months.
      type: third-party-reported
      topic: security-risk
      sourceRefs:
        - SR005
        - SR010
        - SR008
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR009

    - id: CR006
      statement: >
        The Future of Privacy Forum removed PowerSchool from its Student Privacy Pledge on February 13,
        2025, citing the failure to implement multi-factor authentication as a direct violation of
        pledge requirements to maintain a comprehensive security program appropriate to the sensitivity
        of student PII; FPF retired the Student Privacy Pledge entirely on April 25, 2025.
      type: observed
      topic: security-risk
      sourceRefs:
        - SR025
        - SR023
        - SR011
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR013

    - id: CR007
      statement: >
        PowerSchool's post-breach remediation has included MFA implementation for all PowerSource
        employee and contractor access, time-based access controls, engagement of Experian for victim
        identity protection, and CrowdStrike for forensics; total known breach-related costs exceed
        $14 million in identity protection alone, with criminal restitution of $14.1 million ordered.
      type: company-claimed
      topic: security-risk
      sourceRefs:
        - SR022
        - SR005
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QR014
        - QR018

    - id: CR008
      statement: >
        Despite PowerSchool's post-breach hardening, the SIS platform holds consolidated records
        for more than 60 million students across 18,000+ districts, making it a permanently high-value
        target for credential theft and bulk exfiltration that no single hardening program can
        fully eliminate.
      type: inferred
      topic: security-risk
      sourceRefs:
        - SR014
        - SR022
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QR014

    - id: CR009
      statement: >
        Toronto's District School Board, serving approximately 240,000 students, confirmed in May 2025
        that it had received an extortion demand using data from the December 2024 breach, with stolen
        records dating back to at least 2009; multiple North Carolina school districts also reported
        receiving extortion demands using the same data.
      type: third-party-reported
      topic: security-risk
      sourceRefs:
        - SR003
        - SR010
      confidence: high
      freshness: recent
      answersQuestionRefs:
        - QR031

    - id: CR010
      statement: >
        K-12 Security Information Exchange co-founder Doug Levin characterized the PowerSchool
        breach as having "fundamentally shook" school systems' trust in large edtech vendors,
        noting that schools are "only as strong as their weakest link" and that the breach caused
        fundamental rethinking of vendor data security as an element of school cybersecurity posture.
      type: third-party-reported
      topic: security-risk
      sourceRefs:
        - SR005
        - SR015
      confidence: medium
      freshness: recent

