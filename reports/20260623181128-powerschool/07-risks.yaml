  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: post-lbo-financials
      missingEvidence: >
        PowerSchool's ARR, EBITDA, debt quantum, debt service coverage, cash position, and
        financial covenant status as of June 2026; none are publicly disclosed after the October
        2024 take-private.
      whyItMatters: >
        Without post-LBO financial data, it is impossible to assess whether PowerSchool has
        adequate liquidity to fund both LBO debt service and the $40M+ in known breach remediation
        costs, or whether financial covenant defaults could trigger a restructuring event.
      diligencePath: >
        Request audited financial statements, debt agreement terms, and board-approved projections
        in formal diligence; cross-check with Bain Capital investor communications for any
        guidance on breach-related reserve adequacy.
      relatedQuestionRefs:
        - QR017
        - QR019

    - type: private-evidence-only
      severity: material
      topic: mdl-litigation-settlement-estimate
      missingEvidence: >
        PowerSchool's internal legal reserve estimate for MDL-3142, attorney-client communication
        on settlement authority, and D&O / cyber liability insurance policy limits and coverage
        scope for aiding-and-abetting PE parent claims.
      whyItMatters: >
        The total settlement exposure from 55+ class actions and Bain Capital co-defendant status
        is unquantified from public sources; comparable education breach settlements suggest
        multi-hundred-million-dollar exposure.
      diligencePath: >
        Request legal reserve schedules, insurance policy summaries, and outside counsel assessment
        of MDL exposure range in formal diligence.
      relatedQuestionRefs:
        - QR005
        - QR006
        - QR018
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: material
      topic: post-breach-churn-rate
      missingEvidence: >
        Actual ARR churn rate for the post-breach renewal cohort (districts renewing after January
        2025); number of districts that have formally initiated migration away from PowerSchool
        beyond North Carolina; competitive win/loss rate for new district acquisitions in 2026.
      whyItMatters: >
        The thesis depends on SIS contract stickiness limiting churn despite trust erosion; without
        actual churn data, the North Carolina migration cannot be confirmed as an isolated event
        rather than the leading edge of structural market share decline.
      diligencePath: >
        Request renewal pipeline data, net dollar retention rate, and win/loss reports from the
        sales team covering the January–June 2026 period; review Civic IQ contract database for
        non-renewal signals from active monitoring.
      relatedQuestionRefs:
        - QR020
        - QR029

    - type: stale
      severity: minor
      topic: security-audit-post-breach
      missingEvidence: >
        Third-party independent security audit or penetration test results confirming adequacy
        of post-breach hardening measures including MFA implementation scope, access control
        architecture, and residual vulnerability surface.
      whyItMatters: >
        PowerSchool has stated it has implemented enhanced security, but no independent
        attestation of these measures is publicly available; the absence of a public audit
        report prevents independent verification of remediation completeness.
      diligencePath: >
        Request CrowdStrike final forensic report, independent penetration test results,
        and updated SOC 2 Type II attestation incorporating post-breach controls.
      relatedQuestionRefs:
        - QR014

    - type: missing-source
      severity: material
      topic: naviance-third-party-tracking-scope
      missingEvidence: >
        Complete technical inventory of third-party analytics and tracking pixels embedded in
        Naviance and other non-SIS PowerSchool products; independent audit of whether similar
        wiretapping/CIPA violations exist across the broader product portfolio beyond the
        $17.25M Naviance settlement scope.
      whyItMatters: >
        The Naviance wiretapping settlement addresses one product line; PowerSchool's portfolio
        includes additional counseling, assessment, and communication tools that may contain
        embedded analytics with similar unauthorized data-sharing exposures. Failure to identify
        and remediate these before they surface in litigation would create incremental legal
        liability and regulatory risk beyond what is currently quantified.
      diligencePath: >
        Request technical data flow maps for all product lines; independent code audit for
        third-party analytics integrations; review DPA compliance reports across the full
        product suite; verify scope of Naviance settlement release.
      relatedQuestionRefs:
        - QR030

