  - id: financial-pe-ownership-risk
    title: Financial, LBO Debt, and Private Equity Ownership Risk
    body: >
      Bain Capital's $5.6 billion leveraged buyout of PowerSchool, which closed October 1, 2024,
      created a financial risk profile typical of high-multiple PE transactions: an estimated
      $3.8 billion or more in acquisition debt against a company generating approximately $741 million
      in trailing revenue and $268–273 million in adjusted EBITDA at the time of take-private. The
      interest service burden constrains discretionary investment capacity precisely when PowerSchool
      faces its highest-ever remediation, legal, and cybersecurity reinvestment requirements. Post-LBO
      financials are fully private; PowerSchool stopped SEC reporting after the October 2024
      take-private, and no ARR, EBITDA, cash position, or debt covenant disclosures are publicly
      available as of June 2026. This opacity prevents independent assessment of financial covenant
      compliance, breach-related cash drain, or debt maturity runway.

      The breach has already created quantifiable financial costs: at least $14 million in victim
      identity protection services, $14.1 million in court-ordered restitution to the Lane
      conviction (collection uncertain), the $17.25 million Naviance settlement (February 2026), and
      ongoing legal defense costs across MDL-3142 and multiple state AG proceedings. The MDL
      settlement, if reached, could add hundreds of millions to remediation costs based on comparable
      K-12 breach precedents and the 60+ million affected individuals. Bain Capital's own potential
      liability exposure—with the March 2026 ruling allowing claims against it to proceed—creates a
      second financial exposure vector that standard portfolio company indemnification structures
      may not fully insulate. Bain-directed post-close decisions including at least 5% domestic IT
      layoffs and cybersecurity offshoring have been cited by the court as the basis for aiding-and-
      abetting liability, making these operational cost-cutting measures simultaneously financial
      and legal risks. The combination of undisclosed debt load, unquantified breach liability, and
      PE ownership opacity represents a material underwriting blind spot for any investor or
      counterparty attempting to assess PowerSchool's financial resilience.
