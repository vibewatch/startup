callouts:
  - calloutType: strength
    title: Dominant installed base with extreme switching costs
    body: >-
      PowerSchool's 18,000-customer installed base, 23% SIS market share, and presence in 90+ of the top
      100 US districts by enrollment create a structural revenue moat. SIS-switching costs are documented
      in the hundreds of thousands of dollars per district (North Carolina paid $415,000 just for data
      transfer), meaning voluntary churn requires a forcing event rather than a simple competitive offer.
      NRR of 107% confirms that expansion within the base more than offsets any organic attrition.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU022
      - CU032
  - calloutType: risk
    title: December 2024 breach created a material trust and legal liability overhang
    body: >-
      The December 2024 breach affecting 62 million students and 9.5 million teachers is the largest K-12
      data exposure in US history and the most significant adverse customer event in PowerSchool's history.
      North Carolina's full statewide departure demonstrates that even deeply embedded customers will switch
      under sufficient pressure. Post-breach extortion campaigns against individual districts, multiple
      class-action lawsuits, attorney general investigations, and removal from the Student Privacy Pledge
      compound trust erosion in ways that pure product retention metrics do not capture. The financial
      liability from ongoing litigation and potential regulatory fines is unquantified.
    claimRefs:
      - CU030
      - CU031
      - CU033
