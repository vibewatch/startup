  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: post-LBO-NRR
      missingEvidence: Post-October 2024 NRR, ARR, and gross renewal rate disclosures from PowerSchool under Bain Capital ownership
      whyItMatters: The December 2024 breach is the most material adverse event in PowerSchool's customer history; without post-breach NRR, investors cannot assess whether switching behavior has accelerated
      diligencePath: Request Q4 2024, Q1 2025, and Q2 2025 ARR and NRR from PowerSchool management during due diligence; compare against pre-breach 107% baseline
      relatedQuestionRefs:
        - QU011

    - type: missing-source
      severity: material
      topic: statewide-contract-inventory
      missingEvidence: Comprehensive list of remaining statewide or multi-district cooperative SIS contracts and their renewal timelines
      whyItMatters: Statewide contracts represent high-magnitude concentration risk; NC's departure cost an entire state's student records; other state-level relationships may carry similar vulnerability
      diligencePath: Review contract databases (CivicIQ, state procurement portals) for statewide PowerSchool contracts; request management disclosure of remaining state-level relationships
      relatedQuestionRefs:
        - QU021
        - QU001

    - type: private-evidence-only
      severity: material
      topic: post-breach-Canada-retention
      missingEvidence: Contract renewal rates and churn data for Canadian school boards following the breach extortion campaign (Toronto DSB, Peel DSB, Calgary BOE)
      whyItMatters: Canada represents a distinct customer concentration with active extortion exposure; failure to retain major Canadian boards would reduce customer count and signal trust impairment internationally
      diligencePath: Request Canadian customer renewal data from PowerSchool; review Canadian privacy commissioner investigation outcomes
      relatedQuestionRefs:
        - QU021

    - type: missing-source
      severity: minor
      topic: independent-outcome-attribution
      missingEvidence: Independent third-party evaluations attributing student outcome improvements (graduation rates, attendance, AP performance) causally to PowerSchool product deployments
      whyItMatters: All outcome data currently comes from either company-published case studies or district-issued press releases; without independent causal attribution, the strength of customer evidence is overstated
      diligencePath: Request independent efficacy studies or controlled evaluations; review PowerSchool Research Institute publications; commission third-party analysis of Newark, Spokane, or Fort Wayne data
      relatedQuestionRefs:
        - QU007
      relatedTableRefs:
        - TU003

