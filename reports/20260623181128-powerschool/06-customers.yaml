chapter:
  number: 6
  title: Customers
  summary: >-
    PowerSchool serves over 60 million students across 18,000+ customers in 90+ countries, holds 23% of
    the US K-12 SIS market, and counts more than 90 of the top 100 US districts by enrollment. Pre-breach
    NRR of 107% (Q1 2024) and an estimated 95% gross renewal rate reflect extremely high switching costs,
    but the December 2024 data breach triggered North Carolina's full statewide departure to Infinite Campus
    (completed July 2025), class-action lawsuits, and attorney general investigations — creating the first
    material concentration-of-trust risk in the company's installed-base history.
sections:
  - id: customer-base-segmentation
    title: Customer base segmentation and buyer universe
    body: >-
      PowerSchool's customer base is anchored in the US public K-12 system but spans private schools,
      charter operators, state agencies, and international education authorities across more than 90 countries.
      As of June 2026, the company claims over 18,000 customers and supports more than 60 million students,
      making it the largest K-12 education software platform by installed base. More than 90 of the top 100
      US school districts by student enrollment — representing the country's largest and most complex
      education agencies — are confirmed PowerSchool customers. The buyer persona is predominantly the
      district technology director or superintendent, who signs multi-year, annually renewable subscription
      contracts on behalf of the district as a whole. Funding flows through state and federal education
      appropriations, not individual school budgets, creating a procurement cycle governed by school board
      approvals and state bidding rules.

      Segment composition divides into four broad tiers. Large public districts (typically 10,000+ students)
      are the flagship segment; PowerSchool markets specifically to districts in the top 100 by enrollment
      and claims 90+ of those as customers across at least one product. Mid-size public districts (1,000-10,000
      students) constitute the broadest numeric band of the 18,000-customer base, representing the core
      renewal engine. Small and rural districts plus charter networks round out domestic coverage. International
      customers — across Canada, the Middle East, South Asia, and beyond — represent a growing but less
      documented share of the customer base. Product penetration varies substantially by segment: large districts
      are more likely to hold multi-module contracts spanning SIS, LMS, HR, analytics, and CCLR, while smaller
      districts often begin with SIS alone and expand over subsequent renewal cycles.

      Three platform products anchor the customer relationship. PowerSchool SIS (including eSchoolPlus and
      eSembler for larger districts) is the entry point for the vast majority of customers. Schoology Learning,
      PowerSchool's K-12 LMS, holds a 19% LMS market share as of May 2026 and serves 4,000+ organizations.
      Naviance CCLR reaches more than 8 million students and is implemented in 35% of US high schools,
      making it the second most widely deployed PowerSchool product by student count. The fourth and increasingly
      strategic layer is the PowerBuddy AI assistant, deployed within Schoology and Naviance and currently
      expanding to early-adopter districts as the primary land-and-expand driver in the Bain Capital era.
