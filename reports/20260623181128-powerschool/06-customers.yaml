  - id: named-customer-proof
    title: Named customer proof and documented outcomes
    body: >-
      PowerSchool has published verifiable named-customer case studies and press releases that go beyond logo
      displays. The strongest production-level evidence comes from Tomball Independent School District in Texas,
      which announced a formal partnership in September 2024, deploying six distinct PowerSchool products
      including eSchoolPlus SIS, Schoology Learning, Applicant Tracking, Employee Records, eFinancePlus, and
      Predictive Enrollment Analytics — a multi-product deployment covering SIS, LMS, HR, finance, and
      enrollment management. Tomball ISD also became the first Texas district to pilot PowerBuddy, the company's
      generative AI assistant, for curriculum development and student support. The district's superintendent
      cited "natural integration with existing edtech products" as the deciding factor — a signal that
      PowerSchool's platform integration is a live sales driver, not merely a marketing claim.

      Fort Wayne Community Schools, Indiana's largest district serving 30,000 students, is a named CCLR
      (Naviance) deployment where PowerSchool became the district's essential partner for meeting state
      college-and-career readiness mandates at scale. Newark Public Schools, New Jersey's largest district,
      provides the strongest publicly documented academic outcomes: between 2018 and 2025, the district's
      four-year graduation rate rose from 76% to 90%, AP passing scores increased 340%, early college
      enrollment grew 345%, and students failing core courses fell by 62.6%. PowerSchool is named as integral
      to Newark's data tracking and intervention infrastructure. Volusia County Schools (FL) deployed Connected
      Intelligence and cites real-time automation of actionable instructional planning processes, and Epic
      Charter Schools (OK) uses PowerBuddy within Schoology to support personalized virtual learning.
      Customer evidence quality is consistently company-published or customer-issued for production deployments,
      but independent third-party outcome attribution is limited, and no named customer has published an
      independent audit validating causal linkage between PowerSchool deployments and outcome improvements.
