  - id: FU002
    title: Adoption / deployment funnel — SIS to multi-product expansion
    type: flow
    layout: standard
    summary: Districts enter PowerSchool via SIS and flow through module expansion layers; the breach created a secondary exit path from the renewal node for districts with heightened compliance exposure.
    data:
      nodes:
        - label: K-12 district procurement
          description: 23,000+ US school districts; ~18,000 PowerSchool customers across US, Canada, and 90+ countries. RFP driven by state bid rules and board approval.
        - label: SIS core deployment
          description: Entry module (eSchoolPlus / eSembler / PS SIS). Average initial ACV ~$10,604. Anchors the vendor relationship and creates data-lock.
        - label: LMS expansion (Schoology)
          description: 4,000 organizations; 7M students; 19% K-12 LMS market share (May 2026). Deployed in second or subsequent renewal cycles.
        - label: CCLR expansion (Naviance)
          description: 8M students; 35% of US high schools. College-and-career readiness module used by Fort Wayne Community Schools and 35% of US high school districts.
        - label: Analytics + AI expansion
          description: Connected Intelligence (Snowflake-backed) for data analytics. PowerBuddy AI deployed within Schoology and Naviance. Tomball ISD first Texas pilot (Sep 2024).
        - label: Annual renewal or competitive exit
          description: "~95% gross renewal (est.). Expansion cohort drives NRR to 107%. Post-breach exits: NC statewide (Jul 2025); elevated Canada churn risk."
      edges:
        - from: K-12 district procurement
          to: SIS core deployment
          label: Initial contract award
        - from: SIS core deployment
          to: LMS expansion (Schoology)
          label: Yr 2-3 renewal cross-sell
        - from: SIS core deployment
          to: CCLR expansion (Naviance)
          label: CCLR mandate driver
        - from: LMS expansion (Schoology)
          to: Analytics + AI expansion
          label: PowerBuddy / CI add-on
        - from: CCLR expansion (Naviance)
          to: Analytics + AI expansion
          label: Naviance AI / CCLR+
        - from: Analytics + AI expansion
          to: Annual renewal or competitive exit
          label: Annual renewal decision
        - from: SIS core deployment
          to: Annual renewal or competitive exit
          label: SIS-only districts
