  - id: adoption-trajectory
    title: Adoption trajectory and market penetration
    body: >-
      PowerSchool's adoption trajectory from 2021 through 2024 is documented in public equity filings and
      validated by independent market-intelligence data. Annual Recurring Revenue grew from roughly $594 million
      at IPO (August 2021) to $720.3 million by March 31, 2024, an 18% year-over-year increase, driven by
      cross-sell, module expansion, and acquisitions. Subscription and support revenue represented 90% of total
      Q1 2024 revenue of $185 million, confirming the durability of the installed base. The last publicly
      disclosed NRR was 107% as of Q1 2024, indicating that revenue expansion within the existing customer base
      exceeded any churned revenue — the defining unit-economic signal for a K-12 SaaS thesis. Post-October
      2024 take-private, PowerSchool ceased public financial reporting and no updated ARR or NRR figures are
      publicly available for fiscal 2025 or 2026.

      Third-party market intelligence corroborates the penetration story. ListEdTech's May 2026 data confirms
      Schoology at 19% K-12 LMS market share — stable since 2022 after accelerating during the 2020-2021
      remote-learning boom. CivicIQ's April 2026 contract database tracks 54 PowerSchool SIS engagements with
      an average annual contract value of $10,604, rising to $24,939 for software renewals — evidence that
      multi-year customers layer on modules that increase effective ACV. Landbase's August 2025 technology
      deployment data verifies 5,291 confirmed organizations globally using PowerSchool products.

      Product-recognition milestones in 2025-2026 confirm continued platform momentum despite the breach. In
      June 2025, Snowflake recognized PowerSchool as its 2025 Public Sector Data Cloud Product Partner of
      the Year at Snowflake Summit, underscoring the Connected Intelligence analytics platform. In June 2026,
      the EdTech Breakthrough Awards named Schoology "Overall LMS Solution Provider of the Year" from a pool
      of 3,000+ global nominations. The 2026 K-12 EdTech Pulse, released February 3, 2026, surveyed 1,300+
      educators and found that financial uncertainty, AI adoption, and attendance management are the three
      dominant district priorities — all addressable by PowerSchool's current product suite and expansion roadmap.
