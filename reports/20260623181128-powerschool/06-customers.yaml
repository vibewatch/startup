  - id: expansion-and-concentration-risk
    title: Expansion economics and concentration risk
    body: >-
      PowerSchool's expansion model is structured around the K-12 Connected Operating System thesis: a
      district that buys SIS can add Schoology, then Naviance, then analytics, then HR and talent, then AI
      layers — each renewal cycle represents an upsell opportunity. The CivicIQ data shows that renewal
      contracts average $24,939 versus $10,604 for initial SIS contracts, a 135% premium, validating that
      existing customers do buy more over time. NRR of 107% at the revenue level confirms that expansion
      outpaces churn across the installed base. The PowerBuddy AI assistant is the most recent expansion
      driver and is currently being deployed as a premium module within Schoology, creating a new revenue
      layer on top of the existing LMS subscription.

      Concentration risk is real but distributed. No single district represents a material share of revenue
      — the installed base of 18,000+ customers is spread across US public districts, charters, private
      schools, and international authorities. However, statewide contracts (where a state agency standardizes
      on PowerSchool for all districts) represent a higher-impact concentration: when North Carolina departed,
      it removed a statewide SIS contract plus supporting educator HR modules from PowerSchool's book of
      business. The company retains a short-term extension for NCEES educator evaluation and applicant
      tracking in North Carolina, but the core SIS relationship — affecting hundreds of thousands of
      students statewide — is lost. Canada represents a separate concentration surface given the breach's
      Canada-specific extortion fallout (Toronto District School Board, Peel District School Board, Calgary
      Board of Education were all named victims). Post-breach contract renegotiations are shifting leverage
      toward districts: buyers are now demanding indemnification clauses, mandatory MFA attestation, SOC 2
      Type 2 reports, and breach-notification SLAs that did not exist in most pre-2024 contracts.
    claimRefs:
