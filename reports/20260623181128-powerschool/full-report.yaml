      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >
              PowerSchool was created in 1997 by Greg Porter, a computer science teacher who saw the need for a simple,
              web-accessible system to track student information. The company changed hands multiple times before its
              current institutional ownership structure. As of June 2026, Antonio Pietri leads the company as CEO,
              effective October 6, 2025. Pietri succeeded Hardeep Gulati, who led PowerSchool for more than a decade and
              presided over the Vista-Onex era, the 2021 IPO, multiple platform acquisitions, and the Bain Capital
              take-private. Gulati transitioned to a Senior Advisor role to support continuity through the handover.
              Pietri brings extensive technology-sector experience; he previously served as President and CEO of Aspen
              Technology from 2013 until its acquisition by Emerson in early 2025.


              The broader leadership team as of the Bain ownership period includes Eric Shander as President and CFO,
              Devendra Singh as CTO, Marcy Daniel as Chief Product Officer, Rich Gay as Chief Information Security
              Officer, and Michael Bisignano as Chief Legal Officer. Key-person dependence risk is a material
              consideration: Gulati's decade-long tenure centralized institutional memory in a single executive, and
              Pietri's appointment by Bain Capital—rather than an internal promotion—signals that the new majority owner
              is resetting the management model for a private-equity-driven growth phase. As a private company,
              PowerSchool no longer files public governance disclosures; board composition, investor-reserved rights,
              and the terms governing Bain's majority stake and the Vista/Onex minority positions are not publicly
              available. The CEO transition also came within months of the December 2024 data breach, compounding
              execution uncertainty.
