  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, segments, and sizing methodology
        blocks:
          - type: paragraph
            body: >-
              PowerSchool's addressable market spans multiple interconnected K-12 administrative software segments
              rather than a single product category. The core segment is the Student Information System:
              mission-critical software that every public school district must maintain to track student enrollment,
              attendance, grades, scheduling, and state-mandated compliance reporting. Layered on top of SIS are
              Learning Management Systems that connect classroom instruction with student records, assessment platforms
              that manage formative and benchmark testing, special-education administration tools required to document
              Individualized Education Programs and Section 504 plans under IDEA, and district HR and finance software
              that rounds out the administrative back-office. PowerSchool sells across all of these segments under one
              connected platform, making the market boundary wider than any single software category. Status-quo
              substitutes include legacy on-premise SIS systems, custom-built district solutions, and point-solution
              vendors offering only one module—all of which PowerSchool displaces through platform consolidation.

              The US K-12 sector provides a concrete sizing denominator. The National Center for Education Statistics
              reports approximately 19,183 public school districts and 49.3 million enrolled students for the 2024-25
              school year, down from 50.8 million in 2019. CivicIQ's contract database puts the average annual SIS
              contract at roughly $10,600 per district, implying a US public-district SIS-only spend floor of about $203
              million—a floor that excludes private and charter schools and omits adjacent modules that expand
              per-customer revenue substantially. Analyst sizing diverges widely depending on scope. Mordor Intelligence
              estimates the all-education SIS market at $15.44 billion globally in 2025, growing at 14.6 percent CAGR,
              while Global Growth Insights applies a broader K-12 student management scope and reports $41.43 billion
              for 2025 at an 8.74 percent CAGR. Apps Run the World estimates the K-12 software applications market at
              $6.2 billion globally in 2024, growing to $8.4 billion by 2029, with North America representing
              approximately 38 percent. Grand View Research notes North America held 33.4 percent of global SIS revenue
              in 2022. The gap between $15 billion and $41 billion reflects differences in geographic scope, education
              level coverage, and inclusion of non-software management services; neither figure maps directly to
              PowerSchool's serviceable market without boundary adjustment.
