      - number: '3.2'
        title: Direct SIS and ERP Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Infinite Campus and Skyward are the two most credible direct replacements for PowerSchool SIS, with
              meaningfully different strategic profiles. Infinite Campus, founded in 1993 and headquartered in Blaine,
              Minnesota, serves exclusively the K-12 market. Its nearly 3,000 district customers pay average annual fees
              of $19,000 to $44,000 per district—materially higher than PowerSchool's $10,604 average per Civic IQ
              contract database data—signaling deeper per-district implementation scope and a stickier, higher-value
              revenue model. Infinite Campus is particularly strong in special education integrated IEP modules and
              standards-based grading, areas where districts have cited dissatisfaction with PowerSchool. Following the
              breach, Infinite Campus and Skyward both reported increased RFP inquiries as districts reassess vendor
              risk. Skyward, owned by Tyler Technologies (NYSE: TYL) since 1999, serves more than 2,000 districts and is
              concentrated in Texas—where more than 270 districts rely on it—and the Midwest. Tyler Technologies'
              balance sheet provides Skyward sustained investment capacity and integration into a broader public-sector
              software portfolio covering finance and permitting. Skyward differentiates through full ERP scope covering
              SIS, HR, payroll, and finance rather than pure SIS depth, making it compelling for districts wanting a
              single vendor for both academic and business administration. Focus School Software represents a newer
              entrant gaining California traction as Aeries customers seek alternatives: Apple Valley Unified School
              District selected Focus to replace Aeries for its 2026-2027 implementation. Blackbaud serves independent
              and private K-12 schools with an integrated SIS, LMS, admissions, and fundraising platform (Raiser's Edge
              NXT) that public-district SIS vendors do not meaningfully replicate. PowerSchool's multi-product breadth
              spanning SIS, Schoology LMS, HR modules, analytics, and Naviance counseling distinguishes it from any
              single-layer rival.
