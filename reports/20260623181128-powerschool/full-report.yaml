figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      PowerSchool's public record runs from a 1997 web-based SIS founding through four ownership transitions, a 2021
      IPO, and a 2024 Bain take-private, with the December 2024 data breach as the dominant adverse inflection point.
    data:
      items:
        - date: '1997'
