          label: Data integration and interoperability layer
          detail: >-
            Ed-Fi v4/v5 API, OneRoster v1.1/1.2, LTI Advantage 1.3, OAuth 2.0/SAML SSO. Certified interoperability with
            state ODS systems and 3rd-party edtech tools.
