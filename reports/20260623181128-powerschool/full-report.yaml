      - number: '3.3'
        title: Feature and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Across the buying criteria that matter most to district procurement teams—core SIS functionality, LMS
              integration, parent portal, HR and workforce management, special education IEP compliance, state
              reporting, and AI-powered analytics—PowerSchool covers more categories than any single rival but leads in
              none of them on a per-category depth basis. Infinite Campus is widely rated superior for special education
              workflows and standards-based grading customization. Skyward leads in full ERP integration including
              payroll and finance. Frontline Education offers the deepest K-12 HR suite including absence management,
              recruiting, and professional development tools that PowerSchool's HR add-on modules only partially
              replicate. Instructure Canvas commands approximately 24% of the K-12 LMS market with a product that
              competing districts describe as having a superior grading interface and stronger alignment to
              higher-education workflows, making it a credible challenger to Schoology in medium-to-large districts.
              Google Classroom, available free through Google Workspace for Education Fundamentals, exerts structural
              price pressure on every paid LMS including Schoology—particularly at the elementary level where LMS
              sophistication requirements are lower. Clever's SSO and app-integration layer, deployed in approximately
              70% of U.S. school districts, functions as a neutral integration layer that reduces any single-vendor
              lock-in margin. PowerSchool's AI buildout, including PowerBuddy and agentic administrative features
              embedded across its suite in 2025-2026, provides near-term differentiation, but Infinite Campus, Skyward,
              and Frontline Education are all actively developing competing AI-powered workflows, compressing the
              differentiation window. Pricing across all major SIS vendors is opaque and quote-based, with Civic IQ
              contract data providing the most reliable public window into actual district spend.
