      - number: '7.5'
        title: Leadership, Execution, and Customer Trust Risk
        blocks:
          - type: paragraph
            body: >
              PowerSchool's CEO transition—Hardeep Gulati out, Antonio Pietri in as of October 6, 2025— introduces
              execution risk at the worst possible moment: with active multi-district litigation, ongoing state
              regulatory investigations, a North Carolina statewide contract loss, and district-level trust erosion
              requiring sustained executive attention. Pietri brings a strong technology-sector track record from Aspen
              Technology, where he led the company through sustained growth and a successful acquisition by Emerson in
              early 2025. However, he has no prior K-12 education sector experience, and the institutional
              relationships, regulatory familiarity, and education-specific stakeholder credibility Gulati built over a
              decade cannot be transferred through an advisory role alone. Gulati's transition to Senior Advisor
              mitigates key-person risk at the margin, but critical customer relationships at the superintendent and
              state education department level are at elevated renewal risk during an extended leadership handover
              period.

              The broader leadership team under Bain's ownership includes Eric Shander as President and CFO, Devendra
              Singh as CTO, Marcy Daniel as Chief Product Officer, Rich Gay as CISO, and Michael Bisignano as Chief
              Legal Officer. The CISO role is strategically critical given the breach fallout, but CISO effectiveness
              depends on Bain-level support for security investment—the same investment stream Bain constrained through
              post-acquisition IT layoffs. The disconnect between PE ownership's cost-cutting directives and the
              security reinvestment necessary to rebuild customer trust is a structural execution risk that no
              individual executive appointment can fully resolve.

              Customer trust erosion following the breach is deep and persistent. K-12 Security Information Exchange
              co-founder Doug Levin characterized the breach as having "fundamentally shook" school systems' trust in
              large edtech vendors. Districts are demanding enhanced security provisions in contract renewals, and Civic
              IQ's monitoring of school board meetings confirms that hundreds of districts evaluated alternative SIS
              vendors during 2025. The stickiness of SIS switching costs—multi-year migrations costing hundreds of
              thousands per district—means churn will be gradual rather than sudden, but the competitive review pipeline
              initiated by the breach creates a multi-year ARR headwind. Each major district that switches to Infinite
              Campus or Skyward represents not only lost ARR but a visible reference account that accelerates
              competitive evaluation in adjacent districts. The thesis-break scenario is a cascade of statewide
              migrations that structurally shifts SIS market share before PowerSchool can rebuild security credibility
              and trust.
