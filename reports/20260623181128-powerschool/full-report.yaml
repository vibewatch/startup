      - number: '1.5'
        title: Milestones, adverse events, and breach impact
        blocks:
          - type: paragraph
            body: >
              PowerSchool's history includes a string of ownership transitions, product acquisitions, and governance
              events spanning nearly three decades, as well as a single adverse event in 2024–2025 that fundamentally
              changed the company's risk profile. In December 2024, a threat actor used the stolen credentials of a
              PowerSchool subcontractor to access the company's PowerSource customer support portal. The portal lacked
              multifactor authentication, and the attacker used administrative tools within it to export personal data
              from thousands of school districts across North America. The breach exposed data belonging to
              approximately 62 million students and 9.5 million teachers, including names, addresses, Social Security
              numbers, dates of birth, medical and disability records, special education information, and passwords in
              some cases. Some exposed data dated back over two decades. The attacker, later identified as Matthew Lane,
              a Massachusetts college student, extorted PowerSchool for approximately $2.85 million in Bitcoin; the
              company paid the ransom and received video purportedly showing deletion of the stolen data, but
              cybersecurity experts note this provides no verified guarantee. PowerSchool began notifying school
              districts of the incident in January 2025.


              The incident triggered a cascade of regulatory and legal consequences. On February 13, 2025, the Future of
              Privacy Forum removed PowerSchool as a signatory from the Student Privacy Pledge, citing the failure to
              implement multifactor authentication. Canada's Privacy Commissioner opened an investigation in February
              2025. North Carolina's Attorney General announced an investigation in February 2025, estimating up to 4
              million affected residents. Multiple class action lawsuits were filed. Texas Attorney General Ken Paxton
              filed suit in early September 2025, alleging violations of Texas deceptive trade practices and identity
              theft protection laws. Matthew Lane was sentenced to four years in federal prison and ordered to pay $14.1
              million in restitution on October 14, 2025. CrowdStrike's interim cybersecurity audit found no malware or
              backdoor—the breach succeeded entirely through a single stolen password against a system lacking MFA.
              PowerSchool has since added additional security layers and time-based access controls, but multiple
              lawsuits remain active as of the run date, and the downstream risk of the exposed data—which affects
              children who will carry the identity-theft exposure for decades—has not been remediated.
