            title: December 2024 breach is the dominant trust and product risk
            body: >-
              The December 2024 data breach — which exposed 62 million student records due to a missing MFA control on
              the PowerSource support portal — is the most material product-layer risk factor. The breach vector was not
              a product defect in any customer-facing system but an administrative oversight on an internal support
              tool, which is both reassuring (no flaw in the product itself) and alarming (the company's own operational
              security failed). Post-breach remediations including mandatory MFA and time-based access controls are now
              in place, but PowerSchool's removal from the Future of Privacy Forum's Student Privacy Pledge and ongoing
              state AG investigations create a sustained procurement headwind that diligence must quantify via
