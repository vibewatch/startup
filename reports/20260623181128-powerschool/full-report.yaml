      - number: '8.2'
        title: Comparable company analysis and transaction precedents
        blocks:
          - type: paragraph
            body: >-
              The comparable set for PowerSchool spans publicly traded government technology and education software
              platforms, recent EdTech take-private transactions, and the broader SaaS market to anchor what multiple
              ranges are defensible at PowerSchool's revenue scale and margin profile.

              Tyler Technologies (NYSE: TYL) is the most directly comparable public company. Tyler provides
              mission-critical government and K-12 SaaS including Skyward, which competes directly with PowerSchool SIS
              in more than 2,000 school districts. Tyler's June 2026 metrics show TTM revenue of approximately $2.38
              billion, an enterprise value near $12 billion, EV/Revenue of approximately 4.7-5.0x, an EBITDA margin of
              21 percent, and an FCF yield around 27 percent. Tyler's lower EV/Revenue versus PowerSchool's LBO entry
              multiple reflects Tyler's larger scale, diversified revenue base across government verticals, and the
              multiple compression that applied to GovTech SaaS from 2022-2026. PowerSchool's pure-play K-12 premium
              partially justifies a higher multiple than Tyler, but not the full gap implied by the 7.8x ARR entry.

              Instructure Holdings, which KKR took private in July 2024 at an enterprise value near $4.4 billion against
              FY2024 revenue of approximately $590-634 million, implies a transaction multiple of approximately 6.9-7.0x
              revenue. This is the most direct EdTech take-private precedent for sizing. Instructure's revenue profile
              is smaller than PowerSchool's, spans both K-12 and higher education, and carries historically similar
              gross margins of 67-69 percent and FCF margins of 20-30 percent. The Instructure deal suggests the market
              was willing to pay approximately 7x for a high-quality EdTech SaaS platform with strong retention.
              PowerSchool's 7.6-7.8x entry multiple is a modest premium to that precedent, arguably justified by its
              larger scale, deeper product suite, and dominant SIS market position.

              The Aventis Advisors 2026 SaaS M&A analysis and the Finerva EdTech 2025 valuation multiples report both
              note that high-quality SaaS businesses with durable recurring revenue and NRR above 100 percent attract
              valuation premiums at deal time, but that premium is only realized on exit if growth and retention hold
              through the hold period. The Finerva Q4 2024 data shows the median EdTech EV/Revenue for publicly listed
              EdTech companies was only 1.6x — reflecting many lower-quality, consumer-oriented names — while the
              premium K-12 institutional SaaS sub-sector commands multiples in the 5-8x range, as illustrated by Tyler
              and Instructure. Importantly, the Aventis analysis flags that in 2026 premium multiples flow to businesses
              with durable growth, strong cash flow, and defensible AI capabilities, all of which are currently
              unconfirmed for PowerSchool in the post-close environment.
