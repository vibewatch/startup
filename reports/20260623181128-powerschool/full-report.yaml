      - number: '4.4'
        title: Adverse signals and financial risk factors
        blocks:
          - type: paragraph
            body: >-
              The most significant post-close adverse signal is the December 2024 data breach, in which attackers
              accessed PowerSchool's PowerSource customer support portal using stolen credentials lacking multi-factor
              authentication, exfiltrating records on approximately 62 million students and 10 million teachers across
              more than 18,000 districts in North America. PowerSchool paid a ransom to secure purported deletion of the
              data; subsequent events showed the deletion was not completed, and the threat actor re-emerged in mid-2025
              extorting individual school districts with the original stolen data. The breach has generated 55 or more
              class-action lawsuits consolidated into multidistrict litigation MDL-3142 in the Southern District of
              California before Judge Benitez, with plaintiffs asserting negligence, breach of contract, and unjust
              enrichment and seeking damages, injunctive relief, and credit monitoring. A separate mass action lawsuit
              from school districts themselves seeks reimbursement of fees paid to PowerSchool and costs of breach
              response. Total financial exposure — combining ransom costs, two-year credit monitoring for tens of
              millions of individuals, legal defense, and potential settlements — is material but has not been disclosed
              or estimated by the company in any public post-close document. A second financial risk is the LBO's high
              private-credit debt load: LBOs of this size at 2024 private-credit interest rates typically carry interest
              burdens of $250 million or more per year depending on leverage and margin structure, which would represent
              a material portion of PowerSchool's roughly $230 million pre-LBO adjusted EBITDA. The combination of
              elevated fixed debt service with open cybersecurity liability creates a more constrained financial profile
              than the pre-LBO public metrics suggest.
            claimRefs:
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
              - CI031
              - CI032
      - number: '4.5'
        title: Financial verdict and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a strong pre-LBO recurring-revenue business with excellent retention and
              above-average FCF conversion, but the post-close private-company status creates a fundamental underwriting
              opacity. PowerSchool's last public data point — Q2 2024 earnings released August 2024 — reported ARR of
              approximately $720 million growing 18 percent, adjusted EBITDA margins near 35 percent, and NRR of 107
              percent. The company suspended financial guidance and earnings calls upon signing the merger agreement in
              June 2024 and has released no financial statements since closing in October 2024. Management and investor
              conference presentations in early 2026 cited a goal of $1 billion or more in annual revenue by 2026, but
              this is an unverified company claim and not a disclosed financial result. The financial verdict is
              therefore: strong pre-acquisition business quality, significantly uncertain post-acquisition financial
              position. The combination of an undisclosed post-LBO debt load, rising breach-related liability, and
              near-zero cash reserve as of mid-2024 means the central diligence question is not revenue quality but debt
              serviceability and litigation reserve adequacy. Any investor or partner underwriting PowerSchool in 2026
              must obtain post-close audited or management accounts, the private-credit term sheet and covenants, the
              breach litigation settlement exposure estimate, and a trailing FCF bridge to understand how much operating
              cash flow remains after debt service.
            claimRefs:
              - CI033
              - CI034
              - CI035
              - CI036
              - CI037
          - type: table
            tableRef: TI005
            claimRefs:
              - CI033
              - CI034
