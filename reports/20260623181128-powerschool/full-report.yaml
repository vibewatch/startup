            body: >-
              An NRR of 107%, adjusted EBITDA margins of 33–35%, and 24% FCF margins are industry-leading for a K-12
              SaaS company and provide a strong foundation for LBO debt service — if the debt load is sized
              appropriately and the breach liability is contained.
            calloutType: strength
