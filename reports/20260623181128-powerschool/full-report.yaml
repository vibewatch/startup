  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and subscription mechanics
        blocks:
          - type: paragraph
            body: >-
              PowerSchool operates a K-12 SaaS platform sold under annual renewable contracts to school districts, state
              agencies, and international education authorities. Its last public disclosures before the October 2024
              take-private reported that subscriptions and support revenue represented approximately 90 percent of
              quarterly revenue in Q1 2024, reaching $166.9 million of the $185.0 million total that quarter. For the
              full year 2023, the company reported $697.7 million in total revenue, growing 11 percent year over year,
              while annual recurring revenue (ARR) — the company's primary operating KPI — reached $701.5 million at
              December 31, 2023, growing 18 percent year over year. By Q1 2024 ARR had risen further to $720.3 million,
              and the company reaffirmed full-year 2024 guidance of $786 million to $792 million in total revenue with
              $268 million to $273 million in adjusted EBITDA. Revenue recognition is dominated by multi-year
              subscription contracts that roll forward annually: districts pay in advance, and deferred revenue provides
              strong cash-flow visibility. The Q2 2024 balance sheet showed $213.4 million in deferred revenue, with 97
              percent expected recognized in the next twelve months, confirming a short-duration, high-visibility
              revenue profile. Professional services — primarily implementation, onboarding, training, and migration —
              made up the remaining roughly 10 percent of revenue and are structurally lower-margin than subscriptions.
              Revenue mix is therefore heavily weighted toward recurring subscription income, which is the core quality
              signal for a K-12 SaaS underwriting thesis.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
