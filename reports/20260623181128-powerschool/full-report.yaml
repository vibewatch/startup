            title: Embedded market position with high switching costs
            body: >-
              PowerSchool's penetration of more than 90 of the top 100 US school districts and 60M+ students across 90+
              countries, combined with a 106.7% Net Revenue Retention Rate, reflects deep workflow embedding that
              creates durable recurring revenue. School districts face high data-migration friction when switching
              student information systems, making the customer base structurally sticky regardless of the breach
              fallout.
            calloutType: strength
            claimRefs:
              - CO028
              - CO030
              - CO031
          - type: callout
            title: December 2024 data breach is the defining risk of the analysis
            body: >-
              The breach is not a contained incident. It exposed sensitive data on approximately 62 million students and
              9.5 million teachers, the attacker has been convicted but the stolen data remains unrecovered, multiple
              state attorneys general have opened investigations, class action lawsuits are active, and the Future of
              Privacy Forum revoked PowerSchool's privacy certification. The exposed data includes Social Security
              numbers and medical records, creating identity-theft exposure that will persist for the lifetime of
              affected children. This is the single largest adverse event in the company's history and cannot be treated
              as a resolved matter for diligence purposes.
