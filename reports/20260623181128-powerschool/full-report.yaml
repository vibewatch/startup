      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: December 2024 SIS Breach Is a Structural Trust Deficit, Not a Past Event
            body: >
              The December 2024 breach is not a discrete past incident. The exfiltrated data of 62 million students and
              9.5 million teachers remains permanently in the hands of the original threat actor network and potentially
              other parties following the failed deletion video. Downstream extortion of individual school districts
              continued through at least May 2025. Child identity theft risk is lifelong because stolen Social Security
              numbers and medical data do not expire. Active MDL litigation, state AG investigations, and DOE FERPA
              review all remain open. Investors must treat this as an ongoing liability—not sunk cost—and quantify legal
              reserves, insurance coverage adequacy, and the multi-year reputational drag on district contract renewals
              before underwriting any capital event.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: callout
            title: Bain Capital Aiding-and-Abetting Ruling Is a Novel and Material Precedent
            body: >
              The March 18, 2026 ruling allowing claims against Bain Capital to proceed in MDL-3142 is the first known
              federal ruling holding a PE parent potentially liable for a portfolio company data breach on an
              operational control theory. Courts found that Bain's pre- and post-closing actions—veto rights over
              cybersecurity capex, board replacement, domestic IT layoffs, and offshoring of security
              functions—plausibly created the conditions for the breach or worsened its trajectory. No precedent exists
              for how such cases resolve financially; PE-level liability insurance may not cover aiding-and-abetting
              theories. Any investor due diligence on PowerSchool must include a detailed review of Bain's post-close
              directives, the indemnification framework between Bain and PowerSchool, and the adequacy of D&O and cyber
              liability coverage.
