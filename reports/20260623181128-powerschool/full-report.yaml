      - number: '1.4'
        title: Scale, metrics, and product reach
        blocks:
          - type: paragraph
            body: >
              PowerSchool's most recent publicly available financial data covers fiscal year 2023, when the company was
              still publicly traded. For that year, total revenue was $697.7 million, up 11% year-over-year, while
              subscriptions-and-support revenue reached $600.2 million, up 10%. Annual Recurring Revenue (ARR) was
              $701.5 million as of December 31, 2023, representing 18% year-over-year growth. The Net Revenue Retention
              Rate was 106.7%, indicating that the existing customer base was expanding its spending. Adjusted EBITDA
              for FY2023 was $231.9 million, a 33% margin and an 18% improvement year-over-year. PowerSchool reported a
              GAAP net loss of $39.1 million, consistent with the capital structure carrying acquisition-related debt.
              Free cash flow reached $129.9 million for the year, representing a 19% free cash flow margin.


              On the customer-side, the company supports over 60 million students and more than 18,000 customers—
              primarily school districts, schools, and state education agencies—in over 90 countries. More than 90 of
              the top 100 US school districts by student enrollment use PowerSchool products. The company completed
              roughly 2,000 cross-sell and new-logo transactions in 2023, including notable wins at Los Angeles Unified
              School District, Miami-Dade Public Schools, and the Newark Board of Education. SchoolMessenger, acquired
              in October 2023, provides communication solutions to more than 63,000 schools. Since the Bain take-private
              in October 2024, no new financial disclosures have been made; FY2024 and FY2025 results are private and
              unavailable to outside analysts. The revenue trajectory, customer scale, and ARR growth provide a strong
              baseline, but the breach and CEO transition introduce meaningful execution uncertainty for the
              post-private growth phase.
