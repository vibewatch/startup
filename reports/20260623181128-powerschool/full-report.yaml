companyProfile:
  summary: >-
    PowerSchool is a Folsom, California-based education software company founded in 1997 that sells a broad K-12 system
    of record spanning student information, classroom and assessment workflows, special programs, talent and HR, school
    communications, analytics, and college and career readiness. Before going private, the company had scaled to more
    than 18,000 customer organizations and over 60 million students across 90-plus countries, with PowerSchool's SIS
    platform anchoring a broader cross-sell engine into adjacent modules such as Schoology, Naviance, and PowerBuddy.
    Bain Capital completed a $5.6 billion take-private in October 2024, leaving investors to evaluate a high-quality
    vertical SaaS franchise through a much thinner disclosure window just as the company absorbed the largest known U.S.
    K-12 student-data breach.
