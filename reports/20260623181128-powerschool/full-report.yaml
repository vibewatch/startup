  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and the K-12 connected operating system
        blocks:
          - type: paragraph
            body: >-
              PowerSchool positions its product offering under the brand name the K-12 Connected Operating System,
              organized around three areas of impact: home connections, student achievement, and operational excellence.
              As of June 2026, the portfolio spans eight major product families. The Student Information System (SIS) is
              the foundational module, managing student enrollment, attendance, scheduling, grading, state and federal
              compliance reporting, and parent communications for more than 60 million students across 18,000+
              organizations in 90+ countries. Built on top of the SIS data layer is the Schoology Learning Management
              System, an LMS now used by more than 7 million students and 4,000 organizations that provides curriculum,
              assignments, assessments, and family communications in one platform. The Assessment module, sold as
              Performance Matters, serves 650 organizations and 500,000 teachers with pre-built item banks containing
              130,000+ questions, standards-aligned assessments, and AI-powered rubric scoring via PowerBuddy. The
