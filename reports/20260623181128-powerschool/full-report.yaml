        title: Exhibits
        blocks:
          - type: callout
            title: Post-LBO financial opacity is the primary underwriting blocker
            body: >-
              PowerSchool has not filed or published any financial statements since October 2024. The combination of a
              high private-credit debt load, near-zero pre-close cash balance, and an open multidistrict class-action
              lawsuit makes it impossible to assess current liquidity, FCF adequacy, or breach settlement exposure from
              public sources alone.
            calloutType: risk
