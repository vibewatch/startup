      - number: '7.3'
        title: Partner, Dependency, and Operational Risk
        blocks:
          - type: paragraph
            body: >
              PowerSchool's operational continuity depends on a concentrated set of platform, infrastructure, and
              distribution dependencies whose failure or deterioration would directly impair service delivery across
              18,000+ district customers. The company's cloud-hosted SIS runs on AWS and Microsoft Azure, giving
              hyperscaler availability and API stability a mission-critical role. Historical cloud outages, such as AWS
              US-EAST-1 disruptions, have created temporary service degradations for SIS-dependent operations including
              attendance, enrollment, and grade tracking that school districts depend on for daily operations and state
              compliance reporting. PowerSchool's platform architecture routes all customer data and support-tier
              maintenance access through centralized portals, a design that—as the December 2024 breach
              demonstrated—creates a high-value single point of entry when perimeter controls are weak.

              Customer concentration risk is structurally embedded in the business model. More than 90 of the 100
              largest U.S. school districts by enrollment use PowerSchool products, and statewide adoption mandates in
              multiple states create concentrated exposure to single-state procurement decisions. North Carolina's
              statewide migration from PowerSchool SIS to Infinite Campus—with completion targeted for July
              2025—represents the most visible example of mass customer churn triggered by breach fallout and
              competitive re-evaluation. The ListEdTech November 2025 database of 23,000+ districts shows PowerSchool at
              23% of identified SIS implementations, down from its prior dominant position, while Infinite Campus has
              gained in southern and midwestern states. Average PowerSchool district SIS contract value is $10,604 per
              year (Civic IQ contract database), making each lost statewide mandate equivalent to thousands of
              individual contract renewals.

              The breach has also exposed PowerSchool's dependency on contractual compliance frameworks including the
              Student Data Privacy Consortium National Data Protection Agreement, used in 26+ states, which requires
              MFA, 72-hour breach notification, and data minimization. PowerSchool's admitted MFA absence from
              PowerSource was a direct violation of these DPA terms, exposing it to breach of contract claims from
              hundreds of signatory districts—a dynamic the Wisconsin St. Croix Falls district lawsuit explicitly
              leveraged. The company's dependency on Bain Capital's capital allocation decisions creates a secondary
              operational risk: Bain-directed offshoring of IT and cybersecurity to third-party contractors was central
              to the court's aiding-and-abetting theory, and further post-LBO cost restructuring initiatives could
              reintroduce similar security vulnerabilities.
