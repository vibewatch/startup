  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Data Breach and Cybersecurity Risk
        blocks:
          - type: paragraph
            body: >
              The December 2024 data breach is the defining adverse event in PowerSchool's recent history and creates
              compounding risk across every dimension of the investment thesis. The attack began in August 2024 when a
              threat actor obtained credentials belonging to a PowerSchool subcontractor and used them to access
              PowerSource, PowerSchool's internal customer support portal. Between December 19 and December 28, 2024,
              the attacker systematically exported student and teacher database records from thousands of school
              districts simultaneously. The stolen data included full names, dates of birth, residential addresses,
              Social Security numbers, medical and disability information, individualized education plans, disciplinary
              records, grade histories, and family financial data tied to free and reduced lunch programs. CrowdStrike
              conducted the forensic investigation and found no evidence of banking or credit card compromise, but
              confirmed that data from two core SIS tables—student and teacher records—was exfiltrated.

              PowerSchool discovered the breach on December 28, 2024, when the attacker sent an extortion demand for
              approximately $2.85 million in Bitcoin, threatening worldwide publication of the stolen data if the ransom
              was not paid. PowerSchool paid the ransom in late December 2024 and received a video purportedly showing
              data deletion. Despite this payment, by May 2025 the same threat actor began sending extortion demands
              directly to individual school districts in the United States and Canada—including the Toronto District
              School Board (240,000 students, data dating to 2009) and multiple North Carolina districts—attaching data
              samples as proof that the deletion video was fabricated. This downstream extortion campaign demonstrated
              definitively that ransom payments provide no reliable data destruction guarantee in education-sector
              breach scenarios.

              Matthew D. Lane, a 19-year-old college student from Assumption University in Worcester, Massachusetts,
              pleaded guilty in May 2025 to four federal charges: cyber extortion conspiracy, cyber extortion,
              unauthorized computer access, and aggravated identity theft. U.S. District Judge Margaret Guzman sentenced
              Lane on October 15, 2025 to four years in federal prison, three years of supervised release, and $14.1
              million in restitution—a figure prosecutors acknowledged would likely never be collected in full given the
              defendant's profile. Court documents indicate Lane worked with at least one unnamed co-conspirator;
              related investigations remain ongoing. The Ontario Information and Privacy Commissioner released formal
              findings in November 2025 concluding that PowerSchool's absent mandatory MFA, always-on remote maintenance
              access, limited log retention, and delayed detection all materially contributed to the breach's severity.
              PowerSchool's post-breach remediation included approximately $14 million in victim identity protection
              costs, implementation of MFA for all PowerSource employee and contractor access, and time-based access
              controls.

              The structural cybersecurity risk extends beyond this single incident. PowerSchool's SIS platform holds
              the consolidated records of more than 60 million students, making it a permanent high-value target for
              data exfiltration and extortion. The platform's role as a centralized K-12 data repository—used by more
              than 90 of the 100 largest U.S. school districts—means that a single successful credential compromise can
              enable bulk exfiltration across thousands of districts simultaneously, a concentration risk that cannot be
              fully mitigated by any single post-breach hardening program. The Future of Privacy Forum removed
              PowerSchool from the Student Privacy Pledge on February 13, 2025, citing the failure to implement MFA as a
              direct violation of pledge requirements. Residual reputational damage from the breach will continue to
              weigh on renewal negotiations, procurement reviews, and competitive evaluations for multiple contract
              cycles.
