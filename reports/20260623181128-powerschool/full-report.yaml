      - number: '8.4'
        title: Diligence gaps, final recommendation, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The most important finding of this valuation analysis is not a specific number but a disclosure gap: no
              public investor, analyst, or counterparty can determine whether the PowerSchool LBO is a good investment
              without obtaining the post-close private-credit term sheet, audited FY2024 and FY2025 financial
              statements, current NRR and gross revenue retention after the breach, and a litigation reserve estimate
              from counsel in MDL-3142. The absence of this information does not invalidate the underlying business
              quality, which remains best-in-class for K-12 vertical SaaS by every public metric. What the absence does
              do is make any investment recommendation conditional and provisional.

              The formal recommendation is conditional hold / research-more. The pre-LBO business demonstrated the
              hallmarks of a premium SaaS investment — dominant market share, sticky multi-year contracts, 107 percent
              NRR, 35 percent adjusted EBITDA margins, and 24 percent FCF margins. The $5.6 billion entry price at
              approximately 7.8x ARR was rich but defensible for a platform of this quality. The post-LBO environment
              has introduced three new uncertainty layers — breach liability, private debt opacity, and a CEO transition
              — that collectively prevent a diligence-complete buy or sell call. The conditional hold means: do not
              unwind without diligence; do not add without diligence; obtain the blocking information before updating
              the call.

              Exit readiness is limited in June 2026. The company is 20 months post-close, has disclosed no financials,
              faces active MDL-3142 litigation, and has a new CEO installed in October 2025. Bain Capital's typical
              holding period of 3-5 years implies a target exit window of 2027-2029. The most credible exit paths are a
              secondary sale to another private equity sponsor, a strategic acquisition by a larger education or GovTech
              platform, or an IPO if breach litigation resolves and financial performance meets revised expectations. An
              IPO would require at minimum two clean fiscal years of post-breach audited financials, resolved or
              quantified litigation exposure, and public-market receptivity to EdTech SaaS — none of which are fully met
              as of June 2026.

              The thesis-break triggers are clearly defined by the evidence. A breach settlement exceeding $400 million,
              NRR declining below 100 percent for two consecutive quarters, post-LBO EBITDA coverage of interest falling
              below 1.0x, or a material covenant breach on the private-credit facility would each independently change
              the investment call from conditional hold to reduce or avoid. Conversely, receipt of audited FY2024-FY2025
              financials confirming EBITDA coverage above 1.5x and NRR above 104 percent would support upgrading the
              call to buy with a target return framework.
