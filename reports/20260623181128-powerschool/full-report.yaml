      - number: '4.2'
        title: Pricing, unit economics, and public traction
        blocks:
          - type: paragraph
            body: >-
              PowerSchool uses a quote-based, per-district pricing model that scales with student enrollment, modules
              selected, and contract length. Public contract database research from Civic IQ, based on government
              procurement records through April 2026, found an average annual SIS contract value of approximately
              $10,604 across 54 tracked PowerSchool SIS engagements. For large district deployments and multi-module
              contracts covering SIS, LMS, HR, special education, and analytics, annual realized contract values can
              range from $20,000 to $600,000 or more. List pricing benchmarks from third-party review sites suggest core
              SIS starts at roughly $3 per student per year, with premium tiers and add-on modules meaningfully
              increasing effective ASP. Net revenue retention of 107 percent as of Q1 2024 — the last publicly disclosed
              figure — confirms that expansion through cross-sells and upsells is more than offsetting any churn, which
              is the defining unit-economic signal for K-12 SaaS. On the cost side, reported GAAP gross margins averaged
              57 to 60 percent across Q1–Q2 2024, while adjusted gross margins (excluding amortization, stock comp, and
              restructuring) reached 69 to 70 percent. The difference is material: a significant portion of GAAP cost of
              revenue reflects amortization of acquired intangible assets built up through PowerSchool's decade-long M&A
              strategy. Free cash flow was $168.4 million for the full year 2023, representing a 24 percent FCF margin,
              which is strong for a software company of this scale. The public evidence does not disclose post-LBO
              realized margins or FCF, making the most recent data points historical anchors rather than current
              operating metrics.
