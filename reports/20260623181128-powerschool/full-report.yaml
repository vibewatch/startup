      - number: '1.3'
        title: Ownership history, funding, and investor map
        blocks:
          - type: paragraph
            body: >
              PowerSchool's institutional ownership history spans four distinct phases. First, Apple acquired the
              company in 2001 from its founder and held it until 2006, when it sold the business to Pearson. Second,
              Vista Equity Partners purchased PowerSchool from Pearson in June 2015 for $350 million, acquiring a
              student information system that served roughly 13 million students in 70 countries at the time. Third, in
              April 2018, Onex Corporation and Vista restructured ownership so that both firms held equal stakes,
              concurrent with the acquisition of PeopleAdmin, a talent management platform for K-12. Under dual
              Vista-Onex ownership, PowerSchool executed a series of acquisitions—including Schoology in 2019, Naviance
              via the 2021 Hobsons transaction, and SchoolMessenger in October 2023 for $300 million—and listed on the
              NYSE in July 2021, raising approximately $711 million in the IPO. Fourth, Bain Capital announced a
              definitive agreement to acquire PowerSchool on June 7, 2024, at $22.80 per share ($5.6 billion enterprise
              value); the transaction closed October 1, 2024, with Vista and Onex retaining minority positions.


              The debt financing supporting the Bain transaction was provided by Ares Capital Management, HPS Investment
              Partners, Blackstone Alternative Credit Advisors, Blue Owl Credit Advisors, Sixth Street Partners, and
              Golub Capital. As a private company, PowerSchool no longer files periodic financial disclosures with the
              SEC, and the precise post-take-private capital structure—including the ownership percentages held by Bain,
              Vista, Onex, and management, as well as the terms of the debt facilities—is not publicly available. Bain
              Capital partners David Humphrey and Max de Groen are the named managing partners for the PowerSchool
              investment and have spoken publicly about the company's product innovation roadmap and growth ambitions.
