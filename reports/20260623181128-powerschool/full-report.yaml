      - number: '5.3'
        title: Technology architecture and integration ecosystem
        blocks:
          - type: paragraph
            body: >-
              PowerSchool's technology stack is a cloud-native SaaS architecture hosted on major cloud providers, with
              its SIS offering available in both cloud-hosted and on-premises configurations. The integration layer is
              built around published open standards: Ed-Fi (Data Standard v4 and v5), OneRoster (v1.1/1.2 REST and CSV),
              LTI Advantage (v1.3 with NRPS for deep linking and grade passback), and SAML/OAuth 2.0 for single sign-on.
              PowerSchool's SIS holds active Ed-Fi Student Information Systems API certification for both Data Standard
              v4 (valid through December 12, 2026) and Data Standard v5 (valid through June 5, 2027), with verified
              implementations at Texas, Georgia, and Minnesota school districts. PowerSchool eSchoolPlus SIS carries v5
              certification valid through June 2027. The API-first architecture enables third-party vendors to connect
              via published REST endpoints authenticated with OAuth 2.0; as of June 2026, 50+ public repositories on
              GitHub implement PowerSchool API wrappers in Node.js, PHP, Python, and Svelte, with the most recently
              updated Node.js library last pushed in January 2026 and a PHP package updated in March 2026, reflecting an
              active third-party developer ecosystem. Connected Intelligence, the data-as-a-service layer, consolidates
              data from SIS, LMS, assessment, HR, and third-party systems into a managed cloud data platform with
              real-time dashboards, historical archiving for state/federal longitudinal reporting requirements, and an
              AI-ready data layer that supports natural language querying via PowerBuddy. The Analytics & Insights
              platform (formerly Unified Insights) released version 26.3.0.0 in May 2026, delivering redesigned MTSS
              intervention management, faster Intervention Bank loading, quick score entry from graphs, and beta email
              notifications for intervention alerts.
