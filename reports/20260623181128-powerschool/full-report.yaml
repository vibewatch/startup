      - number: '6.4'
        title: Retention, durability, and post-breach dynamics
        blocks:
          - type: paragraph
            body: >-
              PowerSchool's pre-breach retention metrics are among the strongest in EdTech SaaS. The 107% NRR as of Q1
              2024 reflects a multi-year pattern of expansion — districts add modules across renewal cycles rather than
              churning — and the CivicIQ estimate of a ~95% gross renewal rate confirms the subscriber base is extremely
              sticky. The structural reason is high switching cost: an SIS or LMS transition requires multi-year
              planning, state reporting reconfiguration, staff retraining, and data migration. The average North
              Carolina transition from PowerSchool to Infinite Campus, for example, required a $415,000 dedicated
              contract just for data transfer and deletion — a cost most districts would not voluntarily absorb absent a
              forcing event.

              The December 2024 breach created exactly such a forcing event for a subset of customers. The threat actor
              accessed PowerSchool's PowerSource customer support portal using compromised credentials on an account
              that lacked multi-factor authentication, exfiltrating records for approximately 62 million students and
              9.5 million teachers across the 18,000-district customer base — the largest known K-12 data exposure in
              history. PowerSchool paid the threat actor to delete the data, but by May 2025 the same stolen data was
              being used to extort individual school districts in the US and Canada directly, demonstrating that ransom
              payment had not produced actual deletion. A Massachusetts man, Matthew Lane (age 19), pleaded guilty to
              four federal charges. The Future of Privacy Forum removed PowerSchool from its Student Privacy Pledge in
              February 2025. North Carolina's Attorney General issued a civil investigative demand, and multiple
              class-action lawsuits were filed against PowerSchool and Bain Capital.

              North Carolina's response was the most consequential retention event. The state had pre-dated its switch
              to Infinite Campus (contract awarded November 2023, before the breach), but the breach accelerated all
              timelines. All NC public school PSUs completed the transition by July 1, 2025. Independent review data —
              G2: 4.2/5 from 742 reviews, Capterra: 4.3/5 from 181 reviews — shows continued positive aggregate
              satisfaction among active users, but open-text reviews surface consistent complaints about support
              response times and usability complexity, themes that predated the breach and are now compounded by
              heightened district security scrutiny.
