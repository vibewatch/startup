      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case for PowerSchool in the 2026-2030 holding window rests on three concurrent successes. First,
              the December 2024 breach produces financial liability below $100 million in total (ransom plus monitoring
              plus a modest MDL settlement), district customers renew at historical rates, and the 107 percent NRR holds
              or improves as PowerBuddy AI upsells replace post-breach trust discount. Second, the post-LBO debt is
              serviceable — meaning total debt at close was approximately $3 billion or below, carrying an all-in rate
              near 8-9 percent, producing annual interest expense near $240-270 million against an improving EBITDA run
              rate approaching $300 million by 2026 under the stated $1 billion revenue target. Third, Bain Capital
              executes the international expansion thesis and AI monetization, growing ARR at 12-15 percent annually
              toward a $1.1-1.3 billion ARR base at a 3-4 year exit, permitting a secondary sale or IPO at 5-7x ARR
              implying an exit enterprise value of $5.5-9.1 billion and a strong equity return.

              The base case assumes moderate execution: breach litigation settles in the $150-300 million range over
              2026-2027, NRR moderates to 103-105 percent post-breach, revenue grows at 8-10 percent per year to
              approximately $850-900 million by exit, and adjusted EBITDA margins improve modestly to 36-38 percent.
              Exit at 5x EV/Revenue implies an enterprise value near $4.25-4.5 billion after five years — below the $5.6
              billion entry — suggesting equity returns are modest to flat unless the deal was funded with significant
              leverage reducing the equity check. This scenario is the most plausible based on current public evidence
              and represents a mediocre-to-fair outcome for the equity tranche.

              The bear case involves a breach settlement exceeding $500 million, meaningful NRR deterioration to 95-100
              percent as districts demand concessions or switch to Infinite Campus and Skyward, ESSER budget pressure
              reducing new wins, and post-LBO debt coverage ratios deteriorating toward distress-adjacent levels. Under
              this scenario, an exit at 3-4x revenue on a $700-800 million ARR base implies an EV of $2.1-3.2 billion —
              well below the $5.6 billion entry, wiping out a substantial portion of the equity and impairing the
              private-credit lenders' principal. This scenario is meaningful because all of the key downside variables —
              breach settlement, NRR post-breach, budget pressure, debt terms — are currently opaque and could each
              swing materially negative.
