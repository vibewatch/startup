    title: Customer journey map — K-12 district adoption and expansion
    type: journey-map
    layout: wide
    summary: >-
      A K-12 district's relationship with PowerSchool moves from initial awareness and RFP through SIS deployment, then
      expands across module layers and renewal cycles; the December 2024 breach introduced a new post-deployment
      trust-fracture node that routes some customers toward exit.
    data:
      nodes:
        - id: jm1
          label: Discovery and RFP
          detail: >-
            District technology directors identify SIS need via state procurement database, peer referrals, or expiring
            incumbent contract. PowerSchool's 23% market share drives high baseline awareness; RFP process governed by
            school board approval and state bid rules.
          tone: neutral
        - id: jm2
          label: SIS implementation
          detail: >-
            Core SIS deployment (eSchoolPlus, eSembler, or PowerSchool SIS) takes 3-12 months. Costs include
            implementation services, data migration, and staff training. High-friction onboarding creates early lock-in.
          tone: neutral
        - id: jm3
          label: Module cross-sell (Year 2-3)
          detail: >-
            Renewal cycles activate Schoology LMS, Naviance CCLR, Connected Intelligence analytics, SchoolMessenger
            communications, or HR/talent modules. Renewal ACV averages $24,939 vs. $10,604 initial. NRR 107% confirms
            net positive expansion.
          tone: positive
        - id: jm4
          label: AI layer adoption (2024-2026)
          detail: >-
            PowerBuddy AI deployed within Schoology or Naviance as premium add-on. Tomball ISD (TX) first Texas district
            to pilot in September 2024. Naviance CCLR AI enhancements launched for 2025-2026 school year.
          tone: positive
        - id: jm5
          label: Trust fracture (post-breach)
          detail: >-
            December 2024 breach exposed 62M student records. Districts demanded MFA attestation, SOC 2 Type 2, and
            indemnification clauses at renewal. NC statewide departure completed July 2025. Canada-specific extortion
            campaigns created elevated churn risk.
          tone: warning
        - id: jm6
