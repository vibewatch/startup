chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating model
        blocks:
          - type: paragraph
            body: >
              PowerSchool was founded in 1997 in Folsom, California, where it remains headquartered today. The company
              describes its mission as empowering educators, administrators, and families to ensure personalized
              education for every student journey. What began as one of the first web-accessible student information
              systems has grown into a comprehensive cloud platform that reaches more students annually than most
              countries enroll in K-12 education. PowerSchool defines its product offering as the K-12 Connected
              Operating System, integrating student information management, learning management, curriculum delivery,
              assessment, human resources, talent management, professional development, special education management,
              data analytics, school communications, and college and career readiness into a unified data architecture.


              As of June 2026, PowerSchool is fully private. It was delisted from the New York Stock Exchange in October
              2024 after Bain Capital completed its acquisition of the company at $22.80 per share, representing a total
              enterprise value of approximately $5.6 billion. Vista Equity Partners and Onex Corporation, which jointly
              controlled the company through the IPO period, each retained minority investments. The company continues
              to operate as a standalone entity under Bain's majority ownership. PowerSchool's product suite includes
              award-winning brands such as Schoology Learning and Naviance CCLR, and it serves more than 90 of the top
              100 US school districts by student enrollment. Its AI product PowerBuddy, a generative AI-powered virtual
              assistant personalized for students, parents, educators, counselors, and administrators, represents the
              company's most recent product-layer innovation and a key strategic differentiator in its next growth
              phase.
