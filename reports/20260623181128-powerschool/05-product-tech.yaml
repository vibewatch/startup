  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / certification / metric
      - Status
      - Scope
      - Gap
    rows:
      - - Ed-Fi SIS API certification (Data Standard v5)
        - Active; valid June 5, 2027
        - PowerSchool SIS; verified implementations in Texas, Georgia, Minnesota
        - Renewal required annually; eSchoolPlus has separate cert
      - - Ed-Fi SIS API certification (Data Standard v4)
        - Active; valid December 12, 2026
        - PowerSchool SIS; K-12 interoperability for state ODS submissions
        - v4 expiring end-2026; districts must verify v5 migration path
      - - FERPA contractual compliance
        - Required via district data processing agreements for all US customers
        - All US K-12 customer contracts
        - Contractual obligation only; not independently audited at district level
      - - COPPA age-gating for PowerBuddy
        - Implemented via SIS-to-Schoology DOB sync (April 2026 release)
        - Schoology + SIS joint deployments; nightly provisioning
        - Districts not using PowerSchool SIS must manage DOB separately
      - - SOC 2 Type II audit
        - Expected by enterprise procurement; availability to districts on request
        - Full PowerSchool platform (not confirmed publicly)
        - SOC 2 report is not publicly available; must be requested under NDA during procurement
      - - Multi-factor authentication (MFA)
        - Implemented on PowerSource support portal post-breach (January 2025)
        - PowerSource portal; customer-facing portals per updated policy
        - Pre-breach PowerSource lacked MFA; retroactive risk cannot be undone
      - - CrowdStrike forensic investigation
        - Completed post-breach December 2024–January 2025
        - PowerSource portal and SIS data tables; no evidence of bank/card data exposure
        - Forensic scope limited to student/teacher tables; full data scope per-district
      - - Future of Privacy Forum Student Privacy Pledge
        - Revoked/removed (2025)
        - Had covered all US student data handling
        - Removal signals material breach of sector privacy norms; reapplication status unknown
      - - Credit monitoring for affected individuals
        - Two years offered to affected adults and minors
        - All individuals identified in breach notification
        - Monitoring does not recover or delete exposed data; lifetime exposure for SSNs
      - - State AG investigations (Texas, North Carolina, Tennessee)
        - Open as of June 2026
        - State-level enforcement actions under state privacy/breach laws
        - No final orders or settlements publicly announced as of June 2026
    notes: >-
      Trust and compliance data from official PowerSchool press releases, security.org breach analysis,
      k12dive.com, fisherphillips.com, and edcircuit.com investigative reporting. SOC 2 availability
