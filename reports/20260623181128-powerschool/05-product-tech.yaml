  - id: core-modules
    title: SIS, LMS, assessment, and special education — core product depth
    body: >-
      The PowerSchool SIS handles complex K-12 scheduling requirements (block schedules, rotating periods,
      and A-B days), automates state and federal reporting under NCES and CEDS standards, and integrates
      with Schoology for real-time grade passback and assignment management. PowerTeacher Pro Gradebook
      is the embedded teacher-facing gradebook within the SIS, offering standards-based grading and direct
      family communications through the Parent Portal. For districts running both SIS and Schoology,
      student date-of-birth data is now nightly-synced from SIS to Schoology as of the April 2026 release,
      enabling more accurate COPPA-aligned age settings for PowerBuddy access without requiring manual
      user profile management. Schoology Learning reached 186 million assignments delivered and 4 million
      discussions facilitated, reflecting its depth of daily instructional use. PowerSchool Assessment
      (Performance Matters) differentiates via pre-built curated item banks, generative AI question
      creation, and AI rubric scoring — allowing teachers to create standards-aligned assessments in
      minutes and get automated scoring of free-response questions at scale. Special Programs has
      statewide partnerships with four state education agencies and serves 9.5 million students through
      IEP, 504, ELL, gifted, and service capture workflows, with AI-assisted document drafting and
      online digital signatures reducing the reliance on paper forms. The customizable workflow engine
      within Special Programs allows districts to adapt compliance documents to state-specific requirements
      without losing federal IDEA compliance fidelity. Schoology received a 4.4 out of 5 rating on both
      G2 (395 reviews, 2026) and Capterra (487+ reviews, March 2026), with teachers consistently citing
      its integration with PowerSchool SIS for real-time grade sync as the primary differentiator.
    claimRefs:
