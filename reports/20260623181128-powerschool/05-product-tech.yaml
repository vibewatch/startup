  - id: trust-security-compliance
    title: Trust, security, compliance, and the December 2024 breach aftermath
    body: >-
      The December 2024 data breach is the defining trust event in PowerSchool's recent product history.
      An attacker used compromised credentials of a PowerSchool subcontractor to access PowerSource, the
      company's customer support portal, which did not require multi-factor authentication at the time.
      Between December 19 and 28, 2024, the attacker systematically exfiltrated student and teacher
      databases from thousands of districts, exposing the records of approximately 62 million students
      and 9.5 million teachers — including names, Social Security numbers, dates of birth, addresses,
      medical alert information, and historical records dating back more than 20 years. PowerSchool paid
      a ransom of approximately $2.85 million in Bitcoin but the data was never fully destroyed; by May
      2025 attackers were extorting individual school districts directly using the original stolen data.
      The hacker, identified as Matthew Lane, was sentenced to four years in federal prison in October 2025
      and ordered to pay $14.1 million in restitution. In response to the breach, PowerSchool has
      implemented additional security layers and time-based access controls, reset customer portal
      credentials with stricter password policies, and now requires multi-factor authentication for
      sensitive system access. Third-party forensic investigation was conducted by CrowdStrike. Despite
      these post-breach remediations, PowerSchool was removed from the Future of Privacy Forum's Student
      Privacy Pledge, and multiple state attorneys general including Texas, North Carolina, and Tennessee
      opened investigations. Under normal conditions, PowerSchool's compliance posture includes FERPA
      contractual requirements with all district customers, SOC 2 Type II audit expectations from
      enterprise procurement teams, COPPA-aligned age-gating for PowerBuddy via the April 2026 SIS-to-
      Schoology date-of-birth sync, and Ed-Fi certification as a verified interoperability standard.
      Role-based certifications at PowerSchool University cover SIS front-office, counselor, principal,
      and gradebook workflows, offering districts a structured path to full-platform utilization.
    claimRefs:
