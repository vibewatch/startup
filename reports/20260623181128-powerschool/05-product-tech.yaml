  - id: roadmap-ai-differentiation
    title: Roadmap, AI strategy, and product differentiation
    body: >-
      PowerSchool's roadmap for 2025-2026 is organized around three pillars: AI ecosystem expansion
      through PowerBuddy, deepening of Naviance CCLR with work-based learning, and data modernization
      via Connected Intelligence. PowerBuddy was initially piloted with districts representing 1.5
      million students before launch in the 2024-2025 school year. For 2025-2026, PowerBuddy is adding
      multi-language support in Arabic, Spanish, Thai, French, and English, and launching PowerBuddy for
      Engagement — a family-facing AI assistant that helps parents interact with schools and access
      information about their child's academic progress. Teachers using PowerBuddy Tools report saving
      at least 20 minutes per lesson in international deployments. PowerBuddy won the 2024 GESS Education
      Award for Best AI Product within the Best Paid App Software Product category. The Naviance CCLR
      platform was substantially enhanced in July 2025 with a new work-based learning (WBL) marketplace
      available at no additional cost, giving students access to internships, apprenticeships, job
      shadowing, and industry visits in a school-managed environment. As of the 2023-2024 school year,
      the national student-to-counselor ratio was 376-to-1 against a recommended 250-to-1, making
      Naviance's AI-powered caseload management tools a structural demand driver for overburdened
      counselors. The Connected Intelligence platform supports an AI-ready data foundation by
      centralizing data for machine learning and advanced analytics. PowerSchool University continuously
      updates SIS role-based certifications, including Front Office, School Counselor, Principal, and
      PowerTeacher Pro Gradebook, ensuring customer stickiness via professional development. The company's
      differentiation strategy relies on depth of vertical integration across home, classroom, and
      central-office workflows, the unique ability to bring AI to districts' own consolidated data rather
      than requiring data exports to third-party AI platforms, and switching costs embedded in multi-year
      contracts, deep integrations, and trained staff certification programs.
    claimRefs:
