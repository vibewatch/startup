  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow without PowerSchool
      - PowerSchool solution
      - Measurable benefit
      - Limitation
    rows:
      - - District registrar processes student enrollment
        - Manual paper forms, spreadsheets, separate state reporting tools
        - PowerSchool SIS enrollment + automated state/federal reporting (NCES, CEDS)
        - Eliminates months of manual data compilation; errors reduced via automated workflows
        - Implementation takes 6-12 months for large districts; TCO higher than subscription
      - - Teacher creates and delivers standards-aligned assessment
        - Manual question creation, paper or basic LMS quizzes, manual grading
        - Performance Matters with 130,000-item bank, generative AI questions, AI rubric scoring
        - Saves teacher time; autograded assignments; standards alignment automatic
        - Item bank depth varies by subject/grade; AI rubric scoring limited to free-response
      - - Special ed coordinator manages IEP caseload
        - Paper IEP forms, siloed tracking spreadsheets, manual deadline monitoring
        - Special Programs with AI-assisted drafting, workflow-driven compliance, digital signatures
        - 417,297 forms completed in 2025; 1,200+ districts; statewide compliance partnerships
        - AI drafting requires human review for high-stakes legal documents; state-specific validation needed
      - - School counselor guides college-bound student
        - Spreadsheets, paper-based college lists, manual recommendation letter drafting
        - Naviance CCLR with AI college matching, work-based learning marketplace, AI letters
        - Reduces burden at 376-to-1 student-counselor ratio; 8M students on platform
        - WBL marketplace launched July 2025; adoption rate not yet confirmed at scale
      - - District administrator queries student achievement data
        - Multiple disconnected systems, manual extracts, overnight data refreshes
        - PowerBuddy in Analytics & Insights for natural language data queries
        - Real-time data access; democratized analytics for non-technical administrators
        - Requires Connected Intelligence license; pricing not public; AI accuracy on edge cases unvalidated
      - - Parent monitors child's academic progress
        - Phone calls to school, paper report cards, waiting for parent-teacher conferences
        - Parent Portal in SIS + PowerBuddy for Engagement (2025-2026 launch)
        - Real-time grade/attendance visibility; PowerBuddy proactively alerts for underperformance
        - PowerBuddy for Engagement is new for 2025-2026; adoption cadence unclear
      - - District HR team processes payroll and benefits
        - Separate HR and finance systems, manual requisition routing, paper approvals
        - eFinancePlus with automated workflows for purchasing, payroll, position control
        - Approval workflows eliminate paper routing; 400+ native K-12 reports
        - External system integrations require custom data mapping; not suitable for non-US districts
    notes: >-
      Workflow descriptions synthesized from official PowerSchool product pages and press releases,
      third-party reviews on makerstack.co and hr.software, and Schoology release notes. Benefits
      are company-claimed unless cited to independent sources.
