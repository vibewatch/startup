company:
  name: PowerSchool
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    PowerSchool's K-12 Connected Operating System encompasses eight distinct product families spanning
    student information management, learning management (Schoology), assessment (Performance Matters),
    special education (Special Programs), college and career readiness (Naviance CCLR), ERP finance
    and HR (eFinancePlus), school communications (SchoolMessenger), and data intelligence (Connected
    Intelligence / Analytics & Insights). The platform serves 60+ million students across 18,000+
    customers in 90+ countries and is Ed-Fi certified for both Data Standard v4 and v5. PowerBuddy,
    the company's generative AI assistant embedded across multiple product lines, launched in the
    2024-2025 school year and is expanding into multi-language support and family engagement for
    2025-2026. The December 2024 data breach — exposing 62 million student and teacher records due
    to a missing MFA control on the PowerSource support portal — has materially impacted trust posture
    and is the dominant product-risk overhang for the Bain Capital ownership period.

sections:
  - id: product-portfolio
    title: Product portfolio and the K-12 connected operating system
    body: >-
      PowerSchool positions its product offering under the brand name the K-12 Connected Operating System,
      organized around three areas of impact: home connections, student achievement, and operational
      excellence. As of June 2026, the portfolio spans eight major product families. The Student Information
      System (SIS) is the foundational module, managing student enrollment, attendance, scheduling, grading,
      state and federal compliance reporting, and parent communications for more than 60 million students
      across 18,000+ organizations in 90+ countries. Built on top of the SIS data layer is the Schoology
      Learning Management System, an LMS now used by more than 7 million students and 4,000 organizations
      that provides curriculum, assignments, assessments, and family communications in one platform. The
      Assessment module, sold as Performance Matters, serves 650 organizations and 500,000 teachers with
      pre-built item banks containing 130,000+ questions, standards-aligned assessments, and AI-powered
      rubric scoring via PowerBuddy. The Special Programs module addresses IEP, 504, ELL, Gifted and
      Talented, and service capture workflows for 1,200+ districts, reporting 9.5 million students supported
      and 417,297 forms completed in 2025. The Naviance CCLR platform serves 8 million students in 35% of
      U.S. high schools with college, career, and life readiness tools including AI-generated recommendation
      letters and a new work-based learning marketplace. ERP Systems (eFinancePlus and related products)
      provides finance, payroll, and HR management to 250+ districts. Connected Intelligence delivers a
      managed data-as-a-service platform that centralizes SIS, LMS, ERP, assessment, and third-party data
      for real-time analytics and longitudinal reporting. PowerBuddy is the AI layer spanning all product
      families, described by the company as bringing AI to districts' data rather than transporting data
      to external AI platforms, a design choice driven by student privacy requirements.
