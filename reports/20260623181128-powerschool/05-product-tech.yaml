  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Cloud infrastructure (primary SaaS hosting)
        - Hosts SIS, LMS, Assessment, Special Programs, Naviance, Connected Intelligence
        - Major cloud provider (AWS/Azure); multi-region redundancy
        - December 2024 breach exposed weak credential controls on support portal
      - - Ed-Fi Data Standard API (v4/v5)
        - SIS-to-ODS data exchange; state reporting interoperability standard
        - Ed-Fi Alliance certification; verified TX, GA, MN district implementations
        - Certification valid through Dec 2026 (v4) / June 2027 (v5); re-cert required
      - - OneRoster (v1.1/1.2 REST/CSV)
        - Roster sync between SIS and LMS/third-party tools
        - 1EdTech standard; ~70% of LMS vendors support OneRoster
        - CSV batch option for legacy compatibility reduces real-time data accuracy
      - - LTI Advantage (v1.3 / NRPS)
        - SSO, deep linking, and grade passback for third-party tools in Schoology
        - 1EdTech LTI standard; tools must implement key/nonce management
        - Tool vendor adoption varies; some tools still on LTI 1.1 requiring fallback paths
      - - OAuth 2.0 / SAML SSO
        - Authentication for API access and single sign-on across PowerSchool products
        - Identity providers (district LDAP / Azure AD / Google Workspace)
        - District-managed identity quality varies; password-only access contributed to 2024 breach
      - - PowerBuddy AI engine (cross-platform)
        - Generative AI assistant for students, teachers, parents, admins, counselors
        - LLM provider(s) not publicly disclosed; "AI comes to data" architecture
        - AI model accuracy, bias, and content-safety filtering not independently audited
      - - Connected Intelligence (DaaS)
        - Managed cloud data platform for cross-system analytics, archiving, AI readiness
        - Underlying cloud data warehouse (provider not disclosed); PowerSchool-managed
        - Single-vendor dependency for managed data layer; migration effort if switching
      - - PowerSource support portal
        - Remote support and troubleshooting for customer SIS environments
        - PowerSchool-operated portal accessed by internal engineers and subcontractors
        - Was the vector for December 2024 breach; MFA now required post-breach
      - - Third-party developer ecosystem
        - API wrappers, plugins, and integrations built by independent developers
        - GitHub-hosted open-source projects in Node.js, PHP, Python, Svelte (50+ repos)
        - Community-maintained; no SLA; varying update cadence across projects
    notes: >-
      Architecture descriptions derived from official product pages, Ed-Fi certification records,
      GitHub topics page, and Schoology release notes. LLM provider for PowerBuddy is not publicly
      disclosed. Cloud infrastructure provider is not officially confirmed beyond "major cloud providers."
