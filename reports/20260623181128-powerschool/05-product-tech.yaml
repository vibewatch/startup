callouts:
  - calloutType: risk
    title: December 2024 breach is the dominant trust and product risk
    body: >-
      The December 2024 data breach — which exposed 62 million student records due to a missing MFA
      control on the PowerSource support portal — is the most material product-layer risk factor. The
      breach vector was not a product defect in any customer-facing system but an administrative oversight
      on an internal support tool, which is both reassuring (no flaw in the product itself) and alarming
      (the company's own operational security failed). Post-breach remediations including mandatory MFA
      and time-based access controls are now in place, but PowerSchool's removal from the Future of
      Privacy Forum's Student Privacy Pledge and ongoing state AG investigations create a sustained
      procurement headwind that diligence must quantify via post-breach NRR data.
    claimRefs:
      - CE023
      - CE024
      - CE026
      - CE029

  - calloutType: strength
    title: Depth of vertical integration and high switching cost are the core moat
    body: >-
      PowerSchool's ability to connect SIS data to LMS, assessment, special ed, college readiness,
      ERP, and analytics creates a data network effect that pure-play competitors cannot replicate
      without comparable breadth. Ed-Fi v4/v5 certification, OneRoster compliance, and LTI Advantage
      support make PowerSchool interoperable with the full edtech ecosystem while maintaining the SIS
      as the authoritative data source. Switching costs embedded in multi-year contracts, trained staff,
      and deep state reporting integrations make displacement extremely rare — a structural feature that
      partially insulates the ARR base even in the post-breach environment.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE001

  - calloutType: insight
    title: PowerBuddy is the next growth layer but carries unaudited AI risk
    body: >-
      PowerBuddy's "AI comes to data" design — bringing LLM inference to district-consolidated data
      rather than exporting student data to third-party AI services — is a privacy-first differentiator
      that addresses the primary procurement objection to AI in K-12. The 2024 GESS Education Award
      for Best AI Product validates early market reception. However, the underlying LLM provider is
      not publicly disclosed, content-safety filtering has not been independently audited, and the
      incremental ARR contribution from AI modules has not been separately disclosed, making it
      impossible from public sources alone to assess whether PowerBuddy is driving meaningful
      incremental revenue or is included in base subscription pricing as a retention tool.
    claimRefs:
      - CE031
      - CE032
      - CE037
      - CE038

