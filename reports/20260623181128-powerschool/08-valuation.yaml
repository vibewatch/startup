company:
  name: PowerSchool

chapter:
  number: 8
  title: Valuation and Investment Recommendation
  summary: >-
    PowerSchool enters the June 2026 diligence window as a private-credit-financed LBO with no public financial
    disclosures since October 2024, an unquantified data-breach liability from MDL-3142, and a $5.6 billion entry
    valuation implying roughly 7.8x forward ARR — a premium that can only be justified if the post-LBO debt is
    serviceable, the December 2024 breach has not materially impaired NRR, and K-12 budgets stabilize after the
    ESSER cliff. Public evidence on all three preconditions is absent or adverse. The recommendation is conditional
    hold / research-more: the underlying SaaS business quality is best-in-class for K-12 vertical software, but the
    post-close information blackout, unresolved breach litigation, and opaque leverage structure make a buy call
    unsupported by public evidence. A definitive position requires audited post-LBO financials, the private-credit
    term sheet, and a breach litigation reserve estimate.

sections:
  - id: thesis-and-valuation-context
    title: Investment thesis, entry valuation, and comparable context
    body: >-
      The central investment proposition for PowerSchool rests on three mutually reinforcing pillars: market
      dominance, sticky recurring revenue, and a durable switching-cost moat in a non-discretionary K-12 spending
      category. On the market side, the company serves more than 18,000 school districts across 90-plus countries
      and holds approximately 23 percent of U.S. K-12 student information system implementations — nearly
      two-and-a-half times the share of its nearest rival. On the revenue side, the last disclosed ARR of $720.3
      million as of Q1 2024 grew 18 percent year-over-year while net revenue retention held at 107 percent, indicating
      that existing customers are expanding their spend faster than any customers are churning. On the economics
      side, adjusted EBITDA margins of 33-35 percent and free cash flow of $168.4 million representing a 24 percent
      FCF margin in FY2023 demonstrated a capital-efficient business before the take-private financing was applied.

      Bain Capital's $5.6 billion acquisition at $22.80 per share, a 37 percent premium to the unaffected stock
      price, translates to approximately 7.8x the $720 million Q1 2024 ARR run rate and approximately 7.6x the
      $741 million trailing-twelve-month revenue as of mid-2024. For context, Tyler Technologies — the closest
      publicly traded government and education SaaS peer — trades at approximately 4.7-5.0x forward revenue in
      June 2026. Instructure, which KKR took private in July 2024 at roughly a 7.0x EV/Revenue multiple, provides
      a more direct EdTech take-private precedent and suggests Bain paid near the high end of the defensible range
      for a mission-critical K-12 SaaS platform. The FE International EdTech M&A analysis for 2026 puts the sector
      median at approximately 7.8x EV/Revenue for premium subscription assets, so the PowerSchool entry price is at
      market for a top-quality platform but leaves limited margin of safety if any thesis component underperforms.

      The anti-thesis centers on three post-close adverse developments. First, the December 2024 data breach
      exposed records of 62 million students and 10 million teachers, triggering MDL-3142 class-action consolidation,
      state attorney general investigations, ransom payment, and removal from the Future of Privacy Forum's Student
      Privacy Pledge. Second, the private-credit LBO financing from Ares, HPS, Blackstone, Blue Owl, Sixth Street,
      and Golub Capital is structurally likely to carry annual interest expense in the $200-350 million range on an
      estimated $3-4 billion debt load — a figure that would consume most or all of the pre-LBO adjusted EBITDA
      at the low end. Third, the post-ESSER funding cliff that ended approximately $190 billion in pandemic-era K-12
      relief in September 2024 creates ongoing district budget pressure that could dampen expansion revenue and new
      wins in 2025-2026.
