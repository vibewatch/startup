  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market dominance and SIS lock-in
        - 23% U.S. K-12 SIS share, 3-7 year contracts, state-reporting integrations, and high switching cost make customer attrition structurally slow
        - Breach-driven trust deficit is accelerating RFP evaluation cycles at Infinite Campus and Skyward; districts demanding security concessions
        - Post-breach NRR confirmation above 104% and gross revenue retention above 92% for FY2025
      - - Revenue quality and retention economics
        - 107% NRR (Q1 2024), 90% subscription mix, $213M deferred revenue, and 18% ARR growth are top-quartile for vertical SaaS
        - NRR is a lagging indicator; 2025-2026 district contract renewals under post-breach scrutiny have not been publicly disclosed
        - FY2025 NRR ≥104% and ARR growth ≥12% confirmed through audited statements
      - - Capital structure and debt serviceability
        - High-quality SaaS cash flow was designed to support LBO-level debt; adjusted EBITDA margins of 33-35% and strong FCF conversion pre-LBO
        - Private-credit interest expense estimated at $200-350M/year would consume most pre-LBO adjusted EBITDA; exact terms not public
        - Post-close audited EBITDA coverage ratio ≥1.5x interest and no covenant breach through 2025
      - - Breach liability and data risk
        - Ransom paid, credit monitoring offered, and hacker arrested and sentenced to 4 years in prison with $14.1M restitution
        - MDL-3142 has 55+ class actions, state AG investigations ongoing, district mass-action; financial exposure unquantified
        - Settled breach liability confirmed below $150M with no injunctive relief requiring operational disruption
    notes: >-
      Anti-thesis arguments are grounded in publicly documented evidence from breach litigation filings,
      K-12 Dive reporting, and financial analyst estimates.
