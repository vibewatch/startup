  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters to the investment thesis
      - Owner or diligence path
    rows:
      - - Post-LBO capital structure
        - Exact total debt quantum, all-in interest rate, required amortization, covenant package, and maturity schedule from the Ares/HPS/Blackstone/Blue Owl/Sixth Street/Golub private-credit syndicate
        - Cannot assess debt serviceability, EBITDA coverage, or distress risk without interest expense; this is the single most important unknown for the base/bear scenario split
        - Request credit agreement summary or lender presentation from Bain Capital; review alongside audited financials
      - - Audited FY2024 and FY2025 financial statements
        - Income statement, balance sheet, and cash flow statement for fiscal years ending December 2024 and December 2025, audited or management-reviewed
        - No verified post-close revenue, ARR, EBITDA, or FCF data exists; all investment models rest on pre-LBO anchors from Q2 2024
        - Request from PowerSchool management; obtain auditor engagement letter and audit opinion
      - - Breach litigation reserve and settlement exposure
        - Estimated reserve for MDL-3142 class-action, district mass-action, and state AG settlements; cyber insurance policy limits and coverage confirmation
        - Breach liability is the largest unquantified contingency; a $400M+ settlement changes the base/bear boundary and may impair debt covenants
        - Request legal reserve estimate from PowerSchool's outside counsel; confirm D&O and cyber insurance coverage and sublimits
      - - Post-breach NRR and gross revenue retention
        - Net revenue retention rate and gross revenue retention rate for FY2025 and H1 2026 following the December 2024 breach
        - NRR is the primary SaaS quality indicator; post-breach deterioration would directly reduce ARR and exit multiple expectations
        - Request from PowerSchool's CFO; cross-check with any publicly available district contract cancellation notices
      - - AI module revenue contribution and roadmap
        - Separately disclosed ARR for PowerBuddy and other AI modules; attach rate to existing customers; incremental pricing uplift per district
        - AI upsell is the primary bull-case growth driver; understanding baseline ARR attribution is critical to validating the $1B+ revenue target
        - Request AI module ARR breakdown from management; review product-level contract data if available
    notes: >-
      These five asks are blocking items for converting the conditional hold to either a definitive buy or reduce.
      Listed in priority order; the first two must be resolved before the other three become analytically meaningful.
