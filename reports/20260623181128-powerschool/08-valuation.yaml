  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Breach settlement or litigation reserve disclosed
        - Settlement or reserve disclosed above $400M, or injunctive relief requiring material operational changes
        - Directly impairs FCF available for debt service; compounds with interest burden to create EBITDA coverage risk; may accelerate competitor switching
        - Downgrade from conditional hold to reduce/avoid; request updated debt coverage ratio from Bain
      - - NRR deterioration post-breach
        - NRR for FY2025 confirmed below 100% for two consecutive reporting periods
        - Breaks the central SaaS quality thesis; ARR growth reversal reduces exit multiple expectations and may trigger covenant tests
        - Immediate downgrade to avoid; set hard floor at 100% NRR minimum for hold
      - - Post-LBO EBITDA coverage breach
        - Interest coverage ratio falls below 1.0x on a trailing-twelve-month adjusted basis, or covenant breach reported
        - Debt distress risk materializes; private-credit lenders may impose operational restrictions or accelerate; equity value at risk
        - Avoid immediately; treat as distressed-company scenario requiring restructuring analysis
      - - K-12 budget deterioration
        - U.S. public K-12 per-pupil spending falls more than 5% in real terms over two consecutive years, driven by enrollment decline and ESSER cliff
        - Reduces addressable budget for software purchasing, lengthens sales cycles, increases churn from financially stressed districts
        - Reduce and monitor; trigger heightened diligence on renewal pipeline and new-logo bookings velocity
      - - CEO or key leadership departure
        - CEO Pietri departs before October 2027, or CTO or CFO departs without announced successor
        - Execution risk rises significantly; second leadership disruption in 18 months signals governance instability under Bain's ownership model
        - Escalate diligence; hold pending clarity on strategic direction and successor
    notes: >-
      Thresholds are evidence-based wherever possible. NRR, EBITDA coverage, and settlement thresholds are
      derived from comparable SaaS distress cases and the pre-LBO financial profile.
