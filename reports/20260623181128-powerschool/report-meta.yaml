  topStrengths:
    - Dominant SIS position with 18,000+ customer organizations and deep state-reporting switching costs
    - Broad cross-sellable K-12 platform spanning SIS, LMS, assessment, special programs, communications, and readiness
    - Pre-LBO SaaS quality was strong, with 18% ARR growth, 107% NRR, and 33-35% adjusted EBITDA margins
  topRisks:
    - Largest known U.S. K-12 student-data breach created open litigation, regulatory, and trust liabilities
    - Private-credit-funded LBO debt terms and debt-service coverage are undisclosed after the October 2024 take-private
    - Post-ESSER district budget pressure and leadership transition could weaken renewals and expansion while disclosure is absent
  unresolvedGaps:
