  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与买方范围
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的客户群以美国公立 K-12 系统为锚，同时覆盖 90 多个国家的私立学校、特许学校运营方、州机构和国际教育主管部门。 截至 2026 年 6 月，公司称拥有 18,000
              多个客户，并支持超过 60 million 名学生，是按装机基础计最大的 K-12 教育软件平台。 美国按学生人数排名前 100 的学区中，超过 90 个已确认是 PowerSchool
              客户；这些学区代表了美国规模最大、复杂度最高的教育机构。 买方画像主要是学区技术主管或 superintendent，他们代表整个学区签署多年、按年续约的订阅合同。资金来自州和联邦教育拨款，
              而非单所学校预算，因此采购周期受学校董事会批准和州招标规则约束。

              分层看，客户构成可分为四大层级。大型公立学区（通常 10,000+ 名学生）是旗舰客群；PowerSchool 专门面向按入学人数排名前 100 的学区营销，并称至少在一个产品上拿下其中 90
              多个客户。中型公立学区（1,000–10,000 名学生）构成 18,000 客户基础中 数量最广的一层，是核心续约引擎。小型和农村学区，以及特许学校网络，补齐国内覆盖。国际客户遍布 Canada、Middle
              East、 South Asia 及其他地区，代表一个在增长但披露较少的客户份额。不同分层的产品渗透差异很大：大型学区更可能持有覆盖 SIS、 LMS、HR、分析和 CCLR 的多模块合同；较小学区通常从 SIS
              单点切入，并在后续续约周期中扩展。

              三个平台产品锚定客户关系。PowerSchool SIS（包括面向较大学区的 eSchoolPlus 和 eSembler）是绝大多数客户的入口点。 Schoology Learning 作为
              PowerSchool 的 K-12 LMS，截至 2026 年 5 月持有 19% LMS 市场份额，服务 4,000 多个组织。 Naviance CCLR 触达超过 8 million 名学生，部署于
              35% 的美国高中，是按学生数计第二大 PowerSchool 产品。第四层、且战略性 越来越强的是 PowerBuddy AI 助手；它部署在 Schoology 和 Naviance
              内，目前正在早期采用学区扩展，是 Bain Capital 时代 主要的 land-and-expand 驱动。
