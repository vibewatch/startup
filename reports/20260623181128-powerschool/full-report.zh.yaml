  - id: FU001
    title: 客户旅程图——K-12 学区采用和扩张
    type: journey-map
    layout: wide
    summary: K-12 学区与 PowerSchool 的关系先从初步认知和 RFP 进入 SIS 部署，再沿模块层和续约周期扩张；2024 年 12 月数据泄露新增了一个部署后的信任断裂节点，把部分客户导向退出。
    data:
      nodes:
        - id: jm1
          label: 发现与 RFP
          detail: 学区技术主管通过州采购数据库、同行推荐或即将到期的原供应商合同识别 SIS 需求。PowerSchool 23% 的市场份额带来很高的基线认知；RFP 流程受学校董事会批准和州投标规则约束。
          tone: neutral
        - id: jm2
          label: SIS 实施
          detail: 核心 SIS 部署（eSchoolPlus、eSembler 或 PowerSchool SIS）需要 3-12 个月。成本包括实施服务、数据迁移和员工培训。高摩擦上手过程形成早期锁定。
          tone: neutral
        - id: jm3
          label: 模块交叉销售（第 2-3 年）
          detail: >-
            续约周期激活 Schoology LMS、Naviance CCLR、Connected Intelligence 分析、SchoolMessenger 通信，或 HR / talent 模块。续约 ACV 平均
            $24,939，高于初始 $10,604。NRR 107% 证实净扩张为正。
          tone: positive
        - id: jm4
          label: AI 层采用（2024-2026）
          detail: >-
            PowerBuddy AI 作为高级附加模块部署在 Schoology 或 Naviance 内。Tomball ISD（TX）是 2024 年 9 月首个试点的 Texas 学区。Naviance CCLR AI
