      - number: '7.3'
        title: 合作伙伴、依赖与运营风险
        blocks:
          - type: paragraph
            body: >
              PowerSchool 的运营连续性依赖一组集中的平台、基础设施和分销依赖；任何失效或恶化，都会直接损害 18,000 多个学区客户的服务交付。 公司云托管 SIS 运行在 AWS 和 Microsoft
              Azure 上，超大规模云的可用性和 API 稳定性具有任务关键性。历史上的云中断，例如 AWS US-EAST-1 故障，曾让依赖 SIS
              的运营出现临时服务降级，包括学区日常运营和州合规报告所依赖的出勤、入学和成绩跟踪。PowerSchool 平台架构把所有客户数据和支持层维护访问都路由到集中门户；如 2024 年 12
              月泄露所示，当边界控制薄弱时，这种设计会制造高价值的单一入口点。

              客户集中度风险结构性嵌入商业模式。美国按入学人数排名前 100 的学区中，超过 90 个使用 PowerSchool 产品；多个州的全州采用要求， 也让公司暴露于单州采购决策。North Carolina 从
              PowerSchool SIS 全州迁移至 Infinite Campus（目标 2025 年 7 月完成），是泄露余波 和竞争重新评估触发大规模客户流失的最可见案例。ListEdTech 2025 年 11
              月覆盖 23,000 多个学区的数据库显示，PowerSchool 在已识别 SIS 实施中的份额为 23%，低于此前主导位置，而 Infinite Campus 在南部和中西部州获得增长。PowerSchool
              学区 SIS 平均合同价值为 每年 $10,604（Civic IQ 合同数据库），因此每失去一个全州 mandate，就相当于失去数千个单个合同续约。

              泄露也暴露了 PowerSchool 对合同合规框架的依赖，包括 26+ 州使用的 Student Data Privacy Consortium National Data Protection
              Agreement；该协议要求 MFA、72 小时泄露通知和数据最小化。PowerSchool 承认 PowerSource 缺少 MFA，直接违反这些 DPA 条款，使其面临
              数百个签约学区的违约索赔；Wisconsin St. Croix Falls 学区诉讼就明确利用了这一动态。公司对 Bain Capital 资本配置决策的依赖， 形成第二层运营风险：Bain 指示将 IT
              和网络安全职能外包给第三方承包商，是法院帮助和教唆理论的核心；进一步的 LBO 后成本重组， 可能再次引入类似安全漏洞。
