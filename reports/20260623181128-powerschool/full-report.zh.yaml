          tone: positive
        - id: jm5
          label: 信任断裂（泄露后）
          detail: 2024 年 12 月数据泄露暴露 62M 条学生记录。学区在续约时要求 MFA 证明、SOC 2 Type 2 和赔偿条款。NC 全州退出已于 2025 年 7 月完成。加拿大定向勒索活动推高了流失风险。
