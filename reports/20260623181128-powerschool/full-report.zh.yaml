      - number: '5.4'
        title: 信任、安全、合规与 2024 年 12 月泄露后续
        blocks:
          - type: paragraph
            body: >-
              2024 年 12 月数据泄露，是 PowerSchool 近期产品历史中决定性的信任事件。攻击者使用 PowerSchool 分包商被攻陷的 凭据访问
              PowerSource，即公司的客户支持门户；该门户当时不要求多因素认证。2024 年 12 月 19 日至 28 日期间， 攻击者系统性外泄了数千个学区的学生和教师数据库，暴露约 62 million 名学生和
              9.5 million 名教师的记录——包括姓名、 社会安全号码、出生日期、地址、医疗警示信息，以及可追溯 20 多年的历史记录。PowerSchool 支付了约 $2.85 million
              比特币赎金，但数据从未被完全销毁；到 2025 年 5 月，攻击者开始直接用原始被盗数据勒索单个学区。黑客被确认是 Matthew Lane，2025 年 10 月被判处四年联邦监禁，并被责令支付 $14.1
              million 赔偿。泄露事件后，PowerSchool 增加了安全层和基于时间的访问控制，以更严格密码政策重置客户门户凭据，并开始要求敏感系统访问必须使用多因素认证。 第三方取证调查由 CrowdStrike
              执行。尽管完成了这些泄露后补救，PowerSchool 仍被 Future of Privacy Forum 从 Student Privacy Pledge 中移除，Texas、North
              Carolina、Tennessee 等多个州总检察长也启动调查。在正常条件下， PowerSchool 的合规姿态包括与所有学区客户签订 FERPA 合同要求、企业采购团队期待的 SOC 2 Type II
              审计、通过 2026 年 4 月 SIS 到 Schoology 的出生日期同步为 PowerBuddy 提供对齐 COPPA 的年龄门控，以及作为已验证互操作标准的 Ed-Fi 认证。PowerSchool
              University 的角色认证覆盖 SIS 前台、顾问、校长和成绩册流程，为学区提供走向全平台使用的 结构化路径。
