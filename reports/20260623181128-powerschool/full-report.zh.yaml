  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 位于 K-12 教育三类重叠软件的交汇处：student information systems（SIS）、learning management systems（LMS）和 HR /
              workforce management。其竞争敞口横跨每一层的在位同业、产品只重叠单一模块的相邻供应商，以及简单续签当前 PowerSchool 合同的现状选项。在 SIS
              这一每个公立学区都需要的运营骨干中，PowerSchool 约占美国 K-12 实施的 23%，依据 ListEdTech 覆盖 23,000 多个学区的数据库截至 2025 年 11
              月的数据。这个压倒性领先地位由数十年收购拼出，包括 eSchoolPlus、Chancery SMS、Schoology、Naviance 和
              iNow，形成了比任何单一竞争对手覆盖更多层的产品组合。Infinite Campus 约 10% 排名第二，Skyward 约 7% 排名第三；SIS 市场剩余 60% 分散在 Aeries、Focus
              School Software、Synergy 以及数十个州或地区特定系统之间。在 LMS 层，Google Classroom 以截至 2026 年 5 月约 31% 的 K-12
              份额领先，Canvas（Instructure）约占 24%，PowerSchool 的 Schoology 产品约占 19%。Frontline Education 覆盖 10,000 多个学区的 HR
              平台，在 workforce management 层形成部分重叠。PowerSchool 2024 年 12 月数据泄露暴露了约 6,200 万名学生和 950
              万名教师的个人数据，是公司历史上最重大的信任破坏事件，并在 2026 年持续塑造竞争动态。这次泄露侵蚀了 PowerSchool 护城河中的数据托管维度，并加速竞争平台上的 RFP 评估周期。
