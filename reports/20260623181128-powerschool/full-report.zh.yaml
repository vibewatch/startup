      - number: '4.3'
        title: 资本结构与 LBO 融资
        blocks:
          - type: paragraph
            body: >-
              Bain Capital 于 2024 年 10 月 1 日完成收购 PowerSchool，每股价格 $22.80，对应总企业价值约 $5.6 billion， 较 2024 年 5 月 7 日未受影响股价
              $16.64 溢价 37%。原有投资方 Vista Equity Partners 与 Onex Partners 在私有化后的公司中保留少数股权。交易债务融资全部来自一个私人信贷银团，成员包括 Ares
              Capital Management、 HPS Investment Partners、Blackstone Alternative Credit Advisors、Blue Owl Credit
              Advisors、Sixth Street Partners 和 Golub Capital；这一结构值得注意，因为 2024 年多数大型 LBO 仍使用传统银行牵头的杠杆贷款。交割时， PowerSchool
              的税收应收协议（TRA）也被修订；该协议原估值约 $450 million，或每股超过 $2，修订后在本次交易 相关及交易之后均不再付款。LBO 前资本充足性已经吃紧：截至 2023 年 12 月 31
              日，公司长期债务为 $811 million， 现金只有 $39 million。到 2024 年 6 月 30 日，现金降至约 $21 million，公司披露净债务杠杆率为调整后 EBITDA 的 3.8
              倍。LBO 后总债务规模显著高于这些上市公司时期的锚点，因为私人信贷银团为 $5.6 billion 交易提供了大部分融资；
              但确切债务金额、利率条款和强制现金扫款要求均未公开披露。「公司概览」章节记录了完整融资与股权时间线；本节聚焦 LBO 后资本充足性，以及它对财务表现的影响。
