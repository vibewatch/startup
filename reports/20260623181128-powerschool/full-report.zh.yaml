      - number: '6.2'
        title: 采用轨迹与市场渗透
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 2021 至 2024 年的采用轨迹，有公开股权文件记录，并由独立市场情报数据验证。Annual Recurring Revenue 从 IPO（2021 年 8 月）时约 $594
              million，增长到 2024 年 3 月 31 日的 $720.3 million，同比增长 18%，动力来自 交叉销售、模块扩展和收购。Q1 2024 $185 million 总收入中，订阅和支持收入占
              90%，确认装机基础的耐久性。最后一次公开披露 的 NRR 为 Q1 2024 的 107%，说明既有客户群内扩张收入超过流失收入——这是 K-12 SaaS 论点最关键的单位经济信号。 2024 年 10
              月私有化后，PowerSchool 停止公开财务报告，2025 或 2026 财年没有公开可得的 ARR 或 NRR 更新。

              第三方市场情报印证了渗透故事。ListEdTech 2026 年 5 月数据确认，Schoology 在 K-12 LMS 中市场份额为 19%—— 2020–2021 远程学习热潮后加速，此后自 2022
              年以来保持稳定。CivicIQ 2026 年 4 月合同数据库跟踪 54 个 PowerSchool SIS 合同，平均年度合同价值 $10,604，软件续约则升至
              $24,939；这说明多年客户会叠加模块，提高有效 ACV。Landbase 2025 年 8 月技术部署数据验证，全球有 5,291 个已确认组织使用 PowerSchool 产品。

              尽管发生泄露，2025–2026 年的产品认可里程碑仍确认平台动能。2025 年 6 月，Snowflake 在 Snowflake Summit 上将 PowerSchool 评为 2025 Public
              Sector Data Cloud Product Partner of the Year，凸显 Connected Intelligence 分析平台。2026 年 6 月，EdTech
              Breakthrough Awards 从 3,000 多个全球提名中，将 Schoology 评为 “Overall LMS Solution Provider of the Year”。2026 K-12
              EdTech Pulse 于 2026 年 2 月 3 日发布，调查了 1,300 多名教育工作者，发现财务不确定性、AI 采用和出勤管理是学区三大主导优先事项——PowerSchool 当前产品组合和扩展路线图
              均可覆盖这些需求。
