      - number: '2.2'
        title: 买方分层、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              K-12 行政软件市场有一套独特的买方—付款方—用户结构，决定 PowerSchool 的 go-to-market。付款方几乎总是学区，资金来自地方房产税收入、州公式拨款，以及包括 Title I（按 2026
              年 Consolidated Appropriations Act，FY2026 全国约 $18.4 billion）和 IDEA Part B（FY2026 约 $15.5
              billion）在内的联邦公式拨款。采购权掌握在学区 superintendent 和 chief information officer
              手中，超过一定金额门槛的多年合同有时还需要董事会批准。教师、辅导员和学校管理者是主要用户，对平台选择有显著影响，但通常不直接掌握预算。家庭是沟通功能的最终接收者，但没有正式采购角色。

              细分结构跟随学区规模和任务变化。学生人数超过 50,000 的大型城市学区，在 SIS、特殊教育、LMS 和 HR 上有复杂合规需求，通常签多年期平台合同。中型郊区学区构成约 19,183
              个美国公立学区中数量最大的细分，常借助合作采购工具或州级框架协议。小型和农村学区预算受限，经常只购买 SIS，令相邻模块交叉销售更难。私立和 faith-based schools
              构成另一个采购宇宙——FACTS SIS 在该细分约占 K-12 SIS 实施的 15%——采购更简单，但预算更小。州教育厅则是全州合规平台的战略买家；Indiana Department of
              Education 的 PowerSchool Special Programs 合同被报道为公司 2024 年有史以来最大合同，展示了州级需求规模。

              SIS 替换的采用触发点通常是合同到期、合规或报送失败、州数据系统强制要求，或对数据质量和分析深度不满。切换成本在结构上很高：覆盖多年甚至数十年的学生记录数据迁移、员工再培训，以及重建与
              LMS、餐饮服务和州报送系统的集成，对大型学区可花费数十万美元到超过一百万美元。CivicIQ 记录显示，PowerSchool 和 Skyward 都参与州级合作采购协议，允许学区无需完整公开 RFP
              即可采购，从而缩短销售周期并强化在位优势。一旦安装，SIS 平台受益于强大的切换惯性，因为每个学区利益相关方的工作流都会在多年合同周期中嵌入在位系统。
