      - number: '1.3'
        title: 股权历史、融资与投资者版图
        blocks:
          - type: paragraph
            body: >
              PowerSchool 的机构股权历史分为四个阶段。第一，Apple 于 2001 年从创始人手中收购公司并持有至 2006 年，随后卖给 Pearson。第二，Vista Equity Partners 于
              2015 年 6 月以 $350 million 从 Pearson 手中买下 PowerSchool，当时这个学生信息系统服务约 70 个国家的 1,300 万名学生。第三，2018 年 4 月，Onex
              Corporation 与 Vista 重组股权，两家公司持有同等股权；同一时期，公司收购了面向 K-12 的人才管理平台 PeopleAdmin。在 Vista-Onex 双方持股期间，PowerSchool
              完成一系列收购，包括 2019 年的 Schoology、通过 2021 年 Hobsons 交易获得的 Naviance，以及 2023 年 10 月以 $300 million 收购的
              SchoolMessenger，并于 2021 年 7 月在 NYSE 上市，IPO 募资约 $711 million。第四，Bain Capital 于 2024 年 6 月 7 日宣布达成最终协议，将以每股
              $22.80 收购 PowerSchool（企业价值 $5.6 billion）；交易于 2024 年 10 月 1 日交割，Vista 和 Onex 保留少数股权。


              支持 Bain 交易的债务融资来自 Ares Capital Management、HPS Investment Partners、Blackstone Alternative Credit
              Advisors、Blue Owl Credit Advisors、Sixth Street Partners 和 Golub Capital。作为私营公司，PowerSchool 不再向 SEC
              提交定期财务披露；私有化后的精确资本结构，包括 Bain、Vista、Onex 与管理层各自持股比例，以及债务工具条款，均未公开。Bain Capital 合伙人 David Humphrey 和 Max de
              Groen 是 PowerSchool 投资的具名管理合伙人，并曾公开谈及公司的产品创新路线图和增长野心。
