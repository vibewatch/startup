      - CV037
      - CV038
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何影响投资论点
      - 负责人或尽调路径
    rows:
      - - LBO 后资本结构
        - Ares/HPS/Blackstone/Blue Owl/Sixth Street/Golub 私募信贷银团提供的确切总债务规模、全包利率、强制摊还、契约包和到期日安排
        - 没有利息支出，无法评估偿债能力、EBITDA 覆盖或困境风险；这是区分基准 / 空头情景最重要的单一未知
        - 向 Bain Capital 索取信贷协议摘要或出借人演示材料；与经审计财务一并审阅
      - - 经审计 FY2024 和 FY2025 财务报表
        - 截至 2024 年 12 月和 2025 年 12 月财年的利润表、资产负债表和现金流量表，经审计或管理层审阅
        - 没有经验证的交割后收入、ARR、EBITDA 或 FCF 数据；所有投资模型都依赖 2024 年 Q2 的 LBO 前锚点
        - 向 PowerSchool 管理层索取；取得审计聘书和审计意见
      - - 数据泄露诉讼准备金与和解敞口
        - MDL-3142 集体诉讼、学区群体行动和州 AG 和解的估计准备金；网络保险保额上限和承保确认
        - 数据泄露负债是最大的未量化或有事项；$400M+ 和解会改变基准 / 空头边界，并可能损害债务契约
        - 向 PowerSchool 外部律师索取法律准备金估算；确认 D&O 和网络保险覆盖及分项限额
      - - 泄露后 NRR 和总收入留存
        - 2024 年 12 月数据泄露后，FY2025 和 2026 年上半年的净收入留存率与总收入留存率
        - NRR 是最核心的 SaaS 质量指标；泄露后若恶化，会直接降低 ARR 和退出倍数预期
        - 向 PowerSchool CFO 索取；与任何公开可得的学区合同取消通知交叉核对
      - - AI 模块收入贡献与路线图
        - PowerBuddy 和其他 AI 模块单独披露的 ARR；对现有客户的 attach rate；每学区增量定价提升
        - AI 加购是多头情景的主要增长驱动；理解基线 ARR 归因，是验证 $1B+ 收入目标的关键
        - 如可得，向管理层索取 AI 模块 ARR 拆分；审阅产品级合同数据
    notes: 这五项要求是将有条件持有转为明确买入或减持的阻断项。按优先级列示；前两项必须先解决，另外三项才具有分析意义。
