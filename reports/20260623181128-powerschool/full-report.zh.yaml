  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分与规模测算方法
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的可服务市场横跨多个相互连接的 K-12 行政软件细分，而不是单一产品类别。核心细分是 Student Information
              System：每个公立学区都必须维护的关键任务软件，用于跟踪学生入学、出勤、成绩、排课和州强制合规报送。SIS 之上叠加 Learning Management
              Systems，用来连接课堂教学与学生记录；测评平台管理形成性和基准测试；特殊教育管理工具用于在 IDEA 下记录 Individualized Education Programs 和 Section 504
              plans；学区 HR 与财务软件补足行政后台。PowerSchool 在一个连接平台下横跨所有这些细分销售，因此市场边界比任何单一软件类别都更宽。现状替代方案包括传统本地部署 SIS
              系统、学区自建方案，以及只提供单一模块的点状解决方案供应商；PowerSchool 通过平台整合替代它们。

              美国 K-12 部门提供了具体的规模分母。National Center for Education Statistics 报告，2024-25 学年约有 19,183 个公立学区和 4,930
              万名在校学生，低于 2019 年的 5,080 万。CivicIQ 合同数据库显示，平均年度 SIS 合同约为每学区 $10,600，意味着美国公立学区仅 SIS 的支出下限约为 $203
              million——这个下限不含私立和 charter schools，也不含可显著扩大单客户收入的相邻模块。分析师对规模的估计因口径不同而差异很大。Mordor Intelligence 估计，全球全部教育
              SIS 市场 2025 年为 $15.44 billion，CAGR 为 14.6%；Global Growth Insights 采用更宽的 K-12 student management 口径，报告 2025
              年规模为 $41.43 billion，CAGR 为 8.74%。Apps Run the World 估计，全球 K-12 软件应用市场 2024 年为 $6.2 billion，到 2029 年增至 $8.4
              billion，其中 North America 约占 38%。Grand View Research 指出，North America 在 2022 年占全球 SIS 收入的 33.4%。$15 billion
              与 $41 billion 之间的差距来自地域范围、教育阶段覆盖和是否纳入非软件管理服务的差异；不做边界调整，两者都不能直接映射到 PowerSchool 的可服务市场。
