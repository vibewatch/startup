      - number: '7.2'
        title: 法律、监管与合规风险
        blocks:
          - type: paragraph
            body: >
              2024 年 12 月泄露、Naviance 第三方跟踪诉讼，以及 K-12 技术隐私执法趋势，共同让 PowerSchool 面临异常广泛且跨多个司法辖区的 法律和监管敞口。合并集体诉讼——MDL-3142，即
              In re PowerSchool Holdings, Inc. and PowerSchool Group, LLC Customer Security Breach
              Litigation，由加州南区联邦地区法院 Roger T. Benitez 法官审理——合并了 55 起联邦案件，代表学生、家长、 教师和学区主张过失、违约和不当得利。截至 2026 年 3
              月，原告扛过了驳回动议，隐私和不当得利主张进入实体审理。尚未宣布全球和解； 案件继续向潜在审判或和解会议推进。

              另一个具有先例意义的进展发生在 2026 年 3 月 18 日：S.D. Cal. 法院驳回 Bain Capital 的驳回动议，允许针对这家 PE 母公司的 帮助和教唆、过失、当然过失、不当得利和
              California 不正当竞争违法主张继续推进。法院认定，Bain 在收购前后对 PowerSchool 网络安全运营、人员决策和资本开支行使事实控制，包括指示 IT
              和网络安全职能离岸外包，而原告称这些安排恶化了泄露轨迹。这是已知首个 允许基于运营控制理论追究 PE 机构投资组合公司数据泄露潜在责任的联邦裁定，为投资者层面敞口创造了新颖且重大的先例。

              Naviance 平台诉讼达成 $17.25 million 和解，并于 2026 年 2 月 24 日提交至 Illinois 北区（Jorge Alonso 法官初步批准）； 受影响者为 10 million
              多名现任和前 Naviance 用户，他们指称 PowerSchool 在未获学生或家长同意的情况下嵌入 Heap Inc. 分析跟踪代码。 另一起泄露前隐私诉讼于 2024 年 5 月提交（Cherkin v.
              PowerSchool，N.D. Cal.），2025 年 3 月部分驳回动议未能完全胜诉，隐私侵扰和 不当得利主张继续推进。

              监管侧，North Carolina 总检察长 Jeff Jackson 于 2025 年 2 月 6 日宣布调查，影响近 4 million 名 North Carolinians，并于 2025 年 6 月向
              PowerSchool 发出正式 Civil Investigative Demand，要求披露网络安全措施、泄露根因和响应沟通。Canada 隐私专员于 2025 年 2 月启动平行调查。Ontario
              Information and Privacy Commissioner 于 2025 年 11 月发布最终结论，要求受影响 Ontario 机构 在六个月内证明安全合规。美国 Department of
              Education 在泄露后启动 FERPA 合规审查；截至 2026 年 6 月，尚未公开宣布正式执法行动， 但 FERPA 的执行机制——以联邦拨款为条件——意味着一旦 DOE
              进入正式程序，PowerSchool 将面临生存级敞口。Texas 提起本州总检察长诉讼， 指称 PowerSchool 未实施包括
              MFA、充分访问控制和加密在内的基本安全措施，尽管其营销材料声称安全标准最高。根据 FERPA 和大量州隐私法， PowerSchool 作为 school official
              数据托管方运营，受到严格数据使用限制和泄露通知义务约束；至少在一个司法辖区（26+ 州使用的 Student Data Privacy Consortium National DPA），PowerSchool
              被指违反合同 MFA 要求。
