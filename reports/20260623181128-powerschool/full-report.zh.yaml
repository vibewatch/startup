  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与订阅机制
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 运营一个 K-12 SaaS 平台，以年度可续约合同销售给学区、州级机构和国际教育主管部门。公司在 2024 年 10 月私有化前最后的公开披露显示，订阅与支持收入约占 2024 年 Q1
              季度收入的 90%，在当季 $185.0 million 总收入中达到 $166.9 million。2023 全年，公司报告总收入 $697.7 million，同比增长
              11%；年度经常性收入（ARR）——公司的核心运营 KPI——截至 2023 年 12 月 31 日达到 $701.5 million，同比增长 18%。到 2024 年 Q1，ARR 进一步升至 $720.3
              million，公司重申 2024 全年指引：总收入 $786 million 到 $792 million，调整后 EBITDA $268 million 到 $273
              million。收入确认主要来自多年订阅合同，并按年滚动：学区预付款，递延收入提供强现金流可见性。2024 年 Q2 资产负债表显示递延收入 $213.4 million，其中 97%
              预计在未来十二个月确认，验证了短久期、高可见性的收入画像。专业服务——主要是实施、上线、培训和迁移——构成剩余约 10% 收入，结构上利润率低于订阅。因此，收入结构高度偏向经常性订阅收入，这是 K-12 SaaS
              承销论点的核心质量信号。
