        - PowerSchool $720M ARR ÷ 18,000 家客户 ≈ $40K 平均值；套用到可触达学区数量
        - 低
        - 非独立来源；由公开 ARR 和客户数推断；包含国际收入
    notes: >-
      分析师估算相差超过 50 倍（$0.2B 至 $41B），因为口径不同：仅 SIS 对全套管理平台、仅美国对全球、K-12 对全教育阶段。PowerSchool 最站得住脚的 SAM 是北美 K-12
      全平台软件，按不同方法估算为 $1–2.4B。PowerSchool 的 $720M ARR 意味着在 $1–2.4B SAM 中渗透率约 30–72%，说明它已处在整合中市场的成熟位置，而不是绿地机会。
