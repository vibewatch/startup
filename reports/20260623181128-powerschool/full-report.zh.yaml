      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - MDL-3142 诉讼责任（SIS 数据泄露）
        - 法院命令的集体认证；最终和解或判决录入
        - 全球和解超过 $200 million，或判决超过 $100 million
        - 投资逻辑破裂——评估债务契约违约风险、资本充足性和 Bain 赔偿范围
      - - Bain PE 责任（2026 年 3 月裁定）
        - 证据开示阶段披露更多收购前或收购后降本，且加剧数据泄露
        - 法院认定 Bain 指示削减安全投入，与数据泄露损害存在直接因果关系
        - 投资逻辑破裂——PE 母公司财务敞口实质性损害 PowerSchool 资产负债表和治理
      - - DOE FERPA 执法行动
        - 教育部发出拟禁止参加联邦资助项目的正式通知
        - 任何 DOE 执法函或有条件拨款行动引用数据泄露或数据滥用
        - 投资逻辑破裂——联邦资金资格面临风险；18,000+ 学区客户承受合规压力，可能退出
      - - North Carolina AG 执法 / 多州 AG 联盟
        - NC AG 执法行动已立案；或另有 5 个以上州 AG 加入正式调查
        - NC AG 对 PowerSchool 提起民事或刑事行动；或多州和解要求超过 $50 million
        - 高风险——加快学区流失评估周期；大幅提高法律准备金要求
      - - SIS 市场份额侵蚀（竞争性流失）
        - 又一个州级采购从 PowerSchool 转向 Infinite Campus 或 Skyward
        - 第二个州级迁移公布（North Carolina 之后）；或 ARR 流失率超过每年 5%
        - 高风险——结构性削弱 SIS 市场领导地位论点；触发估值下行情景
      - - CEO / CISO / CLO 在活跃诉讼期离任
        - Pietri、Gay 或 Bisignano 任期未满 12 个月即宣布辞职或离任
        - MDL、州 AG 调查或 DOE 审查仍在进行期间，任何 C-suite 离任
        - 中等风险——监管与客户关系出现连续性风险；向交易对手释放内部不稳信号
