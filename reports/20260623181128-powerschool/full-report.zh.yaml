      - number: '2.3'
        title: 增长驱动、采用约束与负面市场证据
        blocks:
          - type: paragraph
            body: >-
              K-12 行政软件的结构性需求持久，并由监管锚定。联邦 IDEA 要求为全国约 14% 在校学生记录 Individualized Education Programs 和 Section 504
              plans，这创造了不随更广泛预算压力消失的合规支出下限。Every Student Succeeds Act 下的州和联邦问责要求，持续支撑对测评分析和 SIS 州报送集成的需求。数字化转型继续把 SIS
              推向云架构——Mordor Intelligence 估计，目前超过 63% 的 SIS 部署已是云端，而十年前传统本地部署仍占多数。PowerSchool 于 2024 年 1 月推出
              PowerBuddy，这是嵌入其 SIS、LMS 和测评模块、面向学生、教师、管理者和家长的生成式 AI 助手，为现有客户打开追加销售收入流，并提高平均合同价值。Indiana Department of
              Education 在 2024 年签下 PowerSchool 有史以来最大的 Special Programs 合同，说明合规和特殊教育细分的州级需求仍在增长。

              阻力同样实质。ESSER III 疫情救济于 2024 年 9 月 30 日到期，结束了约 $190 billion 的一次性 K-12 支出；这笔资金曾在 2020 到 2024 年加速 EdTech
              采用。Brookings Institution 估计，ESSER 到期使许多学区出现平均每名学生超过 $1,000 的单年削减，高贫困学区受冲击最大。McKinsey 将后 ESSER 环境形容为一场
              “perfect storm”，由联邦资金减少、入学人数下降和州收入放缓共同构成。公立学校在校人数已从 2019 年的 5,080 万降至 2024-25 年的 4,930
              万，压缩了学区用于资助技术合同的按学生计收入基础。后 ESSER 气候已经放慢 EdTech 净新增采用，并推动学区更谨慎审查续约。House Appropriations Committee 曾提议
              FY2026 将 Title I 削减 26%，这会进一步压缩学区预算；最终的 2026 年 Consolidated Appropriations Act 维持了大致与上一年相当的资金水平，提供了短期稳定，但在
              FY2027 拨款讨论中仍留下更深削减的前瞻风险。

              对 PowerSchool 而言，最实质的负面证据是 2024 年 12 月数据泄露，暴露了约 6,200 万名现任和前学生以及 950
              万名教师的记录——这是美国历史上已知最大的儿童数据泄露。PowerSchool 支付赎金后，攻击者又回头勒索单个学区，重新引发客户焦虑。K-12 Dive 和 NBC News 记录称，Future of
              Privacy Forum 因安全控制不足将 PowerSchool 从 Student Privacy Pledge 中移除。North Carolina 的 Lee County Board of
              Education 正式要求州总检察长对 PowerSchool 采取法律行动。多起集体诉讼已被提起。这次泄露构成直接市场约束，因为数据安全如今在 K-12 采购评估中位列首要因素，考虑替换 SIS
              的学区会把在位供应商的安全态势与功能和价格一起权衡。EdTech Magazine 报道，自 2018-19 年以来，每个学区使用的 EdTech 工具增加超过 225%；后 ESSER
              时期，安全与预算审查同步加码，这波激增面临快速回撤压力。
