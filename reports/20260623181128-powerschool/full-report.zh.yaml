      - number: '4.4'
        title: 负面信号与财务风险因素
        blocks:
          - type: paragraph
            body: >-
              交割后最重大的负面信号，是 2024 年 12 月数据泄露事件。攻击者使用被盗凭据进入 PowerSchool 的 PowerSource 客户支持门户，而该账户缺少多因素认证；攻击者外泄了北美 18,000
              多个学区中约 62 million 名学生和 10 million 名教师的记录。PowerSchool 支付赎金，以换取所谓的数据删除；后续事件证明删除并未完成，威胁行为者在 2025 年中
              重新出现，并用原始被盗数据勒索单个学区。该事件已经引发 55 起以上集体诉讼，并入加州南区 Benitez 法官审理的 多地区诉讼
              MDL-3142；原告主张过失、违约和不当得利，并寻求赔偿、禁令救济和信用监控。学区自身另有一宗大规模诉讼， 要求返还向 PowerSchool
              支付的费用，并赔偿泄露应对成本。综合赎金、数千万人两年信用监控、法律抗辩和潜在和解， 总财务敞口具有实质性，但公司未在任何公开的交割后文件中披露或估计。第二项财务风险来自 LBO 的高私人信贷债务： 按 2024
              年私人信贷利率，这一规模的 LBO 通常每年承担 $250 million 或更高利息，具体取决于杠杆与利差结构； 这会占到 PowerSchool LBO 前约 $230 million 调整后 EBITDA
              的相当一部分。高固定债务服务叠加尚未了结的 网络安全责任，使财务画像比 LBO 前公开指标显示的更受约束。
            claimRefs:
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
              - CI031
              - CI032
      - number: '4.5'
        title: 财务结论与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个 LBO 前经常性收入强、留存优秀、FCF 转化率高于平均水平的业务；但交割后公司转为私有，给承销 带来根本性不透明。PowerSchool 最后一个公开数据点，是 2024 年 8 月发布的
              Q2 2024 业绩：ARR 约 $720 million、 增长 18%，调整后 EBITDA 利润率接近 35%，NRR 为 107%。公司在 2024 年 6 月签署合并协议后暂停财务指引和业绩电话会，
              2024 年 10 月交割后未再发布财务报表。2026 年初，管理层和投资者会议材料提到，到 2026 年年收入达到 $1 billion
              或以上的目标；但这只是未经验证的公司说法，不是已披露财务结果。因此财务结论是：收购前业务质量强，收购后财务位置 高度不确定。LBO 后债务规模未披露、泄露相关责任上升、2024
              年中现金储备接近于零，三者叠加后，核心尽调问题不再是 收入质量，而是债务服务能力和诉讼准备金是否足够。任何在 2026 年承销 PowerSchool 的投资者或合作伙伴，都必须拿到
              交割后审计账目或管理账、私人信贷条款清单和契约、泄露诉讼和解敞口估计，以及过去 12 个月 FCF 桥，以判断债务服务后 还剩多少经营现金流。
