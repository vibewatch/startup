              PowerSchool 渗透了美国前 100 大学区中的 90 多个，并覆盖 90 多个国家的 6,000 万+学生；叠加 106.7%
              的净收入留存率，显示其深度嵌入工作流，能产生耐久的经常性收入。学区切换学生信息系统时面临很高的数据迁移摩擦，因此无论数据泄露余波如何，客户基础在结构上都具备黏性。
