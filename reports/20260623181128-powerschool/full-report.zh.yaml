        - SIS 到 ODS 的数据交换；州级报告互操作标准
        - Ed-Fi Alliance 认证；已验证 TX、GA、MN 学区实施
        - 认证有效至 2026 年 12 月（v4）/ 2027 年 6 月（v5）；需要重新认证
