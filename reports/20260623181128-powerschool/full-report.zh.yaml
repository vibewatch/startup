  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 K-12 连接操作系统
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 将产品供给置于 K-12 Connected Operating System 品牌之下，围绕三类影响组织：家庭连接、学生成就 和运营卓越。截至 2026 年 6
              月，产品组合覆盖八大产品家族。Student Information System（SIS）是基础模块， 为 90 多个国家、18,000 多个组织、超过 60 million
              名学生管理入学、出勤、排课、评分、州和联邦合规报告以及 家长沟通。SIS 数据层之上是 Schoology Learning Management System；这套 LMS 目前被 4,000 个组织、超过 7
              million 名学生使用，把课程、作业、测评和家庭沟通放在一个平台里。Assessment 模块以 Performance Matters 销售，服务 650 个组织和 500,000 名教师，提供含
              130,000 多道题的预置题库、对齐标准的测评，以及经 PowerBuddy 驱动的 AI 评分量规。Special Programs 模块覆盖 IEP、504、ELL、Gifted and Talented
              和服务记录流程， 面向 1,200 多个学区，报告支持 9.5 million 名学生，并在 2025 年完成 417,297 份表单。Naviance CCLR 平台服务 8 million 名学生，覆盖
              35% 的美国高中，提供大学、职业和生活准备工具，包括 AI 生成推荐信和新的基于工作的学习市场。 ERP Systems（eFinancePlus 及相关产品）为 250 多个学区提供财务、薪资和 HR
              管理。Connected Intelligence 提供托管 data-as-a-service 平台，把 SIS、LMS、ERP、测评和第三方数据集中起来，用于实时分析和纵向报告。 PowerBuddy
              是横跨所有产品家族的 AI 层；公司称，它把 AI 带到学区数据之上，而不是把数据搬到外部 AI 平台， 这一设计选择来自学生隐私要求。
