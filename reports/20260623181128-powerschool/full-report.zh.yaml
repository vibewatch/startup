        - Instructure 主要是 LMS 而非 SIS；受泄露后信任风险影响较小；KKR 交易在 PowerSchool 泄露前完成
      - - Frontline Education — 私有 K-12 HR SaaS
        - EV/Revenue（估计；无公开披露）
        - 估计 4-6x EV/Revenue，基于 K-12 SaaS 同业基准
        - 买方细分直接重叠；K-12 HR 和劳动力管理 SaaS；10,000+ 学区客户
        - 无公开财务；倍数为分析师估算；Frontline 缺少 PowerSchool 由 SIS 带动的广度
      - - Pluralsight — Vista Equity 2021 年 LBO
        - LBO 时 EV/ARR（$3.5B EV，ARR 约 $380M）
        - 约 9.2x EV/ARR
        - 企业 SaaS LBO 先例，Vista 同为投资者；证明高溢价买入论点可成立
