      - number: '4.2'
        title: 定价、单位经济性与公开牵引
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 采用报价制、按学区定价，随学生人数、所选模块和合同期限扩展。Civic IQ 基于截至 2026 年 4 月的政府采购记录做公开合同数据库研究，发现 54 个被跟踪的
              PowerSchool SIS 项目平均年度合同价值约为 $10,604。大型学区部署和覆盖 SIS、LMS、HR、特殊教育与分析的多模块合同，年度实际合同价值可从 $20,000 到 $600,000
              甚至更高。第三方评论网站的标价基准显示，核心 SIS 起价约为每名学生每年 $3，高级层级和附加模块会显著提高有效 ASP。截至 2024 年 Q1，净收入留存率为
              107%——这是最后一次公开披露的数字——确认交叉销售和追加销售带来的扩张足以超过任何流失，这也是 K-12 SaaS 的决定性单位经济信号。成本侧，2024 年 Q1–Q2 报告的 GAAP 毛利率平均为
              57% 到 60%，调整后毛利率（不含摊销、股权薪酬和重组）达到 69% 到 70%。二者差异很实质：GAAP 收入成本中相当一部分来自 PowerSchool 十年 M&A
              策略累积的已收购无形资产摊销。2023 全年自由现金流为 $168.4 million，对应 24% 的 FCF 利润率，对这个规模的软件公司而言很强。公开证据没有披露 LBO 后的实际利润率或
              FCF，因此最近数据点是历史锚，而不是当前运营指标。
