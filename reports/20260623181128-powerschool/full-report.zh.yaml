      - number: '3.3'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              学区采购团队最重视的购买标准包括核心 SIS 功能、LMS 集成、家长门户、HR 与 workforce management、特殊教育 IEP 合规、州报送和 AI 驱动分析。PowerSchool
              覆盖的类别多于任何单一竞争对手，但按单个类别深度看，并没有在哪一类领先。Infinite Campus 在特殊教育工作流和 standards-based grading 定制上普遍被评为更强。Skyward
              在包括 payroll 和 finance 的完整 ERP 集成上领先。Frontline Education 提供最深的 K-12 HR 套件，包括缺勤管理、招聘和专业发展工具，而 PowerSchool 的
              HR 附加模块只能部分复制。Instructure Canvas 在 K-12 LMS 市场约占 24%，产品被竞争学区描述为有更优的评分界面，并且与高等教育工作流衔接更强，因此在中大型学区对 Schoology
              构成可信挑战。Google Classroom 通过 Google Workspace for Education Fundamentals 免费提供，对包括 Schoology 在内的所有付费 LMS
              形成结构性价格压力，尤其是在 LMS 复杂度要求较低的小学阶段。Clever 的 SSO 和应用集成层已部署在约 70% 的美国学区，作为中立集成层削弱任何单一供应商的锁定利润。PowerSchool 的 AI
              建设，包括 PowerBuddy 以及 2025-2026 年嵌入全套产品的 agentic 行政功能，提供了短期差异化；但 Infinite Campus、Skyward 和 Frontline
              Education 都在积极开发竞争性的 AI 驱动工作流，压缩差异化窗口。所有主要 SIS 供应商定价都不透明，采用报价制；Civic IQ 合同数据是观察实际学区支出的最可靠公开窗口。
