  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              PowerSchool 于 1997 年创立于加州
              Folsom，至今总部仍设在当地。公司把使命表述为赋能教育者、管理者和家庭，为每一段学生旅程提供个性化教育保障。它最初是最早一批可通过网页访问的学生信息系统之一，如今已长成综合云平台，每年触达的学生数量超过大多数国家的
              K-12 在校人数。PowerSchool 将自己的产品定义为 K-12 Connected Operating
              System，把学生信息管理、学习管理、课程交付、测评、人力资源、人才管理、专业发展、特殊教育管理、数据分析、校务沟通、大学与职业准备整合进统一的数据架构。


              截至 2026 年 6 月，PowerSchool 已完全私有化。2024 年 10 月，Bain Capital 以每股 $22.80 完成收购，公司从纽约证券交易所退市，对应总企业价值约 $5.6
              billion。Vista Equity Partners 和 Onex Corporation 在 IPO 时期共同控制公司，交易后各自保留少数股权。公司继续作为独立实体运营，由 Bain
              持有多数股权。PowerSchool 的产品组合包括 Schoology Learning、Naviance CCLR 等获奖品牌，并服务于按学生人数计美国前 100 大学区中的 90 多个。其 AI 产品
              PowerBuddy 是一个由生成式 AI 驱动、面向学生、家长、教师、辅导员和管理者个性化配置的虚拟助手，代表公司最新一层产品创新，也是下一阶段增长的关键战略差异点。
