          - type: callout
            title: Bain Capital 的 PE 所有权带来定价压力与投资不足双重风险
            body: >-
              Bain Capital 以 $5.6 billion 收购，意味着退出倍数目标会推动 PowerSchool 管理层同时追求收入增长和利润率改善。在一个客户基础被俘获、合同多年且黏性高的 SaaS
              业务里，阻力最小的路径是续约涨价，而不是产品投资。如果 Bain 把利润率扩张置于产品质量之上，PowerSchool 可能在放大数据泄露造成的信任赤字的同时，提高 Infinite Campus 和
