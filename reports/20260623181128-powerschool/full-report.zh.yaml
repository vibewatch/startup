      - number: '7.4'
        title: 财务、LBO 债务与私募股权所有权风险
        blocks:
          - type: paragraph
            body: >
              Bain Capital 以 $5.6 billion 杠杆收购 PowerSchool，并于 2024 年 10 月 1 日交割，给公司套上了高倍数 PE 交易常见的财务风险结构：收购债务估计达到 $3.8
              billion 或更高，而私有化时公司过去 12 个月收入约 $741 million、调整后 EBITDA 约 $268–273 million。利息负担压住了可自由投入的空间，而 PowerSchool
              此时恰好面临史上最高的补救、法律和网络安全再投入需求。LBO 后财务数据完全私有；2024 年 10 月私有化后，PowerSchool 停止向 SEC 报告，截至 2026 年 6
              月，ARR、EBITDA、现金头寸或债务契约均无公开披露。信息不透明使外部无法独立评估财务契约合规、数据泄露带来的现金消耗，或债务到期跑道。

              数据泄露已经产生可量化的财务成本：受害者身份保护服务至少 $14 million、Lane 定罪案中法院判令的 $14.1 million 赔偿（回收不确定）、$17.25 million Naviance
              和解（2026 年 2 月），以及 MDL-3142 和多个州 AG 程序中的持续法律辩护费用。若 MDL 达成和解，参照类似 K-12 数据泄露先例和 6000
              万以上受影响个人，补救成本可能再增加数亿美元。Bain Capital 自身也有潜在责任敞口——2026 年 3 月裁定允许针对 Bain
              的索赔继续推进——这构成第二条财务风险通道，标准投资组合公司赔偿结构未必能完全隔离。法院已将 Bain 主导的交割后决策，包括至少 5% 的美国国内 IT
              裁员和网络安全离岸外包，列为协助与教唆责任基础；这些运营降本措施因此同时变成财务和法律风险。未披露债务规模、未量化泄露责任和 PE 所有权不透明叠加，构成重大承销盲区；任何投资者或交易对手若要评估
              PowerSchool 的财务韧性，都绕不开这一点。
