      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 2024 年 12 月 SIS 数据泄露是结构性信任赤字，不是过去事件
            body: >
              2024 年 12 月的数据泄露不是一个孤立的既往事件。6200 万学生和 950 万教师的数据已被外泄，且在删除视频失败后，永久留在原始威胁行为者网络及潜在其他方手中。针对单个学区的下游勒索至少持续到 2025
              年 5 月。儿童身份盗用风险贯穿终身，因为被盗的 Social Security number 和医疗数据不会过期。活跃的 MDL 诉讼、州 AG 调查和 DOE FERPA
              审查仍未关闭。投资者必须把它视为持续负债，而非沉没成本；在承销任何资本事件前，需要量化法律准备金、保险覆盖是否充足，以及学区合同续约中多年的声誉拖累。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: callout
            title: Bain Capital 协助与教唆裁定是新颖且重大的先例
            body: >
              2026 年 3 月 18 日，法院在 MDL-3142 中允许针对 Bain Capital 的索赔继续推进，这是已知首个基于运营控制理论，认定 PE
              母公司可能因投资组合公司数据泄露承担责任的联邦裁定。法院认为，Bain 在交割前后的行为——对网络安全资本开支拥有否决权、更换董事会、美国国内 IT
              裁员，以及安全职能离岸外包——可信地制造了数据泄露条件，或加剧了其发展。此类案件最终如何在财务上解决尚无先例；PE 层面的责任保险未必覆盖协助与教唆理论。任何针对 PowerSchool
              的投资尽调，都必须详细审查 Bain 的交割后指令、Bain 与 PowerSchool 之间的赔偿框架，以及 D&O 和网络责任保险是否足够。
            calloutType: risk
            claimRefs:
              - CR028
