      - number: '5.2'
        title: SIS、LMS、测评与特殊教育——核心产品深度
        blocks:
          - type: paragraph
            body: >-
              PowerSchool SIS 处理复杂 K-12 排课需求（分块课表、轮换课时和 A-B 日），按 NCES 和 CEDS 标准自动生成州和 联邦报告，并与 Schoology
              集成，实现实时成绩回传和作业管理。PowerTeacher Pro Gradebook 是嵌入 SIS、面向教师 的成绩册，支持基于标准的评分，并通过 Parent Portal 直接与家庭沟通。学区同时使用
              SIS 和 Schoology 时，自 2026 年 4 月版本起，学生出生日期数据会每晚从 SIS 同步到 Schoology；PowerBuddy 访问权限因此能采用更准确、 对齐 COPPA
              的年龄设置，无需手工管理用户档案。Schoology Learning 已交付 186 million 份作业，并促成 4 million 次讨论，体现其日常教学使用深度。PowerSchool
              Assessment（Performance Matters）靠预置精选题库、 生成式 AI 出题和 AI 量规评分形成差异化——教师可以在几分钟内创建对齐标准的测评，并批量获得开放回答题的自动评分。
              Special Programs 与四个州教育机构建立全州合作，通过 IEP、504、ELL、gifted 和服务记录流程服务 9.5 million 名学生；AI
              辅助文档起草和在线数字签名减少了对纸质表单的依赖。Special Programs 内的可定制工作流引擎，让学区 能按州内要求调整合规文件，同时不牺牲联邦 IDEA 合规精度。Schoology 在 G2（395
              条评论，2026 年）和 Capterra （487+ 条评论，2026 年 3 月）均获 4.4/5 评分；教师持续把它与 PowerSchool SIS 的实时成绩同步集成，列为主要差异点。
