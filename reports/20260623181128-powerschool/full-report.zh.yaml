      - number: '1.4'
        title: 规模、指标与产品覆盖
        blocks:
          - type: paragraph
            body: >
              PowerSchool 最近一批公开可得的财务数据覆盖 2023 财年，当时公司仍为上市公司。该年度总收入为 $697.7 million，同比增长 11%；订阅与支持收入达到 $600.2
              million，同比增长 10%。截至 2023 年 12 月 31 日，年度经常性收入（ARR）为 $701.5 million，同比增长 18%。净收入留存率为
              106.7%，说明现有客户群仍在扩大支出。2023 财年调整后 EBITDA 为 $231.9 million，利润率 33%，同比改善 18%。PowerSchool 报告 GAAP 净亏损 $39.1
              million，与承担收购相关债务的资本结构一致。全年自由现金流达到 $129.9 million，对应 19% 的自由现金流率。


              客户侧，公司支持 6,000 多万名学生和 18,000 多个客户，主要是学区、学校和州教育机构，覆盖 90 多个国家。按学生人数计，美国前 100 大学区中有 90 多个使用 PowerSchool
              产品。2023 年，公司完成约 2,000 笔交叉销售和新客户交易，包括 Los Angeles Unified School District、Miami-Dade Public Schools 和
              Newark Board of Education 等重要赢单。2023 年 10 月收购的 SchoolMessenger 向超过 63,000 所学校提供沟通解决方案。自 2024 年 10 月 Bain
              私有化以来，公司未再披露新的财务数据；2024 财年和 2025 财年业绩为私有信息，外部分析师无法获得。收入轨迹、客户规模和 ARR 增速构成了强基线，但数据泄露和 CEO
              更替为私有化后的增长阶段带来明显执行不确定性。
