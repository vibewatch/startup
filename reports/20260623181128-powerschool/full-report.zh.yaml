      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 多产品捆绑拆包是首要竞争威胁
            body: >-
              PowerSchool 最深的锁定并不来自 SIS 单品，而是多产品捆绑：同时运行 Schoology LMS、HR 模块和 Naviance counseling 的学区，在 SIS
              之外还要面对指数级更大的迁移范围。但同一套捆绑也制造了脆弱性：数据泄露后，学区正在积极评估 Canvas 作为 LMS、Frontline 作为 HR、以及其他 SIS
              供应商；这次泄露成为拆包讨论的政治催化剂，而此前黏性经济性一直压住这些讨论。这个 “bundle unraveling” 场景是 PowerSchool 近期竞争格局中严重度最高的风险。
            calloutType: risk
            claimRefs:
              - CP019
              - CP020
              - CP033
              - CP040
              - CP032
              - CP034
          - type: callout
            title: PowerSchool 数据泄露为 Infinite Campus 和 Skyward 打开多年窗口
            body: >-
              2024 年 12 月数据泄露没有触发即时大规模切换——SIS 迁移经济性阻止了这一点——但它从根本上改变了 school board 续约决策的政治环境。2025 到 2028
              年处于续约年份队列的学区，如今要面对董事会审查、家长倡议团体和州监管者的追问：为什么仍留在 PowerSchool 上。Infinite Campus 和 Skyward
              无需仅靠功能胜出，就能受益于这种审查：数据泄露让 “not PowerSchool” 成为有意义的采购信号。能够提供迁移支持、透明安全认证和可信数据泄露响应记录的竞争对手，有望在 2027
              年前拿下不成比例的续约胜利。
