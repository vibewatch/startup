              - CP033
              - CP042
      - number: '3.5'
        title: 护城河耐久性与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的护城河建立在四根支柱上：跨 18,000 多家机构的装机基础惯性、多产品交叉销售锁定、专有州报送合规配置，以及大规模聚合学生记录带来的数据网络效应。2024 年 12
              月数据泄露实质损害了这条护城河的信任维度：数据托管不是 SIS 价值主张的外围，而是核心。美国和加拿大的多起集体诉讼和监管调查，抬高了继续保留 PowerSchool 的合规和法律风险。PowerSchool
              支付赎金换取数据删除后数月，勒索尝试仍在继续，说明风险并未彻底解决，也进一步侵蚀学区信心。Bain Capital 于 2024 年 10 月以 $5.6 billion
              收购公司，隐含推动收入增长和利润率改善的压力，可能转化为定价变化，在价格敏感学区提高流失风险。如果 Ed-Fi 数据标准在州级大规模采用，可能通过更可迁移的学生记录 schema
              降低切换成本，不过采用仍不均衡。受云迁移和数字化转型强制要求推动，预计 SIS 市场到 2030 年代初将以 12% 到 14% 的 CAGR 增长，这意味着即便不直接抢走 PowerSchool
              客户，竞争对手也面对一个上升市场。PowerSchool 的 AI 驱动套件功能——PowerBuddy 以及 2025 和 2026 年推出的相关 agentic
              工具——是真实差异化；如果它们能在学区运营中产生可衡量的生产率提升，可能暂时拓宽护城河。近期最大的竞争风险，是数据泄露导致的信任赤字与 Bain 的增长要求叠加，在续约时形成定价压力；同时 Tyler
              Technologies 继续投资 Skyward，使其成为横跨 SIS 和财务层的可信全国性 ERP 替代方案。
