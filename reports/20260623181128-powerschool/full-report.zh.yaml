      - number: '7.5'
        title: 领导层、执行与客户信任风险
        blocks:
          - type: paragraph
            body: >
              PowerSchool 的 CEO 交接——Hardeep Gulati 离任，Antonio Pietri 于 2025 年 10 月 6
              日接任——发生在最糟糕的时点，带来执行风险：公司同时面对活跃的多地区诉讼、持续的州监管调查、北卡罗来纳州全州合同流失，以及需要高管长期投入修复的学区层面信任侵蚀。Pietri 在科技行业履历很强，曾在 Aspen
              Technology 带领公司持续增长，并在 2025 年初完成被 Emerson 收购。但他没有 K-12 教育行业经验；Gulati
              十多年积累的机构关系、监管熟悉度和教育场景中的利益相关方信誉，无法仅靠顾问角色转移。Gulati 转任高级顾问，边际上缓解了关键人风险，但在长期领导交接期内，学监和州教育部门层面的关键客户关系续约风险升高。

              Bain 所有权下的更广泛领导团队包括总裁兼 CFO Eric Shander、CTO Devendra Singh、首席产品官 Marcy Daniel、CISO Rich Gay 和首席法务官 Michael
              Bisignano。数据泄露善后使 CISO 角色具有战略关键性，但 CISO 能否有效发挥作用，取决于 Bain 层面对安全投资的支持——而同一条投资流，Bain 已通过收购后 IT 裁员压缩。PE
              所有权的降本指令，与重建客户信任所需的安全再投资之间存在脱节；这是结构性执行风险，任何单个高管任命都无法完全解决。

              数据泄露后的客户信任侵蚀很深，也会持续。K-12 Security Information Exchange 联合创始人 Doug Levin
              称，该事件「从根本上动摇」了学校系统对大型教育科技供应商的信任。学区在合同续约中要求增强安全条款；Civic IQ 对学校董事会会议的监测显示，2025 年已有数百个学区评估替代 SIS 供应商。SIS
              切换成本黏性很强——每个学区多年迁移要花费数十万美元——因此流失会渐进发生，而非突然爆发；但数据泄露触发的竞争评估管线，会在多年内压制 ARR。每一个大型学区转向 Infinite Campus 或
              Skyward，都不只是 ARR 流失，还会成为可见的标杆客户，加速相邻学区的竞品评估。打破投资假设的情形，是全州范围迁移出现连锁反应，在 PowerSchool 重建安全信誉和信任之前，结构性改变 SIS
              市场份额。
