  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 数据泄露与网络安全风险
        blocks:
          - type: paragraph
            body: >
              2024 年 12 月数据泄露，是 PowerSchool 近期历史中决定性的负面事件，并在投资论点的每个维度上制造复合风险。攻击始于 2024 年 8 月，当时威胁行为者拿到 PowerSchool
              分包商凭据，并用这些凭据访问 PowerSource，即 PowerSchool 内部客户支持门户。 2024 年 12 月 19 日至 12 月 28
              日期间，攻击者从数千个学区同时系统性导出学生和教师数据库记录。被盗数据包括全名、出生日期、 住址、社会安全号码、医疗和残障信息、个别化教育计划、纪律记录、成绩历史，以及与免费和减价午餐项目绑定的家庭财务数据。
              CrowdStrike 执行取证调查，未发现银行或信用卡信息受损证据，但确认两个核心 SIS 表——学生和教师记录——的数据被外泄。

              PowerSchool 于 2024 年 12 月 28 日发现泄露，当时攻击者发出约 $2.85 million 比特币勒索要求，并威胁若不支付赎金就全球公开 被盗数据。PowerSchool 于 2024 年
              12 月下旬支付赎金，并收到一段声称显示数据删除的视频。尽管付款，到 2025 年 5 月，同一威胁行为者 开始直接向美国和 Canada 的单个学区发送勒索要求——包括 Toronto District
              School Board（240,000 名学生，数据可追溯至 2009 年） 和多个 North Carolina
              学区——并附上数据样本，以证明删除视频造假。下游勒索活动明确证明，在教育行业泄露场景中，赎金付款并不能 可靠保证数据销毁。

              Matthew D. Lane 是来自 Massachusetts Worcester 的 Assumption University 19 岁大学生，2025 年 5 月承认四项联邦指控：
              网络勒索共谋、网络勒索、未经授权访问计算机和严重身份盗窃。美国地区法官 Margaret Guzman 于 2025 年 10 月 15 日判处 Lane 四年联邦监禁、三年监督释放，并责令支付 $14.1
              million 赔偿；检方承认，考虑被告情况，这一金额很可能无法全额收回。法院文件显示， Lane 至少与一名未具名共谋者合作；相关调查仍在进行。Ontario Information and Privacy
              Commissioner 于 2025 年 11 月发布正式结论， 认定 PowerSchool 缺少强制 MFA、远程维护访问始终开启、日志留存有限、发现延迟，均实质性加重了泄露严重性。PowerSchool
              的泄露后补救 包括约 $14 million 受害者身份保护成本、为所有 PowerSource 员工和承包商访问实施 MFA，以及部署基于时间的访问控制。

              结构性网络安全风险不止这一次事件。PowerSchool 的 SIS 平台持有超过 60 million 名学生的汇总记录，使其长期成为数据外泄和勒索的 高价值目标。该平台是集中式 K-12 数据库，被美国
              100 个最大学区中的 90 多个使用；这意味着一次成功的凭据攻陷，就可能让攻击者同时 在数千个学区大规模外泄数据。这种集中度风险，任何单一的泄露后加固计划都无法完全消除。Future of Privacy
              Forum 于 2025 年 2 月 13 日将 PowerSchool 从 Student Privacy Pledge 中移除，理由是未实施 MFA 直接违反承诺要求。泄露留下的声誉损害，
              将在多个合同周期里继续压制续约谈判、采购审查和竞争评估。
