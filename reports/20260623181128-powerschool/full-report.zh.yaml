              这次数据泄露不是一个已经受控的事件。它暴露了约 6,200 万名学生和 950 万名教师的敏感数据；攻击者已被定罪，但被盗数据仍未追回；多个州总检察长已启动调查；集体诉讼仍在进行；Future of
