      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 2024 年 12 月泄露是主导性的信任与产品风险
            body: >-
              2024 年 12 月数据泄露因 PowerSource 支持门户缺少 MFA 控制，暴露了 62 million 条学生记录，是最重大的产品层风险因素。
              泄露路径不是任何面向客户系统的产品缺陷，而是内部支持工具上的管理疏漏；这既令人稍感安心（产品本身没有漏洞）， 也令人警惕（公司自身运营安全失守）。泄露后补救措施已经落地，包括强制 MFA 和基于时间的访问控制；但
              PowerSchool 被 Future of Privacy Forum 从 Student Privacy Pledge 中移除，且州 AG 调查仍在继续，这会形成持续采购逆风， 尽调必须用泄露后 NRR
              数据量化其影响。
            calloutType: risk
            claimRefs:
              - CE023
              - CE024
              - CE026
              - CE029
          - type: callout
            title: 纵向整合深度与高转换成本构成核心护城河
            body: >-
              PowerSchool 能把 SIS 数据连接到 LMS、测评、特殊教育、大学准备、ERP 和分析，形成纯单点竞争对手没有同等广度就无法复制的 数据网络效应。Ed-Fi v4/v5 认证、OneRoster
              合规和 LTI Advantage 支持，让 PowerSchool 可与完整 edtech 生态互操作， 同时继续把 SIS
              作为权威数据源。多年合同、受训员工和深度州报告集成内嵌的转换成本，使替换极少发生——这一结构性特征 即使在泄露后环境中，也能部分保护 ARR 基础。
            calloutType: strength
            claimRefs:
              - CE016
              - CE017
              - CE018
              - CE001
          - type: callout
            title: PowerBuddy 是下一层增长，但带有未经审计的 AI 风险
            body: >-
              PowerBuddy 的「AI comes to data」设计，把 LLM 推理带到学区汇总数据上，而不是把学生数据导出到第三方 AI 服务； 这是隐私优先的差异化点，正面回应 K-12 采购 AI
              时的主要反对意见。2024 年 GESS Education Award 的 Best AI Product 验证了早期市场反馈。不过，底层 LLM 供应商未公开披露，内容安全过滤尚未独立审计，AI
              模块带来的增量 ARR 也未单独披露； 因此仅靠公开来源，无法判断 PowerBuddy 是否在推动有意义的增量收入，还是作为留存工具包含在基础订阅定价中。
