      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              PowerSchool 由 Greg Porter 于 1997 年创建。Porter 是一名计算机科学教师，看到了 K-12
              学校需要一个简单、可通过网页访问的系统来跟踪学生信息。此后公司多次易主，形成今天的机构股东结构。截至 2026 年 6 月，Antonio Pietri 担任 CEO，任命自 2025 年 10 月 6
              日生效。Pietri 接替 Hardeep Gulati；后者领导 PowerSchool 超过十年，经历 Vista-Onex 时代、2021 年 IPO、多次平台收购以及 Bain Capital
              私有化。Gulati 转任高级顾问，以支持交接期间的连续性。Pietri 拥有丰富的科技行业经验，此前在 2013 年至 2025 年初 Aspen Technology 被 Emerson 收购前担任总裁兼
              CEO。


              Bain 持有期间更广泛的领导团队包括：Eric Shander 担任总裁兼 CFO，Devendra Singh 担任 CTO，Marcy Daniel 担任首席产品官，Rich Gay
              担任首席信息安全官，Michael Bisignano 担任首席法务官。关键人物依赖是一个实质性风险：Gulati 十年任期把机构记忆集中在一名高管身上，而 Pietri 由 Bain Capital
              任命、并非内部晋升，说明新的多数股东正在为私募股权驱动的增长阶段重置管理模式。作为私营公司，PowerSchool 不再提交公开治理披露；董事会构成、投资者保留权利，以及 Bain 多数股权与
              Vista/Onex 少数股权的约束条款，均未公开。CEO 交接又发生在 2024 年 12 月数据泄露后的数月内，进一步放大执行不确定性。
