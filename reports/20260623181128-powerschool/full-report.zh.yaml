  - id: TV003
    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 核心假设
      - 示例 EV 区间（USD billion）
      - 概率信号
      - 关键下行触发因素
    rows:
      - - 多头（2028-2029 退出）
        - 数据泄露以 <$150M 和解；FY2025 NRR ≥106%；ARR 增长 13-15% 至约 $1.1B；EBITDA 利润率扩至 37-40%；以 6-7x ARR 退出
        - 6.6–7.7
        - 低到中等；需要三个独立未知同时解决
        - 任何数据泄露和解 >$300M、NRR 低于 103% 或债务覆盖低于 1.3x，都会压垮多头情景
      - - 基准（2028-2029 退出）
        - 数据泄露以 $150-300M 和解；FY2025 NRR 103-105%；ARR 增长 8-10% 至约 $900M；EBITDA 利润率 34-36%；以 5x ARR 退出
        - 4.0–4.5
        - 按当前证据平衡看最可能；股权回报从持平到小幅正回报不等，取决于股权支票规模
        - NRR 恶化至低于 102% 或数据泄露和解 >$400M，会下调为空头
      - - 空头（2028-2030 退出）
        - 数据泄露和解 >$400M；NRR 恶化至 95-100%；ARR 停滞在 $750-800M；EBITDA 利润率压缩至 28-32%；以 3-4x ARR 退出
        - 2.3–3.2
        - 有实质风险；数据泄露和债务同时不利，且目前都不透明
        - 契约违约或无法再融资私募信贷工具，会触发困境情景
      - - 投资含义
        - 风险调整后 EV 按概率加权中点约为 $3.8-4.5B，低于 $5.6B 入场价
        - 概率加权
        - 入场定价偏高；需要多头情景落地，股权回报才会强
        - 默认继续研究；价格敏感度高，且下行不对称
    notes: EV 区间是分析师仅根据可比交易倍数和公开证据推导的估算。没有管理层指引或交割后经审计财务可用。
