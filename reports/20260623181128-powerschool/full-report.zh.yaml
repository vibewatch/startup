      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 在 2026-2030 年持有窗口的牛市情景，需要三件事同时跑通。第一，2024 年 12 月数据泄露带来的总财务责任低于 $100 million（赎金、监测和温和的 MDL
              和解合计），学区客户按历史水平续约，107% NRR 保持或提升，PowerBuddy AI 的追加销售抵消数据泄露后的信任折扣。第二，LBO 后债务可服务——也就是交割时总债务约 $3 billion
              或更低，综合利率接近 8-9%，在 2026 年按公司 $1 billion 收入目标、EBITDA run rate 接近 $300 million 的改善基础上，年利息支出约 $240-270
              million。第三，Bain Capital 执行国际扩张和 AI 货币化假设，ARR 年增 12-15%，在 3-4 年退出时达到 $1.1-1.3 billion ARR 基数，从而允许二级出售或
              IPO，以 5-7x ARR 退出，隐含 $5.5-9.1 billion 企业价值和强劲股权回报。

              基准情景假设执行中等：数据泄露诉讼在 2026-2027 年以 $150-300 million 区间和解，NRR 在泄露后降至 103-105%，收入每年增长 8-10%，退出时约 $850-900
              million，调整后 EBITDA 利润率小幅改善至 36-38%。以 5x EV/Revenue 退出，五年后企业价值约 $4.25-4.5 billion，低于 $5.6 billion
              进入价格；这意味着除非交易使用大量杠杆、降低股权出资，否则股权回报温和甚至持平。基于当前公开证据，这是最可能的情景，对股权层来说结果平庸到尚可。

              熊市情景包括：数据泄露和解超过 $500 million；学区要求让利或转向 Infinite Campus 和 Skyward，导致 NRR 明显恶化至 95-100%；ESSER 预算压力减少新赢单；LBO
              后债务覆盖率恶化到接近困境水平。在该情景下，以 $700-800 million ARR 基数按 3-4x 收入退出，隐含 EV 为 $2.1-3.2 billion，远低于 $5.6 billion
              进入价格，会抹去相当部分股权并损害私募信贷贷款人的本金。该情景值得重视，因为所有关键下行变量——数据泄露和解、泄露后 NRR、预算压力、债务条款——目前都不透明，且每一项都可能显著转负。
