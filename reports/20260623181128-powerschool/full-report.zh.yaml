  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资假设、进入估值与可比背景
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的核心投资命题由三根相互强化的支柱支撑：市场主导地位、黏性经常性收入，以及在非可选 K-12 支出类别中持久的切换成本护城河。市场端，公司服务 90 多个国家的 18,000
              多个学区，并占据美国 K-12 学生信息系统实施约 23% 份额，接近第二名的 2.5 倍。收入端，截至 2024 年 Q1 最后披露的 ARR 为 $720.3 million，同比增长
              18%，净收入留存率保持在 107%，说明存量客户扩张支出快于客户流失。经济性端，私有化融资套上之前，33-35% 的调整后 EBITDA 利润率，以及 FY2023 $168.4 million
              自由现金流（24% FCF 利润率），显示这是一门资本效率较高的业务。

              Bain Capital 以每股 $22.80、较未受影响股价溢价 37% 收购，交易额 $5.6 billion；折算约为 2024 年 Q1 $720 million ARR run rate 的
              7.8x，也约为 2024 年中 $741 million 过去 12 个月收入的 7.6x。作为参照，最接近的上市政府和教育 SaaS 可比公司 Tyler Technologies，2026 年 6 月约以
              4.7-5.0x 远期收入交易。Instructure 于 2024 年 7 月被 KKR 以约 7.0x EV/Revenue 私有化，是更直接的 EdTech 私有化先例；它说明 Bain 为关键任务
              K-12 SaaS 平台支付的价格接近可辩护区间高端。FE International 2026 年 EdTech M&A 分析给出的优质订阅资产行业中位数约为 7.8x EV/Revenue，因此
              PowerSchool 的进入价格对顶级平台来说与市场一致，但若任何投资假设组成部分表现不及预期，安全边际有限。

              反命题集中在交割后三项不利变化。第一，2024 年 12 月数据泄露暴露了 6200 万学生和 1000 万教师记录，引发 MDL-3142 集体诉讼合并、州总检察长调查、赎金支付，并导致公司被 Future
              of Privacy Forum 的 Student Privacy Pledge 移除。第二，来自 Ares、HPS、Blackstone、Blue Owl、Sixth Street 和 Golub
              Capital 的私募信贷 LBO 融资，在估计 $3-4 billion 债务规模上，结构上很可能带来每年 $200-350 million 的利息支出；若落在低端，也会吃掉大部分甚至全部 LBO 前调整后
              EBITDA。第三，ESSER 资金悬崖在 2024 年 9 月结束了约 $190 billion 疫情期 K-12 救助资金，持续给学区预算施压，可能压低 2025-2026 年扩张收入和新赢单。
