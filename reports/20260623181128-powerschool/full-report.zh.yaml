      - number: '3.4'
        title: 切换成本、锁定与多归属
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 最耐久的竞争优势，是替换其 SIS
              时的结构性摩擦。典型迁移项目需要为覆盖入学、出勤、成绩、成绩单和纪律记录的多年学生记录做数据抽取和验证；重建与交通、餐饮服务、测评和沟通工具的数十个定制集成；重新培训每位教师、管理者和家长门户用户；并承担通常为三到七年的多年合同提前终止罚金。Civic
              IQ 合同数据库记录了不同规模学区数十笔 PowerSchool SIS 续约，反映大多数学区 IT 管理者默认续约而非替换。多归属——同时运行两个 SIS
              平台——在运营上不可行，因为权威入学和出勤记录必须驻留在单一记录系统中。即便数据泄露后对 PowerSchool 明显不满的学区，也受合同时间点和 IT
              带宽约束，意味着有意义的流失会集中在续约年份队列。PowerSchool 的多产品捆绑经济性进一步加深锁定：在 SIS 之上采用 Schoology LMS、HR 模块和 Naviance counseling
              的学区，迁移范围比只用 SIS 的客户呈指数级扩大。2024 年 12 月数据泄露没有实质改变这些切换成本机制，但它改变了 school boards 和 superintendents
              的政治算计：续约时，他们如今面临家长压力，必须证明供应商问责，从而创造了事件前不存在的新一层声誉切换成本。
            claimRefs:
