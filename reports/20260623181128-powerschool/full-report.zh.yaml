companyProfile:
  summary: >-
    PowerSchool 是一家位于加州 Folsom 的教育软件公司，成立于 1997 年，销售覆盖学生信息、课堂与测评流程、特殊项目、人才与 HR、校务沟通、分析、大学与职业准备的广泛 K-12 记录系统。私有化前，公司规模已超过
    18,000 个客户组织，覆盖 90 多个国家的 6,000 多万名学生；PowerSchool 的 SIS 平台是核心锚点，带动 Schoology、Naviance、PowerBuddy 等相邻模块的交叉销售。Bain
    Capital 于 2024 年 10 月完成 $5.6 billion 私有化收购，投资者只能在披露窗口大幅变窄的情况下评估这个高质量垂直 SaaS 资产，同时公司又刚吸收了美国 K-12 领域已知最大的一次学生数据泄露。
