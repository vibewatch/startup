      - number: '6.5'
        title: 扩张经济学与集中度风险
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的扩张模型围绕 K-12 Connected Operating System 论点搭建：一个购买 SIS 的学区，可以继续加 Schoology、 Naviance、分析、HR
              和人才，再加 AI 层——每个续约周期都是一次增销机会。CivicIQ 数据显示，续约合同平均 $24,939， 初始 SIS 合同为 $10,604，溢价 135%，验证既有客户会随着时间买更多。收入层面的
              107% NRR 确认，装机基础中的扩张跑赢流失。 PowerBuddy AI 助手是最新扩张驱动，目前作为 Schoology 内的高级模块部署，在既有 LMS 订阅之上创造新的收入层。

              集中度风险真实存在，但较为分散。没有单个学区贡献实质性收入份额——18,000 多个客户的装机基础分布在美国公立学区、特许学校、 私立学校和国际主管部门。不过，全州合同（州机构为所有学区标准化采用
              PowerSchool）形成更高影响的集中度：North Carolina 离开时，从 PowerSchool 账面上移走了一个全州 SIS 合同和配套教育工作者 HR 模块。公司在 North Carolina
              保留 NCEES 教育工作者评价和申请人跟踪的短期延期，但核心 SIS 关系已经失去，影响全州数十万学生。Canada 是另一块集中度表面，原因是泄露后 Canada 特定勒索余波；Toronto
              District School Board、Peel District School Board、Calgary Board of Education
              均被点名为受害者。泄露后合同重新谈判正在把杠杆推向学区：买方现在要求赔偿条款、强制 MFA 证明、SOC 2 Type 2 报告和 泄露通知 SLA，而这些在大多数 2024 年前合同中并不存在。
