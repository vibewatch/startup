      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: IDEA 合规强制要求创造非可选收入下限
            body: >-
              联邦 IDEA 要求每个学区为约 14% 在校学生记录 IEP 和 Section 504 plans，形成穿越预算周期的非可选软件支出。PowerSchool 的 Special Programs 平台——由
              2024 年与 Indiana DOE 签下的有史以来最大州级交易锚定——正落在这个受保护支出类别里。不同于后 ESSER 时期面临取消风险的可选 EdTech 工具，IDEA 合规文档是法律义务。这让
              PowerSchool ARR 中相当一部分免受后 ESSER 预算压缩的直接冲击，而这股压力正在挤压相邻 EdTech 供应商的增长。
            calloutType: strength
            claimRefs:
              - CM019
              - CM030
          - type: callout
            title: 2024 年 12 月数据泄露到 2026 年仍是实质市场约束
            body: >-
              2024 年 12 月数据泄露暴露了 6,200 万条学生记录和 950 万条教师记录，是美国历史上已知最大的儿童数据泄露，并直接削弱 PowerSchool
              在采购评估中的市场地位，因为数据安全如今是最高评分因素。攻击者在赎金支付后又回头勒索单个学区，使声誉损害超出单一事件。Future of Privacy Forum
              除名、州总检察长问询和集体诉讼，给现有客户带来法律和合同审查义务。2026 年评估 SIS 替换的学区会把这次泄露放在显著位置。严重性还被一个事实放大：PowerSchool
              的产品是关键任务系统，存放的是学区持有的最敏感数据。
