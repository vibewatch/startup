      - number: '6.4'
        title: 留存、耐久性与泄露后动态
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 泄露前留存指标位居 EdTech SaaS 前列。Q1 2024 的 107% NRR 反映出多年扩张模式——学区在续约周期中增加模块， 而非流失；CivicIQ 约 95%
              总续约率估计也确认订阅基础极其黏。结构性原因是转换成本高：SIS 或 LMS 迁移需要多年规划、 重配州报告、重新培训员工和迁移数据。以 North Carolina 从 PowerSchool 转向
              Infinite Campus 为例，平均迁移仅数据转移 和删除就需要一份 $415,000 专项合同；若没有强制事件，多数学区不会自愿承担这一成本。

              2024 年 12 月泄露，正是部分客户的强制事件。威胁行为者使用被攻陷凭据，进入缺少多因素认证的 PowerSchool PowerSource 客户支持门户，在 18,000 个学区客户基础中外泄了约 62
              million 名学生和 9.5 million 名教师的记录——这是历史上已知最大的 K-12 数据暴露。PowerSchool 向威胁行为者付款以删除数据，但到 2025 年 5
              月，同一批被盗数据被用于直接勒索美国和 Canada 的单个学区，证明赎金支付并未带来真实删除。一名 Massachusetts 男子 Matthew Lane（19 岁）承认四项联邦指控。 Future of
              Privacy Forum 于 2025 年 2 月将 PowerSchool 从 Student Privacy Pledge 中移除。North Carolina 总检察长发出民事调查要求，多起针对
              PowerSchool 和 Bain Capital 的集体诉讼也已提交。

              North Carolina 的反应是最具后果的留存事件。该州切换至 Infinite Campus 的决定早于泄露（合同于 2023 年 11 月授予）， 但泄露加速了所有时间线。所有 NC 公立学校 PSU
              已在 2025 年 7 月 1 日前完成迁移。独立评论数据——G2：742 条评论为 4.2/5， Capterra：181 条评论为
              4.3/5——显示活跃用户总体满意度仍为正；但开放文本评论持续指出支持响应时间和可用性复杂度问题， 这些主题早于泄露存在，如今又叠加了学区更严格的安全审查。
