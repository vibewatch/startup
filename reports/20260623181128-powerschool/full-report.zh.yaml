  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: standard
    summary: PowerSchool 的收入基数明显落在全球 SIS 市场边界之内。宽口径分析师估算高出可服务的北美 K-12 平台市场 10 到 50 倍，取决于口径；要准确界定 TAM，必须采用自下而上的边界逻辑。
    data:
      nodes:
        - label: 全球 K-12 SIS 宽口径市场：约 $41B（2025）
          detail: Global Growth Insights 估算，涵盖全球所有 K-12 学生管理平台和服务；单位为 USD billions。
          tone: neutral
        - label: 全球全教育 SIS 市场：约 $15B（2025）
          detail: Mordor Intelligence 估算，涵盖全球 K-12 和高等教育 SIS；单位为 USD billions。
          tone: neutral
        - label: 北美 K-12 平台软件 SAM：约 $1–$2.4B
          detail: 由 Apps Run the World 北美份额（约 38% × $6.2B）和自下而上的全平台 ACV 推导；单位为 USD billions。
          tone: positive
        - label: PowerSchool ARR（当前收入）：约 $720M（2024）
          detail: 2024 年 10-Q 文件中最后报告的 ARR；约占估计北美 SAM 的 30–72%；单位为 USD millions。
          tone: positive
    approximationNotes: >-
      这是一组视角堆叠，而非严格的 TAM-SAM-SOM 级联，因为分析师估算衡量的边界口径不同。北美 SAM 是一个推导估计，结合 Apps Run the World
      全球数据和地区份额数据；没有任何单一分析师来源直接报告。金字塔展示了标题式 TAM 叙事与 PowerSchool 实际收入足迹之间的差距。
