figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: PowerSchool 的公开记录从 1997 年创立基于网页的 SIS 开始，经历四次所有权更替、2021 年 IPO 和 2024 年 Bain 私有化；2024 年 12 月数据泄露是最主要的负面拐点。
    data:
      items:
        - date: '1997'
          label: 创立于 Folsom, CA
          detail: Greg Porter 创建第一个基于网页的 K-12 学生信息系统。
          tone: positive
        - date: '2001'
          label: Apple 收购
          detail: Apple 收购 PowerSchool；全国 K-12 渗透率提升。
          tone: neutral
        - date: '2006'
          label: Pearson 收购
          detail: Pearson 从 Apple 手中买下 PowerSchool；由全球教育出版商持有。
          tone: neutral
        - date: 2015-06
          label: Vista Equity $350M 收购
          detail: 私募股权从 Pearson 手中接过 PowerSchool；由 SIS 牵引的平台整合开始。
          tone: positive
        - date: 2018-04
          label: Onex 共同收购与 PeopleAdmin
          detail: Onex 加入，成为 50% 共同所有者；PowerSchool 收购 K-12 HR / 人才平台。
          tone: positive
        - date: '2021-07-28'
          label: NYSE IPO (PWSC)
          detail: PowerSchool 通过 IPO 融资约 $711M；Vista 和 Onex 保留控制权。
          tone: positive
        - date: '2023-09-29'
          label: SchoolMessenger 收购（$300M）
          detail: 面向 63,000+ 所学校的通信平台加入 Connected Operating System。
          tone: positive
        - date: '2024-06-07'
          label: Bain Capital 宣布收购（$5.6B）
          detail: 较未受影响股价溢价 37%；宣布的最大 EdTech 私有化交易。
          tone: positive
        - date: '2024-10-01'
          label: Bain 收购完成；NYSE 退市
          detail: PowerSchool 完全私有化；Vista 和 Onex 保留少数股权。
          tone: neutral
        - date: 2024-12
          label: 数据泄露——6200 万学生受影响
          detail: 凭证被盗；缺少 MFA；美国史上已知最大 K-12 数据泄露。
          tone: negative
        - date: '2025-02-13'
          label: FPF 将其移出 Student Privacy Pledge
          detail: MFA 失效违反承诺；披露后隐私领域采取负面行动。
          tone: negative
        - date: '2025-07-08'
          label: Antonio Pietri 宣布出任 CEO
          detail: Hardeep Gulati 在任 10+ 年后交接退出；Bain 支持的 CEO 继任。
          tone: warning
        - date: '2025-09-03'
          label: Texas AG 起诉 PowerSchool
          detail: 首个州 AG 诉讼；指控安全声明具有欺骗性；寻求罚款和赔偿。
          tone: negative
        - date: '2025-10-14'
          label: 黑客判刑 4 年；赔偿 $14.1M
          detail: Matthew Lane 被定罪；数据无法追回；学生面临终身身份盗窃风险。
          tone: negative
