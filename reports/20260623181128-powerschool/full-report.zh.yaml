      - number: '5.3'
        title: 技术架构与集成生态
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的技术栈是托管在主要云服务商上的云原生 SaaS 架构，SIS 产品同时提供云托管和本地部署配置。集成层围绕 已发布的开放标准搭建：Ed-Fi（Data Standard v4 和
              v5）、OneRoster（v1.1/1.2 REST 和 CSV）、LTI Advantage （v1.3，含用于深度链接和成绩回传的 NRPS），以及用于单点登录的 SAML/OAuth
              2.0。PowerSchool 的 SIS 持有 Ed-Fi Student Information Systems API 的有效认证，覆盖 Data Standard v4（有效至 2026 年 12 月
              12 日） 和 Data Standard v5（有效至 2027 年 6 月 5 日），并在 Texas、Georgia 和 Minnesota 学区有已验证实施。 PowerSchool
              eSchoolPlus SIS 持有有效至 2027 年 6 月的 v5 认证。API-first 架构让第三方供应商可通过已发布的 REST 端点接入，并用 OAuth 2.0 认证；截至 2026 年 6
              月，GitHub 上有 50 多个公开代码库用 Node.js、PHP、 Python 和 Svelte 实现 PowerSchool API wrapper，最近更新的 Node.js 库在 2026 年 1
              月推送，PHP 包在 2026 年 3 月更新，显示第三方开发者生态仍活跃。Connected Intelligence 作为 data-as-a-service 层，把来自 SIS、LMS、测评、HR
              和第三方系统的数据整合进托管云数据平台，提供实时仪表盘、满足州 / 联邦纵向报告要求的历史归档， 以及支持通过 PowerBuddy 自然语言查询的 AI-ready 数据层。Analytics &
              Insights 平台（原 Unified Insights） 于 2026 年 5 月发布 26.3.0.0 版本，带来重新设计的 MTSS 干预管理、更快的 Intervention Bank
              加载、从图表快速录入分数， 以及干预提醒的 beta 邮件通知。
