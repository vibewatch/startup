      - number: '3.2'
        title: 直接 SIS 与 ERP 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Infinite Campus 和 Skyward 是替换 PowerSchool SIS 最可信的两个直接选择，但战略画像明显不同。Infinite Campus 成立于 1993 年，总部位于
              Minnesota 州 Blaine，只服务 K-12 市场。其近 3,000 个学区客户每年平均付费 $19,000 到 $44,000——显著高于 Civic IQ 合同数据库显示的 PowerSchool
              $10,604 平均值——说明其每学区实施范围更深、收入模型更黏且价值更高。Infinite Campus 在特殊教育集成 IEP 模块和 standards-based grading
              上尤其强，正是一些学区表达对 PowerSchool 不满的领域。数据泄露后，Infinite Campus 和 Skyward 都报告 RFP 咨询增加，原因是学区重新评估供应商风险。Skyward 自
              1999 年起由 Tyler Technologies（NYSE: TYL）拥有，服务超过 2,000 个学区，集中在 Texas——当地有 270 多个学区依赖它——以及 Midwest。Tyler
              Technologies 的资产负债表给 Skyward 提供了持续投资能力，并让其接入覆盖财务和许可的更广泛公共部门软件组合。Skyward 的差异点是完整 ERP 范围，覆盖 SIS、HR、payroll 和
              finance，而不是纯 SIS 深度，因此对希望用单一供应商同时覆盖学业和业务行政的学区有吸引力。Focus School Software 是一个较新的进入者，随着 Aeries 客户寻找替代方案，它在
              California 获得进展：Apple Valley Unified School District 选择 Focus 替代 Aeries，用于 2026-2027 年实施。Blackbaud 服务独立和私立
              K-12 学校，提供集成 SIS、LMS、招生和筹款平台（Raiser's Edge NXT），这是公立学区 SIS 供应商难以真正复制的范围。PowerSchool 跨越 SIS、Schoology
              LMS、HR 模块、分析和 Naviance counseling 的多产品宽度，让它区别于任何单层竞争对手。
