        - 在 SIS 与 LMS / 第三方工具之间同步花名册
        - 1EdTech 标准；约 70% 的 LMS 供应商支持 OneRoster
        - 面向旧系统兼容的 CSV 批处理选项会降低实时数据准确性
      - - LTI Advantage（v1.3 / NRPS 工具互操作）
        - Schoology 内第三方工具的 SSO、深度链接、成绩回传
        - 1EdTech LTI 标准；工具必须实现 key / nonce 管理
        - 工具供应商采用程度不一；部分工具仍停留在 LTI 1.1，需要回退路径
      - - OAuth 2.0 / SAML SSO
        - API 访问认证，以及 PowerSchool 各产品间单点登录
        - 身份提供方（学区 LDAP / Azure AD / Google Workspace）
        - 学区管理的身份质量参差不齐；仅密码访问促成了 2024 年泄露
      - - PowerBuddy AI 引擎（跨平台）
        - 面向学生、教师、家长、管理员、顾问的生成式 AI 助手
        - LLM 提供方未公开披露；采用「AI 走向数据」架构
        - AI 模型准确性、偏差、内容安全过滤未经独立审计
      - - Connected Intelligence（DaaS）
        - 托管云数据平台，用于跨系统分析、归档、AI 就绪
        - 底层云数据仓库（提供方未披露）；由 PowerSchool 管理
        - 托管数据层依赖单一供应商；切换时迁移工作量大
      - - PowerSource 支持门户
        - 为客户 SIS 环境提供远程支持和故障排查
        - PowerSchool 运营的门户，内部工程师和分包商可访问
        - 2024 年 12 月泄露的攻击向量；泄露后已要求 MFA
      - - 第三方开发者生态
        - 独立开发者构建的 API 封装、插件和集成
        - GitHub 托管的 Node.js、PHP、Python、Svelte 开源项目（50+ 个 repo）
        - 社区维护；无 SLA；各项目更新节奏不一
    notes: 架构描述来自官方产品页、Ed-Fi 认证记录、GitHub topics 页面和 Schoology 发布说明。PowerBuddy 的 LLM 提供方未公开披露。除「主要云服务商」外，云基础设施提供方未获官方确认。
