  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 数据泄露和解或诉讼准备金披露
        - 披露的和解或准备金超过 $400M，或禁令救济要求重大运营调整
        - 直接削弱可用于偿债的 FCF；与利息负担叠加，形成 EBITDA 覆盖风险；可能加快客户转向竞争对手
        - 从有条件持有下调至减持 / 避免；向 Bain 索取更新后的债务覆盖率
      - - 泄露后 NRR 恶化
        - FY2025 NRR 连续两个报告期确认低于 100%
        - 打破 SaaS 质量的核心论点；ARR 增长反转会降低退出倍数预期，并可能触发契约测试
        - 立即下调至避免；将 100% NRR 设为持有的最低硬底线
      - - LBO 后 EBITDA 覆盖违约
        - 过去十二个月调整后口径的利息覆盖率低于 1.0x，或报告契约违约
        - 债务困境风险落地；私募信贷出借人可能施加运营限制或加速到期；股权价值承压
        - 立即避免；按困境公司情景处理，需要重组分析
      - - K-12 预算恶化
        - 受入学人数下降和 ESSER 断崖驱动，美国公立 K-12 生均支出连续两年实际下降超过 5%
        - 软件采购可用预算减少，销售周期拉长，财务承压学区的流失增加
        - 减持并监测；触发对续约管线和新客户订单速度的强化尽调
      - - CEO 或关键领导层离任
        - CEO Pietri 在 2027 年 10 月前离任，或 CTO、CFO 离任且未宣布继任者
        - 执行风险显著上升；18 个月内第二次领导层动荡，显示 Bain 所有权模式下治理不稳
        - 升级尽调；战略方向和继任者清晰前维持持有
    notes: 只要可能，阈值都基于证据。NRR、EBITDA 覆盖和和解阈值来自可比 SaaS 困境案例及 LBO 前财务画像。
