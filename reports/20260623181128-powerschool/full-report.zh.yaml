      - number: '8.2'
        title: 可比公司分析与交易先例
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 的可比集合横跨上市政府技术与教育软件平台、近期 EdTech 私有化交易，以及更广泛的 SaaS 市场，用来锚定在 PowerSchool 收入规模和利润率画像下，哪些倍数区间站得住。

              Tyler Technologies（NYSE: TYL）是最直接可比的上市公司。Tyler 提供关键任务政府和 K-12 SaaS，包括在 2,000 多个学区与 PowerSchool SIS 直接竞争的
              Skyward。Tyler 2026 年 6 月指标显示，TTM 收入约 $2.38 billion、企业价值接近 $12 billion、EV/Revenue 约 4.7-5.0x、EBITDA 利润率
              21%、FCF 收益率约 27%。Tyler 的 EV/Revenue 低于 PowerSchool 的 LBO 进入倍数，反映 Tyler 规模更大、收入在政府垂直领域更多元，以及 2022-2026 年
              GovTech SaaS 所承受的倍数压缩。PowerSchool 纯 K-12 的溢价可部分支撑其高于 Tyler 的倍数，但不足以完全解释 7.8x ARR 进入倍数隐含的全部差距。

              Instructure Holdings 于 2024 年 7 月被 KKR 私有化，企业价值接近 $4.4 billion，对应 FY2024 收入约 $590-634 million，隐含交易倍数约
              6.9-7.0x 收入。这是衡量规模最直接的 EdTech 私有化先例。Instructure 收入规模小于 PowerSchool，覆盖 K-12 和高等教育，历史毛利率 67-69%、FCF 利润率
              20-30%，与 PowerSchool 大体相近。Instructure 交易说明，市场愿意为高质量、留存强的 EdTech SaaS 平台支付约 7x。PowerSchool 7.6-7.8x
              的进入倍数较该先例有小幅溢价，考虑到其规模更大、产品套件更深、SIS 市场地位占优，这一溢价可被一定程度辩护。

              Aventis Advisors 2026 SaaS M&A 分析和 Finerva EdTech 2025 估值倍数报告都指出，具备持久经常性收入且 NRR 高于 100% 的高质量 SaaS
              企业，在交易时会获得估值溢价；但只有在持有期内增长和留存守住，退出时才能兑现这份溢价。Finerva 2024 年 Q4 数据显示，上市 EdTech 公司 EV/Revenue 中位数仅为
              1.6x，反映其中有大量质量较低、偏消费者业务的公司；而优质 K-12 机构 SaaS 子行业可获得 5-8x 区间倍数，Tyler 和 Instructure 即为例证。关键在于，Aventis
              分析提示，2026 年的优质倍数流向具备持久增长、强现金流和可防守 AI 能力的企业，而 PowerSchool 在交割后环境中，上述三点目前都尚未被确认。
