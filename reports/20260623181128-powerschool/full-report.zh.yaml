      - number: '8.4'
        title: 尽调缺口、最终建议与退出准备度
        blocks:
          - type: paragraph
            body: >-
              本估值分析最重要的发现不是某个具体数字，而是披露缺口：如果拿不到交割后的私募信贷条款清单、经审计的 FY2024 和 FY2025 财务报表、数据泄露后的当前 NRR 与总收入留存率，以及 MDL-3142
              律师给出的诉讼准备金估计，任何公开市场投资者、分析师或交易对手都无法判断 PowerSchool LBO 是否是一笔好投资。信息缺失并不否定底层业务质量；按所有公开指标看，它仍是 K-12 垂直 SaaS
              中的一流资产。但信息缺失会让任何投资建议都只能是有条件、临时性的。

              正式建议是有条件持有 / 继续研究。LBO 前业务展现了优质 SaaS 投资的典型特征：占优市场份额、黏性的多年合同、107% NRR、35% 调整后 EBITDA 利润率和 24% FCF 利润率。约 7.8x
              ARR、$5.6 billion 的进入价格偏高，但对这一质量的平台仍可辩护。LBO 后环境新增三层不确定性——数据泄露责任、私募债务不透明和 CEO
              交接——合在一起，使尽调完备的买入或卖出判断都无法成立。有条件持有意味着：没有尽调，不要退出；没有尽调，不要加码；先拿到阻断性信息，再更新判断。

              截至 2026 年 6 月，退出准备度有限。公司交割后已 20 个月，没有披露财务数据，面对活跃的 MDL-3142 诉讼，并在 2025 年 10 月上任新 CEO。Bain Capital 典型持有期为
              3-5 年，意味着目标退出窗口在 2027-2029 年。最可信的退出路径包括卖给另一家私募股权发起人的二级出售、由更大的教育或 GovTech 平台战略收购，或在数据泄露诉讼解决且财务表现达到修订预期后
              IPO。IPO 至少需要两年干净的泄露后经审计财务、已解决或可量化的诉讼敞口，以及公开市场对 EdTech SaaS 的接纳；截至 2026 年 6 月，这些条件都未完全满足。

              打破投资假设的触发条件已由证据清晰界定。数据泄露和解超过 $400 million、NRR 连续两个季度低于 100%、LBO 后 EBITDA 对利息覆盖低于
              1.0x，或私募信贷融资出现重大契约违约，任何一项都足以把投资判断从有条件持有改为减持或回避。反过来，如果收到经审计的 FY2024-FY2025 财务，确认 EBITDA 覆盖高于 1.5x 且 NRR 高于
              104%，则可支持把判断上调为买入，并配套目标回报框架。
