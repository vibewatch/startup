  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 联邦 IDEA 对特殊教育文档的强制要求
        - 驱动因素
        - 持续、非可选
        - 每个有残障学生的学区（约占在校学生 14%）都需要合规平台，形成底部需求；能抵御预算削减
        - 确认 PowerSchool ARR 中来自 IDEA 驱动的特殊教育合同与可选模块的占比
      - - 州 / 联邦问责（ESSA 测评和报告）
        - 驱动因素
        - 持续
        - 维持对 SIS 州报告集成和测评分析的需求；采购由合规截止日期推动
        - 核实州报告合同条款，以及在 FY2027 拨款讨论下的稳定性
      - - AI 分析产品扩张（PowerBuddy）
        - 驱动因素
        - 2024–2028
        - 在现有客户内打开追加销售收入流；提高 ACV；与旧式 SIS 供应商拉开差异
        - 核实 PowerBuddy 采用率，以及各客群批次的增量 ACV 溢价
      - - 从本地部署 SIS 迁移到云端
        - 驱动因素
        - 2020–2030
        - 将旧式永久许可证转为经常性 SaaS 订阅；待迁移学区现代化时扩大 TAM
        - 确认仍为本地部署的 PowerSchool 占比，以及目标迁移时间表
      - - ESSER III 资金悬崖（2024 年 9 月）
        - 约束
        - 2024–2026
        - 约 $190B 疫情救助结束；压低可选 EdTech 支出；放慢新采用；给续约施压
        - 量化 PowerSchool ARR 中由 ESSER 资助、现面临不续约风险的合同占比
      - - 公立学校招生下降（49.3M vs 2019 年的 50.8M）
        - 约束
        - 2019–持续
        - 缩小学区按学生计算的经费基数；压低技术预算扩张空间
        - 将招生趋势映射到 PowerSchool 单学区 ACV 增长；核实定价结构是否随招生变化调整
      - - ESSER 后学区预算压缩
        - 约束
        - 2024–2027
        - 学区削减可选软件；供应商合同受到审查；净新增采用放慢
        - 索取 2024 年 9 月后四个季度按学区规模分层的净留存率和扩张率
      - - 2024 年 12 月数据泄露（6200 万名学生、950 万名教师）
        - 约束
        - 2025–2026
        - 信任受损；合同复核；集体诉讼敞口；被 Future of Privacy Forum 移出名单；RFP 中存在被竞品替换风险
        - 确认暴露学区总数、诉讼准备金、可归因于泄露的流失，以及安全投资计划
      - - FY2026 Title I 削减提案（削减 26%，众议院拨款委员会）
        - 约束
        - 2025–2026 风险
        - 若在 FY2027 落地，将实质性压低学区运营预算；可选技术支出最脆弱
        - 跟踪 FY2027 拨款；按联邦援助减少 15–25% 的情景压力测试 ARR
      - - SIS 切换成本护城河
        - 驱动因素
        - 持续
        - 高切换成本保护续约率，限制竞品替换；提高新进入者门槛
        - 核实按学区层级划分的历史 SIS 流失率；确认大型学区切换成本估算
    notes: >-
      IDEA 强制要求和 SIS 切换成本护城河，是支撑 PowerSchool 经常性收入基础的两个最耐久结构因素。数据泄露和 ESSER 后预算压缩，是最接近的短期约束。尽调应量化 ARR
      中位于非可选合规类别与可选模块的占比，因为二者对预算压力的反应截然不同。
