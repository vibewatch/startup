      - number: '5.5'
        title: 路线图、AI 策略与产品差异化
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 2025–2026 年路线图围绕三根支柱组织：通过 PowerBuddy 扩展 AI 生态、深化 Naviance CCLR 的 基于工作的学习，以及借助 Connected
              Intelligence 推进数据现代化。PowerBuddy 在 2024–2025 学年推出前， 最初在代表 1.5 million 名学生的学区中试点。2025–2026 年，PowerBuddy
              正在加入阿拉伯语、西班牙语、泰语、 法语和英语多语言支持，并推出 PowerBuddy for Engagement——面向家庭的 AI 助手，帮助家长与学校互动，并获取孩子 学业进展信息。国际部署中，使用
              PowerBuddy Tools 的教师报告每节课至少节省 20 分钟。PowerBuddy 获得 2024 年 GESS Education Award 中 Best Paid App Software
              Product 类别下的 Best AI Product。Naviance CCLR 平台在 2025 年 7 月大幅增强，新增无额外成本的 work-based
              learning（WBL）市场，让学生在学校管理环境中获取实习、 学徒、岗位影随和行业参访机会。截至 2023–2024 学年，全国学生 / 顾问比例为 376:1，高于建议的 250:1； 因此
              Naviance 的 AI 驱动个案管理工具，是超负荷顾问群体的结构性需求驱动。Connected Intelligence 平台通过集中 机器学习和高级分析所需数据，支撑 AI-ready
              数据基础。PowerSchool University 持续更新 SIS 角色认证，包括 Front Office、School Counselor、Principal 和 PowerTeacher Pro
              Gradebook，通过专业发展提高客户黏性。 公司的差异化策略，依赖家庭、课堂和中央办公室工作流的纵向整合深度，依赖把 AI 带到学区自身汇总数据上的独特能力 （而非要求把数据导出到第三方 AI
              平台），也依赖多年合同、深度集成和员工认证培训计划内嵌的转换成本。
