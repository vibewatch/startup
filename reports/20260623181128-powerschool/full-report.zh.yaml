              分析师对 K-12 SIS 的估计从 $0.2B（美国 SIS 合同自下而上）到 $41B（宽口径全球 K-12 student management）不等。投资者如果把区间高端套用到
              PowerSchool，会显著夸大绿地机会。PowerSchool 的 $720M ARR 对应边界较清晰的 North American K-12 平台 SAM $1–$2.4B，意味着渗透率为
              30–72%，更像成熟、整合中的市场，而不是早期增长机会。107% 的净收入留存率说明，现有客户扩张是主要增长向量，而非市场渗透。估值应锚定现实的 ARR 增速和 EBITDA
              利润率扩张，而不是名义上的数十亿美元 TAM。
