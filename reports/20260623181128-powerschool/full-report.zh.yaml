      - number: '1.5'
        title: 里程碑、负面事件与数据泄露影响
        blocks:
          - type: paragraph
            body: >
              PowerSchool 近三十年的历史里有一连串股权变更、产品收购和治理事件，也有 2024–2025 年一次从根本上改变公司风险画像的单一负面事件。2024 年 12 月，一名威胁行为者使用
              PowerSchool 分包商被窃取的凭据，进入公司的 PowerSource 客户支持门户。该门户缺少多因素认证，攻击者使用其中的管理工具，从北美数千个学区导出个人数据。泄露数据涉及约 6,200 万名学生和
              950 万名教师，包括姓名、地址、Social Security numbers、出生日期、医疗与残障记录、特殊教育信息，以及部分案例中的密码。部分泄露数据可追溯到二十多年前。攻击者后来被确认为 Matthew
              Lane，一名 Massachusetts 大学生，他向 PowerSchool 勒索约 $2.85 million 的
              Bitcoin；公司支付赎金，并收到据称显示被盗数据已删除的视频，但网络安全专家指出，这并不能提供经过验证的保证。PowerSchool 于 2025 年 1 月开始向学区通报该事件。


              事件引发一连串监管和法律后果。2025 年 2 月 13 日，Future of Privacy Forum 以未实施多因素认证为由，将 PowerSchool 从 Student Privacy Pledge
              签署方中移除。加拿大隐私专员于 2025 年 2 月启动调查。North Carolina Attorney General 于 2025 年 2 月宣布调查，估计最多 400
              万居民受影响。多起集体诉讼被提起。Texas Attorney General Ken Paxton 于 2025 年 9 月初起诉，指称其违反 Texas 欺骗性贸易行为和身份盗窃保护法律。2025 年 10
              月 14 日，Matthew Lane 被判处四年联邦监禁，并被责令支付 $14.1 million 赔偿。CrowdStrike 的临时网络安全审计未发现恶意软件或后门——这次泄露完全是通过一个缺少 MFA
              的系统中的单个被盗密码得手。此后 PowerSchool 增加了额外安全层和基于时间的访问控制，但截至本报告运行日，多起诉讼仍在进行；泄露数据的下游风险尚未补救，而受影响儿童将背负数十年的身份盗窃敞口。
