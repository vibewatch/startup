  - id: TM003
    title: 细分市场 / 买方图谱
    columns:
      - 细分市场
      - 买方
      - 用户
      - 付款方
      - 工作流
      - 预算负责人
      - 采用触发因素
    rows:
      - - 大型城市学区（>50K 名学生）
        - 学监 + CIO 联合评估委员会
        - 教师、辅导员、管理人员、家庭
        - 学区普通基金 + Title I + IDEA 公式拨款
        - 多模块 RFP 覆盖 SIS、LMS、特殊教育、测评、HR；需董事会投票
        - 学监，经董事会批准；合同通常 3-5 年
        - 合同到期、合规审计失败、州数据系统强制要求、安全事件
      - - 中型郊区学区（5K–50K 名学生）
        - IT 主管或课程主管，经学监批准
        - 教师、校舍管理者、家长
        - 州公式拨款 + 地方房产税征收
        - 合作采购协议或直接与供应商谈判；偏好单一供应商平台
        - 学监或指定人员；年度预算周期
        - 多年合同续约；与竞品演示相比的功能缺口；同侪学区背书
      - - 小型和农村学区（<5K 名学生）
        - 学监或业务经理
        - 教师、校长
        - Title I 援助 + 州均衡化拨款
        - 直接与供应商谈判；SIS 通常单独采购，不走完整 RFP
        - 学监；成本敏感；可选模块预算余量很小
        - 旧系统生命周期结束、州报告升级要求、IT 支持失效
      - - 私立和宗教学校
        - 校长或学校负责人
        - 教师、家庭
        - 学费收入和捐赠基金；没有联邦公式拨款
        - 直接向供应商采购；无需公开 RFP；FACTS SIS 以约 15% 份额占主导
        - 学校负责人或业务经理
        - 招生管理需求、竞品背书、数据合规负担较低
      - - 州教育厅
        - 州 CIO 或教育副厅长
        - 学区 IT 联络人、合规人员
        - 联邦公式拨款（IDEA、Title I）和州拨款
        - 全州合同或框架协议；学区通过州采购工具接入
        - 州议会拨款和行政分支 IT 治理
        - 全州合规强制要求、数据标准化计划、大型学区推动
    notes: 预算归属是尽调关键变量：联邦公式拨款（IDEA、Title I）即便在预算紧张时，也会为合规平台创造非可选需求。可选 EdTech 模块（分析、AI 功能、家长应用）更容易暴露在 ESSER 后预算压缩之下。
