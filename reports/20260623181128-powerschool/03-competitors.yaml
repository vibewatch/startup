callouts:
  - calloutType: risk
    title: Multi-Product Bundle Unbundling Is the Primary Competitive Threat
    body: >-
      PowerSchool's deepest lock-in comes not from SIS alone but from the multi-product bundle:
      districts that run Schoology LMS, HR modules, and Naviance counseling alongside SIS face
      an exponentially larger migration scope. However, this same bundling creates vulnerability:
      post-breach, districts are actively evaluating Canvas for LMS, Frontline for HR, and
      alternative SIS vendors, with the breach serving as the political catalyst for unbundling
      conversations that sticky economics had previously suppressed. This "bundle unraveling"
      scenario is the highest-severity competitive risk in PowerSchool's near-term landscape.
    claimRefs: [CP019, CP020, CP033, CP040, CP032, CP034]

  - calloutType: insight
    title: PowerSchool Breach Creates Multi-Year Opening for Infinite Campus and Skyward
    body: >-
      The December 2024 breach has not triggered immediate mass switching—SIS migration economics
      prevent that—but it has fundamentally changed the political environment for school board
      renewal decisions. Districts in renewal-year cohorts during 2025 through 2028 now face board
      scrutiny, parent advocacy groups, and state regulators asking why they remain on PowerSchool.
      Infinite Campus and Skyward benefit from this scrutiny without needing to win on features alone:
      the breach has made "not PowerSchool" a meaningful procurement signal. Competitors that
      can offer migration support, transparent security certifications, and credible breach-response
      track records stand to capture disproportionate renewal wins through 2027.
    claimRefs: [CP009, CP011, CP021, CP022, CP033, CP038, CP012, CP015]

  - calloutType: risk
    title: Bain Capital's PE Ownership Creates Dual Risk of Pricing Pressure and Under-Investment
    body: >-
      Bain Capital's $5.6 billion acquisition implies an exit-multiple target that will pressure
      PowerSchool management toward both revenue growth and margin improvement. In a SaaS business
      with a captive customer base and sticky multi-year contracts, the path of least resistance is
      price increases at renewal rather than product investment. If Bain prioritizes margin expansion
      over product quality, PowerSchool risks accelerating the trust deficit created by the breach
      while simultaneously increasing the relative attractiveness of Infinite Campus and Skyward at
      renewal time. The competitive implications of PE ownership will likely manifest gradually but
      become visible in Civic IQ contract data over the 2026 through 2028 renewal cycle.
    claimRefs: [CP005, CP020, CP037, CP033]

