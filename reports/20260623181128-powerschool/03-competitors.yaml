  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: SIS migration case studies
      missingEvidence: "Documented case studies of school districts completing low-cost or streamlined migrations away from PowerSchool SIS to alternative platforms including timelines and total cost of ownership comparisons"
      whyItMatters: "Absence of migration case studies limits the ability to assess the true switching-cost floor and competitor ability to accelerate adoption post-breach through migration support programs"
      diligencePath: "Survey districts that recently completed SIS transitions; request migration cost and timeline data from Infinite Campus and Skyward sales teams; review state procurement portals for RFP responses that include transition cost estimates"
      relatedQuestionRefs: [QP018]

    - type: private-evidence-only
      severity: material
      topic: PowerSchool post-breach retention metrics
      missingEvidence: "Actual PowerSchool customer attrition rate, net revenue retention, or contract non-renewal percentage following the December 2024 data breach; PowerSchool is now a private company under Bain Capital"
      whyItMatters: "Without retention data, the quantified competitive impact of the breach on PowerSchool's installed base cannot be assessed; all available signals are qualitative (RFP activity, competitor claims)"
      diligencePath: "Request net retention rate data from PowerSchool management or Bain Capital investor relations; monitor state procurement databases and school board meeting minutes for upcoming PowerSchool RFPs; use Civic IQ renewal tracking data"
      relatedQuestionRefs: [QP016]

    - type: private-evidence-only
      severity: material
      topic: SIS vendor pricing schedules
      missingEvidence: "Publicly auditable pricing schedules or per-student rate cards for PowerSchool, Infinite Campus, Skyward, and Frontline Education; all major SIS vendors use opaque quote-based pricing"
      whyItMatters: "Pricing opacity limits reliable competitive pricing analysis; Civic IQ contract data represents a sample of tracked district contracts and may not reflect current pricing tiers or volume discounts"
      diligencePath: "Submit public records requests to school districts for recent SIS contract documents; review state procurement portals such as TASB for published Texas bid pricing; request pricing models from vendor sales teams during diligence"
      relatedQuestionRefs: [QP008, QP023]

    - type: missing-source
      severity: minor
      topic: Ed-Fi standard adoption and SIS lock-in impact
      missingEvidence: "State-level mandates for Ed-Fi data standard adoption and quantified impact on SIS switching costs; current Ed-Fi penetration data by state and vendor compliance status"
      whyItMatters: "If Ed-Fi is mandated in major states, the proprietary-schema lock-in that anchors PowerSchool's competitive moat could erode faster than expected, accelerating switching and benefiting open-API competitors"
      diligencePath: "Review Ed-Fi Alliance state-adoption tracker and vendor compliance certifications; survey state education technology directors on Ed-Fi mandates timeline and compliance requirements"
      relatedQuestionRefs: [QP015]

