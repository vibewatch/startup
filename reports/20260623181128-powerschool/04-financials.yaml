    title: Revenue streams
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value or status
      - Revenue quality
      - Diligence ask
    rows:
      - - SaaS subscriptions and support
        - Annual renewable multi-module cloud contracts to K-12 districts and states
        - Per-district / per-enrollment annual contract
        - "$166.9M in Q1 2024 (90% of revenue); ARR $720.3M as of Q1 2024"
        - High — recurring, advance-pay, high retention (NRR 107%)
        - Request post-close ARR, NRR, and gross revenue retention for 2025 and H1 2026
      - - Professional services
        - Implementation, migration, training, and onboarding for new or expanding districts
        - Project-based or time-and-materials engagement
        - ~10% of revenue in Q1 2024; $19.3M in Q2 2024
        - Medium — variable, lower-margin, one-time in nature
        - Request professional-services gross margin and backlog
      - - AI and add-on modules (PowerBuddy)
        - Incremental subscription license for generative AI modules across SIS, LMS, HR
        - Per-module annual subscription
        - Generally available Q1 2024; revenue contribution not separately disclosed
        - Unknown — bundling versus standalone pricing not public
        - Request incremental ARR contribution from AI modules and upsell attach rate
      - - International subscriptions
        - Same SaaS model extended to 90+ countries via direct and channel-partner sales
        - Per-district annual subscription
        - Growing; specific international revenue not broken out in public filings
        - Unknown — no international revenue split disclosed
        - Request international ARR and revenue as percent of total
      - - Data-as-a-service (DaaS)
        - Analytics and data services sold to state education agencies
        - Multi-year state agency contract
        - Cross-sell wins cited in Q2 2024 (e.g., Arkansas State Dept of Education)
        - Medium — contract wins confirmed, financial scale not disclosed
        - Request DaaS ARR and pipeline
      - - Legacy perpetual license maintenance
        - Annual maintenance and support fees on legacy on-premise deployments
        - Per-legacy-installation annual maintenance fee
        - Declining share as districts migrate to cloud
        - Medium declining — stickiness provides revenue but conversion to SaaS is the goal
        - Request maintenance revenue as share of total and cloud migration run rate
    notes: >-
      Revenue mix derived from PowerSchool Q1 2024 and Q2 2024 public earnings releases and SEC
      10-Q for the period ended June 30, 2024. Post-close (October 2024 onward) breakdowns are
      not publicly available. International and AI module contribution are not separately reported.
