  - id: TI003
    title: Unit economics
    columns:
      - Metric
      - Value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annual recurring revenue (ARR) — Q1 2024
        - "$720.3M (+18% YoY)"
        - high
        - Primary SaaS traction metric; growth above revenue growth confirms healthy renewal + expansion
        - Request post-close (2025, 2026) ARR to track LBO-period growth
      - - Net revenue retention rate (NRR) — Q1 2024
        - "107%"
        - high
        - NRR above 100% means expansion revenue exceeds any churn; supports platform land-and-expand thesis
        - Request current NRR; post-breach NRR risk is unquantified
      - - GAAP gross margin — H1 2024
        - "57–58% of revenue"
        - high
        - GAAP gross margin includes amortization of acquired intangibles; lower than cash-based margin
        - Request post-LBO gross margin with new amortization schedule
      - - Adjusted gross margin — H1 2024
        - "69–70% of revenue"
        - high
        - Adj margin strips amortization and SBC; better proxy for cash gross economics
        - Request post-LBO adjusted margin; confirm whether buyout introduces new amortization layers
      - - Adjusted EBITDA — FY2023
        - "$231.9M (33% of revenue)"
        - high
        - Pre-LBO EBITDA is the base for leverage underwriting; margin has been expanding
        - Request post-LBO adjusted EBITDA; confirm whether management fees added post-close
      - - Free cash flow — FY2023
        - "$168.4M (24% margin)"
        - high
        - Strong FCF enables debt service; but post-LBO interest load will materially reduce FCF
        - Request post-LBO FCF bridge; estimate debt service at 2024 private-credit rates
      - - GAAP net loss — FY2023
        - "$(39.1M)"
        - high
        - Company not GAAP profitable pre-LBO; amortization, SBC, and interest expense are primary drivers
        - Request whether GAAP net income improves post-LBO via TRA cancellation
      - - CAC and payback period
        - Not publicly disclosed
        - low
        - CAC/payback is the key sales efficiency metric for a SaaS business
        - Request sales and marketing spend per new ARR dollar and implied payback period
      - - Subscription gross margin (ex-services)
        - Not publicly disclosed as a separate line
        - low
        - Services mix-down drags blended margin; subscription-only margin likely in the 75%+ range
        - Request subscription vs. services gross margin split
      - - Pre-LBO net debt leverage — Q1 2024
        - "3.8x adjusted EBITDA"
        - high
        - Leverage was already elevated pre-LBO; post-close leverage is materially higher
        - Request post-LBO debt quantum and leverage ratio
    notes: >-
      High-confidence metrics are from PowerSchool SEC filings and earnings releases for periods
      through Q2 2024. Low-confidence items are unavailable from public sources. Post-LBO data is
