  - id: capital-structure-and-lbo-financing
    title: Capital structure and LBO financing
    body: >-
      Bain Capital completed the acquisition of PowerSchool on October 1, 2024 at $22.80 per share,
      representing a total enterprise value of approximately $5.6 billion — a 37 percent premium to
      the unaffected share price of $16.64 as of May 7, 2024. Existing investors Vista Equity Partners
      and Onex Partners retained minority stakes in the newly private company. Debt financing for the
      transaction was provided exclusively by a private-credit syndicate comprising Ares Capital
      Management, HPS Investment Partners, Blackstone Alternative Credit Advisors, Blue Owl Credit
      Advisors, Sixth Street Partners, and Golub Capital — a notable structure given that most large
      LBOs in 2024 used traditional bank-led leveraged loans. As part of the closing, PowerSchool's
      tax receivable agreement (TRA), originally estimated at a value of approximately $450 million
      or more than $2 per share, was amended so that no payments would be made in connection with or
      following the transaction. Pre-LBO capital adequacy metrics were already strained: as of
      December 31, 2023, the company carried $811 million in long-term debt and just $39 million in
      cash. By June 30, 2024, cash had declined to approximately $21 million and the company reported
      a net debt leverage ratio of 3.8 times adjusted EBITDA. Post-LBO, the total debt load is
      materially higher than these public anchors because the private-credit syndicate financed
      the bulk of the $5.6 billion transaction, but the exact debt quantum, interest rate terms, and
      required cash sweeps are not publicly disclosed. The Company Overview chapter documents the full
      funding and ownership chronology; this section focuses on the post-LBO capital adequacy position
      and its implications for financial performance.
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
