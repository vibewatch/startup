          detail: ~$450M tax receivable agreement waived at close; reduces effective cash outflow
        - label: Private-credit new debt (estimated)
          value: -3200
          detail: Estimated debt raised from Ares, HPS, Blackstone, Blue Owl, Sixth Street, Golub; exact not public
        - label: Bain / Vista / Onex equity contribution (estimated)
          value: 2030
          detail: Residual equity implied after estimated debt; Vista and Onex retain minority stakes
    approximationNotes: >-
      Enterprise value and per-share price are from public announcements. New private-credit debt
      quantum is estimated using typical 2024 large-LBO leverage ratios (approximately 12–14x
      EBITDA of ~$230M base); actual debt amount is not publicly disclosed. TRA cancellation value
      is from the merger agreement as filed. Equity contribution is the residual and is an estimate.
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI021
      - CI022

callouts:
  - calloutType: risk
    title: Post-LBO financial opacity is the primary underwriting blocker
    body: >-
      PowerSchool has not filed or published any financial statements since October 2024. The
      combination of a high private-credit debt load, near-zero pre-close cash balance, and an
      open multidistrict class-action lawsuit makes it impossible to assess current liquidity,
      FCF adequacy, or breach settlement exposure from public sources alone.
    claimRefs:
      - CI033
      - CI034
      - CI035

  - calloutType: strength
    title: Pre-LBO SaaS metrics are top-tier for K-12 EdTech
    body: >-
      An NRR of 107%, adjusted EBITDA margins of 33–35%, and 24% FCF margins are industry-leading
      for a K-12 SaaS company and provide a strong foundation for LBO debt service — if the debt
      load is sized appropriately and the breach liability is contained.
    claimRefs:
      - CI005
      - CI016
      - CI017

