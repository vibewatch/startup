company:
  name: PowerSchool
chapter:
  number: 4
  title: Financials
  summary: >-
    PowerSchool entered the Bain Capital-led $5.6 billion LBO in October 2024 with roughly $741 million
    in trailing-twelve-month revenue, $701.5 million in ARR, a 107% net revenue retention rate, and
    adjusted EBITDA margins of 33–35%. Post-close, the company stopped public financial reporting;
    the key underwriting blockers are undisclosed post-LBO debt quantum, post-acquisition burn and
    runway, and the unresolved financial liability from the December 2024 data breach affecting 62 million
    student records and spawning multidistrict class-action litigation.

sections:
  - id: revenue-model-and-subscription-mechanics
    title: Revenue model and subscription mechanics
    body: >-
      PowerSchool operates a K-12 SaaS platform sold under annual renewable contracts to school districts,
      state agencies, and international education authorities. Its last public disclosures before the
      October 2024 take-private reported that subscriptions and support revenue represented approximately
      90 percent of quarterly revenue in Q1 2024, reaching $166.9 million of the $185.0 million total
      that quarter. For the full year 2023, the company reported $697.7 million in total revenue, growing
      11 percent year over year, while annual recurring revenue (ARR) — the company's primary operating
      KPI — reached $701.5 million at December 31, 2023, growing 18 percent year over year. By Q1 2024
      ARR had risen further to $720.3 million, and the company reaffirmed full-year 2024 guidance of
      $786 million to $792 million in total revenue with $268 million to $273 million in adjusted EBITDA.
      Revenue recognition is dominated by multi-year subscription contracts that roll forward annually:
      districts pay in advance, and deferred revenue provides strong cash-flow visibility. The Q2 2024
      balance sheet showed $213.4 million in deferred revenue, with 97 percent expected recognized in
      the next twelve months, confirming a short-duration, high-visibility revenue profile. Professional
      services — primarily implementation, onboarding, training, and migration — made up the remaining
      roughly 10 percent of revenue and are structurally lower-margin than subscriptions. Revenue mix
      is therefore heavily weighted toward recurring subscription income, which is the core quality
      signal for a K-12 SaaS underwriting thesis.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI001
    figureRefs:
      - FI001

  - id: pricing-unit-economics-and-public-traction
    title: Pricing, unit economics, and public traction
    body: >-
      PowerSchool uses a quote-based, per-district pricing model that scales with student enrollment,
      modules selected, and contract length. Public contract database research from Civic IQ, based on
      government procurement records through April 2026, found an average annual SIS contract value of
      approximately $10,604 across 54 tracked PowerSchool SIS engagements. For large district deployments
      and multi-module contracts covering SIS, LMS, HR, special education, and analytics, annual
      realized contract values can range from $20,000 to $600,000 or more. List pricing benchmarks from
      third-party review sites suggest core SIS starts at roughly $3 per student per year, with premium
      tiers and add-on modules meaningfully increasing effective ASP. Net revenue retention of 107
      percent as of Q1 2024 — the last publicly disclosed figure — confirms that expansion through
      cross-sells and upsells is more than offsetting any churn, which is the defining unit-economic
      signal for K-12 SaaS. On the cost side, reported GAAP gross margins averaged 57 to 60 percent
      across Q1–Q2 2024, while adjusted gross margins (excluding amortization, stock comp, and restructuring)
      reached 69 to 70 percent. The difference is material: a significant portion of GAAP cost of revenue
      reflects amortization of acquired intangible assets built up through PowerSchool's decade-long M&A
      strategy. Free cash flow was $168.4 million for the full year 2023, representing a 24 percent FCF
      margin, which is strong for a software company of this scale. The public evidence does not
      disclose post-LBO realized margins or FCF, making the most recent data points historical anchors
      rather than current operating metrics.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
