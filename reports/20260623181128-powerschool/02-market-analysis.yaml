  - id: section-3
    title: Growth drivers, adoption constraints, and adverse market evidence
    body: >-
      Structural demand drivers for K-12 administrative software are durable and regulation-anchored.
      Federal IDEA mandates non-discretionary documentation of Individualized Education Programs and
      Section 504 plans for approximately 14 percent of enrolled students nationally, creating a
      compliance spending floor that persists regardless of broader budget pressure. State and federal
      accountability requirements under the Every Student Succeeds Act sustain demand for assessment
      analytics and SIS state-reporting integrations. Digital transformation continues to push SIS
      toward cloud-based architectures—Mordor Intelligence estimates over 63 percent of SIS deployments
      are now cloud-based compared with a legacy on-premise majority a decade earlier. PowerSchool's
      January 2024 launch of PowerBuddy—a generative AI assistant for students, teachers, administrators,
      and parents embedded across its SIS, LMS, and assessment modules—opens an upsell revenue stream
      per existing customer and raises average contract value. The Indiana Department of Education
      signing PowerSchool's largest-ever Special Programs contract in 2024 illustrates continued
      state-level demand growth for the compliance and special-education segment.

      The braking forces are equally material. The expiration of ESSER III pandemic relief on September
      30, 2024 ended approximately $190 billion of one-time K-12 spending that had accelerated EdTech
      adoption from 2020 to 2024. Brookings Institution estimates that ESSER expiration creates an
      average single-year reduction of more than $1,000 per student in many districts, with high-poverty
      districts hit hardest. McKinsey characterizes the post-ESSER environment as a "perfect storm"
      combining reduced federal funding, declining enrollment, and slowing state revenues. Public school
      enrollment has fallen from 50.8 million in 2019 to 49.3 million in 2024-25, shrinking the
      per-student revenue base that districts use to fund technology contracts. The post-ESSER climate
      has already slowed net new EdTech adoptions and pushed districts to scrutinize renewals more
      carefully. The House Appropriations Committee proposed a 26 percent cut to Title I for FY2026,
      which would have further compressed district budgets; the final Consolidated Appropriations Act
      of 2026 maintained approximately prior-year funding levels, providing near-term stability but
      leaving deeper cuts as a forward risk in FY2027 appropriations discussions.

      The most material adverse evidence for PowerSchool specifically is the December 2024 data breach,
      which exposed records of approximately 62 million current and former students and 9.5 million
      teachers—the largest known breach of children's data in US history. After PowerSchool paid a
      ransom, the attacker returned to extort individual school districts, causing renewed customer
      anxiety. K-12 Dive and NBC News documented that the Future of Privacy Forum removed PowerSchool
      from its Student Privacy Pledge due to inadequate security controls. North Carolina's Lee County
      Board of Education formally requested the state attorney general pursue legal action against
      PowerSchool. Multiple class action lawsuits have been filed. The breach is a direct market
      constraint because data security now ranks as the top factor in K-12 procurement evaluations,
      and districts considering SIS replacement weigh incumbent security posture alongside features
      and price. EdTech Magazine reported that over 225 percent more EdTech tools were in use per
      district since 2018-19, a surge that faces rapid pullback pressure post-ESSER as security
      and budget scrutiny increase simultaneously.

