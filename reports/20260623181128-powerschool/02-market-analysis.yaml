figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      PowerSchool's revenue base sits well inside the global SIS market envelope. Broad analyst estimates
      overshoot the serviceable North American K-12 platform market by a factor of 10 to 50 depending
      on scope, making bottom-up boundary logic essential for accurate TAM framing.
    data:
      nodes:
        - label: 'Global K-12 SIS broad market: ~$41B (2025)'
          detail: Global Growth Insights estimate including all K-12 student management platforms and services globally; USD billions.
          tone: neutral
        - label: 'All-education SIS global market: ~$15B (2025)'
          detail: Mordor Intelligence estimate including K-12 and higher education SIS worldwide; USD billions.
          tone: neutral
        - label: 'North American K-12 platform software SAM: ~$1–$2.4B'
          detail: Derived from Apps Run the World NA share (~38% × $6.2B) and bottom-up full-platform ACV; USD billions.
          tone: positive
        - label: 'PowerSchool ARR (current revenue): ~$720M (2024)'
          detail: Last reported ARR from 2024 10-Q filing; represents ~30–72% of estimated North American SAM; USD millions.
          tone: positive
    approximationNotes: >-
      This is a lens stack rather than a strict TAM-SAM-SOM cascade because analyst estimates measure
      different boundary scopes. The North American SAM is a derived estimate combining Apps Run the World
      global figures with regional share data; it is not directly reported by any single analyst source.
      The pyramid illustrates the gap between headline TAM framing and PowerSchool's actual revenue footprint.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM011
      - CM014
      - CM016

