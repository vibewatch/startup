  - id: TM003
    title: Segment / buyer map
    columns:
      - segment
      - buyer
      - user
      - payer
      - workflow
      - budget owner
      - adoption trigger
    rows:
      - - Large urban district (>50K students)
        - Superintendent + CIO joint evaluation committee
        - Teachers, counselors, administrators, families
        - District general fund + Title I + IDEA formula grants
        - Multi-module RFP covering SIS, LMS, SpEd, assessment, HR; board vote required
        - Superintendent with board approval; typically 3-5 year contracts
        - Contract expiration, compliance audit failure, state data-system mandate, security incident
      - - Mid-size suburban district (5K–50K students)
        - IT director or curriculum director with superintendent approval
        - Teachers, building administrators, parents
        - State formula allocation + local property tax levy
        - Cooperative purchasing agreement or direct vendor negotiation; single-vendor platform preferred
        - Superintendent or designee; annual budget cycle
        - Multi-year contract renewal; feature gap vs competitor demo; peer district reference
      - - Small and rural district (<5K students)
        - Superintendent or business manager
        - Teachers, principal
        - Title I aid + state equalization funding
        - Direct vendor negotiation; SIS often purchased alone without full RFP
        - Superintendent; cost-sensitive; minimal margin for discretionary modules
        - Legacy system end-of-life, state reporting upgrade requirement, IT support failure
      - - Private and faith-based school
        - Principal or head of school
        - Teachers, families
        - Tuition revenue and endowment; no federal formula grants
        - Direct vendor purchase; no public RFP required; FACTS SIS dominant with ~15% share
        - Head of school or business manager
        - Enrollment management need, competitor reference, lower data-compliance burden
      - - State department of education
        - State CIO or deputy commissioner of education
        - District IT liaisons, compliance staff
        - Federal formula grants (IDEA, Title I) and state appropriation
        - Statewide contract or framework agreement; districts access via state purchasing vehicle
        - State legislature appropriation and executive branch IT governance
        - Statewide compliance mandate, data standardization initiative, large-district advocacy
    notes: >-
      Budget ownership is the critical diligence variable: federal formula grants (IDEA, Title I) create
      non-discretionary demand for compliance platforms even in budget-constrained environments. Discretionary
      EdTech modules (analytics, AI features, parent apps) are more exposed to post-ESSER budget compression.
