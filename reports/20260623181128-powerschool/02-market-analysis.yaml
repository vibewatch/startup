  evidenceGaps:
    - type: missing-source
      severity: material
      topic: SAM-methodology
      missingEvidence: >-
        No single analyst publishes a well-bounded North American K-12 full-platform administrative software
        market size that matches PowerSchool's actual product scope (SIS + LMS + assessment + SpEd + HR).
        The closest proxy (Apps Run the World US K-12 software) is derived from a global estimate with a
        regional share assumption, not a direct US market measurement.
      whyItMatters: >-
        Without a clean SAM boundary, PowerSchool's penetration ratio (and therefore remaining growth
        headroom) cannot be independently verified. The 30–72% penetration range is too wide to anchor
        valuation analysis.
      diligencePath: >-
        Commission a boundary-specific market sizing from HolonIQ or Ariadne Analytics using PowerSchool's
        actual product scope as the definitional boundary; cross-reference with CoSN district technology
        budget survey data.
      relatedQuestionRefs:
        - QM003
        - QM015

    - type: missing-source
      severity: material
      topic: post-breach-churn
      missingEvidence: >-
        No public data is available on PowerSchool customer churn, contract cancellations, or competitive
        displacement attributable specifically to the December 2024 data breach. The company went private
        in October 2024 and is no longer required to file public quarterly disclosures.
      whyItMatters: >-
        The breach is the most proximate near-term risk to ARR. Without churn data, the investment thesis
        cannot distinguish between a manageable reputational hit and a materially accelerating customer loss.
      diligencePath: >-
        Request management data on: (1) percentage of ARR under active contract review citing the breach;
        (2) districts that have issued RFPs or contacted competitors since January 2025; (3) size of
        litigation reserve for breach-related class action exposure.
      relatedQuestionRefs:
        - QM022

    - type: conflicting-data
      severity: material
      topic: TAM-methodology
      missingEvidence: >-
        Analyst K-12 SIS estimates diverge by more than 50x ($0.2B to $41B) with no public methodology
        reconciliation available. Global Growth Insights reports $41.43B while CivicIQ's contract database
        implies $0.2B for SIS alone; neither estimate directly represents PowerSchool's SAM.
      whyItMatters: >-
        TAM drives growth expectations and valuation multiples; a 50x error in TAM framing produces
        a 50x error in implied greenfield opportunity. Investors using the $41B figure for PowerSchool
        analysis will materially overstate remaining penetration headroom.
      diligencePath: >-
        Normalize each estimate by identifying included/excluded spend categories, geographies, and
        education levels; accept only the post-normalization $1–2.4B North American platform range
        as the working SAM for investment analysis.
      relatedQuestionRefs:
        - QM002
        - QM015

    - type: missing-source
      severity: minor
      topic: post-ESSER-ARR-impact
      missingEvidence: >-
        No publicly available data distinguishes what share of PowerSchool's ARR was funded by
        ESSER allocations versus general operating budgets. Districts that used ESSER for SIS or
        LMS contracts may not renew at the same value once ESSER funding expires.
      whyItMatters: >-
        If a material share of ARR (e.g., >10%) was ESSER-funded, the funding cliff creates renewal
        risk that would not appear in historical NRR data and would directly suppress forward ARR growth.
      diligencePath: >-
        Request district-level ARR cohort data stratified by ESSER-versus-operating-budget funding
        source; cross-reference with CoSN ESSER spend tracking data.
      relatedQuestionRefs:
        - QM009
        - QM018

