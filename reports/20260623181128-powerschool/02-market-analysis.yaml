  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - K-12 SIS (public districts)
        - Annual SIS subscription covering enrollment, attendance, grades, scheduling, and state compliance reporting
        - Higher-education SIS, state IT infrastructure, non-software data services
        - District superintendent or CIO; board approval for multi-year contracts above dollar thresholds
        - Core direct market; PowerSchool holds ~23% North American SIS implementation share
      - - K-12 Instructional LMS
        - LMS platform subscriptions for curriculum delivery, grading workflows, and family communication (Schoology)
        - Consumer tutoring apps, publisher-owned digital curriculum, non-LMS classroom hardware
        - Curriculum and instruction directors, IT departments; teacher influence on selection
        - Direct via Schoology; competes against Instructure Canvas; adjacent to SIS cross-sell
      - - Special Education Administration
        - IEP/504 management, MTSS/RTI documentation, and IDEA compliance workflows
        - Medical and therapeutic services, private special-education providers, state-administered systems
        - Special education directors and district compliance officers; IDEA-mandate-driven budget
        - Non-discretionary spend; PowerSchool Special Programs; largest-ever contract was Indiana DOE in 2024
      - - Assessment and Analytics
        - Formative, benchmark, and diagnostic assessment platforms; standards-aligned reporting and early-warning systems
        - State-contracted summative testing, testing hardware, third-party test publishers
        - Directors of curriculum, assessment, and accountability; IT procurement
        - Adjacent cross-sell into existing SIS customers; PowerBuddy AI adds analytics upsell
      - - K-12 HR and Finance
        - District payroll, HR, and finance software sold as platform extension
        - Large-district ERP systems, state-managed payroll, non-SaaS back-office vendors
        - District CFO and HR directors; IT leadership
        - Platform expansion vector; harder to displace entrenched ERP incumbents
      - - International K-12 admin platforms
        - SIS, LMS, and assessment licensing outside North America across 90+ countries
        - Government-owned national education systems, non-cloud mandated markets
        - Ministry-level procurement bodies and international district IT departments
        - Part of PowerSchool's 18,000+ customer base; smaller per-customer revenue than North America
    notes: >-
      The underwriting boundary should track the North American K-12 platform software market
      (SIS + LMS + assessment + special-ed + HR) rather than global all-education SIS estimates,
      which include higher-education and non-software spend categories beyond PowerSchool's core SAM.
