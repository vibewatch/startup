  - id: section-2
    title: Buyer segmentation, budgets, and adoption path
    body: >-
      The K-12 administrative software market has a distinctive buyer-payer-user structure that governs
      PowerSchool's go-to-market. The payer is almost always the school district, funded through local
      property tax revenues, state formula allocations, and federal formula grants including Title I
      (approximately $18.4 billion nationally in FY2026 under the Consolidated Appropriations Act of 2026)
      and IDEA Part B (approximately $15.5 billion in FY2026). Procurement authority rests with district
      superintendents and chief information officers, sometimes requiring board approval for multi-year
      contracts above certain dollar thresholds. Teachers, counselors, and school administrators are the
      primary users and exert significant influence over platform selection, but rarely hold budget authority
      directly. Families are the end recipients of communication features but have no formal procurement role.

      Segment structure follows district size and mission. Large urban districts with enrollment above
      50,000 carry complex compliance needs across SIS, special-education, LMS, and HR and typically
      sign multi-year platform contracts. Mid-size suburban districts represent the largest volume
      segment among the roughly 19,183 US public districts and often leverage cooperative purchasing
      vehicles or state-level framework agreements. Small and rural districts face constrained budgets
      and frequently purchase SIS alone, making adjacent module cross-sell harder. Private and faith-based
      schools form a separate procurement universe—FACTS SIS holds approximately 15 percent of K-12
      SIS implementations in this segment—where purchasing is simpler but budgets are smaller. State
      departments of education represent a strategic buyer for statewide compliance platforms; the Indiana
      Department of Education's PowerSchool Special Programs contract, reported as the company's largest-ever
      in 2024, illustrates the scale of state-level demand.

      The adoption trigger for SIS replacement is typically a contract expiration, compliance or reporting
      failure, state data-system mandate, or dissatisfaction with data quality and analytics depth.
      Switching costs are structurally high: data migration of student records spanning years or decades,
      staff retraining, and rebuilding integrations with LMS, food services, and state reporting systems
      can cost hundreds of thousands to over a million dollars for large districts. CivicIQ documents
      that PowerSchool and Skyward both participate in state-level cooperative purchasing agreements
      that allow districts to procure without a full public RFP, shortening the sales cycle and
      reinforcing incumbent advantages. Once installed, SIS platforms benefit from substantial switching
      inertia because every district stakeholder's workflow becomes embedded in the incumbent system
      over multi-year contract cycles.

