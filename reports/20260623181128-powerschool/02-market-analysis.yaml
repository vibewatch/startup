  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - Federal IDEA mandate for special-education documentation
        - Driver
        - Ongoing, non-discretionary
        - Creates floor demand for compliance platforms in every district with students with disabilities (~14% of enrolled students); insulates against budget cuts
        - Confirm share of PowerSchool ARR from IDEA-driven SpEd contracts vs discretionary modules
      - - State/federal accountability (ESSA assessment and reporting)
        - Driver
        - Ongoing
        - Sustains demand for SIS state-reporting integrations and assessment analytics; compliance deadline-driven purchasing
        - Verify state-reporting contract terms and stability under FY2027 appropriations discussions
      - - AI analytics product expansion (PowerBuddy)
        - Driver
        - 2024–2028
        - Opens upsell revenue stream per existing customer; raises ACV; differentiates from legacy SIS vendors
        - Verify PowerBuddy adoption rate and incremental ACV premium per cohort
      - - Cloud migration from on-premise SIS
        - Driver
        - 2020–2030
        - Converts legacy perpetual licenses to recurring SaaS subscriptions; expands TAM as holdout districts modernize
        - Confirm percentage of remaining on-premise PowerSchool deployments and targeted migration timeline
      - - ESSER III funding cliff (September 2024)
        - Constraint
        - 2024–2026
        - Ends ~$190B pandemic relief; reduces discretionary EdTech spend; slows new adoptions; pressures renewals
        - Quantify share of PowerSchool ARR attributable to ESSER-funded contracts now at risk of non-renewal
      - - Public school enrollment decline (49.3M vs 50.8M in 2019)
        - Constraint
        - 2019–ongoing
        - Shrinks per-student funding base for districts; depresses headroom for technology budget expansion
        - Map enrollment trend to PowerSchool per-district ACV growth; verify pricing structure adjusts for enrollment changes
      - - Post-ESSER district budget compression
        - Constraint
        - 2024–2027
        - Districts cutting discretionary software; vendor contracts under scrutiny; net-new adoption slowing
        - Request net retention and expansion rates by district size tier for the four quarters post-September 2024
      - - December 2024 data breach (62M students, 9.5M teachers)
        - Constraint
        - 2025–2026
        - Trust damage; contract reviews; class action exposure; Future of Privacy Forum de-listing; competitive displacement risk in RFPs
        - Confirm total exposed district count, litigation reserve, churn attributable to breach, and security investment plan
      - - FY2026 Title I cut proposal (26% reduction, House Appropriations)
        - Constraint
        - 2025–2026 risk
        - If enacted in FY2027, would reduce district operating budgets materially; discretionary tech spend most vulnerable
        - Monitor FY2027 appropriations; stress-test ARR against 15–25% federal aid reduction scenario
      - - SIS switching cost moat
        - Driver
        - Ongoing
        - High switching costs protect renewal rate and limit competitive displacement; raises barrier to entry for new entrants
        - Verify historical SIS churn rate by district tier; confirm switching cost estimates for large districts
    notes: >-
      The IDEA mandate and SIS switching cost moat are the two most durable structural supports for PowerSchool's
      recurring revenue base. The data breach and post-ESSER compression are the two most proximate near-term
      constraints. Diligence should quantify the share of ARR that sits in non-discretionary compliance categories
      versus discretionary modules, as these respond very differently to budget pressure.
