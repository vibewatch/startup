callouts:
  - calloutType: strength
    title: IDEA Compliance Mandate Creates Non-Discretionary Revenue Floor
    body: >-
      Federal IDEA requires every school district to document IEPs and Section 504 plans for approximately
      14 percent of enrolled students, creating non-discretionary software spending that persists through
      budget cycles. PowerSchool's Special Programs platform—anchored by the largest-ever state-level deal
      with Indiana DOE in 2024—sits squarely in this protected spend category. Unlike discretionary EdTech
      tools that face cancellation risk post-ESSER, IDEA compliance documentation is a legal obligation.
      This insulates a meaningful portion of PowerSchool's ARR from the post-ESSER budget compression
      that is compressing growth for adjacent EdTech vendors.
    claimRefs:
      - CM019
      - CM030

  - calloutType: risk
    title: December 2024 Breach Is a Material Market Constraint Through 2026
    body: >-
      The December 2024 data breach—exposing 62 million student records and 9.5 million teacher records—is
      the largest known breach of children's data in US history and directly undermines PowerSchool's
      market position in procurement evaluations where data security is now the top scoring factor.
      The attacker's return to extort individual districts after ransom payment extends the reputational
      damage beyond a single incident. The Future of Privacy Forum de-listing, state attorney general
      inquiries, and class action filings create legal and contractual review obligations for existing
      customers. Districts evaluating SIS replacement in 2026 will weight this breach prominently.
      The severity is compounded by the fact that PowerSchool's product is mission-critical and stores
      the most sensitive data a district holds.
    claimRefs:
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036

  - calloutType: risk
    title: Analyst TAM Divergence Signals Sizing Ambiguity; Market Is Mature, Not Greenfield
    body: >-
      Analyst K-12 SIS estimates range from $0.2B (US SIS contracts bottom-up) to $41B (broad global K-12
      student management). Investors applying the wide end of this range to PowerSchool will significantly
      overstate greenfield opportunity. PowerSchool's $720M ARR against a well-bounded North American K-12
      platform SAM of $1–$2.4B implies penetration of 30–72%, characteristic of a mature, consolidating
      market rather than an early-stage growth opportunity. Net revenue retention of 107% shows existing
      customer expansion is the primary growth vector, not market penetration. Valuation should be sized
      against realistic ARR growth rate and EBITDA margin expansion, not a notional multi-billion TAM.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM010
      - CM016
      - CM017

