callouts:
  - calloutType: strength
    title: Embedded market position with high switching costs
    body: >-
      PowerSchool's penetration of more than 90 of the top 100 US school districts and 60M+ students across
      90+ countries, combined with a 106.7% Net Revenue Retention Rate, reflects deep workflow embedding that
      creates durable recurring revenue. School districts face high data-migration friction when switching
      student information systems, making the customer base structurally sticky regardless of the breach fallout.
    claimRefs:
      - CO028
      - CO030
      - CO031
  - calloutType: risk
    title: December 2024 data breach is the defining risk of the analysis
    body: >-
      The breach is not a contained incident. It exposed sensitive data on approximately 62 million students
      and 9.5 million teachers, the attacker has been convicted but the stolen data remains unrecovered,
      multiple state attorneys general have opened investigations, class action lawsuits are active, and the
      Future of Privacy Forum revoked PowerSchool's privacy certification. The exposed data includes Social
      Security numbers and medical records, creating identity-theft exposure that will persist for the lifetime
      of affected children. This is the single largest adverse event in the company's history and cannot be
      treated as a resolved matter for diligence purposes.
    claimRefs:
      - CO034
      - CO035
      - CO036
      - CO038
      - CO039
      - CO041
      - CO042
  - calloutType: insight
    title: Post-take-private opacity limits diligence on current financials
    body: >-
      As a private company since October 2024, PowerSchool no longer files periodic financial disclosures.
      The most recent public financials are FY2023 results published in February 2024. FY2024 and FY2025
      revenue, ARR, margin, and headcount are unavailable to outside analysts. Any diligence effort must
      request management data-room access to assess whether the growth trajectory from the public period
      continued through the breach disruption and CEO transition.
    claimRefs:
      - CO005
      - CO026
      - CO027

