  topStrengths:
    - SIS 地位强势，覆盖 18,000+ 个客户组织，州级报送形成很深的切换成本
    - K-12 平台宽度足，横跨 SIS、LMS、测评、特殊项目、沟通和升学准备，具备交叉销售空间
    - LBO 前 SaaS 质量扎实，ARR 增长 18%，NRR 达 107%，调整后 EBITDA 利润率为 33-35%
  topRisks:
    - 美国 K-12 已知最大学生数据泄露案留下诉讼、监管和信任责任
    - 2024 年 10 月私有化后，私募信贷支持的 LBO 债务条款和偿债覆盖情况仍未披露
    - ESSER 退坡后的学区预算压力叠加管理层交接，在缺乏披露时可能削弱续约和扩张
  unresolvedGaps:
    - LBO 后债务规模、定价、契约、摊还和到期安排尚未公开
    - FY2024-FY2025 审计财务，以及泄露事件后的 NRR / 总留存指标均不可得
    - 公开证据无法量化最终泄露准备金、保险赔付或 MDL-3142 和解敞口
