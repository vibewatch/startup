chapter:
  number: 2
  title: Market Analysis
  summary: India's renewable energy market is roughly $68B in 2026 and projected toward $200-226B by the mid-2030s; Greenko competes in the fast-growing firm, round-the-clock power-plus-storage slice, where its IRES capability is differentiated but the serviceable market is capped by grid, land, and DISCOM constraints.
sections:
- id: market-boundary
  title: Defining and Bounding the Market
  body: 'Before sizing the opportunity, the market boundary must be defined. For Greenko, the relevant market is India''s clean-power economy: utility-scale solar and wind generation, hydro, pumped and battery storage, round-the-clock and hybrid firm-power products, commercial-and-industrial open-access renewables, and the emerging green hydrogen and ammonia adjacency served through its AM Green platform. The boundary deliberately includes spend on new capacity and on long-term energy payments under power purchase agreements, plus storage capacity and firming services. It excludes rooftop-only residential solar, captive diesel, and all fossil generation, which are either out of Greenko''s served model or are the status-quo substitute the company displaces. The status-quo alternative to round-the-clock renewable power is fossil baseload — coal and gas — supplemented by grid balancing; Greenko''s IRES proposition is precisely to substitute that fossil firmness with stored renewables. Defining the boundary this way matters because the headline "India renewable market" figure mixes capacity, revenue, and investment lenses that are not interchangeable. By fixing scope to firm and intermittent generation plus storage and green molecules, the sizing that follows can be expressed in consistent revenue terms and can isolate the higher-value firm-power slice where Greenko actually competes, rather than claiming the entire market as addressable.'
  claimRefs:
  - CM001
  - CM002
  - CM023
  - CM024
  - CM019
