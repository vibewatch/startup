- id: drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: The market is shaped by powerful tailwinds and equally real friction. On the driver side, India's 500 GW non-fossil target and renewable purchase obligations create durable structural demand; storage mandates embedded in auctions expand the firm-power segment that rewards Greenko's IRES capability; continually falling levelized costs and record-low battery tariffs improve project economics; and the national green hydrogen mission opens an entirely new green-molecule demand pool. Renewable power in India is now broadly cost-competitive with, or cheaper than, new fossil generation on a levelized basis, removing the historic price objection. Against these, the constraints are concrete and mostly physical and financial rather than demand-related. Transmission bottlenecks and interconnection queues threaten to curtail or strand a meaningful share of the pipeline; land acquisition remains slow and contentious at gigawatt scale; and the chronic financial weakness of several DISCOMs creates payment-delay and receivables risk for developers. Independent analysts such as IEEFA warn that grid and land constraints could strand part of India's renewable build-out, which is why this report treats the serviceable obtainable market as constrained more by transmission and execution capacity than by demand. The investment implication is that Greenko's storage differentiation and execution track record are precisely the attributes that determine how much of the large demand pool it can actually convert.
