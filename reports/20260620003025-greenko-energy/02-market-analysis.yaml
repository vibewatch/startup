- id: sizing
  title: Sizing the Opportunity Across Multiple Lenses
  body: 'India''s renewable energy market was estimated at roughly $68 billion in 2026 and is projected by various analysts to reach approximately $200-226 billion by the mid-2030s, implying a compound annual growth rate that estimates place anywhere between about 8% and 14% depending on scope and methodology. These figures should be read as a band, not a point: published estimates diverge widely because some count only generation revenue while others fold in transmission, storage, and equipment. To triangulate, this chapter uses three independent lenses. The revenue lens gives the dollar figures above. The capacity lens shows India operating on the order of 220-275 GW of installed renewable capacity in 2026, having added a record ~44 GW of solar and ~6 GW of wind in FY2026, en route to a national 500 GW non-fossil target for 2030. The investment lens shows large and rising FDI, sovereign green bonds, and IEA projections that India will be among the largest sources of incremental global renewable investment this decade. Within this whole, the serviceable market that matters for Greenko is the firm, round-the-clock power-plus-storage slice — a fast-growing subset estimated in the tens of billions of dollars annually but lacking a clean published figure. Greenko''s realistically obtainable share, given roughly 10 GW operational and a 20+ GW pipeline, is a low-double-digit percentage of new firm-power awards.'
