- id: buyers-and-adoption
  title: Buyers, Payers, and the Adoption Path
  body: 'The buyer landscape in India''s clean-power market is concentrated and largely institutional. The dominant buyers are state distribution companies (DISCOMs) and central nodal agencies — chiefly the Solar Energy Corporation of India (SECI) and NTPC — which run reverse auctions and sign long-term power purchase agreements; they own the procurement budget and set the adoption trigger through renewable purchase obligations and, increasingly, storage mandates. A growing second buyer class is industrial corporates procuring green power through open access and corporate PPAs to meet decarbonisation goals, typically a higher-margin segment. A third, nascent buyer class is the green-ammonia offtaker — exemplified by AM Green''s agreements with Uniper and Yara — that monetises renewables as exportable molecules. The adoption path for the firm-power product Greenko leads with runs from auction tender to award (letter of award), to financing and PPA signing, to construction, and finally to commissioning under a multi-year contract. Crucially, SECI''s round-the-clock and hybrid tenders signal explicit institutional demand for exactly the storage-firmed product Greenko''s IRES platform delivers, and auction storage mandates expand the serviceable market directly toward that capability. Buyer concentration, however, cuts both ways: dependence on a handful of DISCOM and central counterparties creates receivables and payment-delay exposure that the financials and customers chapters examine.'
  claimRefs:
  - CM008
  - CM009
  - CM010
