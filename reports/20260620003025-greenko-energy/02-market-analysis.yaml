  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-divergence
    missingEvidence: Published estimates of India's renewable market size and CAGR diverge widely (roughly $68B in 2026 with 8-14% CAGR) because scope definitions differ.
    whyItMatters: The TAM anchor materially affects Greenko's share math and the valuation multiple applied later in the report.
    diligencePath: Normalize estimates to a single scope (utility-scale generation + storage revenue) and reconcile against CEA capacity data and investment flows.
    relatedQuestionRefs:
    - QM003
    - QM004
    - QM018
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: sam-firm-power
    missingEvidence: There is no clean published figure for the serviceable market specific to firm, round-the-clock renewable power plus large-scale storage that Greenko targets.
    whyItMatters: Greenko's premium positioning depends on the size of the firm-power slice, not the whole renewable market.
    diligencePath: Build a bottom-up SAM from SECI/NTPC RTC and hybrid tender volumes and storage-mandated auction pipelines.
    relatedQuestionRefs:
    - QM006
    - QM029
    relatedTableRefs:
    - TM002
