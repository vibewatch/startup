- id: technology-architecture
  title: Technology and Operating Architecture
  body: 'Technically, Greenko''s IRES is a layered system. At the base sits variable generation — utility-scale solar and wind farms. Above that is the differentiating layer: pumped-hydro storage, which works by using surplus daytime renewable power to pump water into an upper reservoir, then releasing it through turbines to dispatch firm power when needed, typically at a round-trip efficiency of around 70-80% and with multi-hour discharge duration that short-duration batteries cannot economically match. A control layer of digital energy-management and dispatch-optimization software schedules the firm 24/7 supply, although the sophistication of this software is company-claimed and not independently audited. The portfolio spans wind, solar, conventional hydro, and pumped-hydro storage across more than 14 states, with IRES projects in Andhra Pradesh, Karnataka, and Madhya Pradesh and a total IRES portfolio of roughly 5.2 GW planned. Greenko''s edge derives less from any single proprietary technology than from integrated engineering know-how: the ability to site, permit, and build gigawatt-scale pumped storage with the requisite land and water-resource access, and to integrate it with generation for firm dispatch. Pinnapuram is positioned among the world''s largest renewable-plus-storage projects. The architecture extends downstream into electrolysis and ammonia synthesis, making Greenko''s stack span generation, storage, dispatch control, offtake, and green molecules — an unusually vertically integrated clean-energy system.'
  claimRefs:
