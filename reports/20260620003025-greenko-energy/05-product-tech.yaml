- id: am-green-molecules
  title: 'AM Green: Storage-Enabled Green Molecules'
  body: 'Greenko''s most ambitious technological extension is the AM Green platform, which uses renewable power firmed by IRES storage to produce green hydrogen and ammonia. AM Green targets 5 MTPA of green ammonia by 2030, with its first 1 MTPA plant under construction at Kakinada, Andhra Pradesh, and commissioning expected in the second half of 2026. The technical backbone is electrolysis: AM Green and Belgian engineering group John Cockerill are building a 2 GW/year electrolyzer manufacturing gigafactory JV at Kakinada, with John Cockerill supplying gigawatt-scale electrolysis equipment for hydrogen production that is then synthesized into ammonia. This vertical integration — localizing electrolyzer supply to reduce import dependency — is a deliberate cost and supply-security strategy. The green ammonia is primarily destined for export to decarbonize hard-to-abate industries globally, and AM Green has already signed offtake agreements with Uniper of Germany and Yara Clean Ammonia of Norway, validating commercial demand. The green hydrogen-to-ammonia chain, however, depends on a tightly coupled set of inputs: firm renewable power, reliable water supply, electrolyzers, and ammonia synthesis units, each a potential bottleneck. The platform is genuinely differentiated as an early mover, but it is also where Greenko''s technology is least proven — gigawatt-scale electrolysis remains capital-intensive and unproven at sustained commercial loads, making Kakinada''s commissioning a pivotal technical test.'
  claimRefs:
