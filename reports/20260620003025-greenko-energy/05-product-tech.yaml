chapter:
  number: 5
  title: Product & Technology
  summary: 'Greenko''s product is firm 24/7 renewable power via its IRES model — co-located solar and wind plus large-scale pumped-hydro storage (Pinnapuram: 4 GW solar + 1 GW wind + 1.68 GW / ~10 GWh pumped hydro) — extended downstream into green hydrogen and ammonia via AM Green (1 MTPA Kakinada plant, 2 GW/yr John Cockerill electrolyzer JV, Uniper/Yara offtake); storage tech is mature and differentiating while green molecules are a higher-risk early-mover bet.'
sections:
- id: core-product
  title: 'The Core Product: Firm Renewable Power'
  body: 'Greenko''s core product is not electricity per se but firmness — round-the-clock, dispatchable clean power delivered through its Integrated Renewable Energy Storage (IRES) model. In customer-workflow terms, Greenko solves the defining problem of renewables: solar and wind are intermittent, but grid operators, distribution companies, and especially industrial users need power they can schedule. IRES combines co-located solar and wind generation with large-scale pumped-hydro storage to convert variable output into firm, 24/7 supply. The flagship Pinnapuram project in Andhra Pradesh embodies the model, combining 4,000 MW of solar, 1,000 MW of wind, and 1,680 MW of pumped-hydro storage that delivers roughly 10,080 MWh — about 10 GWh — of storage per cycle, all for total investment of about USD 4.2 billion. The product serves multiple customer workflows: state DISCOMs needing firm renewable supply, hard-to-abate industries such as green steel and aluminium needing carbon-free power, and — increasingly — co-located green-hydrogen and ammonia production that needs continuous renewable electricity. The strategic significance is that as grids saturate with cheap-but-intermittent solar, the scarce and valuable product becomes firmness, and Greenko has built its entire technology stack around supplying exactly that. Pinnapuram alone is projected to avoid about 3.3 million tonnes of CO2 per year, underscoring the scale at which the product operates.'
