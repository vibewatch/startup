- id: maturity-risk-quality
  title: Maturity, Execution Risk, and Quality Controls
  body: Assessed by maturity, Greenko's technology splits into two halves. Pumped-hydro storage and renewable generation are mature, proven technologies where Greenko's differentiation is execution depth rather than novel science; pumped hydro in particular offers long-duration firming that is harder and slower to replicate than battery storage, lending durability to Greenko's moat. The green-molecule half — electrolysis and ammonia synthesis at gigawatt scale — is emerging and carries materially higher execution risk. On the storage side, pumped-storage construction carries geological, hydrological, and timeline risks that have already contributed to commissioning delays flagged by rating agencies, and the flagship assets remain in advanced construction and commissioning rather than fully operational. On the molecule side, electrolyzer reliability at sustained commercial loads is unproven. The reliability of Greenko's headline 24/7 promise therefore hinges on completing storage assets and demonstrating sustained dispatch performance — data that is not yet publicly verified. Quality and safety governance follows infrastructure-grade hydropower engineering standards and grid-code compliance, while green ammonia exports must meet international low-carbon certification and ammonia-handling safety standards that are still maturing. The balanced technical verdict is that Greenko owns a genuinely differentiated, well-engineered storage platform with a high-potential but unproven green-molecule extension, and that its central technology risk is execution and commissioning rather than fundamental technical feasibility.
