- id: scenarios-stance
  title: Scenarios, Sensitivity, and Valuation Stance
  body: 'Valuation is highly sensitive to two variables: the EV/EBITDA multiple applied and the FY26-FY27 EBITDA ramp from forecast group EBITDA of about USD 770 million. Applying a range of multiples to that EBITDA base spans roughly USD 6 billion at 8x to nearly USD 12 billion at 15x on an enterprise basis, before netting consolidated debt — which is why leverage is such a powerful determinant of equity value. Framed as scenarios, the base case values Greenko around USD 7.5 billion, in line with the AM Green/ORIX deal and a gradual EBITDA ramp; the bull case exceeds USD 10 billion if the storage and green-ammonia assets commission on time, deleveraging proceeds below 8x, and the multiple holds; and the bear case falls below USD 6 billion if refinancing is costly, commissioning slips further, and multiples compress. DCF intuition reinforces the picture: Greenko''s value is dominated by long-life contracted cash flows discounted against heavy near-term capex and leverage, so the timing of the capex-to-cash inflection drives the answer. The cap table — GIC at about 58%, ADIA about 14%, and AM Green about 25% after the ORIX purchase — concentrates ownership among aligned, sovereign-grade holders. On balance, the valuation stance is fair: at roughly USD 7.5 billion Greenko is neither clearly cheap nor expensive, with leverage capping near-term equity value but sovereign backing limiting downside.'
  claimRefs:
