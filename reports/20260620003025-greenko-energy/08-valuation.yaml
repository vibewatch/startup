- id: valuation-comps
  title: Current Valuation and Comparables
  body: 'Greenko''s valuation is anchored by a concrete, recent data point: the June 2025 secondary transaction in which AM Green acquired ORIX''s 17.5% stake for about USD 1.28-1.4 billion, implying a group valuation of roughly USD 7.3-7.5 billion. This is the most relevant benchmark for a private company that does not trade publicly. Triangulating against listed comparables supports that this is a reasonable, not stretched, mark. NTPC Green Energy — the closest public proxy on capacity, at about 10.1 GW — carries a market capitalisation of roughly USD 9.7-9.8 billion at a forward EV/EBITDA near 29.6x for FY26 declining toward 15x by FY27. Adani Green, far larger at 19.3 GW, commands about USD 29 billion in market cap and near USD 37 billion enterprise value at roughly 30x EV/EBITDA, reflecting a scale-and-growth premium. ReNew, US-listed on about 12.6 GW, has been valued in the USD 4-7 billion range at roughly 14-20x. Against this set, Greenko''s roughly USD 7.5 billion sits close to NTPC Green''s market cap on a similar operational base, and its implied multiple is broadly in line with listed peers given its FY26 EBITDA. The important caveat is that renewable EV/EBITDA multiples have been compressing as rates and leverage bite, which lowers the comparable benchmarks and argues for entry discipline rather than chasing the headline number.'
  claimRefs:
  - CV004
  - CV005
