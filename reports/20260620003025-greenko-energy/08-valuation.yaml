- id: recommendation-exit
  title: Recommendation, Exit, and Diligence Asks
  body: 'The analysis supports a qualified buy with medium confidence and a medium risk rating, an overall investment score around 7.2 out of 10, and a fair valuation stance. The case is asymmetric in an attractive way: sovereign support from GIC and ADIA bounds the downside, while successful execution on storage and green molecules offers meaningful upside above the current mark. The most realistic exit is a public listing — Greenko is weighing an IPO as it scales storage and green hydrogen, and a listing would both provide liquidity and supply a public valuation benchmark that reduces the private-valuation discount — though the IPO timeline remains uncertain, having been considered and deferred before. The implied hold is medium-to-long term, with returns tied to the deleveraging-and-commissioning inflection through FY27. The recommendation is explicitly conditional, and the diligence framework converts that conditionality into monitorable kill criteria: a failed or punitive 2026 bond refinancing, sustained commissioning delays, collapse of the storage/green-molecule premium, or withdrawal of sponsor support would each break the thesis. Before committing capital, the priority diligence asks are audited consolidated financials, the 2026 bond refinancing terms, PPA tariff and receivables data, the project commissioning schedule, and the cap-table waterfall and preference structure. Cleared satisfactorily, these would convert the qualified buy into a high-conviction one; left open, they are the reason confidence is medium rather than high.'
