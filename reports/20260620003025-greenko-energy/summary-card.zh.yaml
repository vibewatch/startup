summary:
  headline: Greenko 是印度最重要的民营可再生能源平台，IRES 储能技术稀缺，主权资本背书也强；但高杠杆和项目交付悬在头上，约 USD 7.5B 估值只能算合理不算便宜，投资逻辑押注 FY26-FY27 投产和去杠杆计划能兑现。
