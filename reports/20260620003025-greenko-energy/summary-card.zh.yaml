  topStrengths:
    - 印度最大的民营可再生能源平台，运营装机 10+ GW，在 14+ 个邦拥有 20+ GW 储备项目
    - 专有 IRES 技术（抽水蓄能）可提供 24/7 可调度可再生电力，是稀缺、难复制的差异化能力
    - GIC（约 58%）和 ADIA（约 14%）等主权资本背书强，提供资本稳定性、信用和融资通道
    - AM Green 绿色氢 / 氨平台已锁定 Uniper 和 Yara offtake，把业务伸向高增长的全球出口市场
    - 稳定电力需求是结构性顺风：SECI / DISCOM 全天候招标，奖励的正是 Greenko 储能能交付的 firm power
  topRisks:
    - 杠杆高（约 15.3x），2026 年 3 月到期的约 USD 940M 美元债需要再融资，带来再融资和偿债压力风险
    - 项目执行和投产延误已触发 Fitch 和 CARE 在 2025 年下调评级，EBITDA 爬坡也被推后
    - 客户集中在政府对手方（SECI、NTPC、DISCOMs），DISCOM 付款延迟风险持续存在
    - 创始人 Anil Chalamalasetty 和 Mahesh Kolli 掌握大部分机构知识和关系，关键人集中度高
    - 绿色氢 / 氨市场仍早期，GW 级电解的成本和可靠性还没有在商业负荷下跑通
  unresolvedGaps:
    - 经审计合并财务报表未公开；收入、EBITDA 和净债务仍是未验证估算
    - 2026 美元债再融资的详细条款、定价和兜底安排披露不完整
    - 主要客户的 PPA 电价、合同期限和 DISCOM 应收账款账龄未公开
    - 驱动去杠杆路径的逐项目投产计划未披露
    - IPO 时间表和结构，以及 AM Green / ORIX 交易完整条款，仍不确定
