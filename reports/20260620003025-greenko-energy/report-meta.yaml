  topStrengths:
    - "Largest private renewable energy platform in India with 10+ GW operational and 20+ GW pipeline across 14+ states"
    - "Proprietary IRES technology (pumped-hydro storage) offering 24/7 dispatchable renewable power — a scarce, hard-to-replicate differentiator"
    - "Strong sovereign backing from GIC (~58%) and ADIA (~14%) providing capital stability, credibility, and funding access"
    - "AM Green green hydrogen/ammonia platform with Uniper and Yara offtake diversifies into a high-growth global export market"
