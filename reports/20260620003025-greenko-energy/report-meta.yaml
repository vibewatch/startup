  foundingLocation: "Hyderabad, India"
  headquarters: "Hyderabad, India"
  productSummary: "Integrated Renewable Energy Storage (IRES) systems combining solar, wind, and large-scale pumped hydro storage to deliver 24/7 dispatchable clean power, sold to central agencies (SECI, NTPC) and state DISCOMs under long-term PPAs; the group is also developing green hydrogen and ammonia via its AM Green platform (1 MTPA Kakinada plant, 2 GW/yr John Cockerill electrolyzer JV) with offtake to Uniper and Yara."
  customerFocus: "State electricity distribution companies (DISCOMs), the Solar Energy Corporation of India (SECI), and NTPC, plus large industrial and green-hydrogen consumers in India; future green ammonia exports to European and global buyers such as Uniper and Yara."
  businessModel: "Long-term power purchase agreements (PPAs) with central agencies and state utilities combining fixed capacity charges and variable energy charges, increasingly with a round-the-clock firm-power premium; expanding into green-molecule (hydrogen/ammonia) production and export."
  stage: "Late-Stage Private"
  fundingStatus: "No traditional VC funding rounds; majority-owned by GIC (~58%) and ADIA (~14%), with the promoters' AM Green vehicle at ~25% after acquiring ORIX's 17.5% stake in mid-2025. The June 2025 AM Green/ORIX secondary implied a ~USD 7.3-7.5B group valuation; the group also drew a ₹62B (~USD 740M) NaBFID credit facility in July 2024 and carries ~USD 7.37B of consolidated debt."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO006, CO007, CO008, CO011]
