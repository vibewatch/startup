companyProfile:
  summary: "Greenko Energy is India's largest private renewable energy company, founded in 2007 by Anil Kumar Chalamalasetty and Mahesh Kolli. The company operates over 10 GW of renewable capacity across wind, solar, and hydro assets in 14+ Indian states, and is pioneering Integrated Renewable Energy Storage (IRES) — a proprietary model combining solar, wind, and pumped hydro storage to deliver 24/7 dispatchable clean power, anchored by the flagship Pinnapuram project (4 GW solar + 1 GW wind + 1.68 GW pumped hydro). Backed by GIC (Singapore, ~58%), ADIA (~14%), and the promoters' AM Green vehicle (~25%), Greenko targets 50+ GW of capacity and 100 GWh of daily storage by 2030, while extending into green hydrogen and ammonia via AM Green. The June 2025 AM Green/ORIX secondary implied a group valuation near USD 7.5 billion, but the group carries elevated leverage (~15.3x) and a near-term dollar-bond refinancing."
  foundedDate: "2007-01-01"
  founders:
    - name: "Anil Kumar Chalamalasetty"
      role: "CEO & Co-founder"
      background: "Entrepreneur with prior experience in infrastructure and carbon-credit/energy ventures; co-founded Greenko in 2007 and leads strategy, capital markets, and sovereign-investor relationships."
      claimRefs: [CO001, CO004]
    - name: "Mahesh Kolli"
      role: "President & Co-founder"
