      - number: '3.3'
        title: 定位、资本与竞争威胁
        blocks:
          - type: paragraph
            body: >-
              把同业放到多个竞争维度上看，可以看清 Greenko 赢在哪里、暴露在哪里。原始装机规模和成本领先方面，Adani Green 是领先者，Greenko
              位于中游，意味着结构性成本和规模劣势会压制电价。储能和稳定性方面，Greenko 是领先者，支撑其稳定电力溢价定位。资本稳定性方面，Greenko 的主权股东（GIC 和 ADIA）与 NTPC Green
              的公共部门背书都很强；但 Greenko 缺少上市同业 NTPC Green 和 ReNew 拥有的公共市场资本入口和可见估值货币——NTPC Green 的 IPO 甚至为三角测算 Greenko
              价值提供了有用公开基准。绿色分子可选性方面，Greenko 通过 AM Green 领先。主要威胁很清楚：更大的对手能比 Greenko 建得更多、融资更多，Adani 的投运速度正在拉大纯装机差距，JSW 和
              Tata 进入储能直接冲击 Greenko 的细分优势。对抗这些威胁，Greenko 的防线是抽水蓄能执行深度、跨 14 个以上邦的地域多元化（相对 Adani 集中在
              Khavda），以及在合格竞争者很少的稳定电力拍卖中的定价权。平衡后的结论是，Greenko 最适合被定义为储能差异化挑战者——短期内可防守，但需要持续执行，并最终获得资本市场入口，才能在规模领先者面前守住位置。
