  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险总览
        blocks:
          - type: paragraph
            body: >-
              Greenko
              的风险画像可以概括为：高质量、长寿命资产，在强股东支持下承载过渡期杠杆和执行风险。按发生可能性和影响排序，最严重的风险是高杠杆与再融资、项目执行和投运延迟，以及对政府交易对手的依赖。前两项紧密相连，也正是
              Fitch 和 CARE 在 2025 年下调评级的明确触发因素：合并债务约 USD 7.37 billion、杠杆接近 15.3x；本应拉升 EBITDA
              的储能和水电资产只要投运滑坡，就会直接恶化已经吃紧的资产负债表。传导机制很机械——执行延迟推迟
              EBITDA，而债务服务继续发生，杠杆和覆盖率恶化，再融资压力和进一步下调评级的风险上升，资本成本也随之抬升。这个反馈环是整个投资案例中最重要的风险动态。头部风险之下，还有一层层监管、运营、合作伙伴、人员和市场风险，每一项都可能单独拖慢项目或伤害现金流。在当前缓释措施之后——主要是股东资本、资产投运和主动再融资——剩余风险为中高，仍由杠杆和执行主导。总体剩余风险评级为中等：资产和股东确实强，但被资产负债表和交付风险显著抵消。
