  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Greenko 的投资逻辑很清晰：它是印度最领先的储能加固可再生能源平台，靠深度抽水蓄能把间歇性太阳能和风能转成稳定、24/7 可调度电力；同时通过 AM Green 获得绿色分子期权，并有 GIC 和 ADIA
              的主权支持提供稳定性。印度采购结构转向全天候和稳定电力招标后，Greenko 的差异化正好落在最重要的维度上；其抽水蓄能深度稀缺，也难以复制。反向逻辑同样清楚，必须认真对待：Greenko 杠杆约
              15.3x，2026 年美元债存在再融资压力；绿氢期权仍处早期，尚未在商业规模证明；公开披露薄；项目执行延迟已经触发 Fitch 和 CARE 下调评级。规模和成本上，它落后于 Adani
              Green。因此，估值争论本质上是资产质量与资产负债表加执行风险的对抗：储能和主权溢价是真实的，但只有 Greenko 证明 FY26-FY27
              投运与去杠杆计划，这个溢价才会落地。审慎分析师的说法是，Greenko 的溢价取决于执行和去杠杆——这正是整个建议的支点。
            claimRefs:
              - CV001
              - CV002
              - CV020
              - CV030
              - CV035
              - CV036
