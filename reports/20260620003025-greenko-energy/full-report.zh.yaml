      - number: '1.2'
        title: 创始人、领导层与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Greenko 由两位联合创始人领导：Anil Kumar Chalamalasetty 担任首席执行官，Mahesh Kolli 担任总裁。Chalamalasetty
              是公司的战略和资本市场门面，负责维护主权投资者和贷款人关系；Kolli
              则负责运营和项目执行。近二十年来，这对组合一直是稳定的创始人搭档，但也把机构知识、贷款人关系和战略方向集中在两个人身上——这是尽调必须权衡的实质性关键人依赖。2025 年，这种集中进一步加深：创始人通过 AM
              Green 载体收购 ORIX 的 17.5% 股权，将创始人控制的持股提高到约 25%，并在主权股东之外进一步巩固影响力。创始人之外，公司对更广泛高管团队和完整董事会构成的公开披露很薄，Greenko
              也不发布经审计的合并财务报表。私营、印度加 Mauritius 的控股结构，再叠加创始人控制权上升，确实带来少数投资者利益一致性和透明度问题；但 GIC 约 58%
              的持股也提供了强有力的机构制衡。对外部投资者而言，治理图景因此是在可信的主权资本监督、创始人集中和有限公开报告之间取得平衡。
