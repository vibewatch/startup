      - number: '5.2'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              从技术上看，Greenko 的 IRES 是一套分层系统。底层是可变发电——公用事业规模太阳能和风电场。上面是差异化层：抽水蓄能，利用日间富余可再生电力把水抽到上水库，再按需通过水轮机放水发电，通常往返效率约
              70-80%，且具备短时长电池难以经济匹配的多小时放电能力。控制层由数字能源管理和调度优化软件组成，用来排程稳定的 24/7 供给，尽管软件复杂度是公司声称，尚未独立审计。组合覆盖 14
              个以上邦的风电、太阳能、常规水电和抽水蓄能，IRES 项目位于 Andhra Pradesh、Karnataka 和 Madhya Pradesh，规划 IRES 总组合约 5.2 GW。Greenko
              的优势不太来自某一项单独的自有技术，而是来自一体化工程经验：能找到场址、拿到许可、建设吉瓦级抽水蓄能，获取必要土地和水资源，并把它与发电资产集成，实现稳定调度。Pinnapuram
              被定位为全球最大的可再生能源加储能项目之一。架构还向下游延伸到电解和氨合成，使 Greenko 的技术栈覆盖发电、储能、调度控制、承购和绿色分子——这是少见的垂直一体化清洁能源系统。
