      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              这个市场同时被强劲顺风和真实摩擦塑造。驱动端，印度 500 GW 非化石目标和可再生能源采购义务创造了持久结构性需求；拍卖内嵌的储能强制要求扩大了稳定电力板块，奖励 Greenko 的 IRES
              能力；持续下降的平准化成本和创纪录低位的电池电价改善项目经济性；国家绿氢使命则打开了全新的绿色分子需求池。印度可再生电力按平准化口径看，已大体与新增化石发电竞争，甚至更便宜，历史上的价格反对理由正在消失。相对地，约束很具体，主要是物理和财务问题，而非需求不足。输电瓶颈和并网排队可能导致相当一部分管线被限电或搁浅；吉瓦级项目的土地获取仍慢且争议大；多家
              DISCOM 长期财务脆弱，给开发商带来付款延迟和应收账款风险。IEEFA
              等独立分析机构警告，电网和土地约束可能搁浅印度部分可再生能源建设，因此本报告认为，可服务可获得市场更多受输电和执行能力限制，而不是清洁电力需求限制。投资含义是，Greenko
              的储能差异化和执行记录，正是决定它能把多大需求池真正转化为项目的关键属性。
