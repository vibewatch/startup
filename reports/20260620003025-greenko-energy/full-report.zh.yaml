      - number: '7.4'
        title: 缓释、监控与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              与投资最相关的问题，不是 Greenko 有没有风险——风险显然存在——而是风险能否监控、是否已有缓释。杠杆和再融资方面，主要缓释是股东资本、储能和水电资产投运以抬升 EBITDA，以及主动再融资；GIC
              的支持对融资准入形成实质支撑。执行方面，里程碑式资本开支和 EPC 管理是抓手。因此，尽调框架应把每个主要风险转化为可监控的投资逻辑破裂触发点：2026
              年美元债再融资失败或条件惩罚性；投运连续多个季度继续滑坡；股东支持撤回或稀释；绿氨购电经济性崩塌；或 DISCOM
              应收账款持续恶化。提示风险上升的监控指标很具体，也能跟踪——杠杆趋势、利息覆盖率、项目投运里程碑、再融资进展与定价、DISCOM 应收账款账龄。近期最尖锐的财务风险仍是 2026
              年美元债再融资，它正处在杠杆与股东支持问题的交汇点。平衡结论是，Greenko
              的风险真实存在，并集中在杠杆和执行；但这些风险也识别清楚，大多由时间驱动，并有缓释措施和主权级股东支撑——这正是剩余风险评级落在中等而非高位的原因，前提是 FY26-FY27 投运与再融资计划能够执行。
