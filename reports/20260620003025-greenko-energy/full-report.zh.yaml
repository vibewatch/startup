      - number: '7.2'
        title: 监管、法律与运营风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律层面，Greenko 面临的风险覆盖环境许可、土地收购、电网规范合规、披露义务，以及 AM Green
              的绿氨出口认证。大型水电和抽水蓄能项目尤其敏感：环境许可条件和土地收购争议可能拖慢时间表，抽水蓄能水库也会引发用水和生态担忧，从而招致反对或监管条件。电价和政策修订风险发生概率较低，但影响很高；一旦采购框架变化，稳定电力收入可能被压缩。私人集团结构也带来治理透明度风险：经审计财务和合同条款公开披露有限，增加了尽调难度；行业审计机构也点名过可再生能源采购和
              DISCOM
              欠款问题。运营上，项目投运延迟是最高优先级风险，因为它会直接传导到财务；其次是在复杂地形中水电建设成本超支、电网限发和输电约束可能让已完工资产也无法充分实现收入，以及少数超大型项目集中了产能，放大了单点扰动的影响。资产可靠性靠基础设施级工程管理，但仍暴露于天气和电网事件。监管与运营风险的共同线索是时间：多数风险表现为延迟或收入折扣，回流到杠杆与再融资循环，而不是项目彻底失败。
