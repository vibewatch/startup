      - number: '1.5'
        title: 里程碑、轨迹与可投资性快照
        blocks:
          - type: paragraph
            body: >-
              Greenko 近二十年的轨迹很清晰：2007 年成立并早期进入 AIM 时代公共资本市场，2016 年 GIC 战略投资奠定主权资本持股，随后 ADIA 入场，装机推进到 10 GW，2024 年获得
              NaBFID 融资并发布 Pinnapuram 全球最大一体化可再生能源储能项目，2025 年 ORIX 退出并在隐含 $7.5 billion 估值下巩固创始人控制权，2026 年通过 AM Green 的
              Kakinada 工厂推进绿氨。这个时间线显示，公司反复把机构资本转化成实体基础设施，而且靠储能做出差异化。从可投资性快照看，Greenko
              在规模、资本支持和技术差异化上得分很高，但在披露和杠杆风险上明显较弱：公司不发布经审计的合并财务报表，债务负担重，还面临持续的大额资本开支。预期 IPO 自 2023 年起就被讨论，但截至 2026
              年年中仍然延期且没有确认日期，关键的流动性和透明度催化剂尚未兑现。总体看，Greenko 是一家战略重要、资本充足的国家级冠军；主要尽调缺口在财务透明度、杠杆和治理集中，而不是商业相关性或规模。
