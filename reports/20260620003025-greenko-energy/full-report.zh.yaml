      - number: '4.3'
        title: 资产负债表、杠杆与再融资
        blocks:
          - type: paragraph
            body: >-
              Greenko 的风险集中在资产负债表。到 2025 年 3 月财年末，合并总债务升至约 USD 7.37 billion，较一年前的 USD 5.26 billion 大幅上升，债务 / EBITDA 杠杆从
              10.8x 推高到约 15.3x。公司持有约 USD 860 million 现金，对应约 USD 1.3 billion 流动到期债务，其中最紧迫的是 2026 年 3 月到期、约 USD 940
              million 的美元债。公司在 2025 年年中开始为这笔到期债务再融资，并在 2025 年 8 月委任 Nomura 配售 INR 6 billion 债务，IRR 约
              16%——这个高成本显示融资窗口偏紧。2024 年 7 月获得的 ₹6,200 crore（约 USD 740 million）NaBFID 额度，说明 Greenko 仍能获得大型基础设施信贷；多数股东 GIC
              的强力赞助支持，也撑起了高于平均水平的融资入口。即便如此，2026 年债券再融资仍是实质性短期压力，FY27 前杠杆降至 8x 以下的去杠杆路径仍有条件、尚未证明。资产负债表结论是：Greenko
              用高质量长寿命资产承受过渡性、资本开支驱动的杠杆压力——有股东支持时可承受，但若投运进一步滑延或再融资市场收紧，风险就会真实暴露。
