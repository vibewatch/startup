      - number: '5.4'
        title: 成熟度、执行风险与质量控制
        blocks:
          - type: paragraph
            body: >-
              按成熟度看，Greenko 的技术分成两半。抽水蓄能和可再生能源发电是成熟、经过验证的技术，Greenko 的差异化在执行深度，而不是新科学；尤其是抽水蓄能提供长时稳定能力，比电池储能更难、更慢复制，让
              Greenko
              的护城河更耐久。绿色分子一半——吉瓦级电解和氨合成——仍在兴起，执行风险实质更高。储能端，抽水蓄能建设带有地质、水文和时间表风险，这些风险已促成评级机构提示的投运延误；旗舰资产仍处于高级建设和投运阶段，而非完全运营。分子端，电解槽在持续商业负荷下的可靠性尚未证明。因此，Greenko
              24/7
              承诺能否兑现，取决于储能资产完工以及持续调度表现——这些数据尚未公开验证。质量和安全治理遵循基础设施级水电工程标准和电网规范合规；绿氨出口还必须满足仍在成熟中的国际低碳认证和氨处理安全标准。平衡后的技术结论是，Greenko
              拥有真正差异化、工程扎实的储能平台，并叠加一个高潜力但未被证明的绿色分子延伸；其核心技术风险是执行和投运，而不是底层技术可行性。
