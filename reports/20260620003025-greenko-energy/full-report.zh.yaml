  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品：稳定可调度的可再生电力
        blocks:
          - type: paragraph
            body: >-
              Greenko 的核心产品严格说不是电本身，而是稳定性——通过 Integrated Renewable Energy Storage（IRES）模式交付的全天候、可调度清洁电力。从客户工作流看，Greenko
              解决的是可再生能源的定义性难题：太阳能和风能间歇，但电网运营商、配电公司，尤其是工业用户，需要可排程的电力。IRES 把同址太阳能和风电与大型抽水蓄能结合起来，把波动出力转成稳定的 24/7 供给。Andhra
              Pradesh 的旗舰 Pinnapuram 项目体现了这个模式：4,000 MW 太阳能、1,000 MW 风电和 1,680 MW 抽水蓄能，每个循环交付约 10,080 MWh——约 10
              GWh——储能，总投资约 USD 4.2 billion。这个产品服务多个客户工作流：需要稳定可再生能源供给的邦级
              DISCOM、绿色钢铁和铝等难减排行业需要无碳电力，以及越来越多需要连续可再生电力的同址绿氢和绿氨生产。战略意义在于，当电网被便宜但间歇的太阳能逐步填满，稀缺且有价值的产品就变成稳定性；Greenko
              已围绕供应这一点搭建了整个技术栈。仅 Pinnapuram 一项预计每年就能避免约 330 万吨 CO2，凸显产品运行的规模。
            claimRefs:
              - CE001
