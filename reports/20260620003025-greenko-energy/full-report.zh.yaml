            body: >-
              印度约 $68B 的可再生能源市场很大，但 Greenko 竞争的是 SECI 的 RTC 和混合招标正在创造的全天候、储能稳电切片。储能强制要求把这个高溢价板块直接推向 Greenko 的 IRES
