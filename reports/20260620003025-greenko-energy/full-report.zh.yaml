    layout: standard
    data:
      items:
        - label: 按 ~USD 770M EBITDA 计算的 15x
          value: 11.6
          unit: USD B EV
        - label: 12x
          value: 9.2
          unit: USD B EV
        - label: 10x
          value: 7.7
          unit: USD B EV
        - label: 8x
          value: 6.2
          unit: USD B EV
    summary: 将一组 EV/EBITDA 倍数应用于约 USD 770 million 的 FY26 集团 EBITDA 预测，得到企业价值敏感性。
    approximationNotes: 使用预测 EBITDA 的示意性敏感性；股权价值还需扣除合并债务。
