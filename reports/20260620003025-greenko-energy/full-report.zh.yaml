      - number: '6.4'
        title: 集中度、交易对手风险与结论
        blocks:
          - type: paragraph
            body: >-
              Greenko 客户侧最大的风险，是政府相关交易对手集中。购电高度偏向 SECI 和 NTPC，这提升了交易对手信用质量，却也形成依赖：一旦政府采购放缓或政策优先级变化，风险会放大。DISCOM
              付款延迟进一步叠加这一问题；尽管 Late Payment Surcharge 规则带来改善，付款拖延仍是可再生能源开发商的结构性风险，让 Greenko
              应收账款暴露于各邦公用事业财务健康不均。稳定电力市场本身也出现压力信号：2025 年 5 月，SECI 的 1,200 MW RTC 招标在电价收紧下只授予 420 MW；RTC
              招标也出现认购不足，Greenko 将中标转化为运营供电的管线面临风险。这些风险有部分缓冲。覆盖 14 个以上邦分散了邦级敞口；中央机构中介模式降低了单一 DISCOM 风险；向 C&I
              稳定电力和出口绿氨拓展，扩大了渠道基础；采购向稳定电力的结构性转向，也有利于 Greenko 的一体化模式。平衡看，Greenko 的客户证明真实且已达到电力生产级，长 PPA
              让留存结构性偏高，增长受政策支持——但客户基础集中在政府交易对手，应收账款暴露于 DISCOM 付款及时性，出口氨需求的耐久性仍需在投产后验证。
