            body: >-
              分析支持有条件买入，置信度中等、风险评级中等，整体投资评分约 7.2/10，估值立场为公允。这个案例具备有吸引力的非对称性：GIC 和 ADIA
              的主权支持框住下行，而储能和绿色分子的成功执行，能在当前估值之上提供有意义的上行。最现实的退出是公开上市——Greenko 在扩张储能和绿氢时正权衡
              IPO，上市既能提供流动性，也能给出公开估值基准，降低私人估值折价——但 IPO 时间表仍不确定，此前也曾考虑后推迟。隐含持有期为中长期，回报取决于 FY27
              前后的去杠杆与投运拐点。建议是明确有条件的，尽调框架把这些条件转成可监控的否决标准：2026 年债券再融资失败或条件惩罚性、投运持续延迟、储能 /
              绿色分子溢价崩塌，或股东支持撤回，都会打破投资逻辑。投入资本前，优先尽调事项是经审计合并财务、2026 年债券再融资条款、PPA
              电价和应收账款数据、项目投运计划，以及股权结构分配瀑布和优先权结构。若这些问题令人满意地厘清，有条件买入可以提升为高确信度买入；若继续悬而未决，置信度就只能停留在中等。
