      - number: '8.2'
        title: 当前估值与可比公司
        blocks:
          - type: paragraph
            body: >-
              Greenko 的估值有一个具体且近期的数据点锚定：2025 年 6 月的二级交易中，AM Green 以约 USD 1.28-1.4 billion 收购 ORIX 的 17.5% 股权，对应集团估值约 USD
              7.3-7.5 billion。对一家不公开交易的私人公司而言，这是最相关的基准。与上市可比公司交叉验证，也支持该估值合理、并未拉得过高。NTPC Green Energy 是容量上最接近的公开代理，约 10.1
              GW；其市值约 USD 9.7-9.8 billion，FY26 远期 EV/EBITDA 接近 29.6x，到 FY27 降向 15x。Adani Green 规模大得多，达到 19.3 GW，市值约 USD
              29 billion、企业价值接近 USD 37 billion，EV/EBITDA 约 30x，体现规模和增长溢价。ReNew 在美国上市，容量约 12.6 GW，估值曾在 USD 4-7 billion
              区间，倍数约 14-20x。放在这组公司中，Greenko 约 USD 7.5 billion 的估值接近 NTPC Green 在类似运营基础上的市值；按 FY26 EBITDA
              看，隐含倍数也大体符合上市同行。关键限制是，利率和杠杆开始咬人，可再生能源 EV/EBITDA 倍数已经压缩，这会压低可比基准，也意味着进入价格必须有纪律，不能追逐表面估值。
