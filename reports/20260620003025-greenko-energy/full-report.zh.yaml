  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 定义和圈定市场
        blocks:
          - type: paragraph
            body: >-
              在测算机会之前，必须先定义市场边界。对 Greenko 来说，相关市场是印度清洁电力经济：公用事业规模太阳能和风电、水电、抽水和电池储能、全天候与混合稳定电力产品、商业和工业开放接入可再生能源，以及通过 AM
              Green 平台服务的绿氢和绿氨邻接业务。这个边界有意纳入新装机支出、购电协议下的长期能源付款，以及储能容量和稳电服务。它排除仅面向住宅屋顶的太阳能、自备柴油和所有化石发电；这些要么不在 Greenko
              的服务模型内，要么是公司要替代的现状方案。全天候可再生电力的现状替代品是化石基荷——煤电和燃气——再配合电网调节；Greenko 的 IRES
              主张正是用储能可再生能源替代这种化石稳定性。这样定义边界很重要，因为“印度可再生能源市场”的总括数字混合了装机、收入和投资视角，彼此不能直接互换。把范围固定在稳定和间歇性发电、储能与绿色分子之后，后续规模测算才能用一致的收入口径表达，并隔离出
              Greenko 实际竞争的高价值稳定电力切片，而不是把整个市场都称为可服务市场。
