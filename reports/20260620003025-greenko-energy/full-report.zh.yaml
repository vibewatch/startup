      - number: '4.4'
        title: 信用评级、披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              2025 年评级机构动作一致偏谨慎。Fitch 在 2025 年 12 月将 Greenko 长期外币 IDR 下调至 'BB-'，展望稳定，理由是项目执行延误压制现金流和信用指标；CARE Ratings
              同月也出于类似原因将 Greenko Energies 下调至 CARE A; Stable / CARE A1；Moody's 更早提示，高资本开支和不确定的增量收入会使指标在 FY26
              仍保持负面。三家机构观点一致，本身就是信号：约束项是执行和杠杆，而非资产质量。披露又进一步加大分析难度。Greenko 是私营集团，不发布经审计的合并财务报表、详细 PPA 电价条款、项目级 IRR
              或完整债务到期表，尽调不得不高度依赖评级机构摘要和分析师估计。整体财务结论是平衡的：Greenko
              拥有高质量、长寿命、政府合同锁定的资产，收入质量确实强；但它处在过渡阶段，承担高企且由资本开支驱动的杠杆，依赖股东支持和成功再融资，公开透明度有限。决定性的尽调问题是，FY26-FY27
              投运和去杠杆计划能否按预测执行。
