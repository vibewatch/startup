companyProfile:
  summary: >-
    Greenko Energy 是印度最大的私营可再生能源公司，由 Anil Kumar Chalamalasetty 和 Mahesh Kolli 于 2007 年创立。公司在印度 14 个以上邦运营超过 10 GW
    的风电、太阳能和水电装机，并率先推进 Integrated Renewable Energy Storage（IRES）——一种把太阳能、风能和抽水蓄能结合起来、交付 24/7 可调度清洁电力的自有模式，旗舰项目
    Pinnapuram 包含 4 GW 太阳能、1 GW 风电和 1.68 GW 抽水蓄能。GIC（新加坡，约 58%）、ADIA（约 14%）以及创始人的 AM Green 载体（约 25%）为 Greenko
    提供股东支持；公司目标到 2030 年达到 50+ GW 装机和 100 GWh 日储能，并通过 AM Green 延伸到绿氢和绿氨。2025 年 6 月 AM Green/ORIX 二级交易隐含集团估值接近 USD 7.5
    billion，但集团杠杆偏高（约 15.3x），且短期面临美元债再融资。
