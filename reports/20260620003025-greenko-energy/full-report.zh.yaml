  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              印度可再生能源行业由一小批大型开发商领跑，Greenko 与它们竞争。按 2026 年运营装机看，Adani Green Energy 以约 19.3 GW 明显领先，仅 FY2026 就新增超过 5
              GW——这是中国以外全球最快的扩张之一——并以 2030 年达到 50 GW 为目标，其中 Gujarat 的 Khavda 超大型项目计划到 2029 年达到 30 GW。ReNew 约 12.6
              GW，是印度最大的纯可再生能源同业；Tata Power Renewables 在更大集团组合内约 11.6 GW；NTPC Green Energy 这个公共部门冠军约 10.07 GW。Greenko
              运营装机约 10 GW，大体与 NTPC Green 持平，但原始吉瓦数落后于 Adani 和 ReNew。第二梯队包括 JSW Energy、Azure Power 和
              Sembcorp。前四大开发商合计控制印度运营可再生能源装机约 19%，剩余市场仍然分散。关键细节在于，装机排名只讲了一部分故事：竞争战场正在从名义吉瓦数转向稳定、可排程供给；在这个维度上，Greenko
              的位置明显强于其中游装机排名所暗示的水平。
