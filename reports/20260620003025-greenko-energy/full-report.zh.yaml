  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Greenko 主要通过长期购电协议把可再生能源资产货币化，收入由固定容量费和可变电量费组成；随着储能资产投运，又越来越多叠加全天候稳定电力溢价。承购方以政府相关交易对手为主——SECI、NTPC
              和邦级配电公司——PPA 期限通常为 20 到 25 年，给 Greenko 带来很强收入可见度，但也让公司暴露在拍卖竞争驱动的电价压力下。在报告实体层面，Greenko Energies Private
              Limited FY2025 收入约 ₹2,930 crore，同比约增长 13%；不过这个单体数字低估了集团规模，因为发电收入分散在众多项目 SPV 中。分析师估计集团收入运行率约 USD 500-650
              million，但公司并未正式披露。货币化模式本质上由拍卖驱动：Greenko 通过 SECI
              和邦级稳定电力招标赢得容量，然后获得基于可用性的容量付款和电量费；新兴的全天候和储能挂钩招标，使它能够为可调度供给收取溢价，而纯间歇性同业无法提供这种供给。未来的收入层来自 AM Green 绿色分子平台，面向
              Uniper 和 Yara 的氨承购将从 2026 年下半年开始。核心保留意见仍是披露：Greenko 主要合同的具体电价和期限并不公开，因此收入质量只能从交易对手组合和 PPA 年限推断，无法直接验证。
