      - number: '1.4'
        title: 规模、IRES 平台与 AM Green 邻接业务
        blocks:
          - type: paragraph
            body: >-
              Greenko 最具体的资产就是规模：超过 10 GW 运营中的可再生能源装机，另有 20 GW 以上在建或开发中，并宣称到 2030 年装机超过 50 GW、日储能达到 100 GWh。战略差异化来自
              Integrated Renewable Energy Storage 平台，旗舰是 Andhra Pradesh 的 Pinnapuram 项目——约 4 GW 太阳能、1 GW 风电和 1.68 GW
              抽水蓄能，可交付约 10 GWh 日储能吞吐量。IRES 把间歇性发电稳定成可排程电力，使 Greenko
              能销售全天候清洁电力；这种能力是印度少数同业难以匹配的，也吸引了部长级政府关注。在核心可再生能源业务旁边，创始人的 AM Green 平台正在打造全球最大绿氨业务之一，目标到 2030 年达到每年 500
              万吨，首个 1 MTPA 工厂位于 Kakinada，正在建设中，目标 2026 年下半年投运。AM Green 已与德国 Uniper 和挪威 Yara Clean Ammonia
              签署承购协议，让更广泛的集团获得全球脱碳出口需求敞口。规模、储能 IP 和绿色分子邻接业务，共同定义了 Greenko 的投资命题。
