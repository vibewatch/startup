      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              印度清洁电力市场的买方集中，且主要是机构。主导买方是邦级配电公司（DISCOM）和中央节点机构——主要是 Solar Energy Corporation of India（SECI）和
              NTPC——它们组织反向拍卖并签署长期购电协议，掌握采购预算，并通过可再生能源采购义务以及越来越多的储能强制要求设定采用触发点。第二类增长中的买方是工业企业，它们通过开放接入和企业 PPA
              采购绿电以满足脱碳目标，通常利润率更高。第三类仍处早期的买方是绿氨承购方，AM Green 与 Uniper 和 Yara 的协议就是例子，它把可再生能源货币化为可出口分子。Greenko
              主打的稳定电力产品采用路径是：拍卖招标、授标（letter of award）、融资和签署 PPA、建设，最后在多年合同下投运。关键在于，SECI 的全天候和混合招标明确显示，机构需求正指向 Greenko
              IRES 平台交付的储能稳电产品；拍卖中的储能强制要求也直接把可服务市场扩到这一能力上。不过，买方集中是一把双刃剑：依赖少数 DISCOM 和中央交易对手，会带来应收款和付款延迟风险，财务和客户章节会进一步审视。
