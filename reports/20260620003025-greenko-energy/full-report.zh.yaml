    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Greenko Energy Holdings 以 Greenko Group 名义经营，由 Anil Kumar Chalamalasetty 和 Mahesh Kolli 于 2007 年创立，总部位于印度
              Hyderabad，控股实体注册在 Mauritius。公司早期开发生物质和小水电资产，曾短暂在伦敦 AIM 市场上市，之后整合为一家由主权资本支持的私营可再生能源平台。如今，Greenko
              通常被视为印度最大的私营可再生能源公司，在印度 14 个以上邦运营超过 10 GW 的风电、太阳能和水电装机。它最核心的战略押注是 Integrated Renewable Energy
              Storage（IRES）：把太阳能、风电和大型抽水蓄能组合起来，把间歇性可再生能源转成面向电网和工业买家的稳定、全天候可调度电力。公司的收入主要来自与邦级配电公司、SECI 和 NTPC
              等中央机构以及不断增加的工业买家签订长期购电协议。这个身份——有规模、靠储能做差异化、由机构资本持有的开发商——是后续从市场规模到估值各章反复使用的底层事实。不过，公司的多司法辖区结构和私营状态也意味着，相比上市同业，公开财务透明度有限。
