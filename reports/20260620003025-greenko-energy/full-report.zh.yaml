      - number: '3.2'
        title: Greenko 的差异化与护城河
        blocks:
          - type: paragraph
            body: >-
              Greenko 的竞争身份不是单纯规模，而是储能带来的稳定性。它的 Integrated Renewable Energy Storage
              模式把太阳能、风电和大型抽水蓄能结合起来，交付全天候可调度电力，今天很少有对手能在运营上匹配。多数大型竞争对手更强调在新增装机上叠加电池储能，Greenko
              则领先在深度、多小时抽水蓄能；这种能力更难、更慢复制，给护城河带来一定耐久性。SECI 和 DISCOM
              的储能挂钩、全天候招标现在奖励稳定供给，而纯间歇性投标无法提供这种供给，因此这一差异化越来越值钱，也为一体化玩家创造结构性顺风。在一张正面能力矩阵里，Greenko 在全天候稳定电力、抽水蓄能和通过 AM
              Green 延伸的绿色分子邻接业务上评分最高；但在原始运营规模以及关键的公共资本获取上评分较低，因为公司仍是私营。护城河真实但也被争夺：Adani、Tata Power 和 JSW Energy
              等资本充足的对手正在投资电池和抽水蓄能，它们更快的装机节奏和更深的资本池意味着，如果 Greenko 不能保持执行领先，其一体化储能先发优势可能在几年内被削弱。因此投资问题是：储能深度加绿色分子可选性，能否抵消
              Greenko 在规模和资本可见度上的劣势。
