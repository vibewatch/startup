      - number: '6.3'
        title: 合同结构、留存与需求创造
        blocks:
          - type: paragraph
            body: >-
              Greenko 的客户关系经济性由长周期合同决定。SECI 全天候 PPA 通常采用 build-own-operate 模式，期限 25 年，预计在 PPA 签署后约 24 个月开始供电。长合同给
              Greenko 带来异常高的合同留存：资产投运后，客户已按约定条款锁定数十年的购电，流失风险很低。中央机构中介模式进一步支撑留存，提供稳定交易对手；土地扩张式合作也让 Greenko 能从同一批机构继续拿到
              RTC 和稳定电力容量。合同对运营要求很高：RTC PPA 设定需求履约率——大约月度 75%、年度 80%、峰时 90%——供电短缺罚则很重，Greenko 的储能交付因此压力更大。需求侧，National
              Green Hydrogen Mission 是强政策驱动，正在创造新的稳定可再生电力需求，NTPC-Greenko
              交易就是例证。留存的主要限制不是流失，而是现金：合同锁定度高，但回款及时性取决于交易对手财务健康；DISCOM 付款行为虽在 Late Payment Surcharge
              规则下改善，仍会影响这些高黏性关系的现金质量。
