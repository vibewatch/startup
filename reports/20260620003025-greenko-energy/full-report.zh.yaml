      - number: '5.3'
        title: AM Green：由储能支撑的绿色分子
        blocks:
          - type: paragraph
            body: >-
              Greenko 最雄心勃勃的技术延伸是 AM Green 平台，它使用 IRES 储能稳定后的可再生电力生产绿氢和绿氨。AM Green 目标到 2030 年达到 5 MTPA 绿氨，首个 1 MTPA 工厂位于
              Andhra Pradesh 的 Kakinada，正在建设中，预计 2026 年下半年投运。技术骨架是电解：AM Green 与比利时工程集团 John Cockerill 正在 Kakinada 建设 2
              GW/年电解槽制造超级工厂合资项目，John Cockerill
              提供吉瓦级制氢电解设备，随后将氢合成为氨。这种垂直一体化——本地化电解槽供应以降低进口依赖——是有意为之的成本和供应安全策略。绿氨主要面向出口，为全球难减排行业脱碳；AM Green 已与德国 Uniper
              和挪威 Yara Clean Ammonia
              签署承购协议，验证了商业需求。不过，绿氢到绿氨链条依赖一组紧密耦合的投入：稳定可再生电力、可靠供水、电解槽和氨合成装置，每一项都可能成为瓶颈。平台作为早期进入者确实有差异化，但也是 Greenko
              技术中最未被证明的部分——吉瓦级电解仍然资本密集，且尚未在持续商业负荷下得到验证，Kakinada 投运因此是关键技术测试。
