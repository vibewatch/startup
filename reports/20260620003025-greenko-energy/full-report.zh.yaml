      - number: '2.2'
        title: 用多重视角测算机会
        blocks:
          - type: paragraph
            body: >-
              印度可再生能源市场在 2026 年估计约 $68 billion，多家分析机构预计到 2030 年代中期将达到约 $200-226 billion，隐含 CAGR 因范围和方法不同大约在 8% 到 14%
              之间。这些数字应被看作区间，而不是单点：公开估算差异很大，因为有的只计算发电收入，有的把输电、储能和设备也纳入。为交叉验证，本章使用三个独立视角。收入视角给出上述美元数字。装机视角显示，印度 2026
              年已安装可再生能源装机约 220-275 GW，FY2026 新增创纪录的约 44 GW 太阳能和约 6 GW 风电，并正迈向 2030 年 500 GW
              非化石能源国家目标。投资视角显示，FDI、主权绿色债券规模大且持续上升，IEA 也预计印度将是本十年全球新增可再生能源投资的最大来源之一。在这个整体内，对 Greenko
              真正重要的可服务市场，是稳定、全天候电力加储能的切片——一个快速增长、估计每年达数百亿美元但缺乏清晰公开数字的子集。Greenko 约 10 GW 运营装机和 20+ GW
              管线意味着，它在新增稳定电力授标中现实可获得的份额是低双位数百分比。
