      - number: '8.3'
        title: 情景、敏感性与估值立场
        blocks:
          - type: paragraph
            body: >-
              估值对两个变量高度敏感：适用的 EV/EBITDA 倍数，以及 FY26-FY27 EBITDA 从预测集团 EBITDA 约 USD 770 million 开始的爬坡。把一组倍数套在这条 EBITDA
              基础上，企业价值从 8x 的约 USD 6 billion 到 15x 的接近 USD 12 billion 不等，且还未扣除合并债务——这就是杠杆对股权价值如此关键的原因。按情景看，基准情景给 Greenko
              约 USD 7.5 billion 估值，与 AM Green/ORIX 交易和逐步 EBITDA 爬坡一致；牛市情景在储能和绿氨资产按时投运、去杠杆降至 8x 以下且倍数保持时，估值超过 USD 10
              billion；熊市情景则在再融资成本高、投运继续滑坡、倍数压缩时跌破 USD 6 billion。DCF 直觉也强化了这一图景：Greenko
              的价值主要来自长寿命合同现金流，但需要用沉重的近期资本开支和杠杆去折现，因此资本开支转向现金流的时点决定答案。股权结构——ORIX 交易后 GIC 约 58%、ADIA 约 14%、AM Green 约
              25%——把所有权集中在利益一致的主权级持有人手中。总体看，估值立场是公允：约 USD 7.5 billion 的 Greenko 既不明显便宜，也不明显昂贵；杠杆压制近期股权价值，但主权支持限制下行。
