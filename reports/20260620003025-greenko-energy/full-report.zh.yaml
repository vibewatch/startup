      - number: '7.3'
        title: 合作伙伴、人员与市场风险
        blocks:
          - type: paragraph
            body: >-
              Greenko 的依赖和人员风险集中在少数关键关系上。资本端，集团高度依赖大股东 GIC 的股东支持；这有利于融资准入，但也是集中依赖，一旦支持撤回或被稀释，将触发投资逻辑破裂。技术端，AM Green
              的绿氨爬坡依赖 John Cockerill 电解槽 JV，设备供应集中在单一技术伙伴；GW 级电解本身也尚未在持续商业负荷下证明。购电端，SECI、NTPC 和 DISCOM
              的交易对手风险重点在付款及时性，而不是合同履约；DISCOM 财务压力虽有改革方案，仍未消失。人员风险由创始人关键人集中主导：Anil Chalamalasetty 和 Mahesh Kolli
              掌握大量机构知识和关系，快速多 GW
              扩张也会挤压管理和工程带宽。市场端，绿氢和氨机会仍处早期，成本和需求不确定；电解槽和电力成本需要进一步下降，且下降幅度尚未被保证，出口氨还面临目的地市场认证风险。美元债带来的汇率风险又叠加一层，需要对冲；对冲有成本，若不完整，还可能侵蚀利润率。单看任何一项都未必致命，但合在一起，会扩大
              Greenko 执行与去杠杆计划的结果区间。
