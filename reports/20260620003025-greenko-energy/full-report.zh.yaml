  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Greenko 的客户压倒性地是机构和政府相关方，而不是零售客户。客户基础分成四组：中央采购机构——主要是 Solar Energy Corporation of India（SECI）和
              NTPC——签署长期购电协议并转售给下游买方；邦级配电公司（DISCOM）直接或通过 SECI 在 14 个以上邦取电；通过开放接入服务的、正在增长的商业和工业（C&I）稳定电力板块；以及 AM Green
              绿色分子业务的绿氨出口买家。SECI 是关键交易对手，它作为信用更强的中央中介，在建设-拥有-运营模式下与开发商签署 25 年 PPA，并通过跨邦输电系统送电，使开发商免于直接承受单个邦级 DISCOM
              较弱的资产负债表。中央机构中介结构有战略意义，因为它把 Greenko
              的承购集中到主权相关交易对手，降低对邦级公用事业参差不齐财务健康的暴露；但也引入另一种集中：高度依赖少数政府相关买方。随着工业开放接入对稳定可再生电力的需求加速，C&I
              板块是新兴多元化机会；出口氨板块虽然仍未投产，却给传统国内电力承购基础之外增加了一个完全不同、国际化分散的客户池。
