      - number: '1.3'
        title: 所有权、资本结构与 2025 年 ORIX 退出
        blocks:
          - type: paragraph
            body: >-
              Greenko 的资本结构由两家主权财富基金托住：新加坡 GIC 是最大股东，持股约 58%；Abu Dhabi Investment Authority 持股约 14%。近期最关键的资本事件发生在 2025 年
              6-7 月：创始人的 AM Green 平台以约 $1.28-1.4 billion 从日本 ORIX Corporation 手中收购 Greenko 17.5% 股权，隐含企业估值约 $7.3-7.5
              billion。交易将 ORIX 直接持股降至约 2.5%；同时，ORIX 估计向 AM Green 可转债再投资 $731-750
              million，保留对创始人绿氢和绿氨雄心的间接敞口。这更像一次战略性资本再配置：ORIX 从成熟可再生能源股权撤出，转向下一代绿色分子平台。债务端，Greenko 在 2024 年 7 月从 NaBFID 获得
              ₹62 billion（约 $740 million）信贷额度，这是支撑其建设扩张的多笔大型基础设施融资之一；公司据称总债务超过 ₹300 billion。隐含 $7.5 billion
              估值和主权资本加创始人的股权结构，是估值章会详细审视的锚点；杠杆情况则进入财务和风险章节。
