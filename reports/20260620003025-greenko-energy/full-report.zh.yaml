      - number: '6.2'
        title: 具名客户验证与采用
        blocks:
          - type: paragraph
            body: >-
              Greenko 的客户验证是真实的，在电力业务中已经达到生产级。旗舰案例是 2024 年 7 月的里程碑式购电协议：NTPC Renewable Energy 向 Greenko 采购 1,300 MW
              全天候供给，分为两个 650 MW 阶段，明确用于支持 National Green Hydrogen Mission，为 Greenko 自己的绿氢和绿氨设施供电。除 NTPC 外，SECI 提供多吉瓦 RTC
              和稳定电力承购，邦级 DISCOM 在 14 个以上邦接收运营供给——这些合在一起构成真正的生产级合同验证，而非试点。采用轨迹显示出清晰转变：从 2020-2022 年早期 SECI 全天候招标中标，到 2024
              年里程碑式 NTPC 交易，再到 2025 年与德国 Uniper 和挪威 Yara Clean Ammonia 签署绿氨承购协议，最后进入 2026 年稳定电力和氢业务爬坡。不过，不同板块的验证质量不同。来自
              NTPC 和 SECI 的电力承购是生产级且合同稳固；与 Uniper 和 Yara 的绿氨承购虽然具有战略意义、验证了早期需求，但在 Kakinada 工厂 2026
              年下半年投运前仍处于投产前状态。按客户验证看，Greenko 在当前现金流最关键的地方（稳定电力）最强，在增长可选性所在的地方（绿色分子）则更偏前瞻。
