      - number: '4.2'
        title: 利润率、单位经济与资本强度
        blocks:
          - type: paragraph
            body: >-
              Greenko 的经济模型属于资本密集型基础设施开发商：资产寿命长，一旦投运就能产生高利润率、稳定现金流，但每兆瓦前期资本投入很大，因此项目建设期会压低近期报告回报。集团 FY2025 EBITDA 估计约
              USD 470 million；Fitch 预计 FY2026 将升至约 USD 770 million，受 Andhra Pradesh 抽水蓄能和 Teesta 水电项目爬坡带动——约 USD 300
              million 的增量完全取决于这些已延期资产能否按期投运。因此，单位经济的关键是时间：资本开支已经发生，但相应收入和 EBITDA 要等到投运后才跟上，这正是今天报告利润率和覆盖倍数看起来吃紧的原因。FY25
              净利息覆盖率较弱，约 0.8-0.9x；预计 FY26 恢复至约 1.4x，FY27 起高于 1.8x。管理层和评级机构明确把 FY25-FY26 定义为过渡年份；去杠杆命题——FY27 杠杆降至 8x
              以下——取决于已经滑延过一次的执行能否兑现。对尽调而言，关键单位经济问题不是资产是否优质（它们寿命长且有合同锁定），而是把资本开支转化为现金的投运时间表能否守住。
