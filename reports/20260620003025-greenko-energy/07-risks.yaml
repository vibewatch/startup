company:
  name: Greenko Energy
chapter:
  number: 7
  title: Risks
  summary: Greenko's dominant risks are a leverage-and-refinancing loop (debt ~USD 7.37B, ~15.3x, a ~USD 940M 2026 dollar bond) driven by project-execution delays that triggered 2025 Fitch and CARE downgrades, plus regulatory/land/clearance, grid-curtailment, government-counterparty, key-person (founders), forex, and nascent green-hydrogen risks; risks are concentrated but monitorable and backed by strong sponsors, leaving residual risk at medium.
sections:
- id: severity-ranked
  title: Severity-Ranked Risk Overview
  body: 'Greenko''s risk profile is best understood as high-quality, long-life assets carrying transitional leverage and execution risk under strong sponsorship. Ranked by likelihood and impact, the most severe risks are high leverage and refinancing, project-execution and commissioning delays, and dependence on government counterparties. The first two are tightly linked and were the explicit triggers for the 2025 rating downgrades by Fitch and CARE: with consolidated debt of about USD 7.37 billion and leverage near 15.3x, any slippage in commissioning the storage and hydro assets that are meant to lift EBITDA directly worsens an already-stretched balance sheet. The transmission mechanism is mechanical — execution delay defers EBITDA while debt-service obligations continue, which worsens leverage and coverage, which raises refinancing pressure and the risk of further downgrades, which in turn raises the cost of capital. This feedback loop is the single most important risk dynamic in the entire investment case. Beneath these headline risks sit a layered set of regulatory, operational, partner, people, and market risks, each of which can independently delay projects or impair cash flows. After current mitigations — chiefly sponsor capital, asset commissioning, and active refinancing — the residual risk is moderate-to-high and dominated by leverage and execution. The overall residual risk rating is medium: genuinely strong assets and sponsors, materially offset by balance-sheet and delivery risk.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR016
  - CR017
  - CR027
  - CR037
  - CR039
  figureRefs:
  - FR001
  - FR002
- id: regulatory-operational
  title: Regulatory, Legal, and Operational Risk
  body: 'On the regulatory and legal front, Greenko faces risks spanning environmental clearances, land acquisition, grid-code compliance, disclosure obligations, and — for AM Green — green-ammonia export certification. Large hydro and pumped-storage projects are particularly exposed: environmental clearance conditions and land-acquisition disputes can delay timelines, and pumped-hydro reservoirs raise water-use and ecological concerns that can attract opposition or regulatory conditions. Tariff and policy-revision risk, though lower-likelihood, carries high impact because it could compress firm-power revenue if procurement frameworks change. The private-group structure also creates a governance-transparency risk: limited public disclosure of audited financials and contract terms complicates diligence, and sector audit bodies have flagged renewable-procurement and DISCOM-dues issues. Operationally, project commissioning delay is the highest-priority risk given its direct financial transmission, followed by hydropower construction cost overruns in difficult terrain, grid curtailment and transmission constraints that can limit realised revenue even from completed assets, and the concentration of capacity in a few mega-projects that amplifies the impact of any single-site disruption. Asset reliability is managed through infrastructure-grade engineering but remains exposed to weather and grid events. The common thread across regulatory and operational risk is timing: most of these risks manifest as delays or revenue haircuts that feed back into the leverage-and-refinancing loop rather than as outright project failures.'
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR015
  - CR020
  - CR021
  - CR022
  - CR031
  - CR034
