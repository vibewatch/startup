  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commissioning-schedule
    missingEvidence: Greenko does not publish a project-by-project commissioning schedule with confidence intervals.
    whyItMatters: Execution timing is the central transmission channel from operational delay to financial stress.
    diligencePath: Obtain a detailed, milestone-level commissioning schedule and independent EPC progress reports under diligence.
    relatedQuestionRefs:
    - QR002
    - QR016
  - type: private-evidence-only
    severity: material
    topic: refinancing-plan
    missingEvidence: The detailed plan, pricing, and committed backstops for refinancing the 2026 dollar bonds are not fully public.
    whyItMatters: Refinancing of the 2026 maturity is the most acute near-term financial risk to the thesis.
    diligencePath: Secure the refinancing term sheet, sponsor support letters, and liquidity backstops from management.
    relatedQuestionRefs:
    - QR003
    - QR026
    relatedTableRefs:
    - TR005
