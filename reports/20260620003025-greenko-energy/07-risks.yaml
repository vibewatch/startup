callouts:
- calloutType: risk
  title: Leverage-execution feedback loop is the core risk
  body: Execution delay defers EBITDA while debt service continues, worsening ~15.3x leverage, raising refinancing pressure and downgrade risk, and lifting the cost of capital. This loop, not asset quality, is Greenko's central risk.
  claimRefs:
  - CR002
  - CR003
  - CR016
  - CR037
- calloutType: risk
  title: Concentrated sponsor and key-person dependencies
  body: Greenko leans heavily on GIC sponsor capital and on founders Anil Chalamalasetty and Mahesh Kolli. Withdrawal of sponsor support or loss of key founders would be thesis-break events.
  claimRefs:
  - CR009
  - CR010
  - CR019
  - CR030
- calloutType: insight
  title: Risks are real but monitorable and timing-driven
  body: Most of Greenko's risks manifest as delays or revenue haircuts that feed the leverage loop rather than outright failures. Clear monitoring indicators — leverage, coverage, commissioning milestones, refinancing pricing, DISCOM dues — make the residual risk medium and trackable.
