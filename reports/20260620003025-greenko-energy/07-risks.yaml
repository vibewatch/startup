- id: mitigations-triggers
  title: Mitigations, Monitoring, and Thesis-Break Triggers
  body: 'The investment-relevant question is not whether Greenko has risks — it plainly does — but whether they are monitorable and mitigated. On leverage and refinancing, the principal mitigations are sponsor capital, the commissioning of storage and hydro assets to lift EBITDA, and active refinancing, with GIC''s support materially underpinning funding access. On execution, milestone-based capex and EPC management are the levers. The diligence framework should therefore translate each major risk into a monitorable thesis-break trigger: a failed or punitive refinancing of the 2026 dollar bonds; further multi-quarter commissioning slippage; withdrawal or dilution of sponsor support; a collapse in green-ammonia offtake economics; or sustained deterioration in DISCOM receivables. The monitoring indicators that signal rising risk are concrete and trackable — leverage trend, interest-coverage ratio, project-commissioning milestones, refinancing progress and pricing, and DISCOM receivables ageing. The most acute near-term financial risk remains the 2026 dollar-bond refinancing, which sits at the convergence of the leverage and sponsorship questions. The balanced conclusion is that Greenko''s risks are real and concentrated in leverage and execution, but they are also well-identified, largely timing-driven, and backed by mitigations and sovereign-grade sponsors — which is precisely why the residual risk rating lands at medium rather than high, conditional on the FY26-FY27 commissioning-and-refinancing plan executing.'
  claimRefs:
  - CR018
  - CR019
  - CR023
  - CR025
  - CR029
  - CR030
  - CR036
