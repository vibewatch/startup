    severity: minor
    topic: hedging-policy
    missingEvidence: Greenko's forex-hedging policy and coverage ratio on dollar debt are not publicly disclosed.
    whyItMatters: Unhedged forex exposure could erode margins on dollar-denominated debt.
    diligencePath: Review the treasury hedging policy and outstanding hedge coverage under diligence access.
