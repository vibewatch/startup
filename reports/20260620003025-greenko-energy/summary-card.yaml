summary:
  headline: >-
    Greenko is India's foremost private renewable energy platform with unmatched IRES storage technology and strong
    sovereign backing, but a leverage-and-execution overhang means its ~USD 7.5B valuation is fair rather than cheap,
    and the investment case hinges on delivering its FY26-FY27 commissioning-and-deleveraging plan.
