  topStrengths:
    - Largest private renewable energy platform in India with 10+ GW operational and 20+ GW pipeline across 14+ states
    - >-
      Proprietary IRES technology (pumped-hydro storage) offering 24/7 dispatchable renewable power — a scarce,
      hard-to-replicate differentiator
    - >-
      Strong sovereign backing from GIC (~58%) and ADIA (~14%) providing capital stability, credibility, and funding
      access
    - >-
      AM Green green hydrogen/ammonia platform with Uniper and Yara offtake diversifies into a high-growth global export
      market
    - >-
      Structural firm-power tailwind: SECI/DISCOM round-the-clock tenders reward exactly the firmness Greenko's storage
      delivers
  topRisks:
    - >-
      Elevated leverage (~15.3x) and a ~USD 940M dollar-bond refinancing due March 2026 create refinancing and
      solvency-stress risk
    - >-
      Project-execution and commissioning delays already triggered 2025 downgrades from Fitch and CARE and defer the
      EBITDA ramp
    - >-
      Customer concentration in government counterparties (SECI, NTPC, DISCOMs) with persistent DISCOM payment-delay
      exposure
    - >-
      Key-person concentration in founders Anil Chalamalasetty and Mahesh Kolli, who hold most institutional knowledge
      and relationships
    - >-
      Green hydrogen/ammonia market still nascent, with gigawatt-scale electrolysis cost and reliability unproven at
      commercial loads
  unresolvedGaps:
    - >-
      Audited consolidated financial statements are not publicly available; revenue, EBITDA, and net debt are unverified
      estimates
    - Detailed terms, pricing, and backstops for the 2026 dollar-bond refinancing are not fully disclosed
    - PPA tariff rates, contract durations, and DISCOM receivables ageing for major customers are not public
    - Project-by-project commissioning schedule that drives the deleveraging path is not disclosed
    - IPO timeline and structure, and the full AM Green/ORIX transaction terms, remain uncertain
