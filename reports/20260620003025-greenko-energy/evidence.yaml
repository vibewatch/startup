evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Greenko does not publish audited consolidated revenue, EBITDA, or net-debt figures; all financial scale numbers
      are third-party estimates.
    whyItMatters: >-
      Without audited financials, valuation and leverage cannot be grounded in verified fundamentals, weakening every
      downstream financial judgment.
    diligencePath: >-
      Request audited consolidated statements and the latest rating-agency surveillance reports from management or via a
      data room.
    relatedQuestionRefs:
      - QO021
      - QO030
  - type: conflicting-data
    severity: minor
    topic: valuation
    missingEvidence: >-
      Reported deal values for the ORIX stake sale range from $1.28 billion to $1.4 billion, implying a valuation band
      rather than a single point.
    whyItMatters: >-
      The valuation anchor for the whole report depends on which figure is used; the spread affects per-share and
      multiple math.
    diligencePath: >-
      Reconcile the equity consideration, any debt assumption, and stake percentage from the definitive transaction
      documents.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Greenko's exact employee headcount is not disclosed in a primary source; estimates span 3,000-4,000.
    whyItMatters: Headcount informs operating-cost and execution-capacity judgments used in later chapters.
    diligencePath: Confirm headcount via the company HR disclosure, LinkedIn workforce analytics, or an IPO prospectus when filed.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: ipo-timeline
    missingEvidence: There is no confirmed IPO date, structure, or filing for Greenko as of mid-2026.
    whyItMatters: IPO timing is a key liquidity and valuation catalyst for investors evaluating entry.
    diligencePath: Track DRHP/prospectus filings with SEBI and monitor banker mandates and board resolutions.
    relatedQuestionRefs:
      - QO023
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-disclosure
    missingEvidence: >-
      Greenko's full C-suite beyond the two founders and its complete board composition are not consistently disclosed
      in public sources.
    whyItMatters: Board and executive-team depth bears directly on key-person risk and governance quality used across the report.
    diligencePath: Obtain the board roster, committee charters, and executive bios from the company secretary or an IPO prospectus.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table-completeness
    missingEvidence: >-
      Greenko's full capitalization table, including minority co-investors and the complete lender syndicate, is not
      publicly filed.
    whyItMatters: A complete cap table is needed to confirm control rights, drag/tag provisions, and the true valuation waterfall.
    diligencePath: >-
      Request the shareholders' agreement and cap table from the data room and reconcile against ROC/Mauritius registry
      filings.
    relatedQuestionRefs:
      - QO006
      - QO009
      - QO010
    relatedTableRefs:
      - TO003
