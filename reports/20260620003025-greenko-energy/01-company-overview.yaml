- id: founders-and-governance
  title: Founders, Leadership, and Key-Person Risk
  body: 'Greenko is led by its two co-founders: Anil Kumar Chalamalasetty as Chief Executive Officer and Mahesh Kolli as President. Chalamalasetty is the strategic and capital-markets face of the company, owning the relationships with sovereign investors and lenders, while Kolli oversees operations and project execution. The pairing has functioned as a durable founder partnership for nearly two decades, but it also concentrates institutional knowledge, lender relationships, and strategic direction in two individuals — a material key-person dependency that diligence must weigh. That concentration deepened in 2025: through their AM Green vehicle, the promoters acquired ORIX''s 17.5% stake, lifting the founder-controlled position to roughly 25% and consolidating influence alongside the sovereign shareholders. Beyond the founders, public disclosure of the broader C-suite and full board composition is thin, and Greenko does not publish audited consolidated financial statements. The combination of a private, India-plus-Mauritius holding structure and founder consolidation raises legitimate governance questions about minority-investor alignment and transparency, even as GIC''s roughly 58% position provides a strong institutional counterweight. For an outside investor, the governance picture is therefore a balance of credible sovereign oversight against founder concentration and limited public reporting.'
  claimRefs:
