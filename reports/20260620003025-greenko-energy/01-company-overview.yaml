- id: ownership-and-capital
  title: Ownership, Capital Structure, and the 2025 ORIX Exit
  body: 'Greenko''s capital structure is anchored by two sovereign wealth funds: Singapore''s GIC, its largest shareholder at approximately 58%, and the Abu Dhabi Investment Authority at roughly 14%. The pivotal recent capital event was the June-July 2025 transaction in which the founders'' AM Green platform purchased a 17.5% stake in Greenko from Japan''s ORIX Corporation for approximately $1.28-1.4 billion, implying an enterprise valuation of about $7.3-7.5 billion. The deal reduced ORIX''s direct holding to roughly 2.5%, while ORIX simultaneously reinvested an estimated $731-750 million into AM Green convertible notes, retaining indirect exposure to the founders'' green-hydrogen and ammonia ambitions. This is best read as strategic capital recycling: ORIX rotated out of mature renewable equity and into the next-generation green-molecule platform. On the debt side, Greenko raised a ₹62 billion (about $740 million) credit facility from NaBFID in July 2024, one of several large infrastructure financings underpinning its build-out, and reportedly carries total debt in excess of ₹300 billion. The implied $7.5 billion valuation and the sovereign-plus-founder ownership mix form the anchor that the valuation chapter scrutinises in detail, while the leverage profile feeds the financials and risk chapters.'
  claimRefs:
