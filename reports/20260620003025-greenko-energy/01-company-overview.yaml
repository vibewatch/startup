- id: scale-and-product
  title: Scale, the IRES Platform, and the AM Green Adjacency
  body: 'Greenko''s scale is its most concrete asset: more than 10 GW of operational renewable capacity, a further 20 GW or more under construction or development, and a stated 2030 target of over 50 GW of capacity with 100 GWh of daily storage. The strategic differentiator is the Integrated Renewable Energy Storage platform, whose flagship is the Pinnapuram project in Andhra Pradesh — roughly 4 GW of solar, 1 GW of wind, and 1.68 GW of pumped hydro storage capable of delivering on the order of 10 GWh of daily storage throughput. By firming intermittent generation into schedulable supply, IRES positions Greenko to sell round-the-clock clean power, a capability few Indian peers can match and one that has drawn ministerial-level government attention. Adjacent to the core renewable business, the founders'' AM Green platform is building one of the world''s largest green ammonia franchises, targeting 5 million tonnes per annum by 2030, with a first 1 MTPA plant at Kakinada under construction and commissioning targeted for the second half of 2026. AM Green has already signed offtake agreements with Uniper of Germany and Yara Clean Ammonia of Norway, giving the broader group exposure to global decarbonisation export demand. Together, scale, storage IP, and the green-molecule adjacency define Greenko''s investment thesis.'
