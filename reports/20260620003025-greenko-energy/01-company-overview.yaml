- id: milestones-and-trajectory
  title: Milestones, Trajectory, and Investability Snapshot
  body: 'Greenko''s nearly two-decade trajectory traces a clear arc: a 2007 founding and early AIM-era public capital, a 2016 strategic investment from GIC that anchored sovereign ownership, ADIA''s subsequent entry, the build-out toward 10 GW of operational capacity, the 2024 NaBFID financing and unveiling of the world''s largest integrated renewable energy storage project at Pinnapuram, the 2025 ORIX exit that consolidated founder control at an implied $7.5 billion valuation, and the 2026 push into green ammonia through AM Green''s Kakinada plant. This chronology shows a company that has repeatedly converted institutional capital into physical, storage-differentiated infrastructure. On an investability snapshot, Greenko scores highly on scale, capital backing, and technological differentiation, but markedly lower on disclosure and leverage risk: it publishes no audited consolidated financials, carries a heavy debt load, and faces large continuing capex commitments. An anticipated IPO has been discussed since 2023 but remains delayed with no confirmed date as of mid-2026, leaving a key liquidity and transparency catalyst unresolved. The net picture is a strategically important, well-capitalised national champion whose principal diligence gaps are financial transparency, leverage, and governance concentration rather than commercial relevance or scale.'
