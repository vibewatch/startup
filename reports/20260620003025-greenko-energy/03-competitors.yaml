callouts:
- calloutType: strength
  title: Storage moat in a market shifting to firm power
  body: As SECI and DISCOMs pivot to round-the-clock and storage-mandated tenders, Greenko's deep pumped-hydro IRES capability gives it a firm-power edge that pure-play peers cannot easily match, converting a mid-pack capacity rank into a leadership position on the dimension that is coming to matter most.
  claimRefs:
  - CP008
  - CP015
  - CP020
  - CP033
- calloutType: risk
  title: Out-built and out-funded by scale leaders
  body: Adani Green's ~19 GW and 5 GW/year pace, plus listed peers' public capital access, expose Greenko's scale and capital-visibility gap. Rivals' battery and pumped-hydro investments could erode Greenko's first-mover storage advantage within a few years.
  claimRefs:
  - CP010
  - CP016
  - CP021
  - CP037
- calloutType: insight
  title: Challenger, not scale leader
  body: Greenko is best understood as a storage-differentiated challenger rather than a scale champion. Its durable advantages are pumped-hydro depth and the AM Green green-molecule adjacency; its disadvantages are raw scale, cost, and the absence of a public listing.
