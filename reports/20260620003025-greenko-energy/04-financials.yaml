- id: margins-unit-economics
  title: Margins, Unit Economics, and Capital Intensity
  body: 'Greenko''s economics are those of a capital-intensive infrastructure developer: long-life assets that, once commissioned, throw off high-margin, stable cash flows, but that require very large upfront capital per megawatt and therefore depress near-term reported returns while projects are under construction. Group EBITDA was estimated at about USD 470 million in FY2025, and Fitch forecasts a step-up to roughly USD 770 million in FY2026 as the Andhra Pradesh pumped-storage and Teesta hydro projects ramp — an increase of around USD 300 million that hinges entirely on those delayed assets commissioning on schedule. The unit-economics story is therefore one of timing: capex has been incurred but the corresponding revenue and EBITDA lag until commissioning, which is precisely why reported margins and coverage look strained today. Net interest coverage was weak at about 0.8-0.9x in FY25 and is forecast to recover to roughly 1.4x in FY26 and above 1.8x from FY27. Management and rating agencies frame FY25-FY26 explicitly as transition years, with the deleveraging thesis — leverage falling below 8x by FY27 — contingent on execution that has already slipped once. For diligence, the key unit-economics question is not whether the assets are good (they are long-life and contracted) but whether the commissioning timeline that converts capex into cash will hold.'
  claimRefs:
