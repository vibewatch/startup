      - number: '6.4'
        title: Concentration, Counterparty Risk, and Verdict
        blocks:
          - type: paragraph
            body: >-
              The dominant customer-side risk for Greenko is concentration in government-linked counterparties. Its
              offtake is heavily weighted toward SECI and NTPC, which is a strength in counterparty credit quality but a
              dependency risk if government procurement slows or policy priorities shift. Compounding this, DISCOM
              payment delays remain a structural risk for renewable developers despite improvements under Late Payment
              Surcharge rules, exposing Greenko's receivables to the uneven financial health of state utilities. The
              firm-power market itself shows stress signals: SECI's 1,200 MW RTC tender in May 2025 awarded only 420 MW
              as tariffs tightened, and RTC tenders have seen undersubscription, posing a risk to Greenko's pipeline
              conversion from awards into operational supply. These risks are partially mitigated. Geographic breadth
              across 14-plus states diversifies state exposure; the central-agency intermediary model reduces
              single-DISCOM risk; segment diversification into C&I firm power and export green ammonia broadens the
              channel base; and the structural shift toward firm-power procurement favours Greenko's integrated model.
              The balanced verdict is that Greenko's customer proof is genuine and production-grade in power, its
              retention is structurally high thanks to long PPAs, and its growth is policy-supported — but its customer
              base is concentrated in government counterparties, its receivables are exposed to DISCOM payment
              timeliness, and the durability of its export-ammonia demand remains to be proven in production.
            claimRefs:
              - CU014
              - CU015
              - CU023
              - CU027
              - CU028
              - CU029
