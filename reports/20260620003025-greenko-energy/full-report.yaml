  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Greenko's risk profile is best understood as high-quality, long-life assets carrying transitional leverage
              and execution risk under strong sponsorship. Ranked by likelihood and impact, the most severe risks are
              high leverage and refinancing, project-execution and commissioning delays, and dependence on government
              counterparties. The first two are tightly linked and were the explicit triggers for the 2025 rating
              downgrades by Fitch and CARE: with consolidated debt of about USD 7.37 billion and leverage near 15.3x,
              any slippage in commissioning the storage and hydro assets that are meant to lift EBITDA directly worsens
              an already-stretched balance sheet. The transmission mechanism is mechanical — execution delay defers
              EBITDA while debt-service obligations continue, which worsens leverage and coverage, which raises
              refinancing pressure and the risk of further downgrades, which in turn raises the cost of capital. This
              feedback loop is the single most important risk dynamic in the entire investment case. Beneath these
              headline risks sit a layered set of regulatory, operational, partner, people, and market risks, each of
              which can independently delay projects or impair cash flows. After current mitigations — chiefly sponsor
              capital, asset commissioning, and active refinancing — the residual risk is moderate-to-high and dominated
              by leverage and execution. The overall residual risk rating is medium: genuinely strong assets and
              sponsors, materially offset by balance-sheet and delivery risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
              - CR017
              - CR027
              - CR037
              - CR039
