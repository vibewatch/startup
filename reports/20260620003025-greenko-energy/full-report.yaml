            body: >-
              Rating-agency actions in 2025 were uniformly cautious. Fitch downgraded Greenko's Long-Term
              Foreign-Currency IDR to 'BB-' with a Stable outlook in December 2025, attributing the move to
              project-execution delays that pressured cash flows and credit metrics; CARE Ratings downgraded Greenko
              Energies to CARE A; Stable / CARE A1 in the same month for similar reasons; and Moody's had earlier
              signalled that metrics would remain negative through FY26 on high capex and uncertain incremental revenue.
              The consistency of these views across three agencies is itself a signal: execution and leverage, not asset
              quality, are the binding constraints. Compounding the analytical challenge is disclosure. Greenko is a
              private group and does not publish audited consolidated financial statements, detailed PPA tariff terms,
              project-level IRRs, or a full debt-maturity ladder, forcing diligence to lean heavily on rating-agency
              summaries and analyst estimates. The overall financial verdict is balanced: Greenko owns high-quality,
              long-life, government-contracted assets whose revenue quality is genuinely strong, but it carries
              elevated, capex-driven leverage in a transition phase, depends on sponsor support and successful
              refinancing, and offers limited public transparency. The decisive diligence question is whether the
