  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'The Core Product: Firm Renewable Power'
        blocks:
          - type: paragraph
            body: >-
              Greenko's core product is not electricity per se but firmness — round-the-clock, dispatchable clean power
              delivered through its Integrated Renewable Energy Storage (IRES) model. In customer-workflow terms,
              Greenko solves the defining problem of renewables: solar and wind are intermittent, but grid operators,
              distribution companies, and especially industrial users need power they can schedule. IRES combines
              co-located solar and wind generation with large-scale pumped-hydro storage to convert variable output into
              firm, 24/7 supply. The flagship Pinnapuram project in Andhra Pradesh embodies the model, combining 4,000
              MW of solar, 1,000 MW of wind, and 1,680 MW of pumped-hydro storage that delivers roughly 10,080 MWh —
              about 10 GWh — of storage per cycle, all for total investment of about USD 4.2 billion. The product serves
              multiple customer workflows: state DISCOMs needing firm renewable supply, hard-to-abate industries such as
              green steel and aluminium needing carbon-free power, and — increasingly — co-located green-hydrogen and
              ammonia production that needs continuous renewable electricity. The strategic significance is that as
              grids saturate with cheap-but-intermittent solar, the scarce and valuable product becomes firmness, and
              Greenko has built its entire technology stack around supplying exactly that. Pinnapuram alone is projected
              to avoid about 3.3 million tonnes of CO2 per year, underscoring the scale at which the product operates.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
