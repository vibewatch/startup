      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The firm-power slice, not the whole market, is the real opportunity
            body: >-
              India's ~$68B renewable market is large, but Greenko competes in the round-the-clock, storage-firmed slice
              that SECI's RTC and hybrid tenders are creating. Storage mandates expand this premium segment directly
              toward Greenko's IRES capability, making it the fastest-growing and highest-value part of the addressable
              market.
            calloutType: insight
            claimRefs:
              - CM006
              - CM022
              - CM029
              - CM038
          - type: callout
            title: Grid and land bottlenecks cap the serviceable market
            body: >-
              Demand is not the binding constraint — transmission queues, land acquisition, and DISCOM financial
              weakness are. Independent analysts warn these could strand part of India's pipeline, so the serviceable
              obtainable market is limited more by execution and grid capacity than by appetite for clean power.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM028
              - CM037
          - type: callout
            title: Sizing is scope-sensitive and uses a band, not a point
            body: >-
              Published India renewable market estimates diverge widely (≈$68B in 2026, 8-14% CAGR) because of differing
              scope. This chapter triangulates revenue, capacity, and investment lenses and treats the TAM as a range,
              which the valuation chapter must respect when applying multiples.
