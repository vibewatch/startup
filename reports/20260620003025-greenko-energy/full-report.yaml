      - number: '3.2'
        title: Greenko's Differentiation and Moat
        blocks:
          - type: paragraph
            body: >-
              Greenko's competitive identity is not scale but storage-enabled firmness. Its Integrated Renewable Energy
              Storage model — combining solar, wind, and large-scale pumped hydro — delivers round-the-clock
              dispatchable power that few rivals can match operationally today. Where most large competitors emphasise
              battery storage bolted onto capacity additions, Greenko leads on deep, multi-hour pumped-hydro storage
              that is harder and slower to replicate, lending some durability to its moat. This differentiation is
              increasingly valuable because storage-linked and round-the-clock tenders from SECI and DISCOMs now reward
              firm supply that intermittent-only bids cannot provide, creating a structural tailwind for integrated
              players. In a head-to-head capability matrix, Greenko rates highest on round-the-clock firm power,
              pumped-hydro storage, and the green-molecule adjacency via AM Green, while rating lower on raw operational
              scale and — critically — on public capital access, since it remains private. The moat is real but
              contested: well-capitalised rivals including Adani, Tata Power, and JSW Energy are investing in battery
              and pumped-hydro storage, and their faster capacity pace and deeper capital pools mean Greenko's
              first-mover advantage in integrated storage could erode within a few years if it does not maintain
              execution lead. The investment question is therefore whether storage depth plus green-molecule optionality
              can offset Greenko's scale and capital-visibility disadvantages.
            claimRefs:
              - CP008
              - CP009
              - CP015
              - CP016
              - CP019
              - CP020
              - CP033
