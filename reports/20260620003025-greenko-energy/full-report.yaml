        title: Balance Sheet, Leverage, and Refinancing
        blocks:
          - type: paragraph
            body: >-
              The balance sheet is where Greenko's risk concentrates. Total consolidated debt rose to about USD 7.37
              billion at FYE March 2025, up sharply from USD 5.26 billion a year earlier, pushing debt-to-EBITDA
              leverage to roughly 15.3x from 10.8x. Greenko held about USD 860 million of cash against current
              maturities of roughly USD 1.3 billion, the most pressing component of which is approximately USD 940
              million of USD bonds maturing in March 2026. The company began refinancing this maturity in mid-2025 and
              mandated Nomura to place INR 6 billion of debt at around 16% IRR in August 2025 — a high cost that signals
              the tightness of its financing window. A ₹6,200 crore (about USD 740 million) NaBFID facility secured in
              July 2024 illustrates Greenko's continued ability to access large infrastructure credit, and majority
              owner GIC's strong sponsor support underpins above-average funding access. Nonetheless, the refinancing of
              the 2026 bonds remains a material near-term overhang, and the deleveraging path below 8x by FY27 is
              contingent and unproven. The balance-sheet verdict is that Greenko carries transitional, capex-driven
              leverage stress against high-quality long-life assets — survivable with sponsor support, but a genuine
              source of risk if commissioning slips further or refinancing markets tighten.
