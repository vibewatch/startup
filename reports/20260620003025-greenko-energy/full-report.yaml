  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Greenko monetizes its renewable assets primarily through long-term power purchase agreements that blend
              fixed capacity charges with variable energy charges, layered increasingly with a round-the-clock
              firm-power premium as its storage assets commission. Offtake is contracted predominantly with government
              counterparties — SECI, NTPC, and state distribution companies — under long-tenor PPAs typically running 20
              to 25 years, which gives Greenko strong revenue visibility but also exposes it to competitive
              auction-driven tariff pressure. At the reported-entity level, Greenko Energies Private Limited posted
              FY2025 revenue of about ₹2,930 crore, up roughly 13% year-on-year, though this standalone figure
              understates group scale because generation revenue is dispersed across many project SPVs; analysts
              estimate a group revenue run-rate on the order of USD 500-650 million that the company does not officially
              disclose. The monetization model is fundamentally auction-led: Greenko wins capacity through SECI and
              state firm-power tenders, then earns availability-based capacity payments plus energy charges, with the
              emerging round-the-clock and storage-linked tenders allowing it to capture a premium for dispatchable
              supply that intermittent-only peers cannot provide. A future revenue layer comes from the AM Green
              green-molecule platform, whose ammonia offtake to Uniper and Yara begins from the second half of 2026. The
              central caveat is disclosure: exact tariff rates and contract durations for Greenko's major contracts are
              not public, so revenue quality must be inferred from counterparty mix and PPA tenor rather than verified
              directly.
