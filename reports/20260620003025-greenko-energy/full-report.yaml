      - number: '7.2'
        title: Regulatory, Legal, and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              On the regulatory and legal front, Greenko faces risks spanning environmental clearances, land
              acquisition, grid-code compliance, disclosure obligations, and — for AM Green — green-ammonia export
              certification. Large hydro and pumped-storage projects are particularly exposed: environmental clearance
              conditions and land-acquisition disputes can delay timelines, and pumped-hydro reservoirs raise water-use
              and ecological concerns that can attract opposition or regulatory conditions. Tariff and policy-revision
              risk, though lower-likelihood, carries high impact because it could compress firm-power revenue if
              procurement frameworks change. The private-group structure also creates a governance-transparency risk:
              limited public disclosure of audited financials and contract terms complicates diligence, and sector audit
              bodies have flagged renewable-procurement and DISCOM-dues issues. Operationally, project commissioning
              delay is the highest-priority risk given its direct financial transmission, followed by hydropower
              construction cost overruns in difficult terrain, grid curtailment and transmission constraints that can
              limit realised revenue even from completed assets, and the concentration of capacity in a few
              mega-projects that amplifies the impact of any single-site disruption. Asset reliability is managed
              through infrastructure-grade engineering but remains exposed to weather and grid events. The common thread
              across regulatory and operational risk is timing: most of these risks manifest as delays or revenue
              haircuts that feed back into the leverage-and-refinancing loop rather than as outright project failures.
            claimRefs:
              - CR004
              - CR005
