      - number: '6.2'
        title: Named Customer Proof and Adoption
        blocks:
          - type: paragraph
            body: >-
              Greenko's customer proof is real and, in power, production-grade. The flagship reference is the landmark
              July 2024 power purchase agreement under which NTPC Renewable Energy contracted 1,300 MW of
              round-the-clock supply from Greenko, structured in two 650 MW phases and explicitly designed to power
              Greenko's own green hydrogen and ammonia facility in support of the National Green Hydrogen Mission.
              Alongside NTPC, SECI provides multi-gigawatt RTC and firm-power offtake, and state DISCOMs take
              operational supply across 14-plus states — together constituting genuine, production-grade contractual
              proof rather than pilots. The adoption trajectory shows a clear shift over time: from early SECI
              round-the-clock tender wins in 2020-2022, to the landmark NTPC deal in 2024, to green-ammonia offtake
              agreements with Uniper of Germany and Yara Clean Ammonia of Norway signed in 2025, to a firm-power and
              hydrogen ramp in 2026. The proof quality differs by segment, however. Power offtake from NTPC and SECI is
              production-grade and contractually firm, whereas the green-ammonia offtake with Uniper and Yara — while
              strategically significant as early demand validation — remains pre-production until the Kakinada plant
              commissions in the second half of 2026. In customer-proof terms, Greenko is strongest where it matters
              most for current cash flow (firm power) and forward-looking where the growth optionality lies (green
              molecules).
