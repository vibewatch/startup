    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Greenko Energy Holdings, trading as the Greenko Group, was founded in 2007 by Anil Kumar Chalamalasetty
              and Mahesh Kolli and is headquartered in Hyderabad, India, with holding entities registered in Mauritius.
              The company began life as a developer of biomass and small-hydro assets and was briefly listed on London's
              AIM market before consolidating into a privately held, sovereign-backed renewable platform. Today Greenko
              is widely described as India's largest private renewable energy company, operating more than 10 GW of
              wind, solar, and hydro capacity across 14 or more Indian states. Its defining strategic bet is Integrated
              Renewable Energy Storage (IRES), a model that pairs solar and wind generation with large-scale pumped
              hydro storage to convert intermittent renewables into firm, round-the-clock dispatchable power for grid
              and industrial buyers. The business earns revenue chiefly through long-term power purchase agreements with
              state distribution companies, central agencies such as SECI and NTPC, and a growing roster of industrial
              offtakers. This identity — a scaled, storage-differentiated, institutionally owned developer — is the
              ground truth that every later chapter reuses, from market sizing to valuation. The company's
              multi-jurisdiction structure and private status, however, mean that public financial transparency is
              limited relative to a listed peer.
