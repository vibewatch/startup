  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case for Greenko rests on a clear thesis: it is India's foremost storage-firmed renewable
              platform, converting intermittent solar and wind into firm, 24/7 dispatchable power through deep
              pumped-hydro storage, with green-molecule optionality via AM Green and the stability of sovereign backing
              from GIC and ADIA. As India's procurement shifts structurally toward round-the-clock and firm-power
              tenders, Greenko's differentiation maps directly onto the dimension that is coming to matter most, and its
              pumped-hydro depth is scarce and hard to replicate. The anti-thesis is equally clear and must be taken
              seriously: Greenko carries high leverage of around 15.3x with a refinancing overhang on its 2026 dollar
              bonds, its green-hydrogen optionality is still nascent and unproven at commercial scale, its public
              disclosure is thin, and project-execution delays have already triggered rating downgrades from Fitch and
              CARE. On scale and cost it trails Adani Green. The valuation debate is therefore a contest between asset
              quality and balance-sheet-plus-execution risk: the storage and sovereign premium is real, but it only
              crystallises if Greenko proves out the FY26-FY27 commissioning-and-deleveraging plan. As skeptical
              analysts put it, Greenko's premium hinges on execution and deleveraging — which is precisely the fulcrum
              on which the entire recommendation turns.
            claimRefs:
              - CV001
              - CV002
              - CV020
              - CV030
              - CV035
              - CV036
          - type: table
            tableRef: TV002
            claimRefs:
