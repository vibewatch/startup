      - number: '6.3'
        title: Contract Structure, Retention, and Demand Creation
        blocks:
          - type: paragraph
            body: >-
              The economics of Greenko's customer relationships are defined by long-tenor contracts. SECI
              round-the-clock PPAs typically run 25 years under a build-own-operate model, with supply expected to
              commence about 24 months after PPA signing. These long tenors give Greenko unusually high contractual
              retention: once assets commission, churn risk is minimal because the customer is locked into a
              multi-decade offtake at agreed terms. Retention is further supported by the central-agency intermediary
              model, which provides a stable counterparty, and by land-and-expand dynamics whereby Greenko wins
              additional RTC and firm-power capacity from the same agencies. The contracts are demanding operationally:
              RTC PPAs impose demand-fulfilment ratios — on the order of 75% monthly, 80% annually, and 90% during peak
              hours — with steep penalties for supply shortfalls, which raises the stakes on Greenko's storage
              execution. On the demand side, the National Green Hydrogen Mission is a powerful policy driver creating
              new customer demand for firm renewable power, exemplified by the NTPC-Greenko deal. The principal caveat
              on retention is not churn but cash: while contractual lock-in is high, the timeliness of payment depends
              on counterparty financial health, and DISCOM payment behaviour — though improved under Late Payment
              Surcharge rules — still affects the cash quality of these otherwise sticky relationships.
            claimRefs:
              - CU006
              - CU012
