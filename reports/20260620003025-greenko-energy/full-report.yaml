  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Greenko's customers are overwhelmingly institutional and government-linked rather than retail. The base
              segments into four groups: central procurement agencies — chiefly the Solar Energy Corporation of India
              (SECI) and NTPC — which sign long-term power purchase agreements and resell to downstream buyers; state
              distribution companies (DISCOMs) that take power directly or via SECI across more than 14 states; a
              growing commercial-and-industrial (C&I) firm-power segment served through open access; and, for the AM
              Green green-molecule business, export buyers of green ammonia. SECI is the pivotal counterparty, acting as
              a creditworthy central intermediary that signs 25-year PPAs with developers under a build-own-operate
              model and delivers power over the interstate transmission system, insulating developers from the weaker
              balance sheets of individual state DISCOMs. The central-agency intermediary structure is strategically
              important because it concentrates Greenko's offtake in sovereign-linked counterparties, reducing exposure
              to the patchy financial health of state utilities while introducing a different concentration: heavy
              reliance on a small number of government-linked buyers. The C&I segment is an emerging diversification
              opportunity as industrial open-access demand for firm renewable power accelerates, and the export ammonia
              segment — though still pre-production — adds a wholly different, internationally diversified customer pool
              to the traditional domestic power-offtake base.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU019
