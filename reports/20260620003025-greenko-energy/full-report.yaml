  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              India's renewable energy sector is led by a small group of large developers against whom Greenko competes.
              By operational capacity in 2026, Adani Green Energy is the clear leader at roughly 19.3 gigawatts, having
              added more than 5 GW in FY2026 alone — among the fastest expansions globally outside China — and is
              targeting 50 GW by 2030, anchored by its Khavda mega-project in Gujarat planned to reach 30 GW by 2029.
              ReNew follows at about 12.6 GW as India's largest pure-play renewables peer, Tata Power Renewables at
              roughly 11.6 GW within a larger group portfolio, and NTPC Green Energy — the public-sector champion — at
              about 10.07 GW. Greenko, with approximately 10 GW operational, sits broadly level with NTPC Green but
              behind Adani and ReNew on raw gigawatts. Secondary players include JSW Energy, Azure Power, and Sembcorp.
              Collectively the top four developers control on the order of 19% of India's operational renewable
              capacity, leaving a still-fragmented remainder. The crucial nuance is that capacity rankings tell only
              part of the story: the competitive battleground is shifting from nameplate gigawatts toward firm,
              schedulable supply, where Greenko's positioning is materially stronger than its mid-pack capacity rank
              implies.
