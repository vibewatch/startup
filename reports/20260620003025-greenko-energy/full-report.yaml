      - number: '7.3'
        title: Partner, People, and Market Risk
        blocks:
          - type: paragraph
            body: >-
              Greenko's dependency and people risks concentrate around a few critical relationships. On capital, the
              group depends heavily on sponsor support from majority owner GIC; this is a strength for funding access
              but a concentration dependency whose withdrawal or dilution would be a thesis-break trigger. On
              technology, the AM Green green-ammonia ramp depends on the John Cockerill electrolyzer JV, concentrating
              equipment supply on a single technology partner, while gigawatt-scale electrolysis itself remains unproven
              at sustained commercial loads. On offtake, counterparty risk from SECI, NTPC, and DISCOMs centres on
              payment timeliness rather than contract honour, and DISCOM financial stress persists despite reform
              schemes. People risk is led by founder key-person concentration: Anil Chalamalasetty and Mahesh Kolli hold
              much of the institutional knowledge and relationships, and rapid multi-gigawatt scaling strains management
              and engineering bandwidth. On markets, the green hydrogen and ammonia opportunity is nascent, with cost
              and demand uncertainty that depends on electrolyzer and power costs falling further than is yet assured,
              and export ammonia faces destination-market certification risk. Forex risk from dollar-denominated bonds
              adds another layer, requiring hedging that carries cost and, if incomplete, could erode margins. None of
              these is individually fatal, but together they widen the range of outcomes around Greenko's
              execution-and-deleveraging plan.
