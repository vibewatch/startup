  - calloutType: insight
    title: Non-dilutive funding is the financial bridge
    body: Roughly $21M of DARPA and CQCP funding, plus up to $300M of potential DARPA Stage C, can extend runway without dilution while commercial revenue is years away.
    claimRefs:
