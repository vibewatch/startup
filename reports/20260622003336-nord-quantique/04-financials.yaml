company:
  name: Nord Quantique
chapter:
  number: 4
  title: Financials
  summary: Nord Quantique is pre-revenue with no commercial product; its only inflows are non-dilutive government awards (DARPA QBI Stage B and Canada's CQCP) and equity. It has accessed roughly USD $71 million in total, carries a USD $1.4 billion valuation, and does not disclose burn or runway, making capital adequacy and revenue-model proof the central financial diligence blockers.
sections:
  - id: revenue-model
    title: Revenue Streams and Monetisation Model
    body: "Nord Quantique generates no commercial product revenue and is best characterised as pre-revenue. Its only cash inflows tied to deliverables are non-dilutive government awards: a DARPA Quantum Benchmarking Initiative Stage B award of USD $5 million with up to USD $10 million more, and roughly USD $16 million under Canada's Quantum Champions Program Phase 1. These are milestone- and program-based receipts rather than recurring commercial revenue, and their recognition follows grant and contract terms that the company has not published in detail. The eventual commercial model is expected to blend quantum-computing-as-a-service cloud or direct access, government and defence R&D contracts, and potential licensing of its bosonic-code intellectual property, but none of this is yet articulated publicly or priced. There is consequently no list price, no realised commercial pricing, and a revenue mix that is presently one hundred percent government and grant in nature. For diligence, the key questions are when paid commercial access begins, what the first monetisable unit is, and how grant receipts are recognised against milestones."
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-efficiency
    title: Go-to-Market Motion and Sales-Efficiency Proxies
    body: "With no commercial sales, conventional go-to-market efficiency metrics such as customer acquisition cost, payback period and net revenue retention do not yet exist and are recorded here as null rather than estimated. The de facto go-to-market motion today is a grant-and-partnership motion: the company competes for government programs, research collaborations and benchmarking selections, where the sales cycle is measured in the quarters-to-years typical of defence and national-science procurement. The nearest proxies for commercial traction are the credibility signals that precede revenue, namely DARPA Stage B advancement, CQCP selection and the NY-CREATES supply-chain partnership, which function as pipeline-quality indicators rather than bookings. Channel economics are similarly pre-formation: the future channel is likely a mix of direct enterprise and government sales plus hyperscaler cloud marketplaces, but no channel agreements or take-rates are disclosed. The honest read is that sales-efficiency analysis must wait until a paid commercial motion exists; until then the program-selection record is the only forward-looking signal, and it is encouraging on credibility but silent on dollar conversion."
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: cost-and-margin
    title: Cost Structure, Capital Intensity and Margins
    body: "Nord Quantique's cost base is dominated by research-and-development payroll for scarce quantum physicists and engineers, plus the capital and operating cost of superconducting hardware development: cryogenic dilution refrigerators, control electronics, and access to semiconductor fabrication through partners such as NY-CREATES. This is a capital-intensive profile with long development cycles, and the company has signalled plans to roughly double headcount in 2026, which raises payroll burn materially. Because there is no shipped product, gross margin is not yet meaningful and is recorded as null; the eventual margin path depends on whether delivery is cloud-service-based, which can carry high software-like margins at scale, or hardware-system-based, which carries lower margins and heavy service-delivery cost. Working-capital needs are presently modest given the absence of inventory or receivables, but would grow sharply if the company begins manufacturing systems. The dominant financial fact is capital intensity: building fault-tolerant hardware is expensive and slow, so the margin and cash-flow profile cannot be assessed until the delivery model and first commercial costs are known."
    claimRefs:
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
    figureRefs:
      - FI002
      - FI004
  - id: traction-and-capital
    title: Public Traction, Capital Adequacy and Runway
    body: "Publicly verifiable financial traction is limited to capital events rather than operating metrics: a CAD $9.5 million seed in 2022, a USD $30 million growth-equity round in May 2026 at a USD $1.4 billion valuation, and roughly USD $21 million of non-dilutive DARPA and CQCP funding, for approximately USD $71 million accessed in total. There is no public revenue, ARR, units, utilisation or active-user figure to report. Critically, cash on hand, monthly burn and runway are not disclosed, so capital adequacy cannot be computed from public data; the planned use of funds is broadly to scale the team and advance the hardware toward the 2030 fault-tolerance target. The likely next-round trigger is technical-milestone-driven, and DARPA's programme offers up to roughly USD $300 million of additional Stage C funding as a potential non-dilutive bridge for advancing companies. The adverse view is that a USD $1.4 billion valuation against zero revenue and undisclosed burn concentrates financial risk and sets a high bar for the next raise, which independent commentators flagged amid a 2026 surge in quantum valuations."
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI035
