company:
  name: Nord Quantique
chapter:
  number: 1
  title: Company Overview
  summary: Nord Quantique is a Sherbrooke, Quebec quantum-hardware company founded in 2020 that reached a USD $1.4 billion valuation in May 2026 on a hardware-efficient bosonic error-correction architecture, while remaining pre-revenue with a 2030 fault-tolerance roadmap.
sections:
  - id: identity-and-stage
    title: Identity, Headquarters and Stage
    body: Nord Quantique is a Canadian quantum computing company founded in 2020 in Sherbrooke, Quebec, as a spin-off of the Institut quantique at the Universite de Sherbrooke. Its registered headquarters sit at 1910 rue King Ouest in Sherbrooke, and the company operates the website nordquantique.ca. The business builds superconducting quantum processors that use bosonic qubits and a hardware-efficient form of quantum error correction, a one-line description that distinguishes it from rivals chasing scale through brute-force physical-qubit counts. As of June 2026 the company sits at a growth-equity stage and crossed into unicorn territory with a USD $1.4 billion valuation in May 2026, yet it remains pre-revenue with no commercial product shipped. Management has publicly committed to delivering commercially useful fault-tolerant quantum computers by 2030, a roadmap that frames every later judgment in this report about execution risk, capital intensity and competitive timing.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    figureRefs:
      - FO002
  - id: leadership-and-governance
    title: Founders, Leadership and Key-Person Dependence
    body: "The company was co-founded by physicists Julien Camirand Lemyre, who serves as Chief Executive Officer, and Philippe St-Jean, both of whom emerged from the superconducting-circuit research community at the Institut quantique. The executive bench broadened materially in 2026: Tammy Furlong, previously CFO of Elevation Oncology and a VP of Finance at American Tower, was appointed Chief Financial Officer in May 2026, and in June 2026 the company announced Tobi Day-Hamilton as Chief Communications Officer and Angela Olano as VP Marketing, both joining in July 2026. These hires signal a deliberate shift from a research-led founding team toward a commercially scaled organisation, consistent with stated plans to roughly double headcount during 2026. Key-person dependence remains a live concern: the scientific vision is concentrated in the two physicist co-founders, and the company has not publicly disclosed a board of directors or formal governance structure, leaving an evidence gap around oversight that diligence should probe directly."
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO002
  - id: funding-and-capital
    title: Funding History, Valuation and Investors
    body: "Nord Quantique has assembled capital through a mix of venture equity and non-dilutive government programs. It emerged from stealth in February 2022 with a CAD $9.5 million (roughly USD $7 million) seed round backed by the BDC Capital Deep Tech Venture Fund, Quantonation and Real Ventures. In May 2026 it raised a USD $30 million growth-equity round led by Fidelity Investments Canada ULC, with participation from BDC, Panache Ventures, Presidio Ventures, Quantacet, Quantonation and Real Ventures, setting the USD $1.4 billion (CAD $1.9 billion) valuation. Layered on top is non-dilutive support: USD $16 million under the Canadian Quantum Champions Program Phase 1 announced in December 2025, and a DARPA Quantum Benchmarking Initiative Stage B award of USD $5 million with up to USD $10 million more. Counting equity and government funding together, the company has accessed roughly USD $71 million, of which about USD $55 million-plus is private equity capital, a figure diligence should reconcile against the company directly given inconsistent public tallies."
    claimRefs:
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO024
    tableRefs:
      - TO003
  - id: cover-metrics-and-gaps
    title: Cover Metrics and Disclosure Gaps
    body: The verifiable cover metrics are a USD $1.4 billion valuation (May 2026), approximately USD $71 million in total funding accessed including non-dilutive awards, and DARPA QBI Stage B status. Several metrics that investors normally rely on are simply not disclosed and are recorded here as explicit gaps rather than guesses. Revenue and run-rate are effectively zero because the company is pre-revenue, and its eventual business model, likely some blend of quantum-computing-as-a-service, on-premise systems and government contracts, has not been articulated publicly. Commercial customer count is zero, with only research and government partners disclosed. Headcount is undisclosed; the company has only signalled an intention to double its team in 2026 from an estimated pre-announcement base of roughly thirty to fifty people. Burn rate and runway are likewise undisclosed. Each of these gaps carries a concrete diligence path, and none should be inferred as favourable in the absence of disclosure.
    claimRefs:
      - CO006
      - CO025
      - CO026
      - CO019
      - CO020
      - CO027
      - CO028
    tableRefs:
      - TO001
    figureRefs:
      - FO003
  - id: milestone-chronology
    title: Milestone Chronology
    body: "The company chronology runs from a 2020 founding through a rapid 2024-2026 acceleration. After the 2022 seed round, Nord Quantique reported in 2024 that it had become the first to demonstrate a roughly 14 percent increase in qubit coherence time using Gottesman-Kitaev-Preskill error correction on a single physical qubit, followed by the first hardware implementation of the Tesseract bosonic code and a semiconductor supply-chain partnership with NY-CREATES. The cadence then quickened: DARPA QBI Stage B selection in November 2025, the Canadian Quantum Champions Program Phase 1 award in December 2025, the USD $30 million growth round and unicorn valuation in May 2026, the CFO appointment in May 2026, and the communications and marketing leadership hires announced in June 2026. This chronology, captured in the milestone table and timeline figure, is the single dated record of founding, financing, product, scale and partnership events that later chapters reuse as ground truth."
