callouts:
  - calloutType: strength
    title: Differentiated, validated architecture
    body: Hardware-efficient bosonic error correction targeting a 1:1 logical-to-physical qubit ratio is the core differentiator, and DARPA Stage B plus CQCP selection lend independent credibility.
    claimRefs:
      - CO004
      - CO022
      - CO021
  - calloutType: risk
    title: Pre-revenue at a unicorn price
    body: A USD $1.4 billion valuation with no commercial revenue and a 2030 fault-tolerance target sets a high execution bar and concentrates risk in a single architecture.
    claimRefs:
      - CO019
      - CO006
      - CO008
  - calloutType: insight
    title: Government capital de-risks the early path
    body: Roughly USD $21 million of non-dilutive DARPA and CQCP funding extends runway without dilution and signals national-champion status in Canada.
    claimRefs:
      - CO022
      - CO021
      - CO024
  - calloutType: assumption
    title: Headcount and governance are unverified
    body: Team size, burn and board composition are not disclosed; we treat the stated intent to double headcount as a plan, not a verified metric.
    claimRefs:
      - CO025
      - CO015
      - CO016
