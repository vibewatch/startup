chapter:
  number: 2
  title: Market Analysis
  summary: "The fault-tolerant quantum computing market Nord Quantique targets is small but inflecting: roughly USD $1-4 billion of quantum value in 2025 scaling to a USD $10-20 billion-plus addressable opportunity by 2030 and potentially USD $100 billion-plus by 2040, gated by error-correction progress, government funding and a severe shortage of quantum talent."
sections:
  - id: market-boundary
    title: Market Boundary and Status-Quo Substitutes
    body: "The market relevant to Nord Quantique is fault-tolerant, gate-based quantum computing hardware and the error-correction software and services that make it usable, sold to research institutions, governments and large enterprises. Included spend covers quantum processing units, cryogenic and control systems, quantum-computing-as-a-service cloud access, and quantum error-correction tooling. Excluded from the boundary is the much larger classical high-performance computing market, quantum sensing and quantum communications/QKD, and quantum-annealing machines such as those from D-Wave that do not target universal fault tolerance. The status-quo substitute for nearly every prospective workload today is classical HPC and GPU clusters, which remain cheaper, mature and good-enough for most problems, so the market only opens where a fault-tolerant quantum machine offers an advantage that classical hardware cannot match. Nord Quantique sits in the narrowest and least-proven slice of this boundary: pre-fault-tolerance superconducting hardware whose commercial market does not yet exist at scale, which is why sizing must lean on forward-looking analyst forecasts rather than realised revenue."
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001
    figureRefs:
      - FM004
  - id: market-sizing
    title: TAM, SAM and Obtainable Market
    body: "Multiple analyst lenses converge on a small-but-steep curve. McKinsey's Quantum Technology Monitor pegs realised quantum-computing value in the low single-digit billions in 2025, scaling toward roughly USD $10-20 billion by 2030 and as much as USD $72-100 billion-plus by 2040 across the broader quantum economy. BCG and several market-research houses publish quantum-computing market forecasts that reach the tens of billions by the early 2030s, while Fortune Business Insights and Research and Markets project double-digit-to-high compound annual growth rates from a sub-USD-$2 billion 2025 base. The total addressable market for Nord Quantique is best framed as the global fault-tolerant quantum-computing hardware and access spend, which is a subset of these headline numbers. The serviceable addressable market narrows further to superconducting fault-tolerant systems and error-correction tooling sold to governments, national labs, pharma and finance. The serviceable obtainable market for a single pre-revenue Canadian entrant is a low-single-digit share of that subset over the rest of the decade. The wide dispersion across published estimates is itself the headline finding: these are forecasts, not bookings, and they should be treated as scenario bounds rather than point truth."
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers-and-segments
    title: Buyers, Users, Payers and Adoption Path
    body: Demand in this market is concentrated among a handful of buyer archetypes that today fund quantum mostly as research and option value rather than production workloads. Governments and defence agencies are the dominant near-term payers, procuring through programs like DARPA's Quantum Benchmarking Initiative and Canada's Quantum Champions Program; here the user is a national lab or research directorate and the budget owner is a program office. Pharmaceutical and materials companies are the most-cited commercial verticals, targeting molecular simulation and catalyst discovery, with R&D budget owners sponsoring exploratory access. Financial institutions pursue optimisation, risk and cryptography use cases funded from innovation or quant-research budgets. Across all segments the adoption path runs from sponsored research access, to benchmarking and proof-of-concept, to early production once fault tolerance and clear quantum advantage are demonstrated. Procurement is relationship- and grant-driven rather than catalogue-driven, which favours incumbents with government ties and credible benchmarks and raises the bar for a pre-revenue entrant to convert technical credibility into paid commitments.
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
    tableRefs:
      - TM003
    figureRefs:
      - FM003
  - id: drivers-and-constraints
    title: Growth Drivers and Adoption Constraints
    body: "The strongest tailwind is the 2025-2026 shift that made quantum error correction the central battleground of the field: progress on logical-qubit fidelity and hardware-efficient codes has moved the conversation from raw qubit counts toward fault tolerance, directly favouring Nord Quantique's thesis. Government capital is a second driver, with DARPA's initiative able to deploy up to roughly USD $1 billion across the program and Canada backing national champions through the CQCP, alongside the EU Quantum Flagship and the UK's NQCC. The prospect of demonstrable quantum advantage in chemistry, materials and optimisation is the demand-side pull. Against these, the constraints are severe. Talent is the binding one: industry estimates put the global pool of quantum-error-correction specialists at only several hundred against a need for thousands by 2030. Capital intensity is high because superconducting hardware needs cryogenics, fabrication access and long development cycles. Buyer trust and switching costs are elevated because no vendor has yet shipped a fault-tolerant machine, so customers hedge across platforms. Finally, timing risk is acute: if useful fault tolerance slips past 2030, forecast revenue compresses and capital-raising conditions tighten."
    claimRefs:
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
