callouts:
  - calloutType: insight
    title: A small market inflecting on error correction
    body: The realised quantum market is only low single-digit billions today, but the 2025-2026 pivot to error correction directly favours Nord Quantique's hardware-efficient thesis and could pull demand forward this decade.
    claimRefs:
      - CM009
      - CM021
      - CM007
  - calloutType: risk
    title: Forecasts are scenarios, not bookings
    body: Published TAM estimates disperse widely and depend on fault tolerance arriving on schedule; treating them as point truth would overstate the near-term opportunity for any single entrant.
    claimRefs:
      - CM013
      - CM027
  - calloutType: risk
    title: Talent is the binding constraint
    body: With only several hundred quantum-error-correction specialists globally against a need for thousands by 2030, hiring is a harder gate than capital for scaling the market.
    claimRefs:
      - CM024
  - calloutType: strength
    title: Government demand de-risks the early curve
    body: DARPA, CQCP, the EU Quantum Flagship and the UK NQCC fund the earliest buyers, giving credible hardware vendors a non-commercial revenue bridge until advantage is proven.
    claimRefs:
      - CM022
      - CM014
