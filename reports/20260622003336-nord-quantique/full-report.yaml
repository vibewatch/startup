            body: >-
              Nord Quantique generates no commercial product revenue and is best characterised as pre-revenue. Its only
              cash inflows tied to deliverables are non-dilutive government awards: a DARPA Quantum Benchmarking
              Initiative Stage B award of USD $5 million with up to USD $10 million more, and roughly USD $16 million
              under Canada's Quantum Champions Program Phase 1. These are milestone- and program-based receipts rather
              than recurring commercial revenue, and their recognition follows grant and contract terms that the company
              has not published in detail. The eventual commercial model is expected to blend
              quantum-computing-as-a-service cloud or direct access, government and defence R&D contracts, and potential
              licensing of its bosonic-code intellectual property, but none of this is yet articulated publicly or
              priced. There is consequently no list price, no realised commercial pricing, and a revenue mix that is
