      - number: '7.5'
        title: Financial, Model and People Risk
        blocks:
          - type: paragraph
            body: >-
              Financially, the dominant risk is capital intensity against zero revenue: building fault-tolerant quantum
              hardware is enormously expensive, the company is pre-revenue, and it must fund a long roadmap to 2030 from
              investment and non-dilutive grants. Burn rate and runway are not publicly disclosed, so external parties
              cannot verify how long the May 2026 raise plus CQCP and DARPA funding will last, and further large rounds,
              with attendant dilution or down-round risk if sentiment turns, are almost certain to be needed. Margin and
              unit-economic models cannot be assessed because there is no product or pricing. On people and execution,
              the company carries meaningful key-person and founder-concentration risk: it was founded and is led by a
              small group of physicists, with CEO Julien Camirand Lemyre and co-founder Philippe St-Jean central to both
              the science and the narrative. The senior team is being built out rapidly, a new CFO and communications
              and marketing leaders joined in 2026, which adds capability but also integration risk, and a substantial
              planned headcount expansion must be executed in a market with a severe global shortage of
              quantum-error-correction specialists, estimated at only a few hundred worldwide. Governance and board
              composition are not publicly detailed. Financial and people risks are therefore high in aggregate and
              intertwined with the technology timeline.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR029
              - CR030
              - CR031
              - CR032
              - CR034
          - type: table
            tableRef: TR004
            claimRefs:
