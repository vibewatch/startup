      - number: '2.3'
        title: Buyers, Users, Payers and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Demand in this market is concentrated among a handful of buyer archetypes that today fund quantum mostly
              as research and option value rather than production workloads. Governments and defence agencies are the
              dominant near-term payers, procuring through programs like DARPA's Quantum Benchmarking Initiative and
              Canada's Quantum Champions Program; here the user is a national lab or research directorate and the budget
              owner is a program office. Pharmaceutical and materials companies are the most-cited commercial verticals,
              targeting molecular simulation and catalyst discovery, with R&D budget owners sponsoring exploratory
              access. Financial institutions pursue optimisation, risk and cryptography use cases funded from innovation
              or quant-research budgets. Across all segments the adoption path runs from sponsored research access, to
              benchmarking and proof-of-concept, to early production once fault tolerance and clear quantum advantage
              are demonstrated. Procurement is relationship- and grant-driven rather than catalogue-driven, which
              favours incumbents with government ties and credible benchmarks and raises the bar for a pre-revenue
              entrant to convert technical credibility into paid commitments.
            claimRefs:
              - CM014
