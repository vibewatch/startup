      - number: '3.3'
        title: Capability, Pricing and Go-to-Market Comparison
        blocks:
          - type: paragraph
            body: >-
              Comparison across buying criteria shows a field where no vendor yet ships a commercially fault-tolerant
              machine, so differentiation turns on the credibility of the error-correction path and the strength of
              government and cloud distribution. On error-correction efficiency Nord Quantique's hardware-efficient
              bosonic codes target a roughly 1:1 logical-to-physical qubit ratio, a sharp contrast to the hundreds or
              thousands of physical qubits per logical qubit implied by surface-code roadmaps at IBM and Google. On raw
              scale and ecosystem, however, the incumbents lead decisively: IBM and Google ship large cloud-accessible
              systems, Quantinuum and IonQ post leading benchmarks, and PsiQuantum commands the deepest capital. Pricing
              across the field is opaque because most access is grant-funded or research-tier rather than
              catalogue-priced. Go-to-market splits between government and defence procurement, where Nord Quantique has
              DARPA and Canadian footing, and cloud marketplaces dominated by the hyperscalers. Trust accrues to vendors
              with published, peer-reviewed benchmarks, an area where Nord Quantique has a credible but narrow record
              relative to the incumbents' larger bodies of work.
            claimRefs:
