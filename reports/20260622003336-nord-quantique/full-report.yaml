  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              Ranked by severity, Nord Quantique's highest risk is technology execution: delivering commercially useful,
              fault-tolerant quantum computers by 2030 is an extraordinarily ambitious target that no company has yet
              met, and the path from component-level error-correction demonstrations to an integrated fault-tolerant
              machine is long and unproven. Close behind sits competitive risk, because the company is racing
              incumbents, IBM, Google, Quantinuum, IonQ and well-funded photonic and neutral-atom challengers, with
              vastly greater capital, headcount and manufacturing depth. A third, structural risk is the
              single-architecture bet: Nord Quantique's entire thesis rests on hardware-efficient bosonic codes scaling
              to many logical qubits, and if that approach stalls there is no obvious fallback platform. These technical
              risks are amplified by valuation risk: a USD $1.4 billion valuation on a pre-revenue company sets a high
              bar that requires near-flawless execution to justify, and any slip in the roadmap, loss of a government
              program, or a competitor breakthrough could sharply compress the implied value. The remaining risk
              categories, regulatory and legal, operational, partner-dependency, financial and people, are individually
              lower severity than the core technology-and-competition cluster but several are tightly coupled to it, so
              the overall residual exposure is high and concentrated rather than diffuse.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
