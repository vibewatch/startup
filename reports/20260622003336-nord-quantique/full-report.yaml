  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique has no paying commercial customers as of mid-2026; it is a pre-revenue company whose
              product is still at the research-and-prototype stage. Its present "customers" are therefore better
              understood as funders, sponsors and research collaborators rather than buyers of a shipping product.
              Segmenting the addressable and current base by buyer type, the clearest segment today is government: the
              US Department of Defense via DARPA's Quantum Benchmarking Initiative and the Government of Canada via the
              Canadian Quantum Champions Program are the entities actually paying Nord Quantique money, in the form of
              non-dilutive R&D contracts and milestone funding. Beyond government, the company names four
              forward-looking commercial verticals that mirror the quantum-computing industry's standard demand map:
              pharmaceutical and drug-discovery firms needing molecular simulation, financial institutions seeking
              optimisation and risk advantages, materials-science and chemicals companies, and cybersecurity-sensitive
              buyers concerned with post-quantum threats. National laboratories and academic institutions form a fifth,
              research-oriented segment that overlaps with the company's own talent pipeline at the Institut quantique.
              None of these commercial verticals has yet been converted into a disclosed customer, so the segmentation
              is a map of intent and industry analogy rather than of booked demand, and the buyer, user and payer are
              all the same small set of government and research bodies today.
