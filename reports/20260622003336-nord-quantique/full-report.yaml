              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
      - number: '7.6'
        title: Mitigations, Monitoring and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Several mitigations partially offset the risk stack. The May 2026 growth round, the multi-year
              non-dilutive CQCP award and the staged DARPA funding together extend runway and provide external
              validation, reducing near-term financing and credibility risk. The milestone-chain approach, where each
              roadmap step builds on a demonstrated prior result such as the 2024 GKP coherence gain and the first
              Tesseract-code implementation, is itself a risk-management discipline, and the NY-CREATES partnership
              secures at least one fabrication path. For monitoring, the most informative leading indicators are
              logical-qubit counts and logical error rates published over time, advancement decisions in the DARPA
              programme, the cadence and size of subsequent financings, headcount growth versus plan, and any first
              commercial pilots or letters of intent. Thesis-break or kill criteria would include failure to advance in
              DARPA QBI, a stalled or shrinking logical-qubit roadmap, a down-round or inability to raise, departure of
              a founder or core technical leader, or a clear competitor breakthrough in hardware-efficient error
              correction that erodes the differentiation. The priority diligence asks are system-level benchmark data,
              contract and runway figures, freedom-to-operate analysis on the patent estate, and the board and
              governance structure. As of the June 2026 run date these risk assessments reflect the latest public
              information.
            claimRefs:
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR044
          - type: table
            tableRef: TR005
            claimRefs:
              - CR038
              - CR039
              - CR036
              - CR037
              - CR040
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Technology execution is the dominant risk
            body: >-
              Delivering useful fault-tolerant quantum computers by 2030 from current component-level demonstrations is
              an unmet, highly uncertain goal; a roadmap slip is the single most consequential failure mode.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Concentrated, correlated dependencies
            body: >-
              Funding, validation and supply concentrate in DARPA, ISED and NY-CREATES, so a single adverse event at any
              one could cascade into valuation and runway pressure.
            calloutType: risk
            claimRefs:
              - CR019
              - CR023
          - type: callout
            title: Single-architecture bet with no fallback
            body: >-
              The thesis rests entirely on bosonic codes scaling to many logical qubits; if they stall, there is no
              obvious alternative platform within the company.
            calloutType: risk
            claimRefs:
              - CR004
          - type: callout
            title: Monitor logical-qubit progress and DARPA gates
            body: >-
              The clearest leading indicators are published logical-qubit counts and error rates, DARPA advancement
              decisions, and financing cadence; treat a stall in any as a thesis-break trigger.
            calloutType: recommendation
            claimRefs:
              - CR038
              - CR039
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Nord Quantique rests on a genuine technical differentiation: hardware-efficient
              quantum error correction using GKP and Tesseract bosonic codes that targets a roughly 1:1
              logical-to-physical qubit ratio, versus the hundreds-to-thousands-to-one overhead of surface-code roadmaps
              at IBM and Google. If that efficiency advantage holds at scale, Nord Quantique could reach useful fault
              tolerance with dramatically less hardware, capital and energy than rivals, an outcome that would justify a
              large valuation. The thesis is reinforced by external validation, competitive selection into DARPA QBI
              Stage B and Canada's CQCP, a defensible patent, and a top-tier financing led by Fidelity Investments
              Canada ULC at a unicorn valuation. The anti-thesis is equally clear and, at this stage, hard to refute.
              The company is pre-revenue with no commercial customers, the 2030 fault-tolerance target is unproven and
              historically the kind of milestone that slips, and the competitive field is crowded with far
              better-resourced incumbents and several well-funded error-correction challengers. The bet is essentially
              binary on a single architecture: if bosonic codes scale, the upside is very large; if they do not, there
              is little fallback. The balance of these forces is what makes the company a credible but high-risk,
              judgment-dependent investment rather than a clear buy or a clear avoid.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV004
      - number: '8.2'
        title: Recommendation, Confidence and Stance
        blocks:
          - type: paragraph
            body: >-
              Our recommendation is to track and watch Nord Quantique rather than to underwrite at the current price,
              with medium confidence and a high risk rating, and we view the valuation stance as stretched. The
              reasoning is that the qualitative case, real technical differentiation plus strong government and investor
              validation, is offset by the absence of any commercial revenue, the unverifiable system-level performance,
              and a valuation that already discounts substantial future success. For an investor able to access the
              equity, the disciplined entry posture is to seek either a clearer technical proof point (for example, a
              demonstrated multi-logical-qubit system or a favourable DARPA Stage C decision) or improved terms and
              downside protection before committing, given the binary risk. Potential returns are wide and asymmetric:
              in a success scenario a company that reaches useful fault tolerance ahead of or alongside incumbents could
              be worth many multiples of the current valuation, while in a failure scenario a pre-revenue hardware
              company can lose most of its value in a down round or wind-down. Because the position is
              judgment-dependent and the evidence is incomplete, the recommendation is explicitly conditional on
              monitoring the technical and financing triggers set out later in this chapter, and it should be revisited
              on any material change in the roadmap, competitive landscape or funding environment.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV007
      - number: '8.3'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation context is a USD $30 million growth-equity round in May 2026 that set the company's value at
              USD $1.4 billion (about CAD $1.9 billion), led by Fidelity Investments Canada ULC with participation from
              BDC, Panache Ventures, Presidio Ventures, Quantacet, Quantonation and Real Ventures. Total private capital
              raised is on the order of USD $55 million including the 2022 seed, and total funding including
              non-dilutive government awards is roughly USD $71 million. Several features bear on entry discipline.
              First, the relatively small round size against a large valuation step implies the price is driven by
              strategic conviction and scarcity of credible fault-tolerance plays rather than by financial metrics,
              since there are none. Second, growth and venture rounds typically carry liquidation preferences and other
              terms that can disadvantage common and later investors in a downside, an overhang that is not publicly
              disclosed and should be diligenced. Third, the public evidence base, press releases and trade coverage
              rather than audited financials or system benchmarks, does not independently support the price; it supports
              the narrative. The honest conclusion is that the round is a strong validation signal from a reputable
              lead, but it is not proof that USD $1.4 billion is the right price, and entry at or above that level
              requires conviction in the technology and tolerance for a binary outcome.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
      - number: '8.4'
        title: Bull, Base and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              We frame three scenarios with explicit assumptions. In the bull case, Nord Quantique's bosonic-code
              efficiency proves out, the company demonstrates a scaling multi-logical-qubit system, advances to DARPA
              Stage C, and emerges as a leading fault-tolerance platform; in that world a valuation several multiples
              above the current USD $1.4 billion, plausibly in the USD $4-12 billion range over a multi-year horizon, is
              defensible, comparable to where the strongest private quantum players already trade. In the base case, the
              company continues to execute credibly but more slowly than its 2030 target, remains a respected,
              well-funded challenger that must keep raising capital, and holds a valuation broadly in the USD $1-2.5
              billion range with significant dilution along the way. In the bear case, the architecture fails to scale,
              a competitor achieves a decisive error-correction breakthrough, or the funding environment for pre-revenue
              quantum cools, and the valuation compresses sharply, plausibly to USD $0.3-0.7 billion or lower in a down
              round, with wind-down risk at the extreme. We do not assign precise probabilities given the evidence, but
              the downside triggers, a stalled logical-qubit roadmap, a DARPA non-advancement, or an inability to raise,
              are concrete and monitorable, and the asymmetry of outcomes is the defining feature of the investment.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: table
            tableRef: TV003
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV019
              - CV020
              - CV021
      - number: '8.5'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              Because Nord Quantique is pre-revenue, valuation must lean on comparables and milestones rather than
              multiples of financial results. Among public peers, IonQ, Rigetti and D-Wave trade at market
              capitalisations that have ranged widely with quantum sentiment, generally from low single-digit billions
              to higher, on minimal revenue, illustrating both the market's appetite for the theme and its volatility.
              Among private peers, Quantinuum has been valued at roughly USD $10 billion and PsiQuantum in the
              multiple-billions, both ahead of Nord Quantique, while Xanadu, a fellow Canadian, pursued a public listing
              in 2026. Against this set, Nord Quantique's USD $1.4 billion sits at the lower end of the credible
              fault-tolerance cohort, which can be read either as relative value, if its efficiency thesis is real and
              under-appreciated, or as appropriate discounting for its earlier stage and smaller resource base. The
              method is deliberately a range-and-analogy approach: there is no revenue to multiply, so the comparables
              establish a plausibility band rather than a point estimate, and the key swing factor is whether Nord
              Quantique's hardware-efficient approach lets it reach useful fault tolerance with materially less capital
              than peers, which would change its relative standing dramatically. All comparable figures are approximate
              and sentiment-sensitive and should be refreshed at diligence.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV025
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV026
              - CV027
              - CV028
      - number: '8.6'
        title: Exit Readiness, Triggers and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness for an investor in Nord Quantique is long-dated and tied to the technology timeline. The
              plausible exit paths are a future IPO once there is a productised, benchmarked system and revenue, much as
              Xanadu and the US public quantum names have pursued, or strategic acquisition by a larger technology,
              defense or computing company seeking a differentiated error-correction capability; a trade sale of the IP
              is a downside exit. None of these is near-term, so the position should be underwritten as a multi-year,
              illiquid, binary bet. The thesis-break and kill triggers that should drive any decision to add, hold or
              exit are concrete: failure to advance in DARPA QBI, a stalled or shrinking logical-qubit roadmap, a
              down-round or inability to raise, departure of a founder or core technical leader, or a clear competitor
              breakthrough in hardware-efficient error correction. The priority diligence asks before committing capital
              are system-level benchmark data (logical-qubit counts and error rates), burn rate and runway, the full
              financing terms including liquidation preferences, a freedom-to-operate analysis on the patent estate, and
              the board and governance structure. As of the June 2026 run date this assessment reflects the latest
              public information, and it should be revisited on any material change in the roadmap, competition or
              funding environment.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV043
          - type: table
            tableRef: TV005
            claimRefs:
              - CV036
              - CV038
              - CV023
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV016
              - CV017
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Track / watch, not underwrite at price
            body: >-
              Real differentiation and strong validation are offset by zero revenue and a stretched valuation; the
              disciplined posture is to watch for a clearer technical proof point or better terms before committing.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV010
          - type: callout
            title: Asymmetric, binary outcome
            body: >-
              Returns are wide and asymmetric: a success scenario could be worth many multiples of $1.4B, while a
              failure scenario risks a down-round or wind-down, with little architectural fallback.
            calloutType: insight
            claimRefs:
              - CV012
              - CV021
          - type: callout
            title: Price supports the narrative, not the metrics
            body: >-
              There are no financials to value; the Fidelity-led round validates conviction in the technology but does
              not prove $1.4B is the right price.
            calloutType: assumption
            claimRefs:
              - CV017
              - CV013
          - type: callout
            title: Monitor logical-qubit progress and DARPA gates
            body: >-
              Concrete thesis-break triggers, a stalled roadmap, DARPA non-advancement, or a failed raise, should drive
              any decision to add, hold or exit.
            calloutType: risk
            claimRefs:
              - CV036
              - CV023
