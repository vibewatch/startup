  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Modalities
        blocks:
          - type: paragraph
            body: >-
              The fault-tolerant quantum computing race spans at least five hardware modalities, and Nord Quantique
              competes against the strongest names in each. In superconducting qubits, the same family Nord Quantique
              uses, the incumbents are IBM, Google Quantum AI and the smaller public company Rigetti. Trapped-ion rivals
              IonQ and Quantinuum lead on gate fidelity and have advanced through DARPA's benchmarking initiative.
              Photonic approaches come from Xanadu in Toronto and the heavily funded PsiQuantum. Neutral-atom contenders
              QuEra and Atom Computing scale qubit counts quickly, while Photonic Inc. in Vancouver pursues silicon-spin
              qubits and Microsoft pursues topological qubits. D-Wave offers quantum annealing, a substitute rather than
              a universal fault-tolerant platform. Beyond direct peers, the status-quo competitor is classical
              high-performance computing, and the most credible likely entrant risk is a large cloud or semiconductor
              incumbent building in-house. Nord Quantique is by far the smallest of these by headcount and capital, so
              its competitive case rests not on outspending rivals but on a more hardware-efficient route to fault
              tolerance.
            claimRefs:
              - CP001
              - CP002
