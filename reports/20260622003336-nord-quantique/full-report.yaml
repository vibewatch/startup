  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market relevant to Nord Quantique is fault-tolerant, gate-based quantum computing hardware and the
              error-correction software and services that make it usable, sold to research institutions, governments and
              large enterprises. Included spend covers quantum processing units, cryogenic and control systems,
              quantum-computing-as-a-service cloud access, and quantum error-correction tooling. Excluded from the
              boundary is the much larger classical high-performance computing market, quantum sensing and quantum
              communications/QKD, and quantum-annealing machines such as those from D-Wave that do not target universal
              fault tolerance. The status-quo substitute for nearly every prospective workload today is classical HPC
              and GPU clusters, which remain cheaper, mature and good-enough for most problems, so the market only opens
              where a fault-tolerant quantum machine offers an advantage that classical hardware cannot match. Nord
              Quantique sits in the narrowest and least-proven slice of this boundary: pre-fault-tolerance
              superconducting hardware whose commercial market does not yet exist at scale, which is why sizing must
              lean on forward-looking analyst forecasts rather than realised revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
