      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest tailwind is the 2025-2026 shift that made quantum error correction the central battleground
              of the field: progress on logical-qubit fidelity and hardware-efficient codes has moved the conversation
              from raw qubit counts toward fault tolerance, directly favouring Nord Quantique's thesis. Government
              capital is a second driver, with DARPA's initiative able to deploy up to roughly USD $1 billion across the
              program and Canada backing national champions through the CQCP, alongside the EU Quantum Flagship and the
              UK's NQCC. The prospect of demonstrable quantum advantage in chemistry, materials and optimisation is the
              demand-side pull. Against these, the constraints are severe. Talent is the binding one: industry estimates
              put the global pool of quantum-error-correction specialists at only several hundred against a need for
              thousands by 2030. Capital intensity is high because superconducting hardware needs cryogenics,
              fabrication access and long development cycles. Buyer trust and switching costs are elevated because no
              vendor has yet shipped a fault-tolerant machine, so customers hedge across platforms. Finally, timing risk
              is acute: if useful fault tolerance slips past 2030, forecast revenue compresses and capital-raising
              conditions tighten.
            claimRefs:
