      - number: '3.2'
        title: Competitor Profiles, Scale and Funding
        blocks:
          - type: paragraph
            body: >-
              On scale and funding Nord Quantique is an order of magnitude smaller than its leading rivals. IBM is a
              public technology giant with a published multi-year quantum roadmap, modular superconducting processors
              and effectively unlimited balance-sheet support. Google Quantum AI sits inside Alphabet and unveiled its
              Willow chip as a landmark error-correction result. IonQ is a public company building trapped-ion systems
              and advanced to DARPA Stage B. Quantinuum, majority-owned by Honeywell with reported valuations around USD
              $10 billion, is the best-capitalised pure-play. PsiQuantum has raised on the order of several billion
              dollars for a photonic fault-tolerant machine and reached DARPA's most advanced stage via the US2QC
              predecessor track, alongside Microsoft. Xanadu pursued a 2026 public listing. Against these, Nord
              Quantique's roughly USD $71 million accessed and USD $1.4 billion valuation make it a credible but
              capital-light challenger whose strategy depends on efficiency and government co-funding rather than
              brute-force spend. The funding gap is the single clearest competitive disadvantage and a central diligence
              concern.
            claimRefs:
