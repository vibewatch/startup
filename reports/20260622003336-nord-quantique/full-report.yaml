        title: Founders, Leadership and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The company was co-founded by physicists Julien Camirand Lemyre, who serves as Chief Executive Officer,
              and Philippe St-Jean, both of whom emerged from the superconducting-circuit research community at the
              Institut quantique. The executive bench broadened materially in 2026: Tammy Furlong, previously CFO of
              Elevation Oncology and a VP of Finance at American Tower, was appointed Chief Financial Officer in May
              2026, and in June 2026 the company announced Tobi Day-Hamilton as Chief Communications Officer and Angela
              Olano as VP Marketing, both joining in July 2026. These hires signal a deliberate shift from a
              research-led founding team toward a commercially scaled organisation, consistent with stated plans to
              roughly double headcount during 2026. Key-person dependence remains a live concern: the scientific vision
              is concentrated in the two physicist co-founders, and the company has not publicly disclosed a board of
              directors or formal governance structure, leaving an evidence gap around oversight that diligence should
              probe directly.
