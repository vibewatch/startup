      - number: '5.2'
        title: Architecture and Error-Correction Mechanism
        blocks:
          - type: paragraph
            body: >-
              The architecture stacks from superconducting microwave circuits and high-quality cavity modes at the
              physical layer, through a bosonic encoding that stores quantum information in the many energy levels of a
              harmonic oscillator, up to logical qubits protected by error-correcting codes. The core mechanism is
              Gottesman-Kitaev-Preskill (GKP) bosonic encoding, which lets a single physical mode carry redundancy that
              would otherwise require many separate qubits, and the Tesseract code, a multimode bosonic code that Nord
              Quantique reported implementing on hardware for the first time. This is what underpins the headline claim
              of a roughly 1:1 logical-to-physical qubit ratio: where surface-code approaches at IBM and Google may need
              hundreds to thousands of physical qubits per logical qubit, a hardware-efficient bosonic approach aims to
              need far fewer. The most concrete published proof point is a demonstrated increase of about fourteen
              percent in qubit coherence time using GKP error correction on a single physical qubit, with no additional
              qubits required, a result framed in the company's and researchers' bosonic-codes work. The architecture's
              promise is efficiency; its risk is that bosonic codes must still be shown to scale to many logical qubits
              and full fault tolerance.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
