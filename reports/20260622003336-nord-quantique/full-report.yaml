      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal exposure for Nord Quantique centres on the dual-use, national-security character of
              quantum computing rather than on consumer or sectoral regulation. Advanced quantum technologies fall
              increasingly within multilateral and national export-control regimes, including the Wassenaar Arrangement
              and the US Export Administration Regulations, which can restrict cross-border sales, collaboration and
              talent movement, an acute issue for a Canadian company whose largest sponsor is the US Department of
              Defense and whose fabrication partner is in the United States. Quantum computing is also relevant to
              post-quantum cryptography and national-security policy, which invites both government support and
              government scrutiny. On intellectual property, the company's competitive position depends materially on
              its patent estate, notably US20240185112A1 covering the superconducting bosonic-code architecture; the
              legal risk is twofold, that the patents prove narrower or more contestable than hoped, and that operating
              in a crowded quantum-IP landscape raises freedom-to-operate questions. There is no disclosed litigation
              against the company, and privacy/data regulation is largely not yet applicable to a pre-product hardware
              firm. Net, regulatory and legal risk is presently moderate but rising as the company commercialises and as
              governments tighten controls on strategically sensitive quantum technology.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, Quality and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Nord Quantique faces the classic hardware-deep-tech exposures of supply chain,
              manufacturing and reliability, compounded by the exotic requirements of superconducting quantum systems.
              Fabrication is concentrated in the single NY-CREATES partnership, so any disruption there would directly
              impede device production. The systems also depend on specialised cryogenic infrastructure and a narrow
              base of suppliers for dilution refrigerators, control electronics and high-quality microwave components,
              all of which are capacity-constrained industry-wide. Manufacturing has not been demonstrated at scale: the
              company has shown component-level physics results, not repeatable production of integrated processors, so
              yield, calibration and quality control at volume remain unproven. System-level reliability metrics, error
              rates, uptime, qubit counts, are not publicly disclosed, which is expected pre-product but leaves
              operational quality unverifiable. Security risk is forward-looking and dual-edged: fault-tolerant machines
              could eventually threaten classical cryptography, which is part of why governments fund the field, but the
              company has published no formal security, quality-management or certification posture. Operationally the
              business is therefore early and fragile, with single points of failure in fabrication and a long road to
              manufacturable, reliable, certifiable systems; these are material but, for the stage, not unusual risks.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
          - type: table
            tableRef: TR002
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR013
              - CR018
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR014
              - CR022
              - CR023
              - CR018
      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique is unusually dependent on a small number of external counterparties, which transmits their
              risks directly onto the company. The DARPA Quantum Benchmarking Initiative is both a key validator and a
              key funder, and it is staged: failure to advance past a milestone gate, or a shift in US defense
              priorities, would remove validation and money simultaneously. Because DARPA is a US Department of Defense
              programme and Nord Quantique is Canadian, the relationship carries geopolitical and procurement risk that
              is elevated during US-Canada trade and security friction; export controls could in principle constrain it.
              The Canadian CQCP funding ties the company to federal innovation-policy budgets and their political
              cycles. Capital-provider dependency is real but somewhat mitigated by a syndicate that includes Fidelity
              Investments Canada ULC, BDC, Quantonation and others; still, a pre-revenue company relying on continued
              investor appetite is exposed to any cooling of quantum-funding sentiment. Supply dependency concentrates
              on NY-CREATES for fabrication. There are no commercial customers, so customer-concentration risk is latent
              rather than current, but the flip side is that the entire revenue base is government and therefore
              correlated. The dependency structure is thus highly concentrated and correlated, so a single adverse event
              at DARPA, ISED, NY-CREATES or in the funding market could cascade.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
          - type: table
            tableRef: TR003
            claimRefs:
              - CR019
