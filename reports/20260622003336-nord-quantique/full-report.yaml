  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique's product is a superconducting quantum processor that uses bosonic qubits and built-in
              quantum error correction to run quantum algorithms that classical computers cannot efficiently solve. In
              customer-workflow terms, the user is a computational scientist or quantum researcher in pharma, materials,
              finance or a national lab who needs to run quantum circuits with low enough error rates to produce useful
              results; today they are limited by noisy, error-prone qubits that require enormous overhead to correct.
              Nord Quantique's value proposition is to deliver that error correction more efficiently in the hardware
              itself, so fewer physical resources are needed per unit of reliable computation. The eventual delivery
              model is expected to be cloud or direct access to the processors plus, potentially, on-premise systems
              with a data-center-compatible footprint. The product is at a research-and-prototype stage rather than a
              shipping commercial system: the company has demonstrated component-level error-correction results and is
              building toward an integrated fault-tolerant machine, so the present "product" is best understood as a
              validated architecture and a body of demonstrated physics rather than a purchasable computer.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
