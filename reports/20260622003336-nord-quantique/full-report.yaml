      - number: '1.5'
        title: Milestone Chronology
        blocks:
          - type: paragraph
            body: >-
              The company chronology runs from a 2020 founding through a rapid 2024-2026 acceleration. After the 2022
              seed round, Nord Quantique reported in 2024 that it had become the first to demonstrate a roughly 14
              percent increase in qubit coherence time using Gottesman-Kitaev-Preskill error correction on a single
              physical qubit, followed by the first hardware implementation of the Tesseract bosonic code and a
              semiconductor supply-chain partnership with NY-CREATES. The cadence then quickened: DARPA QBI Stage B
              selection in November 2025, the Canadian Quantum Champions Program Phase 1 award in December 2025, the USD
              $30 million growth round and unicorn valuation in May 2026, the CFO appointment in May 2026, and the
              communications and marketing leadership hires announced in June 2026. This chronology, captured in the
              milestone table and timeline figure, is the single dated record of founding, financing, product, scale and
              partnership events that later chapters reuse as ground truth.
