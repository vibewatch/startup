            body: >-
              Nord Quantique's cost base is dominated by research-and-development payroll for scarce quantum physicists
              and engineers, plus the capital and operating cost of superconducting hardware development: cryogenic
              dilution refrigerators, control electronics, and access to semiconductor fabrication through partners such
              as NY-CREATES. This is a capital-intensive profile with long development cycles, and the company has
              signalled plans to roughly double headcount in 2026, which raises payroll burn materially. Because there
