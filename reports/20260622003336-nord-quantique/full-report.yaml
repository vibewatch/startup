      - number: '3.4'
        title: Switching Costs, Moats and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique's candidate moats are its patented bosonic-code architecture, its hardware-efficiency
              advantage and its embedded position in Canadian and US government quantum programs. Each is real but
              unproven at commercial scale. Switching costs in the market are currently low because buyers multi-home
              across platforms during the research phase and no production lock-in yet exists, which cuts both ways: it
              lets a small vendor win pilots, but it also means incumbents can displace it quickly once they ship
              competitive fault tolerance. Distribution power favours the hyperscalers, who can bundle quantum access
              into existing cloud relationships. The sharpest adverse evidence is simply resource asymmetry: IBM,
              Google, Microsoft and Quantinuum can each outspend Nord Quantique by one to two orders of magnitude and
              pursue multiple architectures in parallel, so if hardware-efficient bosonic codes do not scale, Nord
              Quantique has no fallback while its rivals do. Commoditization risk is moderate near-term but rises if a
              rival demonstrates cheaper fault tolerance first, which would erode Nord Quantique's core efficiency
              claim.
