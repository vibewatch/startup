      - number: '2.2'
        title: TAM, SAM and Obtainable Market
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst lenses converge on a small-but-steep curve. McKinsey's Quantum Technology Monitor pegs
              realised quantum-computing value in the low single-digit billions in 2025, scaling toward roughly USD
              $10-20 billion by 2030 and as much as USD $72-100 billion-plus by 2040 across the broader quantum economy.
              BCG and several market-research houses publish quantum-computing market forecasts that reach the tens of
              billions by the early 2030s, while Fortune Business Insights and Research and Markets project
              double-digit-to-high compound annual growth rates from a sub-USD-$2 billion 2025 base. The total
              addressable market for Nord Quantique is best framed as the global fault-tolerant quantum-computing
              hardware and access spend, which is a subset of these headline numbers. The serviceable addressable market
              narrows further to superconducting fault-tolerant systems and error-correction tooling sold to
              governments, national labs, pharma and finance. The serviceable obtainable market for a single pre-revenue
              Canadian entrant is a low-single-digit share of that subset over the rest of the decade. The wide
              dispersion across published estimates is itself the headline finding: these are forecasts, not bookings,
              and they should be treated as scenario bounds rather than point truth.
