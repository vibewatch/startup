      - number: '1.3'
        title: Funding History, Valuation and Investors
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique has assembled capital through a mix of venture equity and non-dilutive government programs.
              It emerged from stealth in February 2022 with a CAD $9.5 million (roughly USD $7 million) seed round
              backed by the BDC Capital Deep Tech Venture Fund, Quantonation and Real Ventures. In May 2026 it raised a
              USD $30 million growth-equity round led by Fidelity Investments Canada ULC, with participation from BDC,
              Panache Ventures, Presidio Ventures, Quantacet, Quantonation and Real Ventures, setting the USD $1.4
              billion (CAD $1.9 billion) valuation. Layered on top is non-dilutive support: USD $16 million under the
              Canadian Quantum Champions Program Phase 1 announced in December 2025, and a DARPA Quantum Benchmarking
              Initiative Stage B award of USD $5 million with up to USD $10 million more. Counting equity and government
              funding together, the company has accessed roughly USD $71 million, of which about USD $55 million-plus is
              private equity capital, a figure diligence should reconcile against the company directly given
              inconsistent public tallies.
