      - number: '5.3'
        title: Deployment, Reliability and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique's public roadmap targets commercially useful, fault-tolerant quantum computers by 2030,
              with stated design ambitions including a high logical clock rate in the megahertz range and a footprint
              compatible with conventional data centers, which would ease integration relative to bulkier or more exotic
              systems. The development path runs through a chain of milestones already partly demonstrated: the 2024 GKP
              coherence-gain result, the first Tesseract-code implementation, and a semiconductor supply-chain
              partnership with NY-CREATES that secures fabrication access, followed by DARPA Stage B and CQCP selections
              that fund the next stages. Reliability, integration and support specifics, such as system-level error
              rates, qubit counts, uptime and developer tooling, are not yet publicly detailed, which is expected for a
              pre-product company but is a real diligence gap. Deployment today is through research collaboration and
              benchmarking rather than productized access. The roadmap is credible in direction because each step builds
              on a demonstrated prior result, but it is aggressive in timing, and the gap between component-level
              demonstrations and an integrated, fault-tolerant, data-center-ready machine remains the central technical
              execution risk.
