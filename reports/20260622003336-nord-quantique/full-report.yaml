    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters and Stage
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique is a Canadian quantum computing company founded in 2020 in Sherbrooke, Quebec, as a
              spin-off of the Institut quantique at the Universite de Sherbrooke. Its registered headquarters sit at
              1910 rue King Ouest in Sherbrooke, and the company operates the website nordquantique.ca. The business
              builds superconducting quantum processors that use bosonic qubits and a hardware-efficient form of quantum
              error correction, a one-line description that distinguishes it from rivals chasing scale through
              brute-force physical-qubit counts. As of June 2026 the company sits at a growth-equity stage and crossed
              into unicorn territory with a USD $1.4 billion valuation in May 2026, yet it remains pre-revenue with no
              commercial product shipped. Management has publicly committed to delivering commercially useful
              fault-tolerant quantum computers by 2030, a roadmap that frames every later judgment in this report about
              execution risk, capital intensity and competitive timing.
