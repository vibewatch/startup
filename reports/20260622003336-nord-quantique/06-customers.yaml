callouts:
  - calloutType: risk
    title: No commercial customers and no validated demand
    body: As of mid-2026 Nord Quantique has zero commercial customers and no disclosed pilots; all transacting relationships are government R&D programs, so commercial willingness to pay is entirely unproven against a unicorn valuation.
    claimRefs:
      - CU001
      - CU017
  - calloutType: strength
    title: High-quality government and research validation
    body: Competitive selection into DARPA QBI Stage B and Canada's CQCP, plus NY-CREATES and Institut quantique partnerships, are demanding, credible references for technical merit even though they are not commercial sales.
    claimRefs:
      - CU011
      - CU012
      - CU013
  - calloutType: risk
    title: Extreme counterparty and geographic concentration
    body: Nearly all external revenue comes from a few government agencies in two countries, with US DARPA exposure during US-Canada friction and a single fabrication partner, leaving the customer base undiversified.
    claimRefs:
      - CU024
      - CU025
      - CU026
  - calloutType: recommendation
    title: Probe contract terms and any commercial intent
    body: Diligence should request DARPA and CQCP contract terms, Stage C mechanics, and any commercial letters of intent or pre-orders, since these are the only near-term signals of durable demand.
    claimRefs:
      - CU023
      - CU027
