company:
  name: Nord Quantique
chapter:
  number: 6
  title: Customers
  summary: "Nord Quantique has no commercial customers as of mid-2026: it is a pre-revenue quantum-hardware company whose only customer-like relationships are government R&D programs (DARPA QBI, Canada's CQCP) and research and fabrication partnerships. This chapter segments target buyers, documents the thin adoption evidence and named-proof gap, and assesses concentration risk in a customer base that is today entirely government and research-driven."
sections:
  - id: segmentation
    title: Customer Base Segmentation
    body: "Nord Quantique has no paying commercial customers as of mid-2026; it is a pre-revenue company whose product is still at the research-and-prototype stage. Its present \"customers\" are therefore better understood as funders, sponsors and research collaborators rather than buyers of a shipping product. Segmenting the addressable and current base by buyer type, the clearest segment today is government: the US Department of Defense via DARPA's Quantum Benchmarking Initiative and the Government of Canada via the Canadian Quantum Champions Program are the entities actually paying Nord Quantique money, in the form of non-dilutive R&D contracts and milestone funding. Beyond government, the company names four forward-looking commercial verticals that mirror the quantum-computing industry's standard demand map: pharmaceutical and drug-discovery firms needing molecular simulation, financial institutions seeking optimisation and risk advantages, materials-science and chemicals companies, and cybersecurity-sensitive buyers concerned with post-quantum threats. National laboratories and academic institutions form a fifth, research-oriented segment that overlaps with the company's own talent pipeline at the Institut quantique. None of these commercial verticals has yet been converted into a disclosed customer, so the segmentation is a map of intent and industry analogy rather than of booked demand, and the buyer, user and payer are all the same small set of government and research bodies today."
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption
    title: Adoption Trajectory and Evidence
    body: Because there is no commercial product, conventional adoption metrics such as active accounts, deployments, seats or utilisation do not exist and cannot be reported. The supportable adoption evidence is instead a short ladder of government-program and partnership milestones. At the top of the funnel are the broad target verticals; below them sit the government programs Nord Quantique has actually been selected into, namely DARPA QBI Stage B in November 2025 and the CQCP Phase 1 award in December 2025; below those are formal research and supply partnerships with NY-CREATES for fabrication and with academic and national-laboratory bodies for benchmarking; and at the bottom, where booked commercial pilots and paying customers would sit, the count is effectively zero. This shape means the company's adoption story is one of qualification and validation by sophisticated government buyers rather than of repeat purchase by commercial customers. The trajectory is positive in that each government selection is competitive and signals technical credibility, and the May 2026 financing implies investor confidence in eventual demand, but it provides no direct evidence of commercial willingness to pay, contract sizes, or deployment at customer sites, which remains the central adoption gap for a company carrying a unicorn valuation.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU018
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-proof
    title: Named Customer Proof and Reference Quality
    body: "The strongest named relationships Nord Quantique can point to are not commercial customers but government and research counterparties: DARPA as a contracting sponsor through the Quantum Benchmarking Initiative, the Government of Canada through ISED and the CQCP, NY-CREATES as a semiconductor-fabrication partner, and the Institut quantique at the Universite de Sherbrooke as its founding research home and talent source. Treated charitably, a government agency paying for benchmarking and milestone delivery is a form of customer, and these are high-quality, demanding references whose selection processes are competitive. Treated strictly, none of them is a commercial customer buying a product to solve a business problem, so the reference quality for go-to-market purposes is limited: there are no production deployments, no disclosed customer outcomes, no case studies and no logos from pharma, finance or industry. Independent commentators tracking the sector caution that pre-revenue quantum-hardware companies have not yet demonstrated validated commercial demand, and that the gap between government validation and commercial revenue is wide and historically slow to close. The honest read is that Nord Quantique has credible institutional proof of technical merit but effectively no proof of commercial customer demand, and diligence should weight those very differently."
    claimRefs:
      - CU013
      - CU014
      - CU011
      - CU016
      - CU015
      - CU017
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention
    title: Retention, Durability and Contract Structure
    body: "Retention metrics in the commercial sense, net revenue retention, gross retention, churn, renewal rates and cohort behaviour, do not apply to a company without commercial customers, and none are or can be reported. What can be assessed is the durability of the government relationships that currently substitute for a customer base. These show some encouraging structural features: DARPA's programme is explicitly staged, and Nord Quantique advanced from Stage A to Stage B with the possibility of further Stage C funding, which is a form of \"renewal\" through demonstrated milestone delivery; the CQCP award is multi-year and non-dilutive; and the May 2026 growth-equity round extends the company's runway independent of any single contract. However, government R&D funding is inherently programme-bound and politically contingent rather than a durable recurring revenue stream, contract values and durations are only partly disclosed, and there is no contracted commercial backlog. So while the company's funding durability looks reasonable for a pre-commercial deep-tech firm, true customer retention is unmeasurable today and represents a major item to revisit once any commercial contract exists. The diligence ask is for contract terms, renewal mechanics and any commercial letters of intent."
    claimRefs:
      - CU019
      - CU020
      - CU023
      - CU021
      - CU022
    tableRefs:
      - TU004
  - id: concentration
    title: Expansion, Concentration and Procurement Risk
    body: "Concentration risk in Nord Quantique's current customer-equivalent base is extreme by construction: essentially all external revenue comes from a handful of government programs, and within those, a small number of agencies in two countries. The largest single relationship, DARPA, is a US Department of Defense programme, which introduces geopolitical and procurement exposure for a Canadian company at a time of US-Canada trade and security friction; the second, the CQCP, ties the company to Canadian federal innovation policy and its budget cycles. On the supply side, fabrication concentrates on the single NY-CREATES partnership. The eventual commercial expansion path, the land-and-expand motion of selling early access to a few flagship pharma, finance and government customers and then growing usage, is entirely prospective and depends on first shipping a usable system around the 2030 roadmap horizon. Procurement friction is high in every target vertical: government and defense buyers have long, security-laden cycles, and regulated pharma and financial customers adopt unproven infrastructure cautiously. The Canadian quantum ecosystem and national-champion positioning provide some demand tailwind and policy support, but they do not diversify the near-term concentration, which remains one of the clearest risks in the customer picture."
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
    tableRefs:
      - TU005
    figureRefs:
      - FU004
