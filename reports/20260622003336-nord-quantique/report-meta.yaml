companyProfile:
  summary: "Nord Quantique is a Canadian quantum computing startup founded in 2020 in Sherbrooke, Quebec, developing fault-tolerant quantum computers using superconducting bosonic qubits and hardware-efficient error correction. The company's patented architecture achieves a 1:1 logical-to-physical qubit ratio through GKP and Tesseract bosonic codes, targeting fault tolerance by 2030. It has raised approximately $71M total including a $30M growth equity round at a $1.4B valuation from Fidelity Investments Canada ULC and others."
