chapter:
  number: 5
  title: Product and Technology
  summary: "Nord Quantique builds superconducting bosonic-qubit quantum processors whose differentiator is hardware-efficient quantum error correction: GKP encoding and a first hardware implementation of the Tesseract code targeting a roughly 1:1 logical-to-physical qubit ratio, a patented architecture aiming at data-center-compatible, fault-tolerant systems by 2030."
sections:
  - id: product-definition
    title: Product Definition in Workflow Terms
    body: "Nord Quantique's product is a superconducting quantum processor that uses bosonic qubits and built-in quantum error correction to run quantum algorithms that classical computers cannot efficiently solve. In customer-workflow terms, the user is a computational scientist or quantum researcher in pharma, materials, finance or a national lab who needs to run quantum circuits with low enough error rates to produce useful results; today they are limited by noisy, error-prone qubits that require enormous overhead to correct. Nord Quantique's value proposition is to deliver that error correction more efficiently in the hardware itself, so fewer physical resources are needed per unit of reliable computation. The eventual delivery model is expected to be cloud or direct access to the processors plus, potentially, on-premise systems with a data-center-compatible footprint. The product is at a research-and-prototype stage rather than a shipping commercial system: the company has demonstrated component-level error-correction results and is building toward an integrated fault-tolerant machine, so the present \"product\" is best understood as a validated architecture and a body of demonstrated physics rather than a purchasable computer."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: architecture
    title: Architecture and Error-Correction Mechanism
    body: "The architecture stacks from superconducting microwave circuits and high-quality cavity modes at the physical layer, through a bosonic encoding that stores quantum information in the many energy levels of a harmonic oscillator, up to logical qubits protected by error-correcting codes. The core mechanism is Gottesman-Kitaev-Preskill (GKP) bosonic encoding, which lets a single physical mode carry redundancy that would otherwise require many separate qubits, and the Tesseract code, a multimode bosonic code that Nord Quantique reported implementing on hardware for the first time. This is what underpins the headline claim of a roughly 1:1 logical-to-physical qubit ratio: where surface-code approaches at IBM and Google may need hundreds to thousands of physical qubits per logical qubit, a hardware-efficient bosonic approach aims to need far fewer. The most concrete published proof point is a demonstrated increase of about fourteen percent in qubit coherence time using GKP error correction on a single physical qubit, with no additional qubits required, a result framed in the company's and researchers' bosonic-codes work. The architecture's promise is efficiency; its risk is that bosonic codes must still be shown to scale to many logical qubits and full fault tolerance."
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: deployment-roadmap
    title: Deployment, Reliability and Roadmap
    body: "Nord Quantique's public roadmap targets commercially useful, fault-tolerant quantum computers by 2030, with stated design ambitions including a high logical clock rate in the megahertz range and a footprint compatible with conventional data centers, which would ease integration relative to bulkier or more exotic systems. The development path runs through a chain of milestones already partly demonstrated: the 2024 GKP coherence-gain result, the first Tesseract-code implementation, and a semiconductor supply-chain partnership with NY-CREATES that secures fabrication access, followed by DARPA Stage B and CQCP selections that fund the next stages. Reliability, integration and support specifics, such as system-level error rates, qubit counts, uptime and developer tooling, are not yet publicly detailed, which is expected for a pre-product company but is a real diligence gap. Deployment today is through research collaboration and benchmarking rather than productized access. The roadmap is credible in direction because each step builds on a demonstrated prior result, but it is aggressive in timing, and the gap between component-level demonstrations and an integrated, fault-tolerant, data-center-ready machine remains the central technical execution risk."
    claimRefs:
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
    tableRefs:
      - TE005
    figureRefs:
      - FE003
  - id: differentiation-trust
    title: Differentiation, IP and Quality Controls
    body: "Nord Quantique's differentiation is technological and intellectual-property-based: a patented superconducting bosonic-code architecture (US20240185112A1), a first-mover position on hardware implementation of the Tesseract code, and a talent pipeline anchored in the Institut quantique at the Universite de Sherbrooke. The credibility of the approach rests partly on peer-reviewed and preprint research, including a bosonic-codes perspective paper, and on independent validation through DARPA benchmarking. On trust, safety and quality, the relevant controls for a pre-commercial quantum hardware company are scientific reproducibility, benchmarking rigor and supply-chain integrity rather than consumer data-privacy or formal product certifications, none of which are yet published. Quantum computing also carries forward-looking security relevance because fault-tolerant machines could eventually threaten classical cryptography, which is part of why governments fund the field, but Nord Quantique has not published a formal security, compliance or quality-management posture. The honest assessment is that the IP and research record are genuine differentiators, while formal quality, security and certification controls are undocumented and should be probed in diligence as the company moves from physics demonstrations toward shippable systems."
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
