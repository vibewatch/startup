callouts:
  - calloutType: risk
    title: Technology execution is the dominant risk
    body: Delivering useful fault-tolerant quantum computers by 2030 from current component-level demonstrations is an unmet, highly uncertain goal; a roadmap slip is the single most consequential failure mode.
    claimRefs:
      - CR001
      - CR002
  - calloutType: risk
    title: Concentrated, correlated dependencies
    body: Funding, validation and supply concentrate in DARPA, ISED and NY-CREATES, so a single adverse event at any one could cascade into valuation and runway pressure.
    claimRefs:
      - CR019
      - CR023
  - calloutType: risk
    title: Single-architecture bet with no fallback
    body: The thesis rests entirely on bosonic codes scaling to many logical qubits; if they stall, there is no obvious alternative platform within the company.
    claimRefs:
      - CR004
  - calloutType: recommendation
    title: Monitor logical-qubit progress and DARPA gates
    body: The clearest leading indicators are published logical-qubit counts and error rates, DARPA advancement decisions, and financing cadence; treat a stall in any as a thesis-break trigger.
    claimRefs:
      - CR038
      - CR039
