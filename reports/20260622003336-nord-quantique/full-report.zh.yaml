      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique
              的监管和法律敞口，核心不在消费者或行业监管，而在量子计算的两用属性和国家安全属性。先进量子技术正越来越多地被纳入多边和国家出口管制框架，包括《瓦森纳协定》和美国《出口管理条例》，可能限制跨境销售、合作和人才流动；对一家最大赞助方是美国国防部、制造伙伴又在美国的加拿大公司来说，这一点尤其尖锐。量子计算还牵涉后量子密码和国家安全政策，因此既能获得政府支持，也会招来政府审视。知识产权方面，公司的竞争位置很大程度取决于其专利组合，尤其是覆盖超导玻色编码架构的
              US20240185112A1；法律风险有两层：专利范围可能比预期更窄、更容易被挑战；同时，在拥挤的量子 IP
              版图中运营，也会带来自由实施问题。公司没有披露诉讼，隐私和数据监管对一家尚未推出产品的硬件公司也基本尚不适用。总体看，监管和法律风险目前为中等，但公司商业化推进、各国收紧战略敏感量子技术管制后，风险正在上升。
