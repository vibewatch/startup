  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              按严重程度看，Nord Quantique 最大的风险是技术落地：到 2030
              年交付具备商业实用性的容错量子计算机，是一个极其激进的目标，至今没有公司跑通；从组件级纠错演示走到一台集成化容错机器，路径很长，也未经验证。紧随其后的是竞争风险，公司正在同
              IBM、Google、Quantinuum、IonQ 等巨头，以及资金充足的光子和中性原子路线挑战者赛跑，对手在资本、人员和制造深度上都强得多。第三个结构性风险是单一架构押注：Nord Quantique
              的整个论点都压在硬件高效的玻色编码能够扩展到大量逻辑量子比特上；如果这条路卡住，公司没有明显的备用平台。估值风险又放大了上述技术风险：一家尚未有收入的公司估值达到 USD $1.4
              billion，隐含的执行门槛很高，几乎需要零失误才撑得住；路线图任何延误、政府项目丢失，或竞争对手突破，都可能显著压缩隐含价值。其余风险类别，包括监管与法律、运营、合作伙伴依赖、财务和人员，单项严重程度低于核心的技术与竞争风险群，但其中多项与核心风险紧密耦合，因此整体剩余风险高且集中，并不分散。
