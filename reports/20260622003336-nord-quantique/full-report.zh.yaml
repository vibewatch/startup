      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强顺风来自 2025—2026 年的行业转向：量子纠错成为领域中心战场。逻辑量子比特保真度和硬件高效编码的进展，把讨论从原始量子比特数量推向容错，直接有利于 Nord Quantique
              的论点。政府资本是第二个驱动因素：DARPA 项目整体可投放最高约 USD $1 billion，加拿大通过 CQCP 支持国家冠军，另有 EU Quantum Flagship 和英国
              NQCC。需求侧拉力来自化学、材料和优化领域可证明量子优势的前景。与这些顺风相对，约束也很重。人才是卡口：行业估计，全球量子纠错专家只有数百人，而到 2030
              年需求将达到数千人。资本强度很高，因为超导硬件需要低温设备、制造访问和长期开发周期。买方信任和转换成本也高，因为还没有供应商交付容错机器，客户会跨平台对冲。最后是时点风险：如果有用的容错能力推迟到 2030
              年之后，预测收入会被压缩，融资条件也会收紧。
