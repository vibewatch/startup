  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique
              的产品是一种超导量子处理器，用玻色量子比特和内置量子纠错来运行经典计算机无法高效求解的量子算法。放到客户工作流里，用户是制药、材料、金融或国家实验室中的计算科学家或量子研究人员。他们需要以足够低的错误率运行量子电路，才能产出有用结果；今天，他们受限于噪声大、易出错的量子比特，纠错需要巨大开销。Nord
              Quantique
              的价值主张，是把纠错更高效地做进硬件本身，让每单位可靠计算所需物理资源更少。最终交付模式预计是云访问或直接访问处理器，并可能提供具备数据中心兼容占地的本地系统。产品仍处于研究和原型阶段，而不是已出货商业系统：公司已证明组件级纠错结果，并正朝集成容错机器推进。因此，当前「产品」最好理解为一个已验证架构和一组已展示物理结果，而不是一台可购买的计算机。
