        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公司由两位物理学家共同创立：现任首席执行官 Julien Camirand Lemyre 和 Philippe St-Jean。两人都出自 Institut quantique 的超导电路研究群体。2026
              年，管理层厚度明显增加：Tammy Furlong 此前曾任 Elevation Oncology CFO 和 American Tower 财务副总裁，2026 年 5 月出任首席财务官；公司又在 2026 年
              6 月宣布 Tobi Day-Hamilton 出任首席传播官、Angela Olano 出任营销副总裁，两人均于 2026 年 7
              月加入。这些任命释放出一个信号：公司正有意从研究主导的创始团队，转向可商业化扩张的组织，也呼应其 2026
              年员工数大致翻倍的计划。关键人物依赖仍是现实问题：科学愿景集中在两位物理学家联合创始人身上，公司也未公开披露董事会或正式治理结构，围绕监督机制留下了尽调需要直接追问的证据缺口。
