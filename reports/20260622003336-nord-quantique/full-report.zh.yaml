        title: 身份、总部与发展阶段
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique 是一家加拿大量子计算公司，2020 年创立于魁北克省 Sherbrooke，由 Universite de Sherbrooke 的 Institut quantique
              孵化而来。公司注册总部位于 Sherbrooke 的 1910 rue King Ouest，官网为
              nordquantique.ca。它开发超导量子处理器，用玻色量子比特和硬件高效的量子纠错。这一句话就把它和靠堆物理量子比特数量追规模的对手区分开来。截至 2026 年 6 月，公司处于成长股权阶段，并在
              2026 年 5 月以 USD $1.4 billion 估值进入独角兽行列；但它仍未产生收入，也没有商业产品出货。管理层公开承诺到 2030
              年交付具备商业实用性的容错量子计算机。这个路线图决定了本报告后续对执行风险、资本强度和竞争时点的所有判断。
