  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              与 Nord Quantique
              相关的市场，是面向研究机构、政府和大型企业销售的容错、门控量子计算硬件，以及让硬件可用的纠错软件和服务。纳入范围的支出包括量子处理单元、低温和控制系统、量子计算即服务云访问，以及量子纠错工具。边界之外，是规模大得多的经典高性能计算市场、量子传感、量子通信
              / QKD，以及 D-Wave 等不瞄准通用容错的量子退火机器。今天，几乎所有潜在工作负载的现状替代方案仍是经典 HPC 和 GPU
              集群；它们更便宜、更成熟，对多数问题也够用。因此，只有当容错量子机器能提供经典硬件无法匹配的优势时，市场才真正打开。Nord Quantique
              位于这个边界中最窄、验证最少的一段：尚未达到容错阶段的超导硬件，其商业市场还没有形成规模。因此，市场测算必须依赖前瞻性分析师预测，而不是已实现收入。
            claimRefs:
