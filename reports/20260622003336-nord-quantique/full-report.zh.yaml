      - number: '7.5'
        title: 财务、模型与人员风险
        blocks:
          - type: paragraph
            body: >-
              财务上，主导风险是零收入叠加高资本强度：打造容错量子硬件极其烧钱，公司尚无收入，还必须靠投资和非稀释性补助支撑通往 2030 年的长路线图。烧钱速度和现金跑道没有公开披露，外部无法核实 2026 年 5
              月融资加上 CQCP 和 DARPA 资金能撑多久；几乎肯定还需要后续大额融资，一旦情绪转向，就会带来稀释或 down-round
              风险。没有产品和定价，毛利率和单位经济模型也无从评估。人员和执行方面，公司存在显著的关键人物和创始人集中风险：公司由一小群物理学家创立并领导，CEO Julien Camirand Lemyre 和联合创始人
              Philippe St-Jean 对科学路线和公司叙事都居于核心位置。高管团队正在快速补齐，2026 年新加入
              CFO、传播和营销负责人；这增强了能力，也带来整合风险。公司还计划大幅扩员，而全球量子纠错专家严重短缺，据估计只有数百人。治理和董事会构成没有公开详细信息。因此，财务和人员风险总体较高，并且与技术时间表相互缠绕。
