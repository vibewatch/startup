      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              我们用明确假设框定三种情景。牛市情景下，Nord Quantique 的玻色编码效率得到验证，公司展示可扩展的多逻辑量子比特系统，推进到 DARPA Stage C，并成为领先的容错平台；在这个世界里，当前
              USD $1.4 billion 估值之上数倍的估值可以自洽，多年维度上达到 USD $4-12 billion 区间也说得通，与最强的私有量子玩家已经交易的位置相近。基准情景下，公司继续可信执行，但慢于
              2030 年目标，仍是受尊重、资金充足的挑战者，同时必须持续融资；估值大体维持在 USD $1-2.5 billion
              区间，过程中伴随显著稀释。熊市情景下，架构无法扩展，竞争对手取得决定性纠错突破，或尚未有收入的量子公司融资环境降温，估值会大幅压缩；down-round 中可能降至 USD $0.3-0.7 billion
              或更低，极端情况下存在清算风险。鉴于证据有限，我们不分配精确概率；但下行触发因素——逻辑量子比特路线图停滞、DARPA 未晋级，或无法融资——具体且可监测，结果不对称正是这项投资的定义性特征。
            claimRefs:
              - CV019
