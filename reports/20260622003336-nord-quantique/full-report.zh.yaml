      - number: '5.2'
        title: 架构与纠错机制
        blocks:
          - type: paragraph
            body: >-
              这套架构从物理层的超导微波电路和高质量腔模开始，经由把量子信息存入谐振子多个能级的玻色编码，向上形成由纠错码保护的逻辑量子比特。核心机制包括 Gottesman-Kitaev-Preskill (GKP)
              玻色编码，以及 Tesseract code。前者让单个物理模式承载原本需要许多独立量子比特才能实现的冗余；后者是一种多模玻色编码，Nord Quantique 称其首次在硬件上实现。这支撑了公司约 1:1 逻辑
              / 物理量子比特比例的头部主张：IBM 和 Google 的表面码路径可能每个逻辑量子比特需要数百到数千个物理量子比特，而硬件高效玻色路径目标是少得多。最具体的已发布证明点，是在单个物理量子比特上用 GKP
              纠错把量子比特相干时间提升约 14%，且不需要额外量子比特；这一结果来自公司和研究人员的玻色编码工作。架构的承诺是效率；风险在于，玻色编码仍需证明能扩展到许多逻辑量子比特和完整容错。
