      - number: '8.3'
        title: 融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              估值背景是 2026 年 5 月一轮 USD $30 million 的成长股权融资，将公司估值定在 USD $1.4 billion（约 CAD $1.9 billion），由 Fidelity
              Investments Canada ULC 领投，BDC、Panache Ventures、Presidio Ventures、Quantacet、Quantonation 和 Real Ventures
              参投。包括 2022 年种子轮在内，累计私募资本约 USD $55 million；若加上非稀释性政府资助，总融资约 USD $71
              million。几个特征会影响进入纪律。第一，相对较小的融资规模对应大幅估值跃升，意味着价格由战略信念和稀缺的可信容错标的推动，而不是由财务指标推动——因为财务指标并不存在。第二，成长轮和风投轮通常带有清算优先权及其他条款，在下行情景中可能不利于普通股和后进入投资人；这些悬置条款没有公开披露，应纳入尽调。第三，公开证据基础是新闻稿和行业报道，而非经审计财务或系统基准，不能独立支撑价格；它支撑的是叙事。诚实的结论是，这一轮来自声誉良好的领投方，验证信号很强，但并不能证明
              USD $1.4 billion 就是合理价格；以该水平或更高水平进入，需要相信技术，并能承受二元结果。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
