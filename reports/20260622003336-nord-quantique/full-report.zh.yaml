              DARPA 的 Quantum Benchmarking Initiative、加拿大政府通过 Canadian Quantum Champions Program，以非稀释研发合同和里程碑资金形式实际向
              Nord Quantique
              付款。政府之外，公司提到四个前瞻性商业垂直，与量子计算行业标准需求图谱一致：需要分子模拟的制药和药物发现公司、寻求优化和风险优势的金融机构、材料科学和化学公司，以及关注后量子威胁的网络安全敏感买方。国家实验室和学术机构构成第五个研究导向细分，并与公司自身在
