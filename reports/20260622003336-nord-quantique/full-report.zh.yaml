      - number: '8.2'
        title: 建议、信心与立场
        blocks:
          - type: paragraph
            body: >-
              我们对 Nord Quantique
              的建议是跟踪和观察，而不是按当前价格承销；信心为中等，风险评级为高，估值立场偏高。理由是，定性故事——真实技术差异化加上强政府和投资人验证——被几个因素抵消：没有任何商业收入、系统级性能无法验证，以及估值已经折现了相当多的未来成功。对能够取得股权的投资人来说，考虑到二元风险，纪律性的进入姿态应是在投入前等待更清晰的技术证明点，例如已展示的多逻辑量子比特系统或有利的
              DARPA Stage C 决定，或者争取更好条款和下行保护。潜在回报区间很宽且不对称：成功情景下，如果公司早于或跟随巨头达到有用容错，价值可能达到当前估值的许多倍；失败情景下，一家尚未有收入的硬件公司可能在
              down-round 或清算中损失大部分价值。由于仓位取决于判断且证据不完整，本建议明确以本章后文列出的技术和融资触发因素监测为条件；路线图、竞争格局或融资环境出现任何重大变化，都应重新审视。
