      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Nord Quantique 面临硬件深科技典型的供应链、制造和可靠性风险，超导量子系统的特殊要求又进一步放大了这些风险。制造集中在 NY-CREATES
              这一单一合作关系上，任何中断都会直接拖住器件生产。系统还依赖专门的低温基础设施，以及稀释制冷机、控制电子设备和高质量微波组件等少数供应商；这些环节全行业都受产能约束。规模化制造尚未得到验证：公司展示的是组件级物理结果，而不是集成处理器的可重复生产，因此量产时的良率、校准和质量控制仍未证实。系统级可靠性指标、错误率、正常运行时间、量子比特数量都未公开披露；这符合产品前阶段的状态，但也让运营质量无法外部验证。安全风险带有前瞻性且有两面：容错机器最终可能威胁经典密码体系，这也是政府资助该领域的原因之一；但公司没有发布正式的安全、质量管理或认证立场。因此，运营上这家公司仍早期且脆弱，制造存在单点故障，到可制造、可靠、可认证的系统还有很长路要走；这些风险重大，但就阶段而言并不反常。
