      - number: '2.2'
        title: TAM、SAM 与可获得市场
        blocks:
          - type: paragraph
            body: >-
              多个分析师视角都指向一条小而陡的曲线。McKinsey 的 Quantum Technology Monitor 估计，2025 年已实现的量子计算价值为低个位数十亿美元，到 2030 年增至约 USD
              $10-20 billion；放到更广义的量子经济，到 2040 年最高可达 USD $72-100 billion 以上。BCG 和多家市场研究机构发布的量子计算市场预测，到 2030
              年代初达到数百亿美元；Fortune Business Insights 以及 Research and Markets 则预计，市场会从 2025 年不到 USD $2 billion
              的基数出发，取得两位数到高位的复合年增长率。Nord Quantique
              的总可寻址市场，最好定义为全球容错量子计算硬件和访问支出，这是上述大数中的一个子集。可服务可寻址市场进一步收窄为面向政府、国家实验室、制药和金融客户销售的超导容错系统与纠错工具。对一家尚未产生收入的加拿大新进入者而言，未来十年剩余时间里的可服务可获得市场，只是该子集的低个位数份额。已发布估算分散很大，本身就是核心结论：这些是预测，不是订单，应把它们当作情景边界，而非点状真值。
