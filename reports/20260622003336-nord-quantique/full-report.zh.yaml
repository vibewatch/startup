  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与技术路线
        blocks:
          - type: paragraph
            body: >-
              容错量子计算竞赛横跨至少五种硬件路线，Nord Quantique 要面对每条路线中最强的名字。在超导量子比特上，也就是 Nord Quantique 所用的同一类路线，在位者包括 IBM、Google
              Quantum AI 和规模较小的上市公司 Rigetti。离子阱对手 IonQ 和 Quantinuum 在门保真度上领先，并已推进到 DARPA 的基准测试项目。光子路线来自多伦多的 Xanadu
              和重金支持的 PsiQuantum。中性原子选手 QuEra 和 Atom Computing 快速扩大量子比特数量，温哥华的 Photonic Inc. 追求硅自旋量子比特，Microsoft
              则押注拓扑量子比特。D-Wave 提供量子退火，是替代方案，而非通用容错平台。直接同行之外，现状竞争者是经典高性能计算；最可信的潜在进入风险，是大型云或半导体在位者自研。按员工数和资本看，Nord
              Quantique 明显是其中最小的一家。因此，它的竞争论点不是比对手更能花钱，而是用更硬件高效的路径实现容错。
