  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique 的投资论点建立在真实的技术差异化上：公司用 GKP 和 Tesseract 玻色编码做硬件高效的量子纠错，目标是约 1:1 的逻辑量子比特与物理量子比特比例；相比之下，IBM 和
              Google 的表面码路线需要数百到数千比一的开销。如果这种效率优势在规模化后成立，Nord Quantique 可能用远少于竞争对手的硬件、资本和能源达到有用容错，从而支撑高估值。外部验证也强化了这一论点：入选
              DARPA QBI Stage B 和加拿大 CQCP、拥有可防守专利，并由 Fidelity Investments Canada ULC
              领投、按独角兽估值完成顶级融资。反论点同样清楚，而且在当前阶段很难驳倒。公司尚未有收入，也没有商业客户；2030
              年容错目标未经验证，历史上这类里程碑往往会延后；竞争场里既有资源充足得多的巨头，也有多家资金充足的纠错挑战者。这基本是一场压在单一架构上的二元押注：如果玻色编码能扩展，上行空间很大；如果不能，几乎没有退路。正是这些力量的平衡，让公司成为一个可信但高风险、依赖判断的投资标的，而不是明确买入或明确回避。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
