      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的需求集中在少数买方类型上。今天，他们资助量子计算，更多是为了研究和期权价值，而不是生产工作负载。政府和国防机构是近期主导付款方，通过 DARPA 的 Quantum Benchmarking
              Initiative 和加拿大 Quantum Champions Program
              等项目采购；这里的用户是国家实验室或研究部门，预算所有者是项目办公室。制药和材料公司是最常被提及的商业垂直，目标是分子模拟和催化剂发现，探索性访问由研发预算所有者赞助。金融机构追逐优化、风险和密码学用例，资金来自创新或量化研究预算。各细分市场的采用路径基本一致：先由赞助研究接入，再做基准测试和概念验证；一旦证明容错和明确的量子优势，再进入早期生产。采购靠关系和资助驱动，而不是目录式销售。这有利于拥有政府关系和可信基准的在位者，也抬高了尚未产生收入的新进入者把技术可信度转化为付费承诺的门槛。
