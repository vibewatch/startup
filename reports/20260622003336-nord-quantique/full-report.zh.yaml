      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique 尚未有收入，估值必须依靠可比公司和里程碑，而不是财务结果倍数。公开市场同业中，IonQ、Rigetti 和 D-Wave
              的市值会随着量子情绪大幅波动，通常从低个位数十亿美元到更高不等，而收入很少；这同时说明市场对主题的胃口和波动性。私有同业中，Quantinuum 估值约 USD $10 billion，PsiQuantum
              也在数十亿美元级，二者都领先 Nord Quantique；同为加拿大公司的 Xanadu 则在 2026 年推动公开上市。放在这组可比对象中，Nord Quantique 的 USD $1.4 billion
              位于可信容错队列的较低端；如果其效率论点真实且被低估，可以解读为相对价值；也可以解读为对其更早阶段和较小资源基础的合理折价。方法上，这里刻意采用区间和类比：没有收入可乘，因此可比对象建立的是可信区间，而不是点估值；关键摆动因素在于，Nord
              Quantique 的硬件高效路线是否能让它用显著少于同业的资本达到有用容错，若能，其相对位置会被大幅改写。所有可比数字均为近似值且受情绪影响，尽调时应刷新。
