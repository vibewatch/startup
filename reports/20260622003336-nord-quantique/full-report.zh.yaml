      - number: '1.3'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique 的资本来自风险股权和非稀释性政府项目的组合。公司在 2022 年 2 月走出隐身状态，完成 CAD $9.5 million（约 USD $7 million）种子轮，投资方包括
              BDC Capital Deep Tech Venture Fund、Quantonation 和 Real Ventures。2026 年 5 月，公司完成 USD $30 million 成长股权轮，由
              Fidelity Investments Canada ULC 领投，BDC、Panache Ventures、Presidio Ventures、Quantacet、Quantonation 和 Real
              Ventures 参投，定下 USD $1.4 billion（CAD $1.9 billion）估值。其上还有非稀释支持：2025 年 12 月宣布的 Canadian Quantum Champions
              Program Phase 1 下的 USD $16 million，以及 DARPA Quantum Benchmarking Initiative Stage B 的 USD $5 million
              奖励，另有最高 USD $10 million 后续资金。股权和政府资金合计，公司已获得约 USD $71 million，其中约 USD $55 million
              以上为私募股权资本。公开统计口径并不一致，尽调应直接向公司核对这一数字。
