        title: 退出准备度、触发因素与尽调问题
        blocks:
          - type: paragraph
            body: >-
              对 Nord Quantique 投资人而言，退出准备度很遥远，并与技术时间表绑定。可能退出路径包括：未来在拥有产品化、已基准测试的系统和收入后 IPO，类似 Xanadu
              和美国公开量子公司追求的路径；或被寻求差异化纠错能力的大型科技、国防或计算公司战略收购；出售 IP
              则是下行退出。上述路径都不在近期，因此应把该仓位按多年期、非流动、二元押注来承销。应驱动任何增持、持有或退出决定的打破投资论点和终止触发因素很具体：未能在 DARPA QBI
              晋级，逻辑量子比特路线图停滞或收缩，出现 down-round
              或无法融资，创始人或核心技术负责人离职，或竞争对手在硬件高效纠错上取得明确突破。投入资本前的优先尽调问题包括系统级基准数据（逻辑量子比特数量和错误率）、烧钱速度和现金跑道、包括清算优先权在内的完整融资条款、专利组合的自由实施分析，以及董事会和治理结构。截至
