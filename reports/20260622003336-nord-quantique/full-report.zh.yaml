          - type: paragraph
            body: >-
              Nord Quantique 对少数外部交易方的依赖异常高，这些交易方的风险会直接传导到公司。DARPA Quantum Benchmarking Initiative
              既是关键验证方，也是关键资金方，而且采用分阶段机制：未能通过某个里程碑关口，或美国国防优先级变化，会同时拿走验证和资金。DARPA 属于美国国防部项目，而 Nord Quantique
              是加拿大公司；在美加贸易和安全摩擦升温时，这段关系带有更高的地缘政治和采购风险，出口管制原则上也可能约束合作。加拿大 CQCP 资金把公司绑定到联邦创新政策预算及其政治周期上。资本提供方依赖真实存在，但由
              Fidelity Investments Canada ULC、BDC、Quantonation
              等组成的财团在一定程度上缓解了风险；不过，一家尚未有收入、依赖投资人持续兴趣的公司，仍会暴露于量子融资情绪降温。供应依赖集中在 NY-CREATES
              的制造环节。公司没有商业客户，因此客户集中风险是潜在而非当前风险；但反过来，整个收入基础都来自政府，相关性很高。因此，这一依赖结构高度集中且高度相关，DARPA、ISED、NY-CREATES
              或融资市场的任何单一不利事件都可能引发连锁反应。
