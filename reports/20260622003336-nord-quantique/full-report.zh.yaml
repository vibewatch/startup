      - number: '7.6'
        title: 缓释、监测与终止标准
        blocks:
          - type: paragraph
            body: >-
              几项缓释因素部分抵消了这组风险。2026 年 5 月增长轮、多年期非稀释性 CQCP 资助和分阶段 DARPA
              资金共同拉长了现金跑道，并提供外部验证，降低近期融资和可信度风险。以里程碑串联的路线本身也是一种风险管理纪律：每一步都建立在此前已展示结果之上，例如 2024 年 GKP 相干性提升和首次 Tesseract
              编码实现；NY-CREATES 合作也至少锁定了一条制造路径。监测上，最有信息量的领先指标包括随时间公布的逻辑量子比特数量和逻辑错误率、DARPA
              项目推进决定、后续融资的节奏和规模、人员增长相对计划的完成情况，以及任何首批商业试点或意向书。打破投资论点或触发终止的标准包括：未能在 DARPA QBI 中晋级，逻辑量子比特路线图停滞或收缩，出现
              down-round
              或无法融资，创始人或核心技术负责人离职，或竞争对手在硬件高效纠错上取得明确突破、侵蚀差异化。优先尽调问题包括系统级基准数据、合同和现金跑道数字、专利组合的自由实施分析，以及董事会和治理结构。截至 2026 年 6
              月运行日期，这些风险评估反映最新公开信息。
