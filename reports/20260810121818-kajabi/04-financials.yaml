    {
      "id": "verdict-and-blockers",
      "title": "Financial Verdict: Good Revenue Quality Narrative, Incomplete Underwriting File",
      "body": "The financial case for Kajabi is stronger qualitatively than quantitatively. Qualitatively, the company appears to have a solid subscription-led revenue engine, a no-take-rate message that fits serious creators, evidence of large ecosystem throughput, and enough historical capital to avoid obvious near-term financing stress. Those are attractive ingredients for a durable creator-software business. Quantitatively, however, too many underwriting variables are missing or conflicted: realized ARR, plan mix, payment take rate, gross margin, net retention, CAC, payback, support burden, and actual cash burn. Public sources also mix different years and methodologies, which increases the risk of anchoring on a stale 2021 unicorn valuation rather than present operating facts.\n\nAccordingly, the right financial conclusion is not that Kajabi is weak. It is that Kajabi remains investable only with disciplined humility on inputs. Subscription revenue quality likely deserves a favorable provisional read; margin path likely resembles strong SaaS economics diluted by payments and support; and capital intensity looks much lower than in hardware or fintech balance-sheet businesses. But the public file is still too incomplete to support fine-grained valuation work. The main diligence blockers are simple: management must provide clean ARR, retention, gross margin, burn, payments-mix, and customer-segment economics before the company can be priced with conviction rather than narrative.",
