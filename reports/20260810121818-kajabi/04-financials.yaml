    {
      "id": "cost-structure-and-capital",
      "title": "Cost Structure and Capital Adequacy: Likely Healthy Economics, Weak Disclosure",
      "body": "Kajabi’s cost structure should be read as software-plus-payments, not pure SaaS. A meaningful portion of gross profit likely comes from recurring subscription fees, while payment processing and related commerce services carry lower margins because they depend on external rails such as Stripe and bank-transfer infrastructure. Stripe’s published pricing illustrates the pressure points: standard online card processing at 2.9% + 30¢, Billing at 0.7% of billing volume, ACH at 0.8%, international surcharges, tax tooling, and dispute handling all create real delivery costs for any creator platform that monetizes payments or recurring billing. Kajabi’s own ACH invoicing documentation confirms that lower-cost bank transfers matter enough to be productized for invoice use cases.\n\nThe best public comparable for reading Kajabi’s likely financial shape is Thinkific. Thinkific’s Q1 and Q2 2026 reports show subscription revenue of about $15.2M per quarter, commerce revenue of $3.4M-$3.5M, gross margin of 72%-73%, ARR around $61M-$62M, cash and short-term investments of about $49M-$51M, and improving adjusted EBITDA / operating cash flow. That does not prove Kajabi shares identical economics, but it shows what a creator-business software company with real payments mix can look like when disclosed. Kajabi’s own capital adequacy is only indirectly visible. The 2021 $550M financing was large, the company described itself as profitable at that time, and there is no public evidence in the retained set of distressed debt or mass layoffs. Headcount signals appear broadly stable in the high-300s to low-400s. That combination suggests Kajabi is unlikely to be in acute financing trouble in 2026, but monthly burn, runway, and planned uses of capital cannot be solved from public evidence alone.",
