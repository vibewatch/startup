  topStrengths:
    - >-
      Kajabi has a real all-in-one creator-commerce product with meaningful breadth across content, marketing,
      community, and payments workflows.
    - >-
      Official milestone evidence shows substantial ecosystem scale, including $10B+ cumulative creator revenue and
      100,000+ creators and entrepreneurs served.
    - >-
      The no-platform-fee subscription model and multi-product expansion logic support recurring-revenue quality and
      switching costs above simpler point solutions.
    - >-
      The company reached scale after a long bootstrapped period and was described as profitable at the time of its 2021
      financing.
  topRisks:
    - >-
      The last disclosed >$2B valuation looks hard to defend on 2026 public comp ranges unless Kajabi materially
      outperforms the limited public ARR proxies.
    - >-
      Kajabi does not publicly disclose audited ARR, growth, gross margin, NRR, cash burn, or detailed cap-table terms,
      which keeps underwriting diligence-heavy.
    - >-
      Competition is intensifying across creator software, communities, newsletters, and owned-audience tooling from
      Thinkific, Teachable, Circle, Beehiiv, ConvertKit, and adjacent platforms.
    - >-
      Customer complaints around pricing, billing, support quality, and cancellations create some durability and
      brand-risk noise even though many customers are enthusiastic.
  unresolvedGaps:
    - No retained public source provides audited 2024-2026 ARR, revenue growth, gross margin, or net retention.
    - >-
      The latest secondary pricing, 409A, preference stack, and any post-2021 valuation reset are not visible in
      retained public sources.
    - >-
      Public evidence does not resolve plan-tier mix, top-customer concentration, or how much value Kajabi captures from
      payments and other add-ons.
    - >-
      Leadership and headcount labeling remain somewhat inconsistent across official founder communications and
      third-party company databases.
