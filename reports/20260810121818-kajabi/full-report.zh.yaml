  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 为什么重要
      - 缓释措施 / 尽调问题
    rows:
      - - 一体化广度减少工具蔓延
        - Podia、Circle、Thinkific 都在越来越多地营销自家一体化栈
        - 高
        - 捆绑叙事正在趋同，单靠话术拉不开差异
        - 要求提供赢单 / 输单数据，证明哪些捆绑型任务只有 Kajabi 能赢
      - - 不抽收入分成，是对创作者友好的有效信息
        - beehiiv、Thinkific、Podia、Kit 也用低费率或零抽成结构竞争
        - 中
        - 零抽成有帮助，但并不独占
        - 不要只看名义抽成率，要把创作者完整成本栈与多工具替代方案建模比较
      - - 课程 + 社区 + 辅导 + 营销放在同一屋檐下，制造切换成本
        - 用 Thinkific / Teachable + Circle，或 Kit / beehiiv 组合，多栖仍然可行
        - 高
        - 同类最优工具栈能以更低入门成本复刻许多用例
        - 量化 Kajabi 客户有多常使用 3 条以上主要产品线，而不是只用一条
      - - Kajabi 能服务严肃专家型业务，而不只是业余玩家
        - Thinkific 在收入、B2B 销售和客户规模上有更强公开证明
        - 高
        - 上市公司披露能让更机构化的买家更放心
        - 要求 Kajabi 提供更大体量创作者、团队和企业客群的分段数据
      - - 社区是 Kajabi 差异化的一部分
        - Circle 领先社区优先叙事和品牌 app 深度
        - 高
        - 社区驱动型业务可能先选 Circle，之后才考虑 Kajabi
        - 比较 Kajabi 与 Circle 客户的社区留存、移动端互动和收入附着
      - - 受众所有权是 Kajabi 叙事核心
        - beehiiv、Substack、Kit 能先拿下自有受众层
        - 中
        - 创作者可能先在通讯简报主导栈上标准化，之后才需要 Kajabi
        - 跟踪 Kajabi 客户有多少从通讯简报平台迁移而来，多少原生起步
      - - 价格溢价体现集成价值
        - 竞品的低价或免费套餐制造价格挤压，并推迟客户整合
        - 高
        - 创作者可能比 Kajabi 希望的更久留在便宜平台上
        - 要求提供 Kajabi 相对拼接替代方案的升级路径证据和回本逻辑
      - - AI 和工作流创新可能成为未来护城河
        - Thinkific、Circle、Teachable、beehiiv、Kit 都在重度宣传 AI 或自动化
        - 中
        - 功能新鲜感在全行业快速消退
        - 审查 Kajabi AI 功能相对同行的采用率和变现影响
    notes: 本登记表聚焦竞争耐久性，而非一般公司风险。几个威胁来自趋同：竞争对手正从不同起点复制 Kajabi 叙事。
