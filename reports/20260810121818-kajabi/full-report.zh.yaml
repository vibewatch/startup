  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合同风险：Kajabi 帮助合规，但把主要责任推回创作者
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的公开法律姿态在一点上异常清楚：平台提供工具、模板和工作流，但不承担在其上经营业务的创作者的主要合规责任。隐私通知和帮助中心材料称，Kajabi 提供用于 GDPR 和 CCPA
              式合规的功能，在适用时自动纳入 DPA 和标准合同条款，并提供数据权利工作流。但这些材料也反复强调，创作者必须自己起草条款、隐私政策、同意流程和业务特定的合规实践。问题在于，Kajabi
              位于敏感客户数据、支付、订阅、营销邮件和社区互动的中间，却在合同上避免扮演端到端合规担保人。


              法律文件也制造双向风险。一边，Kajabi 的条款要求清晰政策、选择加入实践、退订功能和合法营销行为，这些是真实缓释。另一边，同一套条款赋予 Kajabi
              广泛权利，可以变更服务、审核内容，并把争议导入个人仲裁。2026 年联邦监管图景也比简单一句「FTC 一键取消已生效」更细：2024 年 FTC
              负面选项修正案被撤销，旧规则恢复，但订阅取消、隐私和州法暴露并未消失。加州隐私规则、州级隐私覆盖扩大，以及至少一起 2025 年和解诉讼合在一起说明，Kajabi 仍处在有分量且活跃的法律风险面中。
