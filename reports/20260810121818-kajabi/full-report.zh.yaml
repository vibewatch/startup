        title: 扩张与集中度：落地扩张逻辑强，公开收入集中度可见性弱
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的扩张逻辑直观。创作者可以从一门课程或一项辅导服务开始，再逐步加入邮件获客、社区、加售、会员、播客和品牌化交付。产品和定价页面把更多联系人、产品、社区、管理员席位和 API
              访问捆绑在高阶套餐里，强化这条先落地再扩张的路径。多篇评测和客户故事也印证同一模式：业务长到多种变现形式、开始替换更多独立工具时，Kajabi 变得更有价值。


              仍不清楚的是集中度。创作者业务的长尾属性意味着客户标识集中度应当较低，但这无法说明收入集中度。Kajabi 的经济性仍可能不成比例地依赖更大的 Growth 和 Pro
              账户，或依赖拥有较大邮件列表和循环项目的创作者。公开来源没有回答这个问题，也没有提供合同期限或续约可见性。最稳妥的结论是：Kajabi
              可能受益于低单一客户标识依赖和强扩张路径，但在把客户耐久性视为已解决之前，投资人仍需要管理层提供头部账户暴露、套餐结构和队列留存数据。
