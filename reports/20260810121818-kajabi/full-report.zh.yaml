  - id: FR001
    title: 风险热力图
    type: matrix
    summary: Kajabi 当前公开风险暴露的热力图。最重的单元格集中在隐私 / 合规、变现关键工作流的运行可靠性和合作伙伴依赖，而不是某个已披露的单一存亡事件。
    claimRefs:
      - CR003
      - CR014
      - CR016
      - CR018
      - CR020
      - CR022
      - CR026
      - CR033
      - CR039
      - CR040
      - CR045
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 评论渠道投诉漂移
            - 支持供应商中断
            - 隐私权请求工作量增长
            - 宕机冲击变现工作流
        - label: 中高可能性
          values:
            - 创作者合规误用
            - 拒付 / 争议拖累
            - 支付通道依赖
            - AI 治理疏漏
        - label: 中等可能性
          values:
            - 仲裁带来的和解成本
            - 应用商店政策摩擦
            - 安全控制披露缺口
            - 州法执法扩张
        - label: 低可能性
          values:
            - 重大公开诉讼潮
            - 支付处理商持续故障
            - 严重数据泄露披露
            - 平台级论点破裂事件
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 用有向图展示隐私、可靠性、支付和治理风险如何传导到创作者留存、总额转净额收入质量和估值信心。
    claimRefs:
      - CR003
      - CR018
      - CR023
      - CR026
      - CR027
      - CR032
      - CR033
      - CR039
      - CR040
      - CR041
      - CR042
      - CR045
    data:
      nodes:
        - id: privacy-burden
          label: 隐私负担
          detail: CCPA / GDPR / 州法义务，加上分析数据共享复杂性
        - id: incident-risk
          label: 事件风险
          detail: 结账、社群、支持事件，以及部分事故确认滞后
        - id: payment-friction
          label: 支付摩擦
          detail: 处理商依赖、争议、费用、账单访问故障
        - id: automation-surface
          label: 自动化暴露面
          detail: MCP + Creator Studio 扩大权限与治理暴露
        - id: creator-trust
          label: 创作者信任
          detail: 相信 Kajabi 能充当收入操作系统
        - id: customer-retention
          label: 创作者留存
          detail: 流失、扩张，以及继续留在高端套餐上的意愿
        - id: gross-to-net
          label: 总额转净额质量
          detail: 退款、争议、费用拖累、续费失败
        - id: valuation-confidence
          label: 估值信心
          detail: 投资者需要折价消化的不确定性
        - id: thesis-break
          label: 论点破裂触发点
          detail: 运营或法律恶化会推翻高端平台叙事
      edges:
        - from: privacy-burden
          to: creator-trust
          label: 合规错误削弱信任
        - from: incident-risk
          to: creator-trust
          label: 宕机打击可靠性认知
        - from: incident-risk
          to: customer-retention
          label: 中断抬高流失风险
        - from: payment-friction
          to: gross-to-net
          label: 费用和争议压低实际经济性
        - from: payment-friction
          to: customer-retention
          label: 账单痛点增加取消
        - from: automation-surface
          to: creator-trust
          label: 权限误用伤害信心
        - from: creator-trust
          to: customer-retention
          label: 信任支撑续费
        - from: customer-retention
          to: valuation-confidence
          label: 持久性影响倍数
        - from: gross-to-net
          to: valuation-confidence
          label: 经济性漏损压缩价值
        - from: valuation-confidence
          to: thesis-break
          label: 未解决的不确定性可能击穿投资测算
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: Kajabi 最重要的外部依赖直接连到创作者结账、支持、分发和自动化工作流。
    claimRefs:
      - CR021
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
      - CR029
      - CR032
      - CR033
      - CR037
      - CR038
    data:
      nodes:
        - id: kajabi-core
          label: Kajabi 核心平台
          detail: 页面、结账、社群、支持、分析、自动化
        - id: kajabi-payments
          label: Kajabi Payments
          detail: 平台内支付运营和订阅
        - id: stripe
          label: Stripe
          detail: 外部支付处理和争议
        - id: paypal
          label: PayPal
          detail: 备用结账和打款通道
        - id: support-vendor
          label: 支持供应商
          detail: 聊天和支持互动基础设施
        - id: app-stores
          label: 应用商店
          detail: Apple / Google 对品牌化 App 的运营要求
        - id: ai-tools
          label: 外部 AI 工具
          detail: 通过 MCP 接入的 Claude / ChatGPT 类工具
        - id: creators
          label: 创作者和客户
          detail: 收入和体验取决于整套栈正常运转
      edges:
        - from: kajabi-core
          to: kajabi-payments
          label: 原生商业层
        - from: kajabi-payments
          to: stripe
          label: 处理商与争议基础设施
        - from: kajabi-core
          to: paypal
          label: 可选结账 / 打款依赖
        - from: kajabi-core
          to: support-vendor
          label: 支持沟通路径
        - from: kajabi-core
          to: app-stores
          label: 移动分发要求
        - from: kajabi-core
          to: ai-tools
          label: 经由 MCP 的自动化暴露面
        - from: kajabi-core
          to: creators
          label: 一体化工作流
        - from: stripe
          to: creators
          label: 费用 / 争议影响商户结果
        - from: paypal
          to: creators
          label: 费用 / 账户问题影响支付
        - from: support-vendor
          to: creators
          label: 延迟拉低支持体验
        - from: app-stores
          to: creators
          label: 政策变化影响品牌化 App 使用
        - from: ai-tools
          to: creators
          label: 权限误用可能伤害运营
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议遵循一条简单链路：Kajabi 有真实规模和溢价潜力，但旧估值和缺失证据目前挡住买入建议。
    data:
      nodes:
        - id: n1
          label: 已验证规模
          description: 10B+ 创作者收益支付、30K+ 社群、高端一体化创作者栈
        - id: n2
          label: 溢价潜力
          description: 一体化产品广度、支付和工作流锁定，可能支撑高于同业的定价
        - id: n3
          label: 旧私募估值
          description: 2021 年 >$2B 头条估值仍留在公开叙事里，但没有新的价格发现
        - id: n4
          label: 收入质量缺口
          description: 没有经审计 ARR、NRR、毛利率、抽成率或股权结构透明度
        - id: n5
          label: 推断当前区间
          description: ~$300M-$1.4B 整体区间；基准情形 ~$560M-$900M
        - id: n6
          label: 跟踪
          description: 密切关注，但只有在价格纪律和硬尽调到位时才推进
      edges:
        - from: n1
          to: n2
          label: 支撑一定溢价
        - from: n2
          to: n5
          label: 但溢价必须匹配 2026 年市场
        - from: n3
          to: n5
          label: 迫使旧估值下修
        - from: n4
          to: n6
          label: 挡住买入判断
        - from: n5
          to: n6
          label: 界定入场纪律
    approximationNotes: 本图把本章逻辑压缩成决策节点；不是预测模型。
    claimRefs:
      - CV007
      - CV008
      - CV024
      - CV026
      - CV029
      - CV030
      - CV032
      - CV034
      - CV035
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: Kajabi 旧私募估值隐含的倍数，远高于当前公开学习类可比锚点；除非尽调证明质量出众，否则也高于多个 2026 年行业区间。
