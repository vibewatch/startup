      - number: '8.3'
        title: 情景区间与敏感性：公开证据支持宽区间，基准情形低于 $1B
        blocks:
          - type: paragraph
            body: >-
              情景分析必须先承认不确定性，因为 Kajabi 没有公开披露经审计 ARR、毛利率、NRR、客户集中度或股权表细节。因此，最好的公开区间只能从第三方 ARR 代理值，以及 2026
              年市场如何给不同证明程度的学习和软件公司定价来搭建。悲观情形假设 Kajabi 更接近公开估计低端，客户留存质量只是普通，投资人按更接近创作者平台而不是高端软件复利器来定价。结果是在 $75M-$85M ARR
              上给 4x-5x，约 $300M-$425M。


              基准情形假设 Kajabi ARR 介于 $80M 和 $100M，整合式堆栈和创作者证明支撑其相对 Thinkific 式公开困境拿到溢价，平台宽度加支付附着可赚到更接近 7x-9x 的倍数。估值约
              $560M-$900M。乐观情形假设 ARR 已达 $100M-$120M，留存和利润率质量在尽调中呈现高端水平，Kajabi 的 AI、支付和多产品创作者工作流可转化为 10x-12x 区间。即便如此，得到的
              $1.0B-$1.4B 区间仍显著低于过时的 2021 年名义估值。换句话说，争论点不是 Kajabi 是否有价值，而是公开可比公司在 2026 年完成价格发现后，旧风投标记还剩多少。
