  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：订阅优先，支付和附加产品其次
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的变现栈在结构上有吸引力，因为核心收入线是订阅软件，而不是交易市场佣金。官方定价页显示固定月度或年度套餐，不抽取平台收入分成；也就是说，Kajabi
              主要靠重复访问费从创作者业务中变现，而不是对每笔销售收税。相比重费用的创作者平台，这让收入质量方向上更强，因为公司收入不像交易市场那样与每笔客户交易直接同比例绑定。与此同时，来自 Sacra、Kajabi
              帮助内容和定价评论的留存证据显示，Kajabi 已从纯订阅扩展到商业相邻变现：Kajabi Payments、ACH 开票、高端品牌移动 App 访问，以及可能围绕税务、支付方式或融资的其他运营型加购。


              因此，收入桥大致是：创作者获取客户，销售课程或会员，并把 Kajabi 作为运营层；Kajabi 先拿重复 SaaS
              费用，其次拿可选支付经济性，最后拿功能或附加产品收入。如果订阅流失受控，这是一个好模型，因为支持和基础设施成本应当比 GMV 更慢扩张。难点在于，Kajabi 不披露套餐层级、支付、App
              收入或任何资本产品的实际组合。$10B 创作者累计收入、$350M+ 社群收入等公开创作者侧交易量指标，能证明生态吞吐量，但不能揭示 Kajabi
              各收入流的实际抽取和利润率。因此，投资人应把公司视为订阅主导，但不是只有订阅。
