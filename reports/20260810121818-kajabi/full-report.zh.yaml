companyProfile:
  summary: >-
    Kajabi 是一家美国创作者商业 SaaS 平台，成立于 2010
    年，已从课程软件扩展为面向知识创业者的一体化运营栈。公开证据支持几个判断：产品覆盖课程、教练服务、社群、会员、电子简报、播客、支付和营销流程；规模信号很强，包括创作者累计收入超过 $10B，服务 100,000+
    名创作者和创业者；2021 年 5 月完成 $550 million 成长轮融资，估值超过 $2 billion。核心尽调难点不是 Kajabi 有没有真实产品市场匹配，而是仅靠 2026
    年公开证据，能否撑住今天的私人估值、收入质量、留存和股权结构条款。
