  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Kajabi 服务自有受众的专家型业务，不服务整个创作者经济
        blocks:
          - type: paragraph
            body: >-
              Kajabi 自己的产品和定价页面，比宏观市场报告更能划清边界。首页、10B 定位页和产品页始终把 Kajabi
              描述为一体化操作系统，服务那些用课程、教练服务、社群、会员、电子简报、播客、支付和营销来变现专业知识的人。因此，Kajabi
              的市场不是泛创作者软件，更不是把品牌合作、广告库存、周边商品、代理服务和社交商业流量都算进去的整个创作者经济。产品瞄准的创作者想掌握客户关系，把知识包装成可复制的产品，同时避免拼接五六个工具。


              这条边界也说明哪些东西不在范围内。企业 CRM 套件、代理服务、社交平台广告支出和交易市场式创作者收入，都只是相邻领域，不是 Kajabi 的核心买家问题。Kajabi
              卖的是控制和整合结果：从租来的分发迁移到自有受众，再把订阅、课程、教练服务、社群和播客叠进一个收入栈。Circle 2025 和 2026
              年研究也支持同一套市场逻辑：发现仍主要发生在社交媒体，但社群平台和会员越来越多承接留存与变现。尽调时，这个区分很重要；如果把 Kajabi 对标整个创作者经济，会抬高
              TAM，也会遮住更相关的问题：到底有多少专家主导的业务能升级为多产品、自有受众运营者，并愿意为一体化栈付费。
