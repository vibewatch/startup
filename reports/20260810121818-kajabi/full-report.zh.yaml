      - number: '2.5'
        title: 约束、监管和公开数据仍无法证明的部分
        blocks:
          - type: paragraph
            body: >-
              支持市场的同一批来源，也说明为什么不是每个创作者都能成为 Kajabi 的好客户。收入集中度很高：只有少数创作者能达到六位数收入，许多人仍是兼职，倦怠也很常见。MBO 调查显示，大多数独立创作者收入不高；Axis
              和其他 2026 年汇编称，每年超过 $100,000 的创作者只有约 4%。因此，头部创作者人数不能很好代表 Kajabi 的真实经济池。实际中，Kajabi
              必须赢下这样一个细分：收入足够、受众信任足够、产品复杂度也足够，能证明每月 $143-$399 加处理费之前的支出合理。


              这个品类还内嵌监管约束。FTC 指引明确要求创作者、广告主和代理机构披露重大关系，并避免欺骗性背书；这很重要，因为重品牌或重联盟的变现，要比自有订阅和教育产品更难干净放大。公开数据也没有隔离出 Kajabi
              在这些细分中的份额。即便课程、教练服务、社群和播客都有很强官方牵引信号，留存来源仍未披露产品组合收入、创作者队列留存、区域组合，或真正多产品运营客户的占比。因此，市场论点方向上很强，但精确 SAM/SOM
              判断仍依赖管理层数据，而不是公开市场报告。
