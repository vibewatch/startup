  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：Kajabi 卖的是连通的专家型业务系统
        blocks:
          - type: paragraph
            body: >-
              Kajabi
              已不再像一个带少量相邻功能的课程托管工具。首页、产品中心和模块页面上，公司呈现的是一个面向人类专业知识的统一操作系统：在线课程、教练服务、社群、播客、网站、落地页、邮件营销、漏斗、结账、支付、联系人和移动体验，都放在同一品牌和定价伞下。客户工作流框架很重要。Kajabi
              不是让创作者分别购买 LMS、CRM、邮件平台、落地页构建器和会员门户；它让创作者把整个业务跑在一个系统里。


              这个产品论点在模块详情页反复出现。社群与 offer、邮件、内容和账单绑定。教练服务与排期、结账、跟进和交付绑定。播客与线索捕获、页面和变现绑定，而不只是 RSS
              托管。在线课程页面明确提出，专业知识值得拥有的不止是课程平台；这句话简洁表达了 Kajabi 更宽的产品哲学。跨模块连通性是 Kajabi
              差异化的核心。它也意味着产品必须可靠协调多个活动部件：创作者设置、客户获取、商业、访问控制、交付和再触达。
