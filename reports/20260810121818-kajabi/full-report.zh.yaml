  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前流程
      - Kajabi 方案
      - 可衡量收益
      - 限制
    rows:
      - - 发布在线课程
        - 创建课程大纲、销售页、结账和跟进邮件
        - 课程模块 + 页面 + 结账 + 邮件自动化
        - 搭建、销售和交付之间少了很多交接
        - 这里没有高级 LMS 深度的公开证明
      - - 运营付费社区
        - 围绕会员资格管理访问、内容和互动
        - 社区接到售卖包、支付和消息
        - 社区变现发生在同一套运营栈内
        - 社区可靠性事件说明执行复杂
      - - 经营辅导业务
        - 安排、销售、提醒并交付课程 / 咨询场次
        - 带支付和邮件跟进的辅导模块
        - 不再需要单独的排期 + 结账 + 邮件工具
        - 还需要更多证据，证明多员工运营能力成熟度
      - - 把播客用作漏斗顶部
        - 发布音频、获取线索并向上销售售卖包
        - 播客页面 + 留资与结账联动
        - 音频变成获客和产品漏斗，而不只是内容分发
        - 分析能力和分发广度的公开证据较薄
      - - 将 Kajabi 接入外部系统
        - 把事件数据推送到 CRM、表格、Slack 或自动化工具
        - webhook、API 和无代码连接器
        - 扩展 Kajabi，同时不放弃核心业务系统
        - 每多一个集成，就多一处故障点和监控需求
    notes: Kajabi 的工作流优势不是某个单点功能，而是把创作者业务的若干步骤压缩成一条 运营路径。
