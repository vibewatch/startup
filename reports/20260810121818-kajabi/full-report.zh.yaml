    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 品类
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 相比 Kajabi 的局限
    rows:
      - - Kajabi
        - 一体化创作者商业平台
        - 未上市；100K+ 创作者 / 创业者，创作者收入里程碑 $10B+
        - 多产品专家型业务
        - 覆盖课程、社群、辅导、会员、简报、播客、支付和营销的宽产品包，且不抽成
        - 入门价格更高；必须证明宽度胜过更便宜的专用工具或入门工具
      - - Teachable
        - 课程优先的学习商业平台
        - $10B+ Hotmart / Teachable 创作者 GMV；100M+ 学员；数万名创作者
        - 创作者教师和教育业务
        - 学员体验强，全球支付 / 税务处理和课程电商能力突出
        - 在集成业务操作系统范围上不如 Kajabi 宽
      - - Thinkific
        - 学习商业 / 学院平台
        - 上市公司；Q1 2026 收入 $18.7M；ARR $61.3M；35K+ 客户
        - 规模化课程业务、学院、B2B 学习卖家
        - 在课程、社群、订阅、B2B 商业和 AI 上，是宽度最接近的直接对手
        - 仍以学习商业为中心，而不是完整的创作者业务栈
      - - Podia
        - 更简单的一体化创作者套件
        - 15K+ 创作者，平台累计赚得 $900M+
        - 价格敏感、销售课程 / 辅导 / 社群 / 活动 / 邮件的创作者
        - 简单、低价，同时具备有意义的一体化覆盖
        - 规模证明、企业深度或高级销售复杂度不足
      - - Circle
        - 社群优先的数字业务平台
        - $89+ 起价；品牌应用和 Email Hub 扩展；评价和社会证明强
        - 社群驱动的创作者、会员制、品牌和班课业务
        - 社群能力深，覆盖活动、品牌应用和越来越宽的运营栈
        - 社群仍是核心楔子；课程导向不如 Kajabi 或 Thinkific
      - - beehiiv
        - 简报优先的变现平台
        - Sacra 估计年化收入约 $30M；融资约 $50M
        - 简报创作者、媒体品牌和受众增长型业务
        - 付费订阅、广告网络、推荐和低摩擦增长工具
        - 在课程 / 辅导和更宽知识业务工作流上的原生深度较弱
      - - Substack
        - 付费写作 / 简报和讨论平台
        - 未上市；免费入门、付费作者品牌强，但采用抽成经济模型
        - 作者、记者、评论者、垂直出版者
        - 通往付费写作最快路径，拥有订阅者所有权和内置讨论
        - 10% 抽成，结构化课程 / 业务工具较弱
      - - Kit
        - 受众 / 邮件优先的创作者平台
        - 未上市；价格随订阅者数量扩张；专注创作者邮件
        - 简报和邮件驱动、销售产品或订阅的创作者
        - 邮件自动化、变现、推荐，以及围绕创作者的订阅者经济
        - 不是完整课程 / 社群操作系统，且当前官方定价更难直接获取
    notes: 本表按竞争对手主打的任务场景分组，而不只看表面品类。有些公司在部分能力上与 Kajabi 重叠， 但在其他方面仍明显更窄。
