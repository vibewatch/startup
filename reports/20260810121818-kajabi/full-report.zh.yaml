  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：Kajabi 同时面对直接同业、单点工具和拼接栈
        blocks:
          - type: paragraph
            body: >-
              Kajabi 不在单一产品市场里竞争。留存来源显示，至少有五类可信竞争者：Teachable 和 Thinkific 这类课程优先的学习商业平台；Podia 这类更简单的一体化创作者套件；Circle
              这类社群优先的操作系统；beehiiv、Substack 和 Kit 这类电子简报优先的变现平台；以及把多个工具拼起来的现状替代方案。这一点重要，因为选择 Kajabi 的买家通常不是只在 Kajabi
              和某个具名对手之间做决定。他们是在一体化操作系统，与一组更窄、更便宜或在某个流程更深的专业工具之间做取舍。


              在具名同业中，Thinkific 是 Kajabi 最具机构可见度的直接对手，因为它公开销售课程加社群、会员、B2B 销售、商业和 AI 赋能运营，同时披露上市公司指标。Teachable
              是低价课程运营商中最强的教育业务品牌，学生触达面很广；整合 Hotmart 后，电商工具也越来越可信。Podia 用显著更低的价格提供一体化承诺，但企业级或公开规模证据较少。Circle
              越来越危险，因为它不再只卖社群；它现在覆盖课程、活动、邮件、支付、工作流和品牌 App，正在靠近 Kajabi 的重心。beehiiv、Substack 和 Kit
              不是完全一对一替代品，但它们能拿下受众所有权和变现层，而这一层往往先于更广泛的栈，成为创作者第一个真实业务系统。
