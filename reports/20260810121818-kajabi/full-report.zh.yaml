  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: KPI 看板混合了已验证规模信号、旧估值和推断投资区间，支撑最终建议。
    data:
      items:
        - label: 上次披露估值
          value: $2.0B+
          note: Tiger 领投的 2021 年融资
        - label: 第三方 ARR 区间
          value: ~$75M-$100M+
          note: Latka 低端；Sacra 提供更高历史锚点
        - label: 创作者收益支付
          value: $10B+
          note: 成立以来官方里程碑
        - label: 社群规模
          value: 30K+ / 3M+
          note: 社群和活跃成员
        - label: 基准 EV 区间
          value: $560M-$900M
          note: 基于约 $80M-$100M ARR 的 7x-9x
        - label: 加权中点
          value: ~$700M-$800M
          note: 当前公开证据的重心
        - label: 建议
          value: track
          note: 只有拿到新证据或更低价格才有吸引力
    approximationNotes: 看板有意混合已观察和推断指标；推断项锚定已引用公开来源，而非管理层指引。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV030
      - CV033
      - CV034
      - CV035
