      - number: '8.2'
        title: 可比估值锚：公开学习和软件市场支持溢价，不支持 20x 遗迹
        blocks:
          - type: paragraph
            body: >-
              给 Kajabi 估值，正确方法是把质量和可观察价格拆开。质量上，Kajabi 优势清楚：它比纯课程平台更宽，把支付和营销嵌入工作流，客户证明和变现宽度也强过爱好者工具。价格上，公开市场远没有 2021
              年风险投资周期宽容。Thinkific 2026 年文件显示，这家创作者商务同行约有 $61M-$62M ARR、约 72%-73% 毛利率，但到 2026 年 8 月市值只有约 $86M
              CAD——这是该细分在公开市场可能被压缩到什么程度的极端样本。Docebo 是更强的企业学习 SaaS，相对 ARR 的交易倍数更体面，但仍然温和。Coursera 收购 Udemy
              后的合并公司规模大得多，但公开市值仍只隐含低个位数收入倍数。Duolingo 增长、订阅用户规模和盈利证明都强得多，是这组里少见的高溢价教育倍数。


              行业估值指南有助于框定区间。FE International 将 2026 年教育科技广样本 EV/收入中位数放在约 7.8x；MetricRig 则称教育科技 SaaS 根据细分和收入质量，ARR 倍数约 3x
              到 12x。Multiples.vc 同样显示，2026 年 8 月软件估值按 AI 叙事、专业化和盈利能力高度分层。Kajabi
              大概率应高于疲弱的公开创作者同行，但低于少数高溢价学习资产，除非尽调证明留存和利润率质量真正异常。因此，可比公司支持一个溢价带——而不是自动保留一个 >$2B 的过时标记。
