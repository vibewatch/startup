      - number: '3.4'
        title: 护城河耐久性与负面竞争信号
        blocks:
          - type: paragraph
            body: >-
              Kajabi
              的护城河有意义，但有条件。耐久的部分，是产品宽度、无收入分成、创作者商业身份，以及一套围绕多产品专家型业务设计的产品，而不是围绕单一格式发布。客户一旦真的把课程、教练服务、社群、会员和营销放在一起运营，Kajabi
              就更难被替换。脆弱的部分在于，许多竞争对手正向相似话术和功能表面收敛。Thinkific 在发布 AI、社群、商业和品牌移动端。Circle 现在把 AI、邮件、支付、课程、工作流和品牌 App
              打包营销为一个数字业务平台。Teachable 改进了结账、税务、挽回和订阅。beehiiv 已从电子简报扩展到播客、数字产品、社群、广告和推荐。Kit 继续增加变现和自动化。换句话说，即使 Kajabi
              的组合仍然异常完整，它的叙事已经不再独一无二。


              负面证据最集中在价格压缩和专业工具替代。Teachable、Thinkific、Podia、beehiiv、Kit 和 Substack 都给创作者提供低成本或免费入口。Thinkific
              的公开披露也提醒投资人，规模不会消除竞争压力：公司仍报告温和增长，2026 年 Q1 调整后 EBITDA 为负，并明确列出竞争和技术变化风险。相对 beehiiv 和 Kit，Substack 10%
              费用是结构性弱点，但这不会自动利好 Kajabi；受益的是任何不抽成或低费用替代方案。归根结底，Kajabi
              的护城河不是单个杀手功能，而是一个主张：严肃的专家型业务放在一个地方运营，比拆成拼接栈更好。这个主张仍可信，但正越来越多受到上方 Thinkific / Circle 与下方更便宜切入口产品的夹击。
