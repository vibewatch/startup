    columns:
      - 参照对象
      - 状态
      - 已观察指标
      - 隐含倍数 / 估值语境
      - 重要性
      - 关键限制
    rows:
      - - Kajabi 2021 年 Tiger 领投轮
        - 已验证私募估值
        - $550M 融资对应 >$2B 估值；Sacra 将该时期与约 $100M ARR 关联
        - 创作者经济热度顶峰时约 20x ARR
        - 定义投资者容易复用的旧锚点
        - 旧估值；尚未被新的公开价格发现刷新
      - - Kajabi 2024 ARR 代理
        - 第三方收入锚点
        - Latka 将 Kajabi 置于约 $75M ARR / 收入
        - 若配上旧 $2B 估值，约 26.7x ARR
        - 显示在较低当前收入估计下，旧估值有多偏高
        - Latka 是第三方且未经审计
      - - Thinkific 2026 年 8 月
        - 上市创作者商务可比公司
        - ~$61.7M ARR，73% 毛利率，~CAD 85.6M 市值
        - 约 ~1x ARR 等值 / 按 USD 计不到 1x
        - 最直接的上市课程 / 创作者商务可比公司，用于校准下行现实
        - 规模小得多，市场认知更弱
      - - Coursera 2026 年 8 月合并后公司
        - 上市学习平台可比公司
        - Q2 收入 $298.6M；FY2026 指引 $1.220B-$1.245B；市值 ~$1.55B
        - ~1.2x-1.3x 市值 / FY 指引
        - 显示即便有规模的上市学习资产，市场定价仍然保守
        - 包含 Udemy 收购和更宽的业务组合
      - - Docebo 2026 年 8 月
        - 上市企业学习 SaaS 可比公司
        - ARR $255.1M；调整后 EBITDA 利润率 16.4%；市值 ~$555M
        - ~2.2x 市值 / ARR
        - 代表更高质量、更接近企业级的学习 SaaS 可获得的估值
        - B2B 企业 LMS 与创作者商务结构不同
      - - Duolingo 2026 年 8 月
        - 高溢价上市教育可比公司
        - Q2 收入 $298.5M；市值 ~$6.38B
        - ~5.3x 年化 Q2 收入
        - 说明在强增长和盈利能力证据下，优质学习资产倍数是什么样
        - 品类、消费者规模和产品护城河不同
      - - FE International 2026 年教育科技基准
        - 行业基准
        - 271 个观察样本的 EV / 收入中位数为 7.8x；高增长订阅业务通常为 5x-9x ARR
        - 可作为有一定质量但并非完美的教育科技资产基准区间
        - 提供高于疲弱上市可比公司水平的行业整体语境
        - 样本宽泛，混合了不同模式和交易类型
      - - MetricRig 2026 年教育科技区间
        - 分析师基准
        - 教育科技 SaaS 为 3x-12x ARR；企业 / 劳动力端在高位，消费者端在低位
        - 若留存强，Kajabi 可能落在该区间的中上部
        - 有助于选择情景倍数
        - 通用基准，并非公司特定定价
  - id: TV005
    title: 投资逻辑破裂与否决触发表
    notes: 触发因素聚焦价格发现和底层业务质量，而不是泛化创业公司风险。
    claimRefs:
      - CV016
      - CV020
      - CV021
      - CV024
      - CV025
      - CV026
      - CV029
      - CV034
      - CV035
      - CV041
      - CV042
      - CV044
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新估值低于预期
        - 新融资、要约、409A 或二级交易成交价远低于约 $700M 中点
        - 证明 2021 年旧估值剩余有效性很低
        - 立即按新成交价重定估值
      - - ARR 不及预期
        - 经审计 ARR 显著低于约 $80M 基准情景下限
        - 各情景分子都收缩，溢价叙事变弱
        - 转向悲观情景倍数
      - - 留存 / 利润率质量不及预期
        - NRR、流失率或毛利率不像优质资产
        - 一体化栈逻辑不再配得上强倍数溢价
        - 压缩倍数区间，降低信心
      - - 支付经济性不及预期
        - 抽佣率、争议或退款负担差于预期
        - SaaS+ 支付不再贡献上行，反而拖累净收入兑现
        - 把支付视为复杂性，而不是上行空间
      - - 优先股堆叠过重
        - 股权结构表显示重大清算优先权悬压
        - 企业价值无法传导为新资金的股权价值
        - 要求更大折扣，否则退出
  - id: TV006
    title: 最终尽调要求表
    notes: 以下要求是从“观察”升至更强建议前的阻断项。
    claimRefs:
      - CV005
      - CV010
      - CV024
      - CV030
      - CV034
      - CV035
      - CV041
      - CV042
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计 ARR 与收入桥接
        - 2024-2026 年月度和年度 ARR / 收入
        - 本章所有倍数的核心分母
        - 要求提供经审计财务和董事会 KPI 包
      - - 毛利率和支付抽佣率
        - 订阅、支付 / 附加项分项毛利率
        - 决定 Kajabi 应拿优质 SaaS 倍数还是混合平台倍数
        - 要求提供利润率桥接和支付损益表
      - - 留存和集中度
        - NRR、GRR、客户流失率、队列扩张、头部客户集中度
        - 估值溢价需要收入质量经得起验证
        - 要求提供队列仪表盘和收入集中度明细
      - - 股权结构表和优先权
        - 完全稀释股权结构表、优先股堆叠、附属协议和要约权利
        - 入场回报可能与企业价值脱钩
        - 要求提供最新资本结构和清算瀑布模型
      - - 运营可靠性
        - 事故严重性、支付停机影响和支持工单积压指标
        - 一体化模式让可靠性具有经济重要性
        - 要求提供事故复盘节奏和业务影响报告
      - - 安全 / 合规态势
        - SOC 2 或类似认证、子处理方治理、隐私投诉量
        - 需要这些信息正确定价残余法律和运营风险
        - 要求提供安全资料包和合规报告
