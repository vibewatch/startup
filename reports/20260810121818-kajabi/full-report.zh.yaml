      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - 在线课程
        - 创作者型教育者
        - 成熟的商业核心
        - 课程创建和营销、变现绑在一起，而不是孤立的 LMS 交付
        - 需要更深证据，证明评估能力深度和企业学习功能
      - - 社区
        - 会员 / 社区运营者
        - 成熟且已有规模
        - 与售卖包、邮件、计费和互动流程原生相连
        - 需要营销说法之外的硬留存和互动指标
      - - 辅导
        - 教练 / 顾问
        - 成熟且已集成
        - 排期、收款、沟通、交付和跟进都在一个流程里
        - 需要日历能力深度和多教练运营复杂度的证据
      - - 播客
        - 受众建设者 / 创作者品牌
        - 成熟但偏相邻
        - 私密和付费播客直接接到页面、留资和售卖包
        - 需要分析能力深度和更广的播客分发流程证据
      - - 邮件 + 漏斗 + 页面
        - 增长运营者
        - 成熟核心栈
        - 把获客和变现做成原生流程，减少工具蔓延
        - 需要送达率、规模和归因细节
      - - 公开 API + webhook
        - 高级运营者 / 集成方
        - 可信，但比大型 SaaS 生态更窄
        - 通用实体和事件流让用户不用离开 Kajabi 也能扩展
        - 需要速率限制、SLA 和采用率指标
      - - 移动端交付
        - 会员 / 创作者品牌
        - 已商业化，带高级层级
        - 共享 Kajabi 应用，另有品牌化移动应用选项
        - 需要应用商店评分、崩溃率和留存数据
    notes: 最好把平台模块理解为相互依赖的工作流界面，而不是彼此独立的 SKU。
