        - label: Duolingo 市值 / Q2 收入年化
          value: 5.3
        - label: FEI 教育科技中位数
          value: 7.8
        - label: MetricRig 企业级上限区间
          value: 12
    approximationNotes: 公司柱状混用市值和 ARR / 收入代理值，因此只是方向性比较，不是严格同口径 EV 计算。
