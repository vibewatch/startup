      - number: '5.2'
        title: 架构和开发者表面：共享核心实体，具备真实集成能力
        blocks:
          - type: paragraph
            body: >-
              公开技术表面显示，Kajabi 可见模块底下有共享的数据和工作流核心。开发者门户和 API 参考暴露了联系人、offer、产品、购买、交易和 webhook 等通用实体。这很重要，因为它说明 Kajabi
              不只是孤立功能页面的打包；它有结构化应用模型，外部工具可以围绕这个模型编程。Webhook 文档还展示了入站和出站模式、购买和支付事件覆盖、基于 scope 的权限、日志可见性和明确 API
              示例。对于一个需要站在创作者工作流中间的 prosumer 到 SMB 平台，这些都是有意义的成熟度信号。


              Kajabi 的开发者体验是真实的，但还不像大型横向 SaaS 平台那样完全企业级。公开 API 文档可以从多个入口找到——帮助中心、开发者站、App 托管的 Swagger 文档，以及公开 GitHub
              文档仓库。这对集成方有帮助，但也暴露出一些碎片化。GitHub 仓库提高了对 API 文档维护方式的信心，因为它有 OpenAPI 规范和变更日志；但它是文档仓库，而不是公开应用代码。第三方指南、n8n
              社群节点和 API 目录条目显示，外部确实需要做 Kajabi 集成。整体判断偏正面：Kajabi 可以集成，也有技术扩展性。提醒在于，公开开发者生态看起来实用、有用，但仍轻于更大型通用 SaaS
              平台周围的生态。
