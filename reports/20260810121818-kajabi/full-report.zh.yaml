      - number: '1.2'
        title: 创始人、领导层交接与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事仍是 Kajabi 定位的核心。公开来源和分析型来源都把公司起点指向 Kenny Rueter 与 Travis Rosser：二人搭建软件，帮助用户在线变现专业知识。Rueter 2025
              年亲自发布的宣言，又用第一人称强化了这条起源叙事。更不清晰的是当下领导层。2025-2026 年的合作伙伴和数据库来源仍把 Ahad Khan 列为 CEO，但 Kajabi 自己在 2025
              年末的宣言称，Rueter 带着「创始人能量」回归，并邀请长期高管 Jonathan Cronstedt 与他共同担任
              co-CEO。这不是小出入：它要么说明商业数据库更新滞后，要么说明公司刻意采用了一种尚未在公开档案中统一呈现的领导结构。


              以这种规模的私人公司而言，Kajabi 的治理透明度仍偏有限。公开来源能看到董事会演进：Scott Wagner 借 2021 年融资加入，Spectrum 称新增董事还包括 Andrea Mallard 和
              Cameron Deatsch。但留存公开来源都没有给出完整的现任董事名单、委员会结构、所有权拆分，或经审计的股权结构视图。尽调含义很直接：从创始人、高管和投资人品牌层面，Kajabi
              容易定位；但若要以机构信心判断控制权、接班和治理，仍需要管理层直接提供材料。
