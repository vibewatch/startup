  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律：Kajabi 值得关注，但 2021 年标记不是当前公允价值
        blocks:
          - type: paragraph
            body: >-
              Kajabi 已经证明自己不该只按简单课程托管工具估值。公司自己的公开材料显示，它是一套覆盖课程、辅导、社区、会员、通讯、播客、支付以及如今 AI
              工作流层的广泛创作者运营堆栈。平台也有真实规模信号：官方页面指向自创立以来向创作者支付 10B+、30,000+ 个社区、3M+
              活跃社区成员，并把产品叙事放在帮助认真创作者把多个工具整合成一个系统。这种运营宽度和创作者工作流深度，支撑它相对更窄或更弱的公开学习软件公司享有一定溢价。


              难点是价格，不是质量。Kajabi 最后一次披露估值——2021 年 Tiger 领投融资中的超过 $2B——发生在创作者经济情绪高点，也早于 2022–2026
              年公私软件估值倍数重置。第三方估计现在方向相反：Sacra 重复 $2B 标记，并把它与当时约 $100M ARR 关联；Latka 则把 Kajabi 2024 年 ARR/收入放在约
              $75M。无论哪种口径，把旧标记带到 2026 年都意味着估值倍数远高于当前公开学习软件公司和许多公开视频软件可比公司。因此证据支持跟踪，而不是买入：Kajabi
              值得关注，但只有在旧名义价格大幅打折，或新尽调证明它已经长出过时倍数压缩叙事时，才值得更进一步。
