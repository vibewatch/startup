      - number: '7.2'
        title: 运营与依赖风险：一体化便利放大事故成本
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的一体化价值主张也是结构性风险放大器。官方状态和支持材料表明，同一平台覆盖页面、结账、社区、API、支持互动和创作者运营。宕机发生时，它不只是后台不便；获客、转化、履约和客户支持会同时中断。保留的
              2026 年事故史显示，邮件活动编辑错误、社区访问问题、聊天供应商导致的支持互动延迟，以及社区视频问题。第三方追踪器更进一步，记录了额外的 2026 年警告、6 月 30
              日宕机，以及官方页面迟迟承认或从未承认的案例。


              运营意义在于，Kajabi 不只是内容托管商，它也越来越像商户堆栈。Kajabi Payments 集中退款、订阅、税务处理和打款运营；创作者仍可使用 Stripe 和
              PayPal；而脱离式支付集成可能让有活跃订阅的客户失去自助账单访问。Stripe 争议机制和第三方支付费用又加了一层残余风险。实践中，Kajabi
              的平台风险就是传导风险：事故或供应商故障出现后，创作者几乎会立刻在收款、支持质量、流失和品牌信任上感受到。
