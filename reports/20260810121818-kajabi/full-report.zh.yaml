      - number: '4.3'
        title: 成本结构和资本充足性：经济性可能健康，披露偏弱
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的成本结构应按「软件加支付」理解，而不是纯 SaaS。毛利中相当部分很可能来自重复订阅费；支付处理和相关商业服务利润率更低，因为它们依赖 Stripe、银行转账基础设施等外部轨道。Stripe
              公开定价说明了压力点：标准线上卡处理为 2.9% + 30¢，Billing 收取账单量 0.7%，ACH 为
              0.8%，国际附加费、税务工具和争议处理，也都会让任何变现支付或重复账单的创作者平台承担真实交付成本。Kajabi 自己的 ACH 开票文档确认，低成本银行转账重要到足以为发票场景产品化。


              判断 Kajabi 可能财务形态时，最好的公开可比公司是 Thinkific。Thinkific 2026 年 Q1 和 Q2 报告显示，订阅收入约 $15.2M / 季，商业收入 $3.4M-$3.5M，毛利率
              72%-73%，ARR 约 $61M-$62M，现金和短期投资约 $49M-$51M，调整后 EBITDA / 经营现金流在改善。这不能证明 Kajabi
              有完全相同的经济性，但能显示一家有真实支付组合的创作者业务软件公司，在披露充分时会是什么样。Kajabi 自身资本充足性只能间接观察。2021 年 $550M
              融资规模很大，公司当时称自己已盈利，留存公开资料也没有困境债务或大规模裁员证据。员工数信号大体稳定在 300 多人后段到 400 多人前段。这个组合说明 Kajabi 2026
              年不太可能陷入急性融资困境，但月度现金消耗、资金续航和资本计划用途，不能只靠公开证据解决。
