      - number: '8.4'
        title: 退出准备、破题条件与最终尽调：缺失证明具体且可执行
        blocks:
          - type: paragraph
            body: >-
              Kajabi 近期最可能的流动性结果是战略出售、结构化二级交易，或继续私下复利，而不是从最后披露标记干净抬升到公开市场。当前学习市场最强的战略先例，是 Coursera 与 Udemy 的合并，隐含约 $2.5B
              股权价值；它证明规模化学习资产在 2026 年仍能吸引真实资本。但该交易的当前收入规模和上市公司披露远多于 Kajabi。Kajabi 缺失的证明很精确：2024–2026 年经审计 ARR
              和收入、毛利率细节、流失和 NRR、支付抽成率、客户集中度，以及股权表优先权堆栈。


              这些问题决定 Kajabi 究竟是高端创作者业务操作系统，还是仍按 ZIRP 时代故事定价的高质量私人资产。如果新尽调显示 ARR 超过
              $100M、留存健康、利润率强且优先权包袱有限，乐观情形就可信。若结果显示留存普通、支付经济性薄，或清算优先权拖累沉重，旧标记就应被视为历史而不是价值。在证据到位之前，投资判断应维持跟踪，并明确价格纪律和论点失效触发条件，绑定新融资、二级标记或经审计经营指标。
