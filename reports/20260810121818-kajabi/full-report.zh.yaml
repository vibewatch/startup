      - number: '1.4'
        title: 里程碑、当前指标与负面线索
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的里程碑轨迹显示，公司在在线课程站稳后不断拓宽范围。定价更新页面称，New Kajabi 于 2015 年作为课程产品推出，之后增加落地页、邮件、自动化、支付、社群、播客、品牌移动 App
              等能力。Spectrum 的组合叙事把 2023 年与 Creator Studio、Kajabi Payments、Branded Mobile App 和 Vibely
              收购绑定在一起，合起来说明公司在推进更深的商业和社群所有权。到 2025 年创作者收入发布时，公司又围绕「创作者商业」和所有权重塑定位，而不是围绕对社交平台的依赖，并用创作者累计收入 $10 billion
              的里程碑证明长期生命力。


              公开指标层面方向性很强，但达不到审计级别。Growjo、Latka、Revelio、Craft 和 Tracxn 对收入和员工数的估算不一，所以最干净的总结只能给区间：2025-2026 年，估算收入或 ARR
              约 $75 million，员工约 350 至 427 人。负面证据不致命，但确实存在。Trustpilot 的 2026 年评论流既有对一体化体验的称赞，也反复出现对高价、AI
              主导客服、取消流程、数据访问和账单问题的抱怨。这意味着 Kajabi 最大的公开风险信号不是欺诈或监管，而是客户规模扩大后，高端一体化承诺能否跟上支持和报表预期。
