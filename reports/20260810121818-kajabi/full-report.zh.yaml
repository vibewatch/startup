      - number: '4.2'
        title: 公开牵引信号：规模真实，精度不足
        blocks:
          - type: paragraph
            body: >-
              公开牵引能看见，但只有碎片。Kajabi 自己的来源显示，创作者侧吞吐量有意义：截至 2025 年 8 月，公司创作者累计收入超过 $10B，突出 30,000+ 个社群、3M+ 名社群成员和超过 $350M
              社群收入，并继续把自己定位为专家型业务的操作系统。历史融资报道还称，2021 年融资时创作者年 GMV 为 $1.5B。这些信号在方向上重要，因为它们确认 Kajabi 承载的是真实商业活动，而不只是爱好者互动。


              问题是，公司吞吐量不等于公司收入。独立收入信号互相冲突。Latka 把 Kajabi 估算 ARR 放在约 $75M；Sacra 中一处引用暗示 2021 年融资前后 ARR 为
              $100M，另一个后续比较引用又把 2023 年 Kajabi 放在约 $115M ARR。Growjo 和 IncFact 也提供外部估算，但方法透明度更低。合起来看，证据说明 Kajabi
              很可能已有实质规模，但精确收入运行率并未可靠公开。因此，公开投资判断应使用区间，而不是点估计。与上市可比公司 Thinkific 相比，Kajabi 从历史估值和创作者累计收入叙事看，很可能是更大的私人平台；但
              Thinkific 每季度披露业绩，因此在收入组合、利润率结构、支付渗透、ARPU 和近期现金生成上仍提供更干净的参照组。
