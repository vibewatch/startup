  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础：跨多种变现形式的知识型创业者
        blocks:
          - type: paragraph
            body: >-
              Kajabi
              的客户不是单一的创作者原型。保留来源显示，课程创作者、教练、会员和社区运营者、播客、个人创业者，以及专家主导的教育或生活方式品牌都在其中。官方产品页反复把客户价值落在同一套核心动作上：拿到受众或专业知识基础，转成自有邮件名单和页面，通过结账销售，再用课程、社区、辅导或播客交付。因此
              Kajabi 最适合需要同时用上多项功能的专家型业务，而不是一次性单 SKU 场景。


              具名案例也指向广泛的垂直多样性。Kajabi
              强调健康教练、个人创业教育、读写教育、商业社群、创始人教育，以及创作者主导的会员业务。意义在于，平台并未局限在一个狭窄终端市场。同时，公司自有信息和多篇独立评测都持续把 Kajabi
              定位为更适合愿意为一体化堆栈付费的「认真」或成熟创作者。预算有限的新手或仍在试验阶段的创作者匹配度似乎较弱。从客户画像看，Kajabi
              更像是为积极的业主型经营者优化：他们有可变现的专业知识、有一定受众信号，也愿意把内容当成生意而不是副业。
