      - number: '5.3'
        title: 可靠性、隐私与质量控制：能看到运营纪律，也持续面对事故现实
        blocks:
          - type: paragraph
            body: >-
              Kajabi 公开了有意义的运营和政策表面。公司维护状态页、事故历史，以及一篇帮助文章，说明用户如何用邮件、短信、Slack 或 webhook 订阅更新。这些是有用的信任信号，因为它们显示公司预期客户会在意
              uptime 和运营透明度。Privacy Notice 和 Terms of Service 也容易找到，并放在正式政策中心下；对于一个存储创作者、会员、支付相邻和通信数据的平台来说，这是必要配置。


              同时，事故轨迹也确认平台并非不受运营问题影响。近期公开事故涉及邮件活动阻断、社群访问、支持沟通延迟、社群视频和通知，以及更广的平台可用性。一次事故明确提到由供应商实施修复，这凸显了交付链中的第三方依赖风险。留存来源没有证明出现过公开安全泄露，但也没有给出清楚浮出水面的
              SOC 2 式认证包。因此，正确的信任判断是正面但带混合信号：Kajabi 确实有运营卫生和透明度，但运行关键收入工作流的买家，仍应在 NDA 下深入尽调安全、恢复和供应商管理控制。
