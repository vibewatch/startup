      - number: '6.3'
        title: 留存、满意度和评论信号：效用为正，体验分化
        blocks:
          - type: paragraph
            body: >-
              独立评论和准评论类页面，为官方英雄故事提供了重要制衡。Capterra、Trustpilot 和多位实操评测者大体认同 Kajabi
              的核心强项：它用一个工具替代多个工具，帮非技术或中等技术能力的创作者省时间，让他们在一个地方经营业务。那些原本要拼接邮件、页面、社区、课程和结账工具的创作者尤其吃这套。易用性和一体化价值反复出现在正面主题中。


              负面也同样一致。价格是重复最多的抱怨，尤其是在 2026 年定价重置之后。支持质量表现混合，Trustpilot 评论浮现取消、账单和响应摩擦投诉。一些独立评测者还指出，Kajabi
              虽然很多事做得好，但面向高级运营者时，若干功能并非同类最佳。合起来看，评论记录显示 Kajabi
              有真实的产品市场匹配，但体验画像分叉：买进整个系统并使用多个模块的客户体验很强；对价格敏感或被支持拖累的客户明显更差。Kajabi 没有公开 NRR、GRR
              或流失率，因此满意度只能通过这些不完美的外部界面判断，而不是硬留存队列。
