      - number: '1.3'
        title: 融资历史、投资人和资本基础
        blocks:
          - type: paragraph
            body: >-
              Kajabi 的资本形成格外重要，因为公司前十年基本靠自举经营，之后才进入机构成长资本阶段。第一笔外部资本来自 2019 年 11 月的 Spectrum Equity；公司和媒体报道都把它框定为 Kajabi
              首次机构投资。这件事重要，因为它标志着 Kajabi 从创始人出资的软件公司，转为有机构背书的扩张期公司。第二次重大融资规模大得多，记录也清楚得多：2021 年 5 月，Kajabi 从 Tiger
              Global、TPG、Tidemark、Owl Rock、Meritech 以及既有支持方 Spectrum Equity 处融资 $550 million。多份留存来源在融资规模和超过 $2 billion
              的投后估值上相互吻合；部分后续档案把数字四舍五入为正好 $2.0 billion，Spectrum 在时间线表述中使用 $2.1 billion。


              2021 年这轮融资还带出两个对尽调有用的信号。第一，Kajabi 在募集成长股权时称自己已盈利，这让它不同于依赖补贴获客的风投型创作者工具。第二，管理层称公司会把资金用于扩大产品开发、国际扩张和探索
              M&A。后续 Vibely 收购与 2023 年产品发布节奏，符合这笔资金的既定用途。仍然私有的是控制权和下行情形判断所需的细节：清算条款、老股转让、所有权集中度，以及任何债务或结构化义务，留存公开证据均未披露。
