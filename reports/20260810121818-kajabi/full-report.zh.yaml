  - id: TP003
    title: 定价 / 套餐包装对比
    columns:
      - 平台
      - 入门价格 / 模式
      - 高阶套餐参考
      - 主要费用政策
      - 已含能力信号
      - Kajabi 含义
    rows:
      - - Kajabi
        - $143/mo 按年计费（$179 月付标价）
        - Pro：$399/mo 年付 / $499 月付
        - 不抽收入分成；另收支付处理费
        - 集成产品、联系人、社区、网站、自动化能力
        - 高价一体化套餐默认客户是认真经营多产品业务的创作者
      - - Teachable
        - $39/mo Starter，或 $29/mo 年付折算
        - Growth $189/mo，或 $139 年付折算
        - Starter 收 7.5% 费用；更高套餐 0%
        - 课程、移动 app、全球支付、加售、订单挽回、辅导 / 会员
        - 低价切入课程电商的入口很强
      - - Thinkific
        - $54/mo Basic，或 $40 年付折算
        - Grow $219/mo，或 $164 年付折算
        - 通过 Thinkific Payments 提供商业工具；没有市场抽成叙事
        - 无限课程、社区、订阅、B2B 工具、AI，高阶套餐含品牌 app
        - 直接竞品里最接近 Kajabi 的价格 / 功能阶梯
      - - Podia
        - $42/mo Mover 年付
        - Earthquaker $150/mo 年付
        - Mover 收 5% 费用；Shaker / Earthquaker 不收费
        - 课程、社区、辅导、活动、邮件、网站、集成
        - 靠简单和更低入门价强压 Kajabi
      - - Circle
        - $89/mo Professional
        - Business $199/mo；Circle Plus 定制
        - Email Hub 作为加购项；高阶套餐交易费更低
        - 社区、课程、活动、网站构建器、AI、付费会员、品牌 app
        - 社区优先买家能以低于 Kajabi 的价格拼出很能打的栈
      - - beehiiv
        - 2,500 名订阅者以内 $0
        - Scale $43/mo；Max $96/mo；Enterprise 定制
        - 付费订阅 0% 抽成
        - 通讯简报、网站、播客、社区、自动化、广告网络
        - beehiiv 用低价楔子强势切入通讯简报优先的创作者业务
      - - Substack
        - 免费，收取付费订阅收入的 10%
        - 留存来源未见常规套餐梯队
        - 创作者保留 90%，再扣卡费
        - 付费通讯简报、社区 / 讨论、播客 / 视频发布
        - 启动摩擦最小；收入放大后抽成拖累加重
      - - Kit
        - 10,000 名订阅者以内免费（独立定价来源）
        - 1K 订阅者档：Creator $39/mo；Creator Pro $79/mo
        - 免费变现收交易费；按订阅者计价的付费套餐不抽成
        - 邮件自动化、变现、推荐、集成
        - 还不需要 Kajabi 广度的创作者，Kit 是很强的邮件优先替代品
