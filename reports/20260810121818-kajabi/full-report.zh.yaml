chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品范围与规模信号
        blocks:
          - type: paragraph
            body: >-
              Kajabi
              的公开身份已经不止是「课程软件」。首页、定价页、招聘页、创作者里程碑页面和第三方公司档案，都把它描述成一个平台：专家可以在同一个系统里围绕在线课程、教练服务、社群、会员、电子简报、播客、支付和营销流程搭建业务。这个定位很关键。Kajabi
              卖的不是单点产品，而是帮知识创业者减少工具分散；这类客户想掌握受众，也想把客户数据留在一个栈里。公司当前话术强调「创作者商业」，近期又转向「人类专业能力的操作系统」。相比泛泛的创作者软件，这个品类更站得住，因为它围绕付费知识产品的实践者，而不是只围绕受众触达。


              公开规模信号很强，但并不完全干净。历史融资材料显示，Kajabi 自举了约十年，2019 年首次引入机构资本；到 2021 年，它在称客户年 GMV 已超过 $1.5 billion 后，完成了 $550
              million 融资。后续官方和合作伙伴材料显示，平台创作者累计收入先后超过 $8 billion 和 $10 billion；2025 年数据发布称，超过 100,000 名创作者和创业者使用 Kajabi
              触达 150 million+ 名客户。因此，最稳妥的解读不是一张精确、经审计的经营成绩单，而是一家成熟的创作者业务平台：有真实历史规模，有足够长的经营年限，也有强证据显示客户在一个产品内使用多种变现形式。
