      - number: '2.2'
        title: 规模测算视角：宏观市场很大，但定义互相打架
        blocks:
          - type: paragraph
            body: >-
              留存来源同时支持一个宽结论和一个窄提醒。宽结论是，近期所有来源都同意创作者经济规模大，而且仍在快速增长。Research and Markets 估算，市场规模 2025 年为 $255.66
              billion，2026 年为 $323.48 billion，到 2030 年达到 $820.83 billion。另一条 Research and Markets 记录预测，2025-2030 年增量增长为
              $434.79 billion，CAGR 为 23.0%。Quantumrun、Demandsage、Canada Create 和 Axis Intelligence
              给出的数字不同，但大致落在同一区间：2026 年约为 $200 billion 中段到 $300 billion 出头，并保持低 20% 到中 20% 的增长率。


              窄提醒是，这些数字不能互换。有的来源统计整个创作者经济，有的强调平台工具，有的把品牌支出、变现层和辅助服务混在一起。因此，不能拿一张通用 TAM 幻灯片给 Kajabi
              做投资判断。更好的尽调姿态，是保留多个镜头：宏观创作者经济、专业创作者人群，以及由订阅、社群、课程、教练服务和电子简报 / 播客变现定义的自有受众软件市场。证据能证明外圈市场真实存在，但不能干净隔离出
              Kajabi 的精确 SAM 或 SOM。这个缺口很重要，因为估值和增长预期更依赖能够变现的专家型业务子集，而不是所有休闲创作者的总体规模。
