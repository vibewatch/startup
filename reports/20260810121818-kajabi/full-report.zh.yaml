      - number: '6.2'
        title: 具名客户证明：真实结果存在，但证据多由供应商策划
        blocks:
          - type: paragraph
            body: >-
              Kajabi 确实有分量不低的具名客户证明。Carrie Lupoli 的官方故事描述了一项健康与教练业务：它在 Kajabi 上创造近 $2.5M 收入，并围绕教练社区建立了有意义的社交受众。Justin
              Welsh 的官方故事称收入超过 $5M、帮助 25,000+ 人、推出 $22K MRR 的加售产品，并从七个独立工具迁出。官方故事页和列表页还强调 Spencer Russell、Sophia
              Amoruso、Tyler Tometich、Tony Jeffries 等人的七位数或数百万美元成果。它比泛泛的标志墙更强，因为它把具名用户、使用场景和结果主张连在一起。


              但这些证明仍由 Kajabi 策划。这不意味着它们不真实，却限制了它们单独支撑承销的力度。正确读法是：Kajabi
              明确支撑了一批跨多个细分领域的高表现创作者业务，这些业务也常把整合和工作流简单视为留下来的理由。缺口在分母可见性。公开客户故事告诉我们成功账户能做到什么，却没有说明 Kajabi
              中位客户能做到什么、多少人中途流失，或平台经济性是否集中在少数规模化创作者身上。
