      - number: '7.3'
        title: 财务模型与客户传导风险：私有化不透明让残余暴露难以校准
        blocks:
          - type: paragraph
            body: >-
              最大的承销问题不是 Kajabi
              的风险看不见，而是严重程度只露出一部分。公开材料确认了一个隐私密集型运营模型：为分析和广告向第三方共享数据、创作者端法律义务、对支付处理商的依赖，以及反复出现的服务事故。但这些材料没有给出投资人通常用来区分烦扰性风险和经济重大风险的内部计数器。保留证据集中没有公开拒付率、没有当前流失或
              NRR、没有公开客户集中度表，也没有公开安全认证包。因此，严重程度和缓释成熟度只能从合同设计、运营历史和外部投诉界面的组合中推断，而不是来自董事会级指标。


              这种不确定性对 Kajabi
              尤其重要，因为公司把订阅软件卖给客户，而这些客户自身收入往往依赖平台可靠且合规地运转。创作者在宕机期间遭遇账单摩擦、支持缓慢、可迁移性弱或信任问题时，下游影响不只是投诉——它可能表现为取消、扩张减少、接受高端定价的意愿下降，最终压到估值。即使没有当前危机的证据，公开记录也支持中高残余暴露的判断。
