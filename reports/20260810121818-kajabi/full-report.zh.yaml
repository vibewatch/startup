      - number: '7.4'
        title: 执行与治理风险：AI 面扩大、条款更宽，直接尽调需求上升
        blocks:
          - type: paragraph
            body: >-
              Kajabi 正在加入更多自动化和 AI，但治理并没有变简单。Creator Studio 现在把视频转成短片、转录稿、邮件、博客和社交帖子；MCP 营销则称，创作者可以用外部 AI
              工具从一次对话中搭建页面、发送邮件并运行销售方案。条款试图控制由此产生的风险，要求隐私同意、安全控制、快速安全事件通知，并限制数据训练或迁移行为。这些护栏合理，但也确认 Kajabi
              预期其自动化界面会以一些方式被使用；如果客户或集成商误处理权限，隐私、安全和品牌损害就会出现。


              同时，Kajabi 的公开条款在结构上偏向平台：账户所有者仍对被委派用户负责，第三方服务可在功能需要时接收数据，测试版服务可能失败或消失，Kajabi 可以变更服务或价格。此类条款在 SaaS
              里并不反常，但与安全认证、组织深度和内部风险指标的有限公开披露放在一起，留下的是晚期私人公司常见问题：你能看到暴露地图，却看不到真实缓释成熟度。因此，人员、治理和安全尽调仍是活问题，而不是背景项。
