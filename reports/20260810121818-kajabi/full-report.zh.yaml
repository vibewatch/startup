      - number: '3.2'
        title: 能力与定价：Kajabi 很宽，但不是最便宜的起点
        blocks:
          - type: paragraph
            body: >-
              能力宽度仍是 Kajabi 最清楚的故事。Kajabi
              官方来源显示，一个订阅栈覆盖课程、社群、会员、营销、网站、自动化、结账，并且不抽取平台收入分成。许多竞争对手能匹配其中一两层，但很少能匹配完整组合。Teachable 在学生
              App、全球支付、购物车挽回和教育商业工作流上很强，但核心仍是学习产品。Thinkific 在 B2B 销售、开票、社群、订阅、品牌 App 和 AI 上比 Teachable
              走得更远，因此是规模化课程业务最接近的直接功能替代。Podia 用更简单的包覆盖课程、教练服务、社群、活动、邮件和建站；Circle 则从社群优先起点覆盖社群、课程、活动、邮件、支付、工作流和品牌
              App。beehiiv、Substack 和 Kit 最强的场景，是电子简报和受众所有权作为首要任务。


              但价格会重塑买家路径。Kajabi 年化入门价格显著高于 Teachable Starter、Thinkific Basic、Podia Mover、beehiiv Scale，以及 Substack
              的免费加收入分成模型。这意味着 Kajabi 很少是摩擦最低的上车入口。Teachable、Thinkific、Podia 和 beehiiv 都用低价或免费入门层捕获更早期创作者。Substack 和 Kit
              对写作者和电子简报运营者采取了更低摩擦路径。Kajabi
              的防线在于，创作者一旦同时运营多个产品，一体化经济性可能比购买多套工具更便宜；风险在于，创作者可能从别处开始，成长为单点最优组合，且永远感受不到足够痛点回到 Kajabi 整合。
