    {
      "id": "financial-model-and-customer-transmission",
      "title": "Financial-Model and Customer Transmission Risk: Private Opacity Leaves Residual Exposure Hard to Calibrate",
      "body": "The biggest underwriting problem is not that Kajabi’s risks are invisible; it is that their severity is only partly visible. Public materials confirm a privacy-intensive operating model, third-party data sharing for analytics and advertising, creator-side legal obligations, payment-processor dependence, and recurring service incidents. But they do not supply the internal counters that investors would normally use to separate nuisance risk from economically material risk. There is no public chargeback-rate disclosure, no current churn or NRR disclosure, no public customer concentration schedule, and no public security attestation package in the retained evidence set. That means severity and mitigation maturity must be inferred from the combination of contract design, operational history, and external complaint surfaces rather than from board-grade metrics.\n\nThis uncertainty is especially important for Kajabi because the company monetizes subscription software sold to customers whose own revenue often depends on the platform working reliably and compliantly. If creators experience billing friction, slow support, weak portability, or trust issues during outages, the downstream effect is not just complaints — it can show up as cancellations, fewer expansions, lower willingness to accept premium pricing, and ultimately valuation pressure. The public record therefore supports a medium-high residual exposure view even without proof of a current crisis.",
