    {
      "id": "named-proof",
      "title": "Named Customer Proof: Real Outcomes Exist, but Most Evidence Is Vendor-Curated",
      "body": "Kajabi does have meaningful named customer proof. Carrie Lupoli’s official story describes a health and coaching business that generated nearly $2.5M in revenue on Kajabi and built a meaningful social audience around a coaching community. Justin Welsh’s official story claims more than $5M in revenue, 25,000+ people helped, a $22K MRR upsell product, and a move away from seven separate tools. Official story pages and list pages also highlight Spencer Russell, Sophia Amoruso, Tyler Tometich, Tony Jeffries, and others with seven-figure or multi-million-dollar outcomes. This is stronger than generic logo walls because it ties named users to use cases and outcome claims.\n\nBut the proof is still curated by Kajabi. That does not make it false, but it does limit how far it can carry underwriting on its own. The right read is that Kajabi clearly powers some high-performing creator businesses across several niches, and that those businesses often cite consolidation and workflow simplicity as a reason to stay. The missing piece is denominator visibility. Public customer stories tell us what successful accounts can achieve, not what a median Kajabi customer achieves, how many churn before getting there, or how concentrated platform economics are in a small number of scaled creators.",
