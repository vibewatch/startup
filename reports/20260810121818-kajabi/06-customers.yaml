    {
      "id": "expansion-and-concentration",
      "title": "Expansion and Concentration: Strong Land-and-Expand Logic, Weak Public Revenue Concentration Visibility",
      "body": "Kajabi’s expansion logic is intuitive. A creator can start with one course or coaching offer, then add email capture, community, upsells, memberships, podcasts, and branded delivery over time. Product and pricing surfaces reinforce this land-and-expand motion by bundling more contacts, products, communities, admin seats, and API access at higher tiers. Several reviews and customer stories also reinforce the same pattern: Kajabi becomes more valuable as the business grows into multiple monetization formats and starts replacing more separate tools.\n\nWhat remains unclear is concentration. The long-tail nature of creator businesses suggests logo concentration should be low, but that does not tell us revenue concentration. Kajabi’s economics could still lean disproportionately on larger Growth and Pro accounts or on creators with sizeable email lists and recurring programs. Public sources do not answer that question. They also do not provide contract duration or renewal visibility. The safest conclusion is that Kajabi likely benefits from low individual-logo dependence and strong expansion pathways, but investors still need management data on top-account exposure, plan mix, and cohort retention before treating customer durability as solved.",
