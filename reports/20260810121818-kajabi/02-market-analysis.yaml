    {
      "id": "sizing-lenses",
      "title": "Sizing Lenses: The Macro Market Is Large, but Definitions Conflict",
      "body": "The retained source set supports a broad conclusion and a narrow caution at the same time. Broadly, every recent source agrees that the creator economy is large and still growing quickly. Research and Markets puts the market at $255.66 billion in 2025 and $323.48 billion in 2026, with $820.83 billion by 2030. A separate Research and Markets entry forecasts $434.79 billion of incremental growth during 2025-2030 at a 23.0% CAGR. Quantumrun, Demandsage, Canada Create, and Axis Intelligence all publish different numbers, but they land in the same rough zone: around the mid-$200 billions to low-$300 billions in 2026 and sustained low-20s to mid-20s growth rates.\n\nThe caution is that these figures are not interchangeable. Some sources count the whole creator economy, others emphasize platform tooling, and others blend brand spend, monetization layers, and ancillary services. That is why Kajabi should not be underwritten against one generic TAM slide. A better diligence stance is to preserve multiple lenses: a macro creator-economy lens, a professional-creator population lens, and an owned-audience software lens defined by subscriptions, communities, courses, coaching, and newsletter/podcast monetization. The evidence supports the outer market being real, but it does not cleanly isolate Kajabi's exact SAM or SOM. That gap is material because valuation and growth expectations depend far more on the monetizing expert-business subset than on the total universe of casual creators.",
