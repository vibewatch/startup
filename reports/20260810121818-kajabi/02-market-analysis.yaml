    {
      "id": "constraints-and-diligence-gaps",
      "title": "Constraints, Regulation, and What Public Data Still Cannot Prove",
      "body": "The same sources that support the market also show why not every creator becomes a good Kajabi customer. Income concentration is severe: only a small minority of creators earn six figures, many remain part-time, and burnout remains common. MBO's survey shows most independent creators earn modest amounts, while Axis and other 2026 compilations say only about 4% clear $100,000 per year. That makes the headline creator population a weak proxy for Kajabi's real economic pool. In practice, Kajabi has to win the segment that has enough revenue, enough audience trust, and enough product complexity to justify paying $143-$399 per month before processing fees.\n\nThere is also a regulatory constraint embedded in the category. FTC guidance makes clear that creators, advertisers, and agencies must disclose material connections and avoid deceptive endorsements, which matters because brand-heavy or affiliate-heavy monetization is harder to scale cleanly than owned subscriptions and education offers. Public data also does not isolate Kajabi's own share inside the relevant subsegments. Even with strong official traction signals across courses, coaching, communities, and podcasts, the retained sources do not reveal product-mix revenue, creator cohort retention, regional mix, or the share of customers that are truly multi-product operators. That means the market case is directionally strong, but precise SAM/SOM underwriting still depends on management data rather than public market reports.",
