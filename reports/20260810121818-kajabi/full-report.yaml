      - number: '1.4'
        title: Milestones, current metrics, and adverse notes
        blocks:
          - type: paragraph
            body: >-
              Kajabi’s milestone pattern shows a company that kept widening scope after establishing a strong foothold
              in online courses. The pricing-update page says New Kajabi launched in 2015 as a course product and later
              added landing pages, email, automations, payments, communities, podcasts, branded mobile apps, and other
              capabilities. Spectrum’s portfolio narrative ties 2023 to Creator Studio, Kajabi Payments, Branded Mobile
              App, and the Vibely acquisition, which together signal a push toward deeper commerce and community
              ownership. The 2025 creator-revenue release then reframes the company around “creator commerce” and
              ownership rather than social-platform dependence, using the $10 billion cumulative earnings milestone as
              proof of staying power.


              The public metric layer is directionally strong but not audit-grade. Revenue and headcount estimates vary
              across Growjo, Latka, Revelio, Craft, and Tracxn, which is why the cleanest summary is a range: roughly
              $75 million of estimated revenue or ARR and roughly 350 to 427 employees during 2025-2026. Adverse
              evidence is not existential but it is real. Trustpilot’s 2026 review stream includes praise for the
              all-in-one experience, but also repeated complaints about premium pricing, AI-led support, cancellations,
              data access, and billing issues. That means Kajabi’s biggest public risk signal is not fraud or
              regulation; it is whether a premium all-in-one promise keeps pace with support and reporting expectations
              as customers scale.
