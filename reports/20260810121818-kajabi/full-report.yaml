  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation follows a simple chain: Kajabi has real scale and premium potential, but stale marks and missing
      proof block a buy recommendation today.
    data:
      nodes:
        - id: n1
          label: Verified scale
          description: 10B+ creator payouts, 30K+ communities, premium all-in-one creator stack
        - id: n2
          label: Premium potential
          description: Integrated product breadth, payments, and workflow lock-in can deserve above-peer pricing
        - id: n3
          label: Stale private mark
          description: 2021 >$2B headline survives publicly without fresh price discovery
        - id: n4
          label: Missing revenue quality
          description: No audited ARR, NRR, gross margin, take rate, or cap-table transparency
        - id: n5
          label: Inferred current range
          description: ~$300M-$1.4B overall band; base case ~$560M-$900M
        - id: n6
          label: track
          description: Watch closely, but only pursue with price discipline and hard diligence
      edges:
        - from: n1
          to: n2
          label: supports some premium
        - from: n2
          to: n5
          label: but premium must fit 2026 market
        - from: n3
          to: n5
          label: forces markdown from old mark
        - from: n4
          to: n6
          label: blocks buy call
        - from: n5
          to: n6
          label: defines entry discipline
    approximationNotes: This figure compresses the chapter logic into decision nodes; it is not a forecast model.
    claimRefs:
      - CV007
      - CV008
      - CV024
      - CV026
      - CV029
      - CV030
      - CV032
      - CV034
      - CV035
