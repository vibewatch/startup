  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Kajabi Serves Owned-Audience Expert Businesses, Not the Whole Creator Economy'
        blocks:
          - type: paragraph
            body: >-
              Kajabi's own product and pricing surfaces make the boundary clearer than the macro market reports do. The
              homepage, 10B positioning page, and product pages consistently frame Kajabi as an all-in-one operating
              system for people monetizing expertise across courses, coaching, communities, memberships, newsletters,
              podcasts, payments, and marketing. That means the relevant market is not generic creator software, and it
              is definitely not the entire creator economy headline that includes brand deals, ad inventory, merch,
              agencies, and social-commerce flows. The product is aimed at creators who want to own the customer
              relationship, package knowledge into repeatable offers, and avoid stitching together five or six tools.


              That boundary also defines what belongs outside the scope. Enterprise CRM suites, agency services,
              social-platform ad spend, and marketplace-style creator revenue are adjacent, but they are not Kajabi's
              core buyer problem. Kajabi is selling a control-and-consolidation outcome: move from rented distribution
              to owned audience, then layer subscriptions, courses, coaching, community, and podcasts into one revenue
              stack. Circle's 2025 and 2026 research supports the same market logic by showing social media still
              dominates discovery while community platforms and memberships increasingly capture retention and
              monetization. For diligence, that distinction matters because benchmarking Kajabi against the full creator
              economy inflates TAM and hides the much more relevant question of how many expert-led businesses actually
              graduate into multi-product, owned-audience operators willing to pay for an integrated stack.
            claimRefs:
