      - number: '1.2'
        title: Founders, leadership transitions, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Kajabi’s founder story is still central to its positioning. Public and analyst-style sources consistently
              tie the company’s origins to Kenny Rueter and Travis Rosser building software for monetizing expertise
              online, with Rueter’s own 2025 manifesto reinforcing that origin story in first person. What is less clean
              is the present leadership picture. Partner and database sources from 2025-2026 still list Ahad Khan as
              CEO, while Kajabi’s own late-2025 manifesto says Rueter returned with “founder energy” and asked longtime
              executive Jonathan Cronstedt to join him as co-CEO. That is not a trivial discrepancy: it suggests either
              a transition lag in commercial databases or a deliberate leadership structure that has not been normalized
              across public profiles.


              Governance transparency remains modest for a private company of this scale. Public sources do show board
              evolution: Scott Wagner joined through the 2021 financing, and Spectrum says additional board members
              included Andrea Mallard and Cameron Deatsch. But none of the retained public sources provided a full
              current board roster, committee structure, ownership breakdown, or an audited cap-table view. The
              diligence implication is that Kajabi is easy to orient on at the founder, executive, and investor-brand
              level, yet still requires direct management materials to underwrite control, succession, and governance
              with institutional confidence.
