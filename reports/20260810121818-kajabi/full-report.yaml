  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Heatmap of Kajabi’s current public-risk posture. The heaviest cells cluster around privacy/compliance, operational
      reliability in monetization-critical workflows, and partner dependencies rather than around a single disclosed
      existential event.
    claimRefs:
