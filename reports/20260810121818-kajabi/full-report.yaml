chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Kajabi’s public identity is now broader than “course software.” The homepage, pricing page, careers page,
              creator milestone pages, and third-party company profiles all describe a platform designed to let experts
              build businesses around online courses, coaching, communities, memberships, newsletters, podcasts,
              payments, and marketing workflows from one system. That framing matters because Kajabi is not selling a
              single point product; it is selling reduction in tool sprawl for knowledge entrepreneurs who want to own
              their audience and keep customer data inside one stack. The company’s current messaging leans into
              “creator commerce” and, more recently, “the operating system for human expertise,” which is a more
              defensible category than generic creator software because it centers practitioners with paid knowledge
              products rather than pure audience reach.


              Public scale signals are strong but not perfectly clean. Historical financing materials show that Kajabi
              bootstrapped for roughly a decade, took first institutional capital in 2019, and reached a $550 million
              round in 2021 after saying its customers were already generating more than $1.5 billion in annual GMV.
              Later official and partner materials show the platform passing $8 billion and then $10 billion in
              cumulative creator revenue, while the 2025 data release says over 100,000 creators and entrepreneurs have
              used Kajabi to reach more than 150 million customers. The most defensible read is therefore not a precise
              audited operating scorecard, but a mature creator-business platform with real historical scale, meaningful
              longevity, and strong evidence that customers use multiple monetization formats inside one product.
