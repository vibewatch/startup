  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Model: Subscription First, Payments and Add-Ons Second'
        blocks:
          - type: paragraph
            body: >-
              Kajabi’s monetization stack is structurally attractive because the core revenue line is subscription
              software rather than marketplace commission. Official pricing pages show fixed monthly or annual plans
              with no platform revenue share, which means Kajabi monetizes creator businesses primarily through
              recurring access fees rather than by taxing every sale. That makes revenue quality directionally stronger
              than fee-heavy creator platforms because the company is not directly proportional to each customer
              transaction in the same way as a marketplace. At the same time, retained evidence from Sacra, Kajabi help
              content, and pricing commentary suggests Kajabi has expanded beyond pure subscription into
              commerce-adjacent monetization: Kajabi Payments, ACH invoicing, premium branded mobile app access, and
              possibly other operational upsells around tax, payment methods, or financing.


              The revenue bridge therefore looks like this: creators acquire customers, sell courses or memberships, and
              adopt Kajabi as the operating layer; Kajabi then captures recurring SaaS fees first, optional
              payment-related economics second, and feature or add-on revenue third. That is a good model if
              subscription churn is controlled because support and infrastructure cost should scale more slowly than
              GMV. The difficulty is that Kajabi does not disclose realized mix across plan tiers, payments, app
              revenue, or any capital product. Public creator-side volume metrics such as $10B cumulative creator
              earnings and $350M+ community revenue prove ecosystem throughput, but they do not reveal Kajabi’s actual
              take or margin by stream. Investors should therefore treat the business as subscription-led but not
              subscription-only.
