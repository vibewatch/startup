  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product Definition: Kajabi Sells a Connected Expert-Business System'
        blocks:
          - type: paragraph
            body: >-
              Kajabi no longer looks like a course host with a few adjacent features. Across its homepage, product hub,
              and module pages, the company presents a unified operating system for human expertise: online courses,
              coaching, communities, podcasts, websites, landing pages, email marketing, funnels, checkout, payments,
              contacts, and mobile experiences all sit under one brand and pricing umbrella. The customer workflow
              framing is important. Kajabi is not asking a creator to buy a separate LMS, CRM, email platform,
              landing-page builder, and member portal; it is asking them to run the whole business inside one system.


              That product thesis shows up repeatedly in module detail pages. Communities are tied to offers, email,
              content, and billing. Coaching is tied to scheduling, checkout, follow-up, and delivery. Podcasting is
              tied to lead capture, pages, and monetization rather than just RSS hosting. The online-courses page
              explicitly argues that expertise deserves more than a course platform, which is a concise statement of
              Kajabi’s broader product philosophy. This cross-module connectivity is the heart of Kajabi’s
              differentiation. It also means the product must reliably coordinate several moving pieces: creator setup,
              customer acquisition, commerce, access control, delivery, and re-engagement.
