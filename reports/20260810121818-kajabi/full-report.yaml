  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Contract Risk: Kajabi Helps With Compliance but Pushes Primary Responsibility Back to Creators'
        blocks:
          - type: paragraph
            body: >-
              Kajabi’s public legal posture is unusually clear about one thing: the platform supplies tools, templates,
              and workflows, but it does not assume primary compliance responsibility for the creators running
              businesses on top of it. The privacy notice and help-center materials say Kajabi provides features for
              GDPR and CCPA-style compliance, automatically incorporates its DPA and Standard Contractual Clauses where
              applicable, and offers data-rights workflows. But those same materials repeatedly stress that creators
              must draft their own terms, privacy policies, consent flows, and business-specific compliance practices.
              That matters because Kajabi sits in the middle of sensitive customer data, payments, subscriptions,
              marketing emails, and community interactions while contractually avoiding the role of end-to-end
              compliance guarantor.


              The legal documents also create two-sided risk. On one side, Kajabi’s terms require clear policies, opt-in
              practices, unsubscribe functionality, and lawful marketing behavior, which are real mitigants. On the
              other, the same terms give Kajabi broad rights to change services, moderate content, and channel disputes
              into individual arbitration. The 2026 federal regulatory picture is also more nuanced than a simple “FTC
              click-to-cancel is in force” narrative: the 2024 FTC negative-option amendments were vacated and the prior
              rule restored, but subscription-cancellation, privacy, and state-law exposure did not disappear.
              California privacy rules, growing state privacy coverage, and at least one settled 2025 lawsuit together
              show that Kajabi still operates inside a meaningful and active legal-risk surface.
