        - Includes Udemy acquisition and broader segment mix
      - - Docebo Aug-2026
        - Public enterprise learning SaaS comp
        - ARR $255.1M; adjusted EBITDA margin 16.4%; market cap ~$555M
        - ~2.2x market cap / ARR
        - Represents what a higher-quality, more enterprise-like learning SaaS can command
        - B2B enterprise LMS is structurally different from creator commerce
      - - Duolingo Aug-2026
        - Premium public education comp
        - Q2 revenue $298.5M; market cap ~$6.38B
        - ~5.3x annualized Q2 revenue
        - Illustrates what a premium learning multiple looks like with strong growth and profitability proof
        - Different category, consumer scale, and product moat
      - - FE International 2026 edtech benchmark
        - Sector benchmark
        - Median 7.8x EV/revenue across 271 observations; high-growth subscription often 5x-9x ARR
        - Useful benchmark band for serious but not perfect edtech assets
        - Provides sector-wide context above weak public comp levels
        - Broad sample mixes models and deal types
      - - MetricRig 2026 edtech range
        - Analyst benchmark
        - EdTech SaaS 3x-12x ARR; enterprise/workforce at upper end, consumer at lower end
        - Kajabi likely sits somewhere in the middle-upper part of this band if retention is strong
        - Useful framing for scenario-multiple selection
        - Generic benchmark rather than company-specific pricing
  - id: TV005
    title: Thesis-break and kill triggers table
    notes: Triggers focus on price discovery and underlying business quality rather than generic startup risk.
    claimRefs:
      - CV016
      - CV020
      - CV021
      - CV024
      - CV025
      - CV026
      - CV029
      - CV034
      - CV035
      - CV041
      - CV042
      - CV044
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Fresh mark resets below expectations
        - New round, tender, 409A, or secondary clears far below ~$700M midpoint
        - Confirms stale 2021 mark has little residual validity
        - Rebase valuation immediately to new clearing price
      - - ARR disappoints
        - Audited ARR materially below ~$80M base-case floor
        - Every scenario numerator shrinks and premium story weakens
        - Move toward bear-case multiples
      - - Retention / margin quality disappoints
        - NRR, churn, or gross margin do not look premium
        - Integrated-stack thesis no longer deserves strong multiple premium
        - Compress multiple band and reduce conviction
      - - Payments economics disappoint
        - Take rate, disputes, or refund burden are worse than expected
        - SaaS-plus-payments upside becomes gross-to-net drag
        - Treat payments as complexity, not upside
      - - Preference stack is heavy
        - Cap table shows major liquidation preference overhang
        - Enterprise value does not translate into equity value for new money
        - Demand larger discount or walk away
  - id: TV006
    title: Final diligence asks table
    notes: These asks are blocking items for moving from track to a stronger recommendation.
    claimRefs:
      - CV005
      - CV010
      - CV024
      - CV030
      - CV034
      - CV035
      - CV041
      - CV042
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited ARR and revenue bridge
        - Monthly and annual ARR/revenue for 2024-2026
        - Core denominator for every multiple used in this chapter
        - Request audited financials and board KPI packs
      - - Gross margin and payments take rate
        - Gross margin by subscription vs. payments / add-ons
        - Determines whether Kajabi deserves premium SaaS or blended-platform multiples
        - Request margin bridge and payments P&L
      - - Retention and concentration
        - NRR, GRR, logo churn, cohort expansion, top-account concentration
        - Valuation premium requires durable revenue quality
        - Request cohort dashboards and revenue concentration schedule
      - - Cap table and preferences
        - Fully diluted cap table, preference stack, side letters, and tender rights
        - Entry return can diverge from enterprise value
        - Request latest capitalization and waterfall model
      - - Operational reliability
        - Incident severity, payments downtime impact, and support backlog metrics
        - All-in-one model makes reliability economically important
        - Request incident review cadence and business-impact reporting
      - - Security / compliance posture
        - SOC 2 or similar, subprocessor governance, privacy complaint volumes
        - Needed to price residual legal and operational risk correctly
        - Request security packet and compliance reporting
