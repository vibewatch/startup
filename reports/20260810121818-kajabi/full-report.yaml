      - number: '4.2'
        title: 'Public Traction Signals: Scale Is Real, Precision Is Not'
        blocks:
          - type: paragraph
            body: >-
              Public traction is visible, but only in fragments. Kajabi’s own sources demonstrate meaningful
              creator-side throughput: the company crossed $10B in cumulative creator earnings by August 2025,
              highlights 30,000+ communities, 3M+ community members, and more than $350M in community revenue, and
              continues to position itself as the operating system for expert businesses. Historical financing coverage
              also reported $1.5B in annual creator GMV at the time of the 2021 round. Those signals are directionally
              important because they confirm Kajabi sits on real commercial activity rather than hobbyist engagement
              alone.


              The problem is that company throughput is not the same as company revenue. Independent revenue signals
              conflict. Latka centers Kajabi around roughly $75M estimated ARR, while Sacra contains one reference
              implying $100M ARR around the 2021 funding round and another later comparative reference that places
              Kajabi around $115M ARR in 2023. Growjo and IncFact provide additional external estimates, but with lower
              methodological transparency. Taken together, the evidence says Kajabi likely operates at material scale
              but that its precise run-rate is not reliably public. As a result, public underwriting should use a range,
              not a point estimate. Compared with public comp Thinkific, Kajabi is plausibly the larger private platform
              by historical valuation and cumulative creator earnings narrative, but Thinkific still offers the cleaner
              reference set for revenue mix, margin structure, payment penetration, ARPU, and near-term cash generation
              because it files results each quarter.
