  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: >-
      KPI dashboard mixes verified scale signals, stale marks, and inferred underwriting ranges that drive the final
      recommendation.
    data:
      items:
        - label: Last disclosed valuation
          value: $2.0B+
          note: Tiger-led 2021 financing
        - label: Third-party ARR range
          value: ~$75M-$100M+
          note: Latka low end; Sacra higher historical anchor
        - label: Creator payouts
          value: $10B+
          note: Official milestone since founding
        - label: Communities footprint
          value: 30K+ / 3M+
          note: Communities and active members
        - label: Base EV range
          value: $560M-$900M
          note: 7x-9x on roughly $80M-$100M ARR
        - label: Weighted midpoint
          value: ~$700M-$800M
          note: Current public-evidence center of gravity
        - label: Recommendation
          value: track
          note: Attractive only with fresh proof or lower price
    approximationNotes: >-
      Dashboard intentionally mixes observed and inferred metrics; inferred lines are anchored to cited public sources
      rather than management guidance.
