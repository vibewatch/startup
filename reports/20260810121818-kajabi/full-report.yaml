      - number: '3.4'
        title: Moat Durability and Adverse Competitive Signals
        blocks:
          - type: paragraph
            body: >-
              Kajabi’s moat is meaningful but conditional. The durable part is the combination of breadth, no revenue
              share, creator-commerce identity, and a product set designed around multi-product expert businesses rather
              than single-format publishing. That makes Kajabi harder to replace once a customer truly runs courses,
              coaching, community, memberships, and marketing together. The fragile part is that many competitors are
              converging toward similar language and feature surfaces. Thinkific is shipping AI, community, commerce,
              and branded mobile. Circle now markets AI, email, payments, courses, workflows, and branded apps as one
              digital-business platform. Teachable has improved checkout, taxes, recovery, and subscriptions. beehiiv
              has extended beyond newsletters into podcasts, digital products, community, ads, and recommendations. Kit
              continues to add monetization and automation. In other words, Kajabi’s narrative is no longer unique even
              if its bundle is still unusually complete.


              Adverse evidence is strongest around price compression and specialist displacement. Teachable, Thinkific,
              Podia, beehiiv, Kit, and Substack all give creators lower-cost or free entry points. Public Thinkific
              disclosures also remind investors that scale does not eliminate competitive pressure: the company still
              reports modest growth, negative adjusted EBITDA in Q1 2026, and explicit risk factors around competition
              and technology change. Substack’s 10% fee is a structural weakness versus beehiiv and Kit, but that does
              not automatically benefit Kajabi; it benefits any no-take-rate or lower-fee alternative. The bottom line
              is that Kajabi’s moat is not a single killer feature. It is the claim that a serious expert business is
              better run in one place than across a stitched stack. That claim remains credible, but it is increasingly
              challenged from both above by Thinkific/Circle and below by cheaper wedge products.
