companyProfile:
  summary: >-
    Kajabi is a US-based creator-commerce SaaS platform founded in 2010 that expanded from course software into an
    integrated operating stack for knowledge entrepreneurs. Public evidence supports a broad product footprint across
    courses, coaching, communities, memberships, newsletters, podcasts, payments, and marketing workflows; strong scale
    signals including $10B+ cumulative creator revenue and 100,000+ creators and entrepreneurs served; and a May 2021
    growth financing of $550 million at a valuation above $2 billion. The main underwriting challenge is not whether
    Kajabi has real product-market fit, but whether today's private valuation, revenue quality, retention, and cap-table
    terms can be defended from 2026 public evidence alone.
