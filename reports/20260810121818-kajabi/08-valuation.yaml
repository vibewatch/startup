    {
      "id": "diligence-exit-and-thesis-breaks",
      "title": "Exit Readiness, Thesis-Breaks, and Final Diligence: The Missing Proof Is Specific and Actionable",
      "body": "Kajabi’s most plausible near-term liquidity outcomes are strategic sale, structured secondary, or continued private compounding rather than a clean public-market step-up from the last disclosed mark. The strongest strategic precedent in the current learning market is Coursera’s combination with Udemy at an implied roughly $2.5B equity value, which proves that scaled learning assets still attract real capital in 2026. But that transaction also involved far greater current revenue scale and public-company disclosures than Kajabi offers. For Kajabi, the missing proof is precise: audited ARR and revenue for 2024–2026, gross-margin detail, churn and NRR, payments take rate, customer concentration, and the cap-table preference stack.\n\nThose asks determine whether Kajabi is a premium creator-business operating system or simply a high-quality private asset still priced off a ZIRP-era story. If fresh diligence shows ARR above $100M, healthy retention, strong margins, and limited preference overhang, the bull case becomes credible. If it shows ordinary retention, thin payments economics, or heavy preference drag, the old mark should be treated as history rather than value. Until that proof arrives, the investment call should remain track with explicit price discipline and thesis-break triggers tied to fresh financing, secondary marks, or audited operating metrics.",
