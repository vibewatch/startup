  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Kajabi is a real, scaled creator-commerce platform, but the last public valuation anchor — over $2 billion in 2021 — is stale and hard to defend on 2026 evidence. Public sources support genuine premium characteristics: all-in-one product breadth, no-revenue-share positioning, payments expansion, 10B+ cumulative creator payouts, and a large installed community base. They do not support blindly carrying forward a 20x-plus creator-economy era revenue multiple. Using third-party ARR proxies and current public learning/software anchors, the most defensible public-evidence valuation range is roughly $300M-$1.4B, with a base case around $560M-$900M and a weighted center around $700M-$800M. That supports a track recommendation: Kajabi merits continued attention, but only with strong price discipline and diligence on audited ARR, retention, gross margin, cap table, and payments take rate."
  },
  "sections": [
    {
      "id": "recommendation-and-price-discipline",
      "title": "Recommendation and Price Discipline: Kajabi Is Interesting, but the 2021 Mark Is Not a Current Fair Value",
      "body": "Kajabi has earned the right to be valued as more than a simple course-hosting tool. The company’s own public surfaces show a broad creator operating stack across courses, coaching, communities, memberships, newsletters, podcasts, payments, and now AI-enabled workflow layers. The platform also has real scale signals: official pages point to 10B+ paid out to creators since founding, 30,000+ communities, 3M+ active community members, and a product pitch centered on helping serious creators consolidate several tools into one system. That operating breadth and creator workflow depth justify some premium over narrower or weaker public learning-software names.\n\nThe challenge is price, not quality. Kajabi’s last disclosed valuation — over $2 billion in the 2021 Tiger-led financing — was struck during peak creator-economy enthusiasm and before the 2022–2026 multiple reset across public and private software. Third-party estimates now pull in opposite directions: Sacra repeats the 2B mark while tying it to roughly $100M ARR at the time, whereas Latka centers Kajabi around roughly $75M ARR/revenue in 2024. Either way, carrying forward the old mark into 2026 implies a multiple far above current public learning and many public software comparables. The evidence therefore supports track, not buy: Kajabi deserves attention, but only with a meaningful markdown to the old headline price or with new diligence that proves it has outgrown the stale multiple compression story.",
