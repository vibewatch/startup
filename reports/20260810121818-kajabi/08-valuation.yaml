    {
      "id": "comparable-valuation-anchors",
      "title": "Comparable Valuation Anchors: Public Learning and Software Markets Support a Premium, Not a 20x Relic",
      "body": "The right way to value Kajabi is to separate quality from observable pricing. On quality, Kajabi has clear strengths: it is broader than course-only platforms, embeds payments and marketing into the workflow, and has better customer-proof and monetization breadth than a hobbyist tool. On pricing, however, the public market is much less forgiving than the 2021 venture cycle. Thinkific’s 2026 filings show a creator-commerce peer with about $61M-$62M ARR, roughly 72%-73% gross margin, and only an ~$86M CAD market cap by August 2026 — an extreme example of how compressed this segment can look in public markets. Docebo, a stronger enterprise learning SaaS, trades at a more respectable but still modest multiple relative to ARR. Coursera’s combined company scale after the Udemy acquisition is far larger, yet its public market cap still implies only a low-single-digit revenue multiple. Duolingo, with much stronger growth, subscriber scale, and profitability proof, is the rare premium education multiple in the set.\n\nSector valuation guides help frame the range. FE International places the 2026 edtech median around 7.8x EV/revenue across a wide sample, while MetricRig says EdTech SaaS ranges from about 3x to 12x ARR depending on segment and revenue quality. Multiples.vc likewise shows August 2026 software valuations as highly segmented by AI narrative, specialization, and profitability. Kajabi probably deserves to sit above weak public creator peers but below the rare premium learning asset unless diligence proves truly exceptional retention and margin quality. That is why comparables support a premium band — not the automatic preservation of a >$2B stale mark.",
