    {
      "id": "scenario-range-and-sensitivity",
      "title": "Scenario Range and Sensitivity: Public Evidence Supports a Wide Range, with the Base Case Below $1 Billion",
      "body": "Scenario analysis has to start with humility because Kajabi does not disclose audited ARR, gross margin, NRR, customer concentration, or cap-table details publicly. The best public range is therefore built from third-party ARR proxies and from how 2026 markets price learning and software businesses with differing levels of proof. The bear case assumes Kajabi is closer to the low end of public estimates, that customer-retention quality is only ordinary, and that investors price it more like a creator platform than a premium software compounder. That produces roughly $300M-$425M at 4x-5x on $75M-$85M of ARR.\n\nThe base case assumes Kajabi is between $80M and $100M of ARR, that its integrated stack and creator proof justify a premium to Thinkific-like public distress, and that the platform’s breadth plus payments attach earn something closer to 7x-9x. That yields about $560M-$900M. The bull case assumes ARR is already $100M-$120M, that retention and margin quality look premium in diligence, and that Kajabi’s AI, payments, and multi-product creator workflows translate into a 10x-12x band. Even then, the resulting $1.0B-$1.4B range stays well below the stale 2021 headline valuation. Put differently: the debate is not whether Kajabi is valuable; it is how much of the old venture mark still survives after 2026 price discovery in public comps.",
