    {
      "id": "funding-investors-and-capital-base",
      "title": "Funding history, investors, and capital base",
      "body": "Kajabi\u2019s capital formation is unusually important because the company spent its first decade as a bootstrapped business before stepping into institutional growth capital. The first outside capital came in November 2019 from Spectrum Equity, which both company and press coverage frame as Kajabi\u2019s first institutional investment. That event matters because it marked the transition from founder-funded software company to sponsor-backed scale-up. The second major financing event is much larger and much better documented: in May 2021 Kajabi raised $550 million from Tiger Global, TPG, Tidemark, Owl Rock, and Meritech alongside existing backer Spectrum Equity. Multiple retained sources align on round size and on a post-money valuation above $2 billion, with some later profiles rounding the figure to exactly $2.0 billion and Spectrum using $2.1 billion in timeline language.\n\nThe 2021 round carried two additional signals relevant to diligence. First, Kajabi described itself as profitable while raising growth equity, which differentiates it from venture-funded creator tools that relied on subsidized customer acquisition. Second, management said the company would use the capital to scale product development, expand internationally, and explore M&A. The later Vibely acquisition and 2023 launch cadence are consistent with that stated use of funds. What remains private are the details that matter for control and downside underwriting: liquidation terms, secondaries, ownership concentrations, and any debt or structured obligations were not disclosed in the retained public evidence.",
