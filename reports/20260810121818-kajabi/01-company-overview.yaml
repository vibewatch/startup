  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Kajabi is a long-running, Orange County-based creator-commerce platform that expanded from course software into an all-in-one stack for expert-led businesses. Public evidence strongly supports the 2019 Spectrum investment, the May 2021 $550 million financing at a valuation above $2 billion, and the August 2025 $10 billion cumulative creator-revenue milestone. The main diligence friction is not whether Kajabi has scale, but whether current leadership, headcount, revenue, and governance are transparent enough to underwrite from public evidence alone."
  },
  "sections": [
    {
      "id": "identity-product-and-scale",
      "title": "Identity, product scope, and scale signals",
      "body": "Kajabi\u2019s public identity is now broader than \u201ccourse software.\u201d The homepage, pricing page, careers page, creator milestone pages, and third-party company profiles all describe a platform designed to let experts build businesses around online courses, coaching, communities, memberships, newsletters, podcasts, payments, and marketing workflows from one system. That framing matters because Kajabi is not selling a single point product; it is selling reduction in tool sprawl for knowledge entrepreneurs who want to own their audience and keep customer data inside one stack. The company\u2019s current messaging leans into \u201ccreator commerce\u201d and, more recently, \u201cthe operating system for human expertise,\u201d which is a more defensible category than generic creator software because it centers practitioners with paid knowledge products rather than pure audience reach.\n\nPublic scale signals are strong but not perfectly clean. Historical financing materials show that Kajabi bootstrapped for roughly a decade, took first institutional capital in 2019, and reached a $550 million round in 2021 after saying its customers were already generating more than $1.5 billion in annual GMV. Later official and partner materials show the platform passing $8 billion and then $10 billion in cumulative creator revenue, while the 2025 data release says over 100,000 creators and entrepreneurs have used Kajabi to reach more than 150 million customers. The most defensible read is therefore not a precise audited operating scorecard, but a mature creator-business platform with real historical scale, meaningful longevity, and strong evidence that customers use multiple monetization formats inside one product.",
