evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, committee structure, ownership breakdown, and any secondary or debt disclosures since the
      2021 financing.
    whyItMatters: >-
      Without direct governance materials, it is difficult to underwrite control, succession, and downside protections
      behind the headline valuation.
    diligencePath: Request a current board deck, cap table summary, and financing memo from management or shareholders.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-leadership
    missingEvidence: >-
      Formal 2026 corporate disclosure clarifying whether Ahad Khan remains CEO, or whether Kenny Rueter and Jonathan
      Cronstedt are now the active co-CEOs.
    whyItMatters: >-
      Leadership clarity matters for decision rights, organizational accountability, and the credibility of any forward
      plan.
    diligencePath: >-
      Obtain a current executive org chart or signed leadership update from Kajabi and confirm who holds legal officer
      roles.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: current-financial-profile
