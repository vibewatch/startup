  evidenceGaps:
    - type: missing-source
      severity: material
      topic: legal-regulatory-status
      missingEvidence: >-
        Primary regulator, court, enforcement, patent-office, and jurisdiction-specific legal records for DevRev entities.
      whyItMatters: >-
        Without primary records, this chapter cannot determine whether any legal or regulatory event changes
        the investment risk ranking.
      diligencePath: >-
        Run entity- and founder-level searches with counsel in operating jurisdictions and reconcile results
        to management's litigation, IP, and regulator-correspondence schedules.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: security-incident-history
      missingEvidence: >-
        Independent SOC 2 report, penetration tests, incident and outage logs, security claims history,
        permission-isolation tests, and write-action audit evidence.
      whyItMatters: >-
        Product architecture gives agents access to sensitive synchronized data and the ability to change
        systems of record, increasing the potential impact of a control failure.
      diligencePath: >-
        Review audit exceptions and bridge letters, sample incidents and postmortems, test tenant isolation,
        and execute red-team scenarios for permission drift and unauthorized writes.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: concentration-retention
      missingEvidence: >-
        Revenue by customer and connector, top-customer shares, NRR, GRR, churn, contract duration, renewal
        cohorts, and paid conversion after promotional credits.
      whyItMatters: >-
        Named deployments and promotional adoption do not establish durable recurring revenue or diversified
        dependence across customers and channels.
      diligencePath: >-
        Obtain customer-level recurring-revenue cohorts, renewal files, top-20 concentration, connector usage,
        and startup-program conversion by credit-expiry cohort.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR003]
    - type: conflicting-data
      severity: material
      topic: financial-provenance
      missingEvidence: >-
        Audited revenue definitions, financing ledger, cash balance, debt and commitments, burn, runway,
        gross margin, and model-inference cost.
      whyItMatters: >-
        Secondary funding totals conflict, the $100 million revenue figure lacks a recorded source, and
        funding raised does not establish cash available.
      diligencePath: >-
        Reconcile signed financing documents and cap table to bank statements, then tie audited revenue,
        gross margin, inference cost, operating cash flow, and forecast runway to monthly management accounts.
    - type: private-evidence-only
      severity: material
      topic: ai-quality
      missingEvidence: >-
        Independent, query-level AI evaluation with false-resolution, escalation, harmful-answer, override,
        latency, and model-drift rates by regulated workflow.
      whyItMatters: >-
        A vendor-published aggregate resolution rate does not disclose the denominator needed to assess
        unsafe answers, escalations, or performance outside the named deployment.
      diligencePath: >-
        Reproduce the evaluation on blinded production samples, stratify by risk class and model, and require
        pre-agreed accuracy and safety thresholds before expanding write authority.
