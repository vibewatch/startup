  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Funded startups up to Series A
        - Founder or early operations leader
        - Product, support, and engineering generalists
        - Startup operating budget
        - Greenfield AI-first support plus product workflow setup
        - Founder, COO, or head of product
        - Free credits and implementation support reduce initial friction
      - - SaaS unicorn and growth software accounts
        - VP support, product, or engineering operations
        - Support engineers, product managers, and developers
        - Departmental software budget
        - Connect customer signal to backlog and release workflows
        - Support or engineering leadership
        - Tool consolidation and faster customer response loops
      - - Regulated enterprise accounts
        - Service-operations or customer-experience leadership
        - Agents, support reps, and enterprise-search users
        - Enterprise transformation budget
        - Overlay AI support and search without replacing the core system of record immediately
        - CIO, support leadership, or transformation sponsor
        - Security, compliance, and measurable deflection ROI
      - - Horizontal multi-team expansion
        - Executive sponsor for customer operations
        - Search, support, product, and workflow-automation teams
        - Shared platform budget
        - Expand from one workflow into onboarding, collections, or adjacent customer operations
        - Cross-functional platform owner
        - Proven results in the first deployment use case
    notes: >-
      Buyer map combines the startup offer, broad customer-story mix, and the BILL reference case;
      budget owners are inferred from the workflows each source says DevRev is meant to unify.
    claimRefs: [CM004, CM006, CM007, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The retained pool supports a layered boundary lens for DevRev's addressable market, but not a
      spend-based TAM/SAM/SOM stack.
    data:
      items:
        - label: Fragmented enterprise support-product-engineering workflows
          detail: Outer boundary defined by the cross-functional workflow problem the platform claims to solve.
          note: Broader than help desk alone; narrower than generic CRM or data infrastructure.
        - label: Software teams that need customer signal to flow into engineering work
          detail: Independent and official descriptions repeatedly connect support tickets, product issues, and code context.
          note: This is the clearest supported "core" market in the assigned pool.
        - label: Organizations willing to coexist with incumbent systems first
          detail: BILL kept Salesforce as its system of record, and official DevRev copy says the platform can co-exist with or replace Zendesk, Salesforce Service Cloud, Intercom, and Jira.
        - label: Security- and trust-sensitive enterprise deployments
          detail: BILL required enterprise-grade security, compliance suitability, and measurable ROI before rollout.
        - label: Subsidized startup entry cohort
          value: 12 months free + $10k credits
          detail: DevRev's startup motion is explicitly limited to funded startups up to Series A via investor-ecosystem partners.
        - label: Current public traction proof
          value: 1,000+ customers
          detail: Installed-base evidence supports demand, but it is not equivalent to TAM, SAM, or SOM.
    approximationNotes: >-
      Boundary-lens figure only; numeric labels are limited to directly disclosed public counts and
      incentives, and the figure should not be read as a spend-based market-sizing model.
    claimRefs: [CM001, CM003, CM004, CM005, CM008, CM010, CM011, CM012]
