    title: "Recommendation: track until the data room catches up with the story"
    body: >-
      DevRev looks strategically differentiated enough to keep in the funnel, but the current public record does
      not justify paying near the last disclosed unicorn valuation without fresh financial and cap-table evidence.
    claimRefs: [CV001, CV009, CV010]
  - calloutType: risk
    title: "Primary downside trigger"
    body: >-
      If management cannot pair recent customer wins with independent retention, margin, and pricing-quality proof,
      the next financing could reset below the 2024 valuation anchor.
    claimRefs: [CV006, CV008, CV009, CV012]
