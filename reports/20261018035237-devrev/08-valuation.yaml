  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Supported thesis
      - What would change the view
    rows:
      - ["Architecture", "Persistent knowledge-graph and SQL layer can be a durable product differentiator for enterprise AI workflows.", "Independent benchmarks or customer references that show the architecture is not materially better than competing stacks would weaken the moat argument."]
      - ["Customer proof", "BILL and other recent case studies suggest DevRev can land complex enterprise support deployments.", "Independent 2026 references that fail to confirm ROI, or concentration in only company-authored stories, would lower conviction."]
      - ["Go-to-market quality", "Recent case-study cadence suggests active commercialization across several sectors.", "If free-credit programs and incentives are driving more demand than paid expansion, valuation should compress."]
      - ["Execution maturity", "The platform story is ambitious enough to support strategic interest.", "An unfinished public product surface such as the Computer download page raises a commercialization-readiness caution until fixed."]
    notes: >-
      This table mixes company-authored traction claims with analytical caveats about how much independent pricing
      and commercialization proof still remains missing.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
    rows:
      - ["Bull", "Recent enterprise deployments convert into independently validated retention, margin, and expansion data; product differentiation holds.", "Could justify paying at or above the last disclosed round once fresh operating data supports the premium.", "Requires management data room evidence plus independent customer checks."]
      - ["Base", "Traction is real, but public evidence remains strongest on narrative and customer anecdotes rather than disclosed unit economics.", "Track around the historical unicorn anchor; defer a price-led commitment until diligence closes the operating-data gap.", "Most consistent with the assigned pool today."]
      - ["Bear", "2026 growth or retention fails to support the 2024 mark, or acquisition quality relies too heavily on subsidies and marketing-led proof.", "Expect multiple compression or a down-round relative to the last disclosed valuation.", "Would become more likely if management cannot provide fresh financials or independent customer outcomes."]
    notes: >-
      Scenario framing is directional because the assigned pool supports a historical valuation anchor, not a fresh
      public operating model with precise multiple inputs.
    claimRefs: [CV001, CV003, CV004, CV006, CV008, CV009, CV010, CV011, CV012]
