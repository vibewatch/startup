- id: TP002
  title: Capability and deployment tradeoff matrix
  columns:
  - Buying criterion
  - DevRev signal
  - Incumbent or substitute signal
  - Implication
  rows:
  - - Unified support + product + engineering context
    - ToolDirectory and DevRev official material both describe one graph spanning customers, tickets, code, releases, and feedback
    - The status quo alternative is multiple separate tools, and search-first substitutes are described as retrieval layers rather than one operating graph
    - DevRev is competing on workflow unification, not only on ticket automation
  - - Can layer on top of an incumbent system of record
    - BILL kept Salesforce as the system of record and still selected DevRev
    - Incumbent suites start from installed workflow ownership, which raises switching costs for challengers
    - DevRev's most defensible path may be coexistence first, displacement later
  - - Action inside workflows, not only retrieval
    - BILL says the AI agent could authenticate users, create and update Salesforce cases, and orchestrate workflows
    - Internal build and search platforms may answer questions, but this evidence pool does not show the same packaged execution depth
    - Execution breadth is a meaningful differentiator if the customer trusts the integration
  - - SQL-queryable integrated data layer
    - DevRev claims its unified graph supports a full SQL query over integrated SaaS datasets
    - MCP-only or vector-search approaches are presented as more brittle and harder to debug in DevRev's own framing
    - This is the clearest architectural moat claim, but it still lacks third-party validation
  - - Breadth of buyer-facing proof
    - Customer stories span fintech, security, HR tech, software development, e-commerce, healthcare, AI, and logistics
    - Independent proof of renewal, benchmarked CSAT lift, or broad win-loss data is not present in the assigned pool
    - Horizontal ambition is visible, but durability remains less proven than breadth
  notes: Unsupported cells are stated as gaps. This matrix separates official claims, buyer-side case evidence, and missing independent validation rather than collapsing them into one score.
  claimRefs:
  - CP001
  - CP002
  - CP005
  - CP010
  - CP011
  - CP012
  - CP015
  - CP016
- id: TP003
  title: Public pricing and packaging signals
  columns:
  - Offer or comparator
  - Price or contract signal
  - Included capabilities
  - Unknowns or discounts
  - Implication
  rows:
  - - DevRev core platform
    - ToolDirectory labels DevRev as Paid and publisher-listed
    - AI-native CRM spanning support, engineering, and product workflows
    - No public seat, usage, or contract-floor data in the assigned evidence
    - Public evidence points to enterprise pricing opacity rather than transparent self-serve list pricing
  - - Computer for startups program
    - 12 months free of Pro level usage and custom integrations
    - Knowledge graph, AI-first capabilities, and agentic workflows for funded startups up to Series A
    - Capped at $10k credits, then 50% discount on the immediate follow-on commit
    - Aggressive seeding motion can widen adoption at the low end without revealing enterprise realized pricing
  - - Enterprise overlay motion
    - BILL case shows value framed around AI resolution, deep Salesforce integration, and trust controls
    - Customer-facing AI, enterprise search, and workflow execution inside incumbent systems
    - No per-query, per-seat, or outcome-based commercial metric is disclosed
    - Packaging appears solution-led and integration-heavy, which can support larger ACVs but slows public comparability
  - - Named competitor public pricing in assigned pool
    - Not available for Salesforce, Zendesk, Atlassian, Productboard, Glean, Fin, Copilot, or internal build
    - Unknown from this evidence set
    - Unknown
    - Competitive price-performance underwriting remains a material diligence gap
  notes: This table is intentionally limited to pricing and packaging signals that appear in the assigned pool. It does not infer realized enterprise pricing from promotional or directory-style evidence.
  claimRefs:
