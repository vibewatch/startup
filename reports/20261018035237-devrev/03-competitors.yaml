  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Public or customer-verified enterprise pricing, discounting, and realized ACV data for DevRev and named incumbent alternatives.
    whyItMatters: Without price realization and contract-shape data, it is hard to judge whether DevRev wins on ROI, on breadth, or through heavy promotional discounting.
    diligencePath: Request sample order forms, pricing sheets, and competitive bake-off summaries by segment, then reconcile them against renewal and expansion behavior.
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: Independent benchmark or analyst comparison covering DevRev versus Salesforce, Zendesk, Atlassian, Glean, and internal build paths on deployment time, answer quality, and workflow execution.
    whyItMatters: The core moat claim is architectural and operational, but the assigned pool does not contain neutral evidence that buyers actually experience that superiority across alternatives.
    diligencePath: Obtain neutral customer references or analyst evaluations that compare implementation burden, answer quality, and operational outcomes across the named competitor classes.
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: Multi-customer renewal, expansion, and churn evidence showing that DevRev persists after the initial deployment and founder-led sale.
    whyItMatters: A broad declared competitor set matters only if DevRev can keep accounts and expand usage once incumbents answer with bundled AI or lower pricing.
    diligencePath: Ask for cohort retention, NRR, reference calls from overlay deployments, and post-implementation adoption dashboards segmented by incumbent environment.
