  - CP014
  - CP016
figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  summary: 'Evidence-backed ordinal map of where DevRev is trying to compete: broad workflow unification and execution depth versus narrower point tools, search substitutes, and build-it-yourself paths.'
  data:
    points:
    - label: DevRev unified graph platform
      x: 5
      y: 5
      note: Highest plotted breadth because assigned sources describe one graph across support, product, and engineering plus workflow execution.
    - label: Salesforce-native support stack
      x: 3
      y: 3
      note: Strong execution inside an incumbent system of record, but less evidence in this pool of cross-product unification.
    - label: Stitched Zendesk + Jira + feedback stack
      x: 2
      y: 2
      note: Common status quo with multiple systems and manual context transfer.
    - label: Enterprise search and AI add-ons
      x: 3
      y: 2
      note: Search-first substitutes can answer questions, but this pool shows less packaged workflow execution depth.
    - label: Internal build / MCP federation
      x: 4
      y: 2
      note: Potentially broad because teams can connect many systems, but operational complexity and reliability sit on the buyer.
    - label: Point PM or ticketing tools
      x: 2
      y: 1
      note: Caplight public comparables imply adjacency, but the assigned evidence does not show the same breadth of workflow scope.
    xAxis:
      label: Workflow unification breadth
      min: 1
      max: 5
      low: Point tool or narrow surface
      high: Cross-support, product, and engineering graph
      description: Ordinal synthesis from assigned evidence only; not an external benchmark.
      scale: ordinal
    yAxis:
      label: Operational execution depth
      min: 1
      max: 5
      low: Retrieval or triage only
      high: Acts inside workflows with preserved system context
      description: Higher scores reflect evidenced workflow execution, not market share.
      scale: ordinal
  approximationNotes: Ordinal positions are synthesized from assigned-source evidence and are intended to compare alternative classes, not to state measured market share or benchmark scores.
