  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的来源一致将 DevRev 描述为融合型产品，而不是狭窄的支持或工程工具。Gartner 将其定义为统一产品开发、客户支持和收入运营的 AI 原生平台；Brand Hopper
              的报道又将边界扩展到业务数据和“DevCRM”概念。DevRev 官方材料进一步强调，产品可以与 Zendesk、Salesforce Service Cloud、Intercom 和 Jira
              等独立系统并行，也可以替代它们。综合来看，市场边界包括支持、产品、工程以及相邻客户运营工作流的支出，但不包括通用 CRM、数据仓库或 AI 工具，除非这些预算被重新用于解决同一类支持—工程协同问题。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
