chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              指定的公开来源一致将 DevRev 描述为 AI 原生企业平台，而不是单点工具。公司当前信息围绕“Native Shared Memory”和支持、产品、工程工作的共享系统展开；其关于页面则称，公司自 2021
              年起一直在推进人机协作伙伴模式。公开材料及独立媒体 VentureBeat 的报道都将 DevRev 的成立时间置于 2020 年末，这一点很重要，因为大多数可见的规模化主张都是在 2024 年 8
              月融资后才出现的。结果是，公司清楚说明了希望替代或整合什么，但对这一运营模式的确切范围，仍高度依赖公司自述。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO013
              - CO014
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层故事比治理故事更清晰。公开来源反复确认 Dheeraj Pandey 和 Manoj Agarwal 是创始人；两人的 Nutanix 背景也解释了 DevRev
              为何强调基础设施级可靠性和企业工作流整合。这种创始人与市场的契合度，是后续章节可以复用的真实事实。不过，指定来源池没有展示当前董事会名单、委员会结构、投票权，或除已知投资人和创始人领导层之外的清晰控制图。这一缺口并不否定公司的进展，但关键人物依赖和治理尽调仍未关闭。
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: 融资、规模与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              本章最扎实的硬数据点是 2024 年 8 月的 A 轮公告：DevRev 称融资 1.008 亿美元、估值 11.5 亿美元，VentureBeat
              也重复了这一说法。第三方聚合页面补充了信息，但也带来精确性风险。GetLatka 公开页面显示估值略高，为 12 亿美元，并将两轮融资的总额合计为 1.508 亿美元；Caplight
              列出了更广泛的投资人名单，但没有披露经济条款或权利。公开规模指标的质量同样参差不齐：DevRev 在 2024 年 8 月声称客户超过 1,000 家，而 GetLatka 页面显示 2025 年 11
              月员工数为 809 人，依据来自 LinkedIn。这些都是有用信号，但不能替代经审计的运营指标或完整的资本结构表。
