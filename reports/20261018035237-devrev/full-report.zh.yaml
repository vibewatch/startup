      - 类别
      - 规模或市场信号
      - 目标细分市场或购买场景
      - 有证据支持的差异化
      - 局限
    rows:
      - - DevRev
        - AI 原生统一平台
        - 公司控制的来源称其累计融资 $151M、约 938 名员工，A 轮估值为 $1.15B
        - 中型市场和企业级 SaaS 买方；初创公司路径覆盖获资助至 A 轮的企业
        - 以一个图谱统一支持、工程和产品工作流，并声称能够与 Zendesk、Salesforce Service Cloud、Intercom 和 Jira 共存或取代它们
        - 这里的公开证据主要由公司控制；实际定价和中性胜率数据缺失
      - - Atlassian / Productboard / Zendesk 集群
        - 现有单点工具及相邻公开可比公司
        - Caplight 按嵌入相似度将 Atlassian（75%）、Productboard（71%）和 Zendesk（69%）列为最接近的可比公司
        - 已分别使用工单、工程和反馈系统的团队
        - 代表 DevRev 所称会迫使团队在工具间手动转移上下文的拼接式现状
        - 指定证据没有披露该集群当前的产品打包、AI 附加率或替换率
      - - Salesforce 原生支持栈
        - 带 AI 附加功能的现有系统记录
        - BILL 称 Salesforce 深度嵌入且不可替换；Salesforce 原生 AI 是评估过的 15+ 个替代方案之一
        - 重视现有工作流连续性的大型或受监管企业
        - 现有厂商拥有强大的分发和锁定效应；DevRev 的赢单路径是叠加集成，而非推倒重来
        - 证据来自一个公司撰写的客户案例
      - - 企业搜索和 AI 附加功能
        - 相邻替代方案
        - BILL 评估过企业搜索平台和 Google 产品；DevRev 的比较中心还针对 Glean、Copilot、ChatGPT、Claude 和 Fin
        - 希望先检索答案、再整合工作流的买方
        - 狭窄搜索任务可能更易部署，但证据池对端到端工作流执行的支持更少
        - 指定证据中没有独立基准比较检索质量或自动化 ROI
      - - 内部自建 / MCP 联邦
        - 现状替代方案
        - BILL 评估过内部自建；DevRev 认为仅用 MCP 检索会增加延迟和运营复杂度
        - 拥有工程能力且需要严格控制的团队
        - 如果买方能够承担系统集成工作和治理开销，则较为灵活
        - 指定证据没有中性的 TCO、可靠性或维护基准
    notes: 仅根据指定证据综合列出的厂商和替代方案类别；未知的商业细节明确保留，不作推断。
