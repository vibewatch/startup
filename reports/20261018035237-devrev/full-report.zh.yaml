            - 2026 年发布 BILL、FOSSA、FAME 和 Skedulo 的案例
            - 外部目录统计 29 个客户成功案例
        - label: 企业评估
          touchpoints:
            - BILL 评估了超过 15 个替代方案
            - 试点使用了 200,000 条真实客户查询
        - label: 生产环境部署
          touchpoints:
            - BILL 在试点中达到 70% 的 AI 解决率
            - 生产环境处理了 800,000 次客户咨询
            - 每年处理超过 600,000 次企业搜索查询
        - label: 跨账户扩张证明
          touchpoints:
