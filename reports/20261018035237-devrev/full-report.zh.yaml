  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 风险或控制领域
      - 证据与状态
      - 可能性
      - 严重程度
      - 缓解成熟度
      - 剩余风险敞口
      - 尽调路径
    rows:
      - - 企业数据隐私与权限失效
        - 广泛同步和跨系统操作是产品功能；指定证据池没有独立控制审计。
        - 风险源于架构本身；控制失效频率未知。
        - 高
        - 公司描述了权限感知的记忆、监控和合规控制。
        - 在控制设计和运行经过独立测试前为高。
        - 审阅 SOC 2 Type II 报告、DPA、子处理商清单、数据流、租户隔离测试和权限核对日志。
      - - 未授权或错误的 agent 写入
        - VentureBeat 报道了创建 / 更新能力；DevRev 的 2026 年发布说明了人在回路中的执行。
        - 能力已存在；有害写入频率未知。
        - 高
        - 描述了人工监督，但阈值和覆盖证据并不公开。
        - 中高，因为操作可能触及系统记录。
        - 在接近生产环境的场景中测试最小权限、审批门槛、回滚、不可篡改审计日志和写入失败恢复。
      - - 受监管客户工作流中的 AI 正确性
        - 供应商发布的 BILL 案例称，200,000 次概念验证（PoC）查询的解决率为 70%。
        - 风险实质存在；错误和升级分母未披露。
        - 高
        - 公司描述了 token 验证、防护栏、SOC 2 Type II 和 PCI-DSS 对齐。
        - 在独立样本确定准确率、升级率和有害回答率之前为高。
        - 获取查询级评估设计、错误解决率、升级分类、受监管内容控制及独立审计结果。
      - - 诉讼、执法、知识产权与监管状态
        - 指定证据池没有监管机构、法院、专利局或执法记录。
        - Unknown
        - 可能较高；没有断言发生过事件。
        - 无法根据现有证据评估。
        - 证据缺口没有边界，不代表记录清白。
        - 由律师按实体和司法辖区开展检索；获取诉讼清单、监管机构往来、保险理赔和知识产权意见。
    notes: 根据截至 2026-10-18 指定的预取证据由分析师排名；可能性标签区分有证据支持的风险路径与未知事件频率，且没有任何一行断言发生过事故。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers material regulatory and legal categories visible in the assigned source pool; primary regulator, court,
        patent, and audit records were not present.
    claimRefs:
