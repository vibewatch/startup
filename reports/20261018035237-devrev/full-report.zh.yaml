            body: 如果管理层无法将近期客户胜利与独立的留存、利润率和定价质量证明结合起来，下一轮融资可能低于 2024 年估值锚点。
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV012
