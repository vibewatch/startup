        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              影响最大的敞口是架构风险，而不是已有记录的事件：DevRev 称其平台持续将企业系统同步到统一存储中；VentureBeat 则报道 Computer
              可以在这些系统中创建和更新记录。这种组合可以减少割裂的工作流，但权限、连接器、模型或写入动作一旦失败，就可能在敏感客户和运营数据中扩散。下一层是执行风险。DevRev
              正在扩大产品范围、受监管工作流部署和员工规模，但公开证据仍缺少留存、集中度、毛利率、推理成本和现金跑道。二手来源的融资证据也不一致，因此融资额不能被视为可用现金。由此得出的姿态是需要高强度尽调，而不是已经发生已知数据泄露、监管行动或客户失败。
