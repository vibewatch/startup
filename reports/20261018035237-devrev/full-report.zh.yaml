      - number: '3.3'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              最可信、且有证据支撑的优势是：当买方拒绝拆除现有系统时，DevRev 仍能以覆盖层方式赢得部署。BILL 的案例显示，Salesforce 已深度嵌入且不可替代，但 DevRev 在超过 15
              个选项的评估后仍胜出，因为客户希望用一个方案获得 AI 解决、深度 Salesforce 集成和企业级信任控制。这在战略上很重要：DevRev
              不必在第一天就替换所有现有系统。风险在于，这个来源池中的大部分证明仍由公司控制。公开来源展示了客户广度、融资和广泛的已声明竞争对手，但没有提供独立的得失率、实际定价、续约数据，或与
              Salesforce、Zendesk、Atlassian、Glean 和内部自建的中立性能基准。因此，护城河主张是合理的，但尚未得到独立评估。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
      - number: '3.4'
        title: 展品
        blocks:
          - type: callout
            title: 独立竞争证明仍然薄弱
            body: >-
              指定来源池支持 DevRev 已声明的竞争对手集合和一次有力的共存式胜出，但没有提供相对于 Salesforce、Zendesk、Atlassian、Glean
              或内部自建方案的独立价格、续约或基准数据。因此，护城河耐久性更像是合理推断，而非已被证明的事实。
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP010
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据表明，DevRev 通过覆盖支持、产品、搜索和工作流用例的 AI 原生企业平台变现，但没有公开核心产品清晰的标价架构。DevRev
              自有材料强调演示、客户案例、初创企业额度、定制集成和多产品部署，而不是标准化自助式价格卡。最明确披露的商业方案是 2024 年 10 月的创业公司计划：符合条件的融资初创企业可获得 12 个月 Pro
              使用权和定制集成，额度上限为 1 万美元，到期后享受 50% 折扣。独立评论还称价格未公开，潜在买方应直接联系供应商。这种组合表明，DevRev
              可以在战略上为早期采用提供补贴，同时把大部分实际价格和合同结构保留给协商式企业销售。
            claimRefs:
