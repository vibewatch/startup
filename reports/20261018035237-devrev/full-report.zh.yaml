  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 近期企业部署转化为经过独立验证的留存、利润率和扩张数据，且产品差异化得到保持。
        - 一旦新的经营数据支持溢价，可以支持以不低于上一轮披露价格入场。
        - 需要管理层数据室证据以及独立客户核查。
      - - 基准
        - 增长是真实的，但公开证据目前仍主要是叙事和客户轶事，而非披露的单位经济数据。
        - 以历史独角兽估值锚为参考；在经营数据缺口补齐前，暂缓仅由价格驱动的投资承诺。
        - 最符合当前指定资料池的情况。
      - - 悲观
        - 2026 年增长或留存不足以支撑 2024 年估值，或者获客质量过度依赖补贴和营销驱动的证明。
        - 预计相对于上一轮披露估值，估值倍数会压缩，或公司将进行下行轮融资。
        - 如果管理层无法提供最新财务数据或独立客户结果，这一情景更可能发生。
    notes: 情景判断是方向性的，因为指定资料池支持的是历史估值锚，而不是带有精确倍数输入的新鲜公开经营模型。
