        title: 展品
        blocks:
          - type: callout
            title: 商业证明比变现披露更清晰
            body: DevRev 展示的客户部署深度公开证据，多于实际成交价格证据。这对产品—市场契合度是积极信号，但也让投资人无法判断 ASP、服务收入组合和毛利率。
