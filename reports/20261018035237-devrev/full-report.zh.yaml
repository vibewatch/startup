  - id: FR001
    title: 剩余风险与证据矩阵
    type: matrix
    summary: 该矩阵将已观察到的产品或融资暴露，与合理但尚未量化的失败路径及重大证据缺口分开；它不估算事件发生概率。
    data:
      columns:
        - 已观察到的暴露
        - 合理但尚未量化
        - 重大证据缺口
      rows:
        - label: 数据访问与写入控制
          values:
            - label: 跨系统数据同步和写入权限
              tone: risk
            - label: 权限漂移或错误写入传播
              tone: risk
            - label: 独立控制审计和事件历史
              tone: risk
        - label: AI 质量与治理
          values:
            - label: 厂商报告的 70% 解决率概念验证（PoC）
              tone: warning
            - label: 受监管工作流中的不安全回答或错误升级
              tone: warning
            - label: 查询级错误率和人工覆盖率分母
              tone: risk
        - label: 连接器可靠性
          values:
            - label: 持久化同步层
              tone: neutral
            - label: API 限流、源系统宕机或上下文过时
              tone: warning
            - label: 连接器 SLA 和重放证据
              tone: warning
        - label: 财务能力
          values:
            - label: 有佐证的 1.008 亿美元 A 轮融资
              tone: neutral
            - label: 扩张成本基础和模型推理负担
              tone: warning
            - label: 现金、消耗、利润率和续航
              tone: risk
        - label: 客户持久性
          values:
            - label: 已点名的受监管工作流部署
              tone: neutral
            - label: 促销带来的采用可能无法转化或续约
              tone: warning
            - label: 客户集中度、NRR、GRR 和流失率
              tone: risk
        - label: 公开指标质量
          values:
            - label: 有佐证的融资规模和估值
              tone: neutral
            - label: 相互冲突的二手融资总额
              tone: warning
            - label: 1 亿美元收入数字的来源未记录
              tone: warning
    approximationNotes: 这是基于引用证据的定性分析综合；位置反映潜在影响和证据充分程度，不代表经过测量的概率、损失金额或事件数量。
    claimRefs:
      - CR003
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证明支持继续跟踪公司，但仅凭公开来源不足以判断上一已知估值可以承保。
    data:
      nodes:
        - id: round-anchor
          label: 2024 年独角兽轮
          detail: 官方融资轮估值 11.5 亿美元；独立市场数据页面仍将公开估值锚定在这一水平。
        - id: customer-proof
          label: 2026 年客户证明
          detail: BILL 和客户案例页面表明，公司确有企业使用，近期也持续发布案例。
        - id: architecture-edge
          label: 知识图谱论点
          detail: DevRev 认为，统一且可用 SQL 查询的图谱是其持久的产品差异化优势。
        - id: disclosure-gap
          label: 财务披露缺口
          detail: 指定来源没有披露当前 ARR、NRR、毛利率、现金消耗或优先股堆叠。
        - id: execution-caution
          label: 执行层面谨慎
          detail: 'Computer 桌面版落地页仍显示“DOWNLOAD: INCOMING”（下载：即将上线）。'
        - id: recommendation
          label: 跟踪 / 估值偏高
          detail: 保持关注，但在作出投资判断前，要求私有尽调或更有支撑的价格。
      edges:
        - from: round-anchor
          to: customer-proof
        - from: customer-proof
          to: architecture-edge
        - from: architecture-edge
          to: disclosure-gap
        - from: disclosure-gap
          to: execution-caution
        - from: execution-caution
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
