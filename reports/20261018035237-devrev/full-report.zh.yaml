    rows:
      - - 统一的支持 + 产品 + 工程上下文
        - ToolDirectory 和 DevRev 官方材料都描述了一个横跨客户、工单、代码、发布和反馈的图谱
        - 现状替代方案由多个彼此分离的工具组成；搜索优先的替代方案被描述为检索层，而非一个运营图谱
        - DevRev 竞争的是工作流统一能力，而不只是工单自动化
      - - 可叠加在现有系统记录之上
        - BILL 保留 Salesforce 作为系统记录，同时仍选择了 DevRev
        - 现有套件从已部署的工作流控制权出发，提高了挑战者的切换成本
        - DevRev 最站得住脚的路径可能是先共存、后替换
      - - 在工作流内执行动作，而不只是检索
        - BILL 称 AI 代理可以认证用户、创建和更新 Salesforce 案例，并编排工作流
        - 内部自建和搜索平台可能可以回答问题，但证据池没有显示出同等的打包执行深度
        - 如果客户信任该集成，执行广度就是有意义的差异化
      - - 可用 SQL 查询的集成数据层
        - DevRev 声称其统一图谱支持对集成 SaaS 数据集执行完整 SQL 查询
        - 在 DevRev 自己的表述中，仅用 MCP 或向量搜索的方法更脆弱，也更难调试
        - 这是最清晰的架构护城河主张，但仍缺乏第三方验证
      - - 面向买方的证明广度
        - 客户案例覆盖金融科技、安全、HR 科技、软件开发、电子商务、医疗、AI 和物流
        - 指定证据池没有独立的续约证明、基准化 CSAT 提升或广泛的胜负数据
        - 横向扩张野心可见，但持久性还没有像覆盖广度那样得到充分验证
    notes: 未获支持的单元格明确标为缺口。本矩阵将官方主张、买方侧案例证据和缺失的独立验证分开，而不是压成一个分数。
