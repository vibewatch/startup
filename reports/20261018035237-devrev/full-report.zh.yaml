      - number: '2.2'
        title: 受证据约束的规模化视角
        blocks:
          - type: paragraph
            body: >-
              指定来源池没有独立分析师拆分，能够单独估算融合型“DevCRM”或支持—产品—工程平台的可寻址支出，因此传统 TAM/SAM/SOM
              分层会变成凭空臆测，而不是有证据支撑。来源池能够支持的是几组受约束的采用视角：DevRev 报称进入市场仅一年多后客户就超过千家；其创业公司计划通过 80 多个投资人群体，覆盖获得融资、最高到 A
              轮的初创企业；BILL 的部署则显示，单个企业用例可以触达数十万下游业务客户和数百万终端用户。这些是有用的需求信号，但属于装机基础或市场进入代理指标，而不是市场规模估算。
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM014
