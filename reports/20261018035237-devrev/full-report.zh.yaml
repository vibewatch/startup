  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与商业包装
        blocks:
          - type: paragraph
            body: >-
              DevRev 卖的不是狭窄的帮助台插件。在官方材料、第三方评论以及 Computer
              的相关报道中，公司被呈现为一个跨职能平台：围绕一个系统记录，连接客户支持、企业搜索、产品反馈和工程执行。这一广度对尽调很重要，因为它同时扩大了可寻址工作流，也增加了实施负担：买方购买的不只是工单自动化，还包括一个应当替代多个遗留工具、或位于其上层的数据与工作流骨干。公开产品组合也支持这一判断：独立定价信息显示免费层、付费层和按用量计费的额度并存，使市场切入更容易，但实际支出将取决于用量、采用深度以及严肃部署所需的高级功能。
