      - number: '4.2'
        title: GTM 动作与公开增长代理指标
        blocks:
          - type: paragraph
            body: >-
              现有 GTM 证据更像企业主导，而不是纯产品驱动。DevRev 2024 年 8 月的融资公告将融资与数百万美元部署联系起来，并称平台进入市场一年多后已经获得 1,000
              多家客户信任。后续客户证明强化了这一销售方式：BILL 在选择 DevRev 前评估了 15 个以上替代方案，随后用 20
              万条真实客户查询运行概念验证（PoC），再扩大部署。这种模式说明销售依靠咨询式推进、可量化业务案例和证明门槛，并保留下游扩张潜力，而不是低接触的席位销售。2026 年 10
              月的客户案例索引还显示，参考客户覆盖金融科技、软件、医疗、网络安全、媒体、人力资源科技、AI 和电子商务，支持其横向市场适配性，尽管它没有披露各客户群的转化率、留存率或实际 ARR。
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: 成本结构、交付负荷与资本充足度
        blocks:
          - type: paragraph
            body: >-
              公开证据在成本端明显少于收入动能端。DevRev 的架构和客户材料暗示，集成、实施、企业安全以及持续模型/基础设施支持都会产生服务交付成本，尤其是在客户要求保留
              Salesforce、受控数据访问和快速上线时。然而，保留的来源没有披露毛利率、支持交付成本、模型推理成本、CAC、回本期、净现金消耗、现金、债务或现金跑道。因此，财务能力主要由融资历史锚定：公司和市场数据来源对
              2024 年 8 月披露的 A 轮/最新估值基准基本一致，而第三方市场数据也仍将 DevRev
              描述为公开价格发现有限的私营公司。某个聚合网站提供了收入估算，但审计轨迹不足以用于投资判断。因此，资本充足度仍是尽调事项，而不是结论。
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI013
              - CI015
