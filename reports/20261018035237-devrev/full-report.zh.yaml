        - 提供同步上下文并接收写回。
        - 没有披露连接器层面的使用量或收入集中度。
        - API 变更、中断、权限不匹配或同步过时会削弱回答和操作。
        - 高
        - 已描述持久化本地记忆和感知速率的摄取。
        - 在获得连接器 SLA、重放和核对证据前为中高。
      - - 基础模型与客户选定模型
        - VentureBeat 报道的 GPT、Claude 及客户微调模型
        - 为工作流提供推理和生成能力。
        - 没有披露模型供应商构成、回退占比或成本拆分。
        - 供应商中断、价格变化、政策变化或模型漂移会损害服务或利润率。
        - 高
        - 多模型支持可降低对单一供应商的依赖。
        - 缺少路由、评估、回退和单位成本证据时为中高。
      - - 风险投资与融资
        - Khosla Ventures、Mayfield Fund、Param Hansa Values 及其他投资者
        - 为产品和市场拓展提供资金。
        - 公开总额相互矛盾，现金可用性未披露。
        - 更高烧钱或更慢转化会带来融资或稀释压力。
        - 高
        - $100.8M A 轮融资已获交叉验证；没有公开的现金跑道证据。
        - 在现金、烧钱、债务、承诺和现金跑道核对前为高。
      - - 初创与投资者生态渠道
        - DevRev 声称的符合条件初创公司和 80+ 投资者团体
        - 通过额度、折扣和生态接入支持获客。
        - 付费转化、客户群留存和渠道归因收入未披露。
        - 促销带来的采用未能转化，或掩盖获客成本和支持负担。
        - 中
        - 额度上限和后续折扣定义了初始转化节点。
        - 在提供额度后的转化和毛利率客户群数据前为中高。
    notes: 依赖项各行识别的是有证据支持的运营关系，而非已测量的对手方集中度；缺失份额和经济数据属于明确的尽调缺口。
