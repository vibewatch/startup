  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              指定证据中最难的估值锚仍是 DevRev 2024 年 8 月的 A 轮：公司称融资 1.008 亿美元、估值 11.5 亿美元，而 Multiples 将这一锚点四舍五入至 11
              亿美元，仍将其列为当前估值参考。换句话说，在运营侧证据尚未完整之前，公开价格证据已经过时。本来源池中的估值来源都没有披露当前 ARR、毛利率、NRR 或优先股堆叠，Caplight
              的公开预览也将更深的文件覆盖置于访问权限之后。因此，投资判断应继续对价格保持敏感：DevRev
              的战略证明足以让它留在跟踪名单上，但在没有通过私有尽调补齐财务和优先权层级缺口前，公开证据不足以支持按上一轮独角兽估值买入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
