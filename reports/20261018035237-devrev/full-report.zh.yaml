      - number: '7.4'
        title: 财务执行与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              DevRev 和 SiliconANGLE 都确认 1.008 亿美元 A 轮和 11.5 亿美元估值，但公开二手来源对总融资额存在分歧：Growth Engineer 列出 1.86 亿美元，GetLatka
              报告 1.508 亿美元，SiliconANGLE 则称超过 1.5 亿美元。GetLatka 另列出 2024 年 6 月年收入 1 亿美元，但同时注明来源未记录；这不是可靠的 ARR
              证据，不应据此计算估值倍数。同一资料显示员工数从 2024 年 12 月的 554 人增至 2025 年 11 月的 809
              人，这增加了执行要求，但没有揭示现金消耗。论点失效触发器包括重大权限或写入控制失败、连接器持续陈旧、无法在受监管工作流中独立验证 AI
              准确性、额度结束后的付费转化下降，或管理层无法提供经审计的留存、集中度、利润率、现金、现金消耗和现金跑道证据。
            claimRefs:
