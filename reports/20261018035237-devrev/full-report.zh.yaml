      - number: '3.2'
        title: 差异化、产品组合与分销姿态
        blocks:
          - type: paragraph
            body: >-
              DevRev 的差异化主张首先在架构，其次在定价。官方技术文章称，MCP 式即时检索会带来性能开销和运营复杂度，而 DevRev 则预先将企业数据整合到统一图谱中，以回答基于 SQL
              的问题并驱动工作流动作。这种叙事在竞争上很关键，因为它试图把 DevRev 与搜索优先的助手及割裂系统组成的遗留技术栈区分开来。商业层面的公开证据透明度则低得多。ToolDirectory 只确认 DevRev
              是付费产品，而创业公司计划为融资到 A 轮的初创企业提供明显促销性的套餐——12 个月 Pro 使用权加定制集成，额度上限为 1 万美元，后续续用享 50%
              折扣。这一组合更像企业级、解决方案驱动的销售方式，配合激进的初创公司播种，而不是标准化的自助式定价。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
