      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的经济买方不是购买单点工具的某个部门负责人，而是负责服务运营、产品执行或开发者生产力的跨职能领导者；他们希望用一个系统把客户信号连接到工程行动。日常用户包括支持工程师、产品经理、软件开发者和企业搜索用户，这与
              DevRev 声称将多个割裂工作流收拢到一个统一界面的定位一致。公开客户证据还显示出分阶段采用路径：初创客户通过免费额度和生态合作伙伴获得补贴；BILL 等企业客户则先把 DevRev
              作为覆盖层，在保留原有系统记录的情况下采用，等更广泛替换工作流变得可行后再进一步扩展。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素、约束与待尽调问题
        blocks:
          - type: paragraph
            body: >-
              来源池中最强的需求驱动是工作流统一：每个保留的官方来源都把 DevRev
              的价值与客户对话、工单、产品问题和代码上下文连接到一个图谱或系统记录联系起来。这一驱动很重要，因为它有望带来更快的答复、更低的协同成本，以及可量化的转接减少或成本节约。最大的制衡因素是实施证明：企业仍需将产品安全地接入深度嵌入的现有系统，而且在批准部署前似乎需要量化的
              ROI 门槛。BILL 的评估标准——深度 Salesforce 集成、企业级安全和 30%
              的转接减少门槛——是来源池中最清楚的减速证据。剩余缺口是结构性的，而不是编辑问题：这里的公开来源没有按地域、预算负责人或客户细分披露自下而上的市场模型，因此这些输入仍是估值工作的核心尽调要求。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 融合是品类主张
            body: 有证据支持的最清晰市场主张，不是“又一个 AI 帮助台”，而是把客户支持、产品管理和工程工作连接到一个操作系统中的融合层。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: 市场规模证据仍不足
            body: 公开增长信号确实存在，但这个来源池仍缺少基于支出的独立 TAM/SAM/SOM 或买方预算数据，无法单独估算相邻支持、产品和客户运营支出中有多少能够合理整合到一个平台上。
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              指定证据支持的是广泛的竞争框架，而不是某一个点名对手。第三方描述页面一致将 DevRev 定位为统一客户支持、工程和产品工作流的 AI 原生系统；现有格局则是由 Zendesk、Jira
              和独立反馈工具拼接而成的工具栈。DevRev 自己的发布材料进一步扩大了竞争范围：公司称其技术栈可以与 Zendesk、Salesforce Service Cloud、Intercom 和 Atlassian
              Jira 共存或替代它们；其公开对比中心还将 Glean、Copilot、ChatGPT、Claude 和 Fin 列为目标。独立公开可比公司覆盖较薄，但 Caplight 仍将
              Atlassian、Productboard 和 Zendesk 列为最接近 DevRev 的类上市公司同行。综合来看，买方并非只在帮助台厂商之间选择；替代集合还包括单点工具、既有 CRM、搜索层和内部自建。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
