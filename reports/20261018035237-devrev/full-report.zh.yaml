  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 保留下来的资料池支持用分层边界来审视 DevRev 的可服务市场，但不足以构建基于支出的 TAM / SAM / SOM 体系。
    data:
      items:
        - label: 碎片化的企业支持—产品—工程工作流
          detail: 外层边界由平台声称要解决的跨职能工作流问题界定。
          note: 比单纯的帮助台更宽，但比通用 CRM 或数据基础设施更窄。
        - label: 需要把客户信号传入工程工作的软件团队
          detail: 独立及官方描述反复将支持工单、产品问题与代码上下文联系起来。
          note: 这是指定资料池中得到最清晰支持的“核心”市场。
        - label: 愿意先与既有系统共存的组织
          detail: BILL 将 Salesforce 保留为其记录系统；DevRev 官方文案称，该平台可以与 Zendesk、Salesforce Service Cloud、Intercom 和 Jira 共存，也可以取代它们。
        - label: 对安全和信任敏感的企业部署
          detail: BILL 在上线前要求企业级安全性、合规适配性和可量化 ROI。
        - label: 获补贴的初创企业切入群体
          value: 12 months free + $10k credits
          detail: DevRev 的初创企业方案明确限定为通过投资者生态合作伙伴触达、且融资轮次不超过 A 轮的已获投初创企业。
        - label: 当前公开增长证明
          value: 1,000+ customers
          detail: 已安装客户基础的证据支持存在需求，但不等同于 TAM、SAM 或 SOM。
    approximationNotes: 这只是边界视角图；数值标签仅限于直接披露的公开数量和激励措施，不能将其理解为基于支出的市场规模模型。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM008
      - CM010
      - CM011
      - CM012
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 这是基于证据的序数定位图，展示 DevRev 试图竞争的位置：一端是广泛的工作流统一和执行深度，另一端是更窄的点工具、搜索替代方案和自行构建路径。
    data:
      points:
        - label: DevRev 统一图谱平台
          x: 5
          'y': 5
          note: 指定来源描述了一个贯穿支持、产品和工程、并能执行工作流的图谱，因此其绘制的覆盖广度最高。
        - label: Salesforce 原生支持技术栈
          x: 3
          'y': 3
          note: 在既有记录系统内执行能力强，但该资料池中关于跨产品统一的证据较少。
        - label: Zendesk + Jira + 反馈技术栈拼接
          x: 2
          'y': 2
          note: 多系统并存、依靠人工传递上下文的常见现状。
        - label: 企业搜索和 AI 增强工具
          x: 3
          'y': 2
          note: 以搜索为先的替代方案可以回答问题，但该资料池显示其打包后的工作流执行深度较低。
        - label: 内部构建 / MCP 联邦
          x: 4
          'y': 2
          note: 团队可以连接许多系统，因此潜在覆盖面很广；但运营复杂度和可靠性由买方承担。
        - label: 点状 PM 或工单工具
          x: 2
          'y': 1
          note: Caplight 的公开可比公司表明存在相邻领域，但指定证据没有显示其工作流范围同样广。
      xAxis:
        label: 工作流统一广度
        min: 1
        max: 5
        low: 点工具或窄界面
        high: 跨支持、产品和工程的图谱
        description: Ordinal synthesis from assigned evidence only; not an external benchmark.
        scale: ordinal
      yAxis:
        label: 运营执行深度
        min: 1
        max: 5
        low: 仅检索或分流
        high: 在工作流内行动并保留系统上下文
        description: Higher scores reflect evidenced workflow execution, not market share.
        scale: ordinal
    approximationNotes: 序数位置由指定来源证据综合得出，用于比较不同替代类别，不代表经过测量的市场份额或基准得分。
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP008
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据表明，公司通过咨询式企业销售把工作流痛点转化为平台扩张，但尚未转化为披露的单位经济数据。
    data:
      nodes:
        - label: 买方问题
          detail: 企业系统中的支持、产品和客户数据彼此割裂。
        - label: 切入方式
          detail: 以演示或概念验证（PoC）为先，通过免费试用或初创企业额度切入。
        - label: 初始部署
          detail: 在企业环境内上线支持 AI、搜索和工作流用例。
        - label: 量化成果
          detail: 公开证明引用了解决率、部署速度和节省成本的门槛。
        - label: 扩张路径
          detail: 同一数据层可以扩展到客户 360、产品、搜索和自动化工作流。
        - label: 变现未知项
          detail: 保留来源没有披露实际定价、毛利、CAC 和现金续航。
      edges:
        - from: Buyer problem
          to: Entry motion
          label: 购买前需要量化
        - from: Entry motion
          to: Initial deployment
          label: 试点或协商式上线
        - from: Initial deployment
          to: Measured outcomes
          label: 运营证明
        - from: Measured outcomes
          to: Expansion path
          label: 先落地再扩张逻辑
        - from: Expansion path
          to: Monetization unknowns
          label: 投资判断仍需内部指标
    approximationNotes: 该桥接图反映公开商业推进顺序，不代表已披露的转化率、利润率计算或按价值比例收取的收入份额。
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开来源将 DevRev 描绘为分层的同步—记忆—智能体平台，而不是单一聊天机器人功能。
    data:
      layers:
        - label: 体验界面
          detail: Computer 通过网页、产品内界面、移动端、Slack、Teams 和智能体工作流提供服务。
          modules:
            - 客户自助服务和支持渠道
            - Slack / Microsoft Teams / 桌面界面
          outputs:
            - 富含上下文的对话和搜索
          note: Digital surfaces are well evidenced; voice maturity is less visible in the assigned pool.
          tone: positive
        - label: 应用层
          detail: 公开用例覆盖支持自动化、企业搜索、产品开发工作流和客户自助服务。
          modules:
            - 支持解决和企业搜索
            - 产品开发和工作流用例
          outputs:
            - 跨职能客户、产品和工作编排
          note: Support is best evidenced; non-support workflows need deeper proof on day-two usage.
          tone: positive
        - label: 智能体与工作流层
          detail: AI 智能体负责分流、回答、升级和更新记录，而不是停留在检索阶段。
          modules:
            - Agent Studio 和工作流自动化
            - 案例更新、分流和 AI 到人工的交接
          outputs:
            - 已解决工单或可供人工处理的升级事项
          note: Action permissions and rollback controls are described, not independently audited here.
          tone: neutral
        - label: 统一记忆层
          detail: Computer Memory / 知识图谱连接客户、支持、产品和工作记录。
          modules:
            - 关系丰富的知识图谱
            - 实体和上下文统一
          outputs:
            - 单一可查询记录系统
          note: This is the clearest claimed technical moat versus runtime-federated approaches.
          tone: positive
        - label: 查询与分析层
          detail: SQL 式查询和对话式分析建立在统一记忆模型之上。
          modules:
            - SQL 支持的分析
            - 自然语言转查询体验
          outputs:
            - 答案、报告和工作流触发器
          note: The public pool supports the architecture claim, not benchmarked query accuracy.
          tone: neutral
        - label: 数据接入与记录系统
          detail: AirSync 和连接器同步传统 CRM、支持、工程及文档系统。
          modules:
            - Salesforce、Jira、Zendesk、Slack
            - Google / Microsoft 工具及更广泛的连接器集合
          outputs:
            - 按权限控制的同步数据
          note: Migration speed and connector depth remain more company-claimed than independently validated.
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE010
  - id: FU001
    title: 从评估到扩张证明的客户旅程
    type: journey-map
    summary: 公开证据显示，DevRev 正从广泛获取客户 logo，走向量化试点，再进入更深的多工作流部署，但持久留存仍未披露。
