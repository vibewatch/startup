              - CI015
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              DevRev
              的公开财务画像，在可以从企业部署深度推断收入质量的地方最强；在需要内部报告的地方最弱。公司似乎具备合理的“先落地、再扩张”模式：一个数据层、多个工作流界面，以及从支持起步、可以扩展到搜索、自动化和更广泛客户运营的客户证明。尽管如此，投资人仍缺少区分有前景的商业信号与可持续单位经济所需的核心投资判断输入。没有实际成交价格、产品组合、毛利率、CAC/回本期、流失率或
              NRR、现金消耗及现金跑道等披露，本章无法验证增长是否高效、服务或推理成本是否会压缩利润，或下一次融资究竟是可选项还是必需项。因此，在根据客户标识或部署胜利来获得估值信心之前，财务尽调应先聚焦管理层账目、客户群数据和未来
              18 个月现金计划。
            claimRefs:
              - CI001
              - CI011
              - CI013
              - CI015
