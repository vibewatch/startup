  - id: TR002
    title: 运营、质量与安全风险登记表
    columns:
      - 失效模式
      - 证据
      - 可能性
      - 严重程度
      - 缓解成熟度
      - 剩余风险敞口
      - 监控或终止标准
    rows:
      - - 连接器延迟、速率限制或源系统中断
        - DevRev 明确讨论了速率限制、节流、间歇性可用，以及运行缓慢或无法访问的系统。
        - 架构上合理；频率未披露。
        - 高
        - 描述了主动摄取和持久化知识层。
        - 中高，因为过时上下文可能驱动错误回答或操作。
        - 终止标准：持续违反新鲜度 SLA，或依据过时同步数据作出重大决策。
      - - AI 解决错误或不安全升级
        - BILL 概念验证报告称，200,000 次查询的解决率为 70%；未解决、升级和错误解决的细节缺失。
        - 在所述部署之外未知
        - 高
        - 公司描述了人工交接、防护栏和监控。
        - 在按工作流和风险类别独立测量前为高。
        - 跟踪错误解决、升级精确率、客户损害、覆盖率，以及按模型和用例划分的漂移。
      - - 跨系统写入或回滚失败
        - Computer 可以在多个系统中创建、更新记录并触发工作流。
        - 风险源于架构本身；失败频率未披露。
        - 高
        - 描述了人在回路中的执行，但没有回滚证据。
        - 在写入影响客户、收入或支持记录时为中高。
        - 终止标准：重大工作流中出现无法恢复的写入、权限升级或审计日志缺口。
      - - 组织扩张与控制流程滞后
        - GetLatka 根据 LinkedIn 报告，2025 年 11 月员工数为 809 人，而 2024 年 12 月为 554 人。
        - 执行压力合理存在；实际控制缺口未知。
        - 中
        - 没有关于控制团队规模、人员流失或运营节奏的公开证据。
        - 在管理层将招聘与收入质量及现金计划对齐前为中。
        - 审阅组织设计、人员流失、安全团队配置、事故归属、招聘计划及董事会层面的风险报告。
    notes: 严重程度是分析师对潜在影响的评估；指定证据没有披露发生率、错误分母或服务水平历史。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR007
      - CR014
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖项
      - 对手方或层
      - 作用
      - 集中度证据
      - 失败情景
      - 严重程度
      - 缓解措施
      - 剩余风险敞口
    rows:
      - - 源系统连接器
