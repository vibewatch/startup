              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              支持估值的论据是，DevRev 已经拼出差异化的平台故事，并获得了一些企业级证明。其架构主张围绕持久化知识图谱和可通过 SQL 查询的数据层展开；BILL 案例研究声称，20 万次概念验证（PoC）查询达到
              70% 解决率，节省金额超过 $4.5m 目标。客户案例页面还展示了 2025—2026
              年横跨金融科技、AI、医疗、物流和软件的近期客户。反向论点是，这个来源池中最强的近期增长证据仍由公司自述，而创业公司计划为获得融资的企业提供免费使用和额度，使客户增长到底反映付费意愿还是激励驱动获客变得模糊。另一个执行层面的警示来自
              DevRev 自己的 Computer 桌面端落地页：页面仍写着“DOWNLOAD: INCOMING”，而不是展示完成的产品界面。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              上行情景并不难想象：如果 DevRev
              能将近期企业案例转化为独立佐证、可重复的部署，战略买方或成长型投资人可能会在当前披露缺口尚未补齐的情况下，仍愿意按不低于上一轮的价格支付。基准情景更平淡：增长看起来真实，但公开证据仍支持跟踪执行，而不是为尚未显现的经济性提前付费。悲观情景也自然来自同一组缺失数据：如果
              2026 年增长、留存和利润质量无法验证 2024 年估值，或者新增客户过度依赖免费或补贴获客计划，下一轮融资可能低于上一轮。没有更新的财务披露，情景分析应保持方向性，而不能制造虚假的精确度。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 最终尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              在从跟踪转向买入前，管理层需要提供当前 ARR、净留存、毛利率、现金消耗和资本结构优先权细节，以及独立于 DevRev 自有营销界面的客户参考材料。核心尽调目标不是重新证明 DevRev
              拥有有趣的产品；指定来源池已经做到这一点。真正要测试的是，公司能否凭借耐久的经济性而非叙事动能，赚到或超过其最后已知的独角兽估值。论点失效触发器很明确：低于 2024 年锚点的新一轮融资、无法提供独立的 2026
              年客户成果、旗舰产品持续存在尚未完成的商业化界面，或证据表明免费额度计划在客户获取中发挥的作用大于产品拉力。
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 建议：在数据室追上故事之前继续跟踪
            body: DevRev 的战略差异化足以让它留在漏斗中，但当前公开记录不足以支持在没有新鲜财务和资本结构证据的情况下，按接近上一轮独角兽估值买入。
            calloutType: recommendation
            claimRefs:
              - CV001
