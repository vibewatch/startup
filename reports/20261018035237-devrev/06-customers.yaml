callouts:
  - calloutType: insight
    title: Strongest proof comes from one high-detail enterprise account
    body: >-
      BILL provides the only deeply quantified public deployment path in the assigned pool, which
      is useful because it proves complex adoption but risky because it concentrates evidentiary
      depth in a single flagship case study.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
  - calloutType: risk
    title: Adoption looks real, but durability is still opaque
    body: >-
      DevRev has enough named references to demonstrate market traction, yet the public source set
      still does not disclose renewal behavior, churn, or customer concentration, so durability has
      to be validated directly in diligence.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
