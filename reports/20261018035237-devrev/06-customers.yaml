        - Independent evidence that DevRev changed support workload composition at Bolt
        - Does not disclose paid expansion, seat count, or renewal outcome
    notes: >-
      Public metrics are mostly customer-level or point-in-time logo counts; they do not disclose
      cohort retention, account penetration, or denominator consistency across customers.
