        - DevRev Series A post
        - Medium
        - Indicates broad logo acquisition within roughly a year of market activity
        - No current-period update or paying-customer split
      - - Public customer-proof cadence
        - 2026 stories published for BILL, FOSSA, FAME, and Skedulo
        - 2026-02 to 2026-04
        - DevRev customer stories page
        - Medium
        - Shows refreshed public reference generation after the 2024 fundraising post
        - Publication cadence does not equal live deployment count
      - - External reference breadth
        - 29 customer success stories listed
        - 2026-10-18 access
        - CaseStudies.com snapshot
        - Medium
        - Independent directory corroborates a sizable public case-study footprint
        - Directory count does not prove active renewals or revenue scale
      - - BILL pilot scale
        - 200,000 real customer queries; 70% resolution rate
        - "2026-02-11"
        - DevRev BILL case study
        - Medium
        - Shows measured pilot conversion, not just a logo mention
        - Single-account metric; no portfolio-weighted benchmark
      - - BILL production scale
        - 800,000 customer inquiries plus over 600,000 enterprise-search queries annually
        - "2026-02-11"
        - DevRev BILL case study
        - Medium
        - Demonstrates post-pilot volume inside a regulated fintech account
        - No customer-spend figure or contract-length disclosure
      - - Bolt operational lift
