        - label: Enterprise evaluation
          touchpoints:
            - BILL evaluated more than 15 alternatives
            - Pilot ran on 200,000 real customer queries
        - label: Production deployment
          touchpoints:
            - BILL reached 70 percent AI resolution in the pilot
            - 800,000 customer inquiries handled in production
            - Over 600,000 enterprise-search queries annually
        - label: Cross-account expansion proof
          touchpoints:
            - Early testers included Velocity Global, Bolt, Bill.com, and Uniphore
            - Bolt filtered 3,000 irrelevant requests per month
        - label: Durability still undisclosed
