              - CR014
      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              DevRev's sync-first design is intended to reduce the latency and partial-failure risk of querying many
              systems at request time, yet the company also describes ingestion strategies for API rate limits,
              throttling, and intermittent availability. This makes connector fidelity, permission mapping, schema
              changes, and recovery behavior central operating risks. Computer also supports multiple model providers
              and customer-supplied models, creating an additional governance boundary around model behavior,
              availability, and contractual controls. Commercially, the startup program uses free credits, follow-on
              discounts, and investor-group eligibility; that can accelerate adoption while making conversion quality
              and post-credit economics important unknowns. Monitor sync freshness, failed writes, human-override rates,
              model-specific error rates, and paid conversion after promotional credits expire.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR016
