      - number: '6.2'
        title: Named adoption proof is strongest in the BILL case and thinner elsewhere
        blocks:
          - type: paragraph
            body: >-
              BILL is the clearest proof that DevRev can win a complex buyer, land a measured pilot, and convert that
              pilot into production scale. DevRev's case study says BILL evaluated more than 15 alternatives, ran a
              proof of concept on 200,000 real customer queries, achieved a 70% AI resolution rate, then moved into
              production as the first line of response for 800,000 customer inquiries while also handling more than
              600,000 enterprise-search queries annually. The same case study says rollout across Network, SMB, and
              Middle Market segments was completed in 15 weeks. Independent reporting is directionally supportive rather
              than equally deep: VentureBeat and BusinessWire both described Computer as available only in beta to
              existing customers in September 2025 and named Velocity Global, Bolt, Bill.com, and Uniphore as early
              testers, while VentureBeat alone added a concrete Bolt metric of 3,000 irrelevant requests filtered per
              month. That means DevRev has credible named references, but only one current public account exposes a
              truly dense operational data trail.
            claimRefs:
