    title: Customer journey from evaluation to expansion proof
    type: journey-map
    summary: >-
      Public evidence shows DevRev moving from broad logo acquisition into measured pilots and then deeper
      multi-workflow deployments, but without durable retention disclosure.
    data:
      items:
        - label: Broad logo acquisition
