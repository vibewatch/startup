      - - Risk rating
        - high
        - Disclosure gaps, execution signals, and possible pricing compression widen downside uncertainty.
      - - Valuation stance
        - stretched
        - Latest hard price anchor is still the 2024 Series A unicorn mark.
      - - Entry discipline
        - Need better proof
        - Require current ARR, NRR, gross margin, burn, and preference-stack detail before paying near the last round.
    notes: >-
      Historical financing facts are clear, but the assigned public pool does not disclose current ARR, retention,
      margin, or preference terms.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Supported thesis
      - What would change the view
    rows:
      - - Architecture
        - Persistent knowledge-graph and SQL layer can be a durable product differentiator for enterprise AI workflows.
        - >-
          Independent benchmarks or customer references that show the architecture is not materially better than
          competing stacks would weaken the moat argument.
      - - Customer proof
        - BILL and other recent case studies suggest DevRev can land complex enterprise support deployments.
        - >-
          Independent 2026 references that fail to confirm ROI, or concentration in only company-authored stories, would
          lower conviction.
      - - Go-to-market quality
        - Recent case-study cadence suggests active commercialization across several sectors.
        - If free-credit programs and incentives are driving more demand than paid expansion, valuation should compress.
      - - Execution maturity
        - The platform story is ambitious enough to support strategic interest.
        - >-
          An unfinished public product surface such as the Computer download page raises a commercialization-readiness
          caution until fixed.
    notes: >-
      This table mixes company-authored traction claims with analytical caveats about how much independent pricing and
      commercialization proof still remains missing.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
    rows:
      - - Bull
        - >-
          Recent enterprise deployments convert into independently validated retention, margin, and expansion data;
          product differentiation holds.
        - Could justify paying at or above the last disclosed round once fresh operating data supports the premium.
        - Requires management data room evidence plus independent customer checks.
      - - Base
        - >-
          Traction is real, but public evidence remains strongest on narrative and customer anecdotes rather than
          disclosed unit economics.
        - >-
          Track around the historical unicorn anchor; defer a price-led commitment until diligence closes the
          operating-data gap.
        - Most consistent with the assigned pool today.
      - - Bear
        - >-
          2026 growth or retention fails to support the 2024 mark, or acquisition quality relies too heavily on
          subsidies and marketing-led proof.
        - Expect multiple compression or a down-round relative to the last disclosed valuation.
        - Would become more likely if management cannot provide fresh financials or independent customer outcomes.
    notes: >-
      Scenario framing is directional because the assigned pool supports a historical valuation anchor, not a fresh
      public operating model with precise multiple inputs.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public evidence shows DevRev progressing from a 2020 founding narrative to 2024 financing, 2025 product reframing,
      and 2026 enterprise customer proof.
    data:
      items:
        - date: 2020-10
          label: Company founding window
          detail: Official and independent narrative sources place DevRev's founding in late 2020 / October 2020.
          tone: neutral
          claimRefs:
            - CO004
        - date: '2021'
          label: AI teammate mission framed
          detail: DevRev's about page says the company has been building toward AI that works like a teammate since 2021.
          tone: positive
          claimRefs:
            - CO001
        - date: '2024-07-04'
          label: Public customer references appear
          detail: >-
            The customer page includes an ICICI Prudential Life story dated Jul 4 '24, showing customer-proof publishing
            before the funding announcement.
          tone: positive
          claimRefs:
            - CO015
        - date: '2024-08-09'
          label: Series A closes at unicorn valuation
          detail: DevRev announced a $100.8M Series A at a $1.15B valuation.
          tone: positive
          claimRefs:
            - CO007
        - date: '2025-05-15'
          label: Bolt case study added
          detail: The customer page lists a dated Bolt story, indicating continued public expansion of reference customers.
          tone: positive
          claimRefs:
            - CO015
        - date: '2025-08-28'
          label: SQL-native data-layer narrative published
          detail: >-
            DevRev's technical blog formalized the knowledge-graph, sync, and SQL argument against just-in-time
            federation.
          tone: neutral
          claimRefs:
            - CO013
        - date: '2025'
          label: Computer reported in beta
          detail: >-
            VentureBeat said Computer was in beta for existing customers, with a broader public release planned later in
            2025.
          tone: neutral
          claimRefs:
            - CO014
        - date: '2026-02-11'
          label: BILL deployment case study published
          detail: DevRev published a BILL story tying the platform to enterprise support-automation outcomes.
          tone: positive
          claimRefs:
            - CO016
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The retained pool supports a layered boundary lens for DevRev's addressable market, but not a spend-based
      TAM/SAM/SOM stack.
    data:
      items:
        - label: Fragmented enterprise support-product-engineering workflows
          detail: Outer boundary defined by the cross-functional workflow problem the platform claims to solve.
          note: Broader than help desk alone; narrower than generic CRM or data infrastructure.
        - label: Software teams that need customer signal to flow into engineering work
          detail: Independent and official descriptions repeatedly connect support tickets, product issues, and code context.
          note: This is the clearest supported "core" market in the assigned pool.
        - label: Organizations willing to coexist with incumbent systems first
          detail: >-
            BILL kept Salesforce as its system of record, and official DevRev copy says the platform can co-exist with
            or replace Zendesk, Salesforce Service Cloud, Intercom, and Jira.
        - label: Security- and trust-sensitive enterprise deployments
          detail: BILL required enterprise-grade security, compliance suitability, and measurable ROI before rollout.
        - label: Subsidized startup entry cohort
          value: 12 months free + $10k credits
          detail: >-
            DevRev's startup motion is explicitly limited to funded startups up to Series A via investor-ecosystem
            partners.
        - label: Current public traction proof
          value: 1,000+ customers
          detail: Installed-base evidence supports demand, but it is not equivalent to TAM, SAM, or SOM.
    approximationNotes: >-
      Boundary-lens figure only; numeric labels are limited to directly disclosed public counts and incentives, and the
      figure should not be read as a spend-based market-sizing model.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM008
      - CM010
      - CM011
      - CM012
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal map of where DevRev is trying to compete: broad workflow unification and execution depth
      versus narrower point tools, search substitutes, and build-it-yourself paths.
    data:
      points:
        - label: DevRev unified graph platform
          x: 5
          'y': 5
          note: >-
            Highest plotted breadth because assigned sources describe one graph across support, product, and engineering
            plus workflow execution.
        - label: Salesforce-native support stack
          x: 3
          'y': 3
          note: >-
            Strong execution inside an incumbent system of record, but less evidence in this pool of cross-product
            unification.
        - label: Stitched Zendesk + Jira + feedback stack
          x: 2
          'y': 2
          note: Common status quo with multiple systems and manual context transfer.
        - label: Enterprise search and AI add-ons
          x: 3
          'y': 2
          note: Search-first substitutes can answer questions, but this pool shows less packaged workflow execution depth.
        - label: Internal build / MCP federation
          x: 4
          'y': 2
          note: >-
            Potentially broad because teams can connect many systems, but operational complexity and reliability sit on
            the buyer.
        - label: Point PM or ticketing tools
          x: 2
          'y': 1
          note: >-
            Caplight public comparables imply adjacency, but the assigned evidence does not show the same breadth of
            workflow scope.
      xAxis:
        label: Workflow unification breadth
        min: 1
        max: 5
        low: Point tool or narrow surface
        high: Cross-support, product, and engineering graph
        description: Ordinal synthesis from assigned evidence only; not an external benchmark.
        scale: ordinal
      yAxis:
        label: Operational execution depth
        min: 1
        max: 5
        low: Retrieval or triage only
        high: Acts inside workflows with preserved system context
        description: Higher scores reflect evidenced workflow execution, not market share.
        scale: ordinal
    approximationNotes: >-
      Ordinal positions are synthesized from assigned-source evidence and are intended to compare alternative classes,
      not to state measured market share or benchmark scores.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP008
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests a consultative enterprise motion that converts workflow pain into platform expansion, but
      not into disclosed unit economics.
    data:
      nodes:
        - label: Buyer problem
          detail: Fragmented support, product, and customer data across enterprise systems.
        - label: Entry motion
          detail: Demo-led or proof-of-concept sale with free-trial or startup-credit on-ramps.
        - label: Initial deployment
          detail: Support AI, search, and workflow use cases launched inside enterprise environments.
        - label: Measured outcomes
          detail: Public proof cites resolution-rate, deployment-speed, and cost-savings thresholds.
        - label: Expansion path
          detail: Same data layer can widen into customer 360, product, search, and automation workflows.
        - label: Monetization unknowns
          detail: Realized pricing, gross profit, CAC, and runway are not disclosed in retained sources.
      edges:
        - from: Buyer problem
          to: Entry motion
          label: Need quantified before purchase
        - from: Entry motion
          to: Initial deployment
          label: Pilot or negotiated rollout
        - from: Initial deployment
          to: Measured outcomes
          label: Operational proof
        - from: Measured outcomes
          to: Expansion path
          label: Land-and-expand logic
        - from: Expansion path
          to: Monetization unknowns
          label: Underwriting still needs internal metrics
    approximationNotes: >-
      This bridge reflects public commercial sequencing and does not imply disclosed conversion rates, margin math, or
      value-proportional revenue shares.
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public sources depict DevRev as a layered sync-memory-agent platform rather than a single chatbot feature.
    data:
      layers:
        - label: Experience surfaces
          detail: Computer is exposed through web, in-product, mobile, Slack, Teams, and agent workflows.
          modules:
            - Customer self-service and support channels
            - Slack / Microsoft Teams / desktop surfaces
          outputs:
            - Context-rich conversations and search
          note: Digital surfaces are well evidenced; voice maturity is less visible in the assigned pool.
          tone: positive
        - label: Application layer
          detail: >-
            Public use cases span support automation, enterprise search, product-development workflows, and customer
            self-service.
          modules:
            - Support resolution and enterprise search
            - Product-development and workflow use cases
          outputs:
            - Cross-functional customer, product, and work orchestration
          note: Support is best evidenced; non-support workflows need deeper proof on day-two usage.
          tone: positive
        - label: Agent and workflow layer
          detail: AI agents route, answer, escalate, and update records instead of stopping at retrieval.
          modules:
            - Agent Studio and workflow automation
            - Case updates, routing, and AI-to-human handoff
          outputs:
            - Resolved tickets or human-ready escalations
          note: Action permissions and rollback controls are described, not independently audited here.
          tone: neutral
        - label: Unified memory layer
          detail: Computer Memory / knowledge graph links customer, support, product, and work records.
          modules:
            - Relationship-rich knowledge graph
            - Entity and context unification
          outputs:
            - Single queryable system of record
          note: This is the clearest claimed technical moat versus runtime-federated approaches.
          tone: positive
        - label: Query and analytics layer
          detail: SQL-style querying and conversational analytics sit on top of the unified memory model.
          modules:
            - SQL-backed analytics
            - Natural-language-to-query experiences
          outputs:
            - Answers, reports, and workflow triggers
          note: The public pool supports the architecture claim, not benchmarked query accuracy.
          tone: neutral
        - label: Ingestion and systems of record
          detail: AirSync and connectors sync legacy CRM, support, engineering, and document systems.
          modules:
            - Salesforce, Jira, Zendesk, Slack
            - Google / Microsoft tools and broader connector set
          outputs:
            - Permission-aware synchronized data
          note: Migration speed and connector depth remain more company-claimed than independently validated.
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE010
