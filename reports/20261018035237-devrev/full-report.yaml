chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Assigned public sources consistently frame DevRev as an AI-native enterprise platform rather than a point
              tool. The company’s current message centers on "Native Shared Memory" and a shared system for support,
              product, and engineering work, while its about-page language says the company has been pursuing a human-AI
              teammate model since 2021. Public materials and an independent VentureBeat profile place DevRev’s founding
              in late 2020, which matters because most of the visible scale claims arrive only after the August 2024
              financing. The result is a business that clearly articulates what it wants to replace or consolidate, but
              still depends heavily on company-authored framing for the exact scope of that operating model.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The leadership story is clearer than the governance story. Public sources repeatedly identify Dheeraj
              Pandey and Manoj Agarwal as the founders, with Nutanix pedigrees that help explain DevRev’s emphasis on
              infrastructure-grade reliability and enterprise workflow consolidation. That founder-market fit is a
              genuine reusable fact for later chapters. What the assigned pool does not show, however, is a current
              board roster, committee structure, voting rights, or a clean control map beyond named investors and
              founder leadership. That omission does not negate the company’s progress, but it keeps key-person
              dependence and governance diligence open.
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: Financing, scale, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The strongest hard datapoint in the chapter is the August 2024 Series A announcement: DevRev said it
              raised $100.8 million at a $1.15 billion valuation, and VentureBeat repeated that framing. Third-party
              aggregation pages extend the picture but also introduce precision risk. GetLatka’s public page shows a
              slightly higher $1.2 billion valuation and aggregates total funding at $150.8 million across two rounds,
              while Caplight names a broader investor set without exposing economics or rights. Public scale indicators
              are similarly mixed in quality: DevRev claimed more than 1,000 customers in August 2024, while GetLatka’s
              page reports 809 employees in November 2025 based on LinkedIn-sourced headcount. These are useful signals,
              but not substitutes for audited operating metrics or a full cap-table package.
            claimRefs:
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
