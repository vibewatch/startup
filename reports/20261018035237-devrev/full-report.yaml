companyProfile:
  summary: >-
    DevRev is an AI-native enterprise software company built around a unified knowledge graph that connects product,
    support, engineering, and customer data so teams can operate through one shared system rather than fragmented tools.
    The company positions Computer and its related apps as the operating layer for customer support, product
    development, search, and workflow automation.
  founders:
    - name: Dheeraj Pandey
      role: Co-founder & CEO
      background: Former Nutanix co-founder and CEO; central to DevRev's enterprise-software and founder-led narrative.
      claimRefs:
