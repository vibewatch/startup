  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently describe DevRev as a convergence product rather than a narrow support or
              engineering tool. Gartner frames it as an AI-native platform that unifies product development, customer
              support, and revenue operations, while the Brand Hopper profile expands that boundary to include business
              data and the "DevCRM" concept. Official DevRev materials reinforce that the product can sit beside or
              replace separate systems such as Zendesk, Salesforce Service Cloud, Intercom, and Jira. Taken together,
              that means the market boundary includes support, product, engineering, and adjacent customer-operations
              workflow spend, but excludes generalized CRM, data warehousing, or AI tooling unless those budgets are
              being repurposed to solve this same support-to-engineering coordination problem.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
