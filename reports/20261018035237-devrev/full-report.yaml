  - id: FR001
    title: Residual risk and evidence matrix
    type: matrix
    summary: >-
      The matrix separates observed product or financing exposures from plausible failure paths and material evidence
      gaps; it does not estimate incident probability.
    data:
      columns:
        - Observed exposure
        - Plausible but unquantified
        - Material evidence gap
      rows:
        - label: Data access and write control
          values:
            - label: Cross-system data synchronization and write authority
              tone: risk
            - label: Permission drift or erroneous write propagation
              tone: risk
            - label: Independent control audit and incident history
              tone: risk
        - label: AI quality and governance
          values:
            - label: Vendor-reported 70% resolution proof of concept
              tone: warning
            - label: Unsafe answer or escalation in regulated workflows
              tone: warning
            - label: Query-level error and override denominators
              tone: risk
        - label: Connector reliability
          values:
            - label: Persistent synchronization layer
              tone: neutral
            - label: API throttling, source outage, or stale context
              tone: warning
            - label: Connector SLA and replay evidence
              tone: warning
        - label: Financial capacity
          values:
            - label: Corroborated $100.8M Series A
              tone: neutral
            - label: Scaling cost base and model-inference burden
              tone: warning
            - label: Cash, burn, margin, and runway
              tone: risk
        - label: Customer durability
          values:
            - label: Named regulated-workflow deployment
              tone: neutral
            - label: Promotional adoption may not convert or renew
              tone: warning
            - label: Concentration, NRR, GRR, and churn
              tone: risk
        - label: Public metric quality
          values:
            - label: Corroborated round size and valuation
              tone: neutral
            - label: Conflicting secondary funding totals
              tone: warning
            - label: Unrecorded source for the $100M revenue figure
              tone: warning
    approximationNotes: >-
      Qualitative analyst synthesis from cited evidence; placement reflects potential impact and evidence sufficiency,
      not a measured probability, loss amount, or incident count.
    claimRefs:
      - CR003
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public proof supports tracking the company, but not underwriting the last known valuation from open sources alone.
    data:
      nodes:
        - id: round-anchor
          label: 2024 unicorn round
          detail: Official round at $1.15B; independent market-data pages still anchor public valuation there.
        - id: customer-proof
          label: 2026 customer proof
          detail: BILL and the customer-stories page indicate real enterprise usage and recent case-study activity.
        - id: architecture-edge
          label: Knowledge-graph thesis
          detail: DevRev argues the unified SQL-queryable graph is its durable product differentiator.
        - id: disclosure-gap
          label: Financial disclosure gap
          detail: Assigned sources do not disclose current ARR, NRR, gross margin, burn, or preference stack.
        - id: execution-caution
          label: Execution caution
          detail: 'The Computer desktop landing page still says DOWNLOAD: INCOMING.'
        - id: recommendation
          label: Track / stretched
          detail: Stay engaged, but require private diligence or better price support before underwriting an entry.
      edges:
        - from: round-anchor
          to: customer-proof
        - from: customer-proof
          to: architecture-edge
        - from: architecture-edge
          to: disclosure-gap
        - from: disclosure-gap
          to: execution-caution
        - from: execution-caution
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
