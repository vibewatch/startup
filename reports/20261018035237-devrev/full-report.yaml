  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-impact exposure is architectural rather than a documented incident: DevRev says its platform
              continuously synchronizes enterprise systems into a unified store, while VentureBeat reports that Computer
              can create and update records across those systems. That combination can reduce fragmented workflows, but
              a permission, connector, model, or write-action failure could propagate across sensitive customer and
              operational data. The next tier is execution risk. DevRev is scaling product scope, regulated-workflow
              deployments, and headcount while public evidence for retention, concentration, gross margin, inference
              cost, and runway remains absent. Financing evidence is also inconsistent across secondary sources, so
              funding raised should not be treated as cash available. The resulting stance is high diligence intensity,
              not evidence of a known breach, enforcement action, or customer failure.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR012
              - CR013
              - CR014
