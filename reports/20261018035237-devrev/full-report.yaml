              - CO010
      - number: '1.4'
        title: Milestones and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern in the assigned pool shows a company moving from early platform positioning into
              public financing, broader customer references, and a more explicit Computer narrative. The customer page
              documents dated reference stories from mid-2024 through early 2026, and the BILL case study shows DevRev
              trying to convert support automation wins into enterprise proof. Even so, the biggest unresolved issues
              are not chronology but evidence quality: the pool does not independently verify current revenue, does not
              disclose board composition, and relies on company-authored materials for some of the most aggressive
              outcome claims. Later chapters should treat those as diligence constraints rather than as settled facts.
