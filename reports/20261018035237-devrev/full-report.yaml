              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis vs. anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-valuation case is that DevRev has assembled a differentiated platform story and some enterprise
              proof points. Its architecture pitch centers on a persistent knowledge graph and SQL-queryable data layer,
              and the BILL case study claims a 70% resolution rate on a 200,000-query proof of concept plus savings that
              exceeded a $4.5 million target. The customer-stories page also shows recent 2025-2026 references across
              fintech, AI, healthcare, logistics, and software. The anti-thesis is that the strongest recent traction
              evidence in this pool is still company-authored, while the startup program offers free usage and credits
              for funded companies, which muddies how much of customer growth reflects willingness to pay versus
              incentive-led acquisition. A separate execution caution is visible on DevRev's own Computer desktop
              landing page, which still reads "DOWNLOAD: INCOMING" instead of presenting a finished product surface.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              The upside case is not hard to imagine: if DevRev can convert its recent enterprise case studies into
              independently corroborated, repeatable deployments, a strategic buyer or growth investor could justify
              paying at or above the last disclosed round despite today's disclosure gaps. The base case is more
              mundane: traction appears real, but public evidence still supports tracking execution rather than paying
              forward for unseen economics. The bear case follows naturally from the same missing data. If 2026 growth,
              retention, and margin quality do not validate the 2024 mark, or if new customer additions rely too heavily
              on free or subsidized acquisition programs, the next financing could reset below the prior round. Without
              updated financial disclosure, scenario work should stay directional rather than falsely precise.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Before moving from track to buy, management needs to supply current ARR, net retention, gross margin,
              burn, and cap-table preference detail, plus customer-reference work that is independent of DevRev's own
              marketing surfaces. The core diligence objective is not to re-prove that DevRev has an interesting
              product; the assigned pool already does that. It is to test whether the company can earn into or exceed
              its last known unicorn valuation on durable economics instead of narrative momentum. Thesis-break triggers
              are clear: a new round below the 2024 anchor, inability to produce independent 2026 customer outcomes,
              persistent unfinished commercialization surfaces for flagship products, or evidence that free-credit
              programs are doing more work than product pull in customer acquisition.
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track until the data room catches up with the story'
            body: >-
              DevRev looks strategically differentiated enough to keep in the funnel, but the current public record does
              not justify paying near the last disclosed unicorn valuation without fresh financial and cap-table
              evidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV010
          - type: callout
            title: Primary downside trigger
            body: >-
              If management cannot pair recent customer wins with independent retention, margin, and pricing-quality
              proof, the next financing could reset below the 2024 valuation anchor.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV012
