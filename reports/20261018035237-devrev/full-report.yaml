      - number: '7.4'
        title: Financial execution and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The $100.8 million Series A and $1.15 billion valuation are corroborated by DevRev and SiliconANGLE, but
              public secondary sources disagree on total funding: Growth Engineer lists $186 million, while GetLatka
              reports $150.8 million and SiliconANGLE says more than $150 million. GetLatka separately lists $100
              million of June 2024 annual revenue while stating that its source was not recorded; this is not reliable
              ARR evidence and should not be used to calculate a valuation multiple. The same profile reports headcount
              rising from 554 in December 2024 to 809 in November 2025, which increases execution demands but does not
              reveal burn. Thesis-break triggers are a material permission or write-control failure, sustained connector
              staleness, failure to validate AI accuracy independently in regulated workflows, declining paid conversion
              after credits, or management's inability to provide audited retention, concentration, margin, cash, burn,
              and runway evidence.
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence does not establish a clean incident record
            body: >-
              No regulator, court, incident, or independent audit source was present in the assigned pool. Absence from
              this pool is an evidence gap, not proof that no breach, outage, lawsuit, or enforcement event has
              occurred.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR015
          - type: callout
            title: Gate investment on control and economics evidence
            body: >-
              Require independent security-control evidence, query-level AI quality results, connector reliability,
              customer concentration and retention, and a cash-to-runway bridge before underwriting scale or valuation.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The hardest valuation anchor in the assigned evidence remains DevRev's August 2024 Series A: the company
              said it raised $100.8 million at a $1.15 billion valuation, while Multiples rounds that anchor to $1.1
              billion and still cites it as the current valuation reference. That means public evidence is stale on the
              price side before it is complete on the operating side. None of the valuation-oriented sources in this
              pool discloses a current ARR, gross margin, NRR, or cap-table preference stack, and Caplight's public
              preview keeps deeper filing coverage behind access. The investment view should therefore stay
              price-sensitive: DevRev has enough strategic proof to stay on the track list, but not enough public
              evidence to underwrite a buy at the last unicorn mark without private diligence that closes the financial
              and preference-stack gaps.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
