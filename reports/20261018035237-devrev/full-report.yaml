              - CR016
      - number: '7.2'
        title: Regulatory, security, and AI-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The product's value proposition depends on permission-aware access to structured and unstructured
              enterprise data, plus the ability to execute actions. DevRev describes human-in-the-loop execution,
              monitoring controls, SOC 2 compliance, token-based verification, and PCI-DSS alignment in company-issued
              material. Those are relevant mitigations, but the pool contains no audit report, regulator record, court
              docket, penetration-test result, data-processing assessment, or independent incident history. The BILL
              case study is useful evidence of deployment in a regulated financial environment and reports a 70%
              resolution rate on a 200,000-query proof of concept; it remains vendor-published customer proof rather
              than an independent accuracy or safety audit. Investment diligence should therefore test control
              operation, not infer it from certification labels or the absence of a reported event in this constrained
              source set.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
