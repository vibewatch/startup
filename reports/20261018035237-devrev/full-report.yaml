              - CM004
              - CM005
              - CM008
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain an independent analyst cut that isolates the addressable spend for a
              converged "DevCRM" or support-plus-product-plus-engineering platform, so a classical TAM/SAM/SOM stack
              would be invented rather than supported. What the pool does support is a set of constrained adoption
              lenses: DevRev reported more than a thousand customers after just over a year in market, its startup
              program targets funded startups up to Series A through 80-plus investor groups, and the BILL deployment
              shows that a single enterprise use case can touch hundreds of thousands of downstream business customers
              and millions of end users. Those are useful demand signals, but they are installed-base or go-to-market
              proxies, not market-volume estimates.
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM012
              - CM014
      - number: '2.3'
        title: Buyer, user, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The likely economic buyer is not a single department head buying a point tool; it is a cross-functional
              leader responsible for service operations, product execution, or developer productivity who wants one
              system to connect customer signal to engineering action. Day-to-day users span support engineers, product
              managers, software developers, and enterprise-search users, which is consistent with DevRev's claim to
              collapse multiple fragmented workflows into a single pane of glass. The public customer evidence also
              suggests a staged adoption path: startup adoption is subsidized through free credits and ecosystem
              partners, while enterprise accounts such as BILL adopt first as an overlay that preserves incumbent
              systems of record before broader workflow replacement becomes plausible.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints, and open diligence asks
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver in the pool is workflow unification: every retained official source ties
              DevRev's value to linking customer conversations, tickets, product issues, and code context into one graph
              or system of record. That driver matters because it offers faster answers, lower coordination cost, and
              measurable deflection or cost savings. The strongest counterweight is implementation proof: enterprises
              still need secure integration into deeply embedded incumbents, and they appear to require quantified ROI
              thresholds before approving rollout. BILL's evaluation criteria - deep Salesforce integration,
              enterprise-grade security, and a 30% deflection threshold - are the clearest evidence in this pool of what
              could slow adoption. The remaining gap is structural, not editorial: public sources here do not disclose a
              bottoms-up market model by geography, budget owner, or segment, so those inputs remain a core diligence
              ask for valuation work.
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Convergence is the category thesis
            body: >-
              The cleanest supported market thesis is not "another AI help desk" but a convergence layer that links
              customer support, product management, and engineering work into one operating system.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Market size remains under-evidenced
            body: >-
              Public traction signals are real, but this pool still lacks an independent spend-based TAM/SAM/SOM or
              buyer-budget dataset that isolates how much of adjacent support, product, and customer-ops spend can
              realistically consolidate onto one platform.
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broad competitive frame rather than a single named rival. Third-party
              description pages consistently position DevRev as an AI-native system that unifies customer support,
              engineering, and product workflows, with the incumbent status quo defined as a stitched stack of Zendesk,
              Jira, and separate feedback tools. DevRev's own launch materials widen that set further: the company says
              its stack can co-exist with or replace Zendesk, Salesforce Service Cloud, Intercom, and Atlassian Jira,
              while its public compare hub also targets Glean, Copilot, ChatGPT, Claude, and Fin. Independent public
              comparable coverage is thinner, but Caplight still places Atlassian, Productboard, and Zendesk closest to
              DevRev among public-company-like peers. Taken together, the buyer is not choosing only between help-desk
              vendors; the alternative set spans point tools, incumbent CRMs, search layers, and internal build.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
