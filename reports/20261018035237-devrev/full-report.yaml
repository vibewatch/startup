      - number: '6.3'
        title: Durability, renewal, and concentration are still the largest evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence is stronger on adoption stories than on durability. None of the assigned sources disclose
              DevRev-wide NRR, GRR, churn, renewal rates, contract duration, or top- customer revenue share, so the
              chapter cannot separate logo acquisition from durable expansion economics. DevRev's own unified-data-layer
              post says its Customer 360 agent combines CRM records, support history, usage telemetry, and community
              forum posts, which suggests the product is positioned to support land-and-expand motions and churn
              monitoring. But positioning is not the same thing as published retention performance, and the current
              source pool also lacks independent evidence on failed deployments, material procurement blockers, or
              customer concentration stress. The practical judgment is that DevRev appears to have real adoption
              momentum, but customer quality and revenue durability still need direct diligence rather than inference
              from logos or case-study cadence.
            claimRefs:
