evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-run-rate
    missingEvidence: A current revenue or ARR disclosure with a named source, reporting period, and methodology.
    whyItMatters: >-
      Revenue/run-rate is a required cover metric and directly shapes later financial, customer-quality, and valuation
      analysis.
    diligencePath: >-
      Request board materials or investor-update metrics that disclose current ARR/revenue and reconcile them to billing
      or GAAP revenue.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board roster, committee structure, voting rights, and protective provisions.
    whyItMatters: >-
      Without a governance map, the diligence team cannot properly assess control concentration, founder dependence, or
      investor influence.
    diligencePath: Obtain the latest cap table, board deck, shareholder agreement, and any observer or veto-right schedules.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customer-and-performance-validation
    missingEvidence: Independent validation of customer count, Computer benchmark claims, and BILL-style outcome metrics.
    whyItMatters: >-
      The assigned pool uses company-controlled evidence for some of the strongest traction and performance statements,
      which limits reuse in later judgment calls.
    diligencePath: >-
      Request customer references, renewal/cohort data, benchmark methodology, and third-party implementation evidence
      that can be independently checked.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: investor-rights-detail
    missingEvidence: Round-by-round allocations, ownership percentages, and rights for the publicly named investors.
    whyItMatters: >-
      The public stakeholder map identifies likely material parties but cannot distinguish economic weight from
      governance influence.
    diligencePath: >-
      Collect financing documents and an ownership schedule that tie each named investor to amounts, share classes, and
      governance rights.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent spend-based TAM/SAM/SOM or bottoms-up segment model for converged support-product-engineering
      workflow software.
    whyItMatters: >-
      Spend-based sizing is necessary to judge whether DevRev's category thesis supports venture-scale outcomes without
      relying only on current traction proxies.
    diligencePath: >-
      Obtain an analyst cut, management bottoms-up model, or procurement-backed segment study that isolates the buyer
      budget for this converged workflow category.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: Public evidence naming the actual budget owner, ACV shape, and department that funds enterprise deployments.
    whyItMatters: >-
      Buyer and payer ambiguity directly affects sales-cycle length, expansion logic, and the portion of adjacent
      software budget DevRev can realistically capture.
    diligencePath: >-
      Ask management for customer-level deal archetypes, procurement pathways, and win-loss data split by support,
      product, and engineering sponsors.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: minor
    topic: market-growth
    missingEvidence: Independent growth-rate or CAGR evidence for the specific converged workflow category DevRev is trying to define.
    whyItMatters: >-
      Without category-growth evidence, valuation work has to infer market expansion from adjacent software categories
      rather than the precise one DevRev is pursuing.
    diligencePath: >-
      Pull adjacent analyst reports for customer support, product management, and enterprise-search software, then
      normalize which portions plausibly overlap DevRev's category.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Public or customer-verified enterprise pricing, discounting, and realized ACV data for DevRev and named incumbent
      alternatives.
    whyItMatters: >-
      Without price realization and contract-shape data, it is hard to judge whether DevRev wins on ROI, on breadth, or
      through heavy promotional discounting.
    diligencePath: >-
      Request sample order forms, pricing sheets, and competitive bake-off summaries by segment, then reconcile them
      against renewal and expansion behavior.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: >-
      Independent benchmark or analyst comparison covering DevRev versus Salesforce, Zendesk, Atlassian, Glean, and
      internal build paths on deployment time, answer quality, and workflow execution.
    whyItMatters: >-
      The core moat claim is architectural and operational, but the assigned pool does not contain neutral evidence that
      buyers actually experience that superiority across alternatives.
    diligencePath: >-
      Obtain neutral customer references or analyst evaluations that compare implementation burden, answer quality, and
      operational outcomes across the named competitor classes.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Multi-customer renewal, expansion, and churn evidence showing that DevRev persists after the initial deployment
      and founder-led sale.
    whyItMatters: >-
      A broad declared competitor set matters only if DevRev can keep accounts and expand usage once incumbents answer
      with bundled AI or lower pricing.
    diligencePath: >-
      Ask for cohort retention, NRR, reference calls from overlay deployments, and post-implementation adoption
      dashboards segmented by incumbent environment.
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Booked ARR, recognized revenue, and revenue mix by product, geography, and services versus software.
    whyItMatters: Without a revenue bridge, public traction cannot be converted into revenue quality or durability.
    diligencePath: Request monthly management accounts plus a product-and-segment revenue waterfall for the last 12 months.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, model or infrastructure cost, services mix, CAC, payback, and expansion versus churn data.
    whyItMatters: >-
      These inputs determine whether DevRev's AI-led deployment wins create attractive unit economics or expensive
      service-heavy growth.
    diligencePath: Request cohort margin analysis, fully loaded CAC payback by segment, and NRR or gross retention by cohort.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt or financing obligations, runway, and next-round trigger assumptions.
    whyItMatters: Financing history alone does not show whether the company can fund its operating plan without new capital.
    diligencePath: Obtain the latest board deck, treasury balance, 18-month operating plan, and covenant schedule.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Representative contract terms showing seat, usage, minimum-commit, discounting, and renewal structure for
      enterprise accounts.
    whyItMatters: >-
      Public promotions and customer stories do not reveal realized ASP or the degree of margin support from pricing
      power.
    diligencePath: Review anonymized customer contracts or a pricing approval matrix for recent enterprise deals.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Independent developer-signal for Computer or Turing such as public repositories, package telemetry, benchmarked
      docs/API adoption, or practitioner-community usage.
    whyItMatters: >-
      Without practitioner telemetry or benchmark evidence, it is hard to judge whether the product has durable
      technical pull beyond curated customer stories and vendor-authored materials.
    diligencePath: >-
      Request public repo or package metrics if they exist, or private product telemetry and reference customers that
      actively use docs, APIs, or extensibility in production.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Direct security artifacts such as SOC 2 scope, penetration-test summary, incident or status history, and
      data-residency documentation.
    whyItMatters: >-
      Security claims influence enterprise fit and regulated-market win rates, but the assigned pool only surfaces links
      or company-issued case-study language rather than the underlying artifacts.
    diligencePath: >-
      Obtain trust-center exports, status-history evidence, and customer security questionnaires from DevRev before
      underwriting enterprise readiness.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: implementation-economics
    missingEvidence: >-
      Realized deployment timelines, connector setup burden, and AI-resolution cost curves across comparable production
      customers.
    whyItMatters: >-
      Platform value depends on migration effort and usage-based pricing, which can determine payback more than the
      visible list pricing or top-line automation claims.
    diligencePath: >-
      Request implementation plans and post-go-live KPI reviews from two to three reference customers, including one
      that preserved Salesforce or another incumbent system of record.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: DevRev-wide NRR, GRR, churn, renewal rates, and cohort retention by customer segment.
    whyItMatters: Without retention metrics, the chapter cannot separate logo acquisition from durable expansion quality.
    diligencePath: >-
      Request board or finance reporting with gross and net retention, renewal cohorts, and contract-duration data by
      segment.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-customer revenue share, channel dependence, and any independently reported failed deployments or material
      procurement blockers.
    whyItMatters: >-
      Concentration risk can overturn an otherwise attractive customer list if one or two accounts drive a
      disproportionate share of revenue.
    diligencePath: >-
      Ask for customer concentration schedules, partner-channel mix, churned-account history, and reference calls
      outside the official case-study set.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-status
    missingEvidence: Primary regulator, court, enforcement, patent-office, and jurisdiction-specific legal records for DevRev entities.
    whyItMatters: >-
      Without primary records, this chapter cannot determine whether any legal or regulatory event changes the
      investment risk ranking.
    diligencePath: >-
      Run entity- and founder-level searches with counsel in operating jurisdictions and reconcile results to
      management's litigation, IP, and regulator-correspondence schedules.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: security-incident-history
    missingEvidence: >-
      Independent SOC 2 report, penetration tests, incident and outage logs, security claims history,
      permission-isolation tests, and write-action audit evidence.
    whyItMatters: >-
      Product architecture gives agents access to sensitive synchronized data and the ability to change systems of
      record, increasing the potential impact of a control failure.
    diligencePath: >-
      Review audit exceptions and bridge letters, sample incidents and postmortems, test tenant isolation, and execute
      red-team scenarios for permission drift and unauthorized writes.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration-retention
    missingEvidence: >-
      Revenue by customer and connector, top-customer shares, NRR, GRR, churn, contract duration, renewal cohorts, and
      paid conversion after promotional credits.
    whyItMatters: >-
      Named deployments and promotional adoption do not establish durable recurring revenue or diversified dependence
      across customers and channels.
    diligencePath: >-
      Obtain customer-level recurring-revenue cohorts, renewal files, top-20 concentration, connector usage, and
      startup-program conversion by credit-expiry cohort.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR003
  - type: conflicting-data
    severity: material
    topic: financial-provenance
    missingEvidence: >-
      Audited revenue definitions, financing ledger, cash balance, debt and commitments, burn, runway, gross margin, and
      model-inference cost.
    whyItMatters: >-
      Secondary funding totals conflict, the $100 million revenue figure lacks a recorded source, and funding raised
      does not establish cash available.
    diligencePath: >-
      Reconcile signed financing documents and cap table to bank statements, then tie audited revenue, gross margin,
      inference cost, operating cash flow, and forecast runway to monthly management accounts.
  - type: private-evidence-only
    severity: material
    topic: ai-quality
    missingEvidence: >-
      Independent, query-level AI evaluation with false-resolution, escalation, harmful-answer, override, latency, and
      model-drift rates by regulated workflow.
    whyItMatters: >-
      A vendor-published aggregate resolution rate does not disclose the denominator needed to assess unsafe answers,
      escalations, or performance outside the named deployment.
    diligencePath: >-
      Reproduce the evaluation on blinded production samples, stratify by risk class and model, and require pre-agreed
      accuracy and safety thresholds before expanding write authority.
  - type: missing-source
    severity: material
    topic: disclosure-gap
    missingEvidence: Current ARR, NRR, gross margin, burn, and cohort-level customer expansion metrics as of 2026.
    whyItMatters: >-
      These operating metrics are necessary to judge whether DevRev can earn into or exceed its last disclosed unicorn
      valuation.
    diligencePath: >-
      Request the current board deck or KPI package and reconcile it against billing system extracts and customer cohort
      data.
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current preference stack, liquidation terms, dilution history, and any side letters tied to past financings.
    whyItMatters: >-
      Entry economics can differ materially from headline valuation when preference overhang or unusual investor
      protections are present.
    diligencePath: Review the latest cap table, financing documents, and counsel summary before taking a price-sensitive position.
  - type: missing-source
    severity: material
    topic: customer-roi
    missingEvidence: >-
      Independent 2026 customer references or third-party proof that validates the ROI and deployment claims made in
      company-authored case studies.
    whyItMatters: The recommendation should change only if traction is durable and repeatable beyond marketing-selected examples.
    diligencePath: >-
      Run reference calls with live customers outside DevRev's prepared case studies and confirm ROI, deployment time,
      and renewal behavior.
