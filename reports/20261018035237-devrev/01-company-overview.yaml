      - ["Manoj Agarwal", "Co-founder", "Named across public profiles as technical co-founder.", "Likely material to product and engineering direction; exact equity and governance rights are undisclosed.", "Confirm title, ownership, protective provisions, and retention economics."]
      - ["Khosla Ventures", "Lead investor group", "Named in the Series A announcement and listed by Caplight among notable investors.", "Publicly visible strategic sponsor, but dollar allocation and rights are not disclosed in the pool.", "Request board representation, liquidation preference, pro-rata rights, and information rights."]
      - ["Mayfield Fund", "Lead investor group", "Named in the Series A announcement and listed by Caplight among notable investors.", "Appears central to the syndicate, but public evidence stops short of governance mechanics.", "Confirm board seat, reserved matters, and follow-on support expectations."]
      - ["Param Hansa Values", "Founder-affiliated capital", "Official release names Dheeraj Pandey's family office among backers; Caplight also lists it.", "Economically relevant and potentially important for governance optics because of founder linkage.", "Clarify economics, related-party considerations, and any governance overlap."]
      - ["Lightspeed Venture Partners / FirstU Capital", "Other publicly listed investors", "Caplight lists both as notable investors tied to seed and/or Series A activity.", "Relevant to the syndicate map, but public evidence does not show timing, amounts, or rights.", "Verify participation by round and any special rights or observer seats."]
    notes: "This is a public-evidence stakeholder map, not a definitive cap table; it highlights parties that repeatedly appear in the assigned pool and flags the missing rights package."
    enumerationScope:
      coverage: partial
      basis: "Maps the founders and investors explicitly named in the assigned public sources; public evidence does not include a full cap table or governance schedule."
    claimRefs: [CO005, CO007, CO009, CO010]
