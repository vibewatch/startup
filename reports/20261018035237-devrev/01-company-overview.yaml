schemaVersion: "report-v2"
artifact: "company-overview"
slug: "devrev"
runDate: "2026-10-18"
company:
  name: "DevRev"
chapter:
  number: 1
  title: "Company Overview"
  summary: "DevRev remains a founder-led, AI-native enterprise software company centered on a knowledge-graph architecture and the newer Computer product surface. Public evidence in the assigned pool supports the August 2024 unicorn financing and growing customer-reference set, but governance detail, independently verified revenue, and externally validated performance claims remain materially under-disclosed."
sections:
  - id: "identity-and-positioning"
    title: "Identity and positioning"
    body: "Assigned public sources consistently frame DevRev as an AI-native enterprise platform rather than a point tool. The company’s current message centers on \"Native Shared Memory\" and a shared system for support, product, and engineering work, while its about-page language says the company has been pursuing a human-AI teammate model since 2021. Public materials and an independent VentureBeat profile place DevRev’s founding in late 2020, which matters because most of the visible scale claims arrive only after the August 2024 financing. The result is a business that clearly articulates what it wants to replace or consolidate, but still depends heavily on company-authored framing for the exact scope of that operating model."
    claimRefs: [CO001, CO002, CO004, CO013, CO014]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: "The leadership story is clearer than the governance story. Public sources repeatedly identify Dheeraj Pandey and Manoj Agarwal as the founders, with Nutanix pedigrees that help explain DevRev’s emphasis on infrastructure-grade reliability and enterprise workflow consolidation. That founder-market fit is a genuine reusable fact for later chapters. What the assigned pool does not show, however, is a current board roster, committee structure, voting rights, or a clean control map beyond named investors and founder leadership. That omission does not negate the company’s progress, but it keeps key-person dependence and governance diligence open."
    claimRefs: [CO005, CO006]
    tableRefs: [TO002]
  - id: "financing-scale-and-stakeholders"
    title: "Financing, scale, and stakeholder map"
    body: "The strongest hard datapoint in the chapter is the August 2024 Series A announcement: DevRev said it raised $100.8 million at a $1.15 billion valuation, and VentureBeat repeated that framing. Third-party aggregation pages extend the picture but also introduce precision risk. GetLatka’s public page shows a slightly higher $1.2 billion valuation and aggregates total funding at $150.8 million across two rounds, while Caplight names a broader investor set without exposing economics or rights. Public scale indicators are similarly mixed in quality: DevRev claimed more than 1,000 customers in August 2024, while GetLatka’s page reports 809 employees in November 2025 based on LinkedIn-sourced headcount. These are useful signals, but not substitutes for audited operating metrics or a full cap-table package."
    claimRefs: [CO003, CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO001, TO003]
  - id: "milestones-and-diligence-gaps"
    title: "Milestones and remaining diligence gaps"
    body: "The milestone pattern in the assigned pool shows a company moving from early platform positioning into public financing, broader customer references, and a more explicit Computer narrative. The customer page documents dated reference stories from mid-2024 through early 2026, and the BILL case study shows DevRev trying to convert support automation wins into enterprise proof. Even so, the biggest unresolved issues are not chronology but evidence quality: the pool does not independently verify current revenue, does not disclose board composition, and relies on company-authored materials for some of the most aggressive outcome claims. Later chapters should treat those as diligence constraints rather than as settled facts."
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
