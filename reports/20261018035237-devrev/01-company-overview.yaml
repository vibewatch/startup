      - ["Founded", "Late / Oct 2020", "2020-2024 public profiles", "Medium", "Public narrative is consistent, but the pool does not contain incorporation records."]
      - ["Last funding / valuation", "$100.8M Series A at $1.15B; third-party page also shows $1.2B", "Aug 2024", "Medium", "Round size is stronger than the exact post-money figure because public third-party pages are not perfectly aligned."]
      - ["Total raised", "$150.8M across two rounds", "Current third-party page", "Low", "GetLatka aggregation is useful but the assigned pool does not expose the seed-round source detail."]
      - ["Customers", "1,000+ customers", "Aug 2024", "Medium", "Company claim; no independent customer-count verification in the assigned pool."]
      - ["Headcount", "809 employees; 554 a year earlier", "Nov 2025 / Dec 2024", "Low", "Third-party page cites LinkedIn-sourced headcount rather than a company disclosure."]
