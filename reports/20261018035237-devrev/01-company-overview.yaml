    notes: "Snapshot combines official disclosures with lower-confidence third-party aggregation; cells explicitly flag where the evidence is company-authored or unsupported for reusable diligence."
    claimRefs: [CO003, CO004, CO007, CO008, CO010, CO011, CO012]
  - id: TO002
    title: "Leadership and founder table"
    columns:
      - "Person"
      - "Role"
      - "Background"
      - "Founder-market fit / functional coverage"
      - "Key-person dependency"
    rows:
      - ["Dheeraj Pandey", "Co-founder and CEO", "Previously co-founded and led Nutanix; company release also notes an Adobe board role.", "Anchors enterprise credibility, fundraising narrative, and product vision.", "High: the public story and investor narrative are closely tied to Pandey personally."]
      - ["Manoj Agarwal", "Co-founder", "Former SVP of Engineering at Nutanix.", "Covers engineering and product-delivery credibility for the platform architecture.", "High: the assigned pool identifies him as a core founder but gives limited bench detail beyond the founders."]
    notes: "Assigned public evidence clearly names the founders but does not expose a broader executive bench, board committees, or succession structure."
    enumerationScope:
      coverage: partial
