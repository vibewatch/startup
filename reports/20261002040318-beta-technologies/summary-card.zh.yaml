  topStrengths:
    - 已披露民用储备订单规模庞大，且横跨货运、医疗急救、国防及客运等多类任务场景。
    - 上市公司资产负债表为 BETA 提供了充裕的流动性缓冲，足以支撑适航审定与产线建设投入。
    - 充电网络及相关赋能技术在整机交付之外开辟出第二条变现路径。
    - 2026 年 Q2 收入增长表明，公司在整机取得完整型号合格证之前，已通过项目研发与基础设施建设实现商业化变现。
  topRisks:
    - CX300 与 A250 取得 FAA 适航认证的时间节点，仍是将储备订单转化为确认整机销售收入的核心关卡。
    - 现有公开证据仍无法证实飞机的单机经济模型、客户取消权条款、定金比例或可持续的利润率结构。
    - 相较于当前收入体量，公司估值偏高，对执行层面的任何延误几乎没有容错空间。
    - 客户集中度高且资本开支强度持续偏大，一旦业务增长或适航审定遇阻，可能加剧股权稀释压力。
  unresolvedGaps:
    - CX300 与 A250 取得 FAA 型号合格证的确切时间表，包括当前审定节点能否继续支撑 2026-2027 年的交付预期。
    - 储备订单的转化条款细节，包括定金、取消权、交付排期以及最终落地的飞机单价。
    - 整机与充电业务的单体经济模型，包括各业务线的毛利率、回本周期以及售后维保的持续附带采购率。
    - 最新资本需求状况，包括经营性现金消耗节奏、资本开支，以及未来潜在的债务或融资稀释压力。
