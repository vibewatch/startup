callouts:
  - calloutType: "risk"
    title: "Single-Source Battery Cell Dependency Represents Critical Bottleneck"
    body: "While BETA Technologies has achieved high vertical integration across airframes, electric motors, power electronics, and charging systems, its propulsion energy architecture relies entirely on a single qualified supplier for lithium-ion battery cells. Disruption at this single supplier or yield degradation would immediately halt pack assembly and flight trials."
    claimRefs:
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "Staged CTOL-First Certification Strategy Mitigates Powered-Lift Regulatory Risk"
    body: "By prioritizing conventional takeoff and landing (CTOL) certification under well-established FAA Part 23 rules approximately 12 months following Model H500A motor approval, BETA de-risks cash generation before confronting the more complex and uncertain FAA powered-lift SFAR required for the ALIA A250 VTOL."
    claimRefs:
      - "CR002"
      - "CR003"
