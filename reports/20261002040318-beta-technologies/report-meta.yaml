companyProfile:
  summary: >-
    BETA Technologies is a public aerospace and defense company building electric aircraft, propulsion systems, charging
    infrastructure, and related services for cargo, medical, defense, and regional passenger missions. The company has a
    large disclosed civil backlog, a meaningful installed charging network, and substantial cash, but public evidence
    still leaves certification timing, backlog conversion, and aircraft unit economics unresolved.
