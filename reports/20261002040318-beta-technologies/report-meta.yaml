  topStrengths:
    - Large disclosed civil backlog and broad mission mix across cargo, medical, defense, and passenger use cases.
    - >-
      Public-company balance sheet gives BETA a substantial liquidity cushion for certification and manufacturing
      investment.
    - Charging network and enabling technologies create a second revenue path beyond aircraft deliveries.
    - >-
      Q2 2026 revenue growth shows the company is already monetizing programs and infrastructure before full
      type-certification.
  topRisks:
    - >-
      FAA certification timing for the CX300 and A250 remains the main gate to converting backlog into recognized
      aircraft revenue.
    - >-
      Public evidence still does not establish aircraft unit economics, cancellation rights, deposits, or durable margin
      structure.
    - Valuation is rich relative to current revenue and leaves little room for execution slippage.
    - Customer concentration and continued capital intensity could pressure dilution if growth or certification stalls.
  unresolvedGaps:
    - >-
      Exact FAA type-certification timing for the CX300 and A250, including whether current milestones still support
      2026-2027 delivery timing.
    - >-
      Backlog conversion terms, including deposits, cancellation rights, delivery schedules, and realized aircraft
      pricing.
    - >-
      Aircraft and charging unit economics, including gross margin by stream, payback periods, and recurring aftermarket
      attach rates.
    - Updated capital needs, including the pace of operating cash use, capex, and any future debt or financing overhang.
