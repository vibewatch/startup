    title: "Dual-Track Aircraft Platform De-risks Market Entry"
    body: "By developing the fixed-wing ALIA CX300 alongside the vertical takeoff ALIA-A250, BETA establishes early revenue and accumulates real-world flight hours under standard Part 23 certification before navigating more complex vertical takeoff regulatory requirements."
    claimRefs:
