    title: "Type Certification Schedule and Operational Cash Burn"
    body: "Despite holding $1.48 billion in cash reserves, BETA faces substantial execution risks surrounding FAA witness testing of the H500A motor, while quarterly net losses exceeding $140 million underscore the critical need to achieve type certification without prolonged regulatory delays."
