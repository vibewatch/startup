company:
  name: "BETA Technologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "BETA Technologies is an aerospace and defense company headquartered in South Burlington, Vermont, developing electric and hybrid-electric aircraft platforms alongside a nationwide charging network. Following its November 2025 initial public offering on the NYSE, BETA operates with $1.48 billion in cash reserves, an 891-unit civil aircraft backlog, and active flight operations under the FAA eVTOL Integration Pilot Program."
sections:
  - id: "corporate-identity-governance"
    title: "Corporate Identity, Stage, and Leadership Governance"
    body: "BETA Technologies, Inc. is an aerospace and defense original equipment manufacturer founded in June 2018 in South Burlington, Vermont, by Kyle Clark. The company develops high-performance electric aircraft architectures, proprietary electric propulsion systems, safety-critical avionics, and specialized charging infrastructure. BETA operates as a public company listed on the New York Stock Exchange under the ticker symbol BETA, following the closing of its initial public offering in November 2025 at $34.00 per share. The business is organized around a dual-track aircraft deployment strategy encompassing conventional takeoff and landing (CTOL) and vertical takeoff and landing (VTOL) configurations powered by common subsystems. BETA maintains its principal executive offices and its approximately 188,000 square foot Final Assembly Facility at 1150 Airport Drive in South Burlington, with long-term lease commitments extending through 2097. Governance is characterized by controlled-company status on the NYSE, as founder and CEO Kyle Clark holds 100% of outstanding Class B common stock, representing 40 votes per share and approximately 62.6% of the company's total voting power. The Board of Directors includes independent aerospace, defense, and venture leaders alongside strategic partners from GE Aerospace and early medical aviation sponsor United Therapeutics."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-balance-sheet"
    title: "Capitalization Structure, Scale Metrics, and Balance Sheet"
    body: "BETA Technologies financed its pre-commercial development through successive preferred equity rounds prior to its November 2025 stock market debut. The company closed a $374.9 million Series B financing in April 2022 led by TPG Rise Climate, followed by a Series C financing initiated in October 2024 that raised $318.4 million with Qatar Investment Authority (QIA) and existing stakeholders. In September and October 2025, immediately preceding the public offering, BETA completed a Series C-1 round raising $455.9 million across tranches, anchored by a $300.0 million strategic investment from GE Aerospace and follow-on capital from Ellipse Holdings. The initial public offering delivered gross proceeds of $1.015 billion and net proceeds of approximately $951.7 million, substantially insulating the company's near-term development budget from capital market contraction. As of June 30, 2026, cash and cash equivalents stood at $1,479.5 million, providing liquidity to support manufacturing equipment expansion, production engineering, and flight-test certification campaigns. Operating scale has expanded in parallel: full-time workforce reached 1,008 team members as of December 31, 2025, operating across specialized facilities in Vermont, New York, North Carolina, and Québec. However, post-IPO market performance has mirrored broader pre-revenue aviation headwinds, with shares trading down over 33% from the offering price amid ongoing quarterly operating losses and heavy research and development outlays."
    claimRefs:
      - "CO003"
      - "CO007"
      - "CO008"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "operational-milestones-certification"
    title: "Aircraft Development, Operational Milestones, and Certification Roadblocks"
    body: "BETA's operational flight program centers on its common ALIA aircraft platform, which has accumulated more than 200,000 nautical miles in flight testing across civil and military operating environments. The company's market-entry strategy begins with the ALIA CX300 conventional electric aircraft, targeted at logistics, cargo, and medical transit missions, prior to introducing the ALIA-A250 vertical takeoff and landing variant. In September 2026, BETA commenced flight operations under the joint FAA and U.S. Department of Transportation eVTOL Integration Pilot Program (eIPP) across North Carolina, executing healthcare logistics missions using its fixed-wing electric aircraft and established airport charging network. In parallel, BETA achieved the world's first hybrid-electric flight above 30,000 feet in collaboration with GE Aerospace and NASA, and introduced the MV250 hybrid-electric autonomous aircraft for contested military logistics. Despite cumulative flight milestones and an existing commercial backlog of 891 civil aircraft worth $3.47 billion, execution risks remain concentrated around Federal Aviation Administration type certification. Management and external reporting confirm that while the Hartzell propeller received Part 35 certification in July 2025 and CX300 compliance requirements were accepted, the H500A powertrain faces lingering execution and demonstration hurdles with FAA inspectors, while the A250 introduces complex vertical flight dynamics that require disciplined risk retirement."
