company:
  name: "BETA Technologies"
chapter:
  number: 8
  title: "Valuation"
  summary: "BETA Technologies completed its November 2025 NYSE IPO at a $7.4 billion valuation, raising over $1.1 billion net and holding $1.71 billion in cash as of year-end 2025. However, with first-quarter 2026 net losses of $122.31 million against $10.13 million in revenue and FY2026 revenue guided at $39 million to $43 million, the current valuation prices in aggressive commercial conversion of its $3.9 billion backlog and flawless FAA certification execution."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Core Anti-Thesis"
    body: "The core investment thesis for BETA Technologies rests on its pragmatic dual-platform strategy combining conventional fixed-wing electric aircraft (ALIA CTOL / CX300) and electric vertical takeoff and landing aircraft (ALIA VTOL / A250), supported by an expanding proprietary charging network. Unlike competitors pursuing pure-play air-taxi networks, BETA prioritized near-term cargo, medical transport, and defense applications. This operational prioritization secured a commercial backlog valued at US$3.9 billion covering 991 aircraft across anchor customers including UPS, United Therapeutics, and Blade Urban Air Mobility. The company has flown more than 200,000 nautical miles across flight testing operations and expanded its charging infrastructure to 138 sites by the second quarter of 2026. Conversely, the anti-thesis highlights an intense cash burn profile that remains disconnected from commercial aerospace unit volumes. During the first quarter of 2026, BETA recorded a net loss of US$122.31 million on revenue of just US$10.13 million, following a fiscal year 2025 net loss of $745.87 million on total revenues of $35.62 million. While the company closed 2025 with $1.71 billion in cash and cash equivalents, sustained quarterly operating losses and heavy research and development requirements expose common equity holders to long-term dilution or multiple compression if FAA type certification or commercial deliveries experience extended operational delays."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV011"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "public-valuation-and-financing-context"
    title: "Financing Context, Entry Discipline, and Capital Structure"
    body: "BETA Technologies completed its initial public offering on the New York Stock Exchange in November 2025 under ticker BETA, raising over $1.1 billion in net proceeds at an initial valuation of $7.4 billion. Pre-IPO institutional funding was anchored by a $318 million Series C equity round in October 2024 led by the Qatar Investment Authority alongside Fidelity Management & Research and TPG Rise Climate, followed by a $300 million strategic investment from GE Aerospace in September 2025. Total equity capital raised across the company's lifecycle exceeds $1.6 billion. The capital structure established at the IPO includes a dual-class share architecture: as of March 4, 2026, BETA had 221,249,271 shares of Class A common stock carrying one vote per share and 8,501,484 shares of Class B common stock carrying forty votes per share, beneficially held by founder and CEO Kyle Clark. Pre-IPO preferred stock series were converted into Class A common stock, eliminating historical liquidation preference overhangs that previously totaled hundreds of millions of dollars. However, market pricing imposes stringent entry discipline: market capitalization trades at an enterprise-value-to-revenue multiple exceeding 100x based on management's reaffirmed full-year 2026 revenue guidance of US$39 million to US$43 million. Furthermore, 10-K disclosures emphasize that the company expects to require additional funding through equity or debt offerings as facilities, manufacturing ramp-up, and flight certification programs continue."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV001"
  - id: "valuation-scenarios-and-comparables"
    title: "Scenario Analysis, Peer Comparables, and Final Diligence Asks"
    body: "Evaluating BETA Technologies requires analyzing multi-year execution across three discrete operating scenarios. Under the bull case, early commercial deliveries of the CX300 eCTOL commencing in 2026–2027 accelerate aircraft revenue, enabling rapid conversion of the US$3.9 billion backlog toward consensus targets of $827.3 million in revenue by 2028 and unlocking non-dilutive export credit financing. Under the base case, certification timelines extend moderately, resulting in steady charging infrastructure revenue, defense revenue, and gradual commercial deliveries that reach $367.2 million by 2029 while generating persistent operating losses that necessitate secondary equity issuance. Under the bear case, FAA type-certification delays postpone customer deliveries into 2028 or beyond, cash burn forces substantial equity dilution at compressed multiples, and airline partners cancel deposit-backed pre-orders. When benchmarked against public Advanced Air Mobility peers such as Joby Aviation and Archer Aviation, BETA benefits from diversified cargo, defense, and infrastructure revenue lines, yet trades at high multiples against historical revenue. Diligence must focus on three primary thesis-break triggers: the date of formal FAA type certification for the CX300 and A250, the quarterly cash burn trajectory relative to the $1.71 billion cash cushion, and customer delivery conversion rates from key deposit holders."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV007"
      - "CV008"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
