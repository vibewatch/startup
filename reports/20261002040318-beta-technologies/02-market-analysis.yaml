callouts:
  - calloutType: risk
    title: Backlog Is Not Certified-Aircraft Revenue
    body: The filing combines firm orders and options in backlog and states that certification, performance obligations, milestones, cancellation, modification, or delay can prevent expected revenue. As of December 31, 2025, BETA had not delivered a certified aircraft or recognized associated aircraft revenue.
    claimRefs:
      - CM005
      - CM006
      - CM011
  - calloutType: insight
    title: Infrastructure Is Both Enabler and Product
    body: BETA's charging network reduces an adoption bottleneck while also supporting charger revenue before certified aircraft deliveries. The model therefore spans aircraft, components, infrastructure, and aftermarket services, but that breadth raises execution and capital requirements.
    claimRefs:
      - CM001
      - CM009
      - CM010
      - CM013
