        - Type certification, operating approval, charging access, and order conversion
      - - Medical
        - Medical aviation and healthcare-logistics operators
        - Flight crews and medical-logistics teams
        - Not disclosed in retained evidence
        - Organ transport, medical cargo, and low-acuity transfer
        - Certified aircraft, route approval, reliability evidence, and charging access
      - - Defense
        - U.S. government and military entities
