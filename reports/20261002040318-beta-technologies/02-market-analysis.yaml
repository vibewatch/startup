      - CAGR
      - Methodology
      - Confidence and Limitation
    rows:
      - - Electric and hybrid aircraft TAM
        - BETA 2025 Form 10-K
        - Through 2035
        - Not fully disclosed; certain geographies excluded
        - About 60,000 units / $250B
        - Not provided
        - Public information plus uncommissioned third-party passenger analysis and internal use-case estimates
        - Medium; company estimate without reproducible segment assumptions
      - - Lifetime aftermarket opportunity
        - BETA 2025 Form 10-K
        - Aircraft lifetime
        - Not disclosed
        - About $750B
        - Not provided
        - Estimated at three times initial aircraft-sales value
        - Low-to-medium; utilization, replacement cadence, and pricing are not independently validated
      - - Civil backlog
        - BETA 2025 Form 10-K
        - December 31, 2025
        - Disclosed civil customers, not a market-wide geography
        - 891 aircraft / $3.47B
        - Not applicable
        - 289 firm orders plus 602 options
        - High for the disclosed amount; conversion remains conditional
      - - Updated aircraft backlog
        - Trefis and Simply Wall St
        - Q2 2026
        - Not disclosed
        - 1,001 aircraft / $3.9B
        - Not applicable
        - Secondary summaries of company results
        - Medium; composition and conversion schedule are not provided in retained text
      - - Current monetization and valuation
        - Trefis, Simply Wall St, and Yahoo Finance
        - Q2 to September 23, 2026
        - Company-wide
        - Q2 revenue $14.66M; trailing P/S 126.93
        - Revenue up 146% year over year in Q2, not a market CAGR
        - Reported financial results and market-data snapshot
        - Medium; revenue is not aircraft TAM capture and P/S is date-sensitive
    notes: Values use different periods, populations, and units. TAM, backlog, revenue, and valuation are not additive; no independent SAM or SOM was available in the assigned evidence.
    claimRefs:
