artifact: market-analysis
slug: beta-technologies
runDate: 2026-10-02
company:
  name: BETA Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    BETA defines a broad electric- and hybrid-aircraft opportunity of about 60,000 units and $250 billion through 2035, plus a company-estimated $750 billion lifetime aftermarket opportunity, but it does not disclose an independently reproducible SAM or SOM. Nearer-term evidence is more concrete but still conditional: backlog reached 1,001 aircraft and $3.9 billion in Q2 2026, while certification, order conversion, infrastructure, affordability, and capital intensity remain adoption gates.
sections:
  - id: market-boundary
    title: Market Boundary and Substitute Set
    body: >-
      The investable market is narrower than a generic advanced-air-mobility label. BETA sells or plans to sell aircraft, propulsion systems, replacement batteries, charging equipment, maintenance, training, and digital operating support across cargo and logistics, medical, defense, and passenger missions. Its filing says the TAM excludes unspecified geographies and use cases outside the intended business model, so those omissions cannot be reconstructed as a precise boundary. The practical substitute set remains conventional aircraft and other existing transport methods; the filing does not support treating all short-haul travel or all aerospace spending as addressable. CTOL is the nearer-term wedge because it can use existing airports and procedures, while VTOL expands runway-independent missions but carries additional operating and certification requirements.
    claimRefs:
      - CM001
      - CM004
      - CM007
      - CM014
      - CM016
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Sizing Lenses and Commercial Evidence
    body: >-
      BETA's disclosed TAM is a management estimate rather than an independently auditable market forecast. The company assumes roughly 60,000 electric or hybrid aircraft worth $250 billion through 2035 at about $4 million per aircraft, then adds an estimated $750 billion of lifetime aftermarket value. The filing says the model combines public information, an uncommissioned third-party passenger analysis, and BETA's own cargo, medical, defense, and passenger assumptions. It does not disclose a CAGR, geographic allocation, segment conversion rates, SAM, or SOM. Backlog is a useful demand signal but not realized revenue: the year-end 2025 figure combined 289 firm orders and 602 options, and the filing warns that certification, milestones, cancellation, modification, or delay can prevent conversion.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM006
      - CM008
      - CM009
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyers, Users, Payers, and Adoption Path
    body: >-
      The available evidence identifies customer classes more clearly than budget owners. Commercial aircraft buyers include cargo, medical, airline, leasing, and charter operators; defense demand is purchased by government entities; chargers and ground equipment are sold to operators, fixed-base operators, state governments, and other electric-aviation companies. The filing does not disclose which internal budget holder signs each purchase, procurement-cycle length, or financing terms, so these remain diligence gaps rather than inferred facts. BETA's sequencing is explicit: cargo, logistics, military, and medical applications precede passenger delivery. That path uses lower-complexity or existing operating contexts to build experience, but it still depends on certification, operator approvals, pilot training, insurance, charging access, and customer economics.
    claimRefs:
      - CM004
      - CM007
      - CM010
      - CM011
      - CM012
      - CM014
    tableRefs:
      - TM003
  - id: drivers-and-constraints
    title: Drivers, Constraints, and Valuation Relevance
    body: >-
      Demand evidence strengthened in 2026: independent summaries reported 1,001 aircraft and $3.9 billion of backlog in Q2, and company-issued results said Q2 revenue was supported by GE Aerospace program work and charger deliveries before certified aircraft sales. BETA also reported 138 charging sites and a plan for up to 250 sites through ACES, indicating that infrastructure can be both an adoption enabler and a present revenue line. The counterweight is substantial. As of the 2025 filing, no certified aircraft had been delivered and no associated aircraft revenue recognized. Management warns that safety, noise, affordability, certification, airport changes, insurance, financing, maintenance, and charging costs may slow adoption. A 126.93 trailing price-to-sales ratio reported by Yahoo Finance as of September 23, 2026 increases sensitivity to certification timing and backlog conversion.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM015
tables:
  - id: TM001
    title: Market Definition and Spend Boundary
    columns:
      - Segment
      - Included Spend
      - Exclusions or Status-Quo Substitute
      - Buyer or Payer Evidence
      - Relevance to BETA
    rows:
      - - Cargo and logistics
        - Aircraft, batteries, charging, maintenance, training
        - Conventional aircraft and existing transport methods
        - Cargo and logistics operators; internal budget owner not disclosed
        - Filing identifies this as an initial market-entry priority
      - - Medical
        - CTOL and VTOL aircraft, charging, support products
        - Existing medical cargo and patient-transfer methods
        - Medical aviation and healthcare-logistics operators; payer mechanics not disclosed
        - Firm-order customers are disclosed, but procurement timing is not
      - - Defense
        - Aircraft, propulsion, components, autonomous and hybrid-electric programs
        - Existing military logistics aircraft and mission systems
        - U.S. government and military entities
        - Separate approval pathways may permit test or demonstration missions
      - - Passenger
        - CTOL and VTOL aircraft plus operating support
        - Conventional regional aviation and ground transport
        - Airlines, lessors, and charter operators; budget ownership not disclosed
        - Planned after earlier cargo, medical, and military entry
      - - Enabling technologies
        - Motors, batteries, chargers, ground equipment, maintenance, training, software
        - Third-party components and conventional fueling or support infrastructure
        - Operators, fixed-base operators, state governments, and other aircraft makers
        - Extends revenue opportunity beyond BETA airframes
    notes: The filing names included products and end markets but does not identify its excluded geographies or use cases, customer budget owners, or a complete substitute-spend denominator.
    claimRefs:
      - CM001
      - CM004
      - CM007
      - CM014
      - CM016
