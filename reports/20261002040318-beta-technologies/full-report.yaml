      - number: '8.2'
        title: Financing Context, Entry Discipline, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies completed its initial public offering on the New York Stock Exchange in November 2025
              under ticker BETA, raising over $1.1 billion in net proceeds at an initial valuation of $7.4 billion.
              Pre-IPO institutional funding was anchored by a $318 million Series C equity round in October 2024 led by
              the Qatar Investment Authority alongside Fidelity Management & Research and TPG Rise Climate, followed by
              a $300 million strategic investment from GE Aerospace in September 2025. Total equity capital raised
              across the company's lifecycle exceeds $1.6 billion. The capital structure established at the IPO includes
              a dual-class share architecture: as of March 4, 2026, BETA had 221,249,271 shares of Class A common stock
              carrying one vote per share and 8,501,484 shares of Class B common stock carrying forty votes per share,
              beneficially held by founder and CEO Kyle Clark. Pre-IPO preferred stock series were converted into Class
              A common stock, eliminating historical liquidation preference overhangs that previously totaled hundreds
              of millions of dollars. However, market pricing imposes stringent entry discipline: market capitalization
              trades at an enterprise-value-to-revenue multiple exceeding 100x based on management's reaffirmed
              full-year 2026 revenue guidance of US$39 million to US$43 million. Furthermore, 10-K disclosures emphasize
              that the company expects to require additional funding through equity or debt offerings as facilities,
              manufacturing ramp-up, and flight certification programs continue.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: Scenario Analysis, Peer Comparables, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating BETA Technologies requires analyzing multi-year execution across three discrete operating
              scenarios. Under the bull case, early commercial deliveries of the CX300 eCTOL commencing in 2026–2027
              accelerate aircraft revenue, enabling rapid conversion of the US$3.9 billion backlog toward consensus
              targets of $827.3 million in revenue by 2028 and unlocking non-dilutive export credit financing. Under the
              base case, certification timelines extend moderately, resulting in steady charging infrastructure revenue,
              defense revenue, and gradual commercial deliveries that reach $367.2 million by 2029 while generating
              persistent operating losses that necessitate secondary equity issuance. Under the bear case, FAA
              type-certification delays postpone customer deliveries into 2028 or beyond, cash burn forces substantial
              equity dilution at compressed multiples, and airline partners cancel deposit-backed pre-orders. When
              benchmarked against public Advanced Air Mobility peers such as Joby Aviation and Archer Aviation, BETA
              benefits from diversified cargo, defense, and infrastructure revenue lines, yet trades at high multiples
              against historical revenue. Diligence must focus on three primary thesis-break triggers: the date of
              formal FAA type certification for the CX300 and A250, the quarterly cash burn trajectory relative to the
              $1.71 billion cash cushion, and customer delivery conversion rates from key deposit holders.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Stance and Entry Discipline
            body: >-
              At a post-IPO valuation exceeding $7 billion against 2026 revenue guidance of $39 million to $43 million,
              BETA Technologies is fully priced for flawless execution. Investors should maintain a 'research-more'
              stance, holding off on aggressive equity accumulation until formal FAA type certification is secured for
              the CX300 aircraft and commercial delivery conversion is demonstrated in audited quarterly results.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV007
          - type: callout
            title: Cash Burn and Capital Intensity Sensitivity
            body: >-
              With a first-quarter 2026 net loss of US$122.31 million and FY2025 net loss of $745.87 million, BETA's
              $1.71 billion cash cushion provides roughly 12 to 18 months of aggressive ramp funding before requiring
              external non-dilutive credit facilities or follow-on equity offerings.
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV013
