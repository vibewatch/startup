      - number: '2.2'
        title: Sizing Lenses and Commercial Evidence
        blocks:
          - type: paragraph
            body: >-
              BETA's disclosed TAM is a management estimate rather than an independently auditable market forecast. The
              company assumes roughly 60,000 electric or hybrid aircraft worth $250 billion through 2035 at about $4
              million per aircraft, then adds an estimated $750 billion of lifetime aftermarket value. The filing says
              the model combines public information, an uncommissioned third-party passenger analysis, and BETA's own
              cargo, medical, defense, and passenger assumptions. It does not disclose a CAGR, geographic allocation,
              segment conversion rates, SAM, or SOM. Backlog is a useful demand signal but not realized revenue: the
              year-end 2025 figure combined 289 firm orders and 602 options, and the filing warns that certification,
              milestones, cancellation, modification, or delay can prevent conversion.
