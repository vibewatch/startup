      - number: '6.2'
        title: 'Adoption Proof: Backlog, Pilots, and Named Customers'
        blocks:
          - type: paragraph
            body: >-
              The strongest scale indicator is BETA's 2025 Form 10-K disclosure of an 891-aircraft civil backlog valued
              at $3.47 billion, split between 289 firm orders and 602 options. That headline is not equivalent to
              delivered adoption: BETA defines backlog as firm orders plus options, says agreements generally include
              conditions and deliverables, and states that certain contracts depend on FAA certification. The same
              filing says no certified aircraft had been delivered and no associated revenue recognized. Operational
              evidence has nevertheless advanced beyond logos. BETA reported eIPP flights transporting manufactured
              organs with United Therapeutics; independent local reporting described federal selection for seven of
              eight pilot programs and planned cargo and medical operations with Metro Aviation and the Port Authority
              of New York and New Jersey. Loganair signed a term sheet after Scottish demonstrations, while Surf Air
              announced a 25-aircraft firm order plus 75 options. These are meaningful conversion signals, but they span
              pilots, term sheets, orders, and options rather than a single comparable adoption stage.
            claimRefs:
              - CU002
