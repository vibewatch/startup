              No reviewed source discloses realized aircraft price, discounting, CAC, sales cycle, payback, contribution
              margin per aircraft, battery replacement economics or aftermarket attach rate. A secondary tear sheet's
              $252.1 million 2023 ARR label is not comparable with the 10-K's $15.357 million of 2023 revenue and is
              excluded from underwriting.
            claimRefs:
              - CI002
              - CI003
              - CI012
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
