  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Propulsion Architecture and Powertrain Engineering
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies grounds its aircraft architecture on proprietary electric powertrains engineered to
              maximize reliability and eliminate single points of failure. The flagship Model H500A electric engine
              represents a departure from traditional internal combustion aircraft powerplants, utilizing a direct-drive
              radial-flux permanent-magnet topology configured with a Halbach magnet array and tooth-wound stator. The
              engine delivers up to 573 horsepower (approximately 427 kW) while weighing 165 pounds, yielding a high
              power-to-weight ratio tailored for regional cargo and passenger missions. By integrating dual-redundant
              three-phase windings paired with independent high-voltage inverters, the H500A achieves continuous
              propulsion even during partial inverter failure. BETA has purposely avoided complex gearboxes and liquid
              cooling systems in flight, pursuing thermal simplicity that lowers total operating costs compared to
              legacy turbine aircraft. Technical verification from component-level bench testing through full iron bird
              simulation is conducted using real-time automated test suites to validate airworthiness requirements.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE011
