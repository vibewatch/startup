      - number: '1.2'
        title: Capitalization Structure, Scale Metrics, and Balance Sheet
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies financed its pre-commercial development through successive preferred equity rounds prior
              to its November 2025 stock market debut. The company closed a $374.9 million Series B financing in April
              2022 led by TPG Rise Climate, followed by a Series C financing initiated in October 2024 that raised
              $318.4 million with Qatar Investment Authority (QIA) and existing stakeholders. In September and October
              2025, immediately preceding the public offering, BETA completed a Series C-1 round raising $455.9 million
              across tranches, anchored by a $300.0 million strategic investment from GE Aerospace and follow-on capital
              from Ellipse Holdings. The initial public offering delivered gross proceeds of $1.015 billion and net
              proceeds of approximately $951.7 million, substantially insulating the company's near-term development
              budget from capital market contraction. As of June 30, 2026, cash and cash equivalents stood at $1,479.5
              million, providing liquidity to support manufacturing equipment expansion, production engineering, and
              flight-test certification campaigns. Operating scale has expanded in parallel: full-time workforce reached
              1,008 team members as of December 31, 2025, operating across specialized facilities in Vermont, New York,
              North Carolina, and Québec. However, post-IPO market performance has mirrored broader pre-revenue aviation
              headwinds, with shares trading down over 33% from the offering price amid ongoing quarterly operating
              losses and heavy research and development outlays.
