  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Electric Aviation Competitive Landscape and Alternative Architectures
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape in electric aviation has bifurcated into distinct operational and certification
              architectures. Pure-play electric vertical takeoff and landing (eVTOL) developers such as Joby Aviation
              and Archer Aviation focus primarily on high-density urban air mobility, intra-city airport transfers, and
              passenger air taxi operations navigating the FAA's powered-lift category framework. In contrast, BETA
              Technologies has prioritized an electric conventional takeoff and landing (eCTOL) strategy with its ALIA
              CX300, utilizing standard airport runways under the well-established Part 23 regulatory process for small
              fixed-wing airplanes. This deliberate architectural distinction allows BETA to avoid near-term vertiport
              infrastructure bottlenecks and target commercial middle-mile logistics, medical cargo transport, and
              regional defense applications. Beyond dedicated electric aircraft startups, BETA confronts competition
              from conventional fixed-wing turboprops like the Cessna Caravan, potential internal fleet programs from
              major logistics providers, and established aerospace prime contractors exploring alternative propulsion.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: Competitor Profiles, Operating Scale, and Architectural Trade-Offs
        blocks:
          - type: paragraph
            body: >-
              Evaluating BETA against direct and adjacent competitors reveals divergent technical trade-offs between
              vertical takeoff agility and forward-flight aerodynamic efficiency. The Joby S4 tiltrotor carries four
              passengers and a pilot at cruise speeds up to 200 mph with a 150-mile range, optimized for compact urban
              vertiports, whereas BETA's fixed-wing ALIA CX300 trades vertical agility for a 250-nautical-mile range and
              170 mph cruise speed, accommodating two crew or cargo payloads. While Joby pursues commercial passenger
              shuttles backed by airline partnerships such as Delta Air Lines, BETA anchors its early deployment on
              utility contracts with UPS and United Therapeutics. Meanwhile, traditional aerospace incumbents including
              Textron Aviation, Boeing, and Airbus possess vast manufacturing infrastructure, global service depots, and
              balance sheets that dwarf emerging electric OEMs, representing an enduring long-horizon displacement
              threat if electric propulsion technology matures into standard turboprop replacement.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.3'
        title: Moat Durability, Charging Infrastructure, and Adverse Competition Dynamics
        blocks:
          - type: paragraph
            body: >-
              BETA's defensibility strategy relies on two core pillars: proprietary Enabling Technologies and ground
              charging infrastructure deployment. Rather than functioning as a pure airframe assembler, BETA engineers
              its own H500A electric motors, battery packs, and power electronics, amassing an intellectual property
              portfolio of over 460 issued patents worldwide. Furthermore, BETA has expanded its charging network to 138
              operational locations and partnered with Archer Aviation and Macquarie Capital under the America's
              Consortium for Electric Skyways (ACES) to deploy up to 250 multimodal charging sites. Despite these
              structural strengths, BETA faces severe adverse competitive pressures. The worldwide aircraft market
              remains intensely competitive, with potential market entrants in foreign jurisdictions such as China,
              volatile commercial demand, and the risk that larger competitors with deeper financial reserves may
              commercialize competing platforms or erode BETA's anticipated first-mover advantages.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Divergence in Electric Aviation Strategy
            body: >-
              BETA Technologies' strategic sequencing prioritizes the eCTOL ALIA CX300 before its A250 eVTOL variant. By
              pursuing conventional runway operations first, BETA circumvents the complex municipal vertiport permitting
              hurdles that slow urban air mobility peers, enabling immediate utility operations with cargo and logistics
              partners.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: callout
            title: Resource Disparity Against Traditional Aerospace Conglomerates
            body: >-
              While BETA has established early leadership in electric propulsion and interoperable charging, traditional
              aerospace primes such as Boeing, Airbus, and Textron possess vastly superior manufacturing scale, global
              distribution networks, and established regulatory apparatus that could threaten BETA once the electric
              aviation market matures.
            calloutType: risk
            claimRefs:
              - CP008
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue base is growing, but remains program-led and concentrated
        blocks:
          - type: paragraph
            body: >-
              The audited 2025 base was $35.616 million of total revenue, split between $12.429 million of product
              revenue and $23.187 million of service revenue, versus $15.092 million in 2024. Product growth came from
              motors, batteries, flight-control systems and ground-support equipment; service growth included
              engineering and consulting, charging-station access and government work. Q2 2026 revenue reached $14.7
              million, up 146% year over year, with the reviewed sources attributing the quarter primarily to the GE
              Aerospace EPFD program and Florida charger deliveries. This is commercial traction, but it is not yet
              evidence of scaled aircraft deliveries or recurring ARR. Revenue quality also remains exposed to program
              timing: three disclosed customers each represented more than 10% of 2025 revenue, together accounting for
              48%. Management's reported $3.9 billion aircraft backlog is a demand indicator, not recognized revenue,
              and public evidence does not establish cancellation, deposit, delivery-timing or margin terms for that
              backlog.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI011
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
