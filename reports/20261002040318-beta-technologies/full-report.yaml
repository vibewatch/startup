      - number: '1.3'
        title: Aircraft Development, Operational Milestones, and Certification Roadblocks
        blocks:
          - type: paragraph
            body: >-
              BETA's operational flight program centers on its common ALIA aircraft platform, which has accumulated more
              than 200,000 nautical miles in flight testing across civil and military operating environments. The
              company's market-entry strategy begins with the ALIA CX300 conventional electric aircraft, targeted at
              logistics, cargo, and medical transit missions, prior to introducing the ALIA-A250 vertical takeoff and
              landing variant. In September 2026, BETA commenced flight operations under the joint FAA and U.S.
              Department of Transportation eVTOL Integration Pilot Program (eIPP) across North Carolina, executing
              healthcare logistics missions using its fixed-wing electric aircraft and established airport charging
              network. In parallel, BETA achieved the world's first hybrid-electric flight above 30,000 feet in
              collaboration with GE Aerospace and NASA, and introduced the MV250 hybrid-electric autonomous aircraft for
              contested military logistics. Despite cumulative flight milestones and an existing commercial backlog of
              891 civil aircraft worth $3.47 billion, execution risks remain concentrated around Federal Aviation
              Administration type certification. Management and external reporting confirm that while the Hartzell
              propeller received Part 35 certification in July 2025 and CX300 compliance requirements were accepted, the
              H500A powertrain faces lingering execution and demonstration hurdles with FAA inspectors, while the A250
              introduces complex vertical flight dynamics that require disciplined risk retirement.
            claimRefs:
              - CO002
              - CO004
              - CO010
