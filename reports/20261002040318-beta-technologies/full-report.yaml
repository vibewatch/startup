      - number: '6.3'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish retention in the conventional sense: the assigned sources disclose no
              NRR, GRR, churn, renewal rate, cohort behavior, customer satisfaction measure, or delivered-fleet
              utilization. Instead, durability currently rests on contractual backlog, certification progress,
              operational collaboration, and BETA's intended aftermarket model. The company plans to sell training,
              parts, replacement batteries, and an “energy by the hour” program, while Surf Air's announced pathway adds
              cargo operations, passenger service after certification, charging equipment, and a proposed
              factory-authorized service center. Those expansion paths remain forward-looking until certified deliveries
              and recurring service purchases occur. Concentration is already measurable: BETA reported that the U.S.
              government and United Therapeutics represented 27% and 16% of 2025 revenue, respectively. Investors should
              therefore separate broad order-book logos from realized revenue durability and request customer-level
              deposits, cancellation rights, delivery schedules, repeat purchases, utilization, and aftermarket
              attachment before treating the pipeline as recurring demand.
            claimRefs:
              - CU003
