              - CI004
              - CI016
      - number: '4.3'
        title: Liquidity is substantial, while certification and production remain capital intensive
        blocks:
          - type: paragraph
            body: >-
              BETA spent $398.383 million on 2025 operating expenses, including $259.892 million of R&D, and reported a
              $372.668 million operating loss. Cash used in operating activities was $267.798 million and capital
              expenditures were $45.447 million in 2025; these are separate measures and neither should be replaced by
              accounting loss or adjusted EBITDA. At December 31, 2025, cash and equivalents were $1.710 billion. The
              June 2026 update reported approximately $1.5 billion of cash, Q2 adjusted EBITDA of negative $110 million,
              and full-year guidance of negative $400 million to negative $445 million of adjusted EBITDA plus $150
              million to $200 million of capex. Management also discussed up to $1 billion of additional EXIM financing,
              but the reviewed evidence says timing was not finalized. Existing EXIM debt was already fully drawn at
              $151.3 million of principal net of exposure fees as of year-end 2025, so the proposed facility must not be
              treated as cash available.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
              - CI013
      - number: '4.4'
        title: 'Financial verdict: credible early revenue, unproved scaled economics'
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal is that BETA is already earning revenue from technology programs,
              components, charging and services rather than relying only on future aircraft sales. The limiting signal
              is the scale mismatch: quarterly revenue remains small relative to operating investment, while
              certification, tooling, facilities and production readiness continue to absorb capital. Reported cash
              provides a buffer, but a defensible runway model requires cash-flow forecasts, restricted-cash detail,
              financing terms, working-capital needs and certification-linked spend gates. Underwriting should therefore
              focus on contract conversion rather than headline backlog, and on realized product and service margins
              rather than management's component-margin targets. Current public evidence does not support CAC, payback,
              aircraft contribution margin, recurring-revenue share or a precise next-financing date. The public
              EquityZen page also gates its valuation and financial detail, so it contributes no usable price or
              capital-adequacy datapoint.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Backlog cannot substitute for revenue-quality evidence
            body: >-
              The reported $3.9 billion backlog lacks public detail on cancellation rights, deposits, certification
              conditions, delivery cadence and unit margins, so it should not be converted into revenue or cash-flow
              forecasts without the underlying contracts.
            calloutType: risk
            claimRefs:
              - CI011
          - type: callout
            title: Underwrite to cash flow, not adjusted EBITDA alone
            body: >-
              Require a monthly cash bridge separating operating cash use, working capital, capex, restricted cash and
              financing proceeds before concluding that the reported cash balance provides a specific runway.
