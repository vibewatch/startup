  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Airworthiness Certification, Regulatory Hurdles, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Achieving FAA type certification represents the single most critical gating milestone for BETA
              Technologies, dictating whether its 891-to-991 commercial aircraft order book can convert into realized
              revenue. Under Federal Aviation Regulations Part 23 for normal category airplanes and Part 33 for electric
              aircraft engines, the certification pathway for novel electric powertrains is inherently complex,
              capital-intensive, and prone to regulatory timeline slippage. While BETA achieved special airworthiness
              certification for the CX300 in November 2024 to support test flights and federal demonstrations, full
              commercial type certification of the ALIA CTOL is targeted for approximately 12 months following Part 33
              type certification of its proprietary Model H500A electric motor. The vertical takeoff ALIA A250 faces an
              even more demanding certification schedule under the FAA powered-lift regulatory framework, sequencing
              deliveries further out. Crucially, BETA has not delivered any certified production aircraft, resulting in
              zero recognized aircraft sales revenue. Concurrently, while BETA confirms in its 2025 Form 10-K that it is
              not subject to material pending litigation that would impair business operations, the legal regime
              governing electric aviation presents ongoing compliance exposure. The company must navigate evolving FAA
              airworthiness standards, strict export control regulations under EAR and ITAR for defense-applicable
              technologies, and municipal vertiport zoning restrictions for its charging network.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Manufacturing Ramp, Single-Source Supply Chain, and Quality Risks
        blocks:
          - type: paragraph
            body: >-
              Scaling serial production to a planned capacity of 300 aircraft per year at BETA's 188,000 square foot
              final assembly facility in South Burlington introduces severe operational and industrialization hazards.
              Aerospace manufacturing requires zero-defect quality control, rigorous workforce training, and tight
              coordination across thousands of specialized aerospace-grade components. Despite achieving high vertical
              integration across composite structures, electric motors, inverters, and charging systems, BETA remains
              acutely vulnerable to supply chain disruptions. In particular, BETA relies on third-party suppliers for
              raw materials such as aerospace-grade carbon fiber composites, titanium, and specialized alloys, as well
              as custom-fabricated components. Most critically, while several global manufacturers produce lithium-ion
              cells, BETA has fully qualified only one single-source supplier for the high-energy-density cells that
              power its proprietary battery packs. Failure of this qualified cell supplier to maintain production
              yields, manage thermal runaway safeguards, or fulfill delivery schedules would directly halt aircraft
              assembly and battery module manufacturing. Additionally, approximately 90% of BETA's supplier base is
              located in North America and 9% in Europe, leaving component transit lines exposed to localized
              manufacturing bottlenecks or trade friction. In-service operational reliability and thermal containment
              also represent persistent quality risks, as battery fire or component failure during flight operations
              would trigger immediate regulatory grounding.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Counterparty Concentration, Commercial Conversion, and Capital Runway
        blocks:
          - type: paragraph
            body: >-
              BETA's commercial business model exhibits severe customer concentration and vulnerability to pre-delivery
              contract attrition. In fiscal year 2025, two primary customer relationships generated 43% of total company
              revenue: the U.S. government accounted for 27% ($9.6 million) through defense R&D contracts, while anchor
              customer United Therapeutics accounted for 16% ($5.7 million). Concentration in accounts receivable is
              similarly pronounced, with Customer B representing 38% and Customer A representing 20% of outstanding
              receivables at year-end 2025. Because all commercial aircraft orders—including agreements with UPS, United
              Therapeutics, Surf Air Mobility, and Air New Zealand—remain pre-delivery purchase commitments or
              conditional options, any failure to achieve type certification or meet contracted delivery performance
              specifications could result in order cancellation without financial penalty. Financially, BETA operates
              with extreme capital intensity and substantial operating losses. The company incurred net losses of $276
              million in 2024 and $746 million in 2025, driven by aggressive R&D investments, flight test fleet
              expansion, and manufacturing infrastructure construction. While BETA raised over $1.15 billion in equity
              and completed an initial public offering in late 2025 trading on the NYSE under ticker BETA, sustained
              cash burn will necessitate future capital market access. Volatility in public equity valuations, high
              interest rates, or macroeconomic contractions could significantly increase the cost of capital, diluting
              existing shareholders or forcing capital expenditure retrenchment.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-Source Battery Cell Dependency Represents Critical Bottleneck
            body: >-
              While BETA Technologies has achieved high vertical integration across airframes, electric motors, power
              electronics, and charging systems, its propulsion energy architecture relies entirely on a single
              qualified supplier for lithium-ion battery cells. Disruption at this single supplier or yield degradation
              would immediately halt pack assembly and flight trials.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: Staged CTOL-First Certification Strategy Mitigates Powered-Lift Regulatory Risk
            body: >-
              By prioritizing conventional takeoff and landing (CTOL) certification under well-established FAA Part 23
              rules approximately 12 months following Model H500A motor approval, BETA de-risks cash generation before
              confronting the more complex and uncertain FAA powered-lift SFAR required for the ALIA A250 VTOL.
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for BETA Technologies rests on its pragmatic dual-platform strategy combining
              conventional fixed-wing electric aircraft (ALIA CTOL / CX300) and electric vertical takeoff and landing
              aircraft (ALIA VTOL / A250), supported by an expanding proprietary charging network. Unlike competitors
              pursuing pure-play air-taxi networks, BETA prioritized near-term cargo, medical transport, and defense
              applications. This operational prioritization secured a commercial backlog valued at US$3.9 billion
              covering 991 aircraft across anchor customers including UPS, United Therapeutics, and Blade Urban Air
              Mobility. The company has flown more than 200,000 nautical miles across flight testing operations and
              expanded its charging infrastructure to 138 sites by the second quarter of 2026. Conversely, the
              anti-thesis highlights an intense cash burn profile that remains disconnected from commercial aerospace
              unit volumes. During the first quarter of 2026, BETA recorded a net loss of US$122.31 million on revenue
              of just US$10.13 million, following a fiscal year 2025 net loss of $745.87 million on total revenues of
              $35.62 million. While the company closed 2025 with $1.71 billion in cash and cash equivalents, sustained
              quarterly operating losses and heavy research and development requirements expose common equity holders to
              long-term dilution or multiple compression if FAA type certification or commercial deliveries experience
              extended operational delays.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
