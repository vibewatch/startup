chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Stage, and Leadership Governance
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies, Inc. is an aerospace and defense original equipment manufacturer founded in June 2018
              in South Burlington, Vermont, by Kyle Clark. The company develops high-performance electric aircraft
              architectures, proprietary electric propulsion systems, safety-critical avionics, and specialized charging
              infrastructure. BETA operates as a public company listed on the New York Stock Exchange under the ticker
              symbol BETA, following the closing of its initial public offering in November 2025 at $34.00 per share.
              The business is organized around a dual-track aircraft deployment strategy encompassing conventional
              takeoff and landing (CTOL) and vertical takeoff and landing (VTOL) configurations powered by common
              subsystems. BETA maintains its principal executive offices and its approximately 188,000 square foot Final
              Assembly Facility at 1150 Airport Drive in South Burlington, with long-term lease commitments extending
              through 2097. Governance is characterized by controlled-company status on the NYSE, as founder and CEO
              Kyle Clark holds 100% of outstanding Class B common stock, representing 40 votes per share and
              approximately 62.6% of the company's total voting power. The Board of Directors includes independent
              aerospace, defense, and venture leaders alongside strategic partners from GE Aerospace and early medical
              aviation sponsor United Therapeutics.
