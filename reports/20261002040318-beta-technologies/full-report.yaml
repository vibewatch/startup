            body: >-
              BETA's filing includes both firm orders and options in backlog, warns that agreements can be conditional
              or delayed, and reports no certified-aircraft deliveries or associated revenue. Realized 2025 revenue was
              also concentrated: the U.S. government and United Therapeutics represented 27% and 16%, respectively.
