      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The available evidence identifies customer classes more clearly than budget owners. Commercial aircraft
              buyers include cargo, medical, airline, leasing, and charter operators; defense demand is purchased by
              government entities; chargers and ground equipment are sold to operators, fixed-base operators, state
              governments, and other electric-aviation companies. The filing does not disclose which internal budget
              holder signs each purchase, procurement-cycle length, or financing terms, so these remain diligence gaps
              rather than inferred facts. BETA's sequencing is explicit: cargo, logistics, military, and medical
              applications precede passenger delivery. That path uses lower-complexity or existing operating contexts to
              build experience, but it still depends on certification, operator approvals, pilot training, insurance,
              charging access, and customer economics.
