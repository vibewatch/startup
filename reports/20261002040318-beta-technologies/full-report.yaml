      - number: '4.2'
        title: Multiple monetization paths exist, but aircraft unit economics are not public
        blocks:
          - type: paragraph
            body: >-
              BETA monetizes tangible enabling technologies, engineering and consulting, charging access, sales-type
              leases and government programs before certified aircraft production reaches scale. The company also
              describes future aftermarket revenue from batteries, motors, flight-control systems, maintenance, training
              and charging. The 2025 filing reported $25.715 million of total gross margin in dollars, including $8.426
