        title: Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Demand evidence strengthened in 2026: independent summaries reported 1,001 aircraft and $3.9 billion of
              backlog in Q2, and company-issued results said Q2 revenue was supported by GE Aerospace program work and
