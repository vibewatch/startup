      - number: '5.2'
        title: Modular Energy Storage, Safety, and Manufacturing Traceability
        blocks:
          - type: paragraph
            body: >-
              The energy storage system onboard the ALIA airframe utilizes five identical 45 kWh battery packs, totaling
              225 kWh of installed energy across fifty-five standardized subpack modules. BETA designs and manufactures
              these packs in-house in South Burlington and tests thermal runaway containment at its dedicated St.
              Albans, Vermont test facility. Although an August 2022 thermal runaway incident on a test pack
              demonstrated the operational hazards inherent to high-density lithium-ion cells, containment enclosures
              and isolated module packaging mitigate propagation risk. To ensure compliance with rigorous aerospace
              traceability standards under 14 CFR Part 21 Subpart G, BETA has integrated manufacturing execution systems
              (MES) with enterprise CAD tools, automated torque tools, and pack test fixtures. Digital data platform
              services connect engineering telemetry from design through production, supporting the company's planned
              annual capacity of up to 300 aircraft at its 188,000 square foot final assembly facility.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE009
              - CE010
      - number: '5.3'
        title: Fly-by-Wire Flight Controls, Merchant Components, and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              BETA's avionics backbone centers on triplex-redundant flight control computers (FCCs) running
              safety-critical fly-by-wire software developed up to Development Assurance Level A (DAL-A). The system
              processes inputs from pilot inceptors, inertial units, and air data sensors, commanding flight surfaces
              and propulsion inverters while preparing airframes for future autonomous operations. Beyond proprietary
              aircraft, BETA operates as a merchant supplier across the aerospace and defense sector, licensing its
              flight control computers to Horizon Aircraft for the hybrid-electric Cavorite X7 and supplying pusher and
              lift motors to Embraer-backed EVE Air Mobility. Complementing onboard systems, BETA has deployed a
              multi-modal ground charging network spanning 56 commissioned airport charging stations as of year-end
              2025. Employing the standardized CCS-1 protocol, Charge Cubes and mobile Mini Cubes provide rapid charging
              across both electric aircraft and airport utility vehicles.
            claimRefs:
              - CE009
              - CE010
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE009
              - CE010
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration Derisks Component Supply but Concentrates Engineering Burden
            body: >-
              By developing electric motors, battery packs, and flight control computers in-house, BETA captures
              aftermarket margin and avoids reliance on external aerospace propulsion suppliers. However, this strategy
              forces the company to simultaneously manage multiple FAA certification tracks under Part 33, Part 23, and
              Part 21.17(b), creating high parallel regulatory execution risk.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE009
          - type: callout
            title: High-Voltage Thermal Containment and Regulatory Novelty
            body: >-
              Aviation battery systems operate under extreme discharge cycles during vertical takeoff and climb. The
              August 2022 thermal runaway incident during pack development highlights the safety challenges of
              high-voltage aviation energy storage. Meeting FAA Part 33 Special Conditions requires extensive
              destructive testing to prove passive thermal containment and continued motor rotation without catastrophic
              uncontained failure.
            calloutType: risk
            claimRefs:
              - CE004
              - CE008
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Centers
        blocks:
          - type: paragraph
            body: >-
              BETA addresses four aircraft end markets—cargo and logistics, medical, defense, and passenger—and also
              sells charging equipment to a broader set of airports, fixed-base operators, aircraft operators, other
              advanced-air- mobility manufacturers, and government entities. The buyer and user are not always the same:
              an airline or medical operator may purchase aircraft, pilots and logistics teams use them, airports host
              charging equipment, and regulators determine when missions can move beyond demonstrations. Public evidence
              is strongest for named organizations and intended missions, not for fleet utilization or revenue by
              segment. BETA's filing reported 56 airport or logistics-hub charging installations at year-end 2025, while
              its Q2 2026 release reported 138 charging sites; neither disclosure provides site utilization,
              customer-level revenue, or repeat-purchase behavior. The resulting customer base is strategically broad
              but still requires separate diligence on each segment's payer, procurement cycle, and certification
              dependency.
            claimRefs:
              - CU001
              - CU011
              - CU015
              - CU016
