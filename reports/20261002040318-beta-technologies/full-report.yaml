        - Rare earth magnets and specialized insulated wire windings
        - Thermal overtorque conditions and foreign object ingestion during rough-field operation
      - - Dual Electric Power Inverters
        - Independent motor control switching across dual three-phase stator sections
        - High-speed power semiconductor electronics and gate drivers
        - Electromagnetic interference (EMI) and high-voltage transmission arc faults
      - - Triplex Flight Control Computers (FCC)
        - Triply redundant voting architecture executing fly-by-wire flight law algorithms
        - Air data sensors, pilot sidestick inceptors, and DO-178C DAL-A software modules
        - Complex certification under novel FAA Part 21.17(b) powered-lift flight dynamics
      - - Plex MES & Enterprise Digital Thread
        - Direct capture of torque driver metrics, pack weld data, and BOM traceability
        - Rockwell Automation cloud services, plant Ethernet, and CAD integration
        - IT infrastructure availability and strict aerospace quality management compliance
      - - Real-Time Iron Bird Test Platform
        - Closed-loop hardware-in-the-loop (HIL) simulation for pilot and sensor evaluation
        - Speedgoat target machines, MathWorks Simulink models, and ARINC bus interfaces
        - Model fidelity limits when predicting unmodeled aerodynamic or battery thermal transients
    notes: >-
