  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitute Set
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than a generic advanced-air-mobility label. BETA sells or plans to sell
              aircraft, propulsion systems, replacement batteries, charging equipment, maintenance, training, and
              digital operating support across cargo and logistics, medical, defense, and passenger missions. Its filing
              says the TAM excludes unspecified geographies and use cases outside the intended business model, so those
              omissions cannot be reconstructed as a precise boundary. The practical substitute set remains conventional
              aircraft and other existing transport methods; the filing does not support treating all short-haul travel
              or all aerospace spending as addressable. CTOL is the nearer-term wedge because it can use existing
              airports and procedures, while VTOL expands runway-independent missions but carries additional operating
              and certification requirements.
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM014
              - CM016
