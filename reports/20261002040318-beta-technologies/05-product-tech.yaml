callouts:
  - calloutType: "insight"
    title: "Vertical Integration Derisks Component Supply but Concentrates Engineering Burden"
    body: "By developing electric motors, battery packs, and flight control computers in-house, BETA captures aftermarket margin and avoids reliance on external aerospace propulsion suppliers. However, this strategy forces the company to simultaneously manage multiple FAA certification tracks under Part 33, Part 23, and Part 21.17(b), creating high parallel regulatory execution risk."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE006"
      - "CE009"
  - calloutType: "risk"
    title: "High-Voltage Thermal Containment and Regulatory Novelty"
    body: "Aviation battery systems operate under extreme discharge cycles during vertical takeoff and climb. The August 2022 thermal runaway incident during pack development highlights the safety challenges of high-voltage aviation energy storage. Meeting FAA Part 33 Special Conditions requires extensive destructive testing to prove passive thermal containment and continued motor rotation without catastrophic uncontained failure."
    claimRefs:
      - "CE004"
      - "CE008"
      - "CE012"
