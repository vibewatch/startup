chapter:
  number: 5
  title: "Product & Technology"
  summary: "BETA Technologies has engineered a vertically integrated electric aviation architecture encompassing high-power propulsion motors, modular energy storage packs, safety-critical fly-by-wire flight control computers, and multi-modal ground charging infrastructure. This analysis examines the technical maturity of the ALIA CTOL (CX300) and VTOL (A250) platforms, merchant component sales, digital simulation infrastructure, and remaining FAA airworthiness hurdles."
sections:
  - id: "architecture-and-propulsion"
    title: "Propulsion Architecture and Powertrain Engineering"
    body: "BETA Technologies grounds its aircraft architecture on proprietary electric powertrains engineered to maximize reliability and eliminate single points of failure. The flagship Model H500A electric engine represents a departure from traditional internal combustion aircraft powerplants, utilizing a direct-drive radial-flux permanent-magnet topology configured with a Halbach magnet array and tooth-wound stator. The engine delivers up to 573 horsepower (approximately 427 kW) while weighing 165 pounds, yielding a high power-to-weight ratio tailored for regional cargo and passenger missions. By integrating dual-redundant three-phase windings paired with independent high-voltage inverters, the H500A achieves continuous propulsion even during partial inverter failure. BETA has purposely avoided complex gearboxes and liquid cooling systems in flight, pursuing thermal simplicity that lowers total operating costs compared to legacy turbine aircraft. Technical verification from component-level bench testing through full iron bird simulation is conducted using real-time automated test suites to validate airworthiness requirements."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "energy-storage-and-manufacturing"
    title: "Modular Energy Storage, Safety, and Manufacturing Traceability"
    body: "The energy storage system onboard the ALIA airframe utilizes five identical 45 kWh battery packs, totaling 225 kWh of installed energy across fifty-five standardized subpack modules. BETA designs and manufactures these packs in-house in South Burlington and tests thermal runaway containment at its dedicated St. Albans, Vermont test facility. Although an August 2022 thermal runaway incident on a test pack demonstrated the operational hazards inherent to high-density lithium-ion cells, containment enclosures and isolated module packaging mitigate propagation risk. To ensure compliance with rigorous aerospace traceability standards under 14 CFR Part 21 Subpart G, BETA has integrated manufacturing execution systems (MES) with enterprise CAD tools, automated torque tools, and pack test fixtures. Digital data platform services connect engineering telemetry from design through production, supporting the company's planned annual capacity of up to 300 aircraft at its 188,000 square foot final assembly facility."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "avionics-merchant-supply-and-charging"
    title: "Fly-by-Wire Flight Controls, Merchant Components, and Infrastructure"
    body: "BETA's avionics backbone centers on triplex-redundant flight control computers (FCCs) running safety-critical fly-by-wire software developed up to Development Assurance Level A (DAL-A). The system processes inputs from pilot inceptors, inertial units, and air data sensors, commanding flight surfaces and propulsion inverters while preparing airframes for future autonomous operations. Beyond proprietary aircraft, BETA operates as a merchant supplier across the aerospace and defense sector, licensing its flight control computers to Horizon Aircraft for the hybrid-electric Cavorite X7 and supplying pusher and lift motors to Embraer-backed EVE Air Mobility. Complementing onboard systems, BETA has deployed a multi-modal ground charging network spanning 56 commissioned airport charging stations as of year-end 2025. Employing the standardized CCS-1 protocol, Charge Cubes and mobile Mini Cubes provide rapid charging across both electric aircraft and airport utility vehicles."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE002"
