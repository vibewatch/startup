evidenceGaps:
  - type: missing-source
    severity: material
    topic: FAA Part 23 Final Type Certification Exact Date
    missingEvidence: >-
      Formal FAA Type Inspection Authorization (TIA) completion date and final Type Certificate issuance schedule for
      the ALIA CX300.
    whyItMatters: >-
      Commercial revenue delivery and conversion of firm customer orders depend directly on receiving FAA type
      certification.
    diligencePath: >-
      Review subsequent FAA regulatory registry filings, quarterly earnings calls, and Department of Transportation
      status updates.
    relatedQuestionRefs:
      - QO009
  - id: gap-02
    type: enumeration-incomplete
    severity: minor
    topic: Stakeholder or investor map
    missingEvidence: >-
      Complete cap-table shareholder breakdown detailing exact share ownership percentages for institutional investors
      outside 5% beneficial owners.
    whyItMatters: Full shareholder distribution affects secondary transaction liquidity and post-lockup price volatility.
    diligencePath: Inspect subsequent SEC Schedule 13D/13G filings and institutional investor Form 13F quarterly disclosures.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      Independently reproducible segment-level SAM and SOM with geography, mission, pricing, certification timing, and
      adoption assumptions.
    whyItMatters: >-
      The disclosed TAM mixes aircraft and aftermarket value and cannot establish the serviceable or obtainable
      opportunity.
    diligencePath: >-
      Obtain the underlying consulting analysis and rebuild segment sizing from regulator, fleet, route, and procurement
      data.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Named budget owners, procurement-cycle duration, financing structure, deposit schedule, and approval path for each
      customer segment.
    whyItMatters: Buyer labels do not reveal who controls spend or when backlog can convert into recognized revenue.
    diligencePath: >-
      Review representative contracts and interview procurement owners at cargo, medical, defense, and passenger
      customers.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: backlog-conversion
    missingEvidence: >-
      Reconciled Q2 2026 firm-order and option composition, cancellation rights, milestone schedules, and expected
      certification-linked conversion dates.
    whyItMatters: The 1,001-aircraft headline cannot be translated into revenue timing without order quality and conversion detail.
    diligencePath: Reconcile the Q2 backlog schedule to signed contracts, deposits, milestones, and certification dependencies.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Granular list pricing schedules and discount terms across competing electric aircraft platforms such as Joby S4
      and Archer Midnight versus BETA ALIA CX300.
    whyItMatters: >-
      Direct unit price and operating cost comparisons cannot be fully verified without unredacted customer fleet
      purchase agreements.
    diligencePath: >-
      Review future commercial fleet delivery announcements and operator SEC disclosures as FAA type-certification dates
      approach.
    relatedQuestionRefs:
      - QP001
