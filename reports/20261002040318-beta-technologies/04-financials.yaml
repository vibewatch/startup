      - ["Aftermarket / training / maintenance", "Company presents lifetime aftermarket as a future revenue opportunity", "Unknown", "No attach-rate or cohort-margin disclosure", "Exclude from base case until contract and replacement-cycle evidence is available"]
    notes: "Public evidence does not disclose standardized list prices or realized aircraft pricing; management margin statements are identified as company claims, not independent benchmarks."
    claimRefs: [CI002, CI003, CI012, CI016]
  - id: "TI003"
    title: "Unit economics and capital-adequacy scorecard"
    columns:
      - "Metric"
      - "Reported value / period"
      - "Confidence"
