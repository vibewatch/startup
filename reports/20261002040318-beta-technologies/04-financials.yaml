callouts:
  - calloutType: "risk"
    title: "Backlog cannot substitute for revenue-quality evidence"
    body: >-
      The reported $3.9 billion backlog lacks public detail on cancellation rights,
      deposits, certification conditions, delivery cadence and unit margins, so it
      should not be converted into revenue or cash-flow forecasts without the
      underlying contracts.
    claimRefs: [CI011]
  - calloutType: "recommendation"
    title: "Underwrite to cash flow, not adjusted EBITDA alone"
    body: >-
      Require a monthly cash bridge separating operating cash use, working capital,
      capex, restricted cash and financing proceeds before concluding that the
      reported cash balance provides a specific runway.
    claimRefs: [CI005, CI006, CI008, CI009, CI010]
