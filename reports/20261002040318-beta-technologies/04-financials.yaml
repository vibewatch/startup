company:
  name: "BETA Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    BETA's latest reported quarter showed $14.7 million of revenue against negative
    $110 million of adjusted EBITDA, while management reported approximately $1.5
    billion of cash at June 30, 2026. The evidence supports a diversified early
    revenue model, but not yet durable aircraft economics, predictable backlog
    conversion, or a cash-flow-based runway conclusion.
sections:
  - id: "revenue-base-and-quality"
    title: "Revenue base is growing, but remains program-led and concentrated"
    body: >-
      The audited 2025 base was $35.616 million of total revenue, split between
      $12.429 million of product revenue and $23.187 million of service revenue,
      versus $15.092 million in 2024. Product growth came from motors, batteries,
      flight-control systems and ground-support equipment; service growth included
      engineering and consulting, charging-station access and government work.
      Q2 2026 revenue reached $14.7 million, up 146% year over year, with the
      reviewed sources attributing the quarter primarily to the GE Aerospace EPFD
      program and Florida charger deliveries. This is commercial traction, but it
      is not yet evidence of scaled aircraft deliveries or recurring ARR. Revenue
      quality also remains exposed to program timing: three disclosed customers
      each represented more than 10% of 2025 revenue, together accounting for 48%.
      Management's reported $3.9 billion aircraft backlog is a demand indicator,
      not recognized revenue, and public evidence does not establish cancellation,
      deposit, delivery-timing or margin terms for that backlog.
    claimRefs: [CI001, CI002, CI007, CI011, CI013]
    tableRefs: [TI001]
  - id: "monetization-and-unit-economics"
    title: "Multiple monetization paths exist, but aircraft unit economics are not public"
    body: >-
      BETA monetizes tangible enabling technologies, engineering and consulting,
      charging access, sales-type leases and government programs before certified
      aircraft production reaches scale. The company also describes future
      aftermarket revenue from batteries, motors, flight-control systems,
      maintenance, training and charging. The 2025 filing reported $25.715 million
      of total gross margin in dollars, including $8.426 million from product and
      $17.289 million from service, but those results reflect today's contract mix
      rather than mature aircraft economics. Management stated that component
      margins typically run 40% to 60%, with flight-control computers higher; this
      remains a company claim without contract-level corroboration. No reviewed
      source discloses realized aircraft price, discounting, CAC, sales cycle,
      payback, contribution margin per aircraft, battery replacement economics or
      aftermarket attach rate. A secondary tear sheet's $252.1 million 2023 ARR
      label is not comparable with the 10-K's $15.357 million of 2023 revenue and
      is excluded from underwriting.
    claimRefs: [CI002, CI003, CI012, CI015, CI016]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: "capital-intensity-and-adequacy"
    title: "Liquidity is substantial, while certification and production remain capital intensive"
    body: >-
      BETA spent $398.383 million on 2025 operating expenses, including $259.892
      million of R&D, and reported a $372.668 million operating loss. Cash used in
      operating activities was $267.798 million and capital expenditures were
      $45.447 million in 2025; these are separate measures and neither should be
      replaced by accounting loss or adjusted EBITDA. At December 31, 2025, cash
      and equivalents were $1.710 billion. The June 2026 update reported
      approximately $1.5 billion of cash, Q2 adjusted EBITDA of negative $110
      million, and full-year guidance of negative $400 million to negative $445
      million of adjusted EBITDA plus $150 million to $200 million of capex.
      Management also discussed up to $1 billion of additional EXIM financing, but
      the reviewed evidence says timing was not finalized. Existing EXIM debt was
      already fully drawn at $151.3 million of principal net of exposure fees as
      of year-end 2025, so the proposed facility must not be treated as cash
      available.
    claimRefs: [CI004, CI005, CI006, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: "financial-verdict-and-diligence"
    title: "Financial verdict: credible early revenue, unproved scaled economics"
    body: >-
      The strongest positive signal is that BETA is already earning revenue from
      technology programs, components, charging and services rather than relying
      only on future aircraft sales. The limiting signal is the scale mismatch:
      quarterly revenue remains small relative to operating investment, while
      certification, tooling, facilities and production readiness continue to
      absorb capital. Reported cash provides a buffer, but a defensible runway
      model requires cash-flow forecasts, restricted-cash detail, financing terms,
      working-capital needs and certification-linked spend gates. Underwriting
      should therefore focus on contract conversion rather than headline backlog,
      and on realized product and service margins rather than management's
      component-margin targets. Current public evidence does not support CAC,
      payback, aircraft contribution margin, recurring-revenue share or a precise
      next-financing date. The public EquityZen page also gates its valuation and
      financial detail, so it contributes no usable price or capital-adequacy
      datapoint.
    claimRefs: [CI008, CI009, CI011, CI012, CI013, CI014, CI015]
