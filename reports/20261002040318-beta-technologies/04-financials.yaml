      - "Diligence ask"
    rows:
      - ["Total revenue", "$35.616M FY2025; $14.7M Q2 2026", "Medium", "Shows commercialization progress but remains small relative to spend", "Reconcile quarterly revenue by program, product and customer"]
      - ["Gross margin", "$25.715M in FY2025 as reported in dollars, not a percentage", "Medium", "Current contract mix generated positive gross margin before R&D and G&A", "Provide normalized gross margin by stream and exclude one-time program effects"]
      - ["Adjusted EBITDA", "-$110M Q2 2026; FY2026 guidance of -$400M to -$445M", "Medium", "Signals continued operating investment but is not cash burn", "Provide GAAP-to-non-GAAP bridge and monthly cash forecast"]
      - ["Operating cash use", "$267.798M FY2025", "Medium", "Closest disclosed annual operating cash-consumption measure", "Provide 2026 year-to-date operating cash flow and working-capital bridge"]
      - ["Capital expenditures", "$45.447M FY2025; FY2026 guidance of $150M-$200M", "Medium", "Certification and production scale require capital beyond operating spend", "Provide committed vs. discretionary capex and milestone gates"]
      - ["Cash and financing", "$1.710B cash at Dec. 31, 2025; approximately $1.5B at June 30, 2026; proposed EXIM financing up to $1B not finalized", "Medium", "Liquidity is material, but funding raised or proposed is not identical to cash available", "Provide unrestricted cash, debt covenants, EXIM terms and downside runway"]
      - ["Customer concentration", "2025 customers A, B and D represented 18%, 18% and 12% of revenue", "Medium", "Concentration amplifies program-delay and renegotiation risk", "Identify customers, renewal status, termination rights and 2026 concentration"]
    notes: "Accounting loss, adjusted EBITDA, operating cash use and capex are separate measures; no precise runway is calculated from these non-equivalent figures."
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI008, CI009, CI010, CI013]
