chapter:
  number: 6
  title: "Customers"
  summary: "BETA reports a diversified civil-aircraft backlog and increasingly concrete pilot activity across cargo, medical, and passenger use cases, but its 2025 filing also states that no certified aircraft had been delivered and no associated revenue recognized. Customer durability therefore remains unproven: backlog conversion is certification- and milestone-dependent, retention metrics are undisclosed, and the U.S. government plus United Therapeutics represented 43% of 2025 revenue."
sections:
  - id: "customer-segments"
    title: "Customer Segments and Buying Centers"
    body: >-
      BETA addresses four aircraft end markets—cargo and logistics, medical,
      defense, and passenger—and also sells charging equipment to a broader set
      of airports, fixed-base operators, aircraft operators, other advanced-air-
      mobility manufacturers, and government entities. The buyer and user are
      not always the same: an airline or medical operator may purchase aircraft,
      pilots and logistics teams use them, airports host charging equipment, and
      regulators determine when missions can move beyond demonstrations. Public
      evidence is strongest for named organizations and intended missions, not
      for fleet utilization or revenue by segment. BETA's filing reported 56
      airport or logistics-hub charging installations at year-end 2025, while
      its Q2 2026 release reported 138 charging sites; neither disclosure
      provides site utilization, customer-level revenue, or repeat-purchase
      behavior. The resulting customer base is strategically broad but still
      requires separate diligence on each segment's payer, procurement cycle,
      and certification dependency.
    claimRefs:
      - "CU001"
      - "CU011"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU001"
  - id: "adoption-proof"
    title: "Adoption Proof: Backlog, Pilots, and Named Customers"
    body: >-
      The strongest scale indicator is BETA's 2025 Form 10-K disclosure of an
      891-aircraft civil backlog valued at $3.47 billion, split between 289 firm
      orders and 602 options. That headline is not equivalent to delivered
      adoption: BETA defines backlog as firm orders plus options, says agreements
      generally include conditions and deliverables, and states that certain
      contracts depend on FAA certification. The same filing says no certified
      aircraft had been delivered and no associated revenue recognized.
      Operational evidence has nevertheless advanced beyond logos. BETA reported
      eIPP flights transporting manufactured organs with United Therapeutics;
      independent local reporting described federal selection for seven of eight
      pilot programs and planned cargo and medical operations with Metro Aviation
      and the Port Authority of New York and New Jersey. Loganair signed a term
      sheet after Scottish demonstrations, while Surf Air announced a 25-aircraft
      firm order plus 75 options. These are meaningful conversion signals, but
      they span pilots, term sheets, orders, and options rather than a single
      comparable adoption stage.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-expansion"
    title: "Durability, Expansion, and Concentration"
    body: >-
      Public evidence does not establish retention in the conventional sense:
      the assigned sources disclose no NRR, GRR, churn, renewal rate, cohort
      behavior, customer satisfaction measure, or delivered-fleet utilization.
      Instead, durability currently rests on contractual backlog, certification
      progress, operational collaboration, and BETA's intended aftermarket
      model. The company plans to sell training, parts, replacement batteries,
      and an “energy by the hour” program, while Surf Air's announced pathway
      adds cargo operations, passenger service after certification, charging
      equipment, and a proposed factory-authorized service center. Those
      expansion paths remain forward-looking until certified deliveries and
      recurring service purchases occur. Concentration is already measurable:
      BETA reported that the U.S. government and United Therapeutics represented
      27% and 16% of 2025 revenue, respectively. Investors should therefore
      separate broad order-book logos from realized revenue durability and
      request customer-level deposits, cancellation rights, delivery schedules,
      repeat purchases, utilization, and aftermarket attachment before treating
      the pipeline as recurring demand.
    claimRefs:
      - "CU003"
      - "CU008"
      - "CU010"
      - "CU012"
      - "CU013"
    figureRefs:
      - "FU001"
