      - number: '5.4'
        title: 补充图表
        blocks:
          - type: callout
            title: 垂直一体化摊薄零部件断供风险，但高度积聚研发审查重担
            body: >-
              自主正向研发电动机、电池包与飞控计算机，使 BETA 得以截留后市场高额利润，并摆脱对外部航空推进供应商的采购依赖。但这一垂直整合策略也迫使公司必须在 FAA 框架下同步推进 Part 33、Part 23 与
              Part 21.17(b) 多条适航审定线，积聚了极高的并行监管审批与工程执行风险。
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE009
          - type: callout
            title: 高压热失控防护与新型适航规章适用挑战
            body: >-
              航空电池系统在垂直起降与急剧爬升阶段处于极限放电工况。2022 年 8 月电池包试制阶段出现的热失控起火事件，凸显出高压航空储能系统面临的严峻安全考验。要满足 FAA Part 33
              特别适航条件，必须经受大量破坏性测试，以验证无蔓延被动热阻断能力，确保电池组不发生灾难性非包容性破裂并保障电机持续受控运转。
            calloutType: risk
            claimRefs:
              - CE004
              - CE008
              - CE012
  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 客户细分赛道与采购决策中心
        blocks:
          - type: paragraph
            body: >-
              BETA
              锁定了货运物流、医疗转运、国防军工及客运运营四大整机终端市场，同时向更广泛的机场、固定基地运营商（FBO）、飞机运营商、其他先进空中交通厂商及政府机构销售地面充电设备。采买决策方与实际使用方往往相互割裂：航司或医疗机构出资采购整机，飞行员与后勤团队负责日常执飞与装卸，机场提供场地安放充电设施，而适航监管机构则直接决定测试航线何时能够转入常规商业运营。公开证据中知名机构抬头与预期航线规划较为详实，但在机队实际出勤率与分部门细分收入上披露甚少。BETA
              申报文件披露截至 2025 年末完成 56 处机场或物流枢纽充电站安装，而 2026 年 Q2 财报显示网点增至 138
              处；两次披露均未涉及场站翻台率、单客创收贡献或设备复购情况。由此形成的客群覆盖面虽具备战略纵深，但各板块的出资方资质、招投标采购周期及适航审定依赖度仍须逐项单独展开尽职调查。
