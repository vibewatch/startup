        title: 补充图表
        blocks:
          - type: callout
            title: 独家单一来源电池电芯依赖构成关键供应链卡点
            body: >-
              尽管 BETA Technologies
              在机身机翼、电动机、电力电子与充电系统上实现了高水准的垂直一体化，其动力能源系统却完全依赖独家单一合格供应商供应锂电池电芯。该独家供货方发生任何停产中断或良品率下滑，都会立即使电池包组装与飞行测试陷入停滞。
