      - number: '4.3'
        title: 账面流动性充裕，但适航认证与量产爬坡依然吞噬重资
        blocks:
          - type: paragraph
            body: >-
              BETA 在 2025 年录得营业费用 $398.383 million（其中研发费用高达 $259.892 million），营业亏损达 $372.668 million。2025 年经营活动现金净流出
              $267.798 million，资本性支出为 $45.447 million；两项口径截然不同，均不可直接用账面会计亏损或经调整 EBITDA 取代。截至 2025 年 12 月 31
              日，公司持有现金及现金等价物 $1.710 billion。2026 年 6 月的最新财报披露，现金储备约 $1.5 billion，Q2 经调整 EBITDA 为 -$110 million，全年经调整
              EBITDA 指引为 -$400 million 至 -$445 million，资本开支指引为 $150 million 至 $200 million。尽管管理层提及正争取高达 $1 billion
              的额外进出口银行（EXIM）信贷额度，但既有尽调证据显示落地时间悬而未决。截至 2025 年末，原有的 EXIM 授信额度扣除风险保障费后净本金 $151.3 million
              已全额提取，因此该笔拟议增量信贷绝不能直接视作可用流动性。
