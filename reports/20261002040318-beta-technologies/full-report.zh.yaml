      - number: '2.2'
        title: 市场测算视角与商业化证据
        blocks:
          - type: paragraph
            body: >-
              BETA 披露的 TAM 属于管理层主观测算，而非经独立审计的市场预测。公司假设截至 2035 年全球电动或混动飞机需求约 60,000 架，按单机约 $4 million 均价折算整机市场空间为 $250
              billion，外加约 $750 billion 的全生命周期后市场价值。申报文件说明，该测算模型综合了公开资讯、未受委托的第三方客运分析报告，以及 BETA
              自身对货运、医疗、国防和客运市场的商业假设。文件中未披露复合年增长率（CAGR）、地域分布拆分、各细分场景转化率、可服务市场（SAM）或可获得市场（SOM）。在手订单固然是评估下游需求的有效指标，却不等同于已确认收入：2025
              年末的统计数据由 289 架意向采购确认单（firm orders）与 602
              架选购权（options）构成，且申报文件明确警示，适航取证滞后、交付里程碑未达标、订单取消、条款变更或交付延期均可能导致订单无法转化为实际营收。
