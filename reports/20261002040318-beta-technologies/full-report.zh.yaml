      - number: '5.3'
        title: 电传飞控系统、外售零部件供应链与地面充电机电体系
        blocks:
          - type: paragraph
            body: >-
              BETA 的航电核心架构由三重冗余飞控计算机（FCC）构成，底层运行达到最高研制保证等级 DAL-A
              规范的安全关键型电传飞控软件。系统实时解算飞行员操纵输入、惯导单元与大气数据传感器信号，精准下达指令驱动气动舵面与动力逆变器，同时预留了未来拓展自主飞行的软件接口。除装备自有飞机外，BETA
              还扮演着横跨航空航天与国防领域的第三方一级供应商（merchant supplier）角色，不仅将飞控计算机授权给 Horizon Aircraft 用于混动 Cavorite X7，还向 Embraer 投资的
              EVE Air Mobility 供应推进与升力电机。作为机载硬件的地面延伸，截至 2025 年末，BETA 已投运 56 处机场充电站点组成的地面多模态充电网络。依托通用的 CCS-1 协议标准，固定式
              Charge Cube 与移动式 Mini Cube 兼顾了电动飞机与机场地面保障特种车辆的快速补能需求。
            claimRefs:
              - CE009
              - CE010
              - CE014
              - CE015
              - CE016
