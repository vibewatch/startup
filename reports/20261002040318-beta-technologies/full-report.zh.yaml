      - number: '8.2'
        title: 融资背景、入场安全边际与资本结构
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies 于 2025 年 11 月在纽约证券交易所完成 IPO（股票代码 BETA），以 $7.4 billion 的初始估值募得超 $1.1 billion 的净募集资金。IPO
              前的机构融资由 2024 年 10 月 Qatar Investment Authority 携手 Fidelity Management & Research 及 TPG Rise Climate 领投的
              $318 million Series C 轮定调，随后 GE Aerospace 于 2025 年 9 月战略注资 $300 million。公司自创立以来累计股权融资总额已突破 $1.6
              billion。IPO 确立的股权架构实行双层股权设计：截至 2026 年 3 月 4 日，BETA 拥有 221,249,271 股每股享单票表决权的 Class A 普通股，以及由创始人兼 CEO Kyle
              Clark 实际控制的 8,501,484 股每股享 40 票表决权的 Class B 普通股。IPO 前各期优先股均已强制转为 Class A
              普通股，彻底出清了此前高达数亿美元的历史清算优先权包袱。然而，二级市场交易价格要求投资者严守入场纪律：按照管理层重申的 2026 全年 US$39 million 至 US$43 million
              营收指引测算，其企业价值对营收倍数（EV/Revenue）已高企于 100 倍以上。此外，10-K
              年报明确提示，随着基建设施扩充、制造爬坡及飞行取证项目的持续推进，公司预计仍需通过增发股票或发行债券进行后续融资。
