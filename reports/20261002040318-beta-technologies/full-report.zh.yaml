      - number: '1.3'
        title: 飞机研发进展、运营里程碑与适航认证堵点
        blocks:
          - type: paragraph
            body: >-
              BETA 试飞体系依托通用的 ALIA 飞机平台展开，在民用与军用复杂环境中已累计飞行测试逾 200,000 海里。商业化落地策略明确分步推进：率先推出面向物流、货运与医疗转运的 ALIA CX300
              常规电动飞机，后续再导入 ALIA-A250 垂直起降构型。2026 年 9 月，BETA 加入由 FAA 与美国运输部联合主导的 eVTOL
              整合试点项目（eIPP），在北卡罗来纳州利用固定翼电动飞机与既有机场充电网络执行医疗物流试飞任务。与此同时，BETA 携手 GE Aerospace 与 NASA 完成全球首次突破 30,000
              英尺高度的油电混合动力飞行，并面向高对抗军事后勤场景推出 MV250 油电混动自主飞行器。尽管累积了扎实的飞行数据，且手握 891 架、总值 $3.47 billion
              的民用客机商业订单，核心执行风险依然高度集中于联邦航空管理局（FAA）型号合格证（TC）认证。管理层与外部公开报告显示，虽然 Hartzell 螺旋桨已于 2025 年 7 月取得 Part 35 认证且
              CX300 符合性审查基础获得确认，但核心 H500A 动力总成在 FAA 审查官员的验证试飞与合规取证环节仍存执行堵点，且 A250 构型涉及复杂的垂直飞行气动特性，必须有条不紊推进风险出清。
