      - number: '4.4'
        title: 财务研判结论：早期商业变现可信，规模化经济模型待验
        blocks:
          - type: paragraph
            body: >-
              最明确的正面信号在于，BETA
              已经通过技术研发项目、零部件销售、充电网络和工程服务获得真实营收，而非全然押注遥遥无期的整机销售。核心制约因素则在于体量错配：相较于庞大的运营研发投入，单季度营收规模依然微小，适航认证、工装模具制造、产线扩建及量产筹备环节持续吞噬巨额资本。账面披露的现金提供了缓冲垫，但建立可信的现金流跑道模型，必须穿透现金流预测、受限资金明细、债权融资条款、营运资本缺口以及与适航审定挂钩的分阶段支出控制节点。因此，投资研判应紧盯订单合同的实际转化率而非博眼球的总储备金额，紧盯已兑现的产品与服务毛利而非管理层宣传的零部件毛利目标。现有公开资料完全不足以支撑推导出
              CAC、回收期、单机边际贡献率、经常性收入占比或确切的下轮融资时间节点。此外，公开的 EquityZen 页面对估值与财务明细设限，无法提供任何具备参考价值的交易价格或资本充足率数据。
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
