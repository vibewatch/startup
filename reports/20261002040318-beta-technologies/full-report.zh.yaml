        title: 补充图表
        blocks:
          - type: callout
            title: 双轨飞机平台降低市场准入风险
            body: >-
              并行研发固定翼 ALIA CX300 与垂直起降 ALIA-A250，使 BETA 得以依托成熟规范的 Part 23
              审定基础率先跑通早期商业化收入并积累实际飞行小时数，从而大幅摊平应对后续更严苛垂直起降适航监管的综合难度。
            calloutType: insight
            claimRefs:
              - CO002
              - CO004
              - CO014
          - type: callout
            title: 型号认证时间表与运营现金消耗
            body: >-
              尽管坐拥 $1.48 billion 充裕现金储备，BETA 推进 FAA 对 H500A 电机的现场目击测试仍面临重大执行考验；单季度净亏损逾 $140 million
              的现实，进一步凸显出必须按期完成型号审定、遏制监管拖延周期的紧迫性。
