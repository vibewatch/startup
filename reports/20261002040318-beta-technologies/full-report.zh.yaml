  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 电动航空竞争格局与不同技术构型路线
        blocks:
          - type: paragraph
            body: >-
              电动航空领域的竞争格局已明显分化为截然不同的运营场景与审定架构路线。Joby Aviation 与 Archer Aviation
              等纯粹专注电动垂直起降（eVTOL）的厂商，主要押注高密度城市空中交通（UAM）、市内机场接驳与载人空中出租车市场，依托 FAA 的动力升力（powered-lift）审定大纲推进取证。相比之下，BETA
              Technologies 凭借 ALIA CX300 确立了以电动常规起降（eCTOL）为先的战略路径，依托成熟完备的小型固定翼飞机 Part 23 规章直接复用标准机场跑道。这一技术构型取向使 BETA
              有效规避了早期垂直起降场（vertiport）基建缺位的死结，率先发力商业中途物流、医疗急救物资运输及区域国防保障等公用场景。除专研电动飞机的初创同行外，BETA 还要直面以 Cessna Caravan
              为代表的传统固定翼涡桨飞机、大型物流巨头潜在的自建自研机队规划，以及探索替代动力方案的传统航空航天总承包商（primes）的全面竞争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: 竞品画像、运营规模与架构取舍
        blocks:
          - type: paragraph
            body: >-
              对比 BETA 与其直接或周边竞品，可见垂直起降机动灵活性与平飞气动效率之间的技术取舍大相径庭。Joby S4 倾转旋翼机可搭载 4 名乘客与 1 名飞行员，巡航时速达 200 mph，航程 150
              英里，专为空间逼仄的城市起降场地优化；而 BETA 的固定翼 ALIA CX300 则舍弃了垂直起降能力，换取 250 海里航程与 170 mph 巡航时速，可容纳 2
              名机组人员或全货舱载荷。商业策略上，Joby 绑定 Delta Air Lines 等干线航司重点布局商用客运摆渡，BETA 则将早期落地锚定在 UPS 与 United Therapeutics
              的实用物流合同上。与此同时，Textron Aviation、Boeing 和 Airbus
              等传统航空巨头坐拥庞大的制造体系、遍布全球的服务维修网络和新兴电动主机厂不可比拟的资产负债表规模；一旦电推进技术成熟并演进为替代传统涡桨发动机的通用方案，传统巨头将构成极其深远的长期颠覆威胁。
