      - number: '8.3'
        title: 情景推演、同业对标与尽调核心求证事项
        blocks:
          - type: paragraph
            body: >-
              研判 BETA Technologies 需要对未来数年的跨周期执行力进行三套独立情景推演。在乐观情景（Bull Case）下，CX300 eCTOL 于 2026–2027
              年开启早期商业化交付并加速整机收入确认，带动 US$3.9 billion 在手订单快速兑现，推动 2028 年营收触达市场一致预期的 $827.3
              million，同时激活非稀释性出口信贷融资。在基准情景（Base Case）下，适航审定进度轻微滞后，充电桩基建与国防收入维持稳步增长，商业化交付渐进展开，至 2029 年营收达到 $367.2
              million，但持续的经营性亏损将倒逼二级市场配售增发股票。在悲观情景（Bear Case）下，FAA 型号合格证延期导致客户交付被迫推迟至 2028
              年甚至更晚，现金失血迫使公司在极低估值倍数下被迫进行大规模股权融资稀释，合作航司亦因延期退订附带定金的预售订单。对比 Joby Aviation 与 Archer Aviation
              等已上市的先进空中交通同行，BETA 具备货运、国防及充电基建等多线变现优势，但相比历史营收仍处极高估值溢价。投研跟踪必须聚焦三大核心投资逻辑证伪指标：CX300 与 A250 正式斩获 FAA
              型号合格证的确切日期、对照 $1.71 billion 现金垫的单季失血走势，以及重点定金客户的交付履约转化率。
            claimRefs:
