        title: 补充图表
        blocks:
          - type: callout
            title: 在手订单不等于已取证整机销售收入
            body: >-
              申报文件将确认订单与意向选购权一并计入在手订单储备，并明确强调适航审定、履约义务达成、交付里程碑兑现、合同解约、条款变更或工期延误均可能导致预期收入无法确认。截至 2025 年 12 月 31 日，BETA
              从未交付过任何取证机型，亦未确认过任何整机销售收入。
            calloutType: risk
