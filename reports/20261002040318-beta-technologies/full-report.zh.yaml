          - type: callout
            title: 面对传统航空航天集团的资源体量劣势
            body: >-
              虽然 BETA 在电推进与互联互通充电领域建立了早期领先地位，但 Boeing、Airbus 和 Textron
              等传统航空航天总承包商掌控着压倒性的量产规模、遍布全球的销售渠道与深谙适航审定运作的成熟组织机制；一旦电动航空市场步入成熟期，这些优势将对 BETA 形成巨大竞争压迫。
