  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品集合
        blocks:
          - type: paragraph
            body: >-
              可投资的目标市场远比宽泛的「先进空中交通」（AAM）标签狭窄。BETA
              已经或计划在货运物流、医疗、国防及客运场景中销售飞机、推进系统、备用电池组、充电设备、维保、培训以及数字化运营支持服务。申报文件明确指出，TAM
              排除了特定未披露的地理区域以及超出其既定商业模式的用例，因此外界无法反向推定出严密的市场边界。现实中的替代品集合仍以传统飞机和既有地面/航空运输手段为主；申报文件并不支持将所有短途出行或全部航空航天支出划入可触达市场。CTOL
              构型是更具确定性的近期切入点，因其可直接复用现有机场设施与空域运营规程；VTOL 虽能拓展无需跑道的任务场景，却伴随更严苛的运行条件与适航认证门槛。
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM014
              - CM016
