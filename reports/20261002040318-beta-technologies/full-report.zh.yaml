      - number: '2.3'
        title: 买方群体、使用方、付款方与落地路径
        blocks:
          - type: paragraph
            body: >-
              现有公开材料能清晰梳理出客户类别，但对预算决策归属方的穿透依然有限。民用飞机买方覆盖货运、医疗、航司、租赁商及包机运营商；国防需求由政府防务机构采购；充电桩与地面支持设备则销往运营商、固定基地运营商（FBO）、州政府及其他电动航空初创公司。申报文件未披露每单交易的内部预算签字主体、采购决策周期或具体融资方案，此类细节属于尽调盲区，不可凭空推断。BETA
              的商用路径规划非常明确：货运、物流、军用及医疗场景的交付优先于载人客运。这一策略旨在利用业务复杂度较低或既有的运行场景快速积累运营经验，但依然深度受制于适航取证进度、运营商运营许可批复、飞行员改装培训、商业保险覆盖、充电网点布局以及客户实际运营账本能否跑通。
            claimRefs:
