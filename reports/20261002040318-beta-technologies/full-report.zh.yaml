      - number: '5.2'
        title: 模块化储能系统、热失控防护与制造全流程溯源
        blocks:
          - type: paragraph
            body: >-
              ALIA 机载储能系统由 5 组规格相同的 45 kWh 电池包组成，内部划分为 55 个标准化子模块，全机装机总电量达 225 kWh。BETA
              在南伯灵顿基地自主设计与组装上述电池包，并在佛蒙特州圣奥尔本斯专用测试基地展开热失控阻断验证。尽管 2022 年 8
              月测试包发生的热失控事故暴露出高能量密度锂电池固有的运行隐患，但特制防爆封装壳体与物理隔绝式模块设计有效抑制了热失控扩散风险。为严格满足 14 CFR Part 21 Subpart G
              规章对航空级可追溯性的严苛要求，BETA 打通了制造执行系统（MES）与企业级 CAD 设计工具、自动化扭矩工具及电池包测试工装的底层互联。数字化平台服务贯通了从工程设计到量产落地的全链路遥测数据，为
              188,000 平方英尺总装工厂规划的每年最多 300 架整机产能构筑起制造管控支撑。
            claimRefs:
              - CE006
