      - number: '2.4'
        title: 驱动因素、制约瓶颈与估值关联度
        blocks:
          - type: paragraph
            body: >-
              2026 年需求端证据进一步夯实：第三方独立汇总报告显示，Q2 在手订单攀升至 1,001 架、估值 $3.9 billion；公司官方财报指出，在取得适航证前，Q2 营收主要依靠 GE Aerospace
              合作项目款项与充电桩设备交付拉动。BETA 另披露已建成 138 处充电网点，并规划依托 ACES 联盟将网络扩充至 250
              处，证明充电基建既是扫清商业化落地的使能工具，也是现阶段的实质创收管线。但制约因素同样不容忽视。截至 2025
              年申报文件，公司尚未交付任何一架完成取证的量产机，亦未确认任何整机销售收入。管理层提示，安全性争议、噪音限制、购置成本、适航审批进度、机场基础设施改造、保险费率、融资难度、维保与充电成本均可能延缓市场渗透。雅虎财经数据显示，截至
              2026 年 9 月 23 日公司滚动市销率（P/S）为 126.93，估值对适航审定节奏和在手订单转化率的敏感度被急剧放大。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
