            body: >-
              优先依托成熟的 FAA Part 23 规章推进常规起降（CTOL）适航审定（排定在 Model H500A 电机获批后约 12 个月），使 BETA 在必须面对 ALIA A250 VTOL
              涉及的更复杂且充满变数的 FAA 动力升力特别联邦航空规章（SFAR）前，提前为商业化造血与现金流回笼排除了重大阻碍。
