      - number: '4.2'
        title: 商业化变现路径多元，但整机单位经济效益尚未公开
        blocks:
          - type: paragraph
            body: >-
              在取证整机实现规模化量产前，BETA
              依托核心使能硬件、工程咨询服务、充电桩网络运营、销售型租赁及政府防务合同提前实现商业变现。公司还描绘了涵盖电池梯次更换、电机维修、飞控电脑升级、售后定检、飞手培训与持续充电的未来后市场创收蓝图。2025
              年申报文件披露总毛利额为 $25.715 million（其中产品毛利 $8.426 million，技术服务毛利 $17.289
              million），但这仅仅反映了现阶段定制化研发合同的核算结果，绝非成熟量产飞机的单位经济模型。管理层宣称核心零部件毛利率通常达 40% 至
              60%，飞控系统甚至更高；该说法目前纯属单方表述，缺乏合同层面的穿透佐证。现有全部公开来源均未披露实际成交机价、折扣折让、获客成本（CAC）、销售周期、投资回收期、单机边际贡献、电池置换生命周期成本或后市场渗透附着率（attach
              rate）。某二级研报所谓的「2023 年 ARR 达 $252.1 million」与 10-K 经审计的 2023 年总营收 $15.357 million 存在根本冲突，故在尽调估值中予以剔除。
