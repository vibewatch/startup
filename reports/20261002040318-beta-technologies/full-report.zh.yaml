    summary: 从 2018 年创立到 2026 年商业与防务飞行部署的关键公司治理、融资、适航审定及运营里程碑。
    data:
      items:
        - date: '2018-06-01'
          label: 创立与设计
          detail: Kyle Clark 在佛蒙特州南伯灵顿创立 BETA Technologies，启动电动飞机设计。
          claimRefs:
            - CO001
        - date: '2019-12-01'
          label: Agility Prime 项目
          detail: 与美国空军合作启动电动航空研究，累计获得超 $50M 防务资金支持。
          claimRefs:
            - CO001
            - CO007
        - date: '2021-03-16'
          label: 双重股权结构
          detail: 设立拥有超级表决权的 B 类股，为创始人 Kyle Clark 锁定 62.6% 投票控制权。
          claimRefs:
            - CO001
            - CO005
        - date: '2022-04-04'
          label: B 轮融资
          detail: 由 TPG Rise Climate 领投完成 $374.9M 融资，用于建设伯灵顿总装设施。
          claimRefs:
            - CO007
            - CO013
        - date: '2022-08-15'
          label: 电池包着火测试
          detail: 测试前准备阶段发生热失控事件；成功隔离处置，未造成人员伤亡。
          claimRefs:
            - CO016
        - date: '2023-01-01'
          label: 知识产权诉讼和解
          detail: 在针对 Blue Force Technologies 的诉讼中赢得即决判决；获得和解金及永久知识产权。
          claimRefs:
            - CO001
        - date: '2024-10-24'
          label: C 轮融资
          detail: 完成由 Qatar Investment Authority (QIA) 联合领投的 $318.4M 成长股权融资。
          claimRefs:
            - CO007
            - CO013
        - date: '2025-07-16'
          label: 螺旋桨获 FAA 认证
          detail: Hartzell Propeller 获得 FAA Part 35 适航认证，验证首款电动飞机螺旋桨。
          claimRefs:
            - CO014
        - date: '2025-09-30'
          label: GE Aerospace 战略投资
          detail: 完成 C-1 轮融资，获得 GE Aerospace 的 $300M 投资并建立涡轮发电机合作关系。
          claimRefs:
            - CO007
            - CO013
        - date: '2025-11-04'
          label: 纽交所 IPO
          detail: 以股票代码 BETA 在纽交所上市，发行价每股 $34.00，募集资金总额 $1.015B。
          claimRefs:
            - CO003
            - CO007
        - date: '2026-05-16'
          label: 上市治理与股价下挫
          detail: 披露高管薪酬方案，同期股价较 IPO 发行价下跌 33%。
          claimRefs:
            - CO008
            - CO015
        - date: '2026-06-30'
          label: 2026Q2 业务扩张
          detail: 公布二季度营收 $14.7M（同比增长 146%），持有现金储备 $1.48B，运营 138 处充电站。
          claimRefs:
            - CO004
            - CO007
            - CO011
        - date: '2026-08-12'
          label: MV250 亮相与高空纪录
          detail: 推出油电混合防务飞机，并携手 GE Aerospace 完成 30,000 英尺以上高空飞行。
          claimRefs:
            - CO002
            - CO014
        - date: '2026-09-17'
          label: FAA eIPP 试飞启动
          detail: 在联邦 eVTOL 整合试点计划（eIPP）下，于北卡罗来纳州启动实际医疗转运飞行。
          claimRefs:
            - CO002
            - CO014
    approximationNotes: 里程碑日期反映公开公司文件中记录的准确申报日期、新闻稿发布日期或合同签署日期。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO007
      - CO010
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 商业化证据阶梯
    type: pyramid
    summary: 公司预估的市场机遇位于顶层，下方逐层收窄为在手订单与已实现收入指标。
    data:
      items:
        - label: 整机市场机遇
          value: 60000
          unit: aircraft
          detail: 公司预估截至 2035 年的电动及混动飞机 TAM
        - label: 飞机销售总额
          value: 250
          unit: USD billions
          detail: 按约 $4M 平均售价测算的公司预估截至 2035 年销售额
        - label: 全生命周期后市场
          value: 750
          unit: USD billions
          detail: 涵盖电池、零部件、维修保养、培训及充电业务的公司估算值
        - label: 2025 民用订单
          value: 891
          unit: aircraft
          detail: 截至 2025 年 12 月 31 日拥有 289 架确认订单加 602 架意向订单
        - label: 2026Q2 在手订单
          value: 1001
          unit: aircraft
          detail: 第三方渠道报道的 $3.9B 在手订单
        - label: 2026Q2 营收
          value: 14.66
          unit: USD millions
          detail: 收入包括 GE Aerospace 项目工作及充电桩交付
    approximationNotes: 各层级为不可比证据层，具有不同单位、周期与分母；条块宽度不可视作转化率，亦不暗含 SAM 或 SOM。
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM006
      - CM008
      - CM009
  - id: FP001
    title: 竞争定位象限：航程对比垂直机动性
    type: quadrant
    summary: 评估电动与传统飞机在运营航程及跑道灵活性维度的定位。
    data:
      points:
        - label: BETA ALIA CX300
          x: 85
          'y': 20
        - label: Joby S4
          x: 45
          'y': 90
        - label: Archer Midnight
          x: 35
          'y': 85
        - label: BETA ALIA A250
          x: 80
          'y': 80
        - label: Cessna Caravan (Turboprop)
          x: 95
          'y': 10
        - label: 轻型支线直升机
          x: 25
          'y': 95
    approximationNotes: X 轴代表有证据支持的实际航程（0=50 英里以下，100=250 英里以上）。Y 轴代表垂直机动性与垂直起降场起降能力（0=依赖跑道，100=紧凑型城市 VTOL）。
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP006
  - id: FI001
    title: 客户业务到再投资的商业模式传导图
    type: flow
    summary: 当前商业模式在大规模适航认证与量产投资前，将合作项目、零部件交付与充电服务转化为产品和服务收入。
    data:
      nodes:
        - id: customer-activity
          label: 客户与政府业务
          detail: 技术项目、工程开发、零部件订单、充电桩部署与接入网络
        - id: contract-mechanism
          label: 合同履约机制
          detail: 固定总价、成本加成、里程碑节点、用量计费、租赁或特定时点交付条款
        - id: reported-revenue
          label: 产品与服务营收
          detail: FY2025 录得产品收入 $12.429M 及服务收入 $23.187M
        - id: delivery-cost
          label: 直接交付成本
          detail: 原材料、人工、分包商及可计入制造费用
        - id: gross-margin
          label: 毛利率（按毛利额口径）
          detail: FY2025 在扣除运营费用前录得毛利 $25.715M
        - id: reinvestment
          label: 适航审定与量产投资
          detail: 研发、工程开发、工装夹具、厂房设施与商业化基础设施
    approximationNotes: 此图为机制传导路径图，非比例瀑布图；各项数值保留其报告周期，不推断转化率。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI016
  - id: FE001
    title: BETA Technologies 垂直整合电动飞机系统架构
    type: stack
    summary: 六层架构技术栈，展示支持 ALIA 飞机平台的硬件、软件、动力与地面基础设施。
    data:
      layers:
        - label: 地面基建与 GSE 层
          detail: 在 56 处已投运机场站点部署采用 CCS-1 充电协议的 Charge Cube 与 Mini Cube 充电站
        - label: 储能与热管理层
          detail: 5 个 45 kWh 电池包合计 225 kWh，包含 55 个标准化子模组并采用 St. Albans 无源热防护
        - label: 电推进与动力总成层
          detail: H500A 型直驱径向磁通电动机重量 165 磅输出 573 马力，配备双独立三相逆变器
        - label: 航电与飞控层
          detail: 三重冗余电传飞控计算机，运行符合 DO-178C DAL-A 等级的飞行控制律
        - label: 机身结构集成层
          detail: 精简机身设计，摒弃复杂机械齿轮箱、飞行液冷系统及推力矢量关节
        - label: 数字全生命周期运营层
          detail: BETA Operate 数据平台、Rockwell Plex MES 总装追溯及 Speedgoat 实时 HIL 仿真系统
    approximationNotes: 展示飞机与地面支持设备的功能子系统分层，不代表物理线束几何布局。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: 客户采纳与业务拓展历程
    type: journey-map
    summary: 既有证据支持从试飞演示到附条件订单的阶段性路径；唯有在适航审定并交付后，方可拓展服务与后市场业务。
    data:
      items:
        - label: 任务选定
          detail: 运营商确定适配 BETA 飞机及充电生态的货运、医疗、防务或客运任务。
          touchpoints:
            - 任务规划
            - 基础设施评估
        - label: 飞行验证
          detail: 试飞项目与联邦试点计划在客户实际运行环境中验证飞行器性能。
          touchpoints:
            - eIPP 试飞
            - 货运与医疗验证
        - label: 商业意向
          detail: 客户可签署条款清单、确定订单或选购权，履约约束力各不相同。
          touchpoints:
            - 条款清单
            - 确定订单
            - 选购权
        - label: 适航取证节点
          detail: 部分交付合同取决于 FAA 适航认证与其他交付前履约义务。
          touchpoints:
            - 合规里程碑
            - 制造里程碑
        - label: 交付与运营
          detail: 取证后交付、付费运营、执飞频次与机队利用率，是规模化应用目前缺失的核心验证指标。
          touchpoints:
            - 飞行器交付
            - 航线利用率
        - label: 拓展与后市场
          detail: BETA 计划在机队部署后，补充培训、航材备件、电池、充电及按飞行小时计费能源服务。
          touchpoints:
            - 维保与培训
            - 电池更换
            - 充电服务
    approximationNotes: 本图属于分析性推演序列，非实测转化漏斗。公开渠道未披露各阶段转化率、客户群组划分或阶段间隔时间。
    claimRefs:
      - CU003
      - CU008
      - CU012
      - CU013
  - id: FR001
    title: BETA Technologies 核心风险评估矩阵
    type: matrix
    summary: 从发生概率、影响严重程度、缓解措施成熟度与剩余投资敞口切入，评估关键监管、供应链、财务、客户及运营风险。
    data:
      columns:
        - 类别
        - 发生概率
        - 影响严重程度
        - 缓解措施成熟度
        - 剩余风险敞口
