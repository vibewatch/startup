            title: 电动航空战略中的架构路线分歧
            body: >-
              BETA Technologies 采取阶段化落地节奏，将 eCTOL 构型的 ALIA CX300 置于 A250 eVTOL 变体之前。率先主打常规跑道起降，使 BETA
              绕开了掣肘城市空中交通同行的繁琐市政垂直起降场批复手续，从而能够第一时间携手货运与物流客户投入实用场景运作。
