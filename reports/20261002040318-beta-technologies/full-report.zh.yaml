      - number: '7.3'
        title: 核心客户交易对手方集中、商业订单转化落空与流动性跑道隐忧
        blocks:
          - type: paragraph
            body: >-
              BETA 的商业化模式呈现出极高的客户集中度，且在飞机正式交付前极易遭受合同履约流失。2025 财年，两大核心客户联手贡献了公司总营收的 43%：其中美国政府依托防务研发合同贡献 27%（$9.6
              million），基石客户 United Therapeutics 贡献 16%（$5.7 million）。应收账款的集中风险同样严峻，截至 2025 年末，客户 B 占应收账款总额的 38%，客户 A 占
              20%。鉴于全部商业客机订单（包括与 UPS、United Therapeutics、Surf Air Mobility 及 Air New Zealand
              签署的协议）本质上均为交付前意向承诺或附带先决条件的选购权，一旦型号合格证延宕或无法达到合同规定的飞行性能技术指标，客户可直接单方撤单且无需承担违约罚金。财务端，BETA
              具备典型的极高资本密集度与巨额营业亏损特征。在激进的研发开支、试验机队扩充及产线扩建驱动下，公司 2024 年与 2025 年分别录得净亏损 $276 million 和 $746 million。虽然 BETA
              成功募集超 $1.15 billion 股权资金并于 2025 年底在纽交所敲钟上市（代码
              BETA），但持续的高失血率决定了公司未来必须持续从资本市场再融资。二级市场估值波动、高利率环境或宏观经济收缩均会急剧拉高资金成本，从而大幅稀释既有股东权益，或倒逼公司缩减资本开支。
