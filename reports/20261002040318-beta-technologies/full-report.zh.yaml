chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 法律主体、发展阶段与治理架构
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies, Inc. 是一家航空航天与国防原始设备制造商（OEM），由 Kyle Clark 于 2018 年 6
              月在佛蒙特州南伯灵顿创立。公司专注于高性能电动飞机架构、专有电推进系统、高安全等级航电系统以及专用充电基础设施研发。2025 年 11 月，BETA 以每股 $34.00
              的价格完成首次公开募股，在纽约证券交易所挂牌上市，股票代码为 BETA。公司采用双轨机型落地战略，依托通用子系统同步推进常规起降（CTOL）与垂直起降（VTOL）两种构型。BETA 总部与约 188,000
              平方英尺的总装工厂均坐落于南伯灵顿 Airport Drive 1150 号，长期租赁协议已锁定至 2097 年。治理层面，因创始人兼 CEO Kyle Clark 独家持有已发行 Class B 普通股的
              100%（每股享 40 票投票权，约占公司总投票权的 62.6%），公司在纽交所界定为控股股东控制型受控企业。董事会成员除航空、国防及风投领域的独立董事外，还引入了来自战略伙伴 GE Aerospace
              以及早期医疗航空资助方 United Therapeutics 的代表。
