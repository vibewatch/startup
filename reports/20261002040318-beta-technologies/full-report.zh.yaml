  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 营收规模保持增长，但仍依赖单一项目驱动且高度集中
        blocks:
          - type: paragraph
            body: >-
              经审计的 2025 年营业总收入为 $35.616 million，其中产品销售收入 $12.429 million，技术服务收入 $23.187 million，较 2024 年的 $15.092
              million 大幅攀升。产品收入增长主要由电机、电池、飞控系统及地面保障设备交付驱动；技术服务收入则包括工程咨询、充电网络服务费及政府防务研发课题。2026 年 Q2 营收达 $14.7
              million，同比激增 146%，多份权威材料指出该季度收入主要由 GE Aerospace EPFD 合作项目里程碑以及佛罗里达州充电桩交付拉动。商业化已经露出起色，但尚不能视作量产机规模交付或高确定性
              ARR 跑通的佐证。收入质量受项目交付节奏影响剧烈：2025 年前三大单一客户营收占比均超 10%，三者合计占总营收的 48%。管理层对外宣称的 $3.9 billion
              飞机在手订单储备仅是需求强弱的风向标，而非已确认收入；公开资料从未证实该订单储备中的违约金条款、定金沉淀、交付时间排期或单机毛利结构。
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI011
              - CI013
