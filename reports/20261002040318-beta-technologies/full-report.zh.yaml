      - number: '1.2'
        title: 资本结构、业务规模指标与资产负债表
        blocks:
          - type: paragraph
            body: >-
              2025 年 11 月登陆资本市场之前，BETA Technologies 主要依托连续多轮优先股融资支持商业化前研发。2022 年 4 月，公司完成由 TPG Rise Climate 领投的 $374.9
              million Series B 轮融资；随后于 2024 年 10 月启动 Series C 轮，从 Qatar Investment Authority (QIA) 及现有股东处募集 $318.4
              million。紧随其后的 2025 年 9 月至 10 月 IPO 前夕，BETA 分批完成 $455.9 million 的 Series C-1 轮融资，由 GE Aerospace 战略领投 $300.0
              million，Ellipse Holdings 跟投。首次公开募股募资总额达 $1.015 billion，扣除发行费用后净额约 $951.7
              million，为近期研发预算构建了充裕的流动性安全垫，有效对冲资本市场收缩。截至 2026 年 6 月 30 日，公司账面现金及现金等价物为 $1,479.5
              million，足以支持产线设备扩建、量产工程及试飞适航取证。运营规模同步扩张：截至 2025 年 12 月 31 日，全职员工增至 1,008
              人，分布在佛蒙特州、纽约州、北卡罗来纳州及魁北克省的专业化基地中。然而，受持续季度运营亏损与高强度研发支出拖累，公司上市后股价承压，较发行价跌幅逾 33%，直观反映出商业化前航空板块普遍面临的估值回调压力。
