  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 适航审定合规、监管壁垒与法律合规敞口
        blocks:
          - type: paragraph
            body: >-
              取得 FAA 型号合格证（TC）是关乎 BETA Technologies 商业化成败最关键的核心卡点，直接决定其 891 至 991
              架商业飞机订单能否最终转化为真金白银的销售收入。依据美国联邦航空规章面向常规类飞机的 Part 23 与面向航空电动机的 Part
              33，全新电推进架构的审定路径极具复杂性与高资本消耗特征，极易发生监管审定工期延宕。尽管 BETA 于 2024 年 11 月取得了 CX300 的特许适航证以支撑科研试飞与联邦示范项目，但 ALIA CTOL
              商业型号合格证的全流程获批，计划在 Model H500A 电动机取得 Part 33 型号合格证后约 12 个月完成。垂直起降构型的 ALIA A250 在 FAA
              动力升力审定规则下更面临极其严苛的合规考核，商用交付节点排期更加靠后。最为关键的是，BETA 至今未交付过任何取证量产飞机，整机销售收入依然挂零。与此同步，虽然 BETA 在 2025 年 Form 10-K
              中确认当前并无可能实质损害业务运营的重大未决诉讼，但电动航空领域的法律法规体系仍带来持续的合规敞口。公司必须审慎应对瞬息万变的 FAA 适航审定新规、面向涉军技术出口受制于 EAR 和 ITAR
              的严厉管制条例，以及充电网络布局中各地方市政对起降空域与垂直起降场的土地规划限制。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
