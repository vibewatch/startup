      - number: '3.3'
        title: 护城河壁垒韧性、充电基础设施与不利竞争动态
        blocks:
          - type: paragraph
            body: >-
              BETA 的竞争壁垒主要建立在两大支柱：自主研发使能核心技术与地面充电基础设施网络铺设。公司并非简单的机体集成组装商，而是自主正向研发 H500A 电动机、电池包与电力电子系统，在全球筑起超 460
              项已授权专利的知识产权护城河。此外，BETA 已将充电网络推进至 138 处投运站点，并联手 Archer Aviation 与 Macquarie Capital
              组建美国电动天路财团（ACES），计划铺设最多达 250 处多模态充电场站。尽管具备这些结构性优势，BETA
              依然暴露在严峻的不利竞争压力之下：全球航空市场竞争高度激烈，中国等海外司法管辖区不断涌现强劲入局者，商业端需求波动频繁，资金实力更雄厚的大型传统巨头亦可能凭借充足资金储备快速商业化竞争平台，从而逐步蚕食 BETA
              的先发优势。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
