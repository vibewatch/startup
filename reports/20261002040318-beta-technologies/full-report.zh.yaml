      - CR001
      - CR007
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 估值承销与投资决策逻辑流
    type: flow
    summary: 串联运营里程碑、收入拐点、现金消耗与估值承销决策的逻辑链条。
    data:
      nodes:
        - id: backlog
          label: 在手订单规模（991 架合计 $3.9B）
        - id: flight-testing
          label: 运行验证（>200,000 NM 与 138 处充电设施）
        - id: certification
          label: FAA 型号取证（CX300 / A250）
        - id: revenue-ramp
          label: 商业化收入放量（2026 年指引 $39M-$43M）
        - id: cash-burn
          label: 现金消耗对比 $1.71B 流动性储备
        - id: investment-stance
          label: 投资立场：深入调研 / 估值偏高
      edges:
        - from: backlog
          to: flight-testing
        - from: flight-testing
          to: certification
        - from: certification
          to: revenue-ramp
        - from: revenue-ramp
          to: cash-burn
        - from: cash-burn
          to: investment-stance
    approximationNotes: 流程图映射支撑当前公开市场定价所需的核心前置运营条件。
