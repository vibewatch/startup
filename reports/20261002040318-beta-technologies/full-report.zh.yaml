      - number: '8.4'
        title: 补充图表
        blocks:
          - type: callout
            title: 估值研判立场与入场安全边际
            body: >-
              面对超 $7 billion 的上市后估值与仅 $39 million 至 $43 million 的 2026 年营收指引，BETA Technologies
              现有股价已完全计入了完美执行的乐观预期。投资者宜采取「持续观察、深入研究」策略，在 CX300 机型正式取得 FAA 型号合格证、且经审计的季度财报兑现商业化交付转化之前，切忌激进加仓建仓。
            calloutType: recommendation
