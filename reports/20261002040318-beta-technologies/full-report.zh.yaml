            title: 在手订单无法替代收入质量证据
            body: 对外披露的 $3.9 billion 在手订单缺乏关于违约取消费用、定金缴纳、适航审定前置条件、交付节奏以及单机毛利率的公开明细；在未穿透底层合同的前提下，严禁将其直接套算为营收或现金流预测。
