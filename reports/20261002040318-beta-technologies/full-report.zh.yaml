          - type: callout
            title: 基础设施兼具生态基石与商业变现双重属性
            body: >-
              BETA
              铺设充电网络既化解了终端落地的基建瓶颈，又能在整机取证交付前提前兑现充电桩销售收入。该商业模式虽横跨整机研发、核心零部件制造、地面基建与后市场服务，但过宽的业务战线也对团队执行力与资本持续投入提出了极高要求。
            calloutType: insight
            claimRefs:
