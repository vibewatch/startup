  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 推进架构与动力总成工程
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies 将飞机整机架构建立在全自主研发的电推进系统之上，旨在最大化系统可靠性并消除单点故障。旗舰机型搭载的 Model H500A 电动机彻底摒弃了传统航空内燃机动力体系，采用由
              Halbach 磁体阵列与齿绕定子构成的直驱式径向磁通永磁拓扑架构。该电机自重仅 165 磅，峰值功率却可达 573 马力（约 427
              kW），具备契合区域货运与客运任务的高推重比。依托集成双冗余三相绕组并匹配两套独立的客制化高压逆变器，H500A 即使在单路逆变器突发故障时仍能保持连续动力输出。BETA
              在空中飞行工况中特意规避了复杂的机械减速齿轮箱与飞行液冷系统，力求通过热管理极简设计降低全生命周期运营成本，构筑相对于传统涡轮飞机的成本优势。从零部件级台架试验到全功能铁鸟台（iron
              bird）仿真，技术验证全程依托实时自动化测试系统推进，用以核验各项适航符合性要求。
            claimRefs:
              - CE001
              - CE002
              - CE003
