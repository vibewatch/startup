              - CV004
              - CV007
          - type: callout
            title: 现金失血速度与资本密集度敏感性分析
            body: >-
              鉴于 2026 年一季度净亏损 US$122.31 million、2025 财年净亏损达 $745.87 million，BETA 账面 $1.71 billion 现金储备仅能维持约 12 至 18
              个月的高强度产能爬坡消耗，之后必须寻求外部非稀释性信贷授信或推进后续股权再融资。
            calloutType: risk
