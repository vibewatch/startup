      - number: '6.3'
        title: 客户留存韧性、业务拓展与客户集中度
        blocks:
          - type: paragraph
            body: >-
              公开信息无法证实传统 SaaS
              意义上的客户留存表现：全部指定分析材料均未披露净金额留存率（NRR）、毛留存率（GRR）、客户流失率、续约率、同构客群（cohort）留存轨迹、客户满意度指标或已交付机队实际飞行出勤率。现阶段业务黏性主要维系在储备合同约束力、适航审定进度、联合试飞合作以及
              BETA 设想的后市场商业模式之上。公司计划推出飞手培训、航材备件、动力电池梯次更换及「按小时购电」（energy by the hour）保障计划；Surf Air
              公开的合作路径亦拓展至货运航线运营、取证后载人客运、充电机电设施采购以及拟建的原厂授权维保中心。在取得适航证并产生持续采购现金流之前，上述业务拓展均停留在远期规划阶段。客户集中度风险则十分突出：BETA
              披露美国政府与 United Therapeutics 在 2025 年分别贡献了总营收的 27% 与
              16%。投资者必须将庞大的意向订单客户名单与实质性的经常性营收黏性严格区隔开来，在未穿透核验单客定金沉淀、解约违约责任、刚性交付排期、复购频次、机队翻台率以及后市场服务挂载率之前，不应将潜在订单管线误判为稳定的经常性需求。
