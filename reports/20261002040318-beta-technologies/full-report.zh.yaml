  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 核心投资逻辑与核心反向论点
        blocks:
          - type: paragraph
            body: >-
              BETA Technologies 的核心投资逻辑立足于其务实推进的双平台产品策略：以常规固定翼电动飞机（ALIA CTOL / CX300）与电动垂直起降飞机（ALIA VTOL /
              A250）有机结合，并辅以加速扩张的专有地面充电网络。有别于同业一味押注纯空中出租车运营网络，BETA 选择率先发力具备现实商业落地的货运、医疗转运及国防场景。这一战略优先级促成其揽获账面价值达 US$3.9
              billion、涵盖 991 架飞机的商业意向订单储备，客户阵营囊括 UPS、United Therapeutics 与 Blade Urban Air Mobility 等行业标杆。飞行测试环节公司已累积逾
              200,000 海里安全飞行数据，充电网点截至 2026 年第二季度亦拓展至 138 处。反观反向看空论点，核心直指其居高不下的烧钱失血态势与几近挂零的商业化量产交付规模严重脱节。在 2025 财年营收仅
              $35.62 million、净亏损却达 $745.87 million 的基础上，BETA 于 2026 年第一季度营收仅录得 US$10.13 million，净亏损却高达 US$122.31
              million。尽管 2025 年末账面保留了 $1.71 billion 的现金及等价物，但由于单季度运营亏损持续居高且研发投入居高不下，一旦 FAA
              型号审定遇阻或商业化交付持续跳票，普通股股东势必面临长期的股权稀释或估值倍数严重杀跌风险。
