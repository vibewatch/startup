      - number: '6.2'
        title: 客户采纳验证：在手订单、试点项目与标杆客户
        blocks:
          - type: paragraph
            body: >-
              业务体量最显著的表征是 BETA 在 2025 年 Form 10-K 中披露的 891 架民用客机在手订单储备，账面估值 $3.47 billion，细分为 289 架意向确认订单与 602
              架选购权。这一总数字绝不等同于已落地的商业化采纳：BETA 在统计口径中将确认订单与意向选配混为一谈，坦言协议普遍设置了前置生效条件与交付成果要求，并明确指出部分合同必须以取得 FAA
              适航认证为履约前提。同一份申报文件亦证实，公司从未交付过任何完成审定的量产机型，亦未确认过相关销售收入。不过，实际运行层面的突破已不仅限于签署合作意向：BETA 披露已加入 eIPP 试点，携手 United
              Therapeutics 开展人造器官航空转运试飞；当地独立媒体报道，公司在八项联邦示范项目中入选七项，并拟携手 Metro Aviation 及纽约与新泽西港务局部署货运与医疗航线。Loganair
              在苏格兰飞行演示后签署了条款清单（term sheet），Surf Air 则公布了 25 架确认订单与 75
              架选购意向。这些均为有价值的转化迹象，但其性质涵盖试点演示、投资意向书、预售单与选择权，不可简单等同为同一维度的客户采纳。
