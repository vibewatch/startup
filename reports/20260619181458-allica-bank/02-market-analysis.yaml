- id: evidence-gaps-and-contradictions
  title: Sizing Gaps, Contradictions, and Diligence Paths
  body: >-
    Three significant evidence gaps limit the precision of this market analysis.

    First, no independent third-party TAM study for the UK established-SME banking
    market (5–250 employees) was accessible in public sources reviewed for this
    chapter. All market-size references either originate with Allica-commissioned
    research (Oxford Economics, Experian) or are derived from aggregate BoE series
    that cover all SMEs without the 5–250 band cut. The £54bn total lending stock
    figure is a triangulation estimate from component data and carries medium
    confidence. Diligence path: obtain the British Business Bank's Small Business
    Finance Markets report (most recent edition), which typically publishes sub-segment
    lending and deposits with detailed SME breakdowns.

    Second, the business-count contradiction between 265,000 and 500,000 has not been
    resolved in public evidence. Allica's CEO review in the 2025 Annual Report
    explicitly says 6% penetration, but the Oxford Economics report shows established
    businesses are "firms with between five and 250 employees" — which UK BPE data
    suggests is approximately 265,000. The UK Tech News February 2026 article cites
    "as much as 5% of its target market" for the same ~30,000 customers figure,
    implying a slightly larger denominator. These estimates are contradictory and
    the correct denominator affects SOM calculations materially.

    Third, total UK established-SME deposit balances are not published in a freely
    accessible BoE or UK Finance series by the 5–250 employee band. The £95bn
    deposit extrapolation in this chapter is derived from Allica's balance sheet
    share and is indicative only. The £9bn annual savings rate gap figure is
    Allica-authored and has not been independently verified in this chapter.
  claimRefs:
  - CM038
  - CM039
  - CM040
