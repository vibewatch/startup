callouts:
- calloutType: insight
  title: Structural Shift — Challengers Hold 60% of SME Lending
  body: >-
    CityAM reporting in February 2026 cited CEO Richard Davies' observation that
    challenger banks now account for 60% of the UK SME lending market, compared
    with the four largest incumbent banks holding 90% in 2019. This reversal
    validates Allica's market thesis, but it also implies intensifying competition
    from other challengers rather than purely an uncongested greenfield market.
    Allica's differentiation must extend beyond merely being a challenger bank.
  claimRefs:
  - CM008
  - CM027
  - CM028

- calloutType: risk
  title: Business-Count Contradiction Weakens SOM Precision
  body: >-
    Allica's stated 6% market penetration with 30,000+ customers implies a total
    target market of approximately 500,000 businesses. Oxford Economics' June 2026
    report commissioned by Allica refers to approximately 265,000 businesses with
    5–250 employees (consistent with UK BPE 2024 statistics). This two-fold
    discrepancy in the denominator is unresolved in public sources and materially
    affects SOM projections. Investors should request a reconciled market definition
    and verified denominator from management.
  claimRefs:
  - CM003
  - CM004
  - CM038

- calloutType: strength
  title: FSCS Protection Uplift Removes Key Challenger Deposit Barrier
  body: >-
    The PRA's 2025 decision to raise the FSCS deposit protection limit to £120,000
    specifically addresses the trust barrier that caused SMEs to concentrate deposits
    with incumbent banks. This regulatory change is a direct tailwind for Allica's
    deposit growth and reduces the competitive disadvantage challenger banks faced
    on the liability side of the balance sheet.
  claimRefs:
  - CM033
  - CM034

- calloutType: risk
  title: Low SME Borrowing Appetite Caps Lending Volume Growth
  body: >-
    Allica's own April 2025 research documented that SME appetite to borrow has
    reached historic lows, with rising rejection rates and declining demand for
    external finance over three decades. The Bank of England's November 2025 data
    showed SME net borrowing of only £0.2 billion — a signal that Allica's 23%
    lending growth in 2025 was driven entirely by market-share gains from incumbents,
    not by overall market expansion. This structural demand headwind limits the
    long-run lending growth rate that can be sustained.
  claimRefs:
  - CM035
  - CM036
  - CM017

