  title: Market Analysis
  summary: >-
    Allica Bank operates in the UK established-SME banking market, defined as
    businesses with 5–250 employees — approximately 265,000 firms that generate
    35% of private-sector employment and 37% of private-sector turnover. The
    total outstanding SME lending stock is estimated at ~£54bn, with a £65bn
    productive-credit gap accumulated over 25 years as incumbents retreated.
    Challenger banks have taken 60% of SME lending by 2026 (vs incumbents'
    90% share in 2019), but SME lending growth was only 3.7% per annum as of
    March 2026, flagging a slow macro backdrop. Allica has reached ~6%
    customer penetration targeting 10% by 2028, while key structural drivers
    include the branch retreat, AI underwriting, FSCS deposit protection
    uplift, and open banking, constrained by switching friction, capital
    adequacy requirements, and historically low SME borrowing appetite.

sections:
- id: market-definition-and-scope
  title: Market Definition and Scope
  body: >-
    Allica Bank defines its target market as UK established SMEs — businesses
    that typically employ between 5 and 250 staff. These firms are distinct from
    micro-businesses (fewer than 5 employees) and large corporates (over 250
    employees), both of which have historically been served by different
    banking models. Oxford Economics analysis commissioned by Allica, published
    in June 2026, quantified this segment at approximately 265,000 businesses
    that contribute 35% of UK private-sector employment and 37% of private-sector
    turnover. Their importance is even more pronounced outside London and the
    South East, where established businesses account for 39–44% of regional
    private-sector employment compared with just 30% in London, and half of all
    private-sector jobs in rural areas.

    The banking services in scope span four categories: primary banking
    (current account, payments, overdraft), liability products (business savings,
    notice accounts, fixed-term deposits), asset lending (commercial mortgages,
    asset finance, growth/bridging finance), and working capital (invoice finance,
    overdraft, embedded credit). Excluded from Allica's direct market are
    consumer banking products, retail mortgage lending, large-corporate debt
    (syndicated loans, capital markets), international SME banking (though Series D
    funding covers a pilot), and sole-trader or self-employed individuals.

    The status-quo alternative for most established SMEs is one of the four
    large incumbent banks — Barclays, HSBC, NatWest, and Lloyds — which
    collectively held approximately 90% of SME lending as recently as 2019.
    According to CityAM reporting in February 2026, that share has now shifted
    dramatically: challenger banks account for 60% of the market by 2026, a
    reversal driven by incumbents' branch retreat, legacy technology constraints,
    and a strategic refocus toward retail mortgages and large corporates. Allica's
    own analysis identifies a £65 billion productive-credit gap that has
    accumulated over the past 25 years as incumbents deprioritised SME lending.

    A key market tension is the definitional discrepancy in market-size estimates.
    The Experian analysis cited in Allica's 2025 Annual Report compares ~3,500
    Allica customers against a sample of 265,000 UK SMEs with 5–250 employees —
    implying the total addressable business population in this band is approximately
    265,000. However, Allica's stated penetration of "over 6%" with 30,000+
    customers implies a denominator of approximately 500,000. This gap likely
    reflects differing scope boundaries: the 265,000 figure may exclude very small
    businesses in the 5–9 employee band that Allica counts, or it may be that
    Allica's 30,000 customer count includes both BRA holders and lending-only
    relationships, double-counting some underlying businesses.
