    - label: SAM — Allica-served product segments (5–250 employee businesses)
      value: ~£60–65bn lending; deposit wallet proportionate to customer base (~£95bn)
    - label: SOM — Allica current position (end-2025 / early 2026)
      value: £3.7bn loans + £5.7bn deposits; ~6% customer penetration
    - label: Target SOM (2028)
