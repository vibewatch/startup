- id: TM004
  title: Growth Drivers and Adoption Constraints — UK Established-SME Banking
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for Allica
  - Diligence Ask
  rows:
  - - Incumbent branch retreat and product withdrawal
    - Driver
    - Ongoing since 2015; structural by 2026
    - Creates unmet need; Allica fills the vacuum in relationship banking and complex lending
    - Quantify annual branch closures affecting established SME segments; track NatWest / Barclays SME unit announcements
  - - Challenger banks now hold 60% of SME lending (vs 10% in 2019)
    - Driver (confirmed)
    - Structural shift completed by 2026 per CityAM
    - Validates market opportunity; also signals intensifying inter-challenger competition
    - Verify share data with independent source; CMA market review data preferred
  - - SME overdraft provision collapsed 80%+ since 2000
    - Driver (unmet need)
    - Persisted 2000–2025; Allica's overdraft product launched Feb 2026
    - £15bn market gap cited; Allica launched overdraft up to £2m; first-mover advantage possible
    - Track adoption rate of Allica Overdraft; monitor competitive response from incumbents
  - - AI-enabled underwriting reduces unit costs
    - Driver
    - Emerging 2024–2026; Allica at 79% daily AI usage in engineering (Jan 2026)
    - Lower cost per complex SME loan; opens tail of less-profitable SMEs; advantage grows with data scale
    - Benchmark cost-per-loan vs incumbents; verify AI adoption in credit decisioning specifically
  - - FSCS deposit protection limit raised to £120,000 (2025)
    - Driver
    - 2025 (PRA decision); immediate effect
    - Reduces trust barrier for SME deposits with challenger banks; supports BRA and savings growth
    - Track deposit switching data at bank level; Allica's deposit growth (£5.7bn) partly attributable
  - - PRA/FCA Scale-up Unit — Allica in inaugural cohort (2026)
    - Driver
    - Early 2026 pilot cohort; ongoing
    - Reduces capital uncertainty for Allica; supports product launch timeline certainty
    - Monitor PRA out-of-cycle capital review outcomes; assess regulatory cost savings
  - - Low SME borrowing appetite (historic lows)
    - Constraint
    - Structural; entrenched since global financial crisis
    - Demand headwind for lending growth; Allica must compete for a smaller pool of credit-seeking SMEs
    - Track BoE Money and Credit SME net borrowing flows; monitor loan rejection rate trends
  - - Basel 3.1 capital requirements (Allica adopted full rules)
    - Constraint
    - Effective from Basel 3.1 implementation date; ongoing
    - Requires sustained equity issuance; £155m Series D needed to support lending book
    - Model capital consumption per £bn of incremental lending; assess headroom before next raise
  - - Switching cost and trust deficit (brand awareness only 16% in 2025)
    - Constraint
    - Persistent; Allica awareness growing but far below incumbent recognition
    - Limits inbound demand; slows BRA and primary account conversion
    - Track brand awareness trend (4%→8%→16%); estimate switcher conversion rate by channel
  - - Macro/credit cycle risk for SME lending
    - Constraint
    - Cyclical; geopolitical uncertainty noted in Allica's 2025 Annual Report
    - SME defaults would raise loan impairments; Allica ECL model and CET1 buffer absorb moderate stress
    - Review Allica's IFRS 9 staging data; stress test NIM under higher-impairment scenario
  notes: >-
    Drivers and constraints drawn from Allica's 2025 Annual Report, press releases,
    and Bank of England Money and Credit data. The 60% challenger market-share figure
    originates in CityAM reporting quoting CEO Richard Davies; it has not been
    independently corroborated by CMA or BoE in accessible public sources reviewed
    for this chapter. The FSCS limit increase is confirmed in Allica's 2025 Annual
    Report narrative. Timing column reflects the period over which the factor is
    expected to exert material influence.
