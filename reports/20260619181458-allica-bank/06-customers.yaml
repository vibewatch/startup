      Year-end 2024 and 2025 figures are disclosed minimums (">6,000" and ">14,000").
      The 2028 implied target is an analyst estimate; Allica's stated 10% market penetration
      target by 2028 refers to total customers, not BRA holders specifically.
    claimRefs:
      - CU009
      - CU012
      - CU017

callouts:
  - calloutType: strength
    title: Verified NPS Leadership and Award Recognition
    body: >
      Allica's customer NPS of +76 — measured by independent financial research firm
      RFI Global in November 2025 — is strong for any bank and exceptional in the SME
      segment. The "Most Recommended Business Bank" award (March 2026, RFI Global,
      4,000+ business votes) provides independent third-party corroboration of satisfaction
      claims. These signals are reinforced by 1,700+ Trustpilot reviews at 4.7/5 and
      2,400+ Smart Money People reviews at 4.89/5, suggesting the satisfaction is not
      concentrated in a small, cherry-picked sample.
    claimRefs:
      - CU024
      - CU025
      - CU028
      - CU029
  - calloutType: risk
    title: Low Balance Fee May Signal Early BRA Churn Risk
    body: >
      The February 2026 introduction of a £25/month fee for BRA accounts with an average
      balance below £10,000 is a material policy shift. Allica communicated the change in
      November 2025, but Trustpilot reviews from June 2026 show customers who were
      surprised by the fee. The policy creates a financial disincentive for lightly funded
      BRA holders and could accelerate churn among smaller SMEs who use the account for
      operational transactions but maintain limited idle balances — exactly the segment
      least likely to cross-sell into lending products.
    claimRefs:
      - CU033
      - CU034
  - calloutType: insight
    title: 30,000+ Total Customers vs. 14,000 Active BRA — Consistent If Distinct Products
    body: >
      The 30,000+ total customer figure (February 2026 Series D) and the 14,000+ active
      BRA count (December 2025 Annual Report) are consistent, not contradictory: the 16,000+
      difference likely reflects lending-only customers (commercial mortgage, asset finance,
      bridging, growth finance) and savings-only customers who do not hold a BRA. The
      strategy of converting lending-only relationships to full BRA primary banking is the
      key growth lever: CASS switches +300% in 2025 indicate the conversion playbook is
      working, though the absolute conversion rate from first product to primary bank
      remains undisclosed.
    claimRefs:
      - CU007
      - CU009
      - CU012
      - CU013
      - CU038

