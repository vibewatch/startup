  - id: named-customer-proof
    title: Named Customer Evidence and Relationship Manager Model
    body: >
      Allica publishes dozens of named case studies on its website across eight disclosed
      industry verticals, with the most recent additions dated into 2026. The case studies
      consistently feature the named relationship manager (RM) as a differentiating element:
      every BRA holder receives a dedicated named RM, a model that incumbent banks
      discontinued for the SME segment years ago. The case studies span lending products
      (commercial mortgage, asset finance, bridging finance) and current-account/savings
      use cases. Ashley Care Group (care homes, Norfolk) secured a commercial mortgage
      for its fifth care home within six weeks in 2023 after its relationship manager
      handled complexity that other lenders rejected. Crouchers Orchards Hotel (hospitality,
      West Sussex) refinanced its commercial mortgage through Allica after its existing
      lender exited the UK in 2022, having been referred by a broker specialist. Glazing
      Vision (glazing/manufacturing) used a commercial mortgage during the COVID-19 pandemic
      when other banks were reluctant to lend. Universal Tanker Solutions received an
      asset finance deal end-to-end in just over two hours, facilitated via an asset finance
      broker. On the BRA current-account side, the product page features Beate Rothon,
      founder of Gentle Dog Food, noting the savings interest earned on BRA balances.
      These cases demonstrate production deployments across a range of UK regions and
      industries, and all involve named individuals and specific outcomes. However, all
      published cases are company-originated marketing content — independent customer
      references are limited to aggregated review platforms (Trustpilot, Smart Money
      People), and no independent case studies, procurement records, or regulated-sector
      (NHS, government) awards have been identified.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
    tableRefs:
      - TU003

  - id: retention-satisfaction
    title: Retention, Satisfaction, and Adverse Signals
    body: >
      Allica measures satisfaction across three partner groups using semi-annual NPS surveys
      conducted by independent research firm RFI Global. The November 2025 customer NPS
      was +76 (up from +67 in November 2024), which the company describes as "excellent"
      and which drove the March 2026 "Most Recommended Business Bank" award from RFI Global
      based on over 4,000 surveyed businesses. Broker NPS reached +52 and accountant NPS
      +79 in the year-end 2025 surveys. Third-party review platforms corroborate the
      positive signal: Trustpilot shows 4.7/5 as at end 2025 (1,700+ reviews), though the
      live Trustpilot page showed 4.6/5 at the time of this research (June 2026), reflecting
      some slight score drift; Smart Money People shows 4.89/5 from over 2,400 reviews.
      App store ratings are 4.7 on Apple App Store and 4.6 on Google Play. Against this
      broadly positive picture, a material adverse signal emerged in early 2026: Allica
      introduced a £25 per-month low balance fee for BRA accounts with an average balance
      below £10,000 (effective February 2026, communicated November 2025). Recent Trustpilot
      reviews flag this fee as a negative surprise, and one reviewer reported customer
      service response times of 7–10 days between replies — inconsistent with Allica's RM
      model promise. A third reviewer noted declining savings interest (from circa 4.2% to
      2.3% over their account's lifetime), attributing this to market rate movements. No
      systematic churn rate, gross revenue retention (GRR), or net revenue retention (NRR)
      data is publicly available for Allica's customer base; the only cohort-level proxy
      is the 133% year-on-year growth in active BRA holders, which confirms net expansion
      but does not isolate retention from acquisition.
    claimRefs:
