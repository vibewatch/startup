  - id: TU005
    title: Expansion Path and Concentration Risk Assessment
    columns:
      - Factor
      - Current Evidence
      - Concentration / Expansion Risk
      - Impact if Risk Materialises
      - Diligence Path
    rows:
      - - Broker channel origination dependence
        - "Brokers described as 'largest channel for lending'; broker NPS +52"
        - High — volume split between direct and broker not disclosed
        - Broker sentiment shift or fee compression could reduce origination flow
        - Request channel revenue split; monitor broker pricing and exclusivity
      - - BRA cross-sell conversion from lending
        - "BRA holders more than doubled (133% YoY); direct channel growing"
        - Medium — conversion rate from lending-only to BRA not published
        - If cross-sell rate is low, deposit diversification is less than implied
        - Request lending-to-BRA conversion rate and time-to-full-relationship data
      - - Single-name loan book concentration
        - No disclosure of top-10 borrower concentration or single-name caps
        - Unknown — SME lenders typically have granular books but no data given
        - Concentrated loans to a few large ESMEs could impair credit quality
        - Request loan book concentration metrics (top-10 % of total book)
      - - International expansion (planned)
        - Series D press release mentions expansion outside UK for first time
        - Low-current / High-future — no market, timeline, or regulatory approval cited
        - Regulatory delays or execution costs could divert resources from UK growth
        - Confirm target market(s) and capital required; check regulatory approvals
      - - Deposit concentration (BRA)
        - "£5.7bn in deposits; BRA deposits 31% of total (current accounts)"
        - Medium — institutional vs. SME deposit mix not fully disclosed
        - Large BRA depositor exits could affect funding mix and NIM
        - Request top-25 depositor concentration; monitor CASS outflow rates
    notes: "Risk ratings are analyst assessments based on available evidence. Origination channel split and borrower concentration data are not publicly available; estimates are inferred from management commentary."
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040

figures:
  - id: FU001
    title: Allica Bank Customer Journey Map — Established SME
    type: journey-map
    layout: wide
    summary: >
      Illustrates how an established SME discovers, joins, and deepens its relationship
      with Allica Bank, from awareness through multi-product primary banking.
    data:
      nodes:
        - id: awareness
          label: Awareness
          description: Business owner becomes aware of Allica via broker, accountant recommendation, brand advertising, or word of mouth
        - id: consideration
          label: Consideration
          description: Prospect evaluates BRA features, savings rates, cashback, and RM model against incumbent bank
        - id: application
          label: Application
          description: Business applies online; RM conducts onboarding call; account opened typically within a few days
        - id: first-product
          label: First Product Active
          description: Customer activates BRA or draws first loan; interacts with named RM
        - id: deepening
          label: Relationship Deepening
          description: Cross-sell from current account to lending, or from lending to BRA; QuickBooks integration, expense cards
        - id: primary-bank
          label: Primary Banking
          description: Customer performs CASS full switch; Allica becomes primary bank; tiered savings rates unlock
    approximationNotes: >
      Journey stages are reconstructed from Annual Report 2025 narrative, case studies, and product pages.
      Quantitative conversion rates between stages are not publicly available.
