company:
  name: Allica Bank
chapter:
  number: 6
  title: Customers
  summary: >
    Allica Bank serves over 30,000 established UK SMEs (5–250 employees) across lending,
    current account, and savings products, with more than 14,000 active Business Rewards
    Account holders at year-end 2025 — up 133% year-on-year and representing over 6% of
    its stated target market. Named customer proof spans hospitality, care, manufacturing,
    and professional services, supported by a customer NPS of +76 and a Trustpilot score
    of 4.7/5, though customer service response times and a February 2026 low-balance fee
    introduction have generated adverse reviews. Concentration in the broker origination
    channel and limited published data on top-customer revenue exposure are the principal
    diligence gaps.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation and Target Definition
    body: >
      Allica Bank addresses a single, tightly defined segment: established UK SMEs
      with 5 to 250 employees. Management estimates approximately 500,000 such businesses
      exist across the UK, representing about one-third of national employment and GDP.
      Unlike retail neo-banks that serve any consumer or micro-business, and unlike
      investment banks that focus on larger corporates, Allica explicitly excludes both
      ends of the size spectrum to concentrate exclusively on what it terms the "established
      SME" (ESME) tier. Incumbent high-street banks find ESMEs too complex to serve
      profitably on legacy platforms, creating the gap Allica targets. The primary buyer
      and payer is typically the business owner or finance director; the user is the owner
      and finance team who interact with the current account, lending portal, and app.
      The company serves customers across multiple verticals — hospitality, manufacturing,
      care homes, professional services, retail, environmental services, and technology —
      with no publicly disclosed revenue concentration by vertical or geography. Customers
      access Allica via three primary routes: the Business Rewards Account (BRA) current
      account, secured and unsecured commercial lending, and business savings. The BRA is
      positioned as the anchor product for the full primary banking relationship, enabling
      Allica to access deposits that reduce funding costs while building the cross-sell
      pipeline. Allica holds offices in London, Milton Keynes, and Manchester, and deploys
      regional relationship managers across the UK rather than serving solely through
      digital-only channels.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption Trajectory and Market Penetration
    body: >
      Allica's customer base has grown rapidly across all measured dimensions. Total
      established SME customers reached over 30,000 as of the February 2026 Series D
      announcement, up from approximately 25,000 as at March 2025 per a British Business
      Bank announcement, and from an earlier, smaller base at licence-grant in 2019.
      The year-end 2025 Annual Report reports over 14,000 active Business Rewards Account
      holders — up 133% from more than 6,000 at year-end 2024 — with account holders
      "more than doubling" through 2025. These figures are consistent if the 30,000+ total
      customer count includes lending-only and savings-only relationships that do not hold
      a BRA, while the 14,000 active BRA count reflects only current-account holders
      who have actively transacted. Allica describes customer penetration of the established
      SME segment as "over 6%" at year-end 2025, while the February 2026 Series D press
      release describes "around 5% of its target market". The slight difference in framing
      likely reflects either a narrower or broader definition of the addressable segment,
      and both figures point to approximately 500,000 addressable businesses in scope.
      Market penetration is well ahead of brand awareness (4% in 2023, 8% in 2024, 16% in
      2025), suggesting word-of-mouth and broker referrals are more efficient acquisition
      channels than brand advertising. The CASS full and partial bank-account switch rate
      into the BRA rose by over 300% during 2025, and monthly card spend across BRA holders
      more than doubled in the same period. On the lending side, Allica advanced over
      £1.3 billion in new originations in 2025 (the second consecutive year above £1bn),
      growing the total book to £3.7bn against a target of 10% market penetration by 2028.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
