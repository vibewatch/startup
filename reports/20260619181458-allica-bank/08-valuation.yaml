  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cap table and preference stack
      missingEvidence: >
        Equity share count, liquidation preference tiers, anti-dilution provisions, and AT1
        conversion trigger details are not publicly disclosed. These are required for waterfall
        analysis and a precise intrinsic value calculation.
      whyItMatters: >
        Without a cap table, it is impossible to calculate per-share value, dilution impact
        of the AT1, or return profile for common equity investors at the Series D entry price.
        This is the single largest gap limiting investment conviction.
      diligencePath: >
        Request directly from management; cross-reference Companies House allotment filings
        and annual report notes on share capital for partial reconstruction.
      relatedQuestionRefs:
        - QV008
        - QV022
        - QV023

    - type: private-evidence-only
      severity: material
      topic: independent analyst or rating coverage
      missingEvidence: >
        No independent analyst research note, credit rating agency assessment, or FCA-approved
        investment research on Allica Bank was found in public sources as of June 2026.
      whyItMatters: >
        Independent analysis would provide external validation of management's reported operating
        metrics, credit quality, and strategic plan, materially increasing investment conviction.
      diligencePath: >
        Contact Bloomberg Intelligence, Moody's Analytics, or Fitch Ratings for potential
        coverage; request management to facilitate an analyst day or research access programme.
      relatedQuestionRefs:
        - QV018

    - type: enumeration-incomplete
      severity: material
      topic: comparable valuation table — private challenger bank data
      missingEvidence: >
        Full private comparable data for OakNorth post-2019, Allica's own mid-year secondary
        transaction marks, and verified FY2024/FY2025 revenue data for Starling Bank are
        unavailable from public sources.
      whyItMatters: >
        Stale or absent comparable data for the most directly relevant peer (OakNorth) reduces
        the precision of any relative valuation analysis and may lead to over- or under-pricing
        the Allica premium.
      diligencePath: >
        Subscribe to Dealroom, Pitchbook, or CB Insights for latest private market marks;
        request secondary transaction data from brokers active in UK challenger bank stakes.
      relatedQuestionRefs:
        - QV002
        - QV004
      relatedTableRefs:
        - TV004

    - type: missing-source
      severity: material
      topic: AT1 instrument terms and cost of capital
      missingEvidence: >
        The AT1 instrument's coupon rate, conversion trigger (CET1 threshold), write-down
        provisions, and maturity/call schedule are not publicly disclosed.
      whyItMatters: >
        AT1 terms affect the effective cost of capital, the dilution risk to common equity,
        and the capital adequacy buffer calculation. Without them, the hybrid capital structure
        cannot be fully assessed.
      diligencePath: >
        Request from management; Companies House instrument filing; annual report notes on
        subordinated liabilities and capital instruments.
      relatedQuestionRefs:
        - QV008
        - QV032

    - type: missing-source
      severity: minor
      topic: international expansion market and regulatory strategy
      missingEvidence: >
        Target European markets, required banking authorisations, estimated capital cost, and
        projected revenue contribution timeline are not publicly disclosed.
      whyItMatters: >
        International expansion is cited as a key use of Series D proceeds. Without detail,
        it is impossible to model the drag on near-term profitability or the medium-term
        revenue upside, both of which affect the base case scenario.
      diligencePath: >
        Monitor Allica press releases and FCA/ECB authorisation filings; request management
        update at next investor communication.
      relatedQuestionRefs:
        - QV004
        - QV032

