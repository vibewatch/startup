  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis
    body: >
      Building a meaningful comparable set for Allica requires spanning both fintech-premium
      digital banks and traditional UK lenders, because Allica straddles both worlds. It holds
      a PRA banking licence, is profitable, earns its income primarily through interest spread,
      yet carries the growth profile and technology investment posture of a challenger bank.

      Among UK digital challengers, Monzo achieved a valuation of approximately £4.7bn in its
      2024 fundraise (FY2024 revenue ~£865m; ~5.4x revenue multiple), reflecting a consumer-led
      business expanding into SME. Starling Bank carried a £2.5bn valuation in its 2022 fundraise
      (FY2023 revenue ~£413m; 0.6–1.5x revenue depending on year), and is reportedly preparing
      for an IPO. OakNorth, the most directly comparable UK SME specialist lender, carried a
      $2.8bn valuation in 2019 — a stale mark — and discloses minimal current financial data.
      Revolut's 2024 secondary transaction implied ~£45bn at ~16x estimated revenue, reflecting
      global payments ambitions that make it a poor direct comparable. Listed UK bank peers
      (NatWest, Lloyds) trade at 0.8–1.2x tangible book value and 8–12x earnings, representing
      the floor scenario for a yield-on-assets banking franchise.

      On a price-to-NII basis, Allica's implied ~6x NII (£159m NII; ~£950m valuation) is
      moderate relative to digital bank peers. The private-bank illiquidity discount, limited
      secondary market data, and undisclosed equity count cap full conviction. Allica's 2.5x
      gross-revenue multiple appears broadly fair given its profitability and growth trajectory,
      though it should be monitored against fintech multiple compression trends.
