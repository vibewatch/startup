  - id: bull-base-bear-scenarios-risk
    title: Bull / Base / Bear Scenarios and Adverse Evidence
    body: >
      Three scenarios govern the return profile from the ~£950m Series D entry valuation:

      In the bull case, Allica sustains 25–30% annual revenue compound growth through 2028,
      driven by BRA current-account scale-up and direct origination displacing broker channels.
      NIM holds near 4.7% as the fixed-rate treasury book hedges rate movements, credit quality
      remains clean (NPL below 1.5%), and international expansion contributes incremental revenue
      with manageable cost. Gross revenue could approach £600–700m by FY2028 and the loan book
      £6–7bn, supporting a 3–3.5x revenue multiple and an exit valuation of approximately
      £2.0–2.5bn ($2.5–3.2bn). This requires flawless execution across multiple fronts.

      The base case assumes 18–22% revenue CAGR, modest NIM compression to ~4.3–4.5% if the
      BoE reduces rates, and contained credit losses. Gross revenue reaches £500–550m by FY2028
      and the loan book ~£5bn. At a 2.5–3x revenue multiple, the exit value is approximately
      £1.4–1.8bn ($1.8–2.3bn), delivering moderate uplift on the Series D entry.

      The bear case involves macro headwinds: BoE rate cuts compressing NIM below 4.0%, a UK SME
      credit cycle deterioration driving elevated impairment charges, and overspend on international
      expansion diverting capital from the core franchise. Revenue growth slows below 15%, PBT
      declines, and the comparable multiple contracts toward 1.5–2x revenue, implying a valuation
      of £0.7–0.9bn ($0.9–1.1bn) — below the Series D entry price and a genuine down-round risk.

      Adverse signals already present: a 35% opex growth rate outpacing 27% revenue growth,
      fintech multiple compression of 40–60% globally between 2021 and 2024, elevated UK SME
      insolvency rates in 2025–2026, and private-bank opacity that limits independent validation.
      Customer complaint data from the Financial Ombudsman Service and review platforms indicates
      a small but growing complaints volume that warrants monitoring as the customer base scales.
