  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - NIM compression
        - NIM falls below 4.2% for two consecutive reporting periods
        - Revenue and PBT fall; multiple contracts as growth premium erodes
        - Reassess; reduce conviction to Avoid if sustained
      - - Credit losses spike
        - NPL ratio exceeds 3% or loan impairments >£30m in any 12-month period
        - Profitability erodes; CET1 buffer consumed; capital raise at dilutive terms
        - Exit trigger; watch monthly BoE credit data and interim results
      - - Management departure
        - CEO or CFO exits without planned succession
        - Execution risk rises; investor confidence in strategy shaken
        - Red flag; place under review; await management communication
      - - Fintech multiple compression
        - Comparable digital bank revenue multiples fall below 2x
        - Marks Allica's implied valuation below £742m — below Series D entry
        - Update model; consider whether fundamental repricing warranted
      - - International expansion cost overshoot
        - Write-off or exceptional cost exceeds £20m or expansion delayed by >24 months
        - Diverts capital from profitable core UK franchise; management distraction
        - Reassess international contribution to growth thesis; demand cost cap disclosure
      - - Regulatory capital breach
        - CET1 falls below 10% or PRA issues capital direction
        - Signals credit losses or rapid growth consuming capital; equity dilution risk
        - Immediate exit review; monitor PRA regulatory correspondence
    notes: >
      Thresholds are author-defined monitoring triggers, not formal covenants. They are
      based on the FY2025 baseline (CET1 13.4%, NIM 4.7%, NPL < 1%) and typical UK bank
      early-warning indicators.
    claimRefs:
      - CV010
      - CV011
      - CV033
      - CV034
      - CV035
      - CV038
      - CV043

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Cap table and preference stack
        - Equity share count, liquidation preference tiers, anti-dilution rights
        - Required for waterfall analysis and true equity valuation; current opacity prevents this
        - Request from management; Companies House allotment filings as proxy
      - - Price-to-tangible-book calculation
        - Full risk-weighted asset schedule and tangible book value
        - P/TBV is the canonical private-bank valuation metric; not calculable from public data
        - FY2025 Pillar 3 report (partial); request RWA table from management
      - - AT1 instrument terms
        - Coupon rate, conversion/write-down trigger, maturity/call structure
        - AT1 dilutes common equity returns in a stress scenario; terms determine impact
        - Annual report notes; Companies House instrument disclosure; management
      - - International expansion plan
        - Target markets, regulatory approvals required, capital cost, revenue timeline
        - Material to near-term cost and FY2026–2027 profit assumptions
        - Management; press release announcements; FCA/ECB authorisation filings
      - - FY2026 interim results
        - H1 2026 net interest margin, loan growth, credit quality, cost run-rate
        - Validates whether FY2025 trajectory is maintained; de-risks base-case scenario
        - Allica Bank Investor Relations; annual report cycle (published ~Q1 2027)
      - - Independent analyst or rating coverage
        - Credit rating or equity research note from arms-length third party
        - Would provide external validation of Allica's fundamentals and valuation
        - Bloomberg / Moody's / Fitch; FCA authorisation file if available; request management
    notes: >
      Diligence asks are prioritised by materiality to the valuation analysis. Items 1–3
      are blocking for a high-conviction investment recommendation. Items 4–6 are material
      but do not prevent a Track recommendation.
    claimRefs:
