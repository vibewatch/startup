  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Credit quality deterioration
        - Stage 3 loan / gross book ratio; ECL coverage ratio
        - Stage 3 exceeds 5% of gross book, OR Stage 3 coverage falls below 15%
        - Immediate credit policy tightening; reduce new originations in stressed sectors
      - - Capital adequacy under growth stress
        - CET1 ratio trajectory; SREP headroom
        - CET1 approaches or breaches SREP floor (≈11% current minimum)
        - Emergency capital raise required; loan book growth pause
      - - Regulatory enforcement or licence restriction
        - FCA/PRA public notices; Section 166 skilled person review; enforcement investigation
        - Any formal enforcement notice or public announcement of FCA/PRA action
        - Thesis-break event; broker confidence and deposit franchise at material risk
      - - Consumer Duty or conduct failure
        - FCA supervisory engagement; FOS referral volumes; complaint upheld rates
        - FCA supervisory letter citing systemic conduct failure; material increase in upheld complaints
        - Product redesign required; potential fine; remediation reserve needed
      - - AI lending model malfunction
        - AI model vs. legacy model performance tracking; default rate relative to expectations
        - AI model underperforms by >50 bps in loss rate vs. expected
        - Revert to manual credit support; model freeze; independent validation commissioned
      - - Funding concentration stress
        - Net BRA and SME deposit outflow rate
        - Net BRA account closures exceeds 500/month for 3 consecutive months
        - Activate contingency funding plan; increase wholesale or institutional deposit sourcing
      - - Broker channel concentration loss
        - Volume from top-3 brokers; broker NPS
        - Top-3 broker origination volume drops >30% in any quarter
        - Accelerate direct origination channel; review broker fee and service structure
      - - International expansion capital drain
        - Cumulative spend on international exploration vs. milestones
        - Cumulative spend exceeds £10m without regulatory authorisation or clear go-to-market
        - Halt further expansion expenditure; reallocate capital to UK core market
    notes: >
      Thresholds are illustrative investment-monitoring triggers derived from disclosed
      financial metrics and the principal risk framework in the Allica Bank Annual Report
      2025. No internal trigger thresholds have been publicly disclosed by Allica.
