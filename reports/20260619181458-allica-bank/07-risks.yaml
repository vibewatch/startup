        Without sector benchmarks, it is impossible to judge whether Allica's 2.6%
        Stage 3 ratio and 18.1% coverage represent above- or below-average credit
        quality for UK SME commercial lenders at this stage of the credit cycle.
      diligencePath: >
        Request PRA or FCA published data on aggregate stage-3 ratios for banks
        in the same size cohort; compare against annual report disclosures from
        OakNorth and Starling.
      relatedQuestionRefs:
