  - id: capital-funding-liquidity
    title: Capital Adequacy, Funding, and Liquidity Risk
    body: >
      Allica's CET1 ratio declined from 14.5% at December 2024 to 13.4% at December 2025 as
      risk-weighted assets grew from £1,908m to £2,422m (+27%), outpacing capital accumulation.
      The total capital ratio fell from 18.8% to 16.8% over the same period. The PRA-set overall
      SREP capital requirement is 14.5% at December 2025, leaving a headroom of approximately
      2.3 percentage points. A post-year-end Series D capital raise (£10m CET1, £47m AT1) in
      February 2026 provided additional buffer, and another share allotment of £3.8m equivalent
      was recorded at Companies House on 15 June 2026. The trajectory of declining capital ratios
      under sustained book growth is a structural watch-point: at the current loan growth rate
      (the book grew from £3.1bn to £3.8bn, up 23%), further capital raises will be needed within
      12–18 months to maintain SREP headroom. The PRA published final Basel 3.1 implementation
      rules on 20 January 2026; Allica chose to adopt the standard Basel 3.1 framework rather
      than the Small Domestic Deposit Takers (SDDT) lighter-touch regime, meaning its capital
      requirements will be recalibrated on the Basel 3.1 timeline. The quantified capital impact
      of this transition has not been publicly disclosed. Liquidity metrics are strong: LCR at
      207.7% (Pillar 3 average 220.8%) and NSFR at 138.8% both significantly exceed regulatory
      minima of 100%, indicating no near-term funding stress. Customer deposits grew 29% to
      £5.7bn in 2025, with the SME deposit share rising from 47% to 71% — sticky but more
      rate-sensitive than personal retail deposits in a competitive savings market.
    claimRefs:
