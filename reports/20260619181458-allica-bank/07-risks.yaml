  - id: regulatory-compliance-conduct
    title: Regulatory, Compliance, and Conduct Risk
    body: >
      Allica Bank Limited operates under PRA and FCA dual regulation (FRN: 821851) for its
      deposit-taking and savings products. However, three of its four main revenue streams involve
      entities that are not regulated: Allica Financial Services Limited (asset finance and growth
      finance, company number 12784979) and Allica Bridging Finance Limited (bridging finance,
      company number 10859711) are expressly not authorised or regulated by the PRA or FCA.
      This creates a structural conduct risk: customers of these products do not benefit from the
      FCA regulatory umbrella including Financial Ombudsman Service access or FSCS protection.
      The FCA Consumer Duty (PS22/9, live since July 2023) applies to Allica's regulated products;
      the bank has voluntarily retained a Consumer Duty Champion on the Board (Paul Marston,
      chair of People and Remuneration) even after the FCA formally dropped the requirement for
      firms to appoint one. Adverse Trustpilot reviews in June 2026 document customer complaints
      about a £25/month low-balance fee introduced in February 2026, slow customer service
      (7–10 day response times cited), unexpected account closures citing compliance obligations,
      and lack of transparency about savings rates offered through third-party platforms. While
      Allica's overall Trustpilot score remains high at 4.6/5, the adverse pattern warrants
      monitoring. The PRA published its final Basel 3.1 and SDDT rules on 20 January 2026;
      Allica selected the Basel 3.1 standard approach, exposing it to full-scope RWA recalibration
      as the rules phase in. Allica was selected as an early participant in the PRA/FCA joint
      Scale-Up Unit, indicating close supervisory engagement, but no enforcement actions or FCA
      investigations are publicly known as at June 2026. The FCA CP24/2 proposed new rules
      on publicising enforcement investigations — if finalised, these could increase reputational
      exposure for any regulated firm under investigation.
