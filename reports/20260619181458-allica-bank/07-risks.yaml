callouts:
  - calloutType: risk
    title: Unregulated Entity Conduct Risk Is Structurally Underappreciated
    body: >
      Allica derives a growing share of revenue from asset finance, growth finance, and
      bridging products operated by subsidiaries that are explicitly not regulated by the
      PRA or FCA. Customers of these products have no FCA or FOS protection. If conduct
      failures occur in these entities, the reputational contagion risk to the regulated
      bank franchise could be severe and swift, particularly in the broker market where
      trust is the primary distribution currency.
    claimRefs:
      - CR017
      - CR018
      - CR045

  - calloutType: risk
    title: AI Agentic Lending Decisions Outpacing Model Validation Cycle
    body: >
      Allica deployed fully automated agentic AI loan decisioning in early 2026, having
      moved from under 50% to 79% daily AI tool usage in engineering within two years.
      Model validation operates periodically, not continuously, and no independent
      third-party audit of the AI lending model has been publicly disclosed. The risk
      of systematic model bias or miscalibration at scale is material given the loan
      book growth trajectory.
    claimRefs:
      - CR028
      - CR029
      - CR031

