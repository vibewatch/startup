  - id: competitive-strategic-governance
    title: Competitive, Strategic, and Governance Risk
    body: >
      Allica's competitive position rests on serving UK established SMEs (5–250 employees), a
      segment that incumbents are now explicitly targeting (Lloyds, HSBC, Barclays business
      banking investment cycles) and that other challengers like OakNorth and Starling Business
      also address. Richard Davies (CEO) was the inaugural CEO of OakNorth, indicating he has
      direct visibility of the competitive threat but also that Allica's playbook is not
      uniquely proprietary. Board governance risk includes the resignation of director R Kapoor
      on 30 June 2025 (no reason publicly disclosed), the simultaneous appointment of two new
      board members (Ghatak and Subramanian in May 2025), and Chair John Maltby's concurrent
      board roles at West Bromwich Building Society, Max Nicholas Renewables, and Nordea Bank.
      The concentration of strategic and investor relationship management in CEO Richard Davies
      (former COO at Revolut, inaugural CEO of OakNorth) creates key-person risk. The company
      is in a capital-intensive growth phase at private company stage, meaning investor sentiment
      shifts could slow capital access for future rounds. Allica's investor base includes TCV,
      Blue Owl (formerly Atalaya Capital Management), Warwick Capital Partners, Ventura Capital,
      GLG, and Sona AM — a mix of growth equity and alternative credit investors whose
      reinvestment horizon and exit appetite are not publicly disclosed.
