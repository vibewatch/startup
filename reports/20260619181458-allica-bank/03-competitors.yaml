callouts:
  - calloutType: strength
    title: Established-SME exclusivity creates a deep product-market moat
    body: >
      Allica Bank is the only UK full-service digital bank built exclusively for the 5–250 employee established-SME segment. This exclusivity means every product feature, underwriting model, RM hire, and broker relationship is calibrated to this buyer—creating a depth of specialisation that Tide, Starling, and incumbents cannot easily replicate from their more generalist positions. The 133% year-on-year BRA customer growth to more than 14,000 accounts by end-2025, combined with a 4.6/5 Trustpilot rating and a savings rate of up to 4.08% AER, demonstrates that the proposition resonates with its target segment.
    claimRefs: [CP001, CP006, CP007, CP009, CP043]

  - calloutType: risk
    title: Rate commoditisation and service-scaling risks require active management
    body: >
      Allica's twin growth levers—rate-leading savings and a premium RM model—are both under pressure. The Bank of England base rate normalisation compresses the savings spread; OakNorth already offers 2.35% AER without a relationship model, demonstrating that rate alone does not guarantee differentiation. Meanwhile, Allica's RM model faces a structural scaling challenge: 799 colleagues serving 14,000+ accounts at end-2025 with documented 7–10 day response-time complaints suggests that the quality of the RM relationship is not uniformly high. If the rate premium narrows and the RM model degrades, Allica risks becoming a mid-tier business account with no clear moat.
    claimRefs: [CP050, CP051, CP052, CP053, CP054, CP055]

