  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Category
      - Threat / Attack Vector
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Established-SME-exclusive positioning and brand recognition
        - Strategic positioning
        - Incumbent digital banking improvements closing UX and product gap
        - Medium
        - Track incumbent app NPS scores and digital investment budgets annually; monitor if NatWest/Barclays launch explicit established-SME branding
      - - Proprietary AI underwriting for established-SME cash-flow analysis
        - Technology / data
        - OakNorth's ACNF platform and other ML-lenders offering similar cash-flow-based underwriting
        - Medium
        - Request Allica technology documentation; benchmark decisioning speed against OakNorth; assess data lock-in from transaction history
      - - Dedicated relationship manager for every customer
        - Distribution / service
        - Costly to scale at pace; per-RM revenue must exceed RM salary and overhead; service quality risk as customer count grows
        - High
        - Analyse RM-to-customer ratio; track Trustpilot service scores quarterly; assess RM retention in Allica annual reports
      - - Broker and accountant distribution channel
        - Distribution
        - Incumbents invest in fintech/broker portals; OakNorth has active broker channel
        - Medium
        - Assess exclusivity of Allica broker relationships; count active vs inactive introducers; monitor broker commission competitiveness
      - - Rate-leading savings (up to 4.08% AER) as customer acquisition engine
        - Product / pricing
        - BOE base rate cuts compress savings spread; OakNorth at 2.35% AER; rate competition from other challengers
        - High
        - Monitor rate gap between Allica's savings pot and BOE base rate; model sensitivity under 2% base rate scenario
      - - FSCS protection up to £120,000 (above £85k industry standard)
        - Regulatory
        - FSCS threshold changes could equalise competitor cover; Tide and Starling limited to £85k currently
        - Low
        - Monitor any FCA/HMT FSCS consultation; no action required currently
      - - Full-service product bundling (current account + savings + lending + cards)
        - Product breadth
        - Starling adds structured SME credit post-IPO; Tide adds deeper lending; OakNorth expands to smaller loan sizes
        - Medium
        - Track competitor product roadmaps; flag if Starling or Tide enter SME property or asset finance
      - - Allica's established-SME switching friction advantage over incumbents
        - Behavioural / structural
        - Challenger marketing and CMA open banking initiatives erode incumbent inertia; multi-homing keeps switching costs low
        - Low–Medium
        - Track SME primary bank switching data from CMA and UK Finance; monitor Allica's share of CASS switches
    notes: "Severity ratings are qualitative assessments based on publicly available evidence as of June 2026. 'High' indicates a risk that could materially reduce Allica's competitive advantage within 12–24 months if unaddressed. 'Medium' indicates a risk that requires monitoring. 'Low' indicates a structural or regulatory feature unlikely to change in the near term."
