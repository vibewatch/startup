      - number: '6.2'
        title: Adoption Trajectory and Market Penetration
        blocks:
          - type: paragraph
            body: >
              Allica's customer base has grown rapidly across all measured dimensions. Total established SME customers
              reached over 30,000 as of the February 2026 Series D announcement, up from approximately 25,000 as at
              March 2025 per a British Business Bank announcement, and from an earlier, smaller base at licence-grant in
              2019. The year-end 2025 Annual Report reports over 14,000 active Business Rewards Account holders — up
              133% from more than 6,000 at year-end 2024 — with account holders "more than doubling" through 2025. These
              figures are consistent if the 30,000+ total customer count includes lending-only and savings-only
              relationships that do not hold a BRA, while the 14,000 active BRA count reflects only current-account
              holders who have actively transacted. Allica describes customer penetration of the established SME segment
