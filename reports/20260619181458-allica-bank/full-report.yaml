      - number: '8.4'
        title: Recommendation, Diligence Asks, and Exit Readiness
        blocks:
          - type: paragraph
            body: >
              Recommendation: Track. The $1.2bn valuation is broadly fair — it reflects Allica's proven profitability
              (third consecutive profitable year), strong 4.7% NIM, institutional-quality investor base, and positioning
              in an underserved £150–200bn UK SME banking market. The 2.5x gross-revenue multiple is modest relative to
              consumer digital bank peers and anchored by genuine operating leverage over three years. Confidence is
              medium because private-bank opacity limits independent validation: equity share count, cap table
              structure, liquidation preference tiers, AT1 instrument terms, and risk-weighted assets are undisclosed,
              preventing an independent price-to-tangible-book or full waterfall analysis.

              A strong Buy would require either a materially lower entry valuation (below £700m), an independent analyst
              corroboration of fundamentals, or direct management confirmation of the cap table mechanics. The
              recommendation could upgrade to Buy if international expansion executes cleanly, NIM remains above 4.5%,
              the loan book continues to grow above 20%, and the BRA franchise reaches 50,000+ customers — sustained
              evidence that the growth premium is justified.

              The most likely exit pathway is an IPO or strategic acquisition, consistent with TCV's technology growth
              equity mandate and Ventura Capital's portfolio-exit playbook. A UK bank IPO would require two to three
              years of additional operating history and a supportive public market environment. A strategic sale to a
              large European bank seeking an established UK SME franchise could command a scarcity premium above public
              market multiples. Thesis-break triggers and final diligence asks are itemised in the tables below.
