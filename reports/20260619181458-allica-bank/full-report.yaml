      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several structural forces are accelerating adoption of challenger SME banking, while a smaller set of
              constraints limit the pace of market share gains.

              Growth drivers: The single most important structural driver is the retreat of incumbent banks from
              relationship-based SME banking. City AM's February 2026 reporting characterised the market prior to
              challengers as "a barren wasteland" and confirmed the four largest banks held 90% of SME lending in 2019
              versus challengers' 60% share by 2026. This retreat, driven by legacy system economics and regulatory
              capital allocation, created a structural gap that Allica and peers have been filling. The collapse of SME
              overdraft provision — from £18bn (inflation-adjusted) in the late 1990s to just £2.7bn in 2024, an 80%+
              decline — is the starkest quantitative illustration of this retreat.

              Open banking and CASS: The UK's open banking framework, overseen by the FCA and OBIE, has progressively
              lowered data-sharing barriers, supporting credit assessment for SMEs with limited accounting records and
              facilitating current account switching. CASS (Current Account Switch Service) also reduces the technical
              friction of moving a primary banking relationship, though adoption among SMEs is lower than retail.

              AI underwriting: Allica's investment in AI-enabled credit decisioning is a supply-side driver reducing the
              unit cost of complex SME underwriting. The 2025 Annual Report documented 79% daily AI usage by engineering
              staff and doubling of merged pull requests in H2 2025. Over time, lower underwriting cost should expand
              SAM by making smaller-ticket or lower-margin SME relationships economically viable.

              Regulatory support: The PRA and FCA launched a joint Scale-up Unit in early 2026, with Allica in the first
              dual-regulated cohort. This unit provides out-of-cycle capital reviews and early-stage engagement on
              product launches, reducing regulatory uncertainty as challengers scale. Additionally, the PRA increased
              the Financial Services Compensation Scheme (FSCS) deposit protection limit to £120,000 in 2025,
              specifically to give SMEs greater confidence to hold deposits with challenger banks rather than
              concentrating with systemically important incumbents.

              Constraints: Low SME borrowing appetite is the most significant structural headwind. Allica's April 2025
              research ("Rebooting SME Finance") highlighted that SME appetite to borrow is at historic lows, with loan
              rejection rates also having risen and demand for external finance declining over three decades. The Bank
              of England's November 2025 Money and Credit data showed SME net borrowing of only £0.2bn — a figure that,
              while recovering to £2.0bn in March 2026, reflects the cyclical sensitivity of SME demand. Capital
              intensity is a second constraint: Allica must hold regulatory capital against its loan book, and its
              adoption of full Basel 3.1 rules (foregoing SDDT simplification) requires sustained equity issuance to
              support growth — hence the £155m Series D in February 2026. Switching cost remains material: a Trustpilot
              review analysis in June 2026 showed that even dissatisfied customers can cite the complexity of migrating
              payroll and payments as a reason to stay with incumbents. The low brand awareness — 16% in 2025 versus
              near-universal awareness for Barclays, HSBC, and NatWest — also limits inbound demand generation.
