      - number: '6.5'
        title: Expansion Path, Concentration Risks, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              Allica's growth playbook centres on the BRA as the primary relationship anchor. Once a customer opens a
              current account, the relationship manager is positioned to identify and originate lending and savings
              needs, generating multiple product touchpoints and deepening switching costs. CEO Richard Davies has
              described this full-service model as what makes Allica "the category-defining digital bank for established
              SMBs." The lending origination channel remains broker-dominated: Allica describes commercial finance
              brokers as its "largest channel for lending," with the broker NPS of +52 confirming strong intermediary
              satisfaction. The accountant channel is a growing priority, with Allica hosting accountants at events and
              providing tooling to help them refer clients. This multi-channel dependence, particularly on the
              commercial mortgage broker market, creates concentration risk if broker sentiment or market conditions
              shift. No published breakdown of direct-to-customer versus broker-originated volumes is available, nor is
              there any disclosed data on top-customer revenue concentration, loan book single-name exposure caps, or
              deposit concentration. Internationally, Allica plans to expand outside the UK for the first time using
              Series D proceeds, though no specific market or timeline has been announced as of June 2026. The BRA's
              penetration of 6% of established SMEs, against a 10% target by 2028, is achievable but requires continued
              double-digit annual growth in active account holders. Oxford Economics estimated that for every £1 million
              Allica lent to established businesses, it contributed £2.4 million in GDP, 35 jobs, and £600,000 in tax
              revenue — positioning Allica's impact narrative as well above a typical deposit-and-lend challenger.
