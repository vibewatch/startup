      - number: '4.2'
        title: Operating Cost Structure and Path to Profitability
        blocks:
          - type: paragraph
            body: >
              Total operating expenses rose 35% to £108.4m in FY2025 (FY2024: £80.3m), reflecting deliberate investment
              in sales and distribution, technology, and marketing to accelerate BRA rollout and direct-channel loan
              origination. Staff costs grew 34% to £63.3m as headcount increased 21% to 799 colleagues by year-end,
              implying a higher average cost per employee driven by a mix shift toward senior sales,
              relationship-manager, and technology hires. Depreciation and amortisation of £10.9m (up from £6.3m)
              reflects accelerating capex on proprietary loan-management software and the integration of Tuscan Capital
              (acquired 2024) and Kriya Finance (acquired 2025). Technology licence fees of £8.9m and marketing of £7.0m
              complete the investment programme targeting customer acquisition cost reduction. The underlying
              cost-to-income ratio (operating expenses excluding non-recurring items as a percentage of total operating
              income) was approximately 64.1% in FY2025, roughly in line with FY2024's estimated 64.5%, indicating that
              the operating leverage thesis has not yet materialised. Management expects leverage to improve as the BRA
              customer base scales — because the fixed technology and distribution investment is spread across more
              customers — and as broker originations convert to direct BRA relationships. However, the 35% expense
              growth (versus 32% total operating income growth) means the leverage thesis depends on continued BRA
              acceleration. Statutory profit after tax of £27.3m was £2.5m below FY2024's £29.8m solely because the
              FY2024 result benefited from a £3.2m deferred tax asset recognition; the FY2025 tax charge of £9.6m
              reflects the bank's first full year as a profitable taxpayer.
