      - number: '3.6'
        title: Adverse Evidence and Disconfirming Signals
        blocks:
          - type: paragraph
            body: >
              Several pieces of evidence challenge the bull-case competitive positioning. First, the £25/month
              low-balance fee introduced in February 2026 drew negative Trustpilot reviews immediately, including a
              reviewer who described Allica as using "interest and card cashback to draw people in" before reducing
              rates. This suggests Allica's pricing model is perceived as less transparent than marketed and may create
              churn risk among smaller-balance customers who are the most price-sensitive. Second, customer service
              response times have been cited as 7–10 days between replies for loan-related queries in June 2026 reviews,
              a significant service level gap for an SME banking relationship. Scaling the RM model without degrading
              service quality is a structural challenge: Allica had 799 colleagues at end-2025 serving more than 14,000
              business accounts, approximately one colleague per 18 customers—but not all colleagues are RMs, and the
              lending pipeline requires intensive underwriting capacity.

              Third, Starling's IPO admission particulars signal that it will invest aggressively in product depth to
              support its valuation; if Starling adds structured SME lending and relationship management post-IPO, it
              could encroach on Allica's segment from the high-volume end. Tide's 1.5 million customer base gives it a
              distribution and data advantage that Allica cannot easily replicate; if Tide adds deeper SME lending
              products, it would also compete more directly. Fourth, while incumbents' digital improvements are gradual,
              Barclays, HSBC, and NatWest are all investing in small-business digital interfaces. NatWest's FreeAgent
              integration and HSBC's Small Business Growth Programme are early examples of incumbents adding value-added
              services that reduce the differentiation gap. Finally, Allica's FSCS limit of £120,000 matches OakNorth
              and HSBC but exceeds Tide and Starling (£85,000); however, this is a parity factor rather than a durable
              moat, as regulatory changes could equalise it.
            claimRefs:
              - CP051
              - CP052
              - CP053
              - CP054
              - CP055
