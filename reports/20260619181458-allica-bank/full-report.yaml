      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Allica is led by CEO Richard Davies, who joined after senior roles at Revolut (group COO), OakNorth
              (inaugural CEO), TSB, and HSBC. Davies also sits as a non-executive director on the board of Zepz, a UK
              fintech. The board is chaired by John Maltby MBE, an experienced banking executive with prior roles as CEO
              of Williams & Glyn and Group Director of Lloyds Banking Group's Commercial Bank, and also current Chair of
              West Bromwich Building Society. James Heath serves as CFO, with a background that includes CFO roles at
              ABN AMRO UK and Cambridge & Counties Bank. Niv Subramanian joined as Deputy CEO, previously GM and CFO at
              Previse and a member of the team that built OakNorth's banking licence.

              The non-executive bench is deep. Patrice McDonald chairs the Risk Committee and serves as Senior
              Independent Director; her experience includes Global CRO at Barclays Wealth and Capital and current roles
              at Coutts and Brown Brothers Harriman Trustee Services. Tracy Dunley-Owen chairs the Audit Committee and
              also serves as NED at Euroclear UK and Simplyhealth. Paul Marston chairs the People and Remuneration
              Committee and is Allica's Consumer Duty Champion; he is also CEO of FSE Group with prior senior roles at
              Secure Trust Bank and NatWest Lombard. Patrick Magee is a NED who spent a decade at the British Business
              Bank (including as Chief Commercial Officer). Amitabh Ghatak brings CPO/CTO experience from Dojo, Molo,
              and William Hill.

              The executive committee adds commercial and operational depth: Nick Baker (Chief Commercial Officer, 15+
              years broker sector), Conrad Ford (Chief Product & Strategy Officer, founder CEO of Funding Options),
              Ravneet Shah (CTO, joined January 2020), Alan Dunmur (CRO, former Monzo financial risk director), Mitch
              Trehan (Chief Compliance Officer), Kate Valdar (General Counsel), and Patricia Otegui (Chief Internal
              Auditor). The Board approved the appointment of Niv Subramanian as Deputy CEO and Amitabh Ghatak as NED in
              2025, as well as approving the Kriya Finance acquisition. The founding leadership picture is less clear —
              Allica does not publish a founder narrative akin to challenger banks with single-founder origin stories;
              key person risk centres on Davies and Maltby.
