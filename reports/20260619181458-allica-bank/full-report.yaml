      - number: '2.2'
        title: Market Sizing — Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The UK established-SME banking market does not have a single authoritative public TAM figure. This section
              presents four independent sizing lenses and notes where they converge or conflict.

              Lens 1 — Business-count approach: Using the Oxford Economics/Allica June 2026 report, the UK
              established-SME segment contains approximately 265,000 businesses with 5–250 employees. UK Tech News
              reporting from February 2026 referenced Allica describing its target market as approximately
              500,000–600,000 businesses (implied from the 5% penetration with ~30,000 customers); this figure likely
              widens the scope to include some businesses in the 1–4 employee band that behave like established SMEs.
              Business Population Estimates data (published by the UK Department for Business and Trade) provides the
              authoritative official count, showing total UK private-sector businesses at approximately 5.5 million as
              of January 2025, of which around 265,000 had 5–249 employees.

              Lens 2 — Lending-stock approach: Allica's February 2026 overdraft launch press release states SME
              overdraft provision stood at £2.7 billion in 2024, representing 5% of total SME lending. Triangulating
              this figure implies a total SME lending stock of approximately £54 billion. This is directionally
              consistent with Bank of England Bankstats Table VSVO data on SME lending outstanding, though the exact
              published stock figure was not directly extracted for this chapter (see evidence gap EG1). At an annual
              growth rate of 3.7% (BoE March 2026 Money and Credit data), this stock grows by roughly £2bn per year at
              current rates.

              Lens 3 — Allica's own addressable lending: Allica held £3.7bn in loans as at end-2025 and claimed ~6%
              penetration. If 6% = £3.7bn, the total addressable lending wallet served by Allica's product mix would
              imply a SAM of approximately £60–65bn (across commercial mortgages, asset finance, growth finance, and
              bridging for this segment). This is plausible given the £54bn total estimate above (the discrepancy may
              reflect broader mortgage lending included in Allica's mix).

              Lens 4 — Deposit and savings wallet: Allica held £5.7bn in customer deposits at year-end 2025 at 6%
              customer penetration. Extrapolating implies total established-SME deposits across all UK banks of roughly
              £95bn. Allica's 2025 Annual Report highlighted that SMEs lose approximately £9bn annually as a result of
              incumbent banks offering poor interest rates relative to what the market could provide — a significant
              share of the potential deposit wallet that challengers are trying to capture. No independent third-party
              figure for total UK SME deposits was available in accessible public sources reviewed for this chapter.

              Macro context: The Bank of England's March 2026 Money and Credit release confirms SMEs borrowed a net £2.0
              billion in March 2026 (following only £0.5 billion in February), with an annual growth rate of 3.7%. The
              effective interest rate on new SME loans was 6.11% in March 2026. These moderate flow figures confirm
              steady but not rapid market expansion at the aggregate level — Allica is growing far faster (23% lending
              growth in 2025) by taking share from incumbents rather than riding broad market growth.
