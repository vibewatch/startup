      - number: '7.4'
        title: Operational, Execution, Model, and Technology Risk
        blocks:
          - type: paragraph
            body: >
              Allica operates a fully digital banking platform with no branch network, making technology resilience and
              data integrity central operational risks. The Annual Report identifies information security and data
              (including cyberattacks, data breaches, and unauthorised access) as a principal risk category, with
              ongoing penetration testing and threat detection in place. Model risk is an explicit principal risk:
              Allica has a low model risk appetite and performs periodic model validation and performance monitoring.
              Agentic AI loan decisioning was deployed in early 2026, significantly raising the model risk profile —
              decisions may be made at scale by AI systems before full-cycle empirical validation is possible. The
              Annual Report separately identifies AI-driven fraud and the risk of staff uploading confidential data to
              AI servers as external/emerging risks. International expansion into the US, France, and Spain incurred
              £1.3m in costs in 2025 without any market launch, indicating early-stage feasibility work rather than
              committed deployment. Kriya Finance (acquired 2025, goal: £1bn in working capital finance over three
              years) requires integration of an embedded B2B buy-now-pay-later business into Allica's regulated banking
              infrastructure, including integration with existing broker channel, loan management systems, and risk
              frameworks. Commercial finance brokers remain the primary origination channel — this concentration exposes
              Allica to broker consolidation, regulatory action against key brokers, or mass switching to a
              better-priced competitor.
