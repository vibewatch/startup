      - number: '4.5'
        title: Capital Adequacy and Regulatory Position
        blocks:
          - type: paragraph
            body: >
              Allica Bank maintained a strong capital position throughout FY2025. At 31 December 2025, the CET1 ratio
              was 13.4% and the total capital ratio was 16.8% — well above PRA minimum requirements. The Pillar 3 Report
              for FY2025 confirms Tier 1 of 15.3% and risk-weighted assets of £2.422bn, with a 12-month average
              liquidity coverage ratio of 220.8% and a net stable funding ratio of 138.8% — both substantially above the
              100% regulatory minimum. The annual report also states an LCR of 207.7% at the 31 December 2025
              point-in-time measure, reflecting the bank's conservative approach to holding liquid assets (>£1.1bn at
              the Bank of England and >£1.2bn in debt securities). The CET1 ratio declined from 14.5% in FY2024 as the
              rapidly expanding loan book (and higher risk-weighted assets) outpaced internal capital generation from
              retained earnings — a predictable dynamic for a fast-growing bank. Post-year-end, the February 2026 Series
              D capital raise provided £10.0m of additional CET1 equity and £47.0m of AT1 capital (total £57m),
              materially strengthening the capital position ahead of continued balance sheet growth and international
              expansion. AT1 capital is structured as perpetual convertible notes that convert to CET1 on regulatory
              capital triggers; Allica paid £6.9m in AT1 distributions in FY2025, which is recognised through equity
              rather than the P&L but represents a real cost of capital. Allica has chosen not to adopt the PRA's Small
              Domestic Deposit Takers (SDDT) regime given its growth ambitions, and is implementing Basel 3.1 ahead of
              the effective date, with an established programme in place. The total equity at year-end was £424.0m
              (FY2024: £376.7m), including share premium of £323.0m and £44.9m of perpetual AT1 notes. The BBB Tier 2
              facility, previously £30m and now increased to £45m in June 2026, adds regulatory capital at favourable
              cost and provides up to £150m of additional SME lending headroom.
