      - number: '3.4'
        title: Substitutes and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              The most pervasive competitor is inertia. Most UK established SMEs still bank with a Big Four incumbent
              simply because they always have, because their personal accounts are there, or because their finance
              director is unfamiliar with the switching process. The CMA has repeatedly noted that SME business account
              switching rates remain very low, with fewer than 10% of businesses switching primary bank in any given
              year, even after the Current Account Switch Service was extended to business accounts.

              Specialist lenders—invoice finance providers, asset-finance brokers, bridging lenders—address pieces of
              Allica's lending menu. They compete for individual credit facilities but not for the full relationship
              (current account + savings + lending + relationship manager) that Allica targets. Allica explicitly
              competes by bundling: an SME that banks with Allica on current account and savings is far more likely to
              be offered—and to accept—Allica's lending products.

              ClearBank is an infrastructure competitor rather than a direct-market competitor. It enables other
              fintechs and banks to offer embedded banking accounts via API; several of those fintechs serve the SME
              segment. This creates an indirect competitive vector: as embedded banking matures, SMEs may hold "bank
              accounts" with non-banks powered by ClearBank or similar rails, reducing Allica's differentiation on
              account functionality. This is a medium-term risk rather than an immediate threat.

              Internal treasury workflows also represent status-quo substitution: well-run established SMEs with
              treasury functions may keep cash in incumbent sweep accounts or premium money-market instruments rather
              than switching to a challenger. Allica's 4.08% AER instant-access rate targets this substitute directly,
              as it meaningfully outperforms standard high-street overnight rates.
            claimRefs:
