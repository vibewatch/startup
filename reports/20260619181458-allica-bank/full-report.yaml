  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Credit Risk and SME Loan Portfolio Quality
        blocks:
          - type: paragraph
            body: >
              Allica Bank's primary credit risk exposure stems from a £3,802m gross loan book (December 2025), of which
              approximately 75.6% is secured on commercial or residential property and 24.4% comprises other advances
              including growth finance and working-capital products. Stage 3 (impaired) loans reached £100.2m at
              December 2025, representing 2.6% of the gross book and a 68% increase in absolute terms from £59.5m at
              December 2024. The Group ECL provision rose 29% to £42.6m, and impairment losses recognised in the income
              statement increased 30% to £13.3m, though management characterises this as loan-book seasoning rather than
              a step-change in credit quality. Stage 3 coverage declined from 21.8% in 2024 to 18.1% in 2025, reflecting
              the greater proportion of property-secured stage 3 exposure, which carries higher collateral recovery
              rates but lowers the provisioning rate. Stage 2 (watch-list) loans reached £387.1m (10.2% of the book), up
              from £308.6m. The macro environment is a compounding risk: the Bank of England's November 2024 Financial
              Stability Report warned explicitly that "risks remain among SMEs and some highly leveraged corporate
              borrowers" from higher rates on refinancing, and that corporate bankruptcy rates in advanced economies had
              risen over the prior two years. The UK company insolvency service statistics confirm elevated insolvency
              rates in 2024-2025. Allica's loan book has not yet been through a full credit cycle, and exact NPL rates,
              loss-given- default experience, and sector-level default concentrations are not publicly disclosed.
