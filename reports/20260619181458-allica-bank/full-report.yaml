      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Valuation Stance: Fair — Track'
            body: >
              The $1.2bn Series D valuation is broadly fair at ~2.5x gross revenue and ~21x underlying PBT. Allica is
              positioned between pure fintech and traditional bank, making it attractive for long-horizon institutional
              investors who believe the SME banking premium will expand. The Track rating reflects medium confidence due
              to private-bank opacity, not fundamental weakness in the underlying business.
            calloutType: recommendation
            claimRefs:
              - CV039
              - CV040
              - CV041
          - type: callout
            title: 'Primary Kill Criterion: NIM × Credit Quality'
            body: >
              The bear case is triggered by two simultaneous events: BoE rate cuts compressing NIM below 4.0% and UK SME
              credit deterioration raising NPL above 3%. Either in isolation is manageable; together they threaten
              profitability and the growth premium that justifies the current valuation. Monitor BoE Monetary Policy
              Committee decisions and monthly SME insolvency data as leading indicators.
            calloutType: risk
            claimRefs:
              - CV034
              - CV035
              - CV038
          - type: callout
            title: 'Disclosure Limitation: Cap Table Opacity'
            body: >
              Full investment conviction requires knowing the equity share count, liquidation preference tiers, AT1
              conversion triggers, and full risk-weighted asset schedule. None are publicly disclosed. All valuation
              ranges in this chapter are therefore illustrative estimates based on comparable-company analysis and
              should not be treated as precise intrinsic value calculations.
            calloutType: assumption
            claimRefs:
