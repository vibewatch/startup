        title: Competitive, Strategic, and Governance Risk
        blocks:
          - type: paragraph
            body: >
              Allica's competitive position rests on serving UK established SMEs (5–250 employees), a segment that
              incumbents are now explicitly targeting (Lloyds, HSBC, Barclays business banking investment cycles) and
              that other challengers like OakNorth and Starling Business also address. Richard Davies (CEO) was the
              inaugural CEO of OakNorth, indicating he has direct visibility of the competitive threat but also that
              Allica's playbook is not uniquely proprietary. Board governance risk includes the resignation of director
              R Kapoor on 30 June 2025 (no reason publicly disclosed), the simultaneous appointment of two new board
              members (Ghatak and Subramanian in May 2025), and Chair John Maltby's concurrent board roles at West
