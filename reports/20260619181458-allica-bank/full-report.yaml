      - number: '3.2'
        title: Direct Digital Challenger Peers
        blocks:
          - type: paragraph
            body: >
              OakNorth UK (founded 2015) is the closest structural analogue to Allica—a profitable, FCA/PRA-authorised
              digital bank focused on growth businesses. It has lent more than £15bn since inception, attracted 400,000+
              savers, and helped create over 61,000 jobs. Its business current account carries no monthly fee and
              provides an automatic savings vault earning 2.35% AER next-day interest. However, OakNorth's business
              loans start at £1 million minimum, positioning it primarily for larger or more capital-intensive
              businesses than Allica's typical client. OakNorth's UK Trustpilot rating is 4.8/5 from nearly 20,000
              reviews, reflecting strong savings-account satisfaction but concentrated largely on personal savings
              customers, not business current account holders. Operationally, OakNorth and Allica address different deal
              sizes: Allica targets the £250k–£5m lending sweet-spot for established SMEs, while OakNorth anchors at
              £1m+.

              Tide serves 1.5 million UK small businesses, making it the largest digital challenger by customer count.
              Its model is transactional: a free basic business account with no monthly fee, FSCS protection up to
              £85,000, and an ecosystem of tools (invoicing, accounting integrations, expense management). Tide's
              Trustpilot score is 4.4/5 based on 35,000+ reviews (June 2026). However, Tide does not offer dedicated
              relationship managers, structured business lending of the depth Allica provides, or an SME-exclusive
              product set—it primarily targets micro-businesses and sole traders, not the 5–250 employee established
              cohort. Multi-homing is common: established SMEs often maintain a Tide account for payments alongside a
              primary bank for lending, meaning Tide does not displace Allica head-on.

              Starling Bank, the UK's first digital business bank account (launched March 2018), had more than 500,000
              business account holders as of its IPO admission particulars published on 15 June 2026. Its business
              current account charges no monthly fee, no UK payment fees, and no ATM fees. Starling's Trustpilot score
              of 4.2/5 (June 2026) is pulled down by growing complaints about account closures for complex transactions
              and businesses with international payment flows. Critically, Starling does not offer dedicated
              relationship managers, SME credit cards, business mortgages, or structured SME lending—gaps that Allica
              directly exploits. Starling's IPO signal (admission particulars published 15 June 2026) indicates a shift
              toward public-company governance and potentially higher near-term earnings pressure over product
              investment.
