      - number: '3.5'
        title: Moat Durability and Switching Dynamics
        blocks:
          - type: paragraph
            body: >
              Allica's moat rests on three mutually reinforcing mechanisms. First, established-SME exclusivity and brand
              differentiation: unlike Tide, Starling, or OakNorth, Allica's positioning is entirely segmented to the
              5–250 employee cohort, which means every product decision, underwriting model, and RM hire is calibrated
              to that buyer. This specialisation translates into deeper product-market fit and lower churn for the
              customers Allica wins, though it also caps the addressable market. Second, the broker and accountant
              distribution channel: Allica has built extensive relationships with commercial mortgage brokers,
              asset-finance brokers, and accountancy firms who introduce established-SME clients. This channel creates a
              structural acquisition advantage over challengers (Tide, Starling) that rely entirely on direct digital
              marketing. Incumbents have broker relationships too, but often at higher margins and with slower
              decisioning. Third, bundling lock-in: established SMEs that hold a Business Rewards Account with Allica
              and also draw a property finance or asset finance facility are operationally and financially embedded. The
              cost of switching primary bank while retaining the lending relationship is non-trivial—most SME lenders
              require the borrower's primary transactional account to be held with the same institution for covenant
              monitoring and direct debit. This creates switching costs that grow with product depth.

              Multi-homing is real and common: many established SMEs maintain an incumbent account for payments and
              payroll alongside a challenger account for savings rates. Allica's reward model (cashback on card spend,
              interest on the Savings Pot) is designed to make it the primary account—the one that receives salaries,
              pays suppliers, and earns the cashback—which raises switching costs beyond just the lending relationship.
              Nevertheless, the low contractual cost of opening a Tide or Starling account means multi-homing remains a
              structural ceiling on Allica's wallet-share growth.

              The moat is not impermeable. Rate commoditisation is the most proximate risk: as the Bank of England base
              rate falls from its 2023–24 peak, Allica's savings-rate premium compresses and the 4.08% AER headline
              becomes harder to sustain relative to incumbent improvements. OakNorth already offers 2.35% AER without a
              relationship-manager structure, and both firms face margin pressure from a normalising rate environment.
            claimRefs:
              - CP043
