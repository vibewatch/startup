      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >-
              The established SME buyer is structurally different from both retail banking customers (homogeneous,
              high-volume) and large corporate banking customers (complex with dedicated relationship teams). For
              Allica, the buyer and payer is typically the same individual: the owner-director, managing director, or
              finance director of a business with 5–250 employees. In smaller businesses (5–25 staff), the
              owner-director makes all banking decisions; in mid-sized firms (25–100+ employees), a finance director or
              head of finance may also influence or lead purchasing. External accountants and brokers are common
              influencers, particularly for lending decisions, given Allica's position as the "UK's market leader for
              broker-distributed lending" per its 2025 Annual Report.

              Segmentation within the established-SME band produces five primary buyer archetypes, each with distinct
              product priorities and adoption triggers. Asset- intensive businesses (manufacturing, construction,
              transport) prioritise asset finance and commercial mortgages; professional services firms (accountants,
              law firms, consultancies) prioritise working capital and current account; hospitality and retail operators
              need overdraft and property finance; technology scaleups need growth finance; and property businesses
              primarily use commercial mortgages and bridging finance.

              The adoption path for switching to Allica typically follows three stages: (1) a lending need or
              savings-rate dissatisfaction creates an external trigger; (2) broker referral or digital discovery brings
              awareness (brand awareness grew from 4% in 2023 to 16% in 2025 per Allica's CEO review in the 2025 Annual
              Report); (3) onboarding through a relationship manager or digital channel. Allica's strategy of offering
              an overdraft decision before requiring a current account switch (launched February 2026) is specifically
              designed to lower the initial switching barrier. The Business Rewards Account with cashback and named
              relationship managers targets the "primary bank account" switching decision, which is harder to trigger
              but creates stickier multi-product relationships.

              Switching friction remains a structural barrier. UK Finance data and FCA studies have highlighted that
              business account switching rates are lower than retail, due to integration of payroll, direct debits, and
              supplier payments with incumbent accounts. Allica's NPS of +76 (for customers who use Allica as their
              primary bank) versus a lower score for non-primary customers reflects the value of full relationship
              conversion.

              The broker channel is critical to Allica's SME acquisition model. Unlike direct- only digital challengers,
              Allica has invested in a national broker network for its lending products, which provides warm leads from
              accountants and commercial finance brokers who already have trusted relationships with SME
              owner-directors. This channel is one of the principal reasons Allica claims the position of UK market
              leader in broker-distributed SME lending.
