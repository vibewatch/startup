      - number: '3.3'
        title: Incumbent UK Business Banks
        blocks:
          - type: paragraph
            body: >
              Barclays Business is the market's anchor incumbent by brand and branch footprint. It offers the first 12
              months fee-free for new established-business accounts, then reverts to £8.50/month—a fee-first model that
              contrasts directly with Allica's rewards-first model. Barclays provides relationship managers and
              specialist sector expertise for established businesses, along with access to its Eagle Labs
              entrepreneurship ecosystem, but its legacy tariff structure and branch-centric delivery remain
              constraints. For comparison, a business spending four years with Barclays would pay at least £306 in
              monthly fees, versus zero from Allica (provided the average account balance exceeds £10,000).

              HSBC Business Banking offers free digital banking for standard electronic transfers, but its charges apply
              for CHAPS and cheques. HSBC provides FSCS protection up to £120,000—matching Allica's limit—and markets a
              Small Business Growth Programme with AI, digital-marketing, and finance training, but its business savings
              rates are not published online and are negotiated via relationship managers, making comparison and
              acquisition difficult for SMEs with no incumbent relationship. HSBC's digital banking app has improved,
              but legacy system debt remains visible in complaints data.

              NatWest provides two years of free banking on everyday transactions for new-switch businesses, with
              dedicated relationship managers for businesses with turnover exceeding £500,000. FreeAgent accounting
              software is included free, creating stickiness among smaller SMEs. However, the £500,000 RM threshold
              means approximately 80% of Allica's 5–250 employee target segment (which skews below that threshold) would
              not receive NatWest RM attention—precisely the gap Allica fills.

              Lloyds Bank is running a £200 cash switching incentive for new business account holders through July 2026,
              signalling competitive pressure from challengers. Its comprehensive credit menu (small and large business
              loans, government-backed loans, asset finance) gives incumbents a product breadth that Allica is still
              building toward on the lending side, but at the cost of pricing opacity and cross-sell complexity.
