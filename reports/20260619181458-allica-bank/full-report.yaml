  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and SME Banking Stack
        blocks:
          - type: paragraph
            body: >-
              Allica Bank is the only UK digital bank built exclusively for established SMEs (5–250 employees). Its
              product suite is anchored by the Business Rewards Account (BRA), which functions as the primary banking
              relationship layer: it pays cashback of up to 1.5% on card spend, carries a tiered savings-pot interest
              rate boosted for active primary-bank users, and provides a dedicated relationship manager. The BRA carries
              a £25/month fee for accounts with an average balance below £10,000 in the prior month — a threshold that
              may screen out smaller end-of-segment customers and is a source of friction visible in negative Trustpilot
              reviews.

              On the savings side, Allica offers both Business Savings accounts (targeting SME cash management) and
              Personal Savings accounts (fixed-rate and notice products for individuals), which serve as a retail
              deposit-gathering channel that funds the lending book.

              The lending stack is delivered through three legal entities. Allica Bank Limited (FRN: 821851) holds the
              PRA/FCA banking licence and originates commercial mortgages and business overdrafts. Allica Financial
              Services Limited (company 12784979, trading as Allica Bank Asset Finance) provides asset finance and
              growth finance, operating outside PRA/FCA regulation. Allica Bridging Finance Limited (company 10859711,
              formerly Tuscan Capital acquired in 2024) delivers bridging and short-term property finance, also
              unregulated by PRA/FCA. The 2025 acquisition of Kriya Finance added invoice finance and B2B embedded
              finance capabilities to the portfolio. Lending products are explicitly not regulated products under FCA
              rules, which limits consumer-protection overlap but is standard for commercial lending.

              In early 2026 the bank implemented price reductions across commercial mortgage and bridging products and
              simplified its lending range. Looking ahead, Allica has committed to releasing financial operations
              capabilities for SMEs in H1 2026 (expense management, bill pay, AI-powered cashflow insights) and
              deploying proprietary AI agents across the end-to-end lending lifecycle in H2 2026.
