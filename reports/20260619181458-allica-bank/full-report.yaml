    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Allica Bank Limited (company number 07706156) was incorporated in England and Wales on 15 July 2011 and
              received its full banking licence from the Prudential Regulation Authority in 2019. It is authorised by
              the PRA and regulated by both the PRA and FCA under Financial Services Register number 821851. The
              registered office is at 4th/5th Floor, 15 Worship Street, London EC2A 2DT. Allica is structured as a
              private limited company and its filing history at Companies House, including a June 2026 share capital
              allotment, confirms active corporate activity.

              The company positions itself as the only UK bank built solely for established businesses — those typically
              employing 5 to 250 staff. This cohort makes up roughly a third of UK GDP and employment, yet was long
              underserved by the large incumbent banks, whose legacy technology and operating models found the segment
              too complex and costly to serve well. Allica's response is a full-stack proprietary technology platform,
              complemented by relationship managers and scalable AI tooling, delivering both the personal touch of
              traditional banking and the efficiency of a digital challenger.

              The product set spans the full lifecycle of an established SME's banking needs. The Business Rewards
              Account (BRA) is the current account and primary banking relationship product. Business Savings captures
              deposit inflows. On the lending side, Allica offers Commercial Mortgages, Asset Finance (via Allica
              Financial Services Limited, company 12784979), Growth Finance, Bridging Finance (via Allica Bridging
              Finance Limited, company 10859711, formerly Tuscan Capital acquired in 2024), Business Overdraft, Invoice
              Finance, and Embedded Finance (added through the 2025 Kriya Finance acquisition). The company's technology
              stack underpins all channels — direct digital, relationship manager, and broker/intermediary — with a
              single multi-product, multi-channel loan-management system now fully in place across the lending
              lifecycle.
