              shows 4.89/5 from over 2,400 reviews. App store ratings are 4.7 on Apple App Store and 4.6 on Google Play.
              Against this broadly positive picture, a material adverse signal emerged in early 2026: Allica introduced
              a £25 per-month low balance fee for BRA accounts with an average balance below £10,000 (effective February
              2026, communicated November 2025). Recent Trustpilot reviews flag this fee as a negative surprise, and one
              reviewer reported customer service response times of 7–10 days between replies — inconsistent with
              Allica's RM model promise. A third reviewer noted declining savings interest (from circa 4.2% to 2.3% over
              their account's lifetime), attributing this to market rate movements. No systematic churn rate, gross
              revenue retention (GRR), or net revenue retention (NRR) data is publicly available for Allica's customer
              base; the only cohort-level proxy is the 133% year-on-year growth in active BRA holders, which confirms
