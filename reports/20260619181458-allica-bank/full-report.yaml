          - type: callout
            title: Low SME Borrowing Appetite Caps Lending Volume Growth
            body: >-
              Allica's own April 2025 research documented that SME appetite to borrow has reached historic lows, with
              rising rejection rates and declining demand for external finance over three decades. The Bank of England's
              November 2025 data showed SME net borrowing of only £0.2 billion — a signal that Allica's 23% lending
              growth in 2025 was driven entirely by market-share gains from incumbents, not by overall market expansion.
              This structural demand headwind limits the long-run lending growth rate that can be sustained.
