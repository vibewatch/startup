      - number: '5.2'
        title: Technology Architecture and Proprietary Platform
        blocks:
          - type: paragraph
            body: >-
              Allica's core operating thesis is that a proprietary, purpose-built technology stack is the essential
              enabler for solving the "complexity × volume" problem that incumbent banks cannot economically address for
              established SMEs. The stack is built and maintained entirely in-house by over 240 product and engineering
              colleagues, organised in cross-functional "single-threaded squads" — a model adopted in 2024 and extended
              in H2 2025 to include T-shaped (multi-disciplinary) engineering roles that reduce squad headcount
              requirements by approximately 25%.

              The front-end is built with React, with the design system migrated in 2025 to Tailwind CSS and the Radix
              component library, specifically to enable AI-native tooling and accelerate page-build cycles. The
              migration produced an 89% reduction in page-build times. The back-end is Kotlin with Spring Boot, the
              cloud platform is Microsoft Azure, and the architecture is event-driven microservices. The data platform
              uses Azure's suite of tools alongside ML/LLM models, enabling both operational automation and credit-risk
              analytics.

              The centrepiece of the lending infrastructure is the proprietary Loan Processing Hub, which Allica has now
              fully deployed on a multi-channel, multi-product basis across the end-to-end lending lifecycle. This
              single system spans direct digital, relationship-manager, and broker channels, covering all lending
              products including the bridging and growth finance additions. The bank delivered 3,700+ code releases in
              2025 with a platform uptime of greater than 99.5%.

              A key evidence gap is that Allica does not publicly disclose its core banking system vendor (or whether
              any third-party core banking software is used underneath the proprietary layer). The accelerated
              amortisation of legacy technology platforms (£4.6m in 2025, up from £1.5m in 2024) suggests some legacy
              system replacement is still in progress, which introduces a degree of technical transition risk that is
              not visible from external sources.
