          - type: callout
            title: Business-Count Contradiction Weakens SOM Precision
            body: >-
              Allica's stated 6% market penetration with 30,000+ customers implies a total target market of
              approximately 500,000 businesses. Oxford Economics' June 2026 report commissioned by Allica refers to
              approximately 265,000 businesses with 5–250 employees (consistent with UK BPE 2024 statistics). This
              two-fold discrepancy in the denominator is unresolved in public sources and materially affects SOM
              projections. Investors should request a reconciled market definition and verified denominator from
              management.
