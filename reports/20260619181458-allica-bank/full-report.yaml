  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Definition
        blocks:
          - type: paragraph
            body: >
              Allica Bank addresses a single, tightly defined segment: established UK SMEs with 5 to 250 employees.
              Management estimates approximately 500,000 such businesses exist across the UK, representing about
              one-third of national employment and GDP. Unlike retail neo-banks that serve any consumer or
              micro-business, and unlike investment banks that focus on larger corporates, Allica explicitly excludes
              both ends of the size spectrum to concentrate exclusively on what it terms the "established SME" (ESME)
              tier. Incumbent high-street banks find ESMEs too complex to serve profitably on legacy platforms, creating
              the gap Allica targets. The primary buyer and payer is typically the business owner or finance director;
              the user is the owner and finance team who interact with the current account, lending portal, and app. The
              company serves customers across multiple verticals — hospitality, manufacturing, care homes, professional
              services, retail, environmental services, and technology — with no publicly disclosed revenue
              concentration by vertical or geography. Customers access Allica via three primary routes: the Business
              Rewards Account (BRA) current account, secured and unsecured commercial lending, and business savings. The
              BRA is positioned as the anchor product for the full primary banking relationship, enabling Allica to
              access deposits that reduce funding costs while building the cross-sell pipeline. Allica holds offices in
              London, Milton Keynes, and Manchester, and deploys regional relationship managers across the UK rather
              than serving solely through digital-only channels.
