  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >
              Allica Bank completed a $155 million Series D financing in February 2026, valued at approximately $1.2
              billion (roughly £950 million at prevailing exchange rates), crossing the unicorn threshold. The round
              comprised a mix of common equity and Additional Tier 1 (AT1) capital, with new investors Ventura Capital
              (Dubai-based, portfolio includes Uber and Spotify), GLG, and Sona AM joining existing shareholders TCV and
              Blue Owl (formerly Atalaya Capital Management). Pre-Series D principal equity holders were Warwick Capital
              Partners, TCV, and Blue Owl. The capital is earmarked for continued UK lending growth, AI investment, and
              a first international expansion into unnamed European markets.

              Placed against the FY2025 operating scorecard — £371.3m gross revenue (+27% year-on-year), £43.7m
              underlying pre-tax profit (+34%), £3.742bn loan book (+23%), £5.7bn deposits, and a net interest margin of
              4.7% — the $1.2bn valuation implies approximately 2.5x price-to-gross-revenue and approximately 21x
              price-to-underlying-PBT. At end-2025, the CET1 capital ratio was 13.4% and total capital ratio 16.8%, both
              well above regulatory minimums, with the BBB increasing its Tier 2 facility to £45m in June 2026. The
              investor mix blends technology-growth equity (TCV), credit-oriented capital (Blue Owl, Sona AM), and a
              Gulf-based strategic fund (Ventura Capital), lending institutional quality to the round. No independent
              public analyst has yet established formal coverage or a price target.
