  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The UK business banking competitive landscape for the 5–250 employee established-SME segment divides into
              four layers. First, Allica Bank stands alone as the only full-service, FCA/PRA-authorised digital bank
              that exclusively targets this cohort, offering current accounts, savings, property finance, asset finance,
              growth finance, invoice finance, and overdrafts under one roof with dedicated relationship managers for
              every customer. Second, other digital challengers—OakNorth (UK business banking and bespoke lending), Tide
              (1.5 million accounts, primarily micro and sole-trader), and Starling Bank (500,000+ business accounts,
              primarily start-up and small business)—address adjacent segments but none replicates Allica's
              full-relationship, established-SME-exclusive model. Third, the incumbent Big Four—Barclays, HSBC, NatWest,
              and Lloyds—retain majority SME market share by deposit volume, branch network, and brand trust, but are
              structurally disadvantaged for established SMEs by legacy pricing, declining relationship-manager coverage
              at sub-£500k turnover, and constrained credit appetites following the post-2008 pullback. Fourth,
              ClearBank operates as a wholesale banking infrastructure provider serving other fintechs and banks via
              API; it does not compete directly for SME current accounts. The status quo—established SMEs defaulting to
              an incumbent where they hold a personal account, or maintaining a current account alongside a fragmented
              mix of specialist lenders—remains the largest competitor by inertia. Allica's 2025 Trustpilot rating of
              4.6/5 and its position as the "UK's most recommended business bank" (more than 4,000 business nominations)
              underpin its NPS-driven growth thesis.
