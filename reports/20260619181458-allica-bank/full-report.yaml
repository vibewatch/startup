companyProfile:
  summary: >-
    Allica Bank is a UK-licensed digital bank authorised by the PRA and FCA since 2019, built exclusively for
    established SMEs — typically businesses employing 5 to 250 people. It combines relationship managers with a
    full-stack proprietary technology platform to deliver commercial mortgages, asset finance, growth finance, bridging
    finance, invoice finance, embedded credit, and business deposit products. In February 2026, the company crossed the
    unicorn threshold with a $155m Series D at approximately $1.2bn valuation. Allica reported its third consecutive
    profitable year in FY2025 with £371.3m gross revenue, £43.7m underlying pre-tax profit, and a £3.7bn loan book,
    serving over 30,000 SME customers across the UK.
