          - type: callout
            title: FSCS Protection Uplift Removes Key Challenger Deposit Barrier
            body: >-
              The PRA's 2025 decision to raise the FSCS deposit protection limit to £120,000 specifically addresses the
              trust barrier that caused SMEs to concentrate deposits with incumbent banks. This regulatory change is a
              direct tailwind for Allica's deposit growth and reduces the competitive disadvantage challenger banks
              faced on the liability side of the balance sheet.
            calloutType: strength
            claimRefs:
              - CM033
