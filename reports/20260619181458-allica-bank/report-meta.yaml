companyProfile:
  summary: >-
    Allica Bank is a UK-licensed digital bank authorised by the PRA and FCA since 2019,
    built exclusively for established SMEs — typically businesses employing 5 to 250 people.
    It combines relationship managers with a full-stack proprietary technology platform to
    deliver commercial mortgages, asset finance, growth finance, bridging finance, invoice
    finance, embedded credit, and business deposit products. In February 2026, the company
    crossed the unicorn threshold with a $155m Series D at approximately $1.2bn valuation.
    Allica reported its third consecutive profitable year in FY2025 with £371.3m gross revenue,
    £43.7m underlying pre-tax profit, and a £3.7bn loan book, serving over 30,000 SME customers
    across the UK.
  foundedDate: '2011-07-15'
  founders: []
  foundingLocation: London, UK
  headquarters: London, UK
  productSummary: >-
    Business Rewards Account (primary SME current account), Business Savings, Commercial
    Mortgages, Asset Finance, Growth Finance, Bridging Finance (via Allica Bridging Finance /
    Tuscan Capital), Invoice Finance, Embedded Finance (via Kriya acquisition), and Business
    Overdraft — all delivered through direct digital, relationship-manager, and broker channels
  customerFocus: >-
    UK established SMEs with 5–250 employees, spanning all major industry sectors and
    all regions including rural and non-London markets underserved by incumbent banks
  businessModel: >-
    Interest-spread-driven bank: earns net interest margin (4.7% in FY2025) on a £3.7bn
    commercial loan book funded primarily by SME deposits, with fee income from BRA
    interchange and broker origination providing secondary revenue lines
  stage: Series D
  fundingStatus: >-
    $155m Series D (Feb 2026) at ~$1.2bn valuation with investors TCV, Blue Owl, Ventura
    Capital, GLG, and Sona AM; preceded by British Business Bank Tier 2 facilities (£45m)
    and a Series C equity round of approximately £100m (Dec 2022)
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CO006, CI001, CI002, CV001, CV002, CU001]

summary:
  headline: >-
    Allica Bank is a profitable UK SME challenger bank at unicorn scale with strong
    growth momentum; the investment case is supported by sustainable NIM and three
    profitable years but capped by credit-cycle risk, declining capital ratios, and
    private-company opacity.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 1200
    revenueRunRateUsdM: 471
    arrUsdM: null
    revenueGrowthYoYPct: 27
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: 30000
    headcount: 799
  topStrengths:
    - >-
      Three consecutive profitable years with 27% gross revenue growth and £43.7m underlying
      PBT at a 4.7% NIM demonstrate sustainable lending economics before a full credit-cycle
      test
    - >-
      Exclusive focus on the 265,000-firm UK established-SME segment creates a defensible
      niche with differentiated distribution (relationship managers + broker network) that
      neither incumbent banks nor pure-digital challengers replicate
    - >-
      $155m Series D at ~$1.2bn from institutional investors (TCV, Blue Owl, Ventura Capital)
      provides capital runway for AI investment, international expansion, and UK loan-book growth
    - >-
      Full-stack proprietary technology platform with a single multi-product loan-management
      system removes legacy tech drag and enables AI-assisted underwriting and customer
      onboarding at scale
  topRisks:
    - >-
      Loan book has not been through a full credit cycle; Stage 3 impaired loans rose 68%
      to £100.2m (2.6% of book) and Stage 2 watch-list loans reached £387m in an elevated
      UK SME insolvency environment
    - >-
      CET1 capital ratio declined from 14.5% to 13.4% as RWA growth outpaced capital
      accumulation; at current 23% loan-book growth, additional dilutive capital raises
      are likely within 12–18 months
    - >-
      Private-company opacity — undisclosed equity cap table, investor terms, per-product
      margins, and complaint volumes — materially limits underwriting confidence and
      complicates portfolio monitoring
    - >-
      Early-stage international expansion (£1.3m sunk costs, no market yet launched) and
      Kriya Finance integration add execution risk on top of organic UK growth demands
  unresolvedGaps:
    - >-
      Exact NPL default rates, loss-given-default experience, and sector-level loan
      concentration are not publicly disclosed; full-cycle credit loss performance
      remains unobserved
    - >-
      International expansion market targets, launch timeline, and capital earmarked
      for European entry have not been publicly disclosed beyond general Series D intent
    - >-
      Cumulative lifetime equity raised and pre-Series D investor ownership structure
      are not confirmed in public sources
    - >-
      Volume and nature of FCA/FOS complaints, regulatory outcome of the February 2026
      low-balance fee, and customer-service SLA performance are not disclosed
