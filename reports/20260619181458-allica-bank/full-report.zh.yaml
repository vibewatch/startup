    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - NIM 压缩
        - NIM 连续两个报告期低于 4.2%
        - 收入和 PBT 下滑；增长溢价侵蚀后倍数收缩
        - 重新评估；若持续，将确信度下调至回避
      - - 信用损失激增
        - NPL 比率超过 3%，或任意 12 个月贷款减值 >£30m
        - 盈利能力被侵蚀；CET1 缓冲被消耗；融资条款稀释
        - 退出触发项；跟踪 BoE 月度信贷数据和中期业绩
      - - 管理层离任
        - CEO 或 CFO 离任且无计划内继任安排
        - 执行风险上升；投资者对战略的信心动摇
        - 红旗；纳入复核；等待管理层沟通
      - - 金融科技倍数压缩
        - 可比数字银行收入倍数跌破 2x
        - 将 Allica 隐含估值标至 £742m 以下——低于 Series D 入场
        - 更新模型；判断基本面是否需要重定价
      - - 国际扩张成本超支
        - 核销或异常成本超过 £20m，或扩张延迟 >24 个月
        - 将资本从盈利的英国核心业务中抽走；管理层分心
        - 重新评估国际业务对增长论点的贡献；要求披露成本上限
      - - 监管资本违规
        - CET1 低于 10%，或 PRA 发布资本指令
        - 表明信用损失或快速增长正在消耗资本；存在股权稀释风险
        - 立即启动退出复核；监控 PRA 监管函件
    notes: |
      阈值是作者定义的监控触发项，并非正式契约。它们基于 FY2025 基线（CET1 13.4%、NIM 4.7%、NPL < 1%）和英国银行常见早期预警指标。
    claimRefs:
      - CV010
      - CV011
      - CV033
      - CV034
      - CV035
