      - number: '4.2'
        title: 运营成本结构与盈利路径
        blocks:
          - type: paragraph
            body: >
              FY2025 总运营费用增长 35% 至 £108.4m（FY2024：£80.3m），反映公司有意加大销售与分销、技术和营销投入， 以加速 BRA 推广和直接渠道贷款发放。年末员工数增长 21% 至 799
              人，员工成本增长 34% 至 £63.3m； 人员结构转向更资深的销售、关系经理和技术岗位，推高了平均单人成本。折旧与摊销从 £6.3m 升至 £10.9m， 反映自有贷款管理软件资本开支加速，以及 Tuscan
              Capital（2024 年收购）和 Kriya Finance（2025 年收购）的整合。 £8.9m 技术许可费和 £7.0m 营销费用，构成以降低获客成本为目标的投资计划。FY2025 基础成本收入比
              （不含非经常性项目的运营费用占总经营收入比例）约为 64.1%，与 FY2024 估计的 64.5% 大致持平， 说明经营杠杆假设尚未兑现。管理层预计，随着 BRA
              客户基数扩大——固定技术和分销投入可分摊到更多客户—— 以及经纪发起业务转化为直接 BRA 关系，杠杆会改善。但费用增长 35%（高于总经营收入 32% 的增速）， 意味着杠杆逻辑依赖 BRA
              继续加速。法定税后利润 £27.3m，比 FY2024 的 £29.8m 低 £2.5m， 仅因 FY2024 受益于 £3.2m 递延所得税资产确认；FY2025 £9.6m
              税费反映银行首次全年作为盈利纳税主体运营。
