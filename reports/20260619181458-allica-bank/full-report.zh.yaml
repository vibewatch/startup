        - 总收入倍数约 2.5x，相比金融科技同业不高；入场纪律仍在
        - 若 Allica 未达增长目标且可比公司估值下修，倍数会显得偏紧
      - - 正向论点
        - 机构级投资者财团（TCV、Blue Owl、Ventura Capital、GLG、Sona AM）
        - 若财团仅由内部人组成，且二级市场没有独立价格发现，则削弱判断
      - - 反向论点
        - 2021 至 2024 年全球金融科技倍数压缩 40–60%；仍有进一步正常化风险
        - 若英国金融科技倍数受 IPO 管线或宏观复苏带动回升，情绪会转正
