  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权栈
        - 股权股数、清算优先权层级、反稀释权利
        - 瀑布分析和真实股权估值需要这些数据；当前不透明度阻碍判断
        - 向管理层索取；以 Companies House 配股文件作为代理
      - - 市价 / 有形账面价值计算
        - 完整风险加权资产明细和有形账面价值
        - P/TBV 是私人银行估值的标准指标；公开数据无法计算
        - FY2025 Pillar 3 报告（部分）；向管理层索取 RWA 表
      - - AT1 工具条款
        - 票息率、转换 / 减记触发项、到期 / 赎回结构
        - 压力情景下 AT1 会稀释普通股回报；条款决定影响
        - 年报注释；Companies House 工具披露；管理层
      - - 国际扩张计划
        - 目标市场、所需监管批准、资本成本、收入时间表
        - 对近期成本和 FY2026–2027 利润假设有实质影响
        - 管理层；新闻稿公告；FCA/ECB 授权文件
      - - FY2026 中期业绩
        - 2026 年上半年净息差、贷款增长、信用质量、成本运行率
        - 验证 FY2025 轨迹是否延续；降低基准场景风险
        - Allica Bank 投资者关系；年报周期（约 2027 年 Q1 发布）
      - - 独立分析师或评级覆盖
        - 独立第三方的信用评级或股票研究报告
        - 可为 Allica 基本面和估值提供外部验证
        - Bloomberg / Moody's / Fitch；如有，查 FCA 授权文件；向管理层索取
    notes: |
      尽调问题按其对估值分析的重要性排序。第 1–3 项会阻断高确信度投资建议。第 4–6 项重要，但不妨碍给出跟踪建议。
    claimRefs:
      - CV015
      - CV016
      - CV036
      - CV041
      - CV045
