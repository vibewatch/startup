  - id: FO002
    title: Allica Bank 商业模式逻辑
    type: flow
    layout: standard
    summary: Allica 如何把客户分层、产品栈、技术平台和监管框架组合起来，交付 SME 银行服务主张。
    data:
      nodes:
        - id: seg
          label: 成熟 SME（5–250 名员工）
          description: 核心客群——业务复杂度超过零售银行服务范围，但规模又小于传统大行企业银行门槛的企业。
        - id: channels
          label: 获客渠道
          description: 直接数字化开户、关系经理（外勤 / 区域）以及经纪人 / 中介网络。
          dependsOn:
            - seg
        - id: products
          label: 全栈产品套件
          description: BRA（活期账户）、企业储蓄、商业按揭、资产融资、增长融资、过桥融资、发票融资、企业透支。
          dependsOn:
            - channels
        - id: tech
          label: 自有技术平台
          description: 单线程小队模式；多渠道、多产品贷款管理系统；AI 驱动的决策和客户关系工具。
          dependsOn:
            - products
        - id: regulation
          label: PRA/FCA 监管框架
          description: 获准作为吸收存款银行运营；受资本充足率、流动性和 Consumer Duty 规则约束；Scale-Up Unit 首批成员。
          dependsOn:
            - tech
        - id: capital
          label: 资本和融资基础
          description: 股权（Warwick CP、TCV、Blue Owl、Ventura、GLG、Sona AM）；BBB Tier 2（£45m）；客户存款（£5.7bn）。
          dependsOn:
            - regulation
      edges:
        - from: seg
          to: channels
          label: 进入目标市场
        - from: channels
          to: products
          label: 获客
        - from: products
          to: tech
          label: 由此赋能
        - from: tech
          to: regulation
          label: 在框架内运营
        - from: regulation
          to: capital
          label: 资本要求塑造
