      - number: '5.5'
        title: 证据缺口、产品限制与技术风险
        blocks:
          - type: paragraph
            body: >-
              若干重要证据缺口限制了尽调图景。第一，Allica 未披露任何核心银行平台供应商身份，加速摊销费用说明某些第三方遗留基础设施仍在主动退出。 自有层是建立在商业核心银行引擎（如 Temenos、Thought
              Machine 或类似系统）之上，还是完全内部自建，公开来源无法判断。 第二，AI 贷款基础设施使用的具体承保模型、信用评分算法和模型验证框架没有公开描述，外部来源无法独立评估模型风险。 第三，Allica
              没有披露安全认证（ISO 27001、SOC 2、Cyber Essentials），对于这一规模的银行并不典型， 也增加了供应商和企业客户尽调难度。第四，FOS 投诉量和 PRA
              监管发现缺少足够公开细颗粒度，无法独立评估运营风险质量。

              产品侧，BRA 的 £25/月最低余额费用设置了门槛，排除了目标客群下沿（平均月余额低于 £10,000 的企业），
              且返现计划排除银行转账（只有卡支付符合条件），意味着对于主要支出基于转账的企业，奖励结构吸引力较弱。 发票融资和嵌入式金融产品线（通过 Kriya）仍处早期，尚未规模化；Kriya 基础设施与 Allica
              平台的技术整合仍在进行， 且没有公开披露详细路线图或整合时间表。
