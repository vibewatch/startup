      - number: '3.6'
        title: 负面证据与反证信号
        blocks:
          - type: paragraph
            body: >
              几项证据挑战了看多情景中的竞争定位。第一，2026 年 2 月推出的 £25/月低余额费立即引发 Trustpilot 负面评论，其中一位评论者称 Allica 先用“利息和银行卡 cashback
              把人吸引进来”，再降低利率。这说明 Allica 的定价模式可能被认为不如营销中透明，并可能在余额较小、价格最敏感的客户中制造流失风险。第二，2026 年 6 月评论提到，贷款相关咨询两次回复之间要等 7–10
              天，这对 SME 银行关系而言是显著服务水平缺口。在不降低服务质量的前提下扩张 RM 模式，是结构性挑战：Allica 2025 年末有 799 名同事，服务超过 14,000 个企业账户，约每 18
              名客户对应一名同事——但并非所有同事都是 RM，贷款 pipeline 还需要密集承保能力。

              第三，Starling 的 IPO admission particulars 表明，它将积极投入产品深度以支撑估值；如果 Starling 在 IPO 后加入结构化 SME 贷款和关系管理，可能从高量端侵入
              Allica 的细分市场。Tide 的 1.5 百万客户基础给它带来分销和数据优势，Allica 难以轻易复制；如果 Tide 加入更深的 SME
              贷款产品，也会更直接竞争。第四，尽管传统大行的数字改善循序渐进，Barclays、HSBC 和 NatWest 都在投资小企业数字界面。NatWest 的 FreeAgent 集成和 HSBC 的 Small
              Business Growth Programme，是传统大行增加增值服务、缩小差异化缺口的早期例子。最后，Allica 的 FSCS 上限 £120,000 与 OakNorth 和 HSBC 持平，高于
              Tide 和 Starling（£85,000）；不过，这是平价因素，不是耐久护城河，因为监管变化可能拉平差距。
            claimRefs:
