      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              成熟型 SME 买方在结构上不同于零售银行客户（同质、高量）和大型企业银行客户（复杂、有专属关系团队）。对 Allica 来说，买方和付款人通常是同一个人：拥有 5–250
              名员工企业的业主董事、董事总经理或财务董事。在较小企业（5–25 名员工）中，业主董事决定所有银行事项；在中型企业（25–100+
              名员工）中，财务董事或财务负责人也可能影响或主导采购。外部会计师和经纪人是常见影响者，尤其在贷款决策中；Allica 2025 年报称其是“英国经纪分销贷款市场领导者”。

              成熟型 SME
              区间内部可分出五类主要买方画像，各自有不同产品优先级和采用触发因素。重资产企业（制造、建筑、运输）优先看资产融资和商业按揭；专业服务公司（会计师事务所、律所、咨询公司）优先看营运资本和往来账户；酒店餐饮和零售经营者需要透支和物业融资；科技
              scaleup 需要成长融资；房地产企业主要使用商业按揭和过桥融资。

              切换到 Allica 的采用路径通常有三步：（1）贷款需求或储蓄利率不满形成外部触发；（2）经纪推荐或数字发现带来认知（Allica CEO 在 2025 年报中称，品牌认知度从 2023 年的 4% 提升到
              2025 年的 16%）；（3）通过客户经理或数字渠道完成开户。Allica 在 2026 年 2 月推出的策略，是先给透支决定，再要求切换往来账户，专门用来降低最初切换门槛。带有 cashback
              和具名客户经理的 Business Rewards Account 瞄准“核心银行账户”切换决策；这类决策更难触发，但一旦成功，会形成更黏的多产品关系。

              切换摩擦仍是结构性障碍。UK Finance 数据和 FCA 研究都指出，企业账户切换率低于零售账户，原因是工资、直接借记和供应商付款与传统大行账户深度绑定。Allica 的 NPS 为 +76（使用
              Allica 作为核心银行的客户），高于非核心客户分数，反映出完整关系转换的价值。

              经纪渠道对 Allica 的 SME 获客模型至关重要。不同于只做直接数字渠道的挑战者，Allica 为贷款产品投入建设全国经纪网络，从会计师和商业金融经纪人那里获得暖线索；这些人已经与 SME
              业主董事建立信任关系。这个渠道是 Allica 声称自己处于英国经纪分销 SME 贷款市场领导地位的主要原因之一。
