      - number: '4.4'
        title: 融资结构与存款策略
        blocks:
          - type: paragraph
            body: >
              FY2025 客户存款增长 29% 至 £5.72bn，构成银行主要且近乎唯一的资金来源。融资结构发生了对长期盈利质量很关键的转变： BRA 活期账户余额增长 138% 至 £1.79bn，占总存款
              31%（FY2024 为 17%）；SME 存款合计达到总存款的 71%（FY2024 为 47%）。个人储蓄存款从 £2.33bn 降至 £1.66bn，因为 Allica 将个人存款增长降级， 转而深化
              SME 银行关系。转向 BRA 存款降低了综合资金成本：相较定期存款，BRA 活期账户利息成本更低或为零， 直接压低利息支出并改善 NIM。存款利息支出为 £190.6m，意味着存款基础平均成本约
              3.3–3.8%——仍具竞争力， 且随着 BRA 占比提升而下降。贷款之外的存款盈余（贷存比约 65%）投向 £2.44bn 流动资产，包括在 Bank of England 的逾 £1.1bn 余额和逾
              £1.2bn 投资级债务证券。存款服务和交易手续费增至 £5.2m（此前 £0.8m）， 反映 BRA 扩张期的服务开销；随着账户基础成熟，单账户成本应下降。活跃 BRA 客户翻倍以上至逾 14,000 个，
              与成熟 SME 的主办银行关系加深，并通过直接渠道推动贷款产品交叉销售。2026 年 6 月，British Business Bank 将其向 Allica 提供的 Tier 2 资本额度提高至
              £45m，支持最多 £150m 的额外 SME 贷款——既是对 Allica 信用质量的机构背书，也通过以有竞争力成本补充监管资本带来综合融资收益。
