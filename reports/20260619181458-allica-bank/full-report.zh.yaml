      - number: '6.5'
        title: 扩张路径、集中度风险与证据缺口
        blocks:
          - type: paragraph
            body: >
              Allica 的增长打法以 BRA 作为主办关系锚点。客户开通活期账户后，关系经理可识别并发起贷款和储蓄需求， 形成多个产品触点并加深切换成本。CEO Richard Davies 曾称，这种全服务模式让
              Allica 成为「面向成熟 SMB 的品类定义型数字银行」。 贷款发放渠道仍以经纪为主：Allica 称商业金融经纪是其「最大的贷款渠道」，经纪人 NPS +52 也确认中介满意度较强。
              会计师渠道是增长重点，Allica 举办会计师活动，并提供工具帮助他们推荐客户。这种多渠道依赖，尤其是对商业按揭经纪市场的依赖，
              如果经纪情绪或市场条件变化，会形成集中度风险。公司未发布直接面向客户与经纪发起量的拆分，也未披露大客户收入集中度、 贷款账簿单一客户敞口上限或存款集中度。国际方面，Allica 计划用 Series D
              资金首次扩展到英国以外， 但截至 2026 年 6 月尚未宣布具体市场或时间表。BRA 在成熟 SME 中 6% 的渗透率，相比 2028 年 10% 的目标可达，
              但需要活跃账户持有人继续保持两位数年增长。Oxford Economics 估计，Allica 每向成熟企业贷出 £1 million， 就贡献 £2.4 million GDP、35 个就业岗位和
              £600,000 税收——使 Allica 的影响叙事显著高于典型存贷型挑战者。
