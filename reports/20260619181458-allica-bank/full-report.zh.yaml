      - number: '7.4'
        title: 运营、执行、模型与技术风险
        blocks:
          - type: paragraph
            body: >
              Allica
              运营全数字银行平台，没有网点网络，技术韧性和数据完整性因此成为核心运营风险。年报把信息安全和数据（包括网络攻击、数据泄露和未授权访问）列为主要风险类别，并持续开展渗透测试和威胁检测。模型风险也是明确的主要风险：Allica
              对模型风险的容忍度低，并定期做模型验证和性能监控。Agentic AI 贷款决策在 2026 年初上线，显著抬高了模型风险画像——AI 系统可能先大规模做出决策，完整周期的经验证据验证尚未完成。年报还单独列出
              AI 驱动欺诈，以及员工把机密数据上传至 AI 服务器的风险，作为外部 / 新兴风险。面向美国、法国和西班牙的国际扩张在 2025 年发生 £1.3m
              成本，但没有任何市场落地，说明仍是早期可行性工作，而非已承诺部署。Kriya Finance（2025 年收购，目标：三年内提供 £1bn 营运资金金融）需要把嵌入式 B2B 先买后付业务接入 Allica
              受监管的银行基础设施，包括对接现有经纪渠道、贷款管理系统和风险框架。商业金融经纪人仍是主要获客渠道——这种集中度让 Allica
              暴露在经纪行业整合、监管对关键经纪人采取行动，或客户大规模转向价格更优竞争者的风险中。
