  - id: FR001
    title: 风险热力图——可能性 vs. 影响
    type: matrix
    layout: standard
    summary: |
      按可能性和影响对 Allica Bank 主要风险类别做二维定位；剩余风险反映正在执行的缓释措施。
    data:
      columns:
        - 可能性：高
        - 可能性：中
        - 可能性：低
      rows:
        - label: 影响：关键
          values:
            - 贷款增长下 CET1 比率下降；经纪人渠道集中；核心银行系统中断
            - SME 破产周期；Consumer Duty 执法；Kriya 整合失败
            - FCA/PRA 牌照限制；AI 模型故障
        - label: 影响：高
          values:
            - ECL 拨备增长；SME 存款资金成本上升；行为投诉激增
            - Basel 3.1 资本重新校准；运营模型风险；国际扩张失败
            - 董事会领导层变动；气候 / EPC 抵押品风险
        - label: 影响：中
          values:
            - 传统银行竞争回应；BoE 降息下 NIM 压缩
            - 数据质量失效（IFRS 9 输入）；存款利率透明度投诉
            - 地缘政治供应链风险；经纪人监管行动
    approximationNotes: |
      风险定位为作者基于 Allica Bank 2025 年年报主要风险和 BoE 2024 年 11 月 FSR 做出的定性评估。剩余风险位置反映已披露的缓释措施；实际可能性取决于宏观经济路径。
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR042
      - CR043
      - CR009
      - CR044
  - id: FR002
    title: 风险传导图——风险如何流向收入和估值
    type: dag
    layout: wide
    summary: |
      有向图展示宏观和运营风险因子如何通过信贷质量、资本、监管和品牌渠道，传导至 Allica 的收入增长和估值。
    data:
      nodes:
        - id: sme-cycle
          label: 英国 SME 信贷周期恶化
          risk: 高
        - id: rate-env
