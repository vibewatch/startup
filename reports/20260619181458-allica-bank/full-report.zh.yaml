    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Allica Bank Limited（公司编号 07706156）于 2011 年 7 月 15 日在英格兰和威尔士注册成立，并于 2019 年获得 Prudential Regulation
              Authority 颁发的完整银行牌照。它获 PRA 授权，并由 PRA 和 FCA 双重监管，Financial Services Register 编号为 821851。注册地址位于 4th/5th
              Floor, 15 Worship Street, London EC2A 2DT。Allica 采用私人有限公司架构；Companies House 的备案记录，包括 2026 年 6
              月的股本配发，确认公司活动仍然活跃。

              公司把自己定位为英国唯一一家只为成熟型企业打造的银行——这类企业通常有 5 至 250 名员工。该群体约贡献英国 GDP
              和就业的三分之一，却长期被大型传统银行服务不足；传统大行的旧技术和运营模式，使它们觉得这一客群过于复杂、服务成本太高。Allica 的回应是一套全栈自研技术平台，再叠加客户经理和可规模化的 AI
              工具，把传统银行的人情味和数字挑战者的效率放在一起。

              产品组合覆盖成熟型 SME 银行需求的完整生命周期。Business Rewards Account（BRA）是往来账户，也是核心银行关系产品。Business Savings 吸收存款流入。贷款侧，Allica
              提供 Commercial Mortgages、Asset Finance（通过 Allica Financial Services Limited，公司 12784979）、Growth
              Finance、Bridging Finance（通过 Allica Bridging Finance Limited，公司 10859711，前身为 2024 年收购的 Tuscan
              Capital）、Business Overdraft、Invoice Finance 和 Embedded Finance（通过 2025 年收购 Kriya Finance
              加入）。公司的技术栈支撑所有渠道——直接数字、客户经理、经纪 / 中介；一套单一的多产品、多渠道贷款管理系统已贯穿整个贷款生命周期。
