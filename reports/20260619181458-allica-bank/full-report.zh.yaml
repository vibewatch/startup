      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              多股结构性力量正在加速挑战者 SME 银行的采用，另有一组较小约束限制份额提升速度。

              增长驱动因素：最重要的单一结构性驱动，是传统大行退出基于关系的 SME 银行业务。City AM 2026 年 2 月报道将挑战者出现前的市场形容为“一片荒原”，并确认四大银行在 2019 年持有 90% 的
              SME 贷款，而到 2026 年挑战者份额达到 60%。这场撤退由旧系统经济性和监管资本配置推动，留下结构性缺口，Allica 和同业正在填补。SME 透支供给崩塌，是这场撤退最鲜明的量化例证：从 1990
              年代末经通胀调整后的 £18bn，降到 2024 年仅 £2.7bn，降幅超过 80%。

              开放银行与 CASS：英国开放银行框架由 FCA 和 OBIE 监督，逐步降低了数据共享障碍，支持对会计记录有限的 SME 做信用评估，也便利了往来账户切换。CASS（Current Account Switch
              Service）同样降低迁移核心银行关系的技术摩擦，尽管 SME 中的采用率低于零售。

              AI 承保：Allica 对 AI 信贷决策的投入，是供给侧驱动因素，可降低复杂 SME 承保的单位成本。2025 年报记录，工程员工的 AI 日活使用率为 79%，2025 年下半年合并的 pull
              request 翻倍。长期看，承保成本降低应会扩大 SAM，让票额更小或利润率更低的 SME 关系也具备经济性。

              监管支持：PRA 和 FCA 于 2026 年初联合推出 Scale-up Unit，Allica 属于首批双重监管
              cohort。该部门提供周期外资本评审，并在产品发布早期介入，随着挑战者扩张降低监管不确定性。此外，PRA 在 2025 年把 Financial Services Compensation
              Scheme（FSCS）存款保护上限提高到 £120,000，专门增强 SME 将存款放在挑战者银行、而非集中放在系统重要性传统大行的信心。

              约束：SME 借款意愿低迷是最重要的结构性逆风。Allica 2025 年 4 月研究《Rebooting SME Finance》强调，SME
              借款意愿处于历史低位，贷款拒绝率也已上升，外部融资需求三十年来持续下降。Bank of England 2025 年 11 月 Money and Credit 数据显示，SME 净借款仅 £0.2bn；虽然
              2026 年 3 月回升至 £2.0bn，但这个数字反映出 SME 需求的周期敏感性。资本强度是第二个约束：Allica 必须为贷款账簿持有监管资本，并且采用完整 Basel 3.1 规则（放弃 SDDT
              简化）意味着要持续发行股权来支撑增长——这也解释了 2026 年 2 月 £155m Series D。切换成本仍然实质存在：2026 年 6 月的 Trustpilot
              评论分析显示，即便不满意，客户也会把迁移工资和支付的复杂性作为留在传统大行的理由。品牌认知度低也限制入站需求生成——2025 年为 16%，而 Barclays、HSBC、NatWest 几乎人人知道。
