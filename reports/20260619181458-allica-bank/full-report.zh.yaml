      - number: '7.2'
        title: 资本充足、融资与流动性风险
        blocks:
          - type: paragraph
            body: >
              随着风险加权资产从 £1,908m 增至 £2,422m（+27%）并超过资本积累速度，Allica 的 CET1 比率从 2024 年 12 月的 14.5% 降至 2025 年 12 月的
              13.4%。同期总资本比率从 18.8% 降至 16.8%。 截至 2025 年 12 月，PRA 设定的整体 SREP 资本要求为 14.5%，留下约 2.3 个百分点余量。年末之后， 2026 年 2 月
              Series D 融资（£10m CET1、£47m AT1）提供额外缓冲，Companies House 还记录了 2026 年 6 月 15 日一笔相当于 £3.8m
              的股份配发。持续扩表下资本比率下行，是结构性观察点： 按当前贷款增长率（账簿从 £3.1bn 增至 £3.8bn，+23%），若要维持 SREP 余量，12–18 个月内还需要进一步融资。 PRA 于 2026
              年 1 月 20 日发布 Basel 3.1 最终实施规则；Allica 选择采用标准 Basel 3.1 框架， 而非 Small Domestic Deposit
              Takers（SDDT）轻触式制度，意味着其资本要求将按 Basel 3.1 时间表重新校准。 这一转换的量化资本影响尚未公开披露。流动性指标强劲：LCR 为 207.7%（Pillar 3 平均
              220.8%），NSFR 为 138.8%，均显著高于 100% 的监管最低值，说明短期没有融资压力。2025 年客户存款增长 29% 至 £5.7bn， SME 存款占比从 47% 升至
              71%——黏性较强，但在竞争激烈的储蓄市场中，比个人零售存款更受利率影响。
