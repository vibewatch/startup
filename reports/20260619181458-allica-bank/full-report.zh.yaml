      - number: '3.2'
        title: 直接数字挑战者同业
        blocks:
          - type: paragraph
            body: >
              OakNorth UK（2015 年创立）是最接近 Allica 的结构性对照：一家盈利、获 FCA/PRA 授权、聚焦成长型企业的数字银行。成立以来，它累计放贷超过 £15bn，吸引 400,000+
              储户，并帮助创造超过 61,000 个就业岗位。其企业往来账户不收月费，并提供自动 savings vault，按 2.35% AER 赚取次日利息。不过，OakNorth 的企业贷款最低从 £1m
              起，定位主要面向比 Allica 典型客户更大或资本强度更高的企业。OakNorth UK 的 Trustpilot 评分为 4.8/5，来自近 20,000
              条评论，反映储蓄账户满意度强，但评价主要集中在个人储蓄客户，而非企业往来账户持有人。运营上，OakNorth 和 Allica 处理的交易规模不同：Allica 瞄准成熟型 SME 的 £250k–£5m
              贷款甜蜜点，而 OakNorth 锚定 £1m+。

              Tide 服务 1.5 百万英国小企业，按客户数是最大的数字挑战者。它的模式是交易型：免费基础企业账户、无月费、FSCS 保护最高 £85,000，以及一套工具生态（开票、会计集成、费用管理）。Tide 的
              Trustpilot 评分为 4.4/5，基于 35,000+ 条评论（2026 年 6 月）。不过，Tide 不提供专属客户经理，也没有 Allica 那种深度的结构化企业贷款，产品组合也不是只为 SME
              打造——它主要瞄准微型企业和个体经营者，而非 5–250 人成熟型群体。多归属很常见：成熟型 SME 往往保留 Tide 账户用于支付，同时用核心银行做贷款，因此 Tide 并不正面替代 Allica。

              Starling Bank 是英国首个数字企业银行账户（2018 年 3 月推出）。截至其 2026 年 6 月 15 日发布的 IPO admission particulars，它拥有超过 500,000
              名企业账户持有人。其企业往来账户不收月费、英国境内付款费和 ATM 费。Starling 的 Trustpilot 评分为 4.2/5（2026 年 6
              月），被复杂交易和国际付款流企业账户关闭相关投诉拉低。关键在于，Starling 不提供专属客户经理、SME 信用卡、商业按揭或结构化 SME 贷款——这些正是 Allica 直接利用的缺口。Starling 的
              IPO 信号（2026 年 6 月 15 日发布 admission particulars）意味着其转向公众公司治理，短期盈利压力相对产品投入可能上升。
