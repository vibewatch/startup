  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              英国 5–250 名员工成熟型 SME 细分市场的企业银行竞争格局分为四层。第一，Allica Bank 单独占一层：它是唯一一家全服务、获 FCA/PRA
              授权，并只瞄准这一群体的数字银行，把往来账户、储蓄、物业融资、资产融资、成长融资、发票融资和透支放在同一屋檐下，并为每位客户配备专属客户经理。第二，其他数字挑战者——OakNorth（英国企业银行和定制贷款）、Tide（1.5
              百万账户，主要服务微型企业和个体经营者）和 Starling Bank（500,000+ 企业账户，主要服务初创和小企业）——覆盖相邻细分市场，但没有一家复制 Allica 的完整关系、只服务成熟型 SME
              的模式。第三，传统 Big Four——Barclays、HSBC、NatWest 和 Lloyds——按存款规模、网点网络和品牌信任仍保有多数 SME 市场份额，但对成熟型 SME
              来说，它们受旧定价、£500k 以下营业额客户经理覆盖下降，以及 2008 年后撤退带来的信贷偏好收缩拖累。第四，ClearBank 是批发银行基础设施提供商，通过 API 服务其他 fintech
              和银行；它不直接争夺 SME 往来账户。现状——成熟型 SME 默认使用自己个人账户所在的传统大行，或在一个往来账户之外拼接一组碎片化专业贷款机构——仍然凭惯性成为最大的竞争对手。Allica 2025 年
              Trustpilot 评分 4.6/5，以及“英国最受推荐企业银行”（超过 4,000 个企业提名）的定位，支撑其 NPS 驱动增长论点。
