            title: SME 借款意愿低迷限制贷款规模增长
            body: >-
              Allica 自己 2025 年 4 月的研究记录，SME 借款意愿已处于历史低位，拒贷率上升，外部融资需求三十年来下降。Bank of England 2025 年 11 月数据显示，SME 净借款仅
              £0.2bn——这说明 Allica 2025 年 23% 的贷款增长完全来自从传统大行夺取份额，而不是整体市场扩张。这个结构性需求逆风限制了长期可持续的贷款增长率。
