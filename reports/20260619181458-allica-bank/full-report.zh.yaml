          label: 存款利率压力
          risk: 中
        - id: loan-quality
          label: 贷款账簿质量（Stage 3 / ECL）
          risk: 高
        - id: capital-adequacy
          label: 资本充足性（CET1 缓冲）
          risk: 高
        - id: nim
          label: 净息差
          risk: 中
        - id: regulatory-action
          label: 监管介入（PRA/FCA）
          risk: 中
        - id: conduct-brand
          label: 行为 / 品牌风险
          risk: 中
        - id: broker-confidence
          label: 经纪人渠道信心
          risk: 中
        - id: revenue-growth
          label: 收入和贷款账簿增长
          risk: 中
        - id: valuation
          label: 估值和下一轮融资
          risk: 中
      edges:
        - from: sme-cycle
          to: loan-quality
          label: SME 贷款账簿违约率上升
        - from: rate-env
          to: deposit-pressure
          label: BoE 降息后存款利率竞争加剧
        - from: rate-env
          to: nim
          label: BoE 降息压缩资产收益率相对存款成本的差额
        - from: deposit-pressure
          to: nim
          label: 更高存款资金成本挤压 NIM
        - from: sme-cycle
          to: capital-adequacy
          label: ECL 拨备增长消耗 CET1
        - from: loan-quality
          to: capital-adequacy
          label: Stage 3 增长需要额外 RWA 和拨备
        - from: capital-adequacy
          to: revenue-growth
          label: 资本约束限制贷款账簿增长速度
        - from: regulatory-action
          to: broker-confidence
          label: 执法行动降低经纪人转介意愿
        - from: conduct-brand
          to: broker-confidence
          label: 糟糕客户结果侵蚀经纪人的声誉风险
        - from: broker-confidence
          to: revenue-growth
          label: 经纪人渠道是主要获客来源；成交量流失打击增长
        - from: nim
          to: revenue-growth
          label: NIM 决定净利息收入轨迹
        - from: revenue-growth
          to: valuation
          label: 增长和盈利轨迹决定 IPO 或下一轮融资时的估值
    approximationNotes: |
      传导路径为定性描述；边权重未量化。基于 Allica Bank 2025 年年报和 BoE 2024 年 11 月 FSR。
    claimRefs:
      - CR006
