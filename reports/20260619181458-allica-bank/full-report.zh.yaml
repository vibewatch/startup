      - number: '4.5'
        title: 资本充足与监管位置
        blocks:
          - type: paragraph
            body: >
              FY2025 全年，Allica Bank 保持强资本位置。2025 年 12 月 31 日，CET1 比率为 13.4%，总资本比率为 16.8%——显著高于 PRA 最低要求。FY2025 Pillar 3
              Report 确认 Tier 1 为 15.3%，风险加权资产为 £2.422bn，12 个月平均流动性覆盖率为 220.8%，净稳定资金比率为 138.8%——两者均大幅高于 100% 的监管最低值。
              年报还披露 2025 年 12 月 31 日时点 LCR 为 207.7%，反映银行持有流动资产的保守做法（在 Bank of England 逾 £1.1bn，债务证券逾 £1.2bn）。CET1 比率从
              FY2024 的 14.5% 下降，因为快速扩张的贷款账簿 （以及更高的风险加权资产）跑赢了留存收益带来的内部资本生成——这是一家高速增长银行的可预期动态。 年末之后，2026 年 2 月 Series D
              融资提供 £10.0m 额外 CET1 股权和 £47.0m AT1 资本（合计 £57m）， 在继续扩表和国际扩张前显著增强资本位置。AT1 资本为永续可转债结构，在触发监管资本条件时转为 CET1；
              Allica 在 FY2025 支付 £6.9m AT1 分派，通过权益而非 P&L 确认，但这是真实资本成本。鉴于增长野心， Allica 选择不采用 PRA 的 Small Domestic Deposit
              Takers（SDDT）制度，并在生效日前实施 Basel 3.1， 且已有既定计划。年末总权益为 £424.0m（FY2024：£376.7m），包括 £323.0m 股本溢价和 £44.9m 永续 AT1
              票据。BBB Tier 2 额度此前为 £30m，2026 年 6 月提高至 £45m，以有利成本补充监管资本， 并提供最多 £150m 的额外 SME 贷款空间。
