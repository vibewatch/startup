      - number: '3.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 成熟型 SME 专属定位创造深层产品市场护城河
            body: >
              Allica Bank 是英国唯一一家专为 5–250 名员工成熟型 SME 打造的全服务数字银行。这种专属定位意味着每个产品功能、承保模型、RM 招聘和经纪关系都按这一买方校准——专业化深度是
              Tide、Starling 和传统大行从更泛化定位出发难以轻易复制的。到 2025 年末，BRA 客户同比增长 133% 至超过 14,000 个账户，叠加 4.6/5 Trustpilot 评分和最高
              4.08% AER 储蓄利率，说明该主张能够打动目标细分市场。
