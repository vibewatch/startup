      - number: '1.4'
        title: 规模、里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              Allica 的 2025 年报呈现了迄今最强的一年。总收入达到 £371.3m（同比 +27%），基础税前利润 £43.7m（+34%），扣除风险后的毛利 £145.3m（+32%），也标志着 Allica
              连续第三年盈利。贷款账簿增长 23% 至
              £3.7bn，驱动来自商业按揭（£2.4bn，+35%）、资产融资（£507m，+19%）、成长融资（£171m，+127%）和过桥融资（£121m，+85%）。客户存款增长 29% 至 £5.7bn。BRA
              增长 133%，活跃客户超过 14,000。净息差从 2024 年的 4.5% 扩至 2025 年的 4.7%。员工数达到 799 人（2025 年 12 月 31 日），账目签署日已超过 800 人。到
              2026 年 1 月，该行工程团队的 AI 日活使用率达到 79%，2025 年下半年合并的 pull request 翻倍。

              里程碑记录符合一家加速前进的银行。外部认可包括连续三年获得 Deloitte UK Technology Fast 50（2023–2025）、Sunday Times 英国增长最快私人公司奖（2024），以及
              FT 欧洲增长第二快公司（2025）。Allica 还连续四年在 CityAM Awards 获得 Bank of the Year。British Business Bank 委托 Oxford
              Economics 完成的研究发现，Allica 每贷出 £1m，就带来 £2.4m GDP、35 个就业岗位和 £600,000 税收。

              负面图景不大，但真实存在。Trustpilot 评论者（总体评分 4.6/5）抱怨 Allica 自 2026 年 2 月起向平均余额低于 £10,000 的 BRA 客户收取
              £25/月低余额费，也抱怨储蓄利率下降（称从 4.2% 降至 2.3%）。保留证据中未发现有佐证的监管执法、制裁或重大诉讼。Allica 收购 Kriya Finance 是一个需要跟踪的整合风险——CityAM
              提到，Kriya Finance 在被收购前，2024 年收入从 £16.9m 降至 £12.6m，并录得 £9m 税前亏损。该行还披露，2026 年地缘政治事件加剧了市场波动，不过董事会对其战略表达了信心。
