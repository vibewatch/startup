      - number: '6.3'
        title: 具名客户证据与关系经理模式
        blocks:
          - type: paragraph
            body: >
              Allica 在官网发布了数十个具名案例研究，覆盖八个已披露行业垂直，最新案例日期进入 2026 年。案例研究一贯将具名关系经理（RM） 作为差异化要素：每位 BRA 持有人都有一名专属具名
              RM，这是传统银行多年前已停止为 SME 细分市场提供的模式。 案例覆盖贷款产品（商业按揭、资产融资、过桥融资）以及活期账户 / 储蓄使用场景。Ashley Care Group（Norfolk 养老院） 在
              2023 年六周内为其第五家养老院拿到商业按揭，此前其他贷款方因复杂度拒绝，而其关系经理处理了这些复杂性。 Crouchers Orchards Hotel（West Sussex 酒店餐饮）在原贷款方 2022
              年退出英国后，经专业经纪推荐，通过 Allica 再融资商业按揭。 Glazing Vision（玻璃 / 制造）在 COVID-19 疫情期间其他银行不愿放贷时使用了商业按揭。Universal Tanker
              Solutions 通过资产融资经纪撮合，在略多于两小时内完成端到端资产融资交易。BRA 活期账户侧，产品页展示 Gentle Dog Food 创始人 Beate Rothon，提到 BRA
              余额赚取的储蓄利息。这些案例证明 Allica 在英国多个地区和行业有生产部署， 且均涉及具名个人和具体结果。不过，所有已发布案例都是公司发起的营销内容——独立客户参考仅限于聚合评价平台
              （Trustpilot、Smart Money People），未发现独立案例研究、采购记录或受监管行业（NHS、政府）中标记录。
