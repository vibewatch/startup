  - id: FU001
    title: Allica Bank 客户旅程地图——成熟型 SME
    type: journey-map
    layout: wide
    summary: |
      展示一家成熟 SME 如何发现、加入并加深与 Allica Bank 的关系，从最初认知一直走到多产品主银行关系。
    data:
      nodes:
        - id: awareness
          label: 认知
          description: 企业主通过经纪人、会计师推荐、品牌广告或口碑认识 Allica
        - id: consideration
          label: 考虑
          description: 潜在客户拿 BRA 功能、存款利率、现金返还和 RM 模式，与原有银行对比
        - id: application
          label: 申请
          description: 企业在线申请；RM 进行开户引导电话；账户通常几天内开立
        - id: first-product
          label: 首个产品启用
          description: 客户启用 BRA 或提取首笔贷款；与指定 RM 互动
        - id: deepening
          label: 关系加深
          description: 从活期账户交叉销售到贷款，或从贷款交叉销售到 BRA；接入 QuickBooks、费用卡
        - id: primary-bank
          label: 主银行
          description: 客户完成 CASS 全量切换；Allica 成为主银行；分层存款利率解锁
    approximationNotes: |
