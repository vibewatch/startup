      - number: '1.3'
        title: 融资历史、投资方与资本状况
        blocks:
          - type: paragraph
            body: >-
              Allica 的融资轨迹体现出机构信心稳步增强。British Business Bank 在 2022 年提供 £30m Tier 2 资本工具，并于 2026 年 6 月 9 日宣布增加
              £15m，将总额提高到 £45m，可支持最高 £150m 的额外 SME 贷款。该行还在 2022 年 12 月完成约 £100m 的 Series C 股权融资。在 Series D
              之前，这些工具是主要外部资本来源。

              2026 年 2 月，Allica 完成 $155m Series D——由普通股和一部分新的 Additional Tier 1 股权资本组成——新投资方包括 Ventura Capital（总部迪拜；也持有
              Uber 和 Spotify 股权）、GLG、Sona AM，现有投资方 TCV 和 Blue Owl（前 Atalaya Capital Management）继续跟投。本轮对 Allica 的估值接近
              $1.2bn。Series D 之前，主要股东是 Warwick Capital Partners、TCV 和 Blue Owl。这笔资本支撑英国贷款继续增长、AI
              投入加深，以及银行首次国际扩张。Companies House 于 2026 年 6 月 15 日记录的股本配发，确认 Series D 后仍有资本活动。CityAM 文章指出，这是 Allica 继整合
              Allied Irish Bank 的 SME 组合和 Tuscan Capital 之后的第三笔收购。

              监管资本方面，Allica 的 Pillar 3 报告和年报确认，截至 2025 年 12 月 31 日，资本状况强劲：CET1 比率 13.4%（总资本比率 16.8%）、Liquidity Coverage
              Ratio 220.8%、Net Stable Funding Ratio 138.8%，均明显高于监管最低要求。鉴于增长雄心，该行决定不采用 SDDT 制度，而是自生效日起采用 Basel 3.1
              规则。总资本为 £406.4m；风险加权敞口为 £2.42bn。
