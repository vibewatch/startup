  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              Allica Bank 将目标市场定义为英国成熟型 SME——通常拥有 5 至 250 名员工的企业。这些公司不同于微型企业（少于 5 名员工）和大型企业（超过 250
              名员工），后两类过去一直由不同银行模式服务。Allica 委托 Oxford Economics 完成、2026 年 6 月发布的分析，将这一细分市场量化为约 265,000 家企业，贡献英国私营部门就业的
              35% 和营业额的 37%。伦敦和东南部以外，其重要性更突出：成熟型企业占地区私营部门就业的 39–44%，而伦敦仅为 30%；在乡村地区，它们贡献一半私营部门岗位。

              纳入范围的银行服务分为四类：核心银行（往来账户、支付、透支）、负债产品（企业储蓄、通知账户、定期存款）、资产贷款（商业按揭、资产融资、成长 / 过桥融资）和营运资本（发票融资、透支、嵌入式信贷）。不属于
              Allica 直接市场的是消费者银行产品、零售按揭贷款、大型企业债务（银团贷款、资本市场）、国际 SME 银行（尽管 Series D 资金覆盖一个试点），以及个体经营者或自雇人士。

              对多数成熟型 SME 来说，现状替代方案是四大传统银行之一——Barclays、HSBC、NatWest 和 Lloyds。直到 2019 年，它们合计仍持有约 90% 的 SME 贷款。根据 CityAM
              2026 年 2 月报道，这一份额已经剧烈改变：到 2026 年，挑战者银行占市场 60%；反转由传统大行撤离网点、旧技术约束，以及战略重心转向零售按揭和大型企业推动。Allica 自己的分析认为，过去 25
              年传统大行降低 SME 贷款优先级，累积出 £65bn 的生产性信贷缺口。

              市场的关键张力在于市场规模估算口径不一致。Allica 2025 年报引用的 Experian 分析，将约 3,500 名 Allica 客户与 265,000 家拥有 5–250 名员工的英国 SME
              样本比较——这意味着该员工区间内的总可触达企业人口约为 265,000。不过，Allica 称其 30,000+ 客户对应“超过 6%”渗透率，隐含分母约 500,000。差距可能来自范围边界不同：265,000
              这个数字可能排除了 Allica 计入的 5–9 人很小企业，也可能是 Allica 的 30,000 客户数同时包含 BRA 持有人和仅贷款关系，导致部分底层企业被重复计算。
