  - id: TM004
    title: 增长驱动因素与采用约束——英国成熟 SME 银行业务
    columns:
      - 因素
      - 方向
      - 时间
      - 对 Allica 的含义
      - 尽调追问
    rows:
      - - 大行网点收缩、产品退出
        - 驱动因素
        - 2015 年以来持续；到 2026 年已成结构性趋势
        - 释放未满足需求；Allica 填补关系银行和复杂贷款的真空
        - 量化每年影响成熟 SME 客群的网点关闭数；跟踪 NatWest / Barclays SME 部门公告
      - - 挑战者银行已占 SME 贷款 60%（2019 年为 10%）
        - 驱动因素（已确认）
        - 据 CityAM，结构性迁移到 2026 年已完成
        - 验证市场机会；也说明挑战者之间竞争在加剧
        - 用独立来源核验份额数据；优先使用 CMA 市场审查数据
      - - SME 透支供给自 2000 年以来下滑 80%+
        - 驱动因素（未满足需求）
        - 2000–2025 年持续；Allica 的透支产品于 2026 年 2 月推出
        - 引用的市场缺口为 £15bn；Allica 推出最高 £2m 的透支；可能具备先发优势
        - 跟踪 Allica Overdraft 采用率；监测大行竞争回应
      - - AI 驱动的承保降低单位成本
        - 驱动因素
        - 2024–2026 年兴起；Allica 工程团队日常 AI 使用率 79%（2026 年 1 月）
        - 复杂 SME 贷款单笔成本下降；打开利润较薄的 SME 长尾；数据规模越大，优势越强
        - 对标与大行的单笔贷款成本；专门核验 AI 是否用于信贷决策
      - - FSCS 存款保障上限提高至 £120,000（2025 年）
        - 驱动因素
        - 2025 年（PRA 决定）；即时生效
        - 降低 SME 将存款放在挑战者银行的信任门槛；支撑 BRA 和储蓄增长
        - 跟踪银行层面的存款切换数据；Allica 存款增长（£5.7bn）部分可归因于此
      - - PRA/FCA Scale-up Unit——Allica 入选首批队列（2026 年）
        - 驱动因素
        - 2026 年初试点队列；持续推进
        - 降低 Allica 的资本不确定性；提高产品发布节奏的确定性
        - 监测 PRA 非周期资本审查结果；评估监管成本节省
      - - SME 借款意愿低（历史低位）
        - 约束
        - 结构性；全球金融危机以来已固化
        - 贷款增长面临需求逆风；Allica 必须争夺更小的有信贷需求 SME 池
        - 跟踪 BoE Money and Credit 中 SME 净借款流；监测贷款拒绝率趋势
      - - Basel 3.1 资本要求（Allica 采用完整规则）
        - 约束
        - 自 Basel 3.1 实施日起生效；持续影响
        - 需要持续发行股权；£155m Series D 用于支撑贷款账簿
        - 建模每新增 £1bn 贷款的资本消耗；评估下一轮融资前的余量
      - - 切换成本和信任赤字（2025 年品牌认知度仅 16%）
        - 约束
        - 持续存在；Allica 认知度在提升，但远低于大行
        - 限制自然流入需求；拖慢 BRA 和主账户转化
        - 跟踪品牌认知度趋势（4%→8%→16%）；估算各渠道切换客户转化率
      - - SME 贷款的宏观 / 信用周期风险
        - 约束
        - 周期性；Allica 2025 年年报提到地缘政治不确定性
        - SME 违约会推高贷款减值；Allica 的 ECL 模型和 CET1 缓冲可吸收中等压力
        - 审查 Allica 的 IFRS 9 分阶段数据；在更高减值情景下压力测试 NIM
    notes: >-
      驱动因素和约束来自 Allica 2025 年年报、新闻稿和 Bank of England Money and Credit 数据。60% 的挑战者市场份额数字源自 CityAM 报道，该报道引用 CEO Richard
      Davies；本章查阅的公开来源中，未能由 CMA 或 BoE 独立佐证。FSCS 上限提高已在 Allica 2025 年年报叙述中确认。时间列反映该因素预计产生实质影响的期间。
