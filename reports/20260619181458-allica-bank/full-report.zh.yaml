      - number: '5.3'
        title: AI 策略、集成与开发者生产率
        blocks:
          - type: paragraph
            body: >-
              AI 已迅速成为核心运营特征。Allica 员工使用 AI 工具的比例从 2025 年 Q1 的不足 50%，升至 Q4 的超过 80%， 到 2026 年 1 月日常 AI 使用率为 79%。银行将自身与
              Jellyfish AI Engineering Trends 研究对标——这是可获得的最大同类基准， 覆盖 700+ 家公司和 200,000 名工程师——其 AI 采用率位于前十分位。2025 年 Q4
              自主开发者代理的使用， 推动 2025 年 H2 合并的 pull request 数量超过翻倍。银行赢得 FSTech Awards 2026 EMEA「Commercial Finance
              最佳技术应用」类别奖项。

              贷款侧，Allica 在 2025 年引入全自动代理式 AI 贷款决策，用 AI 自动化此前人工完成的数据录入和承保任务。 Loan Processing Hub 的自有内部数据被用来对复杂贷款用例的 AI
              代理进行影子测试和实时试点；Allica 称，这比没有底层贷款数据的独立 fintech 构建同等工具更快、更准确。

              集成侧，2025 年 QuickBooks 连接上线，同时 Apple Pay 和 Google Pay 上线。Xero 和 Sage 集成也已可用。
              开放银行数据流让交易自动进入会计软件，账户伙伴和客户均正面提及这一功能。会计师渠道配备了前 ICAEW、前 Xero 和前 Dext 专业人士。截至 2026 年 H1，Allica 正在为 BRA
              持有人建设费用卡费用管理和账单支付工具。

              未发现 Allica Bank 的公开 GitHub 仓库、开源贡献或开发者 API 文档。这构成独立开发者信号缺口： 工程社区信号来自 Allica 技术页面上的内部工程博客和招聘信息，而不是可观察的开源或公开
              API 活动。
