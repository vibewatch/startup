      - number: '8.4'
        title: 建议、尽调问题与退出准备度
        blocks:
          - type: paragraph
            body: >
              建议：跟踪。$1.2bn 估值总体公允——它反映了 Allica 已被验证的盈利能力（连续第三年盈利）、强劲的 4.7% NIM、机构质量投资者基础，以及在服务不足的 £150–200bn 英国 SME
              银行市场中的定位。2.5x 总收入倍数相对消费数字银行同业并不高，并由过去三年的真实经营杠杆支撑。信心为中等，因为私人银行不透明度限制独立验证：股本数量、股权结构、清算优先权层级、AT1
              工具条款和风险加权资产均未披露，无法独立计算价格 / 有形账面价值或完整分配瀑布。

              若要给出强 Buy，需要入场估值显著更低（低于 £700m）、独立分析师佐证基本面，或管理层直接确认股权结构机制。如果国际扩张干净落地、NIM 保持在 4.5% 以上、贷款账簿继续增长 20% 以上，并且 BRA
              客户达到 50,000+——这些持续证据证明增长溢价合理——建议可上调至 Buy。

              最可能的退出路径是 IPO 或战略收购，这与 TCV 的技术增长股权 mandate 和 Ventura Capital 的组合退出打法一致。英国银行 IPO
              需要再积累两到三年经营记录，并等到有支持性的公开市场环境。若出售给一家希望获得成熟英国 SME 业务的欧洲大行，可能拿到高于公开市场倍数的稀缺性溢价。论点失效触发项和最终尽调问题列在下表。
