      - number: '2.2'
        title: 市场规模——多重视角
        blocks:
          - type: paragraph
            body: >-
              英国成熟型 SME 银行市场没有单一权威公开 TAM 数字。本节给出四个独立测算视角，并说明它们在哪些地方收敛或冲突。

              视角 1——企业数量法：根据 Oxford Economics / Allica 2026 年 6 月报告，英国成熟型 SME 细分市场约有 265,000 家员工 5–250 人的企业。UK Tech News
              2026 年 2 月报道曾引用 Allica 的说法，将其目标市场描述为约 500,000–600,000 家企业（由约 30,000 客户对应 5% 渗透率倒推）；这一数字可能把部分行为类似成熟型 SME 的
              1–4 人企业也纳入范围。Business Population Estimates 数据（由 UK Department for Business and Trade 发布）给出权威官方计数：截至 2025 年
              1 月，英国私营部门企业总数约 5.5 百万，其中约 265,000 家拥有 5–249 名员工。

              视角 2——贷款存量法：Allica 2026 年 2 月透支产品发布新闻稿称，2024 年 SME 透支供给为 £2.7bn，占 SME 总贷款的 5%。三角测算隐含 SME 贷款总存量约
              £54bn。这个数字与 Bank of England Bankstats Table VSVO 中 SME 未偿贷款数据方向一致，不过本章未直接提取到精确发布存量数字（见证据缺口 EG1）。按 3.7%
              的年增长率（BoE 2026 年 3 月 Money and Credit 数据），当前速度下该存量每年约增加 £2bn。

              视角 3——Allica 自身可触达贷款：截至 2025 年末，Allica 持有 £3.7bn 贷款，并声称约 6% 渗透率。如果 6% = £3.7bn，那么 Allica 产品组合服务的总可触达贷款钱包隐含
              SAM 约为 £60–65bn（覆盖这一细分市场的商业按揭、资产融资、成长融资和过桥融资）。考虑到上文 £54bn 总估算，这一数字可信；差异可能反映 Allica 组合中包含更广义的按揭贷款。

              视角 4——存款和储蓄钱包：截至 2025 年末，Allica 持有 £5.7bn 客户存款，客户渗透率为 6%。外推可得，英国所有银行的成熟型 SME 存款总额约 £95bn。Allica 2025
              年报强调，由于传统大行给出的利率低于市场可提供水平，SME 每年损失约 £9bn——这是挑战者试图争夺的潜在存款钱包中的显著份额。本章审阅的可访问公开来源中，没有发现第三方独立发布的英国 SME 存款总额数字。

              宏观背景：Bank of England 2026 年 3 月 Money and Credit 发布确认，SME 在 2026 年 3 月净借款 £2.0bn（2 月仅 £0.5bn），年增长率为
              3.7%。2026 年 3 月新发 SME 贷款的有效利率为 6.11%。这些温和的流量数字确认，整体市场在稳步但并非快速扩张——Allica 增长快得多（2025 年贷款增长
              23%），靠的是从传统大行手中夺取份额，而不是搭上大盘增长。
