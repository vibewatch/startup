              Business Rewards Account 存款增长 138% 至 £1.79bn——已占总存款 31%——是结构性 NIM 顺风， 使 Allica 区别于依赖利率敏感型定期存款的竞争对手。随着 BRA
              余额增长，综合资金成本下降，NIM 无需更高贷款收益率也能改善。14,000+ 名活跃 BRA 客户还构成贷款产品的直接渠道交叉销售基础，降低对经纪发起贷款的依赖， 并随时间改善发放经济性。British
