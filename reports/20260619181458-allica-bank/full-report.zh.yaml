  - id: FM001
    title: 英国成熟型 SME 银行服务——TAM / SAM / SOM 金字塔
    type: pyramid
    layout: standard
    summary: 三层金字塔从英国 SME 银行服务总钱包（TAM），收窄到 Allica 可覆盖的产品细分（SAM），再到 Allica 当前的贷款和存款位置（SOM）。
    data:
      items:
        - label: TAM——英国 SME 银行服务（贷款 + 存款）
          value: ~£150bn estimated addressable (£54bn lending + ~£95bn deposits, indicative)
        - label: SAM——Allica 服务的产品细分（5–250 名员工企业）
          value: ~£60–65bn lending; deposit wallet proportionate to customer base (~£95bn)
        - label: SOM——Allica 当前位置（2025 年底 / 2026 年初）
          value: £3.7bn loans + £5.7bn deposits; ~6% customer penetration
        - label: 目标 SOM（2028 年）
          value: ~10% customer penetration; estimated £6–8bn loans + ~£9–10bn deposits at trajectory
    approximationNotes: >-
      TAM 由贷款存量（来自透支数据的约 £54bn）加上估算存款（按 Allica 的 £5.7bn、6% 份额外推约 £95bn）三角测算而来。两项估算的置信度均为中低（见 TM002）。SAM 假设 Allica
      的产品组合可覆盖完整成熟型 SME 群体，但剔除规模过小的微型企业。SOM 和目标 SOM 数据来自 Allica 已披露贷款账簿、存款数据及其公开渗透率目标；它们不是独立分析师估算。
