      - 投资影响
      - 严重性
      - 尽调路径
    rows:
      - - BRA 客户获客成本（CAC）
        - 无法建模存款获客效率；这是 NIM 可持续性的关键驱动因素
        - 重大
        - 索取按 cohort 拆分 BRA 与非 BRA 发放成本的管理账
      - - BRA 存款生命周期价值 / 留存率
        - 无法承保 BRA 策略的长期资金稳定性
        - 重大
        - 索取 12/24 个月 BRA 存款留存 cohort 分析
      - - IRRBB 输出 / NIM 对利率变动的敏感性
        - 无法量化持续降息情景下的 NIM 压缩
        - 重大
        - 索取 Internal Capital Adequacy Assessment Process（ICAAP）利率敏感性表
      - - Kriya Finance 收入和成本贡献（FY2025）
        - 无法评估收购增厚还是摊薄
        - 重大
        - 索取交割后月份的 Kriya P&L 剥离口径；集成路线图
      - - 杠杆率
        - 无法评估 PRA 杠杆约束对资本消耗的限制
        - 次要
        - 通过 Pillar 3 补充披露或监管报表确认杠杆率和缓冲
      - - 按 vintage 披露产品级收益率和违约损失率
        - 无法建模 Growth Finance、BRA、过桥的完整周期信用表现
        - 重大
        - 索取按产品和发放年份拆分的 vintage 级减值分析
      - - 优先权结构和投资人清算瀑布
        - 无法建模 IRR 或投资人回报；稀释无法量化
        - 重大
        - 索取资本结构表和股东协议概要条款清单
      - - FY2026 中期 / H1 交易更新
        - 无法评估 Series D 后及利率环境影响下的轨迹
        - 重大
        - 索取 H1 2026 管理账或投资人更新；监测新闻稿
    notes: >
