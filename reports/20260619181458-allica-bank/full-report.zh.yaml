      - number: '7.5'
        title: 竞争、战略与治理风险
        blocks:
          - type: paragraph
            body: >
              Allica 的竞争位置建立在服务英国成熟 SME（5–250 名员工）之上。这个细分市场如今正被大行明确加码（Lloyds、HSBC、Barclays 的商业银行投资周期），OakNorth 和
              Starling Business 等挑战者也在争夺。CEO Richard Davies 是 OakNorth 首任 CEO，说明他直接看得见竞争威胁，但也说明 Allica
              的打法并非独有专利。董事会治理风险包括：董事 R Kapoor 于 2025 年 6 月 30 日辞任（未公开披露原因）；2025 年 5 月同时任命两名新董事（Ghatak 和 Subramanian）；主席
              John Maltby 同时在 West Bromwich Building Society、Max Nicholas Renewables 和 Nordea Bank 任董事。战略与投资者关系管理集中在 CEO
              Richard Davies（曾任 Revolut COO、OakNorth 首任 CEO）身上，形成关键人风险。公司仍处于私人公司阶段的资本密集增长期，投资者情绪变化可能拖慢后续轮次的资本获取。Allica
              的投资者包括 TCV、Blue Owl（前 Atalaya Capital Management）、Warwick Capital Partners、Ventura Capital、GLG 和 Sona
              AM——这是一组增长股权和另类信贷投资者，其再投资期限和退出偏好均未公开披露。
