      - number: '4.6'
        title: 财务缺口、风险因素与尽调问题
        blocks:
          - type: paragraph
            body: >
              作为一家私人公司，Allica Bank 按 Companies Act 要求披露的财务信息对英国银行而言较完整，但距离投资级承销仍有重要缺口。 银行未披露 BRA
              客户的单位级获客成本或生命周期价值，因此其存款策略的经济性——NIM 轨迹的关键驱动因素——无法仅靠公开数据验证。 没有公开发布 IRRBB（银行账簿利率风险）敏感性表，外部也就无法量化长期降息情景下 NIM
              压缩幅度。 BRA 存款的利息成本估计显著低于 3.3% 的综合存款成本，但确切利率未披露，限制了资金成本建模。 Kriya Finance 在 FY2025
              被收购，但没有单独披露收入或成本贡献，无法分析收购增厚。Trustpilot 客户服务反馈呈现分化，一些客户提到费用、交易限额和支持响应速度的担忧——对于 BRA 账户客户年增 133%、且依赖高 BRA
              留存来获得资金成本优势的银行而言，这是实质风险。信用周期风险也很重要：Stage 3 贷款占总账簿 2.6%， 在当前环境下偏低，但组合尚不成熟；Growth Finance（+127%）、BRA
              发放和过桥融资大多账龄较短， 且没有公开的 vintage 级减值数据。杠杆率未公开披露，形成与 PRA 监测要求之间的缺口；该信息只会在保密监管报送或 Pillar 3
              补充文件中显现。私募股权所有权（TCV、Blue Owl、Ventura、GLG、Sona AM）意味着没有公开市场定价信号， 完整优先权结构未披露，投资者回报假设也无法独立验证。
