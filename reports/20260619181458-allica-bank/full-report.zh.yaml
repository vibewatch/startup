      - number: '6.4'
        title: 留存、满意度与负面信号
        blocks:
          - type: paragraph
            body: >
              Allica 用独立研究机构 RFI Global 半年度 NPS 调查衡量三类伙伴群体的满意度。2025 年 11 月客户 NPS 为 +76 （高于 2024 年 11 月的
              +67），公司称其为「excellent」，并据此获得 2026 年 3 月 RFI Global 「Most Recommended Business Bank」奖，该奖基于 4,000 多家受访企业。2025
              年年末调查中，经纪人 NPS 达 +52， 会计师 NPS 达 +79。第三方评价平台印证了正面信号：截至 2025 年末 Trustpilot 为 4.7/5（1,700+ 条评价）， 但本研究时点（2026
              年 6 月）的实时 Trustpilot 页面显示 4.6/5，反映分数有轻微漂移；Smart Money People 超过 2,400 条评价，得分 4.89/5。应用商店评分为 Apple App
              Store 4.7、Google Play 4.6。 在整体正面图景下，2026 年初出现了一个重要负面信号：Allica 对平均余额低于 £10,000 的 BRA 账户引入 £25/月低余额费（2026 年
              2 月生效，2025 年 11 月通知）。近期 Trustpilot 评论将该费用标记为负面意外， 且一名评论者称客服回复间隔 7–10 天——这与 Allica 的 RM
              模式承诺不一致。第三名评论者指出储蓄利率下降 （其账户存续期内从约 4.2% 降至 2.3%），并将其归因于市场利率变化。Allica 未公开系统性流失率、 总收入留存（GRR）或净收入留存（NRR）数据；唯一的
              cohort 级代理指标是活跃 BRA 持有人同比增长 133%， 这确认了净扩张，但无法把留存和获客分开。
