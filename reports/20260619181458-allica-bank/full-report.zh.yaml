  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与估值背景
        blocks:
          - type: paragraph
            body: >
              Allica Bank 于 2026 年 2 月完成 $155 million Series D 融资，估值约 $1.2 billion（按当时汇率约 £950 million），跨过独角兽门槛。本轮由普通股和
              Additional Tier 1（AT1）资本混合构成，新投资者 Ventura Capital（迪拜背景，投资组合包括 Uber 和 Spotify）、GLG、Sona AM 加入现有股东 TCV 和
              Blue Owl（前 Atalaya Capital Management）。Series D 前的主要股权持有人是 Warwick Capital Partners、TCV 和 Blue
              Owl。资金用途包括继续推动英国贷款增长、AI 投资，以及首次进入未具名欧洲市场的国际扩张。

              对照 FY2025 经营成绩单——£371.3m 总收入（同比 +27%）、£43.7m 基础税前利润（+34%）、£3.742bn 贷款账簿（+23%）、£5.7bn 存款，以及 4.7%
              净息差——$1.2bn 估值约等于 2.5x 市销率和约 21x 基础税前利润倍数。到 2025 年底，CET1 资本比率为 13.4%，总资本比率为 16.8%，均显著高于监管最低要求；BBB 于 2026 年
              6 月把 Tier 2 授信提高至 £45m。投资者组合把技术增长股权（TCV）、信贷导向资本（Blue Owl、Sona AM）和海湾地区战略基金（Ventura
              Capital）放在一起，为本轮融资带来机构质量背书。尚无独立公开分析师建立正式覆盖或目标价。
