            - Commercial Mortgages（不受监管贷款）
            - Asset Finance——Allica Financial Services Ltd（不受监管）
            - Growth Finance——Allica Financial Services Ltd（不受监管）
            - Bridging / Property Finance——Allica Bridging Finance Ltd（不受监管）
            - Business Overdraft（不受监管贷款）
            - Invoice Finance / Embedded Finance——Kriya（不受监管）
            - Personal Savings（受监管存款）
        - id: platform
          label: 专有平台（Allica Full Stack）
          modules:
            - 前端：React，搭配 Tailwind CSS + Radix 组件库
            - 后端：Kotlin + Spring Boot 微服务
            - 专有 Loan Processing Hub（多产品、多渠道）
            - Agentic AI 承保层（正在主动部署）
            - 开放银行 / 会计集成（Xero、Sage、QuickBooks）
            - Apple Pay / Google Pay 支付轨道
        - id: infrastructure
          label: 基础设施与数据
          modules:
            - Microsoft Azure 云（事件驱动微服务架构）
