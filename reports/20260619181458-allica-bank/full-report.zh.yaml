      - number: '5.4'
        title: 客户体验、安全与监管合规
        blocks:
          - type: paragraph
            body: >-
              客户体验信号持续强劲：Apple App Store 4.7/5（2024 年为 4.6/5）、Google Play Store 4.6/5、 Trustpilot 4.7/5（2026
              年当前评价）、Smart Money People 4.89/5 且评价超过 2,400 条。 截至 2025 年 11 月，客户 NPS 为 +76（2024 年 11 月为 +67），经纪人 NPS 为
              +52，会计师 NPS 为 +79。 Trustpilot 定性评论强调 app 易用、关系经理主动、开户迅速。部分负面评论集中在低余额账户 £25 月费， 以及一些客户开户后才发现的资格标准。

              安全姿态依托 .bank 顶级域名——这是高度监管的 TLD，相比 .com 施加更高的身份验证要求——以及所有服务强制 HTTPS。 已发布的安全页面规定密码至少 10
              个字符，且至少包含一个大写字母、一个特殊字符和一个数字，并鼓励使用密码管理器。 Allica 的反欺诈指引强调 phishing、vishing 和社会工程风险，并提供专门的欺诈中心。不过，Allica
              未在官网公开披露 ISO 27001、SOC 2 或 Cyber Essentials 认证，相比部分同业是证据缺口。

              监管侧，Allica Bank Limited 获 PRA 授权，并同时受 PRA 和 FCA 监管（FRN：821851）。储蓄和活期账户产品受 FSCS 保护； Bank of England 已承诺将
              FSCS 存款保护上限从 £85,000 提高至 £120,000，Allica 曾公开倡导这一变化。 贷款产品、资产融资、增长融资和过桥融资是通过子公司交付的未受监管商业产品，不受 PRA/FCA
              监督。Allica 是 PRA/FCA Scale-Up Unit 首批成员之一，因此拥有小型挑战者无法获得的某种监管互动。2025 年 12 月 31 日， CET1 为 13.4%，总资本比率
              16.8%；Allica 选择采用 Basel 3.1 而非 SDDT 制度，反映其增长野心。

