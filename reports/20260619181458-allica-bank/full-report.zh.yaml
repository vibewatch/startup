      - number: '8.2'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              要为 Allica 建立有意义的可比组，必须同时覆盖带 fintech 溢价的数字银行和传统英国放贷机构，因为 Allica 跨在两边。它持有 PRA
              银行牌照，已经盈利，收入主要来自利差，同时又具备挑战者银行的增长曲线和技术投入姿态。

              在英国数字挑战者中，Monzo 在 2024 年融资中达到约 £4.7bn 估值（FY2024 收入约 £865m；收入倍数约 5.4x），反映的是从消费者业务向 SME 扩张。Starling Bank 在
              2022 年融资中的估值为 £2.5bn（FY2023 收入约 £413m；按年份不同，收入倍数为 0.6–1.5x），据报道正准备 IPO。OakNorth 是最直接可比的英国 SME 专业放贷机构，2019
              年估值为 $2.8bn——这一标记已经陈旧——且当前财务数据披露极少。Revolut 2024 年二级交易隐含约 £45bn 估值，约为估计收入的
              16x，反映的是全球支付野心，因此并不是好的直接可比。英国上市银行同业（NatWest、Lloyds）交易在 0.8–1.2x 有形账面价值和 8–12x 盈利，代表收益型银行资产的地板情景。

              按价格 / NII 口径，Allica 隐含约 6x NII（£159m NII；约 £950m
              估值），相对数字银行同业并不激进。私人银行资产的流动性折价、有限的二级市场数据，以及未披露的股本数量，限制了充分确信。鉴于其盈利能力和增长轨迹，Allica 2.5x 总收入倍数总体公允，但仍需对照
              fintech 估值倍数压缩趋势持续跟踪。
