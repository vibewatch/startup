  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与目标定义
        blocks:
          - type: paragraph
            body: >
              Allica Bank 面向一个单一且定义严格的细分市场：拥有 5 至 250 名员工的英国成熟 SME。管理层估计英国约有 500,000 家这类企业，贡献约三分之一全国就业和
              GDP。不同于服务任何消费者或微型企业的零售 neo-bank， 也不同于聚焦更大企业客户的投资银行，Allica 明确排除规模谱系两端，只专注于其所谓「established SME」（ESME）层级。
              传统高街银行用遗留平台服务 ESME 太复杂、难以盈利，这正是 Allica 瞄准的缺口。主要购买者和付款者通常是企业主或财务总监； 用户则是与活期账户、贷款门户和 app
              交互的企业主及财务团队。公司服务多个垂直行业——酒店餐饮、制造、养老院、专业服务、 零售、环境服务和技术——但未公开披露按行业或地域划分的收入集中度。客户通过三条主要路径使用 Allica： Business
              Rewards Account（BRA）活期账户、有担保和无担保商业贷款，以及企业储蓄。BRA 被定位为完整主办银行关系的锚定产品， 让 Allica
              获取可降低资金成本的存款，同时搭建交叉销售贷款的管线。Allica 在 London、Milton Keynes 和 Manchester 设有办公室， 并在英国各地部署区域关系经理，而非只通过纯数字渠道服务。
