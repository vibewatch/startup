      - number: '4.7'
        title: 图表
        blocks:
          - type: callout
            title: NIM 利率敏感性与信用周期账龄不足
            body: >
              Allica 4.7% 的 NIM 健康，但对英国利率环境敏感：如果 BoE 持续降息，贷款收益率与存款成本之间的利差可能被压缩， 尤其是在 BRA 余额（成本较低但并非零利息）继续增长的情况下。公司没有披露
              IRRBB 敏感性，外部 NIM 建模并不可靠。 同时，贷款账簿很年轻——FY2025 Growth Finance 增长 127%，BRA 客户增长 133%——意味着相当一部分贷款尚未穿越经济下行周期。
              FY2025 Stage 2 余额增长 25%，这是一个需要在 2026 信用周期密切跟踪的先行指标。
