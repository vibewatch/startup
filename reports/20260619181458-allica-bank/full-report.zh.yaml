      - number: '8.3'
        title: 牛 / 基准 / 熊情景与反向证据
        blocks:
          - type: paragraph
            body: >
              约 £950m 的 Series D 入场估值，对应三种回报情景：

              牛市情景下，Allica 到 2028 年维持 25–30% 年收入复合增长，动力来自 BRA 活期账户放量，以及直接获客替代经纪渠道。固定利率 treasury 账簿对冲利率波动，NIM 维持在约
              4.7%；信用质量保持干净（NPL 低于 1.5%）；国际扩张以可控成本贡献增量收入。到 FY2028，总收入可能接近 £600–700m，贷款账簿达到 £6–7bn，支撑 3–3.5x 收入倍数和约
              £2.0–2.5bn（$2.5–3.2bn）的退出估值。这要求公司在多个战线上零失误执行。

              基准情景假设收入 CAGR 为 18–22%；若 BoE 降息，NIM 温和压缩至约 4.3–4.5%；信用损失受控。到 FY2028，总收入达到 £500–550m，贷款账簿约 £5bn。按 2.5–3x
              收入倍数，退出价值约 £1.4–1.8bn（$1.8–2.3bn），相对 Series D 入场估值提供中等上行。

              熊市情景来自宏观逆风：BoE 降息把 NIM 压到 4.0% 以下，英国 SME 信用周期恶化推高减值费用，国际扩张超支并从核心业务抽走资本。收入增速降至 15% 以下，PBT 下滑，可比倍数收缩到 1.5–2x
              收入，对应 £0.7–0.9bn（$0.9–1.1bn）估值——低于 Series D 入场价格，并带来真实的 down-round 风险。

              已经出现的反向信号包括：opex 增长 35%，快于 27% 收入增长；2021 至 2024 年全球 fintech 倍数压缩 40–60%；2025–2026 年英国 SME
              破产率偏高；私人银行不透明度限制独立验证。来自 Financial Ombudsman Service 和评论平台的客户投诉数据显示，投诉量虽小但在增长，随着客户基数扩大值得监控。
