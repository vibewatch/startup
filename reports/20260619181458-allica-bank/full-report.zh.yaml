  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 信用风险与 SME 贷款组合质量
        blocks:
          - type: paragraph
            body: >
              Allica Bank 的主要信用风险敞口来自 £3,802m 总贷款账簿（2025 年 12 月），其中约 75.6% 以商业或住宅地产作抵押， 24.4% 为其他放款，包括增长融资和营运资本产品。2025 年
              12 月 Stage 3（减值）贷款达到 £100.2m， 占总账簿 2.6%，绝对金额较 2024 年 12 月的 £59.5m 增长 68%。集团 ECL 拨备增长 29% 至 £42.6m，
              损益表确认的减值损失增长 30% 至 £13.3m，不过管理层将其描述为贷款账簿账龄成熟，而非信用质量阶跃式变化。 Stage 3 覆盖率从 2024 年的 21.8% 降至 2025 年的
              18.1%，反映以地产抵押的 Stage 3 敞口占比提高； 这类敞口抵押品回收率较高，但会压低拨备率。Stage 2（观察名单）贷款达到 £387.1m（占账簿 10.2%）， 高于
              £308.6m。宏观环境会放大风险：Bank of England 2024 年 11 月 Financial Stability Report 明确警告，较高再融资利率下「SME
              和部分高杠杆企业借款人仍有风险」，且发达经济体企业破产率在此前两年上升。 英国公司破产服务统计也确认 2024–2025 年破产率处于高位。Allica 的贷款账簿尚未经历完整信用周期， 确切 NPL
              比率、违约损失经验和行业层面违约集中度均未公开披露。
