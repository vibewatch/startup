      - number: '6.2'
        title: 采用轨迹与市场渗透
        blocks:
          - type: paragraph
            body: >
              Allica 的客户基础在所有可衡量维度上都快速增长。截至 2026 年 2 月 Series D 公告，总成熟 SME 客户超过 30,000， 高于 British Business Bank 公告所称
              2025 年 3 月约 25,000，也高于 2019 年获牌照时更小的早期基数。 2025 年年报披露年末活跃 Business Rewards Account 持有人超过 14,000——较 2024 年末逾
              6,000 增长 133%——且 2025 年账户持有人「超过翻倍」。这些数字可以并存：30,000+ 总客户数可能包括不持有 BRA 的纯贷款和纯储蓄关系， 而 14,000 活跃 BRA
              数量只反映已主动交易的活期账户持有人。Allica 称 2025 年末在成熟 SME 细分市场的客户渗透率 「超过 6%」，而 2026 年 2 月 Series D 新闻稿称「约占目标市场
              5%」。措辞上的小差异可能来自可寻址细分市场定义略窄或略宽； 两个数字都指向约 500,000 家可寻址企业。市场渗透显著领先品牌认知（2023 年 4%、2024 年 8%、2025 年 16%），
              说明口碑和经纪推荐比品牌广告更高效。2025 年，CASS 完全和部分银行账户切换至 BRA 的比例上升逾 300%， BRA 持有人月卡消费同期超过翻倍。贷款侧，Allica 2025 年新增发放超过
              £1.3bn（连续第二年超过 £1bn）， 总账簿增至 £3.7bn，目标是在 2028 年达到 10% 市场渗透。
