      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Allica 由 CEO Richard Davies 领导。他此前曾在 Revolut（集团 COO）、OakNorth（首任 CEO）、TSB 和 HSBC 担任高管。Davies 还担任英国 fintech
              Zepz 的非执行董事。董事会主席是 John Maltby MBE，他是资深银行高管，曾任 Williams & Glyn CEO 和 Lloyds Banking Group Commercial Bank
              集团董事，目前也是 West Bromwich Building Society 主席。CFO James Heath 曾在 ABN AMRO UK 和 Cambridge & Counties Bank 担任
              CFO。Niv Subramanian 加入后担任 Deputy CEO，此前是 Previse 的 GM 和 CFO，并参与搭建 OakNorth 的银行牌照。

              非执行董事阵容很厚。Patrice McDonald 主持 Risk Committee，并担任 Senior Independent Director；她曾任 Barclays Wealth and
              Capital 全球 CRO，目前还在 Coutts 和 Brown Brothers Harriman Trustee Services 任职。Tracy Dunley-Owen 主持 Audit
              Committee，并担任 Euroclear UK 和 Simplyhealth 的 NED。Paul Marston 主持 People and Remuneration Committee，也是
              Allica 的 Consumer Duty Champion；他还是 FSE Group CEO，曾在 Secure Trust Bank 和 NatWest Lombard 担任高级职位。Patrick
              Magee 是 NED，曾在 British Business Bank 工作十年（包括担任 Chief Commercial Officer）。Amitabh Ghatak 带来 Dojo、Molo 和
              William Hill 的 CPO/CTO 经验。

              执行委员会补上商业和运营深度：Nick Baker（Chief Commercial Officer，15 年以上经纪行业经验）、Conrad Ford（Chief Product & Strategy
              Officer，Funding Options 创始 CEO）、Ravneet Shah（CTO，2020 年 1 月加入）、Alan Dunmur（CRO，前 Monzo 金融风险总监）、Mitch
              Trehan（Chief Compliance Officer）、Kate Valdar（General Counsel）和 Patricia Otegui（Chief Internal
              Auditor）。2025 年，董事会批准任命 Niv Subramanian 为 Deputy CEO、Amitabh Ghatak 为 NED，也批准收购 Kriya
              Finance。创始领导层图景不太清晰——Allica 没有像单一创始人叙事的挑战者银行那样发布创始故事；关键人风险集中在 Davies 和 Maltby。
