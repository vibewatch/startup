  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 SME 银行技术栈
        blocks:
          - type: paragraph
            body: >-
              Allica Bank 是英国唯一一家专为成熟 SME（5–250 名员工）打造的数字银行。产品套件以 Business Rewards Account（BRA）为锚点，承担主办银行关系层：卡消费最高返现
              1.5%，分层储蓄罐利率会对活跃主办银行用户加成， 并提供专属关系经理。若账户上月平均余额低于 £10,000，BRA 收取 £25/月费用——这一门槛可能筛掉目标客群下沿客户， 也是负面 Trustpilot
              评价中可见的摩擦点。

              储蓄侧，Allica 同时提供 Business Savings 账户（面向 SME 现金管理）和 Personal Savings 账户
              （面向个人的固定利率和通知存款产品），作为为贷款账簿提供资金的零售存款募集渠道。

              贷款栈通过三个法律实体交付。Allica Bank Limited（FRN：821851）持有 PRA/FCA 银行牌照，发放商业按揭和商业透支。 Allica Financial Services
              Limited（公司号 12784979，以 Allica Bank Asset Finance 名义经营）提供资产融资和增长融资， 不受 PRA/FCA 监管。Allica Bridging Finance
              Limited（公司号 10859711，前身为 2024 年收购的 Tuscan Capital） 提供过桥和短期地产融资，同样不受 PRA/FCA 监管。2025 年收购 Kriya
              Finance，为组合增加了发票融资和 B2B 嵌入式金融能力。 贷款产品在 FCA 规则下明确不是受监管产品，这限制了消费者保护重叠，但对商业贷款而言属常态。

              2026 年初，银行下调了商业按揭和过桥产品价格，并简化贷款产品范围。往前看，Allica 已承诺在 2026 年 H1 面向 SME 发布财务运营能力（费用管理、账单支付、AI 驱动的现金流洞察），并在
              2026 年 H2 将自有 AI 代理部署到端到端贷款生命周期。
