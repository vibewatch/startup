            title: FSCS 保护上调移除挑战者吸收存款的关键障碍
            body: >-
              PRA 2025 年决定把 FSCS 存款保护上限提高到 £120,000，直接回应了促使 SME 把存款集中在传统大行的信任障碍。这一监管变化是 Allica
              存款增长的直接顺风，也降低了挑战者银行在资产负债表负债侧曾经面对的竞争劣势。
