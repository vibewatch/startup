          - type: callout
            title: 利率商品化和服务扩张风险需要主动管理
            body: >
              Allica 的两条增长杠杆——领先利率的储蓄产品和高配 RM 模式——都在承压。Bank of England 基准利率正常化会压缩储蓄利差；OakNorth 已经在没有关系经理模式的情况下给出 2.35%
              AER， 说明单靠利率不一定能拉开差异。与此同时，Allica 的 RM 模式存在结构性扩张难题：到 2025 年底， 799 名员工服务 14,000+ 个账户，且已有 7–10 天响应时间的投诉记录，说明
              RM 关系质量并不均衡。 如果利率溢价收窄、RM 模式走弱，Allica 可能退化成一家没有清晰护城河的中档企业账户服务商。
