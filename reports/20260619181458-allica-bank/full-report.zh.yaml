            title: 估值立场：公允——跟踪
            body: >
              $1.2bn Series D 估值按约 2.5x 总收入和约 21x 基础 PBT 计算，总体公允。Allica 处在纯 fintech 与传统银行之间，对相信 SME
              银行溢价会扩大的长周期机构投资者有吸引力。Track 评级反映的是私人银行不透明度带来的中等信心，而不是底层业务的基本面疲弱。
            calloutType: recommendation
            claimRefs:
              - CV039
              - CV040
              - CV041
          - type: callout
            title: 主要否决标准：NIM × 信用质量
            body: >
              熊市情景由两个事件同时触发：BoE 降息把 NIM 压到 4.0% 以下，英国 SME 信用恶化把 NPL 推高到 3% 以上。任何一个单独出现都可管理；两者叠加会威胁盈利能力，并削弱支撑当前估值的增长溢价。把
              BoE Monetary Policy Committee 决议和月度 SME 破产数据作为领先指标监控。
            calloutType: risk
