      - number: '3.4'
        title: 替代品与现状方案
        blocks:
          - type: paragraph
            body: >
              最普遍的竞争对手是惯性。多数英国成熟型 SME 仍与 Big Four 传统大行往来，只是因为一直如此、个人账户也在那里，或财务董事不熟悉切换流程。CMA 多次指出，SME 企业账户切换率仍然很低，即便
              Current Account Switch Service 已扩展到企业账户，任何一年切换核心银行的企业仍少于 10%。

              专业贷款机构——发票融资提供商、资产融资经纪人、过桥贷款机构——覆盖 Allica 贷款菜单中的部分产品。它们争夺单个信贷工具，但不争夺 Allica 瞄准的完整关系（往来账户 + 储蓄 + 贷款 +
              客户经理）。Allica 明确靠捆绑竞争：一家 SME 如果用 Allica 做往来账户和储蓄，就更有可能被提供并接受 Allica 的贷款产品。

              ClearBank 是基础设施竞争者，而非直接市场竞争者。它让其他 fintech 和银行可通过 API 提供嵌入式银行账户；其中多家 fintech 服务 SME
              细分市场。这形成一条间接竞争路径：随着嵌入式银行成熟，SME 可能持有由 ClearBank 或类似 rails 支撑的非银行“银行账户”，削弱 Allica 在账户功能上的差异化。这是中期风险，而非即时威胁。

              内部司库流程也构成现状替代：运营良好的成熟型 SME 如果有司库职能，可能把现金放在传统大行 sweep accounts 或高端货币市场工具中，而不是切换到挑战者。Allica 4.08% AER 的
              instant-access 利率正面瞄准这一替代品，因为它明显跑赢主流高街隔夜标准利率。
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
              - CP040
              - CP041
              - CP042
      - number: '3.5'
        title: 护城河耐久性与切换动态
        blocks:
          - type: paragraph
            body: >
              Allica 的护城河建立在三套相互强化的机制上。第一，成熟型 SME 专属定位和品牌差异化：不同于 Tide、Starling 或 OakNorth，Allica 的定位完全切给 5–250
              人群体，这意味着每个产品决策、承保模型和 RM 招聘都按这一买方校准。这种专业化带来更深的 product-market
              fit，也降低已获客户流失，尽管它同时限制可触达市场。第二，经纪人和会计师分销渠道：Allica 已与商业按揭经纪人、资产融资经纪人和会计师事务所建立广泛关系，由他们介绍成熟型 SME
              客户。相较完全依赖直接数字营销的挑战者（Tide、Starling），这一渠道创造了结构性获客优势。传统大行也有经纪关系，但通常利润率要求更高、决策更慢。第三，捆绑锁定：成熟型 SME 如果在 Allica 持有
              Business Rewards Account，同时提取物业融资或资产融资工具，运营和财务上都会被嵌入。保留贷款关系的同时切换核心银行，成本并不低——多数 SME
              贷款机构要求借款人的核心交易账户也在同一机构，以便监控 covenant 和直接借记。这使切换成本随产品深度而增加。

              多归属真实且常见：许多成熟型 SME 会同时保留传统大行账户用于支付和工资，并用挑战者账户获取储蓄利率。Allica 的奖励模式（银行卡消费 cashback、Savings Pot
              利息）旨在让自己成为核心账户——接收工资、支付供应商、赚取 cashback 的那个账户——这让切换成本不只来自贷款关系。即便如此，开立 Tide 或 Starling 账户的低合同成本，仍会成为 Allica
              钱包份额增长的结构性天花板。

              护城河并非不可穿透。利率商品化是最近的风险：随着 Bank of England 基准利率从 2023–24 年峰值回落，Allica 储蓄利率溢价压缩，4.08% AER
              头部利率相对传统大行改善更难维持。OakNorth 已经在没有客户经理结构的情况下提供 2.35% AER，两家公司都面临利率环境正常化带来的利润率压力。
