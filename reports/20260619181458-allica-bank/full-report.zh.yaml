  - id: TE002
    title: SME 银行业务流程与使用场景分析
    columns:
      - SME 待完成任务
      - 传统银行痛点
      - Allica 方案
      - 可衡量收益（证据）
      - 限制 / 缺口
    rows:
      - - 日常企业银行业务（活期账户、支付、银行卡）
        - 呼叫中心缺少人情味，利息低或没有利息，费用高，支付慢
        - BRA 配专属 RM、返现、分层储蓄、Apple/Google Pay、QuickBooks/Xero/Sage 数据馈送
        - NPS +76；Trustpilot 4.7/5；2025 年卡消费翻倍；CASS 转户 +300%
        - 平均余额低于 £10,000 时收取 £25/月费用；返现不覆盖银行转账
      - - 获取商业按揭或房地产融资
        - 流程手工、决策慢，复杂案件容易被拒
        - 靠 RM + 数字化提供最高 80% LTV 的专业按揭；Bridge-to-Term 产品
        - 账簿 £2.36bn，2025 年增长 35%；Bridge-to-Term 获 NACFB 奖项
        - 定价表未完全公开；2026 年初利率调整（降价）
      - - 获取资产融资或增长融资
        - 传统承保难以给复杂资产类型或资产池结构定价
        - 借助 Loan Processing Hub 自研 AI 辅助承保；资产类型覆盖广
        - Asset Finance £507m（+19%）；Growth Finance 2025 年 +127% 至 £171m
        - 由非受监管子公司交付；由经纪中介撮合；复杂融资的直接数字 UX 有限
      - - 营运资金和发票融资
        - 银行提供的发票融资有限；需要另找保理机构
        - Kriya 发票融资，并具备面向 B2B 平台的嵌入式金融 API 能力
        - 2025 年收购后加入该产品；让 Allica 进入 B2B 嵌入式金融市场
        - 整合仍在推进；Kriya 产品规模或定价未公开披露
      - - 优化企业储蓄利率
        - 高街银行对企业存款几乎不给利息
        - Savings Pot 分层利率（标准 + 活动加成 + 转户加成 + 欢迎加成）
        - Savings Pot 利率包括标准 2.83% AER，外加最高 1.25% 的条件性加成
        - 利率加成要求特定行为（每月 15 笔对外转账或 CASS 转户）；规则复杂，部分客户可能看不懂
      - - 会计与财务报告集成
        - 传统银行门户里的银行馈送不稳定，或需要手工导出
        - 借开放银行，自动向 Xero、Sage、QuickBooks 传送交易数据
        - 会计师合作伙伴将其列为关键差异点；数百家会计师事务所使用 Allica
        - FreeAgent 集成未确认；并非所有集成都能在各产品间同样运作（贷款 vs. 存款）
    notes: 定性评估基于官方产品页面、Trustpilot 客户评价、2025 年报和会计师渠道页面。可衡量收益除特别说明外均为公司披露。
