      - number: '2.5'
        title: 规模测算缺口、矛盾与尽调路径
        blocks:
          - type: paragraph
            body: >-
              三个重大证据缺口限制了本市场分析的精度。

              第一，本章审阅的公开来源中，没有可访问的第三方独立 TAM 研究，专门覆盖英国成熟型 SME 银行市场（5–250 名员工）。所有市场规模引用要么来自 Allica 委托研究（Oxford
              Economics、Experian），要么由 BoE 聚合序列推导；这些序列覆盖所有 SME，没有切出 5–250 人区间。£54bn 总贷款存量数字是由组件数据三角测算得到，置信度中等。尽调路径：获取
              British Business Bank 的 Small Business Finance Markets report（最新版本），该报告通常发布子细分贷款和存款，并给出详细 SME 拆分。

              第二，265,000 与 500,000 的企业数量矛盾尚未被公开证据解决。Allica CEO 在 2025 年报中明确说渗透率为 6%，但 Oxford Economics 报告显示成熟型企业是“拥有五至
              250 名员工的公司”——UK BPE 数据显示这约为 265,000 家。UK Tech News 2026 年 2 月文章对同样约 30,000 客户数引用“最高约占其目标市场
              5%”，隐含分母略大。这些估算互相矛盾，正确分母会实质影响 SOM 计算。

              第三，BoE 或 UK Finance 没有按 5–250 员工区间免费公开英国成熟型 SME 总存款余额。本章 £95bn 存款外推来自 Allica 资产负债表份额，仅具指示性。£9bn 年度储蓄利率差数字由
              Allica 撰写，本章未能独立核验。
            claimRefs:
              - CM038
              - CM039
              - CM040
      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 结构性迁移——挑战者持有 60% SME 贷款
            body: >-
              CityAM 2026 年 2 月报道引用 CEO Richard Davies 的观察：挑战者银行如今占英国 SME 贷款市场 60%，相比之下，2019 年四大传统银行持有 90%。这一反转验证了
              Allica 的市场论点，但也意味着竞争会更多来自其他挑战者，而不是一片完全空白的绿地市场。Allica 的差异化不能只停留在“也是一家挑战者银行”。
            calloutType: insight
            claimRefs:
              - CM008
              - CM027
              - CM028
          - type: callout
            title: 企业数量矛盾削弱 SOM 精度
            body: >-
              Allica 称 30,000+ 客户对应 6% 市场渗透率，隐含目标市场总量约 500,000 家企业。Allica 委托 Oxford Economics 完成的 2026 年 6 月报告则提到约
              265,000 家拥有 5–250 名员工的企业（与 UK BPE 2024 统计一致）。公开来源尚未解决这个接近两倍的分母差异，而它会实质影响 SOM 预测。投资人应要求管理层给出统一市场定义和经核验的分母。
