  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与盈利质量
        blocks:
          - type: paragraph
            body: >
              Allica Bank 的收入几乎完全由利差驱动。FY2025，净利息收入 £159.0m（+39%）构成 £158.6m IFRS 总经营收入的核心；£6.9m 的净手续费拖累，被用于对冲利率和汇率风险的衍生品
              £6.5m 公允价值收益部分抵消。银行还披露非 IFRS 口径的「Gross revenue」£371.3m——即扣除资金成本前的利息和手续费总收入——以及 「Gross profit after
              risk」£145.3m（£158.6m 总经营收入减 £13.3m 减值），反映管理层偏好的经济生产率视角。 净息差从 FY2024 的 4.5% 升至 4.7%，主要来自产品继续转向更高利润率的 Growth
              Finance（同比 +127% 至 £171m）、 融资结构中低成本 BRA 活期账户余额占比上升，以及主动司库管理，包括锁定固定利率的 £1.2bn 债务证券。 总利息收入增长 26% 至
              £404.2m，其中客户贷款贡献 £269.0m，同业 / BoE 余额贡献 £52.5m， 持有债务证券贡献 £32.3m。BRA 存款增长 138%，对盈利质量尤其重要：活期账户存款的利息成本低于定期存款，
              直接改善利差；BRA 卡交换费收入（£5.0m，+138%）也提供一条增长中的非利息收入线。贷款手续费收入（£2.5m）仍然不大。 £6.9m 净服务费支出拖累报表净手续费收入，但反映的是规模扩大后经纪渠道获客和
              BRA 交易处理的成本。 £6.5m 公允价值收益具有波动性，本质上不可重复。法定 PBT 为 £36.9m，低于 £43.7m 基础利润 £6.8m， 原因是收购成本（Kriya 的
              £0.9m）、遗留系统加速摊销（£4.6m）和国际扩张成本（£1.3m）； 这些项目作为非经常性成本从基础口径中剔除是合理的。
