      - number: '5.2'
        title: 技术架构与自有平台
        blocks:
          - type: paragraph
            body: >-
              Allica 的核心运营假设是：要解决传统银行无法经济服务成熟 SME 的「复杂度 × 规模」问题，必须有自有、专门构建的技术栈。 该技术栈完全由内部 240
              多名产品和工程员工构建和维护，组织方式是跨职能的「single-threaded squads」； 这一模式在 2024 年采用，并在 2025 年 H2 扩展到 T-shaped（多学科）工程角色，使
              squad 人数需求约下降 25%。

              前端使用 React，设计系统在 2025 年迁移到 Tailwind CSS 和 Radix 组件库，明确目标是支持 AI-native 工具并加快页面构建周期。 迁移后页面构建时间下降 89%。后端为
              Kotlin 与 Spring Boot，云平台为 Microsoft Azure，架构为事件驱动微服务。 数据平台结合 Azure 工具套件和 ML/LLM 模型，支持运营自动化和信用风险分析。

              贷款基础设施的核心是自有 Loan Processing Hub；Allica 现已在多渠道、多产品基础上，将其完整部署到端到端贷款生命周期。
              这个单一系统覆盖直接数字渠道、关系经理渠道和经纪渠道，并覆盖全部贷款产品，包括新增的过桥融资和增长融资。 2025 年，银行完成 3,700+ 次代码发布，平台正常运行时间超过 99.5%。

              一个关键证据缺口在于，Allica 未公开披露其核心银行系统供应商（或自有层之下是否使用任何第三方核心银行软件）。 遗留技术平台加速摊销增加（2025 年 £4.6m，高于 2024 年
              £1.5m）说明部分遗留系统替换仍在推进， 带来一定技术切换风险，而外部来源无法看清这一风险。
