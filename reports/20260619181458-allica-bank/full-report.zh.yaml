      - number: '4.3'
        title: 贷款组合与信用质量
        blocks:
          - type: paragraph
            body: >
              FY2025 末贷款账簿增长 23% 至 £3.742bn，主要由经纪和直接渠道 £1.27bn 的新增有机发放推动。 商业按揭是最大产品类别，规模 £2.358bn（占账簿 63%，同比
              +35%），提供以抵押品支持的英国 SME 商业地产敞口。 Asset Finance 增长 19% 至 £507m，Growth Finance 激增 127% 至 £171m，Bridging Finance
              （通过收购 Tuscan Capital）几乎翻倍至 £121m。Kriya Finance 收购（FY2025 完成）新增了发票融资这条新兴产品线。 约 65%
              的贷存比提供充足流动性余量。信用质量保持韧性：年末 ECL 总拨备 £42.6m，综合覆盖率 1.1%， 尽管贷款账簿增长 23%，仍与 FY2024（1.1%）一致——说明资产质量稳定，而非恶化。Stage
              3（减值）贷款 £100.2m，约占总贷款 2.6%，覆盖率 18.1%；Stage 2 贷款 £387.1m（占总账簿 10.2%），覆盖率 2.9%。 £13.3m 减值费用对应约 0.36%
              的年化风险成本——对于当前周期的 SME 贷款机构而言偏低。不过，Stage 2 余额同比增长 25%（从 £308.6m 至 £387.1m），应作为潜在信用迁移的前瞻指标持续跟踪。Growth Finance
              增长 127%、BRA 客户增长 133%，意味着账簿中相当一部分账龄不足 12 个月，尚未经历衰退检验。 净衍生品头寸从 FY2024 的 £15.4m 资产转为 FY2025 的 £13.3m
              负债，反映利率下行时组合重新配置到债务证券。
