      - number: '7.3'
        title: 监管、合规与行为风险
        blocks:
          - type: paragraph
            body: >
              Allica Bank Limited 的吸收存款和储蓄产品受 PRA 与 FCA 双重监管（FRN：821851）。但四条主要收入流中有三条涉及未受监管实体： Allica Financial Services
              Limited（资产融资和增长融资，公司号 12784979）以及 Allica Bridging Finance Limited （过桥融资，公司号 10859711）明确未获 PRA 或 FCA
              授权，也不受其监管。这造成结构性行为风险： 这些产品的客户无法享受 FCA 监管伞下的 Financial Ombudsman Service 渠道或 FSCS 保护。FCA Consumer Duty
              （PS22/9，自 2023 年 7 月生效）适用于 Allica 的受监管产品；即使 FCA 后来正式取消公司任命 Consumer Duty Champion 的要求，银行仍自愿在董事会保留该角色（Paul
              Marston，People and Remuneration 主席）。2026 年 6 月的负面 Trustpilot 评论记录了客户对 2026 年 2 月引入的 £25/月低余额费、客服缓慢（提到 7–10
              天响应时间）、 以合规义务为由的意外关户，以及第三方平台所提供储蓄利率缺乏透明度的投诉。尽管 Allica 的 Trustpilot 总分仍高达 4.6/5，这一负面模式值得监测。PRA 于 2026 年 1 月
              20 日发布 Basel 3.1 和 SDDT 最终规则； Allica 选择 Basel 3.1 标准法，随着规则分阶段落地，将承受完整范围 RWA 重新校准。Allica 被选为 PRA/FCA 联合
              Scale-Up Unit 早期参与者，说明监管互动紧密；但截至 2026 年 6 月，公开信息中没有已知执法行动或 FCA 调查。FCA CP24/2
              提议对执法调查公开化制定新规则——若最终落地，任何受调查的受监管机构都可能面临更高声誉暴露。
