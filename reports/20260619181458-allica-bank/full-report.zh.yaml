      - number: '3.3'
        title: 英国传统企业银行
        blocks:
          - type: paragraph
            body: >
              Barclays Business 是市场中按品牌和网点足迹计的锚定传统大行。它给新成熟型企业账户前 12 个月免月费，之后回到 £8.50/月——一种收费优先模式，与 Allica
              的奖励优先模式直接形成对比。Barclays 为成熟型企业提供客户经理和专业行业能力，也能接入 Eagle Labs 创业生态，但其旧资费结构和网点中心交付仍是约束。作为比较，一家企业使用 Barclays
              四年，至少要支付 £306 月费；Allica 则为零（前提是平均账户余额超过 £10,000）。

              HSBC Business Banking 对标准电子转账提供免费数字银行服务，但 CHAPS 和支票会收费。HSBC 提供最高 £120,000 的 FSCS 保护——与 Allica 上限一致——并营销
              Small Business Growth Programme，提供 AI、数字营销和财务培训。不过，它的企业储蓄利率不在网上发布，需要通过客户经理谈判，使没有既有传统大行关系的 SME 难以比较和获客。HSBC
              的数字银行 app 已经改善，但投诉数据中仍能看到旧系统债务。

              NatWest 为新切换企业提供两年日常交易免费银行服务，并为营业额超过 £500,000 的企业配备专属客户经理。FreeAgent 会计软件免费包含在内，增强了较小 SME 的黏性。不过，£500,000 的
              RM 门槛意味着，Allica 5–250 人目标细分市场中约 80%（偏低于该门槛）不会得到 NatWest RM 关注——这正是 Allica 填补的缺口。

              Lloyds Bank 到 2026 年 7 月前为新企业账户持有人提供 £200
              现金切换激励，显示出挑战者带来的竞争压力。其全面的信贷菜单（小企业和大企业贷款、政府支持贷款、资产融资）赋予传统大行产品广度，Allica 在贷款侧仍在向这个方向搭建，但代价是定价不透明和交叉销售复杂。
