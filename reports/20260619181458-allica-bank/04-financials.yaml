  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: BRA-unit-economics
      missingEvidence: "BRA customer acquisition cost (CAC), 12-month deposit retention cohort data, and average deposit balance per customer at 12 and 24 months after onboarding."
      whyItMatters: "BRA economics underpin the NIM and funding-cost improvement thesis; without CAC and retention data, the sustainability of the deposit strategy and the required scale for operating leverage are unverifiable."
      diligencePath: "Request management accounts segmented by BRA vs non-BRA acquisition costs; request cohort-level BRA deposit retention analysis."
      relatedQuestionRefs:
        - QI017

    - type: private-evidence-only
      severity: material
      topic: rate-sensitivity
      missingEvidence: "IRRBB interest rate sensitivity table showing NIM or net interest income impact per 100bp parallel shift in BoE base rate."
      whyItMatters: "NIM of 4.7% is the primary earnings driver; a sustained rate cut environment could compress spreads significantly, and without the IRRBB output, downside scenarios cannot be modelled."
      diligencePath: "Request ICAAP interest rate risk sensitivity output or internal IRRBB model summary showing NIM sensitivity to ±100bp/200bp base rate scenarios."
      relatedQuestionRefs:
        - QI018

    - type: missing-source
      severity: material
      topic: Kriya-revenue
      missingEvidence: "Carved-out Kriya Finance P&L showing revenue, cost, and integration contribution for the period from acquisition close to 31 December 2025."
      whyItMatters: "Cannot assess whether the Kriya acquisition is accretive, dilutive, or neutral on an earnings-per-unit basis; invoice finance is a different risk/return profile from Allica's core secured lending."
      diligencePath: "Request carved-out Kriya management accounts for months post-close; request integration roadmap and FY2026 revenue target for the Kriya book."
      relatedQuestionRefs:
        - QI022

    - type: stale
      severity: material
      topic: FY2026-trading
      missingEvidence: "FY2026 interim or H1 trading update covering revenue, NIM, BRA growth, and capital position as of mid-2026."
      whyItMatters: "The Series D was completed in February 2026 and the BBB Tier 2 facility was extended in June 2026; an H1 2026 update would confirm whether post-raise momentum is tracking to plan and whether the rate environment has affected NIM."
      diligencePath: "Monitor allica.bank/press-releases for interim announcements; request H1 2026 management accounts as part of due diligence data room."
      relatedQuestionRefs:
        - QI021

    - type: private-evidence-only
      severity: material
      topic: credit-cycle-vintage
      missingEvidence: "Vintage-level impairment analysis by product (Growth Finance, Bridging, BRA-linked) showing cumulative default rates at 12, 24, and 36 months from origination."
      whyItMatters: "Stage 3 at 2.6% and cost-of-risk at 0.36% are benign, but apply to a young book; without vintage analysis, through-the-cycle credit performance cannot be modelled for the fast-growing Growth Finance and Bridging books."
      diligencePath: "Request vintage-level impairment analysis by product from Allica's credit risk team; benchmark Growth Finance loss rates against UK SME cashflow lending comparables."
      relatedQuestionRefs:
        - QI019

