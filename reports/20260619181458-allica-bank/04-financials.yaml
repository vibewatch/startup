callouts:
  - calloutType: risk
    title: NIM Rate Sensitivity and Credit-Cycle Immaturity
    body: >
      Allica's 4.7% NIM is healthy but sensitive to the UK interest-rate environment: a
      sustained BoE rate cut could compress the spread between lending yields and deposit
      costs, especially as BRA balances (which carry a lower but non-zero interest cost)
      continue to grow. No IRRBB sensitivity disclosure is available, making external NIM
      modelling unreliable. In parallel, the loan book is young — Growth Finance grew 127%
      and BRA customers 133% in FY2025 — meaning a significant proportion of loans has not
      yet been seasoned through an economic downturn. Stage 2 balances grew 25% in FY2025,
      a leading indicator that warrants close monitoring in the 2026 credit cycle.
    claimRefs:
      - CI004
      - CI022
      - CI038
      - CI041

  - calloutType: strength
    title: BRA Deposit Growth Structurally Improving Funding Costs
    body: >
      The 138% growth in Business Rewards Account deposits to £1.79bn — now 31% of total
      deposits — is a structural NIM tailwind that distinguishes Allica from competitors
      relying on rate-sensitive term deposits. As BRA balances grow, the blended cost of
      funds declines, improving NIM without requiring higher lending yields. The 14,000+
      active BRA customers also provide a direct-channel cross-sell base for lending products,
      reducing dependence on broker-originated loans and lowering origination economics over
      time. The British Business Bank's endorsement via a £45m Tier 2 facility further
      validates the credit quality of Allica's SME lending book.
    claimRefs:
      - CI024
      - CI025
      - CI026
      - CI028
      - CI029

