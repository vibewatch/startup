  - id: funding-deposits
    title: Funding Mix and Deposit Strategy
    body: >
      Customer deposits grew 29% to £5.72bn in FY2025, forming the primary and near-exclusive
      funding source for the bank. The funding mix underwent a structural shift of significance
      for long-term earnings quality: BRA current-account balances grew 138% to £1.79bn,
      representing 31% of total deposits (up from 17% in FY2024), while SME deposits in aggregate
      reached 71% of total deposits (from 47% in FY2024). Personal savings deposits declined from
      £2.33bn to £1.66bn as Allica de-prioritised personal deposit growth in favour of deepen
      SME banking relationships. The shift to BRA deposits lowers the blended cost of funds:
      BRA current accounts carry lower or no interest cost relative to term deposits, directly
      compressing interest expense and improving NIM. Interest expense on deposits was £190.6m,
      implying an average cost of approximately 3.3–3.8% on the deposit base — competitive but
      declining as the BRA share grows. The deposit surplus over loans (loan-to-deposit ratio
      ~65%) is invested in £2.44bn of liquid assets comprising over £1.1bn at the Bank of England
      and over £1.2bn in investment-grade debt securities. Servicing and transactional fees for
      deposits grew to £5.2m (from £0.8m), reflecting the BRA scale-up overhead that should
      reduce per-account as the base matures. Active BRA customers more than doubled to over
      14,000, providing a deepening primary-bank relationship with established SMEs that drives
      cross-sell of lending products through the direct channel. In June 2026, the British
      Business Bank extended its total Tier 2 capital facility to Allica to £45m, supporting up
      to £150m of additional SME lending — an institutional endorsement of Allica's credit quality
      and a blended funding benefit by adding regulatory capital at competitive cost.
