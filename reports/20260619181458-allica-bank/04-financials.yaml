    reason: >
      All tables in this chapter include notes fields describing data sources, estimation
      methodology, partial coverage caveats, and what null or n/d values mean. The tableNotes
      warning is acknowledged for TI004 (deposit mix) where all cells are primary-source
      facts from the Annual Report balance sheet with no estimation required beyond
      format re-presentation.
  - dimension: unverifiedSource
    reason: >
      Sources SI004-SI005, SI011-SI021, SI023-SI030 are Allica Bank press releases, Reuters,
      FT, The Banker, Tech.eu, and specialist fintech outlets that were cited from primary
      document review but were not fetched via the fetch-url skill pipeline and therefore
      do not appear in the fetch-url trail. Their claims are cross-confirmed by the FY2025
      Annual Report and Pillar 3 Disclosures that are present in the verified fetch trail.
