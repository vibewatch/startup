company:
  name: Allica Bank
chapter:
  number: 4
  title: Financials
  summary: >
    Allica Bank delivered strong FY2025 results — gross revenue £371.3m (+27%), underlying PBT
    £43.7m (+34%), NIM 4.7%, and a £3.7bn loan book — underpinned by 138% BRA deposit growth
    that lowered the cost of funds and structural shift toward SME current-account balances (31%
    of deposits). Capital remains well-buffered at CET1 13.4% and total capital 16.8%, with a
    £57m post-year-end Series D injection (£10m CET1, £47m AT1) adding further headroom. Key
    residual risks are NIM sensitivity to BoE base rate trajectory, a 35% operating-expense
    growth rate outpacing revenue, a young loan book yet to be tested through a full credit cycle,
    and the limited financial transparency inherent in a private-bank structure.

sections:
  - id: revenue-model
    title: Revenue Model and Quality of Earnings
    body: >
      Allica Bank's revenue is almost entirely interest-spread-driven. In FY2025, net interest
      income of £159.0m (+39%) constituted the core of the £158.6m total IFRS operating income,
      with a modest net fee drag of £6.9m partly offset by £6.5m fair value gains on derivatives
      used to hedge interest rate and currency risk. The bank also reports a non-IFRS "Gross
      revenue" of £371.3m — which captures total interest and fee income before netting funding
      costs — and a "Gross profit after risk" of £145.3m (total operating income of £158.6m less
      impairment of £13.3m), reflecting management's preferred view of economic productivity.
      Net interest margin improved to 4.7% (from 4.5% in FY2024), driven by continued
      diversification into higher-margin products such as Growth Finance (+127% YoY to £171m),
      the rising share of low-cost BRA current-account balances in the funding mix, and active
      treasury management including £1.2bn of debt securities locked in at fixed rates.
      Total interest income grew 26% to £404.2m, with £269.0m from loans to customers,
      £52.5m from interbank/BoE balances, and £32.3m from debt securities held. The 138%
      growth in BRA deposits is particularly significant for earnings quality: current-account
      deposits carry a lower interest cost than term deposits and directly improve spread, while
      BRA card interchange income (£5.0m, +138%) provides a growing non-interest revenue line.
      Fee income on loans (£2.5m) remains modest. Net servicing fee expense of £6.9m is a drag
      on reported net fee income but reflects the cost of broker-channel origination and BRA
      transaction processing as scale grows. Fair value gains of £6.5m are volatile and
      non-recurring in nature. The statutory PBT of £36.9m is £6.8m below the underlying figure
      of £43.7m due to acquisition costs (£0.9m for Kriya), accelerated amortisation on legacy
      systems (£4.6m), and international expansion costs (£1.3m) — all legitimately excluded
      from the underlying measure as non-recurring.
