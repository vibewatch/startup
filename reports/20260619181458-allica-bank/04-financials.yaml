  - id: lending-credit-quality
    title: Lending Portfolio and Credit Quality
    body: >
      The loan book grew 23% to £3.742bn at end-FY2025, driven by £1.27bn of new organic
      origination through broker and direct channels. Commercial mortgages represent the largest
      product category at £2.358bn (63% of book, +35% YoY), providing collateral-secured
      exposure to UK SME commercial property. Asset Finance grew 19% to £507m, Growth Finance
      surged 127% to £171m, and Bridging Finance (via the Tuscan Capital acquisition) nearly
      doubled to £121m. The Kriya Finance acquisition (closed FY2025) adds invoice finance as
      an emerging product line. The loan-to-deposit ratio of approximately 65% ensures ample
      liquidity headroom. Credit quality has been resilient: total ECL provision at year-end is
      £42.6m at a blended 1.1% coverage ratio, consistent with FY2024 (1.1%) despite 23% loan
      book growth — indicating stable rather than deteriorating asset quality. Stage 3 (impaired)
      loans of £100.2m represent approximately 2.6% of gross loans, with an 18.1% coverage
      ratio; Stage 2 loans of £387.1m (10.2% of gross book) carry a 2.9% coverage rate.
      Impairment charges of £13.3m represent an annualised cost-of-risk of approximately
      0.36% of the loan book — low for an SME lender in the current cycle. However, the Stage 2
      balance grew 25% YoY (from £308.6m to £387.1m), which warrants monitoring as a forward
      indicator of potential credit migration. The growth in Growth Finance (127%) and BRA
      (133% customer growth) means a significant proportion of the book is less than 12 months
      seasoned and has not been through a recession. Net derivative position shifted from a
      £15.4m asset (FY2024) to a £13.3m liability (FY2025), reflecting portfolio repositioning
      into debt securities as rates fell.
    claimRefs:
      - CI015
