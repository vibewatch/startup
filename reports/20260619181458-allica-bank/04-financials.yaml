  - id: gaps-diligence
    title: Financial Gaps, Risk Factors, and Diligence Asks
    body: >
      As a private company, Allica Bank's financial disclosures are comprehensive for a UK bank
      under Companies Act requirements, but material gaps remain for investment-grade underwriting.
      The bank does not disclose unit-level acquisition cost or lifetime value for BRA customers,
      making the economics of its deposit strategy — the critical driver of NIM trajectory —
      unverifiable from public data alone. No IRRBB (interest rate risk in the banking book)
      sensitivity table is publicly released, so the magnitude of NIM compression in a prolonged
      rate-cut scenario cannot be quantified externally. The interest income on BRA deposits is
      estimated at substantially below the 3.3% blended deposit cost, but the exact rate is not
      disclosed, limiting cost-of-funds modelling. Kriya Finance was acquired during FY2025 and
      no carved-out revenue or cost contribution is provided, preventing any acquisition-accretion
      analysis. Customer service feedback on Trustpilot reveals mixed reviews, with some customers
      citing concerns about fees, transaction limits, and support responsiveness — material risks
      for a bank growing its customer base at 133% annually in BRA accounts and dependent on
      high BRA retention for its funding-cost advantage. Credit-cycle risk is material: Stage 3
      loans at 2.6% of gross book are low in the current environment, but the portfolio is
      immature; Growth Finance (+127%), BRA originations, and bridging finance are all largely
      unseasoned, and no public vintage-level impairment data is available. The leverage ratio
      is not publicly disclosed, creating a gap against a PRA monitoring requirement that would
      only become visible in confidential regulatory returns or the Pillar 3 supplement. Private
      equity ownership (TCV, Blue Owl, Ventura, GLG, Sona AM) means no public market pricing
      signal exists, the complete preference stack is undisclosed, and investor return assumptions
      cannot be independently verified.
    claimRefs:
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042
    tableRefs:
      - TI006

