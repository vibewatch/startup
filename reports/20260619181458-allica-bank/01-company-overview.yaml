- id: funding-and-capital-position
  title: Funding History, Investors, and Capital Position
  body: >-
    Allica's funding trajectory reflects steady institutional confidence. The British Business
    Bank provided a Tier 2 capital facility of £30m in 2022, and on 9 June 2026 announced a
    £15m increase bringing the total to £45m, capable of supporting up to £150m of additional
    SME lending. The bank also raised approximately £100m in a Series C equity round in
    December 2022. These instruments were the primary outside capital until the Series D.

    In February 2026, Allica completed a $155m Series D round — a combination of common equity
    and a portion of new Additional Tier 1 equity capital — from new investors Ventura Capital
    (Dubai-based; also holds stakes in Uber and Spotify), GLG, and Sona AM, plus continued
    backing from existing investors TCV and Blue Owl (formerly Atalaya Capital Management).
    The round valued Allica at close to $1.2bn. Pre-Series D, the main equity holders were
    Warwick Capital Partners, TCV, and Blue Owl. This capital underpins continued UK lending
    growth, deepened AI investment, and the bank's first international expansion. A share
    capital allotment on 15 June 2026 at Companies House confirms post-Series D capital
    activity. The CityAM article notes this is Allica's third acquisition after integrating
    Allied Irish Bank's SME portfolio and Tuscan Capital.

    On the regulatory capital side, Allica's Pillar 3 report and annual report confirm strong
    positions as at 31 December 2025: CET1 ratio 13.4% (total capital ratio 16.8%), Liquidity
    Coverage Ratio 220.8%, and Net Stable Funding Ratio 138.8% — all comfortably above
    regulatory minima. The bank decided not to adopt the SDDT regime given its growth
    ambitions, instead adopting Basel 3.1 rules from their effective date. Total capital was
    £406.4m; risk-weighted exposure was £2.42bn.
