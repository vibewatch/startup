callouts:
- calloutType: strength
  title: Three-Year Profitable Streak With Accelerating Revenue
  body: >-
    Allica has achieved three consecutive profitable years (2023–2025), with FY2025 underlying
    PBT of £43.7m (+34%) and gross revenue of £371.3m (+27%). This track record is rare for
    a UK challenger bank and de-risks the growth story ahead of international expansion.
  claimRefs:
  - CO009
  - CO010
  - CO035

- calloutType: risk
  title: Adverse Customer Feedback on Fee Policy and Rate Cuts
  body: >-
    Multiple Trustpilot reviews from June 2026 cite dissatisfaction with the £25/month
    low-balance fee (BRA accounts below £10,000 average) and declining savings rates.
    While the overall rating remains 4.6/5, fee-policy adverse signals merit tracking
    as the BRA customer base scales.
  claimRefs:
  - CO043
  - CO044
  - CO045

- calloutType: risk
  title: Kriya Finance Integration Carries Legacy Loss Risk
  body: >-
    CityAM reporting notes that Kriya Finance — acquired in 2025 — had declining revenues
    (£12.6m in 2024 vs £16.9m in 2023) and a £9m pre-tax loss before the transaction.
    Integration execution and invoice-finance credit quality warrant close monitoring.
  claimRefs:
  - CO032

