  evidenceGaps:
  - type: missing-source
    severity: material
    topic: adverse-signals
    missingEvidence: >-
      FCA/PRA enforcement register records, FOS complaint data, or regulatory
      correspondence confirming whether Allica Bank has faced any formal enforcement
      action, sanctions, or significant FOS complaints.
    whyItMatters: >-
      Without regulatory adverse evidence, the assessment of Allica's regulatory health
      cannot be fully corroborated and may miss material conduct risk.
    diligencePath: >-
      Search FCA Register enforcement actions, FOS annual complaint data by firm,
      and PRA supervisory correspondence if available via FOI.
    relatedQuestionRefs:
    - QO017

  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: >-
      Cap table details, ownership percentages, liquidation preferences, board seat
      allocation, anti-dilution rights, and secondary sale activity for all equity investors.
    whyItMatters: >-
      Without cap table and governance rights data, the true economic and control structure
      of Allica cannot be assessed, which is critical for valuation diligence.
    diligencePath: >-
      Request cap table, shareholder register, and latest investment agreements from
      management data room.
    relatedQuestionRefs:
    - QO002
    relatedTableRefs:
    - TO003

  - type: conflicting-data
    severity: minor
    topic: customers
    missingEvidence: >-
      The BBB June 2026 press release cites ">25,000 smaller businesses" while the
      Series D press release and CityAM cite ">30,000 established SMB businesses". The
      difference may reflect definitions (BBB uses 'smaller businesses' per GGS criteria
      vs. Allica's broader 'established SMB' definition) but is not reconciled publicly.
    whyItMatters: >-
      The customer count is a key market-penetration metric; a ~20% discrepancy in the
      reported figure materially affects the stated 5-6% market penetration estimate.
    diligencePath: >-
      Request breakdown by product type (lending customers vs. BRA holders vs. savings
      accounts) to reconcile total SMB customer count.
    relatedQuestionRefs:
    - QO020

  - type: missing-source
    severity: minor
    topic: NIM comparison
    missingEvidence: >-
      Comparable NIM data for direct UK challenger bank SME peers (e.g. OakNorth,
      Metro Bank, Shawbrook) to benchmark Allica's 4.7% NIM in competitive context.
    whyItMatters: >-
      NIM comparison would confirm whether Allica's margin is structurally advantaged or
      in line with peer groups in UK challenger SME banking.
    diligencePath: >-
      Pull published Pillar 3 and annual report NIM data for comparable UK challenger banks.
    relatedQuestionRefs:
    - QO024
    - QO023
    - QO015

  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: >-
      Founder equity structure, management option pool details, and prior-round ownership
      percentages for individual executives are not available from public sources.
    whyItMatters: >-
      Key-person dependency analysis and incentive alignment cannot be confirmed without
      equity data for CEO Davies and other senior leaders.
    diligencePath: >-
      Request management equity schedule and vesting terms from data room.
    relatedQuestionRefs:
    - QO001
    relatedTableRefs:
    - TO002

  - type: missing-source
    severity: material
    topic: acquisitions
    missingEvidence: >-
      Post-acquisition integration metrics for Kriya Finance — credit quality of the invoice
      finance book, revenue recovery trajectory, and operational integration status since the
      2025 acquisition — are not available from public sources. Pre-acquisition declining
      revenue and a £9m pre-tax loss are known from CityAM reporting, but Allica has not
      published Kriya-specific post-acquisition performance data.
    whyItMatters: >-
      Invoice finance credit risk and integration execution are material risks given Kriya's
      pre-acquisition financial position; adequate monitoring requires internal management data
      not yet in the public domain.
    diligencePath: >-
      Request Kriya Finance integration scorecard, invoice book default rates, and updated
      revenue projections from data room. Track FY2026 interim disclosures for first
      post-acquisition segment reporting.
