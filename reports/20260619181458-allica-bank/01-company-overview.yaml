company:
  name: Allica Bank
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Allica Bank is a UK-licensed digital bank built exclusively for established
    SMEs (5–250 employees), authorised by the PRA and FCA since 2019. It reached
    unicorn status in February 2026 with a $155m Series D at a ~$1.2bn valuation,
    and its 2025 annual report confirms £371.3m gross revenue, £43.7m underlying
    pre-tax profit, £3.7bn loans, and £5.7bn deposits — all material YoY increases
    in its third consecutive profitable year. Led by CEO Richard Davies (formerly
    Revolut, OakNorth, HSBC) and chaired by John Maltby MBE, the bank serves over
    30,000 established SMBs and targets 10% market penetration by 2028.

sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: >-
    Allica Bank Limited (company number 07706156) was incorporated in England and Wales
    on 15 July 2011 and received its full banking licence from the Prudential Regulation
    Authority in 2019. It is authorised by the PRA and regulated by both the PRA and FCA
    under Financial Services Register number 821851. The registered office is at 4th/5th
    Floor, 15 Worship Street, London EC2A 2DT. Allica is structured as a private limited
    company and its filing history at Companies House, including a June 2026 share capital
    allotment, confirms active corporate activity.

    The company positions itself as the only UK bank built solely for established businesses —
    those typically employing 5 to 250 staff. This cohort makes up roughly a third of UK GDP
    and employment, yet was long underserved by the large incumbent banks, whose legacy
    technology and operating models found the segment too complex and costly to serve well.
    Allica's response is a full-stack proprietary technology platform, complemented by
    relationship managers and scalable AI tooling, delivering both the personal touch of
    traditional banking and the efficiency of a digital challenger.

    The product set spans the full lifecycle of an established SME's banking needs. The
    Business Rewards Account (BRA) is the current account and primary banking relationship
    product. Business Savings captures deposit inflows. On the lending side, Allica offers
    Commercial Mortgages, Asset Finance (via Allica Financial Services Limited, company
    12784979), Growth Finance, Bridging Finance (via Allica Bridging Finance Limited, company
    10859711, formerly Tuscan Capital acquired in 2024), Business Overdraft, Invoice Finance,
    and Embedded Finance (added through the 2025 Kriya Finance acquisition). The company's
    technology stack underpins all channels — direct digital, relationship manager, and
    broker/intermediary — with a single multi-product, multi-channel loan-management system
    now fully in place across the lending lifecycle.
