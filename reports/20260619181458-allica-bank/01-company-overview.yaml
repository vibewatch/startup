- id: FO002
  title: Allica Bank Business Model Logic
  type: flow
  layout: standard
  summary: >-
    How Allica's customer segments, product stack, technology platform, and regulatory
    framework combine to deliver the SME banking proposition.
  data:
    nodes:
    - id: seg
      label: Established SMEs (5–250 employees)
      description: Core customer segment — businesses too complex for retail banking but too small for corporate banking at incumbents.
    - id: channels
      label: Acquisition channels
      description: Direct digital onboarding, relationship managers (field/regional), and broker/intermediary network.
      dependsOn:
      - seg
    - id: products
      label: Full-stack product suite
      description: BRA (current account), business savings, commercial mortgages, asset finance, growth finance, bridging finance, invoice finance, business overdraft.
      dependsOn:
      - channels
    - id: tech
      label: Proprietary technology platform
      description: Single-threaded squad model; multi-channel, multi-product loan-management system; AI-enabled decisioning and relationship tools.
      dependsOn:
      - products
    - id: regulation
      label: PRA/FCA regulatory framework
      description: Authorised as a deposit-taking bank; subject to capital adequacy, liquidity, and consumer duty rules; Scale-Up Unit inaugural cohort.
      dependsOn:
      - tech
