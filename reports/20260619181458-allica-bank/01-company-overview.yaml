- id: scale-milestones-adverse
  title: Scale, Milestones, and Adverse Signals
  body: >-
    Allica's 2025 annual report presents its strongest year to date. Gross revenue reached
    £371.3m (+27% YoY), underlying profit before tax £43.7m (+34%), and gross profit after
    risk £145.3m (+32%), all marking Allica's third consecutive profitable year. The loan
    book grew 23% to £3.7bn, driven by commercial mortgages (£2.4bn, +35%), asset finance
    (£507m, +19%), growth finance (£171m, +127%), and bridging finance (£121m, +85%).
    Customer deposits rose 29% to £5.7bn. The BRA grew 133% to over 14,000 active customers.
    Net interest margin expanded from 4.5% in 2024 to 4.7% in 2025. Headcount reached 799
    (31 Dec 2025), with over 800 at the date the accounts were signed. The bank's AI
    engineering adoption reached 79% daily usage by January 2026, with a doubling of merged
    pull requests during H2 2025.

    The milestone record is consistent with a bank on an accelerating trajectory. External
    recognition includes three consecutive Deloitte UK Technology Fast 50 wins (2023–2025),
    the Sunday Times fastest-growing private company UK award (2024), and the FT second-fastest
    growing company in Europe (2025). Allica also won Bank of the Year at the CityAM Awards
    for four consecutive years. The British Business Bank's Oxford Economics-commissioned
    research found that for every £1m Allica lends, it generates £2.4m in GDP, 35 jobs, and
    £600,000 in tax revenue.

    The adverse picture is modest but real. Trustpilot reviewers (rating 4.6/5 overall) have
    complained about a £25/month low-balance fee introduced for BRA customers with average
    balances below £10,000 from February 2026, and about declining savings rates (noted as
    falling from 4.2% to 2.3%). No corroborated regulatory enforcement, sanctions, or major
    litigation surfaced in the retained evidence. Allica's acquisition of Kriya Finance — which
    CityAM noted had revenues declining from £16.9m to £12.6m and a £9m pre-tax loss in 2024
    before acquisition — is a monitored integration risk. The bank also disclosed that
    geo-political events in 2026 have created heightened market volatility, though the Board
    expressed confidence in its strategy.
