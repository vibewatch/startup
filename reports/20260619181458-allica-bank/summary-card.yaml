  topStrengths:
    - >-
      Three consecutive profitable years with 27% gross revenue growth and £43.7m underlying PBT at a 4.7% NIM
      demonstrate sustainable lending economics before a full credit-cycle test
    - >-
      Exclusive focus on the 265,000-firm UK established-SME segment creates a defensible niche with differentiated
      distribution (relationship managers + broker network) that neither incumbent banks nor pure-digital challengers
      replicate
    - >-
      $155m Series D at ~$1.2bn from institutional investors (TCV, Blue Owl, Ventura Capital) provides capital runway
      for AI investment, international expansion, and UK loan-book growth
    - >-
      Full-stack proprietary technology platform with a single multi-product loan-management system removes legacy tech
      drag and enables AI-assisted underwriting and customer onboarding at scale
  topRisks:
    - >-
      Loan book has not been through a full credit cycle; Stage 3 impaired loans rose 68% to £100.2m (2.6% of book) and
      Stage 2 watch-list loans reached £387m in an elevated UK SME insolvency environment
    - >-
      CET1 capital ratio declined from 14.5% to 13.4% as RWA growth outpaced capital accumulation; at current 23%
      loan-book growth, additional dilutive capital raises are likely within 12–18 months
    - >-
      Private-company opacity — undisclosed equity cap table, investor terms, per-product margins, and complaint volumes
      — materially limits underwriting confidence and complicates portfolio monitoring
    - >-
      Early-stage international expansion (£1.3m sunk costs, no market yet launched) and Kriya Finance integration add
      execution risk on top of organic UK growth demands
  unresolvedGaps:
    - >-
      Exact NPL default rates, loss-given-default experience, and sector-level loan concentration are not publicly
      disclosed; full-cycle credit loss performance remains unobserved
    - >-
      International expansion market targets, launch timeline, and capital earmarked for European entry have not been
      publicly disclosed beyond general Series D intent
    - >-
      Cumulative lifetime equity raised and pre-Series D investor ownership structure are not confirmed in public
      sources
    - >-
      Volume and nature of FCA/FOS complaints, regulatory outcome of the February 2026 low-balance fee, and
      customer-service SLA performance are not disclosed
