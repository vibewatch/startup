summary:
  headline: >-
    Allica Bank is a profitable UK SME challenger bank at unicorn scale with strong growth momentum; the investment case
    is supported by sustainable NIM and three profitable years but capped by credit-cycle risk, declining capital
    ratios, and private-company opacity.
