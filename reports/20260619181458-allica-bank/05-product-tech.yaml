    - type: private-evidence-only
      severity: material
      topic: core banking vendor
      missingEvidence: Identity and contract terms of any third-party core banking platform vendor(s) used beneath Allica's proprietary layer.
      whyItMatters: >-
        If a commercial core banking engine (Temenos, Thought Machine, Mambu, etc.) underpins
        the proprietary interface, vendor concentration risk, licence fees, and switching costs
        are material to the technology risk assessment and cost structure.
      diligencePath: >-
        Request direct disclosure from Allica management in due diligence; review vendor
        contracts and technology licences; cross-reference the accelerated amortisation
        of £4.6m with specific system names.
      relatedQuestionRefs: [QE002, QE013]

    - type: private-evidence-only
      severity: material
      topic: AI underwriting models
      missingEvidence: Description of AI/ML models used in the Loan Processing Hub, their validation methodology, and the automation rate for lending decisions.
      whyItMatters: >-
        Undisclosed model design and governance creates model risk exposure that cannot be
        independently assessed. If AI-automated decisions have a higher error rate than
        manually reviewed decisions, credit losses and conduct risk could be underestimated.
      diligencePath: >-
        Request model risk framework documentation, model validation reports, and back-testing
        results from management; assess model governance function in credit risk review.
      relatedQuestionRefs: [QE004, QE021]

