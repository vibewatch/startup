callouts:
  - calloutType: strength
    title: Proprietary Full Stack with Measurable AI Productivity Lead
    body: >-
      Allica's proprietary technology stack — confirmed to be React/Kotlin/Azure with a
      purpose-built Loan Processing Hub — is architecturally independent of legacy
      incumbent infrastructure. The 2025 AI adoption trajectory (from <50% to >80%
      organisation-wide usage, top-decile Jellyfish benchmarking, doubled H2 2025
      merged pull requests) provides credible evidence of a structural engineering
      productivity advantage that compounds as the squad model scales.
    claimRefs:
      - CE014
      - CE015
      - CE026
      - CE027
      - CE028
      - CE029

  - calloutType: risk
    title: Undisclosed Core Banking Vendor and Accelerating Legacy Amortisation
    body: >-
      Allica does not publicly name any core banking platform vendor. The rising
      accelerated amortisation charge on legacy technology platforms (£4.6m in 2025
      vs £1.5m in 2024) is consistent with active migration away from third-party
      systems, but the identity and scope of those systems cannot be independently
      confirmed. This is a material disclosure gap: if a commercial core banking
      engine underpins the proprietary layer, switching risk, licence fees, and
      vendor concentration would be relevant to the risk picture.
    claimRefs:
      - CE024
      - CE025
      - CE051

  - calloutType: risk
    title: Unregulated Subsidiaries Deliver the Majority of Lending
    body: >-
      Asset finance, growth finance, and bridging finance are delivered through
      subsidiaries that are explicitly not authorised by the PRA or FCA. While
      standard for commercial lending, this means that customers in these products
      have no recourse to FSCS, the Financial Ombudsman Service, or other FCA consumer
      protection mechanisms. Investor due diligence should assess whether the group's
      risk governance and conduct standards apply equivalently to unregulated entities.
    claimRefs:
      - CE005
      - CE007
      - CE008
      - CE009

