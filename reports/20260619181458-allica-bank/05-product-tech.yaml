  - id: evidence-gaps-and-product-risk-assessment
    title: Evidence Gaps, Product Limitations, and Technical Risk
    body: >-
      Several material evidence gaps constrain the diligence picture. First, Allica
      does not disclose the identity of any core banking platform vendor, and the
      accelerated amortisation charges suggest some third-party legacy infrastructure
      remains in active wind-down. Whether the proprietary layer sits on top of a
      commercial core banking engine (such as Temenos, Thought Machine, or similar)
      or is entirely in-house-built cannot be determined from public sources. Second,
      the exact underwriting models, credit scoring algorithms, and model validation
      frameworks used in the AI lending infrastructure are not described publicly,
      making independent model risk assessment impossible from external sources.
      Third, Allica has no disclosed security certifications (ISO 27001, SOC 2,
      Cyber Essentials), which is atypical for a bank at this scale and complicates
      vendor and enterprise customer due diligence. Fourth, FOS complaint volumes
      and PRA supervisory findings are not publicly accessible in sufficient granularity
      to independently assess operational risk quality.

      On the product side, the BRA's £25/month minimum-balance fee creates a threshold
      that excludes the lower end of the target segment (businesses with less than
      £10,000 average monthly balances), and the cashback programme's exclusion of
      bank transfers (only card payments qualify) means the reward structure is
      less attractive for businesses whose primary expenditure is transfer-based.
      The invoice finance and embedded finance product lines (via Kriya) are early-stage
      and not yet scaled; the technical integration of Kriya's infrastructure into
      Allica's platform is ongoing, and no detailed roadmap or integration timeline
      has been publicly disclosed.
