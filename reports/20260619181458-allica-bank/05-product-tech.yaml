  - id: customer-experience-security-and-compliance
    title: Customer Experience, Security, and Regulatory Compliance
    body: >-
      Customer experience signals are consistently strong: 4.7/5 on the Apple App
      Store (4.6/5 in 2024), 4.6/5 on Google Play Store, 4.7/5 on Trustpilot
      (2026 current reviews), and 4.89/5 on Smart Money People with over 2,400
      reviews. Customer NPS stands at +76 as of November 2025 (vs +67 in November
      2024), with broker NPS at +52 and accountant NPS at +79. Qualitative Trustpilot
      reviews highlight the app's ease of use, proactive relationship managers, and
      fast onboarding. A subset of negative reviews centre on the £25 monthly fee for
      low-balance accounts and eligibility criteria that some customers discovered
      after opening.

      Security posture relies on the .bank top-level domain — a tightly regulated
      TLD that imposes higher identity-verification requirements than .com — and
      HTTPS enforcement across all services. The published security page specifies a
      password policy of minimum 10 characters with at least one uppercase, one
      special character, and one number, and encourages password-manager use.
      Allica's fraud guidance highlights phishing, vishing, and social engineering
      risks and provides a dedicated fraud centre. However, Allica does not publicly
      disclose ISO 27001, SOC 2, or Cyber Essentials certifications on its website,
      which is an evidence gap compared to some peers.

      On the regulatory front, Allica Bank Limited is authorised by the PRA and
      regulated by both the PRA and FCA (FRN: 821851). Savings and current account
      products are covered by FSCS protection, with the Bank of England having
      committed to increasing the FSCS deposit protection limit from £85,000 to
      £120,000 — a change Allica publicly advocated for. Lending products, asset
      finance, growth finance, and bridging finance are unregulated commercial
      products delivered through subsidiary entities without PRA/FCA oversight.
      Allica is in the inaugural cohort of the PRA/FCA Scale-Up Unit for
      high-potential firms, giving it a degree of regulatory engagement unavailable
      to smaller challengers. Capital adequacy stands at CET1 13.4% and total capital
      ratio 16.8% as of 31 December 2025, and Allica has adopted Basel 3.1 rather
      than the SDDT regime, reflecting its growth ambitions.

      No FCA enforcement actions, Financial Ombudsman Service (FOS) referral
      disclosures, or significant operational incidents have been found in public
      sources for the 2025–2026 period, though the absence of FOS volume data is
      itself an evidence gap.
