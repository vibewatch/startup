  - id: ai-strategy-integrations-and-developer-productivity
    title: AI Strategy, Integrations, and Developer Productivity
    body: >-
      AI has rapidly become a core operating feature. Allica moved from fewer than
      50% of employees using AI tools in Q1 2025 to over 80% in Q4 2025 and 79% daily
      AI usage by January 2026. The bank benchmarked itself against the Jellyfish
      AI Engineering Trends study — the largest such benchmarking exercise available,
      covering 700+ companies and 200,000 engineers — and placed in the top decile for
      AI adoption. Autonomous developer-agent usage in Q4 2025 drove a more-than-doubling
      of merged pull requests in H2 2025. The bank won the FSTech Awards 2026 category
      for "best use of technology in Commercial Finance" across EMEA.

      On the lending side, Allica introduced fully automated agentic AI loan decisions
      in 2025, applying AI to automate data-entry and underwriting tasks that were
      previously manual. Proprietary internal data from the Loan Processing Hub is used
      to shadow-test and live-pilot AI agents for complex lending use cases — an
      advantage Allica claims is faster and more accurate than standalone fintechs
      building equivalent tools without access to the underlying loan data.

      On the integration front, 2025 saw the launch of QuickBooks connectivity
      alongside Apple Pay and Google Pay. Xero and Sage integrations are also
      available. The open-banking data feed allows transactions to pull automatically
      into accountants' software, a feature that has been positively highlighted by
      accountancy partners and customers alike. The accountants channel is staffed with
      ex-ICAEW, ex-Xero, and ex-Dext professionals. As of H1 2026, expense-card
      expense management and bill-pay tools are being built out for BRA holders.

      No public GitHub repository, open-source contribution, or developer API
      documentation has been found for Allica Bank. This represents a gap in
      independent developer-signal: the engineering community signal comes from
      internal engineering blog posts and job postings on the Allica technology page
      rather than from observable open-source or public API activity.
