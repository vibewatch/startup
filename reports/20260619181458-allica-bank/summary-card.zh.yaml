  topStrengths:
    - 连续三年盈利，毛收入增长 27%，在 4.7% NIM 下实现 £43.7m 基础 PBT；完整信用周期尚未检验，但放贷经济性已经跑通
    - 专注 265,000 家英国成熟 SME，关系经理 + 经纪人网络形成差异化分销；传统银行和纯数字挑战者都难以复制这个细分阵地
    - TCV、Blue Owl、Ventura Capital 等机构以约 $1.2bn 估值投入 $155m Series D，为 AI 投资、国际扩张和英国贷款账簿增长提供资金跑道
    - 全栈自研技术平台用单一多产品贷款管理系统替代遗留技术包袱，让 AI 辅助承保和客户开户可以规模化
  topRisks:
    - 贷款账簿尚未穿越完整信用周期；英国 SME 破产环境偏高，Stage 3 减值贷款增长 68% 至 £100.2m（占账簿 2.6%），Stage 2 观察名单贷款达到 £387m
    - RWA 增长快于资本积累，CET1 资本比率从 14.5% 降至 13.4%；按当前 23% 贷款账簿增速，12–18 个月内很可能还要稀释性融资
    - 私营公司透明度低，股权结构、投资人条款、分产品利润率和投诉量均未披露，实质限制承保信心，也让投后监控更复杂
    - 国际扩张仍在早期（已沉没 £1.3m、尚未推出任何市场），叠加 Kriya Finance 整合，在英国本土有机增长之外增加执行风险
  unresolvedGaps:
    - 精确 NPL 违约率、违约损失率经验和行业层面贷款集中度未公开披露；完整周期信用损失表现仍不可观察
    - 除 Series D 的笼统用途外，国际扩张目标市场、上线时间表和欧洲进入资金预留均未公开披露
    - 公司成立以来累计股权融资额和 Series D 前投资人持股结构尚无公开来源确认
    - FCA/FOS 投诉数量与性质、2026 年 2 月低余额费用的监管结果，以及客户服务 SLA 表现均未披露
