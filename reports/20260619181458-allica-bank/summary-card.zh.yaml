  headline: Allica Bank 已是独角兽规模的英国 SME 挑战者银行，增长动能强且已经盈利；可持续 NIM 和连续三年盈利支撑投资逻辑，但信用周期风险、资本充足率下滑和私营公司信息不透明压住上行空间。
