  topStrengths:
    - >-
      Category leadership in frontline EHS/operations SaaS with 85,000 businesses and 2M+ workers across 180+ countries
      provides durable network and switching-cost advantages.
    - >-
      Broad platform covering inspections, training, issue management, sensors, and marketplace reduces single-product
      concentration risk and opens cross-sell expansion.
    - >-
      Frontline worker data at scale is a credible foundation for AI-driven features and operational intelligence
      products not easily replicated by narrower point solutions.
  topRisks:
    - >-
      AU$2.5B headline valuation implies 15-21x ARR at prevailing estimates, a 2-3x premium to EHS and operations SaaS
      peers, with secondary markets clearing ~31-35% below that mark.
    - >-
      Governance ambiguity — two CEOs within 14 months and conflicting public signals on current leadership — creates
      key-person and strategy execution uncertainty.
    - >-
      No audited consolidated group-level financials are publicly available; revenue, margin, and burn rate figures are
      third-party estimates that cannot be independently verified.
    - >-
      Restructuring activity and headcount ambiguity through 2024 leave operating cost trajectory unclear at a stage
      where the path to profitability matters for valuation support.
  unresolvedGaps:
    - Audited consolidated revenue, gross margin, burn rate, and cash runway remain non-public.
    - Confirmed current CEO identity and board-resolution documentation for the leadership transition.
    - Net Revenue Retention, churn, and customer concentration metrics have not been publicly disclosed.
    - Exact preference stack, liquidation rights, and secondary mechanics for the September 2024 round.
