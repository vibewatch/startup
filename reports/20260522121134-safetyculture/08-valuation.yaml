callouts:
  - id: CV-CALL-01
    type: recommendation
    title: "Conditional Cautious: Entry at AU$1.75-2.0B Required"
    body: >
      SafetyCulture is a genuine category leader in EHS and operations SaaS with
      a defensible competitive position, enterprise customer retention, and a
      credible AI strategy. At AU$2.5B, the implied 15-21x ARR multiple cannot be
      justified without audited financials, confirmed ARR above AU$180M, and
      demonstrated AI revenue. Secondary-market pricing at AU$1.63-1.72B (31-35%
