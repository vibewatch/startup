      The AU$165M round anatomy reveals a structurally ambiguous signal: the
      AU$90M secondary component at a AU$200M down-round price suggests early
      investors were unwilling to hold at the 2023 AU$2.7B mark, creating a
      price-discovery disconnect that feeds directly into the Conditional Cautious
      recommendation. The AU$2.5B primary is a negotiated price, not a market-clearing one.
