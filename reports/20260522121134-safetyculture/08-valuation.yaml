  evidenceGaps:
    - type: no-public-evidence
      topic: Net Revenue Retention (NRR) not publicly disclosed
      missingEvidence: SafetyCulture does not publicly report NRR or customer retention cohort data. NRR above 115% would be the key metric to justify a premium multiple.
      whyItMatters: Without confirmed NRR, the valuation quality case rests on revenue growth alone, which at 15-21x ARR multiples is insufficient to justify the primary price.
      relatedQuestionRefs: [QV019]
      relatedTableRefs: [TV001, TV006]
      severity: major
    - type: no-public-evidence
      topic: Gross margin and cash burn not audited or publicly disclosed
      missingEvidence: SafetyCulture has not published audited consolidated financials. SmartCompany reports AU$36M net loss in FY24 but gross margin is not disclosed.
      whyItMatters: Gross margin (must exceed 70% for software multiples to apply) and burn rate determine the investability of the current primary price versus secondary entry.
      relatedQuestionRefs: [QV020, QV023]
      relatedTableRefs: [TV006]
      severity: major
    - type: no-public-evidence
      topic: Enterprise vs SMB revenue mix not publicly disclosed
      missingEvidence: SafetyCulture does not segment or disclose its ARR by customer size. Enterprise mix above 60% would support premium multiple; SMB-heavy mix would compress it.
      whyItMatters: Customer mix determines valuation quality (enterprise = higher NRR, lower churn, higher multiple).
      relatedQuestionRefs: [QV033, QV034]
      relatedTableRefs: [TV001]
      severity: moderate
    - type: partial-coverage
      topic: Comparable valuation table (TV004) has partial coverage — private EHS SaaS peers have limited public valuation data
      missingEvidence: Cority, Benchmark ESG, and Sphera peer multiples are estimated from secondary reports; direct audited transaction data is not publicly available for all comparables.
      whyItMatters: The comparables table drives the EV/ARR benchmark range; partial coverage means the 6-10x ceiling is an estimate, not a confirmed transaction floor.
      relatedQuestionRefs: [QV017, QV018]
      relatedTableRefs: [TV004]
      severity: moderate
sections:
  - id: SV-S01
    title: "Valuation Backdrop: Last-Round Anatomy and Context"
    body: >
      SafetyCulture's current headline valuation of AU$2.5 billion derives from its
      September 2024 funding round — a AU$165M raise comprising AU$75M in primary
      capital and AU$90M in secondary proceeds, led by AirTree Ventures. The round
      was priced at a AU$200M discount to the AU$2.7B mark achieved in 2023, making
      it one of Australia's most prominent down-rounds of the cycle. The secondary
      component deserves particular attention: at 55% of total round proceeds, the
      AU$90M secondary portion signals meaningful early-investor and employee
      liquidity demand at a price below the prior mark — a dynamic more consistent
      with constrained exit optionality than with a company approaching transformative
      growth inflection.


      Context from the broader SaaS environment reinforces the significance of the
      down-round. PitchBook Q4 2025 data shows late-stage private SaaS median
      EV/ARR compressed from 18x in 2021 to 7x in 2025. SafetyCulture's 2024
      reset to AU$2.5B represents a partial correction rather than a full
      normalisation to the new market-clearing level. At AU$160.6M FY24 revenue
      (SmartCompany), the current implied multiple is still 15-21x ARR depending on
      the revenue basis used — materially above the 6-10x range for EHS SaaS peers.


      The UK Companies House filing for SAFETYCULTURE (UK) LIMITED (company 11007705,
      accounts to June 2024) provides a rare window into entity-level financials:
      total assets of £4.25M, net assets of £3.01M, and 62 employees. This limited
      UK footprint confirms that the majority of revenue, IP, and operating risk sits
      in the unlisted Australian parent — for which no audited group-level financials
      have been published. The absence of audited consolidated accounts is a
      first-order due diligence gap that prevents independent verification of all
      management-reported revenue, growth, and margin claims.
    claimRefs: [CV001, CV002, CV003, CV007, CV022, CV023, CV024, CV030, CV032]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: SV-S02
    title: "Comparable Analysis: EHS SaaS Peers and the Public Market Anchor"
    body: >
      Valuation of a private, high-growth SaaS company without audited financials
      necessarily anchors to comparable-transaction analysis and public-market
      multiples. This section applies both frameworks to derive a credible range.


      On the public SaaS side, the median EV/NTM Revenue for listed SaaS compressed
      to 6.4x in Q1 2026 per SaaS Valuation Multiple tracker data, with only
      AI-native or highly profitable companies sustaining double-digit multiples.
      SafetyCulture, which reported a AU$36M net loss in FY24, is neither AI-revenue
      proven nor profitable — it would need to demonstrate one of these attributes to
      justify a premium above the 8-10x band reserved for top-quartile growers.


      On the EHS SaaS private-market side, Aventis Advisors benchmarks show M&A
      transactions averaging approximately 2.0x revenue for the broader EHS sector
      and 7-9x for category leaders. Capstone/IMAP shows SaaS software M&A in 2025
      averaged 5.1x EV/ARR, with premium assets reaching 8-12x. MarketScreener data
      for EHS and compliance software shows listed and private comparable companies
      at 5-8x EV/Revenue median. Software Equity Group's 2025 B2B SaaS median was
      4.5-6.5x EV/ARR for private transactions. NatLawReview/SEG 2026 outlook
      projects 6-10x ARR for EHS category leaders from strategic acquirers.


      Combining these anchors, the defensible comparable range for SafetyCulture is
      6-10x ARR, which on AU$160M FY24 revenue yields AU$0.96B-AU$1.6B — well below
      the AU$2.5B primary price. Achieving AU$2.5B on comps alone would require either
      confirming AU$200M+ ARR (IBISWorld's AU$197.6M 2025 estimate, which is benchmarked
      not audited) or applying a 12-15x multiple justified by demonstrated AI-augmented
      growth — neither condition is currently verifiable from public data.
    claimRefs: [CV010, CV011, CV012, CV014, CV015, CV031, CV038, CV039, CV040]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: SV-S03
    title: "Scenario Modelling and Secondary-Market Cross-Check"
    body: >
      Three scenarios bracket the valuation range for SafetyCulture as of May 2026.
      The bull case (12-15x ARR on AU$200M+ forward ARR = AU$2.4-3.0B) requires
      verified growth acceleration and AI monetisation proof. The base case (8-10x
      ARR on AU$160M FY24 revenue = AU$1.28-1.6B) is most consistent with available
      public data and prevailing private-market comps. The bear case (4-6x ARR on
      AU$119M Tracxn-implied ARR = AU$0.48-0.71B) materialises if the May 2026
      restructuring reflects demand-side stress rather than efficiency optimisation.


      Secondary-market data provides an independent cross-check on these scenarios.
      PremierAlts reports SafetyCulture trading at approximately AU$1.72B (31%
      discount to primary). UpsideList notes approximately 35% below the last primary
      round. William Blair's 2026 analysis shows pre-profitability unicorns in the
      AU$1-5B range trade at 25-35% secondary discounts. Flux Finance places fair
      value at AU$1.6-2.0B absent audited confirmation. These data points converge
      around AU$1.6-1.8B as the current market-implied value — consistent with the
      base-case comp analysis and 28-36% below the AU$2.5B primary.


      The leadership instability compounds the scenario analysis: two CEO changes in
      14 months (Luke Anear to Kelly Vohs January 2025; Vohs out, Anear interim March
      2026) concurrent with a headcount reduction of approximately 10% (around 170
      roles) are more consistent with investor-pressure dynamics than operational
      confidence. For a company approaching IPO readiness, permanent CEO succession
      is a prerequisite for any public-market valuation process, extending the return
      timeline for secondary investors.
    claimRefs: [CV005, CV016, CV017, CV018, CV019, CV025, CV026, CV027, CV028, CV029, CV033, CV036, CV037]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: SV-S04
    title: "Investment Recommendation and Diligence Conditions"
    body: >
      SafetyCulture merits a Conditional Cautious verdict at the AU$2.5B headline
      primary valuation. The company is a genuine category leader in EHS and
      operations SaaS — Verdantix Green Quadrant 2025 places it in the leader
      quadrant, it has a 65M+ frontline worker TAM, strong enterprise customer
      retention, and an AI strategy validated by the Twine acquisition. These
      attributes would support a premium multiple in a normalised environment
      with audited financials and permanent leadership.


      The caution is anchored to four specific evidence gaps: (1) absence of audited
      group-level financials prevents independent ARR, growth, and margin verification;
      (2) the AU$2.5B primary implies 15-21x ARR — double to triple the prevailing
      private SaaS median of 5-7x; (3) secondary markets already price the company
      at AU$1.6-1.8B, consistent with comp-based fair value; and (4) the two-CEO-in-14-months
      leadership cycle and May 2026 restructuring introduce execution risk not
      priced into the primary headline.


      The investable scenario is entry at AU$1.75-2.0B, approximately a 20-30%
      discount to the last primary round. At this level, the implied ARR multiple
      falls to 11-13x on AU$160M FY24 revenue — still a premium to the 6-10x comp
      median, but justifiable given TAM leadership, customer retention, and AI
      optionality. Any primary investment at AU$2.5B should be conditioned on:
      audited FY25 financials, confirmed ARR above AU$180M, and a permanent CEO
      appointment with a 90-day track record. A strategic acquirer paying above
      AU$2.5B in 2026-2027 would need to anchor to an AU$200M+ ARR trajectory and
      confirmed AI revenue traction, neither demonstrable from current public data.
    claimRefs: [CV013, CV020, CV021, CV034, CV035, CV041]
    tableRefs: [TV002, TV005, TV006]
    figureRefs: [FV004]
