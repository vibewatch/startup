company:
  name: SafetyCulture
chapter:
  number: 8
  title: Valuation
  summary: >
    SafetyCulture's AU$2.5 billion September 2024 primary-round valuation implies a
    revenue multiple of approximately 15-21x on the most plausible ARR estimates
    (AU$119-160M) — a material premium to the 6-10x EV/Revenue range prevailing for
    best-in-class public and private EHS and operations SaaS peers in 2026. Three
    compounding factors complicate the headline: (1) the round itself represented an
    AU$200M down-round from the 2023 peak of AU$2.7B; (2) AU$90M of the AU$165M raised
    was secondary, signalling early-investor and employee liquidity pressure at a price
    below the prior mark; and (3) secondary-market data (GetLatka, PremierAlts,
    UpsideList) implies a current market-clearing value near AU$1.7B — a ~32% discount
    to primary. Against this backdrop the chapter reaches a Conditional Cautious verdict:
    SafetyCulture is a genuine category leader in EHS and operations SaaS with strong
    customer retention, credible AI conviction (Twine acquisition), and a multi-year
    growth track, but the AU$2.5B headline fully prices an optimistic scenario without
    the audited financials, confirmed ARR, or demonstrated AI revenue lift that would
    justify the premium. Entry at AU$1.75-2.0B (a 20-30% discount) would produce a
    materially better risk-adjusted return profile, particularly given the two-CEO-in-14-months
    leadership instability, the May 2026 restructuring, and unresolved succession.
