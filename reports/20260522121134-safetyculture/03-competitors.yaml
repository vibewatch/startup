  evidenceGaps:
    - id: EGP001
      gapType: private-evidence-only
      severity: moderate
      description: >-
        Multi-homing behavior among SafetyCulture customers (QP027) — whether and to what extent customers
        simultaneously use SafetyCulture alongside Cority, Intelex, or CMMS tools — is not documented in
        any publicly available source. SafetyCulture does not disclose customer use-case segmentation or
        module adoption rates. This gap prevents definitive assessment of platform consolidation risk and
        cross-sell success metrics.
      relatedQuestionRefs:
        - QP027
      diligenceAsk: >-
        Request from management: (1) percentage of Premium/Enterprise customers with >2 active modules;
        (2) any co-deployment data showing SafetyCulture alongside Cority/Intelex; (3) net revenue retention
        by module count cohort.
