figures:
  - id: FP001
    title: Competitive Positioning Map
    type: quadrant
    layout: standard
    summary: >-
      Two axes provide an evidence-backed ordinal positioning across the main competitor classes.
      X-axis: Platform breadth score (1 = narrow inspection-only; 5 = full multi-module platform).
      Y-axis: Enterprise compliance depth score (1 = minimal compliance capability; 5 = deep EHS/EHSQ suite).
      Scores are evidence-based ordinal rankings derived from product documentation, buyer guide analysis,
      and review site research — not quantified from a single source.
    data:
      xAxis:
        label: Platform Breadth (1=inspection-only to 5=full-stack)
        min: 1
        max: 5
      yAxis:
        label: Enterprise Compliance Depth (1=basic to 5=deep EHSQ suite)
        min: 1
        max: 5
      points:
        - label: SafetyCulture
          x: 4
          y: 2
          note: Broad platform (inspection + training + sensors + asset + marketplace) but moderate EHS compliance depth
        - label: GoAudits
          x: 1
          y: 1
          note: Inspection-focused; no training/IoT modules; low compliance depth
        - label: Lumiform
          x: 1
          y: 1
          note: Inspection/audit focused; Series A; no EHS suite capabilities
        - label: Cority
          x: 3
          y: 5
          note: Deep EHSQ including occupational health and ESG; moderate platform breadth
        - label: Intelex
          x: 3
          y: 5
          note: Deep EHSQ and quality management; moderate breadth including training
        - label: VelocityEHS
          x: 2
          y: 4
          note: Strong EHS depth; narrower breadth; U.S. chemical/ergonomics specialization
        - label: Enablon
