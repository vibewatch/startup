    rows:
      - - Template library and workflow rebuild switching cost
        - GoAudits / Lumiform offer migration tooling and template import; low-cost migration reduces rebuild friction
        - Medium
        - Capterra reviews note template rebuilding is disruptive but possible; competitors marketing migration assistance
        - Verify average customer template library size; confirm whether competitors have automated import tools
      - - Historical data lock-in
        - SafetyCulture supports CSV data export; no proprietary binary format confirmed
        - Medium
        - Data portability feature confirmed in documentation; not a contractual lock-in mechanism
        - Confirm whether analytics/dashboard configurations are exportable or must be rebuilt
      - - Embedded API integrations
        - Competitors offer SAP/Salesforce/Power BI connectors too; integration parity increasing
        - Medium
        - Lumiform, GoAudits, Intelex all offer comparable integration connectors as of 2026
        - Quantify percentage of enterprise customers with >3 active integrations to estimate real integration stickiness
      - - Mobile-first UX and frontline adoption
        - Cority, VelocityEHS, Intelex investing in mobile-first updates; gap narrowing
        - Low–Medium
        - Review site evidence as of 2026 still rates SafetyCulture higher on ease-of-use; but improvement trend noted
        - Benchmark user-adoption scores for new customers vs 12 months; compare against peer data
      - - Freemium funnel and PLG motion
        - PLG motion creates large SMB customer base but may not convert efficiently to high-value enterprise accounts
        - Medium
        - No public disclosure of free-to-paid conversion rate or SMB vs enterprise revenue mix
        - Request revenue split by plan tier and customer cohort from management
      - - Platform breadth (training + sensors + asset)
        - Buyers may prefer best-of-breed tools (specialist LMS, specialist CMMS, specialist EHS) over a single platform
        - Medium–High
        - Industry trend toward platform consolidation (Verdantix 2025) but also toward specialized AI tools
        - Survey whether existing customers use all modules or primarily inspection only
      - - EHS incumbent enterprise entrenchment
        - Cority/Intelex customer relationships built over 10+ years; multi-year contracts; compliance module depth
