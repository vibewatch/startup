  - id: TP004
    title: Moat Durability and Competitive Risk Register
    layout: wide
    notes: >-
      Severity ratings (High / Medium / Low) are evidence-based assessments, not quantified scores. Diligence
      asks are open questions that a primary investor interview should attempt to answer.
    columns:
