    notes: >-
      Revenue estimates for private companies are from third-party intelligence platforms (Growjo, ZoomInfo,
      Tracxn) and should be treated as indicative, not verified financials. SafetyCulture revenue not
      publicly disclosed. Pricing for EHS incumbents is custom-quoted; ranges shown are industry intelligence
