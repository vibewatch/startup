        - Direct inspection peer
        - Self-funded/bootstrapped; ~$5M est. revenue
        - SMB to mid-market; hospitality, retail, food, facilities
        - Lowest published price ($10/user/mo Starter); 4.8/5 user rating; multi-site reporting
        - No training, sensors, or asset modules; narrower platform breadth
      - - Lumiform
        - Direct inspection peer
        - ~$13.1M raised (Series A, 2022); ~$4.8M est. revenue; ~40 employees
        - SMB to mid-market; manufacturing, food, construction
        - Mobile-first UX; AI form creation; rapid deployment; €16/user/mo Professional
        - Much smaller scale; no training/IoT/marketplace; employee headcount declining
      - - Fluix
        - Direct inspection peer (premium tier)
        - Undisclosed; niche/bootstrapped; Dublin-based
        - Enterprise field service; aviation; construction
        - Legally binding document workflows; tamper-proof audit trails; e-signatures
        - Higher cost; narrow market focus; no freemium funnel
      - - Donesafe (HSI)
        - Direct inspection peer / lower EHS suite
        - Acquired by HSI (private); undisclosed revenue
        - Mid-market compliance; incident management; audits
