  - id: adverse-evidence
    title: Adverse Competitor Evidence and Displacement Risk
    body: >-
      Several categories of adverse evidence present material risk to SafetyCulture's competitive position
      and must be preserved as diligence obligations.

      Pricing displacement from below: GoAudits' Starter plan at $10/user/month is 58% cheaper than
      SafetyCulture Premium at $24/user/month (annual), and 66% cheaper than the monthly rate of $29.
      GoAudits' user rating of 4.8/5 is slightly above SafetyCulture's 4.6/5. For cost-sensitive buyers who
      need inspection and corrective action workflows without training or sensors, GoAudits represents a
      fully adequate and cheaper alternative. This is an unambiguous downward pricing pressure on SafetyCulture's
      SMB contract value, and any price increase will accelerate competitive substitution at this tier.

      SafetyCulture-specific product complaints (verified from Capterra and Software Advice reviews, 2026):
      (a) Multi-step approval workflows are limited — the platform handles one-directional approvals and
      cannot support complex multi-stage sign-off chains that regulated organizations require; (b) Per-user
      pricing becomes expensive at scale for large frontline deployments where most workers are occasional
      users rather than power inspectors; (c) Reporting customization has limits — highly tailored layouts
      require workarounds or third-party integration with Power BI/Tableau; (d) Template modification
      requires rebuilding from scratch rather than incremental editing of published templates.

      EHS incumbent enterprise moat: Cority with 1,500+ enterprise customers and Intelex with 1,400+
      represent deeply entrenched relationships across regulated industries. These incumbents have long-term
      contracts, deep occupational health and process safety modules, and embedded regulatory reporting
      workflows that SafetyCulture does not replicate. For SafetyCulture to displace an EHS incumbent in
      a Fortune 500 account, it must demonstrate not just better mobile UX but equivalent compliance depth —
      a challenge given the incumbent's regulatory module libraries and compliance team relationships built
      over years. Adverse outcome: SafetyCulture may be perpetually limited to the frontline supplementary
      layer in large enterprise accounts rather than achieving EHS suite displacement.

      Microsoft 365 displacement risk: Microsoft Copilot for Microsoft 365 now includes AI-assisted form
      creation, workflow automation in Power Automate, and Teams integration for notifications — all delivered
      within an existing enterprise licensing cost that most SafetyCulture target customers already pay.
      While Microsoft cannot replace SafetyCulture's offline inspection capability or corrective action
      tracking today, the convergence risk is rising as Microsoft continues to invest in field worker tools.

      Verdantix 2025 Global Corporate Survey finding: 18% of organizations have wide deployment of lone
      worker devices and a further 27% are expanding usage — this shift toward wearables, sensors, and
      connected safety hardware creates a requirement for deeper IoT platform integration that goes beyond
      SafetyCulture's current sensor module capabilities, potentially favoring industrial EHS incumbents
      with richer operational technology (OT) integration histories.
