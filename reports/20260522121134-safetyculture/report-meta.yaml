companyProfile:
  summary: >
    SafetyCulture is a Sydney-based privately held technology company founded by Luke Anear in 2004.
    It provides a frontline operations platform — iAuditor and SafetyCulture app — enabling safety
    audits, inspections, training, sensor monitoring, and marketplace access for 85,000 businesses
    across manufacturing, construction, retail, and resources sectors. The company raised AU$165M
    (AU$75M primary + AU$90M secondary) at an AU$2.5B valuation in September 2024, a modest
    down-round from its AU$2.7B peak. Governance opacity, absence of audited consolidated financials,
    and leadership continuity questions limit public diligence depth.
  foundedDate: '2004-01-01'
  founders:
    - name: Luke Anear
      role: Founder and CEO
      background: Former insurance investigator who built iAuditor initially for safety documentation; sole founder; high key-person concentration.
      claimRefs: [CO001]
  foundingLocation: Townsville, Queensland, Australia
  headquarters: Surry Hills, Sydney, Australia
  productSummary: >
    SafetyCulture monetises through SaaS subscriptions to iAuditor/SafetyCulture platform covering
    inspections, issue management, training (EdApp), sensor monitoring (Beacon), and an in-app
    marketplace. Adjacent insurance and broader worker-safety verticals are under development.
  customerFocus: >
    Frontline-heavy industries including construction, manufacturing, retail, hospitality, mining,
    and resources. Customers range from SMBs to global enterprises; 85,000 businesses with more
    than 2 million active workers.
  businessModel: >
    Primarily subscription SaaS (per-seat and tiered pricing); supplemented by marketplace
    transaction revenue, Beacon hardware attach, and nascent insurance lines.
  stage: late-stage private
  fundingStatus: >
    Privately held; latest round was AU$165M in September 2024 at AU$2.5B post-money valuation,
    comprising AU$75M primary and AU$90M secondary components. Total capital raised approximately
    USD 298M across multiple rounds since 2013.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO021, CO024, CO029, CO034, CO035]
summary:
  headline: >
    SafetyCulture is a credible frontline-operations category leader with real scale, but the
    AU$2.5B headline price implies a 15-21x ARR multiple that outruns peers and the disclosure package.
