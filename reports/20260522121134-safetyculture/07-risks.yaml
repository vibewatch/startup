        - Confirm key-man insurance amount; request board-level succession plan; assess depth of executive
          team (CTO, CFO, COO) to execute without Anear
      - - 2026 restructuring — workforce reduction (20% per InterviewPal; no official confirmation);
          Israel R&D center closed; cuts in US, India, and UK reported
        - Engineering capacity reduced at same time AI rebuild is announced; talent loss creates knowledge
          gaps and morale risk; uncertainty heightens voluntary attrition
        - Confirmed in principle — restructuring reported by multiple sources; exact scale unconfirmed
        - High — engineering headcount reduction directly constrains AI rebuild delivery timeline
        - Cost reduction aims to extend runway; restructuring framed as reorientation toward AI
        - Obtain official restructuring announcement and affected function breakdown; confirm engineering
          headcount before and after reduction; assess Israel R&D center IP disposition
      - - CFO and commercial leadership continuity — Edelita Tichepco (CFO), Hamish Grant (COO),
          Phil Goldie (Global Head of Sales) listed on official team page as of May 2026
        - Secondary leadership layer stability unconfirmed during restructuring and CEO transition
        - Low-Medium — no confirmed departures but restructuring creates retention risk
        - High — loss of CFO or COO during AI rebuild would compound execution risk substantially
        - No evidence of commercial leadership departures as of run date
        - Confirm current commercial leadership retention; assess equity incentive structures and
          vesting schedules; understand any changes associated with restructuring
      - - Talent competition and engineering retention — SafetyCulture competes for engineers in Sydney,
          Manchester, and Kansas City against well-funded tech companies; AI rebuild requires ML expertise
        - Restructuring-driven uncertainty creates voluntary departure risk among senior engineers;
          closure of Israel center loses proximity to a high-quality tech talent cluster
        - Medium — tech talent market competitive; post-RIF morale risk well-documented in comparable cases
        - High — AI rebuild timeline directly dependent on engineering team stability and capability
        - Company culture and mission are retention anchors; SafetyCulture's scale and product challenges
          are genuine engineering draws
        - Assess Glassdoor and LinkedIn velocity of engineering departures; confirm retention packages
          for key ML/data science staff; understand Twine team integration and retention agreements
    claimRefs:
