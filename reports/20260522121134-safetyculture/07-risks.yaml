  - id: TR005
    title: Mitigation and kill criteria table
    layout: default
    notes: >-
      Kill criteria thresholds are assessor-defined based on analysis of SafetyCulture's disclosed strategic
      commitments, valuation structure, regulatory timeline, and comparable SaaS restructuring precedents.
      These are investment monitoring triggers, not contractual provisions.
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - CEO succession and key-person
        - Permanent CEO appointment or Anear departure announcement
        - Interim CEO period exceeds 12 months; or permanent CEO hired from outside without founder-level
          product literacy; or Anear departure announcement with no succession in place
        - Re-assess thesis; interim beyond 12 months without credible successor is a thesis-break signal
      - - Valuation and down-round overhang
        - Next primary equity round pricing
        - New round priced below AU$2.0 billion; or company pursues distressed M&A sale below AU$1.5 billion
        - Thesis break — growth re-acceleration has not occurred; existing investors face mark-to-market losses
      - - AI platform rebuild execution
        - GA release of agentic AI features from Twine acquisition
        - No material AI feature GA within 18 months of acquisition (by October 2027); or enterprise
          customer churn accelerates post-rebuild launch due to regression
        - Thesis break — AI rebuild is the primary strategic rationale; failure signals inability to compete
      - - Australian Privacy Act compliance
        - OAIC enforcement action or privacy tort class action filed against SafetyCulture
        - Any OAIC investigation notice, enforceable undertaking, or class action complaint; or Children's
          Online Privacy Code non-compliance finding by December 2026
        - Immediate legal risk materialisation; assess whether AU$50M penalty exposure is insured
      - - AWS cloud dependency and operational resilience
        - Customer-reported or media-reported SafetyCulture platform outage exceeding 4 hours
        - Two or more outages exceeding 4 hours within 12 months; or any outage correlated with a customer
          safety incident under regulatory investigation
        - Escalate to SLA and infrastructure diligence; demand multi-region architecture confirmation
      - - Restructuring and engineering capacity
        - Engineering headcount versus AI rebuild roadmap milestone delivery
        - Official headcount disclosure shows engineering below 200 FTEs; or AI rebuild milestone slips
          more than 6 months from roadmap; or further R&D center closures announced
        - Thesis stress — insufficient engineering capacity to execute AI rebuild within competitive window
      - - Financial model opacity and burn
        - Primary equity round closure or audited financial disclosure
        - No new primary equity by December 2027; or revenue growth below 20% YoY in any disclosed period;
          or gross margin disclosed below 60%
        - Thesis-break risk — cash runway concern; forces IPO, distressed round, or acquisition
      - - Competitive displacement in enterprise EHS
        - SafetyCulture win and loss rate in competitive enterprise EHS deals
        - Loss rate against Intelex, Cority, or VelocityEHS exceeds 40% in independently verifiable data;
          or named enterprise defection to competitor announced
        - Re-assess enterprise expansion thesis; evaluate whether AI rebuild closes GRC capability gap
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044

