  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      SafetyCulture's buyer-user-payer structure varies significantly by industry vertical and organizational
      size. In almost all verticals, the primary buyer (decision-maker who signs the contract) is a safety,
      operations, or compliance professional rather than a frontline worker. The end user is the frontline worker
      themselves. The budget authority is typically the head of safety, COO, or VP of Operations. In SMB
      organizations, these three roles collapse into one or two people, lowering the sales cycle complexity but
      also compressing the average contract value.

      In construction, buyers are HSE Managers or site operations directors who control OpEx safety budgets
      reported to range from $50,000 to $250,000+ annually for digitization platforms. The adoption trigger is
      most often a regulatory compliance event, a Lost Time Injury incident, or a failed external audit. Workers
      — site workers, supervisors, and subcontractors — are the end users.

      In manufacturing, EHS directors and plant managers are the primary buyers, often co-signing for larger
      enterprise agreements. Frontline users include production workers, maintenance technicians, and quality
      inspectors. Manufacturing EHS budgets are cited at $50,000–$300,000+ annually for enterprise customers,
      driven by OSHA enforcement, insurance cost reduction, and ESG/CSRD reporting obligations.

      In hospitality, operations managers and compliance leads at chains and franchises are the buyers. Workers
      such as housekeepers, kitchen staff, and front-desk staff are the end users. Budget ownership is split
      between franchise operators (SMB) and national headquarters (chain). The SafetyCulture Feedback from the
      Field survey found that hospitality workers report the highest rate of pressure to cut corners (44%),
      signaling both the need for and the deployment challenge of compliance tools in this sector.

      Aviation, utilities, and retail follow similar patterns: safety officers or quality managers make the
      purchasing decision, operational workers use the platform, and budgets sit with operations rather than IT.
      In the public sector — where SafetyCulture already serves NHS, National Grid, and Transport for London —
      procurement cycles are longer and budget authority more distributed, but enterprise adoption demonstrates
      the sector is reachable. Adoption triggers across all verticals consistently tie to regulatory compliance
      requirements, incident-reduction mandates, or audit readiness.
