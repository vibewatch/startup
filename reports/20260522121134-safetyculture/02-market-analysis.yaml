sections:
  - id: market-boundary
    title: Market Boundary and Scope
    body: >-
      SafetyCulture's addressable market is defined by the intersection of four overlapping software categories:
      environmental health and safety (EHS) and compliance software, digital inspection and audit management,
      frontline worker training and learning management, and connected-worker or asset/IoT sensor monitoring.
      SafetyCulture is not a pure EHS suite, a pure LMS, or a pure IoT platform — it is a multi-module frontline
      operations platform that competes across all four categories depending on the customer context. Correct
      market boundary mapping therefore requires drawing lines across multiple adjacent category definitions rather
      than slotting the company into a single analyst market report.

      The primary included spend covers: (1) software tools that digitize inspection forms, checklists, audits,
      and safety observations at the point of work; (2) compliance and EHS management platforms that track
      incidents, corrective actions, risk assessments, and regulatory reporting; (3) micro-learning and mobile
      training platforms targeted at frontline workers rather than office-based staff; and (4) connected-worker
      and IoT sensor platforms that link physical assets, environments, and workers to a shared operational data
      layer. Each category has a distinct analyst market report, meaning SafetyCulture's TAM is legitimately
      multi-report and any single-analyst estimate will understate the opportunity.

      Excluded from the primary boundary are general-purpose human resources management systems and payroll
      software, desktop-focused enterprise GRC suites sold to legal and compliance departments without a field
      component, and general-purpose project management tools such as Asana or Jira that lack a workplace safety
      or compliance workflow. Industrial automation hardware (SCADA, DCS, PLCs) and pure personal protective
      equipment are capital items rather than software subscriptions and are also excluded.

      Status-quo substitutes — which drive the conversion challenge as much as direct competitor products — include
      paper forms and clipboards, Microsoft Excel and SharePoint-based checklists, generic email-based audit
      trails, and incumbent on-premises ERP safety modules (SAP EHS, Oracle EHS). SafetyCulture explicitly
      positions its platform as the replacement for these tools. The 2024 Feedback from the Field survey of over
      3,000 managers in Australia, the US, and the UK found that 62% of frontline workers report dissatisfaction
      with current IT tools, and 71% expressed preference for a consolidated platform over separate apps — a
      direct statement of unmet demand aligned with SafetyCulture's bundled product strategy.
