        - L&D managers, safety trainers, franchise ops teams
        - SC Training (EdApp) module — acquired 2020; directly addresses this segment
      - - Connected Worker & IoT Sensor Monitoring
        - Environmental sensors, wearable alerts, asset condition monitoring, real-time dashboards
        - Pure industrial automation (SCADA/DCS/PLC), non-safety IoT infrastructure
        - Operations managers, maintenance directors, facilities managers
        - SafetyCulture Sensors module — newer product; adjacency to core safety workflow
      - - Workplace Operations Management (adjacency)
        - Task management, issue escalation, communications, shift briefings, continuous improvement
        - General project management (Asana, Jira), HR/payroll systems
        - COO, operations leads, site managers
        - Emerging expansion area — SafetyCulture platform positions itself as the operating system for frontline teams
      - - Status-quo Substitutes (conversion target)
        - Spreadsheet/paper-form safety programs, SharePoint checklists, legacy on-prem ERP safety modules
        - Incumbent SaaS EHS suites (Intelex, Cority) — those are direct competitors, not substitutes
        - Any safety-responsible role that has not yet digitized
        - Primary conversion opportunity — SafetyCulture explicitly targets paper-and-spreadsheet workflows
