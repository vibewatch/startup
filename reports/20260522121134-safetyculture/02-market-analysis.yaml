  - id: market-sizing
    title: Market Sizing — Multiple Lenses, Preserved Uncertainty
    body: >-
      SafetyCulture's total addressable market cannot be assigned a single credible dollar figure from public
      sources. Analyst reports define the relevant market differently, producing 2026 estimates that range from
      $2.48 billion (Mordor Intelligence, narrow EHS software-only) to $8.9 billion (The Business Research Company,
      widest EHS software scope) for the EHS compliance component alone. The connected-worker and IoT adjacency
      adds a further ~$10.9 billion in 2026 per Mordor Intelligence, with a CAGR of 12–25% through 2030. The
      frontline worker platform market, most directly comparable to SafetyCulture's multi-module positioning, is
      estimated at $6.8 billion in 2025 by DataIntelo and Growth Market Reports, growing at 12.4–18% CAGR through
      2033. The inspection management software layer is estimated at $8.66 billion in 2026 by MarketsandMarkets
      with 11.5–12.3% CAGR. Frontline worker training (served by SafetyCulture's SC Training/EdApp module)
      is estimated at $2.86 billion in 2026 per ResearchAndMarkets. The broadest framing — frontline worker
      enablement including all adjacencies — yields $36.68 billion in 2026 per Fortune Business Insights, though
      this aggregate extends well beyond SafetyCulture's current product scope.

      These disagreements reflect genuine methodological heterogeneity, not analyst error. The primary driver of
      variance is boundary choice: software-only versus software-plus-services, narrow safety management versus
      broad operational compliance, and global versus regional scope. No single estimate should be adopted as a
      reliable TAM without independently verifying the analyst's category definition against SafetyCulture's
      actual product perimeter and revenue composition. This creates a diligence obligation to triangulate rather
      than select.

      A SafetyCulture-specific SAM derived from published data is not achievable without assumptions about
      geographic mix, product attach rate, and per-seat pricing that are not in the public record. An illustrative
      SAM of approximately $10–15 billion emerges by combining EHS software ($8.9B), inspection management
      ($8.7B), and frontline training ($2.9B) adjusted for category overlap; however, this overlap cannot be
      quantified rigorously from external data and must be treated as illustrative. A SOM implied by the company's
      85,000 current customers at an undisclosed average contract value would not constitute an independent
      estimate. EHS software CAGR forecasts across analysts range from 7.4% (CMI) to 14.6% (Business Research
      Insights), with market definitions again driving the spread.
