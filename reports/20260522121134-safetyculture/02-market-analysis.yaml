  - id: geographic-dimensions
    title: Geographic Dimensions and Evidence Gaps
    body: >-
      SafetyCulture's APAC home market is a meaningful structural tailwind. The APAC workplace safety market is
      forecast to reach $5.8 billion in 2026, growing at ~10.4% CAGR through 2035 per MarkWide Research. The
      APAC regulatory environment in 2026 is characterized by speed, diversity, and increasing enforcement
      intensity: China's SAMR is coordinating GB standard updates, India's OSHWC Code is in phase-in, and
      evolving AI regulations across Singapore, Australia, and South Korea affect EHS software data governance.
      Enhesa's 2026 APAC EHS trends analysis concludes that the region is transitioning from fragmented voluntary
      compliance toward structured binding enforcement, benefiting vendors — like SafetyCulture — that offer
      scalable, cloud-native compliance infrastructure.

      North America remains the largest global market for connected worker spend, with Mordor Intelligence
      attributing ~36–40% of connected worker market revenue to the region. OSHA enforcement activity and ESG
      reporting mandates from US-listed companies are driving enterprise EHS software replacement cycles even
      for non-US operations. SafetyCulture's Kansas City office serves this market, and named enterprise customers
      such as British Airways and National Grid also hold significant North American operations.

      In Europe, the Corporate Sustainability Reporting Directive (CSRD) and EU EHS directives create structural
      compliance demand. SafetyCulture's Manchester EMEA hub serves over 25,000 of its 85,000 business customers,
      making Europe and the UK a material revenue geography. The EU AI Act introduces a data governance obligation
      for AI-driven risk classification tools used in EHS platforms, adding a European-specific product
      development requirement.

      Critical sizing gaps persist. The high variance across analyst EHS market estimates ($2.5B–$8.9B for 2026)
      renders any SAM derivation unreliable without primary research into analyst methodology. SafetyCulture's
      own TAM framing — 2.7 billion deskless workers — is a user-count ceiling rather than a dollar-market
      estimate and cannot be reconciled with analyst revenue figures without knowing average revenue per user
      or per organization, which the company has not disclosed. No independent estimate of SafetyCulture's
      specific market share or addressable portion within any of the defined segments exists in the public record.
