  evidenceGaps:
    - id: GM001
      gapType: private-evidence-only
      type: private-evidence-only
      severity: material
      topic: SafetyCulture-SAM-derivation
      description: >-
        SafetyCulture has not published its own SAM, SOM, or market sizing methodology. The company's
        only public market framing is the 2.7 billion deskless worker count, which cannot be converted
        to a dollar TAM without knowing average revenue per user or per organization — neither of which
        is publicly disclosed. Any investor-facing TAM figure requires primary research or management
