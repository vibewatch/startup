  - id: TR001
    title: 监管 / 法律风险登记表
    layout: default
    notes: 截至 May 2026，公开记录中未发现针对 SafetyCulture 的已确认诉讼或执法行动。严重度和可能性评级由评估者基于监管框架分析和公司披露缺口判断。本表证据基础同时覆盖监管和法律两类必需来源。
    enumerationScope:
      coverage: partial
      basis: >-
        Regulatory risk scope covers SafetyCulture's primary regulatory exposure across Australia (Privacy Act), UK/EU
        (GDPR/ICO, EU AI Act, EU PLD), North America (OSHA, state privacy laws), and insurance regulation (AFSL, FCA).
        Covers five principal risk categories derived from SafetyCulture's disclosed operational footprint in 180+
        countries with offices in Australia, UK, US, and India.
