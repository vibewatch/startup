  - id: TP004
    title: 护城河耐久性与竞争风险清单
    layout: wide
    notes: 严重性评级（高 / 中 / 低）基于证据判断，不是量化评分。尽调问题仍是开放问题，应在主要投资人访谈中尝试回答。
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓释措施 / 尽调问题
    rows:
      - - 模板库和工作流重建切换成本
        - GoAudits / Lumiform 提供迁移工具和模板导入；低成本迁移降低重建阻力
        - 中
        - Capterra 评论指出，重建模板有扰动但可完成；竞争对手也在营销迁移支持
        - 核实客户平均模板库规模；确认竞争对手是否已有自动导入工具
      - - 历史数据锁定效应
        - SafetyCulture 支持 CSV 数据导出；未确认存在自有二进制格式
        - 中
        - 文档已确认数据可迁移功能；这不是合同层面的锁定机制
        - 确认分析 / 仪表盘配置能否导出，还是必须重建
      - - 嵌入式 API 集成
        - 竞争对手也提供 SAP/Salesforce/Power BI 连接器；集成能力趋同
        - 中
        - 截至 2026 年，Lumiform、GoAudits、Intelex 均提供可比的集成连接器
        - 量化拥有 >3 个活跃集成的企业客户占比，以估算真实集成黏性
      - - 移动优先 UX 与一线采用
        - Cority、VelocityEHS、Intelex 持续投入移动优先更新；差距在收窄
        - 低–中
        - 截至 2026 年，评测网站证据仍显示 SafetyCulture 易用性评分更高；但改善趋势已经出现
        - 比较新客户与 12 个月后客户的用户采用评分；再与同业数据对比
      - - 免费增值漏斗与 PLG 获客模式
        - PLG 模式带来大规模 SMB 客户群，但未必能高效转化为高价值企业账户
        - 中
        - 未公开披露免费转付费转化率，或 SMB 与企业收入结构
        - 向管理层索取按方案层级和客户队列拆分的收入
      - - 平台广度（培训 + 传感器 + 资产）
        - 买方可能偏好最佳单点工具（专业 LMS、专业 CMMS、专业 EHS），而不是单一平台
        - 中–高
        - 行业一边走向平台整合（Verdantix 2025），一边也走向专业 AI 工具
        - 调研现有客户是否使用全部模块，还是主要只做检查
      - - EHS 既有厂商企业端根基
        - Cority/Intelex 客户关系积累 10+ 年；多年期合同；合规模块更深
        - 高
        - 各有 1,400–1,500 家企业客户；SafetyCulture 缺少流程安全和职业健康
        - 识别多少 SafetyCulture 企业客户也使用 Cority/Intelex；明确用例如何分工
      - - Microsoft 365 AI 表单智能
        - Copilot for Forms + Power Automate 抬高功能上限；M365 买方边际成本为零
        - 高
        - Microsoft 365 Copilot 在 2024–2026 路线图中宣布 AI 表单生成功能
        - 重点跟踪 Microsoft Forms 路线图是否补上离线能力和纠正措施功能
