  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的竞争格局是多维的，因为其平台同时横跨四个产品类别：巡检和审计管理、EHS 合规、一线员工培训，以及
              IoT/联网员工监控。没有单一竞争对手复制了这套完整技术栈。因此，竞争压力会根据用例和买方细分，从不同方向进入。

              这个格局可以按可替代性和交易重叠风险，划分为四类竞争者。第一类是直接巡检软件同业——提供移动优先的巡检、清单和纠正措施工具，瞄准同一类 SMB 到中端市场买方。主要玩家包括
              GoAudits、Lumiform、Fluix、Operandio 和 Donesafe（HSI 旗下）。它们争夺同一预算科目，通常每用户成本更低，构成 SMB 和中端市场交易中最常见的正面对位替代风险。第二类是
              EHS 套件既有厂商——面向企业的平台，具备深度合规、职业健康、环境报告和过程安全模块。主要玩家包括 Intelex（Industrial Scientific）、Cority（Thoma
              Bravo）、VelocityEHS、Enablon（Wolters Kluwer）和 Benchmark Gensuite。这些厂商很少在 SMB
              账户中竞争，但凭借深度集成、监管深度和多年合同，锁住大型企业关系。SafetyCulture 在这一类别边缘竞争——通常在一线层替代或补充既有 EHS 套件。第三类是相邻与替代工具——Microsoft
              365（Forms、Teams、SharePoint、Power Automate）、Google Workspace（Forms、Sheets）、ServiceNow、Jira/Atlassian、独立 LMS
              平台（TalentLMS、Cornerstone），以及 CMMS/资产管理工具（MaintainX、UpKeep）。这些厂商掌握庞大装机关系，并可在现有平台合同内覆盖巡检或培训工作流，从而削弱
              SafetyCulture 买方紧迫性。第四类是现状和内部自建——纸质表格、Excel/SharePoint 清单、电子邮件审计追踪，以及内部运行的 SAP 或 Oracle EHS
              模块。SafetyCulture 明确瞄准从这些工具转化，它们也是未数字化工作流中最大的可服务池。

              截至 2026 年，没有单一竞争者能在移动优先、低摩擦部署模式下，提供 SafetyCulture 的完整宽度（巡检 + 培训 + 传感器 + 资产管理 + 市场 +
              保险）。平台宽度创造交叉销售机会，也带来单点最佳产品风险：需要深度 EHS 合规功能的买方，会发现 SafetyCulture 相比 Cority 或 Enablon 不够专业；只需要轻量巡检的买方，则可能认为
              GoAudits 或 Lumiform 更便宜且同样够用。
