      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture
              的买方、用户和付款方结构，会随行业垂直和组织规模大幅变化。几乎所有垂直领域中，主要买方（签合同的决策者）是安全、运营或合规专业人士，而不是一线员工。最终用户是一线员工本人。预算权通常在安全负责人、COO
              或运营副总裁手里。在 SMB 组织中，这三个角色会压缩到一两个人身上，降低销售周期复杂度，但也压低平均合同价值。

              在建筑行业，买方是 HSE 经理或现场运营负责人，控制 OpEx 安全预算；据报道，用于数字化平台的年度预算在 $50,000 到 $250,000+
              之间。采用触发点通常是监管合规事件、损失工时伤害事故，或外部审计失败。现场工人、主管和分包商是最终用户。

              在制造业，EHS 负责人和工厂经理是主要买方，大型企业协议通常需要共同签署。一线用户包括生产工人、维护技师和质量检查员。制造业 EHS 预算据称在企业客户中每年为 $50,000–$300,000+，由 OSHA
              执法、保险成本降低以及 ESG/CSRD 报告义务驱动。

              在酒店行业，连锁和加盟体系的运营经理与合规负责人是买方。客房服务、厨房和前台员工等人员是最终用户。预算归属在加盟运营商（SMB）和全国总部（连锁）之间分摊。SafetyCulture Feedback from
              the Field 调查发现，酒店员工报告的偷工减料压力比例最高（44%），显示该行业既需要合规工具，也存在部署挑战。

              航空、公用事业和零售遵循类似模式：安全官或质量经理作出采购决策，运营员工使用平台，预算落在运营而非 IT 部门。公共部门中，SafetyCulture 已服务 NHS、National Grid 和
              Transport for London；采购周期更长，预算权更分散，但企业级采用证明该部门可以触达。所有垂直领域的采用触发点，都持续与监管合规要求、降低事故指标或审计准备度相关。
