      - number: '6.5'
        title: 扩张动作、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的扩张动作在案例研究基础中证据充分，符合经典“先落地、再扩张”模式。初始部署通常从单一场景开始——几乎都是检查 / iAuditor——再横向扩展到
              Issues/Actions、Heads Up、Training、Asset Management、Sensors、Analytics 和 Marketplace。DB Schenker 2017
              年从审计和事故报告起步，之后加入 Heads Up 通信作为新场景。William Hare 在多年使用检查之后，在油漆车间和焊接仓库加入 Sensors。SSP 从开店 /
              闭店清单和事故报告起步，再扩展到完整食品安全审计和资产管理。Tennis Australia 在 Australian Open 六个运营领域使用检查、培训、Heads Up、资产管理和入职流程。

              平台的跨模块工作流在结构上支撑客户内扩张：检查发现会自动路由到
              Issue/Action；问题可以生成培训任务；传感器读数触发检查工作流；已完成资产进入检查排期；分析功能汇总全部信号。这种集成同时提高切换成本和扩张表面积。

              收入扩张风险集中在两处。第一，SMB 账户是留存最弱的队列，按用户计价模式在团队扩张时制造摩擦。第二，SC Training 退役扰动了 70,000+
              组织——可能带来未记录的客户标识流失，规模未知。已披露客户基础中的企业集中度看起来较低；没有单一具名客户被称为贡献重大收入份额。UK 代表显著地域集中（85,000 家企业中有
              25,000+），但没有明确的区域收入拆分。

              渠道主要是直销：SafetyCulture 通过企业直销（Phil Goldie 任 Global Head of Sales）以及面向 SMB 和中端市场的自助 / PLG
              销售。没有确认的大型渠道分销商或分销合作推动实质收入。Salesforce 集成在独立评论中被称为常用连接器，但这不意味着 Salesforce 是分销渠道。Marketplace（75,000+
              个商品、200+
              个品牌）围绕核心平台形成商业生态，但它是平台内交易层，不是获客渠道。缺少大型转售商渠道带来的采购风险中等：增长依赖持续的直销能力和自助转化，进入高度受监管或政府垂直行业时速度可能受限，因为这些行业的企业采购在结构上更依赖渠道关系。
