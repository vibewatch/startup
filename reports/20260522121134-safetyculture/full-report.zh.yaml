      - number: '7.4'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >
              人才与执行风险是 SafetyCulture 近期严重性最高的风险。CEO 接班进程已经变成实质负担。Kelly Vohs 被任命为 CEO，任命于 1 January 2025 生效，接替转任执行主席的
              Luke Anear。Vohs 约 15 个月后离任——Startup Daily 和多个行业来源截至 2026 年上半年至年中已确认——Anear 以临时 CEO 身份回归，在 Sydney 总部领导 AI
              平台重建。公司正在积极寻找永久 CEO。这是不到两年内第二次 CEO 过渡，在关键产品拐点期间给战略方向、投资者信心和高级商业团队稳定性带来不确定性。


              2026 重组计划进一步叠加风险。按可得报道（InterviewPal 裁员追踪器、Startup Daily），SafetyCulture 在 2026 批准裁员，包括关闭 Israel R&D 中心，并在
              US、India 和 UK 裁员。官方公告未确认精确人数影响，interviewpal.com 称裁员比例为 20%。集中削减 R&D——尤其关闭 Israel 中心——恰好发生在 SafetyCulture
              声称需要为 AI 时代“重大重建”软件的时候，会削弱工程能力。一边削减 R&D，一边宣布以 AI 为中心的战略转向，这种矛盾本身就是实质执行风险。


              对 Luke Anear 的关键人物依赖在结构上已经嵌入。Anear 是公司的公众面孔、知识产权源头和文化锚。2026 年每一项重大公告——从 Twine 收购到重组理由——都由 Anear
              的叙事框架包装。董事会构成和接班规划细节没有公开披露。如果 Anear 因个人或健康原因离开，或永久 CEO 人选破坏他与公司的关系，战略漂移、人才流失和投资者信心受损风险都很高。


              重组会放大更广泛的人才风险：核心工程、销售和客户成功人员可能在不确定期离开。SafetyCulture 在 Sydney、Manchester 和 Kansas City
              与资金充足的科技公司争夺工程人才。能否留住核心产品和数据科学团队，是按任何合理时间表交付 AI 重建的关键。
