      - number: '3.4'
        title: 相邻工具、替代品与现状方案
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的替代风险不只来自直接的巡检同业和 EHS 既有厂商，也来自买方已经持有的横向平台；这些平台可以延伸到巡检或培训流程，让客户不必再采购专门工具。

              Microsoft 365（Forms、Teams、SharePoint、Power Automate）是企业和中端市场账户里最重要的替代威胁。Microsoft Forms
              可以搭建类似巡检的清单，并把回复路由到 SharePoint / Excel；Power Automate 可以触发整改通知；Teams
              可以承担沟通层。买方已经为这个平台付费，这套组合足以覆盖简单、低合规要求的巡检场景。不过，Microsoft
              工具缺少移动端离线巡检、带条件逻辑的照片证据、专门的整改动作跟踪，也没有可经审计的合规记录。对于简单内部审核，替代方案够用；需要面对监管质询仍站得住脚的多站点合规流程则不够。到 2026 年，Microsoft
              收购 Nuance，并扩展 Azure AI Foundry，已经加速表单智能能力，把无需专门工具的 Microsoft 工作流可交付上限抬高了。

              Google Workspace（Forms、Sheets）对最低端买方构成替代风险——单站点运营团队，或尚未数字化的团队。Google Forms 免费、直观，并自动把数据写入 Sheets
              供分析。它支撑不了整改动作流程、与巡检发现绑定的照片证据采集、离线现场使用，也没有监管审计轨迹。竞争风险主要在于拦截 SafetyCulture 对纸质 / 电子表格低端客群的转化，而不是替代现有
              SafetyCulture 客户。

              ServiceNow 正被大型企业越来越多地部署为统一工作流和资产管理平台。它在事件管理、任务路由和升级处理上强于 SafetyCulture，尤其是在深度 IT 集成环境里。不过，ServiceNow
              的移动优先巡检能力有限，也不是面向一线员工的工具。已经使用 ServiceNow 的买方可能用它管理安全事件，而不是另采巡检平台，于是在企业层形成相邻替代压力。

              Jira（Atlassian）被运营团队用于问题跟踪、任务管理和项目工作流。它用于安全巡检的适配度有限——缺少清单模板、离线现场能力和合规专用模块。不过，已经使用 Jira 的软件、科技和物流公司，可能不愿为
              Jira 已经覆盖的任务和问题管理层再引入 SafetyCulture，从而给交叉销售扩张带来阻力。

              独立学习管理系统（LMS）——TalentLMS、Cornerstone OnDemand、Docebo——与 SafetyCulture 的 SC
              Training（EdApp）模块争夺一线培训预算。这些平台通常定位于桌面优先或更广义的企业学习，而不是现场微学习；但在培训由安全运营之外单独管理的组织里，它们是预算替代项。SafetyCulture
              的优势是培训与巡检流程紧密集成（例如审计发现触发后完成一个培训模块）；独立 LMS 不做定制集成就无法复制。

              CMMS 和资产管理工具（MaintainX 约 $20/user/month、UpKeep、Limble
              CMMS）覆盖维护驱动的巡检流程——工单、预防性维护检查、资产状态跟踪。它们在维护密集环境（制造、公用事业、设施管理）里，与 SafetyCulture 的资产管理模块和周期性巡检流程竞争。MaintainX
              因移动优先、简单易用评价不错，价格与 SafetyCulture Premium 相近。

              现状和内部自建仍是最大的转化机会，也是最难打的竞争对手。使用纸质清单、Word / Excel 模板或定制 SharePoint 库的组织，是 SafetyCulture
              的主要转化目标。这些组织面对的是另一种切换成本——不是从 SafetyCulture 换走，而是从零现金成本的既有方案切到付费订阅，因此必须看到明确 ROI，并投入变革管理。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP015
              - CP037
              - CP038
      - number: '3.5'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              纵观竞争格局，SafetyCulture 通过四点拉开差异：（1）免费增值漏斗先沉淀大装机基数，再推进变现，支撑产品驱动增长，并降低 SMB
              层的直销成本；（2）平台宽度，把巡检、培训、传感器和资产管理打包进一个订阅，竞争对手尚未复制；（3）模板库——SafetyCulture
              公共模板库提供数百个行业模板，降低买方上手阻力；（4）移动优先的离线能力，在一线员工采用度上被评为同类最佳。

              定价上，SafetyCulture 的 Free 计划（最多 10 名用户、5 个活跃模板）是有意义的漏斗机制。Premium 计划按年付为 $24/user/month，按月付为 $29/month，相对
              EHS 既有厂商有竞争力，但贵过 GoAudits Starter 的 $10/user/month。Enterprise 定价定制且未披露。SafetyCulture 还推出约 $5/user/month 的
              Lite 席位，面向访问权限有限的用户（培训和任务执行），降低大规模一线部署的总成本，因为并非每个员工都需要完整巡检编写权限。这种席位分层，是对按用户计价随规模放大而被抱怨的直接回应。

              GTM 上，SafetyCulture 主要靠免费层推动产品驱动增长，并用内勤销售承接中端市场扩张。EHS 既有厂商（Cority、Intelex、Enablon）依赖企业外勤销售、渠道合作伙伴和既有 ERP
              集成生态。GoAudits 和 Lumiform 走自助销售。SafetyCulture 的渠道优势在于自然入站和 SMB 转化；劣势在于触达大型企业账户，通常需要替代既有 EHS
              套件关系，或作为一线层与既有平台共存。SafetyCulture 的集成市场（Salesforce、SAP、Power BI、ServiceNow、Tableau）降低共存摩擦，并支持在企业内先落地再扩张。

              信任和合规姿态：SafetyCulture 拥有 ISO 27001 和 SOC 2 Type II 认证，并符合 GDPR。受监管行业（航空、制药、金融服务）的企业客户把这些认证视为入场门槛。EHS
              既有厂商（Cority、Intelex）拥有同等或更广的合规认证，包括面向美国政府客户的 FedRAMP 相关能力。SafetyCulture
              的信任姿态足以覆盖大多数中端市场和许多企业买方，但在美国联邦或高度监管的工业账户中，可能落后于 Cority 或 Intelex。
