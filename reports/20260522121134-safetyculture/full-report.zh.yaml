  - id: FU001
    title: SafetyCulture 客户旅程图
    type: journey-map
    approximationNotes: >-
      旅程阶段根据案例研究证据和评测平台数据推断。各阶段时长为定性估计；公开资料未披露经确认的平均销售周期数据。企业阶段基于 DB Schenker、William Hare、ArcelorMittal 的案例研究路径；SMB
      阶段基于评测平台用户描述和免费增值模型惯例。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU032
      - CU033
      - CU034
    data:
      items:
        - id: stage-awareness
          label: 认知
          actor: HSQE 经理 / 运营总监 / 安全经理
          description: 通过同行推荐、行业会议、直销触达或自主搜索数字化检查 / 清单软件，发现 SafetyCulture。SMB 和中型市场客户常通过自然搜索或浏览模板库发现产品；企业客户可能来自直销接触或合作伙伴推荐。
          channels:
            - 企业直销
            - 自然搜索（模板库）
            - 同行推荐 / 行业活动
            - 评测平台（G2、Capterra）
        - id: stage-trial
          label: 免费试用 / 试点
          actor: HSQE 经理和小型检查团队
          description: >-
            通过免费层级（3 名用户、3 次模板导出）或有限的企业试点评估。搭建首批自定义模板，完成初始检查，并评估 iOS/Android 移动应用可用性。自助设置很快（基础检查可当天启动）。企业客户可能与特定团队或站点跑
            30–90 天范围明确的试点。
          channels:
            - 自助注册免费层级
            - 销售协助的企业试点
        - id: stage-purchase
          label: 采购与初始部署
          actor: 运营总监 / 采购（企业）；HSQE 经理（SMB）
          description: >-
            转为 Premium 或 Enterprise 计划。初始部署覆盖单一用例（检查 / iAuditor）和明确用户群。模板库加快设置：100,000+
            个公共模板为行业清单提供起点。一线员工移动应用培训是主要上手任务。企业账户可能需要 IT 安全审查（ISO 27001、SOC 2）。
          channels:
            - 自助升级（SMB）
            - 企业直销 / 合同谈判
        - id: stage-expansion
          label: 扩张
          actor: HSQE 经理 + 更广泛运营团队
          description: >-
            首个用例证明价值后，客户逐步增加模块。案例研究确认了这一模式：检查 → 问题 / 行动 → Heads Up → 培训 → 资产管理 → 传感器。GROWMARK、DB Schenker、William Hare 和
            Tennis Australia 都展示了多个模块同时用于生产。客户年经常性收入（ARR）通过席位扩张和模块增加增长。Marketplace 和保险在平台工作流内创造更多商业触点。
          channels:
            - 产品内增购提示
            - 客户成功 / 客户经理
        - id: stage-mature
          label: 嵌入 / 续约
          actor: HSQE 团队 + 高管层（企业续约）
          description: >-
            平台成为安全、质量和合规的运营记录系统。切换成本高：检查模板、行动历史、培训完成记录、传感器配置和认证审计轨迹都已嵌入。长期账户（DB Schenker 8+ 年、William Hare 10+
            年）显示结构性粘性。企业续约为多年期；SMB 按年续约。负面事件（SC Training 退役、价格变化）会制造流失风险窗口。
          channels:
            - 年度 / 多年期企业续约
            - SMB 自助续约
