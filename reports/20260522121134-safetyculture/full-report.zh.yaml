      - number: '2.5'
        title: 地理维度与证据缺口
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的 APAC 本土市场是有意义的结构性顺风。MarkWide Research 预测，APAC 职场安全市场将在 2026 年达到 $5.8 billion，并在 2035 年前以
              ~10.4% CAGR 增长。2026 年 APAC 监管环境的特点是速度快、差异大、执法强度上升：China 的 SAMR 正协调 GB 标准更新，India 的 OSHWC Code
              正逐步导入，Singapore、Australia 和 South Korea 不断演进的 AI 监管也影响 EHS 软件数据治理。Enhesa 的 2026 APAC EHS
              趋势分析认为，该地区正从碎片化的自愿合规，转向结构化、具约束力的执法；这利好 SafetyCulture 这类提供可扩展、云原生合规基础设施的供应商。

              North America 仍是联网员工支出的全球最大市场；Mordor Intelligence 将联网员工市场收入约 ~36–40% 归因于该地区。OSHA 执法活动和美国上市公司的 ESG
              报告要求，正在推动企业替换 EHS 软件，即使是非美国业务也受影响。SafetyCulture 的 Kansas City 办公室服务该市场；British Airways 和 National Grid
              等点名企业客户也拥有重要 North American 业务。

              在 Europe，Corporate Sustainability Reporting Directive（CSRD）和 EU EHS 指令创造结构性合规需求。SafetyCulture 的 Manchester
              EMEA 枢纽服务其 85,000 家企业客户中的 25,000 多家，使 Europe 和 UK 成为重要收入地区。EU AI Act 对 EHS 平台中用于 AI
              驱动风险分类的工具提出数据治理义务，增加了欧洲特定的产品开发要求。

              关键规模测算缺口仍然存在。不同分析师对 EHS 市场的估计差异巨大（2026 年 $2.5B–$8.9B），若不对分析师方法论开展一手研究，任何 SAM 推导都不可靠。SafetyCulture 自身的 TAM
              表述——2.7 billion 名无桌面岗位员工——是用户数上限，而不是按金额计的市场规模估计；若不知道每用户或每组织平均收入，就无法与分析师收入数字对齐，而公司未披露这些数据。公开记录中不存在
              SafetyCulture 在任何已定义细分市场中具体市场份额或可服务部分的独立估计。
            claimRefs:
              - CM035
