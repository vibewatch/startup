      乐观情景 AU$2.4-3.0B 只有在确认 AU$200M+ ARR 且 AI
      收入得到证明时才可实现。基准情景（AU$1.28-1.6B）与可得可比数据一致。建议入场区间（AU$1.75-2.0B）位于基准可比公允价值和二级市场隐含价格之间，相对新股名义估值提供不对称保护。
