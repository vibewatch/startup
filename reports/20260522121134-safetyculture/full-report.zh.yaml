figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: SafetyCulture 这条 20 年路径，从车库里起步的安全工具，走到多产品平台独角兽；2024 年估值明显下调，CEO 交接仍未厘清，都是截至报告生成日的开放尽调问题。
    data:
      items:
        - date: '2004'
          label: iAuditor 创立
          detail: Luke Anear 在昆士兰远北的自家车库起步，把安全文档数字化。
          tone: positive
        - date: 2013-11
          label: 首笔机构资本
          detail: Blackbird、Cannon-Brookes、Farquhar 和 Bill Tai 投入 $1.2M 种子轮；公司还获得 $1.8M 联邦拨款。
          tone: positive
        - date: 2016-10
          label: Index Ventures 领投 Series B
          detail: Index Ventures 领投 $23M Series B；股权结构表上出现首家全球大型 VC。
          tone: positive
        - date: 2020-10
          label: 收购 EdApp 并晋级独角兽
          detail: SafetyCulture 以 ~$40M 估值收购 EdApp；Series C 融资跨过 $1.3B 独角兽门槛。
          tone: positive
        - date: 2021-05
          label: $76.5M Series C 轮，估值 $1.7B
          detail: Insight Partners 领投截至当时最大一轮融资；美国成长阶段投资人给出验证。
          tone: positive
        - date: 2023-08
          label: $22M 融资，估值峰值 $2.7B
          detail: Marbruck 领投的一轮融资把估值推到峰值；CEO 称公司已盈利，现金跑道无限。
          tone: positive
        - date: 2023-10
          label: SafetyCulture 平台发布
          detail: 首届 SafetyCulture Next 活动上线资产、传感器、市场和 AI 功能。
          tone: positive
        - date: 2024-09
          label: Series D 轮估值 $2.5B（低于 $2.7B）
          detail: AU$165M 融资；仅 AU$75M 为新股；AU$90M 为老股交易；AirTree 领投。
          tone: warning
        - date: 2024-11
          label: 宣布 CEO 交接
          detail: Kelly Vohs 被任命为 CEO，自 Jan 1, 2025 生效；Anear 转任执行董事长。2026 年材料仍未厘清。
          tone: warning
        - date: 2026-04
          label: 收购 Twine（智能体 AI）
          detail: Brian Swift 回归担任 VP AI；智能体优先的平台战略正式成型。
          tone: positive
