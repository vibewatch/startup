      - - 免费增值转付费
        - 85,000 家企业，但估计约 25,000 家付费；约 70% 处于免费或低消费层
        - 转化率改善则有显著上行；产品成熟后若转化停滞则有风险
        - 询问过去 3 年免费转付费转化率趋势和主要转化驱动（自助 vs. 销售辅助）
      - - SMB 流失集中
