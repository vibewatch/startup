      - number: '5.6'
        title: 证据附件
        blocks:
          - type: callout
            title: SC Training / EdApp 退役导致客户数据可移植性永久失败
            body: >-
              SafetyCulture 在 31 March 2026 退役 SC Training 平台（原 EdApp），并在 20 April 2026 之后删除数据。估计 70,000+ 组织和 1M+
              用户受影响。若没有付费升级路径，完成记录和学习进度数据无法完整迁移。未采取行动的用户永久失去历史培训记录。这不是小的迁移摩擦——在受监管行业（医疗、食品制造、建筑安全），培训完成记录本身就是合规文档，数据丢失代表潜在监管和法律暴露。任何投资者或企业买方都应要求
              SafetyCulture 按 SC Training 队列拆分客户留存数据，以评估该事件带来的流失和声誉影响。
            calloutType: risk
            claimRefs:
              - CE003
              - CE039
          - type: callout
            title: 截至 May 2026，智能体 AI 是战略方向，不是已上线产品
            body: >-
              SafetyCulture 的“智能体优先”定位是 CEO 层面的愿景，并由 April 2026 Twine 收购新闻稿确认。可验证、已上线的 AI 功能仅限于从文档生成模板、AI 辅助课程创建，以及 NLQ
              式分析查询。对于把 AI 作为采购标准的买方，“AI 驱动”和“智能体”营销叙事与当前已上线能力之间的落差具有实质性。收购 Twine 团队增加了 AI 人才（Brian Swift，VP
              AI），但没有带来即时产品能力。尽调应包括当前 AI 功能的产品演示，并要求公司就智能体能力路线图作出书面承诺，覆盖时间表和验证标准。
            calloutType: risk
            claimRefs:
              - CE005
              - CE042
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的客户基础在结构上高度多元，横跨买方类型（运营 / 安全经理是买方；一线员工是主要用户；企业是付款方）、地域、垂直行业、组织规模和使用场景。公司在 September 2024
              Series D 公告中披露，已有 85,000 家企业、接近 2 million 名用户，覆盖 180+ 个国家；仅 UK 就有 25,000+ 家企业。EMEA 团队总部在
              Manchester，北美运营基地在 Kansas City，公司本土市场是 Australia。公司未披露国家层面的精确拆分，但地域重心是 Australia、UK 和 United States。

              按垂直行业看，证据基础确认了生产级部署：建筑（Level 10 Construction、William Hare、ArcelorMittal Construction、Thermosash
              Group）、制造与钢铁（ArcelorMittal、William Hare、Schindler elevators）、物流与运输（DB Schenker、Transport for London）、机场 /
              航空（London City Airport、澳大利亚机场的 SSP）、酒店与餐饮服务（FISHBOWL、SSP、Australian Open 场馆）、农业 /
              农业零售（GROWMARK）、大型赛事（Tennis Australia / Australian Open 自 2021 起），以及公共部门 / 医疗（NHS、US Department of Veterans
              Affairs）。没有详细部署证据的客户标识包括 UK 的 British Airways 和 National Grid。

              按规模看，SafetyCulture 的模式覆盖面很宽：免费 / starter 层吸引 SMB 和个人检查员，Premium 和 Enterprise
              层服务大型多地点组织。最详尽的案例研究（ArcelorMittal、DB Schenker、William Hare、GROWMARK）都体现了企业级部署：数百到数千名员工，10+ 个 SafetyCulture
              模块同时在生产环境使用。分析师评论明确提出的 SMB 流失担忧说明，价格敏感度更高的 SMB 群体在结构上弱于企业队列。

              典型主要买方是 Health, Safety, Quality, and Environment（HSQE）经理、National Safety Manager 或 Operations
              Director。主要用户是一线员工，他们在移动端完成检查、上报问题、接受培训。付款方是组织本身。企业客户中，中央采购会涉及 IT
              或法务审查，但产品具备自助试用能力，部门采用往往先于正式企业采购——这是典型“先落地、再扩张”动作。
