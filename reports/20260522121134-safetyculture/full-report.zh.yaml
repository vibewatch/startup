  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: SafetyCulture 将 85,000 个企业账户的平台参与度，通过三套机制转为收入：订阅费（主）、市场佣金（次）、保险抽成率（新兴）。桥图展示从获客到毛利的变现路径，免费增值层既带来规模，也是转化成本中心。
    data:
      nodes:
        - id: user-acquisition
          label: 2M+ 平台用户；85,000 个账户
          detail: 公司披露口径，截至 Sep 2024。包含免费、Lite 和付费席位持有人。
          tone: positive
        - id: free-tier
          label: 免费层（≤10 个用户，$0）
          detail: 收入为零；推动获客和后续转化。最多 5 个模板，基础分析。
          tone: neutral
        - id: premium-subscription
          label: 付费 SaaS（$5 Lite / $24 Full，每用户 / 月）
          detail: 主收入流。按年计费。企业版定制定价。ARR 估计 $90–132M。
          tone: positive
        - id: marketplace
          label: 市场采购（GMV 抽成率）
          detail: 75,000+ 个产品；美国和澳大利亚。GMV 和抽成率未披露。毛利率低于 SaaS。
          tone: neutral
        - id: insurance
          label: 嵌入式保险（佣金 / 抽成率）
          detail: QBE/Allianz 承保。基于 5PB 检查数据做风险画像。规模和利润率未披露。
          tone: neutral
        - id: gross-profit
          label: 毛利（毛利率未披露）
          detail: 混合 SaaS ~70–80%；市场 ~10–30%；保险潜在较高但规模小。收入组合未知。
          tone: warning
      edges:
        - from: user-acquisition
          to: free-tier
        - from: user-acquisition
          to: premium-subscription
        - from: user-acquisition
          to: marketplace
        - from: user-acquisition
          to: insurance
        - from: premium-subscription
          to: gross-profit
        - from: marketplace
          to: gross-profit
        - from: insurance
          to: gross-profit
    approximationNotes: 各收入流规模基于估计；SaaS、市场和保险收入之间没有公开可得的审计拆分。毛利率区间是基准，不是公司披露。免费层节点代表主导获客渠道，但平台容量被零收入使用。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI007
      - CI021
      - CI031
      - CI032
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: standard
    summary: SafetyCulture 的单位经济链条可从公开数据部分观察（标价、账户数、员工成本代理），但所有关键指标——毛利率、CAC、LTV、NRR、流失率——均未披露。输入为空的节点被标为尽调缺口，需要数据室访问。
    data:
      nodes:
        - id: list-arpu
          label: 标价 ARPU 上限 ~$6,768/账户/年
          detail: 23.5 平均用户 × $24 × 12。假设所有席位均为 Full Premium 年付的理论最大值。
          tone: neutral
        - id: realized-arpu
          label: 实现 ARPU ~$1,062–1,553/账户/年
          detail: 由 $90.3M–$132M ARR 估计 ÷ 85,000 个账户推导。受免费增值和 Lite 席位压低。
          tone: warning
        - id: gross-margin
          label: 毛利率 — 未披露
          detail: SaaS / 市场 / 保险混合毛利率未发布。估计区间 60–75%。
          tone: warning
        - id: cac
          label: CAC — 未披露
          detail: 获客成本未发布。B2B SaaS 基准：每 $1 新增 ARR 需 $2-3。
          tone: warning
        - id: payback
          label: 回本周期 — 估计 2.7–4 年
          detail: 由 CAC 基准和实现 ARPU 估计推导。偏高；若企业客户占比提高，可被缓解。
          tone: warning
        - id: nrr
          label: NRR — 未披露
          detail: 多模块平台在结构上支持 NRR >100%；未发布数字。
          tone: warning
        - id: unit-econ-verdict
          label: 单位经济性结论 — 公开数据不足
          detail: 没有毛利率、CAC、LTV 和 NRR 披露，无法确认单位经济性是否创造价值。
          tone: adverse
      edges:
        - from: list-arpu
          to: realized-arpu
        - from: realized-arpu
          to: gross-margin
        - from: gross-margin
          to: cac
        - from: cac
          to: payback
        - from: gross-margin
          to: nrr
        - from: payback
          to: unit-econ-verdict
        - from: nrr
          to: unit-econ-verdict
    approximationNotes: >-
      所有桥图数字均来自未经验证的估计、基准或结构性推断。没有任何节点反映经审计或公司披露的单位经济性数字。标为未披露的节点需要数据室访问后填充。实现 ARPU 是高度异质账户基础上的平均值；企业账户 ARPU 可能高得多，SMB
      和免费账户则稀释平均值。
    claimRefs:
      - CI008
      - CI019
      - CI020
      - CI021
      - CI023
      - CI024
