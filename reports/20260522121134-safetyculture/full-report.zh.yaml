      - number: '3.7'
        title: 反向竞争证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              几类反向证据对 SafetyCulture 的竞争地位构成实质风险，必须作为尽调义务保留。

              来自低端的价格替代：GoAudits Starter 计划为 $10/user/month，比 SafetyCulture Premium 的 $24/user/month（按年）便宜 58%，比 $29
              的月付费率便宜 66%。GoAudits 的用户评分为 4.8/5，略高于 SafetyCulture 的 4.6/5。对于只需要巡检和整改动作流程、不需要培训或传感器的价格敏感买方，GoAudits
              是足够可用且更便宜的替代方案。这对 SafetyCulture 的 SMB 合同价值形成明确的向下定价压力；任何涨价都会加速这一层级的竞争替代。

              SafetyCulture 特定产品投诉（来自 2026 年 Capterra 和 Software Advice
              评论验证）：（a）多步骤审批工作流有限——平台支持单向审批，无法支撑受监管组织需要的复杂多阶段签核链；（b）按用户计价在大规模一线部署中会变贵，因为多数员工只是偶尔使用者，而不是高频巡检员；（c）报告定制有限——高度定制的版式需要绕行方案，或接入
              Power BI / Tableau 等第三方工具；（d）模板修改需要从头重建，而不是对已发布模板做增量编辑。

              EHS 既有厂商的企业护城河：Cority 拥有 1,500+ 企业客户，Intelex 拥有 1,400+
              企业客户，在受监管行业里关系根深蒂固。这些既有厂商有长期合同、深入的职业健康和过程安全模块，以及嵌入式监管报告工作流，SafetyCulture 尚未复制。SafetyCulture 若想在 Fortune
              500 账户中替代 EHS 既有厂商，不只要证明移动 UX 更好，还要证明合规深度相当——考虑到既有厂商多年积累的监管模块库和合规团队关系，这并不容易。反向结果：SafetyCulture
              可能在大型企业账户中长期被限制为一线补充层，而不是替代 EHS 套件。

              Microsoft 365 替代风险：Microsoft Copilot for Microsoft 365 现在包括 AI 辅助表单创建、Power Automate 工作流自动化，以及用于通知的 Teams
              集成——这些能力都包含在多数 SafetyCulture 目标客户已经支付的企业许可成本里。虽然 Microsoft 今天还无法替代 SafetyCulture 的离线巡检能力或整改动作跟踪，但随着
              Microsoft 持续投资一线员工工具，能力汇合风险正在上升。

              Verdantix 2025 Global Corporate Survey 发现：18% 的组织已经广泛部署单独作业人员设备，另有 27% 正在扩大使用——向可穿戴设备、传感器和联网安全硬件的迁移，要求更深的
              IoT 平台集成，超出 SafetyCulture 当前传感器模块能力，可能让拥有更丰富运营技术（OT）集成历史的工业 EHS 既有厂商受益。
