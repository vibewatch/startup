      - number: '2.2'
        title: 市场规模——多重口径，保留不确定性
        blocks:
          - type: paragraph
            body: >-
              公开来源无法给 SafetyCulture 的总可用市场（TAM）赋予一个单一、可信的金额。分析师报告对目标市场定义不同，仅 EHS 合规组成部分的 2026 年估计就从 $2.48 billion（Mordor
              Intelligence，窄口径，仅 EHS 软件）到 $8.9 billion（The Business Research Company，最宽 EHS 软件范围）不等。按 Mordor
              Intelligence，联网员工和 IoT 相邻市场在 2026 年又增加约 ~$10.9 billion，并在 2030 年前以 12–25% CAGR 增长。最直接可比 SafetyCulture
              多模块定位的一线员工平台市场，DataIntelo 和 Growth Market Reports 估计 2025 年为 $6.8 billion，并以 12.4–18% CAGR 增至 2033
              年。MarketsandMarkets 估计，巡检管理软件层 2026 年为 $8.66 billion，CAGR 为 11.5–12.3%。ResearchAndMarkets 估计，SafetyCulture
              的 SC Training/EdApp 模块所覆盖的一线员工培训市场在 2026 年为 $2.86 billion。最宽的表述——包含所有相邻市场的一线员工赋能——按 Fortune Business
              Insights，在 2026 年达到 $36.68 billion；但这个总量已远超 SafetyCulture 当前产品范围。

              这些分歧反映真正的方法论差异，而非分析师错误。方差的主要来源是边界选择：只算软件还是软件加服务、窄口径安全管理还是宽口径运营合规、全球范围还是区域范围。除非先独立核验分析师类别定义与 SafetyCulture
              实际产品边界和收入构成相匹配，否则不应采纳任何单一估计作为可靠 TAM。这带来一项尽调义务：需要三角测算，而不是任选一个数字。

              如果不对地理结构、产品挂载率和按席位定价作公开记录中不存在的假设，无法从已发布数据推导 SafetyCulture 专属 SAM。将 EHS
              软件（$8.9B）、巡检管理（$8.7B）和一线培训（$2.9B）合并，并按类别重叠调整后，可得到约 $10–15 billion 的示意性 SAM；但外部数据无法严格量化重叠，因此只能作为示意。由公司当前
              85,000 个客户和未披露的平均合同价值推导的 SOM，也不能构成独立估计。不同分析师对 EHS 软件的 CAGR 预测从 7.4%（CMI）到 14.6%（Business Research
              Insights）不等，市场定义再次驱动分歧。
