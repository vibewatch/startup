      - number: '1.4'
        title: 规模、客户与全球足迹
        blocks:
          - type: paragraph
            body: >
              截至 September 2024 融资完成时的 SafetyCulture 规模指标，是公开资料中来源最扎实的数据点。公司官方材料和多家第三方新闻来源确认，当轮融资时全球有 85,000 家企业、接近 2
              million 名用户；此前六个月公司新增 100 个岗位，员工超过 800 人，分布在 6 个办公室。November 2024 Kelly Vohs 任命公告更新的员工数为 900 人。然而，UpGuard
              的独立安全档案——最近更新于 22 May 2026——报告员工数为 690，显著更低。约 210 人的差异可能反映时间差（公司可能在 Nov 2024 统计后重组或人员流失），也可能源于公司官方员工数与
              UpGuard 使用的活跃员工数口径不同。尽调应直接向 SafetyCulture 获取经过验证的当前员工数。


              Manchester Digital 对英国业务的报道中点名的企业客户包括 NHS、National Grid、British Airways 和 Transport for London。Manchester
              办公室是公司的 EMEA 枢纽；同一来源称，仅 UK 就贡献了 85,000 家企业客户中的 25,000 多家。Craft.co 的第三方档案估计 2022 年收入为 $132
              million。收入数字未获官方披露，不能视为已验证；不过 Tracxn 融资表按 $2.5B 估值估算的收入倍数约 21x，隐含 2024 年融资时年化收入约 $119 million，与 Craft
              对前一年的 $132 million 估计大体一致。当前 FY2025 收入没有公开数据。2023 平台发布新闻稿中的平台量指标提到，每年执行超过 1 billion 次检查；TechFunding News
              报道称，EdApp 培训模块每天交付 85,000 节课程。SafetyCulture 还称，其全球部署基础已积累超过 5 petabytes 的职场数据和数十亿张图片。
