      证据质量、成果具体度、留存可见度和生产成熟度按定性尺度（高 / 中 / 低）评级，依据截至 2026 年 5 月公开可得的案例研究和评测平台证据。评级反映公开证据强弱，不一定代表实际账户健康度。独立佐证需要至少一个非
      SafetyCulture 来源确认关键说法。
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU025
    data:
      columns:
        - 证据质量
        - 成果具体度
        - 留存可见度
        - 生产成熟度
      rows:
        - label: ArcelorMittal Construction
          values:
            - label: 高 — SafetyCulture 页面有详细案例研究 + featuredcustomers.com 佐证
            - label: 高 — 每年 4,848 次审计；节省 5,000 小时；Safety Walk 用时减少 50%
            - label: 中 — 已确认多年部署；2022 年后当前账户状态未重新核验
            - label: 高 — 43 个生产基地；集团扩展至更多部门；日常使用
        - label: DB Schenker（英国 + 爱尔兰）
          values:
            - label: 高 — 详细案例研究；ISO 认证可独立核验
            - label: 中 — 定性成果（Heads Up 触达、一线参与度）；无量化事故率
            - label: 高 — 已确认 8+ 年使用年限；被描述为关键管理系统
            - label: 高 — 1,800 名员工、28 个设施；审计 + 事故 + Heads Up 全部在生产中
        - label: William Hare
          values:
            - label: 高 — SafetyCulture 页面有详细案例研究；YouTube 视频佐证
            - label: 中 — 180,000+ 次检查；每月 700 个行动；未量化财务成果
            - label: 高 — 已确认 10+ 年使用年限；核心运营系统
            - label: 高 — 2,400 名员工；500+ 个模板；传感器 + Heads Up + 检查在生产中
        - label: SSP（澳大利亚 + 新西兰）
          values:
            - label: 中 — SafetyCulture 客户页面；未发现独立媒体核验
            - label: 高 — 99.6% 按时检查；食品安全理解度提升 82%；事故上报增加 4x
            - label: 中 — 自 2023 年 11 月推出以来 2+ 年合作；正在扩展至亚洲
            - label: 高 — 全国 100+ 个站点；全国运营总监承诺使用平台
        - label: Tennis Australia / Australian Open 赛事
          values:
            - label: 高 — 详细的 2025 年 AO 案例研究；公开报道的活动指标
            - label: 高 — 2,400 次检查；14,000 名员工受训；29,000 次入职引导；400 名球童受训
            - label: 中 — 年度赛事；赛事间留存未确认
            - label: 高 — 2025 年 6 个运营区域均使用平台；连续第 4 年使用
        - label: GROWMARK
          values:
            - label: 中 — SafetyCulture 客户页面；网页搜索佐证；无独立媒体来源
            - label: 高 — 险情上报节省 $1M+；连接 9,000+ 名员工；100+ 个站点
            - label: 中 — 已确认多年；具体使用年限未说明
            - label: 高 — 检查、问题、分析、Heads Up 全部以企业规模投入生产
        - label: London City Airport
          values:
            - label: 高 — casestudies.com 独立托管；有 PDF 案例研究
            - label: 中 — 淘汰 5,000 张纸质表单；审计访问更快；定性效率提升
            - label: 中 — 未确认使用年限；机场仍使用数字平台运营
