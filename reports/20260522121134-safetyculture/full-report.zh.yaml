  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 的收入架构建立在三个不同变现支柱上，其中 SaaS 订阅模式是核心，也是最透明的一项。平台卖给组织，而不是直接卖给一线员工；截至 2026 年 5
              月，它按席位、按月计费，并公开三个套餐。Free 计划允许最多 10 名用户的团队免费使用基础巡检和清单功能；Premium 计划按年付费为 $24/user/month（或月付 $29），并区分两类席位——全价
              Full seats，以及按年 $5/user/month 的 Lite seats，后者面向只偶尔使用的用户，例如完成巡检但不需要管理员或分析访问权限的员工；Enterprise
              计划定制定价，未公开披露。SafetyCulture 官方定价页确认了截至 2026 年 5 月的这些标价。


              必须区分标价和实际收入。SafetyCulture 运行免费增值模式，把大量用户导入 Free 层，变现为零。对于付费账户，企业客户会谈判批量折扣——第三方来源显示，超过 150
              个席位或多年承诺的部署通常可比标价低 10–25%。SafetyCulture 声称有 85,000 个企业客户和约 2 million 名用户，意味着每个账户平均约 23 名用户；但如果相当一部分用户停留在
              Free 或 Lite 席位，隐含 ARPU 会明显低于每账户每年约 $6,768 的理论上限（23 名用户 × $24 × 12 个月）。按 85,000 个账户对应 $90.3M ARR 估计，平均实际
              ARR 约为每账户 $1,062——这与 Free 和 Lite 席位渗透率高、免费增值对付费基数形成明显稀释相一致。


              第二个收入支柱是 SafetyCulture Marketplace，这是嵌入式采购平台，直接接入巡检工作流，提供来自 120+ 供应商品牌的 75,000+ 个工作场所安全产品和 PPE。Marketplace
              允许根据巡检发现直接采购设备，提供精选目录、预算控制和自动下单。Marketplace 收入来自佣金或产品加价，但商品交易总额（GMV）和抽佣率都未公开披露。截至运行日，Marketplace
              在美国和澳大利亚可用。


              第三个收入支柱是嵌入式商业保险，通过与 QBE 的合作承保（底层保险人为 Allianz），并由 SafetyCulture 集成进平台。保险变现依赖对经平台成交的保单收取抽佣或佣金。SafetyCulture
              的巡检数据——超过 5 petabytes 的工作场所合规记录——支撑数据驱动的风险画像，可能让其保险产品形成差异化。保险对总收入的财务贡献未披露。创始人 Anear 曾表示，保险和 Marketplace
              是他“同时打造几项数十亿美元收入业务”愿景的基础，但截至运行日，这些收入流相对核心 SaaS 的规模仍未知。
