  - id: FV004
    title: 投资 KPI
    type: kpi
    insight: |
      五个关键估值信号中有三个为负面或亮起谨慎信号；正面信号（TAM 领导地位、AI 信念）尚未反映在可验证财务指标中。当前组合是业务质量逻辑强、证据质量逻辑弱，因此结论应是「有条件谨慎」，而不是「放弃」或「正面」。
    claimRefs:
      - CV004
      - CV010
      - CV016
      - CV025
      - CV041
    sourceRefs:
      - SV020
      - SV022
      - SV026
      - SV030
    data:
      items:
        - label: 新股估值隐含 EV/ARR
          value: 15-21x
          status: negative
          note: 根据 Aventis、SEG、PitchBook，新股估值比当前 6-10x 私营 SaaS 可比中位数高 2-3x
        - label: 二级市场折价
          value: 31-35%
          status: negative
          note: 市场出清价格 AU$1.63-1.72B，对比 AU$2.5B 新股估值（PremierAlts、UpsideList）
        - label: 领导层稳定性
          value: 2 CEOs / 14 months
          status: negative
          note: 截至 2026 年 5 月，临时 CEO 为 Luke Anear；永久继任者尚未任命
        - label: 市场位置（Verdantix 2025）
          value: Leader Quadrant
          status: confirmed
          note: EHS 软件领导者，65M+ 员工 TAM；企业留存强
        - label: AI 战略信念
          value: Twine acquired Apr 2026
          status: estimated
          note: 收购释放意图信号；公开报告中尚未展示 AI 收入
