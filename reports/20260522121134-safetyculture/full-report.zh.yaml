        - 公司主张隐私设计优先；October 2025 ToC 更新称不使用客户数据训练 AI；DPA 到位；ISO 27001 和 SOC 2 提供技术控制基础
        - 高 — 自动化决策透明度和 Children's Online Privacy Code 合规未确认；改革后 OAIC 执法姿态更积极
        - 获取 OAIC 合规证明；审查第二批改革下的 AI 披露义务；确认 Dec 2026 前 Children's Online Privacy Code 合规计划
      - - UK GDPR 和 ICO January 2026 更新版国际数据传输指引 — 受限传输规则适用于非英国实体的云访问；向非充分性第三国传输需 IDTA 或标准合同条款
        - 英国和欧盟
        - 有效且演进中 — January 2026 ICO 指引已发布
        - 中高 — SafetyCulture 托管在 AWS 的数据可被全球访问；子处理者未公开列出
        - 高 — ICO 执法权限最高 £17.5M 或全球营业额 4%
        - 已发布 DPA；隐私政策中有 GDPR 和 CCPA 附录；SAFETYCULTURE (UK) LIMITED 已注册
        - 高 — 子处理者名单未公开；未披露传输风险评估
        - 要求完整子处理者名单和传输风险评估；确认 AWS 以及非充分性国家所有重要子处理者均覆盖 IDTA 或 SCC
      - - >-
          EU AI Act — 面向安全关键工作场所的高风险 AI 系统，要求自动化决策透明度和符合性评估；2026–2027 滚动执法；EU Product Liability Directive 将产品责任扩展到 AI
          集成软件
        - 欧盟
        - 部分生效 — 高风险 AI 系统规则 August 2026
        - 中 — SafetyCulture 来自 Twine 收购的智能体 AI 路线图，可能在安全关键工作场所环境中被认定为高风险 AI
        - 高 — 禁止部分 AI 用途；符合性评估；AI 造成损害的软件产品责任新增
        - October 2025 ToC 称不使用客户数据训练第三方 AI；安全页面声称有端到端加密和人工在环护栏
        - 中 — 智能体 AI 合规架构未公开确认；Twine 集成带来新的风险向量
        - 将 Twine AI 功能映射到 EU AI Act 风险类别；EU 产品上线前确认符合性评估义务
      - - 未发现已知美国诉讼或监管执法 — 截至 May 2026，PACER 和公开报道未显示活跃或已和解案件；未发现与 SafetyCulture 输出相关的 OSHA 执法行动
        - 美国
