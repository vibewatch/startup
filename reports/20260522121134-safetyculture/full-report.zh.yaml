  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的可服务市场由四个相互重叠的软件类别交汇定义：环境、健康与安全（EHS）及合规软件，数字化巡检和审计管理，一线员工培训和学习管理，以及联网员工或资产 / IoT
              传感器监控。SafetyCulture 不是纯 EHS 套件、纯 LMS，也不是纯 IoT
              平台——它是一个多模块一线运营平台，会根据客户场景在四个类别中同时竞争。因此，正确的市场边界映射需要横跨多个相邻类别定义划线，而不是把公司塞进单一分析师市场报告。

              主要纳入的支出包括：（1）在工作现场把巡检表、清单、审计和安全观察数字化的软件工具；（2）跟踪事故、纠正措施、风险评估和监管报告的合规与 EHS
              管理平台；（3）面向一线员工而非办公室员工的微学习和移动培训平台；（4）把实体资产、环境和员工连接到共享运营数据层的联网员工和 IoT 传感器平台。每个类别都有不同的分析师市场报告，这意味着
              SafetyCulture 的 TAM 本就需要多份报告拼合，任何单一分析师估计都会低估机会。

              主要边界之外包括：通用人力资源管理系统和薪资软件；面向法务和合规部门销售、缺少现场组件、以桌面为中心的企业 GRC 套件；以及 Asana 或 Jira
              等缺少职场安全或合规工作流的通用项目管理工具。工业自动化硬件（SCADA、DCS、PLC）和纯个人防护设备属于资本品，而非软件订阅，也被排除。

              现状替代品——它们与直接竞争产品一样驱动转化挑战——包括纸质表格和夹板、基于 Microsoft Excel 和 SharePoint 的清单、通用电子邮件审计追踪，以及既有本地 ERP 安全模块（SAP
              EHS、Oracle EHS）。SafetyCulture 明确把自身平台定位为这些工具的替代品。2024 年 Feedback from the Field 调查覆盖 Australia、US 和 UK 超过
              3,000 名管理者，发现 62% 的一线员工对当前 IT 工具不满，71% 更偏好整合平台而非分散应用——这直接说明未满足需求与 SafetyCulture 的打包产品策略一致。
