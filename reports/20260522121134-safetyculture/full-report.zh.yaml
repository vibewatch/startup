  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景：上一轮融资结构与市场语境
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 当前 AU$2.5 billion 的头部估值来自 September 2024 融资轮——由 AirTree Ventures 领投，融资 AU$165M，其中 AU$75M
              为新股资金，AU$90M 为老股交易所得。该轮较 2023 年 AU$2.7B 估值折价 AU$200M，是澳大利亚本周期最显眼的估值下调轮之一。老股交易部分尤其值得关注：AU$90M 老股交易占该轮总融资额的
              55%，说明早期投资者和员工在低于上一轮估值的价格上有明显流动性需求——这种动态更像退出可选性受限，而不是公司接近变革性增长拐点。


              更广泛的 SaaS 环境强化了估值下调轮的重要性。PitchBook Q4 2025 数据显示，后期私有 SaaS 中位 EV/ARR 从 2021 年 18x 压缩到 2025 年
              7x。SafetyCulture 2024 年重置到 AU$2.5B，只是部分修正，并未完全正常化到新的市场出清水平。按 AU$160.6M FY24 收入（SmartCompany）计算，当前隐含倍数仍为
              15-21x ARR，具体取决于使用哪个收入口径——显著高于 EHS SaaS 同行 6-10x 区间。


              SAFETYCULTURE (UK) LIMITED 的 UK Companies House 备案（company 11007705，accounts to June
              2024）提供了少见的实体层面财务窗口：总资产 £4.25M、净资产 £3.01M、62 名员工。这个有限的 UK
              足迹确认，大部分收入、知识产权和运营风险都留在未上市的澳大利亚母公司——后者没有发布经审计的集团层面财务。缺少经审计合并账目，是一阶尽调缺口，阻止外部独立验证管理层报告的所有收入、增长和利润率主张。
