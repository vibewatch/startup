          - type: callout
            title: 2026 年 5 月裁员和员工数下降指向未经确认的成本压力
            body: >-
              SafetyCulture 员工数从 989 人（2024）降至 929 人（2025，Revelio Labs），并在 2026 年 5 月 7 日通过未披露规模的裁员进一步缩减。公司从 Manchester
              和 Austin 向 Brisbane 做地理整合，说明成本理顺正在进行。这些信号——加上未披露的烧钱速度和现金跑道——使 AU$75M 融资能否提供足够现金跑道通往盈利存在重大不确定性。
