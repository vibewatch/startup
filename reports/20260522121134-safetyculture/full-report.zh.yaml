    title: 缓释措施与否决标准表
    layout: default
    notes: 否决标准阈值由评估者基于 SafetyCulture 已披露的战略承诺、估值结构、监管时间线和可比 SaaS 重组先例设定。这些是投资监控触发项，不是合同条款。
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - CEO 继任与关键人
        - 永久 CEO 任命或 Anear 离任公告
        - 临时 CEO 任期超过 12 个月；或外部聘任的永久 CEO 缺乏创始人级产品理解；或 Anear 宣布离任但没有继任安排
        - 重新评估投资逻辑；若超过 12 个月仍无可信继任者，临时状态就是投资逻辑破裂信号
      - - 估值与降估值轮悬压
        - 下一轮新股融资定价
        - 新一轮定价低于 AU$2.0 billion；或公司以低于 AU$1.5 billion 的估值寻求困境 M&A 出售
        - 投资逻辑破裂——增长再加速没有发生；现有投资人面临按市值计价损失
      - - AI 平台重建执行
        - Twine 收购带来的智能体 AI 功能 GA 发布
        - 收购后 18 个月内（到 2027 年 10 月）没有实质性 AI 功能 GA；或重建上线后因回归问题导致企业客户流失加速
        - 投资逻辑破裂——AI 重建是核心战略理由；失败说明公司缺乏竞争能力
      - - Australian Privacy Act 合规
        - OAIC 对 SafetyCulture 提起执法行动或隐私侵权集体诉讼
        - 任何 OAIC 调查通知、可执行承诺或集体诉讼投诉；或截至 2026 年 12 月被认定不符合 Children's Online Privacy Code
        - 法律风险立即兑现；评估 AU$50M 罚款敞口是否有保险覆盖
      - - AWS 云依赖与运营韧性
        - 客户报告或媒体报道 SafetyCulture 平台宕机超过 4 小时
        - 12 个月内发生两次或更多超过 4 小时的宕机；或任何宕机与受监管调查的客户安全事件相关
        - 升级至 SLA 和基础设施尽调；要求确认多区域架构
      - - 重组与工程能力
        - 工程人数相对 AI 重建路线图里程碑交付
        - 官方人数披露显示工程团队低于 200 FTE；或 AI 重建里程碑较路线图滑延超过 6 个月；或进一步关闭研发中心
        - 投资逻辑承压——工程能力不足，难以在竞争窗口内完成 AI 重建
      - - 财务模型不透明与烧钱
        - 新股融资完成或经审计财务披露
        - 到 2027 年 12 月仍无新的新股融资；或任何披露期收入同比增长低于 20%；或披露毛利率低于 60%
        - 投资逻辑破裂风险——现金跑道受压；迫使公司 IPO、困境融资或出售
      - - 企业 EHS 竞争替代
        - SafetyCulture 在企业 EHS 竞争交易中的赢单率和输单率
        - 独立可验证数据显示，面对 Intelex、Cority 或 VelocityEHS 的输单率超过 40%；或公开宣布具名企业客户转投竞争对手
        - 重新评估企业扩张逻辑；判断 AI 重建能否补上 GRC 能力缺口
