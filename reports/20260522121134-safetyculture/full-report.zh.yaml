      - number: '8.2'
        title: 可比分析：EHS SaaS 同行与公开市场锚点
        blocks:
          - type: paragraph
            body: >
              没有审计财务的高增长私有 SaaS 公司，估值只能先锚定可比交易分析和公开市场倍数。本节同时套用两套框架，推导一个可信区间。


              公开 SaaS 侧，SaaS Valuation Multiple tracker 数据显示，上市 SaaS 的 EV/NTM Revenue 中位数在 2026 年 Q1 压缩至 6.4x，只有 AI
              原生或高盈利公司还能撑住两位数倍数。SafetyCulture FY24 报告净亏损 AU$36M，既没有验证 AI 收入，也不盈利——若要拿到高于留给头部四分位增长公司 8-10x
              区间的溢价，必须先证明至少一项。


              EHS SaaS 私有市场侧，Aventis Advisors 基准显示，更广义 EHS 行业的 M&A 交易平均约 2.0x 收入，品类领导者为 7-9x。Capstone/IMAP 显示，2025 年
              SaaS 软件 M&A 平均为 5.1x EV/ARR，优质资产达到 8-12x。MarketScreener 的 EHS 与合规软件数据把上市和私有可比公司放在 5-8x EV/Revenue
              中位数。Software Equity Group 2025 年 B2B SaaS 私有交易中位数为 4.5-6.5x EV/ARR。NatLawReview/SEG 2026 年展望预计，EHS
              品类领导者可从战略收购方获得 6-10x ARR。


              把这些锚点合起来，SafetyCulture 可辩护的可比区间是 6-10x ARR；套在 FY24 收入 AU$160M 上，对应 AU$0.96B-AU$1.6B，明显低于 AU$2.5B
              的新股价格。仅靠可比倍数撑住 AU$2.5B，必须满足两条之一：确认 ARR 超过 AU$200M（IBISWorld 对 2025 年的估计为 AU$197.6M，但这是基准估算而非审计值），或用已验证的 AI
              增强增长证明 12-15x 倍数合理——目前公开数据都无法核验。
