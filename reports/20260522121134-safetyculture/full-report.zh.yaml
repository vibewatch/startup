      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 有条件谨慎：须以 AU$1.75-2.0B 入场
            body: >
              SafetyCulture 确实是 EHS 与运营 SaaS 的品类领导者，竞争位置可防守，企业客户留存扎实，AI 战略也可信。但在 AU$2.5B 估值下，若没有审计财务、确认 ARR 超过
              AU$180M、以及已验证的 AI 收入，15-21x 隐含 ARR 倍数无法辩护。二级市场定价 AU$1.63-1.72B（折价 31-35%）和基于可比公司的公允价值
              AU$1.28-1.6B（基准情景）指向同一个结论：新股价格要求的溢价，目前证据尚撑不住。本章建议仅在折价 20-30%（AU$1.75-2.0B）时有条件参与，前提是：（1）FY25 审计财务；（2）确认
              ARR 超过 AU$180M；（3）任命永久 CEO。若价格高于 AU$2.0B 且这些条件未满足，应放弃。
