  - id: FR001
    title: SafetyCulture 风险热力图
    type: matrix
    approximationNotes: >-
      发生可能性和影响评级是评估者基于可得证据定性分析作出的判断。私营公司没有可用的量化概率数据。单元格标签反映评估者判断的剩余严重度：致命表示可能不可逆、足以动摇投资逻辑；高表示重大、需要补救；中表示可通过监控管理；低表示孤立且可逆。若可得，也展示缓释成熟度因素（强/部分/早期）。
    claimRefs:
      - CR011
      - CR013
      - CR016
      - CR021
      - CR027
      - CR029
      - CR037
      - CR042
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - label: 检查数据质量依赖（中等剩余风险；部分缓释）
            - label: 免费增值 SMB 流失风险（中等剩余风险；无直接缓释）
            - label: 重组下工程人才留存（高剩余风险；缓释有限）
        - label: 中可能性
          values:
            - label: EdApp/SC Training 迁移扰动（低剩余风险；基本完成）
            - label: AI 重建导致集成 API 破裂（中等剩余风险；早期阶段）
            - label: AWS 单云故障（高剩余风险；部分缓释；无多云）
        - label: 低可能性
          values:
            - label: 网络安全事件 —— 高价值数据目标（若发生为致命；基线强）
            - label: 保险承保合作方退出（高剩余风险；双承保方）
            - label: Australian Privacy Act 执法或集体诉讼（如提起则为致命；缺口已确认）
