      - number: '6.4'
        title: 留存、耐久性与满意度信号
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 没有披露经过验证、审计的 NRR 或 GRR 数据。截至 2025 的第三方分析师估计称，NRR 约为 110%，公司明确目标是在 FY2025-26 达到
              120%，主要靠既有客户基础内的多产品扩张实现。这些估计来自聚合分析师评论，不能视为已确认的财务数据。

              最强的耐久性证据来自案例研究。DB Schenker 自 2017 起持续运行该平台——任期已超过 8+ 年。William Hare 的合作关系跨度“超过十年”。GROWMARK 和 ArcelorMittal
              Construction 都是多年用户。这些长期企业关系说明企业群体粘性强，与平台嵌入日常合规和安全工作流的角色一致。企业部署中的切换成本实质较高：SafetyCulture
              模板、检查历史、纠正行动记录、培训完成记录和认证审计轨迹，并不容易迁移到替代平台；受监管客户替换一个已认证、合规的解决方案，还要承担额外尽调负担。美国 VA 政府采购记录（$3,000
              合同）更符合试用或小团队部署，而不是有意义的企业留存。

              截至 2026，G2（4.6/5，241 条评论）、Capterra（4.6/5，353 条评论）、Gartner Peer Insights（4.0/5）和 Software Advice（4.6/5，684
              条评论）的评论平台数据都显示较强推荐情绪。评论者持续描述多年部署和嵌入式工作流。常见抱怨集中在：大型团队按用户计价扩张时成本上升、多步审批路由有限、企业层级以下报表布局定制受限、初始配置曲线较陡。Connecteam
              的独立评测（2026）给平台 7.7/10，并指出排班和工时表功能相对于全功能现场劳动力工具存在缺口。

              证据基础中严重性最高的负面客户事件，是 March 2026 退役 SC Training（原 EdApp）。关停影响 70,000+ 组织和 1M+ 用户。SafetyCulture
              提供了迁移到核心平台的路径，但第三方分析指出显著限制：完成记录和学习进度数据只有付费升级后才会转移；自定义测验和认证项目需要手动重建；未迁移账户在 April 20, 2026
              之后永久失去所有访问和数据。该中断对整体客户基础的运营和声誉影响——尤其是依赖培训完成记录满足审计合规的受监管行业客户——尚未在公开来源中量化。分析师将 SMB
              群体识别为对定价最敏感、因此最容易发生客户标识流失的队列；相比之下，企业群体的工作流嵌入度构成天然留存缓冲。
