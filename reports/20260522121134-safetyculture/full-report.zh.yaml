      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              2026 年 SafetyCulture 所在市场的主要需求驱动包括：监管要求、用数字化转型替代纸质流程、AI 融入一线运营、ESG 和可持续发展报告要求，以及劳动力短缺带来的培训紧迫性——企业需要保住机构知识。

              监管压力是最强的近期驱动。在 North America，OSHA 电子记录保存要求正把中端制造商和建筑公司推向专门 EHS 软件。在 APAC，Safe Work Australia 的统一 WHS
              框架、India 的 OSHWC Code，以及 China 的 GB 标准更新正在制造合规紧迫性。Wolters Kluwer 和 National Safety Council 对 1,000 多名高级
              EHS 负责人开展的调查发现，90% 受访者热衷于投资 AI 以提升安全绩效，显示出强烈意愿，利好 SafetyCulture 这类 AI 原生 平台。数字化转型仍是最大的结构性驱动：2026 EHS
              Insight 买方指南指出，许多组织仍依赖手工和纸质 EHS 系统，现代平台应在无需外部顾问的情况下 30 天完成完整实施。SafetyCulture
              的自助式、移动优先部署模式与这一预期相符。劳动力短缺是被低估的驱动因素：SafetyCulture Feedback from the Field 调查发现，71%
              员工担心所在行业出现人才流失；不满员工造成的生产率损失，全球每年估计为 $196 billion——这是一个支持平台投入的量化痛点。

              采用约束同样显著。对 SMB 而言，成本是第一障碍：高订阅费、数据迁移成本和培训投入，使约 30% 符合条件的 SMB 无法采用新软件。超过四分之一未采用的 SMB
              表示现有工作流「已经够用」。Intelex、Cority、VelocityEHS 和 Enablon 等企业 EHS 套件占据大客户，并通过数据锁定和深度 ERP 集成形成高切换成本。ROI
              证明很难提前量化：EHS 买方在部署前难以建模事故减少收益、保险节省和监管罚款避免。SMB EHS 软件采用率估计只有 ~15%，而大型企业约为 ~80%；这揭示出一个深度未渗透的细分市场，也揭示了变现风险。
