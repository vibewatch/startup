      - number: '6.3'
        title: 分垂直行业的具名客户证据
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 组合中具名客户证据的质量差异很大。文档最充分的部署按垂直行业列示如下。

              建筑与制造。ArcelorMittal Construction——全球最大钢铁和矿业公司旗下子公司，业务覆盖 15 个国家——最早在 2017 部署 SafetyCulture，之后扩展到更多事业部。公司每年在
              43 个欧洲生产站点运行 4,848 次审计，每年节省 5,000 小时，并将 Safety Walk 审计耗时降低 50%。Head of Health and Safety Robin Castin
              将灵活性、模板库、没有僵硬的单站点限制列为关键决策因素。William Hare 是 UK 钢结构制造企业，2,400 名员工分布在 UK、UAE、India 和 Portugal，已使用
              SafetyCulture 10+ 年，并在一个互联平台中完成超过 180,000 次检查和行动。公司每月在安全、质量、环境管理和维护领域运行 700+ 个纠正行动。团队在油漆车间和焊接仓库使用 Sensors
              监测湿度，并用 Heads Up 发布流程更新。公司持有 ISO 9001、ISO 45001、ISO 14001 和 BS EN 1090 认证，依靠 SafetyCulture
              实时仪表盘在无需准备的情况下通过外部审计。Level 10 Construction 拥有 200+ 员工，已完成 2.5 million 人工小时且无误工事故，每天运行 10+
              次审计，用平台做任务前安全检查和现场到办公室沟通。

              物流与运输。DB Schenker 是全球物流龙头，拥有 75,000 名员工，自 2017 起在 UK and Ireland 集群（1,800 名员工、28 个设施）持续使用
              SafetyCulture，覆盖审计、事故报告和 Heads Up 内部通信。QSHE Cluster Lead Manager 将 Heads Up 形容为“短、快、好用”，并称赞它能触达没有 email
              访问权限的一线员工。一线参与度足够高，员工会主动向 QSHE 团队建议新的 Heads Up 主题。DB Schenker 维持 ISO 9001、ISO 14001 和 ISO 45001
              认证，SafetyCulture 提供支撑。

              农业与餐饮服务。GROWMARK 被标识为北美第三大农业零售商，拥有 9,000+ 员工、覆盖 100+ 站点，使用 SafetyCulture 做检查、问题、分析和 Heads Up 点对点学习。公司将超过
              $1 million 的节省归因于平台支持的“良好捕捉”报告——在事故发生前捕捉未遂事故和危险。SSP 是澳大利亚旅行场所最大的餐饮供应商，2024 年在 Australia and New Zealand 从
              34 个站点扩至 100+ 站点，实现 99.6% 食品安全检查按时完成率、员工对食品安全标准理解度提升 82%，报告事故数量增加 4x（改善危险可见性）。National Safety Manager Phil
              Theuma-Whichello 表示：“在这个动态业务中，SafetyCulture 是我们的常量之一。”

              航空与赛事。London City Airport 每年服务数百万乘客，25 人运营团队每天执行多次安全检查，用 SafetyCulture 的 iAuditor 取代了每年产生约 5,000
              张审计纸质文件的纸面流程。Tennis Australia 自 2021 起将 SafetyCulture 作为中央运营平台，为 2025 Australian Open 处理 2,400 次检查、29,000
              次入职培训和 14,000 名员工培训完成记录。平台覆盖物流、零售、酒店服务、球场运营、客户体验和球童培训。历史上，Qantas 曾运行一项纳入 iAuditor 的安全改进计划，据称关联误工伤害频率下降
              70%，并预计五年节省 $500 million 成本。不过，Qantas 案例主要来自 SlideShare 托管的 PDF，除 2024 之外没有确认的更新近性。

              酒店与餐饮。FISHBOWL 是一家在 Australia 和 US 扩张的澳大利亚快餐连锁，拥有 850+ 员工，将 SafetyCulture 作为主要运营、报告和事故管理系统。公司报告，按时培训完成率超过
              90%，并通过 SafetyCulture 传感器监测每年节省 $70,000。Tennis Australia 的 Jess Oliver 表示：“SafetyCulture
              改变了我们培训和管理团队的方式。”Schindler Group 是全球电梯和自动扶梯制造商，使用该平台做检查、行动和问题报告，确保现场团队直接拥有并记录安全合规。

              公共部门与政府采购。SafetyCulture 的 EMEA 融资公告确认的 UK 企业客户标识包括 NHS、National Grid、British Airways 和 Transport for
              London。除客户标识身份外，这些客户没有可用的详细生产证据。一条美国政府采购记录显示，Department of Veterans Affairs 购买了 SafetyCulture iAuditor
              Premium Annual Plan（合同期 June 16 2025 to June 15 2026，金额 $3,000）——截至 2026，这只是小规模足迹，更像试点，而非打入美国公共部门企业级市场。
