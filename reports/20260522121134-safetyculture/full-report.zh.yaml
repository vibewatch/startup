      - number: '6.2'
        title: 采用轨迹与平台规模
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 公开披露的用户和客户指标显示，自 2004 年 iAuditor 推出以来，公司保持稳步增长；2023 年统一平台上线和 September 2024 Series D
              融资后，增速明显抬升。September 2024 公告中的核心指标是：85,000 家企业、接近 2 million 名用户、覆盖 180+ 个国家。更早披露（2023 平台上线时期）提到约 75,000
              个组织和 1.5 million 月度用户，意味着大约 12 个月期间新增约 10,000-to-15,000 家净新企业，月活用户数也明显提升。平台声称每月完成超过 2 million 次检查，公共模板库超过
              100,000 个模板。

              垂直行业层面的采用指标更细：ArcelorMittal Construction 每年在 43 个欧洲生产站点运行近 5,000 次安全审计；William Hare 在 10+ 年内完成超过 180,000
              次检查，拥有 500+ 自定义模板；DB Schenker 自 2017 起在 28 个 UK/Ireland 设施持续运行审计、事故报告和 Heads Up 通信；GROWMARK 连接了 9,000+
              员工、覆盖 100+ 站点；SSP Australia/New Zealand 在 2024 年从 34 个站点扩展到 100+ 站点，SafetyCulture 是支撑系统；Tennis Australia 为
              2025 Australian Open 处理了 2,400 次检查、29,000 次入职培训，并培训 14,000 名员工。

              Freemium 到付费的转化漏斗具有实质意义。SafetyCulture 提供免费层（限 3 名用户和 3 次模板导出），作为获客漏斗顶部渠道，吸引团队自发发现产品并自然扩展。Software
              Advice（684 条评论，4.6/5）和 Capterra（353
              条评论，4.6/5）的评论平台数据说明，用户社区规模大且活跃，很多用户自发发现并评估产品——这与产品驱动增长动作一致。不过，分析师对付费客户的估计（约 25,000 家付费公司，相比 85,000 家总企业数和
              1.5M+ 月度用户）表明，客户基础中相当大比例仍停留在免费或低支出层。随着增长成熟，转化和变现会成为重要挑战。
