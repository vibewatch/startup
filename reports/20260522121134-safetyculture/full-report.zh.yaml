      - number: '5.4'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的安全体系由两项独立认证支撑：ISO 27001:2022（全球信息安全管理标准）和 SOC 2 Type II（AICPA 信任服务准则，覆盖安全性、可用性、保密性）。两项认证均可在
              SafetyCulture 公开安全页面（safetyculture.com/security）确认，也被多个评测平台独立引用。ISO 27001 按再认证周期续证；SOC 2 Type II
              每年由独立审计师出具鉴证。合在一起，这些认证是多数企业采购决策的必要条件，也是 EHS / 运营 SaaS 品类的竞争入场券。

              数据静态加密采用 AES-256，传输加密采用 TLS 1.2 或更高版本。客户数据托管在 AWS，并通过访问控制隔离——只有必要人员可以访问客户数据，内部系统访问要求 MFA 和 VPN。面向公众的 Trust
              Center 让企业买方无需正式 NDA，就能获取安全文档、认证和白皮书用于尽调。

              隐私与数据保护义务包括 GDPR（面向 EU 数据主体）、Australian Privacy Act 合规（面向澳大利亚客户），以及适用的美国州级隐私法规。数据驻留细节——尤其是哪些 AWS
              区域存放哪些客户数据——并未在公开文档中完整披露，这是受监管行业企业客户的尽调问题。SafetyCulture 的隐私政策公开可得，但具体数据保留时间表和删除流程没有得到独立验证。

              产品内合规工具支持与 HACCP 对齐的食品制造和酒店业温度监控、职业安全监管合规文档（在美国与 OSHA 相关），以及通过 SC Training 课程库提供的行业认证项目（1,000+ 可编辑认证课程，尽管
              SC Training 平台已并入核心平台）。平台明确声明自己不是专门的 EHS 管理软件，要求用户自行评估功能是否匹配具体运营需求——对于需要过程安全、职业健康或环境模块的受监管行业，这是有意义的限制条件。

              安全态势存在一个轻微且有文档记录的缺口：独立安全扫描机构 UpGuard（第一章公司概况中提及）指出，SafetyCulture 网站存在 cookie 安全和 Content Security
              Policy（CSP）弱点。这些属于表层 Web 安全问题，并非平台安全失效，但说明营销和应用 Web 层的安全卫生并不完美。
