        - 索取按收入流拆分的毛利润瀑布（SaaS / 市场交易 / 保险 / 培训）
      - - ARR 瀑布（新增、扩张、收缩、流失）
        - 无法判断收入增长由新增客户、扩张还是留存驱动
        - 索取过去 8 个季度的季度 ARR 瀑布
      - - 经营利润 / 亏损（EBIT/EBITDA）
        - 无法确认 2023 年 3 月盈利说法；无法评估资本充足性
        - 索取带经营费用拆分的 P&L；确认任何一次性项目
      - - 资产负债表（现金、债务、营运资本）
        - 无法评估流动性、债务义务或真实现金跑道
        - 索取最近一期经审计资产负债表；确认信贷额度
      - - 按分板块拆分的 CAC 和 LTV
        - 无法评估 GTM 效率或 S&M 投资回报
        - 索取按客户队列归因的销售和营销成本及收入
      - - NRR 和总流失率
        - 无法评估收入质量；无法建模未来 ARR 轨迹
