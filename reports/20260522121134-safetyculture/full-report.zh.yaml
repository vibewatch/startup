      - number: '8.4'
        title: 投资建议与尽调条件
        blocks:
          - type: paragraph
            body: >
              在 AU$2.5B 的新股挂牌估值下，SafetyCulture 适合给出“有条件谨慎”结论。公司确实是 EHS 与运营 SaaS 的品类领导者——Verdantix Green Quadrant 2025
              将其列入领导者象限，TAM 覆盖 65M+ 一线工人，企业客户留存强，Twine 收购也验证了 AI 战略。若有审计财务和稳定领导层，这些属性本可在正常市场环境下支撑溢价倍数。


              谨慎来自四个明确证据缺口：（1）缺少集团层面审计财务，ARR、增长和利润率无法独立核验；（2）AU$2.5B 新股价隐含 15-21x ARR，是当前私有 SaaS 5-7x 中位数的 2-3
              倍；（3）二级市场已把公司定价在 AU$1.6-1.8B，与基于可比公司的公允价值一致；（4）14 个月两任 CEO 的领导层循环和 2026 年 5 月重组带来执行风险，而新股价格未计入这部分风险。


              可投情景是以 AU$1.75-2.0B 入场，较上一轮新股折价约 20-30%。在这个水平上，以 FY24 收入 AU$160M 计算的隐含 ARR 倍数降至 11-13x——仍高于 6-10x
              可比中位数，但考虑 TAM 领导地位、客户留存和 AI 期权，可以辩护。任何按 AU$2.5B 参与的新股投资都应附带条件：FY25 审计财务、确认 ARR 超过 AU$180M，以及永久 CEO 任命且已有
              90 天履职记录。战略收购方若在 2026-2027 年支付高于 AU$2.5B 的价格，就必须锚定 AU$200M+ ARR 轨迹和已确认的 AI 收入牵引力；当前公开数据都无法证明。
            claimRefs:
