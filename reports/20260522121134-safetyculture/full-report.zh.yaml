    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 是一家澳大利亚私营科技公司，运营移动优先的职场运营平台，服务制造、建筑、酒店、零售、物流等行业的一线员工。公司的源头可追溯到 2004 年：创始人 Luke Anear
              曾是职场事故调查员，当时在 Queensland 最北部的车库里开始开发数字化安全文档。产品后来演进为 iAuditor，公司新闻稿称其为「全球最大的清单应用」，之后又更名为
              SafetyCulture，以匹配更宽的平台名称。公司总部位于澳大利亚 NSW Surry Hills Foveaux Street 72 号 2 层（Sydney 都会区），全球设有 6 个办公室，包括服务
              EMEA 团队的 Manchester（UK）办公室和负责 North America 运营的 Kansas City（US）办公室。


              商业模式围绕 SaaS 订阅平台展开，主要卖给企业而非个人员工。核心变现来自按席位或按组织授权 SafetyCulture 平台；截至 2023
              年平台发布时，该平台已整合巡检与审计、问题管理、任务分派、资产管理、培训交付（EdApp/SC Training）、IoT 传感器监控、消耗型工作场所用品市场（截至 late 2023 覆盖 75,000+
              件产品、来自 120+ 个品牌），以及承保客户风险的商业保险。市场和保险线是公司有意走出纯 SaaS 的多元化方向；按创始人 Anear 的说法，策略是「同时打造几条数十亿美元收入规模的业务」。


              SafetyCulture 的公开使命是改善一线员工的工作生活，并帮助组织建立安全和持续改进文化。公司明确瞄准全球约 2.7 billion
              名无桌面岗位员工——这一群体长期缺少专门技术投入——并把竞争差异放在工作现场直接触达员工，而不是只触达管理层。截至运行日，公司仍为私营，未公布 IPO 计划。
