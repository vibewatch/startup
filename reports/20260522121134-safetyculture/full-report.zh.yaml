      - number: '3.6'
        title: 切换成本、锁定效应、多平台并用与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture
              的护城河主要来自流程性切换成本，而不是技术锁定。关键切换成本包括：（1）模板和工作流库——已经投入时间搭建、定制并部署数百个巡检模板的客户，迁移到竞争对手时需要大量重建时间；（2）历史数据——多年巡检记录、事件日志和整改动作历史以
              SafetyCulture 自有格式存储，带来检索和迁移摩擦；（3）嵌入式工作流——当 SafetyCulture 通过 API 或原生连接器与企业系统（SAP、Power
              BI、Tableau、ServiceNow）集成时，集成成本和测试时间构成真实切换壁垒；（4）用户熟悉度——一线员工已接受 SafetyCulture
              移动界面培训，换用任何工具都要重新培训，增加变革管理成本；（5）培训内容——SC Training 课程库和完成记录存放在 SafetyCulture 中，进一步带来数据可携带性考量。

              多平台并用在 SMB 层很常见。许多小型组织把 SafetyCulture 与纸质流程或部分 Excel 系统并行使用。在企业层，SafetyCulture 经常与既有 EHS
              套件（Cority、Intelex）共存，而不是替代它们——SafetyCulture 负责一线移动巡检，EHS 既有厂商负责职业健康、环境合规和管理层报告。这种共存模式降低了买方的单一供应商风险，但限制
              SafetyCulture 的企业合同价值；如果 EHS 既有厂商扩展移动能力，也会带来替代风险。

              网络效应有限，但模板库里确实存在：发布和下载模板的组织越多，平台模板生态的价值越高。这形成温和的需求侧网络效应，让 SafetyCulture 相比没有同等模板目录的小型同业受益。

              护城河持久性风险：（1）商品化——核心巡检功能（离线移动清单、整改动作、PDF 报告生成）正被越来越多竞争对手复制，单靠巡检模块形成的功能护城河被削弱；（2）EHS
              既有厂商投入移动端——Cority、Intelex 和 VelocityEHS 正投资移动优先的一线能力，收窄 SafetyCulture 的 UX 优势；（3）Microsoft 365
              扩张——Microsoft 的 AI 表单智能（Copilot for Forms）和 Power Automate 工作流工具，抬高买方在既有 Microsoft
              合同内可完成任务的上限；（4）来自低端的定价压力——GoAudits 和 Lumiform 以 SafetyCulture 每用户价格的一半或更低提供巡检功能，在 SMB 市场制造向下价格压力；（5）AI
              差异化不确定——SafetyCulture 收购 Twine AI（2026 年 4 月）显示平台 AI 投入，但竞争对手（Cority 的预测性安全分析、Lumiform 的 AI 表单创建、GoAudits
              的自动异常检测）也在同时追逐类似 AI 差异化。
