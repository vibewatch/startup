      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 的治理和领导结构存在重大不确定性，必须通过直接尽调联系厘清。November 2024 的一份官方新闻稿宣布，Blackstone 被投公司 LivCor 前 CEO Kelly
              Vohs 将自 1 January 2025 起担任 CEO，Luke Anear 转任执行董事长，专注长期愿景和董事会治理。然而，April 2026 的 Twine 收购公告把 Luke Anear
              标注为「CEO 兼创始人」，UpGuard 的独立公司档案（更新于 22 May 2026）也列 Anear 为 CEO。截至运行日，SafetyCulture 当前团队网页列出 Luke Anear
              为首席执行官，并未提及 Kelly Vohs。截至运行日，官方和第三方来源之间的冲突，造成真正的运营权归属不确定；这对关键人集中分析具有重大影响。


              抛开 CEO 身份不确定性，截至运行日在 SafetyCulture 官方领导层页面可见的高管团队包括 Luke Anear（列为 CEO）、Edelita Tichepco（首席财务官）、Tom
              Dance（首席技术官）、Hamish Grant（首席运营官）、Anna Wenngren（首席人力官）和 Phil Goldie（全球销售负责人）。团队页面还按 Craft 的高管档案提到「Mike
              Welch」担任 SC Training 董事总经理。SafetyCulture 未公开正式董事会组成；不过，投资方基础（Airtree、Blackbird、Morpheus Ventures、Index
              Ventures、Hostplus、HESTA）意味着 Airtree 和 Blackbird 至少可能因近期轮次领投角色而拥有董事会席位。


              无论 Luke Anear 当前头衔是什么，对他的关键人依赖都是一条重大尽调主线。Anear 是公司的公众面孔、使命与文化叙事的设计者，也是每一份重大新闻稿引用的高管，包括最近的 2026 年 Twine
              收购。Kelly Vohs 的 CEO 任命被明确表述为让 Anear「专注于进一步发展长期愿景」——这说明 Anear
              的战略权重仍居核心。任何继任场景、角色厘清或领导层过渡，都应在依赖本章领导层图景作为事实基础前深入核查。
