        - 累计融资约 $13.1M（Series A，2022）；估计收入约 $4.8M；约 40 名员工
        - SMB 至中端市场；制造、食品、建筑
        - 移动优先 UX；AI 生成表单；快速部署；Professional €16/user/mo
        - 规模小得多；无培训 / IoT / 市场平台；员工数在下降
      - - Fluix
