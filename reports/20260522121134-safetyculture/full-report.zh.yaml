  - id: TM004
    title: 增长驱动因素与约束表
    layout: standard
    notes: 驱动因素和约束来自分析师报告、EHS 从业者调研和买方行为研究。时间判断以 2026 年为参照。尽调问题对应 SafetyCulture 的 GTM 和定价策略仍需回答的开放问题。
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 SafetyCulture 的影响
      - 尽调问题
    rows:
      - - OSHA 电子记录保存强制要求（美国）
        - 驱动
        - 已生效 / 近期
        - 迫使中端制造商和承包商迁移到数字 EHS 平台；合规紧迫性上升
        - 确认 SafetyCulture 的 OSHA 审计轨迹覆盖范围，以及 ILO 45001 对齐文档
      - - APAC EHS 监管收紧（Safe Work AU、印度 OSHWC、中国 GB 标准）
        - 驱动
        - 已生效 / 2026–2028 年加速
        - SafetyCulture 在本土市场受益；APAC 是合规软件增长最快的区域
        - 评估 SafetyCulture 的 APAC 监管覆盖深度和本地化投入路线图
      - - AI 驱动的一线风险识别与预测性安全
        - 驱动
        - 正在出现 / 近期
        - 90% 的 EHS 负责人计划投入 AI；AI 原生平台形成差异化；Twine 收购让 SafetyCulture 站到有利位置
        - 核实 AI 功能路线图，以及智能体能力已可生产使用还是仍停留在愿景
      - - 数字化转型替代纸质 / 表格 EHS 工作流
        - 驱动
        - 结构性 / 持续
        - 转化空间很大——纸质工作流仍主导 SMB；SafetyCulture 的快速部署模式契合这一需求
        - 量化 2.7B 无桌面员工可触达基数中的 SAR（软件附加率）
      - - CSRD / ESG 可持续发展报告强制要求（欧盟和跨国企业）
        - 驱动
        - 大型实体已生效；2026–2028 年延伸至中端市场
        - 催生新的买方层级（可持续发展 / ESG 负责人）；可能把 SafetyCulture 推向相邻 ESG 报告工作流
        - 确认 SafetyCulture 的 ESG 报告路线图，以及其是否纳入 CSRD 对齐范围
      - - SMB 支付意愿上限
        - 约束
        - 结构性 / 持续
        - SMB 中仅约 15% 采用了 EHS 软件；转化需要低摩擦、低成本入口
        - 披露 SafetyCulture 的定价层级、免费增值转化率和 SMB 平均合同价值
      - - 既有 EHS 套件锁定效应（Intelex、Cority、VelocityEHS、Enablon/Wolters Kluwer）
        - 约束
        - 结构性 / 持续
        - 大型企业账户被既有厂商占住；数据集成和变革管理推高迁移成本
        - 量化 SafetyCulture 替换企业客户的胜率和平均销售周期
      - - ROI 证明难、变革管理阻力大
        - 约束
        - 结构性 / 持续
        - EHS 买方难以提前建模事故减少带来的 ROI；预算审批周期被拉长
        - 获取 SafetyCulture 客户 ROI 数据（事故减少、审计通过率、培训完成率），用于 GTM 素材
