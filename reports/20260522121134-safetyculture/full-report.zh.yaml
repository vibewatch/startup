  - id: TI003
    title: 单位经济模型表
    columns:
      - 指标
      - 数值 / 估计
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 毛利率（混合）
        - 未披露；推断混合毛利率 60–75%（因市场交易 / 保险组合，低于纯 SaaS 的 70–80%）
        - 低——仅为推断
        - 决定每 1 美元收入产生多少现金；市场交易拖累可能明显压缩利润率
        - 索取按分部毛利率拆分的 P&L：SaaS、市场交易、保险
      - - 单账户平均收入（ARPA）——隐含
        - ~$1,062/年（$90.3M ARR ÷ 85,000 个账户）；~$1,553/年（$132M ÷ 85,000 个账户）
        - 低——分子和分母都是估计值 / 公司说法
        - ARPA 低说明免费增值客户群占比重；必须摸清免费与付费账户结构
        - 单独确认付费账户数；披露每个付费客户 ARR
      - - 单账户平均用户数
        - ~23.5（2M 用户 ÷ 85,000 个账户）
        - 低——两个输入均为公司声称
        - 决定理论价格天花板；实际混合席位类型结构未知
        - 索取 Full、Lite、Free 席位分布拆分
      - - 获客成本（CAC）
        - 未披露；B2B SaaS 基准：每 $1 新增 ARR 对应 $2-3 CAC（2024-2025）
        - 不可得——仅为基准
        - 单位经济模型核心驱动；决定回本周期和销售效率
        - 索取按分板块拆分的混合 CAC（SMB 与企业），包含所有 S&M 成本
      - - CAC 回本周期
        - 未披露；按基准 CAC 和隐含毛利率估计为 2.7–4.0 年
        - 不可得——由未验证输入推导
        - 回本周期长会提高资本强度；周期更短说明 GTM 效率更好
        - 索取按队列划分的实际 CAC 回本周期；与 12–18 个月行业基准比较
      - - 净收入留存率（NRR）
        - 未披露；平台多模块设计在结构上支持 NRR >100%
        - 不可得——仅为推断
        - NRR >100% 让收入可在不获取新增客户的情况下增长；是 SaaS 质量关键指标
        - 索取按队列划分的 NRR；确认扩张收入能否抵消流失
      - - 总流失率
        - 未披露；SMB 权重较高的客户账本流失率可能高于企业端
        - 不可得
        - 总流失率高会要求持续大量获取新增客户，才能维持 ARR 轨迹
        - 索取按客户分板块（SMB / 中端市场 / 企业）拆分的总流失和净流失
      - - LTV:CAC 比率
        - 未披露；按 3:1 行业下限（SaaS 基准）隐含每账户 LTV ~$3–9K
        - 不可得——仅为基准
        - 低于 3:1 表明增长效率不足；高于 5:1 表明单位经济模型强
        - 提供按队列划分的 LTV:CAC；确认多年期合同收入确认处理
    notes: 没有公开可得的 SafetyCulture 专属单位经济模型数据。所有标注为“不可得”或“仅为推断”的数值都代表结构性推断和行业基准，不是公司报告数据。隐含 ARPA 计算使用未经验证的分母（ARR 估计和客户数均未审计）。
