      - number: '1.6'
        title: 反向信号、安全态势与尽调风险
        blocks:
          - type: paragraph
            body: >
              公开记录中存在几项反向和警示信号，必须作为后续章节的尽调背景保留。第一项也是最重要的一项，是第 2 节讨论的领导层不确定性：November 2024 宣布、January 2025 生效的 CEO
              交接，截至运行日未体现在公司自己的团队页面，也未体现在公司 April 2026 新闻材料中；运营权归属出现重大不一致。这不只是标签问题，而是带来董事会治理、继任连续性，以及 Vohs
              任命是否撤回或公开材料只是过期的疑问。


              第二，UpGuard 的独立安全态势评估（更新于 22 May 2026，即运行日）给 SafetyCulture 打出 882/950。虽然分数相对较强，但 UpGuard 识别出具体技术缺口，包括缺少
              secure cookies、缺少 HttpOnly cookies，以及 Content Security Policy 使用 unsafe-eval——这会削弱对 XSS
              攻击的防护。对一家存储来自关键基础设施、制造、医疗和航空等全球企业客户的 5 petabytes 运营数据的公司而言，任何 Web
              安全配置错误都值得尽调追问：这些发现究竟是已知并接受的风险、已修复但外部扫描尚未反映的问题，还是确实仍未解决的漏洞。


              第三，SafetyCulture 有重大经营亏损的历史记录。2022 年，创始人 Anear 公开表示，公司将在未来五年或更久「继续亏损」。随后 2023
              年的转向叙事——公司已实现盈利并拥有「无限现金跑道」——没有外部审计，也没有因 SafetyCulture 为私营公司而在公开文件中正式记录。2024 年 AU$75 million
              新股融资，使这一盈利表述的可持续性受到质疑。第四，2023 与 2024 轮次之间 AU$200 million 的估值折价，加上 2024
              轮中可观的老股交易部分，显示至少部分早期投资人选择在可得价格上变现，而不是等待更高退出估值；这是理性行为，但也可以被解读为反向信号。
