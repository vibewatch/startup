          value: 5
          description: 最大账户，部署深、覆盖多模块；NRR 和粘性最强
        - label: 已披露具名参考客户（公开案例研究和标识）
          value: 1
          description: 在案例研究或新闻稿中有公开可核验部署证据的具名客户
