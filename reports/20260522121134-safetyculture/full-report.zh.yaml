      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 的安全态势是公司风险画像中最强的可观察属性之一。平台持有 ISO 27001:2022 认证和 SOC 2 Type II
              合规，两者都要求在较长运营周期内由独立方审计安全控制。UpGuard 截至 19 May 2026 的持续外部监测给 SafetyCulture 安全评分 884/950（A 级），称其在网站安全、邮件安全、钓鱼
              / 恶意软件和网络安全方面控制较强，只在 Content Security Policy 实施和 secure/HttpOnly cookie 实践上有小幅改进空间。截至 May 2026
              报告日期，网络安全出版物或泄露追踪器没有报告 SafetyCulture 发生数据泄露或安全事件。


              尽管基线强劲，仍有三类重要运营风险向量。第一，平台完全运行在 AWS 基础设施上，形成单一云供应商依赖。任何区域性 AWS 故障都会中断 SafetyCulture
              在全球的实时检查、传感器监测和培训交付服务。对于 SafetyCulture
              已嵌入安全关键工作流的一线行业（受限空间进入、化学品处理、航空维护），平台停机会给客户组织造成运营暴露和潜在责任暴露。SafetyCulture 没有公开披露多区域故障切换架构或 AWS SLA 条款。


              第二，Twine 收购（April 2026）以及 Luke Anear 所说“AI 时代重大软件重建”会带来平台过渡风险。将 Twine 的智能体 AI 分析引擎整合进 SafetyCulture
              现有检查和培训平台，会引入数据模型复杂度、潜在功能回归，以及 85,000+ 企业客户的变更管理负担。Fluix（2026）和 ITQlick 的独立评论指出，SafetyCulture
              现有平台已经在高级定制、多步工作流审批和报表灵活性上吃力——这些恰恰是 AI 重建必须改善的领域。平台快速演进会提高集成破裂概率，影响依赖基于 API 连接 ERP、HRMS 和车队 / 远程信息系统的企业客户。


              第三，平台有效性在行为上取决于一线员工采用。评论平台（Capterra、Software
              Advice、G2，2025-2026）持续指出，数据录入一致性和表单完成纪律取决于用户，未完成检查会制造管理者无法实时看到的合规缺口。对于受监管行业客户（食品安全、航空、建筑），系统性检查缺口可能产生监管暴露；若事故调查引用平台可靠性，也可能给
              SafetyCulture 带来索赔风险。未发现此类已确认案例，但该暴露在结构上存在。
