        - 检查 → 问题 / 行动 → 培训 → Heads Up → 资产 → 传感器 → 分析 → Marketplace；已在 5+ 个案例研究中确认
        - 正面：提高每客户 ARR、切换成本和 NRR；跨模块工作流强化平台黏性
