    title: 工作流与使用场景表
    layout: wide
    notes: >-
      工作流描述来自 SafetyCulture 产品页、帮助文档、第三方评论和用户证言。可衡量收益来自公司主张；在缺少一手数据时，也引用用户证言。限制项来自独立评论，以及 G2、Capterra、Fluix 和 Connecteam
      等评论平台反复出现的模式。
    columns:
      - 用户待完成任务
      - 不使用 SafetyCulture（当前流程）
      - SafetyCulture 方案
      - 可衡量 / 声称收益
      - 已知限制
    rows:
      - - 执行并记录安全检查
        - 纸质清单；手工汇总 PDF/Excel；邮件分享；记录丢失或延迟
        - 移动检查清单应用；支持离线；自动生成 PDF 报告；模板库可快速调用
        - 公司称每月 2M+ 次检查；75,000 家企业；“几分钟学会”的部署
        - 任务只能单向流转；复杂审批链需要绕行方案
      - - 根据检查发现分派并跟踪整改动作
        - 邮件链或口头指令；没有系统化跟踪；逾期动作容易丢失
        - Issues/Actions 模块；可分派任务，带截止日期、优先级、媒体附件和状态跟踪
        - 问题全生命周期形成数字审计轨迹；所有利益相关方可见状态
        - 原生不支持多步升级流程；审批路由深度有限
      - - 向一线员工交付入职或合规培训
        - 面对面简报；纸质讲义；桌面 LMS 移动端不可用；存在语言障碍
        - 整合后的培训模块（SC Training 退役后）；AI 课程构建器；1,000+ 门课程；移动端离线；自动语言翻译
        - 移动微学习；结业证书；游戏化提升参与度
        - SC Training 数据可携性缺口：迁移用户可能丢失历史完成记录
      - - 持续监测冷链 / 环境条件
        - 手工温度日志（纸质）；只做抽查；超标发现延迟
        - IoT 传感器 + 网关；自动阈值告警；连续数据日志；HACCP 审计轨迹
        - 取消手工检查；温度超标实时告警；导出材料可直接用于监管
        - 依赖 Dragino 硬件；网关视距范围约 ~100m；网关需要供电
      - - 向无法使用邮件的站点员工传达紧急安全更新
        - 实体公告板；口头简报；短信；没有确认回执跟踪
        - Heads Up 模块；广播消息；确认回执跟踪；需签名的链接文件
        - 有文档化确认回执审计轨迹；可向非平台接收方外部分享
        - 分析深度未验证；仅限广播，不支持与任务相连的双向讨论
      - - 将检查数据导出到商业智能仪表盘
        - 手工导出；表格处理；没有自动化管道；合规报告滞后
        - SafetyCulture Exporter（开源 Go CLI/GUI）连接 MSSQL/PowerBI；REST API + webhooks
        - 自动、定时的数据管道接入 BI 工具；API 驱动实时集成
        - Exporter 需要 Premium 或 Enterprise 套餐；高容量管道受 API 速率限制（20–800 req/60s）
