  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: SafetyCulture 的可触达市场从窄口径软件细分市场下限，一直铺到按一线员工数量估算的宽口径上限。SAM 仅作示意——由重叠的分析师估计拼出；SOM 无法用公开数据验证。所有数值都是粗略估算，需要独立验证。
    data:
      items:
        - label: TAM — 最宽泛的一线赋能口径（~$36B，2026）
          detail: 全球 EHS、检查、培训、IoT 和所有互联员工平台的汇总上限。包含超出 SafetyCulture 当前产品范围的细分市场。来源：Fortune Business Insights 一线员工赋能汇总口径。
          tone: neutral
        - label: SAM — 核心 EHS + 检查 + 培训 + IoT（示意 ~$10–15B，2026）
          detail: >-
            EHS
            软件（$8.9B，TBRC）、检查管理（$8.7B，MarketsandMarkets）和一线培训（$2.9B，ResearchAndMarkets）的重叠部分，并按类别重叠做调整。仅作示意；重叠调整无法独立验证。
          tone: neutral
        - label: SOM — SafetyCulture 估计可触达细分市场（估计 ~$1–2B，未公开验证）
          detail: 基于 85,000 个客户、当前定价、SMB/中端市场重心和地理覆盖的粗略估计。没有独立估计；SafetyCulture 未披露单客户经济性。
          tone: warning
        - label: 证据缺口 — SAM/SOM 无法通过公开来源验证
          detail: SafetyCulture 未发布自己的 SAM/SOM 推导。金字塔仅指示方向。正式尽调应以管理层确认的单客户经济性替换这些层。
          tone: negative
