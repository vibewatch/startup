        - 负面：SMB logo 流失偏高压低整体总留存；可能拖累 NRR
        - 要求提供 SMB 总 logo 流失率，并询问是否计划调整分层定价
      - - SC Training 扰动尾部风险
        - EdApp 停用影响 70,000+ 家组织；数据可携性不完整；部分客户可能迁移到竞争对手 LMS
        - 负面：培训模块收入和相关交叉销售机会可能流失；监管行业声誉风险上升
        - 跟踪停用后 12 个月 SC Training 队列 NRR；量化从流失 EdApp 客户中拿到订单的竞争对手
      - - 英国地域集中
        - 85,000 家企业中 25,000+ 家（29%）在英国；EMEA 团队位于 Manchester
        - 中：英国宏观或监管冲击会不成比例地影响 EMEA 收入；脱欧后合规义务增加复杂度
        - 要求地域收入拆分；询问欧盟特定 GDPR 合规认证
      - - 渠道风险（仅直营模式）
        - 未确认大型转售商或分销渠道；通过直销企业销售和自助 PLG 增长
