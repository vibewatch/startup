  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 提供面向一线员工的统一运营平台，由八个集成能力模块支撑，覆盖完整工作场所运营流程——从初始危险识别和巡检，到整改动作、培训、资产监管和持续改进分析。

              核心模块 Inspections（iAuditor）让团队创建、执行并分享数字巡检、安全审计、清单和合规评估。团队可以从 100,000+ 个公共模板库中构建模板，也可以自定义编写；巡检通过 iOS 或
              Android 移动应用完成（支持离线），也可通过网页浏览器完成；完成后的巡检生成结构化、可分享的 PDF 报告。条件逻辑让模板可根据回答分支，无需代码即可搭建较复杂的自动化工作流。公司报告称，截至 2026
              年，平台每月完成 2 million+ 次巡检。

              Issues and Actions 管理模块允许把任何巡检发现或临时观察转化为可分配的整改动作，附带截止日期、优先级、附件和状态跟踪。Issue
              也可以独立于巡检提出，使危险报告不必依赖结构化审计流程。多个评测平台指出，复杂多步骤审批链没有原生支持；这是最常被提及的工作流限制。

              截至 2026 年 3 月 31 日，培训通过 SC Training（原 EdApp，2020 年收购，2024 年更名）交付。SafetyCulture 在该日停用独立 SC Training
              应用，并把培训功能整合进核心 SafetyCulture 平台。整合后的培训模块保留移动微学习编写（可由 AI 基于文档、PDF 或提示辅助生成）、游戏化（测验、徽章、排行榜）、1,000+
              门可编辑且由专家认证的课程库、离线交付和学习者分析。停用影响此前通过 SC Training 访问平台的估计 70,000+ 个组织和 1M+ 用户——未在 2026 年 4 月 20
              日前迁移的用户，永久失去完成记录访问权。

              Asset Management
              提供集中式实物资产台账，关联巡检计划、维护记录、传感器数据和合规证书。资产可分配到地点、团队或个人；支持维护工作流和合规文件上传。该模块把实物资产监管接入数字运营工作流，但深度轻于 MaintainX 等专用
              CMMS 工具。

              Sensors（IoT monitoring）通过网关桥接架构，把 Dragino 制造的 LoRaWAN 硬件传感器连接到云平台。标准传感器（Dragino LHT65S）监测温度和湿度，工作范围为 -40°C
              至 80°C，外接探头可扩展至 125°C。支持的传感器类别包括温度 / 湿度、空气质量（CO₂、TVOCs、颗粒物）、声音 / 噪声、压力和开 / 关检测。设置被描述为即插即用（网关预配置；手动录入传感器
              ID）。基于阈值的警报会触发通知，并可自动生成巡检任务。核心温度传感器依赖单一 Dragino 型号，是一项集中度风险。

              Analytics 汇总巡检结果、Issue 解决率、培训完成情况、传感器读数和 Heads Up 参与度，形成可配置仪表盘和热力图。AI 辅助分析（2025–26
              年推出）允许管理者用自然语言提问（例如“哪些站点质量评分最低？”），并从审计数据中得到综合答案。平台支持定期和临时报告导出；开源 SafetyCulture Exporter 工具为 Premium 和
              Enterprise 客户提供批量数据导出至 MSSQL、PowerBI 和其他 BI 工具。

              Heads Up 是面向一线团队的广播通信模块，适用于缺乏可靠电子邮件访问的场景。管理者可创建多媒体消息（文本、图片、视频），并跟踪确认回执；支持关联文档上的必需电子签名、线程评论、emoji
              反应和外部分享。分析功能衡量触达率和确认率。该模块用有记录、可审计的沟通轨迹，替代非正式公告板或口头简报流程。

              Marketplace 通过集成电商提供来自 200+ 品牌的 100,000+ 个工作场所安全和 PPE
              产品。该服务在澳大利亚和美国可用。客户可以直接购买巡检中发现需要的物品，降低采购摩擦。Marketplace 在 FY2025 产生约 AU$68.2M GMV，此类销售毛利率约 48%，约贡献总收入
              12%——按百分比看比纯 SaaS 毛利更高，但在当前规模下仍次于订阅收入。

              Lone Worker Safety（SHEQSY）为单独或远程作业人员提供胁迫报警、定时签到、工作完成监测和实时位置。SafetyCulture 于 2022 年 4 月收购
              SHEQSY，并正逐步把它整合进核心平台。该收购早于运行日；部分 AI 聚合来源中所谓单独的“2026 年 5 月 SHEQSY 收购”并不正确——SHEQSY 是 2022 年被收购的。
