            title: 20 年运营数据集构成持久 AI 护城河
            body: >-
              SafetyCulture 在 20 年里，跨 180+ 个国家的 85,000 家企业积累了超过 5 petabytes 的一线职场数据和数十亿张图片，拥有全球规模最大的专有一线运营数据集之一。这让公司在 AI
              驱动洞察、基准比较和智能体能力上处于独特位置；竞争对手若没有多年部署，很难复制。
            calloutType: strength
            claimRefs:
              - CO041
              - CO042
              - CO052
          - type: callout
            title: 盈利说法未经验证，并与后续融资相矛盾
            body: >-
              March 2023，CEO Anear 表示 SafetyCulture 已从增长模式转向盈利，并拥有无限现金跑道。但仅 18 个月后，公司又融资 AU$75M
              新股。这一时间序列需要直接尽调：当时盈利说法是否准确，AI 平台建设是否逆转了盈利，或该轮融资只是机会型而非必要之举。
