        - 当前低 — 无活跃案件或执法行动
        - 低 — 当前无暴露；AI 辅助安全决策在受监管行业中带来前瞻性产品责任风险
        - 隐私政策附录列出 ISO 27001、SOC 2 Type II、CCPA 合规
        - 低 — 受监管行业的 AI 辅助安全建议带来前瞻性暴露
