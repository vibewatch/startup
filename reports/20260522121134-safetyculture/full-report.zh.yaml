      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 运行云原生 SaaS 架构，托管在 Amazon Web Services（AWS）上。平台以移动优先应用形式交付，包含原生 iOS 和 Android
              应用以及功能完整的网页应用；iOS 应用版本号惯例（例如 2026 年 5 月的版本 26.18.02）显示其按 year.week.patch 节奏发布，符合高频持续交付模式。2026 年 5 月，一个 iOS
              缺陷（影响未指明的部分用户）在状态页得到确认，并在版本 26.18.02 提供修复——从发现到解决约四天。

              面向开发者的界面是 REST API（截至 2026 年公开没有 GraphQL）。认证通过 Bearer token 完成（在账户设置中生成个人或服务账户 token）。API
              暴露巡检、模板、用户、动作、站点和排程端点。速率限制按端点而定，约为每 60 秒 20 到 800 次请求（例如 POST /users/search 允许 200 req/60s）。Webhooks
              为巡检完成、状态变化和其他平台事件提供事件驱动集成触发器。SafetyCulture Developer Portal（developer.safetyculture.com）提供实时 API
              参考文档、认证指南和代码示例。开源开发者工具包括：Python SDK（github.com/SafetyCulture，23 stars、10 forks）、基于 Go
              的开源数据导出器（SafetyCulture/safetyculture-exporter，Apache-2.0，19 GitHub stars，CLI 和桌面 GUI），以及 gRPC-Web
              浏览器扩展（440 GitHub stars、70 forks）——后者说明除公开 REST 界面外，内部也使用 gRPC。

              Integrations Marketplace（integrations.safetyculture.com）列出 100+ 个预构建连接器，包括 Salesforce、Workday、BambooHR、ADP
              Workforce Now、Zapier、SharePoint 和第三方 BI 工具。平台提供无代码集成构建器，用于自定义工作流连接。合作伙伴计划允许第三方开发者在 Marketplace
              上架应用。SourceForge 集成目录独立确认了可用连接器的广度。

              IoT 传感器架构采用轮辐式网关模型：物理传感器（Dragino LHT65S 和兼容型号）通过 LoRaWAN 协议与网关设备通信；网关再通过互联网（WiFi / 4G）把读数转发到 SafetyCulture
              云平台。传感器数据与巡检和 Issues 显示在同一仪表盘中，从而支持阈值触发的整改动作工作流。硬件组件来自 Dragino Technology，一家位于深圳的第三方 IoT 硬件供应商——这是
              SafetyCulture 无法控制供应或质量的关键依赖。

              静态数据采用 AES-256 加密，传输中使用 TLS 1.2 或更高版本，AWS 基础设施作为托管层。客户数据访问仅限必要人员（最小权限原则）。内部系统访问要求多因素认证和
              VPN。集中日志和威胁检测已投入运行；事件响应和漏洞管理项目被描述为持续性，而非一次性。

              AI 能力覆盖模板生成、基于上传文档的课程创建、审计数据自然语言查询和自动报告生成。2026 年 4 月收购 Twine 团队（Brian Swift 回归担任 VP AI，向 CEO Luke Anear
              汇报），体现其向“agentic-first” AI 的战略推进——也就是可在平台工作流中推理并行动的自主 AI 智能体。截至运行日，公开可验证的 AI 功能仍限于模板 / 课程生成和 NLQ
              式分析摘要；智能体能力更多是方向性表述，而非已交付功能。
