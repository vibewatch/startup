      - number: '5.3'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 是云交付的 SaaS
              产品，公开材料没有记载任何本地部署选项。公司有意把部署摩擦压低——产品定位强调“几分钟上手”，靠模板驱动快速上线。传感器部署被包装成即插即用：预配置网关，再手动录入传感器 ID。

              官方状态页和独立监测服务显示，可靠性一直较强：2025 年末到 2026 年初的正常运行时间在 99.68% 到 100% 之间，第三方监测给出的实际平均大约为 99.7–100%。最近一次被跟踪的事故（May
              2026）是 iOS 应用缺陷，在版本 26.18.02 中修复，用时约 4 天。此前 90 天期间的事故解决时间中位数约为 3 小时 22 分钟。公司未公开合同 SLA 百分比；企业买方应向销售团队索取。

              集成深度是产品强项：集成市场提供 100+ 预构建连接器，REST API 配有 webhooks，还有无代码集成构建器，以及面向 BI 平台的开源导出工具。SafetyCulture
              Exporter（Go、开源、Apache-2.0）支持将检查、模板、排期、行动批量导出到 MSSQL、PowerBI 等目标，所有 Premium 和 Enterprise 客户均可使用。合作伙伴集成列在
              SafetyCulture Integrations Marketplace，也被 SourceForge 独立收录。API 速率限制区间（20–800
              req/60s）足以覆盖多数运营集成，但用于高吞吐数据管道时仍需单独评估。

              第三方评论里的客户支持评分较为分化：Software Advice 在 238 条评论中给出 4.6/5 的总体评分，但个别评论——尤其来自企业部署——提到复杂技术问题解决慢、技术定制支持深度有限。Fluix 的
              2026 竞品评测指出，任务工作流大多是单向的，高级审批链需要大量变通方案。

              路线图透明度有限。SafetyCulture 不公开产品路线图，但 April 2026 收购 Twine 人才团队，以及 CEO Luke Anear 对智能体 AI
              的公开聚焦，指向公司的战略方向。SafetyCulture “Next” 产品更新视频（YouTube）释放了即将发布的信号，但内容更偏营销，不提供工程细节。SC Training 退役（March
              2026）是近期最重要的路线图执行事件——它把培训界面并入核心平台，却让受影响客户付出了数据可移植性的代价。
