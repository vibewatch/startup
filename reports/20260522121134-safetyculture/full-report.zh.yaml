      - number: '8.3'
        title: 情景建模与二级市场交叉校验
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，三个情景框住 SafetyCulture 的估值区间。乐观情景（AU$200M+ 前瞻 ARR × 12-15x = AU$2.4-3.0B）需要已核验的增长加速和 AI
              变现证据。基准情景（FY24 收入 AU$160M × 8-10x ARR = AU$1.28-1.6B）最贴合现有公开数据和当前私有市场可比交易。悲观情景（Tracxn 隐含 ARR AU$119M ×
              4-6x ARR = AU$0.48-0.71B）只有在 2026 年 5 月重组反映需求端压力、而非效率优化时才会落地。


              二级市场数据为这些情景提供独立交叉校验。PremierAlts 报告 SafetyCulture 交易价约 AU$1.72B（较新股价折价 31%）。UpsideList 记载价格较上一轮新股约低
              35%。William Blair 2026 年分析显示，尚未盈利、估值 AU$1-5B 的独角兽在二级市场通常折价 25-35%。Flux Finance 在缺少审计确认时给出的公允价值为
              AU$1.6-2.0B。这些数据点共同指向 AU$1.6-1.8B 的当前市场隐含价值——既符合基准情景可比分析，也比 AU$2.5B 新股价低 28-36%。


              领导层不稳定进一步放大情景风险：14 个月内两次 CEO 变动（Luke Anear 交棒 Kelly Vohs，2025 年 1 月；Vohs 离任、Anear 2026 年 3 月临时回归），同时裁员约
              10%（约 170 个岗位），更像投资人施压下的动态，而不是经营信心。公司若接近 IPO 准备状态，永久 CEO 继任是任何公开市场估值流程的前提，也会拉长二级市场投资人的回报时间线。
