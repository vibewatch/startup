      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 的运营和商业模式建立在若干外部依赖之上；一旦中断，可能实质约束增长、客户留存或产品交付。最尖锐的集中度在云基础设施：AWS 托管整个平台，这一点由 SafetyCulture 的
              AWS Marketplace 上架页面证实。公司未公开提供多云或本地部署选项。迁离 AWS 需要大量重新工程化，不是现实的短期缓解措施。


              保险业务（SafetyCulture Care）依赖 QBE 和 Allianz 的承保合作——两家都是大型但独立管理的保险公司。任一承保关系重新定价、退出或受到监管限制，都会削弱 SafetyCulture
              Care 提供嵌入式保险的能力，直接破坏管理层公开强调的多元化逻辑。这些承保安排的条款和除外责任没有公开披露。


              SafetyCulture 的平台集成能力——支持 HR 系统（Workday、BambooHR、SAP SuccessFactors、Oracle HCM）、ERP 系统和云分析——取决于这些平台的 API
              稳定性和合作条款。任何主要集成伙伴的政策变化都可能打断现有客户部署，并在企业客户中制造流失。Verdantix Green Quadrant 2025 EHS 软件评测将 SafetyCulture
              纳入被评估厂商，但认为企业级同行（Cority、Intelex、VelocityEHS、Sphera、Enablon）在复杂、多地点监管合规项目上更强——这说明 SafetyCulture
              与企业系统的集成深度既是竞争差异点，也会在伙伴偏向深度集成竞品时承压。


              Marketplace 业务（120+ 个品牌的 75,000+ 个商品）引入供应商依赖和营运资本风险。SafetyCulture 不是制造商，而是市场平台运营者；供应商集中、价格变化或品类退出都可能压低
              Marketplace 收入。公开资料没有供应商集中度数据。SaaS、保险、Marketplace 三条线并行，使运营复杂度高于 SafetyCulture 这个 ARR 规模的常见水平；在 AI
              重建同步进行时，这可能挤压管理层带宽。
