  - id: FV001
    title: 建议逻辑
    type: flow
    insight: >
      AU$165M 这一轮的结构揭示了一个结构性含混信号：其中 AU$90M 老股部分按 AU$200M 下轮价格成交，说明早期投资人不愿按 2023 年 AU$2.7B
      标记继续持有，造成价格发现断层，并直接支撑「有条件谨慎」建议。AU$2.5B 的新股估值是谈判价格，不是市场出清价格。
    claimRefs:
      - CV001
      - CV002
      - CV003
    sourceRefs:
      - SV022
      - SV023
      - SV024
    data:
      nodes:
        - id: A
          label: AU$165M 总轮次（2024 年 9 月）
          description: AirTree 领投轮次，以 AU$2.5B 名义估值完成 —— 较 2023 年 AU$2.7B 峰值低 AU$200M
        - id: B
          label: AU$75M 新股资本（45%）
          description: 为运营、AI 战略（Twine）以及北美和英国地域扩张提供资金
        - id: C
          label: AU$90M 老股（55%）
          description: 为早期投资人和员工提供低于 AU$2.7B 先前标记的流动性 —— 释放退出可选性受限信号
        - id: D
          label: 二级市场信号
          description: PremierAlts/UpsideList：市场出清价值 AU$1.63-1.72B（较新股低 31-35%）—— 与折价老股需求 AU$90M 相符
        - id: E
          label: 有条件谨慎建议
          description: AU$2.5B 新股估值缺少可比公司支撑（EHS SaaS 中位数 6-10x）；入场需要 AU$1.75-2.0B，同时取得经审计财务、确认 ARR 和永久 CEO
  - id: FV002
    title: 估值敏感性
    type: bar
    insight: >
      SafetyCulture 隐含 ARR 倍数随收入基准不同，从 12.5x（乐观）到 21x（悲观）不等，全部高于上市 SaaS 6.4x 中位数和 EHS 类别龙头 8x 基准。若以 AU$1.875B
      入场（建议区间中点），倍数降至 12x，仍有溢价，但考虑 TAM 和留存可以辩护。
    claimRefs:
      - CV004
      - CV010
      - CV011
      - CV027
      - CV028
      - CV029
    sourceRefs:
      - SV001
      - SV005
      - SV006
      - SV016
    data:
      items:
        - label: SafetyCulture（AU$119M ARR，悲观）
          value: 21
          unit: x ARR
        - label: SafetyCulture（AU$160M ARR，基准）
          value: 15.6
          unit: x ARR
        - label: SafetyCulture（AU$200M ARR，乐观）
          value: 12.5
          unit: x ARR
        - label: SafetyCulture（AU$160M ARR，入场中点）
          value: 11.7
          unit: x ARR
        - label: EHS SaaS 类别龙头（Aventis）
          value: 8
          unit: x ARR
        - label: 上市 SaaS 中位数 Q1 2026
          value: 6.4
          unit: x ARR
        - label: 私营 SaaS 中位数（SEG 2025）
          value: 5.5
          unit: x ARR
