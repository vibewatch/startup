        Revenue stream identification is based on official SafetyCulture product pages, the Sep 2024 press release, and
        third-party coverage. Contribution of each stream to total revenue is not publicly disclosed; relative ordering
        is estimated.
    rows:
      - - SaaS 订阅（核心）
        - SafetyCulture 平台按席位 / 月授权（Free/Premium/Enterprise 层级）
        - 每用户每月（USD）
        - 主要收入驱动；$0 Free、$5 Lite、$24 Full，Enterprise 定制；估计 ARR 约 $90-130M
        - 高质量——经常性、合同化，具备多年期潜力；免费增值客户群摊薄质量
        - 确认 ARR、分板块 ARPU、流失率、NRR 和多年期合同占比
      - - 市场采购
        - 对通过平台订购的 75,000+ 件 PPE 和安全用品收取佣金 / 加价
        - GMV 抽佣率（交易额 %）
        - 美国和澳大利亚已上线；GMV 和抽佣率未披露；估计只占总收入少数
        - 毛利率低于 SaaS；若检查触发自动化采购，增长潜力更高
        - 披露 GMV、抽佣率、市场交易毛利率
      - - 嵌入式保险
        - 对通过平台撮合的商业保险保单收取佣金 / 抽成（QBE/Allianz 承保）
