        - 已上线产品；财务贡献未披露；一旦规模化，预期毛利率较高
        - 高毛利潜力；当前可见规模有限；依赖保险合作伙伴条款
        - 披露通过平台撮合的 GWP、佣金率、保险收入流毛利率
      - - 培训（SC Training / EdApp）
        - 包含在 Premium/Enterprise SaaS 订阅中；未来可能单独授权
        - 按席位（打包）；独立定价不清楚
        - 已集成进 SaaS；移动优先微学习和 40+ 种语言形成差异化
        - 与 SaaS 打包；独立贡献难以拆分
        - 澄清 SC Training 是否有独立授权收入，还是完全打包进 SaaS
      - - 未来 / 未披露收入流
        - 智能体 AI 功能、传感器 / IoT 数据洞察、API / 集成收入
        - 未知；无公开定价
        - Twine 收购后（2026 年 4 月）；智能体平台被定位为下一层收入
        - 截至运行日仍属推测；没有证据显示已有实质收入贡献
        - 确认 AI 功能是否单独变现，还是打包进 Enterprise 层级
    notes: >-
      收入流排序反映估计重要性，不是已确认排名。公司未披露经过审计的跨收入流拆分。第三方估计从 $90.3M ARR（GetLatka）到 $201.2M 总收入（Growjo）不等。AFR 报道 FY2023 总收入为
      $132M。市场交易和保险贡献未量化。
