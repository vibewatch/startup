      - number: '4.2'
        title: 公开牵引指标与收入估计
        blocks:
          - type: paragraph
            body: >
              由于 SafetyCulture 不发布经审计财务数据，投资者和分析师只能依靠公司声称的运营指标、第三方数据库估计和投资人评论来三角测算收入规模。来源最扎实的公开数字来自 2024 年 9
              月融资交割：85,000 个企业客户、接近 2 million 名用户、覆盖 180+ 个国家，并在六个办公室拥有 800+
              名员工。公司还称，注册增长创下纪录，平均客户规模在此前两年翻倍——这与其有意向更大型企业账户上移相一致。


              第三方收入估计差异很大，必须视为未经验证的代理指标。GetLatka——一家 SaaS 指标数据库，常从创始人访谈获取数字——估计截至 2025 年 11 月 ARR 为 $90.3
              million，同日列示员工数 838 人。Growjo 和 CompWorth 曾引用约 $201.2 million 的总收入估计，可能反映包括 Marketplace
              和保险交易在内的更宽收入基础，或不同时间段。Australian Financial Review——澳大利亚一线商业媒体——据 SmartCompany 对 2023 年 8 月融资轮的报道，称
              SafetyCulture 在截至 2023 年 6 月的财年实现 $132 million 收入，同比增长 32%。这项 AFR 引用数字是 SafetyCulture
              收入可获得的最高可信度外部参考，尽管仍未经审计。将 32% 增速外推至 FY2024，意味着约 $174 million；从这一基数出发，在任何合理增长路径下，FY2025 收入可能落在 $130–200
              million USD 区间，取决于增长降速和外汇影响。


              另一个收入倍数代理也可用：Tracxn 发布了由 2024 年 AU$2.5 billion 估值隐含的大约 21x 收入倍数；按这一倍数，年化收入约为 $119 million。这四个数据点——$90M
              ARR、$119M（倍数隐含）、$132M（AFR FY2023）、$201M（Growjo 估计）——之间的区间反映的是真实不确定性，而不是分析不一致，因为它们衡量的对象不同（ARR vs
              总收入、不同财年、是否纳入非经常性收入流）。最可辩护的立场是，截至 FY2024–2025，将 SafetyCulture 收入视为“$100–180M USD 区间”，并标记为中等置信度估计，等待经审计披露。


              培训量和平台使用指标提供辅助牵引力代理：截至 2023 年平台发布评论，平台已完成 700 million+ 次巡检；SC Training（原
              EdApp）交付了数百万节课程——这些数字反映平台参与度，但若不知道付费模块转化率，不能直接换算为收入。按 Revelio Labs 劳动力分析，2025 年员工数为 929 人（较 2024 年 989 人下降
              6.3%）；官方新闻稿称，2024 年 9 月融资交割前六个月新增 100 个岗位。融资后员工轨迹（从 989 降至 929，随后 2026 年 5 月重组）与成本优化压力相一致。
