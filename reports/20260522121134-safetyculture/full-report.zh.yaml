      - number: '1.5'
        title: 里程碑、收购与产品演进
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 的公司历史跨越 20 多年，轨迹清晰：从单一用途的数字清单，走向多产品职场运营平台。公司 2004 年创立于 Queensland
              最北部，早于现代智能手机时代；智能手机普及后，iAuditor 被重建为移动应用。November 2013，Blackbird Ventures 领投 $1.2 million 种子轮，Atlassian
              创始人 Mike Cannon-Brookes 和 Scott Farquhar、美国投资人 Bill Tai 跟投，公司获得首笔机构资金；对澳大利亚种子期公司而言，这是一个值得注意的投资人谱系。此后多轮融资来自
              Blackbird、Index Ventures（Series B 领投，October 2016）、Tiger Global（Series C 共同领投，May 2018）、Insight
              Partners（October 2020 和 May 2021）以及 Marbruck Investments（August 2023），呈现从澳大利亚种子轮到全球成长期投资人组合的清晰机构化路径。


              SafetyCulture 第一次也是最具转型意义的收购，是 2020 年收购 Sydney 移动微学习平台 EdApp。EdApp 估值约 $40 million；SafetyCulture 在此前两年已投入
              $9 million，随后以约 $29 million 取得控股权。战略逻辑是把培训嵌入安全与巡检工作流；平台更深整合后，EdApp 更名为 SC Training。截至 2023 平台发布，SC
              Training 每天在 90+ 个国家交付约 85,000 节课程。


              October 2023，SafetyCulture 在首届「SafetyCulture Next」活动上发布平台，这是公司成立以来最重要的产品扩张：新增资产管理、IoT/传感器监控、市场、视频沟通（Heads
              Up），以及 AI 辅助的巡检模板生成和培训课程创建。April 2026，SafetyCulture 宣布收购 Sydney AI 创业公司 Twine，主要是带回副总裁 Brian Swift（前
              SafetyCulture 产品副总裁、Twine 联合创始人），并加速公司的「智能体平台」野心。Twine 收购清晰表明，公司押注 AI 原生运营工具将成为一线工作流软件的下一场竞争主战场。
