      - number: '5.5'
        title: 产品与技术风险评估
        blocks:
          - type: paragraph
            body: >-
              六类产品与技术风险值得尽调关注，以下按估计重要性排序。

              风险 1 —— SC Training / EdApp 退役与数据可移植性失败（高严重性）。SC Training 平台在 31 March 2026 突然退役——影响 70,000+ 组织和 1M+
              用户——是近期最重大的平台执行事件。完成记录、学习进度和历史表现数据无法完整迁移：只有进入付费升级路径的用户才能干净迁移数据；其他用户在 20 April 2026
              之后面临永久丢失。这会给任何遭遇数据损失的组织带来客户信任和留存风险，也释放出一种产品整合策略信号：平台简洁性优先于向后兼容。培训能力如今已进入 SafetyCulture
              核心平台，但迁移摩擦在客户关系质量上留下缺口。

              风险 2 —— AI 叙事与已上线证据之间的落差（中高严重性）。SafetyCulture 的营销把平台定位为“AI 驱动”和“智能体优先”的产品。截至本次报告日期，公开可验证的 AI 功能仅限于：从文档生成
              AI 辅助模板、从 PDF 生成 AI 课程，以及 NLQ 式分析查询（汇总审计发现）。April 2026 收购 Twine（AI 团队，而非产品）是人才投入，不是已上线能力。CEO Anear
              的表述——“从我醒来到睡觉，我都在研究我们如何转向智能体优先体验”——把智能体 AI 定位为愿景。若买方基于尚未交付的 AI 能力采购，营销主张与可验证功能之间的落差就是尽调风险。

              风险 3 —— 硬件（IoT）供应依赖 Dragino Technology（中严重性）。核心 IoT 温度传感器（Dragino LHT65S、LoRaWAN、深圳制造）构成 SafetyCulture
              供应链控制之外的单一供应商硬件依赖。传感器供应中断、质量失效或涨价都会影响 IoT 监控产品线。SafetyCulture 自有文档承认，额外传感器必须通过客户成功经理申请——这意味着自助采购传感器的灵活性有限。

              风险 4 —— 平台复杂度与工作流定制上限（中严重性）。SafetyCulture 是一个八模块平台，主要靠收购拼出（EdApp 2020、SHEQSY 2022、Twine 团队
              2026），因此带有集成复杂度风险。Fluix 的 2026 评测（直接竞品，立场偏反向）记录称，任务工作流是单向的，多步审批链没有原生支持，高级报表布局需要大量变通或外部集成。G2 和 Capterra
              评论也相互印证：分析仪表盘定制在更高价格层级之外较受限；编辑已发布的 TSA 模板需要重建。这些限制说明跨模块工作流深度上存在工程积压。

              风险 5 —— 集成依赖（中低严重性）。SafetyCulture 在企业客户中的价值主张越来越依赖与 HR 系统（Workday、ADP、BambooHR）、CRM（Salesforce）和 BI
              工具的集成质量。第三方市场集成由集成伙伴运营，而不是 SafetyCulture 工程团队，因此质量和可靠性会波动。API 速率限制（20–800 req/60s）可能约束高频数据管道集成。

              风险 6 —— 没有公开 SLA，合同正常运行时间不确定（低中严重性）。基于状态页和第三方监测的实际正常运行时间为 99.7–100%。但公司没有公开披露合同 SLA；企业买方无法在采购中依赖已发布
              SLA。缺少公开 SLA 也可能限制受监管行业中需要文档化正常运行时间承诺的企业交易成交。
            claimRefs:
