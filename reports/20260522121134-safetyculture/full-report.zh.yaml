      - number: '1.3'
        title: 资本、估值与投资人图谱
        blocks:
          - type: paragraph
            body: >
              根据 Tracxn 融资数据库，自 November 2013 首轮种子轮以来，SafetyCulture 已在 11 轮公开融资中累计融资约 $298 million。公司最近且规模最大的一轮公开融资，是
              September 2024 的 Series D，金额 AU$165 million，对 SafetyCulture 的估值为 AU$2.5 billion（按当时汇率约 $1.65 billion
              USD）。但这个头部数字需要仔细拆分：Startup Daily 的独立报道确认，AU$165 million 中只有 AU$75 million 是新股融资，约 AU$90 million
              是现有投资人和员工出售老股，资金并未进入公司。Blackbird Ventures 管理合伙人 Rick Baker 明确承认，Blackbird 早期基金持有 SafetyCulture
              股份超过十年，已减持部分仓位。新股融资由 AirTree Ventures 领投（出资 AU$40 million），现有投资方 Blackbird Ventures 和 Morpheus Ventures
              参投，澳大利亚养老金基金 Hostplus 和 HESTA 也与 Blackbird 一同共同投资。


              AU$2.5 billion 估值也低于 August 2023 由 Marbruck Investments 领投的 $22 million 融资后达到的 AU$2.7 billion
              投后估值。对私人市场而言，这是一个反向信号：估值折价可能同时反映市场倍数压缩和谈判杠杆变化。2023 年之前，估值轨迹明显上行：April 2020 的 $800 million Series C，October
              2020 一轮（Insight Partners 领投）后的 $1.3 billion 估值，以及 May 2021 一轮（Insight Partners 继续领投，Tiger Global 和 Index
              Ventures 参投）后的 $1.7 billion 估值。按 Tracxn 数据库，累计融资为 $298 million，但该数字不包括任何未披露的老股交易规模。


              创始人 Luke Anear 在 March 2023 曾公开表示，SafetyCulture 已「从增长模式转向盈利」，并拥有「无限现金跑道」，公司不需要持续的 VC 融资。尽管有该表述，公司仍在
              September 2024 融入 $75 million 新股，这是一项值得深挖的尽调点：需要判断当时的盈利表述是否准确，还是只是战略转向叙事，后来随着企业扩张成本和 AI 投资需求加速而被重新审视。
