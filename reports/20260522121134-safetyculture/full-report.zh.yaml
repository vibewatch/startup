  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 在 180+ 个国家运营，并大规模处理员工和工作场所运营数据——包括约 3.5 billion 张工作现场图片、检查记录、事故报告和培训完成记录——在三个主要市场
              Australia、United Kingdom/EU 和 North America 的隐私与数据保护制度下，都属于高价值监管目标。截至 May 2026 报告日期，未在 Australia、UK、US 或
              EU 法院数据库及监管执行登记中发现针对 SafetyCulture 的公开诉讼或执法行动。这里将缺失诉讼记录为正面发现，而不是证据缺口；但监管环境演进带来的前瞻性暴露，会实质影响投资风险。


              Australia 的 Privacy and Other Legislation Amendment Act 2024 于 2024 年末生效，大幅抬高了 SafetyCulture
              这类公司的合规门槛。严重或重复隐私违规的最高罚款如今达到 AU$50 million、所获利益的三倍，或调整后营业额的 30%——取较高者，使澳大利亚执法与 GDPR
              级制度看齐。此外，严重侵犯隐私的新私人侵权诉讼权（effective June 2025）允许个人直接在澳大利亚法院起诉，绕过 Office of the Australian Information
              Commissioner（OAIC），显著提高集体诉讼风险。下一批改革——预计 2025-2026——将要求 SaaS 提供商公布自动化决策系统（包括 AI）披露，对涉及个人的重大决策强制解释性，并在
              December 2026 前实施 Children's Online Privacy Code。SafetyCulture 的 October 2025 Terms and Conditions
              更新明确表示，平台不会使用客户数据训练第三方 AI 系统——该披露直接回应了一个改革方向——但更广泛的自动化决策透明度要求仍是开放合规缺口。


              在 UK 和 EU，SafetyCulture 通过 SAFETYCULTURE (UK) LIMITED（Companies House 备案，Manchester）运营。UK ICO 在 January
              2026 发布更新后的国际数据传输指南，明确 UK 境外实体的云访问构成“受限传输”，需要充分性决定、International Data Transfer Agreement（IDTA）或 Standard
              Contractual Clauses（SCCs）。SafetyCulture 基础设施托管在 AWS，其 DPA 确认公司作为数据处理者。尽管公司发布了 DPA 和带有 GDPR、CCPA 附录的隐私政策，但
              UK/EU 企业客户的分处理者清单和数据驻留承诺没有公开发布——这给受监管行业客户制造了尽调缺口；若分处理者转移没有完整记录，也会形成合规暴露。EU AI Act 围绕自动化决策的要求会在 2026-2027
              分阶段生效，在 Twine 收购后的 SafetyCulture 智能体 AI 路线图上叠加另一层合规要求。


              在 North America，SafetyCulture 通过 Kansas City 办公室和北美客户基础，暴露在 22+ 部生效的美国州隐私法拼图之下。未发现与 SafetyCulture 检查输出相关的
              OSHA 执法行动或产品责任索赔。嵌入式保险业务（SafetyCulture
              Care）增加了受监管金融服务维度——销售保险需要在每个售卖保单的司法辖区取得许可和经营行为授权，而这些授权均未在公开来源中得到独立确认，构成重要尽调问题。
