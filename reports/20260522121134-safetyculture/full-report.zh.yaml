  - id: FE001
    title: SafetyCulture 产品架构栈
    type: stack
    layout: wide
    summary: 四层逻辑架构，从面向用户的能力模块到基础设施，展示平台模块广度，以及支撑每一层的基础设施依赖。层级排列是逻辑性的（不一定反映微服务拓扑）。
    data:
      layers:
        - label: 一线参与层
          detail: 一线员工直接使用的模块：移动检查（iAuditor）、Heads Up 广播消息、培训交付（整合模块）和独自作业人员安全（SHEQSY）。全部移动优先；支持离线；iOS 和 Android 原生应用。
          items:
            - 检查 / iAuditor（100,000+ 个模板；2M+ 次检查 / 月）
            - Heads Up 通讯（广播、确认跟踪、多媒体）
            - 培训模块（AI 课程构建器；1,000+ 门课程；微学习；离线）
            - SHEQSY 独自作业人员安全（胁迫报警；签到；位置监控）
        - label: 运营管理层
          detail: 主管和运营经理用来分配、跟踪、解决运营问题和资产合规的模块：Issues/Actions、Asset Management、IoT Sensor Monitoring。与一线模块和分析模块相连。
          items:
            - Issues and Actions（纠正措施分配；截止日期跟踪；媒体附件）
            - Asset Management（资产登记；维护计划；合规证书）
            - IoT Sensor Monitoring（Dragino LoRaWAN 传感器；阈值警报；网关桥接）
        - label: 智能与商业层
          detail: 跨模块洞察和商业交易界面：分析仪表盘、AI 辅助查询，以及用于检查中产品采购的 Marketplace。
          items:
            - Analytics（热力图；NLQ AI 查询；定时导出；站点级基准）
            - Marketplace（100,000+ 个 SKU；200+ 个品牌；澳大利亚和美国；FY2025 GMV ~AU$68.2M）
            - AI 功能（模板生成；课程创作；开发中的智能体 AI）
        - label: 集成与基础设施层
          detail: 面向开发者的 API、集成连接器、开源导出工具，以及支撑所有平台模块的 AWS 云基础设施层。
          items:
            - REST API + webhooks（developer.safetyculture.com；Bearer token 认证；20–800 req/60s）
            - Integrations Marketplace（100+ 个连接器：Salesforce、Workday、BambooHR、Zapier）
            - SafetyCulture Exporter（Go；开源；Apache-2.0；CLI + GUI）
            - AWS 云托管（多区域；静态 AES-256；传输中 TLS 1.2+）
    approximationNotes: >-
      内部微服务拓扑、数据库栈、CDN 提供商和具体 AWS 区域配置未公开披露。层级边界是逻辑分组，不是部署单元边界。IoT 硬件层（Dragino）位于集成层之下，是物理依赖。AI 功能状态：模板 / 课程生成确认已上线；智能体
      AI 开发中（截至 2026-05-22 未确认上线）。
