      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary demand drivers in SafetyCulture's market in 2026 are regulatory mandates, digital
              transformation replacing paper-based processes, AI integration into frontline operations, ESG and
              sustainability reporting requirements, and labor-shortage-driven urgency to preserve institutional
              knowledge through training.

              Regulatory pressure is the strongest near-term driver. In North America, OSHA's electronic recordkeeping
              mandates are pushing mid-market manufacturers and construction firms toward purpose-built EHS software. In
              APAC, Safe Work Australia's harmonized WHS framework, India's OSHWC Code, and China's GB standard updates
              are creating compliance urgency. The Wolters Kluwer and National Safety Council survey of over 1,000
              senior EHS leaders found that 90% are keen to invest in AI to improve safety performance, reflecting
              strong intent that benefits AI-native platforms like SafetyCulture. Digital transformation remains the
              largest structural driver: the 2026 EHS Insight buyer guide notes that many organizations still rely on
              manual and paper-based EHS systems, and that modern platforms should achieve full implementation in 30
              days without external consultants. SafetyCulture's self-serve, mobile-first deployment model is aligned
              with this expectation. Labor shortages are an underappreciated driver: the SafetyCulture Feedback from the
              Field survey found 71% of workers feared a brain drain in their industries, and the dissatisfied-worker
              productivity loss is estimated at $196 billion globally per year — a quantified pain point that supports
              platform investment.

              Adoption constraints are equally significant. For SMBs, cost is the number-one barrier: high subscription
              fees, data migration costs, and training investment prevent approximately 30% of eligible SMBs from
              adopting new software. Over a quarter of non-adopting SMBs cite current workflows as "good enough."
              Enterprise EHS suites from Intelex, Cority, VelocityEHS, and Enablon dominate large accounts and carry
              high switching costs through data lock-in and deep ERP integrations. ROI proof is difficult to quantify in
              advance: EHS buyers struggle to model incident reduction benefits, insurance savings, and regulatory
              penalty avoidance before deployment. SMB EHS software adoption is estimated at only ~15% compared to ~80%
              for large enterprises, revealing a deep under-penetrated segment but also a monetization risk.
