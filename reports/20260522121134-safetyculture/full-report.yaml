      - number: '6.3'
        title: Named Customer Proof by Vertical
        blocks:
          - type: paragraph
            body: >-
              The quality of named-customer evidence varies substantially across SafetyCulture's portfolio. The best-
              documented deployments are detailed below by vertical.

              Construction and Manufacturing. ArcelorMittal Construction — a subsidiary of the world's largest
              steelmaker and miner, operating across 15 countries — deployed SafetyCulture initially in 2017 and
              subsequently expanded to additional divisions. It runs 4,848 audits annually across 43 European production
              sites and reports 5,000 hours saved per year, with a 50% reduction in time spent on Safety Walk audits.
              Robin Castin, Head of Health and Safety, cited flexibility, a template library, and the absence of rigid
              per-site constraints as key decision drivers. William Hare, a UK steel fabrication business with 2,400
              employees operating across the UK, UAE, India, and Portugal, has used SafetyCulture for 10+ years and
              completed over 180,000 inspections and actions in a single connected platform. The company runs 700+
              corrective actions per month across safety, quality, environmental management, and maintenance. Its teams
              use Sensors in the paint shop and welding stores to monitor humidity, and Heads Up for procedure updates.
              The company holds ISO 9001, ISO 45001, ISO 14001, and BS EN 1090 certifications, relying on
              SafetyCulture's real-time dashboards to pass external audits without preparation. Level 10 Construction
              operates with 200+ employees, has completed 2.5 million man hours with no lost time incident, and runs 10+
              audits per day using the platform for pre-task safety checks and field-to- office communications.

              Logistics and Transport. DB Schenker, a global logistics leader with 75,000 employees, has used
              SafetyCulture in its UK and Ireland cluster (1,800 staff, 28 facilities) continuously since 2017 for
              audits, incident reporting, and Heads Up internal communications. The QSHE Cluster Lead Manager described
              Heads Up as "short, snappy, and sweet" and praised its reach to frontline employees who lacked email
              access. Engagement from the frontline has been strong enough that workers proactively suggest new Heads Up
              topics to the QSHE team. DB Schenker maintains ISO 9001, ISO 14001, and ISO 45001 certifications supported
              by SafetyCulture.

              Agriculture and Food Service. GROWMARK, identified as North America's third-largest agricultural retailer
              with 9,000+ staff across 100+ sites, uses SafetyCulture for inspections, issues, analytics, and Heads Up
              peer-to-peer learning. The company attributes more than $1 million in savings to "good catch" reporting
              enabled by the platform — near-miss and hazard capture before incidents occur. SSP, the largest food and
              beverage provider in Australian travel locations, scaled from 34 to 100+ sites across Australia and New
              Zealand in 2024, achieving a 99.6% on-time food safety inspection completion rate, an 82% improvement in
              worker understanding of food safety standards, and a 4x increase in reported incidents (improving hazard
              visibility). Phil Theuma-Whichello, National Safety Manager, stated: "In this dynamic business,
              SafetyCulture is one of our constants."

              Aviation and Events. London City Airport, which handled millions of passengers annually with a 25-person
              operations team performing multiple daily safety inspections, replaced a paper-based process generating
              approximately 5,000 sheets of audit paperwork per year with SafetyCulture's iAuditor. Tennis Australia has
              used SafetyCulture as a central operations platform since 2021, processing 2,400 inspections, 29,000
              inductions, and 14,000 staff training completions for the 2025 Australian Open. The platform covers
              logistics, retail, hospitality, court operations, customer experience, and ballkid training. Historically,
              Qantas ran a safety improvement program incorporating iAuditor, associated with a reported 70% reduction
              in lost time injury frequency rate and a projected $500 million five-year cost saving. However, the Qantas
              case is referenced primarily through a SlideShare-hosted PDF with no confirmed recency beyond 2024.

              Hospitality. FISHBOWL, an Australian fast-food chain expanding across Australia and the US with 850+
              employees, uses SafetyCulture as its primary operations, reporting, and incident management system. The
              company reports 90%+ on-time training completion and $70,000 saved annually through SafetyCulture sensor
              monitoring. Jess Oliver of Tennis Australia stated: "SafetyCulture has transformed how we train and manage
              our teams." Schindler Group, a global elevator and escalator manufacturer, uses the platform for
              inspection, actions, and issue reporting to ensure field teams directly own and document safety
              compliance.

              Public Sector and Government Procurement. UK enterprise logos confirmed by SafetyCulture's EMEA fundraise
              announcement include NHS, National Grid, British Airways, and Transport for London. No detailed production
              evidence is available for these accounts beyond logo status. A US government procurement record shows the
              Department of Veterans Affairs purchased a SafetyCulture iAuditor Premium Annual Plan (contract term June
              16 2025 to June 15 2026, value $3,000) — a small footprint indicating pilot-scale rather than enterprise
              penetration of the US public sector as of 2026.
