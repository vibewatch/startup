chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >
              SafetyCulture is a privately held Australian technology company that operates a mobile-first workplace
              operations platform serving frontline workers across manufacturing, construction, hospitality, retail,
              logistics, and related industries. The company traces its origins to 2004, when founder Luke Anear — a
              former workplace accident investigator — began developing digital safety documentation in a garage in far
              north Queensland. The product subsequently evolved into iAuditor, described by the company's newsroom as
              "the world's largest checklist app," and was later rebranded SafetyCulture to match the name of the
              broader platform. The company is headquartered at Level 2, 72 Foveaux Street, Surry Hills, NSW, Australia
              (Sydney metropolitan area), and operates six offices worldwide including Manchester (UK) for its EMEA team
              and Kansas City (US) for North American operations.


              The business model centers on a SaaS subscription platform sold primarily to businesses rather than
              individual workers. Core monetization flows through per-seat or per-organization licensing of the
              SafetyCulture platform, which as of the 2023 platform launch integrates inspections and audits, issue
              management, task assignment, asset management, training delivery (EdApp/SC Training), IoT sensor
              monitoring, a marketplace for consumable workplace products (75,000+ products from 120+ brands as of late
              2023), and business insurance that underwrites customer risks. The marketplace and insurance lines
              represent deliberate diversification beyond pure SaaS and, per founder Anear, reflect a strategy to build
              "several multi-billion dollar revenue businesses at the same time."


              SafetyCulture's stated mission is to improve the working lives of frontline workers and help organizations
              build a culture of safety and continuous improvement. The company explicitly targets the approximately 2.7
              billion deskless workers worldwide — a segment that has historically received limited investment in
              purpose-built technology — and frames its competitive differentiation around direct reach to those workers
              at the moment of work rather than at the management layer. As of run date, the company remains private
              with no stated IPO plans.
