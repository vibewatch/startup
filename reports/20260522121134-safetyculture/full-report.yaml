  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture's customer base is structurally diverse, spanning buyer type (operations/safety managers as
              buyers; frontline workers as primary users; businesses as payers), geography, vertical, organizational
              size, and use case. The company reported 85,000 businesses and close to 2 million users across 180+
              countries as of its September 2024 Series D announcement; the UK alone accounts for 25,000+ businesses.
              The EMEA team is headquartered in Manchester, North American operations are based in Kansas City, and the
              company's home market is Australia. While exact country-level splits are not disclosed, the geographic
              emphasis is Australia, UK, and the United States.

              By vertical, the evidence base confirms production-grade deployments in construction (Level 10
              Construction, William Hare, ArcelorMittal Construction, Thermosash Group), manufacturing and steel
              (ArcelorMittal, William Hare, Schindler elevators), logistics and transport (DB Schenker, Transport for
              London), airport/aviation (London City Airport, SSP at Australian airports), hospitality and food service
              (FISHBOWL, SSP, Australian Open venues), agriculture/agricultural retail (GROWMARK), large-scale events
              (Tennis Australia / Australian Open since 2021), and public sector/healthcare (NHS, US Department of
              Veterans Affairs). Logos without detailed deployment evidence include British Airways and National Grid in
              the UK.

              By size, SafetyCulture's model addresses a wide range: the free/starter tier attracts SMBs and individual
              inspectors, while Premium and Enterprise tiers serve large, multi-site organizations. The most detailed
              case studies (ArcelorMittal, DB Schenker, William Hare, GROWMARK) all reflect enterprise-scale deployments
              with hundreds to thousands of employees and 10+ simultaneous SafetyCulture modules in production. The
              explicit SMB churn concern surfaced by analyst commentary indicates that the SMB segment — where price
              sensitivity is higher — is structurally weaker than the enterprise cohort.

              The primary buyer is typically a Health, Safety, Quality, and Environment (HSQE) manager, National Safety
              Manager, or Operations Director. The primary user is the frontline worker completing inspections, raising
              issues, and receiving training on mobile. The payer is the organization. In enterprise accounts, central
              procurement involves an IT or legal review, but the product's self-serve trial capability means that
              departmental adoption frequently precedes formal enterprise procurement — a characteristic land-and-expand
              motion.
