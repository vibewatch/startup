  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: wide
    summary: >-
      SafetyCulture converts platform engagement across 85,000 business accounts into revenue through three distinct
      mechanisms: subscription fees (primary), marketplace commissions (secondary), and insurance take-rates (emerging).
      The bridge illustrates the monetization pathway from user acquisition through gross profit, with the freemium tier
      representing both scale and a conversion cost center.
    data:
      nodes:
        - id: user-acquisition
          label: 2M+ platform users; 85,000 accounts
          detail: Company-claimed as of Sep 2024. Includes free, lite, and paid seat holders.
          tone: positive
        - id: free-tier
          label: Free tier (≤10 users, $0)
          detail: Zero revenue; drives acquisition and eventual conversion. Up to 5 templates, basic analytics.
          tone: neutral
        - id: premium-subscription
          label: Premium SaaS ($5 Lite / $24 Full per user/month)
          detail: Primary revenue stream. Annual billing. Enterprise at custom pricing. Estimated $90–132M ARR.
          tone: positive
        - id: marketplace
          label: Marketplace procurement (GMV take-rate)
          detail: 75,000+ products; US and Australia. GMV and take-rate undisclosed. Lower margin than SaaS.
          tone: neutral
        - id: insurance
          label: Embedded insurance (commission / take-rate)
          detail: QBE/Allianz underwriting. Risk profiling from 5PB inspection data. Scale and margin undisclosed.
          tone: neutral
        - id: gross-profit
          label: Gross profit (margin undisclosed)
          detail: Blended SaaS ~70–80%; marketplace ~10–30%; insurance potentially high but small scale. Mix unknown.
          tone: warning
      edges:
        - from: user-acquisition
          to: free-tier
        - from: user-acquisition
          to: premium-subscription
        - from: user-acquisition
          to: marketplace
        - from: user-acquisition
          to: insurance
        - from: premium-subscription
          to: gross-profit
        - from: marketplace
          to: gross-profit
        - from: insurance
          to: gross-profit
    approximationNotes: >-
      Revenue stream magnitudes are based on estimates; no audited split between SaaS, marketplace, and insurance
