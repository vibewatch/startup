  - id: FM001
    title: Market Sizing Lens
    type: pyramid
    layout: standard
    summary: >-
      SafetyCulture's addressable market layers from a narrow software-segment floor to a broad worker-count ceiling.
      The SAM is illustrative — constructed from overlapping analyst estimates — and the SOM is unverifiable from public
      data. All values are rough approximations requiring independent validation.
    data:
      items:
        - label: TAM — Broadest Frontline Enablement Framing (~$36B, 2026)
          detail: >-
            Aggregate ceiling including EHS, inspection, training, IoT, and all connected-worker platforms globally.
            Includes segments beyond SafetyCulture's current product scope. Source: Fortune Business Insights frontline
            worker enablement aggregate.
          tone: neutral
        - label: SAM — Core EHS + Inspection + Training + IoT (Illustrative ~$10–15B, 2026)
          detail: >-
            Overlap of EHS software ($8.9B TBRC), inspection management ($8.7B MarketsandMarkets), and frontline
            training ($2.9B ResearchAndMarkets), adjusted for category overlap. Illustrative only; overlap adjustment
            not independently verifiable.
          tone: neutral
        - label: SOM — SafetyCulture Estimated Reachable Segment (~$1–2B est., not publicly verified)
          detail: >-
            Rough estimate based on 85,000 customers, current pricing, SMB/mid-market focus, and geographic footprint.
            No independent estimate exists; SafetyCulture has not disclosed per-customer economics.
          tone: warning
        - label: Evidence Gap — SAM/SOM not verifiable from public sources
          detail: >-
            SafetyCulture has not published its own SAM/SOM derivation. The pyramid is directional only. Primary
            diligence should replace these layers with management-confirmed per-customer economics.
          tone: negative
    approximationNotes: >-
      TAM figure from Fortune Business Insights (2026) includes all frontline enablement segments and is not directly
      comparable to SafetyCulture's actual product perimeter. SAM is illustrative and constructed by the analyst team by
      combining three separate market reports, with overlap estimated but not measured. SOM is derived from 85,000
      customers × unknown ACV and is not a source-backed figure. All three layers carry material uncertainty and should
      be replaced with primary research before use in investment memos.
