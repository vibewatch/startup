  - id: TP001
    title: Competitor Profile Table
    layout: wide
    notes: >-
      Revenue estimates for private companies are from third-party intelligence platforms (Growjo, ZoomInfo, Tracxn) and
      should be treated as indicative, not verified financials. SafetyCulture revenue not publicly disclosed. Pricing
      for EHS incumbents is custom-quoted; ranges shown are industry intelligence estimates. Category classification
      reflects primary product positioning, not the full product scope.
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Key Differentiation
      - Primary Limitation vs SafetyCulture
    rows:
      - - GoAudits
        - Direct inspection peer
        - Self-funded/bootstrapped; ~$5M est. revenue
        - SMB to mid-market; hospitality, retail, food, facilities
        - Lowest published price ($10/user/mo Starter); 4.8/5 user rating; multi-site reporting
        - No training, sensors, or asset modules; narrower platform breadth
      - - Lumiform
        - Direct inspection peer
        - ~$13.1M raised (Series A, 2022); ~$4.8M est. revenue; ~40 employees
        - SMB to mid-market; manufacturing, food, construction
        - Mobile-first UX; AI form creation; rapid deployment; €16/user/mo Professional
        - Much smaller scale; no training/IoT/marketplace; employee headcount declining
      - - Fluix
        - Direct inspection peer (premium tier)
        - Undisclosed; niche/bootstrapped; Dublin-based
        - Enterprise field service; aviation; construction
        - Legally binding document workflows; tamper-proof audit trails; e-signatures
        - Higher cost; narrow market focus; no freemium funnel
      - - Donesafe (HSI)
        - Direct inspection peer / lower EHS suite
        - Acquired by HSI (private); undisclosed revenue
        - Mid-market compliance; incident management; audits
        - No-code EHS workflow builder; configurable safety audit modules
        - Limited brand recognition vs SafetyCulture; EHS incumbent adjacency
      - - Operandio
        - Direct inspection peer (F&B vertical)
        - Seed/early stage; undisclosed
        - Restaurant and franchise operators
        - Inspections + corrective actions + training in single tool for F&B
        - Very narrow vertical focus; no sensor/IoT capability
      - - Intelex (Industrial Scientific)
        - EHS incumbent
        - Acquired; ~$144M est. ARR; ~477 employees; 1,400+ enterprise customers
        - Large enterprise; regulated industries (oil & gas, mining, utilities)
        - Configurable EHSQ suite; quality integration; 3.5M users; 150 countries
        - Complex implementation; no freemium; weak mobile-first UX for frontline workers
      - - Cority (Thoma Bravo)
        - EHS incumbent
        - PE-backed; ~$146–158M est. ARR; 700–850 employees; 1,500+ customers
        - Fortune 500; occupational health; global regulatory compliance
        - AI predictive analytics; occupational health depth; ESG/sustainability modules
        - Expensive; complex; overkill for SMB; no product-led growth motion
      - - VelocityEHS
        - EHS incumbent
        - Private; undisclosed revenue; U.S.-focused
        - Industrial operations; manufacturing; chemicals; OSHA-centric
        - Chemical management; ergonomics (Humantech); easy deployment; mobile capable
        - U.S.-centric; limited ESG/quality depth; less global than Intelex/Cority
      - - Enablon (Wolters Kluwer)
        - EHS incumbent (enterprise)
        - Corporate subsidiary; undisclosed; enterprise pricing
        - Large multinationals; process safety; contractor-heavy industries
        - Process safety management; permit-to-work; CMMS/EAM integration; audit traceability
        - Not suitable for SMB; long implementation; deployment complexity
      - - Benchmark Gensuite
        - EHS incumbent (mid-market)
        - Private; undisclosed; modular subscription pricing
        - Mid-market multi-site organizations
        - Fast deployment; modular; competitive TCO vs Intelex/Cority at mid-market
        - Less customization depth than Intelex; unknown revenue scale
      - - Microsoft 365 (Forms + Power Automate + Teams)
        - Adjacent substitute
        - Enterprise SaaS; Microsoft total revenue $245B+ FY2025
        - All enterprise segments already on M365 licensing
        - Zero incremental cost for existing M365 customers; AI Copilot form generation
        - No offline mobile inspection; no corrective action tracking; no compliance audit trail
      - - Google Workspace (Forms + Sheets)
        - Adjacent substitute
        - Enterprise SaaS; Alphabet total revenue $350B+ FY2025
        - SMB and consumer; teams not requiring compliance workflows
        - Free; easy; instant Sheets integration
        - No corrective actions; no compliance; no offline; limited to simple audits
      - - ServiceNow
        - Adjacent substitute
        - NYSE:NOW; ~$11.5B revenue FY2025
        - Large enterprise; IT and operations workflow automation
        - Enterprise-grade workflow automation; incident tracking; escalation management
        - Not mobile-first for frontline workers; limited inspection template ecosystem
      - - MaintainX
