            title: SC Training / EdApp retirement created permanent data portability failure for customers
            body: >-
              SafetyCulture retired the SC Training platform (formerly EdApp) on 31 March 2026, with data deletion after
              20 April 2026. An estimated 70,000+ organisations and 1M+ users were affected. Completion records and
              learner progress data were not fully transferable without a paid upgrade path. Users who did not act lost
              historical training records permanently. This is not a minor migration friction issue — for organisations
              in regulated industries (healthcare, food manufacturing, construction safety) where training completion
              records are compliance documentation, the data loss represents a potential regulatory and legal exposure.
              Any investor or enterprise buyer should request SafetyCulture's customer retention data segmented by the
              SC Training cohort to assess the churn and reputation impact from this event.
