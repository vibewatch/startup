  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Valuation Backdrop: Last-Round Anatomy and Context'
        blocks:
          - type: paragraph
            body: >
              SafetyCulture's current headline valuation of AU$2.5 billion derives from its September 2024 funding round
              — a AU$165M raise comprising AU$75M in primary capital and AU$90M in secondary proceeds, led by AirTree
              Ventures. The round was priced at a AU$200M discount to the AU$2.7B mark achieved in 2023, making it one
              of Australia's most prominent down-rounds of the cycle. The secondary component deserves particular
              attention: at 55% of total round proceeds, the AU$90M secondary portion signals meaningful early-investor
              and employee liquidity demand at a price below the prior mark — a dynamic more consistent with constrained
              exit optionality than with a company approaching transformative growth inflection.


              Context from the broader SaaS environment reinforces the significance of the down-round. PitchBook Q4 2025
              data shows late-stage private SaaS median EV/ARR compressed from 18x in 2021 to 7x in 2025.
              SafetyCulture's 2024 reset to AU$2.5B represents a partial correction rather than a full normalisation to
              the new market-clearing level. At AU$160.6M FY24 revenue (SmartCompany), the current implied multiple is
              still 15-21x ARR depending on the revenue basis used — materially above the 6-10x range for EHS SaaS
              peers.


              The UK Companies House filing for SAFETYCULTURE (UK) LIMITED (company 11007705, accounts to June 2024)
              provides a rare window into entity-level financials: total assets of £4.25M, net assets of £3.01M, and 62
              employees. This limited UK footprint confirms that the majority of revenue, IP, and operating risk sits in
              the unlisted Australian parent — for which no audited group-level financials have been published. The
              absence of audited consolidated accounts is a first-order due diligence gap that prevents independent
              verification of all management-reported revenue, growth, and margin claims.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
