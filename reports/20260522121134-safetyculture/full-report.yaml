      - number: '3.6'
        title: Switching Cost, Lock-in, Multi-homing, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture's moat is primarily built on procedural switching costs rather than technical lock-in. The
              key switching cost drivers are: (1) template and workflow library — customers who have invested in
              building, customizing, and deploying hundreds of inspection templates face significant rebuild time when
              migrating to a competitor; (2) historical data — years of inspection records, incident logs, and
              corrective-action histories stored in SafetyCulture's proprietary format create retrieval and migration
              friction; (3) embedded workflows — when SafetyCulture is integrated with enterprise systems (SAP, Power
              BI, Tableau, ServiceNow) via API or native connectors, the integration cost and testing time creates a
              real switching barrier; (4) user familiarity — frontline workers trained on SafetyCulture's mobile
              interface require retraining for any replacement tool, adding change management cost; and (5) training
              content — SC Training course libraries and completions stored in SafetyCulture create an additional data
              portability consideration.

              Multi-homing is common at the SMB tier. Many small organizations run SafetyCulture alongside paper
              processes or partial Excel systems. At the enterprise tier, SafetyCulture frequently coexists with
              incumbent EHS suites (Cority, Intelex) rather than displacing them — SafetyCulture handles frontline
              mobile inspection while the EHS incumbent handles occupational health, environmental compliance, and
              management-layer reporting. This coexistence pattern reduces single-vendor risk for the buyer but limits
              SafetyCulture's enterprise contract value and creates displacement risk if the EHS incumbent expands its
              mobile capabilities.

              Network effects are limited but present in the template library: as more organizations publish and
              download templates, the value of the platform's template ecosystem increases. This creates a modest
              demand-side network effect that benefits SafetyCulture versus smaller peers without equivalent template
              catalogs.

              Moat durability risks: (1) commoditization — core inspection features (offline mobile checklists,
              corrective actions, PDF report generation) are increasingly replicated across competitors, reducing the
              functional moat from the inspection module alone; (2) EHS incumbent mobile investment — Cority, Intelex,
              and VelocityEHS are investing in mobile-first frontline capabilities, narrowing SafetyCulture's UX
              advantage; (3) Microsoft 365 expansion — Microsoft's AI-powered form intelligence (Copilot for Forms) and
              Power Automate workflow tooling raise the ceiling of what buyers can accomplish within their existing
              Microsoft contract; (4) pricing pressure from below — GoAudits and Lumiform offer inspection functionality
              at half or less of SafetyCulture's per-user price, creating a downward pricing pressure in the SMB market;
              and (5) AI differentiation uncertainty — SafetyCulture's Twine AI acquisition (April 2026) signals
              platform AI investment, but competitors (Cority with predictive safety analytics, Lumiform with AI form
              creation, GoAudits with automated anomaly detection) are pursuing similar AI differentiation
              simultaneously.
