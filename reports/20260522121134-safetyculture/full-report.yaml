      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              SafetyCulture's operational and commercial model rests on several external dependencies that, if
              disrupted, could materially constrain growth, customer retention, or product delivery. The most acute
              concentration is in cloud infrastructure: AWS hosts the entire platform, confirmed by SafetyCulture's AWS
              Marketplace listing. No multi-cloud or on-premise deployment option is publicly offered. Any migration
              away from AWS would require significant re-engineering and is not a realistic short-term mitigation.


              The insurance business (SafetyCulture Care) depends on underwriting partnerships with QBE and Allianz —
              two large but independently managed insurers. Any re-pricing, withdrawal, or regulatory restriction on
              either underwriting relationship would impair SafetyCulture Care's ability to offer embedded insurance,
              directly undermining the diversification thesis that management has publicly championed. The terms and
              exclusions of these underwriting arrangements are not publicly disclosed.


              SafetyCulture's platform integration capability — supporting HR systems (Workday, BambooHR, SAP
              SuccessFactors, Oracle HCM), ERP systems, and cloud analytics — depends on the API stability and
              partnership terms of those platforms. Policy changes by any major integration partner could break existing
              customer deployments and create churn among enterprise accounts. The Verdantix Green Quadrant 2025 EHS
              software review includes SafetyCulture among assessed vendors but positions enterprise-grade peers
              (Cority, Intelex, VelocityEHS, Sphera, Enablon) as stronger for complex, multi-site regulatory compliance
              programs — indicating that SafetyCulture's integration depth with enterprise systems is a competitive
              differentiator at risk if partners favor deeper-integrated competitors.


              The marketplace business (75,000+ products from 120+ brands) introduces supplier dependency and working-
              capital risk. SafetyCulture is not a manufacturer and acts as marketplace operator; supplier
              concentration, pricing changes, or category withdrawals could reduce marketplace revenue. No supplier
              concentration data is publicly available. The three-line dependency — SaaS, insurance, marketplace —
              creates operational complexity unusual for a company at SafetyCulture's ARR scale and may strain
              management bandwidth during the concurrent AI rebuild.
