      - number: '8.2'
        title: 'Comparable Analysis: EHS SaaS Peers and the Public Market Anchor'
        blocks:
          - type: paragraph
            body: >
              Valuation of a private, high-growth SaaS company without audited financials necessarily anchors to
              comparable-transaction analysis and public-market multiples. This section applies both frameworks to
              derive a credible range.


              On the public SaaS side, the median EV/NTM Revenue for listed SaaS compressed to 6.4x in Q1 2026 per SaaS
              Valuation Multiple tracker data, with only AI-native or highly profitable companies sustaining
              double-digit multiples. SafetyCulture, which reported a AU$36M net loss in FY24, is neither AI-revenue
              proven nor profitable — it would need to demonstrate one of these attributes to justify a premium above
              the 8-10x band reserved for top-quartile growers.


              On the EHS SaaS private-market side, Aventis Advisors benchmarks show M&A transactions averaging
              approximately 2.0x revenue for the broader EHS sector and 7-9x for category leaders. Capstone/IMAP shows
              SaaS software M&A in 2025 averaged 5.1x EV/ARR, with premium assets reaching 8-12x. MarketScreener data
              for EHS and compliance software shows listed and private comparable companies at 5-8x EV/Revenue median.
              Software Equity Group's 2025 B2B SaaS median was 4.5-6.5x EV/ARR for private transactions.
              NatLawReview/SEG 2026 outlook projects 6-10x ARR for EHS category leaders from strategic acquirers.


              Combining these anchors, the defensible comparable range for SafetyCulture is 6-10x ARR, which on AU$160M
              FY24 revenue yields AU$0.96B-AU$1.6B — well below the AU$2.5B primary price. Achieving AU$2.5B on comps
              alone would require either confirming AU$200M+ ARR (IBISWorld's AU$197.6M 2025 estimate, which is
              benchmarked not audited) or applying a 12-15x multiple justified by demonstrated AI-augmented growth —
              neither condition is currently verifiable from public data.
            claimRefs:
