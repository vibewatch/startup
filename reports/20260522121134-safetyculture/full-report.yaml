        - label: Base (AU$160M ARR, 8-10x)
          low: 1.28
          mid: 1.44
          high: 1.6
          unit: AU$B
        - label: Bear (AU$119M ARR, 4-6x)
          low: 0.48
          mid: 0.6
          high: 0.71
          unit: AU$B
        - label: Secondary-market implied
          low: 1.6
          mid: 1.72
          high: 1.85
          unit: AU$B
        - label: Recommended entry range
          low: 1.75
          mid: 1.875
          high: 2
          unit: AU$B
        - label: Current primary valuation
          low: 2.5
          mid: 2.5
          high: 2.5
          unit: AU$B
  - id: FV004
    title: Investment KPIs
    type: kpi
    insight: >
      Three of five key valuation signals are negative or caution-flagged; positive signals (TAM leadership, AI
      conviction) are not yet reflected in verifiable financial metrics. This configuration — where the business quality
      case is strong but the evidence quality case is weak — warrants a Conditional Cautious verdict rather than a Pass
      or a Positive.
    claimRefs:
      - CV004
      - CV010
      - CV016
      - CV025
      - CV041
    sourceRefs:
      - SV020
      - SV022
      - SV026
      - SV030
    data:
      items:
        - label: Implied EV/ARR at primary
          value: 15-21x
          status: negative
          note: 2-3x above the prevailing 6-10x SaaS private comp median per Aventis, SEG, PitchBook
        - label: Secondary-market discount
          value: 31-35%
          status: negative
          note: Market-clearing price AU$1.63-1.72B vs AU$2.5B primary (PremierAlts, UpsideList)
        - label: Leadership stability
          value: 2 CEOs / 14 months
          status: negative
          note: Interim CEO (Luke Anear) as of May 2026; permanent successor not yet appointed
        - label: Market position (Verdantix 2025)
          value: Leader Quadrant
          status: confirmed
          note: EHS software leader with 65M+ worker TAM; strong enterprise retention
        - label: AI strategy conviction
          value: Twine acquired Apr 2026
          status: estimated
          note: Acquisition signals intent; no AI revenue demonstrated in public reporting yet
