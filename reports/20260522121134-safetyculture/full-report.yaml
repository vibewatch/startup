            - label: Freemium SMB churn risk (Medium residual; no direct mitigation)
            - label: Engineering talent retention under restructuring (High residual; limited mitigation)
        - label: Medium Likelihood
          values:
            - label: EdApp/SC Training migration disruption (Low residual; mostly complete)
            - label: Integration API breakage from AI rebuild (Medium residual; early stage)
            - label: AWS single-cloud outage (High residual; partial mitigation; no multi-cloud)
        - label: Low Likelihood
          values:
            - label: Cybersecurity breach — high-value data target (Critical if occurs; strong baseline)
            - label: Insurance underwriting partner withdrawal (High residual; dual-underwriter)
            - label: Australian Privacy Act enforcement or class action (Critical if filed; gap confirmed)
