  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              SafetyCulture's revenue architecture rests on three distinct monetization pillars, of which the SaaS
              subscription model is primary and the most transparent. The platform is sold to organizations — not
              directly to frontline workers — on a per-seat, per-month basis with three published tiers as of May 2026.
              The Free plan allows teams of up to 10 users to access basic inspection and checklist functionality at no
              cost; the Premium plan charges $24 per user per month when billed annually (or $29 month-to-month), with
              two seat categories — Full seats at the full price and Lite seats at $5/user/month annually, designed for
              occasional users such as workers who complete inspections but do not need admin or analytics access; and
              the Enterprise plan, where pricing is customized and not publicly disclosed. The official SafetyCulture
              pricing page confirms these list prices as of May 2026.


              It is critical to distinguish list pricing from realized revenue. SafetyCulture operates a freemium model
              that drives large user numbers into the Free tier, where monetization is zero. For accounts that do pay,
              enterprise customers negotiate volume discounts — third-party sources suggest 10–25% off list for
              deployments above 150 seats or multi-year commitments. SafetyCulture's stated 85,000 business customers
              and approximately 2 million users implies an average of approximately 23 users per account, but if a
              substantial proportion of those users sit on free or Lite seats, the implied ARPU is well below the
              theoretical maximum of approximately $6,768 per account per year (23 users × $24 × 12 months). At the
              $90.3M ARR estimate across 85,000 accounts, average realized ARR per account is approximately $1,062 —
              consistent with heavy free and Lite-seat penetration and meaningful freemium dilution of the paid base.


              The second revenue pillar is the SafetyCulture Marketplace, an embedded procurement platform offering
              75,000+ workplace safety products and PPE from 120+ supplier brands integrated directly into the
              inspection workflow. The marketplace allows purchasing of equipment triggered directly from inspection
              findings, with curated catalogs, budget controls, and automated ordering. Marketplace revenue is generated
              through commissions or product markups, but neither the gross merchandise value (GMV) nor the take-rate is
              publicly disclosed. The marketplace is available in the US and Australia as of run date.


              The third revenue pillar is embedded business insurance, underwritten via a partnership with QBE (with
              Allianz as the underlying insurer), which SafetyCulture integrates into its platform. Insurance
              monetization relies on a take-rate or commission model applied to policies placed through the platform.
              SafetyCulture's inspection data — over 5 petabytes of workplace compliance records — underpins data-driven
              risk profiling that could differentiate its insurance offering. The financial contribution of insurance to
              total revenue has not been disclosed. Founder Anear cited insurance and marketplace as the basis for his
              stated ambition to build "several multi-billion dollar revenue businesses at the same time," but the scale
              of these streams relative to core SaaS is unknown as of run date.
