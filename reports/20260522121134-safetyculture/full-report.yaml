      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              SafetyCulture operates across 180+ countries and processes employee and workplace operational data at
              scale — including approximately 3.5 billion worksite images, inspection records, incident reports, and
              training completions — making it a high-value regulatory target under privacy and data-protection regimes
              in its three primary markets: Australia, the United Kingdom/EU, and North America. No public litigation or
              enforcement action against SafetyCulture was identified in Australian, UK, US, or EU court databases or
              regulator enforcement registries as of the May 2026 run date. This absence is documented here as a
              positive finding, not a gap; however, the evolving regulatory landscape introduces prospective exposure
              that materially affects investment risk.


              Australia's Privacy and Other Legislation Amendment Act 2024 came into effect in late 2024 and materially
              raises the compliance bar for companies like SafetyCulture. Maximum penalties for serious or repeated
              privacy breaches now reach AU$50 million, three times the benefit obtained, or 30% of adjusted turnover —
              whichever is greatest, bringing Australian enforcement into parity with GDPR-class regimes. Additionally,
              a new private tort of serious invasion of privacy (effective June 2025) allows individuals to sue directly
              in Australian courts, bypassing the Office of the Australian Information Commissioner (OAIC), dramatically
              increasing class-action litigation risk. A further tranche of reform — expected 2025-2026 — will require
              SaaS providers to publish disclosures for automated decision-making systems (including AI), mandate
              explainability for significant decisions about individuals, and implement a Children's Online Privacy Code
              by December 2026. SafetyCulture's October 2025 Terms and Conditions update explicitly states that the
              platform does not use customer data to train third-party AI systems — a disclosure that directly addresses
              one reform vector — but broader automated-decision transparency requirements remain an open compliance
              gap.


              In the UK and EU, SafetyCulture operates through SAFETYCULTURE (UK) LIMITED (Companies House filing,
              Manchester). The UK ICO published updated international data transfer guidance in January 2026, clarifying
              that cloud access by entities outside the UK constitutes a "restricted transfer" requiring either an
              adequacy decision, International Data Transfer Agreement (IDTA), or Standard Contractual Clauses (SCCs).
              SafetyCulture's infrastructure is hosted on AWS and its DPA confirms it acts as a data processor. While
              the company publishes a DPA and privacy policy with GDPR and CCPA appendices, the subprocessor list and
              data residency commitments for UK/EU enterprise clients are not published openly — creating a diligence
              gap for regulated-sector customers and a compliance exposure if subprocessor transfers are not fully
              documented. The EU AI Act's requirements around automated decision-making take effect on a rolling basis
              through 2026-2027, adding a further compliance layer for SafetyCulture's agentic AI roadmap following the
              Twine acquisition.


              In North America, SafetyCulture is exposed to a patchwork of 22+ active US state privacy laws through its
              Kansas City office and North American customer base. No OSHA enforcement actions or product-liability
              claims tied to SafetyCulture's inspection outputs were identified. The embedded insurance business
              (SafetyCulture Care) adds a regulated financial-services dimension — insurance distribution requires
              licensing and conduct-of-business authorisations in every jurisdiction where policies are sold, none of
              which has been independently confirmed in public sources, creating a material diligence ask.
