      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Conditional Cautious: Entry at AU$1.75-2.0B Required'
            body: >
              SafetyCulture is a genuine category leader in EHS and operations SaaS with a defensible competitive
              position, enterprise customer retention, and a credible AI strategy. At AU$2.5B, the implied 15-21x ARR
              multiple cannot be justified without audited financials, confirmed ARR above AU$180M, and demonstrated AI
              revenue. Secondary-market pricing at AU$1.63-1.72B (31-35% discount) and comp-based fair value at
              AU$1.28-1.6B (base case) both point to the same conclusion: the primary price requires a premium that the
              evidence does not yet support. The chapter recommends conditional participation at a 20-30% discount
              (AU$1.75-2.0B), contingent on (1) audited FY25 financials, (2) confirmed ARR above AU$180M, and (3)
              permanent CEO appointment. Above AU$2.0B without these conditions being met, this is a Pass.
