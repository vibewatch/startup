              Of the AU$165M 2024 Series D headline, only AU$75M was new primary equity. The remaining AU$90M was
              secondary sales by existing shareholders, including Blackbird's early funds exiting positions held for
              over a decade. This is a rational end-of-fund-life action but also signals that early investors priced
              liquidity over waiting for a higher exit valuation — a signal that later-chapter valuation analysis should
              treat carefully.
            calloutType: insight
