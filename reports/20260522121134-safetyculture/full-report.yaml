  - id: FV001
    title: Recommendation logic
    type: flow
    insight: >
      The AU$165M round anatomy reveals a structurally ambiguous signal: the AU$90M secondary component at a AU$200M
      down-round price suggests early investors were unwilling to hold at the 2023 AU$2.7B mark, creating a
      price-discovery disconnect that feeds directly into the Conditional Cautious recommendation. The AU$2.5B primary
      is a negotiated price, not a market-clearing one.
    claimRefs:
      - CV001
      - CV002
      - CV003
    sourceRefs:
      - SV022
      - SV023
      - SV024
    data:
      nodes:
        - id: A
          label: AU$165M Total Round (Sep 2024)
          description: AirTree-led round closing at AU$2.5B headline valuation — a AU$200M down-round from 2023 peak of AU$2.7B
        - id: B
          label: AU$75M Primary Capital (45%)
          description: Funds operations, AI strategy (Twine), and geographic expansion in North America and UK
        - id: C
          label: AU$90M Secondary (55%)
          description: >-
            Provides liquidity to early investors and employees below the AU$2.7B prior mark — signals constrained exit
            optionality
        - id: D
          label: Secondary-Market Signal
          description: >-
            PremierAlts/UpsideList: market-clearing value AU$1.63-1.72B (31-35% below primary) — consistent with the
            AU$90M secondary demand at a discount
        - id: E
          label: Conditional Cautious Recommendation
          description: >-
            Primary at AU$2.5B not supported by comps (6-10x EHS SaaS median); entry at AU$1.75-2.0B required with
            audited financials, confirmed ARR, and permanent CEO
  - id: FV002
    title: Valuation sensitivity
    type: bar
    insight: >
      SafetyCulture's implied ARR multiple ranges from 12.5x (bull) to 21x (bear) depending on the revenue basis — all
      above the 6.4x public SaaS median and the 8x EHS category leader benchmark. Entry at AU$1.875B (midpoint of
      recommended range) brings the multiple to 12x, still a premium but defensible given TAM and retention.
    claimRefs:
      - CV004
      - CV010
      - CV011
      - CV027
      - CV028
      - CV029
    sourceRefs:
      - SV001
      - SV005
      - SV006
      - SV016
    data:
      items:
        - label: SafetyCulture (AU$119M ARR, bear)
          value: 21
          unit: x ARR
        - label: SafetyCulture (AU$160M ARR, base)
          value: 15.6
          unit: x ARR
        - label: SafetyCulture (AU$200M ARR, bull)
          value: 12.5
          unit: x ARR
        - label: SafetyCulture (AU$160M ARR, entry midpoint)
          value: 11.7
          unit: x ARR
        - label: EHS SaaS category leaders (Aventis)
          value: 8
          unit: x ARR
        - label: Public SaaS median Q1 2026
          value: 6.4
          unit: x ARR
        - label: Private SaaS median (SEG 2025)
          value: 5.5
          unit: x ARR
  - id: FV003
    title: Valuation / return range
    type: range
    insight: >
      The bull scenario at AU$2.4-3.0B is achievable only with confirmed AU$200M+ ARR and AI revenue proof. The base
      scenario (AU$1.28-1.6B) is consistent with available comp data. The recommended entry range (AU$1.75-2.0B) sits
      between base comp fair value and the secondary market implied price, offering asymmetric protection relative to
      the primary headline.
