      - number: '3.3'
        title: EHS Suite Incumbents
        blocks:
          - type: paragraph
            body: >-
              The enterprise EHS software market is dominated by a set of established platforms with decades of customer
              relationships, deep compliance depth, and enterprise sales motions. SafetyCulture competes at the edge of
              this segment — it is not a full EHS suite, but many enterprise buyers evaluate it alongside or as a
              complement to incumbent EHS platforms.

              Cority (Thoma Bravo-backed, acquired 2019) is estimated at $146–158M annual revenue in 2026 with 700–850
              employees and 1,500+ enterprise customers across 120+ countries. Cority is recognized for occupational
              health, medical surveillance, regulatory compliance, and AI-powered analytics for predictive safety
              insights. It has expanded into ESG and sustainability software through acquisitions. Cority's primary
              strength versus SafetyCulture is occupational health depth and Fortune 500 enterprise relationships. Its
              weakness is deployment complexity — it requires strong in-house administration and is not suitable for
              rapid SMB rollout. SafetyCulture's sales motion is essentially non-overlapping with Cority in the
              pure-enterprise tier but competes for mid-market accounts moving up-market from SMB.

              Intelex (acquired by Industrial Scientific) is estimated at ~$144M annual revenue in 2026 with
              approximately 477 employees and 1,400+ enterprise customers and 3.5 million users across 150 countries.
              Intelex provides highly configurable EHSQ (Environmental, Health, Safety, and Quality) modules including
              incident management, audits, CAPA, occupational health, and environmental compliance. Its primary
              advantage versus SafetyCulture is quality management integration and the depth of its compliance module
              library. Implementation complexity and the need for strong in-house admin capacity are recurring
              criticisms in customer reviews.

              VelocityEHS (formerly Humantech/MSDSonline) is the leading U.S.-focused EHS platform for industrial
              operations, particularly chemical safety, ergonomics, and OSHA process safety management. It is valued for
              easy deployments and mobile-first frontline capabilities. VelocityEHS competes with SafetyCulture for
              mobile inspection workflows but wins where chemical management, ergonomics modules, or U.S. regulatory
              alignment (OSHA, RCRA, TSCA) are non-negotiable.

              Enablon (Wolters Kluwer subsidiary) is positioned as the global enterprise standard for multi-site,
              multinational EHS risk management with extensive workflows for process safety, permits, contractor
              management, and audit traceability. Enablon integrates with CMMS/EAM systems and competes with ServiceNow
              for broad enterprise workflow ownership. SafetyCulture does not compete in Enablon's primary segment
              (large global industrial enterprises with complex process safety requirements) but may lose mid-market
              opportunities to Enablon's lower-tier configurations.

              Benchmark Gensuite (rebranded as Benchmark ESG) targets mid-market multi-site organizations with modular
              subscription options, fast deployment, and competitive total cost of ownership. It is more accessible than
              Intelex or Cority for mid-sized organizations that do not need full occupational health depth, making it
              the most direct EHS incumbent competitor to SafetyCulture in the mid-market tier. Its mobile capabilities
              and reporting are cited as strengths; advanced customization is a limitation.
