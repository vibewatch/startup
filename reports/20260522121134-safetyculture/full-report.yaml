      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture operates a cloud-native SaaS architecture hosted on Amazon Web Services (AWS). The platform
              is delivered as a mobile-first application with native iOS and Android apps and a full-featured web
              application; the iOS app version numbering convention (e.g., version 26.18.02 in May 2026) indicates
              year.week.patch release cadence, consistent with a high-frequency continuous-delivery model. A May 2026
              iOS defect (affecting an unspecified user subset) was acknowledged on the status page, with a fix
              available in version 26.18.02 — resolution occurred within approximately four days of detection.

              The developer-facing surface is a REST API (no GraphQL available publicly as of 2026). Authentication is
              via Bearer token (personal or service-account tokens generated within account settings). The API exposes
              endpoints for inspections, templates, users, actions, sites, and scheduling. Rate limits are endpoint-
              specific, ranging from approximately 20 to 800 requests per 60 seconds (e.g., POST /users/search allows
              200 req/60s). Webhooks provide event-driven integration triggers for inspection completions, status
              changes, and other platform events. The SafetyCulture Developer Portal (developer.safetyculture.com)
              provides live API reference documentation, authentication guides, and code samples. Open-source developer
              tooling includes: a Python SDK (github.com/SafetyCulture, 23 stars, 10 forks), an open-source Go-based
              data exporter (SafetyCulture/safetyculture-exporter, Apache-2.0, 19 GitHub stars, CLI and desktop GUI),
              and a gRPC-Web browser extension (440 GitHub stars, 70 forks) — the latter indicating internal use of gRPC
              in addition to the public REST surface.

              The Integrations Marketplace (integrations.safetyculture.com) lists 100+ pre-built connectors including
              Salesforce, Workday, BambooHR, ADP Workforce Now, Zapier, SharePoint, and third-party BI tools. A no-code
              integration builder is available for custom workflow connections. A partner program allows third-party
              developers to list apps in the marketplace. The SourceForge integrations catalog independently confirms
              the breadth of available connectors.

              The IoT sensor architecture uses a hub-and-spoke gateway model: physical sensors (Dragino LHT65S and
              compatible models) communicate via LoRaWAN protocol to a gateway device; the gateway forwards readings
              over internet (WiFi/4G) to the SafetyCulture cloud platform. Sensor data is presented in the same
              dashboard as inspections and issues, enabling threshold-triggered corrective-action workflows. The
              hardware components are sourced from Dragino Technology, a third-party IoT hardware vendor based in
              Shenzhen — this is a critical dependency not under SafetyCulture's supply or quality control.

              Data encryption is AES-256 at rest and TLS 1.2 or later in transit, with AWS infrastructure as the hosting
              layer. Customer data access is limited to essential personnel (principle of least privilege). Multi-factor
              authentication and VPN are required for internal system access. Centralized logging and threat detection
              are operational; incident response and vulnerability management programs are described as continuous
              rather than point-in-time.

              AI capabilities are marketed across template generation, course creation from uploaded documents, natural
              language querying of audit data, and automated report generation. The April 2026 acquisition of the Twine
              team (Brian Swift returning as VP AI, reporting to CEO Luke Anear) reflects a strategic push toward
              "agentic-first" AI — autonomous AI agents that can reason and act across platform workflows. As of the run
              date, publicly verifiable AI features are limited to template/course generation and NLQ-style analytics
              summaries; the agentic capability is directional rather than shipped.
            claimRefs:
              - CE014
              - CE015
              - CE016
