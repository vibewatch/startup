    title: SafetyCulture Risk Heatmap
    type: matrix
    approximationNotes: >-
      Likelihood and impact ratings are assessor judgments based on qualitative analysis of available evidence. No
      quantitative probability data is available for a private company. Cell labels reflect assessor residual severity:
      Critical means thesis-level potentially irreversible; High means material requiring remediation; Medium means
      manageable with monitoring; Low means isolated and reversible. Mitigation maturity factor (strong/partial/early)
      is also shown where available.
