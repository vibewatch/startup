      - number: '6.4'
        title: Retention, Durability, and Satisfaction Signals
        blocks:
          - type: paragraph
            body: >-
              No verified, audited NRR or GRR figures have been disclosed by SafetyCulture. Third-party analyst
              estimates cited as of 2025 place NRR at approximately 110%, with an explicit corporate target of 120% for
              FY2025-26, to be achieved primarily through multi-product expansion within the existing base. These
              estimates originate from aggregated analyst commentary and cannot be treated as confirmed financial data.

              The strongest durability evidence comes from case studies. DB Schenker has run the platform continuously
              since 2017 — an 8+ year tenure. William Hare's relationship spans "more than a decade." GROWMARK and
              ArcelorMittal Construction are multi-year users. These long-tenure enterprise relationships indicate
              strong stickiness in the enterprise segment, consistent with the platform's embedded role in daily
              compliance and safety workflows. Switching costs are materially high in enterprise deployments:
              SafetyCulture templates, inspection histories, corrective action records, training completions, and
              certification audit trails are not trivially portable to alternative platforms, and regulated customers
              face additional diligence burden in replacing a certified, compliant solution. The US VA government
              procurement record ($3,000 contract) is consistent with a trial or small-team deployment rather than
              meaningful enterprise retention.

              Review-platform data across G2 (4.6/5, 241 reviews), Capterra (4.6/5, 353 reviews), Gartner Peer Insights
              (4.0/5), and Software Advice (4.6/5, 684 reviews) as of 2026 show strong promoter sentiment. Reviewers
              consistently describe multi-year deployments and embedded workflows. Common complaints concentrate on
              pricing scaling at per-user rates for large teams, limited multi-step approval routing, restricted report
              layout customization below the enterprise tier, and a steep initial configuration curve. Connecteam's
              independent review (2026) rated the platform 7.7/10 and flagged limited scheduling and timesheet
              functionality as gaps relative to full-featured field workforce tools.

              The single highest-severity adverse customer event in the evidence base is the March 2026 retirement of SC
              Training (formerly EdApp). The shutdown affected 70,000+ organisations and 1M+ users. SafetyCulture
              offered a migration path to the core platform, but third-party analysis identified significant
              limitations: completion records and learner progress data transferred only with a paid upgrade; custom
              quizzes and certification programs required manual rebuilding; and all access and data were permanently
              deleted after April 20, 2026 for non-migrated accounts. The operational and reputational impact of this
              disruption on the overall customer base — particularly for regulated-sector customers reliant on training
              completion records for audit compliance — has not been quantified in public sources. The SMB segment is
              identified by analysts as the cohort most sensitive to pricing and therefore most exposed to logo churn,
              in contrast to the enterprise segment where workflow embeddedness provides a natural retention buffer.
