  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture delivers a unified operations platform for frontline workers, structured around eight
              integrated capability areas that span the full workplace operations workflow — from initial hazard
              identification and inspection, through corrective action, training, asset oversight, and continuous
              improvement analytics.

              The core module — Inspections (iAuditor) — enables teams to create, conduct, and share digital
              inspections, safety audits, checklists, and compliance assessments. Teams build templates from a library
              of 100,000+ public templates or author custom ones; inspections are completed on iOS or Android mobile
              apps (offline capable) or via web browser; completed inspections generate structured, shareable PDF
              reports. Conditional logic allows templates to branch based on responses, enabling sophisticated automated
              workflows without code. The company reports over 2 million inspections conducted per month on the platform
              as of 2026.

              Issues and Actions management allows any inspection finding or ad-hoc observation to be converted into an
              assignable corrective action with due date, priority, attachments, and status tracking. Issues can be
              raised independently of an inspection, enabling hazard reporting outside the structured audit workflow.
              Multiple review platforms note that complex multi-step approval chains are not supported natively; this is
              the most commonly cited workflow limitation.

              Training was delivered until 31 March 2026 through SC Training (formerly EdApp, acquired 2020, rebranded
              2024). SafetyCulture retired the standalone SC Training app on that date, consolidating training
              functionality into the core SafetyCulture platform. The consolidated training module retains mobile
              microlearning authoring (AI-assisted from documents, PDFs, or prompts), gamification (quizzes, badges,
              leaderboards), a library of 1,000+ editable expert-accredited courses, offline delivery, and learner
              analytics. The retirement affected an estimated 70,000+ organisations and 1M+ users who previously
              accessed the platform via SC Training — those who did not migrate before 20 April 2026 lost access to
              their completion histories permanently.

              Asset Management provides a centralised register of physical assets linked to inspection schedules,
              maintenance records, sensor data, and compliance certificates. Assets can be assigned to locations, teams,
              or individuals; maintenance workflows and compliance document uploads are supported. The module bridges
              physical asset oversight with the digital operations workflow, but depth is lighter than purpose- built
              CMMS tools such as MaintainX.

              Sensors (IoT monitoring) connects Dragino-manufactured LoRaWAN hardware sensors to the cloud platform via
              a gateway-bridge architecture. The standard sensor (Dragino LHT65S) monitors temperature and humidity and
              operates from -40°C to 80°C with an optional external probe extending to 125°C. Supported sensor
              categories include temperature/humidity, air quality (CO₂, TVOCs, particulate), sound/noise, pressure, and
              open/close detection. Setup is described as plug-and-play (gateway pre-configured; sensor IDs entered
              manually). Threshold-based alerts trigger notifications and can automatically spawn inspection tasks. The
              hardware dependency on a single Dragino model for the core temperature sensor is a concentration risk.

              Analytics consolidates inspection outcomes, issue resolution rates, training completions, sensor readings,
              and Heads Up engagement into configurable dashboards and heatmaps. AI-assisted analytics (launched
              2025–26) allow managers to ask natural language questions (e.g., "which sites have the lowest quality
              scores?") and receive synthesised answers from audit data. Scheduled and ad-hoc report exports are
              supported; the open- source SafetyCulture Exporter tool provides bulk data export to MSSQL, PowerBI, and
              other BI tools for Premium and Enterprise customers.

              Heads Up is a broadcast communications module designed for frontline teams without reliable email access.
              Managers create multimedia messages (text, images, video) with acknowledgment tracking, required
              electronic signatures on linked documents, threaded comments, emoji reactions, and external sharing.
              Analytics measure reach and acknowledgment rates. The module replaces informal bulletin-board or verbal
              briefing processes with a documented, auditable communication trail.

              Marketplace offers 100,000+ workplace safety and PPE products from 200+ brands via integrated e-commerce.
              Available in Australia and the United States. Customers can purchase items discovered during inspections
              directly, reducing procurement friction. The marketplace generated approximately AU$68.2M GMV in FY2025,
              contributing roughly 12% to overall revenue at approximately 48% gross margin on secondary sales — a
              higher-margin commercial activity than pure SaaS in percentage terms but still secondary to subscription
              revenue at this scale.

              Lone Worker Safety (SHEQSY) provides duress alarms, scheduled check-ins, job completion monitoring, and
              real-time worker location for isolated or remote workers. SHEQSY was acquired by SafetyCulture in April
              2022 and is progressively integrated with the core platform. The acquisition pre-dates the run date;
              claims of a separate "May 2026 SHEQSY acquisition" found in some AI-aggregated sources are incorrect —
              SHEQSY was acquired in 2022.
