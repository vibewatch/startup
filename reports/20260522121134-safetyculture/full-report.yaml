      - number: '3.2'
        title: Direct Inspection Software Peers
        blocks:
          - type: paragraph
            body: >-
              The most proximate competitive threat to SafetyCulture's core inspection product comes from a set of
              mobile-first inspection platforms targeting the same buyer persona (safety/operations/quality manager)
              with comparable checklist and audit functionality at lower or comparable per-user pricing.

              GoAudits is the most frequently cited direct peer in buyer comparison searches as of 2026. It offers a
              Starter plan at $10/user/month and an Enterprise plan at $30/user/month, both with offline mobile
              inspections, customizable checklists, instant PDF report generation, and corrective action workflows. Its
              user rating of 4.8/5 on major review platforms slightly exceeds SafetyCulture's 4.6/5 for ease of use and
              value. GoAudits is particularly strong for multi-site operations in hospitality, retail, and food
              production. It does not offer training, sensors, or marketplace modules, making it a focused inspection
              tool rather than a full platform. The per-user price advantage ($10 vs $24 annually for SafetyCulture
              Premium) is a material consideration in cost-sensitive SMB evaluations.

              Lumiform was founded in 2018 in Berlin and has raised approximately $13.1 million across three rounds
              including a Series A in July 2022. With approximately 40–47 employees and estimated revenue of ~$4.8M,
              Lumiform is substantially smaller than SafetyCulture but positioned as a faster-deploying, more intuitive
              inspection tool. Its Professional plan starts at €16/user/month with offline capability, automated
              corrective actions, and AI-powered form creation. A notable weakness is an 18% employee headcount decline
              over the past year — potentially indicating resource constraints. Lumiform lacks training, IoT, and asset
              management modules.

              Fluix, a Dublin-based document workflow and inspection tool, positions itself as the professional-grade
              alternative to SafetyCulture for high-stakes inspection environments. As of 2026, Fluix explicitly markets
              itself as superior to iAuditor for legally binding documents with tamper-proof audit trails and
              e-signatures. Fluix targets aviation, construction, and field service sectors where document integrity is
              non-negotiable. It does not offer a freemium tier and is not a direct SMB competitor but competes in
              select enterprise inspection accounts.

              Donesafe (now owned by HSI after acquisition) offers cloud-based EHS software with no-code workflow
              capabilities, useful for compliance, incident management, safety audits, and custom reporting. It is
              scalable and configurable, competing more at the lower end of the EHS suite market and at the upper end of
              the inspection peer market. Operandio competes in restaurant and franchise operations, combining
              inspections, corrective actions, and training in a single platform — directly competing with
              SafetyCulture's bundled positioning in the F&B vertical.

              Jolt, previously a food safety and restaurant operations inspection tool, was acquired by Digi
              International and shifted toward IoT sensor business units. This has increased uncertainty about Jolt's
              product roadmap for foodservice, opening space for SafetyCulture to capture displaced Jolt customers. As
              of 2026, Jolt is no longer considered a leading independent inspection software competitor.
            claimRefs:
