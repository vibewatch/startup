          - type: callout
            title: 20-year operational dataset is a durable AI moat
            body: >-
              With more than 5 petabytes of frontline workplace data and billions of images accumulated over 20 years
              across 85,000 businesses in 180+ countries, SafetyCulture holds one of the largest proprietary operational
              datasets for frontline work globally. This positions the company uniquely for AI-driven insights,
              benchmarking, and agentic capabilities that competitors cannot replicate without years of deployment.
            calloutType: strength
            claimRefs:
              - CO041
              - CO042
              - CO052
          - type: callout
            title: Profitability claim is unverified and contradicted by subsequent capital raise
            body: >-
              In March 2023, CEO Anear stated SafetyCulture had shifted from growth mode to profitability and had
              infinite runway. Yet the company raised AU$75M in new primary equity just 18 months later. This sequence
              warrants direct diligence to understand whether the profitability claim was accurate at the time, whether
              the AI platform buildout reversed profitability, or whether the capital raise was opportunistic rather
              than a necessity.
            calloutType: risk
