figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      SafetyCulture's two-decade arc runs from a garage-origin safety tool to a multi-product platform unicorn, with a
      notable 2024 valuation step-down and an unresolved CEO transition creating open diligence questions at run date.
    data:
      items:
        - date: '2004'
          label: iAuditor founded
          detail: Luke Anear starts digital safety documentation from family garage in far north Queensland.
          tone: positive
        - date: 2013-11
          label: First institutional capital
          detail: Blackbird, Cannon-Brookes, Farquhar, and Bill Tai invest $1.2M seed; $1.8M federal grant also received.
          tone: positive
        - date: 2016-10
          label: Index Ventures Series B
          detail: $23M Series B led by Index Ventures; first major global VC on the cap table.
          tone: positive
        - date: 2020-10
          label: EdApp acquisition and unicorn status
          detail: EdApp acquired at ~$40M valuation; Series C round crosses $1.3B unicorn threshold.
          tone: positive
        - date: 2021-05
          label: $76.5M Series C at $1.7B
          detail: Insight Partners leads largest round to date; US growth-stage validation.
          tone: positive
        - date: 2023-08
          label: $22M at peak $2.7B valuation
          detail: Marbruck-led round reaches valuation peak; CEO states company profitable with infinite runway.
          tone: positive
        - date: 2023-10
          label: SafetyCulture platform launch
          detail: Inaugural SafetyCulture Next event adds assets, sensors, marketplace, AI features.
          tone: positive
        - date: 2024-09
          label: Series D at $2.5B (down from $2.7B)
          detail: AU$165M round; only AU$75M new equity; AU$90M secondary; AirTree leads.
          tone: warning
        - date: 2024-11
          label: CEO transition announced
          detail: Kelly Vohs named CEO effective Jan 1, 2025; Anear to Executive Chairman. Unresolved in 2026 materials.
          tone: warning
        - date: 2026-04
          label: Twine acquisition (agentic AI)
          detail: Brian Swift returns as VP AI; agentic-first platform strategy formalized.
          tone: positive
