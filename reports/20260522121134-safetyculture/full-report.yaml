  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: standard
    summary: >-
      SafetyCulture's unit economics chain is partially observable from public data (list pricing, account count,
      headcount cost proxies) but all key metrics — gross margin, CAC, LTV, NRR, churn — are undisclosed. Nodes with
      null inputs are flagged as diligence gaps requiring data room access.
