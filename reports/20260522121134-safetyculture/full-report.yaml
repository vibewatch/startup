      - number: '8.3'
        title: Scenario Modelling and Secondary-Market Cross-Check
        blocks:
          - type: paragraph
            body: >
              Three scenarios bracket the valuation range for SafetyCulture as of May 2026. The bull case (12-15x ARR on
              AU$200M+ forward ARR = AU$2.4-3.0B) requires verified growth acceleration and AI monetisation proof. The
              base case (8-10x ARR on AU$160M FY24 revenue = AU$1.28-1.6B) is most consistent with available public data
              and prevailing private-market comps. The bear case (4-6x ARR on AU$119M Tracxn-implied ARR =
              AU$0.48-0.71B) materialises if the May 2026 restructuring reflects demand-side stress rather than
              efficiency optimisation.


              Secondary-market data provides an independent cross-check on these scenarios. PremierAlts reports
              SafetyCulture trading at approximately AU$1.72B (31% discount to primary). UpsideList notes approximately
              35% below the last primary round. William Blair's 2026 analysis shows pre-profitability unicorns in the
              AU$1-5B range trade at 25-35% secondary discounts. Flux Finance places fair value at AU$1.6-2.0B absent
              audited confirmation. These data points converge around AU$1.6-1.8B as the current market-implied value —
              consistent with the base-case comp analysis and 28-36% below the AU$2.5B primary.


              The leadership instability compounds the scenario analysis: two CEO changes in 14 months (Luke Anear to
              Kelly Vohs January 2025; Vohs out, Anear interim March 2026) concurrent with a headcount reduction of
              approximately 10% (around 170 roles) are more consistent with investor-pressure dynamics than operational
              confidence. For a company approaching IPO readiness, permanent CEO succession is a prerequisite for any
              public-market valuation process, extending the return timeline for secondary investors.
