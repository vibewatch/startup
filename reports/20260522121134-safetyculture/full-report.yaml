    title: Mitigation and kill criteria table
    layout: default
    notes: >-
      Kill criteria thresholds are assessor-defined based on analysis of SafetyCulture's disclosed strategic
      commitments, valuation structure, regulatory timeline, and comparable SaaS restructuring precedents. These are
      investment monitoring triggers, not contractual provisions.
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
