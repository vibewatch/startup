      - number: '1.4'
        title: Scale, Customers, and Global Footprint
        blocks:
          - type: paragraph
            body: >
              SafetyCulture's scale metrics as of the September 2024 funding close represent the most robustly sourced
              public data point available. Official company materials and multiple third-party news sources confirm
              85,000 businesses and close to 2 million users worldwide at the time of the round, with the company adding
              100 new roles in the prior six months to reach more than 800 employees across six offices. An updated
              headcount figure from the November 2024 Kelly Vohs appointment release cited 900 employees. However,
              UpGuard's independent security profile — updated as recently as 22 May 2026 — reports 690 employees, a
              materially lower figure. This discrepancy of roughly 210 employees could reflect timing (the company may
              have restructured or had attrition after the Nov 2024 count), or it may reflect a difference in
              methodology between official company headcount and active employee count used by UpGuard. Diligence should
              seek a verified current headcount directly from SafetyCulture.


              Named enterprise customers cited in Manchester Digital's coverage of the UK business include the NHS,
              National Grid, British Airways, and Transport for London. The Manchester office serves as the company's
              EMEA hub and, per the same source, the UK alone accounts for more than 25,000 of the 85,000 business
              customers. Craft.co's third- party profile estimates 2022 revenue of $132 million. Revenue figures are not
              officially disclosed and cannot be treated as verified; however the Tracxn funding table estimates a
              revenue multiple of approximately 21x on the $2.5B valuation, implying approximately $119 million in
              annualized revenue at the time of the 2024 round — a figure broadly consistent with Craft's $132 million
              estimate for the prior year. No current FY2025 revenue is publicly available. Platform volume metrics from
              the 2023 platform launch press release reference more than one billion checks performed annually, and
              TechFunding News reports 85,000 lessons delivered daily through the EdApp training module. SafetyCulture
              also claims to have accumulated more than 5 petabytes of workplace data and billions of images from its
              global deployment base.
