  - id: TM004
    title: Growth Drivers and Constraints Table
    layout: standard
    notes: >-
      Drivers and constraints are sourced from analyst reports, EHS practitioner surveys, and buyer-behavior research.
      Timing is relative to 2026. Diligence asks reflect open questions that SafetyCulture's go-to-market and pricing
      strategy should address.
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for SafetyCulture
      - Diligence Ask
    rows:
      - - OSHA electronic recordkeeping mandates (US)
        - Driver
        - Active / near-term
        - Forces mid-market manufacturers and contractors onto digital EHS platforms; creates compliance urgency
        - Confirm SafetyCulture's OSHA audit-trail coverage and ILO 45001 alignment documentation
      - - APAC EHS regulatory tightening (Safe Work AU, India OSHWC, China GB standards)
        - Driver
        - Active / accelerating through 2026–2028
        - Tailwind for SafetyCulture in its home market; APAC is fastest-growing region for compliance software
        - Assess SafetyCulture's APAC regulatory coverage depth and localization investment roadmap
      - - AI-enabled frontline risk detection and predictive safety
        - Driver
        - Emerging / near-term
        - >-
          90% of EHS leaders intend AI investment; AI-native platforms differentiate; Twine acquisition positions
          SafetyCulture
        - Verify AI feature roadmap and whether agentic capabilities are production-ready or aspirational
      - - Digital transformation replacing paper / spreadsheet EHS workflows
        - Driver
        - Structural / ongoing
        - >-
          Massive conversion opportunity — paper-based workflows dominate SMB segment; SafetyCulture's fast-deploy model
          fits
        - Quantify SAR (software attach rate) among 2.7B deskless worker addressable base
      - - CSRD / ESG sustainability reporting mandates (EU and multinational)
        - Driver
        - Active for large entities; extends to mid-market 2026–2028
        - >-
          Creates new buyer tier (sustainability/ESG leads); may extend SafetyCulture into adjacent ESG reporting
          workflows
        - Determine SafetyCulture's ESG reporting roadmap and whether it is in scope for CSRD alignment
      - - SMB willingness-to-pay ceiling
        - Constraint
        - Structural / ongoing
        - Only ~15% of SMBs have adopted EHS software; conversion requires low-friction, low-cost entry
        - Disclose SafetyCulture's pricing tiers, freemium conversion rate, and average SMB contract value
      - - Incumbent EHS suite lock-in (Intelex, Cority, VelocityEHS, Enablon/Wolters Kluwer)
        - Constraint
        - Structural / ongoing
        - >-
          Large enterprise accounts are entrenched; migration costs are high due to data integration and change
          management
        - Quantify SafetyCulture's enterprise displacement win rate and average sales cycle length
      - - ROI proof difficulty and change management friction
        - Constraint
        - Structural / ongoing
        - EHS buyers cannot model incident-reduction ROI in advance; slows budget approval cycles
        - >-
          Obtain SafetyCulture's customer ROI data (incident reduction, audit pass rate, training completion) for
          go-to-market collateral
