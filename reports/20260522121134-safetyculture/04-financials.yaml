  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - missing metric
      - impact on diligence
      - exact diligence path
    rows:
      - - Audited revenue (any year)
        - Cannot confirm revenue level, growth rate, or quality; all estimates are unverified third-party inferences
        - Request audited P&L for FY2023, FY2024, FY2025 from SafetyCulture directly
      - - Gross margin by revenue segment
        - Cannot assess unit economics or margin trajectory; marketplace drag unknown
        - Request gross profit waterfall by stream (SaaS / marketplace / insurance / training)
      - - ARR waterfall (new, expansion, contraction, churn)
        - Cannot assess whether revenue growth is driven by new logo vs expansion vs retention
        - Request quarterly ARR waterfall for the last 8 quarters
      - - Operating profit / loss (EBIT/EBITDA)
        - Cannot confirm Mar 2023 profitability claim; cannot assess capital adequacy
        - Request P&L with operating expense breakdown; confirm any one-time items
      - - Balance sheet (cash, debt, working capital)
        - Cannot assess liquidity position, debt obligations, or true capital runway
        - Request most recent audited balance sheet; confirm credit facilities
      - - CAC and LTV by segment
        - Cannot assess GTM efficiency or return on S&M investment
        - Request sales and marketing cost and revenue attribution by customer cohort
      - - NRR and gross churn
        - Cannot assess revenue quality; cannot model future ARR trajectory
        - Request NRR by cohort and gross churn rate by customer segment
      - - Insurance GWP and take-rate
        - Cannot assess scale or margin of the insurance revenue stream
        - Request total GWP placed via SafetyCulture platform; commission or take-rate applied
      - - Marketplace GMV and take-rate
        - Cannot assess marketplace revenue or margin contribution
        - Request annual GMV; disclose take-rate or margin on marketplace transactions
      - - Headcount post-May 2026 layoffs
        - Cannot assess current run-rate cost base or severity of restructuring
        - Request current total headcount by function and geography; confirm impact of layoffs
    notes: >-
      Each gap in this table represents a material unknown that materially affects valuation, capital adequacy, and
      revenue quality assessment. The UK "small company" filings at Companies House provide balance sheet data only;
      full group accounts including the Australian parent entity (SafetyCulture Pty Ltd) are not publicly available.
    sectionRefs:
      - section-5

figures:
  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: wide
    summary: >-
      SafetyCulture converts platform engagement across 85,000 business accounts into revenue through three distinct
      mechanisms: subscription fees (primary), marketplace commissions (secondary), and insurance take-rates
      (emerging). The bridge illustrates the monetization pathway from user acquisition through gross profit,
      with the freemium tier representing both scale and a conversion cost center.
    data:
      nodes:
        - id: user-acquisition
          label: 2M+ platform users; 85,000 accounts
          detail: Company-claimed as of Sep 2024. Includes free, lite, and paid seat holders.
          tone: positive
        - id: free-tier
          label: Free tier (≤10 users, $0)
          detail: Zero revenue; drives acquisition and eventual conversion. Up to 5 templates, basic analytics.
          tone: neutral
        - id: premium-subscription
          label: Premium SaaS ($5 Lite / $24 Full per user/month)
          detail: Primary revenue stream. Annual billing. Enterprise at custom pricing. Estimated $90–132M ARR.
          tone: positive
        - id: marketplace
          label: Marketplace procurement (GMV take-rate)
          detail: 75,000+ products; US and Australia. GMV and take-rate undisclosed. Lower margin than SaaS.
          tone: neutral
        - id: insurance
          label: Embedded insurance (commission / take-rate)
          detail: QBE/Allianz underwriting. Risk profiling from 5PB inspection data. Scale and margin undisclosed.
          tone: neutral
        - id: gross-profit
          label: Gross profit (margin undisclosed)
          detail: Blended SaaS ~70–80%; marketplace ~10–30%; insurance potentially high but small scale. Mix unknown.
          tone: warning
      edges:
        - from: user-acquisition
          to: free-tier
        - from: user-acquisition
          to: premium-subscription
        - from: user-acquisition
          to: marketplace
        - from: user-acquisition
          to: insurance
        - from: premium-subscription
          to: gross-profit
        - from: marketplace
          to: gross-profit
        - from: insurance
          to: gross-profit
    approximationNotes: >-
      Revenue stream magnitudes are based on estimates; no audited split between SaaS, marketplace, and insurance
      revenue is publicly available. Gross margin ranges are benchmarks, not company-reported. The free-tier node
      represents the dominant acquisition channel but zero-revenue use of platform capacity.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI007
      - CI021
      - CI031
      - CI032

  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: standard
    summary: >-
      SafetyCulture's unit economics chain is partially observable from public data (list pricing, account count,
      headcount cost proxies) but all key metrics — gross margin, CAC, LTV, NRR, churn — are undisclosed.
      Nodes with null inputs are flagged as diligence gaps requiring data room access.
    data:
      nodes:
        - id: list-arpu
          label: List ARPU ceiling ~$6,768/account/year
          detail: 23.5 avg users × $24 × 12. Theoretical maximum if all seats are full Premium annual.
          tone: neutral
        - id: realized-arpu
          label: Realized ARPU ~$1,062–1,553/account/year
          detail: Derived from $90.3M–$132M ARR estimate ÷ 85,000 accounts. Suppressed by freemium and Lite seats.
          tone: warning
        - id: gross-margin
          label: Gross margin — UNDISCLOSED
          detail: Blended SaaS/marketplace/insurance gross margin not published. Estimated 60–75% range.
          tone: warning
        - id: cac
          label: CAC — UNDISCLOSED
          detail: "Customer acquisition cost not published. B2B SaaS benchmark: $2-3 per $1 new ARR."
          tone: warning
        - id: payback
          label: Payback period — estimated 2.7–4 yrs
          detail: Derived from CAC benchmark and realized ARPU estimate. High; mitigated if enterprise mix improves.
          tone: warning
        - id: nrr
          label: NRR — UNDISCLOSED
          detail: Multi-module platform structurally supports NRR >100%; no published figure.
          tone: warning
        - id: unit-econ-verdict
          label: Unit economics verdict — insufficient public data
          detail: Cannot confirm value-creating unit economics without gross margin, CAC, LTV, and NRR disclosure.
          tone: adverse
      edges:
        - from: list-arpu
          to: realized-arpu
        - from: realized-arpu
          to: gross-margin
        - from: gross-margin
          to: cac
        - from: cac
          to: payback
        - from: gross-margin
          to: nrr
        - from: payback
          to: unit-econ-verdict
        - from: nrr
          to: unit-econ-verdict
    approximationNotes: >-
      All figures in this bridge are derived from unverified estimates, benchmarks, or structural inferences.
      No node reflects an audited or company-reported unit economics figure. Nodes labeled UNDISCLOSED require
      data room access to populate. The realized ARPU is an average across a very heterogeneous account base;
      enterprise accounts likely carry substantially higher ARPU, while SMB and free accounts dilute the average.
    claimRefs:
      - CI008
      - CI019
      - CI020
      - CI021
      - CI023
      - CI024

  - id: FI003
    title: Financial Estimate Range
    type: range
    layout: standard
    summary: >-
      Third-party revenue estimates for SafetyCulture span a wide range ($90–201M USD) reflecting different metrics
      (ARR vs total revenue), different time periods, and different estimation methodologies. The AFR-reported FY2023
      figure ($132M) is the highest-credibility external reference. All figures are unaudited.
    data:
      items:
        - label: GetLatka — ARR estimate (Nov 2025)
          low: 85.0
          mid: 90.3
          high: 96.0
          note: SaaS ARR only; founder-interview or model-derived. Source data updated Nov 2025. USD millions.
        - label: Tracxn multiple-implied ARR (Sep 2024 valuation)
          low: 105.0
          mid: 119.0
          high: 133.0
          note: Derived from AU$2.5B valuation at ~21x ARR multiple (Tracxn). Highly sensitive to multiple assumption.
        - label: AFR-reported total revenue FY2023 (per SmartCompany)
          low: 125.0
          mid: 132.0
          high: 140.0
          note: AFR cited $132M total revenue for FY ending June 2023; 32% growth YoY. Highest-credibility external figure.
        - label: Growjo total revenue estimate (2024)
          low: 185.0
          mid: 201.2
          high: 220.0
          note: Likely reflects total revenue including non-recurring streams or a different reporting period. Less reliable.
    approximationNotes: >-
      Low/mid/high bounds per item represent estimated confidence intervals around the point estimate, not stated
      ranges from the source. All values are USD millions. These estimates cannot be summed; each represents a
      different analyst's view of a different metric (ARR vs total revenue) at different time periods. The AFR
      figure is the most credible external reference as it originates from primary journalism. No audited revenue
      has been published.
    claimRefs:
      - CI009
      - CI011
      - CI035

  - id: FI004
    title: Capital Intensity and Cash-Flow Map
    type: flow
    layout: wide
    summary: >-
      SafetyCulture's capital flows illustrate the tension between the 2023 profitability claim and the 2024 equity
      raise, the dominance of secondary transactions in the 2024 round, the constraint of filing as a small company
      in the UK, and the 2026 restructuring signal. Cash position is unconfirmed; runway is inferred.
    data:
      nodes:
        - id: total-capital
          label: ~$298–408M total raised (USD)
          detail: Tracxn ($298M) to GetLatka ($408M) range; includes 11 disclosed rounds. Details in Company Overview.
          tone: positive
        - id: sep2024-raise
          label: AU$75M new primary equity (Sep 2024)
          detail: AU$165M headline; AU$90M (55%) was secondary sales by existing investors. Airtree led at AU$40M.
          tone: neutral
        - id: secondary-sales
          label: AU$90M secondary — investor liquidity
          detail: Blackbird early funds and other existing holders sold shares. Well below AU$500M 2023 target.
          tone: warning
        - id: profitability-claim
          label: "Mar 2023: CEO claims profitable / infinite runway"
          detail: Luke Anear publicly stated SafetyCulture had reached profitability and needed no external funding.
          tone: warning
        - id: cash-position
          label: Cash position — UNCONFIRMED
          detail: AU$75M raised Sep 2024; post-deployment balance unknown. Estimated AU$30–60M as of Q1 2026.
          tone: warning
        - id: may2026-layoffs
          label: May 2026 restructuring — undisclosed scale
          detail: Product and customer success teams cut; Manchester/Austin disproportionate. Signals cost pressure.
          tone: adverse
        - id: uk-filing
          label: UK small-company filings (June 2025 accounts)
          detail: SAFETYCULTURE (UK) LIMITED (11007705); small-company exemption limits P&L disclosure to balance sheet.
          tone: neutral
        - id: runway-verdict
          label: Runway — insufficient public data
          detail: Estimated 6–18 months from Sep 2024 raise at inferred burn; unconfirmed; requires data room access.
          tone: warning
      edges:
        - from: total-capital
          to: sep2024-raise
        - from: sep2024-raise
          to: secondary-sales
        - from: sep2024-raise
          to: cash-position
        - from: profitability-claim
          to: sep2024-raise
        - from: cash-position
          to: may2026-layoffs
        - from: may2026-layoffs
          to: runway-verdict
        - from: uk-filing
          to: runway-verdict
    approximationNotes: >-
      Cash position and runway figures are inferred from known capital events and headcount-based burn estimates.
      The monthly burn estimate of AU$8–14M is based on published headcount (929 employees) multiplied by a
      blended employment cost rate for a multi-geography tech company. All capital figures in AU$ unless noted
      as USD. The UK filing confirms legal entity existence and accounts filing date, not financial performance.
    claimRefs:
      - CI013
      - CI015
      - CI016
      - CI017
      - CI026
      - CI028
      - CI029
      - CI034

callouts:
  - calloutType: risk
    title: Profitability claim is inconsistent with subsequent capital raise
    body: >-
      In March 2023, Luke Anear publicly stated SafetyCulture had achieved profitability and held infinite runway.
      Eighteen months later, the company accepted a AU$200 million valuation step-down to raise AU$75 million in
      new primary equity. The most likely explanations are that AI/enterprise investment spending reversed the
      profitability position, or the raise was opportunistic. Either way, an investor relying on the 2023
      profitability claim without audited financials confirmation is exposed to an unverified assumption.
    claimRefs:
      - CI016
      - CI013
      - CI015

  - calloutType: risk
    title: May 2026 layoffs and headcount decline signal unconfirmed cost pressure
    body: >-
      SafetyCulture's headcount declined from 989 (2024) to 929 (2025, Revelio Labs) and was further reduced via
      May 7, 2026 layoffs of undisclosed scale. Geographic consolidation toward Brisbane from Manchester and Austin
      suggests cost rationalization is active. These signals — combined with undisclosed burn and runway — create
      material uncertainty about whether the AU$75M raise provided adequate runway to profitability.
    claimRefs:
      - CI025
      - CI026
      - CI027

  - calloutType: risk
    title: Revenue multiple is high for the level of financial disclosure
    body: >-
      At approximately 21x implied ARR (Tracxn), SafetyCulture's AU$2.5 billion valuation is at the high end
      for a private company with no audited financials, undisclosed unit economics, and an observable post-2024
      headcount reduction trend. Investors should require audited P&L, ARR waterfall, and runway confirmation
      before pricing at or above the Sep 2024 reference valuation.
    claimRefs:
      - CI011
      - CI039
      - CI040

  - calloutType: insight
    title: UK Companies House filing confirms active entity but limits financial transparency
    body: >-
      SAFETYCULTURE (UK) LIMITED (company number 11007705) is confirmed active with accounts filed through June 2025.
      The small-company exemption means public accounts are balance-sheet only — no profit and loss statement is
      disclosed. This is the only formal corporate filing publicly available for any SafetyCulture entity globally;
      the Australian parent Pty Ltd is a proprietary company with non-public ASIC filings.
    claimRefs:
      - CI028
      - CI029
      - CI030

