  - id: TI003
    title: Unit Economics Table
    columns:
      - metric
      - value / estimate
      - confidence
      - why it matters
      - diligence ask
    rows:
      - - Gross margin (blended)
        - Not disclosed; inferred 60–75% blended (lower than pure SaaS 70–80% due to marketplace/insurance mix)
        - low — inference only
        - Determines cash generation per revenue dollar; marketplace drag could materially compress margins
        - "Request P&L with segment gross margin split: SaaS, marketplace, insurance"
      - - Average revenue per account (ARPA) — implied
        - ~$1,062/year ($90.3M ARR ÷ 85,000 accounts); ~$1,553/year ($132M ÷ 85,000 accounts)
        - low — numerator and denominator are estimates / company claims
        - Low ARPA signals heavy freemium base; must understand free vs paid account split
        - Confirm paid account count separately; disclose ARR per paid customer
      - - Average users per account
        - ~23.5 (2M users ÷ 85,000 accounts)
        - low — both inputs are company-claimed
        - Drives theoretical price ceiling; actual blended seat type mix unknown
        - Request breakdown of full vs lite vs free seat distribution
      - - Customer acquisition cost (CAC)
        - "Not disclosed; B2B SaaS benchmark: $2-3 per $1 new ARR (2024-2025)"
        - not available — benchmark only
        - Central unit economics driver; determines payback period and sales efficiency
        - Request blended CAC by segment (SMB vs enterprise), including all S&M costs
      - - CAC payback period
        - Not disclosed; estimated 2.7–4.0 years at benchmark CAC at implied gross margin
        - not available — derived from unverified inputs
        - High payback periods increase capital intensity; shorter cycles indicate better GTM efficiency
        - Request actual CAC payback by cohort; compare to industry benchmark of 12–18 months
      - - Net revenue retention (NRR)
        - Not disclosed; platform multi-module design structurally supports NRR >100%
        - not available — inference only
        - NRR >100% allows revenue growth without new logo acquisition; critical SaaS quality metric
        - Request NRR by cohort; confirm whether expansion revenue offsets churn
      - - Gross churn rate
        - Not disclosed; SMB-weighted book likely sees higher churn than enterprise
        - not available
        - High gross churn would require heavy new logo acquisition to maintain ARR trajectory
        - Request gross and net churn by customer segment (SMB / mid-market / enterprise)
      - - LTV:CAC ratio
        - Not disclosed; at 3:1 industry minimum (SaaS benchmark) implies LTV ~$3–9K per account
        - not available — benchmark only
        - Below 3:1 indicates inefficient growth; above 5:1 indicates strong unit economics
        - Provide LTV:CAC by cohort; confirm revenue recognition treatment for multi-year contracts
    notes: >-
      No SafetyCulture-specific unit economics data is publicly available. All values labeled "not available" or
      "inference only" represent structural inferences and industry benchmarks, not company-reported data. The
      implied ARPA calculation uses unverified denominators (both ARR estimate and customer count are not audited).
