  evidenceGaps:
    - id: GI001
      gapType: private-evidence-only
      severity: material
      description: >-
        SafetyCulture has never published audited financial statements, revenue breakdowns, or unit economics
        data. All revenue figures in this chapter are third-party estimates or inferences from available proxies.
        The Australian parent entity (SafetyCulture Pty Ltd) is a proprietary limited company with non-public
        ASIC filings. The UK subsidiary files as a small company (balance sheet only), providing no P&L. The
        combination makes SafetyCulture one of the most financially opaque AU$2.5 billion companies covered in
        this report. No meaningful financial underwriting is possible from public information alone.
      relatedQuestionRefs:
        - QI008
        - QI011
        - QI019
        - QI024

    - id: GI002
      gapType: conflicting-data
      severity: material
      description: >-
        Third-party revenue estimates span a $90–201M USD range reflecting different metrics (ARR vs total
        revenue), time periods, and estimation methodologies. GetLatka ($90.3M ARR, Nov 2025), AFR-reported
        ($132M total revenue FY2023), Tracxn-implied (~$119M ARR at 2024 valuation), and Growjo ($201.2M total
        revenue) cannot all be simultaneously correct. The most credible single figure is the AFR-reported
        $132M for FY2023 (tier-one journalism, 32% YoY growth confirmed), but even this is unaudited.
      relatedQuestionRefs:
        - QI011
        - QI012
        - QI014

    - id: GI003
      gapType: missing-source
      severity: material
      description: >-
        SafetyCulture's capital adequacy — specifically its confirmed post-September 2024 cash balance, monthly
        burn rate, months of runway, and any outstanding debt or credit facilities — is entirely undisclosed.
        The May 2026 layoffs suggest cost optimization pressure, but the severity (undisclosed headcount
        reduction) prevents any reliable inference about the remaining cash runway or proximity to the next
        capital event.
      relatedQuestionRefs:
        - QI025
        - QI026
        - QI027

    - id: GI004
      gapType: missing-source
      severity: material
      description: >-
        SafetyCulture's marketplace GMV, take-rate, and gross margin contribution; its insurance GWP placed,
        commission rate, and revenue contribution; and the revenue split between SaaS, marketplace, and insurance
        are not publicly available. These omissions prevent assessment of blended gross margin, which is
        material to capital adequacy and valuation analysis.
      relatedQuestionRefs:
        - QI009
        - QI010

    - id: GI005
      gapType: missing-source
      severity: blocking
      description: >-
        SafetyCulture has not disclosed NRR, gross churn by customer segment, LTV:CAC ratio, or CAC payback
        period. Without these metrics, the revenue quality and unit economics of the platform cannot be
        independently assessed. The 85,000 customer count and 2M user claim are company-reported and unaudited;
        the split between free, Lite, and paid accounts is unknown. These data points are blocking for any
        investor seeking to underwrite the AU$2.5 billion valuation.
      relatedQuestionRefs:
        - QI005
        - QI007
        - QI008
        - QI029
        - QI030

    - id: GI006
      gapType: missing-source
      severity: minor
      description: >-
        The exact headcount impact of the May 2026 layoffs has not been publicly disclosed. The Revelio Labs
        figure of 929 employees (2025) predates the May 2026 restructuring; current headcount is unknown.
        The UpGuard figure of 690 (May 2026) remains potentially indicative but is based on a different
        measurement methodology.
      relatedQuestionRefs:
        - QI021
        - QI022

