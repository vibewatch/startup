  - id: section-2
    title: Public Traction Proxies and Revenue Estimates
    body: >
      Because SafetyCulture does not publish audited financials, investors and analysts must rely on company-claimed
      operating metrics, third-party database estimates, and investor commentary to triangulate revenue scale. The
      most robustly sourced public figures are from the September 2024 funding close: 85,000 business customers,
      close to 2 million users across 180+ countries, and more than 800 employees across six offices. The company
      also stated it had seen record growth in sign-ups and its average customer had doubled in size over the prior
      two years — consistent with an intentional up-market push toward larger enterprise accounts.


      Third-party revenue estimates diverge significantly and must be treated as unverified proxies. GetLatka — a
      SaaS metrics database that often sources figures from founder interviews — estimates $90.3 million ARR as of
      November 2025 with 838 employees listed at that date. Growjo and CompWorth have cited total revenue estimates
      of approximately $201.2 million, likely reflecting a broader revenue base including marketplace and insurance
      transactions, or a different time period. The Australian Financial Review — a tier-one Australian business
      publication — reported that SafetyCulture generated $132 million in revenue for the financial year ending
      June 2023, a 32% increase over the prior year, per SmartCompany's coverage of the August 2023 funding round.
      This AFR-cited figure is the highest-credibility external reference available for SafetyCulture's revenue,
      though it remains unaudited. Extrapolating the 32% growth rate forward to FY2024 would imply approximately
      $174 million; at any plausible growth trajectory from that base, FY2025 revenue could plausibly range from
      $130–200 million USD depending on growth deceleration and forex effects.


      A revenue multiple proxy is also available: Tracxn has published a roughly 21x revenue multiple implied by
      the AU$2.5 billion 2024 valuation, which at that multiple implies approximately $119 million in annualized
      revenue. The range across these four data points — $90M ARR, $119M (multiple-implied), $132M (AFR FY2023),
      $201M (Growjo estimate) — reflects genuine uncertainty rather than analytical inconsistency, as each measures
      a different thing (ARR vs total revenue, different fiscal periods, different inclusion of non-recurring streams).
      The most defensible position is to treat SafetyCulture's revenue as "in the $100–180M USD range" as of
      FY2024–2025, flagging this as a medium-confidence estimate pending audited disclosure.


      Training volume and platform usage metrics provide ancillary traction proxies: over 700 million inspections
      completed on the platform as of 2023 platform launch commentary, and millions of lessons delivered via
      SC Training (formerly EdApp) — figures that reflect platform engagement but do not directly translate to
      revenue without knowing the conversion rate to paid modules. Employee headcount, per Revelio Labs workforce
      analytics, was 929 in 2025 (down 6.3% from 989 in 2024), with 100 new roles added in the six months before
      the September 2024 close per the official press release. The post-funding headcount trajectory (decline
      from 989 to 929, followed by a May 2026 restructuring) is consistent with cost optimization pressure.
