  evidenceGaps:
    - id: GO001
      gapType: private-evidence-only
      severity: material
      description: >-
        SafetyCulture's revenue, operating profit/loss, gross margins, and annual recurring revenue growth rate
        are not publicly disclosed. The company is private, no financial filings are available, and the only
        revenue data is a Craft estimate for FY2022 ($132M USD) and a Tracxn multiple-implied figure (~$119M).
        Without audited financials, the March 2023 profitability claim, the efficiency of capital deployment, and
        valuation justification cannot be independently verified. The number of active customer businesses
        (85,000 stated) and daily active users lack independent verification, and methodology for counting
        "businesses" or "users" has not been disclosed. Additionally, no information on SafetyCulture's pricing
        tiers, contract sizes, or freemium/paid mix is publicly available.
      relatedQuestionRefs:
        - QO014
        - QO013
        - QO004
        - QO005
        - QO020

    - id: GO002
      gapType: conflicting-data
      severity: blocking
      description: >-
        The CEO identity is genuinely ambiguous at run date. A November 2024 official release names Kelly Vohs as
        CEO from January 1, 2025. Yet the April 2026 Twine acquisition press release, the company's own team page
        (22 May 2026), and UpGuard's independent profile (22 May 2026) all name Luke Anear as CEO. This conflict
        cannot be resolved from publicly available information alone and requires direct company confirmation.
      relatedQuestionRefs:
        - QO006
        - QO019
      relatedTableRefs:
        - TO002

    - id: GO003
      gapType: conflicting-data
      severity: material
      description: >-
        SafetyCulture's headcount as of run date is disputed: the company stated 900 in November 2024, but UpGuard's
        independent profile (updated 22 May 2026) shows 690 employees. This 210-person gap may reflect a
        restructuring, attrition, or a methodological difference between official company headcount and UpGuard's
        data source. Neither scenario has been confirmed by official company statement in 2026. Confirmed office
        locations (Sydney, Manchester, Kansas City) account for only 3 of the 6 offices stated; 3 additional
        locations were not identified from public sources.
      relatedQuestionRefs:
        - QO002
        - QO012
        - QO010

    - id: GO004
      gapType: missing-source
      severity: material
      description: >-
        SafetyCulture's board composition, voting rights, investor consent thresholds, and employee equity plan
        details are not publicly disclosed. The governance structure for a AU$2.5 billion private company with
        multiple institutional investors (AirTree, Blackbird, Index, Insight, Morpheus, super funds) warrants
        diligence room confirmation of these terms, as they materially affect control, liquidation preferences,
        and decision-making in a change-of-control or IPO scenario. The company's stated 2032 target of reaching
        hundreds of millions of workers lacks specific interim milestones or revenue thresholds that would indicate
        progress; no growth trajectory data (ARR growth rate, customer acquisition rate) has been publicly released.
      relatedQuestionRefs:
        - QO009
        - QO022
        - QO025
      relatedTableRefs:
        - TO003

    - id: GO005
      gapType: missing-source
      severity: minor
      description: >-
        Financial terms for the Twine acquisition (April 2026) were not disclosed in the official press release
        or any identified third-party coverage. The deal appears to be a talent-oriented acqui-hire, but the
        consideration amount (cash, equity, or both), any earnouts, and the impact on SafetyCulture's balance
        sheet are unknown.
      relatedQuestionRefs:
        - QO016
      relatedTableRefs:
        - TO004

    - id: GO006
      gapType: missing-source
      severity: material
      description: >-
        No publicly available data breach history, regulatory action history, or data privacy incident log exists
        for SafetyCulture. UpGuard identifies web security configuration issues but does not report any known
        breach events. SafetyCulture handles sensitive operational data from critical infrastructure operators
        (NHS, National Grid, British Airways), making a thorough data-privacy and security-incident review a
        material diligence requirement. Additionally, SafetyCulture's complete product line for 2025-2026
        (including new AI modules, sensor integrations, and any post-Twine-acquisition AI agents) has not been
        fully enumerated in official materials; the company's pricing structure and vertical-specific customer
        breakdown (by industry and geography) are also not publicly available.
      relatedQuestionRefs:
        - QO026
        - QO011
        - QO008
        - QO017
        - QO027

