callouts:
  - calloutType: risk
    title: CEO identity is materially ambiguous as of run date
    body: >-
      A November 2024 press release announced Kelly Vohs as CEO effective January 1, 2025, with Anear becoming
      Executive Chairman. Yet the current team page, the April 2026 Twine acquisition release, and UpGuard's May
      2026 profile all list Luke Anear as CEO. This is not a minor labeling inconsistency — it creates genuine
      uncertainty about board authority, key-person concentration, and whether the Vohs appointment was reversed.
      Any investment or partnership decision should require written board confirmation of the current CEO structure.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO053

  - calloutType: insight
    title: AU$90M secondary component reveals investor liquidity pressure
    body: >-
      Of the AU$165M 2024 Series D headline, only AU$75M was new primary equity. The remaining AU$90M was secondary
      sales by existing shareholders, including Blackbird's early funds exiting positions held for over a decade.
      This is a rational end-of-fund-life action but also signals that early investors priced liquidity over waiting
      for a higher exit valuation — a signal that later-chapter valuation analysis should treat carefully.
    claimRefs:
      - CO024
      - CO025
      - CO026
      - CO028

  - calloutType: strength
    title: 20-year operational dataset is a durable AI moat
    body: >-
      With more than 5 petabytes of frontline workplace data and billions of images accumulated over 20 years
      across 85,000 businesses in 180+ countries, SafetyCulture holds one of the largest proprietary operational
      datasets for frontline work globally. This positions the company uniquely for AI-driven insights,
      benchmarking, and agentic capabilities that competitors cannot replicate without years of deployment.
    claimRefs:
      - CO041
      - CO042
      - CO052

  - calloutType: risk
    title: Profitability claim is unverified and contradicted by subsequent capital raise
    body: >-
      In March 2023, CEO Anear stated SafetyCulture had shifted from growth mode to profitability and had infinite
      runway. Yet the company raised AU$75M in new primary equity just 18 months later. This sequence warrants direct
      diligence to understand whether the profitability claim was accurate at the time, whether the AI platform
      buildout reversed profitability, or whether the capital raise was opportunistic rather than a necessity.
    claimRefs:
      - CO031
      - CO032
      - CO057

