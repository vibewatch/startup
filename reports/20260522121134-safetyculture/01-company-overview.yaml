  - id: section-2
    title: Leadership, Governance, and Key-Person Dependence
    body: >
      SafetyCulture's governance and leadership structure contains a material ambiguity that must be resolved through
      direct diligence contact. A November 2024 official press release announced that Kelly Vohs — a former CEO of
      LivCor, a Blackstone portfolio company — would assume the CEO role effective 1 January 2025, with Luke Anear
      transitioning to Executive Chairman to focus on long-term vision and board stewardship. However, the April 2026
      announcement of the Twine acquisition credits Luke Anear as "CEO and Founder," and UpGuard's independent company
      profile (updated 22 May 2026) also lists Anear as CEO. The current SafetyCulture team webpage as of run date
      lists Luke Anear as Chief Executive Officer, with no mention of Kelly Vohs. This conflict across official and
      third-party sources as of the run date creates genuine ambiguity about which individual holds operational
      authority, a fact materially relevant to key-person concentration analysis.


      Setting aside the CEO ambiguity, the executive team visible on SafetyCulture's official leadership page as of run
      date includes Luke Anear (listed as CEO), Edelita Tichepco (Chief Financial Officer), Tom Dance (Chief Technology
      Officer), Hamish Grant (Chief Operating Officer), Anna Wenngren (Chief People Officer), and Phil Goldie (Global
      Head of Sales). The team page also references "Mike Welch" as Managing Director, SC Training per Craft's executive
      profile. SafetyCulture does not publish a formal board composition publicly, though the investor base (Airtree,
      Blackbird, Morpheus Ventures, Index Ventures, Hostplus, HESTA) implies board representation from at least Airtree
      and Blackbird given their lead investor roles in recent rounds.


      Key-person dependence on Luke Anear is a material diligence theme regardless of his current title. Anear is the
      company's public face, the architect of its mission and culture narrative, and the executive cited in every major
      press release including the most recent 2026 Twine acquisition. The Kelly Vohs CEO appointment was explicitly
      framed as allowing Anear to "focus on further developing the long-term vision" — suggesting Anear's strategic
      weight remains central. Any succession scenario, role clarification, or leadership transition should be examined
      in depth before relying on this chapter's leadership picture as ground truth.
