  - id: section-3
    title: Capital, Valuation, and Investor Map
    body: >
      SafetyCulture has raised approximately $298 million across eleven disclosed funding rounds since its first seed
      in November 2013, according to Tracxn's funding database. The company's most recent and largest disclosed round
      was a September 2024 Series D of AU$165 million that valued SafetyCulture at AU$2.5 billion (approximately
      $1.65 billion USD at contemporaneous exchange rates). That headline figure, however, deserves careful
      disaggregation: Startup Daily's independent reporting confirmed that only AU$75 million of the AU$165 million
      represented new primary equity, while approximately AU$90 million consisted of secondary transactions in which
      existing investors and employees sold existing shares rather than the company receiving new capital. Blackbird
      Ventures' managing partner Rick Baker explicitly acknowledged that Blackbird's early funds — having held
      SafetyCulture shares for over a decade — sold down some of their positions. The new equity was led by AirTree
      Ventures (contributing AU$40 million), joined by existing investors Blackbird Ventures and Morpheus Ventures,
      plus Australian superannuation funds Hostplus and HESTA co-investing alongside Blackbird.


      The AU$2.5 billion valuation also represents a step-down from the AU$2.7 billion post-money valuation reached
      in August 2023 during a $22 million raise led by Marbruck Investments — an adverse signal in a private market
      context where valuation haircuts can reflect both market multiple compression and negotiating leverage dynamics.
      Prior to 2023, the valuation trajectory was strongly upward: a $800 million Series C in April 2020, a $1.3
      billion valuation after an October 2020 round (Insight Partners lead), and a $1.7 billion valuation after a
      May 2021 round also led by Insight Partners alongside Tiger Global and Index Ventures. Total capital raised per
      Tracxn's database is $298 million, though this figure excludes any undisclosed secondary transaction volumes.


      Founder Luke Anear stated publicly in March 2023 that SafetyCulture had shifted "from a growth mode to being
      profitable" and had "infinite runway," and that the company did not need ongoing VC funding. The decision to
      raise a $75 million primary round in September 2024 despite that statement is a diligence point worth exploring
      to understand whether the profitable characterization was accurate, or whether it reflected a strategic pivot
      framing that was later revisited as enterprise expansion costs accelerated with AI investment requirements.
