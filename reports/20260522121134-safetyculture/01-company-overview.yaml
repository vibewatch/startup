  - id: section-5
    title: Milestones, Acquisitions, and Product Evolution
    body: >
      SafetyCulture's corporate history spans more than two decades and encompasses a well-documented trajectory from
      a single-purpose digital checklist to a multi-product workplace operations platform. The company's founding in
      2004 in far north Queensland predates the modern smartphone era; iAuditor was rebuilt as a mobile app as
      smartphones proliferated, and the company received its first institutional backing in November 2013 when
      Blackbird Ventures led a $1.2 million seed round alongside Atlassian founders Mike Cannon-Brookes and Scott
      Farquhar, and US investor Bill Tai — a notable pedigree for an Australian seed company. Subsequent rounds
      through Blackbird, Index Ventures (Series B lead, October 2016), Tiger Global (Series C co-lead, May 2018),
      Insight Partners (October 2020 and May 2021), and Marbruck Investments (August 2023) reflect a clean
      institutional progression from Australian seed to global growth-stage investor syndicate.


      SafetyCulture's first and most transformative acquisition was EdApp in 2020, a Sydney-based mobile
      microlearning platform valued at approximately $40 million, with SafetyCulture paying approximately $29 million
      for a controlling stake (having previously invested $9 million over two years). The strategic rationale was
      integration of training into the safety-and-inspection workflow, and EdApp was rebranded SC Training following
      deeper platform integration. As of the 2023 platform launch, SC Training delivers approximately 85,000 lessons
      daily across 90+ countries.


      The October 2023 SafetyCulture platform launch at the company's inaugural "SafetyCulture Next" event represented
      the most significant product expansion since the company's founding, adding asset management, IoT/sensor
      monitoring, a marketplace, video communications (Heads Up), and AI-assisted inspection template generation and
      training course creation. In April 2026, SafetyCulture announced the acquisition of Twine, a Sydney-based AI
      startup, primarily to bring back VP Brian Swift (a former SafetyCulture VP of Product who had co-founded Twine)
      and accelerate the company's "agentic platform" ambitions. The Twine acquisition reflects a clear strategic
      bet that AI-native operations tooling will be the next competitive battleground for frontline workflow software.
