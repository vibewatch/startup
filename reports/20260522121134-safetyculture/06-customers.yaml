- id: expansion-concentration
  title: Expansion Motion, Concentration, and Channel Risk
  body: 'SafetyCulture''s expansion motion is well-evidenced in the case study base and conforms to a classic land- and-expand
    pattern. Initial deployments consistently begin with a single use case — almost universally inspections/iAuditor — and
    expand horizontally to Issues/Actions, Heads Up, Training, Asset Management, Sensors, Analytics, and Marketplace. DB Schenker
    started with audits and incident reporting in 2017 before adding Heads Up communications as a newer use case. William
    Hare added Sensors in its paint shop and welding stores after years on inspections. SSP began with open/close checklists
    and incident reporting before expanding to full food safety audits and asset management. Tennis Australia uses inspections,
    training, Heads Up, asset management, and induction workflows across six operational areas of the Australian Open.

    Within-account expansion is structurally supported by the platform''s cross-module workflow: an inspection finding automatically
    routes to an Issue/Action; issues can spawn training tasks; sensor readings trigger inspection workflows; completed assets
    appear in inspection schedules; and analytics consolidate all signals. This integration increases switching costs and
    expansion surface area simultaneously.

    Revenue expansion risk is concentrated in two areas. First, SMB accounts represent the weakest retention cohort, and the
    per-user pricing model creates friction as teams scale. Second, the SC Training retirement disrupted 70,000+ organisations
    — a potential source of unrecorded logo churn whose magnitude is unknown. Enterprise concentration among the disclosed
    customer base appears low; no single named customer is cited as representing a material revenue share. The UK represents
    a substantial geographic concentration (25,000+ of 85,000 businesses), with no explicit regional revenue breakdown available.

    Channel is primarily direct: SafetyCulture sells via direct enterprise sales (with Phil Goldie as Global Head of Sales)
    and self-serve/PLG for SMB and mid-market. There is no confirmed large-channel reseller or distribution partnership driving
    material revenue. The Salesforce integration is cited in independent reviews as a frequently used connector but does not
    imply Salesforce as a distribution channel. The marketplace (75,000+ products, 200+ brands) creates a commercial ecosystem
    around the core platform but is an in-platform transaction layer, not a channel for acquiring new customers. Procurement
    risk from the absence of a large reseller channel is moderate: growth depends on continued direct sales capacity and self-serve
    conversion, which may limit speed into highly regulated or government verticals where channel relationships are structurally
    important for enterprise procurement.'
