  evidenceGaps:
  - id: EGU001
    gapType: private-evidence-only
    severity: high
    description: SafetyCulture has not disclosed audited NRR, GRR, annual logo churn, or contract length data by segment.
      Analyst estimates (NRR ~110%) are modeled figures from secondary sources and cannot be treated as confirmed retention
      metrics. Enterprise retention appears strong based on case study tenure, but SMB churn rate is unknown. Confirmed financial
      retention data is a critical diligence gap.
    diligenceAsk: 'Request: (1) audited NRR and GRR by segment (SMB, mid-market, enterprise) for FY2024 and FY2025; (2) gross
      logo churn rate and average contract length by tier; (3) revenue breakdown by geography; (4) number of customers using
      2+ modules vs. 1 module.'
    relatedQuestionRefs:
    - QU019
    - QU030
    - QU006
    - QU008
    - QU009
  - id: EGU002
    gapType: private-evidence-only
    severity: high
    description: The impact of the SC Training/EdApp retirement (March 2026) on customer retention, NRR, and revenue is not
      publicly quantified. The number of 70,000+ affected organisations that successfully migrated to the core platform versus
      churned to competitors is unknown. Regulated-sector customers who lost training completion records face unquantified
      compliance exposure.
    diligenceAsk: 'Request: (1) number of SC Training customers who migrated to core platform vs. churned; (2) NRR impact
      for the SC Training cohort in the 12 months post-retirement; (3) any regulatory complaints or audits arising from loss
      of completion records.'
    relatedQuestionRefs:
    - QU022
    - QU023
    - QU021
    - QU024
  - id: EGU003
    gapType: no-public-evidence
    severity: medium
    description: NHS, National Grid, British Airways, and Transport for London are cited as UK customers but no detailed deployment
      case study, outcome data, or contractual evidence exists in the public domain. These are logo-level references only;
      deployment depth and commercial significance are unknown.
    diligenceAsk: Request named enterprise case study materials or reference calls for NHS and National Grid; ask whether
      these accounts represent recurring ARR or transient free/trial usage.
    relatedQuestionRefs:
    - QU003
    - QU017
    relatedTableRefs:
    - TU003
  - id: EGU004
    gapType: no-public-evidence
    severity: medium
    description: SafetyCulture has not published a channel partner program or SI reseller disclosure. Whether any channel
      program exists or is planned — and whether channel partners are responsible for any material portion of ARR — is unknown
      from public evidence.
    diligenceAsk: 'Ask management: (1) existence and maturity of any reseller/SI channel program; (2) % of ARR from channel
      vs. direct; (3) government/regulated-sector vertical strategy given direct-only model.'
    relatedQuestionRefs:
    - QU026
    - QU027
  - id: EGU005
    gapType: no-public-evidence
    severity: low
    description: The Qantas case study (iAuditor, 70% LTI frequency reduction, $500M projected savings) is referenced only
      through a SlideShare-hosted PDF without a confirmed date or current relationship status. No post-2023 evidence of continued
      Qantas engagement exists. Whether Qantas remains a current customer and at what scale cannot be confirmed from public
      evidence.
    diligenceAsk: Ask management to confirm whether Qantas remains an active customer; obtain updated case study or reference
      if so; clarify original case study date.
    relatedQuestionRefs:
    - QU016
  - id: EGU006
    gapType: no-public-evidence
    severity: medium
    description: SafetyCulture does not disclose government or enterprise tender wins, contract values, or whether any large
      reseller channel contributes to ARR. The US VA procurement record ($3,000 value) is the only public procurement evidence
      and is pilot-scale. Whether any single enterprise customer represents >5% of ARR is unknown. Average contract length
      and precise pricing by tier are not disclosed in any public filing.
    diligenceAsk: 'Ask management: (1) whether any government tender wins or notable enterprise procurement records exist
      that can be shared; (2) whether any single customer exceeds 5% of ARR; (3) standard contract terms by segment.'
    relatedQuestionRefs:
    - QU018
    - QU028
  - id: EGU007
    gapType: no-public-evidence
    severity: low
    description: A direct comparison of SafetyCulture customer profiles versus competitors Intelex, EHS Insight, and Cority
      — including named logos, vertical composition, and deal size benchmarks — is not available in public sources. Competitor
      customer lists are not publicly disclosed in sufficient detail to enable a rigorous side-by-side comparison.
    diligenceAsk: Request win/loss analysis from management; ask for competitive displacement data and which verticals SafetyCulture
      is most commonly chosen over alternatives.
    relatedQuestionRefs:
    - QU029
