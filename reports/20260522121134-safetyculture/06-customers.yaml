  title: Customers
  summary: 'SafetyCulture serves approximately 85,000 businesses and close to 2 million users across 180+ countries as of
    September 2024, with the UK alone accounting for 25,000+ businesses. The customer base spans construction, manufacturing,
    aviation, logistics, hospitality, agriculture, healthcare/public sector, and large-scale events, with named, production-grade
    deployments confirmed at ArcelorMittal Construction (43 European sites, 4,848 audits/year, 5,000 hours saved), DB Schenker
    (75,000 global employees; UK/Ireland: 1,800 staff, 28 facilities, using platform since 2017), William Hare (2,400 employees,
    180,000+ inspections completed, 10+ years), SSP (airports food and beverage, 100+ sites, 99.6% on-time food safety inspection
    completion, 82% improvement in worker understanding), Tennis Australia/Australian Open (14,000 staff trained, 12,000 contractors
    onboarded, since 2021), GROWMARK (9,000+ staff, 100+ sites, $1M+ savings from "good catch" reporting), and Level 10 Construction
    (200+ staff, 2.5M man hours with no lost time incident). Enterprise customers in aviation include London City Airport
    (paperless inspections replacing 5,000 annual paper sheets) and, historically, Qantas. UK blue-chip logos include NHS,
    National Grid, British Airways, and Transport for London. Review-platform sentiment is strong (G2: 4.6/5 from 241 reviews;
    Capterra: 4.6/5 from 353 reviews; Software Advice: 4.6/5 from 684 reviews), with recurring complaints concentrated around
    per-user pricing scaling, limited multi-step approval chains, and advanced reporting customization. The primary adverse
    customer event is the March 2026 retirement of SC Training/EdApp, which disrupted 70,000+ organisations and 1M+ users
    with limited data portability. NRR is estimated by analysts at ~110% (FY2024, unconfirmed), with enterprise retention
    stronger than SMB, and an explicit target to push NRR toward 120% through multi-product expansion. The land-and-expand
    motion is observable in the evidence base, with most detailed case studies showing customers starting on inspections and
    subsequently adding Issues/Actions, Training, Sensors, Heads Up, and Asset Management. Top concentration and channel risks
    include SMB churn sensitivity, SC Training disruption, and no confirmed large-channel partnerships.'
sections:
- id: customer-segmentation
  title: Customer Base Segmentation
  body: 'SafetyCulture''s customer base is structurally diverse, spanning buyer type (operations/safety managers as buyers;
    frontline workers as primary users; businesses as payers), geography, vertical, organizational size, and use case. The
    company reported 85,000 businesses and close to 2 million users across 180+ countries as of its September 2024 Series
    D announcement; the UK alone accounts for 25,000+ businesses. The EMEA team is headquartered in Manchester, North American
    operations are based in Kansas City, and the company''s home market is Australia. While exact country-level splits are
    not disclosed, the geographic emphasis is Australia, UK, and the United States.

    By vertical, the evidence base confirms production-grade deployments in construction (Level 10 Construction, William Hare,
    ArcelorMittal Construction, Thermosash Group), manufacturing and steel (ArcelorMittal, William Hare, Schindler elevators),
    logistics and transport (DB Schenker, Transport for London), airport/aviation (London City Airport, SSP at Australian
    airports), hospitality and food service (FISHBOWL, SSP, Australian Open venues), agriculture/agricultural retail (GROWMARK),
    large-scale events (Tennis Australia / Australian Open since 2021), and public sector/healthcare (NHS, US Department of
    Veterans Affairs). Logos without detailed deployment evidence include British Airways and National Grid in the UK.

    By size, SafetyCulture''s model addresses a wide range: the free/starter tier attracts SMBs and individual inspectors,
    while Premium and Enterprise tiers serve large, multi-site organizations. The most detailed case studies (ArcelorMittal,
    DB Schenker, William Hare, GROWMARK) all reflect enterprise-scale deployments with hundreds to thousands of employees
    and 10+ simultaneous SafetyCulture modules in production. The explicit SMB churn concern surfaced by analyst commentary
    indicates that the SMB segment — where price sensitivity is higher — is structurally weaker than the enterprise cohort.

    The primary buyer is typically a Health, Safety, Quality, and Environment (HSQE) manager, National Safety Manager, or
    Operations Director. The primary user is the frontline worker completing inspections, raising issues, and receiving training
    on mobile. The payer is the organization. In enterprise accounts, central procurement involves an IT or legal review,
    but the product''s self-serve trial capability means that departmental adoption frequently precedes formal enterprise
    procurement — a characteristic land-and-expand motion.'
