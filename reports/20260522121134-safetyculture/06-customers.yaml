- id: adoption-trajectory
  title: Adoption Trajectory and Platform Scale
  body: 'SafetyCulture''s publicly reported user and customer metrics show a pattern of steady growth since the iAuditor launch
    in 2004, with a material acceleration following the 2023 unified platform launch and the September 2024 Series D raise.
    The headline metrics as of the September 2024 announcement are: 85,000 businesses, close to 2 million users, 180+ countries.
    Earlier disclosures (2023 platform launch era) cited approximately 75,000 organisations and 1.5 million monthly users,
    indicating approximately 10,000-to-15,000 net new businesses added in a roughly 12-month period and a meaningful lift
    in monthly active user count. The platform claims over 2 million inspections conducted per month and a public template
    library exceeding 100,000 templates.

    Vertical-level adoption indicators are more granular: ArcelorMittal Construction runs nearly 5,000 safety audits annually
    across 43 European production sites; William Hare has completed over 180,000 inspections over 10+ years with 500+ custom
    templates; DB Schenker has run audits, incident reports, and Heads Up communications across 28 UK/Ireland facilities continuously
    since 2017; GROWMARK connected 9,000+ staff across 100+ sites; SSP Australia/New Zealand scaled from 34 to 100+ sites
    in 2024 with SafetyCulture as the enabling system; and Tennis Australia processed 2,400 inspections, 29,000 inductions,
    and trained 14,000 staff for the 2025 Australian Open.

    The freemium-to-paid conversion funnel is material. SafetyCulture offers a free tier (limited to 3 users and 3 template
    exports) that functions as a top-of-funnel acquisition channel, drawing in teams who self-discover the product and organically
    expand. Review-platform data on Software Advice (684 reviews, 4.6/5) and Capterra (353 reviews, 4.6/5) indicates a large
    and active user community that self-discovered and self-evaluated the product — consistent with a product-led growth motion.
    However, analyst estimates of paid customers (~25,000 paying companies vs. 85,000 total businesses and 1.5M+ monthly users)
    suggest that a significant proportion of the customer base remains on free or minimal-spend tiers, representing an important
    conversion and monetization challenge as growth matures.'
