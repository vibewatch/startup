figures:
- id: FU001
  title: SafetyCulture Customer Journey Map
  type: journey-map
  approximationNotes: Journey stages are inferred from case study evidence and review-platform data. Time durations within
    stages are qualitative estimates; no confirmed average sales cycle data is publicly disclosed. Enterprise stages are based
    on DB Schenker, William Hare, and ArcelorMittal case study trajectories; SMB stages are based on review-platform user
    descriptions and freemium-model conventions.
  claimRefs:
  - CU001
  - CU002
  - CU007
  - CU032
  - CU033
  - CU034
  data:
    items:
    - id: stage-awareness
      label: Awareness
      actor: HSQE Manager / Operations Director / Safety Manager
      description: Discovers SafetyCulture via peer referral, industry conference, direct sales outreach, or self-directed
        search for digital inspection or checklist software. SMB and mid-market frequently discover through organic web search
        or template library browsing. Enterprise may enter via direct sales contact or partner recommendation.
      channels:
      - Direct enterprise sales
      - Organic search (template library)
      - Peer referral / industry event
      - Review platforms (G2, Capterra)
    - id: stage-trial
      label: Free Trial / Pilot
      actor: HSQE Manager and small inspection team
      description: Evaluates via free tier (3 users, 3 template exports) or limited enterprise pilot. Builds first custom
        templates, completes initial inspections, and assesses mobile app usability on iOS/Android. Self-serve setup is rapid
        (same-day start for basic inspections). Enterprise may run a 30–90 day scoped pilot with a specific team or site.
      channels:
      - Self-serve free tier sign-up
      - Sales-assisted enterprise pilot
    - id: stage-purchase
      label: Purchase and Initial Deployment
      actor: Operations Director / Procurement (enterprise); HSQE Manager (SMB)
      description: 'Converts to Premium or Enterprise plan. Initial deployment covers a single use case (inspections/ iAuditor)
        and a defined user population. Template library accelerates setup: 100,000+ public templates provide starting points
        for industry-specific checklists. Training of frontline workers on mobile app is the primary onboarding task. Enterprise
        accounts may require IT security review (ISO 27001, SOC 2).'
      channels:
      - Self-serve upgrade (SMB)
      - Enterprise direct sales / contract negotiation
    - id: stage-expansion
      label: Expansion
      actor: HSQE Manager + wider Operations team
      description: 'Adds modules sequentially as the first use case proves value. Pattern confirmed across case studies: Inspections
        → Issues/Actions → Heads Up → Training → Asset Management → Sensors. GROWMARK, DB Schenker, William Hare, and Tennis
        Australia each demonstrate multiple modules in concurrent production use. ARR per customer grows through seat expansion
        and module addition. Marketplace and insurance create additional commercial touchpoints within the platform workflow.'
      channels:
      - In-product upsell prompts
      - Customer success / account management
    - id: stage-mature
      label: Embedded / Renewal
      actor: HSQE team + C-suite (for enterprise renewal)
      description: 'Platform becomes the operational system of record for safety, quality, and compliance. Switching cost
        is high: inspection templates, action histories, training completions, sensor configurations, and certification audit
        trails are embedded. Long-tenure accounts (DB Schenker 8+ years, William Hare 10+ years) demonstrate structural stickiness.
        Enterprise renewals are multi-year; SMB annual. Adverse events (SC Training retirement, pricing changes) create at-risk
        moments.'
      channels:
      - Annual / multi-year enterprise renewal
      - SMB self-serve renewal
