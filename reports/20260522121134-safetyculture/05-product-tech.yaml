  evidenceGaps:
    - id: EGE001
      gapType: private-evidence-only
      severity: high
      description: >-
        SC Training / EdApp retirement customer impact — the actual churn rate, revenue impact, and
        number of customers who successfully migrated versus lost their data is not publicly disclosed.
        SafetyCulture has not published any post-retirement customer retention statistics. The
        estimated 70,000+ organisation impact is from third-party sources; the actual compliance
        exposure faced by regulated-sector customers who lost completion history is unknown.
      relatedQuestionRefs:
        - QE013
      diligenceAsk: >-
        Request from management: (1) number of SC Training customers who migrated to core platform
        vs. churned vs. lost data; (2) any regulatory incidents or customer complaints arising from
        the data loss; (3) NRR impact for the SC Training cohort in the 12 months following retirement.

    - id: EGE002
      gapType: private-evidence-only
      severity: high
      description: >-
        Agentic AI product roadmap — no public product roadmap exists for SafetyCulture's "agentic-first"
        AI capability. The April 2026 Twine acquisition confirms talent investment and strategic direction
        but no shipping timeline, feature specification, or technical architecture for agentic capabilities
        is publicly available. The gap between CEO-level aspiration and verifiable shipped product is
        material for buyers evaluating AI as a procurement criterion.
      relatedQuestionRefs:
        - QE020
        - QE022
      diligenceAsk: >-
        Request from management: (1) written specification of agentic AI features with target
        ship dates; (2) demonstration of current NLQ analytics and AI template generation in a
        live environment; (3) disclosure of any third-party AI providers (OpenAI, Anthropic, AWS
        Bedrock) underlying AI features.

    - id: EGE003
      gapType: restricted-access
      severity: moderate
      description: >-
        Data residency and AWS region configuration — SafetyCulture does not publicly disclose which
        AWS regions host which customer data. For EU/GDPR-regulated enterprise customers and highly
        regulated sectors (healthcare, financial services), documented data residency is a procurement
        requirement. The absence of public region disclosure prevents independent verification.
      relatedQuestionRefs:
        - QE017
      diligenceAsk: >-
        Request from SafetyCulture: (1) list of AWS regions in use for each geographic customer
        segment (AU, US, EU, UK); (2) data residency commitment in the Data Processing Addendum;
        (3) confirmation of any EU-only data isolation for GDPR compliance.

    - id: EGE004
      gapType: private-evidence-only
      severity: moderate
      description: >-
        SHEQSY integration depth and asset management depth — the SHEQSY acquisition announcement
        (April 2022) stated integration with iAuditor and EdApp was "underway." As of May 2026 (four years
        post-acquisition), the depth of cross-module integration between SHEQSY (lone worker) and the core
        inspections/issues/analytics platform is not publicly documented. Similarly, the depth of the asset
        management module relative to purpose-built CMMS tools (MaintainX, UpKeep) is not independently
        benchmarked in available public sources.
      relatedQuestionRefs:
        - QE015
        - QE016
      diligenceAsk: >-
        Request from management: product demo showing SHEQSY-triggered inspection and corrective
        action workflow; documentation of SHEQSY data visibility in SafetyCulture Analytics;
        head-to-head feature comparison of asset management module vs MaintainX for maintenance-heavy
        industrial use cases.

    - id: EGE005
      gapType: private-evidence-only
      severity: low
      description: >-
        SafetyCulture does not publish a contractual SLA for platform uptime. Practical uptime
        evidence (99.7–100% from public monitoring) is strong, but the absence of a contractual
        commitment limits the platform's suitability for regulated-sector procurement processes
        that require documented uptime guarantees. The specific terms of enterprise SLAs are
        available only via the sales process.
      relatedQuestionRefs:
        - QE009
      diligenceAsk: >-
        Request SafetyCulture enterprise SLA documentation, including contractual uptime percentage,
        measurement methodology, credits/remedies for breach, and any tier-specific SLA differences.
