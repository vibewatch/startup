  - id: trust-security-compliance
    title: Trust, Security, Privacy, and Compliance
    body: >-
      SafetyCulture's security program is anchored by two independent certifications: ISO 27001:2022 (global
      information security management standard) and SOC 2 Type II (AICPA Trust Services Criteria for security,
      availability, and confidentiality). Both certifications are confirmed on SafetyCulture's public security
      page (safetyculture.com/security) and are independently referenced across multiple review platforms.
      ISO 27001 is renewed on a recertification cycle; SOC 2 Type II is annually attested by an independent
      auditor. Together these certifications are required for most enterprise procurement decisions and are
      competitive table stakes for the EHS/operations SaaS category.

      Data is encrypted at rest with AES-256 and in transit with TLS 1.2 or later. Customer data is hosted
      on AWS and segregated by access controls — only essential personnel can access customer data, with MFA
      and VPN required for internal system access. A public-facing Trust Center allows enterprise buyers to
      access security documentation, certifications, and whitepapers for due diligence without a formal NDA.

      Privacy and data protection obligations include GDPR (for EU data subjects), Australian Privacy Act
      compliance (for Australian customers), and applicable US state privacy regulations. Data residency
      details — specifically which AWS regions hold which customer data — are not fully disclosed in public
      documentation, which is a diligence ask for regulated-sector enterprise customers. SafetyCulture's
      privacy policy is publicly available but the exact data-retention schedule and deletion process are
      not independently verified.

      Compliance tooling within the product supports HACCP-aligned temperature monitoring for food
      manufacturing and hospitality, occupational safety regulatory compliance documentation (OSHA-relevant
      in the US), and sector-specific certification programs available through SC Training course library
      (1,000+ editable accredited courses, though the SC Training platform has been retired into the core
      platform). The platform explicitly disclaims being specialized EHS management software, stating that
      users should evaluate whether features align with their specific operational requirements — a meaningful
      caveat for regulated industries requiring process safety, occupational health, or environmental modules.

      The security posture has a minor documented gap: independent security scanner UpGuard (noted in Chapter
      1's company overview) flagged cookie security and Content Security Policy (CSP) weaknesses on the
      SafetyCulture web presence. These are surface-level web security issues rather than platform security
      failures, but they indicate imperfect security hygiene on the marketing and application web layer.
