  - id: product-tech-risks
    title: Product and Technical Risk Assessment
    body: >-
      Six product and technology risks merit diligence scrutiny, ordered by estimated materiality.

      Risk 1 — SC Training / EdApp retirement and data portability failure (High severity). The abrupt
      retirement of the SC Training platform on 31 March 2026 — affecting 70,000+ organisations and 1M+
      users — represents the most consequential recent platform execution. Completion records, learner progress,
      and historical performance data were not fully transferable: only users on a paid upgrade path could
      migrate data cleanly; others faced permanent loss after 20 April 2026. This creates customer trust and
      retention risk for any organisation that suffered data loss, and signals a product consolidation strategy
      that prioritises platform simplicity over backward compatibility. The training capability is now part of
      the core SafetyCulture platform, but the migration friction leaves a gap in customer relationship quality.

      Risk 2 — AI claims versus shipped evidence (Medium-High severity). SafetyCulture's marketing positions
      the platform as an "AI-powered" and "agentic-first" product. Publicly verifiable AI features as of the
      run date are limited to: AI-assisted template generation from documents, AI course authoring from PDFs,
      and NLQ-style analytics queries (summarising audit findings). The April 2026 Twine acquisition (AI
      team, not product) is talent investment, not a shipped capability. CEO Anear's quote — "From the minute
      I wake up until I go to sleep, I'm working on how we move to an agentic-first experience" — positions
      agentic AI as an aspiration. The gap between marketing claims and verifiable features is a diligence risk
      if buyers are purchasing on the basis of AI capabilities not yet delivered.

      Risk 3 — Hardware (IoT) supply dependency on Dragino Technology (Medium severity). The core IoT
      temperature sensor (Dragino LHT65S, LoRaWAN, Shenzhen-manufactured) represents a single-vendor hardware
      dependency outside SafetyCulture's supply chain control. Sensor supply disruption, quality failures,
      or price increases would affect the IoT monitoring product line. SafetyCulture's own documentation
      acknowledges that additional sensors must be requested via the customer success manager — suggesting
      limited self-serve sensor procurement flexibility.

      Risk 4 — Platform complexity and workflow customisation ceiling (Medium severity). As an eight-module
      platform assembled primarily through acquisition (EdApp 2020, SHEQSY 2022, Twine team 2026), SafetyCulture
      carries integration complexity risk. Fluix's 2026 review (a direct competitor, so stance is adverse)
      documents that task workflows are one-directional, multi-step approval chains are not supported natively,
      and advanced reporting layouts require significant workarounds or external integration. G2 and Capterra
      reviews corroborate: analytics dashboard customisation is limited outside higher pricing tiers; editing
      published TSA templates requires rebuilding. These limitations suggest an engineering backlog in cross-
      module workflow depth.

      Risk 5 — Integration dependency (Medium-Low severity). SafetyCulture's value proposition in enterprise
      accounts increasingly depends on integration quality with HR systems (Workday, ADP, BambooHR), CRM
      (Salesforce), and BI tools. Third-party marketplace integrations are operated by integration partners,
      not SafetyCulture engineering, which creates quality and reliability variability. API rate limits
      (20–800 req/60s) may constrain high-frequency data-pipeline integrations.

      Risk 6 — No public SLA and contractual uptime uncertainty (Low-Medium severity). Practical uptime
      based on status page and third-party monitors is 99.7–100%. However, no contractual SLA is publicly
      disclosed; enterprise buyers cannot rely on a published SLA for procurement, and the absence of a public
      SLA may limit enterprise deal closure in regulated sectors requiring documented uptime commitments.
