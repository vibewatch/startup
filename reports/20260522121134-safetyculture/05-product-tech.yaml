figures:
  - id: FE001
    title: SafetyCulture Product Architecture Stack
    type: stack
    layout: wide
    summary: >-
      Four-layer logical architecture from user-facing capability modules down to infrastructure,
      illustrating the platform's module breadth and the infrastructure dependencies that underpin
      each layer. Layer arrangement is logical (not necessarily reflecting microservices topology).
    data:
      layers:
        - label: Frontline Engagement Layer
          detail: >-
            Modules used directly by frontline workers: mobile inspections (iAuditor), Heads Up
            broadcast messages, training delivery (consolidated module), and lone worker safety
            (SHEQSY). All mobile-first; offline capable; iOS and Android native apps.
          items:
            - "Inspections / iAuditor (100,000+ templates; 2M+ inspections/month)"
            - "Heads Up communications (broadcast, acknowledgment tracking, multimedia)"
            - "Training module (AI course builder; 1,000+ courses; microlearning; offline)"
            - "SHEQSY lone worker safety (duress alarm; check-in; location monitoring)"
        - label: Operations Management Layer
          detail: >-
            Modules used by supervisors and operations managers to assign, track, and resolve
            operational issues and asset compliance: Issues/Actions, Asset Management, and
            IoT Sensor Monitoring. Connected to frontline modules and analytics.
          items:
            - "Issues and Actions (corrective action assignment; due-date tracking; media attachment)"
            - "Asset Management (asset register; maintenance schedules; compliance certs)"
            - "IoT Sensor Monitoring (Dragino LoRaWAN sensors; threshold alerts; gateway bridge)"
        - label: Intelligence and Commerce Layer
          detail: >-
            Cross-module insight and commercial transaction surfaces: Analytics dashboards and
            AI-assisted querying, and the Marketplace for in-inspection product procurement.
          items:
            - "Analytics (heatmaps; NLQ AI querying; scheduled exports; site-level benchmarking)"
            - "Marketplace (100,000+ SKUs; 200+ brands; AU and US; FY2025 GMV ~AU$68.2M)"
            - "AI features (template generation; course authoring; agentic AI in development)"
        - label: Integration and Infrastructure Layer
          detail: >-
            Developer-facing APIs, integration connectors, open-source export tooling, and
            the AWS cloud infrastructure layer that underpins all platform modules.
          items:
            - "REST API + webhooks (developer.safetyculture.com; Bearer token auth; 20–800 req/60s)"
            - "Integrations Marketplace (100+ connectors: Salesforce, Workday, BambooHR, Zapier)"
            - "SafetyCulture Exporter (Go; open-source; Apache-2.0; CLI + GUI)"
            - "AWS cloud hosting (multi-region; AES-256 at rest; TLS 1.2+ in transit)"
    approximationNotes: >-
      Internal microservices topology, database stack, CDN provider, and specific AWS region
      configuration are not publicly disclosed. Layer boundaries are logical groupings, not
      deployment unit boundaries. IoT hardware layer (Dragino) sits below the integration layer
      as a physical dependency. AI feature status: template/course generation confirmed shipped;
      agentic AI in development (not confirmed shipped as of 2026-05-22).
    claimRefs:
