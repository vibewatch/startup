callouts:
  - calloutType: risk
    title: SC Training / EdApp retirement created permanent data portability failure for customers
    body: >-
      SafetyCulture retired the SC Training platform (formerly EdApp) on 31 March 2026, with data
      deletion after 20 April 2026. An estimated 70,000+ organisations and 1M+ users were affected.
      Completion records and learner progress data were not fully transferable without a paid upgrade
      path. Users who did not act lost historical training records permanently. This is not a minor
      migration friction issue — for organisations in regulated industries (healthcare, food manufacturing,
      construction safety) where training completion records are compliance documentation, the data loss
      represents a potential regulatory and legal exposure. Any investor or enterprise buyer should
      request SafetyCulture's customer retention data segmented by the SC Training cohort to assess
      the churn and reputation impact from this event.
    claimRefs:
      - CE003
      - CE039

  - calloutType: risk
    title: Agentic AI is a strategic direction, not a shipped product as of May 2026
    body: >-
      SafetyCulture's "agentic-first" positioning is a CEO-level aspiration confirmed in the April 2026
      Twine acquisition press release. Verifiable shipped AI features are limited to template generation
      from documents, AI-assisted course creation, and NLQ-style analytics querying. The gap between
      the "AI-powered" and "agentic" marketing narrative and the current shipped capability is material
      for buyers evaluating AI as a procurement criterion. The Twine team acquisition adds AI talent
      (Brian Swift, VP AI) but not immediate product capability. Diligence should include a product
      demo of current AI features and a written commitment on the roadmap for agentic capabilities,
      including timelines and verification criteria.
    claimRefs:
      - CE005
      - CE042

