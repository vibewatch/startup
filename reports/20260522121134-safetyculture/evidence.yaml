  - id: GM002
    gapType: conflicting-data
    type: conflicting-data
    severity: material
    topic: EHS-market-size-analyst-disagreement
    description: >-
      Published 2026 EHS software market estimates range from $2.48 billion (Mordor Intelligence) to $8.9 billion (The
      Business Research Company), a 3.6x spread. This is not measurement error but reflects genuine boundary differences
      between analyst definitions of "EHS software." Without methodology reconciliation, these estimates cannot be
      aggregated or compared directly, making a single-number TAM unreliable.
    missingEvidence: >-
      Analyst methodology disclosures for each EHS software estimate — specifically whether services are included,
      geographic scope, and which product categories are in-scope.
    whyItMatters: >-
      Investors relying on one estimate (e.g., $8.9B) as the TAM may overstate the addressable market relative to a
      software-only definition. The correct boundary choice depends on SafetyCulture's actual revenue composition.
    diligencePath: >-
      Commission a bottom-up sizing from an independent analyst using SafetyCulture's product perimeter as the boundary
      definition, or request a methodology memo from the analyst whose estimate most closely aligns with SafetyCulture's
      product mix.
