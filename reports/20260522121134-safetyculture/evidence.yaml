      SafetyCulture handles sensitive operational data from critical infrastructure operators (NHS, National Grid,
      British Airways), making a thorough data-privacy and security-incident review a material diligence requirement.
      Additionally, SafetyCulture's complete product line for 2025-2026 (including new AI modules, sensor integrations,
      and any post-Twine-acquisition AI agents) has not been fully enumerated in official materials; the company's
      pricing structure and vertical-specific customer breakdown (by industry and geography) are also not publicly
      available.
