    description: >-
      SafetyCulture's board composition, voting rights, investor consent thresholds, and employee equity plan details
      are not publicly disclosed. The governance structure for a AU$2.5 billion private company with multiple
      institutional investors (AirTree, Blackbird, Index, Insight, Morpheus, super funds) warrants diligence room
      confirmation of these terms, as they materially affect control, liquidation preferences, and decision-making in a
      change-of-control or IPO scenario. The company's stated 2032 target of reaching hundreds of millions of workers
