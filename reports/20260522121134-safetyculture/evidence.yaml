evidenceGaps:
  - id: GO001
    gapType: private-evidence-only
    severity: material
    description: >-
      SafetyCulture's revenue, operating profit/loss, gross margins, and annual recurring revenue growth rate are not
      publicly disclosed. The company is private, no financial filings are available, and the only revenue data is a
      Craft estimate for FY2022 ($132M USD) and a Tracxn multiple-implied figure (~$119M). Without audited financials,
      the March 2023 profitability claim, the efficiency of capital deployment, and valuation justification cannot be
      independently verified. The number of active customer businesses (85,000 stated) and daily active users lack
      independent verification, and methodology for counting "businesses" or "users" has not been disclosed.
      Additionally, no information on SafetyCulture's pricing tiers, contract sizes, or freemium/paid mix is publicly
      available.
    relatedQuestionRefs:
      - QO014
      - QO013
      - QO004
      - QO005
      - QO020
  - id: GO002
    gapType: conflicting-data
    severity: blocking
    description: >-
      The CEO identity is genuinely ambiguous at run date. A November 2024 official release names Kelly Vohs as CEO from
      January 1, 2025. Yet the April 2026 Twine acquisition press release, the company's own team page (22 May 2026),
      and UpGuard's independent profile (22 May 2026) all name Luke Anear as CEO. This conflict cannot be resolved from
      publicly available information alone and requires direct company confirmation.
    relatedQuestionRefs:
      - QO006
      - QO019
    relatedTableRefs:
      - TO002
  - id: GO003
    gapType: conflicting-data
    severity: material
    description: >-
      SafetyCulture's headcount as of run date is disputed: the company stated 900 in November 2024, but UpGuard's
      independent profile (updated 22 May 2026) shows 690 employees. This 210-person gap may reflect a restructuring,
      attrition, or a methodological difference between official company headcount and UpGuard's data source. Neither
      scenario has been confirmed by official company statement in 2026. Confirmed office locations (Sydney, Manchester,
      Kansas City) account for only 3 of the 6 offices stated; 3 additional locations were not identified from public
      sources.
    relatedQuestionRefs:
