      - ["Clinical-stage metabolic and neurology assets", null, "No public list or realized pricing disclosed", "No public contracting, distribution, or realized-net-price disclosure", "Kriya medicines page"]
      - ["Private-company secondary / investor data access", "Accredited access gate rather than public price sheet", "Marketplace page advertises access to valuation and financial data, not public economics", "Underlying data are not visible from the accessible page", "EquityZen marketplace page"]
    notes: "Null price cells mean the assigned public evidence did not disclose list price, net price, or contract structure."
    claimRefs: [CI001, CI002, CI004, CI014, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Disclosed revenue / ARR", null, "Low", "No public revenue base means revenue quality, mix, and growth cannot be underwritten", "Provide trailing 12-month revenue, booked ARR if relevant, and revenue recognition policy."]
      - ["Post-August 2025 cash balance and runway", null, "Low", "Capital adequacy is the core underwriting question for a clinical-stage company building manufacturing assets", "Provide cash on hand, monthly burn, runway in months, and management downside plan."]
      - ["Funding raised (public markers)", "Official >$600M; FundedIQ $914M; SetterVC $920M; biotech.gallery >$1.2B", "Medium", "Conflicting totals change any implied cash starting point and dilution analysis", "Reconcile every financing event, including whether 2025 disclosures represent one round or multiple closings."]
      - ["Latest external valuation marker", "$8B estimate as of 2025-08-15 on SetterVC", "Low", "A private valuation mark affects next-round expectations but is only useful if the methodology and cap-table context are known", "Provide last primary price per share, fully diluted shares, and any preferred terms."]
      - ["Manufacturing fixed-cost base", "51,000-square-foot RTP facility plus 2026 commercial-facility readiness work", "Medium", "Internal manufacturing can improve long-run unit economics but raises near-term capex and operating leverage risk", "Provide manufacturing opex, capex, utilization assumptions, and target cost-of-goods trajectory by lead program."]
    notes: "Null cells mark unavailable public metrics; quoted figures mix official statements and third-party estimates, so they are not interchangeable."
    claimRefs: [CI003, CI005, CI006, CI007, CI008, CI010, CI011, CI013, CI015, CI016]
