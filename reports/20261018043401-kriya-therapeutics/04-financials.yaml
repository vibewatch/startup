          to: proof
          label: blocks underwriting
          claimRefs: [CI013, CI015, CI016]
    approximationNotes: "This is a logic bridge of the publicly visible business model, not a quantified revenue waterfall."
    claimRefs: [CI009, CI011, CI012, CI013]
callouts:
  - calloutType: risk
    title: Capital adequacy is still opaque
    body: >-
      Kriya appears able to raise large rounds, but the assigned public evidence does not disclose
      a reconciled current cash figure, burn, or runway, and even cumulative funding totals differ
      materially across sources.
    claimRefs: [CI005, CI006, CI007, CI008, CI015, CI016]
  - calloutType: insight
    title: Manufacturing can become a moat, but it front-loads cash demands
    body: >-
      The same integrated manufacturing stack that may eventually support better cost control also
      increases today's fixed-cost and capex burden before revenue is publicly visible.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Underwrite milestones, not current revenue quality
    body: >-
      Until management provides cash, runway, pricing, gross margin, and commercialization data,
      the financial case should be framed around milestone execution and financing discipline rather
      than around current revenue durability.
    claimRefs: [CI002, CI013, CI014, CI015, CI016]
