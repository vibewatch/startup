      - ["Partnership or licensing revenue", "Upfronts, milestones, or royalties from external partners", "Per agreement", "Not publicly disclosed in the assigned financial evidence", "Low because no partner economics or contract terms are provided here", "Provide signed counterparties, milestones, royalty structure, and accounting treatment."]
      - ["Platform or manufacturing services", "Third-party use of Kriya capabilities", "Per service contract", "No public service-revenue disclosure in the assigned evidence", "Low because manufacturing capability is described, but external monetization is not", "Clarify whether any external manufacturing, data, or platform services are sold today."]
    notes: "Null-like statuses reflect missing public disclosure in the assigned evidence set, not proof that no internal monetization exists."
