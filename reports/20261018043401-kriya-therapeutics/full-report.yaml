      - number: '5.3'
        title: Quality and regulatory signals exist, but public proof is still thin on clinical durability and support
        blocks:
          - type: paragraph
            body: >-
              Kriya does have public quality-control signals: the medicines page stresses that the portfolio remains
              investigational, MedPath repeats that KRIYA-825 is not approved and that clinical safety and efficacy
              remain unestablished, and PackGene/SetterVC point to manufacturing-readiness engagement with FDA. Those
              are better signals than generic biotech marketing, but they do not yet amount to comprehensive public
              proof on reliability, pharmacovigilance workflow, reimbursement support, deployment services, or
              commercial-scale post-dose monitoring.


              The biggest product-technical underwriting gap is therefore not whether Kriya has an ambitious
              architecture; it clearly does. The gap is whether that architecture produces repeatable human efficacy,
              safe durability, and supportable commercialization across multiple prevalent indications. The assigned
              pool also lacks a public developer/practitioner signal equivalent—no open repositories, public SDK/docs
              surface, status page, security center, or independent practitioner forum evidence appeared here—so
              diligence still needs direct management evidence on operational controls, quality systems, and
              program-by-program readiness before the platform can be underwritten as more than a well-specified product
              engine.
            claimRefs:
              - CE007
              - CE008
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base today is still a target-population map, not a disclosed account list
        blocks:
          - type: paragraph
            body: >-
              Kriya's current public "customer" surface is best understood as a set of intended patient populations and
              clinician workflows rather than a live book of commercial accounts. The official medicines page says the
              company is building "durable medicines at scale to treat common diseases" and describes five
              clinical-stage investigational medicines across large chronic-disease categories, which frames the
              eventual user base as ophthalmology, neurology, and metabolic-disease patients treated by specialists
              rather than current enterprise buyers or hospital systems. Independent summaries repeat that same picture:
              a broad chronic-disease thesis, significant manufacturing ambition, and multiple therapeutic areas, but no
              cited payer contracts, named health-system deployments, or disclosed customer counts. That makes
              segmentation possible at the use-case level, while leaving buyer-versus-user-versus-payer economics
              largely unproven in the current evidence set.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU007
              - CU010
              - CU012
              - CU014
      - number: '6.2'
        title: Adoption proof is clinical progression and readiness signals, not production deployment
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption evidence in this source pack is movement from platform narrative into clinical and
              regulatory milestones. Kriya's own materials say five investigational medicines are in the clinical-stage
              pipeline, while independent summaries and trial-focused articles point to a Phase 1/2 geographic atrophy
              program and a first-in-human type 1 diabetes study planned for 2026. Those are meaningful proof points
              that the company has advanced beyond pure research, but they are still patient and investigator engagement
              inside development programs, not commercial product usage. Likewise, FDA PreCheck participation is a real
              commercialization-readiness signal because it supports facility design and review preparedness, yet it
              does not answer whether providers, payers, or procurement channels are ready to buy one-time gene
              therapies at scale.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU009
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU009
      - number: '6.3'
        title: Named proof remains program-level, and durability evidence is mostly absent
        blocks:
          - type: paragraph
            body: >-
              Kriya can point to specific programs and disease populations, but not to named commercial customers or
              externally verified recurring use. The best public proof points are program-specific: KRIYA-825 in
              geographic atrophy, the planned PROGRESS study in type 1 diabetes, and the broader company assertion that
              five investigational medicines are advancing toward commercialization. Even these examples are limited.
              The geographic atrophy evidence centers on preclinical data and trial initiation; the diabetes evidence
              centers on a first-in-human study setup; and the corporate materials do not disclose trial-site rosters,
              reference accounts, human outcomes tied to customer economics, or payer reimbursement evidence. As a
              result, the chapter can document where proof exists, but the retention and renewal layer that a true
              customer-quality chapter would normally require is still missing.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU011
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU014
      - number: '6.4'
        title: Expansion depends on data, reimbursement, and concentration visibility that are not yet public
        blocks:
          - type: paragraph
            body: >-
              The commercial upside in Kriya's story comes from addressing large chronic diseases with one-time gene
              therapies, but the current public evidence leaves major adoption frictions unresolved. Independent
              commentary on the 2025 financing explicitly situates the company inside a gene-therapy market dealing with
              safety concerns, reimbursement hurdles, and the need for clinical proof before broad uptake can occur.
              That means land-and- expand logic is still hypothetical: investors can underwrite the platform and Kriya
              can prepare manufacturing capacity, yet there is no disclosed contract base showing renewals, expansion
              within a provider system, multi-program cross-sell, or channel resilience. Until Kriya publishes customer
              names, site density, payer discussions, or post-launch cohort behavior, concentration risk and
              go-to-market durability remain diligence gaps rather than answered strengths.
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial readiness is ahead of customer proof
            body: >-
              Kriya has credible evidence of pipeline breadth and manufacturing preparation, but the source pack still
              stops short of naming real customers, provider accounts, or payer commitments.
            calloutType: insight
            claimRefs:
              - CU005
              - CU007
              - CU014
          - type: callout
            title: Durability and concentration are still diligence gaps
            body: >-
              No reviewed source discloses retention, renewal, concentration, or channel-dependence metrics, so
              commercial durability remains an open risk even if clinical programs continue to advance.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical approval risk remains the primary thesis breaker
        blocks:
          - type: paragraph
            body: >-
              The core risk is still whether Kriya can convert a broad AAV pipeline into human safety and efficacy
              evidence that is strong enough for approval in common chronic diseases. Kriya's own medicines page says
              its durable medicines are investigational and have not been approved as safe or effective by any
              regulatory health authority, and the same posture is echoed on its news page. The company's May 2025 ARVO
              release says KRIYA-825 entered a clinical trial earlier that year, but it also states that the product has
              not been approved and that its clinical safety and efficacy have not yet been established. A separate
              April 2026 PackGene write-up says the first-in-human PROGRESS study for KRIYA-839 is still structured to
              evaluate safety and efficacy over 52 weeks, confirming that even the newer diabetes platform remains in an
              early proof-building stage. For investors, the practical implication is that valuation and platform
              breadth do not yet offset the absence of public human readouts showing durable efficacy, tolerability, and
              manufacturability in common-disease settings.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR013
              - CR015
      - number: '7.2'
        title: Manufacturing scale-up and delivery complexity are still unresolved
        blocks:
          - type: paragraph
            body: >-
              Kriya's second major risk is operational: the company is trying to move AAV manufacturing, delivery, and
              quality systems from promising platform rhetoric into repeatable commercial readiness. PackGene's July
              2026 summary says the FDA selected Kriya for the PreCheck Pilot Program based on plans for a new
              commercial facility in Research Triangle Park, and describes the program as early engagement during
              facility design, construction, and operational readiness rather than proof that the site is already
              inspection ready. That matches older NCBiotech coverage in which Kriya itself said the field was
              constrained by manufacturing technology, vector design capabilities, and cost. Program design adds further
              execution risk: the April 2026 KRIYA-839 article says treatment is expected to involve multiple
              intramuscular injections plus short-term immune modulation, while KRIYA-825 depends on specialized ocular
              delivery. These are manageable risks, but they require flawless clinical operations, CMC discipline, and
              device or procedure consistency to avoid schedule slips.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
      - number: '7.3'
        title: Capital access is strong, but disclosure opacity and partner dependencies remain
        blocks:
          - type: paragraph
            body: >-
              Kriya has clearly been able to keep attracting capital, but the public evidence base does not reconcile
              cleanly and that itself is a risk signal. SetterVC lists total funding at $920 million across five rounds
              and a latest valuation mark of $8 billion dated August 15, 2025, while also warning that its company data
              and valuation marks may be incomplete, stale, erroneous, or revised. By contrast, Labiotech says Kriya's
              September 2025 Series D brought its total funds above $1.2 billion, and separately argues that the company
              has disclosed little about how its August 2025 financing would be spent. The same Labiotech piece says
              early KT-A112, KT-A522, and KT-A832 programs no longer appear in the active pipeline and that most of
              Kriya's nine candidates remain preclinical, raising the possibility that capital has outrun public proof.
              Dependency risk is also tangible because KRIYA-825's ocular delivery path relies on Everads-linked
              technology rather than a wholly self-contained product stack.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: What would reduce the risk rating, and what would break the thesis
        blocks:
          - type: paragraph
            body: >-
              The main mitigants are real but incomplete. FDA PreCheck participation should improve manufacturing
              dialogue, a multi-program portfolio reduces single-asset dependency, and Kriya has clearly demonstrated
              access to large financing rounds. None of those mitigants eliminates the need for public human efficacy,
              safety, and manufacturing evidence. The clearest positive de-risking event would be convincing early
              clinical data from KRIYA-825 or KRIYA-839 paired with evidence that the RTP manufacturing build is
              tracking to commercial readiness without material FDA or validation setbacks. The clearest thesis-break
              triggers are weaker-than-expected Phase 1/2 safety or efficacy signals, visible delays in facility
              readiness, or a continued inability to reconcile total capital raised, valuation, and runway from current
              public sources. Until those gaps close, the residual risk profile remains high enough that diligence
              should focus on data-room proof rather than narrative confidence.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical proof remains the gating risk
            body: >-
              The lead ophthalmology and diabetes programs are still proving safety, efficacy, and durability, so
              positive platform rhetoric cannot yet substitute for human data.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: callout
            title: FDA PreCheck is a useful signal, not a readiness verdict
            body: >-
              PreCheck lowers coordination risk around facility buildout, but the cited program language still points to
              design, construction, and operational readiness work that has to be executed cleanly.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: Treat financing strength as a cushion, not a de-risking event
            body: >-
              The company has raised large rounds, yet current public sources still do not reconcile total capital
              raised, valuation, or post-raise runway tightly enough to assume funding risk is solved.
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation posture
        blocks:
          - type: paragraph
            body: >-
              The cleanest read from the available evidence is track rather than buy or avoid. Kriya still has
              ingredients that can create value: the company is funding a broad chronic-disease gene-therapy platform,
              still appears able to attract large private rounds, and has added a current commercialization-readiness
              datapoint via FDA PreCheck participation. At the same time, the price evidence is too noisy to underwrite
              aggressively. Forge shows a September 2025 Series D with an estimated $1.67 billion post-money valuation,
              while SetterVC shows an August 2025 latest valuation mark of $8 billion and separately warns that its
              funding and valuation marks may be incomplete, stale, erroneous, or revised. With cash, burn, runway, and
              broader preference-stack details still undisclosed in public sources, the prudent posture is to watch for
              better proof or a cheaper entry rather than pay for a premium story on incomplete data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: What still supports upside
        blocks:
          - type: paragraph
            body: >-
              Kriya remains more than a single-asset biotech bet. Official and investor-facing materials frame the
              company around durable medicines for common chronic diseases, with five clinical-stage investigational
              medicines already in the pipeline and a broader follow-on wave intended to compound prior data,
              manufacturing, and product learnings. Foresite's portfolio description reinforces that the strategy is
              aimed at highly prevalent serious diseases rather than narrower orphan segments, which is the core reason
              the company can plausibly earn platform-style optionality if the clinical proof accumulates. The July 2026
              FDA PreCheck selection matters because it ties Kriya's Research Triangle Park facility directly to
              commercial-readiness processes rather than to an abstract manufacturing story. The latest financing also
              signals that sophisticated capital has not abandoned the platform despite a tough sector tape.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: Why public evidence does not yet support paying up
        blocks:
          - type: paragraph
            body: >-
              The central valuation problem is not that there is no signal; it is that the signal set is inconsistent
              and partially gated. Forge presents specific Series D terms, including price per share and a 1.0x
              liquidation preference clue, but also states that its post-money valuation is an estimate based on
              company-submitted certificates of incorporation and that its private-company data are not audited.
              SetterVC offers a much higher latest valuation mark and a total-raised figure, but it also attaches a
              direct warning that those marks may be incomplete, stale, erroneous, or revised. EquityZen confirms some
              secondary-market access and shareholder-liquidity infrastructure, yet reserves cap-table, valuation, and
              financial detail for logged-in users. On top of that transparency gap, adverse sector coverage still
              emphasizes safety scrutiny, multi-year-low sentiment, and heavy capital consumption across gene therapy,
              which limits how much premium one should ascribe before human efficacy and balance-sheet disclosure
              sharpen the picture.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The remaining diligence agenda is straightforward. First, reconcile the 2025 round history and cap-table
              stack using primary documents, because public round labels, sizing, and valuation marks do not line up
              tightly enough for underwriting. Second, get a current cash, burn, and runway view; even a strong platform
              can be a weak investment if it must refinance before decisive clinical inflection points. Third, get human
              efficacy, durability, and safety evidence from lead programs, because the long-term upside case ultimately
              depends on clinical proof rather than on the existence of a manufacturing platform alone. A thesis break
              would be any combination of disappointing early human data, evidence of a financing overhang or down-round
              setup, or a sector-safety shock that narrows capital access before Kriya can convert platform claims into
              commercial proof.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Track the company, but wait for human efficacy, post-Series-D liquidity disclosure, or a more clearly
              discounted entry point before underwriting a premium valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV013
              - CV014
          - type: callout
            title: Main reason not to pay up today
            body: >-
              The public record shows large financing support but still does not reconcile current valuation marks,
              broader preference overhang, cash runway, and burn well enough to justify a high-conviction price.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV012
              - CV013
              - CV015
