      - number: '1.2'
        title: Leadership, governance, and footprint
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture in the assigned pool is directionally clear but not fully complete.
              Secondary profiles trace Kriya’s founding bench to Shankar Ramaswamy, Fraser Wright, and Roger Jeffs,
              while current executive references identify Ramaswamy as the operating center of gravity alongside a
              smaller disclosed team spanning finance, medical, and nonclinical development. Governance visibility is
              thinner: the strongest specific board datapoint is NCBiotech’s note that Patient Square’s Jim Momtazee
              joined the board with the 2021 Series B. Location evidence is also mixed in a useful way: several sources
              place Kriya in both Research Triangle Park/Durham and Palo Alto/Bay Area, which supports a bi-coastal
              operating footprint but not a clean single-headquarters convention.
