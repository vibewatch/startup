  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Lead human data are strong and durable while FDA-facility engagement translates into credible
          commercialization readiness.
        - >-
          The company can start to justify a premium platform mark closer to the richer private-database readings rather
          than only the last visible financing terms.
        - Safety setbacks or delayed data could erase the premium quickly.
        - Low until human efficacy and balance-sheet disclosure improve.
      - - Base
        - >-
          Kriya keeps funding the platform and advancing programs but still lacks decisive human proof and clean
          cap-table transparency.
        - >-
          The September 2025 financing reference remains the most usable public anchor and upside waits on new proof
          rather than multiple expansion alone.
        - Conflicting valuation marks and limited cash disclosure keep underwriting discipline tight.
        - Medium.
      - - Bear
        - >-
          Sector safety pressure or disappointing early data arrives before the platform shows commercial proof and
          before transparency improves.
        - >-
          Downside sits below the latest visible financing reference because public evidence does not yet defend a
          premium valuation floor.
        - Down-round risk, burn pressure, and tougher capital markets could compress value simultaneously.
        - Meaningful while the key gaps remain open.
    notes: >-
      Scenario logic intentionally brackets around sourced public valuation references instead of inventing an
      unsupported point estimate; the missing cap-table and cash data are part of the scenario itself.
