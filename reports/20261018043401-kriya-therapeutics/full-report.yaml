      - number: '3.3'
        title: Manufacturing control is the most credible lock-in signal in the retained pool
        blocks:
          - type: paragraph
            body: >-
              The most defensible moat signal in the assigned evidence is upstream rather than commercial. Kriya's
              medicines page says the company was built to make durable medicines for common diseases at scale, while
              PackGene says the platform combines AAV vector engineering, process development, analytical testing, and
              GMP capabilities and that the FDA selected Kriya for the PreCheck Pilot Program tied to its planned
              commercial facility. Those details do not prove customer lock-in yet, but they do suggest that Kriya is
              trying to control supply, process know-how, and regulatory readiness internally instead of outsourcing the
              hardest parts of scale-up. In practice, that makes internal build and supply-chain execution more relevant
              competitive battlegrounds than list-price undercutting at this stage.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP012
              - CP013
              - CP016
      - number: '3.4'
        title: Moat claims are still provisional because peer and pricing evidence remain thin
        blocks:
          - type: paragraph
            body: >-
              The main adverse read is not that a better competitor has already outpriced or outdistributed Kriya in the
              retained pool; it is that the public benchmark is still too shallow to prove Kriya's advantage. SetterVC
              explicitly warns that its competitor list may be incomplete, stale, or erroneous, and the assigned sources
              do not disclose public pricing for KRIYA-825 or for the named peer set. That means the chapter can support
              a narrower conclusion: Kriya has a plausible differentiation story around one-time dosing, common-disease
              focus, and integrated manufacturing, but commoditization and displacement risk remain high until direct
              competitor product data, payer terms, and human efficacy signals make the comparison more concrete.
            claimRefs:
              - CP009
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kriya's moat story is upstream before it is commercial
            body: >-
              The retained evidence supports a platform-control thesis built around manufacturing, data, and facility
              readiness more than a proven sales or pricing advantage in-market.
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP010
          - type: callout
            title: Direct peer benchmarking is still too thin for a durable winner call
            body: >-
              Public peer evidence is mostly directory-style and lacks pricing, customer-proof, and operating detail, so
              superiority claims should stay provisional until more direct competitor disclosures appear.
            calloutType: risk
