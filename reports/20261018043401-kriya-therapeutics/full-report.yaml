chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Kriya’s own website consistently frames the company around durable, one-time medicines for chronic
              diseases and around an integrated development model rather than a single-asset story. That matters because
              later chapters can treat Kriya as a platform-shaped private biopharma, not just a narrow ophthalmology
              bet: the medicines page says the clinical-stage pipeline already includes five investigational medicines,
              while third-party profiles independently cluster the visible disease focus in ophthalmology, metabolic
              disease, and neurology. The combined read is a company trying to industrialize gene therapy for larger
              patient populations, with manufacturing and delivery economics positioned as part of the product thesis.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
