companyProfile:
  summary: >-
    Kriya Therapeutics is a private clinical-stage gene-therapy company that frames itself around durable, one-time
    medicines for common chronic diseases rather than a single-asset rare-disease program. Its public evidence base
    supports a platform story spanning ophthalmology, metabolic disease, and neurology, with five investigational
    medicines in the pipeline, manufacturing-readiness work tied to a planned commercial facility, and meaningful
    financing history, but it still leaves core diligence items such as cash runway, headcount, and a definitive
    headquarters convention underverified.
  headquarters: Bay Area, California + Research Triangle Park, North Carolina, USA
