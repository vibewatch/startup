  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Pipeline breadth is real, but public maturity detail is uneven
        blocks:
          - type: paragraph
            body: >-
              Kriya positions the product in workflow terms as a one-time durable medicine: deliver DNA once, turn
              target cells into an ongoing source of therapeutic protein, and replace chronic administration with a
              single intervention where biology and delivery cooperate. The official medicines page says the company has
              five investigational medicines in a clinical-stage pipeline and explicitly frames them as designed for
              chronic diseases affecting millions rather than rare orphan indications. Third-party profiles and listings
              align on the same three therapeutic corridors—ophthalmology, metabolic disease, and neurology—and add
              named assets for geographic atrophy, thyroid eye disease, type 1 diabetes, steatotic liver disease, and
              trigeminal neuralgia.


              The strongest public maturity proof in the assigned pool is KRIYA-825 in geographic atrophy. MedPath
              reports that KRIYA-825 had already entered a Phase 1/2 study in 2025 and describes a concrete product
              design: an AAV therapy expressing a CR2-CR1 fusion protein intended to inhibit complement C3 and C5 after
              a one-time suprachoroidal delivery. For the rest of the portfolio, public evidence is more thesis-level
              than execution-level: Kriya and profile sites describe delivery concepts and intended benefits, but they
              do not provide the same level of stage-by-stage disclosure, deployment detail, or human-readout support.
              That means the breadth is credible, but maturity is not equally evidenced across all five lead programs.
            claimRefs:
              - CE001
              - CE002
              - CE006
