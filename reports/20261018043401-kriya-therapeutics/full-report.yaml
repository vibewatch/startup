      - number: '3.2'
        title: Public differentiation rests on treatment burden, validated biology, and platform breadth
        blocks:
          - type: paragraph
            body: >-
              Kriya's public argument against the status quo is straightforward: KRIYA-825 targets validated complement
              pathways and aims to replace chronic re-treatment with a one-time administration. The official ARVO
              release says the program targets complement C3 and C5, calls out existing FDA-approved medicines in
              geographic atrophy, and frames KRIYA-825 as an attempt to avoid the repeated injection burden of today's
              regimen. That matters because it gives Kriya a buyer-facing value proposition rooted in administration
              burden rather than only in molecule novelty. At the same time, the same sources emphasize that KRIYA-825
              remains investigational and that clinical safety and efficacy have not yet been established, so the
              company still competes on prospective product design rather than on proven switching behavior.
            claimRefs:
              - CP002
              - CP003
              - CP014
              - CP016
