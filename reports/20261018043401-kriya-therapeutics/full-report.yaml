      - number: '1.3'
        title: Financing and milestones
        blocks:
          - type: paragraph
            body: >-
              Funding scale is clearly part of the Kriya narrative, but the public record is still uneven. NCBiotech
              directly reports a $100 million Series B in 2021, and PackGene later reports a $313.3 million 2025
              financing tied to an SEC filing whose investors were not named. SetterVC’s tracker fills in additional
              rounds and a much larger aggregate capital stack, but its own caveat explicitly says the funding,
              valuation, and employee fields may be incomplete, stale, erroneous, or revised, so those values are better
              treated as directional context than verified cover metrics. Operationally, the most concrete recent proof
              points are the KRIYA-825 ophthalmology program reaching Phase 1/2 and the FDA PreCheck pilot selection
              linked to Kriya’s new commercial facility in RTP.
            claimRefs:
              - CO009
