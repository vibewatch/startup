      - number: '4.3'
        title: Capital base, valuation markers, and adequacy
        blocks:
          - type: paragraph
            body: >-
              Kriya looks well financed relative to most private biotech companies, but the exact starting point is
              still fuzzy. The official May 2025 ARVO release said Kriya had raised over $600 million, FundedIQ lists
              $914 million across five rounds with a $313 million latest round in August 2025, SetterVC lists $920
              million across five rounds and an $8 billion valuation mark as of August 15, 2025 while warning that its
              funding and valuation marks may be incomplete or erroneous, and biotech.gallery says the company is backed
              by over $1.2 billion. Those ranges are directionally consistent with strong financing access but not
              precise enough to underwrite current cash, dilution, or step-up discipline. The strongest public positive
              is that Kriya was still investing in commercialization-readiness infrastructure in 2026, but the missing
              cash balance, burn, and runway disclosure means capital adequacy remains an open underwriting issue.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is that Kriya currently reads as a capital-intensive, milestone-driven private
              gene-therapy platform with credible access to capital but limited public evidence on revenue quality,
              pricing power, or near-term self-funding potential. The adverse lens is important: one biotech analysis
              framed the sector as still constrained by manufacturing, safety, and reimbursement hurdles and estimated
              that a nine-program platform like Kriya could burn $150-200 million annually, which is not a verified
              company disclosure but is a useful stress-case reminder that integrated gene-therapy infrastructure can
              consume cash quickly. Until management provides reconciled funding history, post-round cash, burn, runway,
              launch economics, and payer or partner assumptions, this chapter supports tracking execution rather than
              underwriting revenue durability.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
