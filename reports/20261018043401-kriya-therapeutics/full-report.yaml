  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Current revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              The public evidence still describes Kriya as a clinical-stage platform company rather than a company with
              disclosed commercial revenue. Kriya's medicines page says the pipeline includes five investigational
              medicines and explicitly says its durable medicines have not been approved as safe or effective by any
              regulatory health authority, which materially limits what can be underwritten today on revenue quality or
              realized gross margin. The accessible market-data pages also do not publish usable pricing, contract, or
              revenue disclosures; instead, they mainly advertise gated access to private-company financial data. That
              leaves the public monetization case anchored on future approvals, partnerships, or other commercialization
              events rather than on current disclosed revenue streams.
