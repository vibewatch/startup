      - number: '1.4'
        title: Risk frame and open diligence items
        blocks:
          - type: paragraph
            body: >-
              The overview should stay tempered. PatSnap’s R&D synopsis still characterizes the gene-therapy environment
              as one with complex regulatory requirements, high manufacturing costs, and inherent scientific
              uncertainties, which is especially relevant for a company leaning hard into scaled AAV manufacturing
              before public human efficacy data are broad. At the same time, the assigned evidence does not robustly
              verify several reader-facing basics a diligence report would ideally lock down early: exact total capital
              raised, current valuation, current headcount, a definitive headquarters convention, current cash runway,
              and a complete board roster. Those omissions do not invalidate the platform story, but they do constrain
              how confidently later chapters can underwrite scale, governance depth, and valuation discipline.
            claimRefs:
              - CO005
              - CO012
              - CO015
