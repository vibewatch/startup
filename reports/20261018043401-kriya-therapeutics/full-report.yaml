          label: PreCheck appears in secondary tracker
          detail: SetterVC flagged FDA PreCheck selection as a recent regulatory and manufacturing-readiness signal.
          tone: neutral
        - date: 2026-07-03T00:00:00.000Z
          label: FDA PreCheck public announcement
          detail: PackGene said FDA selected Kriya for the PreCheck pilot tied to its new RTP commercial facility.
