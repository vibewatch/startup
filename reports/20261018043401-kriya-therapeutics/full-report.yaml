      - number: '5.2'
        title: The technical differentiation is vertical integration plus manufacturing readiness
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence is much stronger on Kriya's operating model than on application-layer customer
              deployment. MTEC describes an integrated product engine spanning vector engineering, preclinical and
              clinical development, analytical sciences, and GMP manufacturing, while the official medicines page says
              Kriya is trying to collapse the cost and scale barriers that kept durable medicines out of common
              diseases. PackGene extends that picture with more specific operating detail: Kriya combines AAV vector
              engineering, process development, analytical testing, and GMP capabilities, and layers on automation,
              digital technologies, and data-driven optimization to improve quality, scalability, and efficiency.


              The manufacturing stack is not only rhetorical. PackGene says Kriya was selected for the FDA's PreCheck
              Pilot Program for a new commercial facility in Research Triangle Park, and SetterVC also flags the
              selection as a regulatory/manufacturing-readiness signal ahead of commercialization. PackGene further says
              Kriya's HOPSON structured data system contains more than 80 million internal datapoints, which supports
              the idea that Kriya's moat is process learning and scale-up discipline as much as asset novelty. That
              operating model is the clearest product-technology differentiation visible in the assigned pool, and it is
              also the part of the story with the most concrete readiness markers.
