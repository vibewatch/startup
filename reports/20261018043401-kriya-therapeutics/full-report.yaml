  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current read
      - What would change the view
    rows:
      - - Thesis
        - >-
          Kriya is funding a broad chronic-disease gene-therapy platform with five clinical-stage investigational
          medicines and evidence of manufacturing-readiness progress.
        - Positive early human efficacy plus disclosed post-Series-D liquidity would strengthen conviction.
      - - Anti-thesis
        - >-
          Public valuation marks conflict sharply and private-market transparency is still weak relative to the price
          sensitivity of a late-stage private biotech investment.
        - A reconciled cap table plus consistent third-party valuation evidence would reduce the underwriting discount.
      - - Comparable context
        - >-
          A $313 million to $320.82 million 2025 round still screens as unusually large for private biotech during a
          difficult gene-therapy tape.
        - >-
          Sector financing leadership matters less if burn remains elevated and lead assets fail to produce decisive
          proof.
    notes: >-
      Comparable context is limited to what the retained sources explicitly state about private financing scale and
      business model positioning; it is not a full public-comps model.
