      - number: '4.2'
        title: Cost structure, manufacturing buildout, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently describe a manufacturing-first operating model that can eventually support
              scale, but it also implies heavy fixed-cost absorption before product revenue is visible. NCBiotech said
              Kriya's 2021 Series B proceeds were being used to develop core technology platforms and expand the
              pipeline, and the same report described a 51,000-square-foot Research Triangle Park manufacturing
              facility. In July 2026, PackGene reported that FDA selected Kriya for the PreCheck pilot based on plans
              for a new commercial facility in Research Triangle Park expected to support pipeline products already in
              clinical trials. PackGene also described a proprietary data system with more than 80 million datapoints,
              which supports the argument that process development and manufacturing know-how could become an eventual
              margin lever, but only after Kriya clears clinical and regulatory milestones that are still in front of
              it.
