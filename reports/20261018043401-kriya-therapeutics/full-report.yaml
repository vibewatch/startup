  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Positive platform breadth and capital access are offset by transparency and proof gaps, keeping the recommendation
      at track.
    data:
      nodes:
        - id: platform
          label: Broad clinical-stage platform
          detail: Five clinical-stage investigational medicines and a broader next-wave pipeline support optionality.
          tone: positive
        - id: market
          label: Large-disease market focus
          detail: The strategy targets highly prevalent serious diseases rather than narrow orphan markets.
          tone: positive
        - id: financing
          label: Capital still available
          detail: Public sources show a large 2025 private round despite difficult gene-therapy sentiment.
          tone: positive
        - id: readiness
          label: Manufacturing / regulatory readiness
          detail: FDA PreCheck participation links the RTP facility to commercialization-readiness work.
          tone: positive
        - id: transparency
          label: Conflicting valuation signals
          detail: Public databases disagree materially on the current private valuation and warn about data quality.
          tone: risk
        - id: proof
          label: Human data and cash visibility still thin
          detail: Public sources still do not give a clean post-Series-D cash, burn, or efficacy picture.
          tone: high
        - id: recommendation
          label: Track, not buy
          detail: Re-underwrite after stronger human proof, better balance-sheet disclosure, or a clearly cheaper entry point.
          tone: warning
      edges:
        - from: platform
          to: recommendation
          label: Supports optionality
        - from: market
          to: recommendation
          label: Supports TAM case
        - from: financing
          to: recommendation
          label: Extends runway
        - from: readiness
          to: recommendation
          label: Improves execution case
        - from: transparency
          to: recommendation
          label: Caps underwriting confidence
        - from: proof
          to: recommendation
          label: Keeps price sensitivity high
    approximationNotes: >-
      The flow is directional and qualitative; it organizes sourced factors affecting the recommendation and does not
      imply numeric weighting.
