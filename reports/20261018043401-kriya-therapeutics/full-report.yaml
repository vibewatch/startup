  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans status quo care, broad AAV platforms, and adjacent gene-editing peers
        blocks:
          - type: paragraph
            body: >-
              The retained pool does not support a tight list of direct like-for-like commercial rivals for Kriya's
              current lead program, but it does show the main classes of alternatives a buyer or investor would compare.
              At the indication level, KRIYA-825 is being developed for geographic atrophy, where Kriya's own framing
              explicitly compares a one-time suprachoroidal AAV therapy with currently available therapies that require
              repeated physician-administered intravitreal injections. At the company level, SetterVC's profile places
              Kriya beside broad platform peers such as 4D Molecular Therapeutics, uniQure, Editas Medicine, Sana
              Biotechnology, Beam Therapeutics, and Capsida Therapeutics, which means Kriya is being benchmarked less as
              a single-asset ophthalmology bet and more as a scaled gene-therapy platform competing for capital, talent,
              and future indication expansion.
