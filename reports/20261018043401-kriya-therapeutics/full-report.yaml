  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show Kriya moving from founding and large private financings toward clinical proof points and
      manufacturing-readiness work, but some intermediate round data remain estimate-grade.
    data:
      items:
        - year: '2019'
          label: Company founded
          detail: >-
            Secondary profiles trace Kriya's founding to 2019 and name Shankar Ramaswamy, Fraser Wright, and Roger Jeffs
            as founding figures.
          tone: neutral
        - year: '2021'
          label: Series B and first explicit board signal
          detail: NCBiotech reported a $100 million Series B and said Patient Square's Jim Momtazee joined the board.
          tone: positive
        - period: May 2022
          label: Estimated Series C
          detail: >-
            SetterVC's funding table lists a $270 million Series C; treat the figure as tracker data rather than a fully
            verified primary round record.
          tone: positive
        - period: Jul 2023
          label: Estimated Series C extension
          detail: >-
            SetterVC's funding table lists a $150 million extension, but the public reconciliation to later financing
            records remains incomplete.
          tone: neutral
        - period: May 2025
          label: KRIYA-825 reaches clinical relevance
          detail: MedPath reported ARVO preclinical data and that a Phase 1/2 geographic atrophy trial was already underway.
          tone: positive
        - date: 2025-08-24T00:00:00.000Z
          label: $313.3M financing disclosed
          detail: >-
            PackGene reported the financing and noted that the underlying SEC filing did not identify the two
            participating investors.
          tone: positive
