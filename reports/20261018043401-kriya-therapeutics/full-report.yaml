        - label: Impact
        - label: Mitigation maturity
        - label: Residual exposure
      rows:
        - label: Clinical proof gap
          values:
            - label: High
              tone: high
              note: Lead programs are still in safety and efficacy evaluation.
            - label: High
              tone: critical
              note: No approval case clears without durable human data.
            - label: Medium
              tone: medium
              note: Portfolio breadth helps, but does not replace proof.
            - label: High
              tone: critical
              note: Weak Phase 1/2 signals would break the thesis.
        - label: Manufacturing readiness
          values:
            - label: Medium-high
              tone: high
              note: Facility readiness and CMC execution are still open.
            - label: High
              tone: high
              note: Delays would affect clinical supply and commercialization timing.
            - label: Medium
              tone: medium
              note: FDA PreCheck is helpful but not equivalent to validation.
            - label: High
              tone: high
              note: Scale-up still depends on execution at the RTP site.
        - label: Capital and disclosure opacity
          values:
            - label: Medium
              tone: medium
              note: Capital access is strong, but external marks conflict.
            - label: High
              tone: high
              note: A weak next round could compress strategy and valuation.
            - label: Low-medium
              tone: warning
              note: Recent financings mitigate near-term pressure.
            - label: High
              tone: high
              note: Public evidence does not reconcile total raised, valuation, and runway.
        - label: Delivery-partner dependence
          values:
            - label: Medium
              tone: medium
              note: Ophthalmology execution still depends on specialized delivery tooling.
            - label: Medium-high
              tone: high
              note: A delivery setback would damage one of the lead programs.
            - label: Medium
              tone: medium
              note: Early preclinical and procedural work reduces, but does not remove, the risk.
            - label: Medium-high
              tone: high
              note: The pool lacks human evidence proving the partner-linked route scales cleanly.
        - label: Pipeline attrition and reprioritization
          values:
            - label: Medium-high
              tone: high
              note: Older candidates appear to have dropped out of the active pipeline.
            - label: Medium-high
              tone: high
              note: Reprioritization can consume capital before clinical proof appears.
            - label: Low-medium
              tone: warning
              note: Portfolio breadth offers optionality, but not schedule certainty.
            - label: Medium-high
              tone: high
              note: Continued churn would weaken confidence in platform conversion.
        - label: Sector financing headwind
          values:
            - label: Medium
              tone: medium
              note: Gene-therapy funding is still harder than in the 2021 market.
            - label: Medium-high
              tone: high
              note: Sector weakness can reduce valuation support even for strong platforms.
            - label: Medium
              tone: medium
              note: Kriya's financing history softens near-term pressure.
            - label: Medium-high
              tone: high
              note: Follow-on raises may still clear at tougher terms in a weak sector.
