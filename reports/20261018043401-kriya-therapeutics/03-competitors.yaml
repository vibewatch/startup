company:
  name: Kriya Therapeutics
chapter:
  number: 3
  title: Competitors
  summary: Kriya's strongest disclosed competitive wedge is not price or current customer proof; it is a platform claim that combines one-time AAV medicines for common diseases with integrated manufacturing and regulatory-readiness work. The retained pool still shows a weak direct-comparison market, because the only explicit incumbent benchmark is recurring GA injections and the named peer set comes mostly from an illustrative directory profile rather than rich peer operating disclosures.
sections:
  - id: landscape
    title: Competitive landscape spans status quo care, broad AAV platforms, and adjacent gene-editing peers
    body: >-
      The retained pool does not support a tight list of direct like-for-like commercial rivals for Kriya's current lead program, but it does show the main classes of alternatives a buyer or investor would compare. At the indication level, KRIYA-825 is being developed for geographic atrophy, where Kriya's own framing explicitly compares a one-time suprachoroidal AAV therapy with currently available therapies that require repeated physician-administered intravitreal injections. At the company level, SetterVC's profile places Kriya beside broad platform peers such as 4D Molecular Therapeutics, uniQure, Editas Medicine, Sana Biotechnology, Beam Therapeutics, and Capsida Therapeutics, which means Kriya is being benchmarked less as a single-asset ophthalmology bet and more as a scaled gene-therapy platform competing for capital, talent, and future indication expansion.
    claimRefs: [CP001, CP003, CP005, CP008, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation
    title: Public differentiation rests on treatment burden, validated biology, and platform breadth
    body: >-
      Kriya's public argument against the status quo is straightforward: KRIYA-825 targets validated complement pathways and aims to replace chronic re-treatment with a one-time administration. The official ARVO release says the program targets complement C3 and C5, calls out existing FDA-approved medicines in geographic atrophy, and frames KRIYA-825 as an attempt to avoid the repeated injection burden of today's regimen. That matters because it gives Kriya a buyer-facing value proposition rooted in administration burden rather than only in molecule novelty. At the same time, the same sources emphasize that KRIYA-825 remains investigational and that clinical safety and efficacy have not yet been established, so the company still competes on prospective product design rather than on proven switching behavior.
    claimRefs: [CP002, CP003, CP014, CP016]
    tableRefs: [TP002]
  - id: distribution-and-lock-in
    title: Manufacturing control is the most credible lock-in signal in the retained pool
    body: >-
      The most defensible moat signal in the assigned evidence is upstream rather than commercial. Kriya's medicines page says the company was built to make durable medicines for common diseases at scale, while PackGene says the platform combines AAV vector engineering, process development, analytical testing, and GMP capabilities and that the FDA selected Kriya for the PreCheck Pilot Program tied to its planned commercial facility. Those details do not prove customer lock-in yet, but they do suggest that Kriya is trying to control supply, process know-how, and regulatory readiness internally instead of outsourcing the hardest parts of scale-up. In practice, that makes internal build and supply-chain execution more relevant competitive battlegrounds than list-price undercutting at this stage.
    claimRefs: [CP004, CP006, CP007, CP010]
    tableRefs: [TP003]
  - id: durability-verdict
    title: Moat claims are still provisional because peer and pricing evidence remain thin
    body: >-
      The main adverse read is not that a better competitor has already outpriced or outdistributed Kriya in the retained pool; it is that the public benchmark is still too shallow to prove Kriya's advantage. SetterVC explicitly warns that its competitor list may be incomplete, stale, or erroneous, and the assigned sources do not disclose public pricing for KRIYA-825 or for the named peer set. That means the chapter can support a narrower conclusion: Kriya has a plausible differentiation story around one-time dosing, common-disease focus, and integrated manufacturing, but commoditization and displacement risk remain high until direct competitor product data, payer terms, and human efficacy signals make the comparison more concrete.
    claimRefs: [CP009, CP012, CP013]
