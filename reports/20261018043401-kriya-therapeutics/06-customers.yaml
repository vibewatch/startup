company:
  name: Kriya Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    Kriya's public customer story is still pre-commercial: the evidence shows
    five clinical-stage medicines, planned or active human studies, and
    manufacturing-readiness work, but no disclosed paying customers, provider
    accounts, retention cohorts, or concentration metrics. The strongest
    adoption signals are trial starts and commercialization preparation rather
    than durable commercial use.
sections:
  - id: customer-base-and-segmentation
    title: Customer base today is still a target-population map, not a disclosed account list
    body: >-
      Kriya's current public "customer" surface is best understood as a set of
      intended patient populations and clinician workflows rather than a live
      book of commercial accounts. The official medicines page says the company
      is building "durable medicines at scale to treat common diseases" and
      describes five clinical-stage investigational medicines across large
      chronic-disease categories, which frames the eventual user base as
      ophthalmology, neurology, and metabolic-disease patients treated by
      specialists rather than current enterprise buyers or hospital systems.
      Independent summaries repeat that same picture: a broad chronic-disease
      thesis, significant manufacturing ambition, and multiple therapeutic
      areas, but no cited payer contracts, named health-system deployments, or
      disclosed customer counts. That makes segmentation possible at the
      use-case level, while leaving buyer-versus-user-versus-payer economics
      largely unproven in the current evidence set.
    claimRefs: [CU001, CU002, CU003, CU004, CU012, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-surfaces-and-usage-proof
    title: Adoption proof is clinical progression and readiness signals, not production deployment
    body: >-
      The clearest adoption evidence in this source pack is movement from
      platform narrative into clinical and regulatory milestones. Kriya's own
      materials say five investigational medicines are in the clinical-stage
      pipeline, while independent summaries and trial-focused articles point to
      a Phase 1/2 geographic atrophy program and a first-in-human type 1
      diabetes study planned for 2026. Those are meaningful proof points that
      the company has advanced beyond pure research, but they are still patient
      and investigator engagement inside development programs, not commercial
      product usage. Likewise, FDA PreCheck participation is a real
      commercialization-readiness signal because it supports facility design and
      review preparedness, yet it does not answer whether providers, payers, or
      procurement channels are ready to buy one-time gene therapies at scale.
    claimRefs: [CU001, CU005, CU006, CU007, CU009, CU014]
    tableRefs: [TU002]
  - id: named-proof-and-durability-gaps
    title: Named proof remains program-level, and durability evidence is mostly absent
    body: >-
      Kriya can point to specific programs and disease populations, but not to
      named commercial customers or externally verified recurring use. The best
      public proof points are program-specific: KRIYA-825 in geographic
      atrophy, the planned PROGRESS study in type 1 diabetes, and the broader
      company assertion that five investigational medicines are advancing toward
      commercialization. Even these examples are limited. The geographic
      atrophy evidence centers on preclinical data and trial initiation; the
      diabetes evidence centers on a first-in-human study setup; and the
      corporate materials do not disclose trial-site rosters, reference
      accounts, human outcomes tied to customer economics, or payer
      reimbursement evidence. As a result, the chapter can document where proof
      exists, but the retention and renewal layer that a true customer-quality
      chapter would normally require is still missing.
    claimRefs: [CU005, CU006, CU008, CU011, CU013, CU014]
    tableRefs: [TU003]
  - id: commercial-risks-and-expansion-constraints
    title: Expansion depends on data, reimbursement, and concentration visibility that are not yet public
    body: >-
      The commercial upside in Kriya's story comes from addressing large chronic
      diseases with one-time gene therapies, but the current public evidence
      leaves major adoption frictions unresolved. Independent commentary on the
      2025 financing explicitly situates the company inside a gene-therapy
      market dealing with safety concerns, reimbursement hurdles, and the need
      for clinical proof before broad uptake can occur. That means land-and-
      expand logic is still hypothetical: investors can underwrite the platform
      and Kriya can prepare manufacturing capacity, yet there is no disclosed
      contract base showing renewals, expansion within a provider system,
      multi-program cross-sell, or channel resilience. Until Kriya publishes
      customer names, site density, payer discussions, or post-launch cohort
      behavior, concentration risk and go-to-market durability remain diligence
      gaps rather than answered strengths.
    claimRefs: [CU007, CU010, CU011, CU012, CU013, CU014]
