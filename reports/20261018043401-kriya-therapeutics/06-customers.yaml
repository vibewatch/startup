figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Kriya's path to customer adoption runs from high-burden chronic-disease
      need through clinical proof and manufacturing readiness before any payer
      or provider scale can be inferred.
    data:
      items:
        - label: Chronic-disease burden exists today
          detail: Large ophthalmology, metabolic, and neurology indications are the demand anchor.
          touchpoints:
            - "Current standards often require chronic dosing or repeated interventions"
            - "Kriya positions one-time durability as the patient-value proposition"
        - label: Investigational programs define the first user surfaces
          detail: The company discloses five clinical-stage medicines rather than commercial products.
          touchpoints:
            - Geographic atrophy
            - Thyroid eye disease
            - Metabolic disease
        - label: Clinical enrollment becomes the first real adoption test
          detail: Human studies are the earliest observable proof of use in the current evidence set.
          touchpoints:
            - "KRIYA-825 Phase 1/2 progression"
            - "PROGRESS first-in-human T1D study setup"
        - label: Manufacturing and regulatory readiness reduce launch friction
          detail: FDA PreCheck and facility buildout support future supply credibility.
          touchpoints:
            - "New commercial facility planning in RTP"
            - "Earlier FDA engagement on facility readiness"
        - label: Provider and payer adoption remains unproven
          detail: No public source in this pool names health-system accounts, coverage wins, or contract terms.
          touchpoints:
            - "No customer count disclosed"
            - "No reimbursement pathway disclosed"
        - label: Expansion depends on post-approval evidence
          detail: Cross-program growth requires efficacy, safety, and channel proof that are not yet public.
          touchpoints:
            - "Need human outcomes that justify one-time therapy economics"
            - "Need evidence of repeat provider uptake across indications"
    claimRefs: [CU003, CU007, CU010, CU012, CU014]
callouts:
  - calloutType: insight
    title: Commercial readiness is ahead of customer proof
    body: >-
      Kriya has credible evidence of pipeline breadth and manufacturing
      preparation, but the source pack still stops short of naming real
      customers, provider accounts, or payer commitments.
    claimRefs: [CU005, CU007, CU014]
  - calloutType: risk
    title: Durability and concentration are still diligence gaps
    body: >-
      No reviewed source discloses retention, renewal, concentration, or
      channel-dependence metrics, so commercial durability remains an open risk
      even if clinical programs continue to advance.
    claimRefs: [CU011, CU012, CU013]
