evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      Primary financing documents that reconcile the 2022 Series C, 2023 extension, and 2025 financing into one clean
      capital-history timeline.
    whyItMatters: >-
      Later financial and valuation work needs a single round chronology before total raised, dilution, and investor
      signaling can be interpreted confidently.
    diligencePath: >-
      Pull the underlying SEC filing, board materials, and any financing close summaries to determine whether the 2025
      raise is a new round or continuation.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      A priced-round or secondary-market document that verifies Kriya's latest valuation, price per share, and diluted
      share count.
    whyItMatters: >-
      Without primary valuation evidence, the report cannot safely convert tracker estimates into a defended valuation
      anchor or even a verified cover metric.
    diligencePath: >-
      Request the latest financing deck, cap table, or board-approved valuation materials and reconcile them against any
      secondary platform marks.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance-and-footprint
    missingEvidence: >-
      A current primary management and board roster plus a definitive company statement on headquarters convention and
      employee count.
    whyItMatters: >-
      Leadership depth, governance quality, and organizational scale all influence diligence posture, but the assigned
      public pool only provides partial and sometimes estimate-grade visibility.
    diligencePath: >-
      Obtain the latest corporate presentation, board list, leadership page export, and HR or payroll-backed headcount
      snapshot.
    relatedQuestionRefs:
      - QO002
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: >-
      Post-2025 cash balance, burn rate, and runway commentary that reflects the effect of the latest financing and
      manufacturing buildout.
    whyItMatters: >-
      A large private financing does not by itself establish liquidity durability, especially for a company building
      scaled AAV capabilities and funding multiple programs.
    diligencePath: >-
      Request internal cash planning, board budget materials, and updated management commentary on operating burn and
      manufacturing capex.
    relatedQuestionRefs:
      - QO003
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independently sourced TAM, SAM, SOM, and CAGR by priority indication or by focal-delivery chronic-disease
      subsegment.
    whyItMatters: >-
      Without quantified demand and adoption assumptions, market breadth remains a thesis rather than a defensible
      valuation input.
    diligencePath: >-
      Pull analyst, trade-association, or public-company market studies for geographic atrophy, thyroid eye disease,
      type 1 diabetes, and MASH that isolate addressable therapy spend.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-payer-economics
    missingEvidence: Named buyers, payer archetypes, reimbursement pathways, and budget owners for each lead segment.
    whyItMatters: >-
      Market adoption timing depends on who actually approves, pays for, and operationalizes a one-time therapy in each
      care pathway.
    diligencePath: >-
      Request launch-planning, market-access, and reimbursement materials by indication, including intended site of care
      and payer engagement.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: >-
      Human efficacy, durability, safety, pricing, and launch-sequencing evidence for KRIYA-825 and the next disclosed
      programs.
    whyItMatters: >-
      The market thesis currently leans on platform ambition and substitute burden more than on validated demand,
      reimbursement, or post-approval execution proof.
    diligencePath: >-
      Obtain current clinical updates, pricing strategy, and commercialization planning documents tied to the
      ophthalmology lead program and follow-on assets.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public or management-confirmed pricing, reimbursement, or contract terms for KRIYA-825 and a comparable
      alternative set.
    whyItMatters: >-
      Without price and reimbursement evidence, the chapter cannot test whether Kriya's burden-reduction pitch
      translates into payer leverage or pricing power.
    diligencePath: >-
      Obtain management guidance, payer materials, or direct competitor pricing disclosures before underwriting a
      commercialization advantage.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-benchmarking
    missingEvidence: >-
      Direct competitor product, manufacturing, and commercial-readiness disclosures from named peers rather than a
      directory-style competitor list.
    whyItMatters: >-
      Sparse peer evidence makes it hard to distinguish a real moat from a documentation gap, especially on supply
      control and scale-up readiness.
    diligencePath: >-
      Add retained official peer pipeline pages, manufacturing disclosures, and customer or site-adoption evidence for
      the named competitor set.
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: >-
      A current cash balance, monthly burn, and runway bridge from the latest financing close to at least the next 18
      months.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from cumulative funding headlines alone when manufacturing and clinical
      spend are both still ramping.
    diligencePath: >-
      Request the latest board package or financing update with cash on hand, base-case burn, downside burn, and
      minimum-cash covenant assumptions.
    relatedQuestionRefs:
      - QI005
      - QI009
  - type: private-evidence-only
    severity: material
    topic: launch-economics
    missingEvidence: >-
      Program-level pricing, reimbursement, channel, and gross-margin assumptions for the first launchable assets or
      partnership structures.
    whyItMatters: >-
      Without launch economics, it is impossible to judge whether Kriya's integrated manufacturing model can convert
      approvals into attractive unit economics.
    diligencePath: >-
      Request launch models for lead programs, including price, net-to-gross, cost of goods, patient-support cost, and
      payer-coverage assumptions.
    relatedQuestionRefs:
      - QI002
      - QI008
      - QI009
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      A reconciled financing ledger that explains which public totals are cumulative capital raised, which are
      estimates, and whether 2025 disclosures represent one financing or multiple closings.
    whyItMatters: >-
      Conflicting funding totals distort any view of dilution, valuation step-ups, and how much capital remains to
      finish clinical and manufacturing milestones.
    diligencePath: >-
      Obtain the cap table, financing chronology, Form D support, and the company's own cumulative-cash-raise
      reconciliation.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI009
  - type: missing-source
    severity: material
    topic: clinical-readouts
    missingEvidence: Program-by-program human safety, efficacy, and durability data for assets beyond the KRIYA-825 Phase 1/2 start.
    whyItMatters: >-
      Without human readouts, the chapter can underwrite architecture intent but not whether Kriya's one-time treatment
      model works repeatably across its broader chronic-disease portfolio.
    diligencePath: >-
      Request the latest clinical deck, investigator brochures, and any disclosed interim datasets for each lead
      program.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: operational-support
    missingEvidence: >-
      Public documentation on deployment workflow, post-dose monitoring, patient support, pharmacovigilance operations,
      and commercial-service readiness.
    whyItMatters: >-
      Prevalent-disease gene therapy needs more than manufacturing scale; underwriting also depends on whether the
      company can safely deliver, monitor, and support therapy in real-world care settings.
    diligencePath: >-
      Ask management for launch-readiness plans, treatment-center workflow maps, and quality-system summaries tied to
      the lead programs.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner signal such as open technical docs, status/security center evidence,
      independent engineering forum discussion, or another public proxy for operational credibility.
    whyItMatters: >-
      Kriya is not a developer-platform company, but the assigned pool still lacks an external practitioner lens on
      implementation discipline, reliability communication, or public technical transparency.
    diligencePath: >-
      Look for conference talks, public CMC or quality presentations, practitioner interviews, or internal references
      that can serve as a non-marketing technical proxy.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: program-stage-detail
    missingEvidence: Exact current phase, dosing plan, and commercialization timeline for the non-KRIYA-825 lead programs.
