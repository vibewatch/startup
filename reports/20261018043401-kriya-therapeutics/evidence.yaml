      The public portfolio map is broad enough to establish scope, but not detailed enough to separate near-term
      clinical assets from earlier-stage strategic options.
    diligencePath: >-
      Request a current portfolio tracker with named assets, phase, site count, delivery modality, and next technical
      milestone for each program.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Public retention, renewal, churn, contract-length, NRR, GRR, or satisfaction metrics once Kriya has commercial
