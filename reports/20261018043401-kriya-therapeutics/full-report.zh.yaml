chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台
        blocks:
          - type: paragraph
            body: >-
              Kriya 自己的网站始终把公司定位为开发慢性病持久型、一次给药药物，并强调一体化开发模式，而非单一资产故事。这一点很重要：后续章节可以把 Kriya
              视为一家平台型私营生物医药公司，而不只是狭窄的眼科押注。药物页面称，其临床阶段管线已经包含 5 个在研药物；第三方资料也独立地把其可见疾病重点归为眼科、代谢疾病和神经科。综合来看，Kriya
              试图把基因疗法工业化，服务更大的患者群体，并把制造和给药经济性纳入产品逻辑。
            claimRefs:
              - CO001
