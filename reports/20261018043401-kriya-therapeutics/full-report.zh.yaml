  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 管线广度真实存在，但公开成熟度细节不均衡
        blocks:
          - type: paragraph
            body: >-
              Kriya 把产品放进工作流时，定位的是一次性持久型药物：一次递送 DNA，让目标细胞持续产生治疗性蛋白，并在生物学和递送条件配合时，用一次干预取代长期给药。官方药物页面称，公司临床阶段管线有 5
              个在研药物，并明确将其定位为治疗影响数百万人的慢性病，而不是罕见孤儿适应症。第三方资料和目录在三个治疗方向上达成一致——眼科、代谢疾病和神经科——并列出了地理性萎缩、甲状腺眼病、1
              型糖尿病、脂肪性肝病和三叉神经痛等具体项目。

              指定资料池中最强的公开成熟度证据是用于地理性萎缩的 KRIYA-825。MedPath 报道，KRIYA-825 已于 2025 年进入 1/2 期研究，并描述了具体产品设计：一种表达 CR2-CR1 融合蛋白的
              AAV 疗法，计划通过一次脉络膜上给药抑制补体 C3 和 C5。对于组合中的其他项目，公开证据更多停留在概念上，而不是执行上：Kriya
              和资料网站描述了给药概念及预期收益，却没有提供同等程度的阶段披露、部署细节或人体读出支持。因此，管线广度可信，但 5 个领先项目的成熟度并没有得到同等程度的证明。
