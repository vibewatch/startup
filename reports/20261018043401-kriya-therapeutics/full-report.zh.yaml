      - number: '7.3'
        title: 资本获取能力强，但披露不透明且仍依赖合作伙伴
        blocks:
          - type: paragraph
            body: >-
              Kriya 显然一直能吸引资本，但公开证据无法相互核对，这本身就是风险信号。SetterVC 列出 5 轮合计 $920 million 的总融资和截至 2025 年 8 月 15 日的 $8 billion
              最新估值，同时警告公司数据和估值标记可能不完整、过时、错误或已修订。相比之下，Labiotech 称 Kriya 2025 年 9 月的 D 轮融资使累计资金超过 $1.2
              billion，并另指出公司很少披露如何使用 2025 年 8 月的融资。同一篇 Labiotech 文章称，早期的 KT-A112、KT-A522 和 KT-A832 项目不再出现在活跃管线中，Kriya 的
              9 个候选项目大多仍处于临床前阶段，这带来资本跑在公开证明之前的可能性。依赖风险也很实际，因为 KRIYA-825 的眼科给药路径依赖 Everads 相关技术，而不是完全自有的产品体系。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
