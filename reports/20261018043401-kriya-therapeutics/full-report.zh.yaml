      - number: '2.3'
        title: 采用取决于商业化准备，而不只是科学
        blocks:
          - type: paragraph
            body: >-
              采用逻辑取决于 Kriya 能否把慢性病基因疗法做成可制造、可重复运营的产品。NCBiotech 引述公司称，该领域受制造技术、载体设计能力和成本限制；Kriya
              自己的材料则强调一体化产品和制造引擎，目标是让持久型药物更容易规模化。Pharmaceutical Technology 将 2025 年融资直接与推进试验、强化制造引擎联系起来；PackGene 的 2026
              年 FDA PreCheck 报道则把商业化准备与新的 Research Triangle Park 工厂联系起来。


              公开证据也显示，商业切入点最具体的地方在哪里。KRIYA-825 已被定位为针对地理性萎缩的一次性脉络膜上给药疗法，目标是减少现有疗法所需的频繁玻璃体内注射负担；相比代谢疾病或神经科，这给 Kriya
              提供了更清晰的替代叙事。不过这些药物仍处于在研阶段，公开资料也没有为每个细分市场列出具体买方、付款方或预算负责人，因此市场时点仍更多是管理层论点，而非已核实的采购证据。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局覆盖现有治疗、广谱 AAV 平台和相邻基因编辑同行
        blocks:
          - type: paragraph
            body: >-
              保留的资料池不足以为 Kriya 当前领先项目列出紧密的一对一商业竞争者，但能显示买方或投资者会比较的主要替代类别。就适应症而言，KRIYA-825 正在开发用于地理性萎缩；Kriya 自己明确将一次性脉络膜上
              AAV 疗法与需要医生反复进行玻璃体内注射的现有疗法比较。放到公司整体看，SetterVC 的资料把 Kriya 与 4D Molecular Therapeutics、uniQure、Editas
              Medicine、Sana Biotechnology、Beam Therapeutics 和 Capsida Therapeutics 等广谱平台同行并列。这说明 Kriya
              更像一个争夺资本、人才和未来适应症扩张机会的规模化基因疗法平台，而不是单一资产眼科项目。
            claimRefs:
              - CP001
