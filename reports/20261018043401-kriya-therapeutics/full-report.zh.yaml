      - number: '1.3'
        title: 融资与里程碑
        blocks:
          - type: paragraph
            body: >-
              融资规模显然是 Kriya 故事的一部分，但公开记录仍不均衡。NCBiotech 直接报道了 2021 年 $100 million 的 B 轮融资；PackGene 后来报道了 2025 年 $313.3
              million 融资，并称相关 SEC 文件没有披露投资者姓名。SetterVC
              的追踪资料补充了其他轮次和更大的累计资本规模，但其自身明确警告，融资、估值和员工人数字段可能不完整、过时、错误或已修订，因此这些数值更适合作为方向性背景，而不是已核实的封面指标。就运营而言，近期最具体的证明点是
              KRIYA-825 眼科项目进入 1/2 期，以及 Kriya 的新商业化工厂入选 FDA PreCheck 试点。
