              - CP016
      - number: '3.3'
        title: 制造控制是保留资料池中最可信的锁定信号
        blocks:
          - type: paragraph
            body: >-
              指定证据中最可辩护的护城河信号来自上游，而非商业端。Kriya 的药物页面称，公司成立的目标是让常见疾病的持久型药物实现规模化；PackGene 称该平台整合 AAV 载体工程、工艺开发、分析测试和 GMP
              能力，并且 FDA 选择 Kriya 参加与计划中的商业化工厂相关的 PreCheck 试点。这些细节还不能证明客户已经被锁定，但说明 Kriya
              正试图在内部掌握供应、工艺知识和监管准备度，而不是把规模化最难的部分外包。现阶段，内部建设和供应链执行比压低目录价格更可能成为实际竞争战场。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP012
              - CP013
              - CP016
      - number: '3.4'
        title: 护城河论断仍是暂定的，因为同行与定价证据很薄
        blocks:
          - type: paragraph
            body: >-
              主要不利判断并不是保留资料池显示某个更强竞争者已经在价格或分销上击败 Kriya，而是公开基准仍太浅，无法证明 Kriya 的优势。SetterVC
              明确警告，其竞争者名单可能不完整、过时或错误；指定来源也没有披露 KRIYA-825 或所列同行的公开定价。因此本章只能支持较窄的结论：Kriya
              围绕一次给药、常见疾病重点和一体化制造形成了合理的差异化故事，但在直接竞争产品数据、付款方条款和人体疗效信号让比较更具体之前，商品化和被替代风险仍然很高。
            claimRefs:
              - CP009
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
