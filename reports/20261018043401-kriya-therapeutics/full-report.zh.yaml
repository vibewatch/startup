      - number: '5.2'
        title: 技术差异化来自垂直整合与制造准备度
        blocks:
          - type: paragraph
            body: >-
              公开技术证据对 Kriya 运营模式的支持远强于对应用层客户部署的支持。MTEC 描述了一套整合式产品引擎，覆盖载体工程、临床前和临床开发、分析科学及 GMP 制造；官方药物页面则称，Kriya
              正试图打破让持久型药物无法进入常见疾病领域的成本和规模障碍。PackGene 提供了更具体的运营细节：Kriya 将 AAV 载体工程、工艺开发、分析测试和 GMP
              能力结合起来，并叠加自动化、数字技术和数据驱动优化，以提升质量、可扩展性和效率。

              制造体系并非只是宣传。PackGene 称，Kriya 被选入 FDA 面向 Research Triangle Park 新商业化工厂的 PreCheck 试点；SetterVC
              也将这一选择视为商业化前的监管和制造准备信号。PackGene 还称，Kriya 的 HOPSON 结构化数据系统包含超过 80 million 个内部数据点，这支持这样一种判断：Kriya
              的护城河既来自工艺学习和规模化纪律，也来自资产新颖性。该运营模式是指定资料池中最清晰的产品技术差异化，也是准备度标记最具体的部分。
