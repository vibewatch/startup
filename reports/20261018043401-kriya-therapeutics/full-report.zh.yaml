    summary: 公开里程碑显示，Kriya 正从成立和大额私募融资走向临床证据节点及制造就绪工作，但部分中间轮次数据仍只达到估算级别。
    data:
      items:
        - year: '2019'
          label: 公司成立
          detail: 二手资料将 Kriya 的成立追溯至 2019 年，并将 Shankar Ramaswamy、Fraser Wright 和 Roger Jeffs 列为创始人物。
          tone: neutral
        - year: '2021'
          label: B 轮融资与首个明确的董事会信号
          detail: NCBiotech 报道了 $100 million B 轮融资，并称 Patient Square 的 Jim Momtazee 加入董事会。
          tone: positive
        - period: May 2022
          label: 估算的 C 轮融资
          detail: SetterVC 的融资表列出 $270 million C 轮融资；应将该数字视为追踪器数据，而不是完全验证过的一手轮次记录。
          tone: positive
        - period: Jul 2023
          label: 估算的 C 轮扩展融资
          detail: SetterVC 的融资表列出 $150 million 扩展融资，但公开数据与后续融资记录之间的对账仍未完成。
          tone: neutral
        - period: May 2025
          label: KRIYA-825 进入临床相关阶段
          detail: MedPath 报道了 ARVO 临床前数据，并称一项地理性萎缩 1/2 期试验已经在进行。
          tone: positive
        - date: 2025-08-24T00:00:00.000Z
          label: $313.3M 融资披露
          detail: PackGene 报道了该融资，并指出底层 SEC 文件没有识别两家参与投资者。
          tone: positive
        - date: 2026-06-29T00:00:00.000Z
          label: PreCheck 出现在二手追踪器中
          detail: SetterVC 将 FDA PreCheck 获选标记为近期监管与制造就绪度信号。
          tone: neutral
        - date: 2026-07-03T00:00:00.000Z
          label: FDA PreCheck 公开公告
          detail: PackGene 称 FDA 选中 Kriya 参加与其新 RTP 商业化设施相关的 PreCheck 试点。
          tone: positive
    claimRefs:
      - CO006
      - CO009
      - CO010
      - CO011
      - CO013
      - CO014
  - id: FM001
    title: 受证据约束的市场收窄
    type: pyramid
    summary: 由于指定来源池缺少独立 TAM 研究，本金字塔将 Kriya 的机会从广泛的慢性病暴露收窄至其已披露的临床切入点，而不赋予缺乏依据的美元价值。
    data:
      items:
        - label: 广泛的慢性病负担
          displayValue: Millions of patients
          note: 官方材料以定性方式描述顶层，没有给出市场规模数字。
          claimRefs:
            - CM001
        - label: 广泛疾病的基因治疗机会
          displayValue: Very large, untapped
          note: 投资者叙事支持广度，但仍未发布 TAM。
          claimRefs:
            - CM006
        - label: 当前治疗切入点
          displayValue: 3 disclosed domains
          note: 公开产品组合描述主要集中在眼科、代谢疾病和神经病学。
          claimRefs:
            - CM003
        - label: 公开披露的项目广度
          displayValue: 9 assets / 5 clinical-stage medicines
          note: 公开资料显示项目覆盖面广，但单项资产的收入潜力尚未披露。
          claimRefs:
            - CM005
        - label: 近期核心切入点
          displayValue: KRIYA-825 Phase 1/2
          note: 地理性萎缩拥有最清晰的替代治疗叙事，也有最具体的已披露开发信号。
          claimRefs:
            - CM012
            - CM015
        - label: 商业化闸门
          displayValue: RTP facility + FDA PreCheck
          note: 制造与监管准备度属于市场论点的一部分，而不只是后台执行工作。
          claimRefs:
            - CM010
            - CM011
    approximationNotes: 由于指定证据池没有提供可比的 TAM/SAM/SOM 数据集或有来源支持的目标细分市场 CAGR，各层混合了定性描述和基于数量的代理指标。
    claimRefs:
      - CM001
      - CM003
      - CM005
      - CM006
      - CM010
      - CM011
      - CM012
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 该序数图展示保留来源中可见的平台广度，以及已披露的制造与商业化准备度。
    data:
      xAxis:
        label: 保留来源中可见的平台广度
        min: 1
        max: 5
        low: 狭窄 / 单一维度披露
        high: 广泛的多项目披露
        description: Ordinal scores from retained-source disclosures only
        scale: ordinal
      yAxis:
        label: 保留来源中可见的制造与准备度证据
        min: 1
        max: 5
        low: 保留的准备度证据很少
        high: 明确披露了整合式准备度
        description: Ordinal scores from retained-source disclosures only
        scale: ordinal
      points:
        - label: Kriya Therapeutics
          x: 5
          'y': 5
          summary: Broad pipeline plus integrated manufacturing, HOPSON data, and FDA PreCheck disclosure
          claimRefs:
            - CP005
            - CP006
            - CP007
            - CP010
        - label: 4D Molecular Therapeutics
          x: 4
          'y': 2
          summary: Broad AAV platform peer with funding disclosed, but no retained manufacturing-readiness detail
          claimRefs:
            - CP008
        - label: uniQure
          x: 4
          'y': 2
          summary: Broad AAV platform peer with higher disclosed funding than Kriya's official total-raised statement
          claimRefs:
            - CP008
        - label: Editas Medicine
          x: 3
          'y': 1.8
          summary: Adjacency comes from CRISPR plus AAV breadth, not retained readiness evidence
          claimRefs:
            - CP008
        - label: Sana Biotechnology
          x: 3
          'y': 1.8
          summary: Broader cell-and-gene platform peer without retained AAV manufacturing disclosure
          claimRefs:
            - CP008
        - label: Capsida Therapeutics
          x: 2.8
          'y': 1.7
          summary: Targeted AAV neurodegeneration peer with narrower disclosed scope in the retained pool
          claimRefs:
            - CP008
    approximationNotes: 分数仅基于指定的保留来源池作序数判断；同业较低的准备度分数反映保留披露不足，并不证明其现实能力更弱。
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据支持从资本投入走向商业化的路径，但没有当前已披露的收入桥接表。
    data:
      nodes:
        - id: financing
          label: 融资基础
          detail: 公开汇总互相冲突：官方 >$600M、FundedIQ $914M、SetterVC $920M、biotech.gallery >$1.2B。
          claimRefs:
            - CI003
            - CI005
            - CI007
            - CI008
            - CI016
        - id: deployment
          label: 投入平台的资金
          detail: 2021 年募集资金被描述为用于核心技术平台、管线扩张和当前项目。
          claimRefs:
            - CI009
        - id: manufacturing
          label: 制造基础设施
          detail: 公开来源描述了一座 51,000 平方英尺的 RTP 设施，以及 2026 年新商业化设施的建设工作。
          claimRefs:
            - CI010
            - CI011
        - id: pipeline
          label: 临床阶段资产
          detail: Kriya 公开表示拥有五款处于临床阶段的研究药物，且 KRIYA-825 的 1/2 期试验正在进行。
          claimRefs:
            - CI001
            - CI004
        - id: revenue
          label: 收入披露缺口
          detail: 指定的公开来源集未披露收入、ARR、毛利率、现金余额或现金 runway。
          claimRefs:
            - CI014
            - CI015
        - id: proof
          label: 下一步证据节点
          detail: 投资判断需要对账一致的融资历史、现金 runway、上市经济模型，以及支付方或合作伙伴假设。
          claimRefs:
            - CI013
            - CI016
      edges:
        - from: financing
          to: deployment
          label: 融资
          claimRefs:
            - CI009
            - CI016
        - from: deployment
          to: manufacturing
          label: 建设
          claimRefs:
