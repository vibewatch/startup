      - number: '1.4'
        title: 风险框架与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              概览应保持克制。PatSnap 的研发摘要仍将基因疗法环境描述为监管要求复杂、制造成本高且科学不确定性固有的领域；这对一家在广泛的人体疗效数据公开前就大力推进规模化 AAV
              制造的公司尤其重要。同时，指定证据无法稳健核实尽调报告通常会在早期锁定的若干基本信息：确切累计融资、当前估值、当前员工人数、明确的总部口径、当前现金续航和完整董事会名单。这些缺口并不否定平台故事，但会限制后续章节对规模、治理深度和估值纪律的判断把握。
            claimRefs:
              - CO005
              - CO012
              - CO015
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 制造是产品逻辑的一部分
            body: Kriya 的公开叙事对一家私营生物科技公司而言很不寻常：它把研究、开发、数据和制造本身作为核心差异化能力来出售，而不是把制造当作后台能力。
            calloutType: strength
            claimRefs:
              - CO001
              - CO002
              - CO014
          - type: callout
            title: 眼科似乎是最清晰的近期验证点
            body: 指定资料池通过 KRIYA-825 在眼科领域给出了最明确的临床信号，但更广泛的平台故事仍覆盖多个慢性病类别。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
              - CO013
          - type: callout
            title: 公开规模指标仍弱于叙事给人的印象
