        title: 管理层、治理与运营版图
        blocks:
          - type: paragraph
            body: >-
              指定资料池中的公开管理层信息方向清晰，但并不完整。二手资料将 Kriya 的创始团队追溯至 Shankar Ramaswamy、Fraser Wright 和 Roger
              Jeffs；现任高管资料则显示，Ramaswamy 是运营核心，身边是一支规模较小、覆盖财务、医学和非临床开发的已披露团队。治理信息更薄弱：最具体的董事会信息来自 NCBiotech，其称 Patient
              Square 的 Jim Momtazee 随 2021 年 B 轮融资加入董事会。地点证据反而具有一定互补性：多份来源同时把 Kriya 放在 Research Triangle Park / Durham 和
              Palo Alto / Bay Area，这支持其双岸运营版图，但不足以确定单一总部口径。
