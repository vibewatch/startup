companyProfile:
  summary: >-
    Kriya Therapeutics 是一家私营临床阶段基因疗法公司，定位是为常见慢性疾病开发持久、一次给药的药物，而不是只押注单一罕见病资产。公开证据支持其覆盖眼科、代谢疾病和神经科的平台叙事：管线中有 5
    个在研药物，制造准备工作与计划中的商业化工厂相连，也有可观的融资历史；但现金续航、员工人数以及明确的总部口径等核心尽调事项仍未得到充分核实。
  headquarters: Bay Area, California + Research Triangle Park, North Carolina, USA
  productSummary: 基于 AAV 的持久型基因疗法，用于慢性疾病，包括眼科、代谢疾病和神经科项目。
  customerFocus: 大型慢性病市场中的患者和医疗服务提供者，尤其是眼科领域。
  businessModel: 获批疗法未来的商业销售，以及可能的合作或平台变现。
