      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Kriya 的公开产品架构从疾病特异性的 AAV 资产开始，但真正的差异化主要来自其底层整合的数据、工艺和制造层。
    data:
      layers:
        - label: 治疗产品组合
          detail: 覆盖眼科、代谢疾病和神经病学的五个已命名核心项目。
          items:
            - 地理性萎缩 / KRIYA-825
            - 甲状腺眼病
            - 1 型糖尿病 / KRIYA-839
            - 脂肪性肝病 / MASH
            - 三叉神经痛
        - label: 递送与表达设计
          detail: 在指定来源披露了给药方式的组织特异性场景中，采用一次性 AAV 递送。
          items:
            - 单次给药 AAV 载荷
            - 已披露的局部眼部递送
            - 已披露的肌内代谢疾病递送
            - 局部神经系统递送与可控离子通道概念
        - label: 整合式产品引擎
          modules:
            - 载体工程
            - 工艺开发
            - 分析检测
            - 临床前与临床开发
            - GMP 制造
        - label: 数据与准备度层
          outputs:
            - HOPSON 结构化数据系统（PackGene 称 >80M 个数据点）
            - 自动化与数字化优化
            - Research Triangle Park 商业化设施建设
            - 参与 FDA PreCheck 试点
        - label: 临床证据层
          detail: KRIYA-825 的人体阶段公开成熟度证据最清晰，而更广泛的产品组合细节仍较少。
        - label: 控制与质量层
          detail: 公开可见的信息包括仅处于研究阶段的状态和 FDA 设施沟通，但公共服务与安全运营仍披露稀少。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Kriya 的客户采用路径从高负担的慢性病需求出发，经过临床证据和制造准备度，之后才能推断支付方或医疗服务提供者的规模化采用。
    data:
      items:
        - label: 慢性病负担已经存在
          detail: 大型眼科、代谢和神经病学适应症构成需求锚点。
          touchpoints:
            - 当前标准治疗通常需要长期给药或反复干预
            - Kriya 将一次性持久疗效定位为患者价值主张
        - label: 研究项目定义第一批用户触点
          detail: 公司披露的是五款临床阶段研究药物，而不是商业化产品。
          touchpoints:
            - 地理性萎缩
            - 甲状腺眼病
            - 代谢疾病
        - label: 临床入组成为首次真正的采用测试
          detail: 在当前证据集中，人体研究是最早可观察到的使用证明。
          touchpoints:
            - KRIYA-825 1/2 期推进
            - PROGRESS 首个人体 1 型糖尿病研究的启动安排
        - label: 制造与监管准备度降低上市摩擦
          detail: FDA PreCheck 和设施建设支持未来供应能力的可信度。
          touchpoints:
            - RTP 新商业化设施规划
            - FDA 更早介入设施准备度
        - label: 医疗服务提供者和支付方采用仍未经证明
          detail: 该来源池中没有公开来源列出医疗系统客户、覆盖成果或合同条款。
          touchpoints:
            - 未披露客户数量
            - 未披露报销路径
        - label: 扩张取决于获批后的证据
          detail: 跨项目增长需要疗效、安全性和渠道证据，而这些尚未公开。
          touchpoints:
            - 需要能支撑一次性治疗经济性的患者结果
            - 需要不同适应症中医疗服务提供者持续采用的证据
    claimRefs:
      - CU003
      - CU007
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余暴露最高的领域仍是临床证据、制造准备度和融资透明度。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余暴露
      rows:
        - label: 临床证据缺口
          values:
            - label: 高
              tone: high
              note: 核心项目仍在评估安全性和疗效。
            - label: 高
              tone: critical
              note: 没有持久的人体数据，就无法通过审批审查。
            - label: 中
              tone: medium
              note: 产品组合广度有帮助，但不能替代证据。
            - label: 高
              tone: critical
              note: 1/2 期信号疲弱会击穿这套论点。
        - label: 制造准备度
          values:
            - label: 中高
              tone: high
              note: 设施准备度和 CMC 执行仍未完成。
            - label: 高
              tone: high
              note: 延误会影响临床供应和商业化时间。
            - label: 中
              tone: medium
              note: FDA PreCheck 有帮助，但不等于验证完成。
            - label: 高
              tone: high
              note: 扩大生产仍取决于 RTP 场地的执行。
        - label: 资本与披露不透明
          values:
            - label: 中
              tone: medium
              note: 融资渠道强劲，但外部估值读数相互冲突。
            - label: 高
              tone: high
              note: 下一轮融资疲弱可能同时压缩战略空间和估值。
            - label: 中低
              tone: warning
              note: 近期融资缓解了短期压力。
            - label: 高
              tone: high
              note: 公开证据无法对账累计融资额、估值和现金 runway。
        - label: 对递送合作伙伴的依赖
          values:
            - label: 中
              tone: medium
              note: 眼科执行仍依赖专业递送工具。
            - label: 中高
              tone: high
              note: 递送受挫会损害核心项目之一。
            - label: 中
              tone: medium
              note: 早期临床前和操作工作降低了风险，但没有消除风险。
            - label: 中高
              tone: high
              note: 来源池缺少人体证据，无法证明与合作伙伴相关的路径可以顺利规模化。
        - label: 管线淘汰与重新排序
          values:
            - label: 中高
              tone: high
              note: 较早的候选项目似乎已经退出活跃管线。
            - label: 中高
              tone: high
              note: 在临床证据出现前重新排序可能消耗资本。
            - label: 中低
              tone: warning
              note: 产品组合广度提供了选择权，但不能保证进度。
            - label: 中高
              tone: high
              note: 持续的项目流失会削弱对平台转化能力的信心。
        - label: 行业融资阻力
          values:
            - label: 中
              tone: medium
              note: 基因治疗融资仍比 2021 年市场更难。
            - label: 中高
              tone: high
              note: 行业疲弱可能削弱估值支撑，即使平台本身较强。
            - label: 中
              tone: medium
              note: Kriya 的融资历史缓解了短期压力。
            - label: 中高
              tone: high
              note: 在行业疲弱时，后续融资仍可能以更苛刻的条款完成。
    approximationNotes: 定性分数仅综合指定来源池，不使用未公开的安全性、现金或设施准备度数据。
    claimRefs:
      - CR004
      - CR007
      - CR008
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 平台广度和资本获取能力的正面因素，被透明度与证据缺口抵消，因此建议仍为跟踪。
    data:
      nodes:
        - id: platform
          label: 广泛的临床阶段平台
          detail: 五款处于临床阶段的研究药物，以及更广泛的下一波管线，支撑选择权
          tone: positive
        - id: market
          label: 大病种市场聚焦
          detail: 该战略瞄准高患病率的严重疾病，而不是狭窄的罕见病市场。
          tone: positive
        - id: financing
          label: 资本仍然可用
          detail: 尽管基因治疗市场情绪艰难，公开来源仍显示 2025 年完成了一轮大额私募融资。
          tone: positive
        - id: readiness
          label: 制造 / 监管准备度
          detail: FDA PreCheck 参与将 RTP 设施与商业化准备工作连接起来。
          tone: positive
        - id: transparency
          label: 估值信号冲突
          detail: 公开数据库对当前私人估值存在重大分歧，并警示数据质量问题。
          tone: risk
        - id: proof
          label: 人体数据与现金可见度仍薄弱
          detail: 公开来源仍未给出清晰的 Series D 后现金、烧钱或疗效情况。
          tone: high
        - id: recommendation
          label: 跟踪，而非买入
          detail: 等更强的人体证据、更好的资产负债表披露或明显更便宜的入场点后重新评估。
          tone: warning
      edges:
        - from: platform
          to: recommendation
          label: 支持选择权
        - from: market
          to: recommendation
          label: 支持 TAM 论点
        - from: financing
          to: recommendation
          label: 延长现金 runway
        - from: readiness
          to: recommendation
          label: 改善执行论点
        - from: transparency
          to: recommendation
          label: 限制投资判断的信心
        - from: proof
          to: recommendation
          label: 维持较高的价格敏感度
    approximationNotes: 该流程图只表达方向和定性关系；它整理了影响投资建议的有据可查因素，不代表任何数值权重。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
