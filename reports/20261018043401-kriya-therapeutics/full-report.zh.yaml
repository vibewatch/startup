      - number: '7.4'
        title: 哪些因素会降低风险评级，哪些会打破论点
        blocks:
          - type: paragraph
            body: >-
              主要缓释因素真实存在，但并不完整。参与 FDA PreCheck 应能改善制造沟通；多项目组合降低单一资产依赖；Kriya
              也已明确证明自己能获得大额融资。可是，这些缓释因素都不能替代公开的人体疗效、安全性和制造证据。最清晰的积极去风险事件，是 KRIYA-825 或 KRIYA-839 取得令人信服的早期临床数据，同时证明 RTP
              制造建设按计划走向商业化准备，没有重大 FDA 或验证障碍。最清晰的打破论点触发因素，是 1/2
              期安全性或疗效信号弱于预期、工厂准备度明显延迟，或者当前公开资料持续无法核对累计融资、估值和续航。在这些缺口关闭前，剩余风险仍高到足以要求尽调重点放在数据室证明，而不是叙事信心。
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 临床证明仍是闸门风险
            body: 领先的眼科和糖尿病项目仍在证明安全性、疗效和持久性，因此积极的平台宣传尚不能替代人体数据。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: callout
            title: FDA PreCheck 是有用信号，而非准备度结论
            body: PreCheck 降低了工厂建设周围的协调风险，但所引用的项目表述仍显示，设计、建设和运营准备工作必须执行到位。
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: 把融资实力当作缓冲，而不是去风险事件
            body: 公司已完成大额融资，但当前公开来源仍无法足够严密地核对累计融资、估值或融资后的续航，不能据此认为资金风险已经解决。
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议立场
        blocks:
          - type: paragraph
            body: >-
              基于现有证据，最清晰的判断是持续跟踪，而不是买入或回避。Kriya 仍有创造价值的要素：公司正在为广泛的慢性病基因疗法平台融资，看起来仍能吸引大额私募轮次，并通过参与 FDA PreCheck
              增加了当前的商业化准备度信息。但价格证据太嘈杂，不能激进地做投资判断。Forge 显示 2025 年 9 月 D 轮的投后估值估算为 $1.67 billion；SetterVC 则显示 2025 年 8
              月最新估值标记为 $8
              billion，并另行警告其融资和估值标记可能不完整、过时、错误或已修订。在现金、消耗、续航和更广泛的优先权结构细节仍未公开的情况下，审慎做法是等待更好的证明或更便宜的入场点，而不是为不完整数据上的溢价故事付费。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: 仍支持上行空间的因素
        blocks:
          - type: paragraph
            body: >-
              Kriya 不只是单一资产生物科技押注。官方和面向投资者的材料将公司定位为开发常见慢性病的持久型药物，管线中已有 5 个临床阶段在研药物，后续项目还计划复用此前的数据、制造和产品经验。Foresite
              的投资组合描述进一步说明，该策略面向高发的严重疾病，而非更狭窄的孤儿病细分；这正是临床证明不断积累后，公司有可能获得平台型选择权的核心原因。2026 年 7 月入选 FDA PreCheck 很重要，因为它把
              Kriya 的 Research Triangle Park 工厂直接与商业化准备流程相连，而不是停留在抽象的制造故事上。最新一轮融资也说明，尽管行业环境艰难，成熟资本尚未放弃这一平台。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
