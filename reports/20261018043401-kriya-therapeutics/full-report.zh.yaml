      - number: '4.3'
        title: 资本基础、估值标记与充足性
        blocks:
          - type: paragraph
            body: >-
              相较多数私营生物科技公司，Kriya 看起来资金充足，但准确起点仍模糊。官方 2025 年 5 月 ARVO 新闻稿称 Kriya 已募资超过 $600 million；FundedIQ 列出 5 轮合计
              $914 million，并称 2025 年 8 月最新一轮为 $313 million；SetterVC 列出 5 轮合计 $920 million，并给出截至 2025 年 8 月 15 日的 $8
              billion 估值标记，同时警告融资和估值标记可能不完整或错误；biotech.gallery 则称公司背后有超过 $1.2
              billion。这些区间在方向上都与强融资能力一致，但不够精确，无法据此判断当前现金、稀释或估值跃升纪律。公开证据里最积极的一点是，Kriya 在 2026
              年仍在投入商业化准备基础设施；但由于现金余额、消耗和续航均未披露，资本充足性仍是待解决的投资判断问题。
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI016
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论是：Kriya
              目前更像一家资本密集、里程碑驱动的私营基因疗法平台，能够获得资本，但收入质量、定价权和近期自我造血能力的公开证据有限。负面视角很重要：该行业仍受制造、安全和报销障碍限制；一项生物科技分析据估算，像 Kriya
              这样拥有 9 个项目的平台每年可能消耗 $150-200
              million。这不是经过核实的公司披露，却提醒人们，一体化基因疗法基础设施可能迅速消耗现金。在管理层提供可核对的融资历史、融资后现金、消耗、续航、上市经济性以及付款方或合作方假设之前，本章支持的是跟踪执行，而不是对收入持久性做投资判断。
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
