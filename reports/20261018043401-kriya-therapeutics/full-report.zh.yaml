      - number: '4.2'
        title: 成本结构、制造扩建与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              公开来源一致描述了一种最终可能支持规模化、但在产品收入可见前需要大量固定成本吸收的制造优先运营模式。NCBiotech 称，Kriya 将 2021 年 B
              轮资金用于开发核心技术平台并扩充管线；同一报道还提到一座 51,000 平方英尺的 Research Triangle Park 制造工厂。2026 年 7 月，PackGene 报道 FDA 根据 Kriya
              计划在 Research Triangle Park 建设新商业化工厂的方案，选择其参加 PreCheck 试点；该工厂预计支持已进入临床试验的管线产品。PackGene 还描述了一个拥有超过 80
              million 个数据点的专有数据系统，这支持“工艺开发和制造知识最终可能成为利润杠杆”的判断，但前提是 Kriya 先跨过仍在前方的临床和监管里程碑。
