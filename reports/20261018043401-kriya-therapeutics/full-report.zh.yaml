            title: Kriya 的护城河首先在上游，而非商业端
            body: 保留的证据更支持围绕制造、数据和工厂准备度建立平台控制逻辑，而不是已经证明的市场销售或定价优势。
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
              - CP010
          - type: callout
            title: 直接同行基准仍太薄，无法判断长期赢家
            body: 公开同行证据大多是目录式资料，缺少定价、客户证明和运营细节，因此在出现更直接的竞争者披露前，关于优越性的主张应暂时保留。
            calloutType: risk
