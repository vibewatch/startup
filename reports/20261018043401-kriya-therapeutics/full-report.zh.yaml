              - CV014
      - number: '8.3'
        title: 为什么公开证据还不足以支持高价买入
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是完全没有信号，而是信号集合相互不一致，且部分被门槛限制。Forge 提供了具体的 D 轮条款，包括每股价格和 1.0x
              清算优先权线索；但它也说明，投后估值是根据公司提交的公司注册证书估算的，私营公司数据未经审计。SetterVC
              给出的最新估值标记和累计融资数字高得多，但也附上直接警告，称这些标记可能不完整、过时、错误或已修订。EquityZen
              确认存在部分二级市场访问和股东流动性基础设施，但将股权结构、估值和财务细节留给登录用户。再加上不利的行业报道仍强调基因疗法的安全审查、多年低迷的市场情绪和高额资本消耗，在人体疗效和资产负债表披露让情况更清楚之前，投资者不应赋予过高溢价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              剩余尽调议程很直接。第一，用一手文件核对 2025
              年融资历史和股权结构，因为公开轮次标签、规模和估值标记之间的对应还不够紧密，无法做投资判断。第二，取得当前现金、消耗和续航视图；即便平台强大，如果必须在关键临床拐点前再融资，也可能成为糟糕的投资。第三，取得领先项目的人体疗效、持久性和安全性证据，因为长期上行空间最终依赖临床证明，而不只是拥有一套制造平台。任何早期人体数据令人失望、出现融资悬置或下轮融资迹象，或行业安全冲击在
              Kriya 将平台主张转化为商业证明之前收窄资本获取渠道，都可能打破论点。
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断
            body: 持续跟踪公司，但在做溢价估值判断前，等待人体疗效、D 轮后流动性披露，或更明显折价的入场点。
