              Research Triangle Park 建设新商业化工厂的计划，选择其参加 PreCheck 试点，并将该项目描述为工厂设计、建设和运营准备期间的早期参与，而不是该工厂已经具备检查准备度的证明。这与
              NCBiotech 的旧报道一致：Kriya 当时自己称，该领域受制造技术、载体设计能力和成本限制。项目设计又带来额外执行风险：2026 年 4 月关于 KRIYA-839
