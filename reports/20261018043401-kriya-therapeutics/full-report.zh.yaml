      - number: '3.2'
        title: 公开差异化来自治疗负担、已验证生物学和平台广度
        blocks:
          - type: paragraph
            body: >-
              Kriya 反对现有治疗模式的公开论点很直接：KRIYA-825 靶向已经验证的补体通路，希望用一次给药取代长期重复治疗。官方 ARVO 新闻稿称，该项目靶向补体 C3 和 C5，指出地理性萎缩已有 FDA
              批准药物，并将 KRIYA-825 描述为减少当前方案反复注射负担的尝试。这一点重要，因为它把面向买方的价值主张建立在给药负担上，而不仅是分子新颖性上。同时，同一批来源也强调 KRIYA-825
              仍处于在研阶段，临床安全性和疗效尚未得到确立，因此公司目前竞争的是预期中的产品设计，而非已经证明的患者转用行为。
            claimRefs:
              - CP002
              - CP003
              - CP014
              - CP016
          - type: table
            tableRef: TP002
