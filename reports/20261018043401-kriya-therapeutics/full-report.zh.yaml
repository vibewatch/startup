        title: 临床获批风险仍是打破论点的首要因素
        blocks:
          - type: paragraph
            body: >-
              核心风险仍是 Kriya 能否把广泛的 AAV 管线转化为足以支持常见慢性病获批的人体安全性和疗效证据。Kriya
              自己的药物页面称，其持久型药物仍处于在研阶段，尚未获得任何监管卫生机构对安全性或有效性的批准；其新闻页也重复了同样的表述。公司 2025 年 5 月的 ARVO 新闻稿称，KRIYA-825
              于当年早些时候进入临床试验，但同时说明该产品尚未获批，临床安全性和疗效也尚未确立。PackGene 2026 年 4 月的一篇文章另称，KRIYA-839 的首个人体 PROGRESS 研究仍计划用 52
              周评估安全性和疗效，说明较新的糖尿病平台也仍在早期建立证明。对投资者而言，实际含义是：在缺少公开人体读出、无法证明常见疾病场景下的持久疗效、耐受性和可制造性之前，估值和平台广度还不足以抵消风险。
