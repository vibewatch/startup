  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与治疗切入点
        blocks:
          - type: paragraph
            body: >-
              现有来源将 Kriya 的市场边界定义为面向常见或高患病率慢性病的持久型、一次给药 AAV 药物，而不是历史上主导商业化基因疗法的早期“只做罕见病”模式。Kriya
              自己的药物页面称，公司成立的目的，是治疗影响数百万患者的慢性疾病；Foresite Capital 和 PatSnap 也都把公司放在更广泛的慢性病或高发疾病类别中，而不是小众单基因疾病。


              这一边界很关键，因为 Kriya 披露的项目组合覆盖眼科、代谢疾病和神经科。VentureRadar 的项目列表与 Kriya 的药物页面共同显示，其组合包括地理性萎缩、甲状腺眼病、1 型糖尿病、MASH
              和三叉神经痛，此外还有尚未披露的项目。放眼市场，Kriya 并不是要赢下一种孤立适应症，而是试图在多个由专科医生管理的慢性病类别中，证明一套可复制的产品和制造模式。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM009
              - CM010
      - number: '2.2'
        title: 存在规模化信号，但公开 TAM 仍未充分定义
        blocks:
          - type: paragraph
            body: >-
              最强的公开市场信号是市场广度和投资者兴趣，而不是经过严谨披露的收入池。Kriya 及其支持者反复使用“常见疾病”“数百万患者”和“非常巨大且此前尚未开发的机会”等定性表述。Pharmaceutical
              Technology 还报道，2025 年 9 月的 D 轮融资以 $320 million 超额认购；The BioTech Strategist 则将其视为 2025
              年较大的私营生物科技融资之一。这些信息说明，成熟投资者相信这里可能存在巨大的商业回报。


              但指定证据仍没有提供足以把该论点变成可辩护 TAM、SAM 或 SOM 的硬市场测算。保留的来源没有拆出 Kriya 目标疾病类别的可服务支出，没有披露采用率假设，也没有给出能与 Kriya
              特定给药模式对应的市场 CAGR。因此，下图只从广泛的慢性病负担定性收窄到 Kriya 披露的切入点，而不添加缺乏依据的美元规模层级。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM015
