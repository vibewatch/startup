callouts:
  - calloutType: risk
    title: Clinical proof remains the gating risk
    body: >-
      The lead ophthalmology and diabetes programs are still proving safety,
      efficacy, and durability, so positive platform rhetoric cannot yet substitute
      for human data.
    claimRefs: [CR001, CR003, CR004, CR005]
  - calloutType: insight
    title: FDA PreCheck is a useful signal, not a readiness verdict
    body: >-
      PreCheck lowers coordination risk around facility buildout, but the cited
      program language still points to design, construction, and operational
      readiness work that has to be executed cleanly.
    claimRefs: [CR007, CR008]
  - calloutType: recommendation
    title: Treat financing strength as a cushion, not a de-risking event
    body: >-
      The company has raised large rounds, yet current public sources still do not
      reconcile total capital raised, valuation, or post-raise runway tightly
      enough to assume funding risk is solved.
    claimRefs: [CR013, CR014, CR015]
