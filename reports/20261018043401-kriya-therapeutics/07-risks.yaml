company:
  name: Kriya Therapeutics
chapter:
  number: 7
  title: Risks
  summary: >-
    Kriya's top risks remain clinical and regulatory: its lead programs are still
    investigational, no therapy is approved, and public human efficacy evidence is
    still limited. Manufacturing-readiness work, delivery-partner dependence, and
    inconsistent public funding/valuation figures leave residual execution and
    financing risk high despite unusually strong capital access.
sections:
  - id: clinical-and-regulatory-proof-gap
    title: Clinical approval risk remains the primary thesis breaker
    body: >-
      The core risk is still whether Kriya can convert a broad AAV pipeline into
      human safety and efficacy evidence that is strong enough for approval in
      common chronic diseases. Kriya's own medicines page says its durable
      medicines are investigational and have not been approved as safe or
      effective by any regulatory health authority, and the same posture is echoed
      on its news page. The company's May 2025 ARVO release says KRIYA-825
      entered a clinical trial earlier that year, but it also states that the
      product has not been approved and that its clinical safety and efficacy have
      not yet been established. A separate April 2026 PackGene write-up says the
      first-in-human PROGRESS study for KRIYA-839 is still structured to evaluate
      safety and efficacy over 52 weeks, confirming that even the newer diabetes
      platform remains in an early proof-building stage. For investors, the
      practical implication is that valuation and platform breadth do not yet
      offset the absence of public human readouts showing durable efficacy,
      tolerability, and manufacturability in common-disease settings.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
  - id: manufacturing-and-operational-readiness
    title: Manufacturing scale-up and delivery complexity are still unresolved
    body: >-
      Kriya's second major risk is operational: the company is trying to move
      AAV manufacturing, delivery, and quality systems from promising platform
      rhetoric into repeatable commercial readiness. PackGene's July 2026 summary
      says the FDA selected Kriya for the PreCheck Pilot Program based on plans
      for a new commercial facility in Research Triangle Park, and describes the
      program as early engagement during facility design, construction, and
      operational readiness rather than proof that the site is already inspection
      ready. That matches older NCBiotech coverage in which Kriya itself said the
      field was constrained by manufacturing technology, vector design
      capabilities, and cost. Program design adds further execution risk: the
      April 2026 KRIYA-839 article says treatment is expected to involve multiple
      intramuscular injections plus short-term immune modulation, while KRIYA-825
      depends on specialized ocular delivery. These are manageable risks, but
      they require flawless clinical operations, CMC discipline, and device or
      procedure consistency to avoid schedule slips.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR016]
    tableRefs: [TR002]
  - id: capital-and-dependency-risk
    title: Capital access is strong, but disclosure opacity and partner dependencies remain
    body: >-
      Kriya has clearly been able to keep attracting capital, but the public
      evidence base does not reconcile cleanly and that itself is a risk signal.
      SetterVC lists total funding at $920 million across five rounds and a
      latest valuation mark of $8 billion dated August 15, 2025, while also
      warning that its company data and valuation marks may be incomplete, stale,
      erroneous, or revised. By contrast, Labiotech says Kriya's September 2025
      Series D brought its total funds above $1.2 billion, and separately argues
      that the company has disclosed little about how its August 2025 financing
      would be spent. The same Labiotech piece says early KT-A112, KT-A522, and
      KT-A832 programs no longer appear in the active pipeline and that most of
      Kriya's nine candidates remain preclinical, raising the possibility that
      capital has outrun public proof. Dependency risk is also tangible because
      KRIYA-825's ocular delivery path relies on Everads-linked technology rather
      than a wholly self-contained product stack.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: What would reduce the risk rating, and what would break the thesis
    body: >-
      The main mitigants are real but incomplete. FDA PreCheck participation
      should improve manufacturing dialogue, a multi-program portfolio reduces
      single-asset dependency, and Kriya has clearly demonstrated access to large
      financing rounds. None of those mitigants eliminates the need for public
      human efficacy, safety, and manufacturing evidence. The clearest positive
      de-risking event would be convincing early clinical data from KRIYA-825 or
      KRIYA-839 paired with evidence that the RTP manufacturing build is tracking
      to commercial readiness without material FDA or validation setbacks. The
      clearest thesis-break triggers are weaker-than-expected Phase 1/2 safety or
      efficacy signals, visible delays in facility readiness, or a continued
      inability to reconcile total capital raised, valuation, and runway from
      current public sources. Until those gaps close, the residual risk profile
      remains high enough that diligence should focus on data-room proof rather
      than narrative confidence.
    claimRefs: [CR004, CR007, CR008, CR013, CR014, CR015]
    figureRefs: [FR001]
