  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: capital-disclosure
      missingEvidence: A reconciled financing timeline linking the August 2025 Form D, the September 2025 Series D, total capital raised, and the latest post-money valuation.
      whyItMatters: Public sources disagree on total funding and provide only estimated valuation marks, which affects runway and downside analysis.
      diligencePath: Request the cap table summary, financing closing memo, and board-approved post-money mark used in the latest round.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR001, TR003]
    - type: missing-source
      severity: material
      topic: regulatory-enforcement
      missingEvidence: Direct regulator or court records confirming whether Kriya has any inspection findings, enforcement actions, recalls, clinical holds, or litigation.
      whyItMatters: The assigned pool is enough to identify regulatory exposure categories, but not enough to rule legal or compliance issues in or out.
      diligencePath: Search FDA inspection records and warning letters, PACER/state court dockets, and any company insurance or legal-disclosure schedules.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: manufacturing-economics
      missingEvidence: Current batch-yield, cost-of-goods, capacity, validation, and release-readiness metrics for the RTP manufacturing platform.
      whyItMatters: Manufacturing scale, cost, and quality are central to Kriya's thesis but are not quantified in the public pool.
      diligencePath: Obtain facility validation plans, recent batch records, deviation logs, and internal CMC milestone dashboards.
      relatedQuestionRefs: [QR003, QR007]
      relatedTableRefs: [TR002, TR003]
    - type: missing-source
