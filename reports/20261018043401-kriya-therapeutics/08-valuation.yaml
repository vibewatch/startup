company:
  name: Kriya Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Kriya still looks financeable and strategically differentiated, but the public
    record does not yet support paying a premium private-platform price with confidence.
    The latest visible financing evidence, manufacturing-readiness signals, and market
    opportunity argue for staying engaged, while conflicting valuation marks, limited
    balance-sheet transparency, and thin human efficacy disclosure keep the recommendation at track.
sections:
  - id: recommendation-posture
    title: Recommendation posture
    body: >-
      The cleanest read from the available evidence is track rather than buy or avoid.
      Kriya still has ingredients that can create value: the company is funding a broad
      chronic-disease gene-therapy platform, still appears able to attract large private
      rounds, and has added a current commercialization-readiness datapoint via FDA
      PreCheck participation. At the same time, the price evidence is too noisy to
      underwrite aggressively. Forge shows a September 2025 Series D with an estimated
      $1.67 billion post-money valuation, while SetterVC shows an August 2025 latest
      valuation mark of $8 billion and separately warns that its funding and valuation
      marks may be incomplete, stale, erroneous, or revised. With cash, burn, runway,
      and broader preference-stack details still undisclosed in public sources, the
      prudent posture is to watch for better proof or a cheaper entry rather than
      pay for a premium story on incomplete data.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV013, CV014, CV015]
    tableRefs: [TV001]
  - id: upside-underwriting
    title: What still supports upside
    body: >-
      Kriya remains more than a single-asset biotech bet. Official and investor-facing
      materials frame the company around durable medicines for common chronic diseases,
      with five clinical-stage investigational medicines already in the pipeline and a
      broader follow-on wave intended to compound prior data, manufacturing, and product
      learnings. Foresite's portfolio description reinforces that the strategy is aimed
      at highly prevalent serious diseases rather than narrower orphan segments, which is
      the core reason the company can plausibly earn platform-style optionality if the
      clinical proof accumulates. The July 2026 FDA PreCheck selection matters because it
      ties Kriya's Research Triangle Park facility directly to commercial-readiness
      processes rather than to an abstract manufacturing story. The latest financing also
      signals that sophisticated capital has not abandoned the platform despite a tough
      sector tape.
    claimRefs: [CV005, CV006, CV007, CV008, CV011]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: price-discipline
    title: Why public evidence does not yet support paying up
    body: >-
      The central valuation problem is not that there is no signal; it is that the
      signal set is inconsistent and partially gated. Forge presents specific Series D
      terms, including price per share and a 1.0x liquidation preference clue, but also
      states that its post-money valuation is an estimate based on company-submitted
      certificates of incorporation and that its private-company data are not audited.
      SetterVC offers a much higher latest valuation mark and a total-raised figure, but
      it also attaches a direct warning that those marks may be incomplete, stale,
      erroneous, or revised. EquityZen confirms some secondary-market access and
      shareholder-liquidity infrastructure, yet reserves cap-table, valuation, and
      financial detail for logged-in users. On top of that transparency gap, adverse
      sector coverage still emphasizes safety scrutiny, multi-year-low sentiment, and
      heavy capital consumption across gene therapy, which limits how much premium one
      should ascribe before human efficacy and balance-sheet disclosure sharpen the picture.
    claimRefs: [CV001, CV002, CV003, CV004, CV009, CV010, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: final-diligence-asks
    title: Final diligence asks and thesis-breakers
    body: >-
      The remaining diligence agenda is straightforward. First, reconcile the 2025 round
      history and cap-table stack using primary documents, because public round labels,
      sizing, and valuation marks do not line up tightly enough for underwriting. Second,
      get a current cash, burn, and runway view; even a strong platform can be a weak
      investment if it must refinance before decisive clinical inflection points. Third,
      get human efficacy, durability, and safety evidence from lead programs, because the
      long-term upside case ultimately depends on clinical proof rather than on the
      existence of a manufacturing platform alone. A thesis break would be any combination
      of disappointing early human data, evidence of a financing overhang or down-round
      setup, or a sector-safety shock that narrows capital access before Kriya can
      convert platform claims into commercial proof.
    claimRefs: [CV002, CV003, CV008, CV010, CV012, CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Item
      - Assessment
      - Evidence / implication
    rows:
      - [Recommendation, Track, Large upside remains possible but price support is not yet clean enough for a buy.]
      - [Confidence, Medium, The evidence base is directionally useful but too inconsistent for a high-confidence underwriting call.]
      - [Risk rating, High, "Clinical, regulatory, financing, and valuation-transparency risks are all still material."]
      - [Valuation stance, Stretched, Premium marks are visible in public databases but not yet validated by a transparent cap table or human proof.]
      - [Decision implication, Stay engaged but do not chase, "Re-underwrite after human data, cash/runway disclosure, or a clearly discounted entry point."]
    notes: >-
      Public pricing evidence mixes estimated private-market marks, round disclosures, and gated secondary-market metadata; use the table as an underwriting posture, not a precise fair-value model.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV010, CV013, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current read
      - What would change the view
    rows:
      - [Thesis, Kriya is funding a broad chronic-disease gene-therapy platform with five clinical-stage investigational medicines and evidence of manufacturing-readiness progress., Positive early human efficacy plus disclosed post-Series-D liquidity would strengthen conviction.]
      - [Anti-thesis, Public valuation marks conflict sharply and private-market transparency is still weak relative to the price sensitivity of a late-stage private biotech investment., A reconciled cap table plus consistent third-party valuation evidence would reduce the underwriting discount.]
      - [Comparable context, A $313 million to $320.82 million 2025 round still screens as unusually large for private biotech during a difficult gene-therapy tape., Sector financing leadership matters less if burn remains elevated and lead assets fail to produce decisive proof.]
    notes: >-
      Comparable context is limited to what the retained sources explicitly state about private financing scale and business model positioning; it is not a full public-comps model.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV011, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, Lead human data are strong and durable while FDA-facility engagement translates into credible commercialization readiness., The company can start to justify a premium platform mark closer to the richer private-database readings rather than only the last visible financing terms., Safety setbacks or delayed data could erase the premium quickly., Low until human efficacy and balance-sheet disclosure improve.]
      - [Base, Kriya keeps funding the platform and advancing programs but still lacks decisive human proof and clean cap-table transparency., The September 2025 financing reference remains the most usable public anchor and upside waits on new proof rather than multiple expansion alone., Conflicting valuation marks and limited cash disclosure keep underwriting discipline tight., Medium.]
      - [Bear, Sector safety pressure or disappointing early data arrives before the platform shows commercial proof and before transparency improves., Downside sits below the latest visible financing reference because public evidence does not yet defend a premium valuation floor., "Down-round risk, burn pressure, and tougher capital markets could compress value simultaneously.", Meaningful while the key gaps remain open.]
    notes: >-
      Scenario logic intentionally brackets around sourced public valuation references instead of inventing an unsupported point estimate; the missing cap-table and cash data are part of the scenario itself.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV010, CV012, CV013, CV014, CV015]
