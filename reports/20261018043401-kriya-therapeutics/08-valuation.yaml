        - from: transparency
          to: recommendation
          label: Caps underwriting confidence
        - from: proof
          to: recommendation
          label: Keeps price sensitivity high
    approximationNotes: >-
      The flow is directional and qualitative; it organizes sourced factors affecting the recommendation and does not imply numeric weighting.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV010, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Current call
    body: >-
      Track the company, but wait for human efficacy, post-Series-D liquidity disclosure,
      or a more clearly discounted entry point before underwriting a premium valuation.
    claimRefs: [CV001, CV003, CV004, CV008, CV013, CV014]
  - calloutType: risk
    title: Main reason not to pay up today
    body: >-
      The public record shows large financing support but still does not reconcile current
      valuation marks, broader preference overhang, cash runway, and burn well enough to
      justify a high-conviction price.
    claimRefs: [CV002, CV003, CV004, CV009, CV012, CV013, CV015]
