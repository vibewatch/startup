  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation-mark
      missingEvidence: Reconciled primary financing documents showing the exact 2025 round label, round size, post-money valuation, and full cap-table stack.
      whyItMatters: Public sources show materially different valuation marks and only partial preference information, which weakens underwriting confidence.
      diligencePath: Obtain the 2025 stock purchase documents, amended charter, and board financing materials; reconcile them against Forge and SetterVC.
    - type: private-evidence-only
      severity: material
      topic: burn-risk
      missingEvidence: Current cash balance, quarterly burn, covenant or project-finance obligations, and runway after the 2025 financing.
      whyItMatters: The recommendation depends on whether Kriya can reach clinical inflection points before needing to refinance.
      diligencePath: Request the latest board package or lender/investor updates with cash, burn, and runway detail.
    - type: missing-source
      severity: material
      topic: human-proof
      missingEvidence: Human efficacy, durability, and safety readouts from KRIYA-825 or other lead programs that can justify platform-value expansion.
      whyItMatters: Manufacturing and financing strength are insufficient on their own to support a premium valuation without clinical proof.
      diligencePath: Review trial updates, investor materials, or management diligence sessions focused on first-in-human readouts and their timing.
