callouts:
  - calloutType: strength
    title: Manufacturing is part of the product thesis
    body: >-
      Kriya's public story is unusual for a private biotech because it sells the integrated engine
      itself—research, development, data, and manufacturing—as a core differentiator rather than a back-office capability.
    claimRefs: [CO001, CO002, CO014]
  - calloutType: insight
    title: Ophthalmology looks like the clearest near-term proof point
    body: >-
      The assigned pool gives the sharpest concrete clinical signal in ophthalmology through KRIYA-825,
      while the broader platform story still spans multiple chronic-disease categories.
    claimRefs: [CO003, CO004, CO013]
  - calloutType: risk
    title: Public scale metrics are still softer than the narrative suggests
    body: >-
      Kriya clearly has a large-capital story, but valuation, exact total funding, headcount, board
      composition, and cash runway all remain too weakly sourced to treat as verified cover facts.
    claimRefs: [CO010, CO011, CO012, CO015]
