artifact: company-overview
slug: kriya-therapeutics
runDate: 2026-10-18
company:
  name: Kriya Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kriya presents as a heavily capitalized, manufacturing-forward gene-therapy company trying
    to make one-time AAV medicines work in large chronic diseases rather than narrow rare-disease
    niches. The assigned evidence supports its integrated-platform story, a bi-coastal operating
    footprint, and meaningful financing and regulatory milestones, but still leaves valuation,
    headcount, exact board composition, and financing reconciliation too weak for verified cover facts.
sections:
  - id: company-identity-and-platform
    title: Identity and platform
    body: >-
      Kriya’s own website consistently frames the company around durable, one-time medicines for
      chronic diseases and around an integrated development model rather than a single-asset story.
      That matters because later chapters can treat Kriya as a platform-shaped private biopharma,
      not just a narrow ophthalmology bet: the medicines page says the clinical-stage pipeline
      already includes five investigational medicines, while third-party profiles independently
      cluster the visible disease focus in ophthalmology, metabolic disease, and neurology.
      The combined read is a company trying to industrialize gene therapy for larger patient
      populations, with manufacturing and delivery economics positioned as part of the product thesis.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-governance-and-footprint
    title: Leadership, governance, and footprint
    body: >-
      The public leadership picture in the assigned pool is directionally clear but not fully
      complete. Secondary profiles trace Kriya’s founding bench to Shankar Ramaswamy, Fraser
      Wright, and Roger Jeffs, while current executive references identify Ramaswamy as the
      operating center of gravity alongside a smaller disclosed team spanning finance, medical,
      and nonclinical development. Governance visibility is thinner: the strongest specific
      board datapoint is NCBiotech’s note that Patient Square’s Jim Momtazee joined the board
      with the 2021 Series B. Location evidence is also mixed in a useful way: several sources
      place Kriya in both Research Triangle Park/Durham and Palo Alto/Bay Area, which supports
      a bi-coastal operating footprint but not a clean single-headquarters convention.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: financing-and-milestones
    title: Financing and milestones
    body: >-
      Funding scale is clearly part of the Kriya narrative, but the public record is still uneven.
      NCBiotech directly reports a $100 million Series B in 2021, and PackGene later reports a
      $313.3 million 2025 financing tied to an SEC filing whose investors were not named.
      SetterVC’s tracker fills in additional rounds and a much larger aggregate capital stack,
      but its own caveat explicitly says the funding, valuation, and employee fields may be
      incomplete, stale, erroneous, or revised, so those values are better treated as directional
      context than verified cover metrics. Operationally, the most concrete recent proof points
      are the KRIYA-825 ophthalmology program reaching Phase 1/2 and the FDA PreCheck pilot
      selection linked to Kriya’s new commercial facility in RTP.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
  - id: risk-frame-and-open-diligence-items
    title: Risk frame and open diligence items
    body: >-
      The overview should stay tempered. PatSnap’s R&D synopsis still characterizes the gene-therapy
      environment as one with complex regulatory requirements, high manufacturing costs, and inherent
      scientific uncertainties, which is especially relevant for a company leaning hard into scaled
      AAV manufacturing before public human efficacy data are broad. At the same time, the assigned
      evidence does not robustly verify several reader-facing basics a diligence report would ideally
      lock down early: exact total capital raised, current valuation, current headcount, a definitive
      headquarters convention, current cash runway, and a complete board roster. Those omissions do
      not invalidate the platform story, but they do constrain how confidently later chapters can
      underwrite scale, governance depth, and valuation discipline.
    claimRefs: [CO005, CO012, CO015]
