figures:
  - id: FM001
    title: Evidence-constrained market narrowing
    type: pyramid
    summary: >-
      Because the assigned pool lacks independent TAM studies, this pyramid
      narrows Kriya's opportunity from broad chronic-disease exposure to its
      disclosed clinical wedges instead of assigning unsupported dollar values.
    data:
      items:
        - label: Broad chronic-disease burden
          displayValue: Millions of patients
          note: Official materials frame the top layer qualitatively, not with a market-size figure.
          claimRefs:
            - CM001
        - label: Widespread-disease gene-therapy opportunity
          displayValue: Very large, untapped
          note: Investor framing supports breadth but still does not publish a TAM.
          claimRefs:
            - CM006
        - label: Current therapeutic beachheads
          displayValue: 3 disclosed domains
          note: Ophthalmology, metabolic disease, and neurology dominate the public portfolio description.
          claimRefs:
            - CM003
        - label: Publicly disclosed program breadth
          displayValue: 9 assets / 5 clinical-stage medicines
          note: Public corpus shows breadth, but asset-level revenue potential remains undisclosed.
          claimRefs:
            - CM005
        - label: Near-term lead wedge
          displayValue: KRIYA-825 Phase 1/2
          note: Geographic atrophy has the clearest substitute narrative and the most concrete disclosed development signal.
          claimRefs:
            - CM012
            - CM015
        - label: Commercialization gate
          displayValue: RTP facility + FDA PreCheck
          note: Manufacturing and regulatory readiness are part of the market thesis, not merely back-office execution.
          claimRefs:
            - CM010
            - CM011
    approximationNotes: >-
      Layers mix qualitative descriptors and count-based proxies because the
      assigned evidence pool did not provide a comparable TAM/SAM/SOM dataset or
      a source-backed market CAGR for Kriya's target segments.
