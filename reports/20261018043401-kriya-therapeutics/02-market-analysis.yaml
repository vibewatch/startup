company:
  name: Kriya Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kriya's market case is not a generic "gene therapy is large" claim; it is a
    narrower thesis that one-time AAV medicines can move from rare-disease use
    into common chronic conditions if focal delivery and in-house manufacturing
    make economics and supply more practical. The public evidence supports that
    strategic direction and shows ophthalmology as the clearest disclosed
    commercial wedge, but it does not provide a clean TAM/SAM/SOM stack or a
    named buyer-budget map by segment.
sections:
  - id: boundary-and-beachheads
    title: Boundary and therapeutic beachheads
    body: |-
      The available sources define Kriya's market boundary around durable,
      one-time AAV medicines for common or highly prevalent chronic diseases,
      not the earlier rare-disease-only template that has historically dominated
      commercial gene therapy. Kriya's own medicines page says the company was
      built to treat chronic diseases affecting millions of patients, and both
      Foresite Capital and PatSnap frame the company around broader chronic or
      widespread disease categories rather than niche monogenic disorders.

      That boundary matters because Kriya's disclosed program mix is spread
      across ophthalmology, metabolic disease, and neurology. VentureRadar's
      program list and Kriya's medicines page together show a portfolio that
      includes geographic atrophy, thyroid eye disease, type 1 diabetes, MASH,
      and trigeminal neuralgia, with additional undisclosed programs behind
      those visible assets. In market terms, Kriya is not trying to win one
      single orphan indication; it is attempting to prove a repeatable product
      and manufacturing model across several specialist-managed chronic disease
      categories.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
  - id: sizing-without-a-clean-tam
    title: Sizing signals exist, but the public TAM remains under-specified
    body: |-
      The strongest public market signal is breadth and investor appetite, not a
      rigorously disclosed revenue pool. Kriya and its backers repeatedly use
      qualitative language such as "common diseases," "millions of patients,"
      and a "very large and heretofore untapped opportunity." Pharmaceutical
      Technology also reports that the September 2025 Series D was
      oversubscribed at $320 million, while The BioTech Strategist treats the
      financing as one of the larger private biotech rounds of 2025. Those are
      useful capital-market indicators that sophisticated investors believe a
      large commercial prize may exist.

      What the assigned evidence still does not provide is the hard market math
      that would turn that thesis into a defensible TAM, SAM, or SOM. None of
      the retained sources isolate the addressable spend for Kriya's target
      disease categories, disclose adoption-rate assumptions, or give a market
      CAGR that can be tied back to Kriya's specific delivery model. The figure
      below therefore narrows the opportunity qualitatively from broad chronic
      disease burden to Kriya's disclosed beachheads instead of assigning
      unsupported dollar layers.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: adoption-path-and-constraints
    title: Adoption depends on commercialization readiness, not science alone
    body: |-
      The adoption thesis rests on whether Kriya can make chronic-disease gene
      therapy manufacturable and operationally repeatable. NCBiotech quotes the
      company describing the field as constrained by manufacturing technology,
      vector design capability, and cost, while Kriya's own materials emphasize
      an integrated product and manufacturing engine built to make durable
      medicines more scalable. Pharmaceutical Technology ties the 2025 round
      directly to advancing trials and strengthening the company's manufacturing
      engine, and PackGene's 2026 FDA PreCheck coverage links commercialization
      readiness to the new Research Triangle Park facility.

      Public evidence also shows where the commercial wedge is most concrete.
      KRIYA-825 is already framed as a one-time suprachoroidal therapy for
      geographic atrophy intended to reduce the burden of frequent intravitreal
      injections required by current therapies, which gives Kriya a clearer
      substitute narrative than it has yet disclosed in metabolic disease or
      neurology. Even so, the medicines remain investigational and the public
      source set still does not identify named buyers, payers, or budget owners
      for each segment, so market timing remains more management thesis than
      verified procurement evidence.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
    tableRefs:
      - TM003
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer evidence
      - Relevance
    rows:
      - - Ophthalmology gene therapy
        - One-time focal AAV medicines for geographic atrophy and thyroid eye disease
        - Legacy small molecules, biologics, and diagnostics outside durable gene therapy
        - Public sources identify delivery setting, but not named payer or budget owner
        - Clearest disclosed clinical wedge and multiple named programs
      - - Metabolic disease gene therapy
        - Durable AAV medicines for type 1 diabetes and MASH-related disease biology
        - Broader diabetes drugs, devices, and obesity services not framed as durable gene therapy
        - Commercial counterparty not publicly specified in retained sources
        - Expands Kriya beyond eye disease into larger chronic-care categories
      - - Neurology gene therapy
        - Targeted gene therapy for trigeminal neuralgia and other undisclosed neurology assets
        - General pain management and neurology care pathways outside one-time gene therapy
        - No explicit reimbursement channel or budget owner disclosed
        - Shows portfolio intent beyond one organ system
      - - Enabling manufacturing / CMC layer
        - Vector engineering, process development, analytical testing, and GMP capacity that support product economics
        - Generic third-party manufacturing capacity not tied to Kriya's own platform
        - Not a payer market on its own; it is an adoption gate for the therapeutic layers above
        - Management and investors treat scale manufacturing as part of the market thesis
    notes: >-
      Boundary rows separate the therapy categories Kriya is explicitly pursuing
      from adjacent spend that the public sources do not claim to capture.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM009
      - CM010
