      - ["Relieve refractory trigeminal neuralgia", "Chronic medication or invasive procedures", "Localized chemogenetic gene therapy for adjustable neuronal control", "Public thesis is durable local effect with control via clinically approved small molecules", "No public clinical-stage readout or service model for device/drug coordination in the pool"]
