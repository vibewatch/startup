company:
  name: "Kriya Therapeutics"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Kriya's product thesis is a one-time AAV medicine platform aimed at chronic diseases with large patient populations, anchored by five investigational programs across ophthalmology, metabolic disease, and neurology. The public evidence points to a manufacturing-first operating model with in-house vector, process, analytical, and GMP capabilities, but it still leaves major gaps on human efficacy outside KRIYA-825, commercial support workflows, and public trust/security disclosure."
sections:
  - id: "pipeline-and-use-cases"
    title: "Pipeline breadth is real, but public maturity detail is uneven"
    body: |-
      Kriya positions the product in workflow terms as a one-time durable medicine: deliver DNA once, turn target cells into an ongoing source of therapeutic protein, and replace chronic administration with a single intervention where biology and delivery cooperate. The official medicines page says the company has five investigational medicines in a clinical-stage pipeline and explicitly frames them as designed for chronic diseases affecting millions rather than rare orphan indications. Third-party profiles and listings align on the same three therapeutic corridors—ophthalmology, metabolic disease, and neurology—and add named assets for geographic atrophy, thyroid eye disease, type 1 diabetes, steatotic liver disease, and trigeminal neuralgia.

      The strongest public maturity proof in the assigned pool is KRIYA-825 in geographic atrophy. MedPath reports that KRIYA-825 had already entered a Phase 1/2 study in 2025 and describes a concrete product design: an AAV therapy expressing a CR2-CR1 fusion protein intended to inhibit complement C3 and C5 after a one-time suprachoroidal delivery. For the rest of the portfolio, public evidence is more thesis-level than execution-level: Kriya and profile sites describe delivery concepts and intended benefits, but they do not provide the same level of stage-by-stage disclosure, deployment detail, or human-readout support. That means the breadth is credible, but maturity is not equally evidenced across all five lead programs.
    claimRefs: ["CE001", "CE002", "CE006", "CE007", "CE009", "CE010", "CE011", "CE012", "CE014"]
    tableRefs: ["TE001", "TE002"]
  - id: "integrated-engine-and-manufacturing"
    title: "The technical differentiation is vertical integration plus manufacturing readiness"
    body: |-
      Public technical evidence is much stronger on Kriya's operating model than on application-layer customer deployment. MTEC describes an integrated product engine spanning vector engineering, preclinical and clinical development, analytical sciences, and GMP manufacturing, while the official medicines page says Kriya is trying to collapse the cost and scale barriers that kept durable medicines out of common diseases. PackGene extends that picture with more specific operating detail: Kriya combines AAV vector engineering, process development, analytical testing, and GMP capabilities, and layers on automation, digital technologies, and data-driven optimization to improve quality, scalability, and efficiency.

      The manufacturing stack is not only rhetorical. PackGene says Kriya was selected for the FDA's PreCheck Pilot Program for a new commercial facility in Research Triangle Park, and SetterVC also flags the selection as a regulatory/manufacturing-readiness signal ahead of commercialization. PackGene further says Kriya's HOPSON structured data system contains more than 80 million internal datapoints, which supports the idea that Kriya's moat is process learning and scale-up discipline as much as asset novelty. That operating model is the clearest product-technology differentiation visible in the assigned pool, and it is also the part of the story with the most concrete readiness markers.
    claimRefs: ["CE001", "CE003", "CE004", "CE005", "CE013", "CE014", "CE015"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "risk-controls-and-open-questions"
    title: "Quality and regulatory signals exist, but public proof is still thin on clinical durability and support"
    body: |-
      Kriya does have public quality-control signals: the medicines page stresses that the portfolio remains investigational, MedPath repeats that KRIYA-825 is not approved and that clinical safety and efficacy remain unestablished, and PackGene/SetterVC point to manufacturing-readiness engagement with FDA. Those are better signals than generic biotech marketing, but they do not yet amount to comprehensive public proof on reliability, pharmacovigilance workflow, reimbursement support, deployment services, or commercial-scale post-dose monitoring.

      The biggest product-technical underwriting gap is therefore not whether Kriya has an ambitious architecture; it clearly does. The gap is whether that architecture produces repeatable human efficacy, safe durability, and supportable commercialization across multiple prevalent indications. The assigned pool also lacks a public developer/practitioner signal equivalent—no open repositories, public SDK/docs surface, status page, security center, or independent practitioner forum evidence appeared here—so diligence still needs direct management evidence on operational controls, quality systems, and program-by-program readiness before the platform can be underwritten as more than a well-specified product engine.
    claimRefs: ["CE007", "CE008", "CE013", "CE014"]
