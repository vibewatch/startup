      - "Limitation"
    rows:
      - ["Slow retinal degeneration in geographic atrophy", "Repeated physician-administered intravitreal therapy for elderly patients", "One-time suprachoroidal KRIYA-825 delivery expressing CR2-CR1 in ocular tissues", "Public rationale is eliminating frequent injections while maintaining complement inhibition", "Human efficacy and durability are not yet publicly established in the assigned pool"]
      - ["Manage TED inflammation without systemic exposure", "Systemic or repeated therapy with side-effect tradeoffs", "Local ocular gene delivery encoding anti-IGF1R activity", "Publicly framed benefit is localized treatment with improved safety/efficacy intent", "Assigned pool does not show phase, dosing cadence, or human outcome evidence"]
      - ["Reduce insulin burden in type 1 diabetes", "Lifelong insulin management and monitoring", "Intramuscular AAV therapy expressing insulin and glucokinase", "Publicly framed benefit is durable glycemic control and reduced exogenous-insulin need", "No public human readout, payer workflow, or manufacturing cost-per-dose evidence in the pool"]
