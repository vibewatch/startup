      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              Talos 由 Anton Katz 和 Ethan Feldman 共同创立，两人分别继续担任 CEO 和 CTO。Katz 拥有 MIT 计算机科学学位，曾任 AQR
              交易技术负责人，在机构交易技术上具备直接的创始人—市场匹配；Feldman 在 Cornell 学习计算机科学，来自高性能交易软件公司 Broadway
              Technology。一个交易技术负责人搭配一个低延迟系统工程师，支撑了公司「专为机构打造基础设施」的叙事。


              更广泛的领导团队覆盖了全球基础设施供应商需要的关键职能：Samar Sen 负责 APAC，这也是公司增长最快的区域；Josh Peschko 负责合规，应对 MiCA 和 DORA 重塑欧洲监管要求；Drew
              Forman 负责战略与四笔收购的整合；Eliad Hoch 负责量化执行，是 Talos 对外营销执行成本节省的引擎。主要治理风险在于 Anton Katz 的关键人物集中度：他锚定战略、融资和外部叙事，包括
              2026 年延展轮。截至 2026 年，公开来源未发现重大诉讼、执法行动或破坏性领导层流失，但具体任期、股权持有和董事会构成未披露，需在尽调中追问。本领导层名单截至 2026 年运行日期有效，但并非完整公开名单。
