      - number: '1.5'
        title: 里程碑、并购与负面核查
        blocks:
          - type: paragraph
            body: >
              Talos 的里程碑时间线显示，它一边持续募集机构资本，一边靠收购叠加产品范围。自 2018 年创立、2021 年平台发布以来，公司完成四笔收购——D3X Systems（2023 年
              Q1，投资组合工程）、Cloudwall（2024 年 4 月，风险技术）、Skolem（2024 年 5 月，DeFi 基础设施）和 Coin Metrics（2025 年 7 月，数据与分析，报道交易额约
              $100 million）。每笔收购都沿着清晰轴线扩展平台：投资组合构建、风险、去中心化金融接入，最后是经常性数据订阅收入线，分散 SaaS 加用量收入基础。2026 年 1 月 Series B 延展轮则从
              Robinhood、Sony、IMC 和 QCP 引入战略资本，补强资产负债表。


              负面核查方面，公开记录相对干净：截至 2026 年未发现重大诉讼或执法行动；Talos
              作为纯技术供应商（不是经纪交易商或托管方）的身份，也让它相对主经纪商减少了直接监管暴露。真正的风险更偏结构性而非法律风险——加密市场周期性、来自 FalconX 等主经纪商的竞争（FalconX 报告累计交易量
              $2.5 trillion，但采用不同的主经纪模式）、四笔收购的整合风险、对 Anton Katz
              的关键人物依赖，以及数字资产监管的不确定性。这些风险在专门的风险章节追踪；在本章，它们是对原本强劲的身份和资本故事的限定。
