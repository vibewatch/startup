chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >
              Talos Global, Inc. 总部位于纽约，由 Anton Katz 和 Ethan Feldman 于 2018 年 12
              月创立，目标是为数字资产交易搭建机构级基础设施。公司提供端到端平台，覆盖订单与执行管理（OEMS）、投资组合管理（PMS）、询价（RFQ）平台、白标交易，以及——在 2025 年收购 Coin Metrics
              之后——数据、区块链分析和指数。关键在于，Talos 把自己定位为纯技术和 SaaS 供应商，而非经纪交易商、托管方或自营交易方：它卖的是机构接入流动性的轨道，不是流动性本身。


              这种定位决定了商业模式。Talos 收取 SaaS 订阅费和用量费，向 neobanks 和金融科技公司出售白标技术（CEO Anton Katz 称该部分约占业务一半），并通过 Coin Metrics
              叠加经常性数据订阅。公司称差异化来自为机构量身打造、API 优先的基础设施，而非改造传统金融技术。截至 2026 年，Talos 在纽约（总部）、伦敦、塞浦路斯和新加坡运营，客户覆盖 32 个国家，APAC
              贡献约三分之一全球收入。这个身份——供应商，而非交易对手——是后续所有章节反复使用的底层事实。
