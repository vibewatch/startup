              Ventures、Fidelity、Galaxy Digital、Elefund、Illuminate Financial 和 STEADFAST。2022 年 5 月 Series B 由 General
              Atlantic 领投，估值 $1.25 billion，融资 $105 million，并吸引一组罕见的大型银行参与——Citi、BNY Mellon 和 Wells Fargo——同时
              a16z、Fidelity 和 PayPal Ventures 等老股东继续跟投。


              2026 年 1 月，Talos 将 Series B 延展 $45 million，使该轮总额达到 $150 million，投后估值约 $1.5 billion。新投资人包括 Robinhood
              Markets、Sony Innovation Fund、IMC、QCP 和 Karatage，a16z crypto、BNY Mellon 和 Fidelity 回投。相较 2022 年估值温和上调约
              20%（且穿越了加密市场回撤），传递出耐久的机构信念，而非投机动能。2026 年 1 月延展轮也服务资产负债表目的：Talos 于 2025 年 7 月为 Coin Metrics 收购投入约 $100
              million，$45 million 延展轮部分补充现金储备，同时加入战略协同投资人。The Block、CoinDesk、Cointelegraph 和 Coinspeaker
              报道的估值与融资数字大体一致，未发现重大矛盾。具体优先权结构、董事会构成和持股比例仍为私有信息。
