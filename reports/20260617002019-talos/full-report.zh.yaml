      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              机构加密基础设施买方可分为五类，每类都有不同预算归属、采用周期，以及对 Talos 这类供应商的收入模式。Tier-1 银行（Citi、BNY Mellon、Wells Fargo——均为 Talos
              投资人）预算最大，但销售周期最长（6-12 个月），受合规要求和企业采购驱动。预算通常归数字资产负责人或 COO。Neobanks 和金融科技公司（Nubank
              Cripto、BVNK、Coinhako）采用速度最快——CEO Anton Katz 指出，Talos 约一半业务是白标技术，部署周期为 3-6 周。对冲基金和自营交易公司通过 API
              集成在数周内采用，看重执行算法和多场所接入。经纪商和交易商需要在 2-4 个月内上线合规订单路由。资产管理人则与现有投资组合系统集成（BlackRock Aladdin 集成就是这一路径的例子）。


              地域上，APAC 横跨 12 个国家，约占 Talos 收入三分之一；Talos 的 APAC 负责人 Samar Sen 指出，该地区监管清晰度正在推动采用速度快于其他地区。Coalition
              Greenwich 2022 年 12 月调查发现，92% 的大众富裕和高净值投资者向财务顾问询问数字资产敞口，进而带来 FA 和财富平台基础设施的下游需求。分层图显示，Talos
              的白标打法给了它最快放量路径（neobanks），而企业能力让它有机会拿下最高价值合同（银行、资产管理人）。
