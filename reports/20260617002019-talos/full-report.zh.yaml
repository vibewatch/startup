  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >
              Talos 的收入来自多层模型：经常性 SaaS 订阅、与交易量挂钩的用量费、白标技术许可，以及——自 2025 年 7 月收购 Coin Metrics 以来——数据订阅。平台订阅提供对整合 OEMS、PMS
              和 RFQ 系统的访问；用量费随执行层处理的交易量和订单数扩张；白标许可让 neobanks 和金融科技公司不用从零搭建，就能提供自有品牌的机构级交易服务。CEO Anton Katz 于 2025 年 7
              月表示，约一半业务来自面向 neobanks 和金融科技公司的白标技术，使其成为实质且差异化的收入渠道。


              Coin Metrics 收购增加了第四条收入流：向机构客户出售区块链分析、指数和参考利率的经常性数据订阅。这让 Talos 从纯执行基础设施收入扩展到
              data-as-a-service，潜在毛利更高、流失更低。收入增长驱动包括新增机构客户、地域扩张（APAC 约占收入三分之一）、通过平台模块追加销售，以及传统金融机构进入数字资产后扩大可寻址市场。Talos
              2026 Quant Execution Insights Report 分析了 250,000+ 个父订单，显示 VWAP 算法相对朴素扫单执行可节省约 38
              个基点成本——这个量化价值主张支撑了溢价定价。美国财政部加密资产框架提供监管顺风，支撑机构参与，进而拉动基础设施需求。
