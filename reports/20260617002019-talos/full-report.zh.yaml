  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、ICP 与地域分布
        blocks:
          - type: paragraph
            body: >
              Talos 服务机构数字资产生态里的五类主要客户：银行和
              neobank（白标技术）、对冲基金、经纪商、交易所和资产管理机构。理想客户是受监管或达到机构级标准的组织，需要多场所执行、组合管理或白标加密交易能力——它们比零售交易所更复杂，但又不愿在内部自建专有
              OEMS。CEO Anton Katz 表示，Talos 约一半收入来自面向 neobank 和金融科技公司的白标技术，因此该分部按收入看占主导。


              从地域看，Talos 客户覆盖 32 个国家，APAC 贡献全球收入约三分之一。APAC 覆盖 12 个国家，并设有专职区域负责人 Samar Sen；具名 APAC 客户包括
              Coinhako（新加坡）、OSL（香港）和 Caleb & Brown（澳大利亚）。美洲客户包括 Nubank Cripto（巴西）、Netcoins（加拿大）、Firinne Capital 和 EDX
              Markets（美国）；EMEA 包括 BCB Group、BVNK、Archax 和 Enigma Securities。地域多元化降低了单一市场监管风险，但也带来跨司法辖区运营复杂度。分部地图显示，银行 /
              neobank 主导收入，而对冲基金和交易所贡献最高执行量——这种收入与交易量错配值得在尽调中跟踪。
