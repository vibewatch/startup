      - number: '7.4'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >
              对 CEO Anton Katz 的关键人物依赖，是最突出的人员风险。Katz 联合创立 Talos，此前在 AQR 负责交易技术，并亲自锚定战略、融资（包括 2026 年 1 月 $45M
              延展轮）和外部叙事。公开信息中没有继任计划。虽然 CTO Ethan Feldman 提供技术领导连续性，团队纵深还包括 Samar Sen（APAC）、Josh Peschko（合规）、Drew
              Forman（SVP Strategy/M&A）和 Eliad Hoch（量化执行），但投资者和市场沟通仍集中在一个人身上。


              不到三年完成四笔收购，进一步放大执行风险。每笔交易都带来团队、技术和产品，必须在不扰乱现有运营、不流失被收购关键人才的前提下完成集成。Coin Metrics 交易规模最大，约
              $100M，因此尤其敏感，因为数据和分析代表新的战略方向。如果被收购团队流失，或技术栈证明不兼容，收购假设就会失效。扩张到 32
              个国家带来额外执行负荷：本地合规、招聘和市场适配都需要管理层带宽，并与收购集成争夺注意力。在竞争激烈的加密招聘市场中留住人才（对手包括 FalconX 等资金充足、拥有 350+ 员工的公司）也持续施压。
