      - number: '2.2'
        title: 市场规模：多重视角与不可消除的不确定性
        blocks:
          - type: paragraph
            body: >
              机构数字资产基础设施没有单一可信的市场规模估计。市场仍处早期，供应商收入私有，基础设施与相邻服务之间的边界也有渗透。因此，我们采用三种视角，并明确保留不确定性，而不是选择一个数字。


              自上而下视角从 2025 年约 $3 trillion 的加密市场市值出发，假设其中 0.5-1.5% 用于基础设施，得到 $15-45 billion 的总可寻址市场——方向上有用，但高度近似。自下而上视角估计
              500-2000 个机构买家，每年平台支出 $200K-$2M，得出 $100 million 至 $4 billion 的可服务可寻址市场区间。TradFi OEMS 类比则指出，Bloomberg
              EMSX、Fidessa 和 FlexTrade 合计年收入 $5-10 billion；加密类比市场规模只是其中一部分，但随着机构资金流加速，增长更快。


              即便 TAM 不确定，需求代理指标也提供了支撑。2025 年稳定币供应达到约 $300 billion，可作为链上机构活动的代理。2025 年 7 月，Bitcoin ETF 在 30 天内净流入 $5.6
              billion，BlackRock IBIT 每年产生约 $187 million 费用——ETF 基础设施成本的每一个基点都代表可寻址支出。Nasdaq 与 Talos 宣布合作，瞄准 $35 billion
              以上的代币化抵押品管理机会，这是相邻增长向量。Grayscale 2026 Digital Asset Outlook
              预计，机构配置将推动加密市场从青春期走向成熟。这些代理指标汇聚成一个方向性结论：基础设施需求在结构性增长，即便精确 TAM 无法锁定。BIS Working Paper 1147
              也印证了机构参与已经增长，但仍受基础设施缺口制约。
