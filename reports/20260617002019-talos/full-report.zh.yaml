  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Talos 所面对的机构数字资产基础设施市场，涵盖金融机构为交易、管理和接入数字资产而购买的软件和平台支出。纳入的支出类别包括订单与执行管理系统（带智能订单路由和算法执行的
              OEMS）、投资组合管理系统（带风险分析和对账的 PMS）、询价平台、面向 neobanks
              和金融科技公司的白标交易技术，以及数据和分析服务。该边界明确排除托管硬件、交易所撮合引擎，以及自营交易损益——这些活动与主经纪和做市有重叠，但不是核心基础设施软件。


              相邻市场包括主经纪服务（FalconX、Coinbase Prime）、机构托管（Fireblocks、Copper）和市场数据终端（Bloomberg）。Talos
              替代的现状方案暴露了市场的不成熟：许多机构仍靠内部自建，把直接交易所 API、电子表格式投资组合跟踪，或事后改造的传统金融 OEMS 平台拼在一起处理加密资产。Talos
              自身研究将这一格局描述为高度碎片化，多数公司运行多个点状方案。自建还是外采，是市场的核心动态——机构必须在 12-18
              个月定制开发和数周即可上线的现成方案之间权衡。这种碎片化既验证了市场机会，也解释了为什么供应商整合仍处早期。FalconX（累计交易量 $2.5T+）和 Coinbase Prime
              等竞争者采用不同模式——垂直整合的主经纪，而非横向基础设施 SaaS——因此部分重叠，但不能完全替代。
