      - number: '4.3'
        title: 融资历史与资本状况
        blocks:
          - type: paragraph
            body: >
              Talos 已在四轮融资中搭建出结构良好的资本栈，累计约 $195 million。旅程始于 2020 年未披露金额的种子轮，背后是加密原生基金（Castle Island Ventures、Notation
