  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              机构加密基础设施的监管格局正在多个司法辖区同步演进，这既给 Talos 带来合规负担，也带来战略机会。在欧盟，MiCA 于 2024 年 12 月 30 日生效，对加密资产服务提供商施加牌照、ESG
              披露和消费者保护要求。DORA 进一步要求欧盟金融机构维持稳健的 ICT 风险管理，可能把 Talos 归类为关键 ICT 第三方提供商，并受直接监管监督。在美国，SEC 继续聚焦数字资产服务提供商的网络安全，而
              GENIUS Act（2025）建立稳定币监管框架，影响 Talos 客户。在亚太，香港 SFC 发布 ASPIRe 路线图，扩大虚拟资产平台牌照范围。


              关键在于，Talos 是纯技术 / SaaS 供应商——不是 broker-dealer、托管方或自营交易商。这一定位显著降低了直接监管敞口：Talos 不持有客户资产，不承担交易对手风险，也不需要
              FalconX 或 Coinbase Prime 等主经纪商所需的同类牌照。不过，间接敞口仍然显著。客户越来越要求技术供应商证明合规能力（SOC2、DORA 韧性、MiCA-ready
              集成），供应商准入审查也在加强。Talos 服务条款建立了合同责任限制和 SLA 框架，划清平台与客户之间的责任。Talos 通过定期监管综述（已识别第 11、14、19 期以及 2025-07-31）和
              Bitvavo MiCA-ready 流动性扩展等主动合作集成，展现出监管意识。BIS 关于系统性风险的研究，以及美国财政部加密资产行政令，也进一步预示未来审慎要求可能覆盖基础设施提供商。截至 2026 年 6
              月，未发现针对 Talos 的诉讼、执法行动或监管制裁。
