        - 美国执法行动瞄准加密基础设施 SaaS 提供商
        - 存在生存级监管风险（纯技术供应商出现该情景的概率较低）
        - SEC/CFTC 执法追踪
    notes: 受损触发项意味着投资论点遭到实质打击，需要重新评估；终止触发项意味着可能走向全损情景。阈值由分析师根据可比公司经验和市场动态设定。
