      - number: '4.4'
        title: 财务尽调缺口与矛盾
        blocks:
          - type: paragraph
            body: >
              作为私营公司，Talos 没有公开披露完整承销所需的财务细节。最关键缺口是毛利率、净收入留存、烧钱率，以及经审计的 2025-2026 年收入——这些是私营公司的标准限制，而非刻意回避。没有利润率数据，就无法确认
              Talos 是否达到机构 SaaS 基础设施常见的 70-85% 毛利率；没有 NRR，扩张与流失动态仍不透明；没有烧钱率数据，即便 2026 年 1 月注入资本，也无法评估 Coin Metrics 之后的
              runway。


              矛盾方面：围绕 Series B 延展轮的六个独立来源（The Block、CoinDesk、Cointelegraph、Coinspeaker、PR Newswire 和 Talos
              自身公告）未发现重大差异。$27.2M 的 2023 年收入和约 $45.5M 的 2025 年中运行率出现在多篇第三方报道中，未见冲突数字。不过，约 50% 的白标收入占比来自一条 CEO
              表述，尚未独立验证。竞争者基准——FalconX 报告累计交易量 $2.5 trillion——说明的是不同变现哲学（基于交易流 vs SaaS），并不意味着 Talos
              变现不足；但这个比较会引出一个反向问题：纯 SaaS 能否捕获足够多流经其管道的价值。尽调应在 NDA 下索取经审计收入、利润率和留存数据，以补齐这些缺口。
