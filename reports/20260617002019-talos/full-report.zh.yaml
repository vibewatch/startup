      - number: '1.4'
        title: 规模指标与披露缺口
        blocks:
          - type: paragraph
            body: >
              Talos 的公开规模证据不完整，但在改善。第三方报道显示，2023 年收入为 $27.2 million，到 2025 年中年化约 $45.5
              million，意味着营收大致每年翻倍——对一家受益于机构采用加密资产的基础设施供应商来说，这条轨迹可信。地域上，Talos 称客户覆盖 32 个国家，APAC
              约占收入三分之一，并设有区域负责人。从产品经济性看，CEO Anton Katz 将约一半收入描述为面向 neobanks 和金融科技公司的白标技术，其余来自直接交易客户，以及占比越来越高的 Coin
              Metrics 数据订阅。


              披露缺口同样必须标明。Talos 尚未公布 2026 年员工数、毛利率、净收入留存或按产品线拆分的详细收入结构；除约 $100 million 的 Coin Metrics
              交易外，其他收购交易金额未披露。估值和累计融资数字来自媒体报道，而非审计。Hedgeweek Global Digital Assets Awards 2025 将 Talos 评为 Best
              Quantitative Trading Technology
              Provider，佐证了其行业地位。承销时，应把已验证事实（轮次、投资人、奖项）、公司口径指标（国家数、白标收入占比）和真正缺失的私有数据（利润率、员工数、留存）分开处理；每一类都对应具体尽调路径。
