      - number: '8.2'
        title: 正向假设与反向假设
        blocks:
          - type: paragraph
            body: >
              多头假设建立在五根相互强化的支柱上：（1）Talos 是品类领先的中立基础设施提供商，在机构规模上没有纯赛道同业；（2）机构加密采用顺风正在加速，包括 BTC ETF（30 天流入 $5.6B）、稳定币供给超过
              $300 billion、MiCA 监管清晰化和 GENIUS Act；（3）收入约每年翻倍，并向可预测 SaaS 倾斜（白标约占收入
              50%）；（4）投资者财团同时包含传统金融验证（Citi、BNY、Fidelity、Wells Fargo）和加密原生信念资本（a16z、QCP）；（5）M&A 策略正通过 Coin Metrics
              数据能力和三笔执行技术收购，构建差异化平台护城河。


              空头反向假设逐一挑战这些支柱：约 33x 收入倍数是上市 SaaS 公司中位数的 2-3x，并假设收入持续超过 50% 增长，而历史上很少有公司能穿越加密周期维持这一速度；主经纪商正在垂直整合（Ripple 以
              $1.25B 收购 Hidden Road），可能捆绑免费执行技术，把 Talos 的 SaaS 模式商品化；Coin Metrics 集成风险在约 $100M 集中度下十分实质；公司对 CEO Anton
              Katz（前 AQR Head of Trading Tech，MIT
              CS）的关键人物依赖较高，且未披露继任计划；任何持续市场下行都可能放慢机构加密采用。空头情景说明，即便观点是谨慎正面，风险回报仍要求里程碑门控式资本部署。
