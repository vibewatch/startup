      - number: '8.6'
        title: 图表证据
        blocks:
          - type: callout
            title: 谨慎正面，并采用里程碑门控式部署
            body: $1.5B 估值由品类领导力、机构顺风和约 2x 收入增长支撑——但约 33x 倍数要求在完全承诺前，尽调确认 ARR 质量和留存。建议做法：把分批资本与经审计财务里程碑绑定。
            calloutType: recommendation
            claimRefs:
              - CV028
              - CV001
              - CV005
          - type: callout
            title: 约 33x 收入倍数要求持续执行
            body: 按约 33x 年化收入计算，Talos 的定价假设其能持续 >50% 增长。若连续两个季度增速低于 30%，很可能触发倍数向 15-20x 压缩，意味着相对 $1.5B 标记存在潜在降价融资风险。
            calloutType: risk
            claimRefs:
              - CV005
              - CV014
              - CV034
          - type: callout
            title: 蓝筹投资者财团验证定位
            body: 传统金融在位者（Citi、BNY Mellon、Wells Fargo、Fidelity）与加密原生信念资本（a16z、QCP、IMC）跨多轮共同参与，释放出强烈的跨生态验证信号，也提高后续支持的可能性。
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV009
          - type: callout
            title: 空头情景意味着资本亏损——需要下行保护
            body: 在空头假设（加密下行 + 倍数压缩）下，隐含估值 $0.8-1.1B，代表 30-50% 资本亏损。应采用里程碑门控式部署，并谈判下行保护（清算优先权、反稀释）。
            calloutType: insight
            claimRefs:
              - CV024
              - CV015
          - type: callout
            title: 收入数字未经审计
            body: 所有收入数据（2023 年 $27.2M、2025 年中约 $45.5M）均由 CEO 表述或媒体报道，缺少独立审计验证。约 33x 隐含倍数的计算完全依赖这些数字准确。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
