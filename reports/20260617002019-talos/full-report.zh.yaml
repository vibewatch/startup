        - 约 $100M 收购存在减值风险；战略受挫
        - 整合里程碑跟踪
      - - CEO Anton Katz 离职
        - 终止
        - 无接班计划的意外离职
        - 关键人风险落地；投资人信心受损
        - 董事会 / 治理监测
      - - 主经纪商捆绑销售
