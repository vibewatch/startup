  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              2026 年的机构数字资产基础设施市场竞争格局复杂，难以简单归类。Talos 占据一个独特位置：纯 OEMS/PMS/SaaS
              技术供应商——它出售执行和投资组合管理轨道，但不与客户对手盘交易、不托管客户资产，也不提供融资。这种中立性是它区别于竞争阵营的核心轴线；后者包括主经纪商（FalconX、Coinbase
              Prime、Ripple/Hidden Road）、托管专家（Fireblocks、Copper.co）、OTC 做市商（B2C2）、综合金融服务公司（Galaxy Digital）和机构交易场所（LMAX
              Exchange）。


              竞争格局涵盖七类对手：直接同业（未识别到完全同业——Talos 是唯一已规模化的纯机构加密 OEMS）、既有巨头（BlackRock Aladdin、Bloomberg OEMS 作为 TradFi
              可比对象）、相邻玩家（Fireblocks、Copper.co 向执行延伸）、替代方案（提供捆绑执行的主经纪商）、现状方案（大型银行内部自建）、潜在进入者（收购 Hidden Road 后的
              Ripple；向加密延伸的 TradFi 供应商），以及同时扮演多重角色的伙伴型竞争者。亦敌亦友的动态普遍存在：FalconX、Fireblocks、Coinbase 和 Deribit 都接入 Talos
              provider network，同时维护自己的机构产品。这既带来分销优势，也带来渠道冲突风险。
