      - number: '1.3'
        title: 融资历史、估值与投资人
        blocks:
          - type: paragraph
            body: >
              Talos 已经拼出一条结构良好的资本路径。2020 年未披露金额种子轮之后（Castle Island Ventures、Notation Capital、Autonomous
              Partners、Initialized Capital），公司于 2021 年 5 月完成 $40 million Series A，由 a16z crypto 领投，PayPal
              Ventures、Fidelity 和 Galaxy Digital 参投。2022 年 5 月，公司完成 $105 million Series B，由 General Atlantic 领投，估值 $1.25
              billion——这一轮把 Citi、BNY Mellon 和 Wells Fargo 拉进股东名单；对一家加密基础设施供应商来说，如此密集的大型银行背书并不常见。2026 年 1 月，Talos 将
              Series B 延展 $45 million（总额达到 $150 million），投后估值约 $1.5 billion，新增 Robinhood Markets、Sony Innovation
              Fund、IMC、QCP 和 Karatage，并有 a16z crypto、BNY、Fidelity 等老股东继续参与。


              汇总已披露轮次，累计融资约 $195 million。2026 年估值较 2022 年仅温和上调（约 20%），尤其值得注意：这发生在期间加密市场回撤之后，说明机构需求更像是耐久需求，而不是泡沫。The
              Block、CoinDesk、Cointelegraph 和 Coinspeaker 对估值与累计融资的报道基本一致，未发现重大冲突。具体持股比例、清算优先权和董事会席位仍属私密，是股权结构尽调的主要问题。
