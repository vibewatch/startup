    data:
      nodes:
        - id: crypto-winter
          label: 加密市场下行
          detail: 交易量下降，压低交易费收入
        - id: reg-change
          label: 监管收紧
          detail: 合规成本新增；客户不确定性上升
        - id: client-churn
          label: 客户流失
          detail: 机构暂停使用或离开平台
        - id: revenue-decline
          label: 收入下降
          detail: 收入收缩；增长逻辑承压
        - id: talent-loss
          label: 人才流失
          detail: 工程师和管理者转投竞争对手
        - id: integration-fail
          label: 并购整合失败
          detail: Coin Metrics 或其他收购资产表现不及预期
        - id: platform-degrade
          label: 平台退化
          detail: 维护的集成减少；质量下滑
        - id: valuation-hit
          label: 估值受损
          detail: 下一轮下调或持平；投资者信心受挫
      edges:
        - from: crypto-winter
          to: client-churn
          label: 交易活跃度下降
        - from: crypto-winter
          to: revenue-decline
          label: 随交易量波动的费用下滑
        - from: reg-change
          to: client-churn
          label: 合规不确定性
        - from: client-churn
          to: revenue-decline
          label: 订阅流失
        - from: revenue-decline
          to: talent-loss
          label: 薪酬压力；士气
        - from: talent-loss
          to: platform-degrade
          label: 维护集成的工程师减少
        - from: integration-fail
          to: platform-degrade
          label: 技术债累积
        - from: platform-degrade
          to: valuation-hit
          label: 竞争位置削弱
        - from: revenue-decline
          to: valuation-hit
          label: 增长逻辑受损
    approximationNotes: 传导路径根据标准 SaaS 业务规律和加密行业特定风险因素推断。实际连锁发生概率取决于触发事件的强度和持续时间。
    claimRefs:
      - CR017
      - CR018
      - CR014
      - CR026
      - CR036
      - CR038
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 梳理 Talos 平台对外部基础设施、交易场所、数据提供商和云服务的依赖。
    data:
      nodes:
        - id: exchanges
          label: 交易所（50+）
          detail: Coinbase、Binance、Deribit、EDX、Bybit 等
        - id: custodians
          label: 托管方
          detail: Fireblocks、Copper.co 集成
        - id: lps
          label: 流动性提供商
          detail: IMC、FalconX、B2C2、做市商
        - id: cloud
          label: 云基础设施
          detail: AWS/GCP 多区域部署
        - id: coin-metrics
          label: Coin Metrics（已拥有）
          detail: 数据源、指数、分析
        - id: talos-platform
          label: Talos 平台
          detail: OEMS/PMS/RFQ 核心
        - id: clients
          label: 机构客户
          detail: 覆盖 32 个国家的银行、新型银行、基金
        - id: regulators
          label: 监管机构
          detail: SEC、MiCA/ESMA、SFC、CFTC 等监管框架
      edges:
        - from: exchanges
          to: talos-platform
          label: 交易场所 API / 市场数据
        - from: custodians
          to: talos-platform
          label: 清算 / 托管接入
        - from: lps
          to: talos-platform
          label: 流动性供给
        - from: cloud
          to: talos-platform
          label: 计算 / 存储 / 网络
        - from: coin-metrics
          to: talos-platform
          label: 数据 / 分析 / 指数
        - from: talos-platform
          to: clients
          label: OEMS/PMS/RFQ 服务
        - from: regulators
          to: talos-platform
          label: 合规要求
        - from: regulators
          to: clients
          label: 牌照 / 报告义务
    approximationNotes: 依赖图展示逻辑依赖；实际基础设施拓扑属于非公开信息。节点标签把多个实体（例如 50+ 家交易所）归并为单一依赖类别。
    claimRefs:
      - CR013
      - CR021
      - CR029
      - CR038
      - CR039
      - CR019
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从证据输入、投资逻辑评估到投资建议的决策流。
    data:
      nodes:
        - id: n1
          label: 市场位置
          detail: 品类领先的中立 OEMS/PMS
        - id: n2
          label: 收入轨迹
          detail: 年经常性收入（ARR）约 $45.5M，年增长约 2x
        - id: n3
          label: 投资者联盟
          detail: 蓝筹 TradFi + 加密原生
        - id: n4
          label: 乐观逻辑
          detail: 顺风、合作伙伴、护城河
        - id: n5
          label: 悲观逻辑
          detail: 约 33x 倍数、周期性、关键人物
        - id: n6
          label: 风险评估
          detail: 按里程碑分阶段部署，压低下行
        - id: n7
          label: 建议
          detail: 谨慎正面 / 有条件
      edges:
        - from: n1
          to: n4
          label: 支撑
        - from: n2
          to: n4
          label: 支撑
        - from: n3
          to: n4
          label: 验证
        - from: n4
          to: n6
          label: 权衡
        - from: n5
          to: n6
          label: 权衡
        - from: n6
          to: n7
          label: 得出
    approximationNotes: 流程图呈现分析师推理过程；权重是基于可获得公开证据的定性判断，并非量化模型输出。
    claimRefs:
      - CV028
      - CV013
      - CV014
      - CV030
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以约 $45.5M 年化收入为基准，展示不同收入倍数假设下的隐含估值敏感性。
    data:
      items:
        - label: 15x 倍数
          value: 0.68
        - label: 20x 倍数
          value: 0.91
        - label: 25x 倍数
          value: 1.14
        - label: 30x 倍数
          value: 1.37
        - label: 33x 倍数（当前）
          value: 1.5
        - label: 40x 倍数
          value: 1.82
        - label: 45x 倍数
          value: 2.05
    approximationNotes: 数值单位为 $B。隐含估值按倍数 × $45.5M 年化收入计算。当前标记约为 33x。敏感性未计入估值日期到预测期之间的收入增长。
    claimRefs:
      - CV034
      - CV005
      - CV025
  - id: FV003
    title: 估值回报区间
    type: range
    layout: compact
    summary: 基于 2027 年收入预测，推导乐观、基准、悲观情景下的隐含退出估值区间（单位 $B）。
    data:
      items:
        - label: 乐观情景（$B）
          low: 3.2
          mid: 3.6
          high: 4.1
        - label: 基准情景（$B）
          low: 1.7
          mid: 1.85
          high: 2
        - label: 悲观情景（$B）
          low: 0.8
          mid: 0.95
          high: 1.1
    approximationNotes: 情景估值推导使用 2027 年预测收入 × 适用倍数区间。该区间不是 DCF 模型；仅用于尽调框架的示意。低 / 中 / 高反映每个情景内的倍数区间。
    claimRefs:
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 截至 2026 年 1 月估值标记时，Talos 的关键投资指标。
    data:
      items:
        - label: 投后估值
          value: $1.5B
          detail: 2026 年 1 月 Series B 延展轮
        - label: 累计融资
          value: ~$195M
          detail: 种子轮 + Series A + Series B + 延展轮
        - label: 年化收入
          value: ~$45.5M
          detail: 2025 年中运行率；较 2023 年约 2x
        - label: 隐含收入倍数
          value: ~33x
          detail: $1.5B / $45.5M；高于 SaaS 中位数
        - label: 提供商网络
          value: 100+
          detail: 跨交易场所和交易所的集成
        - label: 收购
          value: '4'
          detail: D3X、Cloudwall、Skolem、Coin Metrics 等收购资产
    approximationNotes: KPI 数值来自公开披露。收入数字是 CEO 称述的年化运行率，未经审计。隐含倍数由分析师计算。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV030
      - CV040
