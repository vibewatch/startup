  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与模块架构
        blocks:
          - type: paragraph
            body: >
              Talos 平台由六大产品模块构成，共同交付端到端机构数字资产基础设施。核心 OEMS 提供订单与执行管理，Smart Order Routing 以算法方式把订单分发到 50+ 已连接交易所。执行算法包括
              VWAP、TWAP、Iceberg 和多腿策略，设计目标是降低市场冲击——Talos 称其 VWAP 算法相对朴素扫单可节省约 38 个基点，该数字来自 2026 Quant Execution Insights
              Report 对 250,000+ 个父订单的分析。


              RFQ 平台通过同时向多个流动性提供方询价，实现双边价格发现。白标技术让金融科技公司和 neobanks 无需从零搭建，就能嵌入机构级交易——据 CEO Anton Katz 表述，该渠道约占 Talos
              业务一半。Portfolio Construction（PMS）提供风险分析、优化、回测和再平衡。通过 Uniswap、1inch 和收购的 Skolem 基础设施，DeFi
              接入把覆盖范围延伸到去中心化协议。最后，由 Coin Metrics（2025 年 7 月以约 $100M 收购）驱动的 Data Intelligence
              提供市场数据、区块链分析、网络指标和加密指数。资产类别覆盖 FX、现货、期货、永续合约和期权（通过 Deribit 合作）。
