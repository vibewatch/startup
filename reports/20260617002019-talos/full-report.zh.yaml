      - number: '8.4'
        title: 可比估值基准
        blocks:
          - type: paragraph
            body: >
              Talos 的直接估值可比有限，因为公开报道的机构加密基础设施估值很少。现有最相关基准包括：Ripple 于 2025 年 4 月以 $1.25 billion 收购 Hidden
              Road，验证机构加密主经纪基础设施可以获得十亿美元级估值——不过 Hidden Road 作为自营主体运营，日交易量超过 $14B，而 Talos 是轻资产 SaaS 模式。FalconX（私营，融资
              $400M+，累计交易量 $2.5T+）估值未披露，本应是最接近的可比，但这一数据缺口阻碍了直接分析。


              Fireblocks 在 2022 年融资轮估值约 $8 billion（聚焦托管 / MPC），但该标记已经过时，可能无法反映 2022-2023 加密回撤后的当前市场状况。Galaxy Digital
              作为多元金融服务公司上市交易，市值约 $4B+，可提供一个宽泛的跨行业基准。


              对 Talos 约 $45.5 million ARR 上隐含约 33x 收入倍数的评估如下：对于年增长超过 50%、TAM 扩张的垂直 SaaS，公开市场先例（未计加密折价前）收入倍数区间为
              20-50x。品类领导力和机构顺风定位可以解释溢价，但需要持续执行才能维持。缺少相似阶段和商业模式的公开可比公司，是一个实质性估值缺口；尽调应通过 LP 访谈和二级市场数据点来补足。
