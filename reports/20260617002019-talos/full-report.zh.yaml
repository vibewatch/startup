            body: >
              FalconX 是最常被提及的竞争对手，但商业模式根本不同：它是主经纪商，报告累计交易量 $2.5 trillion、员工 350+、办公室 7 个。FalconX 不出售中立基础设施，而是作为客户交易的
              principal，通过价差赚钱，而不是 SaaS 费用。关键是，FalconX 还在 2024 年扩大了与 Talos 的集成以提供 FX 流动性，成为 Talos provider network
              上的流动性供应方。这种亦敌亦友的动态说明结构性差异：Talos 聚合，FalconX 提供。


              Coinbase Prime 背靠美国最大交易所（公开市值 $50B+），提供全套机构主经纪服务，包括执行、托管和融资。它与 Talos 的竞争重叠真实存在，但边界清楚——Coinbase Prime 既是
              Talos 网络上的一个场所，也是机构工作流平台竞争者。Fireblocks（2022 年估值 $8B，累计融资 $550M+）专注 MPC 托管和安全，只在双方与 Uniswap Labs 合作的 DeFi
              接入上与 Talos 交叉。Galaxy Digital 是多线金融集团，覆盖交易、借贷、挖矿和顾问业务——范围广，但执行技术专业化程度较低。LMAX Exchange 运营机构 FX
              和加密订单簿，聚焦执行质量。


              竞争集合的定价大多不透明。Talos 使用 SaaS 订阅加单笔交易用量费；主经纪商把定价嵌入执行价差；托管商按 AUC 基点收费。只有 LMAX 公布透明的 maker-taker
              费率表。这种不透明让直接价格比较变得困难，也构成尽调的实质证据缺口。
