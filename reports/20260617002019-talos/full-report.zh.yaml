      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              七个可识别驱动因素正在扩大机构数字资产基础设施市场。监管方面，MiCA 于 2024 年 12 月 30 日生效，建立统一的欧盟框架，迫使机构采用合规基础设施，而非临时拼装方案。GENIUS Act 于 2025
              年建立美国稳定币框架，DORA 则对欧盟金融实体施加运营韧性标准——两者都推高供应商支出。市场需求方面，稳定币供应达到 $300 billion，BTC ETF 单月流入 $5.6
              billion，指向结构性机构上车。代币化抵押品机会（Nasdaq 口径 $35B+）打开相邻增长向量，Coalition Greenwich 的 92% HNW 需求数字则确认终端投资者拉力。


              与这些驱动因素相对的是五个实质约束。监管不确定性——尽管已有 MiCA 和 GENIUS——在许多司法辖区仍然存在，尤其是美国非稳定币资产领域，拖慢机构决策。切换成本并不低：已经自建系统的机构面临 6-18
              个月迁移周期，形成自建还是外采的惯性。信任与安全要求（SOC 2 合规、渗透测试、多区域故障切换）拉长采购周期。加密市场周期性会在熊市压缩基础设施预算，尽管 SaaS
              订阅模式能提供一定缓冲。最后，资本强度——构建合规多场所基础设施成本高——限制了新竞争者，但也意味着现有供应商必须持续投入，形成利润率压力。净评估是，2025-2026 年监管和 ETF
              资金流提供结构性顺风，驱动因素强于约束，但周期性仍是主导的近期风险。
