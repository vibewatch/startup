      - number: '8.5'
        title: 破局 / 否决触发器与最终尽调事项
        blocks:
          - type: paragraph
            body: >
              七项投资假设破裂与否决触发器定义了风险监控框架。否决触发器（生存性风险）包括 Coin Metrics 集成失败，以及 CEO
              意外离任且没有继任计划——任一事件都可能造成实质性价值毁损。破裂触发器（损害投资假设并需要重新评估）包括收入增速降至 30% 以下、失去前 5 大客户之一、主经纪商捆绑免费 OEMS、加密市场持续下行（BTC
              跌幅 >60% 且持续 >6 个月），以及针对加密基础设施 SaaS 提供商的不利监管行动。


              最终尽调事项按其对确认或否定投资假设的影响排序。资本承诺前必须满足三项关键要求：（1）经审计 ARR，并附季度队列留存，证明净收入留存高于 120%，确认约 $45.5M
              运行收入的质量；（2）毛利率与净利率拆分，确认约 33x 倍数下的 SaaS 单位经济；（3）股权结构表与清算优先权栈，确定新投资者的实际经济权益。高优先级事项包括 Coin Metrics 集成路线图与里程碑
              KPI、过去十二个月竞争赢单 / 输单数据，以及关键人物继任规划文件。


              最大估值缺口仍是缺少经审计财务数据：所有收入数字都来自 CEO 表述或媒体报道，没有独立验证。在 ARR、留存和利润率确认前，约 33x
              倍数无法被充分验证。里程碑门控式部署建议正是为应对这一缺口——把资本分批与信息里程碑绑定，可以降低下行敞口，同时保留选择权。
