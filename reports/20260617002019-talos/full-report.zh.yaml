        blocks:
          - type: paragraph
            body: >
              第三方报道显示，Talos 2023 年收入为 $27.2 million，到 2025 年中年化约 $45.5 million，意味着营收大致按年翻倍。从 $27.2M 到约 $45.5M 历时约 18
              个月，对应约 67% 增长；考虑复利后，与年化翻倍节奏一致。这条轨迹让 Talos 处于企业基础设施增长率上游，尤其值得注意的是，增长发生在 2023-2024 年加密市场修正期间。


              若将翻倍趋势向前外推，2026 年年化收入区间估计为 $70-100 million，基准情形中点约 $85 million。该预测存在实质不确定性：它假设翻倍节奏延续，Coin Metrics
              数据收入是增量而非蚕食既有收入，且没有重大客户流失。最近公开数据点是第三方媒体（Cointelegraph、The Block）在 2026 年 1 月 Series B 延展轮报道中提到的 2025
              年中年化运行率。公开渠道没有经审计的 2025 全年或 2026 年收入数字。收入增长论点通过 2026 年约 $1.5 billion 估值得到间接佐证；按约 17-20x trailing
              revenue（2025 年中运行率）计算，该估值与高增长 SaaS 倍数一致。即使在加密寒冬，Talos 仍表示机构对其基础设施的需求没有冻结，暗示收入具备一定周期韧性。
