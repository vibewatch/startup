      - number: '6.3'
        title: 留存、扩张、满意度与集中度风险
        blocks:
          - type: paragraph
            body: >
              Talos 的留存信号偏正面，但大多是间接证据。公司在 2022 年加密寒冬期间称需求没有冻结，暗示客户在下行周期没有流失。没有具名客户公开表示离开
              Talos。收入约每年翻倍也进一步指向强劲净留存——如果客户大规模流失，收入增长会停滞。Hedgeweek 2025 奖项（最佳量化交易技术提供商）提供了独立行业机构对客户和同业满意度的信号，不过它不是直接的
              NPS 或客户调查指标。


              案例研究里能看到扩张模式：BCB Group 在初始部署后六个月内交易量增长至 23x；BVNK 通过平台新增 5 个流动性提供方；Firinne Capital 的使用从执行延伸到组合管理和对账。这些表明
              Talos 账户会沿交易量、连接性和产品轴扩张，呈现健康的先落地再扩张动态。


              主要集中度风险有三类。第一，依赖白标 neobank：约一半收入依赖该分部，而该分部本身又受加密采用曲线和零售交易监管清晰度影响。第二，加密周期性：Talos
              大多数客户是数字资产原生公司，熊市中交易量会收缩，间接压低 Talos 使用费。第三，竞争替代：FalconX 报告累计交易量 $2.5 trillion，并争夺同一个机构钱包，尽管其主经纪商模式不同于
              Talos 的中立 SaaS 定位。总客户基数未披露——公开名称只有 18 个——因此如果不在 NDA 下索取前 10 大客户收入占比，就无法评估真实收入集中度。
