      - number: '8.3'
        title: 情景分析与价值驱动因素
        blocks:
          - type: paragraph
            body: >
              从 $1.5 billion 进入点出发，三个情景框定估值区间。多头情景假设收入继续约 2x 年增，到 2027 年达到约 $90 million，由机构顺风加速（ETF、稳定币、代币化抵押品）、Coin
              Metrics 集成成功释放交叉销售协同，以及 TradFi 锚定合作伙伴转化为实质收入（BlackRock Aladdin、Nasdaq）驱动。按反映品类领导力的 35-45x 收入倍数计算，退出估值为
              $3.2-4.1 billion，MOIC 为 2.1-2.7x。


              基准情景假设增速放缓至约每年 50%（仍显著高于 SaaS 中位数），2027 年收入约 $68 million。合作伙伴有贡献但节奏更慢；Coin Metrics 集成推进且没有重大问题；加密市场保持建设性。按
              25-30x 倍数计算，估值为 $1.7-2.0 billion（MOIC 1.1-1.3x）——资本小幅增值并守住投入价值。


              空头情景假设加密周期性下行使增速放慢至约 20%（2027 年约 $55 million），同时投资者降低加密基础设施敞口风险，倍数压缩至 15-20x。prime-broker
              捆绑落地并造成定价压力。该情景对应 $0.8-1.1 billion 估值（MOIC 0.5-0.7x）——资本亏损。按 25/50/25 概率加权，预期价值约 $1.9 billion，支持在当前 $1.5
              billion 标记下采取谨慎正面立场。


              各情景中的关键价值驱动因素包括：收入增长可持续性（影响最大）、Coin Metrics 集成执行、加密市场周期状况、传统金融合作伙伴变现速度，以及主经纪商垂直整合带来的竞争动态。
