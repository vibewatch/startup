        title: Revenue Scale and Growth Trajectory
        blocks:
          - type: paragraph
            body: >
              Third-party reporting places Talos revenue at $27.2 million in 2023 and approximately $45.5 million
              annualized by mid-2025, implying the top line is roughly doubling annually. This growth rate from $27.2M
              to ~$45.5M over roughly 18 months corresponds to approximately 67% growth, consistent with a doubling
              cadence on an annualized basis when accounting for compounding. The trajectory positions Talos in the
              upper tier of enterprise infrastructure growth rates, particularly notable given that this growth occurred
              through the 2023-2024 crypto market corrections.


              Projecting the doubling trend forward yields an estimated 2026 annualized revenue range of $70-100
              million, with a base-case mid-point around $85 million. This projection carries material uncertainty: it
              assumes the doubling cadence continues, that Coin Metrics data revenue adds incrementally rather than
              cannibalizing existing streams, and that no major client churn occurs. The most recent public datapoint is
              the mid-2025 annualized run-rate reported by third-party press (Cointelegraph, The Block) in the context
              of the January 2026 Series B extension coverage. No audited 2025 full-year or 2026 revenue figure is
              publicly available. The revenue growth thesis is corroborated indirectly by the ~$1.5 billion 2026
              valuation, which at roughly 17-20x trailing revenue (mid-2025 run-rate) is consistent with high-growth
              SaaS multiples. Even during the crypto winter, Talos maintained that institutional demand for its
              infrastructure had not frozen, suggesting some degree of revenue resilience through cycles.
