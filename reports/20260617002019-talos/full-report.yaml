        blocks:
          - type: paragraph
            body: >
              Talos was co-founded by Anton Katz and Ethan Feldman, who remain CEO and CTO respectively. Katz brings a
              computer-science degree from MIT and prior experience as Head of Trading Technology at AQR, giving direct
              founder-market fit in institutional trading technology; Feldman studied computer science at Cornell and
              came from Broadway Technology, a high-performance trading-software firm. The pairing of a
              trading-technology leader and a low-latency systems engineer underpins the company's claim to
              purpose-built infrastructure.


              The broader leadership bench covers the functions a global infrastructure vendor needs: Samar Sen leads
              APAC, the company's fastest-growing region; Josh Peschko owns compliance as MiCA and DORA reshape European
              requirements; Drew Forman runs strategy and M&A integration across four acquisitions; and Eliad Hoch leads
              quant execution, the engine behind the execution-cost savings Talos markets. The principal governance risk
              is key-person concentration on Anton Katz, who anchors strategy, fundraising, and the external narrative —
              including the 2026 extension. No major lawsuits, enforcement actions, or disruptive leadership churn were
              identified in public sources through 2026, but exact tenures, equity holdings, and board composition are
              undisclosed and flagged for diligence. The leadership roster is current as of the 2026 run date but is not
              exhaustively published.
