  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              The institutional digital asset infrastructure market addressed by Talos encompasses software and platform
              spend by financial institutions to trade, manage, and access digital assets. The included spend categories
              are order and execution management systems (OEMS with smart order routing and algorithmic execution),
              portfolio management systems (PMS with risk analytics and reconciliation), request-for-quote platforms,
              white-label trading technology for neobanks and fintechs, and data and analytics services. This boundary
              explicitly excludes custody hardware, exchange matching engines, and principal trading profit and loss —
              activities that overlap with prime brokerage and market making but are not core infrastructure software.


              Adjacent markets include prime brokerage services (FalconX, Coinbase Prime), institutional custody
              (Fireblocks, Copper), and market data terminals (Bloomberg). The status-quo substitutes that Talos
              displaces reveal the market's immaturity: many institutions still rely on in-house builds stitching
              together direct exchange APIs, spreadsheet-based portfolio tracking, or traditional-finance OEMS platforms
              adapted post-hoc for crypto assets. Talos's own research characterizes the landscape as deeply fragmented,
              with most firms running multiple point solutions. The build-versus-buy decision is the central market
              dynamic — institutions must weigh 12-18 months of custom development against turnkey deployment in weeks.
              This fragmentation simultaneously validates the market opportunity and explains why vendor consolidation
              is still early. Competitors like FalconX ($2.5T+ lifetime volume) and Coinbase Prime operate different
              models — vertically integrated prime brokerage rather than horizontal infrastructure SaaS — which means
              they partially overlap but do not fully substitute.
