        title: Product Surface and Module Architecture
        blocks:
          - type: paragraph
            body: >
              The Talos platform is organized into six major product modules that collectively deliver end-to-end
              institutional digital asset infrastructure. The core OEMS provides order and execution management with
              Smart Order Routing that algorithmically distributes orders across 50+ connected exchanges. Execution
              algorithms include VWAP, TWAP, Iceberg, and multi-leg strategies designed to minimize market impact —
              Talos claims its VWAP algo delivers approximately 38 basis points savings versus a naive sweep approach, a
              figure derived from analysis of 250,000+ parent orders in the 2026 Quant Execution Insights Report.


              The RFQ platform enables bilateral price discovery by soliciting competitive quotes from multiple
              liquidity providers simultaneously. White-label technology allows fintechs and neobanks to embed
              institutional-grade trading without building from scratch — this channel represents roughly half of
              Talos's business according to CEO Anton Katz. Portfolio Construction (PMS) delivers risk analytics,
              optimization, backtesting, and rebalancing. DeFi access through Uniswap, 1inch, and acquired Skolem
              infrastructure extends reach into decentralized protocols. Finally, Data Intelligence powered by Coin
              Metrics (acquired July 2025 for ~$100M) provides market data, blockchain analytics, network metrics, and
              crypto indexes. Asset class coverage spans FX, spot, futures, perpetuals, and options (via Deribit
              partnership).
