  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Structure
        blocks:
          - type: paragraph
            body: >
              The institutional digital asset infrastructure market in 2026 features a complex competitive landscape
              that defies simple categorization. Talos occupies a distinctive niche as a pure OEMS/PMS/SaaS technology
              vendor — it sells the execution and portfolio management rails but does not trade against its own clients,
              custody their assets, or provide financing. This neutrality is the defining axis of differentiation
              against a competitive field that includes prime brokers (FalconX, Coinbase Prime, Ripple/Hidden Road),
              custody specialists (Fireblocks, Copper.co), OTC market makers (B2C2), integrated financial-services firms
              (Galaxy Digital), and institutional venues (LMAX Exchange).


              The landscape encompasses seven competitor categories: direct peers (no exact peer identified — Talos is
              the only scaled pure-play institutional crypto OEMS), incumbents (BlackRock Aladdin, Bloomberg OEMS as
              TradFi comparables), adjacents (Fireblocks, Copper.co moving toward execution), substitutes (prime brokers
              offering bundled execution), the status quo (internal build at large banks), likely entrants (Ripple
              post-Hidden Road; TradFi vendors extending to crypto), and partner-competitors who occupy multiple roles
              simultaneously. The frenemy dynamic is pervasive: FalconX, Fireblocks, Coinbase, and Deribit all integrate
              with the Talos provider network while maintaining their own institutional offerings. This creates both
              distribution advantage and channel-conflict risk.
