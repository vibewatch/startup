      - number: '6.3'
        title: Retention, Expansion, Satisfaction, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Retention signals for Talos are positive but largely indirect. The company stated during the 2022 crypto
              winter that demand had not frozen, implying clients did not churn during the downturn. No named client has
              publicly reported leaving Talos. Revenue approximately doubling annually further suggests strong net
              retention — if clients were churning at scale, top-line growth would stall. The Hedgeweek 2025 award (Best
              Quantitative Trading Technology Provider) provides an independent industry-body signal of client and peer
              satisfaction, though it is not a direct NPS or customer survey metric.


              Expansion patterns are visible in the case studies: BCB Group grew from initial deployment to 23x volume
              within six months, BVNK added 5 new liquidity providers through the platform, and Firinne Capital deepened
              its use from execution into portfolio management and reconciliation. These suggest that Talos accounts
              expand along volume, connectivity, and product axes — a healthy land-and-expand dynamic.


              The primary concentration risks are threefold. First, white-label neobank reliance: roughly half of
              revenue depends on a segment that is itself tied to crypto adoption curves and regulatory clarity for
              retail trading. Second, crypto cyclicality: most Talos clients are digital-asset-native firms whose
              volumes compress in bear markets, indirectly reducing Talos usage fees. Third, competitive displacement:
              FalconX reports $2.5 trillion in lifetime volume and competes for the same institutional wallet, though
              its prime-broker model differs from Talos's neutral SaaS positioning. The total client base size is
              undisclosed — only 18 names are public — making true revenue concentration impossible to assess without
