              - CV005
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Cautious-Positive with Milestone-Gated Deployment
            body: >-
              The $1.5B valuation is supported by category leadership, institutional tailwinds, and ~2x revenue growth —
              but the ~33x multiple demands diligence confirmation of ARR quality and retention before full commitment.
              Recommended approach: tie capital tranches to audited financial milestones.
            calloutType: recommendation
            claimRefs:
              - CV028
              - CV001
              - CV005
          - type: callout
            title: ~33x Revenue Multiple Demands Sustained Execution
            body: >-
              At ~33x annualized revenue, Talos is priced for sustained >50% growth. Any deceleration below 30% for two
              consecutive quarters would likely trigger multiple compression toward 15-20x, implying potential
              down-round risk from the $1.5B mark.
            calloutType: risk
            claimRefs:
              - CV005
              - CV014
              - CV034
          - type: callout
            title: Blue-Chip Investor Syndicate Validates Positioning
            body: >-
              The combination of TradFi incumbents (Citi, BNY Mellon, Wells Fargo, Fidelity) and crypto-native
              conviction capital (a16z, QCP, IMC) across multiple rounds provides strong signal of cross-ecosystem
              validation and potential follow-on support.
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV009
          - type: callout
            title: Bear Scenario Implies Capital Loss — Downside Protection Warranted
            body: >-
              Under bear assumptions (crypto downturn + multiple compression), implied valuation of $0.8-1.1B represents
              30-50% capital loss. Milestone-gated deployment and negotiated downside protections (liquidation
              preferences, anti-dilution) are warranted.
            calloutType: insight
            claimRefs:
              - CV024
              - CV015
          - type: callout
            title: Revenue Figures Unaudited
            body: >-
              All revenue data ($27.2M 2023, ~$45.5M mid-2025) is CEO-stated or press-reported without independent audit
              verification. The ~33x implied multiple calculation depends entirely on the accuracy of these figures.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
