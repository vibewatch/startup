      - number: '3.2'
        title: Competitor Profiles and Capability Comparison
        blocks:
          - type: paragraph
            body: >
              FalconX stands as the most frequently cited competitor, but operates a fundamentally different model: it
              is a prime broker reporting $2.5 trillion in lifetime trading volume, 350+ employees, and 7 offices.
              Rather than selling neutral infrastructure, FalconX acts as a principal to its clients' trades — earning
              on spread rather than SaaS fees. Critically, FalconX also expanded its integration with Talos in 2024 to
              provide FX liquidity, making it a liquidity supplier on the Talos provider network. This frenemy dynamic
              illustrates the structural difference: Talos aggregates; FalconX provides.


              Coinbase Prime, backed by the largest US exchange (public market cap $50B+), offers full-service
              institutional prime brokerage including execution, custody, and financing. Its competitive overlap with
              Talos is real but bounded — Coinbase Prime is both a venue on the Talos network and a rival platform for
              institutional workflow. Fireblocks ($8B valuation in 2022, $550M+ raised) focuses on MPC-based custody and
