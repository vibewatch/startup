  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              The regulatory landscape for institutional crypto infrastructure is evolving simultaneously across
              multiple jurisdictions, creating both compliance burden and strategic opportunity for Talos. In the EU,
              MiCA became effective December 30, 2024, imposing licensing, ESG disclosure, and consumer-protection
              requirements on crypto-asset service providers. DORA further requires EU financial institutions to
              maintain robust ICT risk management, potentially classifying Talos as a critical ICT third-party provider
              subject to direct supervisory oversight. In the United States, the SEC maintains cybersecurity focus on
              digital asset service providers, while the GENIUS Act (2025) establishes stablecoin regulation affecting
              Talos clients. In Asia-Pacific, Hong Kong's SFC published its ASPIRe roadmap with expanded licensing for
              virtual asset platforms.


              Critically, Talos operates as a pure technology/SaaS vendor — it is not a broker-dealer, custodian, or
              principal trader. This positioning materially reduces direct regulatory exposure: Talos does not hold
              client assets, does not take counterparty risk, and does not require the same licenses as prime brokers
              like FalconX or Coinbase Prime. However, indirect exposure remains significant. Clients increasingly
              require their technology vendors to demonstrate compliance capabilities (SOC2, DORA resilience, MiCA-ready
              integrations), and vendor qualification scrutiny is rising. The Talos Terms of Service establish
              contractual liability limitations and SLA frameworks that delineate responsibility between platform and
              client. Talos demonstrates regulatory awareness through regular roundup publications (issues 11, 14, 19,
              2025-07-31 identified) and proactive partner integrations such as the Bitvavo MiCA-ready liquidity
              expansion. BIS research on systemic risk and the US Treasury crypto asset executive order further signal
              future prudential requirements that may reach infrastructure providers. No lawsuits, enforcement actions,
              or regulatory sanctions against Talos were identified through June 2026.
