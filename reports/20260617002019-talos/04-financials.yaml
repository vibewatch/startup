- id: financial-gaps-diligence
  title: Financial Diligence Gaps and Contradictions
  body: |
    As a private company, Talos does not publicly disclose the financial detail required for full underwriting. The most critical gaps are gross margin, net revenue retention, burn rate, and audited 2025-2026 revenue — all standard private-company limitations rather than evasions. Without margin data, it is impossible to confirm whether Talos matches the 70-85% gross margin typical of institutional SaaS infrastructure; without NRR, expansion-versus-churn dynamics remain opaque; and without burn-rate data, post-Coin Metrics runway cannot be assessed despite the January 2026 capital injection.

    On contradictions: no material discrepancies were identified across the six independent sources reporting on the Series B extension (The Block, CoinDesk, Cointelegraph, Coinspeaker, PR Newswire, and Talos's own announcement). The $27.2M 2023 revenue and ~$45.5M mid-2025 run-rate appear in multiple third-party reports without conflicting figures. However, the white-label ~50% mix is sourced from a single CEO statement and has not been independently verified. The competitor benchmark — FalconX reporting $2.5 trillion in lifetime trading volume — illustrates the different monetization philosophy (flow-based versus SaaS) rather than suggesting Talos is under-monetizing, but the comparison invites the adverse question of whether pure SaaS can capture sufficient share of the value flowing through its pipes. Diligence should request audited revenue, margin, and retention data under NDA to close these gaps.
