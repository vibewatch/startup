callouts:
- calloutType: strength
  title: Revenue Roughly Doubling Annually Through Crypto Cycles
  body: Talos grew from $27.2M (2023) to ~$45.5M annualized (mid-2025), maintaining roughly doubling growth through the 2023-2024 crypto market corrections. This cycle-resilient trajectory suggests structural institutional demand rather than speculative adoption.
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI025
- calloutType: risk
  title: Critical Financial Metrics Remain Undisclosed
  body: Gross margin, NRR, burn rate, and audited 2025-2026 revenue are all unavailable. Without these, the ~$1.5B valuation cannot be independently underwritten. Diligence must close these gaps before any capital commitment.
  claimRefs:
  - CI012
  - CI032
- calloutType: insight
  title: Coin Metrics Adds Data Revenue but Raises Integration Cost Questions
  body: The ~$100M Coin Metrics acquisition adds a recurring data-subscription revenue line that diversifies beyond pure execution SaaS. However, the acquisition deployed most of the 2022 Series B proceeds, and integration costs remain undisclosed — the January 2026 extension partially addresses the resulting cash need.
  claimRefs:
  - CI007
  - CI020
  - CI026
- calloutType: assumption
  title: Revenue Doubling Trend Projected Forward Without Audited Confirmation
  body: The $70-100M 2026 revenue range assumes the doubling trend continues and Coin Metrics revenue adds incrementally. This is analyst inference, not company guidance. Actual results may differ materially if growth decelerates or integration challenges arise.
  claimRefs:
  - CI006
  - CI031
