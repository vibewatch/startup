- id: funding-capital-history
  title: Funding History and Capital Position
  body: |
    Talos has assembled a well-structured capital stack over four rounds totaling approximately $195 million. The journey began with an undisclosed 2020 seed round backed by crypto-native funds (Castle Island Ventures, Notation Capital, Autonomous Partners, Initialized Capital). In May 2021, a16z crypto led a $40 million Series A that brought PayPal Ventures, Fidelity, Galaxy Digital, Elefund, Illuminate Financial, and STEADFAST onto the cap table. The May 2022 Series B, led by General Atlantic at a $1.25 billion valuation, raised $105 million and attracted a rare cluster of major-bank participation — Citi, BNY Mellon, and Wells Fargo — alongside returning backers a16z, Fidelity, and PayPal Ventures.

    In January 2026, Talos extended the Series B by $45 million to a total of $150 million at a post-money valuation of approximately $1.5 billion. New investors included Robinhood Markets, Sony Innovation Fund, IMC, QCP, and Karatage, with returning participation from a16z crypto, BNY Mellon, and Fidelity. The modest ~20% valuation step-up from the 2022 mark (achieved through crypto drawdowns) signals durable institutional conviction rather than speculative momentum. The January 2026 extension also serves a balance-sheet purpose: Talos deployed roughly $100 million for the Coin Metrics acquisition in July 2025, and the $45 million extension partially replenishes cash reserves while adding strategically aligned investors. Reported valuation and funding figures are broadly consistent across The Block, CoinDesk, Cointelegraph, and Coinspeaker with no material contradictions identified. Exact preference stack, board composition, and ownership percentages remain private.
