  title: Financials
  summary: Talos generates revenue through SaaS subscriptions, usage fees, white-label licensing (~50% per CEO), and Coin Metrics data subscriptions. Revenue grew from $27.2M (2023) to ~$45.5M annualized (mid-2025), roughly doubling annually. Total capital raised is ~$195M across a seed, $40M Series A (a16z), $105M Series B (General Atlantic, $1.25B), and $45M Series B extension (Jan 2026, ~$1.5B). Critical gaps include undisclosed margin, NRR, burn rate, and audited 2025-2026 revenue — standard for a private company but essential for underwriting the valuation.
sections:
- id: revenue-model
  title: Revenue Model and Streams
  body: |
    Talos generates revenue through a multi-layered model combining recurring SaaS subscriptions, volume-linked usage fees, white-label technology licensing, and — since the July 2025 Coin Metrics acquisition — data subscriptions. The platform subscription provides access to the integrated OEMS, PMS, and RFQ system; usage fees scale with trade volume and order count processed through the execution layer; and white-label licensing allows neobanks and fintechs to offer own-brand institutional-grade trading powered by Talos infrastructure. CEO Anton Katz stated in July 2025 that roughly half of the business is white-label technology for neobanks and fintechs, making this a material and differentiated revenue channel.

    The Coin Metrics acquisition added a fourth stream: recurring data subscriptions for blockchain analytics, indexes, and reference rates sold to institutional clients. This diversifies Talos beyond pure execution-infrastructure revenue into data-as-a-service, a model with potentially higher gross margins and lower churn. Revenue growth drivers include new institutional client acquisition, geographic expansion (APAC is roughly one-third of revenue), upsell through platform modules, and the growing addressable market as traditional financial institutions enter digital assets. The Talos 2026 Quant Execution Insights Report, analyzing 250,000+ parent orders, demonstrates that the VWAP algorithm delivers approximately 38 basis points of cost savings versus naive sweep execution — a quantified value proposition that supports premium pricing. The U.S. Treasury framework for crypto-assets provides regulatory tailwinds supporting institutional participation, which in turn drives infrastructure demand.
