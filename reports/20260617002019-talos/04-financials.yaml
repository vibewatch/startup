  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Talos has not disclosed gross margin, NRR, CAC, LTV, burn rate, or revenue per employee — all standard private-company gaps but critical for underwriting the ~$1.5B valuation.
    whyItMatters: Without margin and retention data, capital efficiency and revenue durability cannot be independently assessed.
    diligencePath: Request audited management accounts, cohort retention data, and monthly cash flow under NDA during diligence.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI011
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: audited revenue
    missingEvidence: No audited 2025 full-year or 2026 revenue figure is publicly available; the most recent datapoint is a mid-2025 annualized run-rate from third-party press.
    whyItMatters: The revenue doubling thesis and 2026 projections cannot be verified without audited figures.
    diligencePath: Request audited 2025 revenue and 2026 year-to-date actuals from management.
