chapter:
  number: 1
  title: Company Overview
  summary: Talos Global is a New York-founded (2018) institutional digital asset infrastructure vendor — OEMS, PMS, RFQ, white-label, and data via Coin Metrics — that reached a ~$1.5B valuation in a January 2026 Series B extension backed by Robinhood, Sony, IMC, and returning a16z, BNY, and Fidelity. It has raised ~$195M, shows revenue roughly doubling annually ($27.2M in 2023 to ~$45.5M annualized by mid-2025), serves 32 countries, and carries key-person dependence on CEO Anton Katz with limited public disclosure of margin and headcount.
sections:
- id: identity
  title: Identity, Mission, and Business Model
  body: |
    Talos Global, Inc. is a New York-headquartered technology company founded in December 2018 by Anton Katz and Ethan Feldman to build institutional-grade infrastructure for digital asset trading. The company delivers an end-to-end platform spanning order and execution management (OEMS), portfolio management (PMS), a request-for-quote (RFQ) platform, white-label trading, and — following the 2025 Coin Metrics acquisition — data, blockchain analytics, and indexes. Crucially, Talos positions itself as a pure technology and SaaS provider rather than a broker-dealer, custodian, or principal trader: it sells the rails institutions use to access liquidity, not the liquidity itself.

    That positioning shapes the business model. Talos earns SaaS subscriptions plus usage fees, sells white-label technology to neobanks and fintechs (which CEO Anton Katz says is roughly half the business), and now layers in recurring data subscriptions through Coin Metrics. The company describes its differentiation as purpose-built, API-first infrastructure for institutions rather than adapted traditional-finance technology. As of 2026 Talos operates from New York (HQ), London, Cyprus, and Singapore, and serves clients across 32 countries, with APAC contributing about one third of global revenue. This identity — vendor, not counterparty — is the ground truth every later chapter reuses.
