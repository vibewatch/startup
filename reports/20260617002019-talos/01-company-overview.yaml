  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure gap
    missingEvidence: Talos has not disclosed 2026 headcount, gross margin, net revenue retention, or a detailed revenue split across SaaS, usage, white-label, and data lines.
    whyItMatters: Without margin, retention, and revenue-mix data, capital efficiency and the durability of the ~$1.5B valuation cannot be underwritten.
    diligencePath: Request audited management accounts and a product-line revenue bridge under NDA during diligence.
    relatedQuestionRefs:
    - QO011
    - QO023
    - QO026
  - type: missing-source
    severity: minor
    topic: founders
    missingEvidence: Exact equity holdings, vesting, and board composition for the founders and executive team are not public.
    whyItMatters: Key-person concentration on Anton Katz cannot be sized without retention and equity terms.
    diligencePath: Obtain the cap table, founder vesting schedules, and board roster from company counsel.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
