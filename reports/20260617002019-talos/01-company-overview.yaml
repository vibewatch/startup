- id: metrics-snapshot
  title: Scale Metrics and Disclosure Gaps
  body: |
    Public scale evidence for Talos is partial but improving. Third-party reporting puts revenue at $27.2 million in 2023 and roughly $45.5 million annualized by mid-2025, implying the top line is roughly doubling each year — a credible trajectory for an infrastructure vendor riding institutional crypto adoption. Geographically, Talos says it serves clients across 32 countries, with APAC about one third of revenue and a dedicated regional head. On the product-economics side, CEO Anton Katz frames roughly half of revenue as white-label technology for neobanks and fintechs, with the remainder split across direct trading clients and, increasingly, Coin Metrics data subscriptions.

    The disclosure gaps are equally important to mark. Talos has not published 2026 headcount, gross margin, net revenue retention, or a detailed revenue split by product line, and acquisition deal values other than the ~$100 million Coin Metrics figure are undisclosed. Valuation and total-raised numbers are press-reported rather than audited. The company's industry standing is corroborated by the Hedgeweek Global Digital Assets Awards 2025, where it was named Best Quantitative Trading Technology Provider. For underwriting purposes, the verified facts (rounds, investors, award) should be separated from company-stated metrics (country count, white-label mix) and from genuinely unavailable private data (margin, headcount, retention), each of which carries a concrete diligence path.
