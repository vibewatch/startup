- id: milestones-traction
  title: Milestones, M&A, and Adverse Checks
  body: |
    Talos's milestone chronology shows a vendor that has compounded product scope through acquisition while steadily raising institutional capital. From the 2018 founding and 2021 platform launch, the company executed four acquisitions — D3X Systems (Q1 2023, portfolio engineering), Cloudwall (April 2024, risk technology), Skolem (May 2024, DeFi infrastructure), and Coin Metrics (July 2025, data and analytics, reported at roughly $100 million). Each extended the platform along a clear axis: portfolio construction, risk, decentralized-finance access, and finally a recurring data-subscription revenue line that diversifies the SaaS-and-usage base. The January 2026 Series B extension then refreshed the balance sheet with strategic capital from Robinhood, Sony, IMC, and QCP.

    On adverse checks, the public record is comparatively clean: no major lawsuits or enforcement actions surfaced through 2026, and Talos's status as a pure technology provider (not a broker-dealer or custodian) limits direct regulatory exposure relative to prime brokers. The substantive risks are structural rather than legal — crypto-market cyclicality, competition from prime brokers such as FalconX (which reports $2.5 trillion in lifetime volume but a different prime-brokerage model), integration risk across four acquisitions, key-person dependence on Anton Katz, and ongoing regulatory uncertainty around digital assets. These are tracked in the dedicated risks chapter; here they qualify an otherwise strong identity and capital story.
