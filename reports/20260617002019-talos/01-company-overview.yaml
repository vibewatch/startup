- id: capital-investors
  title: Funding History, Valuation, and Investors
  body: |
    Talos has compiled a well-structured capital history. After an undisclosed 2020 seed round (Castle Island Ventures, Notation Capital, Autonomous Partners, Initialized Capital), the company raised a $40 million Series A in May 2021 led by a16z crypto with PayPal Ventures, Fidelity, and Galaxy Digital. In May 2022 it closed a $105 million Series B led by General Atlantic at a $1.25 billion valuation — the round that drew Citi, BNY Mellon, and Wells Fargo onto the cap table, a rare cluster of major-bank validation for a crypto-infrastructure vendor. In January 2026 Talos extended that Series B by $45 million (to $150 million total) at a post-money valuation of roughly $1.5 billion, adding Robinhood Markets, Sony Innovation Fund, IMC, QCP, and Karatage alongside returning backers a16z crypto, BNY, and Fidelity.

    Aggregating disclosed rounds, total capital raised is approximately $195 million. The 2026 mark represents only a modest (~20%) step-up over the 2022 valuation, notable because it was achieved despite intervening crypto-market drawdowns — a signal of durable institutional demand rather than froth. Reported valuation and total-raised figures are consistent across The Block, CoinDesk, Cointelegraph, and Coinspeaker, with no material conflicts identified. Exact ownership percentages, liquidation preferences, and board seats remain private and constitute the primary diligence asks on the cap table.
