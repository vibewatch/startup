companyProfile:
  summary: >-
    Talos is a New York-founded institutional digital asset trading infrastructure company built to
    give professional market participants a neutral workflow layer across execution, portfolio
    management, analytics, risk, settlement, and embedded or white-label digital asset services.
    Founded in 2018 by Anton Katz and Ethan Feldman, the company serves institutional
    clients across banks, hedge funds, market makers, asset managers, prime brokers, and fintech
    channels in 32 countries. Its 2024-2025 acquisitions of Cloudwall, Skolem, and Coin Metrics expanded the
    platform into risk, institutional DeFi, and data products, while the January 2026 Series B
    extension put the company at an approximately $1.5 billion valuation.
  foundedDate: '2018-12-01'
  founders:
    - name: Anton Katz
      role: Co-founder & CEO
      background: Former Head of Trading Technology at AQR with deep institutional trading-technology experience
      claimRefs: [CO001, CO002]
    - name: Ethan Feldman
      role: Co-founder & CTO
      background: Former Broadway Technology engineer focused on high-performance trading systems
      claimRefs: [CO001, CO003]
  foundingLocation: New York, NY, US
  headquarters: New York, NY, US
  productSummary: >-
    Neutral institutional digital asset workflow software spanning order and execution management,
    portfolio management, best-execution analytics, pre-trade controls, post-trade operations,
    settlement workflows, and data products from Coin Metrics.
  customerFocus: >-
    Banks, hedge funds, active asset managers, market makers, prime brokers, and embedded or
    white-label financial platforms seeking institutional-grade digital asset infrastructure.
  businessModel: >-
    Enterprise software subscriptions, usage-linked workflow fees, white-label infrastructure
    contracts, and expanding recurring data and analytics revenue.
  stage: Series B extension / growth-stage private company
  fundingStatus: >-
