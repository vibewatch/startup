  topStrengths:
    - >-
      Neutral institutional workflow positioning across execution, analytics, controls, settlement, and data rather than
      dependence on one venue or counterparty
    - >-
      Strong strategic investor base and category validation from General Atlantic, a16z, BNY Mellon, Fidelity,
      Robinhood, and other institutional backers
    - >-
      Product expansion through Cloudwall, Skolem, and Coin Metrics creates a plausible path to higher-quality recurring
      revenue and deeper wallet share per customer
    - >-
      Institutional digital asset adoption, workflow-control budgets, and non-U.S. regulatory clarity remain supportive
      tailwinds for category growth
  topRisks:
    - >-
      Public financial disclosure is too thin to underwrite margin, retention, customer concentration, or cash
      efficiency with confidence
    - >-
      Current valuation appears demanding relative to publicly cited revenue, leaving limited margin of safety if growth
      or mix improvement slows
    - >-
      Fee compression and bundled competition from prime brokers, custody-led providers, and exchange-affiliated stacks
      can pressure monetization
    - >-
      Operational and dependency risk are structurally high because Talos sits in the middle of always-on markets,
      external venues, custody connectors, and partner data feeds
  unresolvedGaps:
    - Audited margin, burn, runway, and net revenue retention are not publicly disclosed
    - Customer concentration, cohort retention, and module-attachment depth remain opaque from open evidence
    - >-
      The degree of technical integration and production reliability across Cloudwall, Skolem, and Coin Metrics is not
      externally proven
    - Dependency concentration by venue, custodian, cloud provider, and data feed is not publicly visible
    - The current $1.5B mark lacks a publicly disclosed bridge connecting valuation to present operating metrics
