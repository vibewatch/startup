- id: buyer-segments
  title: Buyer Segmentation and Adoption Paths
  body: |
    Institutional crypto infrastructure buyers segment into five primary categories, each with distinct budget ownership, adoption timelines, and revenue models for vendors like Talos. Tier-1 banks (Citi, BNY Mellon, Wells Fargo — all Talos investors) have the largest budgets but longest sales cycles (6-12 months), driven by compliance requirements and enterprise procurement. Budget ownership sits with the head of digital assets or COO. Neobanks and fintechs (Nubank Cripto, BVNK, Coinhako) represent the fastest adoption path — CEO Anton Katz notes roughly half of Talos business is white-label technology deployed in 3-6 weeks. Hedge funds and proprietary trading firms adopt via API integration in weeks, valuing execution algorithms and multi-venue access. Brokers and dealers need compliant order routing in 2-4 months. Asset managers integrate with existing portfolio systems (the BlackRock Aladdin integration exemplifies this path).

    Geographically, APAC accounts for approximately one third of Talos revenue across 12 countries, with Talos's APAC head Samar Sen noting that regulatory clarity in the region is accelerating adoption faster than elsewhere. The Coalition Greenwich December 2022 survey found 92% of mass-affluent and high-net-worth investors asking financial advisors for digital asset exposure, creating downstream demand for FA and wealth-platform infrastructure. The segment map reveals that Talos's white-label motion gives it the fastest path to volume (neobanks) while its enterprise capabilities position it for the highest-value contracts (banks, asset managers).
