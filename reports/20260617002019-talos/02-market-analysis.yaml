- id: market-sizing
  title: 'Market Sizing: Multiple Lenses and Irreducible Uncertainty'
  body: |
    No single credible market-size estimate exists for institutional digital asset infrastructure. The market is nascent, vendor revenue is private, and the boundary between infrastructure and adjacent services is porous. We therefore apply three lenses and explicitly preserve the uncertainty rather than choosing one number.

    The top-down lens takes the roughly $3 trillion crypto market capitalization in 2025 and assumes 0.5-1.5% is spent on infrastructure, yielding a $15-45 billion total addressable market — directionally useful but highly approximate. The bottom-up lens estimates 500-2000 institutional buyers at $200K-$2M annual platform spend, producing a $100 million to $4 billion serviceable addressable market range. The TradFi OEMS analogy observes that Bloomberg EMSX, Fidessa, and FlexTrade collectively earn $5-10 billion annually; the crypto analog is a fraction but growing faster as institutional flows accelerate.

    Demand proxies provide grounding even where TAM is uncertain. Stablecoin supply reached approximately $300 billion in 2025, a proxy for on-chain institutional activity. Bitcoin ETFs saw $5.6 billion in net inflows over 30 days in July 2025, with BlackRock IBIT generating roughly $187 million per year in fees — each basis point of ETF infrastructure cost represents addressable spend. Nasdaq and Talos announced a partnership targeting a $35 billion-plus tokenized collateral management opportunity, an adjacent growth vector. The Grayscale 2026 Digital Asset Outlook projects institutional allocation will drive crypto markets from adolescence to maturity. These proxies converge on a directional conclusion: infrastructure demand is growing structurally, even if precise TAM cannot be pinpointed. The BIS Working Paper 1147 corroborates that institutional participation has grown but remains constrained by infrastructure gaps.
