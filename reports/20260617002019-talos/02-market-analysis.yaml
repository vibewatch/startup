- id: growth-drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: |
    Seven identifiable drivers are expanding the institutional digital asset infrastructure market. On the regulatory front, MiCA became effective December 30, 2024, creating a harmonized EU framework that forces institutions to adopt compliant infrastructure rather than ad-hoc solutions. The GENIUS Act established a US stablecoin framework in 2025, and DORA imposes operational resilience standards on EU financial entities — both pushing vendor spend upward. On the market-demand front, stablecoin supply reaching $300 billion and BTC ETF inflows of $5.6 billion in a single month signal structural institutional on-ramping. The tokenized collateral opportunity ($35B+ per Nasdaq) opens an adjacent growth vector, and Coalition Greenwich's 92% HNW demand figure confirms end-investor pull.

    Against these drivers sit five material constraints. Regulatory uncertainty — despite MiCA and GENIUS — persists in many jurisdictions, particularly the US for non-stablecoin assets, slowing institutional decision-making. Switching costs are non-trivial: institutions that have built in-house systems face 6-18 month migration timelines, creating build-versus-buy inertia. Trust and security requirements (SOC 2 compliance, penetration testing, multi-region failover) elongate procurement cycles. Crypto market cyclicality compresses infrastructure budgets during bear markets, though SaaS subscription models buffer this somewhat. Finally, capital intensity — the high cost of building compliant multi-venue infrastructure — limits new competitors but also means existing vendors must continuously invest, creating margin pressure. The net assessment is that drivers outweigh constraints in 2025-2026 as regulation and ETF flows provide structural tailwinds, but cyclicality remains the dominant near-term risk.
