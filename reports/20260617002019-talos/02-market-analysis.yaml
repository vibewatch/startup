callouts:
- calloutType: insight
  title: Build-vs-Buy Is the Market's Central Dynamic
  body: The build-versus-buy decision determines adoption velocity. Institutions that have invested 12-18 months in custom builds face high switching costs, while greenfield entrants can deploy white-label solutions in weeks — creating a bifurcated market where vendor value proposition varies dramatically by buyer maturity.
  claimRefs:
  - CM005
  - CM019
  - CM035
- calloutType: risk
  title: Market Sizing Carries Order-of-Magnitude Uncertainty
  body: Published market estimates for institutional crypto infrastructure range from $100M to $45B depending on methodology. No validated TAM/SAM/SOM exists, making revenue forecasting and competitive positioning difficult to benchmark. Investors should treat any single number with extreme skepticism.
  claimRefs:
  - CM023
  - CM024
  - CM034
- calloutType: assumption
  title: Regulatory Tailwinds Assumed to Continue
  body: The growth thesis depends on MiCA, GENIUS Act, and APAC regulatory clarity sustaining momentum. A regulatory reversal or hostile enforcement regime could compress the market back to early adopters, invalidating sizing estimates built on broad institutional participation.
  claimRefs:
  - CM011
  - CM012
  - CM018
- calloutType: strength
  title: Demand Proxies Converge Despite Sizing Uncertainty
  body: While TAM is unknowable, stablecoin supply ($300B), ETF inflows ($5.6B/month), and the 92% HNW demand signal all point in the same direction — structural institutional on-ramping that requires infrastructure.
  claimRefs:
  - CM006
  - CM007
  - CM010
