- id: competitor-profiles-comparison
  title: Competitor Profiles and Capability Comparison
  body: |
    FalconX stands as the most frequently cited competitor, but operates a fundamentally different model: it is a prime broker reporting $2.5 trillion in lifetime trading volume, 350+ employees, and 7 offices. Rather than selling neutral infrastructure, FalconX acts as a principal to its clients' trades — earning on spread rather than SaaS fees. Critically, FalconX also expanded its integration with Talos in 2024 to provide FX liquidity, making it a liquidity supplier on the Talos provider network. This frenemy dynamic illustrates the structural difference: Talos aggregates; FalconX provides.

    Coinbase Prime, backed by the largest US exchange (public market cap $50B+), offers full-service institutional prime brokerage including execution, custody, and financing. Its competitive overlap with Talos is real but bounded — Coinbase Prime is both a venue on the Talos network and a rival platform for institutional workflow. Fireblocks ($8B valuation in 2022, $550M+ raised) focuses on MPC-based custody and security, intersecting Talos only in DeFi access via their joint Uniswap Labs partnership. Galaxy Digital operates as a multi-line financial conglomerate with trading, lending, mining, and advisory — broad but less execution-tech-specialized. LMAX Exchange runs institutional FX and crypto order books focused on execution quality.

    Pricing across the competitive set is largely opaque. Talos uses SaaS subscriptions plus per-trade usage fees; prime brokers embed pricing in execution spreads; custody providers charge basis points on AUC. Only LMAX publishes a transparent maker-taker fee schedule. This opacity makes direct price comparison difficult and represents a material evidence gap for diligence.
