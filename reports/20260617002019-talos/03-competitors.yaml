callouts:
- calloutType: strength
  title: Network-Effect Moat via 100+ Integrations
  body: Talos connects to 100+ integrations, 60+ venues, and 50+ exchanges — each new liquidity provider or venue added makes the platform more valuable to all clients. No single competitor replicates this breadth while maintaining neutrality.
  claimRefs:
  - CP011
  - CP016
- calloutType: risk
  title: Prime-Broker Vertical Integration Threat
  body: Ripple's $1.25B acquisition of Hidden Road signals that prime brokers may bundle free execution technology with principal services. If bundled OEMS becomes standard, Talos's standalone SaaS model faces margin pressure from competitors who monetize flow rather than software.
  claimRefs:
  - CP006
  - CP022
- calloutType: insight
  title: Frenemy Dynamics Create Both Moat and Risk
  body: FalconX, Fireblocks, Coinbase, and Deribit simultaneously integrate with Talos as liquidity/custody partners AND operate their own institutional platforms. This dual role validates Talos as neutral infrastructure but creates channel-conflict risk if partners internalize execution management.
  claimRefs:
  - CP003
  - CP015
  - CP027
- calloutType: assumption
  title: Pricing Opacity Limits Competitive Benchmarking
  body: Enterprise pricing for institutional crypto infrastructure is almost universally undisclosed. Competitive pricing comparison relies on inferred models (SaaS vs spread vs AUC fees) rather than observed contracted rates. Diligence should request Talos pricing deck and any competitive win/loss data.
  claimRefs:
  - CP018
