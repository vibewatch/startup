  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited financials
    missingEvidence: Revenue figures ($27.2M 2023, ~$45.5M mid-2025) are CEO-stated without independent audit verification; no publicly disclosed margin, retention, or ARR cohort data.
    whyItMatters: Without audited financials, the ~33x implied multiple cannot be validated; actual unit economics may differ materially from assumptions.
    diligencePath: Request audited financial statements, quarterly ARR with cohort retention (NRR/GRR), and gross/net margin breakdown under NDA.
    relatedQuestionRefs:
    - QV015
    - QV022
    relatedTableRefs:
    - TV001
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuations
    missingEvidence: Direct private valuations for key comparables (FalconX, Fireblocks current) are undisclosed; only Ripple/Hidden Road acquisition provides a concrete M&A benchmark.
    whyItMatters: Without comparable transaction data, the ~33x multiple assessment relies on cross-sector SaaS benchmarks rather than direct digital-asset-infrastructure comparables.
    diligencePath: Commission secondary market data review; request LP reference calls from investors in FalconX and Fireblocks for valuation color.
    relatedQuestionRefs:
    - QV009
    - QV011
    - QV025
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: cap table and preferences
    missingEvidence: Liquidation preference stack, participation rights, and anti-dilution provisions are not disclosed in public sources.
    whyItMatters: The actual return profile at $1.5B depends heavily on preference stack — headline valuation may overstate economic value for later-stage investors.
    diligencePath: Request full cap table, liquidation waterfall, and any side letters or preferential terms in diligence.
    relatedQuestionRefs:
    - QV013
    - QV022
  - type: stale
    severity: minor
    topic: Fireblocks valuation
    missingEvidence: Fireblocks ~$8B valuation dates from 2022; post-crypto-winter conditions may have materially changed this mark.
    whyItMatters: Using a stale comparable may overstate or understate relative positioning of Talos's $1.5B valuation.
    diligencePath: Seek updated Fireblocks secondary pricing or recent funding data to calibrate comparable range.
    relatedQuestionRefs:
    - QV011
    relatedTableRefs:
    - TV004
