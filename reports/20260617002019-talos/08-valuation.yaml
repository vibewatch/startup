- id: comparable-benchmarking
  title: Comparable Valuation Benchmarking
  body: |
    Direct valuation comparables for Talos are limited by the scarcity of publicly reported institutional crypto infrastructure valuations. The most relevant benchmarks available: Ripple acquired Hidden Road for $1.25 billion in April 2025, validating that institutional crypto prime brokerage infrastructure commands billion-dollar valuations — though Hidden Road operates as a principal with $14B+ daily volume versus Talos's asset-light SaaS model. FalconX (private, $400M+ raised, $2.5T+ lifetime volume) has an undisclosed valuation that would provide the closest comparison, but this data gap prevents direct analysis.

    Fireblocks was valued at approximately $8 billion in its 2022 funding round (custody/MPC focus), but this mark is stale and may not reflect current market conditions following the 2022-2023 crypto drawdown. Galaxy Digital trades publicly at approximately $4B+ market capitalization as a diversified financial-services firm, offering a loose cross-sector benchmark.

    Talos's ~33x implied revenue multiple on approximately $45.5 million ARR is assessed as follows: for high-growth (>50% annually) vertical SaaS with expanding TAM, public market precedents (prior to crypto discount) have ranged from 20-50x revenue. The premium is justified by category leadership and institutional tailwind positioning, but requires sustained execution to maintain. The absence of public comparables at similar stage and business model represents a material valuation gap that diligence should address through LP reference calls and secondary market data points.
