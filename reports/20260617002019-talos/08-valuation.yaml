- id: scenario-analysis
  title: Scenario Analysis and Value Drivers
  body: |
    Three scenarios frame the valuation range from the $1.5 billion entry point. The bull scenario assumes continued approximately 2x annual revenue growth to ~$90 million by 2027, driven by institutional tailwind acceleration (ETFs, stablecoins, tokenized collateral), successful Coin Metrics integration delivering cross-sell synergies, and TradFi anchor partnerships converting to material revenue (BlackRock Aladdin, Nasdaq). At 35-45x revenue multiple reflecting category leadership, this implies $3.2-4.1 billion exit valuation and 2.1-2.7x MOIC.

    The base scenario assumes growth moderating to approximately 50 percent annually (still well above SaaS median) yielding ~$68 million by 2027. Partnerships contribute but at slower pace; Coin Metrics integration proceeds without major issues; crypto markets remain constructive. At 25-30x multiple, this implies $1.7-2.0 billion (1.1-1.3x MOIC) — modest capital appreciation preserving invested value.

    The bear scenario assumes a crypto cyclical downturn slowing growth to approximately 20 percent (~$55 million by 2027), combined with multiple compression to 15-20x as investors de-risk crypto infrastructure exposure. Prime-broker bundling materializes, creating pricing pressure. This implies $0.8-1.1 billion (0.5-0.7x MOIC) — a capital loss scenario. Probability-weighting at 25/50/25 yields an expected value of approximately $1.9 billion, supporting a cautious-positive stance at the current $1.5 billion mark.

    Key value drivers across scenarios include: revenue growth sustainability (most impactful), Coin Metrics integration execution, crypto market cycle conditions, TradFi partnership monetization speed, and competitive dynamics around prime-broker vertical integration.
