- id: break-kill-triggers-diligence
  title: Break/Kill Triggers and Final Diligence Asks
  body: |
    Seven thesis break and kill triggers define the risk monitoring framework. Kill triggers (existential risk) include Coin Metrics integration failure and unplanned CEO departure without succession plan — either could result in material value destruction. Break triggers (thesis damage requiring re-evaluation) include revenue deceleration below 30 percent growth, loss of a top-5 client, prime-broker bundling of free OEMS, sustained crypto market downturn (BTC >60% drawdown for >6 months), and adverse regulatory action targeting crypto infrastructure SaaS providers.

    Final diligence asks are prioritized by their impact on thesis confirmation or rejection. Three critical asks must be satisfied before capital commitment: (1) audited ARR with quarterly cohort retention demonstrating net revenue retention above 120 percent, confirming the quality of the ~$45.5M run-rate; (2) gross and net margin breakdown confirming SaaS unit economics at the ~33x multiple; and (3) cap table and liquidation preference stack determining actual economics for new investors. High-priority asks include Coin Metrics integration roadmap with milestone KPIs, competitive win/loss data from the last twelve months, and key-person succession planning documentation.

    The largest valuation gap remains the absence of audited financial data: all revenue figures are CEO-stated or press-reported without independent verification. Until ARR, retention, and margin are confirmed, the ~33x multiple cannot be fully validated. The recommendation of milestone-gated deployment directly addresses this gap — tying capital tranches to information milestones reduces downside exposure while preserving optionality.
