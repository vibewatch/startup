callouts:
- calloutType: strength
  title: Purpose-Built Architecture Enables 24/7 Institutional Operations
  body: Unlike adapted TradFi systems, Talos was built from inception for always-on digital asset markets with multi-region cloud deployment and API-first connectivity to 100+ integrations — an architectural advantage that compounds as venue count and asset class coverage grow.
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE017
- calloutType: risk
  title: No Public Source Code or Independent Benchmarks
  body: The Talos platform is entirely closed-source with no public repository, no published third-party performance benchmarks, and no disclosed uptime SLA or security audit. Developer-signal evidence is limited to solution page documentation, making independent verification of architectural and performance claims impossible without NDA access.
  claimRefs:
  - CE023
  - CE024
  - CE025
- calloutType: insight
  title: Coin Metrics Acquisition Creates Integrated Data Moat
  body: The ~$100M Coin Metrics acquisition adds blockchain analytics, network data, and indexes directly into the execution workflow — enabling data-driven order routing and portfolio optimization that competitors without captive data cannot replicate at the same integration depth.
  claimRefs:
  - CE007
  - CE008
  - CE029
- calloutType: recommendation
  title: Request Independent Security Audit and Performance Verification
  body: Before underwriting, require disclosure of SOC 2 / ISO 27001 status, a third-party penetration test summary, uptime SLA terms, and independent execution-quality benchmarks under NDA — these are standard institutional due diligence asks that Talos has not publicly addressed.
  claimRefs:
  - CE024
  - CE025
