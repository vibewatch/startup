- id: growth-adoption-trajectory
  title: Growth, Adoption Trajectory, and Named Proof Points
  body: |
    Talos does not publicly disclose logo counts, annual cohort additions, or pipeline metrics. Growth must instead be inferred from revenue trajectory, funding signals, and published case studies. Revenue grew from $27.2 million in 2023 to roughly $45.5 million annualized by mid-2025 — approximately doubling annually — which implies either rapid client additions, significant within-account expansion, or both. The January 2026 Series B extension confirmed the company serves 32 countries, up from an unspecified earlier footprint, with investors including Robinhood and Sony validating the client-base scale.

    Named customer proof points provide the strongest evidence of adoption quality. BCB Group reported a 23x increase in trading volume and 10x increase in trade count within Q1-Q3 2023 after deploying Talos. BVNK achieved a 184% increase in trades executed, saved 3 weeks per liquidity provider integration, and onboarded 5 new LPs. Firinne Capital cut month-end reconciliation from 3 days to several hours using the Talos PMS. Nubank Cripto adopted Talos smart order routing to reduce trading costs. These quantitative outcomes span different segments (payments, stablecoin infrastructure, hedge fund, neobank) and geographies (UK, Brazil, US), demonstrating breadth. However, all metrics are Talos-published and company-reported — no independent audit or third-party verification of these specific figures exists in public sources. The adoption funnel moves from institutional prospect engagement through contract, integration, go-live trading, and expansion, with same-day deployment as a claimed differentiator in onboarding speed.
