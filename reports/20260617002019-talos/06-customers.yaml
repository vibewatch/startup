- calloutType: strength
  title: Quantified Customer Outcomes Across Segments
  body: BCB Group (23x volume), BVNK (+184% trades, 5 new LPs), and Firinne Capital (reconciliation 3 days to hours) provide concrete, quantified proof points spanning payments, stablecoin infrastructure, and hedge fund operations — rare in enterprise SaaS at this stage.
  claimRefs:
  - CU004
  - CU005
  - CU006
- calloutType: risk
  title: White-Label Concentration and Crypto Cyclicality
  body: Roughly half of Talos revenue depends on neobank white-label clients who are themselves crypto-cyclical. A prolonged bear market or regulatory restriction on retail crypto trading could compress this segment and create material revenue headwinds.
  claimRefs:
  - CU014
  - CU015
  - CU033
- calloutType: insight
  title: Revenue Doubling as Retention Proxy
  body: Revenue approximately doubling annually ($27.2M to ~$45.5M) while no public churn events are reported suggests strong net retention and expansion, though formal NRR metrics remain undisclosed.
  claimRefs:
  - CU013
  - CU036
  - CU034
- calloutType: recommendation
  title: Request NRR and Top-10 Client Concentration
  body: The most critical diligence asks are net revenue retention (NRR), dollar-based expansion rate, and top-10 client revenue share. Without these, the durability of the growth trajectory and true concentration risk cannot be underwritten.
  claimRefs:
  - CU026
  - CU033
