chapter:
  number: 6
  title: Customers and Traction
  summary: Talos serves clients across 32 countries spanning five institutional segments (banks/neobanks, hedge funds, brokers, exchanges, asset managers), with white-label neobank technology constituting roughly half of revenue. Named proof points include BCB Group (23x volume growth), BVNK (+184% trades, 5 new LPs), and Firinne Capital (reconciliation from 3 days to hours). Revenue approximately doubled annually ($27.2M in 2023 to ~$45.5M mid-2025), suggesting strong retention and expansion. Key risks include white-label concentration, crypto cyclicality among clients, and undisclosed NRR/concentration metrics.
sections:
- id: customer-segments-icp
  title: Customer Segments, ICP, and Geographic Spread
  body: |
    Talos serves five principal customer segments across the institutional digital asset ecosystem: banks and neobanks (white-label technology), hedge funds, brokers, exchanges, and asset managers. The ideal customer profile centers on regulated or institutional-grade organizations that need multi-venue execution, portfolio management, or white-label crypto trading capabilities — entities too sophisticated for retail exchanges but unwilling to build proprietary OEMS internally. CEO Anton Katz states that roughly half of Talos revenue derives from white-label technology for neobanks and fintechs, making this the dominant segment by revenue.

    Geographically, Talos serves clients across 32 countries with APAC contributing approximately one third of global revenue. The APAC presence spans 12 countries with a dedicated regional head (Samar Sen), and named APAC clients include Coinhako (Singapore), OSL (Hong Kong), and Caleb & Brown (Australia). The Americas house Nubank Cripto (Brazil), Netcoins (Canada), Firinne Capital and EDX Markets (US); EMEA includes BCB Group, BVNK, Archax, and Enigma Securities. This geographic diversification reduces single-market regulatory risk but creates operational complexity across jurisdictions. The segment map reveals that banks/neobanks dominate revenue while hedge funds and exchanges contribute the highest execution volumes — a revenue-volume mismatch worth tracking in diligence.
