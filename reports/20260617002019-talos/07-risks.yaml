- id: people-execution-risk
  title: People and Execution Risk
  body: |
    Key-person dependency on CEO Anton Katz is the most prominent people risk. Katz co-founded Talos, previously led trading technology at AQR, and personally anchors strategy, fundraising (including the January 2026 $45M extension), and the external narrative. No public succession plan exists. While CTO Ethan Feldman provides technical leadership continuity and the broader bench includes Samar Sen (APAC), Josh Peschko (Compliance), Drew Forman (SVP Strategy/M&A), and Eliad Hoch (Quant Execution), investor and market communication remain concentrated on one individual.

    Execution risk compounds across four acquisitions in under three years. Each deal brought teams, technology, and products that must integrate without disrupting existing operations or losing key acquired talent. The Coin Metrics deal — the largest at ~$100M — is particularly sensitive because data and analytics represent a new strategic direction. If the acquired team attrites or the technology stack proves incompatible, the acquisition thesis fails. Geographic scaling across 32 countries introduces further execution load: local compliance, hiring, and market adaptation require management bandwidth that competes with acquisition integration. Talent retention in a competitive crypto hiring market (against well-funded firms like FalconX with 350+ employees) adds continuous pressure.
  claimRefs:
