- id: mitigations-kill-criteria
  title: Mitigations, Kill Criteria, and Risk Diligence Gaps
  body: |
    Talos has demonstrated several risk mitigations through public actions: (1) regular regulatory commentary through roundup publications showing active policy monitoring; (2) MiCA-ready partner integrations (Bitvavo) demonstrating compliance-forward positioning; (3) multi-venue breadth (100+ integrations) reducing single-point dependency; (4) diversification of revenue through Coin Metrics data subscriptions (less volume-sensitive); and (5) bank-grade investor validation (Citi, BNY, Fidelity returning) signaling institutional confidence in risk management. The Talos Terms of Service provide a legal framework delineating platform versus client responsibility.

    Kill criteria for the investment thesis — signals that would indicate fundamental deterioration — include: (a) direct regulatory action targeting the Talos platform forcing operational curtailment; (b) loss of two or more major exchange integrations reducing connectivity value below competitive threshold; (c) revenue declining for two consecutive quarters indicating demand destruction beyond cyclicality; (d) departure of Anton Katz without executed succession plan; and (e) mass attrition of Coin Metrics acquired team signaling integration failure. Key diligence gaps that cannot be resolved from public sources include: SOC2 attestation status, actual uptime SLAs and incident history, client revenue concentration data, succession planning documentation, Coin Metrics team retention metrics, and detailed regulatory licensing strategy per jurisdiction. These require NDA-protected management access.
