  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory risk
    missingEvidence: The regulatory risk register covers principal US, EU, and APAC regimes but does not exhaustively catalog all 32 jurisdictions where Talos operates or emerging frameworks (e.g., UAE VARA, Singapore MAS).
    whyItMatters: Unidentified regulatory requirements in smaller jurisdictions could impose unexpected compliance costs or restrict Talos operations.
    diligencePath: Commission jurisdiction-by-jurisdiction regulatory mapping covering all 32 operational countries.
    relatedQuestionRefs:
    - QR001
    - QR003
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: operational resilience
    missingEvidence: Talos has not publicly disclosed SOC2 attestation, uptime SLAs, incident response history, or platform availability metrics.
    whyItMatters: Without operational resilience evidence, the platform stability thesis cannot be underwritten and DORA compliance posture is unverifiable.
    diligencePath: Request SOC2 Type II report, uptime data, incident log, and DORA readiness assessment under NDA.
    relatedQuestionRefs:
    - QR008
    - QR005
  - type: private-evidence-only
    severity: material
    topic: client concentration
    missingEvidence: Revenue concentration by client and white-label partner is not publicly disclosed beyond the ~50% white-label aggregate figure.
    whyItMatters: Unknown concentration means a single client loss could represent material revenue impact without warning.
    diligencePath: Request top-10 client revenue breakdown and white-label contract terms under NDA.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: succession planning
    missingEvidence: No public succession plan for CEO Anton Katz or CTO Ethan Feldman has been disclosed.
    whyItMatters: Key-person risk cannot be sized without understanding retention incentives and succession readiness.
    diligencePath: Request succession plan documentation, key-person insurance status, and equity retention terms.
    relatedQuestionRefs:
    - QR013
    - QR032
    relatedTableRefs:
    - TR004
  - type: stale
    severity: minor
    topic: regulatory velocity
    missingEvidence: Crypto regulatory frameworks are evolving rapidly in 2026; risk assessments based on mid-2026 data may not reflect H2 2026 developments.
    whyItMatters: New regulations or enforcement actions could alter the risk profile before diligence concludes.
    diligencePath: Re-run regulatory risk assessment in Q4 2026 to capture MiCA enforcement actions and GENIUS Act implementation.
    relatedQuestionRefs:
    - QR025
