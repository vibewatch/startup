  topStrengths:
    - Category leadership in mobile-first consumer messaging with 8,000+ brands and $29B+ annual customer GMV
    - 'Strong product momentum: AI Pro, AI Journeys, RCS expansion, and 50%+ multi-product penetration'
    - Blue-chip investor base and meaningful operating scale, including a $500M+ ARR milestone and ~5,000 employees
    - >-
      Deep ecommerce integration footprint and proprietary mobile sign-up/distribution mechanics that support switching
      costs
  topRisks:
    - >-
      The current ~$7B private mark implies a 4-5x premium to public marketing-automation peers without audited
      financial support
    - >-
      No audited public financials, disclosed gross margins, NRR, or recent primary financing create major underwriting
      blind spots
    - Core SMS economics depend on carrier rules, TCPA/privacy compliance, and evolving deliverability standards
    - >-
      Leadership transition from founder Brian Long to Amit Jhawar adds execution and continuity risk during an AI
      repositioning
    - >-
      Public legal proceedings and customer pricing-opacity complaints indicate non-trivial operational and retention
      risk
  unresolvedGaps:
    - Current audited ARR, growth, gross margin, free cash flow, and net revenue retention remain undisclosed
    - Cap table, liquidation preferences, and any 2024-2026 secondary pricing are not publicly visible
    - Board composition and founder involvement after the CEO transition are not confirmed by primary sources
    - Customer concentration, churn, and vertical mix beyond selected case studies remain opaque
    - Scope of regulatory exposure beyond public guidance and visible court dockets is unconfirmed
