      - number: '2.6'
        title: 图表与材料
        blocks:
          - type: callout
            title: 监管逆风：TCPA 诉讼和运营商过滤抬高 SMS 合规成本
            body: >-
              TCPA 集体诉讼风险和 10DLC 运营商注册要求，是 SMS 营销平台持续面对的实质约束。每条不合规短信的法定赔偿为 $500–$1,500，因此捕获 opt-in
              同意是法律必需项，而不是功能偏好。把同意机制嵌入订阅者获取工具的平台——Attentive 的专利 two-tap 注册就是如此——拥有监管护城河。但合规复杂度也会拖慢客户上线，并限制任一品牌可触达的订阅者总池。
            calloutType: risk
