      - number: '5.2'
        title: AI 套件与代理式智能
        blocks:
          - type: paragraph
            body: >
              Attentive 的 AI 能力拆成三款商业产品——AI Pro、AI Journeys、Visibility AI for RCS——以及在 Thread 2026 发布的四项 agentic 能力路线图。

              AI Pro 是一套由四个子组件构成的套件，覆盖 campaigns 和 triggered messages。Identity AI 把订阅者识别延伸到浏览器 cookie
              之外，通过构建更丰富的跨渠道档案，公司称可将已识别订阅者提升 10-15%。Audiences AI 用历史和实时购买信号动态优化 campaign 受众，公司称带来 20% 收入增长。Send Time AI
              为每个订阅者单独预测最佳投递时点，在 75%+ 的部署中提升 CVR 和 CTR。Brand Voice AI 使用基于品牌表现最佳消息训练的模型生成符合品牌语气的文案，公司称可将内容创作时间减少 50%。

              AI Journeys 于 2024 年 3 月推出，用在 90 billion 条消息上训练的自适应模型，替代静态规则触发树。产品实时个性化文案、产品推荐、图片和
              CTA，并持续从每个订阅者的点击、浏览和购买行为中学习。Attentive 报告，相比规则型 journeys，收入中位数提升 200%，增量 ROI 超过 5x。ILIA Beauty 部署后实现购买提升
              280%，自动化 journey ROI 达 225x。

              Visibility AI for RCS 于 2026 年 5 月 20 日上线，针对 iOS 26「unknown sender」过滤带来的 inbox 可见性风险。系统按订阅者分析 inbox
              可见性信号，并动态把每条消息路由到 RCS（设备能呈现主 inbox 的订阅者）或 SMS（有被分到过滤文件夹风险的订阅者）。「Auto-upgrade」功能会在支持时自动把 SMS/MMS 转为
              RCS，避免对话线程碎片化。FragranceNet 报告，branded RCS 带来 CTR 提升 45%、转化提升 37%、每条消息收入提升 36%；rich media carousels 又带来 CTR
              提升 106%、转化提升 50%。

              在 Thread 2026（2026 年 5 月 26 日），Attentive 发布了计划在 BFCM 2026 前推出的四项 agentic 能力：Brand Voice 2.0（扩展 omnichannel
              品牌语气控制）、Reporting Agent（对话式自然语言分析界面）、Predictive Analytics（AI 驱动的预算和时点预测）以及 AI Campaigns（从客户信号到 campaign
              的端到端编排）。2026 年 Q1，品牌通过平台带来 $6B+ 收入，50%+ 客户使用多款产品。
