      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              Attentive 已披露总融资约 $866M，横跨多轮。SEC EDGAR 记录显示，Attentive Mobile Inc. 在 2018 至 2021 年间向 SEC 提交了七份 Form D 通知，包括
              2018 年 2 月、2019 年 8 月、2020 年 2 月、2020 年 4 月（修订）、2020 年 9 月、2021 年 3 月和 2021 年 6 月文件。这一节奏与 Seed、Series
              A、B、C、D 和 E 轮相符。公开报道和 Sacra 分析师档案确认，市场广泛报道的 Series C 约为 $230M，随后有 Series D，以及 2021 年 9 月标志性的 $470M Series
              E，估值 $10B，由 Bain Capital Ventures 和 Coatue 领投。2021 年 6 月 Form D（E 轮之前的 D 轮）披露截至当日已售出 $59M，董事包括 Bain 的
              Scott Friend 和 Sequoia 的 Patrick Grady。

              Forbes Cloud 100 2025 数据（2025 年 9 月发布、2026 年 3 月更新）给出的总募资为 $866M，当前估值约 $7B。相较 2021 年 9 月 Series E 峰值
              $10B，估值下降反映更广泛的私募市场倍数压缩。Sacra 估算估值为 $6.9B、总融资为 $863M，四舍五入后一致。2021 年之后未见公开披露的新融资轮。关键投资方包括 Sequoia
              Capital（由组合公司列表和 Patrick Grady 董事席位确认）、Bain Capital Ventures（由 Scott Friend 董事席位和 Sacra 确认）、Coatue（由 Sacra
              和媒体报道确认）、Tiger Global 和 Wellington Management。
