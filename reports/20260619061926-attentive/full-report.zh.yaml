  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、TCPA 与隐私风险
        blocks:
          - type: paragraph
            body: >
              Attentive 的核心业务，是帮助 8,000+ 个品牌向已 opt-in 的消费者订阅者列表发送高频 SMS 和 email campaigns；这正处在美国高度诉讼化监管环境的中心。Telephone
              Consumer Protection Act（TCPA）让平台及其品牌客户都面临每条违规短信 $500–$1,500 的法定赔偿，针对使用商业消息平台的品牌的 TCPA class-action suits
              也很常见。CourtListener 记录显示，自 2022 年以来，16 起案件在 TCPA 语境中明确引用「attentive mobile」，2022 年后共有 107 起案件点名 Attentive
              Mobile，凸显公司所处的诉讼环境无处不在。

              Attentive 通常不是 TCPA 诉讼中的主要被告——使用其平台的品牌才是前台目标——但当原告指称平台供应商发送或协助发送未经授权消息时，平台会面临共同被告风险。在 Raslavich v.
              Spanx（M.D. Fla. 2022）中，Attentive Mobile 曾被列为共同被告，随后于 2022 年 9 月 13 日被 without prejudice 驳回。在 Salaiz v.
              RANEYS, LLC（W.D. Tex. 2022）中，Attentive 再次与品牌客户一同被列名。Value City Furniture TCPA 案件（S.D. Ohio 2024–2025）在
              discovery 中突出使用 Attentive 订阅者记录和审计函，说明即便不是主要被告，公司也系统性暴露于 discovery obligations。

              FCC 收紧商业短信 one-to-one consent 规则、FTC 的 CAN-SPAM 和反垃圾执法姿态，以及 California 的 CCPA/CPRA（由 California AG
              执行），都会增加合规义务。Attentive 在缓释工具上投入很重：获得专利的 Two-Tap 双重 opt-in（截至 2026 年 1 月有 10 项已授权专利）、Litigator Defender（已知
              TCPA 原告电话号码数据库）、用于取回同意记录的 Enhanced Audit Assistant，以及内部 carrier relations team。平台还持有覆盖 2024 年 11 月至 2025 年
              10 月的 SOC 2 Type II 认证，并已在 EU-US Data Privacy
              Framework（DPF）下认证。不过，合规工具能降低但不能消除诉讼暴露，尤其是品牌客户误配置流程或从第三方列表重新导入同意记录时。GDPR 合规记录在 Attentive 的 DPA 和隐私政策中，并指定
              EDPO 为 EU data representative，但实施深度没有公开的独立验证。
