        - 高
        - 主要竞争对手都在 2025-2026 年推出 agentic/AI 功能；差异化窗口正在收窄
        - 评估 Attentive 基于 $29B 客户收入训练的 AI 模型，是否相较竞争对手训练数据形成专有信号优势
      - - 企业 white-glove 服务模型
        - 中端品牌转向自助式竞争对手（Klaviyo、Omnisend）
        - 中
        - G2 投诉称邮件构建器需要 White Glove 团队介入，而非自助完成；SMB 存在流失风险
        - 跟踪 SMB 与企业收入组合；评估自助路线图投入
      - - RCS 渠道（Visibility AI，2026 年 5 月）
        - RCS 采用受限于运营商 / 设备碎片化；竞争对手也在推出 RCS
        - 中
        - Klaviyo 和 Braze 均支持 RCS；Attentive 的 Visibility AI 抢先进入；RCS 送达依赖运营商
        - 监测 RCS 采用率；评估先发优势是否带来可衡量的偏好转移
      - - 地理 SMS 覆盖（20+ 国家）
        - 全球品牌更偏好 Braze（全球）或 Omnisend（全球范围）
        - 高
