  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与渠道栈
        blocks:
          - type: paragraph
            body: >
              Attentive 的平台用一层统一编排层交付四个消息渠道：SMS、email、RCS for Business 和 push notifications。架构核心是移动优先身份模型：部署在品牌网站上的
              Attentive JavaScript tag 持续捕捉行为信号——浏览事件、加购和购买完成——并把这些信号关联到一个名为 Single Customer ID
              的统一订阅者档案。该档案跨渠道流转，让平台无论入口在哪里，都能识别回访访客并触发个性化旅程。

              消息投递依靠与运营商的直接关系（AT&T、Verizon、T-Mobile 支撑 SMS 和 RCS），以及 Google Jibe RCS platform 支撑 Rich Communication
              Services。email 走 Attentive 自有投递基础设施；公司称送达率达 99%，并由 300+ 名 email 专家负责预热、认证和黑名单监控。push notifications 在 2026
              年初作为 GA 产品加入，通过 iOS 和 Android SDK 接入同一个 journey builder；Tapcart 集成让品牌无需额外开发即可在数天内上线 push。

              底层数据基础设施可从 Attentive 的开源 GitHub 贡献中看到：实时流处理使用 Apache Flink，分布式消息 broker 使用 Apache Pulsar，列式分析存储使用
              ClickHouse，增量数据湖操作使用 Apache Hudi。attentive-mobile GitHub 组织 fork 并维护了 Flink-Pulsar connectors（81 个
              fork）、Flink-ClickHouse connectors（174 个 fork）和 Flink CDC connectors（2,225 个
              fork），反映实时数据管道的规模。该栈支撑实时人群分群、发送时间优化、行为旅程触发等低延迟操作。BFCM 2025 期间，平台处理了 5.7 billion 条消息，同比增长
              46%，整个假日高峰期零宕机，证明其已具备有意义的运营规模。
