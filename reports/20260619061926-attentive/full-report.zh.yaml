      - number: '4.3'
        title: 成本结构、毛利率代理与运营杠杆
        blocks:
          - type: paragraph
            body: >
              作为私营公司，Attentive 未披露任何毛利率、运营费用拆分、EBITDA 或现金流指标。所有利润率估算都必须来自公开同业 benchmark。最直接可比的上市同业是 Klaviyo（KVYO）和
              Braze（BRZE）。Klaviyo FY2025 毛利率为 74.67%（收入 $1.234B），Braze FY2026 毛利率为 67.15%（收入 $738M）。Attentive 毛利率估计在
              65–75% 区间；SMS 运营商转付成本（按 Twilio 公开费率，美国每条出站 long-code message 约 $0.0079，另加运营商附加费）使其相对纯 email 或 CRM 软件组合承压。

              Forbes 称截至 2026 年 3 月 Attentive 约有 5,000 名员工。若按每名员工 $150,000–$200,000 的平均全负荷成本估算，隐含年度薪酬和福利开支为
              $750M–$1B，符合美国 B2B SaaS 水平。若 ARR 为 $450–650M，这一估算意味着当前规模下总运营费用很可能远超毛利润，说明 Attentive
              可能处于实质净亏损状态（与其阶段和增长投入画像一致）。不过，Klaviyo 在 FY2025 实现 16.9% FCF margin，Braze 在 FY2026 实现
              8.4%，证明可比平台在规模化后可以产生正自由现金流。Attentive 连续四年（2021–2024）入选 Deloitte Technology Fast
              500，确认持续高收入增长，但不提供任何利润率信息。20+ 国家国际运营又把运营商成本差异、合规投入和 FX 敞口叠加到本已复杂的成本结构上。
