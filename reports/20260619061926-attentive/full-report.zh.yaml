      - number: '8.4'
        title: 投资论点、反论点与融资悬顶
        blocks:
          - type: paragraph
            body: >
              投资论点有四根支柱：（1）AI 带动平台扩张，提高单品牌钱包份额，降低单一渠道商品化风险；（2）多产品渗透已被验证（截至 2026 年 5 月，50%+
              客户使用多个产品），带来定价权和切换成本护城河；（3）专有移动身份和 Two-Tap 订阅注册形成强网络效应，竞争对手若没有既有订阅者密度，很难复制；（4）营销自动化品类已有清晰退出路径，Klaviyo 2023
              年 9 月 NYSE 上市、Braze 2021 年 11 月 NASDAQ 上市均可作证。

              反论点同样清晰：（1）估值标记是 2021 年遗留产物，自 2021 年 6 月以来没有 primary 市场验证，形成 5 年 mark-to-market
              缺口，投资者需要流动性时会暴露；（2）公开可比公司较高点压缩 60–80%，而 Attentive 隐含倍数已较 Klaviyo 有 4–5x 溢价，同时规模更小、财务更不透明；（3）Series E
              优先股东（Bain Capital Ventures、Coatue、D1 Capital Partners、Tiger Global、Base10 Partners、IVP、Sequoia）估计持有 $866M+
              清算优先权，退出 proceeds 必须先全额满足优先股，普通股才能参与，形成内嵌悬顶；（4）Growjo 估计过去一年员工数下降
              11%，暗示公司可能在运营重组或为效率裁员，这更可能反映利润率压力，而不只是经营杠杆释放。
            claimRefs:
