          - type: callout
            title: 定价不透明与运营商费用惊喜推高中端市场流失风险
            body: >-
              2026 年多条 G2 评论记录显示，由于运营商费用单独计费，Attentive 的全包成本持续高于合同报价。这一透明度问题可以被直接利用——Omnisend 和 Klaviyo 会提前显示运营商成本——并给可比
              SMB 工具买家一个具体转投理由，使其在 Attentive 更强的 AI 和集成价值复利前就离开。必须预约 demo 的入口门槛，也切断了 Klaviyo 免费层可以利用的自然自助获客漏斗。
