      - number: '5.3'
        title: 集成、开发者 API 与平台锁定
        blocks:
          - type: paragraph
            body: >
              Attentive 提供 100+ 个预置集成，覆盖 ecommerce、CRM、loyalty、CDP 和 advertising 等类别。关键一线伙伴包括 Shopify（原生 app 于 2020 年 7
              月上线，在 Shopify App Store 获 113 条评论、评分 4.7/5）、Salesforce Marketing
              Cloud（双向联系人同步）、Snowflake（用于个性化的订阅者档案和历史数据同步）、Google Ads（一方订阅者受众导出用于 retargeting）、AfterShip（发货触发 journeys，为
              Brighton 产生 $4M）以及 Yotpo（把 loyalty 数据延伸进 SMS）。按公司发布的基准，73% 客户认为 Attentive 的集成优于前一供应商。

              开发者 API 由 REST endpoints 构成，通过 HTTPS 返回 JSON，并用 OAuth 2.0 授权自定义 app。API 支持订阅管理、事件触发、属性保存和个性化消息发送。Webhook
              subscriptions 向注册 endpoints 投递实时事件 payloads（例如 subscribe/unsubscribe 事件）。Attentive 提供 iOS（Swift、CocoaPods
              / SPM、v2.0.15，兼容 Xcode 26.1.1+）、Android（Kotlin、Maven Central，要求 API 26+）和 React Native（npm package
              @attentive-mobile/attentive-react-native-sdk，RN 0.74+）SDK，每个 SDK 都提供身份收集、事件跟踪、创意渲染和 push notification 投递。

              锁定由四个机制加强。第一，Attentive Tag 把行为数据采集嵌入品牌网站，积累无法迁移给竞争对手的专有订阅者信号历史。第二，AI models（AI Journeys、AI
              Pro）不断从品牌特定消息表现数据中改进，形成随时间加深的品牌特定训练语料。第三，Two-Tap 专利组合阻止竞争者合法复制核心注册流程。第四，自定义优惠码生成（Shopify dynamic
              coupons，每次发送最多一百万个唯一代码并自动补充）和预置 journey 逻辑，在运营工作流中制造切换成本。Snowflake 集成让平台成为品牌既有数据仓库架构中的一个节点，进一步提高切换摩擦。路线图表
              TE005 映射了与集成深度相关的已规划和已上线版本。
