      - number: '1.5'
        title: 里程碑、合作伙伴与负面事件
        blocks:
          - type: paragraph
            body: >
              Attentive 的轨迹可分为四个阶段：隐身和早期增长（2016–2019）、资本加速和规模化（2020–2021）、国际扩张和产品多元化（2022–2024），以及 agentic AI
              再定位（2025–2026）。关键产品里程碑包括推出 Email 和 AI 产品（与 Sydney、San Francisco 办公室同步）、推出 AI Journeys 和 AI Pro 并伴随 $500M
              ARR 里程碑，以及 2025 年向 1,000+ email 客户推出 AI Pro for Email。2026 年 1 月，Attentive 扩展其专利 Two-Tap
              订阅注册技术，并新增全渠道可见性和合规解决方案。2026 年 5 月，Attentive 推出用于 RCS 可达性的 Visibility AI，并在 Thread 2026 大会上发布下一代 agentic
              AI 营销能力。

              值得注意的合作包括：2025 年 12 月与 Mindbody 建立商业合作，把企业级 AI 营销带入 wellness 行业；以及 2025 年 4 月推出双向 Snowflake Marketplace
              数据集成。Attentive 还长期集成 Google 的 RCS Business Messaging 平台。

              负面方面，CourtListener 记录了多起涉及 Attentive Mobile Inc. 的活跃法律程序：AMRS Creditors Trust v. Attentive Mobile
              Inc.（Bankr. D. Del., case no. 25-51963，2025 年 8 月提交）、Brash, solely as Creditor Trustee v. Attentive
              Mobile, Inc.（Bankr. N.D. Ill., case no. 26-00162，2026 年 2 月提交），以及 Attentive Mobile Inc. v. 317 Labs,
              Inc.（D. Del., case no. 1:22-cv-01163，2022 年 9 月提交）。317 Labs 案涉及多名具名律师，至少到 2023 年初仍有活跃案件活动。破产相关程序暗示
              Attentive 对客户或供应商破产事项仍有持续义务。G2 用户评论摘要指出，订阅者列表增长后成本可能上升，显示 SMB 客户对定价结构存在担忧。创始人 Brian Long 向 Amit Jhawar
              的领导权交接构成重要组织扰动，交接后阶段又与裁员重组重合。
