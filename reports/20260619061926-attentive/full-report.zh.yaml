              Apple 的 iOS 26「unknown sender」文件夹把营销消息降级到较不显眼的 inbox；按 Attentive 自有数据，CTR 和转化下降 30-40%。Attentive
              的缓解方案——Visibility AI 和 inbox 监控工具——是反应式的，并依赖 Apple 未来政策选择。若 Apple 进一步收紧过滤，或要求营销 RCS 取得明确用户同意，平台触达可能下降，而且没有
              Attentive 可控的修复手段。该风险在 RCS 上进一步叠加，因为 Attentive 的整个 RCS 策略依赖 iOS 26 支持 Apple-native RCS rendering。
