  - id: FU001
    title: 客户旅程图——Attentive 订阅者生命周期
    type: journey-map
    layout: wide
    summary: |
      展示品牌如何在 SMS、电子邮件、RCS 和推送中吸引、转化并扩展订阅者，并在每个阶段加入 VIP 分群和 AI 个性化。
    data:
      nodes:
        - id: brand-marketer
          label: 品牌营销人员（Attentive 客户）
          description: 拥有活跃营销团队的零售、DTC、美妆、健康或服饰品牌
        - id: anonymous-visitor
          label: 匿名网站 / App 访客
          description: 消费者通过自然、付费或社交渠道到达；Attentive Tag 开始追踪
        - id: discovery-sign-up
          label: 发现与注册阶段
          description: |
            弹窗、浮窗、二维码（桌面或移动端）；Two-Tap 降低摩擦；Monsoon 报告新订阅者 opt-in 增加 15%
        - id: sms-subscriber
          label: SMS 订阅者
          description: 通过 Two-Tap 或二维码注册完成转化；进入欢迎旅程；opt-in 符合 TCPA
        - id: welcome-journey
          label: 欢迎旅程
          description: |
            自动化多消息欢迎序列；AI 优化发送时机和文案；Tushbaby：Welcome Journey 带来 900x ROI 和 132% 转化提升
        - id: preference-collection
          label: 偏好收集
          description: |
            注册前后捕捉行为偏好，用于个性化后续消息；减少因不相关内容导致的流失
        - id: email-subscriber
          label: 电子邮件订阅者
          description: 单独选择接收电子邮件；收到 AI Pro 个性化的生命周期消息
        - id: campaign-cadence
          label: 活动节奏
          description: |
            通过 SMS、电子邮件和（试点）RCS 定期促销；Cyber Week 2025：发送 5.7B 条消息，零停机
        - id: omnichannel-subscriber
          label: 全渠道订阅者（SMS + 电子邮件）
          description: |
            价值最高的分群；接收协调的跨渠道活动；使用全渠道的品牌订阅者增长 37%；超过 50% 的客户使用多个产品
        - id: ai-journey
          label: AI 旅程优化
          description: |
            AI Pro 动态调整发送时机、受众和文案；在 BFCM 2025，使用 AI 的品牌增长速度是非 AI 品牌的 2x
        - id: vip-segment
          label: VIP 与限时闪购计划
          description: |
            SMS 优先的独家提前访问、限时折扣码、忠诚度触发；Tushbaby：整体旅程 CTR 为 13%，SMS 旅程转化率为 32%
        - id: at-risk-subscriber
          label: 高流失风险订阅者
          description: 互动下滑；收到重新激活或赢回序列
        - id: win-back
          label: 赢回与重新激活
          description: |
            对沉睡订阅者自动重新激活；Spanx 未互动分群通过 RCS 实现 CTR +236%、每次发送收入 +201%
        - id: churned-unsubscribe
          label: 已退订订阅者
          description: |
            已 opt out（43% 将消息疲劳列为原因）；除非通过新注册重新获取，否则代表永久名单损失
    approximationNotes: |
      旅程阶段综合自 Attentive 案例研究、产品文档和新闻稿。引用的互动指标来自具体客户案例，不是平台整体平均值。「流失」节点代表永久名单损失；Attentive 不公布汇总退订率。
