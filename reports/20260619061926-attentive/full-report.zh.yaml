      - number: '3.4'
        title: 图表与材料
        blocks:
          - type: callout
            title: WhatsApp 与地理覆盖缺口正成为企业级负担
            body: >-
              Attentive 缺席 WhatsApp，且 SMS 覆盖仅限 20+ 国家（相比 Braze 的全球覆盖或 Omnisend 的 worldwide reach），这是最难快速补上的结构性竞争缺口。Braze
              和 Insider One 以 WhatsApp 切入并赢得全球企业品牌 RFP 时，Attentive 以 North America/Europe/APAC SMS
              为主的姿态，会越来越多地被排除在多区域整合交易之外；随着全球品牌寻求单一全渠道留存平台，这类交易会增加。仅靠 AI 差异化无法弥合这一缺口。
            calloutType: risk
            claimRefs:
