        - Klaviyo/Postscript 在不侵犯专利的情况下复制名单增长 UX
        - 中
        - 专利提供法律保护；竞争对手提供类似注册表单
        - 核查执法历史；评估 Two-Tap 相比现代基于表单的替代方案是否带来可衡量提升
