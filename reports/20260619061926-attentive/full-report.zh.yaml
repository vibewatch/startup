      - number: '6.2'
        title: 采用轨迹与平台使用规模
        blocks:
          - type: paragraph
            body: >
              Attentive 的平台使用指标显示 engagement 正在加速。公司报告，截至 2025 年 9 月的一年客户收入达 $29B，较上一周期增长 48%；仅 2026 年 Q1，品牌就带来超过
              $6B。Cyber Week 2025 期间，Attentive 通过 SMS、email 和 push 支撑了近 $2B 收入，发送 5.7 billion 条消息（同比增长
              46%），整个购物高峰窗口平台零宕机。2024 年，Attentive 客户合计发送超过 53 billion 条短信；这一规模同时反映订阅者基础广度，以及成熟账户的 campaign 频率提升。

              渠道层面指标进一步说明采用广度。Cyber Week 2025 期间，SMS 每品牌收入较 2024 年同期增长 42%，email 增长 29%。email 点击率同比上升 4.7%，退订率下降
              17%，表明安装基础内 relevance 改善、受众健康度更好。超过 50% 客户如今使用多款 Attentive 产品，说明平台的 land-and-expand 动作正在运转：从 SMS 起步的品牌正在采用
              email、RCS 和 push。使用 Attentive omnichannel 能力的品牌订阅者增长 37%；92% 将 email 迁移到 Attentive 的品牌报告 deliverability
              改善。Cyber Week 2025 期间，使用 AI 功能的品牌增速是非 AI 用户的 2x，强化了 Attentive 的 AI 差异化：AI 正在推动更深的客户 engagement 和更高收入。

              聚合表现层面，Attentive 声称 SMS 打开率 90%、平均点击率 30%、平均 program ROI 25x+，且 97% 的 SMS 消息在送达后 15
              分钟内被阅读。这些基准由公司发布，指向聚合客户平均值，不是结果保证。Shopify（4.7/5，113 条评论）和 G2（评分最高的 customer success
              team）的独立评论证据佐证了高层次满意度，但细分 cohort 留存和 NRR 数据没有公开披露。
