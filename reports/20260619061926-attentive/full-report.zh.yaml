      - number: '8.5'
        title: 终止触发、论点破裂标准与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              六项终止标准定义继续研究立场何时应转为避免或持有。最直接的是确认出现低于 $7B 标记的 down-round，这会固化优先权悬顶，并释放投资者信心丧失的信号。第二，资金充足的竞争对手（Klaviyo 持有
              $1.1B 现金、Braze 持有 $216M 现金）以显著更低的每订阅者或每品牌价格发起 primary offering，迫使 Attentive 进入价格战。第三，TCPA、CAN-SPAM 或 GDPR
              出现大规模监管执法；考虑到 Attentive 对运营商的依赖，此类行动可能扰动核心 SMS 收入，并带来无上限责任。第四，CEO 变更动摇机构关系（公司约在 2023–2024 年由创始人 Brian Long
              领导转为 Amit Jhawar 领导）；两年内第二次领导层变动将是重大尽调红旗。第五，经确认的 ARR 同比增长降至 20% 以下，将指向市场饱和，削弱任何溢价倍数的理由。第六，未披露融资事件（新轮或
              secondary）估值低于 $5B，将迫使立即开展 down-round 分析。

              要把继续研究转成买入或跟踪评级，尽调路径需要补齐：最近财年的经审计收入和毛利率；品牌 cohort 层面的 NRR；当前员工数和成本结构相对 ARR 的确认；带优先权堆栈细节的 cap table；以及 IPO
              S-1 或以市场出清价完成的 secondary 交易。在这些缺口关闭前，无法建立有 conviction 的价格。
            claimRefs:
              - CV043
