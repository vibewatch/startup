        blocks:
          - type: paragraph
            body: >
              Attentive 的增长故事财务披露不透明，但运营层面可信：平台 GMV 同比增长 48%，各渠道每品牌收入扩张 29-42%，公司声称 ARR 突破
              $500M+，共同指向一个更耐久、仍在扩张的收入底盘。不过，私营公司披露框架不足以支撑严格承销。毛利率、运营费用、现金头寸和 NRR 均未披露；同时，公司 4.5
              年没有新的股权融资，并卷入破产法院债权人纠纷中的活跃法律程序。这组因素把尽调门槛抬高到仅靠公开资料无法满足。

              CourtListener 数据库记录，自 2024 年 1 月以来，Attentive Mobile 作为当事方出现于 59 起案件，其中包括两起破产法院债权人信托程序（AMRS Creditors Trust
              v. Attentive Mobile，Bankr. D. Del.，2025 年 8 月；Brash v. Attentive Mobile，Bankr. N.D. Ill.，2026 年 2 月）以及一起
              S.D.N.Y. 杂项案件（2026 年 2 月）。这些程序表明，Attentive 需要管理与客户或供应商破产相关的合同补救风险和或有付款义务，可能形成未披露的财务负债。G2
              评论分析显示，订阅者列表扩大后成本上升是反复出现的负面主题（Shopify App Store 平均 4.5/5，1 星占 8%），这给 SMB
              客户带来定价摩擦，也可能推动流失。要建立可信的财务模型，尽调路径必须拿到管理账、经审计收入和利润率数据、最新资产负债表，以及分 cohort 的 NRR 披露。
