      - number: '7.3'
        title: 运营商、平台与技术依赖风险
        blocks:
          - type: paragraph
            body: >
              Attentive 的收入模型高度依赖三类不中断且符合政策的访问：AT&T、Verizon 和 T-Mobile 支撑美国 SMS 和 RCS 投递，Google Jibe 作为 RCS 基础设施层，Apple
              的 iOS 设备生态负责消息呈现。这三个 chokepoints 中任意一个都能在未获 Attentive 同意的情况下，单方面改变 SMS/RCS marketing
              的经济模型。运营商在基础消息成本之外收取每条消息附加费——Twilio 公布的 long-code outbound rate 约 $0.0079 per segment，可作为基准；Attentive
              实际运营商成本结构没有公开披露。运营商 throughput quotas、内容过滤政策和 short-code 分配规则都曾在无提前通知的情况下变化，给所有品牌同时制造投递中断。

              最直接的近期风险是 Apple 在 2026 年 6 月 WWDC 发布的 iOS 26。iOS 26 在原生 Messages app 中引入更强的 AI-powered message
              filtering，可自动把营销短信路由到可见性更低的类别，降低 iOS 用户打开率；iOS 用户约占美国智能手机市场的 55%。Attentive 于 2026 年 5 月推出 Visibility
              AI，试图通过识别哪些 inbox 可能收到 RCS delivery 并相应路由消息来回应该威胁，但截至分析日期，第三方评估尚未确认该技术对 iOS 26 过滤的有效性。

              RCS 带来新一层平台风险。Attentive 的 RCS 部署依赖 Google Jibe platform，也依赖美国运营商采用 GSMA Universal Profile。AT&T、Verizon 和
              T-Mobile 均已启用 RCS，但全球 RCS 互操作仍碎片化：国际品牌面对异质运营商支持，且没有一致的 fallback-to-SMS 标准。Apple 在 iOS 17+ 中采用 RCS 扩大了触达，但
              Apple 控制呈现体验，并可在未来 iOS 版本中继续调整过滤行为。Shopify 原生消息产品（服务 500k+ 商家并提供平台内 email）构成嵌入平台的替代方案，可能降低品牌选择第三方 SMS
              vendors 的比例。这些平台风险是结构性的；若不分散商业设计上由运营商独占的基础设施依赖，很难完全缓解。
