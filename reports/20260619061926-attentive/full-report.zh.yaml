      - number: '8.3'
        title: 牛 / 基准 / 熊情景分析
        blocks:
          - type: paragraph
            body: >
              三个估值情景构成投资决策框架。熊情景假设 ARR 位于估算区间低端（$450M）、增长再加速有限，且公开市场给私募估值设定天花板，ARR 倍数压缩至 3–5x。对应公允价值区间为 $1.35–2.25B，较当前
              $6.9–7.0B 标记折价 75–80%。熊情景触发因素是被迫 down-round 融资，或 IPO 以市场出清价定价且明显背离 2021 年价格；任一情况都会触发清算优先权机制，使资金从普通股转向优先股。

              基准情景假设 ARR 为 $550M（估算区间中点）、年化增长 30–35%，并给予 5–6x ARR 的适度增长溢价。公允价值区间为 $2.75–3.3B，仍低于当前标记 53–60%。牛情景给予 $650M
              ARR，AI 变现（AI Pro for Email、AI Journeys、RCS premium）支撑 40%+ 增长轨迹，多产品渗透率超过 60%，并给予 8–10x 的溢价倍数，反映以 5–6x 远期
              NTM 收入估值成功 IPO。即便这一乐观情景也只得到 $5.2–6.5B——区间覆盖但无法明确支撑当前 $6.9–7.0B 标记。基于现有证据，概率分布偏熊到基准：没有经审计财务、行业整体压缩、五年未融资。用
              Q1 2026 GMV $6B+ 年化对照此前期间，提供了温和向上支撑，但 GMV 归因不是 Attentive 自身收入。
