      - number: '3.3'
        title: 转换成本、护城河耐久度与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              Attentive 最耐久的护城河，是订阅者列表和集成深度。离开 Attentive 需要迁移 SMS 订阅者列表（连同 opt-in 合规记录）、重建 journey automations、重新配置 100+
              集成，并让营销团队重新学习新界面。G2 评论确认，73% 客户给 Attentive 集成生态的评分高于此前供应商，构成经验证的转换摩擦。Two-Tap 订阅者获取专利，则为试图一比一复制 Attentive
              专有 list-growth 机制的竞争者设置法律和技术门槛。

              尽管有这些优势，已记录的负面证据显示 churn 压力不小。2026 年发布的 G2
              用户评论突出两类反复抱怨：（1）运营商费用几乎使报价合同费率翻倍——定价透明度失灵，会在成本敏感中端市场触发买家后悔；（2）email builder 受限，包括 drag-and-drop
              功能有限、模板库小，以及错误需要 Attentive White Glove 团队处理而非自助修复。第二项尤其伤，因为 Attentive 已把 email 与 SMS 并列为同等渠道，但其 email
              builder UX 落后于 Klaviyo；后者在 G2 评论中持续因直观 flow building 和清晰 revenue attribution 获赞。

              Multi-homing 风险中等：Attentive 面对的竞品提供透明、低价自助选项（Omnisend、Klaviyo free tier），部分品牌也会保留分开的 SMS 和 email
              工具，而不是整合到单一平台。缺少 WhatsApp 正成为日益扩大的缺口，因为全球品牌把 WhatsApp 列为北美以外的主要移动互动渠道。Attentive 20+ 国家 SMS 覆盖，相比 Braze
              的全球覆盖或 Omnisend 的 worldwide reach，会限制与国际企业潜客的扩张讨论；随着全球电商品牌增长，这一地理约束会持续放大。

              如果 RCS 采用放量，Attentive 2026 年 5 月由 Visibility AI 启动的 RCS 机会可能增强护城河耐久度，创造 SMS-only 或迟到 RCS
              竞争者无法提供的更丰富品牌体验。不过，RCS 送达仍依赖运营商和设备；没有普遍 iPhone 和运营商支持前，其短期转换成本贡献仍属推测。

              来自下方的商品化压力真实存在：Klaviyo 免费层和 Omnisend 透明定价，为中端品牌愿意为无差异 SMS/email 自动化支付的价格设置隐性上限。Attentive 必须不断用更强 AI 个性化
              ROI、white-glove 服务和集成深度证明企业级溢价，否则会被低成本替代方案替换。
