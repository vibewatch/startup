      - number: '8.2'
        title: 估值背景、倍数压缩与可比公司分析
        blocks:
          - type: paragraph
            body: >
              Attentive 2021 年 9 月 Series E 估值 $10B，按 Sacra 当时 $125M ARR 估算隐含 55.2x 收入（按 CB Insights $250M 收入数字为
              80x），符合周期高点的 SaaS 定价：高增长平台可拿到 30–80x 远期收入。随后四年，私募市场修正把每个公开可比公司的价格都从高点下调 60–80%。截至 2026 年 6 月 18
              日收盘，Klaviyo 报 $13.27/股（市值 $3.97B），较 2023 年 9 月 IPO 价 $30/股下跌约 56%；Braze 报 $20.06/股（市值 $2.26B）；HubSpot 市值
              $9.02B。该同业组隐含 NTM 收入倍数约 2.5–3.0x，行业中位数约 2.8x。

              将这些公开市场倍数套用到 Attentive 估计 $450–650M ARR 区间，按同业中位数（3x）得到 $1.35–1.95B 的隐含公允价值，按 5x 的高增长溢价倍数得到
              $2.25–3.25B。即便采用最乐观的同业溢价估值 $4.5B（7x ARR 中点 $550M），仍低于当前 $6.9–7.0B 标记 35–37%。要走到当前标记，必须同时满足：（1）ARR 更接近
              $700–800M；（2）毛利率扩张强劲且确认 >72%；（3）行业重新定价至 9–10x NTM 收入——公开证据均未支持。Klaviyo 的 NRR 110%、FCF margin 16.9%
              展示了品类金标准；Attentive 未披露可比指标。
