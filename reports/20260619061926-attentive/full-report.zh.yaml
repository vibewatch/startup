            body: >
              Attentive 公开牵引信号很强，但口径多为平台 GMV 而非公司收入，也多是里程碑公告而非经审计财务。Sacra Research 估算 ARR 在 2021 年底约为 $125M、2022 年底约为
              $200M（同比增长 60%）。公司随后称 ARR 已突破 $500M，但未披露日期或精确数字。若从 Sacra 轨迹外推，并假设年增长率温和降至 35–45%，当前 ARR 约为 $450–650M，与
              $500M+ 里程碑口径和公司 Forbes Cloud 100 排名一致（2025 年第 20 位，连续第五年进入前 20）。

              最近最细颗粒度的指标是平台 GMV：截至 2025 年 9 月的一年里带动 $29B+ 品牌收入（同比增长 48%），仅 Cyber Week 2025 就带动约 $2B（其最强记录，发送 5.7B
              条消息，同比增长 46%）。Cyber Week 2025 期间，每品牌 SMS 收入增长 42%，email 增长 29%，说明现有客户净收入扩张强劲——隐含 NRR 信号高于 100%。按 8,000+
              品牌客户和估算 $500M+ ARR 里程碑，隐含每品牌平均 ARR 约 $62,500 / 年；不过这一估算对里程碑和客户数口径时间点都敏感。Cyber Week 2025 期间，email 点击率同比上升
