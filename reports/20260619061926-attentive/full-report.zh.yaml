      - number: '5.4'
        title: 信任、隐私、运营商约束与合规
        blocks:
          - type: paragraph
            body: >
              Attentive 将合规项目打造为其声称的竞争护城河，尤其是在诉讼密集的美国 SMS 市场。覆盖 2024 年 11 月 1 日至 2025 年 10 月 31 日的 SOC 2 Type II 审计，可通过
              security.attentive.com 的 SafeBase trust center 获取（2026 年 6 月发布）。2023 年 Mandiant 渗透测试覆盖该平台，摘要报告可按请求提供。GDPR
              和 CCPA/CPRA 合规记录在隐私政策和 DPA 中；跨大西洋数据传输引用 EU Data Privacy Framework。

              TCPA 合规工具包括：（1）获得专利的 Two-Tap 双重 opt-in，生成可验证的同意记录；（2）Litigator
              Defender，把订阅者列表与已知诉讼人数据库交叉比对，并自动屏蔽其号码；（3）Enhanced Audit Assistant，调出 opt-in/opt-out 历史日志以回应 TCPA
              demand；（4）Negative Sentiment Reminders，在触发完整退订前拦截订阅者表达的接近 opt-out 的话语。标准流程执行双重 opt-in，以增加同意验证。CTIA 合规由内部
              Carrier Relations Team 管理，团队直接与运营商合作，理解过滤政策并更新平台发送指南。

              州级静默时段自 2026 年 1 月起自动化，通过订阅者位置检测限制六个州（TX、FL、OK、MD、CT、WA）的发送。ADA guardrails 内置在 UI 中。加拿大订阅者列表支持 CASL 合规。

              当前最大的合规相邻风险是 iOS 26。Apple 强化消息过滤后，会把来自「unknown senders」的消息降级到次级 inbox；Attentive 自有数据显示，落入该文件夹的消息 CTR 和转化低
              30-40%。Attentive 用 2026 年 1 月的 iOS inbox visibility 工具集和 2026 年 5 月的 Visibility AI 回应，但未来 iOS
              版本进一步限制营销消息可见性的风险是结构性的，Attentive 无法完全控制。
