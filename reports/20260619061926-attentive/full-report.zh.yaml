      - number: '6.4'
        title: 留存、耐久性与客户满意度
        blocks:
          - type: paragraph
            body: >
              Attentive 未公开披露 net revenue retention（NRR）或 gross revenue retention（GRR）。公司 $500M ARR 里程碑（2024 年突破，2025 年
              1 月宣布）以及持续的同比每品牌收入增长（BFCM 2025 期间 SMS +42%、email +29%）意味着，在美元口径下账户扩张超过任何流失。50%+ 的多产品使用率表明，现有客户在加深而非缩窄
              engagement。Shopify App Store 评分（4.7/5，113 条评论，87% 五星）和 G2 评分最高的 customer success team
              区分，是最容易取得的第三方满意度代理指标；不过二者都反映了活跃且 engaged 用户的正向选择样本，而不是完整客户生命周期。

              切换成本信号有分量。迁移到 Attentive 的品牌要在平台内重建订阅者列表（TCPA 合规要求重新收集 opt-in），通过 Attentive Tag 集成自定义工作流，用品牌特定数据配置 AI Pro
              models，并接受专属 customer success team 的战略指导。这些投入形成实质退出摩擦。email 迁移客户报告的 92% deliverability 改善进一步说明，从 Attentive
              切回另一供应商，需要重新验证 sender reputation，并重建 deliverability infrastructure。

              负面信号存在，但大多与定价有关，而非产品质量失败。Shopify 上 8% 的一星率（113 条评论中约 9 条）反映的是边缘案例——通常是合同纠纷、计费意外或 onboarding
              摩擦——不是系统性产品故障。Omnisend 的竞争分析指出，运营商费用可能让月度成本接近合同费率的两倍；email builder 也被部分客户认为相较 specialist platforms
              有限制。这些抱怨集中在较小或预算敏感品牌，而不是 Attentive 优化服务的 enterprise segment。BBB 搜索结果显示 A-
              评级，说明相对于业务规模，投诉量较小。本轮研究未发现监管执法行动或 FTC 投诉。
