      - number: '1.2'
        title: 领导层、治理与组织规模
        blocks:
          - type: paragraph
            body: >
              Attentive 由 Brian Culbertson Long 创立。自创立起，Long 至少到 2021 年 6 月仍担任 Chief Executive Officer；最近一份由他以 CEO 身份签署的
              SEC Form D 日期即为 2021 年 6 月。2021 年 6 月 Form D（Acc. No. 0001231919-21-000058）列 Long 为 CEO，并列出四名董事：Andrew
              Jones、Scott Friend、Patrick Grady 和 John Trani。Scott Friend 是 Bain Capital Ventures 的 Managing
              Director，Patrick Grady 是 Sequoia Capital 合伙人，反映主导机构股东位置。公开文件未确认 Long 卸任 CEO 的准确日期；但当前 Attentive 领导层页面列
              Amit Jhawar 为 Chief Executive Officer，未提及 Long。Forbes Cloud 100 2025 数据确认，截至 2026 年 3 月，Jhawar 是 CEO。

              组织规模已大幅扩大。公司 About 页面记录了跨过 1,000 名员工的里程碑；这一门槛在公司首个国际办公室（London）开设之前就已跨过。Forbes Cloud 100 档案截至 2026 年 3
              月更新，报告约 5,000 名员工，显示公司较 About 页面提及的 1,000 人里程碑已有显著增长。Attentive 在全球运营四个办公室：New York City、San
              Francisco、London 和 Sydney。Brian Malkerson 也出现在 Attentive 领导层页面上，但公开可得的文本模式摘录未确认具体头衔。CEO 从 Brian Long 交接给
              Amit Jhawar，是一项重要领导层变化；在 Jhawar 推动 agentic AI 战略转向的下一增长阶段，关键人风险需要纳入判断。
