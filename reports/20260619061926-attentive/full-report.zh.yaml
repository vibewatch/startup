  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Attentive 所处的电商营销自动化市场规模大且竞争加剧，竞争者横跨公开公司既有玩家、资金充足的私营公司和专门化点状方案。主要竞争集合包含八家直接同业，它们与 Attentive
              共享目标客户：寻求大规模自有渠道（SMS、email、RCS、push）留存营销的中大型电商和零售品牌。

              最强的两家直接竞争对手是 Klaviyo（KVYO）和 Braze（BRZE）。两者均已上市，在已披露收入上显著领先 Attentive。Klaviyo 报告 FY2025 收入 $1.234B（同比增长
              31.6%），服务 100 个国家的 196,000+ 品牌，并已将定位从「email and SMS platform」转向「autonomous B2C CRM」——直接挑战 Attentive
              的全渠道野心。Braze 报告 FY2026（截至 2026 年 1 月的财年）收入 $738.18M（同比增长 24.4%），差异化在渠道广度：除 SMS、email、RCS 和 push 外，还覆盖
              WhatsApp、LINE 和 KakaoTalk，这些渠道 Attentive 不支持。

              私营层包括 Iterable（企业生命周期营销，2021 年 $200M Series E，约 ~$2B 估值）、Postscript（Shopify 专属 SMS，带 AI 测试，无
              email）、Omnisend（电商 email+SMS+web push，定价透明，全球 SMS 触达）、Insider One（全球全渠道，WhatsApp 能力强，并获 Gartner 2026
              Leader 认可）和 Wunderkind（带托管服务交付的 performance-marketing identity resolution）。每家公司都占据不同定位小生态，形成分层但部分重叠的竞争格局。

              两类现状替代方案仍然重要：（1）使用 Twilio 等 API 层平台内部自建（150+ 国家、$0 per-message margin，但需要专门工程团队）；（2）独立 ESP，如 Mailchimp
              或仅使用 Klaviyo email，再通过第三方工具外挂 SMS。两种选择都会压缩 list-growth 工具差异化，并让拥有工程资源的大品牌重新提出自建还是购买的问题。

              未来潜在进入者包括 Salesforce Marketing Cloud 和 HubSpot，它们正投入 SMS 和 AI-automation 层。Meta 和 Google 也可能利用广告 ID
              图谱原生构建自有渠道功能，构成更长期替代风险。
