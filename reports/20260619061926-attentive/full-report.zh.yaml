      - number: '2.2'
        title: 市场规模：TAM、SAM 与公开可比公司
        blocks:
          - type: paragraph
            body: >-
              电商营销自动化市场没有单一权威口径，因此本章从多个视角拼出估算。最宽口径是营销技术总支出；Forrester 预计到 2024 年底全球约 $148B，覆盖从 CRM 到分析的所有软件类别。在其中，面向电商品牌的
              email 和 SMS 自动化是更窄的子市场。若用公开可比公司收入作为规模代理：Klaviyo（FY2024 收入 $937.5M，主要服务 167,000+ 电商客户）和 Braze（FY2025 收入
              $593.4M，服务跨行业 2,296 家企业客户）合计年化收入接近 $1.5B，但只覆盖有组织、平台化的市场部分。再纳入 Iterable、Omnisend、Postscript、Yotpo
              等重要玩家，北美结构化电商营销自动化软件市场估计为每年 $5–8B。

              以美国电商收入为基底的自下而上视角，也支持这一估算。2025 年美国电商规模达到 $1.234T（Digital Commerce 360 / US Census Bureau 数据）。若电商品牌通常将收入的
              7–10% 投入营销，其中约 15–25% 落到自有渠道（email 和 SMS），仅美国电商品牌每年自有渠道营销软件支出就约为
              $13–31B——但这一数字显著高估可服务的软件平台市场，因为大部分支出流向媒体（广告）而非 SaaS 工具。更收紧后，美国电商营销自动化软件 TAM 约为 $8–15B，包括 email、SMS、CDP
              和相关工具。Attentive 当前 ARR 约 $500M+，按边界定义不同，约对应 3–6% 市场份额。

              规模判断的置信度受三点限制：缺少面向该具体细分市场的一手分析师 TAM；各供应商市场定义冲突；以及 Klaviyo 和 Braze 大多数客户并非纯电商。
