        - 订阅费随订阅用户名单规模和 / 或出站消息量扩大
        - 未公布；按交易设计；内含运营商成本转嫁
        - 核心产品；$500M+ ARR 里程碑；2024 年发送 >53B 条消息
        - 高质量经常性 SaaS；运营商成本压低毛利率（约 $0.008/msg 基准）
        - 确认 SMS ARR 的确切贡献，以及运营商 CoGS 占收入百分比
      - - 邮件平台
        - 选择邮件渠道时收取附加订阅费；可能与 SMS 打包形成「节省」
        - 未公布；可独立于 SMS 方案，也可与其打包
        - 截至 2025 年 6 月有 1,000+ 邮件客户；AI Pro for Email 于 2025 年 6 月推出
        - 若无运营商成本转嫁，毛利率高于 SMS；每个品牌带来增量 ARPU
        - 确认邮件 ARR、邮件与 SMS 收入拆分，以及邮件 NRR
      - - RCS（Rich Communication Services）
        - 渠道套装中的高端消息层级；可能按 session 或 rich send 计费
        - 未公布；面向 RCS 送达率的 Visibility AI 于 2026 年 5 月推出
        - 早期 beta / 商业化阶段；2026 年 5 月在 Thread 2026 大会上发布
        - 收入尚早；早期表现数据正面（FragranceNet RCS CTR +106%）
        - 确认 RCS 定价、客户数，以及是否单独计费
      - - 推送通知
        - 多渠道套装中包含的额外渠道，或作为单独附加项
        - 定价页显示打包在多渠道套餐内；未列独立费率
        - 开放 beta；已有 Tapcart 和 Google Ads 集成
        - 若打包销售，增量利润率低；若单独定价，则是 ARPU 升级机会
        - 确认推送变现方式和 attach rate
      - - AI 附加模块（AI Pro、AI Journeys）
        - 基础订阅之上的高端模块层级；可单独选择的功能集
        - 未公布；高端层级定价未披露
        - AI Pro for Email 于 2025 年 6 月面向 1,000+ 客户上线；AI Journeys for SMS 已上市
        - ARPU 扩张杠杆；公司宣称 journey 消息 ROI 达 515x
        - 确认 AI 模块 attach rate，以及相较基础方案的增量 ARPU 提升
      - - 战略支持服务
        - 企业层级提供专属 CSM、战略规划、入门实施、送达率服务
        - 与更高层级方案打包；24/5 支持作为平台功能包含在内
        - 包含在企业套餐中；若主要打包销售，会成为成本驱动因素
        - 若打包销售则是成本中心；若单独收费，可能形成专业服务收入
        - 确认支持服务是否单独计费，或计入 ARR
    notes: >
      所有定价信息均为估算，或来自 Attentive 定价页（披露结构但不披露费率）、Sacra Research 估计和公开同业基准。Attentive 没有可获得的经审计收入、收入组合或 GAAP 确认收入数据。SMS
