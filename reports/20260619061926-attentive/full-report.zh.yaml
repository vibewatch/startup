      - number: '5.5'
        title: 技术差异化、IP 与产品风险
        blocks:
          - type: paragraph
            body: >
              Attentive 的核心技术差异化靠 Two-Tap 专利组合、专有 AI 训练语料和企业合规栈支撑。Two-Tap 组合目前包括 10
              项已授权美国专利（11,170,380；11,416,897；11,416,887；11,553,074；11,676,155；11,935,068；12,120,259；12,149,652；12,248,941；12,626,263），另有专利待批。该组合已被积极执行：2024
              年 12 月，Attentive 与 Emotive 就专利侵权诉讼达成和解，获得一笔金钱付款，并取得 Emotive 停止使用 Two-Tap 及相关技术的协议。Forrester Consulting
              研究发现，使用 Two-Tap 工具可带来最高 25% 的年度 SMS 订阅者增长，对应 $4.5-$11.8 million 的额外收入。TeePublic/Redbubble 报告 opt-in
              率约为此前供应商的 2x。

              AI 训练语料是一种随时间复利的数据网络优势：AI engine 处理来自 110+ billion 条消息、横跨 70+ 个行业的数万亿个数据点，AI Journeys 在 90 billion
              条消息上训练。每个品牌的部署都会增加模型对行业特定消费者行为的理解，带来边际改进；没有类似数据规模的新进入者很难复制。

              关键产品风险包括：（1）iOS 生态风险——Apple 控制数亿台设备上的 inbox 呈现，并已显示出降低营销消息优先级的意愿；Attentive 的缓解方案（Visibility
              AI）是反应式而非结构性；（2）RCS 采用速度——Attentive 的 RCS 投入（Google Jibe 伙伴关系、Visibility AI）假设 RCS 快速渗透，但企业采用时间线不确定，运营商
              rollout 也以美国为中心；（3）AI model 商品化——随着 LLM 驱动内容生成变成商品功能，AI Pro 的 Brand Voice AI 相比 Klaviyo 和 Braze 自有 AI
              工具可能失去差异化；（4）封闭 email builder——G2 评论者指出缺少开放 HTML email editor，是成熟品牌的摩擦点；（5）legacy API 技术债——Attentive
              维护一个需要不同 tokens 的 legacy API tier，形成迁移摩擦，可能拖慢企业升级；（6）SMS throughput 和 RCS 投递依赖运营商，限制了每条消息经济模型上的定价权。
