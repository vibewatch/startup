      - number: '7.2'
        title: 法律程序与诉讼暴露
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Attentive 的法律 docket 反映三类诉讼：TCPA 共同被告事项、竞争/IP 纠纷，以及第三方破产案件中的对抗程序。最受关注的活跃诉讼，是 Attentive 与
              Stodge Inc. d/b/a Postscript（D. Del. 2023）之间的专利和商业秘密纠纷，双方都在推进 aggressive discovery；Postscript 于 2024 年 12
              月提交动议，要求按 Daubert 排除 Attentive 的 TCPA expert。另一起 Attentive v. 317 Labs, Inc. d/b/a Emotive（D. Del. 2022）是
              Attentive 针对直接 SMS 竞争对手提起的专利侵权诉讼。该案已进行大量事实 discovery，Attentive 到 2024 年中已送达多组 interrogatories 和 admission
              requests。

              两起破产案件中的对抗程序直接将 Attentive 列为被告。AMRS Creditors Trust v. Attentive Mobile Inc.（Bankr. D. Del. 2025，案号
              25-51963，2025 年 8 月 8 日提交）和 Brash, solely as Creditor Trustee v. Attentive Mobile, Inc.（Bankr. N.D. Ill.
              2026，案号 26-00162，2026 年 2 月 1 日提交）均代表破产财产向 Attentive 追索——很可能是 preference actions，或来自后来破产、且使用 Attentive
              平台的零售商的未付服务费主张。公开 docket 无法量化合计金额，但多起破产对抗程序表明 Attentive 客户基础中有一部分财务承压，形成回款风险。Nutracap Holdings 破产案（N.D.
              Ga. 2025）将 Attentive Mobile 列为 $11,150 的无担保债权人，确认了这一反复出现的模式。

              整体看，Attentive 的诉讼姿态符合一家既主动执行 IP、又经常作为第三方卷入下游品牌 TCPA 纠纷的公司。单一诉讼看起来都不构成生存威胁，但合计法律负担——discovery
              obligations、抗辩成本和管理层分心——是实质运营成本，却没有出现在任何公开财务披露中。CourtListener 记录了 2022 年 1 月后涉及 Attentive Mobile 的 107
              起案件，这一数量与高吞吐量 SMS 平台运营商规模化后的状态一致。
