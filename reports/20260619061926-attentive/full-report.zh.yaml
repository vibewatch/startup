  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与垂直行业组合
        blocks:
          - type: paragraph
            body: >
              Attentive 声称拥有 8,000+ 个品牌客户——这一数字在新闻稿、SEC 佐证的申报语境和 Shopify App Store 中均被持续引用——覆盖 70+ 个行业。平台主要扎根于 retail 和
              e-commerce；其中直接面向消费者（DTC）的服饰、美妆、家居用品和消费电子品牌，是最大的垂直客户群。第二层垂直行业包括食品饮料、旅行酒店、娱乐、媒体、教育和非营利组织。2025 年末，Attentive
              通过与 Mindbody 的战略商业合作进入 fitness and wellness 垂直行业，让数千个 Mindbody Ultimate 和 Ultimate+ 订阅者可嵌入使用 Attentive 的
              SMS 和 email 工具。

              按市场层级看，Attentive 的核心客群是中端市场（$50M–$500M revenue）的 retail 和 DTC 品牌，但标杆客户名单明显偏 enterprise：GUESS、Urban
              Outfitters、Steve Madden、Crate & Barrel、Carter's、Lands' End、Dyson、Brooks Brothers、L'Occitane 和 Giorgio
              Armani 均公开具名。平台的定制报价和强制销售资格筛选，旨在筛出营销预算充足、订阅者列表规模足以支撑 enterprise contracts 的品牌。较小 SMB 主要通过渠道伙伴（Mindbody）或
              agency 关系触达，而不是通过 self-serve tier。

              地理上，Attentive 在 20+ 个国家运营，但覆盖主要集中在美国、加拿大、英国和 Australia/New Zealand。北美和欧洲以外的 SMS 能力，相比 Omnisend 或
              Twilio（150+ 个国家）等全球竞争者仍有限。这限制了需要一致全球覆盖的跨国企业品牌增长。渠道分布正在演进：SMS 是创始渠道，仍是主要收入驱动；但 email 在 2025 年突破 1,000
              客户，RCS 和 push notifications 截至 2026 年正在客户 rollout。
