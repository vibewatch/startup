      - number: '2.3'
        title: 买家分层与垂直行业
        blocks:
          - type: paragraph
            body: >-
              电商营销自动化平台的主要买家，是电商营销和留存团队；角色包括 VP/Director of Marketing、VP of Retention、Email/SMS Marketing
              Manager，以及越来越常见的 AI Marketing Specialist。预算归属营销领导层（CMO、CGO），来自营销运营预算，而非 IT 或工程预算。IT
              和安全团队会因数据合规与集成要求影响采购，但只是次要决策者。

              Attentive 服务 70+ 垂直行业，核心包括零售、服饰、美妆、健康与 wellness、家居用品和 DTC 品牌。这些垂直领域画像相似：订阅者列表大、购买频次高、季节性集中（尤其是 Q4
              holiday），并高度依赖 email 和 SMS 推动复购、挽回弃购。Klaviyo 的 167,000+ 客户群主要是 SMB 和中端电商，Braze 的 2,296 名客户则更偏企业级；Attentive
              夹在两者之间，目标是中端到企业级电商品牌。

              采用路径通常从仅 email 工具（Mailchimp、Constant Contact）开始，再把 SMS 作为第二渠道加入；当列表规模和消息量足以支撑平台订阅成本后，再整合到全渠道平台。AI
              驱动个性化工具通常最后采用，多作为企业级 upsell。Attentive 的定价是模块化的，按发送消息量、订阅者列表规模、渠道数量和 AI
              工具访问计费；因此较小列表也能进入，并随品牌增长自然扩张。移动电商顺风明显：2025 年 holiday 线上交易中，56.4% 发生在移动设备上，验证了移动优先订阅者互动模式。
