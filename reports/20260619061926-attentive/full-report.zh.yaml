      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              Klaviyo 的 CRM 转向，是这一格局中最具战略意义的竞争变化。平台现已把 email、SMS、RCS、WhatsApp 和 mobile push 纳入同一个统一数据模型，并提供免费层（最高 250 个
              profiles、500 封 emails/月、150 个 SMS credits），降低小品牌进入门槛，也创造出 Attentive 销售主导模式缺失的 land-and-expand 动作。Klaviyo
              FY2025 毛利率为 74.6%，显示产品杠杆强；FCF 则在 FY2024 转正至 $208.5M，FY2025 达 $219.5M。平台把「Marketing Agent」和「Customer
              Agent」定位为 AI 驱动自主 campaign 工具，呼应 Attentive 的 agentic AI 定位，但渠道触达更广、定价更透明。

              Braze 服务需要全球规模多渠道编排的企业和中端客户。其渠道阵容在 SMS/email/push/RCS 组合之外加入 WhatsApp、LINE 和 KakaoTalk，在直接电商集合中无人能及。Braze
              FY2026 毛利率为 66.5%，低于 Klaviyo，反映其更重的专业服务和工程支持成本结构。Intelligence Suite（AI 渠道 / 时机选择）和内置 AI agents（Operator）与
              Attentive 的 AI Journeys 存在功能重叠；但 Braze 的 developer-first 取向（SDKs、APIs）和必须销售介入的定价，拉长实施周期——在看重
              speed-to-value 的中端市场，这一摩擦反而利好 Attentive。

              Postscript 拥有狭窄但持久的 Shopify 专属护城河。其 Infinity Testing 产品用 AI 测试数百个 SMS 消息变体，声称 Shopify merchants 平均 ROI 为
              34×，并受益于多 commerce stacks 平台无法获得的深度 Shopify 数据集成。关键在于，Postscript 不提供
              email；寻求全渠道的品牌被迫采用多工具组合，这是结构性劣势，Attentive 则通过把 SMS 和 email 与统一订阅者身份打包来利用这一点。

              Omnisend 的差异化在地理触达（worldwide SMS）、透明自助定价（$0.007/SMS 起）和免费计划，正面回应 Attentive 的 SMB
              排除和有限地理覆盖弱点。其渠道组合（email、SMS、web push）缺少 RCS 和 WhatsApp，因此主要留在中端市场。Insider One 在企业端竞争，主打 WhatsApp-first
              全球部署；其 2026 Gartner Magic Quadrant Personalization Engines Leader 和 G2 Summer '26 11 个类别 Top Leader
              认可，显示其作为平台整合方案的分析师可信度在提升。Iterable 面向企业生命周期营销，提供 developer-friendly 旅程编排层、AI
              intelligence（「Nova」）和多渠道支持（email、SMS、in-app、web push）；其 2021 年 $2B 估值意味着可观私营 runway，不过近期改名为「AI customer
              engagement platform」也说明，所有玩家都卷入同一场 AI-differentiation 军备竞赛。

              Wunderkind 的生态位不是平台，而是带托管服务的 performance-marketing overlay；其 identity-resolution 和 AI-decisioning
              重点意味着它可以与 Attentive 平台共存（补充而非替代），但也会争夺高端零售品牌偏好的全外包互动模式预算。
