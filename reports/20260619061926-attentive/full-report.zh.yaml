            body: >
              Attentive 的案例研究库展示了 apparel、beauty、DTC 和 health/wellness 垂直行业中的强结果，但所有已发布案例均来自 attentive.com
              上的公司材料，限制了独立佐证。具名结果覆盖生产部署——不是 pilots——并包含通过 Shopify 收入数据或平台内归因衡量的真实营销项目。最常被引用的结果包括 Tushbaby 的 287x ROI 和
              Welcome Journey 900x 回报、YoungLA 迁移后总归因收入增长 56%、UNTUCKit 六个月内 lifecycle-driven revenue 提升 30%、The Frye
              Company email campaign 收入增长 576%，以及 amika 在 email 上线后 30 天内订阅者 engagement rate 达 92%。

              RCS 案例研究补充了核心 SMS/email 示例。FragranceNet 使用 RCS rich carousels 后点击率提升 106%、每次发送收入改善 47%；Spanx 此前未
              engagement 的 segment 录得 236% CTR 和 201% 每次发送收入提升——这些结果归因于受众分群和渠道 auto-upgrade 逻辑，而不只是列表质量。这些早期 RCS 结果显著超过
              SMS 基线，验证了渠道组合扩张 thesis。

              在生产案例研究中，结果归因于具体 programs（Welcome Journey、flash sales、preference collection、lifecycle flows），而不是泛化的
              campaign blasts。这种 program specificity 提高了可信度，但也反映平台依赖愿意投入 White Glove onboarding
              和战略账户管理的品牌。带宽有限的小品牌可能只能看到更温和的结果。wellness 垂直行业首批结果（The Tox：首次到访提升 60%；Mindbody beta：opt-in 转化率 46%）验证了
              Mindbody 合作假设，但样本狭窄，且属于早期采用者。
