            title: 自有渠道 SMS + Email 为电商带来一流 ROI
            body: >-
              Email marketing 平均每投入 $1 带来 $36 ROI，是所有营销渠道中最高的。SMS 以最高 98%
              打开率和可验证点击信号补充增量触达。两者合在一起，构成电商留存中成本效率最高的自有渠道组合；当电商品牌把营销支出整合到自有渠道、对冲付费媒体成本上升时，Attentive 正好可变现这一结构性优势。
