  - id: TV006
    title: 打破投资假设与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 传导至投资假设
      - 概率
      - 行动含义
    rows:
      - - Down-round 股权融资
        - 新一级融资 post-money 定价低于 $5B
        - 确认估值压缩；触发优先权机制，压低普通股价值
        - 中
        - 回避；转为观察清算优先权回收路径
      - - ARR 增长减速
        - 任一披露期间确认 ARR 同比增长低于 20%
        - 倍数重估至 3–4x ARR；公允价值压缩至 $1.35–2.6B
        - 中
        - 若持续则回避；若为单季异常则跟踪
      - - 竞争性价格战
        - Klaviyo、Braze 或新进入者将单品牌 SMS 定价下调 >20%
        - 迫使 Attentive 进入破坏利润率的折扣战；ARR 增长放缓
        - 低
        - 跟踪；若 Attentive ARR 增长降至 25% 以下，则升级为回避
      - - CEO / 领导层变动
        - Jhawar 任命后 24 个月内出现第二次 C-suite 变动
        - 客户信心风险；企业账户可能出现收入流失
        - 低
        - 继续研究：暂停，直到稳定性得到确认
      - - TCPA / GDPR 大规模执法
        - 监管行动对 Attentive 施加 >$50M 罚款或运营禁令
        - 直接损伤收入；损害 SMS 渠道声誉
        - 低
        - 回避；SMS 渠道规模化可行性受到法律挑战
      - - IPO 申报撤回或推迟至 2027 年后
        - 2027 年底前未提交 S-1
        - 表明无法达到公开市场出清估值；投资人流动性受限
        - 高
        - 跟踪；重新评估二级市场价格与投资假设
    notes: |
      概率评估是定性判断，仅基于公开证据。传导逻辑反映每个触发项如何影响股权价值，不是量化损失估计。 所有触发项在行动前都需要一手来源或经第三方验证的来源确认。
    claimRefs:
      - CV046
      - CV047
      - CV048
  - id: TV007
    title: 最终尽调事项
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径 / 负责人
    rows:
      - - 经审计收入和 ARR
        - 任何财年均无 GAAP 经审计收入；公司只披露里程碑（$500M+ ARR）
        - 必须确认 ARR 里程碑、增长率和收入确认合规性
        - 向 CFO 索取经审计财务报表；或者要求 IPO 路径下提交 S-1
      - - 毛利率和成本结构
        - 未披露毛利率、COGS 拆分或运营费用结构
        - 必须对标 Klaviyo（74.7%）和 Braze（67.2%），并评估 FCF 转正路径
        - 访问管理账；第三方审计报告；Shopify 合作伙伴财务披露
      - - Net Revenue Retention（NRR）
        - 未披露 NRR；只能用 Cyber Week 单品牌收入增长（29–42%）作为代理
        - NRR 是 SaaS 估值溢价的核心承销指标；Klaviyo NRR 110% 可作基准
        - 管理层数据室中的 cohort 分析；若提交 IPO，则查看年报
      - - 资本结构表和优先股堆栈
        - 无公开 cap table；Series E 及更早轮次优先权结构未披露
        - 决定不同退出情景下的普通股价值；对投资人回报建模至关重要
        - 直接向公司 CFO 或 GC 索取；投资前必须取得
      - - 员工数和 burn rate
        - 员工数估计为 4,450–5,000；Growjo 提示同比下降 -11%；burn rate 未披露
        - 按员工数 × fully loaded cost 估算，当前规模年薪酬为 $670M–$1B；现金 runway 不清楚
        - 管理账；Form D 或未来申报；用 LinkedIn + Growjo 确认员工数
      - - IPO 时间表和准备度
        - 未提交 S-1；未宣布 IPO 律师；未公开披露投行参与
        - 投资人退出路径需要 IPO 或战略出售；截至 2026 年 6 月尚无路径得到确认
        - 直接接触管理层；若已完成 PCAOB 审计，要求披露法律顾问
      - - 二级市场价格发现
        - 2023 年 9 月仅有 $1.43M 二级交易，价格未披露
        - 二级市场价格是私营公司估值当前最接近市场出清的信号
        - 平台：Forge、EquityBee、SharesPost；CrossWork 和 Karmel Capital 为此前参与方
    notes: |
      所有尽调事项仅代表公开研究发现的缺口。完整投资决策需要在保密协议下访问管理账、数据室和法律结构。 尽调优先级：（1）经审计收入，（2）NRR，（3）资本结构表，（4）员工数 / burn rate。
    claimRefs:
      - CV043
      - CV044
      - CV045
