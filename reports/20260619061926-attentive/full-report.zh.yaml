          - type: callout
            title: ARR 估算依赖对 2022 年 Sacra 数据的外推
            body: >
              整个估值倍数分析依赖 $450–650M 的 ARR 估计；该估计来自对 Sacra Research 2022 年末 $200M ARR 估算施加 35–45% CAGR。公司只确认 ARR 超过
              $500M（里程碑，未注明日期）。Growjo 的 $278.9M 收入估计和 -11% 员工数数据，引入了很大不确定性：ARR 究竟位于区间高端还是低端，或该里程碑是否仍维持在宣称水平，均无法确认。
