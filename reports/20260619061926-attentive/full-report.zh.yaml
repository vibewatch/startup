            body: >
              Attentive 在 Thread 2026（2026 年 5 月 26 日）披露，仅 Q1 2026 品牌就通过平台带来超过 $6B 收入。年化后隐含 $24B+ GMV run-rate；若对 2025 年
              9 月止年度 $29B+ 数字做假日季节性调整，这一水平相符。Q1 2026 数据叠加 50%+ 多产品渗透率，以及 Lands' End、Carter's、Crate & Barrel 的品牌续约，证明平台进入
              BFCM 2026 时动能仍在。
            calloutType: insight
