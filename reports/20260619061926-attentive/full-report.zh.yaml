          - type: callout
            title: 电商增长放缓是关键市场约束
            body: >-
              2022 年以来，美国电商增长已降至个位数（2022 年 4.9%、2023 年 9.0%、2024 年 7.6%、2025 年 5.4%）。相较 2020 年 COVID 期间 42%
              的激增，这一放缓限制了新电商品牌形成速度，而新品牌是营销平台新客户最自然来源。Klaviyo 的 NRR 在 2023 至 2024 年间从 117% 降至 108%，反映压力缓和。对 Attentive
              来说，持续增长将越来越依赖现有客户内的平台扩张，而非绿地获客。
            calloutType: insight
