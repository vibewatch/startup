              Attentive 估计 $6.9–7.0B 的估值，自 2021 年 6 月以来没有被新的 primary 股权融资或重大 secondary 市场交易重置。2023 年 9 月 $1.43M 的
              secondary 价格未披露，规模太小，不能构成价格发现。由此产生 5 年标记缺口；其间公开可比公司较高点压缩 60–80%。依赖当前标记的投资者面临模型风险：真实市场出清价可能显著更低。
            calloutType: risk
