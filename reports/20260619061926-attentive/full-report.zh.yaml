      - number: '6.5'
        title: 扩张、集中度风险与切换动态
        blocks:
          - type: paragraph
            body: >
              Attentive 的扩张动作围绕三条路径：产品 cross-sell（SMS → email → RCS → push）、垂直延伸（通过 Mindbody 进入
              wellness、拓展非零售）和地理增长（英国、Australia、新兴欧洲市场）。Mindbody 合作是垂直渠道扩张最清晰的证据：数千个 Mindbody Ultimate/Ultimate+
              订阅者可免费增量使用 Attentive 营销工具；早期 betas 显示 opt-in 转化率 46%，The Tox 首次到访提升 60%。Thread 2026 披露的 Lands'
              End、Carter's 和 Crate & Barrel enterprise 续约，确认最大客户在扩张而非流失。

              集中度风险显著。Attentive 的 8,000+ 客户覆盖 70+ 个行业，但收入基础明显偏向 retail 和 e-commerce。若 consumer discretionary spending 或
              DTC e-commerce 流量持续下行，平台客户 cohort 受影响程度可能高于更多元化的营销平台。北美地理集中意味着监管变化（TCPA 修订、TX/FL/OK/MD/CT/WA
              州静默时段法律）和运营商过滤政策（iOS 26 Unknown Sender filtering）可同时显著影响大部分客户基础的 deliverability 和订阅者 opt-in 率。Attentive 已用
              Visibility AI 和自动化州静默时段回应，但每次平台变化都要求客户重新配置，并制造短期流失风险。

              伙伴渠道依赖是另一条集中度路径。Mindbody 集成把 Attentive 导入 280 万 wellness-app 用户，但前提是伙伴关系保持商业稳定。Agency
              partners（MuteSix、Power Digital、Gorgias、Ometria）共同销售并服务中端市场基础中的相当一部分；任何 partner churn
              都可能影响客户留存。定价不透明——定制合同叠加可能接近翻倍表述成本的运营商费用——给预算敏感客户带来财务摩擦，也是品牌评估 Attentive 替代方案时做出竞争切换决定的已知因素。
