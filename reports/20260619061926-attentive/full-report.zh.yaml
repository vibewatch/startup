  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: |
      追踪从运营规模和牵引力证据，到估值和融资约束，再到 research-more 建议的链条，并明确升级和降级触发因素。
    data:
      nodes:
        - id: scale
          label: 运营规模
          detail: 8,000+ 个品牌；$29B+ GMV；Q1 2026 $6B+；50%+ 多产品；GMV 同比增长 48%
        - id: ai
          label: AI 差异化
          detail: AI Pro Email（1,000+ 个品牌）；AI Journeys；Visibility AI；Thread 2026 agentic 路线图
        - id: opacity
          label: 财务不透明
          detail: $500M+ ARR 未审计；无 NRR；无毛利率；未披露资产负债表
        - id: valuation
          label: 估值语境
          detail: 隐含 $6.9–7.0B；估算 ARR 的 10.6–15.6x；同业中位数 2.9x P/S
        - id: financing
          label: 融资悬置
          detail: 5 年融资空窗；$866M 优先清算权堆栈；仅 $1.43M 二级交易；无 IPO S-1
        - id: recommendation
          label: 建议：research-more
          detail: 高风险 / 估值昂贵 / 中等置信度
        - id: upgrade
          label: 升级触发
          detail: 经审计 ARR >$600M + 利润率 >70% + IPO 申报或交易重置
        - id: downgrade
          label: 降级触发
          detail: Down-round 低于 $5B / ARR 增长 <20% / 监管行动
      edges:
        - from: scale
          to: recommendation
          label: 支撑论点
        - from: ai
          to: recommendation
          label: 支撑论点
        - from: opacity
          to: recommendation
          label: 限制确信度
        - from: valuation
          to: recommendation
          label: 溢价缺乏支撑
        - from: financing
          to: recommendation
          label: 结构性约束
        - from: recommendation
          to: upgrade
          label: 若解决
        - from: recommendation
          to: downgrade
          label: 若触发
    claimRefs:
      - CV001
      - CV007
      - CV021
      - CV031
  - id: FV002
    title: 估值敏感性——ARR 倍数与隐含估值
    type: bar
    layout: wide
    summary: |
      展示在 ARR 情景（$450M、$550M、$650M）和适用倍数（3x、5x、7x、9x ARR）变化下，Attentive 隐含估值如何变化，并以当前 $6.9–7.0B 标记和同业中位数 2.9x 为锚。
    data:
      items:
        - label: 3x ARR——$450M ARR（熊市 / 同业）
          value: 1350
          unit: USD M
          note: 同行中位倍数（2.9x）；ARR 下限；较当前估值下行 80%
        - label: 3x ARR — $550M ARR（基准 / 同行）
          value: 1650
          unit: USD M
          note: 同行中位倍数（2.9x）；ARR 中位；较当前估值下行 76%
        - label: 3x ARR — $650M ARR（乐观 / 同行）
          value: 1950
          unit: USD M
          note: 同行中位倍数；ARR 上限；较当前估值下行 72%
        - label: 5x ARR — $450M ARR（悲观 / 溢价）
          value: 2250
          unit: USD M
          note: 相对同行有 1.7x 增长溢价；ARR 下限；下行 67%
        - label: 5x ARR — $550M ARR（基准 / 溢价）
          value: 2750
          unit: USD M
          note: 增长溢价；ARR 中位；较当前估值下行 60%
        - label: 5x ARR — $650M ARR（乐观 / 溢价）
          value: 3250
          unit: USD M
          note: 增长溢价；ARR 上限；下行 53%
        - label: 7x ARR — $450M ARR（高倍数 / 悲观 ARR）
          value: 3150
          unit: USD M
          note: 2.4x 增长溢价；ARR 下限；下行 54%
        - label: 7x ARR — $550M ARR（高倍数 / 基准 ARR）
          value: 3850
          unit: USD M
          note: 中等偏激进倍数；ARR 中位；下行 44%
        - label: 7x ARR — $650M ARR（高倍数 / 乐观 ARR）
          value: 4550
          unit: USD M
          note: 中等偏激进；ARR 上限；较 $6.9B 估值下行 34%
        - label: 9x ARR — $650M ARR（乐观）
          value: 5850
          unit: USD M
          note: 激进增长溢价；ARR 上限；较当前估值下行 15%
        - label: 当前估值（$6.9B）
          value: 6900
          unit: USD M
          note: Sacra / Forbes 估计；若要支撑该估值，需要 $650M ARR 对应 9-10x ARR，或 $500M ARR 对应 14x ARR
        - label: 峰值估值（$10B，2021 年 9 月）
          value: 10000
          unit: USD M
          note: Series E 投后估值；较当前估计值压缩 30%；当时为收入的 55.2x
    approximationNotes: >
      除峰值估值（$10B，Series E）和当前估计值（$6.9B）外，所有估值均由作者按 ARR 区间 × 倍数计算。ARR 区间（$450–650M）为外推值，未经审计。2.9x 的同行中位倍数取自 Klaviyo、Braze
      和 HubSpot 截至 2026 年 6 月 18 日收盘时的 TTM P/S 平均值。
    claimRefs:
      - CV013
      - CV016
      - CV018
      - CV022
      - CV023
  - id: FV003
    title: 估值与回报区间 — 乐观 / 基准 / 悲观
    type: range
    layout: standard
    summary: |
      各情景的低 / 中 / 高估值区间，列明假设，并给出相对当前 $6.9B 估值及 $866M 优先清算权总额的隐含上行 / 下行空间。
    data:
      items:
        - label: 悲观情景（3–5x ARR，$450M ARR）
          low: 1350
          mid: 1800
          high: 2250
          unit: USD M
          detail: |
            同行倍数压缩；按公开市场出清价定价；不因私有资产流动性差给予溢价。满足 $866M 优先清算权后，普通股在低至中段区间可能拿不到分配。
        - label: 基准情景（5–6x ARR，$550M ARR）
          low: 2750
          mid: 3000
          high: 3300
          unit: USD M
          detail: |
            适度增长溢价，反映 AI 拉动和品牌持续扩张；较当前估值折价 53–60%。超过 $866M 优先清算权门槛后，普通股开始参与分配。
        - label: 乐观情景（8–10x ARR，$650M ARR）
          low: 5200
          mid: 5850
          high: 6500
          unit: USD M
          detail: |
            需要经审计确认的超预期表现、IPO 申报，以及板块倍数重估。即便高端（$6.5B）也比当前 $6.9B 估值低 6%；$10B 峰值在任何单一现实情景下都无法回到。
        - label: 当前估值（Forbes / Sacra 估计）
          low: 6900
          mid: 6950
          high: 7000
          unit: USD M
          detail: >
            以 2021 年 Series E 为锚的估计；自 2021 年 6 月以来，没有任何一级交易验证。若要支撑该估值，需要 $650M+ ARR 对应 9–10x ARR，或 $500M ARR 对应 14x
            ARR——两者都高于乐观情景。
    approximationNotes: >
      所有情景区间均为作者构建的估计，不是 DCF 或 LBO 输出。每个情景下的低 / 中 / 高反映不同 ARR
      假设和倍数敏感性，不是统计置信区间。上述情景区间未扣除优先清算权总额（$866M）；特定投资人的回报取决于轮次、支付价格，以及未公开披露的清算优先权分配瀑布。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: |
      面向投委会的七维评分：市场、验证、护城河、经济性、风险、估值和证据质量。每个维度按 1–10 分评分，并给出简要理由。
    data:
      items:
        - label: 市场机会（1–10）
          value: 8/10
          note: 巨大且增长中的电商营销科技 TAM；AI 带来扩张空间；合规玩家拥有监管护城河
        - label: 需求验证（1–10）
          value: 7/10
          note: $29B+ GMV；8,000+ 个品牌；50%+ 多产品使用；Cyber Week 创纪录——很强，但 GMV ≠ 收入
        - label: 竞争护城河（1–10）
          value: 6/10
          note: 两次点击身份识别 + 订阅者密度具备耐久性；Klaviyo 品牌数量为其 24x；AI 正快速商品化
        - label: 单位经济性（1–10）
          value: 3/10
          note: 无审计数据；隐含薪酬消耗指向显著亏损；同行基准显示 65–75% 利润率
        - label: 财务风险（1–10，10=低风险）
          value: 3/10
          note: 5 年未融资；$866M 优先清算权悬顶；未披露 FCF；诉讼仍在进行
        - label: 估值吸引力（1–10）
          value: 2/10
          note: 估计 ARR 倍数 10.6–15.6x，对比同行 P/S 中位数 2.9x；三个情景均低于当前估值
        - label: 证据质量（1–10）
          value: 4/10
          note: GMV 数据强，但无审计财务；NRR、利润率、股权结构均未披露；估值未获验证
        - label: 退出准备度（1–10）
          value: 4/10
          note: 已有品类 IPO 先例（Klaviyo、Braze）；尚未提交 S-1；上市可比公司估值承压；无 M&A 信号
    claimRefs:
      - CV001
      - CV010
      - CV014
      - CV021
      - CV031
      - CV045
