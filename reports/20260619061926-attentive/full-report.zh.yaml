  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Attentive 所处的是电商营销自动化市场，覆盖让 DTC 和零售品牌在自有渠道发送个性化促销、交易和生命周期消息的软件平台；核心渠道包括 SMS、email、rich communication
              services（RCS）和移动 push
              notifications。市场边界不包括付费广告（搜索、社交、展示）、联盟营销和自然内容，因为这些依赖第三方平台和算法，而不是直接订阅者关系。通用企业营销套件（Salesforce Marketing
              Cloud、Adobe Experience Cloud）也不计入，除非它们在电商导向消息层直接竞争。

              计入的支出包括平台订阅费、按消息发送成本，以及构成 Attentive、Klaviyo、Braze 等供应商收入基础的数据平台或 CDP 附加费用。相邻支出——如 loyalty programs、review
              platforms 和 customer service tooling——具有互补性，但不属于核心市场边界。替代完整 SMS/email 营销平台的现状方案包括：基础 email service
              providers（仅 ESP 工具，如 legacy Mailchimp tiers）、品牌内部管理的运营商 short-code 项目，以及 Salesforce 或 HubSpot 的 CRM
              营销模块。当品牌规模超过 50,000 名订阅者后，细分、合规和个性化复杂度通常会推动它们从这些替代方案升级到平台。

              Attentive 市场的另一项特征，是聚焦移动优先、基于同意的消息触达。不同于程序化广告，每位订阅者都必须主动 opt
              in，因此形成既有法律防御性又高度活跃的订阅者列表。这套同意架构界定了市场的法律和经济边界，并由 CAN-SPAM（email）、TCPA（SMS）和运营商行业指南编入规则。
            claimRefs:
