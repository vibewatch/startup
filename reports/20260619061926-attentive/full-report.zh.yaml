            body: >
              Attentive 在 2018 至 2021 年间向 SEC 提交了七份 Form D 通知，披露的合计发行金额约 $882M（包括票据转换）。这与 Sacra Research 和 Forbes 分别报告的
              $863M、$866M 在四舍五入后相符。自 2021 年 6 月以来，公司未披露任何新融资轮；按 2026 年 6 月分析日期计算，间隔约 4.5
              年。对于处在这一增长阶段和估值水平的私营公司，这一间隔并不寻常。

              缺少新融资可能反映：（a）2021 年融资所得叠加收入 / burn 比例改善，现金 runway 充足；（b）私募市场倍数压缩下，管理层为避免稀释而选择不融资（当前估算 $6.9–7.0B vs. $10B
              峰值）；或（c）公司难以按现有投资人可接受估值融资。最近估值估算为 $6.9–7.0B（Sacra Research 和 Forbes，截至 2025 年），意味着较 2021 年 9 月 Series E 峰值
              $10B 压缩约 30%。按估算 $6.9–7.0B 估值和 $450–650M ARR，Attentive 交易倍数约为 10.8–15.5x ARR，高于 Klaviyo 约 10.5x（市值约 $13B，对
              FY2025 收入 $1.234B），也显著高于 Braze 约 5.2x。若没有披露增长重新加速或利润率改善，这一溢价很难自洽。截至 2026 年 6 月，尚无 IPO 注册文件。
