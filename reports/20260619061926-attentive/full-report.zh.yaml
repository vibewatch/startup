      - number: '2.5'
        title: 监管与平台约束（负面视角）
        blocks:
          - type: paragraph
            body: >-
              电商消息市场面临监管和平台约束的实质逆风；这些约束既抬高进入门槛，也给平台和客户带来合规风险。

              Telephone Consumer Protection Act（TCPA）是 SMS 营销的主要法律约束。自动发送营销短信至手机号之前，必须取得 prior express written
              consent。每条不合规短信可能带来 $500–$1,500 法定赔偿；TCPA 集体诉讼已成为使用 SMS 平台品牌的重大诉讼风险。Attentive 的专利 two-tap
              注册方法，专门用于在网站互动时获取符合 TCPA 的 double-opt-in 同意，从而围绕订阅者获取工具建立合规护城河。

              CAN-SPAM Act 监管商业 email，要求准确的发件人身份、实体邮寄地址、10 个工作日内执行 opt-out 机制，以及清晰广告标识。违规处罚最高可达每封 email $53,088。CAN-SPAM
              合规在运营上比 TCPA 简单，但多州隐私法（CCPA、CPRA、VCDPA 等）又把额外同意、数据保留和删除要求叠加到 email 订阅者管理上。

              运营商过滤给 SMS 带来技术约束：美国无线运营商推出 10-Digit Long Code（10DLC）项目，要求商业 SMS 发送者注册品牌身份和 campaign
              意图；未注册或不合规流量可能被过滤和屏蔽。这会制造注册摩擦，但也奖励合规平台，以更好送达率形成成熟玩家的竞争差异。

              Apple's Mail Privacy Protection（MPP）随 2021 年 iOS 15 推出，阻止 email 营销人员知道收件人是否或何时打开 email，使打开率不再是可靠 campaign
              优化信号。这加速了市场对 SMS 的兴趣，因为 SMS 有可验证互动信号（送达回执、点击）；同时也压低了全行业 email 打开率基准。

              这些约束总体上抬高合规地板，让低成本点状 SMS 供应商更难安全运营，也奖励功能完整的合规集成平台。Attentive 从一开始就把法律合规嵌入订阅者获取架构，历史上受益于这一动态。
            claimRefs:
              - CM020
              - CM021
              - CM022
