  - id: TR001
    title: 监管 / 法律风险登记表
    enumerationScope:
      coverage: partial
      basis: >
        Six primary regulatory and legal compliance frameworks identified from FCC, FTC, California AG, EU/DPF, and
        court records as materially affecting Attentive's US and international operations as of June 2026. Does not
        enumerate state-by-state SMS quiet-hours statutes or non-US jurisdictions beyond GDPR/DPF.
    columns:
      - 规则 / 许可 / 框架
      - 司法辖区
      - 状态
      - 不利事件可能性
      - 严重性
      - 缓释措施
      - 剩余暴露
      - 尽调路径
    rows:
      - - TCPA 集体诉讼共同被告暴露
        - 美国（联邦）
        - 进行中 — CourtListener 显示，自 2022 年以来有 16 起 TCPA 事项提到 Attentive
        - 高
        - 严重 — 每条短信 $500–$1,500；集体倍数可达八位数
        - Two-Tap opt-in（10 项专利）、Litigator Defender、Audit Assistant
        - 品牌客户配置错误仍是主要暴露来源；平台责任尚未充分检验
        - 审查保险覆盖；获取前 50 大客户的同意链审计
      - - FCC 一对一同意规则
        - 美国（联邦）
        - 已生效 — 规则收紧商业短信的 TCPA 一对一同意要求
        - 中
        - 高 — 不合规的同意获取会让整个订阅者名单失效
        - Two-Tap 双重 opt-in 强制逐品牌明确同意
        - 品牌客户导入第三方名单会绕过 Attentive 的同意机制
        - 确认平台层面是否阻止导入非 Attentive 收集的名单
      - - CCPA / CPRA（California Consumer Privacy Act，加州消费者隐私法）
        - 加州（州）
        - 执法活跃 — 加州总检察长和 CPPA 执行数据主体权利
        - 中
        - 高 — 故意违规最高罚款 $7,500 / 次；数据泄露有私人诉权
        - 隐私政策披露；退出机制；与客户签署 DPA
        - 品牌网站上的行为追踪 JS tag 会处理加州居民数据；数据处理范围未经独立审计
        - 向 Attentive 索取 DPA 和加州专属数据流映射
      - - CAN-SPAM Act 邮件合规
        - 美国（联邦）
        - 活跃 — FTC 执法；每次违规最高 $53,088
        - 低-中
        - 中 — 适用于邮件渠道；Attentive 有 1,000+ 邮件客户
        - 每封邮件必须有退出机制；披露实体地址
        - 品牌客户错误配置退订流程会带来 FTC 暴露
        - 审计前几大邮件客户的邮件退订合规
      - - GDPR / EU Data Privacy Framework（欧盟数据隐私框架）
        - 欧盟 / 英国 / 瑞士
