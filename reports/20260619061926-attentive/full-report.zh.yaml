  - id: TM004
    title: 增长驱动因素与约束
    columns:
      - 驱动因素或约束
      - 方向
      - 时间
      - 对 Attentive 的影响
      - 尽调问题
    rows:
      - - 移动商务增长
        - 顺风
        - 结构性 / 持续
        - 可触达订阅者池更大；76% 成人通过移动端购买
        - 每年跟踪移动电商占零售总额的比例
      - - SMS 打开率优势（约 98%，email 约 36%）
        - 顺风
        - 当前
        - 品牌有充分理由在 email 之外增加 SMS
        - 用独立测量验证；该数字流传很广，但常来自供应商
      - - AI 个性化需求
        - 顺风
        - 加速（2024–2026）
        - Attentive AI 和 Klaviyo AI 带来上售路径；也让产品区别于基础 ESP
        - 确认 AI 功能 attach rate 以及 AI 档位带来的收入提升
      - - 美国运营商采用 RCS
        - 顺风
        - 早期（2025–2027）
        - SMS 渠道内的消息形态更丰富；Attentive 和 Klaviyo 都已推出 RCS
        - 跟踪运营商 RCS 推出时间表和品牌采用率
      - - 电商增长放缓
        - 逆风
        - 当前（2022–2025 年个位数增长）
        - 电商增长变慢会限制新品牌获取和平台扩张潜力
        - 监控美国电商同比增速；2025 年为 5.4%，低于 2020 年的 42%
      - - TCPA 诉讼风险
        - 约束
        - 持续
        - TCPA 集体诉讼要求强健的同意采集；合规平台因此形成护城河
        - 跟踪点名电商品牌和 SMS 平台的活跃 TCPA 集体诉讼
      - - 运营商 10DLC 注册摩擦
        - 约束
        - 当前
        - 加重上线负担；过滤不合规 SMS；利好成熟平台
        - 评估 Attentive 的运营商关系质量和 10DLC 注册吞吐量
      - - Apple Mail Privacy Protection（MPP，邮件隐私保护）
        - 混合
        - 自 iOS 15（2021）以来，持续
        - 削弱 email 打开率信号，抬高 SMS 吸引力；迫使指标转向点击和收入
        - 衡量 Attentive email 产品基准相对 MPP 前基线的影响
      - - 多州隐私法复杂度
        - 约束
        - 加速（2023–2026）
        - CCPA、CPRA 及各州同类法律把同意 / 删除要求叠加到订阅者管理上
        - 审计 Attentive 合规基础设施是否覆盖 25+ 州隐私法
      - - 平台整合（Klaviyo、HubSpot、Salesforce）
        - 逆风
        - 持续
        - 多渠道既有厂商扩展 SMS，会降低品牌从 email-only 工具切换的动力
        - 按季度比较 Attentive 新增净 logo 与 Klaviyo SMS 交叉销售率
    notes: 时间分类（结构性、加速、当前、早期）是基于所引来源和行业背景的定性判断。方向反映对 Attentive 收入增长机会的预期影响，而不是对整个行业的影响。尽调问题是前瞻性研究事项，不是当前发现。
    claimRefs:
      - CM009
      - CM012
      - CM013
      - CM014
