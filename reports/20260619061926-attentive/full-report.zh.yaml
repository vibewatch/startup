      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: TCPA 平台责任：未经检验但具结构性
            body: >
              Attentive 的合规工具（Two-Tap、Litigator Defender、Audit Assistant）能降低但不能消除 8,000+ 个品牌通过其基础设施运营 SMS programs 的
              TCPA 暴露。若法院认证一起把 Attentive-as-platform 而不只是品牌客户列名的 class action，法定赔偿公式（每条短信 $500–$1,500 ×
              数百万条消息）会形成生存级财务风险。截至 2026 年 6 月，该情景尚未发生，但 TCPA-adjacent litigation 的数量（2022 年以来 107 起案件）确认原告会持续试探平台层。这是
              monitoring-grade 风险，尽调条件中应要求法律意见审阅。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR008
          - type: callout
            title: 融资空窗是最大的单一财务风险信号
            body: >
              从 Series E 完成（2021 年 9 月）到 2026 年 6 月已有 4.75 年，且没有披露新轮融资；以 Attentive
              的规模和增长阶段看，这一间隔异常。两种最值得担忧的解读是：（a）公司产生足够运营现金流，可自我融资——若属实是正向信号；或（b）公司无法以现有投资者可接受的价格融资。没有经审计财务或披露现金头寸，投资者无法区分两种情景。这种不透明是整个尽调栈中最大的单一承销缺口。
            calloutType: risk
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR034
          - type: callout
            title: 重点尽调：确认运营商 SLA、TCPA 保险和烧钱率
            body: >
              承销前要先补齐三项尽调：一是与 AT&T、Verizon、T-Mobile 的运营商 SLA 条款，尤其是内容过滤通知条款和吞吐保障；二是 TCPA 保险保额和索赔历史——这是 SMS 平台常规 D&O/E&O
              核查项；三是当前现金消耗率和账上现金，以便在不假设新增融资的情况下判断 runway。上述三项数据基本能补上本分析识别出的最重要信息缺口。
            calloutType: recommendation
            claimRefs:
              - CR021
              - CR022
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资立场与建议
        blocks:
          - type: paragraph
            body: >
              Attentive 的平台结构有吸引力：它是美国领先的移动优先电商消息网络，服务 8,000+ 个品牌，ARR 已确认跨过 $500M，2025 年 9 月止年度 GMV 同比增长 48% 至 $29B+，并在
              Thread 2026 发布了 AI 原生产品路线图。但从公开证据看，公司当前 $6.9–7.0B 的估值估算，达不到投资级买入建议所需的置信度。该估值锚定 2021 年 9 月 Series E
              交易——当时正处于私募市场倍数膨胀高点；此后没有新的 primary 轮或有意义的 secondary 交易重置价格（唯一公开记录的 secondary 是 2023 年 9 月
              $1.43M，价格未披露）。公司未提交 IPO S-1，也没有公开经审计财务数据。

              公开可比公司在 2021 年的收入倍数为 10–20x，到 2026 年 6 月已压缩至 2.7–3.0x TTM 收入；相比之下，Attentive 隐含 10.6–15.6x ARR 倍数，没有交易验证却有
              4–5x 溢价。建议立场是继续研究：方向判断成立（TAM 大、留存信号扎实、AI 驱动扩张），但价格与当前证据不匹配。可信的买入案例需要二选一：（a）经审计财务确认 ARR >$600M、毛利率 >70%、FCF
              走向转正；或（b）新一轮股权融资或 IPO 文件验证或重置价格。
            claimRefs:
