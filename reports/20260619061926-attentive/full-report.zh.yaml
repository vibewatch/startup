      - number: '2.4'
        title: 增长驱动因素与需求催化
        blocks:
          - type: paragraph
            body: >-
              多个结构性和周期性力量在推动电商营销自动化增长。

              移动普及是最持久的长期驱动。92% 的美国家庭拥有智能手机，76% 的成年人曾通过移动端购买，给 SMS 和 mobile push 创造了持续高触达面。美国移动设备用户基数预计到 2029 年达到
              324.25M（当前约 309M）。消费者日均在移动端停留 4+ 小时，SMS 的渠道经济性——据称打开率最高可达 98%，而 email 平均为 35.63%——为渠道预算分配提供了有力理由。

              Email ROI 仍然出色：行业估算显示，email marketing 每投入 $1 平均带来 $36 收入，是 ROI 最高的直接营销渠道。44% 的营销专业人士将 email
              列为最有效渠道，领先于社交媒体（16%）和付费搜索（16%）。这些经济性支撑了对 email 平台的需求，并越来越多地推动向 SMS cross-sell。

              AI 和个性化正成为下一轮需求驱动。IBM 将 AI 增强触发自动化（弃购车、基于行为的 flows）和实时分群列为现代营销自动化的关键价值创造点。Klaviyo 于 2024 年推出 Klaviyo
              AI，用于分群和 campaign 编排。Attentive 称其 AI 可在内容创作上节省 50% 时间、带来 10% 更多购买，并处理 3,000+ trillion 个
              datapoints，用于个体化发送时间和内容优化。

              RCS 采用是更长期催化因素：Google 的 RCS for Business 平台提供类似 SMS 的触达，同时加入更丰富媒体（轮播、操作按钮、认证发件人品牌标识）；Klaviyo 已明确把「RCS for
              Business」与 SMS、WhatsApp 并列为渠道，显示市场动能正在形成。

              Twilio/SendGrid 平台（每月发送 200+ billion 封 email）展示了底层消息基础设施的规模，也对应其上层平台软件的大型可服务市场。
