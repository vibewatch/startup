        - 评估演示门槛是否正在损失可触达 SMB 市场，或这是有意上移市场的选择
    notes: 严重程度评级（中 / 高）是基于截至 2026 年 6 月 G2 评论、竞争对手产品页和行业分析作出的定性评估。非投资建议。
