        - 品牌在完成 TCPA 同意迁移后自托管名单
        - 中高
        - 只要记录妥善，opt-in 同意记录可以迁移；迁移工具已经存在
        - 评估名单可携带性的合同壁垒，以及 Attentive 数据条款是否限制导出
      - - 100+ 集成生态深度
        - Klaviyo 和 Braze 提供数量相近的集成
        - 中
        - 73% 的客户认为 Attentive 集成优于此前供应商；竞争对手集成目录达到或超过 100 个连接器
        - 识别 Klaviyo 或 Braze 尚未复制的独特集成；评估集成是否形成数据锁定
      - - AI 个性化差异化（AI Journeys、AI Pro）
