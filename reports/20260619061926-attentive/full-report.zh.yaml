      - number: '7.5'
        title: 执行、竞争与下行情景风险
        blocks:
          - type: paragraph
            body: >
              CEO 从 Brian Long（创始人，曾以 CEO 身份签署 2021 年 6 月 Form D）过渡到 Amit Jhawar，是重大执行风险。公开一手文件没有确认精确过渡日期；公开报道和
              Attentive leadership page 均显示 Jhawar 为现任 CEO（Forbes 截至 2026 年 3 月亦如此），但缺少经 fetch 确认的官方新闻稿，削弱了证据强度。成长阶段公司的
              founder-CEO 过渡，历史上常与战略重定向、文化扰动和留才风险相关。Jhawar 在 2026 年 5 月 Thread 2026 发布的「agentic
              AI」战略转向，是一次雄心较大的产品重新定位；它必须在维护 8,000+ 个品牌关系的同时跑通。

              竞争压力正在加剧。Klaviyo（NYSE: KVYO，约 $13B market cap）在 email 和 SMS 上直接竞争，FY2025 收入 $1.234B、毛利率 74.7%，有持续 R&D
              再投入的资本耐力。Postscript（Stodge Inc.）是 SMS-specific tooling 的活跃竞争者，同时也是 Attentive 的诉讼对手。Shopify Messaging（服务
              500k+ 商家）为 Shopify-native 品牌提供低摩擦嵌入式替代方案。317 Labs（Emotive）是 Attentive 正在起诉专利侵权的直接 SMS 竞争对手，说明 Attentive
              将其视为可信威胁。使用 foundation-model personalization 的 AI-native 新进入者，正在让 Attentive 的专有 AI Pro 和 AI Journeys
              差异化价值下降，因为商品化替代方案正在出现。

              三个下行情景可信：（1）TCPA 执法升级，触发直接针对 Attentive-as-platform 而非单个品牌客户的 class action，形成八位数和解风险；（2）iOS 26 过滤显著压低 SMS
              打开率，在合同续约时触发品牌流失；（3）下一轮融资估值低于现有投资者成本基础，触发 down-round economics 并 cram-down 普通股持有人。未披露财务、没有公布 IPO
              路径、投资者基础缺乏流动性三者叠加，可能形成 overhang，压低员工股权价值，并让领导层留才更复杂。
