  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >
              Attentive 通过模块化、订阅型平台费结构产生收入，覆盖四个可配置维度：消息量（出站 SMS、email、RCS 和 push 发送）、订阅者列表规模、渠道选择（仅 SMS、SMS 加 email，或
              SMS、email、RCS 和 push 的完整多渠道包），以及高级 AI 模块（用于个性化的 AI Pro 和用于工作流自动化的 AI
              Journeys）。公开定价页未发布按消息或按订阅者费率；所有定价都需要销售接触，使 Attentive 更像企业导向、逐单定价的平台，而非自助工具。这种不透明在高 ACV 营销平台市场很常见，但限制买家
              benchmark 和独立尽调。

              多渠道组合（「SMS, email, RCS & push」）以相对单渠道定价的「built-in savings」推广，激励通过 cross-sell 扩大 ARPU。AI Pro for Email 于
              2025 年 6 月面向 1,000+ 客户推出，公司又在 2025–2026 年新增 AI Journeys 和 RCS 作为增量收入杠杆。专门的战略支持层——包括战略规划、上线、送达率专业能力和 24/5
              客服——被定位为企业级差异化，但也对应高接触 SaaS 模式的成本结构，而不是全自动平台。

              这类订阅 SaaS 平台的收入确认通常相对直接，按合同期 ratable 确认；但使用量超额（按消息区间）和多元素安排（平台费 + 专业服务）可能在 GAAP 报告中引入收入确认复杂度。Attentive
              未披露与收入确认有关的信息。
