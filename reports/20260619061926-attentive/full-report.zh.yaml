              Attentive 持有 10 项覆盖 Two-Tap 订阅者注册机制的已授权美国专利，并有更多专利待批。2024 年 12 月与 Emotive 的和解——包括一笔金钱付款，以及 Emotive
              承认专利有效性——显示公司愿意主动执行权利。Forrester Consulting 研究发现，Two-Tap 工具可带来最高 25% 的年度 SMS 订阅者增长，对应 $4.5-$11.8M
              的额外品牌收入。这一 IP 地位是 Attentive 最耐久的技术差异化，因为竞争者不经授权无法合法复制核心注册流程。
