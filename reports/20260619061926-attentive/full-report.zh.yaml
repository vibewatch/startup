    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与产品
        blocks:
          - type: paragraph
            body: >
              Attentive Mobile Inc. 以 Attentive 名义经营，是一家 AI 驱动移动营销平台，2016 年在 Delaware 注册成立，总部位于 New York, New
              York。公司最初名为 Franklin Mobile，后来改名。SEC 文件列出的法定邮寄地址为 221 River Street, Suite 9047, Hoboken, NJ 07030，显示其早期基地在
              New York 都市圈。attentive.com 发布的隐私政策将法律实体标识为「Attentive Mobile Inc.」，并说明该实体控制 SMS 和 email 营销服务。

              Attentive 的核心产品是个性化短信和 email 营销平台，服务 70 多个行业的品牌，主要集中在零售和电商。平台支持四个主要渠道：SMS、email、RCS（Rich Communication
              Services）和 push notifications。Attentive 的差异化来自几项能力：用于订阅注册的专利 Two-Tap 技术、AI 驱动内容个性化（品牌名为 AI Pro 和 AI
              Journeys），以及由 100+ 连接器组成的完整集成生态，包括 Shopify、Mailchimp、Zendesk、HubSpot 和 Snowflake。Sequoia
              的组合公司介绍称，Attentive 是「面向创新品牌的个性化短信平台。Attentive 使用实时行为数据，在客户旅程每一步自动向每位订阅者发送有吸引力的短信。」2026 年，公司在年度 Thread 2026
              大会上将自身定位为「agentic AI」营销平台，并在 2026 年 5 月推出 Visibility AI，切入 RCS。
