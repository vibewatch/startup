      - number: '1.4'
        title: 增长指标与竞争表现
        blocks:
          - type: paragraph
            body: >
              Attentive 的运营规模指标显示，它已是一家成熟、高增长 SaaS 平台。公司 About 页面把 ARR 突破 $500M 记为里程碑，但未披露当前精确 ARR。Sacra Research
              估算，2022 年底 ARR 为 $200M，较 2021 年底 $125M 同比增长 60%。Forbes Cloud 100 档案（2026 年 3 月）将 Attentive 列为 2025 年第 #20
              位——连续第五年进入榜单前 20；Attentive 自身新闻稿也描述了这一成绩。Forbes 称，2024 年 Attentive 客户合计发送超过 53B 条短信。Cyber Week 2025
              期间，公司为品牌带动近 $2B 收入（其记录中最佳 Cyber Week），期间发送 5.7B 条消息。Cyber Week 2025 期间，品牌 SMS 收入同比增长 42%，email 收入同比增长
              29%。截至 2025 年 9 月的全年，Attentive 支撑客户收入超过 $29B，同比增长 48%。截至 2025 年 6 月，email 客户超过 1,000。

              Attentive 服务 70+ 行业的 8,000 多个领先品牌（据 2023 CB Insights fact sheet），包括零售、wellness 和餐饮等垂直领域。Forbes 提到的客户牵引包括
              Crate & Barrel、Dyson 和 Steve Madden。在 G2 上，Attentive 来自 1,383 条评论的评分为 4.5/5；AI
              生成评论摘要赞扬易用性和客户支持，但指出订阅者列表增长后成本上升是值得关注的问题。在 Shopify App Store 上，Attentive 来自 113 条评论的评分为 4.7/5，其中 87% 为 5
              星、8% 为 1 星。Newsweek 将 Attentive 纳入 America's Greatest Workplaces for Diversity 2024 榜单。
