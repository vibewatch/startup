  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR
      missingEvidence: >
        Audited revenue (GAAP recognized) and confirmed ARR for the most recent fiscal year, including
        revenue recognition policies and quarterly breakout.
      whyItMatters: >
        The entire valuation multiple analysis rests on an estimated $450–650M ARR. Without audited data,
        no investor can confirm whether the milestone is current, overstated, or how it is calculated.
      diligencePath: >
        Request PCAOB-audited financial statements from Attentive management or CFO. Alternatively, an
        IPO S-1 filing would make audited financials publicly available.
      relatedQuestionRefs:
        - QV007

    - type: private-evidence-only
      severity: blocking
      topic: funding
      missingEvidence: >
        Full capitalization table including number of shares outstanding per class, option pool size,
        and exact liquidation preferences and participation caps for each preferred series.
      whyItMatters: >
        Determines common equity value at various exit valuations and whether current preference overhang
        would leave common shareholders with meaningful proceeds in bear and base scenarios.
      diligencePath: >
        Direct request to Attentive CFO or General Counsel under NDA. Required before any investment
        decision can be made by an LP, LP-of-LP, or direct secondary buyer.
      relatedQuestionRefs:
        - QV015
        - QV029

    - type: missing-source
      severity: material
      topic: NRR
      missingEvidence: >
        Attentive has not disclosed any net revenue retention metric, cohort revenue analysis, or dollar-based
        expansion rate for any period, making it impossible to independently assess customer quality.
      whyItMatters: >
        NRR is the primary driver of SaaS premium multiples. Klaviyo's 110% NRR commands a premium to Braze's
        undisclosed rate; without Attentive's NRR, no comparable premium can be justified.
      diligencePath: >
        Request cohort revenue analysis from management data room; look for implicit NRR signals in brand
        renewal announcements, Shopify App Store ratings trend, and G2 review progression.
      relatedQuestionRefs:
        - QV025

    - type: missing-source
      severity: material
      topic: valuation
      missingEvidence: >
        No M&A transaction comparable exists for ecommerce SMS/email marketing automation at scale.
        Salesforce's acquisition of ExactTarget ($2.5B, 2013) and Adobe's acquisition of Marketo ($4.75B, 2018)
        are dated comparables; no equivalent 2025–2026 transaction has been identified.
      whyItMatters: >
        M&A exit scenario valuation depends on what a strategic acquirer (Salesforce, Adobe, SAP, Shopify, Meta)
        would pay per ARR dollar, which requires current comparable transaction data.
      diligencePath: >
        Track M&A activity in marketing automation; monitor Klaviyo and Braze for acquisition speculation;
        analyze Shopify's strategic roadmap for owned-channel marketing acquisition intent.
      relatedQuestionRefs:
        - QV026

    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >
        Exact current headcount, regional breakdown, and burn rate are not disclosed. Growjo -11% YoY
        signal suggests potential restructuring, but neither direction nor scale is confirmed.
      whyItMatters: >
        Implied payroll at $150–200K loaded cost per employee for 4,500–5,000 staff = $675M–$1B annually.
        If ARR is $550M, this implies operating losses of $100M+ before carrier costs, which affects runway.
      diligencePath: >
        LinkedIn headcount tracking; Growjo monitoring; management accounts from data room; optional
        Glassdoor layoff reports cross-reference.
      relatedQuestionRefs:
        - QV032

    - type: missing-source
      severity: minor
      topic: valuation
      missingEvidence: >
        No public evidence exists for Attentive's current IRR, ownership structure, option pool, or
        liquidation preference waterfall as of June 2026, representing critical unresolvable gaps from
        public sources alone.
      whyItMatters: >
        Secondary market price is the most current market-clearing signal for private valuation.
      diligencePath: >
        Contact Forge Global, EquityBee, and CartaX for any active listings; reach out to prior secondary
        buyers (CrossWork, Karmel Capital) for current price indications.
      relatedQuestionRefs:
        - QV009

    - type: enumeration-incomplete
      severity: material
      topic: valuation
      missingEvidence: >
        Comparable Valuation Table (TV002) excludes private comps (Postscript, Yotpo, Iterable) and any
        recent M&A exit transactions in the ecommerce marketing automation category due to absence of
        publicly disclosed deal valuations or ARR multiples for private peers.
      whyItMatters: >
        Private comparable rounds and M&A exits would provide a more complete picture of the range of
        realistic exit multiples for Attentive; public-only comps may understate the private market premium.
      diligencePath: >
        Track Yotpo, Postscript, and Iterable funding announcements; monitor M&A activity in martech;
        use PitchBook or CB Insights premium data to access private round multiples.
      relatedQuestionRefs:
        - QV026
      relatedTableRefs:
        - TV002

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      TV001 (Recommendation Summary) and TV004 (Thesis/Anti-Thesis) contain qualitative assessments derived
      entirely from public evidence and are labeled as such in their notes fields. TV005 (Financing) contains
      estimated early-round sizes derived from SEC Form D amounts and industry norms for unconfirmed tranches.
      All tables include explicit notes fields addressing data sources, estimation methodology, and limitations.
      Acknowledging residual tableNotes warnings for tables where all significant caveats are already documented
      in the notes field and additional notes would be redundant.
