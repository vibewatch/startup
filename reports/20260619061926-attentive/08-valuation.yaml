callouts:
  - calloutType: risk
    title: Valuation Mark Is Anchored to a 2021 Bubble Transaction
    body: >
      Attentive's $6.9–7.0B estimated valuation has not been reset by a new primary equity round or a material
      secondary market transaction since June 2021. The September 2023 secondary of $1.43M at undisclosed price
      is too small to constitute price discovery. This creates a 5-year marking gap during which the public
      comparator set compressed 60–80% from their peaks. Investors relying on the current mark face model risk
      that the true market-clearing price is materially lower.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV038

  - calloutType: insight
    title: Q1 2026 GMV Acceleration Provides Positive Momentum Signal
    body: >
      Attentive disclosed at Thread 2026 (May 26, 2026) that brands drove more than $6B in revenue through the
      platform in Q1 2026 alone. Annualized, this implies $24B+ GMV run-rate—consistent with the $29B+ figure
      for the year ending September 2025 adjusted for holiday seasonality. The Q1 2026 data, combined with 50%+
      multi-product penetration and brand renewals from Lands' End, Carter's, and Crate & Barrel, provides
      meaningful evidence that platform momentum is intact entering BFCM 2026.
    claimRefs:
      - CV009
      - CV010
      - CV011

  - calloutType: assumption
    title: ARR Estimate Depends on Extrapolation from 2022 Sacra Data
    body: >
      The entire valuation multiple analysis depends on an estimated ARR of $450–650M derived by applying
      35–45% CAGR to Sacra Research's $200M end-2022 ARR estimate. The company has confirmed only that ARR
      exceeds $500M (milestone, undated). Growjo's estimate of $278.9M revenue and the -11% headcount figure
      introduce significant uncertainty about whether the ARR is at the high or low end of the range, or
      whether the milestone has been sustained at the claimed level.
    claimRefs:
      - CV007
      - CV008
      - CV040
      - CV041

