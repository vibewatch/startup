chapter:
  number: 8
  title: Valuation
  summary: >
    Attentive's current estimated valuation of $6.9–7.0B (Forbes Cloud 100 March 2026; Sacra Research) implies an
    10.6–15.6x multiple against estimated ARR of $450–650M—a dramatic and unsubstantiated premium to the public
    marketing-automation peer set, which as of June 18, 2026 trades at 2.7–3.0x TTM revenue (Klaviyo $3.97B market cap
    on $1.31B TTM revenue; Braze $2.26B on $787M; HubSpot $9.02B on $3.30B). With no new primary equity round since
    June 2021, no IPO registration, and no audited financials in the public domain, the valuation mark is anchored
    to a bubble-era 2021 transaction—a structural gap that drives a research-more recommendation under a high-risk,
    expensive-valuation rating despite genuine operating momentum evidenced by 48% GMV growth and 50%+ multi-product
    penetration.

sections:
  - id: investment-stance
    title: Investment Stance and Recommendation
    body: >
      Attentive presents a structurally compelling platform—the leading US mobile-first ecommerce messaging network
      with 8,000+ brands, a confirmed $500M+ ARR milestone, 48% year-over-year GMV growth to $29B+ in the year
      ending September 2025, and an AI-native product roadmap unveiled at Thread 2026. However, the company's
      current estimated valuation of $6.9–7.0B is not supportable from public evidence at the level of confidence
      required for an investment-grade buy recommendation. The valuation mark derives from a September 2021 Series E
      transaction—a peak in private-market multiple inflation—and has never been reset by a new primary round or a
      meaningful secondary transaction (the only publicly documented secondary was $1.43M in September 2023 at an
      undisclosed price). No IPO S-1 has been filed and no audited financials are publicly available.

      Against a public comparable set that has compressed from 10–20x revenue in 2021 to 2.7–3.0x TTM revenue
      in June 2026, Attentive's implied 10.6–15.6x ARR multiple represents a 4–5x premium with no transactional
      validation. The recommended posture is research-more: the thesis is directionally correct (large TAM, durable
      retention signal, AI-led expansion), but the price is inconsistent with the current evidence base. A credible
      buy case requires either (a) audited financials confirming ARR >$600M, gross margin >70%, and positive FCF
      trajectory, or (b) a new equity round or IPO filing that validates or resets the price.
    claimRefs:
