  - id: scenario-analysis
    title: Bull / Base / Bear Scenario Analysis
    body: >
      Three valuation scenarios anchor the investment-decision framework. The bear case assumes ARR at the low bound
      of the estimated range ($450M), limited growth re-acceleration, and a multiple compression to 3–5x ARR as the
      public market dictates the private ceiling. This produces a fair-value range of $1.35–2.25B, representing a
      75–80% discount to the current $6.9–7.0B mark. The catalyst for the bear case is a fundraise at a forced
      down-round or an IPO that prices at a market-clearing level inconsistent with the 2021 price—either would
      trigger liquidation preference mechanics that divert capital away from common equity.

      The base case assumes ARR of $550M (midpoint of the estimated range), 30–35% annualized growth, and a moderate
      growth premium of 5–6x ARR. Fair value range: $2.75–3.3B, still 53–60% below the current mark. The bull case
      assigns $650M ARR, 40%+ growth trajectory sustained through AI monetization (AI Pro for Email, AI Journeys, RCS
      premium), multi-product penetration above 60%, and a 8–10x premium multiple reflecting a successful IPO at a
      5–6x forward NTM revenue valuation. Even this optimistic scenario produces $5.2–6.5B—a range that encompasses
      but does not definitively support the current $6.9–7.0B mark. The probability distribution across scenarios
      leans bear-to-base given the evidence available: no audited financials, sector-wide compression, and five years
      of fundraising inactivity. Threading Q1 2026 GMV of $6B+ annualized against prior periods provides mild
      upward support, but GMV attribution is not Attentive's own revenue.
    claimRefs:
