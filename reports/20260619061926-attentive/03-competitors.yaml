chapter:
  number: 3
  title: Competitors
  summary: >-
    Attentive competes in a crowded ecommerce messaging automation market dominated by two well-capitalized
    public incumbents—Klaviyo ($1.234B FY2025 revenue) and Braze ($738M FY2026 revenue)—as well as a
    cohort of well-funded privates including Iterable, Postscript, Omnisend, Insider One, and Wunderkind.
    Attentive's SMS-first heritage, agentic AI pivot, and enterprise white-glove service model differentiate
    it from mid-market transparent-pricing alternatives, but leave it vulnerable to Klaviyo's omnichannel
    CRM ambitions, Braze's WhatsApp and international reach, and Postscript's deep Shopify lock-in.
    Geographic SMS coverage gaps (20+ countries vs Omnisend's worldwide reach), a closed email builder,
    and opaque pricing trigger measurable churn risk among SMBs and global brands.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: >-
      Attentive operates in a large and intensifying ecommerce marketing automation market, competing
      against a multi-tier field spanning public-company incumbents, well-funded privates, and specialized
      point solutions. The primary competitive set consists of eight direct peers that share Attentive's
      target customer—mid-to-large ecommerce and retail brands seeking owned-channel (SMS, email, RCS,
      push) retention marketing at scale.

      The two most formidable direct competitors are Klaviyo (KVYO) and Braze (BRZE), both publicly
      traded and well ahead of Attentive in disclosed revenue. Klaviyo reported FY2025 revenue of
      $1.234 billion (31.6% year-over-year growth), serves 196,000+ brands across 100 countries, and
      has pivoted its positioning from "email and SMS platform" to "autonomous B2C CRM"—a direct
      challenge to Attentive's omnichannel ambitions. Braze reported FY2026 (January 2026 fiscal
      year-end) revenue of $738.18 million (24.4% YoY growth) and differentiates on breadth: it
      covers WhatsApp, LINE, and KakaoTalk in addition to SMS, email, RCS, and push—channels Attentive
      does not support.

      The private tier includes Iterable (enterprise lifecycle marketing, $200M Series E 2021, ~$2B
      valuation), Postscript (Shopify-exclusive SMS with AI testing, no email), Omnisend (ecommerce
      email+SMS+web push with transparent pricing and worldwide SMS reach), Insider One (global
      omnichannel with strong WhatsApp and Gartner 2026 Leader recognition), and Wunderkind
      (performance-marketing identity resolution with managed-service delivery). Each occupies a
      distinct positioning niche, creating a segmented but partially overlapping competitive landscape.

      Two status-quo substitutes remain material: (1) internal build using API-layer platforms such as
      Twilio (150+ countries, $0 per-message margin, requires dedicated engineering), and (2)
      standalone ESPs like Mailchimp or Klaviyo-only email, with SMS bolted on via third-party tools.
      Both options compress list-growth tool differentiation and raise the make-vs-buy question for
      larger brands with engineering resources.

      Likely future entrants include Salesforce Marketing Cloud and HubSpot, which are investing
      in SMS and AI-automation layers. Meta and Google could leverage their ad-ID graphs to build
      owned-channel features natively, representing a longer-horizon displacement risk.
