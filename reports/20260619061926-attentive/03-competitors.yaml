    - type: private-evidence-only
      severity: material
      topic: competitor-scale
      missingEvidence: "Confirmed customer count, ARR, and growth rate for Iterable, Postscript, Omnisend, Insider One, and Wunderkind as of 2026."
      whyItMatters: "Without private-company financials, relative market share and competitive scale for the private-peer set cannot be precisely assessed."
      diligencePath: "Request private-company data room access via investment process; cross-check against Pitchbook/PitchBook, Sacra, or regulatory filings in relevant jurisdictions."
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP001]

    - type: missing-source
      severity: material
      topic: competitor-channels
      missingEvidence: "Confirmed Braze and Iterable WhatsApp channel usage metrics (active brands, message volumes, revenue share from WhatsApp) in 2026."
      whyItMatters: "WhatsApp's contribution to Braze's enterprise win rate is material for assessing the severity of Attentive's channel gap."
      diligencePath: "Request Braze Q4 FY2026 earnings call transcript; cross-check with analyst reports covering Braze's channel mix disclosures."
      relatedQuestionRefs: [QP021]

    - type: missing-source
      severity: material
      topic: adverse-pricing
      missingEvidence: "Verified churn rate or NRR data for Attentive compared to Klaviyo, to assess whether pricing-transparency complaints translate to actual customer attrition."
      whyItMatters: "High NRR would indicate that carrier-fee complaints are manageable; low NRR would validate pricing as a structural churn driver."
      diligencePath: "Request Attentive NRR and gross/net churn by cohort in due diligence data room; cross-check against customer case studies and review trends."
