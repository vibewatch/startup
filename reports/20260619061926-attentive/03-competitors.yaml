callouts:
  - calloutType: risk
    title: WhatsApp and Geographic Coverage Gap Is a Growing Enterprise Liability
    body: >-
      Attentive's absence from WhatsApp and its SMS coverage limited to 20+ countries (vs Braze's
      global or Omnisend's worldwide reach) is the single most structurally difficult competitive
      gap to address quickly. As Braze and Insider One win enterprise global brand RFPs by leading
      with WhatsApp, Attentive's North America/Europe/APAC SMS-limited posture increasingly
      excludes it from multi-region consolidation deals—a category of deal that will grow as
      global brands seek a single omnichannel retention platform. This gap cannot be bridged
      through AI differentiation alone.
    claimRefs:
      - CP009
      - CP010
      - CP036
      - CP042

  - calloutType: risk
    title: Pricing Opacity and Carrier Fee Surprises Drive Mid-Market Churn Risk
    body: >-
      Multiple G2 reviews in 2026 document that Attentive's all-in cost consistently exceeds
      quoted contract rates due to carrier fees billed separately. This transparency failure is
      actionable—Omnisend and Klaviyo make carrier costs visible upfront—and gives buyers of
      comparable SMB tools a concrete reason to switch before Attentive's superior AI and
      integration value can compound. The demo-required entry gate also eliminates the organic
      self-serve acquisition funnel that Klaviyo's free tier exploits.
    claimRefs:
      - CP033
      - CP034
      - CP037
      - CP038

  - calloutType: insight
    title: Attentive's Enterprise White-Glove Model Is Both Moat and Ceiling
    body: >-
      The White Glove onboarding and dedicated customer success model is Attentive's highest-rated
      differentiator in customer reviews, but it creates a unit economics ceiling—it limits TAM to
      brands large enough to justify the sales and service overhead. Klaviyo's free/self-serve tier
      gives it a land-and-expand motion Attentive lacks, compounding the SMB share disadvantage
      over time. For Attentive to grow toward its $10B valuation, it must demonstrate either
      expanding enterprise wallet share or a credible path to self-serve entry that doesn't
      cannibalize its white-glove margins.
    claimRefs:
      - CP039
      - CP040
      - CP043
      - CP044

