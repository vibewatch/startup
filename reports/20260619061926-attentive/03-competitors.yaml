  - id: direct-competitor-profiles
    title: Competitor Profiles and Capability Comparison
    body: >-
      Klaviyo's CRM pivot is the most strategically significant competitive shift in this landscape.
      The platform now encompasses email, SMS, RCS, WhatsApp, and mobile push under a single unified
      data model, with a free tier (up to 250 profiles, 500 emails/month, 150 SMS credits) that lowers
      the barrier for small brands and creates a land-and-expand motion absent in Attentive's sales-led
      model. Klaviyo's gross margin of 74.6% in FY2025 signals strong product leverage, while FCF
      turned positive at $208.5M in FY2024 and $219.5M in FY2025. The platform positions "Marketing
      Agent" and "Customer Agent" as AI-powered autonomous campaign tools—mirroring Attentive's
      agentic AI positioning but with broader channel reach and transparent pricing.

      Braze serves enterprise and mid-market customers requiring multi-channel orchestration at
      global scale. Its channel roster—adding WhatsApp, LINE, and KakaoTalk to the SMS/email/push/RCS
      stack—is unmatched in the direct ecommerce set. Braze's FY2026 gross margin of 66.5% is lower
      than Klaviyo's, reflecting its heavier professional-services and engineering-support cost structure.
      Its Intelligence Suite (AI channel/timing selection) and built-in AI agents (Operator) present
      a feature overlap with Attentive's AI Journeys, but Braze's developer-first orientation
      (SDKs, APIs) and sales-required pricing create a longer implementation cycle—a friction that
      benefits Attentive in the mid-market where speed-to-value matters.

      Postscript holds a narrow but durable Shopify-specific moat. Its Infinity Testing product
      uses AI to test hundreds of SMS message variants, claims an average 34× ROI for Shopify merchants,
      and benefits from deep Shopify data integration unavailable on platforms serving multiple
      commerce stacks. Critically, Postscript does not offer email, which forces multi-tool stacks
      for brands seeking omnichannel—a structural disadvantage that Attentive exploits by bundling
      SMS and email with unified subscriber identity.

      Omnisend differentiates on geographic reach (worldwide SMS), transparent self-serve pricing
      (from $0.007/SMS), and a free plan—directly addressing Attentive's SMB exclusion and limited-
      geo weakness. Its channel set (email, SMS, web push) lacks RCS and WhatsApp, keeping it
      primarily in the mid-market. Insider One competes on the enterprise end with WhatsApp-first
      global deployments; its 2026 Gartner Magic Quadrant Leader for Personalization Engines and
      G2 Summer '26 Top Leader recognition across 11 categories signal growing analyst credibility
      as a platform-consolidation play. Iterable targets enterprise lifecycle marketing with a
      developer-friendly journey orchestration layer, AI intelligence ("Nova"), and multi-channel
      support (email, SMS, in-app, web push); its $2B 2021 valuation implies a significant private
      runway, though its recent rebranding to "AI customer engagement platform" signals the same
      AI-differentiation arms race affecting all players.

      Wunderkind occupies a niche as a managed-service performance-marketing overlay rather than a
      platform play; its identity-resolution and AI-decisioning focus means it can co-exist with
      Attentive's platform (supplementing rather than replacing), but it competes for the same
      managed-service budget at high-end retail brands preferring a fully outsourced engagement model.
