  - id: regulatory-constraints
    title: "Regulatory and Platform Constraints (Adverse Lens)"
    body: >-
      The ecommerce messaging market faces material headwinds from regulatory and platform constraints
      that serve as both a barrier to entry and a compliance risk for platforms and their customers.

      The Telephone Consumer Protection Act (TCPA) is the primary legal constraint on SMS marketing.
      It requires prior express written consent before sending automated marketing texts to mobile
      numbers. Each non-compliant text can carry statutory damages of $500–$1,500, and TCPA class
      action litigation has become a substantial litigation risk for brands using SMS platforms.
      Attentive's patented two-tap sign-up method is designed specifically to capture TCPA-compliant
      double-opt-in consent at the point of website interaction, creating a compliance moat around
      its subscriber acquisition tooling.

      The CAN-SPAM Act governs commercial email, requiring accurate sender identification, physical
      postal address, opt-out mechanisms honored within 10 business days, and clear advertising
      identification. Violations carry penalties up to $53,088 per email. While CAN-SPAM compliance
      is operationally simpler than TCPA, multi-state privacy laws (CCPA, CPRA, VCDPA, and others)
      layer additional consent, data retention, and deletion requirements onto email subscriber management.

      Carrier filtering presents a technical constraint for SMS: the 10-Digit Long Code (10DLC)
      program introduced by US wireless carriers requires commercial SMS senders to register brand
      identity and campaign intent, with non-registered or non-compliant traffic subject to filtering
      and blocking. This creates registration friction but also rewards compliant platforms with
      better deliverability — a competitive differentiator for established players.

      Apple's Mail Privacy Protection (MPP), launched with iOS 15 in 2021, prevents email marketers
      from knowing whether or when recipients open emails, degrading open rate as a reliable campaign
      optimization signal. This has accelerated interest in SMS as a channel with verifiable engagement
      signals (delivery receipts, click-throughs), though it has also suppressed email open rate
      benchmarks across the industry.

      The overall effect of these constraints is to raise the compliance floor, making it harder for
      low-cost point-solution SMS providers to operate safely and rewarding full-featured compliance-
      integrated platforms. This dynamic has historically benefited Attentive, which built legal
      compliance into its subscriber acquisition architecture from the start.
    claimRefs:
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM037

