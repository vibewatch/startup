callouts:
  - calloutType: risk
    title: "Regulatory Headwinds: TCPA Litigation and Carrier Filtering Raise SMS Compliance Costs"
    body: >-
      TCPA class action exposure and 10DLC carrier registration requirements are material ongoing constraints
      for SMS marketing platforms. Each non-compliant text message carries statutory damages of $500–$1,500,
      making opt-in consent capture a legal necessity rather than a feature preference. Platforms that build
      consent into subscriber acquisition tooling — as Attentive has done with its patented two-tap sign-up —
      have a regulatory moat. But compliance complexity also slows customer onboarding and limits the total
      reachable subscriber pool for any given brand.
    claimRefs:
      - CM022
      - CM023
      - CM024

  - calloutType: insight
    title: "Ecommerce Growth Deceleration Is a Key Market Constraint"
    body: >-
      US ecommerce growth has slowed to single-digit rates since 2022 (4.9% in 2022, 9.0% in 2023, 7.6%
      in 2024, and 5.4% in 2025). This deceleration from the 2020 COVID-era surge (42% growth) limits
      the rate of new ecommerce brand formation, the most natural source of new marketing platform
      customers. Klaviyo's NRR declined from 117% to 108% between 2023 and 2024, reflecting this easing
      pressure. For Attentive, sustained growth will increasingly depend on platform expansion within
      existing customers rather than greenfield acquisition.
    claimRefs:
      - CM035
      - CM036

  - calloutType: strength
    title: "Owned-Channel SMS + Email Delivers Best-in-Class ROI for Ecommerce"
    body: >-
      Email marketing delivers an average $36 ROI for every $1 spent, the highest of any marketing
      channel. SMS adds incremental reach with up to 98% open rates and verifiable click-through signals.
      Together, they form the most cost-efficient owned-channel stack for ecommerce retention —
      a structural advantage Attentive is well-positioned to monetize as ecommerce brands consolidate
      marketing spend on owned channels to offset rising paid media costs.
    claimRefs:
      - CM012
      - CM013
      - CM014

