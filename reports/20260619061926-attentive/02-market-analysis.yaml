chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Attentive competes in a large and fast-growing ecommerce marketing automation market defined by SMS, email, RCS,
    and push notification channels. US ecommerce reached $1.234 trillion in 2025, and marketing technology
    expenditure is projected at approximately $148 billion globally, with email and SMS together forming the
    backbone of owned-channel retention spend for brands. Public comparables Klaviyo ($937.5M FY2024 revenue,
    34.3% YoY growth) and Braze ($593.4M FY2025 revenue, 25.8% YoY growth) bracket the addressable market
    for platform-based ecommerce messaging. Regulatory pressure from TCPA, CAN-SPAM, and carrier filtering
    programs raises compliance costs but also creates durable moats for credentialed platforms.

sections:
  - id: market-boundary
    title: "Market Boundary and Scope"
    body: >-
      Attentive operates in the ecommerce marketing automation segment, which encompasses software platforms
      that enable direct-to-consumer and retail brands to send personalized promotional, transactional, and
      lifecycle messages across owned channels — primarily SMS, email, rich communication services (RCS),
      and mobile push notifications. The market boundary excludes paid advertising (search, social, display),
      affiliate marketing, and organic content, all of which rely on third-party platforms and algorithms
      rather than direct subscriber relationships. It also excludes general-purpose enterprise marketing
      suites (Salesforce Marketing Cloud, Adobe Experience Cloud) except where they compete directly in
      the ecommerce-focused messaging tier.

      The included spend covers platform subscription fees, per-message sending costs, and data platform
      or CDP add-on charges that form the revenue base for vendors such as Attentive, Klaviyo, and Braze.
      Adjacent spend — like loyalty programs, review platforms, and customer service tooling — is
      complementary but outside the core market boundary. The status-quo substitutes for a full SMS/email
      marketing platform include basic email service providers (ESP-only tools like legacy Mailchimp tiers),
      carrier short-code programs managed in-house, and CRM marketing modules from Salesforce or HubSpot.
      As brands scale beyond 50,000 subscribers, the complexity of segmentation, compliance, and
      personalization typically triggers a platform upgrade from these substitutes.

      Attentive's market is further distinguished by its focus on mobile-first consent-based messaging.
      Unlike programmatic advertising, every subscriber must affirmatively opt in, creating subscriber
      lists that are both legally defensible and highly engaged. This consent architecture defines the
      legal and economic boundary of the market and is codified by CAN-SPAM (email), TCPA (SMS), and
      carrier industry guidelines.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM020
    tableRefs:
      - TM001

  - id: market-sizing
    title: "Market Sizing: TAM, SAM, and Public Comparables"
    body: >-
      The ecommerce marketing automation market lacks a single authoritative sizing, so this chapter
      builds the estimate from multiple lenses. The broadest lens is total marketing technology expenditure,
      which Forrester projected at approximately $148 billion globally by end of 2024, spanning all software
      categories from CRM to analytics. Within this, email and SMS automation for ecommerce brands represents
      a narrower segment. Using public comparable revenue as a sizing proxy: Klaviyo ($937.5M FY2024,
      serving 167,000+ customers primarily in ecommerce) and Braze ($593.4M FY2025, serving 2,296 enterprise
      customers across industries) together approach $1.5 billion in annualized revenue, covering only the
      organized, platform-based portion of the market. Factoring in other notable players (Iterable,
      Omnisend, Postscript, Yotpo), the structured ecommerce marketing automation software market is
      estimated at $5–8 billion annually in North America.

      A bottom-up lens using US ecommerce as the revenue base reinforces this estimate. US ecommerce
      reached $1.234 trillion in 2025 (Digital Commerce 360 / US Census Bureau data). If ecommerce
      brands typically allocate 7–10% of revenue to marketing, and approximately 15–25% of that marketing
      budget goes to owned channels (email and SMS), the annual owned-channel marketing software spend
      for US ecommerce brands alone is roughly $13–31 billion — though this overstates the addressable
      software-platform market significantly, as most spend is on media (ads) rather than SaaS tools.
      A more constrained estimate for the US ecommerce marketing automation software TAM is approximately
      $8–15 billion, including email, SMS, CDP, and related tooling. Attentive's current ARR of roughly
      $500M+ positions it with approximately 3–6% market share depending on the boundary definition.

      Sizing confidence is constrained by: lack of a primary analyst TAM for this specific segment,
      conflicting market definitions across vendors, and the reality that most Klaviyo and Braze customers
      are outside pure ecommerce.
    claimRefs:
