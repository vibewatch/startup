  - id: growth-drivers
    title: "Growth Drivers and Demand Catalysts"
    body: >-
      Several structural and cyclical forces drive growth in ecommerce marketing automation.

      Mobile adoption is the most durable long-term driver. 92% of US households own a smartphone and 76%
      of adults have purchased via mobile, creating a persistent high-reach surface for SMS and mobile push.
      The US mobile device user base is projected to reach 324.25 million by 2029 (from roughly 309 million
      today). As consumers spend an average of 4+ hours daily on mobile, the channel economics of SMS —
      with reported open rates as high as 98% versus 35.63% average for email — provide a compelling
      argument for channel allocation.

      Email ROI remains exceptional: industry estimates show an average of $36 revenue for every $1 spent
      on email marketing, making it the highest-ROI direct marketing channel. 44% of marketing professionals
      name email as their most effective channel, ahead of social media (16%) and paid search (16%).
      These economics sustain demand for email platforms and increasingly fuel cross-sell to SMS.

      AI and personalization are emerging as the next demand driver. IBM identifies AI-enhanced trigger
      automation (abandoned cart, behavior-based flows) and real-time segmentation as key value creators in
      modern marketing automation. Klaviyo launched Klaviyo AI in 2024 for segmentation and campaign
      orchestration. Attentive's AI claims 50% time savings on content creation and 10% more purchases,
      and processes 3,000+ trillion datapoints for individualized send-time and content optimization.

      RCS adoption represents a longer-term catalyst: Google's RCS for Business platform enables SMS-like
      reach with richer media (carousels, action buttons, verified sender branding), and Klaviyo has
      explicitly listed "RCS for Business" as a channel alongside SMS and WhatsApp, signaling market
      momentum.

      The Twilio/SendGrid platform (delivering 200+ billion emails/month) demonstrates the scale of
      the underlying messaging infrastructure and the correspondingly large addressable market for
      platform-layer software that sits above it.
