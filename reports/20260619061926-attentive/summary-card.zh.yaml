  topStrengths:
    - 在移动优先的消费者消息触达上占据品类领导位置，覆盖 8,000+ 个品牌，客户年 GMV 超过 $29B
    - 产品势能强：AI Pro、AI Journeys、RCS 扩展和 50%+ 的多产品渗透率一起拉动扩张
    - 投资人阵容一线，经营规模也可观，包括 $500M+ ARR 里程碑和约 5,000 名员工
    - 电商集成覆盖深，自有移动端注册与分发机制抬高切换成本
  topRisks:
    - 当前约 $7B 的私有市场标记，相比上市营销自动化同行有 4-5x 溢价，却没有经审计财务支撑
    - 没有公开经审计财务、毛利率、NRR 或近期新股融资，承销判断存在重大盲区
    - 核心 SMS 经济性取决于运营商规则、TCPA/隐私合规和不断变化的送达标准
    - 创始人 Brian Long 交棒 Amit Jhawar，AI 重新定位期增加执行与连续性风险
    - 公开诉讼和客户对定价不透明的投诉，显示运营与留存风险不小
  unresolvedGaps:
    - 当前经审计 ARR、增长、毛利率、自由现金流和净留存率（NRR）仍未披露
    - 股权结构表、清算优先权，以及任何 2024-2026 年老股交易价格都未公开可见
    - CEO 交接后董事会构成和创始人参与度尚未获一手来源确认
    - 除精选案例外，客户集中度、流失率和垂直行业组合仍不透明
    - 除公开指引和可见法院案卷外，监管风险范围仍未确认
