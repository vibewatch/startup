  - id: integrations-apis
    title: Integrations, Developer APIs, and Platform Lock-in
    body: >
      Attentive offers 100+ pre-built integrations across ecommerce, CRM, loyalty, CDP, and advertising
      categories. Key tier-one partnerships include Shopify (native app launched July 2020, 4.7/5 rating
      from 113 reviews on the Shopify App Store), Salesforce Marketing Cloud (bi-directional contact sync),
      Snowflake (subscriber profile and historical data sync for personalization), Google Ads (first-party
      subscriber audience export for retargeting), AfterShip (shipment-triggered journeys generating $4M
      for Brighton), and Yotpo (loyalty data extension into SMS). 73% of customers rate Attentive's
      integrations higher than their previous provider, per company-published benchmarks.

      The developer API surface consists of REST endpoints returning JSON over HTTPS with OAuth 2.0 for
      custom app authorization. The API supports subscription management, event triggering, attribute saving,
      and personalized message dispatch. Webhook subscriptions deliver real-time event payloads (e.g.,
      subscribe/unsubscribe events) to registered endpoints. Attentive provides iOS (Swift, CocoaPods /
      SPM, v2.0.15, Xcode 26.1.1+ compatible), Android (Kotlin, Maven Central, API 26+ required), and
      React Native (npm package @attentive-mobile/attentive-react-native-sdk, RN 0.74+) SDKs, each
      providing identity collection, event tracking, creative rendering, and push notification delivery.

      Lock-in is reinforced through four mechanisms. First, the Attentive Tag embeds behavioral data
      collection into brand websites, accumulating proprietary subscriber signal history that cannot be
      migrated to a competitor. Second, the AI models (AI Journeys, AI Pro) improve continuously from
      brand-specific message performance data, creating a brand-specific training corpus that deepens
      over time. Third, the Two-Tap patent portfolio prevents legal replication of the core sign-up
      flow. Fourth, custom coupon code generation (Shopify dynamic coupons, up to one million unique
      codes per send with auto-refill) and pre-built journey logic create switching costs in operational
      workflows. The Snowflake integration further increases switching friction by making the platform
      a node in the brand's existing data warehouse architecture. Roadmap table TE005 maps planned
      and shipped releases relevant to integration depth.
