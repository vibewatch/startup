callouts:
  - calloutType: strength
    title: "Patented Two-Tap IP with Active Enforcement"
    body: >
      Attentive holds 10 issued US patents covering the Two-Tap subscriber sign-up mechanism, with additional
      patents pending. The December 2024 Emotive settlement—including a monetary payment and Emotive's
      acknowledgment of patent validity—demonstrates active enforcement willingness. A Forrester Consulting
      study found up to 25% annual SMS subscriber growth from Two-Tap tools, translating to $4.5-$11.8M in
      additional brand revenue. This IP position is the most durable technical differentiation Attentive holds,
      as competitors cannot legally replicate the core sign-up flow without licensing.
    claimRefs:
      - CE021
      - CE022
      - CE025

  - calloutType: risk
    title: "iOS 26 Inbox Filtering Is a Structural Platform Risk"
    body: >
      Apple's iOS 26 "unknown sender" folder relegates marketing messages to a less-visible inbox, reducing
      CTR and conversion by 30-40% per Attentive's own data. Attentive's mitigation—Visibility AI and inbox
      monitoring tools—is reactive and dependent on Apple's future policy choices. If Apple tightens filtering
      further or requires explicit user consent for marketing RCS, the platform's reach could decline without
      a controllable fix. This risk compounds for RCS, where Attentive's entire RCS strategy depends on iOS
      26 support for Apple-native RCS rendering.
    claimRefs:
      - CE033
      - CE034
      - CE017

  - calloutType: insight
    title: "Data Infrastructure Reveals Real-Time Processing Scale"
    body: >
      Attentive's GitHub organization (attentive-mobile) maintains open-source forks of Apache Flink, Pulsar,
      ClickHouse, and Hudi connectors—with the Flink CDC connectors repo at 2,225 forks, indicating both
      significant internal usage and external developer attention. This confirms a Flink-Pulsar-ClickHouse
      real-time streaming architecture consistent with sub-second audience segmentation and send-time
      optimization. The zero-downtime BFCM 2025 performance (5.7B messages, 46% YoY) suggests the
      architecture has been stress-tested at meaningful scale.
    claimRefs:
      - CE008
      - CE046
      - CE042

