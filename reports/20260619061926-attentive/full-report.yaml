          note: 1.7x growth premium to peers; low ARR; 67% downside
        - label: 5x ARR — $550M ARR (base/premium)
          value: 2750
          unit: USD M
          note: Growth premium; mid ARR; 60% downside to current mark
        - label: 5x ARR — $650M ARR (bull/premium)
          value: 3250
          unit: USD M
          note: Growth premium; high ARR; 53% downside
        - label: 7x ARR — $450M ARR
          value: 3150
          unit: USD M
          note: 2.4x growth premium; low ARR; 54% downside
        - label: 7x ARR — $550M ARR
          value: 3850
          unit: USD M
          note: Moderate-aggressive multiple; mid ARR; 44% downside
        - label: 7x ARR — $650M ARR
          value: 4550
          unit: USD M
          note: Moderate-aggressive; high ARR; 34% downside to $6.9B mark
        - label: 9x ARR — $650M ARR (bull)
          value: 5850
          unit: USD M
          note: Aggressive growth-premium; high ARR; 15% downside to current mark
        - label: Current mark ($6.9B)
          value: 6900
          unit: USD M
          note: Sacra/Forbes estimate; requires 9-10x ARR at $650M or 14x ARR at $500M to justify
        - label: Peak mark ($10B, Sep 2021)
          value: 10000
          unit: USD M
          note: Series E post-money; 30% compressed to current estimate; 55.2x revenue at time
    approximationNotes: >
      All valuations except the peak mark ($10B, Series E) and current estimate ($6.9B) are author-computed from ARR
      range × multiple. ARR range ($450–650M) is extrapolated, not audited. Peer median multiple of 2.9x is the TTM P/S
      average of Klaviyo, Braze, and HubSpot as of June 18, 2026 market close.
