      - number: '7.2'
        title: Legal Proceedings and Litigation Exposure
        blocks:
          - type: paragraph
            body: >
              Attentive's legal docket as of June 2026 reflects three distinct categories of litigation: TCPA
              co-defendant matters, competitive/IP disputes, and adversarial proceedings in third-party bankruptcy
              cases. The highest-profile active litigation is the patent and trade-secret dispute between Attentive and
              Stodge Inc. d/b/a Postscript (D. Del. 2023), in which both parties are pursuing aggressive discovery;
              Postscript filed a motion in December 2024 to exclude Attentive's TCPA expert under Daubert. Separately,
              Attentive v. 317 Labs, Inc. d/b/a Emotive (D. Del. 2022) is a patent-infringement suit filed by Attentive
              against a direct SMS competitor. This suit has proceeded through extensive fact discovery, with Attentive
              serving multiple sets of interrogatories and admission requests through mid-2024.

              Two adversarial proceedings in bankruptcy cases directly name Attentive as a defendant. AMRS Creditors
              Trust v. Attentive Mobile Inc. (Bankr. D. Del. 2025, case 25-51963, filed August 8, 2025) and Brash,
              solely as Creditor Trustee v. Attentive Mobile, Inc. (Bankr. N.D. Ill. 2026, case 26-00162, filed February
              1, 2026) both pursue claims on behalf of bankrupt estates against Attentive—likely preference actions or
              unpaid-services claims from retailers that later filed for bankruptcy and used Attentive's platform. While
              the aggregate dollar amounts are unquantified from public dockets, the presence of multiple bankruptcy
              adversarial proceedings signals that some portion of Attentive's customer base is financially distressed,
              creating collection risk. The Nutracap Holdings bankruptcy (N.D. Ga. 2025) listed Attentive Mobile as an
              unsecured creditor for $11,150—confirming the recurring pattern.

              Overall, Attentive's litigation posture is consistent with a company that both pursues IP enforcement and
              is routinely named as a third-party in downstream brand TCPA disputes. No single lawsuit appears
              existentially threatening, but the aggregate legal burden—discovery obligations, defense costs, and
              management distraction—is a material operating cost that does not appear in any public financial
              disclosure. CourtListener documents 107 cases involving Attentive Mobile after January 2022, a volume
              consistent with high-throughput SMS platform operators at scale.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
