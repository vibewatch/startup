      - number: '6.3'
        title: Named Customer Proof and Case Studies
        blocks:
          - type: paragraph
            body: >
              Attentive's case study library demonstrates strong outcomes across apparel, beauty, DTC, and
              health/wellness verticals, but all published case studies originate from company-issued materials on
              attentive.com, which limits independent corroboration. The named outcomes span production deployments—not
              pilots—and involve real marketing programs with measurable attribution through Shopify revenue data or
              in-platform attribution. The most widely cited results include Tushbaby's 287x ROI and 900x return on the
              Welcome Journey, YoungLA's 56% increase in total attributed revenue post-migration, UNTUCKit's 30% lift in
              lifecycle-driven revenue within six months, The Frye Company's 576% email campaign revenue growth, and
              amika's 92% subscriber engagement rate within 30 days of email launch.

              RCS case studies supplement the core SMS/email examples. FragranceNet achieved a 106% lift in
              click-through rates and 47% revenue per send improvement with RCS rich carousels, while Spanx's previously
              unengaged segment recorded 236% CTR and 201% revenue per send uplift— results attributed to audience
              segmentation and channel auto-upgrade logic, not to list quality alone. These early RCS results exceed SMS
              baselines meaningfully and validate the channel-mix expansion thesis.

              Across production case studies, outcomes are attributed to specific programs (Welcome Journey, flash
              sales, preference collection, lifecycle flows) rather than to generic campaign blasts. This program
              specificity increases plausibility but also reflects the platform's reliance on brands that invest in
              White Glove onboarding and strategic account management. Smaller brands with limited bandwidth may see
              more modest outcomes. The wellness vertical's first batch of results (The Tox: 60% lift in first-time
              visits; Mindbody beta: 46% opt-in conversion rate) validates the Mindbody partnership hypothesis but
              represents a narrow, early-adopter sample.
