              Three diligence items are prerequisite to underwriting: (1) Carrier SLA terms with AT&T, Verizon, and
              T-Mobile—specifically content-filtering notification provisions and throughput guarantees; (2) TCPA
              insurance coverage limit and claims history— this is a standard D&O/E&O item for SMS platforms; and (3)
              current cash burn rate and cash-on-hand to assess runway independent of new capital. These three data
