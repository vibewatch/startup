      - number: '2.3'
        title: Buyer Segmentation and Verticals
        blocks:
          - type: paragraph
            body: >-
              The primary buyers of ecommerce marketing automation platforms are ecommerce marketing and retention teams
              — roles including VP/Director of Marketing, VP of Retention, Email/SMS Marketing Manager, and increasingly
              AI Marketing Specialist. Budget ownership sits with marketing leadership (CMO, CGO) and is funded out of
              marketing operating budgets rather than IT or engineering budgets. IT and security teams influence
              procurement for data compliance and integration requirements but are secondary decision-makers.

              Attentive serves 70+ verticals, with retail, apparel, beauty, health and wellness, home goods, and
              direct-to-consumer (DTC) brands forming the core. These verticals share a common profile: large subscriber
              lists, high purchase frequency, strong seasonal concentration (particularly Q4 holiday), and heavy
              reliance on email and SMS to drive repeat purchases and recover abandoned carts. Klaviyo's 167,000+
              customer base is predominantly SMB and mid-market ecommerce, while Braze's 2,296 customers skew enterprise
              — Attentive positions between these poles, targeting mid-market to enterprise ecommerce brands.

              The adoption path typically begins with email-only tooling (Mailchimp, Constant Contact), then adds SMS as
              a second channel, then consolidates to an omnichannel platform as list size and message volume justify the
              platform subscription cost. AI-driven personalization tools are adopted last, typically as enterprise-tier
              upsells. Attentive's pricing is modular — based on messages sent, subscriber list size, channel count, and
              AI tool access — enabling entry at smaller list sizes and natural expansion with brand growth. Mobile
              commerce tailwinds are significant: 56.4% of 2025 holiday online transactions occurred on mobile devices,
              validating the mobile-first subscriber engagement model.
