            body: >
              Attentive's scale-of-operations metrics reflect a mature, high-growth SaaS platform. The company's about
              page records surpassing $500 million in annual recurring revenue (ARR) as a milestone, though the precise
              current ARR figure is not publicly disclosed. Sacra Research estimated ARR at $200 million at the end of
              2022, growing 60% year-over-year from $125 million at the end of 2021. The Forbes Cloud 100 profile (March
