  - id: TM004
    title: Growth Drivers and Constraints
    columns:
      - Driver or Constraint
      - Direction
      - Timing
      - Implication for Attentive
      - Diligence Ask
    rows:
      - - Mobile commerce growth
        - Tailwind
        - Structural / ongoing
        - Larger addressable subscriber pool; 76% of adults purchase via mobile
        - Track mobile ecommerce share of total retail annually
      - - SMS open rate advantage (~98% vs ~36% email)
        - Tailwind
        - Current
        - Strong justification for brands to add SMS alongside email
        - Verify with independent measurement; figure is widely cited but often vendor-sourced
      - - AI personalization demand
        - Tailwind
        - Accelerating (2024–2026)
        - Attentive AI and Klaviyo AI create upsell vectors; differentiation from basic ESPs
        - Confirm AI feature attach rate and revenue uplift from AI tiers
      - - RCS adoption by US carriers
        - Tailwind
        - Early-stage (2025–2027)
        - Richer messaging within SMS channel; Attentive and Klaviyo both launched RCS
        - Track carrier RCS rollout timeline and brand adoption rate
      - - Ecommerce growth deceleration
        - Headwind
        - Current (2022–2025 single-digit growth)
        - Slower ecommerce growth limits new brand acquisition and platform expansion potential
        - Monitor US ecommerce YoY growth rate; 2025 was 5.4%, down from 42% in 2020
      - - TCPA litigation risk
        - Constraint
        - Persistent
        - TCPA class actions require robust consent capture; moat for compliant platforms
        - Track active TCPA class actions naming ecommerce brands and SMS platforms
      - - Carrier 10DLC registration friction
        - Constraint
        - Current
        - Increases onboarding burden; filters non-compliant SMS; rewards established platforms
        - Assess Attentive's carrier relationship quality and 10DLC registration throughput
      - - Apple Mail Privacy Protection (MPP)
        - Mixed
        - Since iOS 15 (2021), ongoing
        - Degrades email open rate signal, boosts SMS appeal; forces shift to click/revenue metrics
        - Measure impact on Attentive's email product benchmarks vs pre-MPP baseline
      - - Multi-state privacy law complexity
        - Constraint
        - Accelerating (2023–2026)
        - CCPA, CPRA, state equivalents layer consent/deletion requirements onto subscriber management
        - Audit Attentive's compliance infrastructure for 25+ state privacy law coverage
      - - Platform consolidation (Klaviyo, HubSpot, Salesforce)
        - Headwind
        - Ongoing
        - Multi-channel incumbents expanding SMS reduces switching incentive from email-only tools
        - Compare Attentive net new logo adds vs Klaviyo SMS cross-sell rate quarterly
    notes: >-
      Timing classifications (structural, accelerating, current, early-stage) are qualitative assessments based on cited
      sources and industry context. Direction reflects expected impact on Attentive's revenue growth opportunity, not
      the industry overall. Diligence asks are forward-looking research items, not current findings.
