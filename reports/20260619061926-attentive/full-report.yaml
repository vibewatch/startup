      - number: '8.4'
        title: Thesis, Anti-Thesis, and Financing Overhang
        blocks:
          - type: paragraph
            body: >
              The investment thesis rests on four pillars: (1) AI-led platform expansion increasing wallet share per
              brand and reducing single-channel commoditization risk; (2) demonstrated multi-product penetration (50%+
              customers use multiple products as of May 2026) that provides pricing power and switching-cost moat; (3)
              strong network effects from proprietary mobile identity and two-tap subscriber sign-up that are difficult
              for competitors to replicate without existing subscriber density; and (4) a proven exit path in the
              marketing-automation category, evidenced by Klaviyo's September 2023 NYSE listing and Braze's November
              2021 NASDAQ listing.

              The anti-thesis is equally structured: (1) the valuation mark is a 2021 legacy artifact with no
              primary-market validation since June 2021, creating a 5-year mark-to-market gap that is exposed when
              investors need liquidity; (2) public comps have compressed 60–80% from their peaks and Attentive's implied
              multiple already trades at a 4–5x premium to Klaviyo despite a smaller scale and opaque financials; (3)
              preferred shareholders from the Series E (Bain Capital Ventures, Coatue, D1 Capital Partners, Tiger
              Global, Base10 Partners, IVP, Sequoia) hold an estimated $866M+ in liquidation preferences that must be
              fully satisfied before common equity participates in exit proceeds, creating an embedded overhang; and (4)
              Growjo estimates headcount declined 11% in the prior year, suggesting either operational restructuring or
              efficiency-driven workforce reduction that may reflect margin pressure rather than pure leverage.
