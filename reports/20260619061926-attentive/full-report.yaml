              - CR008
          - type: callout
            title: Funding Gap Is the Single Largest Financial Risk Signal
            body: >
              A 4.75-year gap between the Series E close (September 2021) and June 2026 with no disclosed new round is
              anomalous for a company of Attentive's scale and growth stage. The two most concerning interpretations are
              (a) the company is generating sufficient operating cash flow to self-fund—a positive signal if true—or (b)
              the company cannot raise at a price acceptable to existing investors. Without audited financials or a
              disclosed cash position, investors cannot distinguish between these scenarios. This opacity is the largest
              single underwriting gap in the diligence stack.
            calloutType: risk
            claimRefs:
              - CR030
