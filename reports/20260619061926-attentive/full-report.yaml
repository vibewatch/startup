            body: >
              Attentive was founded by Brian Culbertson Long, who served as Chief Executive Officer from founding
              through at least June 2021—the date of the most recent SEC Form D filing he signed as CEO. The June 2021
              Form D (Acc. No. 0001231919-21-000058) lists Long as CEO and identifies four board directors: Andrew
              Jones, Scott Friend, Patrick Grady, and John Trani. Scott Friend is a Managing Director at Bain Capital
              Ventures, while Patrick Grady is a partner at Sequoia Capital, reflecting the dominant institutional
              shareholders. The precise date of Long's transition out of the CEO role is not confirmed in public
              documents; however, the current Attentive leadership page names Amit Jhawar as Chief Executive Officer
              with no mention of Long. Forbes Cloud 100 2025 data confirmed Jhawar as CEO as of March 2026.

              Organizational scale has grown substantially. The company's about page notes the milestone of crossing
              1,000 employees—a threshold crossed before the company's first international (London) office opened.
              Forbes's Cloud 100 profile, updated as of March 2026, reports approximately 5,000 employees, indicating
              significant growth from the 1,000-employee milestone referenced on the about page. Attentive operates four
              global offices in New York City, San Francisco, London, and Sydney. Brian Malkerson is also listed on
              Attentive's leadership page, though a specific title is not confirmed in publicly available text-mode
              extracts. The CEO transition from Brian Long to Amit Jhawar represents a material leadership change that
              carries key-person risk implications for the company's next growth phase under Jhawar's agentic-AI
              strategic pivot.
