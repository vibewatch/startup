  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Stance and Recommendation
        blocks:
          - type: paragraph
            body: >
              Attentive presents a structurally compelling platform—the leading US mobile-first ecommerce messaging
              network with 8,000+ brands, a confirmed $500M+ ARR milestone, 48% year-over-year GMV growth to $29B+ in
              the year ending September 2025, and an AI-native product roadmap unveiled at Thread 2026. However, the
              company's current estimated valuation of $6.9–7.0B is not supportable from public evidence at the level of
              confidence required for an investment-grade buy recommendation. The valuation mark derives from a
              September 2021 Series E transaction—a peak in private-market multiple inflation—and has never been reset
              by a new primary round or a meaningful secondary transaction (the only publicly documented secondary was
              $1.43M in September 2023 at an undisclosed price). No IPO S-1 has been filed and no audited financials are
              publicly available.

              Against a public comparable set that has compressed from 10–20x revenue in 2021 to 2.7–3.0x TTM revenue in
              June 2026, Attentive's implied 10.6–15.6x ARR multiple represents a 4–5x premium with no transactional
              validation. The recommended posture is research-more: the thesis is directionally correct (large TAM,
              durable retention signal, AI-led expansion), but the price is inconsistent with the current evidence base.
              A credible buy case requires either (a) audited financials confirming ARR >$600M, gross margin >70%, and
              positive FCF trajectory, or (b) a new equity round or IPO filing that validates or resets the price.
            claimRefs:
