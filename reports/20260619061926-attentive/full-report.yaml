            title: 'Regulatory Headwinds: TCPA Litigation and Carrier Filtering Raise SMS Compliance Costs'
            body: >-
              TCPA class action exposure and 10DLC carrier registration requirements are material ongoing constraints
              for SMS marketing platforms. Each non-compliant text message carries statutory damages of $500–$1,500,
              making opt-in consent capture a legal necessity rather than a feature preference. Platforms that build
              consent into subscriber acquisition tooling — as Attentive has done with its patented two-tap sign-up —
              have a regulatory moat. But compliance complexity also slows customer onboarding and limits the total
              reachable subscriber pool for any given brand.
