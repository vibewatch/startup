            body: >
              Attentive's most actionable forward-looking financial signal is revenue per brand expansion: 42% SMS and
              29% email growth year-over-year at Cyber Week 2025. While Cyber Week represents a peak-period sample and
              may overstate full-year trends, sustained revenue expansion from existing customers is the hallmark of a
              platform with strong NRR and product stickiness. Combined with the email customer base surpassing 1,000
              customers in June 2025 and the AI Pro for Email launch creating a new upsell vector, Attentive's
              land-and-expand mechanics appear structurally intact—a positive underwriting signal for gross revenue
              retention even absent audited NRR disclosure.
