  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Attentive operates in the ecommerce marketing automation segment, which encompasses software platforms
              that enable direct-to-consumer and retail brands to send personalized promotional, transactional, and
              lifecycle messages across owned channels — primarily SMS, email, rich communication services (RCS), and
              mobile push notifications. The market boundary excludes paid advertising (search, social, display),
              affiliate marketing, and organic content, all of which rely on third-party platforms and algorithms rather
              than direct subscriber relationships. It also excludes general-purpose enterprise marketing suites
              (Salesforce Marketing Cloud, Adobe Experience Cloud) except where they compete directly in the
              ecommerce-focused messaging tier.

              The included spend covers platform subscription fees, per-message sending costs, and data platform or CDP
              add-on charges that form the revenue base for vendors such as Attentive, Klaviyo, and Braze. Adjacent
              spend — like loyalty programs, review platforms, and customer service tooling — is complementary but
              outside the core market boundary. The status-quo substitutes for a full SMS/email marketing platform
              include basic email service providers (ESP-only tools like legacy Mailchimp tiers), carrier short-code
              programs managed in-house, and CRM marketing modules from Salesforce or HubSpot. As brands scale beyond
              50,000 subscribers, the complexity of segmentation, compliance, and personalization typically triggers a
              platform upgrade from these substitutes.

              Attentive's market is further distinguished by its focus on mobile-first consent-based messaging. Unlike
              programmatic advertising, every subscriber must affirmatively opt in, creating subscriber lists that are
              both legally defensible and highly engaged. This consent architecture defines the legal and economic
              boundary of the market and is codified by CAN-SPAM (email), TCPA (SMS), and carrier industry guidelines.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM020
