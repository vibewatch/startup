  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Channel Stack
        blocks:
          - type: paragraph
            body: >
              Attentive's platform delivers four messaging channels from a single orchestration layer: SMS, email, RCS
              for Business, and push notifications. The architecture centers on a mobile-first identity model in which
              the Attentive JavaScript tag (deployed on brand websites) continuously captures behavioral signals—browse
              events, cart additions, and purchase completions—and links them to a unified subscriber profile called a
              Single Customer ID. This profile travels across channels, enabling the platform to recognize returning
              visitors and trigger personalized journeys regardless of the entry point.

              Message delivery relies on direct carrier relationships (AT&T, Verizon, T-Mobile for SMS and RCS) and on
              the Google Jibe RCS platform for Rich Communication Services. Email passes through Attentive's own
              deliverability infrastructure, which the company claims achieves a 99% delivery rate and is supported by a
              team of 300+ email specialists who manage warm-ups, authentication, and blacklist monitoring. Push
              notifications, added as a GA product in early 2026, are integrated into the same journey builder via the
              iOS and Android SDKs; the Tapcart integration allows brands to deploy push within days without additional
              development work.

              The underlying data infrastructure—visible through Attentive's open-source GitHub contributions— relies on
              Apache Flink for real-time stream processing, Apache Pulsar as the distributed message broker, ClickHouse
              as the columnar analytical store, and Apache Hudi for incremental data lake operations. The
              attentive-mobile GitHub organization has forked and maintained Flink-Pulsar connectors (81 forks),
              Flink-ClickHouse connectors (174 forks), and Flink CDC connectors (2,225 forks), reflecting the scale of
              the real-time data pipeline. This stack underpins latency- sensitive operations such as real-time audience
              segmentation, send-time optimization, and behavioral journey triggers. During BFCM 2025, the platform
              processed 5.7 billion messages—a 46% year-over-year increase—with zero downtime throughout the holiday
              period, demonstrating meaningful operational scale.
