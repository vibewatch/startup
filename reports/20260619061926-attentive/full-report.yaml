  - id: FV003
    title: Valuation and Return Range — Bull / Base / Bear
    type: range
    layout: standard
    summary: >
      Low / mid / high valuation ranges for each scenario with explicit assumptions and implied upside/downside to the
      current $6.9B mark and the $866M total preference stack.
    data:
      items:
        - label: Bear scenario (3–5x ARR, $450M ARR)
          low: 1350
          mid: 1800
          high: 2250
          unit: USD M
          detail: >
            Peer-multiple compression; public-market clearing price; no premium for private illiquidity. After $866M
            preference satisfaction, common equity may receive zero in the low-mid range.
        - label: Base scenario (5–6x ARR, $550M ARR)
          low: 2750
          mid: 3000
          high: 3300
          unit: USD M
          detail: >
            Moderate growth premium reflecting AI uplift and sustained brand expansion; 53–60% discount to current mark.
            Common equity begins to participate above $866M preference threshold.
        - label: Bull scenario (8–10x ARR, $650M ARR)
          low: 5200
          mid: 5850
          high: 6500
          unit: USD M
          detail: >
            Requires confirmed audited outperformance, IPO filing, and sector multiple re-rating. Even the high end
            ($6.5B) is 6% below the current $6.9B mark; the $10B peak is not recoverable under any single realistic
            scenario.
        - label: Current mark (Forbes / Sacra estimate)
          low: 6900
          mid: 6950
          high: 7000
          unit: USD M
          detail: >
            2021 Series E-anchored estimate; not validated by any primary transaction since June 2021. Requires 9–10x
            ARR at $650M+ or 14x ARR at $500M—both are above the bull case.
    approximationNotes: >
      All scenario ranges are author-constructed estimates, not DCF or LBO outputs. Low/mid/high within each scenario
      reflect different ARR assumptions and multiple sensitivity, not statistical confidence intervals. Preference stack
      ($866M) is not deducted from scenario ranges above; investor-specific returns depend on tranche, price paid, and
      liquidation preference waterfall not publicly disclosed.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
