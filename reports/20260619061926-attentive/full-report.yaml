    Attentive is a late-stage private marketing-automation platform focused on SMS, email, RCS, and push engagement for
    consumer brands. Founded in 2016 by Brian Culbertson Long, the company built its franchise around mobile-first
    subscriber acquisition, behavioral personalization, and deep ecommerce integrations. It now serves 8,000+ brands
