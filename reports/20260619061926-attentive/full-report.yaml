          - type: callout
            title: Ecommerce Growth Deceleration Is a Key Market Constraint
            body: >-
              US ecommerce growth has slowed to single-digit rates since 2022 (4.9% in 2022, 9.0% in 2023, 7.6% in 2024,
              and 5.4% in 2025). This deceleration from the 2020 COVID-era surge (42% growth) limits the rate of new
              ecommerce brand formation, the most natural source of new marketing platform customers. Klaviyo's NRR
              declined from 117% to 108% between 2023 and 2024, reflecting this easing pressure. For Attentive,
              sustained growth will increasingly depend on platform expansion within existing customers rather than
              greenfield acquisition.
            calloutType: insight
            claimRefs:
              - CM035
              - CM036
          - type: callout
            title: Owned-Channel SMS + Email Delivers Best-in-Class ROI for Ecommerce
            body: >-
              Email marketing delivers an average $36 ROI for every $1 spent, the highest of any marketing channel. SMS
              adds incremental reach with up to 98% open rates and verifiable click-through signals. Together, they form
              the most cost-efficient owned-channel stack for ecommerce retention — a structural advantage Attentive is
              well-positioned to monetize as ecommerce brands consolidate marketing spend on owned channels to offset
              rising paid media costs.
            calloutType: strength
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Attentive operates in a large and intensifying ecommerce marketing automation market, competing against a
              multi-tier field spanning public-company incumbents, well-funded privates, and specialized point
              solutions. The primary competitive set consists of eight direct peers that share Attentive's target
              customer—mid-to-large ecommerce and retail brands seeking owned-channel (SMS, email, RCS, push) retention
              marketing at scale.

              The two most formidable direct competitors are Klaviyo (KVYO) and Braze (BRZE), both publicly traded and
              well ahead of Attentive in disclosed revenue. Klaviyo reported FY2025 revenue of $1.234 billion (31.6%
              year-over-year growth), serves 196,000+ brands across 100 countries, and has pivoted its positioning from
              "email and SMS platform" to "autonomous B2C CRM"—a direct challenge to Attentive's omnichannel ambitions.
              Braze reported FY2026 (January 2026 fiscal year-end) revenue of $738.18 million (24.4% YoY growth) and
              differentiates on breadth: it covers WhatsApp, LINE, and KakaoTalk in addition to SMS, email, RCS, and
              push—channels Attentive does not support.

              The private tier includes Iterable (enterprise lifecycle marketing, $200M Series E 2021, ~$2B valuation),
              Postscript (Shopify-exclusive SMS with AI testing, no email), Omnisend (ecommerce email+SMS+web push with
              transparent pricing and worldwide SMS reach), Insider One (global omnichannel with strong WhatsApp and
              Gartner 2026 Leader recognition), and Wunderkind (performance-marketing identity resolution with
              managed-service delivery). Each occupies a distinct positioning niche, creating a segmented but partially
              overlapping competitive landscape.

              Two status-quo substitutes remain material: (1) internal build using API-layer platforms such as Twilio
              (150+ countries, $0 per-message margin, requires dedicated engineering), and (2) standalone ESPs like
              Mailchimp or Klaviyo-only email, with SMS bolted on via third-party tools. Both options compress
              list-growth tool differentiation and raise the make-vs-buy question for larger brands with engineering
              resources.

              Likely future entrants include Salesforce Marketing Cloud and HubSpot, which are investing in SMS and
              AI-automation layers. Meta and Google could leverage their ad-ID graphs to build owned-channel features
              natively, representing a longer-horizon displacement risk.
