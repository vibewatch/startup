      - number: '3.3'
        title: Switching Costs, Moat Durability, and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              Attentive's most durable moat is its subscriber list and integration depth. Migrating away from Attentive
              requires porting an SMS subscriber list (with opt-in compliance records), reconstructing journey
              automations, reconfiguring 100+ integrations, and retraining marketing teams on a new interface. G2
              reviews confirm that the Attentive integration ecosystem is rated higher than prior providers by 73% of
              customers, representing verified switching friction. The Two-Tap subscriber acquisition patent creates a
              legal and technical barrier for competitors attempting to replicate Attentive's proprietary list-growth
              mechanism on a like-for-like basis.

              Despite these advantages, documented adverse evidence reveals meaningful churn pressure. G2 user reviews
              published in 2026 highlight two recurring complaints: (1) carrier fees nearly doubling the quoted contract
              rate—a pricing transparency failure that triggers buyer remorse in cost- sensitive mid-market segments;
              and (2) email builder limitations, including limited drag-and-drop functionality, a small template
              library, and errors requiring Attentive's White Glove team rather than self-serve repair. This second
              complaint is particularly damaging because Attentive has positioned email as a co-equal channel alongside
              SMS—yet its email builder UX lags Klaviyo's, which earns consistent praise in G2 reviews for intuitive
              flow building and revenue attribution clarity.

              Multi-homing risk is moderate: Attentive competes against platforms offering transparent, lower-priced
              self-serve options (Omnisend, Klaviyo free tier), and some brands maintain separate SMS and email tools
              rather than consolidating on one platform. The lack of WhatsApp is a growing gap as global brands cite
              WhatsApp as their primary mobile engagement channel outside North America. Attentive's 20+ country SMS
              footprint versus Braze's global or Omnisend's worldwide reach limits expansion conversations with
              international enterprise prospects—a geographic constraint that will compound as global ecommerce brands
              grow.

              The RCS opportunity (launched by Attentive's Visibility AI in May 2026) could strengthen moat durability
              if RCS adoption scales—creating richer branded experiences unavailable on SMS-only or late-to-RCS
              competitors. However, RCS delivery remains carrier- and device-dependent; without universal iPhone and
              carrier support, its near-term contribution to switching costs is speculative.

              Commoditization pressure from below is real: Klaviyo's free tier and Omnisend's transparent pricing set an
              implicit price ceiling on what mid-market brands are willing to pay for undifferentiated SMS/email
              automation. Attentive must continuously justify its enterprise premium through superior AI personalization
              ROI, white-glove service, and integration depth to avoid being displaced by a lower-cost alternative.
