      - number: '8.2'
        title: Valuation Context, Multiple Compression, and Comparable Analysis
        blocks:
          - type: paragraph
            body: >
              Attentive's $10B Series E valuation in September 2021—implying 55.2x revenue on Sacra's $125M ARR estimate
              at the time (80x on the CB Insights $250M revenue figure)—was typical of peak-cycle SaaS pricing, where
              high-growth platforms commanded 30–80x forward revenue. The subsequent four-year private-market correction
              has re-priced every public comparator by 60–80% from their peaks. As of the June 18, 2026 market close,
              Klaviyo trades at $13.27/share ($3.97B market cap), down approximately 56% from its September 2023 IPO
              price of $30/share; Braze trades at $20.06/share ($2.26B market cap); and HubSpot at $9.02B market cap.
              The implied NTM revenue multiples for the peer set are approximately 2.5–3.0x, yielding a sector median of
              roughly 2.8x.

              Applying these public multiples to Attentive's estimated $450–650M ARR range produces implied fair values
              of $1.35–1.95B at peer median (3x) or $2.25–3.25B at a 5x premium-growth multiple. Even the most
              optimistic peer-premium valuation of $4.5B (7x ARR midpoint $550M) remains 35–37% below the current
              $6.9–7.0B mark. The sole upward path to current mark requires: (1) ARR closer to $700–800M, (2) strong
              gross margin expansion confirmed at >72%, and (3) a re-rating of the sector toward 9–10x NTM revenue—none
              of which is evidenced. Klaviyo's NRR of 110% and FCF margin of 16.9% demonstrate the gold standard for the
              category; Attentive has disclosed no comparable metrics.
