      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Public Comparables'
        blocks:
          - type: paragraph
            body: >-
              The ecommerce marketing automation market lacks a single authoritative sizing, so this chapter builds the
              estimate from multiple lenses. The broadest lens is total marketing technology expenditure, which
              Forrester projected at approximately $148 billion globally by end of 2024, spanning all software
              categories from CRM to analytics. Within this, email and SMS automation for ecommerce brands represents a
              narrower segment. Using public comparable revenue as a sizing proxy: Klaviyo ($937.5M FY2024, serving
              167,000+ customers primarily in ecommerce) and Braze ($593.4M FY2025, serving 2,296 enterprise customers
              across industries) together approach $1.5 billion in annualized revenue, covering only the organized,
              platform-based portion of the market. Factoring in other notable players (Iterable, Omnisend, Postscript,
              Yotpo), the structured ecommerce marketing automation software market is estimated at $5–8 billion
              annually in North America.

              A bottom-up lens using US ecommerce as the revenue base reinforces this estimate. US ecommerce reached
              $1.234 trillion in 2025 (Digital Commerce 360 / US Census Bureau data). If ecommerce brands typically
              allocate 7–10% of revenue to marketing, and approximately 15–25% of that marketing budget goes to owned
              channels (email and SMS), the annual owned-channel marketing software spend for US ecommerce brands alone
              is roughly $13–31 billion — though this overstates the addressable software-platform market significantly,
              as most spend is on media (ads) rather than SaaS tools. A more constrained estimate for the US ecommerce
              marketing automation software TAM is approximately $8–15 billion, including email, SMS, CDP, and related
              tooling. Attentive's current ARR of roughly $500M+ positions it with approximately 3–6% market share
              depending on the boundary definition.

              Sizing confidence is constrained by: lack of a primary analyst TAM for this specific segment, conflicting
              market definitions across vendors, and the reality that most Klaviyo and Braze customers are outside pure
              ecommerce.
