      - number: '5.4'
        title: Trust, Privacy, Carrier Constraints, and Compliance
        blocks:
          - type: paragraph
            body: >
              Attentive has built its compliance program as a stated competitive moat, particularly in the
              litigation-heavy US SMS market. The SOC 2 Type II audit for November 1, 2024 – October 31, 2025 is
              available via the SafeBase trust center at security.attentive.com (published June 2026). A 2023 Mandiant
              penetration test covers the platform, with the summary report available on request. GDPR and CCPA/CPRA
              compliance are documented in the privacy policy and DPA; the EU Data Privacy Framework is referenced for
              transatlantic data transfers.

              TCPA compliance tools include: (1) patented Two-Tap double opt-in that creates a verifiable consent
              record; (2) Litigator Defender, which cross-references subscriber lists against a database of known
              litigators and automatically suppresses their numbers; (3) the Enhanced Audit Assistant, which surfaces
              opt-in/opt-out history logs for TCPA demand response; (4) Negative Sentiment Reminders, which intercept
              messages from subscribers expressing opt-out-adjacent language before triggering a full unsubscribe.
              Standard flows enforce double opt-in for additional consent validation. CTIA compliance is managed by an
              in-house Carrier Relations Team that works directly with carriers to understand filtering policies and
              update the platform's sending guidelines.

              State-level quiet hours, automated since January 2026, restrict sends in six states (TX, FL, OK, MD, CT,
              WA) using subscriber location detection. ADA guardrails are built into the UI. CASL compliance is
              supported for Canadian subscriber lists.

              The largest current compliance-adjacent risk is iOS 26. Apple's enhanced message filtering relegates
              messages from "unknown senders" to a secondary inbox, with Attentive's own data showing 30-40% lower CTR
              and conversion for messages landing in that folder. Attentive responded with its January 2026 iOS inbox
              visibility toolset and the May 2026 Visibility AI, but the risk that future iOS versions further restrict
              marketing message visibility is structural and not fully controllable by Attentive.
