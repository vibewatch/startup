            title: Valuation Compression and 4.5-Year Fundraising Gap
            body: >
              Attentive's estimated current valuation of $6.9-7.0B represents approximately 30% compression from the
              September 2021 Series E peak of $10B. With no new equity round disclosed since June 2021, and
              approximately 5,000 employees generating an implied annual payroll burden of $750M-$1B, the capital
              adequacy position cannot be verified from public sources. If current ARR is $500M at a 70% gross margin,
              gross profit of ~$350M is likely insufficient to cover full operating expenses at this headcount scale,
              implying a material ongoing operating loss financed from 2021 proceeds. A new fundraise in the near
