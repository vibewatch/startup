            title: 'TCPA Platform Liability: Untested but Structural'
            body: >
              Attentive's compliance tools (Two-Tap, Litigator Defender, Audit Assistant) reduce but do not eliminate
              TCPA exposure for the 8,000+ brands running SMS programs through its infrastructure. If a court certifies
              a class action naming Attentive-as-platform rather than just the brand client, the statutory damage math
              ($500–$1,500 per text × millions of messages) creates existential financial risk. This scenario has not
              materialized as of June 2026, but the volume of TCPA-adjacent litigation (107 cases since 2022) confirms
              that plaintiffs routinely probe the platform layer. This is a monitoring-grade risk that warrants legal
              opinion review as a diligence condition.
