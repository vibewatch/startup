  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Vertical Mix
        blocks:
          - type: paragraph
            body: >
              Attentive's stated customer base stands at 8,000+ brands—a figure cited consistently in press releases,
              SEC-corroborated filings context, and the Shopify App Store—spanning more than 70 industries. The platform
              is primarily anchored in retail and e-commerce, where direct-to-consumer (DTC) apparel, beauty, home
              goods, and consumer electronics brands represent the largest vertical cohorts. Secondary verticals include
              food and beverage, travel and hospitality, entertainment, media, education, and non-profits. In late 2025,
              Attentive added the fitness and wellness vertical via a strategic commercial partnership with Mindbody,
              giving thousands of Ultimate and Ultimate+ Mindbody subscribers embedded access to Attentive's SMS and
              email tools.

              By market tier, Attentive's core segment is mid-market ($50M–$500M revenue) retail and DTC brands, but the
              marquee customer list skews enterprise: GUESS, Urban Outfitters, Steve Madden, Crate & Barrel, Carter's,
              Lands' End, Dyson, Brooks Brothers, L'Occitane, and Giorgio Armani are named publicly. The platform's
              custom pricing and mandatory sales qualification process are designed to screen for brands with meaningful
              marketing budgets and sufficient subscriber lists to justify enterprise contracts. Smaller SMBs are
              reachable primarily through channel partners (Mindbody) or agency relationships, not via a self-serve
              tier.

              Geographically, Attentive operates in 20+ countries, but coverage is dominated by the United States,
              Canada, the UK, and Australia/New Zealand. SMS capabilities outside North America and Europe remain
              limited relative to global competitors like Omnisend or Twilio (150+ countries). This constrains growth
              for multi-national enterprise brands that require consistent global coverage. Channel distribution is
              evolving: SMS was the founding channel and remains the primary revenue driver, but email crossed the
              1,000-customer mark in 2025, and RCS and push notifications are in active customer rollout as of 2026.
