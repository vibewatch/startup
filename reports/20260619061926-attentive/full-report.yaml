      - number: '8.5'
        title: Kill Triggers, Thesis-Break Criteria, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Six kill criteria define the conditions under which the research-more posture would shift to avoid or
              hold. The most immediate is a confirmed down-round at a valuation below the $7B mark, which would
              crystallize the preference overhang and signal loss of investor confidence. The second is a primary
              offering by a well-funded competitor (Klaviyo with $1.1B cash, Braze with $216M cash) at a materially
              lower price per subscriber or brand that forces Attentive into a price war. Third, a regulatory
              enforcement action under TCPA, CAN-SPAM, or GDPR at scale—given Attentive's carrier dependency, such an
              action could disrupt core SMS revenue and create uncapped liability. Fourth, a CEO transition that
              destabilizes institutional relationships (the company moved from founder-led Brian Long to Amit Jhawar in
              approximately 2023–2024); a second leadership change within two years would be a material diligence red
              flag. Fifth, ARR growth decelerating below 20% YoY on a confirmed basis would suggest market saturation,
              reducing the justification for any premium multiple. Sixth, an undisclosed funding event (new round or
              secondary) at a valuation below $5B would force an immediate down-round analysis.

              The diligence path to convert research-more to a buy or track rating requires: audited revenue and gross
              margin for the most recent fiscal year; cohort-level NRR across the brand cohort; confirmed current
              headcount and cost structure vs. ARR; capitalization table with preference stack detail; and an IPO S-1 or
              secondary transaction at a market-clearing price. Until these gaps are closed, no conviction price can be
              established.
