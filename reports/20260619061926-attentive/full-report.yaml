              list—and Attentive's own press release described this achievement. In 2024, Attentive customers
              collectively sent more than 53 billion text messages, according to Forbes. The company drove nearly $2
              billion in revenue for brands during Cyber Week 2025 (its best Cyber Week on record), sending 5.7 billion
              messages during that period. Revenue per brand grew 42% on SMS and 29% on email year-over-year during
              Cyber Week 2025. In the full year ending September 2025, Attentive powered over $29 billion in customer
              revenue—a 48% increase from the prior year. Email customers surpassed 1,000 as of June 2025.

              Attentive serves more than 8,000 leading brands (per its 2023 CB Insights fact sheet) across 70+
              industries including retail, wellness, and restaurant verticals. Customer traction includes brands such as
              Crate & Barrel, Dyson, and Steve Madden, per Forbes. On G2, Attentive holds a 4.5/5 rating from 1,383
              reviews, with the AI-generated review summary noting praise for ease of use and customer support but
              identifying cost escalation as subscriber lists grow as a notable concern. On Shopify's App Store,
              Attentive holds a 4.7/5 rating from 113 reviews, with 87% of ratings at 5 stars but 8% at 1 star. Newsweek
              recognized Attentive in its America's Greatest Workplaces for Diversity 2024 list.
