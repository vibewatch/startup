      - number: '6.2'
        title: Adoption Trajectory and Platform Usage Scale
        blocks:
          - type: paragraph
            body: >
              Attentive's platform usage metrics signal accelerating engagement. The company reported $29 billion in
              customer revenue in the year ending September 2025—up 48% from the prior period—and brands drove over $6
              billion in Q1 2026 alone. During Cyber Week 2025, Attentive powered nearly $2 billion in revenue across
              SMS, email, and push, sending 5.7 billion messages (up 46% year-over-year) with zero platform downtime
              throughout the peak shopping window. In 2024, Attentive customers collectively sent more than 53 billion
              text messages—a scale that reflects both subscriber base breadth and campaign frequency maturation among
              established accounts.

              Channel-level metrics reinforce breadth of adoption. Revenue per brand grew 42% on SMS and 29% on email
              during Cyber Week 2025 versus the same period in 2024. Email click-through rates rose 4.7% year-over-year
              while opt-out rates declined 17%, suggesting improved relevance and better audience health across the
              installed base. More than 50% of customers now use multiple Attentive products, indicating that the
              platform's land-and-expand motion is functioning: brands that started with SMS are adopting email, RCS,
              and push. Brands leveraging Attentive's omnichannel capabilities saw 37% subscriber growth, and 92% of
              brands migrating email to Attentive reported improved deliverability. Brands using AI features grew 2x
              faster than non-AI users during Cyber Week 2025, reinforcing Attentive's AI differentiation as a driver of
              deeper customer engagement and higher revenue.

              At the aggregate performance level, Attentive claims a 90% SMS open rate, 30% average click-through rate,
              25x+ average program ROI, and that 97% of SMS messages are read within 15 minutes of delivery. These
              benchmarks are company-issued and refer to aggregated customer averages, not guaranteed outcomes.
              Independent review evidence from Shopify (4.7/5, 113 reviews) and G2 (top-rated customer success team)
              corroborates high-level satisfaction, but granular per-cohort retention and NRR data are not publicly
              disclosed.
