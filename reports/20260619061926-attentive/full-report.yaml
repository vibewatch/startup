    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Product
        blocks:
          - type: paragraph
            body: >
              Attentive Mobile Inc., doing business as Attentive, is an AI-powered mobile marketing platform
              incorporated in Delaware in 2016 and headquartered in New York, New York. The company was originally
              founded under the name Franklin Mobile before rebranding. Its legal mailing address on SEC filings is 221
              River Street, Suite 9047, Hoboken, NJ 07030, reflecting an early base in the New York metro area. The
              company's privacy policy, published on attentive.com, identifies the legal entity as "Attentive Mobile
              Inc." and notes that it controls the SMS and email marketing service.

              Attentive's core product is a personalized text messaging and email marketing platform that serves brands
              across more than 70 industries—primarily retail and e-commerce. The platform supports four main channels:
              SMS, email, RCS (Rich Communication Services), and push notifications. Attentive differentiates through
              its patented Two-Tap technology for subscriber sign-ups, AI-powered content personalization (branded as AI
              Pro and AI Journeys), and a comprehensive integration ecosystem of 100+ connectors—including Shopify,
              Mailchimp, Zendesk, HubSpot, and Snowflake. Its Sequoia portfolio description characterizes Attentive as
              "a personalized text messaging platform for innovative brands. Using real-time behavioral data, Attentive
              automatically sends engaging text messages to each subscriber at every step of their customer journey." In
              2026, the company positioned itself as an "agentic AI" marketing platform at its annual Thread 2026
              conference, and expanded into RCS with the launch of Visibility AI in May 2026.
