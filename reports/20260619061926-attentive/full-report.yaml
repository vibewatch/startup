  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Structure
        blocks:
          - type: paragraph
            body: >
              Attentive generates revenue through a modular, subscription-based platform fee structure encompassing four
              configurable dimensions: message volume (outbound SMS, email, RCS, and push sends), subscriber list size,
              channel selection (SMS-only, SMS plus email, or the full multi-channel bundle of SMS, email, RCS, and
              push), and premium AI modules (AI Pro for personalization and AI Journeys for workflow automation). No
              per-message or per-subscriber rates are published on the public pricing page; all pricing requires a sales
              engagement, positioning Attentive as an enterprise-oriented, deal-by-deal platform rather than a
              self-serve tool. This opacity is standard in the high-ACV marketing platform segment but limits buyer
              benchmarking and independent diligence.

              The multi-channel bundle ("SMS, email, RCS & push") is promoted with "built-in savings" versus
              single-channel pricing, incentivizing ARPU expansion through cross-sell. AI Pro for Email launched to
              1,000+ customers in June 2025, and the company added AI Journeys and RCS as incremental revenue levers in
              2025-2026. A dedicated strategic support layer—including strategic planning, onboarding, deliverability
              expertise, and 24/5 customer service—is positioned as an enterprise-grade differentiator but also
              represents a cost structure consistent with a high-touch SaaS model rather than a fully automated
              platform.

              Revenue recognition for subscription SaaS platforms of this type is typically straightforward—ratable over
              the contract term—but usage-based overages (per-message bands) and multi-element arrangements (platform
              fee + professional services) can introduce revenue recognition complexity in GAAP reporting. No
              recognition-related disclosures have been made by Attentive.
            claimRefs:
