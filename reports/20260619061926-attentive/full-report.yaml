  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, TCPA, and Privacy Risk
        blocks:
          - type: paragraph
            body: >
              Attentive's core business—enabling 8,000+ brands to send high-volume SMS and email campaigns to opted-in
              consumer subscriber lists—sits at the center of a uniquely litigious US regulatory landscape. The
              Telephone Consumer Protection Act (TCPA) exposes both platforms and their brand clients to statutory
              damages of $500–$1,500 per violating text, and class-action TCPA suits are routinely brought against
              brands using commercial messaging platforms. CourtListener records show 16 cases specifically citing
              "attentive mobile" in a TCPA context since 2022, and 107 cases total naming Attentive Mobile after 2022,
              underscoring the pervasive litigation environment in which the company operates.

              Attentive is not typically the primary defendant in TCPA suits—brands that use its platform are the
              foreground targets—but platform providers face co-defendant risk when they are alleged to have sent or
              enabled unauthorized messages. In Raslavich v. Spanx (M.D. Fla. 2022), Attentive Mobile was named as a
              co-defendant before being dismissed without prejudice on September 13, 2022. In Salaiz v. RANEYS, LLC
              (W.D. Tex. 2022), Attentive was again named alongside a brand client. A Value City Furniture TCPA case
              (S.D. Ohio 2024–2025) prominently featured Attentive subscriber records and audit letters in discovery,
              demonstrating the company's systemic exposure to discovery obligations even when not a primary defendant.

              The FCC's tightening of one-to-one consent rules for commercial texting, the FTC's CAN-SPAM and anti-spam
              enforcement posture, and California's CCPA/CPRA (enforced by the California AG) each create incremental
              compliance obligations. Attentive has invested materially in mitigants: patented Two-Tap double opt-in (10
              issued patents as of January 2026), Litigator Defender (a database of known TCPA plaintiff phone numbers),
              Enhanced Audit Assistant for consent-record retrieval, and an in-house carrier relations team. The
              platform also holds SOC 2 Type II certification for the period November 2024–October 2025 and has
              certified under the EU-US Data Privacy Framework (DPF). However, compliance tools reduce but do not
              eliminate litigation exposure, particularly when a brand client misconfigures flows or re-imports consent
              records from a third-party list. GDPR compliance is documented in Attentive's DPA and privacy policy, with
              EDPO designated as EU data representative, but independent verification of implementation depth is not
              publicly available.
