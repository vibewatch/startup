      - number: '5.2'
        title: AI Suite and Agentic Intelligence
        blocks:
          - type: paragraph
            body: >
              Attentive's AI capabilities are segmented into three commercial products—AI Pro, AI Journeys, and
              Visibility AI for RCS—plus a roadmap of four agentic capabilities announced at Thread 2026.

              AI Pro is a suite of four sub-components deployed across campaigns and triggered messages. Identity AI
              extends subscriber recognition beyond the browser cookie, claiming a 10-15% lift in identified subscribers
              by building richer cross-channel profiles. Audiences AI dynamically refines campaign audiences using
              historical and real-time purchase signals, delivering a claimed 20% revenue increase. Send Time AI
              predicts the optimal delivery moment for each subscriber individually, improving CVR and CTR in 75%+ of
              deployments. Brand Voice AI generates on-brand copy from models trained on a brand's top-performing
              messages, reducing content creation time by 50% according to company claims.

              AI Journeys, introduced in March 2024, replaces static rule-based trigger trees with an adaptive model
              trained on 90 billion messages. The product personalizes copy, product recommendations, images, and CTAs
              in real time, continuously learning from each subscriber's click, browse, and purchase behavior. Attentive
              reports a median 200% revenue lift over rule-based journeys and a 5x+ incremental ROI. ILIA Beauty
              achieved a 280% purchase lift and 225x automated journey ROI following deployment.

              Visibility AI for RCS, launched May 20, 2026, addresses the inbox deliverability risk introduced by iOS
              26's "unknown sender" filtering. The system analyzes inbox visibility signals per subscriber and
              dynamically routes each message to either RCS (for subscribers whose devices render the primary inbox) or
              SMS (for those at risk of being sorted to a filtered folder). An "Auto-upgrade" feature automatically
              converts SMS/MMS to RCS when supported, preventing fragmented conversation threads. FragranceNet reported
              45% CTR lift, 37% conversion lift, and 36% revenue-per-message increase from branded RCS; rich media
              carousels added 106% CTR lift and 50% conversion lift.

              At Thread 2026 (May 26, 2026), Attentive announced four agentic capabilities for pre-BFCM 2026 rollout:
              Brand Voice 2.0 (expanded omnichannel brand voice controls), Reporting Agent (conversational
              natural-language analytics interface), Predictive Analytics (AI-powered forecasting for budgets and
              timing), and AI Campaigns (end-to-end campaign orchestration from customer signals). In Q1 2026, brands
              drove $6B+ in revenue through the platform, with 50%+ of customers using multiple products.
