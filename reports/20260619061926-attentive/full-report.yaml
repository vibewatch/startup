            body: >
              The annual payroll estimate of $750M-$1B is based on Forbes-reported headcount of approximately 5,000
              employees (as of March 2026) multiplied by a loaded cost of $150,000-$200,000 per employee—the standard
              range for US-headquartered B2B SaaS companies with significant engineering and sales teams. This is a
              gross estimate that does not account for international employees (lower average cost in London, Sydney),
              variable compensation timing, or stock-based compensation as a non-cash component. Actual cash burn may be
              materially different from this estimate; the range is provided solely to illustrate the order of magnitude
