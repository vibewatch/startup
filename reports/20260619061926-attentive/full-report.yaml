            title: Enterprise Renewal and Multi-Product Expansion Signal
            body: >
              The disclosure at Thread 2026 that Lands' End, Carter's, and Crate & Barrel—all enterprise marquee
              logos—have expanded or renewed their Attentive relationships is the strongest public retention signal
              available. Combined with the >50% multi-product adoption rate and $6B in Q1 2026 brand revenue, this
              suggests net dollar expansion is healthy even without NRR disclosure.
            calloutType: strength
            claimRefs:
              - CU003
              - CU017
              - CU034
          - type: callout
            title: Pricing Opacity and Carrier Fee Surprise Risk
            body: >
              Independent competitor analysis (Omnisend) identifies carrier fees as a material hidden cost that can
              nearly double Attentive's stated contract rate. This pricing opacity is a documented churn trigger for
              budget-sensitive mid-market brands and surfaces in negative app store reviews. Without a transparent
              pricing page, Attentive cedes comparison-shopping ground to Klaviyo (transparent tiered pricing) and
              Omnisend (clear monthly rates), and risks losing customers at renewal if actual total cost exceeds
              expectation.
