    title: Valuation Sensitivity — ARR Multiple vs. Implied Valuation
    type: bar
    layout: wide
    summary: >
      Illustrates how the implied Attentive valuation changes across ARR scenarios ($450M, $550M, $650M) and applied
      multiples (3x, 5x, 7x, 9x ARR), anchored against the current $6.9–7.0B mark and peer median 2.9x.
    data:
      items:
