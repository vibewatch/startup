companyProfile:
  summary: >-
    Attentive is a late-stage private marketing-automation platform focused on SMS, email, RCS,
    and push engagement for consumer brands. Founded in 2016 by Brian Culbertson Long, the company
    built its franchise around mobile-first subscriber acquisition, behavioral personalization, and
    deep ecommerce integrations. It now serves 8,000+ brands across 70+ industries, has surpassed a
    $500M ARR milestone, and drove $29B+ of customer revenue in the year ending September 2025.
    Attentive's current strategy under CEO Amit Jhawar emphasizes agentic AI, multi-product
    penetration, and omnichannel expansion, but the investment case is constrained by limited
    financial disclosure and a private valuation that remains well above public-peer multiples.
  foundedDate: "2016-01-01"
