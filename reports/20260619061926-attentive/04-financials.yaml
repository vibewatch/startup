  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - Missing Information
      - Why It Matters
      - Diligence Path
    rows:
      - - Exact ARR, recognized revenue, and revenue growth rate
        - Cannot size the business, verify the $500M+ ARR claim, or compute valuation multiples rigorously
        - Request audited GAAP revenue statements; confirm ARR definition and cut-off date
      - - Gross margin and cost-of-revenue breakdown
        - Cannot assess unit economics, pricing headroom, or path to profitability
        - Request income statement with CoGS detail (carrier pass-through, hosting, support costs)
      - - Operating expense breakdown (S&M, R&D, G&A)
        - Cannot estimate burn rate, payback period, or operational leverage trajectory
        - Request P&L by department; compare headcount by function to peer benchmarks
      - - Net revenue retention (NRR) by cohort
        - Cannot assess expansion quality, churn risk, or LTV durability
        - Request cohort revenue data by vintage; confirm definition (gross vs. net)
      - - Cash and cash equivalents / balance sheet
        - Cannot assess runway, capital adequacy, or likelihood of near-term fundraising need
