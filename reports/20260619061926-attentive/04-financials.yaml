company:
  name: Attentive

chapter:
  number: 4
  title: Financials
  summary: >
    Attentive has raised approximately $863-866M across seven SEC-filed rounds through June 2021, carries an estimated $6.9-7.0B
    valuation (compressed roughly 30% from the $10B September 2021 peak), and has disclosed surpassing $500M ARR as a milestone
    without releasing audited financials or specific margin data. The 4.5-year gap since the last public fundraise, combined with
    approximately 5,000 employees implying $750M-$1B in annual payroll exposure, creates material capital adequacy uncertainty
    that the primary available signal—48% year-over-year growth in platform GMV to $29B+ in brand revenue for the year ending
    September 2025—only partially offsets.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing Structure
    body: >
      Attentive generates revenue through a modular, subscription-based platform fee structure encompassing four configurable dimensions:
      message volume (outbound SMS, email, RCS, and push sends), subscriber list size, channel selection (SMS-only, SMS plus email,
      or the full multi-channel bundle of SMS, email, RCS, and push), and premium AI modules (AI Pro for personalization and AI Journeys
      for workflow automation). No per-message or per-subscriber rates are published on the public pricing page; all pricing requires
      a sales engagement, positioning Attentive as an enterprise-oriented, deal-by-deal platform rather than a self-serve tool.
      This opacity is standard in the high-ACV marketing platform segment but limits buyer benchmarking and independent diligence.

      The multi-channel bundle ("SMS, email, RCS & push") is promoted with "built-in savings" versus single-channel pricing,
      incentivizing ARPU expansion through cross-sell. AI Pro for Email launched to 1,000+ customers in June 2025, and the company
      added AI Journeys and RCS as incremental revenue levers in 2025-2026. A dedicated strategic support layer—including strategic
      planning, onboarding, deliverability expertise, and 24/5 customer service—is positioned as an enterprise-grade differentiator
      but also represents a cost structure consistent with a high-touch SaaS model rather than a fully automated platform.

      Revenue recognition for subscription SaaS platforms of this type is typically straightforward—ratable over the contract term—but
      usage-based overages (per-message bands) and multi-element arrangements (platform fee + professional services) can introduce
      revenue recognition complexity in GAAP reporting. No recognition-related disclosures have been made by Attentive.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI039
      - CI040
      - CI041
    tableRefs:
      - TI001
      - TI002
