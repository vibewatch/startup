  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >
        Working capital requirements, capex obligations, credit facility terms, cash balance, and remaining runway
        for Attentive as a messaging platform operating 4.5 years without a new disclosed equity raise.
      whyItMatters: >
        Understanding capex intensity and working capital needs is required to assess the true free cash flow
        profile, financing dependency, and how long current reserves can sustain operations at the current
        headcount and growth investment level.
      diligencePath: >
        Request audited balance sheet and cash flow statement; confirm presence of any revolving credit facility,
        vendor financing arrangements, or equipment leases; request CFO briefing on capex trajectory, infrastructure
        unit costs, and projected fundraising timeline.
      relatedQuestionRefs:
        - QI010
        - QI019
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >
        Customer acquisition cost (CAC), payback period, and LTV by customer segment; go-to-market spend
        breakdown between self-serve, inside sales, and enterprise field sales channels.
      whyItMatters: >
        Without CAC, payback, and LTV data, GTM efficiency, sales-cost leverage, and the long-term sustainability
        of the revenue model cannot be assessed. Revenue-per-brand expansion signals (29-42% YoY) suggest
        strong NRR but provide no information on the cost to acquire new logos.
      diligencePath: >
        Request segment-level CAC, payback period, and LTV from management; request trailing eight-quarter
        cohort data to assess NRR and logo retention by vintage; benchmark S&M as a percentage of revenue
        against Klaviyo and Braze's disclosed ratios.
      relatedQuestionRefs:
        - QI018
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: >
        Whether Attentive is currently operating at a net loss, approaching EBITDA breakeven, or generating
        positive free cash flow; no operating expense breakdown has been publicly disclosed.
      whyItMatters: >
        The estimated $750M-$1B annual payroll burden relative to estimated ARR at 65-75% gross margin implies
        a material operating loss. Without an income statement, the burn-rate analysis remains speculative and
        the probability of a near-term fundraise is difficult to assess.
      diligencePath: >
        Request most recent audited or management P&L; confirm GAAP operating loss, stock-based compensation
        as non-cash component, and adjusted EBITDA or FCF margin for the trailing twelve months.
      relatedQuestionRefs:
        - QI020
        - QI024
      relatedTableRefs:
        - TI005

