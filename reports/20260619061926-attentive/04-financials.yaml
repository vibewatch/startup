            - "10.8-15.6x ARR est."
            - "~10.5x revenue"
            - "~5.2x revenue"
    approximationNotes: >
      All Attentive figures are estimates or inferred from third-party sources (Sacra Research, Forbes). Klaviyo and Braze
      figures are from their most recent published annual filings and StockAnalysis.com financial summaries. Attentive's
      revenue multiple uses the Sacra/Forbes $6.9-7.0B valuation estimate divided by the estimated ARR range. Public company
      market caps are approximate as of Q1 2026.
    claimRefs:
      - CI014
      - CI021
      - CI022
      - CI030
      - CI031
      - CI032

callouts:
  - calloutType: risk
    title: Valuation Compression and 4.5-Year Fundraising Gap
    body: >
      Attentive's estimated current valuation of $6.9-7.0B represents approximately 30% compression from the September 2021
      Series E peak of $10B. With no new equity round disclosed since June 2021, and approximately 5,000 employees generating
      an implied annual payroll burden of $750M-$1B, the capital adequacy position cannot be verified from public sources.
      If current ARR is $500M at a 70% gross margin, gross profit of ~$350M is likely insufficient to cover full operating
      expenses at this headcount scale, implying a material ongoing operating loss financed from 2021 proceeds. A new fundraise
      in the near term—potentially at a further compressed valuation—would be a material dilutive risk for existing investors.
    claimRefs:
      - CI028
      - CI030
      - CI042

  - calloutType: insight
    title: Revenue-Per-Brand Growth Signals Durable NRR Above 100%
    body: >
      Attentive's most actionable forward-looking financial signal is revenue per brand expansion: 42% SMS and 29% email growth
      year-over-year at Cyber Week 2025. While Cyber Week represents a peak-period sample and may overstate full-year trends,
      sustained revenue expansion from existing customers is the hallmark of a platform with strong NRR and product stickiness.
      Combined with the email customer base surpassing 1,000 customers in June 2025 and the AI Pro for Email launch creating
      a new upsell vector, Attentive's land-and-expand mechanics appear structurally intact—a positive underwriting signal for
      gross revenue retention even absent audited NRR disclosure.
    claimRefs:
      - CI008
      - CI012
      - CI037
      - CI039

  - calloutType: assumption
    title: Burn Rate Estimate Methodology
    body: >
      The annual payroll estimate of $750M-$1B is based on Forbes-reported headcount of approximately 5,000 employees (as of
      March 2026) multiplied by a loaded cost of $150,000-$200,000 per employee—the standard range for US-headquartered B2B SaaS
      companies with significant engineering and sales teams. This is a gross estimate that does not account for international
      employees (lower average cost in London, Sydney), variable compensation timing, or stock-based compensation as a non-cash
      component. Actual cash burn may be materially different from this estimate; the range is provided solely to illustrate
      the order of magnitude of the operating cost base relative to the estimated ARR.
    claimRefs:
      - CI016
      - CI017
      - CI018

