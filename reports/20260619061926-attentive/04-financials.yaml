  - id: growth-traction-and-unit-economics
    title: Growth Traction and Unit Economics Proxies
    body: >
      Attentive's public traction signals are strong but expressed as platform GMV rather than company revenue, and as milestone
      announcements rather than audited financials. Sacra Research estimated ARR at approximately $125M at end-2021 and approximately
      $200M at end-2022 (60% year-over-year growth). The company has subsequently claimed surpassing $500M ARR, though no date or
      precise figure has been disclosed. Extrapolating from the Sacra trajectory at moderating growth rates of 35-45% annually
      suggests current ARR of approximately $450-650M, consistent with the $500M+ milestone claim and the company's Forbes Cloud 100
      ranking (position 20 in 2025, fifth consecutive year in the top 20).

      The most granular recent metric is platform GMV: $29B+ in brand revenue driven in the year ending September 2025 (up 48%
      year-over-year) and approximately $2B driven during Cyber Week 2025 alone (its strongest on record, with 5.7B messages sent,
      up 46% year-over-year). Revenue per brand grew 42% on SMS and 29% on email during Cyber Week 2025, indicating strong net
      revenue expansion from existing customers—an implicit NRR signal above 100%. With 8,000+ brand customers and an estimated
      $500M+ ARR milestone, implied average ARR per brand is approximately $62,500 per year, though this estimate is sensitive to
      the timing of both the milestone and the customer count figure. Email click-through rates rose 4.7% and opt-out rates fell
      17% year-over-year during Cyber Week 2025, supporting the platform's value proposition but not translating directly to
      Attentive's recognized revenue.
    claimRefs:
      - CI005
