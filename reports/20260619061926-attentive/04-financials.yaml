  - id: capital-adequacy-and-funding
    title: Capital Adequacy and Funding Context
    body: >
      Attentive has filed seven Form D notices with the SEC between 2018 and 2021, disclosing aggregate offering amounts totaling
      approximately $882M (including note conversions). This is consistent within rounding of the $863M and $866M figures reported
      by Sacra Research and Forbes respectively. The company has not disclosed any new funding round since June 2021—approximately
      4.5 years as of the June 2026 analysis date—which is an unusual gap for a private company at this growth stage and valuation.

      The absence of new fundraising could reflect (a) sufficient cash runway from 2021 proceeds combined with improving revenue-to-burn
      ratio, (b) management preference to avoid dilution given private-market multiple compression (current estimated $6.9-7.0B vs.
      $10B peak), or (c) difficulty raising at a valuation acceptable to existing investors. The most recent valuation estimate of
      $6.9-7.0B (Sacra Research and Forbes, as of 2025) implies approximately 30% compression from the September 2021 Series E
      peak of $10B. At an estimated $6.9-7.0B valuation against an estimated $450-650M ARR, Attentive trades at approximately
      10.8-15.5x ARR—a premium to Klaviyo's approximately 10.5x (market cap approximately $13B on FY2025 revenue of $1.234B)
      and significantly above Braze's approximately 5.2x. This premium is difficult to justify absent disclosed acceleration
      in growth or margin improvement. No IPO filing has been registered as of June 2026.
    claimRefs:
      - CI023
      - CI024
      - CI025
      - CI026
