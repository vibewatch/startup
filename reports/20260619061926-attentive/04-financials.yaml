  - id: cost-structure-and-margin-proxies
    title: Cost Structure, Gross Margin Proxies, and Operational Leverage
    body: >
      Attentive has not disclosed any gross margin, operating expense breakdown, EBITDA, or cash flow metrics as a private company.
      All margin estimates must be derived from public-peer benchmarking. The most directly comparable publicly traded peers are Klaviyo
      (KVYO) and Braze (BRZE). Klaviyo's FY2025 gross margin was 74.67% (on $1.234B revenue) and Braze's FY2026 gross margin was 67.15%
      (on $738M revenue). Attentive's gross margin is estimated in the 65-75% range, with SMS carrier pass-through costs (approximately
      $0.0079 per outbound long-code message plus carrier surcharges in the US, per Twilio's published rates) creating downward pressure
      relative to a pure email or CRM software stack.

      With approximately 5,000 employees as of March 2026 (per Forbes), Attentive's implied annual payroll and benefits expense is
      $750M-$1B at an average loaded cost of $150,000-$200,000 per employee—consistent with US-based B2B SaaS. This estimate implies
      total operating expenses well in excess of gross profit at current scale if ARR is $450-650M, suggesting Attentive is likely
      operating at a material net loss (consistent with its stage and growth investment profile). However, Klaviyo achieved a 16.9% FCF
      margin in FY2025 and Braze achieved 8.4% in FY2026, demonstrating that comparable platforms can achieve positive free cash flow
      at scale. Attentive's Deloitte Technology Fast 500 inclusion for four consecutive years (2021-2024) confirms sustained high
      revenue growth but provides no margin information. International operations in 20+ countries add carrier cost heterogeneity,
      compliance investment, and FX exposure to an already complex cost structure.
    claimRefs:
      - CI013
