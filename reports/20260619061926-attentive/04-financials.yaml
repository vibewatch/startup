  - id: financial-verdict-and-blockers
    title: Financial Verdict and Diligence Blockers
    body: >
      Attentive presents a financially opaque but operationally credible growth story: platform GMV growth of 48% year-over-year,
      revenue-per-brand expansion of 29-42% across channels, and a company-claimed $500M+ ARR milestone collectively signal
      a durable, expanding revenue base. However, the private-company disclosure framework provides insufficient data for
      rigorous underwriting. The combination of undisclosed gross margins, operating expenses, cash position, and NRR—alongside
      4.5 years without a new equity raise and active legal proceedings in bankruptcy-court creditor disputes—creates a diligence
      burden that cannot be met from public sources alone.

      The CourtListener database records 59 cases filed from January 2024 onward in which Attentive Mobile appears as a party,
      including two bankruptcy-court creditor trust proceedings (AMRS Creditors Trust v. Attentive Mobile, Bankr. D. Del., August
      2025; Brash v. Attentive Mobile, Bankr. N.D. Ill., February 2026) and an S.D.N.Y. miscellaneous case (February 2026).
      These proceedings suggest Attentive manages contract-cure risk and contingent payment obligations related to customer or
      vendor insolvencies, which could represent undisclosed financial liabilities. G2 reviewer analysis identifies cost escalation
      as subscriber lists grow as a recurring adverse theme (4.5/5 average; 8% one-star on Shopify App Store), representing
      a pricing friction risk for SMB customers and a potential churn driver. The diligence path to a credible financial model
      requires management accounts, audited revenue and margin data, a current balance sheet, and cohort NRR disclosure.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036
      - CI038
      - CI042
      - CI043
      - CI044
