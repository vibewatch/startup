  - id: milestones-adverse
    title: Milestones, Partnerships, and Adverse Events
    body: >
      Attentive's trajectory spans four distinct phases: stealth and early growth (2016–2019),
      capital acceleration and scale-up (2020–2021), international expansion and product
      diversification (2022–2024), and agentic AI repositioning (2025–2026). Key product milestones
      include the launch of Email and AI products (alongside Sydney and San Francisco offices), the
      rollout of AI Journeys and AI Pro that coincided with the $500M ARR milestone, and the 2025
      launch of AI Pro for Email to 1,000+ email customers. In January 2026, Attentive expanded its
      patented Two-Tap subscriber sign-up technology and added new omnichannel visibility and
      compliance solutions. In May 2026, Attentive launched Visibility AI for RCS deliverability and
      unveiled the next generation of agentic AI marketing at its Thread 2026 conference.

      Notable partnerships include a commercial partnership with Mindbody in December 2025,
      bringing enterprise-grade AI marketing to the wellness industry, and a bi-directional Snowflake
      Marketplace data integration launched in April 2025. Attentive also has a long-standing
      integration with Google's RCS Business Messaging platform.

      On the adverse side, CourtListener records multiple active legal proceedings involving Attentive
      Mobile Inc.: AMRS Creditors Trust v. Attentive Mobile Inc. (Bankr. D. Del., case no. 25-51963,
      filed August 2025), Brash, solely as Creditor Trustee v. Attentive Mobile, Inc. (Bankr. N.D.
      Ill., case no. 26-00162, filed February 2026), and Attentive Mobile Inc. v. 317 Labs, Inc.
      (D. Del., case no. 1:22-cv-01163, filed September 2022). The 317 Labs case involves multiple
      named attorneys and has active case activity through at least early 2023. The bankruptcy-
      related proceedings suggest Attentive has ongoing obligations related to customer or vendor
      insolvencies. A G2 user review summary notes that costs can escalate as subscriber lists grow,
      indicating pricing structure concern for SMB customers. The leadership transition from founder
      Brian Long to Amit Jhawar represents a material organizational disruption, with the post-
      transition period coinciding with workforce restructuring.
