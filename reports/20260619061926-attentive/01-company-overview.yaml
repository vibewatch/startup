  - id: funding-investors
    title: Funding History and Investors
    body: >
      Attentive has raised approximately $866 million in total disclosed funding across multiple
      rounds. SEC EDGAR records show that Attentive Mobile Inc. filed seven Form D notices with the
      SEC between 2018 and 2021, including filings in February 2018, August 2019, February 2020,
      April 2020 (amendment), September 2020, March 2021, and June 2021. This pattern is consistent
      with Seed, Series A, B, C, D, and E rounds. Public reporting and the Sacra analyst profile
      confirm a widely reported Series C of approximately $230 million, a Series D, and a landmark
      Series E of $470 million in September 2021 at a $10 billion valuation—led by Bain Capital
      Ventures and Coatue. The June 2021 Form D (the D round prior to the E) disclosed $59 million
      sold at that date, with directors including Bain's Scott Friend and Sequoia's Patrick Grady.

      Forbes Cloud 100 data for 2025 (published September 2025, updated March 2026) places total
      capital raised at $866 million and current valuation at approximately $7 billion. The lower
      valuation compared to the $10 billion Series E peak of September 2021 reflects broader private-
      market multiple compression. Sacra estimated the valuation at $6.9 billion and total raised at
      $863 million—consistent within rounding. No post-2021 funding round has been publicly disclosed.
      Key investors include Sequoia Capital (confirmed via portfolio listing and board seat held by
      Patrick Grady), Bain Capital Ventures (confirmed via board seat held by Scott Friend and Sacra),
      Coatue (confirmed via Sacra and press coverage), Tiger Global, and Wellington Management.
    claimRefs:
