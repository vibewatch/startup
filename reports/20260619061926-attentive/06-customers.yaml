  - id: expansion-concentration-risk
    title: Expansion, Concentration Risk, and Switching Dynamics
    body: >
      Attentive's expansion motion centers on three vectors: product cross-sell (SMS → email → RCS
      → push), vertical extension (wellness via Mindbody, non-retail expansion), and geographic
      growth (UK, Australia, emerging European markets). The Mindbody partnership is the clearest
      evidence of vertical channel expansion: thousands of Mindbody Ultimate/Ultimate+ subscribers
      can access Attentive marketing tools at no incremental cost, with early betas showing 46%
      opt-in conversion rates and The Tox achieving 60% lift in first-time visits. Enterprise
      renewals from Lands' End, Carter's, and Crate & Barrel—disclosed at Thread 2026—confirm
      that the largest accounts are expanding rather than churning.

      Concentration risk is material. Attentive's 8,000+ customers span 70+ industries, but
      the revenue base is visibly weighted toward retail and e-commerce. Any sustained downturn
      in consumer discretionary spending or DTC e-commerce traffic could affect the platform's
      customer cohort more than a more diversified marketing platform. The geographic concentration
      in North America means that regulatory changes (TCPA amendments, state quiet-hour laws in
      TX/FL/OK/MD/CT/WA) and carrier filtering policies (iOS 26 Unknown Sender filtering) can
      materially affect deliverability and subscriber opt-in rates across most of the customer base
      simultaneously. Attentive has responded with Visibility AI and automated state quiet hours,
      but each platform shift requires customer re-configuration and creates short-term churn risk.

      Partner channel dependency is another concentration vector. The Mindbody integration
      funnels Attentive into 2.8 million wellness-app users, but this depends on the partnership
      remaining commercially stable. Agency partners (MuteSix, Power Digital, Gorgias, Ometria)
      co-sell and service a substantial portion of the mid-market base; any partner churn could
      affect customer retention. Pricing opacity—custom contracts with carrier fees that can
      nearly double stated costs—creates financial friction for budget-sensitive customers and is
      a noted factor in competitive switch decisions by brands evaluating Attentive alternatives.
    claimRefs:
