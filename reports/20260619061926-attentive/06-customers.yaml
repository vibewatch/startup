  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: nrr-grr
      missingEvidence: >
        Net revenue retention (NRR) and gross revenue retention (GRR) by customer cohort or
        year-of-acquisition; annual logo churn rate by segment
      whyItMatters: >
        Without NRR and churn data, the durability of Attentive's $500M ARR base cannot be
        independently verified. High customer revenue growth could mask logo churn if expansion
        from existing accounts dominates.
      diligencePath: >
        Request audited NRR/GRR figures in management due diligence; cross-reference against
        customer count changes year-over-year for logo churn triangulation
      relatedQuestionRefs:
        - QU009
        - QU021

    - type: private-evidence-only
      severity: material
      topic: vertical-revenue-concentration
      missingEvidence: >
        Revenue breakdown by vertical (apparel, beauty, wellness, other) and by geography
        (North America vs. international)
      whyItMatters: >
        Attentive's retail/e-commerce concentration makes it vulnerable to DTC downturns and
        iOS privacy changes. Without vertical revenue share data, the concentration risk cannot
