figures:
  - id: FU001
    title: Customer Journey Map — Attentive Subscriber Lifecycle
    type: journey-map
    layout: wide
    summary: >
      Illustrates how brands attract, convert, and expand subscribers across SMS, email, RCS,
      and push, with VIP segmentation and AI personalization at each stage.
    data:
      nodes:
        - id: brand-marketer
          label: Brand Marketer (Attentive Customer)
          description: Retail, DTC, beauty, wellness, or apparel brand with active marketing team
        - id: anonymous-visitor
          label: Anonymous Site / App Visitor
          description: Consumer arrives via organic, paid, or social channel; Attentive Tag begins tracking
        - id: discovery-sign-up
          label: Discovery & Sign-Up Stage
          description: >
            Pop-up, flyout, QR code (desktop or mobile); Two-Tap minimizes friction;
            Monsoon reported 15% increase in new subscriber opt-ins
        - id: sms-subscriber
          label: SMS Subscriber
          description: Converts via Two-Tap or QR code sign-up; enters welcome journey; TCPA-compliant opt-in
        - id: welcome-journey
          label: Welcome Journey
          description: >
            Automated multi-message welcome sequence; AI-optimized timing and copy;
            Tushbaby: 900x ROI and 132% conversion lift on Welcome Journey
        - id: preference-collection
          label: Preference Collection
          description: >
            Capture behavioral preferences before and after sign-up to personalize future messages;
            reduces irrelevance-driven churn
        - id: email-subscriber
          label: Email Subscriber
          description: Separately opted into email; receives AI Pro-personalized lifecycle messages
        - id: campaign-cadence
          label: Campaign Cadence
