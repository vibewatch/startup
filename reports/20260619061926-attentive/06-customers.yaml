  - id: retention-durability-satisfaction
    title: Retention, Durability, and Customer Satisfaction
    body: >
      No public net revenue retention (NRR) or gross revenue retention (GRR) figures are disclosed
      by Attentive. The company's $500M ARR milestone (surpassed in 2024, announced January 2025)
      and consistent year-over-year revenue-per-brand growth (+42% SMS, +29% email at BFCM 2025)
      imply that account expansion is outpacing any churn in dollar terms. The 50%+ multi-product
      usage rate suggests that existing customers are deepening rather than narrowing their
      engagement. The Shopify App Store rating (4.7/5, 113 reviews, 87% five-star) and G2's
      top-rated customer success team distinction are the most accessible third-party satisfaction
      proxies, though both reflect a positively-selected sample of active, engaged users rather
      than the full customer lifecycle.

      Switching cost indicators are meaningful. Brands that migrate to Attentive rebuild subscriber
      lists within the platform (opt-in re-collection is required for TCPA compliance), integrate
      custom workflows via the Attentive Tag, configure AI Pro models with brand-specific data,
      and receive strategic guidance from a dedicated customer success team. These investments
      create material exit friction. The 92% improved deliverability rate reported by email
      migrants reinforces that switching from Attentive back to another provider would require
      re-validating sender reputation and rebuilding deliverability infrastructure.

      Adverse signals exist but are mostly pricing-related rather than product-quality failures.
      The 8% one-star rate on Shopify (approximately 9 of 113 reviews) reflects edge cases—
      typically contract disputes, billing surprises, or onboarding friction—not systemic
      product failures. Omnisend's competitive analysis identifies carrier fees that can nearly
      double monthly costs beyond the contract rate, and an email builder that some customers
      find limiting relative to specialist platforms. These complaints are concentrated among
      smaller or budget-sensitive brands, not the enterprise segment that Attentive optimizes for.
      The BBB search result shows an A- rating, indicating a small complaint volume relative to
      business scale. No regulatory enforcement actions or FTC complaints were identified in
      this research cycle.
