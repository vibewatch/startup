chapter:
  number: 7
  title: Risks
  summary: >
    Attentive faces a multi-layered risk stack anchored by TCPA litigation exposure from
    its position as the infrastructure layer for 8,000+ brand SMS programs, a 4.5-year
    fundraising gap with a 30% valuation markdown from the $10 billion Series E peak,
    and compounding carrier/platform dependency concentrated on three US carriers and
    Google Jibe for RCS delivery. iOS 26's enhanced message-filtering capability adds
    a near-term deliverability wildcard, while the competitive squeeze from Klaviyo,
    Shopify Messaging, and AI-native entrants pressures pricing power. The CEO transition
    from founder Brian Long to Amit Jhawar is unconfirmed by primary source as to exact
    date, creating residual key-person risk during a high-stakes strategic pivot to
    agentic AI. Legal dockets show 107 cases naming Attentive Mobile since 2022 and
    16 TCPA-specific matters, with two active bankruptcy adversarial proceedings as of
    early 2026.

sections:
  - id: regulatory-tcpa-privacy
    title: Regulatory, TCPA, and Privacy Risk
    body: >
      Attentive's core business—enabling 8,000+ brands to send high-volume SMS and email
      campaigns to opted-in consumer subscriber lists—sits at the center of a uniquely
      litigious US regulatory landscape. The Telephone Consumer Protection Act (TCPA)
      exposes both platforms and their brand clients to statutory damages of $500–$1,500
      per violating text, and class-action TCPA suits are routinely brought against
      brands using commercial messaging platforms. CourtListener records show 16 cases
      specifically citing "attentive mobile" in a TCPA context since 2022, and 107 cases
      total naming Attentive Mobile after 2022, underscoring the pervasive litigation
      environment in which the company operates.

      Attentive is not typically the primary defendant in TCPA suits—brands that use its
      platform are the foreground targets—but platform providers face co-defendant risk
      when they are alleged to have sent or enabled unauthorized messages. In Raslavich v.
      Spanx (M.D. Fla. 2022), Attentive Mobile was named as a co-defendant before being
      dismissed without prejudice on September 13, 2022. In Salaiz v. RANEYS, LLC (W.D.
      Tex. 2022), Attentive was again named alongside a brand client. A Value City
      Furniture TCPA case (S.D. Ohio 2024–2025) prominently featured Attentive subscriber
      records and audit letters in discovery, demonstrating the company's systemic exposure
      to discovery obligations even when not a primary defendant.

      The FCC's tightening of one-to-one consent rules for commercial texting, the FTC's
      CAN-SPAM and anti-spam enforcement posture, and California's CCPA/CPRA (enforced
      by the California AG) each create incremental compliance obligations. Attentive has
      invested materially in mitigants: patented Two-Tap double opt-in (10 issued patents
      as of January 2026), Litigator Defender (a database of known TCPA plaintiff phone
      numbers), Enhanced Audit Assistant for consent-record retrieval, and an in-house
      carrier relations team. The platform also holds SOC 2 Type II certification for the
      period November 2024–October 2025 and has certified under the EU-US Data Privacy
      Framework (DPF). However, compliance tools reduce but do not eliminate litigation
      exposure, particularly when a brand client misconfigures flows or re-imports consent
      records from a third-party list. GDPR compliance is documented in Attentive's DPA
      and privacy policy, with EDPO designated as EU data representative, but independent
      verification of implementation depth is not publicly available.
