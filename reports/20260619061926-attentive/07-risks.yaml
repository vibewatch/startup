callouts:
  - calloutType: risk
    title: "TCPA Platform Liability: Untested but Structural"
    body: >
      Attentive's compliance tools (Two-Tap, Litigator Defender, Audit Assistant) reduce
      but do not eliminate TCPA exposure for the 8,000+ brands running SMS programs through
      its infrastructure. If a court certifies a class action naming Attentive-as-platform
      rather than just the brand client, the statutory damage math ($500–$1,500 per text ×
      millions of messages) creates existential financial risk. This scenario has not
      materialized as of June 2026, but the volume of TCPA-adjacent litigation (107 cases
      since 2022) confirms that plaintiffs routinely probe the platform layer. This is a
      monitoring-grade risk that warrants legal opinion review as a diligence condition.
    claimRefs:
      - CR001
      - CR002
      - CR008
  - calloutType: risk
    title: "Funding Gap Is the Single Largest Financial Risk Signal"
    body: >
      A 4.75-year gap between the Series E close (September 2021) and June 2026 with no
      disclosed new round is anomalous for a company of Attentive's scale and growth stage.
      The two most concerning interpretations are (a) the company is generating sufficient
      operating cash flow to self-fund—a positive signal if true—or (b) the company cannot
      raise at a price acceptable to existing investors. Without audited financials or a
      disclosed cash position, investors cannot distinguish between these scenarios. This
      opacity is the largest single underwriting gap in the diligence stack.
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR034
  - calloutType: recommendation
    title: "Priority Diligence: Confirm Carrier SLA, TCPA Insurance, and Burn Rate"
    body: >
      Three diligence items are prerequisite to underwriting: (1) Carrier SLA terms with
      AT&T, Verizon, and T-Mobile—specifically content-filtering notification provisions
      and throughput guarantees; (2) TCPA insurance coverage limit and claims history—
      this is a standard D&O/E&O item for SMS platforms; and (3) current cash burn rate
      and cash-on-hand to assess runway independent of new capital. These three data
      points would substantially close the most material information gaps identified in
      this analysis.
    claimRefs:
      - CR021
      - CR022
      - CR007

