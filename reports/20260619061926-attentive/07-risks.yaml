  - id: carrier-platform-dependency
    title: Carrier, Platform, and Technology Dependency Risk
    body: >
      Attentive's revenue model depends critically on uninterrupted, policy-compliant
      access to AT&T, Verizon, and T-Mobile for US SMS and RCS delivery, on Google Jibe
      as the RCS infrastructure layer, and on Apple's iOS device ecosystem for message
      rendering. Any of these three chokepoints can unilaterally alter the economics of
      SMS/RCS marketing without Attentive's consent. Carriers impose per-message
      surcharges on top of base messaging costs—Twilio's published long-code outbound
      rate of approximately $0.0079 per segment provides a benchmark; actual Attentive
      carrier cost structure is not publicly disclosed. Carrier throughput quotas, content
      filtering policies, and short-code allocation rules have been known to change
      without advance notice, creating delivery disruptions for all brands simultaneously.

      The most immediate near-term risk is Apple's iOS 26, announced at WWDC June 2026.
      iOS 26 introduces enhanced AI-powered message filtering in the native Messages app
      that can automatically route marketing texts into lower-visibility categories,
      reducing open rates for iOS users—who represent roughly 55% of the US smartphone
      market. Attentive's Visibility AI feature, launched May 2026, attempts to respond
      to this threat by detecting which inboxes are likely to receive RCS delivery and
      routing messages accordingly, but the technology's efficacy against iOS 26 filtering
      was not confirmed in third-party evaluation as of the analysis date.

      RCS introduces a new layer of platform risk. Attentive's RCS deployment depends
      on the Google Jibe platform and on GSMA Universal Profile adoption across US
      carriers. AT&T, Verizon, and T-Mobile have all enabled RCS, but global RCS
      interoperability remains fragmented: international brands face heterogeneous carrier
      support and no consistent fallback-to-SMS standard. Apple's RCS adoption in iOS 17+
      improved reach, but Apple controls the rendering experience and can further modify
      filter behavior in future iOS releases. Shopify's native messaging product (serving
      500k+ merchants with in-platform email) represents a platform-embedded alternative
      that could reduce the share of brands choosing third-party SMS vendors. These
      platform risks are structural and difficult to fully mitigate without diversifying
      infrastructure dependencies that are, by commercial design, carrier-exclusive.
