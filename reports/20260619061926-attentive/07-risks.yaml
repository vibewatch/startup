  - id: financial-valuation-funding
    title: Financial, Valuation, and Funding-Overhang Risk
    body: >
      Attentive last raised external capital in September 2021—a $470 million Series E
      at a $10 billion post-money valuation led by Bain Capital Ventures and Coatue, as
      documented in the SEC Form D filed June 24, 2021 (Acc. No. 0001231919-21-000058).
      The elapsed time since that raise is approaching 4.75 years as of June 2026, an
      unusually long gap for a private company at this growth stage and scale. Forbes
      Cloud 100 data and Sacra Research both estimate a current valuation of approximately
      $6.9–7.0 billion as of 2025–2026, implying roughly 30% compression from the Series
      E peak. At approximately 10.8–15.5× estimated ARR (Sacra estimate: $125M at
      end-2021, growing 60% YoY to $200M at end-2022; company-disclosed milestone
      crossing $500M+ ARR), Attentive's valuation multiple is a premium to Klaviyo's
      market cap-to-revenue multiple of approximately 10.5× but carries private-market
      illiquidity and disclosure risk premiums.

      The $866 million total raised over seven rounds carries liquidation preference
      overhang. Preferred shareholders—Bain Capital Ventures (board seat held by Scott
      Friend), Coatue, Sequoia Capital (Patrick Grady board seat), Tiger Global, and
      Wellington Management—hold conversion rights and liquidation preferences that
      reduce common equity value in sub-par exit scenarios. No IPO S-1 registration
      has been filed with the SEC as of June 2026. The company has disclosed surpassing
      $500M ARR as a milestone but has not published audited revenue, gross margin,
      operating expenses, or cash position figures. This opacity makes it impossible to
      independently underwrite free-cash-flow adequacy or burn rate. With approximately
      5,000 employees and an implied annual payroll and benefits burden of $750M–$1B,
      Attentive is likely operationally loss-making unless revenue has grown materially
      beyond the $500M ARR milestone and gross margins have expanded. Peers Klaviyo
      (74.7% gross margin FY2025) and Braze (67.2% gross margin FY2026) provide
      benchmarks, but Attentive's SMS-heavy mix and carrier pass-through costs likely
      depress margins toward the low end of the 65–75% range.
