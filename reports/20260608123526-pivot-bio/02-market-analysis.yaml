  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: roi-proof
    missingEvidence: Independent multi-year ROI cohorts by crop, soil, and fertilizer-price environment showing renewals, not just trial outcomes or company summaries.
    whyItMatters: The biggest adoption objections are variability and payback; without independent cohorts it is hard to know whether early acres persist through weak crop-price years.
    diligencePath: Request third-party trial summaries, retailer renewal data, and grower-level cohort analysis broken out by crop and management practice.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: revenue-based-som
    missingEvidence: Public disclosure of paying acres, repeat acres, revenue by crop, and channel sell-through needed to convert acreage proxies into revenue-based SAM and SOM.
    whyItMatters: Validated acres demonstrate presence, but valuation work depends on monetized acres, renewal rates, and crop mix rather than total footprint alone.
    diligencePath: Obtain management disclosure, secondary-market diligence materials, or lender/investor materials with acreage monetization and channel-conversion metrics.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: channel-renewal-data
    missingEvidence: Named retailer sell-through, agronomy-training coverage, and grower renewal metrics by partner network.
    whyItMatters: Retailer trust is a core adoption gate, but public sources mostly announce partnerships rather than quantify whether those channels repeatedly move acres.
    diligencePath: Ask top retail partners for acreage under advice, staff training cadence, and repeat-order percentages after the first season.
    relatedQuestionRefs:
    - QM023
