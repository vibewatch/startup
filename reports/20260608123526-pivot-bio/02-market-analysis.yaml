company:
  name: Pivot Bio
chapter:
  number: 2
  title: Market Analysis
  summary: 'Pivot Bio sits inside a narrower market than generic biofertilizer headlines imply: the practical substitution or supplementation of nitrogen spend on U.S. corn, wheat, cotton, and sorghum acres. Public biofertilizer market reports cluster around a USD 2.5-3.1 billion global market today, but bottom-up U.S. target-crop nitrogen budgets imply a much larger USD 10.8-20.3 billion annual spend pool, of which only about USD 1.9-4.3 billion looks plausibly replaceable by microbial nitrogen products at current 20-34 lb/acre replacement claims. Adoption depends less on awareness of sustainability than on retailer trust, field-specific ROI proof, and how much fertilizer-price volatility or downstream Scope 3 demand is present in a given season.'
sections:
- id: market-boundary-and-substitutes
  title: 'Market Boundary: Nitrogen Substitution, Not All Fertility Spend'
  body: 'Pivot Bio is best framed as participating in the nitrogen-management portion of row-crop input spend rather than in the entire fertilizer, crop-protection, or broad “biologicals” market. The relevant job-to-be-done is replacing or supplementing synthetic nitrogen on crops where growers currently buy commercial nitrogen and care about in-season availability, loss risk, and yield protection. That boundary includes microbial nitrogen products sold into corn, wheat, sorghum, and cotton programs, and it also includes the downstream sustainability programs that can offset a grower’s net adoption cost when reduced synthetic nitrogen creates auditable Scope 3 benefits. It excludes phosphate and potash budgets, manure-only systems, legume self-fixation, and generic global biofertilizer demand that is not tied to microbial nitrogen substitution in Pivot Bio’s target crops. Academic BNF literature reinforces why this matters: biological nitrogen fixation is a distinct agronomic mechanism with
    a very different cost, storage, and field-performance profile than Haber-Bosch fertilizer. Market-report pages also show why generic TAM figures must be handled carefully: they package nitrogen-fixing products together with a broader biofertilizer category, which is directionally useful for adjacency but too broad to treat as Pivot Bio’s actual serviceable market.'
