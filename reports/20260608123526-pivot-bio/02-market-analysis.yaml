- id: TM004
  title: Growth Drivers and Adoption Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Nitrogen fertilizer price volatility
    - Driver
    - Immediate / cyclical
    - Makes partial substitution and price-lock offers more valuable
    - Track 2026-2027 urea / ammonia pricing and realized grower response by crop
  - - Water-quality and nitrate scrutiny
    - Driver
    - Medium-term
    - Supports lower-loss nutrient solutions and better nutrient accounting
    - Monitor state and federal nitrate-rule changes rather than assuming a single national rule
  - - Downstream Scope 3 / inset demand
    - Driver
    - Now
    - Creates a second payer that can subsidize adoption
    - Identify named recurring grain-buyer / CPG partners and contract scale
  - - Product price reductions for 2026
    - Driver
    - Now
    - Improves per-pound replacement economics vs synthetic N
    - Validate whether price cuts persist if fertilizer markets normalize
  - - Variable field performance
    - Constraint
    - Always
    - Requires crop-by-crop and field-by-field agronomy instead of a blanket sales pitch
    - Obtain independent multi-year response data by soil, weather, and placement
  - - Retailer trust and execution quality
    - Constraint
    - Now and 1-3 years
    - Local advisor confidence and correct BMP use materially affect renewals
    - Request sell-through, training, and renewal data by distribution partner
  - - Commodity-cycle and margin pressure
    - Constraint
    - Now
    - Tight crop margins raise proof thresholds even when volatility makes alternatives attractive
    - Test adoption under low corn / cotton / wheat price scenarios
  - - Registration, storage, and quality-control complexity
    - Constraint
    - Ongoing
    - Live microbial products face commercialization and consistency hurdles
    - Map state registrations, shelf-life controls, and third-party efficacy verification
  notes: Rows combine macro tailwinds with execution risks. Several constraints are structural rather than temporary, especially product-consistency proof, local advisor trust, and commercialization complexity.
