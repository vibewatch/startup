tables:
- id: TM001
  title: Market Definition Table — Included Spend, Exclusions, and Substitutes
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Pivot Bio
  rows:
  - - Corn microbial nitrogen replacement
    - Synthetic N dollars that can be displaced or supplemented on corn acres
    - Phosphate, potash, crop protection, seed genetics
    - Grower operating budget; sometimes sustainability co-payer via N-OVATOR
    - Core market today; corn is the largest U.S. nitrogen-consuming crop
  - - Wheat / small grains microbial nitrogen replacement
    - Nitrogen spend on wheat and small grains where RETURN/Retain-type products fit
    - Protein premiums unrelated to N management, fungicide / seed spend
    - Grower operating budget
    - Adjacency already commercialized; wheat is the second-largest U.S. nitrogen user
  - - Sorghum and cotton microbial nitrogen replacement
    - Nitrogen spend on sorghum and cotton programs that can accept partial N substitution
    - Non-nitrogen fertility, irrigation, ginning or fiber-premium economics
    - Grower operating budget
    - Expansion vector that broadens SAM beyond corn
  - - Downstream nitrogen-reduction programs
    - Scope 3, inset, or grain-premium budgets tied to verified N reduction
    - Generic carbon offsets without supply-chain linkage
    - Grain buyers, ingredient suppliers, CPGs, spirit producers
    - Creates a second payer that can improve grower ROI
  - - Generic global biofertilizer market
    - Useful adjacency for investor comparison only
    - Cannot be treated as direct Pivot Bio TAM because it includes non-nitrogen products and regions
    - Varies by market report
    - Helpful context, but too broad for direct valuation work
  notes: Boundary logic distinguishes total fertility spend from the narrower nitrogen-substitution job. Generic biofertilizer TAM figures are included as adjacency only, not as a direct proxy for Pivot Bio revenue opportunity.
