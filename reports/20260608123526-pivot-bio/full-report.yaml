  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited revenue and gross-margin bridge
        - 2023-2025 revenue by product, gross margin, and net revenue broken out from quoted-acreage figures
        - >-
          Without this, no valuation method can distinguish a $1.2B from a $2.5B fair value; it is the single most
          important missing file
        - CFO deck or auditor files; mandatory for any investment decision.
      - - Farmer retention and NRR
        - >-
          Retention rate with a definition (field-level re-purchase; retailer re-order), net revenue retention across
          cohorts, and churn reasons
        - >-
          High retention is the core bull-case claim; an unverified claim of >90% retention cannot be the primary
          support for a premium multiple
        - Head of Commercial or Commercial Ops; confirmed by independent retailer interviews.
      - - Preference and cap-table waterfall
        - >-
          Full capitalisation table including all classes, preferences, dividend accruals, and anti-dilution
          adjustments; explanation of Series F-1 at $1.14/share vs $5.70-5.71 in Series E and F-2
        - >-
          The 2x liquidation preference on F-2 alone requires $200M+ to be returned before prior classes see a dollar;
          the full stack determines exit economics for any new investor
        - General Counsel and CFO; required for standard closing diligence.
      - - Manufacturing cost curve and path to gross-margin expansion
        - >-
          Per-acre manufacturing cost, fermentation capacity, cold-chain logistics cost, and the cost trajectory as
          production scales
        - >-
          The 50% price-to-synthetic-nitrogen discount only improves margin if manufacturing cost is structurally below
          $10-15 per acre; this is the operative unknown in the unit-economics model
        - CTO/COO; supported by production facility tour and independent cost audit.
      - - Brazil and international launch milestones
        - >-
          Confirmed registration status, launch timeline, distribution agreements, and go-to-market cost for Brazil; the
          first international market is a proxy for the global scalability of the business model
        - >-
          International expansion is in every investor presentation; absence of confirmed milestones suggests it remains
          aspirational rather than funded
        - CEO and Commercial team; request the regulatory filing confirmation from Brazil's MAPA.
    notes: >-
      This table identifies the evidence that would allow a transition from research-more to buy; absence of any single
      item should not block the process but the revenue bridge and the cap-table waterfall are binary requirements.
