  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - >-
          G3 win rates hold at 90%+ and drive rapid acreage expansion; price cuts are volume-accretive; 2025-2026
          revenue exceeds $250-400M; Brazil expansion adds meaningful scale; CERT-N cotton and carbon credits add
          diversification; M&A or IPO in 2027-2028.
        - >-
          $1.8-2.5B range at 5-7x revenue; upside to or above current mark if diligence validates high growth and gross
          margin above 60%.
        - Requires a clean data room and 2+ years of strong commercial KPIs; not yet confirmed by public evidence.
        - >-
          Execution risk on Brazil; competitive response from Corteva, Bayer, BASF biologicals divisions; global
          fertilizer prices falling sharply could reduce ROI case.
      - - Base
        - >-
          Revenue growth is real but moderate (10-20% annually); pricing concessions compress gross margin; preference
          overhang limits upside for common; IPO in 2028-2029 at best; Series G needed.
        - >-
          $1.2-1.7B fair value at 3-4x revenue; current $1.66B mark is at the top of the defensible range under base
          assumptions.
        - >-
          Most plausible public-evidence path; consistent with the valuation arc from $2B (2021) through $1.57B (2024)
          to $1.66B (2026).
        - >-
          Further pricing concessions could push margins below acceptable levels; Forge secondary activity remains
          limited, suppressing exit options.
      - - Bear
        - >-
          Price cuts do not generate sufficient volume growth; gross margins compress sharply; Series F-1 anomalous
          pricing signals structural stress; competitive biologicals from incumbents erode positioning; Indigo-style
          down-round dynamics emerge.
        - >-
          $700M-$1.2B range at 1.5-2x revenue; current mark represents 40-55% overstatement of value; down-round likely
          in a Series G.
        - Probability rises sharply if diligence reveals revenue below $150M or gross margins below 40%.
        - >-
          2x liquidation preference on F-2 means common and early-preferred investors absorb all losses first;
          preference waterfall accelerates downside at bear valuations.
    notes: >-
      Valuation ranges are scenario-based underwriting judgments using public comp multiples; they are explicitly wide
      because Pivot Bio revenue and margin are undisclosed.
