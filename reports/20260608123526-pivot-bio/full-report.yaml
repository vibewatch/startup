      - number: '1.3'
        title: Funding History, Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio has raised capital across seven distinct financing events per SEC Form D filings and Forge
              Global data, though reported round sizes vary between the company's press announcements and Forge's
              Certificate-of-Incorporation (COI)-derived data. The company's most publicised raise is the $430 M Series
              D (first sale 28 June 2021; Form D filed 4 August 2021), which press releases cited at approximately $2 B
              post-money valuation. The SEC Form D for that event records total proceeds of $434,999,176 from 19
              investors. Key investors across rounds include DCVC (seed and every subsequent round), Temasek Holdings,
              Generation Investment Management, Breakthrough Energy Ventures, G2 Venture Partners, Prelude Ventures,
              Bunge Ventures, Continental Grain/Conti Ventures, Rockefeller Capital Management, Tekfen Ventures,
              Hercules Capital, and Pavilion Capital. In 2024, Forge Global's COI data shows a Series E of approximately
              $54.9 M at a $1.57 B implied valuation. In March 2026, Forge records a Series F-2 round of $100 M at $5.71
              per share, implying a $1.66 B post-money valuation. Total funding per Forge's aggregated COI data is
              approximately $847 M; the lower public figure of approximately $618 M reflects only officially announced
              rounds. The implied per-share price fell from $7.59 (Series D, 2021) to $5.71 (Series F-2, 2026),
              representing a roughly 25 % dilution-adjusted decline in per-share value over five years, an adverse
              valuation signal. Forge's secondary market activity for Pivot Bio is rated "Limited," indicating thin
              trading liquidity at the current implied price.
