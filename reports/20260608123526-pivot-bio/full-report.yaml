      - number: '2.4'
        title: 'Growth Drivers: Sustainability Pull, Regulation, and Fertilizer Volatility'
        blocks:
          - type: paragraph
            body: >-
              Three demand drivers matter most. First, fertilizer volatility is again salient. The 2026 American Farm
              Bureau survey found more than 5,700 respondents dealing with severe affordability stress, with about 70%
              unable to afford all the fertilizer they need and nitrogen prices up more than 30% since late February;
              lower crop prices make that volatility hurt more. Second, environmental pressure is intensifying. EPA
              acknowledges that fertilizer overuse contaminates groundwater and surface water, while independent
              reporting and advocacy groups are pushing for tighter nitrate guardrails and more monitoring. Even where
              regulation remains patchy, the direction of travel is toward better nutrient accounting and lower leakage.
              Third, downstream sustainability procurement is creating a second growth vector. AgFunder’s reporting on
              N-OVATOR and broader nitrogen-fixing market commentary both show that food companies, grain buyers, and
              retailers are willing to fund measurable emissions reductions when they can attribute them to real supply
              chains. These drivers do not guarantee rapid adoption, but together they expand the number of
              budgets—input cost, risk mitigation, and Scope 3 procurement—that can support microbial nitrogen products.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
