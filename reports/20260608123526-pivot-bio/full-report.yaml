      - number: '2.2'
        title: U.S. Acreage and Nitrogen Budgets Set a Much Larger Bottom-Up Ceiling
        blocks:
          - type: paragraph
            body: >-
              The U.S. acreage base in Pivot Bio’s currently marketed crops is large enough that a bottom-up view
              produces a much bigger opportunity than any headline global biofertilizer report. USDA NASS estimated 2025
              planted area at 95.2 million corn acres, 45.5 million wheat acres, 10.1 million cotton acres, and 6.2
              million sorghum acres, or roughly 157.0 million acres combined. Corn is the anchor because it already
              absorbs 78% of U.S. nitrogen fertilizer use, while wheat is the second-largest nitrogen-consuming crop.
              Extension and university sources show that agronomic N programs remain sizable even after decades of
              efficiency gains: 2024 trend N use was about 151.8 lb/acre for corn and 77.15 lb/acre for wheat; 2026
              extension guidance still points to roughly 115-135 lb total N for responsive winter-wheat sites, around
              90-108 lb N for mid-yield cotton, and 60-85 lb N for many grain-sorghum programs depending on placement
              and moisture. Using those crop-by-crop anchors yields an evidence-constrained target-crop nitrogen pool of
              roughly 18.1-25.4 billion pounds of N annually. At the USD 0.60-0.80/lb N economics cited in 2026 wheat
              guidance, that implies a broad annual spend pool of about USD 10.8-20.3 billion before asking how much of
              that spend microbial products can realistically displace.
