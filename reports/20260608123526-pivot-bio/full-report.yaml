      - number: '6.3'
        title: Retention proxies, repeat usage, and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest publicly disclosed part of the customer story. There are helpful proxies, but
              not the metrics an investor would want for underwriting. The strongest positive proxy is behavioral rather
              than contractual: Pivot Bio's own N-OVATOR pages describe the program as repeatable each crop cycle,
              without multiyear contracts, and official testimonials show repeat use over multiple seasons. Travis Milne
              says his farm tested Pivot Bio for years across different soil types before it became part of the
              fertility plan, and Dane Whitley describes it as an embedded part of the farm's plan because the nitrogen
              is there regardless of weather. CropLife also cited a third-party 2024 survey of nearly 400 farmers in
              which Pivot Bio received a 91% satisfaction rating, with plant health, ease of application, and ROI as the
              main drivers. But none of these proxies substitute for disclosed gross retention, net revenue retention,
              churn, renewal rates, contract length, or share of acres retained from one season to the next. Even
              N-OVATOR's annual design is double-edged: it lowers participation friction and supports repeatability, yet
              it also means public materials do not prove multi-year contract lock-in. The result is a chapter where
              adoption and satisfaction are supportable, but true durability economics remain an evidence gap.
