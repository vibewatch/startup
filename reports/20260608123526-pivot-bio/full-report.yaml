        - label: 5x EV/Rev (base-high; growth premium)
          value: 1660
          unit: USD M
          note: Requires ~$332M revenue to justify current mark
        - label: 3.8x EV/Rev (Ginkgo-equivalent)
          value: 1260
          unit: USD M
          note: Requires ~$332M revenue; at Ginkgo multiple
        - label: 3x EV/Rev (base-low; sector average)
          value: 996
          unit: USD M
          note: Requires ~$332M revenue; meaningful downside to mark
        - label: 0.87x EV/Rev (Bioceres-equivalent; distressed)
          value: 289
          unit: USD M
          note: Stressed public comparable; most pessimistic case
