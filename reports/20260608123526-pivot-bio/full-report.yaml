    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio, Inc. is a Delaware-incorporated agricultural biotechnology company founded in 2010 and
              headquartered in Berkeley, California (principal address: 2910 Seventh Street, Berkeley CA 94710, per SEC
              EDGAR filings). The company develops and commercialises gene-edited soil microbes that fix atmospheric
              nitrogen directly on plant roots, providing corn, wheat, sorghum, small grain, and cotton growers with an
              alternative or supplement to synthetic nitrogen fertiliser. Its business model is a direct-to-farmer and
              retailer distribution model: products are sold as seed treatments or in-furrow applications through
              independent agronomic retailers and a growing national retail network that exceeded 500 new partners in
              recent years. A complementary revenue line, the N-OVATOR® nitrogen-credit program, connects enrolled
              farmers with corporate buyers of verified Scope 3 emission reductions, generating annual cash payments to
              growers while creating a sustainability data asset for the company. Pivot Bio's products are recognised
              under the PROVEN® and RETURN® brand families for grains and CERT-N™ for cotton. The company describes its
              overarching mission as reducing synthetic nitrogen dependency and the associated greenhouse gas emissions
              while improving crop yields and farmer profitability. In May 2025, Pivot Bio announced a strategic
              relocation of its headquarters from Berkeley to the U.S. Midwest (Wayzata, Minnesota area), consolidating
              scientific and commercial operations closer to its core agricultural markets, while retaining offices in
              St. Louis (Missouri), Iowa, and São Paulo (Brazil).
