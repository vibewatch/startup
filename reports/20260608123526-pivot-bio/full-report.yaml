    title: Valuation sensitivity to revenue multiple and implied revenue
    type: bar
    layout: standard
    summary: >-
      Fair value estimates at different EV/revenue multiples, holding implied revenue constant, to show how sensitive
      the $1.66B mark is to multiple compression.
