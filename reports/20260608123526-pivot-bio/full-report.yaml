        title: Corporate Milestones, Strategic Events, and Adverse Developments
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio's history spans three phases: stealth scientific development (2010–2018), commercial scale-up in
              corn and wheat (2019–2021), and a diversification and leadership-transition phase (2022–2026). The company
              was incorporated in Delaware in 2014 (first Form D filed October 2014) after informal work that began in
