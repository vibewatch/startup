  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      3×3 likelihood–impact placement of Pivot Bio's 12 primary risks. The highest-severity cluster combines High
      Likelihood with High Impact: efficacy variability and fertilizer price war — the two risks most directly tied to
      near-term farmer ROI and commercial momentum. The Medium Likelihood / High Impact quadrant captures capital-runway
      risk and adverse regulatory rulemaking.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
      rows:
        - label: High Likelihood
          values:
            - State registration timing gaps
            - Cold-chain / shelf-life failure; BMP adoption gap at retail
            - Efficacy variability (site-by-site ROI); Synthetic nitrogen price compression
        - label: Medium Likelihood
          values:
            - N-OVATOR carbon market regulatory risk
            - >-
              Batch manufacturing quality failure; CERT-N cotton launch miss; International expansion distraction;
              People/execution gap
            - Capital runway exhaustion; Adverse USDA APHIS rulemaking on modified microbes; Bayer conflict materializes
        - label: Low Likelihood
          values:
            - FIFRA registration triggered by label change
            - University adverse publication; Contract manufacturing failure
            - EPA TSCA adverse determination for new product; IP challenge from Corteva or Bayer
    approximationNotes: >-
      Likelihood ratings are author assessments based on available public evidence as of June 2026. Impact ratings
      assume a US-focused investment horizon of 3–5 years.
    claimRefs:
      - CR005
      - CR014
      - CR029
      - CR031
  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      Directed graph showing how Pivot Bio's primary risk triggers flow through farmer ROI, channel behavior, and
      capital conditions to ultimately affect revenue growth, valuation, and financing outcome.
    data:
      nodes:
        - id: r-efficacy
          label: Efficacy Variability
          detail: Site-specific yield lift of 2–4 bu/acre average; BMPs required for optimum performance
        - id: r-nfertprice
          label: Synthetic N Price Drop
          detail: Urea/anhydrous price decline reduces Pivot Bio per-pound-N cost advantage
        - id: r-aphis
          label: APHIS Regulatory Risk
          detail: No formal modified-microbe commercialization pathway; rulemaking pending
        - id: r-capital
          label: Capital Runway Risk
          detail: >-
            Series D ($430M) was the last broadly announced major round; later private-mark financing data is only
            partially public
        - id: r-batch
          label: Batch Quality Failure
          detail: Living microbe manufacturing variability; no public QA disclosure
        - id: r-bayer
          label: Bayer Conflict / IP Risk
          detail: Bayer as investor and competitor; Joyn Bio IP estate; potential patent challenge
        - id: r-competition
          label: Competitor Biologicals
          detail: Corteva, Bayer, Syngenta, Indigo Ag investing in biological N-fixation alternatives
        - id: i-farmroi
          label: Farmer ROI Impaired
          detail: Lower net economic benefit per acre reduces repeat purchase probability
        - id: i-churn
          label: Customer Churn / Lower Retention
          detail: Farmer retention drops below 90%; undermines revenue predictability
        - id: i-channel
          label: Channel De-Prioritization
          detail: Retailers and distributors reduce shelf space or promotion intensity
        - id: i-revenue
          label: Revenue Growth Slowdown
          detail: New-farmer acquisition and existing-farmer acreage expansion both impaired
        - id: i-valuation
          label: Valuation / Financing Impact
          detail: Revenue multiple compression; challenging next-round conditions
      edges:
        - from: r-efficacy
          to: i-farmroi
          label: Variable ROI
          critical: true
        - from: r-nfertprice
          to: i-farmroi
          label: Price advantage erodes
          critical: true
        - from: r-competition
          to: i-channel
          label: Competitor shelf competition
        - from: r-aphis
          to: i-revenue
          label: New product delays
        - from: r-batch
          to: i-farmroi
          label: Under-performing product
          critical: true
        - from: r-bayer
          to: i-revenue
          label: IP dispute or competitive intelligence
        - from: i-farmroi
          to: i-churn
          label: Poor ROI drives non-renewal
          critical: true
        - from: i-churn
          to: i-revenue
          label: Lost acres reduce revenue
          critical: true
        - from: i-channel
          to: i-revenue
          label: Reduced retailer push
        - from: r-capital
          to: i-valuation
          label: Unfavorable round terms or dilution
        - from: i-revenue
          to: i-valuation
          label: Revenue multiple drives valuation
          critical: true
    claimRefs:
      - CR011
      - CR025
      - CR029
      - CR032
  - id: FR003
    title: Dependency Map — Critical Partners and Counterparties
    type: dag
    layout: wide
    summary: >-
      Directed graph of Pivot Bio's critical external dependencies across regulatory bodies, manufacturing, capital,
      distribution, and research validation — showing how each connects to the core product delivery and commercial
      outcome.
    data:
      nodes:
        - id: d-epa
          label: EPA (TSCA / FIFRA)
          detail: Premanufacture notification (PMN) clearance required for each new intergeneric microbe product
        - id: d-usda
          label: USDA APHIS BRS
          detail: 7 CFR Part 340 determination; 'Am I Regulated?' process for gene-edited bacteria
        - id: d-fermentation
          label: Fermentation Manufacturing
          detail: US-based biological fermentation; company claims 99% less capex than conventional N; model not confirmed
        - id: d-retail
          label: Ag Retail Network (~500 locations)
          detail: Nutrien, Winfield United, Helena, CHS, independents; primary channel to farmer
        - id: d-bayer
          label: Bayer AG (investor/competitor)
          detail: Series A 2017 investor; CropScience biologicals competitor; Joyn Bio JV (dormant)
        - id: d-bunge
          label: Bunge (investor/grain channel)
          detail: Series C investor; N-OVATOR grain buyer partner; grain handling relationship
        - id: d-universities
          label: University Research Network
          detail: 20+ universities including U of Illinois, Purdue, UW-Madison; independent efficacy validation
        - id: d-investors
          label: DCVC / Temasek / Gen Invest.
          detail: Lead Series D investors; anchor institutional capital; board governance
        - id: p-product
          label: Core Products (PROVEN G3, CERT-N, RETURN)
          detail: Gene-edited nitrogen-fixing microbes delivered as seed treatments or in-furrow applications
        - id: p-farmer
          label: Farmer Adoption & Retention
          detail: '>90% farmer retention as of 2024–2025; ~15M cumulative acres treated'
        - id: p-novator
          label: N-OVATOR Carbon Program
          detail: Carbon credit monetization; $6M+ paid to farmers since 2022; Bunge-linked grain channel
      edges:
        - from: d-epa
          to: p-product
          label: TSCA clearance required
          critical: true
        - from: d-usda
          to: p-product
          label: 7 CFR 340 exemption needed
          critical: true
        - from: d-fermentation
          to: p-product
          label: Manufacturing supply
          critical: true
        - from: d-retail
          to: p-farmer
          label: Distribution channel
          critical: true
        - from: d-bayer
          to: p-product
          label: Investor conflict / IP exposure
        - from: d-bunge
          to: p-novator
          label: Grain channel partner
        - from: d-universities
          to: p-product
          label: Independent validation
        - from: d-investors
          to: p-product
          label: Capital and governance
        - from: p-product
          to: p-farmer
          label: Product delivery
          critical: true
        - from: p-farmer
          to: p-novator
          label: N-OVATOR enrollment
    claimRefs:
      - CR019
      - CR021
      - CR023
      - CR024
