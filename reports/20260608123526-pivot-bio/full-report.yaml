companyProfile:
  summary: >-
    Pivot Bio is a Berkeley-founded agricultural biotechnology company developing gene-edited nitrogen-fixing microbes
    that attach to crop roots and replace a portion of synthetic nitrogen fertilizer for corn, wheat, sorghum, and
    cotton growers. Its commercial platform now spans the PROVEN product family for corn, RETURN for small grains and
    sorghum, CERT-N for cotton, and the N-OVATOR program that monetizes verified nitrogen reduction and Scope 3
    outcomes. Public evidence supports real agronomic adoption and product performance, but the company remains
    financially opaque: later private-mark financing activity, true revenue scale, margins, and customer concentration
    are only partially visible from public sources.
