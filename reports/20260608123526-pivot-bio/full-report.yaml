      - number: '8.2'
        title: Current financing context, entry discipline, and preference overhang
        blocks:
          - type: paragraph
            body: >-
              The most recent financing event establishes the reference price: a March 11, 2026 Series F-2 of $100
              million at $5.71 per share, implying a $1.66 billion post-money valuation per Forge Global's Certificate
              of Incorporation data. This round carries a 2x liquidation preference and an 8% cumulative dividend rate,
              meaning Series F-2 investors are owed at least $200 million before any lower-preference or common capital
              participates in an exit. The Series E (July 2024, $54.9 million at $5.70/share, $1.57B valuation) was
              itself a down round from the $2B post-money stated at the Series D in July 2021. The Series F-1 disclosed
              $14.5 million at $1.14 per share, far below the Series E price, which may reflect a debt-like instrument
              or a restructured class rather than a straightforward equity round; the Forge data does not ascribe a
              post-money valuation to the F-1 tranche.


              Forge Global's secondary market entry for Pivot Bio classifies market activity as "Limited" with no
              matched trade prices available as of March 2026. This signals minimal secondary liquidity and means the
              $1.66B figure comes entirely from the company's own cap-table filing, not from arms-length secondary
              transactions. An investor entering today at par with the last round effectively prices above any
              observable secondary clearing level.


              Total capital deployed through the current round is approximately $847 million per Forge Global —
              materially above the $618 million figure in Tracxn data that reflected only rounds through July 2021 and
              confirms that more capital has been raised since the peak valuation, at marks below the 2021 high. The
              dilution and preference overhang has grown with every subsequent round. The multi-year nitrogen price
              assurance programme (2026-2028) announced in March 2026 — in which Pivot Bio commits to holding prices
              stable for three seasons — demonstrates commercial confidence but also raises the question of whether the
              company is locking in a pricing model that constrains upside if demand proves more elastic than expected.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
