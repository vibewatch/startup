      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Forge Global classifies Pivot Bio's IPO status as "IPO Mentioned" — a stage between confidential filing
              and a public S-1, reflecting the existence of market conversation about a public offering without a
              confirmed filing. Agricultural inputs companies have generally performed poorly in public markets since
              2021, with Ginkgo Bioworks down 97% from peak and Bioceres near-insolvent. The more realistic exit pathway
              in the medium term is an M&A deal with a major ag inputs company such as Corteva, Bayer, BASF, or Nutrien,
              each of which has strategic reasons to own a validated nitrogen biology platform. The multi-year price
              assurance programme and the expansion into cotton (CERT-N) and sorghum (Retain) effectively build the
              product breadth that would make Pivot Bio more acquirable.


              The key diligence asks that would materially move the recommendation toward buy are: (1) audited or
              board-deck revenue for 2023-2025 with a gross-margin bridge; (2) the NRR and farmer churn metrics that
              support the >90% retention claim; (3) a full cap-table reconciliation that explains the Series F-1
              anomalous share price of $1.14 versus the $5.70-5.71 per-share in E and F-2; (4) the
              liquidation-preference waterfall as of the most recent round, including any debt tranches; and (5) a
              manufacturing cost curve and the path to gross-margin expansion as acreage scales. Until those files are
              opened, the recommendation remains research-more, not avoid: the technology is real, the market is large,
              and the investor syndicate is strong, but the economics have not been opened sufficiently for investors to
              price the current mark with confidence.
            claimRefs:
              - CV046
              - CV047
              - CV048
              - CV049
              - CV050
              - CV051
              - CV052
