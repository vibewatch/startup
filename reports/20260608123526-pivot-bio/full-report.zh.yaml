      - number: '6.2'
        title: 采用轨迹与具名客户验证
        blocks:
          - type: paragraph
            body: >-
              作为农业投入品公司，Pivot Bio 的公开采用证据在英亩数和试验深度上异常强，尽管具名客户名单比英亩故事更薄。 Pivot Bio 的 2024 年影响报告发布稿称，PROVEN 40 结果已在 34 个州
              6,147 个田块、近 15 million 英亩上得到验证； 2024 年来自 20 个州 97 个县 172 个田块的数据也显示，在每英亩减少 37+ 磅氮的同时，产量保持持平。MIT Technology
              Review 的独立报道补充了年度轨迹视角：2023 年产品使用面积为 5 million 英亩，而两年前为 1 million 英亩。 2026 年田间数据发布又为最新玉米产品加入了真实客户验证集：134
              项田间试验、129 名种植者，平均每英亩替代 33 磅合成氮，带来每英亩 2.1 蒲式耳产量优势，胜率超过 90%。N-OVATOR 通过另一条采用界面补充证据：2022 和 2023 年有 1.5
              million 英亩得到验证，2023 年 20% 客户群加入，2024 年又新增 1.4 million 英亩和 $4.5 million 付款， 自推出以来累计支付超过 $13
              million。具名验证多是官方案例故事，而不是经审计的账户披露，但仍很具体： Mike Denton、Darren Grotz、Travis Milne、Chad Rubbelke、Bob
              Worth、Fischer Family Acres、Dane Whitley 和 Dan Story 都被公开点名；XtremeAg 的 Matt Miles 则提供了带量化 ROI 的外部棉花验证点。
