      - number: '7.2'
        title: 运营与功效风险
        blocks:
          - type: paragraph
            body: >-
              功效波动是 Pivot Bio 面临的最具运营后果的风险，因为它直接决定农户 ROI 和复购率。University of Illinois 一项为期三年、 经过同行评议的标志性研究在 2025 年初发表于
              Agronomy Journal，确认 PROVEN 40 确实能从大气中固氮——在关键营养生长期最高 可达 35 lbs N/acre——但也记录到，氮贡献到收获时会显著下降（季末估计约为 ~10 lbs
              N/acre 等量）。首席研究员 Logan Woodward 指出，在这项研究之前，支持公司主张的“经过同行评议的公开数据”不足；共同作者 Fred Below 强调，“没有一些化肥氮配合时，功效会
              明显降低”。公司自己在 2026 年转向“逐田块咨询”方法，放弃统一的“替代 40 lbs N”信息，改用农艺师指导的建议，并根据土壤类型、
              耕作方式、氮施用率和时点变化。这是在含蓄承认效果波动，也会增加商业复杂度，并重新教育销售渠道。

              生物制造会引入化学合成没有的批次间波动。Pivot Bio 在发酵系统中生产活体微生物；生产、运输或储存中的污染事件、原料波动和 温度偏离都会降低活细胞数量，并损害田间功效。公司称其制造所需资本投入比传统氮设施少
              99%，这个说法可能准确，但并不能消除 质量控制挑战：一次批次失败或零售端保质期失败，不只是损失产品，还可能让农户当季的氮方案失效。微生物产品的冷链物流增加了传统 颗粒氮肥没有的复杂度。Pivot Bio
              通过美国约 500+ 个零售网点分销；在由零售商介导的供应链中保持一致质量，是一项持续运营纪律。

              种子处理兼容性风险来自 PROVEN G3（以及更早产品）以液体种子处理剂形式施用。杀菌剂-杀虫剂种子处理套装在商业玉米生产中几乎是 标配，这些化学包衣与 Pivot Bio
              活体微生物之间的相互作用可能抑制细菌活性。公司在 2024–2025 年引入的 BMPs（最佳管理实践）包含 施用顺序指引，意在缓释这一风险；但参与度较低的零售合作伙伴对 BMPs
              的采用并不均衡，公开来源也无法验证。
