      - number: '8.4'
        title: 乐观、基准和悲观情景及下行触发因素
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求两件事同时成立：第一，Pivot Bio 的激进降价能带来净增量（更低单英亩价格换来更多英亩，合计收入增加而不是减少）；第二，PROVEN G3 产品周期能带动足够采用，让 2027 年收入进入
              $250-400 million 区间。在这些假设下，并假设农业生物制剂市场继续沿 13.7% CAGR 轨迹增长， 5-7x 收入可支撑 $1.8-2.5B 估值。多年定价计划和 CERT-N
              棉花产品上市提供了可信的增量证据。N-OVATOR 碳信用项目增加了一条次级收入流， 自 2022 年以来已向农户支付 $6 million，仅 2024 年就新增 1.4 million 入组英亩。


              基准情景承认：降价部分是为了防守合成氮竞争和更大的既有企业（Bayer、Corteva、BASF 都在投资生物制剂）；收入增长真实存在，但慢于乐观情景； 定价让步会压缩毛利率。在基准假设下，$1.66B
              标记要么是公允价值，要么略偏高；2027–2028 年的 Series G 或公开发行仍有可能，但并不确定。


              悲观情景触发 Indigo 式结局：降价没有带来同比例销量增长，利润率在实现盈利前坍塌，Series F-1 异常定价（每股 $1.14，远低于 E 和 F-2 的 $5.70-5.71
              区间）显示资本结构中可能已经存在压力工具，而 F-2 的 2x 清算优先权要求更高退出估值，才能让后期投资者收回本金。在悲观假设下， 公允价值为 $700M-$1.2B；任何以 $1.66B
              进入的投资者，面对的都是下行融资情景。
