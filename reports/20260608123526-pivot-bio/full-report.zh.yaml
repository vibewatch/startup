      - number: '2.3'
        title: 买方、用户、付款方与渠道路径
        blocks:
          - type: paragraph
            body: >-
              经济买方仍是种植者，但真实采用系统是多方参与。核心玉米、小麦、高粱和棉花项目里，用户是做氮肥时点决策的农户或农场经理，实际推荐者往往是零售农艺师或本地顾问，付款方则是农场经营预算。Pivot Bio
              自身渠道扩张说明了这一点：公司依赖 Hefty Seed 和 Logan Agri-Service 这类受信任的本地零售网络，同时把这些网络与自有农艺支持、地块级氮规划配在一起。Farm Progress 和
              No-Till Farmer 都显示，Pivot 已经从“到处替代 40 pounds”的统一话术，转向逐地块推荐模型；这实质上把可信分销和农艺执行变成产品的一部分。N-OVATOR
              还可以引入第二付款方：下游谷物买家、CPG 和原料公司可以按英亩、按 bushel
              或按排放挂钩溢价付款，部分补偿种植者采用微生物氮的成本。这条共同付款路径具有战略意义，因为它能把一个艰难的农场投入预算决策，改造成投入品加可持续预算的组合决策。
