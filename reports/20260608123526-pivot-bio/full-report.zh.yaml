      - number: '1.2'
        title: 管理层、创始人与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 由 Karsten Temme, Ph.D.（生物医学工程，University of Iowa；UC Berkeley 博士）和 Alvin Tamsir,
              Ph.D.（分子与细胞生物学，UC Berkeley；UCSF 博士）于 2010 年共同创立。两人曾是研究生，率先提出重新激活天然土壤微生物固氮能力这一思路。Temme 从创立起担任 CEO 至
              September 2023，随后 Chris Abbott 出任 CEO，Temme 转任首席创新官。Abbott 曾领导 Continental Grain Company 的 Conti Ventures
              基金，带来深厚的农业商业资本市场经验。Tamsir 保留首席科学官职务，仍是研发核心人物。2024–2025 年，高管团队大幅换新：Robert Houghton（CFO，来自 Life Time Group
              Holdings，2024 加入）、Chris Turner（CCO，曾任 Bayer/Monsanto，2024 加入）、Travis Frey Ph.D.（CTO，April 2025 任命，接替退休的
              Ernie Sanders）、Ryan Degnan（CGO，来自 McKinsey，2025 加入）、Laureen Thompson（CHRO，April 2025 晋升）和 Debra
              Frimerman（CLO，此前为首席业务发展官）。董事会包括来自 DCVC 的投资人董事 Matt Ocko；2021 SEC Form D 列名 Charles Cooper Rinzler 和现任 CEO
              Christopher Abbott 为董事。Generation Investment Management 根据其自身披露持有董事会观察员席位。多个领导岗位在 2023–2025
              这一压缩窗口内变化，构成实质性的关键人物和治理交接风险。
