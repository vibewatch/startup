    rows:
      - - 玉米微生物氮替代
        - 可在玉米种植面积上被替代或补充的合成氮肥支出
        - 磷肥、钾肥、作物保护、种子性状
        - 种植者运营预算；有时由可持续共付方通过 N-OVATOR 分担
        - 当前核心市场；玉米是美国耗氮量最大的作物
      - - 小麦 / 小粒谷物微生物氮替代
        - 适配 RETURN/Retain 类产品的小麦和小粒谷物氮肥支出
        - 与氮管理无关的蛋白溢价、杀菌剂 / 种子支出
        - 种植者运营预算
        - 已商业化相邻市场；小麦是美国第二大用氮作物
      - - 高粱和棉花微生物氮替代
        - 可接受部分 N 替代的高粱和棉花项目氮肥支出
        - 非氮肥力、灌溉、轧棉或纤维溢价经济性
        - 种植者运营预算
        - 扩张方向，把 SAM 从玉米拓宽出去
      - - 下游减氮项目
        - 与经验证 N 减排挂钩的 Scope 3、inset 或粮食溢价预算
        - 没有供应链关联的通用碳抵消
        - 粮食买家、配料供应商、CPG、烈酒生产商
