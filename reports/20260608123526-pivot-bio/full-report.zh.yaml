  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户、付款方拆分与渠道组合
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的客户基础最适合理解为以种植者为中心、由渠道辅助。直接经济买方和终端用户通常是大田作物种植者，
              他们为玉米、小麦、高粱、小谷物，或越来越多的棉花选择氮方案。公司反复把销售代表、田间农艺师和本地零售商 描述为触达层，而不是纯电商动作：销售代表材料承诺直达种植者的供应链，由公司集中开票和收款；作物页面则让
              农户与本地代表和农艺师合作，选择产品和施用方法。因此，实际的买方—用户—付款方拆分会随场景变化。在核心产品 销售里，种植者同时是买方、用户和付款方。在 N-OVATOR
              项目里，种植者仍是产品用户和主要购买者，但出现了第二层 付款方，因为下游食品、原料、烈酒和粮食采购公司会为参与农场的氮信用付款。渠道验证在美国中西部最强，Hefty Seed Company 横跨 10 个州的
              49 个网点给了 Pivot Bio 具名零售足迹；此外，2024 年还有一个更广但大多未具名的网络扩张， 新增近 500
              个零售网点。巴西又是另一个细分市场：公开证据显示当地团队搭建、田间试验、仓库和合作伙伴讨论，但还没有 具名商业客户名单。
