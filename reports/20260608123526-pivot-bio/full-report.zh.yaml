      - number: '2.4'
        title: 增长驱动：可持续拉力、监管与肥料波动
        blocks:
          - type: paragraph
            body: >-
              三个需求驱动最重要。第一，肥料波动再次成为显性痛点。2026 American Farm Bureau 调查发现，超过 5,700 名受访者承受严重可负担性压力，约 70% 无法负担所需全部肥料；自 late
              February 以来，氮价上涨超过 30%，而更低的作物价格放大了这种波动的伤害。第二，环境压力正在加大。EPA
              承认肥料过度使用会污染地下水和地表水，独立报道和倡议组织也在推动更严格的硝酸盐护栏和更多监测。即使监管仍然零散，方向也指向更好的养分核算和更低流失。第三，下游可持续采购正在形成第二条增长向量。AgFunder 对
              N-OVATOR
              的报道以及更广泛的固氮市场评论都显示，只要食品公司、谷物买家和零售商能够把减排归因到真实供应链，它们愿意为可衡量减排买单。这些驱动不保证快速采用，但合在一起扩大了可以支撑微生物氮产品的预算数量：投入成本、风险缓释和
              Scope 3 采购。
