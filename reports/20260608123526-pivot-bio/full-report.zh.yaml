      - number: '6.4'
        title: 巴西扩张、渠道集中与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的扩张逻辑可信，但风险界面主要在渠道执行，而不是原始市场规模。公司正在扩大作物覆盖、扩展零售触达、 搭建合作伙伴生态，并试图用更低价格、本土供应和 2026–2028
              价格锁定计划来降低采购风险。这些动作直接回应了农户对 化肥价格波动和供应的担忧，也暴露了摩擦。价格锁定计划要求 1,000 英亩，或适用种植英亩的 100% 加上最佳管理实践合规，
              自然更偏向规模更大、更成熟的买方。Farm Progress 报道称，Pivot Bio 已不再谈一个通用的氮替代数字，而是要求种植者与 30
              多名农艺师逐田块合作，因为效果取决于土壤类型、耕作方式和施用时点。DTN 更广泛的生物制剂报道是最清晰的反向来源： 它强调一项 61
              个地点的推广研究，在几种固氮产品中，只有两个地点出现显著增产；同时指出生物制剂仍比化肥更难预测， 并警告活体产品处理不当会损害结果。巴西有前景，但从客户验证角度仍未去风险。公开来源显示当地招聘、约 30
              个大型试点区、 仓库，以及与大型农户和本地合作伙伴的协作；但官方措辞仍把巴西表述为“很快”或“获批后”，这意味着市场有扩张信号， 但没有具名商业客户验证。具名渠道证据同样集中：Hefty
              是留存来源中唯一公开点名的大型零售商，因此真实广度大于具名证据， 但还不完全透明。
