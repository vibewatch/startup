  - id: FR001
    title: 风险热力图——可能性 vs. 影响
    type: matrix
    layout: wide
    summary: >-
      Pivot Bio 12 项主要风险的 3×3 可能性—影响分布。最严重的簇同时具备高可能性和高影响：疗效波动和化肥价格战——这两项风险最直接牵动近期农户 ROI 和商业势头。中等可能性 /
      高影响象限包括现金跑道风险和不利监管规则制定。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - 州级登记时间差
            - 冷链 / 保质期失效；零售端 BMP 采用缺口
            - 疗效波动（逐地块 ROI）；合成氮肥价格下压
        - label: 中等可能性
          values:
            - N-OVATOR 碳市场监管风险
            - 批次制造质量失败；CERT-N 棉花上市失手；国际扩张分心；人员 / 执行缺口
            - 现金跑道耗尽；USDA APHIS 对改造微生物制定不利规则；Bayer 冲突显性化
        - label: 低可能性
          values:
            - 标签变更触发 FIFRA 登记
            - 大学发表不利研究；合同制造失败
            - EPA TSCA 对新产品作出不利认定；Corteva 或 Bayer 发起 IP 挑战
    approximationNotes: 可能性评级是作者基于截至 June 2026 可获得公开证据作出的判断。影响评级假设投资周期聚焦美国，期限为 3–5 年。
    claimRefs:
      - CR005
      - CR014
      - CR029
      - CR031
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向图展示 Pivot Bio 的主要风险触发因素如何经由农户 ROI、渠道行为和资本条件传导，最终影响收入增长、估值和融资结果。
    data:
      nodes:
        - id: r-efficacy
          label: 疗效波动
          detail: 各地块平均增产 2–4 bu/acre；最佳表现需要 BMP
        - id: r-nfertprice
          label: 合成 N 价格下跌
          detail: 尿素 / 无水氨价格下行，削弱 Pivot Bio 按每磅 N 计算的成本优势
        - id: r-aphis
          label: APHIS 监管风险
          detail: 改造微生物尚无正式商业化路径；规则制定仍待完成
        - id: r-capital
          label: 现金跑道风险
          detail: Series D（$430M）是最后一轮广泛公告的大额融资；后续私募市场融资数据仅部分公开
        - id: r-batch
          label: 批次质量失败
          detail: 活体微生物制造存在波动；无公开 QA 披露
        - id: r-bayer
          label: Bayer 冲突 / IP 风险
          detail: Bayer 同时是投资方和竞争者；Joyn Bio IP 资产；潜在专利挑战
        - id: r-competition
          label: 竞争者生物制剂
          detail: Corteva、Bayer、Syngenta、Indigo Ag 正在投资生物固氮替代方案
        - id: i-farmroi
          label: 农户 ROI 受损
          detail: 每英亩净经济收益下降，降低复购概率
        - id: i-churn
          label: 客户流失 / 留存下降
          detail: 农户留存率跌破 90%；收入可预测性被削弱
        - id: i-channel
          label: 渠道优先级下降
          detail: 零售商和分销商减少货架资源或推广力度
        - id: i-revenue
          label: 收入增长放缓
          detail: 新农户获取和现有农户英亩扩张同时受损
        - id: i-valuation
          label: 估值 / 融资影响
          detail: 收入倍数压缩；下一轮融资条件更艰难
      edges:
        - from: r-efficacy
          to: i-farmroi
          label: ROI 波动
          critical: true
        - from: r-nfertprice
          to: i-farmroi
          label: 价格优势被侵蚀
          critical: true
        - from: r-competition
          to: i-channel
          label: 竞争者货架竞争
        - from: r-aphis
          to: i-revenue
          label: 新产品延迟
        - from: r-batch
          to: i-farmroi
          label: 产品表现不达标
          critical: true
        - from: r-bayer
          to: i-revenue
          label: IP 争议或竞争情报
        - from: i-farmroi
          to: i-churn
          label: ROI 不佳推动不续约
          critical: true
        - from: i-churn
          to: i-revenue
          label: 英亩流失压低收入
          critical: true
        - from: i-channel
          to: i-revenue
          label: 零售商推广减弱
        - from: r-capital
          to: i-valuation
          label: 融资条款不利或稀释
        - from: i-revenue
          to: i-valuation
          label: 收入倍数牵动估值
          critical: true
    claimRefs:
      - CR011
      - CR025
      - CR029
      - CR032
  - id: FR003
    title: 依赖图——关键合作伙伴和交易对手
    type: dag
    layout: wide
    summary: 有向图梳理 Pivot Bio 在监管机构、制造、资本、分销和研究验证上的关键外部依赖，并展示它们如何连接核心产品交付和商业结果。
    data:
      nodes:
        - id: d-epa
          label: EPA (TSCA / FIFRA)
          detail: 每个新的属间微生物产品都需要获得上市前制造通知（PMN）放行
        - id: d-usda
          label: USDA APHIS BRS
          detail: 7 CFR Part 340 认定；基因编辑细菌适用「Am I Regulated?」流程
        - id: d-fermentation
          label: 发酵制造
          detail: 美国本土生物发酵；公司称资本开支比传统氮少 99%；模式未确认
        - id: d-retail
          label: 农资零售网络（~500 个网点）
          detail: Nutrien、Winfield United、Helena、CHS、独立零售商；触达农户的主要渠道
        - id: d-bayer
          label: Bayer AG（投资方 / 竞争者）
          detail: 2017 年 Series A 投资方；CropScience 生物制剂竞争者；Joyn Bio 合资公司（休眠）
        - id: d-bunge
          label: Bunge（投资方 / 粮食渠道）
          detail: Series C 投资方；N-OVATOR 粮食买家伙伴；粮食处理关系
        - id: d-universities
          label: 大学研究网络
          detail: 20+ 所大学，包括 U of Illinois、Purdue、UW-Madison；独立疗效验证
        - id: d-investors
          label: DCVC / Temasek / Gen Invest.
          detail: Series D 领投方；锚定机构资本；董事会治理
        - id: p-product
          label: 核心产品（PROVEN G3、CERT-N、RETURN）
          detail: 基因编辑固氮微生物，通过种子处理或沟施交付
        - id: p-farmer
          label: 农户采用与留存
          detail: 截至 2024–2025，农户留存率 >90%；累计处理 ~15M 英亩
        - id: p-novator
          label: N-OVATOR 碳项目
          detail: 碳信用变现；自 2022 年以来向农户支付 $6M+；Bunge 绑定的粮食渠道
      edges:
        - from: d-epa
          to: p-product
          label: 需要 TSCA 放行
          critical: true
        - from: d-usda
          to: p-product
          label: 需要 7 CFR 340 豁免
          critical: true
        - from: d-fermentation
          to: p-product
          label: 制造供应
          critical: true
        - from: d-retail
          to: p-farmer
          label: 分销渠道
          critical: true
        - from: d-bayer
          to: p-product
          label: 投资方冲突 / IP 暴露
        - from: d-bunge
          to: p-novator
          label: 粮食渠道伙伴
        - from: d-universities
          to: p-product
          label: 独立验证
        - from: d-investors
          to: p-product
          label: 资本与治理
        - from: p-product
          to: p-farmer
          label: 产品交付
          critical: true
        - from: p-farmer
          to: p-novator
          label: N-OVATOR 加入
