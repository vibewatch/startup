      - number: '2.2'
        title: 美国英亩数和氮预算给出更大的自下而上上限
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 当前在售作物的美国英亩基础足够大，自下而上看出的机会远大于任何全球生物肥料标题报告。USDA NASS 估计 2025 播种面积为 95.2 million corn acres、45.5
              million wheat acres、10.1 million cotton acres 和 6.2 million sorghum acres，合计约 157.0 million
              acres。玉米是锚点，因为它已经吸收美国氮肥用量的 78%；小麦则是第二大耗氮作物。推广机构和大学来源显示，即使经历数十年效率提升，农艺 N 项目规模仍然可观：2024 趋势 N 用量约为玉米 151.8
              lb/acre、小麦 77.15 lb/acre；2026 推广指导仍指向响应性冬小麦地块约 115-135 lb total N，中等产量棉花约 90-108 lb N，许多谷用高粱项目约 60-85 lb
              N，具体取决于施用位置和水分。按作物逐一锚定后，可得一个受证据约束的目标作物氮池：每年约 18.1-25.4 billion pounds of N。若按 2026 小麦指导引用的 USD
              0.60-0.80/lb N 经济性计算，在进一步讨论微生物产品能现实替代多少之前，对应的宽口径年支出池约为 USD 10.8-20.3 billion。
