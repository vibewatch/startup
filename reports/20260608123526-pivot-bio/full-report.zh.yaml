  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Pivot Bio 方案
      - 可衡量收益
      - 限制
    rows:
      - - 在播种时替代部分玉米氮肥
        - 沟施播种作业，并严格管理桶混
        - PROVEN 40 LIF 按 12.8 oz/acre 施用，并配套使用管理控制
        - 伊利诺伊总结显示最高贡献 35 lb N/acre，并有减少一次施氮作业的叙事
        - 开封后使用时限、避光要求和兼容性纪律都很关键
      - - 播种前处理玉米种子
        - 在播种前安排种子处理
        - PROVEN 40 OS 或 PROVEN G3 OS 把微生物放到种子上
        - 公司博客框架称，播种时可布置约 25% 的作物氮需求
        - 种子兼容性和温度稳定性仍是门槛因素
      - - 把氮支持嵌入棉花播种
        - 通过棉花带各州合作伙伴走种子处理流程
        - CERT-N 从出苗到收获持续少量供氮
        - 发布材料称可替代 20% 合成氮，并提升 ~50 lb 皮棉
        - 全面商业化到 2026 年仍在成熟中
      - - 支持小麦或高粱轮作
        - 在既有播种实践中选择拌种或沟施
        - RETURN 把微生物氮扩展到小谷物和高粱
        - 在替代部分化肥的同时守住产量，并可能减少作业次数
        - 公开的作物特定结果数据比玉米薄
      - - 使用播种箱施用，而不是液体或预处理种子
        - 播种时将干载体直接施到种子上
        - PROVEN G3 Dry、CERT-N Dry 和 RETAIN Dry 增加干式施用和微量营养素
        - 提高工作流灵活性，对部分农场更容易接入
        - 均匀包覆、种子流动性和首季田间验证仍需跟踪
    notes: 收益来自公开公司或媒体总结，不应视为有保证的田间结果。
