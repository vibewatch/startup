      - number: '3.4'
        title: 切换成本、锁定效应与分销权力
        blocks:
          - type: paragraph
            body: >
              Pivot Bio 的锁定模型主要是农艺性的，而非合同性的。最低英亩承诺和年度现金 / 信贷方案定价要求农户在每季开始时承诺，但每季结束时退出是可行的。实际切换成本来自农艺关系：Pivot Bio
              的田间农艺师为每个农场的土壤和条件生成特定试验数据，针对未处理对照小区的产量比较需要多个季节才能建立信心。已经看到三个或更多季节、在降低合成氮用量下仍保持稳定产量平价的农户，不太可能切换。N-OVATOR
              碳项目又增加了与多年数据连续性绑定的财务激励。


              分销权力偏向合成肥料既有巨头。Nutrien 约 2,000 个美国零售网点，代表其与玉米带种植者多年关系资本；其农艺咨询服务创造交叉销售和增购优势。Pivot Bio 部分通过这些同一零售商分销（包括
              Nutrien retail），因此形成渠道依赖。如果 Nutrien 开发或收购竞争产品，它可以在自己的零售网络中优先推广自有产品。


              生物制品领域常见多栖采购：农户经常在同一英亩上叠加多个生物刺激素和生物种子处理。Pivot Bio 的种子附着形态兼容大多数种子处理剂共同施用，这意味着种植者可以同时使用 Pivot Bio PROVEN G3
              和 Azotic Envita。短期内，这削弱了零和竞争动态；但如果农户把生物制品看作增量叠加，而不是替代品，也可能稀释 Pivot Bio 的单品价格溢价。


              合作伙伴和供应获取：Pivot Bio 在 St. Louis 的自有冻干和配方设施，以及 Chicago 和 Omaha 的包装 / 分销中心，让它比完全依赖合同制造的竞争对手拥有更多供应链控制。Kula
              Bio 使用合同制造，且未披露产能。Azotic 和 Sound Agriculture 也依赖第三方制造。这项供应链投入为潜在新进入者制造了复制成本。
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
