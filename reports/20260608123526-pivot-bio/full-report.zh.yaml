      - number: '1.5'
        title: 公司里程碑、战略事件与负面进展
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的历史可分三段：隐身科研开发（2010–2018）、玉米和小麦商业放量（2019–2021），以及多元化和领导层交接阶段（2022–2026）。公司在 2014 年于 Delaware
              注册（首份 Form D 于 October 2014 提交），此前非正式工作始于 2010。首款玉米产品 PROVEN® 于 2018 年进入商业销售。公司在 2020 年商业化面向小麦和高粱的
              RETURN®，并在 August 2022 推出 PROVEN 40 On-Seed 和 RETURN On-Seed。N-OVATOR 信用计划于 2022 年启动，并在 2022、2023 和 2024
              年入选 TIME magazine Best Inventions 榜单。November 2022，Pivot Bio 加入 UN AIM for Climate 倡议，成为创新冲刺伙伴，承诺四年内投入
              $291 million 用于研发和产品开发。September 2023 CEO 交接（Karsten Temme 交棒 Chris Abbott）是创立以来最重要的治理事件。2024 生长季，CERT-N
              棉花试验覆盖八个州。PROVEN G3 是第三代玉米产品，拥有三种作用模式，March 2025 亮相，计划 2026 年商业供货。May 2025 AgTech Corridor 迁址公告标志着公司在 15
              年后离开 Berkeley。2026 年有两个负面信号：Forge 二级市场隐含估值 $1.66 B，低于 2021 年 Series D 广泛报道的 $2 B 投后估值；每股价格也较 2021 年高点下降约
              25 %。
