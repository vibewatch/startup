  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的监管图景分成两条线：公司现有玉米产品（PROVEN、PROVEN 40、PROVEN G3）已经在宽松的 APHIS BRS 认定下
              成功跨过初始商业化门槛，但美国改造微生物的前瞻监管路径在形式上仍未解决。2024 年，USDA APHIS 发布了关于 “探索改造微生物商业化路径”的征询信息请求（Docket
              APHIS-2024-0002），明确承认 2020 年更新后的 7 CFR Part 340 没有纳入改造微生物的监管豁免，也没有类似植物 RSR 的微生物监管状态审查流程。Pivot Bio 在 2024 年
              9 月提交了一份 19 页详细评论，主张美国在监管清晰度上已经落后于巴西和阿根廷，并敦促 USDA 对微生物监管采用“看产品、不看过程”的方法。 公司在该文件中披露，APHIS BRS
              此前认定其基因编辑固氮细菌不受 7 CFR Part 340 监管；这是一项有先例意义但不具约束力的 认定，如果监管改革以意外方向成形，仍可能被重新审视。

              在 EPA 的 TSCA 生产前程序下，跨属微生物在商业使用前需要提交生产前通知（PMN）。Pivot Bio 的核心玉米产品已经跨过这一门槛， 但每条新产品线——包括棉花 CERT-N、高粱 Retain
              和小麦 Return——都必须获得新的 TSCA 认定。CERT-N 在 2025 年以有限商业产品 推出，并计划在 2026 年扩大到美国全面商业上市，这意味着 EPA TSCA
              审查已经完成；但公开材料尚未找到 CERT-N 具体 TSCA 认定 或 EPA 审查记录的公开确认，留下第三方验证缺口。EPA 还会根据 FIFRA 监管带有杀虫或生物刺激素主张的生物产品，未来任何向新作物
              品类的产品扩张都可能触发额外 FIFRA 注册要求。

              现有公开记录中没有发现涉及 Pivot Bio 的重大诉讼。公司已经建立 60+ 项专利组合，并有 250+ 项待审申请，覆盖自有微生物菌株、 基因编辑技术和递送方法，能阻挡直接模仿，形成有意义的 IP
              护城河。不过，缺少诉讼历史也反映了公司的私营身份和早期市场位置： 当它继续扩大规模并威胁既有农化收入时，Bayer/Monsanto（Bayer 通过 2017 年 Series A
              成为早期投资者）、Corteva 或 Syngenta 发起对抗性 IP 挑战就变得合理。Bayer 的战略投资身份与其在生物氮领域的竞争利益交织在一起，是投资者尽调应检查的结构性治理风险。
