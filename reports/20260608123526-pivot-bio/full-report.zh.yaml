  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计收入与毛利率桥表
        - 2023–2025 年按产品拆分的收入、毛利率，以及从报价英亩数中拆出的净收入
        - 没有这份材料，任何估值方法都无法区分 $1.2B 和 $2.5B 公允价值；它是最重要的缺失文件
        - CFO 材料或审计师文件；任何投资决策都必须取得。
      - - 农户留存与 NRR
        - 有明确定义的留存率（地块级复购；零售商重复订货）、各队列净收入留存和流失原因
        - 高留存是乐观情景的核心主张；未经验证的 >90% 留存主张不能支撑溢价倍数
        - 商务负责人或商业运营负责人；通过独立零售商访谈确认。
      - - 优先权与股权结构瀑布
        - 完整股权结构表，纳入所有股类、优先权、股息累积和反稀释调整；解释 Series F-1 的 $1.14/share 与 Series E 和 F-2 的 $5.70-5.71 差异
        - 仅 F-2 的 2x 清算优先权，就要求先返还 $200M+，此前股类才可能拿到一美元；完整堆叠决定任何新投资人的退出经济性
        - 总法律顾问和 CFO；标准交割尽调的必需项。
      - - 制造成本曲线与毛利率扩张路径
        - 每英亩制造成本、发酵产能、冷链物流成本，以及生产放量后的成本轨迹
        - 相对合成氮低 50% 的定价，只有在制造成本结构性低于 $10-15/acre 时才会改善利润率；这是单位经济性模型中的关键未知数
        - CTO/COO；由生产设施参观和独立成本审计支持。
      - - 巴西及国际发布里程碑
        - 巴西已确认注册状态、发布时间表、分销协议和市场进入成本；首个国际市场是商业模式全球可扩展性的代理指标
        - 每份投资人演示都提到国际扩张；若没有已确认里程碑，说明它仍更像愿景，而非已获资金支持的计划
        - CEO 和商业团队；要求取得巴西 MAPA 监管备案确认。
    notes: 本表列明哪些证据可以让判断从继续研究转向买入；缺少单项不应阻断流程，但收入桥表和股权结构瀑布是二元门槛。
