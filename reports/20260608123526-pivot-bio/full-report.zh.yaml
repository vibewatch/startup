    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - PROVEN G3 和 CERT-N 已在商业规模验证固氮效果；2025 年试验的 >90% 胜率和 2.1 bu/acre 优势，使 Pivot Bio 区别于包括 Joyn Bio 在内的农业生物固氮失败前例。
        - 若独立大学复现显示胜率低于 70%，或氮替代率在不同土壤类型上不稳定，判断会软化。
      - - 多年定价比合成氮低 50%，并锁定至 2028 年，让 Pivot Bio 在波动的化肥市场中成为低成本氮源——把逆风转成商业顺风。
        - 只有制造成本显著低于合成氮，价格领导力才成立；需要毛利率数据确认投资逻辑能否持续。
      - - 顶级投资人组合（Breakthrough Energy、DCVC、Generation Investment、Temasek、Rockefeller）加上大型化肥行业高管的董事会层面接触，既传递信心，也提供战略验证。
        - 战略投资人还需要后续收入证据来验证战略理由；仅有董事会席位不能证明商业牵引。
      - - 反向逻辑：公司累计融资 $847M、商业化五年后，收入仍从未披露；2026 年每股价格（$5.71）低于 2021 年 Series D 价格（$7.59），意味着较峰值出现实质性下轮估值。
        - 若尽调显示收入超过 $200M、毛利率高于 60%，判断会明显软化。
      - - 反向逻辑：Ginkgo/Joyn Bio 失败、Indigo Agriculture 估值削减 93%，说明低利率高增长环境中看起来诱人的生物投入品逻辑，一旦商业化受挫或宏观收紧，就可能迅速瓦解。
        - 这种风险只适用于从未证明单位经济性的公司；Pivot Bio 的田间证据多于 Joyn Bio 或 Indigo，这构成差异，但还不够。
      - - 反向逻辑：Series F-2 带 2x 清算优先权和 8% 累积股息，意味着任何低于 $1.66B 的退出都不会给 F-2 之前股东留下回款；优先权包袱是下行情景中的结构性逆风。
        - 若下一次融资事件是带优先权转换的公开发行，包袱风险会下降；截至 2026 年 6 月，尚无公开发行确认。
    notes: 论点是与价格和尽调结果绑定的投资主张，不是静态公司属性。
