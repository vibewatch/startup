      - number: '8.5'
        title: 退出准备度与最后尽调清单
        blocks:
          - type: paragraph
            body: >-
              Forge Global 将 Pivot Bio 的 IPO 状态归类为 “IPO Mentioned”——这是介于保密递交和公开 S-1 之间的阶段，反映市场上存在关于公开发行的讨论，
              但没有确认的申报文件。2021 年以来，农业投入品公司在公开市场整体表现较差，Ginkgo Bioworks 较峰值下跌 97%，Bioceres 接近资不抵债。 中期更现实的退出路径，是与
              Corteva、Bayer、BASF 或 Nutrien 等大型农资公司达成 M&A 交易；这些公司都有战略理由拥有一个经过验证的氮生物平台。
              多年价格保障计划，以及向棉花（CERT-N）和高粱（Retain）扩张，实际上是在搭建产品宽度，让 Pivot Bio 更适合被收购。


              能把建议实质推向买入的关键尽调材料包括：(1) 2023–2025 年经审计或董事会材料口径收入，以及毛利率桥；(2) 支撑 >90% 留存主张的净留存率（NRR） 和农户流失指标；(3)
              完整股权结构表核对，解释 Series F-1 每股 $1.14 与 E 和 F-2 每股 $5.70-5.71 的异常价差；(4) 截至最近一轮的清算优先权瀑布， 包括任何债务分段；以及 (5)
              制造成本曲线和英亩规模化后毛利率扩张路径。在这些文件打开之前，建议仍是继续研究，而不是回避：技术真实，市场很大， 投资者财团强，但经济性披露还不足以让投资者有信心为当前标记定价。
            claimRefs:
              - CV046
              - CV047
              - CV048
              - CV049
              - CV050
