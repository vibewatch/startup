      - number: '1.4'
        title: 经营规模、影响指标与关键绩效指标
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的商业进展主要看管理英亩数和氮替代活动。May 2025 AgTech Corridor 迁址新闻稿称，公司技术已在“北美近 15 million acres 农田”上采用。N-OVATOR®
              计划在 2022 和 2023 生长季验证了 1.5 million acres 的氮替代，替代 28,500 metric tons 合成氮，避免 251,444 metric tons
              CO2-equivalent。公司官网报告，自 2022 年以来累计避免 CO2e 超过 1,050,000 metric tons。到 October 2024，N-OVATOR 计划自 2022
              启动以来已向农户支付超过 $13 million（早前数字为 $6 million）。2024 年，公司下调 2025 生长季 PROVEN 40 价格，并宣布面向农户的 0 %
              融资方案，理由是经济环境艰难；一项 2022–2024 全国研究发现，用 PROVEN 40 替代约 40 pounds of N 后，植株内氮平均提升 9 %，产量优势约 one bushel per
              acre。2024 University of Kentucky 研究发现，在免耕、覆盖作物地块中产量增加 11-bushel-per-acre。2024 客户满意度调查（n ≈ 400 名农户）给出 91 %
              满意度。作为未上市公司，收入和 EBITDA 仍未披露；员工数也未披露。公司把 South America (Brazil) 和 Africa 作为国际扩张前线，目标是获得产品批准并商业发布。
