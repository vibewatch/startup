      - number: '5.3'
        title: 使用管理、质量控制与监管定位
        blocks:
          - type: paragraph
            body: >-
              真正的尽调结论是，Pivot Bio 的产品更像活系统，而不是大宗化肥。公司公开的标签、操作页面、使用管理 PDF 和快速参考表反复强调有效期、避光、温度控制、开封后计时、兼容性检查，以及不同剂型的使用规则。
              这些文件很好地证明，公司已经把生物活性转成一套运营纪律。它们也证明产品本身脆弱：施用窗口、储存温度 或桶混选择一旦处理不当，效果就可能下降。因此，公开质量控制确实存在，但它是流程指引，不是带有活细胞
              放行规格、失败率或投诉数据的硬制造仪表盘。


              监管图景大体可理解，但并不完全透明。APHIS 公开了适用于部分基因工程生物的联邦生物技术监管框架， 而 Pivot Bio
              的专利强调非跨属编辑，并且不存在转基因序列。这个组合指向基因编辑微生物投入品的监管姿态， 而不是传统 GMO 种子性状的上市路径；但公司没有发布一份逐产品、逐监管机构的合规备忘录。今天可见的商业
              闸门更务实：PROVEN G3 等新品上市仍需要州级注册，公开材料也没有按 SKU 集中列出这些批准。承保判断看， 使用管理体系很严肃，但公开合规包仍比高度受监管买方希望看到的更薄。
