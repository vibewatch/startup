      - number: '5.2'
        title: 机制、基因编辑与 IP 差异化
        blocks:
          - type: paragraph
            body: >-
              核心产品主张并不只是 Pivot Bio 使用微生物；真正关键在于，公司使用的是经过基因编辑的固氮菌， 设计目标是在土壤已经含有合成或有机氮时仍继续固氮。这个区别很重要，因为普通自由生活固氮微生物
              往往会在氮充足时下调固氮。公开专利材料和第三方摘要在机制上方向一致：靶向编辑改变微生物对周边 氮的调控反应，支持铵排出，并改善田间条件下与根系相关的递送。公开专利还显示，Pivot Bio 并不依赖
              单一通用细菌底盘。公司描述的是工程化 Klebsiella variicola 和 Kosakonia sacchari 菌株，以及 一套引导式微生物重塑流程，目标是强化固氮、定殖等有益植物功能。


              现有外部验证有意义，但大多仍通过摘要呈现，而不是完整开放的科学论文。World Fertilizer 和 University of Illinois
              研究摘要都描述了基于同位素的证据，显示大气氮进入了处理过的玉米植株； Agronomy Journal 摘要则把早期营养生长期每英亩最多 35 磅氮归因于 PROVEN 40。PROVEN G3 进一步
              把机制故事商业化：它加入四种微生物、三种作用模式的架构，意在把直接固氮与养分吸收支持结合起来。 因此，产品护城河不是一个关于生物学的简单营销说法，而是微生物 IP、配方诀窍和田间部署学习的组合。
