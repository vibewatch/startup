        title: 收入模型与渠道架构
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的收入模型更应理解为季节性按英亩产品销售，而不是软件订阅或按使用量计费服务。2026 锁价页面和 March 2026 供应保障公告显示，公司采用可签约的产品模型，种植者和零售商可锁定
              2026、2027 和 2028 年价格，但需满足最低英亩承诺和年度付款安排。合格产品组合跨越多种配方和作物——玉米、棉花、高粱和小麦——因此变现与种植英亩和所选交付形式绑定，而不是单一旗舰 SKU。公开 GTM
              证据还显示，公司并不依赖纯直达农户模式：Pivot 的玉米页面强调销售代表与田间农艺师并肩工作，价格页面明确标注面向授权销售代表和零售伙伴，Hefty Seed 合作又把产品放进一个 49
