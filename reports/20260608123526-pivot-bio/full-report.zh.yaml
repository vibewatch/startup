      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              根据 SEC Form D 文件和 Forge Global 数据，Pivot Bio 经历了七次不同融资事件；不过，公司新闻稿披露的轮次规模与 Forge 基于公司注册证书 (COI)
              的数据存在差异。公司最受关注的一轮是 $430 M Series D（首次出售 28 June 2021；Form D 于 4 August 2021 提交），新闻稿称投后估值约 $2 B。该事件的 SEC
              Form D 记录来自 19 名投资者的总募资额为 $434,999,176。各轮核心投资者包括 DCVC（种子轮及之后每一轮）、Temasek Holdings、Generation Investment
              Management、Breakthrough Energy Ventures、G2 Venture Partners、Prelude Ventures、Bunge Ventures、Continental
              Grain/Conti Ventures、Rockefeller Capital Management、Tekfen Ventures、Hercules Capital 和 Pavilion
              Capital。2024 年，Forge Global 的 COI 数据显示 Series E 约 $54.9 M，隐含估值 $1.57 B。March 2026，Forge 记录一轮 $100 M 的
              Series F-2，价格为每股 $5.71，隐含投后估值 $1.66 B。Forge 汇总 COI 数据对应累计融资约 $847 M；较低的公开口径约 $618 M，只反映官方宣布轮次。隐含每股价格从
              $7.59（Series D, 2021）降至 $5.71（Series F-2, 2026），五年内经稀释调整的每股价值大约下降 25 %，这是负面的估值信号。Forge 将 Pivot Bio
              的二级市场活跃度评为 “Limited”，说明当前隐含价格下交易流动性很薄。
