      - number: '8.3'
        title: 可比公司组与公私市场映射
        blocks:
          - type: paragraph
            body: >-
              没有完全直接可比的上市公司。结构上最相关的比较组结合了合成生物学平台、专业农资公司，以及更广泛的农业生物制剂 M&A。Ginkgo Bioworks (DNA) 截至 2026 年 6 月市值 $537
              million，EV/revenue 为 3.79x，收入基数为 $170 million，累计亏损 $6.2 billion，且仍在重组。Ginkgo 的轨迹—— 2021 年末 SPAC 时代估值峰值约
              $17 billion，如今下跌 97%——是一个极端警示样本。Bioceres Crop Solutions (BIOX) 市值 $27 million， EV/revenue 为
              0.87x，事实上接近困境状态。综合种子和作物保护巨头 Corteva (CTVA) 市值 $51.5 billion，收入倍数约 4-5x，但它的规模、 多元化和盈利能力让它更像上限，而不是下限。


              在农业生物制剂私营同行中，Indigo Agriculture 是最有启发性的反向可比。Indigo 曾以 $3.5 billion 估值融资，据报道又在 2023 年把自身估值 下调到约 $250
              million——下降 93%——说明当商业化低于预期时，生物投入品投资逻辑会多快瓦解。Joyn Bio 于 2023 年 9 月关闭；这个由 Bayer/Ginkgo 组建、旨在复制 Pivot Bio
              所做事情的合资公司，证明即使背后有极大企业 R&D 预算，固氮生物学要规模化产品化也很难。


              Pivot Bio 的 $1.66B 标记按任何公开市场标准都意味着较高收入倍数，除非公司披露的表现（15 million 英亩、34 个州、25-30% 降价、2024 年创纪录季、 90%+ 胜率）伴随超过
              $200-300 million 的收入。这个收入估计未经验证。乐观情景用 5-7x 收入倍数套在经增长调整的收入基数上；基准情景用 3-4x； 悲观情景测试 1.5-2x。即便用悲观倍数，收入也必须超过
              $100 million，才能按标准 EV/Revenue 口径支撑 $1.66B 标记。
