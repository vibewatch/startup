      - number: '2.5'
        title: 采用障碍：变量、信任和 ROI 证明仍是主导因素
        blocks:
          - type: paragraph
            body: >-
              同一批支持市场扩张的证据，也解释了为什么采用很可能继续不均衡。更广泛的固氮和 BNF 文献反复指出，土壤、天气模式、竞争微生物和储存条件会造成田间表现差异，商业接种剂也存在真实质量控制问题。Pivot Bio
              自己的渠道评论也呼应了这一现实：公司现在强调遵守最佳管理实践，承认产品不是放之四海而皆准，并称当种植者或分销伙伴在不合适的氮情境下使用产品时，早期胜率明显较低。这样一来，GTM
              负担就压到零售信任、农艺支持和反复的本地证明上。大宗商品周期构成另一道刹车。农场利润紧张时，种植者可能重视降低波动，但也会要求更快回本，更不愿意试验。最后，市场仍缺少几个决策关键数据点的公开披露：按作物划分的付费经常性英亩、零售商售出率和续约率，以及覆盖好年份和坏年份的真正独立多年
              ROI 队列。因此，市场显然真实存在，但最相关的可服务市场（SAM）和可获取市场（SOM）输入，在公开证据里仍只能观察到一部分。
