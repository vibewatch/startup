    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio, Inc. 是一家 Delaware 注册的农业生物技术公司，成立于 2010 年，总部位于 Berkeley, California（SEC EDGAR 文件中的主要地址为 2910
              Seventh Street, Berkeley CA
              94710）。公司开发并商业化经基因编辑的土壤微生物，把空气中的氮直接固定在植物根部，为玉米、小麦、高粱、小粒谷物和棉花种植者提供合成氮肥的替代或补充方案。它的商业模式是直达农户和零售商分销：产品以种子处理剂或沟施形式销售，经独立农艺零售商和不断扩大的全国零售网络触达市场，近几年新增合作伙伴超过
              500 家。补充收入线 N-OVATOR® 氮信用计划，把入组农户与购买经验证 Scope 3 减排量的企业买家连接起来，为种植者带来年度现金付款，同时为公司沉淀可持续数据资产。Pivot Bio
              的产品归入面向谷物的 PROVEN® 和 RETURN® 品牌族，以及面向棉花的 CERT-N™。公司把整体使命表述为降低对合成氮的依赖和相关温室气体排放，同时提升作物产量和农户盈利能力。May
              2025，Pivot Bio 宣布将总部从 Berkeley 战略迁至美国 Midwest（Wayzata, Minnesota 一带），把科研和商业运营整合到离核心农业市场更近的位置，同时保留 St.
              Louis (Missouri)、Iowa 和 São Paulo (Brazil) 办公室。
