      - number: '8.2'
        title: 当前融资背景、进入纪律与优先股压力
        blocks:
          - type: paragraph
            body: >-
              最近一笔融资确立了参考价格：2026 年 3 月 11 日 $100 million Series F-2，每股 $5.71；按 Forge Global 的公司注册证书 数据，隐含投后估值 $1.66
              billion。这一轮带有 2x 清算优先权和 8% 累积股息，意味着 Series F-2 投资者在任何较低优先级或普通股资本参与退出前， 至少应先获得 $200 million。Series E（2024 年
              7 月，$54.9 million，每股 $5.70，估值 $1.57B）本身已低于 2021 年 7 月 Series D 披露的 $2B 投后估值。Series F-1 披露为 $14.5
              million、每股 $1.14，远低于 Series E 价格，可能反映类债工具或重组后的股份类别，而不是一轮直接股权融资； Forge 数据没有给 F-1 分段标注投后估值。


              截至 2026 年 3 月，Forge Global 的 Pivot Bio 老股交易市场页面把市场活动标为 “Limited”，且没有可用的匹配成交价格。这说明二级流动性极低， 也意味着 $1.66B
              数字完全来自公司自身的股权结构文件，而不是独立第三方老股交易。今天若有投资者按上一轮平价进入，实际上是在任何可观察二级清算价格 之上定价。


              Forge Global 显示，当前轮次后累计投入资本约 $847 million，明显高于 Tracxn 数据中的 $618 million；后者只反映截至 2021 年 7 月的轮次，
              并确认峰值估值后，公司又以低于 2021 年高点的标记筹集了更多资本。每一轮后续融资都让稀释和优先股压力加重。2026 年 3 月宣布的多年氮价格保障计划 （2026–2028）——Pivot Bio
              承诺三个季节保持价格稳定——展示了商业信心，但也提出一个问题：如果需求弹性强于预期，公司是否把自己锁进了限制上行空间的 定价模型。
