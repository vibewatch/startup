            title: CEO 交接与领导层纵深风险
            body: >-
              Pivot Bio 在 September 2023 进行了重大治理交接，以外部招聘的 Chris Abbott 取代联合创始人 CEO Karsten Temme。随后 2024–2025
              年高管层换新（CFO、CTO、CCO、CGO、CHRO 均更换或新设），在很短窗口内形成异常高的领导层变动率。Temme 和 Tamsir 仍留在高级技术岗位，但创始 CEO
              带来的运营连续性消失，同时多名高管层管理者更换，使公司在关键国际扩张和产品代际更替周期中面临执行风险。
