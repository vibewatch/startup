      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的上市销售模式高度依赖农业零售商、分销商和种子公司关系，而不是直接面向农户销售。公司运营约 500+ 个零售网点， 并依靠超过 30
              名农艺师组成的商业农艺田间团队来支持和培训零售渠道。美国农业零售一直在显著整合——Nutrien、Winfield United (Land O'Lakes)、Helena Chemical (Crop
              Science division) 和 CHS 主导渠道。随着更少的零售组织控制越来越多的农户采购， Pivot Bio 的议价能力会削弱，与 Corteva、Bayer 和 BASF
              等既有产品争夺货架空间的竞争也会加剧。任何前五大农资零售商决定下架 或弱化 Pivot Bio 产品，都可能实质影响关键地区触达。

              Bayer AG 既是战略投资者（通过参与 2017 年 Series A），又通过其 CropScience 生物制剂业务，以及与 Ginkgo Bioworks 组建、探索 生物固氮的 Joyn Bio
              合资公司，构成直接竞争者；该项目虽已沉寂，但仍代表潜在 IP 和竞争威胁。这种双重角色制造了投资者尽调应检查的 结构性冲突：Bayer 能接触 Pivot Bio
              董事会讨论，以及潜在保密的产品和商业策略数据，同时又在建设竞争能力。公司没有公开说明如何管理 这一冲突。

              Bunge 是全球粮食贸易和加工公司，也是 Series C 投资者（2020 年 5 月 $100M 轮），天然适合作为 Pivot Bio N-OVATOR 碳信用项目的
              渠道伙伴；该项目奖励使用微生物氮的农户。Bunge 关系如果恶化——无论来自粮食交易策略变化、Bunge 并购活动，还是碳市场监管——都会影响 N-OVATOR 项目的商业可行性和 Pivot Bio
              的下游市场情报。合同制造（如果用于发酵产能）会构成另一层依赖，但公开来源尚未确认。
