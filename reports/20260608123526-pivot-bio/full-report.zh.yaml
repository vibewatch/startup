  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 主要风险
    rows:
      - - 乐观
        - G3 胜率维持在 90%+，推动种植面积快速扩张；降价带来增量销量；2025–2026 年收入超过 $250-400M；巴西扩张贡献有意义规模；CERT-N 棉花和碳信用增加多元化；2027–2028 年并购或 IPO。
        - 收入 5-7x 倍数对应 $1.8-2.5B 区间；若尽调验证高增长且毛利率高于 60%，相对当前标记价有上行或至少持平。
        - 需要干净的数据室和 2+ 年强劲商业 KPI；公开证据尚未确认。
        - 巴西执行风险；Corteva、Bayer、BASF 生物制剂部门的竞争反应；全球化肥价格大幅下跌可能削弱 ROI 逻辑。
      - - 基准
        - 收入增长真实但温和（每年 10-20%）；定价让利压缩毛利率；优先权包袱限制普通股上行；IPO 最早也要 2028–2029 年；需要 Series G。
        - 收入 3-4x 倍数对应 $1.2-1.7B 公允价值；当前 $1.66B 标记价处在基准假设下可辩护区间的上沿。
        - 公开证据下最可能路径；与估值轨迹一致：$2B（2021）→ $1.57B（2024）→ $1.66B（2026）。
        - 进一步定价让利可能把利润率压到可接受水平以下；Forge 老股交易仍有限，压制退出选项。
      - - 悲观
        - 降价没有带来足够销量增长；毛利率急剧压缩；Series F-1 异常定价发出结构性压力信号；在位企业的生物制剂侵蚀定位；出现 Indigo 式下轮动态。
        - 收入 1.5-2x 倍数对应 $700M-$1.2B 区间；当前标记价高估 40-55%；Series G 很可能下轮。
        - 若尽调显示收入低于 $150M 或毛利率低于 40%，概率会快速上升。
        - F-2 的 2x 清算优先权意味着普通股和早期优先股投资人先承担全部损失；悲观估值下，优先权瀑布会放大下行。
    notes: 估值区间是基于公开可比公司倍数的情景承销判断；区间刻意拉宽，因为 Pivot Bio 未披露收入和利润率。
