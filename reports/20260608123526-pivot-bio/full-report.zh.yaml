        This table exhaustively covers the valuation comparable set used in this chapter — the Pivot Bio reference mark
        plus five comps spanning public synthetic-bio, public specialty ag-biotech, large integrated ag inputs, a
        directly comparable ag-biotech down-round, and a cautionary nitrogen-fixation failure.
