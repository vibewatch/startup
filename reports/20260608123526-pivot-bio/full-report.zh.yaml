      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: $847M 已投入，收入仍不透明
            body: >-
              Pivot Bio 累计已融资约 $847 million（Forge Global），但从未发布经审计收入、毛利率或客户经济性。$2B 估值的 Series D 已过去五年，
              仍没有任何公开财务披露，这是投资逻辑中最大的单一风险因素。没有至少一个收入运行率数字，任何标准估值框架都无法区分 $700M 与 $2.5B 哪个才是公允价值。
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
              - CV047
              - CV048
          - type: callout
            title: 从 $2B 峰值下行的融资轨迹值得细查
            body: >-
              Forge 股权结构数据显示，每股价格从 $7.59（Series D，2021 年 7 月）降至 $5.70（Series E，2024 年 7 月），再到基本持平的 $5.71 （Series
              F-2，2026 年 3 月）。从每股经济性看，这条轨迹相对 2021 年峰值是真实下行融资。每股 $1.14 的异常 Series F-1 进一步复杂化了图景。 今天以 $1.66B
              参考标记进入的投资者，定价低于 2021 年隐含价值，但高于任何可观察二级清算水平。
            calloutType: insight
            claimRefs:
              - CV015
              - CV018
              - CV020
              - CV021
          - type: callout
            title: 在所有竞争对手都失败的场景里完成规模化验证
            body: >-
              Joyn Bio 关闭和 Indigo Agriculture 估值下调确认，Pivot Bio 做成了一件资金雄厚的既有企业（Bayer、Ginkgo）和融资充足的初创公司（Indigo） 都没做成的事。到
              2024 年，PROVEN 平台累计商业使用面积达到 15 million 英亩，2025 年试验胜率超过 90%。这是差异化且进入壁垒很高的成就； 如果经济性得到确认，它可以支撑相对 Ginkgo 或
              Bioceres 可比公司的溢价倍数。
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV031
              - CV035
