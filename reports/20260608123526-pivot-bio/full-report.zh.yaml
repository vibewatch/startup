  - id: TV005
    title: 投资逻辑破裂与放弃触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入经济性令人失望
        - 尽调显示 2025 年收入低于 $150M 或毛利率低于 40%
        - 3-7x 收入倍数区间坍缩；迫使以低于 $1.2B 的公允价值重新承销
        - 转为回避或要求深度折扣；当前标记价变得站不住脚。
      - - 降价没有带来销量增量
        - 2026 年英亩增长无法抵消 30% 标价下调；分销扩张后，产品总收入持平或更低
        - 证实问题是结构性利润率，而不是销量增长故事
        - 完全重审乐观情景；重新接触前先监测 2026 年季节数据。
      - - 出现 Ginkgo/Joyn 式退出主要作物板块
        - Pivot Bio 退出玉米，或因受控试验数据未暴露的表现短板撤回 G3
        - 摧毁核心投资逻辑；玉米占当前英亩基础 90% 以上
        - 退出持仓；投资逻辑终止。
      - - 资本结构或治理恶化
        - Series G 标记价低于 $1.57B（2024 年 Series E 价格），或有证据表明 Series F-1（$1.14/share）反映困境债务转换
        - 表明优先权包袱难以处理，M&A 或 IPO 受损
        - 要求完整披露优先权瀑布；不要以高于上一轮融资价的价格投资。
      - - 关键市场阻止基因编辑微生物的监管障碍
        - APHIS 或 EPA 对基因编辑土壤微生物出台新的移动或释放限制，并实质限制田间使用
        - 扼杀核心产品线的市场进入路径
        - 暂停投资流程；重新接触前先聘请监管法律顾问。
    notes: 这些下行触发项会影响估值，应该改变价格，而不只是听起来令人不适的标题风险。
