companyProfile:
  summary: >-
    Pivot Bio 是一家创立于 Berkeley 的农业生物技术公司，开发经基因编辑的固氮微生物。这些微生物附着在作物根部，为玉米、小麦、高粱和棉花种植者替代一部分合成氮肥。其商业平台已覆盖面向玉米的 PROVEN
    产品族、面向小粒谷物和高粱的 RETURN、面向棉花的 CERT-N，以及把经验证的氮减量和 Scope 3 成果变现的 N-OVATOR
    计划。公开证据支持其农艺采用和产品表现已经真实落地，但公司财务仍不透明：后续私募融资活动、真实收入规模、利润率和客户集中度，公开来源只能看到一部分。
