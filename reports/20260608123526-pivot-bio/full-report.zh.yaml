            title: 投资逻辑假设现有玉米产品监管风险保持低位
            body: >-
              投资逻辑隐含假设是，USDA APHIS BRS 对 PROVEN 系列玉米产品作出的 “Am I Regulated?” 认定，在商业化路径规则制定过程中仍然有效。 如果 APHIS
              规则制定施加追溯性许可要求，这一假设就会失效，整个产品收入基础都会面临风险。
