  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数或估值
      - 与 Pivot Bio 的相关性
      - 局限
    rows:
      - - Pivot Bio（Series F-2，2026 年 3 月）
        - $1.66B 投后；$5.71/share；2x 清算优先权
        - 参考标记价；来自 COI，而非老股交易
        - 直接标的公司；最近私人市场价格锚
        - 收入未披露；无二级市场佐证。
      - - Ginkgo Bioworks（DNA）——上市合成生物 / 农业生物平台
        - $537M 市值；$170M 2025 年收入；$574M EV
        - 3.79x EV/revenue；BTIG 卖出评级（目标价 $5，2026 年 6 月）
        - 农业生物 / 合成生物上市可比公司；体现市场纪律
        - 模型是细胞编程平台，不是大田作物投入品；农业板块已关闭（Joyn Bio）；亏损按比例远大于 Pivot Bio。
      - - Bioceres Crop Solutions（BIOX）——上市特色农业生物科技
        - $27M 市值；$255M TTM 收入；$254M EV
        - 0.87x EV/revenue；接近困境
        - 直接特色农业生物科技可比公司；生物制剂和生物技术种子
        - 接近资不抵债；集中于拉美；作物重点不同。
      - - Corteva（CTVA）——上市综合农业投入品（种子和作物保护）
        - $51.5B 市值；~$17B 年收入
        - ~3x EV/revenue，因规模和盈利能力享有溢价
        - 为大型综合农业投入品公司设定倍数上限
        - 规模和盈利能力不可比；仅用作可比上限。
      - - Indigo Agriculture——私营；农业生物科技可比下轮案例
        - $3.5B 峰值估值（2019）；~$250M 标记价（2023）
        - 较峰值估值削减 ~93%；反向可比
        - 最可比的私营生物投入品公司；类似商业化承诺落空
        - 产品更早期；治理问题；商业模式不同（土壤微生物组 + 碳）；与 Pivot Bio 不完全相同。
      - - Joyn Bio（Bayer/Ginkgo）——已关闭固氮合资公司
        - 5+ 年后于 2023 年 9 月关闭；投资金额未披露
        - 不适用；终局结果
        - 固氮生物学的直接竞争 / 警示可比
        - 它是合资公司，不是独立公司；由公司出资而非风险投资支持；从未推出商业产品。
    notes: 倍数采用截至 2026 年 6 月 5–8 日的公开市场数据；Pivot Bio 收入按公开种植面积和产品定价数据隐含估计为 $200-400M；纳入 Indigo 和 Joyn 是为了用反向可比约束下行情景。
    enumerationScope:
