      - number: '5.4'
        title: 产品线依赖、路线图与成熟度
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的产品成熟度已经足够高，主要承保问题不再是“有没有产品？”，而是“规模化执行还依赖什么？” 公开可见的依赖分成四类。第一是制造和供应：公司称已提高 St. Louis
              产能，使用本土供应链，并加入多年 保障计划，以稳定 2026 至 2028 年的供应和定价。第二是合作伙伴分销和田间服务：Hefty Seed 和 Pivot Bio
              的农艺网络很重要，因为氮替代仍按田块具体情况销售，而不是一刀切。第三是设备和剂型集成：沟施用户可能 需要 NLIGHTEN 或同等设置，干剂型则依赖播种机箱操作，甚至种衣处理。第四是注册：G3 和部分新剂型在公开
              上市文案里仍明确带有州级注册闸门措辞。


              成熟度上，PROVEN 40 看起来是商业验证最充分的 SKU，PROVEN G3 则是旗舰技术升级，也是 2026 年故事的中心。 RETURN 确实存在且覆盖多作物，但公开证据深度弱于玉米。CERT-N
              看起来商业上真实存在，但仍处在更早的铺开阶段， 更依赖上市执行。干剂型改善了作业流程适配度，但也是首季商业化界面。因此，路线图可信且已经产品化，但并非 没有风险：Pivot Bio
              在销售一个已经跨越多作物、多剂型的平台，这种宽度同时提高防御性和运营复杂度。
            claimRefs:
