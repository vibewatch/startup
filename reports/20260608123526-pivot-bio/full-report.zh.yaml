      - number: '6.3'
        title: 留存代理指标、复购与耐久性缺口
        blocks:
          - type: paragraph
            body: >-
              耐久性是客户故事中公开披露最弱的一环。有一些有用的代理指标，但不是投资者承保时想看的指标。最强的正面代理 不是合同，而是行为：Pivot Bio 自己的 N-OVATOR
              页面把项目描述为每个作物周期都可重复参与，且没有多年合同； 官方推荐语也显示多个季节的重复使用。Travis Milne 称，他的农场在不同土壤类型上测试 Pivot Bio 多年，之后才把它
              纳入肥力计划；Dane Whitley 则把它称为农场计划的内嵌部分，因为无论天气如何，氮都在那里。CropLife 还引用了一项 2024 年第三方调查，样本接近 400 名农户；Pivot Bio 获得
              91% 满意度，主要驱动因素是植物健康、施用便利性和 ROI。 但这些代理指标都不能替代已披露的总留存率、净收入留存率、流失率、续约率、合同期限，或下一季保留英亩占比。 甚至 N-OVATOR
              的年度设计也是双刃剑：它降低参与摩擦并支持重复性，但也意味着公开材料无法证明多年合同锁定。 结果就是，本章可以支撑采用和可推荐性，但真实耐久性经济性仍是证据缺口。
