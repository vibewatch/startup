    type: flow
    layout: standard
    summary: 公开的种植户流程从按作物选择产品开始，以整个季节根区供氮和本地化支持结束。
    data:
      nodes:
        - id: n1
          label: 选择作物和氮方案
          detail: 种植户和农艺师决定玉米、棉花、小麦或高粱的氮方案里是否要加入微生物氮替代。
        - id: n2
          label: 匹配施用形态
          detail: 用户根据播种机配置和偏好流程选择沟施、种上或干式播种箱交付。
        - id: n3
          label: 正确处理产品
          detail: 在温度范围内储存，避开阳光，检查有效期，并遵循兼容性规则。
        - id: n4
          label: 播种时施用
          detail: 种子处理、种上包衣、液体罐施用或干式播种箱分层，把微生物放到种子或根区。
        - id: n5
          label: 微生物定殖根区
          detail: Pivot Bio 的机制主张是：在早期营养生长期，靠根区附近固氮供氮。
        - id: n6
          label: 监测结果并调整未来替代
          detail: 田间代表、零售顾问和 ProvenIt 对比，逐步指导特定地块的替代策略。
      edges:
        - to: n2
          from: n1
        - to: n3
          from: n2
        - to: n4
          from: n3
        - to: n5
          from: n4
        - to: n6
          from: n5
