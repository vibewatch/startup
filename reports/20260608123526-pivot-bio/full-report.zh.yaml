  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：氮替代，不是全部肥力支出
        blocks:
          - type: paragraph
            body: >-
              更准确的定位是，Pivot Bio
              参与的是大田作物投入支出中的氮管理部分，而不是整个肥料、作物保护或宽泛“生物制品”市场。相关任务是替代或补充合成氮，服务那些已经购买商业氮肥、并关心季内可用性、流失风险和保产的作物。这个边界包括面向玉米、小麦、高粱和棉花项目销售的微生物氮产品，也包括下游可持续项目：当合成氮减少产生可审计的
              Scope 3 收益时，这些项目可以抵消种植者的净采用成本。它不包括磷肥和钾肥预算、只用粪肥的系统、豆科作物自固氮，也不包括与 Pivot Bio 目标作物中的微生物氮替代没有绑定的泛全球生物肥料需求。学术
              BNF 文献也说明了为什么这条边界重要：生物固氮是一种独立农艺机制，在成本、储存和田间表现上都与 Haber-Bosch 肥料很不一样。市场报告页面还提示，泛化 TAM
              数字必须谨慎处理：这些报告把固氮产品和更宽泛的生物肥料类别打包在一起，作为邻近市场证据有方向性价值，但太宽，不能直接当成 Pivot Bio 的实际可服务市场。
