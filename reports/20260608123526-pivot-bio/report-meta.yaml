      role: Co-founder & Chief Innovation Officer
      background: "Biomedical engineer trained at the University of Iowa and UC Berkeley; founded Pivot Bio in 2010 and led it as CEO until 2023."
      claimRefs: [CO008, CO011]
    - name: Alvin Tamsir
