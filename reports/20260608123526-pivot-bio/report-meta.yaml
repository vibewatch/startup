  productSummary: >-
    PROVEN 40 and PROVEN G3 for corn, RETURN for wheat and sorghum, CERT-N for cotton, plus the
    N-OVATOR nitrogen-credit program that helps growers monetize verified nitrogen reduction.
  customerFocus: >-
    U.S. row-crop growers and their agronomic retail channels across corn, wheat, sorghum, and
    cotton, with Brazil positioned as the most visible international expansion market.
  businessModel: >-
    Per-acre microbial input sales through Pivot Bio's own commercial team and agricultural retail
    partners, supplemented by data-linked sustainability program economics through N-OVATOR.
  stage: Late-stage private
