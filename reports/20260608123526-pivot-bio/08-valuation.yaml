- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple or valuation
  - Relevance to Pivot Bio
  - Limitation
  rows:
  - - Pivot Bio (Series F-2, Mar 2026)
    - $1.66B post-money; $5.71/share; 2x liquidation pref
    - Reference mark; derived from COI not secondary trades
    - Direct subject company; most recent private price anchor
    - Revenue undisclosed; no secondary-market corroboration.
  - - 'Ginkgo Bioworks (DNA) — public synthetic biology / ag-bio platform'
    - '$537M market cap; $170M 2025 revenue; $574M EV'
    - 3.79x EV/revenue; BTIG Sell (PT $5, Jun 2026)
    - Public comp for ag-bio / synthetic biology; shows market discipline
    - Model is cell-programming platform, not row-crop inputs; ag segment
      shut down (Joyn Bio); losses much larger than Pivot Bio proportionally.
  - - 'Bioceres Crop Solutions (BIOX) — public specialty ag-biotech'
    - '$27M market cap; $255M TTM revenue; $254M EV'
    - 0.87x EV/revenue; near-distressed
    - Direct specialty ag-biotech comp; biologicals and biotech seeds
    - Near-insolvent; Latin-American concentration; different crop focus.
  - - 'Corteva (CTVA) — public integrated ag inputs (seed and crop protection)'
    - '$51.5B market cap; ~$17B annual revenue'
    - ~3x EV/revenue at premium for scale and profitability
    - Sets ceiling multiple for large integrated ag-inputs companies
    - Scale and profitability not comparable; used as comp ceiling only.
  - - 'Indigo Agriculture — private; comparable ag-biotech down-round'
    - '$3.5B peak valuation (2019); ~$250M mark (2023)'
    - ~93% valuation cut from peak; adverse comp
    - Most comparable private biological-inputs company; failed on
      similar commercialisation promise
    - Earlier-stage product; governance issues; different business model
      (soil microbiome + carbon); not identical to Pivot Bio.
  - - 'Joyn Bio (Bayer/Ginkgo) — shutdown nitrogen-fixation JV'
    - 'Shut down September 2023 after 5+ years; undisclosed investment'
    - Not applicable; terminal outcome
    - Direct competitive / cautionary comp for nitrogen-fixation biology
    - Was a JV not a standalone company; corporate-funded rather than
      venture-backed; no commercial product ever shipped.
