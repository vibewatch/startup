  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-financials
    missingEvidence: Audited or board-level revenue, gross margin, operating
      expenses, and unit economics for the period 2023-2025.
    whyItMatters: Without revenue data, no standard valuation framework can
      differentiate a $700M fair value from a $2.5B fair value; this is the
      single most material gap in the entire chapter.
    diligencePath: Request CFO financial deck or auditor files as a pre-condition
      for any investment commitment at or above the $1.66B reference mark.
    relatedQuestionRefs:
    - QV013
    - QV047

  - type: private-evidence-only
    severity: material
    topic: cap-table-waterfall
    missingEvidence: >-
      Full capitalisation table with all preference classes, accrued dividends,
      conversion ratios, and an explanation of the anomalous Series F-1 at
      $1.14/share.
    whyItMatters: >-
      The 2x liquidation preference on F-2 alone creates at least $200M of
      minimum return requirement ahead of common and earlier preferred shareholders;
      the full stack is needed to model investor returns at different exit levels.
    diligencePath: Request from General Counsel and CFO as standard legal
      diligence before closing.
    relatedQuestionRefs:
    - QV003
    - QV020

  - type: private-evidence-only
    severity: material
    topic: retention-nrr
    missingEvidence: Defined farmer retention rate, net revenue retention across
      cohorts, and churn rate with methodology.
    whyItMatters: The bull case rests on elite retention (>90%) as the primary
      evidence of product stickiness; this claim is unverified by public data
      and material to any premium multiple assignment.
    diligencePath: Request commercial operations data; validate with independent
      retailer interviews in key corn-belt states.
    relatedQuestionRefs:
    - QV013

  - type: enumeration-incomplete
    severity: material
    topic: comparable-private-rounds
    missingEvidence: Confirmed revenue, valuation multiple, and investor-update
      data for comparable private ag-biologicals companies (e.g. Sound Agriculture,
      Concentric Ag) that may have more recent financing data.
    whyItMatters: The private comparable set is limited to Indigo Agriculture
      (adverse) and Joyn Bio (terminal); additional comps would improve
      triangulation of the fair-value range.
    diligencePath: Search for any 2025-2026 private-round disclosures or
      secondary-market estimates from Forge or PitchBook for comparable companies.
    relatedQuestionRefs:
    - QV008
    - QV033
    relatedTableRefs:
    - TV004

  - type: missing-source
    severity: material
    topic: joyn-bio-wind-down
    missingEvidence: Primary source documentation of the Joyn Bio shutdown terms,
      Ginkgo/Bayer press release with reason for the wind-down, and any
      technical post-mortem disclosures.
    whyItMatters: The Joyn Bio failure is the most relevant adverse comparable
      for nitrogen-fixation commercialisation risk; more detail on why it failed
      would sharpen the anti-thesis and the probability weighting in the bear case.
    diligencePath: Search Ginkgo Bioworks 2023 10-K risk factors section for
      Joyn Bio wind-down details; check Bayer press releases from September 2023.
    relatedQuestionRefs:
    - QV009

  - type: private-evidence-only
    severity: minor
    topic: n-ovator-revenue-contribution
    missingEvidence: N-OVATOR programme total revenue, margin contribution,
      enrolled acre trajectory for 2025-2026, and corporate partner details
      (who is funding the carbon credit payments to farmers).
    whyItMatters: The N-OVATOR programme is positioned as a revenue-diversification
      driver in the bull case; without knowing who funds the payments and at what
      scale, the contribution to total revenue is unquantifiable.
    diligencePath: Request commercial operations data; review any carbon credit
      partnership disclosures in company communications.
    relatedQuestionRefs:
    - QV016

  - type: missing-source
    severity: minor
    topic: competitive-biologicals-investment
    missingEvidence: Specific product launches, investment levels, and commercial
      pipeline details from Bayer, Corteva, and BASF biologicals divisions that
      compete directly with Pivot Bio.
    whyItMatters: The competitive threat is directionally clear but the specific
      products, pricing, and acreage of competitor biologicals is unquantified,
      making it impossible to assess how quickly Pivot Bio's moat could erode.
    diligencePath: Review Corteva 2025-2026 annual reports biologicals segment;
      check Bayer CropScience 2026 press releases on biological nitrogen products.
    relatedQuestionRefs:
    - QV025

  - type: private-evidence-only
    severity: minor
    topic: board-composition-strategic-value
    missingEvidence: Full Pivot Bio board composition, director backgrounds,
      independent director roles, and any formal M&A advisory relationships.
    whyItMatters: Board composition signals strategic intent and acquirer
      relationships; the presence of a major fertilizer industry executive
      (Melih Keyman, KEYTRADE) is notable but the full governance picture is
      not publicly confirmed.
    diligencePath: Request board charter and composition from General Counsel;
      check any public governance disclosures or Form D filings.
    relatedQuestionRefs:
    - QV031

  - type: stale
    severity: minor
    topic: brazil-launch-status
    missingEvidence: MAPA registration confirmation, launch timeline, and
      go-to-market milestones for Brazil as of June 2026.
    whyItMatters: Brazil is cited in every company communication as a major
      upcoming market but no public milestone confirmation exists; international
      expansion is part of the bull case.
    diligencePath: Request regulatory filing confirmation from the CEO/commercial
      team; check Brazil's MAPA public register for any pending or granted
      registrations for Pivot Bio products.
    relatedQuestionRefs:
    - QV034

  - type: private-evidence-only
    severity: material
    topic: manufacturing-cost-curve
    missingEvidence: Per-acre manufacturing cost, fermentation capacity
      utilisation, cold-chain logistics cost, and the cost trajectory as
      production scales.
    whyItMatters: The 50% price discount vs synthetic nitrogen is commercially
      compelling only if manufacturing costs are sustainably below the pricing
      floor; the cost structure is entirely undisclosed.
    diligencePath: Request CTO/COO manufacturing cost models; validate with
      independent production audit.
    relatedQuestionRefs:
    - QV028

