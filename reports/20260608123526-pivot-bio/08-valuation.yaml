callouts:
- calloutType: risk
  title: Revenue opacity at $847M deployed
  body: Pivot Bio has raised approximately $847 million in total capital (Forge
    Global) but has never published audited revenue, gross margin, or customer
    economics. Five years after the $2B-valued Series D, the absence of any
    public financial disclosure is the single largest risk factor in the
    investment thesis. No standard valuation framework can distinguish a fair
    value of $700M from $2.5B without at minimum a revenue run-rate figure.
  claimRefs:
  - CV015
  - CV016
  - CV047
  - CV048

- calloutType: insight
  title: Down-round trajectory from $2B peak warrants close examination
  body: The Forge cap-table data shows the per-share price at $7.59 (Series D,
    July 2021), declining to $5.70 (Series E, July 2024), then effectively flat
    at $5.71 (Series F-2, March 2026). This trajectory is a real down-round
    from the 2021 peak in per-share economic terms. The anomalous Series F-1
    at $1.14/share further complicates the picture. Investors entering today at
    the $1.66B reference mark are pricing below the 2021 implied value but
    above any observable secondary clearing level.
  claimRefs:
  - CV015
  - CV018
  - CV020
  - CV021

- calloutType: strength
  title: Validated at scale where every competitor has failed
  body: The Joyn Bio shutdown and Indigo Agriculture's write-down confirm that
    Pivot Bio has achieved something that well-capitalised incumbents (Bayer,
    Ginkgo) and well-funded startups (Indigo) could not. The PROVEN platform
    was in commercial use on 15 million cumulative acres by 2024, with 90%-plus
    win rates in 2025 trials. This is a differentiated and high-barrier-to-entry
    achievement that supports a premium multiple relative to the Ginkgo or
    Bioceres comps — if the economics are confirmed.
  claimRefs:
  - CV002
  - CV003
  - CV031
  - CV035

