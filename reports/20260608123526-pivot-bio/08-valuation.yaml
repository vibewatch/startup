- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue economics disappoint
    - Diligence reveals revenue below $150M in 2025 or gross margin below 40%
    - Collapses the 3-7x revenue multiple band; forces re-underwriting below
      $1.2B fair value
    - Move to avoid or demand a deep discount; current mark becomes indefensible.
  - - Price cuts are not volume-accretive
    - Acre growth in 2026 fails to offset the 30% list-price cut; same or lower
      total product revenue despite expanded distribution
    - Confirms a structural margin problem, not a volume-growth story
    - Revisit the bull case entirely; monitor 2026 season data before re-engaging.
  - - Ginkgo/Joyn-style exit from a major crop segment
    - Pivot Bio exits corn or withdraws G3 due to performance shortfalls not
      visible in managed trial data
    - Destroys core thesis; corn is over 90% of the current acreage base
    - Exit the position; thesis terminates.
  - - Capital structure or governance deterioration
    - A Series G at a mark below $1.57B (2024 Series E price), or evidence that
      the Series F-1 ($1.14/share) reflects distressed debt conversion
    - Signals preference overhang is unmanageable and M&A or IPO is impaired
    - Demand full preference waterfall disclosure; do not invest above the
      last funding round price.
  - - Regulatory block on gene-edited microbes in key markets
    - APHIS or EPA introduces new movement or release restrictions on
      gene-edited soil microbes that materially restrict field use
    - Kills the go-to-market approach for the core product line
    - Pause the investment process; engage regulatory counsel before re-engaging.
  notes: These are valuation-relevant downside triggers that should change the
    price, not merely headline risks that sound uncomfortable.
