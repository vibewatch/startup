company:
  name: Pivot Bio
chapter:
  number: 8
  title: Valuation
  summary: >-
    Pivot Bio's current $1.66B Series F-2 mark (March 2026) sits 17% below its
    $2B peak (July 2021) after five years that included a down-round in 2024
    ($1.57B Series E) and two cumulative rounds of aggressive price cuts exceeding
    50% in aggregate. With revenue undisclosed, a 2x liquidation preference on
    the newest preferred stack, limited Forge secondary-market activity, and
    public comparable ag-biotech companies trading at distressed multiples, the
    evidence supports a research-more stance at medium confidence: the underlying
    technology is validated and demand is genuine, but the public record is too
    thin on economics to underwrite the current mark with conviction.

sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: >-
    The investment thesis rests on three pillars that are each independently
    observable. First, Pivot Bio's gene-edited nitrogen-fixing microbes have
    cleared the highest evidentiary bar in row-crop agriculture: product
    validated on nearly 15 million acres across 34 states, across more than
    6,000 independent fields, and affirmed by more than 20 university research
    programmes. Win rates in 2025 corn trials exceeded 90%, up from roughly 50%
    two years prior, and PROVEN G3 replaced 33 pounds of synthetic nitrogen per
    acre while adding 2.1 bushels per acre of yield advantage. Second, the
    commercial setting has turned sharply favourable. By March 2026 Pivot Bio
    products were priced approximately 50% below synthetic nitrogen fertilizer,
    secured through a multi-year price assurance programme that locks in 2026-2028
    prices at a time of extreme fertilizer volatility. Third, the addressable
    market is enormous and still early: the global agricultural biologicals
    market stood at $18.44 billion in 2025 and is projected to reach $34.99
    billion by 2030 at a 13.7% CAGR, with synthetic nitrogen alone estimated at
    roughly $200 billion globally.


    The anti-thesis is harder to dismiss. Revenue, gross margin, unit economics,
    customer count, and retention figures have never been publicly disclosed. The
    Series D price per share was $7.59 in July 2021; the Series E was $5.70 in
    July 2024 and the Series F-2 is $5.71 in March 2026, meaning the per-share
    price has never recovered to the 2021 peak. Total capital deployed is $847
    million per Forge Global, yet no public financial statement exists. The
    annual price cuts — 25% in 2024, then an additional 30% in 2026 on top of
    that — may expand volume, but they also raise the question of whether pricing
    power is eroding faster than acreage grows. The Joyn Bio cautionary tale
    (Bayer and Ginkgo Bioworks wound down their nitrogen-fixation joint venture
    in September 2023 after failing to develop a commercial product) underlines
    how hard it is to translate laboratory promise into repeatable farm
    economics. Public ag-biotech comps — Ginkgo Bioworks trading at $537M market
    cap despite $170M in 2025 revenue, Bioceres near-insolvent at $27M market
    cap — show that public markets are currently pricing ag-biotech harshly.
    Until Pivot Bio opens its economic data room, the right call is
    research-more rather than buy.
