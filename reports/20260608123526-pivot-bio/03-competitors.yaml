    title: Competitive Positioning Map — Biological N vs. Commercial Scale
    type: quadrant
    layout: wide
    summary: >
      Pivot Bio occupies a unique position combining high commercial scale with the
      strongest biological nitrogen differentiation. Incumbents dominate on scale but
      offer no biological nitrogen. Kula Bio and Azotic have differentiated technology
      but limited commercial scale. Indigo Ag has scale but has pivoted away from nitrogen.
