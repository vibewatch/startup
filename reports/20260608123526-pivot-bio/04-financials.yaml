      - - Conservation-funding enablement
        - Dealer referral into CSP/EQIP support via Taranis
        - Eligible acres / funded growers
        - Confirmed adoption-support layer, not proven core revenue line
        - 'Low-medium: helps conversion but not disclosed as recognized revenue'
        - Request attach rate, funding success rate, and any revenue share
