  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: 2026-sku-pricing
      missingEvidence: Exact 2026 per-acre dollar prices by SKU, rebate schedule, and financing-adjusted net price.
      whyItMatters: Without true net price by product, per-acre revenue and gross profit cannot be modeled.
      diligencePath: >-
        Collect 2026 dealer price sheets, grower invoices, rebate schedules, and financing subsidy terms from
        Pivot or channel partners.
      relatedQuestionRefs:
        - QI006
      relatedTableRefs:
        - TI002
    - type: private-evidence-only
      severity: material
      topic: cash-burn-runway
      missingEvidence: Current cash balance, monthly burn, working-capital swing, and runway months as of June 2026.
      whyItMatters: Historical capital raised does not determine present financing dependency.
      diligencePath: Request the latest balance sheet, rolling 13-week cash forecast, and budget-versus-actual burn report.
      relatedQuestionRefs:
        - QI021
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: gross-margin-bridge
      missingEvidence: Product-level COGS, freight, storage loss, service labor, and gross margin by formulation.
      whyItMatters: >-
        The business may have attractive unit economics or structurally heavy cost-to-serve; public sources
        cannot distinguish the two.
      diligencePath: Request a gross-margin bridge by SKU and channel plus manufacturing yield and scrap metrics.
      relatedQuestionRefs:
        - QI022
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: Revenue or ARR by crop, channel, geography, and program attachment.
      whyItMatters: Acreage and retail reach proxies do not show concentration, seasonality, or revenue quality.
      diligencePath: Request monthly revenue bridge by crop and channel, including N-OVATOR attach and renewal behavior.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI001
        - TI005
    - type: private-evidence-only
      severity: material
      topic: channel-margin-stack
      missingEvidence: Retailer margin, MDF, rebate stack, bad-debt risk, and who funds promotional financing.
      whyItMatters: >-
        Channel economics determine whether scale improves margin or simply shifts economics to partners and
        lenders.
      diligencePath: >-
        Review dealer agreements, lender agreements, and promotional program accounting with finance
        leadership.
      relatedQuestionRefs:
        - QI006
        - QI025
      relatedTableRefs:
        - TI002
        - TI005
    - type: missing-source
      severity: minor
      topic: debt-and-next-round-trigger
      missingEvidence: Debt schedule, covenant package, and explicit minimum-cash trigger for the next financing event.
      whyItMatters: A company can appear well funded historically while still facing a near-term liquidity trigger.
      diligencePath: Request debt and lease schedules plus the board-approved financing plan and minimum-cash threshold.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI004
        - TI005
