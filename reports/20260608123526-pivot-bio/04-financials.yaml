company:
  name: Pivot Bio
chapter:
  number: 4
  title: Financials
  summary: >-
    Pivot Bio’s public record supports a per-acre microbial nitrogen sales model sold through reps and ag
    retailers, with price locks, financing, and incentive programs used to drive adoption. But realized ASP,
    channel margin, revenue mix, gross margin, cash, burn, and runway remain undisclosed, so capital adequacy
    can only be bounded by historical financing data and secondary-market valuation signals.
sections:
  - id: revenue-model-and-channel-architecture
    title: Revenue Model and Channel Architecture
    body: >-
      Pivot Bio’s revenue model is best understood as seasonal per-acre product sales, not software
      subscriptions or usage-metered services. The 2026 price-lock page and March 2026 supply-assurance
      announcement show a contractable product model in which growers and retailers can lock pricing for 2026,
      2027, and 2028, subject to minimum-acre commitments and annual payment schedules. The eligible portfolio
      spans multiple formulations and crops—corn, cotton, sorghum, and wheat—so monetization is tied to
      planted acres and selected delivery format rather than a single flagship SKU. Public GTM evidence also
      shows that the company does not rely on a pure direct-to-farmer motion: Pivot’s corn page emphasizes
      sales representatives working alongside field agronomists, the price page is explicitly marked for
      authorized sales reps and retail partners, and the Hefty Seed partnership places products into a
      49-location retail footprint. N-OVATOR and conservation-funding partnerships expand the value
      proposition, but the core revenue engine still appears to be acre-based product sales through a
      retailer-and-rep-assisted agronomy channel.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI011
      - CI015
      - CI016
      - CI017
      - CI018
