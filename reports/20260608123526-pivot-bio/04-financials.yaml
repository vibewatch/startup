  - id: cost-structure-and-gross-margin-drivers
    title: Cost Structure and Gross-Margin Drivers
    body: >-
      Pivot Bio does not publish a gross-margin bridge, but its public operating footprint reveals the likely
      drivers. The St. Louis footprint now combines manufacturing, packaging, distribution, and customer
      service, while the G3 Dry application guide shows handling, storage, mixing, and dosing requirements
      that imply real formulation and stewardship costs. The domestic network and 24-hour shipment claims
      likely reduce freight risk and working-capital volatility versus imported fertilizer supply chains, but
      they do not eliminate cost-to-serve: the model still carries agronomy labor, rep support, dealer
      enablement, lender-subsidized financing, and program administration for conservation funding and
      N-OVATOR payouts. Those features help conversion and retention, yet they also mean Pivot’s margin path
      is governed by manufacturing yield, formulation mix, logistics efficiency, and service intensity—not
      simply by list price. Because exact dollar pricing, distributor economics, and product-level COGS remain
      private, the public record supports only a qualitative margin view: improving operational scale and
      strong adoption support, but no auditable margin percentage.
    claimRefs:
      - CI017
      - CI018
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI038
      - CI039
      - CI043
