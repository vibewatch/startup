  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact
      - Current public substitute
      - Why substitute is insufficient
      - Exact diligence path
    rows:
      - - 2026 net realized price per acre by SKU
        - Blocks true revenue-per-acre and gross-profit modeling
        - Directional claims about lower prices and financing
        - Public sources show direction but not dollar realization after rebates or channel discounts
        - Obtain 2026 dealer price sheets, rebate schedules, and customer invoices
      - - Revenue / ARR by crop, product, geography, and channel
        - Blocks revenue-quality and concentration analysis
        - Acreage, trials, retail footprint, and N-OVATOR proxies
        - Usage and distribution evidence does not convert into recognized revenue
        - Request monthly revenue bridge by crop, formulation, and sales channel
      - - Gross margin / COGS bridge
        - Blocks margin-path and scale-economics verdict
        - Manufacturing and logistics footprint disclosures
        - Facility and shipping details do not reveal unit cost or contribution margin
        - Request product-level COGS, freight, write-offs, and warranty / service expense
      - - Cash balance, monthly burn, and runway
        - Blocks financing-dependency analysis
        - Historical fundraising and Forge valuation data
        - Capital raised does not equal cash remaining
        - Request latest cash position, 12-month burn history, and covenant headroom
      - - Retailer margin and rebate economics
        - Blocks channel-economics underwriting
        - Hefty footprint and partner language
        - Public GTM evidence says who sells, not who earns what
        - Request dealer agreements, margin stack, MDF, and financing subsidy terms
      - - Debt, covenants, and next-round trigger
        - Blocks downside capital scenario planning
        - No reviewed public disclosure
        - Without debt and trigger data, equity timing cannot be forecast
        - Request debt schedule, board financing plan, and minimum-cash threshold
    notes: >-
      Pivot Bio is unusually legible on go-to-market mechanics for a private company, but still opaque on the
      private metrics that drive underwriting.
    claimRefs:
      - CI037
      - CI040
      - CI042
