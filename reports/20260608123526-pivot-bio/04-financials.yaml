  - id: pricing-traction-and-sales-efficiency-proxies
    title: Pricing, Traction, and Sales-Efficiency Proxies
    body: >-
      Public pricing evidence shows direction, not realized ASP. Independent trade coverage says Pivot lowered
      price for the 2025 season and paired that cut with 0% financing; Farm Progress later reported a further
      30% reduction for 2026 versus the prior two seasons. Company pricing materials and related 2026 press
      coverage frame the offer as a response to fertilizer volatility and weak farm economics, while claiming
      microbial nitrogen is roughly 25% to 50% cheaper than synthetic nitrogen on a replacement basis. The
      traction proxies available publicly are agronomic and programmatic rather than financial: N-OVATOR
      verified 1.5 million acres across 2022-2023, about 20% of customers participated in 2023, more than $6
      million had been paid to growers by early 2024, and public field-trial disclosures show 33-34 pounds of
      nitrogen replacement per acre with modest positive yield deltas. GTM-efficiency signals are similarly
      indirect: a 49-location Hefty footprint, over 30 Pivot agronomists, 24-hour domestic shipping claims,
      and optional financing all point to a serious commercial machine, but none reveal CAC, payback, realized
      selling price, or segment mix.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
