    figureRefs:
      - FI004
  - id: capital-adequacy-and-diligence-blockers
    title: Capital Adequacy and Diligence Blockers
    body: >-
      The public capital record is meaningful but incomplete. SEC Form D filings show sold amounts of roughly
      $15.0 million in 2016, $71.4 million in 2018, and $435.0 million in the 2021 Series D, plus a 2020
      Series C filing that disclosed a $100 million offering. AgFunder’s 2021 coverage said the Series D
      brought total funding to about $600 million and noted revenue had tripled earlier that year. Forge’s
      March 2026 market page extends the chronology, showing a $54.94 million Series E in 2024 and a $100
      million Series F-2 in March 2026, alongside a $1.66 billion COI-based valuation and limited market
      activity. Those datapoints imply Pivot has raised substantial capital and likely reduced immediate
      financing pressure, but they do not solve underwriting. No reviewed public source disclosed current cash
      on hand, monthly burn, runway months, debt obligations, gross margin, or revenue mix. The correct
      financial verdict is therefore bounded rather than definitive: a capitalized company with visible
      channel investment and pricing concessions, but a private-data gap large enough that runway, financing
      dependency, and next-round timing still require management materials.
    claimRefs:
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI040
      - CI042
