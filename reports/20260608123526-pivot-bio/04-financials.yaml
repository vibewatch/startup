  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product or program
      - Price or contract
      - List vs. realized pricing
      - Included capabilities
      - Discounts or unknowns
      - Implication
    rows:
      - - 2026-2028 multiyear price lock
        - Fixed price for three growing seasons
        - Contract structure public; dollar price withheld
        - Price assurance, supply assurance, multiple eligible SKUs
        - Exact per-acre dollars, rebates, and channel discounts unknown
        - Improves predictability but does not reveal realized ASP
      - - 2025 season PROVEN 40 offer
        - Lower price plus 0% financing
        - Only directional pricing disclosed publicly
        - Affordability support during weak farm economics
        - No official published dollar sheet in reviewed sources
        - Signals adoption support over pure list-price maximization
      - - 2026 season portfolio
        - 30% lower vs prior two seasons per Farm Progress
        - Directional public anchor only
        - G3, CERT-N, RETAIN, dry formulations
        - By-SKU realized price and dealer spread unknown
        - Price cut likely expanded farmer ROI and channel appeal
      - - John Deere / Rabo financing
        - 0% through Dec. 1, 2026 for qualified purchases; Rabo 2025 program had $5k minimum
        - Financing term, not product list price
        - Extends working-capital flexibility to growers
        - Subsidy economics and lender compensation undisclosed
        - Reduces adoption friction but may add financing cost or concessions
      - - N-OVATOR payout economics
        - More than $6M paid by early 2024; one cohort got about one-third of product cost back
        - Program payout, not list price
        - Adds annual revenue-like value to grower economics
        - Partner demand, repeatability, and Pivot take-rate unknown
        - Can lower effective net cost for some customers
      - - Taranis conservation support
        - No upfront cost; success-based fee
        - Service economics, not list product price
        - Funding application support for eligible nitrogen-efficiency practices
        - Success fee split and attach rate unknown
        - Potentially lowers customer acquisition friction without lowering sticker price
    notes: >-
      The biggest unresolved issue is the realized per-acre dollar price after rebates, financing, and
      retailer economics, not whether a pricing structure exists.
