  - id: mitigations-kill-criteria
    title: Mitigations, Monitoring Indicators, and Kill Criteria
    body: >-
      Pivot Bio's mitigations are structurally sound but unevenly verified. The IP moat —
      60+ patents and 250+ pending applications — is the highest-quality protection against
      direct competitive replication and compares favorably to other biologicals companies.
      The APHIS BRS "Am I Regulated?" determination provides product stability for existing
      corn products, and the University of Illinois peer-reviewed publication provides
      independent validation of the core nitrogen-fixation mechanism. The >90% farmer retention
      rate, verified by a third-party survey across nearly 400 farmers, is operationally
      meaningful: it signals that repeat purchasers find positive ROI even in years when
      synthetic nitrogen is cheap.

      The multi-year price and supply assurance program announced in March 2026 directly
      addresses the synthetic nitrogen price volatility risk by locking in Pivot Bio's
      pricing advantage for three growing seasons (2026–2028). This is a proactive commercial
      mitigation, though it also creates commitments on Pivot Bio's cost side that require
      stable fermentation costs and supply chain reliability.

      For monitoring, investors should track four leading indicators: (1) Pivot Bio's gross
      margin trajectory as price cuts flow through the P&L; (2) the outcome of USDA APHIS
      rulemaking on modified microbe commercialization pathways, expected within 12–24 months
      of the 2024 RFI; (3) announcement of any Series E or debt financing, which would signal
      either capital health or distress depending on terms; and (4) the win-rate and repeat
      purchase data from the 2026 CERT-N cotton launch at scale, which will be the first
      real-world stress test of both manufacturing scale-up and new-crop commercial execution.

      Thesis-break triggers include: a sharp synthetic nitrogen price recovery (urea > $450/ton
      sustained for two consecutive quarters) that eliminates the 25–50% cost advantage; an
      adverse USDA APHIS rule that subjects existing products to new permitting requirements; a
      significant batch quality failure or product recall event affecting field outcomes in a
      major geography; or evidence that a competing product from Bayer, Corteva, or another
      major ag-input company achieves comparable nitrogen displacement performance in
      independent trials. Any of these events would materially alter the risk-reward calculus
      for investment.
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038

