  - id: leadership-governance
    title: Leadership, Founders, and Board Governance
    body: >-
      Pivot Bio was co-founded in 2010 by Karsten Temme, Ph.D. (biomedical engineering, University of Iowa and Ph.D. from
      UC Berkeley) and Alvin Tamsir, Ph.D. (molecular & cell biology, UC Berkeley and Ph.D. from UCSF), both former
      graduate students who pioneered the concept of reactivating native soil microbes to fix nitrogen. Temme served as
      CEO from founding until September 2023, when Chris Abbott was named CEO; Temme transitioned to Chief Innovation
      Officer. Abbott previously led Continental Grain Company's Conti Ventures fund and brought deep agribusiness capital
      markets expertise. Tamsir retained the Chief Science Officer role and remains central to R&D.
      The executive leadership team was substantially refreshed in 2024–2025: Robert Houghton (CFO, from Life Time Group
      Holdings, joined 2024), Chris Turner (CCO, formerly Bayer/Monsanto, joined 2024), Travis Frey Ph.D. (CTO, appointed
      April 2025, replacing retiring Ernie Sanders), Ryan Degnan (CGO, from McKinsey, joined 2025), Laureen Thompson
      (CHRO, promoted April 2025), and Debra Frimerman (CLO, previously Chief Business Development Officer). The board
      includes investor directors from DCVC (Matt Ocko), and the 2021 SEC Form D lists Charles Cooper Rinzler and
      Christopher Abbott (the current CEO) as directors. Generation Investment Management holds a Board Observer seat
      per its own disclosure. Multiple leadership roles changed in a compressed window (2023–2025), representing material
      key-person and governance transition risk.
