  - id: scale-metrics
    title: Operational Scale, Impact Metrics, and Key Performance Indicators
    body: >-
      Pivot Bio's commercial traction is primarily measured by acres under management and nitrogen replacement activity.
      The May 2025 AgTech Corridor relocation press release states that company technology has been "adopted on nearly
      15 million acres of farmland across North America." The N-OVATOR® program has verified nitrogen replacement on 1.5
      million acres across the 2022 and 2023 growing seasons, with 28,500 metric tons of synthetic nitrogen replaced and
      251,444 metric tons of CO2-equivalent avoided. The company homepage reports cumulative CO2e avoidance of over
      1,050,000 metric tons since 2022. By October 2024, the N-OVATOR program had paid farmers more than $13 million
      since its 2022 launch (updated from earlier $6 million figure). In 2024, the company reduced the price of PROVEN 40
      for the 2025 growing season and announced a 0 % financing programme for farmers, citing difficult economic
      conditions; a national 2022–2024 study found a 9 % average increase in in-plant nitrogen and approximately one
      bushel per acre yield advantage when replacing ~40 pounds of N with PROVEN 40. A 2024 University of Kentucky study
      found an 11-bushel-per-acre yield increase in no-till, cover-crop fields. A 2024 customer satisfaction survey
      (n ≈ 400 farmers) returned 91 % satisfaction. Revenue and EBITDA remain undisclosed as a private company;
      headcount is also undisclosed. The company targets product approval and commercial launch in South America (Brazil)
      and Africa as international expansion fronts.
