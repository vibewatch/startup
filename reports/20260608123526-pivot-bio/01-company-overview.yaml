  - id: milestones-timeline
    title: Corporate Milestones, Strategic Events, and Adverse Developments
    body: >-
      Pivot Bio's history spans three phases: stealth scientific development (2010–2018), commercial scale-up in corn
      and wheat (2019–2021), and a diversification and leadership-transition phase (2022–2026). The company was
      incorporated in Delaware in 2014 (first Form D filed October 2014) after informal work that began in 2010. Its
      first corn product (PROVEN®) reached commercial sale in 2018. The company commercialised RETURN® for wheat and
      sorghum in 2020, and launched both PROVEN 40 On-Seed and RETURN On-Seed in August 2022. The N-OVATOR credit
      program launched in 2022 and was recognised on TIME magazine's Best Inventions list in 2022, 2023, and 2024.
      In November 2022, Pivot Bio joined the UN AIM for Climate initiative as an Innovation Sprint Partner, committing
      $291 million in R&D and product development over four years. The September 2023 CEO transition (Karsten Temme
      to Chris Abbott) was the most significant governance event since founding. The 2024 season saw CERT-N cotton
      trials in eight states. PROVEN G3, the third-generation corn product with three modes of action, was unveiled in
      March 2025 for commercial availability in 2026. The May 2025 AgTech Corridor relocation announcement flagged the
      departure from Berkeley after 15 years. Two adverse signals in 2026: the Forge secondary market implied valuation
      of $1.66 B is below the $2 B Series D post-money from 2021, and per-share price has declined approximately 25 %
      since the 2021 high.
