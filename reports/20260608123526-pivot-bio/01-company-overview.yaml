company:
  name: Pivot Bio

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pivot Bio, Inc. is a Berkeley-founded (2010) agricultural biotechnology company that sells patented gene-edited microbial
    nitrogen products to U.S. corn, wheat, sorghum, and cotton farmers. Since its first commercial launch in 2018 the company
    has expanded to nearly 15 million acres in North America. A $430 M Series D in July 2021 valued the business at
    approximately $2 B post-money; secondary-market data from Forge Global (March 2026) implies a current valuation of
    roughly $1.66 B after a $100 M Series F-2. Following an outside-CEO transition in September 2023, the company executed
    a Midwest headquarters relocation in May 2025 and launched a third-generation corn product (PROVEN G3) for commercial
    sale in 2026.

sections:
  - id: identity-and-model
    title: Corporate Identity, Headquarters, and Business Model
    body: >-
      Pivot Bio, Inc. is a Delaware-incorporated agricultural biotechnology company founded in 2010 and headquartered in
      Berkeley, California (principal address: 2910 Seventh Street, Berkeley CA 94710, per SEC EDGAR filings). The company
      develops and commercialises gene-edited soil microbes that fix atmospheric nitrogen directly on plant roots, providing
      corn, wheat, sorghum, small grain, and cotton growers with an alternative or supplement to synthetic nitrogen
      fertiliser. Its business model is a direct-to-farmer and retailer distribution model: products are sold as seed
      treatments or in-furrow applications through independent agronomic retailers and a growing national retail network
      that exceeded 500 new partners in recent years. A complementary revenue line, the N-OVATOR® nitrogen-credit program,
      connects enrolled farmers with corporate buyers of verified Scope 3 emission reductions, generating annual cash
      payments to growers while creating a sustainability data asset for the company. Pivot Bio's products are recognised
      under the PROVEN® and RETURN® brand families for grains and CERT-N™ for cotton. The company describes its
      overarching mission as reducing synthetic nitrogen dependency and the associated greenhouse gas emissions while
      improving crop yields and farmer profitability. In May 2025, Pivot Bio announced a strategic relocation of its
      headquarters from Berkeley to the U.S. Midwest (Wayzata, Minnesota area), consolidating scientific and commercial
      operations closer to its core agricultural markets, while retaining offices in St. Louis (Missouri), Iowa, and
      São Paulo (Brazil).
