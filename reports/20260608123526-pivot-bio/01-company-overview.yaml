  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-metrics-gap
      missingEvidence: Annual revenue, gross margin, net burn rate, and headcount for FY2024 and FY2025
      whyItMatters: Without revenue and burn data the company's path to profitability cannot be assessed; the valuation compression from 2021 to 2026 becomes harder to interpret without context on whether revenue is scaling proportionally
      diligencePath: Request a data room or management presentation from Pivot Bio; alternatively, seek secondary-market data with financial projections from Forge or a deal broker
      relatedQuestionRefs: [QO017, QO018]

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Current fully diluted ownership table including Series E, F-1, and F-2 investors; precise founder and management equity stakes
      whyItMatters: Unknown investor composition after three recent rounds (E, F-1, F-2 all showing "undisclosed investors" on Forge) creates governance opacity and impedes assessing dilution, preferences, and control rights
      diligencePath: Request certificate of incorporation and cap table from Pivot Bio investor relations; Forge may have more detailed COI data under a data subscription
      relatedTableRefs: [TO003]

    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Reconciliation between the $2 B post-money stated in 2021 press releases and the $1.7 B post-money implied by Forge COI data for the same Series D; and reconciliation between $618 M publicly announced total and Forge's $847 M aggregate
      whyItMatters: The discrepancy between press-release valuation and COI-based valuation for the Series D ($2 B vs $1.7 B) and between total-raise figures ($618 M vs $847 M) signals either unannounced tranches or methodology differences, both of which materially affect comparator benchmarks
      diligencePath: Request Series D term sheet and COI amendment from counsel or investor; cross-reference Forge raw COI data with company-reported cap table
      relatedQuestionRefs: [QO007, QO009]
      relatedTableRefs: [TO001, TO003]

    - type: enumeration-incomplete
      severity: minor
      topic: full-board-composition
      missingEvidence: Complete board of directors list as of June 2026 including all investor directors and independent directors
      whyItMatters: The 2021 Form D names Matt Ocko, Charles Cooper Rinzler, and Christopher Abbott as directors, but neither Pivot Bio's website nor public filings confirm the full current board; key investor directors may hold veto rights or consent rights under investor agreements
      diligencePath: Request current board composition from Pivot Bio corporate secretary; SEC Form D or proxy statement if/when filed
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO002]

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-table-pre-2014-gaps
      missingEvidence: Documented milestones for Pivot Bio's earliest phase (2010–2013 founding/stealth period) and any regulatory filings or adverse events not captured in SEC Form D or press coverage
      whyItMatters: The milestone table for this period relies on founder biographies and secondary mentions; any pivotal early events (lab setbacks, personnel changes, early grant funding) may be missing
      diligencePath: Review SBIR/STTR grant databases (grants.gov), UC Berkeley IP licensing office, and USDA ARS records for early Pivot Bio funding; also check PACER for any early patent disputes
      relatedTableRefs: [TO004]

    - type: missing-source
      severity: minor
      topic: competitive-landscape
      missingEvidence: Independent analysis or market data comparing Pivot Bio's product efficacy and market share against competing biological nitrogen fixation companies (e.g., Azotic Technologies, Sound Agriculture, Indigo Ag)
      whyItMatters: Pivot Bio operates in a growing competitive agbiotech space; without peer benchmarking, the durability of its first-mover advantage and premium pricing cannot be assessed
      diligencePath: Seek industry analyst reports (AgFunder, PitchBook, ISTA Mielke) or independent academic meta-analyses comparing BNF product performance across vendors
      relatedQuestionRefs: [QO023]

    - type: missing-source
      severity: minor
      topic: adverse-coverage-legal
      missingEvidence: Documentation of any lawsuits, regulatory enforcement actions, adverse media coverage, or independent efficacy challenges directed at Pivot Bio as of June 2026
      whyItMatters: Absence of confirmed adverse legal or regulatory records is meaningful but requires proactive verification; the valuation decline and CEO change may have been preceded by operational or governance issues not yet in public reporting
      diligencePath: Search PACER for civil litigation, USDA and EPA for enforcement actions; review trade press archives (DTN, Farm Progress, Agri-Pulse) for critical coverage of product efficacy or customer disputes
