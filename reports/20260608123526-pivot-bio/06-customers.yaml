chapter:
  number: 6
  title: Customers
  summary: Pivot Bio has real customer adoption, but the public proof base is more channel-and-acreage heavy than logo-list heavy. The strongest evidence is nearly 15 million validated acres, 500 new retail locations added in 2024, 129 growers in 2025 PROVEN G3 field trials, and N-OVATOR acreage and payment data; the weakest areas are disclosed retention, concentration, and whether Brazil has moved from pilots to named commercial customers as of 2026-06-08.
sections:
- id: SU101
  title: Buyer-user-payer segmentation and channel mix
  body: 'Pivot Bio''s customer base is best understood as grower-centered but channel-assisted. The direct economic buyer and end user is usually the row-crop grower choosing a nitrogen plan for corn, wheat, sorghum, small grains, or increasingly cotton. The company repeatedly presents sales reps, field agronomists, and local retailers as the access layer rather than a pure ecommerce motion: its sales-representative materials promise a direct-to-grower supply chain with corporate invoicing and collection handled centrally, while crop pages tell farmers to work with local reps and agronomists to select products and application methods. That makes the practical buyer-user-payer split different by surface. In core product sales, the grower is buyer, user, and payer. In the N-OVATOR program, the grower is still the product user and primary purchaser, but a second payer layer appears because downstream food, ingredient, spirits, and grain-buying companies fund nitrogen-credit payments to participating
    farms. Channel proof is strongest in the Midwest through Hefty Seed Company, whose 49 locations across 10 states give Pivot Bio a named retailer footprint, plus a broader but mostly unnamed network expansion of nearly 500 new retail locations in 2024. Brazil is a different segment again: public evidence shows local team buildout, field trials, warehouses, and partner discussions, but not yet a named commercial customer roster.'
