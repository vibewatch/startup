- id: TU006
  title: Brazil expansion readiness table
  columns:
  - Milestone
  - Observed evidence
  - Status as of run date
  - Customer implication
  - Gap
  rows:
  - - Local operating team
    - Brazil lead plus agronomy, finance, marketing, and commercial-operations hires are public
    - Completed buildout step
    - Suggests Pivot Bio expects a direct local commercial motion, not a remote export-only model
    - No public territory map or customer-service staffing ratio
  - - Pilot fields
    - AgroPages described about 30 large trial areas of 20-50 hectares with major producers
    - Pilot evidence exists
    - Shows real farmer touchpoints before launch
    - No named farms or crop-by-crop conversion rates
  - - Local logistics
    - AgroPages said Pivot had contracted warehouses and established branches in Brazil
    - Readiness signal, not customer proof
    - Improves likelihood of timely delivery once approved
    - Inventory commitments and first deliveries are not public
  - - Partner ecosystem
    - Estado de Minas said Pivot worked with some of Brazil's largest farmers plus local partners and researchers
    - Partnership evidence exists
    - Supports future channel scaling and agronomic adaptation
    - Named distributor or retailer references are absent
  - - Commercial conversion
    - Official and independent sources still frame Brazil as "soon" or dependent on final approval
    - Unproven publicly
    - Brazil remains an option on customer expansion, not a de-risked revenue surface
    - No named commercial customer, distributor, or booked-acre disclosure
  notes: Brazil evidence is strong on readiness and pilots but weak on named commercial customers; this table separates pre-launch infrastructure from actual conversion proof.
