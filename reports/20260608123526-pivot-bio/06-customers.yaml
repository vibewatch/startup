- id: SU104
  title: Brazil expansion, channel concentration, and procurement friction
  body: 'Pivot Bio''s expansion logic is credible, but the risk surface is mostly about channel execution rather than raw market size. The company is broadening crop coverage, expanding retail access, building a partner ecosystem, and trying to de-risk procurement with lower prices, domestic supply, and a 2026-2028 price-lock program. Those steps directly answer farmer concerns about volatile fertilizer prices and supply. They also reveal friction. The price-lock program requires either 1,000 acres or 100% of planted applicable acres plus best-management-practice compliance, which naturally favors larger and more sophisticated buyers. Farm Progress reports that Pivot Bio no longer talks about a universal nitrogen-replacement number and instead asks growers to work field by field with more than 30 agronomists because performance depends on soil type, tillage, and timing. DTN''s broader biologicals reporting is the clearest adverse source: it highlights a 61-site extension study in which significant
    yield increases occurred at only two sites across several nitrogen-fixing products, notes that biologicals remain less predictable than fertilizer, and warns that mishandling living products can impair outcomes. Brazil is promising but still not de-risked from a customer-proof standpoint. Public sources show local hires, about 30 large pilot areas, warehouses, and collaboration with large farmers and local partners, yet official language still frames Brazil as "soon" or "once approved," which means the market has expansion signals without named commercial customer proof. Named channel evidence is likewise concentrated: Hefty is the only large retailer publicly named in retained sources, so real breadth is broader than the named evidence but not fully transparent.'
