- id: SU102
  title: Adoption trajectory and named customer proof
  body: 'Public adoption proof is unusually strong on acreage and trial depth for an agriculture input company, even though the named-customer list is thinner than the acreage story. Pivot Bio''s 2024 impact-report release says PROVEN 40 outcomes were validated on nearly 15 million acres across 6,147 fields in 34 states, and that 2024 data from 172 fields in 97 counties across 20 states showed yield parity while reducing 37+ pounds of nitrogen per acre. Independent coverage from MIT Technology Review adds an annual trajectory lens, describing product use on 5 million acres in 2023 versus 1 million two years earlier. The 2026 field-data release then adds a live-customer proof set for the newest corn product: 134 field trials with 129 growers, average replacement of 33 pounds of synthetic nitrogen per acre, a 2.1-bushel-per-acre yield advantage, and win rates above 90%. N-OVATOR adds another adoption surface by showing 1.5 million verified acres across 2022 and 2023, 20% of the customer base
    enrolled in 2023, 1.4 million more acres and $4.5 million more payments in 2024, and more than $13 million paid since launch. Named proof is mostly official case-story style rather than audited account disclosure, but it is still concrete: Mike Denton, Darren Grotz, Travis Milne, Chad Rubbelke, Bob Worth, Fischer Family Acres, Dane Whitley, and Dan Story are all named publicly, while XtremeAg''s Matt Miles provides an external cotton proof point with quantified ROI.'
