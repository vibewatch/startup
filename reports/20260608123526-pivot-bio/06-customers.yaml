- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Observed evidence
  - Impact
  - Diligence path
  rows:
  - - More crops and formats
    - Corn, small grains, sorghum, and cotton now all have commercial surfaces
    - Supports wallet expansion within existing farm accounts
    - Request revenue and acreage mix by crop and new-format adoption
  - - Retail expansion
    - Nearly 500 new retail locations in 2024 and Hefty's 49-location network in 10 states
    - Could improve local availability and trust
    - Request named retailer roster and concentration by partner
  - - Corporate-payer layer
    - N-OVATOR matched nearly 400,000 grower acres with downstream partners in 2023 and involved more than half a dozen companies
    - Adds a second monetization and retention surface
    - Request corporate-partner concentration and renewal history
  - - Named channel concentration
    - Hefty is the only large retailer publicly named in retained sources
    - Public proof could overstate diversification if unnamed locations cluster by a few partners
    - Request top five retail partners by acres and revenue
  - - Procurement threshold
    - Price lock requires 1,000 acres or 100% of planted applicable acres plus BMP compliance
    - May skew program appeal toward larger, more sophisticated operations
    - Request conversion rates by farm size and reasons for lost deals
  - - Biological variability and handling
    - DTN and CropLife describe uneven row-crop adoption, unpredictability, and the need for careful integration of living products
    - Raises risk of trial failure, rep training burden, and cautious retailer onboarding
    - Request complaint rates, replacement credits, and channel training metrics
  - - Brazil commercialization gap
    - Local team, trial plots, warehouses, and farmer partnerships are public, but named commercial customers are not
    - Expansion option exists, but proof of conversion remains weak
    - Request approval status, first commercial sales, and named distributor/grower references
  notes: This table focuses on execution and concentration risk rather than pure market size; the public evidence is good enough to show expansion paths, but not good enough to quantify partner concentration or Brazil conversion.
