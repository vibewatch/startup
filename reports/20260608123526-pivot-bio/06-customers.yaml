    - 1.5 million verified acres
    - 2022-2023 growing seasons
    - N-OVATOR program overview
    - Shows meaningful participation on top of product adoption
    - No split by crop, geography, or repeat participants
  - - N-OVATOR customer penetration
    - About 20% of customers enrolled
    - '2023'
    - N-OVATOR program overview
    - Program adoption is material inside the installed base
    - Base customer count is not public
  - - N-OVATOR incremental scale
    - 1.4 million more acres and $4.5 million more payments
    - '2024'
    - Pivot Bio 2024 Impact Report release
    - Program momentum accelerated, not just product adoption
    - No public breakdown of acres per corporate partner
  - - Cumulative grower payments
    - More than $13 million paid since launch
    - Since 2022, reported 2025
    - Pivot Bio 2024 Impact Report release
    - Confirms real cash value returning to users
    - Public data does not show how many growers drove the full total
  - - Largest disclosed transaction
    - 450+ farmers, 300,000 acres, 100,000 credits
    - Post-2023 harvest / disclosed 2024
    - N-OVATOR payment press release
    - Demonstrates that at least one program reached material multi-farm scale
    - The corporate counterparty is unnamed
  notes: This table mixes cumulative installed-base metrics, annual acreage signals, trial cohorts, channel footprint, and N-OVATOR program activity because public materials disclose customer traction in several different units rather than a single customer-count metric.
