  - - Annual applied-acre trend
    - 5 million acres in 2023 vs 1 million two years earlier
    - 2021-2023 trend cited in 2024
    - MIT Technology Review
    - Independent signal that adoption accelerated materially before 2026
    - MIT does not break out product mix or unique customer count
  - - Retail access expansion
    - Nearly 500 new retail locations
    - '2024'
