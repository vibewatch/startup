  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-economics
    missingEvidence: Public or management-provided GRR, NRR, churn, renewal, and contract-length metrics by crop and channel.
    whyItMatters: Adoption appears real, but customer durability cannot be underwritten from testimonials and annual-program descriptions alone.
    diligencePath: Request cohort retention by product, acres renewed per farm, and retailer/grower contract terms for the last three seasons.
    relatedQuestionRefs:
    - QU016
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-retailer, and top-channel concentration metrics or even a public customer-count denominator.
    whyItMatters: Without concentration data it is impossible to know whether a few accounts or partners drive a disproportionate share of revenue or acreage.
    diligencePath: Ask management for top-10 customer and partner concentration by revenue, acres, and gross profit, plus any single-partner exposure covenant.
    relatedQuestionRefs:
    - QU017
    - QU028
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: brazil-commercial-customers
    missingEvidence: Named Brazilian commercial growers, distributors, or first-sale references after regulatory approval.
    whyItMatters: Brazil could be a major expansion vector, but pilots and local hiring do not prove commercial conversion or durable channel demand.
    diligencePath: Request approval status by product, first commercial invoice dates, named distributor or grower references, and 2026 booked-acre commitments in Brazil.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU001
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: retail-roster
    missingEvidence: Named roster behind the nearly 500 new retail locations disclosed for 2024.
    whyItMatters: The public proof set may understate reach, but it also prevents a real test of channel diversity and concentration.
    diligencePath: Request retailer roster, locations by partner, and acres sold through each major retail account.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-denominator
    missingEvidence: Any public customer-count, active grower-count, or active-acre denominator for current users.
    whyItMatters: Acreage milestones and payment totals are useful, but without a current user denominator it is hard to evaluate account breadth, retention, or sales productivity.
    diligencePath: Request current active grower count, active retailer count, and average acres per active customer for each major crop segment.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU001
    - TU002
