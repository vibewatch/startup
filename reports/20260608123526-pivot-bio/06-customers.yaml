tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Strategic value
  - Gap
  rows:
  - - U.S. corn growers
    - Buyer, user, and payer are typically the grower; local rep or retailer influences the choice
    - Replace part of preplant or early-season nitrogen with PROVEN 40 or PROVEN G3
    - Core commercial segment; official materials cite nearly 15 million validated acres and 129 growers in 2025 G3 trials
    - Largest installed base and strongest proof density
    - No public customer-count or repeat-acre disclosure by corn subsegment
  - - U.S. wheat and sorghum growers
    - Buyer and payer are typically the grower; advisors guide product fit
    - Use RETURN or RETAIN in small grains and sorghum
    - Named proof includes Chad Rubbelke and Hefty channel access for RETURN
    - Extends the platform beyond corn and supports rotation breadth
    - Public revenue mix and crop-by-crop adoption counts are absent
  - - Cotton growers
    - Buyer and payer are the grower; distribution partners help with access
    - Use CERT-N as a seed-treatment or other supported format to replace part of the cotton N plan
    - Select-grower commercial access in 2025; full 2026 launch planned; 30,000+ trial acres across 2024-2025
    - Opens a new acreage class and broadens account penetration
    - Commercial cohort size and 2026 sell-through are not public
  - - Independent rep and agronomy channel
    - Buyer still the grower; reps and agronomists are the advisory channel; payer is the grower
    - Field-by-field nitrogen planning, product selection, stewardship, and troubleshooting
    - Company describes an extensive rep network and more than 30 agronomists in current public materials
    - Trusted-advisor model matches how growers buy fertility inputs
    - Exact rep count, territory density, and conversion economics are undisclosed
  - - Retail partner channel
    - Retailer influences the sale; grower remains end user and payer
    - Local retail stocking, agronomy support, and merchandising
    - Hefty is the named proof with 49 locations in 10 states; official 2024 report cites nearly 500 new retail locations overall
    - Adds local trust and physical reach without only relying on direct reps
    - Most retailer locations are unnamed, so concentration cannot be measured publicly
  - - N-OVATOR growers plus downstream corporate buyers
    - Grower buys and uses the product; corporate partner effectively funds the incentive layer
    - Annual nitrogen-credit program tied to Scope 3 reductions and watershed benefits
    - 1.5 million verified acres in 2022-2023; 20% of customers enrolled in 2023; >$13 million paid since 2022
    - Turns customer usage into a second monetization and retention surface
    - Corporate partner names and renewal rates are not disclosed publicly
  - - Brazil pilot growers and future local partners
    - Likely large growers and local partners; final commercial payer structure still forming
    - Pilot plots, local agronomy, future commercial launch once approvals complete
    - About 30 large trial areas plus local warehousing and team buildout
    - Creates a South America expansion wedge in a fertilizer-import-dependent market
    - No named commercial Brazilian customers are public as of the run date
  notes: Rows are organized by buyer-user-payer structure and channel surface because Pivot Bio sells through a mix of direct grower, advisor, retailer, and incentive-program paths; public evidence is strongest for U.S. row crops and weakest for Brazil commercial conversion.
