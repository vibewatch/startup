  - - CERT-N cotton scale
    - 30,000+ acres across 2024-2025; >50 lb/ac lint increase; >$30/ac return
    - 2024-2025, published 2025-2026
    - Pivot Bio cotton launch and 2025 field-performance release
    - Cotton is no longer only an R&D story
    - Commercial customer count and 2026 sell-through remain undisclosed
