- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Pivot Bio solution
  - Measurable benefit
  - Limitation
  rows:
  - - Replace part of corn nitrogen at planting
    - In-furrow planting pass with tank-mix discipline
    - PROVEN 40 LIF applied at 12.8 oz/acre with stewardship controls
    - Up to 35 lb N/acre contribution in Illinois summary and one less nitrogen pass narrative
    - Opened product clock, sunlight limits, and compatibility discipline matter
  - - Treat corn seed before planting
    - Schedule seed treatment ahead of planting
    - PROVEN 40 OS or PROVEN G3 OS places microbes on seed
    - Roughly 25% of crop nitrogen needs positioned at planting per company blog framing
    - Seed compatibility and temperature stability remain gating factors
  - - Integrate nitrogen support into cotton planting
    - Seed-treatment workflow through partners in Cotton Belt states
    - CERT-N spoon-feeds nitrogen from emergence to harvest
    - 20% synthetic N replacement and ~50 lb lint uplift in launch materials
    - Full commercialization is still maturing into 2026
  - - Support wheat or sorghum rotations
    - Choose on-seed or in-furrow placement within existing planting practice
    - RETURN extends microbial nitrogen to small grains and sorghum
    - Maintains yields while replacing a portion of fertilizer and potentially reducing passes
    - Public crop-specific outcome data are thinner than corn
  - - Use planter-box application instead of liquid or pre-treated seed
    - Apply dry carrier directly on seed at planting
    - PROVEN G3 Dry, CERT-N Dry, and RETAIN Dry add dry placement plus micronutrients
    - More workflow flexibility and easier integration for some farms
    - Even coating, seed flowability, and first-season field validation remain watch items
  notes: Benefits are stated from public company or media summaries and should not be treated as guaranteed field outcomes.
