- id: dependencies-roadmap
  title: Dependencies, roadmap, and maturity by product line
  body: >-
    Pivot Bio’s product maturity is now strong enough that the main underwriting issue is less “does a product exist?” and
    more “what does scaled execution still depend on?” Publicly visible dependencies fall into four buckets. First is manufacturing
    and supply: the company says it increased St. Louis production, uses a domestic supply chain, and added a multiyear assurance
    program to stabilize 2026 through 2028 availability and pricing. Second is partner distribution and field service: Hefty
    Seed and Pivot Bio’s agronomy network matter because nitrogen replacement is still sold as field-specific rather than
    one-size-fits-all. Third is equipment and format integration: in-furrow users may need NLIGHTEN or equivalent setup, while
    dry formats depend on planter-box handling and even seed coating. Fourth is registrations: G3 and some new formats still
    carry explicit state-registration gating language in public launch copy.


    On maturity, PROVEN 40 looks like the most commercially proven SKU, while PROVEN G3 is the flagship technical upgrade
    and the center of the 2026 story. RETURN is real and multi-crop, but its public evidence depth is thinner than corn. CERT-N
    appears commercially real, but still earlier in rollout and more dependent on launch execution. Dry formulations improve
    workflow fit, yet they are also first-season commercialization surfaces. The roadmap therefore looks credible and productized,
    but not risk-free: Pivot Bio is selling a platform that now spans multiple crops and formats, and that breadth increases
    both defensibility and operational complexity.
