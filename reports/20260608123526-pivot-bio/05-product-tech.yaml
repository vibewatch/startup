  evidenceGaps:
  - type: missing-source
    severity: material
    topic: state-registration-detail
    missingEvidence: A product-by-product, state-by-state registration list for PROVEN G3, CERT-N Dry, and other new 2026
      formats.
    whyItMatters: Commercial readiness for crop inputs still depends on state registrations, but public launch materials do
      not centralize that status.
    diligencePath: Request the internal registration tracker or state fertilizer/soil amendment registration packet by SKU.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: federal-regulatory-path
    missingEvidence: A product-specific regulatory memo mapping each microbe and formulation to USDA, EPA, and state oversight
      boundaries.
    whyItMatters: The patents and APHIS page support only an inferred posture; underwriting needs a direct compliance view
      for each marketed product.
    diligencePath: Obtain counsel-prepared regulatory analysis and any Am I Regulated or state-agency correspondence.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: quality-control-metrics
    missingEvidence: Publicly absent live-cell specification, batch-pass-rate, complaint-rate, or cold-chain excursion data
      by formulation.
    whyItMatters: The platform relies on living microbes, so undocumented QC metrics limit confidence in repeatability at
      scale.
    diligencePath: Request manufacturing QA dashboards, batch release criteria, and claims/returns data by SKU and season.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: small-grains-roadmap
    missingEvidence: A crop-by-crop roadmap showing whether wheat and other small grains remain under the broad RETURN umbrella
      or are getting distinct next-generation SKUs.
    whyItMatters: Current public materials show coverage, but not the same SKU-level maturity and evidence depth as the corn
      family.
    diligencePath: Ask product management for the crop roadmap and state-registration timeline for wheat and small-grain variants.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
