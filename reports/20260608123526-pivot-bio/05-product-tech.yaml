- id: mechanism-ip
  title: Mechanism, gene editing, and IP differentiation
  body: >-
    The key product claim is not merely that Pivot Bio uses microbes; it is that the company uses gene-edited diazotrophs
    designed to keep fixing nitrogen even when the soil already contains synthetic or organic nitrogen. That distinction matters
    because ordinary free-living nitrogen-fixing microbes often downregulate fixation when nitrogen is abundant. Public patent
    material and third-party summaries are directionally consistent on the mechanism: targeted edits change the regulatory
    response to surrounding nitrogen, support ammonium excretion, and improve root-associated delivery under field conditions.
    The public patents also show that Pivot Bio is not relying on one generic bacterial chassis. Instead, the company describes
    engineered Klebsiella variicola and Kosakonia sacchari strains, plus a guided microbial remodeling process aimed at plant-beneficial
    functions including nitrogen fixation and colonization.


    The available external validation is meaningful but still mostly mediated through summaries rather than full open scientific
    articles. World Fertilizer and the University of Illinois study summary both describe isotope-based evidence that atmospheric
    nitrogen reached treated corn plants, and the Agronomy Journal summary attributes up to 35 pounds of nitrogen per acre
    during early vegetative growth to PROVEN 40. PROVEN G3 then extends the mechanism story commercially by adding a four-microbe,
    three-mode architecture that is supposed to combine direct nitrogen fixation with nutrient-uptake support. That makes
    the product moat a blend of microbial IP, formulation know-how, and field deployment learning rather than a simple marketing
    claim about biology.
  claimRefs:
