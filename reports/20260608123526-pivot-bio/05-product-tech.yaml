company:
  name: Pivot Bio
chapter:
  number: 5
  title: Product & Technology
  summary: Pivot Bio now has a real multi-crop product family—PROVEN 40 and PROVEN G3 for corn, RETURN for wheat and sorghum,
    CERT-N for cotton, and new dry planter-box variants—supported by unusually explicit stewardship materials and a broad
    patent estate. The technical moat is the company’s public gene-edited diazotroph platform, but product maturity still
    depends on registrations, handling discipline, retail and agronomy support, and first-season execution of newer dry and
    cotton formats.
sections:
- id: portfolio-workflows
  title: Public product family and grower workflow
  body: >-
    Pivot Bio now presents a real row-crop family rather than a single corn inoculant story. Public materials show a corn
    line centered on PROVEN 40 and PROVEN G3, a RETURN line that spans wheat, sorghum, and other small grains, and a cotton
    line anchored by CERT-N. The 2026 portfolio also adds dry planter-box formats for corn, cotton, and sorghum, which matters
    because it turns the company from one application method into a placement-flexibility story. The visible family therefore
    maps to four core grower workflows: liquid in-furrow at planting, on-seed treatment before planting, seed-treatment deployment
    for cotton, and planter-box dry application layered into seed handling.


    The operational logic is consistent across crops. Pivot Bio sells nitrogen delivered at the root during early growth,
    positioned as a foundational source that complements rather than fully replaces synthetic programs. For wheat and sorghum,
    RETURN is the public bridge into multi-crop rotations. For cotton, CERT-N is the evidence that the platform moved beyond
    cereals into another major acreage class. For corn, the public shift from PROVEN 40 toward PROVEN G3 suggests the company
    is trying to refresh a proven flagship without abandoning the legacy SKU. The strongest maturity signal is not only that
    these products exist, but that the company now publishes crop pages, application instructions, stewardship documents,
    and localized performance surfaces across multiple workflows.
