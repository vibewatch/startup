  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr and revenue
    missingEvidence: Current ARR, revenue run rate, gross margin, and net retention by segment.
    whyItMatters: Without these, revenue quality and valuation support cannot be tested directly.
    diligencePath: Request the latest board deck, monthly financial package, and cohort retention tables.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI022
  - type: private-evidence-only
    severity: material
    topic: cash and burn
    missingEvidence: Current cash balance, monthly burn, debt, and runway assumptions after the 2026 round.
    whyItMatters: Capital adequacy cannot be converted into an actual financing-risk view without liquidity data.
    diligencePath: Request balance sheet, cash-flow statements, and financing model.
    relatedQuestionRefs:
    - QI021
  - type: missing-source
    severity: material
    topic: 2026 valuation terms
    missingEvidence: Official post-money valuation, round structure, and any primary-versus-secondary split for the 2026 financing.
    whyItMatters: Round structure directly affects dilution analysis and any implied valuation benchmark.
    diligencePath: Request financing documents or investor presentation support for the Riverwood transaction.
    relatedQuestionRefs:
    - QI023
