    severity: material
    topic: 2026 round structure
    missingEvidence: Post-money valuation, primary vs secondary mix, preference stack, and investor protections for the 2026 round.
    whyItMatters: The price paid in the latest round is central to any recommendation but is not publicly disclosed.
    diligencePath: Request financing documents or summary term sheet.
    relatedQuestionRefs:
      - QV027
