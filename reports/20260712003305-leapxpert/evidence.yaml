    severity: moderate
    topic: TV004 comparable valuation table
    missingEvidence: Transparent current valuation marks for private peers such as Smarsh, Global Relay, and other DCGA vendors.
    whyItMatters: Private-peer opacity limits how precisely LeapXpert can be benchmarked using public information alone.
