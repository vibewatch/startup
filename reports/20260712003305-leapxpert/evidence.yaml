evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder roster
    missingEvidence: >-
      A primary corporate history or cap-table-confirmed founder list clarifying whether Rina Charles is formally a
      co-founder alongside Dima Gutzeit and Avi Pardo.
    whyItMatters: Founder identity affects attribution, governance history, and key-person assessment in later chapters.
    diligencePath: Request the company’s official incorporation history, founder bios, and cap-table history.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: 2026 valuation
    missingEvidence: >-
      An official or independently reported post-money valuation and primary-versus-secondary round split for the June
      2026 transaction.
    whyItMatters: Without round pricing, later valuation work must rely on inference rather than a verified market mark.
    diligencePath: Request financing documents, a board consent summary, or investor presentation for the 2026 round.
    relatedQuestionRefs:
      - QO011
      - QO024
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Current ARR, revenue, gross margin, cash, and debt figures as of the 2026 growth round.
    whyItMatters: Capital raised alone cannot establish revenue quality or the sustainability of LeapXpert’s growth narrative.
    diligencePath: Obtain a management financial package and latest board materials.
    relatedQuestionRefs:
      - QO023
      - QO025
  - type: missing-source
    severity: minor
    topic: customer count
    missingEvidence: >-
      A precise current customer-count disclosure or production-account count rather than qualitative references to
      hundreds of organizations.
    whyItMatters: Exact scale affects customer chapter sizing and valuation triangulation.
    diligencePath: Request a current customer overview or sales KPI dashboard.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: material
    topic: market size gap
    missingEvidence: >-
      A high-quality public TAM/SAM dataset for digital communications governance segmented by channel, vertical, and
      geography.
    whyItMatters: Without it, sizing remains multi-lens and directional rather than precise.
    diligencePath: Obtain Gartner, IDC, or paid market reports and compare them to management pipeline data.
    relatedQuestionRefs:
      - QM023
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: budget ownership split
    missingEvidence: Internal sales data showing how often compliance, security, IT, or business lines own the budget.
    whyItMatters: Budget ownership determines sales motion, CAC, and expansion risk.
    diligencePath: Review CRM opportunity data and win/loss notes by buyer function.
    relatedQuestionRefs:
      - QM024
  - type: stale
    severity: minor
    topic: regional demand mix
    missingEvidence: >-
      Fresh 2026 public data on adoption by geography and channel mix rather than mostly qualitative regional
      references.
    whyItMatters: International expansion quality matters to market sizing and GTM prioritization.
    diligencePath: Request regional ARR, pipeline, and active-channel mix from management.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: win-loss gap
    missingEvidence: Actual competitive win-loss data by vendor, channel, and deal segment.
    whyItMatters: Without it, feature comparisons cannot be tied to real sales effectiveness or renewal durability.
    diligencePath: Review CRM opportunity notes, RFP summaries, and churn/win-back analyses.
    relatedQuestionRefs:
      - QP023
      - QP025
  - type: missing-source
    severity: material
    topic: pricing opacity
    missingEvidence: >-
      Comparable public pricing or reliable price-benchmark data across LeapXpert, Smarsh, Global Relay, Movius, Theta
      Lake, and Proofpoint.
    whyItMatters: Pricing power and discounting behavior are central to gross-margin and displacement analysis.
    diligencePath: Obtain customer proposals, procurement benchmarks, or third-party price studies.
    relatedQuestionRefs:
      - QP024
  - type: stale
    severity: minor
    topic: share by channel
    missingEvidence: Fresh public evidence on vendor share specifically within WhatsApp-governed enterprise messaging.
    whyItMatters: Channel-level leadership may differ from broader archive leadership.
    diligencePath: Request product-specific pipeline and active-user mix by channel from management.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: arr and revenue
    missingEvidence: Current ARR, revenue run rate, gross margin, and net retention by segment.
    whyItMatters: Without these, revenue quality and valuation support cannot be tested directly.
    diligencePath: Request the latest board deck, monthly financial package, and cohort retention tables.
    relatedQuestionRefs:
      - QI019
      - QI020
      - QI022
  - type: private-evidence-only
    severity: material
    topic: cash and burn
    missingEvidence: Current cash balance, monthly burn, debt, and runway assumptions after the 2026 round.
    whyItMatters: Capital adequacy cannot be converted into an actual financing-risk view without liquidity data.
    diligencePath: Request balance sheet, cash-flow statements, and financing model.
    relatedQuestionRefs:
      - QI021
  - type: missing-source
    severity: material
    topic: 2026 valuation terms
    missingEvidence: Official post-money valuation, round structure, and any primary-versus-secondary split for the 2026 financing.
    whyItMatters: Round structure directly affects dilution analysis and any implied valuation benchmark.
    diligencePath: Request financing documents or investor presentation support for the Riverwood transaction.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: material
    topic: internal architecture
    missingEvidence: >-
      Detailed architecture diagrams, API documentation, data-flow diagrams, and model-governance documentation for
      Signals / Maxen.
    whyItMatters: Without these, diligence cannot verify scalability, privacy boundaries, or AI control design.
    diligencePath: Request architecture review with engineering leadership and sandbox/API documentation.
    relatedQuestionRefs:
      - QE022
  - type: missing-source
    severity: material
    topic: reliability and incidents
    missingEvidence: Public status history, uptime figures, SLA commitments, and incident-response evidence.
    whyItMatters: Governed communications products become mission-critical once embedded into regulated workflows.
    diligencePath: Request status-page history, SLO/SLA pack, and top sev-1 incident postmortems.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: moderate
    topic: certification scope
    missingEvidence: Linked SOC 2 / ISO certificate details and control-scope boundaries.
    whyItMatters: Trust claims are central to the buying decision and should be verified beyond marketing copy.
    diligencePath: Request current audit letter, ISO certificate, and control matrix.
    relatedQuestionRefs:
      - QE020
      - QE024
  - type: private-evidence-only
    severity: material
    topic: retention metrics
    missingEvidence: GRR, NRR, logo churn, renewal rate, and average contract term by segment.
    whyItMatters: Without these, durability cannot be underwritten and public references may overstate commercial quality.
    diligencePath: Request cohort retention deck, renewal schedule, and churn root-cause analysis.
    relatedQuestionRefs:
      - QU016
      - QU023
      - QU022
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-10 customers by ARR, percent of revenue from largest account, and partner-influenced revenue mix.
    whyItMatters: A concentrated base would materially change downside risk and valuation support.
    diligencePath: Request revenue concentration table and partner-sourced ARR breakdown.
    relatedQuestionRefs:
      - QU017
      - QU024
  - type: missing-source
    severity: moderate
    topic: government customer names
    missingEvidence: Named agency deployments and production outcomes in U.S. government or other public-sector accounts.
