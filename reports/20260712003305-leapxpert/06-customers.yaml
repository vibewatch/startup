  - - Federal channel opportunity
    - 'Buyer: federal IT and security stakeholders; user: agency staff; payer: public sector budgets'
    - Modern messaging with NIST/CMMC/FedRAMP alignment
    - Iron Bow and Knox relationships point to access path
    - Could open hard-to-enter public-sector budgets
    - Still early and dependent on partner execution
