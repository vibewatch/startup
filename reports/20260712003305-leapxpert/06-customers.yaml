    - Public named customer proof is thinner than in finance
  - - Partner-led Microsoft ecosystem buyers
    - 'Buyer: collaboration / IT leaders; user: Teams users; payer: enterprise'
    - Governed messaging and calling from Teams
    - Marketplace and Azure marketplace presence
    - Distribution wedge into Microsoft-heavy enterprises
