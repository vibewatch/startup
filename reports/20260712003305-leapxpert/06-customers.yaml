figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: LeapXpert customers typically discover the product through a compliance trigger, evaluate it as a governance overlay, and then expand only after archive and policy workflows are working.
  data:
    items:
    - id: stage-awareness
      label: Awareness
      actor: Compliance / IT buyer
      description: Buyer realizes clients already use consumer messaging channels that existing controls cannot fully supervise.
      channels:
      - Regulatory pressure
      - Peer references
      - Microsoft / partner ecosystem
    - id: stage-evaluation
      label: Evaluation
      actor: Compliance + security + front-office stakeholders
      description: Institution tests whether LeapXpert can preserve user experience while capturing and governing traffic across needed channels.
      channels:
      - RFP / vendor review
      - Security review
      - Archive / Teams compatibility check
    - id: stage-deployment
      label: Deployment
      actor: Admin + client-facing teams
      description: Selected users or teams are provisioned, policies configured, and communication routed into archive / surveillance systems.
      channels:
      - Admin portal
      - Teams / native channel rollout
      - Archive integration
    - id: stage-proof
      label: Governed production use
      actor: Front-office users + compliance teams
      description: Client conversations are captured, monitored, and archived while employees stay in preferred workflows.
      channels:
      - WhatsApp / iMessage / Telegram / Teams
      - Compliance oversight
      - Customer support
    - id: stage-expansion
      label: Expansion / renewal
      actor: Account leadership + customer sponsor
      description: Additional geographies, channels, business units, or government pathways open if control and adoption hold.
      channels:
      - Reference selling
      - Partner channels
      - New verticals / regions
