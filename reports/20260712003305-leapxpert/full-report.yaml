      - number: '8.2'
        title: Current Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The latest financing context is both encouraging and frustrating. Encouraging because the company
              disclosed a $180 million Riverwood-led growth round, Riverwood joined the board, and Riverwood explicitly
              frames its strategy around companies scaling from tens of millions of revenue toward hundreds of millions.
              Frustrating because accessible public sources still do not disclose the valuation or detailed round
              structure. Secondary databases corroborate total funding around $236 million, but they do not solve the
              central underwriting problem. If the market is implicitly treating LeapXpert as a unicorn after the 2026
              round, that may or may not be reasonable—but public evidence cannot prove it. Entry discipline therefore
              matters more than company quality. At a large discount to a $1B benchmark, the public evidence becomes
              easier to live with. At or above a unicorn-style entry, the deal becomes a bet that private ARR,
              retention, concentration, and margin data are substantially stronger than what public sources can show.
              That is too big a leap for a clean buy recommendation based on public information alone.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
