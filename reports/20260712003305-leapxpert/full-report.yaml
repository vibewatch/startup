  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-LeapXpert case is straightforward. Enterprise communications have moved to channels that
              regulators and enterprises can no longer ignore, and LeapXpert sits at the junction of that problem.
              Public evidence shows a platform that does more than archive: it governs messaging across important
              channels, routes records into existing compliance systems, and is now trying to monetize conversation data
              through workflows and intelligence. Customer proof is real enough to matter—Prometheus, Laser Digital,
              Glencore, large unnamed institutions, and public-sector channel partners all support the idea that the
              problem is not theoretical. The anti-thesis is equally clear. Public valuation visibility is poor,
              customer durability is largely undisclosed, partner/API dependence remains high, and the expansion story
              into AI or government may still be ahead of evidence. In other words, LeapXpert looks like a credible
              platform company, but public evidence is much stronger on why the category exists than on what exact price
              an investor should pay for this specific asset.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
