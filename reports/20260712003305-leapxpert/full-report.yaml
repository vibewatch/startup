  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Problem Definition
        blocks:
          - type: paragraph
            body: >-
              LeapXpert’s market should be defined more narrowly than general collaboration software but more broadly
              than legacy archiving. The core problem is that business conversations increasingly happen on consumer
              messaging channels—WhatsApp, iMessage, Signal, WeChat, SMS and similar apps—while regulated employers
              still need retention, supervision, security, auditability, and policy enforcement. LeapXpert’s own
              market-facing pages reinforce that wider boundary. The platform is not only about recordkeeping; it also
              captures metadata, deleted content, attachments, emojis and stickers, applies governance controls such as
              DLP and information barriers, scans for malware and impersonation, and can trigger business workflows from
              conversation events. That means the practical market boundary includes digital communications governance,
              mobile-message compliance, enterprise messaging security, and conversation-intelligence extensions. It
              excludes ordinary consumer messaging itself and it also excludes collaboration tools that do not solve
              regulated capture, retention, or policy enforcement. In other words, buyers are not simply purchasing
              another chat client. They are buying a control plane for customer-facing conversations that already happen
              outside email.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
