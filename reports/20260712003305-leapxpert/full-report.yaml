            body: >-
              Leadership visibility is strongest around Dima Gutzeit and Avi Pardo, but the public founder record is not
              perfectly clean. LeapXpert’s 2026 funding releases explicitly identify Dima Gutzeit as founder and CEO and
              Avi Pardo as co-founder and chief business officer. The about page features both executives prominently.
              However, Tracxn lists Dima Gutzeit and Rina Charles as founders, and Built In’s 2023 image caption shows
