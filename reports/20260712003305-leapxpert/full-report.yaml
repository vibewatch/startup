            body: >-
              LeapXpert’s expansion narrative is clear even if the hard numbers are not. Management says financial
              services was the proving ground, government became the fastest-growing segment, and the Global 2000 or
              broader enterprise is the third wave. Geographic expansion is equally visible: official and third-party
              sources cite more than 45 countries, a strong Middle East use case through Prometheus and UAE
              data-residency needs, and new government pathways via Knox and Iron Bow. These signals suggest a plausible
              land-and-expand pattern across both sectors and geographies. The missing piece is concentration. Public
              materials do not disclose whether revenue is concentrated in a handful of banks, influenced by a small
              number of large regulated logos, or dependent on Microsoft-/Meta-centric channel workflows. Because the
              platform is compliance-heavy and often embedded into archive or surveillance stacks, switching costs may
              become attractive over time; but without customer-mix and expansion-cohort data, investors cannot tell
