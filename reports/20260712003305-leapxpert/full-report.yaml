            body: >-
              The trust and control surface is unusually central to LeapXpert’s product story, which is appropriate for
              its target market. Recordkeeping pages emphasize centralized encrypted logs, policy-based retention, legal
              holds, and export into existing archive systems. Governance pages emphasize DLP, information barriers,
              identity verification, and policy monitoring. Security pages emphasize anti-malware, CDR, and
