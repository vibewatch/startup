      - number: '3.2'
        title: Competitor Profiles and Where They Overlap
        blocks:
          - type: paragraph
            body: >-
              The strongest overlap comes from firms with both broad archive depth and regulated-market credibility.
              Smarsh markets a unified communications-data-compliance platform spanning capture, archive, surveillance,
              discovery, and workforce-intelligence functions, and claims 6,500-plus customers plus deep penetration in
              large financial institutions. Global Relay’s archive page emphasizes immutable preservation, private
              infrastructure, legal holds, chain of custody, and AI surveillance layered on top of a normalized archive.
              Theta Lake markets unified capture across UCC platforms and modalities such as chat, voice, video, and
              whiteboards while highlighting that many firms still restrict collaboration features because of compliance
              concerns. Movius focuses on software-managed numbers, compliant voice and SMS, WhatsApp messaging, and
              Teams integration, making it a closer substitute when buyers prioritize mobile voice and BYOD management.
              Behavox highlights AI-driven communication surveillance and intelligent archiving for large banks, hedge
              funds, and private-equity firms. Proofpoint offers archive, e-discovery, and SEC 17a-4 compliant retention
              across email, IM, social, collaboration, and SMS. Symphony is more collaboration-network centric, but its
              financial-markets installed base and open API posture make it a credible adjacent rival for messaging
              workflows in capital markets.
