      - number: '8.4'
        title: Comparable Set and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Public comparables are only partly helpful. NICE and Verint give usable public-market signals because they
              sit near adjacent communications-governance, surveillance, analytics, or customer-engagement workflows.
              Their observed revenue multiples are not high enough to casually justify a public-information-only unicorn
              case for LeapXpert. Private peers like Smarsh and Global Relay matter more strategically than numerically:
              they show what scaled communications-compliance businesses can look like, but they do not provide
              transparent, current valuation marks in the fetched set. Exit readiness is also mixed. LeapXpert has a
              story that could interest strategic buyers in compliance, archiving, communications, or workflow
              intelligence, and the 2026 round plus Riverwood sponsorship suggest an eventual IPO ambition cannot be
              ruled out. Yet exit quality will hinge on whether the company is still mainly a regulated capture tool or
              has genuinely become a broader communication-intelligence platform with durable expansion economics.
              Public evidence cannot settle that question yet.
            claimRefs:
              - CV024
