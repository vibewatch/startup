            body: >-
              Financially, LeapXpert reads like a promising but still opaque growth-stage software company. The
              positives are substantial: strong sponsor support, evidence of regulated-customer traction, a product
              stack that can monetize across several layers, and a market narrative that expands from compliance into
              AI-powered business intelligence. The negatives are almost entirely about missing disclosure. Public
              evidence does not reveal ARR, revenue growth, gross margin, customer concentration, NRR, churn, burn, or
              the exact terms of the 2026 financing. Even the best external stories still describe use of proceeds and
              go-to-market ambition more than current economics. This chapter therefore stops short of calling the
