  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Picture
        blocks:
          - type: paragraph
            body: >-
              LeapXpert’s risk stack should be read from the outside in. The outer layer is regulation and platform
              policy: SEC, FINRA, FCA, public-records, healthcare, and privacy regimes define what customers must do,
              while Meta, Microsoft, Signal, and WeChat partly define what LeapXpert can technically do. The middle
              layer is operational execution: the company must capture, secure, archive, and route communications
              accurately across changing channels, device models, and enterprise configurations. The inner layer is
              business-model resilience: whether the company can turn this complex delivery problem into durable
              retention, diversified revenue, and repeatable public-sector expansion. Severity is highest where failure
              breaks the core trust proposition. If capture fails, governance fails; if governance fails, customers face
              fines, legal exposure, or policy breaches; and if that happens in public reference accounts, commercial
              credibility falls quickly. That is why the risk assessment weights regulatory capture integrity,
              partner/API continuity, and security posture above more ordinary SaaS execution issues.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR017
              - CR018
