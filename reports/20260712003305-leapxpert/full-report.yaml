  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Structure: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              LeapXpert does not face one monolithic competitor set. The direct peers are communications-governance
              vendors that explicitly capture, retain, supervise, and secure external messaging and collaboration data.
              Smarsh and Global Relay are the clearest incumbents because they position themselves as large-scale
              compliance and archiving platforms with thousands of customers, regulated-market credibility, and broad
              capture across communication types. Theta Lake competes more from the UCC-capture side, emphasizing chat,
              voice, video, whiteboards, and unified communications tooling. Movius attacks from the secure-number and
              compliant-mobile-communications angle, especially for SMS, voice, and WhatsApp-style external messaging
              inside existing workflows. Behavox and Proofpoint represent surveillance and archive-centric alternatives,
              while Symphony occupies a related but distinct position as a financial-markets collaboration network with
              regulated-market credibility and open APIs. Internal-build options and combinations of Teams, archive
              vendors, MDM, and legal-hold tools also remain substitutes for some buyers, especially those with narrow
              channel needs. The result is a fragmented landscape where LeapXpert must win on workflow fit and channel
              control rather than merely on the abstract idea of compliant messaging.
            claimRefs:
              - CP001
              - CP002
