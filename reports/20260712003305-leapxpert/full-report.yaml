            body: >-
              Public retention evidence is the most important gap in this chapter. No accessible source discloses gross
              retention, net retention, logo churn, renewal rates, contract duration, or customer concentration. The
              public record instead offers softer durability proxies. Prometheus reportedly chose LeapXpert after peer
              conversations and after another provider was disrupted by Meta changes, implying that LeapXpert can win
              replacement deals when reliability or channel continuity matters. Glencore’s integration path into Behavox
              suggests stickier surveillance-oriented workflows if implementation succeeds. Gartner material quoted in
              LeapXpert’s own brochure says customers highly regard the platform’s flexibility, configurability, ease of
              implementation, and post-sales support, which is directionally positive but not independently auditable
              from the fetched set. FeaturedCustomers adds some outside color with three testimonials, two case studies,
              and a 4.8/5 score based on 450 reference ratings, but it still offers limited transparent detail and
              cannot substitute for renewal data. The practical reading is that customer love may exist, but public
              retention proof remains thin.
