      - number: '2.4'
        title: 规模测算视角与采用约束
        blocks:
          - type: paragraph
            body: >-
              可获取公开证据没有给出 LeapXpert 精确细分市场中完全免费且精确的总可用市场（TAM）数字，但支持几种可信测算视角。第一是监管视角：
              每一个受记录留存、隐私或安全控制约束的经纪交易商、投资顾问、公共机构、医疗服务商或跨国企业，都是潜在买方群体。第二是渠道视角： WhatsApp、iMessage、Signal、WeChat
              等高使用率应用每增加一个，都会让更多企业对话落在原生邮件治理之外。第三是工作流视角： 一旦采集和政策控制就位，企业就能接上自动化、审批和智能功能，把预算从纯合规扩展到运营生产力。同一组证据也显示采用约束。
              平台依赖是真实存在的，因为渠道提供方可以改变政策或 API。BYOD 和企业设备政策会让落地更复杂。数据驻留、区域规则和归档集成会拉长销售周期并增加实施复杂度。
              因此，市场足够大、足够耐久，但并非毫无摩擦。胜出的供应商应能把合规级采集、灵活集成、可信安全控制和足够产品宽度结合起来，从归档走向更宽的受管控通信系统。
