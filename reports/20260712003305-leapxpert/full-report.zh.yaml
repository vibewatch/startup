      - number: '4.5'
        title: 财务判断与披露缺口
        blocks:
          - type: paragraph
            body: >-
              从财务上看，LeapXpert 像一家有前景但仍不透明的成长期软件公司。正面因素相当实在：强投资方支持、受监管客户牵引证据、 可跨多层商业化的产品栈，以及从合规扩展到 AI
              驱动商业智能的市场叙事。负面因素几乎都来自缺失披露。公开证据没有揭示 ARR、收入增长、 毛利率、客户集中度、NRR、流失、烧钱速度或 2026 年融资精确条款。即便最好的外部故事，也更多描述资金用途和 GTM
              野心， 而不是当前经济性。因此，本章不会说这门业务财务风险已经出清；它只得出一个判断：LeapXpert 可能具备高价值企业平台的要素，
              但任何严肃估值或回报情景，都必须用内部队列、利润率和现金数据验证。用尽调语言说：融资故事足够可投，值得继续看； 但仅靠公开信息，透明度不足以自信定价。
