  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与问题定义
        blocks:
          - type: paragraph
            body: >-
              LeapXpert 的市场边界应比通用协作软件更窄，但比传统归档更宽。核心问题是，商务对话越来越多发生在 WhatsApp、iMessage、 Signal、WeChat、SMS
              等消费级消息渠道上，而受监管雇主仍需要留存、监督、安全、可审计和政策执行。LeapXpert 自有市场页面也强化了这个更宽边界。 平台不只是记录留存；它还采集元数据、已删除内容、附件、emoji 和贴纸，施加
              DLP、信息屏障等治理控制，扫描恶意软件和冒名行为， 并可由对话事件触发业务工作流。因此，实际市场边界包括数字通信治理、移动消息合规、企业消息安全，以及对话智能扩展。它不包括普通消费级消息本身，
              也不包括无法解决受监管采集、留存或政策执行的协作工具。换句话说，买方买的不是又一个聊天客户端，而是一个控制平面，用来管住那些已经发生在邮件之外的客户对话。
