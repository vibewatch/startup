  - id: TM004
    title: 受证据约束的规模测算视角与限制
    columns:
      - 视角
      - 扩大市场规模的因素
      - 限制转化的因素
      - 影响方向
    rows:
      - - 监管视角
        - 更多行业背上记录保存和监督义务
        - 不同监管机构和地区的解读、采购节奏各不相同
        - 规模大，但合规规则碎片化
      - - 渠道视角
        - WhatsApp、iMessage、Signal、WeChat、SMS 等渠道扩大了治理覆盖面
        - 部分平台仍更难集成，也更难持续治理
        - 每新增一个采用渠道，市场就随之扩张
      - - 工作流视角
        - 捕获能力可以延伸到审批、认证和运营自动化
        - 如果 ROI 没有验证，买方可能只停在归档
        - 扩展跑通后会抬高 ACV
      - - 公共部门视角
        - FOIA 和公共记录需求把需求从金融推向更宽领域
        - 政府采购周期更慢，认证负担更重
        - 规模大，但推进慢
      - - 医疗视角
        - HIPAA 和安全移动通信需求带来相邻需求
        - 安全审查和集成负担可能拖慢部署
        - 选择性强，但邻近性可信
      - - 平台依赖视角
        - 官方 API 和商业政策可以让渠道合规化
        - Meta 或其他平台的政策变化可能冲击供应商
        - 既创造需求，也带来风险
      - - 集成视角
        - 归档、监控和身份集成让覆盖层更有吸引力
        - 复杂技术栈集成会推高部署成本和销售时间
        - 采用后提升留存
      - - 披露视角
        - 增长奖项和客户案例暗示存在预算需求
        - 公开渠道没有 LeapXpert 精准细分领域的干净免费 TAM
        - 规模测算仍是方向性判断，不是精确值
    notes: 本章有意不用单一醒目的 TAM 数字，而是采用多重视角；公开证据对需求逻辑的支撑更强，免费的高质量市场规模数据反而不足。
    claimRefs:
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
