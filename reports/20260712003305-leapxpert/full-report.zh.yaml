companyProfile:
  summary: |
    LeapXpert 提供受管控通信平台，让企业员工能在消费级消息渠道上与客户互动，同时保留记录留存、治理和安全控制。
    公开产品证据显示，平台支持 WhatsApp、iMessage、SMS、Signal、WeChat、Telegram，以及 Microsoft Teams
    等协作入口；同时提供合规归档、DLP 和信息屏障、消息安全、工作流自动化，以及 Signals、Maxen 等产品承载的
    AI 辅助智能。公开客户证据在受监管金融服务及相邻市场最强，具名案例包括 Prometheus、Laser Digital 和
    Glencore；公司也声称已有数百家机构依赖该平台。
  foundedDate: '2017-01-01'
  founders:
    - name: Dima Gutzeit
      role: 创始人兼 CEO
      background: |
