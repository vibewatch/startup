      - - 监管 / 记录保存失效
        - 具名客户、监管机构或法院指出采集或留存失效
        - 旗舰客户出现任何已确认的重大合规缺口
        - 除非根因已隔离并修复，否则视为投资逻辑破裂
      - - 安全 / 信任失效
        - 平台相关严重入侵、恶意软件漏出或冒充事件
