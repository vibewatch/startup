        - label: 具名官方客户发布层
          values:
            - 75
            - 65
            - 35
        - label: 第三方 / 案例研究层
          values:
            - 65
            - 55
            - 25
        - label: 独立客户自述层
          values:
            - 25
            - 20
            - 10
    approximationNotes: 这不是收入留存队列，而是证据深度队列：在抓取的来源集中，按客户生命周期各阶段公开证据出现的百分比打分。LeapXpert 未公开披露真实 GRR/NRR 或 logo 留存队列。
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高剩余风险同时具有高监管后果、对外部渠道的实质依赖，以及对证据敏感的运营。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 记录留存 / 监管失败
          values:
            - 高
            - 严重
            - 中
            - 严重
        - label: Meta / 渠道政策扰动
          values:
            - 中高
            - 严重
            - 中
            - 高
        - label: 安全 / 数据泄露事件
          values:
            - 中
            - 严重
            - 中
            - 高
        - label: 政府执行延迟
          values:
            - 中
            - 高
            - 低-中
            - 中-高
        - label: 客户集中度 / 留存不透明
          values:
            - 未知-中
            - 高
            - 低
            - 中-高
        - label: AI 路线图牵制
          values:
            - 中
            - 中-高
            - 低-中
            - 中
    claimRefs:
      - CR001
      - CR007
      - CR011
      - CR017
      - CR022
      - CR025
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    summary: LeapXpert 处在控制层位置，不是可选的前端应用；因此监管或平台一旦失灵，会很快传导到客户信任、收入韧性和估值。
    data:
      nodes:
        - id: platform
          label: 平台 / API 变更
        - id: capture
          label: 留痕或控制中断
        - id: reg
          label: 监管 / 法律风险暴露
        - id: trust
          label: 客户信任流失
        - id: revenue
          label: 留存 / 集中度压力
        - id: valuation
          label: 估值倍数压缩
        - id: public
          label: 政府 / 公共部门延迟
      edges:
        - from: platform
          to: capture
          label: 工作流中断或降级
        - from: capture
          to: reg
          label: 记录留存 / 监督缺口
        - from: reg
          to: trust
          label: 罚款 / 政策违规 / 审计失败
        - from: trust
          to: revenue
          label: 续约和扩张走弱
        - from: revenue
          to: valuation
          label: 增长质量重估
        - from: public
          to: revenue
          label: 扩张上行空间下滑
        - from: platform
          to: valuation
          label: 合作伙伴依赖重估
    claimRefs:
      - CR017
      - CR018
      - CR020
      - CR022
      - CR036
      - CR037
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: LeapXpert 的运营模式依赖第三方渠道、归档系统和政府市场进入伙伴；这些伙伴的表现和政策会左右客户结果。
    data:
      nodes:
        - id: meta
          label: Meta / WhatsApp
        - id: microsoft
          label: Microsoft
        - id: channels
          label: 其他渠道（Signal / WeChat 等）
        - id: archives
          label: 归档 / 监控系统
        - id: govpartners
          label: Knox / Iron Bow
        - id: core
          label: LeapXpert 核心平台
        - id: customers
          label: 受监管企业客户
      edges:
        - from: meta
          to: core
          label: 官方 API / 政策依赖
        - from: microsoft
          to: core
          label: Teams / Entra / 托管依赖
        - from: channels
          to: core
          label: 条款 / 地域 / 可用性
        - from: core
          to: archives
          label: 导出与监控集成
        - from: govpartners
          to: customers
          label: 联邦市场进入通道
        - from: core
          to: customers
          label: 通信治理控制平面
        - from: archives
          to: customers
          label: 审计证据补全
    claimRefs:
      - CR018
      - CR019
      - CR020
      - CR021
      - CR033
      - CR035
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 真实品类需求和客户验证支撑了推荐，但经济性和价格仍卡在公开证据瓶颈上。
    data:
      nodes:
        - id: market
          label: 真实市场痛点 + 监管顺风
        - id: product
          label: 具备工作流 / AI 上行空间的通信治理平台
        - id: proof
          label: 具名客户和支持方证据
        - id: gap
          label: 缺少 ARR / 留存 / 估值披露
        - id: call
          label: 跟踪 / 继续研究，不按公开数据买入
      edges:
        - from: market
          to: product
          label: 品类需求可信
        - from: product
          to: proof
          label: 平台和融资带来真实关注
        - from: proof
          to: gap
          label: 有证据，但经济性仍不透明
        - from: gap
          to: call
          label: 公开信息无法厘清价格
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV009
      - CV012
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 估值判断最敏感的是私下收入规模和倍数支撑，而不是公开品牌热度本身。
    data:
      items:
        - label: 收入规模假设
          value: 350
        - label: 留存 / 集中度质量
          value: 220
        - label: 可比公司倍数支撑
          value: 300
        - label: 政府扩张转化
          value: 120
        - label: 合作伙伴连续性 / 平台稳定性
          value: 140
        - label: AI 附加销售率变现
          value: 180
    claimRefs:
      - CV016
      - CV017
      - CV024
      - CV029
      - CV033
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 公开证据支撑的估值区间很宽，$1B+ 更接近牛市情形，而不是最有依据的基准情形。
    data:
      items:
        - label: 熊市情形估值
          low: 0.1
          high: 0.24
          mid: 0.17
          unit: $B
        - label: 基准情形估值
          low: 0.3
          high: 0.8
          mid: 0.55
          unit: $B
        - label: 牛市情形估值
          low: 0.9
          high: 1.68
          mid: 1.2
          unit: $B
        - label: 独角兽式隐含估值
          low: 1
          high: 1.2
          mid: 1.1
          unit: $B
        - label: 公开证据下的优先入场区间
          low: 0.45
          high: 0.75
          mid: 0.6
          unit: $B
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 投资 KPI 显示品类相关性强，但估值能见度弱。
    data:
      items:
        - label: 市场痛点
          value: strong
          status: confirmed
          note: 渠道外沟通的执法与治理需求证据充分
        - label: 客户证据
          value: moderate-strong
          status: confirmed
          note: 有具名案例，但留存深度有限
        - label: 护城河质量
          value: moderate
          status: supported
          note: 多渠道治理，加上工作流 / AI 叠加层
        - label: 经济性能见度
          value: weak
          status: gap
          note: ARR、NRR、利润率和集中度未公开
        - label: 估值能见度
          value: weak
          status: gap
          note: 2026 年轮次估值未公开
        - label: 建议立场
          value: track / research-more
          status: recommended
          note: 接受溢价前，需要拿到私有指标
    claimRefs:
      - CV009
      - CV024
      - CV031
      - CV032
      - CV033
      - CV040
