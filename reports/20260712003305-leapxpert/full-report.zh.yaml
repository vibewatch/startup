  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊
        - ARR 可能低于 ~$40M，增长仍以金融客户为主，扩张证明有限，留存能见度较低
        - 按窄合规工具给 ~4x-6x 收入等价倍数，推得约 $0.10B-$0.24B 价值
        - 集中度、API 依赖、企业客户多元化较慢
        - 若私下指标不及预期，该情景权重不低
      - - 基准
        - ARR 约 ~$50M-$80M，受监管客户留存强，但经济性仍由合规驱动，公共部门上行尚未验证
        - 按 ~6x-10x 收入等价倍数，推得约 $0.30B-$0.80B 价值
        - 政府执行、倍数压缩、AI 上行未充分变现
        - 公开证据下最站得住脚
      - - 牛
        - ARR 约 ~$90M-$140M，金融向政府 / 更广企业市场的扩张可持续，留存强，工作流 / AI 能变现
        - 按 ~10x-12x 收入等价倍数，推得约 $0.90B-$1.68B 价值
        - 需要私下指标和执行质量显著高于公开披露
        - 可能存在，但公开层面尚未证明
    notes: 情景估值来自公开可比公司加显式私下指标假设；不是管理层指引。
