      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场里，买方、用户和付款方并不完全相同。合规、法律、记录、安全和风险负责人常常掌握强制触发点，因为监督失败或数据丢失的成本由他们承担。
              前台负责人、客户经理、顾问、银行家和政府外勤人员是日常用户，因为他们需要在客户或选民已经偏好的渠道上触达对方。IT 和架构团队则成为技术守门人，
              因为现代消息项目必须接入身份、移动设备、归档、监测和生产力技术栈。LeapXpert 的客户故事和产品页面清楚展示了采用顺序：
              企业先把一两个渠道合规化，采集并归档流量，再叠加治理和安全控制，把技术栈接入既有归档或监测系统，随后扩展到更多渠道和工作流自动化。 Prometheus 的 Bloomberg Vault 路由、一级金融机构以
              Teams 为中心的部署，以及投资银行的 iMessage 部署，都符合这个模式。 因此，这个市场不像推倒重来的通信套件替换，更像是合规牵引的叠加层；首个受管控渠道证明价值后，它还能继续扩张。
