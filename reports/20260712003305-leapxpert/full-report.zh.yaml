              DLP、信息屏障、身份验证和政策监控。安全页面强调反恶意软件、CDR 和消息冒名检测。 iMessage 和 Signal 渠道页面还加入 RBAC、SSO、BYOK、静态和传输中加密，以及 SOC 2 Type
