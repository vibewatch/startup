      - number: '1.5'
        title: 反向背景与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据整体偏正面，但没有反向背景，这一章就不完整。第一，公司存在的原因，是监管机构持续惩罚失控的消息行为： SEC 在 2023 和 2024 年仍积极推进非授权渠道通信执法，FINRA 2025
              年附带后果说明也表明记录留存失败仍有监管杀伤力。 这是需求驱动，也意味着 LeapXpert 的价值主张暴露在严苛的合规预期下。第二，平台依赖是真问题。Prometheus 称， 选择 LeapXpert
              之前，其原供应商被 Meta 平台变更打断，这说明消息治理厂商仍部分依赖外部平台政策和 API。第三， LeapXpert 自身披露留下了重大空白。2026
              年轮次没有披露估值、收入、ARR、现金、债务或交易结构。客户和员工数说法方向上有力， 但各来源更新并不均衡。即便创始人名单，在官方材料和数据库之间也不一致。因此，总体结论偏有利但尚未完全落定： LeapXpert
              拿出了品类契合度和投资方支持的有力证据，但公开披露水位仍低于投资者做精确投资测算所需。
