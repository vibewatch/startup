  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 监管顺风和表外沟通痛点，为受治理消息留出持久需求
        - 若执法环境转弱，或渠道治理商品化，紧迫性会下降
      - - LeapXpert 将采集、治理、工作流和智能结合在一起，看起来有差异化
        - 若有证据显示合作伙伴或竞争对手能低成本复制同一套栈，护城河信心会削弱
      - - 具名金融客户案例支撑其在高强度场景中的真实采用
        - 若私下数据表明这些案例不能转化为持久多年 ARR，信心会下降
      - - Riverwood 领投的增长轮融资显示投资方信念较强
        - 若轮次条款对投资人保护异常强，或估值远高于基本面，融资背书的参考价值会下降
      - - AI / 工作流上行可能把平台扩到合规之外
        - 若 AI 模块主要停留在叙事、没有变现，模型中应剔除这部分上行
      - - 公开估值能见度太低，无法给出溢价买入判断
        - 披露 ARR、NRR、集中度和估值，可能显著改变建议
    notes: 核心争议不在 LeapXpert 是否解决真实问题，而在公开信息能否证明隐含价格合理。
