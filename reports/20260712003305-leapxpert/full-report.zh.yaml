      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 轮次估值被证明显著高于公开牛市情景支撑
        - 隐含价格要求的指标明显高于已披露证据
        - 价格跑在证据前面
        - 没有完整数据室验证，不推进
      - - 尽调中留存 / 集中度不及预期
        - NRR 偏弱，或 ARR 集中在少数大客户
        - 平台逻辑变窄且风险上升
