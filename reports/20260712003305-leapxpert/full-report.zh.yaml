  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              看多 LeapXpert 的理由很直接。企业通信已经迁移到监管机构和企业都无法再忽视的渠道，LeapXpert
              正站在这个问题的交汇点。公开证据显示，平台做的不只是归档：它治理重要渠道上的消息传递，把记录路由进既有合规系统，现在还试图借工作流和智能化把会话数据变现。客户证明足够真实，值得重视——Prometheus、Laser
              Digital、Glencore、大型匿名机构和公共部门渠道伙伴，都支持这个问题并非理论假设。反向论点同样清楚。公开估值可见度差，客户耐久性大多未披露，伙伴 / API 依赖仍高，向 AI
              或政府扩张的故事可能仍走在证据前面。换句话说，LeapXpert 看起来是一家可信的平台公司，但公开证据更能说明品类为何存在，却远不能说明投资人该为这项具体资产支付什么价格。
