        blocks:
          - type: paragraph
            body: >-
              最清晰的财务证据是资本形成。LeapXpert 公开披露 2023 年 $22M 轮和 2026 年 Riverwood 领投的 $180M 成长投资； Tracxn、Preqin 等二级数据库支持累计融资约
              $236M。管理层和媒体报道一贯把新资本描述为 AI 能力、高级招聘、地理和行业扩张的增长燃料。 Riverwood
              自身的规模化关注和董事会参与，也强化了公司正被作为品类平台融资，而不是小众工具资产。话虽如此，资本充足性只能推断，无法测量。 没有可获取来源披露当前现金、烧钱速度、现金跑道、债务或自由现金流画像。2026
              年轮次未披露估值和财务条款，也进一步限制精度。 因此，正确结论应带条件：轮次规模和投资方质量显著降低近期融资风险，但不能消除公司如何把资本转化为耐久 ARR 和最终利润率的疑问。
