      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管敞口是结构上最重要的风险，因为 LeapXpert 卖的是监管机构已经重罚的问题。2023 年和 2024 年的 SEC 和解、FINRA 评论，以及 SEC Rule 17a-4 和 FCA SYSC 9
              等规则框架表明，通信记录留存不是可选的最佳实践，而是可执行义务。LeapXpert 向金融以外扩张后，法律风险面进一步扩大：医疗健康消息涉及 HIPAA 安全和短信问题，公共部门使用触发 FOIA /
              记录义务，WeChat 等跨境渠道又增加司法辖区模糊性。上游条款加剧了问题。WhatsApp 商业条款把合规、同意和安全责任放在商业用户身上，Signal 和 WeChat
              则围绕服务可用性、地域和第三方互动保留广泛权利。LeapXpert
              自身的治理、隐私和记录留存材料旨在缓释这些敞口，但无法取消底层规则。因此，风险不只是监管会变得更严；而是监管已经很严，产品和渠道复杂度还在客户脚下持续移动。
