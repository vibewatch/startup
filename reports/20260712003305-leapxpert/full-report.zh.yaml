  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              LeapXpert 的风险堆栈应从外向内看。外层是监管和平台政策：SEC、FINRA、FCA、公共记录、医疗健康和隐私制度规定客户必须做什么，而 Meta、Microsoft、Signal、WeChat 部分决定
              LeapXpert
              技术上能做什么。中层是运营执行：公司必须在不断变化的渠道、设备模式和企业配置中准确捕获、保护、归档并路由通信。内层是商业模式韧性：公司能否把这个复杂交付问题转化为持久留存、多元收入和可复制的公共部门扩张。只要失败击穿核心信任主张，严重性就最高。捕获失败，治理就失败；治理失败，客户就面临罚款、法律敞口或政策违规；如果这发生在公开引用客户中，商业可信度会迅速下滑。因此，本风险评估把监管捕获完整性、合作伙伴
              / API 连续性和安全姿态，排在更普通 SaaS 执行问题之上。
