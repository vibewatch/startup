  - id: TP004
    title: 切换成本与替代方案矩阵
    columns:
      - 因素
      - 为什么带来粘性
      - 为什么仍可被突破
      - 对 LeapXpert 的含义
    rows:
      - - 归档集成
        - 记录必须可靠流入受监督系统
        - 覆盖层供应商无需替换核心归档也能接入
        - 快速集成是替换或共存的关键
      - - 身份和策略映射
        - 用户、角色和隔离边界的重新配置成本高
        - 初始渠道范围窄，可降低迁移负担
        - 先落一个渠道，之后再扩张
      - - 用户培训和入职
        - 前台习惯很难改变
        - 原生或以 Teams 为中心的 UX 可降低摩擦
        - 用户体验质量是真正的竞争优势
      - - 对账和审计证据
        - 控制被证明耐用后，合规团队才会信任供应商
        - 如果证据更强，控制更好的新供应商仍能赢
        - 参考部署很重要
      - - 渠道合作
        - 官方 API 和商业合作伙伴身份提升可靠性
        - 平台方也可能调整政策，抹平差距
        - 合作既是护城河，也是风险
      - - 多供应商并用
        - 公司往往保留不止一家通信控制供应商
        - 预算碎片化给单点进入者留下楔入口
        - LeapXpert 可以先共存，再整合份额
      - - 捆绑压力
        - 既有厂商可能捆绑归档或监控功能
        - 如果 UX 和渠道适配明显更好，专门厂商仍能赢
        - 差异化必须落在运营上，不能只停在叙事
      - - 内部自建
        - 大公司可能自行拼装部分控制技术栈
        - 跨渠道维持同等能力很难
        - 长期看，运营复杂度利好专门供应商
    notes: 切换成本不低，但不保证既有厂商锁定客户；很多买方本来就在运营多供应商合规技术栈。
