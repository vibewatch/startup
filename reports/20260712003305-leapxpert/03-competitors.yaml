- id: TP004
  title: Switching-cost and substitute matrix
  columns:
  - Factor
  - Why it creates stickiness
  - Why it can still be overcome
  - Implication for LeapXpert
  rows:
  - - Archive integrations
    - Records must flow into supervised systems reliably
    - Overlay vendors can connect without replacing the core archive
    - Fast integration is critical to displace or coexist
  - - Identity and policy mapping
    - Users, roles, and barriers are expensive to reconfigure
    - Narrow initial channel scope reduces migration burden
    - Land on one channel, expand later
  - - User training and onboarding
    - Front-office habits are hard to change
    - Native or Teams-centered UX reduces friction
    - User-experience quality is a real competitive edge
  - - Reconciliation and audit evidence
    - Compliance teams trust vendors after controls prove durable
    - A new vendor with better controls can still win if evidence is stronger
    - Reference deployments matter
  - - Channel partnerships
    - Official APIs and business-partner status improve reliability
    - Platform providers can also shift policies and level the field
    - Partnerships are both moat and risk
  - - Multi-homing
    - Firms often keep more than one communications-control vendor
    - Budget fragmentation allows point entrants to wedge in
    - LeapXpert can coexist before it consolidates share
  - - Bundling pressure
    - Incumbents may bundle archive or surveillance features
    - Specialists can win if UX and channel fit are materially better
    - Differentiation must stay operational, not only narrative
  - - Internal build
    - Large firms may assemble partial control stacks themselves
    - Maintaining parity across channels is hard
    - Operational complexity favors specialist vendors over time
  notes: Switching costs are material but do not guarantee incumbent lock-in because many buyers already operate multi-vendor compliance stacks.
