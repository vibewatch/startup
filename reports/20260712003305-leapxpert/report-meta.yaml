companyProfile:
  summary: |
    LeapXpert provides a governed communications platform that lets enterprise employees interact
    with clients across consumer messaging channels while preserving recordkeeping, governance,
    and security controls. Public product evidence shows channel support across WhatsApp,
    iMessage, SMS, Signal, WeChat, Telegram, and collaboration surfaces such as Microsoft Teams,
    plus modules for compliance archiving, DLP and information barriers, messaging security,
    workflow automation, and AI-assisted intelligence through products such as Signals and Maxen.
    Public customer proof is strongest in regulated financial-services and adjacent markets,
    with named references including Prometheus, Laser Digital, and Glencore, alongside broader
    claims of hundreds of organizations relying on the platform.
  foundedDate: "2017-01-01"
  founders:
    - name: "Dima Gutzeit"
      role: "Founder and CEO"
      background: |
        Public 2026 materials consistently identify Dima Gutzeit as LeapXpert’s founder and chief
        executive officer, and place him at the center of the company’s governed-conversation and
        communication-intelligence strategy.
      claimRefs: [CO010]
    - name: "Avi Pardo"
      role: "Co-Founder and Chief Business Officer"
      background: |
        Public 2026 materials identify Avi Pardo as co-founder and chief business officer. He is
        the most visible source for the company’s segment-expansion narrative from financial
        services into government and broader enterprise markets.
      claimRefs: [CO011, CO023]
  foundingLocation: "New York, NY, USA, with Israel operating roots"
  headquarters: "405 Lexington Avenue, New York, NY, USA"
  productSummary: |
    LeapXpert’s platform sits between enterprise employees, consumer messaging channels, and
    downstream compliance or workflow systems. Public evidence supports layered capabilities for
    channel enablement, rich capture and metadata logging, archive export, governance controls,
    messaging security, no-code communication workflows, and AI-assisted intelligence via Signals
    and Maxen. The strategic product direction is to move from pure compliance capture toward a
    governed communication-data platform that also drives productivity and decision support.
  customerFocus: >
    Regulated enterprises, especially financial institutions, plus government/public-sector buyers,
    digital-asset or trading organizations, and broader Global 2000 enterprises with governance,
    recordkeeping, and secure external-communications needs.
  businessModel: >
    Enterprise software model sold through quote-led direct and partner-assisted motions, likely
    combining platform subscription value with onboarding, integration, support, and feature-layer
    expansion across controls, workflows, and intelligence modules.
  stage: "Private growth-stage / Riverwood-backed"
  fundingStatus: >
    Publicly disclosed $22M round in March 2023 and $180M Riverwood-led growth investment in June
    2026; secondary market-data sources support cumulative funding around $236M. Accessible public
    sources do not disclose the 2026 post-money valuation or round structure.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO010, CO011, CO019, CO023, CE006, CE020, CU003, CU010]

