- id: TM004
  title: Evidence-constrained sizing lenses and constraints
  columns:
  - Lens
  - What expands market size
  - What limits conversion
  - Direction of impact
  rows:
  - - Regulatory lens
    - More sectors face recordkeeping and supervision obligations
    - Interpretation and procurement vary by regulator and region
    - Large but compliance-fragmented
  - - Channel lens
    - WhatsApp, iMessage, Signal, WeChat, SMS and others widen the governed surface area
    - Some platforms remain harder to integrate or govern consistently
    - Expands with every adopted channel
  - - Workflow lens
    - Capture can extend into approvals, authentication, and operational automation
    - Buyers may stop at archiving if ROI is not proven
    - Raises ACV when expansion works
  - - Public-sector lens
    - FOIA and public-records needs broaden demand beyond finance
    - Government procurement cycles are slower and certification-heavy
    - Large but slow-moving
  - - Healthcare lens
    - HIPAA and secure mobile communication needs create adjacent demand
    - Security review and integration burden can delay deployment
    - Selective but credible adjacency
  - - Platform-dependency lens
    - Official APIs and business policies can legitimize channels
    - Policy changes by Meta or other platforms can disrupt vendors
    - Creates both demand and risk
  - - Integration lens
    - Archive, surveillance, and identity integrations make overlays attractive
    - Complex stack integration raises deployment cost and sales time
    - Improves retention after adoption
  - - Disclosure lens
    - Growth awards and customer stories imply budget demand
    - No clean free public TAM for LeapXpert’s exact niche is available
    - Sizing remains directional, not precise
  notes: This chapter intentionally uses multiple lenses instead of one headline TAM number because accessible public evidence is richer on demand logic than on free high-quality market-size datasets.
