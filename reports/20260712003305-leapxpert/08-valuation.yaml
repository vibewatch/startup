- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Regulatory tailwinds and off-channel pain create a durable need for governed messaging
    - A weakening enforcement climate or commoditization of channel governance would reduce urgency
  - - LeapXpert appears differentiated by combining capture, governance, workflows, and intelligence
    - Evidence that partners or competitors can replicate the same stack cheaply would weaken moat confidence
  - - Named finance customer proof supports real adoption in hard-use environments
    - If private data shows those proofs do not translate into durable multi-year ARR, conviction falls
  - - Riverwood-led growth financing suggests serious sponsor belief
    - If round terms are unusually investor-protective or valuation is far above fundamentals, sponsorship is less informative
  - - AI / workflow upside could expand the platform beyond compliance
    - If AI modules are mostly narrative and not monetized, upside should be removed from the model
  - - Public valuation visibility is too poor for a premium buy call
    - Disclosure of ARR, NRR, concentration, and valuation could move the recommendation materially
  notes: The core debate is not whether LeapXpert solves a real problem; it is whether public information can justify the implied price.
