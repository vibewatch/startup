- id: scenario-valuation-ranges
  title: Bull, Base, and Bear Scenario Ranges
  body: A scenario approach is more defensible than a point estimate because the key revenue inputs are missing. The scenario logic starts with what must be true for a premium outcome. A bull case requires LeapXpert to already be a sizable ARR business with strong regulated-customer retention, successful expansion from finance into government and broader enterprise, and enough platform credibility for investors to pay a premium multiple for both governance and AI upside. A base case assumes solid but not spectacular scale, respectable retention, and growth that remains primarily compliance-led rather than becoming a true communication-intelligence breakout. A bear case assumes slower growth, concentration risk, and lower multiple support closer to mature compliance-software ranges. Under this framework, a $1B+ valuation is not impossible, but it is not the base case supported by public data. It maps closer to a high-confidence bull scenario or to private metrics that are simply not visible
    today.
  claimRefs:
