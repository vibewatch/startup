- id: recommendation-and-final-diligence-asks
  title: Recommendation, Risk Rating, and Final Diligence Asks
  body: 'The recommendation from public evidence is not “avoid,” but it is also not “buy.” The correct posture is track / research-more with a strong preference for deeper diligence before accepting any implied unicorn valuation. Confidence in the company’s relevance is reasonably high; confidence in the valuation is not. The risk rating stays elevated because the missing inputs are exactly the ones needed to justify a premium entry price: ARR, NRR, customer concentration, margins, and round valuation. If private diligence shows ARR already well into the high tens of millions, strong retention, and diversified expansion beyond a few flagship accounts, the valuation case can move materially. If those metrics are weaker or more concentrated, then public enthusiasm is ahead of fundamentals. In practical investment-committee terms, LeapXpert is a serious candidate for deeper work, but not a public-data-cleared premium-price conviction buy.'
