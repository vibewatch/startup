    - Leading archive / surveillance platform with 24/7/365 support and 850+ data productions monthly
    - Private valuation undisclosed
    - Strategic peer for category maturity and service expectations
    - No public valuation multiple in fetched set
  - - LeapXpert 2026 round
    - $180M growth round; valuation not disclosed publicly
    - Price cannot be verified from accessible public evidence
    - Direct target context
    - Public mark remains the central unresolved input
  notes: This is a partial comparable set selected for public availability and strategic relevance; it does not cover every private DCGA peer or every relevant M&A precedent.
