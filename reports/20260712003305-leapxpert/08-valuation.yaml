- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - ARR likely below ~$40M, growth still finance-heavy, limited expansion proof, lower retention visibility
    - Apply ~4x-6x revenue equivalent to a narrow compliance tool and derive roughly $0.10B-$0.24B value
    - Concentration, API dependency, slower enterprise diversification
    - Meaningful if private metrics disappoint
  - - Base
    - ARR roughly ~$50M-$80M, strong regulated retention, but economics still compliance-led and public-sector upside unproven
    - Apply ~6x-10x revenue equivalent and derive roughly $0.30B-$0.80B value
    - Government execution, multiple compression, AI upside not fully monetized
    - Most defensible from public evidence
  - - Bull
    - ARR roughly ~$90M-$140M, durable expansion from finance into government / broader enterprise, strong retention, workflow / AI monetization
    - Apply ~10x-12x revenue equivalent and derive roughly $0.90B-$1.68B value
    - Requires private metrics and execution quality well above public disclosure
    - Possible, but not yet proven publicly
  notes: Scenario values are estimates built from public comps plus explicit private-metric assumptions; they are not management guidance.
