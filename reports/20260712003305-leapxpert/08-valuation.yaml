- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Round valuation proves materially above public bull-case support
    - Implied price requires metrics meaningfully above disclosed evidence
    - Price outruns available proof
    - Do not proceed without full data-room validation
  - - Retention / concentration disappoints in diligence
    - NRR weak or ARR concentrated in a few large accounts
    - Platform-thesis becomes narrower and riskier
    - Re-rate as niche tool and demand steeper discount
  - - Partner / API disruption
    - Meta or Microsoft changes materially impair capture or workflows
    - Moat becomes a liability and execution costs rise
    - Pause investment view and re-check product resilience
  - - Government expansion stalls
    - No meaningful authorization / conversion progress after strategic emphasis
    - Bull case loses a major growth leg
    - Use base or bear case only
  - - AI / workflow monetization remains narrative-only
    - No pricing uplift or usage proof from Signals / Maxen / workflows
    - Premium-multiple argument weakens
    - Remove upside premium from scenario model
  - - Security / compliance incident at flagship customer
    - Public failure of core control plane
    - Trust thesis breaks quickly
    - Treat as thesis break unless isolated and remediated
  notes: These triggers connect valuation directly to operating proof rather than brand or funding momentum.
  claimRefs:
  - CV033
  - CV034
  - CV036
  - CV037
  - CV038
  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR / revenue run rate
    - Latest ARR, growth rate, and segment mix
    - Core input for any revenue-multiple valuation
    - Management / finance data room
  - - Retention quality
    - NRR, GRR, gross logo churn, cohort behavior
    - Determines whether premium multiple is warranted
    - Management / customer-success analytics
  - - Customer concentration
    - Top-10 customers by ARR and partner-influenced revenue share
    - Changes downside severity materially
    - Management / revops
  - - Gross margin and services load
    - Software versus services mix, implementation burden, support cost
    - Helps distinguish true platform economics from expensive delivery
    - Finance and operations
  - - 2026 round valuation / structure
    - Post-money, primary vs secondary, preferences, liquidation rights
    - Without this, the entry price cannot be underwritten cleanly
    - Board / legal / investor materials
  - - AI / workflow monetization
    - Usage, attach rate, pricing uplift from Signals, Maxen, workflows
    - Determines whether upside merits a growth premium
    - Product and GTM leadership
  notes: These asks are the minimum set required to move from track / research-more to an investable price view.
