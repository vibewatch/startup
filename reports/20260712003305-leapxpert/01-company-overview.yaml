- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance Signals
  body: 'Leadership visibility is strongest around Dima Gutzeit and Avi Pardo, but the public founder record is not perfectly clean. LeapXpert’s 2026 funding releases explicitly identify Dima Gutzeit as founder and CEO and Avi Pardo as co-founder and chief business officer. The about page features both executives prominently. However, Tracxn lists Dima Gutzeit and Rina Charles as founders, and Built In’s 2023 image caption shows Avi Pardo, Dima Gutzeit, and Rina Charles together as co-founders. That conflict does not invalidate the broader leadership story, but it does mean the exact legal or historical founder roster should be confirmed in diligence rather than assumed. Governance visibility improved materially in the 2026 round: Riverwood Capital said managing partner Jeff Parks would join LeapXpert’s board, and Portage publicly framed itself as an existing investor continuing to support the company. This creates a more legible sponsor-backed governance profile than earlier rounds, yet
    public sources still do not disclose ownership percentages, liquidation preferences, debt covenants, or whether any secondary liquidity was embedded in the 2026 transaction. In short, the public record is strong enough to identify operating leadership and sponsor influence, but not strong enough to fully map control dynamics.'
