  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder roster
    missingEvidence: A primary corporate history or cap-table-confirmed founder list clarifying whether Rina Charles is formally a co-founder alongside Dima Gutzeit and Avi Pardo.
    whyItMatters: Founder identity affects attribution, governance history, and key-person assessment in later chapters.
    diligencePath: Request the company’s official incorporation history, founder bios, and cap-table history.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: 2026 valuation
    missingEvidence: An official or independently reported post-money valuation and primary-versus-secondary round split for the June 2026 transaction.
    whyItMatters: Without round pricing, later valuation work must rely on inference rather than a verified market mark.
    diligencePath: Request financing documents, a board consent summary, or investor presentation for the 2026 round.
    relatedQuestionRefs:
    - QO011
    - QO024
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Current ARR, revenue, gross margin, cash, and debt figures as of the 2026 growth round.
    whyItMatters: Capital raised alone cannot establish revenue quality or the sustainability of LeapXpert’s growth narrative.
    diligencePath: Obtain a management financial package and latest board materials.
    relatedQuestionRefs:
    - QO023
    - QO025
  - type: missing-source
    severity: minor
    topic: customer count
    missingEvidence: A precise current customer-count disclosure or production-account count rather than qualitative references to hundreds of organizations.
    whyItMatters: Exact scale affects customer chapter sizing and valuation triangulation.
    diligencePath: Request a current customer overview or sales KPI dashboard.
    relatedQuestionRefs:
    - QO015
