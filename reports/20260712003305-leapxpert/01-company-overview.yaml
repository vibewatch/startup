company:
  name: LeapXpert
chapter:
  number: 1
  title: Company Overview
  summary: LeapXpert is a New York-based governed communications software company founded in 2017 that helps regulated enterprises control customer messaging on channels like WhatsApp, iMessage, Signal, and WeChat. Public evidence supports strong momentum through a $22 million 2023 round, a $180 million Riverwood-led 2026 growth round, Gartner Visionary recognition in 2024 and 2025, and visible traction in finance and government. The public record is still incomplete on the exact cap-table structure, current customer count, present headcount, and even the precise co-founder roster, which keeps this chapter more evidentiary than promotional.
sections:
- id: identity-footprint-and-mission
  title: Identity, Footprint, and Mission
  body: 'LeapXpert’s core identity is unusually clear even though some operating metrics remain private. Official pages and third-party profiles consistently place the business in governed enterprise communications: its platform lets employees communicate with clients on WhatsApp, iMessage, Signal, WeChat, SMS, Teams-adjacent workflows, and similar channels while capturing, governing, and retaining those interactions as enterprise data. The company’s current physical footprint centers on New York, where the about page lists a 405 Lexington Avenue address, while the same page also shows a Tel Aviv office and global sector coverage across financial services, government, pharma, manufacturing, and legal. Built In’s 2023 coverage separately cited a 230 Park Avenue location and a 150-person workforce spread across New York, the U.K., Israel, and Asia, which suggests both office evolution and scaling rather than a static footprint. The product mission has also evolved. Where earlier positioning
    focused on responsible business communication and recordkeeping, the 2026 funding materials increasingly frame LeapXpert as governed communication intelligence: a platform that not only captures conversations but turns them into workflow triggers and AI-usable enterprise context. That framing matters because it broadens the company from a compliance tool toward a data-governance and productivity layer for regulated customer conversations.'
