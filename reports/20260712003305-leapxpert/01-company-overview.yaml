- id: capital-formation-and-scale-signals
  title: Capital Formation and Scale Signals
  body: 'LeapXpert’s financing chronology shows a company that moved from early-stage venture backing into late-stage growth capital without yet disclosing full financials. Built In reported a $22 million 2023 round led by Rockefeller Asset Management’s Technology Ventures Group, with participation from Uncorrelated Ventures and the Partnership Fund for New York City. By June 2026 the company announced a $180 million growth investment led by Riverwood Capital, while Riverwood and Portage described the round as a platform-building step around governed communication intelligence. Tracxn and Preqin both support the broad direction of the funding story, including a June 2026 round and cumulative capital in the roughly $236 million range, though they should be treated as secondary market-data sources rather than canonical financing documents. Importantly, none of the accessible official 2026 materials publicly discloses the post-money valuation, the primary-versus-secondary split, or absolute
    revenue and ARR. That means the public market can confidently underwrite financing momentum and sponsor quality, but not the exact price or economics of the latest round. Recognition signals reinforce the financing story: LeapXpert says it made the Deloitte Technology Fast 500 in both 2024 and 2025 and the Financial Times’ 2026 fastest-growing list, all of which point to commercial momentum even in the absence of audited financial disclosure.'
