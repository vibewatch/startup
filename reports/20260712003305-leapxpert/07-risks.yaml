- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: 'Regulatory exposure is the most structurally important risk because LeapXpert sells into problems that regulators already punish aggressively. SEC settlements in 2023 and 2024, plus FINRA commentary and rule frameworks such as SEC Rule 17a-4 and FCA SYSC 9, show that communications recordkeeping is not an optional best practice; it is an enforceable obligation. As LeapXpert expands beyond finance, the legal surface widens further: healthcare messaging raises HIPAA security and texting issues, public-sector use raises FOIA / records obligations, and cross-border channels such as WeChat create additional jurisdictional ambiguity. Upstream terms intensify the problem. WhatsApp’s business terms place compliance, consent, and security responsibilities on the business user, while Signal and WeChat reserve wide rights around service availability, geography, and third-party interactions. LeapXpert’s own governance, privacy, and recordkeeping materials are designed to mitigate these exposures,
    but they cannot repeal the underlying rules. The risk is therefore not merely that regulation gets tougher; it is that regulation is already tough, while product and channel complexity keep moving underneath the company’s customers.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
