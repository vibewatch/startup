- id: partner-dependency-and-model-risk
  title: Partner, Dependency, and Financial-Model Risk
  body: LeapXpert’s most visible external dependency risk is upstream platform change. Prometheus said its previous provider was disrupted by Meta platform changes before it selected LeapXpert. WhatsApp calling explicitly depends on official Meta APIs; Teams-based workflows depend on Microsoft identity, hosting, and collaboration surfaces; archive and surveillance outcomes depend on third-party systems such as Bloomberg Vault or Behavox. Public-sector expansion similarly depends on Knox, Iron Bow, and certification progress, while geographic growth increases sensitivity to local hosting, consent, and records rules. These dependencies feed directly into model risk. Public sources do not disclose NRR, GRR, logo concentration, or top-account mix, so investors cannot tell whether the revenue base is broad or dependent on a handful of large regulated logos whose channel needs are especially complex. The 2026 funding round reduces short-term financing pressure, but it does not remove exposure
    to margin compression if each new geography, channel, or regulated vertical requires heavy partner management and support.
  claimRefs:
