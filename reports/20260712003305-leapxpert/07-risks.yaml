- id: mitigations-monitors-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: LeapXpert is not a blind-risk story; it has meaningful mitigants. The platform’s control stack is clearly designed around capture fidelity, policy enforcement, and downstream archival evidence. Microsoft and Meta alignment reduce the risk of unsupported workarounds. Fresh growth capital gives the company more room to invest in product, leadership, and government readiness. Yet none of those mitigants fully solve the thesis-break conditions. The investment case weakens sharply if channel/API changes materially disrupt capture, if a serious security or recordkeeping incident hits a flagship regulated account, if FedRAMP/government readiness stalls after being highlighted as a growth path, or if internal metrics later reveal that the customer base is concentrated and less durable than public references imply. The practical diligence posture is therefore to monitor for partner continuity, customer-reference health, government authorization progress, and evidence that AI/workflow expansion
    is strengthening the core platform rather than distracting from it.
  claimRefs:
  - CR034
