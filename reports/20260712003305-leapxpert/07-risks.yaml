- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Platform/API dependency
    - Material Meta or Microsoft policy change disrupts capture or calling
    - Feature outage or forced migration at flagship accounts
    - Pause conviction until remediation and customer impact are clear
  - - Regulatory / recordkeeping failure
    - Named customer, regulator, or court indicates capture or retention failure
    - Any confirmed major compliance miss at a flagship account
    - Treat as thesis break unless root cause is isolated and remediated
  - - Security / trust failure
    - Serious breach, malware escape, or impersonation incident tied to the platform
    - Public incident involving regulated customer data
    - Re-rate risk materially upward; reassess customer durability
  - - Government execution
    - FedRAMP / federal readiness stalls despite repeated strategic emphasis
    - No visible progress on public-sector milestones over 12 months
    - Discount government-expansion upside in the model
  - - Commercial durability
    - Private diligence shows weak NRR or concentrated ARR
    - NRR below target or top-customer concentration materially high
    - Move from growth-platform thesis to narrower niche-tool thesis
  - - AI / product focus
    - Signals / Maxen investment distracts from control-plane reliability
    - Core reliability metrics worsen while AI roadmap expands
    - Penalize management for focus risk and lower premium multiple
  notes: Kill criteria focus on measurable events that would directly weaken the core trust or scaling thesis.
