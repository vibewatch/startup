  topStrengths:
    - 品类紧迫性真实：站外通信、记录留存执法和治理压力，为产品创造了持续需求
    - 产品栈不止归档，覆盖控制、工作流和通信智能
    - 公开客户验证包含受监管金融服务和大宗商品案例，不只是 Logo 营销
    - Riverwood 的 2026 年增长投资和董事会参与提供了有分量的赞助方验证
    - 政府 / 公共部门扩张可能把可触达市场从最初的华尔街切口向外拓宽
    - 与 Microsoft 和 Meta 对齐增强了商业可信度，也降低了不受支持集成的风险
  topRisks:
    - 当前 ARR、留存、毛利率和客户集中度仍未披露，估值精度被削弱
    - 溢价估值逻辑高度依赖私有指标，公开证据无法核验
    - 运营模型仍暴露在上游渠道、API 和平台政策变化之下
    - 政府端上行空间更多出现在伙伴公告里，具名生产级机构案例还不够多
    - 复杂的受监管部署可能带来比 SaaS 标题叙事更重的实施和支持负担
    - 一次严重的捕获、合规或安全失败，就会直接击穿公司的核心信任主张
  unresolvedGaps:
    - 当前 ARR / 收入运行率及分业务增长没有公开
    - NRR、GRR、流失和合同期限数据仍属私有
    - 头部客户集中度和伙伴影响 ARR 没有公开
    - 2026 年精确投后估值、新股与老股组合、优先股堆叠均未披露
    - 公开的正常运行时间、事故历史和实施质量指标有限
    - Signals、Maxen 和工作流产品的货币化深度尚未公开量化
