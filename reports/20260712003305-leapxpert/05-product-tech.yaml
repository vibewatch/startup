- id: module-map-and-architecture
  title: Module Map and Operating Architecture
  body: 'Public evidence shows a modular architecture with recognizable product layers. Channel-enablement pages cover messaging surfaces and professional identity; compliance pages cover capture, retention, and export; governance and security pages cover DLP, barriers, malware, impersonation, and access controls; workflow pages cover in-thread automation; and Maxen / Platform 3.0 cover intelligence and productivity. The technical pattern implied by those pages is a mediated architecture: users communicate through native apps or collaboration shells, LeapXpert captures content plus metadata, governance policies are applied centrally, and records are then routed to archives, surveillance tools, or other enterprise systems through connectors and APIs. The Microsoft Teams materials add another useful clue by naming Entra ID, Teams SSO, Purview DLP, and Azure hosting, suggesting that the platform is designed as an integration-friendly enterprise service rather than a closed vertical application.
    Public materials do not disclose the internal microservice topology, storage architecture, or model stack behind the intelligence features, so the architecture view remains product-facing rather than infrastructure-complete.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
