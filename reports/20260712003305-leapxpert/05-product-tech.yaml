- id: trust-safety-security-privacy-and-compliance
  title: Trust, Safety, Security, Privacy, and Compliance Controls
  body: The trust and control surface is unusually central to LeapXpert’s product story, which is appropriate for its target market. Recordkeeping pages emphasize centralized encrypted logs, policy-based retention, legal holds, and export into existing archive systems. Governance pages emphasize DLP, information barriers, identity verification, and policy monitoring. Security pages emphasize anti-malware, CDR, and messaging-impersonation detection. Channel pages for iMessage and Signal add RBAC, SSO, BYOK, encryption at rest and in transit, and SOC 2 Type 2 / ISO 27001 claims. These features together support the thesis that LeapXpert is selling a governed enterprise surface rather than simply message connectivity. The caution is that several trust claims remain company-asserted without linked audit reports or public certification registries in the fetched set. Likewise, privacy and lawful-use constraints are partly inherited from upstream channels such as WhatsApp, Signal, and WeChat. The
    controls story is therefore strong on product intent and feature breadth, but still requires diligence on certification scope, retention defaults, cross-border data handling, and incident response evidence.
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
