- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - LeapXpert solution
  - Measurable benefit
  - Limitation
  rows:
  - - Client messaging on preferred channel
    - Employee switches between native apps and enterprise tools
    - Teams / Leap Work / native app mediation across consumer channels
    - Less app-switching and higher adoption
    - Benefit mostly company-claimed
  - - Regulatory recordkeeping
    - Uncaptured off-channel messages create audit gaps
    - Capture and export texts, files, metadata, deletions, and voice artifacts
    - Auditability and data ownership
    - Need proof of regulator acceptance by channel
  - - Safe external collaboration
    - Consumer apps bypass enterprise controls
    - Apply DLP, barriers, RBAC, SSO, malware and impersonation protections
    - Lower leakage and fraud exposure
    - Control coverage may vary by channel
  - - Operational follow-through
    - Client intent in chats requires manual re-keying
    - Communication Workflows triggers approvals, authentication, routing, and data capture
    - Faster cycle time, fewer handoffs
    - Public evidence lacks throughput metrics
  - - Front-office prep and follow-up
    - Conversation context spread across channels and tools
    - Maxen summarizes topics, follow-ups, and team insights
    - Higher productivity and better response quality
    - Need validation of model accuracy and hallucination safeguards
  - - Unified chat + voice in Teams
    - Users must leave Teams for WhatsApp calling
    - WhatsApp calling from Teams via official APIs and single professional identity
    - One governed interface across text and voice
    - Currently tied to Meta and Microsoft dependencies
  notes: Benefits are directionally credible but rarely quantified in public sources.
