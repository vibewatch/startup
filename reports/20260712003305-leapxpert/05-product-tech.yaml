- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Consumer-channel connectors
    - Connect employees and clients across WhatsApp, iMessage, Signal, WeChat, SMS and others
    - Channel provider policies / APIs / app behavior
    - Upstream policy changes can alter capability
  - - Employee workspace shells
    - Provide governed employee UX in Teams, Slack, Leap Work, or native apps
    - Microsoft, Slack, device policy, app support
    - User experience depends on partner ecosystem stability
  - - Capture and metadata layer
    - Ingest content, events, participants, timestamps, deleted content, and rich media
    - Accurate capture by channel
    - Capture gaps would undermine compliance value
  - - Governance engine
    - Apply DLP, ethical walls, identity verification, RBAC, retention, alerts
    - Policy mappings and enterprise admin configuration
    - Misconfiguration could create false assurance
  - - Security layer
    - Scan files, sanitize content, detect impersonation
    - Threat intel / malware scanning / AI patterns
    - False negatives or noisy alerts could erode trust
  - - Export and integration layer
    - Feed archives, surveillance, e-discovery, CRM, and enterprise tools
    - APIs, SMTP, FTP/SFTP, XML, partner connectors
    - Integration failures could break audit chains
  - - Workflow / intelligence layer
    - Trigger actions, summarize conversations, extract patterns and next-best actions
    - Model quality and system integrations
    - AI quality and governance details are still thin publicly
  notes: Architecture is inferred from public module boundaries and integration descriptions; internal service topology is undisclosed.
