  topStrengths:
    - >-
      Category urgency is real: off-channel communications, recordkeeping enforcement, and governance pressure create
      durable need for the product
    - The product stack is broader than simple archiving, spanning controls, workflows, and communication intelligence
    - >-
      Public customer proof includes regulated financial-services and commodities references rather than logo-only
      marketing
    - Riverwood’s 2026 growth investment and board participation provide meaningful sponsor validation
    - Government/public-sector expansion could widen the addressable market beyond the original Wall Street wedge
    - Microsoft and Meta alignment strengthen commercial legitimacy and reduce unsupported-integration risk
  topRisks:
    - Current ARR, retention, gross margin, and customer concentration remain undisclosed, weakening valuation precision
    - A premium-price case depends heavily on private metrics that public evidence cannot verify
    - The operating model remains exposed to upstream channel, API, and platform-policy changes
    - Government upside is still more visible in partner announcements than in named production agency references
    - >-
      Complex regulated deployments may carry higher implementation and support burden than headline SaaS narratives
      imply
    - A serious capture, compliance, or security failure would directly undermine the company’s core trust proposition
  unresolvedGaps:
    - Current ARR / revenue run rate and growth by segment are not public
    - NRR, GRR, churn, and contract-duration data remain private
    - Top-customer concentration and partner-influenced ARR are not public
    - The exact 2026 post-money valuation, primary vs secondary mix, and preference stack are undisclosed
    - Public uptime, incident history, and implementation-quality metrics are limited
    - Monetization depth for Signals, Maxen, and workflow products is not yet publicly quantified
