company:
  name: Zerodha
chapter:
  number: 4
  title: Financials
  summary: 'Zerodha''s public financial story is unusual for a private fintech: FY25 still showed ₹8,847 crore of revenue, ₹4,237 crore of profit, EBITDA margin of 63.78%, and ₹22,679 crore of cash despite an industry slowdown. The business model remains activity-led—low list pricing, heavy reliance on trading participation, and monetization through brokerage, fees, software, and interest rather than through high-ACV contracts—but the balance sheet is strong enough that the key risk is earnings compression, not financing stress. The core diligence blockers are disclosure-related: public sources still do not show a clean segment bridge, customer-activity cohorts, or entity-level cash-flow detail.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing logic
  body: Zerodha's revenue model is simple on the surface and more nuanced underneath. Public financial reporting says brokerage income remains the core economic engine, but the company also earns from investment-management fees, software services, and interest income. The common feature across those lines is that they extend rather than replace the broker account. Pricing explains why the model scales the way it does. Equity delivery is free, account opening is free, and most active trading is priced at a low flat fee. That pushes the company toward volume, engagement, and cross-sell rather than toward high upfront monetization. Coin reinforces retention through direct-plan investing; Kite Connect adds a software layer for advanced users and partners; and Zerodha Capital offers secured lending against portfolios. The strategic strength of this architecture is that it can create multiple revenue touchpoints without abandoning the low-cost identity that made the brand. The weakness is that
    realized revenue quality still depends heavily on activity levels and derivatives participation, so the business is not insulated the way a pure subscription company would be.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
