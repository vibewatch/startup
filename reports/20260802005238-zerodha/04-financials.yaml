- id: what-public-sources-still-miss
  title: What public sources still miss
  body: 'Despite the unusually strong top-line profitability, the public record remains incomplete in several underwriting-critical places. We do not have a clean segment bridge showing how much revenue comes from brokerage, software, interest, or any other line. We do not have customer-activity cohorts that translate the active-client narrative into ARPU and retention quality. We do not have product-level gross margins, a detailed cash-flow statement by operating entity, or a precise capex picture. Even promoter economics appear only indirectly, through Entrackr''s summary of remuneration. For a listed company, these would be table stakes. For a private bootstrapped broker, they remain diligence asks. That does not invalidate the positive read; it simply limits precision. The correct financial verdict from public evidence is therefore balanced: Zerodha is clearly profitable, clearly liquid, and clearly not capital-constrained, but some of the inputs required for a fully underwritten valuation
    or downside model still need management access or filing-level evidence.'
  claimRefs:
  - CI016
  - CI027
  - CI029
  - CI035
  - CI036
