  evidenceGaps:
  - type: missing-source
    severity: material
    topic: segment-mix
    missingEvidence: A public audited segment bridge splitting brokerage, software, investment-management fees, interest income, and adjacencies.
    whyItMatters: Revenue quality cannot be fully underwritten without knowing which streams are volatile and which are sticky.
    diligencePath: Request a management segment bridge or filing-level line-item detail.
    relatedQuestionRefs:
    - QI001
    - QI012
    - QI016
  - type: missing-source
    severity: material
    topic: activity-cohorts
    missingEvidence: ARPU, funded-account, and repeat-activity cohorts for Zerodha clients.
    whyItMatters: The economics of a low-fee broker depend on how many users remain active enough to monetize.
    diligencePath: Request monthly active, funded, and repeat-trader cohorts by segment.
    relatedQuestionRefs:
    - QI019
    - QI024
  - type: missing-source
    severity: minor
    topic: cash-flow-and-capex
    missingEvidence: Cash-flow conversion and capex detail by major operating entity.
    whyItMatters: Large profits do not automatically reveal how much cash is consumed by technology, compliance, or expansion investments.
    diligencePath: Request entity-level cash-flow statements and capex schedules.
    relatedQuestionRefs:
    - QI023
  - type: missing-source
    severity: minor
    topic: promoter-economics
    missingEvidence: Detailed compensation notes, related-party transactions, and promoter-liquidity history.
    whyItMatters: Governance-adjusted financial quality depends partly on how profits are distributed and controlled.
    diligencePath: Review MCA filings or management-provided governance schedules.
    relatedQuestionRefs:
    - QI014
