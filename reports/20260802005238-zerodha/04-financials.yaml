callouts:
- calloutType: strength
  title: Liquidity is the clearest financial advantage
  body: Many fintechs can show growth; far fewer can show multi-thousand-crore profits and a balance sheet with more than ₹22,000 crore of cash. Zerodha's liquidity position sharply reduces existential financing risk.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI028
  - CI033
- calloutType: risk
  title: The main risk is earnings compression, not survival
  body: The public record already contains both management warning and market evidence that derivatives regulation and slowing activity can pressure brokerage-led earnings. If the model weakens, it is more likely to do so through slower profits than through a capital shortage.
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI031
  - CI032
  - CI034
  - CI036
