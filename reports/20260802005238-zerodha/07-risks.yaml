- id: dependency-adjacency-and-execution-risk
  title: Dependency, adjacency, and execution risk
  body: Zerodha's next layer of risk comes from the fact that the platform is no longer only a lightweight discount broker. It sits on exchanges and depositories, routes customer money and assets through formal infrastructure, and increasingly expands through partner-led or adjacent products. smallcase and Sensibull improve the user proposition, but they also mean some customer value accrues through workflows Zerodha does not fully control. Zerodha Capital and the fund-house adjacency widen the brand and wallet-share opportunity while increasing coordination, governance, and reputation surface. These are sensible strategic extensions, yet they create a more complex control environment than the original single-product discount-broker story. Public evidence does not suggest acute fragility here; instead it suggests accumulating operational interdependence. If something goes wrong in an adjacent product or in a partner-controlled experience, the customer often perceives it as a Zerodha problem
    anyway. That makes dependency risk less about vendor failure in isolation and more about brand-contagion transmission across the ecosystem.
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR039
  - CR040
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-mitigation-and-thesis-breakers
  title: People, mitigation, and thesis-breakers
  body: 'The people risk around Zerodha is subtle but important. The company is still publicly identified with its founders, and the careers page openly says a small team runs one of India''s largest stockbrokers. That is admirable culturally, but it can become a control-span problem when regulation, support obligations, incident response, and adjacency governance all scale together. The strongest public mitigations are procedural: strong documentation, formal complaint routes, stated security controls, and a culture that presents itself as mission-oriented rather than hyper-growth-at-all-costs. The weakest area is externally verifiable resilience data. We do not get public disclosure on internal audit findings, complaint backlogs, engineering redundancy, incident rates, or succession depth. Therefore the best diligence posture is to treat Zerodha as a company with mature surface-level controls and excellent economics, but with a small set of thesis-break signals that must be watched closely:
    regulatory change that materially lowers monetizable activity, visible repeat reliability failures, and persistent active-client share erosion.'
