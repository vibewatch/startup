- id: operational-reliability-and-trust
  title: Operational reliability and trust
  body: 'For a retail broker, operational risk is inseparable from customer trust because failures occur in public and often at the worst possible time. Zerodha''s own terms and policies explicitly acknowledge interruptions, internet-based trading risk, and order-control discretion. Those disclosures are sensible; they are also reminders that high availability is mission critical. Public trackers like Downdetector and Entireweb, along with issue-focused media pages and the Hindustan Times outage story, show that reliability incidents quickly become visible to the market. Even when the financial cost of a short incident is modest, the reputational cost can be meaningful if users miss the market open or struggle to track complaints. Zerodha does have mitigating structure: Bulletin exists as an official incident/update channel, support offers complaint and ticket flows, and the firm discloses formal grievance paths including SCORES and SMARTODR. Still, the public record does not provide hard
    incident metrics such as frequency, mean time to recovery, or incident-linked churn. That keeps residual confidence moderate rather than high.'
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR016
  - CR017
