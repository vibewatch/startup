chapter:
  number: 7
  title: Risks
  summary: Zerodha's risk profile is dominated by regulatory/model sensitivity and operational trust rather than financing fragility. Public evidence shows mature documentation and investor-protection processes, but also shows direct revenue sensitivity to rule changes, visible outage risk, and unresolved gaps around complaint throughput, incident metrics, and succession depth.
sections:
- id: regulatory-and-model-risk
  title: Regulatory and model risk
  body: 'Zerodha operates inside one of the heaviest regulatory perimeters in Indian consumer finance, and the company''s own documentation makes that hard to miss. Terms, policies, investor-attention material, and the investor charter all frame broking as a tightly supervised service with formal obligations around licensing, order handling, client assets, grievance redressal, and investor education. That is not merely legal boilerplate. Third-party reporting already shows regulation can hit economics directly: BusinessLine reported management expected a major topline hit from regulatory changes, and FY26 active-client data from CNBC-TV18 and BusinessLine shows that the business is highly sensitive to activity intensity in the market. This creates Zerodha''s central model risk. A broker that is extraordinarily profitable in good periods can still face material pressure if investor-protection rules reduce speculative trading or if customer engagement cools faster than fixed operating complexity
    does. The right interpretation is not that Zerodha is non-compliant; public evidence suggests its documented controls are comparatively mature. The risk is that compliance success does not fully offset changes in the rulebook or category mix.'
  claimRefs:
  - CR001
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
