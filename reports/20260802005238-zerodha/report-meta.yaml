companyProfile:
  summary: Zerodha is a Bengaluru-based, late-stage private discount broker founded in 2010 by Nithin and Nikhil Kamath. It built category leadership through low-cost broking and then expanded the account into a broader retail-investing stack spanning Kite, Console, Coin, Kite Connect, Varsity, partner workflows, and adjacent lending and fund products. The company remains fully bootstrapped, reported exceptional FY25 profitability and cash generation on public sources, and carries a fresh $8.2B Hurun 2025 valuation anchor. The public evidence supports a high-quality, strategically important financial platform, but not yet the full disclosure precision investors would normally want at this price.
  foundedDate: '2010-08-15'
  founders:
    - name: Nithin Kamath
      role: Founder and CEO
      background: Former active trader whose market experience shaped Zerodha's customer-first discount-broker model.
      claimRefs: [CO006]
    - name: Nikhil Kamath
      role: Co-founder and CFO
      background: Co-founder and finance leader closely associated with capital allocation and investing strategy.
      claimRefs: [CO007]
  foundingLocation: Bengaluru, India
  headquarters: Bengaluru, India
  productSummary: Zerodha's product stack centers on Kite for trading, Console for reporting and analytics, Coin for direct mutual funds, Kite Connect for APIs, Varsity for education, and partner or adjacent layers such as Sensibull, smallcase, Streak, Zerodha Capital, and Zerodha Fund House.
  customerFocus: Self-directed Indian retail investors and traders, ranging from first-time demat-account users to active derivatives traders and longer-term wealth customers.
  businessModel: Low-fee brokerage and related platform monetization through trading activity, interest and treasury income, software/API services, and adjacent lending or wealth surfaces rather than external VC subsidy.
  stage: late-stage private
  fundingStatus: Fully bootstrapped with no public evidence of external venture funding; the $8.2B Hurun mark is a valuation reference, not a disclosed financing round.
  disclosureProfile: private-disclosed
