subtitle: Premium private broker with elite profits, but valuation discipline still matters
coverageNotes: Public evidence is unusually strong for a private Indian fintech on profitability, cash, product breadth, and market relevance. The main blockers are the absence of a transaction-quality post-2025 price reference, limited filing-grade disclosure versus listed brokers, and missing cohort, segment, and resilience metrics needed for a fully underwritten entry price.
