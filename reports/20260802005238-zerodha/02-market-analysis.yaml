- id: sizing-and-participation
  title: Sizing, participation, and the SAM problem
  body: 'The top-down market-value estimates are healthy: Mordor places India securities brokerage at USD 6.18 billion in 2025 and USD 6.98 billion in 2026, while Research and Markets extends that to USD 13.09 billion by 2031. But those figures are only the start of the diligence problem, not the solution. The more important lens for Zerodha is participation quality. India now has very large headline investor and demat-account counts: over 120 million demat accounts by August 2025 in one market report, and 13.6 crore investors with 21 crore demat accounts in the SEBI chair’s November 2025 comments. Yet FY26 active clients on NSE were only 4.57 crore, and that number actually contracted year-on-year. This means the headline participation story and the monetizable active-trader story are no longer moving in lockstep. Zerodha’s true SAM sits somewhere between the broad demat-account universe and the narrower active-client base: it is the self-directed investor cohort that both funds an account
    and returns often enough to create recurring product value. That distinction is essential to avoid using inflated TAM math for valuation or growth assumptions.'
  claimRefs:
