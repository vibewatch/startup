  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-precision
    missingEvidence: A public estimate of the self-directed active investor cohort segmented by product type and account funding frequency.
    whyItMatters: Zerodha's true SAM is narrower than total demat accounts, and valuation assumptions depend on that narrower definition.
    diligencePath: Request internal cohort segmentation or broker-industry activation data from management or exchange analytics.
    relatedQuestionRefs:
    - QM017
    - QM019
  - type: missing-source
    severity: material
    topic: regional-segmentation
    missingEvidence: Regional and income segmentation of active traders and long-term investors across Indian brokerage apps.
    whyItMatters: Tier-2 and tier-3 growth is visible, but the monetization quality of those cohorts remains opaque.
    diligencePath: Obtain broker or depository data on funded accounts, trading frequency, and geography.
    relatedQuestionRefs:
    - QM022
    - QM024
  - type: missing-source
    severity: minor
    topic: activation-rate
    missingEvidence: A broker-specific active-rate bridge from account openings to funded accounts to repeat monthly actives.
    whyItMatters: Account counts alone do not explain who monetizes well enough to support premium valuation multiples.
    diligencePath: Request cohort-level activation and 90-day retention metrics from management.
    relatedQuestionRefs:
    - QM007
    - QM019
  - type: missing-source
    severity: minor
    topic: substitute-behavior
    missingEvidence: Public evidence on how many affluent or advice-seeking investors multi-home between discount and full-service brokers.
    whyItMatters: Substitute intensity affects pricing power and the durability of discount-led share gains.
    diligencePath: Use channel surveys or broker transfer data to quantify multi-homing.
    relatedQuestionRefs:
    - QM023
