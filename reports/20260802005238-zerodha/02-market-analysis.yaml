callouts:
- calloutType: insight
  title: The gap between demat accounts and active clients is the key market fact
  body: India’s self-directed investing market is undeniably large, but public participation numbers overstate broker revenue opportunity. The real contest is not to open the next account; it is to activate, retain, and cross-sell the account that already exists.
  claimRefs:
  - CM007
  - CM008
  - CM010
  - CM011
  - CM033
  - CM034
- calloutType: risk
  title: FY26 proved that market-growth optics can deteriorate faster than account-growth headlines
  body: The first active-client contraction in three years, combined with regulation-led F&O pressure, shows how quickly category economics can change. A broker that is over-exposed to speculative turnover or expensive acquisition tactics will look weaker even in a market with rising long-term financialization.
  claimRefs:
  - CM010
  - CM011
  - CM024
  - CM025
  - CM026
  - CM036
