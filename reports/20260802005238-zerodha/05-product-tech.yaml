- id: trust-quality-and-product-risks
  title: Trust, quality, and product-tech risks
  body: Public trust and quality signals are strong but indirect. Zerodha publishes an extensive support portal, transparent pricing pages, calculators, and clear documentation for advanced order types. The engineering blog shows unusual willingness to discuss infrastructure choices and scaling philosophy. These are positive signs for a retail-finance platform because they reduce mystery and suggest operational seriousness. Yet the important gaps are equally clear. Public pages do not tell us current uptime, error rates, security architecture, incident frequency by module, or how partner dependencies are governed commercially and technically. Feature breadth is easy to verify; resilience is much harder. This distinction matters because the biggest product risk at Zerodha's scale is no longer “does it have enough features?” It is whether the execution core, data systems, support workflows, and partner surfaces all hold up under peak load and regulatory scrutiny. From public evidence alone,
    the stack looks mature and thoughtfully modular, but its operational envelope is still only partially visible today overall.
  claimRefs:
