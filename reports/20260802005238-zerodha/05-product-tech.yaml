- id: differentiation-and-ecosystem
  title: Differentiation and ecosystem design
  body: 'A large part of Zerodha''s product strength comes from what it does not insist on owning end-to-end. The Zerodha Universe page makes this explicit by pointing users toward partner surfaces such as Sensibull and smallcase. Sensibull adds options-specific intelligence and strategy tooling; smallcase packages baskets and model portfolios without requiring a new broker account; Streak speaks to systematic-trading users; Tickertape and Screener support research workflows; GoldenPi broadens access to fixed income. Rainmatter explains why this design exists. It offers founders funding, mentorship, APIs, and industry networks—an ecosystem approach rather than a pure build-everything-in-house approach. Zerodha Capital and Zerodha Fund House extend the same philosophy into secured lending and passive asset management. The upside of this design is breadth and faster category coverage. The downside is dependency: some of the richest user experiences live in partner layers that can also reduce
    lock-in by working across existing accounts.'
  claimRefs:
