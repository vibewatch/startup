- id: architecture-and-workflow
  title: Architecture and workflow specifics
  body: 'The architecture visible from public material is more concrete than typical fintech marketing copy. Kite advertises fast instrument search, advanced charting, 20-market-depth data, baskets, alerts, and GTT order logic. Console is explicitly positioned as the hub for statements, withdrawals, notes, tax P&L, and analytics. Coin adds direct-plan investing with STP, SWP, conditional orders, and a unified portfolio view. Kite Connect exposes order-management and market-data APIs for advanced users and third-party builders. The engineering blog then adds real operating clues: large self-hosted batch systems, ClickHouse and Vector in the logging pipeline, multi-terabyte PostgreSQL deployments, and hybrid monitoring across datacenter and cloud environments. Put together, these signals suggest a specific architecture: execution, data, reporting, wealth, and developer layers are distinct but tightly coupled. The public record still lacks current service-level metrics, but it does prove that
    the stack is deeper than a generic brokerage frontend.'
  claimRefs:
