  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: Current uptime, latency, and module-level incident metrics for Kite, Console, Coin, and APIs.
    whyItMatters: Feature breadth is less important than peak-load reliability for a broker at Zerodha's scale.
    diligencePath: Request SLO / uptime dashboards or incident summaries by product module.
    relatedQuestionRefs:
    - QE019
    - QE023
  - type: missing-source
    severity: material
    topic: security-architecture
    missingEvidence: A current public description of security architecture, access controls, and privacy operations across first-party and partner modules.
    whyItMatters: Trading and wealth platforms carry direct customer-trust and regulatory risk if security posture is weak or uneven.
    diligencePath: Request security whitepapers, audit summaries, and partner-governance controls.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: minor
    topic: api-usage
    missingEvidence: Public counts of enterprise or partner customers using Kite Connect and their contribution to revenue or stickiness.
    whyItMatters: API depth is strategically interesting, but the business impact is still opaque.
    diligencePath: Request developer-channel metrics and partner-revenue contribution.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: partner-dependency
    missingEvidence: Commercial terms and dependency concentration across partner layers such as Sensibull, smallcase, and other adjacent tools.
    whyItMatters: Breadth built through partners can become a concentration or bargaining-power issue over time.
    diligencePath: Review partnership agreements and usage concentration data.
    relatedQuestionRefs:
    - QE025
