callouts:
- calloutType: strength
  title: The stack is modular enough to expand without losing focus
  body: Kite, Console, Coin, APIs, education, and partner layers each solve different jobs, but they still route through a unified account model. That is a stronger product architecture than a single all-purpose screen pretending to do everything.
  claimRefs:
  - CE001
  - CE002
  - CE006
  - CE007
  - CE012
  - CE018
  - CE032
  - CE035
- calloutType: risk
  title: Ecosystem leverage is also a dependency
  body: The same partner structure that expands options, model portfolios, research, and fixed income can weaken lock-in and create external dependency risk. Public sources do not disclose the technical or commercial terms that govern those relationships.
  claimRefs:
  - CE018
