chapter:
  number: 5
  title: Product & Technology
  summary: Zerodha's product-tech moat is best understood as a modular investing stack rather than as a single trading screen. The first-party core—Kite, Console, Coin, Kite Connect, and Varsity—covers execution, reporting, wealth, APIs, and education, while partner layers such as Sensibull, smallcase, and Streak extend functionality without requiring the company to build every niche workflow in-house. Public engineering and support material suggests a mature, self-hosted, documentation-heavy operating model; the main open risks are current reliability, security posture, and the degree of dependency created by partner surfaces.
sections:
- id: product-definition-and-modules
  title: Product definition and module map
  body: 'Zerodha should be understood as a modular self-directed investing stack, not just a stock-trading app. The core first-party surfaces are explicit on the products page: Kite for execution, Console for reporting and analytics, Coin for direct mutual funds, Kite Connect for APIs, and Varsity for education. The investments page broadens that scope further into stocks, mutual funds, F&O, IPOs, fixed income, and sovereign gold bonds. Each module solves a distinct customer job, but they are designed to sit on top of the same underlying demat-and-trading-account foundation. That is what turns the product surface into an operating model. A new user can open an account, learn via Varsity, trade in Kite, track activity in Console, and expand into mutual funds, lending, or partner tools without leaving the wider stack. This matters strategically because it makes Zerodha look less like a single app and more like an operating system for retail capital-markets participation.'
  claimRefs:
