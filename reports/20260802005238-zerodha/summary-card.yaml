  topStrengths:
    - >-
      Zerodha combines large retail scale with extraordinary public profitability and more than ₹22,000 crore of cash,
      making it unusually resilient for a private fintech.
    - The company remains fully bootstrapped, avoiding obvious financing dependency or late-stage dilution overhang.
    - >-
      Product breadth across trading, reporting, wealth, APIs, education, and adjacencies supports a broader platform
      thesis than a single discount-broker app.
    - >-
      India remains a structurally large brokerage market, preserving long-run strategic relevance even as activity
      cycles fluctuate.
  topRisks:
    - >-
      FY25/FY26 show that economics and customer activity remain sensitive to regulation and trading intensity,
      especially in derivatives-linked behavior.
    - >-
      Public disclosure is still materially thinner than at listed domestic brokerage peers, limiting valuation
      confidence.
    - >-
      Competitive pressure from Groww and other brokers means category leadership should not be treated as permanently
      locked.
    - Visible service incidents or trust shocks could transmit quickly into activity, reputation, and valuation support.
  unresolvedGaps:
    - A transaction-quality post-2025 price reference such as a primary round, secondary transaction, or tender.
    - Segment economics split across brokerage, interest, software/API, lending, and wealth adjacencies.
    - Customer retention and activity cohorts that distinguish total accounts from durable monetizable users.
    - Governance, promoter-economics, and resilience disclosures comparable to listed peers.
