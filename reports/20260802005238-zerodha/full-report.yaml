      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The long-term driver stack is intact. Digital KYC, e-sign, mobile-first onboarding, and rising
              participation from tier-2 and tier-3 cities continue to widen the funnel of Indians who can become
              self-directed investors. Product convergence also helps by making one app sufficient for stocks, mutual
              funds, IPOs, education, and lightweight analytics. But the near-term economics are clearly less favorable
              than the headline demat-account curve suggests. Low pricing is now universal, which improves accessibility
              but limits margin. More importantly, the 2024-2026 derivatives-rule package hit the highest-monetization
              behavior in the category—frequent F&O trading—just as market volatility, weak IPO outcomes, expensive
              valuations, and global macro stress reduced retail risk appetite. The result is a market that can still
              grow structurally while feeling cyclically harder to monetize right now. For Zerodha, that means the
              opportunity remains large, but the next leg depends less on signing up new accounts and more on holding
              activity, deepening product usage, and converting broad participation into durable engagement.
            claimRefs:
