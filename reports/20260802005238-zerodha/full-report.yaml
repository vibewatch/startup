      - number: '2.3'
        title: Buyer segmentation and competitive shape
        blocks:
          - type: paragraph
            body: >-
              The buyer map is relatively simple on paper but nuanced in practice. For first-time investors, the buyer,
              user, and payer are usually the same person, and the main job is low-friction account opening followed by
              an intuitive first investment. For active traders, the decision shifts toward execution quality,
              derivatives support, and product depth. Mutual-fund users care more about direct-plan access and clear
              portfolio reporting than about trading speed. Affluent self-directed households may still prefer app-first
              tools, but they are more likely to keep alternatives such as ICICI Direct or Motilal Oswal in reserve for
              research or trust. This is why the market structure can support both discount brokers and incumbents
              simultaneously. Groww, Upstox, and Zerodha all sell simplified access to the market, yet incumbents retain
              a role because the substitute is not only price—it is confidence and service. The competitive shape in
              FY26 confirms this: Groww took share fastest, while ICICI and Dhan also advanced, suggesting that
              acquisition still matters but retention, trust, and differentiated user fit now matter more than raw
              onboarding volume.
