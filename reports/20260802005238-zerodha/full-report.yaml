        title: Who the customers are
        blocks:
          - type: paragraph
            body: >-
              Zerodha serves a broad self-directed retail base rather than a single archetypal “day trader.” The company
              itself claims more than 1.6 crore clients, but the product surface shows why that headline can contain
              very different behaviors: first-time investors opening a demat account, long-term savers using Coin for
              direct mutual funds, active traders relying on Kite and GTT, options users extending into Sensibull,
              research-oriented users using community and model-portfolio layers, and cross-product customers using
              Console to manage tax and reporting needs. This diversity matters because customer quality depends on
              behavior, not only on total accounts. A direct-plan fund investor, for example, may trade less frequently
              than an F&O user but can still be more durable over time. Likewise, an education-first user in Varsity or
              Trading Q&A may have lower near-term monetization but greater future wallet-share potential. The correct
              read is that Zerodha's base is large and diverse, but the most valuable sub-cohorts are still the ones
