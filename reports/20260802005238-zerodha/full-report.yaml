      - number: '7.4'
        title: People, mitigation, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The people risk around Zerodha is subtle but important. The company is still publicly identified with its
              founders, and the careers page openly says a small team runs one of India's largest stockbrokers. That is
              admirable culturally, but it can become a control-span problem when regulation, support obligations,
              incident response, and adjacency governance all scale together. The strongest public mitigations are
              procedural: strong documentation, formal complaint routes, stated security controls, and a culture that
              presents itself as mission-oriented rather than hyper-growth-at-all-costs. The weakest area is externally
              verifiable resilience data. We do not get public disclosure on internal audit findings, complaint
              backlogs, engineering redundancy, incident rates, or succession depth. Therefore the best diligence
              posture is to treat Zerodha as a company with mature surface-level controls and excellent economics, but
              with a small set of thesis-break signals that must be watched closely: regulatory change that materially
              lowers monetizable activity, visible repeat reliability failures, and persistent active-client share
              erosion.
