  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing logic
        blocks:
          - type: paragraph
            body: >-
              Zerodha's revenue model is simple on the surface and more nuanced underneath. Public financial reporting
              says brokerage income remains the core economic engine, but the company also earns from
              investment-management fees, software services, and interest income. The common feature across those lines
              is that they extend rather than replace the broker account. Pricing explains why the model scales the way
              it does. Equity delivery is free, account opening is free, and most active trading is priced at a low flat
              fee. That pushes the company toward volume, engagement, and cross-sell rather than toward high upfront
              monetization. Coin reinforces retention through direct-plan investing; Kite Connect adds a software layer
              for advanced users and partners; and Zerodha Capital offers secured lending against portfolios. The
              strategic strength of this architecture is that it can create multiple revenue touchpoints without
              abandoning the low-cost identity that made the brand. The weakness is that realized revenue quality still
              depends heavily on activity levels and derivatives participation, so the business is not insulated the way
              a pure subscription company would be.
