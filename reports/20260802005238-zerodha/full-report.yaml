        title: Regulatory and model risk
        blocks:
          - type: paragraph
            body: >-
              Zerodha operates inside one of the heaviest regulatory perimeters in Indian consumer finance, and the
              company's own documentation makes that hard to miss. Terms, policies, investor-attention material, and the
              investor charter all frame broking as a tightly supervised service with formal obligations around
              licensing, order handling, client assets, grievance redressal, and investor education. That is not merely
              legal boilerplate. Third-party reporting already shows regulation can hit economics directly: BusinessLine
              reported management expected a major topline hit from regulatory changes, and FY26 active-client data from
              CNBC-TV18 and BusinessLine shows that the business is highly sensitive to activity intensity in the
              market. This creates Zerodha's central model risk. A broker that is extraordinarily profitable in good
              periods can still face material pressure if investor-protection rules reduce speculative trading or if
              customer engagement cools faster than fixed operating complexity does. The right interpretation is not
              that Zerodha is non-compliant; public evidence suggests its documented controls are comparatively mature.
              The risk is that compliance success does not fully offset changes in the rulebook or category mix.
            claimRefs:
