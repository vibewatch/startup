chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Zerodha is the archetype of India's discount-brokerage wave: a Bengaluru-based, bootstrapped broker that
              built its position by taking cost out of retail investing while wrapping the brokerage account in a
              broader product surface. The company says it launched operations on 15 August 2010, named itself by
              combining zero with the Sanskrit word rodha, and set out to remove the friction traders faced in pricing,
              support, and technology. That origin story matters because the operating model is still recognizable in
              2026. The current product footprint spans Kite for execution, Console for reporting and analytics, Coin
              for direct mutual funds, Kite Connect for developers, Varsity for education, and a wider investments
              surface that now includes IPOs, bonds, sovereign gold bonds, and direct mutual funds. Pricing remains
              central to the identity: equity delivery brokerage is free and most other trades are charged at a low flat
              fee. In effect, Zerodha is not only a broker; it is a low-cost investing platform whose value proposition
              depends on trust, usability, and product breadth rather than on paid distribution or outside venture
              subsidies.
            claimRefs:
              - CO001
              - CO002
              - CO005
