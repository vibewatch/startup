      - number: '4.2'
        title: Public scale and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence shows a company that is still extremely profitable, even after a meaningful
              slowdown. BusinessLine and Inc42 put FY24 revenue from operations around ₹9,372 crore, total income near
              ₹9,994 crore, and net profit near ₹5,496 crore. FY25 then reset expectations lower: Entrackr reported
              ₹8,847 crore of revenue from operations and ₹4,237 crore of net profit. Those are down from FY24, but they
              are still exceptional in absolute terms for a bootstrapped fintech. The cost structure helps explain why.
              FY25 salaries were ₹539 crore, fees and commissions ₹2,328 crore, professional and technical services ₹96
              crore, advertising ₹47 crore, and total costs ₹3,238 crore. Even with those outlays, Entrackr still
              reported EBITDA margin of 63.78% and ROCE of 32%. The clean reading is that Zerodha's economics retain
              very high operating leverage. The cautious reading is that the public record still does not show segment
              margins, realized ARPU, or cohort behavior, so the engine is visible mainly through top-level summaries
              rather than through management-grade detail.
