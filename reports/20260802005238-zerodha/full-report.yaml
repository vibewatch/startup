      - number: '7.3'
        title: Dependency, adjacency, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Zerodha's next layer of risk comes from the fact that the platform is no longer only a lightweight
              discount broker. It sits on exchanges and depositories, routes customer money and assets through formal
              infrastructure, and increasingly expands through partner-led or adjacent products. smallcase and Sensibull
              improve the user proposition, but they also mean some customer value accrues through workflows Zerodha
              does not fully control. Zerodha Capital and the fund-house adjacency widen the brand and wallet-share
              opportunity while increasing coordination, governance, and reputation surface. These are sensible
              strategic extensions, yet they create a more complex control environment than the original single-product
              discount-broker story. Public evidence does not suggest acute fragility here; instead it suggests
              accumulating operational interdependence. If something goes wrong in an adjacent product or in a
              partner-controlled experience, the customer often perceives it as a Zerodha problem anyway. That makes
              dependency risk less about vendor failure in isolation and more about brand-contagion transmission across
              the ecosystem.
