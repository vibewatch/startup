      - number: '1.2'
        title: Founders, leadership, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Founder concentration is a feature, not a footnote, in the Zerodha story. Nithin Kamath remains the chief
              executive and public voice of the business, with Nikhil Kamath identified as co-founder and chief
              financial officer. Nithin's own biographical writing ties the business to his years as an active trader,
              his setback-filled early career, and the pre-Zerodha advisory and franchise work that informed the
              company's customer-first trading focus. Public company material also names a small but visible senior
              bench: CTO Kailash Nadh, COO Venu Madhav, Chief of Education Karthik Rangappa, director Seema Patil, and
              strategy director Austin Prakesh. This supports the view that the company is institutionally deeper than a
              two-founder shop, but the dependence on the Kamath brothers remains material because they still dominate
              strategy, reputation, and capital-allocation signaling. Governance transparency is adequate for a private
              company but still incomplete for institutional underwriting: the About page exposes public roles, and
              Nithin's regulatory committee memberships suggest system relevance, yet board composition, promoter
              ownership split, and internal governance architecture are not presented with public-company depth.
