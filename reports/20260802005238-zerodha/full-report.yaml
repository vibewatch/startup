      - number: '8.2'
        title: Why the business earns a premium
        blocks:
          - type: paragraph
            body: >-
              Zerodha's operating quality is unusually strong for a private fintech. Entrackr reported FY25 revenue of
              ₹8,847 crore, net profit of ₹4,237 crore, and cash of ₹22,679 crore. BusinessLine and Inc42 show FY24 was
              even stronger on revenue and profit. Those numbers matter because they separate Zerodha from the typical
              startup that still needs capital to prove its economics. In addition, the Indian brokerage market remains
              structurally large according to market-research sources, and the broader investor pool continues to
              expand. This combination—category relevance, meaningful scale, very high profitability, and bootstrapped
              ownership—supports a premium relative to weaker or less proven fintech names. The optionality case also
              matters. Console, partner-led workflows, the fund-house adjacency, and broader wealth surfaces imply that
              Zerodha is not only a flat-fee execution app. It is increasingly a financial platform. That deserves
              valuation credit, even if the exact size of that credit should remain conservative until segment economics
              are disclosed.
