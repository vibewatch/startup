  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              For Zerodha, the relevant market is not “all financial services” and not even “all investing.” It is the
              Indian self-directed investing stack: digital account opening, brokerage execution, mutual-fund access,
              portfolio tracking, learning, and in some cases lightweight lending or API-enabled workflows. That
              boundary matters because the included spend is relatively narrow compared with banking or advisory-led
              wealth management. Broker platforms monetize through execution, float, direct-plan distribution adjacency,
              premium tools, or adjacent services; they do not automatically capture the economics of full-service
              advice, deposits, or discretionary wealth mandates. The substitute set therefore spans more than direct
              digital peers. Bank-owned brokers and research-heavy incumbents still solve the same job for users who
              trade less frequently but value trust and support. At the other end, low-cost app-native competitors
              compress pricing and make simple onboarding a baseline expectation. In practice, Zerodha competes for the
              wallet and activity of users willing to invest without a branch relationship. That is why market
              definition has to include the status quo of no-investing, branch-led investing, and low-usage demat
              accounts, not only rival apps.
            claimRefs:
              - CM001
              - CM002
              - CM003
