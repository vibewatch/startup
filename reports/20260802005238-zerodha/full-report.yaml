  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Zerodha's competitive set is broader than the shorthand “other discount brokers.” The most direct
              app-native peers are Groww and Upstox, each of which sells low-friction access to stocks, mutual funds,
              and a widening retail-investing workflow. Angel One sits close to that set on product breadth, but its
              listed-company status and wider regulated-product surface give it a different trust and disclosure
              profile. Then there are the substitutes: ICICI Direct and Motilal Oswal for users who value research,
              advice, or branch-linked confidence; Dhan for active traders seeking a more specialist experience; and
              workflow-layer platforms such as smallcase that can sit above multiple broker accounts. This matters
              because the job to be done is not “pick the cheapest broker.” It is “get trusted market access in a form
              that fits my behavior.” Some users choose price and simplicity, some choose advice, and some multi-home
              across two or three products. That means Zerodha must defend not only against share loss to a single
              rival, but against a category where the best substitute changes by user segment and market mood.
            claimRefs:
