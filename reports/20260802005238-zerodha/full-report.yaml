      - number: '4.3'
        title: Capital adequacy, resilience, and financial risk
        blocks:
          - type: paragraph
            body: >-
              The balance sheet is the easiest part of the case to underwrite. Entrackr reported ₹22,679 crore of cash
              and bank balances and ₹35,719 crore of current assets at FY25 close. Combined with Zerodha's bootstrapped
              status, that implies very low financing dependency: there is no visible next-round trigger, no clear
              survival issue, and no urgent need to raise outside capital just to keep the platform operating. This is a
              material advantage over venture-backed peers. But capital adequacy is not the same as growth quality.
              Nithin Kamath publicly warned that regulatory changes could cut topline by roughly 30% to 60%, and the
              broader FY26 brokerage slowdown shows that activity-driven revenue can soften quickly. In other words, the
              central financial risk is not liquidity collapse; it is earnings compression. The cash cushion can absorb
              a slowdown, but it cannot eliminate the sensitivity of a low-fee broker to rules, volumes, and trust
              events. That distinction is the key to reading Zerodha correctly: financially safe does not automatically
              mean financially immune.
