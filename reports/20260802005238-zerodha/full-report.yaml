            body: >-
              Zerodha should be understood as a modular self-directed investing stack, not just a stock-trading app. The
              core first-party surfaces are explicit on the products page: Kite for execution, Console for reporting and
              analytics, Coin for direct mutual funds, Kite Connect for APIs, and Varsity for education. The investments
              page broadens that scope further into stocks, mutual funds, F&O, IPOs, fixed income, and sovereign gold
              bonds. Each module solves a distinct customer job, but they are designed to sit on top of the same
              underlying demat-and-trading-account foundation. That is what turns the product surface into an operating
              model. A new user can open an account, learn via Varsity, trade in Kite, track activity in Console, and
              expand into mutual funds, lending, or partner tools without leaving the wider stack. This matters
              strategically because it makes Zerodha look less like a single app and more like an operating system for
