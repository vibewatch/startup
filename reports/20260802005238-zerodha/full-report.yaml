companyProfile:
  summary: >-
    Zerodha is a Bengaluru-based, late-stage private discount broker founded in 2010 by Nithin and Nikhil Kamath. It
    built category leadership through low-cost broking and then expanded the account into a broader retail-investing
    stack spanning Kite, Console, Coin, Kite Connect, Varsity, partner workflows, and adjacent lending and fund
    products. The company remains fully bootstrapped, reported exceptional FY25 profitability and cash generation on
    public sources, and carries a fresh $8.2B Hurun 2025 valuation anchor. The public evidence supports a high-quality,
    strategically important financial platform, but not yet the full disclosure precision investors would normally want
    at this price.
