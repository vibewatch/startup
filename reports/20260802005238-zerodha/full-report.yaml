  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the market is pricing
        blocks:
          - type: paragraph
            body: >-
              The strongest current public valuation anchor is Hurun's Global Unicorn Index 2025, which marks Zerodha at
              $8.2B and ranks it as the top Indian unicorn in that release. Venture Intelligence independently confirms
              the company's unicorn status, and Affluense provides a third external profile reference. This is enough to
              say that Zerodha clearly qualifies as a premium private asset. It is not enough to say the current public
              mark is automatically conservative. The reason is simple: Hurun is an excellent freshness anchor, but it
              is still not the same thing as a disclosed financing round, secondary transaction, or liquid public price.
              Therefore the question is not whether Zerodha deserves a premium label. It is whether the current mark
              leaves enough margin of safety given the evidence that is available. Public data argues for respect, not
              for blind extrapolation.
            claimRefs:
