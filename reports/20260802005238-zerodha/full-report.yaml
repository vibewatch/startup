            title: The gap between demat accounts and active clients is the key market fact
            body: >-
              India’s self-directed investing market is undeniably large, but public participation numbers overstate
              broker revenue opportunity. The real contest is not to open the next account; it is to activate, retain,
              and cross-sell the account that already exists.
