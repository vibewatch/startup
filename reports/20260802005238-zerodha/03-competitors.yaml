- id: share-momentum-and-moats
  title: Share momentum, moats, and contestability
  body: FY26 active-client data is the cleanest competitive signal because it captures actual engagement rather than app installs or brand awareness. Groww gained active-client share to 28.31% while Zerodha, Angel One, and Upstox all lost share, proving that the market is still contestable despite clear scale leaders. But share leadership is not the whole moat story. Zerodha's strongest differentiators appear to be trust, profitability discipline, and product reliability rather than raw user-count momentum. Groww's strongest edge is distribution and acquisition power. Angel One's edge is transparency and public-company credibility. ICICI Direct and Motilal Oswal preserve an incumbent moat in advice and trust for users who do not optimize on price first. The more bearish read for Zerodha is that feature convergence and multi-homing will keep eroding lock-in. The more bullish read is that a slower market rewards quality of earnings and product trust more than blitzscaled account opening. Both
    views can coexist; that is why competitive durability remains strong but not absolute.
