  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-data
    missingEvidence: Public cohort retention, churn, or NRR-like evidence for Groww, Upstox, and Zerodha brokerage activity.
    whyItMatters: Competitive durability is much easier to underwrite with retention evidence than with account totals or app claims.
    diligencePath: Request broker-level active-retention and repeat-usage cohorts or paid-user retention metrics.
    relatedQuestionRefs:
    - QP022
  - type: missing-source
    severity: material
    topic: cac-payback
    missingEvidence: Comparable CAC, payback, or acquisition-efficiency data across leading discount brokers.
    whyItMatters: Share gains can be value-destructive if bought with expensive subsidies or brand spend.
    diligencePath: Request investor materials or management commentary on CAC, referral mix, and payback.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: feature-depth
    missingEvidence: Independent product testing on uptime, execution quality, and feature depth across peers.
    whyItMatters: Public webpages prove availability, not real-world reliability or depth.
    diligencePath: Run hands-on product benchmarking and collect trader feedback.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: multi-homing
    missingEvidence: Survey or transfer data on how many investors actively use more than one broker.
    whyItMatters: True switching-cost strength depends on observed multi-homing, not platform messaging.
    diligencePath: Collect customer survey data or broker-side transfer / dormant-account analytics.
    relatedQuestionRefs:
    - QP025
