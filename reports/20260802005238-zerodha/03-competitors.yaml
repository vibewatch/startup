- id: profiles-and-pricing
  title: Competitor profiles and pricing parity
  body: 'The public evidence shows just how little price alone can differentiate the leading players now. Groww, Upstox, 5paisa, Dhan, and Zerodha all cluster around zero account opening and low per-order brokerage. That means the category has already normalized the discount-broker promise. Groww pushes hardest on mass-retail acquisition and simplicity, pairing 50 million-plus customer claims with a strong mutual-fund and stocks surface. Upstox emphasizes accessibility and affordability for both traders and investors, while also leaning into education and safety messaging. Angel One competes differently: as a listed broker, it can combine scale with investor-relations disclosure and the credibility of a public-market compliance surface. Incumbents like ICICI Direct and Motilal Oswal also refuse to disappear because they are selling a different package—research, advice, a banking relationship, and high-trust support. For Zerodha, the implication is straightforward: winning on fee optics is
    necessary but no longer sufficient. When everyone is cheap, the next customer decision turns on reliability, trust, breadth, and the fit between product and workflow.'
