chapter:
  number: 3
  title: Competitors
  summary: 'Zerodha competes in a crowded Indian brokerage field where list pricing is already commoditized and the decisive differentiators have shifted to trust, product reliability, distribution, and disclosure. Groww currently leads active-client share, Angel One combines scale with listed-company transparency, Upstox remains a large direct peer with safety/trust sensitivities, and incumbents such as ICICI Direct and Motilal Oswal still matter for advice-led users. The resulting read is balanced: Zerodha retains a strong moat in business quality and trust, but switching costs are moderate and multi-homing pressure is real.'
sections:
- id: landscape-and-peer-classes
  title: 'Landscape: direct peers, incumbents, and substitutes'
  body: 'Zerodha''s competitive set is broader than the shorthand “other discount brokers.” The most direct app-native peers are Groww and Upstox, each of which sells low-friction access to stocks, mutual funds, and a widening retail-investing workflow. Angel One sits close to that set on product breadth, but its listed-company status and wider regulated-product surface give it a different trust and disclosure profile. Then there are the substitutes: ICICI Direct and Motilal Oswal for users who value research, advice, or branch-linked confidence; Dhan for active traders seeking a more specialist experience; and workflow-layer platforms such as smallcase that can sit above multiple broker accounts. This matters because the job to be done is not “pick the cheapest broker.” It is “get trusted market access in a form that fits my behavior.” Some users choose price and simplicity, some choose advice, and some multi-home across two or three products. That means Zerodha must defend not only against
    share loss to a single rival, but against a category where the best substitute changes by user segment and market mood.'
