callouts:
- calloutType: strength
  title: Zerodha's moat is quality of business, not biggest client count
  body: The most important contrast in the peer set is that the largest acquisition engine is not automatically the most profitable or the most trusted. Zerodha can remain highly defensible if investors increasingly value earnings quality, product stability, and disciplined operations over raw sign-up momentum.
  claimRefs:
  - CP022
  - CP023
  - CP027
  - CP036
- calloutType: risk
  title: Feature parity and multi-homing are real
  body: When pricing is similar and workflow tools can sit above the broker account, users can mix and match more easily than a classic switching-cost story would suggest. This is the competitive path through which Zerodha could lose activity share without losing brand awareness.
  claimRefs:
  - CP024
  - CP025
  - CP031
  - CP034
