- id: switching-costs-and-displacement-risk
  title: Switching costs, lock-in, and displacement risk
  body: 'True switching costs in Indian retail brokerage appear lower than headline account-opening numbers imply. The strongest evidence is structural rather than behavioral: workflow-layer products such as smallcase do not require a new account and can sit on top of an existing demat relationship, which means some of the highest-value experiences are already decoupled from the underlying broker. That reduces lock-in and raises the probability of multi-homing, especially when list pricing is similar everywhere. At the same time, the category is not fully commoditized because trust shocks, advice needs, and execution depth still matter. Upstox''s scam-warning campaign is useful adverse evidence here: brand trust and user safety are not soft factors in brokerage—they can quickly become competitive liabilities. Likewise, incumbent advice and research can still displace a pure discount broker for affluent or cautious users. Zerodha therefore competes in a market where lock-in is moderate, product-layer
    portability is rising, and displacement pressure comes from several directions at once rather than from one dominant enemy.'
