      - number: '5.3'
        title: 差异化与生态设计
        blocks:
          - type: paragraph
            body: >-
              Zerodha 很大一部分产品强度，来自它不坚持端到端全部自有。Zerodha Universe 页面说得很直白：把用户指向 Sensibull、smallcase 等合作伙伴界面。Sensibull
              增加期权专用智能和策略工具；smallcase 打包篮子和模型组合，不要求另开券商账户；Streak 面向系统化交易用户；Tickertape 和 Screener 支持研究工作流；GoldenPi
              扩大固定收益入口。Rainmatter 解释了这套设计为什么存在。它向创始人提供资金、导师、API 和行业网络——这是生态打法，不是纯粹什么都自己做。Zerodha Capital 和 Zerodha Fund
              House 把同一哲学延伸到担保贷款和被动资产管理。这种设计的上行是宽度和更快品类覆盖；下行是依赖：部分最丰富的用户体验位于合作伙伴层，也可能因为跨既有账户工作而削弱锁定效应。
