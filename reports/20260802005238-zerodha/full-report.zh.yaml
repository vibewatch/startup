      - number: '5.2'
        title: 架构与具体工作流
        blocks:
          - type: paragraph
            body: >-
              公开材料里可见的架构，比典型金融科技营销文案更具体。Kite 宣传快速标的搜索、高级图表、20 档市场深度数据、篮子、提醒和 GTT 订单逻辑。Console 明确定位为报表、提现、交割单、税务 P&L
              和分析中心。Coin 增加了 STP、SWP、条件订单和统一组合视图的直接计划投资。Kite Connect 为高级用户和第三方开发者开放订单管理和市场数据
              API。工程博客再补充真实运营线索：大型自托管批处理系统、日志流水线里的 ClickHouse 和 Vector、多 TB PostgreSQL
              部署，以及横跨数据中心和云环境的混合监控。合在一起，这些信号指向一套具体架构：执行、数据、报告、财富和开发者层彼此区分，又紧密耦合。公开记录仍缺当前服务等级指标，但足以证明这套栈比通用券商前端深。
