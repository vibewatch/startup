            body: >-
              最佳公开采用指标有两种非常不同的口径。Zerodha 的 About 页面给出 1.6+ crore 客户的宽口径声称，作为漏斗顶部和装机基数信号有价值。第三方市场报道再把镜头收窄到活跃用户：FY25 有
              7.26 million NSE 活跃用户、份额 15.8%；经历行业艰难年份后，FY26 份额为
              15.08%。这个区别关键，因为决定券商大部分实际变现的是活跃用户，而不是总注册用户。竞争基准强化了压力。Groww 声称超过 2 crore 活跃投资者，并在 FY26
              提升活跃客户份额，说明即便平台已经很大，大众零售获客战仍在继续。与此同时，更广市场在结构上仍大：SEBI 主席在 2025 年末提到 13.6 crore 投资者和 21 crore demat 账户。对
              Zerodha 来说，客户机会的绝对规模仍大，但近端运营问题已经从「漏斗能有多大？」转为「漏斗里哪些部分真的保持活跃？」
