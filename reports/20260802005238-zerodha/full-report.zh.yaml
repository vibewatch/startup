              客户侧最清楚的风险不是失去某个锚定大客户，而是收入行为集中在对活跃度最敏感的零售队列。FY26
              放缓对头部折扣券商打击最大，说明监管收紧、情绪转弱时，活跃交易者行为会迅速降温。宕机和公开问题是第二个风险，因为券商的客户信任会被实时挑战：Downdetector
              和专题页面报道让事故即时可见。未补齐的尽调缺口同样重要。我们没有公开流失、留存、NRR 式或队列质量指标。我们不知道交易者与长期投资者的精确拆分，也不知道 Zerodha
