      - number: '4.4'
        title: 公开来源仍缺什么
        blocks:
          - type: paragraph
            body: >-
              尽管顶层盈利能力异常强，公开记录在几个影响尽调判断的关键位置仍不完整。我们没有清晰分部桥，无法看到多少收入来自经纪、软件、利息或其他业务线。我们没有客户活跃队列，无法把活跃客户叙事转成 ARPU
              和留存质量。我们没有产品级毛利率、按经营实体拆分的详细现金流量表，也没有精确 capex 图景。即便发起人经济性，也只通过 Entrackr
              的薪酬摘要间接出现。对上市公司来说，这些都是基本项；对私营自筹券商来说，它们仍是尽调要问的问题。这不推翻正面判断，只是限制精度。因此，从公开证据得出的正确财务结论应当平衡：Zerodha
              显然盈利、显然有流动性、显然不受资本约束，但完整估值或下行情景模型所需的一些输入，仍需要管理层访问或监管文件级证据。
