  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 市场正在给什么定价
        blocks:
          - type: paragraph
            body: >-
              当前最强的公开估值锚，是 Hurun 的 Global Unicorn Index 2025：Zerodha 标记为 $8.2B，并在该榜单中位列印度第一大独角兽。Venture Intelligence
              独立确认了公司的独角兽身份，Affluense 又提供了第三个外部画像参考。这足以说明 Zerodha 明确够得上高溢价私人资产；但不足以说明当前公开估值标记自动偏保守。原因很简单：Hurun
              是很好的时效性锚点，却仍然不是一轮披露融资、一次老股交易，也不是流动性公开价格。因此，问题不在于 Zerodha
              是否配得上溢价标签，而在于在现有证据下，当前标记是否留下了足够安全边际。公开数据支持尊重这家公司，但不支持盲目外推。
