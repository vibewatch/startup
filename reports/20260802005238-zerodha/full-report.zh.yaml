      - number: '1.2'
        title: 创始人、领导层与治理姿态
        blocks:
          - type: paragraph
            body: >-
              创始人集中度是 Zerodha 故事的主线，不是脚注。Nithin Kamath 仍是 CEO 和业务的公开代言人，Nikhil Kamath 则是联合创始人兼 CFO。Nithin
              的个人传记写作把公司与他多年活跃交易经历、早期职业挫折，以及 Zerodha 之前的咨询和特许经营工作连在一起；这些经历共同塑造了公司以客户为先的交易焦点。公开公司材料还列出一个规模不大但可见的高管层：CTO
              Kailash Nadh、COO Venu Madhav、教育负责人 Karthik Rangappa、董事 Seema Patil 和战略董事 Austin
              Prakesh。这支持一个判断：公司制度深度高于「两位创始人的小店」。但对 Kamath
              兄弟的依赖仍然重要，因为他们仍主导战略、声誉和资本配置的信号。作为私营公司，治理透明度尚可，但离机构级尽调要求仍有缺口：About 页面披露公开角色，Nithin
              的监管委员会成员身份也显示系统重要性；不过董事会构成、发起人持股拆分和内部治理架构，还没有上市公司级别的深度。
