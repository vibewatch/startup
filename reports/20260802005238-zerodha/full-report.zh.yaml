      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              长期驱动栈仍在。数字 KYC、e-sign、移动优先开户，以及二三线城市参与度上升，持续放大印度人转化为自助型投资者的漏斗。产品融合也有帮助：一个 app
              就能覆盖股票、共同基金、IPO、教育和轻量分析。但近端经济性明显不如 demat 账户曲线看上去那么好。低定价已经普及，提升了可及性，也压住了利润率。更重要的是，2024-2026
              年衍生品规则包正好打击了品类里变现最高的行为——高频 F&O 交易；与此同时，市场波动、IPO 表现疲弱、估值昂贵和全球宏观压力削弱了零售风险偏好。结果是，市场仍能结构性增长，但眼下变现的周期阻力更大。对
              Zerodha 来说，机会仍大；下一段增长不再主要靠新开户，而要靠守住活跃度、加深产品使用，并把广泛参与转成持久互动。
