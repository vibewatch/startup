companyProfile:
  summary: >-
    Zerodha 是总部位于 Bengaluru 的后期私营折扣券商，2010 年由 Nithin 和 Nikhil Kamath 创立。它靠低成本经纪服务建立品类领导地位，随后把证券账户扩展成更宽的零售投资栈，覆盖
    Kite、Console、Coin、Kite Connect、Varsity、合作伙伴工作流，以及相邻贷款和基金产品。公司至今完全自筹发展，公开来源显示 FY25 盈利和现金生成极强，并有最新的 Hurun 2025 估值锚点
    $8.2B。公开证据支撑一个质量高、战略重要的金融平台，但在这个价格上，投资者通常需要的披露精度仍未补齐。
