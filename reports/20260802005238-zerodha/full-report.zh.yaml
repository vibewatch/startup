      - number: '4.3'
        title: 资本充足性、韧性与财务风险
        blocks:
          - type: paragraph
            body: >-
              资产负债表是这个案例最容易支撑尽调判断的部分。Entrackr 报道 FY25 期末现金和银行存款 ₹22,679 crore，流动资产 ₹35,719 crore。叠加 Zerodha
              自筹发展状态，这意味着融资依赖很低：没有可见的下一轮触发点，没有明确生存问题，也没有为了维持平台运转而急需外部资本。这相对风投支持同业是实质优势。但资本充足不等于增长质量。Nithin Kamath
              公开警告，监管变化可能让收入减少约 30% 到 60%；更广泛的 FY26
              券商放缓也说明，活动驱动型收入会很快走弱。换句话说，核心财务风险不是流动性崩塌，而是盈利压缩。现金垫能吸收放缓，但无法消除低佣金券商对规则、交易量和信任事件的敏感性。读懂 Zerodha
              的关键就在这个区别：财务安全，不自动等于财务免疫。
