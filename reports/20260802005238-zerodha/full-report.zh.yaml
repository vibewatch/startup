chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zerodha 是印度折扣券商浪潮的典型样本：一家总部在 Bengaluru、完全自筹发展的券商，靠降低零售投资成本站稳位置，再把证券账户包进更宽的产品界面。公司称其于 15 August 2010
              开始运营，名字由 zero 与梵语 rodha 组合而成，目标是拿掉交易者在定价、支持和技术上的摩擦。这个起点重要，因为到 2026 年，经营模式仍能看见同一条线索。当前产品覆盖 Kite 执行、Console
              报告和分析、Coin 直接共同基金、Kite Connect 开发者、Varsity 教育，以及更宽的投资界面，包括
              IPO、债券、主权黄金债券和直接共同基金。定价仍是身份核心：股票交割经纪费免费，多数其他交易收取低额固定费用。换句话说，Zerodha
              不只是券商；它是低成本投资平台，价值主张靠信任、易用性和产品宽度撑住，而不是靠付费分销或外部风投资金补贴。
