      - number: '3.4'
        title: 切换成本、锁定效应与被替代风险
        blocks:
          - type: paragraph
            body: >-
              印度零售券商的真实切换成本似乎低于开户数字暗示。最强证据是结构性的，而不是行为性的：smallcase 等工作流层产品不需要新账户，可以架在既有 demat
              关系之上，这意味着一些最高价值体验已经与底层券商解耦。锁定效应因此下降，多栖使用概率上升，尤其在各家标价相近时。但这个品类还没有完全商品化，因为信任冲击、建议需求和执行深度仍然重要。Upstox
              的防诈骗宣传就是有用的反向证据：在券商行业，品牌信任和用户安全不是软因素，它们会很快变成竞争负债。同样，老牌机构的建议和研究仍能替代纯折扣券商，尤其对富裕或谨慎用户。Zerodha
              因此身处一个锁定效应中等、产品层可携带性上升、替代压力同时来自多个方向的市场，而不是只面对一个主敌。
