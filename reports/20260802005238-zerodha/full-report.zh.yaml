            body: >-
              Zerodha 应被理解为模块化自助型投资栈，而不只是股票交易 app。产品页明确列出核心一方界面：Kite 执行、Console 报告和分析、Coin 直接共同基金、Kite Connect API，以及
              Varsity 教育。投资页进一步把范围扩到股票、共同基金、F&O、IPO、固定收益和主权黄金债券。每个模块解决不同客户任务，但都架在同一套底层 demat
              和交易账户基础之上。这把产品界面变成了经营模型。新用户可以开户，通过 Varsity 学习，在 Kite 交易，在 Console
              追踪活动，并在不离开更大栈的情况下扩展到共同基金、贷款或合作伙伴工具。这个点有战略意义，因为 Zerodha 看起来不再像单一 app，而更像零售资本市场参与的操作系统。
