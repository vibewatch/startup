      - number: '7.3'
        title: 依赖、相邻业务与执行风险
        blocks:
          - type: paragraph
            body: >-
              Zerodha 下一层风险来自这样一个事实：平台已不再只是轻量折扣券商。它架在交易所和存管机构之上，通过正式基础设施路由客户资金和资产，并越来越多借助合作伙伴或相邻产品扩张。smallcase 和
              Sensibull 提升用户主张，但也意味着部分客户价值通过 Zerodha 无法完全控制的工作流累积。Zerodha Capital
              和基金公司相邻业务扩大了品牌和钱包份额机会，同时增加协调、治理和声誉界面。这些战略延伸合理，却也创造了比最初单一产品折扣券商故事更复杂的控制环境。公开证据不显示这里存在急性脆弱；它更像是在积累运营相互依赖。一旦相邻产品或合作伙伴控制的体验出问题，客户往往仍会把它感知为
              Zerodha 的问题。因此依赖风险不是孤立的供应商故障，而是整个生态里的品牌传染。
