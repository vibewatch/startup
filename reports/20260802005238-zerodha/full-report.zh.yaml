  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、老牌机构与替代品
        blocks:
          - type: paragraph
            body: >-
              Zerodha 的竞争集合比「其他折扣券商」这个简写更宽。最直接的原生 app 同业是 Groww 和 Upstox，二者都销售低摩擦的股票、共同基金入口，并把零售投资工作流越做越宽。Angel One
              在产品宽度上接近这一组，但它是上市公司，监管产品面更宽，因此信任和披露画像不同。然后是替代品：ICICI Direct 和 Motilal Oswal 面向重视研究、建议或银行关联信心的用户；Dhan
              面向想要更专业体验的活跃交易者；smallcase
              等工作流层平台则可以架在多个券商账户之上。这个点重要，因为用户要完成的任务不是「选最便宜的券商」，而是「以符合我行为方式的形式，获得可信的市场入口」。有些用户选价格和简单，有些选建议，有些会同时使用两三个产品。因此
              Zerodha 不仅要防止份额流向某一个对手，还要面对一个按用户分层和市场情绪不断更换最佳替代品的品类。
