      - number: '7.4'
        title: 人员、缓释因素与投资逻辑破坏信号
        blocks:
          - type: paragraph
            body: >-
              围绕 Zerodha
              的人员风险微妙但重要。公司在公众认知中仍与创始人强绑定，招聘页面也直说，一个小团队运营着印度最大股票券商之一。这在文化上值得认可，但当监管、支持义务、事故响应和相邻业务治理一起放大时，就可能变成控制跨度问题。最强公开缓释因素是流程性的：文档强、正式投诉路径、已陈述的安全控制，以及一种把自己呈现为使命导向而不是不惜一切高速增长的文化。最弱环节是外部可验证的韧性数据。我们看不到内部审计发现、投诉积压、工程冗余、事故率或继任深度的公开披露。因此，最好的尽调姿态是把
              Zerodha 视为一家表层控制成熟、经济性优秀的公司，但同时紧盯少数会打破投资逻辑的信号：监管变化实质性压低可变现活跃度、可见的重复可靠性失败，以及活跃客户份额持续侵蚀。
