              对零售券商而言，运营风险和客户信任不可分割，因为故障公开发生，而且常常发生在最糟糕的时间。Zerodha
              自己的条款和政策明确承认中断、互联网交易风险和订单控制裁量权。这些披露合理；它们也提醒我们，高可用性是任务关键。Downdetector、Entireweb 等公开追踪器，连同聚焦故障的媒体页面和
              Hindustan Times 宕机报道，显示可靠性事故很快会被市场看见。即便短事故的财务成本不大，如果用户错过开盘或难以跟踪投诉，声誉成本也可能有意义。Zerodha 有缓释结构：Bulletin 是官方事故
              / 更新渠道，支持体系提供投诉和工单流程，公司还披露包括 SCORES 和 SMARTODR
              在内的正式申诉路径。尽管如此，公开记录没有给出事故频率、平均恢复时间或事故关联流失等硬指标。剩余信心因此是中等，而不是高。
