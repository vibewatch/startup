      - number: '3.3'
        title: 份额动能、护城河与可争夺性
        blocks:
          - type: paragraph
            body: >-
              FY26 活跃客户数据是最干净的竞争信号，因为它抓的是实际互动，而不是 app 安装或品牌认知。Groww 活跃客户份额升至 28.31%，Zerodha、Angel One 和 Upstox
              全部丢份额，证明即便已经有清晰规模龙头，市场仍可争夺。但份额领先不是护城河的全部。Zerodha 最强的差异化似乎是信任、盈利纪律和产品可靠性，而不是原始用户数动能。Groww
              最强边际是分销和获客能力。Angel One 的边际是透明度和上市公司可信度。ICICI Direct 和 Motilal Oswal 在建议和信任上保留老牌护城河，服务那些不把低价放在第一位的用户。对
              Zerodha 更悲观的解读是，功能趋同和多栖使用会持续侵蚀锁定效应。更乐观的解读是，市场放慢后会更奖励利润质量和产品信任，而不是闪电扩张式开户。两种观点可以同时成立；因此竞争耐久性仍强，但不是绝对。
