      - number: '1.3'
        title: 规模、盈利能力与估值锚点
        blocks:
          - type: paragraph
            body: >-
              Zerodha 区别于许多金融科技同业的，不只是规模，而是带留存利润和资产负债表强度的规模。第三方对 FY24 的报道显示，营业收入为 ₹9,372 crore，总收入 ₹9,994 crore，净利润约
              ₹5,496 crore。到 FY25，业务明显放缓但没有崩塌：Entrackr 报道营业收入 ₹8,847 crore、净利润 ₹4,237 crore，现金和银行存款仍高达 ₹22,679
              crore。这组数据说明，公司可以消化周期性或监管冲击，不必依赖紧急融资。客户指标需要拆开看。公司自己声称拥有 1.6+ crore 客户、印度零售交易量超过 15%；而 FY25/FY26
              市场报道按活跃客户口径，把 Zerodha 定在 7.26 million 活跃用户、NSE 活跃客户份额 15.08%-15.8%。两者可以同时成立：前者是宽口径客户基数，后者是更严格的活跃客户视角。Hurun
              的 Global Unicorn Index 2025 则提供了 August 2024 之后最强的新估值证据，把 Zerodha 估值列为 US$8.2 billion，并置于印度独角兽排名首位。
