      - number: '4.2'
        title: 公开规模与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              最强公开证据显示，即便经历明显放缓，公司仍极其赚钱。BusinessLine 和 Inc42 估计 FY24 营业收入约 ₹9,372 crore，总收入接近 ₹9,994 crore，净利润接近 ₹5,496
              crore。FY25 随后下调预期：Entrackr 报道营业收入 ₹8,847 crore，净利润 ₹4,237 crore。这些数字低于
              FY24，但以一家自筹发展的金融科技公司绝对值看仍然出众。成本结构解释了原因。FY25 薪酬为 ₹539 crore，费用和佣金 ₹2,328 crore，专业与技术服务 ₹96 crore，广告 ₹47
              crore，总成本 ₹3,238 crore。即便有这些支出，Entrackr 仍报道 EBITDA 利润率 63.78%、ROCE 32%。直接解读是，Zerodha
              的经济模型仍保留很高经营杠杆。谨慎解读是，公开记录仍没有披露分部利润率、实际 ARPU 或队列行为，因此引擎主要通过顶层摘要可见，而不是通过管理层级明细可见。
