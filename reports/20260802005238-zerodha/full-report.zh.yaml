            title: FY26 证明，市场增长观感可能比账户增长标题恶化得更快
            body: 三年来首次活跃客户收缩，加上监管推动的 F&O 压力，显示品类经济性变化可以很快。过度暴露于投机周转或昂贵获客打法的券商，即便身处长期金融化上升的市场，也会显得更弱。
