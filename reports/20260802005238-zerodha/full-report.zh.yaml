      - number: '8.3'
        title: 为什么溢价仍应封顶
        blocks:
          - type: paragraph
            body: >-
              热情需要封顶，原因有三。第一，FY25 较 FY24 回落，说明业务很强，但并非不受周期或监管压力影响。第二，FY26 活跃客户份额走弱，Groww
              等竞争对手继续抢份额。第三，披露质量仍明显低于本土上市券商同行。Angel One 的年报中心提醒我们，公开市场投资者通常会期待文件级的风险、分部和治理细节。Zerodha
              公开层面没有提供这种深度。这并不让公司失去吸引力；它只是让公开估值标记更难支撑投资底稿。如果买方按当前 Hurun
              锚点附近入场，本质是在为一家非常好的公司加上一串未解决的尽调缺口付费。这个交易仍可能成立，但前提是入场纪律守得住，且投资人有可信路径补上这些缺口。
