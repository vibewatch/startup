      - number: '1.4'
        title: 生态、里程碑与反向背景
        blocks:
          - type: paragraph
            body: >-
              Zerodha 的战略触达已经远超证券账户。Rainmatter 给创始人在金融科技、气候、健康和媒体上提供生态抓手；Kite Connect 打开开发者渠道；Sensibull、smallcase
              等合作伙伴界面扩展用户体验，无需 Zerodha 原生搭建每条工作流；Zerodha Capital、Zerodha Fund House
              等品牌相邻业务，则显示公司正有控制地进入贷款和被动资产管理。里程碑因此是双面的。积极一面，公司搭出 Varsity 教育引擎，在没有外部 VC
              融资的情况下达到十亿美元级收入规模，并持续产生高利润和现金。消极一面，公开事件日志显示，交易所连接、数据源、入金通道和第三方基础设施反复成为运营依赖。December 2025 与 Cloudflare
              相关的问题提醒我们，券商的声誉风险并不抽象：即便市场时段的短暂事故，也会直接影响信任和活跃使用。第二条反向线索来自监管。Nithin Kamath 公开警告，衍生品和交易所规则变化可能实质性压低收入，凸显
              Zerodha 的盈利能力仍高度绑定它无法控制的市场结构决策。
