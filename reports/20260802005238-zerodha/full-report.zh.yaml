            body: >-
              公开信任和质量信号强，但偏间接。Zerodha
              发布了完整支持门户、透明定价页面、计算器，以及高级订单类型的清晰文档。工程博客愿意讨论基础设施选择和扩展哲学，这在业内并不常见。对零售金融平台来说，这些都是正面信号，因为它们降低黑箱感，也显示经营认真度。但关键缺口同样清楚。公开页面没有告诉我们当前可用性、错误率、安全架构、按模块拆分的事故频率，或合作伙伴依赖在商业和技术上如何治理。功能宽度容易验证；韧性难得多。这个区别重要，因为
