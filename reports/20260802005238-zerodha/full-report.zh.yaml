      - number: '2.3'
        title: 买方分层与竞争形态
        blocks:
          - type: paragraph
            body: >-
              买方地图纸面上相对简单，实际更细。首次投资者通常买方、用户和付费方都是同一个人，核心任务是低摩擦开户，然后完成直观的第一笔投资。活跃交易者的决策重心转向执行质量、衍生品支持和产品深度。共同基金用户更在意直接计划入口和清晰组合报告，而不是交易速度。富裕的自助型家庭仍可能偏好
              app 优先工具，但更可能把 ICICI Direct 或 Motilal Oswal 作为研究或信任备选。这就是为什么市场结构可以同时容纳折扣券商和老牌机构。Groww、Upstox 和 Zerodha
              都在销售简化的市场入口，但老牌机构仍有角色，因为替代因素不只是价格，而是信心和服务。FY26 的竞争形态确认了这一点：Groww 拿份额最快，ICICI 和 Dhan
              也在推进，说明获客仍重要，但留存、信任和差异化用户匹配已经比粗放开户量更重要。
