      - number: '3.2'
        title: 竞品画像与定价趋同
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，只靠价格已经很难区分头部玩家。Groww、Upstox、5paisa、Dhan 和 Zerodha 都集中在零开户费、低单笔佣金附近。这意味着品类已经把折扣券商承诺标准化。Groww
              最用力推大众零售获客和简单性，一边声称客户超过 50 million，一边拥有强势共同基金和股票界面。Upstox 强调交易者和投资者都能用得起、用得上，同时也加码教育和安全叙事。Angel One
              的打法不同：作为上市券商，它能把规模、投资者关系披露和公开市场合规界面的可信度结合起来。ICICI Direct、Motilal Oswal
              等老牌机构也不会消失，因为它们卖的是另一套组合——研究、建议、银行关系和高信任度支持。对 Zerodha
              的含义很直接：费用观感必须赢，但已经不够。当人人都便宜，下一个客户决策就转向可靠性、信任、宽度，以及产品与工作流的匹配。
