      - number: '8.4'
        title: 建议与最终尽调
        blocks:
          - type: paragraph
            body: >-
              只看公开信息，最干净的建议是积极跟踪，或只在当前 $8.2B 锚点及以下选择性推进，而不是把 Zerodha
              当成显而易见的便宜货。这是一个看好公司质量、同时强调估值纪律的判断。悲观情景并不关乎偿付能力、稀释恐慌或融资压力；真正的问题是，市场最终可能认为，一个对交易活跃度敏感、暴露在监管下的券商，不该拿到无瑕平台叙事所暗示的高溢价。乐观情景仍然可信，但需要新的证据来证明活跃份额动能、生态变现和披露质量。因此，最终尽调应聚焦分部经济性、队列、事故和投诉指标、发起人经济性，以及
              Hurun 2025
              之后任何具备真实交易质量的价格参考。如果这些检查结果强，当前标记可能显得合理；如果不强，缺少安全边际就会成为核心问题。因此，纪律型投资人在从欣赏走向确信前，应要求更好的证据、更好的价格，或两者兼有。对于披露稀薄的私人资产，这种纪律就是最清晰的优势。
