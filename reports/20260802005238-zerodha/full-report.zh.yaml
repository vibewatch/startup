  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价逻辑
        blocks:
          - type: paragraph
            body: >-
              Zerodha
              的收入模型表面简单，底层更细。公开财务报道显示，经纪收入仍是核心经济引擎，但收入还来自投资管理费、软件服务和利息收入。这几条线的共同点是延展证券账户，而不是替代证券账户。定价解释了模型为何这样放大。股票交割免费，开户免费，大多数活跃交易按低额固定费用收费。这把公司推向交易量、互动和交叉销售，而不是高额前置变现。Coin
              借直接计划投资强化留存；Kite Connect 为高级用户和合作伙伴增加软件层；Zerodha Capital
              提供以组合为抵押的担保贷款。这套架构的战略强点，是不放弃成就品牌的低成本身份，也能创造多处收入触点。弱点是，实际收入质量仍高度依赖活跃度和衍生品参与，因此不像纯订阅公司那样隔离风险。
