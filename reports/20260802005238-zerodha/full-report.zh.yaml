  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与模型风险
        blocks:
          - type: paragraph
            body: >-
              Zerodha
              位于印度消费金融最重的监管边界之一，公司自己的文档也让这一点很难被忽略。条款、政策、投资者提示材料和投资者章程，都把经纪业务界定为受严密监管的服务，围绕牌照、订单处理、客户资产、投诉救济和投资者教育有正式义务。这不只是法律样板。第三方报道已经显示，监管可以直接打到经济性：BusinessLine
              报道管理层预期监管变化会重击收入；CNBC-TV18 和 BusinessLine 的 FY26 活跃客户数据也显示，业务对市场活跃强度高度敏感。这构成 Zerodha
              的核心模型风险。一个在好时期极其赚钱的券商，如果投资者保护规则压低投机交易，或客户互动降温速度快于固定运营复杂度，仍可能承受实质压力。正确解读不是 Zerodha
              不合规；公开证据显示其文档化控制相对成熟。风险在于，即便合规做得好，也不能完全抵消规则书或品类组合变化。
