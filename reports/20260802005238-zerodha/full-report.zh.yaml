      - number: '2.2'
        title: 规模、参与度与 SAM 问题
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场规模估计健康：Mordor 认为印度证券经纪市场 2025 年为 USD 6.18 billion、2026 年为 USD 6.98 billion，Research and Markets 则把
              2031 年推到 USD 13.09 billion。但这些数字只是尽调问题的起点，不是答案。对 Zerodha 更重要的镜头是参与质量。印度投资者和 demat 账户的标题数字已经很大：一份市场报告称
              August 2025 demat 账户超过 120 million；SEBI 主席在 November 2025 评论中提到 13.6 crore 投资者和 21 crore demat 账户。但 FY26
              NSE 活跃客户只有 4.57 crore，而且同比实际收缩。这意味着，表面参与叙事和可变现活跃交易者故事已经不再同步。Zerodha 的真实 SAM 落在宽口径 demat
              账户宇宙与更窄的活跃客户基数之间：这是既给账户入金、又足够频繁回访以创造经常性产品价值的自助型投资者队列。这个区别至关重要，否则估值或增长假设很容易套用膨胀的 TAM 算法。
