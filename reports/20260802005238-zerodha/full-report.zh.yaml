  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              对 Zerodha 而言，相关市场不是「所有金融服务」，甚至也不是「所有投资」。它是印度自助型投资栈：数字化开户、经纪执行、共同基金访问、组合跟踪、学习，以及在部分场景里的轻量贷款或 API
              工作流。这个边界重要，因为相较银行或顾问驱动的财富管理，纳入的支出池较窄。券商平台靠执行、资金浮存、直接计划分销邻接、付费工具或相邻服务变现；它们不会自动吃到全服务投顾、存款或全权委托财富管理的经济性。因此替代集合不止直接数字同业。银行系券商和研究能力强的老牌机构仍为交易频率较低、但重视信任与支持的用户解决同一个任务。另一端，低成本原生
              app 竞争者压低价格，并把简单开户做成基本门槛。实际竞争中，Zerodha 争夺的是愿意脱离网点关系自主投资的用户钱包和活跃度。因此市场定义必须纳入不投资、网点驱动投资和低使用率 demat
              账户这些现状，而不只是竞品 app。
