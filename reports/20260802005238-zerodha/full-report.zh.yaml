  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户是谁
        blocks:
          - type: paragraph
            body: >-
              Zerodha 服务的是宽泛自助型零售群体，而不是单一典型「日内交易者」。公司自己声称拥有超过 1.6 crore 客户，但产品界面说明，这个标题数字里可以包含很不一样的行为：首次开通 demat
              账户的投资者、用 Coin 购买直接共同基金的长期储蓄者、依赖 Kite 和 GTT 的活跃交易者、延伸到 Sensibull 的期权用户、使用社区和模型组合层的研究型用户，以及用 Console
              管理税务和报告需求的跨产品客户。这种多样性重要，因为客户质量取决于行为，而不只是账户总数。例如，直接计划基金投资者交易频率可能低于 F&O 用户，但随时间可能更耐久。同样，Varsity 或 Trading
              Q&A 里的教育优先用户，近期变现可能较低，但未来钱包份额潜力更大。正确解读是，Zerodha 的客户基数大且多元，但最有价值的子队列仍是那些成为多个产品活跃、重复用户的人。
