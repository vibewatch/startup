      - number: '8.2'
        title: 为什么业务能拿到溢价
        blocks:
          - type: paragraph
            body: >-
              Zerodha 的经营质量，在未上市金融科技公司里少见地强。Entrackr 报道 FY25 收入 ₹8,847 crore、净利润 ₹4,237 crore、现金 ₹22,679
              crore。BusinessLine 和 Inc42 显示，FY24 的收入和利润更高。这些数字重要，因为它们把 Zerodha
              和仍需资本来证明经济模型的典型创业公司分开。另一方面，市场研究来源显示，印度经纪市场结构性很大，更广泛的投资者池仍在扩张。品类仍有相关性、规模已经可观、盈利能力极高、所有权自举，这组组合让 Zerodha
              相比更弱或验证不足的金融科技公司具备溢价支撑。可选性同样重要。Console、合作伙伴主导的工作流、基金公司邻近业务，以及更广的财富管理界面，都说明 Zerodha
              不只是一个固定费率执行应用，而是越来越像金融平台。估值应当给这点加分；但在披露分部经济性之前，加分的具体幅度仍应保守。
