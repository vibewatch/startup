  topStrengths:
    - Zerodha 同时拥有大规模零售客群、异常强的公开盈利能力和超过 ₹22,000 crore 的现金，在私有 fintech 里韧性少见。
    - 公司仍完全靠自有资金滚动，没有明显融资依赖，也没有后期稀释包袱。
    - 产品横跨交易、报表、财富、API、教育和相邻业务，支撑的是更宽的平台逻辑，而不是单一折扣券商 app。
    - 印度经纪市场结构性足够大，即便交易活跃度周期波动，长期战略意义仍能守住。
  topRisks:
    - FY25/FY26 显示，经济性和客户活跃度仍受监管与交易强度影响，尤其是衍生品相关行为。
    - 公开披露仍明显薄于本土上市券商同行，限制了估值确信度。
    - Groww 和其他券商带来的竞争压力意味着，品类领导地位不能被视为永久锁定。
    - 可见服务事故或信任冲击，可能很快传导到活跃度、声誉和估值支撑。
  unresolvedGaps:
    - 需要 2025 年后的交易质量价格参照，例如新股融资、老股交易或要约。
    - 需要拆分经纪、利息、软件 / API、借贷和财富相邻业务的分部经济性。
    - 需要能区分总账户和可持续变现用户的客户留存与活跃队列。
    - 需要可与上市同行对比的治理、发起人经济性和韧性披露。
