- id: retention-and-expansion
  title: Retention, repeat usage, and expansion potential
  body: Public retention evidence is imperfect, but the product architecture exposes the retention logic. Console centralizes statements, tax P&L, contract notes, and analytics, which makes the relationship stickier over time because it becomes the user's financial record. Coin offers unified portfolio visibility and direct-plan investing, encouraging long-term ownership rather than only transaction churn. Partner layers such as smallcase and Sensibull deepen specific workflows without forcing customers to leave the wider Zerodha universe. These are real positives. The catch is that none of them substitutes for disclosed churn or cohort data. In fact, FY26 active-client contraction is a useful caution that not every opened account becomes a durable revenue source. The right conclusion is not that Zerodha lacks retention advantages; it is that the advantages are visible mostly as workflow logic rather than as measured retention metrics. Expansion appears more supportable than pure retention
    because the public stack clearly offers multiple opportunities to widen wallet share inside existing customers.
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  - CU025
