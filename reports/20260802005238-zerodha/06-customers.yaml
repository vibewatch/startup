- id: customer-risks-and-diligence-gaps
  title: Customer risks and diligence gaps
  body: 'The clearest customer-side risk is not one lost anchor client; it is behavioral concentration in the most activity-sensitive retail cohorts. The FY26 slowdown hit top discount brokers hardest, which suggests that active trader behavior can cool quickly when regulation tightens and sentiment weakens. Outages and public issues are the second risk because a broker''s customer trust can be challenged in real time: Downdetector and topic-page coverage make incidents instantly visible. The open diligence gaps are equally important. We do not have public churn, retention, NRR-style, or cohort-quality metrics. We do not know the precise split between traders and longer-term investors, nor the geography or income composition of Zerodha''s users. Those missing inputs limit precision on customer lifetime value and on how much of the current base is structurally durable. Public evidence is strong enough to say Zerodha has scale and diversity; it is not yet strong enough to say exactly how sticky
    each cohort is under stress.'
