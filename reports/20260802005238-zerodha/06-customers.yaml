callouts:
- calloutType: insight
  title: For Zerodha, customer value is defined by behavior, not by headline account count
  body: The difference between total clients, active users, and cross-product users is the most important customer fact in the report. Public evidence shows scale, but underwriting depends on who actually stays active and broadens usage.
  claimRefs:
