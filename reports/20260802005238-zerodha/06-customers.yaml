- id: adoption-trajectory-and-benchmarks
  title: Adoption trajectory and benchmarks
  body: 'The best public adoption metrics come in two very different flavors. Zerodha''s own About page gives a broad client-base claim of 1.6+ crore clients, which is valuable as a top-of-funnel and installed-base signal. Third-party market reporting then narrows the lens to active users: 7.26 million active NSE users and 15.8% share in FY25, followed by 15.08% share in FY26 after a difficult year for the industry. That distinction is crucial because active users, not total registered users, determine much of a broker''s realized monetization. Competitive benchmarks reinforce the pressure. Groww claims more than two crore active investors and gained active-client share in FY26, showing that the mass-retail acquisition race is still live even for very large platforms. Meanwhile, the broader market remains structurally large: the SEBI chair referenced 13.6 crore investors and 21 crore demat accounts in late 2025. For Zerodha, the customer opportunity is therefore still large in absolute terms,
    but the nearer-term operating question has shifted from “how big can the funnel get?” to “which parts of the funnel actually stay active?”'
