- calloutType: risk
  title: The biggest concentration risk is in active behavior
  body: Retail brokerage looks diversified by account count, but revenue quality can still be concentrated in the least durable, most activity-sensitive cohorts. The FY26 slowdown is the clearest warning signal here.
