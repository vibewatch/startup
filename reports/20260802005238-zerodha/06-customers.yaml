  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-cohorts
    missingEvidence: Public churn, repeat-usage, or cohort-retention data for Zerodha by major user segment.
    whyItMatters: Customer durability is the key variable distinguishing a large funnel from a valuable customer base.
    diligencePath: Request monthly active, funded, repeat-trader, and long-term-investor retention cohorts from management.
    relatedQuestionRefs:
    - QU019
    - QU021
  - type: missing-source
    severity: material
    topic: segment-mix
    missingEvidence: A public split of Zerodha users by trading intensity, wealth behavior, geography, and income band.
    whyItMatters: Different cohorts have very different monetization quality and concentration risk.
    diligencePath: Request customer segmentation from internal analytics or investor materials.
    relatedQuestionRefs:
    - QU024
  - type: missing-source
    severity: minor
    topic: satisfaction-metrics
    missingEvidence: NPS, complaint-rate, or service-quality metrics that connect incidents to actual customer outcomes.
    whyItMatters: Outage visibility alone does not quantify trust damage or retention impact.
    diligencePath: Collect CSAT/NPS data and complaint-resolution performance by product.
    relatedQuestionRefs:
    - QU010
    - QU016
  - type: missing-source
    severity: minor
    topic: partner-usage
    missingEvidence: Public usage penetration of partner products among Zerodha's customer base.
    whyItMatters: Expansion upside and lock-in risk both depend on how much customers actually use the ecosystem.
    diligencePath: Request attach rates for smallcase, Sensibull, and other adjacent tools.
    relatedQuestionRefs:
    - QU011
