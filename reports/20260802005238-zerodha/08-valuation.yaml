- id: recommendation-and-final-diligence
  title: Recommendation and final diligence
  body: The cleanest public-only recommendation is to track aggressively or pursue only selectively at or below the current $8.2B anchor, rather than to treat Zerodha as an obvious bargain. This is a company-quality-positive call paired with a valuation-discipline caveat. The bear case is not about solvency, dilution panic, or fundraising stress; it is about the market eventually deciding that an activity-sensitive, regulation-exposed broker deserves a lower premium than a flawless platform narrative implies. The bull case is still credible, but it requires renewed evidence on active-share momentum, ecosystem monetization, and disclosure quality. Accordingly, final diligence should focus on segment economics, cohorts, incident and complaint metrics, promoter economics, and any real transaction-quality price reference after Hurun 2025. If those checks come in strong, the current mark could look reasonable. If they do not, the absence of margin of safety becomes the central issue. A disciplined
    investor should therefore demand either better evidence, a better price, or both before moving from admiration to conviction. That discipline is the clearest edge available in a thinly disclosed private asset.
