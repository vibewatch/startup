  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Premium-quality private fintech
    - Huge profits, large cash, bootstrapped ownership
    - If margins compress faster than expected or cash falls materially
  - - Scale is still strategic
    - Market remains large and broker activity is concentrated
    - If active-client share keeps falling despite category growth
  - - Disclosure is the main handicap
    - Listed peers disclose much more than Zerodha does publicly
    - Management-grade reporting or a transaction-based mark would improve confidence
  - - Regulation is the biggest downside
    - Management warning plus FY26 slowdown show real sensitivity
    - Proof that revenue mix is less trading-dependent than it appears
  - - Optionality exists in adjacencies
    - Console, fund house, partners, wealth surfaces broaden the story
    - If adjacencies prove low-margin or low-adoption
  notes: This table separates company quality from price attractiveness.
