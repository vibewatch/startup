- id: why-the-premium-should-still-be-capped
  title: Why the premium should still be capped
  body: The cap on enthusiasm comes from three places. First, FY25 stepped down from FY24, which means the business is strong but not immune to cyclical or regulatory pressure. Second, FY26 active-client share data weakened, while competitors such as Groww continued gaining ground. Third, the disclosure quality is still materially below what a listed domestic brokerage peer would provide. Angel One's annual-report hub is a reminder that public investors normally expect filing-grade detail on risk, segments, and governance. Zerodha does not offer that depth publicly. This does not make the company unattractive; it makes the public mark less underwritable. If a buyer is paying around the current Hurun anchor, they are effectively paying for a very good business plus unresolved diligence gaps. That can still work, but only if entry discipline is respected and the investor has a credible path to close those gaps.
