- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Segment economics
    - Revenue/profit split by brokerage, interest, software, lending, and wealth adjacencies
    - Needed to underwrite durability and regulatory sensitivity
    - Management finance review
  - - Cohorts and retention
    - Funded, active, repeat-trader, and investor retention cohorts
    - Distinguishes account count from durable monetization
    - Growth / product analytics review
  - - Transaction-quality price reference
    - Recent secondary, tender, or internal mark methodology
    - Validates whether Hurun is conservative or full
    - Shareholder / finance diligence
  - - Governance and promoter economics
    - Compensation, distributions, and decision rights
    - Improves control and alignment view
    - Founder / board diligence
  - - Operational resilience
    - Incident history, complaint rates, and recovery metrics
    - Needed to size trust discount correctly
    - Engineering / risk / support diligence
  notes: These asks are the shortest path from a strong public story to an investable underwrite.
