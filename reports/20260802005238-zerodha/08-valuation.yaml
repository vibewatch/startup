- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Active-client share deterioration
    - Another material decline from current FY26 level
    - Undercuts moat and earnings durability assumptions
    - Lower fair value and raise risk rating
  - - Regulatory earnings shock
    - Fresh rule change with visible revenue/margin hit
    - Changes the premium case into a cyclical case
    - Move from track to avoid unless price resets
  - - Reliability / trust event
    - High-visibility outage or unresolved incident cluster
    - Increases customer-risk discount
    - Demand deeper ops diligence before proceeding
  - - Disclosure remains static
    - No management-grade data despite access opportunity
    - Keeps public mark un-underwritable
    - Refuse to stretch on price
  - - Adjacency underperforms
    - No evidence of meaningful wallet-share expansion
    - Removes an important bull-case layer
    - Keep valuation centered on core brokerage only
  notes: These are the main thesis-breakers to carry into live diligence.
