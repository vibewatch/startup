  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: A current public board roster, committee structure, and promoter ownership split for Zerodha Broking Limited.
    whyItMatters: Institutional diligence needs governance depth and control rights, especially in a founder-dominated private company.
    diligencePath: Obtain MCA filings, shareholder documents, or a management-provided cap-table and board deck.
    relatedQuestionRefs:
    - QO005
    - QO024
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An exact FY25 or current headcount disclosure for Zerodha and its major operating entities.
    whyItMatters: Headcount is a core scale and operating-leverage input for benchmarking against peers.
    diligencePath: Request management headcount by function and entity, or a recent payroll / ESOP summary.
    relatedQuestionRefs:
    - QO011
  - type: missing-source
    severity: minor
    topic: ownership-structure
    missingEvidence: Precise promoter, employee, and treasury ownership percentages across Zerodha entities.
    whyItMatters: Ownership clarity affects governance, succession, and any future liquidity or IPO path.
    diligencePath: Review cap-table support from management or registry records.
    relatedQuestionRefs:
    - QO023
    - QO024
  - type: missing-source
    severity: minor
    topic: regulatory-legal-status
    missingEvidence: A consolidated list of any material litigation, enforcement, or arbitration matters beyond disclosed outages and policy commentary.
    whyItMatters: A broker with Zerodha's scale could face trust or compliance issues not visible from topic pages alone.
    diligencePath: Run legal-docket, SEBI-order, and exchange-disciplinary searches with entity-name variants.
    relatedQuestionRefs:
    - QO025
