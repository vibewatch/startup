callouts:
- calloutType: strength
  title: Bootstrapped scale with unusually high cash resilience
  body: Zerodha combines unicorn-scale valuation evidence with profitability and a cash balance that would be exceptional even for many listed financial platforms. That balance-sheet strength materially lowers financing risk versus venture-dependent peers and gives management room to absorb regulatory or volume-driven revenue shocks without dilutive capital raising.
  claimRefs:
  - CO012
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
- calloutType: risk
  title: Regulation and platform reliability are the two fastest ways to break the narrative
  body: 'The 2025-2026 evidence shows two real thesis frictions already in motion: active-client share compression and a CEO-flagged 30%-60% topline sensitivity to derivatives-rule changes. Meanwhile, the transparency log demonstrates that even brief order-routing or data incidents remain a reputational risk for a broker whose promise is trust and execution quality.'
  claimRefs:
  - CO020
  - CO021
  - CO033
  - CO034
  - CO035
