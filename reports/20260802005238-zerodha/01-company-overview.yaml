- id: scale-profitability-valuation
  title: Scale, profitability, and valuation anchor
  body: 'What differentiates Zerodha from many fintech peers is not merely scale but scale with retained earnings and balance-sheet strength. Third-party coverage of FY24 puts revenue from operations at ₹9,372 crore, total income at ₹9,994 crore, and net profit at roughly ₹5,496 crore. FY25 then shows a meaningful slowdown rather than a collapse: Entrackr reported revenue from operations of ₹8,847 crore and net profit of ₹4,237 crore, with a still-exceptional cash and bank balance of ₹22,679 crore. That combination implies a business that can absorb cyclical or regulatory pain without needing to raise emergency capital. Customer metrics require nuance. The company itself claims 1.6+ crore clients and over 15% of Indian retail trading volumes, whereas FY25/FY26 active-client reporting from market coverage frames Zerodha at 7.26 million active users and a 15.08%-15.8% share of NSE active clients. Both can be true because one is a broad client-base claim and the other is a stricter active-client
    lens. Hurun''s Global Unicorn Index 2025 then provides the strongest fresh valuation evidence after August 2024, placing Zerodha at US$8.2 billion and at the top of India''s unicorn ranking.'
  claimRefs:
