- id: ecosystem-milestones-adverse-context
  title: Ecosystem, milestones, and adverse context
  body: 'Zerodha''s strategic reach now extends well beyond the broker account. Rainmatter gives the founders an ecosystem lever in fintech, climate, health, and media; Kite Connect creates a developer channel; partner surfaces such as Sensibull and smallcase extend the user experience without requiring Zerodha to build every workflow natively; and branded adjacencies such as Zerodha Capital and Zerodha Fund House show a controlled expansion into lending and passive asset management. The milestone pattern is therefore two-sided. On the positive side, the company built an education engine in Varsity, reached billion-dollar revenue scale without external VC funding, and sustained large profits and cash generation. On the negative side, public incident logs show recurring operational dependencies on exchange connectivity, data feeds, fund-addition rails, and third-party infrastructure. The December 2025 Cloudflare-linked issue is a reminder that reputation risk for a broker is not abstract:
    even short incidents during market hours can directly affect trust and active usage. The second adverse thread is regulatory. Nithin Kamath publicly warned that derivatives and exchange-rule changes could cut topline materially, underscoring how much of Zerodha''s earnings power is still linked to market structure decisions it does not control.'
