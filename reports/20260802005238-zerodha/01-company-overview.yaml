company:
  name: Zerodha
chapter:
  number: 1
  title: Company Overview
  summary: Zerodha is a Bengaluru-based, fully bootstrapped discount broker founded on 15 August 2010 that has turned low-cost broking into one of India's most profitable fintech models. The strongest fresh valuation anchor is Hurun's Global Unicorn Index 2025, which values Zerodha at US$8.2 billion, while FY25 third-party reporting still shows ₹8,847 crore of revenue, ₹4,237 crore of profit, and ₹22,679 crore of cash despite a regulatory and activity-led slowdown. The key diligence positives are capital self-sufficiency, brand trust, and broad product adjacency; the main caveats are founder concentration, incomplete governance disclosure, active-client share slippage, and real sensitivity to derivatives regulation and platform uptime.
sections:
- id: identity-business-model
  title: Identity and business model
  body: 'Zerodha is the archetype of India''s discount-brokerage wave: a Bengaluru-based, bootstrapped broker that built its position by taking cost out of retail investing while wrapping the brokerage account in a broader product surface. The company says it launched operations on 15 August 2010, named itself by combining zero with the Sanskrit word rodha, and set out to remove the friction traders faced in pricing, support, and technology. That origin story matters because the operating model is still recognizable in 2026. The current product footprint spans Kite for execution, Console for reporting and analytics, Coin for direct mutual funds, Kite Connect for developers, Varsity for education, and a wider investments surface that now includes IPOs, bonds, sovereign gold bonds, and direct mutual funds. Pricing remains central to the identity: equity delivery brokerage is free and most other trades are charged at a low flat fee. In effect, Zerodha is not only a broker; it is a low-cost
    investing platform whose value proposition depends on trust, usability, and product breadth rather than on paid distribution or outside venture subsidies.'
