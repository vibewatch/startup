  - id: growth-drivers
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      Structural demand drivers for Eruditus's market are well-supported by independent research. The WEF
      Future of Jobs Report 2025, drawing on 1,000+ employers representing 14 million workers across 55
      economies, identifies technology change as the primary force reshaping global labor markets through
      2030, generating persistent demand for continuous reskilling at scale. LinkedIn's 2025 Workplace
      Learning Report, derived from 1 billion member profiles and 14 million job postings, found that 49%
      of L&D professionals report executives are concerned that employees lack the skills to execute
      business strategy — and that only 36% of organizations qualify as career development champions with
      robust programs. McKinsey's research on 56 future-of-work DELTAs across 18,000 respondents in 15
      countries found that adult training programs covering self-leadership skills are 20 times rarer than
      communication-focused programs, pointing to a structural gap in existing adult-education supply that
      executive education platforms can address.

      AI is simultaneously the biggest structural driver and a medium-term risk. Goldman Sachs estimates
      generative AI could raise global GDP by 7%, catalyzing enterprise demand for AI fluency programs
      across management ranks. Eruditus's enterprise segment grew 45% in the year preceding its October
      2024 Series F, partly from this AI-upskilling wave. However, AI also compresses content-production
      costs, potentially commoditizing online course delivery and enabling smaller platforms to offer
      comparable quality at lower price points — reducing the switching-cost advantage of the
      university-partnership model.

      Adoption constraints are material. Post-pandemic demand normalization: Eruditus's own revenue grew
      only 12% in FY24 versus higher prior rates, reflecting sector-wide recalibration after the
      2020–2022 COVID-driven surge. Price sensitivity: mid-career professionals weigh $5,000–$10,000+
      program costs against career-ROI uncertainty, and employer skepticism toward online credentials
      in certain regulated or prestige-driven labor markets (law, medicine, investment banking) limits
      reachable TAM. Consumer satisfaction: complaint data from aggregated review platforms signals that
      program delivery and placement-promise fulfillment remain pain points constraining repeat purchase
      and referral growth. Regulatory friction is low for certificate programs today but rises as
      Eruditus expands toward online degree accreditation.
