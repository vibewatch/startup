callouts:
  - calloutType: insight
    title: "AI-Skills Demand Is Eruditus's Near-Term Tailwind and Long-Term Structural Risk"
    body: >-
      Enterprise segment revenue grew 45% in the year preceding the October 2024 Series F, with management
      citing AI-upskilling demand as a primary driver. This is consistent with LinkedIn data showing
      career-development champions are 42% more likely to be AI-adoption frontrunners, and Goldman Sachs's
      estimate that generative AI could raise global GDP by 7%, creating enterprise-level urgency for AI
      fluency across management ranks. The near-term tailwind is real. The structural risk is that the same
      AI capabilities driving demand also compress content-production costs, potentially allowing lower-cost
      platforms to erode the price premium Eruditus currently commands through university branding. Diligence
      should assess whether Eruditus has proprietary AI product depth (tutors, assessment, personalization)
      beyond third-party LLM integration, and whether enterprise contract renewal rates in AI-specific
      cohorts are tracking above or below the overall enterprise retention baseline.
    claimRefs:
      - CM025
      - CM026
      - CM022
      - CM036

