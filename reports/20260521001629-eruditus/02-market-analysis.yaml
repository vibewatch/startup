chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Eruditus (Emeritus brand) competes at the intersection of global online executive education, professional
    upskilling, and enterprise L&D — a market HolonIQ sizes at $404B in total global edtech spending by 2025
    at 16.3% CAGR, with the premium university-co-branded online sub-segment considerably smaller but growing
    faster on a unit-economics basis. Enterprise L&D revenue grew 45% in the year preceding the October 2024
    Series F fundraise, driven by AI-skills demand, while the broader edtech market shows post-pandemic
    normalization. Key constraints are price competition from lower-cost platforms, employer skepticism in
    some labor markets, and the absence of a single authoritative SAM figure for the executive education
    sub-segment.

sections:
  - id: market-boundary
    title: "Market Boundary and Scope"
    body: >-
      Eruditus addresses three adjacent but structurally distinct markets. First, global online executive
      education: premium, cohort-based programs (typically 6–18 weeks) co-designed with top-ranked universities
      and targeted at managers, directors, vice presidents, and senior leaders seeking to upgrade strategic or
      functional skills without leaving employment. Second, professional upskilling and certification: multi-format
      programs across data science, AI, digital marketing, product management, finance, and technology, open to
      any working professional seeking credential-backed skills; price points for these are lower than senior
      executive programs but meaningfully above mass-market MOOC courses. Third, enterprise learning and
      development (L&D): contracted workforce education delivered to companies, governments, and institutions
      through private cohorts, company-branded portals offering 200+ programs, and customized Academies.

      The market boundary explicitly excludes traditional campus-based residential MBAs and EMBAs (requiring
      physical relocation and full-time study); K-12 and test-preparation (pre-employment learners); mass-market
      self-paced courses without cohort structure or university branding sold at $10–$100 price points on Coursera
      or Udemy; and government vocational training without premium-institution backing. Eruditus CEO Ashwin Damera
      has identified Coursera, Udacity, and Udemy as competitors, confirming a distinct quality and price tier
      from these platforms. The status-quo substitute for a B2C buyer is attending the same university's
      campus-based program, enrolling in a self-paced MOOC, or doing nothing. For enterprise buyers, the
      substitute is in-house learning teams, third-party corporate trainers, or subsidized campus MBA reimbursement.

      Adjacencies include online degree programs (Eruditus has stated plans to expand into postgraduate and
      undergraduate online degrees), government workforce development partnerships, and AI-native learning
      platforms. The company's global footprint — 80+ countries, programs in English, Portuguese, Spanish, and
      Mandarin — defines the geographic scope of its serviceable market.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM030
