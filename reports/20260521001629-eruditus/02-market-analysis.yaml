  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "market sizing"
      missingEvidence: >-
        Publicly disclosed, independently verifiable headline market size and CAGR for the global online
        executive education sub-segment specifically (excluding broader professional development and all edtech).
      whyItMatters: >-
        Without a defensible SAM, Eruditus's valuation at $3.2 billion cannot be assessed against a
        market-penetration multiple; investors relying on top-down TAM from the full edtech market risk
        significant overstatement of the premium sub-segment opportunity.
      diligencePath: >-
        Purchase and review underlying reports from Research & Markets, FMI, and Mordor Intelligence;
        request company-provided market sizing model with methodology; cross-check against AACSB or EFMD
        data on executive education program revenue across accredited schools.
      relatedQuestionRefs:
        - QM006
        - QM008
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: "market share"
      missingEvidence: >-
        Eruditus's actual market share within the online executive education sub-segment; gross bookings
        versus recognized revenue breakdown; enterprise share of total revenue.
      whyItMatters: >-
        Revenue-derived market penetration (current SOM) cannot be estimated without segment revenue data;
        overstatement of SAM penetration materially affects growth assumptions in a DCF or revenue-multiple
        valuation.
      diligencePath: >-
        Request segment-level P&L from management; review audited FY25 financials when published;
        compare gross bookings (which Eruditus has referenced in press but not disclosed precisely)
        versus GAAP-recognized revenue to understand deferred revenue dynamics.
      relatedQuestionRefs:
        - QM006
        - QM024

    - type: conflicting-data
      severity: minor
      topic: "learner count"
      missingEvidence: >-
        Reconciliation between the Eruditus home page figure of 350,000+ learners and the TPG Series F
        press release figure of 1 million+ individuals educated across 80+ countries; the gap may reflect
        active enrolled learners versus total cumulative alumni.
      whyItMatters: >-
        Inconsistent learner count metrics between company sources make it difficult to calculate average
        revenue per learner or market penetration; investors may have used the higher figure without the
        distinction between active and cumulative.
      diligencePath: >-
        Request management clarification on metric definition (cumulative total since founding vs. active
        learners in trailing 12 months vs. currently enrolled learners); cross-check against FY24
        financial filing footnotes.
      relatedQuestionRefs:
        - QM011

    - type: missing-source
      severity: material
      topic: "AI differentiation risk"
      missingEvidence: >-
        Independent evidence on whether AI-driven content commoditization has materially eroded the
        differentiation advantage of premium online executive education providers versus lower-cost platforms.
        No public third-party study quantifies the pricing gap compression attributable to AI tooling.
      whyItMatters: >-
        If AI platforms can replicate cohort-based delivery and faculty-branded content at a fraction of
        Eruditus's $2K–$12K price point, the premium justification narrows. Market-share data on price
        sensitivity in the enterprise segment is unavailable publicly, making this a key diligence gap
        ahead of any growth-rate projection.
      diligencePath: >-
        Commission primary research on enterprise willingness-to-pay for AI-enhanced vs. university-branded
        credentials; review Eruditus's platform AI product roadmap and proprietary feature depth; benchmark
        against Coursera for Business and EdX pricing to assess convergence risk.
      relatedQuestionRefs:
        - QM019
