  - id: market-sizing
    title: "Market Sizing: TAM, SAM, and SOM"
    body: >-
      The total addressable market (TAM) for Eruditus depends critically on where the boundary is drawn.
      The broadest relevant framing is the global edtech market, estimated by HolonIQ at $404B by 2025 at
      16.3% CAGR from a 2019 base — but this encompasses K-12 educational software, campus learning
      management systems, corporate HR-tech, and mass-consumer apps, the majority of which are not
      Eruditus's competitive segment. Even within this $404B total, HolonIQ observes that edtech spending
      represents only 5.5% of the $7.3T total global education market, underscoring that the traditional
      sector still dominates absolute spending while digital delivery claims the growth share.

      Multiple independent analyst publishers — Research & Markets, Future Market Insights, Mordor
      Intelligence, and The Business Research Company — have each published dedicated reports on the
      executive education or professional development market, though their scope definitions, base years,
      and CAGR assumptions differ materially, making direct comparison unreliable without methodology
      reconciliation. Grand View Research has separately covered the broader e-learning market, which
      includes but is wider than the executive education sub-segment. This analysis uses a conservative,
      multi-lens approach: TAM is estimated at the broader global online professional education market
      (all adult learners seeking career-oriented credentials, online delivery); SAM is the premium
      university-co-branded online executive and professional programs segment, globally distributed,
      where Eruditus actually competes; SOM reflects Eruditus's current penetration given its university
      footprint, language coverage, price point, and geographic concentration.

      The SAM and SOM figures are explicitly constrained by unavailable private data. Eruditus has not
      disclosed revenue by segment or geography at a precision that allows a defensible SOM derivation.
      The sizing lens table presents analyst estimates for relevant sub-markets alongside observable
      proxy indicators (Eruditus revenue, learner count, enterprise growth rate). Readers should treat
      the SAM and SOM entries as illustrative order-of-magnitude ranges, not audited market shares.
      The wide analyst estimate range is itself informative: contradictory scope assumptions across
      publishers are a diligence risk for investors using a single top-down TAM to justify valuation.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
