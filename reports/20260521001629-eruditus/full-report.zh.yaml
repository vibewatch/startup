  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与平轮信号
        blocks:
          - type: paragraph
            body: >
              Eruditus 2024 年 10 月完成 Series F，投后估值 $3.2B，融资 $150M，由 TPG Rise Fund 领投。 这个价格与 2021 年 8 月 Series E 的 $3.2B
              投后估值完全相同，意味着 2021 年那批投资人在 38 个月内名义回报为 0%。 同期，FY24 报告收入达到 ₹3,733 crore（$448M），约为 Series E 当时估计 ~$240M
              的两倍，说明估值倍数明显压缩：EV/Revenue 从 Series E 估计约 13x 降至 Series F 约 7.1x。 27 名投资人的累计终身股权融资达到 $741M。

              平轮并不寻常，值得仔细追问。通常，峰值估值之后的平轮意味着三种可能：（a）投资人靠优先权或棘轮等结构性保护拿补偿，而不是正式做 down round；
              （b）公司短期经营势头足以撑住头部估值，但不足以支撑溢价；或（c）领投方 TPG Rise 有跨组合动机来维持标价。 Inc42 报道称，Series F 前谈判给 Eruditus 的估值为
              $2.3B，比公告价低 28%；若业绩目标落空，棘轮条款会把有效价格降至 $1.8B。 最终 $3.2B 成交价相对这个底价缺乏解释，最终工具条款（优先权堆栈、棘轮是否存在）仍未披露。

              按调整后企业价值口径，把 $150M Mars/HSBC 债务融资加到 $3.2B 股权价值上，EV 约为 $3.35B，对应 FY24 EV/Revenue 约 7.5x、FY25E 约 6.4x。 FY25E
              指引中位数约 ₹4,375 crore（约 $525M）来自管理层表述，尚未独立审计。Eruditus 不发布经审计的合并集团财务；媒体引用的数字来自未经审计的中期管理账， 或只能覆盖部分集团的 ROC
              子公司备案。这个披露缺口，是任何独立估值工作的重大约束。
