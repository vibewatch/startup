      - number: '8.3'
        title: 上市可比估值组
        blocks:
          - type: paragraph
            body: >
              三家上市可比公司为 Eruditus 的市场倍数提供最直接证据。Coursera（COUR）是质量最高的 B2C 与企业在线学习平台：FY2024 收入 $694.7M（YoY 增长 9%）， 毛利率
              53%，净亏损 $79.5M；其年报显示，截至 2024 年 6 月 30 日，非关联方市值约 $1.0B。到 2025 年 10 月，Macrotrends 数据显示 Coursera 市值已恢复到约
              $1.65B， 对 FY2024 收入的 P/S 区间为 1.4-2.4x。Coursera 几乎没有净债务，因此 EV/Revenue 近似等于 P/S。

              Udemy（UDMY）是最大的纯在线技能市场：FY2024 收入 $786.6M（企业 $494.5M + 消费者 $292.1M），净亏损 $85.3M。 Macrotrends 数据显示，截至 2025 年
              11 月市值约 $760M，对 FY2024 收入的 P/S 约 0.97x。Udemy 企业板块渗透率（占收入 63%）明显高于其整体倍数所暗示的水平， 说明市场在折价计入消费者收入流失风险。

              Skillsoft（SKIL）给出板块压力信号：最近一个财年（截至 2025 年 1 月）TDS 板块收入为 $405.5M，占总收入 76.4%，由此推算公司总收入约 $531M。 但截至 2024 年 7 月
              31 日，非关联方股份合计市值仅 $60.4M，单看股权 P/S 约 0.11x（计入 $594.6M 定期贷款后 EV/Revenue 约 1.2x）。 Skillsoft 在 FY2024 Q4 计提
              $202.2M 商誉减值，理由是「观察到公司股价和市值长期且大幅下跌、竞争市场分析和可观察行业倍数」。 这句话是近期 edtech 板块对市场倍数压缩最精确的表述。2U 在 2023 年的 Chapter 11
              申请锚定了可比公司光谱的最差端。

              Eruditus 的 7.1x LTM EV/Revenue 比 Coursera 和 Udemy 代表的 1-2x 区间高出 3-5 倍，比 Skillsoft 的困境股权倍数高出 50 倍以上。
              其中一部分溢价可以辩护：Eruditus 仍处于 IPO 前（通常有 20-30% 非流动性溢价）、所在地区结构性增速更高（印度），且 EBITDA 轨迹在改善。 但若不假设 IPO 后公司回到 2021
              年式情绪并获得持续重估，上述理由无法在数学上填平 3-5 倍差距。
