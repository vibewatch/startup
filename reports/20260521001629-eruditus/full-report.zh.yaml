      - number: '4.3'
        title: 收入确认细节与 EBITDA 口径冲突
        blocks:
          - type: paragraph
            body: >-
              Eruditus 采用 7 月至 6
              月的财年，并按权责发生制确认收入——也就是在项目服务交付时确认，而不是在收款时确认。项目往往在交付开始前数月售出并付款，因此资产负债表上会形成显著的“预订”到“确认”差额，即递延收入。FY24 有 ₹800
              crore（约 $96M）已收费用递延到 FY25，直接拉开了媒体广泛引用的两套 EBITDA 指标。


              ₹69 crore 的权责发生制 EBITDA 亏损来自集团提交给 ACRA（新加坡）的合并财务报表。按预订口径的 EBITDA 为 ₹28 crore（由联合创始人 Kalipatnapu 引用）和 ₹80
              crore（CEO Damera 在 2024 年 11 月 Business Standard 访谈中引用），反映的是现金收款经济性——同一期间收了多少现金，扣除相关费用，不考虑交付时点。₹-69
              crore（权责发生制）与 ₹+28–80 crore（预订口径）的差额，大致符合对 ₹800 crore 递延池套用约 12–15% EBITDA 利润率的算术：若递延收入增量利润率约 12%，差额 = ₹96
              crore，两组数字在四舍五入内可对上。


              ₹28 crore 是年末申报前披露的年中联合创始人估计；₹80 crore 是 CEO 声称的全年预订口径数字。两者都是公司口径，未按这一基础独立审计。依赖预订口径数字评估当期经济性的投资者，应与新加坡
              ACRA 文件核对，并要求正式的递延收入调节表。Financial Express 指出，FY23 合并财务报表由集团实体在新加坡提交；但截至本分析时间（2026 年 5 月），已审计的 FY24
              集团财务报表尚未发布。
