      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              独立研究有力支持 Eruditus 所在市场的结构性需求驱动因素。WEF Future of Jobs Report 2025 基于覆盖 55 个经济体、代表 14 million 名员工的 1,000+
              家雇主，指出技术变化是到 2030 年重塑全球劳动力市场的主要力量，并催生持续的大规模再技能培训需求。LinkedIn 2025 Workplace Learning Report 基于 1 billion
              名会员画像和 14 million 个职位发布，发现 49% 的 L&D 专业人士称高管担心员工缺乏执行业务战略所需技能；只有 36% 的组织可被归为拥有扎实项目的职业发展冠军。McKinsey 对 15 个国家
              18,000 名受访者、56 项未来工作 DELTAs 的研究发现，覆盖自我领导技能的成人培训项目比沟通类项目少 20 倍，指向现有成人教育供给的结构性缺口，高管教育平台可以填补这一缺口。

              AI 同时是最大的结构性驱动因素和中期风险。Goldman Sachs 估计，生成式 AI 可能把全球 GDP 提高 7%，催化企业对管理层 AI 熟练度项目的需求。Eruditus 企业板块在 2024 年
              10 月 Series F 前一年增长 45%，部分来自这波 AI 技能提升浪潮。但 AI 也压缩内容生产成本，可能让线上课程交付商品化，并使小平台以更低价格提供可比质量——从而削弱大学合作模式的切换成本优势。

              采用约束并不轻。疫情后需求正常化：Eruditus 自身 FY24 收入仅增长 12%，低于此前增速，反映 2020–2022 年 COVID 驱动激增后的全行业再校准。价格敏感性：中层职业人士会把
              $5,000–$10,000+ 项目成本与职业 ROI 不确定性相权衡；在某些受监管或重声望的劳动市场（法律、医学、投资银行），雇主对线上证书的怀疑限制了可触达
              TAM。消费者满意度：汇总评论平台的投诉数据表明，项目交付和就业承诺兑现仍是痛点，限制复购和转介绍增长。证书项目当下监管摩擦低，但 Eruditus 向线上学位认证扩展后会升高。
