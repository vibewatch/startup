  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 债务、资本结构与再融资风险
        blocks:
          - type: paragraph
            body: >
              相对于已披露盈利状况，Eruditus 承担了有意义的杠杆。公司历史上高度依赖债务为增长融资：2022 年 3 月筹集的 $350M CPPIB 融资支持了激进内容和地域扩张，此后大部分被再融资为 Mars
              Growth Capital（Liquidity-MUFG 合资，最高 $100M）和 HSBC（最高 $50M）领投的 $130M 初始 / $20M 选择权融资，2025 年 9 月完成，四年期约到 2029
              年。再融资保留了财务灵活性，但公司没有公开披露利率、LIBOR/SOFR 利差、摊还安排、财务维持契约或股权挂钩条款。这种不透明是重大尽调缺口。公司还在 2024 年 10 月以持平的 $3.2B 投后估值融资
              $150M Series F 股权——与 2021 年 8 月峰值不变——表明在 Byju's 崩盘和 Unacademy 收缩期间，股权投资者的增长预期已大幅降温。FY24 收入增长 12%（₹3,733
              crore vs. FY23 的 ₹3,280 crore）低于管理层 2024 年向投资者引用的 30-35% 复合年增长，给支撑 IPO 逻辑的 FY25 ₹5,000 crore 收入和 ₹300
              crore EBITDA 目标带来下行风险。如果 FY25 目标落空，用 IPO 募资偿债会延后，再融资周期必须在 2029 年届时利率环境下重来。CEO Ashwin Damera 在 2024 年 10
              月称公司“现在不需要还债”，债务“在明年年底”到期，暗示原 CPPIB 融资到期在 2025 年——这确认 2025 年 Mars/HSBC 再融资是必要操作，而不只是机会主义操作。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
