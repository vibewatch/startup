      - number: '1.4'
        title: 规模、业绩与战略展望
        blocks:
          - type: paragraph
            body: >
              截至 2024 年 6 月 30 日的财年（FY24），Eruditus 报告收入 ₹3,733 crore，较 FY23 的 ₹3,280 crore 增长 12%（FY23 本身增长 63%）。FY24
              增速放缓是公司有意为之：营销开支从收入的 29% 降至 27%，表现不佳的课程被裁撤，重心转向盈利。运营费用从收入的 36% 降至 28%。按权责发生制计算，调整后 EBITDA 亏损从 FY23 的 ₹417
              crore 收窄至 FY24 的 ₹69 crore（改善 83%）。按预订 / 现金口径，公司实现 EBITDA 盈利——Kalipatnapu 称 FY24 预订口径利润为 ₹28 crore，而
              Damera 向 Business Standard 称全年 EBITDA 转正 ₹80 crore，反映两者调整口径不同。Business Standard 文章还指出，根据标准递延收入会计，₹800
              crore 收入将在下一财年确认。截至 FY24，Eruditus 是按收入计算最大的印度 edtech 公司，规模为 PhysicsWallah 的 1.8–1.9 倍，并超过 upGrad 的两倍。

              公司的 FY25 目标（截至 2025 年 6 月的财年）是收入约 ₹4,500–5,000 crore、增长 15–25%，EBITDA 约 ₹300 crore，主要由企业 / 印度板块同比增长 40%
              驱动。企业客户占总业务 15%，Series F 前一年收入增长 45%，公司截至 2024 年 10 月的两年内企业业务翻倍。

              展望未来，Eruditus 表示将：（1）把大学合作伙伴从 80 所扩展到 150 所；（2）从高管教育进入研究生和本科项目；（3）投资自研 AI tutors 和生成式 AI
              增强学习工具；（4）完成新加坡至印度的注册地迁移（目标：2025 日历年）；（5）推进印度 IPO，目标约为 2024 年 10 月后的 2–3 年（意味着 2026–2027
              年时间框架）。潜在收购带来的增长仍在路线图上，原本用于 M&A 的 $350M CPPIB 债务仍有部分未偿。负面信号包括 Shiksha 等平台上的用户评价不一，以及 Emeritus Institute of
              Management, Inc.（Boston）的 BBB 投诉列表——这代表规模化后的学习者满意度和产品交付风险仍在持续。
