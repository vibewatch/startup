      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Eruditus 的投资逻辑建立在四个相互强化的支柱上。第一，全球企业 L&D 市场结构性大且仍在增长：前文引用的 HolonIQ 数据估计，总可触达市场为 $350-370B， 其中高管与职业教育子集约
              $50-70B，正好由 Eruditus 的线上混合模式覆盖。企业客户是增长最快的板块，Series F 前报告 YoY 增长 40-45%；企业 L&D 预算正流向认证型、 结果导向课程，而 Eruditus
              的顶级大学品牌伙伴很难复制。第二，印度增长期权高度不对称：印度目前贡献 27-28% 收入，CEO Damera 表示目标是在五年内提升到 50%； 按印度上市大盘科技同业当前 P/S 估值看，牛市情境下 IPO
              出现显著印度溢价重估并非不可能。第三，盈利路径可信：权责发生制 EBITDA 亏损从 FY23 的 ₹-417 crore 收窄至 FY24 的 ₹-69 crore， FY25 目标为正 ₹300 crore
              权责发生制 EBITDA，这将是一次极大的盈利性反转。第四，2025 年 9 月 Mars/HSBC 再融资消除了此前压制 IPO 可选性的短期资产负债表风险。 80+ 个大学伙伴——包括
              Harvard、MIT、Wharton、Columbia、INSEAD、ISB 和各 IIM——构成一道结构性护城河，目前没有印度数字竞争者能在同等深度上复刻。

              反向逻辑同样重要。Coursera（COUR）和 Udemy（UDMY）均已上市、经审计，收入规模也大得多，却只按 1.0-2.4x EV/Revenue 交易。 Skillsoft 接近归零的公开股权价值和
              2U Chapter 11 破产，锚定了板块下行区间。Eruditus 按 7.1x LTM EV/Revenue 要价，但没有任何已披露可比公司能支撑这个溢价。 Inc42 报道的 $2.3B Series F
              前谈判估值和 $1.8B 棘轮底价，说明成熟交易对手给出的业务估值比公告价低 44-56%；最终价格如何在基本面没有结构性改善的情况下达到 $3.2B， 公开资料没有解释。FY24 收入增长
              13.8%，掩盖了管理层在 2021-2022 年向投资人提到的 30-40% CAGR 已明显降速。 权责发生制与 booking 两套 EBITDA
              报告口径并不标准，降低了任何利润率计算的可信度。公司也未发布经审计的合并财务报表。
