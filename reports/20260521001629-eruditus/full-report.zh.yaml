    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >
              Eruditus（法定名称：Eruditus Learning Solutions Pte. Ltd.）是一家在新加坡注册的教育科技公司，由 Ashwin Damera 和 Chaitanya
              Kalipatnapu 于 2010 年创立。公司宣称的使命，是让全球个人、组织和政府都能获得高质量且负担得起的教育。面向消费者的主品牌是 Emeritus；另有独立的 “Eruditus Executive
              Education” 品牌服务高管队列细分市场。印度控股实体 Eruditus Education Private Limited 于 2010 年 10 月在 Tamil Nadu 注册成立。截至 2024 年
              10 月 Series F 公告，Eruditus 在 Mumbai、New Delhi、Shanghai、Singapore、Palo Alto、Mexico City、New
              York、Boston、London 和 Dubai 设有办公室，全球员工超过 1,750 人。

              公司的运营模式是大学合作平台：Eruditus 与一线学术机构共创课程，搭建数字交付和营销基础设施，招收学习者，并与大学合作方分成项目收入。纯 MOOC 平台主要托管第三方内容，两者不同。截至 2024 年 10
              月，Eruditus 与 80+ 所大学合作，包括 Harvard Business School、Columbia Business School、MIT、ISB 和 IIMs，交付 700+
              个职业学习项目。这些项目从短期线上证书（4–16 周）到沉浸式高管项目（18–24 周混合式）和研究生证书不等。Columbia Business School 与 Emeritus 在 C-suite
              和新兴领导者项目上合作已超过十年。

              需求侧收入来自两条主要渠道：B2C（直接面向学习者）和 B2B 企业（企业 L&D 与政府员工发展）。截至 2024 年 10 月，企业业务贡献约 15% 的总业务，在 Series F 前一年同比增长
              45%，并在 2024 年 10 月融资前两年实现翻倍。印度按收入约贡献整体业务的 27–28%。其余收入来自美国、欧洲、拉丁美洲、中东和亚太。
