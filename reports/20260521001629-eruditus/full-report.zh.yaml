      - number: '3.4'
        title: 护城河评估、切换成本与 Eruditus 的弱点
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的竞争护城河建立在三根支柱上：与 80+ 家机构的大学共创和收入分成关系（需要多年信任积累和联合课程开发）；横跨 80+ 个国家的全球学习者和品牌足迹；以及 Emeritus
              Enterprise 平台，它拥有 200+ 个大学背书项目和精选 Academies，并具备中等 LMS 集成切换成本。这些护城河真实存在，但并不完整，且若干结构性脆弱点很重要。

              品牌依赖是最重要的结构性脆弱点。Eruditus 自身不产生独立于大学合作伙伴的证书价值；证书分量来自大学名称。如果 Harvard Business School、MIT 或 Columbia
              选择扩张自己的直接面向学习者平台（HBS Online 已以每门 $1,850 提供项目，完全绕过 Eruditus），收入分成模式会在高端市场丢失规模和定价权。双渠道风险——大学同时运营直达项目和
              Eruditus 中介项目——进一步放大这种依赖。

              内容规模差距很大。Coursera 提供 10,600+ 门课程；edX 有 5,300+ 个项目；LinkedIn Learning 有 24,000+ 门；Eruditus 约有 700+ 个项目。这限制了
              Eruditus 覆盖低承诺、寻求单一主题技能的大众学习者的能力，削弱其在目录广度驱动的企业订阅模式中的竞争力，并把定价权集中在狭窄的队列项目利基市场；而大学直达渠道正以相近价格越来越容易进入这一利基。

              消费者投诉证据偏负面。Better Business Bureau 已记录针对 Emeritus Institute of Management
              的投诉，涉及课程质量、招生顾问做法和退款争议。emeritus.org 的 Trustpilot
              评价不一，负面评价提到项目承诺未完全兑现和退款政策不清。这些信号说明，把高端项目承诺转化为稳定学习成果存在执行风险——也给大学直达替代品带来质量感知优势。

              在价格两端，Eruditus 都被挤压。低端，Coursera-Udemy 的消费者订阅起价低于每月 $50，远低于 Eruditus 的 $2,000–$12,000+ 项目费。高端，HBS
              Online、Wharton 和 LBS 收费相近或更高（每个证书 $1,850–$15,000），但直接交付完整大学背书。对能进入直达渠道的成熟买方而言，Eruditus
              的增值——主要是招生顾问、队列管理和营销基础设施——会下降。

              多平台使用很常见。B2C 学习者经常在多个平台报名；个人证书的切换成本低。企业合同通过定制项目设计、LMS 集成和品牌学习者门户制造更高切换成本，但这些也可以复制。最深的切换成本来自多年期企业 Academies
              和共用品牌企业门户，而不是单个项目报名。
