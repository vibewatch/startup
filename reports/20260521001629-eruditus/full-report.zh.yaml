      - number: '5.5'
        title: 产品风险、合作伙伴依赖与商品化部分
        blocks:
          - type: paragraph
            body: >-
              核心产品风险在于，Eruditus 的差异化发生在课堂之上，而不是课堂内部。公开证据指向 Canvas 和 Accredible
              是重要的学员交付工具，应用层很大程度上只是把这些课堂工作流搬到移动端。这意味着运营栈中相当一部分已经商品化，并且可能被替换。更可防守的层是编排：寻找大学伙伴、设计队列、招募学员、支持作业、定制企业队列，并在其上叠加
              AI 辅助体验。如果合作学校或竞争对手更容易把这些服务内化，产品优势会迅速收窄。


              因此，合作伙伴去中介化不只是商业风险，也是产品设计风险。Columbia 和 Wharton 都在自有资产上描述直播在线、自定进度和混合渠道，HBS Online 也显示精英学校可以不通过中介运营直接证书和 AI
              项目。与此同时，BBB
              和评论聚合器上的公开投诉界面仍可见，公开材料也未披露监考供应商、网络研讨会工具或点名的企业安全认证。结果是，产品在组合宽度和托管交付上看起来强，但在投资者通常检验平台耐久性的地方仍缺少文档：集成深度、学习效果测量、导师表现，以及大型大学合作伙伴扩张直销渠道时的防御力。
