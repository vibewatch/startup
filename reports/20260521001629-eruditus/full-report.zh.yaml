          - type: callout
            title: Booking 口径与权责发生制 EBITDA 差距需要 IPO 审查
            body: >
              Eruditus 的 FY24 财务披露显示，权责发生制调整后 EBITDA 亏损（₹69 crore）与预订 / 现金口径盈利（₹28–80 crore
              正值，两位联合创始人向不同媒体引用）之间存在差距。公司还按标准会计惯例将已收取的 ₹800 crore 收入递延至下一财年确认。IPO 投资人需要 DRHP 级别的 Ind-AS
              财务报表来调和这些数字，并验证盈利叙事。该差异本身不必然负面，但在任何 SEBI 备案前，它构成公开证据的重大缺口。
