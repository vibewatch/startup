      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Eruditus 由 Ashwin Damera（CEO）和 Chaitanya Kalipatnapu（联合创始人兼执行董事）共同创立。2021 年 8 月 Series E 后，Damera 持有公司约
              40% 股权，使他成为少数在公司进入独角兽阶段后仍保留接近控股规模权益的印度十亿美元创业公司创始人之一。创办 Eruditus 前，他曾任职 Booz Allen Hamilton，并创立
              Tutorvista（后被 Pearson 收购）。Kalipatnapu 作为执行董事，一直是公司财务和运营披露的公开代表，包括 2025 年 4 月向 Moneycontrol 解读 FY24 业绩。

              截至 2024 年 10 月，公司运营已进入第十四年。Damera 将长期机构记录和高质量投资人基础列为关键治理差异点，尤其是在 Byju's 级别治理失败频出的行业里。2024 年 10 月 Series F
              后，董事会得到加强：TPG 的 Simit Batra 作为 Rise Fund 投资的一部分加入 Eruditus 董事会。其他可能拥有董事席位或观察员权利的投资方包括 SoftBank Vision Fund
              2、Accel、Leeds Illuminate、CPP Investments、Chan Zuckerberg Initiative、Prosus Ventures、GSV Ventures、Peak XV（原
              Sequoia India）和 Bertelsmann；但作为私营公司，确切席位图未公开披露。截至 2026 年 5 月，未见重大管理层离职或治理负面事件报道。

              一个关键治理转换正在推进：Eruditus 于 2024 年底启动从新加坡迁册至印度的流程，Series F 完成后不久即任命顾问。Damera 公开表示，迁册印度会在 2025 年完成，之后推进
              IPO。对在新加坡 / 美国持股、印度运营的公司而言，注册地迁移是 IPO 前的标准动作，也是 BSE/NSE 上市的前提。
