      - number: '6.5'
        title: 留存耐久性、扩张与透明度缺口
        blocks:
          - type: paragraph
            body: >-
              客户章节最重要的尽调缺口，是完全没有公开披露留存或耐久性指标。净收入留存率（NRR）、总收入留存率（GRR）、企业账户续约率、B2C
              重复购买项目率和队列存续曲线，在任何可访问形式中都没有发布。学员耐久性的唯一代理是 85%
              完成率——公司口径且无第三方佐证——它衡量的是项目内参与度，而不是项目后的忠诚度。企业收入两年翻倍与强净扩张一致，但不知道增长来自新客户还是既有账户内扩张，就无法评估耐久性质量。


              集中度风险同样披露不足。没有公开企业客户名单，没有披露 Herfindahl 指数或前十大客户收入占比，也没有企业收入的地域拆分，只有印度加企业共同构成主要增长轴的表述。B2C
              收入依赖个人专业人士继续进行可自由支配支出，易受宏观环境、雇主报销政策和大学直销渠道推出竞争项目影响。公司当前地域结构——印度 27–28%，其余分布在 80+ 国家——意味着 B2C
              有一定分散，但其中一个最快增长板块存在单一国家集中。想评估客户耐久性的投资者，需要在管理层会议或数据室索取队列留存数据、NRR 和客户集中度明细。
