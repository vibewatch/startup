  - id: TV005
    title: 论点破裂与终止触发器
    columns:
      - 风险
      - 可监控触发器
      - 终止标准
      - 动作
    rows:
      - - FY25 EBITDA 未达标
        - 公司更新、访谈或 ROC 子公司申报
        - FY25 权责发生制 EBITDA < ₹200 crore（偏离 >33%）
        - 下调至回避；重新评估 IPO 时间线；债务再融资风险重新浮现
      - - 收入增速降至 10% 以下
        - 中期业绩媒体报道；管理层访谈
        - 连续两个期间 Q-on-Q 收入年化增速 < 10%
        - 情景切换至悲观；重跑可比倍数分析
      - - Series F 棘轮被触发
        - 任何棘轮行使或 Series F 后工具修订的新闻报道
        - 确认棘轮调至 $1.8B
        - 证明真实出清价为 $1.8B；$3.2B 只是标题估值；仅按 $1.8B 等效条款投资
      - - Tier-1 大学合作伙伴退出
        - 合同不续约的公开公告（MIT、Harvard、Wharton、INSEAD、Cambridge）
        - 前五大大学品牌中任意一个流失
        - 品牌权益和招生受到重大损害；重估整套估值论点
      - - IPO 延至 FY2028 之后
        - 到 2027 年 12 月仍未提交 SEBI DRHP
        - Series F 交割后 36+ 个月仍未提交 DRHP
        - 退出选择受限；2029 年需要债务再融资；down-round 风险上升
      - - 债务契约违约或修订
        - 贷款方沟通、信用机构说明或公司新闻稿
        - Mars/HSBC 贷款出现任何豁免、暂缓执行或修订
        - 信用风险升级；可能出现稀释性股权补救；重跑悲观情景
      - - AI 竞争替代
        - 企业客户流失报道；NPS 下滑；AI L&D 平台市场份额数据
        - AI 工具从认证项目中拿走 >20% 企业 L&D 支出
        - 重估产品策略和定价模型；倍数可能压缩
    notes: 阈值为示意，应按持仓规模和组合授权校准。终止标准仅基于公开可观察信号；若有私有信息，阈值可能不同。
    claimRefs:
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 尽调事项
      - 优先级
      - 需要什么
      - 为什么重要
      - 状态
    rows:
      - - FY24 和 FY25 经审计合并财务
        - 阻断项
        - FY24 和 FY25 按 IND-AS 或 IFRS 编制的集团层面经审计 P&L、资产负债表、现金流量表
        - 独立估值唯一基础；双重 EBITDA 口径制造不确定性；ROC 申报只是子公司层面且不完整
        - 截至 2026 年 5 月不可得
      - - Series F 工具条款
        - 阻断项
        - 完整认购协议，包括：优先权堆栈、棘轮条款、清算瀑布、反稀释、拖售 / 随售和信息权
        - Inc42 报道的 $1.8B 棘轮若属实，经济估值会变成 $1.8B，而不是 $3.2B
        - 未公开披露
      - - 债务条款 — Mars/HSBC 贷款
        - 阻断项
        - 利率、基准利差、维持性契约、财务 KPI 触发器、股权补救条款、交叉违约条款
        - 条款未披露，无法评估下行杠杆风险和 EBITDA 契约缓冲
        - 未公开披露
      - - 大学合作伙伴集中度
        - 重要
        - 前 10 大大学合作伙伴的收入或招生贡献；Tier-1 合作伙伴合同期限和续约状态
        - 2U 先例说明大学合同流失会击穿论点；集中度没有公开数据
        - 未公开披露
      - - Cap table 和优先权堆栈
        - 重要
        - 完整资本结构表，列明股权类别、持股比例、清算优先权和 Series F 后任何二级交易
        - 悲观 / 基准情景下建模投资人层面回报必须依赖这些数据；优先权包袱可能清零普通股价值
        - 未公开披露
      - - FY25 中期收入和 EBITDA
        - 重要
        - 已确认的 FY25 H1 中期收入和权责发生制 EBITDA，与 ₹4,330-4,420 crore / ₹300 crore 目标对比
        - FY25 目标是 IPO-ready 叙事的主要催化剂；任何未达标都反向于论点
        - 尚不可得（FY25 于 2026 年 3 月结束）
      - - 企业板块收入拆分
        - 重要
        - FY23 和 FY24 企业 vs. B2C 收入拆分；企业增速和流失 / NRR 数据
        - 企业板块是质量最高的收入；40-45% 增速说法在集团层面尚未验证
        - 集团层面未披露
      - - IPO 顾问和投行授权
        - 次要
        - SEBI 注册牵头管理人名称和 DRHP 申报指示性时间线
        - 验证 IPO 认真程度；Series F 后 18 个月仍无授权，构成轻度担忧
        - 未公开披露
    notes: 优先级反映对投资决策的实质性：阻断项 = 没有它就不能出资；重要 = 影响回报模型；次要 = 验证叙事。所有事项均为截至 2026 年 5 月的公开信息缺口。
    claimRefs:
      - CV032
      - CV033
      - CV047
