          - type: callout
            title: DPDP 实施细则仍待出台：合规成本仍不确定
            body: >
              印度 DPDP Act 2023 已经生效，但截至 2026 年 5 月，界定 SDF 门槛、本地化要求和 Data Protection Board 执法机制的配套规则尚未通知。 以 Eruditus
              处理印度学习者数据的规模看，被认定为 Significant Data Fiduciary 几乎是确定事件。规则一旦落地，影响评估、本地化、同意管理平台升级等合规基础设施投入可能达到数百万美元， 并需要
              12-24 个月才能完全落地。这是真实但时间点不确定的成本风险；假设公司已经在建设合规能力，它还不是足以推翻投资逻辑的风险。
