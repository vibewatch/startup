            title: Coursera-Udemy 的规模差距是结构性的，不是战术性的
            body: >-
              合并后的 Coursera-Udemy 平台覆盖 290 million 名学习者和 18,000 家企业客户，相比 Eruditus 估计 3–4 million 名已报名学习者，拥有数量级优势。随着
              Coursera 继续在这一规模上部署 AI 个性化功能（Skills Tracks、Role Play），学习交付的边际成本进一步下降，价格性能差距会扩大。Eruditus
              短期内可以守住证书溢价，但职业证书长尾面临的商品化压力正在成为更大的结构性风险。
