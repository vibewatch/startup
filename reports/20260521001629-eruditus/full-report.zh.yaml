  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Eruditus 覆盖三个相邻但结构不同的市场。第一，全球线上高管教育：与顶级大学共创的高端队列制项目（通常 6–18
              周），面向希望在不离职情况下提升战略或职能技能的经理、总监、副总裁和高层领导。第二，职业技能提升与认证：覆盖数据科学、AI、数字营销、产品管理、金融和技术的多形态项目，面向任何希望获得证书背书技能的在职专业人士；价格低于高管项目，但明显高于大众
              MOOC 课程。第三，企业学习与发展（L&D）：通过私有队列、提供 200+ 个项目的公司品牌门户和定制 Academies，向企业、政府和机构交付合同制员工教育。

              市场边界明确排除传统校园住宿制 MBA 和 EMBA（需要线下搬迁和全日制学习）；K-12 和考试培训（就业前学习者）；没有队列结构或大学品牌、以 $10–$100 价格在 Coursera 或 Udemy
              销售的大众自定进度课程；以及没有高端机构背书的政府职业培训。Eruditus CEO Ashwin Damera 已将 Coursera、Udacity 和 Udemy
              列为竞争对手，确认公司与这些平台处在不同质量和价格层级。B2C 买方的现状替代方案，是参加同一大学的校园项目、报名自定进度 MOOC，或什么都不做。企业买方的替代方案，是内部学习团队、第三方企业培训师，或补贴校园
              MBA 报销。

              相邻领域包括线上学位项目（Eruditus 已表示计划扩展至线上研究生和本科项目）、政府员工发展合作，以及 AI 原生学习平台。公司的全球足迹——80+
              个国家，以英语、葡萄牙语、西班牙语和普通话开课——界定了其可服务市场的地理范围。
