      - number: '4.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: FY24 EBITDA 拐点在结构上可信
            body: >-
              权责发生制 EBITDA 亏损压缩 83%（₹417cr → ₹69cr），至少得到五个独立来源佐证，也符合营销成本下降（绝对额下降 ₹234cr）和运营费用压缩（下降
              ₹496cr）的算术。结构性杠杆是真实的：品牌成熟降低 CAC，课程削减改善收入质量，企业业务提速改善利润率结构。
            calloutType: strength
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
          - type: callout
            title: CPPIB $350M 子弹贷款到期（约 2027 年）是主导资本风险
            body: >-
              五年期子弹结构意味着约 2027 年 Q1 需偿还 $350M 本金。不同于已延期的 Mars/HSBC 融资，CPPIB 融资尚未公开披露续作或再融资。如果届时 Eruditus
              尚未完全转入权责发生制盈利，也未进一步融资，服务或再融资这笔大额债务将成为公司资本结构的决定性财务事件。
            calloutType: risk
            claimRefs:
              - CI024
              - CI025
              - CI037
          - type: callout
            title: 预订口径与权责发生制 EBITDA 差额造成披露模糊
            body: >-
              两位联合创始人对同一财年引用了实质不同的 EBITDA 数字（预订口径 ₹28cr vs ₹80cr；权责发生制
              ₹-69cr）。若公开申报文件没有正式递延收入调节表，投资者无法判断管理层把哪种口径作为运营基准，前瞻指引被误读的风险因此上升。
            calloutType: risk
            claimRefs:
              - CI016
              - CI018
              - CI019
              - CI020
          - type: callout
            title: 印度 + 企业收入结构转移是最可操作的利润率杠杆
            body: >-
              印度（约占 FY24 收入 28%）和企业（约 15%）都在以约 40% 同比增长。企业收入的 CAC 更低，LTV 高于开放报名
              B2C。若收入结构持续向这两个子板块转移，即使不依赖收入高速增长，也会在结构上把营销收入比压到 27% 以下，并加快 IPO 前实现权责发生制盈利的路径。
            calloutType: insight
            claimRefs:
              - CI030
              - CI031
              - CI032
              - CI038
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与交付机制
        blocks:
          - type: paragraph
            body: >-
              Eruditus 销售的组合比单一在线证书 SKU 更宽。公开界面覆盖短证书课程、高级管理者和 C-suite 学习旅程、训练营、PG
              文凭项目、企业教育以及合作伙伴品牌证书组合。交付模式最强的证据来自合作伙伴和企业页面，而不是泛营销首页：Columbia
              描述了十余年合作，围绕队列式学习、模拟和项目搭建；企业页面描述了小型私密在线课程，结合同步直播授课与异步自定进度学习；合作伙伴专属页面则显示，旗舰项目可以远长于典型短课刻板印象。


              这一点重要，因为公司的产品不只是内容托管。Columbia 的 CEO 项目被营销为 8 到 10 个月的旅程，包括 24 周核心在线学习、每周直播课、线下环节和 AI 主题课程。Wharton 和 MIT
              xPRO 的信息会页面进一步说明，许多项目仍依赖直播答疑、讨论、项目、结业作业和教师主导触点。因此，运营模型更接近托管式队列编排，而不是低触达 MOOC
              库。企业客户也可以购买公开队列名额，或委托开设私密队列并定制案例研究和参与者练习，把产品从个人技能提升拓宽到劳动力转型。
