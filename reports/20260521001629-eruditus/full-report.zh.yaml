  - id: FM001
    title: Eruditus 市场规模金字塔：TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: >-
      TAM 覆盖 $400B+ 全球 edtech 大盘；Eruditus 的 SAM 是大学合作型在线高管与专业教育高端子板块，结合多份分析师报告估计在 $80–110B 区间；SOM 是在定价、地域和渠道约束下，Eruditus
      实际可触达的机会。
    data:
      items:
        - label: TAM — 全球 edtech 支出（全板块）
          value: ~$404B (HolonIQ 2025 est.)
          note: 包括 K-12、高等教育 LMS、企业 HR-tech、消费应用；高管教育是子板块
        - label: SAM — 在线高管教育与专业技能提升
          value: ~$80–110B (analyst estimates, 2025–2026)
          note: 全球大学品牌在线项目 + 企业 L&D；不含 K-12、考试培训、MOOCs
        - label: SOM — Eruditus 可触达板块
