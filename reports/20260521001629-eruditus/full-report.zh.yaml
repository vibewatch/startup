      - number: '4.4'
        title: 债务融资、再融资与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的资本结构由长期股权和战略债务混合构成；公司在 2021 年后有意偏好债务，以在上一轮股权融资锚定 $3.2B 估值后减少稀释。累计股权融资约 $741M，投资者包括 SoftBank
              Vision Fund 2、Prosus Ventures、TPG Rise Fund、Accel、Peak XV Partners、Chan Zuckerberg Initiative、CPP
              Investments、Leeds Illuminate 和 GSV Ventures。2024 年 10 月 Series F（$150M，投后 $3.2B，由 TPG 领投）是 2021 年 8
              月以来首次股权融资。


              主要债务锚点是 CPP Investments（Canada Pension Plan Investment Board）提供的 $350M 五年期子弹贷款，2022 年 3
              月提取。该贷款没有定期现金利息——结构上是常规非现金付息债务——原本指定用于欧洲和亚洲市场收购。按 2022 年 3 月起的五年期限，约在 2027 年 Q1 到期，成为 Eruditus
              资产负债表上最关键的近期再融资事件。


              2025 年 9 月，Eruditus 完成来自现有贷款方 Mars Growth Capital（最高 $100M，Liquidity Group/MUFG 合资）和 HSBC（最高 $50M）的 $150M
              再融资。交易续作了 $130M 现有信贷并延长四年，新增 $20M 增量授信，将该融资到期推至约 2029
              年。公司拒绝披露利率或任何业绩约束条款。现金余额和月度运营烧钱未公开披露；这些数字缺失，限制了独立估算现金跑道的能力。


              Series F 之前，Inc42 报道 Eruditus 正与 TPG 深度谈判，估值 $2.3B——较 2021 年 8 月 $3.2B 峰值折价
              28%——并带有棘轮条款：若未达到未披露业绩目标，有效估值可能降至 $1.8B。最终 Series F 以投后 $3.2B 完成，说明要么谈出了溢价，要么交割前已达成业绩目标；从最初 $2.3B 谈判底线到最终
              $3.2B 定价之间的差距，值得投资者追问最终定价如何被合理化。
