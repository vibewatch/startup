      - number: '3.2'
        title: 高端高管教育直接竞争对手
        blocks:
          - type: paragraph
            body: >-
              Coursera 是高端证书细分市场最强的结构性竞争对手。Coursera 由 Andrew Ng 和 Daphne Koller 于 2012 年创立，已发展到 300+ 个大学和行业合作伙伴。2025
              年，Coursera 与 Udemy 合并形成覆盖全球 290 million 名学习者和 18,000 家企业客户的平台，相对 Eruditus 拥有数量级规模优势。Coursera for Business
              服务 4,700+ 家公司，拥有 10,600+ 门课程、1,400+ 个 specialization 和 165+ 个 Professional Certificates。AI 功能——Skills
              Tracks（Data、IT、GenAI）、Role Play 和 Course Builder——已在企业规模部署。合并 Udemy 后，Coursera 在自定进度内容体量和消费者可触达价格点上显著压过
              Eruditus（Coursera Plus 约每名学习者每年 $399–$499），但 Eruditus 的队列制、大学共创项目在高管细分市场仍保留高端证书优势。

              edX 由 2U 持有（2024 年 8 月 Chapter 11 破产），报告全球 100 million 名学习者，并通过高管教育项目服务 580,000+ 名专业人士。2U 拥有 250+ 个机构合作伙伴和
              5,300+ 个项目。破产和重组带来执行不确定性，但 edX 品牌和目录仍在运转。关键在于，2U/edX 与 Eruditus 争夺大学合作排他性：选择 2U 作为线上项目管理伙伴的学校，通常不能再与
              Eruditus 就重叠项目合作，反之亦然。2U 的财务压力为 Eruditus 获取合作伙伴创造竞争机会，也提供了一个警示先例：收入分成型 OPM 模式在规模化后会承受商业压力。

              大学直接面向学习者的替代方案，是 Eruditus 在高端市场面临的最高质量竞争威胁。Harvard Business School Online（HBS Online）提供每门约 $1,850 的证书项目，以及
              $15,000、一年期的 CLIMB leadership credential；94% 学习者称 HBS Online 比其他线上商学项目更有影响，学习者报告的平均投资回报为 11x，包括平均薪资增长
              $20,466。Wharton Executive Education 提供 live online、自定进度和混合形式项目，包括面向高管的旗舰 Advanced Management
              Program。London Business School Executive Education——2026 年被 Financial Times 评为开放式高管教育全球第一——在
              London、Dubai、Saudi Arabia 和线上提供项目。这些大学直达替代品被定位为 Eruditus 与同等或相近机构共创项目的高端替代；如果 Harvard 或 LBS
              激进扩张直达渠道，中介平台的收入分成逻辑会被侵蚀。

              The Economist Education 是一家媒体品牌高管教育细分竞争者，向 100+ 个国家的专业人士提供 CPD 认证线上课程和线下 / 线上 masterclasses，已培训 7,000+
              名专业人士。它靠编辑可信度和品牌信任竞争，而非大学证书分量。
