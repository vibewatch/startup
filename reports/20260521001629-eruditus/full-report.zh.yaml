      - number: '4.2'
        title: 成本结构与盈利路径
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的成本模型有三根支柱：营销与获客、大学收入分成费用、平台运营。营销是结构上最显眼的费用，FY23 消耗收入 29%（₹1,241 crore），FY24 改善到 27%（₹1,007
              crore）——尽管收入温和增长，绝对额下降 18.85%。这种压缩是 FY24 EBITDA 改善的主要驱动；管理层预期，品牌认知成熟、项目组合提高客户终身价值后，营销占比还会继续缓和。


              大学合作费用——支付给机构合作伙伴的收入分成——在 FY23 约占集团总支出的 31%（总费用 ₹4,392 crore 中的 ₹1,356
              crore）。这些费用相对业务量在结构上半固定，意味着毛利率受合作伙伴经济性封顶，不能自由扩张。FY23 毛利约 ₹1,734 crore，收入 ₹3,320 crore，对应约 52%；FY24
              毛利率未单独披露，但运营费用下降说明可能小幅改善。平台其他运营费用从 FY23 的 ₹1,541 crore 降至 FY24 的 ₹1,045 crore，下降 32.16%，反映了低表现课程削减和运营效率项目。


              FY24 权责发生制净 EBITDA 亏损 ₹69 crore（-1.8% 利润率）幅度很薄，但轨迹强劲：FY23 亏损 ₹417 crore，FY24 亏损 ₹69 crore，按预订口径已实现盈利。FY24
              以美元计的净亏损从 FY23 的 $127.2M 收窄至 $85.6M。FY25 权责发生制 EBITDA 利润率能否持久转正，取决于在收入增长 15–20% 的同时守住约 2
              个百分点的营销成本率下降——这个条件有可能成立，但尚未被已披露业绩确认。
