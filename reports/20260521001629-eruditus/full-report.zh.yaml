        - 谨慎：轨迹向好，但透明度不足
      - - 估值
        - Pre-IPO 非流动性溢价属于常规；印度增长故事支撑溢价；$3.2B 仅约为 FY24 收入 7x
        - 7.1x EV/Rev，而 Coursera/Udemy 为 1-2.4x；Series F 前以 $2.3B 谈判，并带 $1.8B 棘轮
        - 反向：任何可比口径都无法支撑该溢价
      - - 资本结构
        - 2025 年 9 月再融资移除 2025 年到期压力；Mars/HSBC 四年期贷款为 IPO 争取时间
        - 债务条款未披露；$150M 利率不明；优先权堆栈和棘轮未披露
        - 谨慎：出资前需要结构清晰
      - - IPO / 退出
        - 注册地迁移正在推进；印度市场接纳大盘科技上市；CEO 承诺推进 IPO
        - 尚未提交 DRHP；未披露投行；需先拿出 3 年经审计财务；FY25 目标必须兑现
        - 谨慎：FY2027-28 有可能 IPO，但不确定
    notes: 评估仅基于公开证据的定性判断。净判断反映证据权衡；不包含法律、监管或税务分析。
