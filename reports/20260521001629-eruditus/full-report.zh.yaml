companyProfile:
  summary: >
    Eruditus 是 Emeritus 品牌的新加坡总部母公司，由 Ashwin Damera（CEO）和 Chaitanya Kalipatnapu（执行董事）于 2010 年在印度 Chennai 创立。公司与 80+
    顶级大学合作共创并交付线上高管教育项目，合作方包括 Harvard Business School、Columbia Business School、MIT、IIMs 和 ISB；面向全球在职专业人士，既做 B2C 招生，也签企业
    L&D 合同。截至 2024 年 10 月，Eruditus 已服务 80+ 国家超过 1 million 名学习者，运营 700+ 个项目。FY24 收入达到 ₹3,733 crore（$448M），同比增长 12%；权责发生制
    EBITDA 亏损收窄 83% 至 ₹-69 crore，按预订口径计算的 EBITDA 转正。2024 年 10 月 Series F 从 TPG Rise Fund 募得 $150M，投后估值持平在 $3.2B，与 2021 年
    8 月 Series E 相同，确认 38 个月内是一轮平轮融资。未偿债务 $150M（Mars Growth Capital / HSBC，约 2029 年到期）在拟议 IPO 前增加了资产负债表风险。
