      - number: '5.4'
        title: 大学供应链与内容生产模型
        blocks:
          - type: paragraph
            body: >-
              最好的公开证据显示，Eruditus 夹在大学、教师和学员之间，是生产与编排伙伴，而不是录播课的简单转售商。Columbia 合作页面强调队列式教学、体验式学习、模拟、项目和长周期 C-suite
              旅程；Wharton
              证书页面强调模拟和同伴互动；企业页面称私密队列可定制课程负责人、案例研究和参与者练习。招聘语言也指向项目管理、服务交付和大学合作中的持续人工运营角色。合在一起，这些细节意味着一条供应链：教师公信力和机构品牌来自大学，Eruditus
              管理包装、咨询、排课、协调和学员支持。


              明显缺失的是合同层。已抓取材料没有说明收入分成比例、IP 归属、排他条款、新产出案例研究由谁拥有，或内容生产流程在不同学校间有多标准化。这个缺口重要，因为 Eruditus
              的护城河取决于难点到底是持久的机构工作流整合，还是临时的营销与交付支持。公开证据支持共创、教师参与和定制化；但尚不足以强力证明 Eruditus 拥有大学关系中最深的经济层或 IP 层。
