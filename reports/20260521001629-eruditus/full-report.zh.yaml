      - number: '3.3'
        title: 企业 L&D 与职业认证竞争对手
        blocks:
          - type: paragraph
            body: >-
              LinkedIn Learning 是企业软技能和持续学习平台的主导者，背靠 Microsoft，并整合进 LinkedIn 的 1 billion 会员职业网络。LinkedIn Learning 提供 25
              种语言的 24,000+ 门专家主导课程，配有 AI 驱动 coaching、role-play simulations，以及来自 LinkedIn talent graph 的实时职业智能。企业报告的参与度高
              5x，AI 技能增长快 3.4x，内部流动率高 20%，员工任期长 22%，均相对基准。相较 Eruditus，LinkedIn Learning
              的关键限制是缺乏大学品牌证书，并且在高管领导力或战略转型项目上深度有限——这些正是 Eruditus Enterprise 队列制模式最强的领域。不过，LinkedIn Learning 直接争夺
              Eruditus Enterprise 也瞄准的、大体量订阅式企业 L&D 预算，尤其是在连续学习任务中，每名学习者经济性更偏向平台模式，而非队列项目。

              Udacity 专注技术技能——AI、云计算、数据科学和编程——是雇主赞助知识工作者技术技能提升的领先玩家。Udacity 的企业产品引用 Siemens 案例研究中的 200% ROI、生产力提升
              35%、达到能力标准速度较传统培训快 2x，以及学习支出平均每年节省 $1.5 million。Udacity 的 Nanodegree 项目包含与头部科技公司设计的实战项目。Udacity
              不在高管领导力、商业战略或金融项目上与 Eruditus 竞争，但会拿走 Eruditus Enterprise 技术技能项目也瞄准的一部分企业 L&D 预算，尤其是在印度和全球 IT 组织中。

              Simplilearn 运营一个 AI 优先企业培训平台，项目与认证机构、大学和包括 Google Cloud、AWS、Microsoft 在内的科技公司共创。公司报告 80+%
              课程完成率，并营销从技能缺口评估到可衡量业务影响的结构化结果驱动模式。Simplilearn 在全球科技技能企业预算上与 Eruditus 最直接竞争，但缺乏大学队列溢价和高管项目深度。

              Great Learning（2021 年被 BYJUS 收购）拥有 14 million 名学生和校友，项目评分 4.6/5，声称项目后平均薪资增长 50%，并列出 4,500+ 家招聘公司。在 BYJUS
              旗下，Great Learning 因母公司财务困难面临运营不确定性；这会限制其近期竞争强度，但不会消除其作为南亚和全球职业 upskilling 市场长尾玩家的存在。

              NIIT 是传统 IT 培训既有玩家，通过托管培训服务和数字技能项目服务企业客户。NIIT 在企业 IT 培训和托管学习外包中竞争，但在高管队列细分市场缺乏声望。upGrad 是印度按总收入计最大的高端
              edtech（FY25 约 Rs 1,943 crore），主要竞争印度 B2C 职业技能提升市场；相较 Eruditus，其关键差异点是与 LJMU、Deakin、MICA 和 IIT Madras
              的授予学位合作，以及 2,500+ 个招聘伙伴网络。
