      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >
              Eruditus 第一轮主要外部资本来自 Bertelsmann，随后在早期增长轮中引入 Sequoia India（现 Peak XV）和 Prosus。2021 年 edtech
              热潮期间，融资节奏明显提速。2021 年 8 月，Eruditus 完成由 Accel US 和 SoftBank Vision Fund 2 领投的 $650 million Series E，投后估值
              $3.2 billion。其中包括 $430 million 新股融资和 $220 million 老股出售；Bertelsmann 通过老股部分退出，CPPIB 同时参与新股和老股交易。Series E 使
              Eruditus 成为 2021 年第 23 家印度独角兽，估值达到此前约 $800 million 的四倍。

              2022 年 3 月，Eruditus 从 CPP Investments Credit Investments Inc. 获得 $350 million
              常规债务融资，结构为五年期到期一次性偿还、无定期现金利息，主要用于欧洲和美国 M&A。2021 年 5 月，公司在 Series E 前以约 $200 million 收购 iDTech（一家位于 Silicon
              Valley 的 K-12 STEM 平台），这笔收购加入了 K-12 业务，并实质改变了公司画像。

              最近一次股权事件是 2024 年 10 月 Series F：由 TPG 的 The Rise Fund 领投，以 $3.1–3.2 billion 持平投后估值融资 $150 million（TPG 和
              Economic Times 报道为 $3.2B；Tracxn 和 Moneycontrol 报道为 $3.1B）。TPG 出资 $100 million；SoftBank 追加投资 $20
              million。所有主要既有投资人（SoftBank VF2、Leeds Illuminate、Accel、CPP Investments、Chan Zuckerberg
              Initiative）均参与。Eruditus 称公司已在全年口径实现盈利，并被 Time 杂志评为 #1 Global EdTech，为本轮融资提供背景。相较 2021 年估值持平，既反映了 edtech
              行业整体估值下修，也反映 Eruditus 自身盈利路径较长。

              2025 年初，Eruditus 对 Mars Growth Capital（Liquidity 与 MUFG Bank 的合资公司）和 HSBC 的 $130 million
              信贷额度进行再融资，将这笔四年前的额度续期四年，并获得额外 $20 million 授信，使再融资额度总额达到 $150 million。CPP Investments 的 $350 million
              到期一次性偿还债务仍未偿还，将在 CPPIB 额度期限结束时到期。各轮累计股权融资根据来源不同约为 $741–$814 million。
