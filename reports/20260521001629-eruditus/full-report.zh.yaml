      - number: '7.5'
        title: 行业放缓、AI 冲击与 IPO 执行风险
        blocks:
          - type: paragraph
            body: >
              2022 到 2025 年，教育科技行业持续融资收缩，驱动因素包括利率上升、COVID 后入学正常化让投资者失望，以及高知名度困境事件（Byju's 资不抵债、Unacademy 裁员、2U
              破产）。Eruditus 运营表现跑赢同行——维持收入增长并收窄亏损——但无法免疫行业层面的估值折价。CEO 明确承认，投资者普遍担心印度教育科技行业，并把它与美国教育科技同行作不利比较。这种投资者情绪会压低
              IPO 估值倍数上限。The Economist 2024 年 5 月对在线高管教育的分析指出，大学重新评估 OPM 成本结构、学员越来越多寻找低价替代方案后，该模式正在经历一次“清算”。AI
              冲击是中期结构性威胁：Goldman Sachs 估计 GenAI 可能替代 300M 全职当量岗位，悖论式地创造再培训需求；但 AI 原生学习工具（OpenAI、Google、Duolingo）可能以每月
              $0-$50 的价格满足越来越多需求，而 Eruditus 项目价格为 $1,000-$10,000+。竞争整合正在加速，Coursera 据报道正在探索收购，可能集中企业学习市场。IPO
              执行风险显著：Eruditus 目标“从现在起两年”上市（按 2024 年 10 月访谈约为 FY2026-27），需要达成 FY25 收入和 EBITDA
              里程碑、完成住所迁回印度，并遇到有利资本市场环境。任一条件都可能延后。
