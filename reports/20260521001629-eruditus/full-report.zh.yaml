  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入轨迹与增长特征
        blocks:
          - type: paragraph
            body: >-
              Eruditus 从 FY22 约 ₹1,900–1,962 crore 增长到 FY24 的 ₹3,733 crore（$448M），跑出了印度大型教育科技队列中最快的收入爬坡之一。FY22 到 FY23
              增长约 70–75%，由激进地域扩张、新大学合作和高营销投入推动。FY23 到 FY24 增速大幅降至 12%——这更像是有意转向单位经济纪律，而不是需求端恶化；整体节奏放慢时，印度和企业板块仍同比增长约
              40%。


              按绝对收入看，Eruditus 是 FY24 印度最大的运营中教育科技公司，约为 PhysicsWallah（₹2,015 crore）的 1.9 倍，超过 UpGrad（₹1,487 crore）的 2
              倍。收入结构偏向北美：美国贡献 FY23 收入约 44%，印度占 FY24 收入 27–28%，拉美约 16%，欧洲约 11%。管理层目标 FY25 收入 ₹4,330–4,420
              crore（$520–530M），对应约 15–18% 增长；2024 年 11 月 Business Standard 访谈还引用了 25–30% 同比增长的愿景目标。FY25 指引包含一个结构性顺风：FY24
              已收款但在权责发生制资产负债表上递延的 ₹800 crore 将确认收入。


              企业账户目前约占收入 15%，同比增长 40%；如果该子板块提速，收入结构可能转向质量更高、营销强度更低的来源，并显著改善持续 EBITDA 盈利的路径。按 Damera
              的公开指引，印度业务正走向“未来五年”占公司 50% 的轨迹，这对收入质量和监管住所都有重要结构性影响。
