      - number: '7.2'
        title: 大学合作伙伴集中度与平台依赖风险
        blocks:
          - type: paragraph
            body: >
              Eruditus 的商业模式在结构上依赖 80+ 大学合作组合，其中 MIT、Harvard、Wharton、INSEAD、Cambridge 和 Columbia 等顶级 Tier-1
              机构提供推动学员获取和定价权的品牌资产。公开渠道没有这些合作伙伴的收入或报名集中度数据，形成尽调盲点：如果前 5 个大学品牌占预订额的 50%+，即便流失一个 Tier-1 合作伙伴，也会造成实质损害。2U
              Inc. 2024 年 Chapter 11 破产申请，是在线项目管理（OPM）模式最直接的警示先例：2U 建立了 130+
              大学合作组合，但当招生经济性恶化、大学寻求重谈或终止收入分成合同时，模型的单位经济性崩塌。美国大学也越来越从声誉角度审视 OPM 成本分摊安排。Eruditus
              认为自身模式有差异——它从全球获取学员并提供全栈项目交付——但对合作伙伴品牌信任的依赖在结构上类似。计划从 80 所扩张到 150
              所大学合作，引入了执行风险：品牌信号较弱的机构进入一个目前受益于精英品牌光环的队列。任何投资在准确建模终局收入风险前，都必须拿到合作伙伴集中度数据。云平台（AWS/GCP）和
              LMS（Canvas/Instructure）依赖构成次级运营风险，通常可通过标准合同缓释，但没有披露 SLA 承诺。
