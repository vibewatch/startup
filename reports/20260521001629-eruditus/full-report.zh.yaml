      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的市场有两类主要买方画像，各自预算归属、购买触发点和项目偏好不同。B2C 买方是在职专业人士——通常是 25–50
              岁的经理、总监或职能专家——自费或争取雇主报销结构化证书或高管项目。购买触发点是职业发展：晋升资格、薪资谈判、岗位转换（例如工程师转产品经理、金融转战略），或面向客户 /
              领导职能所需证书。使用者和付款人通常是同一人。项目价格从较短职业证书的约 $2,000 到高管领导力项目的 $12,000+ 不等，显著高于 MOOC 定价，需要主动销售和学术顾问流程来完成转化。

              B2B 企业买方是 Chief People
              Officer、学习与发展副总裁，或委托组织级员工发展的业务线负责人。企业交易涉及机构采购流程、围绕转型主题（AI、数字化、可持续、领导力、数据）定制项目设计，以及对完成率和技能成果指标的分析报告。Emeritus
              企业平台提供团体报名、私有队列、带有 200+ 个大学背书项目的公司品牌门户，以及定制 Academies。企业学习者影响数据强：94% 的学习者报告职业发展产生正向影响，77% 能在工作中立即应用所学，90%
              看到组织层面正向影响——这些指标是公司 B2B 销售中的主要留存论据。

              大学在该模式中是供给侧合作伙伴，不是买方：它们共同设计内容，提供师资专长和机构品牌，并与 Eruditus 分成经济收益，但并不采购服务。政府是新兴买方类别，尤其是在寻求全国员工发展能力的新兴经济体；TPG
              Series F 新闻稿特别将政府项目列为增长领域。买方地域分布——按 2021 年 CEO 说法，约 80% 报名来自印度以外——使跨境需求成为市场的定义性特征，也是相对印度聚焦 edtech
              同业的关键风险分散器。
