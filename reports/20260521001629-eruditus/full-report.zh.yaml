      - number: '4.5'
        title: 收入质量、利润率路径与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Eruditus 拥有印度总部教育科技公司中最强的收入轨迹，但 FY24 财务数据提出了一系列值得尽调的问题，成长股权投资者在承销前必须解决。收入质量中高：高管教育模式带来较高学员投入度，相对可预测的企业 B2B
              合同，相比 K-12 考试培训退款暴露有限。但大学收入分成模式在结构上封顶毛利率（估计上限约 50–55%），重营销依赖（收入的 27%）意味着扣除总部费用前的贡献利润率仍然偏薄。


              权责发生制 EBITDA 亏损轨迹（₹417cr → ₹69cr）有说服力，预订口径盈利也是有意义的运营里程碑。不过，公开渠道没有已审计的 FY24 或 FY25
              全年集团损益表、合并现金流量表和契约层级债务披露，任何承销都必须基于公司声称数字，而不是已验证申报文件。CPPIB 的 $350M 子弹贷款约 2027 年到期，是单一最大财务风险：如果 Eruditus
              无法用经营现金流或新股权融资再融资或偿还该贷款，它将在本已资本密集的行业中面临显著杠杆压力。
