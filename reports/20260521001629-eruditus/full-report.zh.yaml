      - number: '5.3'
        title: AI、个性化与企业产品
        blocks:
          - type: paragraph
            body: >-
              官方 AI 证据存在，但成熟度层级不同。2024 年 10 月 Series F 新闻稿是最清楚的产品表述：管理层称 Eruditus 已经为学生和合作学校项目推出自研 AI 驱动导师，新资金将加深 AI
              投资以丰富学员体验，同时加速企业和政府业务增长。2025 年 6 月 Rotman 项目上线进一步证明，AI 已成为活跃的课程目录和市场进入主题，而不只是主题演讲话术。Columbia 的 CEO 项目也显示
              AI 内容进入旗舰领导力旅程；Emeritus AI/ML 分类页则说明 AI 相关产品组合正在扩大。


              缺口在于，官方页面披露 AI 课程主题远多于 AI 系统架构。公开渠道没有导师效果基准，没有自适应学习逻辑说明，也没有技术解释说明个性化是基于规则、生成式，还是按合作学校定制工作流。企业界面比 AI
              界面说明更充分。Emeritus 称私密队列可围绕业务语境定制，雇主可通过门户管理审批和参与度，且门户无需与现有系统集成。结合 Eruditus
              围绕团体报名、私密队列和定制内容的定位，企业产品更像精选的队列管理和服务层，而不是具备深度文档化集成的广义席位制 LMS 平台。
