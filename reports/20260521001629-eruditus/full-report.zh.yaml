      - number: '7.3'
        title: 监管、隐私与合规风险
        blocks:
          - type: paragraph
            body: >
              Eruditus 运营跨司法辖区教育服务业务，处理 80+ 国家学员个人数据，带来层层叠加的隐私和监管合规义务。印度 2023 年 8 月颁布的 Digital Personal Data
              Protection（DPDP）Act 是最重要的近期监管变化：该法建立了同意要求、数据主体权利（访问、更正、删除、申诉）、重大数据受托人（SDF）义务以及跨境数据传输限制。截至运行日期，DPDP
              实施规则（二级立法）尚未最终确定，合规投入范围仍不确定。规则一旦通知，像 Eruditus 这样大规模处理印度公民数据的公司几乎肯定会被认定为 SDF，触发更高审计、影响评估和本地化义务。在欧盟，GDPR
              约束欧洲学员数据，违规罚款显著。在美国，FERPA 通过大学合作关系适用，可能涉及学生教育记录。新加坡 PDPA 在住所从新加坡迁至印度期间仍相关。UGC 在线教育法规约束印度机构合作伙伴，并影响
              Eruditus 如何与印度大学设计证书项目。截至运行日期，公开记录中未发现针对 Eruditus
              的执法行动或监管调查。公司维持正式隐私政策框架、数据保护官和漏洞披露项目——但没有公开漏洞赏金项目，第三方安全覆盖有限。住所迁回印度会引入治理过渡期：印度证券法规、FDI 规范和 ROC
              要求将在迁移完成前叠加到既有新加坡义务之上。
