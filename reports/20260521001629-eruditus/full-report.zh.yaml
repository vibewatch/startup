  - id: FV001
    title: 推荐逻辑：支撑继续研究结论的因素
    type: flow
    layout: standard
    summary: 决策树概括四项因素，它们共同指向：以 $3.2B Series F 入场价看，Eruditus 应继续研究。
    data:
      nodes:
        - id: market
          label: |-
            市场环境
            [正面]
          description: 全球企业 L&D $350B+；企业板块同比增长 40-45%；印度再技能化顺风
        - id: moat
          label: |-
            产品 / 护城河
            [正面]
          description: 80+ 所精英大学合作方；Harvard、MIT、Wharton、IIMs；难以复制
        - id: financial
          label: |-
            财务轨迹
            [谨慎]
          description: FY24 收入 $448M；EBITDA 改善；但增长放缓（13.8%），且无经审计集团财务
        - id: valuation
          label: |-
            估值入场
            [反向]
          description: EV/Revenue 7.1x，对比 Coursera 1.4-2.4x、Udemy ~1x；溢价 3-5x；平轮；ratchet 信号
        - id: governance
          label: |-
            披露 / 治理
            [谨慎]
          description: 无经审计集团财务；两套 EBITDA 口径；债务条款和股权结构未披露
        - id: recommendation
          label: → 继续研究
          description: 公开可比证据支撑不了价格；关键尽调缺口阻碍资本承诺
      edges:
        - from: market
          to: recommendation
          label: 支撑论点
        - from: moat
          to: recommendation
          label: 支撑论点
        - from: financial
          to: recommendation
          label: 改善但不透明
        - from: valuation
          to: recommendation
          label: 主要反向因素
        - from: governance
          to: recommendation
          label: 阻断性缺口
    sourceRefs:
