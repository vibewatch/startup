      - number: '5.2'
        title: 平台栈、学员流程与公开可见工具
        blocks:
          - type: paragraph
            body: >-
              公开点名的课堂栈比 Eruditus 品牌叙事暗示的更窄，也更商品化。最清楚点名的系统是 Canvas：官方帮助中心把学员引导到
              admissions.emeritus.org/classroom/login，并称仪表盘会显示已报名课程。作业延期也通过 Canvas 仪表盘功能处理，第三方评论材料称浏览器兼容性绑定当前
              Chrome、Edge、Safari 和 Firefox 版本，并需要 JavaScript、cookies 和 Respondus LockDown Browser 支持。这些细节说明，核心学习环境是配置好的
              LMS 工作流，而不是独特披露的自研课堂引擎。


              学员体验层在上述基础上增加便利性和编排。Google Play 上的 Emeritus Classroom 应用在移动端提供成绩、课程内容、作业、讨论板、消息、测验、日历和通知。证书签发也外部化：Emeritus
              称证书通过 Accredible 签发，在作业完成并评分后邮件发送，并可用于社交分享或 PDF 下载。围绕该技术栈，Eruditus
              发布漏洞披露政策、隐私通知和可访问性声明，显示了基线合规姿态，但不是投资者通常想要的更深企业安全证据。实际看，产品像是在第三方课堂和证书工具之上的托管编排层；对于网络研讨会工具、监考或身份架构，公开披露有限。
