  - id: FI001
    title: 收入模型桥接——从学员活动到平台经济
    type: flow
    layout: wide
    summary: 在 Eruditus 与大学合作伙伴的收入分成模式下，学员报名如何转化为已收费用、确认收入和近似 EBITDA。
    data:
      nodes:
        - id: enroll
          label: 学员报名（1M+ 学员、80+ 个国家、700+ 个项目）
        - id: fees-collected
          label: 已收总费用（booking 口径，估算 FY24 超过 ₹4,500 crore）
        - id: deferred
          label: 递延至 FY25：₹800 crore（约占已收费用 18%）
        - id: recognized
          label: 已确认收入（权责发生制，FY24）：₹3,733 crore
        - id: univ-share
          label: 大学收入分成（估算约占收入 31%）：约 ₹1,158 crore
        - id: gross-profit
          label: 平台毛利（估算约 52% 毛利率）：约 ₹1,940 crore
        - id: marketing
          label: 营销与获客：₹1,007 crore（占收入 27%）
        - id: opex
          label: 其他运营费用：₹1,045 crore（占收入 28%）
        - id: ebitda
          label: 调整后 EBITDA（权责发生制）：₹–69 crore；booking 口径：₹+28–80 crore
      edges:
        - from: enroll
          to: fees-collected
          label: 项目报名触发缴费
        - from: fees-collected
          to: deferred
          label: 项目尚未交付 → 递延收入负债
        - from: fees-collected
          to: recognized
          label: 项目已交付 → 按权责发生制确认收入
        - from: recognized
          to: univ-share
          label: 按合同向合作大学转付收入分成
        - from: recognized
          to: gross-profit
          label: 扣除大学分成后的留存平台毛利率
        - from: gross-profit
          to: marketing
          label: 营销投入获取下一批学员
        - from: gross-profit
          to: opex
          label: 平台运营、技术和项目交付成本
        - from: gross-profit
          to: ebitda
          label: 扣除营销和运营费用后的剩余——FY24 接近盈亏平衡
    approximationNotes: >-
      大学收入分成比例（估算约 31%）由 FY23 项目费用数据（Financial Express）外推；FY24 数字未单独披露。毛利估算为方向性判断。booking 口径费用收取额由已确认 ₹3,733 crore 加递延
      ₹800 crore 推算。
