  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与分层
        blocks:
          - type: paragraph
            body: >-
              Eruditus 以 Emeritus 消费者品牌运营，跨三个结构不同的细分市场竞争，各市场在商业模式、买方、定价和护城河类型上都不相同。

              细分 1——高端大学合作线上高管与职业教育——是核心市场。Eruditus 与 80+ 所大学共创项目，包括 Harvard Business School、MIT、Columbia Business
              School、ISB 和 IIMs，通过收入分成模式在全球招收学习者，并运营约 700+ 个职业学习项目。这里的直接同业是 Coursera——它最近与 Udemy 合并，覆盖 290 million 名学习者和
              18,000 家企业客户——以及 edX，后者由 2U 持有（2U 于 2024 年 8 月申请 Chapter 11 破产，但仍在运营）。大学直接面向学习者的替代方案——HBS Online、Wharton
              Executive Education 和 London Business School Executive Education（2026 年 FT
              开放式高管教育全球第一）——也通过不经第三方中介的品牌短期线上项目参与竞争；如果大学扩大这些渠道，收入分成逻辑会被削弱。

              细分 2——企业学习与发展（L&D）——是 Eruditus Enterprise 争夺企业员工发展预算的市场。这里赛道更宽：LinkedIn Learning（Microsoft 子公司，在 LinkedIn
              1 billion 会员职业网络内集成）、Udacity（AI、云和数据技能，聚焦企业 ROI 合同）和 Simplilearn（AI-first 企业培训，80+%
              完成率）都是企业优先玩家。这些竞争对手更重订阅模式、技能型课程和 HR-tech 集成，而不是大学证书声望；它们以更低平均售价覆盖大得多的单席位规模。Eruditus Enterprise
              的队列制、大学品牌项目靠证书分量和转型深度竞争，而非目录广度。

              细分 3——印度和新兴市场区域职业技能提升——包括 upGrad（按总收入计为印度最大仍存续高端职业 edtech，FY25 约 Rs 1,943 crore）、Great Learning（14 million
              名学生和校友，但受 BYJUS 所有权限制运营）、NIIT（传统 IT 培训既有玩家）以及新的激进定价进入者。Eruditus 约 27–28% 收入来自印度，使该细分在边际上有意义，但不是主要战略战场。

              现状替代方案仍然重要：经理可以参加同一大学的校园项目（高管 MBA 或短期住宿通常 $10,000–$60,000+）、以 $10–$500 自学自定进度
              MOOC，或完全推迟学习。内部企业培训团队是企业端现状替代方案。可能进入者包括 AI 原生微学习平台，以及 Google、Microsoft、AWS
              等科技公司职业认证项目；它们在没有大学声望溢价的情况下竞争技能证书预算。
