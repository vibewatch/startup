      - number: '7.6'
        title: 风险登记、缓释与打破投资逻辑的标准
        blocks:
          - type: paragraph
            body: >
              Eruditus 的综合风险更适合归为「可控但不透明」：核心收入模式已经跑通，债务由可信机构按市场化条件再融资，短期流动性也没有陷入危机。 但债务条款未披露、大学伙伴依赖集中、IPO
              执行路径尚未验证且市场环境不友好，再叠加多司法辖区监管切换，剩余风险仍足以支撑中高风险评级。 投资人应重点盯四个指标：（a）FY25 EBITDA 是否达成 ₹300 crore 目标——这直接影响 IPO
              估值叙事；（b）大学合同是否续约、终止或重谈的公开披露； （c）DPDP、GDPR 或 UGC 规则下是否出现监管调查或执法通知；（d）收入增速能否从 12% 重新逼近 25-30% 的目标轨迹。
              破坏投资逻辑的触发点包括：24 个月内失去两个或以上 Tier-1 大学伙伴、FY25 EBITDA 低于目标超过 30%，或发生重大债务契约违约。 尽调应索取：大学收入集中度数据（前 5、前 10
              占比）、完整债务条款（含契约和定价）、FY25 按月收入轨迹，以及 DPDP 合规路线图。 人员风险被低估：公司尚未公开讨论过联合创始人 Ashwin Damera 或 Chaitanya Kalipatnapu
              的继任安排。
