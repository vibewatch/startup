      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              Eruditus 的总可用市场（TAM）高度取决于边界怎么划。最宽的相关框架是全球 edtech 市场，HolonIQ 估计其到 2025 年达到 $404B，较 2019 年基准 CAGR 为
              16.3%；但这个口径包括 K-12 教育软件、校园学习管理系统、企业 HR-tech 和大众消费者应用，其中大多数并非 Eruditus 的竞争细分市场。即便在 $404B 总量里，HolonIQ 也指出
              edtech 支出仅占 $7.3T 全球教育市场总额的 5.5%，说明传统教育仍主导绝对支出，而数字交付拿走增长份额。

              多家独立分析机构——Research & Markets、Future Market Insights、Mordor Intelligence 和 The Business Research
              Company——都发布了高管教育或职业发展市场专题报告，但它们的范围定义、基准年份和 CAGR 假设差异很大，不先调和方法论就直接比较并不可靠。Grand View Research 另行覆盖了更广义的
              e-learning 市场，该市场包含但宽于高管教育子板块。本分析采用保守的多镜头方法：TAM 估计为更广义的全球线上职业教育市场（所有寻求职业导向证书、线上交付的成人学习者）；SAM
              是全球分布的高端大学共用品牌线上高管和职业项目细分市场，也就是 Eruditus 实际竞争的领域；SOM 反映 Eruditus 在其大学网络、语言覆盖、价格点和地理集中度下的当前渗透。

              SAM 和 SOM 数字受到私人数据缺失的明确约束。Eruditus 没有按足够精度披露分板块或分地区收入，无法推导出站得住的 SOM。规模测算表把相关子市场的分析师估计与可观察代理指标（Eruditus
              收入、学习者数量、企业增长率）并列呈现。读者应将 SAM 和 SOM 条目视为说明性的数量级区间，而非经审计的市场份额。分析师估计区间很宽，本身就有信息量：不同发布方的范围假设互相矛盾，对用单一自上而下 TAM
              支撑估值的投资人构成尽调风险。
