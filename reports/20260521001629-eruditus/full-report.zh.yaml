      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: AI 技能需求是 Eruditus 的短期顺风，也是长期结构性风险
            body: >-
              2024 年 10 月 Series F 前一年，企业板块收入增长 45%，管理层称 AI 技能提升需求是主要驱动因素。这与 LinkedIn 数据相一致：职业发展冠军组织成为 AI 采用领跑者的概率高
              42%；Goldman Sachs 估计生成式 AI 可将全球 GDP 提高 7%，制造管理层 AI 熟练度的企业级紧迫感。短期顺风是真实的。结构性风险在于，同一套拉动需求的 AI
              能力也会压缩内容生产成本，可能让低成本平台侵蚀 Eruditus 当前通过大学品牌收取的价格溢价。尽调应评估 Eruditus 是否拥有超越第三方 LLM 集成的自研 AI
              产品深度（tutors、测评、个性化），以及 AI 专项队列的企业合同续约率是否高于或低于整体企业留存基线。
