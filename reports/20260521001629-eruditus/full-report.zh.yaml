  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 在 Emeritus 品牌下，B2C 和企业买方路径从初次发现到项目完成和扩张的各阶段。
    data:
      nodes:
        - id: discover
          label: 发现
          description: B2C 学员通过搜索、社交媒体和合作大学营销找到 Emeritus。企业买方则来自销售触达、网络研讨会和采购渠道。
        - id: evaluate
          label: 评估
          description: B2C 学员参加说明会或咨询顾问。企业 L&D 负责人收到覆盖 Accelerate、Academies 或 Private Cohort 选项的方案。
        - id: enroll
          label: 报名
          description: 个人支付学费或使用雇主报销。企业买方通过门户完成多席位报名、审批流程和账单处理。
        - id: learn
          label: 在读项目
          description: 通过 Canvas 进行基于班级的在线学习；包含直播课、同伴讨论、案例研究和作业。项目时长从数周到面向高管旅程的 8–10 个月不等。
        - id: complete
          label: 完成
          description: 公司报告完成率为 85%。必要作业评分后，签发大学品牌 Accredible 证书。完成里程碑在门户中跟踪。
        - id: outcome
          label: 结果与职业影响
          description: 94% 的企业学员报告职业发展受到正面影响；55% 的 B2C 完成者报告职位晋升（公司声称）。未披露独立队列研究。
        - id: expand
          label: 复购与扩张
          description: B2C 校友可能继续报名更多项目。企业账户可从 Accelerate 深化到 Academies，或委托开设 Private Cohorts。复购项目比例未公开披露。
