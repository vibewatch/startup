      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 债务不透明是优先级最高的尽调缺口
            body: >
              2025 年 9 月完成的 $130M Mars/HSBC 融资让 Eruditus 避开了 2025 年到期悬崖，但利率、契约包和股权挂钩条款均未披露，投资人无法判断真实资金成本、
              压力情境下的契约余量，也无法判断覆盖率触发违约后是否会加速到期。这是最可执行的尽调要求：任何投资决策前，都应拿到完整信贷协议或经贷款方确认的条款清单摘录。
            calloutType: risk
            claimRefs:
              - CR004
              - CR009
              - CR049
          - type: callout
            title: 大学伙伴集中度未披露且影响重大
            body: >
              Eruditus 的品牌资产主要靠 Tier-1 大学名单来验证，但公司没有公开任何收入或招生集中度数据。MIT、Harvard、Wharton 和 INSEAD 若贡献超过 40% 订单额——
              考虑到其高定价和品牌拉力，这并非不合理——任何单一伙伴流失都会连锁打击获客效率、课程定价和投资人信心。2U 破产说明，大学合作型 edtech 并不免疫伙伴集中风险。
              投资人应把集中度披露作为发出投资条款书的前置条件。
