      - number: '8.5'
        title: IPO 路径与退出准备度
        blocks:
          - type: paragraph
            body: >
              Eruditus 已启动印度本土 IPO 的结构性前置工作。公司在 2024 年 10 月 Series F 同时宣布从新加坡迁册至印度，并在 2025 年通过公司重组执行。 CEO Damera 于 2025
              年 9 月公开表示，公司「正为未来几年 IPO 做准备」，该表述与 FY2027-28 目标一致，时间点也与 Mars/HSBC 再融资重合。 $150M Mars/HSBC 四年期再融资把到期日推至约 2029
              年，移除了此前阻碍 IPO 准备的短期资产负债表约束：按 Damera 2024 年 10 月的话，公司「现在不需要还债」， 此前 CPPIB 融资才是主要到期风险。

              关键 IPO 前置条件及当前状态：（1）domicile flip——进行中；（2）SEBI DRHP 文件——尚未提交；（3）任命 SEBI 注册 merchant banker / 投行——未公开披露；
              （4）按印度会计准则编制的经审计合并财务报表——FY24 或 FY25 尚未发布；（5）FY25 收入与 EBITDA 里程碑——截至运行日期 FY25 尚未结束，目标已披露但尚未交付。 IPO
              准备度的最大约束，是缺少可公开获取的经审计集团财务。任何招股书都需要三个完整财年的经审计账目；该流程最早也可能在 2025 年下半年至 2026 年上半年才开始。

              从退出角度看，二级出售或战略收购也存在替代路径，但受限于 $3.2B 头部价格；除非基本面显著改善，否则买方意愿有限。最可能的退出路径是 BSE/NSE 上市，
              并由机构投资人保留潜在锚定份额。公开资料没有报道或暗示过战略买方收购。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV046
              - CV048
              - CV049
          - type: table
            tableRef: TV005
            claimRefs:
              - CV048
              - CV049
      - number: '8.6'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              现有证据支持在 $3.2B Series F 入场价上给出「继续研究」建议。当前估值溢价没有任何公开市场可比证据支撑；最接近的上市公司按 1-2.4x EV/Revenue 交易， 而 Eruditus 为
              7.1x；Series F 前谈判记录也说明市场对该业务的真实读数为 $2.3B 或更低。这并不意味着 Eruditus 是一家差公司——按收入规模、企业端动能和大学伙伴深度看， 它是美国以外最强的纯
              premium edtech 公司。但在缺少经审计财务、披露后的 cap table 和优先权结构、确认的 FY25 EBITDA 交付、可信 IPO 时间线之前，这些强项都不足以支撑当前价格。

              转为买入建议需要满足：（a）交付经审计 FY25 合并财务，并确认权责发生制 EBITDA 达到 ₹300 crore+；（b）确认 DRHP 提交时间线和 merchant bank mandate；
              （c）披露 Series F 工具条款，尤其是 $1.8B 棘轮是否纳入或排除；（d）披露大学伙伴集中度，显示没有单一伙伴超过 20% 招生；（e）披露债务条款（Mars/HSBC 利率、契约、股权挂钩条款）。
              若 FY25 指引交付但工具条款和财务仍不透明，则应以「跟踪」建议取代「继续研究」。
            claimRefs:
              - CV032
              - CV033
              - CV047
              - CV051
              - CV052
              - CV055
          - type: table
            tableRef: TV006
            claimRefs:
              - CV032
              - CV033
              - CV047
      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: $3.2B 平轮是估值红旗
            body: >
              38 个月后收入接近翻倍却仍做平轮，这并不典型，必须仔细审视工具结构。标准交易机制下，若增长不足，应出现 $2.3-2.5B 的 down round；若增长足以支撑，则应接近 $4B 溢价轮。 $3.2B
              结果理论上可能是 TPG Rise 为避免组合减记而按维持估值领投——这种利益冲突情境，投资人应通过索取完整 Series F 认购协议及其中任何棘轮、PIK 或转换条款来明确追问。 Inc42 报道的
              $1.8B 棘轮底价若真实且仍有效，实际估值可能是 $1.8-2.3B，而不是 $3.2B。
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV029
              - CV030
              - CV047
          - type: callout
            title: 企业 L&D 顺风是牛市情境最强支点
            body: >
              Eruditus 的结构性牛市逻辑不在消费者板块——该板块正面临低成本平台带来的强 AI 竞争——而在企业 L&D 板块。Harvard、MIT 和 IIMs 的认证课程仍能获得预算， AI
              工具尚未替代这些预算。Series F 前企业板块 YoY 增长 40-45%，是投资逻辑中最可辩护的单一数据点。 若到 IPO 时，企业收入从今天估计的 15-20% 接近总集团收入的
              40-50%，业务估值支撑会明显改善：接近企业 SaaS 的 3-5x forward revenue 倍数，比消费者 edtech 倍数更耐打。
            calloutType: strength
            claimRefs:
              - CV039
              - CV040
              - CV038
              - CV048
