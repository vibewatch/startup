      - number: '6.3'
        title: 企业采用模式与增长
        blocks:
          - type: paragraph
            body: >-
              企业是 Eruditus 披露增速最快的板块。CEO Ashwin Damera 在 2024 年 10 月表示，企业账户贡献总收入约 15%，且企业业务过去两年翻倍，意味着复合年增长率约
              41%。公司正在主动放大这种增长：Series F 融资轮（TPG 的 The Rise Fund 投资 $150M）明确把资金分配给企业客户扩张。公司提出过为 500
              家公司员工提升技能的目标，说明当前渗透率之上仍有未满足目标。印度和企业合在一起被描述为约 40% 同比增长，与单独企业板块翻倍的说法一致。


              企业产品套件支持三种采购模式。Accelerate 允许 L&D 团队以团体折扣和管理门户把队列报名到开放项目。Academies
              创建品牌化企业学习目的地，覆盖五个实践领域：领导力、可持续、数据、数字和技术。Private Cohorts
              提供专属内部队列，可选择项目负责人、定制案例研究和定制参与者练习。企业门户提供审批工作流、报名管理、分析仪表盘以及灵活支付和账单。该门户明确不需要与现有 HR 或学习管理系统集成，降低企业买方的 IT
              摩擦。公开点名的企业垂直包括 CPG、金融服务、政府和专业服务，但没有公开披露具名客户名单或客户数量。
