      - number: '7.4'
        title: 客户体验、声誉与运营质量风险
        blocks:
          - type: paragraph
            body: >
              消费者评论和投诉平台持续暴露 Emeritus 项目的一组反向信号：报名后退款困难、客户支持不响应、项目营销承诺与实际质量不匹配，以及隐藏费用或账单做法担忧。Better Business Bureau 的
              Emeritus Institute of Management 投诉日志、r/india 的 Reddit 讨论、SiteJabber 评论、Mouthshut 评论和 Shiksha
              条目都共享这些主题。这些信号形成三类风险向量：（a）直接流失和负面口碑降低 B2C 获客效率；（b）如果员工学员体验差到触发内部升级，企业客户会犹豫；（c）如果投诉与 MIT 或 Wharton
              等机构的联合品牌项目关联，大学合作伙伴品牌会受损。运营上，平台可靠性（Canvas LMS、移动应用）、内容本地化质量和大规模队列管理都是执行风险，难以从公开数据评估。收入确认复杂性——FY24 预订口径
              EBITDA 为正（₹28-80 crore 区间），而权责发生制 EBITDA 仍为负（−₹69 crore）——增加了财务质量风险：如果因学员退出或退款导致预订到权责发生制转换假设过于乐观，已报告
              EBITDA 会被向下重述。公开渠道未报告网络安全漏洞或数据事件。公司运营负责任披露框架，但没有漏洞赏金项目，限制了独立安全研究。总体看，运营和声誉风险真实存在，但考虑到 Eruditus
              的收入规模和企业客户分散度，目前还低于打破投资逻辑的严重程度。
