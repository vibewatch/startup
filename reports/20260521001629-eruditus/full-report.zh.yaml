  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Eruditus 有两个结构上不同的客户原型，它们在买方身份、购买动机、定价权限和部署规模上都不同。B2C
              板块——全球在职专业人士——通过数字营销、合作大学转介和项目信息会，自主选择进入队列项目。购买决策通常由个人作出，或由雇主通过学费报销支持；项目价格覆盖短证书到数月期高级管理者旅程。需求画像偏向中职业阶段高管，他们寻求可识别大学品牌背书的证书、职业转向或晋升准备信号。


              企业板块——企业 L&D 部门、政府机构和大型专业服务公司——通过专门销售团队和门户采购。Emeritus 明确面向
              CPG、金融服务、政府和专业服务垂直领域，并把企业产品分为三层：Accelerate（开放队列团体报名）、Academies（覆盖领导力、可持续、数据、数字和技术的品牌化多项目目的地）以及 Private
              Cohorts（可选内容定制的专属内部队列）。印度占总收入 27–28%，这是公司认定为增长重点的地域集中。跨板块看，公司声称覆盖 80+ 国家，并引用累计 1M+ 学员，但这个数字混合了 B2C 与
              B2B、历史与当前、个人证书与学位项目。
            claimRefs:
              - CU001
