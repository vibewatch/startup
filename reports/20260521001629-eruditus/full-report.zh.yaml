      - number: '8.4'
        title: 牛市、基准与熊市情境分析
        blocks:
          - type: paragraph
            body: >
              牛市情境假设 Eruditus 在 FY2026-27 前维持 20-25% 收入 CAGR（达到约 $600-700M），达成并超过 FY25 ₹300 crore EBITDA 目标，顺利完成印度
              domicile flip， 并在 FY2027 抓住有利窗口于 NSE/BSE 上市。在该情境下，印度科技上市公司可凭印度增长叙事和企业端顺风获得 3-5x forward EV/Revenue。 若按
              ~$650M 收入给予 4x forward，IPO 估值约 $2.6B，仍低于 $3.2B Series F 入场价。要实现 $3.2B+ IPO，公开市场必须对 $650M 收入给予 5x+ forward
              P/S， 或对 $700M+ 收入给予更高倍数——这要求印度相对全球 edtech 可比公司长期维持溢价，或整个板块出现实质性重估。

              基准情境假设 FY2026-27 收入 CAGR 为 12-18%，达到约 $550-600M；权责发生制 EBITDA 转正但低于 ₹300 crore；BSE/NSE 上市按 2-2.5x forward
              EV/Revenue 定价—— 即当前公开可比区间高端加上适度非流动性溢价。由此得到的 IPO 估值区间约 $1.1-1.5B，相比 $3.2B Series F 价格稀释 53-66%。 以 $3.2B 入场的
              Series F 投资人将面临相对成本的大幅减记；但以 $450-680M 估值进入的 Series B 和 C 投资人仍能保留正回报。

              熊市情境假设收入增速跌破 10%（与 FY24 13.8% 轨迹继续降速、后 COVID 技能投资周期正常化一致），FY25 EBITDA 目标落空，IPO 推迟至 FY2028 或更晚。 Mars/HSBC
              2029 年到期债务届时需要再次再融资，且利率很可能更高。板块倍数继续按 Skillsoft 和 2U 先例压缩，使 IPO 估值降至 ~$500-550M 收入的 1-1.5x forward P/S， 即约
              $500-825M。该情境相当于较 $3.2B Series F 稀释 74-84%，Series E 及之后投资人回收额低于成本，Series F 前 $1.8B 棘轮底价将取代 $3.2B
              头部价格成为相关锚点。
