  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - Missing Metric
      - Impact on Judgment
      - Diligence Path
    rows:
      - - Audited group financial statements (FY24 and FY25 ACRA)
        - Cannot independently verify revenue, gross margin, net loss, or working capital claims
        - Request from company; ACRA filings purchasable via Bizfile Singapore portal (paid)
      - - Exact cash and equivalents on balance sheet
        - Cannot assess true runway without cash position; CPPIB bullet timing critical
        - Request balance sheet from company; CFO-level disclosure in any equity process
      - - CPPIB debt covenants and repayment plan
        - If covenants include financial maintenance tests, a shortfall triggers acceleration risk
        - Request term sheet or facility summary from company; engage CPPIB relationship lead
      - - Gross margin by channel and geography (FY24)
        - Without margin breakdown, cannot evaluate which segments subsidise which; mix could be deteriorating
        - Request segment P&L; compare with FY23 university-fee rate disclosure
      - - Mars/HSBC facility interest rate and covenant terms
        - Cannot assess debt service burden or headroom against performance covenants
        - Request credit agreement or term sheet; negotiate disclosure as condition of equity investment
      - - FY25 actual revenue and EBITDA (results not yet public as of May 2026)
        - FY25 ends June 2026; partial results may be available; booking-basis profitability claim for FY25 unverified
        - Request management accounts for H1 FY25; triangulate against deferred revenue pool release
    notes: >-
      All gaps listed here represent information that is either not publicly disclosed or
      accessible only through a paid regulatory filing. The absence of audited public financials
      is typical for a private company of Eruditus's stage, but creates meaningful uncertainty
      in any revenue-quality or leverage analysis.
