callouts:
  - calloutType: strength
    title: FY24 EBITDA Inflection Is Structurally Credible
    body: >-
      The 83% compression in accrual EBITDA loss (₹417cr → ₹69cr) is corroborated by at
      least five independent sources and is consistent with the arithmetic of marketing cost
      reduction (₹234cr absolute decline) and opex compression (₹496cr decline). The
      structural levers are real: brand maturity reducing CAC, course pruning improving
      revenue quality, and enterprise acceleration improving margin mix.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI010

  - calloutType: risk
    title: CPPIB $350M Bullet Maturity (~2027) Is the Dominant Capital Risk
    body: >-
      The five-year bullet structure means $350M of principal is due in approximately Q1 2027.
      Unlike the Mars/HSBC facility (which was extended), the CPPIB facility has not publicly
      disclosed a renewal or refinancing. If Eruditus has not fully transitioned to accrual
      profitability or raised further equity by then, servicing or refinancing this facility
      at scale will be the decisive financial event for the company's capital structure.
    claimRefs:
      - CI024
      - CI025
      - CI037

  - calloutType: risk
    title: Booking vs Accrual EBITDA Gap Creates Disclosure Ambiguity
    body: >-
      Two co-founders cite materially different EBITDA figures for the same fiscal year
      (₹28cr vs ₹80cr booking basis; ₹-69cr accrual). Without a formal deferred-revenue
      reconciliation in a published filing, investors cannot determine which convention
      management is using as its operating benchmark, increasing the risk of forward-guidance
      misinterpretation.
    claimRefs:
      - CI016
      - CI018
      - CI019
      - CI020

  - calloutType: insight
    title: India + Enterprise Mix Shift Is the Most Tractable Margin Lever
    body: >-
      India (~28% of FY24 revenue) and enterprise (~15%) are both growing at ~40% YoY.
      Enterprise revenue carries lower CAC and higher LTV than open-enrollment B2C.
      A sustained mix shift toward these two sub-segments would structurally reduce the
      marketing-to-revenue ratio below 27% without requiring top-line growth, accelerating
      the path to accrual profitability ahead of the IPO.
    claimRefs:
      - CI030
      - CI031
      - CI032
      - CI038

