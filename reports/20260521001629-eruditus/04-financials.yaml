  - id: financial-verdict
    title: Revenue Quality, Margin Path, and Diligence Blockers
    body: >-
      Eruditus has the strongest revenue trajectory of any India-headquartered edtech, but
      the FY24 financials raise a series of diligence-worthy questions that a growth-equity
      investor must resolve before underwriting. Revenue quality is medium-high: the executive
      education model has high learner commitment, relatively predictable enterprise B2B
      contracts, and limited refund exposure compared to K-12 test prep. However, the
      university revenue-share model caps gross margin structurally (~50–55% estimated ceiling),
      and heavy marketing dependency (27% of revenue) means contribution margins before
      overhead remain thin.


      The accrual EBITDA loss trajectory (₹417cr → ₹69cr) is convincing, and booking-basis
      profitability is a meaningful operational milestone. However, the absence of a publicly
      available audited full-year FY24 or FY25 group income statement, consolidated cash-flow
      statement, and covenant-level debt disclosure means that any underwriting must be based
      on company-stated figures, not verified filings. The CPPIB $350M bullet maturing ~2027
      is the single largest financial risk: if Eruditus cannot refinance or repay this facility
      from operations or a fresh equity raise, it will face significant leverage pressure in an
      already capital-intensive sector.
    claimRefs:
      - CI038
      - CI039
      - CI040
      - CI041
