  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: covenant-gap
      missingEvidence: CPPIB and Mars/HSBC facility term sheets, including interest rate, financial maintenance covenants, and cross-default provisions
      whyItMatters: Without covenant terms, cannot assess probability of acceleration risk or estimate true annual debt service; two very different risk profiles are possible depending on whether maintenance covenants exist
      diligencePath: Request facility summary or term sheet from CFO; alternatively engage CPPIB investor relations directly; any equity process should require full covenant disclosure
      relatedQuestionRefs: [QI021]

    - type: private-evidence-only
      severity: blocking
      topic: audit-gap
      missingEvidence: Audited consolidated group financial statements for FY24 (and FY25 when available), filed with ACRA Singapore or equivalent
      whyItMatters: All revenue, EBITDA, and net-loss figures used in this analysis are company-stated or sourced from media; without audited financials, revenue recognition methodology, deferred-revenue waterfall, and related-party transactions cannot be independently verified
      diligencePath: Purchase ACRA filings via Bizfile Singapore portal; request audited financials directly from company as standard pre-investment diligence condition
      relatedQuestionRefs: [QI012]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: material
      topic: cash-position
      missingEvidence: Current cash and cash equivalents, restricted cash, and net operating burn rate
      whyItMatters: Cannot independently estimate runway to CPPIB maturity or assess whether Series F proceeds are sufficient to fund operations to profitability; this is the single most important gap for assessing the probability of a distressed refinancing
      diligencePath: Request balance sheet and cash-flow statement from company; minimum quarterly management accounts required for any equity commitment
      relatedQuestionRefs: [QI023]
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: FY24 gross margin by channel (B2C, B2B enterprise, India) and university revenue-share rates by partner tier
      whyItMatters: Gross margin ceiling determines scalability of profitability; if university fees have increased or vary significantly by partner, the ~52% gross margin extrapolated from FY23 may be materially wrong
      diligencePath: Request FY24 segment P&L and a sample university partnership agreement; benchmark against any publicly available partner-revenue-share disclosures
      relatedQuestionRefs: [QI013]
      relatedTableRefs: [TI003]

    - type: stale
      severity: material
      topic: fy25-guidance
      missingEvidence: FY25 actual revenue, EBITDA, and booking-basis profit results (FY25 ends June 2026; results are not yet publicly available as of May 2026)
      whyItMatters: FY25 is the year in which Eruditus targets full-year accrual profitability; without reported numbers, the guidance remains an aspiration and deferred-revenue tailwind cannot be confirmed
      diligencePath: Request management accounts for FY25 H1 (Jul–Dec 2025); if company is preparing for IPO, partial prospectus disclosure may become available
      relatedQuestionRefs: [QI016]
