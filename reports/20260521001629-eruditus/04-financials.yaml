  - id: capital-structure
    title: Debt Facilities, Refinancing, and Capital Adequacy
    body: >-
      Eruditus's capital structure is built on a mix of long-term equity and strategic debt,
      with the company deliberately preferring debt post-2021 to minimise dilution after
      anchoring its last equity round at a $3.2B valuation. Total lifetime equity raised is
      approximately $741M from investors including SoftBank Vision Fund 2, Prosus Ventures,
      TPG Rise Fund, Accel, Peak XV Partners, Chan Zuckerberg Initiative, CPP Investments,
      Leeds Illuminate, and GSV Ventures. The October 2024 Series F ($150M at $3.2B
      post-money, led by TPG) was the first equity raise since August 2021.


      The primary debt anchor is the $350M five-year bullet facility from CPP Investments
      (Canada Pension Plan Investment Board), drawn in March 2022. This facility carries no
      periodic cash interest—it is structured as a conventional non-cash-pay debt—and was
      earmarked for acquisitions in European and Asian markets. Based on the five-year term
      from March 2022, the maturity falls in approximately Q1 2027, making it the most
      critical near-term refinancing event on Eruditus's balance sheet.


      In September 2025, Eruditus completed a $150M refinancing from existing lenders Mars
      Growth Capital (up to $100M, a Liquidity Group/MUFG joint venture) and HSBC (up to
      $50M). The transaction renewed $130M of existing credit at a four-year extension,
      adding a $20M incremental credit line, pushing that facility's maturity to approximately
      2029. The company declined to disclose the interest rate or any performance covenants.
      Cash on hand and monthly operating burn are not publicly disclosed; the absence of these
      figures limits the ability to calculate independent runway estimates.


      Pre-Series-F, Inc42 reported Eruditus was in advanced discussions with TPG at a $2.3B
      valuation—a 28% discount to the August 2021 $3.2B peak—with a ratchet provision that
      could reduce the effective valuation to $1.8B if undisclosed performance targets were
      missed. The final Series F closed at $3.2B post-money, suggesting either a negotiated
      premium or that performance targets were met before closing; the gap between the initial
      $2.3B negotiation floor and the closing $3.2B warrants investor scrutiny on how the
      final pricing was rationalised.
