  - id: revenue-recognition
    title: Revenue Recognition Nuances and EBITDA Convention Conflicts
    body: >-
      Eruditus operates on a July–June fiscal calendar and recognises revenue on an accrual
      basis—i.e., as program services are delivered—not when fees are collected. Because
      programs are often sold and paid months before delivery begins, a material "booking" to
      "recognised" gap exists on the balance sheet as deferred revenue. In FY24, ₹800 crore
      (~$96M) of collected fees were deferred to FY25, creating a direct wedge between the
      two EBITDA metrics widely quoted in the media.


      The accrual EBITDA loss of ₹69 crore is the figure in the group's consolidated
      financial statements filed with ACRA (Singapore). The booking-basis EBITDA of ₹28 crore
      (cited by co-founder Kalipatnapu) and ₹80 crore (cited by CEO Damera in the November
      2024 Business Standard interview) reflect cash-collections economics—how much cash was
      collected minus associated expenses in the same period, regardless of delivery timing.
      The difference between ₹-69 crore (accrual) and ₹+28–80 crore (booking) is approximately
      consistent with applying a ~12–15% EBITDA margin to the ₹800 crore deferred pool: if
      the incremental margin on deferred revenue is ~12%, the wedge = ₹96 crore, reconciling
      the two figures to within rounding.


      The ₹28 crore figure was a mid-year co-founder estimate disclosed before year-end
      filing; the ₹80 crore is a CEO-stated full-year booking-basis figure. Both are
      company-claimed and not independently audited on this basis. Investors relying on the
      booking-basis number to assess current-period economics should verify it against the
      Singapore ACRA filings and request a formal deferred-revenue reconciliation. The
      Financial Express noted that FY23 consolidated financial statements were filed by the
      group entity in Singapore, but the audited FY24 group financials have not been published
      at the time of this analysis (May 2026).
