- id: sec-adverse-evidence
  title: Adverse Evidence, Reviews & Service Failures
  body: |-
    Independent review signals reveal a recurring cluster of customer complaints that are not visible in the company's own satisfaction statistics. MouthShut, India's oldest consumer review platform, hosts reviews of Eruditus Executive Education (the legal entity name) with complaints centering on three themes: pre-enrollment refund refusal even when cancellation occurs before the program start date; absence of post-payment customer communication, with reviewers describing complete silence from the company after payment was collected; and cost concerns, where learners characterize program fees as high relative to the quality of support received. The Better Business Bureau page for Emeritus Institute of Management (Boston, MA) lists consumer complaints, though full complaint text was inaccessible at scrape time. Trustpilot's Emeritus page was blocked (403) during data collection, preventing score or sentiment verification.

    The adverse signal pattern suggests that the highest-friction customer experience occurs at the edges of the learner relationship: pre-enrollment cancellation and early-post-enrollment support. Neither MouthShut nor BBB represent large review volumes, and the company's Shiksha rating (5.0 from 56 reviews) points in the opposite direction for India-based learners in good standing. However, the refund-refusal theme is consistent across multiple unrelated reviewers and points to a policy gap that can damage brand trust and generate chargebacks. No public NPS score, CSAT benchmark, or satisfaction auditor has been disclosed to triangulate between the company's positive aggregate statistics and the adverse platform signals.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  tableRefs:
  - TU004
  figureRefs: []

- id: sec-retention-gaps
  title: Retention Durability, Expansion & Transparency Gaps
  body: |-
    The most material diligence gap in the customers chapter is the complete absence of publicly disclosed retention or durability metrics. Net Revenue Retention (NRR), Gross Revenue Retention (GRR), enterprise account renewal rates, B2C repeat-program purchase rates, and cohort survival curves are not published in any accessible form. The only proxy for learner durability is the 85% completion rate—company-stated and not corroborated by a third party—which measures in-program engagement rather than post-program loyalty. Enterprise revenue doubling over two years is consistent with strong net expansion, but without knowing whether growth comes from new logos or from expansion within existing accounts, the durability quality cannot be assessed.

    Concentration risk is similarly under-disclosed. No enterprise client list is public, no Herfindahl index or top-10-customer revenue share has been disclosed, and no geographic breakdown of enterprise revenue is available beyond the statement that India plus enterprise together represent a major growth axis. B2C revenue depends on continued discretionary spend by individual professionals, which is sensitive to macro conditions, employer reimbursement policy, and competitive program launches by direct university channels. The company's current geographic mix—27–28% India, the remainder across 80+ countries—implies some diversification in B2C but a single-country concentration in one of its fastest-growing segments. Investors seeking to assess customer durability will need to request cohort retention data, NRR, and client concentration schedules in a management meeting or data room.
