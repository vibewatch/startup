  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-nrr
    missingEvidence: NRR, GRR, and B2C repeat-program purchase rate from any Eruditus reporting period
    whyItMatters: Without retention metrics, the durability of the customer base cannot be assessed from public materials; enterprise growth could be all new logos or include high churn.
    diligencePath: Request NRR, GRR, and cohort retention schedules in the management meeting or data room.
    relatedQuestionRefs:
    - QU007
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Named enterprise client list or at least 3 named enterprise clients with disclosed use case and outcomes
    whyItMatters: The enterprise proof base relies entirely on anonymous aggregate statistics; no named corporate or government client corroborates the B2B traction claim.
    diligencePath: Request enterprise client references willing to be contacted and any case studies under NDA.
    relatedTableRefs:
    - TU002
    relatedQuestionRefs:
    - QU015
  - type: access-blocked
    severity: minor
    topic: trustpilot-reviews
    missingEvidence: Trustpilot score and sentiment distribution for Emeritus
    whyItMatters: Trustpilot is the most widely used global platform for enterprise software and education reviews; its blockage leaves a gap in the independent satisfaction signal.
    diligencePath: Access Trustpilot directly or request the Eruditus team to share Trustpilot data in the data room.
    relatedQuestionRefs:
    - QU013
  - type: missing-source
    severity: material
    topic: enterprise-concentration-risk
    missingEvidence: Enterprise client count, top-client revenue share, and any Herfindahl concentration index for enterprise accounts
    whyItMatters: 15% enterprise revenue from an unknown number of clients creates unquantifiable concentration risk; a small number of large clients could represent disproportionate risk.
    diligencePath: Request account-level revenue report showing top-10 clients as percentage of enterprise revenue.
