company:
  name: Eruditus
chapter:
  number: 6
  title: Customers
  summary: |-
    Eruditus serves two primary customer archetypes under the Emeritus brand: individual working professionals seeking career advancement through short certificates and senior executive programs, and enterprise L&D buyers purchasing upskilling at scale for their workforces. As of October 2024, enterprise accounts contributed approximately 15% of total revenue and had doubled in size over the preceding two years, signalling rapid B2B traction despite remaining a minority of the revenue mix. The company publicly reports 1M+ cumulative learners and ~350,000 active Emeritus brand learners across 80+ countries. However, critical customer durability metrics—NRR, GRR, named client list, NPS, or any cohort retention chart—are not publicly disclosed. Adverse signals from MouthShut and BBB reviews point to recurring complaints around pre-course refund refusals and post-enrollment customer service quality. The combination of strong aggregate satisfaction statistics (94% positive professional development impact, company-stated) and a visible minority of aggrieved consumers suggests customer experience quality is uneven and that learner retention evidence is almost entirely self-reported.

sections:
- id: sec-customer-segmentation
  title: Customer Segmentation & Buyer Profiles
  body: |-
    Eruditus operates with two structurally distinct customer archetypes that differ in buyer identity, purchase motivation, pricing authority, and deployment scale. The B2C segment—working professionals globally—self-selects into cohort programs via digital marketing, partner university referrals, and program information sessions. Purchase decisions are typically made by the individual (or their employer through tuition reimbursement), with program prices ranging from short certificates to multi-month senior executive journeys. The demand profile skews toward mid-career executives seeking a credential, career pivot, or promotion-readiness signal from a recognizable university brand.

    The enterprise segment—corporate L&D departments, government agencies, and large professional services firms—procures through a dedicated sales team and portal. Emeritus explicitly targets CPG, Financial Services, Government, and Professional Services verticals and structures enterprise offerings into three distinct tiers: Accelerate (group enrollment in open cohorts), Academies (branded multi-program destinations across leadership, sustainability, data, digital, and technology), and Private Cohorts (exclusive internal cohorts with optional content customization). India represents 27–28% of total revenue, a geographic concentration the company identifies as a growth priority. Across segments, the company states 80+ country reach and cites 1M+ cumulative learners, though that figure blends B2C and B2B, historical and current, and individual certificates and degree programs.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
