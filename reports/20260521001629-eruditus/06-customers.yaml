figures:
- id: FU001
  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: Stages from initial discovery through program completion and expansion for B2C and enterprise buyer paths under the Emeritus brand.
  data:
    nodes:
    - id: discover
      label: Discovery
      description: B2C learners find Emeritus via search, social media, and partner university marketing. Enterprise buyers are sourced via sales outreach, webinars, and procurement channels.
    - id: evaluate
      label: Evaluation
      description: B2C learners attend information sessions or consult advisors. Enterprise L&D leaders receive proposals covering Accelerate, Academies, or Private Cohort options.
    - id: enroll
      label: Enrollment
      description: Individuals pay tuition or use employer reimbursement. Enterprise buyers access a portal for multi-seat enrollment, approval workflows, and billing.
    - id: learn
      label: Active Program
      description: Cohort-based online learning via Canvas; live sessions, peer discussion, case studies, and assignments. Program duration ranges from weeks to 8–10 months for senior executive journeys.
    - id: complete
      label: Completion
      description: 85% reported completion rate (company-stated). University-branded Accredible certificate issued after required assignments are graded. Completion milestones tracked in portal.
    - id: outcome
      label: Outcome & Career Impact
      description: 94% of enterprise learners report positive professional development impact; 55% of B2C completers report role advancement (company-stated). No independent cohort study disclosed.
    - id: expand
      label: Repeat & Expand
      description: B2C alumni may enroll in additional programs. Enterprise accounts can deepen from Accelerate to Academies or commission Private Cohorts. Repeat-program rate not publicly disclosed.
  claimRefs:
