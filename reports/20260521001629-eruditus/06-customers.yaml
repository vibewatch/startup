callouts:
- calloutType: strength
  title: Enterprise Doubled in Two Years on Named CEO Confirmation
  body: |-
    Enterprise revenue doubled over approximately two years according to CEO Ashwin Damera's October 2024 Business Standard interview — a ~41% CAGR at a segment that currently represents 15% of total revenue. The three-tier enterprise model (Accelerate, Academies, Private Cohorts) provides a documented upsell pathway, and Series F capital has been explicitly allocated to enterprise expansion. This combination — stated growth rate, structural land-and-expand design, and fresh capital — makes enterprise the most credible near-term revenue acceleration lever.
  claimRefs:
  - CU016
  - CU017
  - CU018

- calloutType: risk
  title: Adverse Review Pattern Concentrated Around Refunds and Post-Payment Service
  body: |-
    MouthShut and BBB reviews surface a consistent adverse cluster: pre-enrollment refund refusals and a near-total absence of customer service response after payment. Unlike isolated product complaints, these are process complaints about Eruditus's operational behavior at the beginning and end of the customer relationship — precisely the moments that drive churn and chargebacks. The company publishes 94% positive impact stats, but those figures capture in-program learners, not the subset who never started or who struggled to reach support. The signal volume is small, but the theme is coherent.
  claimRefs:
  - CU026
  - CU027
  - CU028

- calloutType: risk
  title: No Disclosed Retention Metrics — NRR, GRR, and Repeat Purchase Rate Are All Gaps
  body: |-
    Every standard retention proxy — NRR, GRR, B2C repeat-program rate, enterprise account renewal rate, NPS — is absent from public materials. The company's headline satisfaction stats (94%, 77%, 90%) are self-administered and lack methodology disclosure. The 85% completion rate, while positive, measures in-program engagement, not post-program loyalty. Investors cannot assess customer durability without a management meeting or data-room request covering cohort retention, multi-program enrollment, and enterprise account renewal schedules.
  claimRefs:
  - CU033
  - CU034
  - CU035
  - CU037

- calloutType: insight
  title: Named Testimonials Are Above Average Quality But Require Corroboration
  body: |-
    The named testimonials on eruditus.com are more credible than typical anonymous five-star reviews. Aisha Blackwell (CHRO program), Anqi Zou (CTO program), and Simon Yu (VC/PE program) are named individuals with verifiable LinkedIn-discoverable roles at real organizations. This is materially stronger evidence than aggregated star ratings. The appropriate next diligence step is to contact two or three of these individuals directly and ask about measurable career outcomes, curriculum quality, and support responsiveness.
  claimRefs:
  - CU010
  - CU011
  - CU012

