- id: sec-enterprise-adoption
  title: Enterprise Adoption Patterns & Growth
  body: |-
    Enterprise is Eruditus's fastest-disclosed-growth segment. CEO Ashwin Damera stated in October 2024 that enterprise accounts contribute approximately 15% of total revenue and that the enterprise business doubled over the prior two years, implying a compound annual growth rate of roughly 41%. This growth is being actively scaled: the Series F funding round ($150M from TPG's The Rise Fund) explicitly allocates capital to enterprise customer expansion. The company has articulated a stated ambition to upskill employees of 500 companies, suggesting an unmet target well above current penetration. India and enterprise together are described as growing at ~40% YoY, consistent with the individual segment doubling claim.

    The enterprise product suite enables three procurement patterns. Accelerate allows L&D teams to enroll cohorts into open programs with group discounts and a management portal. Academies create branded enterprise learning destinations covering five practice areas: leadership, sustainability, data, digital, and technology. Private Cohorts offer dedicated internal cohorts with program-leader selection, customized case studies, and tailored participant exercises. An enterprise portal provides approval workflows, enrollment management, analytics dashboards, and flexible payment and billing. The portal explicitly requires no integration with existing HR or learning management systems, reducing IT friction for enterprise buyers. Enterprise verticals publicly named include CPG, Financial Services, Government, and Professional Services, though no named client list or client count is publicly disclosed.
  claimRefs:
