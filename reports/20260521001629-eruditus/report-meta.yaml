summary:
  headline: >-
    Eruditus has the strongest university-partner moat in online executive education and improving fundamentals,
    but its $3.2B flat-round valuation at 7.1x FY24 revenue — a 3-5x premium to public edtech comps — combined
    with opaque consolidated financials and undisclosed debt terms make research-more the only defensible call.
