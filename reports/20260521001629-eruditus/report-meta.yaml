companyProfile:
  summary: >
    Eruditus is the Singapore-headquartered parent of the Emeritus brand, founded in 2010 in Chennai, India
    by Ashwin Damera (CEO) and Chaitanya Kalipatnapu (Executive Director). The company co-designs and delivers
    online executive education programs in partnership with 80+ top-tier universities — including Harvard
    Business School, Columbia Business School, MIT, the IIMs, and ISB — targeting working professionals
    globally through B2C enrollment and enterprise L&D contracts. As of October 2024, Eruditus has served
    more than 1 million learners across 80+ countries and operates 700+ programs. FY24 revenue reached
    ₹3,733 crore ($448M), up 12% YoY, with accrual EBITDA loss narrowing 83% to ₹-69 crore and
    booking-basis EBITDA turning positive. The October 2024 Series F raised $150M from TPG Rise Fund at
    a flat $3.2B post-money valuation — identical to the August 2021 Series E — yielding a confirmed flat
    round over 38 months. Outstanding debt of $150M (Mars Growth Capital / HSBC, maturing ~2029) adds
    balance sheet risk ahead of a contemplated IPO.
  foundedDate: "2010-10-26"
  founders:
    - name: "Ashwin Damera"
      role: "Co-founder and CEO"
      background: "Primary public spokesperson and CEO of both Eruditus and Emeritus; held approximately 40% equity stake post-Series E."
