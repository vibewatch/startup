  foundingLocation: "Chennai, India"
  headquarters: "Singapore (Eruditus Learning Solutions Pte. Ltd., incorporated December 2014)"
  productSummary: >
    Eruditus delivers online and blended executive education under the Emeritus brand. Its core product is
    co-branded cohort programs with partner universities: Eruditus handles enrollment marketing, digital
    delivery infrastructure (Canvas LMS, Accredible credentialing, mobile), enterprise customization, and
    learner support, while university partners supply brand, faculty, and curriculum. Programs span
    certificates, PG diplomas, and senior executive journeys across technology, management, leadership,
    and analytics, with an enterprise portal for B2B clients.
  customerFocus: >
    B2C: working professionals globally seeking career advancement, credentialing, and skill upgrades via
    short certificates and executive programs. B2B: corporate L&D departments, government agencies, and
    professional services firms purchasing workforce upskilling through a dedicated enterprise sales team.
    India represents approximately 27–28% of total revenue; the US and APAC are the other primary markets.
  businessModel: >
    Revenue-share OPM (online program management) model: Eruditus co-designs programs with university
    partners, invests in marketing and delivery infrastructure, enrolls learners, and splits program revenue
    with the partner university. Learner fees are collected upfront; revenue is recognised on an accrual
    basis as the course is delivered. Enterprise contracts provide recurring B2B revenue. The dual
    booking-basis vs. accrual-basis reporting convention creates a persistent optics risk.
  stage: "Pre-IPO / Series F"
  fundingStatus: >
    Total lifetime equity of approximately $741M from 27 investors including TPG Rise Fund, SoftBank
    Vision Fund 2, Prosus, Peak XV Partners, and GSV Ventures. The October 2024 Series F raised $150M
    led by TPG Rise Fund at a flat $3.2B post-money valuation. Outstanding debt of approximately $150M
    (Mars Growth Capital $100M + HSBC $50M) refinanced in September 2025 and maturing approximately 2029;
    covenant terms are not publicly disclosed. An IPO is contemplated but no DRHP has been filed.
