  - id: moat-durability-switching-costs
    title: "Moat Assessment, Switching Costs, and Where Eruditus Is Weaker"
    body: >-
      Eruditus's competitive moat rests on three pillars: the university co-design and revenue-share
      relationship with 80-plus institutions (requiring years of trust-building and joint curriculum
      development); a global learner and brand footprint across 80-plus countries; and the Emeritus
      Enterprise platform with 200-plus university-backed programs and curated Academies with moderate
      LMS-integration switching costs. These moats are real but partial, and several structural
      vulnerabilities are material.

      Brand dependency is the most significant structural vulnerability. Eruditus generates no credential
      value independent of its university partners; the university name carries the credential weight.
      If Harvard Business School, MIT, or Columbia choose to scale their own direct-to-learner platforms
      (HBS Online already offers programs at $1,850 per course, bypassing Eruditus entirely), the revenue-
      share model loses volume and pricing power at the top end. The dual-channel risk — universities
      running both a direct program and an Eruditus-intermediated program — compounds the dependency.

      Content scale gap is material. Coursera offers 10,600-plus courses; edX has 5,300-plus programs;
      LinkedIn Learning 24,000-plus; Eruditus has approximately 700-plus programs. This limits Eruditus's
      ability to address the mass learner seeking single-topic skills at low commitment, reduces its
      competitiveness in enterprise subscription models driven by catalog breadth, and concentrates pricing
      power in a narrow cohort-program niche that is increasingly accessible via direct-university channels
      at comparable prices.

      Consumer complaint evidence is adverse. The Better Business Bureau has recorded complaints against
      Emeritus Institute of Management including course quality, enrollment-counselor practices, and refund
      disputes. Trustpilot reviews for emeritus.org are mixed, with negative reviews citing incomplete
      program commitments and unclear refund policies. These signals indicate execution risk in converting
      the premium-program promise into consistent learner outcomes — giving direct-university alternatives
      a quality-perception advantage.

      At both pricing extremes, Eruditus faces squeeze. At the bottom, Coursera-Udemy offers consumer
      subscriptions starting under $50 per month, far below Eruditus's $2,000–$12,000-plus program fees.
      At the top, HBS Online, Wharton, and LBS charge similar or more ($1,850–$15,000 per credential)
      but deliver the full university imprimatur directly. For sophisticated buyers who can access the
      direct channel, Eruditus's value-add — primarily enrollment counseling, cohort management, and
      marketing infrastructure — diminishes.

      Multi-homing is common. B2C learners routinely enroll on multiple platforms; switching cost is low
      for individual certificates. Enterprise contracts create higher switching costs through custom program
      design, LMS integration, and branded learner portals, but even these can be replicated. The deepest
      switching costs come from multi-year enterprise Academies and co-branded corporate portals — not
      from individual program enrollments.
