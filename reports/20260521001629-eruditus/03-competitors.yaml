callouts:
  - calloutType: risk
    title: "Coursera-Udemy scale gap is structural, not tactical"
    body: >-
      The post-combination Coursera-Udemy platform reaches 290 million learners and 18,000 enterprise
      customers — an order-of-magnitude advantage over Eruditus's estimated 3–4 million enrolled learners.
      As Coursera continues to deploy AI-personalization features (Skills Tracks, Role Play) at this scale,
      the marginal cost of learning delivery falls further, widening the price-performance gap. Eruditus
      can sustain a credential premium in the short term, but commodity pressure on the long tail of
      professional certificates is a growing structural risk.
    claimRefs:
      - CP012
      - CP013
      - CP039

  - calloutType: strength
    title: "University co-design exclusivity creates a meaningful supply-side barrier"
    body: >-
      Co-design relationships with Harvard, MIT, Columbia, and 77 other university partners require years
      of institutional trust, faculty engagement, and operational track record. Pipeline exclusivity —
      universities typically do not sign overlapping online executive program deals with multiple OPM-style
      partners for the same program area — is a genuine barrier. Eruditus's fourteen-year history makes it
      the default choice for universities seeking a premium-market, globally distributed channel, and no
      current competitor replicates its multi-university portfolio at comparable depth.
    claimRefs:
      - CP001
      - CP035
      - CP036

  - calloutType: risk
    title: "2U/edX bankruptcy is a cautionary data point, not just an opportunity"
    body: >-
      2U — the closest structural precedent to Eruditus in the university-partnership online education
      space — filed for Chapter 11 in August 2024. While 2U's distress creates short-term partner
      acquisition opportunities for Eruditus, it also signals that the revenue-share university
      partnership model faces commercial stress at scale, particularly as universities develop internal
      digital capability and question OPM margin structures. Eruditus's more diversified geography and
      higher enterprise revenue share provide some buffer, but the 2U precedent underscores the need to
      reduce structural dependence on university brand intermediation.
    claimRefs:
      - CP004
      - CP005
      - CP037

