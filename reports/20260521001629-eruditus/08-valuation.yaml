callouts:
  - calloutType: risk
    title: "Flat Round at $3.2B Is a Valuation Red Flag"
    body: >
      A flat round after 38 months and near-doubling of revenue is atypical and warrants close
      scrutiny of instrument structure. Standard deal mechanics would produce a down round at
      $2.3-2.5B or a premium round approaching $4B if growth warranted it. The $3.2B outcome
      is theoretically consistent with TPG Rise leading at a maintained price to avoid a
      portfolio mark-down — a conflict-of-interest scenario that investors should explicitly
      interrogate by requesting the full Series F subscription agreement and any ratchet, PIK,
      or conversion provisions within it. The Inc42-reported $1.8B ratchet floor, if real and
      active, means the de facto valuation may be $1.8-2.3B rather than $3.2B.
    claimRefs:
