  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure-gap
      missingEvidence: "Audited consolidated group financial statements for Eruditus FY2024 and FY2025 under IND-AS or IFRS with full P&L, balance sheet, and cash flow statement."
      whyItMatters: "Without audited group financials, the dual accrual/booking EBITDA claims cannot be independently verified; valuation cannot be grounded in confirmed numbers; any investment underwrite is based on management-stated metrics."
