  - calloutType: strength
    title: "Enterprise L&D Tailwind Is the Strongest Bull-Case Anchor"
    body: >
      The structural bull case for Eruditus is not the consumer segment — which faces intense
      AI-driven competition from lower-cost platforms — but the enterprise L&D segment, where
      accredited programs from Harvard, MIT, and IIMs command budgets that AI tools do not yet
      displace. Enterprise segment growth of 40-45% YoY pre-Series F is the single most
      defensible data point in the investment thesis. If enterprise revenue approaches 40-50%
      of total group revenue (from an estimated 15-20% today) by IPO, the business's valuation
      support improves materially — enterprise SaaS-adjacent multiples of 3-5x forward revenue
      are more durable than consumer edtech multiples.
