  - id: FV002
    title: "EV/Revenue Multiple Comparison: Eruditus vs. Public Comps"
    type: bar
    layout: standard
    insight: >
      Eruditus's implied 7.1x LTM EV/Revenue (Series F $3.2B / FY24 $448M) sits 3-5x above
      the public comp range. For the $3.2B Series F to be justified on a comps basis at listing,
      Eruditus would need either a sustained India-premium multiple expansion or revenue to grow
      to ~$1.07B+ at a 3x forward P/S — approximately 2.4x current FY24 revenue.
