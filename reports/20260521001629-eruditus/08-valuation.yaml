chapter:
  number: 8
  title: Valuation
  summary: >
    Eruditus closed its October 2024 Series F at $3.2B post-money — identical to the August 2021
    Series E — making it a confirmed flat round over 38 months during which reported revenue grew
    from approximately $240M to $448M. The implied EV/Revenue is 7.1x on FY24 actuals and ~6.1x
    on FY25E guidance, representing a 3-5x premium above the 1.4-2.4x range commanded by public
    comps Coursera ($694.7M revenue, ~$1.0-1.65B market cap) and Udemy ($786.6M revenue, ~$0.76B
    market cap). Skillsoft's near-zero equity market cap relative to ~$531M revenue provides a
    sector-distress anchor, as does the 2U Chapter 11 bankruptcy in 2023. Pre-Series F reporting
    by Inc42 of negotiations at $2.3B — 28% below the announced price — with a ratchet to $1.8B
    signals that the market's clearing price was materially below the final $3.2B. The investment
    thesis rests on three pillars: (1) enterprise L&D tailwinds, (2) India growth optionality as
    revenue mix shifts toward the domestic market, and (3) a credible IPO path following the
    domicile flip to India. The anti-thesis is equally forceful: the current valuation premium is
    not supported by public market evidence; audited consolidated financials are unavailable; the
    dual accrual/booking EBITDA convention reduces transparency; and the FY25 ₹300 crore EBITDA
    target is required to support any $3.2B IPO valuation. A research-more recommendation is
    warranted until audited FY25 financials, cap table detail, and debt terms are disclosed.

sections:
  - id: valuation-context
    title: "Valuation Context and the Flat-Round Signal"
    body: >
      Eruditus's October 2024 Series F closed at $3.2B post-money, raising $150M led by TPG Rise
      Fund. This price is exactly equal to the $3.2B post-money valuation of the August 2021 Series
      E — a 0% nominal return over 38 months for the 2021 investor cohort. During the same 38-month
      period, reported FY24 revenue reached ₹3,733 crore ($448M), roughly double the estimated
      ~$240M at the time of the Series E, implying significant multiple compression: the EV/Revenue
      multiple contracted from an estimated ~13x at Series E to approximately 7.1x at Series F.
      Total lifetime equity raised across 27 investors reached $741M.

      The flat round is unusual and warrants scrutiny. Typically a flat round at the prior peak
      indicates either (a) investors are extracting structural protection through preferred terms or
      ratchets rather than taking a formal down-round, (b) the company has sufficient near-term
      operational momentum to sustain the headline number but not to justify a premium, or (c) a
      lead investor (TPG Rise) has sufficient cross-portfolio incentive to support the stated price.
      Inc42 reported that pre-Series F negotiations valued Eruditus at $2.3B — 28% below the
      announced price — with a ratchet provision that would reduce the effective price to $1.8B if
      performance targets were missed. The ultimate $3.2B closing is unexplained relative to this
      floor, and the final instrument terms (preference stack, ratchet status) remain undisclosed.

      On an adjusted enterprise value basis, adding the $150M Mars/HSBC debt facility to the $3.2B
      equity value gives an approximate EV of $3.35B, implying EV/Revenue of ~7.5x FY24 and ~6.4x
      FY25E. The FY25E guidance midpoint of ~₹4,375 crore (~$525M) is management-stated and has not
      been independently audited. Eruditus does not publish audited consolidated group financials;
      the figures cited in press coverage originate from interim unaudited management accounts or
      ROC subsidiary filings that capture parts of the group rather than the consolidated entity.
      This disclosure gap is a material constraint on any independent valuation exercise.
