  - id: recommendation-diligence
    title: "Recommendation and Final Diligence Asks"
    body: >
      The evidence supports a research-more recommendation at the $3.2B Series F entry price.
      The current valuation premium is not supported by any comparable public market evidence;
      the most analogous public companies trade at 1-2.4x EV/Revenue against Eruditus's 7.1x;
      and the pre-Series F negotiation record suggests the market's true read of the business
      was $2.3B or lower. This does not mean Eruditus is a bad business — by revenue scale,
      enterprise momentum, and university partnership depth, it is the strongest pure-play
      premium edtech company outside the US. But none of that strength justifies the current
      price in the absence of audited financials, a disclosed cap table and preference structure,
      confirmed FY25 EBITDA delivery, and a credible IPO timeline.

      The path to a buy recommendation requires: (a) delivery of audited FY25 consolidated
      financials confirming ₹300 crore+ accrual EBITDA; (b) a confirmed DRHP filing timeline
      and merchant bank mandate; (c) disclosure of the Series F instrument terms — specifically
      whether a ratchet to $1.8B was included or excluded; (d) university partner concentration
      data showing no single partner above 20% of enrollment; and (e) debt term disclosure
      (Mars/HSBC interest rate, covenants, equity-linked provisions). A track recommendation
      replaces research-more if FY25 guidance is delivered but the instrument terms and
      financials remain opaque.
