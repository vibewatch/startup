  - id: exit-ipo-readiness
    title: "IPO Path and Exit Readiness"
    body: >
      Eruditus has initiated the structural prerequisites for a domestic Indian IPO. The domicile
      flip from Singapore to India was announced alongside the Series F in October 2024 and is
      being executed through corporate restructuring during 2025. CEO Damera stated publicly in
      September 2025 (coinciding with the Mars/HSBC refinancing) that the company "gears up for
      an IPO in the next few years" — consistent with a FY2027-28 target. The $150M Mars/HSBC
      refinancing with a four-year term to approximately 2029 removes the near-term balance-sheet
      constraint that previously prevented IPO preparation: the company "doesn't need to repay debt
      now," in Damera's October 2024 words, with the prior CPPIB facility having been the
      predominant maturity risk.

      Key IPO prerequisites and their current status: (1) Domicile flip — in progress; (2) SEBI
      DRHP filing — not yet filed; (3) appointment of SEBI-registered merchant banker / investment
      bank — not publicly disclosed; (4) audited consolidated financial statements under Indian
      accounting standards — not yet published for FY24 or FY25; (5) FY25 revenue and EBITDA
      milestones — FY25 not yet ended as of run date, targets disclosed but not yet delivered.
      The most material constraint on IPO readiness is the absence of publicly available audited
      group financials. Any prospectus filing requires audited accounts for three full fiscal years;
      this process will likely begin in H2 2025-H1 2026 at the earliest.

      From an exit perspective, secondary sale or strategic acquisition alternatives exist but are
      constrained: the $3.2B headline price limits buyer appetite unless fundamentals improve
      materially. The most likely exit path is a BSE/NSE listing with a potential anchor tranche
      retained by institutional investors. No strategic buyer acquisition has been reported or
      indicated in public sources.
