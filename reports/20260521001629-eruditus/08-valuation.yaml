  - id: comparable-set
    title: "Public Comparable Valuation Set"
    body: >
      Three public comparables provide the most direct evidence for Eruditus's market multiple.
      Coursera (COUR) is the highest-quality B2C and enterprise online learning platform: FY2024
      revenue was $694.7M (9% YoY growth), gross margin was 53%, net loss was $79.5M, and the
      non-affiliate market capitalization was approximately $1.0B as of June 30, 2024 per its
      annual filing. By October 2025, Macrotrends data shows Coursera's market cap had recovered
      to approximately $1.65B, reflecting a P/S range of 1.4-2.4x on FY2024 revenue. Coursera
      also carries minimal net debt, so the EV/Revenue approximates the P/S ratio.

      Udemy (UDMY) is the largest pure-play online skills marketplace: FY2024 revenue was $786.6M
      ($494.5M enterprise + $292.1M consumer), with a net loss of $85.3M. Macrotrends data shows
      a market cap of approximately $760M as of November 2025, implying a P/S of ~0.97x on FY2024
      revenue. Udemy's enterprise segment penetration (63% of revenue) is notably higher than its
      overall multiple suggests, indicating the market discounts consumer revenue churn risk.

      Skillsoft (SKIL) provides the sector distress signal: its most recent fiscal year (ending
      January 2025) included TDS segment revenue of $405.5M, representing 76.4% of total revenue,
      implying total company revenue of approximately $531M. Yet the aggregate market cap of
      non-affiliate shares was only $60.4M as of July 31, 2024 — a P/S of roughly 0.11x on equity
      alone (approximately 1.2x EV/Revenue once the $594.6M term loan is included). Skillsoft
      recorded $202.2M in goodwill impairment in Q4 FY2024, citing "observed prolonged and
      substantial decline in the Company's stock price and market capitalization, competitive
      market analysis and observable industry multiples." This phrase is the edtech sector's most
      precise recent statement of market multiple compression. 2U's Chapter 11 filing in 2023
      anchors the worst-case end of the comparables spectrum.

      Eruditus's 7.1x LTM EV/Revenue sits 3-5x above the 1-2x range represented by Coursera and
      Udemy, and more than 50x above Skillsoft's distressed equity multiple. A portion of this
      premium is defensible: Eruditus is pre-IPO (illiquidity premium of 20-30% is customary),
      operates in a structurally higher-growth geography (India), and shows improving EBITDA
      trajectory. However, no combination of these justifications mathematically closes the 3-5x
      gap without assuming a sustained IPO re-rating that returns the company to 2021-era sentiment.
