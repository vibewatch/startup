  - id: investment-thesis-anti-thesis
    title: "Investment Thesis and Anti-Thesis"
    body: >
      The investment thesis for Eruditus rests on four reinforcing pillars. First, the global
      corporate L&D market is structurally large and growing: HolonIQ data cited in prior chapters
      estimates the total addressable market at $350-370B, with an executive and professional
      education subset of ~$50-70B that Eruditus's online-hybrid model directly addresses. Enterprise
      clients — the fastest-growing segment, with reported 40-45% YoY growth pre-Series F — are
      increasingly allocating L&D budgets to accredited, outcome-linked programs, where Eruditus's
      elite university brand partnerships are difficult to replicate. Second, the India growth
      option is highly asymmetric: India currently accounts for 27-28% of revenue and CEO Damera
      has stated a target to grow this to 50% within five years; at current P/S valuations on
      India-listed large-cap tech peers, a significant India-premium re-rating at IPO is plausible
      in the bull case. Third, the path to profitability is credible: accrual EBITDA loss narrowed
      from ₹-417 crore (FY23) to ₹-69 crore (FY24), and the FY25 target of ₹300 crore positive
      accrual EBITDA would represent an extraordinary swing to profitability. Fourth, the Sept 2025
      refinancing of Mars/HSBC removes the near-term balance-sheet risk that previously constrained
      IPO optionality. The 80+ university partnerships — including Harvard, MIT, Wharton, Columbia,
      INSEAD, ISB, and the IIMs — form a structural moat that no Indian digital competitor currently
      replicates at this depth.

      The anti-thesis is equally material. Coursera (COUR) and Udemy (UDMY) — both public, audited,
      and considerably larger in revenue — trade at 1.0-2.4x EV/Revenue. Skillsoft's near-zero
      public equity and the 2U Chapter 11 bankruptcy anchor the sector's downside range. At 7.1x
      LTM EV/Revenue, Eruditus demands a premium that is not supported by any disclosed comparable.
      The Inc42-reported $2.3B pre-Series F negotiation and the $1.8B ratchet floor signal that
      sophisticated counterparties valued the business at 44-56% below the announced price; the
      mechanism by which the final price reached $3.2B without a structural improvement in
      fundamentals has not been publicly explained. Revenue growth of 13.8% in FY24 understates
      the deceleration from the 30-40% CAGR management cited in 2021-2022 to investors. The dual
      EBITDA reporting (accrual vs. booking) is non-standard and reduces confidence in any
      margin calculation. No audited consolidated financial statements have been published.
