  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-tutor-architecture
    missingEvidence: Technical documentation on tutor architecture, adaptive-learning logic, model evaluation, or learner-outcome improvement from the proprietary AI tutors.
    whyItMatters: AI is now part of the investment story and differentiation case, but public disclosures are roadmap-level rather than platform-level.
    diligencePath: Request product demos, architecture notes, model-governance documents, and measured A/B or completion-outcome data by tutor-enabled program.
    relatedQuestionRefs:
    - QE015
  - type: missing-source
    severity: material
    topic: enterprise-analytics-and-integrations
    missingEvidence: Detailed admin-dashboard metrics, HRIS/LMS integration options, SSO/SCIM support, and any public API or reporting schema for enterprise buyers.
    whyItMatters: Enterprise durability and switching costs depend on whether the portal is a lightweight enrollment tool or a deeper integrated learning product.
    diligencePath: Obtain enterprise product documentation, admin screenshots, integration guides, and reference-customer implementation notes.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: partner-contract-and-ip-economics
    missingEvidence: Public evidence on revenue-share percentages, exclusivity terms, ownership of newly produced content, and rights to partner-school case studies or assessments.
    whyItMatters: Eruditus's moat depends on whether partner relationships lock in defensible economics and content rights, not only marketing access.
    diligencePath: Request sample university partnership contracts, IP schedules, and any internal policy describing content licensing and renewal mechanics.
