- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / quality signal
  - Public status
  - Scope
  - Source-backed implication
  - Gap / risk
  rows:
  - - Privacy notices
    - Published
    - Prospective students and other stakeholder categories
    - Data-handling obligations are acknowledged across multiple user types
    - No detailed cross-border data-flow map or retention policy surfaced in fetched set
  - - Accessibility statement
    - Published
    - Website accessibility and third-party-domain caveat
    - Accessibility is at least explicitly governed and externally reachable
    - Third-party learning touchpoints may not match the same standard
  - - Vulnerability disclosure policy
    - Published
    - Researcher submissions and proof-of-concept handling
    - Shows willingness to receive external security reports
    - No bug-bounty payouts, SLAs, or formal security-certification mapping disclosed
