- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / process
  - Public evidence
  - Role in delivery
  - Proprietary vs commoditized
  - Risk / diligence gap
  rows:
  - - University content and faculty layer
    - Partner-school pages describe faculty-led, cohort-based programs
    - Supplies curriculum authority, brand, and live teaching
    - Differentiated via partner access; not owned end-to-end by Eruditus
    - Revenue-share, IP ownership, and exclusivity terms are undisclosed
  - - Program management and advising
    - Careers page lists program-management and services-delivery roles
    - Coordinates cohort operations, learner support, and business customization
    - Likely proprietary operating know-how more than software IP
    - Labor intensity and scalability economics are not public
  - - Enterprise portal and approvals flow
    - Enterprise page references a company portal, approvals, and engagement dashboard
    - Lets employers manage sponsored enrollment and monitor engagement
    - Partly differentiated workflow; UI/integration depth lightly specified
    - No public API, HRIS, SSO, or LMS-integration documentation
  - - Canvas classroom
    - Help center explicitly names Canvas
    - Hosts enrolled courses and assignment workflows
    - Commodity LMS dependency
    - Migration effort and customization depth are not public
  - - Live-session layer
    - Partner pages reference live online sessions and office hours
    - Supports synchronous instruction and faculty interaction
    - Tooling not publicly named; likely third-party
    - Webinar vendor, recording workflow, and attendance telemetry are undisclosed
  - - Mobile app layer
    - Google Play listing exposes coursework and communication features
    - Adds mobile access, reminders, and lightweight collaboration
    - Convenience wrapper on top of classroom workflows
    - No public mobile MAU, crash, or retention data
  - - Credentialing layer
    - Help center says certificates are issued through Accredible
    - Produces verifiable digital credentials after completion
    - Commodity credential platform dependency
    - Economic terms and failure handling are not public
  - - Policy and control layer
    - Privacy, accessibility, and vulnerability pages are public
    - Provides baseline trust/compliance guardrails
    - Mostly standard policy infrastructure
    - No public enterprise certification or proctoring detail
  notes: |-
    Where a component is labeled "commoditized," that means the public evidence points to standard third-party tooling rather than a clearly disclosed proprietary subsystem. It does not mean the operating workflow above that tool is generic.
