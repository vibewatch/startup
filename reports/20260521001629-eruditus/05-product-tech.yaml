callouts:
- calloutType: strength
  title: Differentiation Sits Above the LMS
  body: |-
    The public record makes Eruditus look strongest in partner access, cohort design, advising, enterprise customization, and managed delivery. The named classroom and credential layers, by contrast, look largely third-party.
  claimRefs:
  - CE032
  - CE033
- calloutType: risk
  title: Partner Disintermediation Is a Product Risk
  body: |-
    When Columbia, Wharton, or Harvard run their own live online or self-paced channels, Eruditus competes not only on distribution but also on whether its orchestration layer adds enough value to justify sitting between school and learner.
  claimRefs:
  - CE030
  - CE031
- calloutType: risk
  title: Public AI Claims Outrun Public Technical Detail
  body: |-
    Eruditus has official AI-tutor and generative-AI roadmap statements, but the fetched pages do not explain model architecture, adaptive-learning logic, or measured tutor outcomes. Investors should treat the AI edge as plausible but under-disclosed.
  claimRefs:
  - CE020
  - CE022
  - CE040
