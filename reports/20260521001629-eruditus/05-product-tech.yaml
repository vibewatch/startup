- id: platform-stack-workflow
  title: Platform Stack, Learner Workflow & Publicly Visible Tooling
  body: |-
    The publicly named classroom stack is narrower and more commoditized than the Eruditus brand narrative might imply. The clearest named system is Canvas: the official help center sends learners to admissions.emeritus.org/classroom/login and says the dashboard exposes enrolled courses. Assignment extensions are also handled through a Canvas dashboard function, and third-party review material says browser compatibility is tied to current Chrome, Edge, Safari, and Firefox versions with JavaScript, cookies, and Respondus LockDown Browser support. Those details suggest the core learning environment is a configured LMS workflow, not a uniquely disclosed in-house classroom engine.

    The learner-experience layer adds convenience and orchestration on top of that foundation. The Emeritus Classroom app on Google Play exposes grades, course content, assignments, discussion boards, messaging, quizzes, calendars, and notifications on mobile. Credentialing is also externalized: Emeritus says certificates are issued through Accredible, emailed after assignment completion and grading, and designed for social sharing or PDF download. Around the stack, Eruditus publishes a vulnerability disclosure policy, privacy notices, and an accessibility statement, which shows a baseline compliance posture but not the deeper enterprise-security evidence investors would usually want. In practical terms, the product feels like a managed orchestration layer above third-party classroom and credential utilities, with limited public disclosure on webinar tooling, proctoring, or identity architecture.
