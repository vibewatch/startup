- id: product-risks-commoditization
  title: Product Risks, Partner Dependence & What Appears Commoditized
  body: |-
    The core product risk is that Eruditus differentiates above the classroom rather than within it. Public evidence points to Canvas and Accredible as important learner-delivery utilities, while the app layer largely mirrors those classroom workflows on mobile. That means a meaningful part of the operating stack is commoditized and potentially replaceable. The more defensible layer is orchestration: finding university partners, designing cohorts, recruiting learners, supporting assignments, customizing enterprise cohorts, and attaching AI-assisted experiences on top. If those services become easier for partner schools or competitors to internalize, product advantage narrows quickly.

    Partner disintermediation is therefore not just a commercial risk; it is a product-design risk. Columbia and Wharton both describe live online, self-paced, and blended channels on their own properties, and HBS Online shows that elite schools can operate direct certificate and AI programs without an intermediary. At the same time, public complaint surfaces remain visible through BBB and review aggregators, while public materials do not disclose proctoring vendors, webinar tooling, or named enterprise-security certifications. The result is a product that looks strong in portfolio breadth and managed delivery, but still under-documented where investors usually test platform durability: integration depth, learning-effectiveness measurement, tutor performance, and defensibility if major university partners expand direct channels.
