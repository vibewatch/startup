tables:
- id: TE001
  title: Eruditus Product Module / Offer Matrix
  columns:
  - Offer / module
  - Primary user
  - Delivery mode
  - Public maturity signal
  - Differentiation
  - Diligence gap
  rows:
  - - Short online certificates
    - Working professionals
    - Mostly asynchronous modules plus cohort/live touchpoints
    - 80+ university network and broad online certificate catalog
    - Prestige brand plus structured cohort support
    - Program-level completion and repeat-purchase rates by school
  - - Senior executive / C-suite journeys
    - Senior executives and succession-track leaders
    - 'Blended: online, live online, and in-person'
    - Columbia CEO format is 8-10 months with weekly live sessions
    - High-touch faculty interaction, global peer cohort, capstones
    - Attach rate versus direct-university channels
  - - Technology and AI acceleration programs
    - Mid-career leaders and functional managers
    - Short online cohort formats
    - Wharton and MIT xPRO information sessions show 6-week and live-office-hour structures
    - Applied tech curriculum with live discussions and projects
    - How much is reusable template versus school-specific design
  - - Enterprise public cohorts
    - L&D teams enrolling employees into open programs
    - Employees join shared cohorts with outside peers
    - Official and review sources both mention group/public cohort use
    - Fast deployment without building a private classroom from scratch
    - Completion and employer ROI by account segment
  - - Enterprise private cohorts and portals
    - Corporate buyers and governments
    - Private cohort plus company portal
    - Official enterprise page describes secure employee-only cohorts and approvals dashboard
    - Customization of case studies, exercises, and course leader; admin portal
    - HRIS/LMS integration depth and analytics granularity
  - - Bootcamps and PG diploma / longer certificates
    - Career-switchers and upskillers
    - Longer structured online programs
    - Careers page plus third-party review show bootcamps and PG diplomas in portfolio
    - Broadens TAM beyond classic executive certificates
    - Unit economics and accreditation/credit-recognition boundaries
  notes: |-
    This matrix mixes official company pages, partner-school pages, and review/FAQ sources. "Maturity signal" means publicly visible operating evidence, not audited revenue contribution.
