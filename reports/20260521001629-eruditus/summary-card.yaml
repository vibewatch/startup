  topStrengths:
    - >-
      Exclusive contracts with 80+ top-tier university brands (Harvard, MIT, Columbia, IIMs) create a high-friction moat
      that pure-content platforms cannot easily replicate — partner tenure of 10+ years at flagship institutions
      corroborates durability.
    - >-
      Operating leverage improving sharply: accrual EBITDA loss narrowed 83% from ₹-417 crore (FY23) to ₹-69 crore
      (FY24), and booking-basis EBITDA is already positive, suggesting the business model is structurally sound.
    - >-
      Revenue scale ($448M FY24) and enterprise momentum (enterprise segment growing 40-45% YoY, representing an
      increasing share of bookings) position Eruditus as the largest pure-play global online executive education
      operator.
    - >-
      India geography (27-28% of revenue) provides structural tailwind from a large working-professional population with
      high willingness-to-pay for premium credentials, offsetting macro-sensitivity in Western markets.
  topRisks:
    - >-
      Flat $3.2B Series F valuation at 7.1x FY24 EV/Revenue is a 3-5x premium to Coursera (1.4-2.4x) and Udemy (~1x);
      pre-Series F negotiations reportedly reached $2.3B with a $1.8B ratchet, meaning the announced valuation may
      overstate market consensus by 28-44%.
    - >-
      Outstanding $150M debt facility (Mars Growth / HSBC, ~2029 maturity) with undisclosed interest rate, covenants,
      and equity-linked provisions represents a material unknown; the prior CPPIB $350M facility was collateralized
      against equity, suggesting risk of dilutive provisions in the new arrangement.
    - >-
      Audited, consolidated financials are not publicly available; all financial data is sourced from unaudited MCA/RoC
      filings for the Indian operating entity or third-party media, making it impossible to independently verify
      group-level revenue, margins, or cash position.
    - >-
      Revenue growth decelerated sharply from approximately 70-75% (FY22→FY23) to 12% (FY23→FY24); if FY25 guidance of
      ₹4,330-4,420 crore ($520-530M) is not delivered, the $3.2B valuation will be impossible to defend in an IPO.
    - >-
      IPO is contingent on audited FY25 financials confirming ₹300+ crore accrual EBITDA, a DRHP filing, and favorable
      public-market edtech sentiment — all of which remain uncertain and execution-dependent.
  unresolvedGaps:
    - >-
      Series F instrument terms (ratchet provisions, liquidation preference, anti-dilution mechanism) have not been
      disclosed and are critical to understanding the effective entry price for Series E investors.
    - >-
      Audited consolidated financial statements for the group (Singapore holding entity + subsidiaries) are not publicly
      available; no DRHP, S-1, or equivalent filing has been made.
    - >-
      Mars Growth Capital / HSBC debt terms (interest rate, SOFR spread, financial maintenance covenants, and any
      equity-linked provisions) remain undisclosed.
    - >-
      University partner concentration data — specifically whether any single partner accounts for more than 15-20% of
      total enrollment or revenue — has not been published.
    - >-
      FY25 actual financial performance against guidance (₹4,330-4,420 crore revenue, ₹300 crore EBITDA) has not been
      reported as of the run date.
