summary:
  headline: >-
    Eruditus 拥有在线高管教育里最强的大学伙伴护城河，基本面也在改善；但 $3.2B 平轮估值对应 FY24 收入 7.1x，比上市 edtech 可比公司高
    3-5x，加上合并财务不透明、债务条款未披露，唯一站得住的判断是继续研究。
