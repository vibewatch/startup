  - id: section-O2
    title: "Founders, leadership, and governance"
    body: >
      Eruditus was co-founded by Ashwin Damera (CEO) and Chaitanya Kalipatnapu (Co-founder and Executive Director).
      Damera held approximately 40% equity in the company after the August 2021 Series E round, making him one of
      the few founders of a billion-dollar Indian startup to retain a majority-scale stake into the unicorn phase.
      His background prior to Eruditus included a stint at Booz Allen Hamilton and founding Tutorvista (acquired by
      Pearson). Kalipatnapu, as Executive Director, has been the public face on financial and operational disclosures,
      including FY24 performance commentary to Moneycontrol in April 2025.

      The company is in its fourteenth year of operations as of October 2024, and Damera has highlighted the long
      institutional track record and quality of the investor base as key governance differentiators in a sector
      marked by Byju's-scale governance failures. The board was strengthened with the October 2024 Series F: TPG's
      Simit Batra joined the Eruditus board of directors as part of the Rise Fund's investment. Other investors with
      likely board representation or observer rights include SoftBank Vision Fund 2, Accel, Leeds Illuminate, CPP
      Investments, Chan Zuckerberg Initiative, Prosus Ventures, GSV Ventures, Peak XV (formerly Sequoia India), and
      Bertelsmann, though the exact seat map is not publicly disclosed for a private company. No material leadership
      departures or governance adverse events are reported as of May 2026.

      A key governance transition is ongoing: Eruditus initiated the redomicile process from Singapore to India in
      late 2024, appointing consultants shortly after closing the Series F. Damera has stated publicly that the
      redomicile to India would be completed in 2025 before rolling out an IPO. The domicile flip is a standard
      pre-IPO move for Singapore/US-holdco Indian-operating companies and is a prerequisite for a BSE/NSE listing.
