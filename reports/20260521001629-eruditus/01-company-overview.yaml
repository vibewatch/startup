callouts:
  - calloutType: strength
    title: "Largest Indian edtech by revenue — sustainable market position"
    body: >
      Eruditus's ₹3,733 crore FY24 revenue is 1.8–1.9x PhysicsWallah and more than twice upGrad, cementing its
      position as India's largest operational edtech company. Combined with 80+ prestigious university partnerships
      (including Harvard, Columbia, and MIT), an 85% course completion rate, and an enterprise business growing at
      45% YoY, the company's market position appears durable. The university co-brand model creates structural
      barriers that pure-play MOOC competitors cannot easily replicate.
    claimRefs:
      - CO009
      - CO026
      - CO031
      - CO033
      - CO034

  - calloutType: risk
    title: "Flat valuation and CPPIB bullet debt create pre-IPO pressure"
    body: >
      The October 2024 Series F at a flat $3.1–3.2 billion valuation (unchanged from August 2021) signals a
      meaningful sector de-rating after the 2021 edtech boom. The $350 million CPPIB bullet debt from March 2022
      matures approximately in 2027, creating a repayment obligation that will overlap with the IPO preparation
      timeline. If the India redomicile or DRHP filing is delayed, Eruditus may face simultaneous debt repayment
      and listing pressure in the same calendar year. The refinancing of the legacy Mars/HSBC facility buys runway
      but does not address the CPPIB bullet.
    claimRefs:
      - CO020
      - CO021
      - CO022
      - CO023
      - CO035
      - CO036
      - CO038

  - calloutType: insight
    title: "Booking-basis vs. accrual EBITDA gap warrants IPO scrutiny"
    body: >
      Eruditus's FY24 financial reporting shows a gap between its accrual-basis adjusted EBITDA loss (₹69 crore)
      and its booking/cash-basis profitability (₹28–80 crore positive, cited by the two co-founders to different
      outlets). The company also deferred ₹800 crore in collected revenue to the next fiscal year under standard
      accounting conventions. IPO investors will need DRHP-grade Ind-AS financial statements to reconcile these
      figures and validate the profitability narrative. The discrepancy is not inherently adverse but represents
      a material gap in public evidence prior to any SEBI filing.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO038
      - CO046
      - CO047

