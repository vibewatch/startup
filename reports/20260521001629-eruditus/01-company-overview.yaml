company:
  name: "Eruditus"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Eruditus, the Singapore-headquartered parent company of the Emeritus brand, was founded in 2010 by Ashwin Damera
    and Chaitanya Kalipatnapu to make world-class executive education accessible to working professionals globally.
    As of May 2026, Eruditus operates at ₹3,733 crore FY24 revenue (largest Indian edtech by revenue), holds a
    roughly $3.1–$3.2 billion valuation following its October 2024 Series F led by TPG Rise, and is executing a
    Singapore-to-India domicile flip ahead of a planned IPO.

sections:
  - id: section-O1
    title: "Identity, headquarters, and operating model"
    body: >
      Eruditus (legal name: Eruditus Learning Solutions Pte. Ltd.) is a Singapore-registered education technology
      company founded in 2010 by Ashwin Damera and Chaitanya Kalipatnapu. The company's stated mission is to make
      high-quality education accessible and affordable to individuals, organizations, and governments worldwide. Its
      primary consumer-facing brand is Emeritus; a separate "Eruditus Executive Education" brand serves the senior
      executive cohort segment. The Indian holding entity, Eruditus Education Private Limited, was incorporated in
      Tamil Nadu in October 2010. As of the October 2024 Series F announcement, Eruditus operates offices in Mumbai,
      New Delhi, Shanghai, Singapore, Palo Alto, Mexico City, New York, Boston, London, and Dubai, with more than
      1,750 employees globally.

      The company's operating model is a university-partnership platform: Eruditus co-designs curricula with tier-one
      academic institutions, builds the digital-delivery and marketing infrastructure, enrolls learners, and shares
      program revenue with university partners. This contrasts with pure-play MOOC platforms that host third-party
      content. As of October 2024, Eruditus partners with more than 80 universities — including Harvard Business
      School, Columbia Business School, MIT, ISB, and IIMs — to deliver 700+ professional learning programs. These
      programs range from short-duration online certificates (4–16 weeks) to immersive senior executive programs
      (18–24 weeks blended) and post-graduate certificates. Columbia Business School has collaborated with Emeritus
      for more than ten years in C-suite and emerging-leader programming.

      Revenue comes from two primary demand-side channels: a B2C (direct-to-learner) segment and a B2B enterprise
      segment (corporate L&D and government workforce development). The enterprise segment contributed approximately
      15% of total business as of October 2024, growing at 45% year-on-year in the year before the Series F, and the
      company doubled its enterprise business in the two years preceding the October 2024 funding round. India
      contributes approximately 27–28% of overall business by revenue. The remainder of revenue derives from the
      United States, Europe, Latin America, Middle East, and Asia-Pacific.
