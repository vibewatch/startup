  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Debt, Capital Structure, and Refinancing Risk
        blocks:
          - type: paragraph
            body: >
              Eruditus carries meaningful leverage relative to its disclosed earnings profile. The company has
              historically relied heavily on debt to fund growth: a $350M CPPIB facility raised in March 2022 supported
              aggressive content and geographic expansion, and has since been largely refinanced into a
              $130M-initial/$20M-option facility led by Mars Growth Capital (Liquidity-MUFG joint venture, up to $100M)
              and HSBC (up to $50M), closed in September 2025 with a four-year term running to approximately 2029. The
              refinancing preserved financial flexibility but no public disclosure of interest rate, LIBOR/SOFR spread,
              amortization schedule, financial maintenance covenants, or equity-linked provisions has been made. This
              opacity is a material diligence gap. The company also raised $150M in Series F equity at a flat $3.2B
              post-money valuation in October 2024—unchanged from the August 2021 peak—signaling that growth
              expectations have moderated sharply among equity investors while the sector weathered Byju's collapse and
              Unacademy's retrenchment. Revenue growth of 12% in FY24 (₹3,733 crore vs. ₹3,280 crore in FY23) undercuts
              the 30-35% compound annual growth management cited to investors in 2024, creating downside risk to the
              FY25 target of ₹5,000 crore revenue and ₹300 crore EBITDA that underpins the IPO thesis. If the FY25
              targets are missed, debt retirement from IPO proceeds becomes delayed and the refinancing cycle must
              repeat at whatever interest-rate environment prevails in 2029. CEO Ashwin Damera noted in October 2024
              that the company "doesn't need to repay debt now" with debt "at the end of next year," suggesting the
              original CPPIB facility maturity was 2025—confirming that the 2025 Mars/HSBC refinancing was necessary and
              therefore not merely opportunistic.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
