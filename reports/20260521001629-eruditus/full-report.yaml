      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              The bull scenario assumes Eruditus sustains 20-25% revenue CAGR through FY2026-27 (reaching ~$600-700M),
              achieves and exceeds the ₹300 crore FY25 EBITDA target, completes the India domicile flip without
              complications, and lists on NSE/BSE in FY2027 into a favorable market window. Under this scenario, an
              Indian tech listing could attract a 3-5x forward EV/Revenue multiple supported by India-growth narrative
              and enterprise tailwinds. At 4x forward on ~$650M revenue, the IPO valuation reaches ~$2.6B — still below
              the $3.2B Series F entry price. For a $3.2B+ IPO, the public market would need to apply 5x+ forward P/S on
              $650M revenue or apply a higher multiple to $700M+ revenue — scenarios that require either India to
              sustain a premium above global edtech comps or the sector itself to re-rate materially.

              The base scenario assumes 12-18% revenue CAGR to approximately $550-600M by FY2026-27, accrual EBITDA
              achieved but below ₹300 crore, and a BSE/NSE listing at 2-2.5x forward EV/Revenue — the high end of the
              current public comp range plus a modest illiquidity premium. This produces an implied IPO valuation range
              of approximately $1.1-1.5B — a 53-66% dilution from the $3.2B Series F price. Series F investors at $3.2B
              would face meaningful markdowns relative to cost; however, Series B and C investors at $450-680M
              valuations would retain positive returns.

              The bear scenario assumes revenue growth falls below 10% (consistent with the 13.8% FY24 trajectory
              continuing to decelerate as the post-COVID skills-investment cycle normalizes), FY25 EBITDA targets are
              missed, and the IPO is deferred to FY2028 or later. The Mars/HSBC 2029 maturity would then require
              refinancing again, likely at higher rates. Sector multiple compression continues in line with Skillsoft
              and 2U precedents, driving IPO valuations to 1-1.5x forward P/S on ~$500-550M revenue — approximately
              $500-825M. This scenario entails an 74-84% dilution from the $3.2B Series F, represents a below-cost
              recovery for all investors from Series E onward, and makes the pre-Series F ratchet floor of $1.8B the
              relevant anchor rather than the headline $3.2B.
            claimRefs:
              - CV043
              - CV045
              - CV046
