      - number: '6.5'
        title: Retention Durability, Expansion & Transparency Gaps
        blocks:
          - type: paragraph
            body: >-
              The most material diligence gap in the customers chapter is the complete absence of publicly disclosed
              retention or durability metrics. Net Revenue Retention (NRR), Gross Revenue Retention (GRR), enterprise
              account renewal rates, B2C repeat-program purchase rates, and cohort survival curves are not published in
              any accessible form. The only proxy for learner durability is the 85% completion rate—company-stated and
              not corroborated by a third party—which measures in-program engagement rather than post-program loyalty.
              Enterprise revenue doubling over two years is consistent with strong net expansion, but without knowing
              whether growth comes from new logos or from expansion within existing accounts, the durability quality
              cannot be assessed.


              Concentration risk is similarly under-disclosed. No enterprise client list is public, no Herfindahl index
              or top-10-customer revenue share has been disclosed, and no geographic breakdown of enterprise revenue is
              available beyond the statement that India plus enterprise together represent a major growth axis. B2C
              revenue depends on continued discretionary spend by individual professionals, which is sensitive to macro
              conditions, employer reimbursement policy, and competitive program launches by direct university channels.
