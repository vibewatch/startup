      - number: '4.2'
        title: Cost Architecture and Profitability Path
        blocks:
          - type: paragraph
            body: >-
              Eruditus's cost model rests on three pillars: marketing and customer acquisition, university
              revenue-sharing fees, and platform operations. Marketing is structurally the highest-visibility expense,
              consuming 29% of FY23 revenue (₹1,241 crore) and improving to 27% in FY24 (₹1,007 crore)—an 18.85%
              absolute decline despite modest revenue growth. This compression is a primary driver of the FY24 EBITDA
              improvement and management expects further moderation as brand recognition matures and program bundles
              raise customer lifetime value.


              University partnership fees—the revenue share paid to institutional partners—represented approximately 31%
              of total group expenditure in FY23 (₹1,356 crore on ₹4,392 crore total expenses). These fees are
              structurally semi-fixed relative to volume, meaning gross margin is capped by partner economics and does
              not scale freely. FY23 gross margin was approximately ₹1,734 crore on ₹3,320 crore revenue, or ~52%; FY24
              gross margin is not separately disclosed, though the reduction in operating expenses suggests modest
              improvement. Platform other operating expenses declined 32.16% to ₹1,045 crore in FY24 from ₹1,541 crore
              in FY23, reflecting pruning of low-performing courses and operational efficiency programs.


              The net accrual EBITDA loss of ₹69 crore (-1.8% margin) in FY24 is thin but the trajectory is strong: ₹417
              crore loss in FY23, ₹69 crore in FY24, booking-basis profitability already achieved. FY24 net loss in USD
              terms narrowed to $85.6M from $127.2M in FY23. Whether EBITDA margin turns durably positive on an accrual
              basis in FY25 depends on sustaining the ~2% marketing-cost ratio reduction while growing revenue at
              15–20%—a condition that is plausible but not yet confirmed with reported results.
