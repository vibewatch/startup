      - number: '6.4'
        title: Adverse Evidence, Reviews & Service Failures
        blocks:
          - type: paragraph
            body: >-
              Independent review signals reveal a recurring cluster of customer complaints that are not visible in the
              company's own satisfaction statistics. MouthShut, India's oldest consumer review platform, hosts reviews
              of Eruditus Executive Education (the legal entity name) with complaints centering on three themes:
              pre-enrollment refund refusal even when cancellation occurs before the program start date; absence of
              post-payment customer communication, with reviewers describing complete silence from the company after
              payment was collected; and cost concerns, where learners characterize program fees as high relative to the
              quality of support received. The Better Business Bureau page for Emeritus Institute of Management (Boston,
              MA) lists consumer complaints, though full complaint text was inaccessible at scrape time. Trustpilot's
              Emeritus page was blocked (403) during data collection, preventing score or sentiment verification.


              The adverse signal pattern suggests that the highest-friction customer experience occurs at the edges of
              the learner relationship: pre-enrollment cancellation and early-post-enrollment support. Neither MouthShut
              nor BBB represent large review volumes, and the company's Shiksha rating (5.0 from 56 reviews) points in
              the opposite direction for India-based learners in good standing. However, the refund-refusal theme is
              consistent across multiple unrelated reviewers and points to a policy gap that can damage brand trust and
              generate chargebacks. No public NPS score, CSAT benchmark, or satisfaction auditor has been disclosed to
              triangulate between the company's positive aggregate statistics and the adverse platform signals.
