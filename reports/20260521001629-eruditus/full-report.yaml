            body: >
              Eruditus's ₹3,733 crore FY24 revenue is 1.8–1.9x PhysicsWallah and more than twice upGrad, cementing its
              position as India's largest operational edtech company. Combined with 80+ prestigious university
              partnerships (including Harvard, Columbia, and MIT), an 85% course completion rate, and an enterprise
              business growing at 45% YoY, the company's market position appears durable. The university co-brand model
              creates structural barriers that pure-play MOOC competitors cannot easily replicate.
