    type: range
    layout: standard
    summary: >
      Low and high bounds for implied Eruditus IPO valuation under bear, base, and bull scenarios, derived by applying
      forward EV/Revenue multiples from the public comparable set to estimated FY2026-27 revenue ranges. The current
      $3.2B Series F price is shown as a reference anchor.
