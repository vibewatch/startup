      - number: '8.5'
        title: IPO Path and Exit Readiness
        blocks:
          - type: paragraph
            body: >
              Eruditus has initiated the structural prerequisites for a domestic Indian IPO. The domicile flip from
              Singapore to India was announced alongside the Series F in October 2024 and is being executed through
              corporate restructuring during 2025. CEO Damera stated publicly in September 2025 (coinciding with the
              Mars/HSBC refinancing) that the company "gears up for an IPO in the next few years" — consistent with a
              FY2027-28 target. The $150M Mars/HSBC refinancing with a four-year term to approximately 2029 removes the
              near-term balance-sheet constraint that previously prevented IPO preparation: the company "doesn't need to
              repay debt now," in Damera's October 2024 words, with the prior CPPIB facility having been the predominant
              maturity risk.

              Key IPO prerequisites and their current status: (1) Domicile flip — in progress; (2) SEBI DRHP filing —
              not yet filed; (3) appointment of SEBI-registered merchant banker / investment bank — not publicly
              disclosed; (4) audited consolidated financial statements under Indian accounting standards — not yet
              published for FY24 or FY25; (5) FY25 revenue and EBITDA milestones — FY25 not yet ended as of run date,
              targets disclosed but not yet delivered. The most material constraint on IPO readiness is the absence of
              publicly available audited group financials. Any prospectus filing requires audited accounts for three
              full fiscal years; this process will likely begin in H2 2025-H1 2026 at the earliest.

              From an exit perspective, secondary sale or strategic acquisition alternatives exist but are constrained:
              the $3.2B headline price limits buyer appetite unless fundamentals improve materially. The most likely
              exit path is a BSE/NSE listing with a potential anchor tranche retained by institutional investors. No
              strategic buyer acquisition has been reported or indicated in public sources.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV046
              - CV048
              - CV049
          - type: table
            tableRef: TV005
            claimRefs:
              - CV048
              - CV049
      - number: '8.6'
        title: Recommendation and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The evidence supports a research-more recommendation at the $3.2B Series F entry price. The current
              valuation premium is not supported by any comparable public market evidence; the most analogous public
              companies trade at 1-2.4x EV/Revenue against Eruditus's 7.1x; and the pre-Series F negotiation record
              suggests the market's true read of the business was $2.3B or lower. This does not mean Eruditus is a bad
              business — by revenue scale, enterprise momentum, and university partnership depth, it is the strongest
              pure-play premium edtech company outside the US. But none of that strength justifies the current price in
              the absence of audited financials, a disclosed cap table and preference structure, confirmed FY25 EBITDA
              delivery, and a credible IPO timeline.

              The path to a buy recommendation requires: (a) delivery of audited FY25 consolidated financials confirming
              ₹300 crore+ accrual EBITDA; (b) a confirmed DRHP filing timeline and merchant bank mandate; (c) disclosure
              of the Series F instrument terms — specifically whether a ratchet to $1.8B was included or excluded; (d)
              university partner concentration data showing no single partner above 20% of enrollment; and (e) debt term
              disclosure (Mars/HSBC interest rate, covenants, equity-linked provisions). A track recommendation replaces
              research-more if FY25 guidance is delivered but the instrument terms and financials remain opaque.
            claimRefs:
              - CV032
              - CV033
              - CV047
              - CV051
              - CV052
              - CV055
          - type: table
            tableRef: TV006
            claimRefs:
              - CV032
              - CV033
              - CV047
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Flat Round at $3.2B Is a Valuation Red Flag
            body: >
              A flat round after 38 months and near-doubling of revenue is atypical and warrants close scrutiny of
              instrument structure. Standard deal mechanics would produce a down round at $2.3-2.5B or a premium round
              approaching $4B if growth warranted it. The $3.2B outcome is theoretically consistent with TPG Rise
              leading at a maintained price to avoid a portfolio mark-down — a conflict-of-interest scenario that
              investors should explicitly interrogate by requesting the full Series F subscription agreement and any
              ratchet, PIK, or conversion provisions within it. The Inc42-reported $1.8B ratchet floor, if real and
              active, means the de facto valuation may be $1.8-2.3B rather than $3.2B.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV029
              - CV030
              - CV047
          - type: callout
            title: Enterprise L&D Tailwind Is the Strongest Bull-Case Anchor
            body: >
              The structural bull case for Eruditus is not the consumer segment — which faces intense AI-driven
              competition from lower-cost platforms — but the enterprise L&D segment, where accredited programs from
              Harvard, MIT, and IIMs command budgets that AI tools do not yet displace. Enterprise segment growth of
              40-45% YoY pre-Series F is the single most defensible data point in the investment thesis. If enterprise
              revenue approaches 40-50% of total group revenue (from an estimated 15-20% today) by IPO, the business's
              valuation support improves materially — enterprise SaaS-adjacent multiples of 3-5x forward revenue are
              more durable than consumer edtech multiples.
            calloutType: strength
            claimRefs:
              - CV039
              - CV040
              - CV038
              - CV048
