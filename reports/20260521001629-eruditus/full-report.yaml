      - number: '1.3'
        title: Funding history, valuation, and capital structure
        blocks:
          - type: paragraph
            body: >
              Eruditus raised its first major round of external capital from Bertelsmann, followed by Sequoia India (now
              Peak XV) and Prosus in earlier growth rounds. The financing history accelerated sharply during the 2021
              edtech boom. In August 2021, Eruditus closed a $650 million Series E led by Accel US and SoftBank Vision
              Fund 2, at a post-money valuation of $3.2 billion. This was a combination of $430 million primary capital
              and $220 million in secondary share sales; Bertelsmann partly exited via secondary, and CPPIB co-invested
              through both primary and secondary transactions. The Series E made Eruditus the 23rd Indian unicorn of
              2021 at four times its prior ~$800 million valuation.

              In March 2022, Eruditus closed a $350 million conventional debt facility from CPP Investments Credit
              Investments Inc., structured as a five-year bullet payment with no periodic cash interest, earmarked
              primarily for M&A in Europe and the United States. In May 2021, the company had acquired iDTech (a Silicon
              Valley-based K-12 STEM platform) for approximately $200 million before the Series E, an acquisition that
              added the K-12 segment and materially changed the company's profile.

              The most recent equity event was the October 2024 Series F: $150 million at a flat post-money valuation of
              $3.1–3.2 billion (TPG and Economic Times report $3.2B; Tracxn and Moneycontrol report $3.1B), led by TPG's
              The Rise Fund. TPG contributed $100 million; SoftBank invested an additional $20 million. All major
              existing investors (SoftBank VF2, Leeds Illuminate, Accel, CPP Investments, Chan Zuckerberg Initiative)
              participated. Eruditus reported achieving profitability on a full-year basis, having been cited as #1
              Global EdTech by Time magazine, as context for the round. The flat valuation relative to 2021 reflects
              both the broader edtech sector de-rating and Eruditus's own prolonged path to profitability.

              In early 2025, Eruditus refinanced a $130 million credit facility from Mars Growth Capital (a joint
              venture of Liquidity and MUFG Bank) and HSBC, renewing the four-year-old facility for another four years
              and securing an additional $20 million line of credit, bringing the total refinanced facility to $150
              million. The CPP Investments $350 million bullet debt remains outstanding with payment due at the end of
              the CPPIB facility term. Total equity raised across all rounds is reported at approximately $741–$814
              million depending on source.
