              Enterprise is Eruditus's fastest-disclosed-growth segment. CEO Ashwin Damera stated in October 2024 that
              enterprise accounts contribute approximately 15% of total revenue and that the enterprise business doubled
              over the prior two years, implying a compound annual growth rate of roughly 41%. This growth is being
