        - label: Bear Scenario (IPO FY2028+)
          low: 490
          high: 810
        - label: Base Scenario (IPO FY2027)
          low: 1100
          high: 1500
        - label: Bull Scenario (IPO FY2027, India premium)
          low: 2600
          high: 3500
        - label: Series F Entry Price (reference)
          low: 3200
          high: 3200
          point: 3200
    approximationNotes: >
      Bear range = 1-1.5x fwd P/S on ~$490-540M FY2026-27E revenue (sub-10% CAGR from FY24 $448M). Base range = 2-2.5x
      fwd P/S on ~$550-600M FY2026-27E revenue (12-18% CAGR). Bull range = 4-5x fwd P/S on ~$650-700M FY2026-27E revenue
      (20-25% CAGR with India premium). All figures in USD millions. Currency conversion at ₹83/$. Not investment return
      forecasts; do not reflect instrument structure, preference overhang, or IPO dilution.
