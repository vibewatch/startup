      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >-
              Eruditus's market has two primary buyer archetypes, each with distinct budget ownership, purchasing
              triggers, and program preferences. The B2C buyer is a working professional — typically a manager,
              director, or functional specialist aged 25–50 — who self-funds or pursues employer reimbursement for a
              structured certificate or executive program. The purchase trigger is career advancement: promotion
              eligibility, salary negotiation, a role transition (e.g., engineer to product manager, finance to
              strategy), or a credential required for a client-facing or leadership function. The user and payer are
              ordinarily the same person. Program price points range from roughly $2,000 for shorter professional
              certificates to $12,000+ for senior executive leadership programs, placing Eruditus's offering well above
              MOOC pricing and requiring an active sales and academic-counseling process to close the purchase.

              The B2B enterprise buyer is a Chief People Officer, VP of Learning and Development, or line-of-business
              leader commissioning workforce development at organizational scale. Enterprise deals involve institutional
              procurement processes, custom program design aligned to transformation themes (AI, digital,
              sustainability, leadership, data), and analytical reporting of completion and skill-outcome metrics. The
              Emeritus enterprise platform offers group enrollments, private cohorts, company-branded portals with 200+
              university-backed programs, and customized Academies. Enterprise learner impact data is strong: 94% of
              learners reported positive professional-development impact, 77% could immediately apply learning at work,
              and 90% saw positive organizational impact — metrics the company uses as its primary retention argument in
              B2B sales.

              Universities are supply-side partners in this model, not buyers: they co-design content, lend faculty
              expertise and institutional brand, and share economics with Eruditus, but do not purchase services.
              Governments are an emerging buyer category, particularly in emerging economies seeking national workforce
              development capabilities; the TPG Series F release specifically names government programs as a growth
              area. The geographic distribution of the buyer base — approximately 80% of enrollments outside India per a
              2021 CEO statement — establishes cross-border demand as a defining market characteristic and a key
              risk-diversifier vs. India-focused edtech peers.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM031
