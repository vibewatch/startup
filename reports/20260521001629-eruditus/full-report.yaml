        title: Product Portfolio & Delivery Mechanics
        blocks:
          - type: paragraph
            body: >-
              Eruditus sells a portfolio that is broader than a single online certificate SKU. Its public surfaces span
              short certificate courses, senior executive and C-suite journeys, bootcamps, PG diploma programs,
              enterprise education, and partner-branded certificate bundles. The strongest evidence for the delivery
              model comes from partner and enterprise pages rather than the generic marketing homepages: Columbia
              describes a decade-plus collaboration built around cohort-based learning with simulations and projects;
              the enterprise page describes small private online courses that combine synchronous live instruction with
              asynchronous self-paced work; and partner-specific pages show that flagship programs can be much longer
              than the typical short-course stereotype.


              That matters because the company's product is not just content hosting. Columbia's CEO program is marketed
              as an 8- to 10-month journey with 24 weeks of core online learning, weekly live sessions, an in-person
              component, and AI-focused sessions. Wharton and MIT xPRO information-session pages add evidence that many
              programs still rely on live office hours, discussions, projects, capstones, and faculty-led touchpoints.
              The operating model therefore looks closer to managed cohort orchestration than to a low-touch MOOC
              library. Enterprise customers can also buy into public cohorts or commission private cohorts with
              customized case studies and participant exercises, which widens the product from individual upskilling
              into workforce transformation.
