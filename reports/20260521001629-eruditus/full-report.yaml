  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Risk
      - Monitorable Trigger
      - Kill Criteria
      - Action
    rows:
      - - FY25 EBITDA miss
        - Company update, interview, or ROC subsidiary filing
        - Accrual EBITDA < ₹200 crore FY25 (>33% miss)
        - Downgrade to avoid; IPO timeline reassessment; debt refinancing risk resurfaces
      - - Revenue deceleration below 10%
        - Media coverage of interim results; management interview
        - Q-on-Q revenue growth < 10% annualized for two consecutive periods
        - Scenario shift to bear; re-run comparable multiple analysis
      - - Series F ratchet activated
        - Any press report of ratchet exercise or post-Series F instrument amendment
        - Ratchet to $1.8B confirmed
        - Confirms true clearing price is $1.8B; $3.2B is headline; invest only at $1.8B-equivalent terms
      - - Tier-1 university partner departure
        - Public announcement of contract non-renewal (MIT, Harvard, Wharton, INSEAD, Cambridge)
        - Loss of any one of the top five university brands
        - Material impairment to brand equity and enrollment; reassess entire valuation thesis
      - - IPO delayed beyond FY2028
        - Absence of SEBI DRHP filing by December 2027
        - No DRHP filed 36+ months after Series F close
        - Exit optionality constrained; debt refinancing in 2029 required; down-round risk increases
      - - Debt covenant breach or amendment
        - Lender communication, credit agency note, or company press release
        - Any waiver, forbearance, or amendment to Mars/HSBC facility
        - Credit risk escalation; potential dilutive equity cure; re-run bear scenario
      - - AI competitive displacement
        - Enterprise client defection reports; NPS decline; AI L&D platform market share data
        - AI tools capturing >20% of enterprise L&D spend from accredited programs
        - Product strategy and pricing model reassessment; potential multiple compression
    notes: >-
      Thresholds are illustrative and should be calibrated to position size and portfolio mandate. Kill criteria are
      based on publicly observable signals only; private information may warrant different thresholds.
    claimRefs:
      - CV048
      - CV049
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Diligence Item
      - Priority
      - What Is Needed
      - Why It Matters
      - Status
    rows:
      - - Audited consolidated financials FY24 and FY25
        - Blocking
        - Group-level audited P&L, balance sheet, cash flow statement under IND-AS or IFRS for FY24 and FY25
        - >-
          Only basis for independent valuation; dual EBITDA convention creates uncertainty; ROC filings are
          subsidiary-level and partial
        - Not available as of May 2026
      - - Series F instrument terms
        - Blocking
        - >-
          Full subscription agreement including: preference stack, ratchet provisions, liquidation waterfall,
          anti-dilution, drag/tag, and information rights
        - Inc42-reported $1.8B ratchet, if real, changes the economic valuation to $1.8B not $3.2B
        - Not disclosed publicly
      - - Debt terms — Mars/HSBC facility
        - Blocking
        - >-
          Interest rate, benchmark spread, maintenance covenants, financial KPI triggers, equity cure provisions,
          cross-default clauses
        - Undisclosed terms prevent assessment of downside leverage risk and EBITDA covenant headroom
        - Not disclosed publicly
      - - University partner concentration
        - Material
        - >-
          Revenue or enrollment contribution by top 10 university partners; contract durations and renewal status for
          Tier-1 partners
        - 2U precedent shows university contract attrition is a thesis-breaking risk; no public data on concentration
        - Not disclosed publicly
      - - Cap table and preference stack
        - Material
        - >-
          Full capitalization table showing share classes, ownership %, liquidation preferences, and any secondary sales
          post-Series F
        - >-
          Required to model investor-level returns under bear/base scenarios; preference overhang can eliminate common
          equity value
        - Not disclosed publicly
      - - FY25 interim revenue and EBITDA
        - Material
        - Confirmed interim H1 FY25 revenue and accrual EBITDA figures vs. ₹4,330-4,420 crore / ₹300 crore targets
        - FY25 targets are the primary catalyst for an IPO-ready narrative; any miss is thesis-adverse
        - Not yet available (FY25 ends March 2026)
      - - Enterprise segment revenue split
        - Material
        - Enterprise vs. B2C revenue split for FY23 and FY24; enterprise growth rate and churn/NRR data
        - Enterprise segment is the highest-quality revenue; 40-45% growth rate claim is unverified at the group level
        - Not disclosed at group level
      - - IPO advisers and merchant bank mandate
        - Minor
        - Name of SEBI-registered lead manager and indicative timeline for DRHP filing
        - Confirms IPO seriousness; absence of mandate 18 months post-Series F is a mild concern
        - Not disclosed publicly
    notes: >-
      Priority reflects materiality to investment decision: Blocking = cannot commit capital without it; Material =
      affects return model; Minor = confirms narrative. All items are publicly available gaps as of May 2026.
    claimRefs:
      - CV032
      - CV033
      - CV047
