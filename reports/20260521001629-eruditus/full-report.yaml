              500 companies, suggesting an unmet target well above current penetration. India and enterprise together
              are described as growing at ~40% YoY, consistent with the individual segment doubling claim.


              The enterprise product suite enables three procurement patterns. Accelerate allows L&D teams to enroll
              cohorts into open programs with group discounts and a management portal. Academies create branded
              enterprise learning destinations covering five practice areas: leadership, sustainability, data, digital,
