              - CR008
              - CR009
              - CR010
      - number: '7.2'
        title: University-Partner Concentration and Platform Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Eruditus's business model is structurally dependent on a portfolio of 80+ university partnerships where
              the top Tier-1 institutions—MIT, Harvard, Wharton, INSEAD, Cambridge, and Columbia—supply the brand equity
              that drives learner acquisition and pricing power. No public data exists on revenue or enrollment
              concentration among these partners, creating a diligence blind spot: if the top 5 university brands
              represent 50%+ of bookings, the attrition of even one Tier-1 partner would cause material impairment. The
              2U Inc. Chapter 11 bankruptcy filing in 2024 provides the most direct cautionary precedent for the online
              program management (OPM) model: 2U built a 130+ university partnership portfolio, but when enrollment
              economics deteriorated and universities sought to renegotiate or terminate revenue-share contracts, the
              model's unit economics collapsed. US universities have increasingly scrutinized OPM cost-sharing
              arrangements on reputational grounds. Eruditus argues its model is differentiated—it originates learners
              globally and provides full-stack program delivery—but the dependency on partner brand trust is
              structurally similar. The planned expansion from 80 to 150 university partnerships introduces execution
              risk from onboarding institutions with weaker brand signals into a cohort that currently benefits from
              elite-brand halo. Partner concentration data is a required diligence deliverable before any investment can
              model terminal revenue risk accurately. Cloud platform (AWS/GCP) and LMS (Canvas/Instructure) dependencies
              represent secondary operational risks with standard contractual mitigations but without disclosed SLA
              commitments.
