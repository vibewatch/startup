  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Trajectory and Growth Profile
        blocks:
          - type: paragraph
            body: >-
              Eruditus has grown from approximately ₹1,900–1,962 crore in FY22 to ₹3,733 crore ($448M) in FY24,
              executing one of the fastest revenue ramp-ups among India's large edtech cohort. FY22-to-FY23 growth was
              approximately 70–75%, driven by aggressive geographic expansion, new university partnerships, and elevated
              marketing spend. FY23-to-FY24 growth decelerated sharply to 12%—a deliberate rebalancing toward
              unit-economics discipline rather than a demand-side deterioration, with India and enterprise segments
              growing at ~40% YoY even as the overall pace slowed.


              On an absolute-revenue basis, Eruditus stands as India's largest operational edtech company in FY24,
              approximately 1.9× PhysicsWallah (₹2,015 crore) and more than 2× UpGrad (₹1,487 crore). Revenue mix is
              skewed toward North America: the US contributed ~44% of FY23 revenue, with India at 27–28% of FY24
              revenue, Latin America at ~16%, and Europe at ~11%. Management targets FY25 revenue of ₹4,330–4,420 crore
              ($520–530M), implying ~15–18% growth, with a stated aspirational target of 25–30% YoY cited in the
              November 2024 Business Standard interview. The FY25 guidance embeds a structural tailwind from recognizing
              the ₹800 crore of FY24 collected revenue that was deferred on the accrual balance sheet.


              Enterprise accounts currently represent ~15% of revenue and are growing at 40% YoY; if this sub-segment
              accelerates, it could alter the mix toward higher-quality, less-marketing-intensive income and
              meaningfully improve the path to sustained EBITDA profitability. India is on a trajectory toward becoming
              50% of the business "in the next five years" per Damera's public guidance, which has significant
              structural implications for both revenue quality and regulatory domicile.
