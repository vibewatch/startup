      - number: '5.4'
        title: University Supply Chain & Content Production Model
        blocks:
          - type: paragraph
            body: >-
              The best public evidence suggests that Eruditus sits between universities, faculty, and learners as a
              production-and-orchestration partner rather than as a simple reseller of recorded lectures. Columbia's
              partnership page emphasizes cohort-based teaching, experiential learning, simulations, projects, and
              long-form C-suite journeys; Wharton certificate pages emphasize simulations and peer interaction; and the
              enterprise page says private cohorts can customize the course leader, case studies, and participant
              exercises. Careers language also points to ongoing human operating roles in program management, service
              delivery, and university partnerships. Together, those details imply a supply chain in which faculty
              credibility and institution brand originate with the university, while Eruditus manages packaging,
              advising, scheduling, coordination, and learner support.


              What is notably absent is the contract layer. The fetched materials do not spell out revenue-share
              percentages, IP ownership, exclusivity terms, who owns newly produced case studies, or how much of the
              content-production workflow is standardized across schools. That omission matters because Eruditus's moat
              depends on whether the hard part is durable institutional workflow integration or only temporary marketing
              and delivery support. Publicly, the evidence supports co-development, faculty involvement, and
              customization. It does not yet support a strong conclusion that Eruditus owns the deepest economic or IP
              layer of the university relationship.
