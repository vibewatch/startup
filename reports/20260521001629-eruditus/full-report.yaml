      - number: '1.4'
        title: Scale, performance, and strategic outlook
        blocks:
          - type: paragraph
            body: >
              For the fiscal year ended June 30, 2024 (FY24), Eruditus reported revenue of ₹3,733 crore, a 12% increase
              from ₹3,280 crore in FY23 (which itself represented 63% growth). The deceleration in FY24 was intentional:
              the company reduced marketing spend from 29% to 27% of revenue, pruned underperforming courses, and
              shifted focus toward profitability. Operating expenses fell from 36% to 28% of revenue. The adjusted
              EBITDA loss on an accrual basis narrowed to ₹69 crore in FY24 from ₹417 crore in FY23 (an 83%
              improvement). On a booking-cash basis, the company achieved EBITDA profitability — Kalipatnapu cited ₹28
              crore booking-basis profit in FY24, while Damera cited ₹80 crore EBITDA-positive on a full-year basis to
              Business Standard, reflecting differing adjustment conventions. The Business Standard article notes ₹800
              crore in revenue recognized in the next fiscal year under standard deferred-revenue accounting. As of
              FY24, Eruditus is the largest Indian edtech company by revenue — 1.8–1.9 times PhysicsWallah and more than
              twice upGrad.

              The company's FY25 targets (financial year ending June 2025) called for approximately ₹4,500–5,000 crore
              in revenue at 15–25% growth, and approximately ₹300 crore EBITDA, driven primarily by the enterprise/India
              segments growing at 40% year-on-year. Enterprise customers represent 15% of total business and grew
              revenue 45% in the year preceding the Series F, while the company doubled its enterprise business in the
              two years to October 2024.

              Looking forward, Eruditus has stated its intention to: (1) expand university partnerships from 80 to 150;
              (2) move from executive education into post-graduate and undergraduate programs; (3) invest in proprietary
              AI tutors and generative AI-enhanced learning tools; (4) complete the Singapore-to-India domicile flip
              (target: 2025 calendar year); and (5) pursue an IPO in India, targeted for approximately 2–3 years from
              October 2024 (implying a 2026–2027 timeframe). Growth from potential acquisitions remains on the roadmap,
              with the $350M CPPIB debt originally intended for M&A partly still outstanding. Adverse signals include
              mixed user reviews on platforms such as Shiksha, and the BBB complaints listing for Emeritus Institute of
              Management, Inc. (Boston) — representing an ongoing learner-satisfaction and product-delivery risk at
              scale.
