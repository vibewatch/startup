      - number: '5.3'
        title: AI, Personalization & Enterprise Product
        blocks:
          - type: paragraph
            body: >-
              Official AI evidence exists, but it sits at different levels of maturity. The October 2024 Series F
              release is the clearest product statement: management said Eruditus had already launched proprietary
              AI-powered tutors for students and programs with partner schools, and that new capital would deepen AI
              investment to enrich learner experience while accelerating enterprise and government growth. A June 2025
              Rotman launch adds proof that AI has become an active catalog and go-to-market theme, not just a keynote
              talking point. Columbia's CEO program also shows AI content moving into flagship leadership journeys,
              while the Emeritus AI/ML category page indicates a growing portfolio of AI-related offerings.


              The gap is that official pages disclose far more about AI course topics than about AI system architecture.
              There is no public benchmark for tutor efficacy, no description of adaptive-learning logic, and no
              technical explanation of whether personalization is rules-based, generative, or workflow-specific by
              partner school. The enterprise surface is better specified than the AI surface. Emeritus says private
              cohorts can be customized around business context, that employers can manage approvals and engagement
              through a portal, and that the portal does not require integration with existing systems. Combined with
              Eruditus's own positioning around group enrollments, private cohorts, and tailored content, the enterprise
              product appears to be a curated cohort-management and services layer rather than a broad seat-based LMS
              platform with deeply documented integrations.
