            body: >
              The $130M Mars/HSBC facility closed in September 2025 rescues Eruditus from a 2025 maturity cliff, but
              with no disclosure of the interest rate, covenant package, or equity-linked provisions, investors cannot
              assess the true cost of carry, covenant headroom under stress scenarios, or whether a coverage ratio
