            body: >-
              Public proof of learner outcomes is anchored primarily in self-reported testimonials from the Emeritus
              brand website, a sampling of third-party India-focused review platforms, and one well-documented long-term
              university partner. Eruditus's own website prominently features named individual testimonials: Aisha
              Blackwell (Interim Chief People & Operations Officer at Young Community Developers) credits the CHRO
              Program with helping her advance into a new role; Anqi Zou (SVP, AI Innovation Leader at Truist Bank)
              describes immediately applicable knowledge from the CTO Program; and Simon Yu (Venture Partner at Expert
              Dojo) credits the VC/PE Program with providing competitive footing in fund management. These are named
              professionals with verifiable titles, which upgrades their evidential weight above anonymous star ratings.


              Columbia Business School's Emeritus partnership page documents over a decade of collaboration anchoring
              CEO, CHRO, CTO, and VC/PE programs—providing institutional corroboration that the named programs are live
              and tenured rather than pilot-stage. Shiksha.com, India's largest student review platform, shows 56
              learner reviews with a 5.0 average rating, though the small sample and India-only geographic skew limit
              extrapolation. The company claims 85% course completion (company-stated, no third-party audit) and
              presents aggregate enterprise satisfaction statistics—94% positive professional development impact, 77%
              immediately applicable learnings, 90% positive organizational impact—but all are derived from
              self-administered learner feedback with no disclosed methodology, response rate, or independent
              validation.
