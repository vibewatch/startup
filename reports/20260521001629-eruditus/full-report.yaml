    title: 'Recommendation Logic: Factors Driving Research-More Conclusion'
    type: flow
    layout: standard
    summary: >-
      Decision-tree summary of the four factors that lead to a research-more recommendation for Eruditus at the $3.2B
      Series F entry price.
    data:
      nodes:
        - id: market
          label: |-
            Market Context
            [POSITIVE]
          description: Global corp L&D $350B+; enterprise segment growing 40-45% YoY; India reskilling tailwind
        - id: moat
          label: |-
            Product / Moat
            [POSITIVE]
          description: 80+ elite university partnerships; Harvard, MIT, Wharton, IIMs; hard to replicate
        - id: financial
          label: |-
            Financial Trajectory
            [CAUTIOUS]
          description: Revenue $448M FY24; EBITDA improving; but growth slowing (13.8%) and no audited group financials
        - id: valuation
          label: |-
            Valuation Entry
            [ADVERSE]
          description: 7.1x EV/Revenue vs Coursera 1.4-2.4x, Udemy ~1x; 3-5x premium; flat round; ratchet signal
        - id: governance
          label: |-
            Disclosure / Governance
            [CAUTIOUS]
          description: No audited group financials; dual EBITDA convention; undisclosed debt terms and cap table
        - id: recommendation
          label: → RESEARCH MORE
          description: Price not supported by public comparable evidence; critical diligence gaps prevent capital commitment
      edges:
