  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Eruditus operates with two structurally distinct customer archetypes that differ in buyer identity,
              purchase motivation, pricing authority, and deployment scale. The B2C segment—working professionals
              globally—self-selects into cohort programs via digital marketing, partner university referrals, and
              program information sessions. Purchase decisions are typically made by the individual (or their employer
              through tuition reimbursement), with program prices ranging from short certificates to multi-month senior
              executive journeys. The demand profile skews toward mid-career executives seeking a credential, career
              pivot, or promotion-readiness signal from a recognizable university brand.


              The enterprise segment—corporate L&D departments, government agencies, and large professional services
              firms—procures through a dedicated sales team and portal. Emeritus explicitly targets CPG, Financial
              Services, Government, and Professional Services verticals and structures enterprise offerings into three
              distinct tiers: Accelerate (group enrollment in open cohorts), Academies (branded multi-program
              destinations across leadership, sustainability, data, digital, and technology), and Private Cohorts
              (exclusive internal cohorts with optional content customization). India represents 27–28% of total
              revenue, a geographic concentration the company identifies as a growth priority. Across segments, the
              company states 80+ country reach and cites 1M+ cumulative learners, though that figure blends B2C and B2B,
              historical and current, and individual certificates and degree programs.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
