  - id: regulatory-privacy-compliance-risk
    title: "Regulatory, Privacy, and Compliance Risk"
    body: >
      Eruditus operates a multi-jurisdictional education services business that processes
      personal data of learners in 80+ countries, creating layered privacy and regulatory
      compliance obligations. India's Digital Personal Data Protection (DPDP) Act, enacted
      in August 2023, represents the most material near-term regulatory shift: the Act
      establishes consent requirements, data principal rights (access, correction, erasure,
      grievance), obligations for significant data fiduciaries (SDFs), and cross-border data
      transfer restrictions. As of the run date, the DPDP implementation rules (secondary
      legislation) have not been finalized, leaving scope uncertainty for compliance investment.
      Once rules are notified, companies like Eruditus that process large volumes of Indian
      citizen data at scale will almost certainly qualify as SDFs, triggering enhanced audit,
      impact assessment, and localization obligations. In the EU, GDPR governs European learner
      data with significant fines for violations. In the US, FERPA applies through university
      partner relationships where student educational records may be involved. Singapore's PDPA
      remains relevant during the domicile transition from Singapore to India. UGC online
      education regulations govern Indian institutional partners and affect how Eruditus can
      structure certificate programs with Indian universities. No enforcement action or regulatory
      investigation against Eruditus has been identified in public records as of the run date.
      The company maintains a formal privacy policy framework, a data protection officer, and a
      vulnerability disclosure program—but without a public bug bounty program, third-party
      security coverage is limited. The domicile flip to India introduces a governance
      transition period where Indian securities regulations, FDI norms, and ROC requirements
      will layer onto existing Singapore obligations before the transition completes.
    claimRefs:
