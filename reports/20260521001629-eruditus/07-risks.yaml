callouts:
  - calloutType: risk
    title: "Debt Opacity Is the Highest-Priority Diligence Gap"
    body: >
      The $130M Mars/HSBC facility closed in September 2025 rescues Eruditus from a 2025
      maturity cliff, but with no disclosure of the interest rate, covenant package, or
      equity-linked provisions, investors cannot assess the true cost of carry, covenant
      headroom under stress scenarios, or whether a coverage ratio breach would trigger
      acceleration. This is the single most actionable diligence request: obtaining the
      full credit agreement or a lender-confirmed term sheet excerpt before any investment
      decision is made.
    claimRefs:
      - CR004
      - CR009
      - CR049

  - calloutType: risk
    title: "University Partner Concentration Is Undisclosed and Material"
    body: >
      Eruditus's brand equity is proxied by its Tier-1 university roster, yet no revenue or
      enrollment concentration data is public. If MIT, Harvard, Wharton, and INSEAD represent
      more than 40% of bookings—which is plausible given their premium pricing and brand pull—
      the loss of any single partnership would trigger a cascading decline in acquisition
      efficiency, program pricing, and investor confidence. The 2U bankruptcy demonstrates
      that university-model edtech is not partner-concentration immune. Investors should require
      concentration disclosure as a condition of term sheet issuance.
    claimRefs:
      - CR011
      - CR013
      - CR014
      - CR018
      - CR048

  - calloutType: risk
    title: "DPDP Implementation Rules Pending: Compliance Cost Uncertainty Remains"
    body: >
      India's DPDP Act 2023 is enacted but the secondary rules defining SDF thresholds,
      localization requirements, and the Data Protection Board's enforcement mechanism have
      not been notified as of May 2026. Eruditus's designation as a Significant Data Fiduciary
      is nearly certain given its scale of Indian learner data processing. Once rules are
      finalized, compliance infrastructure investment (impact assessments, localization, consent
      management platform upgrades) could run to millions of dollars and require 12-24 months
      to implement fully. This is a real but timing-uncertain cost risk, not a thesis-breaking
      risk, assuming the company is already building toward compliance.
    claimRefs:
      - CR019
      - CR021
      - CR023
      - CR026

