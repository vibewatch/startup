  - id: sector-slowdown-ipo-execution-risk
    title: "Sector Slowdown, AI Disruption, and IPO Execution Risk"
    body: >
      The edtech sector experienced a sustained funding contraction from 2022 through 2025 driven
      by rising interest rates, investor disillusionment post-COVID enrollment normalization, and
      high-profile distress events (Byju's insolvency, Unacademy workforce reductions, 2U
      bankruptcy). Eruditus has outperformed peers operationally—maintaining revenue growth and
      narrowing losses—but is not immune to the sector-level valuation discount. The CEO
      explicitly acknowledged that investors harbor concerns about the India edtech sector broadly
      and draw unfavorable comparisons to US edtech peers. This investor sentiment creates a
      ceiling on IPO valuation multiples. The Economist's May 2024 analysis of online executive
      education noted a "reckoning" for the model as universities reassess OPM cost structures
      and learners increasingly seek lower-cost alternatives. AI disruption represents a
      medium-term structural threat: Goldman Sachs has estimated GenAI could displace 300M
      full-time equivalent jobs, paradoxically creating demand for reskilling—but AI-native
      learning tools (OpenAI, Google, Duolingo) may serve a growing share of that demand at
      $0-$50 per month versus Eruditus's $1,000-$10,000+ programs. Competitive consolidation
      is accelerating, with Coursera reportedly exploring acquisitions that would concentrate
      the corporate learning market. IPO execution risk is significant: Eruditus targets a
      listing "two years from now" (circa FY2026-27 from the October 2024 interview), requiring
      the FY25 revenue and EBITDA milestones to be achieved, the domicile flip to India to
      complete, and capital markets conditions to be favorable. Any one of these can slip.
