  - id: risk-register-mitigations-thesis-break
    title: "Risk Register, Mitigations, and Thesis-Break Criteria"
    body: >
      The consolidated risk picture for Eruditus is best characterized as manageable-but-opaque:
      the core revenue model is proven, the debt has been refinanced at arm's length from credible
      institutions, and near-term liquidity is not in crisis. However, the combination of
      undisclosed debt terms, concentrated partner dependencies, an unproven IPO execution path
      in a challenging market, and multi-jurisdictional regulatory transition creates a residual
      risk profile that justifies a medium-to-high risk rating. Key monitoring indicators for
      investors are: (a) FY25 EBITDA achievement vs. ₹300 crore target—critical for IPO valuation
      narrative; (b) public disclosure of any university contract renewals, terminations, or
      renegotiations; (c) any regulatory investigation or enforcement notice under DPDP, GDPR,
      or UGC regulations; (d) revenue growth reacceleration from 12% toward the 25-30% target
      trajectory. Thesis-break triggers include: loss of two or more Tier-1 university partners
      within 24 months, FY25 EBITDA miss of greater than 30%, or any material debt covenant
      breach. Diligence asks include: university revenue concentration data (top-5 and top-10
      shares), full debt terms including covenants and pricing, FY25 month-by-month revenue
      trajectory, and DPDP compliance roadmap. People risk is underappreciated: no succession
      plan for co-founders Ashwin Damera or Chaitanya Kalipatnapu has been publicly discussed.
    claimRefs:
