  - id: customer-reputation-operational-risk
    title: "Customer Experience, Reputation, and Operational Quality Risk"
    body: >
      Consumer review and complaint platforms consistently surface a cluster of adverse signals
      about Emeritus programs: difficulty obtaining refunds after enrollment, unresponsive
      customer support, mismatch between program marketing claims and delivered quality, and
      concerns about hidden fees or billing practices. The Better Business Bureau's complaint
      log for Emeritus Institute of Management, Reddit discussions in r/india, SiteJabber
      reviews, Mouthshut reviews, and Shiksha listings all share these themes. These signals
      create three distinct risk vectors: (a) direct churn and negative word-of-mouth reducing
      B2C acquisition efficiency; (b) enterprise client hesitation if employee learner experience
      is poor enough to generate internal escalation; and (c) university partner brand damage
      if the complaints are associated with co-branded programs from institutions like MIT or
      Wharton. Operationally, platform reliability (Canvas LMS, mobile apps), content localization
      quality, and cohort management at scale are execution risks that are difficult to assess
      from public data. Revenue recognition complexity—where booking-basis EBITDA was positive
      (₹28-80 crore range) while accrual-basis EBITDA remained negative (−₹69 crore) in FY24—
      adds a financial quality risk: if the booking-to-accrual conversion assumption proves
      optimistic due to learner dropout or refunds, reported EBITDA will be restated downward.
      No cybersecurity breach or data incident has been reported publicly. The company operates
      a responsible disclosure framework but no bug bounty program, limiting independent security
      research. Overall, operational and reputational risk is real but currently below
      thesis-breaking severity given Eruditus's revenue scale and enterprise client diversification.
    claimRefs:
