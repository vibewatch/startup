chapter:
  number: 7
  title: Risks
  summary: >
    Eruditus faces a layered risk profile anchored by three priority vectors: (1) a $150M debt
    facility maturing in 2029 whose covenant terms are undisclosed, combined with a flat $3.2B
    valuation and decelerating revenue growth (12% YoY in FY24) that constrains IPO optionality;
    (2) structural dependence on 80+ university brand relationships, where loss of any Tier-1
    partner (MIT, Harvard, Wharton, INSEAD) would meaningfully impair enrollment and brand equity;
    and (3) a multi-jurisdictional regulatory exposure—led by India's DPDP Act 2023 whose
    enforcement rules remain pending—operating across 80+ countries. Consumer complaint patterns
    on BBB, Reddit, SiteJabber, and Trustpilot reveal persistent refund and service-quality
    friction that creates reputational overhang. Sector-level risks from the edtech funding winter,
    2U's 2024 bankruptcy, and AI disruption of cohort learning are real but Eruditus has
    demonstrably outperformed peers. IPO execution and debt retirement remain the dominant
    investment-case risks requiring active monitoring through FY25 milestone attainment.

sections:
  - id: debt-capital-structure-risk
    title: "Debt, Capital Structure, and Refinancing Risk"
    body: >
      Eruditus carries meaningful leverage relative to its disclosed earnings profile. The company
      has historically relied heavily on debt to fund growth: a $350M CPPIB facility raised in
      March 2022 supported aggressive content and geographic expansion, and has since been
      largely refinanced into a $130M-initial/$20M-option facility led by Mars Growth Capital
      (Liquidity-MUFG joint venture, up to $100M) and HSBC (up to $50M), closed in September
      2025 with a four-year term running to approximately 2029. The refinancing preserved
      financial flexibility but no public disclosure of interest rate, LIBOR/SOFR spread,
      amortization schedule, financial maintenance covenants, or equity-linked provisions has
      been made. This opacity is a material diligence gap. The company also raised $150M in
      Series F equity at a flat $3.2B post-money valuation in October 2024—unchanged from the
      August 2021 peak—signaling that growth expectations have moderated sharply among equity
      investors while the sector weathered Byju's collapse and Unacademy's retrenchment.
      Revenue growth of 12% in FY24 (₹3,733 crore vs. ₹3,280 crore in FY23) undercuts the
      30-35% compound annual growth management cited to investors in 2024, creating downside
      risk to the FY25 target of ₹5,000 crore revenue and ₹300 crore EBITDA that underpins
      the IPO thesis. If the FY25 targets are missed, debt retirement from IPO proceeds becomes
      delayed and the refinancing cycle must repeat at whatever interest-rate environment prevails
      in 2029. CEO Ashwin Damera noted in October 2024 that the company "doesn't need to repay
      debt now" with debt "at the end of next year," suggesting the original CPPIB facility
      maturity was 2025—confirming that the 2025 Mars/HSBC refinancing was necessary and
      therefore not merely opportunistic.
