  title: Valuation
  summary: >-
    Valuation concludes that Axiom merits continued research and access to primary diligence, but the public file does
    not yet support an aggressive price-insensitive buy. Recommendation is research-more/track pending commercial proof
    and price discipline.
sections:
  - id: evidence-baseline
    title: Evidence baseline
    body: >-
      Evidence baseline for Valuation focuses on investment recommendation, valuation stance, scenarios, and final
      diligence asks. The reviewed public record is useful but uneven: official Axiom pages, investor theses, technical
      repositories, market reports, regulatory materials, and adverse security or valuation commentary all point in the
      same general direction, yet they do not close the private operating metrics that a lead investor would normally
      require. The most important interpretation is that Axiom's promise is not generic AI automation; it is a
      proof-first attempt to make machine reasoning auditable through formal artifacts. That can matter for code,
      science, engineering, and regulated workflows where correctness is expensive to establish. It also means adoption
      may be slower than ordinary AI tooling because buyers must trust the specification, the theorem-proving workflow,
      the integration path, and the support model. For this chapter, the strongest evidence supports Axiom merits
      continued research and access to primary diligence, but the public file does not yet support an aggressive
      price-insensitive buy. The resulting diligence posture is practical: Recommendation is research-more/track pending
      commercial proof and price discipline. Unsupported items are preserved as gaps rather than converted into invented
      numbers, and sources with adverse posture are used to keep the thesis falsifiable.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
    tableRefs:
      - TV001
      - TV005
    figureRefs:
      - FV001
