sections:
  - id: evidence-baseline
    title: Evidence baseline
    body: >-
      Evidence baseline for Market Analysis focuses on market boundary, adoption drivers, and demand constraints. The
      reviewed public record is useful but uneven: official Axiom pages, investor theses, technical repositories, market
      reports, regulatory materials, and adverse security or valuation commentary all point in the same general
      direction, yet they do not close the private operating metrics that a lead investor would normally require. The
      most important interpretation is that Axiom's promise is not generic AI automation; it is a proof-first attempt to
      make machine reasoning auditable through formal artifacts. That can matter for code, science, engineering, and
      regulated workflows where correctness is expensive to establish. It also means adoption may be slower than
      ordinary AI tooling because buyers must trust the specification, the theorem-proving workflow, the integration
      path, and the support model. For this chapter, the strongest evidence supports The addressable problem spans AI
      code assurance, formal verification, and frontier mathematical reasoning, but spend capture is still emergent. The
      resulting diligence posture is practical: Treat TAM as a constrained adjacency stack rather than a single broad
      AI-software number. Unsupported items are preserved as gaps rather than converted into invented numbers, and
      sources with adverse posture are used to keep the thesis falsifiable.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
    tableRefs:
