chapter:
  number: 3
  title: Competitors
  summary: >-
    Competitors concludes that Axiom competes with open theorem-proving ecosystems, frontier labs, formal-methods
    vendors, and the status quo of tests plus review. Underwrite differentiation only where proof automation, Lean
    fluency, and domain credibility translate into workflow control.
sections:
  - id: evidence-baseline
    title: Evidence baseline
    body: >-
      Evidence baseline for Competitors focuses on competitor set, substitutes, and durability of differentiation. The
      reviewed public record is useful but uneven: official Axiom pages, investor theses, technical repositories, market
      reports, regulatory materials, and adverse security or valuation commentary all point in the same general
      direction, yet they do not close the private operating metrics that a lead investor would normally require. The
      most important interpretation is that Axiom's promise is not generic AI automation; it is a proof-first attempt to
      make machine reasoning auditable through formal artifacts. That can matter for code, science, engineering, and
      regulated workflows where correctness is expensive to establish. It also means adoption may be slower than
      ordinary AI tooling because buyers must trust the specification, the theorem-proving workflow, the integration
      path, and the support model. For this chapter, the strongest evidence supports Axiom competes with open
      theorem-proving ecosystems, frontier labs, formal-methods vendors, and the status quo of tests plus review. The
      resulting diligence posture is practical: Underwrite differentiation only where proof automation, Lean fluency,
      and domain credibility translate into workflow control. Unsupported items are preserved as gaps rather than
      converted into invented numbers, and sources with adverse posture are used to keep the thesis falsifiable.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
    tableRefs:
      - TP001
    figureRefs:
      - FP001
