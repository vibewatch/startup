  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Evidence baseline
        blocks:
          - type: paragraph
            body: >-
              Evidence baseline for Company Overview focuses on identity, team, financing, and milestone record. The
              reviewed public record is useful but uneven: official Axiom pages, investor theses, technical
              repositories, market reports, regulatory materials, and adverse security or valuation commentary all point
              in the same general direction, yet they do not close the private operating metrics that a lead investor
              would normally require. The most important interpretation is that Axiom's promise is not generic AI
              automation; it is a proof-first attempt to make machine reasoning auditable through formal artifacts. That
              can matter for code, science, engineering, and regulated workflows where correctness is expensive to
              establish. It also means adoption may be slower than ordinary AI tooling because buyers must trust the
              specification, the theorem-proving workflow, the integration path, and the support model. For this
              chapter, the strongest evidence supports Axiom is a young verified-AI lab with unusually strong
              mathematical credibility and unusually thin commercial disclosure. The resulting diligence posture is
              practical: Use the overview as the canonical ground truth for website, team, funding, and gaps.
              Unsupported items are preserved as gaps rather than converted into invented numbers, and sources with
              adverse posture are used to keep the thesis falsifiable.
