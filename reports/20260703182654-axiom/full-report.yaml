companyProfile:
  summary: >-
    Axiom is a private verified-AI company focused on applying formal mathematical proof workflows to AI reasoning, code
    assurance, and advanced mathematics. The public file shows strong technical and investor credibility, including
    Axiom's own AXLE surface, Lean/theorem-proving evidence, and reported 2025-2026 financing, but it does not yet
    disclose conventional commercial operating metrics.
  foundedDate: null
  founders:
    - name: Carina Hong
      role: Founder / CEO
      background: >-
        Public interviews and funding coverage identify Hong as the company leader associated with Axiom's proof-first
        AI narrative.
      claimRefs:
        - CO002
  foundingLocation: null
  headquarters: null
  productSummary: >-
    AXLE and related verified-reasoning systems for theorem work, formal proof checking, and eventually proof-backed
    AI-generated code.
  customerFocus: >-
    Regulated software, AI infrastructure, mathematical research, scientific computing, and teams that need auditable
    correctness.
  businessModel: >-
    Not publicly disclosed; likely enterprise software, research partnerships, or usage-based verified-AI tooling once
    commercialized.
  stage: Series A / frontier AI lab
  fundingStatus: Reported $64M seed in 2025 followed by a reported $200M Series A in 2026 at a valuation above $1.6B.
