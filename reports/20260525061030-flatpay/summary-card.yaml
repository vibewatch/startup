summary:
  headline: >-
    Flatpay has rare SMB-merchant growth and a compelling simplicity pitch, but the public record still does not prove
    durable unit economics or enough disclosure to underwrite a €1.5B entry with high confidence.
  overallScore: 6.8
  recommendation: track
