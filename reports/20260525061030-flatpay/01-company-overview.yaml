  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: capital-stack
      missingEvidence: >-
        A management-reconciled financing schedule showing each round date, legal instrument, currency, lead investor,
        and whether the 2024 annual report’s “Series C in Q4 2024” refers to the same financing later described publicly
        as the November 2025 Series C.
      whyItMatters: >-
        Later underwriting will need a clean capital-history bridge to model dilution, liquidation preferences, and the
        real amount of invested versus announced capital.
      diligencePath: >-
        Request the cap-table history, board approvals, and signed financing documents for every round from Series A through
        the unicorn financing.
      relatedQuestionRefs:
        - QO010
        - QO024
      relatedTableRefs:
        - TO003
        - TO004
    - type: missing-source
      severity: material
      topic: regulatory-stack
      missingEvidence: >-
        Direct evidence of Flatpay’s own current licensing or sponsorship structure, including which regulated entities hold
        acquiring or payment permissions in each operating market and whether Flatpay itself has any direct authorization.
      whyItMatters: >-
        The public record shows an early licensed partner relationship, but not a full current regulatory map. That affects
        operational risk, compliance reliance, and expansion readiness across Europe.
      diligencePath: >-
        Request a current market-by-market regulatory matrix, sponsor-bank and acquirer agreements, and any payment-institution
        or e-money permissions relied on by Flatpay or its affiliates.
      relatedQuestionRefs:
        - QO020
      relatedTableRefs:
        - TO003
        - TO004
    - type: private-evidence-only
      severity: material
      topic: ownership-rights
      missingEvidence: >-
        A current beneficial-ownership table, board committee map, investor consent rights, and liquidation-preference stack.
      whyItMatters: >-
        Public sources show directors and signatory participants but do not reveal who controls outcomes, what investor rights
        attach to the latest round, or how much founder control remains.
      diligencePath: >-
        Request the latest shareholder agreement, board charter package, option-pool summary, and beneficial-owner register
        extract from counsel.
      relatedQuestionRefs:
        - QO024
      relatedTableRefs:
        - TO002
        - TO003
