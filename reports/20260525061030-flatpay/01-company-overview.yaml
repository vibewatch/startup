callouts:
  - calloutType: strength
    title: Simplicity is the strategic wedge, not just a pricing gimmick
    body: >-
      Flatpay’s strongest early-company evidence is the way pricing, support, installation, and field sales all reinforce a
      single merchant promise of lower friction and clearer economics.
    claimRefs:
      - CO011
      - CO012
      - CO022
  - calloutType: risk
    title: Capital-stack precision still lags the headline growth story
    body: >-
      The public story clearly supports a unicorn round and strong investor backing, but total capital raised and exact round
      sequencing still require management-level reconciliation because the audited 2024 report and later press coverage do not
      label the same chronology identically.
    claimRefs:
      - CO019
      - CO020
      - CO040
  - calloutType: risk
    title: Human-intensive onboarding is a strength and an operating dependency
    body: >-
      Flatpay’s in-person sales and support model appears to accelerate adoption, but it also means continued growth depends on
      large-scale hiring, service consistency, and merchant economics remaining attractive as the company matures.
    claimRefs:
      - CO022
      - CO031
      - CO037
      - CO039
