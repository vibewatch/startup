  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue support breaks
        - Audited 2025 revenue materially below ~€175M or 2026 run rate below ~€220M
        - The current premium multiple loses support and the base case collapses.
        - Re-rate to bear case and avoid paying above the last round.
      - - Loss conversion stalls
        - Customer growth fails to produce meaningfully better gross-profit conversion and narrower losses
        - High-touch model looks structurally capital intensive rather than scalable.
        - Cut value range toward public-peer band and require proof before any investment.
      - - Punitive next financing
        - Next round prices below the last raise or introduces punitive preferences
        - Confirms weak price support and raises return-subordination risk.
        - Treat as a major negative price-discovery event.
      - - Cohort economics disappoint
        - Retention, CAC payback, or fraud losses by market are materially worse than implied
        - Merchant growth becomes less valuable than headline customer count suggests.
        - Shift from Track to Avoid until economics stabilize.
      - - Expansion quality weakens
        - New-country rollout adds volume but not profitable contribution
        - Geographic expansion stops being a value creator and starts amplifying burn.
        - Pause underwriting of any premium multiple.
    notes: >-
      These triggers are deliberately measurable so they can be used as underwriting gates rather than narrative
      warnings.
    claimRefs:
      - CV072
      - CV073
      - CV074
      - CV070
      - CV017
      - CV071
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited 2025 and YTD 2026 financials
        - Consolidated revenue, gross profit, operating loss, and cash flow by month / quarter are not public.
        - This is the fastest way to test whether the latest round is actually being grown into.
        - Request audited FY2025 accounts plus 2026 monthly trading pack from CFO under NDA.
      - - Cap table and preference waterfall
        - No public liquidation preferences, anti-dilution terms, or fully diluted ownership schedule.
        - Return outcomes can be very different from enterprise-value outcomes.
        - Request full cap table, shareholder agreement summary, and waterfall model.
      - - Cohort economics by market
        - No public retention, churn, CAC payback, or contribution margin by country.
        - The high-touch sales model only deserves a premium if unit economics scale.
        - Request cohort analysis for Denmark, Germany, Italy, France, UK, and any 2026 launch market.
      - - Payment risk metrics
        - No public chargeback, fraud-loss, reserve, or take-rate disclosure.
        - These metrics determine the durability of gross profit, not just revenue.
        - Obtain risk dashboards and underwriting-policy summaries from COO / risk lead.
      - - Governance and board rights
        - Registry data shows board complexity but not investor protections or governance commitments.
        - A late-stage investor needs clarity on control, consent rights, and reporting cadence.
        - Request board composition, reserved matters, and information-rights schedule.
      - - Exit-readiness roadmap
        - No public IPO-readiness plan, banker mandate, or strategic-exit process indicators.
        - Exit path assumptions drive whether the current round can compound attractively.
        - Request board materials or banker prep documents that outline the 24-month exit plan.
    notes: >-
      The first three asks are blocking for new-money underwriting; the remaining asks determine whether the
      premium-growth narrative is durable.
    claimRefs:
      - CV067
      - CV069
      - CV070
      - CV071
      - CV068
