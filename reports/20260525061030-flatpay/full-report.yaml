  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Revenue-Quality Signals
        blocks:
          - type: paragraph
            body: >-
              Flatpay's public revenue model is SMB card-present acquiring wrapped in bundled hardware, software, and
              support. Official pages show three sellable surfaces—terminal, POS, and online payments—with headline list
              pricing at 0.99% per transaction below €200k on the terminal plan and 1.49% below €200k on the POS plan;
              larger merchants move to custom pricing. Legal terms materially qualify the simplicity pitch: the
              acquirer, not Flatpay, charges the transaction fee and makes merchant payouts, some plugins and add-ons
              can bill separately, and low-usage penalties and surcharge rules can still affect merchant economics. That
              means public list prices are useful for demand and positioning, but not enough to infer Flatpay's net take
              rate, gross-to-net revenue recognition, or stream-level revenue mix. From a revenue-quality perspective,
              the strongest positive signal is that merchant funds do not sit on Flatpay's balance sheet as a float
              business, while the largest unknown is how much of the merchant headline rate Flatpay actually keeps after
              partner-acquirer economics.
