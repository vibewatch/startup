            body: >-
              Flatpay's own site presents the company as a three-part merchant stack: payment terminal, point of sale,
              and online payments. The product promise is not just cheaper acquiring; it is a full merchant workflow
              that begins with an in-person meeting, moves through solution selection, and ends with on-site
              installation of hardware and software. Pricing is positioned as flat-rate and easy to understand, with
              separate terminal, POS, and online-payment economics. Within that umbrella, the public module map is
              fairly clear. The terminal product focuses on fast card acceptance and automated reporting; the POS
              product adds inventory, product management, restaurant features, and richer operations controls; the
              customer portal acts as the reporting and configuration back office; accounting integrations sync payouts
              and turnover data; and the e-commerce layer uses partner/provider connections such as Shopify via Frisbii.
              Independent reviews and merchant comments broadly corroborate the same shape: setup is high-touch,
              hardware arrives preconfigured, and the strongest customer value proposition is simplicity for small
