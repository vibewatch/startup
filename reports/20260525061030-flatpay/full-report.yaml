        - Raise churn assumptions and test whether gross merchant counts overstate true attachment
      - - Loss persistence after 2026 growth targets
        - ARR versus plan, burn, and operating leverage indicators
        - 2026 ARR or productivity targets miss materially while statutory losses stay elevated
        - Assume follow-on funding risk and lower confidence in the current scaling playbook
      - - Capital product stress
        - Approval conversion, repayment delinquency, complaints, and partner loss-sharing terms
        - Material delinquency/complaint issues emerge or partner economics worsen
        - Treat Capital as a brand and balance-sheet-adjacent risk, not a harmless add-on
      - - Compliance or resilience event
        - Security incidents, regulator outreach, PCI exceptions, or partner compliance notices
        - First material incident, enforcement contact, or repeated control failure becomes visible
        - Pause upside assumptions until root-cause evidence and remediation quality are verified
