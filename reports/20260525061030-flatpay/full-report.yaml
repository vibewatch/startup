      - number: '8.2'
        title: Financing context, price support, and comparable set
        blocks:
          - type: paragraph
            body: >-
              Flatpay’s financing context is directionally supportive but still incomplete. The latest round is well
              corroborated: €145 million of fresh capital at a €1.5 billion valuation with AVP and Smash Capital
              leading, plus Dawn Capital continuing to participate. Beyond that headline, however, the record becomes
              messy. Tracxn and CB Insights disagree materially on lifetime capital raised, and public sources do not
              disclose the fully diluted cap table, preference stack, or anti-dilution terms that actually govern
              downside returns. The annual report also shows meaningful external-capital dependency through year-end
              contributed capital in arrears, reinforcing that this is still a capital-consuming growth story rather
              than a self-funding processor.


              For public price support, the key comparison is not a generic fintech basket but merchant-acquiring and
              payments processors. Adyen is the premium marker at roughly 11.3x revenue, while Toast, Shift4, Nexi,
              PayPal, and Global Payments cluster around roughly 0.7x to 2.4x revenue. That leaves Flatpay’s current 12x
              2025 revenue mark explainable only by premium growth expectations. Private and M&A references are more
              balanced: SumUp’s 2022 €8 billion round and renewed 2026 IPO talk reflect what scaled SMB-payments leaders
              can command when installed base and operating maturity are stronger, while Worldpay’s $24.25 billion sale
              at 8.5x adjusted EBITDA shows strategic buyers still pay for scale, software breadth, and synergies in
              merchant acquiring. On today’s public evidence, Flatpay’s latest round is defensible only if 2026
              execution proves closer to the premium end of the range than to the broader public band.
            claimRefs:
              - CV003
