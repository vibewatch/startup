        - Gross margin by card mix, surcharge usage, non-EU volume, partner fee take rates
        - Margin misses persist while high-cost card mix rises or surcharge economics worsen
        - Re-underwrite unit economics and reduce valuation support from headline merchant growth
      - - Complaint-led churn from contract friction
        - Refund, cancellation, payout-delay, and early-termination complaint trends
