      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Flatpay does have meaningful mitigants. It has real scale, strong recent fundraising, a merchant-friendly
              product story, explicit governance language around AML and privacy, and publicly documented support
              processes. The company also limits Capital to Denmark and Finland and uses a specialist partner for
              merchant funding rather than pretending the exposure does not exist. But most of those mitigants are still
              policy statements, partner structures, or growth signals; they are not yet substitutes for hard operating
              proof. The key diligence task is therefore not to debate whether demand exists, but to test whether the
              business can defend unit economics and customer trust when acquirer relationships, complaint handling, or
              compliance burdens become more complex. The thesis should break quickly if named partner concentration
              proves higher than expected, if complaints or churn rise around settlement/lock-in issues, if loss
              persistence continues after 2026 growth targets miss, or if Capital produces adverse collections or
              reputational outcomes. Investors should ask for named counterparties, chargeback and payout metrics,
              security evidence, and a clean bridge between group-level marketing claims and legal-entity reporting
              before underwriting downside resilience.
