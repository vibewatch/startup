      - Multiple / valuation
      - Relevance
      - Limitation
    rows:
      - - Adyen
        - 2025 revenue / May 2026 market cap
        - ~11.3x revenue
        - Best premium European public comparable for payments scale and quality.
        - Listed, profitable, and much more enterprise-heavy than Flatpay.
      - - Toast
        - 2025 revenue / May 2026 market cap
        - ~2.2x revenue
        - Useful for SMB commerce software + payments exposure.
        - Restaurant-heavy model and US mix differ materially.
      - - Shift4 Payments
        - 2025 revenue / May 2026 market cap
        - ~1.0x revenue
        - Merchant-acquiring and software blend with physical payments exposure.
        - Scale and geography differ; margin profile is still better disclosed than Flatpay’s.
      - - Nexi
        - 2024 revenue / May 2026 market cap
        - ~0.7x revenue
        - European payments processor with public-market discipline.
        - Much larger incumbent, lower growth, and more mature asset mix.
      - - PayPal
        - 2025 revenue / May 2026 market cap
        - ~1.2x revenue
        - Large diversified payments benchmark for market-clearing sentiment.
        - Consumer and wallet mix make it only directionally comparable.
      - - Global Payments
        - 2025 revenue / May 2026 market cap
        - ~2.4x revenue
        - Scaled merchant-acquiring benchmark with strategic optionality.
        - Mature incumbent; revenue mix and leverage differ.
      - - SumUp
        - 2022 private round / 2025-2026 IPO talk
