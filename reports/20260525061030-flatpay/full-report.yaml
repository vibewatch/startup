  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Flatpay's strongest public evidence still describes a business in aggressive expansion mode rather than a
              mature, de-risked payments platform. Independent reporting says the company reached unicorn status in late
              2025, was still unprofitable, and was targeting another step-change in ARR during 2026, while its own
              website continued marketing a simple flat-rate proposition with daily payouts and 24/7 support. That
              combination is powerful commercially, but it creates a narrow margin for execution error. The business is
              promising merchants clarity while relying on acquirers, gateways, and partner processes that are only
              partly disclosed. It is also expanding operating scope beyond terminals into online payments, reporting
              workflows, and embedded finance. In that context, the highest-severity risks are not abstract macro
              worries: they are acquirer dependence, margin compression under a flat-rate model, contract and complaint
              friction if service quality slips, and the possibility that loss-making growth outpaces operational
              controls. The heatmap therefore ranks partner concentration, pricing/model pressure, and execution across
              multiple products ahead of pure demand weakness.
            claimRefs:
              - CR003
              - CR004
