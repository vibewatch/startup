      - number: '2.3'
        title: Buyer, user, payer, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              Flatpay’s published pricing and onboarding process suggest two commercial motions. The first is the simple
              terminal sale: an owner-managed merchant, often also the day-to-day user, wants predictable pricing, no
              monthly subscription, fast payouts, and a fast setup path. In that case the buyer, user, and payer are
              usually concentrated in the same person or site manager. The second is the fuller POS bundle, where the
              merchant needs inventory, reporting, or more structured workflow control and therefore pays onboarding or
              installation fees. That package implies more stakeholders because the user may be front-of-house staff
              while the budget owner is the proprietor, operations lead, or finance approver. The common path still
              starts with a face-to-face meeting and ends with on-site installation, which is more expensive than a
              self-serve funnel but is plausibly valuable in a market where smaller merchants distrust opaque fee stacks
              and do not have internal IT support. Flatpay’s own traction numbers suggest that this high-touch wedge is
              resonating even before the company broadens further upmarket.
