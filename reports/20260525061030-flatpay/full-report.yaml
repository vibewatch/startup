      - number: '6.3'
        title: Named Customer Proof and Freshness
        blocks:
          - type: paragraph
            body: >-
              Flatpay has unusually rich named customer proof for a still-young SMB payments platform, but the proof set
              is concentrated in company-authored merchant stories rather than neutral procurement records or large
              enterprise press releases. The current merchant stories page and FeaturedCustomers together show at least
              eight named references in public circulation by the run date: Burger Palace, Sokkelund Café & Brasserie,
              Sif Jakobs Jewellery, Avenique, SMURT, Stilk Copenhagen, Mucini, and Trattoria La Bruschetta. All eight
              look like real operating businesses when checked against their own websites, and each maps cleanly to a
              specific vertical or use case.


              The most decision-useful references are the ones with concrete operating outcomes. Sokkelund said
              Flatpay's tipping flow lifted tips by about 30 percent. Avenique said portable terminals in every
              treatment room improved client flow and simplified employee training. Mucini said more than half of its
              customers prefer non-cash payments and highlighted fast taps plus 24/7 support. La Bruschetta linked
              Flatpay not just to faster lunch-time checkout but also to dashboard-driven table management, while Burger
              Palace described lower monthly payment-processing cost and a simpler back-office burden.


              Freshness is good at the URL level because all of these stories were still live in May 2026, but weaker at
              the publication-date level because most case studies are undated. The proof set is also skewed toward
              owner-operated SMB merchants, beauty clinics, florists, jewellery, and restaurants. That is directionally
              consistent with Flatpay's positioning, yet it leaves an important diligence gap: investors can verify that
              real merchants use the product in production, but public evidence is thinner on larger multi-site retail,
              complex omnichannel chains, and contractual durability beyond testimonial snapshots.
