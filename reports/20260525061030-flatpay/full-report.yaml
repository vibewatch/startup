      - number: '1.3'
        title: Funding history, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Flatpay’s financing history clearly supports a rapid late-stage rerating, but not a perfectly tidy public
              capital stack. The early anchor is the April 2024 Series B, which TechCrunch reported at €45 million led
              by Dawn Capital with Seed Capital participating. After that, the picture accelerates sharply: public
              coverage around the November 2025 unicorn round consistently points to roughly €145 million of new capital
              led by AVP and Smash Capital, with Dawn Capital, Seed Capital, and Hedosophia still present in the broader
              investor base. Those sources also converge on a post-money valuation around €1.5 billion, or roughly
              $1.7-$1.75 billion, making Flatpay Denmark’s fastest unicorn.

              The diligence catch is that total-lifetime-funding math is not yet a single clean number. Tracxn says the
              company has raised $239 million across four rounds, while Sacra’s pre-unicorn recap put lifetime funding
              at about $76.6 million after the Series B. More importantly, the audited 2024 annual report says the
              company raised DKK 655 million across a spring Series B and a Q4 Series C during 2024, which does not line
              up neatly with later public references that call the November 2025 unicorn financing the Series C. That
              mismatch does not undermine the fact of substantial capital formation, but it does mean the exact round
              chronology, secondary mix, and cap-table economics still require direct management reconciliation. The
              stakeholder map nevertheless is strong enough for chapter one: Dawn Capital underwrote the first major
              institutional step-up, AVP and Smash Capital backed the unicorn transition, Seed Capital appears as local
              continuity capital, and Finaro matters as an operating dependency because Flatpay’s original market entry
              relied on that licensed payments partner.
