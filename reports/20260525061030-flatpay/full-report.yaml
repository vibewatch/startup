  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and immediate adjacencies
        blocks:
          - type: paragraph
            body: >-
              Flatpay should not be sized as the whole of European payments. Its public offer is much narrower: it sells
              SMB merchants a blend of card acceptance, terminals, and point-of-sale workflow software, wrapped in
              transparent pricing and hands-on installation. The company is not presenting itself as a gateway-only
              processor, issuer, or enterprise outsourcing vendor; it is trying to win smaller merchants that feel
              overcharged or undersupported by legacy acquiring stacks. That distinction matters because the relevant
              spend is merchant acceptance and workflow control at the point of sale, not every euro of European payment
              volume. The practical boundary therefore includes in-person card acceptance, the devices and software that
              let a merchant take those payments, and the merchant service charges that fund the stack. It excludes pure
              e-commerce PSP volumes, issuer-side economics, and enterprise payment infrastructure that Flatpay does not
              currently market into. The boundary is also shaped by Flatpay’s own published cutoffs and implementation
              model, which point to owner-managed or lightly staffed SMBs as the first monetizable wedge rather than
              every merchant in Europe.
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM041
              - CM043
              - CM046
