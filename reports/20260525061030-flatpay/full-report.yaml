      - number: '1.4'
        title: Scale signals, milestone cadence, and open risks
        blocks:
          - type: paragraph
            body: >-
              The strongest company-overview evidence is Flatpay’s operating cadence. The partnership narrative places
              market launch in summer 2022 and documents more than 2,500 customers by September 2023. The audited 2024
              annual report then shows 17,000 customers, 300% year-over-year customer growth, and a footprint across
              Denmark, Finland, Germany, and Italy with a France branch registered for 2025 activity. Late-2025
              reporting pushes the scale story much further: around 60,000 customers, roughly €100 million of ARR
              crossed in October, expected 2025 revenue around €125 million, and roughly 1,400-1,500 global employees.
              The current About page pushes the front edge again to 70,000 merchants. Whatever exact public number one
              chooses, the directional conclusion is the same: Flatpay has moved from early go-to-market to pan-European
              scale unusually quickly.

              The open risks are subtler than a classic scandal but still material. First, headcount and customer
              figures differ by scope and date: registry-derived legal-entity headcount is far lower than global press
              figures, and current merchant claims have moved from 60,000 to 70,000. Second, the company’s regulatory
              posture is only indirectly visible. Public evidence shows that Flatpay originally relied on Finaro, a
              licensed partner, rather than publicly documenting its own standalone permission set. Third, independent
              review coverage is constructive but not unqualified. Trustpilot sentiment is strong, yet independent
              reviewers warn that flat-rate pricing may not be optimal for higher-volume merchants and that refund,
              chargeback, contract, and online-flow terms still need careful verification. In other words, Flatpay’s
              core business appears real and fast-growing, but later diligence should focus on permissions, cap-table
              precision, and how durable the human-intensive sales-and-support model remains as the company keeps
              scaling.
