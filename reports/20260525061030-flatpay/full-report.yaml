      - number: '2.4'
        title: Growth drivers, adoption constraints, and preserved gaps
        blocks:
          - type: paragraph
            body: >-
              The market tailwind is real. Cards already dominate European retail payments, digital-payment value has
              expanded sharply, contactless use is mainstream, and analysts expect both terminal infrastructure and
              broader payment flows to keep growing through 2031. Denmark, Flatpay’s home market, is especially
              digitally mature, which lowers consumer-behavior friction and makes merchant switching economics more
              important than basic acceptance education. Regulation is also widening the competitive set: instant
              payments are moving from policy intent into implementation, while wallets and account-to-account rails
              continue to gain relevance. But those same forces create constraints. Merchant economics are shaped by a
              layered fee stack rather than just headline interchange, public watchdogs still see gaps around price
              interventions and open banking, and Europe remains fragmented by country payment methods and
              infrastructure ownership. Flatpay’s own model adds another cautionary signal: in-person selling and
              installation may help conversion, but they also raise cost to serve. The chapter therefore preserves two
              unresolved gaps: public sources do not normalize SAM/SOM by country and merchant band, and public data
              does not show Flatpay’s CAC, churn, or merchant mix by geography.
