      - number: '2.2'
        title: Sizing the market with non-stackable lenses
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size Flatpay’s market is to work from multiple public lenses and keep them separate.
              Europe’s broad payments-market forecasts are useful as an upper-bound indicator that digital payment
              activity is expanding quickly, but those trillion-dollar figures measure payment value, not what an
              acquirer or terminal-led operator can actually earn. A merchant-acquiring report gets closer to fee-pool
              economics, but it is global and still not specific to Europe’s SMB point-of-sale wedge. A terminal-market
              forecast is different again: it measures the installed acceptance footprint and hardware refresh cycle
              rather than fee revenue. Against those lenses sits the actual buyer base: Europe’s SME population is
              enormous, and trade-heavy small-business categories matter because they are card-accepting,
              high-frequency, and operationally sensitive to payments friction. The result is a clear conclusion with an
              equally clear limitation. Flatpay is pointed at a large and growing market, but public data does not
              isolate a defensible Europe-only SMB SAM or SOM without further company data on active merchants, volumes,
              countries, and vertical mix.
            claimRefs:
