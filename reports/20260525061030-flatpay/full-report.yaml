      - number: '7.2'
        title: Regulatory, legal, and contracting perimeter
        blocks:
          - type: paragraph
            body: >-
              The most important legal fact in Flatpay's public materials is that the company does not say it processes
              card transactions itself. Instead, the UK terms and agency agreement describe a structure in which
              merchants are onboarded into separate acquirer contracts designated by Flatpay, with power of attorney and
              KYC/data-sharing flows embedded in the setup. That arrangement is commercially efficient, but it leaves
              investors with only partial visibility on the actual acquiring counterparties, switching rights, and
              regulated-entity perimeter in each market. Contract terms are also merchant-stringent: PCI failures,
              routing volume outside Flatpay's stack, or other material breaches can trigger immediate termination; the
              initial term is 36 months; and partner termination can cascade into merchant termination. Add surcharge
              and DCC features whose compliance burden sits with merchants but depends on partner BIN lists, acquirer
              approval, and card-scheme rules, and the legal posture becomes a real operating risk rather than
              back-office paperwork. The residual question is not whether Flatpay has contracts; it does. The unresolved
              question is whether its partner and compliance architecture is robust enough to scale cleanly across
              markets and products.
