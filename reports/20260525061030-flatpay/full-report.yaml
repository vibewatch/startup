chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Flatpay is best understood as a Danish SMB-payments challenger built around one unusually simple
              proposition: flat-rate acceptance plus a merchant-service experience that removes setup and pricing
              friction. The commercial origin story is stable across company and investor materials: the founders say
              they started in Copenhagen in 2022 to offer transparent payment services to small and medium-sized
              merchants. Legal filings add an important nuance. The audited 2024 annual report and registry-derived
              sources show FLATPAY ApS as a late-2021 legal formation with CVR 42718033 and a registered office in
              Herlev, so the right mental model is “commercial launch in 2022, legal incorporation in late 2021.” That
              distinction matters because later diligence should treat the Copenhagen narrative as the go-to-market
              origin story, while Herlev and the Danish entity filings are the canonical legal anchor.

              Product scope is already broader than a single card terminal. Current official pages show payment
              terminals, POS systems, and online payments, while merchant-support materials emphasize daily payouts,
              on-site installation, and 24/7 support. Flatpay’s flat-rate pricing remains the core wedge: the company
              still markets easy-to-understand fees and no setup or subscription charges rather than a more complex
              acquiring schedule. That clarity helps explain why later reporting repeatedly frames Flatpay as a merchant
              simplicity play rather than a feature-maximization story. Geographic expansion has also been fast. Public
              evidence moves from a Denmark-Finland-Germany footprint in 2024 to six European markets in late 2025,
              while the current About page claims more than 70,000 merchants and more than 100 million expected card
              swipes. The current public identity is therefore a founder-led, pan-European SMB-payments platform with
              strong sales-and-service emphasis, not merely a local Danish terminal vendor.
