- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider or class
  - Public pricing signal
  - Hardware / plan signal
  - Payout or account model
  - Contract model
  - Implication
  rows:
  - - Flatpay (euro pages)
    - 0.99% below €200k annual turnover; no hidden fees; daily payouts marketed
    - €0 to start on pricing page; payment-terminal page says 0 kr rent and no subscription
    - Daily or weekday settlement marketed on official pages
    - Official pages frame the offer as subscription-free and transparent
    - Very sharp simplicity message for small merchants comparing acquirer statements
  - - Flatpay (UK POS page)
    - 1.69% below £200k annual turnover and £0 monthly fee; custom rate above threshold
    - Pro Kit £1,495 and Premium Kit £2,495 with onboarding and installation
    - Merchant portal and installation-led rollout; exact UK settlement cadence not stated on POS page
    - Sales-assisted setup with tailored offer
    - Supports restaurants and fuller POS use cases but looks less self-serve than reader peers
  - - SumUp
    - Reader hardware from £14 to £99; standard peer comparisons show 1.69% in-person with optional lower-rate plan
    - Tap to Pay + readers + account bundle
    - Next-day payouts and instant transfers through SumUp business account
    - Contract-light, self-serve
    - Flatpay is not alone on pricing clarity; SumUp adds banking depth and installed-base scale
  - - PayPal POS / Zettle
    - Reader from £29, terminal from £149; independent comparisons cite 1.75% in-person
    - Compact reader, terminal, app, Tap to Pay
    - Funds typically hit PayPal balance fast and bank in one to two business days
    - No long-term commitments or rentals per official pricing page
    - Strong trust and PayPal ecosystem, but not obviously cheaper than Flatpay or SumUp
  - - myPOS
    - From 1.10% + £0.07 under threshold; £0 monthly costs; special rates above threshold
    - Hardware from £29 to £229 and account included
    - Instant settlement to merchant account in about three seconds
    - Mostly pay-as-you-go with optional rental by suitability
    - Very competitive for merchants who value instant liquidity more than a pure flat percentage
  - - Shopify / Lightspeed software suites
    - Shopify POS Pro is $89 per month per location; Lightspeed pricing varies and may add service fees
    - Subscription software economics are core to the bundle
    - Integrated payments inside broader retail operating stack
    - Plan- and service-based rather than simple one-rate card acquiring
    - These platforms win when software breadth matters more than headline MDR
  - - Stripe / Adyen builder platforms
    - Custom or bespoke pricing dominates; Stripe also lists $10 monthly cellular on enabled readers
    - API-led hardware and terminal-fleet management
    - Unified reporting and platform tooling matter more than simple payout marketing
    - Commercial agreement or custom pricing is common
    - These are credible substitutes once a merchant needs engineering flexibility or multi-market scale
  notes: All figures are public list-pricing or public packaging signals, not realised effective take rates. Flatpay rows
    intentionally separate euro-denominated and UK POS pages because retained public sources do not present one fully consistent
    commercial package.
