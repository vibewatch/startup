- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence / basis
  - Why it matters
  - Diligence ask
  rows:
  - - Transparent flat pricing
    - SumUp, Zettle, and myPOS already market transparent or low-friction tariffs
    - High
    - Direct peers publish cheap hardware and contract-light pricing; independent comparisons highlight contestable fee gaps
    - Flat pricing is compelling, but not exclusive
    - Request win-loss and churn by primary pricing competitor and by merchant volume band
  - - High-touch service and installation
    - Software-led suites can sell more of the merchant operating stack even if onboarding is less human
    - High
    - Flatpay’s sales motion is differentiated, but Shopify, Lightspeed, Stripe, and Adyen win on workflow depth and integration
      breadth
    - Service helps conversion, but bundled software can raise lifetime value and switching costs more effectively
    - Request attach, retention, and gross margin by payments-only vs POS-enabled merchants
  - - POS + online-payments expansion
    - Independent review still frames Flatpay as weaker for online-first merchants
    - Medium-High
    - Dupple recommends Stripe for online-first use cases and highlights weaker native online breadth
    - If online and omnichannel remain secondary, adjacent stacks can absorb more merchant spend
    - Request online-payments GPV, attach rate, and cross-sell conversion from terminal customers
  - - Regional challenger speed
    - Incumbent acquirers still control disproportionate European volume and merchant reach
    - High
    - TSG shows top-five scale concentration and multi-million-merchant incumbents
    - Scale affects pricing power, partner access, and trust at procurement
    - Request country-level share, merchant density, and economics in Germany, UK, and newest markets
  - - Merchant trust through simplicity
    - Public evidence does not fully reconcile Flatpay’s exact packaging across official and review sources
    - Medium
    - Official pages say zero rent or zero monthly fees, while Dupple describes monthly terminal rental and slower bank settlement
    - Packaging inconsistency can weaken trust if buyers discover different terms later
    - Obtain signed commercial templates by market, product, and merchant-size tier
  - - Standalone payments wedge
    - Software bundling is accelerating across Europe
    - High
    - Flagship documents PSP software M&A and argues stand-alone payment services are fading
    - If software becomes the anchor product, payment-only advantages commoditize faster
    - Request roadmap, software investment budget, and evidence that POS or ecommerce improves retention
  notes: Severity is a 12-24 month competitive underwriting view, not a probabilistic forecast. The register focuses on where
    Flatpay’s apparent moat could compress first.
