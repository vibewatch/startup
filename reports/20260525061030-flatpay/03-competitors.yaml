callouts:
- calloutType: strength
  title: Flatpay’s most credible wedge is simple pricing plus human service
  body: The retained source set supports a real SMB wedge around transparent pricing, walkthrough-led selling, and on-site
    installation. That combination is easier to explain than API-first enterprise stacks and more differentiated than a pure
    self-serve reader for merchants who want help switching.
  claimRefs:
  - CP001
  - CP012
  - CP031
  - CP041
- calloutType: risk
  title: Bundled commerce software is the bigger threat than another cheap card reader
  body: The sharpest adverse evidence does not come from one direct reader rival. It comes from software-led bundles and scaled
    incumbents that can make payments just one module inside a larger merchant operating system, raising switching costs and
    compressing standalone payment margins.
  claimRefs:
  - CP027
  - CP032
  - CP034
  - CP042
