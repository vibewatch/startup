- id: switching-costs-distribution-and-trust
  title: Switching costs, distribution, and trust posture
  body: 'Distribution power and switching dynamics are where the competition becomes less flattering for Flatpay. The company’s
    own UK POS flow still relies on a personalised walkthrough, tailored offer, and on-site installation. That can help conversion
    with smaller merchants who distrust hidden fees and want a human explanation, and it is a meaningful contrast with the
    mostly self-serve onboarding of SumUp, Zettle, and myPOS. But service-heavy sales do not equal durable lock-in. For simple
    card acceptance, switching costs remain only moderate because merchants can swap readers, payout accounts, and tariff
    structures without ripping out their full operating stack. The economics get stickier only once the merchant adopts inventory
    workflows, ecommerce integrations, customer profiles, analytics, or APIs. That is where Shopify, Lightspeed, Stripe, and
    Adyen gain leverage. Independent comparison sources also show that trust posture is easier to verify for PayPal-linked,
    FCA-authorised, or very large incumbent providers than for Flatpay’s own market-by-market regulatory footprint. Finally,
    TSG’s European acquiring rankings underline the scale asymmetry: the top five processors still control a very large share
    of the market, and merchant counts above one million sit with much larger incumbents and platforms than Flatpay.'
