- id: capability-pricing-and-gtm
  title: Capability, pricing, and GTM comparison
  body: 'Capability and pricing comparisons split the market into two clusters. The direct-reader cluster competes mostly
    on fee transparency, hardware affordability, payout speed, and ease of setup. Flatpay’s current public materials are aggressive
    on that axis: 0.99% is still advertised on euro-denominated pages, the UK POS page shows 1.69% below a turnover threshold,
    and multiple Flatpay surfaces repeat the promise of zero monthly fees or zero rent. SumUp and Zettle answer with cheaper
    or similarly cheap hardware, flat-fee simplicity, and account-linked payout tools, while myPOS pushes harder on instant
    settlement and bundled merchant-account functionality. The platform cluster competes differently. Stripe and Adyen emphasize
    APIs, terminal fleet management, Tap to Pay, and unified commerce for more complex merchants. Shopify and Lightspeed sell
    the operating system around the payment itself: omnichannel workflows, inventory, reporting, customer profiles, ecommerce,
    and multi-location control. That means Flatpay can look cheaper and simpler at the point of sale while still being weaker
    when a merchant is really buying software breadth. It also means public packaging needs careful reading: an independent
    2026 review describes Flatpay rental economics differently from Flatpay’s own pages, so investors should treat current
    list-pricing claims as directionally supportive, not yet contract-grade.'
