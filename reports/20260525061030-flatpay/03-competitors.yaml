tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor or substitute
  - Category
  - Scale / funding signal
  - Target segment
  - Pricing or GTM posture
  - Key differentiation
  - Limitation versus Flatpay or vice versa
  rows:
  - - Flatpay
    - Direct SMB acquirer + POS challenger
    - 'Official site: 70,000+ merchants and 1,300+ employees; late-2025 news: 60,000+ customers and €145M Series C at ~€1.5B
      valuation'
    - European SMBs in retail, hospitality, and services
    - High-touch sales with in-person walkthroughs, on-site installation, flat-rate pricing
    - Transparent pricing, local installation, 24/7 support, daily or weekday settlements
    - Public scale is still far below million-merchant incumbents, and exact packaging differs across sources
  - - SumUp
    - Direct pay-as-you-go peer
    - 4M businesses across 37 countries
    - Micro and small merchants wanting fast setup
    - Self-serve, phone-first, low-cost hardware, business-account upsell
    - Large installed base, cheap hardware, banking and payout bundle
    - Software depth is lighter than full commerce suites; flat pricing remains contestable
  - - PayPal POS / Zettle
    - Direct pay-as-you-go peer
    - Backed by PayPal brand and compliance posture in UK comparison coverage
    - Micro-merchants and PayPal-linked sellers
    - Reader from £29, terminal from £149, custom rates above volume threshold
    - PayPal ecosystem, Tap to Pay, strong trust halo
    - Standard in-person rate is not cheaper than SumUp and support/setup depth is still small-business oriented
  - - myPOS
    - Direct pay-as-you-go peer
    - 350,000+ merchants on official site
    - Mobile and small merchants who value instant settlement
    - £0 fixed monthly costs, from 1.10% + £0.07 under threshold, special rates above threshold
    - Instant settlement, merchant account / IBAN, free data SIM
    - More complex tariff structure than Flatpay’s pure flat-rate pitch
  - - Stripe Terminal
    - Adjacent builder platform
    - Large platform presence but pricing is mostly custom for richer needs
    - Online-first or software-driven merchants and platforms
    - API-led, custom integrations, custom pricing, fleet management
    - Deep developer tooling, Tap to Pay, unified reporting across channels
    - Not the simplest or most transparent first choice for very small offline merchants
  - - Shopify POS
    - Adjacent commerce-suite substitute
    - Supports 1,000+ locations; rides Shopify’s broader commerce ecosystem
    - Retailers wanting omnichannel, ecommerce, and store management in one stack
    - Subscription-led software with POS Pro add-on
    - Strong ecommerce + inventory + customer-data bundle
    - Merchant may buy software breadth rather than lowest in-person acquiring rate
  - - Lightspeed Retail
    - Adjacent commerce-suite substitute
    - ~144K locations and $90.7B FY2024 GTV on official page
    - Retailers with multi-store, inventory, and reporting needs
    - Plan-based pricing with added service fees possible
    - Integrated payments, ecommerce, open API, 24/7 support
    - More operationally heavy and likely more expensive than a simple Flatpay rollout
  - - Adyen and scaled European incumbents
    - Incumbent acquirer / platform class
    - TSG ranks Adyen near top European processing volume and Nexi at 2.9M merchants
    - Mid-market, enterprise, and cross-border merchants
    - Sales-led, integration-heavy, multi-country acquiring and terminal management
    - Trust, scale, international reach, and fleet tools
    - Too broad or complex for some SMBs, but formidable when merchants outgrow simple readers
  - - DIY / internal build
    - Status quo / substitute
    - No vendor scale needed; merchant assembles own tools
    - Cost-sensitive or workflow-specific merchants
    - Mix a PSP, POS, ecommerce, and accounting tools separately
    - Lowest single-vendor dependence and best fit for unusual workflows
    - Operational complexity and fragmented support burden are materially higher
  notes: Rows compare direct peers, incumbents, adjacents, and substitutes using public scale signals, official product pages,
    and retained independent market commentary; unknown or moving scale figures are preserved as directional rather than exact.
