  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: flatpay-pricing-consistency
    missingEvidence: Signed or current market-specific commercial terms that reconcile official zero-fee language with the
      third-party review that describes monthly terminal rental and slower bank settlement.
    whyItMatters: Flatpay’s core competitive wedge is pricing clarity. If public descriptions differ by product or market,
      underwriting its price advantage from public pages alone is risky.
    diligencePath: Request current commercial templates for Denmark, UK, and any next-launch markets, plus one recent merchant
      invoice per product type.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: flatpay-regulatory-entity
    missingEvidence: A current primary source naming the exact legal entity, market-by-market acquiring permissions, and regulatory
      registrations behind Flatpay’s merchant contracts.
    whyItMatters: Trust and regulatory posture are part of the buyer decision in payments. Public evidence is easier to verify
      for PayPal-linked or large incumbent providers than for Flatpay’s exact market structure.
    diligencePath: Pull merchant terms, regulatory disclosures, or licensing pages by country and map them against the seller-of-record
      for each Flatpay product.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: retention-and-attach
    missingEvidence: Cohort retention, gross margin, win-loss, and attach-rate data for payments-only versus POS and online-payments
      merchants.
    whyItMatters: Those private metrics determine whether Flatpay’s service-heavy growth model creates durable software-led
      lock-in or only expensive top-of-funnel conversion.
    diligencePath: Request cohort retention by product bundle, churn reasons by competitor, and CAC-payback by direct-sales
      cohort and market.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
