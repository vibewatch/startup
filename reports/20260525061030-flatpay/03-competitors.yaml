- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'Flatpay’s moat is real, but it is narrower than a simple unicorn label implies. The clearest differentiator in retained
    evidence is transparent pricing paired with high-touch service: Flatpay repeatedly markets flat rates, zero hidden fees,
    and on-site help, and news coverage suggests that merchant-facing sales execution is central to growth. That is a useful
    wedge against legacy acquirers and a practical alternative to self-serve readers when a merchant wants someone to install
    and explain the system. The problem is that this wedge is easy to understand and, in parts, easy to imitate. Direct peers
    already compete on transparent, contract-light pricing. SumUp and myPOS wrap payments with business-account and payout
    tools. Zettle brings the PayPal trust umbrella. Shopify and Lightspeed own broader retail software, while Stripe and Adyen
    own developer and enterprise flexibility. Flagship’s research is the most important adverse signal: European PSPs are
    buying commerce software because stand-alone payment services are fading into bundled merchant operating systems. If that
    industry direction holds, Flatpay’s pricing clarity remains useful, but it is not enough by itself to guarantee durable
    share or superior margins. The diligence burden therefore shifts to retention, attach, and win-loss evidence that public
    materials still do not disclose.'
