company:
  name: Flatpay
chapter:
  number: 3
  title: Competitors
  summary: Flatpay’s closest direct peers are SumUp, PayPal POS/Zettle, and myPOS, but the more important durability risk
    comes from software-led commerce stacks such as Shopify, Lightspeed, Stripe, and Adyen that can bundle payments into broader
    merchant workflows. Public evidence supports Flatpay’s wedge on transparent flat pricing and high-touch installation,
    yet the same evidence also shows weaker scale, weaker software breadth, and inconsistent public packaging signals versus
    larger incumbents and adjacent platforms.
sections:
- id: landscape-and-peer-set
  title: Landscape and peer set
  body: 'Flatpay’s direct comparison set is narrower than the whole payments industry. The closest peers are pay-as-you-go
    SMB card-acquiring challengers that promise simple onboarding, portable hardware, and transparent card-present pricing:
    SumUp, PayPal POS/Zettle, and myPOS. Those vendors all sell small-merchant convenience first, not enterprise integration
    breadth. Flatpay’s own current materials show why it sits in that lane: it markets flat-rate terminal pricing, POS kits,
    online payments, and 24/7 support to merchants that want an easier alternative to opaque acquirer statements. Public scale
    signals also show why Flatpay is relevant but not dominant. Its official site advertises more than 70,000 merchants and
    1,300 employees, while late-2025 news sources describe a business that had crossed 60,000 customers, raised a large Series
    C, and was still adding markets and headcount quickly. That makes Flatpay credible as a fast-scaling European challenger,
    but still far smaller than the largest acquirers or software platforms. Beyond direct peers, the landscape broadens into
    platform-led commerce stacks such as Shopify POS, Lightspeed, Stripe Terminal, and Adyen, plus internal-build paths that
    combine a PSP or acquirer with separate POS, ecommerce, and accounting tools.'
  claimRefs:
