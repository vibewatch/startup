      - number: '7.3'
        title: 运营、服务与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Flatpay 已不再只是简单的终端供应商。已核查的支持和产品材料覆盖终端、POS、在线支付、报表下载、基于 PIN 的员工访问和
              Capital。足迹变宽很重要，因为服务失败可能同时出现在多个位置：由收单机构驱动的打款、网关 /
              软件正常运行时间、报表生成、商户入驻，或客服响应质量。公开评论证据整体偏正面，状态页在可见历史中没有事故，但这不足以证明长期韧性。公开记录没有披露独立正常运行时间数据、安全认证、具名处理合作伙伴或事故复盘。商户痛点也可能来自合同栈本身：评论文本已经提到转账可能需要几天，而英国条款把争议和拒付放在商户与收单机构关系上，而不是
              Flatpay 身上。实际结果是一个归责循环：Flatpay 在合同上把服务结果推给下游，商户却仍按结果评价 Flatpay。公司还依赖设备融资、快递物流、网关合作伙伴以及卡组织 / BIN
              列表更新，这张依赖网比营销故事更密。
