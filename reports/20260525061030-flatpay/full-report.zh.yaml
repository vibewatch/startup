  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Flatpay 最强的公开证据，仍描绘的是一家激进扩张中的公司，而不是成熟、风险已充分出清的支付平台。独立报道显示，公司在 2025 年末达到独角兽地位，但仍未盈利，并计划在 2026 年推动 ARR
              再上一个台阶；公司官网同时继续主打简单固定费率、每日打款和 24/7
              支持。这个组合在商业上有力，但执行容错很窄。公司向商户承诺清晰，却依赖只披露一部分的收单机构、网关和合作伙伴流程。运营范围也从终端扩到在线支付、报表工作流和嵌入式金融。在这个背景下，最高严重度风险不是抽象的宏观担忧，而是收单机构依赖、固定费率模型下的利润率挤压、服务质量滑坡时的合同和投诉摩擦，以及亏损式增长跑在运营控制前面的可能性。因此，热力图把合作伙伴集中、定价
              / 模型压力、多产品执行排在纯需求走弱之前。
