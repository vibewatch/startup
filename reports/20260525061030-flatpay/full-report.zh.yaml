  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Flatpay 的意义
    rows:
      - - SMB 线下刷卡受理
        - 线下刷卡交易的商户服务费，加上终端和结算服务
        - 发卡方经济收益和消费者信贷变现
        - 通常由店主或门店经理从运营预算支付
        - Flatpay 明确营销的核心受理层
      - - SMB 终端主导支付
        - 终端硬件、软件更新、连接、报表和收单服务
        - 企业级终端队列管理或纯处理商外包
        - 店主或运营负责人批准；收银员或员工使用
        - 匹配 Flatpay 终端产品和安装模式
      - - 集成式 SMB POS 工作流
        - 收银软件、库存、分析和打包支付
        - ERP 级或企业商务栈
        - 店主、经营者或财务审批人付款；员工使用
        - 纳入范围，因为 Flatpay 营销的是 POS 套餐，而不只是终端
      - - 较高交易量 SMB 商户账户
        - 超过公开营业额阈值后的定制定价收单和 POS 套餐
        - Flatpay 不销售的全国性发卡方、卡组织或网关经济收益
        - 比个体店主更正式的预算负责人
        - 可服务，但需要定制定价和更复杂销售
      - - 纯电商网关或企业 PSP 支出
        - 仅为邻近支出；部分商户也可能在别处购买在线受理
        - 不作为本章核心范围，因为 Flatpay 公开材料聚焦线下商户
        - 不同的数字团队或集中支付负责人
        - 作为邻近项处理，而不是本章核心市场边界
    notes: 边界表把 Flatpay 实际销售的受理栈，与那些若直接纳入会高估 TAM 的相邻支付类别分开。
