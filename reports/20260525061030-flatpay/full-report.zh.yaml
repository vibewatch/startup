      - number: '6.2'
        title: 采用轨迹与渠道模型
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的客户采用增长很快。2025 年底报道反复称客户约 60,000 名，高于 2024 年 4 月的 7,000 名；当前主页现在宣称欧洲 70,000+
              商户。即便考虑营销滞后和自报偏差，这个序列也显示，公司在独角兽融资轮后继续增加商户，而不是进入平台期。德国被报道称为最大市场，约 20,000 名客户；仅意大利就有 18,000 名客户，且以酒店餐饮为主。


              采用路径有意保持高接触。Flatpay 不是纯自助获客，而是反复描述一种外勤销售动作：先线下面谈，再讨论产品选择，最后上门安装。创始人访谈称，销售代表会直接拜访中小商户，并面对面解释定价。它比 Stripe
              式产品驱动动作更劳动密集，但似乎正是 Flatpay 能转化线下商户的核心原因；这些商户未必会只靠文档和 API
              购买。这个模型也为核心中小商户目标降低采购摩擦：商户不需要自己配置硬件、解读交换费表，或把多个提供商拼在一起。


              产品采用并不局限于单一终端。Flatpay 现在营销三类核心表面——支付终端、POS 和在线支付——并在既有商户之上叠加资本产品。电商产品支持常见网店集成，并点名 Frisbii 为技术平台；POS
              页面展示分账、桌台视图、外卖处理、厨房打印机、库存和报表等餐厅工作流。Capital 通过只向 Flatpay
              商户提供的基于收入融资，扩大钱包份额。合在一起，这些表面构成了可信的先落地再扩张故事，尽管公司没有披露 NRR、产品附加率或队列迁移指标。
