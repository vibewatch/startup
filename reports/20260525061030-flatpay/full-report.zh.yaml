  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价与收入质量信号
        blocks:
          - type: paragraph
            body: >-
              Flatpay 公开收入模型，是把面向中小商户的线下银行卡收单，包进硬件、软件和支持组合里。官方页面显示三个可售表面——终端、POS 和在线支付——其中终端方案在 €200k 以下按每笔 0.99% 标价，POS
              方案在 €200k 以下按 1.49% 标价；更大商户进入定制定价。法律条款对简单性主张作出实质限定：收单方而非 Flatpay
              收取交易费并向商户打款，一些插件和附加组件可以单独计费，低使用量罚金和附加费规则仍会影响商户经济性。这意味着公开标价有助于判断需求和定位，但不足以推导 Flatpay
              的净抽成率、总额到净额收入确认方式，或分收入流结构。从收入质量看，最强正面信号是商户资金不作为资金沉淀业务留在 Flatpay 资产负债表上；最大未知则是扣除合作收单方经济性后，Flatpay
              实际保留多少商户头部费率。
