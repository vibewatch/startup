        - 在基准情景留存测算前提高依赖性折价，并要求完成合作方尽调
      - - 固定定价下的利润率挤压
        - 按卡种组合划分的毛利率、附加费使用、非欧盟交易量、合作方费率
        - 高成本卡种占比上升或附加费经济性恶化时，利润率缺口持续存在
        - 重做单位经济性测算，降低表面商户增长对估值的支撑
      - - 合同摩擦引发的投诉驱动流失
        - 退款、取消、打款延迟和提前解约投诉趋势
        - 一个或多个市场围绕锁定条款、费用或服务延迟出现明显投诉激增
        - 提高流失假设，并检验总商户数是否夸大真实黏性
      - - 2026 年增长目标后的亏损延续
        - ARR 相对计划、烧钱速度和经营杠杆指标
        - 2026 年 ARR 或效率目标明显落空，同时法定亏损仍处高位
        - 假设存在后续融资风险，并降低对当前规模化打法的信心
      - - Capital 产品承压
        - 审批转化、还款逾期、投诉和合作方损失分担条款
        - 出现重大逾期 / 投诉问题，或合作方经济性恶化
        - 将 Capital 视为品牌和近资产负债表风险，而不是无害附加产品
