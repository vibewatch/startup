  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 公开替代 / 代理
      - 缺口为什么重要
      - 承保风险
      - 精确尽调路径
    rows:
      - - GMV / TPV 与净抽佣率
        - 只有商户标题价
        - 需要将定价映射到 Flatpay 净收入和估值倍数
        - 无法判断增长由交易量驱动、利润率驱动，还是两者共同驱动
        - 按产品和国家索取月度 TPV、处理交易笔数和净抽佣率
      - - 按收入来源划分的收入确认
        - 产品页面加申报毛利
        - 需要终端、POS、线上和附加项结构，才能判断经常性质量
        - 没有收入结构和确认政策，经常性质量逻辑无法测试
        - 索取经审计收入桥和总额到净额确认备忘录
      - - 按市场划分的 CAC / 回本周期
        - 地推销售叙事加温和网页流量代理
        - 直销动作可能有效，但结构性昂贵
        - 即便高速增长，仍可能需要持续资本支持
        - 按市场索取队列 CAC、回本月数、转化漏斗和销售生产率
      - - 按产品划分的毛利率
        - 只有毛利和薪酬总额
        - 需要知道收单 / POS 经济模型是否随规模改善
        - 利润率路径可能显著弱于增长叙事暗示
        - 索取产品级毛利率、支持成本和硬件损失率
      - - 流失 / NRR / 队列留存
        - 只有 Trustpilot 情绪和零散评测
        - 低 ARPU 的 SMB 基础中，留存是收入质量的关键测试
        - 强劲收入增长可能掩盖较弱的队列质量
        - 索取商户数流失、商户留存、NRR 和队列收入瀑布
      - - 2025 年 11 月融资后的当前现金
        - 2024 年申报加粗略现金跑道估算
        - 资本充足性只是近似，不是实测
        - 下一轮触发点和下行缓冲仍未知
        - 获取最新月度现金瀑布、债务表和董事会现金跑道情景
      - - 实体与集团指标桥
        - 申报中 17k 客户，对比公开 60k-70k 商户声称
        - 法律实体错配会扭曲单商户和单员工计算
        - 没有分拆，估值倍数分析可能方向性错误
        - 索取按地域拆分的收入、客户和员工数法律实体桥
      - - 收单方经济模型
        - 条款显示收单方控制费用收取和打款
        - 收入分成和结算条款是核心经济模型，但未披露
        - 商户标题费率可能高估 Flatpay 经济模型
        - 索取收单方协议、结算时间、拒付政策和准备金条款
    notes: 每一行都是明确的承保阻断点，而不是泛泛问题；管理层可以用经审计内部报告和合作伙伴合同披露清除其中大多数。
