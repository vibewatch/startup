  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与可比公司
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的直接可比集合比整个支付行业窄。最接近的同行，是按用量付费、服务中小商户的银行卡收单挑战者，它们承诺简单上线、便携硬件和透明的线下刷卡定价：SumUp、PayPal POS/Zettle 和
              myPOS。这些供应商优先卖小商户便利性，而不是企业集成广度。Flatpay 当前材料也解释了它为什么落在这条赛道：公司向想要替代不透明收单账单的商户，营销固定费率终端定价、POS 套装、在线支付和 24/7
              支持。公开规模信号也说明 Flatpay 为什么相关但不占主导。官网宣称商户超过 70,000 家、员工 1,300 人，2025 年底新闻则描述其已跨过 60,000 名客户、完成大额 Series
              C，并仍在快速增加市场和员工。这让 Flatpay 成为可信的快速扩张欧洲挑战者，但它仍远小于最大的收单机构或软件平台。直接同行之外，版图进一步扩展到平台型商业堆栈，如 Shopify
              POS、Lightspeed、Stripe Terminal 和 Adyen，以及把 PSP 或收单方与独立 POS、电商、会计工具组合起来的自建路径。
