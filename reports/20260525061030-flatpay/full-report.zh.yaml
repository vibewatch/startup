  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Flatpay
      - 直接读卡器同行（SumUp / Zettle / myPOS）
      - 商户运营套件（Shopify / Lightspeed）
      - 开发者平台（Stripe / Adyen）
      - DIY 或内部自建
    rows:
      - - 透明线下定价
        - 强：官网页面反复宣传统一或简单标价
        - 中-强：透明，但仍因供应商而异，也不总是一个统一费率
        - 中：软件订阅经济性和支付费率同样重要
        - 低-中：定价通常按定制或集成驱动
        - 不定：取决于每个选定供应商
      - - POS / 库存工作流深度
        - 中：Flatpay POS 增加桌台视图、库存、报表和套件
        - 低-中：有基础 POS 和支付功能，但软件深度较浅
        - 高：库存、员工、分析、全渠道和后台是核心
        - 中-高：集成灵活性强，但商户通常需要自己的应用栈
        - 不定：可以很高，但需要更多建设和供应商管理
      - - 线上 / 电商广度
        - 中：官网在线支付页面支持多种集成
        - 低-中：链接、发票和基础在线工具存在，但深度有限
        - 高：商户经营和电商是套件核心
        - 高：API 和平台集成是核心卖点
        - 不定：商户分别选择同类最佳工具
      - - 银行 / 打款捆绑
        - 中：对外宣传每日或工作日结算，但更广的银行工具还不是公开核心产品
        - 高：SumUp 和 myPOS 都宣传商户账户或商务账户工具；Zettle 借力 PayPal 余额流
        - 低-中：支付已集成，但银行不是主要楔子
        - 中：平台工具比简单商户银行能力更关键
        - 不定：商户可独立叠加银行或资金管理产品
      - - 入驻 / 上线方式
        - 高接触：讲解、定制报价和现场安装
        - 主要自助：注册、买硬件、连接应用或账户
        - 软件范围变大后，销售或引导式上线更常见
        - 销售主导或开发者主导的集成常见
        - 负担最高：商户必须协调技术栈、入驻和支持
      - - 信任 / 监管可见度
        - 中：官网产品主张清晰，但各市场实体披露仍是尽调项
        - PayPal 相关信任度高；SumUp 和 myPOS 这类大型受监管同行为中高
        - 高：大型软件品牌和成熟支付轨道公开容易验证
        - 高：企业支付品牌有成熟平台声誉
        - 低-中：信任取决于商户选择的供应商组合
      - - 采用后的切换成本
        - 中：POS 和在线支付绑定增加后会升高
        - 中：简单受理时低，账户和打款工具嵌入后升高
        - 高：数据、库存、电商和员工工作流加深锁定
        - 高：API 集成和统一报表提高迁移成本
        - 供应商锁定低，运营复杂度高
    notes: 单元格是有证据支撑的定性摘要。“直接读卡器同行”和“商户运营套件”有意分组，是为了比较买方决策模式，而不是暗示所有供应商功能相同。
