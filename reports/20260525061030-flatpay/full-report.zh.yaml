  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 指标
      - 倍数 / 估值
      - 适用性
      - 局限
    rows:
      - - Adyen
        - 2025 年收入 / 2026 年 5 月市值
        - ~11.3x 收入
        - 欧洲上市支付公司中最合适的高溢价可比，能代表规模和质量。
        - 已上市、盈利，且企业客户占比远高于 Flatpay。
      - - Toast
        - 2025 年收入 / 2026 年 5 月市值
        - ~2.2x 收入
        - 可作为中小商户商业软件 + 支付敞口的参照。
        - 餐饮占比高、美国市场权重高，差异明显。
      - - Shift4 Payments
        - 2025 年收入 / 2026 年 5 月市值
        - ~1.0x 收入
        - 收单与软件结合，并带有线下支付敞口。
        - 规模和地域不同；利润率披露仍比 Flatpay 更充分。
      - - Nexi
        - 2024 年收入 / 2026 年 5 月市值
        - ~0.7x 收入
        - 欧洲支付处理商，受公开市场纪律约束。
        - 规模大得多的老牌企业，增长更低，资产组合更成熟。
      - - PayPal
        - 2025 年收入 / 2026 年 5 月市值
        - ~1.2x 收入
        - 大型多元化支付基准，反映市场出清情绪。
        - 消费者和钱包业务占比使它只能方向性可比。
      - - Global Payments
        - 2025 年收入 / 2026 年 5 月市值
        - ~2.4x 收入
        - 有规模的商户收单基准，带战略选择权。
        - 成熟老牌企业；收入结构和杠杆不同。
      - - SumUp
        - 2022 年私募轮 / 2025-2026 年 IPO 传闻
        - 上一轮 €8B；IPO 目标最高 $15B
        - 有参照价值的中小商户支付私募可比，装机基础大得多。
        - 规模、地域和成熟度不同；当前估值尚未被公开市场出清。
      - - Worldpay
        - 2025 年并购交易
        - $24.25B，8.5x 调整后 EBITDA
        - 说明战略买家仍会为有规模的商户收单资产支付有意义的倍数。
        - EBITDA 交易倍数无法直接类比 Flatpay 的亏损增长阶段。
    notes: 倍数使用 2026 年 5 月公开可得的市值和收入快照，或已披露交易价值；它们是方向性参照，不是完全同口径估值。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative public, private, and M&A references most relevant to European SMB payments and merchant acquiring
        as of May 2026.
    claimRefs:
      - CV051
      - CV052
      - CV050
      - CV054
      - CV055
      - CV056
  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入支撑断裂
        - 经审计 2025 年收入明显低于约 €175M，或 2026 年运行率低于约 €220M
        - 当前高溢价倍数失去支撑，基准情景塌陷。
        - 重估到悲观情景，避免高于上一轮支付。
      - - 亏损收敛停滞
        - 客户增长未能带来毛利转化显著改善和亏损收窄
        - 高触达模式看起来结构性吃资本，而不是可规模化。
        - 把价值区间下调到上市同业区间，任何投资前都要求证明。
      - - 下一轮融资惩罚性
        - 下一轮定价低于上一轮，或引入惩罚性优先权
        - 证实价格支撑薄弱，并提高回报被排后的风险。
        - 视为重大的负面价格发现事件。
      - - 队列经济性不及预期
        - 按市场看的留存、CAC 回本或欺诈损失明显差于隐含水平
        - 商户增长的价值低于表面客户数所显示的水平。
        - 从观察转为回避，直到经济性稳定。
      - - 扩张质量转弱
        - 新国家铺开带来交易量，但没有盈利贡献
        - 地域扩张不再创造价值，反而放大烧钱。
        - 暂停任何高溢价倍数的投资测算。
    notes: 这些触发项被刻意设为可衡量，因此可作为投资准入门槛，而不是叙事警示。
    claimRefs:
      - CV072
      - CV073
      - CV074
      - CV070
      - CV017
      - CV071
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 2025 年与 2026 年 YTD 财务数据
        - 合并收入、毛利、经营亏损和现金流月度 / 季度数据未公开。
        - 这是检验公司是否真的用增长消化最新一轮估值的最快方式。
        - 在 NDA 下向 CFO 要求经审计 FY2025 账目和 2026 年月度经营数据包。
      - - 股权结构表和优先权瀑布
        - 公开资料没有清算优先权、反稀释条款或完全稀释股权表。
        - 回报结果可能与企业价值结果差异很大。
        - 要求提供完整股权结构表、股东协议摘要和瀑布模型。
      - - 按市场划分的队列经济性
        - 公开资料没有按国家披露留存、流失、CAC 回本或贡献毛利率。
        - 高触达销售模式只有在单位经济性可规模化时才值得给溢价。
        - 要求提供丹麦、德国、意大利、法国、英国和任何 2026 年上线市场的队列分析。
      - - 支付风险指标
        - 公开资料没有拒付、欺诈损失、准备金或抽佣率披露。
        - 决定毛利耐久度的是这些指标，而不只是收入。
        - 从 COO / 风险负责人处获取风险看板和承保政策摘要。
      - - 治理和董事会权利
        - 登记资料显示董事会结构复杂，但看不出投资人保护或治理承诺。
        - 后期投资人需要看清控制权、同意权和报告节奏。
        - 要求提供董事会构成、保留事项和信息权清单。
      - - 退出准备路线图
        - 公开资料没有 IPO 准备计划、投行委任或战略退出流程信号。
        - 退出路径假设决定当前轮次能否产生有吸引力的复利回报。
        - 要求提供董事会材料或投行准备文件，说明 24 个月退出计划。
    notes: 前三项是新资金投资判断的阻断项；其余问题决定高溢价增长叙事是否耐久。
    claimRefs:
      - CV067
      - CV069
      - CV070
      - CV071
      - CV068
