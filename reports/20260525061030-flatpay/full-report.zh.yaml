        - 对照 2026 年计划审查月度烧钱、现金跑道和产能趋势
      - - 打款预期与营运资金感知
        - 每日打款营销与收单方掌控的结算并存，也有真实评价显示转账需数日完成
        - 中
        - 高
        - 合同隔离或许能在法律上保护 Flatpay
        - 中高——商户仍会把打款不满归因于 Flatpay
        - 按收单方审查打款 SLA 达成率和支持升级路径
      - - Capital 信用 / 回款敞口
        - 融资报价和还款绑定商户支付流水，并依赖直接借记或收入分成回款机制
        - 中
        - 高
        - 产品地域范围有限，且使用专业合作方
        - 中高——表现不佳仍会损害留存和品牌信任
        - 要求提供 Capital 的队列损失、逾期和投诉结果
      - - 报告口径不透明
        - 公开实体数据显示公司亏损，且员工数低于网站层面的集团营销说法
        - 中
        - 高
        - 大额股本基础和投资方支持意味着有资源建设更好的控制体系
        - 高——投资人尚无法把集团叙事与法定明细清晰勾稽
        - 获取合并管理账和法律实体桥接表
      - - 合同支撑的留存与真实黏性
        - 长初始期限和违约赔偿可把商户留在平台上，即使使用意愿转弱
        - 中
        - 中高
        - 良好的支持口碑可缓冲下行
        - 中高——总商户数可能高估自愿留存的耐久度
        - 衡量初始期限后的流失、取消原因和挽留成功率
