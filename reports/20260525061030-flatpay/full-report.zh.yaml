      - number: '1.3'
        title: 融资历史、估值与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的融资历史清楚支持一次快速的后期估值重定价，但公开资本结构并不完全整齐。早期锚点是 2024 年 4 月 Series B：TechCrunch 报道该轮 €45M，由 Dawn Capital
              领投，Seed Capital 参投。随后节奏明显加速：围绕 2025 年 11 月独角兽轮的公开报道一致指向约 €145M 新资本，由 AVP 和 Smash Capital 领投，Dawn
              Capital、Seed Capital 和 Hedosophia 仍在更广义投资人名单中。这些来源也都指向约 €1.5B 的投后估值，约合 $1.7-$1.75B，使 Flatpay 成为丹麦最快诞生的独角兽。

              尽调卡点在于，累计融资额还不是一个干净的单一数字。Tracxn 称公司四轮合计融资 $239M，而 Sacra 在独角兽轮前的回顾把 Series B 后累计融资放在约 $76.6M。更重要的是，经审计的
              2024 年年报称，公司 2024 年通过春季 Series B 和第四季度 Series C 共融资 DKK 655M，这与后续公开资料把 2025 年 11 月独角兽融资称为 Series C
              并不完全对齐。这个错位不削弱公司大规模融资已经发生的事实，但意味着精确轮次顺序、老股比例和股权结构经济性仍需要管理层直接校准。不过，对第一章来说，利益相关方地图已经足够清晰：Dawn Capital
              承销了第一轮重要机构跃迁，AVP 和 Smash Capital 支持独角兽阶段转换，Seed Capital 体现本土连续资本，Finaro 则是运营依赖，因为 Flatpay
              最初进入市场依靠这家持牌支付合作方。
