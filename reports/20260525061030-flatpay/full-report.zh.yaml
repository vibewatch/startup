  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与近邻机会
        blocks:
          - type: paragraph
            body: >-
              不能把 Flatpay
              按整个欧洲支付市场来估算。它的公开产品窄得多：向中小商户销售银行卡受理、终端和销售点工作流软件的组合，再包上透明定价和上门安装。公司并没有把自己定位成纯网关处理商、发卡方或企业外包供应商；它想赢下的是那些觉得传统收单体系收费过高、支持不足的小商户。这个区分重要，因为相关支出是销售点的商户受理和工作流控制，而不是欧洲每一欧元支付量。实际边界因此包括线下银行卡受理、让商户完成收款的设备和软件，以及为这套堆栈付费的商户服务费；不包括纯电商
              PSP 交易量、发卡侧经济性，以及 Flatpay 目前并未进入的企业支付基础设施。边界也受 Flatpay 自己发布的门槛和实施模型影响，指向店主经营或轻人手中小企业这个第一条可变现楔子，而不是欧洲所有商户。
