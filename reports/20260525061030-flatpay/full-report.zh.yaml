  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Flatpay 显然具备一个有吸引力的欧洲 SMB
              支付故事所需的要素：透明定价、看起来能打动服务不足商户的面对面入驻模式、快速地域扩张，以及在大约三年内把公司推到独角兽地位的头部增长曲线。公开证据在商业主张本身上最强。Flatpay
              自己的网站持续强调固定费用、无隐藏收费、每日打款、24/7 支持和上门安装；独立报道大体印证，这些功能就是核心采用引擎。客户故事也真实存在：经审计的 2024 年文件显示年末有 17,000 名客户，2025
              年末报道指向大约 60,000 名商户，而当前网站已经对外营销超过 70,000 名商户。


              反向逻辑在估值和运营质量。同一份支持商户快速增长的公开记录，也显示公司仍在大幅烧钱：2024 年年报披露经营亏损 DKK 152.0M、净亏损 DKK 151.7M。按最新 €1.5B 估值，Flatpay
              约为预期 2025 年收入的 12x。这是类似 Adyen 的倍数，却没有类似 Adyen 的盈利能力、规模或披露质量。因此，我们的建议是观察，置信度中等，风险高，估值立场偏高。新资金在估值低于约
              €1.1-1.2B 时更有吸引力；或者，经审计的 2025-2026 年数据验证收入运行率超过 ~€250M，且毛利转化明显改善。
