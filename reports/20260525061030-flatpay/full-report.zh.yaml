            body: >-
              Flatpay 的市场进入动作有意保持劳动密集。官方页面和 TechCrunch 描述了线下面谈、即时演示、上门安装和 24/7
              支持；管理层明确称，这种提箱销售模式比纯数字同行获客成本更高，但能让不喜欢不透明商户账单的中小企业更快采用。公开增长真实存在——2024 年文件中有 17k 客户，2025 年底报道约 60k 商户，当前网站为
              70k 商户——但经济性仍然混合。2024 年文件显示，毛利 DKK11.96m，对应员工成本 DKK151.21m、物业厂房设备 DKK81.04m，以及融资前现金消耗
              DKK190.24m，因此当前经营杠杆还看不出来。隐含每商户收入和每员工收入对一个软件叙事来说偏低，更符合收单加服务模型，而不是纯 SaaS
              利润率画像。换句话说，公开证据支持强需求创造，但尚未证明每新增一个商户都能被低成本服务。
