  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 价值区间
      - 关键风险 / 信号
      - 决策含义
    rows:
      - - 乐观
        - €350-400M 收入运行率或 ARR，多国执行强，亏损收敛明显改善，公私市场愿意按约 6-7x 远期收入定价。
        - €1.8-2.4B
        - 管理层的 2026 年雄心必须转化为经审计规模，而不是销售故事的表象。
        - 上行空间存在，但取决于尚未经审计的激进执行。
      - - 基准
        - €220-250M 收入运行率，增长从超高速降到只是强劲，利润率确有改善但尚不完整。
        - €1.1-1.4B
        - 最符合当前公开证据和可比公司估值正常化。
        - 略低于上一轮；支持观察而非买入。
      - - 悲观
        - 增长大幅放缓，CAC 仍重，市场给 Flatpay 的定价更接近广义支付处理商，而不是 Adyen。
        - €0.6-0.9B
        - 2026 年规模任何落空，或单位经济性疲弱的证据，都会迅速把情景推到这里。
        - 相比上一轮有明显下行。
    notes: 区间是基于情景的企业价值代理，来自公开可比公司区间和管理层指引规模，而不是贴现现金流模型。
