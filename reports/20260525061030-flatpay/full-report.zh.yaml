      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 从现金迁移到数字支付
        - 正向
        - 当前至中期
        - 扩大商户受理池，并让电子结账常态化
        - 拆分 Flatpay 在现金占比较高扩张市场的赢单率
      - - 非接触和钱包普及
        - 正向
        - 当前
        - 提升结账便利性，让终端主导的受理仍然有用
        - 按 Flatpay 国家和垂直行业衡量钱包占比
      - - SoftPOS 和终端更新周期
        - 正向
        - 2026-2031
        - 增加端点数量，提升商户重新考虑旧硬件的意愿
        - 跟踪 Flatpay 是否参与 SoftPOS，还是只做专用终端
      - - 即时支付铺开和新支付轨道
        - 正负并存
        - 2025-2027
        - 可能扩大竞争、降低对传统卡组织轨道的依赖，但也可能压低抽佣率
        - 索取 Flatpay 即时支付受理和结算路线图
      - - 费用栈不透明与价格干预副作用
        - 负向
        - 当前
        - 即便交换费封顶，商户感知到的总成本仍然复杂
        - 按细分索取相较前任收单方的商户节省证明
      - - 国家碎片化和高接触销售模式
        - 负向
        - 当前至中期
        - 本地支付方式、基础设施差异和现场安装会拖慢规模化扩张
        - 按国家索取 CAC、回本期、流失率和实施周期数据
    notes: 这张表把需求侧增长驱动和变现摩擦放在一起，因为市场增长不会自动转化为有吸引力的单位经济性。
