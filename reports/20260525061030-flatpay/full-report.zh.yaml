      - number: '8.2'
        title: 融资背景、价格支撑与可比公司
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的融资背景方向上有支撑，但仍不完整。最新一轮有较强佐证：AVP 和 Smash Capital 领投，Dawn Capital 继续参与，以 €1.5B 估值融资
              €145M。超过这个头部信息后，记录开始混乱。Tracxn 与 CB Insights
              对累计融资额存在实质差异，公开来源没有披露完全稀释后的股权结构表、优先股堆叠或真正决定下行回报的反稀释条款。年报还显示，截至年末存在有意义的外部资本依赖，包括逾期缴纳资本，进一步说明这仍是一个消耗资本的增长故事，而不是自我供血的处理商。


              在公开价格支撑上，关键比较对象不是泛 fintech 篮子，而是商户收单和支付处理商。Adyen 是高端标尺，约 11.3x 收入；Toast、Shift4、Nexi、PayPal 和 Global
              Payments 大致集中在 0.7x 到 2.4x 收入。也就是说，Flatpay 当前 2025 年收入 12x 的估值，只能靠高增长预期解释。私募和 M&A 参照更均衡：SumUp 在 2022 年的
              €8B 融资以及 2026 年再度传出的 IPO 讨论，说明当安装基础和运营成熟度更强时，规模化 SMB 支付领导者可以拿到什么水平；Worldpay 以 $24.25B 出售、对应 8.5x 调整后
              EBITDA，则说明战略买家仍会为商户收单里的规模、软件宽度和协同付费。按今天的公开证据，Flatpay 最新一轮只有在 2026 年执行更接近区间高端、而不是更宽泛的公开市场带时，才站得住。
