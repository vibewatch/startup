        - 分析师 / 新闻来源讨论了营运资本垫款、卡或账户
        - 按融资产品或账户计费
        - 路线图 / 分析师报道，尚非官方披露收入的已变现产品
        - 低 — 可选空间存在，但不能纳入承保
        - 确认 Flatpay Capital 或银行产品是否已上线、产生收入且具备重要性
    notes: 官方页面和法律条款能确认产品表面和标价，但没有披露按收入来源划分的收入结构、净抽佣率，或总额到净额的确认方式。
