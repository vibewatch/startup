      - number: '4.4'
        title: 公开缺口、收入质量判断与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开可见度仍然太薄，无法干净承销。合同条款显示，收入质量在结构上好于贷款方或资金沉淀模型，因为合作收单方收取费用并执行打款；但同一结构也隐藏了 Flatpay
              的实际收入分成和毛利率。评测来源方向上积极，但并不干净：Trustpilot
              情绪强劲，但英国评测者仍提到打款时点、支持不稳定、激进销售接触、低使用量罚金、更换成本和附加费机制，这些都让「无隐藏费用」信息更复杂。数据库式摘要也在累计融资和规模上相互不一致，如果直接拿来做估值倍数计算，噪音会很大。净结果是，一个可信、融资充足、拥有真实中小商户需求的增长故事，但披露数据不足以证明利润率耐久、流失质量，或
              €1.5bn 估值究竟建立在高效经济性上，还是持续由资本驱动的扩张上。因此结论是：需求和资本方面建设性，但在管理层打开队列、抽成率和利润率账本前，对收入质量保持谨慎。
