  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线与商户工作流
        blocks:
          - type: paragraph
            body: >-
              Flatpay
              自己的网站把公司呈现为三段式商户堆栈：支付终端、销售点系统和在线支付。产品承诺不只是更便宜的收单，而是一套完整商户工作流：从线下面谈开始，经过方案选择，最后上门安装硬件和软件。定价被定位为固定费率、易懂，并分别提供终端、POS
              和在线支付经济性。在这个伞形结构下，公开模块地图相当清楚。终端产品聚焦快速银行卡受理和自动报表；POS
              产品增加库存、商品管理、餐厅功能和更丰富的运营控制；客户门户承担报表和配置后台；会计集成同步打款和营业额数据；电商层通过 Frisbii 等合作方 / 提供商连接
              Shopify。独立评测和商户评论大体印证了同样形态：上线高接触，硬件预配置到货，最强客户价值主张是让小商户更简单，而不是定制化开发者能力。
