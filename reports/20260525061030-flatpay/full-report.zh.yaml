      - number: '6.4'
        title: 留存、扩张、集中度与风险
        blocks:
          - type: paragraph
            body: >-
              公开记录里，耐久性仍是最大的未解问题。已核查的官方页面、客户故事和 2025 年末增长报道，都没有披露 NRR、GRR、logo 流失、合同期限或队列留存。最好的公开耐久性代理指标都很间接：2024 到 2025
              年商户数大幅增长，2026 年网站又用更高口径对外营销；Flatpay 继续为现有商户投入 Capital
              和在线支付；评论聚合整体仍偏正面，虽然投诉尾部可以量化。上述信号指向一定粘性，但不能替代已披露的留存数据。


              扩张逻辑比留存数学更容易看清。Flatpay 可以把商户从单独终端推进到 POS，再推进到电商，最终进入 Flatpay Capital，从而扩大钱包份额。公司还为年营业额超过 €200,000
              的商户采用定制定价，给销售团队留下理由，把较大商户放在谈判路径上，而不是套用一刀切的 SMB
              费率。话虽如此，集中度风险仍难量化。德国看起来是最大市场；意大利已经是一个体量较大、酒店餐饮占比高的安装基础；公开证据又集中在餐饮、美业和专门零售。最大客户、国家和行业集中度的精确数据都未披露。


              反向证据存在，但有限。TradersUnion 基于 Trustpilot 数据的快照显示，2026 年 5 月 25 日共有 2,304 条评论、综合评分 4.5/5、一星占比
              7.64%——足以说明投诉确实存在，即使总评分仍强。此次尽调中，直接查看 Trustpilot 被反机器人保护拦截，削弱了对原始评论文本新鲜度的验证。更大的战略风险不是可见流失，而是渠道依赖：Flatpay
              靠地推销售和上门安装提升 SMB 转化，但扩张速度受限于本地商务团队的招聘、培训和支持能力。
