      - number: '3.2'
        title: 能力、定价与市场进入对比
        blocks:
          - type: paragraph
            body: >-
              能力和定价对比把市场分成两组。直接读卡器组主要在费用透明度、硬件可负担性、打款速度和安装便利性上竞争。Flatpay 当前公开材料在这条轴线上很激进：欧元页面仍展示 0.99%，英国 POS
              页面在营业额门槛以下展示 1.69%，多个 Flatpay 页面反复承诺零月费或零租金。SumUp 和 Zettle 用更便宜或同样便宜的硬件、固定费率简单性和账户绑定打款工具回应；myPOS
              则更强调即时清算和商户账户功能打包。平台组竞争方式不同。Stripe 和 Adyen 强调 API、终端机队管理、Tap to Pay，以及面向更复杂商户的统一商务。Shopify 和 Lightspeed
              卖的是支付本身周边的操作系统：全渠道工作流、库存、报表、客户档案、电商和多门店控制。因此，Flatpay
              在销售点可能显得更便宜、更简单，但当商户真正购买的是软件广度时，它仍会偏弱。这也意味着公开包装需要仔细阅读：一份 2026 年独立评测对 Flatpay 租赁经济性的描述不同于 Flatpay
              自己页面，所以投资人应把当前标价视为方向性支持，而不是合同级证据。
