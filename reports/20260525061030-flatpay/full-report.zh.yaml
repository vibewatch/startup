      - number: '7.2'
        title: 监管、法律与合同边界
        blocks:
          - type: paragraph
            body: >-
              Flatpay 公开材料里最重要的法律事实，是公司没有说自己处理银行卡交易。相反，英国条款和代理协议描述的是一种结构：商户被接入 Flatpay 指定的独立收单合同，设置中嵌入授权书以及 KYC /
              数据共享流程。这个安排商业效率高，但投资人只能部分看见每个市场里的真实收单对手方、切换权和受监管实体边界。合同条款对商户也很严：PCI 失败、把交易量导出 Flatpay
              栈之外，或其他重大违约，都可能触发立即终止；初始期限为 36 个月；合作伙伴终止还可能传导为商户终止。再叠加附加费和 DCC 功能——合规负担落在商户身上，却依赖合作伙伴 BIN
              列表、收单机构批准和卡组织规则——法律姿态就不再是后台文书，而是真正的运营风险。剩下的问题不是 Flatpay 有没有合同；它有。未解的问题是，它的合作伙伴与合规架构是否足够稳，能否在多个市场和产品上干净扩张。
