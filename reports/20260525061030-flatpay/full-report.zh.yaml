      - number: '3.3'
        title: 切换成本、分销与信任姿态
        blocks:
          - type: paragraph
            body: >-
              分销力量和切换动态，是竞争对 Flatpay 不那么友好的地方。公司自己的英国 POS 流程仍依赖个性化讲解、定制报价和上门安装。对于不信任隐藏费用、希望有人解释的小商户，这可以帮助转化，也与
              SumUp、Zettle 和 myPOS
              主要自助上线形成有意义的对比。但服务密集型销售不等于持久锁定。简单银行卡受理的切换成本仍只是中等，因为商户可以更换读卡器、打款账户和费率结构，不必拆掉完整运营堆栈。只有在商户采用库存工作流、电商集成、客户档案、分析或
              API 之后，经济性才更黏。这正是 Shopify、Lightspeed、Stripe 和 Adyen 获得杠杆的地方。独立对比来源还显示，PayPal 关联、FCA 授权或规模很大的既有提供商，其信任姿态比
              Flatpay 自身逐市场监管版图更容易核验。最后，TSG 的欧洲收单排名凸显了规模不对称：前五大处理商仍控制很大市场份额，拥有百万级以上商户的是远大于 Flatpay 的既有机构和平台。
