  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 这张旅程图展示 Flatpay 的客户生命周期：商户发现 Flatpay、线下销售、安装、日常运营，再到多产品扩张。
    data:
      nodes:
        - id: discover
          label: 发现
          note: 商户经由本地销售触达、转介绍，或透明定价带来的市场曝光认识 Flatpay。
        - id: demo
          label: 线下演示
          note: 销售代表面见店主，解释统一费率，并现场展示终端或 POS。
        - id: install
          label: 现场上线
          note: Flatpay 为商户安装硬件和软件，不让商户纯自助完成配置。
        - id: operate
          label: 日常使用
          note: 商户在日常使用中跑通到店卡支付结账、小费、桌台视图、报表或网店收款。
        - id: expand
          label: 扩张
          note: 需求增长后，商户加购 POS、在线支付或 Flatpay Capital。
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU011
      - CU012
      - CU039
      - CU043
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 这张流程图说明 Flatpay 如何靠重线下销售的部署路径，把本地商户从首次接触转化为已安装的多产品账户。
    data:
      nodes:
        - id: prospect
          label: SMB 潜在客户
          note: 小商户被不透明的传统定价，或割裂的 POS / 收单配置困扰。
        - id: meeting
          label: 面对面报价
          note: Flatpay 与商户面谈，用简单经济账解释定价。
        - id: decision
          label: 方案选择
          note: 商户按工作流复杂度选择终端、POS 或在线支付。
        - id: deployment
          label: 安装
          note: 硬件、软件和配置现场安装，降低采用阻力。
        - id: usage
          label: 活跃使用
          note: 商户在日常经营中跑现场支付、小费、仪表盘和报表。
        - id: walletshare
          label: 产品扩张
          note: 运营信任建立后，商户可以叠加电商收款或 Flatpay Capital。
      edges:
        - from: prospect
          to: meeting
          label: 直接销售触达
        - from: meeting
          to: decision
          label: 定价 + 演示
        - from: decision
          to: deployment
          label: 签约入驻
        - from: deployment
          to: usage
          label: 上线
        - from: usage
          to: walletshare
          label: 叠加更多产品
    claimRefs:
      - CU008
      - CU009
      - CU011
      - CU012
      - CU032
      - CU038
      - CU039
      - CU040
