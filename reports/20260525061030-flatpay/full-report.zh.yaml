      - number: '8.4'
        title: 退出准备度、尽调要求与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              按现有信息，Flatpay 看起来还没有准备好进入公开市场流程。公司收入线动能强，但公开证据仍缺少决定后期投资人能否真正赚到有吸引力回报的要件：经审计的 2025 年合并账目、队列级留存、抽佣率稳定性、CAC
              回本、欺诈和拒付损失披露，以及完全稀释后的优先权瀑布。换句话说，尽调负担不是表面工作。它直接决定最新一轮到底是通往高溢价退出的桥，还是一次高速增长但仍不透明的融资。


              因此，最可能的近期退出路径不是短期 IPO，而是另一轮后期私募融资或二级流动性事件。在支付溢价之前，投资人应要求经审计的 2025 年结果、2026
              年月度交易数据、完整股权结构表，以及逐市场单位经济模型。主要投资逻辑破裂触发点也很直接：经审计收入或运行率显著低于最新一轮内嵌的增长路径；商户增长转化为毛利和收窄亏损的能力持续偏弱；或下一轮以低于上一轮的价格重定价，或引入惩罚性优先权条款。一旦这些触发点出现，当前增长故事就不再是高端倍数案例，而会变成预期重构。
