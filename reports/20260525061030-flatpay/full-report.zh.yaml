  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 提供商或类别
      - 公开定价信号
      - 硬件 / 套餐信号
      - 打款或账户模式
      - 合同模式
      - 含义
    rows:
      - - Flatpay（欧元页面）
        - 年营业额低于 €200k 时 0.99%；无隐藏费用；宣传每日打款
        - 定价页称 €0 起步；支付终端页称 0 kr 租金、无订阅
        - 官网页面宣传每日或工作日结算
        - 官网把方案包装为免订阅、透明
        - 对正在比较收单对账单的小商户，简单性信息非常锋利
      - - Flatpay（英国 POS 页面）
        - 年营业额低于 £200k 时 1.69%，月费 £0；超过门槛定制费率
        - Pro Kit £1,495、Premium Kit £2,495，含入驻和安装
        - 商户门户和安装主导上线；POS 页面未说明英国确切结算节奏
        - 销售辅助设置，配定制报价
        - 支持餐厅和更完整 POS 用例，但看起来比读卡器同行更不自助
      - - SumUp
        - 读卡器硬件 £14 至 £99；标准同行对比显示线下 1.69%，可选更低费率套餐
        - Tap to Pay + 读卡器 + 账户捆绑
        - 通过 SumUp 商务账户次日打款和即时转账
        - 轻合同、自助
        - 定价清晰不是 Flatpay 独有；SumUp 还叠加银行深度和装机规模
      - - PayPal POS / Zettle
        - 读卡器 £29 起，终端 £149 起；独立对比引用线下 1.75%
        - 小型读卡器、终端、应用、Tap to Pay
        - 款项通常很快进入 PayPal 余额，一到两个工作日进银行
        - 官网定价页称无长期承诺或租赁
        - 信任和 PayPal 生态强，但不明显比 Flatpay 或 SumUp 便宜
      - - myPOS
        - 门槛以下 1.10% + £0.07 起；月费 £0；门槛以上特殊费率
        - 硬件 £29 至 £229，含账户
        - 约 3 秒即时结算到商户账户
        - 主要按用量付费，可按适用性选择租赁
        - 对看重即时流动性胜过纯统一百分比的商户，很有竞争力
      - - Shopify / Lightspeed 软件套件
        - Shopify POS Pro 每门店每月 $89；Lightspeed 定价不一，可能加收服务费
        - 订阅软件经济性是捆绑核心
        - 支付集成在更广的零售运营栈里
        - 基于套餐和服务，而不是简单单一费率收卡
        - 当软件广度比表面 MDR 更重要时，这类平台胜出
      - - Stripe / Adyen 开发者平台
        - 以定制或专属定价为主；Stripe 还列出启用读卡器每月 $10 蜂窝网络费
        - API 主导的硬件和终端机群管理
        - 统一报表和平台工具比简单打款营销更重要
        - 商业协议或定制定价常见
        - 商户需要工程灵活性或多市场规模后，这些方案就是可信替代品
    notes: 所有数字都是公开标价或公开打包信号，不是实际有效抽佣率。Flatpay 行有意拆分欧元计价页面和英国 POS 页面，因为保留的公开来源没有呈现一套完全一致的商业套餐。
