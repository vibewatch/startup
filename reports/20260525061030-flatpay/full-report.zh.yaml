      - number: '2.2'
        title: 用不可叠加的镜头测算市场
        blocks:
          - type: paragraph
            body: >-
              测算 Flatpay
              市场最干净的方法，是从多个公开镜头出发，并把它们分开。欧洲广义支付市场预测可作为上限指标，说明数字支付活动扩张很快，但这些万亿美元数字衡量的是支付金额，不是收单机构或终端导向运营商真正能赚到的钱。商户收单报告更接近费用池经济性，但它是全球口径，也仍然不专指欧洲中小企业销售点这条楔子。终端市场预测又是另一回事：它衡量的是受理终端装机版图和硬件换新周期，而不是费用收入。与这些镜头相对的，是实际买家基础：欧洲中小企业数量庞大，贸易密集型小企业尤其重要，因为它们接受银行卡、交易频次高，对支付摩擦也很敏感。结论清晰，限制同样清晰：Flatpay
              指向一个庞大且增长中的市场，但没有更多公司层面的活跃商户、交易量、国家和垂直结构数据，公开资料无法隔离出可防守的欧洲中小企业 SAM 或 SOM。
