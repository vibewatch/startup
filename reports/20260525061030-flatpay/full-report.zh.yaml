      - number: '1.4'
        title: 规模信号、里程碑节奏与未决风险
        blocks:
          - type: paragraph
            body: >-
              公司概况里最强的证据是 Flatpay 的运营节奏。合作叙事把市场上线放在 2022 年夏季，并记录到 2023 年 9 月已有 2,500 多名客户。经审计的 2024 年年报随后显示客户数
              17,000、同比增长 300%，业务覆盖丹麦、芬兰、德国和意大利，并有法国分支注册用于 2025 年活动。2025 年底报道把规模故事又推远很多：约 60,000 名客户、10 月跨过约 €100M
              ARR、2025 年预期收入约 €125M、全球员工约 1,400-1,500 人。当前关于页面又把前沿数字推到 70,000 家商户。无论选择哪个精确公开数字，方向性结论都一样：Flatpay
              从早期商业化走到泛欧洲规模，速度异常快。

              未决风险比传统丑闻更微妙，但仍然重要。第一，员工数和客户数会随口径和日期变化：来自登记信息的法人实体员工数远低于全球媒体数字，当前商户说法也已从 60,000 增至
              70,000。第二，公司的监管姿态只能间接看见。公开证据显示，Flatpay 最初依赖持牌合作方 Finaro，而不是公开展示自己的独立许可组合。第三，独立评论总体建设性，但并非毫无保留。Trustpilot
              情绪强劲，但独立评测者提醒，固定费率定价可能不适合交易量更高的商户，退款、拒付、合同和在线流程条款仍需仔细核验。换句话说，Flatpay
              的核心业务看起来真实且增长很快，但后续尽调应聚焦许可、股权结构精度，以及随着公司继续扩张，人力密集型销售和支持模型到底有多耐久。
