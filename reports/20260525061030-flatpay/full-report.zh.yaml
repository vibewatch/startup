      - 评估
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 继续跟踪公司，但证据更充分前不要追最后披露价。
      - - 信心
        - 中
        - 商业牵引真实存在；估值支撑仍过度依赖远期目标。
      - - 风险评级
        - 高
        - 执行、CAC、披露和融资风险仍处高位。
      - - 估值立场
        - €1.5B 偏高
        - 当前轮要站得住，需要 2026 年执行落地，或用高溢价可比公司视角解释。
      - - 当前价格支撑
        - 有条件
        - 只有 Flatpay 拿出强得多的 2026 年收入证据、撑起类似 Adyen 的倍数，这个估值标记才有支撑。
      - - 入场纪律
        - 倾向 ≤ €1.1-1.2B 或更强证据
        - 更低入场价，或经审计的 2025/2026 年数据，会明显改善风险 / 回报。
      - - 可能下一步
        - 继续研究 / 等待尽调
        - 建模前要求经审计 2025 年账目、股权结构表和队列经济性。
    notes: 建议对价格敏感：如果经审计收入追上来，或入场价重置，同一家公司的估值可从偏高变为合理。
