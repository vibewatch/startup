  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 单位
      - 当前数值 / 状态
      - 收入质量
      - 尽调要求
    rows:
      - - 有卡终端收单
        - 对终端交易收取固定费率，并捆绑硬件 / 支持
        - 处理刷卡流水百分比
        - 年刷卡流水低于 €200k 为 0.99%；高于门槛则定制
        - 中 — 商户标价清晰，但 Flatpay 净收入分成未披露
        - 按市场披露总额与净额抽佣率、收单方收入分成
      - - POS 交易
        - 固定支付费率加 POS 软件 / 硬件套件
        - 处理流水百分比 + 前期套件费
        - 年刷卡流水低于 €200k 为 1.49%；Basic/Premium 套件单列
        - 中 — 经常性使用场景存在，但硬件和支持经济模型不透明
        - 按 POS 档位披露附加率、硬件毛利率和商户 ARPU
      - - 线上支付
        - 线上受理、网关和基于插件的结账
        - 可能按线上支付额百分比
        - 官方网站确认产品存在，但保留的一手来源中未找到官方公开线上费率
        - 低 — 收入来源存在可见，但经济模型不可见
        - 提供线上抽佣率、拒付成本和总收入占比
      - - 附加服务和集成
        - 小票纸、收银机设置、部分插件和可选增值项单独计费
        - 按附加项或按集成计费
        - 条款称部分集成 / 插件和增值项可单独收费
        - 低 — 辅助收入可能存在，但公开贡献未披露
        - 展示年度非交易收入和增值项附加率
      - - 低使用量和附加费经济模型
        - 月度低使用费，以及收单方对合格卡定义的附加费
        - 按低使用解决方案 / 按合格交易
        - 英国低于门槛的每套方案收 £39；丹麦低于门槛的每套方案收 DKK399；附加费取决于收单方协议
