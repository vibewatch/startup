        blocks:
          - type: paragraph
            body: >-
              资本充足是公开财务故事中最强的一部分。2024 年年报显示年末现金 DKK107.69m、欠缴出资 DKK436.88m，管理层称 2024 年 12 月 DKK437m 融资已在 2025 年 1
              月释放。同一文件的 Proff regnskab 摘要还显示流动资产 DKK556.77m，其中包括其他应收款
              DKK441.91m，说明年末流动性不只靠现金，也由大额营运资本余额支撑。另有投资人和媒体来源称，Flatpay 2025 年 11 月又以 €1.5bn 估值融资
              €145m，用于扩展现有市场、进入新市场并积极招聘。按粗略历史烧钱速度，年末现金本身只能覆盖数月，但现金加已承诺股权资金意味着现金跑道明显更长；后续 2025
              年融资又把下一轮依赖向后推。限制在于，没有公开来源披露当前现金、董事会批准的烧钱目标，或最新融资后销售招聘、产品投入、设备融资和营运资本支持之间的精确拆分。债务和租赁义务可见，但相对于股权不大，因此偿付风险看起来低于披露风险。
