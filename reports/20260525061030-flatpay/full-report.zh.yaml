      - number: '2.4'
        title: 增长驱动、采用约束与保留缺口
        blocks:
          - type: paragraph
            body: >-
              市场顺风真实存在。银行卡已经主导欧洲零售支付，数字支付金额大幅扩张，非接触使用成为主流，分析师预计终端基础设施和更广义支付流都会持续增长到 2031 年。Flatpay
              的本土市场丹麦尤其数字化成熟，这降低了消费者行为摩擦，也让商户切换经济性比基础受理教育更重要。监管也在扩大竞争集合：即时支付正从政策意图进入实施，钱包和账户到账户支付轨道也继续提高相关性。但同样的力量也带来约束。商户经济性由分层费用堆栈决定，而不只是表面交换费；公共监管机构仍看到价格干预和开放银行方面的缺口；欧洲仍按国家支付方式和基础设施所有权分裂。Flatpay
              自己的模型又增加一个警示信号：线下销售和安装可能帮助转化，但也会抬高服务成本。本章因此保留两个未解决缺口：公开来源没有按国家和商户规模段标准化 SAM/SOM，公开数据也没有展示 Flatpay 的
              CAC、流失率或按地域划分的商户结构。
