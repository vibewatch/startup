      - number: '7.4'
        title: 财务模型与团队执行风险
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的模型风险格外显眼，因为公司选择了一个商户容易理解的价值主张，同时仍靠劳动密集型获客动作扩张。新闻报道显示，2025 年融资后公司仍未盈利，尽管 ARR
              正在快速加速；公开法定档案显示，实体层面亏损显著，合并收入能见度又只有一部分。这并不否定一家高速增长的金融科技公司，但意味着投资人在承销尚未由公开文件证明的经营杠杆。定价模型同样关键。0.99%
              的标价有吸引力，但随着卡种组合在非 EU 卡、商业卡、附加费例外、交换费上限和合作伙伴佣金之间变化，利润率压力可能在商户界面之外累积。人员风险又放大了模型风险。Flatpay
              自有和第三方材料都描述了直接、面对面的销售动作以及非常庞大的计划员工基数；与此同时，英国市场仍相对较新，合规范围已经覆盖支付、数据、AML
              和商户融资。结果是一种典型规模化扩张张力：强增长会遮住控制深度不足，直到公司一次性管理太多市场、产品和合作伙伴。
