  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Flatpay 方案
      - 可衡量收益
      - 限制
    rows:
      - - 让新商户上线
        - 比价、注册、等待硬件，再手动配置设备
        - 面对面会谈、方案选择、预配置硬件和现场安装
        - 上线更快，本地配置工作更少
        - 商户仍依赖 Flatpay 主导的入驻，而不是完全自助配置
      - - 处理柜台刷卡收款
        - 独立读卡器加手工对账
        - 终端套餐，含统一费率定价、自动报表和门户可见性
        - 收单经济模型更简单，日终手工工作更少
        - 公开文档没有完整说明 MOTO / 电话支付范围
      - - 运营餐厅桌台服务
        - 独立桌台应用、打印机逻辑和支付终端
        - POS 具备桌台视图、分账流程、外带模式、厨房打印机和 mPOS 桌台同步
        - 点单与支付之间的工作流交接更少
        - Flatpay 已公开产品面之外的餐饮专用集成未被公开逐项列出
      - - 日结并查看经营表现
        - 手工结算表和临时导出
        - Z 报告、X 报告、收银员报告、收据历史和可下载门户报告
        - 跨商户和终端统一了每日控制闭环
        - 报告延迟或导出留存窗口没有公开基准
      - - 对账结算款和记账
        - 手动导入会计软件
        - 连接器夜间同步收入、费用、结算款和报告附件
