  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Flatpay 公开可见的客户基础集中在中小商户，而不是大型企业。公司当前主页、定价页、产品页和 2025 年底融资报道都使用同一定位：简单固定费率银行卡受理、无隐藏费用、每日打款、24/7
              支持，以及为想要更简单替代传统 POS 和收单配置的商户提供上手安装。按买方、用户、付款方划分，买方通常是本地商户业务的老板或经营者，用户是操作终端或 POS
              的收银员、前厅或门店员工，付款方则是按每笔交易费付费的商户实体。


              具名商户证据集显示 Flatpay 最强的位置。酒店餐饮和食品服务占主导：Burger Palace、Sokkelund、SMURT 和 Trattoria La Bruschetta 都在餐厅或外卖场景使用
              Flatpay，这些场景重视快速线下刷卡结账、小费或桌台管理。美容和服务业是另一条可见楔子，Avenique 和 Mucini 提供了证据；特色零售则通过 Sif Jakobs Jewellery 和 Stilk
              Copenhagen 出现。这些证据与公司自己的垂直行业卡片（肉铺、快休闲、咖啡店、酒吧、渔业和市集、花店）一致，也与 2025 年底意大利报道相符：报道称 Flatpay 的 18,000
              名意大利客户中，超过一半经营食品和饮料业务。


              地理上，当前网站为丹麦、德国、芬兰、意大利、法国、英国和荷兰提供本地化页面，而 2025
              年底报道仍称公司覆盖六个国家。两者结合，说明一个北欧中小商户支付整合型扩张正在推进；德国已经是独立报道中最大的市场，荷兰则很可能是截至本次报告日期最新对外展示的市场。规模分层也能从定价中看见：Flatpay
              用零订阅定价自助服务长尾商户，但对年银行卡交易额超过 €200,000 的商户标注定制费率，显示出一条有意进入高交易量中小商户和低端中型市场账户的升级路径。
