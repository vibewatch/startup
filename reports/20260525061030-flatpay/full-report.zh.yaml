      - number: '5.4'
        title: 差异化、信任与控制缺口
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开差异化在运营层，而不纯在技术层。Flatpay 的固定费率定价、线下安装、共享门户、夜间会计导出和 24/7
              支持，组成了一套直指小商户的方案，目标是简化商业运营。在餐厅和本地零售等场景中，硬件、桌台、打款和记账必须协同工作，这可以成为相对自助提供商的真实护城河。信任和合规证据则更混合。Flatpay
              发布了法律中心、隐私页面和条款页面；帮助中心记录员工权限、退款控制、门户协议和会计校验；底层 PAX 终端在设备层面持有 PCI PTS
              认证。但保留下来的公开材料没有暴露专门的信任中心或状态中心、正式可用性承诺、公开服务商合规包，或深度公开 API /
              安全文档。独立商户反馈也并非一致正面：一个有记录的投诉称，终端无法支持电话付款，而且这一限制在上线时没有讲清楚。结果是，产品看起来运营成熟，但要做完整技术尽调，披露仍然不足。
