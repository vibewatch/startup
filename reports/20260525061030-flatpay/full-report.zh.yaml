chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >-
              最适合理解 Flatpay 的方式，是把它看作一家丹麦中小商户支付挑战者，核心主张异常简单：固定费率收单，加上一套商户服务体验，把上线和定价摩擦降下来。公司和投资人材料里的商业起点基本一致：创始人称他们 2022
              年在哥本哈根起步，目标是为中小商户提供透明的支付服务。法律文件补上了关键细节。经审计的 2024 年年报和来自登记信息的资料显示，FLATPAY ApS 作为法律实体成立于 2021 年底，CVR
              42718033，注册地址在 Herlev。因此正确理解框架是「2022 年商业上线，2021 年底法律注册」。这个区分重要，因为后续尽调应把哥本哈根叙事视为获客起点，而 Herlev
              和丹麦实体文件才是正式法律锚点。

              产品范围已经不止一个银行卡终端。当前官方页面展示支付终端、POS 系统和在线支付，商户支持材料则强调每日打款、上门安装和 24/7 支持。固定费率定价仍是 Flatpay
              的核心切入点：公司仍主打易懂费用、无安装费或订阅费，而不是更复杂的收单价目表。这种清晰度解释了为什么后续报道反复把 Flatpay
              写成「让商户更简单」的故事，而不是功能堆叠故事。地理扩张也很快。公开证据显示，公司 2024 年覆盖丹麦、芬兰和德国，2025 年底已进入六个欧洲市场；当前关于页面称商户超过 70,000 家，预计刷卡次数超过
              1 亿次。因此，Flatpay 目前的公开身份，是一家创始人主导、泛欧洲、销售和服务导向很强的中小商户支付平台，而不只是丹麦本地终端卖家。
