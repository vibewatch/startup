      - number: '5.2'
        title: 运营模型、硬件、软件与集成
        blocks:
          - type: paragraph
            body: >-
              可见运营模型远比隐藏后端容易核验。Flatpay 对面向商户的硬件、软件和支持表面披露相当详细：终端产品以 PAX 920Pro 为核心；更广硬件阵容还点名 CPOS X5、Tab M10
              Plus、打印机、钱箱和扫描仪；POS 层增加桌台管理、厨房打印等餐厅工作流；门户层为终端和 POS 商户处理交易、打款、员工、报表、设备和门店设置。支持文档展示了跨表面的数据流：Z
              报表同步进门户，会计连接器隔夜推送收入和打款数据，Shopify 设置使用 Flatpay 签发的 API 密钥和合作支付提供商。公开开发者信号很窄但真实。一则当前 DevOps 招聘指向
              AWS、ECS、RDS、IoT、VPC、GitHub Actions、Terraform、Docker、New Relic
              和值班轮值。这足以推断其有现代云加设备运营堆栈，但不足以仅凭公开证据承销服务拓扑、数据隔离、认证设计或开发者平台质量。
