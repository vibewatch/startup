  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 商户价值主张
        - 固定费率、每日打款、24/7 支持和安装服务，让中小商户更容易采用 Flatpay。
        - 同样的重服务模式，相比自助式同业，规模化成本可能更高。
        - 按国家展示队列回本周期和支持成本杠杆。
      - - 增长证据
        - 商户数和 2025 年收入指引显示采用速度很快。
        - 公开证据仍偏向管理层说法，而不是经审计的 2025 年结果。
        - 发布经审计的 2025 年收入、毛利和流失数据。
      - - 可比公司支撑
        - 类似 Adyen 的高溢价倍数说明，支付平台执行足够强时可以拿到高价格。
        - 更广泛的多数上市同业交易倍数远低于 Flatpay 隐含倍数。
        - 证明高溢价增长叠加经济性改善，而不只是客户数增长。
      - - 融资背景
        - 顶级投资方继续大规模出资支持公司。
        - 公开来源仍无法看清累计融资总额和优先权条款。
        - 在 NDA 下提供完整股权结构表和条款摘要。
      - - 退出路径
        - 如果规模和利润率快速改善，公司可能再融一轮大型私募，或之后 IPO。
        - 以当前公开证据看，近期 IPO 准备度尚未成立。
        - 展示经审计的 2025 年数据、市场级单位经济性和治理成熟度。
    notes: 反向逻辑是结构性的，不是生死问题：业务仍可能很强，但价格要求过高。
