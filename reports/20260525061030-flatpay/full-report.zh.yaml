      - number: '3.4'
        title: 护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的护城河真实存在，但比一个简单的独角兽标签窄。保留下来的证据里，最清楚的差异化是透明定价叠加高接触服务：Flatpay
              反复营销固定费率、零隐藏费用和上门帮助，新闻报道也说明面向商户的销售执行是增长核心。面对传统收单机构，这是一条有用楔子；对于想要有人安装和解释系统的商户，它也是自助读卡器之外的实际替代方案。问题在于，这条楔子容易理解，部分也容易模仿。直接同行已经在透明、轻合同定价上竞争。SumUp
              和 myPOS 把支付与商业账户、打款工具打包。Zettle 带来 PayPal 的信任伞。Shopify 和 Lightspeed 拥有更广的零售软件，Stripe 和 Adyen
              拥有开发者和企业灵活性。Flagship 的研究是最重要的反向信号：欧洲 PSP 正在购买商业软件，因为独立支付服务正在融入打包式商户操作系统。如果这个行业方向成立，Flatpay
              的定价清晰度仍有用，但仅靠这一点不足以保证持久份额或更高利润率。因此，尽调负担转向留存、附加销售和赢单 / 输单证据，而这些公开材料仍未披露。
