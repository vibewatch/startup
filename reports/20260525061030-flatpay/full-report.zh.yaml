  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手或替代方案
      - 类别
      - 规模 / 融资信号
      - 目标细分
      - 定价或 GTM 姿态
      - 关键差异化
      - 相对 Flatpay 的限制或反之
    rows:
      - - Flatpay
        - 直面 SMB 的收单方 + POS 挑战者
        - 官网：70,000+ 商户、1,300+ 员工；2025 年末新闻：60,000+ 客户，€145M Series C，估值约 €1.5B
        - 欧洲零售、餐饮酒旅和服务业 SMB
        - 高接触销售，真人讲解、现场安装、统一费率定价
        - 透明定价、本地安装、24/7 支持、每日或工作日结算
        - 公开规模仍远低于百万商户级在位者，不同来源的具体打包口径也不一致
      - - SumUp
        - 直接按用量付费同行
        - 4M 家企业，覆盖 37 个国家
        - 想快速开通的微型和小型商户
        - 自助开通、手机优先、低价硬件、商务账户加售
        - 装机基数大、硬件便宜，捆绑银行和打款能力
        - 软件深度不如完整商户运营套件；统一费率仍可被挑战
      - - PayPal POS / Zettle
        - 直接按用量付费同行
        - 英国对比报道中由 PayPal 品牌和合规姿态背书
        - 微型商户和与 PayPal 关联的卖家
        - 读卡器 £29 起，终端 £149 起，交易量超过门槛后可定制费率
        - PayPal 生态、Tap to Pay、强信任光环
        - 标准线下费率并不比 SumUp 便宜，支持和开通深度仍偏小企业
      - - myPOS
        - 直接按用量付费同行
        - 官网称 350,000+ 商户
        - 看重即时结算的移动和小型商户
        - £0 固定月费，门槛以下 1.10% + £0.07 起，门槛以上特殊费率
        - 即时结算、商户账户 / IBAN、免费数据 SIM
        - 费率结构比 Flatpay 纯统一费率叙事更复杂
      - - Stripe Terminal
        - 相邻开发者平台
        - 平台存在感强，但复杂需求多以定制定价为主
        - 线上优先或软件驱动的商户和平台
        - API 主导、定制集成、定制定价、终端机群管理
        - 开发者工具深、Tap to Pay、跨渠道统一报表
        - 对很小的线下商户，不是最简单或最透明的首选
      - - Shopify POS
        - 相邻商户运营套件替代品
        - 支持 1,000+ 门店；借力 Shopify 更广的商业生态
        - 想用一套栈做全渠道、电商和门店管理的零售商
        - 订阅软件为主，叠加 POS Pro
        - 强电商 + 库存 + 客户数据捆绑
        - 商户买的可能是软件广度，而不是最低线下收单费率
      - - Lightspeed Retail
        - 相邻商户运营套件替代品
        - 官网：约 144K 个门店、FY2024 GTV $90.7B
        - 有多店、库存和报表需求的零售商
        - 套餐定价，可能叠加服务费
        - 集成支付、电商、开放 API、24/7 支持
        - 运营负担更重，也可能比简单 Flatpay 部署更贵
      - - Adyen 与规模化欧洲在位者
        - 在位收单方 / 平台类别
        - TSG 将 Adyen 列为欧洲处理量前列，Nexi 拥有 2.9M 商户
        - 中端市场、企业级和跨境商户
        - 销售主导、集成重、多国收单和终端管理
        - 信任、规模、国际触达和终端机群工具
        - 对部分 SMB 过宽或过复杂，但商户不再满足于简单读卡器后就很难对付
      - - DIY / 内部自建
        - 现状方案 / 替代品
        - 不需要供应商规模；商户自行拼工具
        - 成本敏感或工作流特殊的商户
        - 分别组合 PSP、POS、电商和会计工具
        - 对单一供应商依赖最低，最适合非标准工作流
        - 运营复杂度和碎片化支持负担明显更高
    notes: 各行用公开规模信号、官网产品页和保留的独立市场评论，对直接同行、在位者、相邻玩家和替代方案进行比较；未知或变动中的规模数字保留为方向性信号，而非精确值。
