      - number: '7.5'
        title: 缓释因素、监测指标与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Flatpay 确实有有意义的缓释因素。它有真实规模、近期强融资、对商户友好的产品故事、围绕 AML 和隐私的明确治理语言，以及公开记录的支持流程。公司还把 Capital
              限定在丹麦和芬兰，并用专业合作伙伴做商户融资，而不是假装风险不存在。但多数缓释因素仍是政策表述、合作伙伴结构或增长信号；它们还不能替代硬运营证据。因此，关键尽调任务不是争论需求是否存在，而是测试当收单关系、投诉处理或合规负担变复杂时，公司能否守住单位经济模型和客户信任。如果具名合作伙伴集中度高于预期，结算
              / 锁定问题引发投诉或流失上升，2026 年增长目标落空后亏损仍持续，或 Capital
              带来负面催收或声誉结果，投资逻辑就应迅速破裂。在承销下行韧性之前，投资人应要求披露具名交易对手、拒付和打款指标、安全证据，以及把集团层面营销声明与法定实体报表干净接起来的桥。
