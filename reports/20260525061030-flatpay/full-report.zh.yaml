      - number: '1.2'
        title: 创始人、领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Flatpay 的领导层画像，在创始人曝光度上很强，但完整治理权利只看得到一部分。创始团队反复披露为 Sander Janca-Jensen、Rasmus Hellmund Carlsen、Peter Lüth
              和 Rasmus Busk，但法定管理架构比完整商业创始团队更窄。2024 年年报将 Janca-Jensen 列为 CEO，并把 Busk 和 Peter Foss Lüth
              列入执行董事会；董事会名单则远超创始人，包含外部董事和投资人相关人士。Ownr 的 2026 年公司资料还显示，签字规则要求董事总经理与多名董事共同签署，其中包括 Joshua Bell 和 Warda
              Shaheen，进一步说明 Series B 之后、独角兽轮之后，治理已经机构化。

              不过，治理可见度仍不完整。公开资料足以识别法定董事会、确认 CEO
              是主要公开声音，并显示外部资本已经贴近治理层，但没有披露委员会结构、保留事项、表决门槛，也没有干净的受益所有权表。结果是一幅混合但仍有用的图景：Flatpay
              不是「单一创始人黑箱」，因为经审计文件和登记衍生资料显示董事会已扩容，并有正式签字规则；但实际关键人依赖仍高度集中在 Janca-Jensen 身上。他是
              CEO、融资报道中反复出现的发言人，也是公司运营身份的叙事中心。这个集中度在当前阶段未必是缺陷，但后续承销必须测试继任厚度，以及创始人与外部投资人之间真实的治理平衡。
