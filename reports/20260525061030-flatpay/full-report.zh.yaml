  summary: >-
    Flatpay 是一家创立于哥本哈根的丹麦金融科技公司，向中小商户销售固定费率银行卡收单、POS 软件和支付终端。公开资料显示，公司从 2022 年上线后扩展到丹麦、芬兰、德国、意大利、法国和英国，2025 年 11
