  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据 / 依据
      - 重要性
      - 尽调问题
    rows:
      - - 透明统一费率
        - SumUp、Zettle 和 myPOS 已经宣传透明或低摩擦费率
        - 高
        - 直接同行公布低价硬件和轻合同定价；独立对比强调费差可被挑战
        - 统一费率有吸引力，但并非独家
        - 按主要价格竞争对手和商户交易量区间索取赢亏单与流失数据
      - - 高接触服务和安装
        - 软件主导套件即便入驻更少真人服务，也能卖出更多商户运营栈
        - 高
        - Flatpay 的销售打法有差异化，但 Shopify、Lightspeed、Stripe 和 Adyen 赢在工作流深度和集成广度
        - 服务有助转化，但软件捆绑可以更有效提高 LTV 和切换成本
        - 按仅支付商户与启用 POS 商户索取绑定率、留存和毛利率
      - - POS + 在线支付扩张
        - 独立评测仍认为 Flatpay 对线上优先商户较弱
        - 中-高
        - Dupple 推荐 Stripe 处理线上优先用例，并强调 Flatpay 原生在线广度较弱
        - 如果在线和全渠道仍是次要能力，相邻技术栈可能吸收更多商户支出
        - 索取在线支付 GPV、绑定率，以及终端客户的交叉销售转化
      - - 区域挑战者速度
        - 在位收单方仍控制欧洲不成比例的交易量和商户触达
        - 高
        - TSG 显示前五规模集中，且在位者拥有数百万商户
        - 规模影响定价权、合作伙伴准入，也影响采购环节的信任
        - 索取德国、英国和最新市场的国家级份额、商户密度和经济模型
      - - 靠简单定价建立商户信任
        - 公开证据尚不能完全对齐 Flatpay 在官方与评测来源中的具体打包方式
        - 中
        - 官方页面写着零租金或零月费，但 Dupple 描述的是终端月租和更慢的银行结算
        - 买家日后发现条款不同，包装不一致会削弱信任
        - 按市场、产品和商户规模分层，索取已签署的商业模板
      - - 独立支付切入点
        - 欧洲软件捆绑正在加速
        - 高
        - Flagship 记录了 PSP 软件并购，并认为独立支付服务正在衰退
        - 软件一旦成为锚点产品，纯支付优势会更快商品化
        - 索取路线图、软件投入预算，以及 POS 或电商能提升留存的证据
    notes: 严重程度是 12-24 个月竞争承保视角，不是概率预测。该风险清单聚焦 Flatpay 表面护城河最先可能被压缩的位置。
