      - number: '6.3'
        title: 具名客户证据与新鲜度
        blocks:
          - type: paragraph
            body: >-
              对一家仍年轻的中小商户支付平台来说，Flatpay 拥有异常丰富的具名客户证据，但证据集集中在公司撰写的商户故事，而不是中立采购记录或大型企业新闻稿。当前商户故事页面和 FeaturedCustomers
              合计显示，截至本次报告日期，公开流通的具名客户案例至少有八个：Burger Palace、Sokkelund Café & Brasserie、Sif Jakobs
              Jewellery、Avenique、SMURT、Stilk Copenhagen、Mucini 和 Trattoria La
              Bruschetta。对照它们自己的网站，八者都像真实经营中的企业，而且都能清楚映射到一个具体垂直行业或使用场景。


              最有决策价值的客户案例，是那些带有具体运营结果的案例。Sokkelund 称 Flatpay 的小费流程让小费提高约 30%。Avenique
              称每间护理室配备便携终端改善了客户流转，也简化了员工培训。Mucini 称超过一半客户偏好非现金支付，并强调快速轻触刷卡和 24/7 支持。La Bruschetta 不只把 Flatpay
              关联到更快的午餐时段结账，也关联到由仪表盘驱动的桌台管理；Burger Palace 则描述了更低的月度支付处理成本和更简单的后台负担。


              从 URL 层面看，新鲜度不错，因为这些故事在 2026 年 5 月仍在线；但从发布日期层面看，新鲜度较弱，因为多数案例研究没有日期。证据集也偏向店主经营的中小商户、美容诊所、花店、珠宝店和餐厅。这与
              Flatpay 的定位方向一致，但留下一个重要尽调缺口：投资人可以验证真实商户在生产环境使用产品，但公开证据对更大型多门店零售、复杂全渠道连锁，以及超越证言快照的合同耐久度披露较薄。
