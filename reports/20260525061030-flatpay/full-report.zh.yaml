      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Flatpay
              公开定价和上线流程显示出两类商业动作。第一类是简单终端销售：店主经营的商户，日常用户往往也是老板，希望定价可预测、无月度订阅、打款快、上线快。在这种情况下，买方、用户和付款方通常集中在同一个人或门店经理身上。第二类是更完整的
              POS
              套装，商户需要库存、报表或更结构化的工作流控制，因此支付上线或安装费用。这套方案意味着更多利益相关方，因为用户可能是一线员工，而预算所有者是业主、运营负责人或财务审批人。共同路径仍是从面对面会议开始，以现场安装结束。它比自助漏斗更贵，但在一个小商户不信任不透明费率、内部也没有
              IT 支持的市场里，这种方式很可能有价值。Flatpay 自身的增长数字说明，在公司进一步上探市场之前，这条高接触楔子已经引发共鸣。
