      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              估值框架必须同时尊重两个相互矛盾的事实。第一，Flatpay 近期增长信号异常强：从 2024 年末经审计的 17,000 名客户，到 2025 年末大约 60,000 名商户；收入增长超过 400%；管理层称
              ARR 在 2025 年 10 月突破 €100M。第二，这些仍没有经审计的 2025
              年财务数据、披露的队列经济，或公开证据证明高接触获客模型能在每个新国家高效扩张。因此，情景区间的关键不在头部商户数，而在有多少增长能转化为耐久运行收入和更窄的经营亏损。


              我们的乐观情景假设运行收入或 ARR 约 €350-400M，跨市场执行强、亏损转化改善，对应 €1.8-2.4B 价值。基准情景假设运行率仍可观，为 €220-250M，但利润率只小幅改善，对应
              €1.1-1.4B。悲观情景假设增长放缓、CAC 仍重，公开市场倍数仍锚定在更宽泛的 1x-3x 处理商区间，对应仅 €0.6-0.9B。概率加权价值约 €1.3B，略低于上一轮。这不说明 Flatpay
              是差公司；它说明当前价格让新投资人的承销余量很薄。
