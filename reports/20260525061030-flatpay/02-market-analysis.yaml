callouts:
- calloutType: strength
  title: The wedge is concrete, not abstract
  body: 'Flatpay is attacking a visible SMB pain point: merchants want card acceptance, faster payouts, and fewer pricing surprises, not a grand theory about all European payment flows.'
  claimRefs:
  - CM002
  - CM007
  - CM040
- calloutType: insight
  title: The right TAM is a lens set, not one number
  body: Broad payments value, terminal counts, and acquiring revenue all say the market is meaningful, but they cannot be stacked into one clean TAM without inventing precision.
  claimRefs:
  - CM020
  - CM023
  - CM044
  - CM045
- calloutType: risk
  title: Growth in payments volume does not guarantee attractive margins
  body: Merchants buy on total cost, yet fee stacks remain layered and regulation plus new rails can compress the economics of card-led acceptance providers.
  claimRefs:
  - CM025
  - CM029
  - CM030
  - CM031
  - CM051
- calloutType: assumption
  title: Denmark is a strong proving ground, but not the whole rollout story
  body: Denmark's contactless maturity lowers consumer-friction at home, but Flatpay still needs country-by-country data before investors can assume that same adoption dynamic elsewhere in Europe.
  claimRefs:
  - CM018
  - CM019
  - CM042
  - CM049
