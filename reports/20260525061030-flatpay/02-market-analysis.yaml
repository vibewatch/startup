- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Low-volume owner-managed merchant
    - Owner or proprietor
    - Same person or a small staff set
    - Same operating entity
    - Card terminal with basic reporting
    - Owner
    - Wants predictable fees and quick setup
  - - Single-site hospitality SMB
    - Owner or site manager
    - Front-of-house staff
    - Operating company
    - Fast checkout plus daily settlement and simple reports
    - Owner or operations lead
    - Needs speed, contactless support, and low admin burden
  - - Specialty retail merchant
    - Owner or store manager
    - Store staff
    - Store P&L
    - Terminal plus basic inventory or sales visibility
    - Owner or retail ops manager
    - Seeks simpler pricing and fewer manual reconciliations
  - - Complex SMB needing POS bundle
    - Owner plus finance or operations approver
    - Staff across checkout and back office
    - Operating company
    - Integrated POS, payments, inventory, and analytics
    - Owner, finance, or ops approver
    - Needs broader workflow control than a standalone terminal
  - - Higher-volume multi-site SMB
    - Regional operator or finance lead
    - Site staff
    - Central company budget
    - Custom-priced acquiring plus deployment support
    - Finance lead or COO
    - Has outgrown entry-tier pricing and needs bespoke economics
  notes: 'Flatpay''s public pricing thresholds and POS fees imply at least two commercial motions: a simple owner-managed terminal sale and a more complex POS-led deployment.'
