tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to Flatpay
  rows:
  - - SMB in-person card acceptance
    - Merchant service charges on card-present transactions plus terminal and settlement services
    - Issuer economics and consumer-credit monetization
    - Usually owner or site manager pays from operating budget
    - Core acceptance layer Flatpay explicitly markets
  - - SMB terminal-led payments
    - Terminal hardware, software updates, connectivity, reporting, and acquiring services
    - Enterprise fleet-management or processor-only outsourcing
    - Owner or ops lead approves; cashier or staff uses
    - Matches Flatpay terminal offer and installation model
  - - Integrated SMB POS workflows
    - Checkout software, inventory, analytics, and bundled payments
    - ERP-grade or enterprise commerce stacks
    - Owner, operator, or finance approver pays; staff uses
    - Included because Flatpay markets POS bundles, not only terminals
  - - Higher-volume SMB merchant accounts
    - Custom-priced acquiring and POS packages above published turnover thresholds
    - National issuer, scheme, or gateway economics not sold by Flatpay
    - More formal budget owner than a solo proprietor
    - Serviceable but requires bespoke pricing and more complex sale
  - - Pure e-commerce gateway or enterprise PSP spend
    - Adjacency only; some merchants may also buy online acceptance elsewhere
    - Primary chapter scope because Flatpay public materials focus on in-person merchants
    - Different digital team or centralized payments owner
    - Treat as adjacency, not core market boundary for this chapter
  notes: Boundary table separates the acceptance stack Flatpay actually sells from adjacent payment categories that would overstate TAM if treated as direct scope.
