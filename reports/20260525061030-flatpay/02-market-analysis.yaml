- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Migration from cash to digital payments
    - Positive
    - Current to medium term
    - Expands the merchant acceptance pool and normalizes electronic checkout
    - Break out Flatpay win rates in more cash-heavy expansion markets
  - - Contactless and wallet adoption
    - Positive
    - Current
    - Raises checkout convenience and keeps terminal-led acceptance relevant
    - Measure wallet share by Flatpay country and vertical
  - - SoftPOS and terminal refresh cycles
    - Positive
    - 2026-2031
    - Increase endpoint count and merchant willingness to reconsider legacy hardware
    - Track whether Flatpay participates in SoftPOS or only dedicated terminals
  - - Instant-payments rollout and new rails
    - Mixed
    - 2025-2027
    - Can widen competition and reduce dependence on classic card rails, but may also pressure take rates
    - Request Flatpay road map for instant-payment acceptance and settlement
  - - Fee-stack opacity and price-intervention side effects
    - Negative
    - Current
    - Merchants still experience complex total cost even with capped interchange
    - Ask for merchant savings proof versus prior acquirer by segment
  - - Country fragmentation and high-touch sales model
    - Negative
    - Current to medium term
    - Local methods, infrastructure differences, and on-site installation can slow scalable expansion
    - Request CAC, payback, churn, and implementation-time data by country
  notes: This table mixes demand-side growth drivers with monetization frictions because market growth does not automatically translate into attractive unit economics.
