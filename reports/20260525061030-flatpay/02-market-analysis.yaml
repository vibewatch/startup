    - Too broad to use as Flatpay TAM without take-rate and channel normalization
  - - Broad payments growth
    - Europe / 2031
    - Payments market size
    - USD 1.48tn
    - Same lens continued to 2031
    - Still mixes online, offline, and multiple rails
  - - Acceptance infrastructure
    - Europe / 2026
    - POS terminal market size
    - 26.58m units
    - Installed-base or hardware-footprint lens for merchant acceptance
    - Units are not revenue or TPV
  - - Acceptance infrastructure
    - Europe / 2031
    - POS terminal market size
    - 47.98m units
    - Forward installed-base lens
    - Terminal count does not equal active Flatpay merchants
  - - Buyer population
    - Europe / 2025
    - SME count
    - 26.1m SMEs
    - Potential merchant universe before vertical or geography filtering
    - Not all SMEs accept cards or fit Flatpay's target economics
  - - Fee-pool economics
    - Global / 2025
    - Merchant acquiring market size
    - $28.2bn
    - Closer to service revenue from card acceptance
    - Global and not isolated to European SMB point-of-sale
  notes: 'These rows are intentionally non-stackable: payment value, terminal units, enterprise counts, and acquiring revenue describe different layers of the market.'
