chapter:
  number: 2
  title: Market Analysis
  summary: Flatpay is participating in a real European SMB acceptance market, but the investable opportunity is narrower than headline European payments TAM figures imply. The strongest public evidence supports a market shaped by card-present acquiring, terminals, and POS workflows for small merchants, with growth from contactless, wallet, and instant-payment adoption but meaningful constraints from fragmentation, fee-stack complexity, and incomplete public SAM/SOM data.
sections:
- id: market-boundary
  title: Market boundary and immediate adjacencies
  body: 'Flatpay should not be sized as the whole of European payments. Its public offer is much narrower: it sells SMB merchants a blend of card acceptance, terminals, and point-of-sale workflow software, wrapped in transparent pricing and hands-on installation. The company is not presenting itself as a gateway-only processor, issuer, or enterprise outsourcing vendor; it is trying to win smaller merchants that feel overcharged or undersupported by legacy acquiring stacks. That distinction matters because the relevant spend is merchant acceptance and workflow control at the point of sale, not every euro of European payment volume. The practical boundary therefore includes in-person card acceptance, the devices and software that let a merchant take those payments, and the merchant service charges that fund the stack. It excludes pure e-commerce PSP volumes, issuer-side economics, and enterprise payment infrastructure that Flatpay does not currently market into. The boundary is also shaped
    by Flatpay’s own published cutoffs and implementation model, which point to owner-managed or lightly staffed SMBs as the first monetizable wedge rather than every merchant in Europe.'
  claimRefs:
  - CM001
  - CM005
  - CM007
  - CM041
  - CM043
  - CM046
  - CM052
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing the market with non-stackable lenses
  body: 'The cleanest way to size Flatpay’s market is to work from multiple public lenses and keep them separate. Europe’s broad payments-market forecasts are useful as an upper-bound indicator that digital payment activity is expanding quickly, but those trillion-dollar figures measure payment value, not what an acquirer or terminal-led operator can actually earn. A merchant-acquiring report gets closer to fee-pool economics, but it is global and still not specific to Europe’s SMB point-of-sale wedge. A terminal-market forecast is different again: it measures the installed acceptance footprint and hardware refresh cycle rather than fee revenue. Against those lenses sits the actual buyer base: Europe’s SME population is enormous, and trade-heavy small-business categories matter because they are card-accepting, high-frequency, and operationally sensitive to payments friction. The result is a clear conclusion with an equally clear limitation. Flatpay is pointed at a large and growing market,
    but public data does not isolate a defensible Europe-only SMB SAM or SOM without further company data on active merchants, volumes, countries, and vertical mix.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM012
  - CM015
  - CM020
  - CM023
  - CM024
  - CM044
  - CM045
