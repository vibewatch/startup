- id: gtm-unit-economics
  title: GTM Motion, Sales-Efficiency Proxies, and Cost Structure
  body: Flatpay's go-to-market motion is deliberately labor intensive. Official pages and TechCrunch describe in-person meetings, instant demos, on-site installation, and 24/7 support; management explicitly argues this suitcase-sales model creates higher acquisition cost than digital-only peers but yields faster adoption among SMBs that dislike opaque merchant statements. Public traction is real—17k customers in the 2024 filing, about 60k merchants in late-2025 coverage, and 70k merchants on the current site—but economics remain mixed. The 2024 filing shows DKK11.96m of gross profit against DKK151.21m of staff costs, DKK81.04m of property, plant and equipment, and DKK190.24m of cash burn before financing, so current operating leverage is not visible yet. Implied revenue per merchant and revenue per employee are modest for a software narrative, which is more consistent with an acquiring-and-service model than a pure SaaS margin profile. Put differently, public evidence supports strong demand
    creation, but not yet proof that each incremental merchant becomes cheaply serviceable.
