- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Offer
  - Public unit / contract
  - List vs realized
  - Current public evidence
  - Confidence
  - Source / caveat
  rows:
  - - Terminal plan (EU)
    - 0.99% per transaction below €200k turnover
    - List price
    - Official pricing and terminal pages market the rate as all-cards, free-to-start, with custom pricing above threshold
    - high
    - Official merchant-facing price; actual net revenue to Flatpay still depends on acquirer economics
  - - POS plan (EU)
    - 1.49% per transaction below €200k turnover; €0 monthly fee
    - List price
    - Official POS page pairs the rate with kit pricing and no monthly fee
    - high
    - Page mixes payment and hardware economics; merchant-specific realized cost still varies by extras
  - - POS hardware kits
    - €1,495 Basic kit and €2,495 Premium kit
    - List price
    - Official POS page shows upfront hardware prices with onboarding/installation
    - medium
    - No disclosed margin or replacement economics
  - - High-volume merchant pricing
    - Custom above €200k annual card turnover
    - Realized price negotiated
    - Official pages consistently move larger merchants to custom quotes
    - medium
    - Important because flat-rate economics may compress for larger accounts
  - - UK SME pricing
    - 1.49% below £200k annual turnover; £0 setup / £0 monthly in review coverage
    - Blended list / review synthesis
    - MoneyZoe and CardMachineProviders describe the current UK pitch
    - medium
    - Third-party review synthesis, so verify in signed quote
  - - UK low-usage rule
    - £39 excl. VAT per solution below £1,100 monthly turnover
    - Contractual fee
    - UK terms state the fee and threshold explicitly
    - high
    - This makes effective pricing volume-sensitive even if headline rates are simple
  - - Danish low-usage rule
    - DKK399 excl. VAT per solution below DKK10,000 monthly turnover
    - Contractual fee
    - Danish terms state the fee and threshold explicitly
    - high
    - Same economic caveat for underused solutions in Denmark
  - - Payout / settlement
    - Daily-payout marketing, but acquirer-controlled settlement in contract
    - Realized timing depends on acquirer and banking days
    - Official pages promise daily payouts; reviews mention next-day or 1-2 day settlement
    - medium
    - Need market-by-market settlement SLA and exception-rate disclosure
  notes: This table separates headline list pricing from contractual or reviewer-observed merchant economics; list prices are not equivalent to Flatpay net revenue.
