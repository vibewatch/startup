- id: capital-adequacy
  title: Capital Adequacy, Working Capital, and Financing Dependency
  body: Capital adequacy is the strongest part of the public financial story. The 2024 annual report shows DKK107.69m of cash at year-end, DKK436.88m of contributed capital in arrears, and management states DKK437m of December 2024 funding was released in January 2025. A separate Proff regnskab summary of the same filing shows DKK556.77m of current assets, including DKK441.91m of other receivables, which suggests year-end liquidity was supported by sizable working-capital balances rather than cash alone. Separately, investor and media sources say Flatpay raised another €145m in November 2025 at a €1.5bn valuation to expand across current markets, add new markets, and hire aggressively. On a rough historical-burn basis, year-end cash alone would have covered only several months, but cash plus committed equity proceeds imply materially more runway, and the later 2025 round pushes next-round dependency outward. The caveat is that no public source discloses current cash, board-approved burn targets, or the exact split between sales hiring, product investment, equipment financing, and working-capital support after the latest round. Debt and lease obligations are visible but modest relative to equity, so solvency risk looks lower
    than disclosure risk.
