company:
  name: Flatpay
chapter:
  number: 4
  title: Financials
  summary: Flatpay's public financial picture combines unusually clear SMB merchant pricing with opaque net economics. Official pages and contracts show a flat-rate acquiring/POS offer, acquirer-led settlement, daily-payout marketing, and long merchant binding terms, while the 2024 filing shows only DKK11.96m of gross profit against DKK151.21m of staff costs and roughly DKK190.24m of pre-financing cash burn. After DKK437m released in January 2025 and a later €145m November 2025 round at a €1.5bn valuation, near-term capital looks adequate, but revenue mix, take rate, gross margin, CAC, NRR, and post-round cash remain undisclosed.
sections:
- id: revenue-model-pricing
  title: Revenue Model, Pricing, and Revenue-Quality Signals
  body: 'Flatpay''s public revenue model is SMB card-present acquiring wrapped in bundled hardware, software, and support. Official pages show three sellable surfaces—terminal, POS, and online payments—with headline list pricing at 0.99% per transaction below €200k on the terminal plan and 1.49% below €200k on the POS plan; larger merchants move to custom pricing. Legal terms materially qualify the simplicity pitch: the acquirer, not Flatpay, charges the transaction fee and makes merchant payouts, some plugins and add-ons can bill separately, and low-usage penalties and surcharge rules can still affect merchant economics. That means public list prices are useful for demand and positioning, but not enough to infer Flatpay''s net take rate, gross-to-net revenue recognition, or stream-level revenue mix. From a revenue-quality perspective, the strongest positive signal is that merchant funds do not sit on Flatpay''s balance sheet as a float business, while the largest unknown is how much of
    the merchant headline rate Flatpay actually keeps after partner-acquirer economics.'
