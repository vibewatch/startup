  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Audited 2025/2026 revenue split across terminal acquiring, POS, online payments, add-ons, and any financing products, plus gross-versus-net recognition policy.
    whyItMatters: Without mix and recognition, headline merchant rates cannot be mapped to recurring revenue quality or valuation multiples.
    diligencePath: Request audited management accounts with product-level revenue bridge and revenue-recognition memo.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Cohort CAC, payback, conversion, and churn by country and channel for the field-sales motion.
    whyItMatters: The suitcase-sales model may drive adoption but could also require permanently high sales and support expense.
    diligencePath: Request cohort dashboard by market with lead-to-live conversion, CAC, payback months, and 12-month retention.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: current-liquidity
    missingEvidence: Current cash balance, monthly burn, covenant headroom, and board trigger for the next financing after the November 2025 round.
    whyItMatters: Capital adequacy can only be estimated from stale 2024 cash plus later fundraising announcements.
    diligencePath: Obtain latest monthly management accounts, cash waterfall, debt schedule, and downside runway case approved by the board.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: margin-structure
    missingEvidence: Net take rate, acquirer revenue-share terms, gross margin by terminal/POS/online product, and NRR/churn.
    whyItMatters: These are the core inputs for judging revenue quality, margin path, and whether Flatpay behaves like an acquiring business or a software business.
    diligencePath: Request signed acquirer agreements, gross-to-net revenue bridge, product margin breakdown, and merchant cohort retention deck.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
