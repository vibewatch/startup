- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Public substitute / proxy
  - Why gap matters
  - Underwriting risk
  - Exact diligence path
  rows:
  - - GMV / TPV and net take rate
    - Headline merchant price only
    - Needed to map pricing to Flatpay net revenue and valuation multiples
    - Cannot tell whether growth is volume-driven, margin-driven, or both
    - Request monthly TPV, processed transactions, and net take rate by product and country
  - - Revenue recognition by stream
    - Product pages plus filing gross profit only
    - Need terminal vs POS vs online vs add-on mix to judge recurring quality
    - Recurring-quality thesis is untestable without mix and recognition policy
    - Request audited revenue bridge and gross-to-net recognition memo
  - - CAC / payback by market
    - Field-sales narrative plus modest web-traffic proxy
    - Direct-sales motion may be effective but structurally expensive
    - Could require continued capital support even at high growth
    - Request cohort CAC, payback months, conversion funnel, and sales productivity by market
  - - Gross margin by product
    - Gross profit and payroll totals only
    - Need to know if acquiring / POS economics improve with scale
    - Margin path could be materially weaker than growth narrative implies
    - Request product-level gross margin, support cost, and hardware loss rates
  - - Churn / NRR / cohort retention
    - Trustpilot sentiment and anecdotal reviews only
    - Retention is the key test of revenue quality in a low-ARPU SMB base
    - Strong top-line growth could hide weak cohort quality
    - Request logo churn, merchant retention, NRR, and cohort revenue waterfalls
  - - Current cash after Nov 2025 round
    - 2024 filing plus rough runway estimate
    - Capital adequacy is approximate, not measured
    - Next-round trigger and downside buffer remain unknown
    - Obtain latest monthly cash waterfall, debt schedule, and board runway case
  - - Entity vs group metric bridge
    - 17k customers in filing versus 60k-70k public merchant claims
    - Legal-entity mismatch can distort per-merchant and per-employee math
    - Valuation multiple work can be directionally wrong without segmentation
    - Request legal-entity bridge for revenue, customers, and headcount by geography
  - - Acquirer economics
    - Terms show acquirer controls fee collection and payouts
    - Revenue-share and settlement terms are core economics but undisclosed
    - Headline merchant rate may overstate Flatpay economics
    - Request acquirer agreements, settlement timing, chargeback policy, and reserve terms
  notes: Every row is an explicit underwriting blocker rather than a generic question; management could clear most of them with audited internal reporting and partner-contract disclosure.
