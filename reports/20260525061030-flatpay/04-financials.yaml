- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue mix by stream
    - Undisclosed
    - low
    - Needed to distinguish recurring acquiring revenue from hardware, setup, or add-on revenue
    - Provide audited 2025/2026 revenue bridge by terminal, POS, online, and extras
  - - Sales motion
    - In-person meetings, demos, onsite installation, and 24/7 support
    - medium
    - Explains why Flatpay can win SMB adoption, but also why CAC may be structurally high
    - Provide lead-to-live conversion, CAC, and payback by country/channel
  - - Revenue per merchant proxy
    - ~€1.8k-€2.1k annual revenue per merchant using €125m revenue and 60k-70k merchants
    - medium
    - Low ARPU means retention, scale, and support efficiency matter more than one-time hardware margin
    - Provide merchant ARPU and TPV by cohort and vertical
  - - Revenue per employee proxy
    - ~€83k-€96k revenue per employee using €125m revenue and 1.3k-1.5k employees
    - medium
    - Useful proxy for labor intensity in a field-sales / support-heavy model
    - Provide fully-loaded sales/support cost and gross profit per employee
  - - 2024 gross profit vs payroll
    - DKK11.96m gross profit versus DKK151.21m staff costs
    - medium
    - Shows public filings do not yet support a software-like operating-leverage story
    - Provide gross margin and opex split by function
  - - Capital intensity / capex
    - DKK81.04m PPE after DKK40.22m of 2024 acquisitions
    - medium
    - Indicates meaningful equipment and installation footprint above pure software norms
    - Provide hardware depreciation, equipment loss, and replacement-cost disclosure
  - - Settlement economics
    - Acquirer collects transaction fee and makes payouts
    - medium
    - Merchant headline rate may differ materially from Flatpay net revenue share
    - Provide acquirer agreements and gross-to-net revenue bridge
  - - Retention / NRR / payback
    - Undisclosed
    - low
    - Core test of revenue quality and margin durability
    - Provide logo churn, merchant retention, NRR, and payback by market
  notes: Several rows are estimates or structural proxies because Flatpay does not publicly disclose take rate, CAC, gross margin, NRR, or cohort economics.
