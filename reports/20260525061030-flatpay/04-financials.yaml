- id: FI001
  title: Revenue Model Bridge
  type: flow
  layout: standard
  summary: Public evidence shows a merchant-rate model whose fee collection and settlement run through partner acquirers rather than directly through Flatpay.
  approximationNotes: The figure is structural rather than quantified because Flatpay does not disclose the net revenue-share it retains from the merchant headline rate.
  data:
    nodes:
    - id: merchant
      label: Merchant sale
      detail: Card-present, POS, or online payment initiated by an SMB merchant
    - id: headline-rate
      label: Headline merchant rate
      detail: 0.99% terminal plan or 1.49% POS plan below threshold; custom above threshold
    - id: acquirer
      label: Partner acquirer
      detail: Acquirer charges the transaction fee and makes merchant payouts under Flatpay terms
    - id: flatpay-services
      label: Flatpay services bundle
      detail: Hardware, POS/gateway software, onboarding, support, and some add-ons bundled around payment acceptance
    - id: merchant-payout
      label: Merchant payout
      detail: Daily or next-business-day settlement is marketed, but contract execution sits with the acquirer
    - id: net-economics
      label: Flatpay net economics
      detail: Net revenue depends on undisclosed acquirer revenue share plus add-on fees minus service and support costs
  claimRefs:
