tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Card-present terminal acquiring
    - Flat-rate fee on terminal transactions with bundled hardware/support
    - '% of processed card turnover'
    - 0.99% below €200k annual card turnover; custom above threshold
    - Medium — clear merchant list price, but Flatpay net revenue share is undisclosed
    - Disclose gross vs net take rate and acquirer revenue-share by market
  - - POS transactions
    - Flat-rate payment fee plus POS software/hardware bundle
    - '% of processed turnover + upfront kit'
    - 1.49% below €200k annual card turnover; Basic/Premium kits shown separately
    - Medium — recurring use-case exists, but hardware and support economics are opaque
    - Disclose attachment rate, hardware gross margin, and merchant ARPU by POS tier
  - - Online payments
    - Online acceptance, gateway, and plugin-based checkout
    - Likely % of online payment volume
    - Official site confirms product exists, but official public online rate was not found in retained primary sources
    - Low — stream existence is visible, stream economics are not
    - Provide online take rate, chargeback cost, and share of total revenue
  - - Add-on services and integrations
    - Receipt rolls, cash-register setup, certain plugins, and optional extras billed separately
    - Per add-on or per integration
    - Terms say some integrations/plugins and extras can charge separately
    - Low — ancillary revenue may exist but public contribution is undisclosed
    - Show annual non-transaction revenue and attach rates for extras
  - - Low-usage and surcharge economics
    - Monthly under-usage fees and acquirer-defined surcharge on eligible cards
    - Per underused solution / per eligible transaction
    - £39 per UK solution below threshold; DKK399 per Danish solution below threshold; surcharge depends on acquirer agreement
    - Low — these charges affect merchant economics but do not reveal Flatpay net retention
    - Disclose incidence rate, churn impact, and net revenue contribution
  - - Emerging fintech upsells
    - Working-capital advances, cards, or accounts discussed in analyst/news sources
    - Per financing product or account
    - Roadmap / analyst-reported rather than officially monetized with disclosed revenue today
    - Low — optionality exists but not underwritten
    - Confirm whether Flatpay Capital or banking products are live, revenue-bearing, and material
  notes: Official pages and legal terms establish the product surfaces and list prices, but they do not disclose revenue mix, net take rate, or gross-to-net recognition by stream.
