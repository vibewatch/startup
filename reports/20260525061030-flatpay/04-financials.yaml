- id: FI002
  title: Unit Economics Bridge
  type: flow
  layout: standard
  summary: The most visible unit-economics path runs from labor-heavy field acquisition to low-ARPU merchant revenue, with support and hardware intensity determining whether scale improves margins.
  approximationNotes: Revenue-per-merchant and revenue-per-employee nodes are estimated from public 2025 revenue, merchant-count, and headcount ranges rather than disclosed company cohorts.
  data:
    nodes:
    - id: field-sales
      label: Field sales / suitcase demo
      detail: In-person meetings, pricing walkthroughs, and onsite setup create conversion but likely higher CAC
    - id: merchant-live
      label: Activated merchant
      detail: Merchant goes live on terminal, POS, or online acceptance with Flatpay support
    - id: arpu
      label: Implied annual revenue per merchant
      detail: Roughly €1.8k-€2.1k from €125m revenue against 60k-70k merchants
    - id: support-layer
      label: Service layer
      detail: 24/7 support, installation, equipment replacement, and software/gateway servicing
    - id: cost-base
      label: Labor-heavy cost base
      detail: 2024 staff costs of DKK151.21m and meaningful equipment footprint reduce visible operating leverage
    - id: margin-outcome
      label: Margin outcome
      detail: Public evidence does not yet prove a high-margin SaaS profile; retention and net take rate are the swing factors
