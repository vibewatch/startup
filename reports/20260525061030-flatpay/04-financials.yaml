- id: gaps-verdict
  title: Public Gaps, Revenue-Quality Verdict, and Diligence Blockers
  body: 'Public visibility is still too thin for clean underwriting. Contract terms show revenue quality is structurally better than a lender or float model because partner acquirers collect fees and make payouts, but that same structure hides Flatpay''s actual revenue share and gross margin. Review sources are directionally positive but not clean: Trustpilot sentiment is strong, yet UK reviewers still mention payout timing, support variability, aggressive sales contact, low-usage penalties, replacement costs, and surcharge mechanics that complicate the ''no hidden fees'' message. Database-style summaries also disagree on lifetime funding and scale, which makes valuation-multiple math noisy if taken at face value. The net result is a credible, well-funded growth story with real SMB demand, but not enough disclosed data to prove margin durability, churn quality, or whether the €1.5bn valuation rests on efficient economics versus continued capital-fueled expansion. The verdict is therefore
    constructive on demand and capital, but cautious on revenue quality until management opens the cohort, take-rate, and margin books.'
