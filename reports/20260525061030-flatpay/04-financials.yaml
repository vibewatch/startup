- id: TI004
  title: Capital Adequacy Table
  columns:
  - Capital item
  - Public amount / status
  - Vintage
  - What it covers
  - Underwriting implication
  - Diligence ask
  rows:
  - - Cash on hand
    - DKK107.69m
    - 31 Dec 2024
    - Filed cash balance
    - Latest hard cash number is real but stale relative to the Nov 2025 round
    - Provide latest monthly cash balance and unrestricted cash
  - - Contributed capital in arrears
    - DKK436.88m at year-end; annual report says DKK437m released in Jan 2025
    - Year-end 2024 / Jan 2025
    - Committed equity proceeds not yet received on 31 Dec 2024
    - Meaningfully improves start-2025 liquidity versus year-end cash alone
    - Provide receipts schedule and any outstanding investor commitments
  - - 2024 financing inflow
    - DKK234.51m cash financing inflow; filing also says DKK655m raised during 2024
    - FY2024
    - Series B / Series C cash entering the business during 2024
    - Supports growth but needs reconciliation between accounting, committed, and received cash
    - Bridge announced rounds to cash received and capitalized
  - - Nov 2025 Series C
    - €145m at €1.5bn valuation
    - Nov 2025
    - Expansion, hiring, and new-market entry
    - Reduces near-term financing dependency
    - Provide remaining proceeds, burn plan, and hiring budget after the round
  - - Annual burn proxy
    - ~DKK190.24m pre-financing cash outflow
    - FY2024
    - Operating plus investing cash use before financing
    - Creates a rough runway band only; exact current burn may be much higher in 2025/2026
    - Provide current monthly burn and downside runway case
  - - Current assets
    - DKK556.77m at year-end 2024
    - 31 Dec 2024
    - Balance-sheet liquidity including cash and receivables
    - Liquidity was stronger than cash alone, but much of it depended on working-capital collection
    - Provide aging and collectability for the receivables book
  - - Other receivables
    - DKK441.91m
    - 31 Dec 2024
    - Non-cash working-capital asset inside current assets
    - Signals that year-end solvency depended partly on receivable conversion, not just funded cash
    - Break out receivable categories, counterparties, and collection timing
  - - Debt and lease obligations
    - DKK17.95m bank debt, DKK10.43m lease liabilities, DKK6.18m current portion
    - 31 Dec 2024
    - Bank/equipment financing and lease commitments
    - Debt is modest relative to equity, but financing obligations are not zero
    - Provide maturities, covenants, and equipment-finance terms
  - - Next-round dependency
    - Estimated low near term after Jan 2025 equity release and Nov 2025 round, but exact trigger undisclosed
    - 2026 estimate
    - Management buffer and board financing plan
    - Current adequacy looks better than profitability, yet public disclosure is too stale for a precise trigger date
    - Provide board-approved minimum-cash trigger and next-round planning assumptions
  notes: The table mixes hard filed figures with a narrow set of later funding announcements; only the 2024 filing provides actual cash and liability balances.
