evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: capital-stack
    missingEvidence: >-
      A management-reconciled financing schedule showing each round date, legal instrument, currency, lead investor, and
      whether the 2024 annual report’s “Series C in Q4 2024” refers to the same financing later described publicly as
      the November 2025 Series C.
    whyItMatters: >-
      Later underwriting will need a clean capital-history bridge to model dilution, liquidation preferences, and the
      real amount of invested versus announced capital.
    diligencePath: >-
      Request the cap-table history, board approvals, and signed financing documents for every round from Series A
      through the unicorn financing.
    relatedQuestionRefs:
      - QO010
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: regulatory-stack
    missingEvidence: >-
      Direct evidence of Flatpay’s own current licensing or sponsorship structure, including which regulated entities
      hold acquiring or payment permissions in each operating market and whether Flatpay itself has any direct
      authorization.
    whyItMatters: >-
      The public record shows an early licensed partner relationship, but not a full current regulatory map. That
      affects operational risk, compliance reliance, and expansion readiness across Europe.
    diligencePath: >-
      Request a current market-by-market regulatory matrix, sponsor-bank and acquirer agreements, and any
      payment-institution or e-money permissions relied on by Flatpay or its affiliates.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: ownership-rights
    missingEvidence: >-
      A current beneficial-ownership table, board committee map, investor consent rights, and liquidation-preference
      stack.
    whyItMatters: >-
      Public sources show directors and signatory participants but do not reveal who controls outcomes, what investor
      rights attach to the latest round, or how much founder control remains.
    diligencePath: >-
      Request the latest shareholder agreement, board charter package, option-pool summary, and beneficial-owner
      register extract from counsel.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: flatpay-sam-som
    missingEvidence: Flatpay merchant counts, TPV, and gross profit by country, vertical, and turnover band.
    whyItMatters: >-
      Public market lenses are too broad to convert into a defensible Flatpay SAM or SOM without knowing where current
      demand and economics already concentrate.
    diligencePath: >-
      Request a cohort export by country and merchant band showing active merchants, TPV, net take rate, churn, and
      payback.
    relatedQuestionRefs:
      - QM005
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing-units
    missingEvidence: >-
      A normalized bottoms-up bridge linking payment value, terminal counts, merchant counts, and acquiring revenue in
      the same geography and year.
    whyItMatters: >-
      Without one common bridge, public figures can look contradictory or accidentally get stacked into an overstated
      TAM.
    diligencePath: >-
      Build a bottoms-up model from merchant counts x card-accepting share x TPV per merchant x take rate, then
      reconcile to public lenses.
    relatedQuestionRefs:
      - QM010
      - QM011
      - QM012
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: high-touch-unit-economics
    missingEvidence: Country-level CAC, payback, installation time, and churn for the in-person sales and installation motion.
    whyItMatters: >-
      The high-touch motion may differentiate Flatpay, but investors cannot tell whether it scales efficiently without
      the unit economics behind it.
    diligencePath: >-
      Request monthly acquisition-cost and payback cohorts by market plus retention curves for terminal-only versus POS
      merchants.
    relatedQuestionRefs:
      - QM015
      - QM023
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: instant-payments-substitution
    missingEvidence: >-
      Public 2026 to 2027 evidence showing how quickly instant payments or A2A rails displace card-led in-person SMB
      acceptance by country.
    whyItMatters: >-
      Instant-payments rollout is real, but the monetization effect on terminal-led providers is still uncertain and
      could alter take-rate assumptions.
    diligencePath: >-
      Track country-level adoption studies and ask Flatpay for its own share of card versus non-card acceptance flows
      where it operates.
    relatedQuestionRefs:
      - QM020
      - QM023
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: minor
    topic: merchant-vertical-mix
    missingEvidence: >-
      A disclosed split of Flatpay's merchants and TPV across hospitality, retail, services, and higher-volume
      multi-site merchants.
    whyItMatters: >-
      Public examples suggest a tilt toward trade and hospitality, but investors still need a real segment mix to weight
      budget ownership and expansion potential.
    diligencePath: Request current merchant mix, TPV mix, and sales pipeline by vertical and country.
    relatedQuestionRefs:
      - QM007
      - QM013
      - QM014
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: flatpay-pricing-consistency
    missingEvidence: >-
      Signed or current market-specific commercial terms that reconcile official zero-fee language with the third-party
      review that describes monthly terminal rental and slower bank settlement.
    whyItMatters: >-
      Flatpay’s core competitive wedge is pricing clarity. If public descriptions differ by product or market,
      underwriting its price advantage from public pages alone is risky.
    diligencePath: >-
      Request current commercial templates for Denmark, UK, and any next-launch markets, plus one recent merchant
      invoice per product type.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: flatpay-regulatory-entity
    missingEvidence: >-
      A current primary source naming the exact legal entity, market-by-market acquiring permissions, and regulatory
      registrations behind Flatpay’s merchant contracts.
    whyItMatters: >-
      Trust and regulatory posture are part of the buyer decision in payments. Public evidence is easier to verify for
      PayPal-linked or large incumbent providers than for Flatpay’s exact market structure.
    diligencePath: >-
      Pull merchant terms, regulatory disclosures, or licensing pages by country and map them against the
      seller-of-record for each Flatpay product.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: retention-and-attach
    missingEvidence: >-
      Cohort retention, gross margin, win-loss, and attach-rate data for payments-only versus POS and online-payments
      merchants.
    whyItMatters: >-
      Those private metrics determine whether Flatpay’s service-heavy growth model creates durable software-led lock-in
      or only expensive top-of-funnel conversion.
    diligencePath: >-
      Request cohort retention by product bundle, churn reasons by competitor, and CAC-payback by direct-sales cohort
      and market.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Audited 2025/2026 revenue split across terminal acquiring, POS, online payments, add-ons, and any financing
      products, plus gross-versus-net recognition policy.
    whyItMatters: >-
      Without mix and recognition, headline merchant rates cannot be mapped to recurring revenue quality or valuation
      multiples.
    diligencePath: Request audited management accounts with product-level revenue bridge and revenue-recognition memo.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Cohort CAC, payback, conversion, and churn by country and channel for the field-sales motion.
    whyItMatters: The suitcase-sales model may drive adoption but could also require permanently high sales and support expense.
    diligencePath: Request cohort dashboard by market with lead-to-live conversion, CAC, payback months, and 12-month retention.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: current-liquidity
    missingEvidence: >-
      Current cash balance, monthly burn, covenant headroom, and board trigger for the next financing after the November
      2025 round.
    whyItMatters: Capital adequacy can only be estimated from stale 2024 cash plus later fundraising announcements.
    diligencePath: >-
      Obtain latest monthly management accounts, cash waterfall, debt schedule, and downside runway case approved by the
      board.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: margin-structure
    missingEvidence: Net take rate, acquirer revenue-share terms, gross margin by terminal/POS/online product, and NRR/churn.
    whyItMatters: >-
      These are the core inputs for judging revenue quality, margin path, and whether Flatpay behaves like an acquiring
      business or a software business.
    diligencePath: >-
      Request signed acquirer agreements, gross-to-net revenue bridge, product margin breakdown, and merchant cohort
      retention deck.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: public-trust-center
    missingEvidence: >-
      A dedicated public security, trust, or uptime-status surface with incident history, SLA framing, and
      service-provider control summaries.
    whyItMatters: >-
      Flatpay handles payments and is discussing AI and banking-adjacent roadmap items, so public trust disclosure
      matters for technical diligence and operational-risk underwriting.
    diligencePath: >-
      Request a trust-center package covering uptime reporting, incident disclosure policy, service-provider compliance
      attestations, and security contact process.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: api-and-architecture-docs
    missingEvidence: >-
      Public API reference docs, auth model details, webhook references, service topology, tenancy boundaries,
      encryption/key-management detail, and architecture diagrams for online payments and portal services.
    whyItMatters: >-
      Public sources support the workflow story but not full technical diligence on integration quality, security
      design, or platform scalability.
    diligencePath: >-
      Request a developer portal export, architecture deck, security questionnaire, and sample API / webhook
      documentation from Flatpay product or engineering leadership.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: roadmap-specificity
    missingEvidence: >-
      A dated release plan or milestone framework for AI agents, AI analytics, embedded-finance products, and any
      self-serve expansion paths.
    whyItMatters: >-
      Roadmap direction is visible, but timing, launch criteria, and customer availability remain too vague to
      underwrite delivery confidence.
    diligencePath: Request the internal roadmap, beta customer references, and product launch criteria for each roadmap line item.
    relatedQuestionRefs:
      - QE021
    relatedTableRefs:
      - TE005
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: NRR, GRR, logo churn, contract length, and cohort retention by market and merchant size.
    whyItMatters: >-
      Customer quality cannot be judged rigorously from public growth anecdotes alone; durability is the core
      underwriting question for a payments business.
    diligencePath: Request merchant-level cohort tables, contract templates, and renewal data in the data room.
    relatedQuestionRefs:
      - QU017
    relatedTableRefs:
      - TU005
  - type: access-blocked
    severity: material
    topic: review-access
    missingEvidence: Direct access to current raw Trustpilot review text and complaint detail.
    whyItMatters: >-
      Aggregated ratings are useful, but raw complaint categories are needed to judge whether support, pricing,
      hardware, or settlement issues are concentrated in a specific merchant cohort.
    diligencePath: Re-run direct review collection with browser access or obtain an exported review sample directly from management.
    relatedQuestionRefs:
      - QU019
      - QU025
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer, top-country, and top-sector concentration by revenue or payment volume.
    whyItMatters: >-
      A fast-growing SMB acquirer can still be fragile if a few countries, verticals, or merchant clusters drive most
      economics.
    diligencePath: Request top-10 and top-20 customer concentration plus TPV/revenue by country and vertical.
    relatedQuestionRefs:
      - QU021
    relatedTableRefs:
      - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: proof-set-gap
    missingEvidence: >-
      A fuller list of named production customers beyond the eight public stories and directory references found in this
      run.
    whyItMatters: >-
      The current proof set confirms real usage, but it may over-represent Flatpay's best testimonial-friendly SMB
      customers.
    diligencePath: Ask management for a segmented customer reference pack with geography, vertical, tenure, and product attach.
    relatedQuestionRefs:
      - QU001
      - QU024
    relatedTableRefs:
      - TU004
  - type: stale
    severity: minor
    topic: geographic-footprint
    missingEvidence: >-
      Official launch chronology showing when the Netherlands moved from prospect/new-market status to a live customer
      market.
    whyItMatters: >-
      Without launch timing, investors cannot cleanly reconcile six-country late-2025 reporting with the seven-market
      website footprint seen in May 2026.
