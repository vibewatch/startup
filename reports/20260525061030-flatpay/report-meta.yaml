companyProfile:
  summary: Flatpay is a Copenhagen-founded Danish fintech that sells flat-rate card acceptance, POS software, and payment terminals to SMB merchants. Public sources show the business scaling from launch in 2022 to Denmark, Finland, Germany, Italy, France, and the U.K., with a unicorn round in November 2025 and current website claims of 70,000+ merchants. The central diligence tension is that merchant traction and pricing simplicity are visible, while group-level margin, churn, take-rate, and current cash disclosure remain thin.
