  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: NRR, GRR, logo churn, contract length, and cohort retention by market and merchant size.
    whyItMatters: Customer quality cannot be judged rigorously from public growth anecdotes alone; durability is the core underwriting question for a payments business.
    diligencePath: Request merchant-level cohort tables, contract templates, and renewal data in the data room.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: material
    topic: review-access
    missingEvidence: Direct access to current raw Trustpilot review text and complaint detail.
    whyItMatters: Aggregated ratings are useful, but raw complaint categories are needed to judge whether support, pricing, hardware, or settlement issues are concentrated in a specific merchant cohort.
    diligencePath: Re-run direct review collection with browser access or obtain an exported review sample directly from management.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer, top-country, and top-sector concentration by revenue or payment volume.
    whyItMatters: A fast-growing SMB acquirer can still be fragile if a few countries, verticals, or merchant clusters drive most economics.
    diligencePath: Request top-10 and top-20 customer concentration plus TPV/revenue by country and vertical.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: proof-set-gap
    missingEvidence: A fuller list of named production customers beyond the eight public stories and directory references found in this run.
    whyItMatters: The current proof set confirms real usage, but it may over-represent Flatpay's best testimonial-friendly SMB customers.
    diligencePath: Ask management for a segmented customer reference pack with geography, vertical, tenure, and product attach.
    relatedQuestionRefs:
    - QU001
    - QU024
    relatedTableRefs:
    - TU004
  - type: stale
    severity: minor
    topic: geographic-footprint
    missingEvidence: Official launch chronology showing when the Netherlands moved from prospect/new-market status to a live customer market.
    whyItMatters: Without launch timing, investors cannot cleanly reconcile six-country late-2025 reporting with the seven-market website footprint seen in May 2026.
    diligencePath: Request market-entry timeline and merchant count by country launch cohort.
    relatedQuestionRefs:
    - QU003
    - QU021
    relatedTableRefs:
    - TU002
