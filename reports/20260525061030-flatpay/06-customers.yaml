  rows:
  - - Hospitality restaurants & takeaway
    - Owner/operator buyer; front-of-house user; merchant entity payer
    - Denmark, Germany
    - Card-present checkout, tips, table management, takeaway
    - Burger Palace, Sokkelund, SMURT, La Bruschetta
    - Densest public proof set; Italy data suggests F&B is a major vertical
    - No disclosed revenue share or churn by hospitality cohort
  - - Beauty & wellness services
    - Clinic owner buyer; treatment-room staff user; clinic payer
    - Denmark, Germany
    - Portable terminals, room-by-room checkout, fast taps
    - Avenique, Mucini
    - Strong fit for service workflows where payment follows treatment
    - No disclosed multi-site beauty rollups or retention data
  - - Specialty retail / jewellery
    - Store owner or retail manager buyer; store staff user; merchant payer
    - Denmark and international retail footprint
    - Physical-store card acceptance and store operations
    - Sif Jakobs Jewellery
    - Proof that Flatpay can support premium retail environments
    - No disclosed omnichannel or chain-level deployment metrics
  - - Floristry / local retail
    - Founder-owner buyer; shop staff user; merchant payer
    - Denmark
    - In-store payments and local retail operations
    - Stilk Copenhagen
    - Supports boutique retail and seasonal cash-flow needs
    - Single-store or small-network scale only in public evidence
  - - Webshops / online merchants
    - Merchant owner or ecommerce manager buyer; finance/ops user; merchant payer
    - Pan-European
    - Secure online checkout and digital wallets
    - Online payments product page, webshop integrations, Frisbii platform
    - Expands beyond card-present into ecommerce and API-led merchants
    - No disclosed online-only merchant counts
  - - Higher-turnover SMB / lower-mid-market
    - Owner/CFO buyer; ops staff user; merchant payer
    - Pan-European
    - Negotiated custom pricing above baseline tariff
    - Pricing and POS pages mention custom rates above €200k annual card turnover
    - Shows upmarket step-up path beyond micro-merchants
    - No named public customers tied to this price tier
  - - Existing merchants eligible for financing
    - Merchant owner buyer; finance user; merchant payer
    - Markets where Flatpay Capital is offered
    - Revenue-based financing on card sales
    - Flatpay Capital page, Liberis partnership
    - Cross-sell broadens wallet share beyond payments
    - Eligibility, take-rate, and adoption penetration undisclosed
  notes: Segmentation is built from named merchant stories, product pages, pricing thresholds, and market-level reporting; Flatpay does not disclose a formal customer mix by revenue, sector, or geography.
