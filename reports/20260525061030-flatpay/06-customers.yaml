- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Factor
  - Current position
  - Risk level
  - Investment impact
  - Diligence path
  rows:
  - - Geographic concentration
    - Germany is the largest reported market; Italy is another large installed base
    - Medium
    - Country-specific regulation, pricing pressure, or execution issues could affect a large share of merchants
    - Get merchant count, TPV, and churn by country
  - - Vertical concentration
    - Public proof clusters in hospitality, beauty, and specialty retail
    - Medium
    - Sector downturns or higher failure rates in local merchants could pressure growth quality
    - Request merchant mix by SIC/NACE code and revenue
  - - Field-sales dependence
    - Customer acquisition and install model is highly assisted and local
    - Medium-high
    - Scaling depends on hiring and supervising large local commercial teams
    - Request CAC, payback period, rep productivity, and install backlog
  - - Product expansion upside
    - Terminal, POS, ecommerce, and capital create multi-product attach potential
    - Positive / medium
    - Expansion can offset lower ARPU in the long-tail SMB base
    - Request attach rates and cohort migration across products
  - - Partner/platform dependence
    - Frisbii powers online payments; Liberis powers financing; Finaro historically underpinned acquiring
    - Medium
    - Critical partners can affect roadmap, economics, and service quality
    - Review commercial agreements and migration rights
  - - Top-customer concentration
    - Undisclosed in all reviewed public materials
    - High unknown
    - A small set of high-turnover SMBs or chains could drive disproportionate revenue without public visibility
    - Request top-10 / top-20 merchant revenue and TPV concentration
  notes: Risk levels reflect the visibility limits of the public record, not confirmed management disclosures. The largest unresolved issue is undisclosed concentration by customer and country.
