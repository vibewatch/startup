- id: retention-expansion-and-risk
  title: Retention, Expansion, Concentration, and Risk
  body: >-
    Durability is the biggest unresolved issue in the public record. None of the reviewed official pages, customer stories, or late-2025 growth articles disclosed NRR, GRR, logo churn, contract length, or cohort retention. The best public durability proxies are indirect: merchant count grew sharply from 2024 to 2025 and is now marketed at a higher level in 2026; Flatpay continues to invest in capital and online payments for existing merchants; and review aggregation remains mostly positive despite a measurable complaint tail. Those signals suggest stickiness, but they do not replace disclosed retention data.


    Expansion logic is easier to see than retention math. Flatpay can widen wallet share by moving a merchant from a standalone terminal into POS, then into ecommerce, and eventually into Flatpay Capital. The company also uses custom pricing for merchants above €200,000 annual turnover, giving sales a reason to keep larger merchants on a negotiated path instead of a one-size-fits-all SMB tariff. That said, concentration risk is still hard to size. Germany appears to be the largest market; Italy is already a large and hospitality-heavy installed base; and the public proof set clusters around food, beauty, and specialty retail. Exact top-customer, country, and sector concentration is undisclosed.


    Adverse evidence exists but is limited. A TradersUnion snapshot built from Trustpilot data showed 2,304 reviews, a 4.5/5 overall rating, and a 7.64 percent one-star share on 25 May 2026 — enough to show that complaints are present even if the aggregate score remains strong. Direct Trustpilot inspection was blocked by anti-bot protection during this run, which weakens freshness verification of raw review text. The bigger strategic risk is not visible churn; it is channel dependence on a field-sales and on-site installation model that improves SMB conversion but scales only as fast as Flatpay can hire, train, and support local commercial teams.
