chapter:
  number: 6
  title: Customers
  summary: 'Flatpay''s public customer proof is real and broad for an SMB-focused payments company: the current website claims 70,000+ merchants across Europe, late-2025 reporting placed the base at roughly 60,000 merchants across six countries, and named merchant stories span hospitality, beauty, floristry, jewellery, and takeaway. The evidence set also shows the company''s commercial model clearly — direct in-person sales, on-site installation, flat pricing, and product expansion from terminals into POS, ecommerce, and merchant financing — but public retention, churn, and customer concentration disclosure remains thin.'
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation
  body: >-
    Flatpay's publicly visible customer base is concentrated in small and medium-sized merchants rather than large enterprises. The company's current homepage, pricing pages, product pages, and late-2025 funding coverage all use the same positioning: simple fixed-rate card acceptance, no hidden fees, daily payouts, 24/7 support, and hands-on installation for merchants that want an easier alternative to legacy POS and acquiring setups. In buyer-user-payer terms, the buyer is usually the owner or operator of a local merchant business, the user is the cashier, front-of-house, or store staff operating the terminal or POS, and the payer is the merchant entity paying a per-transaction fee.


    The named merchant proof set shows where Flatpay is strongest. Hospitality and food service dominate: Burger Palace, Sokkelund, SMURT, and Trattoria La Bruschetta all use Flatpay in restaurant or takeaway settings where fast card-present checkout, tips, or table management matter. Beauty and service is another visible wedge via Avenique and Mucini, while speciality retail appears through Sif Jakobs Jewellery and Stilk Copenhagen. These proofs are consistent with the company's own vertical tiles (butchers, fast casual, coffee shops, bars, fishing and markets, florists) and with late-2025 Italian coverage that said more than half of Flatpay's 18,000 Italian customers operate in food and beverage.


    Geographically, the current website exposes localized surfaces for Denmark, Germany, Finland, Italy, France, the United Kingdom, and the Netherlands, while late-2025 reporting still described a six-country footprint. That combination suggests a northern-European SMB payments roll-up in progress, with Germany already the largest independently reported market and the Netherlands likely the newest outward-facing surface by the run date. Size segmentation is also visible in pricing: Flatpay self-serves the long tail with zero-subscription pricing, but flags custom rates for merchants above €200,000 annual card turnover, showing a deliberate step-up path into higher-volume SMB and lower-mid-market accounts.
