- id: adoption-trajectory-and-channel-model
  title: Adoption Trajectory and Channel Model
  body: >-
    Flatpay's customer adoption has scaled quickly. Late-2025 coverage repeatedly described roughly 60,000 customers, up from 7,000 in April 2024, while the current homepage now claims 70,000+ merchants across Europe. Even allowing for marketing lag and self-reporting bias, that sequence shows a business that kept adding merchants after the unicorn financing round rather than plateauing. Germany was reported as the largest market with around 20,000 customers, while Italy alone had 18,000 customers and a hospitality-led mix.


    The adoption path is intentionally high-touch. Instead of pure self-serve acquisition, Flatpay repeatedly describes a field-sales motion that starts with an in-person meeting, continues through a product choice discussion, and ends with on-site installation. Founder interviews say sales reps visit SMB merchants directly and explain pricing face to face. That is more labor-intensive than a Stripe-style product-led motion, but it appears central to why Flatpay converts offline merchants that may not buy through docs and APIs alone. The model also reduces procurement friction for the core SMB target: merchants do not need to self-configure hardware, decode interchange tables, or stitch multiple providers together.


    Product adoption is not limited to a single terminal. Flatpay now markets three core surfaces — payment terminal, POS, and online payments — and layers capital on top for existing merchants. The ecommerce product supports common webshop integrations and names Frisbii as the technical platform, while the POS pages show restaurant workflows such as split bills, table view, take-away handling, kitchen printers, inventory, and reporting. Capital extends the wallet share with revenue-based financing available only to Flatpay merchants. Together, these surfaces create a credible land-and-expand story even though the company does not disclose NRR, product attach, or cohort migration metrics.
