- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - 24/7 support and local hotline coverage
    - Publicly documented
    - Merchant support operations across markets and in English
    - No published response-time SLA, escalation matrix, or uptime credit policy
  - - Legal hub with privacy and terms surfaces
    - Publicly documented
    - Customer-facing legal and policy disclosure
    - No dedicated public trust center or service-provider control summary
  - - Staff permissions and refund controls
    - Publicly documented
    - Portal access control for employees and operational approvals
    - No public audit-log, SSO, or role-permission matrix detail
  - - Automatic updates and connectivity checks
    - Publicly documented
    - Terminal fleet quality and basic resilience controls
    - No public release channel, patch cadence, or rollback policy
  - - Accounting account-number validation
    - Publicly documented
    - Connector setup quality control
    - System can flag invalid account numbers but cannot prevent selection of a wrong live account
  - - PAX terminal PCI PTS certification
    - Publicly documented at device level
    - Underlying payment-terminal hardware security standard
    - No retained public Flatpay service-provider PCI/AML/acquirer disclosure pack
  - - Public trust / incident / uptime surface
    - Thin public evidence
    - External diligence and ongoing reliability visibility
    - Retained official URLs do not surface a dedicated status page, uptime history, or formal incident archive
  notes: This table distinguishes publicly visible controls from missing disclosures. Device-level certification does not substitute for platform-level compliance evidence, and the absence rows reflect retained-source coverage only.
