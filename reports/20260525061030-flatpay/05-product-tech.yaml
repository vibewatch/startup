- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Flatpay solution
  - Measurable benefit
  - Limitation
  rows:
  - - Launch a new merchant
    - Compare providers, sign up, wait for hardware, and configure devices manually
    - In-person meeting, solution selection, preconfigured hardware, and on-site installation
    - Faster time to go-live with less local configuration work
    - Merchant still depends on Flatpay-led onboarding rather than fully self-serve setup
  - - Run counter-service card acceptance
    - Standalone card reader plus manual reconciliation
    - Terminal plan with flat-rate pricing, automated reporting, and portal visibility
    - Simpler acquiring economics and less manual end-of-day work
    - Public docs do not fully describe MOTO/phone-payment scope
  - - Run restaurant table service
    - Separate table app, printer logic, and payment terminal
    - POS with table view, split-bill flow, takeaway mode, kitchen printers, and mPOS table sync
    - Fewer workflow handoffs between ordering and payment
    - Restaurant-specific integrations beyond Flatpay surfaces are not publicly enumerated
  - - Close the day and review performance
    - Manual settlement sheets and ad hoc exports
    - Z-reports, X reports, cashier reports, receipt history, and downloadable portal reports
    - Daily control loop is standardized across merchants and terminals
    - No public benchmark for report latency or export retention windows
  - - Reconcile payouts and bookkeeping
    - Manual import into accounting software
    - Nightly connector sync for revenue, fees, payouts, and report attachments
    - Lower reconciliation effort for SMB operators and accountants
    - Named connectors are limited to e-conomic and Dinero in the retained official docs
  - - Enable webshop checkout
    - Separate gateway and fragmented reporting
    - Online-payment pricing plus Shopify/Frisbii setup and third-party described widget/API/plugin paths
    - Potential to bring online and offline flows closer together operationally
    - Public API reference, webhook docs, and plugin support coverage remain incomplete
  notes: Workflow benefits are directional rather than benchmarked; Flatpay does not publish implementation-time, support-response, or conversion-rate distributions for these merchant journeys.
