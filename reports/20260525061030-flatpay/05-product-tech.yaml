- id: operating-model-hardware-software-and-integrations
  title: Operating model, hardware, software, and integrations
  body: 'The visible operating model is much easier to verify than the hidden backend. Flatpay discloses merchant-facing hardware, software, and support surfaces in considerable detail: the terminal product centers on the PAX 920Pro; the broader hardware lineup also names CPOS X5, Tab M10 Plus, printers, drawers, and scanners; the POS layer adds restaurant workflows such as table management and kitchen printing; and the portal layer handles transactions, payouts, staff, reporting, devices, and store settings for both terminal and POS merchants. Support docs show how data flows across surfaces: Z-reports sync into the portal, accounting connectors push revenue and payout data overnight, and Shopify setup uses a Flatpay-issued API key with a partner payment provider. Public developer signal is narrow but real. A current DevOps posting points to AWS, ECS, RDS, IoT, VPC, GitHub Actions, Terraform, Docker, New Relic, and an on-call rotation. That is enough to infer a modern cloud-and-device operating
    stack, but not enough to underwrite service topology, data segregation, auth design, or developer-platform quality from public evidence alone.'
  claimRefs:
