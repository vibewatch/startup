- id: differentiation-trust-and-control-gaps
  title: Differentiation, trust, and control gaps
  body: 'The clearest public differentiation is operational rather than purely technical. Flatpay''s flat-rate pricing, in-person installation, shared portal, nightly accounting exports, and 24/7 support create a package aimed squarely at small merchants that want commerce operations simplified. That can be a real moat against more self-serve providers, especially in restaurant and local-retail segments where hardware, tables, payouts, and bookkeeping have to work together. Trust and compliance evidence is more mixed. Flatpay does publish a legal hub, privacy page, and terms page; the help center documents staff permissions, refund controls, portal agreements, and accounting validations; and the underlying PAX terminal carries PCI PTS certification at the device level. But the retained public materials do not expose a dedicated trust or status center, formal uptime commitments, a public service-provider compliance pack, or deep public API/security documentation. Independent merchant feedback
    is also not uniformly positive: one documented complaint is that phone payments were not available through the terminal and that the limitation had not been made explicit during onboarding. The result is a product that looks operationally mature yet still under-disclosed for full technical diligence.'
