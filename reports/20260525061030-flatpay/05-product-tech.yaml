- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Payment terminal
    - SMB counter or mobile merchant
    - Mature live offer
    - Flat 0.99% card pricing, PAX hardware, automated reports, daily-payout positioning, on-site install
    - Public MOTO/phone-payment scope and deeper reliability metrics are not published
  - - Basic POS kit
    - Retail or hospitality merchant needing products + reports
    - Mature live offer
    - Adds inventory, reporting, and portal controls on top of payments at a flat-rate SMB price point
    - Precise hardware bill of materials and software release cadence are not published on core pages
  - - Premium POS kit
    - Higher-volume merchant needing countertop setup
    - Live offer with named premium hardware
    - Countertop form factor, customer-facing display, printer, and same portal/software layer as smaller kits
    - No public customer SLA or throughput benchmark for premium deployments
  - - Merchant portal / back office
    - Owner, manager, finance staff
    - Mature shared control plane
    - Unified view for transactions, payouts, reports, devices, staff, and agreements across terminal and POS estates
    - No public role-matrix detail beyond selected staff and refund controls
  - - Accounting integration layer
    - Merchant bookkeeper or accountant
    - Documented live connector layer
    - Nightly sync into e-conomic and Dinero reduces reconciliation friction
    - Connector depth beyond two named systems and error-handling observability are not public
  - - Online payments / e-commerce layer
    - Merchant with webshop or remote checkout need
    - Commercially active but less transparently documented
    - Separate pricing plus Shopify/Frisbii setup and third-party reports of widgets/APIs/plugins
    - Public API docs, auth references, and feature matrix remain thin
  - - Deployment + support service layer
    - New merchant going live
    - Mature operating layer
    - In-person walkthrough, on-site installation, preconfigured hardware, and 24/7 support are integral to the product motion
    - Support SLAs, incident-history transparency, and escalation metrics are not public
  notes: Rows synthesize retained official product pages, help-center docs, and independent reporting as of 2026-05-25; maturity labels describe public market availability, not internal usage or attach-rate metrics.
