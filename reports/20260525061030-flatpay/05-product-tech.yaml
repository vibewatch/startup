  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-trust-center
    missingEvidence: A dedicated public security, trust, or uptime-status surface with incident history, SLA framing, and service-provider control summaries.
    whyItMatters: Flatpay handles payments and is discussing AI and banking-adjacent roadmap items, so public trust disclosure matters for technical diligence and operational-risk underwriting.
    diligencePath: Request a trust-center package covering uptime reporting, incident disclosure policy, service-provider compliance attestations, and security contact process.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: api-and-architecture-docs
    missingEvidence: Public API reference docs, auth model details, webhook references, service topology, tenancy boundaries, encryption/key-management detail, and architecture diagrams for online payments and portal services.
    whyItMatters: Public sources support the workflow story but not full technical diligence on integration quality, security design, or platform scalability.
    diligencePath: Request a developer portal export, architecture deck, security questionnaire, and sample API / webhook documentation from Flatpay product or engineering leadership.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: roadmap-specificity
    missingEvidence: A dated release plan or milestone framework for AI agents, AI analytics, embedded-finance products, and any self-serve expansion paths.
    whyItMatters: Roadmap direction is visible, but timing, launch criteria, and customer availability remain too vague to underwrite delivery confidence.
    diligencePath: Request the internal roadmap, beta customer references, and product launch criteria for each roadmap line item.
