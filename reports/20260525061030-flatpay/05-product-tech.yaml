company:
  name: Flatpay
chapter:
  number: 5
  title: Product & Technology
  summary: 'Flatpay''s public product surface is a merchant-commerce stack rather than a single card reader: payment terminal, POS, online payments, shared back-office portal, accounting connectors, and a service layer built around in-person install plus 24/7 support. Public evidence is strongest at the workflow and operating-model layer—hardware lineup, portal functions, nightly accounting syncs, restaurant workflows, and support operations—and much thinner at the deep technical architecture layer. The product looks commercially mature for SMB card acceptance and POS deployment, but the diligence file remains incomplete on public API depth, service-provider security disclosures, public uptime/status reporting, and dated roadmap specificity around AI and future banking products.'
sections:
- id: product-lines-and-merchant-workflow
  title: Product lines and merchant workflow
  body: 'Flatpay''s own site presents the company as a three-part merchant stack: payment terminal, point of sale, and online payments. The product promise is not just cheaper acquiring; it is a full merchant workflow that begins with an in-person meeting, moves through solution selection, and ends with on-site installation of hardware and software. Pricing is positioned as flat-rate and easy to understand, with separate terminal, POS, and online-payment economics. Within that umbrella, the public module map is fairly clear. The terminal product focuses on fast card acceptance and automated reporting; the POS product adds inventory, product management, restaurant features, and richer operations controls; the customer portal acts as the reporting and configuration back office; accounting integrations sync payouts and turnover data; and the e-commerce layer uses partner/provider connections such as Shopify via Frisbii. Independent reviews and merchant comments broadly corroborate the same
    shape: setup is high-touch, hardware arrives preconfigured, and the strongest customer value proposition is simplicity for small merchants rather than bespoke developer customization.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE011
