- id: deployment-reliability-support-and-roadmap
  title: Deployment, reliability, support, and roadmap
  body: 'Deployment and support are part of the product story, not an afterthought. Official pages repeatedly pair the commerce software with in-person walkthroughs, on-site installation, daily payouts, customer-portal visibility, and 24/7 support. The support corpus adds operational detail: automatic Z-reports, digital receipts, order references, login-screen cellular checks, and conditional automatic updates tied to connectivity, battery, and device idle time. Independent sources reinforce that merchants receive preconfigured hardware and generally short time-to-live, while also highlighting that Flatpay''s service model is more hands-on than purely self-serve rivals. Roadmap disclosure is directionally useful but not deeply specific. TechCrunch, FoundersToday, Sacra, and TechFundingNews all point to expansion into new markets, AI-assisted features, a future banking suite, and deeper product development investment. Those signals support a credible expansion narrative, but Flatpay does
    not publish a dated product roadmap, release calendar, or public feature maturity framework for these forward-looking items.'
