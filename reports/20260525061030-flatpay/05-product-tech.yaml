- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Field sales + onboarding
    - Qualifies merchant, demos product, explains pricing, manages install
    - Local sales staff and deployment operations
    - High-touch motion can be expensive to scale and harder to standardize across markets
  - - PAX terminal hardware
    - Handles card-present acceptance, receipts, connectivity checks, and app updates
    - PAX A920Pro hardware and merchant network/cellular access
    - Hardware/vendor concentration and device-fleet management risk
  - - POS client layer
    - Runs products, tables, reports, and merchant checkout workflows on tablet or countertop hardware
    - Flatpay POS software plus named devices such as Tab M10 Plus and CPOS X5
    - Public performance, offline-mode, and update-channel details are thin
  - - Merchant portal
    - Shared browser-based back office for transactions, payouts, reports, staff, devices, and agreements
    - Flatpay web application and account/permissions model
    - Role granularity and audit logging depth are not publicly documented
  - - Reporting + payout layer
    - Aggregates transactions into Z reports, payout views, and downloadable records
    - Portal, terminal sync, bank-account settlement flows
    - No public status page, payout SLA, or data-retention schedule for these reports
  - - Accounting connectors
    - Exports revenue, payouts, fees, and attachments into bookkeeping software overnight
    - e-conomic, Dinero, and customer-configured account mappings
    - Connector breadth is narrow in public docs and mapping mistakes remain user-sensitive
  - - E-commerce connector layer
    - Links merchant web shops to Flatpay-supported payment flows
    - Frisbii on Shopify plus third-party reported widgets/APIs/plugins
    - Developer documentation and plugin coverage are not published deeply enough for full diligence
  - - Cloud / DevOps platform
    - Supports application deployment, monitoring, and on-call response across European growth
    - AWS, ECS, RDS, IoT, VPC, GitHub Actions, Terraform, Docker, New Relic, engineering on-call
    - Public source does not disclose service topology, tenancy model, encryption architecture, or failover design
  notes: Architecture rows are limited to components evidenced in official pages, help docs, a current Flatpay DevOps job post, and vendor hardware materials; hidden backend internals are intentionally left undescribed.
