  - id: financial-model-people
    title: Financial/model and people/execution risk
    body: >-
      Flatpay's model risk is unusually visible because the company has chosen an easy-to-understand merchant proposition while still scaling through a labor-intensive go-to-market motion. News coverage says the business was still unprofitable after the 2025 round even as ARR was accelerating sharply, and public statutory profiles show meaningful losses at the entity level alongside only partial visibility into consolidated revenue. That is not disqualifying for a fast-growing fintech, but it means investors are underwriting operating leverage that has not yet been demonstrated in public filings. The pricing model also matters. A 0.99% headline rate is attractive, but as card mix shifts across non-EU cards, business cards, surcharge exceptions, interchange caps, and partner commissions, margin pressure can accumulate away from the merchant interface. People risk compounds that model risk. Flatpay's own and third-party materials describe a direct, in-person sales motion and a very large planned employee base, while the UK market is still relatively new and compliance scope now spans payments, data, AML, and merchant funding. The result is a classic scale-up tension: strong growth can mask weak control depth until the company is managing too many markets, products, and partners at once.
