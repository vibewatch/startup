company:
  name: Flatpay
chapter:
  number: 7
  letter: R
  title: Risks
  summary: >-
    Flatpay's main risk is that its hypergrowth, flat-rate pricing promise, and expanding product scope are all riding on third-party acquirers and partners whose identities and economics are only partly visible in public evidence. The reviewed record supports a strong merchant proposition, but it also shows long contract lock-ins, strict breach triggers, loss-making expansion, and new embedded-finance exposure. Residual risk is therefore highest in partner dependence and financial/model execution rather than in top-line demand alone.
sections:
  - id: ranked-overview
    title: Severity-ranked risk overview
    body: >-
      Flatpay's strongest public evidence still describes a business in aggressive expansion mode rather than a mature, de-risked payments platform. Independent reporting says the company reached unicorn status in late 2025, was still unprofitable, and was targeting another step-change in ARR during 2026, while its own website continued marketing a simple flat-rate proposition with daily payouts and 24/7 support. That combination is powerful commercially, but it creates a narrow margin for execution error. The business is promising merchants clarity while relying on acquirers, gateways, and partner processes that are only partly disclosed. It is also expanding operating scope beyond terminals into online payments, reporting workflows, and embedded finance. In that context, the highest-severity risks are not abstract macro worries: they are acquirer dependence, margin compression under a flat-rate model, contract and complaint friction if service quality slips, and the possibility that loss-making growth outpaces operational controls. The heatmap therefore ranks partner concentration, pricing/model pressure, and execution across multiple products ahead of pure demand weakness.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR007
      - CR009
      - CR019
      - CR048
    figureRefs:
      - FR001
  - id: regulatory-legal-structure
    title: Regulatory, legal, and contracting perimeter
    body: >-
      The most important legal fact in Flatpay's public materials is that the company does not say it processes card transactions itself. Instead, the UK terms and agency agreement describe a structure in which merchants are onboarded into separate acquirer contracts designated by Flatpay, with power of attorney and KYC/data-sharing flows embedded in the setup. That arrangement is commercially efficient, but it leaves investors with only partial visibility on the actual acquiring counterparties, switching rights, and regulated-entity perimeter in each market. Contract terms are also merchant-stringent: PCI failures, routing volume outside Flatpay's stack, or other material breaches can trigger immediate termination; the initial term is 36 months; and partner termination can cascade into merchant termination. Add surcharge and DCC features whose compliance burden sits with merchants but depends on partner BIN lists, acquirer approval, and card-scheme rules, and the legal posture becomes a real operating risk rather than back-office paperwork. The residual question is not whether Flatpay has contracts; it does. The unresolved question is whether its partner and compliance architecture is robust enough to scale cleanly across markets and products.
    claimRefs:
      - CR010
      - CR011
      - CR013
      - CR015
      - CR016
      - CR017
      - CR026
      - CR027
      - CR029
      - CR047
