  evidenceGaps:
    - type: missing-source
      severity: material
      topic: acquirer-counterparties
      missingEvidence: Named acquirer and gateway counterparties by market, with switching rights, concentration split, and master service agreement terms.
      whyItMatters: Investors cannot size payout, underwriting, or service concentration risk when the core processing counterparties remain unnamed in public materials.
      diligencePath: Request the named partner roster, merchant-service agreements, and market-by-market ownership map under NDA.
      relatedQuestionRefs:
        - QR027
        - QR029
      relatedTableRefs:
        - TR001
        - TR003
    - type: private-evidence-only
      severity: material
      topic: payouts-and-disputes
      missingEvidence: Chargeback rates, dispute win-loss data, payout SLA attainment, and complaint volumes by acquirer and country.
      whyItMatters: Flatpay can contractually shift settlement and disputes to partners, but merchants will still judge Flatpay on payment outcomes and support quality.
      diligencePath: Review dispute dashboards, payout timeliness reports, complaint breakouts, and top-issue themes by market.
      relatedQuestionRefs:
        - QR007
        - QR009
        - QR016
        - QR029
      relatedTableRefs:
        - TR002
        - TR003
    - type: private-evidence-only
      severity: material
      topic: security-and-resilience
      missingEvidence: PCI attestations, security certifications, uptime history, and post-incident documentation for the operating stack.
      whyItMatters: A clean public status page and policy statements do not establish durable resilience across terminals, online payments, portal workflows, and merchant funding.
      diligencePath: Obtain PCI/security evidence, uptime history, and a sample incident or root-cause review process.
      relatedQuestionRefs:
        - QR015
        - QR029
      relatedTableRefs:
        - TR001
        - TR002
    - type: private-evidence-only
      severity: material
      topic: capital-credit-risk
      missingEvidence: Capital approval rates, delinquency and loss cohorts, complaints routing, and economic loss-sharing terms between Flatpay and Liberis.
      whyItMatters: Without portfolio-performance evidence, investors cannot judge whether Capital is a modest upsell or a meaningful credit and reputational risk amplifier.
      diligencePath: Request cohort performance, collections scripts, partner economics, and complaint trends for Capital.
      relatedQuestionRefs:
        - QR024
        - QR025
        - QR029
      relatedTableRefs:
        - TR005
        - TR006
    - type: conflicting-data
      severity: material
      topic: reporting-scope
      missingEvidence: A clean bridge between website-level group metrics and statutory entity counts, revenue, and loss figures.
      whyItMatters: Investors need to know whether the marketed scale, staffing, and economics sit in the same entities that bear legal obligations and reported losses.
      diligencePath: Obtain consolidated management accounts and a legal-entity bridge covering revenue, headcount, cash burn, and obligations.
      relatedQuestionRefs:
        - QR020
        - QR021
        - QR029
      relatedTableRefs:
        - TR004
        - TR006
    - type: missing-source
      severity: material
      topic: enforcement-record
      missingEvidence: Any named regulatory, supervisory, or court record explicitly addressing Flatpay's payments, AML, privacy, or merchant-funding activities.
      whyItMatters: A clean public source set may mean clean execution, or it may simply mean the most relevant records sit in registers and complaints channels not surfaced publicly.
      diligencePath: Run counsel-led checks across each operating market's regulator, ombudsman, and court systems and document explicit nil results if none exist.
      relatedQuestionRefs:
        - QR031
      relatedTableRefs:
        - TR001
