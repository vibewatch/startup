  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Hidden acquirer concentration
        - Named partner disclosures, merchant-service agreement visibility, switching rights
        - Investor diligence still cannot identify the real acquirer/gateway stack or reveals single-partner concentration
        - Apply a higher dependency discount and require partner diligence before underwriting base-case retention
      - - Margin compression under flat pricing
        - Gross margin by card mix, surcharge usage, non-EU volume, partner fee take rates
        - Margin misses persist while high-cost card mix rises or surcharge economics worsen
        - Re-underwrite unit economics and reduce valuation support from headline merchant growth
      - - Complaint-led churn from contract friction
        - Refund, cancellation, payout-delay, and early-termination complaint trends
        - Visible complaint spike around lock-ins, fees, or service delays across one or more markets
        - Raise churn assumptions and test whether gross merchant counts overstate true attachment
      - - Loss persistence after 2026 growth targets
        - ARR versus plan, burn, and operating leverage indicators
        - 2026 ARR or productivity targets miss materially while statutory losses stay elevated
        - Assume follow-on funding risk and lower confidence in the current scaling playbook
      - - Capital product stress
        - Approval conversion, repayment delinquency, complaints, and partner loss-sharing terms
        - Material delinquency/complaint issues emerge or partner economics worsen
        - Treat Capital as a brand and balance-sheet-adjacent risk, not a harmless add-on
      - - Compliance or resilience event
        - Security incidents, regulator outreach, PCI exceptions, or partner compliance notices
        - First material incident, enforcement contact, or repeated control failure becomes visible
        - Pause upside assumptions until root-cause evidence and remediation quality are verified
