    title: Regulatory / legal risk register
    type: enumeration
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the highest-severity public legal, regulatory, and contracting exposures visible from reviewed Flatpay terms, registry records, support materials, partner disclosures, and regulator guidance as of 25 May 2026.
    columns:
      - Rule / structure
      - Jurisdiction / owner
      - Public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Acquirer designation and partner-termination cascade
        - UK / multi-market payments stack
        - Merchants are tied to Flatpay-designated acquirers; partner break can end the merchant contract
        - High
        - Critical
        - Contracted partner model and formal onboarding flows exist
        - High — named counterparties, switching rights, and concentration are not public
        - Obtain named acquirer and gateway roster plus merchant-service agreements by market
      - - PCI / routing / breach regime
        - UK merchant terms
        - PCI failure, unauthorized access, non-approved gateway use, or not routing full card volume can trigger termination
        - Medium-High
        - High
        - Clear contractual rules and support structure
        - Medium-High — strict rights can create churn and complaint spikes if enforced aggressively
        - Review cure practices, exception logs, and termination history
      - - Surcharge and DCC compliance
        - UK / EEA card acceptance
        - Merchant must handle signage, disclosure, fee sizing, and customer consent while Flatpay depends on partner BIN lists and approvals
        - Medium
        - High
        - Help content and terms explain the operating rules
        - Medium-High — card-scheme or disclosure errors can trigger disputes, fines, or acquirer friction
        - Review compliance notices, training scripts, and chargeback/compliance event data
      - - KYC, data-transfer, and privacy perimeter
        - Multi-market onboarding
        - Merchant onboarding requires acquirer KYC and data transfer; Flatpay states GDPR/AML controls at policy level
        - Medium
        - High
        - ESG policy and contract language establish governance expectations
        - Medium — control outcomes and certifications are not publicly audited
        - Request DPIAs, PCI/security attestations, SAR metrics, and supervisory correspondence
      - - UK establishment and regulated-entity mapping
        - Denmark / United Kingdom
        - UK establishment exists, but product-by-product permissions and complaint routes remain only partly visible publicly
        - Medium
        - High
        - Companies House record and acquirer-led structure provide a legal wrapper
        - High — regulatory perimeter across products and markets is still opaque
        - Map each market and product to the responsible legal entity, permission, and complaints route
      - - Embedded-finance complaints perimeter
        - Denmark / Finland / UK partner chain
        - Flatpay Capital uses a partner whose cash advance is not treated as an FCA-regulated loan or FOS-covered complaint route
        - Medium
        - High
        - Geography is currently limited and partner disclosure is explicit
        - Medium-High — collections or complaints can still rebound on Flatpay's brand
        - Review partner agreement, loss-sharing terms, and complaint-handling scripts
