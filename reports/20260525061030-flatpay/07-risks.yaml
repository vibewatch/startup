  - id: operations-partners
    title: Operational, service, and dependency risk
    body: >-
      Operationally, Flatpay is no longer a simple terminal vendor. The reviewed support and product material spans terminals, POS, online payments, reporting downloads, PIN-based staff access, and Capital. That broader footprint matters because service failure can show up in several places at once: acquirer-driven payouts, gateway/software uptime, report generation, merchant onboarding, or customer support response quality. Public review evidence is broadly positive and the status page shows no incidents in visible history, but that is not enough to prove durable resilience. The public record does not disclose independent uptime data, security attestations, named processing partners, or incident postmortems. Merchant pain points can also emerge from the contract stack itself: review text already notes that transfers can take a couple of days, while the UK terms put disputes and chargebacks on the merchant-acquirer relationship rather than on Flatpay. In practice, that creates a blame-loop risk where merchants still judge Flatpay for service outcomes it contractually pushes downstream. Because the company also depends on equipment finance, courier logistics, gateway partners, and card-scheme/BIN-list updates, the dependency web is denser than the marketing story suggests.
