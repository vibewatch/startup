- id: scenario-valuation-and-return-framework
  title: Bull, base, and bear scenarios
  body: |-
    The valuation framework needs to respect two contradictory truths at once. First, Flatpay’s recent growth signals are exceptional: a move from 17,000 audited year-end-2024 customers to roughly 60,000 merchants in late 2025, more than 400% revenue growth, and management’s claim that ARR crossed €100 million in October 2025. Second, none of that yet comes with audited 2025 financials, disclosed cohort economics, or public evidence that the high-touch go-to-market model scales efficiently across each new country. The scenario ranges therefore hinge less on headline merchant count and more on what portion of that growth converts into durable run-rate revenue and narrower operating losses.

    Our bull case assumes run-rate revenue or ARR of roughly €350-400 million with strong cross-market execution and improved loss conversion, supporting €1.8-2.4 billion of value. The base case assumes a still-impressive €220-250 million run rate but only modest margin improvement, supporting €1.1-1.4 billion. The bear case assumes growth slows, CAC remains heavy, and public-market multiples stay tethered to the broader 1x-3x processor band, supporting only €0.6-0.9 billion. The probability-weighted value is about €1.3 billion, slightly below the last round. That does not make Flatpay a poor company; it makes the current price a thin-margin underwriting decision for new investors.
