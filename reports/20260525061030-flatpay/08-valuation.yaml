- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Merchant proposition
    - Flat fees, daily payouts, 24/7 support, and installation make Flatpay easy for SMBs to adopt.
    - The same service-heavy model may be expensive to scale versus self-serve peers.
    - Show cohort payback and support-cost leverage by country.
  - - Growth proof
    - Merchant count and 2025 revenue guidance suggest very rapid adoption.
    - Public evidence still leans on management claims rather than audited 2025 results.
    - Publish audited 2025 revenue, gross profit, and churn.
  - - Comparable support
    - Adyen-like premium multiples show payments platforms can command high prices when execution is elite.
    - Most broader public peers trade far below Flatpay’s implied multiple.
    - Demonstrate premium growth plus improving economics, not just customer count.
  - - Financing context
    - Top-tier investors continue to fund the company at scale.
    - Lifetime funding totals and preference terms remain unclear from public sources.
    - Provide full cap table and term summaries under NDA.
  - - Exit path
    - Another large private round or a later IPO is possible if scale and margins improve quickly.
    - Near-term IPO readiness is not established on current public evidence.
    - Show audited 2025 numbers, market-level unit economics, and governance maturity.
  notes: 'The anti-thesis is structural rather than existential: the business can still be strong while the price is too demanding.'
