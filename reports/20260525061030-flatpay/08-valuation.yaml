  rows:
  - - Recommendation
    - Track
    - Follow the company, but do not chase the last disclosed price without more evidence.
  - - Confidence
    - Medium
    - Commercial traction is real; valuation support still depends too heavily on forward targets.
  - - Risk rating
    - High
    - Execution, CAC, disclosure, and financing risks remain elevated.
  - - Valuation stance
    - Stretched at €1.5B
    - Current round needs 2026 execution or a premium-comparable lens to hold.
  - - Current price support
    - Conditional
    - The mark is supportable only if Flatpay grows into an Adyen-like multiple with much stronger 2026 revenue proof.
  - - Entry discipline
    - Prefer ≤ €1.1-1.2B or better evidence
    - A lower entry or audited 2025/2026 data materially improves risk/reward.
  - - Likely next step
    - Research more / wait for diligence
    - Request audited 2025 accounts, cap table, and cohort economics before underwriting.
  notes: 'Recommendation is price-sensitive: the same business can move from stretched to fair if audited revenue catches up or entry resets.'
