  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: A reconciled round-by-round financing history with signed amounts, dates, and securities issued.
    whyItMatters: Different funding totals change dilution math and whether the latest mark already sits on a large preference stack.
    diligencePath: Request the financing history from the CFO and reconcile it against board consents and closing documents.
    relatedQuestionRefs:
    - QV010
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table scope
    missingEvidence: A fuller like-for-like private comparable set with disclosed revenue, margins, and post-money terms for European SMB merchant-acquiring companies.
    whyItMatters: The comparable table is intentionally representative, but the strongest private marks remain sparse and partially opaque.
    diligencePath: Extend the comp set with additional secondary marks or private financing decks under NDA before final pricing.
    relatedQuestionRefs:
    - QV014
    - QV015
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-preferences
    missingEvidence: Fully diluted cap table, liquidation preferences, anti-dilution protections, and consent rights for all series.
    whyItMatters: Enterprise-value upside can still produce weak common-equity returns if seniority terms are aggressive.
    diligencePath: Request the cap table, shareholder agreement summary, and a waterfall model under NDA.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
