- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Value range
  - Key risk / signal
  - Decision implication
  rows:
  - - Bull
    - €350-400M run-rate revenue or ARR, strong multi-country execution, visibly better loss conversion, and public/private markets willing to pay ~6-7x forward revenue.
    - €1.8-2.4B
    - Requires management’s 2026 ambition to translate into audited scale rather than sales-story optics.
    - Upside exists, but it depends on aggressive execution that is not yet audited.
  - - Base
    - €220-250M run-rate revenue, growth slows from hypergrowth to merely strong, and margin improvement is real but incomplete.
    - €1.1-1.4B
    - Most consistent with current public evidence and comp normalization.
    - Slightly below the last round; supports Track rather than Buy.
  - - Bear
    - Growth slows sharply, CAC remains heavy, and the market values Flatpay closer to broader processors than to Adyen.
    - €0.6-0.9B
    - Any miss on 2026 scale or evidence of weak unit economics pushes the case here quickly.
    - Material downside from the last round.
  notes: Ranges are scenario-based enterprise-value proxies built from public comp bands and management-guided scale rather than a discounted cash-flow model.
