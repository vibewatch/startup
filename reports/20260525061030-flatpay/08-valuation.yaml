company:
  name: Flatpay
chapter:
  number: 8
  title: Valuation
  summary: Flatpay's €1.5 billion 2025 round prices the company like a premium payments platform before audited 2025 evidence shows premium-quality economics. Public comps and the 2024 filing support a strong growth story but point to a more cautious base-case fair value of roughly €1.1-1.4 billion, so the chapter lands on Track, medium confidence, high risk, and a stretched valuation stance at the last disclosed mark.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation, thesis, and price discipline
  body: |-
    Flatpay clearly has the ingredients of a compelling European SMB-payments story: transparent pricing, an in-person onboarding model that appears to resonate with under-served merchants, fast geographic rollout, and a headline growth profile that pushed the company to unicorn status in roughly three years. Public evidence is strongest on the commercial proposition itself. Flatpay’s own site consistently emphasizes flat fees, no hidden charges, daily payouts, 24/7 support, and on-site installation; independent coverage broadly corroborates that these features are the core adoption engine. The customer story is real as well, with the audited 2024 filing showing 17,000 customers at year-end and late-2025 coverage pointing to roughly 60,000 merchants, while the current website now markets more than 70,000 merchants.

    The anti-thesis is valuation and operating quality. The same public record that supports rapid merchant growth also shows a company still burning heavily: the 2024 annual report disclosed DKK 152.0 million of operating loss and DKK 151.7 million of net loss. At the latest €1.5 billion mark, Flatpay trades at roughly 12x expected 2025 revenue on public guidance. That is an Adyen-like multiple without Adyen-like profitability, scale, or disclosure quality. Our recommendation is therefore Track with medium confidence, high risk, and a stretched valuation stance. New money becomes more interesting below roughly €1.1-1.2 billion, or if audited 2025-2026 data validates a revenue run rate above ~€250 million with meaningfully better gross-profit conversion.
