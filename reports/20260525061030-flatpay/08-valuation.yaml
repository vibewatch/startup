- id: exit-readiness-diligence-and-thesis-breaks
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: |-
    Flatpay does not look ready for a public-market process on the information now available. The company has strong top-line momentum, but public evidence still lacks the pieces that determine whether a late-stage investor actually earns an attractive return: audited 2025 consolidated accounts, cohort-level retention, take-rate stability, CAC payback, fraud and chargeback loss disclosure, and the fully diluted preference waterfall. In other words, the diligence burden is not cosmetic. It goes directly to whether the latest round is a bridge to a premium exit or simply a fast-growing but still opaque capital raise.

    The most plausible near-term exit path is therefore another late-stage private round or secondary liquidity event, not a near-term IPO. Before paying up, investors should demand audited 2025 results plus 2026 monthly trading, the full cap table, and market-by-market unit economics. The main thesis-break triggers are equally straightforward: audited revenue or run-rate materially below the growth path embedded in the latest round, continued weak conversion of merchant growth into gross profit and narrower losses, or any next round that re-prices below the last mark or introduces punitive preference terms. If those triggers fire, the current growth story stops being a premium multiple case and becomes a restructuring of expectations.
