companyProfile:
  summary: >
    Celero Communications is a fabless semiconductor company founded in 2024 by
    Nariman Yousefi (CEO, ex-Marvell/Inphi) and Oscar Agazzi (CTO, ex-Marvell/
    Broadcom/ClariPhy). The company designs coherent DSP ASICs that process
    complex optical modulation formats (e.g., DP-16QAM/DP-64QAM) to enable
    400G–1.6T+ rack-to-rack optical links inside AI data centers. Its chips
    address the bandwidth bottleneck created by the rapid scaling of GPU clusters
    and distributed AI training workloads. Celero has raised approximately $140M
    across seed, Series A, and a November 2025 Series B led by CapitalG/Alphabet,
    implying a ~$1B post-money valuation. The company operates from Irvine,
    California with design centers in Victoria (BC, Canada) and Buenos Aires
    (Argentina).
  foundedDate: "2024-01-01"
  founders:
    - name: Nariman Yousefi
      role: Co-Founder & CEO
      background: >
        Former senior executive at Marvell Technology and Inphi Corporation;
        deep expertise in coherent DSP for telecom and data-center optical links.
      claimRefs: [CO009]
    - name: Oscar Agazzi
      role: Co-Founder & CTO
      background: >
        Former principal scientist at Marvell, Broadcom, and ClariPhy;
        pioneered key DSP algorithms for coherent optical communications.
      claimRefs: [CO010]
  foundingLocation: "Irvine, California, USA"
  headquarters: "Irvine, California, USA"
  productSummary: >
    Custom coherent DSP ASICs that convert optical signals between the digital
    and analog domains at 400G, 800G, and 1.6T+ line rates. By handling forward
    error correction, adaptive equalization, carrier recovery, and dispersion
    compensation in silicon, the chips remove the optical reach and bandwidth
    constraints that limit AI cluster scaling without the power and cost premium
    of traditional telecom-grade coherent modules.
  customerFocus: >
    Hyperscale cloud providers (Google/Alphabet, Microsoft, Amazon, Meta) and
    large-scale AI infrastructure operators (CoreWeave, xAI, Lambda Labs)
    building dense GPU clusters that require chip-to-chip and rack-to-rack
    optical connectivity beyond the range of conventional direct-detect optics.
  businessModel: >
    Fabless semiconductor: Celero designs coherent DSP chips and contracts
    manufacturing to leading foundries (assumed TSMC advanced nodes). Revenue
    is generated through chip sales on a per-unit basis, with pricing reflecting
    the high-performance, custom-ASIC nature of coherent optical devices
    (~$500–$5,000+ per chip depending on speed grade and volume).
  stage: "Series B"
  fundingStatus: >
    $140M total raised: $40M seed/Series A led by Sutter Hill Ventures and
    Valor Equity Partners; $100M Series B (November 2025) led by CapitalG
    (Alphabet's growth venture arm), implying approximately $1B post-money
    valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO004, CO009, CO010, CO019, CO020, CO021]
