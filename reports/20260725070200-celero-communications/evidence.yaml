evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Exact post-money valuation for the 2025 Series B and any explicit unicorn-status confirmation are not publicly
      disclosed in reviewed sources.
    whyItMatters: Valuation is a core benchmark for stage, dilution, and later return expectations.
    diligencePath: Request the Series B term sheet or cap-table summary from management or lead investors.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: financial-gap
    missingEvidence: Revenue, ARR, gross margin, and other operating financial metrics are absent from public sources.
    whyItMatters: Without revenue disclosure, the company’s scale and efficiency cannot be benchmarked against the capital raised.
    diligencePath: Request management financial statements or a board package covering revenue, bookings, and burn.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: customer-gap
    missingEvidence: Customer count, customer concentration, and named commercial design wins are not publicly disclosed.
    whyItMatters: >-
      Commercial proof is essential for judging whether the funding round reflects product-market adoption or only
      technical promise.
    diligencePath: Request a customer pipeline, design-win list, and any hyperscaler or module-partner references under NDA.
    relatedQuestionRefs:
      - QO017
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: headcount-gap
    missingEvidence: Exact employee headcount is not publicly disclosed even though current hiring is visible.
    whyItMatters: Headcount is a basic scale metric and helps evaluate capital efficiency and organizational maturity.
    diligencePath: Request a current org chart and total employee count by site.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Public materials do not disclose the full board package, voting/control rights, detailed cap table, debt
      facilities, or any secondary transactions.
    whyItMatters: >-
      Control rights and financing structure can materially affect governance, liquidation outcomes, and follow-on
      financing flexibility.
    diligencePath: Request financing documents, board roster, investor rights agreements, and any debt or secondary summaries.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: A bottom-up short-reach coherent DSP SAM or SOM by socket class, reach tier, and customer segment.
    whyItMatters: Without a true SAM, valuation depends on management assumptions embedded in a broad optics narrative.
    diligencePath: >-
      Request Celero's internal market model showing reachable sockets, ASPs, and attach rates by 800G, 1.6T, and
      coherent-lite use case.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-split
    missingEvidence: Named design wins or pipeline split between module OEMs, switch vendors, hyperscalers, and neo-cloud customers.
    whyItMatters: The buyer chain determines sales-cycle length, concentration risk, and who controls pricing power.
    diligencePath: >-
      Ask management for customer pipeline stages, qualification owners, and revenue concentration assumptions by
      channel.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: cpo-adoption-timing
    missingEvidence: >-
      A reconciled deployment timeline separating initial trials, first production ramps, and mass adoption for scale-up
      versus scale-out.
    whyItMatters: Bullish and cautious public timelines produce different revenue timing and capital-needs outcomes.
    diligencePath: Request the company's socket roadmap and compare it with hyperscaler and OEM qualification milestones.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM004
  - type: stale
    severity: minor
    topic: public-pricing-asp
    missingEvidence: Public ASP, gross-margin, or attach-rate data for coherent-lite and short-reach coherent modules in AI campuses.
    whyItMatters: Without pricing context, even strong demand signals do not convert into a defensible obtainable-market estimate.
    diligencePath: Use customer interviews or confidential OEM checks to triangulate module and DSP economics.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: paywalled-analyst-detail
    missingEvidence: >-
      Full analyst tables from IDTechEx, Yole, and Cignal that would reconcile ports, dollars, and deployment timing
      more cleanly.
    whyItMatters: Headline summaries are enough for directional analysis but not for a precise market model.
    diligencePath: Obtain the full paid reports or analyst notes during management diligence.
    relatedQuestionRefs:
      - QM022
      - QM024
  - type: private-evidence-only
    severity: material
    topic: customer-names
    missingEvidence: Named production customers, module partners, or hyperscaler design wins for Celero and several startup rivals.
    whyItMatters: Without customer identities, it is hard to separate genuine deployment traction from early evaluation activity.
    diligencePath: >-
      Request current design-win pipeline by customer tier, qualification stage, and expected production timing under
      NDA.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: missing-source
    severity: material
    topic: pricing-visibility
    missingEvidence: >-
      Public ASPs, list pricing, or discount structures for merchant DSPs, optical engines, and package-integrated
      solutions.
    whyItMatters: >-
      Pricing opacity prevents a hard view of whether Celero can earn premium margins or must discount to enter module
      and hyperscaler sockets.
    diligencePath: >-
      Obtain sample quotes, module BOM deltas, and expected ASP erosion by node and bandwidth tier from management or
      channel partners.
    relatedQuestionRefs:
      - QP013
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: manufacturing-capacity
    missingEvidence: >-
      Foundry, packaging, test, and yield data that proves Celero can match incumbent ramp reliability under hyperscaler
      timelines.
    whyItMatters: >-
      Competitive durability in optics is as much a manufacturing problem as a chip-design problem, especially if the
      industry shifts toward CPO.
    diligencePath: >-
      Ask for package flow, foundry or test partners, qualification milestones, and contingency plans for reliability
      failures or supply shortfalls.
    relatedQuestionRefs:
      - QP022
      - QP025
    relatedTableRefs:
      - TP004
  - type: stale
    severity: minor
    topic: lightmatter-funding
    missingEvidence: A recent primary or high-reputation source disclosing Lightmatter’s current funding or valuation status in 2026.
    whyItMatters: >-
      Scale and runway influence how aggressively Lightmatter can subsidize long qualification cycles and ecosystem
      partnerships.
    diligencePath: >-
      Fetch a recent financing disclosure, investor release, or direct company statement before using Lightmatter
      capital scale in valuation work.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Monthly cash burn, current cash balance, wafer commitments, and management runway model.
    whyItMatters: These inputs determine whether the $140M raise funds execution or merely buys time until the next financing.
    diligencePath: Request monthly cash bridge, quarterly board budget, and downside runway model from finance.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-margin
    missingEvidence: SKU-level ASPs, discounts, yield assumptions, and gross-margin waterfall by speed grade.
    whyItMatters: >-
      Premium coherent pricing is the core bull case, but without price realization and cost data the margin path is
      speculative.
    diligencePath: Open data room with price list, booked contracts, yield reports, and costed BOM by product generation.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
