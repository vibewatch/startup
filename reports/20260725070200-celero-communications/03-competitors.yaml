chapter:
  number: 3
  title: Competitive Landscape
  summary: Celero is entering a crowded AI optical interconnect field led by Marvell and Broadcom, with well-funded optical startups and electrical substitutes competing for the same budgets. Public evidence suggests Celero’s focus is differentiated, but distribution power, manufacturing proof, and roadmap breadth still favor incumbents and adjacent CPO platforms.
sections:
- id: competitive-landscape
  title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
  body: |-
    Celero is not entering an empty category. The direct battle is against merchant optical-DSP incumbents that already sell into hyperscale and module ecosystems, especially Marvell and Broadcom, plus well-funded optical-interconnect startups such as Celestial AI, Ayar Labs, and Lightmatter. The landscape also includes adjacent chiplet-interconnect vendors such as Eliyan, incumbent silicon-photonics or component suppliers such as Intel and Coherent, and status-quo module vendors such as InnoLight. Together, those alternatives cover most ways a buyer can solve the same problem of moving more data among AI accelerators, switches, and racks without blowing up power or latency budgets.

    The substitute set is equally important. For the shortest and most tightly coupled scale-up domains, NVIDIA NVLink and chiplet standards such as UCIe can soak up budget before an optical link is even considered. For established data-center buying centers, the incumbent operating model is still to qualify merchant pluggables and transceivers rather than to take risk on a new coherent-DSP startup. That means Celero must win not only on raw optical merit, but also against habit: existing suppliers, familiar qualification flows, and architectures that keep optics at the module or package boundary instead of introducing a new DSP vendor into the stack.

    The practical result is a layered battlefield. Celero’s direct wedge is coherent DSP for AI scale-across and optical connectivity, but the real comparison set spans merchant DSPs, module suppliers, co-packaged-optics startups, and electrical substitutes. Buyers can multi-source modules, stay with existing pluggable ecosystems, or pursue internal chiplet and scale-up fabrics. That breadth constrains how much pricing power or lock-in any startup can expect before it proves production readiness and design-win traction.
