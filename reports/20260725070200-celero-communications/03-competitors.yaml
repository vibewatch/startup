- id: switching-costs-and-distribution
  title: Switching cost, distribution power, and commercial opacity favor incumbents
  body: |-
    Competitive durability in this market depends less on brand and more on where a vendor sits in qualification and packaging flows. Broadcom and Marvell already speak the language of early-access customers, partners, and volume ramps. Broadcom explicitly points customers to direct sales for pricing and samples, while Futurum notes that long transceiver qualification cycles make early design wins sticky. Marvell likewise highlights mass-volume shipments and a broad installed base. Those signals matter because once a DSP, optical engine, or co-packaged design is validated into a module or rack architecture, buyers face retest cost, firmware and FEC tuning work, and schedule risk if they switch suppliers.

    Startups have mixed positions. Ayar and Lightmatter both talk about manufacturing readiness, partner engagement, and early-access programs, but public evidence still points to a go-to-market motion centered on design partnerships rather than broad catalog sales. Celestial AI claims deep hyperscaler and packaging engagement, which could translate into concentrated but powerful channels if those projects ship. Coherent and InnoLight illustrate another challenge for Celero: the status quo often lets buyers stick with familiar module vendors that can source DSPs underneath, reducing visibility for an upstart silicon brand. In that world, multi-homing exists, but much of the power sits with module makers, hyperscalers, and platform owners rather than with a standalone DSP startup.

    The most notable unknown is commercial transparency. None of the reviewed sources publish real list prices for DSP silicon. Customer names, realized ASPs, and production-volume commitments remain largely private. That makes it hard to prove Celero has near-term pricing leverage, and it raises the odds that commercial power accrues to whoever already controls qualification windows, partner ecosystems, and manufacturing capacity.
