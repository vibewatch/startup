      - number: '3.2'
        title: 'Direct competition: incumbents already span the stack while startups push CPO and photonic fabrics'
        blocks:
          - type: paragraph
            body: >-
              Marvell and Broadcom set the hardest benchmark because both can meet customers where volume ramps already
              happen. Marvell now markets PAM4, coherent, and coherent-lite DSPs across short-reach, campus, and
              longer-distance data-center links, and says its 3nm Ara platform is already shipping in mass volume to
              global hyperscalers. Broadcom’s portfolio is similarly broad: optical DSPs, lasers, SerDes, CPO, and
              PCIe-over-optics, with the company claiming shipment volume in adjacent optical components and early
              sampling for new 1.6T platforms. In other words, Celero is not just competing with two chip SKUs. It is
              competing with incumbents that can bundle roadmap credibility, standards participation, and module-partner
              relationships.


              The startup field attacks from a different angle. Celestial AI pushes a broader Photonic Fabric story from
              package to rack. Ayar Labs emphasizes optical I/O chiplets and remote light sources that can replace
              copper within and across racks. Lightmatter pushes a 3D photonic interconnect roadmap, larger reference
              systems, and ecosystem ties such as NVIDIA NVLink Fusion. These companies are not identical substitutes
              for Celero, but they all compete for the same strategic budget line: solving AI interconnect bottlenecks
              with more optical content closer to compute. If customers migrate toward co-packaged or near-packaged
              optics, Celero’s coherent-DSP wedge could narrow unless its architecture also fits those deployment
              models.


              Celero’s strongest relative differentiator is focus. Its public story is coherent DSP for scale-across
              optical connectivity, not a broad portfolio. That can help if customers want a specialized engine rather
              than a platform vendor. The risk is that incumbents and adjacent startups already present broader product
              maps, deeper sampling pipelines, and more visible ecosystem anchors than Celero has disclosed publicly so
              far.
