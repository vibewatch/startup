        blocks:
          - type: paragraph
            body: >-
              There is no public NRR, GRR, churn, contract-length, or customer-satisfaction disclosure for Celero, so
              durability has to be inferred from semiconductor and interconnect buying behavior rather than measured
              directly. The good news is that the end market is real and urgent. AWS, NVIDIA, CoreWeave, and OIF
              materials all describe AI infrastructure moving to tens of thousands or even millions of chips, with
              deterministic latency, interoperability, and non-blocking networks becoming design constraints rather than
              optional upgrades. Those conditions make qualification cycles lengthy and can increase stickiness once a
              component is approved into a production architecture, because requalification is expensive and supply
              continuity matters. The bad news is that time-to-production is slow and system-wide. CoreWeave’s 2026
              production-inference analysis says most enterprises take more than four months from buying GPU capacity to
              serving their first production request, while supply and infrastructure availability remain binding
              constraints. In practical terms, Celero may benefit from long-lived sockets once won, but investors cannot
              yet verify whether the company has any such sockets in production or whether evaluations are converting at
              an attractive rate.
