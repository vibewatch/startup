  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Celero is aiming at a narrower market than all optical networking and a broader one than conventional
              long-haul coherent telecom. The core included spend is the optical signal-processing and interconnect
              layer that lets AI clusters scale across racks, rows, campuses, and eventually multi-site compute fabrics:
              coherent or coherent-lite DSPs, coherent pluggables, optical transceivers, and future CPO or near-packaged
              optical engines that displace electrical bottlenecks. Cisco's DCI material and Celero's own positioning
              both point to the same job-to-be-done: move very large data volumes among distributed AI systems with
              acceptable latency, reach, power, and serviceability. Excluded spend should include generic GPU or server
              capex, memory, power infrastructure, and most legacy carrier transport budgets. The most important
              substitutes today are still short-reach PAM4 and copper or AEC links inside racks, plus legacy telecom
              coherent for longer reaches. Celero's thesis exists because neither status quo is ideal across the full AI
              scale-across problem: PAM4 and electrical links win on simplicity at short reach, while legacy coherent
              remains overbuilt and too power-hungry for dense data-center economics.
