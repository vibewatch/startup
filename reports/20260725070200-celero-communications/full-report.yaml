      - number: '3.4'
        title: Moat durability is constrained by roadmap crowding, CPO migration, and internal-build risk
        blocks:
          - type: paragraph
            body: >-
              Celero’s likely moat claims are technical focus, coherent-DSP expertise, and founder pedigree. Those are
              real, but durability is mixed. Founder overlap with Marvell, Broadcom, Inphi, and ClariPhy gives Celero
              credible execution DNA, yet it also shows that core talent and knowledge are not unique to the company.
              Meanwhile, the 2026 market evidence points to roadmap crowding rather than white space. LightCounting
              already tracks Celero alongside larger incumbents and other emerging suppliers; Futurum describes a race
              where vendor selection at 1.6T can lock customers into the 3.2T path; and SemiEngineering argues that CPO
              could compress the window for pluggable-DSP architectures as reliability evidence accumulates.


              The most serious displacement risk is architectural rather than purely competitive. If Broadcom, NVIDIA,
              or hyperscalers pull more of the interconnect stack in-house, merchant DSP vendors face a smaller
              addressable pool. If customers jump from pluggables to co-packaged or near-packaged optics faster than
              Celero expects, a coherent-DSP niche aimed at scale-across links may not capture the highest-value
              sockets. And even if the market grows overall, growth can still be bad for a startup when it invites more
              capital, more incumbents, and more standards-based substitutes.


              That does not mean Celero has no path. The company could still win if coherent-lite or scale-across
              optical links become a stubborn bottleneck that incumbents under-serve, or if customers want a focused
              merchant alternative instead of a bundled platform. But public evidence today supports a cautious view:
              Celero’s differentiation exists, yet its durability is not proven until the company shows customers,
              manufacturing partners, and reasons its approach survives the shift toward broader optical platforms and
              internalized AI interconnect stacks.
