      - number: '7.2'
        title: Legal, Regulatory, and Geopolitical Exposure
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory risk is material even without a known public dispute today. Celero’s leadership bench
              was built from former Marvell, Inphi, Broadcom, and ClariPhy talent, and U.S. trade-secret law gives prior
              employers meaningful remedies if they believe protected know-how was carried into a new venture. The
              Defend Trade Secrets Act permits ordinary civil claims and, in extraordinary cases, ex parte seizure
              orders, which means a dispute could be value-destructive long before final adjudication. On the export
              side, the company operates in a semiconductor category that sits inside active U.S. advanced-computing
              controls. BIS administers the EAR, maintains party-based restrictions such as the Entity List and MEU
              controls, and in May 2026 reaffirmed that licenses remain required for certain advanced-computing items
              involving D:5 and Macau-headquartered entities. Any eventual export classification or customer-ownership
              issue can therefore affect Celero’s reachable market, partner selection, and delivery timing. CHIPS
              guardrails add another layer: if Celero later seeks federal incentives, material expansion in countries of
              concern or restricted technology licensing can trigger clawback or disqualification. Finally, the most
              important manufacturing base for advanced semiconductors remains geographically concentrated, and TSMC
              itself warns that export controls, sanctions, earthquakes, cyberattacks, and geopolitical tensions can
              disrupt supply.
            claimRefs:
