      - number: '4.4'
        title: Capital adequacy, financing dependency, and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Publicly, Celero’s financing story is stronger than its operating disclosure. The company has disclosed
              $140M of total equity funding and has said the new capital is intended to expand silicon development and
              commercialization across hyperscale and cloud customers. That is enough to support the next stage of
              development, but it is not enough information to underwrite liquidity with confidence. There is no public
              cash balance, no disclosed monthly burn, no stated runway, no debt or project-finance obligation, and no
              visibility into wafer prepayments, substrate reservations, or whether one or more leading-edge respins are
              already budgeted. Benchmark evidence points to two simultaneous truths: AI-interconnect startups can still
              raise large rounds when they solve obvious bottlenecks, and advanced optical supply chains remain exposed
              to laser shortages, packaging bottlenecks, and deployment delays that can stretch time-to-revenue. In
              practical terms, Celero’s next-round trigger is likely not another abstract technology milestone but proof
              of customer qualification and credible production timing. Until management discloses sample status,
              revenue mix, gross margin bridge, and cash-burn math, the financial verdict is cautious: revenue quality
              is still unproven, the margin path may be attractive but not yet demonstrated, and capital intensity is
              high enough that a missed qualification window could force another financing before durable scale
              economics are visible.
