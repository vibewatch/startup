  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and recognition constraints
        blocks:
          - type: paragraph
            body: >-
              Celero is a fabless semiconductor startup, so its economic engine is hardware revenue rather than
              recurring software subscriptions. Public materials consistently describe the product as a coherent DSP
              chip/platform that lets hyperscalers and cloud operators move more data over fiber with lower power and
              better bandwidth efficiency, implying monetization through chip sales, reference-platform design wins, and
              potentially engineering-sample or NRE payments before steady production volumes. What is not public is
              just as important: Celero has not disclosed any list price, contracted ASP, unit shipment, booked backlog,
              customer logo, or revenue contribution by product phase. Industry benchmarks show coherent DSPs are
              premium products whose ASPs can remain about 10x PAM4 DSP pricing because complexity is higher and volumes
              are lower, but those same benchmarks also show that future 1.6T adoption and new entrants can compress
              pricing. For underwriting, the central recognition issue is timing: investors need to distinguish
              pre-production NRE or qualification revenue from repeatable production shipments, because both can appear
              in a chip company before durable gross margins exist.
