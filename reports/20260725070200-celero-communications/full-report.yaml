  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Anchor and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              Celero's public valuation anchor is straightforward but incomplete: the company announced a $100 million
              Series B led by CapitalG inside a $140 million total funding history, and multiple independent reports
              treated that round as a roughly $1 billion unicorn mark. What is missing is the denominator. None of the
              reviewed public materials disclose revenue, gross margin, or named customer volume, so the round cannot be
              underwritten as a simple revenue-multiple story in the way public comps can. That matters because the
              public optics and AI-networking range is broad but still bounded: Coherent trades around 9.4x EV/revenue,
              Marvell around 21.2x, and Broadcom around 25.3x, with the latter two supported by scale, software or
              hyperscaler embeddedness that Celero has not yet publicly demonstrated. Private optical peers such as
              Celestial AI, Lightmatter, and Ayar Labs show that investors will pay strategic premiums for scarce
              interconnect assets, but those companies also disclose larger fundraising bases and, in some cases, more
              mature commercialization narratives. The $1 billion Celero mark is therefore credible as a scarcity
              premium, but only conditionally credible as a fundamentals-backed valuation.
            claimRefs:
