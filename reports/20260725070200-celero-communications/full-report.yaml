      - number: '7.4'
        title: Kill Scenarios, Mitigations, and Monitoring Signals
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to think about Celero is through kill scenarios rather than generic startup uncertainty.
              The first kill chain is silicon failure: if first silicon misses power, yield, or interoperability
              targets, Celero can absorb burn without generating the customer proof needed for the next financing or for
              volume commitments. The second is foundry or geopolitics: a TSMC access issue, a Taiwan disruption, or
              further export-control expansion can break schedule, shipment, or cost assumptions even if the design is
              technically sound. The third is commercial concentration: if one or two hyperscaler-scale pursuits fail,
              or if customers choose in-house designs or incumbent open-standard ecosystems instead, the gap between
              engineering spend and revenue could become untenable. The fourth is legal friction: even absent a public
              case today, a trade-secret or employment dispute at the wrong time could freeze recruiting, delay
              diligence, or narrow strategic options. Mitigations exist — strong capitalization, experienced founders,
              alignment with optical AI trends, and a market that clearly needs power-efficient long-reach interconnect
              — but the residual risk stays high until public evidence shows tape-out progress, measurable
              power-performance, customer qualification, and bench depth beyond the founding nucleus.
            claimRefs:
