      - number: '8.3'
        title: Recommendation, Confidence, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is track with medium confidence, a high risk rating, and a stretched valuation
              stance. That is more constructive than an avoid call because the market tailwind is real, the founding
              team has highly relevant backgrounds, and private comparables demonstrate that optical interconnect
              scarcity can sustain large marks when product-market fit arrives. It is less constructive than a buy
              because the reviewed evidence does not yet prove commercialization at the level a new investor would need
              to underwrite a strong return from a $1 billion entry. In practical terms, the investment committee does
              not need more stories about optical demand; it needs proof that Celero specifically is converting that
              demand into attachable sockets, revenue, and defensible economics. The fastest upgrade path is verified
              run-rate revenue above roughly $100 million, named hyperscaler or module-program wins, and
              deployment-level proof that Celero's bandwidth and power claims survive production environments. The
              fastest downgrade path is delayed tape-out, weak customer conversion, architecture migration away from
              DSP-heavy links, or round terms that materially subordinate new common-equity value.
            claimRefs:
              - CV003
