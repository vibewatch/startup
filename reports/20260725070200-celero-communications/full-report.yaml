      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Demand direction looks strong; adoption timing is the hard part. The growth drivers are clear across
              independent sources: hyperscaler AI capex remains elevated, Ethernet is winning share in AI back-end
              networks, port speeds are moving quickly from 800G to 1.6T, and both Cisco and Nvidia quantify meaningful
              power or uptime benefits when optics replaces stand-alone transport gear or pluggable-heavy architectures.
              But the constraints are equally material. LightCounting shows PAM4 still winning the near-term AI volume
              ramp, meaning coherent DSP vendors must wait for scale-across and coherent-lite use cases to mature.
              ADTEK, CNBC, and Gazettabyte all emphasize manufacturing yield, reliability, serviceability, and standards
              maturity as real blockers, while SemiEngineering presents a more bullish all-optical within five years
              view. Those timing differences matter for valuation because they change when Celero can move from niche
              design wins into mass deployment. Public data also leaves key gaps unresolved: no source here discloses a
              bottom-up SAM for short-reach coherent DSP in AI data centers, OEM versus hyperscaler budget splits are
              still inferred rather than reported, and attach rates or ASPs for coherent-lite inside AI campuses remain
              private.
