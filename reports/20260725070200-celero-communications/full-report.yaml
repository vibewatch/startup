      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of the clearest positive signals in Celero’s public record. Multiple sources
              identify Nariman Yousefi as co-founder and CEO and Oscar Agazzi as co-founder and CTO, with both men
              described as former senior leaders from Marvell, Inphi, Broadcom, and ClariPhy. That background fits the
              product thesis: Celero is not trying to invent a new end market, but to apply experienced coherent-optics
              and networking-chip talent to AI-cluster connectivity. Governance visibility, however, is much thinner
              than the financing headline. The 2024 SEC Form D provides more structure than the website does, naming
              Nariman and Oscar as executive officers and directors and listing Stefan Dyckerhoff and Robert Abbott as
              directors. The November 2025 financing announcement adds James Luo of CapitalG and reiterates Stefan
              Dyckerhoff as board-linked investors, while a California-registry mirror adds Avijit Roy as CFO. Even with
              those fragments, Celero still does not publicly present a full board roster, governance documents, or a
              deeper executive bench, leaving meaningful key-person dependence concentrated in the founders.
