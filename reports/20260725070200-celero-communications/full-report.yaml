      - number: '8.2'
        title: Methodology and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The right valuation method for Celero is a weighted, evidence-sensitive approach rather than a
              single-point comp. Public multiples establish gravity; private rounds show what strategic scarcity can
              command; and M&A precedents show why acquirers pay up when interconnect bottlenecks threaten broader
              platform roadmaps. On that basis, the bull case assumes Celero converts technical credibility into two or
              three hyperscaler or module-platform sockets and reaches roughly $180-220 million of medium-term revenue,
              which can support a $2.0-2.5 billion outcome if premium multiples hold. The base case assumes one
              meaningful deployment wave, slower but real revenue conversion toward roughly $75-100 million, and a
              still-premium 10-12x multiple that keeps value near the last-round mark at roughly $0.8-1.2 billion. The
              bear case assumes a one-cycle commercialization delay, heavier incumbent response, or a shift toward
              lower-power optical approaches that compress DSP content; that scenario can push value to roughly $0.4-0.7
              billion. Because public disclosures are thin, the scenario table is more decision-useful than false
              precision from a classic DCF.
