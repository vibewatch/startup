      - number: '1.3'
        title: Capitalization, Investors, and Metric Disclosure
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the most corroborated part of Celero’s company overview. The company’s own November
              17, 2025 release, Business Wire syndication, and Reuters coverage all support the same topline: $140
              million raised in total, including a $100 million Series B led by CapitalG and earlier seed plus Series A
              capital totaling $40 million led by Sutter Hill Ventures with participation from Valor Equity Partners,
              Atreides Management, Maverick Silicon, and others. A 2024 SEC Form D adds an earlier regulatory anchor by
              documenting nearly $30.0 million sold to 40 investors with a first sale date of December 11, 2024, and
              Intelligence360 later reported a separate notice for up to roughly $100 million in late 2025. What remains
              thin is the economic fine print. CB Insights classifies Celero as Series B and lists $138.4 million
              raised, but the public record reviewed here does not disclose an exact post-money valuation, debt
              facilities, secondary sales, or investor control rights. That means investors can verify the round stack
              and syndicate, but not yet underwrite the full capital structure from public evidence alone.
