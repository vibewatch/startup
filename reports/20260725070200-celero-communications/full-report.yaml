  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              Celero’s public story is compelling but still extremely early. The company was founded in 2024, raised
              $140 million by late 2025, and markets coherent DSP chips as the way to deliver low-power optical
              connectivity across AI infrastructure. Those same facts create the chapter’s highest residual risks.
              Technically, Celero is pursuing a category where incumbents already frame power, distance, and optical
              integration as gating requirements, and where failure on first silicon or qualification timing can erase
              valuable calendar time before revenue is visible. Operationally, the company is still hiring across core
              ASIC, firmware, verification, analog, and product roles, which implies that bench depth is still being
              assembled while the product roadmap is already expected to execute. Commercially, Celero’s public
              materials do not yet disclose named customers, foundry partner, or shipped product generation, so
              investors are underwriting architecture and team quality before market proof. Financially, a chip startup
              with no public revenue evidence but large capital needs can move quickly from well funded to capital
              constrained if tape-out, performance, or customer schedules slip.
            claimRefs:
              - CR001
