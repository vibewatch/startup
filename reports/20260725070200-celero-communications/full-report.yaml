      - number: '2.2'
        title: 'Sizing lenses: broad optics TAM, AI-fabric demand, and the narrower coherent window'
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a layered market view rather than one headline TAM. Yole's 2026 optical-transceiver
              outlook is the broadest usable lens, placing the market at $23.4 billion in 2025 and $112.3 billion by
              2031 with AI expected to become more than 90% of revenue by the end of the period. That is useful as an
              outer ceiling, but it includes a wider set of datacom optics than Celero can capture directly. Dell'Oro
              adds a middle lens through AI networking and optical transport: Ethernet switch sales tied to AI back-end
              networks have surged, switch spending for accelerated-server back-end networks is projected to top $100
              billion over 2025-2029, and optical transport rebounded to $16 billion in 2025 with AI-driven DCI pushing
              a 2026 growth forecast above $18 billion. LightCounting and Cignal then narrow the aperture to the
              coherent edge of the stack: PAM4 is still the near-term volume winner for 800G and 1.6T AI links, while
              coherent pluggables and coherent-lite are emerging where inter-building distance, power, and
              interoperability make them compelling. That means Celero's reachable SAM sits somewhere inside the broad
              optics boom but cannot yet be isolated cleanly from public evidence.
