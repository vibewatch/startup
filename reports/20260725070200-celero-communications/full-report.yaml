        title: GTM motion, sales-efficiency proxies, and public-traction gaps
        blocks:
          - type: paragraph
            body: >-
              The likely go-to-market motion is a classic merchant-silicon design-win model: Celero must convince a
              small number of hyperscalers, cloud operators, optical module vendors, or system OEMs to qualify a new
              coherent DSP architecture, then convert those wins into production ramps. Public sources reinforce that
              hypothesis by emphasizing commercialization across hyperscale and cloud customers rather than
              broad-channel software distribution. That means conventional SaaS efficiency metrics such as ARR, CAC
              payback, or NRR are not the right public lens today; the more relevant questions are qualification-cycle
              duration, sample-to-design-win conversion, NRE recovery, gross margin by speed grade, and customer
              concentration. Public traction remains almost entirely opaque. There is no disclosed revenue, ARR,
              bookings, active-customer count, shipment volume, backlog, or utilization metric, and no named hyperscaler
              production deployment. The absence of those metrics matters because merchant networking silicon can become
              highly concentrated around a few buyers even at scale. Marvell, a mature comparable, disclosed that its
              top ten customers represented 82% of revenue in fiscal 2026, which suggests an earlier-stage coherent-DSP
              startup could be even more exposed to a handful of accounts. The diligence conclusion is that Celero may
              have strategic GTM momentum, but public evidence does not yet prove repeatable commercial traction.
