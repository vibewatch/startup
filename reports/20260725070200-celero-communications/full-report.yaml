      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-layered because DSP vendors rarely sell directly to a single end user. The
              immediate commercial customer is often a module, system, or switch OEM integrating optical engines,
              pluggables, or photonics into shipping hardware. But hyperscaler and AI-cloud architects heavily influence
              the spec because they qualify reliability, power, interoperability, and serviceability before any large
              rollout. Cisco, Acacia, and Nvidia all frame the market around hyperscalers first, then a second wave of
              neo-clouds, Tier 2 providers, and eventually large enterprises operating private AI campuses. Day-to-day
              users are network architects, optical engineers, and platform teams responsible for scale-out and
              scale-across fabrics; the ultimate payer is the AI infrastructure budget owner trying to improve cluster
              utilization per watt. Adoption therefore tends to move from standards work and OEM design wins into
              limited production deployments, then into campus or multi-site expansion once uptime and operations are
              proven. Celero is better understood as selling into an ecosystem qualification process than into a
              conventional one-step chip purchase.
