            body: >-
              Celero’s dated public record shows a young company moving quickly from legal formation to large financing,
              but without the disclosure density usually seen once a hardware startup reaches this funding level. The
              earliest hard milestones are legal and regulatory: a February 2024 California filing footprint, a December
