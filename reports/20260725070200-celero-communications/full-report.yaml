            body: >-
              Celero does not publish a canonical public block diagram, so the best architecture reconstruction comes
              from recruiting signals plus external standards work. The open roles span ASIC design, design
              verification, RTL, DSP-FEC, optical DSP, SerDes, PLL, analog layout, physical verification, physical
              design, firmware, and product engineering. That role mix strongly suggests a full custom coherent-DSP
              program rather than a narrow algorithm IP shop. The likely operating stack runs from host-side electrical
              I/O and clocking, through DSP and forward-error-correction engines, into coherent optical-module
              management firmware and package-level implementation. OIF technical work provides the standards context
              around that stack: C-CMIS for coherent module management, CMIS security extensions, 224G and 448G
              chip-to-module interfaces, and roadmap efforts such as 1600ZR, 1600ZR+, 1600CL, and compute-optics
              interfaces for AI scale-up links over protocols such as PCIe, NVLink, and UALink. Deployment therefore
              likely means Celero silicon entering qualification loops with module vendors, switch or router platforms,
              and hyperscaler optical teams rather than being sold as a stand-alone end product.
