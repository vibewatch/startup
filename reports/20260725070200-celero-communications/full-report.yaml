  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      Celero’s main cash-flow pressure points come before revenue visibility: tape-out, outsourced manufacturing,
      inventory commitments, and delayed qualification.
    data:
      columns:
        - Cash timing
        - Why cash leaves early
        - Implication
      rows:
        - label: Design team, EDA, and IP
          values:
            - Pre-revenue
            - R&D and tool spend begin well before production
            - Burn can stay high even with no recognized revenue
        - label: Tape-out / masks / wafers
          values:
            - Pre-sample to pre-production
            - Node choice determines multi-million-dollar NRE and wafer commitments
            - A respin can materially shorten runway
        - label: Packaging, test, and substrates
          values:
            - Qualification to ramp
            - Outsourced back-end costs scale before mature volume economics
            - Gross margin lags until utilization improves
        - label: Inventory and capacity reservations
          values:
            - Ahead of demand
            - Foundry and substrate partners may require long lead commitments
            - Working capital can rise before collections
        - label: Qualification delays / hybrid adoption
          values:
            - Revenue timing risk
            - Supply and deployment bottlenecks can push customer ramps outward
            - Another round may fund delay rather than growth
    approximationNotes: >-
      This is a qualitative cash-flow map because Celero has not disclosed cash balance, monthly burn, capex, or debt
      terms.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI027
      - CI028
      - CI037
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Celero’s public product story stacks AI workloads, coherent DSP processing, module management, and optical
      transmission into one interconnect path.
    data:
      layers:
        - label: AI workload / host layer
          detail: GPU, XPU, switch, or router traffic that needs to move across racks, buildings, or data centers
          components:
            - AI accelerators
            - Ethernet / switching hosts
            - distributed training traffic
        - label: Celero coherent DSP layer
          detail: Custom signal-processing ASIC handling modulation, equalization, FEC, and coherent link control
          components:
            - Coherent DSP core
            - FEC engine
            - DSP algorithms
        - label: Management and firmware layer
          detail: >-
            Diagnostics, tuning, and host-module control surfaces inferred from coherent module standards and firmware
            roles
          components:
            - C-CMIS / CMIS controls
            - Firmware telemetry
            - Qualification hooks
        - label: Optical physical layer
          detail: Pluggable optics, lasers, modulators, receivers, and fiber carrying the actual coherent signal
          components:
            - Optical engine
            - Pluggable module
            - Fiber interconnect
    approximationNotes: >-
      Celero does not publish a public block diagram, so this stack is reconstructed from official positioning, jobs,
      and standards context.
    claimRefs:
      - CE003
      - CE006
      - CE008
      - CE009
      - CE010
      - CE020
      - CE025
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: The customer workflow runs from AI-cluster bandwidth need to coherent-module qualification and deployment.
    data:
      nodes:
        - id: n1
          label: Hyperscaler or module team
          detail: Defines a higher-bandwidth or longer-reach AI interconnect problem
        - id: n2
          label: Choose coherent architecture
          detail: Moves beyond short-reach direct-detect when reach, power, or density becomes limiting
        - id: n3
          label: Integrate Celero DSP
          detail: Coherent DSP silicon is paired with host interfaces, optics, and firmware controls
        - id: n4
          label: Qualify module and host
          detail: Interop, FEC, thermal, and management validation happen with routers, switches, or accelerator fabrics
        - id: n5
          label: Deploy scaled optical links
          detail: AI clusters gain longer-reach, denser connectivity if qualification succeeds
      edges:
        - from: n1
          to: n2
