  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Celero’s likely customer motion starts with architecture pain and standards alignment, moves through sampling and
      qualification, and only then turns into multi-site expansion.
    data:
      items:
        - label: Architecture pain recognized
          detail: >-
            Hyperscaler or AI-cloud network teams hit latency, bandwidth, reach, or power limits as clusters spread
            across buildings and campuses.
          tone: risk
        - label: Evaluation / sampling
          detail: >-
            Customer or module partner evaluates coherent DSP options against interoperability, power, and performance
            requirements.
          tone: neutral
        - label: Qualification and standards fit
          detail: >-
            Interconnect roadmap must align with OIF-style interoperability, electrical, and optical ecosystem
            constraints.
          tone: neutral
        - label: Anchor design win
          detail: Celero lands an initial hyperscaler or module-maker socket and gathers roadmap feedback from early adopters.
          tone: positive
        - label: Scale-across expansion
          detail: >-
            If the first socket performs, deployment can spread across more clusters, sites, and product generations
            inside the same account.
          tone: positive
