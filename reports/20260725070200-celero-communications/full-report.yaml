      - number: '6.4'
        title: Expansion Paths and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Celero’s best-case customer dynamic is classic land-and-expand: win one hyperscaler socket, one
              module-maker qualification, or one AI-cloud design partnership, then broaden from a single link class into
              more racks, buildings, campuses, and product generations. CapitalG’s model could help that process by
              opening introductions and co-selling paths, while standards bodies such as OIF show the exact buyer
              community coalescing around 400G, 448G, and 800G interconnect roadmaps. But those same facts create
              concentrated downside. A small number of hyperscalers and module ecosystems control the bulk of the
              relevant demand, so one anchor account could heavily influence roadmap priorities and early revenue mix.
              Channel dependence is also meaningful because module makers, OEMs, and system integrators may control
              qualification access and purchasing leverage. Finally, competitive pressure is not hypothetical;
              Lightwave, Coherent, NVIDIA, Broadcom, and other ecosystem incumbents are already marketing AI-data-center
              networking, optics, and supply partnerships to the same buyers. The commercial question is therefore not
              whether the market exists; it is whether Celero can convert a few strategic relationships into diversified
              production revenue before incumbents and partner gatekeepers capture the budget.
            claimRefs:
              - CU019
