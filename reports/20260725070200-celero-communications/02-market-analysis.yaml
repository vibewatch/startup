tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - AI scale-out optical interconnect core
    - Optical DSPs, optical transceivers, coherent pluggables, switch optics for rack-to-rack and row-to-row AI fabrics
    - GPU compute, servers, memory, generic cloud capex
    - Hyperscaler and AI-cloud infrastructure budgets through OEMs and switch vendors
    - Core market where Celero must earn design wins
  - - AI scale-across / campus coherent links
    - Inter-building and campus DCI optics, coherent-lite / ZR-class modules, optical line systems tied to AI clusters
    - Carrier backbone transport unrelated to AI campuses
    - Cloud network architecture and DCI budget owners
    - High-relevance extension because Celero positions around scale-across
  - - Future scale-up optical layer
    - CPO, near-packaged optics, optical engines that move high-bandwidth links closer to switches and accelerators
    - Mature copper-only in-rack links that remain sufficient at current reach
    - Platform architecture teams, accelerator system designers, hyperscalers
    - Important future option, but still timing-sensitive
  - - Short-reach electrical substitutes
    - Copper, AEC, retimers, and PAM4 where reach, cost, and serviceability still favor electrical links
    - Longer-distance optical DCI or coherent applications
    - System OEMs and rack-level platform teams
    - Critical excluded-and-competing spend because optics has not displaced it yet
  - - Legacy telecom coherent
    - Long-haul / metro coherent stacks and embedded transport DSPs
    - Dense AI data-center deployments that cannot absorb telecom power and cost profiles
    - Carrier and transport operators
    - Useful technology ancestor but too broad and often over-engineered
  - - Generic AI infrastructure capex
    - Only the networking slice needed to move data between accelerators, racks, and sites
    - Model training software, inference applications, facilities, and power generation
    - CIO / infra leadership
    - Contextual budget pool, not Celero addressable revenue by itself
  notes: This table defines the monetizable interconnect layer and separates it from compute, facilities, and carrier transport budgets that can distort TAM claims.
