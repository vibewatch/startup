company:
  name: Celero Communications
chapter:
  number: 2
  title: Market Analysis
  summary: Celero's real market is not all optical networking; it is the subset of AI data-center interconnect spend where power, reach, and bandwidth limits make optics and eventually coherent DSPs strategic. Public evidence supports strong demand growth across datacenter optics, AI back-end switching, and DCI, but it does not yet isolate a clean 2026 SAM or SOM for short-reach coherent DSPs, so the chapter preserves multiple sizing lenses and the timing contradictions around CPO adoption.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and status-quo substitutes
  body: 'Celero is aiming at a narrower market than all optical networking and a broader one than conventional long-haul coherent telecom. The core included spend is the optical signal-processing and interconnect layer that lets AI clusters scale across racks, rows, campuses, and eventually multi-site compute fabrics: coherent or coherent-lite DSPs, coherent pluggables, optical transceivers, and future CPO or near-packaged optical engines that displace electrical bottlenecks. Cisco''s DCI material and Celero''s own positioning both point to the same job-to-be-done: move very large data volumes among distributed AI systems with acceptable latency, reach, power, and serviceability. Excluded spend should include generic GPU or server capex, memory, power infrastructure, and most legacy carrier transport budgets. The most important substitutes today are still short-reach PAM4 and copper or AEC links inside racks, plus legacy telecom coherent for longer reaches. Celero''s thesis exists because
    neither status quo is ideal across the full AI scale-across problem: PAM4 and electrical links win on simplicity at short reach, while legacy coherent remains overbuilt and too power-hungry for dense data-center economics.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  tableRefs:
  - TM001
- id: sizing-lenses-and-scope-discipline
  title: 'Sizing lenses: broad optics TAM, AI-fabric demand, and the narrower coherent window'
  body: 'The evidence supports a layered market view rather than one headline TAM. Yole''s 2026 optical-transceiver outlook is the broadest usable lens, placing the market at $23.4 billion in 2025 and $112.3 billion by 2031 with AI expected to become more than 90% of revenue by the end of the period. That is useful as an outer ceiling, but it includes a wider set of datacom optics than Celero can capture directly. Dell''Oro adds a middle lens through AI networking and optical transport: Ethernet switch sales tied to AI back-end networks have surged, switch spending for accelerated-server back-end networks is projected to top $100 billion over 2025-2029, and optical transport rebounded to $16 billion in 2025 with AI-driven DCI pushing a 2026 growth forecast above $18 billion. LightCounting and Cignal then narrow the aperture to the coherent edge of the stack: PAM4 is still the near-term volume winner for 800G and 1.6T AI links, while coherent pluggables and coherent-lite are emerging where
    inter-building distance, power, and interoperability make them compelling. That means Celero''s reachable SAM sits somewhere inside the broad optics boom but cannot yet be isolated cleanly from public evidence.'
