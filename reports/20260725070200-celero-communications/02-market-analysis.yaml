- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Tier 1 hyperscaler AI factory
    - Switch / module OEM plus hyperscaler network architecture team
    - Optical architects, platform networking teams, data-center ops
    - Central AI infrastructure budget
    - Qualify optics for scale-out and campus expansion, then ramp to volume deployment
    - VP infrastructure / networking with platform engineering
    - Need to lift bandwidth per watt and connect very large clusters across racks and sites
  - - Neo-cloud / AI infrastructure provider
    - System vendor with direct cloud operator qualification
    - Network engineering and capacity planning teams
    - Growth capex for GPU clusters
    - Deploy Ethernet or InfiniBand fabrics fast enough to monetize GPU supply
    - COO / infra finance / network platform lead
    - Need competitive AI service capacity without hyperscaler in-house optics teams
  - - Module / switch OEM
    - Optics component and system procurement teams
    - Product, hardware, and optical integration engineers
    - OEM product line budget
    - Design in DSPs and engines that satisfy hyperscaler specs
    - GM or hardware product line owner
    - Need a lower-power or longer-reach optical option to win next-generation AI sockets
  - - Enterprise or sovereign AI campus
    - Integrator plus enterprise network architecture
    - Private AI platform team and security/network operations
    - Data-center modernization budget
    - Connect multiple buildings or colos serving training and inference workloads
    - CIO / CTO infrastructure organization
    - Need lower-latency inter-site AI networking with manageable operations
  - - Traditional carrier / broad transport buyer
    - Optical transport planners and service-provider engineers
    - Transport operations
    - Carrier capex
    - Buy metro or long-haul coherent systems
    - Optical transport business unit
    - Different mission and budget than Celero's AI-native use case
  notes: Buyer mapping reflects how component vendors enter the market through qualification chains rather than by selling a stand-alone enterprise application directly to one end user.
