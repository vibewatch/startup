- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hyperscaler AI capex and Ethernet back-end expansion
    - positive
    - current
    - Sustains demand for ever-faster optics and raises willingness to trial new architectures
    - Ask which hyperscaler or neo-cloud programs Celero is qualified into today
  - - Migration from 800G to 1.6T and later 3.2T
    - positive
    - current to mid-term
    - Raises the pressure on electrical reach, power, and serviceability
    - Request Celero's lane-rate roadmap and target sockets by generation
  - - Inter-building / scale-across bandwidth growth
    - positive
    - current to mid-term
    - Creates a more natural coherent-lite use case than very short in-rack links
    - 'Request design targets by reach tier: intra-row, campus, metro-edge'
  - - CPO and silicon photonics maturity
    - positive
    - mid-term
    - Can expand optics deeper into the AI stack if reliability proves out
    - Ask when Celero expects CPO, NPO, or coherent-lite attach to matter commercially
  - - Copper, AEC, and PAM4 still cheaper or simpler at short reach
    - negative
    - current
    - Limits how much of the broad optics boom is truly addressable by coherent DSPs today
    - Quantify where Celero beats PAM4 on watts, reach, or total system cost
  - - Manufacturing yield, serviceability, and packaging rework
    - negative
    - current to mid-term
    - Delays broad photonics rollout even when the technology is attractive on paper
    - Ask for yield assumptions, failure-repair workflow, and field-replaceability model
  - - Reliability risk in very large GPU clusters
    - negative
    - current
    - Makes qualification cycles long and raises the burden of proof for new optics vendors
    - Request FIT/MTBF data, burn-in methodology, and hyperscaler qualification status
  - - No public SAM / SOM disclosures for short-reach coherent DSP
    - negative
    - current
    - Keeps valuation highly sensitive to management assumptions on ASP, attach rate, and timing
    - Request bottom-up pipeline, ASP, and attach-rate model by socket class
  notes: The strongest positive signals come from AI bandwidth growth and optical technology progress; the strongest negatives come from timing, reliability, and the lack of public market-cut data specific to Celero's niche.
