  - type: private-evidence-only
    severity: material
    topic: buyer-budget-split
    missingEvidence: Named design wins or pipeline split between module OEMs, switch vendors, hyperscalers, and neo-cloud customers.
    whyItMatters: The buyer chain determines sales-cycle length, concentration risk, and who controls pricing power.
    diligencePath: Ask management for customer pipeline stages, qualification owners, and revenue concentration assumptions by channel.
