figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Celero sits inside a broad datacom-optics boom, a narrower AI-fabric transport layer, and an even narrower coherent DSP opportunity set.
  data:
    nodes:
    - label: TAM | $23.4B 2025 optics lens
      detail: Yole's 2025 datacom and telecom optical transceiver market is the broadest outer ceiling for AI-related optical interconnect.
      tone: positive
    - label: SAM | $16B-$18B transport/DCI lens
      detail: Dell'Oro's 2025 optical transport base and 2026 rebound frame the middle layer where AI DCI and campus links are already budgeted.
      tone: neutral
    - label: SOM | Coherent pluggables / DSP niche
      detail: Near-term obtainable share depends on coherent-lite, 800ZRx / 1600ZRx, and AI scale-across use cases rather than the full optical stack.
      tone: neutral
  approximationNotes: The layers are non-additive analytical lenses. Only the TAM and middle-layer dollar values are published directly; the narrow layer is described qualitatively because public sources do not isolate a clean short-reach coherent DSP revenue pool.
  claimRefs:
  - CM010
  - CM012
  - CM016
  - CM019
  - CM020
  - CM026
  - CM040
  - CM041
- id: FM002
  title: Market estimate range
  type: range
  layout: wide
  summary: Published figures span a broad optics outer ceiling and a narrower DCI/transport layer, illustrating why one TAM number would overstate precision.
  data:
    items:
    - label: Optical transceiver market lens
      low: 23.4
      mid: 67.9
      high: 112.3
      unit: $B
      displayValue: $23.4B current to $112.3B forecast
      detail: Low is Yole's 2025 value, high is its 2031 forecast, and midpoint is a visualization bridge rather than a separate published estimate.
      tone: positive
    - label: Optical transport / DCI lens
      low: 16.0
      mid: 17.0
      high: 18.0
      unit: $B
      displayValue: $16B 2025 to >$18B 2026
      detail: Low is Dell'Oro's 2025 optical transport actual and high is the 2026 forecast driven by AI DCI; midpoint is a display aid.
      tone: neutral
  approximationNotes: Both rows use USD billions. Midpoint values are visual interpolation aids, not independently published market estimates.
