- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Celero must move from ecosystem qualification to limited deployment and then into scale-across expansion before any deeper scale-up optical transition matters.
  data:
    nodes:
    - id: oem
      label: OEM or switch design win
      detail: DSP or optical engine is designed into a module, pluggable, or switching platform.
      tone: neutral
    - id: qual
      label: Hyperscaler qualification
      detail: Power, uptime, standards, and serviceability are tested before production use.
      tone: neutral
    - id: pilot
      label: Initial scale-out / DCI deployment
      detail: Volume begins first in scale-out or inter-building links where optics is already justified.
      tone: positive
    - id: expand
      label: Campus and multi-site expansion
      detail: Once proven, the same optical stack expands across more buildings, pods, and clouds.
      tone: positive
    - id: future
      label: Future scale-up optical migration
      detail: CPO or coherent-lite can move deeper into shorter reaches if reliability and economics improve.
      tone: neutral
    edges:
    - from: oem
      to: qual
      label: component integration
    - from: qual
      to: pilot
      label: approved for use
    - from: pilot
      to: expand
      label: proved in operation
    - from: expand
      to: future
      label: deeper optical penetration
  approximationNotes: This is a synthesized adoption path from vendor, analyst, and operator evidence rather than a disclosed Celero sales funnel.
