  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: A bottom-up short-reach coherent DSP SAM or SOM by socket class, reach tier, and customer segment.
    whyItMatters: Without a true SAM, valuation depends on management assumptions embedded in a broad optics narrative.
    diligencePath: Request Celero's internal market model showing reachable sockets, ASPs, and attach rates by 800G, 1.6T, and coherent-lite use case.
