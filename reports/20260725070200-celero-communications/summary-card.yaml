  topStrengths:
    - >
      World-class founding team: Nariman Yousefi (Marvell/Inphi) and Oscar Agazzi (ClariPhy/Broadcom) are among the most
      credentialed coherent DSP architects alive, with deep IP and hyperscaler relationships.
    - >
      Strategic investor signal: CapitalG (Alphabet) leading the Series B strongly implies Google is a design partner or
      early commercial prospect, de-risking the demand side significantly.
    - >
      Massive market pull: AI cluster bandwidth demand is doubling faster than interconnect supply; coherent DSP is the
      only viable path to 1.6T+ rack-level links, placing Celero at a critical chokepoint.
    - >
      Asymmetric M&A optionality: Marvell's $10B Inphi acquisition (2021) and the precedent of Alphabet-backed hardware
      acquisitions suggest Celero represents a credible strategic target at achievable scale.
  topRisks:
    - >
      ASIC tape-out execution risk: First-generation advanced-node coherent DSP tape-outs cost $10–50M+ each and have
      meaningful failure rates; a single schedule slip of 12–18 months would materially impair the entry valuation.
    - >
      TSMC single-foundry concentration: Any Taiwan supply disruption, geopolitical restriction, or advanced-node
      allocation squeeze would halt Celero's manufacturing pipeline with no short-term alternative.
    - >
      Architecture substitution: Accelerating adoption of linear-drive optics (LPO), co-packaged optics (CPO), or
      silicon photonics could reduce the addressable market for standalone coherent DSP chips before Celero reaches
      volume.
    - >
      Capital intensity and dilution: Scale-up from engineering samples to hyperscaler volume production will require
      significant additional capital, with substantial dilution risk for current investors.
    - >
      Export-control exposure: BIS semiconductor regulations (EAR Part 774) and CHIPS Act conditions impose ongoing
      compliance obligations; any misstep could restrict foundry access or customer relationships.
