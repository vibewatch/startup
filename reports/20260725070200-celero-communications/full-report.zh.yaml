      - number: '6.3'
        title: 耐久性、留存可见度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Celero 没有公开 NRR、GRR、流失率、合同期限或客户满意度披露，因此耐久性只能从半导体和互连采购行为推断，而不能直接衡量。好消息是终端市场真实且紧迫。AWS、NVIDIA、CoreWeave 和 OIF
              材料都描述 AI
              基础设施正在迈向数万、甚至数百万颗芯片，确定性时延、互操作性和无阻塞网络正在成为设计约束，而非可选升级。这些条件会拉长认证周期；组件一旦获批进入量产架构，黏性也会提高，因为重新认证昂贵，供应连续性很重要。坏消息是走向量产缓慢且牵动全系统。CoreWeave
              的 2026 年生产推理分析称，多数企业从购买 GPU 容量到服务第一个生产请求需要超过四个月，供应和基础设施可得性仍是硬约束。实际看，Celero
              一旦赢得插槽，可能受益于长生命周期；但投资人还无法验证公司是否已有任何量产插槽，或评估是否正以有吸引力的速度转化。
