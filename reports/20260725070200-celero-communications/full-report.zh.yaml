  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有厂商、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Celero 进入的不是空白品类。直接战场是已经卖进超大规模云和模块生态的第三方光 DSP 既有厂商，尤其是 Marvell 和 Broadcom，以及 Celestial AI、Ayar
              Labs、Lightmatter 等融资充足的光互连初创公司。格局还包括 Eliyan 等相邻 chiplet 互连厂商、Intel 和 Coherent 等既有硅光或组件供应商，以及 InnoLight
              等现状模块厂商。合在一起，这些替代方案覆盖了买方在 AI 加速器、交换机和机架之间搬更多数据、同时不打爆功耗或时延预算的大多数解法。


              替代集合同样重要。在最短距、耦合最紧密的纵向扩展领域，NVIDIA NVLink 和 UCIe 等 chiplet 标准可能在光链路进入考虑之前就吸走预算。对于成熟数据中心采购中心，既有运营模式仍是认证第三方
              可插拔模块和收发器，而不是把风险押在一家新的相干 DSP 初创公司上。这意味着 Celero 不仅要赢在原始光学性能，还要对抗习惯：现有供应商、熟悉的认证流程，以及把光器件留在模块或封装边界、而不是把新的 DSP
              厂商引入堆栈的架构。


              实际结果是一片分层战场。Celero 的直接切入口是面向 AI 跨域扩展和光连接的相干 DSP，但真正的比较对象横跨第三方
              DSP、模块供应商、共封装光学初创公司和电连接替代方案。买方可以多源采购模块、留在既有可插拔生态，或推进内部 chiplet 与纵向扩展织构。在 Celero
              证明生产就绪和设计导入牵引力之前，这种广度会限制任何初创公司能期待的定价权或锁定能力。
