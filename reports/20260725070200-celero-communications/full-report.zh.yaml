  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Celero 在公开网站上卖的不是成品交换机、路由器或收发器模块；它的产品更适合描述为一套相干 DSP 半导体平台，嵌在连接 AI
              加速器、服务器和数据中心集群的光互连硬件内部。从客户工作流看，买方面临的问题很直接：超大规模云和基础设施厂商需要把大流量传得比短距直接探测光学更远，同时守住功耗效率和带宽密度。Celero
              的公开材料反复把公司定位为让这些光链路变得可用的信号处理层。官网强调加速器和集群之间的无缝光链路，CapitalG 投资笔记则把 DSP 解释为光收发器内部的芯片，把来自 GPU 或 XPU
              的电信号转成光进行传输。这个定位重要，因为它把 Celero 放在计算网络织构 与光线路系统之间的控制点上；功耗、距离、调制和互操作性决策都会直接影响 AI 集群架构。
