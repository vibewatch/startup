      - - 在 host 平台上验证可插拔相干模块
        - 经过漫长验证周期，把光引擎、DSP 固件和 host 管理接起来
        - 用 Celero silicon 加管理 / 诊断栈作为相干控制点
        - 如果 host、模块和光学一起优化，系统瓶颈可能下降
        - 互操作和 host 验证复杂度仍高
      - - 通向 800G 和 1.6T 相干 fabric 的路线图
        - 从今天的 800ZR 推进到 1600ZR/CL 和 AI 专用 compute optics
