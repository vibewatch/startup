        title: 身份、阶段与运营版图
        blocks:
          - type: paragraph
            body: >-
              Celero Communications 更适合被理解为一家已完成 B 轮融资的私营半导体初创公司，正在为 AI 网络连接打造相干数字信号处理芯片。公司官网首页和关于页面反复把使命落在同一件事上：AI
              训练和推理集群一旦跨出单个机架、甚至单个园区，就会遇到距离、带宽和功耗瓶颈，Celero 要把这些瓶颈移走。公开市场数据资料也吻合这个定位：CB Insights 将公司列为 B 轮，并把产品描述为面向 AI
              光传输的相干 DSP；Reuters 则更具体地解释为，把光纤中的光信号转换为计算网络使用的电域信号。地理分布在这个故事里也格外重要。Celero 官方总部位于加州
              Irvine，招聘页和关于页则显示其工程团队分布在 Ottawa、San Jose，以及加拿大和阿根廷更广泛的设计中心。这一版图更像是一家公司仍在扩建，而不是已经披露营收、客户数或员工总数等商业规模指标。
