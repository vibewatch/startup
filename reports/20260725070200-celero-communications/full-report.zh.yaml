  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认约束
        blocks:
          - type: paragraph
            body: >-
              Celero 是无晶圆厂半导体初创公司，因此经济引擎是硬件收入，而不是经常性软件订阅。公开材料一贯把产品描述为相干 DSP 芯片 /
              平台，让超大规模云和云运营商以更低功耗、更高带宽效率在光纤上移动更多数据；这意味着变现来自芯片销售、参考平台设计导入，以及稳定量产前可能出现的工程样片或 NRE 款项。同样重要的是未公开部分：Celero
              没有披露任何目录价、合同 ASP、出货单元数、已签未交付订单、具名客户， 或按产品阶段划分的收入贡献。行业基准显示，相干 DSP 是高端产品，由于复杂度更高、出货量更低，其 ASP 可维持在 PAM4 DSP
              定价约 10x 的水平；但这些基准也显示，未来 1.6T 采用和新进入者可能压缩价格。承销时，核心收入确认问题是时间：投资人需要区分量产前 NRE
              或认证收入与可重复量产出货，因为在芯片公司出现持久毛利率之前，两者都可能先出现在账上。
