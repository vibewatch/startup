companyProfile:
  summary: >
    Celero Communications 是一家无晶圆厂半导体公司，由 Nariman Yousefi（CEO，曾任 Marvell/Inphi）和 Oscar Agazzi（CTO，曾任
    Marvell/Broadcom/ClariPhy）于 2024 年创立。公司设计相干 DSP ASIC，处理复杂光调制格式（如 DP-16QAM/DP-64QAM），让 AI 数据中心内部的机架到机架光链路达到
    400G–1.6T+。它的芯片瞄准 GPU 集群和分布式 AI 训练负载快速扩张带来的带宽瓶颈。Celero 在种子轮、A 轮及 2025 年 11 月由 CapitalG/Alphabet 领投的 B 轮中累计融资约
    $140M，对应投后估值约 $1B。公司位于加州 Irvine，并在 Victoria（加拿大 BC 省）和 Buenos Aires（阿根廷）设有设计中心。
  foundedDate: '2024-01-01'
  founders:
    - name: Nariman Yousefi
      role: 联合创始人兼 CEO
      background: |
        曾任 Marvell Technology 和 Inphi Corporation 高级管理人员；在面向电信和数据中心光链路的相干 DSP 领域积累深厚。
