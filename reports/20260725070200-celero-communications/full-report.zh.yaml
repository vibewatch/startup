      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Celero 最理想的客户动态是典型先落地、再扩张：赢下一个超大规模云插槽、一次模块厂商认证或一个 AI 云设计伙伴关系，再从单一链路类别扩展到更多机架、楼宇、园区和产品世代。CapitalG
              模式可通过引荐和联合销售路径帮助这一过程；OIF 等标准机构也显示，买方社区正围绕 400G、448G 和 800G
              互连路线图聚拢。但这些事实也带来集中的下行风险。少数超大规模云和模块生态控制着大部分相关需求，因此一个锚定账户可能严重影响路线图优先级和早期收入结构。渠道依赖也很实质，因为模块厂商、OEM
              和系统集成商可能控制认证入口和采购杠杆。最后，竞争压力并非假设；Lightwave、Coherent、NVIDIA、Broadcom 和其他生态既有厂商已经向同一批买方营销 AI
              数据中心网络、光学和供应伙伴关系。因此，商业问题不是市场是否存在，而是 Celero 能否在既有厂商和伙伴守门人吸走预算之前，把少数战略关系转化为多元化生产收入。
