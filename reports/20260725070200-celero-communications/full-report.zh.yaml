  foundingLocation: Irvine, California, USA
  headquarters: Irvine, California, USA
  productSummary: >
    定制相干 DSP ASIC，在 400G、800G 和 1.6T+ 线速下完成光信号在数字域与模拟域之间的转换。芯片把前向纠错、自适应均衡、载波恢复和色散补偿放进硅片，去掉限制 AI
    集群扩张的光传输距离和带宽约束，又不承担传统电信级相干模块的功耗和成本溢价。
  customerFocus: >
    超大规模云服务商（Google/Alphabet、Microsoft、Amazon、Meta）以及大型 AI 基础设施运营商（CoreWeave、xAI、Lambda Labs）。这些机构在建设高密度 GPU
    集群，需要超出传统直接探测光模块覆盖范围的芯片到芯片、机架到机架光连接。
  businessModel: >
    无晶圆厂半导体模式：Celero 设计相干 DSP 芯片，并把制造外包给领先代工厂（推定为 TSMC 先进节点）。收入按颗芯片销售产生，定价反映相干光器件的高性能、定制 ASIC 属性（约 $500–$5,000+ /
    颗，取决于速度等级和出货量）。
  stage: Series B
