  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、买方与付款方
        blocks:
          - type: paragraph
            body: >-
              Celero 的公开材料显示，客户宇宙狭窄但价值很高。公司把产品描述为面向高带宽、低功耗光链路的相干 DSP，用来连接 AI
              加速器、服务器和云数据中心，因此决策者位于基础设施侧，而不是应用团队内部。最清晰的直接客户细分是超大规模云和大型云运营商，它们必须用确定性、能效高的带宽连接机架、排、楼宇和园区。第二类是 AI
              云专家和新型云运营商，它们聚合模型开发者需求，但仍以 GPU 集群所有者或运营者身份采购基础设施。第三类是光模块厂商和基础设施 OEM，它们能把 DSP
              认证进可插拔或嵌入式系统，再把通往超大规模云的访问权中介化。公开招聘尤其有用：Celero
              正在招聘人员，把超大规模云网络需求转化为产品规格，并争取超大规模云和模块厂商的早期设计导入。这意味着买方是网络架构师和基础设施高管，用户是光学、硬件和系统团队，付款方是 AI 网络资本开支预算。
