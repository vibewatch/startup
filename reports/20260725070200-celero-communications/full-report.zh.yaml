      - number: '3.2'
        title: 直接竞争：既有厂商已覆盖全栈，初创公司则推进 CPO 与光子织构
        blocks:
          - type: paragraph
            body: >-
              Marvell 和 Broadcom 是最难的标杆，因为两家公司都能在客户的出货爬坡已经发生的地方对接需求。Marvell 现在面向短距、园区和更长距离的数据中心链路销售 PAM4、相干和轻量相干 DSP，并称其
              3nm Ara 平台已经向全球超大规模云大批量出货。Broadcom 的产品组合同样宽：光 DSP、激光器、SerDes、CPO 和 PCIe-over-optics，公司还声称相邻光组件已经有出货规模，新
              1.6T 平台也进入早期送样。换句话说，Celero 竞争的不是两个芯片 SKU，而是能够打包路线图可信度、标准参与和模块伙伴关系的既有厂商。


              初创公司从另一个角度进攻。Celestial AI 讲的是从封装到机架的更广义 Photonic Fabric 故事。Ayar Labs 强调可在机架内外替代铜缆的光 I/O chiplet
              和远程光源。Lightmatter 推进 3D 光子互连路线图、更大的参考系统，以及 NVIDIA NVLink Fusion 等生态关系。这些公司并非 Celero
              的完全同类替代品，但都在争夺同一条战略预算线：用更靠近计算的更多光学内容，解决 AI 互连瓶颈。如果客户迁向共封装或近封装光学，Celero 的相干 DSP 切入口可能收窄，除非其架构也适配这些部署模式。


              Celero 最强的相对差异化是聚焦。它公开讲述的是面向跨域扩展光连接的相干
              DSP，而不是宽产品组合。如果客户想要专业化引擎，而不是平台型供应商，这会有帮助。风险在于，既有厂商和相邻初创公司已经展示出更宽的产品地图、更深的送样管线，以及比 Celero 迄今公开披露更可见的生态锚点。
