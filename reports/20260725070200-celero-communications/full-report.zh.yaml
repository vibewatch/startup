      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱分多层，因为 DSP 厂商很少直接卖给单一终端用户。最直接的商业客户往往是模块、系统或交换机 OEM，它们把光引擎、可插拔模块或光子器件集成进出货硬件。但超大规模云和 AI
              云架构师会重度影响规格，因为任何大规模部署之前，他们都要验证可靠性、功耗、互操作性和可维护性。Cisco、Acacia 和 Nvidia 都先围绕超大规模云定义市场，然后才是第二波新型云、Tier 2
              提供商，以及最终运营私有 AI 园区的大型企业。日常用户是网络架构师、光学工程师和负责横向扩展及跨域扩展网络织构的平台团队；最终付款方是希望提升每瓦集群利用率的 AI
              基础设施预算负责人。因此，采用路径通常从标准工作和 OEM 设计导入开始，进入有限生产部署；待可用性 和运营得到验证后，再扩展到园区或多站点。Celero
              更像是在卖给一个生态体系认证流程，而不是完成一次常规芯片采购。
