            body: >-
              创始人连续性是 Celero 公开记录中最清晰的正面信号之一。多项来源将 Nariman Yousefi 标注为联合创始人兼 CEO，将 Oscar Agazzi 标注为联合创始人兼 CTO，并称两人都曾在
              Marvell、Inphi、Broadcom 和 ClariPhy 担任高层。这一背景契合产品命题：Celero 不是在发明一个新的终端市场，而是把成熟的相干光和网络芯片人才用到 AI
