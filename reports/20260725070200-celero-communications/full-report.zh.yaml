      - number: '8.2'
        title: 方法论与情景分析
        blocks:
          - type: paragraph
            body: >-
              Celero 更适合用按证据加权的估值方法，而不是单点可比。公开市场倍数给出重力；私募轮次显示战略稀缺性能换来多高定价；并购先例说明，
              当互连瓶颈威胁更大的平台路线图时，买方为什么愿意加价。基于这一点，牛市情景假设 Celero 把技术可信度转化为两三个超大规模云或模块平台插槽， 中期收入达到约 $180-220M；如果溢价倍数守住，可支撑
              $2.0-2.5B 的结果。基准情景假设出现一波有意义部署， 收入转化较慢但真实，走向约 $75-100M；仍享有溢价的 10-12x 倍数，使价值维持在上轮附近，约 $0.8-1.2B。
              熊市情景假设商业化延迟一个周期、既有厂商反击更强，或市场转向更低功耗的光学路径从而压缩 DSP 含量；该情景可把价值推向约 $0.4-0.7B。 由于公开披露很薄，情景表比经典 DCF 给出的伪精确更有决策价值。
