  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Celero 瞄准的市场比整个光网络更窄，却比传统长途相干电信更宽。核心纳入支出是光信号处理和互连层，它让 AI 集群从机架扩展到排、园区，并最终扩展到多站点计算织构：相干或轻量相干
              DSP、相干可插拔模块、光收发器，以及未来取代电连接瓶颈的 CPO 或近封装光引擎。Cisco 的 DCI 材料和 Celero 自身定位指向同一项待完成任务：在分布式 AI
              系统之间移动超大数据量，同时把时延、传输距离、功耗和可维护性控制在可接受范围内。应排除的支出包括通用 GPU 或服务器资本开支、内存、电力基础设施，以及多数传统运营商传输预算。今天最重要的替代方案仍是机架内短距
              PAM4、铜缆或 AEC 链路，以及更长距离上的传统电信相干。Celero 的命题成立，是因为两种现状都无法完整覆盖 AI 跨域扩展问题：PAM4
              和电连接在短距上胜在简单，传统相干则为高密度数据中心经济性配置过重、功耗过高。
