      - number: '7.3'
        title: 执行、竞争与客户风险
        blocks:
          - type: paragraph
            body: >-
              Celero 面对的不是静态细分市场。Marvell 和 Broadcom 已经把多代光 DSP、共封装光学、自定义 ASIC 和机架级 AI 网络平台卖给超大规模云厂商和大型系统厂商。Broadcom
              的公开材料显示，其技术栈覆盖自定义 XPU、交换、PHY、光组件，甚至 102.4 Tb/s 共封装光学交换机；Marvell
              也披露了客户集中度，以及数据中心市场设计赢单的战略重要性。关键在于，初创公司的第一批收入很可能集中在少数设计导入上，
              而这正是既有厂商杠杆、关系和路线图可信度最强的地方。开放光标准可能扩大可服务生态，但也可能把部分价值栈商品化，压缩小厂商仅靠专有集成取胜的空间。 客户验证缺口仍然很大：Celero
              的公开材料没有点名已部署买家、生产节点或代工关系，因此投资人还无法把真正的商业拉力与 AI 基础设施生态热情区分开。 落到执行上，Celero
              必须扩团队、完成硅片、证明每瓦性能，并拿下少数超大规模云级项目；与此同时，资本更厚的既有厂商还在继续推高标准。
