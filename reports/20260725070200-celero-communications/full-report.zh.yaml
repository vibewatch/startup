      - number: '8.4'
        title: 风险调整回报框架与监测指标
        blocks:
          - type: paragraph
            body: >-
              以上轮价格看，只有公司快速越过少数商业化关口，回报才呈现不对称。上行至约 $2.0-2.5B，需要同时抓住高速增长的 AI 光学市场， 并守住溢价估值环境；下行至约
              $0.5B，只要错过一个采用周期或发生一次重大架构转向就可能出现。因此，正确的监测框架不是泛泛押注初创乐观，
              而是一张与价值传导绑定的短驱动清单：设计赢单转收入、收入转毛利率、毛利率转融资杠杆、融资杠杆转最终所有权结果。投资人因此应跟踪具名设计赢单、 季度收入转化、毛利率轨迹、AI 光学需求增长，以及相对于 $140M
              融资底座的现金消耗。战略先例在这里仍重要：Marvell-Inphi、Intel-Habana 和 AMD-Xilinx 都说明，瓶颈控制型资产即使还没有成熟的公开市场式披露，也可能因战略原因被收购。但只有
              Celero 证明自己掌握了买方真正需要的瓶颈， 这些先例才有帮助。
