      - number: '4.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 头条融资并没有解决承销问题
            body: >-
              Celero 已证明投资人愿意为 AI 互连命题出钱，但公开披露仍停在判断收入质量和现金可支撑月数所需数字之前。缺少现金余额、现金消耗、样片状态、客户集中度或毛利率数据，$140M
              头条轮次只是必要背景，不是可投资的财务模型。
            calloutType: risk
            claimRefs:
              - CI001
              - CI037
          - type: callout
            title: 如果 Celero 拿下认证，相干 DSP 经济性可以很有吸引力
            body: >-
              这个品类受益于相干 DSP 溢价定价、超大规模云对更长距离 AI 连接的明确需求，以及可插拔相干采用扩张时仍留给第三方 厂商的空间。财务上行真实存在；阻碍在于证明 Celero
              能把品类顺风转化为客户认证、带毛利的量产出货。
