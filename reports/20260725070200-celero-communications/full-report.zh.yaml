        - AI fabric 推向更高密度和更远距离时，产品仍能贴住需求
        - Celero 具体路线图里程碑的公开证据仍薄
      - - 为超大规模客户搭建制造和现场支持
        - 协调设计中心、验证、产品工程和供应链
        - 借经验丰富的相干 DSP 团队和 foundry 关系缩短 bring-up
        - 潜在护城河来自执行，不只是算法
        - 未公开客户验证、RMA 条款或支持 SLA
