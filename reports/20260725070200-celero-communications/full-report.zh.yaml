      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求方向很强；难点在采用节奏。独立来源给出的增长驱动很清晰：超大规模云 AI 资本开支仍处高位，以太网正在 AI 后端网络中拿份额，端口速度从 800G 快速迈向 1.6T，Cisco 和 Nvidia
              也量化了光器件取代独立传输设备或重度可插拔架构后带来的功耗或可用性 收益。但约束同样实质。LightCounting 显示 PAM4 仍赢得近期 AI 出货爬坡，意味着相干 DSP
              厂商必须等待跨域扩展和轻量相干用例成熟。ADTEK、CNBC 和 Gazettabyte 都强调制造良率、可靠性、可维护性和标准成熟度是真正阻碍，而 SemiEngineering
              给出更乐观的五年内全光视角。估值会受这些时间差影响，因为它们改变 Celero 从小众设计导入走向大规模部署的时间。公开数据也留下关键缺口：没有来源披露 AI 数据中心短距相干 DSP 的自下而上 SAM，OEM
              与超大规模云之间的预算拆分仍是推断而非报告，轻量相干在 AI 园区内的挂接率或 ASP 仍属私有信息。
