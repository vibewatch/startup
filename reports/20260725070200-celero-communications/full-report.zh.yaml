        - 市场增长大，但路线图正转向 LPO/CPO 效率
        - 如果 Celero 仍不可或缺，战略溢价可延续
        - 如果 DSP 含量被压缩，终局倍数会很快下滑
        - 独立功耗 / 带宽基准数据
      - - 资本效率
        - 迄今仅融资约 $140M；若执行够快，仍有杠杆空间
        - 下一轮前拿出更多证据，可保住持股
        - 制造或 GTM 扩张可能迫使稀释
        - 现金续航模型和下一轮融资计划
      - - 战略买家可选性
        - 光学和 AI 芯片领域都有 M&A 先例
        - 可在上市可比公司估值锚上方形成出价底线
        - 目前没有直接买方证据；可选性可能被夸大
        - 投行反馈和主动接洽历史
    notes: 这个框架把经营证据连接到投资人结果，强调哪些因素会改变股权价值，而不是只改善故事。
    claimRefs:
      - CV037
      - CV040
      - CV047
      - CV048
