      - number: '2.2'
        title: 规模测算视角：广义光器件 TAM、AI 网络织构需求与更窄的相干窗口
        blocks:
          - type: paragraph
            body: >-
              证据支持分层市场视图，而不是一个总括 TAM 标题。Yole 的 2026 年光收发器展望是最宽的可用视角：市场在 2025 年为 $23.4B，到 2031 年达到 $112.3B，预计到期末 AI 将贡献超过
              90% 收入。这个外层天花板有用，但它包含的数据通信 光器件范围比 Celero 能直接获取的市场更宽。Dell'Oro 通过 AI 网络和光传输给出中间视角：与 AI
              后端网络相关的以太网交换机销售已激增，2025-2029 年加速服务器后端网络的交换机支出预计超过 $100B，光传输市场在 2025 年反弹至 $16B，AI 驱动的 DCI 推动 2026 年增长预测高于
              $18B。LightCounting 和 Cignal 再把孔径收窄到堆栈的相干边缘：PAM4 仍是 800G 和 1.6T AI
              链路的近期出货赢家，而在跨楼宇距离、功耗和互操作性使其具备吸引力的场景中，相干可插拔和轻量相干正在出现。这意味着 Celero 可触达 SAM 位于广义光器件繁荣之内，但公开证据还无法把它干净切出来。
