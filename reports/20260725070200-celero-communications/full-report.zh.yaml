              采用故事仍更多是组织层面的，而不是收入层面的。Celero 2025 年 11 月融资公告和 CapitalG 投资笔记显示，公司正从技术建设进入商业认证；团队已约 100
              人，积极招聘，并明确围绕锚定设计导入搭建商业化 动作。对早期半导体公司来说，这是可信牵引，但它不等同于已披露的量产部署。Celero
