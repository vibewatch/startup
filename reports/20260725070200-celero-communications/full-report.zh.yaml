      - number: '5.4'
        title: 信任、质量控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Celero 公开的信任界面更偏法律和流程，而不是认证。隐私政策披露联系人和招聘数据收集、Cookie、反欺诈措辞，以及遵守法律或监管要求，并称公司使用物理和电子保护措施。条款页面管理网站使用，Cookie
              政策确认跟踪披露。缺失项至少同样重要：留存的公开来源没有显示信任中心、已发布 SOC 2 或 ISO 27001 报告、可用性 历史、产品安全说明、RMA 政策，或面向硅片客户的正式支持 SLA。产品侧，OIF
              材料说明了为什么这个缺口重要：相干可插拔模块仍面临真实的互操作和验证复杂性，800ZR 互通测试会记录了一些组合需要进一步调试或未能建立链路。由此得到的风险图很清楚。Celero
              可能拥有合适团队和市场时点，但产品尽调仍需要直接证据：可靠性指标、模块互操作数据、制造和封装依赖、客户认证，以及超出网站政策的安全或质量治理。
