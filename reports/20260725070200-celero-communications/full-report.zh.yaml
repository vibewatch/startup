      - number: '4.4'
        title: 资本充足性、融资依赖与承销判断
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，Celero 的融资故事强于运营披露。公司披露累计股权融资
              $140M，并表示新资金将用于扩大面向超大规模和云客户的硅片开发及商业化。这足以支持下一阶段开发，但信息仍不足以让人有把握地承销流动性。没有公开现金余额、月度现金消耗、明确现金可支撑月数、债务或项目融资义务，也看不到晶圆预付款、基板预留，或是否已经为一次或多次先进节点
              重流片编列预算。基准证据同时指向两件事：AI 互连初创公司只要解决明显瓶颈，仍能融到大额轮次；先进光学供应链仍暴露在激光器短缺、封装瓶颈和部署延迟之下，可能拉长收入到来的时间。实际看，Celero
              下一轮融资触发点很可能不是另一个抽象技术里程碑，而是客户认证证据和可信量产时间。在管理层披露样片状态、收入结构、毛利率桥接和现金消耗计算之前，财务判断应保持谨慎：收入质量仍未证明，毛利率路径可能有吸引力但尚未展示，资本密集度高到足以让一次认证窗口错失在持久规模经济显现前迫使公司再融资。
