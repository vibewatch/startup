      - number: '4.3'
        title: 成本结构、毛利率路径与单位经济基准
        blocks:
          - type: paragraph
            body: >-
              Celero 的成本结构应按研发重、依赖代工来建模。关于无晶圆厂流片和上市网络芯片公司的基准来源显示，营收放大前现金会流向哪里：设计团队薪酬、EDA 和 IP
              许可、掩膜和晶圆支出、外包封装测试，以及在明确客户需求之前预留的库存或产能。对网络或光 ASIC 项目而言，7nm-28nm 总 NRE 约为 $5M-$30M，领先的 3nm-5nm 项目可达
              $30M-$100M+，晶圆成本约 $16k-$22k，封装 / 测试还会继续增加单元成本。这些区间帮助界定 Celero 的挑战：即使相干 DSP ASP
              在结构上有溢价，早期毛利率仍容易受低出货量制造、重流片和成本吸收缓慢影响。Marvell
              的申报文件是有用基准，因为它把毛利率表现与规模、产品组合、库存纪律、代工可得性和外包封测经济性联系起来；文件还指出，ASIC 式合作可能带来较低毛利率和按里程碑回收的 NRE。Celero
              没有公开毛利率、良率、每比特功耗或可变成本披露，因此毛利率承销只能保持暂定。最站得住脚的公开结论是定性的：这个品类规模化后可以很有吸引力，但从样片走向成熟毛利率的路径资本密集、执行敏感。
