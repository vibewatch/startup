  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - AI scale-out 光互连核心
        - 光 DSP、光收发器、相干可插拔模块，以及用于机架间和排间 AI 网络结构的交换机光学器件
        - GPU 计算、服务器、内存、通用云资本开支
        - 超大规模云和 AI 云基础设施预算，经由 OEM 和交换机厂商落地
        - Celero 必须拿下设计赢单的核心市场
      - - AI scale-across / 园区相干链路
        - 楼宇间和园区 DCI 光学、coherent-lite / ZR-class 模块，以及绑定 AI 集群的光线路系统
        - 与 AI 园区无关的运营商骨干传输
        - 云网络架构和 DCI 预算负责人
        - 相关性很高的延伸，因为 Celero 围绕 scale-across 定位
      - - 未来 scale-up 光层
        - CPO、近封装光学，以及把高带宽链路移近交换机和加速器的光引擎
        - 当前距离下仍然足够的成熟纯铜机架内链路
        - 平台架构团队、加速器系统设计方、超大规模云厂商
        - 重要的未来选项，但时点仍很敏感
      - - 短距电连接替代品
        - 当距离、成本和可维护性仍偏向电连接时使用的铜缆、AEC、重定时器和 PAM4
        - 更长距离光 DCI 或相干应用
        - 系统 OEM 和机架级平台团队
        - 关键的排除且竞争性支出，因为光学尚未取代它
      - - 传统电信相干
        - 长距 / 城域相干栈和嵌入式传输 DSP
        - 无法承受电信功耗和成本曲线的高密度 AI 数据中心部署
        - 运营商和传输运营方
        - 有用的技术祖先，但范围过宽且往往过度设计
      - - 通用 AI 基础设施资本开支
        - 只包括在加速器、机架和站点之间移动数据所需的网络切片
        - 模型训练软件、推理应用、设施和发电
        - CIO / 基础设施领导层
        - 背景预算池，本身不是 Celero 可服务收入
    notes: 这张表定义可变现的互连层，并把它与计算、设施和运营商传输预算分开，避免扭曲 TAM 主张。
