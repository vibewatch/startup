      - number: '7.2'
        title: 法律、监管与地缘政治暴露
        blocks:
          - type: paragraph
            body: >-
              即使目前没有已知公开纠纷，法律和监管风险仍然重大。Celero 的领导班底来自前 Marvell、Inphi、Broadcom 和 ClariPhy 人才；如果前雇主认为受保护的 know-how
              被带入新公司，美国商业秘密法为其提供了有力救济。Defend Trade Secrets Act 允许普通民事索赔，在特殊情况下还允许单方扣押令，这意味着纠纷可能在终局裁判前很久就破坏价值。 出口侧，Celero
              所在的半导体类别正处在美国先进计算管制的活跃范围内。BIS 负责执行 EAR，维护 Entity List 和 MEU 管制等基于主体的限制，并在 2026 年 5 月重申，涉及 D:5
              和总部在澳门实体的某些先进计算物项仍需许可证。 因此，任何后续出口分类或客户所有权问题，都可能影响 Celero 可触达市场、合作伙伴选择和交付节奏。CHIPS 护栏规则又加一层： 如果 Celero
              日后申请联邦激励，在关注国家进行重大扩张或开展受限技术许可，可能触发追回或失格。最后，先进半导体最关键的制造基地仍高度地理集中， TSMC 也警告，出口管制、制裁、地震、网络攻击和地缘政治紧张都可能扰乱供应。
