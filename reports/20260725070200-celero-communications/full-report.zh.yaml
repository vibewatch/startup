  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与可比背景
        blocks:
          - type: paragraph
            body: >-
              Celero 的公开估值锚点清楚但不完整：公司宣布由 CapitalG 领投 $100M Series B，累计融资 $140M；多家独立报道把这一轮视为约 $1B
              的独角兽标记。缺的是分母。已审阅的公开材料都没有披露收入、毛利率或具名客户量，因此这一轮无法像公开可比公司那样按简单收入倍数承销。 这很重要，因为公开市场的光通信与 AI
              网络区间很宽，但仍有边界：Coherent 约为 9.4x EV/收入，Marvell 约为 21.2x，Broadcom 约为 25.3x；后两者由规模、软件或深嵌超大规模客户的能力支撑，而 Celero
              尚未公开证明这些能力。 Celestial AI、Lightmatter、Ayar Labs 等私有光学同行表明，投资人愿意为稀缺互连资产支付战略溢价，但这些公司也披露了更大的融资体量，
              有些还给出了更成熟的商业化叙事。因此，Celero 的 $1B 标记作为稀缺性溢价是可信的；作为由基本面支撑的估值，只能有条件地成立。
