      - number: '5.2'
        title: 架构、集成与部署模式
        blocks:
          - type: paragraph
            body: >-
              Celero 没有公开标准版框图，因此最佳架构重建来自招聘信号和外部标准工作。公开岗位覆盖 ASIC 设计、设计验证、RTL、DSP-FEC、光
              DSP、SerDes、PLL、模拟版图、物理验证、物理设计、固件和产品工程。这种岗位组合强烈指向完整定制相干 DSP 项目，而不是狭窄的算法 IP 店。可能的运行栈从主机侧电 I/O 和时钟开始，经过 DSP
              与前向纠错引擎，再进入相干光模块管理固件和封装级实现。OIF 技术工作提供了这套堆栈周围的标准语境：用于相干模块管理的 C-CMIS、CMIS 安全扩展、224G 和 448G 芯片到模块接口，以及
              1600ZR、1600ZR+、1600CL 和面向 AI 纵向扩展链路的计算光学接口等路线图工作，协议包括 PCIe、NVLink 和 UALink。因此，部署很可能意味着 Celero
              芯片进入模块厂商、交换机或路由器平台以及超大规模云光学团队的认证循环，而不是作为独立终端产品销售。
