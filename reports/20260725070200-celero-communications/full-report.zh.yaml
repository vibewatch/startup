      - number: '8.3'
        title: 建议、置信度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议立场是跟踪，置信度中等、风险评级高、估值偏紧。这个判断比直接回避更积极，因为市场顺风真实存在，创始团队背景高度相关，
              私有可比公司也证明，当产品市场匹配出现时，光互连稀缺性能撑住大估值。它又不及买入，因为已审阅证据还没有证明商业化达到新投资人从 $1B
              入场并承销强回报所需的水平。落到投委会，不需要再听更多光学需求故事；需要证明的是，Celero 正在把这些需求转化为可落地的设计卡位、 收入和可防守经济性。最快上调路径，是经验证的 run-rate 收入超过约
              $100M、具名超大规模云或模块项目赢单， 以及部署层证据证明 Celero 的带宽和功耗主张在生产环境里站得住。最快下调路径，是流片延迟、客户转化弱、架构迁移离开偏 DSP 的链路，
              或融资条款实质性压低新普通股价值。
