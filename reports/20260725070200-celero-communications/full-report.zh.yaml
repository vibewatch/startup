      - number: '4.2'
        title: GTM 动作、销售效率代理指标与公开牵引缺口
        blocks:
          - type: paragraph
            body: >-
              最可能的商业化动作是经典第三方硅片设计导入模式：Celero 必须说服少数超大规模云、云运营商、光模块厂商或系统 OEM 认证一套新的相干 DSP
              架构，再把这些设计导入转化为生产爬坡。公开来源强调面向超大规模和云客户的商业化，而不是宽渠道软件分发，也强化了这一假设。因此，ARR、CAC 回收期或 NRR 等传统 SaaS
              效率指标不是今天合适的公开视角；更相关的问题是认证周期长度、样片到设计导入转化率、NRE
              回收、按速度等级划分的毛利率，以及客户集中度。公开牵引几乎完全不透明。没有披露营收、ARR、签约订单、活跃客户数、出货量、未交付订单
              或利用率指标，也没有具名的超大规模云量产部署。指标缺失很重要，因为第三方网络芯片即便规模化，也可能高度集中在少数买方。成熟可比公司 Marvell 披露，2026 财年前十大客户贡献 82%
              收入，这意味着更早期的相干 DSP 初创公司可能更暴露于少数账户。尽调结论是，Celero 可能具备战略 GTM 动能，但公开证据尚未证明可重复商业牵引。
