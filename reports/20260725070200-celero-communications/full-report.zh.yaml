          value: Published watts / lane
          unit: null
          detail: 观察 Celero 是否披露第三方功耗或延迟结果
          trend: unknown
        - label: 设计定点集中度
          value: 1-3 flagship pursuits
          unit: null
          detail: 健康信号不是只押一个锚定客户，而是出现不止一条可信客户路径
          trend: unknown
        - label: 出口合规准备度
          value: ECCN + screening workflow
          unit: null
          detail: 跟踪正式出口分类和所有权筛查披露
          trend: unknown
        - label: 人才厚度
          value: Critical hires closed
          unit: null
          detail: 观察验证、固件、产品和招聘岗位是否补齐
          trend: unknown
        - label: 晶圆代工 / 封装可见度
          value: Node and partner clarity
          unit: null
          detail: 最好的信号是明确披露制造、封装或模块合作伙伴
          trend: unknown
    approximationNotes: KPI 面板使用可监控里程碑，而非量化公司 KPI，因为 Celero 尚未公开披露收入、良率或客户指标。
    claimRefs:
      - CR003
      - CR005
      - CR017
      - CR026
      - CR037
      - CR039
      - CR041
  - id: FV001
    title: 情景估值桥
    type: waterfall
    layout: wide
    summary: 瀑布图展示：设计定点成功会把基准估值推高，延误和倍数压缩会把估值拉低。
    data:
      items:
        - label: 基准情景
          value: 950
        - label: 设计定点带来的乐观上行
          value: 1250
        - label: 延误 / 倍数压缩带来的悲观拖累
          value: -500
    approximationNotes: 数值是以百万美元计的情景示意，锚定公开可比公司的估值重心和私募可比溢价，而非公司披露收入。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV048
  - id: FV002
    title: 可比公司倍数图
    type: bar
    layout: wide
    summary: 公开市场估值倍数划出一个区间；证据成熟后，Celero 要么证明自己配得上，要么以折价切入。
    data:
      items:
        - label: Broadcom EV / 收入
          value: 25.34
        - label: Marvell EV / 收入
          value: 21.24
        - label: Coherent EV / 收入
          value: 9.43
        - label: Celero 按 $50M 收入隐含估值
          value: 20
        - label: Celero 按 $100M 收入隐含估值
          value: 10
    approximationNotes: 公开市场倍数是截至 July 2026 的当前市场快照；Celero 隐含倍数是用 $1B 上轮估值做的简单股权价值计算。
    claimRefs:
      - CV010
      - CV012
      - CV015
      - CV026
      - CV028
      - CV029
  - id: FV003
    title: 情景概率图
    type: kpi
    layout: standard
    summary: 按概率加权后，当前轮估值已经接近模型区间的期望价值中枢。
    data:
      items:
        - label: 乐观情景概率 %
          value: 25
        - label: 基准情景概率 %
          value: 50
        - label: 悲观情景概率 %
          value: 25
        - label: 推荐分（10=买入）
          value: 5
    approximationNotes: 最终分数是委员会的判断速记：5 意味着跟踪，而不是买入或回避。
    claimRefs:
      - CV036
      - CV041
      - CV042
      - CV043
      - CV044
      - CV048
  - id: FV004
    title: 回报驱动图
    type: flow
    layout: wide
    summary: 价值创造取决于一条短链条：从产品验证到收入验证，再到战略可选性。
    data:
      nodes:
        - id: n1
          label: 相干 DSP 差异化
          type: strength
        - id: n2
          label: 具名设计定点
          type: strength
        - id: n3
          label: 收入 + 利润率验证
          type: neutral
        - id: n4
          label: 战略溢价或 M&A 可选性
          type: strength
        - id: n5
          label: 架构 / 稀释风险
          type: risk
        - id: n6
          label: 委员会结论：跟踪 / 中等信心 / 估值偏紧
          type: conclusion
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: 这是定性传导图，不是打分版 Monte Carlo 模型。
    claimRefs:
      - CV003
      - CV037
      - CV040
      - CV041
      - CV043
      - CV047
