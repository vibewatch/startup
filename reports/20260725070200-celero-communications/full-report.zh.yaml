      - number: '3.3'
        title: 切换成本、分销力量与商业不透明度都有利于既有厂商
        blocks:
          - type: paragraph
            body: >-
              这个市场里的竞争耐久性不太取决于品牌，更取决于供应商处在认证和封装流程的哪个位置。Broadcom 和 Marvell 已经熟悉早期接入客户、伙伴和出货爬坡的语言。Broadcom
              明确引导客户联系直销获取定价和样品；Futurum 则指出，收发器认证周期长，早期设计导入一旦拿下就很黏。Marvell 同样强调大批量出货和宽广装机基础。这些信号重要，因为一旦
              DSP、光引擎或共封装设计被验证进模块或机架架构，买方切换供应商就要面对重新测试成本、固件和 FEC 调优工作，以及进度风险。


              初创公司的位置不一。Ayar 和 Lightmatter 都在谈制造就绪、伙伴参与和早期接入计划，但公开证据仍显示其商业化路径 以设计伙伴关系为中心，而不是广泛目录销售。Celestial AI
              声称与超大规模云和封装生态深度合作；如果这些项目落地，可能转化为集中但有力的渠道。Coherent 和 InnoLight 则提示 Celero 面临另一道难题：现状往往让买方继续使用熟悉的模块厂商，而 DSP
              可由模块厂商在底层采购，上游新硅片品牌的可见度会被削弱。在这种世界里，多归属存在，但很大一部分权力掌握在模块厂商、超大规模云和平台所有者手中，而不是一家独立 DSP 初创公司手中。


              最值得注意的未知项是商业透明度。审阅来源中没有任何一家公布 DSP 芯片的真实目录价。客户名称、实际 ASP 和量产承诺大多仍是私有信息。这使得证明 Celero
              近期具备定价杠杆变得困难，也提高了商业权力流向那些已经控制认证窗口、伙伴生态和制造产能者的概率。
