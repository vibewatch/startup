      - number: '7.4'
        title: 致命场景、缓释措施与监测信号
        blocks:
          - type: paragraph
            body: >-
              评估 Celero，最清楚的框架不是泛泛谈初创公司不确定性，而是看致命场景。第一条致命链是硅片失败：如果首版硅片没有达到功耗、良率或互操作目标， Celero
              可能持续烧钱，却拿不到下一轮融资或批量承诺所需的客户证明。第二条是代工或地缘政治：TSMC 准入问题、台湾扰动，或出口管制进一步扩张，
              即使设计技术上成立，也可能打破进度、出货或成本假设。第三条是商业集中：如果一两个超大规模云级机会失败，或客户改选自研方案、既有厂商的开放标准生态，
              工程投入与收入之间的缺口可能撑不住。第四条是法律摩擦：即便今天没有公开案件，商业秘密或雇佣纠纷一旦出现在错误时间点，可能卡住招聘、拖慢尽调或收窄战略选项。 缓释因素确实存在——资本充足、创始人经验深、顺着光学
              AI 趋势、市场明显需要低功耗长距互连——但在公开证据证明流片进展、可量化功耗性能、 客户认证以及超出创始核心的团队深度之前，剩余风险仍然高。
