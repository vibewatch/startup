- id: milestones-scale-signals-and-adverse-cautions
  title: Milestones, Scale Signals, and Adverse Cautions
  body: 'Celero’s dated public record shows a young company moving quickly from legal formation to large financing, but without the disclosure density usually seen once a hardware startup reaches this funding level. The earliest hard milestones are legal and regulatory: a February 2024 California filing footprint, a December 2024 Form D with 40 investors and nearly $30 million sold, and a signature date just before year-end. The external narrative then accelerates in November 2025 when the company publicizes the $140 million total raise, Reuters independently explains the chip architecture and use case, and investor-board participation becomes explicit through James Luo and Stefan Dyckerhoff quotes. A later exempt-offering notice suggests additional financing paperwork around the Series B period, while the 2026 registry and careers-page snapshots indicate an active, multi-site buildout. The strongest adverse signal is not legal or regulatory trouble, but disclosure incompleteness: Tech in
    Asia argues Celero has not yet shared enough technical detail, tapeout status, or partnership proof to prove a durable edge in a crowded coherent-DSP field. That caveat matters because customer, revenue, and valuation evidence remain sparse.'
