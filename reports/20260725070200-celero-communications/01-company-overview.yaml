  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Exact post-money valuation for the 2025 Series B and any explicit unicorn-status confirmation are not publicly disclosed in reviewed sources.
    whyItMatters: Valuation is a core benchmark for stage, dilution, and later return expectations.
    diligencePath: Request the Series B term sheet or cap-table summary from management or lead investors.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: financial-gap
    missingEvidence: Revenue, ARR, gross margin, and other operating financial metrics are absent from public sources.
    whyItMatters: Without revenue disclosure, the company’s scale and efficiency cannot be benchmarked against the capital raised.
    diligencePath: Request management financial statements or a board package covering revenue, bookings, and burn.
    relatedQuestionRefs:
    - QO016
  - type: private-evidence-only
    severity: material
    topic: customer-gap
    missingEvidence: Customer count, customer concentration, and named commercial design wins are not publicly disclosed.
    whyItMatters: Commercial proof is essential for judging whether the funding round reflects product-market adoption or only technical promise.
    diligencePath: Request a customer pipeline, design-win list, and any hyperscaler or module-partner references under NDA.
    relatedQuestionRefs:
    - QO017
    - QO025
  - type: private-evidence-only
    severity: minor
    topic: headcount-gap
    missingEvidence: Exact employee headcount is not publicly disclosed even though current hiring is visible.
    whyItMatters: Headcount is a basic scale metric and helps evaluate capital efficiency and organizational maturity.
    diligencePath: Request a current org chart and total employee count by site.
    relatedQuestionRefs:
    - QO018
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: Public materials do not disclose the full board package, voting/control rights, detailed cap table, debt facilities, or any secondary transactions.
    whyItMatters: Control rights and financing structure can materially affect governance, liquidation outcomes, and follow-on financing flexibility.
    diligencePath: Request financing documents, board roster, investor rights agreements, and any debt or secondary summaries.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
