  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: foundry-disclosure
    missingEvidence: Foundry, node, packaging, and module-partner disclosures plus backup supply plans.
    whyItMatters: Manufacturing concentration is one of the chapter’s top kill scenarios and public sources do not show Celero’s
      actual supply plan.
    diligencePath: Request current foundry agreement summary, node roadmap, packaging chain, and contingency plans under NDA.
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customer evaluations, design wins, qualification stages, and expected concentration by account.
    whyItMatters: Commercial risk is dominated by whether one or two hyperscaler-scale programs exist and how concentrated
      they are.
    diligencePath: Request pipeline by stage, named reference customers, and concentration scenarios for first revenue cohorts.
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: employment-and-ip
    missingEvidence: Founder and key employee invention-assignment, confidentiality, and non-solicit agreements plus any freedom-to-operate
      analysis.
    whyItMatters: Trade-secret risk is a real downside for a team built from direct sector incumbents and cannot be underwritten
      from public pages.
    diligencePath: Collect key employment agreements and outside-counsel IP diligence memo before investment approval.
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: product-readiness
    missingEvidence: Tape-out status, first-silicon plan, power benchmarks, latency targets, and interoperability results.
    whyItMatters: Technical execution and power-performance are the fastest paths from premium financing to value impairment.
    diligencePath: Request milestone dashboard, lab data, and third-party validation results for the current silicon generation.
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: minor
    topic: public-litigation-scan
    missingEvidence: Independent confirmation of any current Celero-specific IP, employment, or export-enforcement matter
      beyond the reviewed public corpus.
    whyItMatters: No public dispute surfaced in this review, but absence of public records is not affirmative clearance.
    diligencePath: Run counsel-led docket, demand-letter, and regulator-inquiry diligence directly with the company and its
      investors.
    relatedTableRefs:
    - TR002
