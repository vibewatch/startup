- id: cost-structure-unit-economics
  title: Cost structure, margin path, and unit-economics benchmarks
  body: 'Celero’s cost structure should be modeled as R&D-heavy and foundry-dependent. Benchmark sources on fabless tape-outs and public networking-chip filings show where cash leaves the system before revenue scales: design-team payroll, EDA and IP licenses, mask and wafer spending, outsourced packaging and test, and inventory or capacity reservations taken ahead of firm customer demand. For a networking or optical ASIC program, 7nm-28nm total NRE can run roughly $5M-$30M, while leading-edge 3nm-5nm programs can reach $30M-$100M+, with wafer costs of roughly $16k-$22k and packaging/test adding more unit cost. Those ranges help frame Celero’s challenge: even if coherent DSP ASPs are structurally premium, early margins are vulnerable to low-volume manufacturing, respins, and slow cost absorption. Marvell’s filing is a useful benchmark because it ties margin performance to scale, mix, inventory discipline, foundry access, and outsourced packaging/test economics; it also notes that ASIC-style
    engagements can carry lower gross margins and milestone-based NRE recovery. Celero has provided no public gross-margin, yield, power-per-bit, or variable-cost disclosure, so margin underwriting must remain provisional. The most defensible public conclusion is qualitative: the category can become very attractive at scale, but the path from samples to mature margins is capital intensive and execution sensitive.'
  claimRefs:
