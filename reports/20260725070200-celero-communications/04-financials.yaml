callouts:
- calloutType: risk
  title: Headline funding does not solve the underwriting problem
  body: Celero has proven that investors will finance the AI-interconnect thesis, but public disclosure still stops before the numbers required to judge revenue quality and runway. Without cash balance, burn, sample status, customer concentration, or gross-margin data, the $140M headline round is necessary context, not an investable financial model.
  claimRefs:
  - CI001
  - CI037
- calloutType: insight
  title: If Celero lands qualification, coherent DSP economics can be attractive
  body: The category benefits from premium coherent-DSP pricing, clear hyperscaler demand for longer-reach AI connectivity, and still-open room for merchant vendors as pluggable coherent adoption expands. The financial upside is real; the blocker is proving that Celero can translate category tailwinds into customer-qualified, margin-bearing production shipments.
  claimRefs:
  - CI010
  - CI012
  - CI013
  - CI026
