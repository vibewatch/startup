- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: 'Celero’s main cash-flow pressure points come before revenue visibility: tape-out, outsourced manufacturing, inventory commitments, and delayed qualification.'
  data:
    columns:
    - Cash timing
    - Why cash leaves early
    - Implication
    rows:
    - label: Design team, EDA, and IP
      values:
      - Pre-revenue
      - R&D and tool spend begin well before production
      - Burn can stay high even with no recognized revenue
    - label: Tape-out / masks / wafers
      values:
      - Pre-sample to pre-production
      - Node choice determines multi-million-dollar NRE and wafer commitments
      - A respin can materially shorten runway
    - label: Packaging, test, and substrates
      values:
      - Qualification to ramp
      - Outsourced back-end costs scale before mature volume economics
      - Gross margin lags until utilization improves
    - label: Inventory and capacity reservations
      values:
      - Ahead of demand
      - Foundry and substrate partners may require long lead commitments
      - Working capital can rise before collections
    - label: Qualification delays / hybrid adoption
      values:
      - Revenue timing risk
      - Supply and deployment bottlenecks can push customer ramps outward
      - Another round may fund delay rather than growth
  approximationNotes: This is a qualitative cash-flow map because Celero has not disclosed cash balance, monthly burn, capex, or debt terms.
