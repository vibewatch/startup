- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 7nm-28nm program NRE benchmark
    - $5M-$30M total NRE
    - Medium
    - Frames the cost of a mainstream networking/optical chip program before scale revenue
    - Confirm Celero process node, mask budget, IP licensing cost, and respin reserve
  - - 3nm-5nm program NRE benchmark
    - $30M-$100M+ total NRE
    - Medium
    - Shows how quickly capital needs rise if Celero is at the leading edge
    - Provide actual node choice, foundry partner, and expected full-mask timing
  - - Leading-edge wafer cost benchmark
    - $16k-$22k per wafer
    - Medium
    - Variable cost and cash precommitments can dominate early gross-margin math
    - Disclose wafer pricing assumptions, yield targets, and substrate/package BOM
  - - Coherent DSP ASP premium vs PAM4
    - ~10x higher benchmark ASP
    - Medium
    - Premium ASP potential supports margin upside if Celero can qualify products
    - Show Celero target ASP, power-per-bit, and gross margin by speed grade
  - - Celero gross margin / yield / utilization
    - Publicly undisclosed
    - Low
    - Without these metrics, investors cannot underwrite contribution margin or breakeven
    - Open data room on gross margin bridge, yield curve, and utilization assumptions
  notes: Only the benchmark rows are source-backed numerically; Celero-specific unit economics remain undisclosed and are the core blocker to underwriting.
