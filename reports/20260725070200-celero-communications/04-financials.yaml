- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Current value / status
  - Implication
  - Diligence ask
  rows:
  - - Cash on hand
    - Undisclosed publicly after the November 2025 financing
    - Cannot size real runway without post-close balance and working-capital commitments
    - Provide month-end cash and restricted cash after Series B close
  - - Monthly burn
    - Undisclosed; public sources only support benchmark inference
    - Burn sensitivity drives next-round timing more than headline funding does
    - Provide monthly opex, capex, wafer prepayments, and cash burn by quarter
  - - Runway months
    - Undisclosed; not underwritable from public evidence alone
    - Runway depends on node choice, respins, and customer qualification timing
    - Provide base / downside runway and covenant assumptions
  - - Planned use of funds
    - Expand silicon development and commercialization across hyperscale/cloud customers
    - Supports product progress, but not enough to prove unit economics
    - Map capital allocation across R&D, tape-out, packaging/test, and GTM
  - - Next-round trigger
    - Most likely customer qualification plus credible production timing
    - Without design-win proof, another raise could fund delay rather than scale
    - Disclose milestone plan from samples to production
  - - Debt / project finance obligations
    - No public evidence of debt or project finance
    - Capital stack appears equity-funded, but liabilities could still be off-page
    - Provide debt schedule, equipment leases, and foundry reservation obligations
  notes: The only hard public financing fact is the $140M total equity raise; every other adequacy input needed for runway math is missing or requires private disclosure.
  claimRefs:
  - CI001
  - CI003
  - CI036
  - CI037
  - CI042
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue by phase (samples, NRE, production)
    - Cannot separate high-quality recurring shipments from one-time milestone revenue
    - Request monthly revenue bridge from sample/NRE to production shipments by customer
  - - ASP and gross margin by speed grade
    - Cannot test whether premium coherent pricing offsets foundry and OSAT costs
    - Obtain SKU-level pricing, costed BOM, yield assumptions, and gross-margin waterfall
  - - Customer concentration and backlog
    - Cannot judge dependence on one or two hyperscaler accounts
    - Review backlog, pipeline by design stage, and top-customer exposure
  - - Cash burn and runway
    - Cannot assess capital adequacy or financing dependency
    - Request monthly cash burn, committed spend, and downside runway model
  - - Foundry / package reservations and respin budget
    - Cannot evaluate hidden working-capital and execution risk
    - Review foundry agreements, substrate commitments, and respin contingency reserve
  notes: These are the highest-priority diligence gaps because they determine whether Celero is early revenue, pre-revenue, or capital constrained despite a large headline raise.
