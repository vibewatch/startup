  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Monthly cash burn, current cash balance, wafer commitments, and management runway model.
    whyItMatters: These inputs determine whether the $140M raise funds execution or merely buys time until the next financing.
    diligencePath: Request monthly cash bridge, quarterly board budget, and downside runway model from finance.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-margin
    missingEvidence: SKU-level ASPs, discounts, yield assumptions, and gross-margin waterfall by speed grade.
    whyItMatters: Premium coherent pricing is the core bull case, but without price realization and cost data the margin path is speculative.
    diligencePath: Open data room with price list, booked contracts, yield reports, and costed BOM by product generation.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-traction
    missingEvidence: Named design wins, sample status, backlog, and customer concentration by stage.
    whyItMatters: Customer proof is the only way to convert a category story into an investable revenue model.
    diligencePath: Review pipeline by customer, qualification milestones, and signed supply or development agreements.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: Explicit disclosure of whether Celero recognizes any NRE, sample, or milestone revenue before production shipments.
    whyItMatters: Revenue quality depends on separating one-time engineering payments from repeatable product demand.
    diligencePath: Obtain accounting policy memo and historical invoice mix across NRE, samples, and production.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: supply-commitments
    missingEvidence: Foundry reservations, substrate agreements, packaging-test commitments, and respin reserve.
    whyItMatters: Hidden prepayments and supply commitments can shorten runway even when headline cash appears strong.
    diligencePath: Inspect foundry, OSAT, and substrate contracts plus any capacity prepayment schedules.
    relatedQuestionRefs:
    - QI020
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
