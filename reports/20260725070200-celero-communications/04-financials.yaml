    - Not publicly disclosed; no public shipments or backlog
    - Core future stream, but not yet evidenced publicly
    - Provide booked orders, ASP by speed grade, and production timing by customer cohort
  - - Engineering samples / evaluation lots
    - Pre-production silicon sent for qualification and interoperability work
    - sample lots
    - Likely but undisclosed; commercialization language suggests pre-volume phase
    - Could validate design wins, but not durable revenue by itself
    - Disclose sample status, customer labs, and conversion from eval to volume
  - - NRE / milestone recovery
    - Custom design, bring-up, or qualification payments tied to milestones
    - program milestones
    - No public disclosure at Celero; comparable ASIC models use milestone NRE
    - Useful cash inflow if present, but lower quality than repeat shipments
    - Break out NRE revenue, milestone schedule, and margin treatment
  - - Reference-platform / ecosystem enablement
    - Revenue via module/OEM integration support around coherent engines
    - program / contract
    - No public disclosure
    - Potentially strategic, but economically unclear
    - Name module or OEM partners and associated commercial terms
  - - Future software/firmware support
    - Possible enablement, diagnostics, or integration support around silicon
    - support contract
    - No public evidence
    - Incremental only; not underwritten
    - Clarify whether any recurring support revenue exists
  notes: Celero has not disclosed revenue mix, shipments, or ASPs; rows therefore separate plausible mechanisms from verified public disclosure and indicate where evidence is missing.
