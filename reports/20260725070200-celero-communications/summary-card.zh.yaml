  topStrengths:
    - |
      世界级创始团队：Nariman Yousefi（Marvell/Inphi）和 Oscar Agazzi（ClariPhy/Broadcom）是当今资历最硬的相干 DSP 架构师之一，手里有深厚 IP，也握有超大规模云厂商关系。
    - |
      战略投资人信号：CapitalG（Alphabet）领投 Series B，强烈暗示 Google 是设计合作伙伴或早期商业化候选客户，需求侧风险大幅降低。
    - |
      巨大市场拉力：AI 集群带宽需求的翻倍速度快于互连供给；相干 DSP 是 1.6T+ 机架级链路唯一可行路径，Celero 正卡在关键瓶颈上。
    - |
      不对称 M&A 可选性：Marvell 2021 年以 $10B 收购 Inphi，加上 Alphabet 支持的硬件收购先例，说明 Celero 在达到可收购规模后是可信的战略收购标的。
  topRisks:
    - |
      ASIC 流片执行风险：首代先进制程相干 DSP 单次流片成本达 $10–50M+，失败率不低；只要进度滑 12–18 个月，入场估值就会明显受损。
    - |
      TSMC 单一晶圆厂集中：台湾供应中断、地缘政治限制或先进制程产能分配被挤压，都会让 Celero 制造管线停摆，短期没有替代方案。
    - |
      架构替代：线性驱动光学（LPO）、共封装光学（CPO）或硅光子采用提速，可能在 Celero 放量前压缩独立相干 DSP 芯片的可服务市场。
    - |
      资本强度与稀释：从工程样品爬坡到超大规模云厂商量产，需要继续投入大量资本，现有投资人面临显著稀释风险。
    - |
      出口管制暴露：BIS 半导体法规（EAR Part 774）和 CHIPS Act 条款带来持续合规义务；任何失误都可能限制晶圆厂准入或客户关系。
