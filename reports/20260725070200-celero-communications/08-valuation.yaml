  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue assumption
  - Multiple
  - Implied valuation
  - Probability
  - Key driver
  rows:
  - - Bull
    - $180M-$220M medium-term revenue from 2-3 hyperscaler or module-platform wins
