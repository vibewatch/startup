    - Public comps are larger, disclosed, and in Broadcom's case software-enhanced
  - - Private round comparison
    - Celestial ~$2.5B, Lightmatter ~$4.4B, Ayar ~$3.75B
    - $1.0B looks possible as a scarcity premium but not obviously cheap
    - 25%
    - Medium
    - Private rounds are preference-heavy and rarely disclose clean revenue denominators
  - - Strategic M&A precedent
    - Inphi, Xilinx, Habana show buyers paying for bottleneck control
    - Supports upside optionality above public-comp gravity
    - 20%
    - Low-Medium
    - Older transactions with different product breadth and macro conditions
  - - Risked scenario build / pseudo-DCF
    - Revenue bands of <$50M, $75M-$100M, and $180M-$220M with probability weighting
    - Expected value clusters around the last-round mark rather than far above it
    - 20%
    - Low
    - No disclosed starting revenue, margin, or cap-table data
  notes: Weights are heuristic and meant to discipline the recommendation, not to imply model precision beyond the public evidence base.
