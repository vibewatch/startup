  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: current revenue and margin disclosure
    missingEvidence: Current revenue run rate, gross margin, and shipment or design-win conversion metrics for Celero.
    whyItMatters: Without revenue and margin disclosure, the $1 billion round cannot be tested against actual commercialization progress or public multiple gravity.
    diligencePath: Request management KPI pack, 2025/2026 board materials, and customer-backed shipment or booking evidence.
    relatedQuestionRefs:
    - QV004
    - QV016
    - QV017
    - QV029
  - type: private-evidence-only
    severity: material
    topic: cap-table preferences and round terms
    missingEvidence: Liquidation preference stack, participation terms, employee option overhang, and any secondary pricing attached to the November 2025 round.
    whyItMatters: A $1 billion headline valuation can overstate common-equity value if preferences or structured terms materially change realized exit proceeds.
    diligencePath: Review financing documents, cap table waterfall, and any side letters or insider secondary transactions.
    relatedQuestionRefs:
    - QV023
    - QV030
  - type: missing-source
    severity: material
    topic: named hyperscaler design-win evidence
    missingEvidence: Public or confidential proof of named design wins, qualification stage, ASPs, and volume timing at hyperscalers or optical module partners.
    whyItMatters: Design wins are the main bridge from strategic narrative to the bull and base cases; without them, premium valuation upside remains speculative.
    diligencePath: Request customer reference calls, qualification letters, pipeline by account, and launch timing by product generation.
    relatedQuestionRefs:
    - QV021
    - QV027
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table coverage remains intentionally partial
    missingEvidence: A fuller roster of optical interconnect startups with disclosed valuation, revenue, and financing terms.
    whyItMatters: Private comp disclosure is uneven, so the table uses the best disclosed set rather than pretending to be exhaustive.
    diligencePath: Supplement with PitchBook, CB Insights, and banker precedent decks covering undisclosed or semi-disclosed optical hardware rounds.
