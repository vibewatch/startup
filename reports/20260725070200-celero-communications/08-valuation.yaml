tables:
- id: TV001
  title: Comparable valuation table
  columns:
  - Company
  - Sector / product
  - Stage / status
  - Valuation or multiple
  - Comp relevance
  - Adjustment to Celero
  rows:
  - - Marvell
    - AI networking / optical DSP / custom silicon
    - Public
    - 21.24x EV / Revenue; ~$170-174B market cap
    - Closest public coherent-DSP adjacency with hyperscaler exposure
    - Discount for public scale, broader product mix, and disclosed revenue
  - - Broadcom
    - Custom AI ASICs + networking + infrastructure software
    - Public
    - 25.34x EV / Revenue; ~$1.82-1.87T market cap
    - Shows how software and hyperscaler breadth expand multiples
    - Heavy discount; Broadcom software and scale are not transferable
  - - Coherent
    - Optical components and photonics supply chain
    - Public
    - 9.43x EV / Revenue; ~$55B market cap
    - Best public optical-component gravity anchor
    - Useful lower bound because Coherent is scaled and component-heavy
  - - Celestial AI
    - Photonic fabric optical interconnect
    - Private Series C1
    - ~$2.5B valuation; $255M round
    - Direct private optical peer with strong strategic syndicate
    - Celestial has larger capital base and more disclosed private momentum
  - - Lightmatter
    - Photonic compute / interconnect
    - Private Series D
    - ~$4.4B valuation; $400M round
    - High-premium photonics peer for strategic ceiling
    - Celero is earlier and less publicly evidenced on commercial scale
  - - Ayar Labs
    - Co-packaged optics for AI scale-up
    - Private Series E
    - ~$3.75B valuation; $500M round
    - Shows what investors pay for scarce optical bottleneck control
    - Ayar has deeper capital, production emphasis, and broader ecosystem backing
  notes: Selected disclosed public and private optical / AI-infrastructure comparables only; the private universe is partial because many startup rounds omit clean valuation or revenue denominators.
