- id: TV005
  title: Final diligence asks table
  columns:
  - Question
  - Evidence needed
  - Impact on valuation stance
  - Priority
  rows:
  - - What is current run-rate revenue and gross margin?
    - KPI pack, audited or board-level revenue bridge, gross-margin history
    - Could upgrade stretched to fair or attractive if scale is already >$100M
    - Critical
  - - Which hyperscalers or optical-module partners are in qualification or production?
    - Named customer list, design-win stage, ASP and volume timing
    - Would validate bull/base scenarios and support strategic premium
    - Critical
  - - What are the November 2025 round terms?
    - Cap table waterfall, preferences, employee overhang, any secondary prints
    - Can sharply change common-equity value versus headline post-money
    - High
  - - How durable is the DSP architecture versus LPO / CPO alternatives?
    - Independent benchmark data, customer deployment power metrics, roadmap comparison
    - Could either preserve or compress the long-run multiple band
    - High
  - - What is the cash-burn and follow-on financing plan?
    - Budget, fab commitments, hiring plan, cash runway model
    - Determines dilution risk and realized investor return
    - High
  notes: The list is ordered by expected valuation sensitivity rather than by general company-quality curiosity.
