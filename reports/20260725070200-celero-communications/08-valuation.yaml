- id: risk-adjusted-return-framework
  title: Risk-Adjusted Return Framework and Monitoring Metrics
  body: 'At the last round price, returns are asymmetric only if the company clears a small number of commercialization gates quickly. Upside to roughly $2.0-2.5 billion requires both capture of a fast-growing AI-optics market and preservation of a premium valuation regime; downside toward roughly $0.5 billion can happen with just one missed adoption cycle or one major architecture pivot. That means the right monitoring framework is not generic startup optimism but a short driver list tied to value transmission: design wins into revenue, revenue into gross margin, margin into financing leverage, and financing leverage into eventual ownership outcomes. Investors should therefore track named design wins, quarterly revenue conversion, gross margin trajectory, AI-optics demand growth, and cash burn against the $140 million funding base. Strategic precedent still matters here: Marvell-Inphi, Intel-Habana, and AMD-Xilinx all show that bottleneck-control assets can be bought for strategic reasons
    before mature public-style disclosures exist. But those precedents help only if Celero demonstrates that it owns a bottleneck buyers actually need.'
