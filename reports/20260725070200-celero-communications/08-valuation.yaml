  - CV046
- id: TV006
  title: Return attribution table
  columns:
  - Value driver
  - Current evidence
  - Bull case contribution
  - Bear case drag
  - Diligence ask
  rows:
  - - Hyperscaler design wins
    - No named wins publicly disclosed
    - Adds scale credibility and raises exit optionality
    - Without wins, revenue ramps slowly and premium collapses
    - Customer reference calls and qualification pipeline
  - - Revenue conversion
    - Funding disclosed; revenue undisclosed
    - Turns scarcity narrative into investable multiple support
    - No proof keeps the $1B mark narrative-heavy
    - Board KPI pack and bookings bridge
  - - Architecture fit
    - Large market growth but roadmap shifting toward LPO/CPO efficiency
    - If Celero stays essential, strategic premium can persist
    - If DSP content compresses, terminal multiples fall quickly
    - Independent power / bandwidth benchmark data
  - - Capital efficiency
    - Only ~$140M raised to date leaves room for leverage if execution is fast
    - More proof before the next round can preserve ownership
    - Manufacturing or GTM scale-up could force dilution
    - Runway model and next-financing plan
  - - Strategic buyer optionality
    - M&A precedent exists across optics and AI silicon
    - Can create a bid floor above public-comp gravity
    - No direct buyer evidence today; optionality may be overstated
    - Banker feedback and inbound-interest history
  notes: This framework links operating proof to investor outcome, emphasizing what changes equity value rather than what merely improves the story.
