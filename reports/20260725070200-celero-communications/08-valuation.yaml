    - One real design-win cycle supports but does not re-rate the mark
  - - Bear
    - <$50M revenue after a one-cycle delay, incumbent response, or architecture shift
    - 8x-10x on a smaller base
    - $0.4B-$0.7B
    - 25%
    - Commercialization delay and multiple compression arrive together
  notes: All scenarios are illustrative because Celero does not publicly disclose current revenue; probability weights are judgmental and tied to commercialization timing rather than audited financial statements.
