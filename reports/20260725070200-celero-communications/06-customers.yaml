      - ['Optical module makers and OEMs', 'Buyer = product and platform leaders; user = module, SerDes, DSP, and validation engineers; payer = platform R&D and component procurement budgets', 'Embed or qualify DSP into transceivers or subsystems sold into hyperscalers', 'Celero marketing role explicitly targets module makers for early design wins', 'High channel leverage; one qualified module partner can unlock multiple end customers', 'Margin capture and roadmap control may sit with the channel partner, not Celero']
