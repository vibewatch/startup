  claims:
    - {id: CU001, statement: 'Celero sells coherent DSP solutions for high-bandwidth, low-power optical connectivity in AI infrastructure.', type: company-claimed, topic: product, sourceRefs: [SU001, SU002, SU006], confidence: high, freshness: current, answersQuestionRefs: [QU001, QU006]}
    - {id: CU002, statement: 'Celero positions its technology around links between AI accelerators, servers, clusters, and cloud data centers rather than around end-user applications.', type: company-claimed, topic: use-case, sourceRefs: [SU001, SU006], confidence: medium, freshness: current, answersQuestionRefs: [QU001, QU006]}
    - {id: CU003, statement: 'Celero public hiring and marketing language identifies hyperscalers as a direct early-adopter customer target.', type: company-claimed, topic: customer-segments, sourceRefs: [SU003, SU010], confidence: high, freshness: current, answersQuestionRefs: [QU002]}
    - {id: CU004, statement: 'Celero same marketing language identifies module makers as a parallel early design-win target.', type: company-claimed, topic: channel, sourceRefs: [SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU003, QU021]}
    - {id: CU005, statement: 'Celero raised $140 million in total, including a $100 million Series B led by CapitalG.', type: company-claimed, topic: funding, sourceRefs: [SU006, SU007], confidence: high, freshness: recent, answersQuestionRefs: [QU007, QU009]}
    - {id: CU006, statement: 'CapitalG markets its Google advisor network, customer introductions, channel introductions, and co-selling support as part of its value-add to portfolio companies.', type: company-claimed, topic: capitalg-network, sourceRefs: [SU008, SU009], confidence: high, freshness: current, answersQuestionRefs: [QU010, QU019]}
    - {id: CU007, statement: 'CapitalG described Celero as a roughly 100-person and quickly growing team at the time of its investment note.', type: company-claimed, topic: organization-scale, sourceRefs: [SU007], confidence: medium, freshness: recent, answersQuestionRefs: [QU007]}
    - {id: CU008, statement: 'None of the reviewed Celero official pages disclosed customer count, deployment count, utilization, or shipments.', type: observed, topic: public-disclosure-gap, sourceRefs: [SU001, SU004, SU005], confidence: high, freshness: current, answersQuestionRefs: [QU008, QU014]}
    - {id: CU009, statement: 'Public customer proof on reviewed official surfaces is still mostly strategic signaling rather than production reference-account disclosure.', type: inferred, topic: customer-proof, sourceRefs: [SU004, SU005, SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU009, QU013]}
    - {id: CU010, statement: 'CapitalG and the broader Alphabet ecosystem are the strongest named external validators publicly attached to Celero.', type: inferred, topic: named-proof, sourceRefs: [SU006, SU007, SU008], confidence: high, freshness: recent, answersQuestionRefs: [QU009]}
    - {id: CU011, statement: 'CapitalG frames Celero opportunity around linking thousands of GPUs or XPUs across racks, rows, and entire buildings with minimal latency.', type: third-party-reported, topic: buyer-pain, sourceRefs: [SU007, SU021], confidence: medium, freshness: recent, answersQuestionRefs: [QU011, QU012]}
    - {id: CU012, statement: 'AWS describes AI infrastructure as a scale problem that moves from a single chip to millions of chips over a non-blocking network.', type: third-party-reported, topic: buyer-pain, sourceRefs: [SU013], confidence: medium, freshness: current, answersQuestionRefs: [QU011, QU012]}
    - {id: CU013, statement: 'Google Compute markets large VM fleets, TPUs, dedicated servers, and placement controls that are consistent with hyperscale infrastructure operation.', type: third-party-reported, topic: google-as-buyer-fit, sourceRefs: [SU014], confidence: medium, freshness: current, answersQuestionRefs: [QU002, QU005]}
    - {id: CU014, statement: 'CoreWeave public infrastructure profile confirms AI-cloud operators as a distinct buyer class with 49 data centers, over 1GW of active power, and clusters exceeding 100,000 GPUs.', type: third-party-reported, topic: ai-cloud-segment, sourceRefs: [SU015, SU016], confidence: medium, freshness: current, answersQuestionRefs: [QU004, QU011]}
    - {id: CU015, statement: 'CoreWeave says 9 of its 10 leading foundation-model-provider customers already leverage its AI infrastructure, indicating that AI-cloud operators can aggregate substantial downstream demand.', type: third-party-reported, topic: ai-cloud-segment, sourceRefs: [SU015], confidence: medium, freshness: current, answersQuestionRefs: [QU004]}
    - {id: CU016, statement: 'NVIDIA says AI factories already span tens of thousands of GPUs and soon millions, and require deterministic latency across multiple sites.', type: third-party-reported, topic: network-scale, sourceRefs: [SU020, SU021], confidence: high, freshness: current, answersQuestionRefs: [QU011, QU012]}
    - {id: CU017, statement: 'OIF 2025 AI signaling workshop included Google Cloud, Microsoft, Meta, and OpenAI, showing that Celero target buyer and user community is actively defining next-generation interconnect requirements.', type: observed, topic: standards-and-buyer-set, sourceRefs: [SU024], confidence: medium, freshness: historical, answersQuestionRefs: [QU002, QU023]}
    - {id: CU018, statement: 'OIF 800G coherent work is scoped to campus and data-center interconnect applications up to 800G aggregate bandwidth.', type: observed, topic: interoperability, sourceRefs: [SU023], confidence: medium, freshness: current, answersQuestionRefs: [QU023, QU012]}
    - {id: CU019, statement: 'Lightwave reported that Molex and Prysmian signed a 10-year fiber supply agreement to support hyperscaler and AI-data-center buildouts.', type: third-party-reported, topic: supply-chain, sourceRefs: [SU018], confidence: medium, freshness: recent, answersQuestionRefs: [QU017, QU022]}
    - {id: CU020, statement: 'The same Lightwave report says Prysmian is separately pursuing agreements with hyperscalers and data-center infrastructure providers.', type: third-party-reported, topic: supply-chain, sourceRefs: [SU018], confidence: medium, freshness: recent, answersQuestionRefs: [QU017, QU020]}
    - {id: CU021, statement: 'DellOro commentary cited by Lightwave says AI builds and scale-across DCI are raising expected demand for high-end routers and aggregation switches through 2030.', type: third-party-reported, topic: market-growth, sourceRefs: [SU019], confidence: medium, freshness: recent, answersQuestionRefs: [QU011, QU022]}
    - {id: CU022, statement: 'Coherent markets AI-driven datacom growth, hyperscale data-center optics, and supply-chain support to the same end market Celero wants to serve.', type: third-party-reported, topic: competition, sourceRefs: [SU025], confidence: medium, freshness: current, answersQuestionRefs: [QU022]}
    - {id: CU023, statement: 'Broadcom markets AI infrastructure, networking, and data-center connectivity at scale, reinforcing that Celero competes for budgets already courted by large incumbents.', type: third-party-reported, topic: competition, sourceRefs: [SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU022]}
    - {id: CU024, statement: 'Celero public customer map therefore likely spans direct hyperscaler accounts, AI-cloud operators, and module or OEM channels.', type: inferred, topic: customer-map, sourceRefs: [SU003, SU010, SU015, SU024], confidence: medium, freshness: current, answersQuestionRefs: [QU001, QU003, QU004]}
    - {id: CU025, statement: 'Within those accounts, buyers are infrastructure and network leaders, users are optics and system engineers, and payers are AI-network capex owners.', type: inferred, topic: buyer-user-payer, sourceRefs: [SU010, SU014, SU016], confidence: medium, freshness: current, answersQuestionRefs: [QU001]}
    - {id: CU026, statement: 'North America likely matters first because Celero is California-based, its lead investor is U.S.-based, and reviewed demand signals concentrate on North American hyperscaler and AI-data-center expansion.', type: inferred, topic: geography, sourceRefs: [SU002, SU015, SU019], confidence: low, freshness: current, answersQuestionRefs: [QU005]}
    - {id: CU027, statement: 'Celero public adoption trajectory is visible mainly through funding, headcount scale, and commercial hiring rather than through customer metrics.', type: inferred, topic: adoption-trajectory, sourceRefs: [SU006, SU007, SU003, SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU007]}
    - {id: CU028, statement: 'No reviewed source disclosed active accounts, chips shipped, wafers committed, or network utilization attributable to Celero.', type: observed, topic: adoption-gap, sourceRefs: [SU001, SU004, SU005], confidence: high, freshness: current, answersQuestionRefs: [QU008]}
    - {id: CU029, statement: 'The public evidence is more consistent with sampling, evaluation, or early design-in than with broad production deployment.', type: inferred, topic: stage, sourceRefs: [SU004, SU005, SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU013]}
    - {id: CU030, statement: 'No named public production customer was disclosed on the reviewed official or partner pages.', type: observed, topic: named-proof-gap, sourceRefs: [SU001, SU005, SU007], confidence: high, freshness: current, answersQuestionRefs: [QU014]}
    - {id: CU031, statement: 'Celero job posting language implies parallel pursuit of hyperscaler and module-maker design wins rather than a single-channel go-to-market.', type: company-claimed, topic: go-to-market, sourceRefs: [SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU003, QU019, QU021]}
    - {id: CU032, statement: 'CoreWeave says 68% of enterprises are already beyond experimentation and more than 40% run some form of agent in production.', type: third-party-reported, topic: market-readiness, sourceRefs: [SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU011]}
    - {id: CU033, statement: 'CoreWeave says six in ten enterprises wait more than four months from buying GPU capacity to serving their first production request.', type: third-party-reported, topic: procurement-friction, sourceRefs: [SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU017, QU025]}
    - {id: CU034, statement: 'CoreWeave says a third of enterprises cite accelerator availability as their biggest barrier to expanding AI infrastructure, with supply, memory, storage, power, and cooling also constraining rollout.', type: third-party-reported, topic: procurement-friction, sourceRefs: [SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU017]}
    - {id: CU035, statement: 'Once a networking or optical component is qualified into a large AI architecture, requalification costs and interoperability requirements can make the design win relatively sticky.', type: inferred, topic: durability, sourceRefs: [SU018, SU021, SU023], confidence: low, freshness: current, answersQuestionRefs: [QU015, QU018]}
    - {id: CU036, statement: 'Celero has not publicly disclosed NRR, GRR, churn, renewal rate, contract length, or customer satisfaction metrics.', type: observed, topic: retention-gap, sourceRefs: [SU001, SU004, SU005], confidence: high, freshness: current, answersQuestionRefs: [QU015, QU016]}
    - {id: CU037, statement: 'Public retention analysis for Celero therefore depends on market structure and qualification burden rather than on measured cohorts.', type: inferred, topic: retention-gap, sourceRefs: [SU023, SU024, SU018], confidence: low, freshness: current, answersQuestionRefs: [QU015, QU018]}
    - {id: CU038, statement: 'A first qualified socket could expand from one deployment into more racks, buildings, campuses, or product generations inside the same account.', type: inferred, topic: expansion, sourceRefs: [SU015, SU021, SU007], confidence: medium, freshness: current, answersQuestionRefs: [QU019]}
    - {id: CU039, statement: 'CapitalG stated ability to open customer and partner introductions could accelerate land-and-expand once Celero clears an initial qualification gate.', type: inferred, topic: expansion, sourceRefs: [SU008, SU009], confidence: medium, freshness: current, answersQuestionRefs: [QU010, QU019]}
    - {id: CU040, statement: 'Early commercial concentration risk is likely high because the relevant buyer universe is small and one anchor hyperscaler or channel partner could dominate first revenue.', type: inferred, topic: concentration, sourceRefs: [SU010, SU018, SU019], confidence: medium, freshness: current, answersQuestionRefs: [QU020]}
    - {id: CU041, statement: 'Channel dependence is likely material because module makers and OEMs can mediate qualification access, pricing leverage, and roadmap control.', type: inferred, topic: channel-risk, sourceRefs: [SU010, SU024, SU025], confidence: medium, freshness: current, answersQuestionRefs: [QU021]}
    - {id: CU042, statement: 'Competitive pressure is intense because Broadcom, Coherent, NVIDIA, Molex-linked ecosystems, and other incumbents already market AI networking or optical solutions to the same customers.', type: inferred, topic: competition, sourceRefs: [SU018, SU025, SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU022]}
    - {id: CU043, statement: 'Public evidence supports customer need and Celero buyer fit much more strongly than it supports realized adoption.', type: inferred, topic: overall-proof-balance, sourceRefs: [SU006, SU007, SU010, SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU007, QU009, QU013]}
    - {id: CU044, statement: 'The key diligence asks are named design partners, qualification stage, sample volume, expected production timing, and top-account concentration.', type: inferred, topic: diligence-priority, sourceRefs: [SU008, SU010, SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU024, QU025]}
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: design-partner-count
      missingEvidence: "Exact number of hyperscaler, AI-cloud, and module-maker accounts that have accepted samples or entered formal qualification."
      whyItMatters: "This is the main missing denominator for customer traction and determines whether Celero has one symbolic relationship or a broader commercial funnel."
      diligencePath: "Request a pipeline table with customer name, segment, evaluation stage, sample volume, next milestone, and expected production date."
      relatedQuestionRefs: [QU024]
      relatedTableRefs: [TU002, TU003]
    - type: private-evidence-only
      severity: material
      topic: first-production-timing
      missingEvidence: "Expected timing for first production deployment, first revenue-bearing socket, and first multi-site rollout."
      whyItMatters: "The investment case changes materially if Celero is months away from production revenue versus years away from qualification closure."
      diligencePath: "Ask management for the current qualification calendar and any purchase orders, LTAs, or production-readiness gates already achieved."
      relatedQuestionRefs: [QU025]
      relatedTableRefs: [TU002, TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: "NRR, GRR, renewal rates, contract lengths, and customer reference quality by cohort."
      whyItMatters: "Without retention evidence, investors cannot distinguish a sticky infrastructure component from a technically interesting but unproven pilot program."
      diligencePath: "Request cohort tables for signed accounts showing renewal status, expansion, time-in-stage, and support burden."
      relatedQuestionRefs: [QU015, QU016]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: account-concentration
      missingEvidence: "Top-customer share of pipeline, revenue, and engineering customizations plus any investor-customer overlaps."
      whyItMatters: "A single hyperscaler or module ecosystem could dominate early roadmap and commercial outcomes, materially affecting risk and valuation."
      diligencePath: "Request top-10 account exposure, custom-feature commitments, exclusivity clauses, and forecasted revenue by account."
      relatedQuestionRefs: [QU020, QU021]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: "A fuller set of named customer references, ideally with at least one production deployment and one customer-authored testimonial."
      whyItMatters: "The current proof set is dominated by investor and strategy signals, which are useful but weaker than production customer references."
      diligencePath: "Ask for permission to speak with one hyperscaler or module-partner reference under NDA and to review any public or private case-study materials."
      relatedQuestionRefs: [QU009, QU014]
      relatedTableRefs: [TU003]
