    columns: [Concentration risk, Expansion path, Channel risk, Diligence ask]
    rows:
      - ['One anchor hyperscaler could dominate early roadmap and revenue mix', 'Expand from one validated link class into more clusters, campuses, and generations at the same account', 'Direct account can demand custom features and slow broader portfolio diversity', 'Request top-account pipeline and any exclusivity or custom-feature commitments']
      - ['Module-maker dependence can gate access to end customers', 'One qualified module partner can open multiple hyperscaler programs', 'Partner may capture margin and control design slots', 'Request named module partners, margin split, and partner-sourced pipeline share']
      - ['AI-cloud customer wins can aggregate multiple downstream users but still concentrate on one platform owner', 'Use neo-clouds as fast-moving reference accounts before hyperscaler broadening', 'Cloud-provider budget cycles and GPU supply constraints can delay rollout', 'Request any signed POCs or sampling agreements with AI-cloud operators']
      - ['Investor-customer overlap may accelerate access but blur independent validation', 'CapitalG / Google network can shorten introductions and co-selling cycles', 'Strategic investor influence could bias roadmap toward one ecosystem', 'Ask whether any CapitalG or Google relationship includes commercial rights, pricing advantages, or roadmap constraints']
      - ['Incumbent optical/networking ecosystem is crowded and supply-led', 'Differentiate on power, bandwidth efficiency, and fit-for-data-center coherence', 'Broadcom, Coherent, NVIDIA, Molex-linked and other incumbents already court the same buyers', 'Request win/loss data versus incumbent alternatives and the qualification reasons cited by prospects']
    notes: "The expansion logic is plausible, but early revenue is likely concentrated because the buyer universe is small and qualification-heavy. Each row distinguishes a credible upside path from the corresponding dependency it creates."
    claimRefs: [CU019, CU020, CU023, CU038, CU039, CU040, CU041, CU042, CU044]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: "Celero’s likely customer motion starts with architecture pain and standards alignment, moves through sampling and qualification, and only then turns into multi-site expansion."
    data:
      items:
        - label: Architecture pain recognized
          detail: Hyperscaler or AI-cloud network teams hit latency, bandwidth, reach, or power limits as clusters spread across buildings and campuses.
          tone: risk
        - label: Evaluation / sampling
          detail: Customer or module partner evaluates coherent DSP options against interoperability, power, and performance requirements.
          tone: neutral
        - label: Qualification and standards fit
          detail: Interconnect roadmap must align with OIF-style interoperability, electrical, and optical ecosystem constraints.
          tone: neutral
        - label: Anchor design win
          detail: Celero lands an initial hyperscaler or module-maker socket and gathers roadmap feedback from early adopters.
          tone: positive
        - label: Scale-across expansion
          detail: If the first socket performs, deployment can spread across more clusters, sites, and product generations inside the same account.
          tone: positive
    claimRefs: [CU004, CU017, CU018, CU035, CU038]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: "The public proof set narrows quickly from large target markets into a much smaller, largely undisclosed set of actual design-partner relationships."
    approximationNotes: "Counts are directional estimates based on market structure and public evidence reviewed for this chapter, not company-disclosed customer totals."
    data:
      items:
        - label: Global hyperscalers and large AI-cloud operators
          value: 20
          unit: organizations
          note: Rough universe of direct buyers with the scale problem Celero describes
        - label: Priority high-fit prospects
          value: 8
          unit: organizations
          note: Likely includes the largest hyperscalers plus a few AI-cloud operators and strategic module ecosystems
        - label: Publicly implied design-partner cohorts
          value: 3
          unit: cohorts
          note: Hyperscalers, module makers, and AI-cloud operators are all explicitly or indirectly targeted
        - label: Named public strategic validator
          value: 1
          unit: counterparty
          note: CapitalG / Alphabet ecosystem is the only clearly named high-strategic-value external signal
        - label: Named public production customers
          value: 0
          unit: accounts
          note: No official page reviewed disclosed a production customer by name
    claimRefs: [CU003, CU008, CU010, CU024, CU029, CU030]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: "Evidence quality is strongest for strategic buyer fit and weakest for production deployment and retention visibility."
    data:
      columns: [Evidence specificity, Production visibility, Retention visibility, Reference quality]
      rows:
        - label: CapitalG / Alphabet ecosystem
          values:
            - {label: Strong, tone: positive, detail: 'Named investor, board involvement, and published thesis on the same AI-networking bottleneck.'}
            - {label: Weak, tone: risk, detail: 'No public claim that Google operating units are deploying Celero hardware.'}
            - {label: Weak, tone: risk, detail: 'No contract duration, renewal, or expansion data disclosed.'}
            - {label: Moderate, tone: neutral, detail: 'High strategic relevance, but still investor-led proof rather than user testimony.'}
        - label: Hyperscaler prospects
          values:
            - {label: Moderate, tone: neutral, detail: 'Celero explicitly targets hyperscaler design wins and market sources confirm the pain point.'}
            - {label: Weak, tone: risk, detail: 'No named account, sampling volume, or production milestone is public.'}
            - {label: Weak, tone: risk, detail: 'No public renewal or repeat-purchase data exists.'}
            - {label: Moderate, tone: neutral, detail: 'OIF, AWS, NVIDIA, and CoreWeave make the buyer need highly believable.'}
        - label: Module makers / OEM channels
          values:
            - {label: Moderate, tone: neutral, detail: 'Job postings and standards activity strongly imply this channel matters.'}
            - {label: Weak, tone: risk, detail: 'No named partner or production module is disclosed.'}
            - {label: Weak, tone: risk, detail: 'Economics and durability may sit partly with the channel partner.'}
            - {label: Weak, tone: risk, detail: 'Public evidence is strategy-level, not customer-testimonial-level.'}
        - label: AI-cloud operators
          values:
            - {label: Moderate, tone: neutral, detail: 'CoreWeave and similar platforms show strong fit with Celero’s scale-across optical pitch.'}
            - {label: Weak, tone: risk, detail: 'No direct Celero deployment has been named publicly.'}
            - {label: Weak, tone: risk, detail: 'No repeat-purchase or installed-base metrics are available.'}
            - {label: Moderate, tone: neutral, detail: 'End-market urgency is current, but Celero-specific proof is still indirect.'}
    claimRefs: [CU010, CU014, CU015, CU016, CU017, CU030, CU036, CU043]
  - id: FU004
    title: Illustrative design-win durability cohort (estimated)
    type: cohort
    layout: standard
    summary: "Estimated retention by relationship type after initial qualification, shown only as a directional proxy because Celero publishes no real cohort data."
    data:
      columns: ['Year 1 (est.)', 'Year 2 (est.)', 'Year 3 (est.)']
      rows:
        - label: Direct hyperscaler design win once qualified
          values: [85, 75, 65]
        - label: Module-maker/OEM design win once integrated
          values: [80, 68, 58]
        - label: Evaluation-stage pilot without production socket
          values: [35, 20, 10]
    approximationNotes: "These percentages are illustrative estimates derived from public signals about qualification burden, interoperability requirements, and the cost of requalifying AI-network components; they are not Celero disclosures and should be replaced by actual renewal and socket-lifetime data during diligence."
    claimRefs: [CU033, CU035, CU037, CU040]
callouts:
  - calloutType: strength
    title: Buyer fit is clearer than customer disclosure
    body: "The reviewed evidence strongly supports that Celero is aimed at the right buyer set—hyperscalers, AI-cloud operators, and module ecosystems facing scale-across AI networking pain—even though it still lacks public production references."
    claimRefs: [CU003, CU011, CU014, CU017, CU024]
  - calloutType: risk
    title: Investor validation is not deployment validation
    body: "CapitalG is a meaningful signal, but investors should not treat it as proof of production usage until Celero can show named design partners, qualification stage, or actual shipped-volume evidence."
    claimRefs: [CU005, CU010, CU030, CU044]
