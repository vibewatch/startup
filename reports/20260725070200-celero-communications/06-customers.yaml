  - id: TU003
    title: Named customer proof table
    columns: [Customer / counterparty, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ['CapitalG / Alphabet ecosystem', 'Investor with direct Google advisor and customer-network access', 'Lead investor in Celero’s $100M Series B and public thought-leadership partner on AI-scale networking bottlenecks', 'Strategic validation; not a disclosed production customer', 'Strongest named external proof that a hyperscaler-adjacent stakeholder sees Celero as commercially relevant', 'No public statement that Google operating units are buying or deploying Celero silicon']
      - ['Hyperscaler design partners (undisclosed)', 'Direct end-customer target cohort', 'Marketing role explicitly tasked with securing anchor design wins with hyperscalers', 'Likely evaluation / sampling / design-in stage', 'Supports that Celero has an active early-adopter funnel into the highest-value buyer class', 'No names, counts, sampling volume, or qualification milestones disclosed']
      - ['Optical module makers (undisclosed)', 'Channel / OEM target cohort', 'Job posting explicitly pairs module makers with hyperscalers in early design-win motion', 'Likely qualification / ecosystem engagement stage', 'Shows Celero is pursuing the channel layer that can unlock multiple end accounts', 'No named module partner, socket win, or production module disclosed']
      - ['AI cloud infrastructure operators (undisclosed)', 'Secondary direct-customer cohort', 'Product brief aligns with the scale-across, low-latency networking needs described by CoreWeave and other AI-cloud operators', 'Prospect fit only; no public Celero deployment disclosed', 'Expands the plausible customer base beyond classic hyperscalers', 'This is ICP evidence, not direct Celero customer proof']
    notes: "Coverage is partial because Celero has not published a customer list. The table separates one named strategic validator from cohort-level design-win signals that are public but still non-logo-specific."
    enumerationScope:
      coverage: partial
      basis: "Covers the named external counterparties and customer cohorts explicitly surfaced in Celero, CapitalG, and Greenhouse materials reviewed for this run; NDA-bound or undisclosed design partners are intentionally excluded."
    claimRefs: [CU003, CU004, CU005, CU006, CU009, CU010, CU029, CU030, CU031, CU043, CU044]
  - id: TU004
    title: Retention / durability table
    columns: [Metric, Value / gap, Confidence, Implication, Diligence path]
    rows:
      - [NRR, 'Not disclosed', High, 'No public evidence of expansion efficiency', 'Request NRR by customer type and cohort vintage']
      - [GRR / logo churn, 'Not disclosed', High, 'Cannot separate gross stickiness from future expansion hopes', 'Request GRR, logo churn, and churn reasons by top account']
      - [Contract length / supply term, 'Not disclosed', High, 'Hard to judge lock-in or forward revenue visibility', 'Request standard evaluation, qualification, and supply agreement durations']
      - [Design-win durability proxy, 'Potentially high once qualified; qualification and interoperability burden are meaningful', Low, 'A won socket could be sticky, but the conclusion is inferred rather than measured', 'Validate with management on requalification cost, socket lifetime, and share-of-platform']
      - [Customer satisfaction / reference quality, 'No G2-style or NPS disclosure; public proof is mostly investor and market-facing', High, 'Reference depth remains the biggest durability blind spot', 'Request named references, renewal narratives, and support/escalation metrics']
    notes: "Celero does not publish retention economics. Durability therefore rests on industry procurement behavior, interoperability burden, and inferred qualification costs rather than on observed cohorts or renewal data."
    claimRefs: [CU033, CU035, CU036, CU037]
  - id: TU005
