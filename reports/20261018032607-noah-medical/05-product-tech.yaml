company:
  name: Noah Medical
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Noah Medical's public product story still centers on one commercial platform,
    the Galaxy System, with Galaxy II framed as a 2026 software extension rather
    than a second hardware line. The strongest supported differentiators are
    integrated imaging, single-use bronchoscopes, and compact room footprint,
    but maturity evidence is mixed: named customer adoption and
    controlled-study results are real, while independent real-world data and an
    FDA quality warning keep execution and reliability risk central.
sections:
  - id: product-definition
    title: Product definition in the bronchoscopy workflow
    body: >-
      Noah Medical sells Galaxy as an all-in-one robotic-assisted bronchoscopy
      platform for physicians trying to reach, localize, and biopsy peripheral
      lung lesions in a standard bronchoscopy workflow rather than through a
      multi-vendor imaging stack. The official 2023 clearance materials position
      Galaxy for bronchoscopic visualization of and access to patient airways,
      while Noah's own product pages emphasize a disposable bronchoscope,
      compact single-cart footprint, and setup/turnover benefits for support
      staff. A customer-site description from Meadville Medical Center
      reinforces that the product is being presented to hospitals as an
      image-integrated workflow tool, not just a robotic arm or navigation
      accessory.
    claimRefs: [CE001, CE005, CE006]
    tableRefs: [TE002]
  - id: architecture
    title: Architecture and operating model
    body: >-
      The public architecture evidence is more specific than typical medtech
      marketing copy. Noah and a 2026 independent real-world study both
      describe a stack that starts with thin-cut pre-procedure CT upload and 3D
      planning, moves through EMN-guided navigation, and then uses TiLT+
      digital tomosynthesis through a standard C-arm to confirm tool position
      relative to the lesion. Noah's 2026 Galaxy II launch extends that same
      installed platform with dual-mode HD-DT and optional CBCT workflow
      selection plus lesion-focused imaging, which suggests Noah is iterating
      the imaging/control layer on top of one hardware base rather than
      launching a second product family. What remains unclear from the reviewed
      sources is interoperability: the pool does not expose APIs, PACS/EHR
      integration detail, or service-SLA documentation.
    claimRefs: [CE002, CE003, CE004, CE009, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity
    title: Clinical maturity and deployment evidence
    body: >-
      Noah now has enough public evidence to argue Galaxy is past prototype
      stage, but not enough to call the platform fully de-risked. The strongest
      2026 commercialization signal in this pool is the first commercial
      procedure in Asia at Prince of Wales Hospital, alongside Noah's claim that
      the U.S. installed base has surpassed 16,000 procedures. Clinical
      evidence is directionally encouraging but still uneven: the independent
      Journal of Thoracic Disease study covers 91 patients and 94 nodules in
      first-year academic use with a 68% strict diagnostic yield and meaningful
      complication rates, while the same paper notes that prior Galaxy data
      came from more controlled FRONTIER and MATCH 2 settings, including the
      96.7% MATCH 2 yield. That pattern supports real product maturity, but
      also shows that operator learning curve and site conditions still matter.
    claimRefs: [CE007, CE008, CE011, CE012]
    tableRefs: [TE001]
  - id: differentiation-and-risks
    title: Differentiation, quality controls, and technical risk
    body: >-
      The most supportable product differentiation is operational rather than
      algorithmic: Galaxy combines real-time imaging confirmation with a
      single-use bronchoscope, compact room footprint, and software-controlled
      modality switching, which can matter in crowded bronchoscopy suites and
      for hospitals trying to reduce reprocessing burden. The main technical
      counterweight is quality-system risk. MassDevice's 2026 reporting ties
      the Galaxy II launch to an unresolved 2025 FDA warning letter that cited
      manufacturing and CAPA failures, reportability lapses, and
      device-complaint handling concerns. For diligence, that means Noah's
      product edge may be genuine, but underwriting still depends on verifying
      whether manufacturing, field reliability, and post-market controls have
      caught up to the commercial push.
    claimRefs: [CE005, CE006, CE009, CE010, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Galaxy System cart and navigation console
        - Interventional pulmonologist and bronchoscopy team
        - Commercial platform
        - All-in-one navigated bronchoscopy workflow rather than a point solution
        - Installed base by site type is not disclosed
      - - Single-use bronchoscope and accessories
        - Physician plus reprocessing/support staff
        - Commercial and repeatedly featured in official positioning
        - Disposable design reduces reprocessing burden and cross-contamination exposure
        - Disposable economics and supply resilience are not public
      - - TiLT+ integrated imaging layer
        - Proceduralist
        - Commercial but still supported mainly by controlled or early-site evidence
        - Real-time tool/lesion confirmation through tomosynthesis plus augmented fluoroscopy
        - Compatible imaging-equipment list and workflow prerequisites are not public
      - - Galaxy II software
        - Existing Galaxy sites
        - Launched in August 2026
        - Adds dual-mode HD-DT and CBCT selection plus lesion-focused imaging
        - Upgrade pricing, eligibility, and installed-base penetration are not public
    notes: Public evidence supports one commercial platform with a 2026 software extension; module economics and install-base mix remain undisclosed.
    claimRefs: [CE002, CE005, CE009, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow constraint
      - Noah solution
      - Measurable benefit
      - Limitation
    rows:
      - - Reach peripheral lung lesions
        - Standard bronchoscopy struggles in the outer lung
        - EMN guidance plus articulated robotic bronchoscope
        - Designed to improve tool-in-lesion and diagnostic yield
        - Comparative lesion-by-lesion accuracy is not public in this pool
      - - Confirm tool position before biopsy
        - CT-to-body and tool-tissue divergence can move the target
        - TiLT+ with augmented fluoroscopy and later Galaxy II dual-mode imaging
        - MATCH 2 reported 96.7 percent diagnostic yield while real-world follow-up was lower
        - Evidence is split between controlled studies and one first-year academic cohort
      - - Reduce turnover and reprocessing burden
        - Reusable scope cleaning adds hidden labor and time
        - Single-use bronchoscope and accessories
        - Official user testimonials cite better turnover and lower support burden
        - Disposable cost and waste tradeoffs are not public
      - - Fit robotics into a crowded bronchoscopy suite
        - Multi-console equipment can complicate room flow
        - Smaller footprint and single-cart design
        - User quotes describe easier maneuverability and room access
        - Minimum room and installation requirements are not public
    notes: Benefits mix company claims, customer testimony, and published clinical data; unsupported cost or throughput figures are left qualitative.
    claimRefs: [CE001, CE003, CE005, CE006, CE007, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Thin-cut CT import and 3D plan
        - Creates the target path before the case starts
        - Pre-procedure CT with 0.8 to 1 mm slices plus planning software
        - Imaging quality and planning quality can constrain downstream accuracy
      - - EMN guidance and articulated robotic bronchoscope
        - Navigates within 2 cm of the lesion during the case
        - EMN-compatible bed, trained staff, and general-anesthesia workflow
        - Learning curve and device-performance issues can reduce real-world yield
      - - TiLT plus augmented fluoroscopy and Galaxy II imaging modes
        - Confirms lesion and tool location during biopsy
        - Standard C-arm fluoroscopy with optional CBCT availability for the expanded 2026 workflow
        - Imaging complexity and capital-equipment dependence can slow deployment
      - - Single-use scope and accessory supply plus single cart
        - Supports turnover, room fit, and contamination-control claims
        - Disposable supply chain and consistent manufacturing quality
        - CAPA or manufacturing failures can directly interrupt clinical readiness
    notes: The reviewed sources describe workflow layers clearly but do not expose software interfaces, uptime terms, or installed-site integration guides.
    claimRefs: [CE003, CE004, CE005, CE009, CE010, CE013]
