callouts:
  - calloutType: strength
    title: Differentiation is most tangible in workflow fit
    body: The evidence most consistently supports Galaxy's integrated-imaging workflow, single-use scope model, and compact room footprint rather than a standalone superiority claim on diagnostic yield.
    claimRefs: [CE005, CE006, CE009]
  - calloutType: risk
    title: Quality-system risk still shadows the platform
    body: Public evidence ties Noah's 2026 product push to a recent FDA warning letter, so diligence has to validate manufacturing controls, complaint handling, and field reliability before treating commercialization momentum as proof of technical maturity.
    claimRefs: [CE010, CE011, CE012]
