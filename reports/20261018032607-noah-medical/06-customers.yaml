schemaVersion: "report-v2"
artifact: customers
slug: noah-medical
runDate: 2026-10-18
company:
  name: Noah Medical
chapter:
  number: 6
  title: Customers
  summary: >-
    Noah Medical has progressed from U.S. launch to a company-reported base of more than
    16,000 U.S. procedures and a first commercial Asian procedure, with named proof at CHI
    Memorial and Prince of Wales Hospital. The evidence supports real clinical use, but it
    does not disclose customer count, utilization by installed system, retention, contract
    terms, payer mix, or customer concentration.
sections:
  - id: customer-segments-and-buying-surface
    title: Customer segments and buying surface
    body: >-
      The evidenced deployment unit is a hospital bronchoscopy program rather than an
      individual consumer. FDA materials define physicians as the operators, while commercial
      examples name interventional pulmonologists and thoracic surgeons at U.S. and Hong Kong
      hospitals. Noah's customer-facing workflow proposition combines integrated imaging, a
      compact cart, and a single-use bronchoscope; the company argues that disposability reduces
      reprocessing burden and supports room turnover. A practitioner-authored discussion of
      robotic bronchoscopy adds a separate community-hospital lens: integrated imaging can avoid
      extra imaging equipment and may permit endoscopy-suite deployment. These sources identify
      users and institutional settings, but not the procurement committee, reimbursement payer,
      purchase-versus-lease model, or budget owner. Accordingly, the segmentation is useful for
      go-to-market diligence but incomplete for revenue modeling.
    claimRefs: [CU002, CU008, CU009, CU010, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory
    body: >-
      The public milestones show a credible transition from clearance to use. FDA cleared
      Galaxy on March 1, 2023, and MassDevice reported that the first U.S. commercial use
      followed in May 2023. By January 2024, Noah announced its 500th U.S. use, performed at
      CHI Memorial. In September 2026, a paid company release reported more than 16,000 U.S.
      procedures and the first commercial procedure in Asia at Prince of Wales Hospital. The
      sequence indicates rising cumulative procedure volume and geographic expansion, but it
      is not a customer-growth series: no source supplies installed-system counts, active-site
      counts, procedures per system, or the same-period denominator. The latest volume should
      therefore remain a company claim rather than an independently verified utilization metric.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: named-deployment-proof
    title: Named deployment and outcome proof
    body: >-
      CHI Memorial is the strongest independently reported production reference in the pool:
      MassDevice identifies it as Tennessee's first adopting hospital and the site of the
      500th U.S. case. Prince of Wales Hospital is a fresher geographic reference, although
      its commercial milestone and procedure totals come from a syndicated company release.
      Clinical evidence is supportive but should not be conflated with a customer roster.
      Healio reported a 31-patient MATCH 2 study with high tool-in-lesion and diagnostic-yield
      results, while also reporting one pneumothorax requiring tube thoracostomy and admission.
      FDA clearance materials add simulated-use validation by representative trained users,
      not proof of paid deployment. This hierarchy separates production use, company-announced
      expansion, clinical evaluation, and pre-commercial validation.
    claimRefs: [CU004, CU005, CU006, CU012, CU013, CU014, CU015]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Procedure accumulation is the clearest public expansion signal, and the Hong Kong launch
      demonstrates that a clinical relationship can precede commercial integration. However,
      procedure totals alone do not establish durable customer economics. The retained evidence
      contains no NRR, GRR, churn, renewal rate, contract duration, reorder rate, installed-base
      utilization, customer count, or revenue concentration disclosure. It also does not show
      whether the more than 16,000 U.S. procedures are broadly distributed or concentrated in
      a small number of high-volume sites. Underwriting should therefore treat retention and
      concentration as material data-room gaps. The most decision-useful request is a site-level
      cohort showing installation date, monthly procedures, disposable reorder cadence, contract
      status, and revenue, together with top-five and top-ten customer shares.
    claimRefs: [CU006, CU007, CU011, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Evidence of scale
      - Revenue or strategic value
      - Diligence gap
    rows:
      - - U.S. hospital bronchoscopy programs
        - Hospital buyer inferred; pulmonologists and thoracic surgeons use; payer unverified
        - Navigated biopsy and airway access
        - 500 cumulative U.S. uses by January 2024; company later claimed more than 16,000
        - Procedure volume can drive capital utilization and disposable demand
        - Active sites, systems, procedures per system, pricing, and payer mix are undisclosed
      - - Asia academic and tertiary hospitals
        - Prince of Wales Hospital; thoracic surgeon user; payer and buyer not disclosed
        - Routine minimally invasive lung diagnostics
        - First commercial Asian procedure reported on September 29, 2026
        - Provides a reference beachhead for Asia-Pacific expansion
        - One named institution and a company-issued announcement do not establish regional scale
      - - Community hospitals
        - Service-line leadership and interventional pulmonologists; payer not identified
        - Local access to robotic bronchoscopy outside flagship academic centers
        - Practitioner rationale only; no Noah-specific community-hospital count
        - Compact workflow may broaden the addressable provider base
        - Noah-specific procurement economics and deployment list are unavailable
      - - Clinical study and evaluation sites
        - Physician investigators and hospital study teams; purchasing status unverified
        - Validation of navigation, biopsy, diagnostic yield, and safety
        - MATCH 2 covered 31 patients; FDA materials describe simulated-use testing
        - Clinical proof can support adoption and committee review
        - Study participation must not be treated as a paid customer relationship
    notes: >-
      Segments are derived from the retained sources through 2026-10-18; null or unverified
      buyer, payer, scale, and economics fields indicate absent public evidence, not zero.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU015]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Date
      - Source basis
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - U.S. regulatory clearance
        - Class II 510(k) clearance, K223144
        - "2023-03-01"
        - FDA decision letter
        - High
        - Enabled lawful U.S. commercialization for the cleared intended use
        - Does not measure customer adoption
      - - First U.S. commercial use
        - First use reported in May 2023
        - "2023-05"
        - MassDevice retrospective reporting
        - Medium
        - Marks transition from clearance to commercial use
        - Site, installed-base count, and contract economics were not supplied
      - - Cumulative U.S. use
        - 500th use at CHI Memorial
        - "2024-01-24"
        - MassDevice reporting of Noah's announcement
        - Medium
        - Confirms post-launch case activity at a named hospital
        - Systems, active sites, and period utilization were not supplied
      - - MATCH 2 clinical evidence
        - 31 patients; 30 of 31 tool-in-lesion; 30 of 31 tissue diagnoses
        - "2026-04-13"
        - Healio report on a prospective bicentric observational trial
        - Medium
        - Supports clinical adoption discussions with measured outcomes
        - Small, single-arm study; no customer or commercial denominator
      - - U.S. procedure base and Asia expansion
        - More than 16,000 U.S. procedures; first commercial Asian procedure
        - "2026-09-29"
        - Paid company press release syndicated by Yahoo Finance
        - Medium
        - Indicates substantial cumulative use and geographic expansion
        - No independent verification, installed base, active sites, or period rate
    notes: >-
      Values preserve each source's metric and period; cumulative procedures are not customer
      count, recurring revenue, or utilization per installed system.
    claimRefs: [CU001, CU003, CU004, CU006, CU007, CU012, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or institution
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - CHI Memorial, Chattanooga
        - U.S. hospital bronchoscopy program
        - Galaxy robotic-assisted bronchoscopy
        - Production use
        - Site of the 500th U.S. use and described as Tennessee's first adopter
        - No site-level volume, economics, renewal, or utilization trend
      - - Prince of Wales Hospital, Hong Kong
        - Asia academic and tertiary hospital
        - Commercial Galaxy procedure after earlier clinical use
        - Production use reported by company
        - First commercial procedure in Asia on September 29, 2026
        - Paid company release; no contract value or repeat-use history
      - - Amit Mahajan / Inova Health System affiliation
        - Clinical investigator affiliation
        - MATCH 2 evaluation of peripheral pulmonary nodules
        - Clinical study; customer status not established
        - 96.7% tool-in-lesion and 96.7% diagnostic yield in the reported study
        - The article does not establish that Inova purchased or routinely deployed Galaxy
    notes: >-
      Sample of named institutional proof in the assigned evidence pool, not a complete customer
      roster; clinical-study affiliation is explicitly separated from a paid deployment.
    enumerationScope:
      coverage: sample
      basis: >-
        Named institutional references visible in the assigned source pool through 2026-10-18.
    claimRefs: [CU004, CU005, CU006, CU012, CU013, CU014, CU015]
figures:
  - id: FU001
    title: Customer adoption journey and evidence surfaces
    type: journey-map
    summary: >-
      Evidence-backed stages from regulatory enablement to repeat procedure volume and geographic
      expansion; the sequence is not a measured conversion funnel.
    data:
      nodes:
        - id: regulatory-enablement
          label: Regulatory enablement
          detail: FDA clearance established the intended airway-access use before commercialization.
          touchpoints:
            - FDA 510(k) decision
            - Hospital compliance review
        - id: clinical-evaluation
          label: Clinical evaluation
          detail: Representative-user simulated testing and later clinical studies support evaluation.
          touchpoints:
            - Physician training
            - Navigation and biopsy evidence
        - id: hospital-adoption
          label: Hospital adoption
          detail: Named production evidence begins with U.S. hospital deployment.
          touchpoints:
            - Bronchoscopy program
            - Interventional pulmonology team
        - id: workflow-integration
          label: Workflow integration
          detail: Compact equipment and single-use scopes target room and reprocessing constraints.
          touchpoints:
            - Setup and teardown
            - Disposable reorder
        - id: repeat-procedure-volume
          label: Repeat procedure volume
          detail: Cumulative procedures indicate use, but site-level utilization remains undisclosed.
          touchpoints:
            - 500th U.S. use
            - More than 16,000 U.S. procedures claimed
        - id: geographic-expansion
          label: Geographic expansion
          detail: Hong Kong moved from earlier clinical use to a reported commercial procedure.
          touchpoints:
            - Clinical relationship
            - Commercial integration
    approximationNotes: >-
      Stages are qualitative evidence surfaces; no conversion rates, durations, customer counts,
      or value-proportional widths are inferred.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU008, CU009]
callouts:
  - calloutType: strength
    title: Real use is evidenced, not just logos
    body: >-
      CHI Memorial is linked to a production milestone, and Prince of Wales Hospital is linked
      to a commercial procedure after earlier clinical use.
    claimRefs: [CU004, CU005, CU006]
  - calloutType: risk
    title: Procedure volume does not establish retention
    body: >-
      Public procedure totals lack customer, system, time-period, renewal, and revenue
      denominators, leaving durability and concentration unverified.
    claimRefs: [CU007, CU016]
