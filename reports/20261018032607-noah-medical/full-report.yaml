      - number: '2.3'
        title: Evidence-constrained sizing, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence in this pool is stronger on why adoption can happen than on how large the revenue pool is.
              The best sizing proxies are workflow and performance lenses: CDC's screening funnel, Noah's claim that
              peripheral lesions are hard to reach, a 31-patient imaging study with 96.7% diagnostic yield, a 70-case
              community-hospital series with reported financial sustainability, and repeated 90%-yield routine-use
              references. Together they support demand drivers such as earlier diagnosis, physician control of imaging,
              lower radiation in routine cases, and endoscopy-suite deployment. They also preserve real constraints:
              unresolved regulatory overhang, still-missing public TAM/SAM/SOM math, and no audited ROI or reimbursement
              durability by customer segment. That means the market can be described as promising and expanding, but not
              yet underwritten precisely from public evidence alone.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Community-hospital fit is the clearest adoption wedge
            body: >-
              The strongest market-expansion signal in the retained pool is not a headline TAM number but repeated
              evidence that integrated imaging, smaller footprints, and single-use workflows lower the operational
              threshold for community hospitals to offer robotic bronchoscopy locally.
            calloutType: insight
