  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The public record points to one critical risk cluster around FDA remediation, with economics and scaling
      dependencies next in line.
    data:
      columns:
        - label: Likelihood
          note: Probability of impairing scale in the next 12-18 months.
        - label: Impact
          note: Potential damage to underwriting confidence if it materializes.
        - label: Mitigation maturity
          note: How much public evidence shows Noah has already reduced the risk.
        - label: Residual exposure
          note: Post-mitigation underwriting exposure, not observed loss.
      rows:
        - label: FDA quality-system overhang
          note: Warning-letter and MDR closure proof is still missing from the retained pool.
          values:
            - label: High
              tone: high
            - label: Critical
              tone: critical
            - label: Medium
              tone: medium
              detail: Continued commercialization is visible, but closure evidence is not.
            - label: High
              tone: high
        - label: Reimbursement and site-level economics
          note: Billing guides suggest the economics depend on coding discipline and case mix.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Medium
              tone: medium
              detail: Workflow efficiency helps, but site contribution-margin proof is still absent.
            - label: High
              tone: high
        - label: Disposable-scope supply and margin execution
          note: Single-use workflow is a clinical/workflow advantage and a recurring-cost dependency.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: Medium-high
              tone: high
        - label: KOL/reference-site concentration and international rollout
          note: Procedure growth is visible, but much of the narrative still depends on highlighted sites.
          values:
            - label: Medium
              tone: medium
            - label: Medium-high
              tone: high
            - label: Medium
              tone: medium
            - label: Medium
              tone: medium
        - label: Financial opacity and runway uncertainty
          note: Public milestones and funding history exist, but revenue and runway are undisclosed in the retained pool.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Low
              tone: low
              detail: There is no public mitigation proof on cash generation in the assigned evidence.
            - label: High
              tone: high
        - label: IP and legal diligence incompleteness
          note: Patent depth is visible, but FTO, litigation, and privacy diligence are not.
          values:
            - label: Medium
              tone: medium
            - label: Medium
              tone: medium
            - label: Low-medium
              tone: medium
            - label: Medium
              tone: medium
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation stays at research-more because commercialization proof and investor quality are outweighed by
      unresolved pricing inputs and regulatory overhang.
    data:
      nodes:
        - id: clinical-proof
          label: Clinical proof
          detail: 2024 coverage reported 100% navigation and 100% tool-in-lesion in FRONTIER.
          tone: positive
        - id: commercial-momentum
          label: Commercial momentum
          detail: Company-issued September 2026 update cited first Asia commercial case and 16,000+ U.S. procedures.
          tone: positive
        - id: capital-support
          label: Capital support
          detail: Independent and official sources corroborate a 2023 oversubscribed $150M Series B.
          tone: positive
        - id: missing-pricing-inputs
          label: Missing pricing inputs
          detail: No current public valuation mark, revenue, margin, burn, runway, or preference stack in the assigned pool.
          tone: warning
        - id: regulatory-overhang
          label: Regulatory overhang
          detail: 2026 reporting said the 2025 FDA warning letter still awaited follow-up.
          tone: risk
        - id: recommendation
          label: Research-more / valuation unknown
          detail: Re-open only after primary financing, KPI, and remediation evidence is shared.
          tone: warning
      edges:
        - from: clinical-proof
          to: commercial-momentum
          label: supports adoption case
        - from: commercial-momentum
          to: recommendation
          label: helps thesis but not price
        - from: capital-support
          to: recommendation
          label: validates investor interest
        - from: missing-pricing-inputs
          to: recommendation
          label: blocks underwriting
        - from: regulatory-overhang
          to: recommendation
          label: raises downside risk
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV010
      - CV011
