      - number: '3.2'
        title: Noah competes on integrated imaging, disposable workflow, and room footprint rather than raw scale
        blocks:
          - type: paragraph
            body: >-
              Noah's strongest documented differentiation is workflow design. Noah's own product materials say Galaxy is
              the only robotic bronchoscopy platform with a single-use disposable bronchoscope, and Fierce's clearance
              coverage repeated that this was a first-of-kind attribute in robotic bronchoscopy. The same Noah materials
              position Galaxy as an integrated imaging stack rather than a navigation-only platform: the original 2023
              release described integrated tomosynthesis plus augmented fluoroscopy, the 2026 MATCH II coverage reported
              96.7% diagnostic yield with 96.7% DT-to-CBCT concordance, and the 2026 Galaxy II launch described HD-DT as
              the low-radiation default with CBCT available when the case requires escalation. That combination makes
              Noah's best competitive narrative less about claiming the broadest ecosystem and more about reducing
              handoffs between navigation, confirmation, cleaning, and room logistics.


              Those features also define the substitute set. Reusable bronchoscopy workflows remain viable because they
              avoid new robotic capital purchases, but the retained evidence also ties them to reprocessing burden and
              infection-control tradeoffs that the FDA has publicly flagged. External-CBCT workflows can still act as a
              high-confidence confirmation benchmark, yet Noah is explicitly trying to absorb that benchmark into one
              platform so the hospital does not have to assemble a larger hybrid setup for every case. The practical
              implication is that Noah can win where procedure efficiency, room footprint, and reprocessing burden
              matter enough to outweigh the safety of staying with established workflows.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
