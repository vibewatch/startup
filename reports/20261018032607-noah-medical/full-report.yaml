  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peer pressure is concentrated in Ion; most other alternatives are workflow substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not show a broad set of scaled robotic bronchoscopy rivals; instead, it shows a
              two-track landscape. Noah has moved from FDA clearance in 2023 to 5,000 U.S. procedures by March 2025 and
              a company-claimed base of more than 16,000 U.S. procedures by September 2026, which is enough to prove
              real commercial traction but not enough to match the incumbent's public scale. Intuitive's own Q1 2026
              disclosures put Ion at 43,000 quarterly procedures, 52 quarterly placements, and an installed base that
              MarketChameleon summarized at 1,041 systems, so the direct peer with the clearest commercial weight is Ion
              rather than a fragmented field of similar startups.


              That matters because the other alternatives visible in this pool look more like ways to solve the same
              clinical job without buying Noah, not like another documented scaled robotic vendor. Noah's own 2023 and
              2026 materials repeatedly frame the benchmark as current bronchoscopy technologies, embedded versus
              external imaging, and workflow burden inside crowded bronch suites. In other words, the buyer is not only
              comparing Noah against one robot. It is also comparing Noah against staying with reusable-scope workflows,
              keeping cone-beam CT as a confirmation layer, or internally assembling a hybrid room workflow that
              preserves the current operating model.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
