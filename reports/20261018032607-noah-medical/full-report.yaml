  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Noah Medical's addressable market is not "lung cancer" in the broad sense, and it is not the upstream LDCT
              screening market by itself. The product sits in the downstream diagnostic workflow for suspicious lung
              lesions, especially peripheral lesions that are hard to biopsy accurately with conventional bronchoscopy
              or with fragmented navigation-plus-imaging setups. The relevant spend therefore includes robotic
              bronchoscopy capital and software, disposable bronchoscopes and accessories, and the workflow value of
              integrated imaging; it excludes screening scans themselves, unrelated oncology treatment, and broader
              thoracic surgery budgets. The top of funnel is still constrained by screening penetration: CDC says only
              about 18% of recommended U.S. adults have been screened, so market growth depends on both more screened
              patients and better diagnostic conversion after a lesion is found.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM011
              - CM013
              - CM015
      - number: '2.2'
        title: Buyer, user, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The user is the interventional pulmonology or bronchoscopy team, but the economic buyer is the hospital
              lung nodule program or service-line owner that has to justify space, capital, staff time, and throughput.
              The assigned pool consistently frames adoption as a community-hospital expansion story rather than a pure
              academic-center story: smaller footprint, single-use scopes, and integrated imaging are positioned as ways
              to reduce reprocessing burden, crowded-room friction, and separate CBCT investment. That matters because
              community sites run tighter room-utilization and staffing economics than flagship centers. Coverage also
              matters in the adoption path: CDC says most insurance plans and Medicare help pay for recommended
              screening, but abnormal follow-up testing can still create patient cost-sharing and hospital workflow
              friction that slows conversion from clinical interest to scaled program volume.
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
