              - CU006
          - type: callout
            title: Procedure volume does not establish retention
            body: >-
              Public procedure totals lack customer, system, time-period, renewal, and revenue denominators, leaving
              durability and concentration unverified.
            calloutType: risk
            claimRefs:
              - CU007
