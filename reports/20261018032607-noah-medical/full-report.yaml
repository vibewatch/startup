  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is plausible but not disclosed
        blocks:
          - type: paragraph
            body: >-
              Galaxy combines a robotic bronchoscopy platform, a single-use bronchoscope and accessories, and
              commercially launched Galaxy II software. That product structure creates three plausible monetization
              layers: system access, per-procedure consumables, and software or service value. The retained evidence,
              however, does not establish that Noah charges separately for each layer, whether systems are sold or
              leased, how software is entitled, or whether service and training carry recurring fees. Galaxy II is
              marketed as adding capability without added capital, which may strengthen the installed system's value but
              does not prove incremental software revenue. The revenue bridge is therefore a diligence framework rather
              than a forecast, and no public product activity should be converted into revenue without contract terms
              and realized pricing.
            claimRefs:
              - CI001
