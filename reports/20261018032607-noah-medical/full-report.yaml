      - number: '3.3'
        title: Durability depends on whether Noah's workflow wedge can outrun incumbent scale and trust risk
        blocks:
          - type: paragraph
            body: >-
              The moat is real but not obviously durable yet. Intuitive's public 2026 evidence shows a disclosed
              1,041-system Ion installed base, 43,000 quarterly Ion procedures, continued system placements, and an $8.0
              billion cash-and-investments position, which gives the incumbent room to keep funding training, service,
              digital features, and additional lung-workflow integration such as ROSE and endobronchial ultrasound. Noah
              does not disclose a comparable installed-base count in the retained evidence. The available evidence
              therefore supports a resource and disclosed-scale advantage for Intuitive, not a precise installed-base
              ratio. That does not disprove Noah's product wedge; it does mean Noah is competing against a
              better-capitalized incumbent that can respond through bundle depth and customer-support breadth rather
              than through a point-for-point copy of Noah's single-use positioning.


              Noah also has a trust and execution handicap visible in the retained 2026 evidence. MassDevice linked the
              Galaxy II launch to an April 2025 FDA warning letter and said the agency was still working to schedule a
              follow-up visit. At the same time, public pricing remains opaque for both Noah and Ion in this source set,
              which means the market is easier to understand on technical workflow and scale than on realized economic
              switching thresholds. For diligence, that leaves the competitive verdict as "credible wedge, but not yet
              durable proof": Noah appears differentiated enough to win on workflow design, yet the strongest public
              evidence still suggests that the competitive center of gravity sits with Intuitive's scale and Noah's
              ability to defend trust while converting that workflow edge into sticky adoption.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Noah's best wedge is workflow simplification, not scale parity
            body: >-
              Noah's retained public edge is the combination of single-use scopes, built-in imaging, and smaller room
              burden; Noah does not disclose an installed-base count comparable with Ion's public 1,041-system figure or
