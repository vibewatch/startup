  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked underwriting frame
        blocks:
          - type: paragraph
            body: >-
              The public risk stack is led by one issue that can still break the thesis: quality-system remediation
              after the FDA warning letter. That issue matters more than ordinary medtech execution noise because it
              combines manufacturing process control, complaint handling, and MDR timing, and it remained open enough in
              August 2026 for MassDevice to report that a follow-up visit was still being scheduled. The next tier of
              risk is economic rather than technical: Noah markets meaningful workflow advantages and has reported
              growing procedure counts, but independent reimbursement guides still show advanced bronchoscopy economics
              depend on multi-code documentation and payer-specific billing logic rather than a simple, uniform
              procedure payment. The third tier is dependency risk. Much of the strongest adoption proof still comes
              from company-controlled milestones and a relatively small set of named hospitals and physician champions,
              so scale outside flagship sites needs to be demonstrated rather than assumed.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, quality, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Noah has a credible regulatory base in that Galaxy received FDA clearance in March 2023 for bronchoscopic
              visualization of and access to patient airways, but that clearance is only the starting point for risk
              analysis, not the end state. The same product family later became the subject of a warning-letter episode
              that independent coverage described in unusually specific terms: FDA reportedly found Galaxy bronchoscopes
              and accessories "adulterated" from a current-good-manufacturing-practice perspective, and the article also
              described CAPA and MDR timing deficiencies. That makes regulatory exposure operational as much as legal:
              new software and imaging layers can improve clinical utility, yet every additional workflow claim or
              release cadence increases the importance of disciplined design control, complaint handling, and
              post-market reporting. The assigned pool also shows some patent depth, but it does not surface
              freedom-to-operate opinions, litigation dockets, or privacy/security contracting evidence, so legal
              diligence remains incomplete even if there is no public problem statement in the retained evidence.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
              - CR015
      - number: '7.3'
        title: Operating model, reimbursement, and financial fragility
        blocks:
          - type: paragraph
            body: >-
              Noah's operating model carries a classic medtech tradeoff. The single-use bronchoscope architecture and
              compact workflow are meaningful mitigants for contamination, reprocessing burden, and room turnover, but
              those same choices can shift risk toward disposable supply availability, gross-margin discipline, and
              hospital contribution-margin math. The public reimbursement guides retained for this refresh make that
              point indirectly: billing for bronchoscopy is heavily bundled, navigation is an add-on, and the highest
              value advanced-bronchoscopy economics come from a well-documented code mix, not just the base scope. That
              means Noah still has to prove that workflow efficiency plus diagnostic performance reliably offsets
              capital, disposable, and revenue-cycle friction. The public record is weakest on the financial backstop
              underneath that story because the assigned pool surfaces product milestones and funding history but does
              not disclose revenue, margin, burn, cash, or runway.
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Dependency map, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The dependency pattern is visible even in this constrained source set. Noah's evidence of traction is real
              but concentrated: company-controlled milestones cite 5,000 U.S. procedures by March 2025 and more than
              16,000 U.S. procedures by September 2026, while named champions and sites such as Long Island Jewish
              Medical Center, City of Hope Cancer Center Atlanta, and Prince of Wales Hospital anchor much of the
              narrative. MTEC's profile also suggests a training- and study-support layer that likely helps adoption but
              can slow scale if deployments remain services-heavy. The practical kill criteria are therefore
              monitorable. A repeat or escalated FDA quality finding, a failure to show positive site-level
              reimbursement contribution margin, or evidence that expansion remains stuck in a small number of reference
              centers would each materially weaken the investment case. Before underwriting new money, diligence should
              request direct quality-remediation evidence, economics by procedure setting, and a current board-level
              view of cash runway and supply resilience.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before underwriting a new round
            body: >-
              Do not underwrite a cleaner risk posture until Noah can produce direct FDA remediation evidence,
              site-level reimbursement contribution margin, and a current board view of cash runway and supply
              resilience; absent those, apparent procedure momentum can still mask a fragile operating model.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR011
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The assigned valuation evidence supports a cautious posture rather than an invest-at-any-price conclusion.
              Noah still shows meaningful commercial momentum: independent reporting ties the business to a 2023
              oversubscribed $150 million Series B, and a 2026 company-issued release says the platform has now
              supported more than 16,000 procedures in the United States while also reaching its first commercial case
              in Asia. But those positives do not solve the core underwriting problem: the current public evidence set
              still lacks a current priced round, revenue disclosure, gross margin detail, burn, runway, and
              preference-stack terms. Without those inputs, the disciplined call is research-more, with medium
              confidence and a high risk rating, and any engagement should be conditioned on primary financing and
              operating-data review rather than on narrative momentum alone.
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-underwrite case rests on two observable facts. First, Noah appears to have built a differentiated
              robotic bronchoscopy product: multiple sources describe embedded imaging, TiLT+ workflow, and a single-use
              disposable bronchoscope, while June 2024 clinical coverage reported 100% successful navigation and 100%
              tool-in-lesion accuracy in the 18-patient FRONTIER study. Second, commercialization is no longer
              theoretical, because the company says the platform has crossed 16,000 U.S. procedures and begun commercial
              use in Asia. The anti-thesis is equally material. A 2026 MassDevice report says the FDA warning letter
              from April 2025 was still awaiting follow-up, and the same report cites CAPA and MDR-process deficiencies;
              older independent coverage also continued to reference Auris trade-secret litigation. That combination
              caps conviction until revenue quality and regulatory cleanup are verified directly.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: Scenarios and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The cleanest external anchor in the assigned pool is not a Noah valuation multiple but a public strategic
              benchmark: Intuitive reported about $10.06 billion of 2025 revenue and 195 Ion endoluminal system
              placements, illustrating how much larger the category leader already is than Noah’s disclosed operating
              proof. That makes Noah’s 2023 private round only a stale financing reference, not a current value floor.
              The scenario framework therefore has to stay qualitative. A bull case requires Noah to translate reported
              procedure volume, Galaxy II product updates, and geographic expansion into verified revenue scale without
              new regulatory drag. A base case supports only disciplined follow-up diligence. A bear case includes flat
              or down-round risk, or investor-protective terms, if remediation or utilization disappoints.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not yet support a hold-period target, return hurdle, or exit multiple, because the
              missing variables are exactly the ones that drive medtech pricing: installed-base utilization, disposable
              pull-through, gross margin by capital versus consumables, cash burn, runway, and the
              liquidation-preference stack. The next diligence step is therefore not model refinement but source quality
              escalation. Management should provide current financing documents, cohort-level commercial KPIs, and
              direct evidence of FDA follow-up status. The thesis should be considered broken if a new financing is
              required before those metrics are shared, if warning-letter remediation extends without clear closure, or
              if commercialization momentum fails to convert into verifiable recurring economics.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price sensitivity dominates the final call
            body: >-
              Noah may prove to be a strong company, but this chapter is a valuation decision, not a product-quality
              award. Until primary documents establish current economics and financing terms, the right posture is to
              track and diligence rather than underwrite a price.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV015
