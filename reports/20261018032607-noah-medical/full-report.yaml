              - CU009
      - number: '6.2'
        title: Adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The public milestones show a credible transition from clearance to use. FDA cleared Galaxy on March 1,
              2023, and MassDevice reported that the first U.S. commercial use followed in May 2023. By January 2024,
              Noah announced its 500th U.S. use, performed at CHI Memorial. In September 2026, a paid company release
              reported more than 16,000 U.S. procedures and the first commercial procedure in Asia at Prince of Wales
              Hospital. The sequence indicates rising cumulative procedure volume and geographic expansion, but it is
              not a customer-growth series: no source supplies installed-system counts, active-site counts, procedures
              per system, or the same-period denominator. The latest volume should therefore remain a company claim
              rather than an independently verified utilization metric.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
