      - number: '5.3'
        title: Clinical maturity and deployment evidence
        blocks:
          - type: paragraph
            body: >-
              Noah now has enough public evidence to argue Galaxy is past prototype stage, but not enough to call the
              platform fully de-risked. The strongest 2026 commercialization signal in this pool is the first commercial
              procedure in Asia at Prince of Wales Hospital, alongside Noah's claim that the U.S. installed base has
              surpassed 16,000 procedures. Clinical evidence is directionally encouraging but still uneven: the
              independent Journal of Thoracic Disease study covers 91 patients and 94 nodules in first-year academic use
              with a 68% strict diagnostic yield and meaningful complication rates, while the same paper notes that
              prior Galaxy data came from more controlled FRONTIER and MATCH 2 settings, including the 96.7% MATCH 2
              yield. That pattern supports real product maturity, but also shows that operator learning curve and site
              conditions still matter.
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE005
              - CE009
              - CE011
      - number: '5.4'
        title: Differentiation, quality controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The most supportable product differentiation is operational rather than algorithmic: Galaxy combines
              real-time imaging confirmation with a single-use bronchoscope, compact room footprint, and
              software-controlled modality switching, which can matter in crowded bronchoscopy suites and for hospitals
              trying to reduce reprocessing burden. The main technical counterweight is quality-system risk.
              MassDevice's 2026 reporting ties the Galaxy II launch to an unresolved 2025 FDA warning letter that cited
              manufacturing and CAPA failures, reportability lapses, and device-complaint handling concerns. For
              diligence, that means Noah's product edge may be genuine, but underwriting still depends on verifying
              whether manufacturing, field reliability, and post-market controls have caught up to the commercial push.
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is most tangible in workflow fit
            body: >-
              The evidence most consistently supports Galaxy's integrated-imaging workflow, single-use scope model, and
              compact room footprint rather than a standalone superiority claim on diagnostic yield.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE009
          - type: callout
            title: Quality-system risk still shadows the platform
            body: >-
              Public evidence ties Noah's 2026 product push to a recent FDA warning letter, so diligence has to validate
              manufacturing controls, complaint handling, and field reliability before treating commercialization
              momentum as proof of technical maturity.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surface
        blocks:
          - type: paragraph
            body: >-
              The evidenced deployment unit is a hospital bronchoscopy program rather than an individual consumer. FDA
              materials define physicians as the operators, while commercial examples name interventional pulmonologists
              and thoracic surgeons at U.S. and Hong Kong hospitals. Noah's customer-facing workflow proposition
              combines integrated imaging, a compact cart, and a single-use bronchoscope; the company argues that
              disposability reduces reprocessing burden and supports room turnover. A practitioner-authored discussion
              of robotic bronchoscopy adds a separate community-hospital lens: integrated imaging can avoid extra
              imaging equipment and may permit endoscopy-suite deployment. These sources identify users and
              institutional settings, but not the procurement committee, reimbursement payer, purchase-versus-lease
              model, or budget owner. Accordingly, the segmentation is useful for go-to-market diligence but incomplete
              for revenue modeling.
            claimRefs:
              - CU002
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
