        title: Procedure traction is not a revenue disclosure
        blocks:
          - type: paragraph
            body: >-
              Noah reported 5,000 U.S. Galaxy procedures by March 24, 2025, evidence that the system had moved beyond
              initial launch and generated procedure activity. It does not disclose the number of installed systems,
              active accounts, procedures per active system, units consumed per case, recognized revenue, or collection
