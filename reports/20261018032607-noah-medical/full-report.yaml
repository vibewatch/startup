  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in the bronchoscopy workflow
        blocks:
          - type: paragraph
            body: >-
              Noah Medical sells Galaxy as an all-in-one robotic-assisted bronchoscopy platform for physicians trying to
              reach, localize, and biopsy peripheral lung lesions in a standard bronchoscopy workflow rather than
              through a multi-vendor imaging stack. The official 2023 clearance materials position Galaxy for
              bronchoscopic visualization of and access to patient airways, while Noah's own product pages emphasize a
              disposable bronchoscope, compact single-cart footprint, and setup/turnover benefits for support staff. A
              customer-site description from Meadville Medical Center reinforces that the product is being presented to
              hospitals as an image-integrated workflow tool, not just a robotic arm or navigation accessory.
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The public architecture evidence is more specific than typical medtech marketing copy. Noah and a 2026
              independent real-world study both describe a stack that starts with thin-cut pre-procedure CT upload and
              3D planning, moves through EMN-guided navigation, and then uses TiLT+ digital tomosynthesis through a
              standard C-arm to confirm tool position relative to the lesion. Noah's 2026 Galaxy II launch extends that
              same installed platform with dual-mode HD-DT and optional CBCT workflow selection plus lesion-focused
              imaging, which suggests Noah is iterating the imaging/control layer on top of one hardware base rather
              than launching a second product family. What remains unclear from the reviewed sources is
              interoperability: the pool does not expose APIs, PACS/EHR integration detail, or service-SLA
              documentation.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE009
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
