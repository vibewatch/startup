  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and commercial position
        blocks:
          - type: paragraph
            body: >-
              Noah Medical describes itself as a medical robotics company focused on earlier diagnosis and treatment,
              with Galaxy as its robotic-assisted bronchoscopy platform. Independent trade reporting corroborates the
              product category and reports FDA clearance in March 2023. The commercial architecture combines a reusable
              capital platform with single-use bronchoscopes and accessories, suggesting equipment revenue plus
              recurring consumables, although neither pricing nor revenue mix is public. Galaxy II launched in August
              2026 with software supporting HD-DT and CBCT imaging. A company-issued September 2026 release said the
              platform had exceeded 16,000 U.S. procedures and entered commercial use in Hong Kong; those scale figures
              remain company claims rather than audited customer or revenue metrics. Public descriptions also use both
              San Carlos and San Jose for the company, so the current headquarters and legal domicile require
              confirmation.
