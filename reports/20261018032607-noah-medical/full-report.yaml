      - number: '6.3'
        title: Named deployment and outcome proof
        blocks:
          - type: paragraph
            body: >-
              CHI Memorial is the strongest independently reported production reference in the pool: MassDevice
              identifies it as Tennessee's first adopting hospital and the site of the 500th U.S. case. Prince of Wales
              Hospital is a fresher geographic reference, although its commercial milestone and procedure totals come
              from a syndicated company release. Clinical evidence is supportive but should not be conflated with a
              customer roster. Healio reported a 31-patient MATCH 2 study with high tool-in-lesion and diagnostic-yield
              results, while also reporting one pneumothorax requiring tube thoracostomy and admission. FDA clearance
              materials add simulated-use validation by representative trained users, not proof of paid deployment. This
              hierarchy separates production use, company-announced expansion, clinical evaluation, and pre-commercial
              validation.
            claimRefs:
