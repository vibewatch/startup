        title: Consumables may recur, while cost and quality exposure remain unknown
        blocks:
          - type: paragraph
            body: >-
              Noah's single-use bronchoscope and accessories create a logical per-procedure consumption mechanism, and
              the company says disposability removes reprocessing burden and supports faster turnaround. Those claims do
