              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Procedure accumulation is the clearest public expansion signal, and the Hong Kong launch demonstrates that
              a clinical relationship can precede commercial integration. However, procedure totals alone do not
              establish durable customer economics. The retained evidence contains no NRR, GRR, churn, renewal rate,
              contract duration, reorder rate, installed-base utilization, customer count, or revenue concentration
              disclosure. It also does not show whether the more than 16,000 U.S. procedures are broadly distributed or
              concentrated in a small number of high-volume sites. Underwriting should therefore treat retention and
              concentration as material data-room gaps. The most decision-useful request is a site-level cohort showing
              installation date, monthly procedures, disposable reorder cadence, contract status, and revenue, together
              with top-five and top-ten customer shares.
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU016
