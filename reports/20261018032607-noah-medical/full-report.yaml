      - number: '4.4'
        title: Capital adequacy cannot be underwritten from funding headlines
        blocks:
          - type: paragraph
            body: >-
              The retained current sources disclose no Noah revenue, ARR, gross margin, cash balance, burn rate, runway,
              debt, lease obligations, working-capital requirement, or capital-expenditure plan. Financing raised
              historically would not equal cash available today, so it is not a substitute for a current balance sheet
              and monthly cash bridge. The product model also creates potentially material cash demands before revenue
              quality is known: system manufacturing and deployment, disposable inventory, field service, software
              development, regulatory remediation, and customer support. The financial verdict is therefore evidence of
              commercial activity but insufficient evidence of durable revenue quality, margin expansion, or financing
              independence. Investment underwriting should wait for audited statements, monthly operating metrics, debt
              documents, and downside runway scenarios tied to deployment and utilization.
