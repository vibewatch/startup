  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a layered adoption thesis from the screening funnel to community-hospital deployment, but
      not a precise TAM/SAM/SOM.
    data:
      items:
        - label: Annual U.S. screening funnel
          displayValue: 18% screened
          note: >-
            CDC provides the penetration signal and eligibility criteria, but not the total addressable cohort count in
            this source.
          claimRefs:
            - CM003
            - CM004
        - label: Covered follow-up pathway
          displayValue: Insurance and Medicare generally cover screening
          note: >-
            Coverage exists, but abnormal follow-up tests can still create co-pays or deductibles that affect
            conversion.
          claimRefs:
            - CM013
        - label: Peripheral-lesion diagnostic problem
          displayValue: Majority in outer third of lung
          note: >-
            This is the clinical bottleneck that makes navigation and confirmation more valuable than generic
            bronchoscopy capacity.
          claimRefs:
            - CM002
        - label: Integrated-imaging performance proof
          displayValue: 96.7% diagnostic yield
          note: Based on the 31-patient MATCH II lens cited in the assigned MassDevice evidence, not a market-size estimate.
          claimRefs:
            - CM008
        - label: Community-hospital expansion lens
          displayValue: 70 cases over 18 months
          note: >-
            Single community-hospital lung nodule program with 89% strict diagnostic yield and reported financial
            sustainability.
          claimRefs:
            - CM009
            - CM011
        - label: Conversion constraint
          displayValue: FDA follow-up unresolved publicly as of Aug. 2026
          note: Regulatory overhang can slow procurement and clinician trust even when product capability improves.
          claimRefs:
            - CM014
    approximationNotes: >-
      The pyramid is an evidence stack, not a mathematically linked funnel; values mix penetration, performance, and
      program-activity lenses because the public pool lacks a unified market-size dataset.
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM008
      - CM009
      - CM011
      - CM013
      - CM014
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on retained evidence for commercial scale versus integrated imaging and workflow
      simplification.
    xAxis:
      label: Commercial scale / installed footprint
      min: 1
      max: 5
      lowLabel: niche or site-specific
      highLabel: scaled installed base
      description: Ordinal scoring from retained 2025-2026 public evidence rather than inferred market share.
    yAxis:
      label: Integrated imaging + workflow simplification
      min: 1
      max: 5
      lowLabel: externalized or manual workflow
      highLabel: embedded confirmation with lower room burden
      description: >-
        Higher scores mean more built-in lesion confirmation, less reprocessing burden, and less multi-room complexity
        in retained evidence.
    data:
      points:
        - label: Noah Galaxy (2023 launch state)
          x: 2
          'y': 4
          detail: FDA-cleared platform with integrated tomosynthesis, augmented fluoroscopy, and single-use scope
        - label: Noah Galaxy II (2026 state)
          x: 3
          'y': 5
          detail: Adds HD-DT to optional CBCT switching; company-claimed U.S. procedure base now exceeds 16,000
        - label: Intuitive Ion
          x: 5
          'y': 3
          detail: 43,000 Q1 2026 procedures, 52 Q1 placements, and 1,041 installed systems; deeper support scale than Noah
        - label: Reusable bronchoscopy workflow
          x: 4
          'y': 1
          detail: Established status quo with no robotic purchase, but cleaning or sterilization stays in the operating model
        - label: External-CBCT bronchoscopy workflow
          x: 2
          'y': 4
          detail: >-
            Strong confirmation benchmark, but imaging remains an external layer rather than a single-cart integrated
            stack
        - label: Hospital-built hybrid suite
          x: 2
          'y': 2
          detail: >-
            Internal build can combine bronchoscopy, imaging, and sterilization assets, but the retained pool does not
            show a unified vendor package
    approximationNotes: >-
      Ordinal scores summarize retained evidence on scale and workflow integration; they are not market-share estimates
      or derived conversion rates.
    claimRefs:
      - CP003
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP011
      - CP012
      - CP014
      - CP015
