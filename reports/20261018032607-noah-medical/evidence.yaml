evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: corporate-identity
    missingEvidence: Verified founding date, current headquarters, legal entity, and principal operating locations.
    whyItMatters: Corporate identity and jurisdiction affect contracting, regulatory accountability, and legal diligence.
    diligencePath: Obtain formation documents, current good-standing certificates, facility list, and management confirmation.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current valuation, total funding, cash balance, debt, revenue, gross margin, burn, runway, customer count,
      installations, utilization, and headcount.
    whyItMatters: Public procedure counts cannot support valuation, financing sufficiency, or unit-economics underwriting.
    diligencePath: >-
      Request the cap table, financing documents, audited financials, monthly management accounts, debt schedule,
      customer roster, and installed-base utilization export.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Complete executive roster, board composition, investor ownership, security classes, preferences, consent rights,
      side letters, and succession coverage.
    whyItMatters: The public record cannot establish decision control, dilution exposure, or resilience beyond the founder.
    diligencePath: >-
      Obtain the current organizational chart, board minutes, cap table, charter, voting agreements, investor-rights
      agreements, and succession plan.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory-remediation
    missingEvidence: >-
      Primary FDA documentation establishing the current status and closure, if any, of the April 2025 warning-letter
      findings.
    whyItMatters: >-
      Unresolved quality-system or reporting deficiencies could constrain manufacturing, commercialization, and
      financing.
    diligencePath: >-
      Request all FDA correspondence, inspection responses, CAPA evidence, recall files, and written confirmation of
      follow-up status.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent 2026 TAM, SAM, SOM, annual procedure volume, and installed-base data for robotic bronchoscopy by site
      type and geography.
    whyItMatters: >-
      Without a transparent denominator, public clinical and workflow proof points cannot be converted into a defendable
      market-size or revenue-pool model.
    diligencePath: >-
      Request analyst market studies, claims-based procedure volumes, and Noah's internal installed-base and utilization
      cuts, then reconcile them against screening-funnel assumptions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited contribution margin, payback period, disposable attach rate, and reimbursement durability by academic
      versus community-hospital deployment.
    whyItMatters: >-
      The adoption thesis depends on economics as much as clinical proof, but the retained evidence is still vendor or
      physician commentary rather than audited customer outcomes.
    diligencePath: >-
      Obtain customer references, site-level P&Ls, reimbursement walkthroughs, and finance-backed ROI models from
      commercial and finance teams.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Current Noah list pricing, realized discounts, disposable gross margin, and any verified Noah-versus-Ion
      contracting terms.
    whyItMatters: >-
      Without price realization and contract structure, workflow differentiation cannot be translated into switching
      thresholds or margin durability.
    diligencePath: >-
      Request current price books, recent quoted deals, and three anonymized Noah-versus-Ion bake-off opportunities with
      final commercial terms.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-set
    missingEvidence: >-
      Independent customer or procurement records showing win-loss patterns among Noah, Ion, and non-robotic
      bronchoscopy workflows.
    whyItMatters: >-
      Public product pages and company statements show positioning, but not which features actually win or lose hospital
      buying decisions.
    diligencePath: >-
      Seek hospital RFPs, VAC minutes, customer references that considered both vendors, and distributor or channel
      interviews tied to specific buying criteria.
    relatedQuestionRefs:
      - QP001
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: likely-entrants
    missingEvidence: >-
      Additional successfully fetched competitor profiles beyond Intuitive Ion for other robotic or imaging-led
      alternatives.
    whyItMatters: >-
      The retained pool is enough to show the main incumbent and the substitute set, but not enough to prove the full
      named-competitor roster is closed.
    diligencePath: >-
      Run a targeted follow-up on robotic bronchoscopy peers, distributor channels, and hospital-capital alternatives,
      then fetch direct product or regulatory pages for each retained entrant.
    relatedQuestionRefs:
      - QP001
      - QP008
  - type: stale
    severity: material
    topic: regulatory-trust
    missingEvidence: Current FDA follow-up status and any remediation closure for the 2025 warning-letter issues.
    whyItMatters: >-
      Trust and quality posture are part of the competitive comparison, especially against a scaled incumbent selling
      clinical reliability.
    diligencePath: >-
      Re-check direct FDA correspondence, company remediation updates, and hospital-customer disclosures before using
      regulatory posture as a final moat or risk conclusion.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
