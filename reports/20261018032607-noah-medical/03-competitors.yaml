    - type: enumeration-incomplete
      severity: material
      topic: likely-entrants
      missingEvidence: Additional successfully fetched competitor profiles beyond Intuitive Ion for other robotic or imaging-led alternatives.
      whyItMatters: The retained pool is enough to show the main incumbent and the substitute set, but not enough to prove the full named-competitor roster is closed.
      diligencePath: Run a targeted follow-up on robotic bronchoscopy peers, distributor channels, and hospital-capital alternatives, then fetch direct product or regulatory pages for each retained entrant.
      relatedQuestionRefs:
