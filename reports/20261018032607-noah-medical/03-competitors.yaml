callouts:
  - calloutType: insight
    title: Noah's best wedge is workflow simplification, not scale parity
    body: Noah's retained public edge is the combination of single-use scopes, built-in imaging, and smaller room burden; Noah does not disclose an installed-base count comparable with Ion's public 1,041-system figure or Intuitive's capital resources.
    claimRefs:
      - CP002
      - CP003
      - CP009
      - CP011
  - calloutType: risk
    title: Incumbent response can come from scale and support, not feature mimicry
    body: Intuitive does not need to copy every Noah feature to pressure Noah if its installed base, placements, cash resources, and adjacent lung-workflow roadmap keep hospital buyers inside the incumbent ecosystem.
    claimRefs:
      - CP007
      - CP008
      - CP009
