    - type: missing-source
      severity: material
      topic: competitive-set
      missingEvidence: Independent customer or procurement records showing win-loss patterns among Noah, Ion, and non-robotic bronchoscopy workflows.
      whyItMatters: Public product pages and company statements show positioning, but not which features actually win or lose hospital buying decisions.
      diligencePath: Seek hospital RFPs, VAC minutes, customer references that considered both vendors, and distributor or channel interviews tied to specific buying criteria.
      relatedQuestionRefs:
