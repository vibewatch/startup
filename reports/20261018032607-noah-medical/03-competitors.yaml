  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Noah Galaxy / Galaxy II
      - Intuitive Ion
      - Status quo or hybrid substitute
    rows:
      - - Integrated lesion-confirmation workflow
        - Integrated tomosynthesis plus augmented fluoroscopy; Galaxy II adds HD-DT with optional CBCT escalation in one platform
        - Ion scale is documented, but retained sources only point to future ROSE and EBUS integration rather than Noah-style embedded HD-DT plus CBCT switching
        - CBCT-assisted bronchoscopy can confirm lesion targeting, but the imaging layer sits outside a single Noah-style stack
      - - Scope turnover and infection-control burden
        - Single-use disposable bronchoscope and accessories
        - Unknown in retained sources
        - Reusable-scope workflows require cleaning or sterilization and keep reprocessing labor in the loop
      - - Footprint and maneuverability
        - Noah claims a single-cart, smaller-footprint system designed for crowded suites
        - Unknown in retained sources
        - Hybrid rooms can work, but retained evidence treats them as more operationally fragmented than a single-cart stack
      - - Vendor scale and support depth
        - Growing procedure footprint; installed-base count is not disclosed in retained evidence
        - Publicly disclosed 1,041-system installed base, quarterly procedure scale, placements, and balance-sheet resources
        - Depends on in-house hospital workflow rather than a scaled robotic vendor ecosystem
    notes: Unsupported cells remain marked as unknown in retained sources rather than guessed; this matrix emphasizes workflow and support criteria that the cited sources actually discuss.
