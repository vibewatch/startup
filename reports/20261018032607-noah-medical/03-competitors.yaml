    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Current Noah list pricing, realized discounts, disposable gross margin, and any verified Noah-versus-Ion contracting terms.
      whyItMatters: Without price realization and contract structure, workflow differentiation cannot be translated into switching thresholds or margin durability.
      diligencePath: Request current price books, recent quoted deals, and three anonymized Noah-versus-Ion bake-off opportunities with final commercial terms.
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
