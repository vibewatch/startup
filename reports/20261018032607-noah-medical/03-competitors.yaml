  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Price, unit, or contract model
      - Included capabilities in retained evidence
      - Unknowns or discount caveats
      - Implication
    rows:
      - - Noah Galaxy / Galaxy II
        - Exact system price undisclosed; packaging evidence centers on platform plus single-use bronchoscope and accessories
        - Embedded imaging, optional CBCT escalation in Galaxy II, disposable scope, compact workflow
        - No retained public list price, discounting data, or realized per-procedure economics
        - Noah is selling a workflow package more than a publicly legible price point
      - - Intuitive Ion
        - Exact Ion price undisclosed; retained evidence only shows system placements, installed base, and service or recurring platform economics at the parent-company level
        - Large installed base, ongoing placements, lung-workflow roadmap investment
        - No retained public list price or Noah-vs-Ion contract comparison
        - Buyers may view Ion as a scale-backed platform purchase even without public price transparency
      - - Reusable bronchoscopy plus reprocessing
        - Uses existing scopes plus cleaning or sterilization workflow; direct cost varies by hospital
        - Familiar instruments and no robotic system purchase
        - Retained sources do not quantify labor, turnaround, or sterilization cost by site
        - Lower new-capex hurdle can be offset by persistent operating burden
      - - Bronchoscopy plus external CBCT workflow
        - Requires bronchoscopy capability plus external imaging access; site economics are not public in retained sources
        - Strong confirmation benchmark when centers already have CBCT access
        - Retained sources do not disclose room-build cost, reimbursement uplift, or utilization threshold
        - Attractive where existing imaging rooms are sunk cost, but less elegant as a packaged workflow
    notes: This table is intentionally caveated because the assigned pool contains packaging clues but not verified public pricing; unknowns are a diligence result, not a missing edit.
