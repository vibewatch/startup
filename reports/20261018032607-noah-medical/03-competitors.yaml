    rows:
      - - Noah Galaxy / Galaxy II
        - Direct peer
        - 5,000 U.S. procedures by Mar-2025; >16,000 U.S. procedures by Sep-2026; current funding not disclosed in retained competitors evidence
        - Peripheral lung nodule diagnosis and biopsy
        - Embedded imaging, single-use bronchoscope, compact footprint, procedural-efficiency pitch
        - Public pricing is opaque and 2026 evidence still carries quality-system scrutiny
      - - Intuitive Ion
        - Incumbent direct peer
        - 43,000 Q1 2026 procedures; 52 Q1 placements; 1,041 installed systems; $8.0B cash and investments
        - High-volume lung-biopsy programs and centers that value vendor scale
        - Largest documented installed base and resource depth in retained evidence
        - Retained sources do not document a Noah-style single-use scope or embedded HD-DT workflow
      - - Reusable bronchoscopy plus reprocessing
        - Status-quo substitute
        - Existing hospital workflow; no standalone vendor-scale metric in retained evidence
        - Centers avoiding robotic capital spend or preserving current bronchoscopy operations
        - Familiar workflow and no robotic platform purchase
        - Reprocessing burden and infection-control tradeoffs remain part of the workflow
      - - Bronchoscopy plus external CBCT workflow
        - Adjacent or internal-build substitute
        - Site-specific capital and room-build decision; no pooled vendor metric in retained evidence
        - Centers that prioritize imaging confirmation through existing room infrastructure
        - High-confidence confirmation benchmark that Noah itself still references
        - More room complexity and radiation-management burden than Noah's integrated workflow pitch
    notes: Public evidence is strongest for Noah and Intuitive; substitute rows describe workflow alternatives rather than claiming a named scaled vendor where the retained pool does not support one.
