figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: Public evidence supports a layered adoption thesis from the screening funnel to community-hospital deployment, but not a precise TAM/SAM/SOM.
    data:
      items:
        - label: Annual U.S. screening funnel
          displayValue: 18% screened
          note: CDC provides the penetration signal and eligibility criteria, but not the total addressable cohort count in this source.
          claimRefs: [CM003, CM004]
        - label: Covered follow-up pathway
          displayValue: Insurance and Medicare generally cover screening
          note: Coverage exists, but abnormal follow-up tests can still create co-pays or deductibles that affect conversion.
          claimRefs: [CM013]
        - label: Peripheral-lesion diagnostic problem
          displayValue: Majority in outer third of lung
          note: This is the clinical bottleneck that makes navigation and confirmation more valuable than generic bronchoscopy capacity.
          claimRefs: [CM002]
        - label: Integrated-imaging performance proof
          displayValue: 96.7% diagnostic yield
          note: Based on the 31-patient MATCH II lens cited in the assigned MassDevice evidence, not a market-size estimate.
          claimRefs: [CM008]
        - label: Community-hospital expansion lens
          displayValue: 70 cases over 18 months
          note: Single community-hospital lung nodule program with 89% strict diagnostic yield and reported financial sustainability.
          claimRefs: [CM009, CM011]
        - label: Conversion constraint
          displayValue: FDA follow-up unresolved publicly as of Aug. 2026
          note: Regulatory overhang can slow procurement and clinician trust even when product capability improves.
          claimRefs: [CM014]
    approximationNotes: The pyramid is an evidence stack, not a mathematically linked funnel; values mix penetration, performance, and program-activity lenses because the public pool lacks a unified market-size dataset.
    claimRefs: [CM002, CM003, CM004, CM008, CM009, CM011, CM013, CM014]
callouts:
  - calloutType: insight
    title: Community-hospital fit is the clearest adoption wedge
    body: The strongest market-expansion signal in the retained pool is not a headline TAM number but repeated evidence that integrated imaging, smaller footprints, and single-use workflows lower the operational threshold for community hospitals to offer robotic bronchoscopy locally.
    claimRefs: [CM007, CM011, CM012]
  - calloutType: risk
    title: Public sizing remains insufficient for valuation work
    body: The pool supports clinical relevance and some adoption mechanics, but it still lacks independent procedure-volume, installed-base, reimbursement-duration, and audited ROI data needed to turn market interest into a defendable 2026 revenue pool.
    claimRefs: [CM008, CM009, CM013, CM014]
