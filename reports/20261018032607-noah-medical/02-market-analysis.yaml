      - [Patients entering follow-up after screening or CT findings, 'Referring clinicians and lung-nodule coordinators', 'Diagnostic bronchoscopy team', 'Insurance / Medicare plus patient cost sharing for abnormal follow-up testing', 'Referral from screening or incidental finding into biopsy and staging workflow', 'Coverage pathway set by payer plus hospital access workflow', 'Reliable local access to minimally invasive diagnosis closer to home']
