company:
  name: Noah Medical
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Noah Medical is attacking a narrow but real workflow problem inside
    lung-cancer diagnosis: getting to and confirming hard-to-reach peripheral
    lesions after screening or incidental CT findings. The best public evidence
    in this assigned pool supports buyer and adoption logic plus promising
    clinical and community-hospital proof points, but it does not supply a
    defensible 2026 TAM/SAM/SOM or audited unit economics.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      Noah Medical's addressable market is not "lung cancer" in the broad sense,
      and it is not the upstream LDCT screening market by itself. The product sits
      in the downstream diagnostic workflow for suspicious lung lesions, especially
      peripheral lesions that are hard to biopsy accurately with conventional
      bronchoscopy or with fragmented navigation-plus-imaging setups. The relevant
      spend therefore includes robotic bronchoscopy capital and software, disposable
      bronchoscopes and accessories, and the workflow value of integrated imaging;
      it excludes screening scans themselves, unrelated oncology treatment, and
      broader thoracic surgery budgets. The top of funnel is still constrained by
      screening penetration: CDC says only about 18% of recommended U.S. adults
      have been screened, so market growth depends on both more screened patients
      and better diagnostic conversion after a lesion is found.
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001]
  - id: buyer-map
    title: Buyer, user, and adoption path
    body: >-
      The user is the interventional pulmonology or bronchoscopy team, but the
      economic buyer is the hospital lung nodule program or service-line owner that
      has to justify space, capital, staff time, and throughput. The assigned pool
      consistently frames adoption as a community-hospital expansion story rather
      than a pure academic-center story: smaller footprint, single-use scopes, and
      integrated imaging are positioned as ways to reduce reprocessing burden,
      crowded-room friction, and separate CBCT investment. That matters because
      community sites run tighter room-utilization and staffing economics than
      flagship centers. Coverage also matters in the adoption path: CDC says most
      insurance plans and Medicare help pay for recommended screening, but abnormal
      follow-up testing can still create patient cost-sharing and hospital workflow
      friction that slows conversion from clinical interest to scaled program volume.
    claimRefs: [CM007, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
    figureRefs: [FM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing, drivers, and constraints
    body: >-
      Public evidence in this pool is stronger on why adoption can happen than on
      how large the revenue pool is. The best sizing proxies are workflow and
      performance lenses: CDC's screening funnel, Noah's claim that peripheral
      lesions are hard to reach, a 31-patient imaging study with 96.7% diagnostic
      yield, a 70-case community-hospital series with reported financial
      sustainability, and repeated 90%-yield routine-use references. Together they
      support demand drivers such as earlier diagnosis, physician control of imaging,
      lower radiation in routine cases, and endoscopy-suite deployment. They also
      preserve real constraints: unresolved regulatory overhang, still-missing
      public TAM/SAM/SOM math, and no audited ROI or reimbursement durability by
      customer segment. That means the market can be described as promising and
      expanding, but not yet underwritten precisely from public evidence alone.
    claimRefs: [CM005, CM006, CM008, CM009, CM010, CM014]
    tableRefs: [TM002]
