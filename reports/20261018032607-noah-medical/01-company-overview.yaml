company:
  name: "Noah Medical"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Noah Medical is commercializing the Galaxy robotic-assisted bronchoscopy platform after a
    $150 million Series B, FDA clearance, and company-reported expansion beyond 16,000 U.S.
    procedures. The investment case remains constrained by undisclosed financials and governance,
    location ambiguity, and an FDA warning letter reported in 2025.
sections:
  - id: "identity-and-commercial-position"
    title: "Identity and commercial position"
    body: >-
      Noah Medical describes itself as a medical robotics company focused on earlier diagnosis and
      treatment, with Galaxy as its robotic-assisted bronchoscopy platform. Independent trade
      reporting corroborates the product category and reports FDA clearance in March 2023. The
      commercial architecture combines a reusable capital platform with single-use bronchoscopes
      and accessories, suggesting equipment revenue plus recurring consumables, although neither
      pricing nor revenue mix is public. Galaxy II launched in August 2026 with software supporting
      HD-DT and CBCT imaging. A company-issued September 2026 release said the platform had exceeded
      16,000 U.S. procedures and entered commercial use in Hong Kong; those scale figures remain
      company claims rather than audited customer or revenue metrics. Public descriptions also use
      both San Carlos and San Jose for the company, so the current headquarters and legal domicile
      require confirmation.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO012, CO014]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founder and CEO Jian Zhang is the only clearly identified corporate executive across the
      retained evidence. Independent reporting links his experience to Intuitive Surgical, Auris
      Health, and Robotphoenix, providing direct founder-market fit in surgical and industrial
      robotics. Noah's own materials say the broader team has experience from several established
      medical-robotics companies, but they do not provide a current executive roster. The company
      newsroom also lists Dr. Krish Bhadra as Chief Pulmonary Advisor, while product materials and
      reporting document his clinical use of Galaxy. This supports clinical-adviser coverage but
      does not resolve board composition, executive succession, control rights, or whether key
      technical and commercial responsibilities are distributed beyond Zhang. Governance and
      key-person concentration therefore remain material diligence items.
    claimRefs: [CO009, CO010, CO011, CO013]
    tableRefs: [TO002]
  - id: "financing-and-stakeholders"
    title: "Financing and stakeholders"
    body: >-
      The strongest financing evidence is an April 2023 $150 million Series B, independently
      reported by Global Corporate Venturing and also named in Noah's newsroom index. SoftBank
      Vision Fund and Prosperity7 Ventures co-led the round, with Hillhouse Capital, Sequoia China,
      and a broader syndicate participating. This establishes a substantial institutional funding
      event but not total capital raised, current cash, valuation, ownership percentages, board
      seats, preferences, secondary transactions, or debt. No retained source substantiates the
      previously reported 2025 financing or a current valuation, so those figures are excluded
      rather than rolled forward. The cap table and investor-rights package must be obtained
      directly before assessing control, dilution, or financing runway.
    claimRefs: [CO007, CO008]
    tableRefs: [TO003]
  - id: "milestones-and-risk-signals"
    title: "Milestones and risk signals"
    body: >-
      The evidence shows a rapid path from March 2023 clearance to commercial deployment, 500 U.S.
      procedures by January 2024, later clinical readouts, and a 2026 software and geographic
      expansion cycle. That progression is meaningful operational evidence, but procedure counts
      are not equivalent to installed systems, customers, revenue, or utilization. The timeline
      also includes an April 2025 FDA warning letter reported by MassDevice. The report described
      current-good-manufacturing-practice, CAPA, and medical-device-reporting concerns and said the
      agency was arranging a follow-up visit. No retained 2026 source establishes final resolution,
      so regulatory remediation should be treated as open. Reported 2025 studies showed encouraging
      diagnostic-yield results, but company-sponsored announcements and trade coverage do not
      substitute for a full review of study design, adverse events, and commercial cohort quality.
    claimRefs: [CO002, CO003, CO004, CO005, CO006, CO007, CO015, CO016]
    figureRefs: [FO001]
