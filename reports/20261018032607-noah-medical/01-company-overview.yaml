callouts:
  - calloutType: "risk"
    title: "Financial and regulatory proof remains incomplete"
    body: >-
      Procedure momentum cannot be converted into revenue, runway, valuation, or customer economics
      from public evidence, and the retained record does not establish closure of the 2025 FDA warning.
    claimRefs: [CO004, CO015]
