    title: Recommendation logic
    type: flow
    summary: Recommendation stays at research-more because commercialization proof and investor quality are outweighed by unresolved pricing inputs and regulatory overhang.
    data:
      nodes:
        - id: clinical-proof
          label: Clinical proof
          detail: 2024 coverage reported 100% navigation and 100% tool-in-lesion in FRONTIER.
          tone: positive
        - id: commercial-momentum
          label: Commercial momentum
          detail: Company-issued September 2026 update cited first Asia commercial case and 16,000+ U.S. procedures.
          tone: positive
        - id: capital-support
          label: Capital support
          detail: Independent and official sources corroborate a 2023 oversubscribed $150M Series B.
          tone: positive
        - id: missing-pricing-inputs
          label: Missing pricing inputs
          detail: No current public valuation mark, revenue, margin, burn, runway, or preference stack in the assigned pool.
          tone: warning
        - id: regulatory-overhang
          label: Regulatory overhang
          detail: 2026 reporting said the 2025 FDA warning letter still awaited follow-up.
          tone: risk
        - id: recommendation
          label: Research-more / valuation unknown
          detail: Re-open only after primary financing, KPI, and remediation evidence is shared.
          tone: warning
      edges:
        - from: clinical-proof
          to: commercial-momentum
          label: supports adoption case
        - from: commercial-momentum
          to: recommendation
          label: helps thesis but not price
        - from: capital-support
          to: recommendation
          label: validates investor interest
        - from: missing-pricing-inputs
          to: recommendation
          label: blocks underwriting
        - from: regulatory-overhang
          to: recommendation
          label: raises downside risk
    approximationNotes: null
    claimRefs: [CV001, CV002, CV003, CV007, CV010, CV011]
callouts:
  - calloutType: recommendation
    title: Price sensitivity dominates the final call
    body: >-
      Noah may prove to be a strong company, but this chapter is a valuation decision, not a product-quality award. Until primary documents establish current economics and financing terms, the right posture is to track and diligence rather than underwrite a price.
    claimRefs: [CV010, CV011, CV015]
