schemaVersion: report-v2
artifact: valuation
slug: noah-medical
runDate: 2026-10-18
company:
  name: Noah Medical
chapter:
  number: 8
  title: Valuation
  summary: >-
    Noah Medical has credible product differentiation, independent confirmation of its 2023
    $150 million Series B, and current commercialization signals, but the assigned public
    evidence still does not disclose a current valuation mark, revenue base, margin profile,
    burn, or cap-table terms. The evidence therefore supports a research-more recommendation,
    medium confidence, and high risk rating rather than a price-backed underwriting view.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The assigned valuation evidence supports a cautious posture rather than an invest-at-any-price
      conclusion. Noah still shows meaningful commercial momentum: independent reporting ties the
      business to a 2023 oversubscribed $150 million Series B, and a 2026 company-issued release
      says the platform has now supported more than 16,000 procedures in the United States while
      also reaching its first commercial case in Asia. But those positives do not solve the core
      underwriting problem: the current public evidence set still lacks a current priced round,
      revenue disclosure, gross margin detail, burn, runway, and preference-stack terms. Without
      those inputs, the disciplined call is research-more, with medium confidence and a high risk
      rating, and any engagement should be conditioned on primary financing and operating-data
      review rather than on narrative momentum alone.
    claimRefs: [CV001, CV003, CV010, CV011, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The pro-underwrite case rests on two observable facts. First, Noah appears to have built a
      differentiated robotic bronchoscopy product: multiple sources describe embedded imaging,
      TiLT+ workflow, and a single-use disposable bronchoscope, while June 2024 clinical coverage
      reported 100% successful navigation and 100% tool-in-lesion accuracy in the 18-patient
      FRONTIER study. Second, commercialization is no longer theoretical, because the company says
      the platform has crossed 16,000 U.S. procedures and begun commercial use in Asia. The
      anti-thesis is equally material. A 2026 MassDevice report says the FDA warning letter from
      April 2025 was still awaiting follow-up, and the same report cites CAPA and MDR-process
      deficiencies; older independent coverage also continued to reference Auris trade-secret
      litigation. That combination caps conviction until revenue quality and regulatory cleanup are
      verified directly.
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-anchors
    title: Scenarios and comparable anchors
    body: >-
      The cleanest external anchor in the assigned pool is not a Noah valuation multiple but a
      public strategic benchmark: Intuitive reported about $10.06 billion of 2025 revenue and 195
      Ion endoluminal system placements, illustrating how much larger the category leader already
      is than Noah’s disclosed operating proof. That makes Noah’s 2023 private round only a stale
      financing reference, not a current value floor. The scenario framework therefore has to stay
      qualitative. A bull case requires Noah to translate reported procedure volume, Galaxy II
      product updates, and geographic expansion into verified revenue scale without new regulatory
      drag. A base case supports only disciplined follow-up diligence. A bear case includes flat or
      down-round risk, or investor-protective terms, if remediation or utilization disappoints.
    claimRefs: [CV001, CV003, CV005, CV006, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      Public evidence does not yet support a hold-period target, return hurdle, or exit multiple,
      because the missing variables are exactly the ones that drive medtech pricing: installed-base
      utilization, disposable pull-through, gross margin by capital versus consumables, cash burn,
      runway, and the liquidation-preference stack. The next diligence step is therefore not model
      refinement but source quality escalation. Management should provide current financing
      documents, cohort-level commercial KPIs, and direct evidence of FDA follow-up status. The
      thesis should be considered broken if a new financing is required before those metrics are
      shared, if warning-letter remediation extends without clear closure, or if commercialization
      momentum fails to convert into verifiable recurring economics.
    claimRefs: [CV007, CV008, CV010, CV011, CV012, CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Assessment, Decision implication]
    rows:
      -
        - Recommendation
        - research-more
        - Re-open only after primary financing and operating-data diligence.
      -
        - Confidence
        - medium
        - Product and financing history are evidenced, but price-setting economics are not.
      -
        - Risk rating
        - high
        - Regulatory remediation and missing financial transparency can materially change outcome.
      -
        - Valuation stance
        - unknown
        - Public evidence does not support a current valuation mark or entry price.
      -
        - Target return / hold / exit
        - unsupported publicly
        - Do not underwrite a return target until revenue quality and cap-table terms are verified.
    notes: >-
      Snapshot reflects only the assigned public valuation pool as of 2026-10-18; it is not a price target.
    claimRefs: [CV003, CV007, CV010, CV011, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      -
        - "Thesis: clinical and workflow differentiation"
        - 2024 coverage reported 100% navigation and 100% tool-in-lesion in the 18-patient FRONTIER study and multiple sources describe single-use workflow advantages.
        - Verified multi-site utilization and recurring disposable economics would strengthen conviction.
      -
        - "Thesis: real commercialization momentum"
        - Noah said in September 2026 that the platform had supported more than 16,000 U.S. procedures and had its first commercial procedure in Asia.
        - Direct hospital cohort data showing expansion beyond early reference sites would improve underwriting confidence.
      -
        - "Anti-thesis: regulatory overhang can cap multiples"
        - MassDevice said the April 2025 FDA warning letter was still awaiting follow-up and cited CAPA and MDR deficiencies.
        - Clean FDA follow-up evidence and a stable complaint trend would reduce this discount.
      -
        - "Anti-thesis: valuation cannot be anchored publicly"
        - The assigned pool still does not disclose a current priced round, revenue, gross margin, burn, runway, or preference stack.
        - A current financing package and management KPI pack would convert the view from narrative to priceable.
    notes: >-
      Evidence combines independent reporting with company-issued updates; the last row is a constraint on the public evidence set, not proof of company underperformance.
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      -
        - Bull
        - Reported U.S. procedure volume and Asia commercialization translate into repeatable site expansion while Galaxy II improves workflow and no new regulatory drag emerges.
        - Would justify an up-round versus the 2023 Series B only after verified revenue scale and clean regulatory follow-up are shown.
        - Utilization fails to replicate or remediation reopens.
        - Requires direct proof of commercial cohorts and financing demand.
      -
        - Base
        - Clinical differentiation remains real but revenue quality and cap-table terms remain private.
        - Supports only cautious re-engagement and disciplined pricing after diligence rather than an immediate valuation endorsement.
        - Financial opacity and moderate regulatory friction persist.
        - Most likely until management opens the data room.
      -
        - Bear
        - CAPA/MDR remediation, litigation, or commercialization execution delay the next financing event.
        - Raises risk of flat or down-round pricing and investor-protective structure.
        - Additional quality actions or slower site adoption.
        - Triggered by delayed FDA follow-up or weak installed-base productivity.
    notes: >-
      Because the assigned public evidence lacks current valuation and financial disclosures, scenarios are qualitative and anchored to financing direction rather than invented price ranges.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV012, CV013, CV014]
