callouts:
  - calloutType: risk
    title: Kill criteria before underwriting a new round
    body: >-
      Do not underwrite a cleaner risk posture until Noah can produce direct FDA
      remediation evidence, site-level reimbursement contribution margin, and a
      current board view of cash runway and supply resilience; absent those,
      apparent procedure momentum can still mask a fragile operating model.
    claimRefs: [CR004, CR006, CR010, CR011, CR012, CR016]
