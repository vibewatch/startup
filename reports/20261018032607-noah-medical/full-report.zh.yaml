            title: Noah 最好的切入口是简化工作流，而非追平规模
            body: Noah 留存的公开优势在于一次性镜体、内置成像和更小的手术室负担；Noah 没有披露可与 Ion 公开的 1,041 台装机 或 Intuitive 的资本资源相比的装机基数。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
          - type: callout
            title: 行业龙头可以靠规模和支持回应，而不必模仿功能
            body: 如果 Intuitive 的装机基数、装机量、现金资源和相邻肺部工作流路线图能让医院买方留在行业龙头生态中， 它不必复制 Noah 的每项功能就能对 Noah 形成压力。
            calloutType: risk
            claimRefs:
