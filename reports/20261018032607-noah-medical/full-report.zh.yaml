            body: >-
              公开风险排序由一个仍可能击穿投资论点的问题主导：FDA 警告信之后的质量体系整改。这个问题比普通医疗科技执行 噪音更重要，因为它同时涉及制造过程控制、投诉处理和 MDR 时限；截至 2026 年 8
              月，MassDevice 仍报道称 后续检查尚在安排。下一层风险是经济而非技术：Noah 宣传了明显的工作流优势，也报告手术量增长，但独立报销指南
              仍显示，先进支气管镜的经济性依赖多代码文件和付款方特定的计费逻辑，而不是简单统一的手术支付。第三层是依赖 风险。最有力的采用证据仍有相当部分来自公司控制的里程碑，以及数量有限的知名医院和医生拥护者，因此旗舰站点
              之外的规模必须证明，不能假定。
