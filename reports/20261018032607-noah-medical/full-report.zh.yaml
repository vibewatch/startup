        blocks:
          - type: paragraph
            body: >-
              最有力的融资证据是 2023 年 4 月的 $150 million Series B，由 Global Corporate Venturing 独立报道，Noah 新闻室索引也提到该轮融资。SoftBank
              Vision Fund 和 Prosperity7 Ventures 共同领投，Hillhouse Capital、 Sequoia China
              及更广泛的财团参与其中。这能确认一笔规模可观的机构融资，但不能确认累计融资额、当前现金、 估值、持股比例、董事席位、优先权、老股交易或债务。留存来源没有证实此前报道的 2025 年融资或当前估值，
              因此这些数字不纳入推算，也不向前滚动。评估控制权、稀释和融资续航前，必须直接取得股权结构表和投资人权利 文件包。
