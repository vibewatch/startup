  - id: FI001
    title: 含未经验证转化节点的收入模型桥接
    type: flow
    summary: 公开证据确认了产品和手术阶段，但转化为价格、确认收入和毛利的过程仍未披露。
    data:
      nodes:
        - id: system-access
          label: Galaxy 系统使用权
          detail: 销售、租赁、按使用计价和已安装基数均未披露。
        - id: active-site
          label: 活跃临床站点
          detail: 活跃账户数和系统使用量均未披露。
        - id: procedure
          label: 支气管镜手术
          detail: Noah 报告称，截至 2025 年 3 月 24 日，美国累计手术量为 5,000 例。
        - id: disposable-use
          label: 一次性内窥镜及配件
          detail: 已确认产品存在；每例使用量和实际成交价不可得。
        - id: software-value
          label: Galaxy II 能力
          detail: 已确认商业化上市；收费还是捆绑销售尚不可得。
        - id: financial-output
          label: 收入和毛利
          detail: 收入确认、收入结构、毛利率和现金转化均未披露。
    approximationNotes: 有序流程仅为概念示意，不包含推导出的转化率、价格、收入或利润率。
    claimRefs:
      - CI003
      - CI004
      - CI008
      - CI014
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据将 Galaxy 描述为一体化支气管镜平台，叠加 CT 规划、EMN 导航、集成影像、一次性通路硬件和手术室运营工作流。
    data:
      layers:
        - label: 规划输入
          items:
            - label: 0.8-1 mm 术前 CT
            - label: 3D 虚拟病例方案
          outputs:
            - label: Target pathway
        - label: 导航
          items:
            - label: EMN 引导
            - label: 四向支气管镜转向
          outputs:
            - label: Approach within 2 cm of lesion
        - label: 可视化
          items:
            - label: 始终开启摄像头的支气管镜
          outputs:
            - label: Direct visualization at biopsy
        - label: 术中影像
          items:
            - label: TiLT+ 数字断层合成
            - label: 增强透视
            - label: Galaxy II HD-DT / CBCT 模式选择
          outputs:
            - label: Real-time tool and lesion confirmation
        - label: 组织通路
          items:
            - label: 2.1 mm 工作通道
            - label: 一次性支气管镜及配件
          outputs:
            - label: Biopsy sampling workflow
        - label: 手术室运营
          items:
            - label: 单车占地
            - label: 搭建与拆卸工作流
          outputs:
            - label: Procedure turnover
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE009
      - CE010
  - id: FU001
    title: 客户采用路径与证据面
    type: journey-map
    summary: 从监管许可到重复手术量和地域扩张的各阶段均有证据支持；该顺序不是经测量的转化漏斗。
    data:
      nodes:
        - id: regulatory-enablement
          label: 监管许可
          detail: FDA 批准在商业化前确认了预期的气道通路用途。
          touchpoints:
            - FDA 510(k) decision
            - Hospital compliance review
        - id: clinical-evaluation
          label: 临床评估
          detail: 代表性用户模拟测试及后续临床研究支持评估。
          touchpoints:
            - Physician training
            - Navigation and biopsy evidence
        - id: hospital-adoption
          label: 医院采用
          detail: 有明确医院名称的生产使用证据始于美国医院部署。
          touchpoints:
            - Bronchoscopy program
            - Interventional pulmonology team
        - id: workflow-integration
          label: 工作流集成
          detail: 紧凑设备和一次性内窥镜针对手术室及再处理约束。
          touchpoints:
            - Setup and teardown
            - Disposable reorder
        - id: repeat-procedure-volume
          label: 重复手术量
          detail: 累计手术量表明已有使用，但站点层面的使用情况仍未披露。
          touchpoints:
            - 500th U.S. use
            - More than 16,000 U.S. procedures claimed
        - id: geographic-expansion
          label: 地域扩张
          detail: 香港从早期临床使用发展到据报道的商业化手术。
          touchpoints:
            - Clinical relationship
            - Commercial integration
    approximationNotes: 各阶段是定性证据面；未推断转化率、持续时间、客户数量或与价值成比例的宽度。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU008
      - CU009
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开记录显示，FDA 整改构成一个关键风险集群，经济性和规模化依赖紧随其后。
    data:
      columns:
        - label: 可能性
          note: 未来 12-18 个月影响规模化的概率。
        - label: 影响
          note: 风险发生后可能对投资判断信心造成的损害。
        - label: 缓解成熟度
          note: 公开证据显示 Noah 已经降低该风险的程度。
        - label: 剩余暴露
          note: 缓解措施后的投资判断暴露，不是已观察到的损失。
      rows:
        - label: FDA 质量体系遗留问题
          note: 保留资料中仍缺少警告信和 MDR 结案证明。
          values:
            - label: 高
              tone: high
            - label: 关键
              tone: critical
            - label: 中
              tone: medium
              detail: 可以看到商业化仍在继续，但没有结案证据。
            - label: 高
              tone: high
        - label: 报销与站点层面经济性
          note: 计费指南表明，经济性取决于编码规范和病例组合。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              detail: 工作流效率有所帮助，但仍缺少站点贡献利润证明。
            - label: 高
              tone: high
        - label: 一次性内窥镜供应与利润率执行
          note: 一次性工作流既是临床和工作流优势，也是经常性成本依赖。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: KOL / 参考站点集中度与国际推广
          note: 手术量增长可见，但叙事很大程度上仍依赖重点站点。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 中
              tone: medium
            - label: 中
              tone: medium
        - label: 财务不透明与现金续航不确定性
          note: 公开里程碑和融资历史存在，但保留资料未披露收入和现金续航。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: low
              detail: 指定证据中，尚缺公开的现金创造缓解措施证明。
            - label: 高
              tone: high
        - label: IP 与法律尽调不完整
          note: 专利深度可见，但未见 FTO、诉讼和隐私尽调。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 中低
              tone: medium
            - label: 中
              tone: medium
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐仍为继续研究：商业化证明和投资者质量不足以抵消尚未解决的定价输入与监管遗留问题。
    data:
      nodes:
        - id: clinical-proof
          label: 临床证明
          detail: 2024 年报道显示，FRONTIER 的导航率为 100%，工具进入病灶率也为 100%。
          tone: positive
        - id: commercial-momentum
          label: 商业动能
          detail: 公司 2026 年 9 月更新称，亚洲首例商业化病例已完成，美国手术量超过 16,000 例。
          tone: positive
        - id: capital-support
          label: 资本支持
          detail: 独立来源和官方来源共同印证 2023 年超额认购的 $150M B 轮融资。
          tone: positive
        - id: missing-pricing-inputs
          label: 缺失的定价输入
          detail: 指定资料中没有当前公开估值、收入、利润率、现金消耗、现金续航或优先股堆叠。
          tone: warning
        - id: regulatory-overhang
          label: 监管遗留问题
          detail: 2026 年报道称，2025 年 FDA 警告信仍在等待后续处理。
          tone: risk
        - id: recommendation
          label: 继续研究 / 估值未知
          detail: 只有在提供一手融资、KPI 和整改证据后才重新评估。
          tone: warning
      edges:
        - from: clinical-proof
          to: commercial-momentum
          label: 支持采用逻辑
        - from: commercial-momentum
          to: recommendation
          label: 有助于论点但不能定价
        - from: capital-support
          to: recommendation
          label: 验证投资者兴趣
        - from: missing-pricing-inputs
          to: recommendation
          label: 阻碍投资判断
        - from: regulatory-overhang
          to: recommendation
          label: 提高下行风险
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV010
      - CV011
