      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              在留存证据中，创始人兼 CEO Jian Zhang 是唯一身份明确的公司高管。独立报道将其经历与 Intuitive Surgical、 Auris Health 和 Robotphoenix
              联系起来，显示其在外科和工业机器人领域具备直接的创始人与市场匹配度。Noah 自有材料称更广泛的团队来自数家成熟医疗机器人公司，但没有提供当前高管名单。公司新闻室还将 Dr. Krish Bhadra
              列为首席肺病顾问，产品材料和报道也记录了他临床使用 Galaxy 的情况。这能证明临床顾问覆盖，但 仍不能确定董事会构成、高管继任、控制权安排，或关键技术和商业职责是否分散在 Zhang 之外。治理结构和关键
              人员集中度因此仍是重要尽调事项。
