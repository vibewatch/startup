      - number: '2.3'
        title: 受证据约束的市场规模、驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              这批公开证据更能说明采用为何可能发生，而不是收入池究竟有多大。最有用的规模代理指标来自工作流和性能： CDC 的筛查漏斗、Noah 关于周围型病灶难以触达的说法、一项 31 名患者且诊断产出率为 96.7%
              的成像研究、 一组 70 例且报告财务可持续性的社区医院病例，以及多次提到的常规使用 90% 产出率。它们共同支持更早诊断、
              医生掌控成像、常规病例辐射更低和内镜室部署等需求驱动因素。同时也保留了真实限制：监管问题尚未解决， 公开 TAM/SAM/SOM 计算仍缺失，也没有按客户分群的经审计 ROI
              或报销持久性数据。因此，市场可以描述为 前景良好且正在扩张，但仅凭公开证据还无法精确纳入投资判断。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 社区医院适配是最清晰的采用切入口
            body: 留存资料中最强的市场扩张信号不是醒目的 TAM 数字，而是反复出现的证据：集成成像、更小的占地和一次性工作流 降低了社区医院在本地提供机器人支气管镜服务的运营门槛。
            calloutType: insight
            claimRefs:
              - CM007
              - CM011
              - CM012
          - type: callout
            title: 公开规模数据仍不足以支持估值
            body: 现有资料支持临床相关性和部分采用机制，但仍缺少独立手术量、装机基数、报销持续时间和经审计 ROI 数据， 因而无法把市场兴趣转化为可辩护的 2026 年收入池。
            calloutType: risk
            claimRefs:
              - CM008
