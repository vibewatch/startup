  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构合理，但尚未披露
        blocks:
          - type: paragraph
            body: >-
              Galaxy 将机器人支气管镜平台、一次性支气管镜及配件和已商业发布的 Galaxy II 软件结合起来。这种产品结构 形成三个合理的变现层：系统使用权、按手术计费的耗材，以及软件或服务价值。但留存证据没有说明
              Noah 是否 分别对每一层收费、系统是销售还是租赁、软件如何授权，或服务和培训是否带来经常性费用。Galaxy II 被宣传为
              无需新增资本就能增加能力，这可能提升已装系统的价值，却不能证明带来增量软件收入。因此，收入桥接只是尽调 框架，不是预测；没有合同条款和实际成交价格，不能把没有公开定价依据的产品活动换算成收入。
            claimRefs:
