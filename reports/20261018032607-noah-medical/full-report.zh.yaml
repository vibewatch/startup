      - number: '3.3'
        title: 持久性取决于 Noah 的工作流切入口能否跑赢行业龙头的规模和信任风险
        blocks:
          - type: paragraph
            body: >-
              护城河真实存在，但目前还谈不上持久。Intuitive 的公开 2026 年证据显示，其 Ion 装机基数为 1,041 台、季度 手术量为 43,000 例，并持续装机，同时拥有 $8.0 billion
              现金及投资，这给了行业龙头继续投入培训、服务、 数字化功能和 ROSE、支气管内超声等肺部工作流整合的空间。留存证据中，Noah 没有披露可比的装机基数。因此， 现有证据支持 Intuitive
              在资源和已披露规模上占优，但不能给出精确的装机比例。这并不否定 Noah 的产品切入口； 但意味着 Noah 面对的是资本更充足的行业龙头，对方可以靠产品组合深度和客户支持广度回应，而不必逐项复制 Noah
              的一次性定位。


              留存的 2026 年证据也显示 Noah 在信任和执行上处于劣势。MassDevice 将 Galaxy II 发布与 2025 年 4 月的 FDA 警告信联系起来，并称 FDA
              仍在安排后续检查。与此同时，在这组来源中，Noah 和 Ion 的公开定价都不透明， 因而市场在技术工作流和规模上更容易理解，在实际经济切换门槛上却不清晰。对尽调而言，竞争结论是“切入口
              可信，但尚未证明持久”：Noah 的工作流设计似乎足够差异化，可以赢单，但最有力的公开证据仍显示竞争重心 在 Intuitive 的规模，以及 Noah 能否守住信任、把工作流优势转化为有黏性的采用。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
