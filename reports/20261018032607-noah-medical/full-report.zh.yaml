      - - 反论：公开信息无法锚定估值
        - 指定证据池仍未披露当前定价轮、收入、毛利率、资金消耗、现金续航期或优先股堆叠。
        - 当前融资材料和管理层 KPI 包将把判断从叙事转成可定价判断。
