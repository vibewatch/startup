        blocks:
          - type: paragraph
            body: >-
              Noah 的一次性支气管镜和配件构成了合理的按手术消耗机制，公司称一次性设计消除了再处理负担并支持更快周转。
              但这些说法没有揭示一次性产品的物料清单、内部转移价格、报废率、保修准备金、物流成本或医院层面的成本对比。 Intuitive 初步披露的 2025 年结果说明为何必须区分装机和手术量：Ion 装机下降，而 Ion
              手术量增长，其更广义的 器械和配件收入也随手术量增长。这是商业模式参照，不是 Noah 的估算。另一方面，MassDevice 对 FDA 警告信缺陷
