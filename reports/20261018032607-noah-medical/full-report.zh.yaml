            body: >-
              Noah 的监管基础可信：Galaxy 于 2023 年 3 月获得 FDA 批准，可用于支气管镜观察患者气道并进入气道；但这项
              批准只是风险分析的起点，不是终点。同一产品家族后来卷入警告信事件，独立报道给出了异常具体的描述：FDA 据报 从现行良好生产规范角度认定 Galaxy 支气管镜及配件存在“掺假”问题，文章还描述了 CAPA 和
              MDR 时限缺陷。 因此，监管暴露既是运营问题，也是法律问题：新的软件和成像层可以提升临床实用性，但每一项新增工作流主张或
              发布节奏都更需要严格的设计控制、投诉处理和上市后报告。现有资料也显示公司有一定专利储备，但没有呈现自由 实施意见、诉讼案卷或隐私 / 安全合同证据；即便留存证据中没有公开的问题陈述，法律尽调仍不完整。
