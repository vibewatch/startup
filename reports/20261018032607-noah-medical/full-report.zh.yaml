            body: >-
              Noah 现在已有足够公开证据说明 Galaxy 已走出原型阶段，但还不足以称平台已经完全去风险化。这批资料中最强的 2026 年商业化信号，是 Prince of Wales Hospital
              在亚洲完成首例商业手术，同时 Noah 声称美国装机基础已超过 16,000 例手术。临床证据方向上令人鼓舞，但仍不均衡：独立的 Journal of Thoracic Disease 研究覆盖首年学术 使用中的
              91 名患者和 94 个结节，严格诊断产出率为 68%，并有不可忽视的并发症率；同一论文指出，较早的 Galaxy 数据来自更受控的 FRONTIER 和 MATCH 2 场景，其中 MATCH 2 产出率为
              96.7%。这一模式支持真实产品成熟度， 也说明操作者学习曲线和现场条件仍然重要。
