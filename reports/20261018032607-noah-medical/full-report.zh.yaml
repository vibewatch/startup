  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              现有估值证据支持谨慎立场，而不是不计价格地投资。Noah 仍显示出明显商业势头：独立报道将公司与 2023 年 超额认购的 $150 million Series B 联系起来，2026
              年公司发布的公告称平台在美国已支持超过 16,000 例手术， 并在亚洲完成首例商业手术。但这些积极因素没有解决核心投资判断问题：当前公开证据仍缺少最新定价轮、收入
              披露、毛利率细节、烧钱、资金续航和优先股堆叠条款。没有这些输入，纪律性的结论是继续研究，置信度中等、风险 评级高；任何接触都应以审查一手融资和运营数据为前提，而不能只依赖叙事势头。
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              支持投资判断的论据建立在两个可观察事实之上。第一，Noah 似乎打造了有差异化的机器人支气管镜产品：多个来源 描述了内置成像、TiLT+ 工作流和一次性支气管镜，2024 年 6 月临床报道还称，在 18
              名患者的 FRONTIER 研究中， 导航成功率为 100%，工具到达病灶准确率也为 100%。第二，商业化已不再是理论，因为公司称平台已跨过 16,000 例美国
              手术，并开始在亚洲商业使用。反向论点同样重要。MassDevice 2026 年报道称，2025 年 4 月的 FDA 警告信仍在 等待后续检查，同一报道提到 CAPA 和 MDR
              流程缺陷；较早的独立报道也继续提及 Auris 商业秘密诉讼。在收入质量 和监管整改得到直接验证前，这些因素限制了投资确信度。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: 情景与可比锚点
        blocks:
          - type: paragraph
            body: >-
              这批资料中最干净的外部锚点不是 Noah 的估值倍数，而是公开的战略基准：Intuitive 报告 2025 年收入约 $10.06 billion、Ion 腔内系统装机 195 台，说明品类龙头已经比 Noah
              已披露的运营证据大得多。因此，Noah 2023 年的私募轮次只是过时的融资参照，不是当前价值底线。情景框架必须保持定性。乐观情景要求 Noah 把已报告 的手术量、Galaxy II
              产品更新和地域扩张转化为经验证的收入规模，同时没有新的监管拖累。基准情景只支持有纪律 地继续尽调。悲观情景包括融资估值持平或下调，或在整改或使用率令人失望时出现保护投资人的条款。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 退出准备度与最终尽调请求
        blocks:
          - type: paragraph
            body: >-
              公开证据还不能支持持有期目标、回报门槛或退出倍数，因为缺失的变量正是决定医疗科技定价的因素：装机利用率、 一次性耗材拉动、资本设备与耗材分别对应的毛利率、现金烧钱、资金续航和清算优先股堆叠。下一步尽调不是继续
              打磨模型，而是升级来源质量。管理层应提供当前融资文件、队列层面的商业 KPI 和 FDA 后续检查状态的直接证据。
              如果在这些指标披露前就需要新融资、警告信整改长期没有明确结案，或商业化势头未能转化为可验证的经常性经济性， 就应视为投资论点失效。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 价格敏感性主导最终判断
            body: Noah 可能最终证明是一家强公司，但本章做的是估值判断，不是给产品质量颁奖。在一手文件确认当前经济性和融资 条款前，正确姿态是跟踪并尽调，而不是按某个价格做投资判断。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV015
