      - number: '3.2'
        title: Noah 依靠集成成像、一次性工作流和手术室占地竞争，而非原始规模
        blocks:
          - type: paragraph
            body: >-
              Noah 有据可查的最大差异在于工作流设计。Noah 自己的产品材料称，Galaxy 是唯一配备一次性支气管镜的机器人 支气管镜平台；Fierce 的获批报道也重复称这是机器人支气管镜领域的首创属性。同一批材料将
              Galaxy 定位为 集成成像栈，而非仅用于导航的平台：2023 年最初公告介绍了集成断层合成和增强荧光透视，2026 年 MATCH II 报道诊断产出率和 DT 到 CBCT 的一致性 分别为 96.7% 和
              96.7%，2026 年 Galaxy II 发布时则将 HD-DT 描述为低辐射默认 模式，需要升级病例时再使用 CBCT。这一组合让 Noah 最好的竞争叙事不在于声称生态最广，而在于减少导航、确认、
              清洁和手术室后勤之间的交接。


              这些特点也界定了替代方案。可重复使用的支气管镜工作流仍然可行，因为它不需要新增机器人资本采购；但留存 证据也将其与 FDA 公开指出的再处理负担和感染控制权衡联系起来。外部 CBCT
              工作流仍可作为高置信度确认基准， 但 Noah 明确试图把这一基准吸收到单一平台中，让医院不必每例都拼装更大的混合方案。实际含义是，当手术效率、 手术室占地和再处理负担足以抵消沿用成熟工作流的安全感时，Noah
              才可能胜出。
            claimRefs:
              - CP002
              - CP003
              - CP004
