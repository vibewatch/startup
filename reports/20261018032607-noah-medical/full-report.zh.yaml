      - number: '4.2'
        title: 手术量牵引力不等于收入披露
        blocks:
          - type: paragraph
            body: >-
              Noah 报告称，截至 2025 年 3 月 24 日，Galaxy 在美国完成 5,000 例手术，这说明系统已超出初始发布阶段并产生
              手术活动。但公司没有披露装机数量、活跃账户、每台活跃系统的手术量、每例耗用的产品数量、确认收入或回款时间。 当前公开资料也没有平台、一次性耗材或 Galaxy II
              的标价、实际平均售价、租赁费率、最低承诺、折扣表或合同期限。 因此，手术里程碑能支持商业活动判断，却不能支持 ARR、收入、使用率、客户数或回本期计算。投资判断需要在合同
              把装机量、活跃系统、手术量、一次性耗材发货、开票和现金回款逐一对上。
            claimRefs:
