              当前留存来源没有披露 Noah 的收入、ARR、毛利率、现金余额、烧钱速度、资金续航、债务、租赁义务、营运资金
              需求或资本开支计划。历史融资额不等于今天可用的现金，因此不能替代当前资产负债表和月度现金桥接表。在收入 质量尚未明确前，产品模式也可能带来显著现金需求：系统制造和部署、一次性库存、现场服务、软件开发、监管整改
