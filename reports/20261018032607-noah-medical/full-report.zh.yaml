              - CR011
      - number: '7.4'
        title: 依赖关系、止损标准与尽调请求
        blocks:
          - type: paragraph
            body: >-
              即使在这组受限来源中，依赖模式也清晰可见。Noah 的牵引力证据真实，但集中度高：公司控制的里程碑称截至 2025 年 3 月美国手术量为 5,000 例、截至 2026 年 9 月超过 16,000
              例；Long Island Jewish Medical Center、 City of Hope Cancer Center Atlanta 和 Prince of Wales Hospital
              等知名拥护者与站点支撑了叙事的大部分。 MTEC 的资料还暗示存在培训和研究支持层，这可能帮助采用，但如果部署仍高度依赖服务，也会拖慢规模化。因此， 实际止损标准是可监测的：FDA
              质量问题重现或升级、无法证明站点层面的报销贡献利润为正，或扩张仍卡在少数 参考中心，任何一项都会显著削弱投资案例。在判断是否投入新资金前，尽调应要求直接的质量整改证据、按手术场景
              划分的经济性，以及董事会当前对现金续航和供应韧性的判断。
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 判断新一轮融资前的止损标准
            body: 在 Noah 提供直接的 FDA 整改证据、站点层面的报销贡献利润和董事会当前对现金续航及供应韧性的判断前， 不要按更干净的风险状况做投资判断；没有这些材料，表面的手术量势头仍可能掩盖脆弱的运营模式。
            calloutType: risk
            claimRefs:
