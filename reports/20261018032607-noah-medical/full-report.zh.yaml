        - 只有在收入规模得到核实、监管后续处理清晰后，相对 2023 年 B 轮才足以支持上行融资轮。
        - 利用率无法复制，或整改重新开启。
        - 需要商业队列和融资需求的直接证明。
      - - 基准
        - 临床差异化仍然真实，但收入质量和股权结构表条款仍属非公开信息。
        - 只支持尽调后的谨慎重新接触和纪律化定价，而不是立即认可估值。
        - 财务不透明和中等程度的监管摩擦持续。
        - 在管理层开放数据室前，这是最可能的情景。
      - - 悲观
        - CAPA/MDR 整改、诉讼或商业化执行延误下一次融资。
        - 增加平轮或下轮定价以及投资者保护性结构的风险。
