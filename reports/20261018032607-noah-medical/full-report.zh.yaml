chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业定位
        blocks:
          - type: paragraph
            body: >-
              Noah Medical 将自己定位为专注于更早诊断和治疗的医疗机器人公司，Galaxy 是其机器人辅助支气管镜平台。独立 行业报道印证了这一产品类别，并称其于 2023 年 3 月获得 FDA
              批准。商业架构将可重复使用的设备平台与一次性 支气管镜及配件结合，意味着收入可能来自设备和持续性耗材，但定价和收入结构均未公开。Galaxy II 于 2026 年 8 月推出，软件支持 HD-DT 和 CBCT
              成像。公司 2026 年 9 月发布公告称，该平台在美国已完成超过 16,000 例手术， 并进入香港商业应用；这些规模数字仍是公司口径，而非经过审计的客户或收入指标。公开描述还同时使用 San Carlos 和
              San Jose 作为公司所在地，因此当前总部和法定注册地仍需确认。
