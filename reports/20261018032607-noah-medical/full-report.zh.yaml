  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业压力集中在 Ion；其他多数替代方案都是工作流替代
        blocks:
          - type: paragraph
            body: >-
              留存证据没有显示一批已经规模化的机器人支气管镜竞争者，反而呈现出两条赛道。Noah 从 2023 年 FDA 获批， 发展到 2025 年 3 月完成 5,000 例美国手术，并在 2026 年 9
              月由公司声称美国手术量超过 16,000 例；这足以 证明真实商业牵引力，却不足以匹敌行业龙头的公开规模。Intuitive 自己披露的 2026 年第一季度数据称， Ion 季度手术量为 43,000
              例、季度装机 52 台；MarketChameleon 汇总的装机基数为 1,041 台。因此，商业权重 最清晰的直接同业是 Ion，而不是一群彼此分散的类似初创公司。


              这很重要，因为资料中出现的其他替代方案更像是不购买 Noah 也能解决同一临床任务的路径，而不是另一家已被 证明规模化的机器人厂商。Noah 自己 2023 年和 2026
              年的材料反复将基准设为现有支气管镜技术、内置成像与 外部成像的选择，以及拥挤支气管镜室中的工作流负担。换言之，买方比较的不只是 Noah 和一台机器人，还包括 继续使用可重复镜体工作流、保留锥形束 CT
              作为确认层，或在院内拼装保留现有运营模式的混合手术室工作流。
