      - number: '7.3'
        title: 运营模式、报销与财务脆弱性
        blocks:
          - type: paragraph
            body: >-
              Noah 的运营模式带有典型的医疗科技权衡。一次性支气管镜架构和紧凑工作流能有效缓解污染、再处理负担和手术室 周转问题，但同样的选择也可能把风险转向一次性耗材供应、毛利率纪律和医院贡献利润计算。本次更新留存的公开
              报销指南从侧面说明了这一点：支气管镜计费高度捆绑，导航属于附加项，先进支气管镜的最高价值经济性来自记录 完整的代码组合，而不只是基础镜体。Noah 仍需证明，工作流效率加诊断表现能够稳定抵消资本、一次性
              耗材和收入周期摩擦。公开记录对这一故事背后的财务后盾最薄弱，因为资料呈现了产品里程碑和融资历史，却没有 披露收入、利润率、烧钱、现金或资金续航。
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
