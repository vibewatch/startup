        - 2024 年报道显示，18 名患者的 FRONTIER 研究中导航率为 100%，器械进入病灶率也为 100%；多份来源描述了一次性流程优势。
        - 经核实的多站点利用率和经常性耗材经济性会增强信心。
      - - 正论：真实的商业化势头
        - Noah 于 2026 年 9 月称，该平台已支持超过 16,000 例美国手术，并在亚洲完成首例商业手术。
        - 直接的医院队列数据若显示业务已超出早期参考站点扩张，将提升投资判断的信心。
      - - 反论：监管拖累可能压低倍数
        - MassDevice 称，2025 年 4 月的 FDA 警告信仍在等待后续处理，并指出 CAPA 和 MDR 缺陷。
