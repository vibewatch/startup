  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Noah Medical 的可服务市场不是广义的“肺癌”，也不只是上游 LDCT 筛查市场。产品处在可疑肺部病灶的下游诊断
              工作流中，尤其针对用传统支气管镜或割裂的导航加成像方案难以准确活检的周围型病灶。因此，相关支出包括 机器人支气管镜设备和软件、一次性支气管镜及配件，以及集成成像带来的工作流价值；不包括筛查扫描本身、
              无关的肿瘤治疗和更广义的胸外科预算。漏斗顶部仍受筛查渗透率限制：CDC 称只有约 18% 符合建议的美国成年人 接受过筛查，因此市场增长既取决于更多患者接受筛查，也取决于发现病灶后的诊断转化率提高。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM011
              - CM013
              - CM015
      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              用户是介入肺病或支气管镜团队，但经济买方是医院肺结节项目或业务线负责人，他们需要为场地、资本、人员时间 和吞吐量提供理由。现有资料一贯将采用描述为社区医院扩张故事，而不是纯粹的学术中心故事：更小的占地、
              一次性镜体和集成成像被定位为降低再处理负担、拥挤手术室摩擦和额外 CBCT 投资的手段。这一点很重要， 因为社区机构的手术室利用率和人员配置经济性比旗舰中心更紧。支付覆盖也会影响采用路径：CDC 称多数保险
              计划和 Medicare 会帮助支付推荐筛查，但异常后的复查仍可能带来患者共付和医院工作流摩擦，拖慢从临床兴趣 到项目规模化手术量的转化。
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
