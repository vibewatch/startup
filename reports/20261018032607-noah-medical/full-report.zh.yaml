        - label: 医院自建混合套间
          x: 2
          'y': 2
          detail: 内部建设可以组合支气管镜、影像和灭菌资产，但保留资料没有显示统一的供应商方案
    approximationNotes: 序数评分概括保留证据所反映的规模和工作流集成程度；它们不是市场份额估算，也不是推导出的转化率。
