      - [Single-use bronchoscope and accessories, null, null, null, "Disposable model described; units per case and price unavailable"]
      - [Galaxy II software, null, null, null, "Commercial launch described; paid, bundled, or included status unavailable"]
    notes: "Null means the retained successful public sources did not disclose the field; it does not mean zero price or no contract."
    claimRefs: [CI001, CI004, CI007, CI015]
  - id: TI003
    title: Unit-economics evidence and comparator signals
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Galaxy cumulative U.S. procedures", "5,000 by 2025-03-24 (company-claimed)", Medium, "Shows activity, not revenue or utilization", "Reconcile monthly procedures to active systems, customers, invoices, and cash"]
      - ["Noah revenue, gross margin, burn, and runway", null, Medium, "Core underwriting outputs are unavailable", "Provide audited statements and a monthly cash bridge"]
      - ["Scope reprocessing burden", "Company says single-use design removes it", Medium, "May affect customer workflow value and disposable economics", "Provide independent time-and-cost study plus customer procurement analysis"]
      - ["Intuitive 2025 instruments and accessories benchmark", "$6.02B preliminary revenue; 19% growth", Medium, "Shows how procedure-linked revenue can scale for a mature comparator", "Do not apply to Noah; use only to structure consumables diligence"]
      - ["Intuitive 2025 lease benchmark", "872 leased systems, including 496 usage-based arrangements", Medium, "Shows that capital equipment can use multiple contract structures", "Determine whether Noah sells, leases, or prices by usage"]
      - ["Quality-remediation financial exposure", null, Medium, "CAPA and reporting deficiencies could create remediation or service costs", "Quantify remediation spend, warranty reserves, lost cases, and customer credits"]
    notes: "Intuitive figures are unaudited preliminary 2025 comparator data and are not estimates of Noah's economics; null means no quantified Noah value was found."
    claimRefs: [CI003, CI005, CI008, CI009, CI010, CI011, CI012, CI013]
