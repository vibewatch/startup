      severity: material
      topic: pricing-gap
      missingEvidence: "Customer contracts, invoices, price lists, discounts, lease terms, software entitlements, and realized ASP by component."
      whyItMatters: "Without realized commercial terms, procedure activity cannot be translated into revenue quality or gross profit."
      diligencePath: "Sample at least ten customer contracts and reconcile ordered, shipped, invoiced, collected, and deferred amounts by revenue stream."
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: "Sales cycle, pipeline conversion, CAC, sales compensation, implementation cost, channel fees, churn, and payback by customer cohort."
      whyItMatters: "Commercial traction may consume substantial capital if deployment and support costs exceed contribution margin."
      diligencePath: "Review CRM cohort exports, bookings-to-cash timing, sales headcount cost, lost-deal reasons, and channel agreements."
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: "Audited revenue and margins, current cash, monthly burn, working capital, capex, debt, lease obligations, runway, and next-round trigger."
      whyItMatters: "Funding raised is not cash available, and forward financing dependency cannot be assessed without obligations and downside burn."
      diligencePath: "Obtain audited financials, latest management accounts, a 24-month cash forecast, bank statements, debt documents, and board-approved financing plan."
      relatedQuestionRefs: [QI006, QI010]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: disposable-economics
      missingEvidence: "Independent current comparison of Galaxy single-use scope cost, staffing time, reprocessing avoidance, waste, and infection-control economics."
      whyItMatters: "Company workflow claims do not establish hospital savings or Noah's consumable contribution margin."
      diligencePath: "Commission a site-level time-and-motion and total-cost study across representative Galaxy and reusable-scope programs."
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI003]
