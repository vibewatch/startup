callouts:
  - calloutType: risk
    title: Financial opacity is the gating issue
    body: "No retained source provides Noah's revenue, margin, burn, cash, runway, or debt. Procedure traction cannot replace these inputs, and historical funding cannot be treated as cash on hand."
    claimRefs: [CI003, CI008, CI016]
  - calloutType: insight
    title: Separate placements, utilization, and procedure-linked revenue
    body: "The Intuitive comparator shows that system placements, lease structure, procedure growth, and instruments revenue are distinct metrics. Noah must provide the same bridge before activity can be translated into revenue quality."
    claimRefs: [CI010, CI011, CI012, CI013]
