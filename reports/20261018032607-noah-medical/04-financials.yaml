artifact: financials
slug: noah-medical
runDate: 2026-10-18
company:
  name: Noah Medical
chapter:
  number: 4
  title: Financials
  summary: >-
    Noah Medical shows meaningful procedure activity and a product architecture that could support
    capital-system, disposable, and software economics, but public evidence does not disclose price,
    revenue, gross margin, cash burn, runway, or debt. The financial case therefore remains
    ununderwritable without customer contracts, cohort utilization, segment margins, and a current
    cash-and-obligations schedule.
sections:
  - id: revenue-architecture
    title: Revenue architecture is plausible but not disclosed
    body: >-
      Galaxy combines a robotic bronchoscopy platform, a single-use bronchoscope and accessories,
      and commercially launched Galaxy II software. That product structure creates three plausible
      monetization layers: system access, per-procedure consumables, and software or service value.
      The retained evidence, however, does not establish that Noah charges separately for each
      layer, whether systems are sold or leased, how software is entitled, or whether service and
      training carry recurring fees. Galaxy II is marketed as adding capability without added
      capital, which may strengthen the installed system's value but does not prove incremental
      software revenue. The revenue bridge is therefore a diligence framework rather than a
      forecast, and no public product activity should be converted into revenue without contract
      terms and realized pricing.
    claimRefs: [CI001, CI002, CI004, CI006, CI007, CI014, CI015, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-pricing
    title: Procedure traction is not a revenue disclosure
    body: >-
      Noah reported 5,000 U.S. Galaxy procedures by March 24, 2025, evidence that the system had
      moved beyond initial launch and generated procedure activity. It does not disclose the number
      of installed systems, active accounts, procedures per active system, units consumed per case,
      recognized revenue, or collection timing. The current public surfaces also provide no list
      price, realized average selling price, lease rate, minimum commitment, discount schedule, or
      contract duration for the platform, disposables, or Galaxy II. Consequently, the procedure
      milestone can support a commercial-activity conclusion but cannot support ARR, revenue,
      utilization, customer-count, or payback calculations. Underwriting requires contract-level
      reconciliation from placements to active systems, procedures, disposable shipments, invoicing,
      and cash collection.
    claimRefs: [CI003, CI007, CI015]
    tableRefs: [TI002]
  - id: unit-economics-and-cost-risk
    title: Consumables may recur, while cost and quality exposure remain unknown
    body: >-
      Noah's single-use bronchoscope and accessories create a logical per-procedure consumption
      mechanism, and the company says disposability removes reprocessing burden and supports faster
      turnaround. Those claims do not reveal the disposable bill of materials, transfer price,
      scrap rate, warranty reserve, logistics cost, or hospital-level cost comparison. Intuitive's
      preliminary 2025 results illustrate why placements and procedures must be separated: its Ion
      placements declined while Ion procedures grew, and its broader instruments-and-accessories
      revenue tracked procedure growth. This is a business-model benchmark, not a Noah estimate.
      Separately, MassDevice's account of FDA warning-letter deficiencies raises possible remediation,
      service, warranty, and adoption costs, but no retained source quantifies their financial impact.
    claimRefs: [CI004, CI005, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy cannot be underwritten from funding headlines
    body: >-
      The retained current sources disclose no Noah revenue, ARR, gross margin, cash balance, burn
      rate, runway, debt, lease obligations, working-capital requirement, or capital-expenditure
      plan. Financing raised historically would not equal cash available today, so it is not a
      substitute for a current balance sheet and monthly cash bridge. The product model also creates
      potentially material cash demands before revenue quality is known: system manufacturing and
      deployment, disposable inventory, field service, software development, regulatory remediation,
      and customer support. The financial verdict is therefore evidence of commercial activity but
      insufficient evidence of durable revenue quality, margin expansion, or financing independence.
      Investment underwriting should wait for audited statements, monthly operating metrics, debt
      documents, and downside runway scenarios tied to deployment and utilization.
    claimRefs: [CI003, CI008, CI009, CI016]
