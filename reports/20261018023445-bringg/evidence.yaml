evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: A current board roster, committee structure, and broader executive-bench disclosure.
    whyItMatters: Governance depth, independence, and succession risk cannot be underwritten from the retained public pool.
    diligencePath: Request the board list, committee charters, and an org chart covering the top executive team.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-financial-profile
    missingEvidence: Current ARR or revenue run-rate, growth, gross margin, burn, runway, and churn or retention metrics.
    whyItMatters: These are the core inputs required to judge whether the 2021 unicorn mark remains defensible today.
    diligencePath: Request monthly recurring revenue waterfalls, audited or management financials, and cohort retention reporting.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Any post-2021 financing, debt facilities, secondary sales, liquidation preferences, and current investor roster.
    whyItMatters: Cap-table seniority and fresh financing terms can change both valuation and downside protection materially.
    diligencePath: Request the current cap table, financing documents, debt schedules, and any secondary transaction history.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      An independent bottom-up or segmented market model isolating last-mile orchestration software spend by geography,
      segment, and buyer type.
    whyItMatters: Without it, valuation work has to rely on demand and crowding proxies instead of a defendable SAM and SOM.
    diligencePath: >-
      Obtain current analyst market models or management pipeline segmentation that separates orchestration software
      from broader logistics-tech categories.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: ecosystem-scale
    missingEvidence: >-
      A reconciled definition showing whether public counts for carriers and delivery providers refer to the same
      partner population.
    whyItMatters: >-
      Network breadth is part of Bringg's marketability, but inconsistent denominators can overstate or understate true
      partner coverage.
    diligencePath: >-
      Request a current partner taxonomy from Bringg that maps active integrated carriers, delivery providers, and
      geographic coverage on a like-for-like basis.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Segment-level win rates, ACV, module attach, and named budget-owner patterns by retailer, logistics provider, and
      omnichannel customer type.
    whyItMatters: >-
      Those data determine whether Bringg's strongest demand comes from a scalable core buyer segment or from bespoke
      enterprise deployments.
    diligencePath: >-
      Review cohort-level pipeline data, customer references, and pricing / packaging by segment during management
      diligence.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent-peer-benchmark
    missingEvidence: >-
      An independent, like-for-like benchmark covering Bringg, FarEye, Locus, and other enterprise suites on pricing,
      deployment effort, trust controls, and customer outcomes.
    whyItMatters: >-
      Without neutral benchmarking, the retained pool leans on company and competitor framing for several peer
      comparisons.
    diligencePath: >-
      Obtain analyst evaluations, RFP scorecards, or customer reference calls that compare the same vendors on the same
      enterprise requirements.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-implementation
    missingEvidence: >-
      Recent Bringg proposals or customer references showing actual module pricing, implementation fees, discounting,
      support SLAs, and deployment timelines.
    whyItMatters: >-
      Bringg's underwriting case depends on whether workflow breadth offsets the cost and complexity of enterprise
      deployment.
    diligencePath: >-
      Request a current Bringg quote with module breakout plus buyer references that can confirm time-to-live and
      post-implementation operating burden.
    relatedQuestionRefs:
      - QP004
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Latest ARR, GRR, NRR, churn, and software-versus-services revenue mix.
    whyItMatters: >-
      These are the core inputs needed to judge revenue quality, expansion durability, and whether the 2021 valuation
      frame still has support.
    diligencePath: >-
      Request board or lender reporting packs with trailing twelve month ARR bridges, cohort retention, and segment
      revenue mix.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, covenants, and any ongoing fundraising process.
    whyItMatters: >-
      Historical funding alone does not establish capital adequacy, refinancing risk, or whether Bringg can sustain
      product and go-to-market investment.
    diligencePath: >-
      Request the latest cash-flow statement, debt schedule, covenant package, and current financing plan from
      management.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, discounting, contract minimums, and module attach rates.
    whyItMatters: >-
      Quote-based selling can hide wide variation in ACV, gross margin, and implementation recovery across customer
      cohorts.
    diligencePath: Review live order forms, SKU catalogs, and recent signed MSAs with booked ARR and discount waterfalls.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: implementation-burden
    missingEvidence: Median implementation time, services staffing ratios, time-to-go-live, and gross margin on onboarding work.
    whyItMatters: >-
      Deployment friction affects CAC payback, delayed revenue recognition, and the path to software-like contribution
      margins.
    diligencePath: Request implementation project plans, time-to-live dashboards, and services P&Ls by cohort or customer segment.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: concentration-and-retention
    missingEvidence: Customer concentration, logo churn, dollar retention, and cohort expansion by retailer or logistics segment.
    whyItMatters: >-
      High delivery volume and named logos do not prove durable account economics if a few customers dominate ARR or
      expansion has slowed.
    diligencePath: Request account concentration tables, cohort retention reports, and churn reasons for the last eight quarters.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: >-
      Independent uptime history, SLA attainment, incident records, or benchmarked performance for Bringg production
      deployments.
    whyItMatters: >-
      Without non-vendor reliability evidence, the platform's operational resilience cannot be separated from
      architecture marketing or case-study curation.
    diligencePath: >-
      Request status-history exports, SLA reports, incident postmortems, and at least two customer references discussing
      uptime and exception handling in production.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: developer-signal-gap
    missingEvidence: >-
      Public developer or practitioner-community evidence such as active API changelogs, code samples, integration forum
      activity, package telemetry, or implementation partner engineering materials.
    whyItMatters: >-
      A platform that depends on integrations is less defensible if external builders and integrators are not visibly
      engaged or cannot self-serve technical adoption.
    diligencePath: >-
      Request private API/docs access, integrator enablement materials, change logs, and customer engineering references
      that show active external implementation usage.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: implementation-risk
    missingEvidence: >-
      Module-by-module implementation timelines, services burden, and time-to-value benchmarks segmented by own-fleet
      versus Delivery Hub deployments.
    whyItMatters: >-
      Independent sources imply complexity, so underwriting product maturity requires knowing whether deployment
      friction is a temporary onboarding tax or a structural adoption drag.
    diligencePath: >-
      Ask management for recent implementation project plans, average go-live timelines, services attach rates, and a
      sample of delayed or failed rollouts.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: stale
    severity: material
    topic: customer-count-freshness
    missingEvidence: A 2025-2026 disclosure of total customers, net new customers, active accounts, or active locations.
    whyItMatters: >-
      The latest public customer-count figure in the retained pool is from 2023, so current scale and growth velocity
      are not verifiable at refresh time.
    diligencePath: >-
      Request the latest board deck or KPI pack showing customer count, net adds, and any split between live enterprise
      accounts and pilots.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo churn, renewal rates, average contract term, and top-customer revenue concentration.
    whyItMatters: >-
      These are the core durability metrics needed to judge whether Bringg's logo base converts into sticky, expanding,
      and diversified revenue.
    diligencePath: >-
      Obtain cohort retention tables, renewal dashboards, and a customer concentration schedule from management or the
      data room.
    relatedQuestionRefs:
      - QU004
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: >-
      A fuller roster of named production customers with deployment status, geography, module scope, go-live date, and
      outcome evidence.
    whyItMatters: >-
      Best Buy proves one scaled deployment, but the rest of the visible customer list is mostly logo-level proof and
      does not establish how repeatable that success is across the base.
    diligencePath: >-
      Ask management for a named top-customer list with production versus pilot status, contract start dates, renewal
      history, and reference-call availability.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-incident-gap
    missingEvidence: >-
      Current DPA and subprocessors, SOC 2 report, penetration-test findings, incident history, litigation summary,
      enforcement record, and any license or labor analysis for material deployment jurisdictions.
    whyItMatters: >-
      Public control descriptions cannot establish operating effectiveness, claim history, or compliance across Bringg's
      customer geographies.
    diligencePath: >-
      Request the security and legal diligence rooms, then reconcile all open findings and matters with counsel,
      auditors, and representative customers.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-and-concentration-gap
    missingEvidence: >-
      Current ARR, gross margin, burn, cash runway, retention, top-customer share, carrier volume concentration, and
      partner-related revenue exposure.
    whyItMatters: >-
      These quantities determine whether Bringg can absorb outages, implementation overruns, customer losses, or carrier
      disruption.
    diligencePath: >-
      Review current board reporting, audited or management financials, customer cohorts, and customer and carrier
      concentration schedules.
    relatedQuestionRefs:
      - QR007
      - QR008
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      A complete jurisdiction-by-jurisdiction inventory of privacy, security, delivery-notification, licensing, labor,
      and proof-of-delivery obligations.
    whyItMatters: >-
      The public pool identifies exposure surfaces but cannot demonstrate legal coverage across every geography in which
      customers operate.
    diligencePath: >-
      Have counsel map requirements to material customer deployments and compare them with Bringg's contracts, controls,
      and incident procedures.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: software-economics
    missingEvidence: Current ARR, net retention, gross margin, burn, runway, and cash balance.
    whyItMatters: >-
      These metrics are required to determine whether the 2021 $1B mark is still supportable and whether downside is
      protected.
    diligencePath: >-
      Obtain the latest board deck or QoE package with ARR bridge, cohort retention, margin waterfall, burn, and
      liquidity runway.
    relatedQuestionRefs:
      - QV003
      - QV007
      - QV008
  - type: missing-source
    severity: material
    topic: cap-table-terms
    missingEvidence: Post-2021 financing history, liquidation preferences, dilution, option pool size, and any secondary pricing.
    whyItMatters: >-
      Entry discipline depends on where common-equity value sits beneath preferred stacks and on whether a new round
      would clear above or below the last mark.
    diligencePath: >-
      Review the current cap table, charter, financing documents, and any recent secondary transactions before setting
      return assumptions.
    relatedQuestionRefs:
      - QV008
      - QV009
  - type: missing-source
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, logo churn, cohort retention, and implementation payback by segment.
    whyItMatters: >-
      The bear case depends less on whether Bringg has customers and more on whether those customers expand profitably
      and stay through long enterprise implementations.
    diligencePath: >-
      Request top-20 customer concentration, GRR/NRR by cohort, implementation timelines, and win-loss analysis versus
      current alternatives.
    relatedQuestionRefs:
      - QV005
      - QV007
      - QV008
      - QV009
