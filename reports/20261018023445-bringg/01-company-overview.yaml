schemaVersion: report-v2
artifact: company-overview
slug: bringg
runDate: 2026-10-18
company:
  name: Bringg
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Bringg presents as an enterprise last-mile orchestration platform with multi-fleet
    workflow depth, a broad carrier network, and third-party evidence of meaningful
    customer scale. Public evidence in the assigned pool supports its 2013 founding,
    Tel Aviv base, founder-CEO continuity, and $184.5M raised through a $1B June 2021
    Series E, but current ARR, post-2021 financing status, and governance depth remain
    materially under-disclosed.
sections:
  - id: identity-and-scale
    title: Identity, product scope, and operating footprint
    body: >-
      Bringg consistently describes itself as a last-mile delivery orchestration and
      fulfillment platform for retailers, logistics providers, and large enterprises.
      Across its homepage, platform page, and third-party directory coverage, the
      company is positioned around centralized planning, routing, dispatch, driver
      management, customer communications, and orchestration across owned, third-party,
      and hybrid fleets rather than around a narrow point product. The retained sources
      also support meaningful ecosystem breadth: Bringg's official site says its network
      spans 250+ carrier solutions across 70+ countries, while independent directory
      coverage ties that network claim to 800+ customers and more than 200 million
      annual deliveries. Those scale signals are directionally positive, but they are
      still mostly company-originated claims echoed by third parties rather than audited
      operating disclosures.
    claimRefs: [CO001, CO002, CO004, CO007, CO013, CO015, CO016, CO017]
    tableRefs: [TO001]
  - id: leadership-capital-and-stakeholders
    title: Leadership, capitalization, and stakeholder visibility
    body: >-
      The strongest leadership fact in the retained pool is founder continuity: Latka
      says Guy Bloch founded Bringg in 2013 and still runs it as CEO. Beyond that,
      governance visibility is thin. The assigned official pages focus on product,
      workflows, integrations, and customer-facing benefits, not on a current board
      roster, committee structure, or a broader executive bench, which leaves a real
      diligence gap around succession and oversight. Capitalization is easier to anchor:
      Latka reports $184.5M raised across seven rounds since 2013, including a $100M
      Series E in June 2021, when investors valued Bringg at $1B. That establishes the last public mark,
      but not the present cap table, preference stack, debt position, or whether Bringg
      has raised fresh capital since 2021.
    claimRefs: [CO005, CO006, CO010, CO011, CO012, CO014]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-diligence
    title: Milestones, public operating evidence, and remaining diligence gaps
    body: >-
      The milestone trail in retained evidence shows a business that progressed from a
      2013 founding through seven disclosed venture rounds into a June 2021 unicorn
      valuation. Later public signals are operating datapoints rather than liquidity or
      financing events: a November 2025 headcount reading of 204 employees suggests a
      still-material operating footprint, and Gappsy refreshed its company profile in
      August 2026. Even so, current underwriting-critical metrics remain opaque. The
      strongest adverse evidence in the pool is not a legal or regulatory event but an
      execution and transparency signal: Gappsy flags quote-only
      pricing, likely longer implementation than simpler tools, and limited public
      self-serve documentation visibility. Those criticisms, plus the lack of current
      ARR, churn, burn, and governance detail, make this chapter a foundation with
      explicit gaps rather than a complete underwrite.
    claimRefs: [CO006, CO008, CO009, CO010, CO011, CO012, CO014, CO015]
    figureRefs: [FO001]
