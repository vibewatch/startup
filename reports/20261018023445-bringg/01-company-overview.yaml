      - [Business model, "Enterprise quote-based last-mile orchestration software", "2026-08-06", medium, "Public pricing tiers and contract structure are not disclosed."]
      - [Last publicly disclosed stage, "Series E", "2021-06", medium, "This is the latest financing stage in the retained pool, not proof that no later financing occurred."]
      - [Carrier network, "250+ carrier solutions across 70+ countries", "Current official homepage", medium, "Official materials support breadth, but carrier count definitions may vary by page and over time."]
