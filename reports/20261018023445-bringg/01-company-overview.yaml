      - ["Current board / executive bench", "Not surfaced clearly in retained public evidence", "Assigned official pages and third-party profiles do not provide a current board roster or broader named leadership bench.", "Governance, succession, and independent oversight cannot be assessed cleanly from retained evidence.", "High: lack of named bench depth increases diligence dependence on management materials."]
    notes: >-
      Partial public enumeration only; row two is an explicit governance-visibility gap,
      not a claim that no broader leadership team exists.
    enumerationScope:
      coverage: partial
      basis: >-
        Public leadership visibility from the assigned official pages, help center, and
        retained third-party company profiles as of 2026-10-18.
    claimRefs: [CO005, CO006]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
