callouts:
  - calloutType: strength
    title: Multi-fleet orchestration has credible enterprise breadth
    body: >-
      Across official, partner, and directory sources, Bringg consistently shows up as a
      last-mile orchestration layer spanning planning, dispatch, delivery experience, and
      carrier connectivity rather than as a single-point route planner.
    claimRefs: [CO001, CO002, CO016]
  - calloutType: risk
    title: Public transparency is thin where valuation underwriting matters most
    body: >-
      The retained evidence supports the 2021 unicorn mark and basic company profile, but
      current ARR, margins, burn, investor stack, and governance depth remain materially
      opaque, while independent review coverage highlights implementation and transparency
      friction.
    claimRefs: [CO006, CO008, CO009, CO010, CO012, CO014]
