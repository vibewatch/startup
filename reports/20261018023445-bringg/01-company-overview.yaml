      - ["Employees", "Execution capacity across product, implementation, support, and carrier onboarding", "Latka's 204-employee reading implies material operating scale but not current functional mix.", "Request by-function headcount, attrition, and post-2025 hiring or reductions."]
      - ["Investors", "Capital providers and preference-stack holders", "Bringg has raised $184.5M and last disclosed a $1B Series E mark, but current lead investors and preferences are not visible here.", "Request current cap table, investor roster, preference stack, and any debt or secondary transactions."]
      - ["Enterprise customers", "Revenue base and proof-point set", "Bringg cites 800+ customers and 200M+ annual deliveries, but concentration, expansion, and churn are undisclosed.", "Request top-10 ARR concentration, logo churn, NRR, and implementation timelines."]
      - ["Carrier / systems partners", "Extend network reach and integration depth", "Official and partner sources point to 250+ carrier solutions across 70+ countries and named SAP ecosystem participation.", "Request active-partner mix, onboarding SLAs, partner-dependent revenue share, and critical integrations."]
    notes: >-
      Partial map built from retained public evidence; investor names and exact economics
