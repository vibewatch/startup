      - [Annual delivery volume, ">200 million deliveries annually", "2026-08-06", medium, "Scale figure is echoed by a third-party review and remains unaudited in the retained pool."]
      - [Revenue / ARR, "No official public figure; Latka estimates about $40.8M annual revenue", "Dec 2024 estimate", low, "Current ARR, growth, margins, burn, and runway remain undisclosed."]
      - [Headcount, "204 employees", "2025-11", medium, "Headcount is a dated third-party reading rather than a current company disclosure."]
      - [Total raised, "$184.5M across seven rounds", "Latest round Jun 2021", medium, "No retained public source confirms post-2021 financing activity or absence of it."]
      - [Last public valuation, "$1B Series E valuation", "2021-06", medium, "No newer valuation, secondary, or debt context is visible in the assigned pool."]
    notes: >-
      Mixes official pages with third-party profile and database coverage; low-confidence
      revenue is an external estimate, and missing current private-company metrics are
      shown explicitly rather than imputed.
    claimRefs: [CO001, CO004, CO007, CO008, CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017]
