          tone: positive
        - date: 2017-03
          label: Series B 扩张
          detail: Latka 列出 2017 年 3 月 $10M 的 Series B。
          tone: positive
        - date: 2018-01
          label: 追加 Series B 融资
          detail: Latka 列出 2018 年 1 月 $12M 的 Series B。
          tone: positive
        - date: 2019-01
          label: Series C 轮
          detail: Latka 列出 2019 年 1 月 $25M 的 Series C。
          tone: positive
        - date: 2020-04
          label: Series D 轮
          detail: Latka 列出 2020 年 4 月 $30M 的 Series D。
          tone: positive
        - date: 2021-06
          label: 独角兽估值下的 Series E
