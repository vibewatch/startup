      - number: '2.3'
        title: 买方、采用驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              工作流证据显示，经济买方通常是配送或物流运营负责人，有时还包括采购或全渠道运营，而不是泛营销负责人或门店负责人。产品文档中的控制点包括承运商报价、配送条款、费率卡、路线规划、自动调度、SLA
              管理和异常处理，这些都属于运营预算决策。采用驱动因素很直接：平台承诺降低成本、改善 ETA 表现、提升品牌化客户体验，并协调复杂的混合或外包车队网络。同一批证据也暴露出该品类的主要约束。Bringg
              自己的调查称，超过一半的受访者未达到成本、满意度或 ETA 目标；AI 采用仍集中在路线和可视化，而不是异常处理、承运商管理和账单核对。这说明预算意愿确实存在，但部署复杂度和流程变更仍会拖慢价值兑现。
