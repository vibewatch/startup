  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              指定证据所指向的市场边界以最后一公里配送编排为核心，而不是泛供应链软件。Bringg
              的文档将价值层定义为从仓库或履约中心到最终客户的最后环节，并描述了路线规划、承运商选择、调度、司机执行、品牌化追踪和交付证明等工作流控制点。同一批材料显示，Bringg 接入 OMS、ERP、电子商务、WMS 和
              TMS 系统，而不是取代它们；因此，相关市场比端到端物流套件窄，却比单车队调度工具宽。Gartner 的产品描述也独立强化了这一定位，称 Bringg
              将内部和外部配送能力下的最后一公里配送、履约和退货统一起来。实际替代方案包括内部调度流程、直接管理承运商，以及只解决单个车队或单层沟通、无法协调整个网络的点工具。
