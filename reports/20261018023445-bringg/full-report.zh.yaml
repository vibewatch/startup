              MFA、SSO 集成、SOC 2 合规和 webhook 恢复控制，Third Fin 另行描述了广泛的安全态势。这些是相关缓释措施，但不是运营有效性的证明。指定资料中没有
              DPA、审计报告、诉讼记录、执法决定或事故历史，因此无法估计概率；不能把没有引用到某一事项理解为该事项不存在。
