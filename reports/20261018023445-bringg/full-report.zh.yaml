  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式体现在工作流，而非公开合同
        blocks:
          - type: paragraph
            body: >-
              公开产品材料一贯将 Bringg 描述为面向零售商和物流服务商的企业级编排层，而不是消费市场或承运商本身。工作流覆盖结账时的配送选择、路线规划、调度、司机运营、承运商选择和配送后沟通，这支持一种判断：Bringg
              通过部署在客户履约运营内部的软件变现，而不是按配送 GMV 抽取已披露的分成。不过，公开变现细节很少：Gappsy 称 Bringg 按报价定价，不公布方案或层级；Bringg
              自己的配送文档则聚焦客户如何比较承运商报价并应用自有费率卡，而不是 Bringg 如何按模块或交易收费。
