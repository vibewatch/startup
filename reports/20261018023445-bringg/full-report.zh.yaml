  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开规模和平台广度确实存在，但过时的估值证据和不透明的当前经济性使结论维持在跟踪。
    data:
      nodes:
        - id: scale
          label: 规模证明
          note: 800+ 家客户、覆盖 70+ 个国家、每年 200M 次配送
        - id: platform
          label: 平台广度
          note: 250+ 至 300+ 家服务商及企业集成
        - id: security
          label: 退出准备支持
          note: 官方文档中出现 APIs、SSO、MFA 和 SOC 2
        - id: stale-mark
          label: 过时价格锚点
          note: 资料池最新的明确估值是 2021 年 6 月的 $1B 标记
        - id: opacity
          label: 当前经济性不透明
          note: 没有公开 ARR、利润率、烧钱速度、runway 或开放 KPI 仪表盘
        - id: call
