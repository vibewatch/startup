  - id: FM001
    title: 受证据约束的市场规模视角
    type: pyramid
    summary: 公开证据支持从需求紧迫性、车队复杂度、生态广度和竞争拥挤度分层观察市场，但不足以支撑美元口径的 TAM / SAM / SOM 体系。
    data:
      items:
        - label: 战略紧迫性
          displayValue: 93% of surveyed executives
          note: 将末端配送视为业务中最具战略意义的环节之一。
          tone: positive
          claimRefs:
            - CM008
        - label: 预算支持
          displayValue: 94% expect higher spend
          note: 计划中的支出增长表明需求已有预算支持，而不只是抽象兴趣。
          tone: positive
          claimRefs:
            - CM008
        - label: 多车队复杂度
          displayValue: 82% hybrid or fully third-party fleets
          note: 这一问题往往同时涉及外包运力和内部运力。
          tone: warning
          claimRefs:
            - CM011
        - label: 执行痛点
          displayValue: 64% miss cost targets; 52% CSAT; 51% ETA
          note: 部署之后运营表现仍会失灵，因此需求确实存在。
          tone: risk
          claimRefs:
            - CM009
        - label: 生态广度
          displayValue: 250+ carriers to 300+ delivery providers
          note: 公开来源支持合作伙伴网络的规模，但没有可核对的分母。
          tone: neutral
          claimRefs:
            - CM007
        - label: 品类拥挤度
          displayValue: 1,104 active competitors
          note: Tracxn 的分类法表明市场拥挤，存在许多相邻及直接选项。
          tone: risk
          claimRefs:
            - CM012
    approximationNotes: 指定来源包没有经独立交叉验证的末端配送编排美元口径 TAM / SAM / SOM 模型，因此本图展示有证据支持的需求和可触达性筛选，而不是臆造没有依据的市场价值。
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM011
      - CM012
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数定位仅依据留存证据，对比编排广度与实施负担。
    data:
      xAxis:
        label: 编排广度（1=窄，5=广）
        min: 1
        max: 5
        lowLabel: Point solution / fragmented scope
        highLabel: Multi-fleet orchestration breadth
      yAxis:
        label: 实施负担（1=轻，5=重）
        min: 1
        max: 5
        lowLabel: More self-serve / simpler adoption
        highLabel: Heavier integration / coordination
      points:
        - label: Bringg
          x: 5
          'y': 4
          detail: 官方模块覆盖面广，并内置承运商及集成规则，但企业部署采用询价定价。
          claimRefs:
            - CP001
            - CP004
            - CP005
            - CP007
        - label: FarEye
          x: 4
          'y': 4
          detail: 以广泛的企业编排能力竞争，并凭承运商覆盖和易上手程度挑战 Bringg。
          claimRefs:
            - CP007
            - CP009
        - label: Locus
          x: 4
          'y': 3
          detail: 以单一平台提供路线规划、调度和可视化，而不是拼接多个工具。
          claimRefs:
            - CP006
            - CP010
        - label: Routific
          x: 2
          'y': 2
          detail: 面向中小型本地配送运营商的透明路线规划替代方案。
          claimRefs:
            - CP008
            - CP011
            - CP012
        - label: 内部技术栈
          x: 3
          'y': 5
