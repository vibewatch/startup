  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开来源展示订单活动如何流经 Bringg 的编排技术栈，但公开记录没有披露合同价格或 Bringg 因此获得的毛利润。
    data:
      nodes:
        - id: demand
          label: 购物者选择配送选项
          detail: Bringg 称结账页面可在订单确认前展示配送速度和价格选项。
        - id: orchestration
          label: Bringg 规划并编排配送
          detail: 规划、路线、调度和司机工作流都位于平台核心软件层。
        - id: carrier
          label: 比较承运商与自有车队经济性
          detail: Delivery Hub 可以索取承运商报价并应用费率卡，以找出最便宜或最合适的选项。
        - id: execution
          label: 跨多种车队执行调度和司机任务
          detail: Bringg 通过自动分配和追踪，协调自有、第三方及众包车队。
        - id: experience
          label: 记录客户体验和评分
          detail: 品牌化追踪、预计到达时间和配送后的反馈闭合了整个工作流。
        - id: vendor
          label: Bringg 获得协商确定的软件收入
          detail: 公开证据指向询价式企业软件变现，但公开毛利润数据仍不可得。
      edges:
        - from: demand
          to: orchestration
          label: 订单进入工作流
        - from: orchestration
          to: carrier
          label: 规划并定价选项
        - from: carrier
          to: execution
          label: 选定最合适的承运商或车队
        - from: execution
          to: experience
          label: 配送完成并被追踪
        - from: experience
          to: vendor
          label: 软件价值支撑合同续签
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
  - id: FE001
    title: Bringg 产品架构图
    type: stack
    summary: 公开文档显示，该编排技术栈连接订单系统、规划逻辑、承运商及车队执行，以及面向客户的体验。
    data:
      layers:
        - label: 系统输入
          detail: 企业系统向编排层提供输入。
          modules:
            - label: 商务 / OMS
              detail: 订单接入和履约触发
            - label: ERP / WMS / TMS
              detail: 库存、仓库和运输状态
        - label: 承诺与规划
          detail: 结账承诺、时段安排和路线逻辑决定可行选项。
          modules:
            - label: 配送时段与定价
              detail: 结账时面向消费者提供选项
            - label: 路线优化
              detail: 考虑资源、成本和 SLA 的规划
        - label: 调度控制塔
          detail: 调度员实时监控进度并处理异常。
          modules:
            - label: 实时监控
              detail: 地图、订单进度和告警
            - label: AutoDispatch
              detail: 按需工作流的自动分配
        - label: 承运商 / 车队执行
          detail: Bringg 在自有车队和外部服务商之间进行调配。
          modules:
            - label: Carrier Selector
              detail: 选择最便宜、最快或基于规则的服务商
            - label: 费率卡与配送条款
              detail: 合同逻辑和资格限制
        - label: 司机与消费者体验
          detail: 执行界面闭合配送和反馈环节。
          modules:
            - label: 司机应用
              detail: 任务、配送证明、地理围栏和导航启动
            - label: 客户体验页面
              detail: 品牌化追踪、预计到达时间和评分
        - label: 自动化、分析与安全
          detail: 横向控制和报告管理整个技术栈。
          modules:
            - label: Automation Center & Intelligence
              detail: 无代码工作流、仪表盘和导出
            - label: 安全与连接
              detail: REST APIs、webhooks、SSO、MFA、SOC 2、恢复/重试
    approximationNotes: 分层结构是根据公开产品和帮助文档推断的工作流架构，并非披露的内部服务图。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Bringg 的证据指向一条企业级旅程：从配送承诺控制开始，扩展到调度、执行和更广泛的承运商编排。
    data:
      items:
        - label: 需求塑造与配送承诺
          actor: 买方与数字商务团队
          touchpoints:
            - 结账时的配送选项和定价
            - 动态配送时段和品牌化承诺管理
        - label: 调度与路线规划
          actor: 调度员或运营经理
          touchpoints:
            - 路线规划、资源管理和异常处理
            - 承运商选择和自动调度逻辑
        - label: 混合车队编排
          actor: 车队经理与承运商网络
          touchpoints:
            - 自有车队、3PL 和众包承运商协调
            - 多承运商网络扩张
        - label: 司机执行
          actor: 司机
          touchpoints:
            - 司机应用工作流
            - 配送证明和实时状态更新
        - label: 客户交付
          actor: 终端消费者
          touchpoints:
            - 实时追踪和更窄的到达时间窗口
            - 在客户体验页面收集反馈
        - label: 扩张与留存闭环
          actor: 客户成功团队与企业客户负责人
          touchpoints:
            - 从试点到全国部署的路径
            - 追加模块、自动化和承运商网络广度
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU010
      - CU014
      - CU015
