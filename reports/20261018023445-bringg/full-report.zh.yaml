            body: >-
              刷新后的来源足以说明 Bringg 是一家规模化、按报价定价的企业级配送编排平台，且有重要历史融资，但不足以判断收入质量或资本充足性。在管理层披露
              ARR、留存、利润率、烧钱速度、现金跑道和实际定价前，任何超出持续观察的判断都缺乏依据。
