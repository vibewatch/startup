      - number: '3.2'
        title: 产品广度与切换成本
        blocks:
          - type: paragraph
            body: >-
              Bringg 的护城河似乎不在透明的价格领先，而在覆盖规划、路线、调度、司机执行、客户沟通、承运商选择和费率卡逻辑的工作流广度。官方平台页面显示，Bringg 通过
              API、webhook、承运商报价请求和承运商专属配送条款嵌入 OMS、ERP、WMS 和 TMS
              工作流。一旦托运方把这些规则编码进去，换供应商就不只是更换软件，还可能需要重做集成、承运商决策规则和面向客户的配送体验。


              同样的广度也带来多归属压力。Locus 认为买方希望从一个共享数据模型获得路线、调度和可视化；FarEye 则以承运商网络广度和无代码上线为卖点。换句话说，Bringg
              的工作流深度确实能制造切换成本，但这也是集成更好或更易部署的竞争者试图替代它的入口。
            claimRefs:
              - CP001
