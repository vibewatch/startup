  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              留存资料支持买方解决同一需求的三种实际方式。第一类是企业级直接编排套件，Bringg 以广度与 FarEye、Locus 等同业竞争。第二类是 Routific
              这类更窄的替代方案，专注于路线驱动的本地配送场景，用更简单的采用流程和更清晰的价格，换取较少的覆盖广度。第三类是现状方案：由 OMS/WMS/TMS 系统、承运商合同及独立路线或调度工具拼成的技术栈。


              Bringg 自己的材料和独立目录仍将其定位为面向零售商与物流服务商的企业级平台，而不是轻量 SMB
              产品。这一点很重要，因为竞争不只是厂商之间的对抗，也包括全套编排、专业路线工具与“够用”的内部协同之间的选择。因此，象限和画像表聚焦指定资料中证据最充分的替代方案，而不虚构缺乏支持的老牌厂商画像。
            claimRefs:
