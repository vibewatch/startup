  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 800+ 家客户、每年 200M 次配送以及 250+ 至 300+ 家服务商组成的网络仍在增长，同时保持强劲留存和稳健利润率。
        - 如果当前 ARR 和毛利率已显著超过 2021 年融资基础，历史上的 $1B 标记仍可能站得住脚，甚至偏保守。
        - 规模未必能转化为持久的软件经济性，或清算优先权之后的普通股价值。
        - 管理层分享最新 ARR、NRR、毛利率和现金数据，证明自 2021 年以来取得实质进展。
      - - 基准
        - Bringg 仍是具有战略相关性的企业基础设施，但现有证据仍缺少当前软件经济性披露。
        - 维持跟踪，不要在获得更新后的私有指标和资本结构表条款前承诺目标回报。
        - 公司运营上可能稳健，但对新投资者而言，入场经济性仍然不佳。
        - 完整数据室能回答 ARR、烧钱速度、runway、留存和清算优先权问题，且没有不利意外。
      - - 悲观
        - 2021 年独角兽估值反映的是暂时的需求激增；询价定价和更长的上手周期则拖慢新客户转化和价值实现。
        - 新一轮融资或二级交易可能以低于上一轮优先股价格的水平成交，压缩相对于历史估值的回报。
        - 即使产品仍有用，稀释、优先股堆叠和增长走弱也可能同时发生。
        - 公开证据仍未提供更新后的指标或 2021 年之后的价格发现，投资者只能假设下行，而不能证明上行。
    notes: 由于指定资料池没有披露当前 ARR、利润率、烧钱速度、runway 或详细资本结构表条款，情景逻辑仅供方向性参考。
