        - "Survey frame: enterprise retail and logistics respondents"
        - 93% strategic priority; 94% expect more spend in 12-18 months
        - null
        - Survey of 150 executives at companies with more than $1 billion in annual revenue
        - medium
        - Demand-intent lens, not a market-size estimate
      - - Bringg operational KPI lens
        - "2026"
        - Same survey frame
        - 64% miss cost-per-delivery; 52% miss customer satisfaction; 51% miss ETA accuracy
        - null
        - Execution-friction lens showing where adoption pain persists
        - medium
        - Operational benchmark, not TAM / SAM / SOM
      - - Bringg ecosystem breadth
        - "2023-2026"
        - Global delivery-provider network
        - 250+ carriers to 300+ delivery providers
        - null
        - Public platform surfaces showing network breadth and partner reach
        - medium
        - Different denominators prevent an exact like-for-like installed-network count
      - - Tracxn competitive-set lens
        - "2026"
        - Global software category view
        - 1,104 active competitors; 110 funded; 40 exited
        - null
        - Category crowding lens from Tracxn's company and competitor taxonomy
        - medium
        - Category boundary is platform-defined and does not convert into market dollars
    notes: >-
      Because the assigned source pool lacks an independent spend model for last-mile
      orchestration, this table uses demand, ecosystem, and crowding lenses instead of an
      invented dollar TAM; null CAGR values indicate that no supportable growth-rate series was
      available in the pool.
    claimRefs: [CM006, CM007, CM008, CM009, CM011, CM012, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Large retailers with owned fleets
        - VP / head of delivery operations
        - Dispatchers, drivers, and store-ops coordinators
        - Delivery operations budget
        - Route planning, dispatch, driver workflow, delivery visibility
        - Delivery / logistics operations
        - Lower cost-per-delivery and better ETA control
      - - Retailers using multiple third-party carriers
        - Fulfillment or transportation leader
        - Dispatchers, carrier managers, customer-service teams
        - Fulfillment or transportation budget
        - Carrier selection, quotes, rate cards, SLA logic, branded tracking
        - Transportation procurement with operations sponsorship
        - More carrier choice without losing customer experience control
      - - Logistics providers / 3PL operators
        - Network operations leader
        - Route planners, partner managers, and account operations staff
        - Operations technology budget
        - Multi-client orchestration, exception handling, and carrier-performance control
        - COO or logistics operations
        - Standardize execution across heterogeneous client workflows
      - - Omnichannel enterprise fulfillment teams
        - Omnichannel fulfillment leader
        - Store associates, dispatch teams, customer-experience staff
        - Omnichannel operations budget
        - Click & Collect coordination, delivery-slot logic, customer communications
        - Omnichannel operations
        - Preserve branded experience across pickup and delivery channels
    notes: >-
      Buyer, payer, and budget-owner cells are inferred from the operational control points in
      Bringg's public product documentation; the company does not publish an org-chart-level
      breakdown of who signs deals by segment.
    claimRefs: [CM002, CM003, CM004, CM005, CM015, CM017]
