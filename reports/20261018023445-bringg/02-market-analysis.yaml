          note: Tracxn's taxonomy implies a crowded field with many adjacent and direct options.
          tone: risk
          claimRefs: [CM012]
    approximationNotes: >-
      The assigned source pack does not contain an independently corroborated dollar TAM / SAM /
      SOM model for last-mile orchestration, so this figure visualizes supported demand and
      addressability filters instead of inventing unsupported market values.
    claimRefs: [CM007, CM008, CM009, CM011, CM012, CM014]
callouts:
  - calloutType: insight
    title: The market is orchestration-heavy, not generic logistics software
    body: >-
      The strongest evidence consistently places Bringg in the orchestration layer between
      systems of record and delivery execution: routing, carrier choice, dispatch, visibility,
      and proof-of-delivery.
    claimRefs: [CM001, CM003, CM004, CM005]
  - calloutType: risk
    title: Public demand signals are stronger than public TAM disclosure
    body: >-
      Budget intent and execution pain are visible, but the assigned evidence cannot isolate a
      clean, independent market-dollar stack for Bringg's true serviceable segment.
    claimRefs: [CM008, CM009, CM014]
