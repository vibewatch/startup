    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Bringg / Industry Dive survey
