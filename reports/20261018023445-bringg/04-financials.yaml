schemaVersion: report-v2
artifact: financials
slug: bringg
runDate: 2026-10-18
company:
  name: Bringg
chapter:
  number: 4
  title: Financials
  summary: >-
    Bringg shows credible enterprise scale — 800+ customers, 70+ countries, and
    200M annual deliveries — plus a documented $100M Series E that set a $1B
    valuation in 2021, but refreshed public evidence still does not disclose
    pricing realization, margins, or post-2021 cash position. The result is a
    directional financial picture of quote-based orchestration software with
    real market adoption, but not enough hard operating data to underwrite
    revenue quality or capital adequacy.
sections:
  - id: revenue-model
    title: Revenue model remains visible in workflow, not in public contracts
    body: >-
      Public product material consistently describes Bringg as an enterprise
      orchestration layer for retailers and logistics providers rather than a
      consumer marketplace or carrier itself. The workflow spans checkout
      delivery choices, route planning, dispatch, driver operations, carrier
      selection, and post-delivery communication, which supports the view that
      Bringg monetizes software deployed inside customers' fulfillment
      operations rather than taking a disclosed cut of delivery GMV. That said,
      public monetization detail is thin: Gappsy says Bringg uses quote-based
      pricing and does not publish plans or tiers, while Bringg's own delivery
      documentation focuses on how customers compare carrier quotes and apply
      their own rate cards, not on what Bringg itself charges for each module
      or transaction.
    claimRefs: [CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: sales-efficiency-proxies
    title: GTM looks enterprise-led, with ROI tied to labor and carrier savings
    body: >-
      Bringg's sales motion appears enterprise and consultative rather than
      self-serve. The company and third-party review sources describe a modular
      platform used across owned, third-party, and crowdsourced fleets, while
      Bringg's help documentation explicitly says IT integrators configure
      integrations into other fulfillment systems. Gappsy also flags likely
      longer onboarding than simpler point solutions. The commercial upside is
      that Bringg can point to operational ROI — route optimization, utilization
      improvement, carrier-price comparison, and automated dispatch — as
      concrete buying criteria for large shippers. Partner surfaces from SAP and
      Salesforce Ventures suggest some ecosystem-led distribution or at least
      enterprise discovery channels, but public evidence is still insufficient
      to quantify CAC, payback, discounting, services attach, or actual
      implementation cost recovery.
    claimRefs: [CI005, CI007, CI008, CI016]
    tableRefs: [TI003]
  - id: capital-and-scale
    title: Scale is visible; balance-sheet adequacy is not
    body: >-
      Refresh evidence confirms meaningful commercial scale but mostly through
      operating proxies rather than financial statements. Bringg's about page
      says it serves 800+ customers across 70+ countries and processes 200M
      annual deliveries, while Salesforce Ventures still lists the company as
      private. On capitalization, the clearest public fact remains the June
      2021 Series E: Bringg said it raised $100M, planned to use the proceeds
      to scale the platform through M&A and ecosystem growth, and said the
      round set a $1B valuation. Third-party datasets broadly align on roughly
      $185M total historical funding. What is missing is the refresh-critical
      forward view: no source in this pool discloses current cash, burn, debt
      obligations, covenant constraints, or whether Bringg has since raised at
      a new valuation.
    claimRefs: [CI006, CI009, CI010, CI011, CI014]
  - id: underwriting-blockers
    title: Underwriting still depends on private metrics management has not disclosed
    body: >-
      The chapter supports a narrow but useful verdict. Bringg likely earns
      software revenue from negotiated enterprise contracts attached to
      orchestration, carrier-network, automation, and customer-experience
      workflows, and the product's value proposition is closely linked to labor
      efficiency, delivery-cost optimization, and service-level control.
      However, the public record still omits the metrics that matter most for
      underwriting: ARR, retention, gross margin, burn, runway, customer
      concentration, and realized pricing. LeadIQ's $100M-$250M revenue range
      is only a third-party estimate, not management disclosure. That leaves
      investors with evidence of scale and prior funding, but without the
      revenue quality, margin path, or liquidity detail needed to judge whether
      Bringg's historical unicorn valuation remains supportable.
    claimRefs: [CI001, CI012, CI013, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core orchestration platform
        - Modular enterprise software spanning planning, dispatch, driver workflow, and delivery experience
        - Annual contract / platform subscription
        - Public workflow evidence is strong; public contract economics are undisclosed
        - Medium confidence on mechanism, low confidence on realized pricing
        - Request SKU list, ACV bands, contract length, and renewal structure
      - - Delivery Hub / carrier orchestration
        - Carrier quote requests, carrier selection, and rate-card logic embedded in the product
        - Per order or module fee unknown
        - Product supports carrier-price comparison, but Bringg's own monetization is not public
        - Medium confidence on product role, low confidence on revenue attachment
        - Request whether monetization is seat-based, order-based, carrier-based, or bundled
      - - Automation Center and Intelligence
        - No-code workflows plus KPI dashboards and reporting
        - Add-on module or bundle unknown
        - Publicly marketed capability with no public packaging detail
        - Medium confidence on capability, low confidence on mix
        - Request attach rate, upsell penetration, and pricing delta by module
      - - Implementation / integration services
        - Integration and deployment work to connect Bringg with fulfillment systems
        - Services fee or bundled enablement unknown
        - Integrator involvement is explicit, but services revenue mix is not disclosed
        - Medium confidence on delivery burden, low confidence on monetization
        - Request services revenue share, gross margin, and time-to-go-live by customer size
    notes: >-
      Public sources describe workflow and deployment burden, but not Bringg's
      realized commercial terms; null-like cells mean the monetization detail is
      not disclosed in the reviewed public evidence.
    claimRefs: [CI002, CI003, CI004, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - List vs realized pricing
      - Current status
      - Source
      - Financial implication
    rows:
      - - Public list price
        - List pricing unavailable
        - Bringg does not publish plans or tiers
        - Gappsy review
        - Public buyers cannot benchmark ASP without management materials
      - - Contract motion
        - Realized pricing negotiated
        - Sales/demo process implied by quote-based pricing
        - Gappsy review
        - Likely enterprise deal cycles, discounts, and scoped packaging
      - - Carrier economics inside product
        - Customer carrier rates, not Bringg list price
        - Delivery Hub compares quotes and rate cards to pick cheapest or best-fit option
        - Bringg Delivery Hub documentation
        - Product may drive ROI through carrier-cost savings even if vendor take-rate is absent
      - - Module packaging
        - Realized packaging unknown
        - Public materials describe modular product families but not bundle structure
        - Bringg platform pages and review
        - Revenue mix by module is a key diligence gap
    notes: >-
      This table separates product economics visible in the workflow from
      Bringg's own vendor pricing; public evidence supports only quote-based
      enterprise selling, not published rates or realized discounting.
    claimRefs: [CI002, CI003, CI004]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR
        - null
        - Unavailable
        - Recurring revenue is the key denominator for valuation and retention analysis
        - Request latest ARR, ARR growth, GRR, and NRR
      - - Revenue scale
        - $100M-$250M third-party estimate as of August 2026
        - Low
        - Provides only a rough size check without management disclosure
        - Request audited 2025 and 2026 revenue plus recurring/non-recurring split
      - - Gross margin
        - null
        - Unavailable
        - Margin profile determines whether software economics outweigh service burden
        - Request gross margin by software versus services / implementation
      - - CAC / payback
        - null
        - Unavailable
        - Enterprise sales efficiency cannot be judged from workflow evidence alone
        - Request CAC, sales cycle, payback, win rate, and partner-sourced pipeline share
      - - Deployment burden
        - Integrator setup plus likely longer onboarding than simpler point solutions
        - Medium
        - Implementation effort can slow bookings conversion and raise delivery cost
        - Request median implementation time, services staffing, and time-to-value by customer segment
      - - Liquidity / runway
        - null
        - Unavailable
        - Post-2021 funding facts do not show whether Bringg can self-fund growth or needs new capital
        - Request cash, burn, runway, debt, and fundraising plans
    notes: >-
      Null values indicate metrics the refreshed public evidence does not
      disclose; the single revenue figure is a third-party estimate rather than
      management-reported revenue.
    claimRefs: [CI005, CI008, CI011, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources show how order activity flows through Bringg's orchestration
      stack, but the public record stops short of disclosing the contract price
      or resulting gross profit captured by Bringg.
    data:
      nodes:
        - id: demand
          label: Shopper selects delivery option
          detail: Bringg says checkout can surface delivery speed and price choices before order confirmation.
        - id: orchestration
          label: Bringg plans and orchestrates delivery
          detail: Planning, routing, dispatch, and driver workflows sit inside the platform's core software layer.
        - id: carrier
          label: Carrier and own-fleet economics are compared
          detail: Delivery Hub can request carrier quotes and apply rate cards to find the cheapest or best-fit option.
        - id: execution
          label: Dispatch and driver execution happen across multiple fleet types
          detail: Bringg coordinates owned, third-party, and crowdsourced fleets with automated assignment and tracking.
        - id: experience
          label: Customer experience and ratings are captured
          detail: Branded tracking, ETAs, and post-delivery feedback complete the workflow.
        - id: vendor
          label: Bringg earns negotiated software revenue
          detail: Public evidence points to quote-based enterprise software monetization, while public gross-profit data remains unavailable.
      edges:
        - from: demand
          to: orchestration
          label: Order enters workflow
        - from: orchestration
          to: carrier
          label: Plan and price options
        - from: carrier
          to: execution
          label: Best-fit carrier or fleet selected
        - from: execution
          to: experience
          label: Delivery completed and tracked
        - from: experience
          to: vendor
          label: Software value supports contract renewal
    claimRefs: [CI002, CI003, CI004, CI005, CI007, CI008]
callouts:
  - calloutType: risk
    title: Public underwriting is still blocked by missing private operating data
    body: >-
      The refreshed source set is enough to show Bringg as a scaled, quote-based
      enterprise delivery-orchestration platform with meaningful historical
      funding, but not enough to judge revenue quality or capital adequacy. Any
      conviction beyond a monitoring stance still requires management disclosure
      on ARR, retention, margins, burn, runway, and realized pricing.
    claimRefs: [CI006, CI010, CI012, CI013]
