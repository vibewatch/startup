              - CU002
              - CU005
              - CU010
              - CU014
              - CU015
      - number: '6.2'
        title: Named deployments and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Best Buy is the strongest retained proof of real adoption because the case study describes a single-market
              proof of concept, positive pilot results, a national rollout plan, tighter delivery windows, and
              operational telemetry improvements after deployment. Beyond that, the evidence becomes shallower: Bringg's
              October 2023 launch release still claimed more than 800 customers globally, Insight Partners described
              180% year-over-year new-customer growth at the 2021 Series E round, and Tracxn lists Coca-Cola, Boulanger,
              and Walmart as clients. Those are real adoption signals, but only the Best Buy evidence in this pool
              provides customer-specific implementation and outcome detail that distinguishes production depth from logo
              presence.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU013
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter supports a credible land-and-expand story, but not a verified durability story. ROAD's tiered
              packaging and the platform's emphasis on integrations, orchestration, and carrier breadth suggest that
              Bringg can land with basic workflow digitization and expand into optimization, automation, or broader
              fleet coverage over time. However, the public sources do not disclose NRR, GRR, logo churn, renewal rates,
              contract length, or top-customer concentration, so the most valuation-critical customer questions remain
              open. Even the stronger independent proof carries caveats: SupplyWolf explicitly says listed capabilities
              and integrations should be confirmed with the vendor, which limits how far catalog-style evidence can go
              in proving current deployment depth or expansion economics.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Best Buy is the chapter's only production-depth proof point
            body: >-
              Best Buy is more than a logo reference: the retained case study describes a single-market proof of
              concept, positive pilot results, a national rollout plan, narrower delivery windows, driver workflow
              improvements, and richer operational telemetry after deployment.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU016
          - type: callout
            title: Logo breadth is stronger than durability proof
            body: >-
              Bringg's public record supports enterprise relevance and at least one scaled deployment, but it still does
              not disclose renewal rates, churn, NRR, GRR, or top-customer concentration, so the stickiness and
              expansion economics of the customer base remain unverified.
            calloutType: risk
            claimRefs:
