      - number: '4.4'
        title: Underwriting still depends on private metrics management has not disclosed
        blocks:
          - type: paragraph
            body: >-
              The chapter supports a narrow but useful verdict. Bringg likely earns software revenue from negotiated
              enterprise contracts attached to orchestration, carrier-network, automation, and customer-experience
              workflows, and the product's value proposition is closely linked to labor efficiency, delivery-cost
              optimization, and service-level control. However, the public record still omits the metrics that matter
              most for underwriting: ARR, retention, gross margin, burn, runway, customer concentration, and realized
              pricing. LeadIQ's $100M-$250M revenue range is only a third-party estimate, not management disclosure.
              That leaves investors with evidence of scale and prior funding, but without the revenue quality, margin
              path, or liquidity detail needed to judge whether Bringg's historical unicorn valuation remains
              supportable.
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI015
