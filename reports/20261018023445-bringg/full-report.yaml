            body: >-
              The refreshed source set is enough to show Bringg as a scaled, quote-based enterprise
              delivery-orchestration platform with meaningful historical funding, but not enough to judge revenue
              quality or capital adequacy. Any conviction beyond a monitoring stance still requires management
              disclosure on ARR, retention, margins, burn, runway, and realized pricing.
            calloutType: risk
            claimRefs:
