        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is the moat
            body: >-
              Bringg's stickiness comes from encoded carrier rules, integrations, and customer-experience workflows more
              than from transparent entry pricing.
            calloutType: insight
