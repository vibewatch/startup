      - number: '5.2'
        title: Workflow architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The documented workflow starts at checkout, where Bringg can expose delivery slots, service levels, and
              consumer pricing while checking vehicle or carrier availability in real time. From there, the platform
              moves into route planning, carrier selection, dispatch, and execution through a driver app and a branded
              customer experience page. Delivery Hub documentation adds another architectural layer: quote requests,
              rate cards, delivery terms, and carrier selector rules determine which external provider or own-fleet
              resource should fulfill each order. This creates a clear operating model of upstream system integrations
              feeding an orchestration layer that then controls dispatchers, carriers, drivers, and consumers through
              shared rules and event updates.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE012
              - CE013
