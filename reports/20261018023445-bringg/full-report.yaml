  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          The 800+ customer base, 200M annual deliveries, and 250+ to 300+ provider network are still compounding with
          strong retention and solid margins.
        - >-
          If current ARR and gross margin have scaled materially beyond the 2021 financing base, the historical $1B mark
          could still be defendable or conservative.
        - Scale may not translate into durable software economics or post-preference common equity value.
        - Management shares fresh ARR, NRR, gross margin, and cash data that show meaningful progress since 2021.
      - - Base
        - >-
          Bringg remains strategically relevant enterprise infrastructure, but the evidence set still lacks current
          software-economics disclosure.
        - >-
          Maintain a track stance and do not underwrite a target return until updated private metrics and cap-table
          terms are available.
        - The company may be solid operationally while still offering poor entry economics for a new investor.
        - >-
          A full data room answers ARR, burn, runway, retention, and liquidation-preference questions without adverse
          surprises.
      - - Bear
        - >-
          The 2021 unicorn mark reflected a temporary demand surge, while quote-based pricing and longer onboarding slow
          new-logo conversion and time-to-value.
        - >-
          A new round or secondary transaction could clear below the last preferred price, compressing returns from the
          historical mark.
        - Dilution, preference stack, and weaker growth could combine even if the product remains useful.
        - >-
          Public evidence continues to omit updated metrics and any post-2021 price discovery, forcing investors to
          assume downside rather than prove upside.
    notes: >-
      Scenario logic is directional because the assigned pool does not disclose current ARR, margins, burn, runway, or
      detailed cap-table terms.
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV015
