        title: Exhibits
        blocks:
          - type: callout
            title: Modular orchestration breadth is the core product strength
            body: >-
              Bringg appears strongest where enterprises need one control plane across owned fleets, carrier partners,
              drivers, and branded customer experiences rather than a single-purpose route optimizer.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE011
          - type: callout
            title: Independent execution proof lags vendor architecture claims
            body: >-
              The assigned pool supports broad workflow coverage, but independent evidence on implementation duration,
              uptime, developer activity, and security-audit depth is still too thin to call the stack fully de-risked.
            calloutType: risk
            claimRefs:
              - CE010
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer roles
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently position Bringg as an enterprise delivery orchestration platform sold to
              retailers, logistics providers, and other large operators managing complex fulfillment networks rather
              than a simple self-serve SMB tool. The buyer is typically an operations, supply-chain, or digital-commerce
              owner who needs to control delivery promises, route planning, dispatch, and carrier selection, while the
              day-to-day users are dispatchers, drivers, store teams, and end consumers interacting with the branded
              delivery experience. Independent catalog and partner pages reinforce that positioning: Bringg is framed
              around multi-fleet programs, deep integrations, and enterprise workflow coordination, which supports a
              customer mix skewed toward higher-complexity operators that value orchestration breadth over lightweight
              point solutions.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
