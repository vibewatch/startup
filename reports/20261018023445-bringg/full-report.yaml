  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a market boundary centered on last-mile delivery orchestration, not on
              generic supply-chain software. Bringg's own documentation defines the value layer as the final stage from
              warehouse or fulfillment center to end customer, then describes workflow control points across route
              planning, carrier selection, dispatch, driver execution, branded tracking, and proof-of-delivery. The same
              materials show that Bringg connects into OMS, ERP, eCommerce, WMS, and TMS systems rather than replacing
              them, which makes the relevant market narrower than end-to-end logistics suites but broader than a
              single-fleet dispatch tool. Gartner's product description independently reinforces that framing by
              describing Bringg as unifying last-mile delivery, fulfillment, and returns across internal and external
              delivery capacity. In practice, the status quo substitutes are internal dispatch workflows, direct carrier
              management, and point tools that solve one fleet or one communication layer without coordinating the full
              network.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: Evidence-constrained sizing and category intensity
        blocks:
          - type: paragraph
            body: >-
              This source pack does not provide an independent market-research estimate that cleanly isolates last-mile
              orchestration software spend, so the chapter uses multiple public lenses instead of inventing a dollar
              TAM. First, Bringg's 2026 survey summary suggests strong enterprise demand intensity: 93% of surveyed
              retail and logistics executives say last-mile delivery is strategic and 94% expect to increase spending.
              Second, the market looks structurally broad because the problem spans owned fleets, third-party carriers,
              and hybrid networks; public company-facing surfaces cite 250+ carriers or 300+ delivery providers in
              Bringg's ecosystem. Third, the category appears crowded: Tracxn lists 1,104 active competitors, which
              implies abundant adjacent and direct alternatives. Those lenses are useful for direction and valuation
              context, but they are not substitutes for a bottom-up segment revenue model, so a diligence gap remains
              around true SAM and realistic SOM.
