      - number: '2.3'
        title: Buyers, adoption drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The workflow evidence implies that the economic buyer is usually delivery or logistics operations
              leadership, sometimes paired with procurement or omnichannel operations, rather than a general marketing
              or storefront owner. The product's documented control points are carrier quotes, delivery terms, rate
              cards, route planning, dispatch automation, SLA management, and exception handling, which are operations
              budget decisions. Adoption drivers are straightforward: the platform promises cost reduction, better ETA
              performance, improved branded customer experience, and the ability to coordinate complex hybrid or
              outsourced fleet networks. The same evidence also surfaces the category's main constraints. Bringg's own
              survey says more than half of respondents miss cost, satisfaction, or ETA targets, while AI adoption
              remains concentrated in routing and visibility rather than exception handling, carrier management, and
              billing reconciliation. That pattern suggests budget intent is real, but deployment complexity and process
              change still slow realization.
