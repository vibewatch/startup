      - number: '4.3'
        title: Scale is visible; balance-sheet adequacy is not
        blocks:
          - type: paragraph
            body: >-
              Refresh evidence confirms meaningful commercial scale but mostly through operating proxies rather than
              financial statements. Bringg's about page says it serves 800+ customers across 70+ countries and processes
              200M annual deliveries, while Salesforce Ventures still lists the company as private. On capitalization,
              the clearest public fact remains the June 2021 Series E: Bringg said it raised $100M, planned to use the
              proceeds to scale the platform through M&A and ecosystem growth, and said the round set a $1B valuation.
              Third-party datasets broadly align on roughly $185M total historical funding. What is missing is the
              refresh-critical forward view: no source in this pool discloses current cash, burn, debt obligations,
              covenant constraints, or whether Bringg has since raised at a new valuation.
            claimRefs:
              - CI006
              - CI009
              - CI010
