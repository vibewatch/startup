  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              Bringg's public materials consistently describe the product as orchestration software for retailers,
              logistics providers, and other enterprises managing owned fleets alongside third-party or crowdsourced
              carriers. The company does not position itself as a first-party delivery network; instead it sells
              coordination, planning, execution, and experience tooling that sits across the last mile. Across the
              official platform page, help documentation, and partner profile, the product breaks into recurring modules
              for planning, dispatch, driver execution, and customer experience, with Delivery Hub extending the model
              to carrier-network orchestration. Independent profiles reinforce that the platform is modular and
              enterprise oriented rather than a lightweight route-planning point tool.
            claimRefs:
