  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-gap
      missingEvidence: Independent uptime history, SLA attainment, incident records, or benchmarked performance for Bringg production deployments.
      whyItMatters: Without non-vendor reliability evidence, the platform's operational resilience cannot be separated from architecture marketing or case-study curation.
      diligencePath: Request status-history exports, SLA reports, incident postmortems, and at least two customer references discussing uptime and exception handling in production.
      relatedQuestionRefs:
        - QE009
    - type: missing-source
      severity: material
      topic: developer-signal-gap
      missingEvidence: Public developer or practitioner-community evidence such as active API changelogs, code samples, integration forum activity, package telemetry, or implementation partner engineering materials.
      whyItMatters: A platform that depends on integrations is less defensible if external builders and integrators are not visibly engaged or cannot self-serve technical adoption.
      diligencePath: Request private API/docs access, integrator enablement materials, change logs, and customer engineering references that show active external implementation usage.
      relatedQuestionRefs:
        - QE009
    - type: private-evidence-only
      severity: material
      topic: implementation-risk
      missingEvidence: Module-by-module implementation timelines, services burden, and time-to-value benchmarks segmented by own-fleet versus Delivery Hub deployments.
      whyItMatters: Independent sources imply complexity, so underwriting product maturity requires knowing whether deployment friction is a temporary onboarding tax or a structural adoption drag.
      diligencePath: Ask management for recent implementation project plans, average go-live timelines, services attach rates, and a sample of delayed or failed rollouts.
      relatedQuestionRefs:
        - QE008
      relatedTableRefs:
        - TE003
