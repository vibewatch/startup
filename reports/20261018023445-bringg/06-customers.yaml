        - Production after pilot
        - Single-market proof of concept, positive momentum, national rollout plan,
          tighter delivery windows, and operational telemetry
        - Only retained source with detailed rollout and outcome disclosure
      - - Coca-Cola
        - Consumer goods / enterprise shipper
        - Undisclosed
        - Undisclosed
        - Tracxn lists Coca-Cola as a client
        - No deployment date, module scope, geography, or renewal proof
      - - Walmart
        - Retail
        - Undisclosed
        - Undisclosed
        - Tracxn lists Walmart as a client
        - No production depth, outcome data, or current-status confirmation
      - - Boulanger
        - Retail / appliances
        - Undisclosed
        - Undisclosed
        - Tracxn lists Boulanger as a client
        - No use-case detail, rollout scale, or current-status confirmation
    notes: >-
      This is a sampled proof set, not a complete customer roster; only Best Buy
      has production-depth evidence in the retained pool, while the other named
      logos are reference-quality but detail-light.
    enumerationScope:
      coverage: partial
      basis: >-
        Named deployments were compiled from the retained Best Buy case study and
        Tracxn client list only, so this table is a sampled proof set rather than a
        complete customer census.
    claimRefs: [CU003, CU004, CU008, CU013, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Bringg's evidence points to an enterprise journey that starts with delivery
      promise control and expands through dispatch, execution, and broader carrier
      orchestration.
    data:
      items:
        - label: Demand shaping and delivery promise
          actor: Buyer and digital-commerce team
          touchpoints:
            - Delivery options and pricing at checkout
            - Dynamic delivery slots and branded promise management
        - label: Dispatch and route planning
          actor: Dispatcher or ops manager
          touchpoints:
            - Route planning, resource management, and exception handling
            - Carrier selection and autodispatch logic
        - label: Hybrid fleet orchestration
          actor: Fleet manager and carrier network
          touchpoints:
            - Owned fleet, 3PL, and crowdsourced carrier coordination
            - Multi-carrier network expansion
        - label: Driver execution
          actor: Driver
          touchpoints:
            - Driver app workflow
            - Proof of delivery and live status updates
        - label: Customer handoff
          actor: End consumer
          touchpoints:
            - Live tracking and narrower arrival windows
            - Feedback capture on the customer experience page
        - label: Expansion and retention loop
          actor: Customer success and enterprise account owner
          touchpoints:
            - Pilot to national rollout path
            - Additional modules, automation, and carrier-network breadth
    claimRefs: [CU001, CU002, CU005, CU010, CU014, CU015]
callouts:
  - calloutType: strength
    title: Best Buy is the chapter's only production-depth proof point
    body: >-
      Best Buy is more than a logo reference: the retained case study describes a
      single-market proof of concept, positive pilot results, a national rollout
      plan, narrower delivery windows, driver workflow improvements, and richer
      operational telemetry after deployment.
    claimRefs: [CU003, CU004, CU005, CU016]
  - calloutType: risk
    title: Logo breadth is stronger than durability proof
    body: >-
      Bringg's public record supports enterprise relevance and at least one scaled
      deployment, but it still does not disclose renewal rates, churn, NRR, GRR, or
      top-customer concentration, so the stickiness and expansion economics of the
      customer base remain unverified.
    claimRefs: [CU006, CU008, CU012, CU015]
