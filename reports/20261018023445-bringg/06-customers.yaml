    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Global customer count
        - 800+ customers globally
        - "2023-10-09"
        - BusinessWire ROAD launch
        - Medium
        - Shows broad top-of-funnel adoption at the last public count update
        - No 2025-2026 customer count, net adds, or active-account base
      - - New-customer growth
        - 180% year-over-year new customer growth
        - "2021-06-16"
        - Insight Partners Series E release
        - Medium
        - Signals breakout commercial traction around the last funding round
        - No base period customer count, revenue conversion, or retention cohort
      - - Named deployment progression
        - Best Buy moved from a single-market proof of concept to a national plan
        - "2026-02-11"
        - Bringg Best Buy case study
        - Medium
        - Strongest retained evidence that Bringg can scale beyond a pilot
        - Only one retained deployment has this level of detail
      - - Customer-facing outcome
        - Four-hour arrival window reduced to precise arrival times
        - "2026-02-11"
        - Bringg Best Buy case study
        - Medium
        - Suggests adoption can translate into measurable end-customer experience gains
        - No linked order volume, CSAT baseline, or renewal data
    notes: >-
      This table mixes historical scale claims and one current deployment outcome;
      it should be read as an adoption snapshot, not a full cohort or retention
      model.
    claimRefs: [CU003, CU004, CU006, CU007]
