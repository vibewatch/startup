company:
  name: Bringg
chapter:
  number: 6
  title: Customers
  summary: >-
    Bringg has credible enterprise-customer proof in large retailers and logistics
    operators, with Best Buy providing the strongest retained evidence of scaled
    production use. The public record is much stronger on logos, workflow breadth,
    and carrier-network expansion surfaces than on retention durability, renewal
    quality, or concentration.
sections:
  - id: customer-segments
    title: Customer segments and buyer roles
    body: >-
      The retained sources consistently position Bringg as an enterprise delivery
      orchestration platform sold to retailers, logistics providers, and other
      large operators managing complex fulfillment networks rather than a simple
      self-serve SMB tool. The buyer is typically an operations, supply-chain, or
      digital-commerce owner who needs to control delivery promises, route planning,
      dispatch, and carrier selection, while the day-to-day users are dispatchers,
      drivers, store teams, and end consumers interacting with the branded delivery
      experience. Independent catalog and partner pages reinforce that positioning:
      Bringg is framed around multi-fleet programs, deep integrations, and
      enterprise workflow coordination, which supports a customer mix skewed toward
      higher-complexity operators that value orchestration breadth over lightweight
      point solutions.
    claimRefs: [CU001, CU002, CU009, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Named deployments and adoption signals
    body: >-
      Best Buy is the strongest retained proof of real adoption because the case
      study describes a single-market proof of concept, positive pilot results, a
      national rollout plan, tighter delivery windows, and operational telemetry
      improvements after deployment. Beyond that, the evidence becomes shallower:
      Bringg's October 2023 launch release still claimed more than 800 customers
      globally, Insight Partners described 180% year-over-year new-customer growth
      at the 2021 Series E round, and Tracxn lists Coca-Cola, Boulanger, and
      Walmart as clients. Those are real adoption signals, but only the Best Buy
      evidence in this pool provides customer-specific implementation and outcome
      detail that distinguishes production depth from logo presence.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration gaps
    body: >-
      The chapter supports a credible land-and-expand story, but not a verified
      durability story. ROAD's tiered packaging and the platform's emphasis on
      integrations, orchestration, and carrier breadth suggest that Bringg can land
      with basic workflow digitization and expand into optimization, automation, or
      broader fleet coverage over time. However, the public sources do not disclose
      NRR, GRR, logo churn, renewal rates, contract length, or top-customer
      concentration, so the most valuation-critical customer questions remain open.
      Even the stronger independent proof carries caveats: SupplyWolf explicitly
      says listed capabilities and integrations should be confirmed with the vendor,
      which limits how far catalog-style evidence can go in proving current
      deployment depth or expansion economics.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / strategic value
      - Evidence quality
      - Gap
    rows:
      - - Enterprise retailers
        - >-
          Buyer: operations, supply chain, and digital-commerce leaders; users:
          dispatchers, store teams, drivers, and end consumers; payer: enterprise
          operations or IT budget
        - Delivery promise orchestration, routing, dispatch, branded tracking, and
          post-purchase communication
        - Best Buy shows national rollout potential where delivery experience is a
          competitive differentiator
        - Strongest retained proof because the case study includes rollout sequence
          and operational outcomes
        - No disclosed segment ARR, contract size, or retailer concentration
      - - Logistics providers and enterprise fleets
        - >-
          Buyer: fleet or logistics operations leaders; users: dispatchers, fleet
          managers, and drivers; payer: enterprise logistics budget
        - Multi-carrier orchestration, route planning, dispatch, rate-card logic,
          and real-time monitoring
        - Supports complex owned, 3PL, and crowdsourced fleet programs
        - Supported by official platform descriptions and SAP partner positioning
        - No named production logistics-provider deployment in the retained pool
      - - Hybrid operators and digitally maturing fleets
        - >-
          Buyer: transformation or operations leaders; users: dispatchers and
          drivers; payer: central operations budget
        - Start with workflow digitization, then add optimization, autodispatch,
          and advanced automation
        - ROAD tiers imply an upsell path as customer maturity increases
        - Supported by product packaging and independent catalog descriptions
        - No public module attach-rate or expansion-ARR disclosure
    notes: >-
      Sources mix official product descriptions, one named customer case study, and
      independent partner/catalog pages; gaps capture missing segment revenue,
      concentration, and renewal detail.
    claimRefs: [CU001, CU002, CU009, CU010, CU014]
