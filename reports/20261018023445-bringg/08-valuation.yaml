        - id: platform
          label: "Platform breadth"
          note: "250+ to 300+ providers plus enterprise integrations"
        - id: security
          label: "Exit-readiness support"
          note: "APIs, SSO, MFA, and SOC 2 appear in official docs"
        - id: stale-mark
          label: "Stale price anchor"
          note: "Latest explicit valuation in the pool is the June 2021 $1B mark"
        - id: opacity
          label: "Current-economics opacity"
          note: "No public ARR, margin, burn, runway, or open KPI dashboard"
        - id: call
          label: "Recommendation"
          note: "Track / expensive / high risk until fresh private metrics are shared"
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV011, CV014]
callouts:
  - calloutType: recommendation
    title: Track until price support refreshes
    body: >-
      Bringg clears the "real business" test, but not the "public evidence supports
      this price" test. The underwriting path should start with current ARR, gross
      margin, burn, runway, retention, and cap-table data before taking valuation
      risk.
    claimRefs: [CV002, CV006, CV009, CV011, CV012]
  - calloutType: risk
    title: Stale unicorn mark is the core risk
    body: >-
      The strongest downside signal is not a proven product failure; it is the
      age of the last explicit price anchor. A 2021 $1B mark can only support a
      current entry decision if 2026 metrics show that Bringg materially outgrew
      its pandemic-era financing base.
    claimRefs: [CV005, CV006, CV015]
