  headquarters: Somerville, Massachusetts, USA
  productSummary: >-
    Professional 3D printers, proprietary materials, post-processing tools, print-prep software, and on-demand additive
    manufacturing services.
  customerFocus: >-
    Professional engineers, manufacturers, healthcare and dental teams, and smaller professional or entry-level users
    moving into higher-quality resin and SLS workflows.
  businessModel: Hardware sales, recurring materials and accessory sales, and on-demand parts service revenue.
