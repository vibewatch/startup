  topStrengths:
    - Broad SLA/SLS platform breadth plus materials, software, and on-demand services.
    - Real operating scale with 130,000+ printers sold and 500 million+ parts printed.
    - Form Studio 1 expands the funnel without abandoning the professional workflow stack.
  topRisks:
