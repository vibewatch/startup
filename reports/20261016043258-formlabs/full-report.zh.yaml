        - 公开材料未披露材料生产的冗余或应急安排细节。
      - - 覆盖 45+ 种材料和 100,000+ 客户的质量控制负担
        - 风险持续存在；故障率未披露
        - 在受监管和生产场景中后果严重
        - 公司披露设有专门的材料与参数团队
        - 重大
        - 指定来源池中没有公开的现场故障、退货率或召回数据。
      - - Studio 1 拓展家庭用户带来的支持与可靠性压力
        - 新用户类别提高了执行要求
        - 可靠性或安全性主张若不成立，后果严重
        - 处于早期；产品刚刚发布
        - 在现场数据成熟前维持高位
        - 没有披露任何公开的该新细分市场流失率、NPS、退货或支持工单指标。
      - - 深圳研发与本地制造布局带来的跨境执行复杂度
        - 当前已有运营接口；中断频率未知
        - 对发布和支持执行具有重大影响
        - 本地研发与办公布局已经建立
        - 重大
        - 没有披露任何公开的中国站点中断、出口摩擦或供应商替代应急计划。
    notes: 剩余风险仅根据指定来源文本判断；公开来源没有量化供应商冗余， 中断率或保修成本。
