      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: |-
              公开 领导层 证据 是 更强 在 运营者履历 而非 在 正式
              治理.  官方 名册 显示  在职能上 完整 班底 覆盖
              产品, 收入, 财务, 运营, 和 人才 领导层 围绕 联合创始人
              CEO Max Lobovsky, 这降低了 纯粹的 创始人-单一-点 风险 但 不
              消除 它 因为  产品 叙事 和 公司 身份 仍 贯穿
              Lobovsky. 独立报道 增加  更多 重要 2026 信号: Formlabs
              提升为 Dávid Lakatos 进入  总裁 而 Lobovsky 增加了  董事长
              标题 和 前 Apple 高管 Dan Riccio 加入担任  战略性 顾问 和
              投资者. 该 组合 更像 规模化准备 而不是  干净
              治理 降低治理风险的事件, 因为 公开 董事会构成, 投资者 控制权
              权利, 和 继任机制 保持 大体 私人.
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
