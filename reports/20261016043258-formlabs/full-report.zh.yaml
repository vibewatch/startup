              - CO007
      - number: '1.3'
        title: 融资、经济性与利益相关者
        blocks:
          - type: paragraph
            body: |-
              公开 资本结构 证据 仍是 弱于  运营 叙述.
              公司-发布的 和 汇总的 公开-来源 记录 仍 指向  可能 2021
              Series E 作为  最近 可见 估值 锚点 在 $2 billion, 与 六 披露的
              公开 轮融资 合计 $238.7 million 自……以来 2012. 更多 当前 经济性 是
              仅 仅部分可见:  联合发布的 October 2026 公司 发布 称 年度
              收入 现在 超过 $250 million, 但 那里 是 仍 没有 留存的 经审计的
              收入 报表, 没有公开 细分市场 拆分 在……之间 硬件, 材料, 软件,
              和 Form Now 服务, 和 没有 可见度 进入 现金创造, 债务, 或
              清算优先权. 该 意味着  投资判断 定位 是 仍 “已规模化 但
              不透明,” 不 “信息完整的后期复合增长公司.”
            claimRefs:
              - CO008
              - CO010
