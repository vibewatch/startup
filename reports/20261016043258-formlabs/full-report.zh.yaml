  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 基于证据的判断
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 已规模化的业务，但价格支撑不完整
        - 持续观察；不要强行进入
      - - 信心
        - 中
        - 公开证据具有方向性参考价值，但不足以完成估值判断
        - 形成判断前需要更新尽调
      - - 风险评级
        - 高
        - 旧估值、流动性可见度有限且价格竞争压力大
        - 先评估下行，再判断上行
      - - 估值立场
        - 昂贵
        - 相对于已披露的 2026 年证据，2021 年锚点已经过时
        - 只有在成交水平显著降低时才参与
      - - 进入纪律
        - 仅在价格合适时考虑
        - 需要当前价格发现和清晰的资本结构表
        - 等待更新条款或更强证据
    notes: 仅基于公开来源的截面判断；“昂贵”指相对于当前披露的 2026 年证据，2021 年锚点已过时，并不表示已验证的实时市场成交价。
    claimRefs:
      - CV005
      - CV007
