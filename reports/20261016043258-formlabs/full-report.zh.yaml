  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开规模证明和新的需求切口，仍被过时的价格锚点及不完整的价格发现所压过。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: '>$250M 年收入披露和广泛的企业使用场景'
        - id: wedge
          label: 新的低价切口
          detail: $699 的 Form Studio 1 加上起价 $29/L 的树脂扩大触达范围
        - id: attach
          label: 附着率上行空间
          detail: 如果采用率能站住，Form Now 与材料产品线可以进一步拉高客户终身价值
        - id: anchor
          label: 过时的融资锚点
          detail: 最新披露的融资仍是 2021 年 5 月的 Series E 轮，估值 $2B
        - id: pressure
          label: 估值倍数压缩风险
          detail: 独立报道显示，低端市场增长更快，竞争也更激烈
        - id: call
          label: 建议
          detail: 持续跟踪；在溢价买入前，要求提供最新审计财报、清晰的股权结构表和实时价格发现
      edges:
        - from: scale
          to: wedge
          label: 支撑更广阔市场的论点
        - from: wedge
          to: attach
          label: 创造变现上行空间
        - from: attach
          to: anchor
          label: 仍需通过旧估值关口
        - from: anchor
          to: pressure
          label: 提高对估值倍数压缩的敏感度
        - from: pressure
          to: call
          label: 促使入场更守纪律
    approximationNotes: null
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
