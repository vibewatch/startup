            body: |-
              公开 定价 显示 Formlabs 可以 拓宽 其 漏斗 在  低 end, 但  更多 重要 财务 解读-通过 是 是否 打印机 使用 持续 拉动 更高-价值 树脂, 粉末, 和 配件 支出 在……之后
