            - 终端部件
        - label: 重复工作负载
          detail: Tesla、MOSOLF、Ford、Brose 和 restor3D 描述了重复性的运营使用。
          touchpoints:
            - 每月部件
            - 多打印机生产
            - 临时任务
        - label: 生态扩张
          detail: 该模式可以通过材料、配件、软件工作流和新增打印机扩张。
          touchpoints:
            - 耗材
            - 后处理
            - 机队扩张
        - label: 耐久性尚未验证
          detail: 公开证据没有量化留存、流失、续约、重复购买或账户扩张。
          touchpoints:
            - NRR 和 GRR
            - 队列留存
            - 客户集中度
    approximationNotes: 按序排列的分析旅程，不是测量得出的转化漏斗；不推断转化率或各阶段人群规模。
    claimRefs:
      - CU002
      - CU011
      - CU012
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最重的剩余风险在于入门级扩张和私营公司披露，而不是基础产品能力。
    data:
      columns:
        - label: 可能性
          note: 基于指定的 2025-2026 年证据判断的近期概率。
        - label: 影响
          note: 对投资判断、利润率或论点存续的潜在影响。
        - label: 缓释成熟度
          note: 公开证据显示已有控制措施、而非仅有意图的程度。
        - label: 剩余严重程度
          note: 权衡公开缓释因素与剩余缺口后的净严重程度。
      rows:
        - label: 入门级 / 中国竞争
          note: Studio 1 进入的市场中，TCT 称四家深圳厂商占据 87% 的出货量。
          values:
            - text: 高
              tone: high
            - text: 高
              tone: high
            - text: 中
              tone: medium
              note: 品牌、工作流和材料有所帮助，但装机基数争夺尚未获胜。
            - text: 高
              tone: high
        - label: 受监管材料与安全性主张
          note: 医疗 / 牙科工作流加上面向消费者的相邻营销，放大了质量错误的后果。
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: high
            - text: 中
              tone: medium
              note: ISO 13485 和洁净室证据是真实的缓释因素，但公开法律清查并不完整。
            - text: 中
              tone: medium
        - label: 制造与供应链集中
          note: 垂直整合提升控制力，同时增加对内部材料业务的依赖。
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: high
            - text: 中
              tone: medium
            - text: 中
              tone: medium
        - label: 私营公司披露与融资
          note: 公开数据仍依赖独角兽叙事、无来源的收入片段和管理层引述。
          values:
            - text: 高
              tone: high
            - text: 高
              tone: high
            - text: 低
              tone: low
              note: 指定的公开证据未显示经审计报表、资本结构表条款或法律准备金细节。
            - text: 高
              tone: high
        - label: 供应商与渠道集中度不透明
          note: 指定来源描述了战略和地域变化，但没有量化单一来源部件、经销商份额或客户集中度。
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: high
            - text: 低
              tone: low
              note: 公开证据未显示冗余或集中度看板。
            - text: 高
