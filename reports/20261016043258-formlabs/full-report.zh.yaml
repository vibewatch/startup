      - CV012
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 基于证据的判断
      - 什么会改变判断
    rows:
      - - 正方：扩大装机基数
        - $699 的 Form Studio 1、起价 $29/L 的 Alpha Resins 以及 Form Now 扩大触达范围，同时保留全栈工作流
        - 证明低成本产品能够转化为经常性材料和服务收入，且不会导致利润率崩塌
      - - 正方：企业信誉依然真实
        - Formlabs 仍引用大型工业用户，并拥有覆盖 SLA、SLS、软件和材料的产品栈
        - 补充按垂直行业划分的经审计队列经济性，以及材料重复支出的证据
      - - 反方：旧估值已经过时
        - 最新披露的融资轮仍是 2021 年，公开流动性有限，低价位竞争正在加剧
        - 提供近期一级或二级成交价，以及当前经审计财务报表
    notes: 本表混合公司发布和独立来源；改变判断需要更新的定价证据，而不是更强的叙事。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 公开估值支撑
      - 概率信号
      - 下行 / 触发因素
    rows:
      - - 乐观
        - 低价硬件扩大装机基数，材料 / 服务附着率上升，当前成交价已经远低于 2021 年公开宣传口径
        - 仅部分支持；已有产品和服务证据，但缺少当前成交价和经审计经济性
        - 关注已披露增长、更强的服务采用，以及可信的近期价格发现
        - 若低价产品主要压低价格、而非深化变现，则情景失效
      - - 基准
        - 规模化品类领导者继续增长，但估值仍受过时融资历史和不完整经济性制约
        - 当前公开证据最支持的情景
        - 与 >$250M 收入披露、有限的流动性可见度及没有明确 IPO 计划相符
        - 若尽调显示附着率弱、现金创造能力弱或优先权更苛刻，则情景失效
      - - 悲观
        - 竞争压力和稀薄的私募市场流动性迫使估值相对 2021 年锚点重置
        - 独立的市场压力报道和缺乏实时定价为其提供了有力支持
        - 若当前估值仍不可得，或下沉市场扩张削弱利润率，悲观信号增强
        - 由疲软成交价、资本结构悬置或缺乏盈利性附着证据触发
    notes: 情景框架是定性的，因为指定来源池不包含当前经审计财务报表、公开可比公司或经验证的二级交易估值。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Formlabs 的公开发展轨迹从 2011 年创立、2021 年融资，延伸至 2025 年运营势头和 2026 年下沉市场推进。
    data:
      items:
        - date: '2011'
          label: 创立与 Form 1 使命
          detail: 三名 MIT 研究生创立 Formlabs，旨在让专业级 3D 打印更易负担。
          claimRefs:
            - CO001
        - date: 2012-09
          label: 众筹轮
          detail: GetLatka 记录的 $2.9 million 公开众筹轮，是留存记录中的首个资本事件。
          claimRefs:
            - CO011
        - date: 2013-10
          label: A 轮
          detail: GetLatka 将 $19 million 的 A 轮列为下一笔披露的融资。
          claimRefs:
            - CO011
        - date: 2016-08
          label: B 轮
          detail: GetLatka 列出 $35 million 的 B 轮，表明公司在后续规模化前持续获得私募资金支持。
          claimRefs:
            - CO011
        - date: 2018-04
          label: C 轮
          detail: GetLatka 列出 2018 年 4 月的 $30 million C 轮。
          claimRefs:
            - CO011
        - date: 2021-05
          label: 公开估值锚点下的 E 轮
          detail: 留存的公开记录指向 $150 million 的 E 轮和 $2 billion 的估值锚点。
          claimRefs:
            - CO011
        - date: '2024'
          label: 超越传统核心业务扩张
          detail: 3D Printing Industry 称，Formlabs 已从 SLA 扩展至 SLS，并于 2024 年收购 Micronics。
          claimRefs:
            - CO015
        - date: 2025-Q4
          label: 创纪录季度
          detail: VoxelMatters 报道称，收入、打印机出货量和材料销售均创历史新高，Fuse SLS 销售额同比增长超过 25%。
          claimRefs:
            - CO016
        - date: 2026-08
          label: 领导层扩张信号
          detail: 独立报道显示，Lobovsky 在继续担任 CEO 的同时出任董事长，Lakatos 出任总裁，Dan Riccio 则作为战略顾问和投资者加入。
          claimRefs:
            - CO007
        - date: 2026-10
          label: Form Studio 1 发布
          detail: Formlabs 开放订购售价 $699、面向更广泛入门级采用的打印机，11 月 16 日起发货，树脂起价 $29 每升。
          claimRefs:
            - CO012
            - CO013
            - CO014
            - CO015
    claimRefs:
      - CO001
      - CO007
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
