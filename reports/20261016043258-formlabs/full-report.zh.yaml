  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Formlabs 实际销售的产品
        blocks:
          - type: paragraph
            body: >-
              相关 市场 是 窄于 “所有 3D 打印” 和 更广泛 而非  单一 树脂-打印机 SKU. 公开 各来源一致将……定位为 Formlabs 作为  专业 增材-制造 平台 涵盖 SLA 和 SLS 打印机,
              材料, 软件, 和 后处理, 与  最新动作 旨在 降低  价格 门槛 用于 较小团队 和 首次 买方 而不是 放弃 专业 工作流. 该 重要 因为 Formlabs 是 不 竞争 仅 用于 消费者 小工具
              需求; 它 是 试图获取 工作流 其中 用户 关心 约 零件 质量, 可靠性, 经验证 材料, 和 从设计到零件的时间, 但 可以 没有 更久 证明……合理 传统 工业 价格 指出.  市场 边界 因此包括 专业
              桌面 树脂 系统, 粉末型 聚合物 系统 用于 功能零件, 材料 和 配件 该 创造 经常性 支出, 和 服务-驱动 入场 路径 用于 买方 其 需要 产出 在……之前 它们 投入 至 资本开支. 它 排除 金属
              增材制造, hobby-仅 丝材 需求 与 没有 专业 工作流 要求, 和 无关 工业 自动化 预算.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM015
      - number: '2.2'
        title: 市场规模视角指向不断增长的可触达聚合物打印市场
        blocks:
          - type: paragraph
            body: >-
              公开规模测算证据 是 方向性的 而不是 完整, 但 它 是 仍 有用. 3D 打印 行业’s 总结 的 CONTEXT 和 AMPOWER 显示 two 重要 视角: 入门级 硬件 出货量 和 收入 是 增长
              快速, 和  桌面 聚合物 细分市场 低于 €10,000 是 已经 大型 足够 至 接近  设备收入合计 的 工业 金属 和 聚合物 增材制造. Formlabs’ 发布 定价 用于 Form Studio 1
              在 $699 和 Alpha 树脂 在 $29/L 是 因此 最好 解读 作为  有意 转向 进入  最快-增长 价格-准入 层 的  市场 而不是  边缘 SKU 延伸. 在
               同一 时间,  公开记录 不 支撑  精确的 Formlabs-特定 TAM/SAM/SOM 堆栈, 因为
              既不 独立 市场 报告称 也不 公司 材料 披露 细分市场 转化率, 附加购买率, 或  清晰拆分 在……之间 工程, 牙科, 教育, 服务-服务商, 和 准专业用户 需求.  最稳妥 结论 是 该  可触达切口
              是 扩大 和 该 Formlabs 有 足够 价格 压缩 至 追求 它, 但 不够 公开 数据 至 量化  可辩护的 公司-特定 SOM.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM011
              - CM014
