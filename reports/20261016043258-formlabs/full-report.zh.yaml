chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与已披露规模
        blocks:
          - type: paragraph
            body: |-
              Formlabs 仍 将自己定位为  专业 3D-打印 公司 而不是
              广泛的工业综合企业: 留存的官方页面将业务根基追溯至
              2011 年三名 MIT 研究生的创立 和 定位 公司 围绕
              专业 SLA 和 SLS 系统, 专有 材料, 和 工作流 软件.
              最强的公开运营规模数据仍由公司披露，
              未经独立审计，但方向上有参考价值: 130,000+ 打印机
              已售出 130,000+ 台打印机，打印零件超过 500 million+ 个, 员工 750+ 人, 和 45+ 专有 材料.
              一个重要注意事项已经出现在官方叙述中: 
              同一 页面组 主张 都 十 全球 地点 在 正文 和 八 全球
              地点 在  KPI 卡片, 因此业务足迹应视为待核实的尽调事项
              而不是  已确定的 封面指标.
            claimRefs:
