companyProfile:
  summary: >-
    Formlabs 是一家成立于 2011 年、由三名 MIT 研究生创办的后期私人增材制造公司。公司销售专业 SLA 和 SLS 打印机、材料、软件、后处理工具，并提供 Form Now
    按需打印服务；如今，公开业务足迹已从成熟的专业工作流延伸到价格更低的 Form Studio 1 入门产品。公司似乎已经具备真实的运营规模和客户采用，但经审计收入构成、利润率结构及当前资本结构条款仍不透明。
