  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手 / 生态
      - 角色
      - 集中度 / 证据
      - 失效场景
      - 严重程度
      - 缓释措施
      - 剩余风险
    rows:
      - - 入门级渠道竞争
        - 深圳硬件厂商群（Bambu、Creality、Elegoo、Anycubic）
        - 价格与份额基准
        - TCT 称其占 2026 年第二季度入门级出货量的 87%
        - Studio 1 压缩毛利率，或未能赢得有意义的份额
        - 战略后果严重
        - 品牌、工作流、材料与易用性差异化
        - 在份额和单位经济性未披露前维持高位
      - - 材料制造与附着率经济性
        - 内部树脂制造加上源自 Spectra 的业务
        - 支撑经常性收入与质量控制
        - Formlabs 称材料至关重要，因此进行了垂直整合
        - 树脂瓶颈或质量问题会同时损害硬件采用和耗材毛利
        - 运营后果严重
        - 垂直整合与参数验证团队
        - 重大；冗余情况未披露
      - - 私募资本与估值支撑
        - 现有投资者、员工与二级市场买家
        - 为增长提供资金并设定价格预期
        - 公开记录仍依赖独角兽叙事和 2021 年 $2B 轮融资
        - 下一轮融资或流动性事件可能将企业重新定价至内部预期以下
        - 投资判断后果严重
        - 据报道的创纪录增长和广泛装机基数
        - 在审计业绩和优先权条款仍不可得时维持高位
    notes: 本表将有证据支持的依赖项与投资判断缺口放在一起；公开来源未披露客户 集中度、按地域划分的渠道组合或优先权层级条款。
