callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Formlabs looks strategically interesting, but the public record does not support
      paying the 2021 valuation anchor without fresh financial and market-clearing data.
    claimRefs: [CV005, CV007, CV011, CV012]
  - calloutType: strength
    title: Installed-base expansion is real
    body: >-
      The new $699 printer, $29-per-liter resin entry point, and Form Now service create
      a plausible path to widen adoption and monetize a bigger user base.
    claimRefs: [CV002, CV008, CV009, CV013]
  - calloutType: risk
    title: Multiple compression remains the core downside
    body: >-
      Independent industry reporting suggests Formlabs is broadening access in a market
      where lower-cost competitors are already moving upmarket, which can pressure both
      hardware pricing and private-market marks.
    claimRefs: [CV010, CV014]
