  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Current cap table, full liquidation preferences across all preferred series, anti-dilution terms, and any debt or structured-finance overhang.
      whyItMatters: Entry valuation and downside recovery cannot be underwritten confidently without knowing the real preference stack ahead of new money.
      diligencePath: Obtain the latest cap table, financing documents, and board-approved summary of liquidation preference and anti-dilution terms.
      relatedQuestionRefs: [QV006]
    - type: missing-source
      severity: material
      topic: current-financial-quality
      missingEvidence: Audited 2025-2026 revenue, gross margin, cash generation, and mix by hardware, materials, software, and services.
      whyItMatters: The recommendation is currently anchored on scale and strategy rather than on verified current economics that justify a private-market multiple.
      diligencePath: Request audited or board-approved financial statements plus line-of-business breakdowns and cohort economics.
      relatedQuestionRefs: [QV002, QV007]
    - type: missing-source
      severity: material
      topic: live-price-discovery
      missingEvidence: Recent primary round terms, verified secondary transactions, or internal marks that show where Formlabs clears today.
      whyItMatters: A stale 2021 financing anchor is not enough to assess present entry pricing or expected venture returns.
      diligencePath: Obtain recent secondary broker color, executed trade data, or management-approved internal valuation materials.
      relatedQuestionRefs: [QV001, QV005, QV007]
    - type: missing-source
      severity: minor
      topic: exit-timing
      missingEvidence: Management's current exit timing, IPO readiness milestones, and any formal process for liquidity.
      whyItMatters: Exit timing affects hold period and return expectations even if the core recommendation remains track.
      diligencePath: Ask management and the board for explicit exit planning materials, banker engagement status, and timeline assumptions.
      relatedQuestionRefs: [QV008]
