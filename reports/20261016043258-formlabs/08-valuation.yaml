      - ["Thesis: enterprise credibility remains real", "Formlabs still cites large industrial users and a product stack spanning SLA, SLS, software, and materials", "Add audited cohort economics by vertical and proof of repeat materials spend"]
      - ["Anti-thesis: old marks are stale", "Latest disclosed round is still 2021, public liquidity is limited, and competition is intensifying at lower price points", "Produce recent primary or secondary clears plus current audited financials"]
    notes: >-
      Table mixes company-issued and independent sources; changing the view requires
      updated pricing evidence rather than stronger narrative alone.
    claimRefs: [CV001, CV002, CV003, CV008, CV009, CV010, CV011, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Public valuation support
      - Probability signal
      - Downside / trigger
    rows:
      - ["Bull", "Cheap hardware expands the install base, materials/services attach rises, and current clearing is already far below the 2021 headline", "Partial only; product and service evidence exists, but current clearing and audited economics are missing", "Watch for disclosed growth, stronger service adoption, and credible recent price discovery", "Fails if cheaper products mainly compress price rather than deepen monetization"]
      - ["Base", "Scaled category leader keeps growing but valuation stays gated by stale financing history and incomplete economics", "Best-supported case from current public evidence", "Consistent with >$250M revenue disclosure, limited liquidity visibility, and no explicit IPO plan", "Breaks if diligence shows weak attach, weak cash generation, or harsher preferences"]
      - ["Bear", "Competitive pressure and thin private-market liquidity force a reset versus the 2021 mark", "Meaningfully supported by independent market-pressure reporting and lack of live pricing", "Signal rises if current marks stay unavailable or if downmarket expansion weakens margins", "Triggered by soft clearing prices, cap-table overhang, or no evidence of profitable attach"]
    notes: >-
      Scenario framing is qualitative because the assigned pool does not contain current
      audited financials, public comps, or verified secondary transaction marks.
    claimRefs: [CV005, CV006, CV007, CV010, CV011, CV013, CV014, CV015]
