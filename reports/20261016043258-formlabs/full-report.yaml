  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is broadening from premium hardware into recurring materials and services
        blocks:
          - type: paragraph
            body: >-
              Formlabs' public monetization model starts with hardware, but the retained evidence shows management
              repeatedly widening the attach surface around that initial sale. The company now markets systems from the
              $699 Form Studio 1 through the $4,499 Form 4, sells proprietary resins and powders, offers post-processing
              accessories, and operates Form Now as an on-demand parts service. That is directionally favorable for
              revenue quality because installed printers can pull recurring material demand over time, and management's
              own comments reported by 3D Printing Industry suggest materials could eventually outgrow equipment
              revenue. The caveat is that public pricing remains list pricing: the sources do not disclose realized
              ASPs, channel discounts, bundle attach, or how much of current revenue comes from equipment versus
              consumables versus services.
            claimRefs:
