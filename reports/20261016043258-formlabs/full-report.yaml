  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence-backed read
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Scaled business with incomplete price support
        - Monitor; do not force entry
      - - Confidence
        - Medium
        - Public evidence is directionally useful but not valuation-complete
        - Require fresh diligence before conviction
      - - Risk rating
        - High
        - Old mark, limited liquidity visibility, and competitive pricing pressure
        - Underwrite downside before upside
      - - Valuation stance
        - Expensive
        - 2021 anchor is stale relative to disclosed 2026 evidence
        - Only engage at a materially lower clearing level
      - - Entry discipline
