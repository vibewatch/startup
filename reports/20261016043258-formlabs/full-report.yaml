            - Wash and cure
            - Ventilation and VOC controls
        - label: Professional deployment
          detail: Form 4 and Fuse examples place equipment in engineering and factory workflows.
          touchpoints:
            - Rapid prototyping
            - Manufacturing aids
            - End-use parts
        - label: Repeated workload
          detail: Tesla, MOSOLF, Ford, Brose, and restor3D describe recurring operational use.
          touchpoints:
            - Monthly parts
            - Multi-printer production
            - Short-notice jobs
        - label: Ecosystem expansion
          detail: The model can expand through materials, accessories, software workflows, and additional printers.
          touchpoints:
