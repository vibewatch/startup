      - number: '3.3'
        title: Moat durability rests on ecosystem adoption while price pressure stays real
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a moat that, if it exists, sits in workflow adoption and recurring
              materials rather than in exclusive hardware. 3D Printing Industry reports Lobovsky's view that materials
              can become a larger revenue stream than equipment, and the Formlabs case-study surface frames in-house
              additive as a substitute for projects that would otherwise move to injection molding. That helps explain
              why the launch bundles software, extractor, wash/cure, and materials around the printer itself. At the
              same time, the same assigned pool shows how fragile pure hardware economics can be: TCT describes a
              segment already dominated by Shenzhen vendors and cites a Creality profit warning tied to price
              competition. Formlabs' Shenzhen office and China R&D footprint improve local access, but they do not
              eliminate commoditization risk.
            claimRefs:
