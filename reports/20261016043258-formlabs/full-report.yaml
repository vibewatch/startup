  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence-backed read
      - What would change view
    rows:
      - - 'Thesis: broaden the installed base'
        - >-
          Form Studio 1 at $699, Alpha resins from $29/L, and Form Now widen reach while preserving a full-stack
          workflow
        - Show that lower-cost entrants convert into recurring materials and service revenue without margin collapse
      - - 'Thesis: enterprise credibility remains real'
        - Formlabs still cites large industrial users and a product stack spanning SLA, SLS, software, and materials
        - Add audited cohort economics by vertical and proof of repeat materials spend
      - - 'Anti-thesis: old marks are stale'
        - >-
          Latest disclosed round is still 2021, public liquidity is limited, and competition is intensifying at lower
          price points
        - Produce recent primary or secondary clears plus current audited financials
