  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Formlabs is actually selling into
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than “all 3D printing” and broader than a single resin-printer SKU. Public
              sources consistently position Formlabs as a professional additive-manufacturing platform spanning SLA and
              SLS printers, materials, software, and post-processing, with the newest move aimed at lowering the price
              barrier for smaller teams and first-time buyers rather than abandoning professional workflows. That
              matters because Formlabs is not competing only for consumer gadget demand; it is trying to capture
              workflows where users care about part quality, reliability, validated materials, and time-to-part, but can
              no longer justify classic industrial price points. The market boundary therefore includes professional
              desktop resin systems, powder-based polymer systems for functional parts, materials and accessories that
              create recurring spend, and service-led entry paths for buyers who need output before they commit to
              capex. It excludes metal additive manufacturing, hobby-only filament demand with no professional workflow
              requirement, and unrelated industrial automation budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM015
      - number: '2.2'
        title: Sizing lenses point to a growing accessible polymer-printing wedge
        blocks:
          - type: paragraph
            body: >-
              The public sizing evidence is directional rather than complete, but it is still useful. 3D Printing
              Industry’s summary of CONTEXT and AMPOWER shows two important lenses: entry-level hardware shipments and
              revenue are growing quickly, and the desktop polymer segment below €10,000 is already large enough to
              approach the combined equipment revenues of industrial metal and polymer additive manufacturing. Formlabs’
              launch pricing for Form Studio 1 at $699 and Alpha Resins at $29/L is therefore best read as a deliberate
              move into the fastest-growing price-access layer of the market rather than a marginal SKU extension. At
              the same time, the public record does not support a precise Formlabs-specific TAM/SAM/SOM stack, because
              neither independent market reports nor company materials disclose segment conversion rates, attach rates,
              or a clean split between engineering, dental, education, service-bureau, and prosumer demand. The safest
              conclusion is that the addressable wedge is expanding and that Formlabs has enough price compression to
              pursue it, but not enough public data to quantify a defensible company-specific SOM.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
