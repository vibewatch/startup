  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Formlabs layers customer jobs, machine platforms, materials, software, and services into one
      additive-manufacturing workflow.
    data:
      layers:
        - label: Customer jobs
          detail: Rapid prototyping, manufacturing aids, end-use parts, and specialized medical or consumer workflows.
        - label: Print preparation
          detail: PreForm and validated settings set the file-to-material workflow before a build starts.
        - label: Monitoring and control
          detail: PreForm, Projects, and Form Mobile App prepare, stage, and monitor work.
        - label: Printer platforms
          detail: Form Studio 1 at the new entry point, higher-end Form 4 or 4L resin systems, and Fuse-family SLS systems.
        - label: Materials and post-processing
          detail: Alpha Resins, broader Formlabs materials, Wash+Cure, VOC Extractor, and optional Resin Tank Pro.
        - label: Services and support
          detail: Form Now and service-plan coverage extend the workflow beyond owned hardware.
    approximationNotes: >-
      This is a qualitative architecture stack assembled from retained launch and case-study evidence rather than a
      vendor-published system diagram.
