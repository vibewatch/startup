      - number: '4.2'
        title: Public traction is real, but unit economics are mostly proxy-based
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence is on commercial momentum rather than profitability. VoxelMatters and The 3D
              Printing Journal both describe record Q4 2025 results, with Formlabs reporting all-time highs in total
              revenue, printer shipments, and materials sales, while Fuse SLS printer sales were up more than 25% year
              over year. Official releases also show a large installed base and high cumulative usage, with more than
              130,000 printers on the market by April 2024 and more than 500 million printed parts by October 2026.
              Those data points support a credible installed-base monetization thesis, but they are not substitutes for
              gross margin, CAC, payback, retention, or working-capital metrics. The public record is good enough to
              argue demand and utilization, not good enough to underwrite margin durability.
            claimRefs:
