chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and disclosed scale
        blocks:
          - type: paragraph
            body: |-
              Formlabs still presents itself as a professional 3D-printing company rather than
              a broad industrial conglomerate: the retained official pages root the business in
              a 2011 founding by three MIT graduate students and position the company around
              professional SLA and SLS systems, proprietary materials, and workflow software.
              The strongest public operating-scale facts are still company-disclosed rather
              than independently audited, but they are directionally useful: 130,000+ printers
              sold, 500 million+ parts printed, 750+ employees, and 45+ proprietary materials.
              One important caveat already appears inside the official narrative itself: the
              same page family claims both ten global locations in prose and eight global
              locations in a KPI tile, so footprint should be treated as a live diligence item
              rather than a settled cover metric.
            claimRefs:
