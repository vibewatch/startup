        - from: hardware
          to: installed-base
          label: Places machines with users
        - from: installed-base
          to: usage
          label: Drives parts printed and materials consumption
        - from: usage
          to: materials
          label: Converts utilization into recurring spend
        - from: materials
          to: workflow
          label: Supports accessory and service attach
        - from: workflow
          to: proof-gap
          label: Economic quality depends on undisclosed margins and burn
