      - number: '3.2'
        title: Formlabs is using trust markers and packaging to defend against cheaper rivals
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation in the retained evidence is not a claim that Formlabs is the cheapest
              system. Instead, the company and multiple independent writeups emphasize a professional workflow at a
              lower entry price: $699 hardware, resins from $29 per liter, UL GREENGUARD Gold when used with Alpha
              Resins and the VOC Extractor, six skin-contact-certified launch resins, automatic dispensing and heating,
              and add-on wash/cure tooling. That mix matters because the pool does not retain equivalent compliance or
              workflow evidence for the low-cost cohort. The pricing comparison is therefore directionally clear even
              where rival package details remain unknown: Formlabs has lowered entry price, but it is still trying to
              win on reliability, safety, and workflow completeness rather than on printer list price alone.
