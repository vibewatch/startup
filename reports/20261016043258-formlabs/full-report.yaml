  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Formlabs' public model converts hardware placements into consumables, accessories, and service opportunities, but
      public disclosures stop short of margin proof.
    data:
      nodes:
        - id: hardware
          label: Hardware sale
          detail: Form Studio 1 starts at $699; Form 4 starts at $4,499.
          displayValue: $699 to $4,499+
          tone: positive
        - id: installed-base
          label: Installed base
          detail: Formlabs cited 130,000+ printers on the market by Apr 2024.
          displayValue: 130k+ printers
          tone: neutral
        - id: usage
          label: Printer utilization
          detail: 300M+ parts were cited in 2024 and 500M+ by Oct 2026; Q4 2025 materials sales also hit a record.
          displayValue: 300M+ to 500M+ parts
          tone: positive
        - id: materials
          label: Recurring consumables
          detail: >-
            Alpha Resins start at $29/L and Form 4 materials at $99/L; management says materials could outgrow equipment
            revenue.
          displayValue: $29/L to $99/L+
          tone: positive
        - id: workflow
          label: Workflow and service attach
          detail: Accessories, mobile software, and Form Now create additional monetization around the printer fleet.
          displayValue: Add-on attach
          tone: neutral
        - id: proof-gap
          label: Margin proof still private
          detail: Public evidence does not disclose realized pricing, gross margin by line, CAC, or current burn.
          displayValue: Underwriting gap
          tone: risk
