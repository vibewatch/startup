      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              Form Studio 1 illustrates how Formlabs packages hardware, materials, and software as one operating system
              for print production. The printer uses a Low Force Display-derived light engine with a custom lens array,
              28 LEDs, and 35-micron pixels, while automatic dispensing and heating reduce setup friction and Quick
              Release handling reduces manual removal work. Around that core, Formlabs ties print preparation to
              PreForm, multi-build management to Projects, monitoring to the Form Mobile App, and finishing to the
              Wash+Cure accessory. The result is a specific workflow architecture rather than a generic printer sale:
              Formlabs is trying to own file preparation, material qualification, machine operation, and post-processing
              in one loop.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
