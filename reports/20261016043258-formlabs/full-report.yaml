companyProfile:
  summary: >-
    Formlabs is a late-stage private additive-manufacturing company founded in 2011 by three MIT graduate students. It
    sells professional SLA and SLS printers, materials, software, post-processing tools, and Form Now on-demand printing
    services, with a public footprint that now extends from established professional workflows into the lower-priced
    Form Studio 1 entry point. The company appears to have real operating scale and customer adoption, but it remains
    opaque on audited revenue mix, margin structure, and current cap-table terms.
