        title: Exhibits
        blocks:
          - type: callout
            title: Downmarket, but still workflow-led
            body: >-
              Formlabs is not trying to win the new segment on bare printer price alone. The retained evidence centers
              on a bundled workflow argument: safety/compliance, automatic materials handling, post-processing, and
              mobile/software support around a $699 printer.
            calloutType: strength
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP012
              - CP013
          - type: callout
            title: Shipment scale and margin pressure already sit with Shenzhen-led vendors
            body: >-
              TCT's retained evidence shows how hard this move can be to monetize: the entry-level segment is already
              concentrated among Bambu, Creality, Elegoo, and Anycubic, and Creality has publicly signaled
              price-pressure pain. Formlabs enters that band as a challenger, not as the volume incumbent.
            calloutType: risk
            claimRefs:
