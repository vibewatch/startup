figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Formlabs' public arc runs from 2011 founding through 2021 financing, 2025 operating momentum, and a 2026
      downmarket push.
    data:
      items:
        - date: '2011'
          label: Founding and Form 1 mission
          detail: Three MIT graduate students founded Formlabs to make professional-quality 3D printing more affordable.
          claimRefs:
            - CO001
        - date: 2012-09
          label: Crowdfunding round
          detail: >-
            GetLatka records a public crowdfunding round of $2.9 million as the first capital event in the retained
            record.
          claimRefs:
            - CO011
        - date: 2013-10
          label: Series A
          detail: GetLatka lists a $19 million Series A as the next disclosed financing step.
          claimRefs:
            - CO011
        - date: 2016-08
          label: Series B
          detail: GetLatka lists a $35 million Series B, indicating continued private funding support before later scale-up.
          claimRefs:
            - CO011
        - date: 2018-04
          label: Series C
          detail: GetLatka lists a $30 million Series C in April 2018.
          claimRefs:
            - CO011
        - date: 2021-05
          label: Series E at public valuation anchor
          detail: Retained public records point to a $150 million Series E and a $2 billion valuation anchor.
          claimRefs:
            - CO011
        - date: '2024'
          label: Expansion beyond legacy core
          detail: 3D Printing Industry says Formlabs had already expanded from SLA into SLS and acquired Micronics in 2024.
          claimRefs:
            - CO015
        - date: 2025-Q4
          label: Record quarter
          detail: >-
            VoxelMatters reports all-time highs in revenue, printer shipments, and materials sales, with Fuse SLS sales
            up more than 25% year over year.
          claimRefs:
            - CO016
        - date: 2026-08
          label: Leadership scaling signal
          detail: >-
            Independent reporting says Lobovsky became chair while staying CEO, Lakatos became president, and Dan Riccio
            joined as a strategic adviser and investor.
          claimRefs:
            - CO007
        - date: 2026-10
          label: Form Studio 1 launch
          detail: >-
            Formlabs opened orders for a $699 printer aimed at broader entry-level adoption, with shipping from November
            16 and resin from $29 per liter.
          claimRefs:
            - CO012
            - CO013
            - CO014
            - CO015
    claimRefs:
      - CO001
      - CO007
      - CO011
      - CO012
      - CO013
