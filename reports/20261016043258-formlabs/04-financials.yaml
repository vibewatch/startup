callouts:
  - calloutType: "insight"
    title: "Recurring economics depend more on utilization than on entry price"
    body: >-
      Public pricing shows Formlabs can widen its funnel at the low end, but
      the more important financial read-through is whether printer usage keeps
      pulling higher-value resin, powder, and accessory spend after the
      hardware sale.
    claimRefs: ["CI003", "CI004", "CI005", "CI011"]
  - calloutType: "risk"
    title: "Downmarket expansion may trade volume for margin if materials economics disappoint"
    body: >-
      Independent coverage explicitly warns that lower-cost adoption still
      depends on materials, consumables, and post-processing economics, so the
      lower entry price should not be assumed to improve contribution margin.
    claimRefs: ["CI010", "CI012"]
  - calloutType: "recommendation"
    title: "Require a current cash-and-margin bridge before underwriting"
    body: >-
      The chapter supports commercial momentum, but not capital adequacy. A
      serious diligence process needs current cash, monthly burn, debt, revenue
      mix, gross margin by line, and realized pricing by channel before taking
      a view on runway or next-round dependency.
    claimRefs: ["CI009", "CI013"]
