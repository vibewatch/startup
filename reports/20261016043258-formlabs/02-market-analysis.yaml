      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Professional desktop resin printing
        - Hardware, validated resins, wash/cure, VOC accessories, workflow software
        - Hobby-only maker demand with no professional workflow requirement
        - Engineering managers, lab owners, educators, creators
        - Core expansion wedge opened by Form Studio 1 pricing and easier workflow
      - - Professional polymer production
        - SLS hardware, powders, post-processing, short-run functional parts
        - Metal additive systems and unrelated CNC/automation spend
        - Manufacturing and operations leaders
        - Keeps Formlabs in higher-value production workflows even as it moves downmarket
      - - On-demand additive services
        - Form Now service spend for buyers needing parts before printer ownership
        - General contract manufacturing not tied to additive workflows
        - Teams without capital budget but with immediate part demand
        - Creates low-friction trial path into later hardware adoption
      - - Education and entry-level professional channels
        - School packages, starter systems, partner-led bundles, open-material upsell
        - Consumer toy/novelty printing demand
        - Schools, labs, small businesses, first-time professional users
        - Broadens top-of-funnel beyond direct enterprise procurement
    notes: >-
      Boundary is evidence-constrained from public positioning, pricing, channel,
      and service signals; excluded spend marks adjacent categories that public
      sources mention but do not support as Formlabs core addressable revenue.
