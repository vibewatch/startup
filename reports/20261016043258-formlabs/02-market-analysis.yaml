figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Ordered public lenses from broad desktop polymer growth to Formlabs'
      narrower affordability and adoption proxies.
    data:
      items:
        - label: Desktop polymer equipment below €10,000
          displayValue: ~30% annual growth
          note: 2025 revenue approached combined industrial metal and polymer additive manufacturing equipment revenues.
          tone: neutral
        - label: Global entry-level printer demand
          displayValue: Q1 2026 units +39% / revenue +54%
          note: CONTEXT figures cited by 3D Printing Industry.
          tone: positive
        - label: Category hardware rebound
          displayValue: Q2 2026 revenue +31%
          note: Global hardware revenue growth cited by 3D Printing Industry.
          tone: positive
        - label: Formlabs affordability move
          displayValue: Printer $699 / resins $29 per liter
          note: Form Studio 1 lowers entry price while keeping a professional workflow pitch.
          tone: positive
        - label: Public installed-base proxy
          displayValue: 130,000+ printers / 300,000,000+ parts
          note: Expanded Ramblings summary of company stats.
          tone: neutral
        - label: Updated disclosed company scale
          displayValue: ">500 million parts / >$250M 2025 revenue"
          note: Fabbaloo summary of recent Formlabs disclosure; parts count conflicts with Expanded Ramblings.
          tone: neutral
    approximationNotes: >-
      Layers are ordered lenses, not a mathematically nested TAM/SAM/SOM
      bridge; mixed units are preserved because the fetched public sources do
      not provide a single comparable sizing stack.
    claimRefs:
      - CM002
      - CM004
      - CM005
      - CM008
      - CM009
      - CM014
callouts:
  - calloutType: insight
    title: Accessibility is the strategy, not just a SKU feature
    body: >-
      The consistent throughline across official and independent sources is that
      Formlabs is trying to collapse the gap between professional output quality
      and entry-level budgets, which expands the buyer pool without changing the
      company’s workflow-led positioning.
    claimRefs:
      - CM002
      - CM003
      - CM010
      - CM014
  - calloutType: risk
    title: Growth in entry-level demand does not guarantee Formlabs share
    body: >-
      The addressable wedge is growing, but the sub-$2,500 segment is already
      crowded and Chinese brands dominated reported entry-level shipments in Q2
      2026, so the open question is share capture rather than category existence.
    claimRefs:
      - CM004
      - CM005
      - CM011
