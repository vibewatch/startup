  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention"
      missingEvidence: >-
        Cohort-level NRR, GRR, logo churn, renewal, contract duration, satisfaction, materials
        repurchase, and fleet-expansion data by customer segment.
      whyItMatters: >-
        Named deployments prove use but cannot establish revenue durability, repeat purchasing, or
        the strength of the installed-base expansion loop.
      diligencePath: >-
        Request monthly account cohorts for the last 36 months, reconciled to invoiced hardware,
        materials, service, and software revenue, and interview retained and churned customers.
      relatedQuestionRefs:
        - "QU004"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Top-10 and top-25 customer revenue shares, vertical and geographic revenue mix, reseller and
        channel contribution, and single-customer or single-distributor dependencies.
      whyItMatters: >-
        A diverse public logo set does not reveal whether revenue or growth depends on a small number
        of accounts, sectors, geographies, or intermediaries.
      diligencePath: >-
        Obtain customer-level revenue and gross-margin data by quarter, channel, geography, and product
        family, then test loss and downsell scenarios for the largest exposures.
      relatedQuestionRefs:
        - "QU005"
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "named-customer-proof"
      missingEvidence: >-
        A complete current roster of named production deployments with start date, fleet size,
        utilization, paid status, renewal status, and measured outcome.
      whyItMatters: >-
        The public sample may overrepresent successful deployments and cannot support a representative
        outcome or production-adoption rate.
      diligencePath: >-
        Reconcile CRM, support, telemetry, and invoicing records to a sampled deployment register and
        independently reference-check customers across each major segment.
      relatedQuestionRefs:
        - "QU003"
        - "QU006"
      relatedTableRefs:
