    type: "journey-map"
    summary: >-
      Public evidence supports multiple acquisition and usage surfaces, while the retention and
      expansion links remain hypotheses requiring private cohort data.
    data:
      items:
        - label: "Accessible entry"
          detail: "Form Studio 1 lowers the reported hardware entry point to $699."
          touchpoints:
            - "Worldwide orders"
            - "Small offices, workshops, and new users"
        - label: "Workflow evaluation"
          detail: "Buyers assess print quality, safety, materials, post-processing, and total operating cost."
          touchpoints:
            - "Printer and resin"
            - "Wash and cure"
            - "Ventilation and VOC controls"
        - label: "Professional deployment"
          detail: "Form 4 and Fuse examples place equipment in engineering and factory workflows."
          touchpoints:
            - "Rapid prototyping"
            - "Manufacturing aids"
            - "End-use parts"
        - label: "Repeated workload"
          detail: "Tesla, MOSOLF, Ford, Brose, and restor3D describe recurring operational use."
          touchpoints:
            - "Monthly parts"
            - "Multi-printer production"
            - "Short-notice jobs"
        - label: "Ecosystem expansion"
          detail: "The model can expand through materials, accessories, software workflows, and additional printers."
          touchpoints:
            - "Consumables"
            - "Post-processing"
            - "Fleet expansion"
        - label: "Unverified durability"
          detail: "Public evidence does not quantify retention, churn, renewals, repeat purchase, or account expansion."
          touchpoints:
            - "NRR and GRR"
            - "Cohort retention"
            - "Customer concentration"
    approximationNotes: >-
      Ordered analytical journey, not a measured conversion funnel; no conversion rates or stage
      populations are inferred.
    claimRefs:
      - "CU002"
      - "CU011"
      - "CU012"
      - "CU016"
callouts:
  - calloutType: "strength"
    title: "Named production evidence is stronger than logo evidence"
    body: >-
      Tesla's reported monthly output, restor3D's multi-printer production line, and operational
      examples at MOSOLF, Ford, and Brose show products embedded in real workflows rather than merely
      appearing on a customer-logo page.
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU009"
  - calloutType: "risk"
    title: "Retention and concentration are not publicly measurable"
    body: >-
      Diverse use cases do not establish durable recurring revenue or a balanced customer base.
      Underwriting requires account-level cohorts, materials repurchase, fleet expansion, churn, and
      top-customer and channel exposure.
    claimRefs:
      - "CU010"
      - "CU012"
