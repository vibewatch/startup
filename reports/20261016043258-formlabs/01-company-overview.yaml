    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Max Lobovsky", "Co-founder, CEO, and chair", "Former Fab@Home leader with Cornell and MIT training in engineering and media arts.", "Founding product vision and category positioning still run through Lobovsky.", "High — strategy, storytelling, and long-horizon product ambition remain founder-centered."]
      - ["Dávid Lakatos", "President and Chief Product Officer", "Founded Sold. before joining Formlabs; co-founded FabLab Budapest.", "Product-led scaling operator with direct responsibility for roadmap and product development.", "Medium — leadership depth improved, but product expansion still concentrates here."]
      - ["Nick Graham", "Chief Revenue Officer", "Former CRO at EverQuote with engineering and MBA credentials.", "Owns sales and services execution as Formlabs broadens channels and end markets.", "Medium — revenue execution matters more as price points move downmarket."]
      - ["Daniel O’Shaughnessy", "Chief Financial Officer", "Former SharkNinja VP of Finance plus prior treasury, IR, and PwC diligence experience.", "Financial planning, treasury discipline, and investor communication bench are publicly visible.", "Medium — key for late-stage readiness, but limited public disclosure reduces external verification."]
      - ["Okan Okutgen", "Chief Operating Officer", "Former Bain consultant and internal GTM/finance leader before taking operations.", "Owns supply chain and manufacturing reliability as unit economics get tested at lower ASPs.", "Medium — execution risk rises with scale and price compression."]
      - ["Jennifer Raines-Loring", "Chief People Officer", "Former COO and SVP of People at Postscript.", "Adds organizational-scaling and talent leadership as the company passes 750 employees.", "Low to medium — important for scaling, but less central than founder/product/operations roles."]
    notes: Public leadership roster based on official company biographies plus one independent report on 2026 title changes.
    enumerationScope:
      coverage: exhaustive
      basis: The rows cover the full executive leadership roster publicly disclosed on the retained official company pages as of the run date.
    claimRefs: [CO006, CO007]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Founders and CEO", "Mission continuity and top-level decision making", "Founder control appears culturally central because Lobovsky remains the public face, chair, and CEO.", "Confirm founder equity, voting control, and any super-pro-rata or protective rights."]
      - ["President / product leadership", "Roadmap and platform expansion", "Lakatos' presidency suggests product leadership now carries broader operating authority beyond classic CPO scope.", "Request formal org chart, delegated authorities, and succession coverage."]
      - ["Revenue and services organization", "Commercial execution across printers, materials, partners, and Form Now", "Recurring materials usage and services attach likely matter as much as new hardware units for economics.", "Break out direct vs partner sales, services mix, and materials gross margin."]
      - ["Finance and operations leaders", "Cash discipline, manufacturing, and supply chain resilience", "CFO and COO are economically important because lower price points can expose inventory, margin, and working-capital stress.", "Provide 2025/2026 budget-vs-actuals, supplier concentration, and inventory turns."]
      - ["Employees and global footprint", "Execution capacity across R&D, go-to-market, and manufacturing", "750+ employees and an 8-10 location footprint represent real scale, but the location count is internally inconsistent.", "Provide current office list, headcount by function/region, and attrition for key teams."]
      - ["Outside investors / preferred holders", "Capital support and preference stack", "The last public mark remains a 2021 Series E at $2B, while ownership concentration and preference terms remain opaque.", "Deliver current cap table, board seats/observer rights, debt facilities, and any recent secondary pricing."]
    notes: Partial stakeholder map anchored in retained public evidence; investor identities and governance rights are materially incomplete.
    enumerationScope:
      coverage: partial
      basis: The map reflects only stakeholder groups visible in retained public sources rather than a full cap-table or board-level control schedule.
    claimRefs: [CO006, CO007, CO008, CO009, CO011, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Formlabs' public arc runs from 2011 founding through 2021 financing, 2025 operating momentum, and a 2026 downmarket push.
    data:
      items:
        - date: "2011"
          label: Founding and Form 1 mission
          detail: Three MIT graduate students founded Formlabs to make professional-quality 3D printing more affordable.
          claimRefs: [CO001]
        - date: "2012-09"
          label: Crowdfunding round
          detail: GetLatka records a public crowdfunding round of $2.9 million as the first capital event in the retained record.
          claimRefs: [CO011]
        - date: "2013-10"
          label: Series A
          detail: GetLatka lists a $19 million Series A as the next disclosed financing step.
          claimRefs: [CO011]
        - date: "2016-08"
          label: Series B
          detail: GetLatka lists a $35 million Series B, indicating continued private funding support before later scale-up.
          claimRefs: [CO011]
        - date: "2018-04"
          label: Series C
          detail: GetLatka lists a $30 million Series C in April 2018.
          claimRefs: [CO011]
        - date: "2021-05"
          label: Series E at public valuation anchor
          detail: Retained public records point to a $150 million Series E and a $2 billion valuation anchor.
          claimRefs: [CO011]
        - date: "2024"
          label: Expansion beyond legacy core
          detail: 3D Printing Industry says Formlabs had already expanded from SLA into SLS and acquired Micronics in 2024.
          claimRefs: [CO015]
        - date: "2025-Q4"
          label: Record quarter
          detail: VoxelMatters reports all-time highs in revenue, printer shipments, and materials sales, with Fuse SLS sales up more than 25% year over year.
          claimRefs: [CO016]
        - date: "2026-08"
          label: Leadership scaling signal
          detail: Independent reporting says Lobovsky became chair while staying CEO, Lakatos became president, and Dan Riccio joined as a strategic adviser and investor.
          claimRefs: [CO007]
        - date: "2026-10"
          label: Form Studio 1 launch
          detail: Formlabs opened orders for a $699 printer aimed at broader entry-level adoption, with shipping from November 16 and resin from $29 per liter.
          claimRefs: [CO012, CO013, CO014, CO015]
    claimRefs: [CO001, CO007, CO011, CO012, CO013, CO014, CO015, CO016]
