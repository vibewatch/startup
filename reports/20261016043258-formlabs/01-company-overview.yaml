  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: footprint
      missingEvidence: A current office/location roster that reconciles whether Formlabs operates in 8 or 10 global locations.
      whyItMatters: Geographic footprint is a cover metric and a proxy for support, hiring, and regional commercial capacity.
      diligencePath: Request the latest company office list and employee distribution by site from management.
      relatedQuestionRefs: [QO002]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited 2025 and year-to-date 2026 revenue, gross margin, cash flow, segment mix, and any debt or runway data.
      whyItMatters: A company-issued revenue floor above $250 million is useful but insufficient for underwriting profitability, burn, or valuation support.
      diligencePath: Request audited statements, management accounts, and board materials covering hardware, materials, software, and Form Now revenue mix.
      relatedQuestionRefs: [QO002, QO009]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: cap-table-governance
      missingEvidence: Current cap table, investor identities, board seats, observer rights, liquidation preferences, and any recent secondary pricing.
      whyItMatters: The last visible public valuation anchor is from 2021, so ownership and preference structure could materially change realized equity value.
      diligencePath: Obtain the latest capitalization table, financing documents, and board composition from management or the data room.
