evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: footprint
    missingEvidence: A current office/location roster that reconciles whether Formlabs operates in 8 or 10 global locations.
    whyItMatters: Geographic footprint is a cover metric and a proxy for support, hiring, and regional commercial capacity.
    diligencePath: Request the latest company office list and employee distribution by site from management.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited 2025 and year-to-date 2026 revenue, gross margin, cash flow, segment mix, and any debt or runway data.
    whyItMatters: >-
      A company-issued revenue floor above $250 million is useful but insufficient for underwriting profitability, burn,
      or valuation support.
    diligencePath: >-
      Request audited statements, management accounts, and board materials covering hardware, materials, software, and
      Form Now revenue mix.
    relatedQuestionRefs:
      - QO002
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: >-
      Current cap table, investor identities, board seats, observer rights, liquidation preferences, and any recent
      secondary pricing.
    whyItMatters: >-
      The last visible public valuation anchor is from 2021, so ownership and preference structure could materially
      change realized equity value.
    diligencePath: >-
      Obtain the latest capitalization table, financing documents, and board composition from management or the data
      room.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Active customer/account count, major-vertical split, and any repeat-purchase or installed-base utilization data.
    whyItMatters: >-
      Parts printed and printer shipments do not reveal customer concentration, cohort health, or breadth of recurring
      demand.
    diligencePath: Request customer-count, cohort retention, and top-customer exposure metrics tied to the latest quarter.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: Formlabs-specific segment mix, conversion rates, installed-base split, and materials attach-rate data
    whyItMatters: Precise TAM/SAM/SOM underwriting and valuation sensitivity need more than category growth and launch pricing.
    diligencePath: >-
      Request management reporting by end market, average system ASP, materials revenue mix, and Form Now conversion
      into hardware accounts.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: installed-base
    missingEvidence: Reconciled company disclosure for printers sold and parts printed
    whyItMatters: Installed-base scale is an adoption proxy used to judge ecosystem depth and recurring materials potential.
    diligencePath: >-
      Reconcile the latest official company stats page, press materials, and investor updates for one canonical
      installed-base data point.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: Independent data on buyer payback, switching cost, and consumables economics by segment
    whyItMatters: >-
      Adoption timing depends on whether lower entry price overcomes incumbent workflow inertia and third-party
      competition.
    diligencePath: >-
      Collect customer interviews, procurement data, and benchmarked total-cost-of-ownership studies across education,
      SMB, and engineering teams.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: competitor-packages
    missingEvidence: >-
      Current official or review-grade model-level pricing, materials cost, and post-processing detail for Bambu,
      Creality, Elegoo, Anycubic, Epax3d, and HP MJF 1200.
    whyItMatters: >-
      The chapter can place Formlabs directionally, but it cannot prove exact total-cost or package superiority without
      matched rival package data.
    diligencePath: >-
      Retain current direct product pages or current reviews for each named rival and rebuild the pricing and capability
      tables with matched package detail.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Win-loss data, reseller mix, materials attach rates, customer churn, and multi-homing behavior by product line.
    whyItMatters: >-
      Those inputs determine whether Formlabs' moat sits in workflow, channel, or consumables rather than in printer
      hardware alone.
    diligencePath: Request cohort-level CRM, distributor, and consumables attach data during management diligence.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Segment revenue split across printers, materials, accessories, software, and Form Now service, plus line-by-line
      gross margin.
    whyItMatters: >-
      Revenue quality and valuation both depend on whether recurring consumables and services are materially offsetting
      hardware cyclicality.
    diligencePath: >-
      Request monthly and annual product-line P&L, gross margin waterfall, and installed-base attach cohorts by printer
      family.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI008
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt schedule, covenant headroom, and runway assumptions.
    whyItMatters: >-
      Without a cash-and-burn bridge, the chapter cannot determine whether current growth is self-funded or whether a
      new financing round is structurally required.
    diligencePath: Request the latest board package, 13-week cash flow, debt agreements, and management base / downside runway model.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASPs, discounts, distributor rebates, financing terms, and accessory attach rates by channel.
    whyItMatters: Official list pricing can overstate monetization quality if discounting or channel mix is doing the work.
    diligencePath: Request invoice-level cohort data or a channel margin bridge for the last 8 quarters.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, pipeline conversion, and renewal / repurchase behavior for consumables.
    whyItMatters: >-
      Strong shipment growth is not enough to underwrite durable value creation without knowing how expensive that
      growth is.
    diligencePath: Request segment-level funnel metrics, sales productivity, and consumables reorder cohorts.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: stale
    severity: minor
    topic: source-weak-revenue
    missingEvidence: >-
      Audited or management-certified revenue figures that validate or replace the unattributed $750 million figure on
      GetLatka.
    whyItMatters: >-
      The reported 2024 revenue figure is directionally useful but cannot anchor valuation or runway analysis without
      traceable source support.
    diligencePath: Request audited financial statements or CFO-certified annual revenue by line and geography.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer-platform adoption metrics, repository activity, SDK usage, or partner implementation evidence for
      the Formlabs software surface.
    whyItMatters: >-
      Without developer-signal, it is hard to judge whether Formlabs' software layer is a real ecosystem moat or mainly
      an internal workflow wrapper.
    diligencePath: >-
      Review developer.formlabs.com documentation, changelogs, package registries, GitHub activity, and partner
      integration case studies tied to named production users.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Cohort-level failure rates, RMA data, warranty claims, service tickets, and customer renewal behavior for Form
      Studio 1 and other printer families.
    whyItMatters: >-
      Launch-period proof does not show whether the newest entry product will be reliable enough to protect Formlabs'
      premium workflow reputation at higher volume.
    diligencePath: >-
      Request product reliability dashboards, warranty cohorts, service response times, and gross-margin impact of
      replacements by product family.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: enterprise-trust
    missingEvidence: >-
      Public security, privacy, uptime, and enterprise compliance documentation beyond product-emissions and
      biocompatibility claims.
    whyItMatters: >-
      Enterprise buyers adopting connected print workflows need trust evidence that covers software and data handling,
      not only materials safety.
    diligencePath: >-
      Pull trust-center pages, status history, security certifications, privacy commitments, and enterprise deployment
      documentation from official surfaces.
    relatedQuestionRefs:
      - QE006
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: third-party-materials
    missingEvidence: >-
      A validated compatibility matrix showing which third-party resins work on Resin Tank Pro and whether certification
      or warranty conditions change.
    whyItMatters: >-
      The openness claim matters only if customers can predict performance, safety, and support consequences when they
      leave Formlabs materials.
    diligencePath: >-
      Request the third-party materials qualification list, test methodology, support policy, and any certification
      exclusions tied to non-Formlabs resins.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort-level NRR, GRR, logo churn, renewal, contract duration, satisfaction, materials repurchase, and
      fleet-expansion data by customer segment.
    whyItMatters: >-
      Named deployments prove use but cannot establish revenue durability, repeat purchasing, or the strength of the
      installed-base expansion loop.
    diligencePath: >-
      Request monthly account cohorts for the last 36 months, reconciled to invoiced hardware, materials, service, and
      software revenue, and interview retained and churned customers.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-10 and top-25 customer revenue shares, vertical and geographic revenue mix, reseller and channel contribution,
      and single-customer or single-distributor dependencies.
    whyItMatters: >-
      A diverse public logo set does not reveal whether revenue or growth depends on a small number of accounts,
      sectors, geographies, or intermediaries.
    diligencePath: >-
      Obtain customer-level revenue and gross-margin data by quarter, channel, geography, and product family, then test
      loss and downsell scenarios for the largest exposures.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete current roster of named production deployments with start date, fleet size, utilization, paid status,
      renewal status, and measured outcome.
    whyItMatters: >-
      The public sample may overrepresent successful deployments and cannot support a representative outcome or
