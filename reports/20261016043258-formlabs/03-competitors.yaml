        label: Accessibility / lower upfront cost
        min: 1
        max: 5
        low: Higher capex or outsourced path
        high: Lower capex and broader buyer reach
        description: Ordinal placement derived from retained price-band and segment evidence.
        scale: ordinal
      yAxis:
        label: Workflow trust / professional readiness
        min: 1
        max: 5
        low: DIY or unverified workflow in the assigned pool
        high: Retained evidence shows validated workflow or manufacturing trust markers
        description: Ordinal placement derived from retained compliance, workflow, and substitute evidence.
        scale: ordinal
      points:
        - label: Formlabs Form Studio 1
          x: 4
          y: 5
          note: $699 launch price paired with compliance and workflow claims.
          claimRefs: [CP003, CP010, CP011, CP012, CP013]
        - label: Formlabs broader platform
          x: 3
          y: 5
          note: Existing SLA/SLS platform and materials model keep the company anchored in professional workflows.
          claimRefs: [CP001, CP014, CP015]
        - label: Epax3d
          x: 4
          y: 2
