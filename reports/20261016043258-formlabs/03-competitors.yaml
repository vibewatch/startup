          claimRefs: [CP006]
        - label: Bambu / Creality / Elegoo / Anycubic cohort
          x: 5
          y: 2
          note: Entry-level shipment leaders with scale and price pressure, but no retained equivalent trust markers here.
          claimRefs: [CP008, CP009, CP016]
        - label: HP MJF 1200 / industrial incumbents
          x: 2
          y: 4
          note: Lower-barrier industrial polymer move, but still adjacent to desktop resin rather than identical.
          claimRefs: [CP007]
        - label: Injection molding / outsourced production
          x: 1
          y: 3
          note: Status quo keeps capex low, but official customer proof frames slower iteration as the trade-off.
          claimRefs: [CP015]
    approximationNotes: >-
      Coordinates are ordinal synthesis from assigned-pool evidence, not measured market-share or benchmark scores.
    claimRefs: [CP003, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP016]
callouts:
  - calloutType: strength
    title: Downmarket, but still workflow-led
    body: >-
      Formlabs is not trying to win the new segment on bare printer price alone. The retained
      evidence centers on a bundled workflow argument: safety/compliance, automatic materials
      handling, post-processing, and mobile/software support around a $699 printer.
    claimRefs: [CP003, CP010, CP011, CP012, CP013]
  - calloutType: risk
    title: Shipment scale and margin pressure already sit with Shenzhen-led vendors
    body: >-
      TCT's retained evidence shows how hard this move can be to monetize: the entry-level segment
      is already concentrated among Bambu, Creality, Elegoo, and Anycubic, and Creality has
      publicly signaled price-pressure pain. Formlabs enters that band as a challenger, not as the
      volume incumbent.
    claimRefs: [CP008, CP009, CP016, CP017]
