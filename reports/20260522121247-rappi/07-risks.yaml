  - id: operational-technical-security-risk
    title: Operational, Technical, and Security Risk
    body: >-
      Rappi's operational risk profile spans platform reliability, data security, courier safety,
      and physical infrastructure. On the security front, UpGuard's April 2026 vendor-risk report
      assigns Rappi a "B" security rating and flags that DMARC is not fully enforced and SPF
      records are set to a lenient policy—creating pathways for phishing campaigns that impersonate
      Rappi to target consumers and merchants. More critically, threat-intelligence firm Brinztech
      documented that Brazilian customer personally identifiable information (PII), CPF numbers, and
      payment credentials reportedly appeared for sale on dark-web markets, raising direct LGPD
      breach-notification and remediation obligations under Brazil's ANPD framework. Given that
      Rappi processes payment data across tens of millions of active users in ten countries, a
      confirmed breach at meaningful scale could trigger multi-country regulatory action, customer
      trust damage, and costly remediation. Cloud infrastructure is another concentration point:
      Rappi runs its entire multi-country platform on AWS, as confirmed by the company's own AWS
      innovator case study. A sustained AWS availability event in the Latin America regions Rappi
      relies on would simultaneously affect all ten markets. Downdetector data confirms that
      platform outages are a recurring user complaint across at least Peru and other Andean markets.
      Rappi's couriers operate in high-traffic urban environments in cities known for road
      congestion and limited cycling infrastructure, exposing Rappi to occupational accident
      liability—especially now that Ley 2466 mandates occupational risk insurance contributions.
      Rappi Turbo dark kitchens and direct-inventory dark stores add food-safety, cold-chain, and
      product-liability exposure that are different in kind from a pure marketplace model.
