      whyItMatters: >-
        Mexico CNBV demanded an exit plan; if other regulators replicate this approach,
        Rappi's fintech revenue could face further contraction beyond Mexico.
      diligencePath: >-
        Request SFC Colombia licensing documentation; search Banco Central do Brasil
        registered payment institution database; consult local counsel in each market.
      relatedQuestionRefs:
        - QR009

    - type: access-blocked
      severity: material
      topic: data-protection
      missingEvidence: >-
        Independent audit or certification confirming Rappi's LGPD compliance in Brazil,
