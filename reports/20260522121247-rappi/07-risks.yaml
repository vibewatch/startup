  - id: people-execution-kill-criteria
    title: People, Execution, and Kill Criteria
    body: >-
      Rappi's execution risk is shaped by leadership concentration, multi-country regulatory
      complexity, and a rapidly expanding operational scope requiring simultaneous mastery of food
      delivery, quick commerce, fintech, and logistics. Co-founder and CEO Simón Borrero remains
      the central operational and strategic decision-maker across a ten-country enterprise; key-man
      concentration at this scale without a clear succession plan is a diligence gap that
      investors must probe. Managing regulatory compliance across ten distinct legal systems—each
      with its own consumer protection, labor, fintech, data-privacy, and competition law
      regime—demands country-level legal and compliance teams whose overhead grows proportionally
      with market breadth. The simultaneous implementation of Colombia's Ley 2466 (labor), the
      Cundinamarca e-commerce ruling (consumer law), Brazil's LGPD expansion (data privacy), and
      the Mexico CNBV exit (fintech) illustrates the multi-vector regulatory burden. Rappi's
      Turbo direct-inventory model requires capital for dark-store buildout, cold-chain logistics,
      and inventory financing that a pure marketplace model avoids. Thesis-break triggers for
      investors include: (1) a second SIC enforcement action at a substantially higher fine that
      triggers multi-country copycat enforcement; (2) confirmed LGPD enforcement action in Brazil
      following the data-breach report; (3) iFood-Uber cross-sell achieving more than 20 percent
      share gain in Brazil within 18 months; (4) failure to achieve path-to-FCF before the
      Santander credit facility's maturity; and (5) CEO departure without an identified successor.
      Diligence asks include quantification of Ley 2466's per-delivery cost impact, a full LGPD
      compliance audit, an independent security assessment, a full litigation register across all
      ten operating countries, and a country-by-country regulatory licensing inventory.
