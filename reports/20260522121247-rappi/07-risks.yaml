callouts:
  - calloutType: risk
    title: SIC E-Commerce Reclassification Sets Structural Precedent
    body: >-
      The April 2026 Cundinamarca tribunal ruling that Rappi is a full e-commerce operator—not a
      marketplace intermediary—is a structural legal shift. It exposes Rappi to consumer guarantee,
      product-liability, and post-sale obligations across every vertical (food, grocery, pharma,
      retail, travel, fintech). Other Latin American jurisdictions may follow Colombia's lead,
      making this the single highest-severity regulatory risk in the portfolio.
    claimRefs:
      - CR003
      - CR004

  - calloutType: risk
    title: Ley 2466 Increases Structural Delivery Cost
    body: >-
      Colombia's Ley 2466 de 2025 mandates that platforms contribute 60% of gig couriers'
      health and pension payments plus 100% of occupational risk insurance. This is a permanent,
      legislated change to the unit economics of every delivery in Colombia—and if replicated in
      Brazil or Mexico, it would materially compress contribution margins across the majority of
      Rappi's GMV base. The precise per-delivery cost impact has not been publicly quantified and
      is a critical diligence ask.
    claimRefs:
      - CR006
      - CR007
      - CR037

  - calloutType: risk
    title: Brazil Data Breach Unconfirmed but Material
    body: >-
      Threat-intelligence reporting (Brinztech) indicates Brazilian customer PII, CPF numbers, and
      payment data appeared for sale on dark-web markets. Rappi has not publicly confirmed or
      denied the breach. If confirmed, Brazil's ANPD would likely open a formal investigation
      triggering mandatory breach notification, remediation obligations, and fines of up to BRL 50
      million per infraction. UpGuard's "B" rating and misconfigured email-security controls
      compound the reputational and regulatory exposure.
    claimRefs:
      - CR014
      - CR015
      - CR021

  - calloutType: insight
    title: iFood-Uber + Meituan Create a Two-Front Brazil Crisis
    body: >-
      Rappi faces simultaneous pressure in Brazil—its largest outside-Colombia market—from two
      well-capitalised entrants: iFood's integration with Uber (cross-promotion and bundle) and
      Meituan's USD 1 billion Keeta launch commitment. A coordinated price war or merchant
      exclusivity campaign could rapidly erode Rappi's Brazil position. This is the single most
      acute near-term competitive thesis-break scenario.
    claimRefs:
      - CR029
      - CR030
      - CR042

  - calloutType: recommendation
    title: Five Diligence Priorities Before Any Investment
    body: >-
      (1) Quantify the per-delivery cost impact of Ley 2466 relative to current courier cost
      structure. (2) Commission a full LGPD compliance audit and obtain Rappi's breach assessment.
      (3) Obtain independent cybersecurity assessment to validate DMARC/SPF and overall posture.
      (4) Request complete litigation register across all ten operating countries. (5) Confirm
      board succession plan and Santander covenant terms.
    claimRefs:
      - CR006
      - CR013
      - CR015
      - CR036
      - CR040

