        Quantifies the operational and legal liability exposure of Rappi's 200,000+ courier
        network, which is now more material given the occupational insurance mandate under Ley 2466.
      diligencePath: >-
        Request Rappi's internal occupational incident logs; review SURA or comparable insurer
        data; review labor ministry records in Colombia and Brazil.
      relatedQuestionRefs:
        - QR012

    - type: private-evidence-only
      severity: minor
      topic: fintech-regulatory
      missingEvidence: >-
        Full terms of the Banorte deal for Tarjetas del Futuro and a comparable assessment of
        RappiPay's regulatory status in Colombia and Brazil against Mexico's CNBV experience.
      whyItMatters: >-
        Understanding whether the CNBV exit is a one-country event or a signal of broader
        fintech regulatory challenges helps assess the durability of RappiPay and RappiCard
        in remaining markets.
      diligencePath: >-
        Request Banorte deal terms; obtain SFC Colombia licensing status for RappiPay;
        assess Banco Central do Brasil position on Rappi financial services.
      relatedQuestionRefs:
        - QR025

    - type: enumeration-incomplete
      severity: material
      topic: regulatory-enforcement
      missingEvidence: >-
        Complete litigation and regulatory action register across all ten Rappi operating
        countries (Argentina, Brazil, Chile, Colombia, Costa Rica, Ecuador, Mexico, Panama,
        Peru, Uruguay).
      whyItMatters: >-
        The visible Colombia SIC fine and Mexico CNBV exit are confirmed, but equivalent
        enforcement actions in Brazil (PROCON, ANPD), Argentina (CNDC), Peru, Ecuador,
        or Chile could not be independently confirmed from public sources.
      diligencePath: >-
        Request complete country-by-country litigation and regulatory action register from
        Rappi legal counsel; search each country's regulatory body databases.
      relatedTableRefs:
        - TR001

    - type: stale
      severity: minor
      topic: regulatory-compliance-status
      missingEvidence: >-
        Current confirmed compliance status of Rappi across all active regulatory frameworks
        in all ten operating countries, including any pending regulatory proceedings or
        investigations opened after April 2026.
      whyItMatters: >-
        Regulatory posture can change rapidly; the current chapter captures known proceedings
        as of May 2026 but cannot confirm Rappi's proactive compliance posture across markets.
      diligencePath: >-
        Request country-level regulatory compliance certificates and any pending investigation
        disclosures from Rappi's legal team across all jurisdictions.
      relatedQuestionRefs:
        - QR008

    - type: missing-source
      severity: material
      topic: fintech-regulatory
      missingEvidence: >-
        Confirmed regulatory licensing status of RappiPay in Colombia, Brazil, Peru, and
