evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and founder ownership levels.
    whyItMatters: >-
      Leadership concentration is visible, but governance quality cannot be fully assessed without board and cap-table
      detail.
    diligencePath: Request an up-to-date board deck, shareholder register, and governance org chart.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Exact current group headcount by function and country.
    whyItMatters: Headcount intensity affects unit economics, restructuring risk, and country-level operating leverage.
    diligencePath: Request HR headcount bridge by country, function, and contractor mix as of the run date.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: blocking
    topic: market-mix
    missingEvidence: Country-by-country revenue, GMV, and contribution margin mix across the nine operating markets.
    whyItMatters: >-
      Without market mix, later chapters cannot judge concentration, exit readiness, or whether Colombia/Mexico/Brazil
      drive the economics.
    diligencePath: Request geographic revenue/GMV bridge and market-level profitability cut for the last eight quarters.
    relatedQuestionRefs:
      - QO021
  - type: conflicting-data
    severity: material
    topic: valuation and stakeholder map
    missingEvidence: >-
      Primary documents for any 2025-2026 equity transaction or secondary price formation, plus the latest ownership and
      partner-economics schedule.
    whyItMatters: >-
      Open-source profiles point to new financing events, but there is no clean, broadly corroborated valuation mark
      after the 2021 Series F benchmark or full visibility into who now controls the economics.
    diligencePath: >-
      Request executed financing documents, latest 409A/fair-value memo, investor update describing 2025 capital events,
      and the current cap table / partner economics pack.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: TO004 milestone chronology
    missingEvidence: A management-verified chronology of product launches, regulatory actions, and market exits.
    whyItMatters: >-
      The public milestone record is useful but incomplete, which limits confidence that every key turning point and
      every internal reversal is captured in the chronology of record.
    diligencePath: >-
      Request an internal milestone log covering launches, market entries, exits, sanctions, and financing closings
      since founding.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Rappi SOM
    missingEvidence: >-
      Country-level GMV, take-rate, and revenue breakdown disclosed by Rappi to provide a verified SOM estimate rather
      than relying on third-party app-install extrapolations.
    whyItMatters: >-
      Without company-disclosed GMV and take-rates, SOM estimates carry a 2× confidence interval ($7B–$14B) that makes
      return projections highly sensitive to assumption choices. Valuation multiples anchored to a wide SOM range
      produce materially different investment outcomes.
    diligencePath: >-
      Request management presentation with country-level GMV, monthly order volume, average order value, and blended
      take-rate per vertical in due diligence.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    severity: material
    topic: gig worker regulation
    missingEvidence: >-
      Binding regulatory texts or final court rulings confirming gig-worker classification status country-by-country
      across all nine Rappi markets, with specific timeline and financial impact estimates.
    whyItMatters: >-
      If gig workers are reclassified as employees across two or more markets, Rappi's labor cost structure could
      increase 20–40%, potentially reversing the multi-quarter profitability claimed through 2025. The timing and scope
      of this risk is poorly quantified.
    diligencePath: >-
      Engage a LATAM labor law firm to produce a country-by-country regulatory risk memo covering current status,
      pending legislation, and leading court decisions.
    relatedQuestionRefs:
      - QM017
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: Rappi country market share
    missingEvidence: >-
      Verified country-by-country market share in Brazil, Argentina, Chile, Peru, Ecuador, Costa Rica, and Uruguay
      beyond the publicly reported Colombia and Mexico estimates.
    whyItMatters: >-
      Rappi's SAM and SOM estimates are sensitive to how large its position is in secondary markets. Without verified
      share data outside Colombia and Mexico, aggregate SOM projections carry compounding uncertainty.
    diligencePath: >-
      Third-party mobile analytics reports (e.g., Sensor Tower, Data.ai) can provide country-level app download and MAU
      share data; supplement with management data for revenue/GMV.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Rappi Prime subscriber count, churn rate, and average revenue per subscriber by country are not publicly
      disclosed.
    whyItMatters: >-
      Subscription stickiness is the clearest proxy for moat durability; without these figures it is impossible to
      quantify how much of Rappi's GMV is protected by switching cost vs. subject to multi-homing attrition.
    diligencePath: >-
      Request Rappi Prime subscriber cohort data (monthly retention curves, ARPU by market) from the company directly
      during due diligence.
    relatedQuestionRefs:
      - QP013
      - QP016
  - type: missing-source
    severity: material
    topic: competitive-strategy
    missingEvidence: >-
      Rappi's public competitive response strategy to Meituan Keeta's Brazil entry has not been publicly articulated as
      of May 2026.
    whyItMatters: >-
      Keeta's $1B commitment and subsidised-entry playbook directly targets Rappi's Turbo quick-commerce business in
      Brazil; absence of a counter-strategy is itself a risk signal.
    diligencePath: >-
      Request management's Brazil competitive defence plan and any internal analysis of Keeta's pilot economics in São
      Paulo and Rio de Janeiro.
    relatedQuestionRefs:
      - QP023
  - type: stale
    severity: minor
    topic: market-share
    missingEvidence: >-
      Country-level MAU market share data is primarily sourced from SensorTower's 2024 analysis; 2026 data reflecting
      Keeta entry and 99Food Brazil relaunch is not publicly available.
    whyItMatters: >-
      Competitive share can shift materially in 12-18 months during active market-entry campaigns; 2024 data may
      understate disruption already underway.
    diligencePath: Subscribe to SensorTower or Apptopia 2026 quarterly LatAm delivery report for updated competitive share data.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: material
    topic: valuation-competitive
    missingEvidence: >-
      Rappi's ~64% valuation decline from the $5.25B Series F has not been formally assessed for its impact on talent
      retention, commercial negotiations, or investor confidence in the IPO pipeline.
    whyItMatters: >-
      Valuation compression relative to rivals like MercadoLibre (NASDAQ-listed, growing 49% YoY) affects Rappi's
      ability to use equity for M&A, offer competitive compensation packages, and negotiate partner deals at scale.
    diligencePath: >-
      Obtain cap table structure, employee equity terms, and any data room materials on competitive talent attrition vs.
      MercadoLibre and other tech platforms in Colombia and Mexico.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: minor
    topic: pricing-comparison
    missingEvidence: >-
      Exact pricing comparison data for Rappi Prime vs. iFood Clube vs. Meli+ subscriptions across all LatAm markets is
      not fully documented from primary sources; local pricing pages and press reports provide partial coverage only.
    whyItMatters: >-
      Subscription price anchoring affects consumer switching decisions; without precise cross-market pricing the
      comparison table uses analyst estimates that may not reflect current promotional pricing or country-specific
      rates.
    diligencePath: >-
      Request current Rappi Prime, iFood Clube, and Meli+ pricing schedules from each company's pricing pages and verify
      against app store subscription listings as of the diligence date.
    relatedQuestionRefs:
      - QP014
  - type: missing-source
    severity: minor
    topic: competitive-strategy
    missingEvidence: >-
      No primary-source public data quantifies the extent to which Rappi's fintech moat (RappiPay/RappiCard user scale,
      transaction volume) stacks up against MercadoLibre's Mercado Pago in terms of active users, transaction volume, or
      credit book size.
    whyItMatters: >-
      The durability of Rappi's competitive moat depends heavily on the relative scale of its financial services vs.
      Mercado Pago; without comparative fintech metrics the moat comparison relies on qualitative assessments only.
    diligencePath: >-
      Source MercadoLibre's Mercado Pago active user counts and transaction volumes from MELI quarterly earnings, and
      request comparable RappiPay user and transaction data from Rappi directly.
    relatedQuestionRefs:
      - QP019
  - type: missing-source
    severity: blocking
    topic: financial-gaps
    missingEvidence: >
      Audited consolidated parent-level financial statements (P&L, balance sheet, cash flow) for Rappi S.A.S. or its
      holding company for 2022–2025.
    whyItMatters: >
      Without audited financials, EBITDA claims, net revenue figures, and margin estimates cannot be independently
      verified; any valuation or underwriting decision rests on unaudited management statements and third-party analyst
      estimates.
    diligencePath: >
      Request audited annual financial statements from management as a condition of any investment process; cross-check
      with RappiPay's publicly filed quarterly statements and Sacra estimates to identify material discrepancies.
