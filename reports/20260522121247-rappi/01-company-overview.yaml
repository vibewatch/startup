company:
  name: Rappi
chapter:
  number: 1
  title: Company Overview
  summary: 'Rappi remains a founder-led Latin American super-app with meaningful consumer reach, but the cleanest public underwriting anchors are still historical: the 2021 $5.25B Series F benchmark, the scale claims around 35M users and nine countries, and the recent evidence that fintech and financing strategy are being selectively reshaped rather than uniformly expanded. The overview therefore supports a view of substantial platform optionality paired with elevated governance, regulatory, and disclosure risk.'
sections:
- id: identity-and-footprint
  title: Identity, operating footprint, and platform logic
  body: Rappi remains one of Latin America’s most recognisable consumer technology brands because it has broadened far beyond restaurant delivery into a regional convenience-and-fintech ecosystem. Public profiles and Rappi’s own merchant-facing surfaces consistently describe the company as a super-app rather than a single-category marketplace. The official site stresses that more than 40,000 allied merchants already work with Rappi in nine countries, while Yahoo Finance and other profile aggregators describe a footprint of 400-plus cities and more than 35 million active users. That scale matters because Rappi is simultaneously selling convenience to consumers, demand generation to merchants, and income opportunities to couriers. Even so, public disclosure remains stronger on operating breadth than on audited group economics. The platform story is clear; the underlying marketplace profitability and country-by-country contribution remain partially opaque.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO036
  tableRefs:
