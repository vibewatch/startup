- id: milestones-and-adverse-signals
  title: Strategic milestones now include retrenchment, labor pressure, and consumer sanctions
  body: Rappi’s current profile cannot be understood only through growth milestones. The company’s evolution into a super-app included the rapid-commerce push behind Rappi Turbo, a stated move toward sustained EBITDA profitability, and deeper fintech product development in Colombia. But the same period also produced clear evidence of strategic pruning and regulatory strain. In Mexico, Rappi withdrew from the IFPE licensing process, shut down Rappicuenta, and then sold the RappiCard business to Banorte under a long-term commercial agreement. In Colombia, labor inspections led to a 2025 agreement on courier conditions, and the SIC followed in April 2026 with a COP 4.0 billion sanction tied to systemic consumer-rights failures. Those events matter because they push Rappi’s story away from pure scale and toward institutional execution risk. They also illustrate that Rappi’s operating moat now depends as much on compliance discipline and partner management as on merchant density or delivery speed.
    Later chapters should therefore treat regulatory discipline, partner dependence, and operating reliability as first-order underwriting variables, not side notes.
