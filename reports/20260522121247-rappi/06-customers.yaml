  - id: concentration-risk-adverse-evidence
    title: Concentration Risk and Adverse Evidence
    body: >
      Colombia's Superintendencia de Industria y Comercio (SIC) fined Rappi more than
      4 billion Colombian pesos — approximately USD 1.09 million — in April 2026 following
      two independent investigations. Portafolio, El Tiempo, and Forbes Colombia reported
      the SIC's finding that violations were systemic rather than isolated: the agency
      cited unauthorized charges for Rappi Prime and Rappi Pro subscriptions, misleading
      advertising for the "Turbo" delivery service, and repeated non-compliance with prior
      regulatory orders. El Tiempo specifically characterized the SIC findings as reflecting
      structural deficiencies in Rappi's consumer protection compliance, not edge-case
      operational failures. This regulatory action, combined with persistent consumer
      complaint platform scores of 1.1–1.3/5, constitutes the most material adverse
      customer evidence in the record and points to a customer service infrastructure
      that does not scale adequately with the platform's transaction volume. Customer and
      merchant concentration risk is partially mitigated by Rappi's breadth: 125,000+
      partner businesses distributed across nine countries and multiple verticals makes
      any single merchant departure non-catastrophic at the portfolio level. However, no
      public source discloses the GMV share of Rappi's top 10 or top 20 merchants,
      making concentration unquantifiable without private due diligence materials.
      Mexico represents the largest single-market concentration risk: as Rappi's largest
      MAU market, any regulatory, competitive, or economic shock in Mexico would have
      outsized revenue impact. Brazil is the highest competitive risk: iFood holds dominant
      market share, and Rappi may remain sub-scale in the country's largest consumer market.
      Grips and Sacra data project a 20–50% decline in Rappi's e-commerce revenue in 2026,
      a reversal that, if realized, would sharply compress the financial cushion available
      to invest in customer experience improvements. On the expansion side, Rappi embeds
      financial products (RappiPay, RappiCard, RappiBank) to increase lifetime value and
      generate cross-product switching costs; Amazon's USD 25 million 2025 investment
      targets logistics integration in Brazil and Mexico to expand the addressable customer
      pool; and the R2 fintech partnership provides working capital loans to merchants,
      deepening B2B stickiness. Rappi's PESTLE analysis identifies consumer trust and
      regulatory compliance as the two highest-priority external threats to customer
      retention in its core markets.
