chapter:
  number: 6
  title: Customers
  summary: >
    Rappi serves more than 5.5 million monthly active users across nine Latin American
    countries, with Mexico, Colombia, and Brazil as its largest markets, and more than
    125,000 merchant partners across food, grocery, pharmacy, fintech, and logistics
    verticals. Production deployments with analytics vendors (Amplitude, Splunk, AWS,
    LogRocket) demonstrate genuine scale and operational maturity, while publicly
    documented regulatory fines in Colombia and persistently low consumer complaint
    platform scores reveal structural customer-service deficiencies that represent a
    durable retention risk.

sections:
  - id: customer-base-segmentation
    title: Customer Base and Segmentation
    body: >
      Rappi's customer ecosystem contains three distinct principal segments: B2C consumers
      who order on-demand food, grocery, pharmacy, alcohol, and courier items from a single
      app; merchant partners (restaurants, supermarkets, pharmacies, electronics stores,
      and FMCG brands) who pay commissions and access Rappi's logistics infrastructure;
      and couriers (Rappitenderos) who serve as the supply-side workforce.
      As of 2025, Rappi counts more than 5.5 million monthly active users and over
      125,000 partner businesses across nine countries — Mexico, Brazil, Colombia, Peru,
      Argentina, Chile, Ecuador, Costa Rica, and Uruguay — spanning more than 400 cities.
      Mexico is the largest single market by monthly active user count and order volume,
      driven by high urban smartphone penetration and an underserved quick-commerce segment.
      Colombia, Rappi's home market, commands more than 50% food delivery market share,
      approximately 3 million active shoppers, and more than 30,000 affiliated businesses,
      reflecting the deepest brand entrenchment. Brazil is the highest-growth target but
      remains contested by iFood's dominant position. Rappi's consumer base skews toward
      urban millennials and Gen Z users in major metropolitan areas, a demographic whose
      income elasticity and digital nativity align well with on-demand delivery economics.
      The platform covers nine service verticals from a single app — food, grocery, pharmacy,
      alcohol, travel, fintech (RappiPay, RappiCard, RappiBank), and person-to-person courier
      — which is the structural foundation of its super-app retention thesis. Website traffic
      data shows approximately 4.6 million monthly sessions as of January 2026, with a
      conversion rate of 3–3.5% and an average order value in the USD 225–250 range, consistent
      with a marketplace operating at commercial scale in an emerging-market context. Rappi
      also targets B2B enterprise clients for last-mile logistics, merchant analytics
      dashboards, and embedded financing, though this segment's size and revenue contribution
      are not publicly disclosed.
