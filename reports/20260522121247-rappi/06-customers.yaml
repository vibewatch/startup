  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: merchant-concentration
      missingEvidence: >
        GMV share attributable to Rappi's top 10 and top 20 merchant partners, broken
        down by country and vertical, to quantify single-merchant concentration risk.
      whyItMatters: >
        Customer concentration in a handful of QSR or grocery chains could create
        outsized GMV volatility if a major merchant migrates to a competitor or
        internalizes delivery; without data, this risk cannot be sized.
      diligencePath: >
        Request merchant revenue concentration schedule in data room; confirm whether
        any merchant accounts for more than 5% or 10% of consolidated GMV.
      relatedQuestionRefs:
        - QU014

    - type: missing-source
      severity: material
      topic: customer-retention
      missingEvidence: >
        Rappi-specific monthly cohort retention curves, NRR, and GRR by segment
        (B2C consumers, Rappi Prime subscribers, merchant partners) and by country.
      whyItMatters: >
        Without cohort retention data, it is impossible to determine whether Rappi's
        5.5M MAU figure reflects genuine stickiness or a leaky bucket propped up by
        heavy acquisition spend; industry benchmarks (3–25% at month 1) confirm the
        risk is real.
      diligencePath: >
        Request monthly cohort retention analysis by acquisition channel and country
        in due diligence; request Rappi Prime subscriber ARPU vs. non-Prime ARPU.
      relatedQuestionRefs:
        - QU007

    - type: private-evidence-only
      severity: minor
      topic: subscription-scale
      missingEvidence: >
        Actual Rappi Prime and Rappi Pro subscriber count as of May 2026, and the
        subscriber base growth rate achieved against the company's 2x doubling target.
      whyItMatters: >
        The Prime subscriber base is Rappi's highest-LTV, lowest-churn consumer cohort;
        its size and growth rate are a leading indicator of long-term retention trajectory.
      diligencePath: >
        Request Prime subscriber count from investor materials or management disclosures;
        confirm monthly order frequency and ARPU for Prime vs. non-Prime cohorts.
      relatedQuestionRefs:
        - QU012

    - type: enumeration-incomplete
      severity: material
      topic: named-merchant-customers
      missingEvidence: >
        Names of Rappi's top restaurant chains, grocery supermarkets, and pharmacy brands
        operating on the platform, with deployment scale, contract terms, and revenue
        contribution, to complete the named customer proof enumeration in TU003.
      whyItMatters: >
        The current named customer proof table (TU003) covers only technology and analytics
        vendors; Rappi's core merchant partners (food chains, grocery chains) are not
        publicly named. Without named merchant evidence, the enumeration is limited to
        vendor deployments and cannot confirm commercial depth with Rappi's actual paying
        business customers.
      diligencePath: >
        Request named merchant list with transaction volume or GMV contribution per
        merchant tier; review any publicly available partnership press releases; examine
        Rappi's marketplace app to identify exclusive or featured brand partnerships.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU026

