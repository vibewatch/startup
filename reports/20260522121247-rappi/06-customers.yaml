    title: Customer segmentation table
    columns:
      - Segment
      - Buyer/User/Payer Role
      - Use Case
      - Scale
      - Revenue/Strategic Value
      - Key Gap
    rows:
      - - B2C Consumers
        - User & Payer
        - On-demand delivery (food, grocery, pharmacy, alcohol, courier)
        - 5.5M+ MAU across 9 countries
        - Primary GMV driver; high-frequency orders underpin commission revenue
        - NRR, GRR, and cohort churn undisclosed
      - - Restaurant/Food Merchants
        - Partner & Payer (commissions ~15–30%)
        - Menu listing, order routing, promotional advertising, analytics
        - Majority of 125,000+ partner businesses
        - Core commission revenue; algorithmic visibility drives merchant ad spend
        - GMV split by merchant category not disclosed
      - - Grocery/Pharma/Retail Merchants
        - Partner & Payer (commissions)
        - Inventory listing, express (TurboFresh) delivery
        - Growing vertical; size undisclosed
        - Strategic for super-app breadth and basket-size expansion
        - Market share vs. competing delivery channels unknown
      - - B2B Enterprise (corporates)
        - Payer for logistics services
        - Last-mile delivery, employee meal programs, business analytics
        - Small but growing; no public count
        - Higher margin and lower structural churn than B2C consumers
        - No disclosed enterprise revenue or customer count
      - - Fintech Customers
        - User/Payer
        - RappiPay, RappiCard, RappiBank digital banking products
        - Millions of payment users (undisclosed active count)
        - Cross-sell revenue; increases consumer LTV and platform lock-in
        - Active fintech user count and monthly transaction volume undisclosed
      - - Couriers (Rappitenderos)
        - Supply-side workforce
        - Independent contractor last-mile delivery fulfillment
        - 350,000+ active couriers across 9 countries
        - Platform enabler; not a revenue source
        - Labor classification regulatory risk; not a paying customer segment
    notes: >
      Scale figures are from third-party analyst sources (Sacra, DMR) as of 2025;
      Rappi does not publicly disclose segment-level GMV, MAU breakdown, or fintech
      adoption metrics. Commission rate range (~15–30%) is merchant-reported and varies
