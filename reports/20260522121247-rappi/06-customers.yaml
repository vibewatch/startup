  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Driver / Risk Factor
      - Type
      - Impact
      - Diligence Path
    rows:
      - - RappiPay/RappiCard/RappiBank cross-sell
        - Expansion driver
        - Increases consumer LTV; financial services lock-in reduces delivery-only churn
        - Verify active RappiCard users; monthly transaction volume; revenue per fintech user
      - - Rappi Prime/Pro subscription
        - Expansion driver
        - Recurring fee revenue; higher-frequency orders from subscribers vs. non-subscribers
        - Confirm actual Prime subscriber count and ARPU uplift vs. non-Prime cohort
      - - B2B enterprise last-mile logistics
        - Expansion driver
        - Higher margin than B2C; contract-based delivery reduces churn volatility
        - Request enterprise customer count, average contract value, and renewal rate
      - - Merchant financing (R2 fintech partnership)
        - Expansion driver
        - Increases B2B merchant stickiness; loan dependency creates switching cost
        - Verify loan book size, default rate, and merchant retention improvement
      - - Amazon logistics integration (Brazil/Mexico)
        - Expansion driver
        - Expands addressable order volume; Amazon demand routed to Rappi network
        - Confirm orders currently routed; exclusivity terms; projected GMV uplift
      - - Restaurant/QSR chain dependence
        - Concentration risk
        - Major chain exits (e.g., large QSR brand in Colombia or Mexico) could move GMV
        - Request GMV share from top 10 merchants; examine exclusivity or preferred-partner terms
      - - Brazil market under-scale vs. iFood
        - Concentration risk
        - Sub-scale position in LatAm's largest market limits revenue and brand potential
        - Monitor Rappi Brazil MAU trend vs. iFood; confirm 2026 Brazil revenue share
      - - Mexico single-market concentration
        - Concentration risk
        - Mexico is largest market; regulatory or competitive shock amplified
        - Verify Mexico revenue as % of total consolidated revenue; geographic diversification
      - - SIC regulatory enforcement (Colombia)
        - Concentration risk
        - Consumer trust damage and compliance costs in home market
        - Obtain SIC compliance roadmap; confirm remediation timeline post-2026 fine
    notes: >
      Expansion driver revenue contribution is not publicly disclosed; impact assessments
      are qualitative. Concentration risk metrics (GMV share by merchant, country revenue
      split) require private diligence materials. SIC fine (April 2026) is documented;
      remediation status is not publicly confirmed.
