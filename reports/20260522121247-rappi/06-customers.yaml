figures:
  - id: FU001
    title: Customer Journey Map — Rappi B2C Consumer Lifecycle
    type: journey-map
    layout: wide
    summary: >
      Six-stage consumer lifecycle from discovery through cross-sell and advocacy,
      showing where each stage creates or risks losing value.
    data:
      items:
        - label: Discovery
          description: >
            App store organic search, word-of-mouth referrals, paid social ads, and
            restaurant co-marketing; heavy promo-code deployment lowers first-session friction
        - label: Registration & First Order
          description: >
            Account creation with phone number or social login; promo code redemption; first
            order is the key CAC activation event tracked in Amplitude and LogRocket
        - label: Repeat Usage
          description: >
            2+ orders per month across food and grocery; algorithm surfaces the consumer to
            high-converting restaurants; merchant ad spend increases visibility in app feeds
        - label: Premium Adoption
          description: >
            Rappi Prime or Rappi Pro subscription for free deliveries, cashback, and exclusive
            discounts; subscription converts transactional users to recurring-fee relationships
        - label: Cross-Sell Activation
          description: >
            RappiPay QR wallet, RappiCard credit card, RappiBank digital account, and travel
            bookings embed financial services into the delivery loop; fintech LTV amplifier
        - label: Advocacy & Referral
          description: >
            App Store reviews, social sharing, referral codes, and merchant advertising spend;
            satisfied users lower net CAC; merchant growth unlocked by platform-level ratings
    claimRefs:
      - CU004
      - CU007
      - CU014
      - CU025
      - CU037

