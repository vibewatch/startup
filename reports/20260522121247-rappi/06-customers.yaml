callouts:
  - calloutType: strength
    title: Multi-Technology Production Deployments Confirm Platform Scale
    body: >
      Named, published case studies from Amplitude, Splunk, AWS, and LogRocket collectively
      confirm that Rappi operates a production-grade multi-country platform at genuine scale
      — not a pilot or prototype. Quantified vendor outcomes (90%+ MTTR reduction, +10% first
      orders, -30% CAC) are reproducible diligence anchors that independent auditors can
      validate. This level of tech-vendor adoption depth is uncommon among private LatAm
      platforms of equivalent age.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU014

  - calloutType: risk
    title: SIC Regulatory Fine and Complaint Platform Scores Signal Structural Customer Service Risk
    body: >
      Colombia's SIC fined Rappi USD 1.09 million in April 2026 for systemic consumer
      protection violations, citing unauthorized subscription charges, misleading advertising,
      and repeated non-compliance with prior orders. Trustpilot (1.1/5) and PissedConsumer
      (1.3/5) corroborate structural deficiencies. If customer service quality does not scale
      with transaction volume, churn will accelerate at a time when Rappi's 2026 revenue
      is already projected to decline 20–50% by Grips and Sacra analysts.
    claimRefs:
      - CU030
      - CU031
      - CU032
      - CU033

  - calloutType: insight
    title: App Store vs. Complaint Platform Rating Divergence Is Structurally Explained
    body: >
      Rappi's 4.6/5 App Store rating and 1.1/5 Trustpilot score are not contradictory —
      they reflect different user cohorts. App Store raters are active daily users who derive
      convenience value; Trustpilot raters are users who experienced billing fraud, theft,
      or support failure. The divergence indicates that the product works well for the majority
      but that the minority who experience failures receive inadequate service, creating
      regulatory and reputational risk that is disproportionate to the absolute complaint volume.
    claimRefs:
      - CU021
      - CU023
      - CU024

