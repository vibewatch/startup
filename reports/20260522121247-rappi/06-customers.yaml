  - id: adoption-trajectory-named-proof
    title: Adoption Trajectory and Named Customer Proof
    body: >
      Rappi grew monthly active users by approximately 37% year-over-year in 2023, reaching
      5.5 million MAU — an above-average growth rate for a mature-stage delivery super-app
      operating across nine countries. The company reported approximately $505 million in
      e-commerce revenue in 2025, a 5–10% increase from the prior year, and achieved
      profitability in 2025 driven by operational efficiency gains and scale-driven margin
      improvement. The Splunk case study provides the clearest scale signal: Rappi's platform
      processed more than 8.8 million orders per month across nine countries and maintained
      that throughput during a 300% order surge with Splunk Observability Cloud deployed in
      production, reducing mean time to incident resolution by more than 90%.
      Named technology vendor deployments offer the strongest independent customer proof
      available for a private-market platform. Amplitude Analytics is embedded at the heart
      of Rappi's growth function: the Amplitude case study documents a 10% increase in
      first-order completions and a 30% reduction in customer acquisition cost through
      behavioral segmentation, with 240 internal team members using Amplitude data weekly
      — an integration depth that signals production maturity rather than pilot. AWS provides
      Rappi's full cloud infrastructure for its marketplace, payments system, and delivery
      operations across all nine countries, a multi-year partnership that validates the
      platform's cloud-native architectural durability. LogRocket monitors Rappi's frontend
      user experience in production, with documented improvements in first-order conversion
      and reduced session abandonment. Marvik AI deployed production AI systems including
      semantic search, AI-powered merchant dashboards, and delivery route optimization —
      an early-stage AI vendor relationship that signals Rappi's appetite for AI integration
      but lacks independently validated outcomes. These technology deployments collectively
      confirm that Rappi operates a production-grade platform at scale rather than a
      pilot-stage product; however, all the evidence originates from vendor case studies,
      which carry inherent confirmation bias, and no independent audit or third-party review
      corroborates the quantified outcomes.
