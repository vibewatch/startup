companyProfile:
  summary: >-
    Rappi is a Bogotá-founded (2015) Latin American super-app operating across nine
    countries and 400-plus cities. It aggregates food and grocery delivery, ultra-fast
    Turbo dark-store fulfilment, cloud kitchens, fintech products (RappiPay, RappiCard),
    travel, and an Amazon Prime–style subscription (Rappi Pro/Pro Black) on a single
    platform. With more than 5.5 million monthly active users and 40,000-plus allied
    merchants, it is the most expansive multi-vertical consumer platform in Latin America
    by country footprint. The company is founder-led by Simón Borrero (CEO), Sebastián
    Mejía, and Felipe Villamarín, and backed by SoftBank, Andreessen Horowitz, DST Global,
    Sequoia Capital, and T. Rowe Price.
  foundedDate: "2015-01-01"
  founders:
    - name: "Simón Borrero"
      role: "Co-founder and CEO"
      background: >-
        Leads Rappi's strategic direction; most visible executive in current company
        profiles and IPO capital-markets messaging.
      claimRefs:
        - CO007
        - CO008
    - name: "Sebastián Mejía"
      role: "Co-founder"
      background: >-
        Central to the company's founding identity in external profiles; current
        operating remit less clearly disclosed.
      claimRefs:
        - CO009
    - name: "Felipe Villamarín"
      role: "Co-founder"
      background: >-
        Part of the core founding bench; operational role in public disclosures is
        limited compared with Borrero.
      claimRefs:
        - CO009
  foundingLocation: "Bogotá, Colombia"
  headquarters: "Bogotá, Colombia"
  productSummary: >-
    A super-app platform offering on-demand delivery of food, groceries, alcohol,
    and pharmacy items via Rappi Turbo dark stores; cloud kitchen infrastructure;
    a fintech suite (RappiPay digital wallet, RappiCard credit card in partnership
    with Banco Davivienda in Colombia and formerly Banorte in Mexico); a Rappi Pro
    subscription membership; and embedded B2B analytics and logistics services for
    merchant and FMCG partners.
  customerFocus: >-
    Urban consumers in Latin America's nine largest markets (Colombia, Mexico, Brazil,
    Argentina, Chile, Peru, Ecuador, Uruguay, Costa Rica) seeking convenience across
    food, grocery, pharmacy, and fintech; FMCG and restaurant brands seeking digital
    demand generation; and couriers seeking flexible income.
  businessModel: >-
    Take-rate marketplace: merchant commissions (~75% of net revenue at 10–30% of
    order value), in-app advertising fees from brands and restaurants (~13%), Rappi
    Pro/Pro Black subscription revenue (~10%), and direct e-commerce (~2%). Secondary
    revenue from RappiPay interchange and lending products is strategically material
    but not separately disclosed at the parent level.
  stage: "Late-stage private (Series F vintage, pre-IPO)"
  fundingStatus: >-
    Last primary equity round was a $496 M Series F in July 2021 at $5.25 B post-money
    valuation. September 2022 close marked at $5.36 B per Forge Global cap-table data.
    No new primary equity since then. 2025 debt activity: $100 M senior secured loan
    (Santander + Kirkoswald, August 2025), $25 M Amazon convertible note (September 2025),
    and undisclosed Gramercy Funds debt (October 2025). Total lifetime capital estimated
    at $2.3–2.6 B across 21 rounds.
  disclosureProfile: "private-undisclosed"
