callouts:
  - calloutType: risk
    title: iFood's Brazil Dominance Creates a Structural SAM Ceiling
    body: >-
      Brazil represents approximately 38% of Latin American e-commerce GMV and is the region's
      single largest market. iFood's estimated 89% food delivery market share makes Rappi's re-entry
      commercially non-viable without a fundamentally different strategy. This is not a cyclical
      headwind—it is a durable competitive moat that caps Rappi's delivery TAM until the Brazil
      situation changes. Diligence should probe whether Rappi's fintech products (RappiPay) can
      access Brazilian consumers independently of the delivery app, or whether the Brazil constraint
      extends to the entire product stack.
    claimRefs:
      - CM018
      - CM035

  - calloutType: insight
    title: Unbanked Population Creates a Mega-TAM for Rappi's Fintech Stack
    body: >-
      Approximately 100 million Latin American adults remain unbanked. Digital wallet adoption
      quadrupled from 11% to 43% between 2021 and 2025, and 68% of non-digital-payment users
      say they are likely to adopt. Rappi's logistics network gives it a distribution advantage
      over standalone fintechs: RappiPay can be seeded via cash-top-up agents co-located with
      delivery operations, bridging the cash-to-digital gap for consumers who already trust the
      Rappi brand. The fintech TAM expands as banked share grows, making RappiPay's opportunity
      structurally larger in 2030 than it is today.
    claimRefs:
      - CM024
      - CM025
      - CM026
      - CM028

  - calloutType: assumption
    title: SOM Estimates Carry Wide Uncertainty Absent Revenue Disclosure
    body: >-
      All SOM estimates for Rappi's food delivery GMV ($7–14B annually by 2026) derive from
      third-party market share approximations applied to regional market-size estimates, not from
      company-disclosed GMV or take-rate data. The 2× range (7B–14B) reflects genuine uncertainty
      in both the denominator (market size) and the numerator (Rappi's share). A key diligence step
      is obtaining at minimum country-level GMV confirmation and take-rate ranges from Rappi
      management before underwriting any SOM-based revenue projection.
    claimRefs:
      - CM015
      - CM016
      - CM020

