  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Rappi SOM
      missingEvidence: >-
        Country-level GMV, take-rate, and revenue breakdown disclosed by Rappi to provide
        a verified SOM estimate rather than relying on third-party app-install extrapolations.
      whyItMatters: >-
        Without company-disclosed GMV and take-rates, SOM estimates carry a 2× confidence
        interval ($7B–$14B) that makes return projections highly sensitive to assumption
        choices. Valuation multiples anchored to a wide SOM range produce materially
        different investment outcomes.
      diligencePath: >-
        Request management presentation with country-level GMV, monthly order volume,
        average order value, and blended take-rate per vertical in due diligence.
      relatedQuestionRefs:
        - QM002

    - type: missing-source
      severity: material
      topic: gig worker regulation
      missingEvidence: >-
        Binding regulatory texts or final court rulings confirming gig-worker classification
        status country-by-country across all nine Rappi markets, with specific timeline and
        financial impact estimates.
      whyItMatters: >-
        If gig workers are reclassified as employees across two or more markets, Rappi's
        labor cost structure could increase 20–40%, potentially reversing the multi-quarter
        profitability claimed through 2025. The timing and scope of this risk is poorly
        quantified.
      diligencePath: >-
        Engage a LATAM labor law firm to produce a country-by-country regulatory risk
        memo covering current status, pending legislation, and leading court decisions.
      relatedQuestionRefs:
        - QM017
        - QM024

    - type: private-evidence-only
      severity: minor
      topic: Rappi country market share
      missingEvidence: >-
        Verified country-by-country market share in Brazil, Argentina, Chile, Peru,
        Ecuador, Costa Rica, and Uruguay beyond the publicly reported Colombia and
        Mexico estimates.
      whyItMatters: >-
        Rappi's SAM and SOM estimates are sensitive to how large its position is in
        secondary markets. Without verified share data outside Colombia and Mexico,
        aggregate SOM projections carry compounding uncertainty.
      diligencePath: >-
        Third-party mobile analytics reports (e.g., Sensor Tower, Data.ai) can provide
        country-level app download and MAU share data; supplement with management
        data for revenue/GMV.
      relatedQuestionRefs:
        - QM022
