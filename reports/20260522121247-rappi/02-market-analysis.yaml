  - id: sizing-contradictions-and-diligence-gaps
    title: Sizing Contradictions and Diligence Gaps
    body: >-
      The most consequential sizing contradiction is the 6× spread between narrow food-delivery
      TAM estimates ($12.9 billion platform-based, 2024) and broad total-food-transaction estimates
      ($78.6 billion+). This divergence is not analyst error but reflects fundamental differences
      in market definition—platform GMV vs. all food spend addressable by tech—and carries direct
      implications for valuation multiples applied to Rappi's GMV.

      Non-cash digital payment transaction growth in LATAM is expected to exceed 20% CAGR through
      2028, led by real-time payment infrastructure. Brazil's Pix is already cited as achieving
      more than 90% consumer adoption domestically, creating a case study Rappi can point to for
      what normalized digital payment rails do to e-commerce and delivery platform take-rates in
      subsequent years. The LATAM fintech digital payment sub-segment alone is projected to reach
      $663.88 billion by 2033 at 7.5% CAGR (Fitch Ratings/DataCube Research), dwarfing the
      delivery-specific TAM and anchoring the super-app fintech cross-sell opportunity.

      Market fragmentation across hundreds of local quick-service restaurants limits Rappi's
      commission negotiating power in early-stage markets, a structural challenge that persists
      until platform density creates lock-in. Inflation and currency volatility—particularly in
      Argentina—erodes real GMV and complicates cross-market unit economics benchmarking.
      Financial inclusion rates in Colombia and Peru rose by 45–50 percentage points in digital
      wallet ownership between 2021 and 2025, confirming that the fintech opportunity is not
      static: the TAM for RappiPay expands as the banked share grows.

      Key unresolved gaps include: country-level GMV and take-rate disclosure needed to
      triangulate SOM estimates; definitive regulatory timelines for gig-worker reclassification
      in each Rappi market; and independent verification of Rappi's claimed profitability in
      multiple quarters, which if sustained would validate the unit economics thesis despite
      structural cost pressures.
    claimRefs:
      - CM041
      - CM042
      - CM043
      - CM044
      - CM045

