  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Rappi
      - Diligence Ask
    rows:
      - - Rising smartphone penetration (~78% by 2023)
        - Driver
        - Current / ongoing
        - Expands addressable consumer base; lowers onboarding friction
        - Does penetration reach Rappi's target Tier-2 city demographics?
      - - Urbanization in LATAM megacities
        - Driver
        - Medium-term (5–10 yr)
        - Higher delivery density improves unit economics in new cities
        - Does Rappi's city-expansion roadmap track fastest-growing urban centers?
      - - Digital payment normalization (Pix, open finance)
        - Driver
        - Current / near-term
        - Removes cash friction; enables seamless digital-native onboarding
        - Which Rappi markets lack equivalent real-time payment infrastructure?
      - - Unbanked population seeking financial inclusion
        - Driver
        - Near-term (1–3 yr)
        - Large fintech TAM; RappiPay/RappiBank structurally differentiated
        - What is RappiPay's customer acquisition cost vs. traditional fintech competitors?
      - - Rising middle class and disposable income
        - Driver
        - Medium-term
        - Increases willingness-to-pay for convenience premium
        - How does ARPU vary by income quintile across Rappi's markets?
      - - iFood dominance in Brazil (~89% share)
        - Constraint
        - Current / structural
        - Blocks access to ~38% of LATAM e-commerce GMV
        - Can Rappi re-enter Brazil, partner with iFood, or monetize Brazilian logistics differently?
      - - Gig-worker reclassification regulation
        - Constraint
        - Near-term (1–3 yr)
        - May increase effective labor cost 20–40% if contractors reclassified
        - Which countries have binding regulatory decisions pending, and at what threshold?
      - - Last-mile logistics costs (~30% of revenues)
        - Constraint
        - Current / structural
        - Structural headwind to profitability; requires high order density to offset
        - At what order-per-hour-per-zone density does delivery become contribution-positive?
    notes: >-
      Direction and timing assessments are qualitative judgments based on analyst sources (Kearney,
      IMARC, Fitch Ratings) and independent news sources. "Constraint" rows reflect factors that
      limit market access or margin, not absolute blockers. Timing is approximate and country-specific;
      gig-worker regulation timing may vary by three or more years across the nine Rappi markets.
    claimRefs:
