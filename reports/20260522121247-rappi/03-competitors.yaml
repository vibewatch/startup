chapter:
  number: 3
  title: Competitors
  summary: Rappi faces a highly fragmented Latin American competitive landscape anchored by iFood's near-monopoly in Brazil (>80% MAU share), DiDi Food/99Food's growing presence in Mexico and Brazil, PedidosYa's dominance across 15 countries, and MercadoLibre's logistics-fintech flywheel. Rappi's genuine moats—delivery cost efficiency (~10% of GMV vs. 32% for Uber Eats), multi-vertical super-app ecosystem, and first-mover scale in Colombia—are real but face structural displacement risks from the Uber-iFood platform integration, Meituan's Keeta $1 billion Brazil entry, and MercadoLibre's accelerating logistics investment.

sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: 'Rappi competes across four distinct competitive tiers in Latin America. The first tier is direct delivery super-apps: iFood, DiDi Food (branded 99Food in Brazil), Uber Eats, and PedidosYa, which all offer on-demand restaurant and grocery delivery at city-scale. The second tier is the integrated e-commerce and logistics platform MercadoLibre, whose Mercado Envios same-day logistics and Mercado Pago fintech together replicate the breadth of Rappi''s super-app but serve a somewhat different buyer occasion (next-day delivery and planned purchase vs. ultra-fast impulse). The third tier includes new and re-entering disruptors: Meituan''s Keeta, which announced a $1 billion, five-year Brazil commitment in May 2025, and DoorDash, which explored Brazil in 2023 but did not proceed. The fourth tier is the status-quo substitute—WhatsApp-based restaurant ordering, phone delivery, and informal couriers—which still accounts for a meaningful share of restaurant delivery volume in less-urbanised LatAm markets.

    Country market share is highly concentrated and country-specific. iFood commands over 80 percent of mobile monthly active users in Brazil and is effectively a monopoly there. Rappi holds roughly 64 percent MAU share in Colombia, its home market, but only about 17 percent of total LatAm MAU across all countries. PedidosYa (owned by Delivery Hero) leads in Argentina at 61 percent MAU, and operates across 15 countries. DiDi Food holds approximately 38 percent MAU in Mexico, competing closely with Rappi at 36 percent. Uber Eats, after exiting Brazil and Argentina, retains only about 7 percent LatAm MAU concentrated in Mexico. This fragmentation means no single platform dominates the region, and Rappi must defend multiple geographies simultaneously against entrenched local champions and well-capitalised newcomers.'
