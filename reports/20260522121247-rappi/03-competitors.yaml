callouts:
- calloutType: strength
  title: Rappi's Delivery Economics Are Class-Leading
  body: 'Sacra''s analysis estimates Rappi''s delivery costs at approximately 10 percent of GMV—a figure significantly below Uber Eats (32%), Zomato (14%), and Meituan (16%). This structural cost advantage, likely driven by high route density in core urban markets and Turbo dark-store proximity, gives Rappi room to price competitively or invest in subsidies without burning at the same rate as historical peers. It is the clearest signal that Rappi''s operating model has genuine efficiency, and it is the primary lever that could support sustainable EBITDA at scale.'
  claimRefs:
  - CP029
  - CP044

- calloutType: risk
  title: Uber-iFood Integration Is a Step-Change Competitive Threat in Brazil
  body: 'The November 2025 Uber-iFood app integration—formally announced by Uber IR in May 2025—combines Brazil''s dominant delivery platform with Brazil''s dominant ride-hailing platform in a single cross-service UX. Joint subscriptions and deeper integration are stated as roadmap items. For Rappi, which must grow in Brazil to justify a premium valuation, this partnership creates a convenience ceiling it cannot match without a ride-hailing partner of its own. The integration is also a signal that iFood and Uber are choosing defensive consolidation over pure delivery competition, reducing the probability of the coordinated fragmentation that would benefit Rappi.'
  claimRefs:
  - CP031
  - CP033
  - CP035

- calloutType: risk
  title: Keeta's $1 Billion Brazil Entry Imports a Proven Subsidised-Disruption Playbook
  body: 'Meituan''s Keeta is not a marginal new entrant. Its parent is a profitable, Nasdaq-listed platform that has proven in Hong Kong and Saudi Arabia that it can win market share through sustained subsidy deployment combined with superior operational technology. The $1 billion, five-year commitment to Brazil is large relative to the scale of the Brazilian delivery market, and Meituan''s stated goal of reaching 1,000 cities within five years implies a territorial ambition that would directly overlap Rappi''s Turbo footprint. If Keeta replicates its Hong Kong playbook in Brazil, the primary damage lands on iFood—but the collateral pressure on Rappi''s Brazil economics is real.'
  claimRefs:
  - CP018
  - CP019
  - CP040
  - CP041

- calloutType: insight
  title: Multi-Homing Is Structural — Moats Are Stickier in Fintech Than in Delivery
  body: 'Consumer surveys and industry analysts consistently observe that LatAm delivery users are highly promotion-responsive and multi-home between apps. The ABRASEL president''s statement that Rappi cannot become a dominant player in Brazil through organic growth alone is consistent with this dynamic—no amount of restaurant selection improvement overcomes iFood''s supply density without promotional economics. The stickiest moat Rappi has is not delivery convenience but financial service integration: RappiPay users who embed their digital wallet and credit card into daily spending face meaningfully higher switching costs than delivery-only users. This makes RappiPay''s user growth arguably more strategically valuable than any single delivery market share gain.'
  claimRefs:
  - CP036
  - CP037
  - CP038
  - CP039

