- id: capability-pricing-gtm-comparison
  title: Capability, Pricing, and GTM Comparison
  body: 'Rappi''s most distinctive capability relative to food-only competitors is its Turbo ultra-fast delivery vertical, which promises sub-30-minute delivery from dark stores and partner kitchens. As of late 2024, Rappi operated 50 company-owned Turbo Supermarkets across 12 cities in Brazil (São Paulo, Rio de Janeiro, Minas Gerais, Pernambuco, Ceará), with each store carrying approximately 1,800 SKUs. Turbo Restaurants, launched nine months before that report, accounted for 2.5 percent of Rappi''s Brazilian restaurant orders, with a target of 10 percent by end-2025. Rappi Prime, its subscription product, offers free delivery and exclusive discounts for a monthly fee, mimicking Amazon Prime''s lock-in dynamic for repeat buyers.

    iFood''s GTM advantages are concentrated in Brazil''s restaurant-supply density and advertising technology. Having controlled exclusive restaurant contracts until the CADE TAC took effect, iFood brought most consumer-preferred restaurant brands under its umbrella. After the TAC, Rappi''s CEO Simon Borrero acknowledged iFood had "managed to block most partners in Brazil, causing all major players to leave the country," and that organic growth alone would take another year to show in market dynamics—consistent with ABRASEL president Paulo Solmucci''s assessment that Rappi is "unlikely to become a strong player through organic growth alone" in Brazil.

    The most consequential recent GTM development is the Uber-iFood platform integration launched in November 2025. Users can now book Uber rides from within the iFood app and order food delivery from within Uber, creating a combined mobility-plus-delivery convenience layer. Uber and iFood announced this strategic partnership on May 14, 2025, in a formal press release from Uber investor relations. This integration deepens retention for both platforms and makes it harder for single-service competitors to match the combined cross-category convenience.

    Delivery cost efficiency is Rappi''s structural pricing advantage vs. global peers. Sacra estimates Rappi''s delivery costs at approximately 10 percent of GMV—well below Zomato at 14 percent, Meituan at 16 percent, and Uber Eats at 32 percent. This efficiency supports competitive pricing in Rappi''s core markets without requiring the same subsidy levels as Uber Eats historically demanded.'
