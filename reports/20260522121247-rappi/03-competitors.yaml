  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Rappi Prime subscriber count, churn rate, and average revenue per subscriber by country are not publicly disclosed.
    whyItMatters: Subscription stickiness is the clearest proxy for moat durability; without these figures it is impossible to quantify how much of Rappi's GMV is protected by switching cost vs. subject to multi-homing attrition.
    diligencePath: Request Rappi Prime subscriber cohort data (monthly retention curves, ARPU by market) from the company directly during due diligence.
    relatedQuestionRefs:
    - QP013
    - QP016

  - type: missing-source
    severity: material
    topic: competitive-strategy
    missingEvidence: Rappi's public competitive response strategy to Meituan Keeta's Brazil entry has not been publicly articulated as of May 2026.
    whyItMatters: Keeta's $1B commitment and subsidised-entry playbook directly targets Rappi's Turbo quick-commerce business in Brazil; absence of a counter-strategy is itself a risk signal.
    diligencePath: Request management's Brazil competitive defence plan and any internal analysis of Keeta's pilot economics in São Paulo and Rio de Janeiro.
    relatedQuestionRefs:
    - QP023

  - type: stale
    severity: minor
    topic: market-share
    missingEvidence: Country-level MAU market share data is primarily sourced from SensorTower's 2024 analysis; 2026 data reflecting Keeta entry and 99Food Brazil relaunch is not publicly available.
    whyItMatters: Competitive share can shift materially in 12-18 months during active market-entry campaigns; 2024 data may understate disruption already underway.
    diligencePath: Subscribe to SensorTower or Apptopia 2026 quarterly LatAm delivery report for updated competitive share data.
    relatedQuestionRefs:
    - QP021

  - type: private-evidence-only
    severity: material
    topic: valuation-competitive
    missingEvidence: Rappi's ~64% valuation decline from the $5.25B Series F has not been formally assessed for its impact on talent retention, commercial negotiations, or investor confidence in the IPO pipeline.
    whyItMatters: Valuation compression relative to rivals like MercadoLibre (NASDAQ-listed, growing 49% YoY) affects Rappi's ability to use equity for M&A, offer competitive compensation packages, and negotiate partner deals at scale.
    diligencePath: Obtain cap table structure, employee equity terms, and any data room materials on competitive talent attrition vs. MercadoLibre and other tech platforms in Colombia and Mexico.
    relatedQuestionRefs:
    - QP027

  - type: private-evidence-only
    severity: minor
    topic: pricing-comparison
    missingEvidence: Exact pricing comparison data for Rappi Prime vs. iFood Clube vs. Meli+ subscriptions across all LatAm markets is not fully documented from primary sources; local pricing pages and press reports provide partial coverage only.
    whyItMatters: Subscription price anchoring affects consumer switching decisions; without precise cross-market pricing the comparison table uses analyst estimates that may not reflect current promotional pricing or country-specific rates.
    diligencePath: Request current Rappi Prime, iFood Clube, and Meli+ pricing schedules from each company's pricing pages and verify against app store subscription listings as of the diligence date.
    relatedQuestionRefs:
    - QP014

  - type: missing-source
    severity: minor
    topic: competitive-strategy
    missingEvidence: No primary-source public data quantifies the extent to which Rappi's fintech moat (RappiPay/RappiCard user scale, transaction volume) stacks up against MercadoLibre's Mercado Pago in terms of active users, transaction volume, or credit book size.
    whyItMatters: The durability of Rappi's competitive moat depends heavily on the relative scale of its financial services vs. Mercado Pago; without comparative fintech metrics the moat comparison relies on qualitative assessments only.
    diligencePath: Source MercadoLibre's Mercado Pago active user counts and transaction volumes from MELI quarterly earnings, and request comparable RappiPay user and transaction data from Rappi directly.
    relatedQuestionRefs:
    - QP019

