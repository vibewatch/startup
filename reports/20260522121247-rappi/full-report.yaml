              - CV031
      - number: '8.4'
        title: Investment Recommendation and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              The weight of evidence supports a track recommendation with medium confidence and a stretched valuation
              stance at the $5.25–5.36 billion equity-round price. At secondary market implied levels ($1.77–2.0
              billion), the valuation stance shifts toward fair given the 2.0×–2.3× revenue multiple implied there, but
              secondary market entry carries illiquidity risk, opaque cap-table dynamics, and potential transfer
              restrictions from Rappi's right-of-first-refusal provisions. The key catalyst and price-discovery event is
              the IPO S-1 filing with the SEC, expected in 2026 if market conditions permit, which will surface audited
              revenue, EBITDA, cap-table structure, and liquidation preference stack for the first time.


              The bull case is real but underweighted by available evidence: neither fintech revenue scale nor
              advertising EBITDA contribution is publicly verifiable, and the IPO has been announced multiple times
              since 2023 without materializing. El País (June 2025) noted that analysts questioned whether Rappi's IPO
              narrative was credible given the company's history of postponements and that only two verticals were
              reportedly generating significant revenue. This skepticism is grounded in observable facts and is not
              idiosyncratic.


              Key thesis-break triggers are enumerated in the tables below: sustained EBITDA for six or more quarters
              with audited confirmation, no additional regulatory sanctions in Colombia or Brazil, fintech revenue above
              $200 million, and an S-1 filed with the SEC. Final diligence asks include cap-table waterfall analysis,
              audited financial statements, RappiPay standalone P&L, and preference-overhang quantification. Investors
              tracking secondary market entry should require at minimum a 30 % discount to the base-case valuation
              midpoint ($3.2 billion) as a margin of safety, implying a fair secondary entry at or below $2.2 billion
              implied market cap.
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
