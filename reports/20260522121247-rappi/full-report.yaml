      - number: '3.2'
        title: Competitor Profiles and Strategic Directions
        blocks:
          - type: paragraph
            body: >-
              iFood is the most formidable single-market rival Rappi faces. Majority-owned by Prosus (Naspers), iFood
              was last valued at approximately $5.4 billion in August 2022 and has raised roughly $592 million in
              disclosed equity. The company announced an investment of R$17 billion (approximately $3.3 billion USD) in
              Brazil through March 2026 to drive traffic, extend credit to restaurants and users, and expand AI-driven
              logistics. iFood's operating profit reached $96 million in the fiscal year ending March 2024, up 249
              percent year-on-year, demonstrating that scale in its home market has finally translated to real cash
              generation. The June 2024 acquisition of fintech Zoop further deepens iFood Pago, its digital-banking arm.
              iFood signed a Conduct Adjustment Agreement (TAC) with Brazil's antitrust authority CADE in 2023,
              restricting exclusive contracts with restaurant chains of more than 30 locations—a concession driven
              partly by complaints from Rappi, Uber Eats, 99Food, and ABRASEL, and one that has marginally opened Brazil
              to new entrants.

              DiDi Global operates food delivery in Brazil as 99Food (leveraging its 2018 acquisition of 99 for
              approximately $1 billion) and as DiDi Food in Mexico. The company has committed approximately $1 billion
              to LatAm expansion through 2026, with a specific BRL 2 billion ($368 million) plan for Brazilian delivery
              aiming to reach 100 cities by mid-2026. Latin America is DiDi's second-largest global investment market
              after China.

              PedidosYa (Delivery Hero) operates in 15 countries and has a workforce of more than 13,000. It leads in
              Argentina, Paraguay, and Uruguay, and has strong positions in Central America. Funding is supported at the
              group Delivery Hero level and not separately disclosed.

              MercadoLibre operates the region's dominant e-commerce marketplace in 18 countries, reporting 49 percent
              year-on-year revenue growth in Q1 2026 and a 17 percent reduction in shipping unit costs in Brazil. MELI
              accounts for an estimated 22 percent of all LatAm e-commerce GMV and its Mercado Pago fintech serves
              hundreds of millions of transactions annually. MercadoLibre's logistics, payments, and marketplace create
              a reinforcing flywheel that no delivery-only competitor has replicated.

              Meituan's Keeta entered Brazil in May 2025 with a $1 billion five-year investment commitment, initially
              targeting São Paulo and Rio de Janeiro with plans for nationwide coverage. Keeta's competitive model in
              prior expansions (Hong Kong, Saudi Arabia) relied on promotional pricing and subsidies to dislodge
              incumbents.
