  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Rappi's most material near-term risk cluster is regulatory. Colombia's Superintendencia de Industria y
              Comercio (SIC) issued a landmark sanction against Rappi S.A.S. in April 2026 for systematic
              consumer-protection violations: unauthorized Prime/Pro subscription charges, misleading Rappi Turbo
              delivery-time promises, unfair contract terms that curtailed consumer guarantees, and chronic failures in
              complaint resolution. The aggregate fine exceeded COP 4 billion (approximately USD 1 million). Crucially,
              when Rappi challenged the sanction, the Tribunal Administrativo de Cundinamarca rejected the appeal in
              April 2026 and affirmed that Rappi is an e-commerce provider, not a mere intermediary, binding it to the
              full weight of Colombia's Estatuto del Consumidor (Ley 1480). This precedent dramatically expands the
              regulatory surface: Rappi must now guarantee product quality, delivery accuracy, and comprehensive
              post-sale rights rather than simply facilitate connections between buyers and sellers. It also signals
              that future SIC investigations can escalate directly to fines without a warning phase, since Rappi had
              already been issued prior instructions it failed to follow. Colombia further tightened the labor framework
              in June 2025 with Ley 2466 de 2025, which compels digital delivery platforms to contribute 60 percent of
              gig workers' social-security payments (health insurance and pension) and 100 percent of occupational risk
              insurance—for both dependent and independent contractor categories. Combined with a March 2025 collective
              agreement between Rappi and the USMTT/Unidapp unions covering due-process protections before account
              deactivation (upheld by Colombia's Constitutional Court), the de-facto employment cost of each courier
              increases materially even without full reclassification as an employee. On the fintech side, Mexico's CNBV
              ordered Rappi to submit an exit plan when the company declined to comply with the Ley Fintech licensing
              framework; Rappi subsequently sold its stake in Tarjetas del Futuro to Banorte for approximately USD 50
              million. Brazil's ANPD published a 2025–2026 regulatory agenda expanding LGPD enforcement to AI,
              biometrics, children's data, and international transfers, with fines up to BRL 50 million per infraction
              or 2 percent of annual revenue—directly relevant to Rappi's extensive data footprint.
