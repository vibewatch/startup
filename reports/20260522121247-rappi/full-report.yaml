      - number: '1.2'
        title: Founders, fintech adjacency, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The company is still unmistakably founder-led. Simón Borrero is the executive most closely linked to
              Rappi’s strategic direction, while Sebastián Mejía and Felipe Villamarín remain central to the founding
              narrative used by outside media and company profiles. That concentration gives Rappi a clear
              entrepreneurial identity, but it also leaves outsiders with limited visibility into broader board
              composition and succession planning. The disclosure asymmetry is striking when compared with RappiPay,
              whose Colombian subsidiary publishes formal financial statements and provides current product-level
              detail. RappiPay’s public narrative centres on deepening customer primacy inside the Rappi ecosystem
              through savings, lending, and card products, with Banco Davivienda acting as the key bank partner. The
              subsidiary’s 2026 growth plan—more than 400,000 users and a profitability target this year—shows why
              fintech remains a strategic adjacency even as the parent platform prunes weaker bets elsewhere.
