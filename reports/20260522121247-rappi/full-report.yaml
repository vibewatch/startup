  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: |
              Rappi monetises through four distinct revenue streams serving consumers, merchants,
              and FMCG brands on its super-app platform. Merchant commissions are by far the largest
              contributor, estimated at approximately 75 percent of total net revenue. Merchants pay
              a take rate of 10 to 30 percent of order value depending on category, market, and
              contract terms; effective all-in costs including optional marketing placements can
              reach 30 to 40 percent. In-app advertising fees charged to restaurants and fast-moving
              consumer goods companies for promoted listings, banner placements, and in-app campaigns
              contribute roughly 13 percent of revenue. Rappi Prime, the subscription membership
              priced at $5 to $10 per month depending on market, contributes approximately 10 percent
              and drives higher purchase frequency. Direct e-commerce sales from owned inventory
              account for a residual 2 percent and carry thin margins.

              Sacra estimated Rappi's 2023 net revenue at $855.52 million, implying 37 percent
              year-over-year growth from $624 million in 2022, representing a strong recovery after
              a 30.7 percent revenue decline in 2021. Online store GMV tracked by Grips recorded
              $505 million in 2025, with a further 10 to 20 percent decline projected for 2026.
              The cumulative revenue-to-loss trajectory through 2023 (COP 1.8 trillion revenues
              versus COP 1.2 trillion losses) underlines that Rappi operated at a structural cash
              deficit for most of its history before achieving its first profitable year in 2024.
            claimRefs:
              - CI001
              - CI002
              - CI003
