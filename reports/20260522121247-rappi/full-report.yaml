      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Rappi's competitive moat rests on four pillars: network density in core markets (Colombia, Mexico, Peru),
              multi-vertical super-app ecosystem switching costs, delivery cost efficiency, and the Amazon strategic
              partnership. In Colombia, where Rappi holds over 50 percent market share and is the default consumer
              delivery brand, the moat is durable. The merchant and courier density creates a reinforcing flywheel: more
              users attract more merchants, which improves selection, which retains users. Rappi Prime subscriptions
              further elevate switching costs by pre-committing user spend. The $25 million Amazon convertible note
              investment in September 2025 (potentially up to 12 percent equity) adds AWS infrastructure support and
              logistics efficiency, and signals Amazon's strategic intent to use Rappi as a last-mile partner rather
              than building independently in LatAm.

              However, multi-homing is structurally embedded in LatAm delivery: price-sensitive consumers routinely
              switch between apps chasing promotions, and the ABRASEL president's observation that Rappi cannot
              organically displace iFood in Brazil highlights the limits of cross-market moat transfer. Rappi's
              secondary-market implied valuation had compressed to approximately $1.9 billion by May 2026—down roughly
              64 percent from the 2021 $5.25 billion Series F peak—reflecting market scepticism about the speed and
              certainty of monetisation.

              The Uber-iFood integration represents the most credible near-term threat: the combined
              mobility-plus-delivery convenience layer concentrates two powerful incumbents in Brazil, potentially
              foreclosing the opportunity for Rappi to win Brazilian consumers who prefer a single app for both rides
              and delivery. Meituan's Keeta entry adds a second displacement risk: Keeta has a proven playbook of
              subsidised entry, deep operational technology, and patient capital that iFood, 99Food, and Rappi have
              historically struggled to match when Meituan committed to a market. The competitive risk register for
              Rappi is therefore highest in Brazil and lowest in Colombia, with Mexico representing an intermediate
              battleground between Rappi, DiDi Food, and Uber Eats.
