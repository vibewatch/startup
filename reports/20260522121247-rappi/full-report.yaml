      - number: '4.6'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |
              Rappi's financial profile in mid-2026 presents a genuine turnaround narrative—EBITDA
              positive, no current need for primary equity, a credible IPO ambition—but the evidence
              base for underwriting remains thin. The absence of audited parent-level financials is
              a blocking gap: no investor can independently verify the EBITDA claims, reconcile
              revenue estimates across sources (ranging from $464 million to $1.3 billion for 2023
              depending on scope), or assess net income versus EBITDA divergence. The four-stream
              revenue mix shows quality improving, with high-margin advertising and subscription
              growing relative to thin-margin e-commerce, but the Brazil zero-commission commitment
              reverses a core margin driver in Rappi's largest strategic expansion market for three
              years and will likely suppress consolidated EBITDA through 2027. RappiPay Colombia
              remains a captive cash drag. The secondary market implied valuation of approximately
              $2.0 billion (April 2026) versus the $5.25 billion 2021 peak signals that sophisticated
              private-market participants have already repriced Rappi's equity downward by
              approximately 62 percent—a reference any investor must reconcile before committing
              at any valuation near the Series F price.
            claimRefs:
              - CI041
              - CI044
              - CI045
      - number: '4.7'
        title: Exhibits
        blocks:
          - type: callout
            title: EBITDA Profitability Milestone Achieved
            body: >
              Rappi achieved positive EBITDA for four consecutive quarters as of December 2025, the first sustained
              profitability in its ten-year history, and is reinvesting 100 percent of profits. This turnaround,
              supported by delivery cost efficiency (~10% of GMV vs 30–32% for global peers) and improving high-margin
              advertising and subscription revenue mix, supports the IPO narrative and reduces immediate financing
              dependency.
            calloutType: strength
            claimRefs:
              - CI022
              - CI009
          - type: callout
            title: Brazil Zero-Commission Commitment Pressures EBITDA Quality
            body: >
              The R$1.4 billion Brazil investment and three-year zero-commission policy for restaurants—effective
              through mid-2028—eliminates the primary revenue stream from Rappi's largest strategic expansion market for
              an extended period. With restaurants accounting for only ~20% of Brazil revenue despite being the primary
              user-acquisition vertical, the revenue cost is uncertain but represents a tangible EBITDA drag that may
              offset group-level profitability.
            calloutType: risk
            claimRefs:
              - CI019
              - CI020
              - CI008
          - type: callout
            title: RappiPay Colombia Remains Loss-Making
            body: >
              RappiPay Colombia posted a COP 15.4 billion nine-month 2025 net loss, only marginally improved from COP
              15.8 billion in the same 2024 period. As a regulated non-bank financial institution with growing deposit
              and credit exposures, it requires sustained capital support. Fitch Ratings highlights that LatAm embedded
              finance arms face high funding costs and limited proven credit deepening that constrain
              path-to-profitability timelines.
            calloutType: risk
            claimRefs:
              - CI031
              - CI045
          - type: callout
            title: Minimum Disclosures Required Before Any Investment Commitment
            body: >
              The following are required before underwriting: (1) audited consolidated P&L and balance sheet for
              2022–2025; (2) total GMV by country and vertical to calculate realised take rates; (3) GAAP/IFRS net
              income reconciliation bridging from EBITDA; (4) segment gross margins for delivery, advertising,
              subscriptions, and fintech; (5) quarterly Brazil P&L forecast through 2028 quantifying zero-commission
              revenue impact. The ~$2.0B April 2026 secondary market value is a reference point, not a valuation anchor.
            calloutType: recommendation
            claimRefs:
              - CI038
              - CI041
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite & Vertical Strategy
        blocks:
          - type: paragraph
            body: >
              Rappi began as a courier app in 2015 and has systematically assembled a multi-vertical super app covering
              on-demand food and grocery delivery, ultra-fast 10-minute commerce (Rappi Turbo), cloud kitchens
              (RappiKitchen), fintech services (RappiPay, RappiCard, RappiPréstamos), subscription memberships (Rappi
              Pro, Rappi Pro Black), travel booking (Rappi Travel), and a courier-concierge feature (RappiFavor). As of
              May 2026 the Google Play listing reports over 200,000 restaurants and stores available across more than
              300 cities in nine Latin American countries. The app was last updated on May 16, 2026, and carries a 3.4/5
              rating from 2.31 million reviews—signalling persistent customer satisfaction gaps.

              Each vertical is purpose-built to extend engagement time and share of wallet. Rappi Pro at COP
              24,490/month (~USD 6) and Rappi Pro Black at COP 32,990/month (~USD 8) unlock unlimited free deliveries,
