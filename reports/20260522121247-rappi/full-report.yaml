      - number: '2.3'
        title: Buyer Segmentation and Adoption Pathway
        blocks:
          - type: paragraph
            body: >-
              Rappi's market comprises five distinct stakeholder categories, each with different budget ownership,
              adoption trigger, and monetization mechanics.

              The primary consumer segment is urban residents aged 18–40 with smartphones and moderate to high
              disposable income. This segment converts through convenience-driven discovery—often via promotional
              discounts—and monetizes through delivery fees, service charges, and cross- sell into Rappi Prime
              subscriptions. The estimated 5.5 million monthly active users (MAU) sits within a broader reachable
              population of 300+ million urban Latin Americans in Rappi coverage cities.

              Restaurants and merchants are the B2B payer segment, paying commission rates typically ranging from 15–30%
              per order. Their adoption trigger is incremental revenue visibility and access to Rappi's consumer base;
              their budget owner is the restaurant or retail store manager. Delivery couriers (repartidores) constitute
              a supply-side operational tier, with approximately 350,000+ contractors in Rappi's network, but they are
              not buyers in the traditional sense—they provide labor in exchange for per-delivery earnings.

              The unbanked and underbanked population represents perhaps the most structurally significant buyer segment
              for Rappi's long-term fintech thesis. Approximately 100 million adults in Latin America remain without
              formal bank accounts as of 2024. Digital wallet adoption quadrupled from 11% to 43% of LATAM adults
              between 2021 and 2025, a structural shift accelerating the total addressable user base for RappiPay and
              RappiCard. Mastercard's 2026 study found 89% of Latin American consumers qualify as digital users and 68%
              of non-users expressed likelihood to adopt digital payments, reinforcing the breadth of the opportunity.

              SMEs represent an emerging B2B buyer for RappiPay's merchant payment products. This segment is
              underpenetrated: traditional banking has historically required physical branch presence and formal credit
              history that most Latin American micro-entrepreneurs lack, creating receptivity to digital-first payment
              rails embedded in the Rappi ecosystem.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
