  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Scope and Boundary
        blocks:
          - type: paragraph
            body: >-
              Rappi's market spans multiple high-frequency consumer verticals—restaurant food delivery, rapid grocery
              and pharmacy fulfilment, general retail delivery, fintech services (digital payments, credit cards, and
              neo-banking), and travel/ticketing—unified under a single super-app platform serving urban Latin
              Americans. The company operates in nine countries (Colombia, Mexico, Brazil, Argentina, Chile, Peru,
              Ecuador, Costa Rica, and Uruguay) across more than 400 cities as of 2026.

              The market boundary explicitly excludes: (1) traditional offline brick-and-mortar retail, where
              cash-and-carry neighborhood tiendas and abarroteras remain the dominant format for daily household
              consumption; (2) bulk or weekly grocery shops that consumers overwhelmingly continue to conduct in
              physical supermarkets; and (3) heavy-goods or cold-chain logistics requiring specialized infrastructure
              Rappi does not currently operate. Status-quo substitutes remain formidable: walk-in neighborhood stores,
              direct phone orders to local restaurants, and informal same-day delivery by motorbike messengers all
              capture spending Rappi is trying to convert to digital-platform transactions.

              Adjacencies with valuation relevance include B2B last-mile logistics for SME merchants (separate from the
              consumer channel), cross-border remittance and payment corridors leveraging RappiPay's wallet
              infrastructure, and SME-facing financial services (merchant POS, working- capital lending). These
              adjacencies are not yet material revenue lines but represent strategic optionality embedded in the
              existing logistics and financial network.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              Multiple independent sizing approaches yield a wide range of TAM estimates, reflecting genuine
              disagreement on market boundaries rather than simple measurement error. The narrowest useful lens—Latin
              American platform-based online food delivery—was approximately $12.9 billion in 2024 and is projected to
              reach $21.7 billion by 2030 at an 8.6% CAGR (Grand View Research). A broader IMARC Group estimate captures
              on-demand delivery services holistically at $1.3 billion in 2025, growing to $6.2 billion by 2034 at 17.9%
              CAGR—a higher CAGR reflecting the nascent stage of non-food verticals. The quick commerce (sub-30-minute
              delivery) sub-segment was approximately $7.2 billion in 2025 and is projected to reach $10.1 billion by
              2029 at 8.8% CAGR according to Research and Markets.

              Adding fintech and super-app revenue streams substantially expands the opportunity. Grand View Research
              estimates the Latin American super app market at approximately $10.5 billion in 2026, growing at 29.6%
              CAGR through 2033. Latin America's e-commerce market is projected to exceed $215 billion in 2026 (Americas
              Market Intelligence), making the broader digital commerce context large even if Rappi captures only a
              fraction.

              Rappi's SAM, scoped to its nine-country footprint excluding the Brazil food-delivery market (where iFood
              is entrenched), is estimated at $55–70 billion for combined food, grocery, and quick commerce delivery.
              The SOM in core food delivery GMV is estimated at $7–14 billion annually by 2026, consistent with reported
              64% market share in Colombia, 36% in Mexico, and smaller positions in six other markets. These SOM
              estimates have significant uncertainty given private-company revenue opacity. South America food delivery
              alone is projected at $7.9 billion in 2026 by Cognitive Market Research, roughly consistent with
              sub-regional aggregation.

              A key diligence flag: analyst TAM estimates diverge by more than 6× ($12.9B platform-only vs. $78.6B+ all
              food transactions). Buyers of the Rappi thesis must identify which lens governs the revenue model they are
              underwriting before sizing returns.
