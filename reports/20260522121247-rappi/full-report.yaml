      - number: '7.3'
        title: Financial, Competitive, and Partner Risk
        blocks:
          - type: paragraph
            body: >-
              Rappi's financial risk centers on its capital-intensive growth posture and a competitive environment that
              is intensifying precisely as Rappi approaches an inflection point. The CEO disclosed in late 2025 that
              Rappi reinvests 100 percent of its profits into growth, forgoing distributable earnings. This model keeps
              the company pre-FCF-positive from an investor distribution standpoint and relies on continued GMV
              expansion to generate reinvestable cash. To supplement internal cash flow, Rappi secured a USD 100 million
              private credit facility from Santander in August 2025—its largest debt deal to date—adding interest
              expense and covenant obligations that require sustained revenue growth to service. If growth decelerates,
              the dual burden of debt service and capital-intensive Turbo expansion could compress runway. The
              competitive threat from iFood is Rappi's most acute market risk. Uber and iFood announced a strategic
              partnership in Brazil in 2025 that enables cross-subscription bundles and integrated logistics, aligning
              the country's dominant food-delivery platform with a global mobility superapp. Simultaneously, China's
              Meituan committed USD 1 billion to expand its Keeta brand in Brazil. If these two forces capture
              significant share of Rappi's second-largest market, the revenue trajectory underlying Rappi's valuation
              (estimated at USD 5–5.25 billion as of 2024) would be materially impaired. Rappi's partner-dependency
              risks are also significant: Amazon's USD 25 million equity investment aligns infrastructure interests but
              also positions a direct e-commerce competitor with visibility into Rappi's operations. Rappi's merchant
              network (200,000+ restaurant and retail partners) represents both the platform's core value and a
              concentration risk if iFood or Meituan outbid on commission rates or exclusive partnerships. The Banorte
              fintech sale for USD 50 million in Mexico signals strategic retreat from what could have been a
              high-margin revenue segment.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
