    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating footprint, and platform logic
        blocks:
          - type: paragraph
            body: >-
              Rappi remains one of Latin America’s most recognisable consumer technology brands because it has broadened
              far beyond restaurant delivery into a regional convenience-and-fintech ecosystem. Public profiles and
              Rappi’s own merchant-facing surfaces consistently describe the company as a super-app rather than a
              single-category marketplace. The official site stresses that more than 40,000 allied merchants already
              work with Rappi in nine countries, while Yahoo Finance and other profile aggregators describe a footprint
              of 400-plus cities and more than 35 million active users. That scale matters because Rappi is
              simultaneously selling convenience to consumers, demand generation to merchants, and income opportunities
              to couriers. Even so, public disclosure remains stronger on operating breadth than on audited group
              economics. The platform story is clear; the underlying marketplace profitability and country-by-country
              contribution remain partially opaque.
