      - number: '2.5'
        title: Sizing Contradictions and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The most consequential sizing contradiction is the 6× spread between narrow food-delivery TAM estimates
              ($12.9 billion platform-based, 2024) and broad total-food-transaction estimates ($78.6 billion+). This
              divergence is not analyst error but reflects fundamental differences in market definition—platform GMV vs.
              all food spend addressable by tech—and carries direct implications for valuation multiples applied to
              Rappi's GMV.

              Non-cash digital payment transaction growth in LATAM is expected to exceed 20% CAGR through 2028, led by
              real-time payment infrastructure. Brazil's Pix is already cited as achieving more than 90% consumer
              adoption domestically, creating a case study Rappi can point to for what normalized digital payment rails
              do to e-commerce and delivery platform take-rates in subsequent years. The LATAM fintech digital payment
              sub-segment alone is projected to reach $663.88 billion by 2033 at 7.5% CAGR (Fitch Ratings/DataCube
              Research), dwarfing the delivery-specific TAM and anchoring the super-app fintech cross-sell opportunity.

              Market fragmentation across hundreds of local quick-service restaurants limits Rappi's commission
              negotiating power in early-stage markets, a structural challenge that persists until platform density
              creates lock-in. Inflation and currency volatility—particularly in Argentina—erodes real GMV and
              complicates cross-market unit economics benchmarking. Financial inclusion rates in Colombia and Peru rose
              by 45–50 percentage points in digital wallet ownership between 2021 and 2025, confirming that the fintech
              opportunity is not static: the TAM for RappiPay expands as the banked share grows.

              Key unresolved gaps include: country-level GMV and take-rate disclosure needed to triangulate SOM
              estimates; definitive regulatory timelines for gig-worker reclassification in each Rappi market; and
              independent verification of Rappi's claimed profitability in multiple quarters, which if sustained would
              validate the unit economics thesis despite structural cost pressures.
            claimRefs:
              - CM041
              - CM042
              - CM043
              - CM044
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: iFood's Brazil Dominance Creates a Structural SAM Ceiling
            body: >-
              Brazil represents approximately 38% of Latin American e-commerce GMV and is the region's single largest
              market. iFood's estimated 89% food delivery market share makes Rappi's re-entry commercially non-viable
              without a fundamentally different strategy. This is not a cyclical headwind—it is a durable competitive
              moat that caps Rappi's delivery TAM until the Brazil situation changes. Diligence should probe whether
              Rappi's fintech products (RappiPay) can access Brazilian consumers independently of the delivery app, or
              whether the Brazil constraint extends to the entire product stack.
            calloutType: risk
            claimRefs:
              - CM018
              - CM035
          - type: callout
            title: Unbanked Population Creates a Mega-TAM for Rappi's Fintech Stack
            body: >-
              Approximately 100 million Latin American adults remain unbanked. Digital wallet adoption quadrupled from
              11% to 43% between 2021 and 2025, and 68% of non-digital-payment users say they are likely to adopt.
              Rappi's logistics network gives it a distribution advantage over standalone fintechs: RappiPay can be
              seeded via cash-top-up agents co-located with delivery operations, bridging the cash-to-digital gap for
              consumers who already trust the Rappi brand. The fintech TAM expands as banked share grows, making
              RappiPay's opportunity structurally larger in 2030 than it is today.
            calloutType: insight
            claimRefs:
              - CM024
              - CM025
              - CM026
              - CM028
          - type: callout
            title: SOM Estimates Carry Wide Uncertainty Absent Revenue Disclosure
            body: >-
              All SOM estimates for Rappi's food delivery GMV ($7–14B annually by 2026) derive from third-party market
              share approximations applied to regional market-size estimates, not from company-disclosed GMV or
              take-rate data. The 2× range (7B–14B) reflects genuine uncertainty in both the denominator (market size)
              and the numerator (Rappi's share). A key diligence step is obtaining at minimum country-level GMV
              confirmation and take-rate ranges from Rappi management before underwriting any SOM-based revenue
              projection.
            calloutType: assumption
            claimRefs:
              - CM015
              - CM016
              - CM020
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Rappi competes across four distinct competitive tiers in Latin America. The first tier is direct delivery
              super-apps: iFood, DiDi Food (branded 99Food in Brazil), Uber Eats, and PedidosYa, which all offer
              on-demand restaurant and grocery delivery at city-scale. The second tier is the integrated e-commerce and
              logistics platform MercadoLibre, whose Mercado Envios same-day logistics and Mercado Pago fintech together
              replicate the breadth of Rappi's super-app but serve a somewhat different buyer occasion (next-day
              delivery and planned purchase vs. ultra-fast impulse). The third tier includes new and re-entering
              disruptors: Meituan's Keeta, which announced a $1 billion, five-year Brazil commitment in May 2025, and
              DoorDash, which explored Brazil in 2023 but did not proceed. The fourth tier is the status-quo
              substitute—WhatsApp-based restaurant ordering, phone delivery, and informal couriers—which still accounts
              for a meaningful share of restaurant delivery volume in less-urbanised LatAm markets.

              Country market share is highly concentrated and country-specific. iFood commands over 80 percent of mobile
              monthly active users in Brazil and is effectively a monopoly there. Rappi holds roughly 64 percent MAU
              share in Colombia, its home market, but only about 17 percent of total LatAm MAU across all countries.
              PedidosYa (owned by Delivery Hero) leads in Argentina at 61 percent MAU, and operates across 15 countries.
              DiDi Food holds approximately 38 percent MAU in Mexico, competing closely with Rappi at 36 percent. Uber
              Eats, after exiting Brazil and Argentina, retains only about 7 percent LatAm MAU concentrated in Mexico.
              This fragmentation means no single platform dominates the region, and Rappi must defend multiple
              geographies simultaneously against entrenched local champions and well-capitalised newcomers.
