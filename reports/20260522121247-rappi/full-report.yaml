        - Annual revenue confirmed ≤ $800 M in first audited filing
        - Collapses base-case valuation to $1.0–1.5 B; DoorDash-premium unsupportable
        - Sell / avoid; reassess at 1× revenue entry only
      - - IPO cancelled or postponed beyond 2027
        - No S-1 filed with SEC by Q4 2027
        - Removes price-discovery catalyst; traps secondary investors with no exit
        - Exit secondary positions; monitor for down-round equity event
      - - Down round (new equity below $3 B mark)
        - New equity round at < $3 B valuation
        - Eliminates equity-round premium; forces loss crystallization for 2021–2022 investors
        - Avoid primary-round follow-on; reassess entry post-reset
      - - Amazon partnership dissolution
        - Amazon exercises no warrants and publicly distances from Rappi
        - Removes strategic floor; signals milestone failures; weakens IPO narrative
        - Track downgrade to avoid
      - - Additional regulatory sanctions (>$10 M COP equivalent)
        - Formal SIC or ANPD fine above $10 M equivalent, or injunction on operations
        - Adds compliance cost, brand risk, and investor uncertainty in core markets
        - Reassess regulatory chapter; may escalate to avoid
      - - EBITDA reversal (2 or more negative quarters)
        - CEO/CFO publicly confirms EBITDA-negative period; or S-1 filing shows no profitability
        - Removes single most positive 2025 data point; pushes valuation to bear case
        - Revise recommendation from track to avoid
