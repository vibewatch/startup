      - number: '4.3'
        title: Cost Structure, Unit Economics, and Operating Leverage
        blocks:
          - type: paragraph
            body: |
              Rappi's structural cost advantage over global delivery peers is driven by high
              delivery density in Latin America's dense urban cores and lower local labour costs.
              Sacra estimates Rappi's total delivery costs at approximately 10 percent of GMV,
              compared to 14 percent for Zomato, 16 percent for Meituan, and 30 to 32 percent for
              Uber Eats and DoorDash. This structural gap, if sustained, significantly improves
              contribution margin per order and accelerates zone-level payback.

              The company targets break-even in a newly entered zone within approximately 3.5 months,
              a key capital efficiency metric for its ongoing city expansion. Purchase frequency
              grows from roughly 2 times per month in a customer's first year to approximately
              11 times per month by year five, implying compounding LTV that improves unit economics
              over cohort lifetime. Around 90 percent of customers already purchase across more than
              one product category, supporting cross-vertical margin contribution.

              Rappi's 300-plus dark kitchens and micro-fulfilment centres operating across 6
              countries and 15-plus cities reduce per-order distance and shift logistics to a hub-
              and-spoke model. The Rappi Kitchen programme provides partner brands with equipment
              loans, commercial support, and virtual restaurant development. However, 300-plus dark
              kitchen locations carry fixed lease, staffing, and equipment costs that introduce
              operating leverage risk if demand softens or restaurant partners exit. Gross margin
              by segment and EBITDA margin remain undisclosed beyond the CEO's qualitative statements.
            claimRefs:
