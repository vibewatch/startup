      - number: '8.2'
        title: Comparable Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Benchmarking Rappi requires a multi-lens comparable set given the absence of a pure-play LatAm super-app
              public peer. The most directly relevant public comparables are Grab (Southeast Asia super-app,
              NASDAQ:GRAB), DoorDash (US on-demand delivery, NASDAQ:DASH), GoTo/Gojek-Tokopedia (Indonesia super-app,
              IDX:GOTO), and Delivery Hero (global delivery, XETRA:DHER). As of May 2026, multiples.vc data show
              DoorDash trading at 4.4× EV/LTM Revenue ($67 B EV on ~$15 B revenue), reflecting US market leadership at
              scale and positive GAAP net income of $935 million for FY2025. DoorDash's 49.7× EV/EBITDA ratio underlines
              how expensively the market prices dominant delivery platforms. Grab trades at approximately 2.8× EV/LTM
              Revenue following Q1 2026 results of $955 million in revenue (+24 % YoY) and record adjusted EBITDA of
              $154 million. GoTo trades at approximately 1.9× EV/Revenue, Delivery Hero at only 0.8×, weighed by
              profitability challenges and leverage. Uber, as a platform spanning delivery, mobility, and freight,
              trades at 2.9× EV/Revenue.


              Aventis Advisors' marketplace multiple research places the median marketplace EV/Revenue at approximately
              2.3× in the 2025–2026 period. Applying a range of 2.0×–3.5× to Rappi's $1.3 billion estimated revenue
              implies a fair-value band of roughly $2.6 billion–$4.6 billion, with the midpoint near $3.2 billion. At
              the equity-round mark of $5.25–5.36 billion, Rappi would need to sustain 4× revenue, on par with
              DoorDash's premium—a level that demands verified EBITDA growth and sustained 20 %+ top-line expansion. The
              available evidence does not currently support that underwriting. Private-round comparables also point to
              risk: Kavak, a Mexico LatAm unicorn once valued at $8.7 billion, reset to $2.2 billion (a 75 % haircut)
              after expansion difficulties in 2024–2025, illustrating that LatAm "paper valuations" from the 2021 peak
              cycle can compress dramatically.


              The Nasdaq Private Market shows Rappi's historical funding rounds (Series A through Series F) and
              indicates active secondary-market orders, but share price data requires accredited investor registration.
              Collectively, the comp set suggests the equity-round valuation is stretched relative to peer multiples and
              that a fair-value range of $2.6–3.9 billion is more defensible at Rappi's current scale and growth
              trajectory.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
