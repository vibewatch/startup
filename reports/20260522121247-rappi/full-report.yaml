      - number: '1.3'
        title: Capital history and the shift from mega-equity rounds to mixed financing
        blocks:
          - type: paragraph
            body: >-
              Publicly accessible funding data shows a company that was built on very large venture rounds and is now
              experimenting with a broader financing menu. Tracxn’s profile compiles roughly $2.46 billion raised over
              15 rounds, while widely cited historical benchmarks still point to SoftBank’s 2019 backing and the 2021
              Series F that valued Rappi at roughly $5.25 billion. Those benchmarks matter because they remain the last
              broadly corroborated valuation datapoints in open sources. What changed after the peak funding cycle is
              the form of capital: 2025 brought a Santander-backed debt facility and a smaller Amazon-linked entry in
              Tracxn’s round history, implying that strategic and credit capital now supplement traditional venture
              equity. The important diligence implication is that headline valuation certainty has fallen just as
              financing structure has become more complex. Debt, bank-partner, and minority strategic-capital structures
              can preserve flexibility, but they also introduce covenant risk, commercial side-letter risk, and the
              possibility that later investors are buying economics very different from those implied by the headline
              2021 benchmark. Underwriters should therefore treat recent valuation signals as noisy unless management
              shares primary transaction documents.
