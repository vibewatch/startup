      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Five structural tailwinds support continued delivery and fintech adoption across Rappi's markets.
              Smartphone penetration reached approximately 78% of the Latin American population by 2023, expanding the
              addressable base at pace. Urbanization is concentrating consumers in high-density cities (São Paulo,
              Bogotá, Mexico City, Buenos Aires, Lima) where delivery economics are most viable. Brazil's Pix
              instant-payment system—which achieved more than 90% adoption domestically—is accelerating payment
              normalization across the region and providing a template for national payment rails in Rappi's other
              markets. COVID-19 permanently accelerated on-demand delivery and digital payment adoption, effectively
              compressing three to five years of behavioral change into eighteen months. Finally, rising middle-class
              incomes and growing disposable income across the region create increasing willingness to pay for
              time-saving convenience services.

              Against these tailwinds sit six material constraints. Last-mile logistics costs account for up to 30% of
              total revenues in Latin American delivery (Kearney), creating structural pressure on contribution margins
              even at scale. iFood's approximately 89% market share in Brazil effectively shuts Rappi out of the
              region's largest e-commerce economy, representing a significant SAM ceiling. Cash-on-delivery remains
              prevalent—particularly in smaller cities and lower-income consumer segments—raising operational cost and
              fraud exposure. Gig-worker reclassification pressure is intensifying: Colombia ratified a union agreement
              in March 2025, and Brazilian courts have pursued employee-status rulings for some platform workers, each
              threatening a 20–40% increase in effective labor costs. Intense price competition from Uber Eats, iFood,
              and Mercado Libre constrains Rappi's ability to raise commissions or delivery fees. Finally, operating in
              nine countries with different regulatory regimes—spanning labor law, fintech licensing, data-privacy
              frameworks, and consumer- protection requirements—creates sustained compliance overhead and operational
              complexity.
            claimRefs:
