    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: IC-ready scoring of Rappi across seven investment dimensions; scores on a 1–10 scale where 10 is strongest.
    data:
      items:
        - label: Market Opportunity
          value: 8
          note: LatAm delivery + fintech TAM >$100B; strong secular tailwinds
        - label: Competitive Position
          value: 7
          note: LatAm super-app leader with 9-country footprint; iFood and MercadoLibre are credible challengers
        - label: Technology Moat
          value: 6
          note: Rappi Turbo, AI logistics, AWS partnership; but replicable by well-funded rivals
        - label: Unit Economics
          value: 5
          note: EBITDA-positive claimed but unverified; delivery margins remain thin; fintech upsides material but unproven
        - label: Financial Transparency
          value: 3
          note: No audited financials; revenue range $800M–$1.3B; cap table not public
        - label: Management Execution
          value: 6
          note: Profitability milestone achieved; CFO appointed; but IPO repeatedly deferred
        - label: Valuation Attractiveness
          value: 4
          note: Equity-round price stretched (4× unverified revenue); secondary market entry at ~$2B is more defensible
    approximationNotes: Scores are qualitative and based on public evidence as of 2026-05-22; they do not constitute investment advice.
