  - id: FR001
    title: Rappi Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      Positions Rappi's twelve principal risk scenarios on a three-by-five likelihood–impact matrix, revealing a dense
      cluster of high-likelihood / high-impact regulatory and competitive risks that represent the core thesis-break
      zone.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High / Critical Impact
      rows:
        - label: Very Low Likelihood
          values:
            - Fountain9 AI supply-chain failure
            - RappiTravel operational disruption
            - Mastercard payment network pricing hike
        - label: Low Likelihood
          values:
            - Turbo inventory write-off event
            - Amazon direct LATAM e-commerce conflict
            - Multi-country regulatory co-ordination action
        - label: Medium Likelihood
          values:
            - AWS cloud regional outage
            - Santander covenant breach / refinancing
            - iFood-Uber 20%+ Brazil share capture within 18 months
        - label: High Likelihood
          values:
            - Email phishing / brand impersonation (DMARC gap)
            - SIC repeat enforcement Colombia; CNBV-equivalent in another market
            - Brazil LGPD fine for data breach; labor reclassification in Colombia
        - label: Very High Likelihood
          values:
            - Ley 2466 social-security cost increase per delivery
            - Multi-jurisdiction compliance overhead growing with expansion
            - Meituan/Keeta competitive pressure in Brazil
    approximationNotes: >-
      Likelihood ratings are qualitative analyst assessments based on public evidence as of May 2026. Impact ratings
      reflect estimated GMV, margin, or valuation effect.
