      - number: '4.4'
        title: Capital Adequacy and Financing Structure
        blocks:
          - type: paragraph
            body: |
              Rappi has raised approximately $2.3 to $2.6 billion in total capital since founding
              across 21 rounds from investors including SoftBank, Andreessen Horowitz, DST Global,
              Sequoia Capital, T. Rowe Price, and Amazon. The last primary equity round was a
              $496 million Series F in July 2021 at a $5.25 billion post-money valuation; no new
              primary equity rounds have been disclosed since then.

              Three debt-side transactions were completed in 2025: a $100 million senior secured
              four-year loan from Banco Santander and Kirkoswald Capital Partners in August 2025
              (the largest single debt raise in Rappi's history, earmarked for refinancing and
              working capital); a $25 million Amazon convertible note in September 2025 granting
              Amazon warrants for up to 12 percent equity if defined milestones are met; and an
              undisclosed Gramercy Funds Management debt financing in October 2025. RappiPay
              Colombia separately raised $112 million in debt from Colombian banks in October 2022.

              CEO Simón Borrero confirmed in December 2025 that Rappi had been EBITDA-positive for
              four consecutive quarters, was reinvesting 100 percent of profits, and has no current
              need for new private equity. Rappi is evaluating conditions for a potential IPO in
              late 2026 but explicitly noted market timing constraints. No S-1 has been filed as
              of May 2026. Secondary market implied valuation as of April 2026 is approximately
              $2.0 billion—a 62 percent discount to the 2021 Series F peak. The Brazil R$1.4
              billion investment commitment (approximately $270 million USD) represents the single
              largest forward capital deployment obligation.
