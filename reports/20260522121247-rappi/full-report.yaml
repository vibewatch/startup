      - number: '6.3'
        title: Retention, Satisfaction, and Expansion
        blocks:
          - type: paragraph
            body: >
              Rappi's retention picture is bifurcated by platform. The Apple App Store rating of 4.6 out of 5 from more
              than 82,000 ratings suggests strong satisfaction among the active daily user base that interacts with the
              app regularly. G2 business user reviews rate Rappi at 3.9 out of 5 from 14 reviews, with recurring
              criticisms of customer service response times and refund handling — a pattern consistent with the scale
              challenge of managing a marketplace with hundreds of thousands of daily orders. In contrast,
              complaint-oriented platforms show severely negative sentiment: PissedConsumer rates Rappi at 1.3 out of 5
              from 107 reviews, with only 6% of reviewers willing to recommend the service, and Trustpilot (inaccessible
              at review time but documented in search data) recorded 1.1 out of 5 from 649 reviews, with dominant themes
              of unauthorized charges, courier theft, and failed refunds. This divergence is structural: the App Store
              rating captures active satisfied users, while complaint platforms capture the tail of negative experiences
              disproportionately. Neither is a reliable retention metric without private cohort data. Rappi has not
              publicly disclosed NRR, GRR, monthly churn rate, or cohort-level retention data for any segment. Industry
              benchmarks for on-demand delivery apps indicate that 30-day retention typically falls in the 3–6% range,
              implying structural churn pressure even for leading platforms. Rappi Prime and Rappi Pro subscriptions —
              offering free deliveries, exclusive discounts, and cashback through RappiCard — are the primary retention
              and lifetime value tools, with company leadership targeting a doubling of the Rappi Prime subscriber base
              between 2025 and 2026. The Latin American loyalty programs market is projected to grow from USD 5.09
              billion in 2025 to USD 8.7 billion by 2029, with RappiPrime identified alongside Amazon Prime Mexico and
              Mercado Pago as a key participant. LogRocket's production deployment documented measurable conversion
              improvements through front-end performance optimization, indicating that Rappi actively pursues
              engineering-driven retention reduction of session abandonment.
