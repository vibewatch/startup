      - number: '5.3'
        title: Rappi Turbo & Dark Store Operations
        blocks:
          - type: paragraph
            body: >
              Rappi Turbo is Rappi's ultra-fast (≤10-minute) delivery sub-platform built on a proprietary network of
              dark stores—small, non-public fulfillment centres of approximately 18 square metres each, stocked with
              2,000–8,000 SKUs and positioned within 2–3 km of target consumers. The operational formula: 4–5 in-store
              operators complete picking in under two minutes; the courier covers the last mile in approximately eight
              minutes. Nationally in Mexico, Turbo surpassed 500,000 monthly deliveries as of July 2025, supported by 50
              dark stores and 2,000+ dedicated couriers. Rappi acquired the assets of Indian AI supply-chain firm
              Fountain9 in 2024 to integrate machine-learning-based demand sensing, pricing optimisation, and predictive
              inventory planning specifically for Turbo dark stores.

              In February 2026 Rappi launched Turbo Farma—a pharmaceutical dark-store pilot in Brazil operating 38
              stores in eight Brazilian cities. The vertically integrated model carries its own pharmaceutical inventory
              (initially 1,200 OTC and personal-care items, targeting 5,000 by end-2026) and requires licensed
              pharmacists on-site and ANVISA-compliant temperature controls. The initiative immediately drew legal
              threats from Brazil's pharmacy association Abrafarma, which cited Law 5,991/73 and ANVISA Resolution RDC
              44 as prohibiting pharmacy sales in closed-door units; Rappi maintains its units are ANVISA-licensed and
              compliant. The 2026 Turbo roadmap includes ready-to-eat food ultra-fast delivery, expansion of the
              pharmaceutical vertical pending regulatory validation, and a B2B supply-chain-as-a-service offering built
              on Fountain9 technology.
