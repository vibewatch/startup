  topStrengths:
    - >-
      Class-leading delivery cost efficiency (~10% of GMV vs. 32% for Uber Eats) supports competitive pricing and
      potential EBITDA at scale
    - >-
      Super-app breadth across nine countries with 5.5 M+ MAU, 40 K+ merchants, and 400+ cities creates a structural
      network-effects moat in core markets
    - >-
      Four consecutive EBITDA-positive quarters confirmed by CEO (Dec 2025) signals operational inflection, with 100%
      profit reinvestment into growth
    - >-
      Hyper-scale engineering platform (2,000+ microservices, 50+ Kubernetes clusters, 1,500+ daily deployments) is
      among the most sophisticated in Latin America
    - >-
      Amazon strategic partnership (convertible note with warrants) and Santander debt facility validate access to
      institutional capital ahead of IPO
  topRisks:
    - >-
      Absence of audited parent-level financial statements: revenue estimates range $800 M–$1.3 B (a 60% spread), making
      independent valuation impossible
    - >-
      Equity-round valuation ($5.36 B) implies ~4× unverified revenue while secondary markets price Rappi at $1.77–2.0
      B, a 66% discount; capital-efficiency ratio of 0.79× means cumulative capital deployed exceeds implied market cap
    - >-
      Escalating multi-jurisdiction regulatory gauntlet: Colombia SIC COP 4 B fine (April 2026), Cundinamarca Tribunal
      e-commerce reclassification, Ley 2466 gig-courier social-security mandate, and Brazil data-breach exposure
    - >-
      Uber-iFood strategic integration in Brazil and Meituan $1 B Brazil market entry are step-change competitive
      threats in Rappi's two largest markets
    - >-
      Repeated IPO deferrals since 2022 undermine governance credibility; only two product verticals reportedly
      generating meaningful revenue per El País (June 2025)
  unresolvedGaps:
    - >-
      Audited parent-level income statement, EBITDA, and net income for FY2024–2025 (blocking gap for any underwriting
      exercise)
    - Cap-table waterfall and liquidation preference stack (critical for secondary-market entry sizing)
    - RappiPay standalone P&L and fintech revenue as a percentage of group revenue
    - Verified revenue growth trajectory and segment breakdown by country and vertical
    - S-1 filing with the SEC (expected 2026; not filed as of May 2026)
