  - id: traction-gaps-adverse
    title: Public Financial Traction, Metric Gaps, and Adverse Signals
    body: |
      Public traction anchors are limited but informative. Rappi's net revenue is estimated
      at $856 million for 2023. Grips tracked $505 million in online store e-commerce GMV
      for 2025, declining 12 percent in the three months ending March 2026, and March 2026
      monthly e-commerce revenue of $33.9 million, implying an annualised run rate of
      roughly $407 million. Total GMV across all verticals—restaurants, groceries,
      pharmaceuticals, and fintech—is not publicly disclosed.

      RappiPay Colombia publishes quarterly financial statements. The unit reported COP
      442.9 billion in total assets and COP 319.6 billion in deposits as of September 2025,
      growing from COP 380.4 billion and COP 274.1 billion at December 2024. However,
      RappiPay posted a nine-month 2025 net loss of COP 15.4 billion, marginally improved
      from COP 15.8 billion in the same 2024 period. RappiPay targets doubling its client
      base to approximately 800,000 by end-2026 from 400,000-plus current users. The $50
      million Banorte acquisition of RappiCard Mexico in December 2025 removed the 1.14
      million Mexican cardholder book from Rappi's direct fintech exposure, with a 15-year
      exclusive financial-products partnership established in its place.

      On the adverse side, Colombia's SIC imposed a COP 4.003 billion (~$1.09 million) fine
      on Rappi in April 2026 for systemic consumer protection failures covering incomplete
      orders, misleading delivery time promises, and unauthorised membership charges. The
      SIC explicitly cited Rappi's fourth sanction in five years for similar violations,
      treating reincidencia as an aggravating factor. This pattern of repeat enforcement
      signals operational quality control gaps that may constrain Rappi's ability to extract
      higher take rates without increasing consumer churn.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI039
      - CI043
    tableRefs:
      - TI005

  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: |
      Rappi's financial profile in mid-2026 presents a genuine turnaround narrative—EBITDA
      positive, no current need for primary equity, a credible IPO ambition—but the evidence
      base for underwriting remains thin. The absence of audited parent-level financials is
      a blocking gap: no investor can independently verify the EBITDA claims, reconcile
      revenue estimates across sources (ranging from $464 million to $1.3 billion for 2023
      depending on scope), or assess net income versus EBITDA divergence. The four-stream
      revenue mix shows quality improving, with high-margin advertising and subscription
      growing relative to thin-margin e-commerce, but the Brazil zero-commission commitment
      reverses a core margin driver in Rappi's largest strategic expansion market for three
      years and will likely suppress consolidated EBITDA through 2027. RappiPay Colombia
      remains a captive cash drag. The secondary market implied valuation of approximately
      $2.0 billion (April 2026) versus the $5.25 billion 2021 peak signals that sophisticated
      private-market participants have already repriced Rappi's equity downward by
      approximately 62 percent—a reference any investor must reconcile before committing
      at any valuation near the Series F price.
    claimRefs:
      - CI041
      - CI044
      - CI045

