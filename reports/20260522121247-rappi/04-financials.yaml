  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: financial-gaps
      missingEvidence: >
        Audited consolidated parent-level financial statements (P&L, balance sheet, cash
        flow) for Rappi S.A.S. or its holding company for 2022–2025.
      whyItMatters: >
        Without audited financials, EBITDA claims, net revenue figures, and margin
        estimates cannot be independently verified; any valuation or underwriting decision
        rests on unaudited management statements and third-party analyst estimates.
      diligencePath: >
        Request audited annual financial statements from management as a condition of any
        investment process; cross-check with RappiPay's publicly filed quarterly statements
        and Sacra estimates to identify material discrepancies.
      relatedQuestionRefs:
        - QI018

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >
        Segment-level gross margin for delivery, in-app advertising, Rappi Prime
        subscriptions, and fintech; blended consolidated gross margin for 2023–2025.
      whyItMatters: >
        Revenue quality and the EBITDA turnaround cannot be attributed to structural
        mix shift versus temporary cost control without segment data; advertising and
        fintech carry structurally different margins from delivery.
      diligencePath: >
        Request segment P&L in the due-diligence data room; benchmark advertising margins
        against comparable in-app ad platforms and food-delivery advertising peers.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: gmv
      missingEvidence: >
        Total platform GMV across all verticals (restaurants, grocery, pharma, travel,
        fintech) broken down by country and quarter.
      whyItMatters: >
        Take-rate and unit-economics calculations require GMV as the denominator; without
        it, delivery cost ratios and contribution margin projections cannot be validated.
      diligencePath: >
        Request quarterly GMV by vertical and market; reconcile against Grips e-commerce
        data and analyst estimates from Sacra and PM Insights.
      relatedQuestionRefs:
        - QI020

    - type: access-blocked
      severity: minor
      topic: financing
      missingEvidence: >
        Amount and terms of the Gramercy Funds Management debt financing closed October
        2025, including interest rate, maturity, covenants, and collateral structure.
      whyItMatters: >
        The total debt burden and covenant structure affect Rappi's financial flexibility;
        Santander and Amazon terms are known but Gramercy's remain undisclosed.
      diligencePath: >
        Request full debt schedule and covenant summary from management; check Colombian
        credit registry for registered pledges.
      relatedQuestionRefs:
        - QI021

    - type: stale
      severity: material
      topic: brazil-expansion
      missingEvidence: >
        Quarterly P&L for Rappi's Brazilian operations covering Q2 2025 through Q1 2026,
        quantifying the financial impact of the zero-commission policy.
      whyItMatters: >
        The R$1.4B Brazil commitment with zero commissions for 3 years is the single
        largest forward obligation; without quarterly Brazil P&L, investors cannot assess
        whether consolidated EBITDA is sustainable or masked by strong performance in
        other markets.
      diligencePath: >
        Request Brazil entity P&L from management; model commission waiver impact using
        disclosed restaurant growth targets and average order values from industry benchmarks.
