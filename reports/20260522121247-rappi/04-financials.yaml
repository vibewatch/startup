      statement: >
        Rappi's 2022 revenue of approximately $624 million represented 29.4 percent
        growth from 2021, while 2021 revenue of approximately $482 million reflected a
        30.7 percent decline from the prior year.
      type: third-party-reported
      topic: revenue-model
      sourceRefs:
        - SI001
      confidence: medium
      freshness: historical

    - id: CI003
      statement: >
        Rappi's estimated revenue mix comprises merchant commissions (~75%), in-app
        advertising from restaurants and FMCG companies (~13%), Rappi Prime subscriptions
        (~10%), and e-commerce and other revenue (~2%).
      type: third-party-reported
      topic: revenue-model
      sourceRefs:
        - SI001
        - SI024
      confidence: medium
      freshness: recent
      answersQuestionRefs:
        - QI001

    - id: CI004
      statement: >
        Merchants pay Rappi commissions ranging from 10 to 30 percent of order value;
        effective all-in costs including promotional placements and payment processing
        can reach 30 to 40 percent of order value.
