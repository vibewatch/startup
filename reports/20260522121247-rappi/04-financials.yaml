company:
  name: Rappi
chapter:
  number: 4
  title: Financials
  summary: >
    Rappi's four-stream revenue model—merchant commissions (~75%), in-app advertising
    (~13%), Rappi Prime subscriptions (~10%), and direct e-commerce (~2%)—generated an
    estimated $856 million in net revenue in 2023, up 37% year-over-year. As of December
    2025, CEO Simón Borrero confirmed four consecutive EBITDA-positive quarters and the
    company is reinvesting all profits ahead of a potential late-2026 IPO. Key risks
    include a R$1.4 billion zero-commission commitment in Brazil pressuring near-term
    EBITDA quality, an ongoing loss-making RappiPay Colombia subsidiary, and the complete
    absence of audited parent-level financials—a blocking gap for any underwriting exercise.

sections:
  - id: revenue-model-and-streams
    title: Revenue Model and Streams
    body: |
      Rappi monetises through four distinct revenue streams serving consumers, merchants,
      and FMCG brands on its super-app platform. Merchant commissions are by far the largest
      contributor, estimated at approximately 75 percent of total net revenue. Merchants pay
      a take rate of 10 to 30 percent of order value depending on category, market, and
      contract terms; effective all-in costs including optional marketing placements can
      reach 30 to 40 percent. In-app advertising fees charged to restaurants and fast-moving
      consumer goods companies for promoted listings, banner placements, and in-app campaigns
      contribute roughly 13 percent of revenue. Rappi Prime, the subscription membership
      priced at $5 to $10 per month depending on market, contributes approximately 10 percent
      and drives higher purchase frequency. Direct e-commerce sales from owned inventory
      account for a residual 2 percent and carry thin margins.

      Sacra estimated Rappi's 2023 net revenue at $855.52 million, implying 37 percent
      year-over-year growth from $624 million in 2022, representing a strong recovery after
      a 30.7 percent revenue decline in 2021. Online store GMV tracked by Grips recorded
      $505 million in 2025, with a further 10 to 20 percent decline projected for 2026.
      The cumulative revenue-to-loss trajectory through 2023 (COP 1.8 trillion revenues
      versus COP 1.2 trillion losses) underlines that Rappi operated at a structural cash
      deficit for most of its history before achieving its first profitable year in 2024.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI040
    tableRefs:
      - TI001
    figureRefs:
      - FI001

  - id: pricing-architecture-gtm
    title: Pricing Architecture and GTM Economics
    body: |
      Rappi's GTM model is a three-sided marketplace where pricing decisions must balance
      merchant economics, consumer affordability, and platform take. The standard restaurant
      commission of 10 to 30 percent of order value sits in line with global peers such as
      DoorDash and Uber Eats, but all-in costs including promotional fees and payment
      processing regularly reach 30 to 40 percent for a typical restaurant partner—a source
      of merchant friction documented in Rappi's core markets.

      Consumer-side delivery fees are charged dynamically at 5 to 15 percent of order value
      or a flat variable amount based on distance and demand. Rappi Prime reduces or
      eliminates delivery fees for frequent users who would otherwise pay per-order fees
      multiple times per month. In Brazil, Rappi adopted a structurally disruptive
      zero-commission model from May 2025: restaurants on the full-service model pay only
      a 3.5 percent payment-processing fee for three years through mid-2028.

      This policy is linked to a R$1.4 billion total Brazil investment commitment targeting
      growth from 30,000 restaurants across 50 cities to 100,000 across 300 cities by 2028.
      Despite restaurants being the entry vertical—roughly 80 percent of new organic Brazil
      users begin with the restaurant category—they accounted for only 20 percent of Brazil
      revenue when the policy was launched. The direct revenue cost of waived commissions
      is a material EBITDA headwind not quantified in public disclosures. In-app advertising
      rates are not publicly disclosed; diligence should establish CPM, fill rates, and
      segment revenue by geography.
    claimRefs:
      - CI007
      - CI008
      - CI015
      - CI019
      - CI020
      - CI021
      - CI042
    tableRefs:
      - TI002

  - id: cost-structure-unit-economics
    title: Cost Structure, Unit Economics, and Operating Leverage
    body: |
      Rappi's structural cost advantage over global delivery peers is driven by high
      delivery density in Latin America's dense urban cores and lower local labour costs.
      Sacra estimates Rappi's total delivery costs at approximately 10 percent of GMV,
      compared to 14 percent for Zomato, 16 percent for Meituan, and 30 to 32 percent for
      Uber Eats and DoorDash. This structural gap, if sustained, significantly improves
      contribution margin per order and accelerates zone-level payback.

      The company targets break-even in a newly entered zone within approximately 3.5 months,
      a key capital efficiency metric for its ongoing city expansion. Purchase frequency
      grows from roughly 2 times per month in a customer's first year to approximately
      11 times per month by year five, implying compounding LTV that improves unit economics
      over cohort lifetime. Around 90 percent of customers already purchase across more than
      one product category, supporting cross-vertical margin contribution.

      Rappi's 300-plus dark kitchens and micro-fulfilment centres operating across 6
      countries and 15-plus cities reduce per-order distance and shift logistics to a hub-
      and-spoke model. The Rappi Kitchen programme provides partner brands with equipment
      loans, commercial support, and virtual restaurant development. However, 300-plus dark
      kitchen locations carry fixed lease, staffing, and equipment costs that introduce
      operating leverage risk if demand softens or restaurant partners exit. Gross margin
      by segment and EBITDA margin remain undisclosed beyond the CEO's qualitative statements.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI044
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: capital-adequacy-financing
    title: Capital Adequacy and Financing Structure
    body: |
      Rappi has raised approximately $2.3 to $2.6 billion in total capital since founding
      across 21 rounds from investors including SoftBank, Andreessen Horowitz, DST Global,
      Sequoia Capital, T. Rowe Price, and Amazon. The last primary equity round was a
      $496 million Series F in July 2021 at a $5.25 billion post-money valuation; no new
      primary equity rounds have been disclosed since then.

      Three debt-side transactions were completed in 2025: a $100 million senior secured
      four-year loan from Banco Santander and Kirkoswald Capital Partners in August 2025
      (the largest single debt raise in Rappi's history, earmarked for refinancing and
      working capital); a $25 million Amazon convertible note in September 2025 granting
      Amazon warrants for up to 12 percent equity if defined milestones are met; and an
      undisclosed Gramercy Funds Management debt financing in October 2025. RappiPay
      Colombia separately raised $112 million in debt from Colombian banks in October 2022.

      CEO Simón Borrero confirmed in December 2025 that Rappi had been EBITDA-positive for
      four consecutive quarters, was reinvesting 100 percent of profits, and has no current
      need for new private equity. Rappi is evaluating conditions for a potential IPO in
      late 2026 but explicitly noted market timing constraints. No S-1 has been filed as
      of May 2026. Secondary market implied valuation as of April 2026 is approximately
      $2.0 billion—a 62 percent discount to the 2021 Series F peak. The Brazil R$1.4
      billion investment commitment (approximately $270 million USD) represents the single
      largest forward capital deployment obligation.
    claimRefs:
