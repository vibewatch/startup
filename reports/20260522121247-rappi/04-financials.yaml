  - id: TI005
    title: Public Financial Gaps and Diligence Paths
    columns:
      - Missing Metric
      - Impact Severity
      - Reason Unavailable
      - Exact Diligence Path
    rows:
      - - Audited parent-level P&L and balance sheet
        - Blocking
        - Rappi is private and has not published consolidated audited financials
        - Request audited annual statements (2022–2025) from management as a condition of any investment process
      - - Total platform GMV across all verticals and geographies
        - Material
        - Company has not disclosed aggregate GMV; Grips tracks e-commerce only
        - Request GMV by country and vertical (food, grocery, fintech); enables realised take-rate calculation
      - - Net income vs EBITDA reconciliation
        - Material
        - CEO confirmed EBITDA positive; D&A, SBC, and interest on debt not disclosed
        - Request GAAP/IFRS net income for 2023–2025; bridge to EBITDA; identify non-cash charges
      - - Segment gross margin (delivery, advertising, subscriptions, fintech)
        - Material
        - No segment reporting available; mix shift hypothesis cannot be verified
        - Request segment gross profit from management data room; benchmark against delivery peers
      - - Brazil zero-commission EBITDA impact forecast
        - Material
        - Commitment announced May 2025; quarterly Brazil P&L not yet visible publicly
        - Request quarterly P&L for Brazil through 2028; commission waiver cost by quarter
    notes: >
      Impact severity rated against underwriting readiness. Blocking means the metric
      must be obtained before any valuation can be set. Material means the absence affects
      valuation range by more than 10%. All gaps reflect absence of public evidence,
