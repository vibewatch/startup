callouts:
  - calloutType: strength
    title: EBITDA Profitability Milestone Achieved
    body: >
      Rappi achieved positive EBITDA for four consecutive quarters as of December 2025,
      the first sustained profitability in its ten-year history, and is reinvesting
      100 percent of profits. This turnaround, supported by delivery cost efficiency
      (~10% of GMV vs 30–32% for global peers) and improving high-margin advertising
      and subscription revenue mix, supports the IPO narrative and reduces immediate
      financing dependency.
    claimRefs:
      - CI022
      - CI009

  - calloutType: risk
    title: Brazil Zero-Commission Commitment Pressures EBITDA Quality
    body: >
      The R$1.4 billion Brazil investment and three-year zero-commission policy for
      restaurants—effective through mid-2028—eliminates the primary revenue stream from
      Rappi's largest strategic expansion market for an extended period. With restaurants
      accounting for only ~20% of Brazil revenue despite being the primary user-acquisition
      vertical, the revenue cost is uncertain but represents a tangible EBITDA drag that
      may offset group-level profitability.
    claimRefs:
      - CI019
      - CI020
      - CI008

  - calloutType: risk
    title: RappiPay Colombia Remains Loss-Making
    body: >
      RappiPay Colombia posted a COP 15.4 billion nine-month 2025 net loss, only
      marginally improved from COP 15.8 billion in the same 2024 period. As a regulated
      non-bank financial institution with growing deposit and credit exposures, it requires
      sustained capital support. Fitch Ratings highlights that LatAm embedded finance
      arms face high funding costs and limited proven credit deepening that constrain
      path-to-profitability timelines.
    claimRefs:
      - CI031
      - CI045

  - calloutType: recommendation
    title: Minimum Disclosures Required Before Any Investment Commitment
    body: >
      The following are required before underwriting: (1) audited consolidated P&L and
      balance sheet for 2022–2025; (2) total GMV by country and vertical to calculate
      realised take rates; (3) GAAP/IFRS net income reconciliation bridging from EBITDA;
      (4) segment gross margins for delivery, advertising, subscriptions, and fintech;
      (5) quarterly Brazil P&L forecast through 2028 quantifying zero-commission revenue
      impact. The ~$2.0B April 2026 secondary market value is a reference point, not a
      valuation anchor.
    claimRefs:
      - CI038
      - CI041

