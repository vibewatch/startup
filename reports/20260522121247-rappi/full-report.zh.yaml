      - number: '1.4'
        title: 当前战略里程碑也包括收缩、劳工压力和消费者制裁
        blocks:
          - type: paragraph
            body: >-
              只看增长里程碑，已经无法理解 Rappi 的当前画像。公司向超级应用演进，确实包括 Rappi Turbo 背后的即时零售推进、走向持续 EBITDA 盈利的表态，以及在 Colombia
              深化金融科技产品。但同一时期也出现了明确的战略修剪和监管压力。在 Mexico，Rappi 退出 IFPE 牌照流程，关闭 Rappicuenta，随后在一项长期商业协议下把 RappiCard 业务卖给
              Banorte。在 Colombia，劳工检查促成了 2025 年关于骑手条件的协议；SIC 又在 2026 年 4 月因系统性消费者权益缺陷处以 COP 4.0 billion 制裁。这些事件重要，因为它们把
              Rappi 叙事从单纯规模推向制度化执行风险。它们也说明，Rappi
              当下的运营护城河不仅取决于商户密度或配送速度，同样取决于合规纪律和伙伴管理。后续章节因此应把监管纪律、伙伴依赖和运营可靠性视为一阶承销变量，而不是旁注。
