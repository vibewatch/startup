            body: >-
              公司仍明显由创始人主导。Simón Borrero 是最直接关联 Rappi 战略方向的高管，Sebastián Mejía 和 Felipe Villamarín
              则仍是外部媒体和公司资料中创立叙事的核心。这种集中度给了 Rappi 清晰的创业者身份，但也让外部人难以看清更广泛的董事会构成和继任计划。与 RappiPay 相比，这种披露不对称尤其明显：其 Colombia
