    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营版图与平台逻辑
        blocks:
          - type: paragraph
            body: >-
              Rappi 仍是拉美辨识度最高的消费科技品牌之一，因为它早已不止做餐厅配送，而是拓展成区域性的便利服务和金融科技生态。公开资料和 Rappi
              面向商户的页面，都持续把公司描述为超级应用，而非单一品类市场平台。官网强调，已有 40,000 多家合作商户在 9 个国家与 Rappi 合作；Yahoo Finance 等资料聚合平台则称其覆盖 400
              多座城市、超过 3,500 万活跃用户。这个规模很关键，因为 Rappi
              同时向消费者卖便利、向商户卖需求生成、向骑手提供收入机会。即便如此，公开披露更多展示运营广度，而非经审计的集团经济性。平台故事清晰；底层市场平台盈利能力和各国贡献仍部分不透明。
