      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >
              Rappi 2023 年月活用户同比增长约 37%，达到 5.5 million MAU；在跨九国运营的成熟期配送超级应用中，这一增速高于平均水平。公司称 2025 年电商收入约 $505
              million，较上年增长 5–10%，并在运营效率提升和规模驱动利润率改善带动下于 2025 年实现盈利。Splunk 案例研究提供了最清晰的规模信号：Rappi 平台每月在九国处理超过 8.8 million
              单订单，并在部署 Splunk Observability Cloud 到生产环境后扛住 300% 订单激增，平均故障解决时间缩短超过
              90%。具名技术供应商部署是私人市场平台目前最强的独立客户证明。Amplitude Analytics 嵌在 Rappi 增长职能核心：Amplitude 案例研究记录，通过行为分群，首次下单完成量提升
              10%，获客成本下降 30%，且 240 名内部团队成员每周使用 Amplitude 数据——这种集成深度说明其处于生产成熟阶段，而不是试点。AWS 为 Rappi
              九国交易平台、支付系统和配送运营提供全套云基础设施；这段多年合作验证了平台云原生架构的耐久性。LogRocket 在生产环境监控 Rappi 前端用户体验，记录了首次下单转化提升和会话放弃减少。Marvik AI
              部署了生产 AI 系统，包括语义搜索、AI 驱动商户看板和配送路线优化——这个早期 AI 供应商关系显示 Rappi 愿意接入 AI，但缺少独立验证的结果。上述技术部署共同确认，Rappi
              运营的是大规模生产级平台，不是试点阶段产品；不过全部证据均来自供应商案例研究，天然带有确认偏差，也没有独立审计或第三方评审佐证量化结果。
