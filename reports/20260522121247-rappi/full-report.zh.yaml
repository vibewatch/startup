      - number: '5.4'
        title: 信任、合规、开发者生态与缺口
        blocks:
          - type: paragraph
            body: >
              Rappi 的数据保护姿态锚定哥伦比亚 Ley 1581 de 2012 和 Decree 1074 de 2015（Habeas
              Data），包括明确同意要求、用户访问/更正/删除权，以及限制未授权人员访问敏感数据库。RAPPI S.A.S. 发布的隐私政策覆盖包括合作伙伴 API 集成在内的所有个人数据处理。Google Play
              数据安全声明确认数据传输加密，用户可请求删除；按已披露信息，不向第三方共享数据。API 安全由 Wallarm 强化（替代旧 WAF），配有 IaC 集成的 DevSecOps 工作流、Bitbucket 同步和
              Slack 集成告警。开发者门户（dev-portal.rappi.com，API v1.24.5）为商户合作伙伴（Rappi “盟友”）提供 OAuth 2.0 Bearer-token
              认证和自助入驻，端点覆盖菜单、订单、门店、商品可用性和 webhook 回调。

              关键缺口仍在。平台没有公开披露正常运行时间 SLA，也没有可被第三方可靠性跟踪器索引的状态页——WebsiteCharts 和 Downdetector
              均提示测量数据不足，投资人拿不到可审计的可靠性基线。Google Play 2.31 million 条评价给出 3.4/5，反复出现订单取消但无沟通、无法联系人工客服等投诉。Rappi 交付平台没有公开记录的
              SOC 2、ISO 27001 或 PCI DSS 认证（RappiPay 的金融科技合规姿态另计）。GitHub 上 “rappi” 主题页面只有 13 个仓库，且均为社区或学生项目——Rappi
              没有实质开源足迹，外部审计核心技术栈的空间有限。
