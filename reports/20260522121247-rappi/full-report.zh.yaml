          - type: callout
            title: 缺少收入披露时，SOM 估计不确定性很高
            body: >-
              Rappi 食品配送 GMV 的所有 SOM 估计（到 2026 年每年 $7–14B）都来自第三方市场份额近似值，再套用区域市场规模估计；它们不是来自公司披露的 GMV 或抽佣率数据。2×
              区间（7B–14B）反映分母（市场规模）和分子（Rappi 份额）都确有不确定性。在承销任何基于 SOM 的收入预测前，关键尽调步骤是至少从 Rappi 管理层取得国家层面 GMV 确认和抽佣率区间。
