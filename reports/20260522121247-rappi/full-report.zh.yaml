  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围与边界
        blocks:
          - type: paragraph
            body: >-
              Rappi 的市场横跨多个高频消费垂直领域——餐厅外卖、即时生鲜杂货和药品履约、一般零售配送、金融科技服务（数字支付、信用卡和新银行），以及旅行 /
              票务——并由一个服务拉美城市人群的超级应用平台统一承载。公司截至 2026 年在 9 个国家（Colombia、Mexico、Brazil、Argentina、Chile、Peru、Ecuador、Costa
              Rica、Uruguay）运营，覆盖超过 400 座城市。

              市场边界明确排除三类：（1）传统线下实体零售，在这里，现金自提型社区 tiendas 和 abarroteras
              仍是日常家庭消费的主导形式；（2）大宗或每周生鲜杂货采购，消费者绝大多数仍在线下超市完成；（3）需要专门基础设施的重货或冷链物流，Rappi
              当前并不运营。现状替代品依然强大：步行到店的社区门店、给本地餐厅直接打电话下单，以及摩托车信使的非正式当日达，都在分走 Rappi 试图转化为数字平台交易的消费。

              具备估值相关性的邻近业务包括：面向 SME 商户的 B2B 末端物流（独立于消费者渠道）、利用 RappiPay 钱包基础设施的跨境汇款和支付通道，以及面向 SME 的金融服务（商户
              POS、营运资金贷款）。这些邻近业务尚未成为实质性收入线，但代表嵌入现有物流和金融网络中的战略选择权。
