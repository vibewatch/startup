      - number: '8.4'
        title: 投资建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              证据权重支持“观察”建议，置信度为中；若按 $5.25–5.36 billion 的股权融资价格，估值立场仍是偏高。按老股市场隐含水平（$1.77–2.0 billion）进入时，隐含收入倍数降至
              2.0×–2.3×，估值更接近合理；但老股交易还带有流动性不足、股权结构表不透明，以及 Rappi 优先购买权条款可能带来的转让限制。关键催化剂和定价事件是向 SEC 提交 IPO S-1
              招股说明书；若市场条件允许，文件预计在 2026 年出现，届时会首次披露经审计收入、EBITDA、股权结构表和清算优先权堆叠。


              乐观情景并非不存在，但现有证据不足以给它更高权重：金融科技收入规模和广告业务对 EBITDA 的贡献都无法公开核验；IPO 自 2023 年以来多次对外宣布，却始终没有落地。El País（2025 年 6
              月）指出，考虑到 Rappi 多次推迟上市，分析师质疑其 IPO 叙事是否可信；报道称，只有两个垂直业务产生显著收入。这种怀疑来自可观察事实，不是个别人的主观判断。


              下表列出会打破当前投资逻辑的触发条件：EBITDA 连续六个或更多季度为正且获得审计确认；哥伦比亚或巴西不再新增监管处罚；金融科技收入超过 $200 million；向 SEC 提交
              S-1。最终尽调还要完成股权结构表瀑布分析、经审计财报、RappiPay 独立损益表，以及优先权悬置的量化。关注老股入场的投资者，至少应要求较基准情景估值中点（$3.2 billion）折价 30 %
              作为安全边际，对应合理老股入场价不高于 $2.2 billion 隐含市值。
