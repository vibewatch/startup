      - number: '6.3'
        title: 留存、满意度与扩张
        blocks:
          - type: paragraph
            body: >
              Rappi 的留存图景按平台分裂。Apple App Store 超过 82,000 条评分给出 4.6/5，说明经常使用应用的活跃日常用户满意度较强。G2 商业用户评价为 14 条评论
              3.9/5，反复批评客服响应时间和退款处理；这与一个每天数十万订单交易平台的规模管理挑战一致。相反，投诉导向平台情绪极差：PissedConsumer 107 条评价给 Rappi 1.3/5，只有 6%
              评价者愿意推荐该服务；Trustpilot（评审时无法访问，但搜索数据有记录）为 649 条评价 1.1/5，主要问题是未授权扣费、骑手盗窃和退款失败。这种分化是结构性的：App Store
              评分捕捉活跃且满意的用户，投诉平台则过度捕捉负面体验尾部。没有私有队列数据，两者都不是可靠留存指标。Rappi 未公开披露任何细分群体的 NRR、GRR、月流失率或队列级留存数据。按需配送应用的行业基准显示，30
              天留存通常落在 3–6% 区间，意味着即便头部平台也有结构性流失压力。Rappi Prime 和 Rappi Pro 订阅——提供免配送费、专属折扣以及通过 RappiCard 返现——是主要留存和 LTV
              工具，公司管理层目标是在 2025 到 2026 年间将 Rappi Prime 订户数翻倍。拉美忠诚度计划市场预计将从 2025 年 USD 5.09 billion 增至 2029 年 USD 8.7
              billion，RappiPrime 与 Amazon Prime Mexico、Mercado Pago 并列为关键参与者。LogRocket 的生产部署记录了前端性能优化带来的可衡量转化改善，表明 Rappi
              正在用工程手段减少会话放弃、推动留存。
