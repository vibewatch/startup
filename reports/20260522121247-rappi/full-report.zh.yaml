              Rappi 在巴西——其哥伦比亚以外最大市场——同时承受两个资金充足进入者压力：iFood 与 Uber 的整合（交叉推广和捆绑）以及 Meituan 承诺投入 USD 1 billion 推出
              Keeta。协调性的价格战或商户独家行动可能迅速侵蚀 Rappi 巴西地位。这是近期最尖锐的单一竞争性投资逻辑破裂场景。
