      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Rappi 的市场由 5 类不同利益相关方组成，各自的预算归属、采用触发点和货币化机制都不同。

              核心消费者群体是 18–40 岁、拥有智能手机且可支配收入中高的城市居民。这个群体通常靠便利性驱动的发现转化——往往伴随促销折扣——并通过配送费、服务费，以及向 Rappi Prime
              订阅的交叉销售实现货币化。估计 550 万月活用户（MAU）位于 Rappi 覆盖城市中超过 300 million 拉美城市人口的更大可触达人群之内。

              餐厅和商户是 B2B 付费方，每单通常支付 15–30% 的佣金率。他们的采用触发点是增量收入可见性，以及接入 Rappi
              消费者基础；预算所有者是餐厅或零售店经理。配送骑手（repartidores）构成供给侧运营层，Rappi 网络中约有 350,000+ 合同工，但他们不是传统意义上的买方——他们用劳动换取按单收入。

              对 Rappi 长期金融科技投资逻辑而言，无银行账户和银行服务不足人群可能是结构上最重要的买方群体。截至 2024 年，拉美约 100 million 成年人仍没有正式银行账户。2021 至 2025
              年，数字钱包采用率从拉美成年人 11% 增至 43%，翻了两番；这一结构性变化扩大了 RappiPay 和 RappiCard 的总可触达用户基础。Mastercard 2026 年研究发现，89%
              拉美消费者可归为数字用户，68% 非用户表示可能采用数字支付，进一步印证机会的广度。

              SME 是 RappiPay 商户支付产品的新兴 B2B 买方。这个群体渗透率不足：传统银行长期要求线下网点触达和正式信贷记录，而多数拉美微型创业者缺少这两者，因此更容易接受嵌入 Rappi
              生态、数字优先的支付轨道。
