      - number: '4.6'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >
              到 2026 年中，Rappi 的财务画像确实讲得出扭亏故事：EBITDA 转正、当前不需要新股融资、IPO
              目标也有可信度；但可用于承销的证据仍然很薄。缺少经审计的母公司层面财务报表是硬性缺口：投资人无法独立核验 EBITDA 说法，无法对齐不同来源的收入估计（2023 年因口径不同介于 $464 million 至
              $1.3 billion），也无法判断净利润与 EBITDA 的偏离。四条收入流显示质量在改善，高毛利广告和订阅相对低毛利电商在增长；但巴西三年零佣金承诺切断了 Rappi
              最大战略扩张市场的核心利润率驱动因素，并可能压低集团合并 EBITDA 直到 2027 年。RappiPay Colombia 仍然是被绑定在集团内的现金消耗项。二级市场约 $2.0 billion
              的隐含估值（2026 年 4 月）与 2021 年 $5.25 billion 的峰值相比，说明成熟私募市场参与者已经将 Rappi 股权下调约 62%。任何投资人若想按接近 Series F
              的价格入场，都必须先解释这个参照。
            claimRefs:
              - CI041
              - CI044
              - CI045
      - number: '4.7'
        title: 展品
        blocks:
          - type: callout
            title: EBITDA 盈利里程碑已兑现
            body: >
              截至 2025 年 12 月，Rappi 已连续四个季度实现 EBITDA 为正，这是其十年历史中首次持续盈利，并且公司将 100% 利润重新投入业务。配送成本效率（约 GMV 的 ~10%，全球同行为
              30–32%）叠加高毛利广告和订阅收入占比改善，支撑 IPO 叙事，也降低了短期融资依赖。
            calloutType: strength
            claimRefs:
              - CI022
              - CI009
          - type: callout
            title: 巴西零佣金承诺挤压 EBITDA 质量
            body: >
              R$1.4 billion 的巴西投资和面向餐厅的三年零佣金政策将持续到 2028 年中，等于在较长时间内拿掉 Rappi 最大战略扩张市场的主要收入流。餐厅虽是主要获客垂直，但仅贡献巴西收入约
              ~20%；收入代价仍不确定，却会形成实质 EBITDA 拖累，可能抵消集团层面的盈利。
            calloutType: risk
            claimRefs:
              - CI019
              - CI020
              - CI008
          - type: callout
            title: RappiPay Colombia 仍在亏损
            body: >
              RappiPay Colombia 2025 年前九个月净亏损 COP 15.4 billion，仅略好于 2024 年同期的 COP 15.8
              billion。作为受监管的非银行金融机构，且存款和信贷敞口在增长，它需要持续资本支持。Fitch Ratings 指出，拉美嵌入式金融业务面临高融资成本，且已验证的信贷深化有限，这会限制走向盈利的时间表。
            calloutType: risk
            claimRefs:
              - CI031
              - CI045
          - type: callout
            title: 任何投资承诺前必须补齐的最低披露
            body: >
              承销前需要取得以下材料：(1) 2022–2025 年经审计合并 P&L 和资产负债表；(2) 按国家和垂直拆分的总 GMV，以计算实际 take rate；(3) 从 EBITDA 到 GAAP/IFRS
              净利润的调节表；(4) 配送、广告、订阅和金融科技分部毛利率；(5) 到 2028 年的巴西季度 P&L 预测，量化零佣金收入影响。2026 年 4 月约 ~$2.0B 的二级市场价值是参照点，不是估值锚。
            calloutType: recommendation
            claimRefs:
              - CI038
              - CI041
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与垂直战略
        blocks:
          - type: paragraph
            body: >
              Rappi 2015 年从跑腿应用起步，之后系统拼出一个多垂直超级应用，覆盖按需餐饮和杂货配送、10 分钟极速电商（Rappi
              Turbo）、云厨房（RappiKitchen）、金融科技服务（RappiPay、RappiCard、RappiPréstamos）、订阅会员（Rappi Pro、Rappi Pro
              Black）、旅行预订（Rappi Travel）以及跑腿管家功能（RappiFavor）。截至 2026 年 5 月，Google Play 页面显示，Rappi 在拉美九国、300 多座城市提供
              200,000 多家餐厅和商店。该应用最近一次更新为 2026 年 5 月 16 日，2.31 million 条评价给出 3.4/5，说明客户满意度缺口仍然存在。

              每个垂直都围绕延长用户停留时间、提高钱包份额设计。Rappi Pro（每月 COP 24,490，约 USD 6）和 Rappi Pro Black（每月 COP 32,990，约 USD
              8）解锁不限次免配送费、服务费折扣、RappiCard 返现，并向新 Pro Black 订阅者开放 ChatGPT GO。金融科技部门 RappiPay 在哥伦比亚与 Davivienda 联合运营，并于
              2026 年 5 月新增 RappiPréstamos Aliados：面向商户提供 COP 1.8M 至 COP 61.3M 信用额度，基于交易历史由算法预批，数分钟内放款，并按未来 Rappi
              销售额的一定比例还款。RappiKitchen 在哥伦比亚、墨西哥和巴西 15+ 座城市提供三种暗厨配置——共享枢纽、卫星扩张和共享集群厨房。垂直宽度带来网络效应和变现密度，也抬高运营复杂度和监管暴露面。
