  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Rappi 在拉美面对 4 个层级的竞争。第一层是直接配送超级应用：iFood、DiDi Food（在 Brazil 品牌为 99Food）、Uber Eats 和
              PedidosYa，它们都在城市规模上提供按需餐厅和生鲜杂货配送。第二层是 MercadoLibre 这样的一体化电商与物流平台，其 Mercado Envios 当日达物流和 Mercado Pago
              金融科技合在一起，复制了 Rappi 超级应用的广度，但服务的是稍有不同的购买场景（次日达和计划性购买，对比超快即时冲动消费）。第三层包括新进入和再进入的颠覆者：Meituan 旗下 Keeta 于 2025 年
              5 月宣布在 Brazil 投入 $1 billion、周期 5 年；DoorDash 曾在 2023 年探索 Brazil 但没有推进。第四层是现状替代品——基于 WhatsApp
              的餐厅点单、电话配送和非正式骑手——在城市化程度较低的拉美市场，它们仍占餐厅配送量的可观份额。

              各国市场份额高度集中且因国而异。iFood 在 Brazil 掌握超过 80% 的移动端月活用户，基本形成垄断。Rappi 在本土市场 Colombia 拥有约 64% 的 MAU 份额，但在全部国家合计的拉美
              MAU 中仅约 17%。Delivery Hero 旗下 PedidosYa 以 61% MAU 领跑 Argentina，并覆盖 15 个国家。DiDi Food 在 Mexico 拥有约 38% MAU，与
              36% 的 Rappi 接近竞争。Uber Eats 退出 Brazil 和 Argentina 后，仅保留约 7% 拉美 MAU，集中在 Mexico。这样的碎片化意味着没有单一平台主导整个区域，Rappi
              必须同时在多个地理市场防守，面对根深蒂固的本地冠军和资本充足的新来者。
