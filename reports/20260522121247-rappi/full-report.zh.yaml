        - label: 市场机会
          value: 8
          note: 拉美配送 + 金融科技总可用市场（TAM）>$100B；长期顺风明确
        - label: 竞争位置
          value: 7
          note: 拉美超级 App 领导者，覆盖 9 个国家；iFood 和 MercadoLibre 是可信挑战者
        - label: 技术护城河
          value: 6
          note: Rappi Turbo、AI 物流、AWS 合作；但资金充足的对手也能复制
        - label: 单位经济效益
          value: 5
          note: 公司称 EBITDA 为正但未经验证；配送利润率仍薄；金融科技上行空间可观但未证实
        - label: 财务透明度
          value: 3
          note: 无审计财务；收入区间 $800M–$1.3B；股权结构表未公开
        - label: 管理层执行
          value: 6
          note: 已达盈利里程碑；已任命 CFO；但 IPO 一再推迟
        - label: 估值吸引力
          value: 4
          note: 股权轮价格偏高（未验证收入的 4×）；按约 $2B 的二级市场价格进入更站得住脚
    approximationNotes: 评分为定性判断，基于截至 2026-05-22 的公开证据；不构成投资建议。
