          description: |
            通过手机号或社交账号创建账户；兑换优惠码；首单是关键 CAC 激活事件，由 Amplitude 和 LogRocket 跟踪
        - label: 重复使用
          description: |
            每月 2+ 单，横跨餐饮和生鲜杂货；算法把消费者导向转化率高的餐厅；商户广告投入提高其在 App 信息流中的可见度
        - label: 会员订阅
          description: |
            订阅 Rappi Prime 或 Rappi Pro，获得免配送费、返现和专属折扣；订阅把交易型用户转成持续付费关系
        - label: 交叉销售激活
          description: |
            RappiPay QR 钱包、RappiCard 信用卡、RappiBank 数字账户和旅行预订把金融服务嵌入配送闭环；金融科技放大 LTV
        - label: 口碑与推荐
          description: |
            App Store 评价、社交分享、推荐码和商户广告投入；满意用户降低净 CAC；平台级评分撬动商户增长
