      - number: '2.5'
        title: 规模测算矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最关键的规模测算矛盾，是狭义食品配送 TAM 估计（2024 年基于平台的 $12.9 billion）与广义总食品交易估计（$78.6 billion+）之间 6×
              的差距。这种分歧不是分析师错误，而是市场定义的根本差异——平台 GMV 对比技术可触达的全部食品支出——并直接影响套用到 Rappi GMV 上的估值倍数。

              拉美非现金数字支付交易增长预计到 2028 年将超过 20% CAGR，由实时支付基础设施带动。Brazil 的 Pix 已被引用为在本国实现超过 90% 消费者采用，Rappi
              可以把它作为案例，说明常态化数字支付轨道在随后几年会如何改变电商和配送平台抽佣率。Fitch Ratings/DataCube Research 预计，仅拉美金融科技数字支付子板块到 2033 年就将达到
              $663.88 billion，CAGR 为 7.5%；这一规模远超配送专属 TAM，也锚定了超级应用金融科技交叉销售机会。

              数百家本地快餐餐厅造成市场碎片化，限制 Rappi 在早期市场的佣金议价能力；只有平台密度形成锁定效应后，这一结构性挑战才会缓解。通胀和货币波动——尤其在 Argentina——侵蚀实际
              GMV，也让跨市场单元经济性基准变复杂。2021 至 2025 年，Colombia 和 Peru 的数字钱包拥有率推动金融普惠率提高 45–50
              个百分点，证明金融科技机会并非静态：随着有银行账户人群占比上升，RappiPay 的 TAM 也在扩大。

              关键未解缺口包括：需要国家层面 GMV 和抽佣率披露来三角校验 SOM 估计；需要 Rappi 各市场零工重新分类的明确监管时间表；以及需要独立核验 Rappi
              所称连续多个季度盈利。如果盈利可持续，就能在结构性成本压力下验证单元经济性投资逻辑。
            claimRefs:
              - CM041
              - CM042
              - CM043
              - CM044
              - CM045
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: iFood 在 Brazil 的主导地位形成结构性 SAM 天花板
            body: >-
              Brazil 约占拉美电商 GMV 的 38%，是该区域单一最大市场。iFood 估计 89% 的食品配送市场份额，使 Rappi
              若没有根本不同的策略，商业上难以重新进入。这不是周期性逆风，而是持久竞争护城河；在 Brazil 局面改变前，它会封顶 Rappi 的配送 TAM。尽调应追问 Rappi
              的金融科技产品（RappiPay）能否脱离配送应用单独触达 Brazil 消费者，还是 Brazil 约束会延伸到整个产品栈。
