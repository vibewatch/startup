  - id: FU001
    title: 客户旅程图 — Rappi B2C 消费者生命周期
    type: journey-map
    layout: wide
    summary: |
      从发现到交叉销售和口碑倡导的六阶段消费者生命周期，展示每个阶段如何创造价值，或在哪些节点可能流失。
    data:
      items:
        - label: 发现
          description: |
            App Store 自然搜索、口碑推荐、付费社交广告和餐厅联合营销；大量使用优惠码降低首次会话摩擦
