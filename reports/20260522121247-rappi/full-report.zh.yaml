              Rappi 在巴西的 Turbo Farma 试点直接冲突 Abrafarma 对 Law 5,991/73 和 ANVISA RDC 44
              的解释；这两项规则将药品销售限制在面向公众开放的药房。若巴西法院判定暗店药房模式不成立，Rappi 规模可观的 R$1.4 billion 巴西投资逻辑将受威胁，而巴西 CEO
