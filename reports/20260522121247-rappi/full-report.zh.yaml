      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              相比只做食品的竞争对手，Rappi 最有辨识度的能力是 Turbo 超快配送垂直业务，承诺依托前置仓和合作厨房在 30 分钟内送达。截至 2024 年末，Rappi 在 Brazil 12 座城市（São
              Paulo、Rio de Janeiro、Minas Gerais、Pernambuco、Ceará）运营 50 家自营 Turbo Supermarkets，每家门店约有 1,800 个 SKU。Turbo
              Restaurants 在该报道前 9 个月上线，占 Rappi Brazil 餐厅订单的 2.5%，目标到 2025 年底达到 10%。Rappi Prime
              是其订阅产品，按月收费，提供免费配送和专属折扣，模仿 Amazon Prime 对复购用户的锁定机制。

              iFood 的 GTM 优势集中在 Brazil 的餐厅供给密度和广告技术。CADE TAC 生效前，iFood 一直控制排他餐厅合同，把大多数消费者偏好的餐厅品牌纳入旗下。TAC 之后，Rappi CEO
              Simon Borrero 承认，iFood “成功封锁了 Brazil 大多数合作伙伴，导致所有主要玩家离开该国”，并称单靠自然增长还需要一年才能在市场动态中体现；这与 ABRASEL 主席 Paulo
              Solmucci 对 Rappi “不太可能仅靠自然增长在 Brazil 成为强势玩家”的判断一致。

              最近最重要的 GTM 进展，是 2025 年 11 月上线的 Uber-iFood 平台集成。用户现在可以在 iFood 应用内叫 Uber，也可以在 Uber 应用内点外卖，形成出行加配送的组合便利层。Uber
              和 iFood 于 2025 年 5 月 14 日通过 Uber 投资者关系正式新闻稿宣布这一战略合作。该集成加深了两个平台的留存，也让单一服务竞争对手更难匹配这种跨品类组合便利。

              配送成本效率是 Rappi 相比全球同行的结构性定价优势。Sacra 估计 Rappi 配送成本约为 GMV 的 10%，显著低于 Zomato 的 14%、Meituan 的 16% 和 Uber Eats 的
              32%。这种效率让 Rappi 在核心市场能够保持竞争性定价，而不必像 Uber Eats 过去那样依赖同等补贴水平。
