      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 多项生产级技术部署确认平台规模
            body: >
              Amplitude、Splunk、AWS 和 LogRocket 具名发布的案例研究共同确认，Rappi 运营的是具有真实规模的多国生产级平台——不是试点或原型。供应商量化结果（MTTR 降低 90%+、首单
              +10%、CAC -30%）是可复核的尽调锚点，独立审计方可以验证。这种技术供应商采用深度，在同年龄段的拉美私营平台中并不常见。
            calloutType: strength
            claimRefs:
              - CU017
              - CU018
              - CU019
              - CU014
          - type: callout
            title: SIC 监管罚款与投诉平台评分指向结构性客服风险
            body: >
              哥伦比亚 SIC 于 2026 年 4 月因系统性消费者保护违规对 Rappi 罚款 USD 1.09 million，点名未授权订阅扣费、误导性广告和反复不遵守此前命令。Trustpilot（1.1/5）和
              PissedConsumer（1.3/5）相互印证了结构性缺陷。若客服质量无法随交易量扩展，流失将在 Rappi 2026 年收入已被 Grips 和 Sacra 分析师预计下降 20–50% 的时点加速。
