            body: >
              Rappi 的 4.6/5 App Store 评分和 1.1/5 Trustpilot 评分并不矛盾——它们反映的是不同用户队列。App Store 评分者是获得便利价值的活跃日常用户；Trustpilot
              评分者是经历账单欺诈、盗窃或支持失败的用户。分化说明产品对多数人运行良好，但经历故障的少数用户没有得到足够服务，进而制造出与绝对投诉量不成比例的监管和声誉风险。
