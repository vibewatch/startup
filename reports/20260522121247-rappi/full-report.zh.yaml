  - id: TV005
    title: 投资逻辑破裂与止损触发点
    columns:
      - 触发点
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入停滞
        - 首份经审计文件确认年收入 ≤ $800 M
        - 基准情景估值压缩至 $1.0–1.5 B；DoorDash 式溢价站不住脚
        - 卖出 / 回避；只有收入 1× 入场价才重新评估
      - - IPO 取消或推迟到 2027 年以后
        - 到 2027 年 Q4 仍未向 SEC 提交 S-1
        - 价格发现催化剂消失；老股投资者被困住，退出无门
        - 退出老股头寸；跟踪是否出现下调估值融资
      - - 下调估值轮（新股融资低于 $3 B 标记）
        - 新股融资估值 < $3 B
        - 抹掉股权轮溢价；迫使 2021–2022 年投资者确认亏损
        - 避免跟投新股轮；估值重置后再评估入场
      - - Amazon 合作关系解除
        - Amazon 不行使认股权，并公开与 Rappi 拉开距离
        - 战略底价消失；释放里程碑未达成信号；削弱 IPO 叙事
        - 将观察下调为回避
      - - 额外监管处罚（等值超过 $10 M COP）
        - SIC 或 ANPD 正式罚款超过等值 $10 M，或运营禁令
        - 在核心市场增加合规成本、品牌风险和投资者不确定性
        - 重评监管章节；可能升级为回避
      - - EBITDA 逆转（2 个或更多季度为负）
        - CEO/CFO 公开确认 EBITDA 为负的期间；或 S-1 文件显示未盈利
        - 抹掉 2025 年最正面的单一数据点；估值推向悲观情景
        - 建议从观察改为回避
    notes: 触发点基于公开可观察信号定义；阈值为示例，等实际 S-1 披露后应校准。
