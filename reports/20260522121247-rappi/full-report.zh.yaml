  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Rappi 最近期最实质的风险簇是监管。哥伦比亚 Superintendencia de Industria y Comercio（SIC）2026 年 4 月对 Rappi S.A.S.
              作出标志性制裁，针对系统性消费者保护违规：未经授权的 Prime/Pro 订阅扣费、误导性的 Rappi Turbo 配送时效承诺、削弱消费者保障的不公平合同条款，以及投诉解决长期失灵。合计罚款超过 COP 4
              billion（约 USD 1 million）。关键在于，Rappi 提起申诉后，Tribunal Administrativo de Cundinamarca 于 2026 年 4 月驳回上诉，并确认
              Rappi 是电商提供者，而非单纯中介，因此受哥伦比亚 Estatuto del Consumidor（Ley 1480）完整约束。这一先例大幅扩大监管暴露面：Rappi
              现在必须保证产品质量、配送准确性和全面售后权利，而不只是撮合买卖双方。它也意味着未来 SIC 调查可直接升级为罚款，无需警告阶段，因为 Rappi 此前已收到指令却未遵守。哥伦比亚还在 2025 年 6 月通过
              Ley 2466 de 2025 进一步收紧劳动框架，要求数字配送平台为零工骑手缴纳 60% 社保（健康保险和养老金）以及 100% 职业风险保险——覆盖依附型和独立承包商两类。叠加 Rappi 与
              USMTT/Unidapp 工会 2025 年 3 月达成的集体协议（账户停用前的正当程序保护，并获哥伦比亚 Constitutional Court
              维持），即便没有完全重分类为雇员，每名骑手的事实用工成本也实质上升。金融科技方面，墨西哥 CNBV 在 Rappi 拒绝遵守 Ley Fintech 许可框架后要求其提交退出计划；Rappi 随后以约 USD
              50 million 将其在 Tarjetas del Futuro 的股权出售给 Banorte。巴西 ANPD 发布 2025–2026 监管议程，将 LGPD 执法扩展至
              AI、生物识别、儿童数据和国际传输，罚款最高可达每次违规 BRL 50 million 或年收入 2%——这与 Rappi 庞大的数据足迹直接相关。
