      - number: '1.3'
        title: 资本历史：从巨额股权融资转向混合融资
        blocks:
          - type: paragraph
            body: >-
              公开可查的融资数据呈现出一家先靠大额风险投资轮做起来、如今开始试验更宽融资菜单的公司。Tracxn 资料汇总显示，公司约融资 $2.46 billion，覆盖 15 轮；被广泛引用的历史锚点仍指向
              SoftBank 2019 年投资，以及 2021 年将 Rappi 估值约 $5.25 billion 的 Series
              F。这些锚点重要，因为它们仍是公开来源中最后一批得到较广佐证的估值数据点。高峰融资周期之后，变化在于资本形式：2025 年出现 Santander 支持的债务工具，以及 Tracxn 轮次历史中一笔规模较小、与
              Amazon
              有关的进入，意味着战略资本和信贷资本正在补充传统风险股权。关键尽调含义是：融资结构变复杂的同时，头部估值确定性下降。债务、银行伙伴和少数股战略资本结构可以保留灵活性，但也引入契约风险、商业附函风险，以及后续投资者买到的经济权益可能与
              2021 年头部估值隐含口径很不一样。除非管理层提供一级交易文件，承销方应把近期估值信号视为噪声较高。
