          - type: callout
            title: Ley 2466 抬高结构性配送成本
            body: >-
              哥伦比亚 Ley 2466 de 2025 要求平台承担零工骑手 60% 的健康和养老金缴费，以及 100% 职业风险保险。这是对哥伦比亚每一单配送单位经济模型的永久性立法改变；若巴西或墨西哥复制，将显著压缩
              Rappi 大部分 GMV 基础的贡献利润率。精确的每单成本影响尚未公开量化，是关键尽调问题。
            calloutType: risk
