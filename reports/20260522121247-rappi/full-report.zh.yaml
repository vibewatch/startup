      - number: '4.3'
        title: 成本结构、单元经济性与运营杠杆
        blocks:
          - type: paragraph
            body: |
              Rappi 相比全球配送同行的结构性成本优势，来自拉美高密度城市核心区的
              高配送密度和更低本地劳动力成本。Sacra 估计 Rappi 总配送成本约为
              GMV 的 10%，对比 Zomato 的 14%、Meituan 的 16%，以及 Uber Eats
              和 DoorDash 的 30% 到 32%。如果这种结构性差距能够维持，将显著改善
              每单贡献利润率，并加快区域级回本。

              公司目标是在新进入区域约 3.5 个月内打平，这是其持续城市扩张中的
              关键资本效率指标。客户第一年每月购买频次约 2 次，到第五年增至约
              每月 11 次，意味着 LTV 会在队列生命周期内复合增长，从而改善单元经济性。
              约 90% 客户已经跨不止一个产品品类购买，支撑跨垂直贡献利润。

              Rappi 在 6 个国家、15 多座城市运营 300 多个暗厨房和微履约中心，
              缩短每单距离，并把物流转向枢纽辐射模型。Rappi Kitchen 项目为伙伴品牌
              提供设备贷款、商业支持和虚拟餐厅开发。不过，300 多个暗厨房点位带有
              固定租赁、人力和设备成本；一旦需求转弱或餐厅伙伴退出，就会引入
              运营杠杆风险。除 CEO 的定性表述外，分板块毛利率和 EBITDA 利润率仍未披露。
            claimRefs:
