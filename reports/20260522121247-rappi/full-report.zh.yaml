            body: >-
              2026 年 4 月 Cundinamarca 法庭裁定 Rappi 是完整电商经营者——不是交易平台中介——这是结构性法律转向。它让 Rappi
              在每个垂直（餐饮、杂货、药品、零售、旅行、金融科技）都承担消费者保障、产品责任和售后义务。其他拉美司法辖区可能跟随哥伦比亚，这使该事项成为组合中严重性最高的单一监管风险。
            calloutType: risk
            claimRefs:
