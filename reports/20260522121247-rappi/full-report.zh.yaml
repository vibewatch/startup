      - number: '6.4'
        title: 集中风险与反向证据
        blocks:
          - type: paragraph
            body: >
              哥伦比亚 Superintendencia de Industria y Comercio（SIC）在 2026 年 4 月经过两项独立调查后，对 Rappi 处以超过 4 billion 哥伦比亚比索——约
              USD 1.09 million——罚款。Portafolio、El Tiempo 和 Forbes Colombia 报道，SIC 认定违规是系统性而非孤立事件：机构点名 Rappi Prime 和 Rappi
              Pro 订阅存在未授权扣费，“Turbo” 配送服务广告误导，并反复不遵守此前监管命令。El Tiempo 特别将 SIC 发现定义为 Rappi
              消费者保护合规存在结构性缺陷，而不是边缘运营故障。该监管行动叠加投诉平台 1.1–1.3/5 的持续低分，构成记录中最重大的反向客户证据，并指向无法随平台交易量充分扩展的客服基础设施。Rappi
              的业务宽度部分缓释客户和商户集中风险：125,000+ 家合作商户分布于九国和多个垂直，单一商户流失在组合层面不会造成灾难性后果。不过，没有公开来源披露 Rappi 前 10 或前 20 大商户的 GMV
              占比，缺少私有尽调材料时无法量化集中度。墨西哥代表最大的单一市场集中风险：作为 Rappi 最大 MAU 市场，墨西哥发生任何监管、竞争或经济冲击都会对收入产生超比例影响。巴西是最高竞争风险：iFood
              占据主导份额，Rappi 在该国最大消费市场可能长期低于规模阈值。Grips 和 Sacra 数据预计 Rappi 2026 年电商收入下降
              20–50%；若兑现，可用于投资客户体验改善的财务缓冲将被迅速压缩。扩张端，Rappi 嵌入金融产品（RappiPay、RappiCard、RappiBank）以提高 LTV 并产生跨产品切换成本；Amazon
              2025 年 USD 25 million 投资瞄准巴西和墨西哥物流整合，以扩大可触达客户池；R2 金融科技合作为商户提供营运资金贷款，加深 B2B 粘性。Rappi 的 PESTLE
              分析将消费者信任和监管合规列为核心市场客户留存的两个最高优先级外部威胁。
