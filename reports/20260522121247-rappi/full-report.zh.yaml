      - number: '3.2'
        title: 竞争对手画像与战略方向
        blocks:
          - type: paragraph
            body: >-
              iFood 是 Rappi 面对的最强单一市场对手。iFood 由 Prosus（Naspers）持有多数股权，最近一次估值约为 2022 年 8 月的 $5.4 billion，已披露股权融资约 $592
              million。公司宣布到 2026 年 3 月前在 Brazil 投资 R$17 billion（约 $3.3 billion USD），用于拉动流量、向餐厅和用户提供信贷，并扩展 AI 驱动物流。iFood
              截至 2024 年 3 月财年的经营利润达到 $96 million，同比上升 249%，说明本土市场规模终于转化为真实现金生成。2024 年 6 月收购金融科技公司 Zoop，进一步加深了其数字银行业务
              iFood Pago。iFood 2023 年与 Brazil 反垄断机构 CADE 签署行为调整协议（TAC），限制与超过 30 家门店的连锁餐厅签订排他协议；这一让步部分源自 Rappi、Uber
              Eats、99Food 和 ABRASEL 的投诉，也让 Brazil 对新进入者略微打开。

              DiDi Global 在 Brazil 以 99Food 运营食品配送（借助 2018 年以约 $1 billion 收购 99），在 Mexico 以 DiDi Food 运营。公司承诺到 2026
              年向拉美扩张投入约 $1 billion，其中针对 Brazil 配送有一项 BRL 2 billion（$368 million）计划，目标到 2026 年中覆盖 100 座城市。拉美是 DiDi 仅次于
              China 的第二大全球投资市场。

              PedidosYa（Delivery Hero）覆盖 15 个国家，员工超过 13,000 人。它在 Argentina、Paraguay 和 Uruguay 领先，并在 Central America
              拥有强势位置。资金支持来自集团 Delivery Hero 层面，未单独披露。

              MercadoLibre 运营该区域主导性的电商市场平台，覆盖 18 个国家，2026 年 Q1 收入同比增长 49%，Brazil 发货单件成本下降 17%。MELI 估计占全部拉美电商 GMV 的 22%，其
              Mercado Pago 金融科技业务每年服务数亿笔交易。MercadoLibre 的物流、支付和市场平台构成强化飞轮，这是纯配送竞争对手没有复制出来的。

              Meituan 旗下 Keeta 于 2025 年 5 月进入 Brazil，承诺 5 年投入 $1 billion，初期瞄准 São Paulo 和 Rio de Janeiro，并计划全国覆盖。Keeta
              过去在 Hong Kong、Saudi Arabia 扩张时，竞争模型依赖促销定价和补贴来撬动既有玩家。
