      - number: '7.3'
        title: 财务、竞争与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              Rappi 的财务风险集中在资本密集增长姿态，以及在 Rappi 接近拐点时正好加剧的竞争环境。CEO 2025 年底披露，Rappi 将 100%
              利润再投入增长，放弃可分配收益。从投资人分红角度看，该模式让公司仍处于 FCF 未转正状态，并依赖 GMV 持续扩张来产生可再投资现金。为补充内部现金流，Rappi 2025 年 8 月从 Santander
              获得 USD 100 million 私募信贷额度——迄今最大债务交易——用于再融资和营运资金，同时增加利息支出和契约义务，需要收入持续增长才能偿付。若增长放缓，债务服务和资本密集型 Turbo
              扩张的双重负担会压缩现金跑道。iFood 的竞争威胁是 Rappi 最尖锐的市场风险。Uber 与 iFood 2025
              年在巴西宣布战略合作，支持跨订阅捆绑和物流整合，将该国主导餐饮配送平台与全球出行超级应用绑定。同时，中国 Meituan 承诺投入 USD 1 billion 在巴西扩张 Keeta 品牌。如果这两股力量在
              Rappi 第二大市场拿下显著份额，支撑 Rappi 估值（2024 年估计 USD 5–5.25 billion）的收入轨迹将受到实质损害。Rappi 的合作伙伴依赖风险也很显著：Amazon 的 USD 25
              million 股权投资对齐基础设施利益，但也让一个直接电商竞争者看到 Rappi 运营。Rappi 的商户网络（200,000+ 家餐厅和零售合作伙伴）既是平台核心价值，也在 iFood 或 Meituan
              以佣金率或独家合作出价更高时形成集中风险。墨西哥 Banorte 金融科技业务以 USD 50 million 出售，显示 Rappi 从一个本可成为高毛利收入板块的方向战略撤退。
