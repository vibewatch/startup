      - number: '8.3'
        title: 情景分析：乐观、基准与悲观
        blocks:
          - type: paragraph
            body: >-
              三种情景构成投资案例，每一种都取决于可验证的收入增长、利润率轨迹和 IPO 市场准入。


              乐观情景（15–20 % 概率信号）设想 Rappi 到 FY2027 凭借 RappiPay 和广告变现加速实现 $2.0 billion 净收入——这两个高毛利垂直可能将综合 EBITDA 利润率推向
              10–15 %。若以 3.0×–3.5× 前瞻收入倍数 IPO，估值将达到 $5.0–6.0 billion，大致验证 2022
              年股权轮标记。该情景要求公司在至少三个主要市场（巴西、墨西哥、哥伦比亚）同时跑通配送、金融科技和广告，并持续获得 Amazon 或后续机构投资人的战略资本流入。


              基准情景（40–45 % 概率）更保守：收入达到 $1.3–1.5 billion，配送增长稳定但广告/金融科技贡献仍有限，IPO 以 2.0×–2.5× 收入倍数定价。由此得到 $2.6–3.8 billion
              估值区间，较 2022 年新股轮估值标记折价 25–50 %，但较 2026 年 5 月二级市场价格溢价 50–100 %。这对二级市场买家是有利结果，对新股轮投资人则是持平到负回报。


              悲观情景（35–40 % 概率）假设收入停滞在 $800 million–$1.1 billion，IPO 延迟或取消，倍数压缩到 1.0×–1.3× 收入，隐含 $0.8–1.4 billion
              估值。触发条件包括拉美宏观长期恶化、持续运营现金需求推动降价融资、哥伦比亚或巴西监管升级，或 Amazon 合作关系流失。El País 分析师观察到，截至 2025 年 6 月，Rappi
              众多产品线中只有两条产生有意义收入，抬高执行集中风险。
