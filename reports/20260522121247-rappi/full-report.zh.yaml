      - number: '4.4'
        title: 资本充足性与融资结构
        blocks:
          - type: paragraph
            body: |
              Rappi 自创立以来累计融资约 $2.3 到 $2.6 billion，覆盖 21 轮，
              投资者包括 SoftBank、Andreessen Horowitz、DST Global、Sequoia
              Capital、T. Rowe Price 和 Amazon。最后一次一级股权融资是
              2021 年 7 月 $496 million 的 Series F，投后估值 $5.25 billion；
              此后没有披露新的一级股权轮。

              2025 年完成了 3 笔债务侧交易：2025 年 8 月来自 Banco Santander
              和 Kirkoswald Capital Partners 的 $100 million 四年期优先担保贷款
              （Rappi 历史上最大单笔债务融资，指定用于再融资和营运资金）；
              2025 年 9 月 $25 million Amazon 可转债，若达到约定里程碑，Amazon
              可获得最高 12% 股权的认股权证；以及 2025 年 10 月未披露金额的
              Gramercy Funds Management 债务融资。RappiPay Colombia 另于
              2022 年 10 月从 Colombia 银行获得 $112 million 债务融资。

              CEO Simón Borrero 于 2025 年 12 月确认，Rappi 已连续 4 个季度
              EBITDA 为正，将 100% 利润再投入，目前不需要新的私人股权融资。
              Rappi 正在评估 2026 年末潜在 IPO 条件，但明确提到市场时机约束。
              截至 2026 年 5 月尚未提交 S-1。2026 年 4 月二级市场隐含估值约为
              $2.0 billion，较 2021 年 Series F 峰值折价 62%。Brazil 的
              R$1.4 billion 投资承诺（约 $270 million USD）是最大单项前瞻资本部署义务。
            claimRefs:
