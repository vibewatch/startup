  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责方 / 尽调路径
    rows:
      - - 经审计收入和 EBITDA
        - 无经审计 P&L；收入估计范围为 $800 M–$1.3 B
        - 将倍数套到未经核验收入上，带来 ±$2+ B 的估值不确定性
        - 索取 S-1 草稿财务数据；或聘请会计师事务所做 IPO 前尽调
      - - 股权结构表和优先股堆叠
        - 具体清算优先权瀑布和 ROFR 条款未公开
        - SoftBank、T. Rowe Price 和 DST 轮的高级优先权可能在普通股之前吃掉 $1–2 B
        - 向公司索取股权结构表摘要；交叉核对 Forge COI 数据
      - - RappiPay 独立 P&L
        - 金融科技收入和利润率未单独披露
        - 乐观情景依赖金融科技以更高利润率贡献 20–30 % 收入
        - 索取管理层演示材料，或哥伦比亚与巴西的金融科技监管文件
      - - Amazon 可转债条款
        - 转换价格、业绩里程碑和反稀释条款未披露
        - 若 Amazon 以低价转换，其他投资者会被大幅稀释
        - 索取可转换票据条款清单，或 S-1 文件里的条款说明
      - - 巴西和墨西哥市场单位经济
        - 国家级 EBITDA 或贡献利润率未披露
        - 巴西和墨西哥贡献 70 %+ 收入；两国单位经济驱动估值
        - 索取分部报告；对照 Contxto 披露的 $800 M 净收入口径
      - - 监管合规成本前瞻
        - 哥伦比亚 SIC 处罚合计 $4+ B COP；巴西 ANPD 监管路线图
        - 重大未决诉讼或合规项目可能吃掉自由现金流
        - 审阅 SIC 2026 年处罚文件；聘请哥伦比亚和巴西法律顾问
      - - 老股市场转让限制
        - 优先购买权和转让审批时间表未公开
        - 老股市场投资者可能面临数月转让延迟，甚至直接被拦
        - 索取 ROFR 豁免条款；确认 Nasdaq Private Market 和 Forge 结算流程
    notes: 尽调问题按对估值区间的重要性排序；最高优先级事项是经审计财务和股权结构。
    claimRefs:
      - CV041
      - CV042
      - CV043
