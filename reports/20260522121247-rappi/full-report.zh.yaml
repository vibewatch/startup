      - number: '5.3'
        title: Rappi Turbo 与暗店运营
        blocks:
          - type: paragraph
            body: >
              Rappi Turbo 是 Rappi 的极速（≤10 分钟）配送子平台，建立在自有暗店网络上——每个暗店约 18 平方米，不对公众开放，备有 2,000–8,000 个 SKU，并布在目标消费者 2–3 km
              内。运营公式很清晰：4–5 名店内操作员在两分钟内完成拣货；骑手用约八分钟跑完最后一公里。在墨西哥全国范围，Turbo 到 2025 年 7 月已超过 500,000 单月配送，由 50 家暗店和 2,000+
              名专职骑手支撑。Rappi 2024 年收购印度 AI 供应链公司 Fountain9 的资产，将基于机器学习的需求感知、定价优化和预测式库存规划专门接入 Turbo 暗店。

              2026 年 2 月，Rappi 在巴西推出 Turbo Farma——药品暗店试点，在八个巴西城市运营 38 家门店。垂直整合模式自持药品库存（初期 1,200 个 OTC 和个人护理品，目标 2026 年底
              5,000 个），且要求持证药剂师驻场和符合 ANVISA 要求的温控。该项目立即遭到巴西药房协会 Abrafarma 的法律威胁；Abrafarma 援引 Law 5,991/73 和 ANVISA
              Resolution RDC 44，称封闭单元内销售药品被禁止。Rappi 则称其门店已获 ANVISA 许可并合规。2026 年 Turbo 路线图包括即食食品极速配送、在监管确认后扩张药品垂直，以及基于
              Fountain9 技术的 B2B 供应链即服务业务。
