      - number: '7.4'
        title: 人员、执行与终止标准
        blocks:
          - type: paragraph
            body: >-
              Rappi 的执行风险由领导层集中、多国监管复杂性，以及快速扩大的运营范围共同塑造；公司必须同时吃透餐饮配送、即时零售、金融科技和物流。联合创始人兼 CEO Simón Borrero
              仍是这个十国企业的核心运营和战略决策者；在这种规模下，关键人集中且缺乏清晰继任计划，是投资人必须追问的尽调缺口。跨十个不同法域管理监管合规——每个法域都有自身消费者保护、劳动、金融科技、数据隐私和竞争法制度——需要国家级法务与合规团队，管理成本随市场广度成比例增长。哥伦比亚
              Ley 2466（劳动）、Cundinamarca 电商裁定（消费者法）、巴西 LGPD 扩张（数据隐私）和墨西哥 CNBV 退出（金融科技）同时落地，展示了多向量监管负担。Rappi 的 Turbo
              自营库存模式需要为暗店建设、冷链物流和库存融资投入资本，而纯交易平台模式可以避开这些支出。投资人的投资逻辑破裂触发点包括：(1) 第二次 SIC 执法采取显著更高罚款，并引发多国效仿执法；(2)
              数据泄露报告后，巴西确认启动 LGPD 执法；(3) iFood-Uber 交叉销售在 18 个月内推动巴西份额提升超过 20%；(4) Santander 信贷额度到期前未跑通 FCF；(5) CEO
              离任且没有明确继任者。尽调要求包括量化 Ley 2466 对每单配送成本的影响、完整 LGPD 合规审计、独立安全评估、十个运营国家完整诉讼登记，以及逐国监管牌照清单。
