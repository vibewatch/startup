      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Rappi 的竞争护城河建立在 4 根支柱上：核心市场（Colombia、Mexico、Peru）的网络密度，多垂直超级应用生态带来的切换成本，配送成本效率，以及与 Amazon 的战略伙伴关系。在
              Colombia，Rappi 拥有超过 50% 市场份额，是默认的消费者配送品牌，护城河更耐久。商户和骑手密度构成强化飞轮：更多用户吸引更多商户，商户增加改善选择，选择改善留住用户。Rappi Prime
              订阅进一步提高切换成本，因为它预先锁定了用户消费。2025 年 9 月 Amazon 投入 $25 million 可转债（潜在最高 12% 股权），带来 AWS 基础设施支持和物流效率，也释放出 Amazon
              将 Rappi 用作拉美末端伙伴、而非自己独立建设的战略意图。

              但在拉美配送市场，多平台使用已经结构性内嵌：价格敏感消费者会为了促销在应用之间频繁切换；ABRASEL 主席关于 Rappi 无法在 Brazil 依靠自然增长取代 iFood
              的观察，也凸显跨市场护城河迁移的边界。到 2026 年 5 月，Rappi 二级市场隐含估值已压缩至约 $1.9 billion，较 2021 年 $5.25 billion Series F 峰值下降约
              64%，反映市场怀疑其货币化速度和确定性。

              Uber-iFood 集成代表最可信的近端威胁：出行加配送的组合便利层把 Brazil 两个强大既有玩家集中起来，可能让 Rappi 更难赢得偏好用单一应用完成出行和配送的 Brazil 消费者。Meituan
              旗下 Keeta 进入则增加第二个替代风险：Keeta 已证明它能凭补贴进入、深厚运营技术和耐心资本打市场，而 iFood、99Food 和 Rappi 过去在 Meituan
              决定投入某个市场时很难匹配。Rappi 的竞争风险登记表因此在 Brazil 最高，在 Colombia 最低；Mexico 则是 Rappi、DiDi Food 和 Uber Eats 之间的中间战场。
