      - number: '4.2'
        title: 定价架构与 GTM 经济性
        blocks:
          - type: paragraph
            body: |
              Rappi 的 GTM 模型是三边市场，定价决策必须在商户经济性、消费者
              可负担性和平台抽佣之间取得平衡。标准餐厅佣金为订单价值的
              10% 到 30%，与 DoorDash、Uber Eats 等全球同行大体一致；但
              加上促销费和支付处理费后，典型餐厅伙伴的全口径成本经常达到
              30% 到 40%，这也是 Rappi 核心市场中已有记录的商户摩擦来源。

              消费者侧配送费动态收取，为订单价值的 5% 到 15%，或根据距离和需求
              收取一笔可变固定金额。Rappi Prime 为高频用户降低或免除配送费；
              这些用户否则每月会多次按单支付费用。在 Brazil，Rappi 自 2025 年
              5 月采用结构性颠覆的零佣金模型：全服务模式下的餐厅 3 年内直到
              2028 年中，只支付 3.5% 的支付处理费。

              这项政策绑定 R$1.4 billion 的 Brazil 总投资承诺，目标是到 2028 年
              从 50 座城市的 30,000 家餐厅，增长到 300 座城市的 100,000 家餐厅。
              尽管餐厅是切入品类——Brazil 约 80% 新自然用户从餐厅品类开始——
              该政策推出时，餐厅只贡献 Brazil 收入的 20%。放弃佣金的直接收入
              成本是实质性 EBITDA 逆风，公开披露中没有量化。应用内广告费率
              未公开披露；尽调应明确 CPM、填充率和按地理划分的细分收入。
            claimRefs:
              - CI007
              - CI008
              - CI015
              - CI019
              - CI020
              - CI021
              - CI042
