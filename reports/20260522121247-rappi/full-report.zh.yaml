  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Rappi 进入 2026 年 5 月时，最后公开披露的股权估值仍是 $5.25 billion——由 2021 年 7 月 Series F 确定；随后 2022 年 9 月 Series F
              轮交割，Forge Global 的股权结构表数据将其投后估值放在 $5.36 billion，使 Rappi
              成为拉美定价最高的私营科技公司之一。此后没有新的股权融资轮次为公司重新定价。资本活动反而维持在债务端：Banco Santander 和 Kirkoswald Capital Partners 2025 年 8
              月完成一笔 $100 million 优先担保贷款额度，用于再融资和营运资金；Amazon 2025 年 9 月提供 $25 million 可转债，若达成业绩里程碑，Amazon 可获得最高 12 %
              股权的认股权证。Amazon 的隐含转换价格——也就是它所对应的估值——仍未披露，这是任何入场分析的重大缺口。


              二级市场讲出完全不同的故事。Forge Global 2026 年 5 月 22 日给 Rappi 股票报价 $21.33，隐含 $1.77 billion 企业价值，较 2022 年股权轮标记折价 67
              %。Hiive 跟踪的指示性价格为每股 $16.91–$16.93（2026 年 5 月 20–21 日），Notice.co 显示买盘低至 $16.71。Premier Alternatives 独立引用了截至
              2026 年 4 月 1 日 $2.0 billion 的当前估值。因此，跨平台共识落在 $1.77–2.0 billion 区间，而不是 $5.36 billion 的最后新股轮估值标记。


              Forge 的 COI 数据估计，累计融资为 $2.07 billion（若按更宽口径纳入结构化债务，最高 $2.6 billion）。在隐含股权价值约 $1.8–2.0 billion、已投入 $2.07+
              billion 的情况下，Rappi 资本效率比约为 0.79×——投资人整体尚未收回超过投入资本。CEO Simón Borrero 公开称截至 2025 年底已连续四个季度 EBITDA 为正，CFO
              Tiago Azevedo（2024 年 4 月加入以筹备 IPO）确认所指期间净收入约 $800 million。分析师和情报平台对 2025–2026 年收入估计更宽，从 $1.1 billion 到
              $1.3 billion，反映 RappiPay、Rappi Turbo 和广告等新垂直。公开渠道没有经审计财务；已报道盈利数字仅来自公司表述。
