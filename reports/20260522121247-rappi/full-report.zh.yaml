        - CEO 与 Bloomberg 确认 9 国布局；Amazon 战略背书
        - iFood 或 MercadoLibre 在核心市场复制 Rappi 的多业务线组合
      - - 乐观：盈利拐点
        - CEO 确认截至 2025 年底连续 4 个季度 EBITDA 为正；成本削减和利润率纪律见效
        - Bloomberg Línea CEO 访谈；CFO 支持的运营效率项目
        - 市场扩张支出或监管合规成本可能逆转盈利
      - - 乐观：Amazon 战略护城河
        - Amazon 的 $25 M 可转债最高可触发 12 % 股权里程碑，形成战略协同，也给潜在收购方估值托底
        - Latamlist；Bloomberg 2025 年 9 月 Amazon-Rappi 交易
        - Amazon 既不行使票据也不行权证；合作关系解体
      - - 反向：老股市场估值折价
        - 老股市场给 Rappi 定价 $1.77–2.0 B，较 2022 年新股估值折价 66 %，反映投资人谨慎
        - Forge Global $21.33/share = $1.77 B；Premier Alternatives $2.0 B（2026 年 4 月）
        - 新一轮超过 $3 B 的新股融资恢复股权轮估值可信度
      - - 反向：收入与盈利不透明
        - 无经审计财务数据；收入估计区间为 $800 M–$1.3 B；El País 指出只有 2 条产品线贡献有意义收入
        - El País 2025 年 6 月分析；CFO 关于 $800 M 净收入的表述
        - 提交 S-1，且经审计 EBITDA ≥$100 M、收入 ≥$1.0 B
      - - 反向：IPO 反复推迟
        - Rappi 自 2022 年以来多次宣布赴 NYSE 上市目标，但从未提交文件；市场可信度受损
        - El País 2025 年 6 月指出这是第 5 次 IPO 公告；Investing.com 对 Borrero 的访谈
        - 12 个月内实际向 SEC 提交 S-1
    notes: 投资逻辑 / 反向逻辑要素来自截至 2026 年 5 月的公开来源；不构成投资建议。
