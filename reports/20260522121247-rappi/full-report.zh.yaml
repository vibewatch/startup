      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Rappi 配送经济性处于同类领先
            body: >-
              Sacra 分析估计，Rappi 的配送成本约为 GMV 的 10%，显著低于 Uber Eats（32%）、Zomato（14%）和
              Meituan（16%）。这种结构性成本优势，可能来自核心城市市场的高路线密度和 Turbo 前置仓的距离优势，让 Rappi 有空间维持竞争性定价或投入补贴，而烧钱速度不会达到历史同行水平。这是 Rappi
              运营模型确有真实效率的最清晰信号，也是支撑规模化后可持续 EBITDA 的首要杠杆。
            calloutType: strength
            claimRefs:
              - CP029
              - CP044
          - type: callout
            title: Uber-iFood 集成是 Brazil 竞争威胁的台阶式升级
            body: >-
              2025 年 11 月 Uber-iFood 应用集成——Uber IR 于 2025 年 5 月正式宣布——把 Brazil 主导配送平台和主导网约车平台合并进一个跨服务
              UX。联合订阅和更深集成已被列为路线图事项。Rappi 若要支撑溢价估值，就必须在 Brazil 增长；这项合作形成了它没有自有网约车伙伴就难以匹配的便利性天花板。该集成也说明，iFood 和 Uber
              正在选择防御性整合，而非单纯配送竞争，从而降低了有利于 Rappi 的协调性碎片化概率。
            calloutType: risk
            claimRefs:
              - CP031
              - CP033
              - CP035
          - type: callout
            title: Keeta 投入 $1 Billion 进入 Brazil，导入已验证的补贴颠覆打法
            body: >-
              Meituan 旗下 Keeta 不是边缘新进入者。其母公司是一家已盈利、在 Nasdaq 上市的平台，已经在 Hong Kong 和 Saudi Arabia
              证明，可以通过持续补贴叠加更强运营技术赢得市场份额。对 Brazil 配送市场规模而言，5 年 $1 billion 的承诺很大；Meituan 提出 5 年内覆盖 1,000 座城市，意味着其地域野心将直接重叠
              Rappi 的 Turbo 版图。如果 Keeta 在 Brazil 复制 Hong Kong 打法，首要受损方会是 iFood，但 Rappi 在 Brazil 的经济性也会承受真实连带压力。
            calloutType: risk
            claimRefs:
              - CP018
              - CP019
              - CP040
              - CP041
          - type: callout
            title: 多平台使用是结构性事实——金融科技护城河比配送更黏
            body: >-
              消费者调查和行业分析师持续观察到，拉美配送用户对促销高度敏感，并会在多个应用之间多平台使用。ABRASEL 主席称 Rappi 无法仅靠自然增长在 Brazil
              成为主导玩家，这与该动态一致——如果没有促销经济性，再多的餐厅选择改善也难以突破 iFood 的供给密度。Rappi 最黏的护城河不是配送便利，而是金融服务集成：把数字钱包和信用卡嵌入日常消费的 RappiPay
              用户，切换成本明显高于纯配送用户。因此，RappiPay 用户增长的战略价值可以说高于任何单一配送市场份额提升。
            calloutType: insight
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与收入流
        blocks:
          - type: paragraph
            body: |
              Rappi 通过 4 条不同收入流，把超级应用平台上的消费者、商户和
              FMCG 品牌货币化。商户佣金是最大贡献项，估计约占总净收入的
              75%。商户按品类、市场和合同条款不同，支付订单价值 10% 到
              30% 的抽佣率；叠加可选营销投放后的全口径有效成本，可达到
              30% 到 40%。向餐厅和快消品公司收取的应用内广告费，来自推广
              列表、横幅位和应用内活动，约贡献 13% 收入。Rappi Prime
              订阅会员按市场不同每月定价 $5 到 $10，贡献约 10%，并拉高购买频次。
              自营库存的直营电商销售贡献剩余 2%，利润率较薄。

              Sacra 估计 Rappi 2023 年净收入为 $855.52 million，意味着较
              2022 年 $624 million 同比增长 37%，在 2021 年收入下滑 30.7%
              后强劲修复。Grips 跟踪的线上商店 GMV 在 2025 年为 $505 million，
              并预计 2026 年继续下降 10% 到 20%。截至 2023 年，累计收入与亏损
              轨迹（COP 1.8 trillion 收入，对比 COP 1.2 trillion 亏损）说明，
              Rappi 到 2024 年才拿下首个盈利年度；此前历史上大部分时间都处于结构性现金缺口。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI040
