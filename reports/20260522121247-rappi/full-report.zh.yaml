          - type: callout
            title: 无银行账户人群为 Rappi 金融科技栈创造巨型 TAM
            body: >-
              约 100 million 拉美成年人仍无银行账户。2021 至 2025 年，数字钱包采用率从 11% 增至 43%，68% 非数字支付用户表示可能采用。Rappi
              的物流网络让它相对独立金融科技公司具备分发优势：RappiPay 可以借助与配送运营共址的现金充值代理起量，为已经信任 Rappi 品牌的消费者架起从现金到数字的桥。有银行账户人群占比提升后，金融科技 TAM
              会扩大，使 RappiPay 在 2030 年的机会结构性大于今天。
            calloutType: insight
            claimRefs:
              - CM024
              - CM025
