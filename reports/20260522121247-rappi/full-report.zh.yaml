      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              多种独立测算方法给出的 TAM 估计跨度很大，反映的不是简单测量误差，而是对市场边界确有分歧。最窄且仍有用的口径——拉美基于平台的线上食品配送——2024 年约为 $12.9 billion，预计到 2030
              年达到 $21.7 billion，CAGR 为 8.6%（Grand View Research）。更宽的 IMARC Group 估计把按需配送服务整体纳入，2025 年为 $1.3 billion，到
              2034 年增至 $6.2 billion，CAGR 为 17.9%——更高 CAGR 反映非食品垂直业务仍处早期。快速商业（30 分钟内配送）子板块在 2025 年约为 $7.2
              billion，Research and Markets 预计到 2029 年达到 $10.1 billion，CAGR 为 8.8%。

              加入金融科技和超级应用收入流后，机会空间大幅扩张。Grand View Research 估计，拉美超级应用市场 2026 年约为 $10.5 billion，到 2033 年 CAGR 为
              29.6%。Americas Market Intelligence 预计拉美电商市场 2026 年将超过 $215 billion；即便 Rappi 只拿到一小部分，更广义的数字商务背景也足够大。

              Rappi 的 SAM 以其 9 国版图为口径，并排除 Brazil 食品配送市场（iFood 已深度卡位），合计食品、生鲜杂货和快速商业配送估计为 $55–70 billion。核心食品配送 GMV 的 SOM
              估计到 2026 年为每年 $7–14 billion，与公司在 Colombia 64%、Mexico 36%、其他 6 个市场更小份额的报道相一致。考虑到私营公司收入不透明，这些 SOM
              估计不确定性很高。Cognitive Market Research 预计 South America 食品配送单独在 2026 年为 $7.9 billion，与分区域汇总大致一致。

              一个关键尽调警讯：分析师 TAM 估计相差超过 6×（仅平台口径 $12.9B，对比全部食品交易 $78.6B+）。买入 Rappi 投资逻辑的人，在测算回报前必须先识别收入模型采用哪一种口径。
