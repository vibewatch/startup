companyProfile:
  summary: >-
    Rappi 于 2015 年创立于 Bogotá，是一家拉美超级应用，业务覆盖 9 个国家、400 多座城市。它把餐饮和生鲜杂货配送、超快 Turbo
    前置仓履约、云厨房、金融科技产品（RappiPay、RappiCard）、旅行，以及类似 Amazon Prime 的订阅服务（Rappi Pro/Pro Black）聚合到一个平台上。按国家覆盖面看，Rappi 拥有超过 550
    万月活用户和 40,000 多家合作商户，是拉美覆盖最广的多垂直消费平台。公司由创始人 Simón Borrero（CEO）、Sebastián Mejía 和 Felipe Villamarín 主导，并获得
    SoftBank、Andreessen Horowitz、DST Global、Sequoia Capital 和 T. Rowe Price 支持。
  foundedDate: '2015-01-01'
  founders:
