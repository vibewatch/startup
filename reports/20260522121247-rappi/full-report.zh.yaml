      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              Rappi 的运营风险横跨平台可靠性、数据安全、骑手安全和实体基础设施。安全端，UpGuard 2026 年 4 月供应商风险报告给 Rappi “B” 安全评级，并指出 DMARC 未完全强制执行、SPF
              记录设为宽松策略——为冒充 Rappi、针对消费者和商户的钓鱼攻击留下路径。更关键的是，威胁情报公司 Brinztech 记录称，巴西客户个人可识别信息（PII）、CPF
              号码和支付凭证据称出现在暗网市场销售，直接触发巴西 ANPD 框架下的 LGPD 泄露通知和补救义务。鉴于 Rappi
              在十个国家处理数千万活跃用户的支付数据，一旦确认发生有意义规模的数据泄露，可能引发多国监管行动、客户信任受损和高成本补救。云基础设施是另一个集中点：Rappi 整个多国平台都运行在 AWS 上，公司自己的 AWS
              innovator 案例研究已经确认这一点。Rappi 依赖的拉美区域一旦出现持续 AWS 可用性事件，十个市场会同时受影响。Downdetector
              数据确认，平台宕机是秘鲁及其他安第斯市场反复出现的用户投诉。Rappi 骑手在以拥堵和自行车基础设施不足著称的城市高流量环境中工作，使 Rappi 暴露于职业事故责任——尤其在 Ley 2466
              强制职业风险保险缴费之后。Rappi Turbo 暗厨房和自营库存暗店增加了食品安全、冷链和产品责任暴露，与纯交易平台模式性质不同。
