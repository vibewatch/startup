      - number: '8.2'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              给 Rappi 建立估值基准必须采用多维度可比样本，因为不存在纯拉美超级应用上市同行。最直接相关的上市可比公司是
              Grab（东南亚超级应用，NASDAQ:GRAB）、DoorDash（美国按需配送，NASDAQ:DASH）、GoTo/Gojek-Tokopedia（印尼超级应用，IDX:GOTO）和 Delivery
              Hero（全球配送，XETRA:DHER）。截至 2026 年 5 月，multiples.vc 数据显示 DoorDash 以 4.4× EV/LTM Revenue 交易（$67 B EV、约 $15 B
              收入），反映美国市场规模化领导地位和 FY2025 $935 million GAAP 净利润。DoorDash 的 49.7× EV/EBITDA 比率显示市场给主导型配送平台定价有多贵。Grab 在 Q1
              2026 取得 $955 million 收入（同比 +24 %）和创纪录 $154 million 调整后 EBITDA 后，约以 2.8× EV/LTM Revenue 交易。GoTo 约为 1.9×
              EV/Revenue，Delivery Hero 仅 0.8×，受盈利挑战和杠杆拖累。Uber 作为横跨配送、出行和货运的平台，以 2.9× EV/Revenue 交易。


              Aventis Advisors 交易平台倍数研究显示，2025–2026 年期间交易平台 EV/Revenue 中位数约为 2.3×。将 2.0×–3.5× 区间套用到 Rappi 估计 $1.3
              billion 收入，得到大致 $2.6 billion–$4.6 billion 的公允价值区间，中点接近 $3.2 billion。若按 $5.25–5.36 billion 的股权轮标记，Rappi
              需要维持 4× 收入倍数，与 DoorDash 溢价相当——这要求可验证的 EBITDA 增长和持续 20 %+ 收入扩张。现有证据目前支撑不了这种承销。私募轮可比也指向风险：Kavak
              是墨西哥拉美独角兽，曾估值 $8.7 billion，2024–2025 年扩张受挫后重置到 $2.2 billion（75 % 折价），说明 2021 年峰值周期产生的拉美“纸面估值”可以剧烈压缩。


              Nasdaq Private Market 展示 Rappi 历史融资轮次（Series A 至 Series F），并显示活跃二级市场订单，但股价数据需要合格投资人注册。综合来看，可比公司组显示，Rappi
              的股权轮估值相对同行倍数偏高；以 Rappi 当前规模和增长轨迹，$2.6–3.9 billion 的公允价值区间更有防御性。
