  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Rappi 的客户生态由三个主要群体构成：B2C 消费者在一个应用内下单餐饮、杂货、药品、酒类和跑腿商品；商户合作伙伴（餐厅、超市、药房、电子产品商店和 FMCG 品牌）支付佣金并接入 Rappi
              物流基础设施；骑手（Rappitenderos）作为供给侧劳动力。到 2025 年，Rappi 在九个国家拥有 5.5 million+ 月活用户和 125,000+
              家合作商户——墨西哥、巴西、哥伦比亚、秘鲁、阿根廷、智利、厄瓜多尔、哥斯达黎加和乌拉圭——覆盖 400+
              座城市。墨西哥是月活用户数和订单量最大的单一市场，受益于高城市智能手机渗透率和供给不足的即时零售板块。哥伦比亚是 Rappi 本土市场，掌握超过 50% 餐饮配送份额，约 3 million 活跃购物者和
              30,000+ 家加盟商户，品牌扎根最深。巴西增长目标最高，但仍被 iFood 的主导地位压制。Rappi 消费者偏向主要都市区的城市千禧一代和 Gen Z
              用户，这类人群的收入弹性和数字原生属性与按需配送经济模型契合。平台从一个应用覆盖九个服务垂直——餐饮、杂货、药房、酒类、旅行、金融科技（RappiPay、RappiCard、RappiBank）和点对点跑腿——这是其超级应用留存逻辑的结构基础。网站流量数据表明，截至
              2026 年 1 月，Rappi 每月约 4.6 million 次访问，转化率 3–3.5%，平均订单价值在 USD 225–250 区间，符合新兴市场中已具商业规模的交易平台特征。Rappi 还面向 B2B
              企业客户提供最后一公里物流、商户分析看板和嵌入式融资，但该板块规模和收入贡献未公开披露。
