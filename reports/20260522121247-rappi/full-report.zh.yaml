      - number: '5.2'
        title: 技术基础设施与工程规模
        blocks:
          - type: paragraph
            body: >
              Rappi 后端搭在云原生微服务架构上，主要托管于 AWS（7,000+ 个 EC2 实例；位居全球 AWS 资源消耗前 100）。平台在 ECS 上运行 2,000+ 个微服务，另有 1,500 个微服务专供
              RappiPay 金融技术栈，由 750+ 名产品团队工程师编写。70 人的云工程团队管理 50+ 个 Kubernetes（EKS）集群；最大单集群运行 20,000+ 个容器。服务网格在自研方案触顶后迁移至
              Istio（使用 Envoy sidecar）；如今 1,500+ 名开发者使用 Istio，实现按服务配置限流、熔断器、连接池和端点间 mTLS——这些对 RappiPay 涉及 PCI 的工作负载至关重要。

              API 管理通过 KrakenD 集中化，自 2020 年 5 月起部署在 20+ 个独立网关上（每个网关对应订单、菜单等功能域）。KrakenD 配置由包含 35,000+ 行条件的 Jinja
              模板自动生成。所有 KrakenD 实例的指标流入 Splunk SignalFX 做实时监控。Rappi 于 2021 年拆分单体，如今通过基于 Bitbucket 的 CI/CD 流水线每天执行 1,500+
              次生产部署。API 安全由 Wallarm 负责，替代此前的 Imperva SecureSphere WAF；Wallarm 提供 REST 和 SOAP API 防护、自动 API
              发现以及基础设施即代码部署。技术栈后端覆盖 Go、Java/Kotlin/Scala、Node.js/TypeScript 和 Python；前端使用 React 和 Next.js；持久化与流式处理使用
              PostgreSQL、DynamoDB、MongoDB、Kafka、Redis 和 Snowflake。AI/ML 框架（TensorFlow、PyTorch、Amazon
              SageMaker）用于需求预测、个性化和欺诈检测。
