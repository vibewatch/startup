      - number: '4.5'
        title: 公开财务牵引、指标缺口与反向信号
        blocks:
          - type: paragraph
            body: |
              公开牵引锚点有限但有信息量。Rappi 2023 年净收入估计为 $856 million。
              Grips 跟踪到 2025 年线上商店电商 GMV 为 $505 million，截至 2026 年
              3 月的三个月下降 12%；2026 年 3 月月度电商收入为 $33.9 million，
              隐含年化运行率约 $407 million。所有垂直业务合计 GMV——餐厅、生鲜杂货、
              药品和金融科技——没有公开披露。

              RappiPay Colombia 发布季度财务报表。该单元截至 2025 年 9 月报告
              总资产 COP 442.9 billion、存款 COP 319.6 billion，高于 2024 年
              12 月的 COP 380.4 billion 和 COP 274.1 billion。不过，RappiPay
              2025 年前 9 个月净亏损 COP 15.4 billion，较 2024 年同期的
              COP 15.8 billion 略有改善。RappiPay 目标到 2026 年底把客户基础
              从目前 400,000 多用户翻倍到约 800,000。2025 年 12 月，Banorte
              以 $50 million 收购 RappiCard Mexico，移除了 Rappi 对 1.14 million
              Mexico 持卡人账簿的直接金融科技敞口，并由一项 15 年独家金融产品合作取而代之。

              反向因素方面，Colombia 的 SIC 于 2026 年 4 月对 Rappi 处以
              COP 4.003 billion（约 $1.09 million）罚款，原因是系统性消费者保护
              缺陷，涵盖订单不完整、配送时间承诺误导，以及未经授权的会员收费。SIC
              明确指出，这是 Rappi 5 年内第四次因类似违规受罚，并把 reincidencia
              视为加重因素。重复执法模式显示运营质量控制存在缺口，可能限制 Rappi
              在不增加消费者流失的情况下提高抽佣率。
            claimRefs:
