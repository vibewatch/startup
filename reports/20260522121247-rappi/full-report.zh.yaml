      - number: '8.5'
        title: 图表材料
        blocks:
          - type: callout
            title: 观察——不要追逐股权轮价格
            body: >-
              Rappi 的 $5.25 billion 股权轮估值标记，建立在未经审计且区间很宽的收入估计上，隐含约 4× 收入倍数；上市 super-app 和外卖同行则基于经核验财务数据，交易倍数为
              1.9×–4.4×。老股市场持续在 $1.77–2.0 billion 成交，折价 66 %。正确姿态是观察，等 IPO S-1 招股说明书拿出经审计数据，而不是为不透明付溢价。若老股入场价不高于 $2.2
              billion，安全边际与基准情景公允价值一致。
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV033
              - CV007
              - CV008
          - type: callout
            title: 不透明是最大估值风险
            body: >-
              Rappi 目前没有公开经审计财务报表。独立分析师给出的收入估计从 $800 million 到 $1.3 billion，跨度达 60 %；盈利能力说法也只是 CEO 单方表述。0.79×
              的资本效率比意味着累计投入资本已经超过当前隐含市值，后期新股投资者面临不对称下行风险。尽管自 2022 年起多次公开宣布 IPO，截至 2026 年中仍未提交 S-1，这进一步加重治理和透明度担忧。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV035
              - CV036
              - CV042
          - type: callout
            title: 基准情景锚定 $1.3B 收入估计
            body: >-
              所有情景估值都采用 2025–2026 年净收入估计 $1.3 billion，来源于 Sacra、Compworth 和情报平台数据。CFO 在 2024 年公开表述的数字是 $800
              million。在经审计财务释放前，真实收入基数仍未知。投资者应按较低的 $800 million 收入数字压力测试入场价格；该口径下，基准情景公允价值约为 $1.6–2.0
              billion，正好贴近老股市场定价。
            calloutType: assumption
            claimRefs:
