      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              5 个结构性顺风支撑 Rappi 各市场的配送和金融科技继续采用。到 2023 年，智能手机渗透率达到拉美人口约 78%，可触达基础快速扩大。城市化正在把消费者集中到高密度城市（São
              Paulo、Bogotá、Mexico City、Buenos Aires、Lima），这些城市的配送经济性最可行。Brazil 的 Pix 即时支付系统在本国采用率已超过
              90%，正在推动整个区域的支付常态化，并为 Rappi 其他市场的国家支付轨道提供模板。COVID-19 永久加速了按需配送和数字支付采用，实质上把 3 到 5 年的行为变化压缩进 18
              个月。最后，区域中产收入上升和可支配收入增长，让消费者越来越愿意为省时间的便利服务付费。

              与这些顺风相对的是 6 个实质约束。拉美配送的末端物流成本最高可占总收入 30%（Kearney），即便规模化后也会持续压制贡献利润率。iFood 在 Brazil 约 89% 的市场份额，实际把 Rappi
              挡在该区域最大电商经济体之外，构成显著的 SAM 天花板。货到付款仍然普遍——尤其在较小城市和低收入消费者群体中——推高运营成本和欺诈敞口。零工重新分类压力正在加剧：Colombia 2025 年 3
              月批准一项工会协议，Brazil 法院也推动部分平台工人的雇员身份裁定，两者都可能让有效劳动力成本上升 20–40%。Uber Eats、iFood 和 Mercado Libre 的激烈价格竞争限制 Rappi
              上调佣金或配送费的能力。最后，公司在 9 个监管制度不同的国家运营，横跨劳动法、金融科技牌照、数据隐私框架和消费者保护要求，带来持续合规开销和运营复杂度。
