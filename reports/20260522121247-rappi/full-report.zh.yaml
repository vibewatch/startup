            title: 巴西数据泄露未确认但影响重大
            body: >-
              威胁情报报道（Brinztech）显示，巴西客户 PII、CPF 号码和支付数据出现在暗网市场出售。Rappi 未公开确认或否认该泄露。若属实，巴西 ANPD
              可能启动正式调查，触发强制泄露通知、补救义务和最高每次违规 BRL 50 million 的罚款。UpGuard 的 “B” 评级和配置错误的邮件安全控制进一步放大声誉与监管暴露。
