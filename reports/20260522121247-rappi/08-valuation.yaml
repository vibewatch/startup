chapter:
  number: 8
  title: Valuation
  summary: >-
    Rappi's last primary equity round (September 2022, $5.36 B) has not been reset by new
    equity financing, while secondary markets as of May 2026 imply a $1.77–2.0 B valuation—a
    66 % discount—placing the equity-round mark firmly in stretched territory. Applying
    public food-delivery and super-app comparable multiples (1.9×–4.4× EV/Revenue) to
    Rappi's estimated $1.3 B revenue yields a base-case fair range of $2.6–3.9 B.
    A track recommendation is appropriate until a forthcoming IPO S-1 surfaces audited
    financials, cap-table structure, and a verifiable growth trajectory.

sections:
  - id: financing-valuation-context
    title: Financing and Valuation Context
    body: >-
      Rappi entered May 2026 carrying its last publicly disclosed equity valuation of
      $5.25 billion—set at the July 2021 Series F—followed by a September 2022 Series F
      close that Forge Global's cap-table data places at $5.36 billion post-money, making
      it one of Latin America's most richly priced private technology companies. No new
      primary equity round has repriced the company since. Instead, capital activity has
      remained debt-based: a $100 million senior secured facility from Banco Santander and
      Kirkoswald Capital Partners closed in August 2025 for refinancing and working capital,
      and a $25 million convertible note from Amazon in September 2025 grants Amazon warrants
      for up to 12 % equity if performance milestones are met. Amazon's implied conversion
      price—and therefore the valuation it encodes—remains undisclosed, a material gap for
      any entry analysis.


      Secondary markets tell a sharply different story. Forge Global quoted Rappi shares at
      $21.33 on May 22, 2026, implying a $1.77 billion enterprise value—a 67 % discount to
      the 2022 equity-round mark. Hiive tracked indicative prices of $16.91–$16.93 per share
      (May 20–21, 2026), and Notice.co showed bids as low as $16.71. Premier Alternatives
      independently cited a $2.0 billion current valuation as of April 1, 2026. The
      cross-platform consensus therefore sits in a $1.77–2.0 billion band, not the $5.36
      billion last primary mark.


      Total lifetime capital raised is estimated at $2.07 billion by Forge's COI data
      (or up to $2.6 billion by looser estimates that include structured debt). With an
      implied equity value of roughly $1.8–2.0 billion and $2.07+ billion deployed, Rappi's
      capital-efficiency ratio is approximately 0.79×—investors have not yet recovered
      more than the capital invested in aggregate. CEO Simón Borrero publicly stated four
      consecutive quarters of positive EBITDA through end-2025, and CFO Tiago Azevedo
      (hired April 2024 to prepare the IPO) confirmed net revenue of approximately
      $800 million for the period referenced. Analyst and intelligence-platform estimates
      for 2025–2026 revenue range wider, from $1.1 billion to $1.3 billion, reflecting
      new verticals including RappiPay, Rappi Turbo, and advertising. No audited financials
      are publicly available; reported profitability figures are company-asserted only.
