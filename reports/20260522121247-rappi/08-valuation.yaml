  - id: scenario-analysis
    title: "Scenario Analysis: Bull, Base, and Bear"
    body: >-
      Three scenarios frame the investment case, each conditioned on verifiable revenue
      growth, margin trajectory, and IPO market access.


      The bull case (15–20 % probability signal) envisions Rappi reaching $2.0 billion in
      net revenue by FY2027 through accelerated RappiPay and advertising monetization—two
      high-margin verticals that could lift blended EBITDA margins toward 10–15 %. An IPO
      at 3.0×–3.5× forward revenue would imply a $5.0–6.0 billion valuation, roughly
      validating the 2022 equity-round mark. This scenario requires simultaneous execution
      across delivery, fintech, and ads in at least three major markets (Brazil, Mexico,
      Colombia), and continued inflow of strategic capital from Amazon or a follow-on
      institutional investor.


      The base case (40–45 % probability) is more conservative: revenue reaches $1.3–1.5
      billion, delivery growth is steady but ad/fintech contribution remains modest, and
      the IPO prices at 2.0×–2.5× revenue. The resulting valuation range is $2.6–3.8
      billion, a 25–50 % haircut to the 2022 primary mark but a 50–100 % premium to
      secondary market pricing as of May 2026. This represents a favorable outcome for
      secondary-market buyers but a flat-to-negative return for primary-round investors.


      The bear case (35–40 % probability) sees revenue stagnation at $800 million–$1.1
      billion, delayed or cancelled IPO, and multiple compression to 1.0×–1.3× revenue,
      implying a $0.8–1.4 billion valuation. Trigger conditions include prolonged LatAm
      macro deterioration, a down round driven by continued operational cash needs,
      regulatory escalation in Colombia or Brazil, or loss of the Amazon partnership.
      El País analysts observed that as of June 2025 only two of Rappi's many product
      lines were generating meaningful revenue, raising execution-concentration risk.
