callouts:
  - calloutType: recommendation
    title: "Track — Do Not Chase the Equity-Round Price"
    body: >-
      Rappi's $5.25 billion equity-round mark implies a ~4× revenue multiple on unaudited
      and widely ranging revenue estimates, while public super-app and food-delivery peers
      trade at 1.9×–4.4× on verified financials. Secondary markets consistently clear at
      $1.77–2.0 billion, a 66 % discount. The correct posture is to track until the IPO
      S-1 surfaces audited data, rather than pay a premium for opacity. Secondary entry at
      or below $2.2 billion provides a margin of safety consistent with base-case fair value.
    claimRefs:
      - CV032
      - CV033
      - CV007
      - CV008

  - calloutType: risk
    title: "Opacity Is the Largest Valuation Risk"
    body: >-
      No audited financial statements are publicly available for Rappi. Revenue estimates
      from independent analysts span $800 million to $1.3 billion—a 60 % range—and
      profitability claims are company-asserted by the CEO only. A capital-efficiency
      ratio of 0.79× means the accumulated capital invested exceeds the current implied
      market cap, creating asymmetric downside for later-stage primary investors. The
      absence of an S-1 filing through mid-2026, despite repeated public IPO announcements
      since 2022, compounds governance and transparency concerns.
    claimRefs:
      - CV005
      - CV006
      - CV035
      - CV036
      - CV042

  - calloutType: assumption
    title: "Base-Case Anchored on $1.3 B Revenue Estimate"
    body: >-
      All scenario valuations use an estimated 2025–2026 net revenue of $1.3 billion
      derived from Sacra, Compworth, and intelligence-platform data. The CFO's 2024 public
      statement cited $800 million. Until audited financials are released, the actual
      revenue base is unknown. Investors should stress-test entries against the lower
      $800 million revenue figure, which yields a base-case fair value of roughly
      $1.6–2.0 billion—squarely in line with secondary market pricing.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV021

