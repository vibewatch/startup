  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-sla
      missingEvidence: "Official Rappi platform status page or published SLA document with uptime percentages and incident history"
      whyItMatters: "Without a status page or SLA, investors and enterprise customers cannot assess actual platform reliability; the absence weakens the case for enterprise adoption."
      diligencePath: "Request uptime metrics directly from Rappi management; check AWS CloudFront/Route53 configurations for any status endpoint; review any SLA terms in partner contracts."
      relatedQuestionRefs: [QE021]

    - type: private-evidence-only
      severity: material
      topic: compliance-certifications
      missingEvidence: "Independent SOC 2 Type II, ISO 27001, or PCI DSS audit reports for the Rappi delivery platform"
      whyItMatters: "Absence of these certifications is a material gap for large-scale enterprise or financial-institution partnerships. It also limits due-diligence confidence in data security."
      diligencePath: "Request certification status from Rappi CISO or legal; review any financial-service partner agreements (Davivienda) for mandated certifications."
      relatedQuestionRefs: [QE007]

    - type: conflicting-data
      severity: material
      topic: regulatory-risk-turbo-farma
      missingEvidence: "ANVISA licensing documentation for Turbo Farma units; outcome of Abrafarma legal challenge in Brazilian courts"
      whyItMatters: "If Abrafarma prevails, Rappi's Brazilian pharmacy vertical—described as the primary growth lever—could be blocked, materially impairing the R$1.4 billion Brazil investment thesis."
      diligencePath: "Monitor Brazilian court filings and ANVISA administrative decisions; request copies of Turbo Farma ANVISA licenses from Rappi management."
      relatedQuestionRefs: [QE011]

    - type: missing-source
      severity: minor
      topic: open-source-developer-signal
      missingEvidence: "Any official Rappi open-source repositories, published benchmark results, conference talks, or public architecture diagrams"
      whyItMatters: "The absence of public repos or conference content limits external validation of engineering quality claims."
