  - id: technology-infrastructure-engineering
    title: "Technology Infrastructure & Engineering Scale"
    body: >
      Rappi's backend is built on a cloud-native microservices architecture hosted predominantly on
      AWS (7,000+ EC2 instances; among the top-100 AWS resource consumers globally). The platform
      runs over 2,000 microservices on ECS, plus another 1,500 microservices dedicated to the
      RappiPay financial stack, authored by 750+ engineers across product teams. A 70-person Cloud
      Engineering team manages 50+ Kubernetes (EKS) clusters; the largest cluster alone runs 20,000+
      containers. The service mesh migrated from an in-house solution to Istio (with Envoy sidecars)
      after the custom mesh hit scaling limits; more than 1,500 developers now use Istio, enabling
      flexible per-service rate limits, circuit breakers, connection pools, and mTLS between
      endpoints—critical for PCI-relevant RappiPay workloads.

      API management is centralised via KrakenD, deployed since May 2020 across 20+ independent
      gateways (each dedicated to a functional domain such as Orders or Menus). KrakenD configuration
      is auto-generated from a Jinja template containing 35,000+ lines of conditions. Metrics from
      all KrakenD instances flow to Splunk SignalFX for real-time monitoring. Rappi broke the
      monolith in 2021 and now executes 1,500+ production deployments per day using Bitbucket-based
      CI/CD pipelines. API security is provided by Wallarm, replacing the prior Imperva SecureSphere
      WAF; Wallarm supplies REST and SOAP API protection, automated API discovery, and
      Infrastructure-as-Code deployment. The technology stack spans Go, Java/Kotlin/Scala,
      Node.js/TypeScript, and Python on the backend; React and Next.js on the front end; and
      PostgreSQL, DynamoDB, MongoDB, Kafka, Redis, and Snowflake for persistence and streaming.
      AI/ML frameworks (TensorFlow, PyTorch, Amazon SageMaker) are used for demand forecasting,
      personalization, and fraud detection.
