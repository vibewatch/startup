callouts:
  - calloutType: strength
    title: "Hyper-Scale Microservices Platform"
    body: >
      Rappi's engineering platform—2,000+ delivery microservices, 1,500+ RappiPay microservices,
      50+ Kubernetes clusters, and 1,500+ daily deployments—is among the most sophisticated in
      Latin America. The adoption of Istio, KrakenD, and Wallarm reflects mature infrastructure
      thinking. This scale and velocity is a meaningful moat against regional start-ups attempting
      to replicate the full-stack super-app model.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE014

  - calloutType: risk
    title: "Regulatory Risk: Turbo Farma Pharmaceutical Model"
    body: >
      Rappi's Turbo Farma pilot in Brazil directly conflicts with Abrafarma's interpretation of
      Law 5,991/73 and ANVISA's RDC 44, which restrict pharmaceutical sales to pharmacies open
      to the public. If Brazilian courts rule against the dark-store pharmacy model, Rappi's
      significant R$1.4 billion Brazil investment thesis is jeopardised and the pharmaceutical
      revenue line—described by the Brazil CEO as the primary growth lever—would be curtailed.
    claimRefs:
      - CE026
      - CE027
      - CE028

  - calloutType: risk
    title: "Customer Satisfaction Gap Undermines Retention"
    body: >
      A 3.4/5 Google Play rating from 2.31 million reviewers is materially below peer super-apps
      and signals systemic reliability and support quality issues. Recent user reviews cite order
      changes without notice and inability to reach live customer support. For a platform dependent
      on high-frequency repeat engagement, sustained NPS deterioration directly erodes the unit
      economics of the subscriber model.
    claimRefs:
      - CE033
      - CE034

  - calloutType: insight
    title: "Fountain9 AI Acquisition Creates Potential B2B Supply-Chain Revenue Stream"
    body: >
      By acquiring Fountain9's AI-driven demand-sensing and inventory-planning technology for
      Turbo dark stores, Rappi gained both operational advantage (reducing waste, improving
      availability) and the strategic option to offer this technology as a B2B supply-chain SaaS
      to external retail partners. If executed, this expands Rappi's addressable market beyond
      delivery margin and could contribute a high-margin recurring revenue layer.
    claimRefs:
      - CE024
      - CE025

