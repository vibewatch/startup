company:
  name: Rappi

chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Rappi operates Latin America's most expansive super app, spanning food and grocery delivery,
    ultra-fast Turbo dark-store fulfillment, cloud kitchens, fintech (RappiPay/RappiCard), travel,
    and subscription (Rappi Pro/Pro Black) across nine countries. Its engineering platform runs 2,000+
    microservices on 50+ Kubernetes clusters managed by Istio, with KrakenD API gateways and Wallarm
    API security providing the backbone for 1,500+ daily deployments. Critical technical gaps include
    a 3.4/5 Google Play rating reflecting persistent reliability and support deficiencies, regulatory
    exposure for its Turbo Farma pharmacy dark-store model, and an absence of public-facing
    resilience SLAs or third-party infrastructure certifications.

sections:
  - id: product-suite-vertical-strategy
    title: "Product Suite & Vertical Strategy"
    body: >
      Rappi began as a courier app in 2015 and has systematically assembled a multi-vertical super
      app covering on-demand food and grocery delivery, ultra-fast 10-minute commerce (Rappi Turbo),
      cloud kitchens (RappiKitchen), fintech services (RappiPay, RappiCard, RappiPréstamos),
      subscription memberships (Rappi Pro, Rappi Pro Black), travel booking (Rappi Travel), and a
      courier-concierge feature (RappiFavor). As of May 2026 the Google Play listing reports over
      200,000 restaurants and stores available across more than 300 cities in nine Latin American
      countries. The app was last updated on May 16, 2026, and carries a 3.4/5 rating from 2.31
      million reviews—signalling persistent customer satisfaction gaps.

      Each vertical is purpose-built to extend engagement time and share of wallet. Rappi Pro at
      COP 24,490/month (~USD 6) and Rappi Pro Black at COP 32,990/month (~USD 8) unlock unlimited
      free deliveries, service-fee discounts, cashback on RappiCard, and access to ChatGPT GO for
      new Pro Black subscribers. The fintech arm, RappiPay—operated jointly with Davivienda in
      Colombia—added RappiPréstamos Aliados in May 2026: merchant credit lines from COP 1.8M to
      COP 61.3M, pre-approved algorithmically from transaction history, disbursed in minutes, and
      repaid as a percentage of future Rappi sales. RappiKitchen provides three dark-kitchen
      configurations—hub-sharing, satellite expansion, and shared-cluster kitchens—in 15+ cities
      across Colombia, Mexico, and Brazil. The breadth of verticals creates network effects and
      monetization density but also increases operational complexity and regulatory surface.
