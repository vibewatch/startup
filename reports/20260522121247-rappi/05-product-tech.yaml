  - id: trust-compliance-developer-ecosystem
    title: "Trust, Compliance, Developer Ecosystem & Gaps"
    body: >
      Rappi's data-protection posture is anchored to Colombia's Ley 1581 de 2012 and Decree 1074
      de 2015 (Habeas Data), with explicit consent requirements, user access/rectification/erasure
      rights, and restrictions on unauthorised personnel accessing sensitive databases. The published
      privacy policy for RAPPI S.A.S. covers all personal-data processing including its partner API
      integrations. Google Play's data-safety declaration confirms data is encrypted in transit and
      users can request deletion; no data is shared with third parties per the published disclosure.
      API security is hardened by Wallarm (replacing legacy WAF) with IaC-integrated DevSecOps
      workflows, Bitbucket sync, and Slack-integrated alerting. The developer portal
      (dev-portal.rappi.com, API v1.24.5) provides OAuth 2.0 Bearer-token authentication and
      self-onboarding for merchant partners (Rappi "allies"), with endpoints covering menus,
      orders, stores, item availability, and webhooks.

      Key gaps remain. The platform has no publicly disclosed uptime SLA or status page indexable
      by third-party reliability trackers—WebsiteCharts and Downdetector both note insufficient
      measurement data, leaving investors with no auditable reliability baseline. The Google Play
      rating of 3.4/5 from 2.31 million reviews includes recurring complaints about order
      cancellations without communication and inability to reach human customer support agents.
      Rappi holds no publicly documented SOC 2, ISO 27001, or PCI DSS certification across its
      delivery platform (RappiPay's fintech compliance posture is separate). The GitHub topics page
      for "rappi" shows only 13 repositories, all community or student projects—Rappi has no
      material open-source footprint, limiting external auditability of its core stack.
