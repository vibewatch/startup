summary:
  headline: >-
    Quantinuum is one of the strongest pre-IPO quantum platforms, but a $10B valuation on only $30.9M of 2025 revenue, a
    $192.6M net loss, and unresolved Honeywell control terms keeps the name in track territory rather than buy
    territory.
