- id: contradictions-and-gaps
  title: Contradictory Estimates and Diligence Gaps
  body: |-
    The main diligence risk in this market is false precision. Published estimates vary sharply because some sources measure current realized revenue while others model a future stack that includes infrastructure, software, cloud access, and long-horizon industry applications. That is why QED-C’s $1.9 billion 2025 market size can coexist with a $3.62 billion 2025 estimate from The Business Research Company and much broader multi-decade market narratives from other vendors. These should be preserved as contradictory lenses rather than averaged into a synthetic “consensus TAM.”

    Quantinuum-specific opacity compounds the problem. The company does not publicly break out revenue, bookings, pricing, or product-mix contribution across hardware, Nexus, InQuanto, and Quantum Origin. Public partner announcements prove interest in finance, chemistry, and materials workflows, but they do not reveal contract size, renewal behavior, or conversion from research pilot to scaled production spend. Likewise, public-sector commitments are large, but the specific share Quantinuum can capture versus peers is not disclosed.

    For valuation, the right posture is therefore evidence-constrained. Underwrite the market from current measured demand, cloud-access procurement, and directly evidenced vertical workflows; treat the rest as upside scenarios that still require proof on algorithm readiness, talent supply, export compliance, and budget conversion.
