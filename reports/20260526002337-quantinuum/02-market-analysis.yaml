    - Which pilots have converted into multi-year recurring revenue?
  - - Fault-tolerant timeline
    - Constraint
    - Near to medium term
    - Restricts value to selective workloads until larger fault-tolerant systems exist
    - Which product lines depend on utility before fault tolerance vs. after it?
  - - Talent shortage
    - Constraint
    - Current
    - Slows customer deployment, vendor hiring, and ecosystem scaling
    - How does Quantinuum recruit across physics, engineering, and software, and what is attrition?
  - - Export controls and deemed exports
    - Constraint
    - Current
    - Complicate research collaboration, hiring, and international commercial expansion
