- id: TM006
  title: Contradictory Estimates and Diligence Gaps Table
  columns:
  - Issue
  - Conservative Lens
  - Expansive Lens
  - Why They Differ
  - Diligence Ask
  rows:
  - - Current market size
    - $1.9B 2025 market size (QED-C)
    - $3.62B 2025 market size (TBRC)
    - Measured current-market framing versus broader vendor-market taxonomy
    - Normalize each source’s scope before using it in valuation or market-share math
  - - Growth horizon
    - Useful applications in 3–5 years; FTQC still years away (QED-C)
    - Multi-decade 2026–2046 commercialization narratives (ResearchAndMarkets)
    - Operational-readiness timing is narrower than long-horizon capital-market narratives
    - Separate near-term underwriting from bull-case optionality
  - - Public funding vs. customer revenue
    - $2.013B 2026 U.S. public incentives
    - Unclear private recurring revenue capture by individual vendors
    - Governments can spend heavily before commercial demand is broad
    - Ask management to map revenue exposure to public programs versus commercial customers
  - - Cybersecurity timing
    - PQC migration is urgent now
    - Quantum computers may still be years or decades away from breaking current cryptography
    - Migration timelines and hardware timelines are not the same
    - Model Quantum Origin as a readiness/security product, not as a proxy for general QC utility
  - - Segment economics
    - Partner proofs show finance and chemistry interest
    - Public contract values, pricing, and renewals remain undisclosed
    - Use-case proof does not reveal monetization quality
    - Request product-line pricing, ACV, pilot-conversion rates, and renewal data
  notes: Contradictions are a feature of this market, not a drafting error. They reflect different market boundaries, time horizons, and payer assumptions.
