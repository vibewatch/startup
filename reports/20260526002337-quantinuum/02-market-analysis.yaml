    - Buyers can reach other hardware and software providers through AWS, Azure, IBM, or other networks
    - Measure win rates for direct Nexus versus third-party platform access
  notes: The strongest driver/constraint pair is policy-funded momentum versus workload-selective technical readiness. This market can grow while still disappointing broad-compute narratives.
