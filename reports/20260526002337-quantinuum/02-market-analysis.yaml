chapter:
  number: 2
  title: Market Analysis
  summary: 'Quantinuum operates in a narrowly defined quantum-computing stack—trapped-ion hardware access, cloud orchestration, developer tools, chemistry/materials applications, and QRNG-style cybersecurity—rather than the whole HPC or cybersecurity budget. Current measured market size is still small (QED-C: $1.9B in 2025), but published 2025 estimates already stretch to $3.62B and broader long-horizon reports go much higher because they include more of the software, cloud, funding, and application layers. Near-term demand is most visible in chemistry/materials, finance and optimization pilots, cybersecurity readiness, and government/HPC research, while scaling remains constrained by fault-tolerance timelines, talent shortages, export controls, and budget-conversion uncertainty.'
sections:
- id: boundary-and-scope
  title: Market Boundary and Included Spend
  body: |-
    Quantinuum should be analyzed inside a narrowly defined full-stack quantum-computing market, not inside the whole HPC, cybersecurity, or advanced-software universe. The company’s own product surface spans trapped-ion hardware, quantum-as-a-service access, developer tooling, chemistry/materials workflows, and a quantum-randomness security product. External market reports use a similar layered taxonomy: hardware platforms, software development tools, cloud services, and industry-specific applications. That framing is important because it keeps the core market tied to identifiable quantum-specific budgets instead of treating all adjacent compute spending as addressable.

    Included spend therefore covers direct subscriptions or reserved access to H-Series systems; cloud access and orchestration layers such as Nexus; compiler, workflow, and developer-tooling spend around TKET/Qermit/lambeq-like workflows; application-layer spend for chemistry/materials and optimization pilots; and narrowly defined cybersecurity spend linked to QRNG or post-quantum migration readiness. Excluded spend should include generic supercomputing capacity, general cloud infrastructure, conventional HPC software, classical optimization tools, and broad cybersecurity or semiconductor budgets that do not buy a quantum-specific product.

    The most important adjacency boundary is HPC. Airbus explicitly describes quantum computing as working in tandem with traditional HPC for aerospace simulation rather than replacing it. For Quantinuum, that means aerospace, chemistry, and public-lab demand often starts as an incremental line item inside existing research or innovation budgets, not as a direct displacement of an enterprise’s full classical-compute stack.
