- id: drivers-and-constraints
  title: Adoption Drivers and Constraints
  body: |-
    The growth case for Quantinuum is credible, but tightly bounded. On the positive side, the company’s trapped-ion architecture exposes features—such as all-to-all connectivity and mid-circuit operations—that are relevant to the optimization and simulation classes most often cited by early adopters. Cloud and hybrid orchestration further reduce procurement friction because buyers can experiment without standing up their own infrastructure. Government strategy is another powerful tailwind: national-security and industrial-policy actors continue to fund the ecosystem before general enterprise demand is mature.

    The constraints are just as important. QED-C still expects first useful applications in roughly three to five years and says fault-tolerant quantum computing remains years away. That timing makes the market highly workload selective. Talent is another hard bottleneck: the industry continues to need people who can bridge physics, engineering, and software, and public guidance explicitly notes dependence on foreign talent. Export controls and deemed-export rules create direct friction for cross-border teams and could slow both sales and research collaboration. Finally, regulated buyers face extra burdens from data-sovereignty and national-security rules, especially in finance, pharma, aerospace/defense, and public-sector programs.

    In practice, adoption is not a simple linear hardware curve. It is a gated process in which workload selection, cloud access, export-control review, and business-case validation all have to clear before a pilot turns into recurring spend.
