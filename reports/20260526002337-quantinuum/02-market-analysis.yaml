- id: sizing-lenses
  title: Sizing With Multiple Lenses, Not One Hype Number
  body: |-
    Current market-size evidence supports a cautious, multi-lens approach. QED-C’s 2026 industry report pegs 2025 quantum-market size at $1.9 billion and simultaneously shows a still-small ecosystem of 556 pure-play companies, 16,482 pure-play workers, and 8,261 new quantum-related openings. That is the most conservative current-revenue lens in this chapter because it is anchored to an industry census rather than a long-range vendor model. By contrast, The Business Research Company estimates the 2025 market at $3.62 billion and projects $16.27 billion by 2030. ResearchAndMarkets’ public summary stretches even wider by framing a stack that includes hardware, software, cloud services, and industry applications across a 2026–2046 horizon.

    These are not interchangeable figures. QED-C’s number behaves like a measured current market; vendor reports behave more like category-expansion models that incorporate future adoption and broader scope definitions. Public funding is a fourth lens again: NIST’s 2026 announcement of roughly $2.013 billion of letters of intent shows that public-sector capital committed to the ecosystem can already rival the measured current market size. That matters for Quantinuum because governments and public labs are among the few buyers willing to fund capability before broad commercial ROI is proven.

    The practical conclusion is that Quantinuum’s near-term SAM is smaller than the most bullish TAM headlines imply. A disciplined model should start from today’s measured stack, then add only those verticals where Quantinuum has direct workload fit and public evidence of buyer intent.
