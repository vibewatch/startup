  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: quantinuum monetization by product line
    missingEvidence: Public revenue, bookings, pricing, and renewal data for H-Series access, Nexus, InQuanto, and Quantum Origin.
    whyItMatters: Without product-level monetization data, a bottom-up SAM/SOM model cannot distinguish research interest from durable revenue quality.
    diligencePath: Request product-line ACV, bookings mix, pilot-to-production conversion, and renewal rates from management or investor materials.
    relatedQuestionRefs:
    - QM024
    - QM026
  - type: missing-source
    severity: material
    topic: segment level spend available to quantinuum
    missingEvidence: Public segment-by-segment budgets showing how much pharma, finance, aerospace, public research, and security spend is quantum-specific and reachable by Quantinuum today.
    whyItMatters: The chapter can define the market boundary and verticals, but cannot build a defensible bottom-up SAM without segment budget data.
    diligencePath: Collect procurement, grant, and customer-budget evidence by vertical; map each to hardware access, software, chemistry, or security products.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: conflicting-data
    severity: material
    topic: market size definitions
    missingEvidence: Publisher-by-publisher normalization of what counts as current market revenue versus future TAM, public funding, and adjacent stack spend.
    whyItMatters: Forecasts differ sharply enough to change valuation narratives and implied market share by multiples.
    diligencePath: Create a normalized market-model bridge that separates current revenue, future forecast, and public-funding lenses before using any headline TAM.
    relatedQuestionRefs:
    - QM005
    - QM006
    - QM023
    relatedTableRefs:
    - TM002
    - TM006
  - type: private-evidence-only
    severity: material
    topic: public sector exposure and defense mix
    missingEvidence: Quantinuum-specific share of government awards, defense-related work, and public-research revenue by geography.
    whyItMatters: Government funding is a major market lens, but Quantinuum capture rate versus peers is not publicly observable.
    diligencePath: Request public-sector pipeline, awarded-contract backlog, and geography mix; cross-check against procurement databases where possible.
    relatedQuestionRefs:
    - QM025
  - type: access-blocked
    severity: minor
    topic: additional third-party corroboration
    missingEvidence: Full-text access to some analyst and company sources that were blocked or only partially available from the public web.
    whyItMatters: The chapter has enough evidence to bound the market, but blocked sources limit extra corroboration around sector-specific forecasts.
    diligencePath: Use paid analyst access or management-provided source packs to reconcile blocked market and end-user reports.
    relatedQuestionRefs:
    - QM010
    - QM023
