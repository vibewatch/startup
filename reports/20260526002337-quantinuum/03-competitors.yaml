- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider / route
  - Public packaging signal
  - Public price signal
  - Evidence-backed caveat
  - Buyer implication
  rows:
  - - Quantinuum direct / Azure
    - Subscription, grants, Azure access, and on-prem inquiry
    - No public list pricing on cited pages
    - Access models are clear, but enterprise buyers still need a sales process for exact economics
    - Strong enterprise packaging, weaker public procurement transparency
  - - IBM Quantum Platform
    - Open, pay-as-you-go, flex, premium, and on-prem
    - Free open tier; $96/min PAYG; $72/min Flex from 400 min/year; $48/min Premium from 5,200 min/year; on-prem quote
    - IBM pricing is minute-based rather than outcome-based and assumes IBM platform usage
    - Most transparent universal gate-model offer in the set
  - - Google Willow
    - Selective early-access research program
    - No public price
    - Program is proposal-based and not public in 2026
    - Commercial pressure is delayed because procurement is gated
  - - IonQ direct cloud
    - On-demand or reservations plus direct cloud console and enterprise workflow tools
    - Official page discloses access models but not list prices
    - Economic transparency improves through AWS marketplace pricing instead of direct page rates
    - Good packaging breadth even when direct list rates are opaque
  - - IonQ on AWS Braket
    - Per-task, per-shot, or hourly reservation
    - 'IonQ Forte example: $0.30/task plus $0.08/shot; error mitigation requires at least 2,500 shots'
    - Marketplace economics can make experimentation expensive at low scale
    - Useful benchmark for buyers comparing trapped-ion access costs
  - - Rigetti Novera
    - Immediate-shipment on-prem QPU plus partner ecosystem
    - Commercial product exists, but no list sticker in cited page
    - Public commercialization signal is stronger than public unit pricing
    - Helps Rigetti compete in hardware procurement even without easy cloud price comparison
  - - Rigetti on AWS Braket
    - Per-task, per-shot, or reservation usage
    - 'Pricing example: $0.30/task plus $0.000425/shot on Rigetti Cepheus'
    - Example-based disclosure is clearer for cloud experimentation than for total system economics
    - Superconducting experimentation is visibly cheaper per shot than trapped-ion AWS examples
  - - QuEra on AWS Braket
    - On-demand AWS plus premium direct access
    - AWS lists per-task / per-shot pricing structure for QPUs, but buyer spend still depends heavily on workload design
    - Neutral-atom access is available now, but cost comparability depends on problem class rather than raw qubit count
    - Makes QuEra a practical option for exploration without a custom enterprise contract
  - - D-Wave Leap / Advantage2
    - Immediate cloud and on-prem access with hybrid solvers
    - Official pages market access and trials rather than standardized public per-workload pricing on the cited pages
    - Useful production posture is clearer than universal gate-model comparability
    - Strong substitute when the buyer values immediate optimization results over universality
  notes: Pricing evidence mixes direct list prices and marketplace examples. Where exact pricing is absent, the row records the packaging path rather than inventing realized unit economics.
