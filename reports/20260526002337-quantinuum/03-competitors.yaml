- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Counter-evidence / rival pressure
  - Severity
  - What would change the verdict
  rows:
  - - Best current trapped-ion enterprise package
    - IonQ now overlaps on direct cloud, multi-SDK support, and on-prem Forte Enterprise
    - high
    - Quantinuum needs clearer performance or commercial proof that survives direct comparison with IonQ
  - - Software ecosystem reduces lock-in for Quantinuum users
    - The same openness means pytket, Qiskit, Cirq, and AWS/Azure routes also reduce lock-in for competitors
    - medium
    - Moat improves only if Quantinuum turns software into uniquely better outcomes rather than just compatibility
  - - Cloud and partner reach are protective
    - AWS Braket already aggregates multiple rival modalities; IBM runs its own mature platform; Azure is not exclusive distribution
    - high
    - Exclusive channels are unlikely, so channel advantage must come from better service and enterprise adoption
  - - High fidelity creates durable hardware moat
    - IEEE and rival roadmaps show the category is still pre-consensus, with IBM, QuEra, and PsiQuantum pushing different scaling paths
    - medium
    - Durability rises if Quantinuum keeps turning fidelity into benchmarked logical-qubit and application wins
  - - Near-term buyer urgency favors Quantinuum
    - D-Wave and classical-HPC status quo solve some optimization jobs today without waiting for universal gate-model maturity
    - medium
    - Quantinuum needs application proof where universal gate models beat substitutes on time-to-value
  - - Roadmaps support long-term leadership
    - Google, IBM, QuEra, IonQ, and PsiQuantum all market aggressive future-state narratives
    - high
    - Roadmaps become defensible only when they convert into paid access, stable performance, and reproducible workloads
  - - Enterprise-ready deployment differentiates Quantinuum
    - OQC, Rigetti, IBM, and D-Wave all market cloud plus on-prem or colocated deployment patterns
    - medium
    - Quantinuum keeps an edge only if deployment quality comes with measurable performance advantage
  - - Market hype itself helps incumbents
    - IEEE’s skeptical 2026 framing suggests no vendor yet has broad commercial advantage, which compresses everyone’s moat claims
    - high
    - The whole category needs reproducible economic wins before any moat narrative should be underwritten aggressively
  notes: Severity is judgmental and based on the cited evidence pack, not on a statistical model; rows focus on where Quantinuum’s current strengths are most exposed to commoditization or architectural displacement.
