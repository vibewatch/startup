  - type: private-evidence-only
    severity: material
    topic: cross-vendor-portability-benchmarks
    missingEvidence: A buyer-level benchmark showing the same workload ported across Quantinuum, IonQ, IBM, Rigetti, QuEra, and D-Wave with measured queueing, cost, and result quality.
    whyItMatters: The chapter can show that multi-homing exists, but not how much practical performance portability buyers really get after hardware-specific tuning.
    diligencePath: Run a controlled benchmark pack across the major access routes and capture both engineering effort and economic outcomes.
    relatedQuestionRefs:
