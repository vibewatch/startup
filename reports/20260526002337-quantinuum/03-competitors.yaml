  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quantinuum-pricing-opacity
    missingEvidence: A public Quantinuum rate card or contract-level shot / reservation economics comparable to IBM or AWS Braket marketplace pricing.
    whyItMatters: Without public pricing, the chapter can compare access paths and relative transparency but not normalized cost-per-experiment or total cost of ownership.
    diligencePath: Request current commercial pricing from Quantinuum sales or a channel partner and normalize it against IBM and AWS Braket cost structures.
    relatedQuestionRefs:
