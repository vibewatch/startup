tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / alternative
  - Modality
  - Commercial surface
  - Scale signal
  - Target buyer
  - Strategic angle / limitation
  rows:
  - - Quantinuum
    - Trapped ion
    - Direct subscription, Azure distribution, cloud and on-prem Helios / H-Series access
    - Helios marketed with 98 physical qubits, cloud + on-prem access, and enterprise references including BMW, JPMorganChase, SoftBank, and Amgen
    - Enterprise and research buyers in chemistry, materials, cybersecurity, finance, and advanced R&D
    - Best present blend of trapped-ion performance and enterprise packaging, but public list pricing is still opaque
  - - IBM Quantum
    - Superconducting
    - Open, pay-as-you-go, flex, premium, and on-prem plans via IBM Quantum Platform
    - 30+ systems above 100 qubits, 2,300+ available qubits, 97% uptime, 3.9T+ circuits
    - Researchers, enterprises, and HPC-linked institutions that want mature platform tooling
    - Most procurement-ready public offering, but Qiskit Runtime can increase workflow stickiness
  - - Google Quantum AI
    - Superconducting
    - Selective Willow early access plus Cirq software and research collaborations
    - Willow access is still not public and remains proposal-gated in 2026
    - High-end research partners and institutions pursuing frontier experiments
    - Strong long-term ecosystem threat, weaker near-term procurement pressure
  - - IonQ
    - Trapped ion
    - Direct cloud, AWS/Azure-compatible workflows, and Forte Enterprise on-prem systems
    - 2026 roadmap targets 100-256+ physical qubits and 12 logical qubits; Q1 2026 revenue reached $64.7M
    - Enterprises and governments wanting trapped-ion systems with multiple access modes
    - Closest commercial overlap with Quantinuum, especially where direct cloud and on-prem both matter
  - - Rigetti
    - Superconducting
    - QCS cloud, hybrid APIs, and on-prem Novera procurement
    - Cepheus-1 108Q deployed April 2026; Novera orders totaled about $5.7M for two systems
    - HPC-linked teams and quantum engineering groups that want deep stack access
    - Competes on openness and hybrid latency more than headline fidelity leadership
  - - IQM
    - Superconducting
    - On-prem systems for universities and HPCs plus quantum cloud access
    - Official site markets 5, 20, 54, and 150 qubit systems
    - Sovereign, academic, and national-compute buyers
    - Stronger in sovereign/HPC procurement than in public-cloud mindshare
  - - QuEra
    - Neutral atom
    - Amazon Braket plus premium direct access
    - Aquila offers 256 qubits and 100+ cloud hours per week; roadmap claims 256 physical and >10 logical qubits achieved
    - Researchers and enterprises focused on simulation, optimization, and ML exploration
    - Neutral atoms add a credible alternative path, but commercial utility claims remain early
  - - Oxford Quantum Circuits
    - Superconducting
    - Cloud, sovereign colocation, and API embedding
    - Official messaging emphasizes commercial-grade systems available today rather than public qubit or revenue disclosures
    - Finance, pharma, national security, and sovereign data-centre buyers
    - Competes on deployment geography and enterprise posture, but public scale proof is thinner
  - - PsiQuantum
    - Photonic
    - No broad public cloud access; utility-scale buildout and government-backed facilities
    - Official stack cites wafers built by the thousands, >1M devices tested, 300mm wafers, and Chicago / Australia utility-scale projects
    - Governments and long-horizon strategic buyers willing to underwrite future architecture bets
    - Potentially large long-term threat if manufacturing thesis converts into usable systems, but near-term commercial access is absent
  - - D-Wave / optimization substitute
    - Superconducting annealing + hybrid solvers
    - Leap cloud and on-prem Advantage2 systems
    - 4,400+ qubits in official system diagram, 20-way connectivity, 99.9% uptime on Leap, and million-variable hybrid claims
    - Optimization-heavy enterprises that need production use now more than universal gate-model roadmaps
    - Real substitute for some workloads even though it is not a like-for-like universal gate-model rival
  - - Internal build / classical-HPC status quo
    - Classical simulators, HPC, and limited pilot access
    - In-house research teams, public simulators, and occasional vendor credits or proposal-based access
    - Often cheaper and easier to govern than committing to one immature hardware vendor
    - Enterprises exploring quantum readiness without immediate production deployment
    - Still a durable default because many vendor claims remain ahead of broad commercial utility
  notes: Rows focus on the named rivals and practical substitutes relevant to Quantinuum in the 2026 source pack; scale signals mix official hardware, cloud, and commercialization disclosures rather than one normalized metric.
