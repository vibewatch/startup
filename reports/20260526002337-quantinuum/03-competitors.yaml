- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Quantinuum
  - Best-supported alternatives
  - Competitive implication
  rows:
  - - Hardware architecture
    - Trapped-ion QCCD with all-to-all connectivity and mid-circuit measurement
    - IonQ trapped ions; IBM / Google / Rigetti / IQM / OQC superconducting; QuEra neutral atoms; PsiQuantum photonics
    - Quantinuum wins on current trapped-ion positioning, but architecture leadership is still unsettled across the market
  - - Direct enterprise deployment
    - Direct subscription, on-prem, and Azure access for systems
    - IBM on-prem and annual plans; IonQ Forte Enterprise; Rigetti Novera; OQC colocation; D-Wave on-prem
    - Quantinuum is strong here, but not unique
  - - Open software / compiler layer
    - pytket imports and compiles across multiple formats and backends
    - Qiskit, Cirq, IonQ multi-SDK support, Rigetti Quil / pyQuil
    - Software ecosystems help adoption, but also reduce app-layer lock-in
  - - Cloud marketplace reach
    - Azure channel plus direct service
    - AWS Braket for IonQ, IQM, QuEra, Rigetti; IBM direct platform
    - Channel reach matters because buyers increasingly multi-home before standardizing
  - - Public pricing transparency
    - Quote-led rather than explicit list pricing
    - IBM discloses minute tiers; AWS discloses per-shot / per-task / reservation pricing; Rigetti publicizes Novera commercialization
    - Opaque pricing weakens procurement speed even when technical positioning is strong
  - - Current commercialization proof
    - Enterprise logos and cloud / on-prem availability
    - IBM fleet and plans; IonQ revenue and RPO; D-Wave production claims; Rigetti cloud history
    - The strongest commercial pressure comes from vendors with both access and proof of spend
  - - Logical-qubit / FTQC narrative
    - Quantinuum markets real-time error correction and logical qubits on Helios
    - IBM modular roadmap, IonQ 2026 logical-qubit target, QuEra logical-qubit roadmap, PsiQuantum manufacturing thesis
    - Roadmaps are now table stakes; buyers still need evidence that they convert into usable systems
  - - Workload fit today
    - Chemistry, materials, cybersecurity, finance, and advanced R&D
    - QuEra and D-Wave skew toward simulation / optimization; IBM and Rigetti toward broad gate-model experimentation
    - Quantinuum is broad, but substitute architectures can still win narrower high-value jobs
  notes: This matrix summarizes the best-supported public evidence, not hidden customer terms or unpublished benchmark data; unsupported cells are framed qualitatively rather than guessed.
