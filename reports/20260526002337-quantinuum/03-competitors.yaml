- id: switching-costs-distribution-and-partner-access
  title: Switching Costs, Multi-Homing, Distribution Power, and Partner Access
  body: 'The strongest evidence against a durable winner-take-all hardware moat is how much the access layer has already standardized. AWS Braket lets buyers compare IonQ, IQM, QuEra, and Rigetti through one control plane and one billing surface, while Quantinuum itself markets Azure access alongside direct subscriptions and on-prem deployments. IonQ explicitly supports Qiskit, Cirq, tket, and Q#, and Quantinuum''s pytket is built to import other instruction formats and compile across targets. That means software-side switching costs are real but not absolute. Buyers can hedge, experiment, and keep teams productive without fully committing to a single hardware vendor. The lock-in that remains is mostly hardware specific: connectivity, noise profile, analog versus gate-model behavior, reservation economics, and where a given workflow actually performs best. In practice, this favors vendors with either superior current performance or strong channel placement. For Quantinuum, the moat is therefore
    narrower than ''owning the stack''; it is closer to ''best-in-class trapped-ion performance plus enough deployment options to stay inside the shortlist as buyers multi-home.'''
