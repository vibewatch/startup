company:
  name: Quantinuum
chapter:
  number: 3
  title: Competitors
  summary: 'Quantinuum faces the deepest current pressure from IBM and IonQ: IBM has the most transparent public commercial packaging and fleet scale, while IonQ overlaps most directly on trapped-ion cloud and on-prem sales. Multi-homing through AWS Braket, Azure access, and open SDK/compiler layers weakens software-side lock-in across the category, so Quantinuum''s moat rests more on fidelity, deployment readiness, and enterprise proof than on exclusive distribution. The strongest skeptical evidence is that even 2026''s error-corrected systems are still scientific rather than broadly commercial advantages, which caps how much any vendor can claim near-term defensibility.'
sections:
- id: landscape-and-modality-map
  title: Landscape, Modality, and the Real Buyer Alternatives
  body: 'Quantinuum''s competitor map is broader than the obvious trapped-ion comparison set. The direct modal rivals include IonQ in trapped ions, IBM, Google, Rigetti, IQM, and Oxford Quantum Circuits in superconducting systems, QuEra in neutral atoms, and PsiQuantum in photonics. D-Wave matters less as a head-on architecture peer than as a substitute for buyers whose real job is near-term optimization, not gate-model fault tolerance. The status quo is also still powerful: many enterprises can rationally stay with classical HPC, simulators, or internal exploratory teams while the hardware market remains immature. That matters because Quantinuum does not win simply by having strong hardware. It has to beat three different alternatives at once: better funded universal hardware platforms, easier-to-buy substitutes, and the default choice to wait. On today''s public record, Quantinuum is strongest where buyers value high-fidelity trapped-ion performance and enterprise deployment options now,
    but the market is still open enough that modality diversity itself is a competitive risk rather than proof of a settled winner.'
