      - number: '5.4'
        title: 差异化、信任姿态与产品边界
        blocks:
          - type: paragraph
            body: >-
              Quantinuum
              的主要差异化是整合。公司把全连接离子阱硬件、动态电路特性、第一方编译器、化学套件、密码产品和开源研究工具放在一起。相比依赖外部编译器、单一云市场上架项，或只有一个窄应用的供应商，这个全栈叙事更强。Quantum
              Origin 的 Bell-test 定位、公开语法检查器和模拟器工作流、GitHub 发布节奏、PyPI 来源记录，都增加了信任信号，说明这个栈是在作为软件运营，而不只是物理演示。


              边界同样可见。公开证据在技术验证上远强于企业运营。Azure 和 OLCF 文档描述了队列、配额和开发周期，但保留来源没有提供历史可用时间、正式 SLA 或详细信任中心材料。Helios
              本地部署已公开提供，但保留来源中设施和支持要求仍不够具体，无法承销。Helios 旗舰“全球最准”的表述也更多由公司和合作伙伴主导，而非在保留材料中得到独立基准验证。净结论：Quantinuum
              在全栈离子阱执行上看起来差异化且技术领先，但买方承销的仍是一套托管、稀缺、企业重型的平台，而不是透明的商品化量子云。
