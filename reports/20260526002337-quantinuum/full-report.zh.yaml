  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              分析 Quantinuum 时，应把它放进窄口径的全栈量子计算市场，而不是整个 HPC、网络安全或高级软件市场。公司自己的产品面覆盖离子阱硬件、量子计算即服务访问、开发者工具、化学 /
              材料工作流，以及量子随机性安全产品。外部市场报告使用类似的分层分类：硬件平台、软件开发工具、云服务和行业应用。这个框架很重要，因为它把核心市场绑定在可识别的量子专项预算上，而不是把所有相邻算力支出都当成可触达市场。


              因此，纳入口径应覆盖 H-Series 系统的直接订阅或预留访问；Nexus 等云访问和编排层；围绕 TKET/Qermit/lambeq 类工作流的编译器、工作流和开发者工具支出；化学 /
              材料与优化试点的应用层支出；以及与 QRNG 或后量子迁移准备相关、窄口径定义的网络安全支出。排除项应包括通用超算容量、通用云基础设施、传统 HPC
              软件、经典优化工具，以及未购买量子专项产品的广义网络安全或半导体预算。


              最重要的相邻边界是 HPC。Airbus 明确把量子计算描述为与传统 HPC 协同服务航空航天仿真，而不是取代它。对 Quantinuum
              而言，这意味着航空航天、化学和公共实验室需求往往先作为现有研究或创新预算中的增量科目出现，而不是直接替代一家企业的完整经典计算栈。
