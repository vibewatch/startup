  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 采购标准
      - Quantinuum
      - 证据最充分的替代方案
      - 竞争含义
    rows:
      - - 硬件架构
        - 采用全连接和电路中测量的囚禁离子 QCCD
        - IonQ 囚禁离子；IBM / Google / Rigetti / IQM / OQC 超导；QuEra 中性原子；PsiQuantum 光子
        - Quantinuum 在当前囚禁离子定位上占优，但全市场的架构领导权仍未定
      - - 直接企业部署
        - 系统可通过直接订阅、本地部署和 Azure 访问
        - IBM 本地部署和年度计划；IonQ Forte Enterprise；Rigetti Novera；OQC 托管部署；D-Wave 本地部署
        - Quantinuum 在这里很强，但并非唯一选择
      - - 开放软件 / 编译器层
        - pytket 可导入并编译到多种格式和后端
        - Qiskit、Cirq、IonQ 多 SDK 支持、Rigetti Quil / pyQuil
        - 软件生态帮助采用，但也削弱应用层锁定效应
      - - 云市场触达
        - Azure 渠道加直接服务
        - AWS Braket 覆盖 IonQ、IQM、QuEra、Rigetti；IBM 直接平台
        - 渠道触达重要，因为买方在标准化前越来越倾向多处下注
      - - 公开定价透明度
        - 以报价为主，而非明确标价
        - IBM 披露分钟档位；AWS 披露按 shot / 任务 / 预留定价；Rigetti 公开 Novera 商业化
        - 即便技术定位很强，不透明定价也会拖慢采购速度
      - - 当前商业化证明
        - 企业客户名单以及云端 / 本地部署可用性
        - IBM 机群和计划；IonQ 收入和 RPO；D-Wave 生产主张；Rigetti 云端历史
        - 商业压力最大的是同时具备访问能力和付费证据的厂商
      - - 逻辑量子比特 / FTQC 叙事
