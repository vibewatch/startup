      - number: '2.2'
        title: 用多重视角测算，而不是套一个炒作数字
        blocks:
          - type: paragraph
            body: >-
              当前市场规模证据支持谨慎的多视角方法。QED-C 的 2026 年行业报告把 2025 年量子市场规模定为 $1.9B，同时显示生态仍然很小：556 家纯量子公司、16,482 名纯量子从业者、8,261
              个新增量子相关岗位。这是本章最保守的当前收入视角，因为它锚定行业普查，而不是长期供应商模型。相比之下，The Business Research Company 估计 2025 年市场为 $3.62B，并预测
              2030 年达到 $16.27B。ResearchAndMarkets 的公开摘要拉得更宽，把硬件、软件、云服务和行业应用都纳入 2026–2046 年维度。


              这些数字不能互换。QED-C 的数字更像实测当前市场；供应商报告更像品类扩张模型，纳入未来采用和更宽的范围定义。公共资金又是第四个视角：NIST 2026 年宣布约 $2.013B
              的意向书，说明公共部门投入生态的资本已经可以与实测当前市场规模相当。对 Quantinuum 来说，这一点重要，因为政府和公共实验室是少数愿意在广泛商业 ROI 被证明之前就为能力买单的买方。


              实务结论是，Quantinuum 近期 SAM 小于最乐观 TAM 标题暗示的规模。严谨模型应从今天实测的技术栈出发，只加入那些 Quantinuum 有直接工作负载匹配、且公开证据显示买方意图的垂直领域。
