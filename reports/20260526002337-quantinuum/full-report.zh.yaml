  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的风险栈由三项投资逻辑级暴露牵头：Honeywell 控制下的所有权与未解决的流动性路径、仍脆弱的量子市场中的商业化时点风险，以及把 Helios
              时代里程碑转化为可重复容错效用的技术挑战。公司资金充足、技术可信，但公开材料仍要求投资者承销未来里程碑——Apollo 规模的逻辑量子位进展、更广泛生产部署、成功 IPO
              流程——而不是收入持续性或独立治理的闭环。风险热力图把所有权 /
              流动性、商业化延迟、规模化执行放在最高严重度单元，因为即便科学继续进展，每一项都能快速重定价这家公司。出口管制、外资审查、供应商集中、关键人物依赖，是把一条有前景的路线图变成更慢、更贵、更缺流动性公司的主要传导路径。
