    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价现实
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的申报文件终于说明，公司不是纯软件业务。S-1 称收入来自三大类：专业量子计算硬件、带维护和支持的访问合同，以及围绕 Quantinuum
              系统联合开发算法的咨询工作。公开网页又把图景铺得更宽：Quantinuum Systems 直接订阅、Azure 订阅、云和 HaaS 交付、InQuanto 许可证、Nexus 平台访问，以及 Quantum
              Origin 安全软件。承销问题不在于是否存在变现面——显然存在——而在于公开证据几乎没有说明实际定价、折扣和收入流组合。


              唯一清晰的公开标价在 Azure Quantum 上：Quantinuum 的 Standard 和 Premium 方案每月分别为 $125,000 和 $175,000，另加基础设施成本，并有单独的按量付费
              HQC 公式。这说明企业访问可以开出六位数月度标价，但仍不能揭示实际 ASP、直销定价或合同层面折扣。与此同时，S-1 显示硬件交易会主导收入时点：2025 年收入受到一笔 $16.5M 销售型租赁拉动，2026
              年 Q1 收入在上一年一次性确认没有重演后大幅下滑。因此，公开收入模型真实存在，但在组合和变现质量上高度不透明。
