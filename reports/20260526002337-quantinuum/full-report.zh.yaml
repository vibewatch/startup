      - number: '1.2'
        title: 领导层、治理与 Honeywell 控制
        blocks:
          - type: paragraph
            body: >-
              领导层已经从创始人主导的整合，转向规模化执行。Raj Hazra 在 Micron 和 Intel 长期负责运营后，于 2023 年 2 月接任 CEO；这一步与 Quantinuum
              从合并后整合转向商业化同步。Cambridge Quantum 创始人 Ilyas Khan 并未离开：他继续担任董事，转任副董事长，并在 2026 年作为高管团队中的特殊项目负责人出现。2026 年 3
              月，Quantinuum 从 SoundHound AI 招来 Nitesh Sharan 担任 CFO；这次任命看起来既是补内部财务纪律，也是为资本市场做准备。


              Honeywell 仍实质性影响治理。公开材料列出 Honeywell CEO Vimal Kapur 担任董事长，Anne T. Madden、Niels Nielsen、Greg Lewis、George
              Sherman 和 Manish Bhatia 进入董事会。Honeywell 不只是投资人；2021 年成立公告还把 Honeywell 描述为供应商和客户，Reuters 在 2026 年 IPO 流程中仍称
              Honeywell 为多数股东。这个组合给投资人带来一体两面：一边是工业可信度、供应链支持和天然首批客户；另一边是控制权集中，而且关键人物风险仍真实存在——Hazra 是商业化和 IPO 执行的中心，Khan
              仍与产品身份和公司软件传承紧密绑定。IPO 生效前，公开材料仍未充分说明委员会构成、少数股东保护机制，或发行后控制权的精确分配。
