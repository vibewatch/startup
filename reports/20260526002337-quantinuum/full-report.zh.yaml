companyProfile:
  summary: >-
    Quantinuum 于 2021 年 11 月 30 日由 Honeywell Quantum Solutions 与 Cambridge Quantum
    合并而来，拼出一家全栈量子计算公司：离子阱硬件、中间件、化学与开发者软件、网络安全产品都在同一栈里。公司的主要行政办公室位于 Colorado 州 Broomfield，Cambridge 仍是其欧洲枢纽。Quantinuum
    现在通过直销和云渠道销售 H-Series 与 Helios 系统访问，并提供 TKET、InQuanto、Nexus、Quantum Origin 等产品。到 2026 年 IPO
