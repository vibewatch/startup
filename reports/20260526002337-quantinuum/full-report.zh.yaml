  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 反向证据 / 对手压力
      - 严重性
      - 什么会改变结论
    rows:
      - - 当前最好的囚禁离子企业包装
        - IonQ 现在已在直接云、多 SDK 支持和本地部署 Forte Enterprise 上重叠
        - 高
        - Quantinuum 需要更清楚的性能或商业证明，且能经得起与 IonQ 的直接比较
      - - 软件生态降低 Quantinuum 用户的锁定效应
        - 同样的开放性意味着 pytket、Qiskit、Cirq 以及 AWS/Azure 路径也会降低竞争对手的锁定效应
        - 中
        - 只有当 Quantinuum 把软件转化为独特的更好结果，而不只是兼容性，护城河才会改善
      - - 云和合作伙伴触达具有防御性
        - AWS Braket 已经聚合多种竞争模态；IBM 运营自己的成熟平台；Azure 不是独家分发
        - 高
        - 独家渠道不太可能出现，所以渠道优势必须来自更好的服务和企业采用
      - - 高保真度创造耐久硬件护城河
        - IEEE 和竞争对手路线图显示，该品类仍未形成共识，IBM、QuEra 和 PsiQuantum 正在推进不同扩展路径
        - 中
        - 如果 Quantinuum 持续把保真度转化为经过基准验证的逻辑量子比特和应用胜利，耐久性会上升
      - - 近期买方紧迫感利好 Quantinuum
        - D-Wave 和经典 HPC 现状路径今天就能解决部分优化任务，无需等待通用门模型成熟
        - 中
        - Quantinuum 需要拿出应用证明，显示通用门模型能在价值兑现速度上击败替代方案
      - - 路线图支持长期领导地位
        - Google、IBM、QuEra、IonQ 和 PsiQuantum 都在营销激进的未来状态叙事
        - 高
        - 只有当路线图转化为付费访问、稳定性能和可复现工作负载，它才具有防御性
      - - 企业级部署让 Quantinuum 差异化
        - OQC、Rigetti、IBM 和 D-Wave 都在营销云端加本地部署或托管部署模式
        - 中
        - 只有部署质量伴随可衡量的性能优势，Quantinuum 才能守住优势
      - - 市场热度本身帮助在位厂商
        - IEEE 对 2026 年的怀疑式框架表明，尚无厂商拥有广泛商业优势，这会压缩所有人的护城河主张
        - 高
        - 整个品类需要可复现的经济性胜利，任何护城河叙事才值得积极承销
    notes: 严重性是基于引用证据包的判断，不来自统计模型；各行聚焦 Quantinuum 当前优势最容易被商品化或架构替代挤压的位置。
