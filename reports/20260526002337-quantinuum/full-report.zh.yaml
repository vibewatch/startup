        - QuEra 和 D-Wave 更偏仿真 / 优化；IBM 和 Rigetti 更偏广泛门模型实验
        - Quantinuum 覆盖面广，但替代架构仍可能赢下更窄的高价值任务
    notes: 该矩阵总结的是公开证据中支撑最充分的部分，不包括隐藏客户条款或未公开基准数据；证据不足的单元格以定性方式表述，而不是猜测。
