      - number: '7.3'
        title: 技术与运营规模化风险
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 确有技术动能，但 Helios 与具商业决定性的 Apollo 之间的距离，仍是核心运营风险。公开发布和 Helios
              论文显示出强劲的离子阱性能、逻辑量子位进展，以及迈向更大系统的可信路径。但 Quantinuum
              和独立报道仍把当前一代定义为重要证明点，而不是完成的实用规模产品。路线图依赖逻辑量子位数量、错误抑制、实时解码和硬件可制造性的激进改进。这些里程碑并不孤立：Quantinuum 自身材料把未来进展绑定到
              NVIDIA 支持的经典协处理，以及包括 GlobalFoundries 和 Monarch Quantum
              在内的狭窄硬件供应链。只要其中任一环节滑坡——纠错、合作伙伴软件、光子学、组件良率或系统集成——公司仍可保住科学可信度，却错过估值和 IPO 叙事暗含的商业时间表。
