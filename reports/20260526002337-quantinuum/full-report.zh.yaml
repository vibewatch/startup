  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 模态
      - 商业触点
      - 规模信号
      - 目标买方
      - 战略角度 / 局限
    rows:
      - - Quantinuum
        - 囚禁离子
        - 直接订阅、Azure 分销、云端与本地部署 Helios / H-Series 访问
        - Helios 以 98 个物理量子比特、云端 + 本地部署访问，以及 BMW、JPMorganChase、SoftBank、Amgen 等企业客户背书对外营销
        - 化学、材料、网络安全、金融和先进研发领域的企业与研究买方
        - 目前最好地结合了囚禁离子性能和企业级包装，但公开标价仍不透明
      - - IBM Quantum
        - 超导
        - 通过 IBM Quantum Platform 提供开放、按量付费、Flex、Premium 和本地部署计划
        - 30+ 个 100 量子比特以上系统，2,300+ 个可用量子比特，97% 正常运行时间，3.9T+ 个电路
        - 希望使用成熟平台工具的研究人员、企业和 HPC 相关机构
        - 公开产品中采购准备度最高，但 Qiskit Runtime 会提高工作流粘性
      - - Google Quantum AI
        - 超导
        - 选择性 Willow 早期访问，加上 Cirq 软件和研究合作
        - 2026 年 Willow 访问仍未公开，仍需按提案筛选
        - 追求前沿实验的高端研究伙伴和机构
        - 长期生态威胁强，近期采购压力较弱
      - - IonQ
        - 囚禁离子
        - 直连云、兼容 AWS / Azure 的工作流，以及 Forte Enterprise 本地部署系统
        - 2026 路线图目标为 100-256+ 个物理量子比特和 12 个逻辑量子比特；2026 年 Q1 收入达到 $64.7M
        - 需要多种访问模式的囚禁离子系统的企业和政府
        - 与 Quantinuum 商业重叠最接近，尤其是在直接云访问和本地部署都重要的场景
      - - Rigetti
        - 超导
        - QCS 云、混合 API 和本地部署 Novera 采购
        - 2026 年 4 月部署 Cepheus-1 108Q；两套 Novera 订单合计约 $5.7M
        - 希望深度访问技术栈的 HPC 相关团队和量子工程团队
        - 相比头部保真度领先，更侧重开放性和混合延迟竞争
      - - IQM
        - 超导
        - 面向大学和 HPC 中心的本地部署系统，加上量子云访问
        - 官网对外展示 5、20、54 和 150 量子比特系统
        - 主权、学术和国家计算买方
        - 在主权 / HPC 采购上更强，在公有云心智上更弱
      - - QuEra
        - 中性原子
        - Amazon Braket 加高级直连访问
        - Aquila 提供 256 个量子比特和每周 100+ 小时云使用；路线图称已实现 256 个物理量子比特和 >10 个逻辑量子比特
        - 专注仿真、优化和 ML 探索的研究人员与企业
        - 中性原子提供了可信的替代路径，但商业实用性主张仍处早期
      - - Oxford Quantum Circuits
        - 超导
        - 云、主权托管和 API 嵌入
        - 官方信息强调当下可用的商业级系统，而不是公开量子比特数或收入披露
        - 金融、制药、国家安全和主权数据中心买方
        - 以部署地域和企业姿态竞争，但公开规模证据更薄
      - - PsiQuantum
        - 光子
        - 没有广泛公开云访问；建设实用规模系统和政府支持设施
        - 官方技术栈列出数千片晶圆、>1M 个已测试器件、300mm 晶圆，以及 Chicago / Australia 实用规模项目
        - 愿意为未来架构押注买单的政府和长周期战略买方
        - 如果制造路线假设能转化为可用系统，长期威胁可能很大，但近期商业访问缺位
      - - D-Wave / 优化替代方案
        - 超导退火 + 混合求解器
        - Leap 云端和本地部署 Advantage2 系统
        - 官方系统图显示 4,400+ 量子比特、20 路连接、Leap 99.9% 可用性，以及百万变量混合求解主张
        - 优化负载很重、现在就需要生产使用，而不是等待通用门模型路线图的企业
        - 对部分工作负载是真替代方案，虽然并非通用门模型的一一对应竞争者
      - - 自建 / 经典 HPC 现状路径
        - 经典模拟器、HPC 和有限试点访问
        - 内部研究团队、公开模拟器，以及偶发的厂商额度或基于提案的访问
        - 通常比押注单一未成熟硬件厂商更便宜，也更容易治理
        - 正在探索量子准备度、但短期不部署生产系统的企业
        - 仍是耐久的默认选项，因为许多厂商主张仍领先于广泛商业可用性
    notes: 各行聚焦 2026 年来源包中与 Quantinuum 相关的具名对手和实际替代方案；规模信号混合了官方硬件、云端和商业化披露，而不是采用单一归一化指标。
