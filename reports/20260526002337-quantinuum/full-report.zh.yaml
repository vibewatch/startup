        - from: prototype
          to: compliance
          label: 有希望的结果触发行业特定治理和出口检查
        - from: compliance
          to: benchmark
          label: 只有合规工作流才进入与经典基线的正式比较
        - from: benchmark
          to: funding
          label: 测得的优势或战略需求打开更大预算
        - from: funding
          to: deployment
          label: 规模化合同、多年项目或公共奖项
        - from: benchmark
