      - number: '7.4'
        title: 依赖、竞争与商业化风险
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的公开客户证明可信但偏窄。Helios 营销和合作伙伴公告反复回到同一批旗舰账户——BMW、JPMorganChase、Amgen、SoftBank、Microsoft、NVIDIA 和
              RIKEN——却没有公开收入集中度、续约或试点转生产数据。集中度风险重要，因为更广泛市场仍在判断哪些量子用例能承载持久预算。SoftBank
              自己的合作公告异常坦率：收入模式、定价逻辑、服务时点和具商业意义的用例仍在搭建中。与此同时，竞争在多种技术路线之间加剧，而不是收敛到单一赢家。Google 展示低于阈值的超导纠错，IBM
              扩大机群可用性和数据中心架构，IonQ 向生产环境推销离子阱系统，QuEra 则主张中性原子不靠低温也能更干净地扩展。因此，公开市场审视会从两侧打击
              Quantinuum：采用弱于预期会挑战整个板块；竞争对手里程碑更强，则会压窄投资者愿为 Quantinuum 领先地位支付的溢价。
