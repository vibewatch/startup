      - number: '4.5'
        title: 公开财务缺口与承销结论
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的公开披露足以证明业务真实存在，但还不足以让人舒服地按基本面承销。最强正面信号包括：变现面多元，蓝筹企业和政府关系存在，Azure 至少暴露一张公开价格卡，backlog / RPO 指标在
              Quantinuum 与 Honeywell 文件之间大致能对上，公司在 2025
              年重大融资后仍有大额现金余额。最强负面信号同样清楚：收入相对烧钱规模很小，季度业绩不平滑，客户集中度尖锐，外部观察者已经质疑拟议公开估值究竟锚定当前经济性，还是锚定一台尚未被证明的未来机器。


              因此，财务结论应保持谨慎。今天的收入质量更像混合而非强韧：一部分是硬件确认事件，一部分是云使用，一部分是研究 /
              支持服务，一部分是软件雄心，还有一部分仍未披露的专业服务。毛利路径看起来可行但未被证明，因为实际定价和收入流级成本结构都不公开。资本充足性可以支撑下一段执行，但更深层看仍依赖融资，因为公司烧钱速度要求它要么
              IPO 成功，要么经济性收紧，要么继续获得类似母公司的支持。本章的主要卡点是毛利率、定价兑现、收入流组合和 Honeywell 分离经济性。
