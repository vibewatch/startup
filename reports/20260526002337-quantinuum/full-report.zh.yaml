    insight: Quantinuum 的核心平台处在一张紧密依赖网的中心。Honeywell 锚定所有权，NVIDIA 和 Microsoft 支撑混合工作流主张，少数供应商决定规模化能力；公开验证再通过少数旗舰客户和主权项目回流到这张网。
    data:
      nodes:
        - id: dn1
          label: Quantinuum 核心平台
          type: core
        - id: dn2
          label: Honeywell
          type: ownership
        - id: dn3
          label: NVIDIA / CUDA-Q
          type: technology
        - id: dn4
          label: Microsoft / Azure
          type: technology
        - id: dn5
