chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、合并起源与产品栈
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 把自己定位为全栈量子计算公司，而不是单卖一颗处理器：离子阱硬件、中间件、开发者工具和应用软件都被装进同一产品体系。公司于 2021 年 11 月 30 日由 Honeywell
              Quantum Solutions 与 Cambridge Quantum 完成合并后成立。这个起点至今仍在塑造业务：Honeywell 带来离子阱硬件谱系，Cambridge Quantum
              带来软件、中间件和应用栈。公司的主要行政办公室位于 Colorado 州 Broomfield，公开材料也把英国 Cambridge 作为延续中的欧洲总部。到 2026 年，Quantinuum
              还公开列出其在美国、英国、德国、日本和新加坡的设施或运营。


              产品栈并不只是 H-Series 算力访问。Quantinuum Systems 把离子阱 QCCD 硬件、全连接和中途测量打包在一起；客户可以直接向 Quantinuum 获取硬件，也可以通过
              Microsoft Azure，或通过 RIKEN 这类本地部署使用。围绕硬件，Quantinuum 销售 Quantum Origin，用于基于软件的量子随机性和后量子安全；销售
              InQuanto，用于量子化学和材料模拟工作流；还销售 TKET、Guppy、lambeq 等开发者工具。这个一体化定位就是本报告后续的核心商业模型：在通用容错完全到来之前，Quantinuum
              试图先把纵向一体化的硬件加软件栈变现。
