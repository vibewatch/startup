      - number: '5.2'
        title: 离子阱架构与部署模型
        blocks:
          - type: paragraph
            body: >-
              硬件线条是连贯的，不是碎片化拼接。H1 是第一代系统：一台 20 量子比特的 171Yb+ 离子阱机器，采用单线性架构，配有五个并行门区、全连接、中途测量、条件逻辑和量子比特复用。H2
              保持相同的离子阱逻辑模型，但扩展到 56 个物理量子比特，并转向跑道式 QCCD 架构，包含两个相连线性区段和四个并行双量子比特区。Helios 再次沿用同一设计语言，推进到 98 个物理 137Ba+
              量子比特、八个门区、一个圆形存储环加线性门控区段，并加入实时算术和控制流特性，以支持重度纠错工作负载。


              同样重要的是，Quantinuum 不是把硬件作为裸金属商品端点暴露，而是通过托管访问层提供。Nexus 是公司的硬件和编译服务控制平面。Azure Quantum 以 Quantinuum
              为提供方，提供语法检查器、模拟器和 H2 QPU，OLCF 文档则给出从语法检查器到模拟器再到真实硬件的推荐工作流。Helios 增加了更企业化的部署姿态，因为 Quantinuum
              公开提供云和本地访问，并把硬件与 Guppy 和 GPU 联动控制绑定。架构故事因此不只是离子阱加激光，而是离子阱加托管控制平面、编译路径、验证端点和伙伴运营入口渠道。
