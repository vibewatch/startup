      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的 GTM 更像长周期企业销售、伙伴渠道和科学服务的混合体。S-1 把业务框定为硬件主导、软件增强，官网显示直接订阅、Azure 订阅、咨询服务、InQuanto
              伙伴驻场，以及多年期研究合作。公开牵引力代理指标存在，但不是常见 SaaS 效率指标。Quantinuum 披露 2025 年订单额（bookings）为 $79.3M，年末剩余履约义务约
              $80.7M；Honeywell 另行披露，归属于 Quantinuum 的积压订单（backlog）约 $81–82M。到 2026 年 3 月，Nexus 也拥有超过 150 家组织和 750 名活跃用户。


              这些指标方向上有用，但必须附带重大警示：公开客户集中度极高，生产规模转化仍不清楚。仅 RIKEN 就贡献了 2025 年收入的 60%，政府关联需求在 2026 年 Q1 占比更高。S-1
              明确警示，许多大型关系是试点、研究合作或拨款资助项目，而不是持久生产合同。BMW 和 RIKEN
              是可信标杆客户，也是商业相关性的有用证据，但还没有证明部署可以大规模重复。本章正确的销售效率解读是：Quantinuum 有强企业访问和技术可信度，但在可重复性、队列行为、CAC 或回本周期上的公开证据很差。
