  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从战略验证和板块情绪，到当前跟踪建议的决策链。
    data:
      nodes:
        - id: n1
          label: 战略财团
          description: 投资方包括 JPMorgan、Amgen、Mitsui、Quanta、NVentures、QED、Honeywell
        - id: n2
          label: 商业验证
          description: Helios 发布，加上 BMW、bp 和 Quantum Origin 的验证信号
        - id: n3
          label: 上市可比公司泡沫
          description: IonQ / D-Wave / Rigetti / QUBT 的收入倍数都很高
        - id: n4
          label: 披露缺口
          description: 尚未公开收入、利润率、清算优先权结构或 Honeywell 减持细节
        - id: n5
