        - id: compliance
          label: 合规与出口审查
          detail: 检查安全、数据主权、采购或视同出口约束
        - id: benchmark
          label: 基准测试和商业论证
          detail: 团队将量子辅助工作流与 HPC 或经典替代方案比较
