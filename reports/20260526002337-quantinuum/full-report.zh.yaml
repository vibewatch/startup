      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              Quantinuum
              的增长逻辑可信，但边界很紧。正面看，公司的离子阱架构提供全连接、中途操作等特性，这些特性与早期采用者最常提到的优化和仿真类别有关。云和混合编排进一步降低采购摩擦，因为买方无需自建基础设施即可实验。政府战略也是强顺风：在一般企业需求成熟之前，国家安全和产业政策参与者仍会继续资助生态。


              约束同样重要。QED-C
              仍预计首批有用应用将在约三到五年内出现，并称容错量子计算仍需多年。这一时间表使市场高度依赖工作负载选择。人才也是硬瓶颈：行业仍需要能打通物理、工程和软件的人，公开指引也明确指出对外国人才的依赖。出口管制和视同出口规则给跨境团队带来直接摩擦，可能放慢销售和研究合作。最后，受监管买方面临数据主权和国家安全规则带来的额外负担，尤其是在金融、制药、航空航天
              / 国防和公共部门项目中。


              实际上，采用不是一条简单线性的硬件曲线。它是闸门式过程：工作负载选择、云访问、出口管制审查和商业案例验证都必须通过，试点才会变成经常性支出。
