      - number: '7.2'
        title: 所有权、流动性与监管风险
        blocks:
          - type: paragraph
            body: >-
              Honeywell 仍位于 Quantinuum 治理和流动性故事的中心。公开申报公告显示，IPO 流程已推进到公开 S-1，但公司仍未披露股数、价格区间或最终时间，Honeywell
              也称发行取决于市场条件。这意味着，在公开市场正检验量子计算是否配得上后期高倍数溢价的时点，公司退出路径、自由流通深度和少数股东保护仍是开放问题。与此同时，出口管制风险已从抽象政策噪音变成现实运营约束。BIS
              如今在全球范围管制量子计算机、配套软件和技术；视同出口申报和未来可能的许可要求，会给量子公司依赖的国际人才池增加摩擦。法律分析还指向 CFIUS
              敏感度和合规复杂度上升，这意味着所有权、招聘、跨境协作可能一起收紧，而不是彼此独立。
