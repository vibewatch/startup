  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、技术模态与真实买方替代项
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的竞争版图比显而易见的离子阱对标更宽。直接模态对手包括离子阱领域的 IonQ，超导系统领域的 IBM、Google、Rigetti、IQM 和 Oxford Quantum
              Circuits，中性原子领域的 QuEra，以及光子领域的 PsiQuantum。D-Wave
              与其说是正面对抗的架构同行，不如说是买方替代项——这些买方真正要解决的是近期优化，而不是门模型容错。现状选项也依然强大：硬件市场仍不成熟时，许多企业完全可以理性地继续使用经典
              HPC、模拟器或内部探索团队。这很关键，因为 Quantinuum
              不是只靠强硬件就能赢。它必须同时打败三类替代：资金更足的通用硬件平台、更容易购买的替代方案，以及默认继续等待的选择。按今天的公开记录，Quantinuum
              在买方重视高保真离子阱性能和企业部署选项的场景最强；但市场仍足够开放，技术模态多样性本身就是竞争风险，而不是胜者已定的证据。
