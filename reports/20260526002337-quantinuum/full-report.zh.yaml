              Quantinuum 披露的客户基础，更适合理解为一组垂直行业参考账户，而不是已经规模化的席位型装机基础。买方、用户和付款方拆分会随细分市场变化。在金融领域，JPMorganChase 和 HSBC
              以创新或安全买方身份出现，研究和网络安全团队是直接用户。在制药和化学领域，Amgen、Chugai、Panasonic 和 JSR 以 R&D 用户身份测试量子增强发现或仿真工作流。在出行和材料领域，BMW 和
              Airbus 把 Quantinuum 用在围绕燃料电池和催化剂化学的高级研究项目中。在公共部门，新加坡的 NQO 和 NQCH 以及日本的 RIKEN 充当付款方或基础设施赞助方，研究人员则是直接用户。S-1
              又把图景拓宽，点名公司在制药、材料科学、金融服务、政府和工业市场有活跃客户合作。仍然缺的是分母：Quantinuum 没有披露总客户数、云客户与本地部署客户拆分，也没有说明多少 Q-Net 用户会转化为付费账户。
