      - number: '3.2'
        title: 产品范围、云访问、软件栈与公开打包
        blocks:
          - type: paragraph
            body: >-
              IBM 和 IonQ 是商业上最可比的基准，因为两者都暴露具体采购路径，而不只是研究雄心。IBM 发布按分钟计费的 open、pay-as-you-go、flex、premium 和 on-prem
              层级，并把它们与 Qiskit Runtime 和 Functions 绑定。IonQ 提供直接云访问、对所有主流 SDK 的支持，以及面向数据中心部署的 Forte Enterprise；其 2026
              年业绩公告也显示出实质商业牵引，而不只是技术进展。Google 不同：Cirq 是开源的，但 Willow 访问仍需提交提案，而且明确不公开，因此 Google
              眼下的威胁更多来自生态和人才引力，而不是采购规模。Rigetti 通过混合 HPC 集成和真实本地产品 Novera 竞争。IQM 更偏主权和 HPC 买方。QuEra 通过 AWS
              加高级直接访问打包中性原子替代方案，OQC 则强调主权托管和云部署。在这个组合中，Quantinuum 在部署广度和软件成熟度上表现不错，但没有 IBM 和 AWS Marketplace
