      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的市场与其说按公司规模分层，不如说按工作流和预算所有者分层。在制药、化工和材料领域，用户通常是计算化学家或研究科学家，付款方则在
              R&D、高级材料或创新预算中。在金融领域，用户是量化、研究或欺诈 / NLP
              团队；付款方是中央创新、安全或量化研究预算。在航空航天和国防领域，公开证据显示工程和高级计算团队围绕流体力学、导航或优化问题工作，付款权更可能落在长周期工程或公共项目预算，而不是主流 IT。


              政府和公共实验室构成独立分层，因为它们购买的是国家能力、开放访问测试床和人才培养，而不只是即时应用 ROI。网络安全是另一块不同市场：Quantum Origin
              卖的不是“全部网络安全”，而是一种窄口径的密码强度增强能力，买方是
              CISO、平台安全团队或公共密码学相关方。最后，开发者工具和云访问创造了软件主导的入口，工具链所有者或算法团队可以先成为初始买方，再释放更大的硬件或应用预算。


              这种分层很重要，因为 Quantinuum 的变现路径很可能是先落地、再扩张。早期买方通常从访问、实验和工作流验证开始，之后才升级到更大的化学、优化或安全部署。
