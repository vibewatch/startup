      - number: '2.5'
        title: 相互矛盾的估算与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场的主要尽调风险是虚假精确。公开估算差异很大，因为有些来源衡量当前已实现收入，另一些则建模未来技术栈，把基础设施、软件、云访问和长周期行业应用都纳入其中。因此，QED-C 的 2025 年 $1.9B
              市场规模，可以与 The Business Research Company 的 2025 年 $3.62B
              估计并存，也可以与其他供应商更宽的多十年市场叙事并存。应把这些保留为彼此矛盾的视角，而不是平均成一个人为合成的“共识 TAM”。


              Quantinuum 自身的不透明进一步放大问题。公司没有公开拆分硬件、Nexus、InQuanto 和 Quantum Origin
              的收入、订单、定价或产品组合贡献。公开合作伙伴公告证明金融、化学和材料工作流有兴趣，但不披露合同规模、续约行为，或研究试点转为规模化生产支出的转化情况。同样，公共部门承诺金额很大，但 Quantinuum
              相对同行能拿到的具体份额没有披露。


              因此，估值时正确姿态应是受证据约束。按当前实测需求、云访问采购和已有直接证据的垂直工作流来承销市场；其余都应视作上行情景，仍需证明算法准备度、人才供给、出口合规和预算转化。
