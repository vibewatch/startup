      - number: '4.4'
        title: 资本充足性、Honeywell 支持与融资依赖
        blocks:
          - type: paragraph
            body: >-
              披露的现金余额很大，但 Quantinuum 还不能自我供血。2026 年 3 月 31 日，公司现金及现金等价物为 $677.0M，此前 2025 年 9 月融资 $600M、投前估值
              $10B。这给公司带来有意义的近期灵活性，但同一份文件显示，业务仍在大量烧钱，并继续投入系统、设施和可分拆上市的公司基础设施。IPO 旨在再加一层融资，但截至本报告日期，S-1
              尚未设定价格或发行股数，投资人不能把它视作已经承诺的现金跑道。CHIPS R&D 意向书作为政策支持信号有帮助，但也不是已到账现金。


              Honeywell 仍是资本充足性的中心。Honeywell 文件继续把 Quantinuum 放在 Corporate and All Other 板块，披露 Quantinuum backlog，并把
              Quantinuum 收入描述为 Honeywell 持股多数的软硬件量子业务的一部分。Quantinuum 自己的文件称，Honeywell 已贡献基础设施、供应链关系、管理专长和早期客户需求，并打算在 IPO
              后继续作为战略客户和合作伙伴。这种支持降低执行风险，但也证明 Quantinuum
              尚未作为完全独立的商业实体运营。因此，资本充足性结论是有条件的：当前现金可以买时间，但未来独立性仍取决于另一场资本事件、更顺的商业化，或两者兼具。
