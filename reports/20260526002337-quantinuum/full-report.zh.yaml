      - number: '5.3'
        title: 软件栈、基准与路线图成熟度
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的软件层比简单 SDK 封装更深。TKET 是真实的编译器 / 运行时层，拥有公开 C++ 核心、Python 绑定、扩展包，以及活跃到 2026 年 5
              月的发布节奏。公开文档把它描述为构建-编译-运行技术栈，H1 和 H2 数据表也明确称 TKET 会在托管栈中优化提交电路。这里的开发者信号有意义：PyPI 显示 pytket 有跨平台打包，Pepy
              显示累计下载量达到数百万，说明 TKET 是组合中最成熟的公开软件面。


              基准阶梯也强于许多量子创业公司。H1 公开 20 个量子比特和 1×10^-3 的典型双量子比特不保真度；H2 公开 56 个量子比特、相同典型双量子比特不保真度区间，以及更大的跑道式 QCCD；Helios
              公开 98 个量子比特，并把典型双量子比特不保真度提升到 8×10^-4，同时加入实时控制特性。路线图成熟度也不只是未来承诺。Quantinuum 和 Microsoft 公开了 H2
              上的逻辑量子比特结果，Quantinuum 与 NVIDIA 现在也把 Helios 描述为 GPU 联动实时解码和混合量子-AI 工作流的起点。不过，路线图应被视为正在成熟，而不是已经完成：TKET
              已广泛公开，InQuanto 已产品化但许多收益指标来自公司主张，lambeq 活跃但小众，Helios 则仍是早期企业产品，而非已被广泛证明的公用服务。
