        title: 人员风险、缓释因素与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              自 2023 年以来，领导层厚度有所改善，但关键人物暴露仍然重要，因为 Quantinuum 的公开叙事依赖少数几个人，每个人都掌握一个关键接口。Raj Hazra 是规模化和公开市场门面，Ilyas Khan
              仍是与产品愿景绑定的创始运营者，法务 / 政府关系职能则把治理、出口管制、隐私和 IP 汇聚到一名高管之下。公司的主要缓释因素同样清晰：Honeywell
              支持、大型技术团队、锚定合作伙伴、政府参与，以及拥有运营经验的扩展高管班子。这些缓释因素足以支持持续关注，但不支持自满。投资者应监测 S-1 修订、Sol / Apollo
              里程碑节奏、出口管制变化、生产客户转化和高管团队连续性。仍需补齐的尽调包很直接：股权结构机制、客户经济性、出口许可历史和供应商集中度。在这些文件完成审阅前，剩余暴露仍足够高，应把 Quantinuum
