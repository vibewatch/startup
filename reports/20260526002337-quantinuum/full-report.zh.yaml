      - number: '1.4'
        title: 里程碑、合作伙伴与反向指向
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的里程碑记录在技术进展和蓝筹生态构建上最强。2021 年合并后，公司将 Quantum Origin 和 InQuanto 产品化，刷新 lambeq，并把 H-Series 硬件从早期商用
              H1 系统推进到 H2，再推进到 Helios。2024 年，公司推出 56 量子比特 H2-1 系统，宣布 2030 年 Apollo 路线图，并与 Microsoft 合作创建 12 个逻辑量子比特，同时把
              InQuanto 接入 Azure Quantum Elements。2025 年，公司加深了与 NVIDIA、JPMorganChase、Mitsui、Amgen、BMW、SoftBank
              和新加坡国家量子机构的生态关系，并在 2025 年 11 月商业发布 Helios，配备 98 个物理量子比特和 48 个逻辑量子比特。


              反向指向在于，商业化仍落后于技术进展。2026 年 IPO 文件公开说明，Quantinuum 仍是一家早期商业公司：收入不大、亏损很大，最激进的估值结果还依赖 Sol、Apollo
              等未来系统。独立分析也指向具体结构性风险：离子阱未必会成为胜出架构；收入集中在 RIKEN、政府关联账户等少数客户；同位素富集材料和氦等关键投入带来供应端脆弱性。换句话说，Quantinuum
              带着量子公司中少见的强技术可信度进入公开市场，但仍有前沿计算公司的经典风险：架构选择、客户集中度和变现时点。
