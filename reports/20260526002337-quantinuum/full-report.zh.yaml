        title: 集中度风险、采购摩擦与明确缺口
        blocks:
          - type: paragraph
            body: >-
              负面客户信号是集中度。Quantinuum 的 S-1 披露，一个客户贡献了 2025 年收入的 60%、2024 年收入的 63%；2026 年 3 月季度，一个客户贡献 47% 收入，而 2025 年 3
              月季度的 90% 收入来自另一个客户。同一文件还显示，美国政府贡献了 2025 年收入的 16%、2024 年收入的 9%、2026 年第一季度收入的
              24%。这不是广泛企业客户基础，而是少数大客户模式，并带有显著主权敞口。公司销售方式也暴露出采购摩擦。Helios 访问需要通过云端或本地销售联系人，Microsoft 商业化仍处在私有预览，QIDO
              在全面发布前经过 beta 测试，许多具名客户证明是共同开发或试点项目，而非按价目表部署。因此，公司商业前景可信，但运营上仍早期：垂直行业和地域证明可靠，公开材料却仍缺客户数量、最大客户身份、定价、ACV
              和留存统计。承销客户故事，必须同时接受集中度风险和企业或公共部门漫长转化周期。
