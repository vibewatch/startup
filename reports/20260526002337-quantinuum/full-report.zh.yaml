        title: 持续性代理指标与扩张路径
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 不披露 NRR、GRR、流失率或合同期限，持续性只能从重复行为推断。BMW 合作是最清晰的重复参与代理指标，因为合作始于 2021 年，并续签到覆盖多代硬件的多年路线图。RIKEN 从 H1
              升级到 H2 更强，因为这是可见的采购升级，不是新 logo。JPMorgan 也显得稳定：它在 S-1 中是客户和创新伙伴，出现在 Helios 早期访问中，后来又获得 Q-Net 采用奖。Honeywell
              是另一种有用代理指标，文件称其既是测试场，也是早期客户，并打算在 IPO 后继续作为战略客户。扩张路径可见，但由合作伙伴中介。Microsoft 通过 Azure Quantum Elements
              私有预览扩大触达，Mitsui 在日本分销 QIDO，Synopsys 把 Quantinuum 嵌入工业工程工作流，新加坡打造本地枢纽模式。这些路径能扩大采用，但也说明 Quantinuum
              仍依赖联合销售、生态项目和硬件路线图执行，而不是简单的自助式软件增长路径。
