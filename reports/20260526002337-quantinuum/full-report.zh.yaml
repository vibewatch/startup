  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 全栈产品组合与面向用户的模块
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 推向市场的不是单一离子阱盒子，而是一套分层产品组合。公开产品面把 H-Series 硬件、新旗舰 Helios、TKET 编译器栈、InQuanto 化学套件、Quantum Origin
              密码产品，以及用于量子自然语言处理工作的 lambeq 组合在一起。官网和开发者工具页面明确表示，公司希望买方按终端用户工作流思考，而不是只看量子比特数量：化学团队在 Quantinuum 系统上使用
              InQuanto，开发者使用 TKET 和 Guppy，安全团队使用 Quantum Origin，研究用户则可用 lambeq 这个相邻开源工具包实验。


              这种宽度具有战略意义。Quantinuum 至少可以通过四个不同入口把潜在客户带进技术栈：直接硬件访问、领域软件、开源开发者工具，或网络安全产品集成。InQuanto
              是最清晰的应用包，公开定位围绕分子与材料模拟、Quantinuum 系统访问和专家驻场支持。Quantum Origin 是一条可单独变现的安全产品线，围绕量子生成种子和 Bell-test
              支持的随机性增强，为现有产品服务。lambeq 更小、更偏研究，但它仍让 Quantinuum 拥有一个可见的开源 QNLP
              产品面，从而超出纯硬件。净效果是，公司把硬件、中间件、应用和网络安全产品放进了同一品牌栈。
