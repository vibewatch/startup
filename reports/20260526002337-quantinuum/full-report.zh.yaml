      - number: '4.3'
        title: 成本结构、毛利驱动因素与资本强度
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的成本结构足以显示强度，但还不够清晰，无法判断毛利质量。S-1 称收入成本包括运营和可靠性人员、客户支持、系统折旧、云和设施基础设施，以及第三方承包商。2025 年直接收入成本只有
              $4.73M，但摊销又增加 $11.36M，管理层没有发布能拆分硬件、云、软件和服务的毛利口径。真正的成本中心是研发：2025 年研发支出 $165.4M，而收入只有 $30.9M；销售和营销加 G&A
              又合计增加 $48.7M。


              资本强度也很明确。仅 2026 年 Q1，Quantinuum 就使用 $62.9M 经营现金和 $22.7M
              投资现金，资本开支与量子系统开发和租赁物业改良相关。连营运资本桥也显示公司依赖实体建设和关联方支持，包括向 Honeywell 预付款和进行中的租赁物业改良。因此，公开来源支持一个简单结论：Quantinuum
              目前正在为硬件、实验室、基础设施和人才承担重成本，且早于广泛商业规模。公司最终会变成软件占比更高，还是继续偏服务和硬件重型，仍是未解尽调问题，因为收入流级别的毛利没有公开。
