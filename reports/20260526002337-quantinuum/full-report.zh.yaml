        title: 建议、尽调请求与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              建议是观察，中等信心、高风险评级，估值立场为合理到偏高。相对意义上用“合理”没错，因为公开量子可比公司更贵；基本面意义上用“偏高”也没错，因为 Quantinuum 仍未披露能让投资者判断 $10 billion
              是便宜还是陷阱的运营数据。换句话说，公司质量可能好于公开同行，但价格纪律问题仍未解决。因此，本章不支持只因为板块火热就买入已知私募估值。从观察转向买入的关口很直接：S-1 必须披露真实收入和收入质量，2025
              年融资不能隐藏惩罚性优先条款，Honeywell 减持和锁定结构必须可投，Amgen、BMW、JPMorganChase、SoftBank 和 bp
              等头部用户必须对应可重复收入，而不能只是试点观感。任一测试失败，投资逻辑都会很快转向悲观情景。
            claimRefs:
              - CV034
              - CV035
              - CV039
              - CV041
              - CV045
              - CV046
          - type: table
            tableRef: TV006
            claimRefs:
              - CV007
              - CV034
              - CV035
              - CV041
              - CV046
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV004
              - CV009
              - CV011
              - CV033
              - CV034
              - CV045
      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: Quantinuum 的财团对后期深科技轮次来说异常战略化
            body: >-
              JPMorgan Chase、Amgen、Mitsui、Quanta Computer、NVentures、QED Investors 和 Honeywell 不是可互换的
              logo。它们共同释放出金融、医药、制造、AI 基础设施和亚太分销的潜在需求信号；与大多数上市量子同行相比，这是真实资产。
            calloutType: strength
            claimRefs:
              - CV005
              - CV036
              - CV037
          - type: callout
            title: 最大风险不只是技术，而是缺少财务披露的估值
            body: Quantinuum 可能是最强的私营量子故事，但投资者仍没有公开收入、利润率或股权结构条款。这意味着，相对上市同行，$10 billion 估值可能方向上合理，但实践中仍可能不是有吸引力的普通股入场价。
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV041
          - type: callout
            title: 等待 S-1，或要求更便宜的入场价
            body: 公司质量看起来可投；当前证据集尚未证明价格可投。最理性的动作是跟踪申报文件，测试经济性和抛压，再决定这家公司是否配得上相对仍然亢奋的公开量子集群的溢价。
            calloutType: recommendation
            claimRefs:
              - CV039
              - CV041
              - CV045
