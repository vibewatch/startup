  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 如果最重要的上行或下行投资测算假设发生变化，对名义 $10B 中点的方向性影响。
    data:
      items:
        - label: S-1 显示商业规模强劲
          value: 6
          description: 若有证据证明收入真实、利润率有支撑，中点可能约上调 $6B
        - label: Helios 用户转化为重复收入
          value: 3
          description: 客户验证变成变现验证，将增加数十亿美元估值支撑
        - label: 火热的量子 IPO 窗口延续
          value: 2
          description: 板块情绪可以暂时托住更高退出定价
        - label: Honeywell 悬顶或清算优先权结构不及预期
          value: -3
          description: 不友好的条款会直接压低普通股价值
        - label: 上市量子公司倍数大幅压缩
          value: -5
          description: 如果上市同行集体下调估值，Quantinuum 的相对价格支撑会迅速走弱
    approximationNotes: 条形表示相对 $10B 中点的大致方向性变化，单位为十亿美元；这些变化不可相加，应按单因素敏感性解读。
