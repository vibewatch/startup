  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 提供方 / 路径
      - 公开包装信号
      - 公开价格信号
      - 证据支持的注意点
      - 买方含义
    rows:
      - - Quantinuum 直接 / Azure
        - 订阅、赠款、Azure 访问和本地部署咨询
        - 引用页面未公开标价
        - 访问模式清楚，但企业买方仍需要销售流程确认确切经济性
        - 企业包装很强，公开采购透明度较弱
      - - IBM Quantum Platform 平台
        - 开放、按量付费、Flex、Premium 和本地部署
        - 免费开放层；PAYG $96/min；Flex 每年 400 min 起 $72/min；Premium 每年 5,200 min 起 $48/min；本地部署报价
        - IBM 定价按分钟而非结果计费，并假设使用 IBM 平台
        - 这一组里最透明的通用门模型方案
      - - Google Willow
        - 选择性早期访问研究计划
        - 无公开价格
        - 2026 年该计划基于提案，且不公开
        - 采购入口受限，商业压力因此延后
      - - IonQ 直接云
        - 按需或预留，加直接云控制台和企业工作流工具
        - 官方页面披露访问模式，但未披露标价
        - 经济透明度通过 AWS 市场价格提升，而不是来自直接页面费率
        - 即便直接标价不透明，包装宽度仍不错
      - - AWS Braket 上的 IonQ
        - 按任务、按 shot 或按小时预留
        - IonQ Forte 示例：$0.30/task 加 $0.08/shot；误差缓解至少需要 2,500 shots
        - 市场经济性可能让低规模实验变得昂贵
        - 是买方比较囚禁离子访问成本的有用基准
      - - Rigetti Novera
        - 可立即发货的本地部署 QPU，加合作伙伴生态
        - 商业产品已存在，但引用页面没有标价
        - 公开商业化信号强于公开单价
        - 即使云价格不易比较，也帮助 Rigetti 参与硬件采购竞争
      - - AWS Braket 上的 Rigetti
        - 按任务、按 shot 或预留使用
        - 定价示例：Rigetti Cepheus 上 $0.30/task 加 $0.000425/shot
        - 对云端实验来说，示例披露比总体系统经济性更清楚
        - 超导实验的每 shot 成本明显低于 AWS 上的囚禁离子示例
      - - AWS Braket 上的 QuEra
        - AWS 按需访问加高端直接访问
        - AWS 列出 QPU 的按任务 / 按 shot 定价结构，但买方支出仍高度取决于工作负载设计
        - 中性原子访问已经可用，但成本可比性取决于问题类别，而不是原始量子比特数量
        - 无需定制企业合同，QuEra 就能成为探索阶段的实际选项
      - - D-Wave Leap / Advantage2
        - 通过混合求解器提供即时云端和本地部署访问
        - 官方页面营销访问和试用，而不是在引用页面给出标准化公开按工作负载定价
        - 有用的生产姿态比通用门模型可比性更清楚
        - 买方看重即时优化结果而非通用性时，这是强替代方案
    notes: 定价证据混合了直接标价和市场示例。缺少准确价格时，本行记录包装路径，而不是杜撰实际单位经济性。
