      - number: '1.3'
        title: 资本结构、规模指标与商业成熟度
        blocks:
          - type: paragraph
            body: >-
              用户强调的两个价格点上，Quantinuum 已经具备可信的独角兽身份。2024 年 1 月融资规模 $300M，投前估值 $5B，由 JPMorgan Chase 领投，Mitsui、Amgen 和
              Honeywell 参与；按 Quantinuum 自身说法，这使成立以来累计融资达到约 $625M。2025 年 9 月 4 日，Honeywell 又宣布一笔标志性融资：约 $600M、投前估值
              $10B，Quanta Computer、NVentures 和 QED 加入，原有支持方包括 JPMorganChase、Mitsui、Amgen 和 Honeywell。随后 2026 年 5 月 S-1
              披露，Quantinuum 在 2025 年 11 月发行了 $838.8M 的 B 轮优先股，意味着 2025 年末融资实际扩张幅度明显超过 $600M 的公告口径。


              IPO 披露也首次给出较清晰的经济图景。Quantinuum 2025 年收入只有 $30.9M，净亏损 $192.6M；2024 年收入 $23.0M，净亏损 $144.1M。截至 2026 年 3 月 31
              日的季度，收入降至 $5.2M，亏损扩大到 $136.6M，但 2025 年融资后现金仍有 $677.0M。员工数从成立时接近 400 人，扩至 2024 年接近 500 人、2025 年末超过 630
              人、2026 年 3 月约 700 人。因此，人员、设施、系统和融资规模都是真实的；商业成熟度还不是同一量级。准确付费客户数仍未披露，S-1 显示收入明显集中在少数账户，这一点在接受 IPO
              式估值倍数前必须重点尽调。
