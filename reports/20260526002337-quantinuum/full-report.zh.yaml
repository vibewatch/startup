      - number: '3.3'
        title: 切换成本、多栖采购、分发权力与伙伴访问
        blocks:
          - type: paragraph
            body: >-
              反驳持久赢家通吃硬件护城河的最强证据，是访问层已经相当标准化。AWS Braket 让买方通过一个控制平面和一个计费界面对比 IonQ、IQM、QuEra 和 Rigetti；Quantinuum 自己也把
              Azure 访问与直接订阅、本地部署并列营销。IonQ 明确支持 Qiskit、Cirq、tket 和 Q#，Quantinuum 的 pytket
              也被设计成可以导入其他指令格式并跨目标编译。这意味着软件侧切换成本真实存在，但不是绝对壁垒。买方可以对冲、实验，并让团队保持生产力，而无需完全押注单一硬件供应商。剩下的锁定效应主要是硬件特异性的：连接性、噪声画像、模拟与门模型行为、预留经济性，以及某个工作流实际跑得最好的位置。实务上，这有利于当前性能更强或渠道位置更好的供应商。对
              Quantinuum 而言，护城河因此比“拥有整个栈”更窄，更接近“同类最佳离子阱性能，加上足够多部署选项，使买方多栖采购时仍把它留在短名单里”。
