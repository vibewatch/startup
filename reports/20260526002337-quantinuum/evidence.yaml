evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer count
    missingEvidence: >-
      Exact current paying-customer count, contract count, and ARR by cohort are not disclosed in retained public
      sources.
    whyItMatters: >-
      Without exact paying-customer count, it is hard to judge whether Quantinuum's blue-chip logos reflect broad
      commercial adoption or a small set of bespoke relationships.
    diligencePath: >-
      Ask management for active paying-customer count, pilot-to-production conversions, and top-10 customer revenue
      concentration by contract type.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: debt and credit structure
    missingEvidence: >-
      Retained public sources do not disclose whether Quantinuum currently has a revolving credit line, equipment
      financing package, or other material third-party debt beyond historical convertible instruments.
    whyItMatters: >-
      A dedicated debt facility, covenant package, or vendor financing structure would change the company's runway,
      capital-intensity profile, and downside risk under slower commercialization.
    diligencePath: >-
      Review full IPO exhibits, debt footnotes, and management treasury materials for any current credit agreements,
      liens, or off-balance-sheet financing obligations.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: post-ipo governance and control terms
    missingEvidence: >-
      Retained sources do not yet provide the final post-offering Honeywell voting/economic stake, committee
      composition, or minority-protection terms that will apply once the IPO is priced and effective.
    whyItMatters: >-
      The investment case depends heavily on how much control Honeywell preserves and whether new public shareholders
      receive meaningful governance protections in a still-controlled company.
    diligencePath: >-
      Read the final prospectus and governance exhibits after pricing, then review committee charters, shareholder
      agreements, and related-party agreements with Honeywell.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: quantinuum monetization by product line
    missingEvidence: Public revenue, bookings, pricing, and renewal data for H-Series access, Nexus, InQuanto, and Quantum Origin.
    whyItMatters: >-
      Without product-level monetization data, a bottom-up SAM/SOM model cannot distinguish research interest from
      durable revenue quality.
    diligencePath: >-
      Request product-line ACV, bookings mix, pilot-to-production conversion, and renewal rates from management or
      investor materials.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: missing-source
    severity: material
    topic: segment level spend available to quantinuum
    missingEvidence: >-
      Public segment-by-segment budgets showing how much pharma, finance, aerospace, public research, and security spend
      is quantum-specific and reachable by Quantinuum today.
    whyItMatters: >-
      The chapter can define the market boundary and verticals, but cannot build a defensible bottom-up SAM without
      segment budget data.
    diligencePath: >-
      Collect procurement, grant, and customer-budget evidence by vertical; map each to hardware access, software,
      chemistry, or security products.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
      - TM005
  - type: conflicting-data
    severity: material
    topic: market size definitions
    missingEvidence: >-
      Publisher-by-publisher normalization of what counts as current market revenue versus future TAM, public funding,
      and adjacent stack spend.
    whyItMatters: Forecasts differ sharply enough to change valuation narratives and implied market share by multiples.
    diligencePath: >-
      Create a normalized market-model bridge that separates current revenue, future forecast, and public-funding lenses
      before using any headline TAM.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM023
    relatedTableRefs:
      - TM002
      - TM006
  - type: private-evidence-only
    severity: material
    topic: public sector exposure and defense mix
    missingEvidence: Quantinuum-specific share of government awards, defense-related work, and public-research revenue by geography.
    whyItMatters: Government funding is a major market lens, but Quantinuum capture rate versus peers is not publicly observable.
    diligencePath: >-
      Request public-sector pipeline, awarded-contract backlog, and geography mix; cross-check against procurement
      databases where possible.
    relatedQuestionRefs:
      - QM025
  - type: access-blocked
    severity: minor
    topic: additional third-party corroboration
    missingEvidence: >-
      Full-text access to some analyst and company sources that were blocked or only partially available from the public
      web.
    whyItMatters: >-
      The chapter has enough evidence to bound the market, but blocked sources limit extra corroboration around
      sector-specific forecasts.
    diligencePath: Use paid analyst access or management-provided source packs to reconcile blocked market and end-user reports.
    relatedQuestionRefs:
      - QM010
      - QM023
  - type: missing-source
    severity: material
    topic: quantinuum-pricing-opacity
    missingEvidence: >-
      A public Quantinuum rate card or contract-level shot / reservation economics comparable to IBM or AWS Braket
      marketplace pricing.
    whyItMatters: >-
      Without public pricing, the chapter can compare access paths and relative transparency but not normalized
      cost-per-experiment or total cost of ownership.
    diligencePath: >-
      Request current commercial pricing from Quantinuum sales or a channel partner and normalize it against IBM and AWS
      Braket cost structures.
    relatedQuestionRefs:
      - QP003
      - QP019
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: cross-vendor-portability-benchmarks
    missingEvidence: >-
      A buyer-level benchmark showing the same workload ported across Quantinuum, IonQ, IBM, Rigetti, QuEra, and D-Wave
      with measured queueing, cost, and result quality.
    whyItMatters: >-
      The chapter can show that multi-homing exists, but not how much practical performance portability buyers really
      get after hardware-specific tuning.
    diligencePath: >-
      Run a controlled benchmark pack across the major access routes and capture both engineering effort and economic
      outcomes.
    relatedQuestionRefs:
      - QP018
      - QP020
  - type: private-evidence-only
    severity: material
    topic: future-displacement-proof
    missingEvidence: >-
      Comparable paid-customer, utilization, and application-level proof for IBM modular FTQC, QuEra logical-qubit
      systems, and PsiQuantum's utility-scale buildouts.
    whyItMatters: >-
      Long-term displacement threats are credible on roadmap quality and technical direction, but their timing and
      commercial conversion are still hard to underwrite.
    diligencePath: >-
      Collect customer references, utilization metrics, and milestone evidence as each rival moves from roadmap to
      repeatable commercial deployment.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: >-
      Gross margin by hardware, cloud, software, cybersecurity, and consulting stream; plus direct service-delivery cost
      by stream.
    whyItMatters: >-
      Without a stream-level margin view, investors cannot tell whether the business is scaling toward software
      economics or remaining trapped in hardware-service cost intensity.
    diligencePath: >-
      Request audited 2025 and Q1 2026 gross profit by product line, including direct labor, cloud, depreciation,
      contractor, and support allocations.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Board-approved operating plan, post-IPO cash budget, and management burn forecast showing when the current cash
      balance is expected to trough.
    whyItMatters: >-
      A disclosed cash balance is not the same as runway; the underwriting question is whether existing capital reaches
      the next technical and commercial milestone without another raise.
    diligencePath: >-
      Request the 2026-2028 budget, scenario sensitivity table, and explicit assumptions for IPO proceeds, hiring,
      capex, and Honeywell service charges.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized prices, discounts, minimum commitments, usage floors, overage terms, and renewal mechanics across direct
      subscriptions, Azure, hardware leases, InQuanto, Nexus, and Quantum Origin.
    whyItMatters: >-
      Public list pricing is only a weak signal; realized economics determine whether bookings can convert into durable
      high-margin revenue.
    diligencePath: >-
      Request representative customer contracts, redlined pricing schedules, and renewal/cohort data for direct and
      marketplace channels.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI002
      - TI006
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Reported revenue split among hardware delivery, cloud access, software, cybersecurity, consulting,
      government-funded projects, and partner channels.
    whyItMatters: >-
      Revenue quality cannot be judged from the top line alone when a one-off hardware lease and pilot projects can
      temporarily dominate reported sales.
    diligencePath: Request management revenue bridge for 2024, 2025, and Q1 2026 by stream, customer type, and recognition method.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI001
      - TI006
  - type: private-evidence-only
    severity: material
    topic: honeywell-transfer-pricing
    missingEvidence: >-
      Economic terms of the Honeywell strategic services and supply agreement, including transfer pricing, termination
      rights, and how costs change after IPO separation.
    whyItMatters: >-
      The Q1 2026 prepayment to Honeywell shows that related-party support is economically meaningful, but public
      disclosures do not show whether those costs rise or fall after separation.
    diligencePath: >-
      Request the strategic services and supply agreement, any transition-services schedules, and a standalone cost walk
      from current run-rate to post-IPO run-rate.
    relatedQuestionRefs:
      - QI019
      - QI025
    relatedTableRefs:
      - TI005
      - TI006
  - type: missing-source
    severity: material
    topic: service-levels
    missingEvidence: Historical uptime, queue-time, and SLA metrics for H2 and Helios across direct, Azure, and Nexus access paths.
    whyItMatters: >-
      Hardware availability and service guarantees matter more than raw fidelity once a buyer is underwriting production
      workflows.
    diligencePath: >-
      Request customer-facing status history, contractual SLA exhibits, and queue-performance reports from Quantinuum
      sales or support.
    relatedQuestionRefs:
      - QE021
  - type: private-evidence-only
    severity: material
    topic: helios-on-prem-operations
    missingEvidence: Facility, rack, power, cooling, networking, support, and maintenance requirements for Helios on-prem deployments.
    whyItMatters: >-
      On-prem claims change procurement and deployment economics, but underwriting is difficult without a concrete
      operating package.
    diligencePath: Obtain Helios on-prem installation guides, support scope, and reference architecture documents under NDA.
    relatedQuestionRefs:
      - QE022
  - type: missing-source
    severity: minor
    topic: helios-benchmarking
    missingEvidence: >-
      Independent benchmark or peer-reviewed validation of the Helios “world's most accurate” positioning beyond company
      or partner narratives.
    whyItMatters: >-
      Differentiation claims are stronger when the flagship accuracy statement is independently validated rather than
      only company-led.
    diligencePath: >-
      Look for peer-reviewed Helios benchmark papers, neutral lab evaluations, or third-party reproduction studies as
      they emerge.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Public SOC 2, ISO 27001, cryptographic audit, or trust-center artifacts covering Nexus, Helios operations, or
      Quantum Origin.
    whyItMatters: >-
      Enterprise buyers of cloud, on-prem, or security products often require formal compliance evidence in addition to
      technical descriptions.
    diligencePath: Request audit letters, certification scope documents, or trust-portal access from Quantinuum during diligence.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: customer-count-disclosure
    missingEvidence: Total paying customer count by product, geography, and public-sector versus enterprise category.
    whyItMatters: >-
      The chapter can show named proof, but without a denominator it cannot judge breadth, win rate, or concentration
      properly.
    diligencePath: >-
      Request a customer-count bridge that splits cloud, on-prem, affiliate, public-sector, and channel-mediated
      accounts.
    relatedQuestionRefs:
      - QU015
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal-rate, and average contract-length disclosures by product or cohort.
    whyItMatters: >-
      Durability is currently inferred from renewals and upgrades rather than measured directly, which weakens
