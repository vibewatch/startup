  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer count
    missingEvidence: Exact current paying-customer count, contract count, and ARR by cohort are not disclosed in retained public sources.
    whyItMatters: Without exact paying-customer count, it is hard to judge whether Quantinuum's blue-chip logos reflect broad commercial adoption or a small set of bespoke relationships.
    diligencePath: Ask management for active paying-customer count, pilot-to-production conversions, and top-10 customer revenue concentration by contract type.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: debt and credit structure
    missingEvidence: Retained public sources do not disclose whether Quantinuum currently has a revolving credit line, equipment financing package, or other material third-party debt beyond historical convertible instruments.
    whyItMatters: A dedicated debt facility, covenant package, or vendor financing structure would change the company's runway, capital-intensity profile, and downside risk under slower commercialization.
    diligencePath: Review full IPO exhibits, debt footnotes, and management treasury materials for any current credit agreements, liens, or off-balance-sheet financing obligations.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: post-ipo governance and control terms
    missingEvidence: Retained sources do not yet provide the final post-offering Honeywell voting/economic stake, committee composition, or minority-protection terms that will apply once the IPO is priced and effective.
    whyItMatters: The investment case depends heavily on how much control Honeywell preserves and whether new public shareholders receive meaningful governance protections in a still-controlled company.
    diligencePath: Read the final prospectus and governance exhibits after pricing, then review committee charters, shareholder agreements, and related-party agreements with Honeywell.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
