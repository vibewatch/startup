- id: TR006
  title: Mitigation and thesis-break triggers
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Honeywell control and liquidity overhang
    - S-1 amendments and post-listing governance
    - Small float, super-voting controls, or no clear Honeywell sell-down path
    - Treat the company as sponsor-controlled and apply a liquidity discount until control terms normalize.
  - - Roadmap slippage
    - Sol / Apollo milestone cadence
    - System slip of more than 12 months or repeated downward revisions to logical-qubit targets
    - Re-underwrite valuation on a slower commercialization curve and lower strategic scarcity premium.
  - - Commercialization delay
    - Production deployments and repeatable paid use cases
    - No broadening beyond the same flagship accounts by 2027
    - Assume the business remains research-led and cap revenue expectations materially.
  - - Regulatory tightening
    - BIS / CFIUS / allied-control updates
    - New licensing requirements that constrain hiring, foreign collaboration, or investor participation
    - Raise regulatory discount rate and re-evaluate global go-to-market assumptions.
  - - Supplier concentration
    - Component yields and alternate-source qualification
    - Any single-source delay that pushes a major system milestone
    - Move from timeline risk to execution red flag and defer new capital until contingency plans are proven.
  - - Key-person loss
    - Executive continuity
    - Unexpected exit of Hazra, Khan, or the legal/government-relations lead without clear replacement
    - Escalate to thesis-break review because roadmap, governance, and market credibility would all take an immediate hit.
  notes: Triggers are designed to be monitorable from filings, partner announcements, milestone releases, and diligence materials rather than
    subjective narrative shifts.
