  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register-public-coverage
    missingEvidence: Publicly citable documentation for any additional material proceedings, privacy incidents, export-license events, or jurisdiction-specific legal issues needed to complete TR002 beyond the currently visible rows.
    whyItMatters: The regulatory/legal register is intentionally partial because public evidence does not clear the full universe of legal and regulatory events that could re-rank severity.
    diligencePath: Request a litigation and regulatory-matters schedule, incident log, and outside-counsel summary, then expand TR002 with any material items missing from the public record.
    relatedQuestionRefs:
    - QR010
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: legal-docket
    missingEvidence: A litigation, threatened-claims, and IP-dispute schedule covering Quantinuum, Honeywell Quantum Solutions, and Cambridge
      Quantum, plus related insurance disclosures.
    whyItMatters: The public corpus establishes legal-compliance burden but does not reliably clear litigation or patent-risk exposure, leaving
      downside tail risk underexplored.
    diligencePath: Request board materials, outside-counsel litigation summaries, patent-assertion correspondence, and warranty/indemnity schedules
      from the data room.
    relatedQuestionRefs:
    - QR010
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named top-customer revenue mix, contract duration, pilot-to-production conversion rates, renewal history, and backlog by
      use case.
    whyItMatters: Public logo proof is concentrated, but the economic importance of each customer and the durability of those relationships are
      not disclosed.
    diligencePath: Request top-10 customer revenue bridge, pipeline conversion funnel, churn/renewal data, and references from BMW, JPMorgan,
      Amgen, SoftBank, and RIKEN.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: ownership-liquidity
    missingEvidence: Draft S-1 cap table, voting-control provisions, Honeywell sale restrictions, lock-up terms, and any shareholder agreement
      governing post-IPO control.
    whyItMatters: Exit timing, minority protections, and free-float depth determine whether the Honeywell-controlled structure becomes a manageable
      sponsor overhang or a hard liquidity constraint.
    diligencePath: Review the confidential data-room version of the S-1, shareholder agreements, and board approvals governing any secondary sales
      or staged Honeywell sell-down.
    relatedQuestionRefs:
    - QR003
  - type: private-evidence-only
    severity: material
    topic: export-compliance
    missingEvidence: Employee nationality mix in controlled roles, license applications or denials, restricted-jurisdiction revenue, and export-control
      remediation history.
    whyItMatters: The public materials show the rule set and governance owner, but not whether compliance friction is already slowing hiring,
      collaboration, or sales.
    diligencePath: Request export-control audits, BIS correspondence, training logs, restricted-party screening policies, and any internal country-access
      matrix for engineering and sales.
    relatedQuestionRefs:
    - QR007
    - QR008
  - type: private-evidence-only
    severity: material
    topic: supplier-concentration
    missingEvidence: Vendor concentration by spend, component yield data, alternate qualified suppliers, inventory buffers, and failure-recovery
      plans for trapped-ion hardware components.
    whyItMatters: The CHIPS announcement proves a narrow supply chain exists, but not whether Quantinuum has enough redundancy to absorb component
      delays or qualification failures.
    diligencePath: Request bill-of-material concentration analysis, supply agreements with GlobalFoundries and Monarch Quantum, and internal contingency
      planning for single-source components.
    relatedQuestionRefs:
    - QR015
