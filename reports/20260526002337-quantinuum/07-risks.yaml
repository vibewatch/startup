- id: people-mitigations-and-triggers
  title: People Risk, Mitigations, and Thesis-Break Triggers
  body: 'Leadership depth has improved since 2023, but key-person exposure is still material because Quantinuum''s public narrative depends on
    a small group of people who each own a critical interface. Raj Hazra is the scaling and public-markets face, Ilyas Khan remains the founder-operator
    tied to product vision, and the legal/government-relations function aggregates governance, export control, privacy, and IP under one executive.
    The company''s main mitigants are equally clear: Honeywell sponsorship, a large technical team, anchor partnerships, government engagement,
    and an expanded executive bench with operating experience. Those mitigants justify continued attention, not complacency. Investors should
    monitor S-1 amendments, Sol/Apollo milestone cadence, export-control changes, production customer conversion, and senior-team continuity.
    The diligence package still needed is straightforward: cap-table mechanics, customer economics, export-license history, and vendor concentration.
    Until those files are reviewed, the residual exposure remains high enough to treat Quantinuum as a milestone-driven investment rather than
    a de-risked infrastructure platform.'
