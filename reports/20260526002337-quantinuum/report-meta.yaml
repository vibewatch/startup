companyProfile:
  summary: >-
    Quantinuum was formed on November 30, 2021 through the merger of Honeywell Quantum Solutions and Cambridge
    Quantum, creating a full-stack quantum computing company that combines trapped-ion hardware, middleware,
    chemistry and developer software, and cybersecurity products. The company’s principal executive offices are in
    Broomfield, Colorado, while Cambridge remains its European hub. Quantinuum now sells access to H-Series and
    Helios systems directly and through cloud channels, alongside products such as TKET, InQuanto, Nexus, and
    Quantum Origin. By the 2026 IPO filing, it had become a real but still early commercial business with $30.9M
    of 2025 revenue, a large cash balance, and strong blue-chip partners, but also large losses and continued
    dependence on Honeywell governance and future technical milestones.
  foundedDate: '2021-11-30'
  founders:
    - name: Ilyas Khan
      role: Founding CEO
      background: Founded Cambridge Quantum in 2014 and led Quantinuum at formation before moving to vice chairman and head of special projects.
      claimRefs: [CO015]
  foundingLocation: Cambridge, UK / Broomfield, Colorado, USA
  headquarters: Cambridge, UK / Broomfield, Colorado, USA
  productSummary: >-
    Quantinuum sells trapped-ion quantum computing access through H-Series systems and the Helios platform, plus
    software and workflow products including TKET, InQuanto, Nexus, Quantum Origin, Guppy, and lambeq.
  customerFocus: >-
    Large enterprises, national labs, and public-sector or strategic users in finance, pharma, automotive,
    chemicals, cybersecurity, and advanced research environments.
  businessModel: >-
    Monetization combines system subscriptions and cloud access, direct HaaS-style compute contracts, software and
    cybersecurity licenses, and consulting or co-development engagements tied to quantum workflows.
  stage: pre-IPO private
  fundingStatus: >-
    Quantinuum closed a $300M round at a $5B pre-money valuation in January 2024, then announced an approximately
    $600M round at a $10B pre-money valuation in September 2025. Its May 2026 S-1 also disclosed $838.8M of Series
    B preferred stock issued in November 2025, implying at least about $1.14B of post-merger external capital.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO005, CO007, CO020, CO023, CO025, CO027, CO029, CO033, CO041, CO046]
summary:
  headline: >-
    Quantinuum is one of the strongest pre-IPO quantum platforms, but a $10B valuation on only $30.9M of 2025
    revenue, a $192.6M net loss, and unresolved Honeywell control terms keeps the name in track territory rather
    than buy territory.
