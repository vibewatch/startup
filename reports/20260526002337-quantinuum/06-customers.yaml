- id: named-customer-proof
  title: Named Customer Proof and Production Versus Pilot Evidence
  body: 'Named proof quality is above average for quantum computing because several cases include customer-side statements and specific workloads rather than logo slides. JPMorganChase is the cleanest finance proof: the bank co-authored and separately described a certified-randomness workflow on Quantinuum’s H2 system, and Quantinuum later recognized JPMorgan as a Guppy adopter in research workflows. BMW is the strongest industrial durability case: public materials show a collaboration running since 2021, a 2023 BMW, Airbus, and Quantinuum oxygen-reduction workflow, and a 2026 multi-year extension that explicitly covers Helios, Sol, and Apollo. HSBC provides near-term security proof via a tokenized-gold pilot using Quantum Origin QRNG, but public evidence still frames it as a pilot. Amgen is clearly a named life-sciences collaborator, yet the public record stops short of production economics or scaled workflow metrics. RIKEN is the strongest public-sector deployment proof because it actually procured an H2 upgrade after using H1. QIDO beta testimonials from JSR, Panasonic, and Chugai add useful proof in Japan, but they underline that many customer relationships remain early validation rather than scaled production.'
