- id: adoption-trajectory
  title: Adoption Trajectory, Access Model, and Community Breadth
  body: 'Public adoption follows a recognizable sequence. Quantinuum first lands research or innovation relationships, then lets counterparties work through cloud access, beta programs, or national-hub infrastructure, and only afterwards tries to convert them into deeper deployments or repeat procurement. The 2023 BMW and Airbus materials workflow and the 2024 Microsoft logical-qubit milestone established technical credibility. In 2024 and 2025, HSBC’s tokenized-gold pilot, QIDO beta testing, and JPMorgan’s certified-randomness collaboration showed that end users were engaging with concrete workloads. Helios then moved the story forward in late 2025, with Quantinuum publicly naming Amgen, BMW, JPMorganChase, and SoftBank as early users or collaborators and noting a two-month early-access program for SoftBank and JPMorgan before general availability. The top of funnel is broader than the named-customer list suggests: Quantinuum says Q-Net has 2,500+ active Nexus users and Q-Net Connect 2026 drew 170+ attendees. Those metrics measure ecosystem activity, not paid customers or utilization, so they should be treated as adoption-signal breadth rather than revenue depth.'
