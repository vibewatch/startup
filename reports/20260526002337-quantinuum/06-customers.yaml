- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration / friction
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - Hardware roadmap upsell
    - BMW explicitly expands from Helios to Sol and Apollo generations
    - High expansion potential within lighthouse accounts
    - BMW multi-year deal
    - Request account-level spending commitments by hardware generation
  - - Repeat public-sector procurement
    - RIKEN moved from H1 to H2 and Singapore is building in-country Helios access
    - Public-sector buyers can anchor large deployments
    - RIKEN and Singapore announcements
    - Clarify what portion of future revenue could come from sovereign buyers
  - - Revenue concentration
    - One customer was 60% of 2025 revenue and 63% of 2024 revenue
    - Single-account loss would heavily affect results
    - S-1 customer concentration footnotes
    - Request top-5 customer mix and trend direction
  - - Quarterly volatility
    - A different customer reached 90% of Q1 2025 revenue and one customer was 47% of Q1 2026 revenue
    - Results can swing materially with a handful of accounts
    - S-1 quarterly concentration disclosure
    - Obtain quarter-by-quarter concentration bridge
  - - Government dependence
    - U.S. Government represented 24% of Q1 2026 revenue and 16% of 2025 revenue
    - Public procurement timing can materially swing revenue
    - S-1 disclosures
    - Separate grant, contract, and commercial enterprise revenue
  - - Pilot-to-production conversion
    - HSBC pilot and QIDO beta show early traction but not scaled rollout
    - Risk of long conversion cycles
    - HSBC and QIDO announcements
    - Request pipeline-stage counts and conversion rates by vertical
  - - Opaque pricing / identity
    - Top-customer identities, contract lengths, and price cards are undisclosed
    - Hard to underwrite durability and ACV
    - Lack of disclosure across filing and company materials
    - Obtain master-service terms, contract lengths, and concentration-account names under NDA
  notes: Expansion opportunities are visible, but concentration and disclosure gaps dominate underwriting risk because the public record lacks the denominator needed to judge breadth or retention.
