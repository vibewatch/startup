- id: durability-and-expansion
  title: Durability Proxies and Expansion Paths
  body: 'Because Quantinuum does not disclose NRR, GRR, churn, or contract length, durability has to be inferred from repeat behavior. BMW’s collaboration is the clearest repeat-engagement proxy because it began in 2021 and was renewed into a multi-year roadmap spanning multiple hardware generations. RIKEN’s move from H1 to H2 is even stronger because it is a visible procurement upgrade rather than a fresh logo. JPMorgan also looks durable: it appears in the S-1 as a customer and innovation partner, shows up in Helios early access, and later receives a Q-Net adoption award. Honeywell is a different but relevant proxy because the filing says it was both a testing ground and an early customer and intends to remain a strategic customer after the IPO. Expansion paths are visible but partner-mediated. Microsoft extends reach through Azure Quantum Elements private preview, Mitsui distributes QIDO in Japan, Synopsys embeds Quantinuum into industrial engineering workflows, and Singapore creates an in-country hub model. Those routes can widen adoption, but they also show Quantinuum still depends on co-selling, ecosystem programs, and hardware-roadmap execution rather than a simple self-serve software motion.'
