- id: TU006
  title: Partner / Channel Dependence and Procurement Friction Table
  columns:
  - Route to market / dependency
  - What it enables
  - Dependency risk
  - Customer implication
  - Diligence ask
  rows:
  - - Direct enterprise sales
    - Helios cloud and on-prem access through contact-led sales
    - High-touch onboarding and custom contracting
    - Slower procurement and no public self-serve motion
    - Ask for average sales cycle and minimum ACV
  - - Q-Net / ecosystem programs
    - Community, trainings, and startup partner program
    - Community scale may not translate into paid expansion
    - Useful top-of-funnel education, limited visibility on monetization
    - Request conversion from Q-Net and startup partners to contracts
  - - Microsoft / Azure Quantum Elements
    - Private-preview chemistry and logical-qubit ecosystem
    - Quantinuum depends on partner roadmap and preview-to-GA conversion
    - Can widen reach to enterprise and HPC buyers
    - Ask what share of leads or revenue come through Microsoft
  - - Mitsui / QIDO distribution
    - Exclusive distribution in Japan plus beta co-creation with industrial users
    - Distributor economics and customer ownership are undisclosed
    - Can accelerate local access in chemistry and pharma
    - Request distributor margins and direct-versus-channel pipeline split
  - - National-hub sponsorship
    - Singapore and RIKEN create infrastructure-led adoption
    - Budget cycles and political priorities can reshape demand
    - Large reference accounts may come with long procurement cycles
    - Request signed terms, renewal options, and local-user uptake
  notes: This table captures route-to-market structure rather than customer logos. Several expansion routes are partner-mediated and therefore add execution dependencies alongside reach.
