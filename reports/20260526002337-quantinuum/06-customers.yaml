chapter:
  number: 6
  title: Customers
  summary: Quantinuum has unusually good named reference accounts for a quantum company across finance, pharma, mobility, and public-sector research, but most public proof still reflects co-development, pilots, early access, or research deployments rather than a broad production customer base. The clearest durability proxies are BMW’s multi-year renewal, RIKEN’s H1-to-H2 upgrade, and repeated JPMorgan engagement, while the S-1 shows heavy customer concentration and no disclosure of customer count or retention metrics.
sections:
- id: customer-segmentation
  title: Customer Segmentation by Vertical, Buyer, and Geography
  body: 'Quantinuum’s disclosed customer base is best read as a set of vertical-specific reference accounts rather than a scaled seat-based install base. The buyer, user, and payer split changes by segment. In finance, JPMorganChase and HSBC appear as innovation or security buyers, with research and cyber teams as direct users. In pharma and chemistry, Amgen, Chugai, Panasonic, and JSR appear as R&D users testing quantum-enhanced discovery or simulation workflows. In mobility and materials, BMW and Airbus use Quantinuum inside advanced-research programs around fuel cells and catalyst chemistry. In the public sector, Singapore’s NQO and NQCH and Japan’s RIKEN act as payer or infrastructure sponsors while researchers are the direct users. The S-1 broadens that picture by naming active customer engagements across pharmaceuticals, materials science, financial services, government, and industrial markets. What is still missing is a denominator: Quantinuum discloses no total customer count, no split between cloud versus on-prem customers, and no breakdown of how many Q-Net users convert into paying accounts.'
