  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-disclosure
    missingEvidence: Total paying customer count by product, geography, and public-sector versus enterprise category.
    whyItMatters: The chapter can show named proof, but without a denominator it cannot judge breadth, win rate, or concentration properly.
    diligencePath: Request a customer-count bridge that splits cloud, on-prem, affiliate, public-sector, and channel-mediated accounts.
    relatedQuestionRefs:
    - QU015
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal-rate, and average contract-length disclosures by product or cohort.
    whyItMatters: Durability is currently inferred from renewals and upgrades rather than measured directly, which weakens underwriting confidence.
    diligencePath: Ask management for cohort retention tables and renewal data for hardware, Quantum Origin, and application-layer products.
    relatedQuestionRefs:
    - QU016
    - QU017
  - type: private-evidence-only
    severity: material
    topic: top-customer-identity-and-acv
    missingEvidence: Identity of revenue-concentrated customers, their contract lengths, ACVs, and whether they are commercial, affiliate, or sovereign accounts.
    whyItMatters: Concentration is clearly high, but public filings do not reveal which relationships drive that risk or how durable they are.
    diligencePath: Obtain top-5 customer mix, revenue share, contract structure, and renewal timeline under NDA.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU024
    - QU025
  - type: missing-source
    severity: material
    topic: pilot-to-production-conversion
    missingEvidence: Pilot-to-production conversion rates, utilization metrics, and stage counts for enterprise and public-sector opportunities.
    whyItMatters: Many named proofs are pilots, beta tests, or co-development programs, so conversion data is needed to separate curiosity from durable demand.
    diligencePath: Request pipeline-stage counts and conversion benchmarks by vertical, especially finance, pharma, and public-sector programs.
    relatedQuestionRefs:
    - QU013
    - QU022
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-coverage
    missingEvidence: A complete list of revenue-contributing or strategically important customers beyond the publicly named counterparties.
    whyItMatters: The named proof table is necessarily partial because the filing provides aggregate customer concentration without naming all underlying accounts.
    diligencePath: Ask management for a fuller customer roster with flags for public, confidential, affiliate, and government accounts.
    relatedQuestionRefs:
    - QU023
    - QU024
    relatedTableRefs:
    - TU003
