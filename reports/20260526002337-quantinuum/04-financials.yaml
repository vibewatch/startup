    - ~700 employees, including ~410 hardware experts and ~105 software experts
    - Cost-to-revenue efficiency proxy
    - Large technical base suggests high fixed cost and long sales-support cycles
    - Provide revenue per employee, services utilization, and expected operating leverage
  notes: These are proxy indicators, not standardized SaaS efficiency metrics. Public evidence is strongest on demand visibility and customer logos, weakest on payback, quota productivity, and renewal behavior.
