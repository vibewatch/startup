- id: TI003
  title: GTM / sales-efficiency proxy table
  columns:
  - Proxy metric
  - Public value / status
  - Why it matters
  - Read-through
  - Diligence ask
  rows:
  - - 2025 bookings
    - 79.3m USD
    - Best disclosed demand signal beyond recognized revenue
    - Shows customer contracting activity exceeded 2025 revenue, but booking-to-revenue conversion is opaque
    - Provide bookings bridge to recognized revenue and cancellations/modifications
  - - Remaining performance obligations
    - 80.7m USD at FY2025, 31% due within 12 months
    - Forward revenue visibility proxy
    - Provides some contracted visibility, but timing still depends on delivery and milestone completion
    - Provide RPO by stream, customer type, and expected gross margin
  - - Honeywell-reported backlog
    - ~82m USD at FY2025; ~81m USD at Q1 2026 in Corporate and All Other
    - Cross-check on order visibility
    - Backlog broadly corroborates the S-1 RPO figure
    - Explain any differences between backlog, bookings, and RPO definitions
  - - Nexus adoption
    - 150+ user organizations and 750+ active users by March 2026
    - Software funnel proxy
    - Good developer/enterprise engagement signal, but monetization per user is unknown
    - Provide paid vs unpaid orgs, active paid users, and usage intensity
  - - Customer concentration
    - RIKEN 60% of 2025 revenue; government-linked entities dominated Q1 2026
    - Revenue-quality and sales-efficiency warning
    - Commercial traction is concentrated rather than broad-based
    - Provide top-10 customer mix, renewal rates, and concentration trend over time
  - - Named enterprise engagements
    - BMW multi-year collaboration; RIKEN on-prem deployment; Honeywell, JPMorgan, Amgen, Mitsui active engagements
    - Proof of enterprise access and long sales cycles
    - Excellent logos, but mostly collaboration signals rather than disclosed production contracts
    - Provide which engagements are paid pilots, production use, or grant-funded work
