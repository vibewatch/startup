  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by hardware, cloud, software, cybersecurity, and consulting stream; plus direct service-delivery cost by stream.
    whyItMatters: Without a stream-level margin view, investors cannot tell whether the business is scaling toward software economics or remaining trapped in hardware-service cost intensity.
    diligencePath: Request audited 2025 and Q1 2026 gross profit by product line, including direct labor, cloud, depreciation, contractor, and support allocations.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Board-approved operating plan, post-IPO cash budget, and management burn forecast showing when the current cash balance is expected to trough.
    whyItMatters: A disclosed cash balance is not the same as runway; the underwriting question is whether existing capital reaches the next technical and commercial milestone without another raise.
    diligencePath: Request the 2026-2028 budget, scenario sensitivity table, and explicit assumptions for IPO proceeds, hiring, capex, and Honeywell service charges.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized prices, discounts, minimum commitments, usage floors, overage terms, and renewal mechanics across direct subscriptions, Azure, hardware leases, InQuanto, Nexus, and Quantum Origin.
    whyItMatters: Public list pricing is only a weak signal; realized economics determine whether bookings can convert into durable high-margin revenue.
    diligencePath: Request representative customer contracts, redlined pricing schedules, and renewal/cohort data for direct and marketplace channels.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
    - TI006
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Reported revenue split among hardware delivery, cloud access, software, cybersecurity, consulting, government-funded projects, and partner channels.
    whyItMatters: Revenue quality cannot be judged from the top line alone when a one-off hardware lease and pilot projects can temporarily dominate reported sales.
    diligencePath: Request management revenue bridge for 2024, 2025, and Q1 2026 by stream, customer type, and recognition method.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI001
    - TI006
  - type: private-evidence-only
    severity: material
    topic: honeywell-transfer-pricing
    missingEvidence: Economic terms of the Honeywell strategic services and supply agreement, including transfer pricing, termination rights, and how costs change after IPO separation.
    whyItMatters: The Q1 2026 prepayment to Honeywell shows that related-party support is economically meaningful, but public disclosures do not show whether those costs rise or fall after separation.
    diligencePath: Request the strategic services and supply agreement, any transition-services schedules, and a standalone cost walk from current run-rate to post-IPO run-rate.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI005
    - TI006
