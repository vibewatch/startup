- id: cost-structure-and-capital-intensity
  title: Cost Structure, Gross-Margin Drivers & Capital Intensity
  body: 'Quantinuum’s cost structure is visible enough to show intensity, but not clean enough to show margin quality. The S-1 says cost of revenue includes operations and reliability labor, customer support, system depreciation, cloud and facility infrastructure, and third-party contractors. Direct cost of revenue in 2025 was only $4.73 million, but amortization added another $11.36 million, and management did not publish a gross-margin line that separates hardware, cloud, software, and services. Research and development was the real cost center at $165.4 million in 2025, versus just $30.9 million of revenue, while sales and marketing and G&A added another $48.7 million combined.


    Capital intensity is also explicit. Quantinuum used $62.9 million of operating cash and $22.7 million of investing cash in Q1 2026 alone, with capex linked to quantum-system development and leasehold improvements. Even the working-capital bridge shows dependence on physical build-out and related-party support, including prepayments to Honeywell and leasehold improvements in progress. Public sources therefore support a simple conclusion: Quantinuum is currently underwriting heavy hardware, lab, infrastructure, and talent costs in advance of broad commercial scale. Whether the business ultimately becomes software-rich or remains service-and-hardware heavy is still an unanswered diligence question because stream-level gross profit is not public.'
