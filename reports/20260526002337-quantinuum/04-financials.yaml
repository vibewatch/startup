- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Public price / unit
  - List vs realized
  - Source-backed caveat
  - Implication
  - Diligence ask
  rows:
  - - Azure Standard Plan
    - USD125,000 per month + Azure infrastructure costs for 10k HQCs and 100k eHQCs
    - List pricing only
    - Microsoft warns provider pricing can change and may lag the latest workspace pricing
    - Confirms six-figure monthly enterprise access is commercially plausible
    - Request realized price after credits, overages, and private discounts
  - - Azure Premium Plan
    - USD175,000 per month + Azure infrastructure costs for 17k HQCs and 170k eHQCs
    - List pricing only
    - Still no disclosed realized price or volume commitment data
    - Suggests an enterprise tiering model for H2 access
    - Request customer count, upgrade mix, and average HQC utilization
  - - Azure pay-as-you-go
    - HQC = 5 + C(N1q + 10N2q + 5Nm)/5000
    - Usage-based list formula only
    - Formula shows billing mechanics but not effective $ per workload or negotiated enterprise bundles
    - Useful for list-price discovery, weak for revenue forecasting
    - Request effective realized revenue per HQC and conversion from free trials to paid usage
  - - Direct Quantinuum subscription
    - Publicly offered, but no price disclosed
    - Realized unknown
    - Systems page offers direct subscriptions without list pricing
    - Direct channel may differ materially from Azure economics
    - Request standard MSA and price book for direct enterprise sales
  - - Specialized hardware lease / sale
    - 2025 included $16.5m revenue from a sales-type lease over a 45-month agreement
    - Realized contract economics partly visible, not repeatable list price
    - One transaction materially distorted revenue timing
    - Hardware deals can create large one-off revenue spikes
    - Request hardware ASP, deployment cost, maintenance burden, and renewal options
  - - AWS Braket access
    - Public page shows per-task, per-shot, or hourly reservation model, but not Quantinuum-specific device pricing
    - Realized and list both unclear for Quantinuum
    - Fetched page did not expose a Quantinuum row
    - AWS is a real channel, but its Quantinuum economics are opaque
    - Request Braket contract economics or confirm whether access is private/reservation-only
  - - InQuanto / Nexus / Quantum Origin
    - No public list prices found
    - Realized unknown
    - Official pages confirm packaging and delivery but omit prices
    - Software upside is strategically important but not underwritable from public data
    - Request price sheets, seat/tenant counts, and renewal metrics for each software line
  notes: This table separates public list mechanics from realized economics. A blank or undisclosed field means unavailable in the fetched public pack, not economically immaterial.
