chapter:
  number: 4
  title: Financials
  summary: 'Quantinuum now discloses enough to prove a real but still highly pre-scale business: 2025 revenue was $30.9 million against a $192.6 million net loss, while Q1 2026 revenue fell to $5.2 million and net loss widened to $136.6 million. The revenue stack is diversified across hardware delivery, cloud access, software, cybersecurity, and consulting surfaces, but public disclosures remain thin on realized pricing, stream mix, and gross margin. Current cash of $677.0 million is meaningful, yet burn, capex, and continued Honeywell dependence keep the underwriting case financing-dependent.'
sections:
- id: revenue-model-and-pricing
  title: Revenue Model & Pricing Reality
  body: 'Quantinuum’s filings finally make clear that the company is not a pure-play software business. The S-1 says revenue comes from three broad buckets: specialized quantum-computing hardware, access contracts with maintenance and support, and consulting work tied to co-developing algorithms on Quantinuum systems. Public web pages broaden that picture further: direct subscriptions to Quantinuum Systems, Azure subscriptions, cloud and HaaS delivery, InQuanto licenses, Nexus platform access, and Quantum Origin security software. The issue for underwriting is not whether monetization surfaces exist—they clearly do—but how little public evidence exists on realized pricing, discounting, and stream mix.


    The only clean public list pricing sits on Azure Quantum, where Quantinuum’s Standard and Premium plans are priced at $125,000 and $175,000 per month, plus infrastructure costs, with a separate pay-as-you-go HQC formula. That is useful evidence that enterprise access can command six-figure monthly list prices, but it still does not reveal realized ASPs, direct sales pricing, or contract-level discounts. Meanwhile, the S-1 shows that hardware transactions can dominate revenue timing: 2025 revenue was lifted by a $16.5 million sales-type lease, and Q1 2026 revenue fell sharply when that prior-year upfront recognition did not repeat. The public revenue model is therefore real but highly opaque on mix and monetization quality.'
