    - Material balance-sheet flexibility after the 2025 raise
    - Not enough by itself to prove runway
    - Provide monthly cash waterfall and minimum cash covenant assumptions
  - - 2025 operating cash burn
    - 160.3m USD
    - Shows annual cash use already exceeded 5x 2025 revenue
    - Burn was rising before IPO marketing began
    - Provide 2026 planned burn and expected inflection points
  - - Q1 2026 operating cash burn
    - 62.9m USD
    - Shows current-period consumption rate is still heavy
    - Quarter may include one-offs; exact steady-state unknown
    - Provide normalized quarterly burn and working-capital seasonality
  - - Q1 2026 capex
    - 22.7m USD
    - Confirms continuing system and facility investment
    - Capital intensity extends beyond payroll and cloud costs
    - Provide multi-year capex plan by system generation and facility
  - - Honeywell support
    - Majority-owned parent, backlog holder, strategic customer, and services counterparty
    - Reduces execution risk and helps commercial access
    - Creates related-party dependence and transfer-pricing opacity
    - Provide Honeywell agreement economics and post-IPO separation model
  - - 2024 funding milestone
    - 300m USD at 5b pre-money
    - Reset the post-merger capital base
    - Historical raise does not solve current runway questions
    - Provide use-of-proceeds completion report for 2024 capital
  - - 2025 funding milestone
    - ~600m USD at 10b pre-money
    - Supplied the current cash cushion and supported Helios / fault-tolerant roadmap
    - Still may not be enough if burn and capex stay elevated
    - Provide remaining unrestricted cash from the 2025 round
  - - 2026 IPO bridge
    - Filed, but share count and price not yet set
    - Potential next liquidity source
    - Not committed capital at the run date
    - Provide base, downside, and no-IPO financing scenarios
  - - CHIPS R&D letter of intent
    - Proposed federal support and supplier partnerships
    - Possible non-dilutive offset to future R&D / supply-chain spending
    - LOI is not closed cash and timing is uncertain
    - Provide award size, milestones, and matching-fund requirements
  notes: Capital adequacy is assessed against disclosed cash and burn only. Public sources do not provide a management runway forecast, a post-IPO cash budget, or a stream-level capex bridge.
