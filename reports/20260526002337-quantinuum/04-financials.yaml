  - - Cloud access to Quantinuum systems
    - Stand-ready access to quantum systems with maintenance and support services
    - Fixed-fee term plus variable usage above minimums
    - Confirmed in S-1 and direct systems pages; Azure offers monthly plans and HQC pay-as-you-go
    - 'Medium: recurring structure exists, but realized pricing and renewal data are not public'
    - Provide contract minimums, overage pricing, renewal rates, and marketplace revenue split
  - - Direct subscription / HaaS
    - Direct Quantinuum subscriptions and HaaS for system access
    - Enterprise subscription
    - Systems page explicitly offers direct subscriptions and cloud/HaaS
    - 'Medium: channel exists, but no public direct list price'
    - Provide direct-sales price card, average contract length, and support obligations
  - - Nexus platform software
    - Cloud workflow platform with simulators, notebooks, quotas, and collaboration
    - Platform subscription / enterprise workspace
    - Nexus has 150+ organizations and 750+ users, but no public revenue disclosure
    - 'Medium: adoption proxy exists, monetization is opaque'
    - Provide Nexus ARR, paid-seat counts, and attach rates to hardware contracts
  - - InQuanto software
    - Quantum chemistry platform sold with system access and partner residency
    - License / enterprise engagement
    - Product page confirms platform and partner-residency model; no public pricing
    - 'Medium: credible software surface, economics undisclosed'
    - Provide license structure, services component, and revenue split by pharma/materials customers
  - - Quantum Origin cybersecurity
    - Software binary plus quantum-derived seed for entropy and post-quantum workflows
    - Software license / SDK / connector deployment
    - Product and docs pages confirm software delivery; no public pricing
    - 'Medium: differentiated product, but revenue visibility is near zero'
    - Provide customer count, pricing model, reseller economics, and gross margin
  - - Consulting and co-development services
    - Algorithm co-development, onboarding, domain-specific scientific collaboration, and consulting services
    - Milestones / services statement of work
    - S-1 and leadership pages explicitly reference consulting services
    - 'Low–Medium: clearly exists, but service revenue amount is undisclosed'
    - Provide services utilization, blended day rates, attach to product sales, and conversion to recurring software
