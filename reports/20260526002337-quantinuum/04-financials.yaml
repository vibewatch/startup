- id: TI006
  title: Public financial gaps table
  columns:
  - Missing metric / disclosure
  - Why it matters
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue mix by stream
    - Separates one-off hardware recognition from recurring cloud or software revenue
    - Without mix, the top line can overstate recurring quality
    - Request 2024-Q1 2026 revenue by hardware, cloud, software, cybersecurity, consulting, and grants
  - - Realized prices, discounts, and minimums
    - List pricing does not equal realized economics
    - Impossible to model gross profit or pricing power confidently
    - Request sample contracts for direct, Azure, and any AWS or on-prem channels
  - - Gross margin by product line
    - Core test of whether software can outrun hardware-service cost intensity
    - Valuation is impossible to defend on quality grounds without it
    - Request audited gross margin bridge by stream with support allocations
  - - Customer renewal and production conversion
    - Pilot-heavy engagements can create bookings without durable recurrence
    - Commercial traction may look stronger than durable revenue reality
    - Request paid-pilot conversion rates, renewal cohorts, and churn by customer class
  - - Post-IPO Honeywell economics
    - Related-party support could meaningfully change after separation
    - Standalone margin and cash needs may worsen or improve materially
    - Request strategic services and supply agreement plus any transition-services schedules
  - - Runway under base and downside cases
    - Cash balance alone is not a runway forecast
    - Next-round timing remains guesswork without a budget and milestone plan
    - Request 2026-2028 operating plan and financing scenarios
  notes: Every row is an explicit gap in the fetched public evidence pack, not a request for nice-to-have detail. These missing numbers directly affect revenue quality, margin, and capital adequacy judgments.
