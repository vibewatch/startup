  rows:
  - - Specialized quantum-computing hardware
    - Design, development, construction, sale, delivery, and commissioning of quantum systems; may be recognized as a sales-type lease
    - System sale / lease / commissioning milestone
    - Confirmed in S-1; 2025 included a $16.5m sales-type lease transaction
    - 'Low–Medium: real revenue, but timing is episodic and contract-specific'
