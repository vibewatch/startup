- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: 'The financing path moved fast: a $300 million round at $5 billion pre-money in January 2024, then an approximately $600 million round at $10 billion pre-money in September 2025. The IPO path is also live: Quantinuum confidentially submitted an S-1 in February 2026 and publicly filed in May 2026. Those facts matter, but the missing facts matter more for entry discipline. Reviewed public materials do not disclose the eventual IPO price range, number of shares, Honeywell sell-down, or the preference stack behind the 2025 round. The user-supplied note that the 2025 financing later expanded to $800 million is directionally plausible, but the retained public evidence did not verify that with the same clarity as the original $600 million announcement. That leaves investors with a headline valuation but weak visibility into what common-equity holders would actually own or how much dilution and overhang sit behind the mark. At a minimum, that argues for patience until the S-1 makes the economics
    legible.'
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV007
