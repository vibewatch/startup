- id: TV006
  title: Final diligence asks table
  columns:
  - Priority
  - Ask
  - Why it matters
  rows:
  - - P1
    - 'Full S-1 financial statements: revenue, gross margin, burn, cash, concentration'
    - Without core economics, valuation work is mostly sentiment-relative rather than fundamentally grounded
  - - P1
    - 2025 financing term sheet and cap table
    - Needed to understand liquidation preferences, ratchets, dilution, and whether the headline mark overstates common value
  - - P1
    - Honeywell ownership, secondary sale, and lock-up profile
    - Needed to assess float, control, and future supply overhang into and after the IPO
  - - P2
    - Customer revenue bridge from Helios, Quantum Origin, and major partnerships
    - Needed to distinguish pilots and strategic optics from repeatable revenue conversion
  - - P2
    - Documentary proof of whether the 2025 round stopped at ~$600M or expanded to ~$800M total
    - Needed for post-money, runway, and dilution math
  notes: The diligence list is intentionally short and valuation-moving; none of these asks are cosmetic.
