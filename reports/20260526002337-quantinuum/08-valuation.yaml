  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quantinuum-financial-disclosure
    missingEvidence: Public S-1 financial statements or equivalent disclosure of revenue, gross margin, burn, cash, and customer concentration.
    whyItMatters: Without operating metrics, the chapter can compare Quantinuum only to quoted public sentiment and milestone proof, not to a disclosed fundamental base.
    diligencePath: Review the public S-1 and management presentations as soon as filed, then normalize revenue quality, gross margin, burn, and concentration against public comps.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: conflicting-data
    severity: material
    topic: 2025-round-size
    missingEvidence: Primary-source documentation confirming whether the September 2025 financing stayed at roughly $600 million or later expanded to $800 million total.
    whyItMatters: Round-size drift changes post-money valuation, dilution math, and how much capital runway the company actually bought before filing to go public.
    diligencePath: Request signed closing summaries, updated capitalization tables, or S-1 proceeds history instead of relying on secondary retellings.
    relatedQuestionRefs:
    - QV004
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: Liquidation preference, ratchet, anti-dilution, participation, and seniority terms for the 2025 financing stack.
    whyItMatters: A $10 billion headline mark can overstate common-equity value if late-stage preferred terms are protective or if secondary and primary capital were mixed.
    diligencePath: Obtain the term sheet, stock purchase agreement, and current cap table before underwriting common-equity returns.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: honeywell-sell-down
    missingEvidence: Expected Honeywell sell-down size, lockups, governance rights, and retained ownership through the IPO.
    whyItMatters: Honeywell is a majority owner, so float, future overhang, and control rights could materially affect aftermarket supply and governance risk.
    diligencePath: Review the eventual prospectus ownership table, lock-up agreements, and any secondary selling-shareholder disclosures.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: private-comparables
    missingEvidence: Current private quantum comparables with disclosed revenue and financing terms rather than only public-market sentiment markers.
    whyItMatters: The current comp set is useful for sentiment anchoring but weak for fundamental underwriting because listed peers still trade on optionality more than cash flow.
    diligencePath: Collect recent private financings, secondary indications, or banker comp workups once accessible under NDA.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV004
