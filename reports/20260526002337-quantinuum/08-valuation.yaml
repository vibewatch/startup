- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or signal
  - Why it matters
  - Action implication
  rows:
  - - Weak S-1 economics
    - Revenue or gross margin disclosure implies little support for a $10B mark
    - Would confirm that the round was milestone-priced rather than fundamentally anchored
    - Do not buy / move to bear case
  - - Investor-unfriendly 2025 terms
    - Punitive preferences, secondary-heavy structure, or ratchets surface in diligence or filing
    - Headline valuation may overstate common-equity value
    - Demand a steeper entry discount or pass
  - - Honeywell overhang
    - Large sell-down, loose lockups, or heavy retained control emerge in the prospectus
    - Can pressure float, governance, and aftermarket technicals
    - Avoid IPO or size smaller
  - - Public quantum de-rating
    - Public peers lose a large share of market cap without offsetting fundamental improvement
    - Quantinuum’s relative-price defense weakens quickly
    - Re-cut scenario table lower
  notes: These are monitorable valuation triggers rather than operating milestones alone; each one changes what a common-equity buyer actually owns or can exit into.
