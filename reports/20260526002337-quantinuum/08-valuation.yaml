  title: Recommendation summary table
  columns:
  - Dimension
  - Value
  - Rationale
  rows:
  - - Recommendation
    - track
    - Wait for S-1 economics or a materially cheaper entry before underwriting upside
  - - Confidence
    - medium
    - The direction of the call is clear, but missing financials and term sheets cap conviction
  - - Risk rating
    - high
    - Sector multiples are volatile, disclosure is incomplete, and Honeywell overhang is unresolved
  - - Valuation stance
    - fair on public comps; stretched on fundamentals
    - The $10B mark sits inside a frothy public quantum cluster but lacks disclosed revenue or margin support
  - - Target return / hold
    - Need >2.0x gross over 4-6 years; not supportable at known terms
    - Without S-1 economics, the current mark does not yet show enough underwritten upside
  notes: Decision summary as of 2026-05-26. Return target is a discipline threshold, not a sourced promise.
