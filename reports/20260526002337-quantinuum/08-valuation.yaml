- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  rows:
  - - Syndicate quality
    - Strategic backers span finance, pharma, electronics, AI accelerators, and industrials
    - Strategic logos do not automatically convert into recurring revenue or minority-investor protection
  - - Commercial proof
    - Helios named Amgen, BMW, JPMorganChase, and SoftBank as launch customers; bp and BMW expanded partnerships
    - Named users can still be pilots or R&D programs rather than durable high-margin revenue streams
  - - Product breadth
    - Quantum Origin and error-correction milestones show more than a single-hardware story
    - Breadth can also spread focus before the core compute business proves standalone economics
  - - Relative pricing
    - The $10B mark sits below IonQ and near D-Wave inside a still-hot public quantum tape
    - 'The public tape itself may be the problem: comps look narrative-led rather than cash-flow-led'
  - - Exit path
    - An S-1 is already filed, which improves visibility on a liquidity path
    - No price range, sell-down profile, or cap-table details are yet public
  - - Underwriting basis
    - Track today can convert to buy if the S-1 validates economics
    - Buying today would rely on trust in milestones rather than disclosed fundamentals
  notes: Thesis and anti-thesis are paired at the same decision node so the investment case stays price-sensitive and evidence-sensitive.
