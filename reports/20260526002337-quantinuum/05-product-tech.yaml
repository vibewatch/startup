  claims:
  - id: CE001
    statement: Quantinuum publicly positions itself as a full-stack quantum company spanning hardware, software, developer tools, and cybersecurity products.
    type: company-claimed
    topic: full-stack
    sourceRefs:
    - SE001
    - SE005
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE005
  - id: CE002
    statement: System Model H1 is Quantinuum's first-generation trapped-ion system and uses a single linear architecture with all-to-all connectivity, mid-circuit measurement, conditional logic, and qubit reuse.
    type: company-claimed
    topic: H1-architecture
    sourceRefs:
    - SE002
    - SE010
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE002
  - id: CE003
    statement: The H1 data sheet specifies 20 physical 171Yb+ qubits, five parallel gate zones, typical two-qubit gate infidelity of 1×10^-3, and typical single-qubit gate infidelity of 2×10^-5.
    type: company-claimed
    topic: H1-performance
    sourceRefs:
    - SE002
    - SE010
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE012
  - id: CE004
    statement: System Model H2 is Quantinuum's second-generation trapped-ion system and moves from a linear layout to a racetrack-style architecture while keeping all-to-all connectivity, mid-circuit measurement, conditional logic, and qubit reuse.
    type: company-claimed
    topic: H2-architecture
    sourceRefs:
    - SE003
    - SE011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE003
  - id: CE005
    statement: The H2 data sheet specifies 56 physical 171Yb+ qubits, four parallel two-qubit zones in two connected linear sections, typical two-qubit gate infidelity of 1×10^-3, and typical SPAM error of 1×10^-3.
    type: company-claimed
    topic: H2-performance
    sourceRefs:
    - SE011
    - SE016
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE013
  - id: CE006
    statement: Azure Quantum exposes H2-1 and H2-2 syntax checkers, emulators, and QPUs, and states that Quantinuum targets support integrated hybrid circuits.
    type: third-party-reported
    topic: deployment-integrations
    sourceRefs:
    - SE016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE010
    - QE011
    - QE017
  - id: CE007
    statement: Helios is marketed as a 98-physical-qubit flagship with logical qubits, Guppy, NVIDIA GPUs integrated into the control system, and both cloud and on-prem access.
    type: company-claimed
    topic: Helios-overview
    sourceRefs:
    - SE004
    - SE012
    confidence: high
    freshness: current
    answersQuestionRefs:
