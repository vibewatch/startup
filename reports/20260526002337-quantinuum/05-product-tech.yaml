  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-levels
    missingEvidence: Historical uptime, queue-time, and SLA metrics for H2 and Helios across direct, Azure, and Nexus access paths.
    whyItMatters: Hardware availability and service guarantees matter more than raw fidelity once a buyer is underwriting production workflows.
    diligencePath: Request customer-facing status history, contractual SLA exhibits, and queue-performance reports from Quantinuum sales or support.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: material
    topic: helios-on-prem-operations
    missingEvidence: Facility, rack, power, cooling, networking, support, and maintenance requirements for Helios on-prem deployments.
    whyItMatters: On-prem claims change procurement and deployment economics, but underwriting is difficult without a concrete operating package.
    diligencePath: Obtain Helios on-prem installation guides, support scope, and reference architecture documents under NDA.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: minor
    topic: helios-benchmarking
    missingEvidence: Independent benchmark or peer-reviewed validation of the Helios “world's most accurate” positioning beyond company or partner narratives.
    whyItMatters: Differentiation claims are stronger when the flagship accuracy statement is independently validated rather than only company-led.
    diligencePath: Look for peer-reviewed Helios benchmark papers, neutral lab evaluations, or third-party reproduction studies as they emerge.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: Public SOC 2, ISO 27001, cryptographic audit, or trust-center artifacts covering Nexus, Helios operations, or Quantum Origin.
    whyItMatters: Enterprise buyers of cloud, on-prem, or security products often require formal compliance evidence in addition to technical descriptions.
    diligencePath: Request audit letters, certification scope documents, or trust-portal access from Quantinuum during diligence.
    relatedQuestionRefs:
