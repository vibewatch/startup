    - Execute gates on trapped ions
    - H1 and H2 use 171Yb+; Helios uses 137Ba+ QCCD traps with all-to-all connectivity
    - Laser and control-stack calibration plus ion transport
    - Scaling depends on continued hardware upgrades and calibration discipline
  - - Native operations
    - Support dynamic programs
    - Mid-circuit measurement, conditional logic, qubit reuse, arbitrary-angle ZZ, and optional SU(4) entanglers
    - Stable compiler and runtime semantics
    - Advanced features raise integration and testing burden
