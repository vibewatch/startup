chapter:
  number: 5
  title: Product & Technology
  summary: 'Quantinuum''s product stack is genuinely full-stack: H1 and H2 trapped-ion systems roll into the newer Helios flagship, while TKET, Guppy, InQuanto, Quantum Origin, and lambeq provide compiler, application, cyber, and research surfaces above the hardware. The architecture is differentiated by all-to-all trapped-ion QCCD systems and managed dynamic-circuit workflows, and the software layer has real public traction through TKET release cadence and downloads. Product maturity is strongest in compiler tooling and published hardware specs; it is weaker in publicly disclosed SLA, compliance, and independent validation of Helios'' newest marketing claims.'
sections:
- id: portfolio-and-workflows
  title: Full-stack portfolio and user-facing modules
  body: 'Quantinuum is not presenting a single trapped-ion box to the market; it is presenting a layered product portfolio. The public surface combines H-Series hardware, a new Helios flagship, the TKET compiler stack, the InQuanto chemistry package, the Quantum Origin cryptography product, and lambeq for quantum natural-language-processing work. The homepage and developer-tools surfaces are explicit that the company wants buyers to think in end-user workflow terms rather than qubit-count-only terms: chemistry teams get InQuanto on top of Quantinuum systems, developers get TKET and Guppy, security teams get Quantum Origin, and research users can experiment with lambeq as an adjacent open-source toolkit.


    That breadth matters strategically. Quantinuum can move a prospective customer into the stack through at least four different entry points: direct hardware access, domain software, open-source developer tooling, or cyber product integration. InQuanto is the clearest application package, with public positioning around molecular and materials simulation plus access to Quantinuum systems and expert residency support. Quantum Origin is a separate monetizable security line built around quantum-generated seeds and Bell-test-backed randomness enhancement for existing products. Lambeq is smaller and more research-oriented, but it still broadens the company beyond pure hardware by giving Quantinuum a visible open-source QNLP surface. The net effect is a product map that spans hardware, middleware, applications, and cyber products in one branded stack.'
