    - Broker jobs and simulation
    - Nexus, Azure targets, OLCF workflows, syntax checkers, and emulators
    - Portal uptime, quotas, identity, and partner integrations
    - Access windows and quota systems can slow production work
  - - Application and cyber layer
    - Package domain workflows
    - InQuanto, Quantum Origin, lambeq, Guppy, and CUDA-Q-linked workflows
    - Customer enablement and partner co-development
    - Breadth is strong, but public usage depth varies materially by module
