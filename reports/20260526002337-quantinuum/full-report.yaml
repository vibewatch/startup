            body: >-
              The recommendation is TRACK with medium confidence, a high risk rating, and a fair-to-stretched valuation
              stance. Fair is the right word on a relative basis because public quantum comps are even richer; stretched
              is the right word on a fundamental basis because Quantinuum still has not disclosed the operating data
              that would let an investor know whether $10 billion is a bargain or a trap. Said differently: the company
              quality may be better than the public peer set, but the price discipline problem remains unresolved. The
              chapter therefore does not support buying the known private mark simply because the sector is hot. The
              gate to move from track to buy is straightforward: the S-1 must disclose real revenue and quality of
              revenue, the 2025 financing must not hide punitive preference terms, Honeywell’s sell-down and lockup
              profile must be investable, and marquee users such as Amgen, BMW, JPMorganChase, SoftBank, and bp must map
