  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Quantinuum has a stronger qualitative case than most quoted quantum peers. The company has assembled a
              syndicate that spans JPMorgan Chase, Amgen, Mitsui, Quanta Computer, NVentures, QED Investors, and
              Honeywell, which is both capital support and a distribution signal across finance, pharma, industrials,
              and AI infrastructure. Product proof is also broader than a pure hardware narrative: Helios launched
              commercially in November 2025 with named customers including Amgen, BMW Group, JPMorganChase, and
              SoftBank; Quantum Origin gives the company a software-security wedge; and NVIDIA collaboration plus BMW
              and bp partnerships suggest the roadmap is connecting with real enterprise programs. The anti-thesis is
              that public evidence still does not disclose revenue, margins, or customer concentration, so the company
              is asking investors to pay on milestone quality and ecosystem credibility rather than demonstrated
              economics. That can work in a euphoric quantum tape, but it is fragile if the S-1 shows modest revenue or
              if public quantum multiples compress.
