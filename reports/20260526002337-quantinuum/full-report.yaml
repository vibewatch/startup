  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's risk stack is led by three thesis-level exposures: Honeywell-controlled ownership with an
              unresolved liquidity path, commercialization timing risk in a still-fragile quantum market, and the
              technical challenge of turning Helios-era milestones into repeatable fault-tolerant utility. The company
              is well funded and technically credible, but its public materials still ask investors to underwrite future
              milestones—Apollo-scale logical-qubit progress, broader production deployments, and a successful IPO
              process—rather than closed loops on revenue durability or independent governance. The risk heatmap places
              ownership/liquidity, commercialization delay, and scaling execution in the highest-severity cells because
              each can reprice the business quickly even if the science continues to advance. Export controls,
              foreign-investment review, supplier concentration, and key-person dependence are the main transmission
              paths that can turn a promising roadmap into a slower, more expensive, and less liquid company.
