  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Directional impact on a notional $10B midpoint if the most important upside or downside underwriting assumptions
      change.
    data:
      items:
        - label: S-1 reveals strong commercial scale
          value: 6
          description: Evidence of real revenue and margin support could lift the midpoint by roughly $6B
        - label: Helios users convert into repeat revenue
          value: 3
          description: Customer proof becoming monetization proof would add several billion of support
        - label: Hot quantum IPO window persists
          value: 2
          description: Sector sentiment can temporarily support higher exit pricing
        - label: Honeywell overhang or preference stack disappoints
          value: -3
          description: Unfriendly terms directly reduce common-equity value
        - label: Public quantum multiples compress sharply
          value: -5
          description: If the listed peer cluster resets lower, relative-price support for Quantinuum weakens fast
    approximationNotes: >-
      Bars are approximate directional deltas in USD billions versus a $10B midpoint; they are not additive and should
      be read as single-factor sensitivities.
    claimRefs:
      - CV035
      - CV038
      - CV039
      - CV041
      - CV046
