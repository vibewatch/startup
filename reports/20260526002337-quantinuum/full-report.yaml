              quoted peers while still being an unattractive common-equity entry in practice.
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV041
          - type: callout
            title: Wait for the S-1 or demand a cheaper entry
            body: >-
              The company quality appears investable; the current evidence set does not yet prove the price is. The most
              rational move is to track the filing, test the economics and overhang, and only then decide whether the
              business deserves a premium to a still-frothy public quantum cluster.
            calloutType: recommendation
            claimRefs:
              - CV039
              - CV041
              - CV045
