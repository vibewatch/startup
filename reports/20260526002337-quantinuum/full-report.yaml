      - number: '3.2'
        title: Product Scope, Cloud Access, Software Stack, and Public Packaging
        blocks:
          - type: paragraph
            body: >-
              IBM and IonQ are the most commercially comparable benchmarks because both expose concrete procurement
              paths, not just research ambition. IBM publishes minute-based plans across open, pay-as-you-go, flex,
              premium, and on-prem tiers, and couples them to Qiskit Runtime and Functions. IonQ offers direct cloud,
              all-major-SDK support, and Forte Enterprise for data-center deployments, while its 2026 earnings release
              shows material commercial traction rather than only technical progress. Google is different: Cirq is open,
              but Willow access remains proposal-gated and explicitly not public, so Google's present threat is more
              ecosystem and talent gravity than procurement scale. Rigetti competes through hybrid-HPC integration and a
              real on-prem product in Novera. IQM leans toward sovereign and HPC buyers. QuEra packages a neutral-atom
              alternative through AWS plus premium direct access, while OQC emphasizes sovereign colocation and cloud
              deployments. Across this set, Quantinuum compares well on deployment breadth and software maturity, but it
              does not enjoy the same level of public price transparency that IBM and AWS marketplace listings provide.
