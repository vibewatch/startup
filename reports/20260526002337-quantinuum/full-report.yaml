companyProfile:
  summary: >-
    Quantinuum was formed on November 30, 2021 through the merger of Honeywell Quantum Solutions and Cambridge Quantum,
    creating a full-stack quantum computing company that combines trapped-ion hardware, middleware, chemistry and
    developer software, and cybersecurity products. The company’s principal executive offices are in Broomfield,
