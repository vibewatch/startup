      - number: '3.4'
        title: Moat Durability, Commoditization Risk, and Skeptical Third-Party Views
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is not that one rival has already decisively beaten Quantinuum. It is that the whole
              category is still early enough for moat narratives to outrun commercial reality. IEEE Spectrum's January
              2026 view is explicit that the industry will not reach broadly useful commercial quantum computing in
              2026; even the first customer-facing error-corrected systems are framed as scientific, not commercial,
              advantage. That skepticism matters because it limits how much any vendor can claim short-term
              defensibility from roadmaps alone. Against that backdrop, Quantinuum's present strengths are real:
              trapped-ion fidelity, all-to-all connectivity, enterprise proof points, and multiple deployment paths. But
              the long-term threats are also credible. IBM's modular roadmap is the clearest public fault-tolerant
              scaling plan from a large enterprise vendor; QuEra is moving logical-qubit claims quickly; and PsiQuantum
              is trying to bypass the current cloud race entirely with a semiconductor-style manufacturing thesis. The
              competitive verdict is therefore favorable but not complacent: Quantinuum looks top-tier in today's
              enterprise shortlist, yet the market structure is still consistent with future commoditization at the
              workflow layer and future displacement by a different winning architecture.
