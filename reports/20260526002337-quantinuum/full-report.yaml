      - number: '1.2'
        title: Leadership, governance, and Honeywell control
        blocks:
          - type: paragraph
            body: >-
              Leadership has shifted from founder-led integration to scale-up execution. Raj Hazra took over as CEO in
              February 2023 after long operating stints at Micron and Intel; that move coincided with Quantinuum moving
              from post-merger integration toward commercialization. Cambridge Quantum founder Ilyas Khan did not exit:
              he remained a board member, moved to vice chairman, and by 2026 was presented as head of special projects
              inside the executive team. In March 2026, Quantinuum recruited Nitesh Sharan from SoundHound AI as CFO, a
              hire that looks tailored for capital-markets readiness as much as internal finance discipline.


              Governance remains materially shaped by Honeywell. Public materials list Honeywell CEO Vimal Kapur as
              chairman, alongside Anne T. Madden, Niels Nielsen, Greg Lewis, George Sherman, and Manish Bhatia on the
              board. Honeywell is not just an investor; the 2021 formation announcement also described Honeywell as both
              supplier and customer, and Reuters still described Honeywell as majority owner during the 2026 IPO
              process. That combination creates a mixed profile for investors. On one hand, Honeywell provides
              industrial credibility, supply-chain support, and a natural first-customer base. On the other hand,
              control remains concentrated and key-person risk is still real: Hazra is central to commercialization and
              IPO execution, while Khan remains tightly associated with product identity and the company's software
              heritage. Public materials before IPO effectiveness still do not fully spell out committee composition,
              minority-protection mechanisms, or the exact post-offering control split.
            claimRefs:
              - CO002
              - CO003
