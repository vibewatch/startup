        title: Concentration Risk, Procurement Friction, and Explicit Gaps
        blocks:
          - type: paragraph
            body: >-
              The adverse customer signal is concentration. Quantinuum’s S-1 discloses that one customer represented 60%
              of 2025 revenue and 63% of 2024 revenue; for the March 2026 quarter one customer was 47% of revenue, while
              a different customer was 90% in the March 2025 quarter. The same filing also shows the U.S. Government
              contributed 16% of 2025 revenue, 9% of 2024 revenue, and 24% of Q1 2026 revenue. That is not a broad
              enterprise base; it is a small-number-account model with meaningful sovereign exposure. Procurement
              friction is visible in how the company sells. Helios access is routed through cloud or on-prem sales
              contact, Microsoft commercialization is still in private preview, QIDO went through beta testing before
              general release, and many named customer proofs are co-development or pilot programs rather than
              price-card deployments. The company therefore looks commercially promising but operationally early: there
              is credible vertical and geographic proof, yet public materials still omit customer count, top-customer
              identities, pricing, ACV, and retention statistics. Underwriting the customer story requires assuming both
