  - id: FR002
    title: Risk transmission map
    type: dag
    insight: >-
      Ownership, regulation, and roadmap risk all transmit into the same two outcome nodes: financing flexibility and
      commercial confidence. That convergence is why Quantinuum remains milestone-sensitive even with strong science and
      capital support.
    data:
      nodes:
        - id: rn1
          label: Honeywell control / IPO uncertainty
          type: ownership
        - id: rn2
