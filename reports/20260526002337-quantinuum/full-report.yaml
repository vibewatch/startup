      - number: '7.3'
        title: Technology and Operational Scaling Risk
        blocks:
          - type: paragraph
            body: >-
              Quantinuum has real technical momentum, but the distance between Helios and a commercially decisive Apollo
              remains the core operational risk. Public releases and the Helios paper show strong trapped-ion
              performance, logical-qubit progress, and a plausible path to larger systems. But both Quantinuum and
              independent coverage still frame the current generation as an important proof point rather than a finished
              utility-scale product. The roadmap depends on aggressive improvements in logical-qubit count, error
              suppression, real-time decoding, and hardware manufacturability. Those milestones are not isolated:
              Quantinuum's own materials tie future progress to NVIDIA-backed classical co-processing and to a narrow
              hardware supply chain including GlobalFoundries and Monarch Quantum. If any of those pieces slip—error
              correction, partner software, photonics, component yields, or system integration—the company can preserve
              scientific credibility yet still miss the commercial timetable implied by the valuation and IPO narrative.
