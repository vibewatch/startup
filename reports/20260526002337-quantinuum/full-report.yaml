  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model & Pricing Reality
        blocks:
          - type: paragraph
            body: >-
              Quantinuum’s filings finally make clear that the company is not a pure-play software business. The S-1
              says revenue comes from three broad buckets: specialized quantum-computing hardware, access contracts with
              maintenance and support, and consulting work tied to co-developing algorithms on Quantinuum systems.
              Public web pages broaden that picture further: direct subscriptions to Quantinuum Systems, Azure
              subscriptions, cloud and HaaS delivery, InQuanto licenses, Nexus platform access, and Quantum Origin
              security software. The issue for underwriting is not whether monetization surfaces exist—they clearly
              do—but how little public evidence exists on realized pricing, discounting, and stream mix.


              The only clean public list pricing sits on Azure Quantum, where Quantinuum’s Standard and Premium plans
              are priced at $125,000 and $175,000 per month, plus infrastructure costs, with a separate pay-as-you-go
              HQC formula. That is useful evidence that enterprise access can command six-figure monthly list prices,
              but it still does not reveal realized ASPs, direct sales pricing, or contract-level discounts. Meanwhile,
              the S-1 shows that hardware transactions can dominate revenue timing: 2025 revenue was lifted by a $16.5
              million sales-type lease, and Q1 2026 revenue fell sharply when that prior-year upfront recognition did
              not repeat. The public revenue model is therefore real but highly opaque on mix and monetization quality.
