  - id: FR001
    title: Risk heatmap
    type: matrix
    insight: >-
      The top-right cells are owned by liquidity, commercialization, and scaling risk rather than by a single legal
      case. That matters because the main downside is systemic: sponsor control, technical timing, and market proof can
      all weaken together.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Severity
          values:
            - label: Key-person loss without succession
            - label: Scaling / error-correction miss
            - label: Commercialization delay / quantum-winter reset
        - label: High Severity
          values:
            - label: Board independence drift
            - label: Export-control / CFIUS escalation
            - label: Honeywell-controlled liquidity overhang
        - label: Medium Severity
          values:
            - label: On-prem support burden
            - label: Supplier yield delay
            - label: Competition compresses moat narrative
        - label: Low Severity
          values:
            - label: Incremental compliance cost
            - label: Single customer pilot slips
            - label: Narrative volatility after listing
    claimRefs:
