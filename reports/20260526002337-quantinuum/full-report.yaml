        - id: prototype
          label: Hybrid pilot built
          detail: Developer tools, simulators, and limited hardware runs are used to test feasibility
        - id: compliance
          label: Compliance and export review
          detail: Security, data-sovereignty, procurement, or deemed-export constraints are checked
        - id: benchmark
          label: Benchmark and business case
          detail: Team compares quantum-assisted workflow against HPC or classical alternative
        - id: funding
          label: Program budget approved
          detail: Innovation, R&D, security, or public-program budget expands beyond the pilot
        - id: deployment
          label: Scaled deployment or multi-year partnership
          detail: Recurring access, software, chemistry, or security program with internal sponsors
