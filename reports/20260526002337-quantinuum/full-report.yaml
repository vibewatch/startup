      - number: '5.2'
        title: Trapped-ion architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The hardware line is coherent rather than fragmented. H1 is the first-generation system: a 20-qubit 171Yb+
              trapped-ion machine with a single linear architecture, five parallel gate zones, all-to-all connectivity,
              mid-circuit measurement, conditional logic, and qubit reuse. H2 keeps the same trapped-ion logic model but
              scales to 56 physical qubits and shifts to a racetrack-style QCCD architecture with two connected linear
              sections and four parallel two-qubit zones. Helios extends the same design language again, moving to 98
              physical 137Ba+ qubits, eight gate zones, a circular storage ring plus linear gating sections, and
              real-time arithmetic and control-flow features intended to support error-correction-heavy workloads.


              Just as important, Quantinuum exposes this hardware through managed access layers rather than bare-metal
              commodity endpoints. Nexus is the company control plane for hardware and compilation services. Azure
              Quantum exposes syntax checkers, emulators, and H2 QPUs under the Quantinuum provider, while OLCF
              documents a recommended workflow of syntax checker to emulator to real hardware. Helios adds a more
              enterprise-shaped deployment posture because Quantinuum publicly offers both cloud and on-prem access and
              couples the hardware with Guppy and GPU-linked control. The architecture story therefore is not just
              trapped ions plus lasers; it is trapped ions plus a managed control plane, compilation path, validation
              endpoints, and partner-operated entry channels.
