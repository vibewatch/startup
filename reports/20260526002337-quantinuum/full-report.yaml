  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Quantinuum should be analyzed inside a narrowly defined full-stack quantum-computing market, not inside
              the whole HPC, cybersecurity, or advanced-software universe. The company’s own product surface spans
              trapped-ion hardware, quantum-as-a-service access, developer tooling, chemistry/materials workflows, and a
              quantum-randomness security product. External market reports use a similar layered taxonomy: hardware
              platforms, software development tools, cloud services, and industry-specific applications. That framing is
              important because it keeps the core market tied to identifiable quantum-specific budgets instead of
              treating all adjacent compute spending as addressable.


              Included spend therefore covers direct subscriptions or reserved access to H-Series systems; cloud access
              and orchestration layers such as Nexus; compiler, workflow, and developer-tooling spend around
              TKET/Qermit/lambeq-like workflows; application-layer spend for chemistry/materials and optimization
              pilots; and narrowly defined cybersecurity spend linked to QRNG or post-quantum migration readiness.
              Excluded spend should include generic supercomputing capacity, general cloud infrastructure, conventional
              HPC software, classical optimization tools, and broad cybersecurity or semiconductor budgets that do not
              buy a quantum-specific product.


              The most important adjacency boundary is HPC. Airbus explicitly describes quantum computing as working in
              tandem with traditional HPC for aerospace simulation rather than replacing it. For Quantinuum, that means
              aerospace, chemistry, and public-lab demand often starts as an incremental line item inside existing
              research or innovation budgets, not as a direct displacement of an enterprise’s full classical-compute
              stack.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
