      - number: '1.3'
        title: Capital structure, scale metrics, and commercial maturity
        blocks:
          - type: paragraph
            body: >-
              Quantinuum now has credible unicorn status on both price points the user highlighted. The January 2024
              round closed at $300 million and a $5 billion pre-money valuation, led by JPMorgan Chase with Mitsui,
              Amgen, and Honeywell participating; by Quantinuum's own telling that brought total capital raised since
              inception to about $625 million. On September 4, 2025 Honeywell announced a second marquee financing:
              approximately $600 million at a $10 billion pre-money valuation, with Quanta Computer, NVentures, and QED
              joining existing backers including JPMorganChase, Mitsui, Amgen, and Honeywell. The May 2026 S-1 then
              disclosed that Quantinuum issued $838.8 million of Series B preferred stock in November 2025, implying the
              late-2025 financing expanded materially beyond the headline $600 million announcement.


              IPO disclosure also gave the first clean view into economics. Quantinuum generated only $30.9 million of
              2025 revenue against a $192.6 million net loss, after $23.0 million of revenue and a $144.1 million net
              loss in 2024. For the quarter ended March 31, 2026 revenue dropped to $5.2 million and the loss widened to
              $136.6 million, although cash remained strong at $677.0 million after the 2025 financing. Headcount,
              meanwhile, expanded from almost 400 at formation to almost 500 in 2024, over 630 by late 2025, and
              approximately 700 by March 2026. Scale is therefore real in people, facilities, systems, and capital
              raised; commercial maturity is not yet comparable. Exact paying-customer count is still undisclosed, and
              the S-1 indicates meaningful revenue concentration in a small number of accounts, which is a notable
              diligence point before accepting IPO-style valuation multiples.
