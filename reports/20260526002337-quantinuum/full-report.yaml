            body: >-
              Quoted public quantum comps are useful here as sentiment markers rather than as clean fundamental anchors.
              IonQ, D-Wave, Rigetti, and Quantum Computing Inc. all carry multi-billion-dollar market capitalizations
              despite small revenue bases and ongoing net losses, which means Quantinuum’s $10 billion private mark sits
              inside a public market that is still paying aggressively for optionality. On that basis, Quantinuum is not
              obviously overpriced relative to the listed cluster; it sits below IonQ and near D-Wave while offering a
              stronger backer set and richer customer proof. But that same comp set is exactly why underwriting is
              dangerous: public quantum multiples are so loose that they cannot tell investors whether Quantinuum is
              cheap, only whether the market currently tolerates expensive stories. The right way to use the comp table
              is therefore to frame valuation ranges. If S-1 disclosure validates commercial scale and the IPO window
              stays open, upside exists; if the filing shows thin revenue or investor-unfriendly terms, downside to the
