      - number: '7.2'
        title: Ownership, Liquidity, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Honeywell still sits at the center of Quantinuum's governance and liquidity story. Public filing
              announcements show that the IPO process has advanced to a public S-1, but the company still has not
              disclosed share count, price range, or final timing, and Honeywell described the offering as subject to
              market conditions. That means the company's exit path, free-float depth, and minority-investor protections
              remain open questions at the exact moment public markets are testing whether quantum computing deserves
              premium late-stage multiples. At the same time, export-control risk has moved from abstract policy noise
              to live operating constraint. BIS now controls quantum computers, related software, and related technology
              globally; deemed-export reporting and possible future licensing create friction for the international
              talent pool on which quantum companies rely. Legal analyses also point to expanded CFIUS sensitivity and
              compliance complexity, which means ownership, hiring, and cross-border collaboration can tighten together
              rather than independently.
