      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Quantinuum’s market is segmented less by company size than by workflow and budget owner. In pharma,
              chemicals, and materials, the user is typically a computational chemist or research scientist, while the
              payer sits in R&D, advanced materials, or innovation budgets. In finance, the user is a quant, research,
              or fraud/NLP team; the payer is a central innovation, security, or quantitative-research budget. In
              aerospace and defense, public evidence points to engineering and advanced-computing teams working against
              fluid dynamics, navigation, or optimization problems, with payer authority more likely to sit in
              long-cycle engineering or public-program budgets than in mainstream IT.


              Governments and public labs form a separate segment because they buy for national capability, open-access
              testbeds, and workforce development as much as for immediate application ROI. Cybersecurity is another
              distinct segment: Quantum Origin does not sell “all cybersecurity,” but rather a narrow
              cryptographic-strengthening capability purchased by CISOs, platform-security teams, or public cryptography
              stakeholders. Finally, developer tooling and cloud access create a software-led entry point where a
              toolchain owner or algorithms team can become the initial buyer before the larger hardware or application
              budget is unlocked.


              This segmentation matters because Quantinuum’s monetization path is likely land-and-expand. Early buyers
              often start with access, experimentation, and workflow validation before graduating to larger chemistry,
              optimization, or security deployments.
