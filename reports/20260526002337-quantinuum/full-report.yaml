            body: >-
              Quantinuum's public customer proof is credible but narrow. Helios marketing and partner announcements
              repeatedly point back to the same flagship accounts—BMW, JPMorganChase, Amgen, SoftBank, Microsoft,
              NVIDIA, and RIKEN—without public revenue concentration, renewal, or pilot-to-production conversion data.
              That concentration risk matters because the broader market is still sorting out which quantum use cases
              can carry durable budgets. SoftBank's own partnership announcement is unusually candid that revenue
              models, pricing logic, service timing, and commercially relevant use cases remain under construction.
              Meanwhile, competition is intensifying across modalities rather than converging toward a single winner.
              Google is showing below-threshold superconducting error correction, IBM is scaling fleet availability and
              data-center architecture, IonQ is pitching trapped-ion systems into production environments, and QuEra is
              arguing neutral atoms scale more cleanly without cryogenics. Public-market scrutiny can therefore hit
              Quantinuum from both sides: weaker-than-expected adoption would challenge the entire sector, while
              stronger rival milestones could narrow the premium investors are willing to pay for Quantinuum's lead.
