      - number: '5.3'
        title: Software stack, benchmarks, and roadmap maturity
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's software layer is deeper than a simple SDK wrapper. TKET is a real compiler/runtime layer
              with a public C++ core, Python bindings, extension packages, and active May 2026 release cadence. The
              public docs frame it as a build-compile-run stack, while the H1 and H2 data sheets explicitly say TKET
              optimizes submitted circuits in the managed stack. Developer signal is meaningful here: PyPI shows
              cross-platform pytket packaging and Pepy shows millions of cumulative downloads, suggesting TKET is the
              most mature public software surface in the portfolio.


              The benchmark ladder is also stronger than many quantum startups can show. H1 publishes 20 qubits and
              1×10^-3 typical two-qubit infidelity; H2 publishes 56 qubits with the same typical two-qubit infidelity
              band plus the larger racetrack QCCD; Helios publishes 98 qubits and improves typical two-qubit infidelity
              to 8×10^-4 while adding real-time control features. Roadmap maturity is not just a future promise either.
              Quantinuum and Microsoft publicized logical-qubit results on H2, and Quantinuum plus NVIDIA now describe
              Helios as the launch point for GPU-linked real-time decoding and hybrid quantum-AI workflows. Still, the
              roadmap should be treated as maturing rather than finished: TKET is broadly public, InQuanto is
              productized but company-claimed on many benefit metrics, lambeq is active but niche, and Helios is
              early-enterprise rather than a broadly proven utility service.
