      - number: '4.2'
        title: GTM Motion & Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Quantinuum’s go-to-market motion looks like long-cycle enterprise selling blended with partner channels
              and scientific services. The S-1 frames the business as hardware-led and software-enhanced, and the
              website shows direct subscriptions, Azure subscriptions, consulting services, InQuanto partner residency,
              and multi-year research collaborations. Public traction proxies exist, but they are not the usual SaaS
              efficiency metrics. Quantinuum disclosed $79.3 million of 2025 bookings, about $80.7 million of remaining
              performance obligations at year-end, and Honeywell separately disclosed roughly $81-82 million of backlog
              attributable to Quantinuum. Nexus also had more than 150 organizations and 750 active users by March 2026.


              Those are directionally useful, but they come with a major warning: public customer concentration is
              extreme and production-scale conversion remains unclear. RIKEN alone represented 60% of 2025 revenue, and
              government-linked demand was an even larger share of Q1 2026. The S-1 explicitly warns that many large
              relationships are pilots, research collaborations, or grant-funded projects rather than durable production
              contracts. BMW and RIKEN are credible logos and useful evidence of commercial relevance, but they do not
              yet prove repeatable at-scale deployment. For this chapter, the correct sales-efficiency read-through is
              that Quantinuum has strong enterprise access and technical credibility, but poor public evidence on
              repeatability, cohort behavior, CAC, or payback.
