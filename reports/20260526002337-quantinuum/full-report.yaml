chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, merger origin, and product stack
        blocks:
          - type: paragraph
            body: >-
              Quantinuum presents itself as a full-stack quantum computing company that combines trapped-ion hardware,
              middleware, developer tools, and application software rather than selling a stand-alone processor. The
              company was created on November 30, 2021 when Honeywell Quantum Solutions and Cambridge Quantum closed
              their business combination. That origin still shapes the business today: Honeywell contributed the
              trapped-ion hardware lineage, while Cambridge Quantum contributed the software, middleware, and
              applications stack. The company's principal executive offices are in Broomfield, Colorado, and public
              materials also frame Cambridge, U.K. as a continuing European headquarters. By 2026 Quantinuum was also
              publicly listing facilities or operations across the United States, United Kingdom, Germany, Japan, and
              Singapore.


              The product stack is broader than H-Series compute access alone. Quantinuum Systems package trapped-ion
              QCCD hardware with all-to-all connectivity and mid-circuit measurement; customers can access that hardware
              directly from Quantinuum, through Microsoft Azure, or through on-prem deployments such as RIKEN. Around
              the hardware, Quantinuum sells Quantum Origin for software-based quantum randomness and post-quantum
              security, InQuanto for quantum chemistry and materials simulation workflows, and developer tools including
              TKET, Guppy, and lambeq. That integrated positioning is the core one-line business model for the rest of
              the report: Quantinuum is trying to monetize a vertically integrated hardware-plus-software stack before
              universal fault tolerance fully arrives.
