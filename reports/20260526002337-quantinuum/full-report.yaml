  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Modality, and the Real Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's competitor map is broader than the obvious trapped-ion comparison set. The direct modal
              rivals include IonQ in trapped ions, IBM, Google, Rigetti, IQM, and Oxford Quantum Circuits in
              superconducting systems, QuEra in neutral atoms, and PsiQuantum in photonics. D-Wave matters less as a
              head-on architecture peer than as a substitute for buyers whose real job is near-term optimization, not
              gate-model fault tolerance. The status quo is also still powerful: many enterprises can rationally stay
              with classical HPC, simulators, or internal exploratory teams while the hardware market remains immature.
              That matters because Quantinuum does not win simply by having strong hardware. It has to beat three
              different alternatives at once: better funded universal hardware platforms, easier-to-buy substitutes, and
              the default choice to wait. On today's public record, Quantinuum is strongest where buyers value
              high-fidelity trapped-ion performance and enterprise deployment options now, but the market is still open
              enough that modality diversity itself is a competitive risk rather than proof of a settled winner.
