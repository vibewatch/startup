companyProfile:
  summary: >-
    Decart is an Israeli AI infrastructure and application company built around DOS, Lucy, and Oasis: an optimization
    layer for inference, a live video-editing model, and a physical-AI world model aimed at autonomous vehicles and
    robotics. The 2026 public record adds confirmation of a $300 million financing, more than $450 million of total
    disclosed funding, and strategic relationships with Amazon and NVIDIA, but the operating baseline remains opaque
    because revenue, customer counts, and governance details are still not publicly disclosed.
