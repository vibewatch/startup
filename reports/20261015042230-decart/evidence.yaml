evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-backed revenue, ARR, burn, and gross-margin disclosure for 2025-2026.
    whyItMatters: Capital raised and valuation are public, but operating performance is still too opaque to anchor underwriting.
    diligencePath: >-
      Request board materials, investor updates, or audited/management financial statements covering the 2025-2026
      period.
    relatedQuestionRefs:
      - QO004
      - QO006
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: Current customer count, customer concentration, contract duration, and present headcount by function/location.
    whyItMatters: >-
      Without customer and org-scale metrics, it is hard to judge repeatability, deployment depth, or execution
      capacity.
    diligencePath: >-
      Ask for customer cohort data, top-account revenue concentration, active deployments, and an organizational
      headcount snapshot.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Full board composition, cap-table ownership, liquidation preferences, and governance rights tied to the 2026
      round.
    whyItMatters: >-
      Strategic investors and customers appear important, but public sources do not show who controls decisions or
      downside protections.
    diligencePath: Obtain the post-round cap table, voting agreements, and board observer/seat allocations.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: corporate-locus
    missingEvidence: >-
      Company-issued confirmation of legal domicile, operating headquarters, and the current split between Israel and
      San Francisco.
    whyItMatters: The retained sources conflict on headquarters language, which affects talent, regulatory, and tax diligence.
    diligencePath: >-
      Verify the registered entity, principal office, and executive footprint from official corporate records or company
      documentation.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: minor
    topic: early-history
    missingEvidence: >-
      Higher-reputation dated sources covering formation, stealth emergence, and the first commercial contracts before
      2025.
    whyItMatters: >-
      The early milestone narrative currently depends on a single lower-reputation profile source and should not be
      over-weighted.
    diligencePath: Pull the original seed announcement, early press coverage, or founder interviews with dated publication metadata.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent category data with methodology, period, geography, and a common spend denominator for inference
      optimization, live video transformation, and physical-AI simulation.
    whyItMatters: Without common-unit category evidence, TAM, SAM, SOM, market share, and growth-rate claims would be unsupported.
    diligencePath: >-
      Obtain current analyst, trade-association, procurement, or public-company data for each wedge and reconcile
      category overlap before aggregating any estimate.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-segmentation
    missingEvidence: >-
      Product-level revenue, paying-customer counts, retention, contract duration, gross margin, and customer
      concentration for DOS, Lucy, and Oasis.
    whyItMatters: >-
      These metrics determine whether technical adoption is converting into repeatable paid demand and whether the three
      market wedges deserve similar valuation treatment.
    diligencePath: >-
      Request audited revenue and contract cohorts by product, including customer identities, renewal history,
      deployment status, pricing basis, and contribution margin.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: buyer-budget-evidence
    missingEvidence: >-
      Buyer-authored procurement records or production case studies that identify recurring budget owners, deployment
      scope, measured ROI, and paid contract value.
    whyItMatters: >-
      Vendor positioning identifies likely users but does not establish who controls recurring spend or how quickly
      trials convert into scaled production.
    diligencePath: >-
      Interview named customers and partners, review invoices and contracts, and seek customer-side case studies with
      deployment dates, spend, outcomes, and renewal decisions.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public or diligence-room pricing sheets, contract duration, discounting norms, and usage-based billing details for
      Decart's live video and Oasis products.
    whyItMatters: >-
      Without commercial terms, it is hard to judge whether Decart's latency edge clears buyer ROI hurdles or can be
      defended against cheaper substitutes.
    diligencePath: >-
      Request current price books, sample MSAs / order forms, and recent paid-deployment case studies segmented by Lucy,
      Oasis, and DOS.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named production customers, deployment scope, retention, and quantified outcomes for Lucy and Oasis beyond partner
      announcements and demo surfaces.
    whyItMatters: >-
      Competitive durability depends on whether enterprises and robotics teams stay in production, not only on whether
      the technology demos well.
    diligencePath: >-
      Obtain customer references, renewal data, active-program counts, and implementation timelines for at least one
      live-video and one physical-AI deployment.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: minor
    topic: independent-benchmarking
    missingEvidence: >-
      Neutral benchmark data comparing Decart latency, quality, and total deployment burden against batch video tools
      and simulation substitutes.
    whyItMatters: >-
      The current thesis rests on positioning claims and one independent comparison article, which is enough to map the
      market but not enough to settle performance leadership.
    diligencePath: >-
      Collect third-party evaluations or run side-by-side customer workflow tests across at least one batch video
      product and one simulation substitute.
    relatedQuestionRefs:
      - QP002
      - QP003
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Product-level list versus realized pricing, contract duration, committed minimums, and discount structure for DOS,
      Lucy, and Oasis.
    whyItMatters: >-
      Public product positioning does not show what customers actually pay or how revenue converts from pilots into
      durable contracts.
    diligencePath: >-
      Request current pricing sheets, sample customer contracts, and product-level bookings by line for the last two
      quarters.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: underwriting-gaps
    missingEvidence: >-
      Revenue or ARR by product line, gross margin, CAC, payback, burn, cash balance, runway, and customer
      concentration.
    whyItMatters: >-
      These are the minimum inputs required to judge revenue quality, margin path, and whether the current valuation is
      financeable.
    diligencePath: >-
      Obtain board or investor reporting for P&L, cash flow, cohort metrics, and top-customer concentration by product
      line.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation
