    whyItMatters: >-
      Public coverage references roughly $3.1B to nearly $4B, which is directionally consistent but too wide for precise
      underwriting.
    diligencePath: Confirm the signed round terms, cap table, and security preferences directly from company financing documents.
    relatedQuestionRefs:
      - QI006
      - QI008
