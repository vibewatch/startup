    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [track, medium, high, stretched, "Stay engaged, but require either a materially better entry price or hard diligence proof on revenue quality, customer concentration, governance, and preference terms before underwriting a buy."]
    notes: "Public anchors are the reported $4B May 2026 round, more than $450M of total funding, and a rumored ~$7B strategic-takeout discussion; no public revenue or capital-stack disclosure supports finer precision."
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV012
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Strategic validation improved sharply once Amazon became a customer and NVIDIA invested and partnered, which is a stronger signal than a standalone product demo.", "The positive read strengthens further if Decart discloses contract scale, customer concentration, or repeat production deployments with hyperscalers or major enterprises."]
      - [Thesis, "Decart has visible technical proof across DOS, Lucy, and Oasis, so the story is not pre-product or pre-platform.", "The positive read strengthens if third-party benchmarks or customer case studies show durable usage and economics rather than launch excitement."]
      - [Thesis, "The jump from Seed to Series A to a $300M round suggests investors value scarce real-time AI infrastructure and world-model capabilities.", "The positive read strengthens if new investors can enter without a punitive preference stack or heavy structured downside protection."]
      - [Anti-thesis, "Public evidence still does not disclose audited revenue, run-rate revenue, gross margin, burn, or retention, so the market cannot tie valuation to recurring economics.", "This concern eases if diligence surfaces audited revenue/ARR, margin, and cohort-quality evidence that explains why the company deserves to trade above the last private mark."]
      - [Anti-thesis, "A rumored ~$7B strategic process is not the same thing as a signed transaction, a closed financing, or a comp-backed standalone valuation.", "This concern eases if a signed strategic deal, a priced round, or a credible secondary validates a meaningfully higher clearing price."]
      - [Anti-thesis, "Cap-table ownership, liquidation preferences, board control, and debt or project-finance obligations remain undisclosed in the reviewed public sources.", "This concern eases only after full financing documents and governance rights are opened in diligence."]
    notes: "Rows separate durable upside proof from underwriting gaps; they are not weighted scores, and public evidence remains materially incomplete on commercial quality and capital structure."
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Amazon or another strategic buyer converts current interest into a real process, and DOS/Lucy/Oasis turn partner validation into scaled enterprise deployments.", "Upside is anchored to the rumored ~$7B strategic ceiling, with further value only if commercial proof catches up to technical scarcity.", "Deal slippage, customer concentration, or weak diligence quality on revenue and margins.", "Requires a signed process, a priced transaction, or hard KPI disclosure."]
      - [Base, "Decart keeps technical momentum and strategic relationships, but public commercial disclosure stays limited through the next diligence window.", "The last clear mark is the reported $4B round, so the prudent stance is to watch execution rather than assume a clean re-rating above that level.", "Narrative outruns monetization, multiple compression in AI infrastructure, or unclear financing terms for new money.", "Most consistent with the current public record."]
      - [Bear, "Strategic interest fades, enterprise conversion takes longer than expected, or new capital arrives with structure that protects insiders ahead of new entrants.", "Downside can drift back toward or below the last private mark because the public record does not yet prove durable recurring economics or a clean downside stack.", "Delayed commercialization, margin pressure, dilution, or adverse terms hidden in the cap table.", "Likely if the next financing or strategic review does not validate the current narrative."]
    notes: "Ranges are expressed as public-price anchors and direction of travel because the reviewed sources do not disclose the revenue, retention, or margin data needed for a tighter model-derived fair-value range."
    claimRefs:
      - CV004
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Technical proof and strategic validation create upside, but sparse commercial and
      governance disclosure keeps the recommendation at track.
    data:
      nodes:
        - id: technical-proof
          label: Technical proof
          value: "DOS plus Lucy and Oasis"
          note: "There is visible product proof in real-time video and physical-AI simulation."
        - id: strategic-validation
          label: Strategic validation
          value: "Amazon customer; NVIDIA investor"
          note: "Large ecosystem players have already engaged as customer, investor, or partner."
        - id: commercial-opacity
          label: Commercial opacity
          value: "No public revenue quality disclosure"
          note: "The company cites contracts, but the public record still lacks audited revenue, retention, and margin detail."
        - id: price-anchors
          label: Price anchors
          value: "Reported $4B round; rumored ~$7B ceiling"
          note: "The record contains a current financing mark and a strategic-takeout rumor, but not a broad comp set."
        - id: structure-gap
          label: Capital structure gap
          value: "Preferences and control undisclosed"
          note: "New-money downside cannot be underwritten cleanly without the full cap table and governance terms."
        - id: recommendation
          label: Recommendation
          value: "Track / high risk / stretched"
          note: "Move to buy only if diligence closes the economic and structural disclosure gaps or price resets."
      edges:
        - from: technical-proof
          to: strategic-validation
          label: enables
        - from: strategic-validation
          to: price-anchors
          label: supports upside
        - from: commercial-opacity
          to: price-anchors
          label: limits precision
        - from: price-anchors
          to: recommendation
          label: frames entry
        - from: structure-gap
          to: recommendation
          label: keeps risk high
    approximationNotes: "The flow is analytical rather than quantitative: it explains how current evidence moves the call, not a mathematically scored model."
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
