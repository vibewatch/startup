schemaVersion: report-v2
artifact: valuation
slug: decart
runDate: 2026-10-15
company:
  name: Decart
chapter:
  number: 8
  title: Valuation
  summary: >-
    Decart has unusual strategic momentum, but the public valuation record is still sparse:
    a reported $4 billion May 2026 round, more than $450 million of total funding, and a
    rumored ~$7 billion strategic-takeout ceiling. That is enough to justify a track call,
    not a buy, until revenue quality, governance, and capital-structure evidence catch up to
    the product and partner narrative.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The price-sensitive call remains track with medium confidence, high risk, and a
      stretched valuation stance. Public evidence shows real strategic validation: Calcalist
      reports a $300 million round at an estimated $4 billion valuation with Amazon as a
      strategic customer and NVIDIA as both investor and partner, while The Wall Street
      Journal reports Amazon discussed an acquisition around $7 billion. But those anchors
      still bracket a wide range rather than underwriting a precise entry price. The reviewed
      sources do not disclose audited revenue, gross margin, retention, or the preference
      stack, so the market can observe technical proof and partner interest without seeing
      the commercial quality that should justify paying above the last mark.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: upside-proof-vs-underwriting-gaps
    title: Upside proof versus underwriting gaps
    body: >-
      The upside case is not imaginary. Decart presents a coherent stack of DOS plus Lucy
      and Oasis, with Lucy positioned for live video editing and Oasis 3 aimed first at
      autonomous-vehicle simulation and then broader physical-AI use cases. That technical
      narrative has attracted heavyweight validation: Calcalist says Amazon joined as a
      strategic customer and NVIDIA invested, while the company says it is already generating
      revenue through contracts with large cloud providers, AI laboratories, and hyperscale
      companies. The underwriting problem is that the public package stops short of the
      numbers an investor needs. AIPressRoom explicitly notes that Decart did not disclose
      current valuation or run-rate revenue, and the reviewed public sources still do not
      disclose gross margin, retention, customer concentration, board control, or liquidation
      preferences.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV008
      - CV009
      - CV013
    tableRefs:
      - TV003
  - id: scenario-envelope-and-diligence-triggers
    title: Scenario envelope and diligence triggers
    body: >-
      The public record supports an outcome envelope, not a clean fair-value point estimate.
      The best hard price anchor remains the reported $4 billion May 2026 financing. The
      best upside signal is the rumored ~$7 billion Amazon process, which could prove
      strategic scarcity but is not equivalent to a signed transaction or a standalone public
      comparable set. Meanwhile, lower-quality directories still surface stale or partial
      funding snapshots, which is another sign that the external record is thin outside a few
      key reports. That makes diligence on current revenue quality, customer concentration,
      preference terms, and exit process discipline the final gating work: if those items
      clear, the range can re-rate upward; if they do not, the downside can fall back toward
      or below the last private mark.
    claimRefs:
      - CV004
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Decart has enough product and partner proof to stay investable, but not enough public
      commercial and governance disclosure to underwrite an aggressive entry above the last
      private round.
    claimRefs:
      - CV004
      - CV007
      - CV009
      - CV014
  - calloutType: risk
    title: The missing data is economic, not technical
    body: >-
      The main gating questions are revenue quality, retention, margins, concentration, and
      preference terms, not whether the company can build compelling product demos.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV013
