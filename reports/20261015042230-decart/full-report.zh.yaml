chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的事实图景以产品为中心，而非以指标为中心。Decart 在自有网站上称，公司的目标是“打造让 AI 以现实速度运行的基础设施和模型”；DOS 是优化与推理 / 训练层，Lucy 和 Oasis
              则是面向实时视频与实体 AI 仿真的产品化世界模型入口。官方产品页将分工讲得很具体：Lucy 面向品牌、创作者、游戏和商业场景的实时视频编辑；Oasis 则是可通过 API
              访问、低延迟的机器人与自动驾驶仿真基础设施。这支持一个工作判断：Decart 是一家同时将技术栈性能和下游模型用例变现的私有 AI
              应用基础设施公司，而不只是单一演示产品。当前公开材料明显缺少的是支撑这一定位的运营基线：留存来源没有披露经常性收入、客户数量或员工数，因此产品雄心证据充分，规模却无法确认。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
              - CO015
