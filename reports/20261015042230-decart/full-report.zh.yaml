      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              核心驱动因素是低延迟生成打开了离线渲染无法服务的工作流：实时编辑、响应式世界和闭环机器人训练。核心约束则是能否证明可持续经济性。ToolDirectory 指出其保真度与批量渲染器之间存在取舍，TechTimes
              报道增长不均衡且很大程度依赖定制合作；两者都引出了产品深度、可重复性和销售集中度问题。边缘交付在全球部署前也可能增加基础设施依赖。就估值而言，技术表现和发布期用户参与足以说明品类真实存在，但在 Decart 披露
              DOS、Lucy 和 Oasis 各自的分部收入、付费客户数、留存、合同期限、毛利率和客户集中度之前，公开市场份额数据不足以支撑收入倍数。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM013
              - CM016
