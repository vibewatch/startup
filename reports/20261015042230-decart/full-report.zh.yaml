            body: >-
              Decart 的公开产品面已经收拢成分层技术栈，而不是一组研究演示。公司称 DOS 是性能层，Lucy 和 Oasis 是其上暴露的模型系列。这很重要，因为公开价值主张分成两类客户工作流：Lucy
              面向企业、品牌和创作者的实时视频变换；Oasis 3 面向需要互动仿真而非离线渲染的实体 AI 团队。产品故事靠实时运行形成差异化，但各产品的证据质量不同：Oasis 有 API 和 SDK
              细节，足以检查工作流；而在本章证据集中，Lucy 更多仍由营销和媒体报道描述，公开技术集成材料较少。
