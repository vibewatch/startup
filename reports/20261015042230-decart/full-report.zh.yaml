      - number: '1.2'
        title: 领导层、资本与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              独立的 2026 年 5 月报道提供了最可用的领导层与资本快照。Calcalist 指出 Dr. Dean Leitersdorf 任 CEO、Moshe Shalev 任 CPO，并称两人都曾服役于 Unit
              8200；AIPressRoom 至少交叉确认了这对创始人，但运营细节较少。同一批 2026 年 5 月报道称，Decart 完成了由 Radical Ventures 领投的 3 亿美元融资，已披露融资总额超过
              4.5 亿美元，并在此前 2025 年 8 月一轮据报道估值 31 亿美元的融资后达到预估约 40 亿美元估值。同样重要的是，Calcalist 将这轮融资与战略交易对手而非纯财务投资联系起来：Amazon
              被描述为战略客户，NVIDIA 同时是投资方和业务伙伴。这一组合对后续尽调很关键，因为它表明 Decart
              的股权结构表、分销路径和算力栈路线已经与超大规模云厂商和芯片平台关系交织；但留存公开来源仍未披露董事会构成、治理权或股权控制。
