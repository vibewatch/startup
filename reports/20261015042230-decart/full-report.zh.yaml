    Decart 是一家以 DOS、Lucy 和 Oasis 为核心的以色列 AI 基础设施与应用公司：分别提供推理优化层、实时视频编辑模型，以及面向自动驾驶和机器人的实体 AI 世界模型。2026 年公开记录新增了 3
