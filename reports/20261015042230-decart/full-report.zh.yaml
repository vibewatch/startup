        title: 受证据约束的规模估算
        blocks:
          - type: paragraph
            body: >-
              留存来源没有提供 Decart 三个市场切口共同单位、且经过独立测量的市场支出估算。最强的量化信号反而是彼此不可相加的公司特定指标：American Compute 报告 7 天内服务了 981B 个开放权重模型
              token；Decart 称 Oasis 在 72 小时内达到 1M 用户；一份公司发布的公告报告 Comcast 与 NVIDIA 边缘基准测试达到低于 35 毫秒的性能。TechTimes
              另称年收入达到数千万美元，增长不均衡且主要由定制芯片厂商合作推动，但该报道既不是经审计的分部收入，也不是 ARR。这些信号能证明活跃度、技术可行性和一定商业化，却不能证明品类
              TAM、可服务支出、市场份额或可重复合同价值。
