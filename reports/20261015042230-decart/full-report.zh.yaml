  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 正方
        - Amazon 成为客户、NVIDIA 投资并合作后，战略验证显著增强；这比单独的产品演示更有说服力。
        - 如果 Decart 披露合同规模、客户集中度，或与超大规模厂商及大型企业的重复生产部署，正面判断还会进一步增强。
      - - 正方
        - Decart 在 DOS、Lucy 和 Oasis 上都有可见的技术证明，因此这不是一个产品前或平台前的故事。
        - 如果第三方基准或客户案例证明使用量和经济性能够持续，而不只是发布期的热度，正面判断会更有支撑。
      - - 投资论点
        - 从 Seed 轮、Series A 轮一路到 $300M 轮的跃升，说明投资人看重稀缺的实时 AI 基础设施和世界模型能力。
        - 如果新投资人进入时不必承担惩罚性优先股堆叠或沉重的结构化下行保护，正面判断会更有支撑。
      - - 反论点
        - 公开证据仍未披露经审计收入、运行率收入、毛利率、烧钱速度或留存，因此市场无法把估值与经常性经济性挂钩。
        - 如果尽调发现经审计收入 / ARR、利润率和用户群质量证据，能够解释公司为何值得高于上一轮私募估值交易，这一担忧会缓解。
      - - 反论点
        - 传闻中的约 $7B 战略交易流程，不等于已签署的交易、已完成的融资，或有可比公司支撑的独立估值。
        - 如果已签署的战略交易、定价轮融资或可信的二级交易验证出明显更高的成交价格，这一担忧会缓解。
      - - 反论点
        - 审阅过的公开来源仍未披露股权结构表持股、清算优先权、董事会控制权，以及债务或项目融资义务。
        - 只有在尽调开放完整融资文件和治理权利后，这一担忧才会缓解。
    notes: 各行将可持续上行空间的证据与投资判断缺口分开；它们不是加权评分，而商业质量和资本结构的公开证据仍明显不完整。
