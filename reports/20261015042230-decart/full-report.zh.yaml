      - number: '3.3'
        title: 分销、锁定与在位者回应
        blocks:
          - type: paragraph
            body: >-
              Decart 的护城河不只在模型行为，也在模型底下的 DOS 技术栈。第三方报道将 DOS 描述为感知硬件、可横跨 Nvidia GPU、Amazon Trainium 和 Google TPU
              使用；相较于绑定单一供应商的优化层，这降低了芯片厂商锁定，并让 Decart 能把基础设施卖进客户既有环境。Calcalist 和 AIPressRoom 还称 Amazon 已是战略客户，而 Nvidia
              同时是投资方和业务伙伴。这种组合可以加速企业信任和分销，但也意味着最强大的在位者可以借助云、芯片或前沿实验室关系打包回应，而不必只逐项复制产品功能。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: 持久性限制与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              指定证据支持真实的延迟切口，但不能证明 Decart 能赢得所有视频或仿真需求。比较来源明确把精致叙事镜头留给 Runway、Veo 和
              Sora；这家公司显然参加的是另一场比赛，而不是一场普适的质量竞赛。公开定价和合同结构同样薄弱：来源展示了免费演示、开放权重、API
              访问和“联系专家”路径，却没有目录价、折扣或客户支出。最后，收购报道带来生态风险：如果 Anthropic 交易收紧消费者端点的访问，或把团队转向基础设施工作，第三方对 Decart
              当前产品表面的依赖方式就会改变。
            claimRefs:
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 延迟是真正的市场切口
            body: 留存证据持续将 Decart 的差异化归因于实时响应和闭环控制，而不是将其视为最好的全用途离线视频模型。
