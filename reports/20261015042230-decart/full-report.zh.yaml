      - number: '3.2'
        title: 能力与产品包装差异化
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，Decart 最清晰的差异化在于即时性。Lucy 被描述为面向企业、品牌和创作者、最高 100 FPS 的低于 40ms 实时编辑；Oasis 则被描述为面向实体 AI、可通过 API
              访问且由动作条件驱动的世界模型，端到端延迟低于 200ms。独立比较文章强化了这一定位：MirageLSD 和 Lucy Edit 被放在实时或近实时区间，而 Runway、Veo 和 Sora
              被标为按分钟计算的单片工具，Cosmos 被标为离线仿真。包装方式也很关键：同一来源称 Mirage 托管且可免费试用，Lucy Edit 提供开放开发权重，而指定证据中的多家竞争者仍是专有托管工具。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP011
