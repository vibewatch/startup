              - CV007
              - CV009
              - CV014
          - type: callout
            title: 缺失数据是经济数据，不是技术数据
            body: 主要闸门问题是收入质量、留存、利润率、集中度和优先权条款，而不是公司能否做出有吸引力的产品演示。
            calloutType: risk
            claimRefs:
              - CV001
