        title: 规模信号、里程碑与待解问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录方向很强，但来源并不均衡。官网目前突出展示 2026 年融资以及 DOS 2.0、Lucy 和 Oasis 更新；Mint 则补充了 2026 年 10 月的最新信号：有报道称 Amazon 正以约
              70 亿美元洽谈收购，但仍未获确认。更早的运营历史较不稳固：AI Chopping Block 称公司于 2023 年 9 月注册，并在 2023 年 12
              月已有付费客户，但这段早期商业时间线在本组材料中只有单一来源支持。尽调还应厘清一个重要的身份歧义：Calcalist 多次将 Decart 描述为 2023 年末成立的以色列公司，而 Mint
              称其总部在旧金山；这可能反映法定注册地与市场拓展所在地的区别，但当前留存记录无法解决。总体而言，融资势头和产品节奏比公司当前运营规模、治理结构及准确企业所在地更容易验证。
