          - type: paragraph
            body: >-
              对价格敏感的判断仍是继续观察，信心中等、风险高，估值偏紧。公开证据显示真实战略验证：Calcalist 报道 3 亿美元融资、估计 40 亿美元估值、Amazon 为战略客户、NVIDIA
              同时是投资方和伙伴；The Wall Street Journal 报道 Amazon 曾讨论约 70
              亿美元收购。但这些锚点只是框出宽泛区间，并不足以支撑精确入场价。经审阅来源没有披露经审计收入、毛利率、留存或优先股堆叠，因此市场能看到技术证明和伙伴兴趣，却看不到足以支持高于上一轮价格的商业质量。
