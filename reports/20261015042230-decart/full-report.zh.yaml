  - id: FE001
    title: 产品架构图
    type: stack
    summary: Decart 的公开技术栈可拆为共享 DOS 基础设施、托管访问界面，以及两个可见的产品层：用于实时视频的 Lucy 和用于物理 AI 模拟的 Oasis。
    data:
      layers:
        - label: 体验层
          detail: 面向操作人员的实时工作流，Decart 的低延迟主张在这里最为关键。
          modules:
            - Lucy 实时视频工作流
            - Oasis 3 模拟工作流
          items:
            - label: Lucy 实时视频工作流
              detail: 企业、品牌和创作者实时改造直播流和视频片段。
            - label: Oasis 3 模拟工作流
              detail: AV 和机器人团队通过提示词构建环境，并在可响应的多视角世界中训练。
        - label: 产品层
          detail: 共享基础设施技术栈之上对外呈现的两个公开产品系列。
          modules:
            - Lucy
            - Oasis 3
          items:
            - label: Lucy 2 模型系列
              detail: 逐帧变换的实时视频和世界编辑。
            - label: Oasis / Oasis 3 模型系列
              detail: 面向物理 AI 的交互式世界生成和动作条件模拟。
        - label: 会话控制层
          detail: 有状态的运行时界面，将模型变成开发者可使用的服务。
          modules:
            - 托管 API 和 gRPC 会话
          items:
            - label: 托管 API 和 gRPC 会话
              detail: API 密钥认证、提示词生命周期，以及来自 Decart 管理端点的流式帧。
        - label: 开发者界面层
          detail: 让外部团队查看或开始集成该技术栈的公开材料。
          modules:
            - SDK 和演示界面
          items:
            - label: 公开 SDK 和演示界面
              detail: decart-oasis 软件包及 GitHub 关联的扩展内容，展示了初步的开发者工作流。
        - label: 平台层
          detail: 公司称共享的计算优化底座让两条产品线具备经济可行性。
          modules:
            - DOS 优化技术栈
          items:
            - label: DOS 优化技术栈
              detail: Decart 称其为驱动两条产品线的共享训练和推理层。
        - label: 治理层
          detail: 用于追踪训练输入和模型输出的内部工作流控制。
          modules:
            - 实验谱系和构件
          items:
            - label: 实验谱系和构件
              detail: 在 Oasis 3 开发期间，基于 W&B 追踪数据集、检查点和输出。
    approximationNotes: 该图是对公开产品界面的结构化综合，不是完整的内部系统图，也不是经过验证的部署拓扑。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE008
      - CE012
  - id: FU001
    title: 从病毒式产品验证到集中式企业扩张的客户旅程
    type: journey-map
    summary: 公开证据表明，Decart 正从消费级产品拉力走向一组集中的具名平台关系。
    data:
      items:
        - label: 病毒式产品入口
          phase: 认知
          actor: 游戏玩家、观众和创作者
          touchpoints:
            - Oasis 在 72 小时内达到 1M 用户
            - Lucy 被展示为面向创作者和观众的实时体验
          tone: opportunity
        - label: 工作流专项验证
          phase: 评估
          actor: 零售、广告和媒体团队
          touchpoints:
            - 虚拟试穿
            - 视频内动态广告
            - 直播
          tone: neutral
        - label: 物理 AI 设计合作伙伴推进
          phase: 技术验证
          actor: 机器人团队、AV 公司和研究团体
          touchpoints:
            - 可通过 API 访问的 Oasis 3
            - 面向自主系统的闭环模拟
          tone: opportunity
        - label: 具名基础设施基准
          phase: 部署证明
          actor: Comcast 和 NVIDIA
          touchpoints:
            - 低于 35ms 的边缘基准
            - 分布式基础设施合作
          tone: opportunity
        - label: 战略客户转化
          phase: 商业化
          actor: Amazon / AWS 和大型云平台
          touchpoints:
            - 战略客户披露
            - 与云服务商和 AI 实验室签订的合同
          tone: opportunity
        - label: 持续性瓶颈
          phase: 扩张风险
          actor: 投资人和尽调团队
          touchpoints:
            - 需要企业或平台分发，不能只靠演示视频
            - 未公开披露 NRR、流失率或客户集中度
          tone: risk
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在估值叙事和雄心勃勃的产品主张跑在具名客户、财务或合规证据之前的地方，剩余风险敞口最高。
    data:
      columns:
        - label: 可能性
        - label: 当前影响
        - label: 缓解措施成熟度
        - label: 剩余风险敞口
      rows:
        - label: 估值 / 交易反复
          note: 传闻中的结果影响重大，但尚未确认。
          values:
            - text: 中高
              tone: high
              note: 独立报道提到相关谈判，但仍可能破裂。
            - text: 高
              tone: critical
              note: 流程失败或重新定价会迅速重置市场预期。
            - text: 低
              tone: medium
              note: 公开的缓解依据主要是叙事，而不是已披露的运营证据。
            - text: 高
              tone: critical
              note: 没有收入支撑，不要按传闻估值做投资判断。
        - label: DOS + Lucy + Oasis 的执行
          note: 三个产品界面必须同时扩张。
          values:
            - text: 高
              tone: critical
              note: 官方材料强调基础设施和模型同步发布。
            - text: 高
              tone: critical
              note: 路线图延期会损害产品和融资可信度。
            - text: 中
              tone: medium
              note: 技术雄心可见，但独立的生产环境证据仍然有限。
            - text: 高
              tone: critical
              note: 在客户采用可以重复验证前，剩余风险仍然很高。
        - label: 平台 / 计算依赖
          note: 计算资源和云关系是这一故事的核心。
          values:
            - text: 中
              tone: medium
              note: 多云定位有所帮助，但关键合作伙伴的接入仍然重要。
            - text: 高
              tone: high
              note: 硬件或云端摩擦可能削弱经济性和延迟主张。
            - text: 中
              tone: medium
              note: 需要可移植性证据和合同持续性。
            - text: 高
              tone: high
              note: 在公开证据中，交易对手的议价能力仍然不可忽视。
        - label: 监管 / 安全尽调缺口
          note: 物理 AI 用例提高了尽调门槛。
          values:
            - text: 中
              tone: medium
              note: 指定资料池中没有出现已确认的公开执法问题。
            - text: 高
              tone: high
              note: 如果合规或验证薄弱，下行风险将达到投资论点层面。
            - text: 低
              tone: medium
              note: 当前来源集合没有显示成熟的公开控制措施。
            - text: 高
              tone: high
              note: 将缺失的合规证据视为未解决问题，而不是无害因素。
        - label: 客户证明和转化缺口
          note: 使用量头条新闻的声量高于具名付费部署证据。
          values:
            - text: 高
              tone: high
              note: 当前公开资料仍缺少具名付费客户和续约证明。
            - text: 高
              tone: high
              note: 商业牵引风险决定高溢价估值叙事能否成立。
            - text: 低
              tone: medium
              note: 公开的缓解依据仍主要是营销材料和宽泛的垂直行业提及。
            - text: 高
              tone: critical
              note: 在展示收入转化前，剩余风险敞口仍然很高。
        - label: 财务不透明
          note: 融资额已公开，但运营质量大多仍未披露。
          values:
            - text: 中
              tone: medium
              note: 每当市场要求经审计收入、烧钱速度或利润率背景时，风险就会显现。
            - text: 高
              tone: high
              note: 缺失的经济性数据可能在融资或并购重置中迅速压缩估值。
            - text: 低
              tone: medium
              note: 没有公开的收入质量桥接分析。
            - text: 高
              tone: high
              note: 将缺失的财务细节视为当前投资判断的约束。
    approximationNotes: 评级将引用的证据综合为分类风险判断，而不是数值概率。
    claimRefs:
      - CR006
      - CR007
      - CR009
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 技术证明和战略验证创造上行空间，但稀疏的商业和治理披露使推荐仍停留在跟踪。
    data:
      nodes:
        - id: technical-proof
          label: 技术证明
          value: DOS plus Lucy and Oasis
          note: 实时视频和物理 AI 模拟已有可见的产品证明。
        - id: strategic-validation
          label: 战略验证
          value: Amazon customer; NVIDIA investor
          note: 大型生态参与者已经以客户、投资人或合作伙伴身份参与其中。
        - id: commercial-opacity
          label: 商业不透明
          value: No public revenue quality disclosure
          note: 公司提到合同，但公开记录仍缺少经审计收入、留存和利润率细节。
        - id: price-anchors
          label: 价格锚点
          value: Reported $4B round; rumored ~$7B ceiling
          note: 记录包含当前融资估值标记和战略收购传闻，但没有广泛的可比公司集合。
        - id: structure-gap
          label: 资本结构缺口
          value: Preferences and control undisclosed
          note: 没有完整股权结构表和治理条款，无法干净地评估新资金的下行风险。
        - id: recommendation
          label: 推荐
          value: Track / high risk / stretched
          note: 只有在尽调填补经济性和结构性披露缺口，或价格重置后，才转为买入。
      edges:
        - from: technical-proof
          to: strategic-validation
          label: 促成
        - from: strategic-validation
          to: price-anchors
          label: 支持上行
        - from: commercial-opacity
          to: price-anchors
          label: 限制精确度
        - from: price-anchors
          to: recommendation
          label: 界定入场
        - from: structure-gap
          to: recommendation
          label: 维持高风险
    approximationNotes: 该流程是分析性的而非量化的：它解释当前证据如何推动投资判断，而不是展示数学评分模型。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
