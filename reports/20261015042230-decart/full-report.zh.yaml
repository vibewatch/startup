      - number: '4.3'
        title: 新资本缓解近期压力，但核心投资判断数据仍属私有
        blocks:
          - type: paragraph
            body: >-
              财务上最明确的新事实是 2026 年 5 月融资：Decart 公开宣布 3 亿美元融资，多家媒体将已披露融资总额置于 4.5 亿美元以上。这一融资规模可能降低近期立即再融资的压力，让公司继续建设
              DOS、Lucy 和 Oasis。即便如此，公开估值锚点仍不精确，报道范围从约 31 亿美元到近 40 亿美元；TNW 明确报道 Decart 没有披露经常性收入、新估值或授权 DOS
              的超大规模云客户。更重要的是，留存公开证据始终没有补齐投资判断的基本数据：没有按产品线披露收入，没有毛利率、CAC、回本期、烧钱额、现金余额或现金跑道。因此本章判断是：Decart
              可能拥有罕见的战略势头和强融资支持，但收入质量、利润率路径和资本效率仍是尽调阻碍，而非已确立事实。
