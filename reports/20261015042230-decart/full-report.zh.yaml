  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Decart 的市场边界横跨三个预算和替代方案不同的层次。DOS 解决硬件上的模型服务效率，Lucy 解决实时视频的持续变换，Oasis 解决自动驾驶及其他实体 AI
              系统的闭环仿真。因此纳入的支出仅限于直接使用这些能力的推理优化、互动视频工作流和生成式仿真；芯片采购、通用云容量、离线后期制作、媒体库存、机器人或车辆硬件，以及广义 AI
              软件支出均排除在外。实际替代方案包括集中式推理、离线视频渲染、手工搭建的仿真环境和内部优化。把这些预算池合并成一个市场估算，会掩盖截然不同的采用周期和经济买方。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
