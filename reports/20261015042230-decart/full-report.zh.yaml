              会话：用户提示一个世界，按流传输四动作控制块，并逐流接收生成的摄像头帧；这更接近运营中的仿真器，而非一次性媒体模型。主要集成依赖包括 Decart 托管端点、API 密钥认证和 decart-oasis
              SDK；W&B 则将内部开发流程描述为由实验与制品驱动，并带有谱系和访问控制。这些界面共同表明公司有真实工程深度和可复现性投入，但也凸显买方体验对 Decart
