        - Amazon 或其他战略买家将当前兴趣推进为实际交易流程，DOS/Lucy/Oasis 把合作伙伴验证转化为规模化企业部署。
        - 上行空间锚定传闻中的约 $7B 战略上限；只有商业证据追上技术稀缺性，价值才会进一步提升。
        - 交易延期、客户集中度过高，或收入和利润率的尽调质量偏弱。
        - 需要已签署的交易流程、定价交易或硬 KPI 披露。
      - - 基准
        - Decart 延续技术势头和战略关系，但在下一轮尽调窗口前，商业信息的公开披露仍然有限。
        - 最近明确的估值标记是据报道的 $4B 轮融资，因此稳妥做法是观察执行，而不是假设估值会干净利落地升至该水平之上。
        - 叙事跑在变现前面、AI 基础设施估值倍数压缩，或新资金的融资条款不清晰。
        - 与当前公开记录最一致。
      - - 熊市
        - 战略兴趣减弱、企业转化耗时超过预期，或新资本以优先保护内部人的结构进入。
        - 由于公开记录尚未证明可持续的经常性经济性或清晰的下行权利结构，下行空间可能回到上一轮私募估值附近甚至更低。
        - 商业化延迟、利润率承压、稀释，或股权结构表中隐藏的不利条款。
        - 如果下一轮融资或战略审查未能验证当前叙事，这种情景很可能出现。
    notes: 由于审阅来源未披露建立更窄模型公允价值区间所需的收入、留存或利润率数据，区间以公开价格锚点和走势方向表示。
