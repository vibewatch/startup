    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支持将 Decart 放入单一“AI 视频”同行组。其公开产品横跨 DOS 基础设施、Lucy 实时视频编辑和 Oasis
              互动世界生成，因此买方的替代集合会随工作流改变。对于创作者和品牌用例，留存比较来源将 Runway Gen-4、Google Veo 3 和 OpenAI Sora 2 列为相关替代品；对于机器人和实体 AI
              团队，Decart 自身则将 CARLA、Isaac Sim、Genie 3 和 Nvidia Cosmos 视为更相关的替代方案。这一区分很重要，因为 Decart
              似乎首先在交互性和部署形态上竞争，而不是与批量视频领导者优化的同类精致离线输出竞争。
