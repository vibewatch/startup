      - number: '8.2'
        title: 上行证明与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              上行逻辑并非虚构。Decart 呈现出由 DOS、Lucy 和 Oasis 组成的连贯技术栈：Lucy 面向实时视频编辑，Oasis 3 先面向自动驾驶仿真，再扩展到更广泛的实体 AI
              用例。这一技术叙事吸引了重量级验证：Calcalist 称 Amazon 成为战略客户、NVIDIA 进行了投资，公司则称已通过与大型云厂商、AI
              实验室和超大规模公司的合同产生收入。问题在于公开材料停在投资人所需数字之前。AIPressRoom 明确指出 Decart
              没有披露当前估值或经常性收入，经审阅公开来源仍未披露毛利率、留存、客户集中度、董事会控制或清算优先权。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景区间与尽调触发点
        blocks:
          - type: paragraph
            body: >-
              公开记录支持结果区间，而不是干净的公允价值点估算。最可靠的硬价格锚仍是报道中的 2026 年 5 月 40 亿美元融资。最佳上行信号是传闻中的约 70 亿美元 Amazon
              流程，它可能证明战略稀缺性，但不等于已签署交易或独立的公开可比公司集合。与此同时，低质量目录仍显示过时或不完整的融资快照，这也说明除少数关键报道外，外部记录很薄。因此，对当前收入质量、客户集中度、优先权条款和退出流程纪律的尽调是最后闸门：若这些项目通过，区间可以向上重估；若不通过，下行可能回到或低于上一轮私募价格。
            claimRefs:
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 观察，不买入
            body: Decart 的产品和伙伴证据足以保持可投资性，但公开商业和治理披露不足以支撑高于上一轮私募融资的激进入场。
            calloutType: recommendation
            claimRefs:
