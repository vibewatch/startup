  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 多产品线变现逻辑可见，但实际定价不可见
        blocks:
          - type: paragraph
            body: >-
              Decart 的公开材料持续描述三个商业入口：DOS 是优化与基础设施层，Lucy 是实时视频产品，Oasis 是实体 AI
              世界模型产品。这一组合很重要，因为它意味着公司不是在试图变现单一消费应用，而是要把基础设施和更高层的模型体验卖进企业工作流。产品页和发布报道指向 API
              访问、企业部署、商业协议和专家主导的触达，而不是自助结账，方向上符合销售驱动的软件与基础设施收入。但实际商业合同形态仍然缺失。留存公开来源没有发布 DOS、Lucy 或 Oasis
              的目录价、实际价格、承诺用量下限或合同期限，因此变现逻辑可以理解，价格实现层仍需私下尽调。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI011
              - CI013
