      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方身份随产品层次变化。基础设施和模型服务团队会用吞吐量、延迟、利用率和迁移成本评估 DOS。媒体平台、零售商、品牌和创作者业务会根据必须在视频直播期间运行的互动或变现工作流评估
              Lucy。自动驾驶和机器人团队则会将 Oasis 与真实数据采集及固定仿真的成本、安全和覆盖限制比较。电信和边缘基础设施运营商是在需要地理接近性、以保持交互响应时间时的赋能伙伴。因此采用路径从技术基准或 API
              试用开始，经工作流集成，最终进入由基础设施、产品、营销、商业或自动驾驶负责人拥有的生产合同；公开证据没有披露这些阶段之间的转化率。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
