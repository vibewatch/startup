        - id: platform
          label: DOS platform
          context: Hardware-aware inference and training layer spanning Nvidia, Google, and AWS chip environments.
          claimRefs: [CI001, CI002]
        - id: channel
          label: Strategic channel access
          context: AWS commercial agreements and joint go-to-market support can accelerate customer acquisition.
          claimRefs: [CI010]
        - id: lucy
          label: Lucy enterprise deployments
          context: Live video workflows for commerce, advertising, streaming, and creators through sales-led engagement.
          claimRefs: [CI003, CI008]
        - id: oasis
          label: Oasis API access
          context: Robotics and AV teams receive direct access to world-model infrastructure for simulation workflows.
          claimRefs: [CI004, CI011]
        - id: usage
          label: Usage and deployment signals
          context: User spikes, enterprise deployments, and partner integrations indicate demand but not recognized revenue.
          claimRefs: [CI007, CI008, CI009]
        - id: financial-output
          label: Recognized revenue and gross profit
          context: Public sources do not disclose price realization, revenue scale, gross margin, burn, or runway.
          claimRefs: [CI012, CI013, CI014, CI015]
      edges:
        - from: platform
          to: lucy
          label: Powers application layer
          claimRefs: [CI001, CI002, CI003]
        - from: platform
          to: oasis
          label: Powers simulation layer
          claimRefs: [CI001, CI002, CI004, CI011]
        - from: channel
          to: platform
          label: Improves distribution
          claimRefs: [CI009, CI010]
        - from: lucy
          to: usage
          label: Enterprise adoption signal
          claimRefs: [CI003, CI008]
        - from: oasis
          to: usage
          label: API and usage signal
          claimRefs: [CI004, CI007, CI011]
        - from: usage
          to: financial-output
          label: Conversion not disclosed
          claimRefs: [CI012, CI013, CI014]
    approximationNotes: Public disclosures support the sequence, but not a quantified waterfall from usage to revenue or gross profit.
    claimRefs: [CI002, CI003, CI004, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
