      - ["Oasis", "API-accessible world-model and simulation infrastructure for robotics and AV teams", "API or enterprise subscription", "API access disclosed; paid production adoption undisclosed", "Product availability is public but price realization is not", "Paid pilots, conversion to production, and usage volume for Oasis"]
      - ["AWS-linked channel motion", "Commercial agreement and joint go-to-market support around Trainium deployment", "Channel-assisted software or infrastructure revenue", "Partnership disclosed; economics undisclosed", "Helpful distribution signal but not revenue proof", "Revenue share, minimum commitments, and dependence on AWS-driven volume"]
    notes: Public rows distinguish disclosed commercialization status from undisclosed revenue scale and contract economics.
    claimRefs: [CI002, CI003, CI004, CI010, CI011, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price/unit/contract
      - List vs realized pricing
      - Discounts/unknowns
      - Source
    rows:
      - ["DOS", "Custom enterprise terms; no public list price found", "List pricing unavailable", "No disclosed usage tiers, minimums, or hardware pass-through", "Public product and launch materials"]
      - ["Lucy", "Custom enterprise terms via expert-led sales motion", "List pricing unavailable", "No public ACV, contract duration, or discount schedule", "Lucy page plus deployment coverage"]
      - ["Oasis 3", "API or enterprise access; no public price shown", "List pricing unavailable", "No public usage schedule or pilot-to-production economics", "Oasis page"]
    notes: Unavailable means undisclosed in the reviewed public source set, not necessarily absent from customer contracts.
    claimRefs: [CI003, CI004, CI011, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Lucy latency proxy", "Sub-40ms on product page and under 30ms in launch coverage", "Medium", "Performance can support premium pricing only if compute cost stays bounded", "Cost per streamed minute/session and hardware mix at target SLAs"]
      - ["DOS throughput proxy", "Company says more than 1000 tokens per second for agentic inference and up to 100 FPS for full-HD video/world-model inference", "Medium", "Throughput can improve margin only if utilization holds in paid production", "Independent customer benchmarks and gross-margin bridge versus infrastructure cost"]
      - ["Oasis latency proxy", "Under 200 ms at 22 FPS 512x768x3", "Medium", "Closed-loop simulation readiness may help monetization but does not reveal unit economics", "Compute cost per simulation hour and support burden by customer"]
      - ["Capital position", "$300M raised in May 2026 and more than $450M total disclosed funding", "High", "Large financing lowers immediate external-capital pressure", "Cash balance, debt or compute commitments, and 12 to 18 month runway"]
      - ["Commercial proof", "Oasis reached 1M users in 72 hours and Lucy deployments are claimed", "Medium", "Demand signals exist but cannot be translated into ARR or margin", "Product-level ARR or run-rate revenue, customer counts, CAC, payback, and gross margin"]
    notes: Public figures here are technical or financing proxies rather than audited unit-economics disclosures.
    claimRefs: [CI005, CI007, CI008, CI009, CI012, CI014, CI015]
