company:
  name: Decart
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a multi-line enterprise/API/infrastructure monetization thesis and a much stronger balance sheet after Decart's $300M May 2026 round, but not a revenue model that can yet be underwritten. The company discloses product breadth, partner motion, and product-interest signals while leaving pricing realization, revenue scale, gross margin, burn, and runway private.
sections:
  - id: monetization-thesis
    title: Multi-line monetization thesis is visible, but realized pricing is not
    body: >-
      Decart's public materials consistently describe three commercial surfaces: DOS as the optimization and infrastructure layer, Lucy as the real-time video product, and Oasis as the physical-AI world-model product. That mix matters because it implies the company is not trying to monetize a single consumer app; it is trying to sell infrastructure and higher-level model experiences into enterprise workflows. The product pages and launch coverage point to API access, enterprise deployments, commercial agreements, and expert-led outreach rather than self-serve checkout, which is directionally consistent with sales-led software and infrastructure revenue. What remains missing is the actual commercial contract shape. None of the retained public sources publish list pricing, realized pricing, committed usage minimums, or contract durations for DOS, Lucy, or Oasis, so the monetization thesis is intelligible but the price realization layer still requires private diligence.
    claimRefs: [CI001, CI002, CI003, CI004, CI011, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-gtm-proxies
    title: Public traction points show interest and partner access, not sales efficiency
    body: >-
      The strongest public traction signals are proxy metrics rather than financial outputs. Decart says Oasis reached 1M users in 72 hours, Lucy is already deployed with enterprise customers across multiple industries, and AWS has both commercial agreements and joint go-to-market work around Trainium-based deployment. Those data points help establish demand formation, channel access, and product relevance across gaming, live media, robotics, and infrastructure buyers. They do not, however, convert cleanly into underwriting metrics. A large user spike for Oasis does not prove paid production adoption, named enterprise deployments do not reveal ACV or retention, and hyperscaler partnerships do not disclose whether economics accrue as software revenue, services revenue, or strategic co-selling support. The result is a GTM picture that looks enterprise-led and partnership-assisted, but still lacks the CAC, payback, cycle-length, and expansion data needed to judge sales efficiency.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Fresh capital reduces immediate pressure, but core underwriting data remains private
    body: >-
      Financially, the clearest new fact is the May 2026 financing: Decart publicly announced a $300M round and multiple outlets place total disclosed funding above $450M. That scale of financing likely reduces near-term pressure to raise immediately and gives the company time to continue building DOS, Lucy, and Oasis. Even so, the public valuation anchor is imprecise, with coverage ranging from roughly $3.1B to nearly $4B, and TNW explicitly reported that Decart did not disclose run-rate revenue, the new valuation, or the hyperscaler customers licensing DOS. More importantly, the retained public evidence never closes the basics of underwriting: there is no disclosed revenue by product line, no gross margin, no CAC or payback, no burn, no cash balance, and no runway. The chapter verdict is therefore that Decart may have rare strategic momentum and strong financing support, but revenue quality, margin path, and capital efficiency remain diligence blockers rather than established facts.
    claimRefs: [CI005, CI006, CI012, CI014, CI015]
callouts:
  - calloutType: insight
    title: Enterprise-led monetization is the clearest public read
    body: >-
      Across the assigned source pool, the commercial pattern is enterprise/API/infrastructure sales, not public self-serve pricing.
    claimRefs: [CI001, CI003, CI004, CI013]
  - calloutType: strength
    title: The May 2026 round likely buys execution time
    body: >-
      A $300M financing on top of more than $450M total disclosed funding should reduce immediate financing pressure even though public runway math is still unavailable.
    claimRefs: [CI005, CI015]
  - calloutType: risk
    title: Public revenue quality is still un-underwritten
    body: >-
      Revenue, realized pricing, margins, burn, and runway remain private, so strategic excitement is still running ahead of hard financial disclosure.
    claimRefs: [CI012, CI013, CI014]
