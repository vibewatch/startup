schemaVersion: "report-v2"
artifact: product-tech
slug: decart
runDate: 2026-10-15
company:
  name: Decart
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Decart now exposes a coherent product stack rather than a single demo: DOS as the
    optimization layer, Lucy for live video transformation, and Oasis 3 as an
    API-accessible physical-AI world model. The strongest public proof is on the Oasis side,
    where Decart publishes session-level API mechanics and a partner case study describing
    lineage-controlled model development, while Lucy's maturity still relies more heavily on
    company claims and a small number of independent writeups than on public operator-grade
    trust artifacts.
sections:
  - id: product-stack
    title: Product stack and delivered workflows
    body: >-
      Decart's public product surface has consolidated into a layered stack rather than a
      collection of research demos. The company says DOS is the performance layer, with Lucy
      and Oasis as the exposed model families on top. That matters because the public value
      proposition splits into two customer workflows: Lucy targets live video transformation
      for enterprises, brands, and creators, while Oasis 3 targets physical-AI teams that
      need interactive simulation rather than offline rendering. The product story is
      differentiated by real-time operation, but the evidence quality differs by surface:
      Oasis includes API and SDK detail that makes the workflow inspectable, whereas Lucy is
      still described more through marketing and media coverage than through public technical
      integration material in this chapter's evidence set.
    claimRefs: [CE001, CE002, CE008, CE009, CE012]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operations
    title: Architecture, APIs, and operational model
    body: >-
      Oasis 3 is the clearest window into how Decart's stack actually works. The docs describe
      a hosted, stateful gRPC session where a user prompts a world, streams four-action control
      chunks, and receives generated camera frames back per stream, which is much closer to an
      operational simulator than to a one-shot media model. The main integration dependencies
      are Decart-hosted endpoints, API-key authentication, and the decart-oasis SDK, while W&B
      describes the internal development workflow as experiment- and artifact-driven with
      lineage and access controls. Together, those surfaces suggest real engineering depth and
      reproducibility effort, but they also reinforce how dependent the buyer experience is on
      Decart's hosted infrastructure and undocumented uptime, security, and support processes.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-technical-risk
    title: Maturity signals, dependencies, and technical risk
    body: >-
      The maturity signal is strongest where independent or partner surfaces overlap with the
      official story. World-models.io independently describes OASIS as a real-time neural game
      engine, W&B frames Oasis 3 as production-grade tooling for robotics partners, and Forbes
      reports Lucy 2 running live at 1080p and 30 frames per second while being tested in live
      creator and Omniverse-adjacent workflows. Even so, the evidence remains uneven. One
      assigned third-party WebRTC page resolves only to a newsletter-signup stub, and the
      assigned pool does not provide a public status page, third-party security certification,
      or explicit privacy/compliance documentation for Lucy or Oasis. That leaves Decart with a
      credible real-time architecture story, but a thinner public proof set around reliability,
      controls, and independent deployment depth than the headline performance claims imply.
    claimRefs: [CE006, CE007, CE011, CE013, CE014]
callouts:
  - calloutType: risk
    title: Public proof is stronger for architecture than for controls
    body: >-
      Oasis has enough public API detail to show a real product workflow, but this evidence set
      still lacks third-party security, privacy, uptime, or certification artifacts that would
      let an institutional buyer underwrite operational risk with confidence.
    claimRefs: [CE003, CE007, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [DOS 2.0 optimization stack, Internal platform / infrastructure buyer, Publicly positioned as shared production layer, Shared low-latency inference and training layer across product surfaces, Need customer evidence for external production deployments and commercial packaging]
      - [Oasis 3 API, Robotics and autonomous-vehicle R&D teams, Public preview with docs and hosted endpoint, Action-conditioned multi-view world model delivered through API rather than only a research demo, Need public SLA or uptime evidence plus broader deployment references]
      - [Lucy 2 live video model, Enterprises brands creators and streaming operators, Publicly launched and independently covered but still marketing-led, Real-time programmable video editing with near-zero-latency positioning, Need public implementation docs and named production customers]
      - [OASIS game-engine lineage, Developers and research observers, Earlier public proof-of-concept / open-source lineage, Demonstrates real-time playable world generation and helped establish technical narrative, Need evidence on how much of the public demo stack carries into current commercial products]
    notes: >-
      Public sources mix company claims, partner proof, and independent coverage; maturity refers
      to disclosed surface availability, not audited production penetration.
    claimRefs: [CE001, CE002, CE006, CE008, CE009, CE012]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Decart solution
      - Measurable benefit
      - Limitation
    rows:
      - [Closed-loop robotics simulation, Conventional simulators require hand-built scenes and resets, Oasis 3 lets teams prompt worlds and drive them with control signals over a live session, Official latency claim is under 200 ms at 22 FPS with continuous response, No public benchmark shows policy-training outcomes versus incumbent simulators]
      - [Autonomous-vehicle edge-case exploration, Rare physical scenarios are expensive to capture in reality, Oasis 3 targets AV first with on-demand geography weather and scenario variation, Multi-camera and action-conditioned framing could widen scenario coverage, No public validation on simulator-to-real transfer or safety metrics in this pool]
      - [Live stream or brand-video transformation, Traditional editing is offline and post-production heavy, Lucy changes characters objects backgrounds and effects while the stream is live, Official site claims sub-40 ms latency and 100 FPS continuous generation, Public evidence does not yet show integration architecture or customer-retention data]
      - [Model-development governance, Training world models usually fragments data checkpoints and experiments, W&B describes lineage-tracked experiments artifacts and access controls around Oasis 3 development, Traceability supports partner diligence and release discipline, Governance proof comes from a partner case study rather than a third-party audit]
    notes: >-
      Benefit fields repeat disclosed metrics only where the source gives one; missing production
      benchmarks and customer outcomes remain open diligence items.
    claimRefs: [CE002, CE005, CE007, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - [DOS optimization stack, Shared training and inference substrate under Lucy and Oasis, Depends on Decart's proprietary performance layer and multi-chip execution claims, Shared-layer failures or cost overruns would affect both product families]
      - [Hosted gRPC/API session, Maintains stateful prompt and inference loop for Oasis 3, Depends on Decart endpoint availability TLS and API-key management, Hosted control plane concentrates uptime and vendor-lock-in risk]
      - [decart-oasis SDK, Thin client for session control and VP9/JPEG frame decoding, Depends on Python package distribution and compatibility with Decart endpoint contracts, Public SDK surface exists but support cadence and breaking-change policy are undisclosed]
      - [Action-conditioned multi-view generation, Produces synchronized camera views from a coherent world state, Depends on model quality geometry consistency and low-latency inference, Safety value falls if coherence or control fidelity degrades under edge cases]
      - [Experiment lineage layer, Tracks datasets checkpoints outputs and access controls during training, Depends on W&B-based workflow discipline and internal governance, Partner-reported provenance does not substitute for external certification]
    notes: >-
      Architecture is reconstructed from public docs and partner testimony; private infrastructure,
      support processes, and incident response remain undisclosed in this evidence set.
    claimRefs: [CE003, CE004, CE007, CE008, CE012, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Decart's public stack resolves into shared DOS infrastructure, hosted access surfaces, and
      two visible product layers: Lucy for live video and Oasis for physical-AI simulation.
    data:
      layers:
        - label: Experience layer
          detail: Live operator-facing workflows where Decart's low-latency claims matter most.
          modules: [Lucy live video workflows, Oasis 3 simulation workflows]
          items:
            - label: Lucy live video workflows
              detail: Enterprises brands and creators transform live streams and video moments in real time.
            - label: Oasis 3 simulation workflows
              detail: AV and robotics teams prompt environments and train inside responsive multi-view worlds.
        - label: Product layer
          detail: The two public product families exposed on top of the shared infrastructure stack.
          modules: [Lucy, Oasis 3]
          items:
            - label: Lucy 2 model family
              detail: Real-time video and world editing with frame-by-frame transformations.
            - label: Oasis / Oasis 3 model family
              detail: Interactive world generation and action-conditioned simulation for physical AI.
        - label: Session-control layer
          detail: Stateful runtime surface that turns the models into developer-usable services.
          modules: [Hosted API and gRPC sessions]
          items:
            - label: Hosted API and gRPC sessions
              detail: API-key authentication, prompt lifecycle, and streamed frames from Decart-managed endpoints.
        - label: Developer-surface layer
          detail: Public materials that let external teams inspect or start integrating the stack.
          modules: [SDK and demo surfaces]
          items:
            - label: Public SDK and demo surfaces
              detail: decart-oasis package plus GitHub-linked extras expose an initial developer workflow.
        - label: Platform layer
          detail: Shared compute-optimization substrate claimed to make both product lines economically viable.
          modules: [DOS optimization stack]
          items:
            - label: DOS optimization stack
              detail: Shared training and inference layer that Decart says powers both product lines.
        - label: Governance layer
          detail: Internal workflow controls used to keep training inputs and model outputs traceable.
          modules: [Experiment lineage and artifacts]
          items:
            - label: Experiment lineage and artifacts
              detail: W&B-backed traceability over datasets, checkpoints, and outputs during Oasis 3 development.
    approximationNotes: >-
      This figure is a structural synthesis of public product surfaces, not a full internal
      system diagram or verified deployment topology.
    claimRefs: [CE001, CE003, CE007, CE008, CE012]
