artifact: market-analysis
slug: decart
runDate: 2026-10-15
company:
  name: Decart
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Decart addresses three adjacent markets rather than one generic AI-video category:
    inference optimization through DOS, live video transformation through Lucy, and
    physical-AI simulation through Oasis. The retained evidence supports operational
    demand proxies and distinct buyer groups, but not a common-unit TAM, SAM, or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Decart's market boundary spans three layers with different budgets and substitutes.
      DOS addresses model-serving efficiency across hardware, Lucy addresses continuous
      transformation of live video, and Oasis addresses closed-loop simulation for
      autonomous vehicles and other physical-AI systems. Included spend is therefore
      limited to inference optimization, interactive video workflows, and generative
      simulation that directly use these capabilities. It excludes chip purchases,
      general cloud capacity, offline post-production, media inventory, robot or vehicle
      hardware, and broad AI software spend. The practical substitutes are centralized
      inference, offline video rendering, hand-built simulation environments, and internal
      optimization work. Combining those pools into one market estimate would conceal
      materially different adoption clocks and economic buyers.
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001]
  - id: sizing-evidence
    title: Evidence-constrained sizing
    body: >-
      No retained source supplies an independently measured, common-unit market-spend
      estimate for Decart's three wedges. The strongest quantitative signals are instead
      company-specific and non-additive: American Compute reports 981B open-weight-model
      tokens served over seven days; Decart says Oasis reached 1M users in 72 hours; and a
      company-issued release reports sub-35 millisecond performance in a Comcast and
      NVIDIA edge benchmark. TechTimes separately reports annual revenue in the several
      tens of millions of dollars, with uneven growth driven largely by custom chip-maker
      engagements, but that report is neither audited segment revenue nor ARR. These
      indicators establish activity, technical feasibility, and some commercialization;
      they do not establish category TAM, addressable spend, market share, or repeatable
      contract value.
    claimRefs: [CM007, CM009, CM011, CM013, CM014, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      Buyer identity follows the product layer. Infrastructure and model-serving teams
      evaluate DOS against throughput, latency, utilization, and migration effort.
      Media platforms, retailers, brands, and creator businesses evaluate Lucy against
      engagement or monetization workflows that must operate while video is live.
      Autonomous-vehicle and robotics teams evaluate Oasis against the cost, safety, and
      coverage limits of real-world data collection and fixed simulation. Telecom and
      edge-infrastructure operators are enabling partners where geographic proximity is
      required to keep response times interactive. The adoption path therefore runs from
      technical benchmark or API trial, through workflow integration, to a production
      contract owned by infrastructure, product, marketing, commerce, or autonomy leaders;
      public evidence does not disclose conversion rates between those stages.
    claimRefs: [CM002, CM003, CM004, CM005, CM007, CM008]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, adoption constraints, and valuation relevance
    body: >-
      The principal driver is that low-latency generation creates workflows that offline
      rendering cannot serve: live editing, responsive worlds, and closed-loop robot
      training. The principal constraint is proof of durable economics. ToolDirectory
      notes a fidelity trade-off versus batch renderers, while TechTimes reports uneven
      growth tied largely to custom engagements; both observations raise questions about
      product depth, repeatability, and sales concentration. Edge delivery can also add
      infrastructure dependencies before global deployment. For valuation, technical
      performance and launch engagement justify treating the category as real, but a
      revenue multiple cannot be grounded in public market-share data until Decart
      discloses segment revenue, paying-customer counts, retention, contract duration,
      gross margin, and customer concentration by DOS, Lucy, and Oasis.
    claimRefs: [CM006, CM007, CM008, CM013, CM016]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Inference optimization
        - Model-serving software and engineering that improve latency, utilization, throughput, or token economics
        - Accelerator purchases, generic cloud capacity, and model-development spend unrelated to serving efficiency
        - Cloud, chip, AI-lab, and platform infrastructure leaders
        - DOS extends Decart's boundary beneath applications into inference infrastructure.
      - - Live video transformation
        - Real-time editing, live commerce, interactive advertising, creator tooling, and streaming experiences
        - Offline prompt-to-video rendering, conventional post-production, and media inventory
        - Media platforms, brands, retailers, creators, and product teams
        - Lucy is positioned around changing video while it is being created or consumed.
      - - Physical-AI simulation
        - Closed-loop, generated environments for AV, robotics, and other physical-AI training or testing
        - Vehicle or robot hardware, generic gaming spend, and non-interactive video generation
        - Autonomy, robotics, simulation, and research organizations
        - Oasis starts with autonomous vehicles and extends to additional robot categories.
      - - Edge delivery enablement
        - Distributed inference integration required to deliver interactive workloads near users or devices
        - General telecom network capital expenditure not attributable to AI inference
        - Telecom, edge-compute, and AI-infrastructure operators
        - The Comcast and NVIDIA work indicates that delivery architecture can be part of adoption.
      - - Status-quo substitutes
        - Internal optimization, centralized inference, offline rendering, real-world data collection, and fixed simulation
        - Spend with no migration path to Decart's models or stack
        - Existing engineering, creative-production, and autonomy teams
        - Migration must beat established workflows on fidelity, cost, latency, safety, or scenario coverage.
    notes: >-
      Boundaries synthesize the retained source set; adjacent rows are not additive revenue
      pools, and no row implies that all described spend is addressable by Decart.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM015]
