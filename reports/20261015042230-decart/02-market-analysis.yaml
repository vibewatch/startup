    notes: >-
      Values retain their original periods, denominators, and units. They are deliberately
      non-additive proxies and must not be converted into a market total or implied share.
    claimRefs: [CM007, CM009, CM011, CM013, CM014, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - DOS for cloud or chip infrastructure
        - Infrastructure or accelerator platform leadership
        - Kernel, compiler, and model-serving engineers
        - Cloud, chip, or platform organization
        - Optimize inference across existing hardware
        - VP infrastructure or platform engineering
        - Better throughput, utilization, latency, or token economics without forced hardware migration
      - - DOS for AI labs
        - Model-serving leadership
        - Inference and applied-ML engineers
        - AI product or infrastructure organization
        - Deploy open-weight or proprietary models at production scale
        - Head of inference or applied AI
        - A measurable serving bottleneck and acceptable integration effort
      - - Lucy for media and streaming
        - Media platform or creator-network product lead
        - Creators, production teams, and viewers
        - Product, creator-tools, or media-monetization organization
        - Live character, scene, object, or effects transformation
        - Product or creator monetization executive
        - Interactive output meets live latency and quality requirements
      - - Lucy for brands and retail
        - Brand, retailer, or commerce innovation lead
        - Creative teams and shoppers
        - Marketing, retail-media, or digital-commerce organization
        - Live advertising, product placement, and interactive shopping
        - CMO, retail-media, or commerce leader
        - Measurable engagement or conversion improvement in an existing video workflow
      - - Oasis for autonomous vehicles
        - AV program or autonomy engineering leader
        - Simulation and policy-training teams
        - Autonomous-driving R&D organization
        - Generate controllable, multi-view scenarios and rare events
        - Head of autonomy, simulation, or validation
        - Safer or cheaper scenario coverage than real-world collection or fixed simulation
      - - Oasis for broader robotics
        - Robotics or physical-AI program lead
        - ML engineers, researchers, and robot policies
        - Robotics R&D organization
        - Closed-loop training for drones, off-road, maritime, or humanoid systems
        - Robotics engineering or research leader
        - API integration and environment fidelity satisfy task-specific training needs
    notes: >-
      Buyer, payer, and budget-owner fields are inferred from product workflows; the retained
      sources do not disclose actual contract ownership or sales mix by segment.
    claimRefs: [CM002, CM003, CM004, CM005, CM008, CM016]
figures:
  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      Six ordered evidence layers show where the market case is quantified and where
      underwriting still depends on missing commercial data.
    data:
      items:
        - label: Broad category spend
          value: Not disclosed
          detail: No retained source provides a common-unit market-spend estimate.
        - label: Company commercialization
          value: Several tens of millions USD annual revenue
          detail: TechTimes reporting; unaudited and not segmented by product.
        - label: Inference demand proxy
          value: 981B tokens / 7 days
          detail: American Compute observation for Oct. 3-9, 2026.
        - label: Launch engagement proxy
          value: 1M users / 72 hours
          detail: Company-reported Oasis launch milestone from 2024.
        - label: Live delivery threshold
          value: Sub-35ms end-to-end
          detail: Company-reported Comcast and NVIDIA edge benchmark from March 2026.
        - label: Repeatable paid penetration
          value: Not disclosed
          detail: Customer count, retention, contract duration, and product-level revenue remain unavailable.
    approximationNotes: >-
      This is an evidence ladder, not a proportional market-size pyramid. Levels retain
      different source units and populations; tapering conveys increasing evidence constraint,
      not magnitude, conversion, share, or a common denominator.
    claimRefs: [CM001, CM007, CM009, CM011, CM013, CM016]
callouts:
  - calloutType: risk
    title: Proxy evidence is not TAM
    body: >-
      Token volume, launch users, latency, and reported company revenue establish activity
      but cannot be summed or converted into an addressable-market estimate.
    claimRefs: [CM009, CM011, CM013, CM014]
  - calloutType: insight
    title: Real-time performance defines the initial wedge
    body: >-
      The strongest adoption logic is concentrated in workflows where offline rendering,
      fixed simulation, or centralized inference cannot meet the required feedback loop.
    claimRefs: [CM007, CM008, CM015]
