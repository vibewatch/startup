callouts:
  - calloutType: risk
    title: Kill criteria before a bullish underwriting case
    body: Do not underwrite a premium outcome unless diligence can show named production customers, retention or repeat usage, credible revenue or margin visibility, and compliance / safety documentation for physical-AI deployments. Rumored strategic interest alone is not a substitute for these proofs.
    claimRefs:
      - CR006
      - CR009
      - CR010
      - CR011
      - CR014
      - CR016
  - calloutType: insight
    title: What would de-risk the story fastest
    body: The fastest de-riskers would be a customer-quality bridge from usage to paid deployments, durable multi-platform compute economics, and a regulator- or enterprise-grade trust package that matches the autonomous-vehicle and live-video positioning.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR010
      - CR011
      - CR015
