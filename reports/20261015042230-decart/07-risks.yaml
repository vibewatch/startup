  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-gap
      missingEvidence: Named customer or regulator-facing evidence showing how Oasis deployments handle validation, safety review, and any sector-specific compliance obligations.
      whyItMatters: Physical-AI and autonomous-vehicle claims can create thesis-level downside if simulation quality or compliance controls are weaker than the marketing implies.
      diligencePath: Request deployment architecture, safety review materials, validation reports, and customer references from any AV or robotics design partners.
      relatedQuestionRefs:
        - QR002
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: security-reliability
      missingEvidence: Trust-center evidence such as certifications, incident/status history, uptime commitments, or enterprise security documentation for Lucy and Oasis.
      whyItMatters: Latency and live-production positioning increase the cost of outages, abuse, or weak operational controls.
      diligencePath: Review security documentation, customer SLAs, incident-response procedures, and any historical status-page data.
      relatedQuestionRefs:
        - QR003
      relatedTableRefs:
        - TR002
    - type: private-evidence-only
      severity: material
      topic: customer-proof-gap
      missingEvidence: Named paying customers, renewals, concentration, contract duration, and the bridge from usage spikes to recurring revenue.
      whyItMatters: Without customer-quality evidence, it is hard to distinguish durable commercialization from product excitement or pilots.
      diligencePath: Request top-customer list, cohort retention, revenue concentration, and references willing to discuss production usage.
