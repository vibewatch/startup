company:
  name: Decart
chapter:
  number: 7
  title: Risks
  summary: Decart's biggest public risks are not a single litigation headline but the combination of valuation and transaction volatility, multi-product execution stretch, partner concentration around cloud and chip ecosystems, and still-thin customer, revenue, and regulatory proof for physical-AI deployments.
sections:
  - id: top-ranked-risks
    title: The top risks are valuation whiplash, product sprawl, and proof gaps
    body: Public evidence supports a high-level risk ranking even without a disclosed lawsuit or enforcement action. First, Decart is being discussed in rapidly moving strategic-transaction narratives. One independent source frames Anthropic at around $6 billion, while Mint cites Amazon talks at around $7 billion and explicitly says those talks could still fall apart. Second, the company is trying to commercialize a full stack at once—DOS infrastructure, Lucy for live video, and Oasis for physical-AI simulation—which expands execution surface area before public revenue, retention, or margin disclosure catches up. Third, the loudest operating proof in the current source set is product-speed and usage marketing, not durable customer economics or audited financials.
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR013
    figureRefs:
      - FR001
  - id: regulatory-legal-and-safety
    title: Physical-AI and safety exposure is credible, but public compliance detail is thin
    body: The official Oasis materials make the regulatory and safety question unavoidable because Decart is not positioning the product as a toy benchmark; it says Oasis is for physical AI and is starting with autonomous vehicles. That creates real diligence burden around simulation validity, model misuse, customer safety workflows, and any sector-specific compliance overlays. Yet the assigned public evidence does not confirm licenses, certifications, disclosed incident history, or a litigation record tied to those use cases. That does not prove a hidden problem, but it does mean investors should treat regulatory, legal, and safety diligence as an open gate rather than as de-risked simply because the product is technically impressive.
    claimRefs:
      - CR002
      - CR011
      - CR012
      - CR014
      - CR016
    tableRefs:
      - TR001
  - id: operational-and-commercialization
    title: Operational scaling risk is amplified by ambitious latency claims and sparse customer proof
    body: "Decart's official pages market extreme responsiveness—sub-40ms Lucy edits and Oasis response under 200ms—across video, simulation, and physical-AI workflows. Those promises are strategically attractive, but they also raise the bar for uptime, model quality, deterministic behavior, and supportability in enterprise deployments. The same public set still leaves customer proof thin: the About page highlights Oasis reaching 1M users in 72 hours, and Lucy references partners and customers plus broad verticals, but the assigned evidence does not identify named paying customers, renewals, concentration, or conversion from viral usage into recurring revenue. That combination makes commercialization and service reliability a top underwriting risk."
    claimRefs:
      - CR002
      - CR003
      - CR010
      - CR011
      - CR013
    tableRefs:
      - TR002
  - id: partner-and-financing-dependencies
    title: Partner leverage and financing opacity could magnify downside quickly
    body: The partner map is promising but not yet obviously diversified enough to neutralize dependency risk. Independent reporting says DOS runs across Nvidia GPUs, Google TPUs, and Amazon Trainium, and Mint separately notes AWS gave Decart early access to Trainium3. That is helpful for platform flexibility, but it also means supplier relationships and privileged compute access are central to the product story. Meanwhile, AIPressRoom says the company did not disclose current valuation or run-rate revenue even while raising another $300 million, and Venture Capital Tracker warns that multibillion-dollar valuations require enterprise or platform distribution rather than demo-driven excitement. If transaction rumors fade or financing expectations reset before operating proof catches up, the downside could compress quickly.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR008
      - CR009
      - CR012
      - CR015
      - CR016
    tableRefs:
      - TR003
