  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Decart's market boundary spans three layers with different budgets and substitutes. DOS addresses
              model-serving efficiency across hardware, Lucy addresses continuous transformation of live video, and
              Oasis addresses closed-loop simulation for autonomous vehicles and other physical-AI systems. Included
              spend is therefore limited to inference optimization, interactive video workflows, and generative
              simulation that directly use these capabilities. It excludes chip purchases, general cloud capacity,
              offline post-production, media inventory, robot or vehicle hardware, and broad AI software spend. The
              practical substitutes are centralized inference, offline video rendering, hand-built simulation
              environments, and internal optimization work. Combining those pools into one market estimate would conceal
              materially different adoption clocks and economic buyers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies an independently measured, common-unit market-spend estimate for Decart's
              three wedges. The strongest quantitative signals are instead company-specific and non-additive: American
              Compute reports 981B open-weight-model tokens served over seven days; Decart says Oasis reached 1M users
              in 72 hours; and a company-issued release reports sub-35 millisecond performance in a Comcast and NVIDIA
              edge benchmark. TechTimes separately reports annual revenue in the several tens of millions of dollars,
              with uneven growth driven largely by custom chip-maker engagements, but that report is neither audited
              segment revenue nor ARR. These indicators establish activity, technical feasibility, and some
              commercialization; they do not establish category TAM, addressable spend, market share, or repeatable
              contract value.
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM013
              - CM014
              - CM016
