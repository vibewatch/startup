      - number: '4.2'
        title: Public traction points show interest and partner access, not sales efficiency
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are proxy metrics rather than financial outputs. Decart says Oasis
              reached 1M users in 72 hours, Lucy is already deployed with enterprise customers across multiple
              industries, and AWS has both commercial agreements and joint go-to-market work around Trainium-based
              deployment. Those data points help establish demand formation, channel access, and product relevance
              across gaming, live media, robotics, and infrastructure buyers. They do not, however, convert cleanly into
              underwriting metrics. A large user spike for Oasis does not prove paid production adoption, named
              enterprise deployments do not reveal ACV or retention, and hyperscaler partnerships do not disclose
              whether economics accrue as software revenue, services revenue, or strategic co-selling support. The
              result is a GTM picture that looks enterprise-led and partnership-assisted, but still lacks the CAC,
              payback, cycle-length, and expansion data needed to judge sales efficiency.
