  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Decart's public stack resolves into shared DOS infrastructure, hosted access surfaces, and two visible product
      layers: Lucy for live video and Oasis for physical-AI simulation.
    data:
      layers:
        - label: Experience layer
          detail: Live operator-facing workflows where Decart's low-latency claims matter most.
          modules:
            - Lucy live video workflows
            - Oasis 3 simulation workflows
          items:
            - label: Lucy live video workflows
              detail: Enterprises brands and creators transform live streams and video moments in real time.
            - label: Oasis 3 simulation workflows
              detail: AV and robotics teams prompt environments and train inside responsive multi-view worlds.
        - label: Product layer
          detail: The two public product families exposed on top of the shared infrastructure stack.
          modules:
            - Lucy
            - Oasis 3
          items:
            - label: Lucy 2 model family
              detail: Real-time video and world editing with frame-by-frame transformations.
            - label: Oasis / Oasis 3 model family
              detail: Interactive world generation and action-conditioned simulation for physical AI.
        - label: Session-control layer
          detail: Stateful runtime surface that turns the models into developer-usable services.
          modules:
            - Hosted API and gRPC sessions
          items:
            - label: Hosted API and gRPC sessions
              detail: API-key authentication, prompt lifecycle, and streamed frames from Decart-managed endpoints.
        - label: Developer-surface layer
          detail: Public materials that let external teams inspect or start integrating the stack.
          modules:
            - SDK and demo surfaces
          items:
            - label: Public SDK and demo surfaces
              detail: decart-oasis package plus GitHub-linked extras expose an initial developer workflow.
        - label: Platform layer
          detail: Shared compute-optimization substrate claimed to make both product lines economically viable.
          modules:
            - DOS optimization stack
          items:
            - label: DOS optimization stack
              detail: Shared training and inference layer that Decart says powers both product lines.
        - label: Governance layer
          detail: Internal workflow controls used to keep training inputs and model outputs traceable.
          modules:
            - Experiment lineage and artifacts
          items:
            - label: Experiment lineage and artifacts
              detail: W&B-backed traceability over datasets, checkpoints, and outputs during Oasis 3 development.
    approximationNotes: >-
      This figure is a structural synthesis of public product surfaces, not a full internal system diagram or verified
      deployment topology.
