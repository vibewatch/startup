  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack and delivered workflows
        blocks:
          - type: paragraph
            body: >-
              Decart's public product surface has consolidated into a layered stack rather than a collection of research
              demos. The company says DOS is the performance layer, with Lucy and Oasis as the exposed model families on
              top. That matters because the public value proposition splits into two customer workflows: Lucy targets
              live video transformation for enterprises, brands, and creators, while Oasis 3 targets physical-AI teams
              that need interactive simulation rather than offline rendering. The product story is differentiated by
              real-time operation, but the evidence quality differs by surface: Oasis includes API and SDK detail that
              makes the workflow inspectable, whereas Lucy is still described more through marketing and media coverage
              than through public technical integration material in this chapter's evidence set.
            claimRefs:
