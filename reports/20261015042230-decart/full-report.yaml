      - number: '3.2'
        title: Capability and packaging differentiation
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation in the retained evidence is that Decart is selling immediacy. Lucy is
              described as sub-40ms live editing at up to 100 FPS for enterprises, brands, and creators, while Oasis is
              described as an API-accessible, action-conditioned world model for physical AI with under 200ms end-to-end
              latency. The independent comparison article reinforces the same positioning by placing Decart's MirageLSD
              and Lucy Edit in real-time or near-real-time lanes while labeling Runway, Veo, and Sora as
              minutes-per-clip tools and Cosmos as offline simulation. Packaging also matters: the same source says
              Mirage is hosted and free to try, Lucy Edit ships open development weights, and several rivals remain
              proprietary hosted tools in the assigned evidence.
            claimRefs:
