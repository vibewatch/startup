      - number: '1.3'
        title: Scale signals, milestones, and open questions
        blocks:
          - type: paragraph
            body: >-
              The milestone record is directionally strong but unevenly sourced. The official site itself now
              foregrounds the 2026 financing and associated DOS 2.0, Lucy, and Oasis updates, while Mint adds a current
              October 2026 signal that Amazon acquisition talks at around $7 billion were reported but remained
              unconfirmed. Earlier operating history is shakier: AI Chopping Block says the company was registered in
              September 2023 and had paying customers by December 2023, but that early commercial chronology is only
              single-source within this pool. There is also a nontrivial identity ambiguity still worth clearing in
              diligence. Calcalist repeatedly frames Decart as an Israeli company founded in late 2023, whereas Mint
              describes it as San Francisco-based; that difference could reflect legal domicile versus go-to-market
              presence, but the current retained record does not let us resolve it. The overarching takeaway is that
              fundraising momentum and product cadence are easier to verify than the company's present operating scale,
              governance structure, and exact corporate footprint.
