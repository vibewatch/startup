      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer identity follows the product layer. Infrastructure and model-serving teams evaluate DOS against
              throughput, latency, utilization, and migration effort. Media platforms, retailers, brands, and creator
              businesses evaluate Lucy against engagement or monetization workflows that must operate while video is
              live. Autonomous-vehicle and robotics teams evaluate Oasis against the cost, safety, and coverage limits
              of real-world data collection and fixed simulation. Telecom and edge-infrastructure operators are enabling
              partners where geographic proximity is required to keep response times interactive. The adoption path
              therefore runs from technical benchmark or API trial, through workflow integration, to a production
              contract owned by infrastructure, product, marketing, commerce, or autonomy leaders; public evidence does
              not disclose conversion rates between those stages.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM016
      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal driver is that low-latency generation creates workflows that offline rendering cannot serve:
              live editing, responsive worlds, and closed-loop robot training. The principal constraint is proof of
              durable economics. ToolDirectory notes a fidelity trade-off versus batch renderers, while TechTimes
              reports uneven growth tied largely to custom engagements; both observations raise questions about product
              depth, repeatability, and sales concentration. Edge delivery can also add infrastructure dependencies
              before global deployment. For valuation, technical performance and launch engagement justify treating the
              category as real, but a revenue multiple cannot be grounded in public market-share data until Decart
              discloses segment revenue, paying-customer counts, retention, contract duration, gross margin, and
              customer concentration by DOS, Lucy, and Oasis.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM013
              - CM016
