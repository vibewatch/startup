      - number: '5.3'
        title: Maturity signals, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The maturity signal is strongest where independent or partner surfaces overlap with the official story.
              World-models.io independently describes OASIS as a real-time neural game engine, W&B frames Oasis 3 as
              production-grade tooling for robotics partners, and Forbes reports Lucy 2 running live at 1080p and 30
              frames per second while being tested in live creator and Omniverse-adjacent workflows. Even so, the
              evidence remains uneven. One assigned third-party WebRTC page resolves only to a newsletter-signup stub,
              and the assigned pool does not provide a public status page, third-party security certification, or
              explicit privacy/compliance documentation for Lucy or Oasis. That leaves Decart with a credible real-time
              architecture story, but a thinner public proof set around reliability, controls, and independent
              deployment depth than the headline performance claims imply.
            claimRefs:
