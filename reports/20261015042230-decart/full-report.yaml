              - CO014
      - number: '1.2'
        title: Leadership, capital, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              Independent May 2026 coverage gives the most usable leadership and capital snapshot. Calcalist identifies
              Dr. Dean Leitersdorf as CEO and Moshe Shalev as CPO, describing both as Unit 8200 veterans, while
              AIPressRoom at least corroborates the founder pair even if it contributes less operational detail. The
              same May 2026 reporting says Decart closed a $300 million round led by Radical Ventures, took total
              disclosed funding above $450 million, and reached an estimated valuation of roughly $4 billion after a
              prior August 2025 round at a reported $3.1 billion valuation. Just as important, Calcalist ties the
              financing to strategic counterparties rather than pure financial sponsorship: Amazon is described as a
              strategic customer, while NVIDIA is both investor and business partner. That combination matters for later
              diligence because it suggests Decart's cap table, distribution path, and compute-stack roadmap are already
              entangled with hyperscaler and chip-platform relationships, yet the retained public sources still do not
              expose board composition, governance rights, or cap-table control.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
