        title: Exhibits
        blocks:
          - type: callout
            title: Proxy evidence is not TAM
            body: >-
              Token volume, launch users, latency, and reported company revenue establish activity but cannot be summed
              or converted into an addressable-market estimate.
            calloutType: risk
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM014
          - type: callout
            title: Real-time performance defines the initial wedge
            body: >-
              The strongest adoption logic is concentrated in workflows where offline rendering, fixed simulation, or
              centralized inference cannot meet the required feedback loop.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
