      - number: '5.2'
        title: Architecture, APIs, and operational model
        blocks:
          - type: paragraph
            body: >-
              Oasis 3 is the clearest window into how Decart's stack actually works. The docs describe a hosted,
              stateful gRPC session where a user prompts a world, streams four-action control chunks, and receives
              generated camera frames back per stream, which is much closer to an operational simulator than to a
              one-shot media model. The main integration dependencies are Decart-hosted endpoints, API-key
              authentication, and the decart-oasis SDK, while W&B describes the internal development workflow as
              experiment- and artifact-driven with lineage and access controls. Together, those surfaces suggest real
              engineering depth and reproducibility effort, but they also reinforce how dependent the buyer experience
              is on Decart's hosted infrastructure and undocumented uptime, security, and support processes.
            claimRefs:
              - CE002
              - CE003
