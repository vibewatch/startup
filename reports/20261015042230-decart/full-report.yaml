  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure stays highest where valuation narratives and ambitious product claims outrun named customer,
      financial, or compliance proof.
    data:
      columns:
        - label: Likelihood
        - label: Current impact
        - label: Mitigation maturity
        - label: Residual exposure
      rows:
        - label: Valuation / transaction whiplash
          note: Rumored outcomes are material but unconfirmed.
          values:
            - text: Medium-High
              tone: high
              note: Independent reports cite talks that could still fall apart.
            - text: High
              tone: critical
              note: A failed or repriced process would reset market expectations quickly.
            - text: Low
              tone: medium
              note: Public mitigation is mostly narrative, not disclosed operating proof.
            - text: High
              tone: critical
              note: Do not underwrite to rumored marks without revenue support.
        - label: Execution across DOS + Lucy + Oasis
          note: Three product surfaces must scale at once.
          values:
            - text: High
              tone: critical
              note: Official materials emphasize simultaneous infrastructure and model launches.
            - text: High
              tone: critical
              note: Roadmap slippage would impair both product and financing credibility.
            - text: Medium
              tone: medium
              note: Technical ambition is visible; independent production proof is still limited.
            - text: High
              tone: critical
              note: Residual risk stays high until customer adoption is repeatable.
        - label: Platform / compute dependency
          note: Compute and cloud relationships are central to the story.
          values:
            - text: Medium
              tone: medium
              note: Multi-cloud positioning helps, but key partner access remains important.
            - text: High
              tone: high
              note: Hardware or cloud friction can degrade economics and latency claims.
            - text: Medium
              tone: medium
              note: Need portability proof and contract durability.
            - text: High
              tone: high
              note: Counterparty leverage remains meaningful in public evidence.
        - label: Regulatory / safety diligence gap
          note: Physical-AI use cases raise a higher diligence bar.
          values:
            - text: Medium
              tone: medium
              note: No confirmed public enforcement issue appears in the assigned pool.
            - text: High
              tone: high
              note: If compliance or validation is weak, downside is thesis-level.
            - text: Low
              tone: medium
              note: The current source set does not show mature public controls.
            - text: High
              tone: high
              note: Treat missing compliance evidence as unresolved, not benign.
        - label: Customer-proof and conversion gap
          note: Usage headlines are louder than named paid-deployment evidence.
          values:
            - text: High
              tone: high
              note: The current public set still lacks named paying customers and renewal proof.
            - text: High
              tone: high
              note: Commercial traction risk is central to whether premium valuation narratives hold.
            - text: Low
              tone: medium
              note: Public mitigation is still mostly marketing and broad vertical references.
            - text: High
              tone: critical
              note: Residual exposure remains high until revenue conversion is shown.
        - label: Financial opacity
          note: Capital raised is public, but operating quality remains mostly undisclosed.
          values:
            - text: Medium
              tone: medium
              note: The risk crystallizes whenever markets demand audited revenue, burn, or margin context.
            - text: High
              tone: high
              note: Missing economics can compress valuation quickly in a financing or M&A reset.
            - text: Low
              tone: medium
              note: No public revenue-quality bridge appears in the assigned evidence.
            - text: High
              tone: high
              note: Treat missing financial detail as a current underwriting constraint.
    approximationNotes: Ratings synthesize cited evidence into categorical risk judgments rather than numerical probabilities.
    claimRefs:
      - CR006
      - CR007
      - CR009
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Technical proof and strategic validation create upside, but sparse commercial and governance disclosure keeps the
      recommendation at track.
    data:
      nodes:
        - id: technical-proof
          label: Technical proof
          value: DOS plus Lucy and Oasis
          note: There is visible product proof in real-time video and physical-AI simulation.
        - id: strategic-validation
          label: Strategic validation
          value: Amazon customer; NVIDIA investor
          note: Large ecosystem players have already engaged as customer, investor, or partner.
        - id: commercial-opacity
          label: Commercial opacity
          value: No public revenue quality disclosure
          note: >-
            The company cites contracts, but the public record still lacks audited revenue, retention, and margin
            detail.
        - id: price-anchors
          label: Price anchors
          value: Reported $4B round; rumored ~$7B ceiling
          note: The record contains a current financing mark and a strategic-takeout rumor, but not a broad comp set.
        - id: structure-gap
          label: Capital structure gap
          value: Preferences and control undisclosed
          note: New-money downside cannot be underwritten cleanly without the full cap table and governance terms.
        - id: recommendation
          label: Recommendation
          value: Track / high risk / stretched
          note: Move to buy only if diligence closes the economic and structural disclosure gaps or price resets.
      edges:
        - from: technical-proof
          to: strategic-validation
          label: enables
        - from: strategic-validation
          to: price-anchors
          label: supports upside
        - from: commercial-opacity
          to: price-anchors
          label: limits precision
        - from: price-anchors
          to: recommendation
          label: frames entry
        - from: structure-gap
          to: recommendation
          label: keeps risk high
    approximationNotes: >-
      The flow is analytical rather than quantitative: it explains how current evidence moves the call, not a
      mathematically scored model.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV014
