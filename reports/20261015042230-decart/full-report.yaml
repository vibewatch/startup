  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute sets
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a single "AI video" peer group for Decart. Its public surface spans
              DOS infrastructure, Lucy live video editing, and Oasis interactive world generation, so the buyer's
              substitute set changes with the workflow. For creator and brand use cases, the retained comparison source
              frames Runway Gen-4, Google Veo 3, and OpenAI Sora 2 as the relevant alternatives. For robotics and
              physical-AI teams, Decart itself frames CARLA, Isaac Sim, Genie 3, and Nvidia Cosmos as the more relevant
              substitutes. That split matters because Decart appears to be competing first on interactivity and
              deployment shape, not on the same polished offline output the batch video leaders optimize for.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
