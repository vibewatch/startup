              - CI015
      - number: '4.3'
        title: Fresh capital reduces immediate pressure, but core underwriting data remains private
        blocks:
          - type: paragraph
            body: >-
              Financially, the clearest new fact is the May 2026 financing: Decart publicly announced a $300M round and
              multiple outlets place total disclosed funding above $450M. That scale of financing likely reduces
              near-term pressure to raise immediately and gives the company time to continue building DOS, Lucy, and
              Oasis. Even so, the public valuation anchor is imprecise, with coverage ranging from roughly $3.1B to
              nearly $4B, and TNW explicitly reported that Decart did not disclose run-rate revenue, the new valuation,
              or the hyperscaler customers licensing DOS. More importantly, the retained public evidence never closes
              the basics of underwriting: there is no disclosed revenue by product line, no gross margin, no CAC or
              payback, no burn, no cash balance, and no runway. The chapter verdict is therefore that Decart may have
              rare strategic momentum and strong financing support, but revenue quality, margin path, and capital
              efficiency remain diligence blockers rather than established facts.
            claimRefs:
              - CI005
              - CI006
              - CI012
              - CI014
              - CI015
