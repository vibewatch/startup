      - number: '3.3'
        title: Distribution, lock-in, and incumbent response
        blocks:
          - type: paragraph
            body: >-
              Decart's moat is not only model behavior; it is also the DOS stack beneath those models. Third-party
              reporting describes DOS as hardware-aware and usable across Nvidia GPUs, Amazon Trainium, and Google TPUs,
              which lowers chip-vendor lock-in relative to vendor-bound optimization layers and lets Decart sell
              infrastructure into existing customer estates. Calcalist and AIPressRoom also say Amazon is already a
              strategic customer while Nvidia is both investor and business partner. That combination can accelerate
              enterprise trust and distribution, but it also means the most powerful incumbents can respond through
              bundled cloud, chip, or frontier-lab relationships instead of only feature-by-feature product copying.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: Durability limits and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a real latency wedge, but it does not prove Decart wins every mode of video
              or simulation demand. The comparison source explicitly leaves polished narrative shots to Runway, Veo, and
              Sora, which suggests the company is running a different race rather than a universal quality race. Public
              pricing and contract structure are also thin: the sources show a free demo, open weights, API access, and
              "Talk to an Expert" motions, but not list prices, discounting, or customer spend. Finally, acquisition
              reporting introduces ecosystem risk because an Anthropic deal could tighten access to consumer endpoints
              or repurpose the team into infrastructure work, which would change how third parties rely on Decart's
              current product surface.
            claimRefs:
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Latency is the real wedge
            body: >-
              The retained evidence consistently differentiates Decart on live response time and closed-loop control,
              not on being the best all-purpose offline video model.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP011
          - type: callout
            title: Competitive durability still depends on proof beyond demos
            body: >-
              Public pricing, named production customers, and independent benchmarks are still sparse, so the current
              moat thesis leans heavily on technical positioning and partner signaling.
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Multi-line monetization thesis is visible, but realized pricing is not
        blocks:
          - type: paragraph
            body: >-
              Decart's public materials consistently describe three commercial surfaces: DOS as the optimization and
              infrastructure layer, Lucy as the real-time video product, and Oasis as the physical-AI world-model
              product. That mix matters because it implies the company is not trying to monetize a single consumer app;
              it is trying to sell infrastructure and higher-level model experiences into enterprise workflows. The
              product pages and launch coverage point to API access, enterprise deployments, commercial agreements, and
              expert-led outreach rather than self-serve checkout, which is directionally consistent with sales-led
              software and infrastructure revenue. What remains missing is the actual commercial contract shape. None of
              the retained public sources publish list pricing, realized pricing, committed usage minimums, or contract
              durations for DOS, Lucy, or Oasis, so the monetization thesis is intelligible but the price realization
              layer still requires private diligence.
            claimRefs:
