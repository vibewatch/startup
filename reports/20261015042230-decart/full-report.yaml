  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix spans creators, enterprises, and physical-AI teams
        blocks:
          - type: paragraph
            body: >-
              Decart's public go-to-market is bifurcated between immersive-video use cases and physical-AI simulation.
              On the Lucy side, the company positions the product for enterprises, brands, creators, and viewers across
              retail and e-commerce, advertising, social media, live streaming, and gaming. On the Oasis side, Decart
              frames the initial buyer set as robotics teams, AV companies, and research groups that need closed-loop
              simulated environments rather than consumer entertainment alone. Calcalist adds a higher-value
              infrastructure layer on top of those verticals by reporting contracts with cloud providers, AI labs, and
              hyperscalers. The result is a customer map with multiple user surfaces, but the largest disclosed economic
              value likely sits in a still-thin set of platform relationships rather than in disclosed long-tail
              self-serve accounts.
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU010
              - CU011
              - CU014
      - number: '6.2'
        title: Adoption proof is real, but it mixes consumer reach, benchmarks, and unnamed contracts
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is directionally positive but heterogeneous. Decart's about page says
              Oasis reached 1 million users in 72 hours, while an ACCESS Newswire release says the company's models
              power millions of users. Those signals matter because they move Decart beyond lab-demo status, but they
              are not equivalent to paid enterprise retention. Named deployment proof is clearest around technical
              validation: Comcast benchmarked Lucy on distributed NVIDIA-powered edge infrastructure at sub-35
              millisecond latency, and AIPressRoom says Lucy is already deployed in virtual try-on, live streaming, and
              in-video advertising. Calcalist separately reports revenue-generating contracts with several cloud
              providers, AI labs, and hyperscale companies. Taken together, the evidence supports real market pull, but
              the public record still blends user scale, benchmark scale, and contracted scale into one narrative.
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU009
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU009
              - CU011
              - CU012
      - number: '6.3'
        title: Named customer proof is concentrated in strategic-platform references
        blocks:
          - type: paragraph
            body: >-
              The clearest named commercial proof in the assigned pool clusters around large platform counterparties
              rather than a diversified list of end customers. Calcalist says Amazon joined as a strategic customer and
              describes AWS collaboration for media, commerce, advertising, and physical-AI workloads. ACCESS Newswire
              ties Decart to Comcast and NVIDIA in a benchmarked edge-inference setting. That is useful proof that
              sophisticated partners are willing to work with Decart, but it is still more design-partner and
              infrastructure-validation evidence than a mature roster of disclosed production accounts with contract
              values, deployment breadth, or renewal history. The public chapter, therefore, supports platform relevance
              but not broad customer-base diversification.
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU013
      - number: '6.4'
        title: Durability, expansion, and concentration remain the main diligence gap
        blocks:
          - type: paragraph
            body: >-
              The core customer risk is not whether Decart has any adoption; it is whether the company can convert a
              handful of strategic references into repeatable, diversified, and durable revenue. Venture Capital
              Tracker's caution that a multibillion-dollar valuation still requires enterprise or platform distribution
              rather than demo reels captures the right burden of proof. Within the assigned evidence set, none of the
              retained sources disclose customer count, NRR, GRR, churn, renewal rates, contract length, or top-customer
              mix. That leaves investors unable to distinguish pilot enthusiasm from durable production usage, or to
              quantify how dependent Decart may be on a few hyperscalers, cloud providers, or flagship partnership
              channels for its current revenue trajectory.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real adoption is visible, but the signals are not directly comparable
            body: >-
              Decart's public proof mixes consumer uptake, platform benchmarks, and enterprise-contract references. That
              is enough to show traction, but not enough to derive a clean funnel from usage to durable revenue.
            calloutType: insight
            claimRefs:
              - CU004
              - CU006
              - CU009
          - type: callout
            title: Named counterparties are high quality
            body: >-
              Amazon, Comcast, and NVIDIA are credible proof surfaces for technical and commercial relevance; the issue
              is depth and diversification of disclosed customer relationships, not whether sophisticated institutions
              engage with the product.
            calloutType: strength
            claimRefs:
              - CU005
              - CU010
          - type: callout
            title: Customer durability is still largely private
            body: >-
              The assigned public evidence does not disclose logo count, NRR, churn, contract length, or top-customer
              mix, so concentration and expansion quality remain major underwriting questions.
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The top risks are valuation whiplash, product sprawl, and proof gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a high-level risk ranking even without a disclosed lawsuit or enforcement action.
              First, Decart is being discussed in rapidly moving strategic-transaction narratives. One independent
              source frames Anthropic at around $6 billion, while Mint cites Amazon talks at around $7 billion and
              explicitly says those talks could still fall apart. Second, the company is trying to commercialize a full
              stack at once—DOS infrastructure, Lucy for live video, and Oasis for physical-AI simulation—which expands
              execution surface area before public revenue, retention, or margin disclosure catches up. Third, the
              loudest operating proof in the current source set is product-speed and usage marketing, not durable
              customer economics or audited financials.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Physical-AI and safety exposure is credible, but public compliance detail is thin
        blocks:
          - type: paragraph
            body: >-
              The official Oasis materials make the regulatory and safety question unavoidable because Decart is not
              positioning the product as a toy benchmark; it says Oasis is for physical AI and is starting with
              autonomous vehicles. That creates real diligence burden around simulation validity, model misuse, customer
              safety workflows, and any sector-specific compliance overlays. Yet the assigned public evidence does not
              confirm licenses, certifications, disclosed incident history, or a litigation record tied to those use
              cases. That does not prove a hidden problem, but it does mean investors should treat regulatory, legal,
              and safety diligence as an open gate rather than as de-risked simply because the product is technically
              impressive.
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.3'
        title: Operational scaling risk is amplified by ambitious latency claims and sparse customer proof
        blocks:
          - type: paragraph
            body: >-
              Decart's official pages market extreme responsiveness—sub-40ms Lucy edits and Oasis response under
              200ms—across video, simulation, and physical-AI workflows. Those promises are strategically attractive,
              but they also raise the bar for uptime, model quality, deterministic behavior, and supportability in
              enterprise deployments. The same public set still leaves customer proof thin: the About page highlights
              Oasis reaching 1M users in 72 hours, and Lucy references partners and customers plus broad verticals, but
              the assigned evidence does not identify named paying customers, renewals, concentration, or conversion
              from viral usage into recurring revenue. That combination makes commercialization and service reliability
              a top underwriting risk.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR013
      - number: '7.4'
        title: Partner leverage and financing opacity could magnify downside quickly
        blocks:
          - type: paragraph
            body: >-
              The partner map is promising but not yet obviously diversified enough to neutralize dependency risk.
              Independent reporting says DOS runs across Nvidia GPUs, Google TPUs, and Amazon Trainium, and Mint
              separately notes AWS gave Decart early access to Trainium3. That is helpful for platform flexibility, but
              it also means supplier relationships and privileged compute access are central to the product story.
              Meanwhile, AIPressRoom says the company did not disclose current valuation or run-rate revenue even while
              raising another $300 million, and Venture Capital Tracker warns that multibillion-dollar valuations
              require enterprise or platform distribution rather than demo-driven excitement. If transaction rumors fade
              or financing expectations reset before operating proof catches up, the downside could compress quickly.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before a bullish underwriting case
            body: >-
              Do not underwrite a premium outcome unless diligence can show named production customers, retention or
              repeat usage, credible revenue or margin visibility, and compliance / safety documentation for physical-AI
              deployments. Rumored strategic interest alone is not a substitute for these proofs.
            calloutType: risk
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: callout
            title: What would de-risk the story fastest
            body: >-
              The fastest de-riskers would be a customer-quality bridge from usage to paid deployments, durable
              multi-platform compute economics, and a regulator- or enterprise-grade trust package that matches the
              autonomous-vehicle and live-video positioning.
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The price-sensitive call remains track with medium confidence, high risk, and a stretched valuation
              stance. Public evidence shows real strategic validation: Calcalist reports a $300 million round at an
              estimated $4 billion valuation with Amazon as a strategic customer and NVIDIA as both investor and
              partner, while The Wall Street Journal reports Amazon discussed an acquisition around $7 billion. But
              those anchors still bracket a wide range rather than underwriting a precise entry price. The reviewed
              sources do not disclose audited revenue, gross margin, retention, or the preference stack, so the market
              can observe technical proof and partner interest without seeing the commercial quality that should justify
              paying above the last mark.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Upside proof versus underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The upside case is not imaginary. Decart presents a coherent stack of DOS plus Lucy and Oasis, with Lucy
              positioned for live video editing and Oasis 3 aimed first at autonomous-vehicle simulation and then
              broader physical-AI use cases. That technical narrative has attracted heavyweight validation: Calcalist
              says Amazon joined as a strategic customer and NVIDIA invested, while the company says it is already
              generating revenue through contracts with large cloud providers, AI laboratories, and hyperscale
              companies. The underwriting problem is that the public package stops short of the numbers an investor
              needs. AIPressRoom explicitly notes that Decart did not disclose current valuation or run-rate revenue,
              and the reviewed public sources still do not disclose gross margin, retention, customer concentration,
              board control, or liquidation preferences.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario envelope and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              The public record supports an outcome envelope, not a clean fair-value point estimate. The best hard price
              anchor remains the reported $4 billion May 2026 financing. The best upside signal is the rumored ~$7
              billion Amazon process, which could prove strategic scarcity but is not equivalent to a signed transaction
              or a standalone public comparable set. Meanwhile, lower-quality directories still surface stale or partial
              funding snapshots, which is another sign that the external record is thin outside a few key reports. That
              makes diligence on current revenue quality, customer concentration, preference terms, and exit process
              discipline the final gating work: if those items clear, the range can re-rate upward; if they do not, the
              downside can fall back toward or below the last private mark.
            claimRefs:
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Decart has enough product and partner proof to stay investable, but not enough public commercial and
              governance disclosure to underwrite an aggressive entry above the last private round.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV014
          - type: callout
            title: The missing data is economic, not technical
            body: >-
              The main gating questions are revenue quality, retention, margins, concentration, and preference terms,
              not whether the company can build compelling product demos.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV013
