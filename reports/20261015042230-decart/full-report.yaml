chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              The clearest current fact pattern is product-centered rather than metrics-centered. On its own website,
              Decart says it is building "the infrastructure and models that make AI run at the speed of reality," with
              DOS as the optimization and inference/training layer and Lucy plus Oasis as productized world-model
              surfaces for live video and physical-AI simulation. The official product pages make the split concrete:
              Lucy is framed as live video editing for brands, creators, gaming, and commerce, while Oasis is framed as
              API-accessible, low-latency simulation infrastructure for robotics and autonomous-vehicle workflows. That
              supports a working view of Decart as a private AI application-infrastructure company monetizing both stack
              performance and downstream model use cases, not just a single demo product. What remains notably absent
              from the current public material is the operating baseline that would normally anchor this positioning: no
              retained source here discloses run-rate revenue, customer count, or headcount, so product ambition is well
              evidenced while scale is not.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
