schemaVersion: report-v2
artifact: customers
slug: decart
runDate: 2026-10-15
company:
  name: Decart
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real adoption across both consumer-facing experiences and large-platform
    infrastructure relationships: Decart says Oasis reached 1 million users in 72 hours, Access
    Newswire says its models power millions of users, and Calcalist reports Amazon joined as a
    strategic customer. The commercial proof is still concentrated in a small set of named
    counterparties, and the assigned source set does not disclose customer count, retention,
    renewal, or concentration metrics.
sections:
  - id: customer-segmentation
    title: Customer mix spans creators, enterprises, and physical-AI teams
    body: >-
      Decart's public go-to-market is bifurcated between immersive-video use cases and physical-AI
      simulation. On the Lucy side, the company positions the product for enterprises, brands,
      creators, and viewers across retail and e-commerce, advertising, social media, live
      streaming, and gaming. On the Oasis side, Decart frames the initial buyer set as robotics
      teams, AV companies, and research groups that need closed-loop simulated environments rather
      than consumer entertainment alone. Calcalist adds a higher-value infrastructure layer on top
      of those verticals by reporting contracts with cloud providers, AI labs, and hyperscalers.
      The result is a customer map with multiple user surfaces, but the largest disclosed economic
      value likely sits in a still-thin set of platform relationships rather than in disclosed
      long-tail self-serve accounts.
    claimRefs: [CU002, CU003, CU006, CU007, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is real, but it mixes consumer reach, benchmarks, and unnamed contracts
    body: >-
      The strongest adoption evidence is directionally positive but heterogeneous. Decart's about
      page says Oasis reached 1 million users in 72 hours, while an ACCESS Newswire release says
      the company's models power millions of users. Those signals matter because they move Decart
      beyond lab-demo status, but they are not equivalent to paid enterprise retention. Named
      deployment proof is clearest around technical validation: Comcast benchmarked Lucy on
      distributed NVIDIA-powered edge infrastructure at sub-35 millisecond latency, and
      AIPressRoom says Lucy is already deployed in virtual try-on, live streaming, and in-video
      advertising. Calcalist separately reports revenue-generating contracts with several cloud
      providers, AI labs, and hyperscale companies. Taken together, the evidence supports real
      market pull, but the public record still blends user scale, benchmark scale, and contracted
      scale into one narrative.
    claimRefs: [CU001, CU004, CU006, CU007, CU009, CU012]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof is concentrated in strategic-platform references
    body: >-
      The clearest named commercial proof in the assigned pool clusters around large platform
      counterparties rather than a diversified list of end customers. Calcalist says Amazon joined
      as a strategic customer and describes AWS collaboration for media, commerce, advertising, and
      physical-AI workloads. ACCESS Newswire ties Decart to Comcast and NVIDIA in a benchmarked
      edge-inference setting. That is useful proof that sophisticated partners are willing to work
      with Decart, but it is still more design-partner and infrastructure-validation evidence than
      a mature roster of disclosed production accounts with contract values, deployment breadth, or
      renewal history. The public chapter, therefore, supports platform relevance but not broad
      customer-base diversification.
    claimRefs: [CU005, CU006, CU010, CU013]
    tableRefs: [TU003]
  - id: durability-and-risk
    title: Durability, expansion, and concentration remain the main diligence gap
    body: >-
      The core customer risk is not whether Decart has any adoption; it is whether the company can
      convert a handful of strategic references into repeatable, diversified, and durable revenue.
      Venture Capital Tracker's caution that a multibillion-dollar valuation still requires
      enterprise or platform distribution rather than demo reels captures the right burden of proof.
      Within the assigned evidence set, none of the retained sources disclose customer count, NRR,
      GRR, churn, renewal rates, contract length, or top-customer mix. That leaves investors unable
      to distinguish pilot enthusiasm from durable production usage, or to quantify how dependent
      Decart may be on a few hyperscalers, cloud providers, or flagship partnership channels for
      its current revenue trajectory.
    claimRefs: [CU008, CU010, CU011, CU013]
