callouts:
  - calloutType: insight
    title: Real adoption is visible, but the signals are not directly comparable
    body: >-
      Decart's public proof mixes consumer uptake, platform benchmarks, and enterprise-contract
      references. That is enough to show traction, but not enough to derive a clean funnel from
      usage to durable revenue.
    claimRefs: [CU004, CU006, CU009]
  - calloutType: strength
    title: Named counterparties are high quality
    body: >-
      Amazon, Comcast, and NVIDIA are credible proof surfaces for technical and commercial
      relevance; the issue is depth and diversification of disclosed customer relationships, not
      whether sophisticated institutions engage with the product.
    claimRefs: [CU005, CU010]
  - calloutType: risk
    title: Customer durability is still largely private
    body: >-
      The assigned public evidence does not disclose logo count, NRR, churn, contract length, or
      top-customer mix, so concentration and expansion quality remain major underwriting questions.
    claimRefs: [CU008, CU011, CU013]
