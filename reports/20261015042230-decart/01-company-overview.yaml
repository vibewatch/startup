      - ["NVIDIA", "Investor and business partner", "Strategic capital plus stack alignment around chips/inference infrastructure", "Clarify whether commercial commitments, hardware access, or exclusivity terms accompany the investment."]
      - ["Amazon", "Strategic customer", "Commercial relationship can validate product-market pull and shape infrastructure roadmap", "Quantify contract scope, revenue concentration, and whether any acquisition discussions changed customer economics."]
      - ["Sequoia Capital", "Existing investor", "Repeatedly named as an incumbent backer across retained sources", "Confirm ownership, round-to-round support, and whether governance rights changed after the 2026 round."]
      - ["Benchmark", "Existing investor", "Repeatedly named as an incumbent backer across retained sources", "Confirm ownership, board representation, and liquidation-preference stack alongside the 2026 financing."]
    notes: >-
      Partial public stakeholder map built from named investors and strategic counterparties in May 2026
      reporting; it is not a full cap table and omits undisclosed ownership percentages and board rights.
    enumerationScope:
      coverage: partial
      basis: Publicly named investors and strategic counterparties in retained 2026 funding coverage, not a full ownership ledger.
    claimRefs: [CO005, CO006, CO008]
