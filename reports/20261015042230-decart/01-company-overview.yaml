          detail: Calcalist reports a $100M round at a $3.1B valuation in August 2025.
          tone: positive
          claimRefs: [CO006]
        - date: 2026-05-18
          label: $300M round reported
          detail: Independent May 2026 reports say Decart raised $300M and crossed $450M in total disclosed funding.
          tone: positive
          claimRefs: [CO005]
        - date: 2026-05-18
          label: Strategic counterparties surfaced
          detail: Calcalist says Amazon joined as a strategic customer while NVIDIA was both investor and business partner.
          tone: positive
          claimRefs: [CO008]
        - date: 2026-05-18
          label: Product refresh signaled
          detail: Official materials say DOS 2.0 plus new Lucy and Oasis versions were launching in the coming weeks.
          tone: neutral
          claimRefs: [CO012]
        - date: 2026-10-11
          label: Acquisition talks reported but unconfirmed
          detail: Mint says Amazon was in talks around a possible ~$7B deal, but the discussions could still fall apart.
          tone: risk
          claimRefs: [CO010]
    approximationNotes: >-
      Pre-2025 chronology relies partly on a single lower-reputation profile source; the better-corroborated
      milestones are the 2025-2026 funding, partnership, and launch-related items.
    claimRefs: [CO005, CO006, CO008, CO010, CO011, CO012]
callouts:
  - calloutType: strength
    title: Integrated stack is the clearest differentiated identity signal
    body: >-
      Even without public revenue disclosure, Decart's retained official materials consistently present a
      coherent product stack: DOS as infrastructure, Lucy as live world editing, and Oasis as physical-AI
      simulation. That is a stronger identity signal than a single viral model demo.
    claimRefs: [CO001, CO002, CO003, CO004, CO015]
  - calloutType: risk
    title: Capital formation is better evidenced than operating scale
    body: >-
      The 2025-2026 financing record is relatively clear, but revenue, customer count, headcount, board
      composition, and exact corporate locus remain sparse or conflicting in the retained public record.
    claimRefs: [CO006, CO009, CO010, CO013, CO014]
