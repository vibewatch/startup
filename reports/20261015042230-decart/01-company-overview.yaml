company:
  name: Decart
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Decart now presents itself as a vertically integrated AI infrastructure and world-model company,
    anchored by DOS, Lucy, and Oasis, and independent 2026 reporting corroborates a $300 million
    financing that pushed total disclosed funding above $450 million. The public record is still
    thin on operating scale, board/governance detail, and even current headquarters labeling, so
    the identity and funding story are clearer than the revenue and control picture.
sections:
  - id: identity-and-product-scope
    title: Identity and product scope
    body: >-
      The clearest current fact pattern is product-centered rather than metrics-centered. On its own
      website, Decart says it is building "the infrastructure and models that make AI run at the speed
      of reality," with DOS as the optimization and inference/training layer and Lucy plus Oasis as
      productized world-model surfaces for live video and physical-AI simulation. The official product
      pages make the split concrete: Lucy is framed as live video editing for brands, creators, gaming,
      and commerce, while Oasis is framed as API-accessible, low-latency simulation infrastructure for
      robotics and autonomous-vehicle workflows. That supports a working view of Decart as a private AI
      application-infrastructure company monetizing both stack performance and downstream model use cases,
      not just a single demo product. What remains notably absent from the current public material is the
      operating baseline that would normally anchor this positioning: no retained source here discloses
      run-rate revenue, customer count, or headcount, so product ambition is well evidenced while scale is not.
    claimRefs: [CO001, CO002, CO003, CO004, CO009, CO015]
    tableRefs: [TO001]
  - id: leadership-capital-and-stakeholders
    title: Leadership, capital, and strategic stakeholders
    body: >-
      Independent May 2026 coverage gives the most usable leadership and capital snapshot. Calcalist
      identifies Dr. Dean Leitersdorf as CEO and Moshe Shalev as CPO, describing both as Unit 8200
      veterans, while AIPressRoom at least corroborates the founder pair even if it contributes less
      operational detail. The same May 2026 reporting says Decart closed a $300 million round led by
      Radical Ventures, took total disclosed funding above $450 million, and reached an estimated
      valuation of roughly $4 billion after a prior August 2025 round at a reported $3.1 billion
      valuation. Just as important, Calcalist ties the financing to strategic counterparties rather
      than pure financial sponsorship: Amazon is described as a strategic customer, while NVIDIA is
      both investor and business partner. That combination matters for later diligence because it
      suggests Decart's cap table, distribution path, and compute-stack roadmap are already entangled
      with hyperscaler and chip-platform relationships, yet the retained public sources still do not
      expose board composition, governance rights, or cap-table control.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-open-questions
    title: Scale signals, milestones, and open questions
    body: >-
      The milestone record is directionally strong but unevenly sourced. The official site itself now
      foregrounds the 2026 financing and associated DOS 2.0, Lucy, and Oasis updates, while Mint adds
      a current October 2026 signal that Amazon acquisition talks at around $7 billion were reported but
      remained unconfirmed. Earlier operating history is shakier: AI Chopping Block says the company was
      registered in September 2023 and had paying customers by December 2023, but that early commercial
      chronology is only single-source within this pool. There is also a nontrivial identity ambiguity
      still worth clearing in diligence. Calcalist repeatedly frames Decart as an Israeli company founded
      in late 2023, whereas Mint describes it as San Francisco-based; that difference could reflect legal
      domicile versus go-to-market presence, but the current retained record does not let us resolve it.
      The overarching takeaway is that fundraising momentum and product cadence are easier to verify than
      the company's present operating scale, governance structure, and exact corporate footprint.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
