          detail: AI Chopping Block says the founders registered Decart in September 2023.
          tone: neutral
          claimRefs: [CO011]
        - date: 2023-12
          label: Paying customers claimed
          detail: The same profile says Decart had paying customers by December 2023, but the datapoint is single-source in this pool.
          tone: neutral
          claimRefs: [CO011]
        - date: 2025
