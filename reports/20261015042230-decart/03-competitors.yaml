          claimRefs: [CP006]
        - label: Google Veo 3
          x: 1
          y: 2
          detail: Highest-fidelity text-to-video with audio in retained comparison, not a live tool.
          claimRefs: [CP006]
        - label: OpenAI Sora 2
          x: 1
          y: 2
          detail: Consumer text-to-video and social creation in retained comparison.
          claimRefs: [CP006]
        - label: Nvidia Cosmos
          x: 1
          y: 5
          detail: Offline world simulation for robotics in retained comparison.
          claimRefs: [CP006, CP015]
        - label: CARLA / Isaac Sim
          x: 1
          y: 5
          detail: Fixed-scene physics and simulation substitutes that Decart contrasts with prompt-driven generation.
          claimRefs: [CP004, CP015]
    approximationNotes: >-
      The axes are ordinal evidence summaries, not measured benchmarks or market
      shares. Scores compress qualitative descriptions from retained sources into
      a comparable map of workflow position.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP015]
callouts:
  - calloutType: strength
    title: Latency is the real wedge
    body: >-
      The retained evidence consistently differentiates Decart on live response
      time and closed-loop control, not on being the best all-purpose offline
      video model.
    claimRefs: [CP002, CP003, CP006, CP011]
  - calloutType: risk
    title: Competitive durability still depends on proof beyond demos
    body: >-
      Public pricing, named production customers, and independent benchmarks are
      still sparse, so the current moat thesis leans heavily on technical
      positioning and partner signaling.
    claimRefs: [CP009, CP012, CP013]
