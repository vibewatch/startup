    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - [Decart Lucy / Mirage, direct, "Decart total funding above $450M; product-specific scale undisclosed", enterprises / brands / creators / live video, "Real-time or near-real-time live video transformation; hosted demo plus local-edit path", "Narrative-video quality leadership versus batch tools is not established in assigned evidence"]
      - [Decart Oasis, direct, "Same company scale as above; Oasis-specific revenue undisclosed", robotics teams / AV developers / research groups, "API-accessible interactive world model for physical AI with closed-loop control", "No retained public pricing or named production customers"]
      - [Runway Gen-4, direct-adjacent, "Not supported in assigned evidence", polished narrative-video creators, "Minutes-per-clip text/image-to-video workflow", "Assigned evidence does not establish real-time behavior, pricing, or enterprise traction"]
      - [Google Veo 3, incumbent-adjacent, "Not supported in assigned evidence", high-fidelity video creators, "Text-to-video with audio; highest fidelity in retained comparison", "Assigned evidence places it in minutes-per-clip workflow, not live interaction"]
      - [OpenAI Sora 2, incumbent-adjacent, "Not supported in assigned evidence", consumer and social creation, "Text-to-video and social-app style creation", "Assigned evidence does not show open weights, local control, or live deployment shape"]
      - [Nvidia Cosmos / CARLA / Isaac Sim, substitute, "Not supported in assigned evidence", robotics / simulation teams, "Offline world simulation or fixed-scene physics/simulation workflows", "Less evidence of live prompt-driven world generation in retained sources"]
    notes: >-
      Rows intentionally mix product and substitute class because the assigned
      evidence separates buyer alternatives by workflow. Unknown scale, pricing,
      and traction cells are left explicit rather than inferred.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP011, CP015]
