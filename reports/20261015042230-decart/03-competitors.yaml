    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Decart live video
      - Decart Oasis
      - Batch video generators
      - Simulation substitutes
      - Implication
    rows:
      - [Live responsiveness, "Sub-40ms / real-time", "Under 200ms closed loop", "Minutes per clip", "Offline or fixed-scene in retained evidence", "Decart appears strongest when latency is part of the product value"]
      - [Closed-loop control, "Interactive edits while video is live", "Action-conditioned API environment", "Not established in retained evidence", "Physics/sim tools support control but not prompt-driven world generation", "Physical-AI buyers should compare control-loop quality, not only fidelity"]
      - [Deployment shape, "Hosted demo plus local Lucy Edit path", "API-accessible infrastructure motion", "Mostly proprietary hosted tools in retained comparison", "More self-managed or engine-like", "Decart combines developer access with managed delivery"]
      - [Hardware / infrastructure portability, "Runs on DOS stack", "Runs on DOS stack", "Not established in retained comparison", "Varies by stack; not fully supported in assigned evidence", "DOS is the main wedge against infrastructure lock-in"]
      - [Primary use case, "Streaming, retail, advertising, gaming", "AV, robotics, research simulation", "Narrative or consumer video creation", "Robotics and simulation workflows", "Competitor class changes with the buyer's job to be done"]
    notes: >-
      Matrix cells summarize only retained evidence. Unsupported competitor-side
      attributes are marked as not established rather than guessed.
    claimRefs: [CP002, CP003, CP006, CP007, CP008, CP011, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - [Decart MirageLSD demo, "Free hosted browser access", "Live stream restyling", "No public enterprise conversion terms retained", "Useful for adoption and product-led proof, but monetization path is still opaque"]
      - [Decart Lucy Edit Dev, "Open weights; local GPU deployment", "Instruction-based video editing", "No public support, SLA, or commercial terms retained", "Reduces ecosystem lock-in for developers willing to self-manage"]
      - [Decart enterprise motion, "API access and contact-sales motion; list pricing undisclosed", "Live video and world-model workflows backed by DOS", "No retained list price, discounting, or contract duration", "Pricing power cannot be underwritten from public evidence alone"]
      - [Runway / Veo / Sora class, "Proprietary hosted access in retained comparison; exact prices not retained", "Batch video generation and consumer creation", "No retained enterprise packaging or discount evidence", "Competes on convenience and quality, but the cost basis is unresolved here"]
      - [Cosmos / CARLA / Isaac Sim class, "Self-managed or model/engine style access; exact prices not retained", "Offline simulation or fixed-scene workflows", "No retained TCO comparison with Decart", "May offer control, but integration burden likely shifts to the buyer"]
    notes: >-
      The assigned pool supports packaging shape better than hard pricing. This
      table preserves that asymmetry and turns missing commercial data into a
      diligence item instead of a fabricated estimate.
    claimRefs: [CP007, CP012]
