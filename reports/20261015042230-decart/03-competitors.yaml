company:
  name: Decart
chapter:
  number: 3
  title: Competitors
  summary: >-
    Decart's competitive set splits into two jobs: live video transformation and
    physical-AI world generation. The strongest documented wedge in the assigned
    evidence is low-latency interactivity plus hardware-aware inference, while
    pricing transparency, named customer proof, and independent benchmarking
    remain limited.
sections:
  - id: landscape-and-substitutes
    title: Landscape and substitute sets
    body: >-
      The assigned evidence does not support a single "AI video" peer group for
      Decart. Its public surface spans DOS infrastructure, Lucy live video
      editing, and Oasis interactive world generation, so the buyer's substitute
      set changes with the workflow. For creator and brand use cases, the
      retained comparison source frames Runway Gen-4, Google Veo 3, and OpenAI
      Sora 2 as the relevant alternatives. For robotics and physical-AI teams,
      Decart itself frames CARLA, Isaac Sim, Genie 3, and Nvidia Cosmos as the
      more relevant substitutes. That split matters because Decart appears to be
      competing first on interactivity and deployment shape, not on the same
      polished offline output the batch video leaders optimize for.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-packaging
    title: Capability and packaging differentiation
    body: >-
      The clearest differentiation in the retained evidence is that Decart is
      selling immediacy. Lucy is described as sub-40ms live editing at up to 100
      FPS for enterprises, brands, and creators, while Oasis is described as an
      API-accessible, action-conditioned world model for physical AI with under
      200ms end-to-end latency. The independent comparison article reinforces the
      same positioning by placing Decart's MirageLSD and Lucy Edit in real-time
      or near-real-time lanes while labeling Runway, Veo, and Sora as
      minutes-per-clip tools and Cosmos as offline simulation. Packaging also
      matters: the same source says Mirage is hosted and free to try, Lucy Edit
      ships open development weights, and several rivals remain proprietary
      hosted tools in the assigned evidence.
    claimRefs: [CP002, CP003, CP006, CP007, CP011]
    tableRefs: [TP002, TP003]
  - id: distribution-lock-in-and-response
    title: Distribution, lock-in, and incumbent response
    body: >-
      Decart's moat is not only model behavior; it is also the DOS stack beneath
      those models. Third-party reporting describes DOS as hardware-aware and
      usable across Nvidia GPUs, Amazon Trainium, and Google TPUs, which lowers
      chip-vendor lock-in relative to vendor-bound optimization layers and lets
      Decart sell infrastructure into existing customer estates. Calcalist and
      AIPressRoom also say Amazon is already a strategic customer while Nvidia
      is both investor and business partner. That combination can accelerate
      enterprise trust and distribution, but it also means the most powerful
      incumbents can respond through bundled cloud, chip, or frontier-lab
      relationships instead of only feature-by-feature product copying.
    claimRefs: [CP008, CP009, CP010, CP014]
  - id: durability-limits-and-diligence-gaps
    title: Durability limits and diligence gaps
    body: >-
      The assigned evidence supports a real latency wedge, but it does not prove
      Decart wins every mode of video or simulation demand. The comparison
      source explicitly leaves polished narrative shots to Runway, Veo, and
      Sora, which suggests the company is running a different race rather than a
      universal quality race. Public pricing and contract structure are also
      thin: the sources show a free demo, open weights, API access, and "Talk to
      an Expert" motions, but not list prices, discounting, or customer spend.
      Finally, acquisition reporting introduces ecosystem risk because an
      Anthropic deal could tighten access to consumer endpoints or repurpose the
      team into infrastructure work, which would change how third parties rely on
      Decart's current product surface.
    claimRefs: [CP011, CP012, CP013]
tables:
