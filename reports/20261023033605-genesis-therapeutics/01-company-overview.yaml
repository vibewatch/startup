company:
  name: Genesis Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Genesis Therapeutics, now also described as Genesis Molecular AI, is a private Stanford-originated molecular-AI company whose GEMS platform combines generative and predictive models with physics-based simulation for small-molecule discovery. The evidence supports meaningful pharma validation and substantial financing, but private-company reporting leaves valuation, recognized revenue, cash runway, program progression, and data-governance details unresolved.
sections:
  - id: identity-and-platform
    title: Identity, origin, and operating model
    body: >-
      Genesis Therapeutics was founded in 2019 out of Stanford University research associated
      with Vijay Pande, with Evan Feinberg identified as founder and CEO and Ben Sklaroff as
      co-founder and CTO. Third-party profiles place the company in the Burlingame/San
      Francisco area, while the company's 2024 announcement identifies Burlingame as
      headquarters and a fully integrated laboratory in San Diego. The company has also
      adopted the Genesis Molecular AI name and the genesis.ml domain in more recent
      descriptions. This is a private, platform-led drug-discovery business rather than a
      publicly traded therapeutics company: GEMS is used by Genesis chemists and embedded
      engineers and drug hunters working with partner teams, while the company also advances
      an internal pipeline. The product claim is specific—GEMS combines language models,
      diffusion models, predictive models, agents, and physical machine-learning simulation
      to generate, rank, and optimize molecules for difficult protein targets—but the
      available evidence is computational and preclinical, not clinical validation.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, governance, and capital formation
    body: >-
      Leadership coverage shows a technically grounded founding team supplemented by
      experienced drug-discovery, infrastructure, and governance executives. Genesis announced
      Shifeng Pan as chief scientific officer, Alla Ivanova as SVP of engineering, and Paul
      A. Friedman as board chair during 2024; the same announcement describes Vijay Pande as
      a director and Mohamed Siddeek of NVIDIA's NVentures as an observer. This adds relevant
      chemistry, large-scale engineering, and pharmaceutical governance experience, but it
      also makes key-person dependence material because the scientific and founder narrative
      remains concentrated around Feinberg and Pande. Financing evidence is directionally
      strong but not perfectly consistent across data vendors: independent reporting describes
      a $52 million Series A in 2020 and a $200 million Series B in 2023, while Tracxn
      reports $304 million across five rounds and a 2024 Series B record with masked terms.
      These figures should not be treated as a reconciled cap table or cash balance.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-evidence-boundaries
    title: Milestones, partner validation, and disclosure boundaries
    body: >-
      Genesis has accumulated external validation through collaborations rather than through
      disclosed clinical outcomes. GEN reports work with NVIDIA on computational efficiency;
      the company's own platform page describes a flywheel in which partner chemists and
      engineers shape GEMS; and reporting describes collaborations with Genentech, Eli Lilly,
      Gilead, and Incyte. The disclosed economics are substantial but contingent: Gilead is
      described at $35 million across three targets, Lilly at up to $670 million with $20
      million upfront, and an expanded Incyte arrangement at $80 million upfront plus a $40
      million equity investment and up to $232 million in milestones per program. These are
      collaboration consideration and potential milestones, not revenue, ARR, or cash
      available. A June 2026 review of AI drug discovery supplies an important adverse
      context: high investment and faster early discovery do not yet establish improved
      late-stage clinical outcomes, while reproducibility, transparency, and regulatory
      constraints remain. Genesis-specific gaps include no public valuation, recognized
      revenue, burn, runway, cap-table terms, clinical-stage asset, or detailed retention
      and segregation policy for partner data.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
