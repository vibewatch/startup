    body: "Named collaborations with Genentech, Eli Lilly, Gilead, and Incyte, plus NVIDIA technical work, show that major counterparties have been willing to commit targets, data, capital, or milestone economics to the platform."
    claimRefs: [CO011, CO012, CO013, CO014]
  - calloutType: risk
    title: Financing and partnership headlines do not resolve private-company opacity
    body: "The retained sources do not establish valuation, recognized revenue, cash balance, burn, runway, cap-table terms, or the realized status of partnered programs; contingent deal ceilings must not be treated as current revenue."
    claimRefs: [CO009, CO010, CO015, CO016]
