      - [Molecular simulation and physical ML, "Drug-design and structural-biology teams", "Integrated capability described by company and press coverage", "Models physical interactions, protein flexibility, and binding dynamics", "Reproducibility, calibration, and failure-mode documentation"]
      - [Wet-lab feedback loop, "Genesis scientists and partner R&D", "Operating model; integrated laboratory disclosed", "Experimental results feed model training, prediction, and validation", "Assay controls, turnaround time, and partner-data governance"]
      - [Pearl / structure foundation models, "Internal research and platform teams", "Public research and product-update work", "Extends structure prediction and molecular design capabilities", "Peer-reviewed or independently replicated current benchmark results"]
    claimRefs: [CE001, CE003, CE005, CE006, CE010, CE012, CE016]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Genesis solution, Measurable benefit, Limitation]
    notes: Benefits are potential workflow effects inferred from described capabilities; no common prospective denominator is publicly disclosed.
    rows:
      - ["Find molecules for hard targets", "Search and prioritize chemical space with limited structural or assay data", "GEMS generates candidate molecules and applies structure-aware prediction", "Potentially broader search and prioritization", "No public partner-level conversion denominator"]
      - ["Optimize potency and selectivity", "Iterate medicinal chemistry and experiments", "Predictive models jointly consider potency, selectivity, and ADMET", "Could reduce low-value synthesis cycles", "Public claims do not establish realized cycle-time reduction"]
      - ["Screen protein-ligand structures", "Run computational structure prediction at available compute budget", "DeCAF provides a few-step all-atom cofolding workflow", "Repository reports 5x inference speedup versus its teacher", "Benchmark result is a public research claim, not GEMS production evidence"]
      - ["Advance partnered programs", "Biopharma supplies targets, data, and development expertise", "Forward-deployed engineers and drug hunters work with partner teams", "Access to target and experimental data plus shared execution", "Economics, service levels, and rights to trained models are undisclosed"]
    claimRefs: [CE001, CE002, CE003, CE007, CE008, CE010]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    notes: Architecture is reconstructed from public descriptions and is not a complete proprietary system diagram.
    rows:
      - [Data and experimental feedback, "Provides training and validation signals", "Assay quality and partner data access", "Biased or non-reproducible data can propagate model error"]
      - [Generative models, "Propose novel chemical matter", "Language and diffusion model training", "Novelty does not guarantee synthesis, safety, or efficacy"]
      - [Predictive models, "Rank potency, selectivity, and ADMET", "Molecular representations and labeled data", "Distribution shift on new targets can reduce ranking reliability"]
      - [Physical ML and simulation, "Represent 3D interactions and dynamics", "Compute, force-field/model assumptions, structural inputs", "Approximation error and compute intensity can constrain throughput"]
      - [Wet-lab execution, "Validate and feed back experimental results", "Integrated lab and scientific staff", "Laboratory capacity and assay turnaround may bottleneck scale"]
    claimRefs: [CE003, CE005, CE006, CE007, CE015, CE018]
figures:
  - id: FE001
    title: GEMS product architecture map
    type: stack
    summary: GEMS combines data, generative and predictive AI, physical modeling, and wet-lab validation in a partner-facing discovery loop.
    data:
      layers:
        - label: Experimental and partner data
          detail: Target and experimental data provide inputs and validation signals for the discovery loop.
          items:
            - label: Partner-selected targets
              detail: Target context and experimental data enter the discovery workflow.
            - label: Genesis wet-lab results
              detail: Assay results feed model training, prediction, and validation.
        - label: Generative design
          detail: Generative models propose candidate chemical structures for difficult targets.
          items:
            - label: Language models
              detail: Generate candidate molecular structures and chemical ideas.
            - label: Diffusion models
              detail: Support structure-aware molecular generation.
        - label: Predictive and physical modeling
          detail: Predictive and physical models rank and characterize candidate molecules.
          items:
            - label: Dynamic PotentialNet
              detail: Predicts potency, selectivity, and ADMET using 3D representations.
            - label: Molecular simulation
              detail: Represents physical interactions, protein flexibility, and binding dynamics.
        - label: Wet-lab validation
          detail: Experiments test candidates and return results for model training and validation.
          items:
            - label: Assay results
              detail: Experimental results close the loop between model predictions and discovery decisions.
        - label: Discovery outputs
          detail: Prioritized molecules support partner and internal development programs.
          items:
            - label: Prioritized molecules
              detail: Candidates are ranked for synthesis and experimental testing.
            - label: Partner and internal programs
              detail: Outputs support partnered target work and Genesis therapeutic programs.
        - label: Deployment and learning
          detail: Forward-deployed teams use results to refine programs and strengthen the platform.
          items:
            - label: Partner decisions
              detail: Scientists use ranked candidates and experiments to choose next discovery steps.
    claimRefs: [CE003, CE005, CE007, CE010]
callouts:
  - calloutType: strength
    title: Integrated scientific workflow
    body: The strongest product signal is the integration of models, physical simulation, partner data, and wet-lab feedback rather than any single algorithm.
    claimRefs: [CE003, CE007]
  - calloutType: risk
    title: Discovery is not clinical proof
    body: Public evidence supports platform activity and discovery-stage programs, but does not establish clinical efficacy, regulatory approval, or enterprise-grade controls.
    claimRefs: [CE012, CE015, CE017]
  - calloutType: recommendation
    title: Request prospective validation
    body: The key diligence request is a blinded, program-level record connecting model predictions to synthesis, assay outcomes, and downstream development decisions.
    claimRefs: [CE015, CE016]
