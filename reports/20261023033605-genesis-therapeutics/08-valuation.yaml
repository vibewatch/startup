    notes: "Rows distinguish company or media descriptions from investment conclusions; comparator and platform evidence is not treated as a Genesis valuation."
    claimRefs: [CV003, CV004, CV005, CV006, CV008, CV015]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Partner programs reach clinical milestones; independent benchmarks validate GEMS; financing terms are clean", "Upside could justify a premium private mark, but no numeric target is supportable from assigned evidence", "Clinical failure, dilution, partner concentration", "Low-to-medium"]
      - [Base, "Partners continue funding; platform advances; valuation and economics remain undisclosed", "Track and wait for a disclosed price with milestone-adjusted underwriting", "Disclosure gap, slow translation, high burn", "Most supportable"]
      - [Bear, "Down-round, program attrition, or partner narrowing; weak benchmark evidence persists", "Avoid or reprice materially lower; preserve downside discipline", "Loss of anchor capital, clinical failure, financing overhang", "Material"]
      - [Trigger, "Any thesis-break event occurs", "Re-underwrite immediately rather than roll forward the prior mark", "No timely data or rights to verify", "Monitor continuously"]
    notes: "Scenario logic is qualitative because the assigned pool contains no current Genesis price, revenue, cash, burn, or probability-weighted milestone schedule."
    claimRefs: [CV013, CV014, CV015, CV016]
