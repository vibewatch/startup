      performance scores or a market ranking. The x-axis is technical differentiation
      (1 low to 5 high), and the y-axis is external distribution and validation signal
      (1 low to 5 high); neither axis implies comparable clinical efficacy or revenue.
    claimRefs: [CP002, CP003, CP004, CP007, CP012, CP013, CP014]
callouts:
  - calloutType: strength
    title: Pharma validation is a real channel asset
    body: Multiple reported collaborations with major biopharma companies give Genesis access to target biology, development expertise, and potential downstream commercialization channels that standalone software competitors may lack.
    claimRefs: [CP008, CP009, CP010, CP012]
  - calloutType: risk
    title: Model advantage is not yet a clinical moat
    body: Assigned independent evidence does not establish a controlled peer benchmark or a GEMS-designed molecule in a clinical study, while competitors and internal pharma teams continue to expand their data and platform capabilities.
    claimRefs: [CP006, CP013, CP014, CP015, CP016]
