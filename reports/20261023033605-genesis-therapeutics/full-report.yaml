      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is a stack rather than a single model. Genesis describes GEMS as combining
              language models, diffusion models, and physical machine-learning simulations; external reporting adds 3D
              structure-aware neural networks, molecular generation, molecular simulation, and Dynamic PotentialNet for
              protein-ligand interactions. The technical thesis is that chemical design requires both broad generation
              and physically informed prediction, particularly for 3D geometry, protein flexibility, water molecules,
              potency, selectivity, and ADMET. Genesis's public developer artifact, DeCAF, shows a separate all-atom
              cofolding line that emphasizes inference efficiency and reproducible execution. These materials support a
              coherent architecture, but they do not independently establish the performance of proprietary GEMS on live
              partner programs.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
