      - number: '1.3'
        title: Milestones, partner validation, and disclosure boundaries
        blocks:
          - type: paragraph
            body: >-
              Genesis has accumulated external validation through collaborations rather than through disclosed clinical
              outcomes. GEN reports work with NVIDIA on computational efficiency; the company's own platform page
              describes a flywheel in which partner chemists and engineers shape GEMS; and reporting describes
              collaborations with Genentech, Eli Lilly, Gilead, and Incyte. The disclosed economics are substantial but
              contingent: Gilead is described at $35 million across three targets, Lilly at up to $670 million with $20
              million upfront, and an expanded Incyte arrangement at $80 million upfront plus a $40 million equity
              investment and up to $232 million in milestones per program. These are collaboration consideration and
              potential milestones, not revenue, ARR, or cash available. A June 2026 review of AI drug discovery
              supplies an important adverse context: high investment and faster early discovery do not yet establish
              improved late-stage clinical outcomes, while reproducibility, transparency, and regulatory constraints
              remain. Genesis-specific gaps include no public valuation, recognized revenue, burn, runway, cap-table
              terms, clinical-stage asset, or detailed retention and segregation policy for partner data.
