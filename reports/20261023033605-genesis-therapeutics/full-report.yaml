      - number: '4.2'
        title: Sales efficiency, delivery cost, and margin path
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a high-touch, program-based sales motion: partners select targets, Genesis
              supplies its platform and scientific staff, and economics depend on upfront payments, research funding,
              milestones, royalties, and data contributions. The per-target fee in the Gilead and other structures is
              not published, so list-versus-realized pricing cannot be tested and CAC, sales cycle, payback, gross
              margin, and contribution margin cannot be calculated. Cost drivers are likely to include computational
              inference and training, wet-lab work, chemistry and biology personnel, and partner-embedded delivery, but
              the retained sources do not quantify them. The relevant diligence task is to obtain program-level
              bookings, recognized revenue, delivery cost, and cohort economics rather than infer SaaS metrics.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Genesis has substantial external financing and partner-linked capital signals: the sources report a $200
              million Series B in 2023, more than $280 million or more than $300 million raised depending on source
              vintage, and an Incyte expansion that includes a $40 million equity investment. These figures are not a
              current cash balance and cannot establish runway. No retained source discloses cash on hand, monthly burn,
              debt, covenants, cap table, or a next-round trigger. The model is also exposed to backloaded program
              economics: Fierce describes potential value above $1 billion across five Incyte targets, but that requires
              approvals and commercial milestones. A prudent verdict is track: strategic validation is strong, while
              underwriting remains blocked by private-company financial opacity and clinical translation risk.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
      - number: '4.4'
        title: Diligence blockers and scenario boundaries
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant missing inputs are recognized revenue by stream, cash and burn, program-level
              gross margin, target-level contract terms, and the treatment of equity and data contributions. An
              independent 2026 review warns that approximately 90% of drug candidates entering clinical development fail
              to achieve regulatory approval and that early discovery acceleration does not consistently translate into
              late-stage success. That sector evidence does not forecast Genesis outcomes, but it makes milestone-heavy
              economics especially sensitive to clinical progression. Scenario work should therefore separate public
              upfront consideration from estimated future milestones, exclude contingent milestone value from cash
              runway, and use explicit downside cases for delayed or terminated programs.
            claimRefs:
              - CI015
              - CI017
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner validation
            body: >-
              Gilead and Incyte have publicly disclosed upfront collaboration consideration, while Incyte also committed
              recurring research funding and a $40 million equity investment in the expanded relationship.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: callout
            title: Underwriting opacity
            body: >-
              The retained evidence does not disclose recognized revenue, cash, burn, runway, gross margin, realized
              pricing, debt, or cap-table terms; milestone headlines therefore cannot support a cash-flow valuation.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Financial stance
            body: >-
              Track rather than underwrite aggressively until Genesis provides program-level revenue recognition, cash
              runway, delivery costs, contract concentration, and clinical progression evidence.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI017
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and user workflow
        blocks:
          - type: paragraph
            body: >-
              Genesis sells neither a general-purpose software license nor a single disclosed therapeutic product; its
              public product is a partner- and internal-R&D workflow for discovering small molecules against difficult
              targets. GEMS is described as an integrated platform in which generative models propose chemical matter,
              predictive models rank potency, selectivity, and ADMET properties, and wet-lab experiments close the loop
              for training and validation. The customer-facing user is therefore a biopharma discovery team, while
              Genesis supplies forward-deployed engineers, drug hunters, chemists, biologists, and laboratory execution.
              This model can create high switching costs when partner data and experimental feedback improve the
              platform, but it also makes delivery dependent on scientific labor, assay quality, and partner target
              selection.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
