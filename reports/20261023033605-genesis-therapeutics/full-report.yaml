chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and operating model
        blocks:
          - type: paragraph
            body: >-
              Genesis Therapeutics was founded in 2019 out of Stanford University research associated with Vijay Pande,
              with Evan Feinberg identified as founder and CEO and Ben Sklaroff as co-founder and CTO. Third-party
              profiles place the company in the Burlingame/San Francisco area, while the company's 2024 announcement
              identifies Burlingame as headquarters and a fully integrated laboratory in San Diego. The company has also
              adopted the Genesis Molecular AI name and the genesis.ml domain in more recent descriptions. This is a
              private, platform-led drug-discovery business rather than a publicly traded therapeutics company: GEMS is
              used by Genesis chemists and embedded engineers and drug hunters working with partner teams, while the
              company also advances an internal pipeline. The product claim is specific—GEMS combines language models,
              diffusion models, predictive models, agents, and physical machine-learning simulation to generate, rank,
              and optimize molecules for difficult protein targets—but the available evidence is computational and
              preclinical, not clinical validation.
