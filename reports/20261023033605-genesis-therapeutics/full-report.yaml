  - id: FE001
    title: GEMS product architecture map
    type: stack
    summary: >-
      GEMS combines data, generative and predictive AI, physical modeling, and wet-lab validation in a partner-facing
      discovery loop.
    data:
      layers:
        - label: Experimental and partner data
          detail: Target and experimental data provide inputs and validation signals for the discovery loop.
          items:
            - label: Partner-selected targets
              detail: Target context and experimental data enter the discovery workflow.
            - label: Genesis wet-lab results
              detail: Assay results feed model training, prediction, and validation.
        - label: Generative design
          detail: Generative models propose candidate chemical structures for difficult targets.
          items:
            - label: Language models
              detail: Generate candidate molecular structures and chemical ideas.
            - label: Diffusion models
              detail: Support structure-aware molecular generation.
        - label: Predictive and physical modeling
          detail: Predictive and physical models rank and characterize candidate molecules.
          items:
            - label: Dynamic PotentialNet
              detail: Predicts potency, selectivity, and ADMET using 3D representations.
            - label: Molecular simulation
              detail: Represents physical interactions, protein flexibility, and binding dynamics.
        - label: Wet-lab validation
          detail: Experiments test candidates and return results for model training and validation.
          items:
            - label: Assay results
              detail: Experimental results close the loop between model predictions and discovery decisions.
        - label: Discovery outputs
          detail: Prioritized molecules support partner and internal development programs.
          items:
            - label: Prioritized molecules
              detail: Candidates are ranked for synthesis and experimental testing.
            - label: Partner and internal programs
              detail: Outputs support partnered target work and Genesis therapeutic programs.
        - label: Deployment and learning
          detail: Forward-deployed teams use results to refine programs and strengthen the platform.
          items:
            - label: Partner decisions
              detail: Scientists use ranked candidates and experiments to choose next discovery steps.
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE010
  - id: FU001
    title: Partner journey from target selection to expansion
    type: journey-map
    summary: >-
      The public commercial path is a staffed discovery collaboration with option and milestone expansion, not a
      conventional software conversion funnel.
    data:
      items:
        - stage: 1
          label: Target nomination
          title: Target nomination
          description: A pharmaceutical partner selects or supplies a discovery target.
          touchpoints:
            - Initial target scope
            - Portfolio-priority review
        - stage: 2
          label: Rights and program scope
          title: Rights and program scope
          description: The parties define discovery scope and potential downstream rights.
          touchpoints:
            - Target count
            - Development and commercialization rights
        - stage: 3
          label: Team and data onboarding
          title: Team and data onboarding
          description: Genesis and partner scientists begin a staffed collaboration and may exchange program data.
          touchpoints:
            - Embedded scientific work
            - Program-specific experimental data
        - stage: 4
          label: GEMS design cycle
          title: GEMS design cycle
          description: Genesis applies generative and predictive workflows to candidate design.
          touchpoints:
            - Molecule generation
            - Property prediction
        - stage: 5
          label: Synthesis and testing
          title: Synthesis and testing
          description: Selected compounds enter experimental synthesis and biological testing.
          touchpoints:
            - Wet-lab feedback
            - Candidate refinement
        - stage: 6
          label: Milestone decision
          title: Milestone decision
          description: Program progression can trigger preclinical, development, or regulatory economics.
          touchpoints:
            - Go or no-go decision
            - Potential milestone payment
        - stage: 7
          label: Account expansion
          title: Account expansion
          description: Additional targets or successful products can add fees and royalties.
          touchpoints:
            - Target option
            - Tiered royalty
    approximationNotes: >-
      This is a relationship sequence synthesized from disclosed deal mechanics; it does not assert conversion rates,
      elapsed time, or that every named collaboration completed every stage.
    claimRefs:
      - CU002
      - CU007
      - CU010
      - CU011
      - CU014
