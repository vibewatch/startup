        title: Leadership, governance, and capital formation
        blocks:
          - type: paragraph
            body: >-
              Leadership coverage shows a technically grounded founding team supplemented by experienced drug-discovery,
              infrastructure, and governance executives. Genesis announced Shifeng Pan as chief scientific officer, Alla
              Ivanova as SVP of engineering, and Paul A. Friedman as board chair during 2024; the same announcement
              describes Vijay Pande as a director and Mohamed Siddeek of NVIDIA's NVentures as an observer. This adds
