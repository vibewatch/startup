        - Re-underwrite immediately rather than roll forward the prior mark
        - No timely data or rights to verify
        - Monitor continuously
    notes: >-
      Scenario logic is qualitative because the assigned pool contains no current Genesis price, revenue, cash, burn, or
      probability-weighted milestone schedule.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
