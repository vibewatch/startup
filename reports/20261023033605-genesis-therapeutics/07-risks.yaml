callouts:
  - calloutType: risk
    title: The largest gap is control evidence, not a disclosed incident
    body: "No retained source documents a breach, outage, enforcement action, or failed Genesis program. The risk is that public disclosures do not let an investor test data segregation, model stop thresholds, version discipline, patent inventorship, or runway."
    claimRefs: [CR003, CR010, CR013]
  - calloutType: recommendation
    title: Underwrite only against measurable program and control milestones
    body: "Before increasing exposure, request partner-level progression, model-validation and version records, data-use terms, patent files, and cash/burn/runway. Treat contingent milestone value and total funding as distinct from recognized revenue or available cash."
    claimRefs: [CR012, CR014, CR015, CR016]

