    notes: "Likelihood and severity are qualitative analyst judgments based on the retained public evidence; unknown means public evidence cannot support a probability estimate, not that the risk is absent."
    claimRefs: [CR001, CR002, CR004, CR010]
  - id: TR002
    title: "Regulatory / legal risk register"
    columns: [Rule or issue, Jurisdiction, Public status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["AI-assisted drug-development evidence", "United States", "FDA risk-based framework and 2025 draft guidance referenced", "Medium", "High", "Trace inputs, validation, and human review", "Medium-high", "Request partner regulatory-use SOPs and audit trails"]
      - ["AI governance and documentation", "United States / global", "NIST AI RMF voluntary; revision noted", "Medium", "Medium-high", "Map GEMS controls to Govern, Map, Measure, Manage", "Medium", "Obtain control mapping and testing evidence"]
      - ["High-risk AI obligations if scope applies", "European Union", "AI Act obligations include logging, documentation, oversight, robustness, cybersecurity, and accuracy", "Unknown", "High", "Determine provider/deployer role and classification", "Medium-high", "Get EU applicability opinion for product and partner workflows"]
      - ["AI-generated drug inventorship and enablement", "United States", "Legal standard remains unsettled", "Medium", "High", "Record human hypotheses, constraints, selection, and synthesis rationale", "Medium-high", "Review patent files and invention records with counsel"]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and legal sources reviewed through the 2026-10-23 report date; this is not a complete jurisdiction-by-jurisdiction register."
    notes: "The register covers public rules and legal analysis relevant to an AI drug-discovery platform, not a finding that Genesis has violated any rule."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner, dependency, and operating risk register
    columns: [Dependency, Counterparty or owner, Role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Experimental training data", "Incyte and other partners", "Data supplier and collaboration counterparty", "Restricted, non-segregated, or unavailable data limits model improvement", "High", "Contractual data rights, isolation, provenance, exit plan", "High"]
      - ["Pharmaceutical milestone programs", "Incyte, Gilead, Lilly, Genentech", "Target selection, validation, and commercialization path", "Programs stall or milestone payments do not arrive", "High", "Stage-gated portfolio and replacement partner pipeline", "Medium-high"]
      - ["Model and compute stack", "Genesis / NVIDIA ecosystem", "Training and inference infrastructure", "Compute cost, model drift, or infrastructure dependency slows iteration", "Medium-high", "Versioning, cost monitoring, reproducible environments", "Medium"]
      - ["Specialized scientific workforce", "Genesis", "Chemistry, biology, ML, and translational execution", "Hiring or retention shortfall delays design-make-test cycles", "Medium", "Documented workflows and staffing plan", "Unknown"]
    notes: "Rows identify dependencies visible in the retained sources; public evidence does not disclose counterparty concentration, contract duration, or failure contingencies for every relationship."
    claimRefs: [CR009, CR010, CR011, CR012]

