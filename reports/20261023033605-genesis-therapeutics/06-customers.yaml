artifact: customers
slug: genesis-therapeutics
runDate: 2026-10-23
company:
  name: Genesis Therapeutics
chapter:
  number: 6
  title: Customers
  summary: Genesis has meaningful enterprise adoption evidence in four named pharmaceutical collaborations, including multi-target scopes and disclosed upfront economics. Public evidence still does not establish active utilization, renewal, retention, realized milestones, or customer-level outcomes, while current-partner disclosure appears concentrated.
sections:
  - id: buyer-user-payer
    title: Buyer, user, and payer structure
    body: >-
      Genesis is sold through negotiated drug-discovery collaborations rather than as a
      self-serve software product. The economic buyer and payer is a pharmaceutical R&D
      organization funding work on selected targets; the practical users are Genesis and
      partner medicinal chemists, computational scientists, biologists, and program teams.
      Incyte selected initial targets and obtained exclusive potential clinical-development
      and commercialization rights, while Gilead obtained downstream rights to compounds
      arising from its discovery effort. Public reporting therefore supports a services-
      intensive platform model in which Genesis performs discovery work and counterparties
      retain much of the downstream development role. NVIDIA is better classified as an
      investor and technology collaborator than as customer adoption.
    claimRefs: [CU001, CU002, CU011, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-adoption
    title: Named adoption and commercial trajectory
    body: >-
      The named-partner sequence is substantial: Genentech in 2020, Eli Lilly in 2022,
      Gilead in 2024, and Incyte in 2025, followed by a reported Incyte expansion in 2026.
      The arrangements span multiple targets and use upfront payments, target options,
      milestones, royalties, and downstream rights. These are stronger adoption signals
      than logos because they identify counterparties and contractual scope. They are not,
      however, comparable recurring-revenue observations: a headline milestone ceiling is
      not recognized revenue, a target option is not an exercised program, and a
      collaboration announcement does not prove continuous platform use. The public record
      supports strategic validation but not a customer-count or utilization time series.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU010]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Expansion is embedded in the commercial design. Gilead can nominate additional
      targets for a predetermined fee, Incyte received an additional-target option, and
      successful programs may produce development milestones and royalties. A 2026
      third-party profile also reports that Incyte's expansion included experimental data
      for platform training, potentially deepening technical switching costs. Durability is
      much less observable. No assigned source reports renewal rates, NRR, GRR, churn,
      contract duration, active seats, program utilization, or account-level revenue.
      Sacra characterizes the current publicly identified partner base as Gilead and Incyte,
      making partner concentration a material diligence issue rather than a quantified fact
      about revenue concentration.
    claimRefs: [CU007, CU010, CU012, CU013]
  - id: evidence-quality
    title: Outcome evidence and diligence priorities
    body: >-
      Public customer proof remains strongest at the contracting stage and weakest at the
      outcome stage. AI Health Index reports no Genesis-designed molecule in a clinical
      study and distinguishes computational benchmarking from program outcomes; RFP.wiki
      separately flags missing cycle-time, hit-rate, integration, and independent review
      evidence. Lilly's own science page illustrates the buyer's urgency around development
      speed, but its corporate reduction from first human dose to launch cannot be
      attributed to Genesis. Before underwriting durable adoption, diligence should obtain
      target-level status, realized milestone receipts, option exercises, renewal history,
      revenue by counterparty, active-workflow evidence, and customer references that
      connect GEMS use to candidate quality or cycle-time improvement.
    claimRefs: [CU008, CU009, CU014, CU016]
