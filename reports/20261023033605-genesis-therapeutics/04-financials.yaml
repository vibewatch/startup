company:
  name: Genesis Therapeutics
chapter:
  number: 4
  title: Financials
  summary: Genesis has disclosed a partnership-led monetization model with meaningful upfront consideration, milestone upside, royalties, and one equity investment, but it has not disclosed recognized revenue, cash, burn, runway, realized pricing, or margins. The underwriting case is therefore based on disclosed contract mechanics and capital signals rather than a demonstrated income statement.
sections:
  - id: monetization-model
    title: Monetization model and revenue quality
    body: >-
      Genesis monetizes GEMS through research collaborations rather than a published software license or list-price product. Gilead disclosed a $35 million upfront payment across three targets, plus milestone payments and tiered royalties; Incyte reporting describes $30 million upfront for the 2025 collaboration and a later expansion with $80 million upfront, including a $40 million equity investment. GEN also reports an Eli Lilly agreement of up to $670 million with $20 million upfront. These are contract consideration and contingent rights, not recognized revenue, ARR, or cash available. The engagement is staffed: Genesis engineers and drug hunters work inside partner teams. No realized revenue, revenue-recognition policy, contract duration, or customer concentration is public.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: sales-efficiency-and-costs
    title: Sales efficiency, delivery cost, and margin path
    body: >-
      Public evidence supports a high-touch, program-based sales motion: partners select targets, Genesis supplies its platform and scientific staff, and economics depend on upfront payments, research funding, milestones, royalties, and data contributions. The per-target fee in the Gilead and other structures is not published, so list-versus-realized pricing cannot be tested and CAC, sales cycle, payback, gross margin, and contribution margin cannot be calculated. Cost drivers are likely to include computational inference and training, wet-lab work, chemistry and biology personnel, and partner-embedded delivery, but the retained sources do not quantify them. The relevant diligence task is to obtain program-level bookings, recognized revenue, delivery cost, and cohort economics rather than infer SaaS metrics.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Genesis has substantial external financing and partner-linked capital signals: the sources report a $200 million Series B in 2023, more than $280 million or more than $300 million raised depending on source vintage, and an Incyte expansion that includes a $40 million equity investment. These figures are not a current cash balance and cannot establish runway. No retained source discloses cash on hand, monthly burn, debt, covenants, cap table, or a next-round trigger. The model is also exposed to backloaded program economics: Fierce describes potential value above $1 billion across five Incyte targets, but that requires approvals and commercial milestones. A prudent verdict is track: strategic validation is strong, while underwriting remains blocked by private-company financial opacity and clinical translation risk.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
  - id: diligence-blockers
    title: Diligence blockers and scenario boundaries
    body: The most decision-relevant missing inputs are recognized revenue by stream, cash and burn, program-level gross margin, target-level contract terms, and the treatment of equity and data contributions. An independent 2026 review warns that approximately 90% of drug candidates entering clinical development fail to achieve regulatory approval and that early discovery acceleration does not consistently translate into late-stage success. That sector evidence does not forecast Genesis outcomes, but it makes milestone-heavy economics especially sensitive to clinical progression. Scenario work should therefore separate public upfront consideration from estimated future milestones, exclude contingent milestone value from cash runway, and use explicit downside cases for delayed or terminated programs.
    claimRefs: [CI015, CI017]
    tableRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [stream, mechanism, current value/status, quality, diligence ask]
    rows:
      - [Partner upfront consideration, "Target-based collaboration payments", "$35M across three Gilead targets; $30M Incyte initial upfront; $80M Incyte expansion upfront", "Disclosed contract terms; not equivalent to recognized revenue", "Reconcile cash receipts, revenue recognition, deferred revenue, and contract duration by program"]
      - [Milestone consideration, "Preclinical, development, regulatory, and commercial milestones", "Up to $295M per target for two initial Incyte programs; later reporting says up to $232M per program for five new targets", "Contingent and backloaded", "Provide milestone probability, accounting treatment, and program-by-program status"]
      - [Royalties, "Tiered royalties on net sales if products commercialize", "Rate not disclosed in retained sources", "Future contingent revenue", "Provide royalty rates, territories, term, and commercialization assumptions"]
      - [Research funding, "Recurring partner funding for model training and inference workloads", "Reported for the Incyte expansion; amount not disclosed", "Potential recurring consideration; not a published run rate", "Separate research reimbursement from product revenue and identify cost pass-throughs"]
    notes: "Values are disclosed deal terms from different dates and sources; milestone values are contingent and should not be added to revenue or cash without accounting support."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization
    columns: [pricing element, disclosed basis, list vs realized, implication, diligence ask]
    rows:
      - [Initial target package, "$35M across three Gilead targets", "Negotiated upfront; no public list price", "Implied program economics are partner-specific", "Obtain comparable target packages and realized net consideration"]
      - [Additional target option, "Predetermined per-target fee; amount undisclosed", "Unknown", "Cannot size expansion revenue or buyer payback", "Provide fee schedule, discounts, and option exercise terms"]
      - [Lilly collaboration, "Up to $670M total; $20M upfront", "Headline potential, not realized revenue", "Shows milestone leverage but not current sales efficiency", "Provide earned-to-date consideration and remaining obligations"]
      - [Incyte expansion, "$80M upfront including $40M equity investment", "Mixed cash/equity consideration", "Equity is financing-like and must not be treated as operating revenue", "Provide allocation between cash, equity, services, and accounting treatment"]
    notes: "No public price sheet exists. The table preserves partner-specific contract disclosures and does not infer a standard price or revenue-recognition outcome."
    claimRefs: [CI001, CI002, CI003, CI006]
  - id: TI003
    title: Unit-economics evidence and underwriting gaps
    columns: [metric, value, confidence, why it matters, diligence ask]
    rows:
      - [Recognized revenue, null, low, "Determines scale and revenue quality", "Audited or management revenue by collaboration and period"]
      - [Gross margin, null, low, "Tests whether compute and wet-lab delivery can scale", "Program-level cost of delivery and allocation policy"]
      - [CAC and sales payback, null, low, "High-touch partnerships may have long cycles and concentrated economics", "Pipeline, sales cycle, acquisition cost, and conversion by cohort"]
      - [Cash balance and runway, null, low, "Determines financing dependency and next-round timing", "Latest balance sheet, monthly burn, debt, covenants, and runway case"]
    notes: "Null means the metric was not disclosed in the retained public evidence; no zero or proxy has been substituted."
    claimRefs: [CI007, CI008, CI009, CI010]
