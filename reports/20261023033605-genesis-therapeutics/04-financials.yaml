callouts:
  - calloutType: strength
    title: Partner validation
    body: Gilead and Incyte have publicly disclosed upfront collaboration consideration, while Incyte also committed recurring research funding and a $40 million equity investment in the expanded relationship.
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Underwriting opacity
    body: The retained evidence does not disclose recognized revenue, cash, burn, runway, gross margin, realized pricing, debt, or cap-table terms; milestone headlines therefore cannot support a cash-flow valuation.
    claimRefs: [CI007, CI008, CI009, CI010]
  - calloutType: recommendation
    title: Financial stance
    body: Track rather than underwrite aggressively until Genesis provides program-level revenue recognition, cash runway, delivery costs, contract concentration, and clinical progression evidence.
    claimRefs: [CI012, CI013, CI014, CI017]
