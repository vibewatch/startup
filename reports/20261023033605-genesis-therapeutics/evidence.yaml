evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: disclosure
    missingEvidence: >-
      Audited or management-provided financial statements covering recognized revenue, cash, burn, runway, and the
      latest valuation.
    whyItMatters: Funding announcements and contingent partnership ceilings cannot establish current liquidity or enterprise value.
    diligencePath: >-
      Request the latest monthly financial package, cap table, financing documents, and board-approved operating plan
      under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated company-confirmed employee and contractor count with location and functional breakdown.
    whyItMatters: The retained sources report materially different headcounts and may use different dates or definitions.
    diligencePath: Reconcile payroll, contractor, and laboratory headcount as of the diligence date.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: partnerships
    missingEvidence: >-
      Current program-level status, target count, milestone realization, and recognized accounting treatment for each
      collaboration.
    whyItMatters: >-
      Headline upfront and milestone values are contingent and do not prove revenue, clinical progress, or durable
      customer concentration.
    diligencePath: Obtain redacted collaboration schedules, program dashboards, and partner references.
    relatedQuestionRefs:
      - QO003
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: material
    topic: data-governance
    missingEvidence: Security, privacy, data segregation, retention, and model-update controls for partner experimental data.
    whyItMatters: The operating model embeds Genesis personnel in partner programs and may use partner data for model training.
    diligencePath: >-
      Request security documentation, data-processing terms, model-governance policy, and termination/deletion
      procedures.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: stale
    severity: minor
    topic: valuation
    missingEvidence: A current valuation or financing reference date after the latest reported investment activity.
    whyItMatters: Older funding records are not a current valuation and private-company pricing may have changed.
    diligencePath: Request the latest priced-round or secondary transaction reference and capitalization schedule.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A comparable, independently sourced market-size series for AI drug-discovery platform spend with geography,
      segment, and methodology.
    whyItMatters: Without a category denominator, partnership values cannot be translated into SAM, SOM, or market share.
    diligencePath: >-
      Request current analyst market data and reconcile its category definition with Genesis's target-specific
      collaboration model.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: productivity
    missingEvidence: >-
      Customer-level evidence on enrichment, cycle time, hit quality, retention, and budget expansion after a Genesis
      deployment.
    whyItMatters: >-
      Adoption and valuation depend on repeatable program outcomes rather than platform descriptions or potential
      milestones.
    diligencePath: >-
      Obtain references and a redacted before-and-after program scorecard covering internal baseline, assay context, and
      time period.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: minor
    topic: buyer-segments
    missingEvidence: Publicly documented pricing, implementation effort, integration coverage, and contractual data/IP boundaries.
    whyItMatters: These factors determine switching costs, procurement timing, and whether a pilot can expand across a portfolio.
    diligencePath: >-
      Request a standard RFP response covering deployment architecture, model governance, IP ownership, data retention,
      and all variable fees.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Executed contract terms, renewal rates, realized revenue, and customer concentration by partner.
    whyItMatters: Negotiated maximum deal values cannot establish recurring economics, pricing power, or switching costs.
    diligencePath: >-
      Request anonymized contract schedules, renewal history, revenue concentration, and termination provisions from
      management.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: validation
    missingEvidence: Independent, target-matched benchmark results and clinical progression for GEMS-designed molecules.
    whyItMatters: Computational benchmarks and partner announcements do not prove superior clinical or commercial outcomes.
    diligencePath: >-
      Request blinded prospective benchmark results, program-level hit-rate data, and a pipeline milestone schedule with
      partner verification.
    relatedQuestionRefs:
      - QP007
      - QP009
  - type: missing-source
    severity: minor
    topic: alternatives
    missingEvidence: Comparable capability, pricing, and data-governance disclosures for each named competitor.
    whyItMatters: Public competitor profiles are heterogeneous and may understate or overstate capability differences.
    diligencePath: Obtain vendor demos, reference calls, security materials, and procurement proposals for a like-for-like shortlist.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP008
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt, covenants, and the next financing trigger.
    whyItMatters: Milestone-heavy contracts and wet-lab delivery can require substantial funding before commercial royalties arrive.
    diligencePath: >-
      Request the latest management accounts, cash reconciliation, debt schedule, 24-month operating plan, and downside
      runway case.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Recognized revenue, deferred revenue, gross margin, delivery cost, CAC, sales cycle, and payback by collaboration.
    whyItMatters: Upfront payments and contingent headline values do not establish recurring or profitable revenue.
    diligencePath: Obtain audited or board-level financials and program-level bookings-to-cash bridge with cost allocation.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
      - QI010
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Per-target fees, discounts, contract duration, exclusivity, and the value assigned to partner data contributions.
    whyItMatters: Without realized pricing, expansion economics and customer concentration cannot be underwritten.
    diligencePath: Review executed collaboration agreements, option schedules, amendments, and revenue-recognition memos.
    relatedQuestionRefs:
      - QI003
  - type: stale
    severity: material
    topic: clinical-translation
    missingEvidence: Program-level progression from discovery and lead optimization into clinical development.
    whyItMatters: >-
      Independent evidence indicates that computational acceleration does not reliably translate into late-stage
      success.
    diligencePath: >-
      Request a current asset-by-asset pipeline, development milestones, discontinuations, and clinical-trial
      identifiers.
    relatedQuestionRefs:
      - QI008
      - QI009
  - type: missing-source
    severity: material
    topic: validation
    missingEvidence: A blinded prospective validation set linking predictions to synthesis and assay outcomes.
    whyItMatters: Without a denominator, platform claims cannot be converted into verified scientific or economic performance.
    diligencePath: >-
      Request program-level validation reports with prediction timestamps, controls, synthesis outcomes, and downstream
      decisions.
    relatedQuestionRefs:
      - QE005
      - QE010
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: Current security, privacy, access-control, and partner-data governance documentation.
    whyItMatters: Partner discovery data is commercially sensitive and may be central to the platform's learning advantage.
    diligencePath: Review security architecture, control attestations, data-use clauses, retention policy, and incident history.
    relatedQuestionRefs:
      - QE006
      - QE010
  - type: enumeration-incomplete
    severity: minor
    topic: pipeline
    missingEvidence: Complete current module, program, integration, and deployment inventory.
    whyItMatters: Public pages disclose selected examples but not the full product or program perimeter.
    diligencePath: Obtain a management-provided product and pipeline register with status dates and ownership.
    relatedQuestionRefs:
      - QE002
      - QE007
    relatedTableRefs:
      - TE001
  - type: stale
    severity: minor
    topic: performance
    missingEvidence: Current benchmark and reliability results for proprietary GEMS components.
    whyItMatters: Older technical reporting and current product updates may not measure the same system.
