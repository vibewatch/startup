callouts:
  - calloutType: "insight"
    title: "Dual Hardware and IP Licensing Model Mitigates Pure-Play Fabless Risk"
    body: "Unlike pure-play chip rivals like Groq and Cerebras that depend exclusively on system or cloud token sales, Tenstorrent's dual monetization model licenses Tensix AI cores and Ascalon RISC-V CPU IP to industrial giants including LG and Hyundai. This creates recurring licensing revenue while datacenter Galaxy traction matures."
    claimRefs:
      - "CP001"
      - "CP014"
  - calloutType: "risk"
    title: "Software Toolchain Maturity Lags Commercial Production Demands"
    body: "Despite architectural advantages in memory bandwidth and token economics, independent evaluations have highlighted severe software ecosystem deficits. Without production-grade serving infrastructure and frictionless CUDA translation, enterprise buyers default to established GPU platforms."
    claimRefs:
      - "CP005"
      - "CP009"
      - "CP012"
