callouts:
  - calloutType: "insight"
    title: "Decoupled Data Movement and Compute within the Tensix Tile"
    body: "Tenstorrent's microarchitectural efficiency stems from assigning dedicated baby RISC-V cores to asynchronous data movement separate from the SIMD compute engine within every Tensix core. By isolating DRAM and SRAM transfers from math execution, the hardware effectively hides memory latency behind continuous matrix computation."
    claimRefs:
      - "CE003"
      - "CE004"
  - calloutType: "risk"
    title: "Compilation and First-Run Cold Latency Headwinds"
    body: "Independent benchmarking indicates that matrix tiling and JIT compilation consume up to 97% of total execution time during first-run operations. For dynamic, short-lived, or frequently changing model architectures, compilation overhead represents a meaningful barrier to out-of-the-box developer adoption compared to mature GPU toolchains."
    claimRefs:
      - "CE012"
      - "CE013"
  - calloutType: "risk"
    title: "Export Licensing and High-Level Engineering Talent Constraints"
    body: "Because Tenstorrent develops advanced AI accelerators and high-performance RISC-V CPUs across Santa Clara and Austin facilities, critical design positions fall under U.S. Export Administration Regulations (EAR), restricting foreign nationals from D:1, E1, and E2 country groups and complicating cross-border R&D scaling."
    claimRefs:
      - "CE015"
      - "CE016"
