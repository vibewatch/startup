chapter:
  number: 5
  title: "Product & Technology"
  summary: "Tenstorrent delivers high-performance RISC-V CPUs, Tensix AI accelerator cores, and modular chiplets backed by an open-source compiler and runtime stack. Its dual-track architecture combines general-purpose Ascalon RISC-V compute with packet-switched Tensix tensor grids, offering competitive FLOPs-per-watt efficiency alongside critical software maturity and export compliance dependencies."
sections:
  - id: "architecture-and-operating-model"
    title: "Dual-Track Compute Architecture and Heterogeneous Interconnect"
    body: "Tenstorrent's computing architecture diverges from conventional monolithic GPU accelerators by decoupling general-purpose control and execution from dense tensor acceleration across modular silicon building blocks. At the foundation of its silicon design are two proprietary core architectures: high-performance Ascalon RISC-V CPU cores designed from scratch for host operating system execution, workload orchestration, and scalar logic, paired with proprietary Tensix AI cores optimized for deep learning operations. In the Grayskull accelerator generation, an array of 96 to 120 Tensix cores is interconnected via a custom double 2D torus Network-on-Chip (NoC), providing packetized multi-cast data movement with minimal host software scheduling overhead. Each individual Tensix core incorporates five single-issue 'baby' RISC-V cores alongside a SIMD matrix and vector computational unit and 1 MB of dedicated local SRAM L1 memory. Within each core, two RISC-V cores are dedicated to asynchronous data movement—managing transfers between local SRAM, neighboring core SRAMs, and external LPDDR4 memory banks—while three compute RISC-V cores execute unpacking, math kernel execution, and packing. Communication between execution stages relies on circular buffers within SRAM, maximizing the spatial overlap between computation and communication while executing tensor operations as dataflow graphs."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "product-matrix-and-workflows"
    title: "Silicon Modules, Chiplet Systems, and Developer Workflow Surfaces"
    body: "Tenstorrent packages its compute intellectual property into multiple commercial form factors ranging from PCIe accelerator cards to modular System-in-Package (SiP) chiplet assemblies and multi-node compute systems. The hardware lineup spans the first-generation Grayskull processor family (such as the Grayskull e75 and e150 bus-powered PCIe cards delivering up to 368 TOPS with conditional execution) through the higher-density Wormhole and Galaxy multi-chip systems. In parallel, Tenstorrent licenses foundational IP blocks—including Ascalon RISC-V CPU cores and Tensix AI processing clusters—to third-party silicon designers building sovereign or domain-specific chips under the Open Chiplet Architecture (OCA) standard. For software practitioners, Tenstorrent exposes an end-to-end development workflow through its documentation and open-source GitHub repositories. Developers interact with hardware via TT-Metalium (the low-level kernel programming model exposing direct control of Tensix cores, L1 circular buffers, and NoC routing), the TT-NN operator library providing PyTorch-style functional APIs, and the TT-Forge MLIR-based compiler supporting frontends including PyTorch, JAX, and ONNX. The platform supports cloud experimentation via browser-accessible consoles and integrates with inference serving runtimes like vLLM and tt-inference-server."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "differentiation-and-technical-risks"
    title: "Energy Efficiency Advantages, Software Bring-Up, and Export Control Exposure"
    body: "Independent academic characterization of the Grayskull e75 accelerator on dense matrix multiplication (MatMul) kernels demonstrates that while incumbent NVIDIA datacenter GPUs maintain a substantial lead in absolute raw floating-point throughput, Tenstorrent's spatial Tensix architecture achieves a highly competitive efficiency profile, peaking at 1.55 TFLOPs/Watt under BF16 reduced numerical precision. However, this architectural efficiency is accompanied by acute technical friction points. First-run kernel execution is heavily penalized by runtime matrix tiling and JIT compilation overhead, which account for 31% and 66% of initial execution time respectively, shifting to host-to-device data transfer dominance (62%) only on warm subsequent runs. Furthermore, Tenstorrent's transition to multi-die System-in-Package products introduces severe physical design and packaging complexity, requiring cross-die bump planning, PAM-3 signaling interfaces for high-speed GDDR7 memory, and configurable NoC routing across AI, CPU, memory, and I/O chiplet domains. Crucially, because Tenstorrent develops advanced high-performance computing silicon across North American sites, engineering hiring records indicate that key physical design and software architecture positions require strict compliance with U.S. Export Administration Regulations (EAR), restricting foreign national staffing from EAR Country Groups D:1, E1, and E2 without federal export licensing."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
