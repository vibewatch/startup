    title: "Recommendation Stance: Research-More at Stretched Valuation"
    body: "While Tenstorrent possesses world-class chip architecture leadership under Jim Keller and strategic backing from major conglomerates, the lack of audited financial disclosures and significant valuation inflation in secondary datasets ($2.0B to $5.76B) dictates a research-more stance."
    claimRefs:
