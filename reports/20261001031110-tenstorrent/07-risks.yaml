schemaVersion: "report-v2"
artifact: risks
slug: tenstorrent
runDate: 2026-10-01
company:
  name: Tenstorrent
chapter:
  number: 7
  title: Risks
  summary: >-
    Tenstorrent's most decision-relevant exposures are export-control constraints,
    software and hardware release complexity, and the unquantified durability of a
    capital-intensive operating model. Public evidence shows active mitigation work,
    but it does not establish incident history, supply concentration, current cash
    availability, burn, revenue, margins, or customer concentration.
sections:
  - id: priority-risk-portfolio
    title: Priority risk portfolio
    body: >-
      The highest-priority risk is execution across a wide hardware-software surface
      under export-control constraints. Tenstorrent's own recruiting language says
      access to U.S. export-controlled technology can depend on citizenship,
      residency, or prior license approval, creating a documented mechanism for
      staffing delay or offer rescission rather than a merely theoretical regulatory
      concern. The company-controlled software surfaces also show a broad repository
      estate and frequent fixes involving dependency drift, stuck-job detection,
      timeouts, race conditions, and numerical correctness. These are positive signs
      of active remediation, but they also indicate continuing integration and
      release-management burden. Likelihood is not quantified by the assigned
      evidence, so the matrix deliberately separates potentially high impact from
      unknown probability and treats mitigation maturity as partial where only
      hiring, release notes, or public tooling are visible.
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR007
      - CR008
    figureRefs:
      - FR001
  - id: regulatory-and-governance-exposure
    title: Regulatory, legal, and governance exposure
    body: >-
      Export control is the clearest evidenced regulatory constraint: a current
      company job description explicitly makes employment contingent on eligibility
      to access controlled technology and describes possible licensing by the U.S.
      Commerce Department or another federal agency. An official privacy notice is
      publicly identifiable, but the fetched page does not establish the scope of
      controls, certifications, breach history, or data-processing obligations.
      Likewise, the successful adverse query allocated no litigation, enforcement,
      outage, breach, or complaint source to this chapter. That result is an evidence
      gap, not proof that no event exists. Investment committee clearance should
      therefore require management schedules covering export classifications and
      licenses, material disputes, IP freedom-to-operate, privacy controls, and
      security incidents rather than treating the public record as complete.
    claimRefs:
      - CR001
      - CR014
      - CR015
    tableRefs:
      - TR001
  - id: operational-and-software-execution
    title: Operational and software execution
    body: >-
      The operating model combines proprietary hardware and software with Linux and
      other open-source packages, which increases version, packaging, compatibility,
      and support obligations. Tenstorrent was recruiting a specialist to build and
      release this stack for RISC-V and system-IP customers, while its public release
      feed describes golden-manifest pinning to catch package drift and progress-based
      detection for stuck training jobs. The same feed reports numerous correctness
      fixes across kernels, simulators, device I/O, firmware, and deployment tools.
      These disclosures demonstrate observability and remediation activity, but the
      assigned evidence supplies no fleet-level failure rate, service-level history,
      recall record, defect escape rate, or independent production reliability
      benchmark. A diligence gate should therefore test representative customer
      workloads against pinned releases and require defect, RMA, outage, and rollback
      histories before underwriting production-grade reliability.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
    tableRefs:
      - TR002
  - id: dependencies-finance-and-kill-criteria
    title: Dependencies, financial model, and kill criteria
    body: >-
      Partner and financial exposure remain more weakly quantified than the technical
      risk. A 2023 leadership report framed the COO mandate around scaling the global
      partner ecosystem, revenue, and operations, showing that commercialization and
      coordination were explicit execution tasks. StartEngine later described a
      $693 million Series D at a $2.6 billion valuation and nearly $150 million in IP
      licensing contracts, but also stated that its company information was not
      independently verified. Tenstorrent's older announcement documents more than
      $200 million raised at a $1 billion valuation; neither funding figure is cash
      available, and the retained sources do not disclose current burn, runway,
      revenue, margins, working capital, or concentration. Thesis-break triggers are
      therefore measurable diligence failures: inability to produce current audited
      financials, material export-license blockage, repeated release rollback or
      correctness incidents, or a customer/supplier concentration schedule showing
      an unmitigated single point of failure.
    claimRefs:
      - CR002
      - CR003
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR016
    tableRefs:
      - TR003
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Priority
      - Rule, license, or case
      - Jurisdiction
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - "1"
        - Export-controlled technology access under the EAR
        - United States and affected foreign-national access
        - Company recruiting language makes employment contingent on eligibility or prior license approval.
        - Unquantified
        - High if key technical staffing or technology transfer is blocked
        - Partial; pre-employment screening is evidenced, but product classifications and license coverage are not.
        - Obtain ECCNs, technology-control plans, license history, denials, deemed-export workflow, and role-level staffing impact.
      - - "2"
        - Privacy and data-protection obligations
        - Multi-jurisdictional; exact processing footprint not disclosed
        - An official privacy notice is identifiable, but the fetched evidence does not establish control scope or operating effectiveness.
        - Unquantified
        - Material if customer or employee data controls fail
        - Unknown beyond publication of a privacy notice.
        - Review the notice, data map, DPA templates, subprocessors, certifications, penetration tests, and incident register.
      - - "3"
        - Litigation, enforcement, IP, safety, and security matters
        - Jurisdictions not established by assigned evidence
        - No allocated source answered the adverse query; this is an unresolved evidence gap rather than evidence of no matters.
        - Unquantified
        - Unknown
        - Not evidenced
        - Require counsel letters, claims schedules, freedom-to-operate analysis, regulator correspondence, recalls, and security-incident history.
    notes: >-
      Partial public-evidence register as of 2026-10-01; severity is conditional
      on stated failure consequences, likelihood is not estimated, and omitted
      matters must not be read as absent.
    enumerationScope:
      coverage: partial
      basis: >-
        Successful prefetched sources allocated to the risks chapter through
        2026-10-01; no court-docket or regulator-record source was allocated.
    claimRefs:
      - CR001
      - CR014
      - CR015
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Priority
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure or unresolved gap
    rows:
      - - "1"
        - Package and release drift across proprietary and open-source components
        - A company job description names Linux, open-source packages, proprietary software, packaging, and release ownership.
        - Unquantified
        - High if customer deployments cannot reproduce a supported stack
        - Developing; a specialist role and golden-manifest pinning are evidenced.
        - Request supported-version matrices, release SLOs, rollback data, and customer upgrade failure rates.
      - - "2"
        - Runtime hangs, timeout handling, and device communication failures
        - Public release notes describe progress-based stuck detection and corrected timeout propagation.
        - Unquantified
        - High for production inference or training availability
        - Active remediation is visible; fleet-level outcomes are not.
        - Obtain incident counts, mean time to recovery, escalation logs, and independent production references.
      - - "3"
        - Numerical correctness, race conditions, and architecture-specific regressions
        - Public release notes describe numerous kernel correctness fixes and previously skipped tests being restored.
        - Unquantified
        - High where silent numerical error reaches customer workloads
        - Testing and simulator investment are visible, but defect escape rates are not.
        - Re-run a customer-representative parity suite on pinned hardware, firmware, compiler, and model versions.
      - - "4"
        - Finance-process and control scaling
        - The company seeks ownership of finance controls, escalation paths, KPIs, root-cause analysis, and transformation initiatives.
        - Unquantified
        - Material for reporting quality and capital allocation
        - Building; the role describes target capabilities, not completed control effectiveness.
        - Review audited statements, close calendar, ERP controls, policy exceptions, and board-level KPI reporting.
    notes: >-
      Risk ordering reflects potential consequence and available mitigation
      evidence, not an incident-frequency estimate; no fleet denominator was
      available in the assigned sources.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Priority
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure and kill criterion
    rows:
      - - "1"
        - Commercial and global operating ecosystem
        - Partners, customers, and regional operations
        - COO mandate to scale partners, revenue, and operations is documented; concentration percentages are not.
        - Commercialization outpaces support, legal, or operating capacity.
        - High if deployments or revenue depend on a small number of counterparties
        - Senior operating ownership is evidenced.
        - "Kill criterion: management cannot provide named production deployments, renewal data, and partner/customer concentration schedules."
      - - "2"
        - Software supply chain and release compatibility
        - Linux, open-source packages, internal software, firmware, and tooling
        - Component count and supplier shares are not disclosed; 152 public repositories illustrate breadth, not economic concentration.
        - An upstream change or incompatible release disrupts customer deployments.
        - High for production availability
        - Golden-version manifests and dedicated release packaging are evidenced.
        - "Kill criterion: no reproducible software bill of materials, supported-version policy, or rollback-tested release baseline."
      - - "3"
        - External capital and private-market valuation marks
        - Equity investors and secondary-access vehicles
        - Historical funding and valuation figures are public, but cash available, burn, runway, and current operating metrics are not.
        - Capital intensity or weak commercialization forces financing on unfavorable terms.
        - High until current financial durability is established
        - Large historical raises are evidenced; funding raised is not cash available.
        - "Kill criterion: no current cash bridge, monthly burn, runway, revenue, margin, working-capital, and financing-plan disclosure."
    notes: >-
      Public sources do not quantify supplier, partner, customer, or investor
      concentration; all concentration fields remain explicit gaps rather than
      estimated percentages.
    claimRefs:
      - CR005
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR016
figures:
  - id: FR001
    title: Risk heatmap with evidence-bounded likelihood
    type: matrix
    summary: >-
      Impact is assessed conditionally, while likelihood remains unquantified
      wherever the assigned evidence supplies no incident or exposure denominator.
    data:
      columns:
        - Impact if realized
        - Likelihood
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Export-control access
          values:
            - label: High
              detail: Key technical staffing or technology access can require eligibility or licensing.
            - label: Unquantified
              detail: No license volume, denial rate, or affected-role denominator was disclosed.
            - label: Partial
              detail: Employment screening is evidenced; classification and license coverage are not.
            - label: High / unknown
              detail: Clear only after review of ECCNs, licenses, and the technology-control plan.
        - label: Release and package drift
          values:
            - label: High
              detail: Incompatible software can block supported customer deployments.
            - label: Unquantified
              detail: No customer upgrade-failure or rollback rate was available.
            - label: Developing
              detail: Golden manifests and specialist release ownership are visible.
            - label: Material
              detail: Requires release SLOs, supported-version matrices, and rollback evidence.
        - label: Runtime and correctness defects
          values:
            - label: High
              detail: Hangs or silent numerical errors can invalidate production workloads.
            - label: Unquantified
              detail: Public fixes do not provide a fleet denominator or defect escape rate.
            - label: Active
              detail: Release notes show detection, simulator, testing, and remediation work.
            - label: High / unknown
              detail: Requires independent parity and production reliability results.
        - label: Finance-control scaling
          values:
            - label: Material
              detail: Weak controls can impair reporting, procurement, and capital allocation.
            - label: Unquantified
              detail: A role description identifies needs but not control failures.
            - label: Building
              detail: The company is recruiting ownership for controls, KPIs, and corrective actions.
            - label: Material
              detail: Requires audited financials and control-effectiveness testing.
        - label: Partner and global execution
          values:
            - label: High
              detail: Commercial scaling can fail if ecosystem and operating capacity lag.
            - label: Unquantified
              detail: Counterparty concentration and deployment denominators are unavailable.
            - label: Leadership owner visible
              detail: The COO mandate included partners, revenue, and global operations.
            - label: High / unknown
              detail: Requires named deployments, renewals, and concentration schedules.
        - label: Financial durability
          values:
            - label: High
              detail: Semiconductor development and commercialization require sustained capital.
            - label: Unquantified
              detail: Current cash, burn, runway, revenue, and margins were not disclosed.
            - label: Historical funding only
              detail: Funding raised and private valuation marks do not establish cash available.
            - label: High / unknown
              detail: Requires a current cash bridge, burn history, runway, and financing plan.
    approximationNotes: >-
      Ordinal impact and mitigation labels are analyst assessments tied to cited
      evidence; no numeric probability, loss amount, or risk score is implied.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR006
      - CR007
      - CR008
      - CR013
      - CR016
callouts:
  - calloutType: risk
    title: Do not convert source silence into a clean legal history
    body: >-
      The assigned adverse search produced no retained litigation, enforcement,
      outage, breach, or complaint source. That leaves the question unresolved;
      it does not support a statement that no such event occurred.
    claimRefs:
      - CR015
  - calloutType: recommendation
    title: Gate underwriting on evidence that changes the risk ranking
    body: >-
      Require export-control schedules, customer and supplier concentration,
      current audited financials, burn and runway, production incident metrics,
      and pinned-stack reliability results before reducing residual risk.
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR013
      - CR016
