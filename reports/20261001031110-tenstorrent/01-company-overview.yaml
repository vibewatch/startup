    body: "Funding and headcount estimates diverge across otherwise current profiles, while revenue, customer count, margins, cash, and ownership are not established by the assigned evidence. The investment case should therefore treat the $3.2B valuation, $2B cumulative funding, and 1,200-1,493 employee range as reported profile data rather than audited company facts."
