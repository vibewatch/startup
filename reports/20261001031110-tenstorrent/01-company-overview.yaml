company:
  name: "Tenstorrent"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Tenstorrent is a private AI-compute and semiconductor company founded in 2016 that sells AI hardware, systems, licensable processor IP, and an open-source software stack. Public profiles support a reported late-2025 Series E stage and strategic backing, but disagree materially on headquarters, cumulative funding, and headcount, while audited revenue, customer count, margins, and governance remain unavailable."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >
      Tenstorrent was founded in 2016 by Ljubisa Bajic, Ivan Hamer, and Milos
      Trajkovic. The strongest current profile in the assigned evidence places
      its operating headquarters in Santa Clara, California, while GetLatka
      still lists Toronto, Canada; the conflict should be resolved against
      corporate records rather than silently choosing one location. The company
      spans AI processors, developer cards, workstations, server systems,
      licensable RISC-V and Tensix processor IP, and an open-source compiler and
      runtime stack. This is a hybrid hardware, systems, and IP-licensing model,
      not a pure software subscription business, and no source in the pool
      establishes recurring-revenue mix or gross margin.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >
      Jim Keller is the reported chief executive and provides unusually visible
      technical credibility through prior work associated with AMD Zen,
      Apple's A-series chips, and Tesla's self-driving silicon. The current
      profile also names Keith Witek as chief operating officer and Christine
      Blizzard as chief experience officer, alongside the three co-founders.
      The evidence supports functional leadership coverage but not a complete
      board roster, voting-control map, succession plan, or founder ownership.
      Netfigo explicitly frames Keller's reputation as central to market access,
      creating key-person exposure even though the available sources do not
      quantify its commercial impact.
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "capital-formation-and-stakeholders"
    title: "Capital Formation and Stakeholders"
    body: >
      The financing record shows a progression from a Real Ventures-led seed
      round in 2017 and a roughly $20.5M-$21M Series B in 2019 to more than
      $200M at a $1B valuation in 2021, a $100M strategic round in 2023, and a
      $693M-plus Series D in 2024. A compiled August 2026 profile reports an
      $800M Series E in November 2025 at a $3.2B post-money valuation, but says
      participants were not disclosed. Strategic investors include Hyundai,
      Kia, Samsung-related entities, and LG; their capital is economically
      important, but these investor relationships are not independent evidence
      of product adoption.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "scale-conflicts-and-diligence-boundary"
    title: "Scale Conflicts and Diligence Boundary"
    body: >
      Reported scale is not yet decision-grade. One compilation estimates $2B
      raised across ten rounds, while other profile services report only $793M
      or $693M, differences likely driven by round coverage and whether debt or
      unannounced financing is included. Headcount is similarly inconsistent:
      a profile and GetLatka cite about 1,200 employees, while the same
      compilation attributes 1,493 employees in March 2026 to Revelio Labs.
      These are not interchangeable measures. The pool also lacks audited
      revenue, ARR, gross margin, customer count, cap-table, board, and
      regulatory or legal records. Netfigo flags talent competition and RISC-V
      ecosystem maturity as operational constraints, but no source quantifies
      their financial effect.
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
