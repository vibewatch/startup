          - type: paragraph
            body: >
              Tenstorrent 面临前沿半导体挑战者常见的结构性客户集中与业务持久性难题 [CU005, CU006]。早期核心标杆案例高度依赖产业战略投资方，包括来自 Samsung、LG Electronics 与
              Hyundai Motor Group 的长期背书，以及累计规模超 $2B 的主流机构轮融资 [CU007, CU008]。非投资方背景的超大规模云厂商或 Fortune 500 强企业的独立采购定点尚未公开披露
              [CU005, CU006]。由于 Galaxy Blackhole 规模出货在 2026 年才刚启动，净收入留存率（NRR）、总收入留存率（GRR）和续约率等软硬件常规指标尚无法从公开披露中获悉 [CU006,
              CU009]。此外，开发者采用很大程度上取决于开源工具链的成熟度；Tenstorrent 宣称实现了 90% 的 Hugging Face 模型兼容性，并可通过 TT-Lang 实现 CUDA 算子自动迁移
              [CU001, CU002]。面对脱离 NVIDIA CUDA 产生的高昂迁移切换成本，企业买方依然将 RISC-V 软件生态深度视为走向主流落地的核心阻碍 [CU005, CU010]。最后，Qualcomm
              等半导体传统巨头传出的收购意向一方面印证了其战略 IP 价值，另一方面也凸显了其作为独立公司商业落地的执行风险 [CU011, CU012]。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU009
      - number: '6.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 媒体生成与主权 AI 特定工作负载下的突破
            body: >
              在 GPU 基础设施经济性出现瓶颈的领域，Tenstorrent 成功开辟了落地的破局点 [CU001, CU002]。在实时 AI 视频生成领域，与 Prodia 的合作实现了 10 倍的生成速度提升，印证了
              Blackhole 架构高 SRAM 与 DRAM 带宽的价值 [CU002, CU004]。此外，日本和印度的国家级算力项目提供了即时的地域多元化，避免完全受制于超大规模云厂商的采购周期 [CU001,
              CU002]。
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: 软件生态切换成本与独立验证匮乏
            body: >
              尽管据其宣称拥有每 100 万 tokens 仅需 $6 的成本优势及 90% 的 Hugging Face 模型覆盖率，但企业生产环境下的独立第三方验证依然薄弱 [CU001, CU005]。开发者在
              NVIDIA 专有 CUDA 生态上倾注超 15 年的投入，为主流企业买方筑起了极高的切换壁垒 [CU005, CU010]。在缺乏成熟企业级直销体系的情况下，Tenstorrent 面临局限于技术极客早期用户及
              Neocloud 小众运营商的风险 [CU005]。
            calloutType: risk
            claimRefs:
              - CU001
              - CU005
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险组合
        blocks:
          - type: paragraph
            body: >-
              最核心的风险在于出口管制制约下覆盖软硬件全栈的交付执行。Tenstorrent
              自身的招聘要求明确指出，接触受美国出口管制的受控技术取决于国籍、居留权或预先许可审批，这形成了白纸黑字的人员入职延误或录用撤回机制，说明监管担忧并非纸上谈兵。公司自研软件体系还展现出庞大的代码库规模，并频繁出现针对依赖漂移、任务卡死检测、超时、竞态条件以及数值计算正确性的修复提交。这些虽是积极修复的信号，但也反映出持续的集成与版本管理负担。现有证据并未量化发生概率，因此评估矩阵审慎地将潜在高影响与未知概率隔开，在仅见招聘要求、版本发布说明或公开工具处，将缓解措施成熟度归类为部分成熟。
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR013
              - CR016
      - number: '7.2'
        title: 监管、法律与治理风险敞口
        blocks:
          - type: paragraph
            body: >-
              出口管制是证据最明确的监管制约：公司现行招聘启事明确将入职资格与受控技术的访问资质挂钩，并指出可能需要美国商务部或其他联邦机构审批许可证。官方隐私政策虽能在公开渠道查到，但获取的页面无法印证合规控制范围、认证资质、违规记录或数据处理责任。同样，负面信息检索未在本章归集任何诉讼、执法、宕机、数据泄露或投诉的来源。这一结果属于证据缺口，并不证明从未发生此类事件。因此，投委会通过决策时应要求管理层提供包含出口管制分类与许可证、重大争议、IP
              自由实施（FTO）、隐私合规控制和安全事件的附表，而不宜认定公开记录完备无缺。
            claimRefs:
              - CR001
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR014
              - CR015
      - number: '7.3'
        title: 运营与软件交付执行
        blocks:
          - type: paragraph
            body: >-
              其运营模式将专有软硬件与 Linux 及其他开源软件包深度结合，推高了版本锁定、打包、兼容性及维保支持的履约难度。Tenstorrent 曾公开招聘专家为 RISC-V 与系统 IP
              客户构建并发布该软件栈；其公开版本动态提到了通过黄金清单（golden-manifest）锁定防范依赖漂移，以及基于进度的训练任务卡死检测机制。同一动态还记录了针对算子内核、模拟器、设备
              I/O、固件及部署工具的大量正确性修复。这些披露表明公司具备可观测性与纠错动作，但现有证据未提供任何全集群故障率、SLA
              历史记录、召回记录、缺陷漏出率或独立的生产环境可靠性基准。因此尽调卡点应针对基线版本测试代表性客户工作负载，并在确认其具备生产级可靠性前，要求调取缺陷、RMA 换货、宕机及版本回滚的历史记录。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: 依赖项、财务模型与一票否决标准
        blocks:
          - type: paragraph
            body: >-
              相较技术风险，生态伙伴与财务层面的风险量化程度明显偏弱。2023 年的一份管理层报告将 COO 的核心职责定位于扩展全球合作伙伴生态、营收与运营，表明商业化推进与外部协同是明确的交付考核点。StartEngine
              后续称其在 $2.6B 估值下完成了 $693M 的 Series D 轮融资，并拥有近 $150M 的 IP 授权合同，但同时声明其公司信息未经独立核实。Tenstorrent 早期公告记录了以 $1B
              估值筹集超 $200M
              的融资历程；然而两个融资数字均非账面可用现金，保留的来源也未披露当前的烧钱速度、现金跑道、营收、利润率、营运资金或客户集中度。因此，投资逻辑破裂触发条件属于明确可测的尽调卡点：无法提供最新审计财务报告、遭遇实质性出口许可证封锁、反复出现版本回滚或计算正确性事故，抑或客户
              / 供应商集中度明细表暴露出未经对冲的单点失效风险。
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 切勿将信息空白等同于合规记录清白
            body: 负面检索未检索到诉讼、执法处罚、宕机、数据泄露或投诉的留存来源。这说明该问题尚未解决，并不支持做出从未发生此类事件的结论。
            calloutType: risk
            claimRefs:
              - CR015
          - type: callout
            title: 以能改变风险评级的实质证据作为投资卡点
            body: 在调低剩余风险评级前，必须要求提供出口管制附表、客户与供应商集中度明细、经审计的最新财报、烧钱速度与现金跑道数据、生产环境事故指标，以及基于基准软件栈的可靠性实测结果。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR013
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、立场与决策矩阵
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent 结合开源 RISC-V 指令集架构、Tensix 处理器内核以及面向 AI 训练和推理的开源编译器工具链，展现了颠覆专有 GPU 架构的远大野心。其核心投资逻辑在于市场对 AI
              算力自主权、模块化芯粒扩展性的迫切需求，以及对摆脱以 Nvidia CUDA
              为代表的软件生态锁定的渴望。然而，该逻辑面临着反向逻辑的强力挑战：商业化年化收入运行率未经证实、资本消耗巨大，且二级老股市场估值未经核实。鉴于缺乏经核实的客户合同收入，且已确认的 $2.0B Series D
              轮投前估值与未经证实的 $3.2B 至 $5.76B 老股交易估值之间存在巨大脱节，我们维持“继续研究”的投资建议，评定其风险等级为“高”，估值立场为“偏高”。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV010
      - number: '8.2'
        title: 融资历程与估值分歧
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent 经核实的公司融资锚定于 2024 年 12 月 2 日的 Series D 轮，该轮由 Samsung Securities 和 AFW Partners 领投，以 $2B 投前估值完成超
              $693M 融资。早期经核实的轮次包括 2021 年 5 月以 $1B 估值完成超 $200M 的 Series C 轮。在各老股及一级市场数据库中，报道的累计融资额在 $1.18B 至 $2.46B
              之间，Forge Global 等 Pre-IPO 平台收录的 Series E-1/E-2 备案文件显示其投后估值达 $5.76B（每股 $81.08 至 $111.23），而部分机构简报则标注了 2025 年
              11 月未经证实的 $3.2B 估值。这些分歧巨大的估值指标反映出在缺乏对等审计财务数据支撑的情况下，公司估值倍数已出现大幅膨胀。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
      - number: '8.3'
        title: 情景分析与核心尽调诉求
        blocks:
          - type: paragraph
            body: >-
              我们针对 Tenstorrent 评估了包含乐观、基准与悲观在内的三种情景。乐观情景要求 Blackhole 与 Galaxy 系统实现大规模商业化普及，拿下超大规模云厂商的定点合作，开源编译器走向成熟，支撑
              $6B 以上的退出估值。基准情景对应在企业端与合作伙伴（Samsung、Hyundai、LG）实现温和部署，伴随经常性软件 IP 授权收入，支撑 $2.5B 至 $3.5B
              的估值区间。悲观情景则模拟了软件生态阻力、流片延期以及 TSMC 晶圆代工产能受限，可能触发降价轮（down-round）风险，估值跌破 $1.5B。一线尽调必须查明 2025-2026
              年经审计的年化收入运行率、非股东背景客户集中度，以及美国工业和安全局（BIS）的出口管制分类结果。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 建议立场：估值偏高，维持继续研究
            body: >-
              尽管 Tenstorrent 拥有 Jim Keller 坐镇的顶尖芯片架构领军阵容，并获得大型工业财团的战略支持，但审计财报披露的缺失，以及二级市场数据集中明显的估值泡沫（$2.0B 至
              $5.76B），决定了当下应当采取“继续研究”的立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV008
          - type: callout
            title: 资本密集度与估值下调风险
            body: 半导体芯片制造需要持续的重资本投入。若开发者生态阻力或软件编译器延期阻碍了大规模商业变现，后续融资或将被迫接受惩罚性清算条款或估值下调（down-round）。
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
              - CV016
