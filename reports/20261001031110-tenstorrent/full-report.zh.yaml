              GPU，Tenstorrent 的硬件架构选用通用 GDDR6 显存与标准以太网互连，借此压缩物料清单（BOM）直接成本。芯片制造与封装则依赖第三方晶圆代工伙伴，公司与 TSMC 及 Samsung
