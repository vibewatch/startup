            title: 编译开销与首次冷启动延迟瓶颈
            body: 独立基准测试显示，在首次运行中，矩阵分块与 JIT 编译占用了高达 97% 的总执行时间。对于动态、短期运行或频繁变动的模型架构，相较成熟的 GPU 工具链，高昂的编译开销构成了开发者直接上手的实质障碍。
            calloutType: risk
