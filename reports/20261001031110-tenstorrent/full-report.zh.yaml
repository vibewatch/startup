        title: 企业定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Tenstorrent 由 Ljubisa Bajic、Ivan Hamer 和 Milos Trajkovic 于 2016 年创立。现有证据中可靠性最高的资料显示其运营总部位于加利福尼亚州 Santa
              Clara，而 GetLatka 仍标注为加拿大 Toronto；该冲突须核对工商登记档案确认，不宜直接选定单一地点。公司业务覆盖 AI 处理器、开发者板卡、工作站、服务器系统、可授权的 RISC-V 与
              Tensix 处理器 IP，以及开源编译器和运行时软件栈。这是一种硬件、系统集成与 IP 授权并行的混合模式，而非纯软件订阅业务，且证据池中没有任何来源能证实其经常性收入占比或毛利率。
