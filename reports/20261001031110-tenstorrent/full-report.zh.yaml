      - number: '5.3'
        title: 能效优势、软件调优瓶颈与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              针对 Grayskull e75 加速卡在稠密矩阵乘法（MatMul）算子上的独立学术实测表明，尽管传统 NVIDIA 数据中心 GPU 在绝对原始浮点吞吐量上仍保持大幅领先，但 Tenstorrent 的空间
              Tensix 架构展现出极强的能效竞争力，在 BF16 精度下能效峰值达 1.55
              TFLOPs/Watt。然而，该架构的能效优势也伴随着突出的工程摩擦。算子首次冷启动执行严重受制于运行时矩阵分块（tiling）与 JIT 编译开销，两者分别占到初始执行时间的 31% 和
              66%，只有在后续热运行中，耗时大头才转为主机到设备的数据传输（62%）。此外，Tenstorrent 转向多芯片 SiP 封装引入了极高的物理设计与封装复杂度，涉及跨芯粒凸块（bump）规划、适配高速
              GDDR7 显存的 PAM-3 信号接口，以及贯穿 AI、CPU、内存和 I/O 芯粒区域的可配置 NoC 路由。更关键的是，由于 Tenstorrent
              的前沿高性能计算芯片研发均在北美据点展开，工程招聘记录显示关键物理设计与软件架构岗位必须严格遵守美国《出口管理条例》（EAR），在未获得联邦出口许可证前，限制录用 EAR 国家分组 D:1、E1 及 E2
              的外籍雇员。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
