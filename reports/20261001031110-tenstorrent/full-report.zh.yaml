  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: AI 加速器竞争图谱与架构分化
        blocks:
          - type: paragraph
            body: >-
              2026 年的 AI 加速芯片格局，核心特征是主流通用 GPU 与专用推理架构的彻底分化。Nvidia 凭借 Blackwell（B200、GB200）与
              Hopper（H100）系列产品线，在高性能模型训练与线上推理市场占据近乎垄断的份额。AMD 是商用芯片端的主要替代选择，其 Instinct MI300 与 MI355
              加速卡在超大规模云厂商中取得了看得见的落地进展，尽管 ROCm 软件生态成熟度仍显不足。除了这两家传统双雄，包括 Groq、Cerebras 与 SambaNova
              在内的专用推理初创企业已募集数十亿美元，分别利用定制 LPU、晶圆级引擎与可重构数据流架构争夺 token 生成场景。


              Tenstorrent 在这一格局中占据了差异化的竞争生态位。公司并未押注封闭单一形态的专用加速芯片，而是采取了独立芯片销售、交钥匙整机集群与可授权 RISC-V 处理器 IP 并行的混合模式。在完成投前估值
              $2B、总额超 $693M 的 Series D 轮融资后，其累计融资金额突破 $2B。面对 Nvidia，Tenstorrent 的 Blackhole
              架构并不硬拼单芯片峰值算力吞吐，而是将筹码押在集群级持续内存带宽、每 token 成本优势以及不受约束的开源软件栈上。
