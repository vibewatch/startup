  - id: FR001
    title: 基于证据界定可能性的风险热力图
    type: matrix
    summary: 影响程度按特定假设评定；只要所依据证据未披露事故或暴露基数，发生可能性均保持未量化状态。
    data:
      columns:
        - 若发生的影响程度
        - 发生可能性
        - 缓解措施成熟度
        - 残留严重性
      rows:
        - label: 出口管制与准入风险
          values:
            - label: 高
              detail: 核心技术人员招聘或技术获取可能需要资格审查或许可审批。
            - label: 未量化
              detail: 未披露许可证审批量、拒签率或受影响岗位基数。
            - label: 部分具备
              detail: 已证实存在雇员背景审查，但技术分类与许可证覆盖范围缺乏证据。
            - label: 高 / 未知
              detail: 须在审查 ECCN 编码、许可证及技术管制计划后方可明确。
        - label: 版本发布与软件包偏离
          values:
            - label: 高
              detail: 软件不兼容可能阻碍客户支持环境的正常部署。
            - label: 未量化
              detail: 缺乏客户升级失败率或版本回滚率相关数据。
            - label: 发展中
              detail: 已确立黄金配置清单（Golden Manifest）并指定专业发布负责人。
            - label: 实质影响
              detail: 仍需发布 SLO、支持版本兼容性矩阵及回滚验证证据。
        - label: 运行时与计算准确性缺陷
          values:
            - label: 高
              detail: 程序卡死或静默数值误差可能导致生产环境负载失效。
            - label: 未量化
              detail: 公开修复记录未提供整体设备基数或缺陷逃逸率。
            - label: 积极推进
              detail: 发版说明显示团队持续投入缺陷检测、模拟器、自动化测试与代码修复。
            - label: 高 / 未知
              detail: 仍需独立的一致性比对及生产环境可靠性验证结果。
        - label: 财务内控规模化扩展
          values:
            - label: 实质影响
              detail: 内控不足可能削弱财务汇报、采购管理及资本分配效率。
            - label: 未量化
              detail: 岗位职责描述指明了内控需求，但未反映实际内控失效事件。
            - label: 建设中
              detail: 公司正在招聘负责内控机制、KPI 考核与整改措施的专职人员。
            - label: 实质影响
              detail: 须经审计财务报表及内控有效性测试加以确认。
        - label: 合作伙伴与全球执行力
          values:
            - label: 高
              detail: 若生态建设与运营能力滞后，商业化扩张可能受阻。
            - label: 未量化
              detail: 未公开交易对手集中度及落地部署规模基数。
            - label: 明确高管负责
              detail: COO 职责已涵盖合作伙伴拓展、营收增长及全球业务运营。
            - label: 高 / 未知
              detail: 需具体客户部署案例、续约数据及客户集中度明细表予以佐证。
        - label: 财务韧性与持续经营能力
          values:
            - label: 高
              detail: 半导体研发与商业化落地需要持续巨额资本支撑。
            - label: 未量化
              detail: 现有现金储备、烧钱率、跑道时长、营收及利润率均未披露。
            - label: 仅见历史融资
              detail: 已融资金额和一级市场估值不代表当期可用现金水平。
            - label: 高 / 未知
              detail: 亟需当期现金流桥接表、历史烧钱明细、跑道测算及后续融资方案。
    approximationNotes: 影响程度与缓解评级均为分析师基于所引证据的主观评估，不代表量化概率、损失金额或风险评分。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR006
      - CR007
      - CR008
      - CR013
      - CR016
