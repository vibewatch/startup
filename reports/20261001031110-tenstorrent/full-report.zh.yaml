      - number: '2.3'
        title: 买方细分、工作负载驱动与落地瓶颈
        blocks:
          - type: paragraph
            body: >
              Tenstorrent 的 Galaxy 系统与处理器 IP 主要由三类买方采用，各有不同的商业与地缘政治诉求。其一是 Neocloud 与主打推理的算力服务商（如 Cirrascale、ai& 和
              Turiyam），他们急需破解 GPU 溢价瓶颈，瞄准其宣称在 DeepSeek-671B 等混合专家架构上每 100 万 tokens 仅需 $6 的推理成本。其二是印度、日本等国家和地区的主权 AI
              项目与国家级算力基础设施，旨在借力 Tenstorrent 确立硬件自主权与可审计性，摆脱对美国 GPU 平台及专有闭源软件的单一依赖。其三是汽车与消费电子主机厂（如 Hyundai Motor Group 和
              LG Electronics），通过授权 Ascalon 和 Tensix IP 自研定制芯片。然而，实质性的落地阻碍依然显著：Nvidia CUDA 筑起的 15
              年开发者生态护城河带来了极高的切换阻力；生产级独立基准测试验证依旧薄弱；此外 Tenstorrent 主攻推理，意味着全生命周期训练用户仍必须依赖老牌 GPU 巨头。
