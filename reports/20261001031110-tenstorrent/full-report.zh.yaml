        - 获取故障事件次数、平均恢复时间（MTTR）、问题升级日志以及独立的生产环境用户背书。
      - - '3'
        - 数值计算正确性、竞态条件及特定架构回归问题
        - 公开版本说明显示，团队已修复多项算子内核正确性问题，并恢复了此前跳过的测试用例。
        - 未量化
        - 一旦静默数值误差渗透至客户业务负载，则影响严重
        - 测试与仿真器投入显而易见，但缺陷遗漏率并未披露。
        - 在锁定的硬件、固件、编译器和模型版本上重新运行具有客户代表性的对齐测试套件。
      - - '4'
        - 财务流程与内控扩展瓶颈
        - 公司正物色专人负责财务内控、问题升级路径、关键绩效指标（KPI）、根本原因分析以及流程转型倡议。
        - 未量化
        - 对财务报告质量与资本配置构成重大影响
        - 建设中；招聘岗位描述的是目标能力，而非已落地的实际内控有效性。
        - 审查经审计财报、结账日程表、ERP 内控、制度例外情况以及董事会级 KPI 报告。
    notes: 风险排序反映潜在后果及现有缓解措施证据，并非事故发生频率估算；所分配证据中未提供机群规模分母。
