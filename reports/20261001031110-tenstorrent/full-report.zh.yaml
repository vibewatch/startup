  - id: FE001
    title: Tenstorrent 全栈产品与技术架构
    type: stack
    summary: Tenstorrent 从芯片 IP 到开发者应用的分层拆解，涵盖硬件、互连、运行时及软件框架层。
    data:
      layers:
        - label: 开发者界面与服务化层
          detail: 开箱即用的推理引擎、云端控制台与生态应用
          items:
            - label: 服务化与部署
              detail: QuietBox 工作站上的 tt-inference-server 与 vLLM 部署环境
            - label: 云端控制台与 Web IDE
              detail: 无需本地硬件，直接在浏览器中访问并运行芯片任务
        - label: 应用与框架接口层
          detail: 顶层模型执行接口与开发者环境
          items:
            - label: 机器学习框架前端
              detail: PyTorch 原生集成、JAX / PyTorch-XLA 支持及 ONNX 运行时
            - label: TT-Awesome 生态
              detail: 超过 115 个社区及官方模型、算子内核与应用方案（recipe）
        - label: 编译与计算图优化层
          detail: 计算图下沉（lowering）与中间表示编译器
          items:
            - label: TT-Forge MLIR 编译器
              detail: 基于 MLIR 的编译器，负责将计算图表示下沉映射至各类硬件目标
            - label: 计算图切分
              detail: 跨核心网格的模型自动化拆解与计算图分块（graph tiling）
        - label: 底层算子内核与运行时抽象层
          detail: 算子内核执行抽象与内存布局 API
          items:
            - label: TT-NN 函数库
              detail: 提供显式 DRAM 与 L1 分片抽象的高级 Python 张量库
            - label: TT-Metalium 算子内核模型
              detail: 直接管理 Tensix 子核心、循环缓冲区与 NoC 数据包的 C++ 编程模型
        - label: 芯片架构与核心微架构
          detail: 基础计算引擎与通用处理器核心
          items:
            - label: Tensix AI 核心
              detail: 每 Tile 配备 5 个精简 RISC-V 核心与 1 MB L1 SRAM 的 SIMD 矩阵/向量引擎
            - label: Ascalon RISC-V CPU
              detail: 运行宿主操作系统并处理标量运算的高性能乱序执行 CPU 核心
        - label: 物理互连、内存与封装
          detail: 片上互连网络、多 Die Chiplet 封装及外部内存
          items:
            - label: 双重 2D Torus NoC
              detail: 基于 Arteris 技术的片上网络，支持灵活组态与组播数据包路由
            - label: 模块化 Chiplet SiP
              detail: 开放 Chiplet 架构（OCA），集成 AI、CPU、GDDR7 及 I/O Chiplet
            - label: 内存物理接口
              detail: 多通道 LPDDR4 内存子系统，规划逐步演进至 GDDR7 PHY
