      - number: '2.2'
        title: 市场规模测算视角、估值锚点与并购假设
        blocks:
          - type: paragraph
            body: >
              量化 Tenstorrent 的潜在市场总额（TAM）与可服务市场（SAM），需要综合多层级硬件支出、可授权 IP 版税分成以及半导体领域的战略并购估值。尽管生成式 AI
              整体硬件开支是一波高达数千亿美元的浪潮，但专用的 AI 推理加速芯片才是异构算力方案能够立足的关键可服务边界。Tenstorrent 的一级市场融资历史为该市场空间提供了参照：公司在 2021 年以 $1.0B
              估值完成超 $200M 融资；2024 年 12 月斩获 $693M 的 Series D 轮，投前估值 $2.0B、投后估值 $2.6B；据报道还在 2025 年底就投前估值 $3.2B 的 $800M
              Series E 轮展开磋商。2026 年中有关 Intel 和 Qualcomm 初步收购意向的报道更凸显了推理芯片与 RISC-V IP 的战略价值，当时给出的估值在 $5.0B 至 $10.0B 之间，不过
              Qualcomm 现有的 IP 资产也让外界怀疑其是否有必要开出 $8B 至 $10B 的高价。
