      - number: '3.4'
        title: 生态锁定、软件成熟度与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              AI 加速领域的决定性战场始终在软件生态的覆盖面。Nvidia 的竞争壁垒靠 20 年的 CUDA 编译器深度调优、高度优化的算子库，以及全球完全基于 CUDA
              抽象培养起来的庞大开发者群体共同维系。任何硬件方案除非工具链能无缝执行 PyTorch 模型且无需手动重写算子，否则必然遭遇巨大的切换阻力。


              Tenstorrent 押注于全开源软件栈，包含 TT-Metalium 编程模型、TT-NN 算子库以及基于 MLIR 的 TT-Forge 编译器。然而，包括 2025 年 12 月对 QuietBox
              工作站的技术评估在内的多项第三方测评均指出，其软件生态尚欠成熟，距商业级生产环境要求仍有明显差距。虽然 Tenstorrent 与 LG Electronics 和 Hyundai Motor Group 的
              IP 授权合作为其提供了非数据中心业务的收入对冲，但要想在企业级数据中心真正撬动 Nvidia 的基本盘，必须在老牌 GPU 迭代抹平其 token 成本优势前，彻底补齐软件稳定性短板。
            claimRefs:
