      - 主观概率
    rows:
      - - 乐观情景
        - Blackhole/Galaxy 硬件迅速铺开；开源软件栈在推理负载上追平 CUDA；商业化收入突破 $250M。
        - $6.0B - $8.0B
        - 拿下大型公开超大规模云厂商订单；一线 OEM 持续稳定出货。
        - 25%
      - - 基准情景
        - 在汽车领域及韩国战略合作伙伴（Samsung、Hyundai、LG）内部稳步拓展；收入温和增长至 $50M–$100M 运行率水平。
        - $2.5B - $3.5B
        - 芯片流片与交付如期推进；软件编译器成熟度仍呈渐进式演进。
        - 50%
      - - 悲观情景
        - CUDA 开发者生态锁定限制了非合作伙伴销售；软件缺陷阻力明显；台积电（TSMC）产能受限；高额资金消耗迫使其开展结构性降估值融资（down-round）。
        - $1.0B - $1.5B
        - 概念验证（PoC）未能转化为商业化规模采购；关键高管离职。
        - 25%
