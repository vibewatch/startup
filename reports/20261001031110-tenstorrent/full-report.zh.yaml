      - number: '2.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 推理端为异构芯片带来的破局机会
            body: >
              与 Nvidia 凭借 CUDA 软件筑起坚固壁垒的 AI 训练市场不同，AI 推理展现出高度分化的需求格局，覆盖从视觉生成到混合专家 LLM 的多样化模型。这种工作负载的分化，让 Tenstorrent 的
              Galaxy 等替代架构无需硬拼峰值算力（FLOPS），而是凭每 token 成本优势与免交换机以太网拓扑展开有效竞争。
            calloutType: insight
