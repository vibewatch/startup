      - number: '3.3'
        title: 推理经济性、产品封装与云端落地阻力
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent 的核心商业卖点建立在对推理成本的结构性重构上。公司宣称在长上下文推理模型上相比 Nvidia GPU 基础设施具有 5 倍的总拥有成本（TCO）优势；在 DeepSeek R1 671B
              模型上测得单用户每秒超 350 tokens 的生成速度，运营成本约 $6 每 100 万 tokens，而对应 Nvidia 硬件的预估成本为 $30 每 100 万 tokens。整套系统中，Galaxy
              Blackhole 机架标价为 $110,000，面向开发者的评估板卡 p100 与 p150 零售价分别为 $999 和 $1,399，降低了实体硬件的测试门槛。


              尽管芯片本身的经济性诱人，Tenstorrent 面临的商业化分发阻力依旧严峻。截至 2026 年中，主要超大规模云厂商的云市场中仍未上架 Galaxy 系统。企业采购方可在 AWS、Azure、GCP 及专用
              GPU 云平台上按小时按需调用 Nvidia 实例，而评估 Tenstorrent 则需采购实体整机、通过 Equinix 等合作伙伴进行托管，或借助起步阶段的
              Neocloud。这种阻力大幅推高了风险厌恶型企业基础设施团队的试用门槛。
            claimRefs:
