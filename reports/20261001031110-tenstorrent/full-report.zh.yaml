  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 双轨计算架构与异构互连设计
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent 的计算架构有别于传统的单片集成 GPU，而是将通用控制执行与密集张量加速解耦，分配给模块化芯片单元。其芯片底层设计立足于两大专有内核架构：完全从零自研的高性能 Ascalon RISC-V
              CPU 内核，负责主机操作系统运行、工作负载编排与标量逻辑；以及专为深度学习计算优化的 Tensix AI 内核。在 Grayskull 加速卡一代中，96 至 120 个 Tensix 内核阵列通过定制的双
              2D 环形片上网络（NoC）互连，以极小的主机软件调度开销实现分组多播数据传输。每个 Tensix 内核包含 5 个单发射“轻量级（baby）”RISC-V 内核、一套 SIMD 矩阵与向量计算单元，以及 1
              MB 专属本地 SRAM L1 缓存。在单个内核内部，2 个 RISC-V 内核专门负责异步数据搬移，调度本地 SRAM、相邻内核 SRAM 与外部 LPDDR4 内存之间的数据；另外 3 个计算 RISC-V
              内核负责数据解包、数学算子执行与数据打包。各执行阶段之间的通信基于 SRAM 中的环形缓冲区（circular buffer），在将张量操作执行为数据流图的同时，最大化计算与通信的空间重叠。
