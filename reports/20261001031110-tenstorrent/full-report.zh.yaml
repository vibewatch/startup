  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、客群细分与支出结构界定
        blocks:
          - type: paragraph
            body: >
              Tenstorrent 的目标市场划分为两个独立的商业阵地：专用数据中心 AI 推理基础设施，以及可授权的半导体处理器知识产权（IP）。基础设施业务中，Tenstorrent 的 Galaxy
              系统主打快速扩张的推理工作负载，有意将推理计算与 Nvidia CUDA 架构统治的高资本开支训练市场隔开。纳入的支出涵盖企业与超大规模云厂商的推理集群、Neocloud 算力资源，以及采用标准以太网和
              GDDR6 DRAM（而非专有高带宽内存 HBM）的主权 AI 算力部署。排除的支出则包括需要紧耦合 HBM 架构和成熟全周期工具链的前沿基础模型预训练集群。IP 授权业务中，Tenstorrent
              向外部半导体设计团队授权其 Ascalon RISC-V CPU 内核及 Tensix AI 加速器内核，切入汽车、消费电子与边缘计算领域的芯片设计预算。
