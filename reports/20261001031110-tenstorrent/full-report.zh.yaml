      - number: '3.2'
        title: 芯片性能、工作负载适配与工程权衡
        blocks:
          - type: paragraph
            body: >-
              在线推理场景的技术分水岭，正日益由内存子系统和集群级互连能力决定，而非单纯的原始算力 FLOPS。Tenstorrent 的 Galaxy Blackhole 系统集成了 32 颗 Blackhole
              ASIC，可提供最高 23 PFLOPS 的 Block FP8 算力，同时配备吞吐量达 2.9 PB/s 的 6.2 GB 片上 SRAM，以及提供 16 TB/s 聚合带宽的 1 TB GDDR6
              显存。这种存储层级设计直击大语言模型 KV 缓存和实时媒体生成中的内存带宽瓶颈，同时规避了高带宽内存（HBM）高昂的发热与成本代价。


              此外，Tenstorrent 放弃了主流的横向扩展拓扑，每套 Galaxy 单元采用 56 个 800G 以太网端口组成免交换机环形（torus）网络。与 Nvidia 依赖专有 NVLink 和
              NVSwitch 网络对 GPU 进行紧耦合不同，Tenstorrent 的网络化 AI 方案直接通过处理器芯片自身路由流量。该架构在 DeepSeek 等混合专家（MoE）模型上展现出独特亲和力，Tensix
              内核独立的 MIMD 执行模式规避了传统 SIMT GPU 流水线常见的线程束分化（warp divergence）损耗。然而，公有云部署的缺失限制了广大开发者的全面验证，这也促使 Qualcomm
              等意向方考虑发起 $8 至 $10B 的收购要约，意图将 Tenstorrent 的设计纳入其更广泛的企业级计算产品线。
