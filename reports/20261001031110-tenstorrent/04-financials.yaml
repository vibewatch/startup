callouts:
  - calloutType: "risk"
    title: "Substantial Software Development Friction Threatens Sales Velocity"
    body: >
      Technical feedback from practitioner communities indicates that Tenstorrent's non-standard AI accelerator architecture is severely constrained by software maturity compared to the mature Nvidia CUDA ecosystem. Moving workloads to proprietary RISC-V and Tensix hardware requires extensive software translation and developer retraining, creating a protracted barrier to enterprise software adoption and sales payback.
    claimRefs:
      - "CI008"
      - "CI009"
  - calloutType: "insight"
    title: "Strategic Alignment Between Equity Backers and Commercial Pipeline"
    body: >
      Tenstorrent's capitalization structure features substantial direct investment from Asian industrial conglomerates—including Hyundai Motor Group, Samsung Catalyst Fund, and LG Electronics. These partners simultaneously function as equity investors, potential foundry manufacturing partners, and anchor customers for Tenstorrent's automotive and consumer AI processor IP.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI015"
