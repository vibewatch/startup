callouts:
  - calloutType: insight
    title: "The Heterogeneous Silicon Opening in Inference"
    body: |
      Unlike AI training, where Nvidia established an entrenched CUDA software moat, AI inference represents a fragmented demand wave spanning diverse models from vision generation to mixture-of-experts LLMs. This workload divergence allows alternative architectures like Tenstorrent's Galaxy to compete effectively on cost-per-token and switchless Ethernet topologies rather than peak FLOPS.
    claimRefs:
      - CM001
      - CM004
      - CM010

  - calloutType: risk
    title: "CUDA Stickiness and Production Validation Hurdles"
    body: |
      Despite promising demonstrations of AI-assisted CUDA kernel translation to TT-Lang, Nvidia's fifteen-year developer ecosystem poses substantial enterprise inertia. Furthermore, independent third-party production benchmarks remain scarce, meaning mainstream enterprise buyers may hesitate until long-term cluster reliability is proven outside early partner deployments.
    claimRefs:
      - CM013
      - CM014
      - CM015

