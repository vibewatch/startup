      - number: '3.2'
        title: Capability, Workload Affinity, and Silicon Trade-offs
        blocks:
          - type: paragraph
            body: >-
              Technical differentiation in production inference is increasingly determined by the memory subsystem and
              cluster-scale interconnect rather than raw arithmetic FLOPS. Tenstorrent's Galaxy Blackhole system
              integrates 32 Blackhole ASICs, delivering up to 23 PFLOPS of Block FP8 compute alongside 6.2 GB of on-chip
              SRAM operating at 2.9 PB/s and 1 TB of GDDR6 memory providing 16 TB/s of aggregate bandwidth. This memory
              hierarchy directly targets the memory-bandwidth bottlenecks inherent to large language model key-value
              caching and real-time media generation, avoiding the severe thermal and cost penalties of High Bandwidth
              Memory (HBM).


              Furthermore, Tenstorrent departs from incumbent scale-out topologies by adopting a switchless torus
              network utilizing 56 ports of 800G Ethernet per Galaxy unit. While Nvidia relies on proprietary NVLink and
              NVSwitch fabrics to tightly couple GPUs, Tenstorrent's networked AI approach routes traffic directly
              through the processors themselves. This architecture demonstrates particular affinity for
              Mixture-of-Experts (MoE) architectures such as DeepSeek, where the independent MIMD execution of Tensix
              cores avoids the warp-divergence penalties suffered by conventional SIMT GPU pipelines. However, the
              absence of public cloud availability limits broad developer verification, leading suitors such as Qualcomm
              to evaluate acquisition bids of $8 to $10 billion to incorporate Tenstorrent's designs into a broader
              enterprise compute portfolio.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
