      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workload-Specific Traction in Media Generation and Sovereign AI
            body: >
              Tenstorrent has successfully carved out concrete adoption beachheads where GPU infrastructure economics
              break down [CU001, CU002]. In real-time AI video generation, the partnership with Prodia delivers 10x
              faster generation times, validating the Blackhole architecture's high SRAM and DRAM bandwidth [CU002,
              CU004]. Furthermore, sovereign infrastructure initiatives in Japan and India provide immediate geographic
              diversification and shielding from hyperscaler procurement cycles [CU001, CU002].
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Software Ecosystem Switching Costs and Thin Independent Validation
            body: >
              Despite strong claimed token economics of $6 per million tokens and 90% Hugging Face model coverage,
              independent third-party corroboration in enterprise production remains thin [CU001, CU005]. Over 15 years
              of developer investment in NVIDIA's proprietary CUDA ecosystem create formidable switching costs for
              mainstream enterprise buyers [CU005, CU010]. Without a mature enterprise direct-sales apparatus,
              Tenstorrent risks remaining confined to technically sophisticated early adopters and neocloud niche
              operators [CU005].
            calloutType: risk
            claimRefs:
