  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Decision Matrix
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent presents an ambitious alternative to proprietary GPU architectures by coupling an open-source
              RISC-V ISA and Tensix processor cores with open compiler toolchains targeting AI training and inference.
              The core investment thesis centers on market demand for AI compute sovereignty, modular chiplet
              scalability, and avoidance of software lock-in represented by Nvidia's CUDA ecosystem. However, this
              thesis is challenged by the anti-thesis: unconfirmed commercial revenue run-rates, heavy capital
              requirements, and unverified secondary market marks. Given the lack of verified customer contract revenues
              and the wide divergence between the confirmed $2.0B pre-money Series D valuation and unverified secondary
              marks of $3.2B to $5.76B, we maintain a research-more recommendation with a high risk rating and stretched
              valuation stance.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV010
      - number: '8.2'
        title: Financing History and Valuation Discrepancies
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent's verified corporate financing is anchored by its December 2, 2024 Series D round, which
              closed over $693M at a $2B pre-money valuation led by Samsung Securities and AFW Partners. Earlier
              verified rounds include a May 2021 Series C of over $200M at a $1B valuation. Across secondary and private
              market directories, reported total funding ranges from $1.18B to $2.46B, with pre-IPO platforms such as
              Forge Global recording Series E-1/E-2 corporate filings with a $5.76B post-money valuation at $81.08 to
              $111.23 per share, and institutional tear sheets noting an unverified $3.2B November 2025 mark. These
              divergent marks demonstrate significant multiple expansion without commensurate audited financial metrics.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
      - number: '8.3'
        title: Scenario Analysis and Critical Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              We evaluate Tenstorrent under three scenario cases spanning bull, base, and bear outcomes. The bull case
              requires mass-market commercial adoption of Blackhole and Galaxy systems with hyperscaler design wins and
              open-source compiler maturity, supporting exit valuations above $6B. The base case reflects modest
              enterprise and partner deployments (Samsung, Hyundai, LG) with recurring software IP licensing, justifying
              a $2.5B to $3.5B range. The bear case models software ecosystem friction, delayed tape-outs, and TSMC
              foundry supply constraints, triggering down-round risk below $1.5B. Primary diligence must resolve audited
              2025-2026 revenue run-rates, non-investor customer concentration, and BIS export control classification.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More at Stretched Valuation'
            body: >-
              While Tenstorrent possesses world-class chip architecture leadership under Jim Keller and strategic
              backing from major conglomerates, the lack of audited financial disclosures and significant valuation
              inflation in secondary datasets ($2.0B to $5.76B) dictates a research-more stance.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV008
          - type: callout
            title: Capital Intensity and Down-Round Exposure
            body: >-
              Semiconductor hardware fabrication requires sustained capital infusions. If developer friction or software
              compiler delays impede broad commercial monetization, future funding may require punitive liquidation
              structures or down-round revisions.
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
              - CV016
