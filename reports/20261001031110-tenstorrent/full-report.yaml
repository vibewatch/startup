  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Dual-Track Compute Architecture and Heterogeneous Interconnect
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent's computing architecture diverges from conventional monolithic GPU accelerators by decoupling
              general-purpose control and execution from dense tensor acceleration across modular silicon building
              blocks. At the foundation of its silicon design are two proprietary core architectures: high-performance
              Ascalon RISC-V CPU cores designed from scratch for host operating system execution, workload
              orchestration, and scalar logic, paired with proprietary Tensix AI cores optimized for deep learning
              operations. In the Grayskull accelerator generation, an array of 96 to 120 Tensix cores is interconnected
              via a custom double 2D torus Network-on-Chip (NoC), providing packetized multi-cast data movement with
              minimal host software scheduling overhead. Each individual Tensix core incorporates five single-issue
              'baby' RISC-V cores alongside a SIMD matrix and vector computational unit and 1 MB of dedicated local SRAM
              L1 memory. Within each core, two RISC-V cores are dedicated to asynchronous data movement—managing
              transfers between local SRAM, neighboring core SRAMs, and external LPDDR4 memory banks—while three compute
              RISC-V cores execute unpacking, math kernel execution, and packing. Communication between execution stages
              relies on circular buffers within SRAM, maximizing the spatial overlap between computation and
              communication while executing tensor operations as dataflow graphs.
