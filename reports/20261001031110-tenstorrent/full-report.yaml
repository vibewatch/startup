      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Export control is the clearest evidenced regulatory constraint: a current company job description
              explicitly makes employment contingent on eligibility to access controlled technology and describes
              possible licensing by the U.S. Commerce Department or another federal agency. An official privacy notice
              is publicly identifiable, but the fetched page does not establish the scope of controls, certifications,
              breach history, or data-processing obligations. Likewise, the successful adverse query allocated no
              litigation, enforcement, outage, breach, or complaint source to this chapter. That result is an evidence
              gap, not proof that no event exists. Investment committee clearance should therefore require management
              schedules covering export classifications and licenses, material disputes, IP freedom-to-operate, privacy
              controls, and security incidents rather than treating the public record as complete.
            claimRefs:
              - CR001
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR014
              - CR015
      - number: '7.3'
        title: Operational and software execution
        blocks:
          - type: paragraph
            body: >-
              The operating model combines proprietary hardware and software with Linux and other open-source packages,
              which increases version, packaging, compatibility, and support obligations. Tenstorrent was recruiting a
              specialist to build and release this stack for RISC-V and system-IP customers, while its public release
              feed describes golden-manifest pinning to catch package drift and progress-based detection for stuck
              training jobs. The same feed reports numerous correctness fixes across kernels, simulators, device I/O,
              firmware, and deployment tools. These disclosures demonstrate observability and remediation activity, but
              the assigned evidence supplies no fleet-level failure rate, service-level history, recall record, defect
              escape rate, or independent production reliability benchmark. A diligence gate should therefore test
              representative customer workloads against pinned releases and require defect, RMA, outage, and rollback
              histories before underwriting production-grade reliability.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: Dependencies, financial model, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Partner and financial exposure remain more weakly quantified than the technical risk. A 2023 leadership
              report framed the COO mandate around scaling the global partner ecosystem, revenue, and operations,
              showing that commercialization and coordination were explicit execution tasks. StartEngine later described
              a $693 million Series D at a $2.6 billion valuation and nearly $150 million in IP licensing contracts, but
              also stated that its company information was not independently verified. Tenstorrent's older announcement
              documents more than $200 million raised at a $1 billion valuation; neither funding figure is cash
              available, and the retained sources do not disclose current burn, runway, revenue, margins, working
              capital, or concentration. Thesis-break triggers are therefore measurable diligence failures: inability to
              produce current audited financials, material export-license blockage, repeated release rollback or
              correctness incidents, or a customer/supplier concentration schedule showing an unmitigated single point
              of failure.
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert source silence into a clean legal history
            body: >-
              The assigned adverse search produced no retained litigation, enforcement, outage, breach, or complaint
              source. That leaves the question unresolved; it does not support a statement that no such event occurred.
            calloutType: risk
            claimRefs:
              - CR015
          - type: callout
            title: Gate underwriting on evidence that changes the risk ranking
            body: >-
              Require export-control schedules, customer and supplier concentration, current audited financials, burn
              and runway, production incident metrics, and pinned-stack reliability results before reducing residual
              risk.
            calloutType: recommendation
            claimRefs:
