  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: AI Accelerator Landscape and Architectural Divergence
        blocks:
          - type: paragraph
            body: >-
              The artificial intelligence accelerator landscape in 2026 is defined by a fundamental bifurcation between
              dominant general-purpose GPUs and specialized inference architectures. Nvidia retains near-monopoly market
              share across high-performance model training and production inference, leveraging its Blackwell (B200,
              GB200) and Hopper (H100) product lines. AMD represents the primary merchant-silicon alternative, gaining
              measurable traction among hyperscalers with its Instinct MI300 and MI355 accelerators despite continuing
              software maturity gaps in ROCm. Beyond the incumbent duopoly, specialized inference startups including
              Groq, Cerebras, and SambaNova have raised billions to contest token-generation workloads using custom
              LPUs, wafer-scale engines, and reconfigurable dataflow architectures.


              Tenstorrent occupies a differentiated competitive posture within this landscape. Rather than building
              proprietary single-purpose accelerators, the company has deployed a hybrid business model that combines
              standalone silicon sales, turnkey cluster appliances, and licensable RISC-V processor intellectual
              property. Backed by over $2 billion in cumulative capital following a Series D round exceeding $693
              million at a $2 billion pre-money valuation, Tenstorrent positions its Blackhole architecture against
              Nvidia not on single-chip peak arithmetic throughput, but on sustained cluster-level memory bandwidth,
              cost per token, and an unencumbered open-source software stack.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
