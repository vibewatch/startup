        - An upstream change or incompatible release disrupts customer deployments.
        - High for production availability
        - Golden-version manifests and dedicated release packaging are evidenced.
        - >-
          Kill criterion: no reproducible software bill of materials, supported-version policy, or rollback-tested
          release baseline.
      - - '3'
        - External capital and private-market valuation marks
        - Equity investors and secondary-access vehicles
        - >-
          Historical funding and valuation figures are public, but cash available, burn, runway, and current operating
          metrics are not.
