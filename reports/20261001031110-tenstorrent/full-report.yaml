      - number: '2.3'
        title: Buyer Segmentation, Workload Drivers, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Adoption of Tenstorrent's Galaxy systems and processor IP follows three primary buyer profiles, each
              driven by distinct economic and geopolitical pressures. First, neoclouds and inference-first operators
              (such as Cirrascale, ai&, and Turiyam) seek alternatives to GPU pricing bottlenecks, targeting
              token-generation economics claimed at $6 per million tokens for mixture-of-experts architectures such as
              DeepSeek-671B. Second, sovereign AI programs and national infrastructure initiatives in jurisdictions
              including India and Japan deploy Tenstorrent to secure hardware sovereignty and auditability, avoiding
              sole-source dependence on US GPU platforms and proprietary closed software. Third, automotive and consumer
              electronics OEMs (such as Hyundai Motor Group and LG Electronics) license Ascalon and Tensix IP for custom
              silicon programs. However, material adoption constraints persist: Nvidia CUDA's fifteen-year developer
              moat creates significant switching frictions, independent production-scale benchmark validation remains
              thin, and Tenstorrent's primary focus on inference leaves full-lifecycle training customers tied to
              established GPU incumbents.
