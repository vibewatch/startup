              - CU002
              - CU003
              - CU005
      - number: '6.2'
        title: Named Customer Proof and Production Workloads
        blocks:
          - type: paragraph
            body: >
              Customer adoption evidence is concentrated in specific production use cases demonstrated at Tenstorrent's
              TT-Deploy event [CU001, CU002]. In real-time AI media generation, Prodia achieved 720p 81-frame video
              generation in 2.4 seconds running on a Tenstorrent Galaxy supercluster, representing a 10x improvement
              over conventional GPU setups per benchmark reporting [CU002, CU004]. In large-scale language model
              inference, Tenstorrent demonstrated DeepSeek-R1-0528 671B decode throughput reaching 308 to 350+ tokens
              per second per user at an estimated $6 per million output tokens [CU001, CU002]. In distributed
              infrastructure, Equinix integrates Tenstorrent Galaxy systems into its Distributed AI Hub alongside
              OrionVM cloud orchestration and BetterBrain application layers [CU001, CU002]. In sovereign computing, ai&
              operates Japan's largest Tenstorrent hardware installation, while Turiyam deploys inference clusters in
              India [CU001, CU002]. In quantitative financial services, Virtu Financial evaluates on-premises agentic
              solutions for automated trading workflows [CU002]. While these customer engagements confirm physical
              hardware delivery, independent verification of sustained operational economics across non-sponsored
              deployments remains thin [CU005].
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
