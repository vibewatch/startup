  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Architecture, and Monetization Models
        blocks:
          - type: paragraph
            body: >
              Tenstorrent structures its commercial monetization around a hybrid revenue architecture encompassing three
              primary avenues: standalone AI accelerator processor cards and server appliances, high-density cluster
              systems, and licensable processor intellectual property (IP). In the hardware segment, the company offers
              entry-level PCIe accelerator boards (historically Grayskull, transitioning to Wormhole and Blackhole),
              developer workstations, and scalable datacenter rack units. Hardware revenue follows standard
              semiconductor shipment recognition upon customer delivery and acceptance. In parallel, Tenstorrent
              commercializes full-rack Galaxy computing topologies designed for hyperscale AI inference and
              mixture-of-experts model deployment.


              Complementing physical hardware shipments, Tenstorrent pursues an IP licensing strategy spanning its
              proprietary RISC-V CPU cores (such as the Ascalon microarchitecture) and Tensix neural processing unit
              (NPU) accelerators. This dual-track approach mirrors hybrid semiconductor models where foundational IP
              licenses provide upfront licensing fees and downstream per-device royalty streams, while hardware cards
              capture near-term developer mindshare and enterprise datacenter budgets. However, list pricing is publicly
              observable only for entry-level developer boards ($599 to $799 range), whereas enterprise Galaxy systems,
              multi-year software maintenance contracts, and multi-million-dollar IP licensing arrangements are
              negotiated on a custom, confidential basis with non-standard discounting and foundry integration terms.
            claimRefs:
