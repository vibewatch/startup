  - id: FR001
    title: Risk heatmap with evidence-bounded likelihood
    type: matrix
    summary: >-
      Impact is assessed conditionally, while likelihood remains unquantified wherever the assigned evidence supplies no
      incident or exposure denominator.
    data:
      columns:
        - Impact if realized
        - Likelihood
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Export-control access
          values:
            - label: High
              detail: Key technical staffing or technology access can require eligibility or licensing.
            - label: Unquantified
              detail: No license volume, denial rate, or affected-role denominator was disclosed.
            - label: Partial
              detail: Employment screening is evidenced; classification and license coverage are not.
            - label: High / unknown
              detail: Clear only after review of ECCNs, licenses, and the technology-control plan.
        - label: Release and package drift
          values:
            - label: High
              detail: Incompatible software can block supported customer deployments.
            - label: Unquantified
              detail: No customer upgrade-failure or rollback rate was available.
            - label: Developing
              detail: Golden manifests and specialist release ownership are visible.
            - label: Material
              detail: Requires release SLOs, supported-version matrices, and rollback evidence.
        - label: Runtime and correctness defects
          values:
            - label: High
              detail: Hangs or silent numerical errors can invalidate production workloads.
            - label: Unquantified
              detail: Public fixes do not provide a fleet denominator or defect escape rate.
            - label: Active
              detail: Release notes show detection, simulator, testing, and remediation work.
            - label: High / unknown
              detail: Requires independent parity and production reliability results.
        - label: Finance-control scaling
          values:
            - label: Material
              detail: Weak controls can impair reporting, procurement, and capital allocation.
            - label: Unquantified
              detail: A role description identifies needs but not control failures.
            - label: Building
              detail: The company is recruiting ownership for controls, KPIs, and corrective actions.
            - label: Material
              detail: Requires audited financials and control-effectiveness testing.
        - label: Partner and global execution
          values:
            - label: High
              detail: Commercial scaling can fail if ecosystem and operating capacity lag.
            - label: Unquantified
              detail: Counterparty concentration and deployment denominators are unavailable.
            - label: Leadership owner visible
              detail: The COO mandate included partners, revenue, and global operations.
            - label: High / unknown
              detail: Requires named deployments, renewals, and concentration schedules.
        - label: Financial durability
          values:
            - label: High
              detail: Semiconductor development and commercialization require sustained capital.
            - label: Unquantified
              detail: Current cash, burn, runway, revenue, and margins were not disclosed.
            - label: Historical funding only
              detail: Funding raised and private valuation marks do not establish cash available.
            - label: High / unknown
              detail: Requires a current cash bridge, burn history, runway, and financing plan.
    approximationNotes: >-
      Ordinal impact and mitigation labels are analyst assessments tied to cited evidence; no numeric probability, loss
      amount, or risk score is implied.
