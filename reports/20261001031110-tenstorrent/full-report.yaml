      - number: '5.3'
        title: Energy Efficiency Advantages, Software Bring-Up, and Export Control Exposure
        blocks:
          - type: paragraph
            body: >-
              Independent academic characterization of the Grayskull e75 accelerator on dense matrix multiplication
              (MatMul) kernels demonstrates that while incumbent NVIDIA datacenter GPUs maintain a substantial lead in
              absolute raw floating-point throughput, Tenstorrent's spatial Tensix architecture achieves a highly
              competitive efficiency profile, peaking at 1.55 TFLOPs/Watt under BF16 reduced numerical precision.
              However, this architectural efficiency is accompanied by acute technical friction points. First-run kernel
              execution is heavily penalized by runtime matrix tiling and JIT compilation overhead, which account for
              31% and 66% of initial execution time respectively, shifting to host-to-device data transfer dominance
              (62%) only on warm subsequent runs. Furthermore, Tenstorrent's transition to multi-die System-in-Package
              products introduces severe physical design and packaging complexity, requiring cross-die bump planning,
              PAM-3 signaling interfaces for high-speed GDDR7 memory, and configurable NoC routing across AI, CPU,
              memory, and I/O chiplet domains. Crucially, because Tenstorrent develops advanced high-performance
              computing silicon across North American sites, engineering hiring records indicate that key physical
              design and software architecture positions require strict compliance with U.S. Export Administration
              Regulations (EAR), restricting foreign national staffing from EAR Country Groups D:1, E1, and E2 without
              federal export licensing.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decoupled Data Movement and Compute within the Tensix Tile
            body: >-
              Tenstorrent's microarchitectural efficiency stems from assigning dedicated baby RISC-V cores to
              asynchronous data movement separate from the SIMD compute engine within every Tensix core. By isolating
              DRAM and SRAM transfers from math execution, the hardware effectively hides memory latency behind
              continuous matrix computation.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Compilation and First-Run Cold Latency Headwinds
            body: >-
              Independent benchmarking indicates that matrix tiling and JIT compilation consume up to 97% of total
              execution time during first-run operations. For dynamic, short-lived, or frequently changing model
              architectures, compilation overhead represents a meaningful barrier to out-of-the-box developer adoption
              compared to mature GPU toolchains.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
          - type: callout
            title: Export Licensing and High-Level Engineering Talent Constraints
            body: >-
              Because Tenstorrent develops advanced AI accelerators and high-performance RISC-V CPUs across Santa Clara
              and Austin facilities, critical design positions fall under U.S. Export Administration Regulations (EAR),
              restricting foreign nationals from D:1, E1, and E2 country groups and complicating cross-border R&D
              scaling.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >
              Tenstorrent targets three primary customer segments across high-performance AI inference infrastructure
              [CU001]. The first tier comprises neoclouds and inference-first service providers such as Cirrascale in
              North America, ai& in Japan, and Turiyam in India, who seek alternatives to GPU hyperscaler pricing and
              architecture [CU001, CU002]. These infrastructure operators deploy Tenstorrent Galaxy Blackhole compute
              servers to deliver raw AI inference and video generation capacity at predictable total cost of ownership
              [CU002, CU003]. The second segment addresses sovereign AI and national computing initiatives, where
              regional governments and domestic champions utilize RISC-V compute coupled with Equinix colocation hubs to
              avoid proprietary US hyperscaler lock-in [CU001, CU002]. The third segment spans latency-critical
              enterprise workloads, illustrated by quantitative trading research at Virtu Financial and AI media
              pipelines at Prodia [CU002, CU004]. However, broad enterprise buyers with long procurement cycles remain
              largely untapped outside these specialized categories [CU005].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
