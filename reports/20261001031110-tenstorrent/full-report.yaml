      - number: '2.2'
        title: Sizing Lenses, Valuation Anchors, and Acquisition Hypotheses
        blocks:
          - type: paragraph
            body: >
              Quantifying Tenstorrent's total and serviceable addressable market requires synthesizing multi-tier
              hardware expenditure, licensable IP royalties, and strategic semiconductor M&A valuations. While overall
              generative AI hardware spending represents an expansive multi-hundred-billion-dollar wave, the specialized
              AI inference accelerator segment forms the relevant serviceable boundary where heterogeneous silicon
              alternatives can win. Tenstorrent's private funding history benchmarks this market opportunity: the
              company raised over $200 million at a $1.0 billion valuation in 2021, secured $693 million in Series D
              capital at a $2.0 billion pre-money and $2.6 billion post-money valuation in December 2024, and was
              reported in late 2025 in talks for an $800 million Series E round at a $3.2 billion pre-money valuation.
              Further validating the strategic value of inference silicon and RISC-V IP, M&A reporting in mid-2026
              indicated early takeover interest from Intel and Qualcomm valuing Tenstorrent between $5.0 billion and
              $10.0 billion, although Qualcomm's existing IP assets created skepticism around justifying an $8 billion
              to $10 billion price tag.
