  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Segmentation, and Structural Spend Definition
        blocks:
          - type: paragraph
            body: >
              The addressable landscape for Tenstorrent divides into two distinct commercial arenas: dedicated
              data-center AI inference infrastructure and licensable semiconductor processor intellectual property (IP).
              In the infrastructure domain, Tenstorrent's Galaxy systems target the expanding inference workload
              category, intentionally isolating inference compute from the capital-intensive training market dominated
              by Nvidia CUDA architectures. Included spend spans enterprise and hyperscaler inference clusters, neocloud
              capacity, and sovereign AI compute deployments utilizing standard Ethernet networking and GDDR6 DRAM
              rather than proprietary High Bandwidth Memory (HBM). Excluded spend comprises frontier foundation-model
              pre-training clusters that require tightly coupled HBM pipelines and mature full-lifecycle toolchains. In
              the licensable IP domain, Tenstorrent licenses its Ascalon RISC-V CPU cores and Tensix AI accelerator
              cores to external semiconductor designers, capturing chip design budgets across automotive, consumer
              electronics, and edge compute.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
