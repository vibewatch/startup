      - number: '3.3'
        title: Inference Economics, Packaging, and Cloud Friction
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent's commercial proposition hinges on structural inference cost disruption. The company claims a
              5x total cost of ownership (TCO) advantage over Nvidia GPU infrastructure on long-context reasoning
              models, demonstrating over 350 tokens per second per user on DeepSeek R1 671B at an operating cost of
              approximately $6 per million tokens compared to an estimated $30 per million tokens on equivalent Nvidia
              hardware. At the system level, a Galaxy Blackhole rack lists at $110,000, while developer evaluation
              boards retail at $999 for the p100 and $1,399 for the p150, offering accessible physical evaluation
              hardware.


              Despite compelling silicon economics, Tenstorrent faces substantial distribution friction. Galaxy systems
              remain absent from major hyperscaler cloud marketplaces as of mid-2026. While enterprise buyers can
              provision Nvidia instances on demand across AWS, Azure, GCP, and specialized GPU clouds at hourly rates,
              evaluating Tenstorrent requires physical appliance procurement, colocation via partners like Equinix, or
              nascent neocloud deployments. This friction elevates trial costs for risk-averse enterprise infrastructure
              teams.
            claimRefs:
              - CP004
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP010
      - number: '3.4'
        title: Ecosystem Lock-in, Software Maturity, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The decisive battleground in AI acceleration remains software ecosystem breadth. Nvidia's competitive moat
              is sustained by twenty years of CUDA compiler optimization, highly tuned kernel libraries, and a global
              developer workforce trained exclusively on CUDA abstractions. Any hardware alternative faces severe
              switching friction unless its software toolchain can seamlessly execute PyTorch models without manual
              kernel rewriting.


              Tenstorrent has committed to a fully open-source software stack comprising the TT-Metalium programming
              model, the TT-NN operator library, and the TT-Forge MLIR compiler. However, third-party technical
              evaluations—including a December 2025 assessment of the QuietBox workstation—have characterized the
              software ecosystem as immature and deficient relative to commercial production requirements. While
              Tenstorrent's intellectual property licensing partnerships with LG Electronics and Hyundai Motor Group
              provide non-datacenter revenue hedges, durable displacement of Nvidia in the enterprise datacenter
              requires closing the software stability gap before incumbent GPU roadmaps erode Tenstorrent's token-cost
              advantage.
            claimRefs:
              - CP005
              - CP009
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Hardware and IP Licensing Model Mitigates Pure-Play Fabless Risk
            body: >-
              Unlike pure-play chip rivals like Groq and Cerebras that depend exclusively on system or cloud token
              sales, Tenstorrent's dual monetization model licenses Tensix AI cores and Ascalon RISC-V CPU IP to
              industrial giants including LG and Hyundai. This creates recurring licensing revenue while datacenter
              Galaxy traction matures.
            calloutType: insight
            claimRefs:
              - CP001
              - CP014
          - type: callout
            title: Software Toolchain Maturity Lags Commercial Production Demands
            body: >-
              Despite architectural advantages in memory bandwidth and token economics, independent evaluations have
              highlighted severe software ecosystem deficits. Without production-grade serving infrastructure and
              frictionless CUDA translation, enterprise buyers default to established GPU platforms.
            calloutType: risk
            claimRefs:
