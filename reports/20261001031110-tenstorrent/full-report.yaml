      - number: '5.2'
        title: Silicon Modules, Chiplet Systems, and Developer Workflow Surfaces
        blocks:
          - type: paragraph
            body: >-
              Tenstorrent packages its compute intellectual property into multiple commercial form factors ranging from
              PCIe accelerator cards to modular System-in-Package (SiP) chiplet assemblies and multi-node compute
              systems. The hardware lineup spans the first-generation Grayskull processor family (such as the Grayskull
              e75 and e150 bus-powered PCIe cards delivering up to 368 TOPS with conditional execution) through the
              higher-density Wormhole and Galaxy multi-chip systems. In parallel, Tenstorrent licenses foundational IP
              blocks—including Ascalon RISC-V CPU cores and Tensix AI processing clusters—to third-party silicon
              designers building sovereign or domain-specific chips under the Open Chiplet Architecture (OCA) standard.
              For software practitioners, Tenstorrent exposes an end-to-end development workflow through its
              documentation and open-source GitHub repositories. Developers interact with hardware via TT-Metalium (the
              low-level kernel programming model exposing direct control of Tensix cores, L1 circular buffers, and NoC
              routing), the TT-NN operator library providing PyTorch-style functional APIs, and the TT-Forge MLIR-based
              compiler supporting frontends including PyTorch, JAX, and ONNX. The platform supports cloud
              experimentation via browser-accessible consoles and integrates with inference serving runtimes like vLLM
              and tt-inference-server.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
