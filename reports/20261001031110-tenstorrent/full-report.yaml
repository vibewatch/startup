        - Commercial and global operating ecosystem
        - Partners, customers, and regional operations
        - COO mandate to scale partners, revenue, and operations is documented; concentration percentages are not.
        - Commercialization outpaces support, legal, or operating capacity.
        - High if deployments or revenue depend on a small number of counterparties
        - Senior operating ownership is evidenced.
