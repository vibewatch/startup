      - number: '6.3'
        title: Commercial Durability, Retention, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Tenstorrent faces structural customer concentration and durability challenges typical of frontier silicon
              challengers [CU005, CU006]. Early anchor references remain heavily correlated with corporate strategic
              investors, including historic backing from Samsung, LG Electronics, and Hyundai Motor Group, alongside
              major institutional rounds totaling over $2B in capital [CU007, CU008]. Independent design wins among
              non-investor hyperscalers or Fortune 500 enterprises have not been publicly disclosed [CU005, CU006].
              Because Galaxy Blackhole volume shipments only commenced in 2026, standard software and hardware metrics
              such as net revenue retention, gross revenue retention, and renewal rates cannot yet be determined from
              public disclosures [CU006, CU009]. Furthermore, developer adoption depends heavily on open-source
              toolchain maturity, where Tenstorrent claims 90% Hugging Face model compatibility and automated CUDA
              kernel migration via TT-Lang [CU001, CU002]. Enterprise buyers facing high migration switching costs from
              NVIDIA CUDA continue to view RISC-V software ecosystem depth as a primary barrier to mainstream adoption
              [CU005, CU010]. Finally, speculative acquisition interest from semiconductor incumbents like Qualcomm
              underscores strategic IP value while highlighting commercial stand-alone execution risks [CU011, CU012].
            claimRefs:
              - CU005
