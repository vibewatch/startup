      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Software Integration Drag
        blocks:
          - type: paragraph
            body: >
              The cost profile of Tenstorrent's physical product portfolio is dictated by fabless semiconductor
              manufacturing economics, advanced memory packaging, and heavy ongoing software engineering overhead.
              Unlike conventional GPUs that incorporate expensive High Bandwidth Memory (HBM) and proprietary
              chip-on-wafer substrates, Tenstorrent's hardware architecture utilizes commodity GDDR6 memory and standard
              Ethernet interconnects to restrain direct bill-of-materials (BOM) expenses. For raw silicon fabrication
              and packaging, the company relies on third-party commercial foundry partners, including contract
              manufacturing relationships across TSMC and Samsung Electronics.


              Hardware gross margins for custom AI accelerators typically span 45% to 60% at mature volume, while pure
              IP licensing yields nominal gross margins exceeding 85% to 90% offset by specialized customer engineering
              support. However, Tenstorrent faces substantial software friction that directly impacts realized unit
              economics and sales conversion velocity. As independent technical community assessments indicate, AI
              accelerator silicon with novel execution models requires extensive compiler optimization, kernel
              libraries, and framework integration before matching standard CUDA developer velocity. Engineering
              compensation for compilers, MLIR frameworks, and low-level kernel runtimes represents a major ongoing
              operational expenditure that depresses operating margins during commercial ramp phases.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
