  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Priority risk portfolio
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is execution across a wide hardware-software surface under export-control
              constraints. Tenstorrent's own recruiting language says access to U.S. export-controlled technology can
              depend on citizenship, residency, or prior license approval, creating a documented mechanism for staffing
              delay or offer rescission rather than a merely theoretical regulatory concern. The company-controlled
              software surfaces also show a broad repository estate and frequent fixes involving dependency drift,
              stuck-job detection, timeouts, race conditions, and numerical correctness. These are positive signs of
              active remediation, but they also indicate continuing integration and release-management burden.
              Likelihood is not quantified by the assigned evidence, so the matrix deliberately separates potentially
              high impact from unknown probability and treats mitigation maturity as partial where only hiring, release
              notes, or public tooling are visible.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR008
