evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-and-commercial-metrics
    missingEvidence: Audited revenue, ARR, gross margin, cash balance, customer count, retention, and committed backlog.
    whyItMatters: >-
      Without consistent financial and customer denominators, funding cannot be translated into operating efficiency or
      commercial traction.
    diligencePath: >-
      Obtain audited financial statements, bank statements, customer schedules, signed backlog, and revenue-recognition
      policies from the company data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: corporate-scale
    missingEvidence: Primary confirmation of headquarters, cumulative capital raised by instrument, and a dated employee roster.
    whyItMatters: >-
      The source conflicts are too large to use a single location, funding total, or headcount as an audited cover
      metric.
    diligencePath: >-
      Reconcile corporate registry extracts, financing closing documents, capitalization records, and payroll reports as
      of the run date.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: Complete board roster, control persons, executive biographies, succession plans, and founder ownership.
    whyItMatters: >-
      The public leadership list cannot establish governance independence, voting control, or resilience to key-person
      loss.
    diligencePath: >-
      Request the current board and officer register, governance documents, employment agreements, succession plan, and
      fully diluted capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-map
    missingEvidence: >-
      Complete shareholder register, Series E participants, ownership percentages, board rights, and debt or credit
      terms.
    whyItMatters: Named investors do not reveal control, liquidation preference, dilution, debt burden, or capital still available.
    diligencePath: >-
      Review the fully diluted cap table, stock purchase agreements, debt schedules, side letters, and Series E closing
      documents.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-and-regulatory-record
    missingEvidence: Independent legal, regulatory, outage, security-incident, sanctions, and employment-dispute records.
    whyItMatters: >-
      The assigned pool contains an operational critique but does not support a conclusion that material adverse events
      are absent.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, sanctions, security-incident, and employment-record searches and
      obtain counsel confirmation.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: commercial-revenue-and-sam
    missingEvidence: >-
      Audited financial statements confirming Tenstorrent's 2025 and 2026 annual recurring revenue (ARR), system
      shipment volume, and gross margin.
    whyItMatters: >-
      Without verified commercial revenue, calculating precise Serviceable Addressable Market (SAM) capture and
      operating cash burn remains speculative.
    diligencePath: >-
      Obtain confidential financial diligence disclosure or auditor-verified revenue disclosures during formal
      investment review.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: >-
      Independent third-party MLPerf benchmark submissions comparing Tenstorrent Galaxy Blackhole to Nvidia H100/B200
      under production serving overhead.
    whyItMatters: >-
      Current throughput and TCO claims derive from vendor demonstration runs rather than standardized third-party
      audits with production queuing and serving layers.
    diligencePath: >-
      Audit forthcoming MLPerf Inference suite results or execute independent multi-user latency/throughput benchmarks
      on leased Galaxy hardware.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: revenue-run-rate
    missingEvidence: >-
      Audited financial statements confirming Tenstorrent's FY2024 and FY2025 revenue run rate, hardware shipment
      volumes, and IP licensing fee breakdown.
    whyItMatters: >-
      Without verified GAAP revenue and forward booking figures, valuation multiples and commercial growth trajectory
      cannot be reliably underwritten.
    diligencePath: >-
      Obtain confidential management financial pack, revenue recognition schedules, and customer audit reports during
      confirmatory diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway-and-gross-margins
    missingEvidence: >-
      Realized product-level gross margins across card and rack shipments, current cash balance, and monthly operating
      burn rate schedule.
    whyItMatters: >-
      Hardware gross margins dictate long-term capital intensity and determine whether current cash reserves provide
      sufficient runway before another capital raise.
    diligencePath: Request 24-month historical cash flow statements, fab wafer pricing commitments, and BOM cost teardowns under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: production-chiplet-yield
    missingEvidence: >-
      Empirical silicon die yield, packaging test results, and thermal dissipation metrics for multi-chiplet SiP
      implementations.
    whyItMatters: >-
      Multi-chiplet packaging with GDDR7 and D2D links is the core commercial architecture for Wormhole and Galaxy
      datacenter systems.
    diligencePath: Request foundry test reports, packaging assembly yield summaries, and silicon qualification data under NDA.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - id: null
    type: missing-source
    severity: material
    topic: blackhole-independent-benchmarks
    missingEvidence: Third-party peer-reviewed MLPerf or LLM serving benchmark results for production Blackhole silicon.
    whyItMatters: >-
      Public empirical benchmarking is currently limited to Grayskull e75 academic research, leaving forward Blackhole
      performance unverified by third parties.
    diligencePath: >-
      Review independent customer benchmark runs on production Blackhole PCIe cards across standard Llama/Mistral
      models.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-nrr
    missingEvidence: >-
      Audited customer renewal rates, net revenue retention (NRR), gross retention, and annual contract value (ACV)
      distributions.
    whyItMatters: >-
      Without retention and churn data, it is impossible to evaluate whether early deployments represent enduring
      commercial revenue or one-off pilot hardware purchases.
    diligencePath: >-
      Request confidential customer cohort retention tables, customer account counts, and ACV breakdown during private
      management diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - id: EGU002
    type: missing-source
    severity: material
    topic: named-customer-enumeration
    missingEvidence: >-
      Comprehensive registry of all paying commercial production customers, contracted cluster capacities, and
      non-investor enterprise accounts.
    whyItMatters: >-
      Public customer references are limited to TT-Deploy launch partners; broader enterprise adoption depth remains
      unverified.
    diligencePath: Verify customer references with independent enterprise buyers not affiliated with strategic corporate investors.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: legal-and-incident-history
    missingEvidence: >-
      Current litigation, regulator, IP, privacy, safety, recall, outage, breach, and complaint schedules across
      operating jurisdictions.
    whyItMatters: >-
      The assigned adverse query yielded no allocated source, so neither the existence nor absence of material matters
      can be established.
    diligencePath: >-
      Obtain counsel letters, regulator correspondence, claims schedules, freedom-to-operate work, incident logs,
      insurance notices, and board risk reports, then reconcile them to independent docket and regulator searches.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-durability
    missingEvidence: >-
      Current audited revenue, gross margin, operating loss, cash available, monthly burn, runway, working capital,
      committed capital, and financing obligations.
    whyItMatters: >-
      Funding raised and private valuation marks do not establish cash available or the durability of a
      capital-intensive semiconductor model.
    diligencePath: >-
      Review audited statements, monthly management accounts, bank statements, the cash bridge, cap table, debt and
      preference terms, budget variance, and the board-approved financing plan.
    relatedQuestionRefs:
      - QR006
      - QR007
      - QR008
  - type: private-evidence-only
    severity: material
    topic: dependency-concentration
    missingEvidence: >-
      Supplier, foundry, software, partner, distributor, and customer concentration with contract terms, substitution
      lead times, and production-versus-pilot status.
    whyItMatters: >-
      Public descriptions of partnerships and software breadth do not reveal whether a single counterparty can interrupt
      supply, deployment, or cash generation.
    diligencePath: >-
      Obtain top-counterparty schedules, foundry and packaging agreements, bills of materials, renewal data, pipeline
      stages, contingency plans, and tested second-source qualification records.
    relatedQuestionRefs:
      - QR005
      - QR007
      - QR008
  - type: missing-source
    severity: material
    topic: production-reliability
    missingEvidence: >-
      Independent fleet-level uptime, defect escape, numerical parity, rollback, RMA, recall, and customer incident
      metrics with denominators.
    whyItMatters: >-
      Release notes demonstrate fixes and mitigation activity but cannot quantify the frequency or customer impact of
      production failures.
    diligencePath: >-
      Reproduce representative workloads on pinned stacks, inspect incident and rollback histories, and interview named
      production customers using independently selected references.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR007
      - QR008
