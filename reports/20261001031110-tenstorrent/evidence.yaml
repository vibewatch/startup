    severity: material
    topic: audited-revenue
    missingEvidence: Audited financial statements confirming calendar 2025 and 2026 GAAP revenue, gross margin, and cash burn rate.
    whyItMatters: Without audited top-line figures, valuation multiples cannot be reliably compared to public semiconductor peers.
    diligencePath: Obtain management presentation or data room access under NDA during confirmatory diligence.
    relatedQuestionRefs:
      - QV006
  - type: missing-source
    severity: material
    topic: secondary-liquidity
    missingEvidence: >-
      Confirmed trade execution logs and transaction volumes behind the August 2026 Series E-1/E-2 certificate of
