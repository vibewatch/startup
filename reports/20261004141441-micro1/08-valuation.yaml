chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence supports a research-more stance rather than an investable price target. A third-party $4 billion private mark and rapid gross run-rate growth are notable, but inconsistent gross-to-net reporting, undisclosed financing terms, and weakly comparable benchmarks prevent a reliable equity-return case."
sections:
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The thesis is that micro1 has repositioned around expert data, model training, and
      agent evaluation just as TechCrunch reports gross annual run rate rising from
      $100 million to $500 million in eight months. The same reporting identifies
      reusable data with 80% to 90% gross margins and compares micro1 with larger
      gross-run-rate peers, suggesting both demand and a path to better unit economics.
      The anti-thesis is equally material: the source's statement that micro1 retains
      60% to 70% of gross does not reconcile arithmetically with its stated $150 million
      to $200 million net run rate. This inconsistency, together with an independently
      reported $4 billion private mark, makes any net-revenue multiple unreliable until
      management supplies reconciled financial statements.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >-
      The recommendation is Research More, with medium confidence, high risk, and a
      valuation stance of Unsupported at the reported price. Multiples reports a
      September 2026 valuation of $4 billion and a financing above $100 million, while
      TechCrunch had reported only that a newer round may have occurred at a
      significantly higher valuation than the 2025 Series A. Using the separately
      reported $500 million gross run rate produces an approximately 8.0x gross
      run-rate reference, not a revenue or ARR multiple. It cannot establish common
      equity value because cash balance, burn, preference seniority, option dilution,
      and the fully diluted cap table are absent from the assigned evidence. Entry
      discipline should therefore be tied to verified terms and reconciled economics,
      not to the headline private mark.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenarios-comparables-and-exit"
    title: "Scenarios, Comparables, and Exit Readiness"
    body: >-
      Public evidence does not support precise bull, base, or bear valuation ranges, so
      the scenarios are framed as diligence-dependent decision conditions rather than
      invented forecasts. The bull condition requires the $500 million gross run rate
      to reconcile to durable net revenue and company-wide margin expansion; the base
      condition assumes demand persists but leaves the $4 billion price unsupported;
      the bear condition is triggered by slower growth, margin pressure, or financing
      terms that subordinate new common equity. Multiples' public-company and private
      benchmark set spans unlike business models and exceptionally wide revenue
      multiples, so it is directional rather than a clean comp set. Tracxn reports no
      acquisitions by micro1, and the evidence provides no IPO timetable, secondary
      liquidity data, or strategic-buyer indications. Exit readiness and target returns
      remain material diligence gaps.
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
