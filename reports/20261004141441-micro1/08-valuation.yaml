      - "CV006"
      - "CV013"
      - "CV014"
      - "CV015"
  - id: "TV002"
    title: "Thesis and Anti-Thesis"
    columns:
      - "Side"
      - "Argument"
      - "Evidence"
      - "What would change the view"
    rows:
      - - "Thesis"
        - "Demand and commercial velocity"
        - "TechCrunch reports gross annual run rate growing from $100M to $500M in eight months."
        - "The view weakens if reconciled billings show lower growth or concentrated, non-recurring programs."
      - - "Thesis"
        - "Potential margin expansion"
        - "A person familiar with the company told TechCrunch reusable off-the-shelf data can carry 80%-90% gross margins."
        - "The view strengthens only if audited segment reporting shows those margins at material company-wide scale."
      - - "Anti-thesis"
        - "Unreliable net-economics baseline"
        - "The same article's 60%-70% retention statement does not reconcile with its $150M-$200M net run-rate statement."
        - "A gross-to-net bridge and recognized-revenue schedule would resolve the inconsistency."
      - - "Anti-thesis"
        - "Scale and pricing risk"
        - "TechCrunch reports Mercor at $2B and Handshake at $1B of gross annualized revenue, above micro1's reported level."
        - "Durable customer retention, differentiated datasets, and verified margin expansion would reduce this risk."
    notes: "The table preserves TechCrunch's metric labels and internal inconsistency; gross annual run rate, net annual run rate, recognized revenue, and ARR are not treated as interchangeable."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV010"
      - "CV011"
  - id: "TV003"
    title: "Bull, Base, and Bear Decision Scenarios"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Key risks or triggers"
      - "Probability signal"
    rows:
      - - "Bull"
        - "Reported growth reconciles to durable net revenue; reusable data becomes a material high-margin mix; customer concentration is acceptable."
        - "A valuation range is not supportable until verified net revenue and financing terms permit a like-for-like multiple."
        - "Fails if high-margin data remains immaterial or gross-to-net economics cannot be reconciled."
        - "Upside signal: verified retention, margin, and diversified-customer evidence."
      - - "Base"
        - "AI-data demand remains strong, but contractor-heavy delivery persists and the newest private mark remains unverified."
        - "At the reported $4B mark, public evidence does not establish a target return or defensible common-equity price."
        - "Price discipline remains the controlling variable; hold period and exit route are unknown."
        - "Neutral signal: continued growth without audited economics or liquidity evidence."
      - - "Bear"
        - "Growth slows, margin expansion does not materialize, or preferred terms place common equity behind senior claims."
        - "Downside cannot be quantified from public evidence, but multiple compression or a down round would impair common equity."
        - "Triggers include net-revenue shortfall, customer loss, adverse preferences, or reduced AI-data spend."
        - "Downside signal: financing opacity persists while operating growth decelerates."
    notes: "These are conditional scenarios, not forecasts; no probabilities, valuation ranges, target returns, hold periods, or exit values are assigned because the necessary private financial and capitalization inputs are unavailable."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
