      - - "Valuation stance"
        - "Unsupported at reported price"
        - "The rough 8.0x reference uses gross run rate and cannot be presented as a revenue or ARR multiple."
        - "Set price only after reconciling net revenue, dilution, preferences, cash, and burn."
    notes: "Assessments use only assigned public evidence as of 2026-10-04; the 8.0x figure divides a separately reported $4B private mark by a separately reported $500M gross annual run rate and is not an accounting revenue multiple."
    claimRefs:
