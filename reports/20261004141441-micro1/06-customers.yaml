schemaVersion: "report-v2"
artifact: customers
slug: micro1
runDate: 2026-10-04
company:
  name: micro1
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to strong demand and expanding contract sizes for micro1's AI-data
    work, but the available scale metrics are run-rate measures rather than customer counts or
    retention indicators. Named deployment proof is thin, so customer durability and
    concentration remain material diligence gaps.
sections:
  - id: customer-structure
    title: Customer structure and use cases
    body: >-
      micro1 presents two distinct demand surfaces. Its current company positioning centers on
      enterprises and AI labs that need expert-generated training data, evaluations, and feedback
      loops; the cited expert domains include finance, healthcare, and STEM engineering. A
      co-authored Drata article narrows the enterprise workflow further: customers define rubrics,
      success criteria, and failure taxonomies, while micro1 supplies expert review and targeted
      data. Separately, independent directory coverage describes Zara as a structured,
      asynchronous recruiting product for high-volume screening. These are different buying
      motions with different users and proof standards. Contributors are a supply-side population,
      not customers, and the social-media claim of hundreds of thousands of contributors therefore
      cannot establish customer count or account penetration.
    claimRefs: [CU001, CU002, CU003, CU009, CU011]
    tableRefs: [TU001]
  - id: adoption-and-scale
    title: Adoption and commercial scale signals
    body: >-
      The strongest external adoption signal is TechCrunch's report that gross annual run rate
      increased from $100 million to $500 million over eight months. The same article estimated
      net annual run rate at $150 million to $200 million after a reported 60% to 70% retained
      share and said contract sizes were growing at an accelerated pace. These figures indicate
      demand and commercial expansion, but they are not audited revenue, ARR, customer counts, or
      cohort measures. They also do not reveal whether growth came from more customers, larger
      projects, pass-through contractor spend, or a small number of expanding accounts. The
      contributor-network claim and a closed contractor posting show delivery capacity and active
      workflow recruitment, not buyer adoption.
    claimRefs: [CU004, CU005, CU006, CU009, CU010]
    tableRefs: [TU002]
  - id: proof-and-durability
    title: Named proof, outcomes, and durability
    body: >-
      The retained evidence does not provide a named, outcome-bearing AI-data customer case study.
      Drata is named in a co-authored operating narrative, but the page presents complementary
      roles rather than identifying Drata as a paying micro1 customer. Remote OK reproduces a
      closed role for an unnamed customer's team, which indicates a customer-linked delivery
      workflow without identifying the account, deployment stage, contract value, or outcome.
      TechCrunch describes data-labeling clients and rising contract sizes but does not name those
      clients. Public recruiting-product feedback is also an imperfect proxy: Sprad characterizes
      it as mixed and primarily from candidates or project participants, not verified B2B buyers.
      No cited source discloses NRR, GRR, churn, renewals, contract duration, or satisfaction by
      paying account.
    claimRefs: [CU001, CU006, CU010, CU013, CU016]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion paths and concentration risk
    body: >-
      Two expansion mechanisms are visible but not quantified. First, larger contract sizes can
      expand account value. Second, TechCrunch reports that some off-the-shelf datasets may be
      sold to multiple customers, allowing reuse across accounts; the same practice has drawn
      criticism when data distribution could benefit Chinese AI developers. micro1's founder said
      the company does not sell to Chinese model makers, but the assigned evidence does not
      independently test that boundary. The enterprise workflow also creates a plausible repeat
      loop from rubric design through expert evaluation, failure analysis, targeted data, and
      re-evaluation. Durability cannot be concluded without account-level cohorts, renewal terms,
      top-customer revenue shares, project-versus-subscription mix, and procurement cycle data.
      Zara pricing is not public, which further limits assessment of its buying friction and
      expansion economics.
    claimRefs: [CU006, CU007, CU008, CU012, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer and participant segmentation
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Strategic value
      - Key gap
    rows:
      - - Frontier AI labs and model developers
        - "Buyer/payer: lab or model developer; users: research and model teams"
        - Expert training data, evaluations, and feedback loops
        - Gross and net run-rate reporting is company-wide, not segment-specific
        - Core AI-data demand surface
        - No named account, deployment scope, or segment revenue
      - - Enterprises deploying AI agents
        - "Buyer/payer: enterprise; users: AI, risk, and operating teams"
        - Rubrics, realistic evaluations, failure analysis, and targeted improvement data
        - No public account count or deployment count
        - Potential recurring evaluation and improvement loop
        - No renewal, production-outcome, or contract-length evidence
      - - Recruiting organizations using Zara
        - "Buyer/payer: employer; users: recruiters and hiring managers"
        - Structured asynchronous candidate screening and reporting
        - Public directory describes high-volume recruiting as a use case
        - Separate workflow and buyer from the AI-data business
        - No public pricing, named buyer outcome, or retention metric
      - - Expert contributors and contractors
        - "Payer: micro1 or its customer; users: contributors performing data work"
        - Domain-expert review, annotation, and AI-data production
        - Third-party social post claims hundreds of thousands of contributors globally
        - Delivery capacity rather than customer demand
        - Contributor count is unaudited and must not be treated as customer count
    notes: >-
      Segmentation combines company, partner, and third-party evidence; no public segment revenue
      or account counts were available, and contributors are explicitly classified as supply-side.
    claimRefs: [CU001, CU002, CU003, CU009, CU011, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric or signal
      - Reported value
      - Period / date
      - Source attribution
      - Confidence
      - Implication and missing denominator
    rows:
      - - Gross annual run rate
        - "$100M to $500M"
        - Eight months ending before 2026-08-20
        - TechCrunch, citing a person familiar with the company
        - Medium
        - Demand expanded rapidly; not audited revenue, ARR, or a customer count
      - - Net annual run rate
        - "$150M to $200M"
        - Reported 2026-08-20
        - TechCrunch estimate based on a reported 60%-70% retained share
        - Medium
        - Indicates retained economics; no account, cohort, or revenue-recognition denominator
      - - Contract-size direction
        - Growing at an accelerated pace
        - Reported 2026-08-20
        - TechCrunch
        - Medium
        - Supports expansion demand; no median contract, customer count, or concentration data
      - - Contributor-network scale
        - Hundreds of thousands globally
        - Social post available in 2026
        - Traded Venture Capital interview post
        - Low
        - Suggests supply capacity only; unaudited and unrelated to buyer count
    notes: >-
      Values retain the publishers' metric names and qualifications; run rate is not treated as
      recognized revenue or ARR, and the contributor figure is not treated as customer adoption.
    claimRefs: [CU004, CU005, CU006, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named party or disclosed segment
      - Relationship
      - Deployment or use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - Drata
        - Named ecosystem counterpart and article co-author; customer status not disclosed
        - Complementary narrative linking micro1 evaluation with Drata governance
        - Not disclosed
        - No micro1 customer outcome reported
        - Partnership narrative is not proof of a paid deployment
      - - Unnamed AI-data clients
        - Customers described by TechCrunch
        - Expert evaluation, data labeling, and model-training data
        - Not disclosed
        - Contract sizes reportedly increasing
        - No client names, scope, renewal, or account-level outcome
      - - Unnamed customer team
        - Customer referenced in a reposted Remote OK contractor role
        - AI Data Specialist supporting data and machine-learning workflows
        - Not disclosed
        - Role was closed and probably filled; no deployment result
        - No customer identity, contract value, or outcome
    notes: >-
      Partial enumeration of named or customer-linked proof in the assigned source pool as of
      2026-10-04; relationship labels do not imply that Drata is a paying customer.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly accessible sources assigned to this chapter through 2026-10-04; private customer
        references and undisclosed contracts are outside the observable population.
    claimRefs: [CU001, CU006, CU010, CU016]
figures:
  - id: FU001
    title: Evidence-based enterprise adoption and expansion loop
    type: journey-map
    summary: >-
      The public workflow supports a repeat evaluation loop, while commercial conversion and
      renewal rates remain undisclosed.
    data:
      items:
        - label: Define the operating need
          detail: Enterprise teams identify the model or agent workflow requiring evaluation.
          touchpoints:
            - Enterprise AI, risk, and operating teams
        - label: Specify success criteria
          detail: Human expertise is translated into rubrics, task definitions, and failure taxonomies.
          touchpoints:
            - Rubric design
            - Task definition
        - label: Source and vet experts
          detail: micro1 identifies domain experts for the relevant evaluation or data task.
          touchpoints:
            - Finance
            - Healthcare
            - STEM engineering
        - label: Produce data and evaluations
          detail: Experts contribute training data, evaluations, and feedback loops.
          touchpoints:
            - Training data
            - Contextual evaluation
        - label: Diagnose failure modes
          detail: Expert review identifies reasoning, instruction-following, and context failures.
          touchpoints:
            - Failure analysis
            - Edge-case review
        - label: Create targeted improvement data
          detail: Identified issues are converted into targeted examples, feedback, and guardrails.
          touchpoints:
            - Targeted datasets
            - Expert feedback
        - label: Re-evaluate changed systems
          detail: Model, workflow, tool, and expectation changes create a repeat-evaluation need.
          touchpoints:
            - Regression evaluation
            - Updated workflows
        - label: Expand or renew
          detail: Larger contracts are reported, but renewal and conversion rates are not public.
          touchpoints:
            - Expansion diligence
            - Renewal diligence
    approximationNotes: >-
      This is a qualitative workflow synthesis, not a measured funnel; no conversion rates,
      durations, renewal rates, or proportional stage sizes are implied.
    claimRefs: [CU015]
callouts:
  - calloutType: risk
    title: Scale is not durability
    body: >-
      Rapid run-rate growth and larger contracts support demand, but they do not answer whether
      revenue is diversified, recurring, retained, or concentrated in a few frontier-model buyers.
    claimRefs: [CU004, CU006, CU016]
