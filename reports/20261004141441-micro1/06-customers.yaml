  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof
      missingEvidence: >-
        Named AI-data customers with use case, deployment stage, contract scope, reference contact,
        and measured production outcome.
      whyItMatters: >-
        Anonymous demand and partner narratives cannot establish reference quality, production
        adoption, or repeatability across customer segments.
      diligencePath: >-
        Obtain the customer roster and select at least three accounts for reference calls, then
        reconcile their deployment dates and outcomes to contracts and invoices.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: durability-gap
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort expansion, top-5
        customer share, and project-versus-recurring revenue mix.
      whyItMatters: >-
        Run-rate growth can coexist with weak retention or customer concentration, so public scale
        signals do not establish durable revenue quality.
      diligencePath: >-
        Review monthly account-level revenue cohorts, executed contracts, renewal schedules, churn
        reasons, and customer concentration for the prior 24 months.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: procurement
      missingEvidence: >-
        Zara pricing units, package inclusions, minimum term, implementation fees, support terms,
        and account-level expansion behavior.
      whyItMatters: >-
        Without commercial terms, the recruiting product's procurement friction, payback, and
        land-and-expand economics cannot be assessed.
      diligencePath: >-
        Obtain a current order form and pricing schedule, then test unit economics against completed
        interviews, recruiter time saved, implementation effort, and renewal history.
      relatedQuestionRefs: [QU005, QU007]
