callouts:
  - calloutType: "risk"
    title: "Marketplace Pass-Through Economics Versus Software Multiples"
    body: "Micro1 commands late-stage valuations of up to $4 billion on reported $500 million gross annualized run rates. However, with 60% to 70% net retention, actual net revenue is $150 million to $200 million. Valuing the company on gross run rate rather than net revenue risks conflating low-margin marketplace GMV with high-margin software recurring revenue."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI011"
      - "CI014"
  - calloutType: "insight"
    title: "Working Capital Float in Rapidly Scaling Contractor Operations"
    body: "Expanding contract sizes and rapid growth from $100 million to $500 million gross run rate creates intense working capital demands. Because domain experts require prompt bi-weekly or monthly compensation while enterprise customers operate on 60- to 90-day payment terms, Micro1 must maintain substantial cash reserves to float contractor disbursements."
    claimRefs:
      - "CI005"
      - "CI012"
      - "CI015"
