              separate solutions-architect assignment asks a contractor to apply AWS, Docker, Kubernetes, and
              microservices expertise to AI-training work; those are task requirements, not proof that Micro1 runs those
              components internally. Secondary guides describe a browser-based voice interview and coding environment,
              but neither is primary technical documentation. Accordingly, the architecture map below traces actors and
              work products while leaving hosting, APIs, data stores, observability, and tenant isolation as diligence
              gaps.
            claimRefs:
