            body: >-
              The observable workflow begins with role or project requirements, proceeds through AI-assisted candidate
              screening, and culminates in expert work intended to improve model training or evaluation. Independent and
              competitor-authored guides describe a spoken Zara interview, automated coding tasks, and later human
              review, while Micro1 itself says its AI tools complement rather than replace human decision-making. These
              descriptions establish a plausible candidate-side interaction, not independently measured accuracy or
              throughput. The job evidence further shows that assignments can ask experts to produce technical analysis,
              architecture documentation, presentation reconstruction, or real-world input. No allocated source
              quantifies time-to-staff, completion rates, scoring validity, or customer-side integration effort.
            claimRefs:
