      - number: '5.3'
        title: Architecture evidence and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The available material supports an operating architecture, not a verified internal software architecture.
              One Micro1-hosted posting lists React, Ruby on Rails, PostgreSQL, and a planned cloud migration, but the
