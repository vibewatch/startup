      - CO012
  - id: FM001
    title: Evidence-constrained market expansion layers
    type: pyramid
    summary: >-
      The opportunity broadens from observed frontier-lab demand into progressively less quantified enterprise,
      robotics, corpus, and reusable-data adjacencies.
    data:
      items:
        - label: Frontier-lab expert data
          detail: Current demand supported by independent reporting and company scale signals.
          tone: positive
        - label: Managed evaluation infrastructure
          detail: Vetting, quality assurance, payroll, and compliance expand spend captured per engagement.
          tone: positive
        - label: Enterprise-agent evaluation
          detail: Management-proposed expansion into continuous testing and validation for internal agents.
          tone: neutral
        - label: Robotics demonstrations
          detail: Human demonstrations, teleoperation, and action annotation create new modalities.
          tone: neutral
        - label: Proprietary corporate corpora
          detail: Recent transaction activity signals demand but privacy and approval constraints are material.
          tone: warning
        - label: Synthetic and reusable datasets
          detail: Reusable data may expand margins while substituting for some bespoke human labor.
          tone: warning
    approximationNotes: >-
      Layers are ordered qualitatively from directly observed demand to less quantified adjacencies; they do not
      represent TAM, SAM, SOM, probability, market share, or additive dollar values.
