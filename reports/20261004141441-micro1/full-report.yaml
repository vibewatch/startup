  - id: FE001
    title: Evidence-backed expert-to-data operating stack
    type: stack
    summary: >-
      Six observable or company-described operating layers connect expert acquisition to AI-training and research
      outputs without asserting an undocumented software topology.
    data:
      layers:
        - label: Role and project intake
          detail: >-
            Customer or internal needs are translated into specialist listings; requirements and acceptance criteria are
            not publicly documented.
        - label: Expert sourcing
          detail: Micro1 presents a global network spanning technical and other domain expertise.
        - label: AI-assisted vetting
          detail: Company pages confirm AI recruiter use; third parties describe spoken interviews and coding assessment.
        - label: Human review and matching
          detail: Micro1 says AI complements human decision-making, but review thresholds and appeals are undisclosed.
        - label: Expert task execution
          detail: Assigned work can include technical analysis, documentation, and other real-world input for AI projects.
        - label: Data, evaluation, and research output
          detail: >-
            The company describes training data, evaluations, feedback loops, research, and benchmarks as downstream
            outputs.
    approximationNotes: >-
      Conceptual operating sequence assembled from allocated sources; it is not a network, deployment, data-flow, or
      security architecture diagram.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE007
      - CE012
  - id: FU001
    title: Evidence-based enterprise adoption and expansion loop
    type: journey-map
    summary: >-
      The public workflow supports a repeat evaluation loop, while commercial conversion and renewal rates remain
      undisclosed.
    data:
      items:
        - label: Define the operating need
          detail: Enterprise teams identify the model or agent workflow requiring evaluation.
          touchpoints:
            - Enterprise AI, risk, and operating teams
        - label: Specify success criteria
          detail: Human expertise is translated into rubrics, task definitions, and failure taxonomies.
          touchpoints:
            - Rubric design
            - Task definition
        - label: Source and vet experts
          detail: micro1 identifies domain experts for the relevant evaluation or data task.
          touchpoints:
            - Finance
            - Healthcare
            - STEM engineering
        - label: Produce data and evaluations
          detail: Experts contribute training data, evaluations, and feedback loops.
          touchpoints:
            - Training data
            - Contextual evaluation
        - label: Diagnose failure modes
          detail: Expert review identifies reasoning, instruction-following, and context failures.
          touchpoints:
            - Failure analysis
            - Edge-case review
        - label: Create targeted improvement data
          detail: Identified issues are converted into targeted examples, feedback, and guardrails.
          touchpoints:
            - Targeted datasets
            - Expert feedback
        - label: Re-evaluate changed systems
          detail: Model, workflow, tool, and expectation changes create a repeat-evaluation need.
          touchpoints:
            - Regression evaluation
            - Updated workflows
        - label: Expand or renew
          detail: Larger contracts are reported, but renewal and conversion rates are not public.
          touchpoints:
            - Expansion diligence
            - Renewal diligence
    approximationNotes: >-
      This is a qualitative workflow synthesis, not a measured funnel; no conversion rates, durations, renewal rates, or
      proportional stage sizes are implied.
    claimRefs:
      - CU015
  - id: FR001
    title: Residual-risk evidence matrix
    type: matrix
    summary: >-
      Six risk areas are compared on observed impact, evidence completeness, and disclosed mitigation maturity without
      assigning unsupported numerical probabilities.
    data:
      columns:
        - Observed impact
        - Evidence completeness
        - Disclosed mitigation maturity
      rows:
        - label: Data rights and provenance
          values:
            - label: High
              detail: Court delay followed data-use concerns
            - label: Partial
              detail: No later order, DPA, or dataset rights file
            - label: Not evidenced
              detail: No control documentation in assigned pool
        - label: Judgment-heavy output quality
          values:
            - label: High
              detail: Errors can affect consequential decisions
            - label: Moderate
              detail: Company benchmark supplies task-level results
            - label: Early
              detail: Human review is recommended, not demonstrated
        - label: Scale and delivery controls
          values:
            - label: High
              detail: Reported gross run-rate growth is rapid
            - label: Low
              detail: No acceptance, rework, or capacity series
            - label: Not evidenced
              detail: Operating controls are not disclosed
        - label: Expert-network dependency
          values:
            - label: High
              detail: Specialist labor is central to delivery
            - label: Low
              detail: No retention, quality, or pay cohorts
            - label: Developing
              detail: AI-assisted screening plus human decisions stated
        - label: Dataset reuse
          values:
            - label: High
              detail: Reuse supports margin but may constrain rights
            - label: Moderate
              detail: Press reports economics and controversy
            - label: Limited
              detail: A China-sales restriction is stated
        - label: Financing visibility
          values:
            - label: Medium
              detail: Uncertainty impairs runway assessment
            - label: Low
              detail: Third-party totals conflict
            - label: Not evidenced
              detail: No primary capitalization record
    approximationNotes: >-
      Qualitative categories are analyst assessments based only on the cited assigned sources; they are not
      probabilities, loss estimates, audit conclusions, or evidence that an unreported incident did not occur.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR009
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: The decision chain separates reported scale from the evidence still required to support an entry price.
    data:
      nodes:
        - id: reported-scale
          label: Reported scale
          detail: $500M gross annual run rate reported by TechCrunch.
        - id: economic-reconciliation
          label: Reconcile economics
          detail: Retention percentage and stated net run rate do not reconcile.
        - id: reported-private-mark
          label: Reported private mark
          detail: Multiples reports a $4B September 2026 valuation.
        - id: capital-terms
          label: Verify capital terms
          detail: Cash, burn, dilution, and preference rights are not established.
        - id: liquidity-path
          label: Test liquidity path
          detail: No IPO timetable, secondary evidence, or acquisition history supports an exit case.
        - id: research-more
          label: Research More
          detail: Defer price and target-return conclusions pending private diligence.
      edges:
        - from: reported-scale
          to: economic-reconciliation
          label: Separate gross from net
        - from: economic-reconciliation
          to: reported-private-mark
          label: Avoid a false revenue multiple
        - from: reported-private-mark
          to: capital-terms
          label: Translate headline mark to common equity
        - from: capital-terms
          to: liquidity-path
          label: Assess realizable return
        - from: liquidity-path
          to: research-more
          label: Evidence remains incomplete
    approximationNotes: >-
      The flow is qualitative; the reported figures retain their original metric labels and are not converted into
      accounting revenue or cash values.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV014
      - CV015
      - CV016
