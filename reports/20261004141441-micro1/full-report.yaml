      - What would change the view
    rows:
      - - Thesis
        - Demand and commercial velocity
        - TechCrunch reports gross annual run rate growing from $100M to $500M in eight months.
        - The view weakens if reconciled billings show lower growth or concentrated, non-recurring programs.
      - - Thesis
        - Potential margin expansion
        - >-
          A person familiar with the company told TechCrunch reusable off-the-shelf data can carry 80%-90% gross
          margins.
        - The view strengthens only if audited segment reporting shows those margins at material company-wide scale.
      - - Anti-thesis
        - Unreliable net-economics baseline
        - The same article's 60%-70% retention statement does not reconcile with its $150M-$200M net run-rate statement.
        - A gross-to-net bridge and recognized-revenue schedule would resolve the inconsistency.
      - - Anti-thesis
        - Scale and pricing risk
        - >-
          TechCrunch reports Mercor at $2B and Handshake at $1B of gross annualized revenue, above micro1's reported
          level.
        - Durable customer retention, differentiated datasets, and verified margin expansion would reduce this risk.
    notes: >-
      The table preserves TechCrunch's metric labels and internal inconsistency; gross annual run rate, net annual run
      rate, recognized revenue, and ARR are not treated as interchangeable.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
  - id: TV003
    title: Bull, Base, and Bear Decision Scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks or triggers
      - Probability signal
    rows:
      - - Bull
        - >-
          Reported growth reconciles to durable net revenue; reusable data becomes a material high-margin mix; customer
          concentration is acceptable.
        - >-
          A valuation range is not supportable until verified net revenue and financing terms permit a like-for-like
          multiple.
        - Fails if high-margin data remains immaterial or gross-to-net economics cannot be reconciled.
        - 'Upside signal: verified retention, margin, and diversified-customer evidence.'
      - - Base
        - >-
          AI-data demand remains strong, but contractor-heavy delivery persists and the newest private mark remains
          unverified.
        - >-
          At the reported $4B mark, public evidence does not establish a target return or defensible common-equity
          price.
        - Price discipline remains the controlling variable; hold period and exit route are unknown.
        - 'Neutral signal: continued growth without audited economics or liquidity evidence.'
      - - Bear
        - >-
          Growth slows, margin expansion does not materialize, or preferred terms place common equity behind senior
          claims.
        - >-
          Downside cannot be quantified from public evidence, but multiple compression or a down round would impair
          common equity.
        - Triggers include net-revenue shortfall, customer loss, adverse preferences, or reduced AI-data spend.
        - 'Downside signal: financing opacity persists while operating growth decelerates.'
    notes: >-
      These are conditional scenarios, not forecasts; no probabilities, valuation ranges, target returns, hold periods,
      or exit values are assigned because the necessary private financial and capitalization inputs are unavailable.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: Key founding, capital raising, product pivot, and scaling milestones for micro1 from 2022 through 2026.
    data:
      items:
        - label: Company Founded
          date: '2022'
          detail: >-
            Ali Ansari establishes micro1 in California as an AI-powered talent screening and developer vetting
            platform.
          tone: neutral
        - label: Seed Capitalization
          date: 2023-08
          detail: Secures first institutional seed funding round from angel investors and early venture funds.
          tone: positive
        - label: Early Expansion Round
          date: 2024-08
          detail: Completes early-stage VC financing led by Companyon Ventures with angel participation from Sean Rad.
          tone: positive
        - label: Series A Financing
          date: 2025-07
          detail: Secures $35M Series A at $500M valuation led by 01 Advisors; Adam Bain and Joshua Browder join board.
          tone: positive
        - label: Pivot to Frontier AI Data Lab
          date: 2025-10
          detail: >-
            Pivots primary business model from pure recruiting to human-in-the-loop expert data labeling and agent
            evaluation.
          tone: neutral
        - label: Initial Revenue Inflection
          date: 2025-12
          detail: Reaches reported $50M to $100M ARR run rate, expanding from $7M at the beginning of 2025.
          tone: positive
        - label: Gross Run Rate Expansion
          date: 2026-08
          detail: TechCrunch reports gross annual run rate reached $500M with $150M to $200M net revenue retention.
          tone: positive
        - label: Geopolitical Data Controversy
          date: 2026-08
          detail: >-
            Scrutiny over commercial training data distribution; CEO publicly commits not to sell data to Chinese model
            developers.
          tone: warning
        - label: Series B Growth Speculation
          date: 2026-09
          detail: Caplight and Tracxn track Series B round filings amid unverified press speculation of a $4B valuation.
          tone: neutral
    approximationNotes: >-
      Milestone dates and funding valuations reflect verified press reports and venture database filings; private round
      details are approximations where unverified.
