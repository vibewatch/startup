      - number: '5.4'
        title: Maturity, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Publicly accessible application flows and multiple contemporary descriptions indicate that AI interviewing
              is deployed, yet deployment does not establish model quality, reliability, or enterprise readiness. A
              practitioner thread contains repeated complaints that postings appeared to advertise direct jobs but led
              to a talent platform; users also raised concerns about interview recordings, broad contribution-license
              language, identity verification, and sparse opportunities after onboarding. These are self-selected
              reports rather than representative incident statistics, and the quoted terms were not independently
              verified as current. The competing interview-coaching article is also not an independent benchmark. The
              strongest diligence priorities are therefore current privacy terms, consent and deletion controls, bias
              and validation studies, human-appeal procedures, uptime history, security certifications, and a versioned
              product roadmap.
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The evidence supports vertical workflow integration, not a proprietary stack claim
            body: >-
              Micro1's observable differentiation is the connection between expert sourcing, AI-assisted vetting, and
              data or evaluation work. The assigned evidence does not support claims about proprietary model
              architecture, internal cloud components, performance, or defensible intellectual property.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE013
          - type: callout
            title: Trust controls are the principal product diligence gap
            body: >-
              Candidate reports raise privacy, consent, and posting-transparency concerns, while the pool lacks primary
              security, reliability, and assessment-validation material. These signals require direct diligence; they do
              not establish incident frequency or control absence.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer structure and use cases
        blocks:
          - type: paragraph
            body: >-
              micro1 presents two distinct demand surfaces. Its current company positioning centers on enterprises and
              AI labs that need expert-generated training data, evaluations, and feedback loops; the cited expert
              domains include finance, healthcare, and STEM engineering. A co-authored Drata article narrows the
              enterprise workflow further: customers define rubrics, success criteria, and failure taxonomies, while
              micro1 supplies expert review and targeted data. Separately, independent directory coverage describes Zara
              as a structured, asynchronous recruiting product for high-volume screening. These are different buying
              motions with different users and proof standards. Contributors are a supply-side population, not
              customers, and the social-media claim of hundreds of thousands of contributors therefore cannot establish
              customer count or account penetration.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption and commercial scale signals
        blocks:
          - type: paragraph
            body: >-
              The strongest external adoption signal is TechCrunch's report that gross annual run rate increased from
              $100 million to $500 million over eight months. The same article estimated net annual run rate at $150
              million to $200 million after a reported 60% to 70% retained share and said contract sizes were growing at
              an accelerated pace. These figures indicate demand and commercial expansion, but they are not audited
              revenue, ARR, customer counts, or cohort measures. They also do not reveal whether growth came from more
              customers, larger projects, pass-through contractor spend, or a small number of expanding accounts. The
              contributor-network claim and a closed contractor posting show delivery capacity and active workflow
              recruitment, not buyer adoption.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU009
      - number: '6.3'
        title: Named proof, outcomes, and durability
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not provide a named, outcome-bearing AI-data customer case study. Drata is
              named in a co-authored operating narrative, but the page presents complementary roles rather than
              identifying Drata as a paying micro1 customer. Remote OK reproduces a closed role for an unnamed
              customer's team, which indicates a customer-linked delivery workflow without identifying the account,
              deployment stage, contract value, or outcome. TechCrunch describes data-labeling clients and rising
              contract sizes but does not name those clients. Public recruiting-product feedback is also an imperfect
              proxy: Sprad characterizes it as mixed and primarily from candidates or project participants, not verified
              B2B buyers. No cited source discloses NRR, GRR, churn, renewals, contract duration, or satisfaction by
              paying account.
            claimRefs:
              - CU001
              - CU006
              - CU010
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU006
              - CU010
              - CU016
      - number: '6.4'
        title: Expansion paths and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Two expansion mechanisms are visible but not quantified. First, larger contract sizes can expand account
              value. Second, TechCrunch reports that some off-the-shelf datasets may be sold to multiple customers,
              allowing reuse across accounts; the same practice has drawn criticism when data distribution could benefit
              Chinese AI developers. micro1's founder said the company does not sell to Chinese model makers, but the
              assigned evidence does not independently test that boundary. The enterprise workflow also creates a
              plausible repeat loop from rubric design through expert evaluation, failure analysis, targeted data, and
              re-evaluation. Durability cannot be concluded without account-level cohorts, renewal terms, top-customer
              revenue shares, project-versus-subscription mix, and procurement cycle data. Zara pricing is not public,
              which further limits assessment of its buying friction and expansion economics.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU012
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not durability
            body: >-
              Rapid run-rate growth and larger contracts support demand, but they do not answer whether revenue is
              diversified, recurring, retained, or concentrated in a few frontier-model buyers.
            calloutType: risk
            claimRefs:
              - CU004
              - CU006
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Data rights are the highest observable legal exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is not a recorded enforcement action but an unresolved data-rights dispute.
              Digital Watch reported that Micro1 submitted a $12.5 million late offer for Spirit Airlines bankruptcy
              data after Google had been declared the $10 million winner. The same account said the federal court had
              not approved the result and postponed its hearing after former flight attendants questioned how their data
              could be used. This supports a high-impact privacy and provenance risk, but it does not establish that
              Micro1 violated a law or that the transaction ultimately closed. A marketplace listing names HIPAA, CCPA,
              and CPRA, yet the assigned evidence contains no first-party privacy policy, DPA, certification, court
              order, or later docket outcome. Legal status, permissible-use rights, consent, deletion obligations, and
              buyer accountability therefore remain diligence items rather than confirmed controls.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR016
      - number: '7.2'
        title: Fast scaling raises control and quality demands
        blocks:
          - type: paragraph
            body: >-
              TechCrunch reported, through a person familiar with the company, that gross annual run rate increased from
              $100 million to $500 million in eight months and that Micro1 retained roughly 60% to 70% of gross
              billings, yielding a $150 million to $200 million net annual run rate. These are run-rate measures, not
              audited revenue or cash, and the source does not disclose customer concentration, working capital,
              contractor liabilities, or cash burn. Micro1's own Realm benchmark also shows why quality controls matter:
              103 finance tasks and 927 rollouts produced sub-50% performance on judgment-heavy work, with decision and
              recommendation performance around 25% to 30%. The benchmark is company-issued and not evidence of Micro1
              product defects, but it makes human review, task-level acceptance tests, and traceable QA essential when
              deliverables affect consequential decisions.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
      - number: '7.3'
        title: Expert supply, customer demand, and disclosure quality remain dependencies
        blocks:
          - type: paragraph
            body: >-
              Micro1 describes itself as a data lab built around human expertise, while TechCrunch says the model uses
              contracted doctors, lawyers, scientists, and other specialists. That creates a delivery dependency on
              recruiting, vetting, retaining, and paying an expert network at the same time that contract volume is
              reportedly accelerating. The company also advertises AI-assisted candidate screening and says human
              decision-making remains in the loop; the available material does not provide bias audits, false-rejection
              rates, or worker-retention data. Dataset reuse creates another dependency: TechCrunch reported potential
              80% to 90% gross margins for off-the-shelf data but also described criticism of selling the same datasets
              to multiple clients. Finally, third-party funding snapshots conflict at $35 million-plus versus $142
              million, preventing a reliable conclusion about capital available to absorb execution shocks.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.4'
        title: Mitigations, monitors, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity should be treated as unverified until management supplies control evidence. For data
              rights, require dataset-level provenance, consent or other lawful-use basis, purpose limitations, deletion
              mechanics, court approvals where relevant, and customer-facing contractual restrictions. For quality,
              monitor task acceptance, rework, expert disagreement, model-to-human escalation, and repeatability by use
              case; a company-issued benchmark is useful for scoping tests but not independent assurance. For
              dependencies, reconcile gross billings to net recognized revenue, disclose customer and expert
              concentration, and reconcile financing records to bank statements and the capitalization table. The
              investment thesis should break if management cannot evidence durable rights to material datasets, if
              judgment-heavy outputs remain below the benchmark's 50% usability threshold without mandatory human
              review, if a material customer loss cannot be absorbed, or if financing and liquidity cannot be reconciled
              from primary records.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR009
              - CR010
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-conditioned kill criteria
            body: >-
              Stop or reprice diligence if Micro1 cannot document durable rights for material datasets, cannot show
              mandatory human review for judgment-heavy outputs below the benchmark's 50% usability threshold, cannot
              disclose material customer and expert concentration, or cannot reconcile financing and liquidity to
              primary records. These are diligence triggers, not claims that a breach, enforcement action, customer
              loss, or liquidity shortfall has occurred.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that micro1 has repositioned around expert data, model training, and agent evaluation just
              as TechCrunch reports gross annual run rate rising from $100 million to $500 million in eight months. The
              same reporting identifies reusable data with 80% to 90% gross margins and compares micro1 with larger
              gross-run-rate peers, suggesting both demand and a path to better unit economics. The anti-thesis is
              equally material: the source's statement that micro1 retains 60% to 70% of gross does not reconcile
              arithmetically with its stated $150 million to $200 million net run rate. This inconsistency, together
              with an independently reported $4 billion private mark, makes any net-revenue multiple unreliable until
              management supplies reconciled financial statements.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
      - number: '8.2'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is Research More, with medium confidence, high risk, and a valuation stance of
              Unsupported at the reported price. Multiples reports a September 2026 valuation of $4 billion and a
              financing above $100 million, while TechCrunch had reported only that a newer round may have occurred at a
              significantly higher valuation than the 2025 Series A. Using the separately reported $500 million gross
              run rate produces an approximately 8.0x gross run-rate reference, not a revenue or ARR multiple. It cannot
              establish common equity value because cash balance, burn, preference seniority, option dilution, and the
              fully diluted cap table are absent from the assigned evidence. Entry discipline should therefore be tied
              to verified terms and reconciled economics, not to the headline private mark.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, Comparables, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support precise bull, base, or bear valuation ranges, so the scenarios are framed
              as diligence-dependent decision conditions rather than invented forecasts. The bull condition requires the
              $500 million gross run rate to reconcile to durable net revenue and company-wide margin expansion; the
              base condition assumes demand persists but leaves the $4 billion price unsupported; the bear condition is
              triggered by slower growth, margin pressure, or financing terms that subordinate new common equity.
              Multiples' public-company and private benchmark set spans unlike business models and exceptionally wide
              revenue multiples, so it is directional rather than a clean comp set. Tracxn reports no acquisitions by
              micro1, and the evidence provides no IPO timetable, secondary liquidity data, or strategic-buyer
              indications. Exit readiness and target returns remain material diligence gaps.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price Requires Private Diligence
            body: >-
              The available evidence can support monitoring micro1, but not a precise entry valuation, target return,
              hold period, or exit value. The decisive next evidence is a reconciled gross-to-net schedule and the fully
              diluted financing waterfall.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
              - CV015
