  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 排名
      - 规则、许可或案件
      - 司法辖区
      - 证据与状态
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余风险敞口
      - 尽调路径
    rows:
      - - 1
        - Spirit Airlines 破产数据出售
        - 美国；纽约联邦破产法院
        - 2026-08-21 的可用报道称审批尚未完成；因前空乘人员对数据使用提出担忧，听证会被推迟
        - 中：观察到正在进行的审查；后续结果未知
        - 高：员工和客户数据的权利可能限制使用
        - 分配到的来源未提供证据
        - 在合法使用范围和法院最终结果形成文件前为高
        - 获取出价文件、资产清单、法院最终命令、数据清单、同意或合法依据分析、留存计划和转让限制
      - - 2
        - HIPAA、CCPA 和 CPRA 合规声明
        - 美国；州级和行业范围取决于处理的数据
        - 第三方软件目录列出这些制度；没有一手控制文件
        - 中：产品处理人类专业能力和招聘数据，但适用数据集未披露
        - 处理受监管或敏感数据的场景为高
        - 未经验证的市场声明
        - 高，因为范围、审计、事故和合同责任分配均未知
        - 审查隐私政策、DPA、子处理方、安全评估、事故历史、HIPAA 适用性及 CCPA/CPRA 请求指标
      - - 3
        - AI 辅助候选人筛选
        - 多个司法辖区；具体就业法覆盖范围没有证据
        - 公司招聘页面称 AI 协助筛选和评估，旨在补充人工决策
        - 中：该控制正在使用，但规模和地域未知
        - 中：偏差、告知和申诉失败可能损害专家供给或引发法律索赔主张
        - 已说明有人参与；未见测试证据
        - 在偏差、准确率、告知、申诉和留存控制明确前为中
        - 获取模型卡、验证和偏差测试、候选人告知、人工覆盖日志、申诉数据及司法辖区法律顾问审查
    notes: 部分公开证据登记表，按分析师评估的剩余风险严重性排序。可能性、严重性和成熟度是与所引证据相关的定性判断；本次资料池中没有执法、法院最终结果、认证或事故记录。
    enumerationScope:
      coverage: partial
      basis: >-
        Public risks identifiable in the eight assigned prefetched sources as of the 2026-10-04 run date; private
        contracts, court updates, policies, certifications, and incident records are excluded.
    claimRefs:
      - CR001
      - CR002
      - CR012
      - CR013
      - CR016
  - id: TR002
    title: 运营 / 质量 / 安全风险登记表
    columns:
      - 排名
      - 失效模式
      - 证据
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余风险敞口
      - 未解决缺口
    rows:
      - - 1
        - 未经充分复核就接受高度依赖判断的模型输出
        - 公司基准测试显示，在高难度判断任务上可用性低于 50%，决策/建议表现约为 25% 至 30%
        - 对测试任务类别为高
        - 当输出影响资金或其他重大决策时为高
        - 基准测试指出了局限；没有生产环境防护措施的证据
        - 自主使用时为高；只有在人工复核有效时才较低
        - 按客户拆分的验收、覆盖、错误和损失事件率
      - - 2
        - 质量控制跟不上合同量的快速增长
        - 据报道，年度总运行收入在八个月内从 $100m 增至 $500m
        - 中：增长已有报道，但控制能力未披露
        - 高：返工或拒收会侵蚀利润率和信任
        - 指定来源没有运营控制指标
        - 在审阅 QA 配置、抽样和返工数据前维持高风险
        - 月度验收、返工、缺陷逃逸、准时交付和专家产能队列
      - - 3
        - 将总计费误当成可持续的净经济性
        - 据报告，$500 million 的年度总运行率按 60% 至 70% 的留存份额折算后，对应 $150 million 至 $200 million 的年度净运行率
        - 中：指标区分明确，但缺少会计处理信息
        - 对估值、现金跑道和利润率结论的风险为高
        - 指定来源没有经审计的勾稽表
        - 高：确认收入和现金创造均未得到证实
        - 经审计收入、总额到净额勾稽、承包商支出、营运资金、现金消耗和现金
      - - 4
        - 研究和基准测试说法跑在独立验证前面
        - 现有岗位负责公司研究的 QA、定位、发布、采用和引用
        - 中：内部 QA 负责人清晰，但没有独立复现
        - 中：可信度会影响企业信任和销售
        - 正在招聘专职岗位；流程结果尚无证据
        - 在审阅方法、数据集、评审者和复现结果前维持中风险
        - 外部复现、基准版本管理、数据泄漏测试、评审者冲突和更正历史
    notes: 风险排序区分据报告的年度总运行率和年度净运行率，不把两者任何一个视为经审计收入、现金或 ARR。指定证据不含完整的安全事件记录，因此公开层面没有可下的安全事件结论。
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR012
  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 排名
      - 依赖项
      - 交易对手
      - 角色
      - 集中度证据
      - 失败情景
      - 严重程度
      - 缓解措施
      - 剩余暴露
    rows:
      - - 1
        - 专家劳动力网络
        - 合同制领域专家
        - 创建并评估专业训练数据
        - 公司和媒体描述了该模式；员工数量和集中度数据不可得
        - 专家供给、筛选、留存或薪酬无法随需求扩张
        - 高
        - 已说明 AI 辅助筛选和人工决策；但没有绩效证据
        - 在获得队列留存、质量、薪酬和产能数据前为高
      - - 2
        - 前沿模型客户需求
        - 头部 AI 实验室和企业买家
        - 购买定制及可复用训练数据
        - 需求被描述为强劲，但客户名称、收入份额和合同条款不可得
        - 重要买家将工作内制、削减支出或要求独家合作
        - 高
        - 可复用数据可能分散变现来源，但也会带来买方冲突风险
        - 高：缺少客户集中度和续约证据
      - - 3
        - 数据集复用权利
        - 数据主体、卖方和多个下游买家
        - 据报告，使现成数据的利润率最高可达 80% 至 90%
        - 未披露数据集层面的权利或买方分布
        - 卖方、主体、法院或客户限制复用或独家权利
        - 高
        - 创始人称 Micro1 不向中国模型制造商出售数据；更广泛的控制措施没有证据
        - 在核实来源、独家性、地域和下游使用控制前为高
      - - 4
        - 资本与披露记录
        - 投资者、管理层和市场数据供应商
        - 为资金执行并购流动性评估提供信息
        - 指定第三方快照报告融资额超过 $35 million，且已筹得 $142 million
        - 投资决策依赖过时或无法勾稽的融资数据
        - 中
        - 指定来源没有勾稽表
        - 对现金跑道分析为高；已筹资金不等于可用现金
    notes: 除非引用来源提供分母，否则集中度标为未知。融资总额来自相互冲突的第三方报告，不视为现金、流动性或现金跑道。
    claimRefs:
      - CR001
      - CR008
      - CR009
      - CR010
      - CR011
      - CR014
      - CR015
  - id: TV001
    title: 建议摘要
    columns:
      - 决策字段
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 据报告总运行率快速增长，但净经济性和融资条款尚未核实。
        - 在财务和股权结构表尽调补齐重大缺口前，不要把入场价格计入投资判断。
      - - 信心
        - 中
        - 独立来源印证了 2025 年估值标记，但最新标记主要依赖一个市场数据页面。
        - 将 $4B 视为据报告的非公开市场估值标记，而非经独立核实的股权价值。
      - - 风险评级
        - 高
        - 总额到净额的披露内部不一致，且按同一总额口径，竞争对手规模大得多。
        - 在给风险定价前，要求下行保护以及可持续留存和利润率的证明。
      - - 估值立场
        - 据报告价格缺乏支撑
        - 粗略的 8.0x 参考值使用总运行率，不能作为收入或 ARR 倍数呈现。
        - 只有在勾稽净收入、稀释、优先权、现金和消耗后才能定价。
    notes: 评估仅使用截至 2026-10-04 的指定公开证据；8.0x 数值用另行报告的 $4B 非公开市场估值标记除以另行报告的 $500M 年度总运行率，不是会计收入倍数。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
      - CV015
  - id: TV002
    title: 正方与反方论点
    columns:
      - 立场
      - 论点
      - 证据
      - 哪些事实会改变判断
    rows:
      - - 正方
        - 需求与商业化速度
        - TechCrunch 报道年度总运行率在八个月内从 $100M 增至 $500M。
        - 如果勾稽后的计费显示增速更低，或项目集中且不可重复，该判断会削弱。
      - - 正方
        - 利润率扩张潜力
        - 一位知情人士告诉 TechCrunch，可复用的现成数据可实现 80%–90% 的毛利率。
        - 只有经审计的分部披露显示该利润率达到公司层面的重要规模时，这一判断才会增强。
      - - 反方
        - 不可靠的净经济性基线
        - 同一篇文章称留存份额为 60%–70%，但这与其 $150M–$200M 净运行率的说法无法勾稽。
        - 总额到净额的桥接表和确认收入明细可以解决这一不一致。
      - - 反方
        - 规模与定价风险
        - TechCrunch 报道 Mercor 的年度总收入为 $2B、Handshake 为 $1B，均高于 micro1 的报告水平。
        - 可持续的客户留存、差异化数据集和经核实的利润率扩张可以降低这一风险。
    notes: 表格保留 TechCrunch 的指标标签和内部不一致；年度总运行率、年度净运行率、确认收入和 ARR 不视为可互换。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险或触发因素
      - 概率信号
    rows:
      - - 乐观
        - 据报告的增长可勾稽至可持续净收入；可复用数据成为重要的高毛利组合；客户集中度可以接受。
        - 在核实净收入和融资条款足以支持同口径倍数前，估值区间没有依据。
        - 如果高毛利数据仍不重要，或总额到净额的经济性无法勾稽，则情景失败。
        - 上行信号：留存、利润率和客户多元化证据得到核实。
      - - 基准
        - AI 数据需求仍然强劲，但以承包商为主的交付持续存在，最新非公开市场估值标记仍未核实。
        - 按据报告的 $4B 估值标记，公开证据无法确立目标回报或有依据的普通股价格。
        - 定价纪律仍是控制变量；持有期和退出路径未知。
        - 中性信号：持续增长，但没有经审计的经济性或流动性证据。
      - - 悲观
        - 增长放缓、利润率扩张未实现，或优先条款使普通股排在优先债权的受偿主张之后。
        - 公开证据无法量化下行空间，但倍数压缩或下轮融资会损害普通股。
        - 触发因素包括净收入短缺、客户流失、不利的优先权条款或 AI 数据支出减少。
        - 下行信号：融资不透明持续，而运营增长减速。
    notes: 这些是条件性情景，不是预测；由于缺少必要的非公开财务和资本结构输入，未赋予概率、估值区间、目标回报、持有期或退出价值。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: micro1 在 2022 至 2026 年间的成立、融资、产品转向和规模扩张关键里程碑。
    data:
      items:
        - label: 公司成立
          date: '2022'
          detail: Ali Ansari 在加州创立 micro1，将其打造为 AI 驱动的人才筛选和开发者审核平台。
          tone: neutral
        - label: 种子轮融资
          date: 2023-08
          detail: 从天使投资人和早期风险基金获得首轮机构种子融资。
          tone: positive
        - label: 早期扩张轮
          date: 2024-08
          detail: 完成由 Companyon Ventures 领投、Sean Rad 参与天使投资的早期 VC 融资。
          tone: positive
        - label: A 轮融资
          date: 2025-07
          detail: 获得由 01 Advisors 领投的 $35M A 轮融资，估值 $500M；Adam Bain 和 Joshua Browder 加入董事会。
          tone: positive
        - label: 转向前沿 AI 数据实验室
          date: 2025-10
          detail: 将主营模式从纯招聘转向人工参与的专家数据标注和智能体评估。
          tone: neutral
        - label: 初次收入拐点
          date: 2025-12
          detail: 据报告 ARR 运行率达到 $50M 至 $100M，高于 2025 年初的 $7M。
          tone: positive
        - label: 总运行率扩张
          date: 2026-08
          detail: TechCrunch 报道年度总运行率达到 $500M，净收入留存为 $150M 至 $200M。
          tone: positive
        - label: 地缘政治数据争议
          date: 2026-08
          detail: 商业训练数据分发受到审查；CEO 公开承诺不向中国模型开发商出售数据。
          tone: warning
        - label: B 轮增长猜测
          date: 2026-09
          detail: 在媒体未经核实的 $4B 估值猜测中，Caplight 和 Tracxn 追踪 B 轮申报记录。
          tone: neutral
    approximationNotes: 里程碑日期和融资估值来自经核实的媒体报道及风险数据库申报记录；非公开轮次的未经核实细节均为近似值。
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO012
  - id: FM001
    title: 受证据约束的市场扩张层次
    type: pyramid
    summary: 机会从已观察到的前沿实验室需求，逐步扩展到量化程度更低的企业、机器人、语料库和可复用数据邻近市场。
    data:
      items:
        - label: 前沿实验室专家数据
          detail: 当前需求有独立报道和公司规模信号支持。
          tone: positive
        - label: 托管式评估基础设施
          detail: 筛选、质量保证、薪资和合规扩大每次合作所捕获的支出。
          tone: positive
        - label: 企业智能体评估
          detail: 管理层提出扩展至对内部智能体的持续测试和验证。
          tone: neutral
        - label: 机器人示范
          detail: 人工示范、远程操作和动作标注创造新的模态。
          tone: neutral
        - label: 专有企业语料库
          detail: 近期交易活动释放需求信号，但隐私和审批限制重大。
          tone: warning
        - label: 合成及可复用数据集
          detail: 可复用数据可能扩大利润率，同时替代部分定制人工劳动。
          tone: warning
    approximationNotes: 层次按从直接观察到的需求到量化程度更低的邻近市场定性排序；不代表 TAM、SAM、SOM、概率、市场份额或可加总的美元价值。
    claimRefs:
      - CM002
      - CM004
      - CM006
      - CM012
      - CM014
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按人才专业化深度和年度化收入规模评估竞争平台。
    data:
      xAxis: 人才专业化深度
      yAxis: 年度化收入规模
      points:
        - label: Mercor
          x: 9
          'y': 10
        - label: Handshake
          x: 7
          'y': 8
        - label: micro1
          x: 6
          'y': 6
        - label: Turing
          x: 7
          'y': 5
        - label: Toptal
          x: 5
          'y': 4
        - label: Crewscale
          x: 4
          'y': 2
    approximationNotes: 收入规模和专业化深度根据报告的运行率数据（Mercor $2B、Handshake $1B、Micro1 $500M）以及 TechCrunch 和 aitrainingjobsfinder 的审核标准按序映射。
    claimRefs:
      - CP001
      - CP003
      - CP008
  - id: FI001
    title: 从合同总计费到净毛利的桥接
    type: waterfall
    summary: 瀑布桥展示客户年度总计费如何结构性下降至净留存收入和估算贡献利润。
    data:
      items:
        - label: 年度总运行率
          value: 500
          note: 截至 2026 年 8 月据报告的合同年度总运行率
        - label: 专家承包商薪酬转付
          value: -325
          note: 估算向合同制领域专家转付的中点比例为 65%
        - label: 年度净留存运行率
          value: 175
          note: 平台留存收入运行率（报告区间为 $150M 至 $200M）
        - label: 平台云与模型托管成本
          value: -25
          note: AI 筛选和合成生成的估算基础设施及推理托管费用
        - label: 净毛利贡献
          value: 150
          note: 可用于支持销售、研发和公司管理费用的估算毛利
        - label: 公司间接费用与核心人员
          value: -50
          note: Palo Alto 和远程办公室的核心团队薪资（约 101 名员工）
    approximationNotes: 美元数据以百万美元计；总运行率和净运行率采用 TechCrunch 报告数据，基础设施和间接费用为分析估算。
    claimRefs:
      - CI005
      - CI006
      - CI008
      - CI013
  - id: FE001
    title: 有证据支持的专家到数据运营栈
    type: stack
    summary: 六个可观察或由公司描述的运营层，将专家获取连接到 AI 训练和研究输出，但不宣称存在未记录的软件拓扑。
    data:
      layers:
        - label: 角色与项目接入
          detail: 客户或内部需求被转化为专家职位列表；要求和验收标准未公开记录。
        - label: 专家来源
          detail: Micro1 展示了覆盖技术及其他领域专业知识的全球网络。
        - label: AI 辅助审核
          detail: 公司页面确认使用 AI 招聘员；第三方描述了口语面试和编程评估。
        - label: 人工复核与匹配
          detail: Micro1 称 AI 补充人工决策，但复核阈值和申诉机制未披露。
        - label: 专家任务执行
          detail: 分配的工作可包括技术分析、文档编写及 AI 项目所需的其他现实世界输入。
        - label: 数据、评估与研究输出
          detail: 公司将训练数据、评估、反馈闭环、研究和基准测试描述为下游输出。
    approximationNotes: 根据分配来源整理的概念性运营顺序；这不是网络、部署、数据流或安全架构图。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE007
      - CE012
  - id: FU001
    title: 有证据支持的企业采用与扩张闭环
    type: journey-map
    summary: 公开工作流支持重复评估闭环，但商业转化率和续约率仍未披露。
    data:
      items:
        - label: 定义运营需求
          detail: 企业团队识别需要评估的模型或智能体工作流。
          touchpoints:
            - 企业 AI、风险和运营团队
        - label: 明确成功标准
          detail: 将人工专业知识转化为评分标准、任务定义和失败分类体系。
          touchpoints:
            - 评分标准设计
            - 任务定义
        - label: 寻找并审核专家
          detail: micro1 为相关评估或数据任务寻找领域专家。
          touchpoints:
            - 金融
            - 医疗
            - STEM 工程
        - label: 产出数据与评估
          detail: 专家贡献训练数据、评估和反馈闭环。
          touchpoints:
            - 训练数据
            - 上下文评估
        - label: 诊断失败模式
          detail: 专家复核识别推理、指令遵循和上下文方面的失败。
          touchpoints:
            - 失败分析
            - 边缘案例复核
        - label: 创建针对性改进数据
          detail: 将识别出的问题转化为针对性示例、反馈和护栏。
          touchpoints:
            - 针对性数据集
            - 专家反馈
        - label: 重新评估变更后的系统
          detail: 模型、工作流、工具和预期变化会产生重复评估需求。
          touchpoints:
            - 回归评估
            - 更新后的工作流
        - label: 扩大或续约
          detail: 据报告存在更大合同，但续约率和转化率未公开。
          touchpoints:
            - 扩张尽调
            - 续约尽调
    approximationNotes: 这是定性的工作流综合，不是经过测量的漏斗；不暗示转化率、时长、续约率或各阶段比例规模。
    claimRefs:
      - CU015
  - id: FR001
    title: 剩余风险证据矩阵
    type: matrix
    summary: 比较六个风险领域的已观察影响、证据完整性和已披露的缓解成熟度，不赋予缺乏支持的数值概率。
    data:
      columns:
        - 已观察影响
        - 证据完整性
        - 已披露缓解成熟度
      rows:
        - label: 数据权利与来源
          values:
            - label: 高
              detail: 数据使用担忧之后出现法院延期
            - label: 部分
              detail: 没有后续裁定、DPA 或数据集权利文件
            - label: 尚无证据
              detail: 指定资料池没有控制文件
        - label: 判断密集型输出质量
          values:
            - label: 高
              detail: 错误可能影响重大决策
            - label: 中等
              detail: 公司基准测试提供任务层面的结果
            - label: 早期
              detail: 建议人工复核，但尚未得到展示
        - label: 规模与交付控制
          values:
            - label: 高
              detail: 据报告总运行率增长迅速
            - label: 低
              detail: 没有验收、返工或产能序列
            - label: 尚无证据
              detail: 运营控制未披露
        - label: 专家网络依赖
          values:
            - label: 高
              detail: 专业劳动力是交付核心
            - label: 低
              detail: 没有留存、质量或薪酬队列
            - label: 发展中
              detail: 已说明 AI 辅助筛选加人工决策
        - label: 数据集复用
          values:
            - label: 高
              detail: 复用支持利润率，但可能限制权利
            - label: 中等
              detail: 媒体报道了经济性和争议
            - label: 有限
              detail: 已说明对华销售限制
        - label: 融资透明度
          values:
            - label: 中
              detail: 不确定性削弱现金跑道评估
            - label: 低
              detail: 第三方总额相互冲突
            - label: 尚无证据
              detail: 没有主要资本结构记录
    approximationNotes: 定性类别是分析师仅基于引用的指定来源作出的评估；它们不是概率、损失估计、审计结论，也不是未报告事件未发生的证据。
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR009
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链将据报告的规模与支撑入场价格仍需的证据分开。
    data:
      nodes:
        - id: reported-scale
          label: 据报告规模
          detail: TechCrunch 报告年度总运行率为 $500M。
        - id: economic-reconciliation
          label: 勾稽经济性
          detail: 留存比例与所述净运行率无法勾稽。
        - id: reported-private-mark
          label: 据报告非公开市场估值标记
          detail: Multiples 报告 2026 年 9 月估值为 $4B。
        - id: capital-terms
          label: 核实资本条款
          detail: 现金、消耗、稀释和优先权尚未确定。
        - id: liquidity-path
          label: 检验流动性路径
          detail: 没有 IPO 时间表、二级交易证据或收购历史支持退出情景。
        - id: research-more
          label: 继续研究
          detail: 在完成私下尽调前，暂不对价格和目标回报率下结论。
      edges:
        - from: reported-scale
          to: economic-reconciliation
          label: 区分毛额与净额
        - from: economic-reconciliation
          to: reported-private-mark
          label: 避免套用错误的收入倍数
        - from: reported-private-mark
          to: capital-terms
          label: 将标题估值折算为普通股价值
        - from: capital-terms
          to: liquidity-path
          label: 评估可实现回报
        - from: liquidity-path
          to: research-more
          label: 证据仍不完整
    approximationNotes: 该流程是定性的；报告中的数字保留原有指标标签，不换算为会计收入或现金金额。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV014
      - CV015
      - CV016
