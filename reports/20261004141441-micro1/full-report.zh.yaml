        title: 资本充足性、融资依赖与承销判断缺口
        blocks:
          - type: paragraph
            body: >-
              Micro1 快速融资，以支持承包商薪酬规模扩大带来的营运资金需求。Tracxn 记录显示，五轮融资累计股权融资达到 1.42 亿美元；Caplight 私募市场跟踪则确认 2026 年 9 月仍有 B
              轮二级交易，其他跟踪机构给出了 $4b 估值。尽管股权资金流入可观，前瞻性投资判断仍存在严重的私有指标缺口。公司没有公开披露 GAAP
              收入、经审计净利润、各批次毛利率、净收入留存率（NRR）或客户获取成本（CAC）。此外，收入极度集中于少数顶级 AI
              实验室，造成明显客户依赖风险。公司仍需保持充足资本，以弥合企业应收账款回款与每周或每两周向承包商付款之间的时间差。
