              生成合成数据集，例如视频内容自动描述和机器人预训练轨迹，并可向多个客户授权。定制化人在回路项目目前占绝大多数业务量，但现成数据和合成数据交付的边际经济效益显著更高，只是客户对数据共享和地域分发设有严格限制。
