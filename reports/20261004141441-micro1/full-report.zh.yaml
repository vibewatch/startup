      - number: '4.2'
        title: 成本结构、转付经济学与利润率扩张
        blocks:
          - type: paragraph
            body: >-
              Micro1 的财务结构本质上分为毛开票额和净留存收入两部分。不同于纯 SaaS 软件企业，定制化人工评测服务要承担专家承包商报酬这一大项销货成本。行业报道显示，Micro1 保留合同毛开票额的约 60% 至
              70%，将 30% 至 40% 直接转付给按项目合作的医生、律师和工程师。因此，尽管 2026 年 8 月毛收入年化运行率达到 $500m，公司净年化运行率仍为 $150m 至
              $200m。运营杠杆完全取决于这家创业公司能否用自有 AI 招聘基础设施自动化候选人审核、提高专家利用率并扩大合成数据集生产。据报道，合成数据和现成数据业务的毛利率达到 80% 至
              90%；若企业需求转向可重复使用的基准数据集，这可能成为结构性利润率长期扩张的路径。
            claimRefs:
              - CI005
