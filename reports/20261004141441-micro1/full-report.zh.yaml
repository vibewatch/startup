  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，micro1 正好在 TechCrunch 报道毛收入年化运行率八个月内从 $100m 升至 $500m 之际，围绕专家数据、模型训练和智能体评测完成了重新定位。同一报道指出可复用数据的毛利率为
              80% 至 90%，并将 micro1 与毛运行率更高的同行比较，说明需求存在，也存在改善单位经济性的路径。反论点同样重要：来源称 micro1 保留毛收入的 60% 至 70%，但这与其所称 $150m 至
              $200m 净年化运行率在算术上无法对上。这一矛盾，加上独立报道的 $4b 私募估值，在管理层提供对账财报前，使任何净收入倍数都不可靠。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
      - number: '8.2'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、风险高；按报道价格估值立场为缺乏支持。Multiples 报道 2026 年 9 月估值为 $4b，融资超过 $100m；TechCrunch 只报道可能有新一轮融资，估值可能显著高于
              2025 年 A 轮。用另行报道的 $500m 毛运行率可得到约 8.0x 毛运行率参考值，但不是收入或 ARR
              倍数。由于指定证据缺少现金余额、现金消耗、优先权级别、期权稀释和完全摊薄股权结构表，无法据此确定普通股价值。因此，入场纪律应绑定已验证条款和已对账经济性，而不是标题式私募估值。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景、可比公司与退出准备度
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持精确的乐观、基准或悲观估值区间，因此情景应表述为取决于尽调的决策条件，而非编造预测。乐观条件要求 $500m 毛运行率能够与持久净收入及全公司利润率扩张对账；基准条件假设需求持续，但 $4b
              价格仍缺乏支持；悲观条件由增长放缓、利润率承压或使新普通股处于次级地位的融资条款触发。Multiples
              的上市公司和私募基准集合覆盖不同商业模式，收入倍数跨度也极大，因此只能提供方向性参考，不能算干净的可比组。Tracxn 报告 micro1 没有收购记录，证据也没有 IPO
              时间表、二级流动性数据或战略买方意向。退出准备度和目标回报仍是重要尽调缺口。
            claimRefs:
              - CV010
