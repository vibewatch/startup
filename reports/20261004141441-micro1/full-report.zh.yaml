            body: >-
              在管理层提供控制证据前，应把缓释措施的成熟度视为未经验证。数据权利方面，应要求提供数据集级来源、同意或其他合法使用依据、目的限制、删除机制、相关法院批准以及面向客户的合同限制。质量方面，应监控任务验收、返工、专家分歧、模型向人工升级和按使用场景的可重复性；公司发布的基准可用于界定测试范围，但不是独立保证。依赖项方面，应将毛开票额与确认净收入对账，披露客户和专家集中度，并将融资记录与银行流水及股权结构表核对。若管理层无法证明重要数据集拥有持久权利，若重判断输出在没有强制人工审核时仍低于基准
              50% 的可用性门槛，若无法消化重要客户流失，或若无法根据一手记录核对融资与流动性，投资论点就应失效。
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR012
              - CR015
              - CR016
          - type: figure
