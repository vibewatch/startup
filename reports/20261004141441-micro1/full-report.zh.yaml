      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 以证据为条件的止损标准
            body: >-
              如果 Micro1 无法证明重要数据集拥有持久权利，无法证明对低于基准 50%
              可用性门槛的重判断输出实施强制人工审核，无法披露重要客户和专家集中度，或无法将融资与流动性同一手记录核对，就应暂停或重新定价尽调。这些是尽调触发条件，并不是已经发生违约、执法行动、客户流失或流动性短缺的主张。
