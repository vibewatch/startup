chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              micro1, Inc. 是一家总部位于加州、由 Ali Ansari 于 2022 年创立并在 Palo Alto 运营的人工智能基础设施公司。公司最初是一个依托 AI
              筛选技术的自动化招聘平台，为软件工程岗位寻找、面试和排序候选人。随着前沿人工智能生态对专业领域知识的需求激增，micro1 转变了商业模式。它不再只是传统工程师安置机构，而是定位为端到端 AI
              数据实验室和评测引擎，服务于前沿基础模型训练和自主智能体基准测试。如今，micro1 使用名为 Zara 的自有 AI
              招聘智能体，发现、评估并认证软件工程师、医生、执业律师和科学领域专家等专业人士。这些经过审核的贡献者提供高接触度的人类反馈强化学习（RLHF）、定制数据集制作和结构化推理示范。公司还扩大技术范围，开发智能体评测模拟环境、上下文基准套件和合成数据生成流水线，直接服务前沿模型开发商及领先科技企业。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO013
      - number: '1.2'
        title: 高管领导、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              micro1 的管理和战略愿景高度围绕创始人兼 CEO Ali Ansari，他在 22 岁时创办了公司。Ansari
              兼任主要发言人、核心产品架构师，并推动公司人才和评测业务。这种结构性集中带来显著的关键人物运营风险：公司的公开叙事、投资者关系、客户获取和产品势头都与创始人的领导紧密相连。公司在 2025 年 7 月完成 A
              轮融资后，引入了外部董事，强化机构治理。新加入董事会的重要成员包括领投方 01 Advisors 联合创始人、前 Twitter 首席运营官 Adam Bain，以及 DoNotPay 创始人和早期天使投资人
              Joshua Browder。外部治理虽带来成熟的运营建议和企业市场拓展指导，但公开披露显示，专职法务、合规和企业风险管理岗位的全职高管梯队信息极少；与此同时，公司内部全职员工已增至约 101 人。
            claimRefs:
              - CO004
              - CO005
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 资本结构、估值与利益相关者
        blocks:
          - type: paragraph
            body: >-
              micro1 的正式风险资本融资始于 2023 年 8 月的机构种子轮，随后在 2024 年 8 月完成由 Companyon Ventures 领投、Tinder 创始人 Sean Rad
              参与的早期风险融资。2025 年 7 月，公司完成由 01 Advisors 领投的 $35m A 轮融资，投后估值 $500m，意味着预计一级市场稀释约 7%。A 轮投资者还包括 LG Technology
              Ventures、Dream Ventures 和全球加速器 Antler，以及众多天使投资人和种子基金。2026 年末，风险投资情报服务和私募市场平台记录了 micro1 股权定价明显加速。Caplight 和
              Tracxn 在 2026 年 9 月记录了 B 轮融资迹象及二级市场交易，同时媒体和二级市场评论称估值讨论已达到 $4b。
              但后续轮次最终定价、股份类别、清算优先权和股权结构表分配仍缺乏经认证文件验证，必须针对优先权和按比例认购权开展明确的确认性尽调。
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO008
              - CO014
      - number: '1.4'
        title: 运营规模、战略里程碑与新兴风险
        blocks:
          - type: paragraph
            body: >-
              Micro1 的运营增长跟随了前沿基础模型实验室对专业人类数据需求的整体飙升。据 TechCrunch 2026 年 8 月报道，micro1 在八个月内将毛收入年化运行率从 $100m 提高到 $500m。
              由于人在回路的数据模式需要向外部领域承包商支付大量报酬，公司预计保留毛开票额的 60% 至 70%，净年化运行率约为 $150m 至 $200m。这延续了此前的报道里程碑：公司 2025 年年初收入为
              $7m，年内突破 $50m 年度经常性收入。尽管商业扩张迅速，并已服务包括 Microsoft 在内的《财富》100 强企业实验室，micro1 仍面临强劲的竞争和监管阻力。Scale AI、Mercor 和
              Surge AI 等规模化老牌平台拥有稳固客户关系和庞大的承包商池。此外，标准化现成训练数据集的商业分发也让国际 AI 开发商开始审视潜在的知识产权泄露风险。对此，CEO Ali Ansari
              明确承诺将中国前沿模型开发商排除在 micro1 客户之外，同时强调与国家安全目标一致，以应对数据供应商的竞争压力。
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 前沿训练数据运行率快速上升
            body: micro1 抓住领先 AI 研究实验室严重数据瓶颈的机会，借助自有筛选工具调动专业领域专家，在八个月内将毛收入年化运行率从 $100m 提升至 $500m。
            calloutType: strength
