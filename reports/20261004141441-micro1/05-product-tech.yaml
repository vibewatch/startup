chapter:
  number: 5
  title: "Product & Technology"
  summary: "Micro1 publicly presents an operating system for sourcing and vetting experts, assigning them to AI-training work, and converting their expertise into training data, evaluations, and research outputs. The allocated evidence supports that workflow at a product level, but it does not verify Micro1's internal software topology, service levels, security certifications, integration surface, or roadmap."
sections:
  - id: "product-scope"
    title: "Product scope and user workflow"
    body: "Micro1's own pages define the offer as a data lab rather than a conventional recruiting application: the company says it identifies and vets experts through an AI recruiter, then turns their knowledge into training data, evaluations, and feedback loops for frontier models. Live job pages also show a delivery surface through which specialists are recruited for customer projects. That evidence supports three connected product surfaces - expert acquisition and vetting, expert-work orchestration, and data or evaluation delivery - but it does not disclose SKU boundaries, contractual packaging, or usage metrics. A hiring post for research marketing additionally signals an internal research-and-benchmark function, although a job description is not proof of a released customer product."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
  - id: "delivery-model"
    title: "Evidence-backed delivery model"
    body: "The observable workflow begins with role or project requirements, proceeds through AI-assisted candidate screening, and culminates in expert work intended to improve model training or evaluation. Independent and competitor-authored guides describe a spoken Zara interview, automated coding tasks, and later human review, while Micro1 itself says its AI tools complement rather than replace human decision-making. These descriptions establish a plausible candidate-side interaction, not independently measured accuracy or throughput. The job evidence further shows that assignments can ask experts to produce technical analysis, architecture documentation, presentation reconstruction, or real-world input. No allocated source quantifies time-to-staff, completion rates, scoring validity, or customer-side integration effort."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE012"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "architecture-boundary"
    title: "Architecture evidence and operating dependencies"
    body: "The available material supports an operating architecture, not a verified internal software architecture. One Micro1-hosted posting lists React, Ruby on Rails, PostgreSQL, and a planned cloud migration, but the role explicitly concerns an unnamed proptech company and therefore cannot establish Micro1's stack. A separate solutions-architect assignment asks a contractor to apply AWS, Docker, Kubernetes, and microservices expertise to AI-training work; those are task requirements, not proof that Micro1 runs those components internally. Secondary guides describe a browser-based voice interview and coding environment, but neither is primary technical documentation. Accordingly, the architecture map below traces actors and work products while leaving hosting, APIs, data stores, observability, and tenant isolation as diligence gaps."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
  - id: "maturity-trust-and-risk"
    title: "Maturity, trust, and technical risk"
    body: "Publicly accessible application flows and multiple contemporary descriptions indicate that AI interviewing is deployed, yet deployment does not establish model quality, reliability, or enterprise readiness. A practitioner thread contains repeated complaints that postings appeared to advertise direct jobs but led to a talent platform; users also raised concerns about interview recordings, broad contribution-license language, identity verification, and sparse opportunities after onboarding. These are self-selected reports rather than representative incident statistics, and the quoted terms were not independently verified as current. The competing interview-coaching article is also not an independent benchmark. The strongest diligence priorities are therefore current privacy terms, consent and deletion controls, bias and validation studies, human-appeal procedures, uptime history, security certifications, and a versioned product roadmap."
    claimRefs:
      - "CE006"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE014"
