      - ["Enterprise-agent evaluation", "Human grading, test design, fine-tuning feedback, and production validation", "Enterprise application software unrelated to model evaluation", "Enterprise product or AI leader", "Management-identified expansion segment"]
      - ["Robotics pre-training", "Human demonstrations, teleoperation traces, and action annotation", "Robot hardware, actuators, batteries, and deployment integration", "Robotics lab or embodied-AI team", "Early adjacency with substantial deployment constraints"]
      - ["Proprietary corporate corpora", "De-identified workflow records, code, communications, and task trajectories", "Consumer profiles and sensitive records that cannot be lawfully transferred", "AI lab acquiring training or evaluation corpora", "Transaction-led source of differentiated data"]
      - ["Synthetic and reusable datasets", "Automated descriptions and datasets licensed to multiple customers", "Bespoke expert labor that cannot be reused", "AI-lab data procurement team", "Potentially higher-margin substitute and complement"]
      - ["Expert-vetting infrastructure", "Automated interviews, specialist matching, payroll, compliance, and quality telemetry", "Standalone general recruiting and unmanaged freelance marketplaces", "AI-lab data operations team", "Embedded delivery layer rather than a separate TAM"]
    notes: >-
      Boundary is evidence-constrained and qualitative; categories overlap and
      must not be added as independent markets.
    claimRefs: [CM001, CM002, CM004, CM006, CM012, CM015]
  - id: TM002
    title: Market and demand sizing lenses
    columns:
      - Publisher
      - Period
      - Geography
      - Metric and value
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["TechCrunch", "December 2025", "Not specified", "Human-generated AI training data: $10B-$15B current; nearly $100B within two years", "Founder estimate reported in interview", "Low", "No disclosed methodology, geography, denominator, or independent validation"]
      - ["TechCrunch", "December 2025", "Company-level; geography not specified", "micro1 claimed more than $100M ARR", "Founder-reported company metric", "Medium", "ARR is not total market size and was not independently audited"]
      - ["TechCrunch and Sacra", "August 2026", "Company-level; geography not specified", "$500M gross or annualized run rate", "Person familiar with company; separate analyst estimate", "Medium", "Publishers use different metric labels; gross run rate is not net revenue or ARR"]
      - ["TechCrunch", "August 2026", "Company-level; geography not specified", "$150M-$200M net annual run rate after retaining roughly 60%-70% of gross", "Person familiar with company finances", "Medium", "Private-company run-rate report, not audited recognized revenue"]
      - ["Fortune", "September 2026", "United States transaction", "$12.5M proposed cash bid for Spirit data archive", "Bankruptcy-court filing and bid comparison", "Medium", "Unsigned proposal; no sale approval and no reliable market average"]
      - ["micro1 research citing Goldman Sachs", "2035 projection", "Global", "Humanoid robot market could reach $38B", "Secondary citation in company-authored research", "Low", "Adjacent robot market is not the market for human training data"]
    notes: >-
      Metrics use the publishers' labels and periods. Company run rates,
      transaction values, and adjacent-market forecasts are separate sizing lenses
      and are not additive.
    claimRefs: [CM003, CM007, CM008, CM009, CM013]
  - id: TM003
    title: Segment, buyer, user, and payer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer or budget owner
      - Workflow
      - Adoption trigger
    rows:
      - ["Frontier AI labs", "Research or data leader", "Model trainers and evaluators", "Model-development or data budget", "Expert post-training, reinforcement learning, and output evaluation", "Need to scale specialized judgment quickly"]
      - ["Non-AI-native enterprises", "Enterprise AI or product leader", "Agent product and operations teams", "Product budget, according to management", "Test, grade, fine-tune, and continuously validate agents", "Internal agent deployment moves from pilot to production"]
      - ["Robotics and embodied-AI labs", "Robotics research or data leader", "Robot-learning engineers", "Robotics R&D or training-data budget", "Collect demonstrations, teleoperation traces, and action labels", "Models need real-world task variation and corrective behavior"]
      - ["AI labs buying proprietary corpora", "Data acquisition or research leader", "Agent-training and evaluation teams", "Training-data acquisition budget", "Acquire and de-identify operational records into trajectories", "Public human-generated text becomes scarcer and agents need workflow traces"]
      - ["Labs with internal data operations", "Research infrastructure leader", "Internal expert and annotation teams", "Software, seat, or data-credit budget", "Use tool-first pipelines instead of a managed labor vendor", "Control or cost advantages justify insourcing"]
    notes: >-
      Buyer and budget ownership are inferred from source-described workflows;
      purchaser-side procurement documents were not available.
    claimRefs: [CM002, CM004, CM005, CM006, CM010, CM012, CM016]
figures:
  - id: FM001
    title: Evidence-constrained market expansion layers
    type: pyramid
    summary: >-
      The opportunity broadens from observed frontier-lab demand into progressively
      less quantified enterprise, robotics, corpus, and reusable-data adjacencies.
    data:
      items:
        - label: Frontier-lab expert data
          detail: Current demand supported by independent reporting and company scale signals.
          tone: positive
        - label: Managed evaluation infrastructure
          detail: Vetting, quality assurance, payroll, and compliance expand spend captured per engagement.
          tone: positive
        - label: Enterprise-agent evaluation
          detail: Management-proposed expansion into continuous testing and validation for internal agents.
          tone: neutral
        - label: Robotics demonstrations
          detail: Human demonstrations, teleoperation, and action annotation create new modalities.
          tone: neutral
        - label: Proprietary corporate corpora
          detail: Recent transaction activity signals demand but privacy and approval constraints are material.
          tone: warning
        - label: Synthetic and reusable datasets
          detail: Reusable data may expand margins while substituting for some bespoke human labor.
          tone: warning
    approximationNotes: >-
      Layers are ordered qualitatively from directly observed demand to less
      quantified adjacencies; they do not represent TAM, SAM, SOM, probability,
      market share, or additive dollar values.
    claimRefs: [CM002, CM004, CM006, CM012, CM014, CM015]
callouts:
  - calloutType: risk
    title: Sizing remains management-led
    body: >-
      The $10B-$15B current-market and nearly $100B two-year outlook lacks a
      disclosed geography, denominator, or independent methodology; use reported
      company run rates and transactions as demand evidence, not as a TAM proxy.
    claimRefs: [CM003, CM008, CM013]
  - calloutType: insight
    title: Gross and net run rates are not interchangeable
    body: >-
      TechCrunch reported a $500M gross annual run rate but only a $150M-$200M net
      annual run rate after the share paid through to experts; neither should be
      relabeled as audited revenue or ARR.
    claimRefs: [CM008, CM009]
