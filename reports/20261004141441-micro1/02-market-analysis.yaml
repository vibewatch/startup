schemaVersion: "report-v2"
artifact: market-analysis
slug: micro1
runDate: 2026-10-04
company:
  name: micro1
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    micro1 addresses the human-data and evaluation layer around frontier-model
    training, with reported demand concentrated among leading AI labs.
    Enterprise-agent evaluation, robotics demonstrations, proprietary corporate
    records, and reusable synthetic datasets expand the opportunity, but the
    available evidence does not support a geography-specific SAM or attainable SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market is narrower than "AI data" in general. micro1 describes
      itself as a data lab for frontier-model training and agent evaluation, while
      independent reporting places its current center of gravity in recruiting and
      managing domain experts for post-training, reinforcement learning, and model
      evaluation. Included spend therefore covers expert sourcing, vetting, secure
      task execution, quality assurance, human feedback, and adjacent training-data
      production. It excludes foundation-model compute, model licenses, general
      recruiting, and robot hardware. The status quo is not only another managed
      vendor: labs can assemble internal expert networks or buy tool-first workflow
      software. Synthetic and reusable datasets may also substitute for some
      bespoke labor, although reported margin expansion suggests micro1 can
      participate in that substitution rather than merely suffer from it.
    claimRefs: [CM001, CM002, CM010, CM015]
    tableRefs: [TM001]
  - id: sizing-without-false-precision
    title: Sizing through observable demand signals
    body: >-
      The evidence does not justify a conventional TAM/SAM/SOM waterfall. The only
      broad category estimate is management's claim that human-generated AI
      training data could expand from $10 billion-$15 billion to nearly $100
      billion within two years; a derivative outlet repeats that thesis but does
      not provide independent methodology. Stronger bottom-up signals are company
      scale and actual transactions: two independent publications placed micro1
      at a $500 million gross or annualized run rate in August 2026, TechCrunch
      separated that from a $150 million-$200 million net annual run rate, and
      Fortune reported both a $12.5 million bid for Spirit Airlines' archive and
      more than 50 recent data transactions claimed by micro1. These observations
      demonstrate demand, not total addressable spend, and should not be summed.
    claimRefs: [CM003, CM008, CM009, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-budget-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      Frontier AI labs are the clearest current buyer, with research or data
      leaders paying for managed expert capacity used by model-training and
      evaluation teams. The next proposed buyer is a non-AI-native enterprise
      building agents for support, finance, or industry workflows; management
      expects product budgets to fund continuous testing, grading, fine-tuning,
      and production validation. Robotics labs form a distinct segment because
      they need demonstrations, teleoperation traces, and structured action
      annotation rather than only text labels. Corporate data sellers are supply
      partners rather than end buyers, while AI labs remain the ultimate payer for
      de-identified operational records. Sacra's under-48-hour time-to-hire
      description provides an adoption mechanism, but purchaser-side procurement
      evidence is absent.
    claimRefs: [CM002, CM004, CM005, CM006, CM010, CM012, CM016]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation-relevance
    title: Drivers, constraints, and valuation relevance
    body: >-
      Growth is driven by larger model-training budgets, the continuing need for
      expert judgment, emerging agent-evaluation workflows, and demand for
      proprietary records that preserve how work is performed. Robotics broadens
      the data modalities, but micro1's own research also notes modest real-world
      humanoid deployment, safety and standards gaps, and short battery runtimes;
      those constraints delay the associated data opportunity. Concentration
      among a small number of well-funded labs creates budget-cycle and insourcing
      risk. Privacy is another adoption constraint: objections to the proposed
      Spirit data transfer and the absence of court approval show that access to
      valuable corpora depends on de-identification, contractual controls, and
      regulatory acceptance. Valuation should therefore distinguish observed
      current lab demand from management's unvalidated enterprise-budget forecast
      and the still-early robotics adjacency.
    claimRefs: [CM006, CM007, CM011, CM014, CM015]
