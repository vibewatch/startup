    body: "Micro1 faces fierce pressure from larger competitors like Mercor ($2B run rate) and Handshake ($1B run rate) who possess larger balance sheets and deeper relationships with frontier labs [CP001]. Furthermore, synthetic data generation could commoditize human-in-the-loop annotation margins over time [CP001]."
