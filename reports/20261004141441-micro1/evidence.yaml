evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Audited Financial Statements and Margin Structure
    missingEvidence: Audited GAAP financial statements, gross margin breakdowns between synthetic and expert data, and net cash burn.
    whyItMatters: >-
      Reported gross run rates ($500M) differ substantially from net retained revenue ($150M-$200M), leaving actual
      profitability and runway unverified.
    diligencePath: >-
      Request audited 2024-2025 financial statements, general ledger detail, and trailing-twelve-month bank
      reconciliation records in diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: Complete Executive Leadership and Board Composition
    missingEvidence: >-
      Comprehensive organizational chart including Chief Technology Officer, General Counsel, Head of Finance, and
      formal board committee seats.
    whyItMatters: >-
      Identified leadership consists primarily of the CEO and two outside board members, masking potential functional
      executive gaps in enterprise compliance.
    diligencePath: >-
      Obtain formal employee census, executive leadership bios, and board minutes detailing committee charters and
      governance appointments.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Investor Cap Table and Ownership Distribution
    missingEvidence: >-
      Fully diluted capitalization table detailing common equity, preferred share classes, liquidation preferences, and
      employee option pools.
    whyItMatters: >-
      Public records identify only round leaders and estimated ~7% Series A dilution, leaving voting control, preference
      overhang, and investor rights opaque.
    diligencePath: >-
      Review certified capitalization table from company counsel and Series A investors' rights agreement during
      confirmatory diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      Independent segment revenue, geography, buyer counts, pricing, and adoption data needed to derive a bounded SAM
      and attainable SOM.
    whyItMatters: Management's broad market forecast cannot establish the spend pool that micro1 can actually serve or capture.
    diligencePath: >-
      Obtain paid analyst methodologies, customer-level spend cohorts, regional revenue mix, and micro1 pipeline
      conversion by buyer segment.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-budgets
    missingEvidence: >-
      Purchaser-side budgets, contracts, renewals, and production deployment evidence validating the forecast allocation
      to evaluation and human data.
    whyItMatters: >-
      The 25% product-budget forecast is management-led and could materially overstate the timing and size of enterprise
      adoption.
    diligencePath: >-
      Review anonymized enterprise contracts, procurement owners, pilot-to- production conversion, retention, and
      budget-source documentation.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: internal-data-curation-risk
    missingEvidence: >-
      Direct disclosures from frontier AI labs (OpenAI, Anthropic, Google) detailing whether they plan to internalize
      data annotation tooling versus continuing third-party procurement.
    whyItMatters: >-
      Internalization by top foundation model labs would compress external contract demand and cap Micro1's market
      expansion.
    diligencePath: >-
      Interview procurement leads and AI data operations directors at frontier model labs regarding future vendor
      consolidation plans.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: material
    topic: technical-evidence-gap
    missingEvidence: Primary architecture, API, integration, status, uptime, support, version history, and roadmap documentation.
    whyItMatters: >-
      Without these materials, product integration cost, operational maturity, failure modes, and roadmap execution
      cannot be underwritten.
    diligencePath: >-
      Request current product documentation, a versioned roadmap, reference architecture, data-flow diagram, API
      specifications, support policy, and twelve months of uptime and incident records.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: security-and-privacy
    missingEvidence: >-
      Current privacy terms, consent and deletion controls, subprocessor list, security certifications, penetration-test
      results, retention schedules, and tenant-isolation controls.
    whyItMatters: >-
      The product handles candidate identity, voice, video, resumes, and potentially customer-confidential work, making
      control design central to adoption and liability.
    diligencePath: >-
      Review the trust package and current candidate terms under NDA, then test consent, deletion, access control,
      encryption, and incident-response procedures.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: assessment-validity
    missingEvidence: >-
      Independent validation of screening accuracy, bias, accessibility, calibration, false-positive rates, and human
      appeal outcomes.
    whyItMatters: >-
      AI-assisted vetting is a core product surface, but deployment alone does not establish valid or equitable hiring
      decisions.
    diligencePath: >-
      Obtain model cards, rubric versions, validation cohorts, subgroup analyses, override logs, and enterprise customer
      references.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: enumeration-incomplete
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named AI-data customers with use case, deployment stage, contract scope, reference contact, and measured
      production outcome.
    whyItMatters: >-
      Anonymous demand and partner narratives cannot establish reference quality, production adoption, or repeatability
      across customer segments.
    diligencePath: >-
      Obtain the customer roster and select at least three accounts for reference calls, then reconcile their deployment
      dates and outcomes to contracts and invoices.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort expansion, top-5 customer share, and
      project-versus-recurring revenue mix.
    whyItMatters: >-
      Run-rate growth can coexist with weak retention or customer concentration, so public scale signals do not
      establish durable revenue quality.
    diligencePath: >-
      Review monthly account-level revenue cohorts, executed contracts, renewal schedules, churn reasons, and customer
      concentration for the prior 24 months.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: procurement
    missingEvidence: >-
      Zara pricing units, package inclusions, minimum term, implementation fees, support terms, and account-level
      expansion behavior.
    whyItMatters: >-
      Without commercial terms, the recruiting product's procurement friction, payback, and land-and-expand economics
      cannot be assessed.
    diligencePath: >-
      Obtain a current order form and pricing schedule, then test unit economics against completed interviews, recruiter
      time saved, implementation effort, and renewal history.
    relatedQuestionRefs:
      - QU005
      - QU007
  - type: stale
    severity: material
    topic: data-rights
    missingEvidence: >-
      The final Spirit Airlines auction order, transaction outcome, dataset scope, and permitted-use restrictions after
      the reported September 2026 hearing.
    whyItMatters: >-
      Without the later docket outcome, the report cannot determine whether Micro1 acquired the data or what legal and
      privacy conditions apply.
    diligencePath: >-
      Obtain the complete bankruptcy docket and final sale order, then reconcile the acquired asset schedule and
      restrictions to Micro1's data inventory.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: privacy-security-controls
    missingEvidence: >-
      First-party privacy, DPA, subprocessor, security certification, incident, data-rights, deletion, and AI-hiring
      control records.
    whyItMatters: >-
      A third-party compliance label does not establish applicability, operating effectiveness, or the absence of
      incidents.
    diligencePath: >-
      Review policies, DPAs, audit and penetration-test reports, incident register, rights-request metrics, model
      documentation, and counsel opinions in the data room.
    relatedQuestionRefs:
      - QR001
      - QR007
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: blocking
    topic: financial-and-concentration-controls
    missingEvidence: >-
      Audited revenue, gross-to-net reconciliation, cash, burn, working capital, customer concentration, expert
      concentration, renewals, and capitalization records.
    whyItMatters: >-
      Public run rates do not establish recognized revenue, ARR, cash generation, liquidity, retention, or resilience to
      the loss of a material buyer or expert cohort.
    diligencePath: >-
      Reconcile contracts, invoices, contractor payments, bank statements, audited accounts, customer and expert
      cohorts, and the fully diluted capitalization table.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR005
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: model-quality
    missingEvidence: >-
      Independent replication of Realm and customer-specific production quality, acceptance, rework, override, and
      loss-event data.
    whyItMatters: >-
      A company-issued benchmark can identify task risk but cannot independently verify Micro1's production controls or
      customer outcomes.
    diligencePath: >-
      Commission benchmark replication and sample production engagements by use case, including blinded human baselines
      and documented failure escalation.
    relatedQuestionRefs:
      - QR002
      - QR006
    relatedTableRefs:
      - TR002
  - type: conflicting-data
    severity: material
    topic: gross-to-net
    missingEvidence: >-
      A reconciled schedule linking gross billings, contractor payouts, recognized revenue, ARR, gross profit, and cash
      collection for the same period.
    whyItMatters: >-
      The public retention percentage and net run-rate values do not reconcile, so valuation multiples and margin
      scenarios cannot be underwritten reliably.
    diligencePath: >-
      Obtain audited financial statements, monthly billing-to-revenue reconciliations, and customer-level
      contribution-margin schedules from management.
    relatedQuestionRefs:
      - QV002
      - QV005
    relatedTableRefs:
      - TV002
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      The latest term sheet, charter, fully diluted cap table, option pool, liquidation waterfall, cash balance, burn,
      and runway.
    whyItMatters: >-
      A headline post-money valuation does not establish the value or downside protection of the security an investor
      would receive.
    diligencePath: >-
      Require counsel-certified capitalization records and model proceeds across downside exits, including all
      preference and anti-dilution provisions.
    relatedQuestionRefs:
      - QV004
      - QV010
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      An IPO-readiness plan, secondary transaction evidence, credible strategic-buyer interest, and a return model tied
      to security terms and hold period.
    whyItMatters: >-
      Without a realizable exit path and security-level waterfall, neither a target return nor a defensible hold period
      can be estimated.
    diligencePath: >-
      Review board materials, banker engagement, secondary transfer records, strategic outreach, and management's
      security-level exit waterfall.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
