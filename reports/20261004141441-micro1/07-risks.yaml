company:
  name: "micro1"
chapter:
  number: 7
  title: "Risks"
  summary: "The clearest observable risk is data-rights governance: a proposed $12.5 million acquisition of Spirit Airlines data drew former-employee concerns and remained unapproved in the available August 2026 account. Operational scale, model-output reliability, dataset reuse, and inconsistent third-party funding totals add material diligence gaps, while public evidence of mature mitigations is limited."
sections:
  - id: "regulatory-legal-risk"
    title: "Data rights are the highest observable legal exposure"
    body: "The strongest adverse evidence is not a recorded enforcement action but an unresolved data-rights dispute. Digital Watch reported that Micro1 submitted a $12.5 million late offer for Spirit Airlines bankruptcy data after Google had been declared the $10 million winner. The same account said the federal court had not approved the result and postponed its hearing after former flight attendants questioned how their data could be used. This supports a high-impact privacy and provenance risk, but it does not establish that Micro1 violated a law or that the transaction ultimately closed. A marketplace listing names HIPAA, CCPA, and CPRA, yet the assigned evidence contains no first-party privacy policy, DPA, certification, court order, or later docket outcome. Legal status, permissible-use rights, consent, deletion obligations, and buyer accountability therefore remain diligence items rather than confirmed controls."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-quality-risk"
    title: "Fast scaling raises control and quality demands"
    body: "TechCrunch reported, through a person familiar with the company, that gross annual run rate increased from $100 million to $500 million in eight months and that Micro1 retained roughly 60% to 70% of gross billings, yielding a $150 million to $200 million net annual run rate. These are run-rate measures, not audited revenue or cash, and the source does not disclose customer concentration, working capital, contractor liabilities, or cash burn. Micro1's own Realm benchmark also shows why quality controls matter: 103 finance tasks and 927 rollouts produced sub-50% performance on judgment-heavy work, with decision and recommendation performance around 25% to 30%. The benchmark is company-issued and not evidence of Micro1 product defects, but it makes human review, task-level acceptance tests, and traceable QA essential when deliverables affect consequential decisions."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR002"
  - id: "partner-financial-risk"
    title: "Expert supply, customer demand, and disclosure quality remain dependencies"
    body: "Micro1 describes itself as a data lab built around human expertise, while TechCrunch says the model uses contracted doctors, lawyers, scientists, and other specialists. That creates a delivery dependency on recruiting, vetting, retaining, and paying an expert network at the same time that contract volume is reportedly accelerating. The company also advertises AI-assisted candidate screening and says human decision-making remains in the loop; the available material does not provide bias audits, false-rejection rates, or worker-retention data. Dataset reuse creates another dependency: TechCrunch reported potential 80% to 90% gross margins for off-the-shelf data but also described criticism of selling the same datasets to multiple clients. Finally, third-party funding snapshots conflict at $35 million-plus versus $142 million, preventing a reliable conclusion about capital available to absorb execution shocks."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "mitigations-kill-criteria"
    title: "Mitigations, monitors, and thesis-break conditions"
    body: "Mitigation maturity should be treated as unverified until management supplies control evidence. For data rights, require dataset-level provenance, consent or other lawful-use basis, purpose limitations, deletion mechanics, court approvals where relevant, and customer-facing contractual restrictions. For quality, monitor task acceptance, rework, expert disagreement, model-to-human escalation, and repeatability by use case; a company-issued benchmark is useful for scoping tests but not independent assurance. For dependencies, reconcile gross billings to net recognized revenue, disclose customer and expert concentration, and reconcile financing records to bank statements and the capitalization table. The investment thesis should break if management cannot evidence durable rights to material datasets, if judgment-heavy outputs remain below the benchmark's 50% usability threshold without mandatory human review, if a material customer loss cannot be absorbed, or if financing and liquidity cannot be reconciled from primary records."
    claimRefs:
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR009"
      - "CR012"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
