  topStrengths:
    - Telegram-native distribution plus TON exclusivity create unusual user-acquisition leverage.
    - "TOP controls multiple strategic rails at once: Wallet in Telegram, Tonkeeper, TON Connect, and TON API."
    - Public product metrics show meaningful ecosystem reach, including 100M+ wallet users and 235M+ aggregate portfolio users.
    - Ribbit and Pantera backing validate the strategic importance of the Telegram-TON corridor.
  topRisks:
    - Public sources disclose no revenue, ARR, margin, headcount, or board-level governance map.
    - Headquarters, incorporation, and operator-versus-holdco structure remain ambiguous.
    - TOP is highly dependent on Telegram policy, TON ecosystem health, and related regulatory outcomes.
    - Reported equity percentages do not obviously reconcile with the headline $1B valuation.
  unresolvedGaps:
    - Exact legal-entity map, board composition, and ownership percentages across TOP and TOP Labs.
    - Revenue mix and monetization by product line across Wallet, TON API, TON Connect, and portfolio holdings.
    - Headcount, burn, runway, gross margin, and net retention metrics.
    - Exact headquarters and jurisdiction-by-jurisdiction licensing status for US and EU expansion.
