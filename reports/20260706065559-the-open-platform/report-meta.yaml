companyProfile:
  summary: >-
    The Open Platform (TOP) is a UAE-based operator and venture builder focused on turning TON into
    Telegram's default crypto and Mini App stack. It combines consumer distribution through Wallet in
    Telegram with developer and wallet infrastructure such as TON Connect, TON API, TON Tech, and the
    acquired Tonkeeper stack, while TOP Labs incubates and backs adjacent products including STON.fi,
    Getgems, Tribute, and other ecosystem projects. The company became the first unicorn publicly
    associated with Telegram's TON ecosystem after a $28.5M extended Series A in July 2025, but the
    public record still offers far more product and user evidence than financial disclosure.
  founders:
    - name: Andrew Rogozov
      role: Founder & CEO
      background: Former VK executive who joined TON Foundation in 2022, helped build Tonkeeper, then launched First Stage Labs before the 2023 rebrand into TOP.
      claimRefs: [CO012, CO013, CO014, CO043]
  foundingLocation: United Arab Emirates
  headquarters: Dubai, UAE (with Abu Dhabi also cited by third-party profiles)
  productSummary: >-
    Hybrid platform model combining Wallet in Telegram, Tonkeeper, TON Connect, TON API, TON Tech,
    and related developer kits with a venture-builder portfolio for payments, swaps, NFTs, creators,
    and Mini Apps on TON.
  customerFocus: >-
    Developers building Telegram Mini Apps and TON dApps, wallet users, ecosystem startups,
    creators, merchants, and other consumer-finance or gaming products that need Telegram-native
    crypto rails.
  businessModel: >-
    A hybrid operator-plus-venture-builder model that appears to monetize wallet and infrastructure
    services, transaction-related products, and portfolio equity value, although the public revenue
    mix remains undisclosed.
  stage: Private, post-Series-A unicorn
  fundingStatus: >-
    $28.5M extended Series A at a $1B valuation in July 2025 led by Ribbit Capital with Pantera
    participating; PR Newswire says disclosed total funding is over $70M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO017, CO031, CO032, CO045, CO049, CO052, CO055]
