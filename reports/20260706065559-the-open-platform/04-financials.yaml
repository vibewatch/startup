tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Custodial wallet trading and swaps
    - In-app trading, swaps, and conversion flows inside Wallet
    - Spread, execution fee, or partner revenue share
    - Clearly live; Wallet Trade broadened assets beyond TON, BTC, and USDT
    - High-frequency and scalable if active users convert, but realized take rate is undisclosed
    - Request net spread, partner economics, and volume by asset class
  - - Self-custodial DeFi yield products
    - Vaults and staking-like yield access inside DeFi Account
    - Yield spread, referral economics, or service fee share
    - Clearly live with published APY ranges and named infrastructure partners
    - Potentially sticky balance-based economics, but APY to user does not reveal TOP margin
    - Request spread retention, treasury risk, and economics by vault
  - - Cross-chain deposits and withdrawals
    - Funding rails that move assets into TON and back out via partners
    - Conversion spread, service fee share, or ramp economics
    - Clearly live for stablecoins and major crypto assets
    - Useful onboarding lever, but public pricing focuses on user simplicity rather than TOP revenue
    - Request conversion economics, MoonPay rev share, and cross-chain cost per funded wallet
  - - Perpetual futures trading
    - Advanced leveraged trading through Lighter inside Wallet
    - Trading fee share, spread capture, or liquidity incentives
    - Clearly live with 50+ assets and up to 50x leverage
    - Could be high-value activity if user adoption holds, but also higher compliance and risk burden
    - Request perps volume, active traders, liquidation economics, and compliance cost
  - - Tokenized stocks and ETFs pilot
    - Buy, hold, send, and trade tokenized equities/ETFs in Telegram
    - Trading fee share, spread, custody economics, or issuer partnership revenue
    - Pilot is live in Uzbekistan with 60+ assets and $1 minimum entry
    - Potentially broadens wallet monetization beyond crypto-native activity
    - Request pilot volumes, conversion rate, and economics with Kraken/xStocks/Backed
  - - Developer infrastructure
    - TON API, TON Connect, TAC, and related tooling for app builders
    - Contract revenue, usage-based billing, or ecosystem monetization
    - Product scale proxies are public; pricing is not
    - Could create recurring B2B-style economics, but contracts are entirely undisclosed
    - Request pricing model, customer count, churn, and gross margin by tool
  - - Venture and portfolio exposure
    - TOP Labs invests in or incubates adjacent TON products
    - Equity appreciation, token exposure, internal transfer pricing, or distribution value
    - Portfolio breadth is public; financial contribution is not
    - Could create optionality but also complicates segment reporting and capital allocation
    - Request cap table by subsidiary/portfolio company and fair-value methodology
  notes: Public sources reveal multiple monetization lanes, but none quantify TOP's own net revenue capture, contract terms, or accounting treatment by lane.
