- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public best available proxy
  - Why it matters
  - Exact diligence path
  rows:
  - - Revenue and ARR by product
    - Wallet users, transaction proxies, and portfolio reach only
    - Without revenue by lane, it is impossible to test quality, mix, concentration, or seasonality
    - Request audited or board-level revenue bridge by wallet, infrastructure, and portfolio segments
  - - Realized pricing and take rates
    - 0% USDT fee, 1:1 stablecoin conversion, APY ranges, and feature launches only
    - List mechanics do not show what TOP actually captures economically
    - Request partner agreements, fee schedules, and gross-to-net realization by workflow
  - - Gross margin and COGS split
    - No direct disclosure; only product and partnership hints
    - Margin path is central to underwriting a wallet-plus-infrastructure business
    - Request COGS split across compliance, custody, partner fees, cloud, support, and liquidity
  - - Cash, burn, and runway
    - 2025 raise plus active expansion narrative
    - Needed to judge financing dependency and dilution risk
    - Request latest balance sheet, monthly burn, and runway under base/downside cases
  - - Cap table and legal-entity map
    - Abu Dhabi incorporation reported externally; TOP legal pages omit the named entity
    - Ownership structure affects valuation comparability and governance risk
    - Request incorporation documents, subsidiary list, and fully diluted cap table
  - - External validation of regulatory claims and product economics
    - Official launch pages and one CNBC report
    - Licensing and compliance costs can dominate early monetization in regulated markets
    - Request regulator confirmations, license terms, and product P&L by geography
  notes: These are the highest-value gaps preventing the current chapter from moving from attractive public activity proxies to a fully underwritten financial view.
