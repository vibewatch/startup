- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer lane
  - Public price or monetization signal
  - List vs. realized pricing
  - Unknowns
  - Evidence
  rows:
  - - USDT purchase flow
    - 0% fees on USDT purchases in U.S. launch messaging
    - Promotional end-user price, not proof of TOP margin
    - Whether TOP subsidizes this, earns elsewhere, or relies on partner economics
    - U.S. TON Wallet launch page and CNBC coverage
  - - Cross-chain stablecoin funding
    - 1:1 USDC/USDT conversion into USDT (TON), subject to network/service fees
    - Mechanics are public; TOP's retention is not
    - Net take rate after MoonPay and network costs
    - Cross-chain deposits announcement
  - - USDT yield vaults
    - Up to 18% blended APY
    - User-facing yield disclosure, not TOP revenue disclosure
    - Spread retained by TOP or partners and any subsidy duration
    - Vaults announcement
  - - ETH and BTC vaults
    - Up to 3% ETH APY and 2% BTC APY
    - User-facing return metric only
    - Custody, hedging, and partner fee economics
    - Vaults announcement
  - - Perpetual futures
    - 50+ tradable assets and up to 50x leverage
    - Capability disclosure, not fee disclosure
    - Maker/taker economics, liquidation revenue, and partner split
    - Perpetual futures launch announcement
  - - Tokenized stocks pilot
    - $1 minimum entry and 60+ assets
    - Consumer access signal, not enterprise economics
    - Trading spread, settlement fees, custody economics, and issuer rev share
    - Crypto Stocks launch announcement
  - - Developer tooling
    - Usage scale is public (100K RPS, 100M+ connections, $240M monthly transactions), but no rate card is public
    - No list pricing disclosed
    - Contract size, billing metric, enterprise discounts, and churn
    - TON API and TON Connect toolkit pages
  notes: The public price signals are real but promotional; they show how TOP lowers user friction without revealing what TOP actually earns per transaction, balance, or enterprise integration.
