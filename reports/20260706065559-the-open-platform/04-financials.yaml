  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Exact transaction take rates, partner revenue-share terms, and enterprise pricing across wallet, perps, stocks, and infrastructure products.
    whyItMatters: TOP's public product breadth is impressive, but without realized pricing the activity proxies cannot be converted into revenue quality or margin durability.
    diligencePath: Request sample contracts, fee schedules, partner agreements, and product-level gross-to-net revenue realization.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI001
    - TI002
  - type: conflicting-data
    severity: material
    topic: valuation-reconciliation
    missingEvidence: A primary explanation for why a $28.5M raise for about 5% equity is being described as a $1B valuation event.
    whyItMatters: Valuation comparability affects dilution analysis, investor signaling, and whether the headline should be trusted as an underwriting anchor.
    diligencePath: Request the signed term sheet, post-close cap table, and management explanation of whether the valuation is fully diluted, secondary-adjusted, or otherwise non-comparable.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: Current cash balance, monthly burn, runway, debt schedule, and any covenants or project-finance obligations.
    whyItMatters: Capital adequacy cannot be underwritten from funding history alone; investors need to know how much cash is left and how fast it is being consumed.
    diligencePath: Request the latest balance sheet, monthly cash-burn bridge, debt agreements, and board runway scenarios.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: legal-entity-map
    missingEvidence: Primary incorporation documents and a current legal-entity map showing how TOP, Wallet in Telegram, TOP Labs, and toolkit assets are owned.
    whyItMatters: A venture-builder structure can hide materially different economics, liabilities, and minority interests than a single operating company.
    diligencePath: Request incorporation certificates, subsidiary schedule, shareholder register, and fully diluted cap table by major entity.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: metric-to-revenue-conversion
    missingEvidence: An internal bridge from wallet activations, connections, and TON ecosystem activity to TOP-recognized revenue and gross profit.
    whyItMatters: The strongest public metrics are still only proxies until management shows what share of activity accrues economically to TOP.
    diligencePath: Request cohort-level wallet economics, take-rate waterfalls, and segment reporting that links usage to recognized revenue.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: minor
    topic: license-economics
    missingEvidence: Independent regulator confirmation of the commercial terms and ongoing compliance obligations for Uzbekistan and any U.S./EU licenses or exemptions.
    whyItMatters: Launch announcements show geographic progress, but not the recurring cost burden or restrictions attached to those markets.
    diligencePath: Request license copies, regulatory correspondence, and geography-level P&L assumptions for compliant expansion.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
