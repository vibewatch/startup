- id: traction-and-activity-proxies
  title: Traction and activity proxies
  body: |-
    Public traction is much richer than direct financial disclosure. TOP's own investment page claims 100M+ wallet users, 25+ portfolio projects, and 235M+ aggregate project users. Wallet in Telegram's U.S. rollout says more than 100M users activated TON Wallet in 2024, while CNBC says the U.S. launch alone addresses 87M domestic Telegram users. Developer tooling adds more scale markers: TON Connect claims 100M+ successful connections and $240M of monthly transactions, TON API claims 1.5K applications and 100K requests per second, and Getgems cites 4.5M+ connected wallets plus sizable voucher trading tied to Notcoin and X Empire.

    Those numbers support a strong demand and distribution narrative, but they are not revenue. Some are company-supplied, some are ecosystem-wide, and some use different definitions such as activated wallets, connected wallets, successful connections, or aggregate project users. TON network statistics and TON Foundation throughput claims confirm the ecosystem is large and busy, yet they still do not say what share of that activity accrues to TOP, whether activity is subsidized, or whether usage expands margins faster than compliance and infrastructure costs.
