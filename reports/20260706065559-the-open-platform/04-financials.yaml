company:
  name: The Open Platform (TOP)
chapter:
  number: 4
  title: Financials
  summary: TOP has unusually strong public usage and distribution proxies, but almost no direct corporate financial disclosure. The $28.5M Series A, equity-only structure, and expanding wallet/product surface suggest a transaction-led crypto platform, yet the public record does not reconcile the cited 5% equity sale with the $1B valuation headline and does not disclose revenue, margins, burn, runway, or segment economics.
sections:
- id: revenue-model-and-pricing-visibility
  title: Revenue model and pricing visibility
  body: |-
    The public record makes TOP's monetization surface legible even though it does not disclose revenue. Official TOP and Wallet in Telegram pages show a stack that spans a custodial wallet, a self-custodial DeFi account, multi-asset trading, yield products, cross-chain deposits, perpetual futures, tokenized stocks, API tooling, wallet-connect infrastructure, and a venture-style product portfolio. That mix points to a business whose economics likely come from transaction activity, partner rails, spread capture, service fees, revenue share, and infrastructure contracts rather than from a plain SaaS seat model.

    What remains opaque is realized pricing. The retained sources reveal promotional price points and consumer-facing terms — 0% fees on USDT purchases, 1:1 stablecoin conversion mechanics, APY ranges on vaults, a $1 starting ticket for tokenized stocks, and leverage limits on perpetuals — but they do not reveal TOP's own net take rate, revenue-recognition policy, partner rev-share terms, or product-level gross margin. The result is a chapter that can explain how usage may convert into revenue, but not how efficiently TOP captures that value for itself.
  claimRefs:
