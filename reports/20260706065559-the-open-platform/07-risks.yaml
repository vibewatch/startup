    {
      "id": "ecosystem-and-platform-dependency",
      "title": "Telegram, TON Foundation, and ecosystem concentration risk",
      "body": "TOP is not distributing a neutral wallet across many channels. By its own framing, it is using Telegram as the distribution channel and TON as the underlying on-chain substrate to onboard a billion users. The January 2025 TON-Telegram expansion made that dependence even tighter by forcing TON Connect onto blockchain-enabled mini apps and preserving Toncoin as the only non-fiat payment rail for major Telegram platform services. TOP's own portfolio history deepens the concentration: it built around Wallet in Telegram, later assumed leadership of Tonkeeper, and remains tied to TON-native apps like STON.fi and Getgems through TOP Labs. That architecture can be powerful when Telegram and TON are growing together, but it also means partner policy, Mini App rules, or TON Foundation decisions can change distribution economics overnight. The independent backlash from builders is important because it shows this concentration is not just theoretical; it is already controversial enough to provoke migration pressure and ecosystem resentment.",
