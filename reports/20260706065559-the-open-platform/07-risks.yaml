    {
      "id": "custody-security-and-market-structure",
      "title": "Custody, security, compliance operations, and token-market structure",
      "body": "The operational risk stack is messy because TOP is trying to mix a consumer-grade Telegram experience with radically different trust models. Crypto Wallet's agreement permits freezes and law-enforcement intervention, while TON Wallet and Tonkeeper push key control and recovery failure onto users. STON.fi adds smart-contract execution risk and sanctions restrictions on top of that. The result is not simply 'self-custody good, custody bad'; it is a split-surface problem in which the company still owns user experience, distribution, and reputation even when private-key control sits elsewhere. The DOGS-driven TON outages in August 2024 are especially important because they show this ecosystem can buckle when speculative demand spikes, and Cointelegraph reported that Wallet in Telegram users felt those effects directly. TOP also keeps widening asset exposure to USDT, tokenized gold, stocks, ETFs, and DeFi-yield surfaces, so a wallet failure or compliance error is no longer confined to one token or one narrow use case.",
