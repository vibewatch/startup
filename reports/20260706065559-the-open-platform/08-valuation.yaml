- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric or snapshot
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - TOP (disclosed round)
    - Extended Series A, July 2025
    - $1.0B valuation; $28.5M raised; >$70M total funding
    - Shows investors will pay for Telegram and TON strategic optionality.
    - No public revenue, margin, or cap-table bridge.
  - - QuickNode
    - Private crypto-infrastructure peer, Jan. 2023
    - $800M valuation; $60M Series B; 200B API requests monthly; 99.99% uptime
    - Closest disclosed benchmark for a blockchain-infrastructure platform with operating scale proof.
    - Older market window and purer infra model than TOP.
  - - Alchemy
    - Private blockchain-infrastructure leader, Oct. 2021
    - $3.5B valuation; $250M Series C; 15x revenue growth in prior six months
    - Upper-end benchmark for premium Web3 infra with explicit growth and scale claims.
    - Bull-market timing and much clearer disclosed scale than TOP.
  - - Coinbase
    - Public crypto platform, July 2026
    - $43.59B market cap on $6.56B TTM revenue (~6.6x)
    - Useful floor for crypto-platform distribution economics.
    - Exchange model and public-market liquidity differ sharply from TOP.
  - - Robinhood
    - Public consumer finance platform, July 2026
    - $101.51B market cap on $4.61B TTM revenue (~22.0x)
    - Helpful lens for consumer distribution optionality and wallet-like engagement.
    - Brokerage regulation and product mix differ from TOP.
  - - Datadog
    - Public infra-software platform, July 2026
    - $92.67B market cap on $3.67B TTM revenue (~25.3x)
    - Premium infrastructure-software benchmark for disclosed recurring revenue.
    - Non-crypto enterprise software with far richer disclosure.
  - - Cloudflare
    - Public edge platform, July 2026
    - $86.04B market cap on $2.16B TTM revenue (~39.8x)
    - Useful ceiling for platform-quality software multiples.
    - Enterprise maturity and disclosure quality are well above TOP.
  - - DigitalOcean
    - Public cloud-infra provider, July 2026
    - $13.58B market cap on $0.94B TTM revenue (~14.4x)
    - Mid-band infrastructure reference that sits below top-tier software premiums.
    - Not crypto, and still more transparent than TOP.
  notes: Coverage is partial because direct wallet and Telegram-mini-app peers rarely publish valuation plus revenue together; the table therefore mixes private Web3 rounds with public platform multiples.
  enumerationScope:
    coverage: partial
    basis: The table captures the closest disclosed private blockchain-infrastructure rounds plus representative public platform and infrastructure comps that publish both valuation and revenue data; it does not claim exhaustive wallet-peer coverage because those peers rarely disclose clean financial denominators.
