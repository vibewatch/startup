- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - No product-level revenue bridge
    - Management cannot show recurring revenue by wallet, API, and portfolio component.
    - The valuation cannot be benchmarked to either crypto-infra or public-platform comps.
    - Do not pay the $1B mark.
  - - No margin disclosure
    - Gross margin and infrastructure cost burden remain undisclosed after diligence.
    - The company could be thin-margin distribution rather than premium software.
    - Move the case back to watchlist only.
  - - Cap-table bridge fails
    - Round documents do not reconcile the $1B headline with the reported equity percentages.
    - Price integrity becomes questionable and downside protection worsens.
    - Treat the current mark as unreliable.
  - - Licensing or compliance delay
    - U.S. or EU rollout requires material new approvals or consumer-protection redesign.
    - Distribution optionality weakens and time-to-scale lengthens.
    - Cut the bull case and widen discount assumptions.
  - - Ecosystem monetization misses
    - Wallet, TON API, and TON Connect usage does not translate into paid economics.
    - TOP remains a strategic narrative rather than an operating-value story.
    - Underwrite only to the bear case or avoid.
  notes: The triggers focus on measurable diligence failures rather than narrative disappointments.
