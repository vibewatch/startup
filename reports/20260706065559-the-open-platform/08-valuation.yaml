- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Product revenue split
    - Revenue by Wallet in Telegram, Tonkeeper, TON API, and portfolio holdings.
    - This is the denominator that determines whether $1B is cheap, fair, or expensive.
    - Management finance package and legal-entity bridge.
  - - Gross margin and cost structure
    - Hosting, validator, support, compliance, and acquisition cost burden by product.
    - Premium platform multiples only hold if economics look software-like rather than subsidy-like.
    - CFO diligence session and product P&L review.
  - - Cap-table and security terms
    - Pre-money, post-money, ownership percentages, preferences, and any extension-tranche mechanics.
    - The public equity math is not internally clean today.
    - Term sheet, cap table, and counsel memo.
  - - Regional licensing map
    - Country-by-country permissions, exemptions, partner arrangements, and launch gating for the U.S. and EU.
    - Expansion optionality is only valuable if the products can legally launch and scale.
    - Compliance counsel and operating roadmap review.
  - - Usage quality
    - Active users, funded users, balances, transactions, GMV, and paid developer counts.
    - Raw ecosystem presence is less valuable than monetizing and retaining high-quality usage.
    - Product analytics export and cohort review.
  - - Intercompany economics
    - Which entities own the assets and how cash moves between TOP, TOP Labs, and product subsidiaries.
    - A hybrid venture-builder structure can trap value away from equity holders.
    - Corporate structure memo and intercompany agreement review.
  - - Regulatory legacy and token exposure
    - Any dependencies on token incentives, custody posture, or ecosystem arrangements that could change the risk profile.
    - TOP’s thesis remains entangled with Telegram, TON, and consumer-finance regulation.
    - Risk and legal memo with board-level owner.
  notes: Each ask is chosen because it can move the valuation call, not because it is generally interesting background.
