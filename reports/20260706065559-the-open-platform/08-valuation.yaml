- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Wallet and infrastructure rails already monetize at meaningful scale; U.S. and EU rollout works; portfolio flywheel consolidates into the equity story.
    - $1.0B-$1.5B; premium platform multiple can be defended if recurring revenue is already in the tens of millions and comp quality skews toward software.
    - Premium collapses quickly if monetization, margin, or structure proof is weaker than implied.
    - Possible, but not yet evidenced by public disclosure.
  - - Base
    - TOP has real strategic leverage, but economics are still opaque and the hybrid structure deserves a discount.
    - $0.5B-$0.8B; meaningful option value but not enough transparency to pay a full premium multiple.
    - Holdco discount, slower monetization, and execution friction in regulated markets.
    - Most supportable range on the current public record.
  - - Bear
    - The equity math conflict is meaningful, monetization lags, and regional compliance adds drag or delay.
    - $0.25B-$0.5B; valuation re-rates toward a more traditional early-stage or holdco framework.
    - Down-round risk, launch delays, or weaker-than-assumed portfolio economics.
    - Real downside if management cannot close the disclosure gaps fast.
  notes: These ranges are price-discipline heuristics, not a DCF; they are anchored to comparable multiples, disclosed peer scale, and TOP’s still-missing financial denominator.
