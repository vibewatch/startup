schemaVersion: report-v2
artifact: valuation
slug: the-open-platform
runDate: '2026-07-06'
company:
  name: The Open Platform (TOP)
chapter:
  number: 8
  title: Valuation
  summary: 'TOP has real platform optionality across Wallet in Telegram, Tonkeeper, TON Connect, and TON API, but the public record still supports a strategic-option narrative more than a clean operating-value case. Compared with QuickNode and Alchemy, the company discloses far less scale or economics, and one outlet’s equity percentages conflict with the headline unicorn math. Recommendation: research-more, medium confidence, high risk, valuation stretched until revenue, margin, licensing, and cap-table evidence are disclosed.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'The central valuation question is not whether TOP has interesting assets; it does. The harder question is whether public evidence justifies paying a $1 billion price for them today. The official story is attractive: TOP says it raised $28.5 million in an extended Series A, crossed $70 million in total funding, and built a portfolio that spans wallets, consumer entry points, and developer rails inside Telegram’s TON ecosystem. But the market-facing proof stops before the investor really needs it. There is still no public revenue, ARR, margin, or retention disclosure, and the July 2025 round is still the latest public valuation signal by the 2026-07-06 run date. That means the valuation is a strategic option value mark, not a clean revenue-multiple mark. Our recommendation is therefore research-more, with medium confidence, high risk, and a stretched valuation stance until the company can bridge product breadth to verifiable economics.'
