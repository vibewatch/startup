tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - Strategic optionality is real, but public operating proof is still too thin for a buy call at $1B.
    - Do not underwrite the current mark without private diligence.
  - - Confidence
    - Medium
    - The product stack is visible, but valuation support depends on undisclosed revenue, margin, and structure data.
    - Keep the name live, but do not anchor on the headline price.
  - - Risk rating
    - High
    - Regulatory shadow, hybrid holdco structure, and consumer-finance execution create real downside.
    - Require downside protection and hard diligence gates.
  - - Valuation stance
    - Stretched
    - $1B implies roughly $25M to $151M of revenue depending on the comparable multiple chosen, and TOP discloses none of it publicly.
    - Treat the current mark as a ceiling rather than a base case.
  - - What is real
    - Wallet plus infra control points
    - Wallet in Telegram, Tonkeeper, TON Connect, and TON API create ecosystem leverage.
    - Optionality is worth monitoring closely.
  - - What is missing
    - Economics and round transparency
    - No public revenue, margin, retention, or cap-table bridge closes the underwriting loop.
    - Stay in research-more until those gaps close.
  notes: The recommendation is intentionally price-sensitive rather than a generic quality score; the current issue is evidence sufficiency at the asked valuation.
