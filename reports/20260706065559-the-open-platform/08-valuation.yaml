- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Bear anti-thesis
  - What would change the view
  rows:
  - - Distribution
    - Telegram gives TOP access to a billion-user demand funnel.
    - Distribution does not matter if monetization or licensing cannot follow.
    - Show region-specific activation, paid conversion, and compliant rollout evidence.
  - - Control points
    - TOP touches wallet entry, wallet connectivity, and API rails.
    - Owning touchpoints is less valuable if revenues sit outside the equity vehicle or stay unmonetized.
    - Provide entity maps and intercompany revenue attribution.
  - - Wallet optionality
    - Tonkeeper and Wallet in Telegram can become the consumer edge of the ecosystem.
    - Self-custody and consumer-finance flows add compliance and support obligations.
    - Disclose active users, balances, transaction volumes, and regional controls.
  - - Infrastructure depth
    - TON API and TON Connect can support a platform multiple if they become indispensable rails.
    - Public proof of developer monetization is still far weaker than at QuickNode or Alchemy.
    - Show paid developer counts, net retention, and gross margin by rail.
  - - Structure
    - A portfolio and venture-builder model can compound value across products.
    - A hybrid holdco can justify a discount if value leaks across minority holdings or related parties.
    - Provide ownership percentages, consolidation policy, and cash flow paths.
  - - Price
    - The $1B mark could work if revenue is already tens of millions with premium growth.
    - Without disclosed economics, the mark is a strategic narrative price rather than an underwritten operating price.
    - Bridge the valuation to revenue, margin, and cap-table reality.
  notes: The anti-thesis is mostly about valuation support and structure, not about whether TOP has interesting products.
