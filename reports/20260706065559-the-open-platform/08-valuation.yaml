  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: product-revenue-disclosure
    missingEvidence: Audited or management-certified 2025 and 2026 revenue by product line, including Wallet in Telegram, Tonkeeper, TON API, and any portfolio or intercompany revenue.
    whyItMatters: The current public record does not show the denominator needed to test whether $1B is cheap, fair, or expensive versus crypto-infrastructure or public-platform peers.
    diligencePath: Request a product-level revenue bridge, monthly recurring revenue by major asset, and evidence that those revenues are consolidated into the legal entity sold to equity investors.
    relatedQuestionRefs:
    - QV015
    - QV028
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-disclosure
    missingEvidence: Gross margin, infrastructure cost burden, user acquisition cost, retention, and cohort quality for the wallet and infrastructure businesses.
    whyItMatters: A $1B mark can only be benchmarked intelligently if investors know whether TOP behaves more like premium software, thin-margin infrastructure, or a subsidized ecosystem distributor.
    diligencePath: Request gross profit by product, hosting and validator cost detail, paid acquisition mix, and revenue retention by cohort and geography.
    relatedQuestionRefs:
    - QV016
    - QV030
  - type: conflicting-data
    severity: material
    topic: cap-table-and-round-math
    missingEvidence: A cap-table bridge or term-sheet summary that explains how a $28.5M raise, the reported investor ownership percentages, and the headline $1B valuation fit together.
    whyItMatters: The public equity percentages imply a much lower post-money than the quoted unicorn mark unless the percentages refer to a different tranche or security structure.
    diligencePath: Request the round term sheet, fully diluted share count, pre-money and post-money tables, and any side letters or extension tranche documentation.
    relatedQuestionRefs:
    - QV017
  - type: private-evidence-only
    severity: material
    topic: regional-licensing
    missingEvidence: A jurisdiction-by-jurisdiction list of licenses, registrations, exemptions, or partner arrangements that already support the promised U.S. and EU rollout.
    whyItMatters: Distribution optionality matters far less if the company cannot legally or operationally launch its wallet and consumer-finance experiences in target regions.
    diligencePath: Request a licensing matrix, consumer-protection memo, compliance ownership map, and launch gating checklist for each target market.
    relatedQuestionRefs:
    - QV026
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage
    missingEvidence: Direct wallet and Telegram-mini-app peer valuations with disclosed revenue or usage metrics, plus any newer private re-marks for TOP’s closest ecosystem competitors.
    whyItMatters: The closest pure wallet and Telegram-native peers do not publicly disclose enough pricing or financial detail to fully triangulate TOP’s fair value.
    diligencePath: Expand the comp set with private-market data room materials, secondary broker quotes with methodology, and management-provided peer win-loss and pricing evidence.
    relatedQuestionRefs:
    - QV009
    - QV022
    relatedTableRefs:
    - TV004
