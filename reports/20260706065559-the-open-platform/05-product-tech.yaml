figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: Publicly visible layers from Telegram distribution through wallet sessioning, SDK abstraction,
      backend services, and TON settlement.
    data:
      layers:
        - label: Telegram surface
          description: Mini App shell, chat entry points, bot profile launch, and payment UI hooks
          detail: This is the user-acquisition and interaction surface that makes TOP products feel native
            inside Telegram.
        - label: Wallet edge
          description: Wallet in Telegram, Tonkeeper, custodial wallet, and self-custodial DeFi Account
          detail: TOP controls multiple wallet entry points with different custody assumptions for novice
            and advanced users.
        - label: Session and signing layer
          description: TON Connect protocol, bridges, manifests, wallet registry, and encrypted sessions
          detail: Apps request connection and signatures here without directly handling user keys.
        - label: Developer abstraction layer
          description: AppKit for dApps, WalletKit for wallets, Agentic Wallet tooling for AI flows
          detail: Higher-level SDKs package balances, transactions, swaps, and wallet lifecycle into web-style
            abstractions.
        - label: Backend and liquidity services
          description: TON API, swap integrations, staking, TON adapter or bridge services, external liquidity
          detail: Operational middleware handles chain data, wallet emulation, and cross-system connectivity.
        - label: TON settlement layer
          description: Transfers, sponsored gas, USDt, staking, smart contracts, and TON-native assets
          detail: The base chain supplies the final asset ledger and payment rails that the upper layers
            expose.
    claimRefs:
      - CE008
      - CE010
      - CE013
      - CE015
      - CE023
      - CE026
      - CE042
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: How a Telegram user or builder moves from mini-app entry to wallet connection and TON execution.
    data:
      nodes:
        - id: n1
          label: Launch Mini App
          description: User opens a Telegram Mini App from chat, profile, direct link, or attachment menu.
        - id: n2
          label: Present wallet choice
          description: App offers Wallet in Telegram, Tonkeeper, or another TON Connect-compatible wallet.
        - id: n3
          label: Establish secure session
          description: TON Connect negotiates the manifest, wallet session, and signature channel.
        - id: n4
          label: Read balances and compose action
          description: AppKit and TON API retrieve balances, assets, or quotes and prepare the transaction
            intent.
        - id: n5
          label: User or agent signs
          description: User approves the action, or an Agentic Wallet executes within its preset budget
            and limits.
        - id: n6
          label: Settle and update UX
          description: TON settles the transaction, and the Mini App updates balances, status, and next
            actions.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CE008
      - CE009
      - CE017
      - CE023
      - CE024
      - CE032
      - CE042
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: standard
    summary: Dependencies that can impair TOP products even when key custody remains user-controlled.
    data:
      nodes:
        - id: d1
          label: TOP wallet and SDK surfaces
          type: hub
        - id: d2
          label: Telegram Mini App platform
          type: distribution
          risk: Changes to Telegram launch, payment, or device APIs can reduce app reach or monetization.
        - id: d3
          label: TON Connect ecosystem
          type: protocol
          risk: Wallet coverage, bridge behavior, or manifest issues can break connection conversion.
        - id: d4
          label: TON API backend
          type: infrastructure
          risk: Backend outages or pricing changes can affect many apps simultaneously.
        - id: d5
          label: TON settlement layer
          type: blockchain
          risk: Network, asset, or fee changes propagate into every wallet and app layer above.
        - id: d6
          label: TAC adapter and bridge
          type: bridge
          risk: Bridge incidents or thin liquidity can degrade the EVM expansion thesis.
        - id: d7
          label: Parent-level concentration
          type: governance
          risk: Owning wallet and API middleware increases leverage but centralizes execution risk.
      edges:
        - from: d2
          to: d1
          label: distribution
        - from: d3
          to: d1
          label: wallet sessions
        - from: d4
          to: d1
          label: chain data
        - from: d5
          to: d4
          label: settlement source
        - from: d5
          to: d3
          label: wallet standard context
        - from: d6
          to: d1
          label: EVM access
        - from: d7
          to: d1
          label: ownership concentration
