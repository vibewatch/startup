tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Wallet in Telegram
        - Retail Telegram user
        - Live, mass-market wallet surface
        - Native chat distribution plus both self-custodial and custodial modes
        - No disclosed split of active users, assets, or revenue between DeFi Account and Crypto Wallet
      - - Tonkeeper
        - Power user, asset holder, dApp explorer
        - Live, mature non-custodial wallet
        - Self-custody UX, dApp browser, staking, swap, NFTs, gasless features
        - Need audited growth, retention, and security-operations data after TOP acquisition
      - - TON Connect
        - dApp and wallet developers
        - Mature protocol layer
        - Standardized wallet sessions across web, mobile, extensions, and Telegram Mini Apps
        - Need independent measurement of actual wallet coverage and production failure rates
      - - AppKit
        - TON app developers
        - Alpha
        - High-level wallet, asset, DeFi, and UI abstractions aligned to React or TypeScript workflows
        - Need GA date, stability policy, and migration commitments beyond alpha
      - - WalletKit
        - Wallet developers and embedded-wallet teams
        - Production-ready foundation
        - Wallet-side TON Connect support plus transaction emulation and asset operations
        - Need adoption metrics across third-party wallets and enterprise integrators
      - - TON API
        - TON builders and infrastructure teams
        - Live backend platform
        - Hosted chain data, wallet emulation, and managed API economics instead of self-run nodes
        - Need uptime, abuse-control, and customer concentration disclosure
      - - TAC
        - Ethereum teams seeking Telegram distribution
        - Mainnet live, still scaling ecosystem depth
        - Reuse Solidity-era logic while bridging to TON wallets and Telegram users
        - Need technical detail on bridge security, liquidity durability, and adapter resilience
    notes: Rows separate end-user wallet surfaces from protocol, SDK, backend, and EVM-extension layers;
      maturity labels reflect public docs, repo visibility, and explicit stage statements rather than
      audited internal KPIs.
