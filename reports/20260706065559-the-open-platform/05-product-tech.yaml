  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - TOP solution
      - Measurable benefit
      - Limitation
    rows:
      - - Hold and move crypto inside Telegram
        - Leave chat, open external wallet, copy addresses, and manage seed phrases elsewhere
        - Wallet in Telegram DeFi Account or Crypto Wallet
        - Native in-chat transfers, trading, staking, and mini-app spending inside the Telegram surface
        - Public materials do not show failure rates, recovery success, or conversion between custody
          modes
      - - Connect a Telegram Mini App to a wallet
        - Custom wallet adapters and wallet-specific UI per app
        - TON Connect plus AppKit connect components
        - Shared connect flow, signatures, and wallet selection across TON apps
        - Wallet-session standardization does not remove the need for separate chain-data integration
      - - Build a TON dApp quickly
        - Run or source chain APIs, balance logic, transfer UX, swap flows, and network switching separately
        - AppKit with TON Connect and TON API
        - Faster prototype path using familiar React hooks and prebuilt asset operations
        - AppKit is still alpha and roadmap items such as embedded wallets are not yet shipped
      - - Build or embed a wallet product
        - Implement TON Connect, transaction review, and asset operations from scratch per platform
        - WalletKit
        - Shared transaction handling, emulation, and multi-platform support
        - Need clearer third-party adoption and support-policy detail
      - - Port an Ethereum dApp to Telegram users
        - Rewrite contracts or build chain-specific front ends and liquidity bootstraps
        - TAC plus TON Connect
        - Faster path to TON distribution with existing EVM logic and wallet connectivity
        - Bridge and liquidity dependencies add operational and security complexity
      - - Enable AI-native on-chain execution
        - Human approves every action or hands full keys to an agent
        - Agentic Wallets
        - Budgeted sub-wallets with revocable limits for agent actions
        - Still early-stage and lacks public assurance detail on control monitoring
    notes: This table is organized by concrete user or builder jobs so the product definition stays anchored
      in workflow outcomes rather than marketing labels.
    claimRefs:
