      - TE004
    figureRefs:
      - FE003
  - id: maturity-developer-workflow-and-roadmap
    title: Maturity, developer workflow, and roadmap evidence
    body: 'The maturity profile across TOP''s stack is uneven in a way investors should treat as a feature,
      not a flaw. TON Connect and WalletKit look the most mature because they have public repositories,
      package surfaces, detailed docs, and clearer role boundaries. AppKit is earlier but promising: the
      company is explicitly packaging common wallet, DeFi, and UI infrastructure so developers can prototype
      inside Telegram faster, and it is already aligning with common web patterns and package distribution.
      Agentic Wallets push that abstraction one step further by treating on-chain execution as a controlled
      budgeted capability for AI agents. TAC has also moved past concept stage, with a live mainnet and
      roadmap, but its bridge post-mortem reminder shows that EVM-on-TON expansion adds real operational
      risk. Overall, the roadmap evidence supports TOP''s claim that it is building a full developer stack,
      while still leaving open questions on GA timing, service quality, and how much independent adoption
      sits behind company-reported usage figures.'
    claimRefs:
