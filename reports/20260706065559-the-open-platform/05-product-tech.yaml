          summarized on the reviewed pages
      - - Service reliability disclosure
        - Weak
        - Wallet in Telegram, Tonkeeper, TON API, SDK products
        - No audited uptime, success-rate, or customer SLA data in reviewed public materials
    notes: This table separates real public controls from missing assurance data; it is not a substitute
