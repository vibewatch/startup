artifact: product-tech
slug: the-open-platform
runDate: '2026-07-06'
company:
  name: The Open Platform (TOP)
chapter:
  number: 5
  title: Product & Technology
  summary: 'TOP has assembled a real multi-layer TON stack rather than a single wallet SKU: Wallet in
    Telegram and Tonkeeper sit at the custody edge, TON Connect handles session transport, AppKit and
    WalletKit abstract application and wallet development, TON API provides backend access, and TAC extends
    distribution to EVM teams. The strongest evidence is the consistency between official product pages,
    technical docs, and public repos on how a Telegram Mini App reaches TON settlement; the weakest areas
    are reliability disclosure, bridge-specific security detail, and concentration risk as more wallet
    and API infrastructure sits under one parent.'
sections:
  - id: product-surface-and-user-workflows
    title: Product surface and user workflows
    body: TOP's product is best understood as a set of connected entry points into the Telegram-native
      TON economy, not as a single standalone wallet. At the user edge, Wallet in Telegram offers both
      a self-custodial DeFi Account and a simpler custodial Crypto Wallet, while Tonkeeper remains the
      non-custodial power-user wallet with swap, staking, NFT, and dApp-browser functionality. Around
      those wallet surfaces, TOP markets TON Connect as the standard wallet session layer, AppKit and
      WalletKit as reusable SDK layers, TON API as backend infrastructure, and TAC as the route for Ethereum
      applications that want Telegram distribution without rebuilding their contracts from scratch. That
      module map matters because it shows TOP controlling onboarding, custody UX, developer tooling, and
      increasingly the shared middleware between them. This ownership pattern also means that underwriting
      the product requires testing not only wallet usability but also how SDK defaults, API dependencies,
      and platform choices shape third-party applications built on top of TOP-managed rails.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE012
      - CE013
      - CE015
      - CE017
