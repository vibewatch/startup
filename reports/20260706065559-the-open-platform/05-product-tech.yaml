  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Telegram Mini App shell
        - Launches app inside Telegram and provides UI, auth context, and payment hooks
        - Telegram platform APIs, bot configuration, and Mini App launch rules
        - Telegram policy or API changes can alter discoverability, monetization, or device capabilities
      - - TON Connect session layer
        - Connects wallet to app and handles signatures over encrypted sessions
        - Wallet support, manifests, bridges, and session negotiation
        - Broken sessions or weak wallet coverage directly reduce conversion and transaction success
      - - AppKit / WalletKit SDK layer
        - Abstracts app-side and wallet-side TON operations for builders
        - API stability, package maintenance, and compatibility across wallets and networks
        - Alpha or fast-moving SDKs can create migration burden and hidden integration debt
      - - TON API backend
        - Supplies chain data, wallet emulation, and operational backend services
        - Hosted API reliability, pricing, rate limits, and abuse controls
        - Backend concentration or outages can break many apps at once
      - - TON settlement layer
        - Processes transfers, staking, sponsored gas, and asset standards
        - TON network performance, stablecoin support, and validator health
        - Protocol or ecosystem changes can affect fees, UX, or asset support
      - - TAC adapter and bridge layer
        - Maps EVM logic and liquidity into the TON or Telegram environment
        - Bridge security, TON adapter quality, and external liquidity depth
        - Cross-system complexity and bridge incidents can create user-loss or downtime scenarios
    notes: The architecture is represented as an operating stack from distribution shell to settlement
      and bridge layer; each row highlights the non-obvious dependency investors actually inherit.
    claimRefs:
      - CE003
      - CE004
      - CE009
      - CE010
      - CE013
