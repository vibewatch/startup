  - id: architecture-and-integration-model
    title: Architecture and TON or Telegram integration model
    body: The public architecture is unusually legible for a crypto infrastructure company. Telegram provides
      the mini-app shell, identity context, launch surfaces, and third-party payment hooks; TON Connect
      provides the secure wallet session and signing handshake; AppKit supplies dApp-side abstractions
      for balances, transfers, swaps, and token or NFT actions; WalletKit implements the wallet side of
      the same protocol and adds transaction emulation; TON API provides the chain-data and wallet-emulation
      backend; and TON itself provides the settlement layer with low-fee transfers, USDt support, gas
      sponsorship primitives, staking, and Mini App connectivity. For EVM teams, TAC adds a parallel route
      that preserves Solidity-era logic while adapting distribution and wallet connectivity to TON and
      Telegram. The result is a developer workflow that looks closer to a modern React app with wallet
      and API middleware than to greenfield chain infrastructure assembly.
    claimRefs:
      - CE003
      - CE004
