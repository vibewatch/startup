  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tops-product-economics
    missingEvidence: Product-level revenue, pricing, take rate, active customer count, and retention by TON API, TON Connect, Wallet in Telegram, and AppKit.
    whyItMatters: Without module-level economics, public evidence cannot convert high reach and activity proxies into a defendable SAM or SOM for TOP.
    diligencePath: Request management reporting by product, cohort retention, paid vs. free developer accounts, and contribution margin by infrastructure line.
    relatedQuestionRefs:
    - QM009
    - QM027
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: ton-connect-scale
    missingEvidence: Independent corroboration and metric definitions for the TON Connect claims of 100M+ connected wallets and roughly $240M monthly transactions.
    whyItMatters: Those figures materially influence the serviceable-market narrative, but they currently sit on company-controlled pages without third-party reconciliation.
    diligencePath: Obtain cohort definitions, audited traffic logs, active-wallet methodology, and partner-level transaction breakouts or compare against infrastructure-provider telemetry.
    relatedQuestionRefs:
    - QM026
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: mini-app-monetization
    missingEvidence: Category-level GMV, conversion, retention, and affiliate-acquisition benchmarks for Telegram Mini Apps on TON.
    whyItMatters: Mini App distribution is a visible driver, but without conversion and monetization data the market can look much larger than the spend TOP can actually capture.
    diligencePath: Request merchant cohorts, GMV by app category, affiliate CAC or rev-share data, and post-wallet-connect conversion funnels from major TON Mini Apps.
    relatedQuestionRefs:
    - QM009
    - QM012
    - QM027
    relatedTableRefs:
    - TM002
    - TM003
  - type: access-blocked
    severity: minor
    topic: independent-telegram-reach
    missingEvidence: Accessible independent coverage on Telegram’s current active-user base and Mini App activity that can corroborate ecosystem-controlled reach claims.
    whyItMatters: The top-funnel TAM lens is directionally useful, but independent corroboration would strengthen confidence in the addressable-user ceiling.
    diligencePath: Re-pull tier-one reporting or operator disclosures once access issues clear, then reconcile those figures against TON and TOP reach claims.
    relatedQuestionRefs:
    - QM006
    - QM026
    relatedTableRefs:
    - TM002
