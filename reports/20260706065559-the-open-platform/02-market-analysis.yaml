- id: drivers-and-constraints
  title: Adoption drivers, practical constraints, and what still blocks underwriting
  body: 'The strongest drivers are clear. Telegram gives builders native distribution and community surfaces; Mini Apps rely on standard web skills rather than a proprietary mobile stack; TON Connect, AppKit, and TON Pay abstract painful wallet and payment tasks; stablecoins are increasingly viewed as practical rails for settlement and treasury; and the broader API market is becoming more strategic because AI agents are becoming new API consumers. But that does not make the market frictionless. TON’s own payment docs say production systems still need off-chain processing, and its pricing docs admit there is no established real-time on-chain solution for historical jetton pricing. Chainalysis and ADGM add a second layer of friction: compliance, smart-contract monitoring, AML/CFT, Basel treatment, and unresolved accounting rules remain serious blockers for institutions. Even market behavior is mixed: CEXs still dominate inflows across MENA, which means decentralized adoption is rising from
    a centralized base, not replacing it. Finally, some of TOP’s biggest reach and transaction claims are company-controlled. So the market is attractive, but the underwriteable market is smaller than the headline narrative until product-level economics, conversion, and independently verified activity data become available.'
