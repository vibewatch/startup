- id: sizing-lenses
  title: 'Sizing lenses: Telegram reach, TON activity, and developer-tool demand'
  body: 'There is no clean public TAM, SAM, or SOM model for TOP, so the chapter has to preserve multiple lenses instead of pretending one headline number is authoritative. The widest lens is ecosystem reach: TON’s official site and TOP’s TON Connect page frame Telegram as a 1B-plus active-user distribution surface. The next lens is actual on-chain activity. TonStat reports more than 55.6 million activated wallets, roughly 2.0 million monthly active wallets, and more than 3.3 million transactions per day, which is a more realistic serviceable-activity proxy than the top-funnel Telegram user count. A third lens is developer and infrastructure demand. Stack Overflow and Postman show that API-first development, AI-tool usage, and developer influence over technology purchases are now mainstream, which supports demand for SDKs, APIs, and wallet connectors rather than just end-user consumer apps. A fourth lens is crypto ownership and settlement behavior: Triple-A’s 560 million global owners and
    TON’s own stablecoin messaging suggest the ecosystem sits inside a larger shift toward always-on digital asset and payment rails. What public evidence still cannot reveal is TOP’s paid conversion rate from Telegram reach to active builders, or from active builders to durable infrastructure revenue.'
