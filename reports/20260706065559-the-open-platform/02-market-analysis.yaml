  rows:
  - - Telegram Mini App tooling
    - Bot-linked app setup, hosting workflow, WebView UX, auth, and launch tooling
    - Generic mobile-game spend or all Telegram engagement
    - Mini App studio, founder, product lead
    - Entry point for Telegram-native application creation
  - - Wallet connection infrastructure
    - Wallet session, signing, address reads, and transaction requests
    - Standalone custodial banking rails unrelated to TON
    - Wallet operator, app team, platform engineer
    - Critical bridge from Telegram reach to on-chain use
  - - TON data / API infrastructure
    - Indexed chain data, pricing, monitoring, streaming, and analytics access
    - General-purpose data infra with no TON exposure
    - Developer tools team, analytics platform, chain-data buyer
    - Reduces the cost of shipping reliable TON products
  - - Payment and settlement tooling
    - TON Pay flows, merchant processors, reconciliation, stablecoin and jetton operations
    - All global payments revenue or all crypto trading volume
    - Merchant, exchange, treasury, or payments operator
    - Monetizable workflow layer once apps move beyond read-only use
  - - UAE setup and governance layer
    - Entity formation, foundation structure, licensing path, local ecosystem access
    - All UAE fintech spend unrelated to digital assets
    - Founder, counsel, operations, treasury
    - Improves time to market and institutional credibility in-region
