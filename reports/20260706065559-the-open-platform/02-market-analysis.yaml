- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Telegram-native distribution and affiliate loops
    - Driver
    - Now
    - Lowers acquisition friction for apps that can spread through communities, links, and affiliate programs
    - Measure how many installs or connected wallets come from organic Telegram surfaces vs. paid channels
  - - Standard web stack plus bot-linked launch model
    - Driver
    - Now
    - Lets ordinary web teams enter the channel without learning a new mobile stack
    - Estimate how much launch time TON Mini Apps save versus native mobile builds for comparable features
  - - TON Connect, AppKit, TON Pay, and API abstraction
    - Driver
    - Now
    - Converts wallet, payment, and data complexity into purchasable infrastructure
    - Request implementation-time reductions and support burden by product module
  - - API-first and AI-agent software trends
    - Driver
    - 12-24 months
    - Makes reusable APIs, SDKs, and machine-friendly interfaces more strategic
    - Track how much TON demand comes from agentic or automation-heavy use cases
  - - UAE regulatory clarity and ecosystem density
    - Driver
    - Now
    - Improves launch credibility, partner access, and institutional comfort for Web3 entities
    - Benchmark setup time, cost, and licensing success against other hubs
  - - Stablecoin settlement demand
    - Driver
    - Now
    - Supports payouts, treasury, and wallet-linked commerce instead of pure speculative trading
    - Quantify what share of TON payment activity is stablecoin-denominated vs. GRAM or other assets
  - - Off-chain operations and missing market data
    - Constraint
    - Now
    - Payment, refund, reconciliation, and pricing gaps keep deployment heavier than pure smart-contract narratives suggest
    - Request reference architectures and true ops headcount for scaled TON apps
  - - Institutional compliance, Basel, AML/KYC, and accounting uncertainty
    - Constraint
    - Ongoing
    - Slows enterprise adoption even where product demand exists
    - Map which workflows remain blocked by capital treatment or multi-jurisdiction compliance
  - - CEX-dominant behavior plus developer trust and pricing sensitivity
    - Constraint
    - Ongoing
    - Some demand still sits with centralized platforms and developers resist expensive or privacy-risky tooling
    - Track active wallet retention, churn, and win/loss reasons against alternative stacks
  notes: Driver rows describe forces that expand demand or shorten time to launch. Constraint rows describe the operational, regulatory, or trust frictions that reduce practical capture even when the top-funnel market looks large.
