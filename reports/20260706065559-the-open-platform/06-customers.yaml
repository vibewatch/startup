- id: expansion-loops-and-concentration-risks
  title: Expansion loops and concentration risks
  body: TOP's best expansion story is that each layer reinforces the next. More wallets and consumer apps make TON more attractive to developers; more developer tools and protocols make wallets and Mini Apps more useful; creator monetization and commerce increase reasons for mainstream users to keep assets inside Telegram; and newer surfaces such as Agentic Wallets suggest TOP can keep widening the builder base. TAC extends that logic from TON-native teams to EVM-native DeFi protocols, which is strategically important because it creates a new payer profile beyond wallet and Mini-App builders. The main risk is that the visible success stories all cluster around the same Telegram and TON rails. If that distribution slows, or if a reliability incident hits a core rail, multiple customer surfaces weaken together. The TAC bridge exploit is a concrete reminder that the customer story still carries platform, bridge, and integration risk. Public sources also do not disclose whether marquee references
    like Curve, Tonkeeper, or Tribute represent meaningful revenue concentration. Distribution is the moat; it is also the concentration risk.
