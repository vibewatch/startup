- id: TU003
  title: Named customer proof table
  columns:
  - Reference customer / app
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof
  - Limitation
  rows:
  - - CoinGecko
    - Developer infrastructure customer / data product
    - Integrated TON API for real-time parameters across hundreds of TON on-chain assets
    - Production reference via TOP case study
    - TOP says CoinGecko uses TON API and CoinGecko visibly covers TON chain + ecosystem pages
    - Proof is strongest from TOP-authored case study rather than a CoinGecko-written integration note
  - - Curve
    - EVM-native DeFi protocol
    - Used TAC to deploy into TON and launch a Telegram Mini App with TON Connect wallet support
    - Production on TAC mainnet
    - TAC says Curve became TAC's largest DEX with >$25M TVL and >20% chain TVL
    - Most detailed metrics come from TAC-authored sources, not Curve-authored materials
  - - Tonkeeper
    - Wallet product
    - Self-custody wallet surface for TON assets, dApps, NFTs, and advanced wallet features
    - Production
    - TOP reports 5M+ MAUs and 2M users onboarded to TON
    - Public monetization, paid-feature attach, and renewal data are absent
  - - Getgems / Notcoin vouchers
    - Collectibles and gaming bridge
    - NFT marketplace and voucher trading surface for TON communities and game assets
    - Production
    - TOP reports 4.5M connected wallets at Getgems and 4M TON Notcoin voucher trading volume
    - Outcome proof is vendor-authored and does not reveal repeat buyer cohorts
  - - Tribute creator communities
    - Creator / seller monetization
    - Paid subscriptions, donations, digital goods, physical goods, and payout automation inside Telegram
    - Production
    - TOP reports 70K+ creators and a named case study shows recurring tariffs plus automated renewals and payouts
    - Case study is single-channel and region-specific; broader merchant proof is limited
  - - STON.fi
    - Embedded DeFi rail for apps, games, and wallets
    - SDK-based token swaps and liquidity embedded into third-party apps
    - Production
    - TOP says developers can add swaps with one SDK integration and cites reliability redesign after peak traffic
    - Public sources do not name the full downstream app roster
  notes: 'Proof quality is mixed: the roster is real enough to show adoption, but much of the commercial detail still comes from TOP or TAC authored materials rather than independent customer disclosures.'
  enumerationScope:
    coverage: partial
    basis: Rows cover the clearest named public references reviewed in direct fetched sources across TOP, TAC, CoinGecko, Tonkeeper, Tribute, and Notcoin surfaces as of the 2026 run date; TOP does not publish a complete customer roster or contract-status ledger.
