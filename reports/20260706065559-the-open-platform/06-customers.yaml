- id: adoption-metrics-and-named-proof
  title: Adoption metrics and named proof
  body: 'Public proof is broad enough to show that people actually use TOP surfaces, even if it is uneven. TON Connect is the clearest cross-ecosystem rail: TOP calls it the standard wallet gateway for Mini Apps, with 100M+ successful connections, 30+ wallet providers, and $240M in monthly transactions. TON API is the clearest developer-infrastructure proof: TOP says it serves roughly 1.5K-1.6K applications at 100K requests per second, and the CoinGecko case study is the best named example of an external product using those rails. On the consumer side, Tonkeeper is the strongest scaled wallet proof at 5M+ MAUs and 2M users onboarded to TON. Getgems, STON.fi, Notcoin, and Tribute round out the picture with large connected-wallet, swap, gaming, creator, and payout metrics. The important caveat is reference quality: many of the best numbers come from TOP-authored portfolio or toolkit pages. They are still useful, but they should be read as vendor-authored customer proof, not audited customer
    economics.'
