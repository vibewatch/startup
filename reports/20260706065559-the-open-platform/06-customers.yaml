artifact: customers
slug: the-open-platform
runDate: '2026-07-06'
company:
  name: The Open Platform (TOP)
chapter:
  number: 6
  title: Customers
  summary: 'TOP serves a layered customer base rather than a single buyer: developers and protocol teams use TON Connect, TON API, TON Tech, and TAC; wallet users and portfolio-app users consume those rails through Tonkeeper, Wallet in Telegram, Getgems, STON.fi, and Notcoin; creators and sellers monetize audiences through Tribute. Public adoption proof is strong on surface-level usage—100M+ wallet users, 235M+ project users, 1.5K-1.6K TON API applications, 5M+ Tonkeeper MAUs, 70K+ Tribute creators, and named proof such as CoinGecko and Curve—but weak on who actually pays, retention, and customer concentration. The clearest adverse signal is TAC''s May 2026 bridge exploit, which shows that reliability risk can still disrupt partner integrations even when growth metrics look impressive.'
sections:
- id: customer-segments-and-surface-map
  title: Customer segments and surface map
  body: 'TOP''s public customer story is not a single buyer profile; it is a stack. At the top of the stack are builders and protocol teams that appear closest to direct paying customers: developers integrating TON Connect, teams using TON API, wallet operators using WalletKit or AppKit, and EVM-native DeFi protocols deploying through TAC. Beneath them are consumer-facing portfolio apps and channels that mostly look like distribution surfaces rather than obvious direct payers: Tonkeeper, Wallet in Telegram, Getgems, STON.fi, and Notcoin. A third segment sits closer to merchants and creator monetization: Tribute creators and sellers using subscriptions, donations, and digital or physical goods inside Telegram. That distinction matters because the biggest public numbers in the file—100M+ wallet users, 235M+ project users, and 1B+ Telegram users—mostly describe reachable end-user scale, not necessarily monetized customer accounts. The strongest current read is that TOP sells infrastructure
    and growth rails to builders, protocols, wallet products, and creator tools, then benefits indirectly from the end-user activity those surfaces aggregate inside Telegram and TON.'
