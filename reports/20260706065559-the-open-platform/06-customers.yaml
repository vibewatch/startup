- id: durability-repeat-usage-and-who-pays
  title: Durability, repeat usage, and who pays
  body: 'Durability is where the public record gets thinner. TOP does have repeat-usage proxies: Tonkeeper is measured in monthly active users rather than only lifetime installs; TON Connect reports ongoing monthly transaction throughput; Tribute has paid subscribers and recurring payout mechanics; Curve on TAC reports TVL growth rather than only launch-day activity; and STON.fi describes reliability work required to serve sustained swap demand. Those are all directionally helpful. But they do not answer the harder diligence questions that matter for underwriting revenue quality: how many of those users overlap across TOP properties, what share are paying accounts, how many renew, and which surfaces actually expand over time rather than spike around campaigns or launches. The result is a split verdict. There is enough evidence to say adoption is real, current, and multi-surface. There is not enough evidence to say retention, cohort quality, or monetized durability are exceptional. End-user
    breadth is visible; direct customer durability remains largely private.'
  claimRefs:
