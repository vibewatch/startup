- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Telegram-native developer distribution
    - Heavy dependence on Telegram and TON as the common acquisition rail
    - If Telegram or TON distribution weakens, several customer surfaces may slow together
    - Request product-level acquisition mix and non-Telegram growth channels
  - - Wallet-led user acquisition
    - 100M+ wallet-user claim may overlap heavily across Tonkeeper, Wallet in Telegram, and portfolio apps
    - Can overstate unique end-user reach and downstream monetization potential
    - Request overlap-adjusted active-user cohorts across wallet and app surfaces
  - - Protocol expansion through TAC
    - Visible DeFi proof depends on a small set of marquee protocols such as Curve, Euler, and Morpho
    - A few large protocol references could dominate narrative and revenue alike
    - Request protocol revenue concentration and contract terms
  - - Creator and seller monetization via Tribute
    - Strong creator proof but limited broader merchant proof
    - Merchant TAM may be narrower than creator headline suggests
    - Request named merchant case studies, GMV, and category split
  - - Reliability and bridge integrity
    - TAC bridge exploit disrupted partner integrations and user experience during suspension
    - Reliability incidents can damage adoption among protocols and Mini Apps
    - Review incident postmortem actions, uptime history, and partner churn after the exploit
  - - Regulatory market access
    - Custodial wallet expansion appears jurisdiction-specific
    - Wallet growth may face country-by-country licensing friction
    - Map licensed jurisdictions, blocked regions, and launch economics by market
  notes: The most important risk is not lack of adoption proof; it is concentration of that proof around the same Telegram, TON, and TAC rails without public revenue-distribution disclosure.
