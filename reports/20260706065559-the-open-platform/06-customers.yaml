  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payer-vs-end-user-split
    missingEvidence: Product-level counts of paying accounts, free accounts, enterprise contracts, and consumer users for TON API, TON Connect, TAC, Wallet in Telegram, and Tribute.
    whyItMatters: Without a payer/user split, TOP's visible reach can be overstated because wallet users, project users, and app users may overlap heavily while monetization sits with a much smaller base.
    diligencePath: 'Request a customer bridge by product: paying logos, active paying accounts, free-to-paid conversion, ARPA, and overlap-adjusted active users.'
    relatedQuestionRefs:
    - QU002
    - QU005
    - QU023
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewals
    missingEvidence: NRR, GRR, churn, renewal rates, active wallet cohorts, creator retention, and repeat-usage cohorts by major product line.
    whyItMatters: Public adoption metrics look strong, but durability is still unproven without renewal and repeat-usage data.
    diligencePath: Ask for 12-month cohort retention by product, wallet MAU/WAU trends, creator churn on Tribute, and protocol/customer renewal evidence.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU017
    - QU018
    - QU019
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A complete roster of named protocol, wallet, creator, and merchant references using TOP rails in production, plus contract status and geography.
    whyItMatters: The named proof table is necessarily partial because public sources spotlight marquee references rather than the full customer roster, which limits concentration and quality analysis.
    diligencePath: Request an export of live named accounts and referenceable logos by product, annotated with pilot versus production status and commercial value.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU012
    - QU013
    - QU014
