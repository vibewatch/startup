    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue shares, protocol concentration, single-app dependence, and any customer above a material revenue threshold.
    whyItMatters: TOP's visible references are concentrated in the Telegram and TON ecosystem, but public sources do not say whether one or two protocols or apps dominate revenue.
    diligencePath: Obtain top-10 revenue concentration, product concentration, and dependence on Telegram/TON-native traffic or specific protocols such as Curve, STON.fi, or Tonkeeper.
