- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative proof
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Developer teams and Mini-App builders
    - 'Buyer: product/engineering lead; User: frontend/backend developers; Payer: startup, protocol, or wallet team'
    - TON Connect, TON API, TON Tech, AppKit, Agentic Wallets
    - 1.5K-1.6K TON API apps; 70+ companies launched; 800K devtools downloads
    - Closest visible direct paying cohort for APIs, SDKs, tooling, and integrations
    - No public paid-account count, pricing, or enterprise split
  - - Wallet operators and wallet products
    - 'Buyer: wallet PM/ops; User: retail wallet holders; Payer: wallet operator or treasury'
    - Tonkeeper, Wallet in Telegram, TON Connect wallet registry
    - Tonkeeper 5M+ MAUs; TOP claims 100M+ wallet users across wallet surfaces
    - Strategic because wallet distribution controls access to downstream apps and assets
    - Public sources do not separate revenue from wallet usage
  - - DeFi protocols and liquidity apps
    - 'Buyer: protocol foundation/BD/engineering; User: traders and LPs; Payer: protocol treasury or partner'
    - Curve on TAC, STON.fi embedded swap SDK, TAC mainnet protocol roster
    - TAC 6 dApps live; Curve >$25M TVL on TAC; STON.fi 5.7M all-time users
    - High strategic value because protocols deepen utility and attract recurring on-chain activity
    - Commercial terms and protocol concentration are undisclosed
  - - Consumer wallet users and portfolio app users
    - 'Buyer: none visible; User: retail crypto holder, trader, collector, gamer; Payer: usually indirect'
    - Wallet in Telegram, Tonkeeper, Getgems, Notcoin
    - 100M+ wallet users; Getgems 4.5M connected wallets; Notcoin 5M+ onboarded users
    - Large end-user base creates distribution leverage for TOP's tool customers
    - Audience overlap across apps and wallets is not disclosed
  - - Creators, sellers, and subscription communities
    - 'Buyer/User/Payer: creator, merchant, or channel owner; End-user: subscriber or buyer'
    - Tribute home page, Tribute creator case study
    - 70K+ creators; 1.4M+ paid subscribers; $45M+ payouts
    - Most direct public merchant-like monetization surface inside the TOP ecosystem
    - Standalone merchant roster beyond creators is not public
  - - Indirect data and ecosystem audiences
    - 'Buyer: external product team; User: CoinGecko visitors and TON ecosystem users; Payer: unclear'
    - CoinGecko TON coverage and TOP TON API case study
    - TON chain page and TON ecosystem category live on CoinGecko
    - Useful proof that TOP rails can power discovery products, not only wallets or games
    - CoinGecko proof is still strongest from TOP's own case study
  notes: This table distinguishes direct buyer or payer cohorts from end-user distribution surfaces because the biggest public usage figures do not equal disclosed paying-customer counts.
