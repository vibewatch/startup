- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor / class
  - Public pricing signal
  - Contract model
  - Included capabilities
  - Unknowns / caveats
  - Implication
  rows:
  - - TOP toolkit (TON Connect, TON API, AppKit)
    - No public list pricing on reviewed toolkit pages
    - Likely partnership- or sales-led for deeper integrations
    - Wallet connect, TON backend, alpha app toolkit, and ecosystem routing
    - Actual developer pricing, volume tiers, and subsidy structure are not public
    - Hard to know whether TOP wins on product merit, bundled economics, or strategic distribution support
  - - Wallet in Telegram / Tonkeeper
    - Consumer product messaging dominates; reviewed pages do not expose a clear B2B developer price sheet
    - User wallet surface rather than classic SaaS contract
    - Custodial and self-custodial wallet access, swaps, payments, and wallet utilities
    - Take rates, wallet monetization, and partner economics are unclear publicly
    - Great distribution signal, but monetization comparability is weak from public pages
  - - STON.fi / DeDust
    - Protocol and product pages emphasize usage rather than enterprise packaging
    - Transaction-fee or protocol-usage economics implied
    - Swaps, liquidity, routing, and app integrations
    - Realized partner fees or revenue-share terms are not public on reviewed pages
    - Useful for feature comparison, weak for direct margin or pricing comparison
  - - Reown AppKit
    - Pricing Plans link is public
    - Self-serve developer onboarding with project setup
    - Accounts, authentication, swaps, funding, and network support
    - Detailed realized pricing tiers were not extracted from the reviewed overview page
    - Lower-friction evaluation path than TOP for generic wallet-connect experiments
  - - thirdweb
    - Start for Free and Pricing are public
    - Self-serve with paid scaling layers
    - Embedded wallets, smart accounts, server wallets, and multichain SDKs
    - Usage breakpoints and enterprise discounts need deeper pricing-page review
    - Developer acquisition appears easier than a sales-led TON-specific motion
  - - Privy
    - Pricing is visible in navigation but detailed public rate cards were not captured on reviewed pages
    - Likely self-serve plus enterprise expansion
    - Embedded, treasury, and agent wallets plus controls and funding features
    - Exact wallet, MAU, or policy-control pricing is not public from reviewed pages
    - Competes strongly on breadth even without transparent detailed list pricing
  - - Alchemy / Infura / QuickNode
    - Infura explicitly offers a free plan; QuickNode offers try free; Alchemy docs emphasize quickstart onboarding
    - Self-serve API-led onboarding with enterprise expansion
    - Managed APIs, gas sponsorship, swaps, batching, streams, webhooks, and multichain infrastructure
    - Comparable enterprise discounting and spend commitments remain private
    - Generalist infra providers reduce trial friction and can win before TOP reaches a procurement conversation
  - - MoonPay / OWS
    - Consumer access is public; OWS is open standard documentation
    - Consumer transaction fees plus partner integrations or standard adoption
    - Fiat onboarding, transfers, and wallet portability concepts
    - B2B embedded economics were not public on reviewed pages
    - MoonPay matters most as adjacent onboarding pressure, not as a full TOP replacement
  notes: The reviewed public pages are much stronger on product packaging than on realized pricing. Unknown cells reflect genuinely missing public price sheets rather than omitted diligence.
