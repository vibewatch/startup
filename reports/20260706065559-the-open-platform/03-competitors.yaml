tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor / class
  - Category
  - Scale / coverage signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - TOP integrated stack
    - Telegram-native TON platform bundle
    - Wallet in Telegram plus TON API, TON Connect, STON.fi, Getgems, and broader portfolio placement on TOP homepage
    - Developers and consumer apps that want one TON-and-Telegram aligned stack
    - Combines distribution, wallet connectivity, backend APIs, swaps, and collectibles under one ecosystem story
    - Most value is concentrated in TON and Telegram rather than broad multichain portability
  - - Wallet in Telegram
    - Consumer wallet and in-chat finance surface
    - 100M+ wallet users shown on TOP homepage; supports custodial wallet and self-custodial DeFi Account
    - Telegram-native users who want crypto inside chat
    - Distribution directly inside Telegram plus payments, swaps, staking, and Mini App access
    - Heavily Telegram-bound and still depends on external TON services for some downstream actions
  - - Tonkeeper
    - Self-custody TON wallet
    - 5M+ monthly active users and 2M users onboarded to TON on reviewed TOP portfolio page
    - Power users and self-custody-first TON participants
    - Dedicated self-custody experience, Pro tools, swap support, and in-Telegram presence
    - Narrower than a full app, API, and distribution bundle
  - - STON.fi
    - TON-native DEX and liquidity layer
    - $6.7B all-time volume, 31M swaps, and 5.7M users on reviewed toolkit page
    - Apps, wallets, and users needing swaps and liquidity on TON
    - Self-custody, Telegram integration, and partner SDK or API orientation
    - Focused on liquidity and swap rails rather than full wallet-auth-backend stack
  - - DeDust
    - TON-native DEX alternative
    - Official docs emphasize native TON protocol design, gas efficiency, and extensibility rather than broad ecosystem bundle metrics
    - Developers or users choosing an external TON DEX
    - Independent TON DEX architecture with native protocol focus
    - Less evidence of broader distribution or consumer surface than TOP-affiliated rails
  - - Getgems
    - TON NFT and collectibles marketplace
    - Largest NFT marketplace on TON claim with 4.5M+ connected wallets and 1M+ community on reviewed toolkit page
    - Projects that need asset launches, collectibles, or NFT distribution
    - Collectibles, Telegram assets, and launchpad style distribution
    - Narrow vertical rather than complete developer platform
  - - Reown AppKit
    - Wallet connection and app onboarding stack
    - Framework coverage across React, Next.js, Vue, Svelte, Nuxt, JavaScript, mobile, Unity, plus TON overview in docs
    - Builders wanting reusable wallet, auth, swap, and funding components
    - Chain-agnostic AppKit plus auth, swap, and wallet-funding features
    - No Telegram-native distribution edge
  - - thirdweb
    - Embedded wallet and smart-account stack
    - 500+ supported wallets plus embedded wallet and smart-account tooling
    - Teams prioritizing multichain onboarding and app transactions
    - Broad wallet coverage, self-custodial embedded wallets, and bundled infra
    - Not TON-specific and less tied to Telegram-native UX
  - - Privy
    - Wallet and financial-product infrastructure
    - User wallets, treasury wallets, agent wallets, funding, cards, and controls on reviewed home page
    - Fintechs, consumer apps, payments, and onchain financial products
    - Broader operational controls and financial workflows than a pure connect SDK
    - No TON-specific distribution or consumer superapp channel
  - - Particle Network
    - Chain abstraction and universal accounts
    - Chain-agnostic accounts, account abstraction, and social logins across EVM and Solana flows
    - Apps that want multichain UX without bridges
    - Universal accounts and chain abstraction reduce chain-specific friction
    - Value proposition is multichain breadth, not Telegram-native depth
  - - Alchemy / Infura / QuickNode
    - Managed blockchain API infrastructure
    - Alchemy wallet APIs; Infura free-plan docs; QuickNode coverage across 77+ blockchains
    - Developers that need managed backend, gas, data, or node infrastructure
    - Production infrastructure breadth and self-serve developer motions
    - Backend-heavy and not a full Telegram-native consumer stack
  - - MoonPay / OWS
    - Onboarding, payments, and wallet-standard layer
    - 35M+ verified accounts across 180 countries on MoonPay; OWS presents a local-first multi-chain standard including TON
    - Apps optimizing fiat onboarding, transfers, or wallet portability
    - Strong payment onboarding and emerging cross-tool wallet standardization
    - Not a direct TON app-building suite
  notes: Rows cover the main TON-native direct peers, generalist infrastructure substitutes, and adjacent onboarding layers evidenced by reviewed official or independent sources as of the 2026 run date.
  enumerationScope:
    coverage: partial
    basis: The table covers the most decision-relevant TON-native rivals and cross-chain substitutes visible from reviewed official pages, not every wallet, RPC vendor, or Mini App toolkit in market.
