- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Telegram-native distribution
    - Builders can still use Telegram Mini Apps with non-TOP wallet, auth, and payment vendors
    - High
    - Mini Apps are ordinary JavaScript web apps and can replace any website, so app logic is portable even if distribution stays in Telegram
    - Request internal data on conversion uplift when TOP tooling is used versus generic wallet and infrastructure stacks
  - - Integrated TON stack
    - Cross-chain vendors already bundle auth, swaps, smart accounts, funding, and broad chain support
    - High
    - Reown, thirdweb, Privy, Particle, and Alchemy all market broader or more mature packaged capabilities than alpha AppKit
    - Pressure-test whether TOP wins enough deals that specifically require TON-native depth to offset missing breadth
  - - Wallet ownership
    - Wallet in Telegram and Tonkeeper can overlap on the same user relationship
    - Medium
    - Both products emphasize self-custody or wallet utility, but public evidence does not show channel conflict or coordinated packaging
    - Ask management for user overlap, cross-sell, and cannibalization data across wallet properties
  - - Liquidity and swap layer stickiness
    - DeDust offers an independent TON-native DEX alternative
    - Medium
    - STON.fi is stronger on visible distribution and metrics, but DeDust markets native TON architecture and extensibility
    - Compare retention, partner integrations, and routed volume between STON.fi and DeDust over the last four quarters
  - - Developer tooling maturity
    - TON Connect requires separate blockchain integration and AppKit is still alpha
    - High
    - Official TON docs explicitly say TON Connect does not provide blockchain integration; AppKit roadmap items are still planned
    - Request GA timeline, active developer counts, and conversion from TON Connect usage into AppKit adoption
  - - Pricing transparency
    - Outsiders cannot benchmark TOP economics against self-serve rivals
    - Medium
    - Reviewed TOP pages lack public list pricing while some generalist rivals expose free or obvious trial paths
    - Obtain current pricing cards, subsidy structure, and partner economics for TON API, AppKit, and strategic integrations
  - - Geographic and compliance maturity
    - Global providers may be ahead on regulated rollout, controls, and operational readiness
    - Medium-High
    - The Block reports that TOP plans to invest fresh capital into US, EU, licensing, compliance, and go-to-market infrastructure
    - Ask for licensing roadmap, compliance staffing, and time-to-launch benchmarks for new regions
  notes: Risk severities reflect competitive underwriting judgments from the reviewed evidence, not company-reported risk scores.
