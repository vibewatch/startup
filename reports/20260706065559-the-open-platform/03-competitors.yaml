- id: generalist-wallet-auth-and-infrastructure-alternatives
  title: Generalist Wallet, Auth, and Infrastructure Alternatives
  body: The most important external alternatives are not TON-specific at all. Telegram Mini Apps are just JavaScript web applications that can replace a normal website, which means a builder can keep Telegram distribution while changing the wallet, auth, RPC, or payment layers underneath. Reown already exposes AppKit with accounts, authentication, swaps, wallet funding, and a TON network option. thirdweb, Privy, and Particle each offer broader wallet onboarding, embedded accounts, or chain-abstraction capabilities that make a product less dependent on TON-specific tooling. Alchemy, Infura, and QuickNode then compete one layer lower as managed infrastructure providers that remove the need to run blockchain backends. MoonPay competes from the fiat onboarding edge. This mix is strategically important because it means TOP's consumer and developer products do not just compete against other TON projects; they also compete against a modular web3 stack that can be attached to Telegram without adopting TOP end to end. That substitution path is commercially and technically credible today.
