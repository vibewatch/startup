        blocks:
          - type: paragraph
            body: >-
              The best-corroborated financing fact is the July 2025 unicorn round. TOP’s own announcement, PR Newswire,
              and The Block all converge on a $28.5 million extended Series A at a $1 billion valuation, with PR saying
              total disclosed funding exceeded $70 million. The Block adds a practical use-of-proceeds lens: expansion
