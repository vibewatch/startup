      - number: '8.5'
        title: Bull, base, and bear underwriting cases
        blocks:
          - type: paragraph
            body: >-
              The current mark lands near the lower end of a bull case rather than in the center of a base case. In the
              bull case, TOP is already monetizing its wallet and infrastructure rails at meaningful scale, revenue is
              at least in the tens of millions, Telegram distribution converts into durable high-margin economics, and
              the company deserves something closer to a premium platform multiple; under that setup, $1.0 billion to
              $1.5 billion can be defended. The base case is more conservative: TOP has real strategic value and
              ecosystem leverage, but the business is still a hybrid holdco with opaque economics, so value clusters
              closer to $0.5 billion to $0.8 billion. The bear case assumes the cap-table ambiguity matters,
              monetization lags the narrative, and compliance expansion adds friction; that yields a $0.25 billion to
              $0.5 billion range. Because the public record still cannot identify which case is right using revenue and
              margin evidence, the investment call must be price-sensitive and evidence-sensitive.
