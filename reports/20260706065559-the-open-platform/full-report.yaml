  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, licensing, and legal risk
        blocks:
          - type: paragraph
            body: >-
              TOP's hardest risk is not generic crypto volatility; it is that the company is trying to push a
              Telegram-native wallet stack into regions that already have dedicated crypto regimes and a hostile
              enforcement history for Telegram-linked token activity. The SEC's 2019-2020 Grams cases prove that U.S.
              authorities will look through ecosystem novelty when they think a token or launch structure crosses
              securities lines. In Europe, MiCA replaces patchwork ambiguity with explicit authorisation, disclosure,
              and supervision duties for crypto-asset issuers and service providers. In the UAE, both VARA and ADGM
              treat virtual-asset activities as purpose-built regulated businesses, not light-touch software features.
              That matters because TOP is simultaneously expanding in the U.S. and EU, running both custodial and
              self-custodial wallet surfaces, and depending on Telegram's willingness to absorb continuing legal
              scrutiny around moderation, sanctions, and criminal misuse. The public file shows intent, restrictions,
              and compliance language, but it still does not show a clean per-entity license map.
            claimRefs:
