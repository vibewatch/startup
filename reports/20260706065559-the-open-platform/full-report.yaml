      - number: '8.6'
        title: Final diligence asks and decision posture
        blocks:
          - type: paragraph
            body: >-
              The right decision posture is not to reject TOP’s strategic ambition, but to refuse to pay for it blindly.
              Before underwriting the $1 billion mark, investors need a product-level revenue bridge, margin disclosure,
              evidence that wallet and developer-rail usage converts into cash economics, and a cap-table explanation
              that reconciles the headline valuation with the reported investor ownership percentages. They also need a
              jurisdiction-by-jurisdiction licensing map for the U.S. and EU rollout and a clean explanation of which
              entities actually own and monetize Wallet in Telegram, Tonkeeper, TON API, and portfolio holdings. If
              management can show that the core rails already generate meaningful recurring revenue and that the hybrid
              structure does not trap value away from equity holders, the call can move toward track or even buy at the
              right price. Until then, the recommendation should stay at research-more and the $1 billion mark should be
              treated as a ceiling to diligence against, not a fair value to accept at face value.
