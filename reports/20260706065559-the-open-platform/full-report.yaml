      - number: '3.2'
        title: TON-Native Wallet, Liquidity, and Collectibles Rivals
        blocks:
          - type: paragraph
            body: >-
              Inside TON itself, TOP faces a more nuanced problem than a simple outside-versus-inside battle. Wallet in
              Telegram and Tonkeeper overlap heavily on self-custody, swaps, and day-to-day asset management, which
              means the fight for the default user wallet relationship can happen inside TOP's own ecosystem as much as
              outside it. STON.fi and DeDust are the clearest direct competitors on TON-native swapping and liquidity
              rails: STON.fi emphasizes Telegram integration, self-custody, and partner SDK access, while DeDust markets
              itself as a native TON DEX with gas-efficient architecture. Getgems adds another adjacent control point
              through NFT and collectibles distribution. The net result is that TON-native competition is layered by
              control surface. Wallet choice, swap routing, and collectible rails can each pull users and developers
              toward different anchors, even when those products all live close to TOP's broader distribution orbit.
