      - number: '7.4'
        title: Reputational, geopolitical, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The reputational risk here is not that TOP has already been sanctioned or formally accused of wrongdoing.
              It is that the company sits in a politically sensitive corridor: a Dubai-based crypto operator tied
              commercially to Telegram, technologically to TON, and publicly linked through its founder to prior
              Russian-tech leadership. Archived reporting says Andrew Rogozov previously led VK.com and that the team
              blends Russian and Abu Dhabi-based talent; CNBC separately describes Pavel Durov as Russian-born and shows
              Telegram repeatedly landing in cross-border disputes. None of that is disqualifying by itself, but it
              raises the due-diligence bar for banking, counterparties, enterprise partnerships, and regulators.
              Execution risk compounds the reputational layer because TOP is scaling products and jurisdictions
              simultaneously: U.S. launch, EU ambitions, UAE regulatory exposure, new asset classes, TON-native
              portfolio management, and a broader consumer roadmap. The public file does not yet show the governance,
              control, or licensing maturity that would normally reassure investors that management capacity is keeping
              up with ambition.
