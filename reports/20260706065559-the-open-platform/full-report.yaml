              not as a single standalone wallet. At the user edge, Wallet in Telegram offers both a self-custodial DeFi
              Account and a simpler custodial Crypto Wallet, while Tonkeeper remains the non-custodial power-user wallet
              with swap, staking, NFT, and dApp-browser functionality. Around those wallet surfaces, TOP markets TON
              Connect as the standard wallet session layer, AppKit and WalletKit as reusable SDK layers, TON API as
