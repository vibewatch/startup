  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Integrated Stack and Competitive Frame
        blocks:
          - type: paragraph
            body: >-
              TOP is not competing as a single-feature crypto widget. Its own homepage frames the company as building
              both infrastructure and consumer apps on TON for Telegram, with Wallet in Telegram, TON Connect, TON API,
              STON.fi, Getgems, and portfolio wallet assets all shown as parts of one stack. That matters because the
              relevant buyer can choose among several substitute classes: a full TON-native bundle from TOP, a narrower
              TON specialist such as Tonkeeper or DeDust, or a more chain-agnostic stack that handles wallets,
              authentication, gas, and backend APIs outside the TON ecosystem. The evidence shows TON Connect is central
              to TOP's story because it is marketed as the gateway to Telegram Mini Apps, but the official TON
              documentation also makes clear that TON Connect alone does not provide blockchain integration. In
              practice, TOP is selling a combination of distribution, wallet connectivity, API infrastructure, and
              ecosystem adjacency rather than an isolated protocol.
            claimRefs:
              - CP001
