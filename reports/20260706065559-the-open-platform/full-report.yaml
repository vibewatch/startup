companyProfile:
  summary: >-
    The Open Platform (TOP) is a UAE-based operator and venture builder focused on turning TON into Telegram's default
    crypto and Mini App stack. It combines consumer distribution through Wallet in Telegram with developer and wallet
    infrastructure such as TON Connect, TON API, TON Tech, and the acquired Tonkeeper stack, while TOP Labs incubates
    and backs adjacent products including STON.fi, Getgems, Tribute, and other ecosystem projects. The company became
    the first unicorn publicly associated with Telegram's TON ecosystem after a $28.5M extended Series A in July 2025,
    but the public record still offers far more product and user evidence than financial disclosure.
