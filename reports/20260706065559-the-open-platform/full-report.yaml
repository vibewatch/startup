      - number: '3.4'
        title: Moat Durability, Switching Costs, and Disadvantages
        blocks:
          - type: paragraph
            body: >-
              TOP's strongest moat evidence is still distribution. The company controls or closely affiliates with
              several of the TON surfaces a developer or user is likely to touch first, and that can create a credible
              bundle when the target use case is explicitly Telegram-native. But the disadvantages are equally visible.
              TON Connect explicitly leaves blockchain integration to other layers, AppKit is still in alpha, and
              several broader competitors already market embedded wallets, gas sponsorship, policy controls, chain
              abstraction, or multichain backend coverage as production-ready offerings. Public pricing is also thin on
              the reviewed TOP pages, and public win-loss data is absent, so outsiders cannot tell whether TOP wins
              because of product depth, subsidized bundling, or simple ecosystem proximity. The moat therefore looks
