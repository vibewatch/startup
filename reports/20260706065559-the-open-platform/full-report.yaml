      - number: '5.3'
        title: Trust, security, custody, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              TOP's strongest trust claim is custody separation. Wallet in Telegram explicitly says that DeFi Account
              keys remain with the user, Tonkeeper reiterates non-custodial control, and TON Connect documents that
              applications never touch keys directly because signing happens through an encrypted session. WalletKit
              strengthens that model by emulating transactions before user approval. But the same stack also introduces
              meaningful concentration and dependency risk. TOP now owns or controls more of the wallet-plus-API layer
              through Tonkeeper and TON API; TAC adds bridge and liquidity dependencies; and public materials still stop
              short of publishing hard uptime, abuse-protection, or audit detail for the highest-risk modules. In
              practice, the security model is credible at the key-ownership layer, but operational assurance for
              bridges, backend middleware, and service reliability remains materially under-disclosed. That distinction
              matters because strong self-custody language can coexist with fragile operational middleware, and the
              public record still leaves investors dependent on management representations for uptime, bridge controls,
              and incident handling quality.
