              Those numbers are enough to support a “large private ecosystem operator” stage description, but not enough
              to underwrite economics. Milestone-wise, the chronology is coherent: 2022 founding roots, 2023 rebrand
              plus Wallet merger, 2024 portfolio formalization, 2025 unicorn funding, and 2026 tighter consolidation of
              Tonkeeper and related infrastructure.
