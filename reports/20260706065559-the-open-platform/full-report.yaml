  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what counts as addressable spend for TOP'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size TOP is to start from the stack it actually sells. TON’s application docs, TON
              Connect materials, and TOP’s own toolkit pages all point to the same answer: the company is not monetizing
              the full crypto market and it is not monetizing the whole Telegram economy. It is monetizing the
              infrastructure layer required to turn Telegram-native discovery into usable wallet, data, payment, and
              settlement experiences on TON. That includes Mini App launch tooling, wallet connectivity, API access,
              payments, pricing data, and the operational software that sits around those functions. It excludes broad
              token speculation, generic enterprise developer tools with no TON tie, and Telegram engagement that never
              becomes a wallet or transaction workflow. The boundary matters because Telegram Mini Apps are technically
              just web apps with a bot dependency and a hosted URL; what TOP captures is the spend that removes friction
              around those dependencies and around the move from audience reach to production-grade blockchain behavior.
              That is a narrower and more credible market than “all Web3 in Telegram,” but it is still large enough to
              matter because it sits at the choke points between distribution, identity, wallets, and money movement.
            claimRefs:
