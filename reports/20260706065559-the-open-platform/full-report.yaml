      - number: '8.4'
        title: Adverse evidence and what breaks the unicorn case
        blocks:
          - type: paragraph
            body: >-
              The adverse case has to be taken seriously because several pieces of the public record weaken, rather than
              strengthen, valuation confidence. First, CoinCentral reported that the $28.5 million round sold about 5
              percent of TOP, with Ribbit at 4 percent and Pantera at 1 percent. If that math applies to the whole
              round, it implies roughly a $570 million post-money, not a $1 billion one. That does not prove the unicorn
              mark is wrong, but it does prove the structure is not transparent enough to underwrite cleanly. Second,
              Telegram and TON still carry regulatory history: the SEC forced Telegram to return more than $1.2 billion
              and pay an $18.5 million penalty over the original Gram token offering. TOP is not Telegram, but the
              company’s thesis is inseparable from the ecosystem and from planned U.S. and EU expansion that explicitly
              requires licensing and compliance execution. Third, the hybrid operator-plus-venture-builder framing
              raises the possibility of a holdco discount unless intercompany economics are shown clearly.
            claimRefs:
              - CV041
