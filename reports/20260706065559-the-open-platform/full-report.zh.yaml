      - number: '2.3'
        title: 谁购买、谁使用，以及 TON 基础设施如何被采用
        blocks:
          - type: paragraph
            body: >-
              TOP 的买方地图比单一加密原生开发者细分更宽，但被一个重复需求串起来：有人想要 Telegram 原生触达，或 TON 原生金融功能，却不想自己搭完整基础设施。Mini App 工作室和消费者应用需要 bot
              设置、托管 URL、钱包连接，以及在 Telegram
              内感觉原生的前端行为。钱包和托管界面需要标准连接层，还需要链数据和支付轨道。数据与分析平台需要索引后的链访问和价格信号。商户、支付处理商和金融产品团队需要围绕余额、确认、退款和对账的链下流程。阿联酋的基金会、DAO
              或生态运营商，还会在技术栈之上叠加法律和治理层。在这些细分中，终端用户往往是普通 Telegram
              用户，但预算所有者通常是产品负责人、工程经理、钱包运营方、资金管理人或希望加快上线同时保留控制权的创始人。采用通常从分发或 UX 痛点开始，经由钱包和 API
              集成推进；一旦支付运营、合规和区域落地进入视野，难度就明显上升。正因如此，TOP 的产品可以作为一套技术栈一起销售，而不是一组孤立工具。
