            body: >-
              当前估值更像落在多头情形的低端，而不是基准情形的中心。多头情形下，TOP 已经靠钱包和基础设施轨道跑出有意义的规模化变现，营收至少达到数千万美元量级，Telegram
              分发转化成可持续的高利润率经济性，公司也应接近平台型溢价倍数；在这个设定下，$1.0 billion 到 $1.5 billion 可以辩护。基准情形更保守：TOP
              确有战略价值和生态杠杆，但业务仍是经济性不透明的混合控股公司，因此价值更接近 $0.5 billion 到 $0.8 billion。空头情形假设股权结构不清确实重要、变现落后于叙事、合规扩张增加摩擦；区间落在
              $0.25 billion 到 $0.5 billion。公开记录仍无法用营收和利润率证据判断哪种情形正确，因此投资判断必须对价格敏感，也必须对证据敏感。
