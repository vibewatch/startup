  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商 / 类别
      - 公开定价信号
      - 合同模式
      - 包含能力
      - 未知项 / 注意点
      - 影响
    rows:
      - - TOP 工具包（TON Connect、TON API、AppKit）
        - 已审阅工具包页面没有公开标价
        - 深度集成可能以合作伙伴或销售驱动为主
        - 钱包连接、TON 后端、alpha 版应用工具包和生态路由
        - 实际开发者定价、用量分层和补贴结构不公开
        - 很难判断 TOP 赢单靠的是产品实力、打包经济性，还是战略分发支持
      - - Wallet in Telegram / Tonkeeper 钱包入口
        - 消费者产品叙事占主导；已审阅页面未披露清晰的 B2B 开发者价目表
        - 用户钱包入口，而非经典 SaaS 合同
        - 托管和自托管钱包访问、兑换、支付和钱包工具
        - 抽成、钱包变现和合作伙伴经济性公开信息不清楚
        - 分发信号很强，但从公开页面看，变现可比性弱
      - - STON.fi / DeDust 去中心化交易所
        - 协议和产品页面强调使用量，而不是企业打包
        - 暗含交易费或协议使用经济模型
        - 兑换、流动性、路由和应用集成
        - 已实现的合作伙伴费用或收入分成条款未在已审阅页面公开
        - 适合做功能比较，不适合直接比较利润率或定价
      - - Reown AppKit
        - 公开了定价方案链接
        - 通过项目设置自助式开发者接入
        - 账户、认证、兑换、入金和网络支持
        - 已审阅概览页未提取到详细实际定价层级
        - 相比 TOP，通用钱包连接实验的评估路径摩擦更低
      - - thirdweb
        - 免费开始使用和定价入口公开
        - 自助式，配套付费扩展层
        - 嵌入式钱包、智能账户、服务器钱包和多链 SDK
        - 用量断点和企业折扣需要更深入审阅定价页
        - 开发者获客看起来比销售驱动的 TON 专用动作更容易
      - - Privy
        - 导航中可见定价入口，但已审阅页面未捕捉到详细公开费率卡
        - 可能是自助式加企业扩张
        - 嵌入式、财资和智能体钱包，加上控制和入金功能
        - 精确的钱包、MAU 或策略控制定价无法从已审阅页面公开确认
        - 即便没有透明的详细标价，也在广度上形成强竞争
      - - Alchemy / Infura / QuickNode
        - Infura 明确提供免费计划；QuickNode 提供试用；Alchemy 文档强调快速入门接入
        - API 驱动的自助接入，加上企业扩张
        - 托管 API、gas 赞助、兑换、批处理、streams、webhooks 和多链基础设施
        - 可比的企业折扣和消费承诺仍属私密
        - 通用基础设施厂商降低试用摩擦，可能在 TOP 进入采购对话前就赢下客户
      - - MoonPay / OWS
        - 消费者入口公开；OWS 是开放标准文档
        - 消费者交易费，加上合作伙伴集成或标准采用
        - 法币接入、转账和钱包可携性概念
        - B2B 嵌入式经济性未在已审阅页面公开
        - MoonPay 更重要的是相邻接入压力，而不是完整 TOP 替代品
    notes: 已审阅公开页面在产品打包上信息远多于实际定价。未知项反映公共价目表确实缺失， 而不是尽调遗漏。
