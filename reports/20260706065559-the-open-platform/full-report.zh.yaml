      - number: '5.2'
        title: 架构以及 TON / Telegram 集成模式
        blocks:
          - type: paragraph
            body: >-
              对于加密基础设施公司，TOP 的公开架构异常清晰。Telegram 提供 Mini App 外壳、身份上下文、启动界面和第三方支付钩子；TON Connect 提供安全钱包会话和签名握手；AppKit 提供
              dApp 侧的抽象，覆盖余额、转账、兑换以及代币或 NFT 操作；WalletKit 实现同一协议的钱包侧，并增加交易模拟；TON API 提供链数据和钱包模拟后端；TON 自身则提供低费率转账、USDt
              支持、gas 赞助原语、质押和 Mini App 连接能力等结算层。对于 EVM 团队，TAC 增加了平行路径：保留 Solidity 时代的逻辑，同时把分发和钱包连接适配到 TON 与
              Telegram。结果是，开发者工作流更像一个带钱包和 API 中间件的现代 React 应用，而不是从零组装链基础设施。
