  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 当前证据
      - 缓释 / 尽调问题
    rows:
      - - Telegram 原生分发
        - 构建者仍可在 Telegram Mini Apps 中使用非 TOP 钱包、认证和支付供应商
        - 高
        - Mini Apps 是普通 JavaScript Web 应用，可替代任何网站；因此即便分发留在 Telegram，应用逻辑仍有可携性
        - 索取内部数据，比较使用 TOP 工具与通用钱包和基础设施技术栈时，转化率提升有多大
      - - 集成 TON 技术栈
        - 跨链厂商已经打包认证、兑换、智能账户、入金和广泛链支持
        - 高
        - Reown、thirdweb、Privy、Particle 和 Alchemy 推向市场的打包能力，比 alpha 版 AppKit 更广或更成熟
        - 压力测试 TOP 是否能赢下足够多明确需要 TON 原生深度的交易，以抵消广度缺口
      - - 钱包所有权
        - Wallet in Telegram 和 Tonkeeper 可能在同一用户关系上重叠
        - 中
        - 两款产品都强调自托管或钱包工具性，但公开证据没有显示渠道冲突或协同打包
        - 向管理层索取各钱包资产之间的用户重叠、交叉销售和蚕食数据
      - - 流动性与兑换层粘性
        - DeDust 提供独立的 TON 原生 DEX 替代方案
        - 中
        - STON.fi 在可见分发和指标上更强，但 DeDust 主打 TON 原生架构与可扩展性
        - 对比 STON.fi 与 DeDust 过去四个季度的留存、合作伙伴集成和路由交易量
      - - 开发者工具成熟度
        - TON Connect 仍需另接区块链集成，AppKit 还在 Alpha 阶段
        - 高
        - TON 官方文档明确说，TON Connect 不提供区块链集成；AppKit 路线图项目仍停留在规划中
        - 要求提供 GA 时间表、活跃开发者数量，以及 TON Connect 使用向 AppKit 采用的转化率
      - - 定价透明度
        - 外部无法用自助式竞品对标 TOP 经济性
        - 中
        - 已审阅 TOP 页面没有公开标价，而部分通用型竞品给出免费或明确试用路径
        - 获取 TON API、AppKit 和战略集成的当前价格卡、补贴结构和合作伙伴经济条款
      - - 地理覆盖与合规成熟度
        - 全球供应商在受监管市场落地、控制和运营准备上可能领先
        - 中高
        - The Block 报道，TOP 计划把新增资本投向美国、欧盟、牌照、合规和商业化基础设施
        - 要求提供牌照路线图、合规人员配置，以及新地区上线耗时基准
    notes: 风险严重度来自对已审阅证据的竞争承销判断，不是公司披露的风险评分。
