      - number: '2.5'
        title: 采用驱动、现实约束与仍卡住投资判断的点
        blocks:
          - type: paragraph
            body: >-
              最强驱动很清楚。Telegram 给开发者原生分发和社区界面；Mini Apps 靠标准 Web 技能，而不是专有移动技术栈；TON Connect、AppKit 和 TON Pay
              抽象掉痛苦的钱包与支付任务；稳定币越来越被视为结算和资金管理的实用轨道；更大的 API 市场也更具战略性，因为 AI agents 正成为新的 API 消费者。但这不等于市场没有摩擦。TON
              自己的支付文档称，生产系统仍需要链下处理；其定价文档也承认，历史 jetton 定价没有成熟的实时链上方案。Chainalysis 和 ADGM 再叠加一层摩擦：合规、智能合约监控、AML/CFT、Basel
              处理，以及尚未解决的会计规则，仍是机构的严重阻碍。市场行为也并不单向：CEX 仍主导 MENA 流入，说明去中心化采用是在中心化基础上增长，而不是取代它。最后，TOP
              一些最大的触达和交易主张由公司自己控制。市场有吸引力，但在产品层经济性、转化率和独立验证活动数据出现前，可支撑投资判断的市场小于标题叙事。
