      - number: '1.3'
        title: 融资、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              证据最充分的融资事实是 2025 年 7 月的独角兽轮。TOP 自己的公告、PR Newswire 和 The Block 都指向同一组信息：扩展 Series A 融资 $28.5 million，估值 $1
              billion；PR 称已披露总融资超过 $70 million。The Block
              还补了一层资金用途视角：进入美国和欧盟，并投入牌照、合规、安全和市场拓展。公开规模证据真实，但更多停留在产品层面，而不是财务层面。TOP 官网披露 100M+ Wallet in Telegram 用户、25+
              项目、235M+ 项目总用户、TON API 上 1.5K 应用、每秒 100K 请求、5M+ Tonkeeper MAU，以及 100M+ TON Connect
              成功连接。这些数字足以支撑“大型私营生态运营商”的阶段描述，但不足以支撑经济性判断。按里程碑看，时间线是连贯的：2022 年创立根基，2023 年品牌重塑并合并 Wallet，2024 年组合正式化，2025
              年独角兽融资，2026 年进一步整合 Tonkeeper 和配套基础设施。
