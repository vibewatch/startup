      - number: '4.3'
        title: 资本充足性与资本结构信号
        blocks:
          - type: paragraph
            body: >-
              最重要的资本事实很直接：多家独立报道称，TOP 完成 $28.5M 扩展 Series A，由 Ribbit Capital 领投、Pantera Capital 参与，使已报道累计资本超过
              $70M。多篇报道还称这一轮是纯股权、没有发行代币；在加密浓度很高的生态里，这是治理纪律的正面信号。公开资金用途也清晰：融资用于美国、欧盟和更广地域推广，包括牌照、合规、基础设施，以及孵化更多 TON 原生产品。


              更难的问题是，这一轮融资对估值和现金续航意味着什么。CoinCentral 和 OKX 都重复称约 5% 股权被出售；按这个算术，投后估值约 $570M，明显低于其他来源反复引用的 $1B
              估值口径。公开来源没有解释差距。它可能来自完全稀释口径、既有结构、二级交易机制或报道不精确，但都没有披露。与此同时，TOP
              不公布账上现金、烧钱速度、续航、债务或分部资本配置。法律实体图也不完整：SiliconANGLE 称 TOP 在阿布扎比注册，而 TOP 自己的法律页面省略运营实体名称，却指向英格兰和威尔士法律以及 BVI
