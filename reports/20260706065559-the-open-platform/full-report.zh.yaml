companyProfile:
  summary: >-
    The Open Platform (TOP) 是一家以阿联酋为基地的运营商兼创业孵化平台，目标是把 TON 做成 Telegram 默认的加密和 Mini App 技术栈。公司一边靠 Wallet in Telegram
    做消费者分发，一边提供 TON Connect、TON API、TON Tech 以及收购来的 Tonkeeper 技术栈等开发者和钱包基础设施；TOP Labs 还孵化并投资 STON.fi、Getgems、Tribute
    等相邻产品和其他生态项目。2025 年 7 月，公司完成 $28.5M 扩展 Series A 后，成为第一个公开关联 Telegram TON 生态的独角兽；但公开资料里，产品和用户证据远多于财务披露。
  founders:
