      - number: '2.2'
        title: 规模测算视角：Telegram 触达、TON 活跃度与开发者工具需求
        blocks:
          - type: paragraph
            body: >-
              TOP 没有干净公开的 TAM、SAM 或 SOM 模型，所以本章必须保留多条视角，而不是假装一个标题数字具备权威性。最宽的一条是生态触达：TON 官网和 TOP 的 TON Connect 页面把
              Telegram 描绘成 1B-plus 活跃用户的分发界面。下一条是实际链上活动。TonStat 报告称，已激活钱包超过 55.6 million，月活钱包约 2.0 million，每日交易超过 3.3
              million；相比顶部漏斗的 Telegram 用户数，这更接近可服务活动代理指标。第三条是开发者和基础设施需求。Stack Overflow 与 Postman 显示，API-first 开发、AI
              工具使用，以及开发者对技术采购的影响力已经进入主流；这支撑的不是单纯终端消费应用，而是 SDK、API 和钱包连接器需求。第四条是加密持有和结算行为：Triple-A 的 560 million 全球持有人，以及
              TON 自己的稳定币叙事，说明生态处在更大一轮向全天候数字资产和支付轨道迁移的趋势里。公开证据仍看不见的是，TOP 从 Telegram 触达到活跃开发者、再从活跃开发者到持久基础设施收入的付费转化率。
