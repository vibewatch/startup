        title: 平台可选性，以及 TOP 实际拥有的东西
        blocks:
          - type: paragraph
            body: >-
              TOP 的资产栈确实比单一钱包或孵化器更有看点。官方材料把公司描述成以 Wallet in Telegram 和 TOP Labs 为锚的组合模式；收购 Tonkeeper 之后，TOP 对 TON
              上领先的自托管钱包 Tonkeeper、Tonviewer、Tonkeeper Pro 和 TON API 有了更强控制。TON API 页面声称已有开发者采用和吞吐量，TON Connect
              则是标准钱包基础设施，也是 Telegram Mini Apps 的入口。这一点重要，因为如果之后接上变现，TOP 对消费者入口、钱包身份、连接标准和后端 API
              基础设施的控制，可以撬动真实的生态杠杆。换句话说，多头逻辑并不离谱：TOP 可能不是一个应用，而是 Telegram
              原生加密生态的协调层。问题在于，公司仍未说明这套资产栈里有多少经济权益归它所有、收入如何并表，以及哪些基础设施轨道真能以有吸引力的利润率变现。
