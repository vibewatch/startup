        title: 反向证据，以及独角兽论点会在哪里断裂
        blocks:
          - type: paragraph
            body: >-
              反向证据必须认真看，因为公开记录里有几项内容削弱而非增强估值信心。第一，CoinCentral 报道称，$28.5 million 轮次出售了约 TOP 5% 股权，其中 Ribbit 占 4%，Pantera
              占 1%。如果这套比例适用于整轮融资，隐含投后估值约 $570 million，而不是 $1 billion。这不能证明独角兽标记错误，但足以证明融资结构不够透明，无法干净承销。第二，Telegram 和 TON
              仍背着监管历史：SEC 曾迫使 Telegram 就最初的 Gram 代币发行返还超过 $1.2 billion，并支付 $18.5 million 罚款。TOP 不是
              Telegram，但公司的论点离不开这个生态，也离不开其计划中的美国和欧盟扩张；这些扩张明确要求牌照和合规执行。第三，运营方 +
              创业构建平台的混合定位带来控股公司折价的可能，除非公司把内部实体之间的经济关系说清楚。
