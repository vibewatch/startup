            body: >-
              理解 TOP 的产品，最好把它看作一组通向 Telegram 原生 TON 经济的相连入口，而不是单一独立钱包。在用户边缘，Wallet in Telegram 同时提供自托管 DeFi Account
              和更简单的托管 Crypto Wallet；Tonkeeper 则仍是非托管的高级用户钱包，具备兑换、质押、NFT 和 dApp 浏览器功能。围绕这些钱包界面，TOP 把 TON Connect
              定位成标准钱包会话层，把 AppKit 和 WalletKit 定位成可复用 SDK 层，把 TON API 定位成后端基础设施，把 TAC 定位成一条路径：Ethereum 应用想获得 Telegram
              分发，不必从零重写合约。这个模块图重要，因为它显示 TOP 控制了用户引导、托管体验、开发者工具，并越来越多地控制它们之间的共享中间件。这种所有权模式也意味着，评估产品不仅要测试钱包可用性，还要测试 SDK
              默认设置、API 依赖和平台选择如何塑造建立在 TOP 管理轨道上的第三方应用。
