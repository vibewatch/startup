    rows:
      - - 托管钱包交易与兑换
        - Wallet 内的应用内交易、兑换和转换流程
        - 点差、执行费或合作伙伴分成
        - 已明确上线；Wallet Trade 将资产范围扩展到 TON、BTC 和 USDT 之外
        - 如果活跃用户完成转化，业务高频且可放大，但实际抽佣率未披露
        - 要求提供净点差、合作伙伴经济条款和按资产类别拆分的交易量
      - - 自托管 DeFi 收益产品
        - DeFi Account 内的金库和类质押收益入口
        - 收益点差、推荐分成或服务费分成
        - 已明确上线，并披露 APY 区间和具名基础设施合作伙伴
        - 可能形成有粘性的余额驱动经济性，但用户侧 APY 不揭示 TOP 利润率
        - 要求提供留存点差、资金管理风险和按金库拆分的经济性
      - - 跨链存取款
        - 借助合作伙伴把资产转入 TON、再转出的入金通道
        - 转换点差、服务费分成或出入金通道经济性
        - 稳定币和主要加密资产已明确上线
        - 有助于拉新入金，但公开定价强调用户简单性，不揭示 TOP 收入
        - 要求提供转换经济性、MoonPay 收入分成，以及每个入金钱包的跨链成本
      - - 永续合约交易
        - Wallet 内通过 Lighter 提供高级杠杆交易
        - 交易费分成、点差捕获或流动性激励
        - 已明确上线，支持 50+ 种资产和最高 50x 杠杆
        - 若用户采用能维持，可能是高价值活动，但合规和风险负担也更重
        - 要求提供永续合约交易量、活跃交易者、清算经济性和合规成本
      - - 代币化股票和 ETF 试点
        - 在 Telegram 里买入、持有、发送和交易代币化股票 / ETF
        - 交易费分成、点差、托管经济性或发行方合作收入
        - 试点已在乌兹别克斯坦上线，支持 60+ 种资产，最低入场 $1
        - 可能把钱包变现扩展到加密原生活动之外
        - 要求提供试点交易量、转化率，以及与 Kraken/xStocks/Backed 的经济条款
      - - 开发者基础设施
        - 面向应用构建者的 TON API、TON Connect、TAC 及相关工具
        - 合同收入、按用量计费或生态变现
        - 产品规模代理指标公开，但定价不公开
        - 可能形成经常性 B2B 式经济性，但合同完全未披露
        - 要求提供定价模型、客户数、流失率和按工具拆分的毛利率
      - - 风险投资与组合敞口
        - TOP Labs 投资或孵化相邻 TON 产品
        - 股权增值、代币敞口、内部转移定价或分发价值
        - 组合覆盖面公开，但财务贡献不公开
        - 可能带来期权价值，也会让分部报告和资本配置更复杂
        - 要求提供按子公司 / 组合公司拆分的股权结构表和公允价值方法
    notes: 公开来源显示 TOP 有多条变现路径，但没有任何来源按路径量化 TOP 自身净收入捕获、合同条款或会计处理。
