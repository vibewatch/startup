    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品，以及与 Telegram-TON 的契合
        blocks:
          - type: paragraph
            body: >-
              TOP 最强的已验证身份信号来自公司官网。公司并不把自己定位成单一钱包创业公司，而是一个更宽的运营商：为 Telegram 的 TON 经济建设并投资基础设施和消费者应用。官方页面称，TOP
              通过面向用户的产品和开发者方案，把 Telegram 用户导向 TON，并通过 Wallet in Telegram 和 TOP Labs 运作。产品栈也很具体，不是愿景口号。Wallet in Telegram
              是消费者入口；TON Connect、TON API 和 TON Tech 则把 TOP 放在身份、钱包连接和开发者轨道的位置。TON 文档也支撑这套叙事：TON Connect 明确用于把钱包连接到 Web
              应用和 Telegram Mini Apps，且不处理用户密钥。Wallet in Telegram 自己的产品页进一步强调自托管姿态，称私钥由用户而不是 App 持有。拼在一起看，TOP 想同时拿下
              Telegram 内的消费者分发，以及 TON 开发者所需的关键使能轨道。
