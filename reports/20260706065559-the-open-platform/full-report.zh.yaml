  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：TOP 的可触达支出究竟包括什么
        blocks:
          - type: paragraph
            body: >-
              给 TOP 定市场规模，最干净的起点是它实际销售的技术栈。TON 应用文档、TON Connect 材料和 TOP 自己的工具包页面都指向同一个答案：公司不是在变现整个加密市场，也不是在变现整个 Telegram
              经济。它变现的是一层基础设施：把 Telegram 原生发现流量转化为 TON 上可用的钱包、数据、支付和结算体验。范围包括 Mini App 启动工具、钱包连接、API
              访问、支付、定价数据，以及围绕这些功能的运营软件；不包括广泛的代币投机、与 TON 无关的通用企业开发工具，也不包括永远不会转成钱包或交易流程的 Telegram 互动。边界很重要，因为 Telegram
              Mini Apps 本质上只是带 bot 依赖和托管 URL 的 Web 应用；TOP 捕获的支出，是那些消除这些依赖摩擦、并把用户触达推进到生产级链上行为的支出。这个市场比“Telegram 里的全部
              Web3”更窄，也更可信；但它卡在分发、身份、钱包和资金流之间的咽喉位置，所以仍足够大。
