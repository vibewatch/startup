        title: 领导层、治理与司法辖区
        blocks:
          - type: paragraph
            body: >-
              公开资料把 TOP 描绘成创始人主导、且高度围绕 Andrew Rogozov 集中的公司。第三方和官方来源在大时间线上基本一致：Rogozov 于 2022 年初加入 TON Foundation，参与打造
              Tonkeeper，随后搭起 First Stage Labs，并在 2023 年改名为 TOP。Andrey Klebanov 通过 TOP Labs
              扮演创业孵化端的搭档，但公开材料仍没有给投资人一张合格的治理地图。TOP 自己的条款罕见地明确：partner、investor、general partner
              等标签，并不能证明法律上的决策权。这点有价值，因为官网其余部分把运营公司、类基金和创业孵化平台的话术混在一起。组合起来，董事会和实体清晰度只会更重要，不会更不重要。司法辖区也没有披露干净。官方页面谈远程工作，以及迪拜等多个城市的共享办公空间，但没有列出正式总部。独立画像随后在迪拜与阿布扎比之间分裂，因此地点叙事只能作为待解决冲突，不能当成已定事实。
