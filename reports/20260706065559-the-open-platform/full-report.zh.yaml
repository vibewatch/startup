              有付费订阅者和周期性付款机制；Curve on TAC 报告 TVL 增长，而不只是上线日活动；STON.fi
              描述了服务持续兑换需求所需的可靠性工作。这些方向上都有帮助。但它们没有回答支撑收入质量判断更难的问题：这些用户在 TOP
              资产之间有多少重叠，付费账户占比多少，有多少续费，哪些界面会随时间扩张而不是围绕活动或上线短暂冲高。结论因此是分裂的。有足够证据说明采用真实、当前且多界面；没有足够证据说明留存、分群质量或变现耐久性异常优秀。终端用户广度可见；直接客户耐久性仍大多留在私下。
