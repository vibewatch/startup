  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 类别
      - 规模 / 覆盖信号
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - TOP 集成技术栈
        - Telegram 原生 TON 平台套件
        - Wallet in Telegram 加 TON API、TON Connect、STON.fi、Getgems，以及 TOP 官网上更广的产品组合布局
        - 希望使用一套与 TON 和 Telegram 对齐技术栈的开发者和消费应用
        - 把分发、钱包连接、后端 API、兑换和收藏品放进同一个生态叙事
        - 大部分价值集中在 TON 和 Telegram，而不是广泛的多链可携性
      - - Wallet in Telegram 消费钱包
        - 消费者钱包和聊天内金融入口
        - TOP 官网展示 100M+ 钱包用户；支持托管钱包和自托管 DeFi Account
        - 希望在聊天里使用加密资产的 Telegram 原生用户
        - 直接嵌入 Telegram 的分发，加上支付、兑换、质押和 Mini App 入口
        - 高度绑定 Telegram，部分下游动作仍依赖外部 TON 服务
      - - Tonkeeper
        - 自托管 TON 钱包
        - 已审阅的 TOP 组合页面显示 5M+ 月活用户，并将 2M 用户带入 TON
        - 高级用户和以自托管为先的 TON 参与者
        - 专门的自托管体验、Pro 工具、兑换支持和 Telegram 内触达
        - 比完整的应用、API 和分发套件更窄
      - - STON.fi
        - TON 原生 DEX 和流动性层
        - $6.7B 历史总成交量、31M 次兑换、5.7M 用户，来自已审阅的工具包页面
        - 需要 TON 上兑换和流动性的应用、钱包和用户
        - 自托管、Telegram 集成，以及面向合作伙伴的 SDK 或 API
        - 聚焦流动性和兑换轨道，而非完整的钱包-认证-后端技术栈
      - - DeDust
        - TON 原生 DEX 替代方案
        - 官方文档强调原生 TON 协议设计、gas 效率和可扩展性，而不是广泛生态套件指标
        - 选择外部 TON DEX 的开发者或用户
        - 独立 TON DEX 架构，聚焦原生协议
        - 比 TOP 关联轨道更少看到广泛分发或消费者入口证据
      - - Getgems
        - TON NFT 和收藏品市场
        - 已审阅的工具包页面称其为 TON 最大 NFT 市场，拥有 4.5M+ 连接钱包和 1M+ 社群
        - 需要资产发行、收藏品或 NFT 分发的项目
        - 收藏品、Telegram 资产和发行平台式分发
        - 垂直领域较窄，不是完整开发者平台
      - - Reown AppKit
        - 钱包连接和应用接入技术栈
        - 覆盖 React、Next.js、Vue、Svelte、Nuxt、JavaScript、移动端、Unity 等框架，文档中还有 TON 概览
        - 想复用钱包、认证、兑换和入金组件的构建者
        - 链无关的 AppKit，加上认证、兑换和钱包入金功能
        - 没有 Telegram 原生分发优势
      - - thirdweb
        - 嵌入式钱包和智能账户技术栈
        - 支持 500+ 钱包，加上嵌入式钱包和智能账户工具
        - 优先考虑多链接入和应用交易的团队
        - 钱包覆盖广、自托管嵌入式钱包和打包基础设施
        - 不是 TON 专用，也与 Telegram 原生 UX 绑定更弱
      - - Privy
        - 钱包和金融产品基础设施
        - 已审阅首页列出用户钱包、财资钱包、智能体钱包、入金、卡和控制
        - 金融科技、消费应用、支付和链上金融产品
        - 比纯连接 SDK 覆盖更广的运营控制和金融工作流
        - 没有 TON 专属分发或消费者超级应用渠道
      - - Particle Network
        - 链抽象和通用账户
        - 跨 EVM 和 Solana 流程的链无关账户、账户抽象和社交登录
        - 希望无需桥接也能获得多链 UX 的应用
        - 通用账户和链抽象降低特定链摩擦
        - 价值主张是多链广度，不是 Telegram 原生深度
      - - Alchemy / Infura / QuickNode
        - 托管区块链 API 基础设施
        - Alchemy 钱包 API；Infura 免费计划文档；QuickNode 覆盖 77+ 区块链
        - 需要托管后端、gas、数据或节点基础设施的开发者
        - 生产级基础设施覆盖广，并支持自助式开发者路径
        - 偏后端，不是完整 Telegram 原生消费者技术栈
      - - MoonPay / OWS
        - 接入、支付和钱包标准层
        - MoonPay 覆盖 180 个国家 / 地区的 35M+ 已验证账户；OWS 提供本地优先的多链标准，包括 TON
        - 优化法币接入、转账或钱包可携性的应用
