  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 产品收入拆分
        - Wallet in Telegram、Tonkeeper、TON API 和组合持仓的收入。
        - 判断 $1B 便宜、公允还是昂贵，分母就在这里。
        - 管理层财务包和法人实体桥接。
      - - 毛利率和成本结构
        - 按产品拆分的托管、验证者、支持、合规和获客成本负担。
        - 只有经济性像软件而不是靠补贴，平台溢价倍数才成立。
        - CFO 尽调会议和产品 P&L 审阅。
      - - 股权结构和证券条款
        - 投前、投后、持股比例、清算优先权，以及任何延期分批融资机制。
        - 公开股权数字目前内部对不上。
        - 条款清单、股权结构表和律师备忘录。
      - - 区域牌照地图
        - 美国和欧盟各国许可、豁免、伙伴安排和上线门槛。
        - 只有产品能合法上线并规模化，扩张选择权才有价值。
        - 合规律师和运营路线图审阅。
      - - 使用质量
        - 活跃用户、已注资用户、余额、交易、GMV 和付费开发者数量。
        - 原始生态存在感不如可货币化、可留存的高质量使用重要。
        - 产品分析导出和同期群审阅。
      - - 公司间经济关系
        - 哪些实体拥有资产，以及现金如何在 TOP、TOP Labs 和产品子公司之间流动。
        - 混合型创业孵化器结构可能把价值困在股权持有人拿不到的地方。
        - 公司结构备忘录和公司间协议审阅。
      - - 监管遗留与代币敞口
        - 任何依赖代币激励、托管定位或生态安排的因素，只要这些因素可能改变风险画像。
        - TOP 的论点仍与 Telegram、TON 和消费者金融监管纠缠在一起。
        - 由董事会层面负责人牵头的风险和法律备忘录。
    notes: 每个问题都因为能改变估值判断而入选，不是因为背景上泛泛有趣。
