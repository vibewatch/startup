            body: >-
              本章主要反向信号在结构和继承的生态风险，不在 TOP 是否有可见产品。第一，Telegram 最初的 Gram 融资以 2020 年 SEC 和解收场，要求向投资人偿还超过 $1.2 billion，并支付
              $18.5 million 罚款；TOP 不是 Telegram，但投资逻辑仍依赖那次重置后形成的 TON-Telegram
              通道。第二，对于一家贴着独角兽标签且有全球扩张目标的公司，地点和治理仍过于模糊。独立画像在迪拜和阿布扎比之间摇摆，官方页面没有公布正式总部或董事会名单。第三，融资数学不完全透明。CoinCentral
