      - number: '5.3'
        title: 信任、安全、托管与依赖风险
        blocks:
          - type: paragraph
            body: >-
              TOP 最强的信任主张是托管分离。Wallet in Telegram 明确称 DeFi Account 密钥留在用户手中，Tonkeeper 重申非托管控制，TON Connect
              文档说明应用永远不会直接接触密钥，因为签名通过加密会话完成。WalletKit 通过在用户批准前模拟交易，进一步强化这一模型。但同一技术栈也引入了有意义的集中和依赖风险。TOP 现在通过 Tonkeeper 和
              TON API 拥有或控制了更多钱包 + API 层；TAC 增加桥和流动性依赖；公开材料仍没有发布最高风险模块的量化
              uptime、滥用防护或审计细节。实际看，密钥所有权层面的安全模型可信，但桥、后端中间件和服务可靠性的运营保障披露严重不足。这个区别很重要，因为强自托管话术可以和脆弱的运营中间件并存；公开资料仍让投资人依赖管理层陈述来判断
              uptime、桥控制和事件处理质量。
