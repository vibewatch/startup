company:
  name: The Open Platform (TOP)
chapter:
  number: 1
  title: Company Overview
  summary: 'TOP’s official surfaces consistently position it as a TON-and-Telegram infrastructure plus consumer-app operator built around Wallet in Telegram and TOP Labs, and the July 2025 funding milestone is well corroborated at $28.5M and a $1B valuation. What remains materially unresolved is not identity but structure: public evidence still leaves headquarters, board/legal-entity governance, cap-table math, and financial disclosure ambiguous.'
sections:
- id: identity-products-and-ecosystem-fit
  title: Identity, products, and Telegram-TON fit
  body: 'TOP’s strongest verified identity signal is its own site. The company does not present itself as a narrow wallet startup; it presents itself as a broader operator building and investing in infrastructure plus consumer apps for Telegram’s TON economy. Official pages say TOP connects Telegram’s audience to TON through retail products and builder solutions, and that it operates through Wallet in Telegram and TOP Labs. The product stack is also concrete rather than aspirational. Wallet in Telegram is presented as the consumer entry point, while TON Connect, TON API, and TON Tech position TOP around identity, wallet connectivity, and developer rails. TON docs support that stack story: TON Connect is explicitly designed to connect wallets to web apps and Telegram Mini Apps without handling users’ keys. Wallet in Telegram’s own product page reinforces the self-custodial posture, saying users—not the app—hold the private keys. The cumulative picture is a company trying to own both consumer
    distribution inside Telegram and key enabling rails for TON builders.'
