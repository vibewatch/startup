- id: adverse-signals-and-open-diligence-questions
  title: Adverse signals and open diligence questions
  body: 'The chapter’s main adverse signals are about structure and inherited ecosystem risk, not about whether TOP has visible products. First, Telegram’s original Gram fundraising ended with a 2020 SEC settlement that required more than $1.2 billion of investor repayments and an $18.5 million penalty; TOP is not Telegram, but its thesis still depends on the TON-and-Telegram corridor that emerged from that reset. Second, location and governance remain fuzzier than they should be for a company with a unicorn label and global expansion ambitions. Independent profiles alternate between Dubai-based and Abu Dhabi-based descriptions, while official pages do not publish a formal headquarters or board roster. Third, the funding math is not fully transparent. CoinCentral’s reported equity split is directionally useful but does not, by itself, reconcile the public $1 billion headline. Finally, the disclosure mix remains incomplete: public sources show user counts and ecosystem reach, but not revenue,
    ARR, headcount, or an entity-level control map. Those are the issues that still matter most for diligence.'
