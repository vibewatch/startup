- id: funding-scale-and-milestones
  title: Funding, scale, and milestones
  body: 'The best-corroborated financing fact is the July 2025 unicorn round. TOP’s own announcement, PR Newswire, and The Block all converge on a $28.5 million extended Series A at a $1 billion valuation, with PR saying total disclosed funding exceeded $70 million. The Block adds a practical use-of-proceeds lens: expansion into the United States and European Union, along with licensing, compliance, security, and go-to-market work. Public scale evidence is real, but it is mostly product-level rather than financial. TOP’s site advertises 100M+ Wallet in Telegram users, 25+ projects, 235M+ aggregate project users, 1.5K applications on TON API, 100K requests per second, 5M+ Tonkeeper MAUs, and 100M+ TON Connect successful connections. Those numbers are enough to support a “large private ecosystem operator” stage description, but not enough to underwrite economics. Milestone-wise, the chronology is coherent: 2022 founding roots, 2023 rebrand plus Wallet merger, 2024 portfolio formalization,
    2025 unicorn funding, and 2026 tighter consolidation of Tonkeeper and related infrastructure.'
