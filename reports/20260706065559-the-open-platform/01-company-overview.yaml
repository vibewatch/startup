  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-and-incorporation
    missingEvidence: A primary corporate registry record or legal entity memo that identifies the exact incorporation jurisdiction, registered entity names, and operating headquarters for TOP and TOP Labs.
    whyItMatters: Dubai-versus-Abu-Dhabi ambiguity affects licensing, governance, and who exactly investors are underwriting.
    diligencePath: Request incorporation certificates, trade licenses, and an entity chart covering TOP, TOP Labs, Wallet, Tonkeeper, and any holding companies.
    relatedQuestionRefs:
    - QO020
    - QO021
    - QO022
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: board-and-legal-entity-governance
    missingEvidence: A current board roster, reserved-matters schedule, and legal-entity governance map for TOP, TOP Labs, and major subsidiaries.
    whyItMatters: The public site names leaders and investors but does not show who actually controls decisions, approvals, or subsidiary economics.
    diligencePath: Request the board deck cover page, shareholder agreement summary, and an org chart showing directors, managers, and approval rights by entity.
    relatedQuestionRefs:
    - QO023
    - QO024
    - QO028
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: cap-table-bridge
    missingEvidence: A round summary reconciling the $28.5M raise, reported investor ownership percentages, security type, and the headline $1B valuation.
    whyItMatters: Without the cap-table bridge, investors cannot tell whether the unicorn label reflects the actual financing economics or only one part of the structure.
    diligencePath: Request the term sheet, pre-money and post-money share counts, and any extension-tranche or side-letter explanations from management or counsel.
    relatedQuestionRefs:
    - QO026
    - QO028
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-and-headcount-disclosure
    missingEvidence: Current revenue, ARR, headcount, and product-level monetization metrics for Wallet in Telegram, Tonkeeper, TON API, and TOP Labs holdings.
    whyItMatters: Public traction evidence is heavy on user counts but light on operating economics, making stage, governance leverage, and valuation support harder to judge.
    diligencePath: Request a management KPI pack covering revenue by product, current employee count, and product-level MAUs, funded users, and paid developer counts.
    relatedQuestionRefs:
    - QO017
    - QO028
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A fuller dated corporate log that closes quarter-level gaps in 2022 and 2024 and confirms whether any omitted governance, financing, or partnership events should sit in the single chronology of record.
    whyItMatters: The milestone table is directionally strong, but an incomplete chronology can hide sequencing risk around formation, governance, and expansion.
    diligencePath: Request a dated corporate timeline from management or legal and reconcile it against the website history, funding announcements, and product-launch log before treating TO004 as exhaustive.
    relatedQuestionRefs:
    - QO018
    - QO028
    relatedTableRefs:
    - TO004
