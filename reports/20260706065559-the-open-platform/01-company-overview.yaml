- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Control or economic importance
  - Current evidence
  - Diligence ask
  rows:
  - - Andrew Rogozov
    - Founder-CEO
    - Likely central operator across product narrative, financing, and TON/Telegram relationships.
    - Named across official history, rebrand, and financing materials as the company’s founder and CEO.
    - Confirm board seat, voting power, and which entities he directly controls.
  - - TOP Labs / Andrey Klebanov
    - Venture-builder arm
    - Shapes incubation, portfolio creation, and possible holdco complexity.
    - Official history says TOP Labs manages the growing portfolio; Klebanov is the named managing partner.
    - Request entity chart showing how TOP Labs economics consolidate into TOP equity.
  - - Ribbit Capital
    - Series A lead investor
    - Lead role in the unicorn round makes it a critical financing stakeholder.
    - PR and news coverage name Ribbit as round lead; CoinCentral reports roughly 4% equity.
    - Verify exact ownership, board rights, and whether Ribbit invested at parent or subsidiary level.
  - - Pantera Capital
    - Series A participant
    - Strategic crypto investor backing the same round and ecosystem narrative.
    - PR and news coverage name Pantera as participant; CoinCentral reports roughly 1% equity.
    - Confirm exact ownership, governance rights, and any token-side exposure.
  - - TON Foundation
    - Ecosystem and vision partner
    - Important because TOP’s distribution and expansion story is repeatedly tied to TON’s ecosystem growth.
    - Rogozov’s prior TON Foundation role and PR wording show alignment, but not formal governance control over TOP.
    - Request commercial and strategic agreements, if any, between TOP and TON Foundation.
  - - Telegram
    - Distribution platform
    - Telegram is the user funnel that makes TOP’s ecosystem thesis valuable.
    - Official and partner sources consistently frame TOP products as embedded in or distributed through Telegram, but not as Telegram-owned.
    - Clarify product-integration rights, revenue sharing, and any platform dependence limits by geography.
  notes: This is a stakeholder map, not a cap table. It mixes operators, investors, ecosystem partners, and platform dependencies because TOP’s public identity spans all four.
