- id: leadership-governance-and-jurisdiction
  title: Leadership, governance, and jurisdiction
  body: 'The public record portrays TOP as founder-led and highly concentrated around Andrew Rogozov. Third-party and official sources line up on the broad sequence: Rogozov joined TON Foundation in early 2022, helped build Tonkeeper, then stood up First Stage Labs before the 2023 rebrand into TOP. Andrey Klebanov appears as the venture-building counterpart through TOP Labs, but the public materials still do not give investors a proper governance map. TOP’s own terms are unusually explicit that labels such as partner, investor, and general partner are not evidence of legal decision-making authority, which is useful because the website otherwise mixes operating-company, fund-like, and venture-builder language. That combination makes board and entity clarity more important, not less. Jurisdiction is also not cleanly disclosed. Official pages talk about remote work and coworking spaces in several cities, including Dubai, but do not list a formal headquarters. Independent profiles then split
    between Dubai and Abu Dhabi, making the location story usable only as a conflict to resolve, not as settled fact.'
