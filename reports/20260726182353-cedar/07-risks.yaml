  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Cedar\u2019s risk profile is shaped less by any one public scandal than by a tightening healthcare-regulatory environment, material dependency complexity, and the opacity that comes with being a scaled private company. The company looks manageable rather than broken, but the burden of proof for security, concentration, and governance remains high."
  },
  "sections": [
    {
      "id": "regulatory-and-legal-risk",
      "title": "Regulatory and legal risk landscape",
      "body": "Cedar operates in one of the most regulated corners of software because it sits on patient data, payment workflows, affordability decisions, and provider communications all at once. The strongest public risk signal is not a known Cedar-specific enforcement event, but the tightening regulatory environment around HIPAA security expectations and No Surprises Act workflow administration. HHS and related legal commentary make clear that cybersecurity controls, dispute workflows, and patient-billing communication standards are becoming more prescriptive, not less. The Epic and Oracle disputes matter here even though Cedar is not named in them: they show how interoperability, privacy, and vendor liability questions can rapidly become litigation issues once healthcare data and platform dependence collide. The right conclusion is that Cedar\u2019s legal and regulatory exposure should be treated as structurally material even without a current company-specific headline case. That backdrop makes public-compliance comfort a weak substitute for actual diligence because the rule set itself is still moving. It also means that Cedar cannot be underwritten as if billing experience lives outside the same regulatory perimeter that governs broader healthcare data and payment operations. Investors should assume continued regulatory motion, not a static rulebook. That assumption should shape diligence sequencing.",
