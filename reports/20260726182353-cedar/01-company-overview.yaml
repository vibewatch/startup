    "number": 1,
    "title": "Company Overview",
    "summary": "Cedar enters late 2026 as a scaled private patient financial engagement platform with strong product breadth, real customer proof, and a still-relevant $3.2 billion last disclosed valuation marker from 2021. Public evidence is strongest on product scope, scale claims, and marquee customer outcomes; it is weakest on current valuation freshness, cap-table structure, and audited financial disclosure."
  },
  "sections": [
    {
      "id": "identity-and-scale",
      "title": "Identity, product framing, and reusable scale facts",
      "body": "Cedar should be treated as a late-stage private patient financial engagement platform rather than as a general hospital software vendor. Its official homepage describes a unified operating surface for billing, payments, coverage, and support, while the 2026 product narrative increasingly emphasizes Cedar Intelligence as the connective layer that personalizes each patient journey. That matters because later chapters need a stable identity anchor: Cedar is not just selling better statements; it is trying to become the engagement system around patient payment resolution. Public scale claims are unusually strong for a private company. Cedar says it has served more than 58 million patients, processed $13.6 billion in patient payments, and handled roughly 1.3 billion patient payment interactions. Its April 2026 AI announcement adds a second proof layer by claiming more than 1.5 billion historical interactions, 50 million patient journeys, and more than 80 modeled patient attributes. The right reusable takeaway is that Cedar has real category scale, but most of the largest numbers remain company-claimed rather than independently audited. The overview also shows why Cedar is strategically adjacent to both revenue-cycle software and healthcare affordability workflows: the platform description and later launches consistently connect digital billing, payment-plan routing, coverage support, and support automation into one operating loop. That breadth is important because it explains why Cedar can plausibly sell to both large health systems and complex physician groups without changing the core product narrative.",
