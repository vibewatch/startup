    {
      "id": "leadership-governance-and-key-person-risk",
      "title": "Leadership, governance, and key-person dependence",
      "body": "Founder-market fit remains one of the strongest overview positives. Florian Otto is still the public face of Cedar, and launch-era materials tie the company clearly to Otto and co-founder Arel Lidow. The current executive bench visible on Cedar\u2019s 2026 leadership page adds Seth Cohen, Amy Stillman, Scott Stockberger, Ben Defnet, Dugan Winkie, and Liz Ratto, which suggests the company now has a broader management layer than an early-stage founder-led story would imply. Still, the public record remains thinner on governance than on product marketing. The cleanest outside governance signal is Greg Hoffman\u2019s 2024 board appointment, which ties Cedar more directly to a major health-system finance leader. For diligence purposes, that means later chapters can reuse a nuanced conclusion: Cedar appears to have real operating depth beyond the founder, but the public evidence is still not rich enough to reconstruct present-day control rights, ownership concentration, committee structure, or whether any recent capital stack changes altered governance materially. The same caveat applies to founder concentration. Cedar has a broader bench than in 2021, but the company still appears closely identified with Otto\u2019s external narrative and with a relatively small set of named executives. Investors should therefore treat leadership succession, product ownership depth, and board independence as live diligence topics rather than solved governance questions.",
      "claimRefs": [
