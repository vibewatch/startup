        - Strong scale vs 2021 anchor
        - Low scale vs implied mark
        - open
      - - Retention and expansion cohorts
        - Quality of growth
        - Durable multi-year account economics
        - Weak renewal or expansion
        - open
      - - Customer concentration
        - Downside risk
        - Diversified enterprise base
        - Top-heavy dependence
        - open
      - - Gross margin / EBITDA
        - Operating quality
        - Software-like economics
        - Service-heavy profile
        - open
      - - Current cap table and any debt
        - Downside protection and dilution
        - Clean structure
        - Complex stack or leverage
        - open
    notes: This chapter is intentionally explicit that valuation quality cannot rise above the quality of these answers.
    claimRefs:
      - CV031
      - CV032
      - CV039
      - CV040
