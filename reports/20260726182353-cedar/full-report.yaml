            body: >-
              The most important meta-risk is private-company opacity. Public materials do not expose Cedar’s internal
              security metrics, customer concentration, churn, committee-level governance, or full capital structure.
              That means many otherwise ordinary operating risks become harder to size and harder to price. Public proof
              suggests Cedar is still investing in product, partnerships, and leadership depth, which is helpful. It
              does not remove the need for direct private diligence. The balanced read is that Cedar’s risks are serious
              but not obviously disqualifying. What would make them disqualifying is evidence of poor security hygiene,
              concentrated revenue dependence, weak governance depth, or inability to defend the product against broader
              suites. Because those failure modes remain partly hidden, later chapters should carry forward a
              disciplined risk discount and explicit kill criteria rather than assuming that strong growth and customer
              stories automatically neutralize the downside case. That is why risk review should be used as a gating
              function for conviction rather than as a generic caution paragraph. A positive risk conclusion is
              therefore contingent, not automatic. Strong private diligence can still improve the picture materially.
