      - number: '7.2'
        title: Operational, platform, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk for Cedar is tightly linked to the complexity of the product stack and its surrounding
              ecosystem. The company depends on EHR adjacency, communications infrastructure, cloud AI tooling, and
              enterprise implementation quality to deliver the patient experience it markets. Those dependencies are not
              inherently negative; they are part of why Cedar can move quickly and integrate into provider workflows.
              But they do create concentration and resilience questions. Twilio and Google Cloud dependencies matter, as
              does the broader reality that Cedar is selling into large-provider environments where deployment timing,
              integration work, and support quality all influence success. Competitive risk compounds the operational
              picture. Waystar, R1, and other scaled vendors can challenge Cedar through breadth, bundling, or service
              intensity. As a result, Cedar’s main operating risks are less about product irrelevance and more about
              dependency resilience, buyer complexity, and the need to keep proving execution superiority. In other
              words, Cedar’s risk is not that it lacks demand, but that it must deliver that demand through a dense and
              failure-sensitive operating system. Platform reliance becomes risky precisely because healthcare buyers
              expect all of these layers to work together continuously, not intermittently. This is especially true in
              large health systems, where one failed handoff or one weak dependency can turn a seemingly local issue
              into a revenue-cycle or reputation problem quickly. Execution quality therefore matters enormously.
