      - number: '2.2'
        title: Demand drivers and buyer behavior
        blocks:
          - type: paragraph
            body: >-
              The 2026 demand picture is unusually favorable for vendors that can improve the patient financial
              experience. Providers face a three-way squeeze: reimbursement pressure, labor scarcity, and a larger share
              of payment coming from patients rather than payers. Cedar’s own 2026 study is self-interested, but it
              aligns with third-party healthcare-finance commentary in arguing that patients now behave like a
              strategically important payer class. At the same time, the operating challenge is not just collecting more
              money. Buyers also need to reduce billing confusion, prevent avoidable calls, offer more relevant
              resolution paths, and protect patient loyalty. That is why digital self-service, AI-guided support, price
              estimates, and payment-plan logic increasingly travel together in buying decisions. The case for platforms
              like Cedar becomes strongest when hospital finance leaders believe they can lift collections and reduce
              cost-to-collect without increasing consumer frustration. Yet adoption is still slowed by procurement
              friction, change management, integration effort, and the fact that many systems already own some mix of
              EHR, clearinghouse, or RCM-suite functionality. The best-read market signal is therefore behavioral:
              hospitals keep looking for ways to simplify patient resolution without sacrificing compliance or labor
              discipline, which is exactly the problem Cedar tries to solve.
