  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Module breadth and architecture logic
        blocks:
          - type: paragraph
            body: >-
              Cedar’s product story is now clearly multi-module. Public materials show Cedar Pay, Cedar Cover, Cedar
              Support, Kora, and Cedar Intelligence operating as distinct but connected surfaces inside one broader
              patient-financial-experience platform. That matters because it suggests Cedar is trying to capture more of
              the workflow than digital bill presentment alone. The core architecture logic appears to run from billing
              and payment resolution, through coverage and affordability support, into human and AI-assisted servicing.
              Cedar Intelligence is positioned as the layer that determines what path each patient should see, which
              implies the company wants the product to behave like an orchestration layer rather than a static billing
              front end. Public documentation is still high level, but it is strong enough to support a practical
              conclusion: Cedar looks like a workflow platform built above healthcare billing, coverage, and support
              systems, with modular surfaces that can be sold together or expanded over time. The modularity also
              matters commercially because it allows Cedar to widen account scope without pretending every provider must
              buy the full platform on day one. It also helps explain why Cedar can sound simultaneously like a billing
              vendor, an affordability vendor, and an AI support vendor without obviously changing categories each time
              it launches a new surface. It is one of the reasons Cedar can plausibly expand account value over time.
