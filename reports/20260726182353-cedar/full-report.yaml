      - number: '8.2'
        title: Premium case versus discount case
        blocks:
          - type: paragraph
            body: >-
              The premium case for Cedar is real. Public customer proof is unusually strong for a private company, the
              product is broader than a point bill-pay tool, and market growth remains supportive. If Cedar has
              compounded revenue quality meaningfully since 2021, a meaningful premium to slower or more service-heavy
              peers could be justified. The discount case is also real and probably more decisive in public-only
              diligence. Investors still lack audited ARR, gross margin, EBITDA, cohort retention, customer
              concentration, and current capital-stack visibility. Those missing metrics are not peripheral. They are
              the core variables that determine whether Cedar should trade like a premium software-payment platform or
              like a more operationally heavy, riskier private asset. This is why a valuation view built only on public
              evidence should stay scenario-based and conservative rather than trying to force a false precision around
              one “correct” mark. The same caution applies to any present-day revenue estimate that originates from
              third-party directories rather than company disclosure. Investors should therefore think in terms of
              confidence bands: the better the hidden metrics, the closer Cedar can move toward the premium end of the
              comp basket; the worse they are, the faster the public anchor starts to look stale or overstated. In
              practical terms, that means any premium multiple claim should be earned only after private diligence
              confirms that Cedar’s hidden economics really resemble the stronger public comps.
            claimRefs:
