      - number: '1.3'
        title: Capital history, milestone cadence, and external proof
        blocks:
          - type: paragraph
            body: >-
              Cedar’s capital history is clearer than its current valuation state. The strongest disclosed financing
              marker is the March 2021 $200 million Series D, which Cedar said valued the company at $3.2 billion and
              included Tiger Global, Andreessen Horowitz, Thrive Capital, and Concord Health Partners. What the public
              record does not show is a refreshed equity valuation from 2025 or 2026, which matters because some
              third-party directories circulate newer-looking numbers without primary support. Milestone cadence since
              2024 does, however, strengthen the operating story. Cedar expanded into affordability with Cedar Cover,
              into AI servicing with Kora and Cedar Intelligence, and into broader distribution through athenaOne.
              Customer proof also deepened materially: Novant, ApolloMD, Talkiatry, NAPA, Sanford, and LCMC all provide
              evidence that Cedar has moved far beyond pilot-stage sales theater. External validation from TIME, Built
              In, and independent trade coverage reinforces that Cedar is a scaled category player. The open overview
              gap is not whether Cedar matters; it is how the private market should price that importance today. In
              other words, Cedar’s public materials clear the threshold for a strong identity and traction story, but
              they do not clear the threshold for precise pricing of private-market risk. That asymmetry should shape
              the rest of the diligence process: later chapters can lean on Cedar’s product and customer proof, yet they
              should preserve caution whenever the analysis depends on current valuation, exact headcount, or
              undisclosed financial structure.
