      - number: '2.3'
        title: Regulation, constraints, and Cedar fit
        blocks:
          - type: paragraph
            body: >-
              Regulation both expands and constrains Cedar’s market. No Surprises Act administration and federal
              dispute-resolution process changes keep pressure on provider billing operations, while the HIPAA Security
              Rule proposal and HHS cyber guidance raise the implementation bar for any vendor handling protected data
              at scale. That dynamic favors better-capitalized, more mature vendors, but it also increases compliance
              costs and slows smaller buyers. Competitive overlap is the second structural constraint. Buyers can
              respond to the same market pain by choosing a patient-experience specialist such as Cedar, a full-platform
              vendor, or a service-heavy outsourcer. Public-company activity from Waystar, Flywire, and R1 shows those
              options are all commercially viable. The practical market thesis is therefore balanced rather than
              simplistic: Cedar benefits from strong macro tailwinds and clear buyer pain, but its subcategory
              boundaries are blurry and likely to get blurrier as EHR, RCM, and fintech products continue to converge.
              Later chapters should treat market demand as supportive, not sufficient, evidence for valuation or moat
              quality. That is why later chapters should read market attractiveness together with product breadth,
              customer proof, and security readiness rather than in isolation.
