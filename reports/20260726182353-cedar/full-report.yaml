  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Category structure and primary rival set
        blocks:
          - type: paragraph
            body: >-
              Cedar should be compared first against patient-financial-engagement and patient-pay vendors, not against
              every healthcare software company that touches the revenue cycle. That framing brings Waystar, Experian
              Health, R1, Flywire, Patientco-within-Waystar, Rectangle Health, and Salucro into the core rival set, but
              for different reasons. Waystar is the most obvious breadth competitor because it spans much more of the
              revenue cycle while also owning patient-pay surfaces. Experian Health is powerful where estimates, price
              transparency, and insurance discovery matter. R1 competes at the enterprise buyer level with a more
              service-heavy model, and Flywire competes where payments infrastructure itself is a strategic advantage.
              Rectangle Health and Salucro matter more in specialty and midmarket segments. The key structural point is
              that Cedar is not alone in solving billing friction; it is differentiated by the way it packages patient
              experience, payments, and healthcare-specific AI for provider buyers. That framing also prevents a common
              diligence error: treating any healthcare company with a payments button as a full substitute for Cedar.
              The real substitutes are vendors that can credibly improve patient financial resolution inside complex
              provider environments. That distinction matters.
