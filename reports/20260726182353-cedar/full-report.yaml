        title: Customer segments and public logo breadth
        blocks:
          - type: paragraph
            body: >-
              Cedar’s public customer evidence is stronger than many private healthcare-software peers because it spans
              multiple buyer types and includes recognizable names. The retained proof set includes large health systems
              such as Novant, LCMC, Sanford, ChristianaCare, and Allina-linked payer-provider workflows, plus
              physician-group and clinician-service organizations such as ApolloMD, USAP, Talkiatry, and NAPA. That
              breadth matters because it shows Cedar is not trapped in a single specialty or deployment archetype. It
              also means later chapters can treat the customer base as diversified at the proof-set level even though
              the actual installed-base count remains undisclosed. The practical limitation is that public customer
              references are by nature curated. Cedar chooses which stories to publish, and the most referenceable
              customers are more likely to appear than middling accounts. The right reading is therefore strong but
              disciplined: the named logos prove real market adoption across segments, but they do not by themselves
              reveal the full mix, count, or concentration of the underlying customer base. It is also helpful that the
              proof set is not limited to one region or one clinical workflow, which reduces the odds that Cedar is only
              strong in a narrow edge case. For diligence, this means the question is less whether Cedar has
              recognizable customers and more whether those recognizable customers fairly represent the broader base.
              The spread of names gives the proof set additional credibility.
