  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and size envelope
        blocks:
          - type: paragraph
            body: >-
              Cedar operates inside a large but definition-sensitive market. The broadest retained analyst sources frame
              healthcare revenue-cycle management as a $90 billion-plus 2026 market with durable double-digit growth
              through 2030, yet those same sources differ materially on what belongs inside the category. That matters
              because Cedar is not trying to automate every step in hospital finance. Its real wedge is the
              patient-facing and patient-resolution layer: billing communications, payment routing, affordability
              support, and support automation. In practice, that means the right lens for Cedar is neither a tiny niche
              nor the entire RCM stack. It is a meaningful subsegment inside RCM where buyers care about collections,
              satisfaction, bad debt avoidance, and staff productivity at the same time. North America remains the core
              current market, and the provider customer base is large enough that Cedar does not need universal share to
              build a significant business. The more important conclusion is that TAM framing must stay honest: broad
              RCM numbers are useful for context, but Cedar’s own reachable market is constrained by provider
              complexity, EHR connectivity, and enterprise go-to-market capacity. Public market estimates also matter
              less for their exact headline total than for what they imply about vendor capacity to compound inside
              hospital finance over many years. Even generous market math does not remove the need to prove category fit
              inside the specific parts of provider finance where Cedar has traction.
