      - number: '4.2'
        title: Revenue model and deployment economics
        blocks:
          - type: paragraph
            body: >-
              Cedar’s visible revenue model is broader than a single billing product. The company now sells and markets
              Cedar Pay, Cedar Cover, and AI-enabled support surfaces, which implies a monetization design that can
              combine enterprise platform fees, implementation work, service layers, and cross-sell over time. Public
              customer proof is unusually useful here. Novant, ApolloMD, NAPA, and Talkiatry all disclose outcome
              statistics that point to collections lift, higher digital adoption, or lower support burden. Those signals
              are not the same as consolidated gross margin, but they do suggest Cedar creates economic value that can
              justify enterprise pricing. The 2026 AI expansion and 2025 Kora release also point toward a model where
              automation can improve operating leverage if adoption rises. The right conclusion is balanced: Cedar
              likely has strong deployment-level economics in successful accounts, but the public record still does not
              let an outside investor derive a full revenue bridge or company-level profitability model. This
              distinction is critical for underwriting because many private healthcare software companies can produce
              attractive case studies while still hiding weak aggregate retention, high implementation cost, or low
              corporate margins. It also explains why the company keeps emphasizing both collections performance and
              lower support burden: those are among the few public signals that speak to gross-profit quality without
              disclosing the actual income statement. Public disclosure remains limited. Outside investors still need
              real statements, cohort data, and cash-flow detail before calling these economics fully underwritten.
