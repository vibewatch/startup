companyProfile:
  summary: >-
    Cedar is a New York-based private healthcare software company founded in 2016. The company sells a patient financial
    engagement platform that combines billing, payments, coverage support, and AI-assisted servicing so health systems
    and provider groups can improve collections, reduce support burden, and create a more consumer-grade financial
    experience. Public evidence supports meaningful scale, marquee customer adoption, and a broadened product stack that
    now extends beyond billing into affordability and support automation, but the company remains under-disclosed on
    current financial quality and capital structure.
  foundedDate: '2016-01-01'
  founders:
    - name: Florian Otto
      role: Co-Founder & CEO
      claimRefs:
        - CO004
    - name: Arel Lidow
      role: Co-Founder
      claimRefs:
        - CO008
  foundingLocation: New York City, New York, United States
  headquarters: New York City, New York, United States
  productSummary: >-
    Cedar sells a modular patient financial experience platform anchored by Cedar Pay, Cedar Cover, Cedar Support, Kora,
    and Cedar Intelligence. In practice, the company tries to orchestrate billing resolution, payment options, coverage
    navigation, and support into a single workflow for providers and patients.
  customerFocus: >-
    Large health systems, hospitals, physician groups, and clinician-services organizations that need better patient
    billing, payment, and support workflows.
  businessModel: >-
    Enterprise healthcare software with likely recurring platform fees, implementation work, and multi-module expansion
    across billing, coverage, and support workflows.
  stage: Late-stage private patient-finance platform
  fundingStatus: >-
