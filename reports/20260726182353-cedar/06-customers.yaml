    {
      "id": "durability-expansion-and-hidden-risks",
      "title": "Durability, expansion, and hidden customer risks",
      "body": "The public record is much thinner on durability and concentration than on logo quality. Some stories imply multi-year relationships or cross-functional relevance, and the payer-provider collaboration evidence around Highmark and Allegheny Health Network shows Cedar can matter beyond a narrow bill-pay interaction. Yet public materials do not reveal current customer count, segment mix by revenue, top-account concentration, churn, or net revenue retention. That uncertainty matters because a company can have excellent flagship references and still carry meaningful concentration or renewal risk. The best-balanced conclusion is that Cedar\u2019s customer chapter should raise confidence in adoption quality, but not eliminate diligence on installed-base economics. Later valuation and recommendation work can lean on the named outcome stories as proof of capability while still treating retention, concentration, and expansion depth as unresolved diligence questions that could materially change the underwriting picture. As a result, reference quality is high, but population-level visibility remains limited. That uncertainty is especially important because enterprise software investors often over-read a handful of flagship references. More complete cohort data is still required.",
