    {
      "id": "workflow-integration-and-dependencies",
      "title": "Workflow integration and dependency structure",
      "body": "The public workflow story is compelling but dependency-heavy. Cedar explicitly markets implementation services, an Epic App Orchard integration, an athenaOne channel motion, a Twilio communications relationship, and a Google Cloud collaboration. Together those signals make the platform look deployable across real provider environments, but they also show that Cedar\u2019s product quality depends on partner ecosystems and underlying data access. The best interpretation is not that Cedar lacks control over its product; it is that Cedar sits on top of a complex hospital and physician-group technology stack that it must continuously integrate, normalize, and support. That architecture is consistent with Cedar\u2019s enterprise focus and with the kind of implementation intensity large healthcare buyers expect. It also means diligence should treat dependency resilience as a first-order product question, especially where communications infrastructure, EHR adjacency, and cloud AI tooling all influence the patient experience. That same integration burden helps explain why implementation is surfaced as a named part of the offer rather than as a hidden back-office function. For customers, the technical question is not just whether Cedar has the right modules, but whether it can keep data fresh and actions coordinated across all of these systems. That coordination challenge is central.",
      "claimRefs": [
        "CE007",
        "CE008",
        "CE009",
