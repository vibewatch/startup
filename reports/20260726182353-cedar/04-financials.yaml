    "title": "Financials",
    "summary": "Cedar\u2019s public financial story is strongest on funding history, platform breadth, and customer-level ROI signals, and weakest on current revenue, margins, and cash economics. The company is clearly scaled, but still materially under-disclosed relative to the public peers most useful for benchmarking."
  },
  "sections": [
    {
      "id": "capital-history-and-disclosure-boundary",
      "title": "Capital history and the boundary of public disclosure",
      "body": "Cedar\u2019s public financing history is clearer than its current financial state. The strongest primary sources are the official $102 million Series C announcement in 2020 and the $200 million Series D announcement in 2021, which together support a disclosed primary-equity floor of at least $302 million. The Series D also established the last clean public valuation marker at $3.2 billion. What these materials do not establish is a refreshed equity valuation, any disclosed later financing, or whether the capital structure now includes debt or meaningful secondary activity. That matters because many third-party directories circulate more current-looking numbers that are not backed by equivalent primary evidence. For financial analysis, Cedar must therefore be treated like a scaled but under-disclosed private company: public materials are good enough to anchor capital history and company ambition, but not good enough to treat present-day financing structure as known. The company\u2019s acquisition activity around Ooda Health also shows that capital has not only been raised for balance-sheet comfort; some of it has been deployed to broaden Cedar\u2019s scope across the consumer financial journey. Investors should therefore separate disclosed fundraising history from any assumption that the current capital stack is simple or unchanged.",
