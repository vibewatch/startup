    {
      "id": "benchmarking-and-financial-opacity",
      "title": "Public-comp benchmarking and residual opacity",
      "body": "Public comparables are more helpful for framing Cedar than for pinning it down precisely. Waystar shows what a scaled software-led RCM platform can look like when revenue, margin, and EBITDA disclosure are available. Flywire shows how healthcare-adjacent payment software can monetize with a payments orientation, while R1 shows that large enterprise buyers also tolerate service-heavy operating models. Together they imply that Cedar sits in a financially interesting middle ground between software, payments, and provider workflow. They do not solve Cedar\u2019s private-company opacity. The public record still does not show Cedar\u2019s ARR, gross margin, EBITDA, net retention, burn, or current leverage. That means any current financial view must carry a disclosure discount and any later valuation work should prefer scenario ranges over point estimates. Cedar\u2019s visible operating story is strong; its publicly underwriteable cash-economics story remains incomplete. The opacity penalty should therefore be explicit rather than implicit when later chapters translate Cedar\u2019s growth story into valuation or recommendation language. In practice, the nearest public analogs are useful only for framing what is possible, not for proving what Cedar already earns. That gap is material for investors.",
