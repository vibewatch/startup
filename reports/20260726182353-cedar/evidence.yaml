    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: Cedar does not publish audited revenue, gross margin, EBITDA, or cash flow
    missingEvidence: Current management financial statements or board-level KPI deck.
    whyItMatters: >-
      No investor can truly underwrite Cedar’s economics from public sources alone without these core financial
      statements.
    diligencePath: >-
      Request the latest audited or management monthly financial package including revenue, gross margin, EBITDA, cash,
      and burn.
