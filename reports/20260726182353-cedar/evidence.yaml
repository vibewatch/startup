evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure-gap
    missingEvidence: Any post-2021 primary or secondary financing documents, lender disclosures, or cap-table updates.
    whyItMatters: >-
      Overview confidence is capped because the company’s current valuation, liquidation stack, and any debt or
      preferred overhang are still opaque.
    diligencePath: Request the latest cap table, financing term sheets, and any board materials covering financing since Series D.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount-noise
    missingEvidence: A current official employee count from the company.
    whyItMatters: >-
      Third-party directories disagree on Cedar’s employee base, which weakens any precise operating-efficiency
      inference.
    diligencePath: Ask management for current FTE count, engineering share, and 12-month hiring plan.
    relatedQuestionRefs:
      - QO011
      - QO014
  - type: enumeration-incomplete
    severity: minor
    topic: >-
      TO002 leadership coverage remains partial because Cedar does not publish a fully dated leadership and governance
      roster on one page
    missingEvidence: A dated current executive and board roster with bios and committee memberships.
    whyItMatters: >-
      Without a single canonical roster, leadership and governance inferences rely on a mix of current leadership and
      selected press releases.
    diligencePath: >-
      Request a current board deck or corporate governance summary that names executives, directors, and committee
      structure.
    relatedQuestionRefs:
      - QO006
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: >-
      TO004 milestone chronology excludes undisclosed internal financing, customer churn, and any private governance
      events
    missingEvidence: >-
      A board-approved full company timeline covering financing, product launches, governance changes, and large
      customer wins or losses.
    whyItMatters: >-
      The public chronology is good enough for broad overview use but not for forensic diligence on execution cadence or
      hidden setbacks.
    diligencePath: Ask management for an internal milestone timeline aligned to financing, product, customer, and people events.
    relatedQuestionRefs:
      - QO016
      - QO017
    relatedTableRefs:
      - TO004
  - type: stale
    severity: material
    topic: patient-financial-engagement segment share remains publicly unquantified despite broad market reports
    missingEvidence: >-
      A direct independent sizing study for patient financial engagement or patient billing software within healthcare
      RCM.
    whyItMatters: >-
      Without a cleaner subsegment estimate, valuation and penetration discussions risk leaning too hard on broad RCM
      numbers.
    diligencePath: Request third-party market work or internal bottoms-up TAM materials that isolate Cedar’s actual product lanes.
    relatedQuestionRefs:
      - QM013
      - QM023
    relatedTableRefs:
      - TM001
      - TM002
  - type: conflicting-data
    severity: minor
    topic: Different analyst firms define RCM scope differently and produce non-comparable market totals
    missingEvidence: A harmonized definition sheet showing exactly which workflows each analyst estimate includes.
    whyItMatters: Definition drift can overstate or understate the opportunity if later chapters compare unlike-for-like markets.
    diligencePath: Normalize all TAM references to one consistent definition before using them in valuation models.
    relatedQuestionRefs:
      - QM001
      - QM002
  - type: private-evidence-only
    severity: material
    topic: >-
      public sources do not disclose comparable retention, net dollar retention, or true win-rate data across Cedar and
      peers
    missingEvidence: Competitor-level cohort retention, churn, and win-loss data.
    whyItMatters: Moat judgments remain partial without durable-customer-quality data across the peer set.
    diligencePath: Request management win-loss analysis and third-party replacement data by vendor.
    relatedQuestionRefs:
      - QP024
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: pricing signals remain too opaque for a reliable public packaging model
    missingEvidence: Actual proposals, contract structures, and implementation pricing from Cedar and direct rivals.
    whyItMatters: Packaging and price-to-value can materially alter competitive positioning in enterprise deals.
    diligencePath: Collect recent RFPs and customer-side procurement summaries by vendor.
    relatedQuestionRefs:
