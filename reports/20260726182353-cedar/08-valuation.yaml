    {
      "id": "recommendation-logic-and-diligence-gates",
      "title": "Recommendation logic and diligence gates",
      "body": "The most defensible public-evidence stance is cautious. Cedar looks like a strong company with real customer proof and a category that can support scale, but the disclosure gap is too wide for maximum-conviction underwriting. That pushes the recommendation toward research-more rather than avoid, because the story is too strong to dismiss but too opaque to underwrite aggressively. It also pushes the valuation stance toward stretched rather than attractive: not because Cedar obviously lacks quality, but because too many of the metrics that would justify a premium remain hidden. The practical next step is straightforward. Before any positive investment decision, investors should obtain ARR, retention, concentration, gross margin, EBITDA, and cap-table data, then rerun the scenario set. Until that happens, the right discipline is medium confidence, wide ranges, explicit kill triggers, and conservative position sizing. A high-quality round could still happen, but the burden of proof belongs to private diligence, not to optimistic interpolation from stale public anchors. Until then, underwriting discipline should favor curiosity and follow-up over aggressive pricing conviction. Discipline is the right posture here. The company can still earn a higher mark later, but public evidence alone does not yet justify paying for that outcome in full today.",
