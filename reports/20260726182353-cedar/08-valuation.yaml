    "number": 8,
    "title": "Valuation",
    "summary": "Cedar\u2019s public evidence supports a strong business-quality case but only a medium-confidence valuation case. The company still looks investable enough to track closely, yet the combination of private-company opacity and a stale 2021 public valuation anchor makes a stretched stance more defensible than an attractive one."
  },
  "sections": [
    {
      "id": "valuation-anchor-and-comp-frame",
      "title": "Valuation anchor and public-comp frame",
      "body": "The cleanest public starting point is Cedar\u2019s 2021 Series D, which set the last clearly disclosed valuation anchor at $3.2 billion. That anchor is useful, but only as history. It does not automatically tell us what Cedar should be worth in 2026. Public comps provide the next best framing layer. Waystar is the strongest breadth comp for enterprise patient-finance workflows, Flywire is helpful for the payments-orchestration lens, and R1 is best treated as a service-heavy lower-multiple reference rather than a direct software analog. Public comp datasets and filings show that software-led and payment-led RCM businesses can support materially higher revenue multiples than outsourced services. The implication is that Cedar deserves to be discussed against stronger comp baskets than a generic medical-billing outsourcer. The open question is how much discount its private-company opacity deserves versus those better comps. The key is not picking a perfect comp, but using a basket that reflects Cedar\u2019s mixed software, payments, and workflow identity. That is why valuation here begins with triangulation rather than with a single formula or a single public-company analog. That broader framing is essential for fairness.",
