companyProfile:
  summary: >-
    Cedar 是一家总部位于纽约的未上市医疗软件公司，成立于 2016 年。公司销售患者财务互动平台，把账单、支付、保险覆盖支持和 AI
    辅助服务放在一起，帮助医疗系统和服务方集团提升回款、降低支持负担，并提供更接近消费级的财务体验。公开证据支持有意义的规模、标杆客户采用和更宽的产品栈；产品如今已从账单延伸到可负担性和支持自动化。但公司对当前财务质量和资本结构的披露仍然不足。
