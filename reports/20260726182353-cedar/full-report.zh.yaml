            body: >-
              公开的工作流故事很有吸引力，但依赖很重。Cedar 明确营销实施服务、Epic App Orchard 集成、athenaOne 渠道打法、Twilio 通信关系和 Google Cloud
              合作。合在一起，这些信号让平台看起来能部署到真实服务方环境中，但也说明 Cedar 的产品质量取决于伙伴生态和底层数据访问。最佳解读不是 Cedar 无法控制产品；而是 Cedar
              位于复杂医院和医生集团技术栈之上，必须持续集成、标准化并支持这些系统。这个架构符合 Cedar
              的企业级重点，也符合大型医疗买家预期的实施强度。这还意味着尽调应把依赖韧性视为一级产品问题，尤其是通信基础设施、EHR 邻近性和云 AI
              工具都会影响患者体验时。同样的集成负担也解释了为什么实施会作为产品的一部分被明确展示，而不是隐藏在后台职能里。对客户而言，技术问题不只是 Cedar
              是否有正确模块，而是它能否让数据保持新鲜，并让动作在所有这些系统之间协调。这个协调挑战是核心。
