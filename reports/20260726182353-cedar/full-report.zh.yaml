      - number: '7.2'
        title: 运营、平台与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Cedar 的运营风险与产品栈及周边生态的复杂度紧密相连。公司依赖 EHR 邻近性、通信基础设施、云 AI 工具和企业级实施质量，才能交付它营销的患者体验。这些依赖并非天然负面；它们也是 Cedar
              能快速行动并接入服务方工作流的原因。但它们确实带来集中度和韧性问题。Twilio 和 Google Cloud 依赖很重要；更广泛的现实也重要：Cedar
              面向大型服务方环境销售，部署时点、集成工作和支持质量都会影响成败。竞争风险进一步叠加在运营图景上。Waystar、R1 和其他规模化供应商可以凭宽度、捆绑或服务强度挑战 Cedar。因此，Cedar
              的主要运营风险较少来自产品无关紧要，更多来自依赖韧性、买家复杂度，以及持续证明执行优势的需要。换句话说，Cedar
              的风险不是没有需求，而是必须通过一个密集且对故障敏感的运营系统来交付需求。平台依赖之所以变成风险，恰恰因为医疗买家期待所有这些层持续协同，而不是时好时坏。大型医疗系统尤其如此；一次交接失败或一个薄弱依赖，就可能很快把看似局部的问题变成收入周期或声誉问题。因此，执行质量极其重要。
