      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人与市场匹配仍是概览中最强的正面因素之一。Florian Otto 仍是 Cedar 的公开门面，早期发布材料也清楚把公司与 Otto 及联合创始人 Arel Lidow 绑定在一起。Cedar 2026
              年领导层页面可见的当前高管班底还包括 Seth Cohen、Amy Stillman、Scott Stockberger、Ben Defnet、Dugan Winkie 和 Liz
              Ratto，说明公司已经拥有比早期创始人主导故事更宽的管理层。即便如此，公开记录在治理上的信息仍比产品营销薄。最干净的外部治理信号是 Greg Hoffman 2024 年加入董事会，这让 Cedar
              与一位大型医疗系统财务负责人产生更直接的连接。对尽调而言，后续章节可以复用一个有层次的结论：Cedar
              看起来已在创始人之外形成真实运营深度，但公开证据仍不足以重建当前控制权、所有权集中度、委员会结构，或判断近期资本结构变化是否实质性改变了治理。创始人集中度也适用同样的提示。与 2021 年相比，Cedar
              的班底更宽，但公司在外部叙事上仍与 Otto 以及一小群具名高管高度绑定。因此，投资者应把领导层传承、产品责任人深度和董事会独立性视为仍需尽调的议题，而不是已经解决的治理问题。
