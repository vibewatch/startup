      - number: '8.3'
        title: 建议逻辑与尽调关口
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，最站得住脚的结论是谨慎。Cedar 看起来是一家实力不弱的公司：客户证明真实， 所在品类也能支撑规模化；但披露缺口太大，还撑不起最高确信度的承销判断。因此，建议应偏向
              继续研究，而不是回避——故事足够强，不能轻易排除；但也太不透明，不能激进承销。估值判断 也更偏「偏高」而非「有吸引力」：并不是 Cedar 明显缺乏质量，而是太多能证明溢价合理的
              指标仍未披露。下一步很直接。任何正向投资决定之前，投资人应拿到 ARR、留存、客户集中度、 毛利率、EBITDA 和股权结构表数据，再重跑情景组。在此之前，纪律应是中等确信度、宽区间、
              明确的终止触发项，以及保守仓位。高质量融资仍可能发生，但举证责任在私有尽调，而不是靠 过期公开锚点做乐观插值。现阶段，承销纪律应鼓励好奇心和跟进，而不是激进定价信心。这里
              最合适的姿态是守住纪律。公司未来仍可能赢得更高标记，但仅凭公开证据，还不足以让投资人 今天为那个结果付足价。
