  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与上市可比框架
        blocks:
          - type: paragraph
            body: >-
              最干净的公开起点是 Cedar 2021 年 Series D 轮，它把最后一个明确披露的估值锚点定在 $3.2 billion。这个锚点有用，但只能作为历史。它不能自动告诉我们 Cedar 在 2026
              年应值多少钱。上市可比公司提供下一层框架。Waystar 是企业患者财务工作流中最强的宽度型可比；Flywire 对支付编排视角有帮助；R1
              更适合作为服务权重高、倍数更低的参照，而不是直接软件类比。上市可比数据集和监管文件显示，软件主导和支付主导的 RCM 企业，可以支撑明显高于外包服务的收入倍数。含义是，讨论 Cedar
              时，应该把它放进比通用医疗账单外包商更强的可比篮子。开放问题在于，相比这些更好的可比公司，它的未上市公司不透明度应该打多少折。关键不是挑一个完美可比，而是使用能反映 Cedar
              软件、支付和工作流混合身份的篮子。因此，这里的估值从三角测算开始，而不是从单一公式或单一上市公司类比开始。这种更宽框架对公平性很重要。
