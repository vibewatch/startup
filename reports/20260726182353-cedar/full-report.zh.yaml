      - number: '6.2'
        title: 结果质量与部署验证
        blocks:
          - type: paragraph
            body: >-
              Cedar 最好的公开客户故事重结果，而不是只给背书。Novant 案例研究称，一年内带来超过 $30 million 净利润影响，同时解决速度更快、满意度强。ApolloMD 称多年支付提升，Talkiatry
              称数字支付完成率很高，NAPA 提到保险后付款表现更强，USAP 强调客户服务改善有持续性。合在一起，这些故事让 Cedar 的验证样本看起来是运营性的，而不是装饰性的。它们也说明 Cedar
              可以通过多种机制创造价值：更高回款、更好数字采用、更低服务负担，以及更好的整体财务体验。不过，这些仍是公司筛选出来的成功故事。它们支持产品市场契合的正面结论，但不能替代客观队列留存、扩张或无偏装机基础均值。投资者应有信心地复用这些具名结果，同时避免把案例研究中的赢家当作完整客户分布样本。收入周期和体验结果的组合，正是后续财务和估值工作需要从客户章节获得的内容。它也让
              Cedar 的销售叙事更可信，因为买家能在采用和复杂度曲线的不同位置看到证明。最有说服力的公开验证，通常同时包含知名品牌、具体指标和可信的运营解释，说明指标为何改善。
