  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与公开客户标识宽度
        blocks:
          - type: paragraph
            body: >-
              Cedar 的公开客户证据强于许多未上市医疗软件同行，因为它横跨多种买家类型，并包含可识别名称。保留的验证样本包括 Novant、LCMC、Sanford、ChristianaCare 这类大型医疗系统，以及与
              Allina 相连的支付方—服务方工作流；还包括 ApolloMD、USAP、Talkiatry 和 NAPA 这类医生集团和临床服务机构。这个宽度很重要，因为它说明 Cedar
              没有被困在单一专科或单一部署原型里。它还意味着，尽管实际装机客户数仍未披露，后续章节仍可在验证样本层面把客户基础视为多元。实际限制在于，公开客户引用天然经过筛选。Cedar
              会选择发布哪些故事，最适合做引用的客户也更可能出现。正确读法因此应强但有纪律：具名客户标识证明公司在多个细分中真实被市场采用，但它们本身不能揭示底层客户基础的完整结构、数量或集中度。验证样本没有局限于单一区域或单一临床工作流也有帮助，因为这降低了
              Cedar 只在狭窄边缘场景中强的可能性。对尽调而言，问题较少是 Cedar 有没有可识别客户，更多是这些可识别客户能否公平代表更宽基础。这组名称的分布提升了验证样本的可信度。
