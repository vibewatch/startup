  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与公开披露边界
        blocks:
          - type: paragraph
            body: >-
              Cedar 的公开融资历史比当前财务状态清楚。最强的一手来源是 2020 年官方 $102 million Series C 轮公告，以及 2021 年 $200 million Series D
              轮公告；二者共同支撑至少 $302 million 的已披露新股融资下限。Series D 轮也给出了最后一个干净的公开估值锚点：$3.2
              billion。这些材料没有证明刷新后的股权估值，也没有披露后续融资，更没有说明资本结构如今是否包含债务或有意义的老股交易。这一点很重要，因为许多第三方目录传播更像当前口径的数字，却没有同等一手证据支持。做财务分析时，必须把
              Cedar 视为一家已成规模但披露不足的未上市公司：公开材料足以锚定融资历史和公司野心，但不足以把当前融资结构视为已知。公司围绕 Ooda Health
              的收购动作也说明，资本并不只是为了资产负债表舒适度而募集；部分资金已经用于拓宽 Cedar 在消费者财务旅程中的覆盖。因此，投资者应把已披露募资历史，与“当前资本结构简单且未变”的假设分开看。
