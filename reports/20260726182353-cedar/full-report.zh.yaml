      - number: '4.3'
        title: 上市公司基准与残余不透明度
        blocks:
          - type: paragraph
            body: >-
              上市可比公司更适合给 Cedar 搭框架，而不是精确钉住估值。Waystar 展示了在收入、利润率和 EBITDA 披露可得时，一个规模化、软件主导的 RCM 平台可以长什么样。Flywire
              展示了医疗邻近支付软件如何以支付导向变现；R1 则显示，大型企业买家也能接受服务权重更高的运营模式。放在一起看，它们说明 Cedar 处在软件、支付和服务方工作流之间一个财务上有意思的中间地带。但它们不能解决
              Cedar 的未上市公司不透明度。公开记录仍看不到 Cedar 的
              ARR、毛利率、EBITDA、净留存、烧钱速度或当前杠杆。因此，任何当前财务判断都必须带披露折扣，后续估值也应优先使用情景区间，而不是点估计。Cedar
              可见的运营故事很强；它能被公开承销的现金经济性故事仍不完整。后续章节把 Cedar
              的增长故事转成估值或建议语言时，应明示不透明度惩罚，而不是把它藏在假设里。实际操作中，最近的上市公司类比只适合说明可能性，不能证明 Cedar 已经赚到了什么。这个缺口对投资者很重要。
