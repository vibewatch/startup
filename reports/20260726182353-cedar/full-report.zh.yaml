  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与规模边界
        blocks:
          - type: paragraph
            body: >-
              Cedar 所在市场很大，但规模对定义高度敏感。保留的最宽口径分析师来源，把医疗收入周期管理（RCM）描述为 2026 年超过 $90 billion 的市场，并预计到 2030
              年保持两位数增长；但这些来源对哪些内容应纳入品类的看法差异很大。这一点很重要，因为 Cedar
              并不是要自动化医院财务的每一步。它真正的切入点，是面向患者的解决层：账单沟通、支付路由、可负担性支持和支持自动化。落到实践，Cedar 的正确观察口径既不是一个很小的利基，也不是整个 RCM 栈；而是 RCM
              内部一个有意义的子板块，买家同时关心回款、满意度、坏账规避和员工效率。北美仍是当前核心市场，服务方客户基数足够大，Cedar 不必拿到全市场份额也能做出重要业务。更重要的结论是，TAM 口径必须诚实：宽口径
              RCM 数字适合用作背景，但 Cedar 真正可触达的市场受服务方复杂度、EHR
              连接能力和企业级销售落地能力限制。公开市场估算的精确总额并不是最重要的；更有价值的是，它们暗示供应商可以在医院财务内部多年复利增长。即便市场测算很慷慨，也不能替代品类契合度验证；Cedar
              仍需要在自己已有牵引力的服务方财务环节证明适配。
