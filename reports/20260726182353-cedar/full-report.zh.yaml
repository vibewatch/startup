      - number: '7.3'
        title: 不透明度、治理与缓释纪律
        blocks:
          - type: paragraph
            body: >-
              最重要的元风险是未上市公司不透明度。公开材料没有披露 Cedar 的内部安全指标、客户集中度、流失、委员会层面治理或完整资本结构。这意味着，许多原本普通的运营风险会更难衡量，也更难定价。公开验证显示 Cedar
              仍在产品、伙伴关系和领导层深度上投入，这有帮助。但它不能取消直接私有尽调的必要性。平衡读法是，Cedar
              的风险严肃，但并未明显达到否决程度。真正会让风险变成否决项的，是安全卫生差、收入依赖集中、治理深度弱，或无法抵御更宽套件的证据。由于这些失败模式仍有一部分被隐藏，后续章节应带着有纪律的风险折扣和明确的否决标准向前推进，而不是假设强增长和客户故事会自动中和下行情景。因此，风险审查应作为确信度的闸门，而不是泛泛的谨慎段落。正面的风险结论是有条件的，不是自动成立的。强私有尽调仍能实质性改善图景。这才是形成确信度的合适门槛。
