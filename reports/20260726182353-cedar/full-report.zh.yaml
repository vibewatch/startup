      - number: '3.2'
        title: 功能宽度与买家适配
        blocks:
          - type: paragraph
            body: >-
              竞争市场之所以碎片化，是因为服务方买家问的问题不同。有些想要最宽的自动化套件，有些想要更好的面向患者支付体验，有些想要能吸收劳动力的运营伙伴。任务是改善账单解决、提升回款、编排支持并提高患者满意度，同时不转向完整外包模式时，Cedar
              看起来最强。Waystar 和 Experian 在相邻工作流宽度上更强；当服务方需要更重的运营答案时，R1 更强。支付编排或跨境能力重要时，Flywire 的位置更好。Cedar 的 athenahealth
              渠道材料还显示，它正从经典的大型医院打法扩展到医生集团，这能帮助它抵御更大套件供应商。因此，结论不是 Cedar 赢下所有功能对比；而是在患者体验质量和服务方专用财务互动成为主要采购标准的对比中，Cedar
              更容易取胜。这也是为什么竞争评估必须基于任务，而不是基于客户标识。同一个医疗系统可能为了一个工作流把 Cedar 和 Waystar 放入候选名单，又为了另一个运营决策把 Cedar 和 R1
              放在一起比较，即便这些产品并不相同。换句话说，只要 Cedar 能持续赢下患者解决质量是决策核心的那部分交易，它就不需要在总产品宽度上击败每个竞争者。
