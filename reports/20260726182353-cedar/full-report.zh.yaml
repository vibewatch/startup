      - number: '8.2'
        title: 溢价情景与折价情景
        blocks:
          - type: paragraph
            body: >-
              Cedar 的溢价情景是真实存在的。就未上市公司而言，公开客户验证异常强；产品也比单点账单支付工具更宽；市场增长仍提供支撑。如果 Cedar 自 2021
              年以来已经显著提升收入质量，相比增速更慢或服务权重更高的同行，给予有意义的溢价可以成立。折价情景同样真实，而且在仅靠公开资料的尽调中可能更具决定性。投资者仍缺少经审计的
              ARR、毛利率、EBITDA、队列留存、客户集中度和当前资本结构能见度。这些缺失指标不是边缘变量；它们是决定 Cedar
              应该像高溢价软件支付平台交易，还是像运营更重、风险更高的未上市资产交易的核心变量。因此，只基于公开证据构建的估值判断应保持情景化和保守，而不是围绕某个“正确”标记强行制造虚假精确度。任何来自第三方目录而非公司披露的当前收入估算，也适用同样谨慎。投资者因此应以置信区间思考：隐藏指标越好，Cedar
              越能靠近可比篮子的溢价端；隐藏指标越差，公开锚点就越快显得陈旧或偏高。实际含义是，任何溢价倍数主张都只能在私有尽调确认 Cedar 的隐藏经济性确实接近更强上市可比之后再获得。
