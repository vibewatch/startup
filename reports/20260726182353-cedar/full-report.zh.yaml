      - number: '2.3'
        title: 监管、约束与 Cedar 的适配度
        blocks:
          - type: paragraph
            body: >-
              监管既扩大也限制 Cedar 的市场。No Surprises Act 的执行和联邦争议解决流程变化，让服务方账单运营持续承压；HIPAA Security Rule 提案和 HHS
              网络安全指导，则抬高了任何大规模处理受保护数据供应商的实施门槛。这种动态有利于资本更充足、更成熟的供应商，但也推高合规成本，并拖慢小买家。竞争重叠是第二个结构性约束。买家面对同一种市场痛点，可以选择 Cedar
              这样的患者体验专门供应商、全平台供应商，或服务权重更高的外包商。Waystar、Flywire 和 R1 的上市公司动作表明，这些选择都有商业可行性。因此，实用的市场判断应保持平衡，而不是简单化：Cedar
              受益于强宏观顺风和清晰买家痛点，但它的子品类边界模糊；随着 EHR、RCM
              和金融科技产品继续收敛，边界可能更模糊。后续章节应把市场需求视为支持性证据，而非估值或护城河质量的充分证据。因此，阅读市场吸引力时，应把产品宽度、客户验证和安全准备度放在一起看，而不是孤立看。
