      - number: '3.3'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Cedar 的护城河有意义，但并非牢不可破。它的许多可见产品能力，随着时间推移都可能被更宽套件、EHR 邻近供应商，或把软件与运营责任绑定的服务型玩家模仿。Cedar
              更强的论点在执行：更好的面向患者设计、围绕互动的更快学习闭环、通信基础设施伙伴关系，以及以医疗可负担性而非通用账单工作流为中心的产品策略。即便这种优势也有限。Waystar 的整合动作、R1 的服务深度，以及
              Experian 的相邻数据优势都会带来真实压力。公开证据也太薄，无法比较各竞争者的净留存、流失或精确定价权，因此现在下绝对护城河结论还为时过早。平衡结论是，Cedar
              在一个庞大且拥挤的领域中位置不错，但未来差异化更多要来自执行质量和渠道杠杆，而不是任何清晰独占资产。另一个后果是，客户验证比功能清单更重要。在许多供应商都能模仿表层功能的领域，能在真实服务方运营中持续赢得信任的供应商，通常会守住更强的长期位置。竞争对手的公开市场披露有助于揭示规模，但不能替代对
