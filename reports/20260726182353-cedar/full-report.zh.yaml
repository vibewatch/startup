  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模块宽度与架构逻辑
        blocks:
          - type: paragraph
            body: >-
              Cedar 的产品故事如今显然是多模块的。公开材料显示，Cedar Pay、Cedar Cover、Cedar Support、Kora 和 Cedar Intelligence
              作为不同但相互连接的界面，运行在一个更宽的患者财务体验平台内。这一点很重要，因为它说明 Cedar
              想捕捉的不只是数字账单呈现，而是更多工作流。核心架构逻辑似乎是从账单和支付解决出发，经过保险覆盖和可负担性支持，再进入人工和 AI 辅助服务。Cedar Intelligence
              被定位为决定每位患者应看到哪条路径的层，这意味着公司希望产品像编排层一样运转，而不是静态账单前端。公开文档仍停留在较高层级，但足以支撑一个实用结论：Cedar
              看起来是搭在医疗账单、保险覆盖和支持系统之上的工作流平台，模块化界面既可以一起销售，也可以随时间扩展。模块化在商业上也很重要，因为它让 Cedar
              能扩大账户范围，而不必假装每个服务方第一天就必须购买全平台。它还解释了为什么 Cedar 每次发布新界面时，既能听起来像账单供应商，又像可负担性供应商，也像 AI 支持供应商，而不是明显换了品类。这也是
              Cedar 有理由长期扩大账户价值的原因之一。
