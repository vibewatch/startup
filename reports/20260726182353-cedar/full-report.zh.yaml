  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 品类结构与核心对手
        blocks:
          - type: paragraph
            body: >-
              比较 Cedar 时，应先把它放在患者财务互动和患者支付供应商中，而不是与所有触及收入周期的医疗软件公司对比。这个框架把 Waystar、Experian Health、R1、Flywire、Waystar 内的
              Patientco、Rectangle Health 和 Salucro 放进核心对手集合，但原因各不相同。Waystar
              是最明显的宽度型竞争者，因为它覆盖收入周期中更多环节，同时也拥有患者支付界面。Experian Health 在估算、价格透明和保险发现很重要的场景中很强。R1
              以服务权重更高的模式在企业级买家层面竞争；Flywire 则在支付基础设施本身构成战略优势的地方竞争。Rectangle Health 和 Salucro 在专科和中端市场更重要。关键结构点是，Cedar
              并不是唯一在解决账单摩擦的公司；它的差异化来自把患者体验、支付和医疗专用 AI 打包给服务方买家的方式。这个框架也能避免常见尽调错误：把任何带支付按钮的医疗公司都当作 Cedar
              的完整替代品。真正的替代品，是那些能在复杂服务方环境中可信改善患者财务解决效果的供应商。这个区别很重要。
