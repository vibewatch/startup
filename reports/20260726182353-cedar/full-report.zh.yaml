      - number: '4.2'
        title: 收入模式与部署经济性
        blocks:
          - type: paragraph
            body: >-
              Cedar 可见的收入模式已经宽于单一账单产品。公司现在销售并推广 Cedar Pay、Cedar Cover 和 AI
              支持界面，这意味着它的变现设计可以组合企业平台费、实施工作、服务层和长期交叉销售。这里的公开客户验证异常有用。Novant、ApolloMD、NAPA 和 Talkiatry
              都披露了结果指标，指向回款提升、数字采用率提高或支持负担降低。这些信号不等同于合并毛利率，但确实说明 Cedar 创造的经济价值可以支撑企业级定价。2026 年 AI 扩展和 2025 年 Kora
              发布，也指向一种模式：如果采用率上升，自动化可以改善运营杠杆。正确结论应保持平衡：Cedar
              在成功账户中很可能具备强部署层经济性，但公开记录仍无法让外部投资者推导完整收入桥或公司层盈利模型。这个区别对承销很关键，因为许多未上市医疗软件公司可以拿出漂亮案例，却仍隐藏整体留存弱、实施成本高或公司利润率低的问题。它也解释了公司为什么持续强调回款表现和支持负担降低：在不披露实际损益表的情况下，这些是少数能指向毛利质量的公开信号。公开披露仍有限。外部投资者仍需要真实报表、队列数据和现金流细节，才能把这些经济性称为已充分承销。
