      - number: '1.3'
        title: 融资历史、里程碑节奏与外部验证
        blocks:
          - type: paragraph
            body: >-
              Cedar 的融资历史比当前估值状态清楚得多。最强的披露融资锚点是 March 2021 的 $200 million Series D 轮，Cedar 称该轮将公司估值定在 $3.2 billion，投资方包括
              Tiger Global、Andreessen Horowitz、Thrive Capital 和 Concord Health Partners。公开记录没有显示 2025 年或 2026
              年刷新后的股权估值；这一点很重要，因为一些第三方目录在传播看似更新的数字，却缺少一手支持。不过，2024 年以来的里程碑节奏确实强化了运营故事。Cedar 通过 Cedar Cover 进入可负担性领域，通过
              Kora 和 Cedar Intelligence 进入 AI 服务，并借助 athenaOne 拓展分发。客户验证也明显加深：Novant、ApolloMD、Talkiatry、NAPA、Sanford 和
              LCMC 都证明 Cedar 已远远越过试点阶段的销售展示。TIME、Built In 和独立行业报道带来的外部背书，也强化了 Cedar 作为规模化品类玩家的地位。概览层面的开放缺口不是 Cedar
              是否重要；而是未上市市场今天该如何给这种重要性定价。换句话说，Cedar 的公开材料足以支撑强身份和强牵引力叙事，但不足以精确定价未上市市场风险。这种不对称应塑造后续尽调：后续章节可以倚重 Cedar
              的产品和客户验证，但只要分析依赖当前估值、精确员工数或未披露财务结构，就应保留谨慎。
