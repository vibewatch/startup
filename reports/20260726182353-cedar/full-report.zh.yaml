  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险图景
        blocks:
          - type: paragraph
            body: >-
              Cedar 同时处理患者数据、支付工作流、可负担性决策和服务方沟通，因此身处软件中监管最重的角落之一。最强的公开风险信号不是已知的 Cedar 专属执法事件，而是 HIPAA 安全预期和 No Surprises
              Act 工作流执行周围不断收紧的监管环境。HHS 和法律评论都清楚表明，网络安全控制、争议工作流和患者账单沟通标准正变得更有规定性，而不是更宽松。Epic 和 Oracle 纠纷虽然没有点名
              Cedar，但在这里很重要：它们说明，一旦医疗数据和平台依赖相互碰撞，互操作性、隐私和供应商责任问题会很快变成诉讼问题。正确结论是，即便没有当前公司专属的头条案件，也应把 Cedar
              的法律和监管暴露视为结构性重大。这个背景使公开合规舒适感无法替代实际尽调，因为规则本身仍在变化。它还意味着，不能按“患者账单体验处在更广泛医疗数据和支付运营监管边界之外”的假设承销
              Cedar。投资者应假设监管会继续移动，而不是规则手册静止不变。这个假设应塑造尽调顺序。
