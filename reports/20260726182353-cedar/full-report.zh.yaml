              公开记录在耐久性和集中度上远比客户标识质量薄。有些故事暗示多年关系或跨职能价值，Highmark 与 Allegheny Health Network 周围的支付方—服务方协作证据也显示，Cedar
              的价值可以超出狭窄账单支付互动。不过，公开材料没有披露当前客户数、按收入划分的分群结构、头部账户集中度、流失或净收入留存。这种不确定性很重要，因为一家公司可以拥有优秀旗舰引用，同时仍承担有意义的集中度或续约风险。最平衡的结论是，Cedar
              的客户章节应提高对采用质量的信心，但不能取消对装机基础经济性的尽调。后续估值和建议工作可以依靠具名结果故事来证明能力，同时仍把留存、集中度和扩张深度视为未解决的尽调问题；这些问题可能实质性改变承销图景。因此，引用质量很高，但整体客户群能见度仍有限。企业软件投资者常常过度解读少数旗舰引用，这让这种不确定性格外重要。仍然需要更完整的队列数据。
