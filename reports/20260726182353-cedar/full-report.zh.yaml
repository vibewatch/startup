chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品叙事与可复用的规模事实
        blocks:
          - type: paragraph
            body: >-
              应把 Cedar 视为后期未上市的患者财务互动平台，而不是泛化的医院软件供应商。官网把它描述为一个统一操作界面，覆盖账单、支付、保险覆盖和支持；到 2026 年，产品叙事越来越强调 Cedar
              Intelligence 是连接层，用来个性化每个患者旅程。这个定位很重要，因为后续章节需要稳定的身份锚点：Cedar 不只是卖更好的账单通知；它想成为围绕患者付款解决的互动系统。就未上市公司而言，Cedar
              的公开规模口径异常强。公司称已服务超过 58 million 名患者，处理 $13.6 billion 患者支付，并承载大约 1.3 billion 次患者支付互动。April 2026 的 AI
              公告又加上一层验证：公司称有超过 1.5 billion 次历史互动、50 million 条患者旅程，以及超过 80 个建模患者属性。可复用的正确结论是，Cedar
              确实具备品类规模，但最大的一批数字多数仍是公司口径，而非独立审计。概览还说明，为什么 Cedar
              在战略上同时贴近收入周期软件和医疗可负担性工作流：平台描述和后续发布始终把数字账单、支付计划路由、保险覆盖支持和支持自动化接成一个运营闭环。这个宽度很重要，因为它解释了 Cedar
              为什么有理由同时面向大型医疗系统和复杂医生集团销售，而不必改写核心产品叙事。
