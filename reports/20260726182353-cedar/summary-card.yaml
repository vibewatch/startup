  topStrengths:
    - >-
      Cedar’s public customer proof is unusually strong for a private company, with named health systems and multiple
      quantified outcome stories.
    - >-
      The product has broadened from billing UX into coverage, affordability, support automation, and AI orchestration,
      which strengthens platform value.
    - >-
      The company still benefits from an attractive market backdrop where patient-pay friction, affordability pressure,
      and digital expectations remain durable demand drivers.
  topRisks:
    - >-
      Current ARR, gross margin, retention, concentration, and capital-stack details remain opaque, making public-only
      underwriting inherently incomplete.
    - >-
      Cedar faces meaningful dependency and competitive pressure from broader suites, service-heavy operators, and
      partner ecosystems that influence delivery quality.
    - >-
      Healthcare privacy, billing, and cybersecurity requirements are tightening, which raises execution and compliance
      risk for any scaled patient-financial-engagement vendor.
  unresolvedGaps:
