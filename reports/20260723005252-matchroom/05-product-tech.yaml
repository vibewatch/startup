callouts:
  - calloutType: strength
    title: "PDC Circuit Governance Creates Self-Reinforcing Product Moat"
    body: "Owning the PDC means Matchroom controls the scheduling, ranking, and qualification system for professional darts globally. This institutional architecture is not replicable by a technology-only competitor and constitutes a product moat based on governance rather than software."
    claimRefs: [CE013, CE014]
  - calloutType: risk
    title: "No Proprietary Consumer Platform Creates DTC Revenue Gap"
    body: "Matchroom does not operate a proprietary direct-to-consumer streaming platform. All consumer-facing distribution is managed by DAZN, Sky Sports, or BBC. This limits Matchroom's ability to capture first-party fan data and reduce broadcaster dependence. UFC's DTC platform (UFC Fight Pass) is a model Matchroom has not replicated."
    claimRefs: [CE012, CE015, CE016]
  - calloutType: insight
    title: "Two Circles Analytics Partnership Signals Data Monetisation Intent"
    body: "Matchroom's relationship with Two Circles (a sports data analytics company backed by Bruin Capital's portfolio) signals an ambition to move from pure rights-licensing toward data-driven fan engagement. This is an early-stage capability but potentially important for long-term revenue diversification."
    claimRefs: [CE011, CE017]
  - calloutType: assumption
    title: "Product Roadmap Inferred from Bruin Capital Deal Context"
    body: "No official Matchroom product roadmap is publicly available. The digital audience monetisation and analytics roadmap items presented in this chapter are inferred from the Bruin Capital partnership announcement and the strategic logic of Bruin's sports technology portfolio."
    claimRefs: [CE017, CE018]

