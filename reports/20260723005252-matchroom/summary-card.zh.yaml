  topStrengths:
    - PDC 飞镖治理权构成结构性护城河——选手被绑定，替代巡回赛缺位，Littler 时代增长爆发
    - DAZN 合约以史无前例的规模锁定拳击经济收益至 2031 年（$1B/5 年）
