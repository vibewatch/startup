  topRisks:
    - DAZN 对手方集中度高（约占拳击收入 35–45%），而平台累计亏损 $4B+，盈利时间表缺位
    - Eddie Hearn 关键人依赖突出——继任计划未披露，拳手关系高度个人化
    - Anthony Joshua 2026 年暂停职业生涯，已经兑现高端拳击赛事供给风险
    - 2031 年 DAZN 合约续约是中期投资逻辑能否成立的关键断点
    - £1B+ 入场（估计约 15–18x EBITDA）已计入现有经济性延续，下行缓冲有限
  unresolvedGaps:
