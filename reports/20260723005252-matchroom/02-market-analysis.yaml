callouts:
  - calloutType: insight
    title: "Streaming Platform Competition Structurally Benefits Rights Holders"
    body: "The competition among DAZN, Amazon, Apple, and Peacock for premium live sports rights has materially inflated deal values. Matchroom is well-positioned to benefit from this dynamic as a multi-sport rights owner with diversified audience reach."
    claimRefs: [CM017, CM018]
  - calloutType: risk
    title: "DAZN Dependency Creates Concentrated Counterparty Risk"
    body: "A single platform partner (DAZN) likely accounts for 50%+ of Matchroom's boxing media rights income. DAZN has had well-documented financial challenges. A DAZN distress event would force costly rights renegotiation or gap coverage during the 2026–2031 term."
    claimRefs: [CM021, CM024]
  - calloutType: assumption
    title: "Market Size Estimates are Highly Uncertain"
    body: "No public research firm provides Matchroom-specific sport portfolio market sizing. All TAM/SAM estimates in this chapter are editorial approximations based on known deal values (DAZN $1B/5yr, Sky Sports disclosures) extrapolated to wider market context."
    claimRefs: [CM006, CM007]

