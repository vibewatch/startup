            body: >-
              Matchroom has no publicly disclosed succession plan for Eddie Hearn. His departure would allow competitive
              promoters to recruit the Matchroom boxing roster at contract renewal, eliminating the primary driver of
              boxing event value. Key-person insurance is standard practice but cannot offset commercial disruption.
