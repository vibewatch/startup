      - number: '4.2'
        title: Cost Structure, Gross Margin, and Operating Leverage
        blocks:
          - type: paragraph
            body: >
              Matchroom's principal cost categories are (1) event production and operational costs (venue hire,
              broadcast production, security, talent guarantees), (2) boxer purses and PDC prize money obligations, (3)
              staff and overhead (estimated ~500–700 employees), and (4) content distribution and marketing. The nature
              of live sports event production creates a semi-variable cost structure: while fixed costs of the
              infrastructure and staff base persist, per-event costs are incremental and can be managed through event
              cancellation or rescheduling.

              Post-tax profit of £44M on £225.5M revenue implies a net profit margin of approximately 19.5%. This is
              healthy for a sports media and events business, though below the margins of pure-IP/media businesses given
              the working capital intensity of live event operations. Boxing purse costs are the largest variable cost
              item; for major events such as Joshua fights, fighter guarantees can range from low seven figures for
              domestic cards to reportedly $30–50M+ for major heavyweight title bouts. These are partially or fully
              recovered from gate receipts and media rights allocation.

              The PDC darts business operates with a fundamentally different cost structure: the prize money fund (PDC
              paid out £17.9M in prize money in 2024-25 according to press reports) is recovered through commercial
              partners, and broadcast income provides a high-margin contribution. WST similarly benefits from recurring
              broadcast rights income with limited per-event marginal costs beyond venue and production.

              Capital expenditure for Matchroom is primarily production equipment, digital infrastructure, and leasehold
              improvements. The business has historically been asset-light relative to major sporting bodies (no stadium
              ownership, no permanent venue). Working capital is managed around event advance ticket sales and media
              rights pre-payments providing positive float. The Bruin Capital investment may fund further US expansion
              of boxing events and possible technology platform build-out for digital audience monetisation.
