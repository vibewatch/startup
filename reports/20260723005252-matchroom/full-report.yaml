      - number: '6.2'
        title: Adoption Trajectory and Usage Metrics
        blocks:
          - type: paragraph
            body: >
              Matchroom's B2B customer adoption is measured primarily by multi-year contract renewals. The DAZN deal
              through 2031 represents a five-year customer commitment at ~$1B total, indicating very strong customer
              retention at the most important customer tier. PDC's Sky Sports deal is multi-year and has been renewed
              multiple times over the past decade, indicating a durable broadcaster-circuit relationship. The BBC's
              snooker World Championship coverage has run continuously since 1978, one of the longest continuous sports
              broadcast relationships in UK television history, representing extremely durable customer adoption.

              B2C adoption is tracked through ticket sales and event attendance. PDC World Championship at Alexandra
              Palace (18-day event) has been sold out for multiple consecutive years. Approximately 80,000 tickets are
              sold over the 18-day event. The arrival of Luke Littler in 2023-24 drove a significant demand spike for
              PDC events: his debut run to the World Final saw record TV viewing figures on Sky Sports, with a reported
              4.9 million peak viewers on Sky Sports for the 2024 PDC World Championship final. This demand spike
              translated into immediate secondary ticket market price increases and rapid sellout of PDC events.

              In boxing, Anthony Joshua's fights have historically achieved some of the highest UK boxing attendance
              figures: Wembley Stadium (90,000 for Joshua vs Klitschko, April 2017) and the O2 Arena sellouts. DAZN's
              subscriber growth (global DAZN subscriptions were approximately 10 million by early 2024 by press
              estimates) has been partly attributed to its boxing content. Joshua fights and Matchroom's fight portfolio
              are among DAZN's most-watched global events.

              PDC's global darts expansion, driven by the Luke Littler effect and growing European darts markets
              (Netherlands, Germany, Austria), has seen PDC events sell out faster in 2025-26 than in prior years. The
              World Matchplay, UK Open, and European Championship all report strong demand. The Premier League Darts
              17-night tour covers major UK and European cities, with most venues sold out.
