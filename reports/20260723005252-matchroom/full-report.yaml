            title: Streaming Platform Competition Structurally Benefits Rights Holders
            body: >-
              The competition among DAZN, Amazon, Apple, and Peacock for premium live sports rights has materially
              inflated deal values. Matchroom is well-positioned to benefit from this dynamic as a multi-sport rights
              owner with diversified audience reach.
            calloutType: insight
