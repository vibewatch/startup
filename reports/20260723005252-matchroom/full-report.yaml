chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Scale
        blocks:
          - type: paragraph
            body: >
              Matchroom Sport Limited is a privately held British multinational sports promotion, rights management, and
              media production company headquartered at Mascalls, Brentwood, Essex, England. Founded in 1982 by Barry
              Hearn, the company began as a snooker management agency before expanding progressively into boxing, darts,
              pool, snooker tour management, golf, table tennis, and numerous other disciplines. As of 2026, Matchroom
              is widely recognised as the UK's largest independent sports promotion business and one of the world's most
              significant sports rights organisations outside of the US major-league system.

              The business model rests on three interlocking pillars: (1) live event promotion and gate revenue across
              600+ event days annually, (2) global media rights sales and long-term broadcast partnerships generating
              2,400 hours of original programming per year, and (3) ownership stakes in the governing or commercial arms
              of several sports, notably the Professional Darts Corporation (PDC, majority stake since 2001) and World
              Snooker Tour (WST, 51% stake since 2010). This integrated model gives Matchroom both upstream control of
              intellectual property and downstream control of distribution, which is a structural advantage over pure
              promoters.

              Key financials for the year ending June 30, 2025 show turnover of approximately £225.5 million (~$306.7M)
              and post-tax profit of £44 million (~$59.8M). Boxing is the single largest division: as of 2023, boxing
              alone accounted for approximately $235 million of annual revenue, driven primarily by the long-running
              global partnership with DAZN. The company stages events across the UK, United States, Saudi Arabia,
              Australia, and multiple European markets, and holds broadcasting agreements with DAZN, Sky Sports, ITV,
              BBC, Peacock (NBCUniversal), Eurosport, Foxtel/Kayo Sports, and numerous regional channels.
