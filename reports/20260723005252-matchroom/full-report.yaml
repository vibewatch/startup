      - number: '1.3'
        title: Ownership, Capital Structure, and the Bruin Capital Transaction
        blocks:
          - type: paragraph
            body: >
              Matchroom Sport is a private company, incorporated in England and Wales. Prior to the May 2026
              transaction, the Hearn family held the entirety of the business. Historical public records and press
              reporting confirm the company was entirely family-controlled. The structure follows a traditional
              family-enterprise model without external venture capital or listed equity.

              In May 2026, Bruin Capital—a US-based sports, media, and entertainment investment platform founded in 2015
              by George Pyne—acquired a 15% minority equity stake in Matchroom Holdings Ltd., the parent company of
              Matchroom Sport. The transaction was announced on May 11, 2026, and valued the business at more than £1
              billion (approximately $1.36–1.4 billion). The deal positioned Matchroom as a unicorn-class UK sports and
              media company. As part of the transaction, Bruin received a board seat. Financial terms beyond the stake
              size and indicative valuation were not publicly disclosed.

              Earlier PE interest was documented but did not result in transactions: in 2022, Barry Hearn confirmed
              discussions with KKR, CVC Capital Partners, and Searchlight Capital Partners that did not progress. In
              2024, Pitch International, a UK-based sports rights and events agency, completed a smaller minority
              investment focused on media rights and events. The Bruin deal therefore represents the most significant
              external capital transaction in Matchroom's 44-year history, and the first that resulted in a named US
              institutional investor joining the board. The strategic rationale cited by both parties centres on
              accelerating US market penetration, expanding digital and DTC distribution, and leveraging Bruin's
              analytics and platform expertise.

              Bruin Capital's portfolio includes Box to Box Films, TGI Sport, AS1, Full Swing, and FairPlay Sports
              Media. Its recently closed $1 billion fund attracted investors including 26North (Josh Harris's firm) and
              TJC Partners. Previous Bruin exits include On Location (sold to Endeavor) and Two Circles (analytics
              company sold separately).
