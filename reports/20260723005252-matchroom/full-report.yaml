  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >
              Matchroom's risk landscape is concentrated in a small number of high-severity items. The most material
              risk is the combination of DAZN counterparty concentration and DAZN's financial health: boxing media
              rights from DAZN represent an estimated 35–45% of Matchroom's group revenue, and DAZN has reported
              cumulative operating losses exceeding $4 billion through 2024. Any DAZN distress event—restructuring,
              platform exit, or forced renegotiation—would be the most damaging scenario for Matchroom.

              The second-tier risks are key-person dependency (Eddie Hearn is the personal face of Matchroom's boxer
              relationships; his departure or incapacitation would threaten fighter contract renewals) and Anthony
              Joshua's career risk (injury, retirement, or extended personal pause reduces the highest-margin boxing
              product's frequency). Joshua's 2026 pause from boxing following personal losses is a live realisation of
              this risk—though not expected to be permanent, it illustrates the dependency.

              Third-tier risks include WPBSA governance disputes within WST, Saudi Arabian capital disrupting boxing
              event economics, PDC contract expiry timing, and broader market risks from streaming consolidation and MMA
              audience competition.

              Probability-weighted assessment: The highest-probability risk is the DAZN 2031 contract renewal
              negotiation, which while not an immediate threat, is the most consequential medium-term event. The most
              immediately live risk is the Joshua pause and near-term boxing event schedule gap. The lowest-probability
              but highest-impact scenario is a global event disruption (COVID-19 equivalent) that eliminates live
              attendance income.
