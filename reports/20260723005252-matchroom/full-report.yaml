      - number: '7.3'
        title: Operational Risk and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >
              Matchroom's operational model is asset-light and event-based. The primary operational risks are: (1) venue
              unavailability or force majeure (a major O2 Arena booking cancellation would require rapid rescheduling),
              (2) fighter withdrawal at short notice (injury, illness, personal circumstances—as realised with Joshua in
              2026), (3) broadcast production failure (technical failure during a premium live event), and (4) event
              safety incidents (ringside injuries, crowd incidents, or security failures).

              Key-person risk is acute. Eddie Hearn is the defining personality of Matchroom Boxing. He personally
              manages relationships with world champions, negotiates contracts, and represents Matchroom's brand
              globally. His public persona (social media, YouTube content, "No Filter Boxing" interview series)
              generates significant ancillary media value. Were Hearn to depart, competing promoters (Top Rank, PBC,
              Queensberry) would likely aggressively recruit his fighter roster at contract renewal. There is no
              publicly disclosed succession plan for the boxing promoter role.

              Barry Hearn's reduced operational role (he formally stepped back from day-to-day management while
              remaining as executive chairman) means Eddie Hearn is effectively the sole face of the company externally.
              Key-person insurance for senior executives is standard in UK companies of Matchroom's size, but the
              reputational and commercial disruption from a Hearn departure could not be fully mitigated by insurance
              proceeds.

              For PDC and WST, operational risk is lower because the circuits operate independently with their own
              management teams. Matt Porter (PDC CEO), Barry Hearn (remaining PDC board member), and the WST operational
              team provide institutional continuity beyond Eddie Hearn. A PDC Tour Director departure would be an
              operational risk but not an existential one, unlike an Eddie Hearn departure from boxing.

              COVID-19 demonstrated the acute operational risk from live event bans. During 2020-21, Matchroom ran
              boxing events behind closed doors, relying entirely on media rights income. The business survived this
              stress test, but attendance income (~£50M+ estimated) was eliminated for over 12 months. A repeat pandemic
              scenario is the lowest-probability, highest-operational-impact risk in the portfolio.
            claimRefs:
              - CR011
              - CR012
