  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Asset Map
        blocks:
          - type: paragraph
            body: >
              Matchroom's product portfolio spans ten sports disciplines across three tiers: core sports (boxing, darts,
              snooker — the three primary revenue drivers); established secondary sports (pool, table tennis); and
              development sports (lacrosse, multisport events). Within each sport, the core product unit is the live
              event: a single competition or tournament delivered to fans via live attendance and broadcast
              simultaneously.

              Boxing is the flagship product. Matchroom Boxing promotes world championship events globally, with Eddie
              Hearn managing the promotional rights for fighters including Anthony Joshua, Jaron Ennis, Dmitry Bivol,
              Jesse Rodriguez, and Katie Taylor. Each boxing event is a distinct product unit: a defined fight card with
              a headline bout, supporting bouts, and a venue/production package. Events range from domestic arena shows
              (O2 Arena, Manchester AO Arena) to international stadium events (New York, Riyadh, Dubai). The broadcast
              product is the live stream/TV transmission, delivered to DAZN globally and to terrestrial/satellite
              partners regionally.

              The PDC darts product is a season-long circuit: 221 professional players compete across multiple
              tournaments (World Championship, Premier League, World Matchplay, European Championship, Grand Slam of
              Darts) culminating in the PDC World Championship at Alexandra Palace each December-January. The television
              product is a multi-broadcaster package: Sky Sports carries the majority of UK-broadcast events; ITV and
              ITV4 carry free-to-air events including the World Championship; DAZN carries international streaming
              rights. The PDC product is notable for its sold-out live event demand and its growing appeal to a younger
              audience, amplified by the Luke Littler phenomenon from 2023-24.

              The WST snooker product is the professional circuit across a 28-event season, with the World Snooker
              Championship at Sheffield's Crucible Theatre as its centrepiece. Broadcast rights are held by BBC
              (free-to-air, UK), Eurosport/Discovery+ (European and international pay-TV), and CCTV-5 (China). Snooker's
              audience is demographically skewed older than boxing and darts but has significant Chinese audience scale,
              with CCTV-5 rights representing a major revenue stream.

              Minor sports include: Matchroom Pool (staging events like the Mosconi Cup between US and Europe teams),
              World Championship of Ping-Pong (table tennis), and the Weber Cup (USA vs. Europe darts format). These are
              smaller revenue contributors but extend Matchroom's content production scale.
