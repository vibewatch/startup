      - number: '4.4'
        title: Capital Adequacy, Financing, and Financial Verdict
        blocks:
          - type: paragraph
            body: >
              Matchroom is a profitable, cash-generative private business with no disclosed bank debt burden at the
              group level. The Bruin Capital transaction in May 2026, valuing the business at £1B+, was a minority
              equity sale (15%) by the Hearn family, not a primary capital raise. The proceeds from the Bruin
              transaction went to the Hearn family (existing shareholders), not to the company balance sheet, unless
              structured with a primary component—this distinction is not publicly confirmed.

              Matchroom's FY2025 results (revenue £225.5M, post-tax profit £44M) suggest strong cash generation
              capacity. At a normalised capex requirement and working capital cycle, the business likely generates
              £30–50M+ in annual free cash flow (after tax, interest, and capex), sufficient to self-fund organic
              expansion without external financing. Any US expansion initiative (new US boxing events, PDC US presence,
              digital platform) could be funded from operational cash flow over a 2–3 year horizon without debt.

              The capital structure risk is the implicit debt of fighter guarantees and contracted prize money
              obligations across PDC and WST. While these are operational commitments rather than financial debt, they
              represent contracted cash outflows that could create stress if event revenues fall (e.g., from a
              broadcaster default, a major venue cancellation, or a pandemic-style event). The COVID-19 period saw
              Matchroom operate events without audiences, relying entirely on media rights income, which stress-tested
              the business model.

              Financial verdict: Matchroom's financials reflect a well-managed profitable sports media and events
              business at a scale typically associated with listed entities. A £1B+ enterprise value at ~4.4x revenue
              and ~23x post-tax profit is modest relative to global sports media benchmarks (where multiples of 15–30x
              EBITDA are common for rights-owning entities). The primary diligence blockers are: (1) no access to full
              audited accounts or EBITDA break-down; (2) DAZN counterparty risk; (3) unconfirmed use of Bruin Capital
              proceeds; and (4) no disclosed leverage ratio or net debt position.
