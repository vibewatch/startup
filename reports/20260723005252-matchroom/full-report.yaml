  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for Matchroom rests on three compounding advantages: (1) structural governance moats
              in professional darts (PDC) and snooker (WST), providing recurring revenue streams that competitors cannot
              easily replicate; (2) the transformative DAZN partnership, which monetises the boxing portfolio at
              unprecedented scale and locks in economics through 2031; and (3) highly resilient cash generation — £44M
              post-tax profit on £225.5M revenue represents a 19.5% net margin that is exceptional for a live events and
              sports promotion business.

              The anti-thesis is led by concentration and key-person risk. Approximately 35–45% of group boxing revenue
              flows through a single counterparty (DAZN) whose own financial model has generated $4B+ in cumulative
              losses. The second anti-thesis element is the Anthony Joshua dependency: the prolonged career pause in
              2026 demonstrates concretely that the highest-margin event tier is exposed to individual human decisions.
              Third, Eddie Hearn is the irreplaceable commercial face of Matchroom Boxing; no succession mechanism is
              publicly disclosed. Fourth, the £1B+ entry price prices in continuation of the current earnings level with
              limited margin of safety.

              The most differentiated positive in the Matchroom case is not boxing (where the risks are high) but the
              PDC darts circuit: it is structurally captive (no viable player alternative), growing rapidly in
              viewership (Littler phenomenon is the biggest darts catalyst in 20 years), and underpinned by a
              diversified broadcast model (Sky Sports + ITV + DAZN international). At a sum-of-the-parts level, the PDC
              darts business alone may justify 30–40% of the £1B+ group valuation.

              The most differentiated negative is the 2031 DAZN cliff: five years is a long time in media rights, and
              DAZN's financial model has yet to be proven viable. If DAZN cannot renew at comparable terms, Matchroom
              will need to re-contract boxing rights at a potentially lower level, compressing the boxing revenue stream
              materially.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
