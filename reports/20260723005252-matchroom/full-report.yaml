  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundaries, and Adjacent Sectors
        blocks:
          - type: paragraph
            body: >
              Matchroom's commercial footprint spans three interlocking market categories. The primary market is sports
              event promotion and production, encompassing the staging, broadcasting, and commercial exploitation of
              live sporting contests. The secondary market is sports media rights licensing, where Matchroom sells
              broadcast and streaming rights to distributors such as DAZN, Sky Sports, ITV, BBC, Peacock, and Eurosport.
              The tertiary market includes sports intellectual property ownership and tournament organisation,
              particularly through the PDC (darts) and WST (snooker), which generate recurring annual revenue
              independent of any single event.

              The global sports media rights market represents the most significant revenue pool. According to industry
              sources, global sports broadcasting rights revenues have grown consistently through the 2020s, driven by
              streaming platform competition for premium live content. DAZN alone has committed multiple billions in
              rights spending across combat sports, football, and other properties. Sky Sports in the UK continues to
              spend several hundred million pounds annually on rights across darts, boxing, and cricket. The broader
              global sports event market, including gate revenue, sponsorship, and on-site hospitality, is a
              multi-hundred-billion-dollar industry segment.

              Excluded from Matchroom's core market: team ownership (no football clubs, franchises, or leagues directly
              owned), gambling and fantasy sports (adjacent but not operated), mainstream US major-league sports (NFL,
              NBA, MLB, NHL — competed in only tangentially via DAZN), and agency/management of individual athletes
              (limited exposure through Matchroom Talent division). Key adjacencies include esports (not currently
              active), data analytics licensing (early-stage, Bruin Capital expertise relevant), and direct-to-consumer
              subscription video (nascent through DAZN partnership).
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
