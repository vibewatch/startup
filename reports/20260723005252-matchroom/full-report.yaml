  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - DAZN default or distress renegotiation
        - DAZN fails to make a scheduled rights payment or initiates material fee renegotiation before 2031
        - Eliminates ~35–45% of boxing revenue; reduces group EBITDA by ~£15–25M+; compresses valuation by 30–40%
        - Immediate thesis break; reassess valuation and exit options
      - - Eddie Hearn departure + fighter defections
        - Hearn departs AND 2+ top-tier fighters (Joshua/Ennis/Bivol) sign with competitor promoter within 12 months
        - Destroys boxing commercial franchise; PDC/WST unaffected but boxing division heavily impaired
        - Thesis break for boxing; sum-of-parts valuation drops to PDC/WST standalone (~£300–500M)
      - - Joshua permanent retirement
        - Joshua publicly confirms retirement AND no headline replacement secured within 12 months
        - Reduces premium boxing event supply by ~30–40%; weakens DAZN relationship management leverage
        - Partial thesis impairment; monitor replacement development
      - - PDC media rights compression
        - Sky Sports declines PDC renewal or renews at 30%+ lower real-terms fee
        - PDC is the most resilient revenue stream; any compression is materially negative
        - Escalating concern; re-evaluate PDC standalone valuation
      - - WPBSA governance court ruling against Matchroom
        - WPBSA successfully challenges Matchroom's 51% WST commercial control
        - WST commercial control lost; snooker moat partially eliminated
        - Escalating concern; legal risk realised
    notes: All thresholds are editorial. None are verified against Matchroom's actual governance or monitoring processes.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - DAZN financial health
        - DAZN subscriber count (Q2 2026), latest investor round details, DAZN financial projections
        - Single most important risk to thesis; $4B losses with no disclosed profitability path
        - Access Industries / DAZN investor relations; press monitoring
      - - Eddie Hearn employment contract
        - Contract term, retention incentives, non-compete, key-person insurance policy details
        - Key-person risk has no public mitigation; contract length determines lock-in period
        - Matchroom legal counsel; Hearn directly
      - - Joshua promotional contract
        - Contract term remaining, competition/pause/retirement clauses, minimum fight obligations
        - Most immediately live risk; Joshua pause in 2026 already materialised
        - Matchroom promoter agreement with Joshua manager Hussain Joseph
      - - Group-level audited EBITDA
        - FY2025 Companies House full filing (not yet publicly available for full P&L); FY2024 comparator
        - All valuation multiples hinge on true EBITDA; post-tax profit is the only confirmed metric
        - Companies House; UK Companies Act accounts filing deadline
      - - PDC broadcast rights renewal schedule
        - Sky Sports PDC contract expiry date; renewal negotiation timeline
        - PDC is the most structurally resilient revenue stream; contract expiry is the key medium-term trigger
        - PDC official; Sky Sports media rights team
      - - DAZN boxing deal terms (deal economics)
        - 'Exact deal structure: guaranteed minimums vs. revenue share; per-event vs. annual lump sum'
        - Determines how much of boxing revenue is guaranteed regardless of event frequency
        - Matchroom / DAZN commercial terms; press reports as proxy
    notes: All diligence asks are editorial and reflect gaps identified during public-source-only research.
    claimRefs:
      - CV025
      - CV026
      - CV027
