      - number: '5.4'
        title: Trust, Safety, Compliance, and Quality Controls
        blocks:
          - type: paragraph
            body: >
              Matchroom operates in heavily regulated industries: professional boxing (licensed by national athletic
              commissions per jurisdiction), professional darts (PDC rules), and professional snooker (WPBSA/WST
              governance). Each sport maintains its own trust and safety framework.

              In boxing, fighter safety is governed by the regulatory commission for each jurisdiction: the British
              Boxing Board of Control (BBBofC) in the UK, State Athletic Commissions in the US, and the Dubai Sports
              Council, Saudi General Authority for Sport, and other bodies for international events. Each event requires
              licensed doctors and medical staff ringside, pre-fight medicals, and post-fight review. Matchroom as
              promoter must comply with licensing requirements for each jurisdiction in which it operates events.

              Doping compliance is handled by the UK Anti-Doping (UKAD) for PDC events in the UK, and by WADA-compliant
              national bodies internationally. The PDC has a doping control agreement and all ranked players are subject
              to testing.

              The PDC's player code of conduct governs on-stage behaviour, media obligations, and tournament
              participation requirements. Matchroom/PDC's compliance with broadcast standards (Ofcom in the UK) is
              required for Sky Sports and ITV broadcasts.

              The DAZN platform carries Matchroom content, and DAZN is responsible for compliance with age verification,
              gambling advertising restrictions, and data protection regulations in each territory. GDPR compliance for
              UK and EU fan data is DAZN's responsibility for subscribers; Matchroom handles data for its own direct
              ticketing platforms.

              Quality control in production is maintained through production runbooks, rehearsals, and redundancy
              systems (backup broadcast feeds, generator power at venues). Matchroom's production team has decades of
              experience and its quality standards are consistent with major sports broadcasting requirements (HD/4K
              video, redundant communication systems, multi-language commentary options for international events).
            claimRefs:
              - CE019
              - CE020
              - CE021
              - CE022
              - CE023
              - CE024
              - CE025
