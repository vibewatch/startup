      - number: '7.4'
        title: Financial, Model, and Partner Risk — Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              DAZN concentration risk is the most critical financial model risk. The $1B/5-year boxing rights deal
              through 2031 covers the medium term, but DAZN's financial model requires ongoing subscriber growth and
              investor capital. DAZN's historical investors include Access Industries (Len Blavatnik), with reported
              total losses of $4B+ through 2024. If DAZN were to cease operations or be acquired by a competitor,
              Matchroom would face an emergency re-contracting process. Alternative broadcasters (Sky Sports, DAZN
              successor, Amazon Prime Video) would likely emerge as suitors, but at potentially lower fee levels.

              The PDC darts broadcast economics are more diversified (Sky Sports primary UK, ITV free-to-air, DAZN
              international) and thus less concentrated. Similarly, WST's multi-broadcaster model (BBC, Eurosport,
              CCTV-5) provides revenue diversification. The boxing division carries the most concentration risk.

              The Bruin Capital transaction provides both upside (analytics capability, US market access, Bruin
              portfolio resources) and a risk trigger: private equity investors have finite holding periods and return
              requirements. With Bruin at 15%, its governance rights are limited, but if Bruin sought to sell its stake
              at a premium valuation in 5–7 years, it could introduce a new investor with different strategic
              priorities. The Hearn family's majority control (85%+) provides significant structural protection,
              however.

              Currency risk: Matchroom's DAZN deal is denominated in USD, while the majority of costs are in GBP and
              EUR. GBP/USD exchange rate movements create translational risk in reported GBP revenue. A strengthening
              pound would reduce the GBP equivalent of USD rights fees.

              Kill criteria and thesis-break triggers: The investment thesis on Matchroom breaks if: (1) DAZN defaults
              on or materially renegotiates the boxing rights deal before 2031; (2) Eddie Hearn departs and two or more
              top-tier fighters follow; (3) Anthony Joshua retires permanently without a replacement headliner at
              comparable commercial scale; (4) PDC and WST face a structural governance crisis that leads to player
              defections. All four of these events are currently assessed as low-to-medium probability but would be
              extremely damaging.
