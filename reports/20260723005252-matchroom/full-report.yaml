      - number: '8.4'
        title: Bull, Base, Bear Scenarios and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Three scenarios span the distribution of Matchroom outcomes over a 5-year investment horizon.

              The bull case assumes: Joshua returns to active boxing within 12 months and remains dominant for 5 more
              years; DAZN's financial position stabilises and the 2031 renewal is completed at comparable or higher
              fees; PDC darts continues its explosive viewership growth and commands a Sky Sports rights upgrade;
              WST/snooker captures incremental Chinese broadcast value; and Bruin Capital's sports analytics capability
              generates new data-driven revenue streams. In this scenario, group revenue reaches £350–400M by FY2030,
              EBITDA grows to £90–110M, and at 18–20x EBITDA, Matchroom could be worth £1.6–2.2B, supporting an
              investment return of 1.8–2.5x on the £1B+ entry.

              The base case assumes: Joshua returns within 18 months with 2–3 premium events before retirement; DAZN
              renews in 2031 at slightly lower real terms; PDC darts grows moderately with Sky rights renewal; WST
              maintains BBC relationship; group revenue reaches £270–300M by FY2030, EBITDA ~£65–80M, and at 15x EBITDA,
              Matchroom is worth £975M–£1.2B. A 5-year investment at £1B+ yields modest returns of 0.9–1.2x (near
              capital preservation, or a small positive IRR if entry is at a discount). This is the "hold"
              scenario—manageable but not compelling for PE investors.

              The bear case assumes: Joshua does not return meaningfully; DAZN distress forces a boxing rights
              renegotiation in 2029–30 at materially lower fees; PDC/WST grow steadily but cannot offset boxing decline;
              group revenue stagnates at £200–230M, EBITDA compresses to £40–55M, and at 12x EBITDA, Matchroom is worth
              £480–660M. An investment at £1B+ would result in a loss of 35–50% of capital in this scenario.

              The recommendation is neutral. The business is exceptional in quality and operational execution. The moats
              are real and durable (especially PDC). The current earnings are strong. But the entry valuation at £1B+
              does not provide adequate margin of safety given the DAZN concentration risk and key-person dependency. A
              compelling entry would be at £800–850M or below. The priority diligence asks before committing are: (1)
              DAZN subscriber and financial health audit; (2) Eddie Hearn contract and succession; (3) Joshua contract
              terms; (4) PDC broadcast rights renewal schedule; (5) audited group-level EBITDA and capex for FY2025.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: table
            tableRef: TV006
            claimRefs:
              - CV025
              - CV026
              - CV027
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Neutral — Compelling Business, Full Valuation
            body: >-
              Matchroom is one of the UK's most impressive private sports businesses: structurally moated circuits,
              exceptional margins, and a proven £1B+ commercial franchise. However, the £1B+ entry price does not
              provide adequate margin of safety against the very real DAZN concentration risk and key-person dependency.
              A compelling entry is at £800–850M.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV024
              - CV025
          - type: callout
            title: PDC Darts Is the Hidden Gem in the Portfolio
            body: >-
              The PDC darts circuit is the most structurally resilient and fastest-growing division. It has no viable
              player alternative, a diversified broadcast model, and the Luke Littler phenomenon has introduced a
              generation of new fans. At a sum-of-the-parts level, PDC alone may represent 30–40% of the group's total
              value.
            calloutType: strength
            claimRefs:
              - CV002
              - CV015
          - type: callout
            title: DAZN Is the Thesis-Break Risk the Valuation Does Not Adequately Price
            body: >-
              At £1B+ entry, there is minimal margin of safety for a DAZN distress scenario. A DAZN default or forced
              renegotiation would reduce group EBITDA by £15–25M+ and compress the valuation by 30–40%. This risk is not
              priced into the Bruin entry valuation, creating an asymmetric downside.
            calloutType: risk
            claimRefs:
              - CV004
              - CV017
              - CV021
              - CV022
              - CV023
          - type: callout
            title: The 2031 Horizon Is the Critical Investment Decision Point
            body: >-
              For a 5-year hold, the 2031 DAZN renewal negotiation will occur before or at exit. Investors entering in
              2026 will need to either exit before 2031 (limited time) or underwrite the DAZN renewal risk. This makes
              2031 the central axis of any investment case.
            calloutType: insight
            claimRefs:
              - CV006
              - CV013
              - CV017
              - CV026
