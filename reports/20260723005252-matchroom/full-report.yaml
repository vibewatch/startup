  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Segmentation: B2B and B2C Buyers'
        blocks:
          - type: paragraph
            body: >
              Matchroom operates a dual-sided customer model. On the B2B side, the primary paying customers are
              broadcasters and streaming platforms who purchase media rights for Matchroom's sports content. This
              includes DAZN (global boxing streaming rights), Sky Sports (PDC darts UK broadcast rights), BBC (snooker
              and selective boxing), ITV (PDC darts free-to-air UK), Eurosport/Discovery+ (snooker international), and
              CCTV-5 (snooker China). A secondary B2B customer tier comprises event title sponsors and naming rights
              partners (BetVictor, Cazoo historical, and others), corporate hospitality purchasers at boxing and PDC
              events, and international co-promotion partners (who pay Matchroom for co-promotion rights on events
              hosted outside the UK).

              On the B2C side, Matchroom's customers are live event attendees (ticket buyers) and broadcast viewers
              (though the latter are technically customers of DAZN/Sky Sports, not Matchroom directly). Live event
              ticket buyers span a wide demographic: boxing fans aged 18–45 (UK and internationally), darts fans aged
              25–55 (heavily UK/Netherlands-focused for PDC events), snooker fans aged 35–65 (UK and China), pool fans,
              and table tennis enthusiasts. The core UK audience is working-class and suburban males aged 20–50, who are
              the primary demographic for Matchroom boxing and PDC darts.

              A third customer type is the professional athletes themselves: boxers, darts players, and snooker players
              who choose to work with Matchroom as their promoter or circuit operator. These relationships are more
              complex than typical vendor-customer relationships (they are co-production partnerships in boxing), but in
              darts and snooker, the PDC and WST are the only professional circuits, so players effectively have no
              choice but to participate—meaning player concentration risk is low in darts/snooker but higher in boxing
              (where fighters can choose different promoters).

              Geographic segmentation: UK and Ireland represent the largest single market for all three primary sports,
              augmented by the Netherlands (darts), China (snooker), and the United States (boxing Matchroom USA/DAZN
              US). Saudi Arabia has emerged as a premium high-margin boxing event market. Australia (Kayo Sports/Foxtel)
              and the UAE are secondary markets for select events.
