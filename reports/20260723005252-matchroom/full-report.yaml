              PDC event coverage) demonstrates active customer satisfaction.

              BBC (named customer, B2B broadcaster): The BBC has broadcast the World Snooker Championship from the
              Crucible Theatre since 1978. This 47-year continuous broadcast partnership represents the most durable
              customer relationship in Matchroom's portfolio. The BBC's continued investment in snooker (pre- and
              post-session coverage, dedicated commentators, prime-time evening slots) demonstrates ongoing
              satisfaction. BBC's relationship with WST predates Matchroom's 51% ownership; its continuation
              post-acquisition is customer proof at the highest standard.

              Professional boxers (named B2B/B2C customers): Anthony Joshua, Jaron Ennis, Dmitry Bivol, Jesse Rodriguez,
