  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Revenue Mix
        blocks:
          - type: paragraph
            body: >
              Matchroom's revenue of £225.5M for the year ending June 2025 derives from four principal streams across
              its multi-sport portfolio. Boxing media rights—primarily the long-term DAZN global partnership—represent
              the largest and most predictable stream, anchored by a reported ~$1B deal through 2031. Live event
              ticketing and hospitality across 600+ annual event days forms the second-largest revenue bucket, spanning
              boxing, darts, snooker, pool, and table tennis. The Professional Darts Corporation (PDC) contributes
              broadcast rights income (Sky Sports, ITV, DAZN), prize money underwriting recovered through sponsorship,
              and participation fees from events including the PDC World Darts Championship at Alexandra Palace. The
              World Snooker Tour (WST) contributes broadcast rights (BBC One, Eurosport/Discovery+, CCTV-5 for China),
              event hosting fees, and commercial rights.

              Secondary revenue streams include sponsorship, naming rights, and commercial partnerships associated with
              each of the four primary properties; production and content licensing for 2,400+ annual programming hours;
              and international licensing of event formats including World Championship Ping-Pong and Weber Cup.
              Matchroom's revenue recognition follows UK GAAP under FRS 102 as a private company. Revenue from
              multi-year broadcasting contracts is recognised over the contract period as performance obligations are
              satisfied at each event.

              The DAZN concentration risk is the most material factor in revenue quality. While Matchroom has
              diversified across sports and geographies, boxing media rights to DAZN represent a significant single
              counterparty exposure. DAZN has historically operated at significant losses ($4B+ cumulative through 2024
              by press estimates), and any DAZN renegotiation or restructuring could materially affect Matchroom's top
              line. However, the agreement through 2031 provides multi-year revenue visibility.

              Revenue for FY2025 of £225.5M represents growth from prior years; for reference, FY2023 Companies House
              data for Matchroom Sport reported £161.7M revenue, suggesting approximately 39% growth over two years.
              This trajectory reflects both increased boxing event volume and the PDC darts supercycle driven by Luke
              Littler's emergence in 2023-24.
