      - number: '2.3'
        title: Buyer and Customer Segmentation
        blocks:
          - type: paragraph
            body: >
              Matchroom's "customers" span three distinct buyer categories with different decision-making processes,
              budget origins, and switching costs.

              Segment A — Broadcasters and streaming platforms. This is the most financially significant segment. Buyers
              include DAZN (global), Sky Sports (UK/Ireland), ITV (UK free-to-air), BBC (UK public),
              Peacock/NBCUniversal (US, darts growth target), Eurosport (continental Europe), Kayo Sports/Foxtel
              (Australia), CCTV (China, snooker), TNT Sports (UK), and dozens of regional/national sub-licensees. Budget
              ownership resides in the rights acquisition and commissioning departments of broadcast networks, with
              approval typically at SVP/EVP level. Switching costs are high once rights are locked in multi-year deals
              (e.g., DAZN 2026–2031). Renewal decisions are driven by viewership data, brand association, and
              competitive dynamics with rival platforms.

              Segment B — Live event fans and ticketing. Matchroom events attract tens of thousands of fans per event
              across boxing venues (O2 Arena, Madison Square Garden, Wembley Stadium, Saudi Arabia arenas), PDC darts
              events (Alexandra Palace, Motorpoint Arena), and snooker venues (Crucible Theatre, UK arenas). Average
              ticket prices across events range from £30–£200 for domestic UK events to premium pricing for title
              fights. This segment's purchasing behaviour is heavily influenced by star power (Anthony Joshua, Katie
              Taylor, Luke Littler popularity), occasion marketing, and perceived event significance.

              Segment C — Corporate sponsors and partners. Sponsors such as Boxxer, DAZN-adjacent brands, and
              sector-specific brands (alcohol, gambling, automotive) buy naming rights, event sponsorship, and digital
              integration packages. Budget ownership typically sits in marketing/CMO function with approval at
              commercial director level. This segment is correlated with viewership metrics and is a secondary revenue
              contributor.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
