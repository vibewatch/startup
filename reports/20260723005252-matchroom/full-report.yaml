      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >
              Matchroom's governance structure is tightly concentrated in the Hearn family. Barry Hearn, born 1948,
              founded the company in 1982 after a career as an accountant. He served as Chairman until April 2021 when
              he stepped back to become Founder and President in an advisory capacity. Eddie Hearn, Barry's son, assumed
              the role of Group Chairman at that point and has since been the public face and operational lead of the
              business, with particular responsibility for the boxing division and broader commercial strategy. Both
              Hearns are widely regarded as among the most influential figures in UK sports commerce over the past four
              decades.

              The leadership structure beyond the Hearns is largely private and undisclosed in public filings. The PDC,
              however, is a semi-independent entity with its own governance: Eddie Hearn serves as PDC chairman and
              Matthew Porter serves as PDC chief executive. The World Snooker Tour is managed separately with Steve
              Dawson as CEO. Following the Bruin Capital transaction announced in May 2026, Bruin received a seat on the
              Matchroom board, adding George Pyne (Bruin founder and CEO, former IMG president and NASCAR CEO) as a
              board member. This adds one external director to what had previously been an entirely family-controlled
              governance structure.

              Key-person dependency is the most significant governance risk. Eddie Hearn's personal brand—including his
              social media presence, public negotiations, and promotional style—is deeply embedded in Matchroom's
              commercial identity, especially in boxing. His departure or incapacity would represent a material
              disruption. Similarly, Barry Hearn's role as Founder/President and his network relationships built over
              40+ years constitute institutional knowledge that cannot be easily replaced. Bruin's board seat provides
              some external oversight, but the business remains substantively family-run.
