            title: DAZN Dependency Creates Concentrated Counterparty Risk
            body: >-
              A single platform partner (DAZN) likely accounts for 50%+ of Matchroom's boxing media rights income. DAZN
              has had well-documented financial challenges. A DAZN distress event would force costly rights
              renegotiation or gap coverage during the 2026–2031 term.
            calloutType: risk
