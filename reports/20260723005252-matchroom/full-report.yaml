            title: Priority Diligence Items Before Investment
            body: >-
              Before investment, three diligence asks should be prioritised: (1) review DAZN's subscriber and financing
              trends to assess 2031 renewal probability; (2) obtain Eddie Hearn employment contract term and key-person
              insurance policy; (3) review Joshua's promotional contract for retirement/absence clauses and roster
              succession planning.
            calloutType: recommendation
            claimRefs:
