      - number: '6.4'
        title: Customer Retention, Durability, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Multi-year contracts are Matchroom's primary retention mechanism. All three primary broadcaster customers
              hold multi-year deals: DAZN through 2031, Sky Sports PDC multi-year, BBC snooker
              annual-renewal-with-long-standing-relationship. This means that Matchroom's broadcaster-customer revenue
              base is locked in for the medium term with limited churn risk, but with concentrated single-counterparty
              exposure.

              Customer concentration is the most material risk in Matchroom's customer profile. DAZN represents an
              estimated 35–45% of group revenue; if DAZN were to default or renegotiate at significantly lower rates, it
              would be an existential challenge to Matchroom's boxing division. No alternative single broadcaster could
              quickly replace DAZN's role: ESPN and Prime Video are both committed to other promoters; BT Sport/TNT
              Sports has Queensberry; Sky Sports has Boxxer for boxing. The DAZN 2031 deal provides multi-year
              protection but not permanent insulation.

              In the boxer-as-customer model, Anthony Joshua represents significant concentration risk. While Eddie
              Hearn has a diverse roster (Ennis, Bivol, Rodriguez, Taylor, among others), Joshua's fights generate
              disproportionate media interest, ticket demand, and DAZN subscriber engagement. Joshua's personal pause
              from competition in 2026 following the loss of close associates temporarily reduces near-term boxing event
              revenue from the premium tier.

              PDC and WST customer retention (players) is structurally different: because both are the only professional
              circuits in their sports, players have no alternative professional circuit to join. This creates a captive
              customer base that is structurally durable. The adverse scenario is player revolt or governance dispute
              (as has occurred historically with WPBSA), but there is no current evidence of an organised player
              challenge to either circuit.

              Adverse customer evidence: The most adverse customer signal available is the Joshua delay and the BBC's
              non-escalation of snooker broadcast deal values (the BBC-WST deal has reportedly not increased
              significantly in real terms over multiple renewal cycles, suggesting the BBC does not see snooker as a
              growth priority). DAZN's financial losses (~$4B+ cumulative) mean it is not a strong-balance-sheet
              customer, raising the risk of future renegotiation pressure.
