      - number: '8.3'
        title: Comparable Set and Valuation Methodology
        blocks:
          - type: paragraph
            body: >
              Identifying a precise comparable set for Matchroom is challenging because no exact equivalent public
              company exists: Matchroom is a diversified sports event promoter with governance moats, not a pure sports
              franchise or media rights library. However, several proxies are informative.

              Live Nation Entertainment (NYSE: LYV) is the closest revenue-scale comparable: a live events and
              promotions business generating $22B+ revenue at ~13–15x EV/EBITDA as of 2024–2025. Live Nation is much
              larger and has a different business model (venue ownership, Ticketmaster), but the events monetisation
              mechanism is comparable. Live Nation's multiple is compressed by lower-margin ticketing and venue
              operations that are absent in Matchroom's asset-light model, suggesting a small premium for Matchroom is
              defensible.

              Endeavor Group Holdings (formerly WME-IMG), which owns UFC, was taken private in 2024 at approximately
              $13B enterprise value. UFC itself is estimated at $10–12B, implying ~25–30x EV/EBITDA for a premium combat
              sports rights business. Matchroom boxing is not UFC — it lacks UFC's media library ownership and global
              scale — but the comparable demonstrates that the premium end of the sports rights market trades at very
              high multiples.

              Formula One Group, owned by Liberty Media, was acquired for approximately $4.4B in 2017 when F1 revenues
              were ~$1.8B, implying ~2.4x revenue at acquisition. The current F1 EV is approximately $14B on ~$3B
              revenue (4.7x). F1's multiple is driven by its media rights ownership and global race circuit agreements —
              features Matchroom does not possess. This represents the structural ceiling for comparable sports circuit
              businesses.

              MSG Sports (NYSE: MSGS) trades at ~$1.1B market cap as of 2024-25 for the NY Knicks/Rangers franchises,
              which are asset-heavy sports franchises rather than event promotion businesses. Less directly comparable
              but illustrates that sports brand/franchise value is substantial.

              CVC Capital Partners' acquisition of Dorna (MotoGP rights owner) at £3.8B in 2021 is the most directly
              comparable deal: a diversified sports rights and event promotion company, asset-light, with a structural
              governance moat on the circuit. The CVC/Dorna multiple (~6–8x revenue) set a high watermark for sports
              circuit promoters. Matchroom at 4.4x revenue appears modestly below this precedent, suggesting the Bruin
              entry price is not outlier-stretched.

              A discounted cash flow analysis using current FCF of ~£35–45M (estimated from post-tax profit with minimal
              capex adjustment) at a 10–12% discount rate yields a present value range of ~£290–450M per year of
              steady-state earnings, growing at 5–10% per annum for 5 years then 3% terminal. This yields an intrinsic
              value range of approximately £600M (bear) to £1.3B (bull), centred around £850–950M for the base case.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
