      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Boxing is one of the most heavily regulated sports globally. Each jurisdiction in which Matchroom promotes
              events has its own boxing regulatory body: the British Boxing Board of Control (BBBofC) in the UK, State
              Athletic Commissions (e.g., New York State Athletic Commission, Nevada Athletic Commission) in the US, and
              equivalent bodies internationally. Matchroom must obtain a promoter's licence in each jurisdiction, comply
              with fighter medical requirements, and adhere to local rules on fight scheduling, broadcast standards, and
              event operations. A loss of promoter licence in a key jurisdiction would prevent Matchroom from operating
              events there.

              Sanctioning body fragmentation represents a regulatory complexity: the WBA, WBC, IBF, and WBO all
              independently sanction world title fights, and their various "regular", "super", "silver", and "mandatory"
              challenger designations create competing title obligations. Matchroom must navigate these simultaneously
              for its world champion fighters, which creates scheduling complexity and legal exposure from mandatory
              challenger disputes.

              For the PDC darts circuit, regulatory risk is primarily from the WPBSA governing body dispute history.
              Historically (pre-1993 PDC formation), the relationship between professional darts players, the BDO, and
              what became the PDC was litigious. Today, the PDC has operated without major legal challenge since the
              BDO's collapse, but any governance dispute with the WPBSA (which has a 26% WST commercial stake) could
              generate regulatory friction.

              GDPR and data protection compliance applies to Matchroom's direct fan data collection (ticketing). A data
              breach or regulatory enforcement action by the ICO (UK) could impose fines under GDPR (up to 4% of global
              annual turnover). The Gambling Commission's regulations on advertising during sports broadcasts affect
              Matchroom's commercial arrangements with betting sponsors—restrictions on advertising before the watershed
              or near children's content could reduce the value of such sponsorships.

              Legal litigation risk in boxing includes contractual disputes with fighters over promotional terms, injury
              claims from fighters, or venue/event disputes. The sports entertainment sector has historically been
              litigious, though Matchroom has no material disclosed litigation as of mid-2026.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
