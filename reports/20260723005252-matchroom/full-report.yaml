            title: PDC and WST Structural Risks Are Fundamentally Different from Boxing
            body: >-
              Unlike boxing (where risks are tied to individuals, broadcaster relationships, and Saudi capital
              competition), PDC and WST risks are structural and governance-based. These are lower probability and more
              manageable through institutional structures. The governance moat protects ~30–35% of group revenue from
