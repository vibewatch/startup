      - number: '4.3'
        title: Unit Economics, GTM Motion, and Sales Efficiency
        blocks:
          - type: paragraph
            body: >
              Matchroom's primary GTM motion for boxing is fighter-led: Eddie Hearn signs a world-class or promising
              fighter, negotiates a broadcast platform deal for that fighter's events, and monetises through ticketing +
              media rights + sponsorship. The customer acquisition equivalent is fighter acquisition, not consumer
              subscriber acquisition—Matchroom does not acquire fans directly (this is delegated to broadcasters). The
              sales cycle for a new fighter deal ranges from weeks (for established champions) to months (for rising
              talents requiring multi-fight development contracts).

              For PDC darts, the GTM model is circuit-based: the PDC signs broadcast deals for the entire season's
              events (Sky Sports, ITV, DAZN) and individual events (BetVictor, Cazoo historical sponsorships). Prize
              money acts as the fighter guarantee equivalent; top players compete for prize pools that are underwritten
              by broadcast and commercial income. PDC's PDC World Darts Championship generated over £800,000 in prize
              money in 2024-25; total prize money across the Tour was £17.9M+.

              Unit economics at the event level: A typical Matchroom boxing arena show at the O2 Arena (capacity
              ~20,000) with average ticket price of ~£75 generates gross ticket revenue of ~£1.5M. Add media rights
              allocation per event (estimated £2–5M per domestic card from DAZN allocation) and sponsorship (~£500K–£1M
              per major event). A premium Joshua fight at a large outdoor venue (60,000+ attendance) with higher ticket
              prices (average ~£150) generates ticket revenue of ~£9M+ plus media allocation of up to £20M+ for a
              high-profile fight.

              Sales efficiency for broadcast deals is high—Matchroom's established relationships with DAZN, Sky Sports,
              BBC, ITV, and PDC broadcast partners require relatively low sales cost once contracts are in place. The
              primary sales cost is relationship management and deal structuring time, not a salesforce. The DAZN deal
              renews on a multi-year basis, creating revenue efficiency unmatched by event-by-event rights sellers.
