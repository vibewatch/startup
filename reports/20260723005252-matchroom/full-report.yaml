      - number: '2.2'
        title: TAM, SAM, and SOM Analysis Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              Sizing Matchroom's true addressable market requires multiple lenses given its multi-sport,
              multi-geography, multi-format position. We apply three complementary approaches.

              Lens 1 — Top-down global sports media rights. Global broadcast rights revenues across all sports are
              estimated by industry analysts at $50–80 billion annually. Combat sports (boxing, MMA) represent a premium
              niche within this—estimates place the global boxing media rights market at $1–3 billion annually when
              aggregating all organisations, broadcasters, and streaming platforms. The PDC darts TV rights market is
              smaller but growing, estimated at £100–300M annually across Sky Sports, DAZN, ITV, and international
              sub-licensing. Snooker's global rights, including the significant China broadcasting footprint, add
              another substantial layer. Matchroom's served addressable market across its active sports is therefore
              estimated at approximately $3–8 billion in annual broadcast and streaming rights spend (global, all sports
              in its portfolio).

              Lens 2 — Bottom-up from Matchroom's FY2025 revenue. Matchroom reported £225.5M in group revenue. Given
              that it currently operates ~600 event days and produces 2,400 hours of programming, and assuming modest
              market share gains across its portfolio sports in the US (driven by Bruin partnership), a 2x revenue
              trajectory over 5 years is plausible if US darts and boxing distribution scales. This implies an organic
              revenue ceiling of £400–500M at current portfolio without new sport acquisitions.

              Lens 3 — DAZN deal as a market signal. The $1B five-year DAZN deal (2026–2031) implies $200M average
              annual rights value from a single partner for boxing. Adding Sky Sports, ITV, BBC, PDC rights, WST rights,
              and international sub-licenses, total annual media rights income likely exceeds £120–150M, representing
              over half of total group revenue. This media rights engine is the most scalable component of the TAM.

              Key SOM constraint: Matchroom's ability to grow US market share in boxing and darts depends on Bruin
              Capital's platform relationships. US boxing PPV remains controlled by traditional promoters and
              HBO/Showtime legacy relationships. Darts is nascent in the US. Both represent genuine but uncertain
              expansion opportunities.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
