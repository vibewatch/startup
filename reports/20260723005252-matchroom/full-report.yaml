      - number: '8.2'
        title: Current Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              The May 2026 Bruin Capital transaction establishes a market reference point: a 15% stake was acquired,
              implying a £1 billion+ (~$1.4B) post-money group valuation. At FY2025 revenue of £225.5M, this is a
              revenue multiple of approximately 4.4x. At post-tax profit of £44M, it is approximately 22.7x post-tax
              profit. Applying a standard EBITDA estimation (assuming 25–30% EBITDA margin given asset-light model and
              reported post-tax margin), implied EBITDA is ~£55–68M, giving EV/EBITDA of ~15–18x.

              This valuation is above sector averages for pure-play live events promoters (typically 8–14x EV/EBITDA)
              but below media rights-holding companies (typically 18–25x). The premium to pure promoters reflects the
              PDC and WST governance moats, the long-term DAZN deal, and the recurring nature of the events calendar.
              The discount to media rights businesses reflects the absence of true asset ownership: Matchroom promotes
              events and owns circuits, but does not own the broadcast rights outright as a library asset.

              Entry discipline: A new investor at the same £1B+ valuation would need to believe that (a) earnings can
              grow 50–100% over a 5–7 year hold; (b) DAZN renews at comparable or superior terms in 2031; and (c) the
              PDC darts circuit continues its rapid growth trajectory (Littler and next-generation dart player base).
              All three conditions are plausible but not guaranteed. At £800–850M, the margin of safety is materially
              more comfortable: this would imply 14–15x EBITDA and 3.6x revenue, which is a full-discount entry for a
              structurally moated sports business.

              The Hearn family retains 85%+ of the business; this provides minority investor protection in the event of
              a future IPO or strategic sale, but also limits control rights and near-term liquidity. Bruin's 15% stake
              provides minimal governance leverage. Any new investor taking a minority stake would be a financial
              partner, not a strategic controller.

              Net cash position is not independently confirmed, but the business reported £44M post-tax profit with an
              asset-light model implying low capex. If the company is debt-light (as suggested by its private family
              company structure), the equity value is well-supported by current cash generation.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
