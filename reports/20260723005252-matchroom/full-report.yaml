      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Market Risks
        blocks:
          - type: paragraph
            body: >
              The most powerful growth driver for Matchroom in the 2026–2031 period is the structural shift of sports
              rights to streaming platforms. DAZN, Amazon, Apple TV+, and Peacock are all competing for premium live
              sports to drive subscriber acquisition and retention. Combat sports—especially boxing—is one of the last
              premium live sports categories not yet consolidated under a single streaming umbrella, creating ongoing
              bidding competition that benefits rights holders like Matchroom. The US market, the world's largest media
              rights market, is the primary growth prize, and the Bruin Capital partnership is explicitly oriented
              toward this opportunity.

              Darts is a second significant growth driver. The PDC World Darts Championship at Alexandra Palace
              regularly attracts over 100,000 fans across its two-week run, with live audience engagement on Sky Sports
              making it a top-rated UK sports programme in January. Luke Littler's emergence as a global youth sports
              icon has dramatically expanded darts' audience demographics and international profile. The potential
              distribution of PDC events on Peacock in the United States represents a high-optionality upside scenario.

              Adoption constraints include: (1) structural US market resistance where boxing's PPV tradition and PBC/Top
              Rank promoter relationships make rapid Matchroom penetration difficult; (2) key-person dependency
              concentrated in Eddie Hearn who is personally central to fighter signing and event promotion; (3)
              regulatory risk from boxing's fragmented sanctioning body structure (WBA, WBC, IBF, WBO) which can
              complicate unification title fights; (4) athlete concentration risk where the retirement or competitive
              decline of Anthony Joshua (primary revenue driver) would materially affect boxing revenues; (5) DAZN
              dependency, since approximately 50%+ of boxing media rights income flows through a single platform
              counterparty.
            claimRefs:
