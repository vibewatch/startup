      - number: '1.4'
        title: Milestones, Portfolio Expansion, and Strategic Footprint
        blocks:
          - type: paragraph
            body: >
              Matchroom's 44-year history can be organised into four phases. Phase 1 (1982–2000) covers the founding and
              early dominance in snooker management and boxing promotion. Barry Hearn acquired management contracts with
              Steve Davis, Dennis Taylor, and Jimmy White, then promoted landmark boxing events including Frank Bruno vs
              Joe Bugner at White Hart Lane in 1987 (35,000 attendance). The Mosconi Cup pool competition was launched
              in 1994 and the PGA EuroPro Tour (developmental golf) was formed in 2002.

              Phase 2 (2001–2015) saw the expansion into governing-body ownership. Matchroom acquired a majority stake
              in the Professional Darts Corporation in 2001, turning darts from a niche television product into a major
              audience sport with nine-figure prize pools. Barry Hearn became majority shareholder of World Snooker Tour
              Ltd in 2009, overseeing a dramatic renaissance: prize money increased, the number of ranking events grew
              from 6 to 28, and China became a key growth market. The Weber Cup (ten-pin bowling) was also launched in
              this phase.

              Phase 3 (2016–2023) brought the global boxing streaming era. In May 2018, Matchroom Boxing signed a
              five-year deal with DAZN reported at approximately £740 million, encompassing 16 US fights per year. This
              was extended in June 2021. Boxing USA was formalised as a distinct entity. The company also began
              exploring direct-to-consumer streaming and added new properties including lacrosse, gymnastics, and
              netball in various experimental formats.

              Phase 4 (2024–present) represents the institutional capital phase. The Victory Live ticketing partnership
              was announced in February 2025. The landmark DAZN contract was renewed in February 2026 for five more
              years (through 2031) at approximately $1 billion, covering 30 events per year in the US and UK. The Bruin
              Capital minority stake was finalised in May 2026, providing capital and US expertise for the next growth
              chapter.
