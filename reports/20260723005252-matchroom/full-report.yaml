      - number: '5.2'
        title: 'Operating Architecture: Event Production and Broadcast Distribution'
        blocks:
          - type: paragraph
            body: >
              Matchroom's operating model is an integrated event promotion and broadcast production machine. At its core
              is a project-based production cycle: for each event, Matchroom negotiates the venue, contracts the
              fighters or players, coordinates with broadcasters for camera/production requirements, manages on-site
              event delivery, and facilitates post-event content distribution.

              Event production capability: Matchroom employs a permanent production team (estimated 500-700 total
              employees) with dedicated operational teams for boxing, PDC, and WST. Production includes multi-camera
              broadcast setups (typically 12-20 cameras for major boxing events), on-site commentary and analyst teams,
              graphics production, and live broadcast truck infrastructure. For international events, Matchroom works
              with local co-promoters (e.g., Main Events in the US for historical events) and venue production partners.

              Broadcast distribution architecture: Once produced, Matchroom's live events are delivered via IP
              contribution feeds to broadcast partners. For DAZN events, the contribution feed goes to DAZN's
              cloud-based production infrastructure which encodes and distributes globally. For Sky Sports and BBC
              events, traditional satellite distribution is used alongside IP delivery. The DAZN platform delivers to
              web browsers, iOS/Android apps, smart TVs, and games consoles — none of which Matchroom directly manages
              (this is DAZN's technology stack). Matchroom's technology contribution is the production and content
              delivery, not the consumer-facing platform.

              PDC's digital infrastructure includes the PDC website (pdc.tv), the PDC Fantasy Darts mobile application,
              and partnerships with betting providers for live data feeds. The Fantasy Darts app engages fans between
              events and provides direct engagement data. Sky Sports provides the primary UK broadcast infrastructure
              for PDC events, with ITV's free-to-air platform distributing the World Championship to the mass UK
              audience.

              Sports analytics: Two Circles, a London-based sports audience data and analytics firm, works with multiple
              sports organisations including PDC to provide data-driven insight into fan segmentation, ticket sales
              optimisation, and digital engagement strategy. Two Circles' analytics capability allows PDC and Matchroom
              to target marketing spend at the right audience segments, improving ticket yield and broadcast subscriber
              conversion.
