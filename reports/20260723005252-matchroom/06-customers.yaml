company:
  name: "Matchroom"
chapter:
  number: 6
  title: "Customers"
  summary: "Matchroom's customers divide into two segments: B2B buyers (broadcasters, streamers, and event sponsors who pay for rights and sponsorship) and B2C consumers (live event ticket buyers and broadcast viewers). DAZN is Matchroom's single largest B2B customer by value (~£80–100M+ equivalent/year for boxing rights). Sky Sports is the primary PDC darts broadcast customer. Named customer proof includes multi-year deals with DAZN, Sky Sports, BBC, and ITV. The principal customer concentration risk is the DAZN dependency and Anthony Joshua's primacy in driving boxing event demand."

sections:
  - id: customer-segmentation
    title: "Customer Segmentation: B2B and B2C Buyers"
    body: >
      Matchroom operates a dual-sided customer model. On the B2B side, the primary paying customers are broadcasters and streaming platforms who purchase media rights for Matchroom's sports content. This includes DAZN (global boxing streaming rights), Sky Sports (PDC darts UK broadcast rights), BBC (snooker and selective boxing), ITV (PDC darts free-to-air UK), Eurosport/Discovery+ (snooker international), and CCTV-5 (snooker China). A secondary B2B customer tier comprises event title sponsors and naming rights partners (BetVictor, Cazoo historical, and others), corporate hospitality purchasers at boxing and PDC events, and international co-promotion partners (who pay Matchroom for co-promotion rights on events hosted outside the UK).

      On the B2C side, Matchroom's customers are live event attendees (ticket buyers) and broadcast viewers (though the latter are technically customers of DAZN/Sky Sports, not Matchroom directly). Live event ticket buyers span a wide demographic: boxing fans aged 18–45 (UK and internationally), darts fans aged 25–55 (heavily UK/Netherlands-focused for PDC events), snooker fans aged 35–65 (UK and China), pool fans, and table tennis enthusiasts. The core UK audience is working-class and suburban males aged 20–50, who are the primary demographic for Matchroom boxing and PDC darts.

      A third customer type is the professional athletes themselves: boxers, darts players, and snooker players who choose to work with Matchroom as their promoter or circuit operator. These relationships are more complex than typical vendor-customer relationships (they are co-production partnerships in boxing), but in darts and snooker, the PDC and WST are the only professional circuits, so players effectively have no choice but to participate—meaning player concentration risk is low in darts/snooker but higher in boxing (where fighters can choose different promoters).

      Geographic segmentation: UK and Ireland represent the largest single market for all three primary sports, augmented by the Netherlands (darts), China (snooker), and the United States (boxing Matchroom USA/DAZN US). Saudi Arabia has emerged as a premium high-margin boxing event market. Australia (Kayo Sports/Foxtel) and the UAE are secondary markets for select events.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]

  - id: adoption-trajectory
    title: "Adoption Trajectory and Usage Metrics"
    body: >
      Matchroom's B2B customer adoption is measured primarily by multi-year contract renewals. The DAZN deal through 2031 represents a five-year customer commitment at ~$1B total, indicating very strong customer retention at the most important customer tier. PDC's Sky Sports deal is multi-year and has been renewed multiple times over the past decade, indicating a durable broadcaster-circuit relationship. The BBC's snooker World Championship coverage has run continuously since 1978, one of the longest continuous sports broadcast relationships in UK television history, representing extremely durable customer adoption.

      B2C adoption is tracked through ticket sales and event attendance. PDC World Championship at Alexandra Palace (18-day event) has been sold out for multiple consecutive years. Approximately 80,000 tickets are sold over the 18-day event. The arrival of Luke Littler in 2023-24 drove a significant demand spike for PDC events: his debut run to the World Final saw record TV viewing figures on Sky Sports, with a reported 4.9 million peak viewers on Sky Sports for the 2024 PDC World Championship final. This demand spike translated into immediate secondary ticket market price increases and rapid sellout of PDC events.

      In boxing, Anthony Joshua's fights have historically achieved some of the highest UK boxing attendance figures: Wembley Stadium (90,000 for Joshua vs Klitschko, April 2017) and the O2 Arena sellouts. DAZN's subscriber growth (global DAZN subscriptions were approximately 10 million by early 2024 by press estimates) has been partly attributed to its boxing content. Joshua fights and Matchroom's fight portfolio are among DAZN's most-watched global events.

      PDC's global darts expansion, driven by the Luke Littler effect and growing European darts markets (Netherlands, Germany, Austria), has seen PDC events sell out faster in 2025-26 than in prior years. The World Matchplay, UK Open, and European Championship all report strong demand. The Premier League Darts 17-night tour covers major UK and European cities, with most venues sold out.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU002]

  - id: named-customer-proof
    title: "Named Customer Proof and Reference Quality"
    body: >
      DAZN (named customer, B2B broadcaster): The DAZN-Matchroom global boxing rights deal, renewed through 2031 at a reported ~$1B total value, is the highest-value single customer contract in Matchroom's history. DAZN has publicly confirmed the deal and presented it as central to its global boxing content strategy. This is production-grade, multi-year customer proof with a named global broadcaster as the reference.

      Sky Sports (named customer, B2B broadcaster): Sky Sports holds the primary UK broadcast rights for PDC darts in a multi-year deal. Sky Sports has publicly confirmed PDC broadcast partnerships and its investment in darts coverage. The Sky Sports relationship predates the current commercial structure and has been repeatedly renewed. Sky's darts output (with dedicated studio shows, presenter teams, and premium PDC event coverage) demonstrates active customer satisfaction.

      BBC (named customer, B2B broadcaster): The BBC has broadcast the World Snooker Championship from the Crucible Theatre since 1978. This 47-year continuous broadcast partnership represents the most durable customer relationship in Matchroom's portfolio. The BBC's continued investment in snooker (pre- and post-session coverage, dedicated commentators, prime-time evening slots) demonstrates ongoing satisfaction. BBC's relationship with WST predates Matchroom's 51% ownership; its continuation post-acquisition is customer proof at the highest standard.

      Professional boxers (named B2B/B2C customers): Anthony Joshua, Jaron Ennis, Dmitry Bivol, Jesse Rodriguez, and Katie Taylor are named fighters who have chosen to work with Matchroom Boxing. Each signing represents a commercial vote of confidence: world-class fighters have multiple promoter options but chose Matchroom. Joshua's long-term relationship with Eddie Hearn (since Joshua's professional debut in 2013) represents 12+ years of customer retention in the boxing segment.

      Event sponsors (named customers): BetVictor and Cazoo are historical PDC/Matchroom event title sponsors. BetVictor has held title sponsorship of the World Snooker Championship for multiple years. ITV's free-to-air PDC deal demonstrates broadcaster customers beyond the pay-TV tier.
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018]
    tableRefs: [TU004]
    figureRefs: [FU003]

  - id: retention-concentration-risk
    title: "Customer Retention, Durability, and Concentration Risk"
    body: >
      Multi-year contracts are Matchroom's primary retention mechanism. All three primary broadcaster customers hold multi-year deals: DAZN through 2031, Sky Sports PDC multi-year, BBC snooker annual-renewal-with-long-standing-relationship. This means that Matchroom's broadcaster-customer revenue base is locked in for the medium term with limited churn risk, but with concentrated single-counterparty exposure.

      Customer concentration is the most material risk in Matchroom's customer profile. DAZN represents an estimated 35–45% of group revenue; if DAZN were to default or renegotiate at significantly lower rates, it would be an existential challenge to Matchroom's boxing division. No alternative single broadcaster could quickly replace DAZN's role: ESPN and Prime Video are both committed to other promoters; BT Sport/TNT Sports has Queensberry; Sky Sports has Boxxer for boxing. The DAZN 2031 deal provides multi-year protection but not permanent insulation.

      In the boxer-as-customer model, Anthony Joshua represents significant concentration risk. While Eddie Hearn has a diverse roster (Ennis, Bivol, Rodriguez, Taylor, among others), Joshua's fights generate disproportionate media interest, ticket demand, and DAZN subscriber engagement. Joshua's personal pause from competition in 2026 following the loss of close associates temporarily reduces near-term boxing event revenue from the premium tier.

      PDC and WST customer retention (players) is structurally different: because both are the only professional circuits in their sports, players have no alternative professional circuit to join. This creates a captive customer base that is structurally durable. The adverse scenario is player revolt or governance dispute (as has occurred historically with WPBSA), but there is no current evidence of an organised player challenge to either circuit.

      Adverse customer evidence: The most adverse customer signal available is the Joshua delay and the BBC's non-escalation of snooker broadcast deal values (the BBC-WST deal has reportedly not increased significantly in real terms over multiple renewal cycles, suggesting the BBC does not see snooker as a growth priority). DAZN's financial losses (~$4B+ cumulative) mean it is not a strong-balance-sheet customer, raising the risk of future renegotiation pressure.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024, CU025]
    tableRefs: [TU005]
    figureRefs: [FU004]

