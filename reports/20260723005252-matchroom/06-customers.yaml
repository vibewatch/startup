callouts:
  - calloutType: strength
    title: "BBC 47-Year Snooker Partnership Is World-Class Customer Retention Evidence"
    body: "No other sports promotion company can point to a 47-year continuous broadcast relationship with a major public broadcaster as customer proof. The BBC-WST relationship, surviving multiple ownership changes and governance transitions, is the strongest retention signal in Matchroom's portfolio."
    claimRefs: [CU015, CU021]
  - calloutType: risk
    title: "DAZN Is Both the Best Customer and the Biggest Risk"
    body: "DAZN accounts for an estimated 35–45% of Matchroom group revenue and has confirmed the deal through 2031. But DAZN's $4B+ in historical losses means any future financing difficulty, renegotiation, or platform exit would be Matchroom's most damaging customer event. The 2031 expiry is the primary re-contracting cliff."
    claimRefs: [CU005, CU022, CU025]
  - calloutType: risk
    title: "Anthony Joshua's 2026 Pause Removes the Highest-Value Boxing Customer Temporarily"
    body: "Joshua's decision to pause from boxing following personal losses in 2026 removes Matchroom's highest-margin boxing product temporarily. While the pause is not expected to be permanent, it reduces near-term premium event frequency and DAZN subscriber engagement from boxing's flagship draw."
    claimRefs: [CU010, CU024]
  - calloutType: insight
    title: "PDC and WST Player Retention Is Structurally Guaranteed"
    body: "Unlike boxing (where fighters can choose promoters), PDC and WST players have no alternative professional circuit. This creates structural 100% player retention in darts and snooker — a customer durability that no comparable sports entertainment business possesses."
    claimRefs: [CU021, CU020]

