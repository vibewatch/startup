  claims:
    - id: CR001
      statement: "DAZN's reported cumulative losses exceeding $4 billion through 2024 represent the most material counterparty risk in Matchroom's revenue base."
      type: third-party-reported
      topic: financial risk
      confidence: medium
      freshness: current
      sourceRefs: [SR003, SR004, SR001]
      answersQuestionRefs: [QR001, QR010]
    - id: CR002
      statement: "Eddie Hearn is the primary commercial face and relationship holder for Matchroom Boxing; no public succession plan exists, creating acute key-person risk."
      type: inferred
      topic: key-person risk
      confidence: high
      freshness: current
      sourceRefs: [SR001, SR023, SR002, SR004]
      answersQuestionRefs: [QR002]
    - id: CR003
      statement: "Anthony Joshua's pause from active boxing competition in 2026, following personal losses, is the most immediately live risk in Matchroom's portfolio."
      type: third-party-reported
      topic: operational risk
      confidence: high
      freshness: current
      sourceRefs: [SR005, SR009, SR014]
      answersQuestionRefs: [QR003, QR019]
    - id: CR004
      statement: "DAZN represents an estimated 35–45% of Matchroom Group boxing revenue; its 2031 contract provides medium-term protection but not permanent insulation from counterparty risk."
      type: estimated
      topic: financial risk
      confidence: medium
      freshness: current
      sourceRefs: [SR001, SR023, SR003]
      answersQuestionRefs: [QR001, QR016]
    - id: CR005
      statement: "The most severe single risk sequence for Matchroom would be: Joshua retirement + Hearn departure + DAZN renegotiation occurring simultaneously."
      type: inferred
      topic: combined risk
      confidence: low
      freshness: current
      sourceRefs: [SR001, SR002]
      answersQuestionRefs: [QR030]
    - id: CR006
      statement: "Matchroom's UK boxing promoter licence is granted by the British Boxing Board of Control (BBBofC); revocation would prevent UK domestic boxing events."
      type: inferred
      topic: regulatory risk
      confidence: medium
      freshness: current
      sourceRefs: [SR006, SR007, SR009]
      answersQuestionRefs: [QR004]
    - id: CR007
      statement: "The WPBSA (World Professional Billiards and Snooker Association) holds a 26% stake in WST's commercial arm; governance disputes between Matchroom and WPBSA represent an ongoing structural risk."
      type: third-party-reported
      topic: governance risk
      confidence: high
      freshness: current
      sourceRefs: [SR010, SR021, SR023]
      answersQuestionRefs: [QR005]
    - id: CR008
      statement: "WBA and WBC mandatory challenger mechanisms can create scheduling disputes requiring Matchroom to arrange defences against sanctioning-body-selected challengers rather than commercially optimal opponents."
      type: inferred
      topic: regulatory risk
      confidence: medium
      freshness: current
      sourceRefs: [SR006, SR007]
      answersQuestionRefs: [QR006]
    - id: CR009
      statement: "A GDPR data breach affecting Matchroom's direct ticketing data could trigger ICO fines of up to 4% of global annual turnover (up to ~£9M based on £225.5M revenue)."
      type: estimated
      topic: legal risk
      confidence: low
      freshness: current
      sourceRefs: [SR015, SR025]
      answersQuestionRefs: [QR015]
    - id: CR010
      statement: "Gambling Commission restrictions on betting advertising before the watershed or near children's content affect the value of betting company sponsorships for PDC and boxing events."
      type: inferred
      topic: regulatory risk
      confidence: medium
      freshness: current
      sourceRefs: [SR011, SR023]
      answersQuestionRefs: [QR009]
    - id: CR011
      statement: "Eddie Hearn is approximately 45 years old in 2026 and in good health based on public appearances, reducing near-term key-person risk probability, but no succession plan is publicly disclosed."
      type: inferred
      topic: key-person risk
      confidence: medium
      freshness: current
      sourceRefs: [SR001, SR008]
      answersQuestionRefs: [QR002]
    - id: CR012
      statement: "Key-person insurance is standard practice for UK companies of Matchroom's size and complexity; the policy would mitigate financial disruption from Hearn incapacitation but not reputational/commercial disruption."
      type: inferred
      topic: operational risk
      confidence: medium
      freshness: current
      sourceRefs: [SR008, SR025]
      answersQuestionRefs: [QR018]
    - id: CR013
      statement: "Fighter withdrawal at short notice (injury, illness, personal circumstances) is a frequent operational risk in boxing; Joshua's 2026 pause is a live realisation at the premium tier."
      type: third-party-reported
      topic: operational risk
      confidence: high
      freshness: current
      sourceRefs: [SR005, SR009, SR014]
      answersQuestionRefs: [QR008]
    - id: CR014
      statement: "Matchroom demonstrated during COVID-19 (2020–21) that it can sustain operations on media rights alone when live attendance is prohibited."
      type: third-party-reported
      topic: operational risk
      confidence: medium
      freshness: historical
      sourceRefs: [SR022, SR023, SR025]
      answersQuestionRefs: [QR008]
    - id: CR015
      statement: "PDC darts players have no viable alternative professional circuit following the BDO's 2020 collapse, making player collective action or revolt a structurally very low probability risk."
      type: third-party-reported
      topic: operational risk
      confidence: high
      freshness: current
      sourceRefs: [SR011, SR023, SR001]
      answersQuestionRefs: [QR007, QR017]
    - id: CR016
      statement: "Running events in Saudi Arabia and Middle East markets introduces operational and reputational risks related to local governance standards, human rights commentary, and logistical complexity."
      type: inferred
      topic: operational risk
      confidence: medium
      freshness: current
      sourceRefs: [SR009, SR014]
      answersQuestionRefs: [QR026]
    - id: CR017
