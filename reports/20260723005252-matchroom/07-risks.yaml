callouts:
  - calloutType: risk
    title: "DAZN Is Matchroom's Existential Single-Counterparty Risk"
    body: "DAZN's $4B+ in cumulative losses means it is not a strong-balance-sheet customer. The 2031 boxing rights contract provides medium-term protection, but a DAZN distress scenario before 2031—or a failed renewal in 2031—represents the single most damaging risk in Matchroom's portfolio."
    claimRefs: [CR001, CR018, CR022]
  - calloutType: risk
    title: "Eddie Hearn's Key-Person Risk Has No Disclosed Mitigation"
    body: "Matchroom has no publicly disclosed succession plan for Eddie Hearn. His departure would allow competitive promoters to recruit the Matchroom boxing roster at contract renewal, eliminating the primary driver of boxing event value. Key-person insurance is standard practice but cannot offset commercial disruption."
    claimRefs: [CR011, CR012, CR023]
  - calloutType: insight
    title: "PDC and WST Structural Risks Are Fundamentally Different from Boxing"
    body: "Unlike boxing (where risks are tied to individuals, broadcaster relationships, and Saudi capital competition), PDC and WST risks are structural and governance-based. These are lower probability and more manageable through institutional structures. The governance moat protects ~30–35% of group revenue from competitive disruption."
    claimRefs: [CR007, CR015]
  - calloutType: recommendation
    title: "Priority Diligence Items Before Investment"
    body: "Before investment, three diligence asks should be prioritised: (1) review DAZN's subscriber and financing trends to assess 2031 renewal probability; (2) obtain Eddie Hearn employment contract term and key-person insurance policy; (3) review Joshua's promotional contract for retirement/absence clauses and roster succession planning."
    claimRefs: [CR022, CR023, CR024, CR025]

