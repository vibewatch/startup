callouts:
  - calloutType: strength
    title: "PDC and WST Structural Moats Are Unique Among Sports Promoters"
    body: "No boxing-only promoter competitor owns a governing body or commercial circuit arm. PDC's 221-member professional darts circuit, with Sky Sports and DAZN broadcast deals, is a recurring revenue engine that is not replicable without a multi-year player recruitment and broadcast relationship effort."
    claimRefs: [CP021, CP022]
  - calloutType: risk
    title: "PBC Controls Too Many US Fighters for Matchroom to Fully Penetrate the US Market"
    body: "Al Haymon's Premier Boxing Champions manages an estimated 100+ professional fighters and controls many US title holders. This structural fighter-control model blocks Matchroom from accessing the highest-profile US domestic fights, limiting US market penetration without co-promotional agreements."
    claimRefs: [CP011, CP027]
  - calloutType: risk
    title: "Saudi Arabia Capital Disrupts Boxing Event Economics"
    body: "Riyadh Season events backed by Saudi sovereign wealth have paid reported nine-figure site fees for heavyweight title fights. This capital influx raises the floor for premium event guarantees, squeezing margins for commercially-funded promoters including Matchroom in the heavyweight market."
    claimRefs: [CP024, CP025]
  - calloutType: insight
    title: "Boxxer Presents UK Market Challenge Despite Small Scale"
    body: "Boxxer's 2020 founding and Sky Sports exclusive deal created a second UK boxing promotion platform that directly competes with Matchroom for domestic fighters, arena bookings, and UK fan attention. While smaller in scale, Boxxer's Sky Sports backing provides distribution parity in the domestic market."
    claimRefs: [CP009, CP026]

