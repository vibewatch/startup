  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：B2B 与 B2C 买家
        blocks:
          - type: paragraph
            body: >
              Matchroom 采用双边客户模式。B2B 侧，主要付费客户是购买 Matchroom 体育内容媒体权利的转播商和流媒体平台，包括 DAZN（全球拳击流媒体权利）、Sky Sports（PDC
              飞镖英国转播权）、BBC（斯诺克和部分拳击）、ITV（PDC 飞镖英国免费电视）、Eurosport/Discovery+（斯诺克国际）、CCTV-5（斯诺克中国）。第二层 B2B
              客户包括赛事冠名赞助和命名权伙伴（BetVictor、历史上的 Cazoo 等）、拳击和 PDC 赛事的企业招待采购方，以及国际联合推广伙伴（为英国以外赛事的联合推广权向 Matchroom 付费）。

              B2C 侧，Matchroom 的客户是现场赛事观众（购票者）和转播观众（后者严格来说是 DAZN/Sky Sports 的客户，而不是 Matchroom 的直接客户）。现场赛事购票者覆盖广泛人群：18–45
              岁拳击粉丝（英国及国际）、25–55 岁飞镖粉丝（PDC 赛事高度集中在英国 / 荷兰）、35–65 岁斯诺克粉丝（英国和中国）、台球粉丝，以及乒乓球爱好者。英国核心观众是 20–50
              岁的工薪阶层和郊区男性，他们是 Matchroom 拳击和 PDC 飞镖的主要人群。

              第三类客户是职业运动员本身：选择与 Matchroom 作为推广方或巡回赛运营方合作的拳手、飞镖选手和斯诺克选手。这类关系比典型供应商—客户关系更复杂（拳击里更像联合制作伙伴关系），但在飞镖和斯诺克中，PDC 和
              WST 是唯一职业巡回赛，选手实际上只能参加——这意味着飞镖 / 斯诺克的选手集中风险低，而拳击更高（拳手可以选择不同推广方）。

              地理分层：英国和爱尔兰是三大核心项目的最大单一市场，荷兰（飞镖）、中国（斯诺克）和美国（Matchroom USA/DAZN US
              的拳击）提供增量。沙特阿拉伯已成为高溢价、高利润率的拳击赛事市场。澳大利亚（Kayo Sports/Foxtel）和阿联酋是部分赛事的次级市场。
