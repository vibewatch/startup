      - number: '7.4'
        title: 财务、模型与伙伴风险——缓释措施和终止标准
        blocks:
          - type: paragraph
            body: >
              DAZN 集中风险是最关键的财务模型风险。到 2031 年的 $1B/5 年拳击权利协议覆盖中期，但 DAZN 的财务模型需要持续订户增长和投资者资本。DAZN 的历史投资者包括 Access
              Industries（Len Blavatnik），据报道截至 2024 年累计亏损 $4B+。如果 DAZN 停止运营或被竞争对手收购，Matchroom 将面对紧急重签流程。替代转播商（Sky
              Sports、DAZN 继任者、Amazon Prime Video）可能会成为追求方，但费用水平可能更低。

              PDC 飞镖转播经济性更加多元（Sky Sports 为英国主渠道、ITV 免费电视、DAZN 国际），因此集中度较低。类似地，WST
              的多转播商模式（BBC、Eurosport、CCTV-5）提供收入多元化。拳击分部承担最高集中风险。

              Bruin Capital 交易既提供上行（分析能力、美国市场通道、Bruin 投资组合资源），也带来一个风险触发点：私募股权投资者持有期和回报要求有限。Bruin 持股 15%，治理权有限，但如果 Bruin
              在 5–7 年后寻求以溢价估值出售股权，可能引入战略优先级不同的新投资者。不过，Hearn 家族多数控制权（85%+）提供了显著结构性保护。

              汇率风险：Matchroom 的 DAZN 协议以 USD 计价，而多数成本以 GBP 和 EUR 计价。GBP/USD 汇率变动会在报告的 GBP 收入中产生折算风险。英镑走强会降低 USD 权利费折算成
              GBP 的金额。

              终止标准与投资论点破裂触发条件：Matchroom 投资论点会在以下情况下破裂：（1）DAZN 在 2031 年前违约或实质性重谈拳击权利协议；（2）Eddie Hearn
              离开，且两名或以上头部拳手跟随离开；（3）Anthony Joshua 永久退役，且没有商业规模相当的替代头牌；（4）PDC 和 WST
              面临结构性治理危机并导致选手流失。目前评估这四类事件概率为低至中等，但一旦发生，破坏性极强。
