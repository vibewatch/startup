      - number: '1.3'
        title: 所有权、资本结构与 Bruin Capital 交易
        blocks:
          - type: paragraph
            body: >
              Matchroom Sport 是一家在英格兰和威尔士注册的私营公司。2026 年 5 月交易之前，Hearn
              家族持有公司全部权益。历史公开记录和媒体报道都确认，公司完全由家族控制。其结构沿用传统家族企业模式，没有外部风投，也没有上市股权。

              2026 年 5 月，Bruin Capital 收购 Matchroom Holdings Ltd. 15% 少数股权；后者是 Matchroom Sport 的母公司。Bruin Capital 是
              George Pyne 于 2015 年创立的美国体育、媒体和娱乐投资平台。交易于 2026 年 5 月 11 日宣布，对公司估值超过 £1 billion（约 $1.36–1.4 billion），把
              Matchroom 推入英国体育和媒体独角兽公司行列。作为交易的一部分，Bruin 获得董事会席位。除持股比例和指示性估值外，其他财务条款未公开披露。

              更早的 PE 兴趣已有记录，但没有落地交易：2022 年，Barry Hearn 确认曾与 KKR、CVC Capital Partners 和 Searchlight Capital Partners
              接触，最终未推进。2024 年，英国体育版权和赛事代理机构 Pitch International 完成一笔规模较小的少数股权投资，重点放在媒体版权和赛事。由此看，Bruin 交易是 Matchroom 44
              年历史上最重要的外部资本交易，也是首笔让具名美国机构投资者加入董事会的交易。双方给出的战略逻辑集中在加快美国市场渗透、扩展数字化和 DTC 分发，并借助 Bruin 的分析能力和平台经验。

              Bruin Capital 的投资组合包括 Box to Box Films、TGI Sport、AS1、Full Swing 和 FairPlay Sports Media。其近期完成募集的 $1
              billion 基金吸引了 26North（Josh Harris 的公司）和 TJC Partners 等投资方。Bruin 过往退出案例包括 On Location（出售给 Endeavor）和 Two
              Circles（分析公司，另行出售）。
