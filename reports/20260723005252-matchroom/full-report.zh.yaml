      - number: '8.4'
        title: 牛市、基准、熊市情景与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              三种情景覆盖 Matchroom 在 5 年投资期内的结果分布。

              牛市情景假设：Joshua 在 12 个月内重返活跃拳击，并再保持 5 年统治力；DAZN 财务状况稳定，2031 年续约以相近或更高费用完成；PDC 飞镖继续爆发式收视增长，并推动 Sky Sports
              权利升级；WST/斯诺克获取增量中国转播价值；Bruin Capital 的体育分析能力创造新的数据驱动收入流。在该情景下，集团收入到 FY2030 达到 £350–400M，EBITDA 增长至
              £90–110M，按 18–20x EBITDA，Matchroom 估值可能达到 £1.6–2.2B，支持在 £1B+ 入场价上的 1.8–2.5x 投资回报。

              基准情景假设：Joshua 在 18 个月内回归，并在退役前举办 2–3 场高端赛事；DAZN 2031 年续约的实际条款略低；PDC 飞镖温和增长并完成 Sky 权利续约；WST 维持 BBC 关系；集团收入到
              FY2030 达到 £270–300M，EBITDA 约 ~£65–80M，按 15x EBITDA，Matchroom 价值为 £975M–£1.2B。按 £1B+ 投资 5 年，回报仅为
              0.9–1.2x（接近保本；如果折价进入，则有小幅正 IRR）。这是“持有”情景——可管理，但对 PE 投资者吸引力不足。

              熊市情景假设：Joshua 没有实质性回归；DAZN 压力迫使拳击权利在 2029–30 年以显著更低费用重谈；PDC/WST 稳定增长但无法抵消拳击下滑；集团收入停滞在 £200–230M，EBITDA 压缩至
              £40–55M，按 12x EBITDA，Matchroom 价值为 £480–660M。以 £1B+ 投资将在该情景下损失 35–50% 资本。

              建议为中性。业务质量和运营执行力出色。护城河真实且耐久（尤其是 PDC）。当前盈利强劲。但 £1B+ 入场估值没有为 DAZN 集中风险和关键人依赖提供足够安全边际。有吸引力的入场点应在 £800–850M
              或以下。投资前优先尽调事项是：（1）DAZN 订户和财务健康审计；（2）Eddie Hearn 合同与继任；（3）Joshua 合同条款；（4）PDC 转播权续约时间表；（5）FY2025 经审计集团层面
              EBITDA 和 capex。
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: table
            tableRef: TV006
            claimRefs:
              - CV025
              - CV026
              - CV027
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 中性——业务有吸引力，估值已满
            body: >-
              Matchroom 是英国最令人印象深刻的私营体育公司之一：巡回赛有结构性护城河、利润率出色，并已证明自身是 £1B+ 商业特许经营权。然而，£1B+ 入场价格没有为非常现实的 DAZN
              集中风险和关键人依赖提供足够安全边际。有吸引力的入场点是 £800–850M。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV024
              - CV025
          - type: callout
            title: PDC 飞镖是组合里的隐藏宝石
            body: PDC 飞镖巡回赛是结构最有韧性、增长最快的分部。选手没有可行替代，转播模型多元，Luke Littler 现象带来了一代新粉丝。按分部估值，PDC 单独可能代表集团总价值的 30–40%。
            calloutType: strength
            claimRefs:
              - CV002
              - CV015
          - type: callout
            title: DAZN 是估值未充分计入的论点破裂风险
            body: >-
              以 £1B+ 估值入场，若 DAZN 出现困境，安全边际很薄。DAZN 违约或被迫重谈，会让集团 EBITDA 减少 £15–25M+，并压缩 30–40% 的估值。这一风险没有反映在 Bruin
              的入场估值里，下行不对称。
            calloutType: risk
            claimRefs:
              - CV004
              - CV017
              - CV021
              - CV022
              - CV023
          - type: callout
            title: 2031 年窗口是关键投资决策点
            body: >-
              若持有 5 年，2031 年 DAZN 续约谈判会发生在退出前或退出时点。2026 年入场的投资者要么在 2031 年前退出（时间有限），要么把 DAZN 续约风险纳入承保假设。因此，2031
              年是任何投资判断的中轴。
            calloutType: insight
            claimRefs:
              - CV006
              - CV013
              - CV017
              - CV026
