      - number: '4.4'
        title: 资本充足性、融资与财务判断
        blocks:
          - type: paragraph
            body: >
              Matchroom 是一家盈利、能产生现金的私营企业，集团层面没有披露银行债务负担。2026 年 5 月 Bruin Capital 交易以 £1B+ 对公司估值，是 Hearn 家族出售 15%
              少数股权，并非公司一级资本募集。除非交易设计中包含一级资本部分——这一点未获公开确认——Bruin 交易所得流向 Hearn 家族（既有股东），而不是公司资产负债表。

              Matchroom 的 FY2025 业绩（收入 £225.5M、税后利润 £44M）显示其现金生成能力很强。在正常化资本开支要求和营运资本周期下，公司很可能每年产生 £30–50M+
              自由现金流（扣除税、利息和资本开支后），足以在不依赖外部融资的情况下自筹有机扩张。任何美国扩张举措（新的美国拳击赛事、PDC 美国存在感、数字平台）都可在 2–3 年周期内由经营现金流支持，无需举债。

              资本结构风险来自拳手保底以及 PDC、WST
              约定奖金义务这类隐性债务。它们是经营承诺，不是金融债务，但代表已约定现金流出；如果赛事收入下滑（例如转播方违约、重大场馆取消或疫情式事件），会制造压力。COVID-19 期间，Matchroom
              在无观众情况下办赛，完全依靠媒体版权收入，商业模式因此经历过压力测试。

              财务判断：Matchroom 的财务表现显示，这是一家管理良好、盈利且达到上市公司常见规模的体育媒体和赛事企业。£1B+ 企业价值约对应 4.4x 收入和约 23x
              税后利润；相对全球体育媒体基准并不激进（拥有版权的实体常见 15–30x EBITDA 倍数）。核心尽调阻碍包括：（1）无法取得完整经审计账目或 EBITDA 拆分；（2）DAZN 交易对手风险；（3）Bruin
              Capital 资金用途未确认；（4）未披露杠杆率或净债务状况。
