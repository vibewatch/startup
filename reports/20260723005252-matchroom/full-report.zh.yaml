      - number: '2.3'
        title: 买方与客户分层
        blocks:
          - type: paragraph
            body: >
              Matchroom 的“客户”覆盖三类不同买方，各自有不同的决策流程、预算来源和切换成本。

              A 类——转播方和流媒体平台。这是财务上最重要的客群。买方包括 DAZN（全球）、Sky Sports（英国 /
              爱尔兰）、ITV（英国免费电视）、BBC（英国公共媒体）、Peacock/NBCUniversal（美国，飞镖增长目标）、Eurosport（欧洲大陆）、Kayo
              Sports/Foxtel（澳大利亚）、CCTV（中国，斯诺克）、TNT Sports（英国）以及数十家地区 / 全国级转授权方。预算归属通常在广播网络的版权采购和委制部门，审批层级通常是
              SVP/EVP。版权一旦锁进多年协议，切换成本很高（例如 DAZN 2026–2031）。续约决策由收视数据、品牌联想和与竞品平台的竞争动态共同驱动。

              B 类——现场赛事粉丝和票务。Matchroom 赛事每场可吸引数万名观众，覆盖拳击场馆（O2 Arena、Madison Square Garden、Wembley Stadium、沙特阿拉伯场馆）、PDC
              飞镖赛事（Alexandra Palace、Motorpoint Arena）和斯诺克场馆（Crucible Theatre、英国各场馆）。赛事平均票价从英国本土赛事的
              £30–£200，到冠军战的高端定价不等。这个客群的购买行为高度受明星号召力（Anthony Joshua、Katie Taylor、Luke Littler 的人气）、场景化营销和对赛事重要性的感知影响。

              C 类——企业赞助商和合作伙伴。Boxxer、DAZN 相关品牌以及酒类、博彩、汽车等垂直行业品牌购买冠名权、赛事赞助和数字整合套餐。预算通常归营销 / CMO
              职能管理，由商业总监级别审批。这个客群与收视指标相关，是次要收入贡献方。
