  - id: FR001
    title: 风险热力图：Matchroom 风险项的发生可能性与影响
    type: quadrant
    layout: wide
    summary: 风险项按发生可能性（x 轴：1=很低至 5=很高）和影响（y 轴：1=低至 5=很高）定位。右上象限 = 最高优先级风险。
    data:
      points:
        - label: DAZN 财务困境
          x: 3
          'y': 5
          note: 影响高；因合同覆盖至 2031 年，概率中等
        - label: Eddie Hearn 关键人
          x: 2
          'y': 5
          note: 影响极高；概率较低（45 岁且健康）
        - label: Joshua 长期缺席
          x: 3.5
          'y': 4
          note: 2026 年后暂停使概率更高；对收入影响显著
        - label: DAZN 2031 年续约失败
          x: 2.5
          'y': 5
          note: 2031 年前概率低；若失败，影响灾难性
        - label: 沙特拳击挖角
          x: 3
          'y': 3.5
          note: 活跃风险；Riyadh Season 仍在推进
        - label: WPBSA 治理争议
          x: 2.5
          'y': 2.5
          note: 概率中低；影响可控
        - label: 拳手兴奋剂丑闻
          x: 2
          'y': 3.5
          note: 声誉影响；UKAD 检测已到位
        - label: COVID 式赛事禁令
          x: 1
          'y': 5
