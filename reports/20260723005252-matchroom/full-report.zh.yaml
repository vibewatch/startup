  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Matchroom 的竞争格局因业务线而显著不同。在拳击业务，Matchroom 直接面对一批分散的全球推广方，其中多数并不具备 Matchroom 的一体化版权模式。在飞镖业务，Matchroom 通过 PDC
              多数股权实际上拥有全球唯一重要职业巡回赛，没有任何竞争机构构成有意义威胁。在斯诺克业务，World Snooker Tour 是唯一职业巡回赛，Matchroom 持有商业实体 51% 股权，面对的是
              WPBSA（持 26%）带来的治理摩擦，而不是市场竞争。

              最激烈的市场是拳击推广，尤其在美国。四家机构主导全球拳击市场份额：Matchroom（英国起源，DAZN 全球协议）、Top Rank（美国，ESPN/ESPN+ 协议）、Premier Boxing
              Champions（美国，Showtime/Prime Video/Amazon 协议）以及 Queensberry Promotions/MTK Global/Frank Warren（英国，TNT
              Sports/Channel 5 协议）。较新的英国进入者 Boxxer（2020 年成立，Ben Shalom）拥有 Sky Sports 协议，在英国市场与 Matchroom 直接争夺本土拳手和场馆赛事。

              更广义的体育媒体和内容集团包括 Endeavor Group Holdings（UFC 母公司，与 TKO Group 合并后）、IMG 和 CAA Sports。这些机构规模与 Matchroom
              不同，但会争夺转播方预算、运动员管理关系和体育内容版权。尤其是 UFC，与拳击争夺同一批流媒体观众，并在 2020 年代持续让媒体版权价值增长快于拳击，形成间接竞争压力。

              关键替代品和维持现状选项包括：（1）无组织的草根体育参与；（2）面向年轻观众的电竞赛事；（3）争夺同一可自由支配娱乐预算的美国大型职业联盟体育（NFL、NBA）；以及（4）与 DAZN
              订阅用户时长竞争的真人秀和剧集流媒体内容。它们不是直接竞争对手，但代表了 Matchroom 变现的体育娱乐支出的机会成本。
