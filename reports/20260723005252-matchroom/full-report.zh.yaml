      - number: '8.2'
        title: 当前估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              2026 年 5 月 Bruin Capital 交易建立了一个市场参照点：其收购 15% 股权，对应 £1 billion+（约 ~$1.4B）的投后集团估值。按 FY2025 £225.5M
              收入计算，收入倍数约 4.4x。按 £44M 税后利润计算，约为税后利润的 22.7x。采用标准 EBITDA 估算（考虑资产轻模式和披露的税后利润率，假设 25–30% EBITDA 利润率），隐含
              EBITDA 约 ~£55–68M，对应 EV/EBITDA 约 ~15–18x。

              该估值高于纯现场赛事推广方的行业均值（通常 8–14x EV/EBITDA），但低于媒体权利持有公司（通常 18–25x）。相对纯推广方的溢价，反映 PDC 和 WST 的治理护城河、长期 DAZN
              协议以及赛事日历的经常性。相对媒体权利业务的折价，反映缺乏真正资产所有权：Matchroom 推广赛事并持有巡回赛，但并不把转播权作为片库资产直接拥有。

              入场纪律：新投资者若按同样 £1B+ 估值进入，需要相信：（a）盈利可在 5–7 年持有期内增长 50–100%；（b）DAZN 在 2031 年以相近或更优条款续约；（c）PDC
              飞镖巡回赛继续高速增长（Littler 和下一代飞镖选手基础）。三项条件都有可能，但都不保证。若估值为 £800–850M，安全边际会明显更舒服：这意味着 14–15x EBITDA 和 3.6x
              收入，是结构性护城河体育业务的充分折价入场。

              Hearn 家族保留 85%+ 股权；如果未来 IPO 或战略出售，这为少数投资者提供保护，但也限制控制权和近期流动性。Bruin 15%
              股权带来的治理杠杆很小。任何新投资者若拿少数股权，都将是财务伙伴，而非战略控制方。

              净现金状况未获独立确认，但公司报告 £44M 税后利润，资产轻模式意味着低 capex。如果公司债务较轻（其私人家族公司结构也暗示如此），当前现金生成能力对股权价值形成有力支撑。
