      - number: '6.4'
        title: 客户留存、耐久性与集中风险
        blocks:
          - type: paragraph
            body: >
              多年合同是 Matchroom 的主要留存机制。三大主要转播商客户都持有多年协议：DAZN 至 2031 年、Sky Sports PDC 多年期、BBC 斯诺克年度续约但关系长期稳定。这意味着
              Matchroom 的转播商客户收入基础在中期被锁定，流失风险有限，但单一交易对手敞口集中。

              客户集中是 Matchroom 客户画像中最重大的风险。DAZN 估计贡献集团收入的 35–45%；如果 DAZN 违约或以显著更低价格重谈，将对 Matchroom
              拳击分部构成生死级挑战。没有任何单一替代转播商能快速替代 DAZN 的角色：ESPN 和 Prime Video 都已绑定其他推广方；BT Sport/TNT Sports 有 Queensberry；Sky
              Sports 的拳击合作方是 Boxxer。DAZN 2031 年协议提供多年保护，但不是永久隔离。

              在“拳手即客户”模式中，Anthony Joshua 代表显著集中风险。Eddie Hearn 虽然有多元阵容（Ennis、Bivol、Rodriguez、Taylor 等），但 Joshua
              的比赛带来不成比例的媒体兴趣、票务需求和 DAZN 订户互动。Joshua 在 2026 年因亲近人士离世暂停比赛，暂时降低了近期高端层拳击赛事收入。

              PDC 和 WST 的客户留存（选手）结构不同：二者都是各自项目唯一职业巡回赛，选手没有其他职业巡回赛可加入。由此形成一个被锁定的客户基础，结构上很耐久。不利情景是选手反叛或治理争议（WPBSA
              历史上曾发生），但目前没有证据显示有组织的选手挑战任一巡回赛。

              不利客户证据：现有最不利客户信号是 Joshua 延迟回归，以及 BBC 没有上调斯诺克转播协议价值（据报道，BBC-WST 协议在多个续约周期内实际价值没有显著增长，说明 BBC
              不把斯诺克视为增长优先项）。DAZN 累计财务亏损约 ~$4B+，意味着它不是资产负债表强劲的客户，未来重谈压力风险上升。
