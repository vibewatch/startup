  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与相邻领域
        blocks:
          - type: paragraph
            body: >
              Matchroom 的商业版图横跨三类相互咬合的市场。一级市场是体育赛事推广和制作，涵盖现场体育比赛的举办、转播和商业开发。二级市场是体育媒体版权授权，Matchroom 向 DAZN、Sky
              Sports、ITV、BBC、Peacock 和 Eurosport 等分发方出售转播及流媒体权利。三级市场包括体育 IP 所有权和赛事组织，尤其通过 PDC（飞镖）和
              WST（斯诺克）实现，它们能在不依赖单一赛事的情况下产生经常性年度收入。

              全球体育媒体版权市场是最重要的收入池。行业来源显示，2020 年代以来，全球体育转播权收入持续增长，核心驱动力是流媒体平台争夺优质现场内容。仅 DAZN
              就已在格斗运动、足球和其他资产上承诺投入数十亿美元版权费用。英国 Sky Sports 每年仍在飞镖、拳击和板球等版权上投入数亿英镑。更广义的全球体育赛事市场还包括门票、赞助和现场接待，是一个数千亿美元级行业。

              Matchroom 的核心市场不包括：球队所有权（不直接拥有足球俱乐部、特许经营球队或联盟）、博彩和梦幻体育（相邻但未经营）、美国主流大型联盟体育（NFL、NBA、MLB、NHL——只通过 DAZN
              间接竞争）以及单个运动员经纪 / 管理（仅通过 Matchroom Talent 部门有限涉入）。关键相邻领域包括电竞（目前未活跃）、数据分析授权（早期，Bruin Capital
              经验相关）和面向消费者的订阅视频（通过 DAZN 合作处于萌芽阶段）。
