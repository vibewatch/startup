            body: >
              DAZN（具名客户，B2B 转播商）：DAZN-Matchroom 全球拳击权利协议续约至 2031 年，据报道总价值约 ~$1B，是 Matchroom 历史上价值最高的单一客户合同。DAZN
              已公开确认该协议，并将其作为全球拳击内容战略的核心。这是生产级、长期客户证明，且参考方是具名全球转播商。

              Sky Sports（具名客户，B2B 转播商）：Sky Sports 通过多年协议持有 PDC 飞镖在英国的主要转播权。Sky Sports 已公开确认 PDC 转播合作，并投入飞镖报道。Sky Sports
              关系早于当前商业结构，并已反复续约。Sky 的飞镖输出（专门演播室节目、主持团队和高端 PDC 赛事报道）显示客户满意度活跃。

              BBC（具名客户，B2B 转播商）：BBC 自 1978 年以来一直从 Crucible Theatre 转播 World Snooker Championship。这段 47 年不间断转播伙伴关系，是
              Matchroom 组合里最持久的客户关系。BBC 持续投入斯诺克（赛前和赛后报道、专门评论员、黄金时段晚间档）显示满意度仍在。BBC 与 WST 的关系早于 Matchroom 持有 51%
              股权；收购后延续，是最高标准的客户证明。

              职业拳手（具名 B2B/B2C 客户）：Anthony Joshua、Jaron Ennis、Dmitry Bivol、Jesse Rodriguez 和 Katie Taylor 是选择与 Matchroom
              Boxing 合作的具名拳手。每一次签约都是商业信任票：世界级拳手有多个推广方选项，但选择了 Matchroom。Joshua 与 Eddie Hearn 的长期关系（自 Joshua 2013
              年职业首秀起）代表拳击分部 12 年以上的客户留存。

              赛事赞助商（具名客户）：BetVictor 和 Cazoo 是历史上的 PDC/Matchroom 赛事冠名赞助商。BetVictor 已连续多年冠名赞助 World Snooker
