chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、商业模式与规模
        blocks:
          - type: paragraph
            body: >
              Matchroom Sport Limited 是一家私有英国跨国体育推广、版权管理和媒体制作公司，总部位于英格兰 Essex 郡 Brentwood 的 Mascalls。Barry Hearn 于 1982
              年创立公司，起步时是一家斯诺克经纪机构，之后逐步扩展到拳击、飞镖、台球、斯诺克巡回赛管理、高尔夫、乒乓球和多项其他运动。截至 2026 年，Matchroom
              被广泛视为英国最大的独立体育推广公司，也是美国主要联盟体系之外全球最重要的体育版权机构之一。

              商业模式由三根支柱咬合支撑：（1）每年 600+ 个赛事日的现场赛事推广和门票收入；（2）全球媒体版权销售和长期转播合作，每年产出 2,400 小时原创节目；（3）持有多个运动管理或商业主体的股权，尤其是
              Professional Darts Corporation（PDC，2001 年以来持有多数股权）和 World Snooker Tour（WST，2010 年以来持有 51% 股权）。这种一体化模式让
              Matchroom 同时控制上游 IP 和下游分发，相比纯赛事推广方具备结构性优势。

              截至 2025 年 6 月 30 日财年的关键财务数据为：营业额约 £225.5 million（约 $306.7M），税后利润 £44 million（约 $59.8M）。拳击是最大单一业务：截至 2023
              年，仅拳击每年收入就约 $235 million，主要由与 DAZN 的长期全球合作拉动。公司在英国、美国、沙特阿拉伯、澳大利亚和多个欧洲市场举办赛事，并与 DAZN、Sky
              Sports、ITV、BBC、Peacock（NBCUniversal）、Eurosport、Foxtel/Kayo Sports 以及大量地区频道签有转播协议。
