      - number: '8.3'
        title: 可比公司集与估值方法
        blocks:
          - type: paragraph
            body: >
              为 Matchroom 找到精确可比公司并不容易，因为没有完全等同的上市公司：Matchroom
              是一家拥有治理护城河的多元体育赛事推广方，不是纯体育特许经营权公司，也不是媒体权利片库。不过，几个代理标的有参考价值。

              Live Nation Entertainment（NYSE: LYV）是收入规模最接近的可比公司：它是现场赛事和推广业务，2024–2025 年收入超过 $22B+，EV/EBITDA 约
              ~13–15x。Live Nation 规模更大，商业模式也不同（拥有场馆、Ticketmaster），但赛事变现机制可比。Live Nation 的倍数被低利润率票务和场馆运营压低，而 Matchroom
              的资产轻模式没有这些负担，因此给 Matchroom 小幅溢价有合理性。

              拥有 UFC 的 Endeavor Group Holdings（前 WME-IMG）在 2024 年以约 $13B 企业价值私有化。UFC 本身估值估计为 $10–12B，意味着高端格斗体育权利业务
              EV/EBITDA 约 ~25–30x。Matchroom boxing 不是 UFC——它缺乏 UFC 的媒体片库所有权和全球规模——但这个可比案例说明，体育权利市场的高端资产交易倍数很高。

              Liberty Media 持有的 Formula One Group 在 2017 年以约 $4.4B 被收购，当时 F1 收入约 ~$1.8B，对应收购时收入倍数约 ~2.4x。当前 F1 企业价值约
              $14B，对应约 ~$3B 收入（4.7x）。F1 的倍数由媒体权利所有权和全球赛车场协议驱动——这些特征 Matchroom 不具备。这代表可比体育巡回赛业务的结构性上限。

              MSG Sports（NYSE: MSGS）截至 2024-25 年市值约 ~$1.1B，持有 NY Knicks/Rangers
              特许经营权，这些是资产重的体育特许经营权，而不是赛事推广业务。可比性较弱，但说明体育品牌 / 特许经营权价值可观。

              CVC Capital Partners 在 2021 年以 £3.8B 收购 Dorna（MotoGP
              权利所有者），这是最直接可比的交易：一家多元体育权利和赛事推广公司、资产轻，并拥有赛道上的结构性治理护城河。CVC/Dorna 倍数（收入 ~6–8x）为体育巡回赛推广方设定了高水位。Matchroom 4.4x
              收入略低于该先例，说明 Bruin 入场价格没有异常拉伸。

              使用当前 FCF 约 ~£35–45M（从税后利润出发，按极低 capex 调整估算）做折现现金流分析，折现率 10–12%，得到稳态盈利每年现值区间约 ~£290–450M，之后 5 年按每年 5–10%
              增长，终值增长率 3%。由此得到内在价值区间约 £600M（熊市）至 £1.3B（牛市），基准情形集中在 £850–950M。
