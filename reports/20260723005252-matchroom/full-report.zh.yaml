      - number: '5.4'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >
              Matchroom 运营在高度监管的行业：职业拳击（按辖区由国家级拳击委员会发牌）、职业飞镖（PDC 规则）和职业斯诺克（WPBSA/WST 治理）。每个项目都有自己的信任与安全框架。

              拳击中，拳手安全由各辖区监管委员会管理：英国为 British Boxing Board of Control（BBBofC），美国为各州 Athletic Commissions，国际赛事则包括 Dubai
              Sports Council、Saudi General Authority for Sport 等机构。每场赛事都需要执业医生和医疗人员在拳台边值守、赛前体检和赛后复查。Matchroom
              作为推广方，必须遵守其办赛辖区的发牌要求。

              兴奋剂合规由 UK Anti-Doping（UKAD）负责英国 PDC 赛事，国际赛事由符合 WADA 标准的国家机构负责。PDC 有兴奋剂检测协议，所有排名选手都需接受检测。

              PDC 的选手行为准则管理台上行为、媒体义务和参赛要求。Matchroom/PDC 必须遵守转播标准（英国为 Ofcom），才能在 Sky Sports 和 ITV 播出。

              DAZN 平台承载 Matchroom 内容，DAZN 负责各地区的年龄验证、博彩广告限制和数据保护法规合规。英国和欧盟粉丝数据中，订户部分的 GDPR 合规由 DAZN 负责；Matchroom
              处理自有直接票务平台的数据。

              制作质量控制靠制作手册、彩排和冗余系统维持（备用转播信号、场馆发电机电力）。Matchroom 制作团队有数十年经验，质量标准符合大型体育转播要求（HD/4K 视频、冗余通信系统、国际赛事多语言解说选项）。
