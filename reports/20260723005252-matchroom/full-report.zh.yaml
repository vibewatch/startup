  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与资产地图
        blocks:
          - type: paragraph
            body: >
              Matchroom
              的产品组合覆盖十个体育项目，分为三层：核心项目（拳击、飞镖、斯诺克——三大主要收入引擎）、成熟的次级项目（台球、乒乓球）以及培育项目（长曲棍球、多项目赛事）。每个项目里，核心产品单元都是现场赛事：一场比赛或锦标赛，同时通过现场观赛和转播交付给粉丝。

              拳击是旗舰产品。Matchroom Boxing 在全球推广世界冠军赛，Eddie Hearn 管理 Anthony Joshua、Jaron Ennis、Dmitry Bivol、Jesse
              Rodriguez、Katie Taylor 等拳手的推广权。每场拳击赛事都是一个独立产品单元：明确的对阵卡，包含头条主赛、垫场赛，以及场馆 / 制作套装。赛事形态从本土室内馆秀（O2
              Arena、Manchester AO Arena）到国际体育场赛事（New York、Riyadh、Dubai）不等。转播产品是直播流 / 电视信号，全球交付给 DAZN，并在区域市场交付给地面电视 /
              卫星合作伙伴。

              PDC 飞镖产品是一条贯穿赛季的巡回赛：221 名职业选手参加多项赛事（World Championship、Premier League、World Matchplay、European
              Championship、Grand Slam of Darts），最后在每年 12 月至次年 1 月，于 Alexandra Palace 举行 PDC World
              Championship。电视产品是多转播商组合包：Sky Sports 承接多数英国转播赛事；ITV 和 ITV4 转播 World Championship 等免费电视赛事；DAZN
              持有国际流媒体权利。PDC 产品的特点是现场赛事需求爆满，并且对年轻观众的吸引力正在增强，2023-24 年 Luke Littler 现象进一步放大了这一点。

              WST 斯诺克产品是覆盖 28 站赛季的职业巡回赛，核心是 Sheffield 的 Crucible Theatre 举行的 World Snooker Championship。转播权由
              BBC（英国免费电视）、Eurosport/Discovery+（欧洲及国际付费电视）和 CCTV-5（中国）持有。斯诺克观众年龄结构比拳击和飞镖更老，但中国观众规模很大，CCTV-5 权利代表一条主要收入流。

              小众项目包括 Matchroom Pool（举办 Mosconi Cup 等美国队对欧洲队赛事）、World Championship of Ping-Pong（乒乓球）以及 Weber Cup（美国 vs.
              欧洲的飞镖赛制）。这些项目收入贡献更小，但扩大了 Matchroom 的内容制作规模。
