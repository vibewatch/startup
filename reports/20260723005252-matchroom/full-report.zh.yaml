      - 缺失证据
      - 重要性
      - 责任方或尽调路径
    rows:
      - - DAZN 财务健康度
        - DAZN 用户数（2026 年 Q2）、最新投资人融资轮细节、DAZN 财务预测
        - 投资逻辑的最大单点风险；$4B 亏损且未披露盈利路径
        - Access Industries / DAZN 投资者关系；媒体监测
      - - Eddie Hearn 雇佣合同
        - 合同期限、留任激励、竞业限制、关键人物保险保单细节
        - 关键人物风险没有公开缓释措施；合同期限决定锁定周期
        - Matchroom 法律顾问；Hearn 本人
      - - Joshua 推广合同
        - 剩余合同期限、比赛 / 暂停 / 退役条款、最低参赛义务
        - 最直接的现实风险；Joshua 2026 年暂停已经落地
        - Matchroom 与 Joshua 经纪人 Hussain Joseph 的推广协议
      - - 集团层面经审计 EBITDA
        - FY2025 Companies House 完整申报（完整 P&L 尚未公开）；FY2024 对照
        - 所有估值倍数都押在真实 EBITDA 上；税后利润是唯一已确认指标
        - Companies House；英国 Companies Act 账目申报截止日
      - - PDC 转播权续约时间表
        - Sky Sports PDC 合同到期日；续约谈判时间线
        - PDC 是结构上最抗压的收入流；合同到期是中期关键触发点
        - PDC 官方；Sky Sports 媒体权利团队
      - - DAZN 拳击交易条款（交易经济性）
        - 确切交易结构：保底金额与收入分成；单场与年度总包
        - 决定拳击收入中有多少不受赛事频率影响、确定有保障
        - Matchroom / DAZN 商业条款；媒体报道作为代理证据
    notes: 所有尽调问题均为编辑判断，并反映仅基于公开来源研究识别出的缺口。
