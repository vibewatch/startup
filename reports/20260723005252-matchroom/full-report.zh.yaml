      - number: '6.2'
        title: 采用轨迹与使用指标
        blocks:
          - type: paragraph
            body: >
              Matchroom 的 B2B 客户采用主要由多年合同续约衡量。DAZN 到 2031 年的协议总价值约 ~$1B，代表五年客户承诺，说明最重要客户层的留存极强。PDC 的 Sky Sports
              协议为多年期，过去十年已多次续约，说明转播商—巡回赛关系稳固。BBC 对斯诺克 World Championship 的转播自 1978
              年以来从未中断，是英国电视史上持续时间最长的体育转播关系之一，代表极其持久的客户采用。

              B2C 采用通过票务销售和赛事上座衡量。Alexandra Palace 的 PDC World Championship（18 天赛事）已连续多年售罄。18 天赛事约售出 80,000 张门票。Luke
              Littler 在 2023-24 年的出现推动 PDC 赛事需求显著上行：他首次打进 World Final，带动 Sky Sports 创下电视收视纪录，据报道 2024 PDC World
              Championship 决赛在 Sky Sports 的峰值观众为 4.9 million。这波需求迅速转化为二级票务市场价格上涨和 PDC 赛事快速售罄。

              拳击方面，Anthony Joshua 的比赛历史上创造过英国拳击最高上座之一：Wembley Stadium（2017 年 4 月 Joshua vs Klitschko，90,000 人）和 O2 Arena
              售罄。DAZN 订户增长（媒体估计全球 DAZN 订户到 2024 年初约 10 million）部分归因于拳击内容。Joshua 比赛和 Matchroom 的比赛组合位列 DAZN 全球观看量最高的赛事之中。

              PDC 全球飞镖扩张由 Luke Littler 效应和欧洲飞镖市场（荷兰、德国、奥地利）增长推动，2025-26 年 PDC 赛事售罄速度已快于以往年份。World Matchplay、UK Open 和
              European Championship 都显示需求强劲。Premier League Darts 17 晚巡回覆盖英国和欧洲主要城市，多数场馆售罄。
