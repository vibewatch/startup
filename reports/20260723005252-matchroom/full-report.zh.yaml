      - CV004
      - CV007
      - CV024
      - CV025
  - id: FV002
    title: 估值敏感性：£1B+ 入场价在关键变量假设下的变化
    type: bar
    layout: wide
    summary: 估算不同 EBITDA 利润率和退出倍数组合下的隐含 EV，展示 £1B+ 入场估值对底层假设的敏感性。
    data:
      items:
        - label: 基准（25% EBITDA 利润率 × 15x）
          value: 844
          note: EBITDA 约 £56M；EV = £844M — 低于当前入场价
        - label: 牛市（28% EBITDA 利润率 × 18x）
          value: 1134
          note: EBITDA 约 £63M；EV = £1.13B — 接近当前入场价
        - label: 乐观（30% EBITDA 利润率 × 18x）
          value: 1218
          note: EBITDA 约 £68M；EV = £1.22B — 略高于入场价
        - label: 牛市高点（30% EBITDA 利润率 × 20x）
          value: 1353
          note: EBITDA 约 £68M；EV = £1.35B — 完全溢价情景
        - label: 熊市（22% EBITDA 利润率 × 12x）
          value: 595
          note: EBITDA 约 £50M；EV = £595M — 大幅减值
        - label: 压力（18% EBITDA 利润率 × 10x）
          value: 406
          note: EBITDA 约 £41M；EV = £406M — DAZN 承压情景
    approximationNotes: 所有数值单位为 £M。FY2025 收入 £225.5M 是利润率估算基准。EBITDA 和 EV 均为本报告估算。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值与回报区间：牛市 / 基准 / 熊市
    type: range
    layout: standard
    summary: 在熊市、基准、牛市情景下，Matchroom 估计企业价值的低端、中位和高端。£1B+ 的虚线代表 Bruin Capital 隐含入场估值。
    data:
      items:
        - label: 熊市情景 EV
          low: 480
          mid: 570
          high: 660
          note: DAZN 承压；Joshua 不回归；收入停滞
        - label: 基准情景 EV
          low: 850
          mid: 1000
          high: 1200
          note: 温和增长；Joshua 部分回归；DAZN 续约
        - label: 牛市情景 EV
          low: 1400
          mid: 1800
          high: 2200
          note: Joshua 回归；DAZN 平价；PDC 版权升级；数据变现
        - label: Bruin 隐含入场估值
          low: 1000
          mid: 1100
          high: 1200
          note: 2026 年 5 月交易，估值 £1B+
    approximationNotes: 所有数值单位为 £M。本报告估算；未经审计管理账目核验。
    claimRefs:
      - CV007
      - CV021
      - CV022
      - CV023
      - CV010
  - id: FV004
    title: 投资 KPI：六个维度的 IC 就绪评分
    type: kpi
    layout: standard
    summary: Matchroom 投委会评分覆盖六个标准 IC 维度。评分 1–5（5 = 最好）。总体 3.2/5 = 中性。
    data:
      items:
        - label: 市场机会
          value: 4
          note: 英国 / 全球体育版权市场大且在增长；飞镖和拳击都在增长
        - label: 竞争护城河
          value: 4
          note: PDC 锁定式巡回赛；WST 51%；DAZN 协议；Hearn 的拳手关系
        - label: 商业进展
          value: 4
          note: £225.5M 收入；£44M 利润；每年 600+ 场赛事；历史表现强
        - label: 财务可持续性
          value: 3
          note: 资产轻；利润率强；但 DAZN 集中风险显著
        - label: 风险画像
          value: 2
          note: DAZN 风险（极高）；关键人风险（极高）；Joshua 暂停（现实风险）
        - label: 估值纪律
          value: 2
          note: £1B+ 对应 4.4x 收入，缺少安全边际；需要乐观假设支撑
    approximationNotes: 评分为本报告评估。1 = 很弱，5 = 很强。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV012
      - CV024
