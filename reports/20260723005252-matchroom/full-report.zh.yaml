  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >
              Matchroom 的风险版图集中在少数高严重性事项。最关键的风险是 DAZN 交易对手集中与 DAZN 财务健康的组合：来自 DAZN 的拳击媒体权利估计贡献 Matchroom 集团收入的
              35–45%，DAZN 报告截至 2024 年累计经营亏损超过 $4 billion。任何 DAZN 压力事件——重组、平台退出或被迫重谈——都会是 Matchroom 最具破坏性的情景。

              第二层风险是关键人依赖（Eddie Hearn 是 Matchroom 拳手关系的个人门面；他离开或丧失工作能力会威胁拳手合同续约）以及 Anthony Joshua
              的职业风险（伤病、退役或长期个人暂停会降低最高利润率拳击产品的频率）。Joshua 在 2026 年因个人失去亲近人士暂停拳击，是该风险的现实发生——虽然预计不会永久化，但它说明了依赖关系。

              第三层风险包括 WST 内部的 WPBSA 治理争议、沙特阿拉伯资本扰动拳击赛事经济性、PDC 合同到期时间，以及流媒体整合和 MMA 观众竞争带来的更广泛市场风险。

              概率加权评估：概率最高的风险是 DAZN 2031 年合同续约谈判；它虽不是即时威胁，却是中期最具后果的事件。最直接发生中的风险是 Joshua 暂停与近期拳击赛事排期缺口。概率最低但影响最高的情景，是类似
              COVID-19 的全球赛事中断，导致现场观赛收入消失。
