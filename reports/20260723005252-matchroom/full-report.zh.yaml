      - number: '3.4'
        title: 护城河耐久性、替代风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Matchroom 最耐久的护城河是其在 PDC 和 WST 的治理位置。这些是对运动管理 / 商业主体的结构性股权，而相关运动没有可信替代巡回赛——BDO（British Darts
              Organisation）于 2020 年倒闭，消除了 PDC 唯一竞争对手。新进入者若想复制 PDC 位置，需要招募约 221 名顶级职业飞镖选手、建立电视转播关系，并承受数年运营亏损，才可能达到 PDC
              规模。门槛很高。同样，WPBSA/WST 的共同治理结构虽然偶尔制造摩擦，但也保护 Matchroom 的斯诺克位置，使其不易被取代。

              拳击护城河较弱。任何拥有足够资本、拳手关系和转播方支持的推广方，都可以进入拳击推广市场。Boxxer（Sky Sports）的出现就是证据。沙特阿拉伯主权财富对拳击赛事的投入——由 Turki Al-Sheikh
              和 Riyadh Season 赛事推动——是一个反向进展：国家支持资本进入拳手保底和赛事经济，纯商业推广方难以匹配，尤其会扰动重量级冠军战的赛事经济。

              研究中识别出的最重要反向趋势，是 UFC/MMA 对格斗运动媒体预算的替代风险。拳击和 MMA 是不同运动，可以共存，但转播方和流媒体平台预算有限。Endeavor 旗下 UFC 每年从 ESPN 获得
              $300M+ 的 MMA 内容版权收入。对 Matchroom 来说，风险不是直接竞争，而是相对议价能力：如果拳击受众增长落后于 MMA，未来版权续约可能不如当前 $1B DAZN 协议所暗示的那样有利。

              拳击的商品化风险中等：赛事本身不可替代（Joshua vs Bivol
              不能由任何其他拳赛替代），但推广角色本身部分可商品化，因为拳击经纪公司和熟悉社交媒体的推广方降低了低端市场进入门槛。高端市场（世界冠军战、大型场馆赛事）仍受拳手关系和转播方预算保护，而这两者都更有利于成熟推广方。
            claimRefs:
