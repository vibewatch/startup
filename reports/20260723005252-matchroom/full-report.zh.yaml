      - number: '1.4'
        title: 里程碑、组合扩张与战略版图
        blocks:
          - type: paragraph
            body: >
              Matchroom 44 年历史可分为四个阶段。第一阶段（1982–2000）覆盖创立期，以及公司在斯诺克经纪和拳击推广中的早期主导地位。Barry Hearn 拿下 Steve Davis、Dennis
              Taylor 和 Jimmy White 的经纪合同，随后推广多个标志性拳击赛事，包括 1987 年在 White Hart Lane 举办的 Frank Bruno 对 Joe Bugner（现场观众
              35,000 人）。Mosconi Cup 台球赛事于 1994 年推出，PGA EuroPro Tour（发展型高尔夫巡回赛）于 2002 年成立。

              第二阶段（2001–2015）进入管理机构所有权扩张期。Matchroom 于 2001 年收购 Professional Darts Corporation
              多数股权，把飞镖从小众电视产品做成拥有九位数奖池的大众观赏运动。Barry Hearn 于 2009 年成为 World Snooker Tour Ltd 多数股东，推动斯诺克强势复兴：奖金增加，排名赛数量从 6
              场增至 28 场，中国成为关键增长市场。Weber Cup（十瓶保龄球）也在这一阶段推出。

              第三阶段（2016–2023）开启全球拳击流媒体时代。2018 年 5 月，Matchroom Boxing 与 DAZN 签下五年协议，据报道金额约 £740 million，覆盖每年 16
              场美国拳赛。该协议于 2021 年 6 月续签。Boxing USA 被正式设为独立实体。公司也开始探索面向消费者的流媒体，并以多种试验形态新增长曲棍球、体操和无挡板篮球等资产。

              第四阶段（2024 年至今）是机构资本阶段。Victory Live 票务合作于 2025 年 2 月宣布。标志性的 DAZN 合同于 2026 年 2 月再续五年（至 2031 年），金额约 $1
              billion，覆盖美国和英国每年 30 场赛事。Bruin Capital 少数股权交易于 2026 年 5 月完成，为下一阶段增长提供资本和美国市场经验。
