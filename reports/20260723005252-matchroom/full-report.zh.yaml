      - number: '7.3'
        title: 运营风险与关键人依赖
        blocks:
          - type: paragraph
            body: >
              Matchroom 的运营模式资产轻、以赛事为基础。主要运营风险包括：（1）场馆不可用或不可抗力（O2 Arena 重大预订取消会要求快速改期）；（2）拳手短期退赛（伤病、疾病、个人情况——Joshua 2026
              年已经发生）；（3）转播制作失败（高端现场赛事期间的技术故障）；（4）赛事安全事故（拳台边伤害、人群事件或安保失败）。

              关键人风险尖锐。Eddie Hearn 是 Matchroom Boxing 的定义性人物。他亲自管理与世界冠军的关系、谈判合同，并在全球代表 Matchroom 品牌。他的公众形象（社交媒体、YouTube
              内容、“No Filter Boxing” 采访系列）创造了显著附属媒体价值。如果 Hearn 离开，竞争推广方（Top
              Rank、PBC、Queensberry）很可能在合同续约时激进挖走他的拳手阵容。目前没有公开披露的拳击推广人角色继任计划。

              Barry Hearn 的运营角色已减少（他正式退出日常管理，但仍任执行主席），意味着 Eddie Hearn 实际上是公司对外唯一面孔。高级管理人员关键人保险是 Matchroom
              这种规模英国公司的标准做法，但 Hearn 离职造成的声誉和商业扰动，不可能完全由保险赔款抵消。

              PDC 和 WST 的运营风险较低，因为巡回赛由各自管理团队独立运作。Matt Porter（PDC CEO）、Barry Hearn（仍为 PDC 董事会成员）和 WST 运营团队，在 Eddie Hearn
              之外提供制度连续性。PDC Tour Director 离任会是运营风险，但不像 Eddie Hearn 离开拳击那样是生死问题。

              COVID-19 证明了现场赛事禁令带来的尖锐运营风险。2020-21 年期间，Matchroom 闭门举办拳击赛事，完全依赖媒体权利收入。业务经受住了这次压力测试，但上座收入（估计 ~£50M+）消失了超过
              12 个月。重复的疫情情景，是组合中概率最低、运营影响最高的风险。
