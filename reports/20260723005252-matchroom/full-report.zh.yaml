  - id: TV005
    title: 投资逻辑破裂与终止触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - DAZN 违约或困境重谈
        - 2031 年前，DAZN 未按期支付权利费，或启动重大费用重谈
        - 抹掉拳击收入约 35–45%；集团 EBITDA 减少约 £15–25M+；估值压缩 30–40%
        - 投资逻辑立即破裂；重估估值和退出选项
      - - Eddie Hearn 离任 + 拳手流失
        - Hearn 离任，且 12 个月内 2 名以上顶级拳手（Joshua/Ennis/Bivol）与竞争推广方签约
        - 重创拳击商业版图；PDC/WST 不受影响，但拳击部门严重受损
        - 拳击投资逻辑破裂；分部加总估值降至 PDC/WST 单独价值（~£300–500M）
      - - Joshua 永久退役
        - Joshua 公开确认退役，且 12 个月内没有锁定替代头牌
        - 高端拳击赛事供给减少约 30–40%；削弱对 DAZN 的关系管理筹码
        - 投资逻辑部分受损；跟踪替代头牌培养
      - - PDC 媒体权利受压
        - Sky Sports 拒绝续约 PDC，或按实际价格计算续约费下降 30%+
        - PDC 是最抗压的收入流；任何压缩都明显利空
        - 关注升级；重估 PDC 单独估值
      - - WPBSA 治理诉讼裁决不利于 Matchroom
        - WPBSA 成功挑战 Matchroom 对 WST 的 51% 商业控制权
        - WST 商业控制权丧失；斯诺克护城河部分消失
        - 关注升级；法律风险落地
    notes: 所有阈值均为编辑判断。没有任何阈值已按 Matchroom 实际治理或监控流程验证。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV006
    title: 最终尽调问题表
    columns:
