      - number: '4.2'
        title: 成本结构、毛利率与经营杠杆
        blocks:
          - type: paragraph
            body: >
              Matchroom 的主要成本类别包括：（1）赛事制作和运营成本（场馆租赁、转播制作、安保、人才保底）；（2）拳手出场费和 PDC 奖金义务；（3）员工和管理费用（估计约 500–700
              名员工）；（4）内容分发和营销。现场体育赛事制作天然形成半可变成本结构：基础设施和员工基盘的固定成本持续存在，但单场赛事成本是增量成本，可通过取消或改期赛事来管理。

              在 £225.5M 收入上实现 £44M 税后利润，意味着净利率约 19.5%。对体育媒体和赛事公司来说，这是健康水平；但由于现场赛事运营占用营运资本，利润率低于纯 IP /
              媒体业务。拳手出场费是最大可变成本项；Joshua 这类重大赛事中，拳手保底从本土卡司的低七位数，到据报重量级冠军大战的 $30–50M+ 不等。这些费用可由门票收入和媒体版权分配部分或全部回收。

              PDC 飞镖业务的成本结构根本不同：奖金池（据媒体报道，PDC 在 2024–25 年支付 £17.9M 奖金）通过商业合作伙伴回收，而转播收入提供高利润贡献。WST
              同样受益于经常性转播权收入，除场馆和制作外，单场边际成本有限。

              Matchroom
              的资本开支主要是制作设备、数字基础设施和租赁物业改造。相较大型体育机构，公司历史上属于轻资产（不拥有体育场，也无永久场馆）。营运资本围绕赛事预售票款和媒体版权预付款管理，形成正向浮存。Bruin Capital
              投资可能用于拳击赛事在美国进一步扩张，以及为数字受众变现搭建潜在技术平台。
