  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与收入结构
        blocks:
          - type: paragraph
            body: >
              Matchroom 截至 2025 年 6 月财年的 £225.5M 收入，来自其多运动组合下四条主要收入流。拳击媒体版权——主要是与 DAZN 的长期全球合作——是最大且最可预测的收入流，由一笔据报持续至
              2031 年、约 $1B 的协议托底。每年 600+ 个赛事日产生的现场票务和接待收入，是第二大收入池，覆盖拳击、飞镖、斯诺克、台球和乒乓球。Professional Darts
              Corporation（PDC）贡献转播权收入（Sky Sports、ITV、DAZN）、通过赞助回收的奖金承销，以及在 Alexandra Palace 举办的 PDC World Darts
              Championship 等赛事的参赛费。World Snooker Tour（WST）贡献转播权（BBC One、Eurosport/Discovery+、面向中国的 CCTV-5）、赛事主办费和商业权利收入。

              次级收入流包括围绕四大核心资产的赞助、冠名权和商业合作；每年 2,400+ 小时节目产生的制作和内容授权；以及 World Championship Ping-Pong、Weber Cup
              等赛事形式的国际授权。作为私营公司，Matchroom 根据英国 GAAP 下的 FRS 102 确认收入。多年期转播合同收入会在合同期内，随着每场赛事履约义务满足而确认。

              DAZN 集中度风险是收入质量中最重要的因素。尽管 Matchroom 已在运动和地域上分散，流向 DAZN 的拳击媒体版权仍构成显著单一交易对手暴露。DAZN 历史上亏损严重（媒体估计截至 2024 年累计
              $4B+），任何 DAZN 重谈或重组都可能实质影响 Matchroom 收入。但持续至 2031 年的协议提供了多年收入可见性。

              FY2025 收入 £225.5M 较此前年份增长；作为参考，Companies House 的 FY2023 数据显示 Matchroom Sport 收入 £161.7M，意味着两年增长约
              39%。这一轨迹反映了拳击赛事量增加，也反映了 Luke Littler 于 2023–24 年崛起后带动的 PDC 飞镖超级周期。
