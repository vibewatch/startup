      - number: '2.4'
        title: 增长驱动、采用约束与市场风险
        blocks:
          - type: paragraph
            body: >
              2026–2031 年，Matchroom 最强的增长驱动力是体育版权向流媒体平台的结构性迁移。DAZN、Amazon、Apple TV+ 和 Peacock
              都在争夺优质现场体育内容，用来拉新和留存订阅用户。格斗运动——尤其是拳击——仍是少数尚未被单一流媒体伞形平台整合的优质现场体育类别，持续竞价有利于 Matchroom
              这类权利持有人。美国是全球最大的媒体版权市场，也是最核心的增长奖品；Bruin Capital 合作明确面向这一机会。

              飞镖是第二个重要增长驱动。PDC World Darts Championship 在 Alexandra Palace 举办的两周赛程通常吸引超过 100,000 名观众，Sky Sports
              的现场观众互动也让它成为英国 1 月收视最高的体育节目之一。Luke Littler 作为全球青年体育偶像崛起，大幅拓宽了飞镖的受众结构和国际知名度。PDC 赛事未来在美国通过 Peacock
              分发，是一个高期权价值的上行情景。

              采用约束包括：（1）美国市场存在结构性阻力，拳击 PPV 传统和 PBC/Top Rank 推广方关系使 Matchroom 很难快速渗透；（2）关键人物依赖集中在 Eddie Hearn
              身上，他本人是拳手签约和赛事推广的核心；（3）拳击分散的制裁机构结构（WBA、WBC、IBF、WBO）带来监管风险，可能让统一战安排变复杂；（4）运动员集中风险，Anthony
              Joshua（主要收入驱动）退役或竞技状态下滑，会实质影响拳击收入；（5）DAZN 依赖，因为约 50%+ 的拳击媒体版权收入流向单一平台交易对手。
