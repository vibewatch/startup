      - number: '5.2'
        title: 运营架构：赛事制作与转播分发
        blocks:
          - type: paragraph
            body: >
              Matchroom 的运营模式是一台整合赛事推广和转播制作的机器。核心是一套项目制生产周期：每场赛事中，Matchroom 洽谈场馆、签约拳手或选手、与转播商协调摄像 /
              制作要求、管理现场赛事交付，并推动赛后内容分发。

              赛事制作能力：Matchroom 雇有一支常设制作团队（估计总员工 500-700 人），并为拳击、PDC 和 WST 配置专门运营团队。制作环节包括多机位转播配置（大型拳击赛事通常 12-20
              台摄像机）、现场评论和分析团队、图文包装制作，以及直播转播车基础设施。国际赛事中，Matchroom 会与本地联合推广方（例如美国历史赛事中的 Main Events）和场馆制作伙伴合作。

              转播分发架构：制作完成后，Matchroom 的现场赛事通过 IP 贡献信号交付给转播合作伙伴。DAZN 赛事的贡献信号进入 DAZN 云端制作基础设施，由 DAZN 编码并全球分发。Sky Sports 和
              BBC 赛事则在 IP 交付之外使用传统卫星分发。DAZN 平台把内容交付到网页浏览器、iOS/Android 应用、智能电视和游戏主机——这些都不由 Matchroom 直接管理（它们属于 DAZN
              的技术栈）。Matchroom 的技术贡献在制作和内容交付，不在面向消费者的平台。

              PDC 的数字基础设施包括 PDC 网站（pdc.tv）、PDC Fantasy Darts 移动应用，以及与博彩供应商围绕实时数据馈送的合作。Fantasy Darts
              应用在赛事间隙维系粉丝，并提供直接互动数据。Sky Sports 为 PDC 赛事提供英国主要转播基础设施，ITV 的免费电视平台则把 World Championship 分发给英国大众观众。

              体育分析：Two Circles 是一家总部位于伦敦的体育观众数据与分析公司，与包括 PDC 在内的多个体育组织合作，为粉丝分群、票务销售优化和数字互动策略提供数据驱动洞察。Two Circles 的分析能力让
              PDC 和 Matchroom 能把营销预算投向正确的观众分群，提升票务收益和转播订户转化。
