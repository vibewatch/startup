      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              Matchroom 的治理结构高度集中在 Hearn 家族手中。Barry Hearn 生于 1948 年，曾任会计师，1982 年创立公司。他担任主席至 2021 年 4
              月，之后退居创始人兼总裁，以顾问身份参与。Barry 的儿子 Eddie Hearn 当时接任集团主席，此后成为公司的公众面孔和运营负责人，尤其负责拳击业务和更广的商业战略。过去四十年里，两位 Hearn
              都被广泛视为英国体育商业中最有影响力的人物之一。

              Hearn 家族之外的领导层结构基本保持私密，公开文件披露有限。不过，PDC 是一个半独立实体，有自己的治理安排：Eddie Hearn 担任 PDC 主席，Matthew Porter 担任 PDC
              首席执行官。World Snooker Tour 则由 CEO Steve Dawson 单独管理。2026 年 5 月宣布 Bruin Capital 交易后，Bruin 获得 Matchroom
              董事会席位，George Pyne（Bruin 创始人兼 CEO，前 IMG 总裁、NASCAR CEO）加入董事会。此前完全由家族控制的治理结构，由此增加了一名外部董事。

              关键人物依赖是最突出的治理风险。Eddie Hearn 的个人品牌——包括社交媒体存在感、公开谈判方式和推广风格——深深嵌入 Matchroom
              的商业身份，尤其在拳击业务中。他若离任或失去履职能力，将构成重大扰动。同样，Barry Hearn 作为创始人 / 总裁的角色，以及 40+ 年积累的关系网络，构成难以替代的机构知识。Bruin
              的董事会席位带来一些外部监督，但公司实质上仍由家族经营。
