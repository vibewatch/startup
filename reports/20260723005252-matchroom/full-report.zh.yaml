      - number: '4.3'
        title: 单位经济、GTM 路径与销售效率
        blocks:
          - type: paragraph
            body: >
              Matchroom 拳击业务的核心 GTM 路径由拳手驱动：Eddie Hearn 签下一名世界级或有潜力的拳手，为其赛事谈定转播平台协议，再通过票务 + 媒体版权 +
              赞助变现。这里的客户获取等价物是拳手获取，而不是消费者订阅用户获取——Matchroom 不直接获客粉丝，这一环节交给转播方。新拳手交易的销售周期从数周（成熟冠军）到数月（需要多场培养合同的新秀）不等。

              PDC 飞镖采用巡回赛式 GTM 模型：PDC 为整个赛季赛事（Sky Sports、ITV、DAZN）以及单项赛事（BetVictor、Cazoo
              历史赞助）签订转播协议。奖金相当于拳手保底；顶级选手争夺由转播和商业收入承销的奖金池。PDC World Darts Championship 在 2024–25 年产生超过 £800,000
              奖金；整个巡回赛总奖金为 £17.9M+。

              赛事层面的单位经济：一场典型的 Matchroom O2 Arena 拳击馆赛（容量约 20,000），平均票价约 £75，可产生约 £1.5M 总票房。再加上每场媒体版权分配（估计每场 DAZN 本土卡司分配
              £2–5M）和赞助（每场重大赛事约 £500K–£1M）。一场在大型露天场馆举办的高端 Joshua 比赛（60,000+ 观众），票价更高（平均约 £150），可产生约 £9M+
              票务收入，并为高知名度比赛带来最高 £20M+ 媒体分配。

              转播协议的销售效率很高——Matchroom 与 DAZN、Sky Sports、BBC、ITV 和 PDC
              转播伙伴关系成熟，合同到位后所需销售成本相对较低。主要销售成本不是销售团队，而是关系维护和交易结构设计时间。DAZN 协议按多年期续签，带来的收入效率是逐场出售版权的卖方无法匹敌的。
