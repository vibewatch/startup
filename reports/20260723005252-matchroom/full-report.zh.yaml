      - number: '2.2'
        title: 多视角 TAM、SAM 与 SOM 分析
        blocks:
          - type: paragraph
            body: >
              Matchroom 横跨多运动、多地区、多形态，要估算真实可触达市场，必须同时使用多种视角。我们采用三种互补方法。

              视角一——自上而下看全球体育媒体版权。行业分析师估计，全球所有体育项目的转播权收入每年约 $50–80
              billion。格斗运动（拳击、MMA）是其中的优质小众赛道——汇总所有机构、转播方和流媒体平台后，全球拳击媒体版权市场估计每年约 $1–3 billion。PDC 飞镖电视版权市场较小但在增长，Sky
              Sports、DAZN、ITV 和国际转授权合计每年估计约 £100–300M。斯诺克全球版权，加上中国转播版图，也贡献了另一层可观收入。因此，按现有运动组合计算，Matchroom 的服务可触达市场估计约为每年
              $3–8 billion 的全球转播和流媒体版权支出。

              视角二——自下而上看 Matchroom 的 FY2025 收入。Matchroom 报告集团收入 £225.5M。公司目前运营约 600 个赛事日、制作 2,400 小时节目；若在 Bruin
              合作拉动下，美国市场的飞镖和拳击分发扩大，并推动组合运动的市场份额温和提升，5 年收入翻倍具备可行性。这意味着在不新增运动收购的现有组合下，有机收入天花板约为 £400–500M。

              视角三——以 DAZN 交易作为市场信号。DAZN 2026–2031 年五年 $1B 协议，意味着单一拳击合作伙伴的平均年度版权价值为 $200M。再加上 Sky Sports、ITV、BBC、PDC
              权利、WST 权利和国际转授权，年度媒体版权总收入很可能超过 £120–150M，占集团总收入一半以上。这个媒体版权引擎是 TAM 中最可扩展的部分。

              关键 SOM 约束在于：Matchroom 能否提高美国拳击和飞镖市场份额，取决于 Bruin Capital 的平台关系。美国拳击 PPV 仍由传统推广方和 HBO/Showtime
              的遗留关系控制。飞镖在美国仍处萌芽。两者都是真实但不确定的扩张机会。
