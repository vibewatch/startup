  - id: TV002
    title: 投资逻辑 / 反证表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 论点：PDC 飞镖结构性护城河提供可靠经常性收入
        - BDO 之后，选手没有可行替代平台；Littler 现象推高收视增长
        - PDC 治理争议或失去 Sky Sports 版权会显著削弱判断
      - - 论点：轻资产模式跑出 £44M 税后利润，经济性异常优秀
        - FY2025 Companies House 申报；19.5% 净利率显著高于现场赛事行业常态
        - DAZN 费用压缩或 Joshua 长期缺席会压低利润率
      - - 论点：DAZN 交易把拳击经济性锁定到 2031 年
        - 到 2031 年的 $1B/5yr 交易消除了拳击业务近期收入风险
        - DAZN 财务困境可能在 2031 年前迫使重谈
      - - 论点：Bruin Capital 交易验证 £1B+ 估值
        - 2026 年 5 月，具备体育经验的美国 PE 以 £1B+ 隐含估值买入 15% 股权
        - 若 DAZN 风险落地，Bruin 以 £1B+ 入局可能就是阶段高点
      - - 反向逻辑：DAZN 不是资产负债表稳健的交易对手
        - DAZN 累计亏损 $4B+；未披露盈利时间表
        - DAZN 订阅增长 + 投资人再注资会降低风险
      - - 反向逻辑：Eddie Hearn 在商业上难以替代
        - 没有接班计划；拳手关系高度个人化；任期已 14+ 年
        - Eddie Hearn 续约 + 留任激励 + 搭建接班梯队
      - - 反向逻辑：Joshua 暂停 / 缺席会减少高溢价赛事供给
        - Joshua 2026 年暂停已确认；最高利润产品暂时缺位
        - Joshua 续约 + 确认回归可消除反向逻辑
      - - 反向逻辑：£1B+ 估值缺少安全边际
        - 4.4x 收入高于同业现场赛事倍数；前提是 DAZN 经济性延续
        - 价格降至 £800–850M 后，风险回报才会有吸引力
    notes: 投资逻辑和反向逻辑均为编辑判断，并以公开来源证据为锚。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
