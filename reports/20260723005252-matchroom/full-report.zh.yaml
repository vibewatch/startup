  - id: FV001
    title: 推荐逻辑：从证据到中性 / 观察
    type: flow
    layout: wide
    summary: 决策链从规模、证明、风险、估值证据推导至“中性 / 观察”建议。
    data:
      nodes:
        - id: mkt
          label: |-
            市场
            英国体育版权市场 £4–5B+，仍在增长；飞镖 / 拳击拐点
          type: input
        - id: moat
          label: |-
            护城河
            PDC 结构性锁定；WST 51%；DAZN 协议覆盖至 2031 年
          type: input
        - id: fin
          label: |-
            财务
            收入 £225.5M；利润 £44M；净利率 19.5%
          type: input
        - id: risks
          label: |-
            风险
            DAZN 集中度（极高）；Eddie Hearn 关键人（极高）；Joshua 暂停（现实风险）
          type: input
        - id: val
          label: |-
            估值
            入场估值 £1B+；收入倍数 4.4x；EBITDA 约 15–18x
          type: decision
        - id: reco
          label: |-
            建议
            中性 — £800–850M 观察
          type: output
        - id: bull
          label: |-
            上行情景触发因素
            Joshua 回归 + DAZN 续约 + PDC 版权升级
          type: output
        - id: bear
          label: |-
            下行情景触发因素
            DAZN 承压 + Hearn 离开 + Joshua 退役
          type: output
    approximationNotes: null
    claimRefs:
