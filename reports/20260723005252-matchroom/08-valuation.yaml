company:
  name: "Matchroom"
chapter:
  number: 8
  title: "Valuation"
  summary: "Matchroom's May 2026 transaction values the business at £1 billion+ (~$1.4B), implying ~4.4x FY2025 revenue and ~22–23x post-tax profit. This is a reasonable, if optimistic, price for a highly profitable UK sports events business with structural moats in darts and snooker but meaningful DAZN concentration risk in boxing. Our base-case view is neutral: the valuation is supportable given current earnings and cash generation, but not compelling at entry. The business is investable at £800–900M; the 2031 DAZN renewal and Joshua return are the critical swing factors."

sections:
  - id: investment-thesis-and-anti-thesis
    title: "Investment Thesis and Anti-Thesis"
    body: >
      The investment thesis for Matchroom rests on three compounding advantages: (1) structural governance moats in professional darts (PDC) and snooker (WST), providing recurring revenue streams that competitors cannot easily replicate; (2) the transformative DAZN partnership, which monetises the boxing portfolio at unprecedented scale and locks in economics through 2031; and (3) highly resilient cash generation — £44M post-tax profit on £225.5M revenue represents a 19.5% net margin that is exceptional for a live events and sports promotion business.

      The anti-thesis is led by concentration and key-person risk. Approximately 35–45% of group boxing revenue flows through a single counterparty (DAZN) whose own financial model has generated $4B+ in cumulative losses. The second anti-thesis element is the Anthony Joshua dependency: the prolonged career pause in 2026 demonstrates concretely that the highest-margin event tier is exposed to individual human decisions. Third, Eddie Hearn is the irreplaceable commercial face of Matchroom Boxing; no succession mechanism is publicly disclosed. Fourth, the £1B+ entry price prices in continuation of the current earnings level with limited margin of safety.

      The most differentiated positive in the Matchroom case is not boxing (where the risks are high) but the PDC darts circuit: it is structurally captive (no viable player alternative), growing rapidly in viewership (Littler phenomenon is the biggest darts catalyst in 20 years), and underpinned by a diversified broadcast model (Sky Sports + ITV + DAZN international). At a sum-of-the-parts level, the PDC darts business alone may justify 30–40% of the £1B+ group valuation.

      The most differentiated negative is the 2031 DAZN cliff: five years is a long time in media rights, and DAZN's financial model has yet to be proven viable. If DAZN cannot renew at comparable terms, Matchroom will need to re-contract boxing rights at a potentially lower level, compressing the boxing revenue stream materially.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001, FV002]

  - id: current-valuation-context-and-entry-discipline
    title: "Current Valuation Context and Entry Discipline"
    body: >
      The May 2026 Bruin Capital transaction establishes a market reference point: a 15% stake was acquired, implying a £1 billion+ (~$1.4B) post-money group valuation. At FY2025 revenue of £225.5M, this is a revenue multiple of approximately 4.4x. At post-tax profit of £44M, it is approximately 22.7x post-tax profit. Applying a standard EBITDA estimation (assuming 25–30% EBITDA margin given asset-light model and reported post-tax margin), implied EBITDA is ~£55–68M, giving EV/EBITDA of ~15–18x.

      This valuation is above sector averages for pure-play live events promoters (typically 8–14x EV/EBITDA) but below media rights-holding companies (typically 18–25x). The premium to pure promoters reflects the PDC and WST governance moats, the long-term DAZN deal, and the recurring nature of the events calendar. The discount to media rights businesses reflects the absence of true asset ownership: Matchroom promotes events and owns circuits, but does not own the broadcast rights outright as a library asset.

      Entry discipline: A new investor at the same £1B+ valuation would need to believe that (a) earnings can grow 50–100% over a 5–7 year hold; (b) DAZN renews at comparable or superior terms in 2031; and (c) the PDC darts circuit continues its rapid growth trajectory (Littler and next-generation dart player base). All three conditions are plausible but not guaranteed. At £800–850M, the margin of safety is materially more comfortable: this would imply 14–15x EBITDA and 3.6x revenue, which is a full-discount entry for a structurally moated sports business.

      The Hearn family retains 85%+ of the business; this provides minority investor protection in the event of a future IPO or strategic sale, but also limits control rights and near-term liquidity. Bruin's 15% stake provides minimal governance leverage. Any new investor taking a minority stake would be a financial partner, not a strategic controller.

      Net cash position is not independently confirmed, but the business reported £44M post-tax profit with an asset-light model implying low capex. If the company is debt-light (as suggested by its private family company structure), the equity value is well-supported by current cash generation.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV003]
    figureRefs: [FV003]

  - id: comparable-set-and-valuation-methodology
    title: "Comparable Set and Valuation Methodology"
    body: >
      Identifying a precise comparable set for Matchroom is challenging because no exact equivalent public company exists: Matchroom is a diversified sports event promoter with governance moats, not a pure sports franchise or media rights library. However, several proxies are informative.

      Live Nation Entertainment (NYSE: LYV) is the closest revenue-scale comparable: a live events and promotions business generating $22B+ revenue at ~13–15x EV/EBITDA as of 2024–2025. Live Nation is much larger and has a different business model (venue ownership, Ticketmaster), but the events monetisation mechanism is comparable. Live Nation's multiple is compressed by lower-margin ticketing and venue operations that are absent in Matchroom's asset-light model, suggesting a small premium for Matchroom is defensible.

      Endeavor Group Holdings (formerly WME-IMG), which owns UFC, was taken private in 2024 at approximately $13B enterprise value. UFC itself is estimated at $10–12B, implying ~25–30x EV/EBITDA for a premium combat sports rights business. Matchroom boxing is not UFC — it lacks UFC's media library ownership and global scale — but the comparable demonstrates that the premium end of the sports rights market trades at very high multiples.

      Formula One Group, owned by Liberty Media, was acquired for approximately $4.4B in 2017 when F1 revenues were ~$1.8B, implying ~2.4x revenue at acquisition. The current F1 EV is approximately $14B on ~$3B revenue (4.7x). F1's multiple is driven by its media rights ownership and global race circuit agreements — features Matchroom does not possess. This represents the structural ceiling for comparable sports circuit businesses.

      MSG Sports (NYSE: MSGS) trades at ~$1.1B market cap as of 2024-25 for the NY Knicks/Rangers franchises, which are asset-heavy sports franchises rather than event promotion businesses. Less directly comparable but illustrates that sports brand/franchise value is substantial.

      CVC Capital Partners' acquisition of Dorna (MotoGP rights owner) at £3.8B in 2021 is the most directly comparable deal: a diversified sports rights and event promotion company, asset-light, with a structural governance moat on the circuit. The CVC/Dorna multiple (~6–8x revenue) set a high watermark for sports circuit promoters. Matchroom at 4.4x revenue appears modestly below this precedent, suggesting the Bruin entry price is not outlier-stretched.

      A discounted cash flow analysis using current FCF of ~£35–45M (estimated from post-tax profit with minimal capex adjustment) at a 10–12% discount rate yields a present value range of ~£290–450M per year of steady-state earnings, growing at 5–10% per annum for 5 years then 3% terminal. This yields an intrinsic value range of approximately £600M (bear) to £1.3B (bull), centred around £850–950M for the base case.
    claimRefs: [CV014, CV015, CV016, CV017, CV018, CV019, CV020]
    tableRefs: [TV004, TV005]
    figureRefs: [FV004]

  - id: scenarios-and-final-diligence
    title: "Bull, Base, Bear Scenarios and Final Diligence Asks"
    body: >
      Three scenarios span the distribution of Matchroom outcomes over a 5-year investment horizon.

      The bull case assumes: Joshua returns to active boxing within 12 months and remains dominant for 5 more years; DAZN's financial position stabilises and the 2031 renewal is completed at comparable or higher fees; PDC darts continues its explosive viewership growth and commands a Sky Sports rights upgrade; WST/snooker captures incremental Chinese broadcast value; and Bruin Capital's sports analytics capability generates new data-driven revenue streams. In this scenario, group revenue reaches £350–400M by FY2030, EBITDA grows to £90–110M, and at 18–20x EBITDA, Matchroom could be worth £1.6–2.2B, supporting an investment return of 1.8–2.5x on the £1B+ entry.

      The base case assumes: Joshua returns within 18 months with 2–3 premium events before retirement; DAZN renews in 2031 at slightly lower real terms; PDC darts grows moderately with Sky rights renewal; WST maintains BBC relationship; group revenue reaches £270–300M by FY2030, EBITDA ~£65–80M, and at 15x EBITDA, Matchroom is worth £975M–£1.2B. A 5-year investment at £1B+ yields modest returns of 0.9–1.2x (near capital preservation, or a small positive IRR if entry is at a discount). This is the "hold" scenario—manageable but not compelling for PE investors.

      The bear case assumes: Joshua does not return meaningfully; DAZN distress forces a boxing rights renegotiation in 2029–30 at materially lower fees; PDC/WST grow steadily but cannot offset boxing decline; group revenue stagnates at £200–230M, EBITDA compresses to £40–55M, and at 12x EBITDA, Matchroom is worth £480–660M. An investment at £1B+ would result in a loss of 35–50% of capital in this scenario.

      The recommendation is neutral. The business is exceptional in quality and operational execution. The moats are real and durable (especially PDC). The current earnings are strong. But the entry valuation at £1B+ does not provide adequate margin of safety given the DAZN concentration risk and key-person dependency. A compelling entry would be at £800–850M or below. The priority diligence asks before committing are: (1) DAZN subscriber and financial health audit; (2) Eddie Hearn contract and succession; (3) Joshua contract terms; (4) PDC broadcast rights renewal schedule; (5) audited group-level EBITDA and capex for FY2025.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV026, CV027]
    tableRefs: [TV006]

