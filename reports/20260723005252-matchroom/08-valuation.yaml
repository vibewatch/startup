callouts:
  - calloutType: recommendation
    title: "Neutral — Compelling Business, Full Valuation"
    body: "Matchroom is one of the UK's most impressive private sports businesses: structurally moated circuits, exceptional margins, and a proven £1B+ commercial franchise. However, the £1B+ entry price does not provide adequate margin of safety against the very real DAZN concentration risk and key-person dependency. A compelling entry is at £800–850M."
    claimRefs: [CV007, CV024, CV025]
  - calloutType: strength
    title: "PDC Darts Is the Hidden Gem in the Portfolio"
    body: "The PDC darts circuit is the most structurally resilient and fastest-growing division. It has no viable player alternative, a diversified broadcast model, and the Luke Littler phenomenon has introduced a generation of new fans. At a sum-of-the-parts level, PDC alone may represent 30–40% of the group's total value."
    claimRefs: [CV002, CV015]
  - calloutType: risk
    title: "DAZN Is the Thesis-Break Risk the Valuation Does Not Adequately Price"
    body: "At £1B+ entry, there is minimal margin of safety for a DAZN distress scenario. A DAZN default or forced renegotiation would reduce group EBITDA by £15–25M+ and compress the valuation by 30–40%. This risk is not priced into the Bruin entry valuation, creating an asymmetric downside."
    claimRefs: [CV004, CV017, CV021, CV022, CV023]
  - calloutType: insight
    title: "The 2031 Horizon Is the Critical Investment Decision Point"
    body: "For a 5-year hold, the 2031 DAZN renewal negotiation will occur before or at exit. Investors entering in 2026 will need to either exit before 2031 (limited time) or underwrite the DAZN renewal risk. This makes 2031 the central axis of any investment case."
    claimRefs: [CV006, CV013, CV017, CV026]

