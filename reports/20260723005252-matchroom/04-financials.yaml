callouts:
  - calloutType: strength
    title: "Profitable and Cash-Generative at Scale"
    body: "Revenue of £225.5M and post-tax profit of £44M (FY2025) demonstrates Matchroom operates a scaled, profitable business. A ~20% net margin is above industry norms for live event promoters and reflects the high-margin contribution of media rights income."
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: "DAZN Counterparty Concentration Is the Primary Revenue Risk"
    body: "Matchroom's boxing division is disproportionately exposed to DAZN's financial health. DAZN has historically operated at multi-billion-dollar losses, and any distress scenario would require emergency re-contracting, potentially at significantly lower rights fees. The 2031 contract term provides medium-term protection but not permanent insulation."
    claimRefs: [CI003, CI011, CI025]
  - calloutType: assumption
    title: "Revenue Mix Estimates Are Editorial Only"
    body: "Matchroom does not publish segment-level revenue data. The revenue split between boxing, darts, snooker, and other sports presented in this chapter is an editorial estimate based on relative event scale, press reports, and comparable organisation disclosures. Material variance is possible."
    claimRefs: [CI001, CI004, CI005]
  - calloutType: insight
    title: "PDC Darts Prize Money Drives High-Margin Commercial Cycle"
    body: "The PDC's model of underwriting prize money (£17.9M+ in 2024-25) through broadcast and commercial income creates a virtuous cycle: higher prize money attracts better players, which drives viewer ratings, which commands higher broadcast rights fees. This is a high-margin business within Matchroom's portfolio."
    claimRefs: [CI005, CI008, CI017]

