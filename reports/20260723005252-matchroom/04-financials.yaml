company:
  name: "Matchroom"
chapter:
  number: 4
  title: "Financials"
  summary: "Matchroom Sport reported revenue of £225.5M and post-tax profit of £44M for the year ending June 2025, driven by four core streams: boxing media rights, live events, PDC darts, and World Snooker Tour. The Bruin Capital 15% stake transaction in May 2026 implies a £1B+ enterprise valuation. The business is profitable, cash-generative, and family-controlled, with modest leverage. Key diligence blockers are the absence of full audited accounts (private company) and DAZN counterparty concentration risk."

sections:
  - id: revenue-streams-and-mix
    title: "Revenue Streams and Revenue Mix"
    body: >
      Matchroom's revenue of £225.5M for the year ending June 2025 derives from four principal streams across its multi-sport portfolio. Boxing media rights—primarily the long-term DAZN global partnership—represent the largest and most predictable stream, anchored by a reported ~$1B deal through 2031. Live event ticketing and hospitality across 600+ annual event days forms the second-largest revenue bucket, spanning boxing, darts, snooker, pool, and table tennis. The Professional Darts Corporation (PDC) contributes broadcast rights income (Sky Sports, ITV, DAZN), prize money underwriting recovered through sponsorship, and participation fees from events including the PDC World Darts Championship at Alexandra Palace. The World Snooker Tour (WST) contributes broadcast rights (BBC One, Eurosport/Discovery+, CCTV-5 for China), event hosting fees, and commercial rights.

      Secondary revenue streams include sponsorship, naming rights, and commercial partnerships associated with each of the four primary properties; production and content licensing for 2,400+ annual programming hours; and international licensing of event formats including World Championship Ping-Pong and Weber Cup. Matchroom's revenue recognition follows UK GAAP under FRS 102 as a private company. Revenue from multi-year broadcasting contracts is recognised over the contract period as performance obligations are satisfied at each event.

      The DAZN concentration risk is the most material factor in revenue quality. While Matchroom has diversified across sports and geographies, boxing media rights to DAZN represent a significant single counterparty exposure. DAZN has historically operated at significant losses ($4B+ cumulative through 2024 by press estimates), and any DAZN renegotiation or restructuring could materially affect Matchroom's top line. However, the agreement through 2031 provides multi-year revenue visibility.

      Revenue for FY2025 of £225.5M represents growth from prior years; for reference, FY2023 Companies House data for Matchroom Sport reported £161.7M revenue, suggesting approximately 39% growth over two years. This trajectory reflects both increased boxing event volume and the PDC darts supercycle driven by Luke Littler's emergence in 2023-24.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: cost-structure-and-margins
    title: "Cost Structure, Gross Margin, and Operating Leverage"
    body: >
      Matchroom's principal cost categories are (1) event production and operational costs (venue hire, broadcast production, security, talent guarantees), (2) boxer purses and PDC prize money obligations, (3) staff and overhead (estimated ~500–700 employees), and (4) content distribution and marketing. The nature of live sports event production creates a semi-variable cost structure: while fixed costs of the infrastructure and staff base persist, per-event costs are incremental and can be managed through event cancellation or rescheduling.

      Post-tax profit of £44M on £225.5M revenue implies a net profit margin of approximately 19.5%. This is healthy for a sports media and events business, though below the margins of pure-IP/media businesses given the working capital intensity of live event operations. Boxing purse costs are the largest variable cost item; for major events such as Joshua fights, fighter guarantees can range from low seven figures for domestic cards to reportedly $30–50M+ for major heavyweight title bouts. These are partially or fully recovered from gate receipts and media rights allocation.

      The PDC darts business operates with a fundamentally different cost structure: the prize money fund (PDC paid out £17.9M in prize money in 2024-25 according to press reports) is recovered through commercial partners, and broadcast income provides a high-margin contribution. WST similarly benefits from recurring broadcast rights income with limited per-event marginal costs beyond venue and production.

      Capital expenditure for Matchroom is primarily production equipment, digital infrastructure, and leasehold improvements. The business has historically been asset-light relative to major sporting bodies (no stadium ownership, no permanent venue). Working capital is managed around event advance ticket sales and media rights pre-payments providing positive float. The Bruin Capital investment may fund further US expansion of boxing events and possible technology platform build-out for digital audience monetisation.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: unit-economics-and-gtm
    title: "Unit Economics, GTM Motion, and Sales Efficiency"
    body: >
      Matchroom's primary GTM motion for boxing is fighter-led: Eddie Hearn signs a world-class or promising fighter, negotiates a broadcast platform deal for that fighter's events, and monetises through ticketing + media rights + sponsorship. The customer acquisition equivalent is fighter acquisition, not consumer subscriber acquisition—Matchroom does not acquire fans directly (this is delegated to broadcasters). The sales cycle for a new fighter deal ranges from weeks (for established champions) to months (for rising talents requiring multi-fight development contracts).

      For PDC darts, the GTM model is circuit-based: the PDC signs broadcast deals for the entire season's events (Sky Sports, ITV, DAZN) and individual events (BetVictor, Cazoo historical sponsorships). Prize money acts as the fighter guarantee equivalent; top players compete for prize pools that are underwritten by broadcast and commercial income. PDC's PDC World Darts Championship generated over £800,000 in prize money in 2024-25; total prize money across the Tour was £17.9M+.

      Unit economics at the event level: A typical Matchroom boxing arena show at the O2 Arena (capacity ~20,000) with average ticket price of ~£75 generates gross ticket revenue of ~£1.5M. Add media rights allocation per event (estimated £2–5M per domestic card from DAZN allocation) and sponsorship (~£500K–£1M per major event). A premium Joshua fight at a large outdoor venue (60,000+ attendance) with higher ticket prices (average ~£150) generates ticket revenue of ~£9M+ plus media allocation of up to £20M+ for a high-profile fight.

      Sales efficiency for broadcast deals is high—Matchroom's established relationships with DAZN, Sky Sports, BBC, ITV, and PDC broadcast partners require relatively low sales cost once contracts are in place. The primary sales cost is relationship management and deal structuring time, not a salesforce. The DAZN deal renews on a multi-year basis, creating revenue efficiency unmatched by event-by-event rights sellers.
    claimRefs: [CI013, CI014, CI015, CI016, CI017, CI018]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: capital-adequacy-and-financing
    title: "Capital Adequacy, Financing, and Financial Verdict"
    body: >
      Matchroom is a profitable, cash-generative private business with no disclosed bank debt burden at the group level. The Bruin Capital transaction in May 2026, valuing the business at £1B+, was a minority equity sale (15%) by the Hearn family, not a primary capital raise. The proceeds from the Bruin transaction went to the Hearn family (existing shareholders), not to the company balance sheet, unless structured with a primary component—this distinction is not publicly confirmed.

      Matchroom's FY2025 results (revenue £225.5M, post-tax profit £44M) suggest strong cash generation capacity. At a normalised capex requirement and working capital cycle, the business likely generates £30–50M+ in annual free cash flow (after tax, interest, and capex), sufficient to self-fund organic expansion without external financing. Any US expansion initiative (new US boxing events, PDC US presence, digital platform) could be funded from operational cash flow over a 2–3 year horizon without debt.

      The capital structure risk is the implicit debt of fighter guarantees and contracted prize money obligations across PDC and WST. While these are operational commitments rather than financial debt, they represent contracted cash outflows that could create stress if event revenues fall (e.g., from a broadcaster default, a major venue cancellation, or a pandemic-style event). The COVID-19 period saw Matchroom operate events without audiences, relying entirely on media rights income, which stress-tested the business model.

      Financial verdict: Matchroom's financials reflect a well-managed profitable sports media and events business at a scale typically associated with listed entities. A £1B+ enterprise value at ~4.4x revenue and ~23x post-tax profit is modest relative to global sports media benchmarks (where multiples of 15–30x EBITDA are common for rights-owning entities). The primary diligence blockers are: (1) no access to full audited accounts or EBITDA break-down; (2) DAZN counterparty risk; (3) unconfirmed use of Bruin Capital proceeds; and (4) no disclosed leverage ratio or net debt position.
    claimRefs: [CI019, CI020, CI021, CI022, CI023, CI024, CI025]
    tableRefs: [TI005]
    figureRefs: [FI004]

