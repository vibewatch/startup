companyProfile:
  summary: "Matchroom Sport is the UK's largest independent sports promotion and event management company, founded in 1982 by Barry Hearn and now led by Group Chairman Eddie Hearn. The business promotes professional boxing globally (including Anthony Joshua, Katie Taylor), owns the Professional Darts Corporation (PDC) circuit, and controls 51% of the World Snooker Tour (WST) commercial entity. In May 2026, US sports private equity firm Bruin Capital acquired a 15% minority stake valuing the group at £1 billion+ (~$1.4B)."
  foundedDate: "1982-01-01"
  founders:
    - name: "Barry Hearn"
      role: "Founder and Executive Chairman"
  foundingLocation: "Romford, Essex, United Kingdom"
  headquarters: "Brentwood, Essex, United Kingdom"
  productSummary: "Live sports event promotion and broadcast rights packaging across boxing, darts, snooker, table tennis, pool, and lacrosse; 600+ annual event days and 2,400 hours of annual programming."
  customerFocus: "Broadcast partners (DAZN, Sky Sports, BBC, CCTV-5), live event attendees, betting sponsors, and corporate hospitality clients."
  businessModel: "Event promotion fees, broadcast media rights licensing, ticketing revenue, sponsorship, and merchandising. Long-term media rights deal with DAZN provides recurring income floor for boxing through 2031."
  stage: "Established unicorn / growth stage"
  fundingStatus: "Majority-owned by the Hearn family (85%+); 15% minority stake acquired by Bruin Capital (May 2026) at £1B+ valuation. No external venture capital; PE investment is first institutional capital."
  disclosureProfile: "private-disclosed"
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO018, CO019]
