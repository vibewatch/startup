callouts:
  - calloutType: strength
    title: "Integrated Rights Ownership Across Multiple Sports"
    body: "Unlike pure promoters, Matchroom owns or co-owns the commercial rights to PDC darts and World Snooker Tour, giving it structural control over IP, scheduling, and broadcast distribution. This reduces dependency on any single athlete or event and creates recurring annual event revenue streams."
    claimRefs: [CO006, CO007, CO029, CO030]
  - calloutType: risk
    title: "Key-Person Concentration in Eddie and Barry Hearn"
    body: "Eddie Hearn's personal brand is deeply embedded in Matchroom's commercial identity, especially in boxing. Barry Hearn's institutional knowledge and relationships span 40+ years. The absence of a public succession plan and the tightly family-controlled structure represent the single most important governance risk in any diligence scenario."
    claimRefs: [CO009, CO010, CO011, CO015, CO016]
  - calloutType: insight
    title: "Bruin Capital Transaction Marks Strategic Inflection"
    body: "The May 2026 Bruin Capital deal is not just a capital event but a strategic inflection toward US market scale. George Pyne's background in building IMG and NASCAR's digital and commercial infrastructure provides Matchroom with a board member uniquely positioned to accelerate US darts distribution on Peacock and grow boxing's American footprint."
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025]
  - calloutType: assumption
    title: "Financials Based on Press-Reported Unaudited Figures"
    body: "The £225.5M revenue and £44M profit figures are drawn from press reporting of company-provided figures for the year ending June 30, 2025. No audited accounts are publicly available (UK small company exemption may apply at group level). These should be treated as directionally accurate but subject to audit verification."
    claimRefs: [CO004, CO005]

