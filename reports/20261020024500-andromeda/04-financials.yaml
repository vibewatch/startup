schemaVersion: "report-v2"
artifact: financials
slug: andromeda
runDate: 2026-10-20
company:
  name: Andromeda
chapter:
  number: 4
  title: Financials
  summary: >-
    Public reporting describes a fast-growing and reportedly profitable GPU-capacity
    marketplace, including a $100 million 2025 annualized revenue run rate, but it does
    not disclose recognized revenue, take rate, gross margin, cash conversion, or runway.
    The underwriting case therefore depends less on the headline run rate than on proving
    transaction economics, supplier obligations, concentration, and liquidity.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Andromeda appears to monetize access to fragmented GPU supply rather than sell a
      conventional software subscription. The public proposition combines on-demand
      capacity, provider vetting, multi-provider procurement, consolidated billing, and
      pricing intelligence. SiliconANGLE reported that customers can avoid long-term
      contracts, while a separate job-directory profile describes flexible usage with no
      minimum duration and no ingress or egress fees. Those terms describe customer
      packaging, not realized pricing or recognized revenue. The strongest traction
      evidence is third-party reporting that annualized revenue run rate increased from
      $50 million in 2024 to $100 million in 2025 and that the business has been profitable
      since launch. Neither metric is audited in the retained evidence, and revenue run
      rate must not be treated as ARR or cash generation.
    claimRefs: [CI001, CI002, CI005, CI006, CI007, CI008, CI009, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: go-to-market-and-delivery-economics
    title: Go-to-market and delivery economics
    body: >-
      Current hiring materials point to a relationship-led, technically intensive sales
      motion. An account-executive posting asks candidates to bring an existing network,
      own the full cycle through technical validation and negotiation, and sell to AI-native
      buyers whose needs may exceed one provider's fleet. Partnership hiring adds provider
      distribution and venture-portfolio channels, while an infrastructure role is charged
      with matching demand to capacity, increasing utilization, onboarding suppliers, and
      negotiating supplier cost. This suggests that sales efficiency depends on deal
      sourcing, technical evaluation, and capacity matching rather than low-touch
      self-service alone. Public materials provide no sales-cycle duration, quota attainment,
      CAC, payback, provider take rate, support cost, or utilization history, so the cost to
      produce each dollar of reported run rate remains unquantified.
    claimRefs: [CI010, CI011, CI012, CI013, CI016]
    tableRefs: [TI002]
  - id: capital-adequacy-and-margin-path
    title: Capital adequacy and margin path
    body: >-
      Reporting places the latest financing at a $1.5 billion valuation, but SiliconANGLE
      says the round's exact dollar amount was unclear. That prevents a reliable bridge
      from funding headlines to cash currently available. The retained public sources do
      not disclose cash on hand, burn, runway, debt, guarantees, working-capital exposure,
      or contractual commitments to providers. The operating model could be relatively
      asset-light when capacity is brokered, yet job materials also emphasize supplier
      negotiation, utilization, reliability, and operational complexity, all of which can
      create margin and working-capital risk. A low-reputation market profile additionally
      lists a compute-for-equity program, but no contract terms were available, so that
      item is a diligence lead rather than an underwritten revenue stream.
    claimRefs: [CI003, CI004, CI012, CI014, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The public evidence supports demand and transaction activity, but not revenue quality.
      A doubling of reported annualized run rate and reported profitability are positive
      signals; more than 100 providers and more than 1,000 transactions also indicate that
      the platform has moved beyond a single-cluster experiment. However, none of those
      facts establishes gross margin, recurring retention, cash conversion, or resilience
      to GPU-price compression. The central underwriting question is whether Andromeda
      earns a durable spread for aggregation and operations without assuming inventory,
      credit, uptime, or minimum-purchase obligations that consume the apparent margin.
      Investment-grade diligence requires a recognized-revenue bridge, transaction-level
      take rates and contribution margins, concentration schedules, provider commitments,
      and a current liquidity and debt schedule.
    claimRefs: [CI001, CI002, CI006, CI007, CI012, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization mechanisms
    columns:
      - Stream
      - Mechanism
      - Unit or contract basis
      - Public value or status
      - Evidence quality
      - Diligence ask
    rows:
      - - GPU-capacity intermediation
        - Match buyers with capacity from multiple providers
        - On-demand usage; realized price and take rate undisclosed
        - Reported as an active commercial service
        - Company claims repeated by third-party reporting
        - Transaction ledger by GPU type, provider, customer, price, and take rate
      - - Procurement and billing aggregation
        - Vet providers and consolidate multi-provider purchases into one invoice
        - Billing cadence and payment terms undisclosed
        - Active feature; no separately disclosed fee
        - Company claim reported by SiliconANGLE
        - Customer contracts, supplier terms, credit exposure, and fee schedule
      - - Pricing intelligence
        - Region-specific GPU pricing index intended to support negotiation
        - Subscription, spread, or bundled economics undisclosed
        - Tool disclosed; monetization not disclosed
        - Company claim reported by SiliconANGLE
        - Product-level revenue and attach-rate schedule
      - - Compute-for-equity
        - Exchange compute access for startup equity
        - Contract terms and accounting treatment unavailable
        - Listed only by one low-reputation market profile
        - Uncorroborated diligence lead
        - Agreements, valuation policy, impairment history, and ownership schedule
    notes: >-
      Public-source snapshot as of 2026-10-20; reported packaging is not evidence of
      realized pricing, recognized revenue, take rate, or gross margin.
    claimRefs: [CI005, CI007, CI008, CI014, CI015, CI016]
  - id: TI002
    title: Pricing and go-to-market evidence
    columns:
      - Offer or motion
      - Public contract or price signal
      - Sales or delivery implication
      - Current evidence status
      - Required diligence
    rows:
      - - On-demand GPU access
        - No long-term contract described
        - Flexibility may support premium pricing but increases demand variability
        - Third-party report repeating company proposition
        - Realized hourly rates, discounts, cancellation terms, and utilization
      - - Flexible cluster usage
        - No minimum duration and no ingress or egress fees reported
        - Customer-friendly terms may shift idle-capacity and data-transfer costs
        - Low-reputation directory profile
        - Signed order forms and unit economics by workload
      - - Relationship-led enterprise sales
        - Full-cycle negotiation and technical validation; no public price card
        - Likely higher-touch acquisition and solutions-engineering cost
        - Company-issued job repost
        - Sales cycle, win rate, quota attainment, CAC, and payback
      - - Provider and venture channels
        - Provider distribution and VC-portfolio referrals; economics undisclosed
        - Channel access may lower sourcing cost but introduce partner concentration
        - Company-issued job repost
        - Referral fees, exclusivity, pipeline conversion, and channel concentration
    notes: >-
      Terms are directional public signals, not a price list; no retained source
      discloses realized customer pricing, discounting, commissions, or channel fees.
    claimRefs: [CI005, CI010, CI011, CI015, CI016]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence request
    rows:
      - - 2025 annualized revenue run rate
        - $100 million reported; $50 million reported for 2024
        - Medium; third-party reporting, unaudited
        - Shows scale but is not ARR, recognized revenue, or cash collection
        - Monthly GAAP revenue bridge, invoices, collections, and deferred revenue
      - - Profitability
        - Reported profitable since launch
        - Medium-low; definition and period absent
        - Could indicate capital efficiency, but may exclude working capital and capex
        - Audited income statement, cash-flow statement, and adjusted-to-GAAP bridge
      - - Gross margin and contribution margin
        - Not publicly disclosed
        - Gap
        - Tests whether aggregation and operations create a durable spread
        - Margin by GPU type, provider, customer cohort, and service component
      - - CAC, payback, retention, and sales cycle
        - Not publicly disclosed
        - Gap
        - Determines whether relationship-led growth is efficient and repeatable
        - Cohort CAC, NRR, GRR, churn, pipeline conversion, and cycle duration
      - - Cash, burn, and runway
        - Not publicly disclosed
        - Gap
        - Funding raised is not cash available and cannot establish runway
        - Current cash, monthly net burn, restricted cash, and 24-month plan
      - - Debt, guarantees, and provider obligations
        - Not publicly disclosed
        - Gap
        - Minimum commitments or credit support could make the model capital intensive
        - Debt schedule, guarantees, leases, minimum purchases, and supplier aging
    notes: >-
      Null fields are evidence gaps rather than zero values; reported revenue run rate
      and profitability are not substitutes for audited statements or cash-flow data.
    claimRefs: [CI001, CI002, CI003, CI004, CI012, CI016]
figures:
  - id: FI001
    title: Operating path from fragmented GPU supply to transaction economics
    type: flow
    summary: >-
      The public operating model connects provider sourcing and validation to buyer
      procurement, while the fee spread and resulting gross profit remain undisclosed.
    data:
      nodes:
        - id: providers
          label: Fragmented GPU providers
          detail: More than 100 providers were reported on the platform.
        - id: sourcing
          label: Supplier sourcing and negotiation
          detail: Infrastructure staff match demand, onboard suppliers, and negotiate cost.
        - id: validation
          label: Performance and security vetting
          detail: Provider hardware and supporting infrastructure are checked before listing.
        - id: matching
          label: Capacity matching
          detail: Training and inference demand is routed across available supply.
        - id: billing
          label: Consolidated customer billing
          detail: Purchases from multiple providers can be combined into one invoice.
        - id: economics
          label: Undisclosed transaction spread
          detail: Take rate, contribution margin, payment timing, and loss exposure are unavailable.
      edges:
        - from: providers
          to: sourcing
          label: onboard
        - from: sourcing
          to: validation
          label: qualify
        - from: validation
          to: matching
          label: make available
        - from: matching
          to: billing
          label: transact
        - from: billing
          to: economics
          label: recognize and collect
    approximationNotes: >-
      Conceptual operating sequence based on retained public sources; it is not a
      quantified waterfall and does not imply disclosed conversion rates or margins.
    claimRefs: [CI006, CI007, CI012, CI016]
callouts:
  - calloutType: risk
    title: Headline run rate does not resolve cash economics
    body: >-
      The reported $100 million annualized revenue run rate and profitability claim
      remain insufficient for underwriting until management provides recognized revenue,
      gross margin, working-capital, debt, and cash-conversion evidence.
    claimRefs: [CI001, CI002, CI016]
