evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-valuation
    missingEvidence: >-
      Executed financing documents reconciling NFDG's capacity commitment with equity funding, plus the current cap
      table, preference stack, debt, guarantees, and available cash.
    whyItMatters: >-
      The difference changes total raised, dilution, downside preference exposure, and the runway that can actually fund
      operations.
    diligencePath: >-
      Obtain signed financing documents, bank statements, debt schedules, and a fully diluted capitalization table from
      management and counsel.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, executive-team, delegated-authority, and succession roster.
    whyItMatters: >-
      Public evidence concentrates strategy and relationships around one executive while the originating founders are no
      longer active.
    diligencePath: >-
      Request the board roster, organization chart, key-person clauses, succession plan, and leadership employment and
      vesting agreements.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-provider-concentration
    missingEvidence: >-
      Named customer and provider counts, concentration, retention, contract duration, utilization, SLA performance, and
      counterparty credit exposure.
    whyItMatters: >-
      Company-reported provider and transaction counts do not establish recurring demand, marketplace liquidity, or
      earnings durability.
    diligencePath: >-
      Review contract-level cohort exports, top-20 concentration schedules, renewal data, SLA credits, utilization logs,
      and counterparty aging.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: legal-regulatory-incidents
    missingEvidence: >-
      Authoritative litigation, sanctions, regulatory, outage, security-incident, and insurance-claim records across
      relevant entities and jurisdictions.
    whyItMatters: >-
      No retained adverse record cannot establish that no event occurred, especially for a private company handling
      high-value infrastructure contracts.
    diligencePath: >-
      Run entity-verified court, regulator, sanctions, UCC, insurance, status-page, and security-incident searches and
      obtain management representations.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent accelerator-compute spend or capacity data segmented by geography, workload, procurement model, and
      third-party availability.
    whyItMatters: >-
      Without denominators and explicit exclusions, broad AI-infrastructure growth cannot establish Andromeda's TAM or
      serviceable market.
    diligencePath: >-
      Obtain current analyst and industry datasets, reconcile spend with installed capacity, and document every
      inclusion and exclusion.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: obtainable-market
    missingEvidence: >-
      Qualified pipeline, transaction volume, take rate, win rate, sales-cycle duration, repeat usage, retention,
      provider utilization, and concentration.
    whyItMatters: >-
      These metrics determine whether theoretical serviceable demand converts into durable platform revenue and
      defensible share.
    diligencePath: >-
      Review cohort-level CRM, billing, workload, and provider records and reconcile them to recognized revenue and
      gross margin.
    relatedQuestionRefs:
      - QM004
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent customer, procurement, benchmark, regulatory, and market-data evidence testing the company's demand
      and fragmentation thesis.
    whyItMatters: >-
      Most relevant retained detail is company-authored recruiting copy, so buyer urgency and adoption constraints are
      not independently validated.
    diligencePath: >-
      Interview named customers and lost prospects, collect direct cloud bids, and compare reliability, portability,
      security, and total workload cost.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: >-
      Current rate cards, realized discounts, contract minimums, take rate, SLA remedies, and comparable total-cost
      bids.
    whyItMatters: >-
      Without normalized commercial terms, the claimed procurement advantage cannot be translated into verified customer
      savings or margin durability.
    diligencePath: >-
      Request anonymized recent bids and executed contracts, then normalize hardware, region, term, utilization,
      support, and egress assumptions.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: provider-performance
    missingEvidence: Provider-level availability, benchmark, incident, certification, concentration, and SLA-remedy records.
    whyItMatters: >-
      The aggregation thesis depends on consistent execution across third-party supply rather than only nominal capacity
      breadth.
    diligencePath: >-
      Review provider scorecards, top-provider concentration, benchmark methodology, incident logs, and SLA-credit
      history for the last twelve months.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Customer-level renewal, multi-homing, migration effort, win-loss, and churn evidence.
    whyItMatters: >-
      Durability depends on whether customers retain Andromeda after capacity normalizes or can readily return to direct
      providers.
    diligencePath: >-
      Interview reference and lost customers, review cohort retention and provider migration records, and quantify
      contract and workflow exit costs.
    relatedQuestionRefs:
      - QP005
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Monthly recognized-revenue bridge from transactions and invoices, including take rate, discounts, refunds,
      collections, and deferred revenue.
    whyItMatters: Annualized revenue run rate cannot establish recurring revenue quality or cash conversion.
    diligencePath: Reconcile the transaction ledger to audited financial statements and bank collections.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross and contribution margin by GPU type, provider, customer cohort, and service component.
    whyItMatters: The durable spread after capacity, support, reliability, and payment costs is unknown.
    diligencePath: Review transaction-level revenue and direct-cost cohorts with finance and operations.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, working-capital schedule, debt, guarantees, leases, minimum provider commitments, and
      the board-approved operating plan.
    whyItMatters: >-
      Funding raised is not cash available, and undisclosed obligations could make an apparently asset-light marketplace
      capital intensive.
    diligencePath: >-
      Obtain treasury statements, debt and supplier agreements, covenant schedules, cash forecasts, and downside runway
      scenarios.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Sales-cycle duration, win rate, quota attainment, CAC, payback, retention, customer concentration, and
      partner-channel economics.
    whyItMatters: Hiring materials describe a high-touch motion whose efficiency and concentration are unquantified.
    diligencePath: Analyze CRM cohorts, customer contracts, churn, expansion, commissions, and channel fees.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: developer-experience
    missingEvidence: >-
      Current public API, CLI, console, integration, changelog, and product documentation showing which described
      surfaces are generally available.
    whyItMatters: >-
      Recruiting scopes can mix shipped functionality with roadmap work and cannot establish current product
      completeness.
    diligencePath: >-
      Obtain a live product demonstration, documentation export, API schema, release history, and a feature-by-plan
      inventory.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: performance
    missingEvidence: >-
      Customer-controlled workload benchmarks, test configurations, denominators, and time series for throughput, IOPS,
      startup, and uptime.
    whyItMatters: >-
      Supplier-originated point results do not establish repeatability across providers, workloads, or failure
      conditions.
    diligencePath: >-
      Review benchmark methodology and raw telemetry for representative training and inference customers across at least
      three providers.
    relatedQuestionRefs:
      - QE004
      - QE005
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Independent security attestations, penetration-test summary, tenant isolation design, subprocessor register,
      incident history, and customer-facing service-level records.
    whyItMatters: >-
      The platform processes sensitive workload, infrastructure, account, and billing data across multiple independent
      counterparties.
    diligencePath: >-
      Request the security package, DPA, subprocessor list, incident log, architecture review, access-control matrix,
      and SLA performance history.
    relatedQuestionRefs:
      - QE005
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: adverse-evidence
    missingEvidence: >-
      Reliable public evidence confirming or disproving outages, breaches, failed deployments, recalls, customer
