  topStrengths:
    - Reported annualized revenue run rate exceeded $100 million in 2025, with profitability reported since launch.
    - >-
      Public materials indicate meaningful marketplace activity across more than 100 providers and more than 1,000
      transactions.
    - >-
      The multi-provider model addresses fragmented GPU procurement and offers buyers flexible capacity and operational
      support.
  topRisks:
    - >-
      Recognized revenue, take rate, gross margin, cash conversion, burn, runway, debt, and provider commitments are
