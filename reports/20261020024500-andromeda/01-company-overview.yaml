company:
  name: "Andromeda"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Andromeda is a private GPU-compute marketplace and orchestration company that reports
    meaningful operating scale, while independent reporting places its 2025 revenue run rate
    above $100 million and its March 2026 valuation at $1.5 billion. The strongest diligence
    constraints are the absence of a verified cap table, board and succession map, audited
    financials, named-customer concentration data, and a clean distinction between capital
    committed to GPU capacity and equity funding raised.
sections:
  - id: "identity-and-operating-model"
    title: "Identity, footprint, and operating model"
    body: >-
      Andromeda presents itself as a two-sided market and infrastructure platform through
      which AI teams can buy and operate GPU capacity while infrastructure owners can sell
      capacity. Its official site says the platform sources, benchmarks, and prices compute
      across more than 100 providers, then standardizes contracts, service levels, invoicing,
      support, and observability; it also claims more than 1,000 completed transactions.
      Those are company-reported activity indicators rather than audited customer or revenue
      measures. Independent reporting traces the operation to a 2023 NFDG compute project,
      but the legal incorporation date remains unverified. A San Francisco office is reported,
      while a precise legal headquarters address is supported only by a low-reputation
      aggregator and should not be treated as confirmed.
    claimRefs: ["CO001", "CO002", "CO003", "CO011"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership, founders, and governance exposure"
    body: >-
      Nat Friedman and Daniel Gross originated the project, and Gross recruited Wil Moushey
      to run it in late 2023. Moushey is the visible operating leader and chief executive:
      reporting attributes the spinout, commercial model, scale targets, and market-making
      thesis directly to him. Friedman and Gross later joined Meta and, according to Upstarts,
      no longer have an active relationship with Andromeda. That transition reduces direct
      founder involvement but increases dependence on Moushey, especially because no public
      board roster, succession plan, or broader executive bench was found in the assigned
      evidence. A company-issued recruitment post for a founding marketing leader says the
      narrative, launch, customer-proof, and feedback-loop functions are still being built
      from scratch, signaling an early organizational layer despite reported revenue scale.
    claimRefs: ["CO003", "CO004", "CO006", "CO013"]
    tableRefs: ["TO002"]
  - id: "capital-scale-and-stakeholders"
    title: "Capital, reported scale, and stakeholder alignment"
    body: >-
      Upstarts reported that Andromeda became a standalone company backed by NFDG and Paradigm,
      with Paradigm's total investment reaching $60 million at a $1.5 billion valuation in
      March 2026. The same report says 2025 revenue run rate exceeded $100 million, up from
      more than $50 million in 2024, and says the company had operated profitably since its
      start. Revenue run rate is not ARR, and reported profitability is not evidence of cash
      generation. A separate aggregator labels $160 million as total funding across a $100
      million seed and $60 million Series A, but Upstarts describes NFDG's earlier amount as
      an upfront commitment associated with a GPU stockpile rather than clearly disclosed
      equity financing. Total raised, dilution, liquidity, debt, and available cash therefore
      remain unresolved rather than safely collapsing into one headline number.
    claimRefs: ["CO007", "CO008", "CO009", "CO010", "CO014", "CO015"]
    tableRefs: ["TO003"]
  - id: "milestones-and-diligence-implications"
    title: "Milestones and diligence implications"
    body: >-
      The operating sequence is unusually compressed: an NFDG-backed capacity project in
      2023, Moushey's recruitment that November, a reported stockpile above 4,000 GPUs by
      early 2024, revenue-run-rate expansion through 2025, and a standalone financing at a
      unicorn valuation in March 2026. By that financing report, a roughly 20-person company
      managed tens of thousands of GPUs and targeted as many as 100,000 during 2026. The
      resulting scale per employee could reflect a capital-light brokerage model, but it
      also concentrates execution, counterparty, and service risk. One customer told Upstarts
      that larger buyers may eventually internalize cluster capabilities, while the article
      noted that a durable marketplace requires enough buyers and sellers. No assigned source
      established the absence of lawsuits, outages, sanctions, or other incidents; the adverse
      search returning no retained result is a diligence gap, not exculpatory evidence.
    claimRefs: ["CO004", "CO005", "CO006", "CO007", "CO008", "CO009", "CO011", "CO012", "CO016"]
    figureRefs: ["FO001"]
