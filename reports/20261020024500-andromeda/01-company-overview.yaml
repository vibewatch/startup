callouts:
  - calloutType: "insight"
    title: "Capital-light scale is plausible but not yet proven"
    body: >-
      Leasing and brokering third-party capacity can explain high reported revenue and GPU
      throughput with a small team, but only transaction-level take rate, gross margin,
      utilization, and cash-conversion data can establish the quality of that scale.
    claimRefs: ["CO001", "CO009", "CO011", "CO012"]
  - calloutType: "risk"
    title: "Funding and governance headlines need primary documents"
    body: >-
      The assigned sources do not reconcile the NFDG capacity commitment with equity financing,
      or disclose board control, preferences, debt, guarantees, secondaries, or succession.
    claimRefs: ["CO006", "CO014", "CO015"]
