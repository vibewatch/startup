    - type: private-evidence-only
      severity: material
      topic: incident-and-service-history
      missingEvidence: >-
        Complete security incident, outage, SLA, job-failure, service-credit, and customer
        escalation history with affected tenants and root-cause remediation.
      whyItMatters: >-
        Absence of incidents in this public pool cannot establish absence, and reliability is
        central to the value of a broker operating across heterogeneous providers.
      diligencePath: >-
        Review incident register, status and ticket exports, provider scorecards, postmortems,
        penetration tests, SOC exceptions, and uptime cohorts under data-room access.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: economics-and-concentration
      missingEvidence: >-
        Recognized-revenue bridge, take rate, gross margin, cash conversion, burn, runway,
        customer and provider concentration, commitments, debt, guarantees, and preference terms.
      whyItMatters: >-
        Reported funding and valuation do not establish cash availability, loss absorption,
        working-capital needs, durable margin, or common-equity value.
      diligencePath: >-
        Reconcile audited financials to bank statements, billing and provider ledgers, executed
        contracts, cap table, debt documents, purchase commitments, and preference waterfall.
      relatedTableRefs: [TR003]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        A complete jurisdiction-by-jurisdiction inventory of entities, licenses, data flows,
        regulated counterparties, disputes, approvals, and compliance obligations.
      whyItMatters: >-
        The public-source register is illustrative and cannot prove completeness across a global
        supply and customer network.
      diligencePath: >-
        Have counsel map every entity, customer and provider jurisdiction, data transfer, export
        classification, contractual obligation, pending dispute, and regulator interaction.
      relatedTableRefs: [TR001]
