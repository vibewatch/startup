schemaVersion: "report-v2"
artifact: risks
slug: andromeda
runDate: 2026-10-20
company:
  name: Andromeda
chapter:
  number: 7
  title: Risks
  summary: >-
    Andromeda's clearest public risk is execution across a multi-provider GPU marketplace:
    third-party evidence describes light tenant isolation, reliance on neocloud capacity, and
    uncertain founder-network continuity, while company-issued job posts show core go-to-market
    systems are still being built. The assigned public evidence does not establish regulatory
    controls, incident history, SLA performance, concentration, unit economics, or mitigation
    maturity, so these remain transaction-critical diligence items rather than evidence of
    either failure or safety.
sections:
  - id: ranked-residual-exposure
    title: Ranked residual exposure
    body: >-
      The highest residual risks are multi-tenant security, provider reliability, and operating
      execution. ClusterMAX reports that Andromeda can deploy Slurm on Kubernetes with light
      namespace isolation between tenants and procures capacity from multiple neoclouds, while
      Airframe describes a broker responsible for consolidating commercial terms, billing, and
      observability across providers. Those facts establish a broad control surface, but the
      assigned sources do not disclose control testing, incident history, SLA attainment, or
      provider concentration. A second tier comprises founder-ecosystem continuity, early
      commercial systems, cap-table opacity, and the operational challenge embedded in a stated
      ambition to reach as many as 100,000 GPUs. Severity and likelihood below are analyst
      assessments of the cited exposure, not ratings published by the sources.
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR013, CR014, CR016]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory and legal risk
    body: >-
      Public materials in the assigned pool describe global, multi-provider compute brokerage,
      standardized commercial terms, and multi-tenant orchestration, but they do not include a
      regulator record, court record, DPA, privacy control matrix, export-control policy, or
      certification report. This is an evidence limitation, not proof that controls or incidents
      are absent. The most consequential legal diligence therefore concerns cross-tenant data
      handling, sanctions and export screening across providers and geographies, allocation of
      outage and performance liability, and corporate ownership. The latter deserves focused
      review because Silicon Valley Investclub says the full shareholder register is not public
      and its tear sheet mixes named investors, SPVs, and unattributed entries.
    claimRefs: [CR002, CR006, CR008, CR012, CR014, CR015]
    tableRefs: [TR001]
  - id: operational-quality-and-security
    title: Operational, quality, and security risk
    body: >-
      Andromeda's marketplace model can reduce sourcing friction, yet it also makes service
      quality depend on heterogeneous upstream fleets, networking, storage, orchestration, and
      commercial interfaces. ClusterMAX's light-isolation description is the sharpest technical
      risk signal in the assigned evidence; it should be tested rather than extrapolated into an
      incident claim. Company-issued job material separately acknowledges capital, risk, and
      operational complexity, and a reported 100,000-GPU aspiration would increase the importance
      of automated qualification, capacity provenance, change management, and escalation
      discipline. Public staffing and customer-proof signals are inconsistent or thin, so
      mitigation maturity should remain unscored until private evidence is reviewed.
    claimRefs: [CR002, CR005, CR007, CR009, CR010, CR011, CR016]
    tableRefs: [TR002]
  - id: dependencies-financial-model-and-execution
    title: Dependencies, financial model, and execution
    body: >-
      The company sits between fragmented GPU suppliers and demanding AI buyers, making both
      sides of the marketplace potential concentration points. ClusterMAX ties the original model
      to NFDG portfolio companies and questions continuity after Nat Friedman and Daniel Gross
      joined Meta; Andromeda's own sales posting says an existing relationship network is the
      fastest route to pipeline and that the sales motion is still being built. A reported
      $60 million round at a $1.5 billion valuation and aggregate funding claims indicate access
      to capital, not cash availability, margin quality, or runway. Investment approval should
      therefore require provider and customer concentration schedules, recognized-revenue and
      take-rate bridges, cash commitments, SLA history, and named owners for remediation.
    claimRefs: [CR001, CR003, CR004, CR008, CR009, CR013, CR014, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / scope
      - Public evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path / trigger
    rows:
      - - Cross-tenant data access or leakage
        - Multi-jurisdictional provider fleet
        - Light namespace isolation reported; no assigned primary compliance artifact
        - Medium
        - High
        - Not publicly evidenced
        - High
        - Obtain architecture, tenant-boundary tests, pentest, SOC reports, incident log, and DPA; stop if material isolation defects lack funded remediation.
      - - Export-control or sanctions failure
        - Provider and customer geographies
        - Global fragmented supply is asserted; no screening program appears in assigned evidence
        - Medium
        - High
        - Not publicly evidenced
        - High
        - Review customer/provider KYC, restricted-party screening, accelerator export classifications, geofencing, and audit exceptions.
      - - Contract, SLA, and liability mismatch
        - Customer and upstream provider contracts
        - Consolidated billing and standardized terms reported; underlying terms were not available
        - Medium
        - High
        - Not publicly evidenced
        - High
        - Reconcile customer remedies with provider recourse, insurance, uptime definitions, exclusions, and historic service credits.
      - - Corporate ownership and preference overhang
        - United States corporate and financing records
        - Legal name is reported, but the full shareholder register is described as non-public
        - Medium
        - Medium
        - Third-party estimates only
        - Medium
        - Obtain charter, cap table, SAFEs/notes, SPV look-through, preferences, board approvals, and beneficial-owner attestations.
    notes: >-
      Partial public-source register as of 2026-10-20. Likelihood, severity, mitigation maturity,
      and residual exposure are analyst ratings based on cited exposures; missing controls are
      diligence gaps, not evidence that controls do not exist.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to legal and regulatory exposures identifiable in the eight assigned public
        sources; no regulator, court, contract, or private compliance repository was available.
    claimRefs: [CR002, CR006, CR008, CR012, CR014, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Evidence
      - Mitigation maturity
      - Residual exposure
      - Monitoring / unresolved gap
    rows:
      - - Tenant-boundary failure
        - Medium
        - High
        - Third party reports light namespace isolation on Slurm over Kubernetes
        - Not publicly evidenced
        - High
        - Track isolation test failures, privileged access, cross-tenant network paths, and remediation age.
      - - Provider or cluster SLA variance
        - Medium
        - High
        - Marketplace spans multiple providers and centralizes observability and terms
        - Not publicly evidenced
        - High
        - Obtain provider scorecards, uptime and job-failure cohorts, service credits, and top-provider concentration.
      - - Scaling controls lag network ambition
        - Medium
        - High
        - Third party reports a goal of as many as 100,000 GPUs
        - Not publicly evidenced
        - High
        - Gate expansion on qualification automation, capacity provenance, change-failure rate, and tested escalation coverage.
      - - Operating processes lag commercial growth
        - Medium
        - Medium
        - Company job posts describe operational complexity and zero-to-one functional buildout
        - Early / still being built
        - Medium
        - Review org chart, on-call coverage, control owners, hiring plan, forecast accuracy, and customer escalation backlog.
    notes: >-
      Public evidence does not provide incident frequencies, uptime denominators, customer
      concentration, or audited control results. Ratings are directional analyst assessments,
      and null public evidence is not treated as a clean operating history.
    claimRefs: [CR001, CR002, CR005, CR006, CR009, CR010, CR013, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
      - Kill criterion / diligence ask
    rows:
      - - GPU capacity and service quality
        - Multiple neoclouds and infrastructure providers
        - Count and share by provider are not disclosed
        - Capacity withdrawal, poor cluster quality, or unmatched customer remedies
        - High
        - Multi-provider model is disclosed; failover effectiveness is not
        - High
        - Stop if any provider dominates critical capacity without portable workloads, tested failover, and matching contractual recourse.
      - - Founder and investor ecosystem
        - NFDG portfolio and founding sponsors
        - Original customer and supply dependence is not quantified
        - Reduced referrals, strategic sponsorship, or privileged capacity access
        - High
        - No public succession or diversification evidence in assigned sources
        - High
        - Require pipeline, supply, and revenue cohorts excluding founder-affiliated relationships plus documented succession ownership.
      - - Relationship-led customer acquisition
        - AI-native founders, infrastructure leads, and ML teams
        - Sales posting calls an existing network the fastest route to pipeline
        - Pipeline slows before a repeatable channel and proof program exists
        - Medium
        - Sales and marketing functions are being built
        - Medium
        - Require sourced-pipeline mix, win/loss data, sales-cycle cohorts, references, and a non-founder channel plan.
      - - Capital and valuation support
        - Paradigm, NFDG, and reported SPVs / investors
        - Funding totals are reported, but cash, commitments, and preference terms are not
        - Financing terms or working-capital needs impair growth or common-equity value
        - Medium
        - Recent financing reported; liquidity protection is not evidenced
        - Medium
        - Reconcile bank cash, restricted cash, debt, guarantees, purchase commitments, burn, runway, and preference waterfall.
    notes: >-
      Dependency concentration, cash availability, and contractual recourse are not quantified in
      the assigned public sources. Funding raised is not treated as cash available, and the
      ratings remain conditional on private schedules and executed agreements.
    claimRefs: [CR001, CR003, CR004, CR006, CR008, CR009, CR013, CR014, CR016]
