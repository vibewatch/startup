callouts:
  - calloutType: risk
    title: Evidence required before underwriting the risk
    body: >-
      Do not interpret the absence of regulator, court, incident, SLA, concentration, or margin
      records in this assigned pool as evidence of absence. Approval should require primary
      control artifacts, performance cohorts, counterparty schedules, executed contracts, and a
      cash-and-preference bridge with named remediation owners.
    claimRefs: [CR002, CR006, CR009, CR014, CR016]
