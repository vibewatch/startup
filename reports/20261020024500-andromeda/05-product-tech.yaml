schemaVersion: "report-v2"
artifact: product-tech
slug: andromeda
runDate: 2026-10-20
company:
  name: Andromeda
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Andromeda presents a two-sided GPU-compute platform that matches customer
    requirements with heterogeneous provider capacity and adds orchestration,
    billing, managed-cluster, and storage layers. Public evidence supports a
    credible operating model, but most maturity and performance proof is
    company- or supplier-issued, while product documentation, uptime history,
    security attestations, and independent benchmarks remain unavailable.
sections:
  - id: product-and-workflow
    title: Product surface and customer workflow
    body: >-
      Andromeda is not simply a directory of GPU inventory. Its public privacy
      policy describes a business-to-business marketplace in which customers
      submit GPU type, quantity, timing, and duration requirements while
      providers submit configuration, pricing, availability, networking, and
      storage data. Company-issued recruiting material adds sourcing,
      benchmarking, contracting, billing, and a single-invoice experience.
      Together, those disclosures indicate a commercial control plane spanning
      discovery through settlement. The customer-facing product appears to
      include capacity and pricing tables, usage and billing views, cluster and
      job dashboards, onboarding, documentation, and terminal-adjacent
      workflows, although a current public feature inventory or live
      documentation set was not available in the assigned evidence.
    claimRefs: [CE001, CE002, CE003, CE004, CE013, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: Architecture, deployment, and operating model
    body: >-
      The disclosed architecture separates the marketplace from an
      infrastructure control plane designed to abstract virtual machines,
      Kubernetes, bare metal, and schedulers. At the data layer, Andromeda uses
      WEKA NeuralMesh and its Kubernetes Operator for deployment and lifecycle
      management across heterogeneous providers. Supplier-originated reporting
      says the integration can use either dedicated storage or GPU-native Axon
      configurations and reports a roughly ten-minute bare-metal deployment
      path. This is a coherent portability strategy: normalize orchestration
      and storage above fragmented capacity. It also creates dependencies on
      provider configuration quality, WEKA software, and Andromeda's ability to
      certify and continuously operate unlike clusters to one service standard.
    claimRefs: [CE005, CE006, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity and differentiation
    body: >-
      Evidence of production use exists, but its provenance limits confidence.
      A WEKA-originated announcement carried by StorageReview says Andromeda
      operates across more than 50 providers, supports more than 100 customers,
      and has clusters sustaining more than 400 GB/s and six million IOPS; it
      also reports environment startup falling from about three minutes to 30
      seconds. These figures are useful indicators of scale and technical
      ambition, not independent benchmarks. The likely differentiation is the
      operating layer that combines market access, multi-provider abstraction,
      certification, and portable storage rather than a proprietary
      accelerator. Public recruiting signals also show core product design,
      customer-proof, and capacity-planning functions are still being built,
      consistent with a maturing rather than fully standardized platform.
    claimRefs: [CE007, CE008, CE010, CE011, CE014, CE015, CE016]
  - id: trust-reliability-and-roadmap
    title: Trust, reliability, and roadmap risk
    body: >-
      The privacy policy states that Andromeda uses access controls, encryption
      in transit and at rest, and ongoing monitoring, and that it offers a data
      processing agreement on request for GDPR or UK GDPR customers. Those are
      useful baseline commitments, but they are not substitutes for an
      independent security audit, named certification, penetration-test
      summary, incident history, or service-level performance record. The same
      policy confirms that the platform processes commercially sensitive
      workload, infrastructure, financial, billing, and technical data and may
      share data between marketplace counterparties as needed to transact.
      Before underwriting enterprise-grade maturity, diligence should therefore
      test tenant isolation, provider access boundaries, failover behavior,
      incident response, subprocessors, uptime, and the division of support
      responsibility among Andromeda, capacity providers, and WEKA.
    claimRefs: [CE004, CE006, CE012, CE013]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or product line
      - Primary user
      - Public maturity signal
      - Differentiation
      - Diligence gap
    rows:
      - - Compute marketplace
        - AI teams and infrastructure providers
        - Operating platform described in the current privacy policy
        - Two-sided requirements and inventory matching
        - Match rates, fill rates, and active inventory are not public
      - - Commercial control plane
        - Infrastructure buyers and finance or procurement teams
        - Sourcing, contracting, billing, and single-invoice workflow are company-described
        - Consolidates fragmented provider transactions
        - Current contract, pricing-index, and dispute workflows are not documented
      - - Managed GPU clusters
        - Model builders, research labs, and inference providers
        - Supplier announcement describes production deployments
        - Standardized cluster delivery across unlike providers
        - Independent availability, utilization, and benchmark evidence is missing
      - - Developer console and experience
        - Infrastructure and ML engineers
        - Capacity, usage, billing, cluster, and job surfaces appear in a founding-design role
        - One interface across supply sources
        - Public console, API, CLI, and documentation coverage is unavailable
      - - Capacity operations
        - Internal infrastructure operators and supply partners
        - Active roles cover matching, utilization, sourcing, onboarding, and planning
        - Combines commercial and technical supply decisions
        - Automation rate and exception-handling burden are undisclosed
    notes: >-
      Status is based on current policy text, supplier reporting, and
      company-issued recruiting material; it does not establish feature
      completeness or independently verified production maturity.
    claimRefs: [CE001, CE003, CE004, CE007, CE013, CE014, CE015]
  - id: TE002
    title: Workflow and use-case assessment
    columns:
      - User job
      - Current workflow signal
      - Andromeda solution
      - Measurable benefit
      - Limitation
    rows:
      - - Specify compute demand
        - Customer submits GPU type, quantity, start date, and duration
        - Marketplace matches requirements to provider capacity
        - No public fill-rate measure
        - Matching logic and acceptance criteria are not public
      - - Procure across providers
        - Buyers otherwise face fragmented sourcing and contracts
        - Sourcing, benchmarking, contracting, billing, and one invoice
        - No independently measured procurement-cycle reduction
        - Pricing-index methodology and realized savings are not public
      - - Run training or inference
        - Workloads must span varied infrastructure and schedulers
        - Control plane abstracts VMs, Kubernetes, bare metal, and schedulers
        - Supplier source reports startup falling from about three minutes to 30 seconds
        - Workload mix, denominator, and test method are not disclosed
      - - Standardize cluster storage
        - Provider-native storage performance varies
        - Dedicated NeuralMesh or GPU-native Axon configurations
        - Company reports about ten-minute Axon deployment from bare metal
        - Result is supplier-reported and depends on WEKA
    notes: >-
      Benefits are retained with their original attribution; null or unavailable
      metrics mean no qualifying public evidence was present in the assigned pool.
    claimRefs: [CE003, CE005, CE006, CE009, CE011, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Key dependency
      - Principal risk
    rows:
      - - Marketplace and transaction layer
        - Captures demand, inventory, pricing, and billing information
        - Accurate counterparty and capacity data
        - Stale inventory or mismatched requirements
      - - Orchestration control plane
        - Provisions and manages heterogeneous infrastructure
        - APIs, automation, Kubernetes, VMs, bare metal, and schedulers
        - Abstraction leaks and provider-specific exceptions
      - - Compute execution
        - Runs training and inference on provider clusters
        - Provider GPU, networking, and scheduler quality
        - Performance and availability variation
      - - Storage and data plane
        - Normalizes shared storage and metadata behavior
        - WEKA NeuralMesh, Axon, NVMe, and Kubernetes Operator
        - Supplier concentration and storage bottlenecks
      - - Trust and operations
        - Certification, monitoring, support, and data handling
        - Provider controls, access boundaries, and incident response
        - No public audit, uptime history, or certification evidence
    notes: >-
      This is an evidence-bounded operating model, not a claim that every listed
      component is proprietary, generally available, or deployed for every customer.
    claimRefs: [CE003, CE004, CE005, CE006, CE008, CE009, CE012, CE013]
figures:
  - id: FE001
    title: Product architecture and dependency stack
    type: stack
    summary: >-
      The product layers marketplace and workflow software over heterogeneous
      compute, with a supplier-dependent storage plane and shared operational controls.
    data:
      layers:
        - label: Commercial marketplace
          items:
            - Demand requirements
            - Provider inventory
            - Sourcing, contracts, and billing
          detail: Matches buyers and providers and coordinates the transaction.
        - label: Customer experience
          items:
            - Capacity and pricing views
            - Usage and billing views
            - Cluster and job dashboards
          detail: Developer-facing surfaces are described in recruiting material.
        - label: Orchestration control plane
          items:
            - APIs and services
            - Provisioning and lifecycle management
            - VM, Kubernetes, bare-metal, and scheduler abstraction
          detail: Public engineering scope indicates the intended control-plane boundary.
        - label: Compute execution
          items:
            - Training workloads
            - Inference workloads
            - Multi-provider GPU clusters
          detail: Execution quality remains dependent on underlying provider infrastructure.
        - label: Storage and data
          items:
            - WEKA NeuralMesh
            - NeuralMesh Axon
            - Provider NVMe and dedicated storage
          detail: The storage layer is portable but creates a material supplier dependency.
        - label: Trust and operations
          items:
            - Cluster certification
            - Monitoring and access controls
            - Support and capacity operations
          detail: Independent assurance and service-level history are not public.
    approximationNotes: >-
      Layer ordering is analytical and does not represent packet flow, ownership,
      or a complete bill of materials.
    claimRefs: [CE001, CE005, CE006, CE012, CE014, CE015]
callouts:
  - calloutType: insight
    title: Differentiation is operational normalization
    body: >-
      The strongest disclosed product thesis is not exclusive GPU ownership but
      a control and data layer that makes fragmented providers easier to buy,
      operate, and support through one workflow.
    claimRefs: [CE001, CE005, CE006, CE013]
  - calloutType: risk
    title: Production claims lack independent verification
    body: >-
      Throughput, IOPS, deployment speed, customer scale, and environment-start
      improvements all trace to company or supplier-originated material rather
      than a customer-controlled test or independent benchmark.
    claimRefs: [CE007, CE009, CE010, CE011]
