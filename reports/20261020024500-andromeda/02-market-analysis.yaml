artifact: market-analysis
slug: andromeda
runDate: 2026-10-20
company:
  name: Andromeda
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Andromeda addresses the external GPU-capacity market through a two-sided
    compute marketplace and an operating layer for training and inference.
    The retained evidence identifies plausible buyers and supply partners but
    does not support a numerical TAM, SAM, SOM, CAGR, or adoption forecast.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The narrowest supportable market boundary is externally sourced GPU
      compute for AI training and inference, coupled with tooling to buy, sell,
      route, and operate that capacity. Andromeda's company-authored recruiting
      copy places the platform between model builders and a fragmented supply
      base of hyperscalers, neoclouds, and independent data centers. Product
      descriptions add orchestration through Slurm, Kubernetes, or SSH plus
      storage and operational support. That boundary excludes general-purpose
      cloud spend, owned private clusters, chips sold directly by OEMs, and
      capital deployed into data centers unless Andromeda intermediates the
      resulting capacity. The status-quo substitutes are single-provider cloud
      procurement, direct provider contracts, internal infrastructure teams,
      and bespoke brokered deals; the assigned evidence does not quantify their
      relative shares.
    claimRefs: [CM001, CM002, CM003, CM008, CM009]
    tableRefs: [TM001]
  - id: sizing-discipline
    title: Evidence-constrained sizing
    body: >-
      No retained source provides an independently constructed market total,
      growth rate, geographic split, or denominator from which a defensible TAM,
      SAM, or SOM can be calculated. Company-authored job copy says that
      "trillions of dollars of compute" could flow through Andromeda in five
      years, but it is an aspiration about platform throughput rather than a
      measured market forecast. It must not be treated as revenue, GMV, SAM, or
      available spend. A credible sizing model would separately estimate
      accelerator capacity available from third parties, workloads willing to
      use external supply, Andromeda-compatible regions and hardware, and the
      platform's achievable take rate. None of those denominators is present in
      the assigned pool, so this chapter presents sizing layers without numeric
      scale.
    claimRefs: [CM012, CM013, CM015, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The evidence points to technical infrastructure leaders as the primary
      users and evaluators, while founders, commercial leaders, or enterprise
      budget owners likely approve spend. Andromeda's sales posting targets
      frontier labs, AI-native startups, and enterprises whose requirements
      have outgrown one provider's fleet. It describes a consultative sales
      cycle spanning architecture discussions, technical validation, commercial
      negotiation, and parallel engagement of technical, commercial, and
      executive stakeholders. On the supply side, GPU cluster providers are
      counterparties that need demand, utilization, and potentially financing,
      rather than end users of compute. VC funds and accelerators are described
      as channels into portfolio-company demand. These roles support a
      marketplace adoption path, but the evidence supplies no conversion rates,
      sales-cycle length, contract duration, retention, or budget data.
    claimRefs: [CM004, CM005, CM006, CM007, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-constraints-and-diligence
    title: Drivers, constraints, and valuation relevance
    body: >-
      The central demand driver is the company's thesis that AI workloads will
      require more reliable high-performance compute than a small number of
      vertically integrated providers can supply. The matching supply driver is
      fragmented GPU capacity seeking customers and utilization. Those are
      company claims, not independent market validation. Adoption still depends
      on technical compatibility, capacity reliability, price transparency,
      workload portability, security, data-transfer economics, procurement
      approval, and confidence that a marketplace can manage provider and
      operational risk. The assigned evidence does not measure any of those
      constraints or compare marketplace economics with direct cloud contracts.
      Valuation therefore cannot be anchored to broad AI-infrastructure growth
      alone; diligence needs verified transaction volume, take rate, gross
      margin, repeat usage, concentration, and supply utilization before a
      market-share or revenue-multiple argument is credible.
    claimRefs: [CM002, CM003, CM007, CM013, CM015]
