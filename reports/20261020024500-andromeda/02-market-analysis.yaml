figures:
  - id: FM001
    title: Evidence-constrained addressability layers
    type: pyramid
    summary: >-
      Conceptual narrowing from broad AI-compute demand to Andromeda's
      obtainable transactions, with every numerical layer still unverified.
    data:
      items:
        - label: Global AI-compute demand
          value: Unquantified
          detail: Broad demand cannot be used as TAM without an independent spend denominator.
        - label: Accelerator workloads
          value: Unquantified
          detail: Training and inference workloads that require GPU capacity.
        - label: Externally sourced capacity
          value: Unquantified
          detail: Excludes workloads served entirely by owned or directly contracted fleets.
        - label: Multi-provider-compatible workloads
          value: Unquantified
          detail: Requires portability, acceptable security, and compatible orchestration.
        - label: Andromeda serviceable demand
          value: Unquantified
          detail: Requires supported hardware, regions, commercial terms, and available supply.
        - label: Obtainable platform transactions
          value: Unquantified
          detail: Requires verified pipeline conversion, retention, take rate, and utilization.
    approximationNotes: >-
      The layers express inclusion logic only; widths, order, and the repeated
      "Unquantified" labels do not represent magnitude, conversion, or market share.
    claimRefs: [CM001, CM012, CM015]
callouts:
  - calloutType: risk
    title: Market size is a gating diligence gap
    body: >-
      The prefetched source set supports a market mechanism and buyer hypothesis,
      but not a numerical market size or adoption curve. Do not capitalize the
      company's "trillions" aspiration as TAM or transaction volume.
    claimRefs: [CM012, CM015, CM016]
