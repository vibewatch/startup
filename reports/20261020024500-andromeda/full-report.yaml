chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Andromeda presents itself as a two-sided market and infrastructure platform through which AI teams can buy
              and operate GPU capacity while infrastructure owners can sell capacity. Its official site says the
              platform sources, benchmarks, and prices compute across more than 100 providers, then standardizes
              contracts, service levels, invoicing, support, and observability; it also claims more than 1,000 completed
              transactions. Those are company-reported activity indicators rather than audited customer or revenue
              measures. Independent reporting traces the operation to a 2023 NFDG compute project, but the legal
              incorporation date remains unverified. A San Francisco office is reported, while a precise legal
              headquarters address is supported only by a low-reputation aggregator and should not be treated as
              confirmed.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, founders, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Nat Friedman and Daniel Gross originated the project, and Gross recruited Wil Moushey to run it in late
              2023. Moushey is the visible operating leader and chief executive: reporting attributes the spinout,
              commercial model, scale targets, and market-making thesis directly to him. Friedman and Gross later joined
              Meta and, according to Upstarts, no longer have an active relationship with Andromeda. That transition
              reduces direct founder involvement but increases dependence on Moushey, especially because no public board
              roster, succession plan, or broader executive bench was found in the assigned evidence. A company-issued
              recruitment post for a founding marketing leader says the narrative, launch, customer-proof, and
              feedback-loop functions are still being built from scratch, signaling an early organizational layer
              despite reported revenue scale.
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO013
      - number: '1.3'
        title: Capital, reported scale, and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              Upstarts reported that Andromeda became a standalone company backed by NFDG and Paradigm, with Paradigm's
              total investment reaching $60 million at a $1.5 billion valuation in March 2026. The same report says 2025
              revenue run rate exceeded $100 million, up from more than $50 million in 2024, and says the company had
              operated profitably since its start. Revenue run rate is not ARR, and reported profitability is not
              evidence of cash generation. A separate aggregator labels $160 million as total funding across a $100
              million seed and $60 million Series A, but Upstarts describes NFDG's earlier amount as an upfront
              commitment associated with a GPU stockpile rather than clearly disclosed equity financing. Total raised,
              dilution, liquidity, debt, and available cash therefore remain unresolved rather than safely collapsing
              into one headline number.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
              - CO015
