              - CO008
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The operating sequence is unusually compressed: an NFDG-backed capacity project in 2023, Moushey's
              recruitment that November, a reported stockpile above 4,000 GPUs by early 2024, revenue-run-rate expansion
              through 2025, and a standalone financing at a unicorn valuation in March 2026. By that financing report, a
              roughly 20-person company managed tens of thousands of GPUs and targeted as many as 100,000 during 2026.
              The resulting scale per employee could reflect a capital-light brokerage model, but it also concentrates
              execution, counterparty, and service risk. One customer told Upstarts that larger buyers may eventually
              internalize cluster capabilities, while the article noted that a durable marketplace requires enough
              buyers and sellers. No assigned source established the absence of lawsuits, outages, sanctions, or other
              incidents; the adverse search returning no retained result is a diligence gap, not exculpatory evidence.
            claimRefs:
