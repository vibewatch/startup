              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI007
              - CI012
              - CI016
      - number: '4.2'
        title: Go-to-market and delivery economics
        blocks:
          - type: paragraph
            body: >-
              Current hiring materials point to a relationship-led, technically intensive sales motion. An
              account-executive posting asks candidates to bring an existing network, own the full cycle through
              technical validation and negotiation, and sell to AI-native buyers whose needs may exceed one provider's
              fleet. Partnership hiring adds provider distribution and venture-portfolio channels, while an
              infrastructure role is charged with matching demand to capacity, increasing utilization, onboarding
              suppliers, and negotiating supplier cost. This suggests that sales efficiency depends on deal sourcing,
              technical evaluation, and capacity matching rather than low-touch self-service alone. Public materials
              provide no sales-cycle duration, quota attainment, CAC, payback, provider take rate, support cost, or
              utilization history, so the cost to produce each dollar of reported run rate remains unquantified.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI010
              - CI011
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and margin path
        blocks:
          - type: paragraph
            body: >-
              Reporting places the latest financing at a $1.5 billion valuation, but SiliconANGLE says the round's exact
              dollar amount was unclear. That prevents a reliable bridge from funding headlines to cash currently
              available. The retained public sources do not disclose cash on hand, burn, runway, debt, guarantees,
              working-capital exposure, or contractual commitments to providers. The operating model could be relatively
              asset-light when capacity is brokered, yet job materials also emphasize supplier negotiation, utilization,
              reliability, and operational complexity, all of which can create margin and working-capital risk. A
              low-reputation market profile additionally lists a compute-for-equity program, but no contract terms were
              available, so that item is a diligence lead rather than an underwritten revenue stream.
            claimRefs:
              - CI003
              - CI004
              - CI012
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports demand and transaction activity, but not revenue quality. A doubling of
              reported annualized run rate and reported profitability are positive signals; more than 100 providers and
              more than 1,000 transactions also indicate that the platform has moved beyond a single-cluster experiment.
              However, none of those facts establishes gross margin, recurring retention, cash conversion, or resilience
              to GPU-price compression. The central underwriting question is whether Andromeda earns a durable spread
              for aggregation and operations without assuming inventory, credit, uptime, or minimum-purchase obligations
              that consume the apparent margin. Investment-grade diligence requires a recognized-revenue bridge,
              transaction-level take rates and contribution margins, concentration schedules, provider commitments, and
              a current liquidity and debt schedule.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI012
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline run rate does not resolve cash economics
            body: >-
              The reported $100 million annualized revenue run rate and profitability claim remain insufficient for
              underwriting until management provides recognized revenue, gross margin, working-capital, debt, and
              cash-conversion evidence.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Andromeda is not simply a directory of GPU inventory. Its public privacy policy describes a
              business-to-business marketplace in which customers submit GPU type, quantity, timing, and duration
              requirements while providers submit configuration, pricing, availability, networking, and storage data.
              Company-issued recruiting material adds sourcing, benchmarking, contracting, billing, and a single-invoice
              experience. Together, those disclosures indicate a commercial control plane spanning discovery through
              settlement. The customer-facing product appears to include capacity and pricing tables, usage and billing
              views, cluster and job dashboards, onboarding, documentation, and terminal-adjacent workflows, although a
              current public feature inventory or live documentation set was not available in the assigned evidence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE007
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
