  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The narrowest supportable market boundary is externally sourced GPU compute for AI training and inference,
              coupled with tooling to buy, sell, route, and operate that capacity. Andromeda's company-authored
              recruiting copy places the platform between model builders and a fragmented supply base of hyperscalers,
              neoclouds, and independent data centers. Product descriptions add orchestration through Slurm, Kubernetes,
              or SSH plus storage and operational support. That boundary excludes general-purpose cloud spend, owned
              private clusters, chips sold directly by OEMs, and capital deployed into data centers unless Andromeda
              intermediates the resulting capacity. The status-quo substitutes are single-provider cloud procurement,
              direct provider contracts, internal infrastructure teams, and bespoke brokered deals; the assigned
              evidence does not quantify their relative shares.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source provides an independently constructed market total, growth rate, geographic split, or
              denominator from which a defensible TAM, SAM, or SOM can be calculated. Company-authored job copy says
              that "trillions of dollars of compute" could flow through Andromeda in five years, but it is an aspiration
              about platform throughput rather than a measured market forecast. It must not be treated as revenue, GMV,
              SAM, or available spend. A credible sizing model would separately estimate accelerator capacity available
              from third parties, workloads willing to use external supply, Andromeda-compatible regions and hardware,
              and the platform's achievable take rate. None of those denominators is present in the assigned pool, so
              this chapter presents sizing layers without numeric scale.
            claimRefs:
              - CM012
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM012
              - CM013
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM012
              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to technical infrastructure leaders as the primary users and evaluators, while
              founders, commercial leaders, or enterprise budget owners likely approve spend. Andromeda's sales posting
              targets frontier labs, AI-native startups, and enterprises whose requirements have outgrown one provider's
              fleet. It describes a consultative sales cycle spanning architecture discussions, technical validation,
              commercial negotiation, and parallel engagement of technical, commercial, and executive stakeholders. On
              the supply side, GPU cluster providers are counterparties that need demand, utilization, and potentially
              financing, rather than end users of compute. VC funds and accelerators are described as channels into
              portfolio-company demand. These roles support a marketplace adoption path, but the evidence supplies no
              conversion rates, sales-cycle length, contract duration, retention, or budget data.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The central demand driver is the company's thesis that AI workloads will require more reliable
              high-performance compute than a small number of vertically integrated providers can supply. The matching
              supply driver is fragmented GPU capacity seeking customers and utilization. Those are company claims, not
              independent market validation. Adoption still depends on technical compatibility, capacity reliability,
              price transparency, workload portability, security, data-transfer economics, procurement approval, and
              confidence that a marketplace can manage provider and operational risk. The assigned evidence does not
              measure any of those constraints or compare marketplace economics with direct cloud contracts. Valuation
              therefore cannot be anchored to broad AI-infrastructure growth alone; diligence needs verified transaction
              volume, take rate, gross margin, repeat usage, concentration, and supply utilization before a market-share
              or revenue-multiple argument is credible.
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size is a gating diligence gap
            body: >-
              The prefetched source set supports a market mechanism and buyer hypothesis, but not a numerical market
              size or adoption curve. Do not capitalize the company's "trillions" aspiration as TAM or transaction
              volume.
            calloutType: risk
            claimRefs:
              - CM012
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive boundary is wider than GPU brokers. Tracxn lists 340 active competitors for
              Andromeda and names CoreWeave, Together AI, FluidStack, Crusoe, Aethir, exaBITS, Yotta, and Neysa among
              the ranked set, showing that a buyer can choose direct GPU clouds, distributed supply networks, broader AI
              platforms, or general cloud providers rather than a broker. CompuX adds a financing-led alternative at the
              API layer, while hyperscalers and internal procurement remain substitutes for teams willing to accept
              one-provider exposure or operate their own vendor portfolio. Andromeda's company-issued sales posting
              targets frontier labs, AI-native startups, and enterprises whose demand exceeds a single provider's fleet,
              narrowing the most plausible buyer wedge to sophisticated, capacity-constrained teams rather than the full
              cloud market.
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Capability, pricing, and delivery model
        blocks:
          - type: paragraph
            body: >-
              Retained evidence places Andromeda at the procurement and operations layer. Its own recruiting material
              describes a platform to buy, sell, and operate compute, with a console where teams find, buy, and run
              capacity across global supply. Tracxn reports access through Slurm, Kubernetes, or SSH, plus storage,
              DevOps support, service-level agreements, and a third-party GPU marketplace. A competitor comparison adds
              claims of more than 100 providers, one contract, one invoice, a single SLA, provider certification, and a
              live pricing index; these details are useful directional evidence but are not independent verification.
              CompuX instead combines financing with OpenAI-compatible routing. Public list prices, realized discounts,
              contract minimums, SLA remedies, and like-for-like benchmark results remain unavailable, so the chapter
              does not claim a verified cost or performance lead.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP013
      - number: '3.3'
        title: Distribution, switching, and control points
        blocks:
          - type: paragraph
            body: >-
              Andromeda's distribution thesis depends on aggregating fragmented provider supply and reaching buyers
              through direct enterprise sales and ecosystem partnerships. Current recruiting evidence shows both motions
              are still being built: an account executive is expected to bring an existing network and convert it into
              pipeline, while a new partnerships leader is expected to create the lifecycle across GPU providers, AI
              labs, OEMs, venture funds, and accelerators. That can produce two-sided liquidity, but it also gives
              providers and channel partners bargaining power until demand concentration and repeat usage are
              demonstrated. Switching costs appear more likely to arise from contracting, workflow integration, support,
              and operational familiarity than from proprietary hardware. The retained pool has no customer-level
              evidence on multi-homing, renewal, migration effort, provider concentration, or SLA performance,
              preventing a stronger lock-in conclusion.
            claimRefs:
              - CP002
              - CP010
              - CP012
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The potential moat is market liquidity plus operational standardization: more supply can improve
              availability and price discovery, while more buyer demand can improve provider utilization. The risk is
              that these benefits are contestable. Direct GPU clouds and hyperscalers control more of the physical fleet
              and runtime stack, financing-led aggregators can bundle capital with access, and internal procurement can
              replicate multi-vendor sourcing for the largest buyers. Company hiring language also says customer proof,
              win-loss analysis, competitive intelligence, and partnership playbooks are being established rather than
              already institutionalized. The resulting positioning is credible but not yet proven durable: Andromeda may
              win on breadth and procurement simplicity, yet the evidence does not establish exclusive supply,
              proprietary performance advantages, verified savings, or high switching costs.
            claimRefs:
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is conditional on liquidity and execution
            body: >-
              Aggregation can improve choice and utilization, but the assigned evidence does not prove exclusive supply,
              provider performance, verified savings, or customer lock-in.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Andromeda appears to monetize access to fragmented GPU supply rather than sell a conventional software
              subscription. The public proposition combines on-demand capacity, provider vetting, multi-provider
              procurement, consolidated billing, and pricing intelligence. SiliconANGLE reported that customers can
              avoid long-term contracts, while a separate job-directory profile describes flexible usage with no minimum
              duration and no ingress or egress fees. Those terms describe customer packaging, not realized pricing or
              recognized revenue. The strongest traction evidence is third-party reporting that annualized revenue run
              rate increased from $50 million in 2024 to $100 million in 2025 and that the business has been profitable
              since launch. Neither metric is audited in the retained evidence, and revenue run rate must not be treated
              as ARR or cash generation.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
