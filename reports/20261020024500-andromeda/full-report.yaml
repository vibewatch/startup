      - CO002
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO014
      - CO015
  - id: FM001
    title: Evidence-constrained addressability layers
    type: pyramid
    summary: >-
      Conceptual narrowing from broad AI-compute demand to Andromeda's obtainable transactions, with every numerical
      layer still unverified.
    data:
      items:
        - label: Global AI-compute demand
          value: Unquantified
          detail: Broad demand cannot be used as TAM without an independent spend denominator.
        - label: Accelerator workloads
          value: Unquantified
          detail: Training and inference workloads that require GPU capacity.
        - label: Externally sourced capacity
          value: Unquantified
          detail: Excludes workloads served entirely by owned or directly contracted fleets.
        - label: Multi-provider-compatible workloads
          value: Unquantified
          detail: Requires portability, acceptable security, and compatible orchestration.
        - label: Andromeda serviceable demand
          value: Unquantified
          detail: Requires supported hardware, regions, commercial terms, and available supply.
        - label: Obtainable platform transactions
          value: Unquantified
          detail: Requires verified pipeline conversion, retention, take rate, and utilization.
    approximationNotes: >-
      The layers express inclusion logic only; widths, order, and the repeated "Unquantified" labels do not represent
      magnitude, conversion, or market share.
    claimRefs:
      - CM001
      - CM012
      - CM015
  - id: FP001
    title: 'Ordinal positioning: procurement breadth versus runtime integration'
    type: quadrant
    summary: >-
      Evidence-backed ordinal placement separates procurement aggregators from financing, direct-cloud, and broader
      AI-platform alternatives without implying performance rankings.
    data:
      xAxis:
        label: Procurement-layer breadth (1=single/direct, 5=multi-provider aggregation)
        min: 1
        max: 5
      yAxis:
        label: Runtime/service integration (1=transactional access, 5=integrated platform)
        min: 1
        max: 5
      points:
        - label: Andromeda
          x: 5
          'y': 3
          detail: Broad procurement and operating layer; runtime depth and outcomes are not independently benchmarked.
        - label: CompuX
          x: 4
          'y': 4
          detail: Multi-provider API access plus financing, based on competitor-issued descriptions.
        - label: CoreWeave
          x: 2
          'y': 5
          detail: Direct GPU-first cloud with greater stack control but less marketplace breadth.
        - label: FluidStack
          x: 2
          'y': 4
          detail: Direct GPU infrastructure alternative with limited comparative detail in the retained pool.
        - label: Together AI
          x: 2
          'y': 5
          detail: Broader model development and deployment platform, not a pure procurement broker.
        - label: Internal multi-vendor procurement
          x: 4
          'y': 2
          detail: Buyer-managed vendor breadth with internal integration and operational burden.
    approximationNotes: >-
      Analyst ordinal scores from 1 to 5, not measured benchmarks. Placement uses retained descriptions of workflow
      scope and service integration; unknowns are conservatively scored and positions must not be read as market share,
      quality, or price rankings.
    claimRefs:
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: Operating path from fragmented GPU supply to transaction economics
    type: flow
    summary: >-
      The public operating model connects provider sourcing and validation to buyer procurement, while the fee spread
      and resulting gross profit remain undisclosed.
    data:
      nodes:
        - id: providers
          label: Fragmented GPU providers
          detail: More than 100 providers were reported on the platform.
        - id: sourcing
          label: Supplier sourcing and negotiation
          detail: Infrastructure staff match demand, onboard suppliers, and negotiate cost.
        - id: validation
          label: Performance and security vetting
          detail: Provider hardware and supporting infrastructure are checked before listing.
        - id: matching
          label: Capacity matching
          detail: Training and inference demand is routed across available supply.
        - id: billing
          label: Consolidated customer billing
          detail: Purchases from multiple providers can be combined into one invoice.
        - id: economics
          label: Undisclosed transaction spread
          detail: Take rate, contribution margin, payment timing, and loss exposure are unavailable.
      edges:
        - from: providers
          to: sourcing
          label: onboard
        - from: sourcing
          to: validation
          label: qualify
        - from: validation
          to: matching
          label: make available
        - from: matching
          to: billing
          label: transact
        - from: billing
          to: economics
          label: recognize and collect
    approximationNotes: >-
      Conceptual operating sequence based on retained public sources; it is not a quantified waterfall and does not
      imply disclosed conversion rates or margins.
    claimRefs:
      - CI006
      - CI007
      - CI012
      - CI016
  - id: FE001
    title: Product architecture and dependency stack
    type: stack
    summary: >-
      The product layers marketplace and workflow software over heterogeneous compute, with a supplier-dependent storage
      plane and shared operational controls.
    data:
      layers:
        - label: Commercial marketplace
          items:
            - Demand requirements
            - Provider inventory
            - Sourcing, contracts, and billing
          detail: Matches buyers and providers and coordinates the transaction.
        - label: Customer experience
          items:
            - Capacity and pricing views
            - Usage and billing views
            - Cluster and job dashboards
          detail: Developer-facing surfaces are described in recruiting material.
        - label: Orchestration control plane
          items:
            - APIs and services
            - Provisioning and lifecycle management
            - VM, Kubernetes, bare-metal, and scheduler abstraction
          detail: Public engineering scope indicates the intended control-plane boundary.
        - label: Compute execution
          items:
            - Training workloads
            - Inference workloads
            - Multi-provider GPU clusters
          detail: Execution quality remains dependent on underlying provider infrastructure.
        - label: Storage and data
          items:
            - WEKA NeuralMesh
            - NeuralMesh Axon
            - Provider NVMe and dedicated storage
          detail: The storage layer is portable but creates a material supplier dependency.
        - label: Trust and operations
          items:
            - Cluster certification
            - Monitoring and access controls
            - Support and capacity operations
          detail: Independent assurance and service-level history are not public.
    approximationNotes: Layer ordering is analytical and does not represent packet flow, ownership, or a complete bill of materials.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE012
      - CE014
      - CE015
  - id: FU001
    title: Disclosed customer journey and expansion loop
    type: journey-map
    summary: >-
      The public motion moves from urgent capacity need through technical validation and managed operation, then seeks
      expansion through customer relationships and supply partnerships.
    data:
      nodes:
        - id: capacity-trigger
          label: Capacity trigger
          title: Capacity trigger
          detail: AI-native teams outgrow a single provider or need high-performance compute quickly.
          touchpoints:
            - Founder
            - Infrastructure lead
            - ML team
        - id: commercial-discovery
          label: Commercial discovery
          title: Commercial discovery
          detail: Relationship-led sales identifies workload timing, architecture, capacity, and commercial requirements.
          touchpoints:
            - Account executive
            - Technical buyer
            - Executive sponsor
        - id: supply-match
          label: Supply match
          title: Supply match
          detail: Andromeda matches demand with internal and external capacity across its provider network.
          touchpoints:
            - Infrastructure team
            - Provider network
            - Capacity planning
        - id: technical-validation
          label: Technical validation
          title: Technical validation
          detail: Cluster, storage, network, and workload requirements are evaluated before deployment.
          touchpoints:
            - Solutions engineering
            - Provider
            - Customer engineering
        - id: managed-operation
          label: Managed operation
          title: Managed operation
          detail: Training or inference workloads run through managed clusters with operational support.
          touchpoints:
            - Console
            - Cluster operations
            - Support
        - id: expansion-loop
          label: Expansion loop
          title: Expansion loop
          detail: Customer relationships and distribution partnerships can add demand while provider partnerships add supply.
          touchpoints:
            - Reference proof
            - VC and accelerator channels
            - GPU providers
    approximationNotes: >-
      Conceptual sequence based on disclosed sales, matching, validation, and partnership surfaces; no stage conversion,
      duration, or expansion-rate data are public.
    claimRefs:
      - CU004
      - CU006
      - CU008
      - CU013
      - CU014
      - CU016
  - id: FR001
    title: Public-evidence residual risk heatmap
    type: matrix
    summary: >-
      Six risk families ranked from the assigned public evidence; mitigation maturity remains unverified where controls
      or performance records were not disclosed.
    data:
      columns:
        - label: Likelihood
          detail: Directional analyst assessment from the assigned evidence.
        - label: Impact
          detail: Potential effect on service continuity, compliance, or investment value.
        - label: Mitigation maturity
          detail: Publicly evidenced maturity, not management-reported private controls.
        - label: Residual severity
          detail: Exposure remaining before transaction diligence.
      rows:
        - label: Tenant isolation
          note: Light namespace isolation is reported by ClusterMAX.
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: Provider and SLA variance
          note: Multi-provider brokerage broadens the upstream control surface.
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: Network scaling execution
          note: A 100,000-GPU ambition is reported without public operating-control metrics.
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: Founder-ecosystem continuity
          note: Third-party review questions continuity after founders joined Meta.
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: Go-to-market system maturity
          note: Company-issued postings say core sales and marketing systems are being built.
          values:
            - value: Medium
            - value: Medium
            - value: Early
            - value: Medium
        - label: Cap table and economics transparency
          note: Ownership, margin, cash, concentration, and contractual obligations remain private.
          values:
            - value: Present
            - value: High
            - value: Unverified
            - value: High
    approximationNotes: >-
      Qualitative categories are analytical judgments, not probabilities or source-authored scores. "Present" denotes an
      observed disclosure gap rather than an event likelihood.
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR006
      - CR010
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The financing mark and reported scale are filtered through evidence quality and execution readiness before
      producing a track recommendation.
    data:
      nodes:
        - id: financing-mark
          label: $1.5B reported post-money mark
          detail: $60M Paradigm-led Series A is reported by multiple secondary sources.
        - id: operating-signal
          label: '>$100M reported annualized revenue run rate'
          detail: A run-rate claim is not audited revenue, ARR, margin, or cash flow.
        - id: headline-multiple
          label: <=15x headline run-rate multiple
          detail: Derived from the valuation divided by the reported $100M lower bound.
        - id: market-proof
          label: Marketplace activity signal
          detail: Company and secondary accounts describe broad cluster, provider, and transaction activity.
        - id: evidence-filter
          label: Material diligence gaps
          detail: Economics, concentration, ownership terms, and comparable multiples remain unavailable.
        - id: recommendation
          label: Track; high risk; stretched
          detail: Re-price only after primary financial, customer, and cap-table diligence.
    approximationNotes: Qualitative decision sequence only; node order does not assign probability or establish a valuation model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV012
      - CV016
