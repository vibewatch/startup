    columns:
      - Case
      - Assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Reported marketplace scale converts into audited net revenue, strong gross margin, diversified counterparties,
          and positive cash conversion.
        - >-
          The current mark could be supported by durable growth and a credible strategic or public-market comparable
          set; no range is assigned yet.
        - Execution across provider quality, customer retention, and capital structure.
        - Audited cohorts, repeat purchases, low concentration, and cash generation would increase probability.
      - - Base
        - >-
          Reported activity is directionally real, but margin, retention, concentration, and ownership terms remain
          unverified.
        - The $1.5B mark stays ahead of evidence quality; require price protection or wait for primary diligence.
        - Multiple compression and slower conversion of activity into recognized revenue.
        - A clean revenue bridge with only moderate economics would keep this as track.
      - - Bear
        - >-
          Revenue quality weakens, counterparties are concentrated, cash conversion is negative, or preference and debt
          terms absorb upside.
        - Down-round or impaired-return risk dominates; do not underwrite from the headline run rate.
        - Financing overhang, commercial immaturity, provider reliability, and weak exit readiness.
        - Revenue reclassification, churn, concentration, or punitive terms would trigger a pass.
    notes: >-
      These are qualitative underwriting states, not probability-weighted forecasts. Public evidence does not support
      precise valuation ranges, return targets, hold periods, or exit values.
    claimRefs:
      - CV002
      - CV003
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The evidence shows rapid progression from an investor-sponsored compute project to a standalone, high-valuation
      marketplace, with financing form and governance still unresolved.
    data:
      items:
        - date: 2023-06
          label: NFDG commitment reported
          details: >-
            An aggregator labels $100M as seed funding, while Upstarts describes more than $100M committed upfront to
            the project; the legal financing form is unresolved.
          tone: warning
          claimRefs:
            - CO014
            - CO015
        - date: 2023-11
          label: Moushey recruited to operate Andromeda
          details: Daniel Gross recruited Wil Moushey to take over the investor-sponsored compute project.
          tone: neutral
          claimRefs:
            - CO004
        - date: 2024-early
          label: GPU stockpile exceeded 4,000
          details: Upstarts reported that the NFDG-backed project had accumulated more than 4,000 GPUs by early 2024.
          tone: positive
          claimRefs:
            - CO005
        - date: '2024'
          label: Revenue run rate exceeded $50M
          details: Upstarts later reported a 2024 revenue run rate above $50M; this is not ARR or audited revenue.
          tone: positive
          claimRefs:
            - CO009
        - date: '2025'
          label: Revenue run rate passed $100M
          details: >-
            Independent reporting said the 2025 revenue run rate passed $100M and the company had operated profitably
            since inception.
          tone: positive
          claimRefs:
            - CO009
            - CO010
        - date: '2025'
          label: Originating founders stepped back
          details: Friedman and Gross joined Meta and were reported to have no active relationship with Andromeda.
          tone: warning
          claimRefs:
            - CO006
        - date: '2026-03-18'
          label: Standalone financing at $1.5B valuation
          details: >-
            Upstarts reported a Paradigm-backed standalone company, $60M of total Paradigm investment, and a $1.5B
            valuation.
          tone: positive
          claimRefs:
            - CO007
            - CO008
        - date: '2026-10-20'
          label: Marketplace scale disclosed
          details: The official site claimed 100+ compute providers and 1,000+ completed transactions as of the access date.
          tone: neutral
          claimRefs:
            - CO002
    approximationNotes: >-
      Dates and periods follow source precision; access-date snapshots are not represented as event dates, and reported
      run rate is not converted to ARR.
