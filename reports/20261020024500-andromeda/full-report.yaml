              - CE006
              - CE009
              - CE011
              - CE013
      - number: '5.2'
        title: Architecture, deployment, and operating model
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture separates the marketplace from an infrastructure control plane designed to
              abstract virtual machines, Kubernetes, bare metal, and schedulers. At the data layer, Andromeda uses WEKA
              NeuralMesh and its Kubernetes Operator for deployment and lifecycle management across heterogeneous
              providers. Supplier-originated reporting says the integration can use either dedicated storage or
              GPU-native Axon configurations and reports a roughly ten-minute bare-metal deployment path. This is a
              coherent portability strategy: normalize orchestration and storage above fragmented capacity. It also
              creates dependencies on provider configuration quality, WEKA software, and Andromeda's ability to certify
              and continuously operate unlike clusters to one service standard.
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE012
              - CE014
              - CE015
      - number: '5.3'
        title: Maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              Evidence of production use exists, but its provenance limits confidence. A WEKA-originated announcement
              carried by StorageReview says Andromeda operates across more than 50 providers, supports more than 100
              customers, and has clusters sustaining more than 400 GB/s and six million IOPS; it also reports
              environment startup falling from about three minutes to 30 seconds. These figures are useful indicators of
              scale and technical ambition, not independent benchmarks. The likely differentiation is the operating
              layer that combines market access, multi-provider abstraction, certification, and portable storage rather
              than a proprietary accelerator. Public recruiting signals also show core product design, customer-proof,
              and capacity-planning functions are still being built, consistent with a maturing rather than fully
              standardized platform.
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              The privacy policy states that Andromeda uses access controls, encryption in transit and at rest, and
              ongoing monitoring, and that it offers a data processing agreement on request for GDPR or UK GDPR
              customers. Those are useful baseline commitments, but they are not substitutes for an independent security
              audit, named certification, penetration-test summary, incident history, or service-level performance
              record. The same policy confirms that the platform processes commercially sensitive workload,
              infrastructure, financial, billing, and technical data and may share data between marketplace
              counterparties as needed to transact. Before underwriting enterprise-grade maturity, diligence should
              therefore test tenant isolation, provider access boundaries, failover behavior, incident response,
              subprocessors, uptime, and the division of support responsibility among Andromeda, capacity providers, and
              WEKA.
            claimRefs:
              - CE004
              - CE006
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is operational normalization
            body: >-
              The strongest disclosed product thesis is not exclusive GPU ownership but a control and data layer that
              makes fragmented providers easier to buy, operate, and support through one workflow.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE013
          - type: callout
            title: Production claims lack independent verification
            body: >-
              Throughput, IOPS, deployment speed, customer scale, and environment-start improvements all trace to
              company or supplier-originated material rather than a customer-controlled test or independent benchmark.
            calloutType: risk
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A two-sided customer and capacity network
        blocks:
          - type: paragraph
            body: >-
              Andromeda addresses technical compute buyers rather than a single homogeneous customer class. Its public
              materials describe AI builders using one relationship to access capacity across providers, while
              recruiting materials identify AI-native founders, infrastructure leads, machine-learning teams, research
              labs, inference providers, and enterprises as target demand. The supply side includes hyperscalers,
              neoclouds, independent data centers, and GPU cluster operators. This creates two distinct commercial
              motions: winning sophisticated workload owners and recruiting capacity partners whose fleets can satisfy
              those workloads. The public positioning is strongest for customers whose requirements exceed one
              provider's fleet or who need training and inference capacity quickly. It is not possible to size revenue
              contribution by segment, geography, workload, or buyer type from the retained evidence.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU007
              - CU013
              - CU014
      - number: '6.2'
        title: Scale signals are substantial but mostly issuer-reported
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption signals are scale markers rather than customer-level operating disclosures. WEKA
              reports that Andromeda serves more than 100 AI customers across more than 50 capacity providers, and the
              company says it has supported more than one billion GPU-hours. An independent trade publication repeats
              the customer, provider, and GPU-hour figures, but its article is based on the same WEKA announcement and
              therefore is not fully independent corroboration. Company job materials also say the original managed
              cluster filled almost immediately. Together, these signals suggest real demand and meaningful workload
              throughput, but none supplies a cohort denominator, customer start date, active-account definition,
              paid-versus-pilot split, or revenue concentration bridge. The figures should therefore be treated as
              company and partner-reported scale, not audited retention evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU011
      - number: '6.3'
        title: Deployment outcomes exist, but customer identities are withheld
        blocks:
          - type: paragraph
            body: >-
              The WEKA integration provides the most concrete customer-use evidence. One research lab reportedly
              overcame a supplied-storage bottleneck without adding infrastructure; AI teams reportedly reduced
              environment startup time from about three minutes to 30 seconds; and one biotech workload reportedly moved
              metadata-heavy transfers from hours to minutes for directories containing roughly one billion files. These
              examples indicate production-scale technical usage, yet the customers are unnamed and the disclosures do
              not identify contract value, workload duration, renewal status, baseline method, or whether the outcomes
              were independently measured. Across the retained source set, no paying buyer is named together with
              verified deployment scope and contract status. The examples support product utility, but they do not
              establish repeatable customer economics or reference quality.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.4'
        title: Expansion mechanics are visible; durability metrics are not
        blocks:
          - type: paragraph
            body: >-
              Public recruiting materials outline an expansion model built around relationship-led sales, technical
              validation, supply-demand matching, and distribution partnerships. The planned partnership motion would
              channel portfolio-company demand through venture funds and accelerators while helping GPU providers find
              customers, which could expand both sides of the marketplace. However, the founding-marketing role
              explicitly calls for building case studies, reference customers, and customer feedback loops, signaling
              that institutionalized customer proof remains a work in progress. No retained source discloses gross or
              net revenue retention, churn, renewal rates, contract length, customer acquisition cost, top-customer
              share, or channel-attributed revenue. Without those measures, the more-than-100-customer headline cannot
              show whether adoption is durable, diversified, or economically attractive. Underwriting should require
              account-level cohort and concentration data before treating reported scale as recurring demand.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU008
              - CU013
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible
            body: >-
              Reported customer, provider, and GPU-hour totals indicate more than a collection of isolated pilots,
              although the underlying definitions are not public.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Durability is unproven
            body: >-
              The retained evidence contains no NRR, GRR, churn, renewal, contract-length, or concentration disclosure,
              and its strongest customer outcomes are anonymized.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual exposure
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are multi-tenant security, provider reliability, and operating execution.
              ClusterMAX reports that Andromeda can deploy Slurm on Kubernetes with light namespace isolation between
              tenants and procures capacity from multiple neoclouds, while Airframe describes a broker responsible for
              consolidating commercial terms, billing, and observability across providers. Those facts establish a broad
              control surface, but the assigned sources do not disclose control testing, incident history, SLA
              attainment, or provider concentration. A second tier comprises founder-ecosystem continuity, early
              commercial systems, cap-table opacity, and the operational challenge embedded in a stated ambition to
              reach as many as 100,000 GPUs. Severity and likelihood below are analyst assessments of the cited
              exposure, not ratings published by the sources.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Public materials in the assigned pool describe global, multi-provider compute brokerage, standardized
              commercial terms, and multi-tenant orchestration, but they do not include a regulator record, court
              record, DPA, privacy control matrix, export-control policy, or certification report. This is an evidence
              limitation, not proof that controls or incidents are absent. The most consequential legal diligence
              therefore concerns cross-tenant data handling, sanctions and export screening across providers and
              geographies, allocation of outage and performance liability, and corporate ownership. The latter deserves
              focused review because Silicon Valley Investclub says the full shareholder register is not public and its
              tear sheet mixes named investors, SPVs, and unattributed entries.
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Andromeda's marketplace model can reduce sourcing friction, yet it also makes service quality depend on
              heterogeneous upstream fleets, networking, storage, orchestration, and commercial interfaces. ClusterMAX's
              light-isolation description is the sharpest technical risk signal in the assigned evidence; it should be
              tested rather than extrapolated into an incident claim. Company-issued job material separately
              acknowledges capital, risk, and operational complexity, and a reported 100,000-GPU aspiration would
              increase the importance of automated qualification, capacity provenance, change management, and escalation
              discipline. Public staffing and customer-proof signals are inconsistent or thin, so mitigation maturity
              should remain unscored until private evidence is reviewed.
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR009
              - CR010
              - CR013
              - CR016
      - number: '7.4'
        title: Dependencies, financial model, and execution
        blocks:
          - type: paragraph
            body: >-
              The company sits between fragmented GPU suppliers and demanding AI buyers, making both sides of the
              marketplace potential concentration points. ClusterMAX ties the original model to NFDG portfolio companies
              and questions continuity after Nat Friedman and Daniel Gross joined Meta; Andromeda's own sales posting
              says an existing relationship network is the fastest route to pipeline and that the sales motion is still
              being built. A reported $60 million round at a $1.5 billion valuation and aggregate funding claims
              indicate access to capital, not cash availability, margin quality, or runway. Investment approval should
              therefore require provider and customer concentration schedules, recognized-revenue and take-rate bridges,
              cash commitments, SLA history, and named owners for remediation.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR009
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence required before underwriting the risk
            body: >-
              Do not interpret the absence of regulator, court, incident, SLA, concentration, or margin records in this
              assigned pool as evidence of absence. Approval should require primary control artifacts, performance
              cohorts, counterparty schedules, executed contracts, and a cash-and-preference bridge with named
              remediation owners.
            calloutType: risk
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Multiple secondary sources report a $60 million Paradigm-led Series A at a $1.5 billion post-money
              valuation. One report also places annualized revenue run rate above $100 million and says the company has
              been profitable since launch; those are reported operating claims, not audited revenue, ARR, cash
              generation, or cash available. Dividing the financing mark by the stated revenue-run-rate floor produces a
              headline multiple of no more than about 15x. That is an orientation point, not an underwriting multiple,
              because take rate, gross margin, revenue recognition, working capital, and concentration are undisclosed.
              Public funding totals also conflict, while the full shareholder register is unavailable. Entry discipline
              should therefore require primary financial and cap-table evidence before accepting the current mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparability
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Andromeda can become a trusted transaction and operations layer across fragmented GPU
              supply. Its own account describes benchmarking, certification, standardized contracts, matching, and
              operations across providers, and reports more than one billion GPU-hours. The anti-thesis is that scale
              claims have not yet been translated into independently verified margin quality or durable customer
              economics. Company-authored recruiting material says customer proof, feedback loops, win-loss analysis,
              the sales motion, and the design function are still being built. Third-party profiles also blend current
              marketplace positioning with older compute-for-equity and cluster narratives. The named competitor set is
              useful for strategic context, but it is not an independent valuation benchmark and contains no sourced
              comparable multiples.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              A quantified valuation range is not supportable from the assigned public evidence, so the scenarios are
              framed as underwriting states rather than false-precision price targets. The bull case requires audited
              conversion of marketplace activity into durable net revenue, attractive gross margin, diversified
              customers and providers, and repeatable cash generation. The base case assumes reported activity is
              directionally real but that margin and concentration remain unproven, leaving the financing mark ahead of
              diligence quality. The bear case is triggered by weak take rate, revenue reversals, concentrated
              counterparties, preference or debt overhang, or failure to convert a founder-led network into repeatable
              go-to-market. Each state should be re-priced after primary diligence rather than assigned an unsupported
              probability today.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: track, with medium confidence, high risk, and a stretched valuation stance. The current
              mark can become investable if the company substantiates recognized revenue, take rate, gross margin, cash
              conversion, retention, counterparty concentration, service performance, and cap-table terms. Until then, a
              target return, hold period, and exit value cannot be responsibly calculated. Exit readiness is likewise
              unproven: the public record lacks audited financials, a disclosed shareholder register, independently
              verified customer proof, and a comparable transaction framework. Thesis-break triggers are material
              revenue reclassification, sustained negative cash conversion, top-customer or provider dependence,
              punitive preferences, and failure to build repeatable sales and customer proof. A lower entry price can
              compensate for some execution risk, but not for missing ownership or revenue-quality evidence.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is not yet underwritten
            body: >-
              Treat the reported financing valuation as a negotiation anchor, not fair value. Require an audited revenue
              bridge, cohort economics, concentration, full capitalization, preferences, debt, and credible exit
              comparables before setting a target return or ownership threshold.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV014
              - CV015
              - CV016
