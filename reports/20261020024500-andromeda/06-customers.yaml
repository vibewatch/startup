chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence indicates meaningful platform breadth, including company and partner claims of more
    than 100 AI customers, more than 50 compute providers, and more than one billion GPU-hours supported.
    The evidence is materially weaker on named buyers, contract durability, retention, and concentration,
    so the customer thesis remains adoption-positive but underwriting-incomplete.
sections:
  - id: "customer-segments"
    title: "A two-sided customer and capacity network"
    body: >-
      Andromeda addresses technical compute buyers rather than a single homogeneous customer class. Its
      public materials describe AI builders using one relationship to access capacity across providers,
      while recruiting materials identify AI-native founders, infrastructure leads, machine-learning
      teams, research labs, inference providers, and enterprises as target demand. The supply side
      includes hyperscalers, neoclouds, independent data centers, and GPU cluster operators. This creates
      two distinct commercial motions: winning sophisticated workload owners and recruiting capacity
      partners whose fleets can satisfy those workloads. The public positioning is strongest for
      customers whose requirements exceed one provider's fleet or who need training and inference
      capacity quickly. It is not possible to size revenue contribution by segment, geography, workload,
      or buyer type from the retained evidence.
    claimRefs: ["CU004", "CU006", "CU007", "CU013", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-trajectory"
    title: "Scale signals are substantial but mostly issuer-reported"
    body: >-
      The clearest adoption signals are scale markers rather than customer-level operating disclosures.
      WEKA reports that Andromeda serves more than 100 AI customers across more than 50 capacity
      providers, and the company says it has supported more than one billion GPU-hours. An independent
      trade publication repeats the customer, provider, and GPU-hour figures, but its article is based
      on the same WEKA announcement and therefore is not fully independent corroboration. Company job
      materials also say the original managed cluster filled almost immediately. Together, these signals
      suggest real demand and meaningful workload throughput, but none supplies a cohort denominator,
      customer start date, active-account definition, paid-versus-pilot split, or revenue concentration
      bridge. The figures should therefore be treated as company and partner-reported scale, not audited
      retention evidence.
    claimRefs: ["CU001", "CU002", "CU003", "CU011"]
    tableRefs: ["TU002"]
  - id: "deployment-proof"
    title: "Deployment outcomes exist, but customer identities are withheld"
    body: >-
      The WEKA integration provides the most concrete customer-use evidence. One research lab reportedly
      overcame a supplied-storage bottleneck without adding infrastructure; AI teams reportedly reduced
      environment startup time from about three minutes to 30 seconds; and one biotech workload reportedly
      moved metadata-heavy transfers from hours to minutes for directories containing roughly one billion
      files. These examples indicate production-scale technical usage, yet the customers are unnamed and
      the disclosures do not identify contract value, workload duration, renewal status, baseline method,
      or whether the outcomes were independently measured. Across the retained source set, no paying buyer
      is named together with verified deployment scope and contract status. The examples support product
      utility, but they do not establish repeatable customer economics or reference quality.
    claimRefs: ["CU008", "CU009", "CU010", "CU015"]
    tableRefs: ["TU003"]
  - id: "durability-and-expansion"
    title: "Expansion mechanics are visible; durability metrics are not"
    body: >-
      Public recruiting materials outline an expansion model built around relationship-led sales,
      technical validation, supply-demand matching, and distribution partnerships. The planned
      partnership motion would channel portfolio-company demand through venture funds and accelerators
      while helping GPU providers find customers, which could expand both sides of the marketplace.
      However, the founding-marketing role explicitly calls for building case studies, reference
      customers, and customer feedback loops, signaling that institutionalized customer proof remains a
      work in progress. No retained source discloses gross or net revenue retention, churn, renewal rates,
      contract length, customer acquisition cost, top-customer share, or channel-attributed revenue.
      Without those measures, the more-than-100-customer headline cannot show whether adoption is durable,
      diversified, or economically attractive. Underwriting should require account-level cohort and
      concentration data before treating reported scale as recurring demand.
    claimRefs: ["CU012", "CU013", "CU014", "CU016"]
    figureRefs: ["FU001"]
