  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争边界比 GPU 经纪商更宽。Tracxn 列出 Andromeda 的 340 家活跃竞争者，并将 CoreWeave、Together
              AI、FluidStack、Crusoe、Aethir、exaBITS、Yotta 和 Neysa 列入排名集合，说明买家可以选择直接 GPU 云、分布式供给网络、更广泛的 AI
              平台或通用云服务商，而不必选择经纪商。CompuX 在 API 层提供融资驱动的替代方案；对于愿意接受单一供应商敞口或自行运营供应商组合的团队，超大规模云厂商和内部采购仍是替代方案。Andromeda
              的公司销售招聘帖面向前沿实验室、AI 原生初创公司和需求超过单一供应商舰队的企业，因此最可能的买家切入口是复杂且容量受限的团队，而非整个云市场。
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
