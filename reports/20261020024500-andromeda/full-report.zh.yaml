  - id: TV003
    title: 乐观、中性和悲观投资判断状态
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 报道的平台规模转化为经审计的净收入、较高毛利率、多元化交易对手和正向现金转化。
        - 若增长持久且有可信的战略或公开市场可比公司组合，当前估值可能得到支撑；目前尚未设定区间。
        - 供应商质量、客户留存和资本结构的执行情况。
        - 经审计的队列、重复采购、低集中度和现金创造能力都会提高这一情景的概率。
      - - 中性
        - 报道的活动大体真实，但利润率、留存、集中度和所有权条款仍未验证。
        - $1.5B 估值仍领先于证据质量；需要价格保护，或等待一级尽调。
        - 倍数收缩，以及活动转化为确认收入的速度放缓。
        - 如果收入桥接表清晰、经济性仅属中等，该情景仍可维持为观察。
      - - 悲观
        - 收入质量恶化、交易对手集中、现金转化为负，或优先权和债务条款吃掉上行空间。
        - 降价融资或回报受损风险占主导；不要依据表面收入跑速作投资判断。
        - 融资压力、商业化不成熟、供应商可靠性和较弱的退出准备程度。
        - 收入重分类、流失、集中度上升或惩罚性条款会触发放弃。
    notes: 这些是定性的投资判断状态，不是按概率加权的预测。公开证据不足以支持精确的估值区间、回报目标、持有期或退出价值。
