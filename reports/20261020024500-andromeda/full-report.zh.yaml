              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动是公司的判断：AI 工作负载需要的可靠高性能算力，将超过少数垂直整合供应商能够提供的规模。对应的供给驱动是分散的 GPU
              容量在寻找客户和利用率。这些是公司声称的判断，不是独立市场验证。采用仍取决于技术兼容性、容量可靠性、价格透明度、工作负载可迁移性、安全、数据传输经济性、采购审批，以及市场能否管理供应商和运营风险的信心。指定证据没有衡量这些约束，也没有把市场平台经济性与直接云合同比较。因此，估值不能只锚定在广义
              AI 基础设施增长上；在市场份额或收入倍数论证可信之前，尽调需要验证交易量、抽成率、毛利率、复购、集中度和供给利用率。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM013
              - CM015
