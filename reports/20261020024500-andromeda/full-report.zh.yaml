      - number: '8.2'
        title: 正论、反论与可比性
        blocks:
          - type: paragraph
            body: >-
              正论是，Andromeda 能成为分散 GPU 供给之上的可信交易和运营层。公司自述包括跨供应商的基准测试、认证、标准化合同、匹配和运营，并报告超过 10 亿 GPU
              小时。反论是，规模说法尚未转化为独立验证的利润质量或持久客户经济性。公司招聘材料称，客户证明、反馈闭环、输赢分析、销售动作和设计职能仍在建设。第三方资料也把当前市场定位与更早的算力换股和集群叙事混在一起。具名竞争者集合可用于战略背景，但不是独立估值基准，也没有带来源的可比倍数。
