          'y': 5
          detail: 更广泛的模型开发与部署平台，并非纯粹的采购经纪商。
        - label: 内部多供应商采购
          x: 4
          'y': 2
          detail: 买方自行管理多供应商采购范围，同时承担内部集成和运营负担。
    approximationNotes: 分析师给出的 1 到 5 序位分数，不是实测基准。定位依据保留来源对工作流范围和服务集成的描述；未知项按保守方式打分，不能将位置理解为市场份额、质量或价格排名。
    claimRefs:
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 从分散 GPU 供应到交易经济性的运营路径
    type: flow
    summary: 公开资料勾勒的运营路径，从供应商搜寻、验证一路接到买方采购；费用差额和由此产生的毛利仍未披露。
    data:
      nodes:
        - id: providers
          label: 分散的 GPU 供应商
          detail: 据报道，平台上有超过 100 家供应商。
        - id: sourcing
          label: 供应商搜寻与议价
          detail: 基础设施团队匹配需求、招募供应商并议价。
        - id: validation
          label: 性能与安全审查
          detail: 供应商上架前会检查其硬件和配套基础设施。
        - id: matching
          label: 容量匹配
          detail: 将训练和推理需求路由到可用供应。
        - id: billing
          label: 客户合并计费
          detail: 来自多家供应商的采购可以合并到一张发票中。
        - id: economics
          label: 未披露的交易价差
          detail: 抽成率、贡献毛利、付款时点和损失敞口均不可得。
      edges:
        - from: providers
          to: sourcing
          label: 引入
        - from: sourcing
          to: validation
          label: 审核
        - from: validation
          to: matching
          label: 上架
        - from: matching
          to: billing
          label: 交易
        - from: billing
          to: economics
          label: 确认收入并回款
    approximationNotes: 基于保留公开来源的概念性运营顺序；这不是量化瀑布图，也不代表已披露转化率或利润率。
    claimRefs:
      - CI006
      - CI007
      - CI012
      - CI016
  - id: FE001
    title: 产品架构与依赖栈
    type: stack
    summary: 产品在异构算力之上叠加市场平台和工作流软件，存储层依赖供应商，并由共享的运营控制机制统一管理。
    data:
      layers:
        - label: 商业市场平台
          items:
            - 需求要求
            - 供应商库存
            - 采购、合同和计费
          detail: 匹配买方与供应商，并协调交易。
        - label: 客户体验
          items:
            - 容量和价格视图
            - 使用量和计费视图
            - 集群和任务仪表盘
          detail: 招聘材料描述了面向开发者的界面。
        - label: 编排控制平面
          items:
            - API 和服务
            - 供应与生命周期管理
            - VM、Kubernetes、裸机和调度器抽象
          detail: 公开工程范围表明了预期的控制平面边界。
        - label: 算力执行
          items:
            - 训练工作负载
            - 推理工作负载
            - 多供应商 GPU 集群
          detail: 执行质量仍取决于底层供应商基础设施。
        - label: 存储与数据
          items:
            - WEKA NeuralMesh
            - NeuralMesh Axon
            - 供应商 NVMe 和专用存储
          detail: 存储层具备可移植性，但也形成了实质性的供应商依赖。
        - label: 信任与运营
          items:
            - 集群认证
            - 监控与访问控制
            - 支持与容量运营
          detail: 独立保证和服务水平历史并未公开。
    approximationNotes: 层级顺序属于分析框架，不代表数据包流向、所有权或完整物料清单。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE012
      - CE014
      - CE015
  - id: FU001
    title: 已披露的客户旅程与扩张闭环
    type: journey-map
    summary: 公开业务路径从紧迫的容量需求出发，经技术验证、进入托管运营，再靠客户关系与供应合作寻求扩张。
    data:
      nodes:
        - id: capacity-trigger
          label: 容量触发
          title: Capacity trigger
          detail: AI 原生团队超出单一供应商的能力，或需要快速获得高性能算力。
          touchpoints:
            - Founder
            - Infrastructure lead
            - ML team
        - id: commercial-discovery
          label: 商业需求发现
          title: Commercial discovery
          detail: 关系驱动的销售团队识别工作负载时点、架构、容量和商业要求。
          touchpoints:
            - Account executive
            - Technical buyer
            - Executive sponsor
        - id: supply-match
          label: 供应匹配
          title: Supply match
          detail: Andromeda 在供应商网络内用内部和外部容量匹配需求。
          touchpoints:
            - Infrastructure team
            - Provider network
            - Capacity planning
        - id: technical-validation
          label: 技术验证
          title: Technical validation
          detail: 部署前评估集群、存储、网络和工作负载要求。
          touchpoints:
            - Solutions engineering
            - Provider
            - Customer engineering
        - id: managed-operation
          label: 托管运营
          title: Managed operation
          detail: 训练或推理工作负载在托管集群上运行，并获得运营支持。
          touchpoints:
            - Console
            - Cluster operations
            - Support
        - id: expansion-loop
          label: 扩张闭环
          title: Expansion loop
          detail: 客户关系和分销合作可增加需求，供应商合作则增加供给。
          touchpoints:
            - Reference proof
            - VC and accelerator channels
            - GPU providers
    approximationNotes: 基于已披露销售、匹配、验证和合作触点的概念性顺序；公开信息没有阶段转化、持续时间或扩张率数据。
    claimRefs:
      - CU004
      - CU006
      - CU008
      - CU013
      - CU014
      - CU016
  - id: FR001
    title: 公开证据下的剩余风险热力图
    type: matrix
    summary: 依据指定公开证据对六类风险排序；对于未披露控制措施或绩效记录的领域，缓释成熟度仍未验证。
    data:
      columns:
        - label: 可能性
          detail: 基于指定证据的分析师方向性判断。
        - label: 影响
          detail: 对服务连续性、合规性或投资价值的潜在影响。
        - label: 缓释成熟度
          detail: 公开证据显示的成熟度，不是管理层报告的私有控制。
        - label: 剩余严重度
          detail: 交易尽调前仍然存在的敞口。
      rows:
        - label: 租户隔离
          note: ClusterMAX 报道了轻量级命名空间隔离。
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 供应商与 SLA 差异
          note: 多供应商经纪模式扩大了上游控制面。
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 网络扩展执行
          note: 据报道，公司目标是达到 100,000 个 GPU，但没有公开运营控制指标。
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 创始人生态连续性
          note: 第三方评估质疑创始人加入 Meta 后的连续性。
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 市场进入体系成熟度
          note: 公司发布的招聘信息称，核心销售和营销体系正在搭建。
          values:
            - value: Medium
            - value: Medium
            - value: Early
            - value: Medium
        - label: 股权结构表与经济性透明度
          note: 所有权、利润率、现金、集中度和合同义务仍属私有信息。
          values:
            - value: Present
            - value: High
            - value: Unverified
            - value: High
    approximationNotes: 定性类别是分析判断，不是概率或来源作者给出的分数。“存在”表示观察到的信息披露缺口，而不是事件发生的可能性。
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR006
      - CR010
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资估值和报道规模先经过证据质量与执行准备度筛选，再得出跟踪建议。
    data:
      nodes:
        - id: financing-mark
          label: 报道的 $1.5B 投后估值
          detail: 多个二手来源报道称，Paradigm 领投了 $60M 的 A 轮融资。
        - id: operating-signal
          label: 报道的年化收入跑速 >$100M
          detail: 收入跑速的说法不是经审计收入、ARR、利润率或现金流。
        - id: headline-multiple
          label: 表面收入跑速倍数 <=15x
          detail: 由估值除以报道的 $100M 下限得出。
        - id: market-proof
          label: 平台活动信号
          detail: 公司和二手信息源描述了广泛的集群、供应商和交易活动。
        - id: evidence-filter
          label: 重大尽调缺口
          detail: 经济性、集中度、所有权条款和可比倍数仍不可得。
        - id: recommendation
          label: 跟踪；高风险；偏高
          detail: 只有完成一手财务、客户和股权结构表尽调后，才重新定价。
    approximationNotes: 仅为定性的决策顺序；节点顺序不代表概率，也不构成估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV012
      - CV016
