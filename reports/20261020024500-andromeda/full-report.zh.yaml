        blocks:
          - type: paragraph
            body: >-
              运营节奏异常紧凑：2023 年 NFDG 支持的容量项目、当年 11 月 Moushey 加入、据报道 2024 年初 GPU 库存超过 4,000 张、2025 年收入年化跑率增长，以及 2026 年 3
              月以独角兽估值完成独立融资。按该融资报道，公司约 20 人管理数万张 GPU，并计划在 2026 年达到最多 100,000
              张。人均对应的规模可能反映轻资产经纪模式，但也会集中执行、交易对手和服务风险。一名客户告诉
