            body: >-
              公司处于分散 GPU 供应商与要求苛刻的 AI 买家之间，使市场两边都可能成为集中点。ClusterMAX 将原始模式与 NFDG 被投公司联系起来，并质疑 Nat Friedman 和 Daniel Gross
              加入 Meta 后的连续性；Andromeda 自己的销售招聘帖称，现有关系网络是进入销售管线的最快路径，而销售动作仍在搭建。一轮报道为 6,000 万美元、估值 15
              亿美元，合计融资说法说明可接触资本，但不说明现金可用性、利润质量或现金跑道。因此，投资批准应要求供应商和客户集中度明细、确认收入和抽成率桥接、现金承诺、SLA 历史，以及明确的整改负责人。
