            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO013
      - number: '1.3'
        title: 资本、报道规模与利益相关者一致性
        blocks:
          - type: paragraph
            body: >-
              Upstarts 报道，Andromeda 已在 NFDG 和 Paradigm 支持下成为独立公司；2026 年 3 月 Paradigm 的累计投资达到 $60m，对应 $1.5b 估值。同一报道称，2025
              年收入年化跑率超过 $100m，高于 2024 年的 $50m 多，并称公司从成立起就实现盈利。收入年化跑率不是 ARR，报道的盈利也不能证明现金创造。另一家聚合网站将 $160m 标为累计融资，拆分为
              $100m 种子轮和 $60m A 轮，但 Upstarts 描述 NFDG 更早的金额是与 GPU
              库存相关的前置承诺，而不是明确披露的股权融资。因此，累计融资、稀释、流动性、债务和可用现金仍未解决，不能安全地压缩成一个标题数字。
