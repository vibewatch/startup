      - number: '1.2'
        title: 管理层、创始人与治理敞口
        blocks:
          - type: paragraph
            body: >-
              Nat Friedman 和 Daniel Gross 发起了项目，Gross 于 2023 年底招募 Wil Moushey 负责运营。Moushey
              是对外可见的运营负责人兼首席执行官：报道将分拆、商业模式、规模目标和做市论直接归于他。Friedman 和 Gross 后来加入 Meta；据 Upstarts 报道，两人与 Andromeda
              已无持续的工作关系。这一变化降低了创始人的直接参与，却提高了公司对 Moushey
              的依赖，尤其是因为指定证据中未找到公开董事会名单、继任计划或更完整的高管梯队。公司发布的创始营销负责人招聘帖称，叙事、发布、客户证明和反馈闭环职能仍在从零搭建，显示出尽管收入规模已有报道，公司组织层仍处于早期。
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO013
