      - number: '8.4'
        title: 建议、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪，置信度中等，风险高，估值偏高。若公司能够证明确认收入、抽成率、毛利率、现金转化、留存、交易对手集中度、服务表现和资本表条款，当前估值可以进入投资范围。在此之前，目标回报、持有期和退出价值都无法负责任地计算。退出准备度同样尚未证明：公开记录缺少经审计财务、披露的股东名册、独立验证的客户证明和可比交易框架。打破投资论点的触发因素包括重大收入重分类、持续负现金转化、对最大客户或供应商依赖、惩罚性优先权，以及无法建立可重复销售和客户证明。更低的入场价格可以补偿部分执行风险，但不能补偿缺失的所有权或收入质量证据。
