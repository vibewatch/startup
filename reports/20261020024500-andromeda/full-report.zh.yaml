  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              最窄且有证据支撑的市场边界，是用于 AI 训练和推理、并配套购买、出售、路由及运营能力的外部 GPU 算力。Andromeda
              的公司招聘文案将平台置于模型构建者与分散供应基础之间，后者包括超大规模云厂商、云算力新厂商和独立数据中心。产品描述还包括通过 Slurm、Kubernetes 或 SSH
              编排，以及存储和运营支持。该边界不包括通用云支出、自有私有集群、OEM 直接销售的芯片，以及除非 Andromeda
              参与撮合其产出容量之外的数据中心资本投入。现状替代方案包括单一供应商云采购、直接供应商合同、内部基础设施团队和定制经纪交易；指定证据没有量化它们各自的份额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
