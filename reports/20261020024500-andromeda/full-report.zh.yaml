            title: 投资判断风险前需要证据
            body: 不要把指定证据池中缺少监管、法院、事件、SLA、集中度或利润率记录解释为不存在这些事项。批准前应要求一手控制材料、业绩客群、交易对手明细、已签合同，以及带明确整改负责人的现金和优先权桥接表。
