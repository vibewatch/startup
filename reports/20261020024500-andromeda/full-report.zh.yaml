              - CM003
              - CM008
              - CM009
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有留存来源提供独立构建的市场总量、增长率、地域拆分，或可据此计算可靠 TAM、SAM、SOM 的分母。公司招聘文案称，未来五年可能有“数万亿美元的算力”流经
              Andromeda，但这是关于平台吞吐的愿景，不是经过测量的市场预测。不能把它当作收入、GMV、SAM 或可用支出。可信的规模模型应分别估算第三方可提供的加速器容量、愿意使用外部供应的工作负载、Andromeda
              可覆盖的地区和硬件，以及平台可实现的抽成率。指定证据池中没有这些分母，因此本章只展示规模层次，不给出数值规模。
