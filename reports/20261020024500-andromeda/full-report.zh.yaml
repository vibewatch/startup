        title: 展示项
        blocks:
          - type: callout
            title: 市场规模是尽调闸门缺口
            body: 预取来源支持市场机制和买家假设，但不支持数值市场规模或采用曲线。不要把公司的“数万亿美元”愿景资本化为 TAM 或交易量。
