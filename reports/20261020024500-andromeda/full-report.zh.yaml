      - number: '3.3'
        title: 分销、切换与控制点
        blocks:
          - type: paragraph
            body: >-
              Andromeda 的分销逻辑建立在整合分散供应商供给，并通过直接企业销售和生态合作触达买家。当前招聘证据显示两条路径都仍在搭建：客户经理需要带来既有网络并转化为销售管线；新的合作负责人需要在 GPU
              供应商、AI
              实验室、OEM、风险基金和加速器之间建立覆盖全生命周期的合作。这可能带来双边流动性，但在需求集中度和复购得到证明之前，也会让供应商和渠道伙伴拥有议价能力。切换成本更可能来自合同、工作流集成、支持和运营熟悉度，而不是专有硬件。留存池没有多归属、续约、迁移工作量、供应商集中度或
              SLA 表现的客户级证据，因此无法得出更强的锁定结论。
            claimRefs:
              - CP002
              - CP010
              - CP012
              - CP016
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              潜在护城河是市场流动性加运营标准化：更多供给可以改善可用性和价格发现，更多买家需求可以提高供应商利用率。但这些好处并非不可争夺。直接 GPU
              云和超大规模云厂商控制更多物理舰队和运行时栈，融资驱动的聚合商可以把资本与访问权打包，最大买家则可自行复制多供应商采购。公司招聘语言还称，客户证明、输赢分析、竞争情报和合作手册正在建立，而不是已经制度化。因此定位说得通，但持久性尚未证明：Andromeda
              可能凭覆盖面和采购简便性胜出，但证据没有证明独家供给、专有性能优势、已验证节省或高切换成本。
            claimRefs:
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
