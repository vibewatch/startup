      - number: '3.2'
        title: 能力、定价与交付模式
        blocks:
          - type: paragraph
            body: >-
              留存证据将 Andromeda 定位在采购和运营层。其招聘材料描述了一个可买卖并运营算力的平台，团队能在全球供给中寻找、购买和运行容量。Tracxn 称平台可通过 Slurm、Kubernetes 或 SSH
              访问，并提供存储、DevOps 支持、服务等级协议和第三方 GPU 市场。竞争者对比还声称拥有 100 多家供应商、一份合同、一张发票、单一
              SLA、供应商认证和实时价格指数；这些细节可作为方向性证据，但未获独立验证。CompuX 则把融资与兼容 OpenAI 的路由结合起来。公开目录价格、实际折扣、合同最低量、SLA
              补偿措施和同口径基准结果均不可得，因此本章不声称存在已验证的成本或性能领先。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
