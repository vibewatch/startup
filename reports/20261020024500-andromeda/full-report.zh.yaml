    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、足迹与运营模式
        blocks:
          - type: paragraph
            body: >-
              Andromeda 将自己定位为双边市场和基础设施平台：AI 团队可以在平台上购买并运营 GPU 容量，基础设施所有者则可以出售容量。官网称，平台从 100
              多家供应商处采购、基准测试并定价算力，再统一合同、服务等级、开票、支持和可观测性；公司还称已完成 1,000 多笔交易。这些是公司报告的活动指标，不是经审计的客户或收入数据。独立报道将该业务追溯至 2023 年
              NFDG 的算力项目，但法律注册日期仍未核实。据报道，公司在旧金山设有办公室；精确的法定总部地址只有低信誉聚合网站支持，不应视为已获确认。
