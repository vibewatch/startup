  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              多个二手来源称，Paradigm 领投了 6,000 万美元 A 轮，对应 15 亿美元投后估值。一份报道还称收入年化跑率超过 1
              亿美元，公司自成立以来一直盈利；这些是报道的运营说法，不是经审计的收入、ARR、现金创造或可用现金。用融资估值除以所述收入年化跑率下限，可得不超过约 15
              倍的标题倍数。这只是定位参考，不是投资判断倍数，因为抽成率、毛利率、收入确认、营运资金和集中度均未披露。公开融资总额也相互冲突，完整股东名册同样不可得。因此，接受当前估值前，入场纪律应要求一手财务和资本表证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
