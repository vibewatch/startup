      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据显示，技术基础设施负责人是主要用户和评估者；创始人、商务负责人或企业预算负责人可能批准支出。Andromeda 的销售招聘帖面向前沿实验室、AI
              原生初创公司和需求已超出单一供应商舰队的企业。文案描述了从架构讨论、技术验证、商业谈判，到并行接触技术、商务和高管利益相关者的顾问式销售周期。在供给侧，GPU
              集群供应商是需要需求、利用率和潜在融资的交易对手，而非算力终端用户。VC 基金和加速器被描述为连接被投公司需求的渠道。这些角色支持市场采用路径，但证据没有提供转化率、销售周期长度、合同期限、留存或预算数据。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
