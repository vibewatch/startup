      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              指定公开证据不足以支持量化估值区间，因此这些情景被定义为投资判断状态，而不是虚假的精确价格目标。乐观情景要求把市场活动经审计地转化为持久净收入、有吸引力的毛利率、多元化客户和供应商，以及可重复的现金创造。基准情景假设报道活动大方向真实，但利润率和集中度仍未证明，融资估值领先于尽调质量。悲观情景由低抽成率、收入冲回、交易对手集中、优先权或债务负担，或无法把创始人主导的网络转化为可重复获客触发。每种状态都应在一手尽调后重新定价，而不是今天赋予无依据的概率。
