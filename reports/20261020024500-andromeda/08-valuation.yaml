  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - [Thesis, "Fragmented GPU supply needs a trusted transaction and operations layer.", "Andromeda describes benchmarking, certification, standardized contracts, matching, and operations.", "Independent proof of provider utilization, SLA performance, and repeat purchase."]
      - [Thesis, "Marketplace activity may already have meaningful scale.", "The company reports more than one billion GPU-hours; a secondary report cites 100+ providers and 1,000+ transactions.", "Audited activity cohorts tied to recognized net revenue and cash collection."]
      - [Thesis, "Flexible multi-provider access can address buyers underserved by long commitments.", "Current product and sales descriptions emphasize routing training and inference across fragmented supply.", "Customer references showing cost, reliability, and deployment-time gains."]
      - [Anti-thesis, "Headline scale may not translate into attractive economics.", "No public take rate, gross margin, cash-conversion, retention, or concentration data were retained.", "Audited revenue bridge and cohort-level unit economics."]
      - [Anti-thesis, "Commercialization systems remain early.", "Recruiting materials say customer proof, feedback loops, win-loss analysis, sales motion, and design are being built.", "Repeatable pipeline conversion, referenceable customers, and mature product operations."]
      - [Anti-thesis, "Public descriptions and financing totals are internally inconsistent.", "Profiles differ on funding history and blend marketplace, owned-cluster, and compute-for-equity models.", "Company-verified history, legal structure, cap table, and segment reporting."]
    notes: >-
      Company job reposts are classified as company-issued evidence rather than
      independent validation; competitor listings provide context, not valuation
      benchmarks.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear underwriting states
    columns:
      - Case
      - Assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Reported marketplace scale converts into audited net revenue, strong gross margin, diversified counterparties, and positive cash conversion.", "The current mark could be supported by durable growth and a credible strategic or public-market comparable set; no range is assigned yet.", "Execution across provider quality, customer retention, and capital structure.", "Audited cohorts, repeat purchases, low concentration, and cash generation would increase probability."]
      - [Base, "Reported activity is directionally real, but margin, retention, concentration, and ownership terms remain unverified.", "The $1.5B mark stays ahead of evidence quality; require price protection or wait for primary diligence.", "Multiple compression and slower conversion of activity into recognized revenue.", "A clean revenue bridge with only moderate economics would keep this as track."]
      - [Bear, "Revenue quality weakens, counterparties are concentrated, cash conversion is negative, or preference and debt terms absorb upside.", "Down-round or impaired-return risk dominates; do not underwrite from the headline run rate.", "Financing overhang, commercial immaturity, provider reliability, and weak exit readiness.", "Revenue reclassification, churn, concentration, or punitive terms would trigger a pass."]
    notes: >-
      These are qualitative underwriting states, not probability-weighted
      forecasts. Public evidence does not support precise valuation ranges,
      return targets, hold periods, or exit values.
    claimRefs: [CV002, CV003, CV008, CV010, CV014, CV015, CV016]
