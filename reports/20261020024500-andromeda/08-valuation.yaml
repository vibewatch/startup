          detail: "$60M Paradigm-led Series A is reported by multiple secondary sources."
        - id: operating-signal
          label: ">$100M reported annualized revenue run rate"
          detail: "A run-rate claim is not audited revenue, ARR, margin, or cash flow."
        - id: headline-multiple
          label: "<=15x headline run-rate multiple"
          detail: "Derived from the valuation divided by the reported $100M lower bound."
        - id: market-proof
          label: "Marketplace activity signal"
          detail: "Company and secondary accounts describe broad cluster, provider, and transaction activity."
        - id: evidence-filter
          label: "Material diligence gaps"
          detail: "Economics, concentration, ownership terms, and comparable multiples remain unavailable."
        - id: recommendation
          label: "Track; high risk; stretched"
          detail: "Re-price only after primary financial, customer, and cap-table diligence."
    approximationNotes: >-
      Qualitative decision sequence only; node order does not assign probability
      or establish a valuation model.
    claimRefs: [CV001, CV002, CV003, CV007, CV012, CV016]
callouts:
  - calloutType: recommendation
    title: Price is not yet underwritten
    body: >-
      Treat the reported financing valuation as a negotiation anchor, not fair
      value. Require an audited revenue bridge, cohort economics, concentration,
      full capitalization, preferences, debt, and credible exit comparables
      before setting a target return or ownership threshold.
    claimRefs: [CV003, CV004, CV005, CV014, CV015, CV016]
