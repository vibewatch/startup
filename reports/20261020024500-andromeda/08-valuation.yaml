company:
  name: Andromeda
chapter:
  number: 8
  title: Valuation
  summary: >-
    Andromeda's reported $1.5 billion post-money valuation is roughly 15x the
    lower bound of its reported annualized revenue run rate, but the public
    record does not establish audited revenue quality, unit economics,
    concentration, financing preferences, or a defensible exit multiple.
    The evidence supports a track recommendation with medium confidence, high
    risk, and a stretched valuation stance rather than a price-insensitive buy.
sections:
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      Multiple secondary sources report a $60 million Paradigm-led Series A at
      a $1.5 billion post-money valuation. One report also places annualized
      revenue run rate above $100 million and says the company has been
      profitable since launch; those are reported operating claims, not audited
      revenue, ARR, cash generation, or cash available. Dividing the financing
      mark by the stated revenue-run-rate floor produces a headline multiple of
      no more than about 15x. That is an orientation point, not an underwriting
      multiple, because take rate, gross margin, revenue recognition, working
      capital, and concentration are undisclosed. Public funding totals also
      conflict, while the full shareholder register is unavailable. Entry
      discipline should therefore require primary financial and cap-table
      evidence before accepting the current mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV015, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis-and-comparability
    title: Thesis, anti-thesis, and comparability
    body: >-
      The thesis is that Andromeda can become a trusted transaction and
      operations layer across fragmented GPU supply. Its own account describes
      benchmarking, certification, standardized contracts, matching, and
      operations across providers, and reports more than one billion GPU-hours.
      The anti-thesis is that scale claims have not yet been translated into
      independently verified margin quality or durable customer economics.
      Company-authored recruiting material says customer proof, feedback loops,
      win-loss analysis, the sales motion, and the design function are still
      being built. Third-party profiles also blend current marketplace
      positioning with older compute-for-equity and cluster narratives. The
      named competitor set is useful for strategic context, but it is not an
      independent valuation benchmark and contains no sourced comparable
      multiples.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-downside-triggers
    title: Bull, base, and bear cases
    body: >-
      A quantified valuation range is not supportable from the assigned public
      evidence, so the scenarios are framed as underwriting states rather than
      false-precision price targets. The bull case requires audited conversion
      of marketplace activity into durable net revenue, attractive gross margin,
      diversified customers and providers, and repeatable cash generation. The
      base case assumes reported activity is directionally real but that margin
      and concentration remain unproven, leaving the financing mark ahead of
      diligence quality. The bear case is triggered by weak take rate, revenue
      reversals, concentrated counterparties, preference or debt overhang, or
      failure to convert a founder-led network into repeatable go-to-market.
      Each state should be re-priced after primary diligence rather than assigned
      an unsupported probability today.
    claimRefs: [CV002, CV003, CV008, CV010, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: recommendation-exit-readiness-and-diligence
    title: Recommendation, exit readiness, and diligence asks
    body: >-
      Recommendation: track, with medium confidence, high risk, and a stretched
      valuation stance. The current mark can become investable if the company
      substantiates recognized revenue, take rate, gross margin, cash conversion,
      retention, counterparty concentration, service performance, and cap-table
      terms. Until then, a target return, hold period, and exit value cannot be
      responsibly calculated. Exit readiness is likewise unproven: the public
      record lacks audited financials, a disclosed shareholder register,
      independently verified customer proof, and a comparable transaction
      framework. Thesis-break triggers are material revenue reclassification,
      sustained negative cash conversion, top-customer or provider dependence,
      punitive preferences, and failure to build repeatable sales and customer
      proof. A lower entry price can compensate for some execution risk, but not
      for missing ownership or revenue-quality evidence.
    claimRefs: [CV001, CV003, CV007, CV009, CV010, CV012, CV014, CV015, CV016]
    figureRefs: [FV001]
