summary:
  headline: >-
    Andromeda shows meaningful reported GPU-marketplace scale, but its $1.5 billion valuation remains ahead of public
    evidence on margin quality, concentration, controls, and ownership terms.
  overallScore: 6.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
