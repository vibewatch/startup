  topStrengths:
    - Reported annualized revenue run rate exceeded $100 million in 2025, with profitability reported since launch.
    - >-
      Public materials indicate meaningful marketplace activity across more than 100 providers and more than 1,000
      transactions.
    - >-
      The multi-provider model addresses fragmented GPU procurement and offers buyers flexible capacity and operational
      support.
  topRisks:
    - >-
      Recognized revenue, take rate, gross margin, cash conversion, burn, runway, debt, and provider commitments are
      undisclosed.
    - >-
      Customer and provider concentration, retention, contract duration, and named reference-customer evidence remain
      unavailable.
    - >-
      Multi-provider reliability, light tenant-isolation reporting, export controls, incident history, and contractual
      recourse are unverified.
    - The cap table, preference stack, board, succession plan, and role of earlier NFDG commitments remain opaque.
    - Sales, customer-proof, marketing, and design systems are still being built despite the reported operating scale.
  unresolvedGaps:
    - >-
      Audited financial statements and a monthly bridge from transactions to recognized net revenue, take rate, gross
      margin, and cash conversion
    - >-
      Customer and provider concentration, NRR and GRR, contract duration, SLA performance, incident history, and named
      customer references
    - >-
      Fully diluted cap table, preference waterfall, debt and guarantees, board rights, beneficial ownership, and
      succession responsibilities
    - >-
      Security architecture, tenant-isolation tests, compliance controls, export and sanctions screening, and provider
      failover evidence
