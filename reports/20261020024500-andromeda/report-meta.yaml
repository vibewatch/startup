companyProfile:
  summary: >-
    Andromeda is a private, San Francisco-based market and infrastructure platform that aggregates GPU capacity across
    providers, standardizes procurement and operations, and serves AI-native startups, research labs, and enterprise AI
    teams. Public evidence points to meaningful activity and rapid reported growth, but core transaction economics and
    governance remain opaque.
