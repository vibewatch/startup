        - label: "Internal multi-vendor procurement"
          x: 4
          y: 2
          detail: "Buyer-managed vendor breadth with internal integration and operational burden."
    approximationNotes: >-
      Analyst ordinal scores from 1 to 5, not measured benchmarks. Placement uses retained
