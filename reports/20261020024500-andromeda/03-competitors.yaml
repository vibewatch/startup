company:
  name: "Andromeda"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Andromeda competes across a broad field of GPU clouds, marketplaces, hyperscalers,
    financing-led aggregators, and internal multi-vendor procurement. Its clearest
    differentiation is a procurement and orchestration layer across fragmented supply,
    but retained evidence does not establish durable pricing advantage, provider-level
    performance, or customer switching costs.
sections:
  - id: "landscape-and-buyer-alternatives"
    title: "Landscape and buyer alternatives"
    body: >-
      The relevant competitive boundary is wider than GPU brokers. Tracxn lists 340
      active competitors for Andromeda and names CoreWeave, Together AI, FluidStack,
      Crusoe, Aethir, exaBITS, Yotta, and Neysa among the ranked set, showing that a
      buyer can choose direct GPU clouds, distributed supply networks, broader AI
      platforms, or general cloud providers rather than a broker. CompuX adds a
      financing-led alternative at the API layer, while hyperscalers and internal
      procurement remain substitutes for teams willing to accept one-provider exposure
      or operate their own vendor portfolio. Andromeda's company-issued sales posting
      targets frontier labs, AI-native startups, and enterprises whose demand exceeds a
      single provider's fleet, narrowing the most plausible buyer wedge to sophisticated,
      capacity-constrained teams rather than the full cloud market.
    claimRefs:
      - "CP005"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
    tableRefs:
      - "TP001"
  - id: "capability-pricing-and-delivery"
    title: "Capability, pricing, and delivery model"
    body: >-
      Retained evidence places Andromeda at the procurement and operations layer. Its
      own recruiting material describes a platform to buy, sell, and operate compute,
      with a console where teams find, buy, and run capacity across global supply.
      Tracxn reports access through Slurm, Kubernetes, or SSH, plus storage, DevOps
      support, service-level agreements, and a third-party GPU marketplace. A competitor
      comparison adds claims of more than 100 providers, one contract, one invoice, a
      single SLA, provider certification, and a live pricing index; these details are
      useful directional evidence but are not independent verification. CompuX instead
      combines financing with OpenAI-compatible routing. Public list prices, realized
      discounts, contract minimums, SLA remedies, and like-for-like benchmark results
      remain unavailable, so the chapter does not claim a verified cost or performance
      lead.
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP013"
    tableRefs:
      - "TP002"
      - "TP003"
  - id: "distribution-switching-and-control"
    title: "Distribution, switching, and control points"
    body: >-
      Andromeda's distribution thesis depends on aggregating fragmented provider supply
      and reaching buyers through direct enterprise sales and ecosystem partnerships.
      Current recruiting evidence shows both motions are still being built: an account
      executive is expected to bring an existing network and convert it into pipeline,
      while a new partnerships leader is expected to create the lifecycle across GPU
      providers, AI labs, OEMs, venture funds, and accelerators. That can produce
      two-sided liquidity, but it also gives providers and channel partners bargaining
      power until demand concentration and repeat usage are demonstrated. Switching
      costs appear more likely to arise from contracting, workflow integration, support,
      and operational familiarity than from proprietary hardware. The retained pool has
      no customer-level evidence on multi-homing, renewal, migration effort, provider
      concentration, or SLA performance, preventing a stronger lock-in conclusion.
    claimRefs:
      - "CP002"
      - "CP010"
      - "CP012"
      - "CP016"
  - id: "moat-durability-and-displacement"
    title: "Moat durability and displacement risk"
    body: >-
      The potential moat is market liquidity plus operational standardization: more
      supply can improve availability and price discovery, while more buyer demand can
      improve provider utilization. The risk is that these benefits are contestable.
      Direct GPU clouds and hyperscalers control more of the physical fleet and runtime
      stack, financing-led aggregators can bundle capital with access, and internal
      procurement can replicate multi-vendor sourcing for the largest buyers. Company
      hiring language also says customer proof, win-loss analysis, competitive
      intelligence, and partnership playbooks are being established rather than already
      institutionalized. The resulting positioning is credible but not yet proven
      durable: Andromeda may win on breadth and procurement simplicity, yet the evidence
      does not establish exclusive supply, proprietary performance advantages, verified
      savings, or high switching costs.
    claimRefs:
      - "CP011"
      - "CP012"
      - "CP014"
      - "CP015"
      - "CP016"
    figureRefs:
      - "FP001"
