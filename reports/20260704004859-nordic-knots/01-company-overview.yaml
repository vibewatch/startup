  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An exact, sourced total employee headcount broken out by function and geography.
    whyItMatters: Headcount is a standard scale/underwriting metric and its absence limits comparison against peers and against the new $100M capital raise.
    diligencePath: Request headcount directly from Nordic Knots investor relations, or triangulate via LinkedIn employee-count tracking over time.
    relatedQuestionRefs:
    - QO032
  - type: missing-source
    severity: material
    topic: legal-adverse
    missingEvidence: A systematic search of court records, regulatory dockets, and consumer-protection filings involving Nordic Knots AB or its US entity.
    whyItMatters: Only informal customer-review complaints were found; an absence of confirmed litigation should not be read as confirmation that none exists.
    diligencePath: Run a paid legal-records search (PACER, Swedish court registers) and request a litigation summary from the company as part of diligence.
    relatedQuestionRefs:
    - QO033
  - type: missing-source
    severity: minor
    topic: valuation-comparables
    missingEvidence: A defensible set of revenue-multiple comparables for direct-to-consumer home-textile brands at similar scale.
    whyItMatters: Without comparables, it is difficult to independently assess whether the €1.9 billion valuation is rich or reasonable relative to Nordic Knots' disclosed ~€61 million 2025 revenue.
    diligencePath: Commission a comparables analysis using PitchBook/CB Insights data once full access is available, and cross-check against recent DTC consumer-brand transactions.
    relatedQuestionRefs:
    - QO034
  - type: missing-source
    severity: material
    topic: capital-structure and stakeholder map (table TO003)
    missingEvidence: Confirmation of whether Nordic Knots carries any debt, working-capital facilities, or project-finance obligations alongside the new equity, and a full post-round capitalization table beyond Creades AB's disclosed ~5% stake.
    whyItMatters: Debt terms, covenants, and full ownership dilution materially affect downside risk and are not disclosed in any reviewed funding announcement.
    diligencePath: Request a capital-structure summary, credit agreements, and full cap table as part of a formal diligence data room.
    relatedQuestionRefs:
    - QO035
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: milestone chronology (table TO004)
    missingEvidence: A single authoritative date for the first Campbell-Rey collaboration launch (sources split between 2021 and 2022).
    whyItMatters: The milestone table's product-collaboration chronology is only as reliable as its weakest-sourced row, and this conflict was the only one identified among the dated milestones.
    diligencePath: Request the exact launch date directly from Nordic Knots' press office or Campbell-Rey's studio records.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
