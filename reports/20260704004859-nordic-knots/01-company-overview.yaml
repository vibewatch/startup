- id: funding-and-investors
  title: Funding History, Valuation, and Investors
  body: In March 2026, Nordic Knots closed its first-ever institutional external funding round, raising approximately $100 million (about EUR 86 million) at a valuation of roughly EUR 1.9 billion (about $2.2 billion) (CO010, CO011). The round was led by Imaginary Ventures, the US consumer-focused venture firm founded in 2018 by Natalie Massenet and Nick Brown, whose portfolio includes Skims, Reformation, Westman Atelier, and Danielle Frankel (CO012, CO043). Other participants included Swedish investment firm Creades AB, which reportedly contributed about SEK 105 million (roughly EUR 9.6 million) for approximately 5% of the round, along with Iris Ventures and St. Dominique Capital, the investment platform of Lauren Santo Domingo (CO013, CO014). Notably, Nordic Knots operated for roughly a decade without external institutional capital, and its founders say they turned down investor approaches for about five years before deciding the company was ready to raise (CO015). Beyond Creades AB's disclosed
    stake, no reviewed source provides a full capitalization table, so the post-round ownership split among the founders and the remaining investors is not independently verifiable (see evidenceGaps). Third-party data vendors CB Insights and PitchBook cover the company, but PitchBook's detailed profile could not be independently retrieved during this review, and neither vendor appears to have access to audited financials (CO040).
  claimRefs:
  - CO010
  - CO011
