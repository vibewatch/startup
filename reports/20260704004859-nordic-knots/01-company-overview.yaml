- id: risks-and-diligence
  title: Adverse Signals, Hiring Footprint, and Diligence Gaps
  body: 'Independent reviewers, rather than the company''s own marketing, are the main source of adverse signal on Nordic Knots. Interior Insider''s review reports recurring customer complaints about shipping delays through third-party couriers and mismatches between marketing photography and delivered rug color or pattern (CO036), and separately finds that Nordic Knots wool rugs shed noticeably during the first several months of use, that jute-blend edges are prone to fraying, and that durability declines faster in high-traffic households (CO037). Trustpilot, a common venue for this kind of customer feedback, could not be independently retrieved during this review because the fetch was blocked, so the full distribution of customer sentiment remains only partially verified. On hiring, Nordic Knots lists open roles across Stockholm, New York, Paris, London, Berlin, and Los Angeles spanning retail, e-commerce, CRM, merchandising, and marketing functions, which is consistent with a company
    scaling multi-market retail and DTC operations, but the company does not publish a total headcount figure (CO044). Taken together with the funding-and-governance gaps noted above, the most material open diligence items are: the exact headcount and customer base; whether Nordic Knots carries any debt or project-finance obligations alongside its new equity; whether any undisclosed legal or regulatory matters exist beyond the informal review complaints; and how the EUR 1.9 billion valuation compares with peer DTC home-textile brands of similar revenue scale. Each is logged as an explicit evidence gap rather than assumed away.'
  claimRefs:
  - CO036
  - CO037
  - CO044
