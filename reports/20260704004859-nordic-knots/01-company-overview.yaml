- id: leadership-and-governance
  title: Leadership, Founders, and Governance
  body: 'Fabian Berglund is co-founder and CEO; before Nordic Knots he worked as a creative director at advertising agencies Anomaly and Wieden+Kennedy (CO002, CO005). Liza Berglund Laserow is co-founder and Chief Creative Director; she trained as a lawyer before joining her family''s antiques business and running the Manhattan branch of Laserow Antiques, and she is the company''s primary public voice on design direction (CO003, CO006). Felix Berglund co-founded the company with his brother and sister-in-law and has moved into more of an advisory role as Nordic Knots has scaled (CO004). All three are related by blood or marriage, making Nordic Knots a genuinely family-run enterprise, which concentrates both upside alignment and key-person risk in a small group (CO038). Governance signals beyond the founding family are limited: the company became a Certified B Corporation in February 2026 with an Impact Score of 91.4 against an 80-point minimum and a 50.9 median (CO023), and it enforces a
    Supplier Code of Conduct backed by SMETA ethical-trade audits and GoodWeave certification of its India-based rug supply chain (CO024, CO025). Press and communications are handled through an external partner, Grayscale PR, rather than an in-house function (CO039). No independent board members, audit committee, or other external governance mechanism were identified in any reviewed source, which is itself a notable gap given the scale of new capital the company has just raised.'
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO005
