- id: retention-and-satisfaction
  title: Retention, Satisfaction, and Service Quality
  body: >-
    Nordic Knots discloses no net or gross revenue retention, repeat-purchase rate, renewal rate, or customer lifetime value for any segment, so retention cannot be measured directly. The best available public proxy is Trustpilot, where Nordic Knots holds an overall rating of 'Average' (3.1 out of 5): reviews split between strongly positive craftsmanship feedback and recurring complaints about unresponsive post-sale customer service, rug deliveries measuring smaller than advertised, and slow resolution of a lost-shipment dispute with a third-party carrier. One reviewer characterized the paid $50 trade-sample program as feeling like a 'scam' after being denied a return, though this is a single account rather than a corroborated pattern across the review set, and other reviews credit the same customer-service team with promptly resolving delivery delays and processing refunds. Independent product reviews separately flag durability caveats -- wool rugs shedding in the first months of use and jute/flatweave styles fraying in high-traffic areas -- that bear on whether customers become long-term, repeat buyers, but no return or warranty-claim rate is disclosed to quantify that risk.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
