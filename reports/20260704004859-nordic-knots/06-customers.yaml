- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Designer co-branding (Campbell-Rey, Giancarlo Valle, Jessie Andrews, etc.)
    - Press and credibility proof rests on a small number of named collaborations
    - >-
      If flagship collaborations end or receive less press, the strongest public proof of trade adoption weakens
    - >-
      Request the pipeline of upcoming designer collaborations and their historical renewal rate
  - - Hospitality/commercial installations (Hotel Il Pellicano)
    - Only one hospitality deployment is independently corroborated in this chapter's sample
    - A single-project reference concentrates reputational risk on one hotel relationship
    - Request a fuller hospitality client list and contract terms
  - - Physical retail rollout (US West Coast hiring signal)
    - Execution risk of opening and staffing a new flagship without disclosed timeline
    - Delays or underperformance could slow the company's stated US growth strategy
    - Request confirmed opening date, lease terms, and staffing plan for the next flagship
  - - PRO trade channel growth
    - >-
      Trade professionals could concentrate ordering power and demand deeper discounts as the channel scales
    - Margin pressure if trade discounting outpaces DTC growth
    - Request trade vs. DTC gross margin by channel
  - - Third-party wholesale distribution (Design Within Reach)
    - Reliance on a retail partner's own merchandising and marketing priorities
    - Reduced control over presentation and pricing if the partnership scales significantly
    - Request the wholesale agreement's exclusivity and minimum-order terms
  notes: >-
    Concentration risk is assessed qualitatively because Nordic Knots discloses no customer-count, revenue-mix, or contract-value data to quantify top-customer or top-channel exposure.
