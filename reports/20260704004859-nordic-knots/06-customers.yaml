- id: expansion-and-concentration
  title: Expansion Drivers and Concentration Risk
  body: >-
    Nordic Knots' expansion motion runs through three channels: designer co-branding (which drives press reach and trade credibility more than disclosed direct revenue), hospitality/commercial installations (of which only one, Hotel Il Pellicano, is independently corroborated in this chapter's sample), and physical retail rollout (a posted US West Coast hiring role signals a planned fourth flagship, but with no confirmed date or address). Because the company discloses no customer-count, channel-mix, or contract-value data, concentration risk must be assessed qualitatively: the strongest public proof of trade and hospitality adoption currently rests on a small number of named relationships, so the loss or non-renewal of any one flagship collaboration would meaningfully weaken the company's most visible adoption evidence. The PRO trade channel's uncapped, ~24-hour approval process is a scalable growth lever, but it also means a growing share of revenue could shift toward trade discounting, and Nordic Knots does not disclose trade versus DTC gross margin to show whether that trade-off is being managed.
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU036
