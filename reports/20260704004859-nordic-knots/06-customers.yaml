    - At least five named collaborations disclosed since founding
    - Drives press reach and trade credibility more than direct revenue
    - Revenue attribution to collaboration SKUs is undisclosed
  - - Third-party trade retailers (e.g., Design Within Reach)
    - Retailer is payer/reseller; end consumer is user
    - Wholesale stocking of curated Nordic Knots SKUs
    - At least one named US trade retailer confirmed
    - Extends reach beyond owned channels; wholesale economics undisclosed
    - No disclosed wholesale volume or retailer count
  notes: >-
    Segments are derived from company disclosure and independent design-press coverage; no segment carries a disclosed customer count, order volume, or % of revenue, so 'scale signal' columns use the most specific evidence available rather than verified totals.
