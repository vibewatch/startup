- id: TU006
  title: Trade / PRO channel mechanics and diligence table
  columns:
  - Mechanic
  - Detail
  - Buyer implication
  - Source
  - Diligence ask
  rows:
  - - Application review
    - Verified professional-credential review, decision typically within ~24 hours
    - Filters out non-trade applicants, keeping the channel B2B-only
    - SU002
    - Request historical PRO approval and rejection rates
  - - Account exclusivity
    - Trade account is personal to a single business and may not be shared
    - Limits informal discount-sharing among smaller design firms
    - SU002
    - Request enforcement mechanism for account-sharing violations
  - - Pricing benefit
    - Trade discount applied across all products plus complimentary samples
    - Creates a structural incentive for firms to register instead of buying retail
    - SU002
    - Request average trade discount depth vs. DTC price
  - - Service benefit
    - Dedicated PRO account manager and expedited shipping
    - Signals investment in retaining higher-value repeat trade buyers
    - SU002, SU003
    - Request account-manager-to-PRO-account ratio
  - - Tax treatment
    - Possible sales-tax exemption for qualifying trade purchases
    - Adds a compliance dimension to trade-channel administration
    - SU002
    - Request tax-exemption documentation process and audit history
  notes: >-
    All mechanics are drawn from the company's own PRO program page; no independent source corroborates PRO account volume or trade-channel economics.
