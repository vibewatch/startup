companyProfile:
  summary: >-
    Nordic Knots is a Stockholm-founded luxury home-textiles brand built around Scandinavian design,
    premium natural materials, and a direct relationship with affluent U.S. consumers and trade buyers.
    The company has grown from a founder-led rug brand into a broader home offering spanning custom rugs,
    curtains, bedding, and décor, while retaining premium positioning through flagship showrooms,
    designer collaborations, GoodWeave-certified Indian rug production, and a newly won B Corp credential.
    Its underwriting challenge is not demand proof but evidence opacity: the business appears profitable and
    fast-growing, yet investors still lack audited statements, detailed customer-quality data, and cap-table clarity.
  founders:
    - name: Fabian Berglund
      role: Co-founder and Chief Executive Officer
      background: Former advertising creative with experience at Anomaly and Wieden+Kennedy; leads strategy and growth.
      claimRefs: [CO001, CO002, CO005]
    - name: Liza Berglund Laserow
      role: Co-founder and Chief Creative Director
      background: Former lawyer and antiques specialist from the Laserow family business, shaping the brand's design sensibility.
      claimRefs: [CO001, CO003, CO006]
    - name: Felix Berglund
      role: Co-founder and adviser
      background: Co-founded the company with Fabian and Liza and later stepped back from day-to-day operations into an advisory role.
      claimRefs: [CO001, CO004]
  foundingLocation: Stockholm, Sweden
  headquarters: Stockholm, Sweden
  productSummary: >-
    Nordic Knots sells handwoven rugs, custom-sized rugs, made-to-measure curtains, fabric by the yard,
    bedding, and décor. Products are designed in a Stockholm atelier, with rugs handwoven by artisans in
    and around Bhadohi, India and fabric-based products woven in Italian mills from materials including
    New Zealand wool, jute, and linen.
  customerFocus: >-
    Affluent design-conscious homeowners, interior designers, architects, and hospitality/trade buyers,
    with the United States described by management as the largest market and PRO membership serving the
    professional specification channel.
  businessModel: >-
