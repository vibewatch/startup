  topStrengths:
    - Nordic Knots combines premium design differentiation with reported 85% 2025 growth and 20%+ EBIT margin, an unusual mix for a consumer brand.
    - The brand now extends beyond rugs into curtains, bedding, décor, and trade/showroom relationships, increasing wallet-share potential without abandoning its core aesthetic.
    - GoodWeave certification and a newly earned B Corp credential reinforce the ethical and quality narrative that matters in luxury home furnishings.
    - The March 2026 syndicate brings credible consumer-brand backers and should provide runway for retail, product, and international expansion.
  topRisks:
    - The roughly $2.2 billion valuation implies about 31x LTM revenue, far above audited public home-furnishings comparables and still rich versus the best available private DTC comps.
    - Investors still lack audited financials, cash/burn visibility, cap-table terms, and store-level economics, limiting underwriting confidence.
    - India-centered rug manufacturing creates tariff, labor-compliance, capacity, and margin volatility that GoodWeave mitigates but does not eliminate.
    - Founder concentration and accelerated flagship expansion raise execution risk just as the company broadens categories and geographies.
    - Premium home-furnishings demand remains cyclical and sensitive to housing, macro confidence, and luxury-spending softness.
  unresolvedGaps:
    - Audited FY2025-FY2026 revenue, EBITDA/EBIT bridge, gross margin, working-capital, and cash-flow disclosure.
    - Current cap table, liquidation preferences, any secondary/tender terms, and the exact use-of-funds framework from the March 2026 round.
    - Customer repeat-purchase, retention, cohort behavior, and trade/DTC/hospitality channel mix or concentration data.
    - Named supplier/factory count, capacity, audit history, and contingency plans across India rug production and Italian fabric mills.
    - Store-level productivity and payback for New York, London, Stockholm, and Los Angeles expansion.
