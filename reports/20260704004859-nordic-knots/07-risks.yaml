- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: >-
    The clearest government-flagged risk is labor compliance: the US Department of Labor's List of Goods Produced by Child Labor or Forced Labor continues to list hand-knotted and hand-woven carpets from India, the exact product category Nordic Knots sources. GoodWeave certification -- which requires unannounced supply-chain audits down to home-based production -- is the company's primary mitigation, but it is a private, audit-based assurance rather than a government clearance, so the underlying category-level flag persists regardless of certification status. Tariff policy is the second major regulatory exposure: US duties on Indian goods rose from a combined 26% baseline-plus-reciprocal rate in April 2025 to a stacked 50% rate by late August 2025 (reciprocal plus a Russia-oil-linked surcharge), before the sanctions-linked portion was revoked in February 2026 and replaced with an 18% reciprocal tariff under a new US-India Interim Trade Framework -- a swing of roughly 50 percentage points within a single year with no evidence the swings have stabilized. Litigation risk to date is limited to a single, already-settled ADA website-accessibility case (Hernandez v. Nordic Knots, Inc., EDNY, filed October 2024 and dismissed December 2024 following a settlement notice) that legal commentary associates with a broader wave of boilerplate 'serial plaintiff' suits rather than a Nordic Knots-specific compliance failure. The company's US trademark registration is active and in good standing, and the current EU Deforestation Regulation does not cover wool textiles, though its scope is subject to periodic review.
