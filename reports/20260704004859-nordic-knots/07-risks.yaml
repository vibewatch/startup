chapter:
  number: 7
  title: Risks
  summary: >-
    Nordic Knots' most severe risks are structural: its entire hand-knotted rug line is produced by artisans in a single country (India), exposing it to volatile 2025-2026 US-India tariff swings (0% to 50% and back to an 18% reciprocal rate), labor-compliance dependence on GoodWeave certification for a product category the US Department of Labor still lists for child-labor risk, a closed 2024 ADA website-accessibility lawsuit (Hernandez v. Nordic Knots), and a founder-concentrated governance structure with one of three co-founders already stepped back into an advisory role, compounded by a capital-intensive multi-city flagship rollout into a luxury home-furnishings category facing a cautious 2026 demand outlook.
sections:
- id: risk-overview
  title: Severity-Ranked Risk Overview
  body: >-
    Nordic Knots' risk profile is dominated by structural concentration: its entire disclosed rug line is hand-knotted by artisans in a single country (India), and its curtain fabric is woven exclusively in unnamed Italian mills, leaving no disclosed manufacturing diversification. Layered on that concentration is a volatile 2025-2026 US-India tariff environment that moved from a 0% baseline duty on hand-knotted rugs to a stacked 50% rate in August 2025 and back to an 18% reciprocal tariff by February 2026 -- a swing the company has no disclosed hedge against. Regulatory/legal risk is real but partially mitigated: the US Department of Labor still lists Indian hand-knotted carpets as a child-labor-risk category, which Nordic Knots addresses through GoodWeave certification and B Corp status, and a 2024 ADA website-accessibility lawsuit (Hernandez v. Nordic Knots) was settled and dismissed within three months. Execution and governance risk stem from a founder-concentrated leadership structure -- one of three co-founders has already stepped back into an advisory role -- layered onto a capital-intensive, multi-city flagship rollout funded by a March 2026 growth round, all set against a luxury home-furnishings demand backdrop that Bain, Morgan Stanley, and J.P. Morgan each describe as cautious rather than expansionary in 2026.
