  topStrengths:
    - Nordic Knots 把高端设计差异化、2025 年据称 85% 增长和 20%+ EBIT 利润率放在一起；对消费品牌来说，这个组合并不常见。
    - 品牌已从地毯延伸到窗帘、床品、家居装饰和 trade/showroom 关系，不放弃核心审美的同时扩大钱包份额。
    - GoodWeave 认证和新取得的 B Corp 资质，强化了奢侈家居用品里很重要的伦理与品质叙事。
    - 2026 年 3 月轮次的投资方在消费品牌上有可信背书，应能为零售、产品和国际扩张提供跑道。
  topRisks:
    - 约 $2.2 billion 估值意味着约 31x LTM 收入，远高于经审计的上市家居用品可比公司，相比能找到的最佳私有 DTC 可比公司也仍偏贵。
    - 投资人仍看不到审计财务、现金 / 烧钱情况、股权条款和门店层面经济性，承销信心受限。
    - 以印度为中心的地毯制造带来关税、劳工合规、产能和利润率波动；GoodWeave 能缓释，但不能消除。
    - 创始人集中度叠加旗舰店快速扩张，公司又在拓品类和地理市场，执行风险抬升。
    - 高端家居需求仍有周期性，对住房市场、宏观信心和奢侈消费走弱敏感。
  unresolvedGaps:
    - FY2025-FY2026 经审计收入、EBITDA/EBIT 桥、毛利率、营运资本和现金流披露。
    - 当前股权结构、清算优先权、任何 secondary/tender 条款，以及 2026 年 3 月轮次资金用途框架的细节。
    - 客户复购、留存、cohort 行为，以及 trade/DTC/hospitality 渠道结构或集中度数据。
    - 具名供应商 / 工厂数量、产能、审计历史，以及印度地毯生产和意大利面料厂的应急计划。
    - New York、London、Stockholm 和 Los Angeles 扩张的门店坪效与回本周期。
