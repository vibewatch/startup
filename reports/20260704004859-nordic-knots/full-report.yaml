              Knots is privately held with no public filings, so leverage, working capital, and margin sensitivity
              cannot be independently verified; what is disclosed is a March 2026 growth round (~EUR86 million led by
              Imaginary Ventures at an approximate EUR1.9 billion valuation) explicitly earmarked partly for US-weighted
              retail expansion. Execution risk follows directly: a posted 'Regional Director, US West Coast' role
              signals active hiring for a new flagship, but no opening date, address, or lease terms are confirmed,
              leaving timeline risk around how quickly the new capital converts into revenue-generating stores. That
              execution is unfolding against a 100% India-sourced tariff exposure and a luxury home-furnishings demand
              backdrop that Bain, Morgan Stanley, and J.P. Morgan each characterize as cautious in 2026 -- a combination
