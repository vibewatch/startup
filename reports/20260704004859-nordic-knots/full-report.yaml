      - number: '7.3'
        title: Operational, Manufacturing, and Partner Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Nordic Knots' hand-knotted production model creates both a quality-control and a
              scalability risk: independent reviewers report noticeable wool shedding in the first months of use and
              fraying in jute/flatweave styles under high traffic, consistent with an artisanal, natural-fiber process
              that is difficult to scale quickly without multi-year artisan retraining. Trustpilot reviews add
              logistics-specific risk -- deliveries measuring smaller than advertised dimensions and slow resolution of
              at least one lost-shipment carrier dispute -- alongside an overall 'Average' 3.1-out-of-5 rating that
              signals inconsistent service execution rather than a systemic failure. Partner dependency is concentrated
              on two undisclosed manufacturing relationships (the India artisan network for rugs and unnamed Italian
              mills for curtain fabric), two private certification bodies (GoodWeave and B Lab) that anchor the
              company's compliance and ESG proof, a newly concentrated post-financing investor group (Imaginary
              Ventures, Creades, Iris Ventures) from the March 2026 round, and a single independently corroborated
              flagship hospitality reference (Hotel Il Pellicano) whose lapse would weaken the company's strongest
              public customer-proof point. Nordic Knots discloses no supplier names, factory counts, audit reports, or
              contract terms for either manufacturing dependency, so resilience cannot be verified beyond the
              certifications themselves. Competitively, Nordic Knots sits in a crowded middle tier -- between
              washable-rug DTC scale players like Ruggable and ultra-luxury hand-knotted specialists like The Rug
              Company -- without a disclosed structural moat beyond design and certification.
