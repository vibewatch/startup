            body: >-
              Nordic Knots is a GoodWeave-certified partner, and GoodWeave's certification model relies on independent,
              ongoing inspection of partner factories and workshops rather than a single one-time audit (CE013). Nordic
              Knots AB was separately certified a B Corporation in February 2026 with an overall Impact Score of 91.4
              against an 80-point minimum and a 50.9 median, though the assessment's 'Customers' sub-score (2.8) is
              notably lower than its Workers, Community, and Environment sub-scores, suggesting customer-facing
              safeguards are comparatively less developed than labor and environmental practices (CE014, CE041). The
              company also says it enforces a Supplier Code of Conduct through regular SMETA ethical-trade audits,
              though the underlying audit reports are not public (CE015). Notably, no reviewed Nordic Knots-owned page
