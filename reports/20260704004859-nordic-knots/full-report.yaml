      - number: '2.5'
        title: Diligence gaps, contradictory estimates, and market verdict
        blocks:
          - type: paragraph
            body: >-
              Taken together, the evidence supports a real, structurally growing category for premium home textiles, but
              not a precise, Nordic Knots-specific TAM. No reviewed source isolates 'premium DTC rugs and home textiles'
              from the broader carpet/rug, home-textile, or luxury-decor totals, and the two pairs of competing lenses
              (carpet/rug and home textile) diverge by billions of dollars and multiple CAGR points on the same nominal
              category. Tariff policy remains litigation-dependent, and the single most-cited furniture-demand driver —
              housing turnover — is itself contradicted between NAR's optimistic 2026 forecast and Furniture Today's
              more cautious industry read. Rather than resolving these gaps with a constructed point estimate, this
              analysis preserves the contradictions and directs diligence toward a bottoms-up model: Nordic Knots'
              actual price bands, target household counts, and trade/hospitality pipeline data would do more to bound
              the addressable market than any additional top-down report. The market verdict is that Nordic Knots
              operates in a real, multi-billion-dollar adjacent category with credible premiumization and sustainability
              tailwinds, but the public sizing evidence is not precise enough to underwrite a valuation on category
              growth alone.
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM024
              - CM027
              - CM033
              - CM034
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Every sizing lens points the same direction, but none is Nordic Knots-specific
            body: >-
              Five independent 2026 market estimates all show mid-single-digit to low-double-digit growth for
              carpet/rug, home textile, or luxury decor, but none isolates premium DTC rugs and home textiles as its own
              category. Any valuation argument should treat the reviewed figures as directional context, not a precise
              TAM for Nordic Knots.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
          - type: callout
            title: Tariff policy for imported rugs is still unresolved
            body: >-
              The 2025 Indian rug tariff spike to 50% was challenged in court and is reportedly being negotiated down to
              18%, but the outcome and refund process remain unsettled going into the back half of 2026, leaving
              near-term landed-cost assumptions uncertain for any import-dependent premium rug brand.
            calloutType: risk
            claimRefs:
              - CM025
              - CM027
              - CM028
