      - number: '4.5'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >
              Nordic Knots raised its first-ever external capital in a round announced March 27, 2026: widely reported
              at approximately $100m/€86m, led by Imaginary Ventures with Creades (SEK 105.4m for ~5%), Iris Ventures,
              and Lauren Santo Domingo's St Dominique Capital participating, at a valuation of roughly $2.2bn/€1.9bn. A
              deal-intelligence platform's contemporaneous record puts the raise at SEK 946.39m and the post-money
              valuation at SEK 20,820.58m (~$2.0-2.2bn depending on the FX rate applied), and identifies the instrument
              as convertible preferred stock -- a structural detail with real implications for the cap table
              (liquidation preference stacking, potential conversion triggers) that is not disclosed in any of the press
              coverage of the round. Separately, a February 2025 M&A-intelligence report indicates the founders had
              mandated Rothschild roughly 13 months earlier to explore "ownership options," implying the company
              evaluated a wider set of paths (potential sale, recapitalization) before settling on a minority
              growth-equity raise. No cash balance, monthly burn rate, runway, use-of-funds breakdown beyond qualitative
              statements (store buildout, product-line expansion, trade-channel staffing), or debt/project-finance
              obligations have been disclosed. The scale of physical retail expansion planned (Los Angeles in June 2026,
              further "key global cities" flagships) implies material capex and lease commitments that are entirely
              unquantified in public sources.
