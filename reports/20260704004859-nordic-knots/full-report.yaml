companyProfile:
  summary: >-
    Nordic Knots is a Stockholm-founded luxury home-textiles brand built around Scandinavian design, premium natural
    materials, and a direct relationship with affluent U.S. consumers and trade buyers. The company has grown from a
    founder-led rug brand into a broader home offering spanning custom rugs, curtains, bedding, and décor, while
    retaining premium positioning through flagship showrooms, designer collaborations, GoodWeave-certified Indian rug
    production, and a newly won B Corp credential. Its underwriting challenge is not demand proof but evidence opacity:
    the business appears profitable and fast-growing, yet investors still lack audited statements, detailed
    customer-quality data, and cap-table clarity.
