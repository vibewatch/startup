      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The clearest growth drivers are premiumization, e-commerce visualization, sustainability expectations, and
              a contested housing-turnover tailwind. Fitch Ratings' December 2025 outlook explicitly separates affluent
              consumers, who are benefiting from housing and financial-asset gains, from lower-income consumers facing
              budget constraints, a bifurcation that favors premium, affluent-targeted categories even inside a
              'deteriorating' 2026 discretionary retail sector. Wayfair's own 10-K discloses a 'View in Room 3D'
              augmented-reality tool and majority-mobile traffic, evidence that visualization technology is now a
              mainstream investment for visually led categories like rugs, reducing the return risk that has
              historically constrained online rug purchases. The Good Trade's 2026 sustainable-brand roundup documents
              rising consumer demand for ethical sourcing and artisan provenance, a positioning that matches Nordic
              Knots' own emphasis on master artisans and select mills. The clearest constraints are tariff exposure and
              consumer softness. Furniture Today reports that the U.S. raised tariffs on Indian goods to 50% in August
              2025, causing India's exports to the U.S. to fall 37.5% from May to September 2025, before the Supreme
              Court struck down the tariffs and the administration proposed cutting them to 18% — leaving cost stability
              for import-dependent rug brands unresolved. Layered on top, Fitch and Zacks both flag a soft 2026
              discretionary retail backdrop, and Williams-Sonoma's own Q1 fiscal 2026 earnings call guided to only 2%-6%
              comparable brand revenue growth. Finally, NAR's forecast of a 14% rebound in 2026 existing-home sales — a
              classic furniture-demand driver — is directly contradicted by Furniture Today's own reporting, which
              frames 2026 as 'normalization, not momentum,' so this driver is preserved here as contested rather than
              confirmed.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
          - type: table
            tableRef: TM004
            claimRefs:
