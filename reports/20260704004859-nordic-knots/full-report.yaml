          - type: callout
            title: Labor-compliance risk is mitigated, not eliminated
            body: >-
              GoodWeave certification and audited B Corp status are real, verifiable mitigations, but the US Department
              of Labor still lists Indian hand-knotted carpets as a child-labor-risk product category at the government
              level, so the underlying category risk persists alongside the company's private certifications.
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >
              The bull case for Nordic Knots rests on real, corroborated signals: a decade-old, founder-led brand that
              reached roughly SEK 670m (~$70m/~€61m) LTM revenue with an EBIT margin over 20% and 85% YoY growth in
              2025, an eight-market DTC footprint, a growing PRO/trade channel (~30% of customers), a four-city physical
              retail presence expanding to Los Angeles in June 2026, and a syndicate led by Imaginary Ventures (with a
              track record in Skims, Reformation, and Westman Atelier) alongside Creades, Iris Ventures, and Lauren
              Santo Domingo's St Dominique Capital. The anti-thesis is that every one of those figures is company- or
              investor-claimed, not audited; the round priced the company at roughly 31x LTM revenue -- far above the 5x
              multiple SKIMS commanded at a comparable revenue base and the 0.88x-1.0x multiples RH, Wayfair, and Arhaus
              trade at on audited public financials; the round issued convertible preferred stock whose liquidation
              preference and conversion terms are undisclosed; and category-wide structural risks (paid-acquisition cost
              inflation, working-capital intensity, reverse-logistics drag on bulky rugs) are unquantified for Nordic
              Knots specifically. The thesis depends on Nordic Knots being a generational brand exception; the
              anti-thesis is that the price already assumes that exception has happened.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: Financing context, entry discipline, and preference overhang
        blocks:
          - type: paragraph
            body: >
              Nordic Knots raised its first-ever external capital on March 27, 2026: widely reported at approximately
              $100m/€86m, at a valuation of roughly $2.2bn/€1.9bn, led by Imaginary Ventures with Creades (SEK 105.4m
              for ~5%), Iris Ventures, and St Dominique Capital participating. A deal-intelligence platform's
              contemporaneous record of the transaction puts the raise at SEK 946.39m and the post-money valuation at
              SEK 20,820.58m, and identifies the security issued as convertible preferred stock -- meaning new investors
              likely hold a liquidation preference (typically 1x non-participating at minimum in growth rounds of this
              type, though the exact multiple is undisclosed) that sits ahead of the founders' common equity in a
              downside scenario. No source discloses the number of preference stacks from any prior financing,
              option-pool sizing, or board-control provisions. A February 2025 M&A-intelligence report indicates the
              founders had mandated Rothschild roughly thirteen months earlier to explore "ownership options,"
              suggesting the company weighed a wider set of paths (potential sale, recapitalization) before settling on
              a minority growth-equity raise -- a process detail that argues for some price discipline (a competitive
              process rather than a single unsolicited term sheet) but does not by itself validate the resulting
              multiple. Entry discipline for a new investor today is weak: there is no independent audit of the revenue
              or margin figures underwriting the price, and the round's own instrument (convertible preferred with
              undisclosed terms) makes it impossible to model downside outcomes for common equity.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV007
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Comparable set -- public, private, and category context
        blocks:
          - type: paragraph
            body: >
              No direct public pure-play comparable exists for a premium DTC rug/home-textiles brand, so this chapter
              benchmarks Nordic Knots against the closest available reference classes. Public home-goods retailers with
              owned inventory -- RH ($3,440m FY2025 revenue, 44.07% gross margin, 11.26% operating margin, $3.19bn
              market cap, ~0.93x revenue), Williams-Sonoma ($7,807m revenue, 46.15% gross margin, 18.13% operating
              margin, $26.79bn market cap, ~3.43x revenue), Arhaus ($1,379m revenue, 38.89% gross margin, 6.44%
              operating margin, $1.22bn market cap, ~0.88x revenue), and Wayfair ($12,457m revenue, 30.22% gross margin,
              0.14% operating margin, $12.47bn market cap, ~1.0x revenue) -- all trade at 0.88x-3.43x trailing revenue
              on audited financials. Best-in-class private DTC consumer brands command richer but still far lower
              multiples: SKIMS was valued at $5bn in November 2025 against roughly $750m-$1bn+ revenue (~5-6.7x), while
              Reformation -- majority-acquired by Permira in 2019 -- reported $507.1m in fiscal 2025 net revenue and
              filed an S-1 to list on the NYSE (ticker REF) in June 2026 without yet disclosing a price range or
              valuation. Nordic Knots' ~$2.2bn valuation against ~$70m LTM revenue implies a multiple of roughly 31x --
              five to nine times richer than the best private DTC comp available and 9-35 times richer than the audited
              public comps. No M&A transaction in the premium rug/textiles category at comparable scale is publicly
              documented, so the comparable set itself is a material limitation of this valuation view, not just the
              multiple.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: table
            tableRef: TV004
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >
              In a bull case, Nordic Knots hits its own >$100m/€86m 2026 revenue guidance, sustains 20%+ EBIT margins as
              it scales physical retail and new product lines, and the brand achieves the kind of durable multi-category
              status that could someday justify a re-rating toward SKIMS-like multiples (~5-7x) -- still well below
              today's ~31x entry multiple, implying the current round is pricing in several years of flawless execution.
              In a base case, growth decelerates toward the company's own disclosed 3-year average (~60%/year) as the
              law of large numbers and category-wide CAC inflation (category benchmark CAC rose from $34 to $57 between
              2021 and 2024) bite, margins compress modestly as physical retail capex and working capital scale, and the
              company remains a strong but unexceptional profitable DTC brand -- a scenario in which the ~31x entry
              multiple would likely require a down round or a prolonged hold before any liquidity event re-rates it
              fairly. In a bear case, the category-wide failure patterns documented across 50 DTC brand collapses since
              2022 (paid-acquisition dependence, thin loyalty infrastructure, channel concentration) apply to Nordic
              Knots' next growth phase, working-capital strain from India-sourced handwoven inventory and multi-city
              retail buildout pressures cash despite EBIT profitability, and the convertible preferred stack leaves
              common equity holders exposed in any restructuring or down round. None of the three scenarios can be
              modeled with real precision because Nordic Knots discloses no cash flow, unit economics, or forward
              guidance beyond the single 2026 revenue target.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: table
            tableRef: TV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV016
              - CV020
              - CV022
              - CV024
              - CV026
      - number: '8.5'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              Nordic Knots has no disclosed IPO timeline, and the broader 2026 venture exit environment is mixed: Q1
              2026 global venture-backed exits above $1bn numbered only 21 companies worldwide (most in China), and the
              U.S. IPO market for new listings "slowed... amid a broader stock market selloff in software" even as
              late-stage private funding surged, per Crunchbase's Q1 2026 data -- a market backdrop that favors
              continued private ownership over a near-term public listing for a consumer-goods brand of Nordic Knots'
              scale. The most likely near-term outcomes are a subsequent private round (at a higher or, if execution
              disappoints, lower valuation), a strategic sale to a larger home/lifestyle group, or continued independent
              growth funded by its own EBIT profitability plus the new capital. Thesis-break triggers include: a
              subsequent financing at a flat or reduced valuation (a "down round" signal), disclosed cash burn that
              shortens runway meaningfully despite the new capital, a slowdown in the 85% YoY growth rate toward the
              category-typical range, disclosed inventory or receivables problems consistent with the working-capital
              risks flagged by independent analysts, or departure of the founder-operators who are the brand's primary
              asset.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
            tableRef: TV005
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.6'
        title: Recommendation, confidence, and final diligence asks
        blocks:
          - type: paragraph
            body: >
              Given a ~31x LTM-revenue entry multiple supported entirely by company- and investor-sourced figures, an
              undisclosed convertible-preferred cap-table structure, and category-wide structural risks that are
              well-documented in the abstract but unquantified for Nordic Knots specifically, the appropriate stance is
              research-more rather than buy or avoid: the brand's growth and profitability signals are credible and
              corroborated by multiple independent outlets and one regulated (Creades AB) disclosure, but the valuation
              is not supported by any audited financial evidence or a comparable transaction at a similar multiple. A
              future underwriting decision should be conditioned on: audited financial statements; cash-on-hand, burn,
              and runway; the certificate of designation for the convertible preferred (liquidation preference multiple,
              participation rights, conversion triggers, board control); inventory turns and channel-level unit
              economics; and a reconciled, single-currency figure for the round size and valuation given the ~10% spread
              across secondary sources. Absent those, no investor can independently verify whether the ~31x multiple
              reflects genuine scarcity value in a thinly covered category or a pricing outlier that outruns the
              company's own disclosed fundamentals.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV001
            claimRefs:
              - CV033
              - CV034
              - CV016
          - type: table
            tableRef: TV006
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV033
              - CV034
              - CV036
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV033
              - CV034
              - CV035
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Implied multiple is far outside any comparable range
            body: >
              Nordic Knots' ~$2.2bn valuation against ~$70m LTM revenue implies roughly 31x trailing revenue -- 5-9x
              richer than SKIMS (the richest private DTC comp at ~5-7x) and 9-35x richer than RH, Wayfair,
              Williams-Sonoma, and Arhaus, which trade at 0.88x-3.43x revenue on audited public financials.
            calloutType: risk
            claimRefs:
              - CV016
              - CV017
              - CV020
          - type: callout
            title: Convertible preferred terms are a black box
            body: >
              The March 2026 round issued convertible preferred stock, per a deal-intelligence platform's record of the
              transaction, but no source discloses the liquidation preference multiple, participation rights,
              anti-dilution terms, or board/governance provisions attached to it -- all of which matter more than the
              headline valuation in a downside scenario.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
          - type: callout
            title: Research-more, not buy or avoid
            body: >
              The growth and profitability story is credible and multiply corroborated, but the price is unsupported by
              audited evidence, comparable transactions, or disclosed cap-table terms; the recommendation is to gate any
              further underwriting on audited financials and the preferred-stock term sheet.
            calloutType: recommendation
            claimRefs:
              - CV033
              - CV036
