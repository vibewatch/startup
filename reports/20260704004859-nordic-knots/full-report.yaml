        title: Exhibits
        blocks:
          - type: callout
            title: Profitable, founder-led growth before any outside capital
            body: >-
              Nordic Knots reportedly grew revenue from roughly EUR 34M to about EUR 61M with a 20% EBIT margin while
              remaining self-funded for nearly a decade, only raising external capital in March 2026 on its own terms.
