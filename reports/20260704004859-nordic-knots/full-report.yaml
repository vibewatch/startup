      - number: '3.3'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots' own rug pages list prices from about $395 to $1,295 for standard rugs and roughly $625 to
              just over $1,000 for made-to-measure custom-sized rugs, placing it well above Ruggable's $89 entry price
              and Revival Rugs' roughly $100 entry price, though within Revival's upper range near $3,000. Loloi does
              not publish direct-to-consumer pricing at all, instead routing shoppers to third-party retailers, which
              trades pricing transparency for wholesale distribution breadth; RH similarly does not list per-unit rug
              prices, consistent with its in-Gallery, appointment-driven luxury sales process. No reviewed source
              discloses per-unit pricing for Beni Rugs or The Citizenry, leaving a real evidence gap on where those
              artisan-sourced peers sit relative to Nordic Knots on price. On capability, Nordic Knots and Ruggable both
              offer trade/pro pricing programs, but only Ruggable's is shown to explicitly include hospitality buyers;
              Nordic Knots PRO's own pages describe designer and architect benefits without naming hospitality clients.
              On design credibility specifically, Nordic Knots and Loloi both show named external designer
              collaborations (Alex Eagle & Sophie Hodges; Joanna Gaines and others), while Ruggable's collaborations
              lean more toward mass licensing partners (Anthropologie) than couture design credentials.
