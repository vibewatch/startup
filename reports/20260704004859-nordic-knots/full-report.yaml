              Fitch's 2026 outlook explicitly separates affluent consumers (benefiting from housing and asset-price
              gains) from lower-income consumers facing budget constraints. Nordic Knots' premium price points make this
              bifurcation, rather than aggregate discretionary spending, the more relevant demand signal to track.
            calloutType: assumption
