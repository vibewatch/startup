      - number: '1.4'
        title: Scale, Cover Metrics, and Milestone Chronology
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots has previously reported approximately EUR 34 million in annual revenue and EUR 6.9 million in
              profit in an earlier, undisclosed fiscal year, with revenue reportedly climbing to about EUR 61 million in
              2025 at a 20% EBIT margin, and Fabian Berglund telling WWD that sales grew roughly 85% in 2025 versus 2024
              (CO016, CO017, CO018). The company is targeting more than $100 million in revenue for 2026, which it
              frames as its 10th-anniversary year (CO019). None of these figures are independently audited, and Nordic
              Knots does not publicly disclose total headcount or active customer counts, leaving both as explicit gaps
              against the cover-metrics requirement (CO044; see evidenceGaps). On the milestone chronology, the
              company's growth was aided by the pandemic-era home-renovation boom (CO030), then built out physical
              retail sequentially: a Stockholm flagship in a converted 1918 cinema (March 2023), a first US flagship in
              SoHo, New York (mid-2024), a six-month showroom residency in London's Mount Street (October 2025), and a
              planned Los Angeles flagship (June 2026) (CO026, CO027, CO028, CO029). Studio Giancarlo Valle designed
              both confirmed flagship stores, making it a recurring physical-retail design partner (CO035). Product
              milestones include recurring named-designer collaborations with Campbell-Rey, Michelle R. Smith of Studio
              MRS, and Andre Mellone of Studio Mellone (CO031, CO032, CO033, CO034). Sources disagree on the exact year
              of the first Campbell-Rey collaboration, with one profile citing 2021 against the designers' own account
              of 2022 in Homes & Gardens (CO032 contradicts CO031), illustrating that even well-covered brand milestones
              can carry sourcing inconsistencies.
