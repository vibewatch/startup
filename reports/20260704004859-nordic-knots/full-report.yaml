  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Scenario
      - Key assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - 2026 revenue exceeds $100m/EUR86m guidance; EBIT margin holds at 20%+; multi-category expansion succeeds
        - >-
          Multiple would need to compress toward ~5-7x (SKIMS-like) over several years for the entry price to be
          justified by fundamentals rather than scarcity alone
        - Execution risk on 4+ new store openings and 2+ new product categories simultaneously
        - 'Low-medium: requires flawless multi-year execution with no disclosed contingency plan'
      - - Base
        - >-
          Growth decelerates toward the disclosed ~60%/year 3-year average; margins compress modestly as retail capex
          and working capital scale
        - >-
          At ~$100-130m revenue in 2-3 years, the current ~$2.2bn valuation implies ~17-22x, still well above comps; a
          flat or modestly up round is the likely next financing outcome
        - >-
          Category-wide CAC inflation ($34 to $57 avg 2021-2024); reverse-logistics drag on bulky rugs (19-23% category
          return rates)
        - 'Medium: consistent with the company''s own historical growth trend'
      - - Bear
        - >-
          Growth slows sharply toward category-typical rates; working-capital strain from India-sourced inventory and
          retail buildout pressures cash despite EBIT profitability
        - >-
          A down round or distressed sale becomes plausible; convertible preferred stack leaves common equity exposed
          first
        - >-
          DTC brand-failure patterns (paid-acquisition dependence, thin loyalty infrastructure, channel concentration)
          documented across 50 comparable brand collapses since 2022
        - >-
          Low-medium: no NK-specific evidence of distress today, but the category base rate for premium DTC failure is
          material
    notes: >-
      Valuation/return logic figures are illustrative, derived from applying category-benchmark multiples to scenario
      revenue assumptions; Nordic Knots has not published its own scenario guidance beyond the single 2026 revenue
      target.
