      - number: '3.4'
        title: Switching cost, lock-in, distribution power, and supply access
        blocks:
          - type: paragraph
            body: >-
              Switching costs differ by product architecture. Ruggable's two-piece washable design (a printed cover plus
              a separate non-slip pad) encourages repeat purchases of new covers rather than a one-off heirloom
              purchase, a soft recurring-revenue mechanism Nordic Knots' single-piece rugs do not share. Nordic Knots'
              own made-to-measure and custom-sized products create a different kind of lock-in: once a rug or curtain is
              cut to a customer's exact room dimensions, replacing it with a generic competitor SKU requires
              re-measuring and re-customizing, which favors repeat orders from the same brand for future rooms. On
              distribution power, Loloi's wholesale/trade network of dealers and showrooms and RH's Gallery real estate
              both reach far more households than Nordic Knots' direct-online-plus-two-flagship-showroom model, giving
              both incumbents materially greater shelf presence. On supply access, Beni Rugs and Revival Rugs each
              depend on named-country artisan networks (Morocco for Beni; Turkey, Morocco, and India for Revival) in a
              manner directly comparable to Nordic Knots' own reliance on 'select mills' — meaning all three brands'
              competitive durability rests on maintaining specific supplier relationships rather than a diversified,
              interchangeable supply base.
