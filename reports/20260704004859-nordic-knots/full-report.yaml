  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Tariff-driven margin compression
        - Effective US tariff rate on Indian textile imports
        - Reciprocal tariff rises materially above the current 18% or a new India-specific surcharge is announced
        - Reassess pricing strategy and gross-margin outlook; downgrade near-term growth expectations
      - - Labor-compliance/reputational risk
        - GoodWeave or B Corp certification status
        - Certification lapse, suspension, or an adverse audit finding made public
        - Treat as a material governance red flag requiring immediate supplier-level diligence
      - - Litigation recurrence
        - New ADA, consumer-protection, or labor-related legal filings
        - A second unrelated lawsuit is filed against Nordic Knots, Inc. or Nordic Knots AB
        - Escalate legal-risk review; assess whether the Hernandez case reflects a broader compliance pattern
      - - Retail rollout execution
        - Confirmed opening date for the next flagship (e.g., US West Coast)
        - Opening slips beyond the timeline implied by current hiring activity, or is cancelled
        - Reassess capital-deployment efficiency and the pace of the company's US growth strategy
      - - Key-person continuity
        - Public disclosure of any additional founder departure or change in CEO/creative-director role
        - Either remaining operating co-founder (Fabian Berglund or Liza Berglund Laserow) exits an operating role
        - Treat as a high-severity governance event requiring reassessment of brand and product continuity
      - - Luxury-demand cyclicality
        - Bain/Morgan Stanley/J.P. Morgan quarterly luxury-sector outlook updates
        - Consensus luxury-sector growth forecast turns negative rather than merely cautious
        - Reassess demand assumptions underlying the company's retail expansion plan
    notes: >-
