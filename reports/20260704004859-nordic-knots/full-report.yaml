      - number: '3.2'
        title: 'Competitor profiles: scale, funding, target customer, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              Ruggable, founded in 2017 by Jeneva Bell in Los Angeles, built its business around a patented two-piece
              washable rug design, has expanded to more than 1,000 designs, and runs a dedicated trade/hospitality
              program, though it laid off 100 corporate employees in January 2023 and competes against more than a dozen
              named lower-price alternatives. Loloi, founded in Dallas in 2004 by Amir Loloi and now co-run by his sons
              Steven and Cyrus, has built a two-decade wholesale/trade-first business anchored by high-profile
              named-designer collaborations such as Joanna Gaines' Magnolia Home. Revival Rugs sources vintage and new
              rugs directly from curators in Turkey, Morocco, and India, selling factory-direct at prices from about
              $100 to roughly $3,000. Beni Rugs, founded in 2018 by Robert Wright and Tiberio Lobo-Navia, runs a roughly
              55-loom Moroccan weaving studio paying artisans well above the national average, and shows no disclosed
              institutional funding as of mid-2026, making it the most bootstrapped competitor reviewed. RH, by
              contrast, is an order of magnitude larger: its fiscal 2025 Form 10-K reports $3,440 million in
              consolidated net revenue, up 8.1% year over year, and describes an integrated Gallery and
              hospitality-adjacent strategy far beyond Nordic Knots' current scale. Parachute Home, founded in 2013 with
              roughly $35-47 million raised, expanded to 26 stores before cutting back to 7 by mid-2025 after its CEO
              acknowledged the company had 'overreached.' The Citizenry, founded in 2014, raised a $20 million Series B
              in 2021 after growing sales more than 200% since its 2019 Series A, competing as a broader artisan-sourced
              global decor brand rather than a rug-first specialist.
            claimRefs:
              - CP005
              - CP009
              - CP012
              - CP014
              - CP015
