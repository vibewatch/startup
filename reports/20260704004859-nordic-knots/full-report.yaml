      - number: '4.6'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              Nordic Knots presents a coherent growth-and-profitability narrative -- 85% YoY growth, 20%+ EBIT margin,
              an eight-market DTC footprint, and a credible institutional/strategic investor syndicate -- but every
              quantitative claim underwriting that narrative originates from the company or its newly-minted investors
              around a single financing announcement, corroborated mainly by Creades AB's own regulated (but high-level)
              disclosure rather than by audited financial statements. Revenue quality is unverifiable at the line-item
              level (channel mix, product-line mix, one-time vs. recurring items); the margin path is asserted rather
              than shown (no multi-year P&L, no gross margin, no unit economics); and capital intensity is structurally
              likely (physical retail buildout, India-sourced handwoven inventory, multi-market fulfillment) but
              entirely unquantified. Differences across secondary sources in round size (SEK 946.39m vs. SEK 870m vs.
              EUR 92.59m vs. the widely quoted $100m/€86m) and valuation (SEK 20,820.58m vs. "SEK 2.2bn" vs.
              $2.2bn/€1.9bn) further illustrate how imprecisely private-market terms propagate through press coverage.
              The critical diligence blockers are: audited financial statements (income statement, balance sheet, cash
              flow); cash-on-hand, burn, and runway; inventory turns and days-of-inventory; CAC/AOV/contribution margin
              by channel; and full cap-table terms for the newly issued convertible preferred stock. For scale, RH,
              Wayfair, and Arhaus each trade at roughly 0.88x-1.0x trailing revenue on their audited public financials,
              underscoring how far Nordic Knots' implied private valuation multiple sits outside the range supported by
              mature, audited peers -- a point developed further in the Valuation chapter.
            claimRefs:
              - CI029
              - CI030
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
              - CI037
              - CI038
              - CI039
