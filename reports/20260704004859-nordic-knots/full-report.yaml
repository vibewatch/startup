      - number: '4.3'
        title: Cost structure, margin drivers, and working capital
        blocks:
          - type: paragraph
            body: >
              Nordic Knots reports an EBIT margin "over 20%" / "just over 20%" on LTM revenue of SEK 670m, per its lead
              new investor Creades AB's own regulated press release and multiple press accounts of the March 2026 round.
              In the most recently disclosed prior fiscal year, the company reported turnover of SEK 377m (~€34m) and
              profit of SEK 75m (~€6.9m), an implied ~20% net margin, broadly consistent with the newer EBIT figure,
              though the two periods use different profit definitions (net profit vs. EBIT) and neither is drawn from a
              published, audited income statement. No gross margin, SG&A ratio, or cost-of-goods breakdown has been
              disclosed. For context, public home-goods comparables with owned inventory (Williams-Sonoma, Arhaus, RH)
              report gross margins of 38-46% and operating margins of 6-18% on scaled, audited financials, while
              independent analysis of the same comparables' SEC filings shows they finance 110-145 days of inventory
              (turns of 2.65x-3.26x), a structural cash drag common to rug and furniture retailers that hold physical
              stock, produce to lead time, and pay supplier deposits before goods ship. Nordic Knots manufactures via
              handwoven production in India under a GoodWeave ethical-sourcing partnership -- a model that typically
              carries longer lead times and working-capital intensity than domestically drop-shipped goods -- but the
              company discloses no inventory turns, days-of-inventory, supplier payment terms, or return-rate data of
              its own, so its cash-conversion profile relative to the public comparables cannot be verified.
