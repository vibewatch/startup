  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing model, and mix
        blocks:
          - type: paragraph
            body: >
              Nordic Knots generates revenue primarily through direct-to-consumer (DTC) e-commerce sales of handwoven
              wool and jute rugs, supplemented by a growing curtains/shades and bedding-and-decor textiles line launched
              in 2025, plus a wholesale-adjacent "PRO" trade channel serving architects and interior designers. The
              company's own site organizes the assortment into three merchandising pillars -- Rugs, Curtains & Shades,
              and Bedding & Decor -- with machine-readable product feeds published per market (Sweden, UK, EU, US,
              France, Germany, Austria, Switzerland), confirming an eight-market direct commerce footprint. List prices
              for rugs range from roughly $300 for small accent pieces to $2,500+ for large-format pieces, with a
              standard 5x8 handwoven wool rug priced around $1,200 before shipping ($75-150) or custom duties,
              positioning the brand in a premium-accessible tier above mass-market retailers (West Elm, Pottery Barn)
              but below ultra-luxury custom rug houses. Design professionals reportedly account for roughly 30% of the
              customer base, and the company is staffing up its trade program and online trade portal ("Nordic Knots
              PRO") to grow that channel, which typically carries a trade discount against list pricing. Because Nordic
              Knots is privately held, none of revenue mix by channel (DTC vs. PRO vs. physical retail), by product line
              (rugs vs. textiles vs. bedding), or by geography beyond the disclosed ~69% US share is broken out in any
              public filing -- all figures below are as reported by the company, its lead financial-round participant,
              or press coverage of the March 2026 financing, not from audited segment reporting.
