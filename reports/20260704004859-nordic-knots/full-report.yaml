              color, aided by a masking-tape sizing method the company recommends before ordering), optionally adds a
              free digital or in-store design consultation, then purchase, production or fulfillment, and finally
              receipt, care, and ongoing support (CE029, CE003). Made-to-measure curtains and Roman shades are delivered
              in 1-3 weeks, and the PRO trade program layers dedicated account management and a 24-hour application
