            title: Fulfillment and durability complaints during rapid scale-up
            body: >-
              Independent reviewers report recurring shipping delays, marketing-vs-delivered color mismatches, and
              durability concerns (shedding, fraying) that could compound as the company adds flagship stores and SKUs.
