              breakdown for any of these segments -- the PRO program page describes benefits and a roughly 24-hour
              vetted approval process, but not how many trade accounts are active, and the About page describes
              production geography (Stockholm design, India hand-knotting, Italian curtain mills) without any
              segment-level sales figures. Segmentation in this chapter is therefore built from company channel design
              corroborated by independent design-press coverage of each channel, not from disclosed customer metrics.
