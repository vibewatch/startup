            body: >-
              Nordic Knots' strongest disclosed mitigations are its two private certifications -- GoodWeave for labor
              compliance and B Corp for broader ESG governance -- both of which involve recurring third-party audits and
              re-assessment rather than a one-time badge. Beyond certification, the company discloses no tariff hedge,
              no named supply-chain contingency, and no publicly confirmed timeline for its next flagship store, so most
              other risks in this chapter remain unmitigated as of the run date. Monitorable kill criteria center on six
              triggers: a further rise in the effective US-India tariff rate above the current 18% reciprocal level; a
              lapse or adverse finding in either the GoodWeave or B Corp certification; a second, unrelated legal filing
              against the company; a confirmed slippage or cancellation of the next flagship opening; departure of
              either remaining operating co-founder from an operating role; and a shift from 'cautious' to outright
              negative luxury-sector demand forecasts from major research houses. Each of these is independently
              observable through public sources and would materially change the risk-adjusted view of the company
