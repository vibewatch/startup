      - number: '2.3'
        title: Buyer, user, and payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots' public surfaces point to four buyer segments with different budget owners and adoption
              triggers. The affluent DTC homeowner is buyer, user, and payer in one, discovering products through
              editorial and lookbook content before ordering made-to-measure pieces online. The interior designer or
              trade client operates through Nordic Knots PRO, a trade membership offering trade pricing, free samples,
              dedicated account managers, and early access to launches, where the designer specifies the product but the
              client ultimately pays, often at a designer markup. Nordic Knots' flagship stores in New York (6 Greene
              Street) and London (Mount Street) serve a showroom-conversion role for both local affluent shoppers and
              designers, offering walk-in and appointment-based consultations rather than functioning as the primary
              volume channel. A fourth, less-proven segment is hospitality and commercial trade accounts: Nordic Knots'
              trade FAQ and PRO pages describe a formal trade-account application path, but no reviewed public source
              confirms an active hospitality contract-procurement program comparable to incumbents such as RH, whose own
              10-K describes a far larger $3.44 billion luxury home-furnishings business built around integrated
              Galleries. Precedence Research's finding that offline distribution still captured roughly two-thirds of
              global home-textile purchases in 2025 supports the case that Nordic Knots' showroom investment targets a
              still-dominant, not legacy, purchase channel.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM035
              - CM038
          - type: table
            tableRef: TM003
