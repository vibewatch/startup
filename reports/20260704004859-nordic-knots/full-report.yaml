  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots competes directly with Ruggable, Loloi, Revival Rugs, and Beni Rugs in premium or
              design-forward rug sales, while RH is a much larger luxury home-furnishings incumbent and The Citizenry
              and Parachute Home are adjacent premium DTC home-textile brands rather than rug-first competitors. The
              clearest status-quo substitute is not a premium peer at all: Wayfair's mass online marketplace, backed by
              $12.46 billion of fiscal 2025 net revenue and its own private-label rug brands, is the default channel for
              a buyer who is not specifically seeking a premium or design-led product. No reviewed public source
              documents a formal in-house-build alternative — an independent local workroom or bespoke rug dealer is the
              plausible but undocumented status-quo substitute for a fully custom order, and this gap is preserved
              rather than guessed at. The landscape is not static: Home Accents Today's 2026 rug-report coverage shows
              an established incumbent (Couristan, celebrating its 100th anniversary) and newer challenger labels
              (Rug'Society, Ege Carpets) all launching collections in the same period, evidencing continuous new
              entrants and refreshed incumbent activity rather than a fixed set of rivals.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
