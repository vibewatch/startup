  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and adjacent categories
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots' own canonical site structure defines its assortment as rugs, custom-sized rugs, wall-to-wall
              carpets, made-to-measure curtains, fabric by the metre, and bedding/decor, which means the correct market
              boundary is premium, direct-to-consumer home textiles rather than area rugs alone. Included spend covers
              hand-knotted and made-to-measure rugs, tailored wall-to-wall carpet, custom curtains, and adjacent
              bedding/décor sold at premium price points through the company's own digital and flagship-store channels.
              Excluded spend covers mass-market machine-made rugs, big-box broadloom carpet installed by general
              contractors, and unrelated furniture categories. The clearest adjacent spend categories are
              interior-design services, hospitality FF&E procurement, and the broader sustainable/artisan home-goods
              movement documented by independent trend coverage. The most important status-quo substitute is not a
              direct premium competitor but the mass online marketplace channel: Wayfair's own 10-K describes a
              private-label, algorithmically merchandised home-goods platform generating $12.46 billion of net revenue
              in fiscal 2025, illustrating the scale of commodity alternatives that a design-led, premium brand must
              differentiate against on craftsmanship, customization, and trust rather than price or selection breadth.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM019
      - number: '2.2'
        title: Multiple sizing lenses and their methodology limits
        blocks:
          - type: paragraph
            body: >-
              No single public report sizes 'premium direct-to-consumer rugs and home textiles' as its own category, so
              this analysis triangulates five adjacent lenses instead of citing one broad TAM. Grand View Research puts
              the global carpet and rug market at $64.7 billion in 2026, growing at a 7.1% CAGR to $113.7 billion by
              2033, while Fortune Business Insights estimates the same nominal category at $70.26 billion in 2026
              growing at 11.75% CAGR to $170.87 billion by 2034 — a divergence of roughly $5.5 billion in base value and
              more than 4.6 CAGR points that shows even the broadest lens is unsettled. The home-textile lens shows a
              similar pattern: Mordor Intelligence sizes it at $145.29 billion in 2026 (6.31% CAGR to 2031) versus
              Precedence Research's $158.16 billion (6.02% CAGR to 2035), a roughly $13 billion gap on the same nominal
              category. The narrowest and most relevant lens, Intel Market Research's luxury home decor estimate of
              $16.21 billion in 2026 growing at 3.8% CAGR to $20.14 billion by 2034, still spans luxury furniture, art,
              and lighting spend well beyond rugs and textiles. Divergent methodology and category scope — not
              necessarily disagreement about the underlying market — most plausibly explain these gaps, but the
              practical implication for diligence is the same: any single cited TAM figure should be treated as one of
              several plausible envelopes rather than a precise number.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM034
