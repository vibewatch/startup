      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >
              Nordic Knots' go-to-market blends performance/brand digital marketing for its DTC channel with a
              relationship-driven trade/PRO motion and, since 2023-2025, physical flagship stores in New York (Greene
              Street, SoHo) and Stockholm, with a London location and a Los Angeles (West Hollywood) flagship scheduled
              to open in June 2026. No customer acquisition cost (CAC), average order value (AOV), payback period, or
              channel-level conversion data has been disclosed by the company itself. Independent operator benchmarking
              of the broader home-goods DTC category (compiled from SEC EDGAR filings of six public comparables) puts
              typical CAC at $60-120 per order and AOV at $240-270 for furniture-weighted assortments (versus $50-150
              for smaller decor/textiles brands), with realized gross margin bands of 40-55% before the true per-order
              profit (after paid acquisition, freight, and returns) narrows to roughly 10-20%. Nordic Knots' list
              pricing ($300-$2,500+ per rug) sits toward the higher end of that AOV band, which would structurally
              support better payback economics than a typical sub-$150-AOV decor brand, but there is no company-specific
              data to confirm actual CAC, contribution margin, or channel mix, making this an inference from category
              benchmarks rather than a verified metric.
            claimRefs:
