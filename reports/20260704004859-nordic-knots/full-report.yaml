      - number: '3.5'
        title: Moat durability, commoditization risk, and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots' clearest evidenced moat is design credibility: its 2026 EDIDA floor-covering win with
              designers Alex Eagle and Sophie Hodges is independent, third-party recognition that no reviewed
              mass-market or wholesale-only competitor has been shown to match in combination with true made-to-measure
              sizing. That said, commoditization risk is real and specific: Home Accents Today's 2026 rug-report
              coverage shows Ruggable partnering with Anthropologie on a tufted rug line explicitly described as
              blending 'Scandinavian flat-weave geometry' with other motifs at price points starting near $139 —
              concrete evidence that Nordic Knots' core aesthetic language can be echoed by a much lower-priced mass
              competitor. On the adverse side, Ruggable's January 2023 layoff of 100 corporate employees and Parachute
              Home's 2024-2025 retrenchment from 26 stores to 7 (with its CEO acknowledging the company 'overreached')
              both show that even well-funded, well-known DTC and premium home-textile peers have faced real cost and
              channel-strategy setbacks recently; the same coverage explicitly places Parachute alongside other DTC-era
              brands, including Casper, Glossier, and Peloton, that have struggled after early booms. No comparable
              adverse event was found in reviewed sources for Loloi, Revival Rugs, Beni Rugs, RH, or The Citizenry.
              Overall, no single competitor beats Nordic Knots on every dimension at once — each is strongest on one
              axis only — so the durability question is less about any one rival and more about whether Nordic Knots can
              defend design credibility and custom sizing while price pressure builds from below and distribution/scale
              pressure builds from above.
            claimRefs: []
          - type: figure
            figureRef: FP003
            claimRefs:
