              Nordic Knots sells Scandinavian-influenced home textiles across rugs (plush, flatweave, handwoven,
              high-pile, and outdoor where applicable), made-to-measure curtains and Roman shades, wall-to-wall carpet,
              custom-sized rugs, bedding, decor, and fabric sold by the yard, organized on its own site by room, style,
