  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Product Model
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots is a Stockholm-founded, family-run home-textiles company that designs Scandinavian-influenced
              rugs, curtains, bedding, and decor, positioning itself between inexpensive mass-market rugs and very
              expensive custom options (CO001, CO042). The company was founded in 2016 by Fabian Berglund, his wife Liza
              Berglund Laserow, and Fabian's brother Felix Berglund, with the idea reportedly taking shape while the
              couple were living in New York (CO001, CO007). Its head office sits on Birger Jarlsgatan in central
              Stockholm, with a second and growing team based in New York (CO008). The core assortment spans rugs,
              custom-sized rugs, wall-to-wall carpet, made-to-measure curtains and shades, fabric sold by the yard, and
              bedding and decor, sold through direct e-commerce storefronts localized for Sweden, the broader EU, the
              UK, Germany, France, Switzerland, and the US (CO009, CO041). Design work is centered in the Stockholm
              atelier, while rugs are handwoven by artisans in and around Bhadohi, Uttar Pradesh, India, and fabric
              products are woven in Italian mills, primarily from New Zealand wool and natural jute (CO020, CO021,
              CO022). This identity-to-manufacturing-to-customer chain, and the capital and compliance dependencies
              layered on top of it, are summarized in the snapshot logic figure below.
            claimRefs:
              - CO001
              - CO007
