  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down round or flat round at next financing
        - Valuation at or below ~$2.2bn at next raise
        - Directly falsifies the market's willingness to pay the current multiple
        - Reassess entry price and cap-table protections immediately
      - - Disclosed cash burn shortens runway materially
        - Any disclosed monthly burn implying <18 months runway post-raise
        - Signals the EBIT-margin story does not translate into cash generation
        - Request updated cash-flow statement and revised use-of-funds plan
      - - Revenue growth decelerates toward category norms
        - YoY growth falls below ~30-40% for two consecutive periods
        - Undermines the growth premium embedded in the ~31x multiple
        - Re-run scenario model with reduced growth assumptions
      - - Working-capital or inventory problems surface
        - Disclosed inventory write-downs, stockouts, or supplier payment disputes
        - Confirms the unquantified working-capital risk flagged for India-sourced handwoven production
        - Request inventory aging and supplier-term disclosure
      - - Founder departure or material role change
        - Either Berglund co-founder exits an operating role
        - Removes the primary brand/creative asset underwriting the thesis
        - Treat as a fundamental thesis break, not a governance footnote
      - - Category-wide DTC failure pattern emerges at Nordic Knots
        - Evidence of paid-acquisition dependence, channel concentration, or loyalty-program absence
        - Matches the documented pattern behind 50 DTC brand collapses since 2022
        - Request channel-mix and repeat-purchase data before further capital commitment
    notes: >-
      Thresholds are illustrative diligence triggers based on category norms and the specific gaps identified in this
      chapter and the Financials chapter (restated locally here), not company-disclosed covenants.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner/diligence path
    rows:
      - - Audited financials
        - Income statement, balance sheet, cash-flow statement
        - Cannot verify any revenue, margin, or growth figure underwriting the ~31x multiple
        - Request as a condition of further underwriting
      - - Cap-table terms
        - >-
          Certificate of designation for the March 2026 convertible preferred (liquidation preference, participation,
          anti-dilution, board rights)
        - Materially affects common-equity value in any downside or exit scenario
        - Request from company counsel or the round's lead investor
      - - Cash position and burn
        - Current cash on hand, monthly burn, runway
        - EBIT profitability does not guarantee cash generation given working-capital intensity
        - Request CFO briefing or cash-flow statement
      - - Unit economics
        - CAC, AOV, contribution margin, inventory turns by channel
        - Needed to assess whether the 20% EBIT margin is durable or inflated by one-time items
        - Request management accounts / contribution-margin waterfall
      - - Reconciled financing terms
        - A single authoritative figure for round size and valuation in one currency
        - Secondary sources disagree by roughly 10% on round size and valuation
        - Request the signed subscription agreement or a company-confirmed figure
      - - Comparable transaction benchmark
        - Any M&A or financing transaction in the premium rug/home-textiles category at comparable scale
        - Without one, the ~31x multiple cannot be benchmarked against a true category peer
        - Commission a bespoke comparable-transaction search via a banker or data provider with private-deal coverage
    notes: >-
      This table consolidates the diligence blockers raised throughout the chapter into a single enumeration for
      underwriting sign-off.
    enumerationScope:
