    approximationNotes: "Structural-exposure ratings are qualitative, derived from category benchmarks (Eightx analysis) and the nature of NK's India-sourced handwoven supply chain, not from Nordic Knots-specific cash-flow data, which is entirely undisclosed."
    claimRefs: [CI014, CI015, CI026, CI027]
