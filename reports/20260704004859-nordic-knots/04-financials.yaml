schemaVersion: "report-v2"
artifact: financials
slug: nordic-knots
runDate: 2026-07-04
company:
  name: Nordic Knots
chapter:
  number: 4
  title: Financials
  summary: "Nordic Knots discloses a striking headline financial picture -- roughly $70M/SEK 670m LTM revenue, 85% YoY growth, and a 20%+ EBIT margin -- entirely through investor and press disclosures around its March 2026 raise, with no audited financial statements, cash position, burn rate, or inventory metrics available to underwrite the story independently."
sections:
  - id: revenue-model-and-mix
    title: Revenue streams, pricing model, and mix
    body: >
      Nordic Knots generates revenue primarily through direct-to-consumer (DTC) e-commerce sales of
      handwoven wool and jute rugs, supplemented by a growing curtains/shades and bedding-and-decor
      textiles line launched in 2025, plus a wholesale-adjacent "PRO" trade channel serving architects
      and interior designers. The company's own site organizes the assortment into three merchandising
      pillars -- Rugs, Curtains & Shades, and Bedding & Decor -- with machine-readable product feeds
      published per market (Sweden, UK, EU, US, France, Germany, Austria, Switzerland), confirming an
      eight-market direct commerce footprint. List prices for rugs range from roughly $300 for small
      accent pieces to $2,500+ for large-format pieces, with a standard 5x8 handwoven wool rug priced
      around $1,200 before shipping ($75-150) or custom duties, positioning the brand in a
      premium-accessible tier above mass-market retailers (West Elm, Pottery Barn) but below
      ultra-luxury custom rug houses. Design professionals reportedly account for roughly 30% of the
      customer base, and the company is staffing up its trade program and online trade portal ("Nordic
      Knots PRO") to grow that channel, which typically carries a trade discount against list pricing.
      Because Nordic Knots is privately held, none of revenue mix by channel (DTC vs. PRO vs. physical
      retail), by product line (rugs vs. textiles vs. bedding), or by geography beyond the disclosed
      ~69% US share is broken out in any public filing -- all figures below are as reported by the
      company, its lead financial-round participant, or press coverage of the March 2026 financing, not
      from audited segment reporting.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
  - id: gtm-sales-efficiency
    title: GTM motion and sales-efficiency proxies
    body: >
      Nordic Knots' go-to-market blends performance/brand digital marketing for its DTC channel with a
      relationship-driven trade/PRO motion and, since 2023-2025, physical flagship stores in New York
      (Greene Street, SoHo) and Stockholm, with a London location and a Los Angeles (West Hollywood)
      flagship scheduled to open in June 2026. No customer acquisition cost (CAC), average order value
      (AOV), payback period, or channel-level conversion data has been disclosed by the company itself.
      Independent operator benchmarking of the broader home-goods DTC category (compiled from SEC EDGAR
      filings of six public comparables) puts typical CAC at $60-120 per order and AOV at $240-270 for
      furniture-weighted assortments (versus $50-150 for smaller decor/textiles brands), with realized
      gross margin bands of 40-55% before the true per-order profit (after paid acquisition, freight, and
      returns) narrows to roughly 10-20%. Nordic Knots' list pricing ($300-$2,500+ per rug) sits toward
      the higher end of that AOV band, which would structurally support better payback economics than a
      typical sub-$150-AOV decor brand, but there is no company-specific data to confirm actual CAC,
      contribution margin, or channel mix, making this an inference from category benchmarks rather than
      a verified metric.
    claimRefs: [CI007, CI008, CI009, CI010]
    figureRefs: [FI002]
  - id: cost-structure-and-margins
    title: Cost structure, margin drivers, and working capital
    body: >
      Nordic Knots reports an EBIT margin "over 20%" / "just over 20%" on LTM revenue of SEK 670m, per
      its lead new investor Creades AB's own regulated press release and multiple press accounts of the
      March 2026 round. In the most recently disclosed prior fiscal year, the company reported turnover
      of SEK 377m (~€34m) and profit of SEK 75m (~€6.9m), an implied ~20% net margin, broadly consistent
      with the newer EBIT figure, though the two periods use different profit definitions (net profit vs.
      EBIT) and neither is drawn from a published, audited income statement. No gross margin, SG&A ratio,
      or cost-of-goods breakdown has been disclosed. For context, public home-goods comparables with
      owned inventory (Williams-Sonoma, Arhaus, RH) report gross margins of 38-46% and operating margins
      of 6-18% on scaled, audited financials, while independent analysis of the same comparables' SEC
      filings shows they finance 110-145 days of inventory (turns of 2.65x-3.26x), a structural cash drag
      common to rug and furniture retailers that hold physical stock, produce to lead time, and pay
      supplier deposits before goods ship. Nordic Knots manufactures via handwoven production in India
      under a GoodWeave ethical-sourcing partnership -- a model that typically carries longer lead times
      and working-capital intensity than domestically drop-shipped goods -- but the company discloses no
      inventory turns, days-of-inventory, supplier payment terms, or return-rate data of its own, so its
      cash-conversion profile relative to the public comparables cannot be verified.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: public-traction-vs-private-gaps
    title: Public traction versus private-metric gaps
    body: >
      The only externally verifiable "public" traction proxies for Nordic Knots are qualitative: a
      confirmed New York flagship (Greene Street), a Stockholm showroom, a London store, and a
      forthcoming Los Angeles flagship (June 2026); an eight-market e-commerce footprint per the
      company's own product-feed documentation; and a third-party company-data aggregator estimate that
      headcount runs in the 51-200 employee band, split across a Stockholm base and a growing New York
      team. Revenue (SEK 670m LTM / ~$70m /
      ~€61m), EBIT margin (>20%), YoY growth (85% in 2025 vs. 2024), and 2026 revenue guidance
      (>$100m/€86m) are all company-claimed or investor-claimed figures relayed through press coverage of
      the funding round, not filed, audited, or independently verified numbers -- no S-1, 10-K, prospectus,
      or comparable public disclosure exists for Nordic Knots because it remains privately held. Customer
      count, repeat-purchase rate, return rate, and unit/order volume are entirely undisclosed.
    claimRefs: [CI017, CI018, CI019, CI020, CI021]
    tableRefs: [TI004]
  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: >
      Nordic Knots raised its first-ever external capital in a round announced March 27, 2026: widely
      reported at approximately $100m/€86m, led by Imaginary Ventures with Creades (SEK 105.4m for ~5%),
      Iris Ventures, and Lauren Santo Domingo's St Dominique Capital participating, at a valuation of
      roughly $2.2bn/€1.9bn. A deal-intelligence platform's contemporaneous record puts the raise at SEK
      946.39m and the post-money valuation at SEK 20,820.58m (~$2.0-2.2bn depending on the FX rate
      applied), and identifies the instrument as convertible preferred stock -- a structural detail with
      real implications for the cap table (liquidation preference stacking, potential conversion
      triggers) that is not disclosed in any of the press coverage of the round. Separately, a February
      2025 M&A-intelligence report indicates the founders had mandated Rothschild roughly 13 months
      earlier to explore "ownership options," implying the company evaluated a wider set of paths
      (potential sale, recapitalization) before settling on a minority growth-equity raise. No cash
      balance, monthly burn rate, runway, use-of-funds breakdown beyond qualitative statements (store
      buildout, product-line expansion, trade-channel staffing), or debt/project-finance obligations have
      been disclosed. The scale of physical retail expansion planned (Los Angeles in June 2026, further
      "key global cities" flagships) implies material capex and lease commitments that are entirely
      unquantified in public sources.
    claimRefs: [CI022, CI023, CI024, CI025, CI026, CI027, CI028]
    tableRefs: [TI005]
    figureRefs: [FI003, FI004]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >
      Nordic Knots presents a coherent growth-and-profitability narrative -- 85% YoY growth, 20%+ EBIT
      margin, an eight-market DTC footprint, and a credible institutional/strategic investor syndicate --
      but every quantitative claim underwriting that narrative originates from the company or its
      newly-minted investors around a single financing announcement, corroborated mainly by Creades AB's
      own regulated (but high-level) disclosure rather than by audited financial statements. Revenue
      quality is unverifiable at the line-item level (channel mix, product-line mix, one-time vs.
      recurring items); the margin path is asserted rather than shown (no multi-year P&L, no gross margin,
      no unit economics); and capital intensity is structurally likely (physical retail buildout,
      India-sourced handwoven inventory, multi-market fulfillment) but entirely unquantified. Differences
      across secondary sources in round size (SEK 946.39m vs. SEK 870m vs. EUR 92.59m vs. the widely
      quoted $100m/€86m) and valuation (SEK 20,820.58m vs. "SEK 2.2bn" vs. $2.2bn/€1.9bn) further
      illustrate how imprecisely private-market terms propagate through press coverage. The critical
      diligence blockers are: audited financial statements (income statement, balance sheet, cash flow);
      cash-on-hand, burn, and runway; inventory turns and days-of-inventory; CAC/AOV/contribution margin
      by channel; and full cap-table terms for the newly issued convertible preferred stock. For scale,
      RH, Wayfair, and Arhaus each trade at roughly 0.88x-1.0x trailing revenue on their audited public
      financials, underscoring how far Nordic Knots' implied private valuation multiple sits outside the
      range supported by mature, audited peers -- a point developed further in the Valuation chapter.
    claimRefs: [CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI037, CI038, CI039]
callouts:
  - calloutType: risk
    title: No audited financials exist for any headline metric
    body: >
      Every revenue, margin, and growth figure attributed to Nordic Knots -- $70M/SEK 670m LTM revenue,
      85% YoY growth, >20% EBIT margin -- traces back to company statements or investor commentary around
      the March 2026 raise, relayed by press and one regulated but summary-level Creades AB disclosure.
      No income statement, balance sheet, or cash flow statement has been made public.
    claimRefs: [CI017, CI029, CI006]
  - calloutType: risk
    title: Convertible preferred structure is a cap-table unknown
    body: >
      A deal-intelligence record of the round identifies the new securities as convertible preferred
      stock, but no source discloses liquidation preference multiples, conversion triggers, anti-dilution
      terms, or board/governance rights attached to the new investors' stakes.
    claimRefs: [CI024, CI025]
  - calloutType: insight
    title: Working-capital intensity is structurally likely but unquantified
    body: >
      Handwoven India-sourced production, a multi-market physical retail buildout, and category
      benchmarks showing 110-145 days of inventory for comparable home-goods retailers all point to a
      cash-intensive operating model, yet Nordic Knots discloses no inventory turns, days-of-inventory,
      or supplier payment terms of its own.
    claimRefs: [CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - ["DTC e-commerce - rugs", "Direct online sale of handwoven wool/jute rugs", "Per order", "Core historical revenue driver; majority of assortment", "Company-claimed, unaudited", "Request channel-level revenue split"]
      - ["DTC e-commerce - curtains/shades", "Direct online sale of made-to-measure curtains and Roman shades", "Per order", "New line, launched as part of 2025 textiles push", "Company-claimed, unaudited", "Request product-line revenue mix"]
      - ["DTC e-commerce - bedding & decor", "Direct online sale of bedding, pillows, throws", "Per order", "Part of 2025 home-textiles expansion", "Company-claimed, unaudited", "Request product-line revenue mix"]
      - ["PRO / trade channel", "Trade-discounted sales to architects, interior designers via dedicated portal and account managers", "Per order, trade pricing", "~30% of customer base per Business of Home; growing, staffing up", "Company-claimed via press interview", "Request PRO channel revenue share and discount rate"]
      - ["Physical retail", "Flagship stores: New York (Greene St), Stockholm showroom, London; Los Angeles opening June 2026", "Per store", "4 physical locations by mid-2026; expansion funded by March 2026 raise", "Observed (store existence) via official site and press", "Request per-store sales productivity and lease terms"]
      - ["International markets beyond US/UK/Sweden", "E-commerce feeds live for EU, France, Germany, Austria, Switzerland", "Per market", "8-market feed footprint per llms.txt; revenue contribution undisclosed", "Observed (feed existence)", "Request revenue by market beyond the disclosed ~69% US share"]
    notes: "Revenue-stream existence and channel descriptions are corroborated by official Nordic Knots pages and press interviews; no source discloses the dollar/SEK revenue attributable to any individual stream, so 'current value/status' is qualitative except for the ~69% US and ~30% trade-customer figures cited elsewhere in this chapter."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and monetization
    columns: [Item, List price/unit, List vs. realized, Discounts/unknowns, Source]
    rows:
      - ["Small accent rug", "~$300+", "List price only; no realized/discounted data", "Unknown promotional cadence and discount depth", "Interior Insider review"]
      - ["Standard 5x8 handwoven wool rug", "~$1,200", "List price only", "Trade/PRO discount rate undisclosed", "Interior Insider review"]
      - ["Large-format premium rug", "$2,500+", "List price only", "Custom/made-to-measure surcharge undisclosed", "Interior Insider review"]
      - ["Shipping (US domestic)", "$75-150 per order, added to list price", "Not included in headline price points", "International customs/duties add further unquantified cost", "Interior Insider review"]
      - ["PRO/trade account", "Free to join; trade-discounted pricing once approved", "Discount rate not published", "Approval criteria discretionary; no published trade price list", "Nordic Knots official PRO page"]
    notes: "All prices are current list prices scraped from the company's own site or a third-party review; none reflect realized/blended average selling price, promotional discounting, or trade-channel net pricing, none of which Nordic Knots discloses."
    claimRefs: [CI006, CI007]
  - id: TI003
    title: Unit economics
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Customer acquisition cost (CAC)", "null (category benchmark: $60-120/order)", "low", "Determines whether DTC growth is profitable at the margin", "Request channel-level CAC and blended CAC trend"]
      - ["Average order value (AOV)", "null (category benchmark: $240-270 furniture-weighted; NK list prices $300-$2,500+)", "low", "Higher AOV supports CAC payback in a low-frequency category", "Request actual AOV by product line"]
      - ["Gross margin", "null (category benchmark: 40-55% for owned-inventory home-goods brands)", "low", "Determines room to absorb CAC, freight, and returns before EBIT", "Request COGS and gross margin disclosure"]
      - ["EBIT margin", "\"over 20%\" per Creades AB and press coverage", "medium", "Headline profitability claim underwriting the valuation", "Request audited income statement confirming EBIT definition and margin"]
      - ["Return rate", "null (category benchmark: furniture 22.7%, home decor 19.4%)", "low", "Reverse logistics on large-format rugs can erase margin", "Request NK-specific return rate by product line"]
      - ["Inventory turns / days of inventory", "null (category benchmark: 2.65x-3.26x turns, 110-145 days for owned-inventory comps)", "low", "Determines working-capital intensity and cash-conversion cycle", "Request inventory turns and days-of-inventory"]
      - ["Contribution margin after CAC/freight/returns (CM3)", "null (category benchmark: 10-20%)", "low", "Real per-order profitability, distinct from headline gross margin", "Request contribution-margin waterfall by channel"]
    notes: "Every metric with a null NK-specific value is filled only with an independent category benchmark (Eightx analysis of six public home-goods comparables' SEC filings) for context; none of the benchmark figures are Nordic Knots-specific, and Nordic Knots discloses no unit-economics data of its own beyond the single EBIT-margin figure."
    claimRefs: [CI008, CI009, CI011, CI014, CI016]
  - id: TI004
    title: Public financial gaps
    columns: [Missing private metric, Impact, Diligence path]
    rows:
      - ["Audited income statement / balance sheet / cash flow", "Cannot verify revenue, margin, or asset/liability quality at all", "Request audited financials as a condition of further diligence"]
      - ["Cash on hand, monthly burn, runway", "Cannot assess capital adequacy independent of the new raise", "Request bank/cash statements or CFO briefing"]
      - ["Channel/product-line revenue mix", "Cannot assess durability of growth across rugs vs. new textiles/bedding lines", "Request segment reporting or management accounts"]
      - ["CAC, AOV, contribution margin by channel", "Cannot assess unit-economics quality behind the 20% EBIT margin", "Request marketing-spend and CM waterfall data"]
      - ["Inventory turns, days of inventory, supplier terms", "Cannot assess working-capital intensity or cash-conversion cycle", "Request inventory aging and supplier payment-term schedules"]
      - ["Cap-table terms for the new convertible preferred", "Cannot assess dilution, liquidation preference stacking, or governance overhang", "Request the SPA/certificate of designation for the March 2026 round"]
      - ["Store-level economics (NY, LA, London, Stockholm)", "Cannot assess payback on the physical-retail buildout the new capital is funding", "Request per-store revenue, occupancy cost, and payback period"]
    notes: "This table restates the diligence blockers named throughout the chapter in a single enumeration; coverage is exhaustive of the gaps identified across the sources reviewed for this run, not a sample."
    enumerationScope:
      coverage: exhaustive
      basis: "All private-metric gaps identified across every source reviewed for the Financials chapter of this run, dated 2026-07-04."
    claimRefs: [CI017, CI018, CI022, CI029, CI030, CI033]
  - id: TI005
    title: Capital adequacy
    columns: [Item, Value/status, Source basis, Diligence ask]
    rows:
      - ["Cash on hand", "Undisclosed", "No source discloses a cash balance", "Request current cash position"]
      - ["Monthly burn / net cash flow", "Undisclosed; company is profitable on an EBIT basis, but EBIT profit does not equal cash flow given working-capital intensity", "Inferred from category cash-conversion dynamics, not NK-specific data", "Request cash-flow statement"]
      - ["Runway", "Not applicable/undisclosed given no burn data, but new $100M raise materially extends any prior runway", "Inferred from raise size", "Request runway model post-raise"]
      - ["Planned use of funds", "Store expansion (Los Angeles opening June 2026, further flagship cities), product-line expansion beyond rugs, trade-channel staffing", "Company statements via press interviews", "Request capex budget by initiative"]
      - ["Next-round trigger", "Undisclosed; company has historically avoided outside capital for ~10 years before this round", "Inferred from funding history", "Request forward financing plan / IPO intentions"]
      - ["Debt / project-finance obligations", "Undisclosed", "No source discloses any credit facility or debt instrument", "Request debt schedule"]
      - ["New security type issued (March 2026 round)", "Convertible preferred stock", "Deal-intelligence platform record of the transaction", "Request certificate of designation / liquidation preference terms"]
    notes: "Cash, burn, runway, and debt fields are null/undisclosed for this private company; only the raise amount, security type, and qualitative use-of-funds statements are sourced. Historical funding chronology (rounds prior to March 2026) is covered in Company Overview; this table covers forward capital adequacy only."
    claimRefs: [CI022, CI023, CI024, CI026, CI027, CI028]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: standard
    summary: "How Nordic Knots' customer touchpoints convert into revenue across DTC, PRO/trade, and physical retail channels."
    data:
      nodes:
        - id: customer-demand
          label: "Customer demand (DTC site visitors, trade inquiries, store walk-ins)"
        - id: dtc-checkout
          label: "DTC e-commerce checkout (rugs, curtains, bedding)"
        - id: pro-portal
          label: "PRO/trade portal (architects, designers, ~30% of customers)"
        - id: physical-stores
          label: "Physical stores (NY, Stockholm, London, LA from June 2026)"
        - id: gross-revenue
          label: "Gross revenue (SEK 670m LTM, company-claimed)"
        - id: ebit
          label: "EBIT (>20% margin, company/investor-claimed)"
      edges:
        - from: customer-demand
          to: dtc-checkout
          label: "Majority of order volume (estimated)"
        - from: customer-demand
          to: pro-portal
          label: "~30% of customer base"
        - from: customer-demand
          to: physical-stores
          label: "Growing since 2023-2024 store openings"
        - from: dtc-checkout
          to: gross-revenue
          label: "List pricing $300-$2,500+"
        - from: pro-portal
          to: gross-revenue
          label: "Trade-discounted pricing, rate undisclosed"
        - from: physical-stores
          to: gross-revenue
          label: "Store-level sales, undisclosed"
        - from: gross-revenue
          to: ebit
          label: "Less COGS, SG&A, fulfillment (all undisclosed)"
    approximationNotes: "Node labels combine company-disclosed facts (channel existence, ~30% trade share) with explicitly flagged undisclosed values; no revenue split by channel is available, so edge weights are qualitative, not proportional."
    claimRefs: [CI001, CI004, CI017]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: "Qualitative path from list price to real per-order profit, using category benchmarks since Nordic Knots discloses no unit-economics data."
    data:
      nodes:
        - id: list-price
          label: "List price / AOV (NK $300-$2,500+; category benchmark AOV $240-270)"
        - id: gross-margin
          label: "Gross margin (category benchmark 40-55%; NK undisclosed)"
        - id: cac
          label: "Less CAC (category benchmark $60-120/order; NK undisclosed)"
        - id: returns-freight
          label: "Less returns & reverse freight (category benchmark 19-23% return rate)"
        - id: cm3
          label: "Contribution margin / CM3 (category benchmark 10-20%; NK undisclosed)"
      edges:
          - from: list-price
            to: gross-margin
            label: "Less COGS"
          - from: gross-margin
            to: cac
            label: "Less paid/organic acquisition cost"
          - from: cac
            to: returns-freight
            label: "Less reverse logistics on bulky rugs"
          - from: returns-freight
            to: cm3
            label: "Residual per-order profit"
    approximationNotes: "All margin figures are independent category benchmarks (Eightx analysis of six public home-goods comparables' SEC filings), not Nordic Knots-specific data; used only to illustrate where the company's 20% EBIT-margin claim would need to be reconciled against unit economics."
    claimRefs: [CI007, CI010, CI016]
