      - ["Unit economics", "CAC, AOV, contribution margin, inventory turns by channel", "Needed to assess whether the 20% EBIT margin is durable or inflated by one-time items", "Request management accounts / contribution-margin waterfall"]
      - ["Reconciled financing terms", "A single authoritative figure for round size and valuation in one currency", "Secondary sources disagree by roughly 10% on round size and valuation", "Request the signed subscription agreement or a company-confirmed figure"]
      - ["Comparable transaction benchmark", "Any M&A or financing transaction in the premium rug/home-textiles category at comparable scale", "Without one, the ~31x multiple cannot be benchmarked against a true category peer", "Commission a bespoke comparable-transaction search via a banker or data provider with private-deal coverage"]
    notes: "This table consolidates the diligence blockers raised throughout the chapter into a single enumeration for underwriting sign-off."
    enumerationScope:
