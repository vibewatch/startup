      - ["Bull: syndicate led by Imaginary Ventures (Skims, Reformation, Westman Atelier track record) plus Creades' own regulated disclosure", "Disclosure of the syndicate's underwriting model / entry multiple rationale"]
      - ["Anti-thesis: ~31x LTM revenue is 5-9x richer than the best private DTC comp (SKIMS) and 9-35x richer than audited public comps", "A comparable transaction at a similar multiple in the category, or evidence of durable scarcity value"]
      - ["Anti-thesis: convertible preferred terms (liquidation preference, conversion triggers) are undisclosed", "Disclosure of the certificate of designation / term sheet"]
      - ["Anti-thesis: no audited financials, cash position, or unit economics exist to underwrite the price", "Audited income statement, balance sheet, and cash-flow statement"]
      - ["Anti-thesis: category-wide structural risks (CAC inflation, working-capital intensity, reverse logistics) are undisclosed for Nordic Knots specifically", "NK-specific CAC, inventory turns, and return-rate data"]
    notes: "Each row pairs one side of the debate with the specific evidence that would resolve it; none of the 'what would change the view' items are currently available."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Key assumptions, Valuation/return logic, Key risks, Probability signal]
    rows:
