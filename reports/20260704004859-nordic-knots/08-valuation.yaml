      - ["Base", "Growth decelerates toward the disclosed ~60%/year 3-year average; margins compress modestly as retail capex and working capital scale", "At ~$100-130m revenue in 2-3 years, the current ~$2.2bn valuation implies ~17-22x, still well above comps; a flat or modestly up round is the likely next financing outcome", "Category-wide CAC inflation ($34 to $57 avg 2021-2024); reverse-logistics drag on bulky rugs (19-23% category return rates)", "Medium: consistent with the company's own historical growth trend"]
      - ["Bear", "Growth slows sharply toward category-typical rates; working-capital strain from India-sourced inventory and retail buildout pressures cash despite EBIT profitability", "A down round or distressed sale becomes plausible; convertible preferred stack leaves common equity exposed first", "DTC brand-failure patterns (paid-acquisition dependence, thin loyalty infrastructure, channel concentration) documented across 50 comparable brand collapses since 2022", "Low-medium: no NK-specific evidence of distress today, but the category base rate for premium DTC failure is material"]
    notes: "Valuation/return logic figures are illustrative, derived from applying category-benchmark multiples to scenario revenue assumptions; Nordic Knots has not published its own scenario guidance beyond the single 2026 revenue target."
    claimRefs: [CV022, CV023, CV024, CV025, CV026, CV027]
  - id: TV004
    title: Comparable valuation table
