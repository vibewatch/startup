  - id: TV005
    title: Thesis-break and kill triggers
    columns: [Trigger, Threshold, Transmission to thesis, Action implication]
    rows:
      - ["Down round or flat round at next financing", "Valuation at or below ~$2.2bn at next raise", "Directly falsifies the market's willingness to pay the current multiple", "Reassess entry price and cap-table protections immediately"]
      - ["Disclosed cash burn shortens runway materially", "Any disclosed monthly burn implying <18 months runway post-raise", "Signals the EBIT-margin story does not translate into cash generation", "Request updated cash-flow statement and revised use-of-funds plan"]
      - ["Revenue growth decelerates toward category norms", "YoY growth falls below ~30-40% for two consecutive periods", "Undermines the growth premium embedded in the ~31x multiple", "Re-run scenario model with reduced growth assumptions"]
      - ["Working-capital or inventory problems surface", "Disclosed inventory write-downs, stockouts, or supplier payment disputes", "Confirms the unquantified working-capital risk flagged for India-sourced handwoven production", "Request inventory aging and supplier-term disclosure"]
      - ["Founder departure or material role change", "Either Berglund co-founder exits an operating role", "Removes the primary brand/creative asset underwriting the thesis", "Treat as a fundamental thesis break, not a governance footnote"]
      - ["Category-wide DTC failure pattern emerges at Nordic Knots", "Evidence of paid-acquisition dependence, channel concentration, or loyalty-program absence", "Matches the documented pattern behind 50 DTC brand collapses since 2022", "Request channel-mix and repeat-purchase data before further capital commitment"]
    notes: "Thresholds are illustrative diligence triggers based on category norms and the specific gaps identified in this chapter and the Financials chapter (restated locally here), not company-disclosed covenants."
    claimRefs: [CV028, CV029, CV030, CV031, CV032]
  - id: TV006
