    rows:
      - ["RH (public)", "FY2025 revenue $3,440m; market cap $3.19bn", "~0.93x revenue", "Closest scaled public home-furnishings retailer with premium positioning", "Larger, older, fully audited; different channel mix (galleries + hospitality) vs. NK's DTC-first model"]
      - ["Williams-Sonoma (public)", "FY2025 revenue $7,807m; market cap $26.79bn", "~3.43x revenue", "Highest-margin, best-performing public home-goods comp", "Far larger scale and brand portfolio (Pottery Barn, West Elm) vs. single-brand NK"]
      - ["Arhaus (public)", "FY2025 revenue $1,379m; market cap $1.22bn", "~0.88x revenue", "Closest-scale public comp by revenue among the set reviewed", "Furniture-led assortment differs from NK's rug/textiles focus"]
      - ["Wayfair (public)", "FY2025 revenue $12,457m; market cap $12.47bn", "~1.0x revenue", "Largest online home-goods retailer for e-commerce-model context", "Marketplace/dropship model, not comparable on inventory or margin structure"]
      - ["SKIMS (private)", "~$750m-$1bn+ revenue; $5bn valuation (Nov 2025)", "~5-6.7x revenue", "Richest disclosed private DTC consumer-brand multiple available as an upper reference point", "Different category (apparel/shapewear) and celebrity-founder dynamics not present at NK"]
      - ["Reformation (private, Permira-controlled; S-1 filed June 2026)", "~$507m FY2025 net revenue; no priced valuation disclosed", "Not computable (no valuation disclosed in S-1)", "Comparable sustainable/premium DTC apparel brand approaching a public listing", "Apparel, not home goods; pending IPO rather than a priced private valuation event"]
