    notes: "Multiples are calculated by dividing each company's cited market capitalization or private valuation by its cited revenue figure; public multiples reflect audited financials, private multiples reflect company/press disclosures, and Nordic Knots' own multiple reflects unaudited LTM revenue -- the three tiers are not fully like-for-like."
    enumerationScope:
