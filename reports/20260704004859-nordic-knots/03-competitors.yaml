  rows:
  - - Ruggable
    - Direct peer (mass/washable rugs)
    - Founded 2017; ~$1.26M disclosed equity funding plus a 2020 debt round; 500+ employees (third-party estimate)
    - Value-conscious to mid-market consumers, plus a dedicated trade/hospitality program
    - Patented two-piece washable design; 1,000+ designs; formal trade/hospitality program
    - January 2023 layoffs of 100 corporate staff; faces 10+ named low-price alternatives
  - - Loloi Rugs
    - Incumbent (wholesale/trade rug manufacturer)
    - Founded 2004 in Dallas; family-owned (Amir, Steven, Cyrus Loloi); ~20-year operating history
    - Interior designers, retailers, and trade accounts via wholesale distribution
    - Long-running named-designer collaborations (Joanna Gaines, Amber Lewis); deep trade/dealer network
    - No direct-to-consumer retail pricing; reach depends on third-party retailer relationships
  - - Revival Rugs
    - Direct peer (vintage/direct-sourced rugs)
    - Founded 2017; disclosed funding includes a 2020 early-stage VC round and a 2023 crowdfunding round
    - Design-conscious consumers seeking one-of-a-kind vintage or new rugs
    - Direct sourcing from Turkey, Morocco, and India; no-middleman pricing model
    - Vintage/one-of-a-kind inventory model may limit consistent SKU availability versus made-to-measure
  - - Beni Rugs
    - Direct peer (artisan Moroccan rugs)
    - Founded 2018; no disclosed institutional funding as of mid-2026 (bootstrapped)
    - Design-conscious consumers and trade buyers seeking handwoven Moroccan wool rugs
    - Single-country artisan supply chain with above-market weaver wages and STEP fair-trade certification
    - Narrow single-category focus (rugs only) versus Nordic Knots' broader home-textile assortment
  - - RH (Restoration Hardware)
    - Incumbent (luxury home furnishings retailer)
    - Public company; FY2025 consolidated net revenue of $3,440 million, up 8.1% YoY
    - Affluent consumers and trade buyers across full home-furnishings categories
    - Integrated Gallery real estate, Sourcebook catalog, and adjacent hospitality formats (RH Guesthouses)
    - Not rug-specialist; enormous scale advantage but far broader, less design-narrow assortment
  - - Parachute Home
    - Adjacent (premium DTC bedding/home textile)
    - Founded 2013; ~$35-47M raised; cut retail footprint from 26 to 7 stores in 2024-2025
    - Affluent DTC bedding/home-textile shoppers plus wholesale partners (Target, Nordstrom)
    - Recognized bedding brand pivoting back toward e-commerce/wholesale after over-expansion
    - Bedding-first, not a rug competitor; recent store closures signal real physical-retail execution risk
  - - The Citizenry
    - Adjacent (global artisan home decor)
    - Founded 2014; raised a $20M Series B in 2021; sales grew 200%+ since 2019 Series A
    - Design-conscious consumers seeking globally sourced artisan home goods
    - Country-by-country artisan partnerships across a broad decor assortment; direct-to-consumer online model
    - Broader decor generalist rather than a rug or home-textile specialist
  notes: Scale/funding figures combine each competitor's own disclosures with independent third-party estimates (Tracxn, trade press); several figures (e.g., Ruggable revenue, Beni Rugs pricing) were not independently verifiable from the sources reviewed and are flagged as gaps elsewhere in this chapter.
