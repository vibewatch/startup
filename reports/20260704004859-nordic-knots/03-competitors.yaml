- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Scandinavian design credibility (EDIDA-winning collections)
    - Mass competitors (Ruggable x Anthropologie) echoing Scandinavian motifs at much lower price points
    - Material
    - Track whether Nordic Knots continues to win independent design awards and whether its collaborations stay ahead of mass-market design cycles
  - - Made-to-measure / custom-sizing capability
    - Unclear whether any competitor (Loloi, Beni Rugs, RH) also offers true made-to-measure at scale; evidence is incomplete
    - Minor
    - Request confirmation from each competitor's trade team on custom-sizing lead times and minimums
  - - Artisan/mill sourcing story ('master artisans and select mills')
    - Beni Rugs and Revival Rugs tell a similarly detailed, verifiable artisan-sourcing story; Nordic Knots' own claim is comparatively less specific in reviewed sources
    - Material
    - Request named mill/artisan partnerships and third-party certification (e.g., GoodWeave, STEP) equivalent to Beni Rugs' STEP certification
  - - Trade/hospitality channel formalization
    - Ruggable already runs a named trade/hospitality program; Nordic Knots' PRO program does not yet show hospitality-specific evidence
    - Material
    - Benchmark Nordic Knots PRO's hospitality traction against Ruggable's trade program and RH's Gallery/hospitality formats
  - - Distribution reach
    - Loloi's wholesale/trade network and RH's Gallery real estate both reach far more households than Nordic Knots' direct-plus-two-showroom model
    - Material
    - Assess whether Nordic Knots plans wholesale or additional showroom expansion versus staying DTC-only
  - - Balance-sheet resilience versus DTC-era peers
    - Parachute Home's 2024-2025 store retrenchment and Ruggable's 2023 layoffs show that even funded DTC/premium peers have hit real cost and channel setbacks
    - Material
    - Confirm Nordic Knots' own physical-retail unit economics before further flagship expansion
  notes: Severity reflects the reviewed evidence's implication for Nordic Knots' durability, not an audited risk score; several rows rely on absence-of-evidence rather than confirmed competitor weakness.
