  claims:
  - id: CP001
    statement: Ruggable, Loloi, Revival Rugs, and Beni Rugs are direct peers to Nordic Knots in premium/design-forward rug sales, while RH is a much larger luxury home-furnishings incumbent and The Citizenry and Parachute are adjacent premium DTC home-textile brands rather than rug-first competitors.
    type: inferred
    topic: landscape-overview
    sourceRefs:
    - SP001
    - SP007
    - SP010
    - SP011
    - SP019
    - SP014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP001
  - id: CP002
    statement: Wayfair's mass online marketplace, with private-label rug brands and $12+ billion in annual net revenue, is the clearest status-quo substitute for a buyer who does not specifically seek a premium or design-led rug.
    type: observed
    topic: landscape-overview
    sourceRefs:
    - SP020
    confidence: medium
    freshness: current
  - id: CP003
    statement: No reviewed public source documents a formal 'in-house build' or bespoke local-workroom alternative comparable to Nordic Knots' offering; independent rug dealers and made-to-order local workrooms remain the plausible but undocumented internal-build/status-quo substitute for a custom rug.
    type: open-question
    topic: landscape-overview
    sourceRefs: []
    confidence: low
    freshness: unknown
    answersQuestionRefs:
    - QP002
  - id: CP004
    statement: Home Accents Today's 2026 rug-report roundup shows incumbents (Couristan celebrating its 100th anniversary) and challenger brands (Rug'Society, Ege Carpets) all launching new collections in the same period, indicating likely entrants and adjacent players continuously refreshing the competitive set rather than a static landscape.
    type: third-party-reported
    topic: landscape-overview
    sourceRefs:
    - SP022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP003
  - id: CP005
    statement: Ruggable was founded in 2017 by Jeneva Bell in Los Angeles around a patented two-piece, machine-washable rug design, and has since expanded into over 1,000 designs including door and bath mats.
    type: third-party-reported
    topic: ruggable-profile
    sourceRefs:
    - SP006
    - SP001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP004
  - id: CP006
    statement: Ruggable's washable rugs start at $89 across sizes from 2x3 feet to 9x12 feet, with textures including plush, chenille, shag, and re-jute, positioning it at a materially lower price floor than Nordic Knots' made-to-measure rugs.
    type: observed
    topic: ruggable-profile
    sourceRefs:
    - SP004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP005
  - id: CP007
    statement: Ruggable operates a dedicated trade program offering exclusive discounts, volume pricing, and sourcing support for designers, stagers, developers, and hospitality buyers, showing it already formally serves the same trade/hospitality segment Nordic Knots is only beginning to court.
    type: company-claimed
    topic: ruggable-profile
    sourceRefs:
    - SP002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP006
  - id: CP008
    statement: Ruggable laid off 100 global corporate employees in January 2023 and has faced competition from more than a dozen named alternatives (RugsUSA, Tumble, Boutique Rugs, Rugs Direct, Walmart, The Rug Collective, Lorena Canals, Amazon, Bed Bath & Beyond, The Home Depot, HomeGoods), evidencing both cost pressure and a highly commoditized washable-rug sub-category.
    type: third-party-reported
    topic: ruggable-profile
    sourceRefs:
    - SP006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP007
  - id: CP009
    statement: Loloi Rugs was founded in Dallas in 2004 by Amir Loloi and is now run in part by his sons Steven and Cyrus Loloi, having grown into a major industry player selling rugs, pillows, throws, wall art, and poufs primarily through wholesale/trade and retailer distribution rather than a pure DTC storefront.
    type: third-party-reported
    topic: loloi-profile
    sourceRefs:
    - SP009
    - SP008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP008
  - id: CP010
    statement: Loloi's homepage promotes trade pricing, dedicated sales reps, and easy online ordering for trade accounts, alongside a 'Find a Retailer' path for non-trade consumers, confirming a wholesale-first go-to-market model rather than Nordic Knots' direct-to-consumer-first model.
    type: observed
    topic: loloi-profile
    sourceRefs:
    - SP007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP009
  - id: CP011
    statement: Loloi's growth strategy centers on high-profile named-designer collaborations (Joanna Gaines' Magnolia Home, Amber Lewis, Jean Stoffer, Rifle Paper Co.), a differentiation lever similar in kind to Nordic Knots' own designer collaborations but executed at a larger scale and longer track record (nearly two decades).
    type: third-party-reported
    topic: loloi-profile
    sourceRefs:
    - SP008
    - SP009
    confidence: medium
    freshness: current
  - id: CP012
    statement: Revival Rugs sources vintage and new rugs directly from curators and makers in Turkey, Morocco, and India and sells factory-direct to cut out wholesalers and retailers, with prices ranging from just over $100 for small pieces to about $3,000 for large handmade vintage rugs.
    type: third-party-reported
    topic: revival-profile
    sourceRefs:
    - SP010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP010
  - id: CP013
    statement: Revival Rugs' direct-sourcing, no-middleman model is presented by an independent reviewer as beating competitor prices on comparable quality, making it a price-competitive alternative for design-forward, one-of-a-kind rugs in a similar aesthetic tier to Nordic Knots.
    type: third-party-reported
    topic: revival-profile
    sourceRefs:
    - SP010
    confidence: medium
    freshness: current
  - id: CP014
    statement: Beni Rugs was founded in 2018 by Robert Wright and Tiberio Lobo-Navia and produces handwoven Moroccan wool rugs from a roughly 55-loom studio outside Marrakech, paying weavers wages reported at well over twice the Moroccan national average alongside benefits like transportation and childcare.
    type: third-party-reported
    topic: beni-profile
    sourceRefs:
    - SP013
    - SP011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP011
  - id: CP015
    statement: Tracxn's company profile reports that Beni Rugs has not raised any disclosed institutional or venture funding as of mid-2026, indicating it remains a bootstrapped or self-funded competitor relative to better-capitalized DTC peers.
    type: third-party-reported
    topic: beni-profile
    sourceRefs:
    - SP012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP012
  - id: CP016
    statement: Beni Rugs markets its craftsmanship as a single-supply-chain, artisan-transparent model similar in positioning to Nordic Knots' 'master artisans and select mills' language, but Beni is narrower, focusing solely on handwoven Moroccan wool rugs rather than Nordic Knots' broader home-textile assortment.
    type: inferred
    topic: beni-profile
    sourceRefs:
    - SP011
    - SP013
    confidence: medium
    freshness: current
  - id: CP017
    statement: RH's fiscal 2025 Form 10-K reports consolidated net revenues of $3,440 million, up 8.1% year over year, and describes itself as operating 'the most comprehensive and compelling collection of luxury home furnishings under one brand in the world,' making it more than an order of magnitude larger than a challenger brand like Nordic Knots.
    type: observed
    topic: rh-profile
    sourceRefs:
    - SP019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP013
  - id: CP018
    statement: RH is expanding beyond retail Galleries into hospitality-adjacent formats such as RH Guesthouses and international Design Galleries in Europe, showing an incumbent strategy of extending brand and real-estate scale that a challenger DTC brand cannot easily match.
    type: company-claimed
    topic: rh-profile
    sourceRefs:
    - SP019
    confidence: medium
    freshness: current
  - id: CP019
    statement: Parachute Home, founded in 2013 and known primarily for luxury bedding, had raised roughly $35-47 million in venture funding by 2024 and expanded into a 26-store retail footprint before retrenching, showing that even well-funded premium DTC home-textile brands face real physical-retail execution risk.
    type: third-party-reported
    topic: parachute-profile
    sourceRefs:
    - SP018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP014
  - id: CP020
    statement: Parachute's CEO confirmed the company cut its store count from 26 in 2024 to 7 by mid-2025, citing stores that were 'too large or in regions where brand awareness wasn't as high as it needed to be,' and pivoted back toward e-commerce and wholesale partnerships with Target and Nordstrom.
    type: company-claimed
    topic: parachute-profile
    sourceRefs:
    - SP018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP015
  - id: CP021
    statement: Parachute's own about-us page focuses on bedding and easy-living essentials rather than rugs, confirming it is an adjacent home-textile competitor rather than a direct rug competitor to Nordic Knots.
    type: observed
    topic: parachute-profile
    sourceRefs:
    - SP017
    confidence: medium
    freshness: current
  - id: CP022
    statement: The Citizenry was founded in 2014 by Rachel Bentley and Carly Nance and raised a $20 million Series B in 2021 from NextWorld Evergreen after growing sales over 200% since its 2019 Series A, with repeat customers driving 45% of sales, evidencing a well-capitalized, artisan-sourced adjacent competitor.
    type: third-party-reported
    topic: citizenry-profile
    sourceRefs:
    - SP015
    - SP016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP016
