- id: deployment-support-and-roadmap
  title: Deployment, Support, and Roadmap
  body: Nordic Knots' e-commerce deployment already spans localized storefronts and machine-readable feeds for at least eight markets (Sweden, the EU, the UK, Germany, France, Switzerland, and the US), rather than operating as a single-market storefront (CE033). Customer support runs through email, phone, live chat, and free digital or in-store consultations, backed by self-service size-guide and care-advice documentation, but no reviewed source publishes a service-level commitment for any of these channels (CE030, CE039). On the roadmap side, Nordic Knots does not publish a formal product roadmap or changelog comparable to a software company's release notes; the evidence base instead consists of press-covered collection launches and company statements about future categories (CE038). Recent, confirmed releases include an expansion of the curtains and shades category to include Roman shades and a live fabric-by-the-yard service (CE035, CE036), while co-founders have told Business of Home
    that a furniture line, sourced and upholstered with the company's own fabric, remains a stated but unshipped ambition as of the run date (CE034). The February 2026 B Corp certification and the ongoing GoodWeave partnership both function as roadmap-adjacent trust assets the company can use when expanding into new markets or deeper trade relationships (CE037).
  claimRefs:
