  evidenceGaps:
  - type: access-blocked
    severity: minor
    topic: customer-review corroboration (adverse, table n/a)
    missingEvidence: A directly retrieved Trustpilot review page for Nordic Knots covering product-quality complaints.
    whyItMatters: Without direct access, the full distribution of quality complaints (versus the subset visible in secondary review write-ups) cannot be independently verified.
    diligencePath: Retry the fetch via an alternate access path or request an export of review data from the company or Trustpilot directly.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: platform reliability and uptime practices
    missingEvidence: Any public status page, uptime SLA, or engineering postmortem describing Nordic Knots' e-commerce platform reliability practices.
    whyItMatters: Reliability practice is a standard product/technology diligence item and its complete absence from public sources is itself informative for a DTC brand of this scale.
    diligencePath: Request a reliability/uptime summary directly from Nordic Knots or its named technology vendors (Centra, Cloudflare) as part of formal diligence.
    relatedQuestionRefs:
    - QE029
  - type: missing-source
    severity: minor
    topic: intellectual property and design-rights protection
    missingEvidence: Confirmation of whether Nordic Knots holds patents, registered designs, or trademarks protecting specific rug constructions or collaboration designs.
    whyItMatters: IP protection affects how defensible collaboration-driven designs are against fast-follow competitors.
    diligencePath: Run a trademark/design-registry search (e.g., USPTO, EUIPO, Swedish PRV) for Nordic Knots AB and named collaboration lines.
    relatedQuestionRefs:
    - QE030
  - type: missing-source
    severity: material
    topic: independent lab testing and security certifications
    missingEvidence: Independent lab test results (abrasion, colorfastness) for rugs, and any payment/data-security certifications (e.g., PCI-DSS) for the checkout flow.
    whyItMatters: Both would materially strengthen or weaken confidence in the company's quality and security control claims beyond its own marketing copy.
    diligencePath: Request lab test reports and PCI/SOC attestation letters directly from Nordic Knots and its payment processor as part of a diligence data room.
