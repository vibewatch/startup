chapter:
  number: 5
  title: Product & Technology
  summary: Nordic Knots is a design-led, artisan-manufactured home-textiles product line (rugs, curtains, bedding, fabric by the yard) built on Stockholm design, India- and Italy-based production, and a vendor-assembled e-commerce stack (Sanity, Centra, Cloudflare, HubSpot); its differentiation rests on recurring named-designer collaborations and GoodWeave/B Corp trust credentials rather than any disclosed proprietary technology, while independent lab testing, IP protection, and platform-reliability evidence remain undisclosed.
sections:
- id: product-and-workflow
  title: Product Definition, Module Map, and Customer Workflow
  body: Nordic Knots sells Scandinavian-influenced home textiles across rugs (plush, flatweave, handwoven, high-pile, and outdoor where applicable), made-to-measure curtains and Roman shades, wall-to-wall carpet, custom-sized rugs, bedding, decor, and fabric sold by the yard, organized on its own site by room, style, and named-designer collection (CE001, CE002, CE040). For a typical customer, the workflow starts with discovery through editorial and social content, moves into configuration (choosing size, material, and color, aided by a masking-tape sizing method the company recommends before ordering), optionally adds a free digital or in-store design consultation, then purchase, production or fulfillment, and finally receipt, care, and ongoing support (CE029, CE003). Made-to-measure curtains and Roman shades are delivered in 1-3 weeks, and the PRO trade program layers dedicated account management and a 24-hour application turnaround on top of the same core catalog for architects and interior
    designers (CE003, CE004, CE005). This chain, from discovery through post-purchase support, is mapped in the operating-flow figure below and detailed row by row in the module and workflow tables.
