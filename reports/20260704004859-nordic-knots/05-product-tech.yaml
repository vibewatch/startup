- id: architecture-and-manufacturing
  title: Manufacturing and Technology Architecture
  body: 'Nordic Knots designs its products in a Stockholm atelier, hand-knots rugs with artisans in and around Bhadohi, India, and weaves fabric-based products in Italian mills, primarily using New Zealand wool and natural jute, with some collections blending Merino or Indian wool or left undyed to show natural fiber variation (CE006, CE007). At the SKU level, third-party retail listings describe specific construction trade-offs: a bouclé rug''s dense, hand-carded looped pile is said to hold its form under compression better than cut pile, while a high-pile shag rug made from undyed New Zealand wool is described as resisting matting under regular foot traffic, both with normal early-life shedding (CE008, CE009). On the technology side, no company-published architecture diagram was found, so this review infers the stack from vendor-specific URL patterns observed directly on nordicknots.com: product and editorial content is served from a Sanity.io-hosted backend, the catalog and checkout run
    on the Centra headless commerce platform, images are delivered through Cloudflare, and consultation bookings run through HubSpot Meetings (CE017, CE018, CE019, CE020). Recruiting runs through Teamtailor, and a Built In job listing for a design role explicitly calls for CAD-based technical-quality control across the design-to-production handover, but no reviewed source discloses a public engineering job board, code repository, or developer community, and a Crunchbase technology-details page could not be independently retrieved (CE021, CE022, CE023). Nordic Knots also documents a machine-readable, per-market product feed index intended for search engines, AI systems, and internal teams, last updated 2026-02-16 (CE024).'
  claimRefs:
