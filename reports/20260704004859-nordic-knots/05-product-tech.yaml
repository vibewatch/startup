- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Choose the right rug size before buying
    - Uncertain how a rug will look/fit in the room
    - Size guide recommends masking-tape outline of the footprint before ordering
    - Reduces sizing-related returns without a site visit
    - Still relies on the customer's own measuring accuracy
  - - Avoid staining or damaging a new rug
    - Ad hoc, brand-agnostic cleaning habits
    - Published care advice (vacuuming method, stain protocol, shedding/sprouting guidance)
    - Standardizes customer expectations and reduces damage claims
    - No independent lab data confirms these practices' effectiveness
  - - Get a custom-fit curtain or shade
    - Off-the-shelf sizes rarely fit non-standard windows
    - Made-to-measure curtains and Roman shades, delivered in 1-3 weeks
    - Faster than typical bespoke-drapery lead times
    - Lead time can still lag ready-made purchases
  - - Specify products for a client project
    - Comparing multiple vendors without trade pricing
    - PRO trade program with discounts, dedicated account manager, and previews
    - Streamlines specification and reordering for repeat trade use
    - No disclosed SLA for account-manager response times
  - - Match upholstery or DIY fabric to a rug
    - Sourcing fabric elsewhere and hoping for a color/material match
    - Fabric-by-the-yard service using the same collections as rugs/curtains
    - Improves material/color consistency across a room
    - Yardage pricing and minimums not detailed publicly
  - - Evaluate a rug's texture/color in person before buying
    - Relying only on product photography
    - Free digital or in-store design consultations plus flagship showrooms
    - Reduces color/texture mismatch complaints seen in reviews
    - Only available where a flagship or residency location exists
  - - Return or resolve an order issue
    - Generic online return processes
    - Dedicated register-your-return flow plus email/phone/live-chat support
    - Provides a single, documented path back to the company
    - No published resolution-time commitment
  notes: Workflow descriptions combine company-published process pages with independent reviewer commentary on where those workflows succeed or fall short.
