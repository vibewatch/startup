- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Content / editorial CMS (Sanity.io, cdn.sanity.io)
    - Serves product and editorial imagery/content
    - Third-party headless CMS vendor
    - Vendor lock-in or outage would disrupt content delivery
  - - Commerce / catalog platform (Centra, centracdn.net)
    - Powers the product catalog and checkout experience
    - Third-party headless commerce SaaS
    - Migration off the platform would be a significant technical project
  - - Image / CDN delivery (Cloudflare Images, cdn-cgi/image)
    - Delivers optimized store and product imagery
    - Cloudflare infrastructure
    - CDN-level outage would degrade the shopping experience globally
  - - Consultation booking (HubSpot Meetings, hs.nordicknots.com)
    - Schedules digital and in-store design consultations
    - HubSpot CRM/scheduling suite
    - Booking downtime would disrupt the PRO and consumer consultation workflow
  - - Recruiting / ATS (Teamtailor)
    - Manages the hiring pipeline across markets
    - Third-party applicant-tracking SaaS
    - Low customer-facing risk; mainly an internal-operations dependency
  - - Rug manufacturing (Bhadohi, India artisan mills)
    - Hand-knots rugs from wool, jute, and blended fibers
    - Geographically concentrated artisan supply cluster
    - Regional labor, logistics, or trade disruption could bottleneck rug supply
  - - Fabric manufacturing (Italian mills)
    - Weaves curtain, bedding, and yardage fabrics
    - Concentrated in a single country's textile-mill base
    - Capacity constraints or mill-level disruption could affect fabric-based lines
  notes: Technology-vendor identifications are inferred from vendor-specific URL patterns observed on nordicknots.com (e.g., cdn.sanity.io, centracdn.net, cdn-cgi/image, hs.nordicknots.com) rather than a company-published architecture diagram.
