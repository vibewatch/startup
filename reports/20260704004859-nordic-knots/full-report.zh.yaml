            body: >-
              独立设计媒体把 Nordic Knots 反复运转的具名设计师合作模式，视为它相对大众地毯品牌的主要产品差异化抓手，而不是某一项制造或软件技术（CE027）。公司已与 Campbell-Rey、Studio
