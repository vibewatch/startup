        - 没有 DTC 零售价；触达依赖第三方零售商关系
      - - Revival Rugs
        - 直接同行（复古 / 直接采购地毯）
        - 2017 年成立；已披露融资包括 2020 年早期 VC 轮和 2023 年众筹轮
        - 注重设计的消费者，寻找独一无二的复古地毯或新地毯
        - 直接从 Turkey、Morocco 和 India 采购；无中间商定价模式
        - 复古 / 独一无二库存模式，较定制尺寸模式可能限制稳定 SKU 可得性
      - - Beni Rugs
        - 直接同行（Morocco 手工地毯）
        - 2018 年成立；截至 2026 年中未披露机构融资（自举）
        - 注重设计的消费者和专业渠道买方，寻找手织 Morocco 羊毛地毯
        - 单一国家工匠供应链，织工工资高于市场水平，并获 STEP 公平贸易认证
        - 单品类聚焦较窄（仅地毯），而 Nordic Knots 家纺品类更宽
      - - RH (Restoration Hardware)
        - 既有玩家（高端家居家具零售商）
        - 上市公司；FY2025 合并净收入 $3,440 million，同比增长 8.1% YoY
        - 覆盖全家居家具品类的富裕消费者和专业渠道买方
        - 整合 Gallery 地产、Sourcebook 目录和相邻酒店业态（RH Guesthouses）
        - 不是地毯专营；规模优势巨大，但品类远更宽，设计焦点更分散
      - - Parachute Home
        - 相邻玩家（高端 DTC 床品 / 家纺）
        - 2013 年成立；融资约 $35-47M；2024-2025 年将零售门店从 26 家削减至 7 家
        - 富裕 DTC 床品 / 家纺消费者，以及批发伙伴（Target、Nordstrom）
        - 受认可床品品牌，在过度扩张后重新转向电商 / 批发
        - 床品优先，不是地毯竞争对手；近期关店显示实体零售执行风险真实存在
      - - The Citizenry
        - 相邻玩家（全球工匠家居装饰）
        - 2014 年成立；2021 年完成 $20M Series B；销售额自 2019 Series A 以来增长 200%+
        - 注重设计的消费者，寻找全球采购的工匠家居用品
        - 按国家建立工匠合作，覆盖广泛装饰品类；DTC 在线模式
        - 更偏广泛装饰品通才，而非地毯或家纺专营
    notes: 规模 / 融资数据结合各竞争对手自身披露和独立第三方估算（Tracxn、行业媒体）；若干数据（如 Ruggable 收入、Beni Rugs 定价）无法从已审阅来源独立核验，并已在本章其他位置标为缺口。
