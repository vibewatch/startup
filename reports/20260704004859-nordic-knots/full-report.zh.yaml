      - number: '3.2'
        title: 竞争者画像：规模、融资、目标客户与战略方向
        blocks:
          - type: paragraph
            body: >-
              Ruggable 由 Jeneva Bell 于 2017 年在 Los Angeles 创立，围绕获得专利的两件式可水洗地毯设计搭建业务，已扩展至 1,000 多个设计，并运营专门的 trade /
              hospitality 项目；不过它在 2023 年 1 月裁掉 100 名企业员工，并面对十多个有名的低价替代品牌。Loloi 由 Amir Loloi 于 2004 年在 Dallas 创立，如今由其儿子
              Steven 和 Cyrus 共同经营，已搭建二十年 wholesale / trade-first 业务，核心由 Joanna Gaines 的 Magnolia Home
              等高知名度署名设计师联名支撑。Revival Rugs 直接从 Turkey、Morocco 和 India 的 curators 采购 vintage 和新品地毯，以 factory-direct
              方式销售，价格从约 $100 到约 $3,000。Beni Rugs 由 Robert Wright 和 Tiberio Lobo-Navia 于 2018 年创立，运营约 55
              台织机的摩洛哥编织工作室，支付给工匠的薪酬远高于全国平均水平；截至 2026 年中未披露机构融资，是本次审查的竞争者中最 bootstrapped 的一个。相比之下，RH 大一个数量级：其 2025 财年
              Form 10-K 报告合并净收入 $3,440 million，同比增长 8.1%，并描述了远超 Nordic Knots 当前规模的 integrated Gallery 和
              hospitality-adjacent 战略。Parachute Home 创立于 2013 年，累计融资约 $35-47 million，曾扩张至 26 家门店；CEO
              承认公司「overreached」后，到 2025 年中缩减至 7 家。The Citizenry 创立于 2014 年，在 2019 年 Series A 后销售增长超过 200%，并于 2021 年完成
              $20 million Series B；它以更广的 artisan-sourced 全球家居装饰品牌身份竞争，而不是地毯优先 specialist。
            claimRefs:
