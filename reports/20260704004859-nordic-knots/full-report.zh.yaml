      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              乐观情景下，Nordic Knots 达到自身 >$100m/€86m 的 2026 年收入指引；实体零售和新品线扩张时，EBIT 利润率维持 20%+；品牌取得耐久的多品类地位，未来或可支撑向 SKIMS
              类倍数（约 5-7x）重估——但这仍远低于今天约 31x 的入场倍数，意味着本轮已经把未来数年无瑕疵执行计入价格。基准情景下，大数法则和品类 CAC 通胀开始咬住增长（品类基准 CAC 在 2021-2024
              年从 $34 升至 $57），增速向公司披露的三年平均水平（约 60%/年）放缓；实体零售 capex 和营运资本扩大，利润率温和压缩；公司仍是强但并非例外的盈利 DTC 品牌——在这种情景下，约 31x
              入场倍数很可能需要降价轮，或在任何流动性事件给出公平重估前长期持有。悲观情景下，自 2022 年以来 50 个 DTC 品牌倒闭中记录的品类级失败模式（依赖付费获客、忠诚度基础薄弱、渠道集中）出现在 Nordic
              Knots 下一阶段增长中；来自 India 的手工编织库存和多城市零售建设带来营运资本压力，即便 EBIT
              盈利也挤压现金；可转换优先股堆栈让普通股持有人在任何重组或降价轮中暴露。三个情景都无法真正精确建模，因为 Nordic Knots 除单一 2026 年收入目标外，没有披露现金流、单位经济模型或前瞻指引。
