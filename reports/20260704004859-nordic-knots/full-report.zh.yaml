      - number: '5.5'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 是 GoodWeave 认证伙伴；GoodWeave 的认证模式依赖对伙伴工厂和作坊的独立、持续检查，而不是一次性审计（CE013）。Nordic Knots AB 另于 2026 年
              2 月获得 B Corporation 认证，总影响力评分为 91.4，高于 80 分最低线和 50.9
              的中位数；但评估中的「客户」子项分数（2.8）明显低于「劳动者」「社区」和「环境」子项，说明面向客户的保障相较劳工和环境实践更不成熟（CE014, CE041）。公司还称通过定期 SMETA
              道德贸易审计执行《供应商行为准则》，但底层审计报告未公开（CE015）。值得注意的是，已审阅的 Nordic Knots 自有页面没有为其地毯引用 OEKO-TEX STANDARD 100
