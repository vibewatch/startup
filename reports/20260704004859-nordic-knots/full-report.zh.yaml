  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与结构
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 的收入主要来自 direct-to-consumer（DTC）电商销售手工编织羊毛和黄麻地毯，并由 2025 年推出且持续增长的窗帘 / 遮光帘、床品和家居装饰纺织品线补充；此外还有一个
              wholesale-adjacent 的「PRO」trade 渠道，服务建筑师和室内设计师。公司自家网站把产品组合分成三个 merchandising pillars——Rugs、Curtains &
              Shades、Bedding & Decor——并按市场（Sweden、UK、EU、US、France、Germany、Austria、Switzerland）发布机器可读的产品 feeds，确认其拥有八个市场的
              direct commerce footprint。地毯 list prices 从小号 accent pieces 的约 $300 到大幅单品的 $2,500+ 不等，标准 5x8
              手工编织羊毛地毯发货（$75-150）或关税前价格约 $1,200；这让品牌处在 premium-accessible 层级，高于大众市场零售商（West Elm、Pottery Barn），但低于
              ultra-luxury custom rug houses。据报设计专业人士约占客户基础 30%；公司正在为 trade program 和 online trade portal（「Nordic Knots
              PRO」）补人，以扩大该渠道，而该渠道通常相对 list pricing 有 trade discount。由于 Nordic Knots 仍是私营公司，按渠道（DTC vs. PRO vs. physical
              retail）、按产品线（rugs vs. textiles vs. bedding）或按地域（除披露的约 69% US share 外）的收入结构，均未在任何 public filing
              中拆分——下方所有数字都来自公司、其主要融资轮参与方，或 2026 年 3 月融资媒体报道，而不是经审计分部报告。
