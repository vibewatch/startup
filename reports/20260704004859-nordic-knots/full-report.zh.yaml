      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Fabian Berglund 是联合创始人兼 CEO；创立 Nordic Knots 前，他曾在广告公司 Anomaly 和 Wieden+Kennedy 担任创意总监（CO002，CO005）。Liza
              Berglund Laserow 是联合创始人兼首席创意官；她受过律师训练，随后加入家族古董业务，并经营 Laserow Antiques 的 Manhattan
              分店，也是公司在设计方向上最主要的公开发声者（CO003，CO006）。Felix Berglund 与其兄长和嫂子共同创立公司；随着 Nordic Knots
              规模扩大，他更多转向顾问角色（CO004）。三人有血缘或婚姻关系，Nordic Knots
              因而是真正的家族企业；这让上行利益绑定集中，也把关键人物风险集中在一个小团队内（CO038）。创始家族之外的治理信号有限：公司于 2026 年 2 月成为 Certified B
              Corporation，Impact Score 为 91.4，高于 80 分最低门槛和 50.9 的中位数（CO023）；同时执行 Supplier Code of Conduct，并用 SMETA
              ethical-trade 审计和 GoodWeave 认证支撑其印度地毯供应链（CO024，CO025）。新闻与传播由外部伙伴 Grayscale PR
              处理，而非内部团队（CO039）。已审查来源中未识别出独立董事、审计委员会或其他外部治理机制；考虑到公司刚刚募集的大额新资本，这是一个值得注意的缺口。
