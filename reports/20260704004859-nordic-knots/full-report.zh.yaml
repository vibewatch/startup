      - number: '2.3'
        title: 买方、用户和付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 的公开触点指向四类买方，各自预算负责人和采用触发点不同。富裕 DTC 房主同时是买方、用户和付款方，先通过 editorial 和 lookbook
              内容发现产品，再在线订购量尺定制单品。室内设计师或 trade 客户通过 Nordic Knots PRO 运作；该 trade 会员项目提供 trade
              pricing、免费样品、专属客户经理和新品早期访问，设计师指定产品，但客户最终付款，且常带有设计师 markup。Nordic Knots 在 New York（6 Greene Street）和
              London（Mount Street）的旗舰店，对本地富裕消费者和设计师都承担展厅转化角色，提供到店和预约咨询，而不是作为主要走量渠道。第四类、验证较少的分层是 hospitality 和商业 trade
              账户：Nordic Knots 的 trade FAQ 和 PRO 页面描述了正式 trade-account 申请路径，但已审查公开来源未确认其拥有可比 RH 这类在 10-K 中描述、围绕
              integrated Galleries 搭建的 $3.44 billion 更大 luxury home-furnishings 业务的活跃 hospitality 合同采购项目。Precedence
              Research 发现，线下分销在 2025 年仍占全球家纺购买约三分之二；这支持 Nordic Knots 投入展厅并非押注旧渠道，而是瞄准一个仍占主导的购买渠道。
