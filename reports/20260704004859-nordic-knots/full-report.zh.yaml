      - number: '3.3'
        title: 能力、定价与 go-to-market 对比
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 自家地毯页面显示，标准地毯价格约 $395 到 $1,295，量尺定制定制尺寸地毯约 $625 到略高于 $1,000；这显著高于 Ruggable 的 $89 入门价和 Revival
              Rugs 约 $100 入门价，但仍落在 Revival 接近 $3,000 的高端区间内。Loloi 完全不发布 direct-to-consumer 定价，而是把购物者导向第三方零售商；这用定价透明度换
              wholesale 分销广度。RH 同样不列单件地毯价格，这与其 Gallery 内、预约驱动的 luxury sales process 一致。已审查来源未披露 Beni Rugs 或 The
              Citizenry 的单件定价，因此这些 artisan-sourced 同业相对于 Nordic Knots 的价格位置仍是实际证据缺口。能力方面，Nordic Knots 和 Ruggable 都提供
              trade / pro 定价项目，但只有 Ruggable 明确包含 hospitality 买家；Nordic Knots PRO 自家页面描述的是设计师和建筑师权益，并未点名 hospitality
              客户。若只看设计可信度，Nordic Knots 和 Loloi 都有署名外部设计师联名（Alex Eagle & Sophie Hodges；Joanna Gaines 等），而 Ruggable
              的联名更偏大众授权伙伴（Anthropologie），不是 couture design credentials。
