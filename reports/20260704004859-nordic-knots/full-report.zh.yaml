      - number: '2.5'
        title: 尽调缺口、相互矛盾的估算与市场结论
        blocks:
          - type: paragraph
            body: >-
              合在一起，证据支持高端家纺确实是一个结构性增长品类，但不支持得出精确的 Nordic Knots 专属 TAM。已审查来源没有把「高端 DTC 地毯和家纺」从更宽的 carpet/rug、home-textile
              或 luxury-decor 总量中单独切出；两组竞争性镜头（carpet/rug 和 home textile）在同一名义品类上相差数十亿美元和多个 CAGR
              点。关税政策仍取决于诉讼，最常被引用的家具需求驱动——住房换手——也在 NAR 的乐观 2026 预测和 Furniture Today
              更谨慎的行业判断之间互相矛盾。本分析不使用构造出的点估计来抹平这些缺口，而是保留矛盾，并把尽调导向自下而上的模型：Nordic Knots 的实际价格带、目标家庭数量和 trade / hospitality
              pipeline 数据，比任何额外 top-down report 都更能圈定 addressable market。市场结论是，Nordic Knots
              处在一个真实、数十亿美元规模的相邻品类中，并有可信的高端化和可持续顺风；但公开规模证据还不够精确，不能单靠品类增长支撑估值承销。
            claimRefs:
              - CM009
              - CM011
              - CM013
              - CM024
              - CM027
              - CM033
