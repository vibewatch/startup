      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 的 go-to-market 把 DTC 渠道的 performance / brand digital marketing，与关系驱动的 trade / PRO 动作结合起来；自
              2023-2025 年起，还叠加 New York（Greene Street，SoHo）和 Stockholm 实体旗舰店，London 门店和 Los Angeles（West
              Hollywood）旗舰店计划于 2026 年 6 月开业。公司自身未披露 customer acquisition cost（CAC）、average order value（AOV）、payback
              period 或 channel-level conversion 数据。对更广 home-goods DTC 品类的独立运营商 benchmark（基于六家上市可比公司的 SEC EDGAR filings
              汇总）显示，典型 CAC 为每单 $60-120，家具权重更高的产品组合 AOV 为 $240-270（较小 decor / textiles 品牌为 $50-150），实现 gross margin band
              为 40-55%；但在扣除付费获客、货运和退货后，真实每单利润收窄至约 10-20%。Nordic Knots 的 list pricing（每张地毯 $300-$2,500+）位于该 AOV
              区间高端，从结构上支持比典型 sub-$150-AOV decor 品牌更好的回本经济性；但没有公司特定数据可确认实际 CAC、contribution margin 或 channel
              mix，因此这只是基于品类 benchmark 的推断，而非经验证指标。
            claimRefs:
              - CI007
