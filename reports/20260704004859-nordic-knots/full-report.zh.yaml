            body: >
              Nordic Knots 唯一可从外部核验的「公开」traction 代理指标是定性的：已确认的 New York 旗舰店（Greene Street）、Stockholm 展厅、London
              门店，以及即将开业的 Los Angeles 旗舰店（2026 年 6 月）；根据公司自有 product-feed documentation，有八个市场的电商
              footprint；第三方公司数据聚合器估计员工数在 51-200 人区间，分布在 Stockholm 基地和增长中的 New York 团队。收入（SEK 670m LTM / ~$70m /
              ~€61m）、EBIT 利润率（>20%）、YoY growth（2025 年较 2024 年增长 85%）和 2026
              年收入指引（>$100m/€86m）均为公司或投资者声称的数字，并通过融资轮媒体报道转述；不是 filed、audited 或 independently verified numbers——Nordic
              Knots 仍是私营公司，不存在 S-1、10-K、prospectus 或可比公开披露。客户数、复购率、退货率和单量 / 订单量完全未披露。
