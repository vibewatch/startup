      - number: '2.2'
        title: 多个规模测算镜头及其方法论限制
        blocks:
          - type: paragraph
            body: >-
              没有单一公开报告把「高端 direct-to-consumer 地毯和家纺」作为独立品类测算，因此本分析用五个相邻镜头三角定位，而不是引用一个宽泛 TAM。Grand View Research 估算 2026
              年全球 carpet and rug 市场为 $64.7 billion，以 7.1% CAGR 增至 2033 年 $113.7 billion；Fortune Business Insights
              则估算同一名义品类 2026 年为 $70.26 billion，以 11.75% CAGR 增至 2034 年 $170.87 billion——基值相差约 $5.5 billion，CAGR 相差超过 4.6
              个百分点，说明即便最宽的镜头也未定型。家纺镜头呈现相似格局：Mordor Intelligence 测算 2026 年为 $145.29 billion（到 2031 年 CAGR
              6.31%），Precedence Research 则为 $158.16 billion（到 2035 年 CAGR 6.02%），同一名义品类相差约 $13 billion。最窄且最相关的镜头是 Intel
              Market Research 对 luxury home decor 的估算：2026 年 $16.21 billion，以 3.8% CAGR 增至 2034 年 $20.14
              billion，但这个范围仍覆盖远超地毯和纺织品的高端家具、艺术品和照明支出。这些差距最可能来自方法论和品类口径差异，而不一定是对底层市场的判断相反；但对尽调的实际含义相同：任何单一 TAM
