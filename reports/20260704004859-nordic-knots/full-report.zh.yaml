      - number: '1.3'
        title: 融资历史、估值与投资者
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月，Nordic Knots 完成首次机构外部融资，募集约 $100 million（约 EUR 86 million），估值约 EUR 1.9 billion（约 $2.2
              billion）（CO010，CO011）。本轮由 Imaginary Ventures 领投；这家聚焦美国消费领域的风投机构由 Natalie Massenet 和 Nick Brown 于 2018
              年创立，投资组合包括 Skims、Reformation、Westman Atelier 和 Danielle Frankel（CO012，CO043）。其他参与方包括瑞典投资公司 Creades
              AB；据报该公司出资约 SEK 105 million（约 EUR 9.6 million），占本轮约 5%，Iris Ventures 和 Lauren Santo Domingo 的投资平台 St.
              Dominique Capital 也参投（CO013，CO014）。值得注意的是，Nordic Knots
              大约十年都没有机构外部资本；创始人称，在决定公司已准备好融资前，他们拒绝投资人接触约五年（CO015）。除 Creades AB 披露的持股外，已审查来源未提供完整 capitalization
              table，因此创始人与其余投资人在投后股权中的分配无法独立核验（见 evidenceGaps）。第三方数据供应商 CB Insights 和 PitchBook 覆盖了公司，但本次审查未能独立取得
              PitchBook 的详细档案，两家供应商似乎也都无法获得经审计财务（CO040）。
