  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从规模与验证，经过估值证据缺口，推导出“继续研究”建议的链条。
    data:
      nodes:
        - id: scale-proof
          label: 规模 / 证明：LTM 收入 $70M、同比增长 85%、EBIT 利润率 20%+（公司 / 投资人声称）
        - id: syndicate
          label: 可信投资团：Imaginary Ventures、Creades、Iris Ventures、St Dominique Capital
        - id: valuation-evidence-gap
          label: 估值证据缺口：没有经审计财务，也没有接近 31x 的可比交易
        - id: cap-table-gap
          label: 股权结构缺口：可转换优先股条款未披露
        - id: risk-flags
          label: 品类风险信号：CAC 抬升、营运资本强度高、DTC 失败模式
        - id: recommendation
          label: 建议：继续研究（中等置信度、高风险评级、估值偏贵）
      edges:
        - from: scale-proof
          to: recommendation
          label: 支撑投资论点中的增长 / 盈利能力部分
        - from: syndicate
          to: recommendation
          label: 增加可信度，但不能验证价格
        - from: valuation-evidence-gap
          to: recommendation
          label: 缺少经审计支撑，无法给出买入判断
        - from: cap-table-gap
          to: recommendation
          label: 无法有把握地建模下行情景
        - from: risk-flags
          to: recommendation
          label: 将风险评级抬到高
    approximationNotes: 这是定性决策链，不是加权评分模型； Nordic Knots 没有披露足以计算量化建议分数的数据。
