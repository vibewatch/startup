    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与产品模式
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 是一家创立于 Stockholm、由家族经营的家纺公司，设计带有 Scandinavian
              风格的地毯、窗帘、床品和家居装饰，把自身定位在低价大众市场地毯和极高价定制方案之间（CO001，CO042）。公司由 Fabian Berglund、其妻 Liza Berglund Laserow，以及
              Fabian 的兄弟 Felix Berglund 于 2016 年创立；据报想法在这对夫妇住在 New York 时成形（CO001，CO007）。总部位于 Stockholm 市中心的 Birger
              Jarlsgatan，第二支且仍在扩张的团队设在 New York（CO008）。核心产品覆盖地毯、定制尺寸地毯、满铺地毯、量尺定制窗帘和遮光帘、按码销售面料，以及床品和家居装饰，通过面向 Sweden、更广泛
              EU、UK、Germany、France、Switzerland 和 US 本地化的直营电商店销售（CO009，CO041）。设计集中在 Stockholm 工作室；地毯由 India Uttar Pradesh
              的 Bhadohi 及周边工匠手工编织，布艺产品由意大利纺织厂织造，主要材料是 New Zealand wool
              和天然黄麻（CO020，CO021，CO022）。从身份到制造再到客户的这条链条，以及叠加其上的资本和合规依赖，在下方快照逻辑图中概括。
            claimRefs:
