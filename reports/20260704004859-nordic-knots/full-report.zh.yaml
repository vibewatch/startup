  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - 利润表、资产负债表、现金流量表
        - 无法核验支撑约 31x 倍数的任何收入、利润率或增长数据
        - 作为继续投资论证的条件提出
      - - 股权结构表条款
        - March 2026 可转换优先股的指定证书（清算优先权、参与权、反稀释、董事会权利）
        - 对任何下行情景或退出情景下的普通股价值有实质影响
        - 向公司法律顾问或本轮领投方索取
      - - 现金头寸和烧钱速度
        - 当前账面现金、月度消耗、现金跑道
        - 考虑营运资本密集，EBIT 盈利不等于能产生现金
        - 要求 CFO 沟通或现金流量表
      - - 单位经济
        - CAC、AOV、贡献利润率、按渠道划分的库存周转
        - 用来判断 20% EBIT 利润率是否可持续，还是被一次性项目抬高
        - 要求管理账 / 贡献利润率瀑布
      - - 经核对的融资条款
        - 用单一币种确认一组权威轮次规模和估值数字
        - 二手来源对轮次规模和估值的差异约 10%
        - 要求签署版认购协议或公司确认数字
      - - 可比交易基准
        - 高端地毯 / 家纺品类中任何规模相近的并购或融资交易
        - 没有这个，约 31x 倍数无法用真正品类同业校准
        - 委托银行家或覆盖私营交易的数据提供商做定制可比交易检索
    notes: 本表把全章提出的尽调阻塞项汇总成一张清单，供投资论证签署使用。
