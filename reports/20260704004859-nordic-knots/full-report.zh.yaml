            body: >-
              Nordic Knots 在 Stockholm 工作室设计产品，与印度 Bhadohi
              及周边工匠手工打结地毯，并在意大利工厂织造布艺产品；主要材料是新西兰羊毛和天然黄麻，部分系列会混入美利奴或印度羊毛，也有款式不染色，以保留天然纤维差异（CE006, CE007）。SKU
              层面，第三方零售页面披露了具体工艺取舍：一款 bouclé 圈绒地毯使用密实、手梳的环状绒面，据称受压后比割绒更能保持形态；一款由未染色新西兰羊毛制成的高绒 shag
              地毯，则被描述为在正常走动下不易毡结；两者在使用初期都会正常掉毛（CE008, CE009）。技术侧没有找到公司发布的架构图，本次评估只能根据 nordicknots.com 上直接观察到的供应商特定 URL
              模式推断：产品和编辑内容由 Sanity.io 托管后端提供，目录和结账跑在 Centra 无头商务平台上，图片经 Cloudflare 分发，咨询预约使用 HubSpot Meetings（CE017,
              CE018, CE019, CE020）。招聘通过 Teamtailor 进行；Built In 一则设计岗位招聘明确要求在设计到生产交接中使用 CAD
              做技术质量控制，但已审阅来源没有披露公开工程招聘页、代码仓库或开发者社区，Crunchbase 技术详情页也无法独立获取（CE021, CE022, CE023）。Nordic Knots
              还记录了一个机器可读、按市场拆分的产品数据源索引，供搜索引擎、AI 系统和内部团队使用，最后更新于 2026-02-16（CE024）。
