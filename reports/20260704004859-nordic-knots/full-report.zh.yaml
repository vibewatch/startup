      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              政府层面最清晰标出的风险是劳工合规：US Department of Labor 的童工或强迫劳动商品清单仍将来自 India 的手工打结和手工编织地毯列入清单，正是 Nordic Knots
              采购的产品品类。GoodWeave
              认证要求供应链突击审计下沉到家庭作坊，是公司的主要缓释措施；但它是私人、基于审计的保证，不是政府放行，因此无论认证状态如何，底层品类风险标记仍然存在。关税政策是第二大监管暴露：US 对 India 商品的关税从
              2025 年 4 月合计 26% 的基准加对等税率，升至 2025 年 8 月下旬叠加后 50%（对等关税加与 Russia 石油挂钩的附加费）；随后制裁相关部分在 2026 年 2 月撤销，并被新的
              US-India 临时贸易框架下 18% 对等关税取代——一年内摆动约 50 个百分点，且没有证据显示波动已经稳定。迄今诉讼风险仅限一宗已经和解的 ADA 网站无障碍案件（Hernandez v. Nordic
              Knots, Inc., EDNY，2024 年 10 月提交，2024 年 12 月在和解通知后驳回）；法律评论将其归入更大范围的模板化「连环原告」诉讼，而不是 Nordic Knots 特有的合规失败。公司的
              US 商标注册有效且状态正常；当前 EU《零毁林条例》不覆盖羊毛纺织品，但适用范围会定期审查。
