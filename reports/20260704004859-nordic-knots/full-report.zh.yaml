      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最清晰的增长驱动是高端化、电商可视化、可持续预期，以及存在争议的住房换手顺风。Fitch Ratings 2025 年 12
              月展望明确区分了两类消费者：富裕消费者受益于住房和金融资产增值，低收入消费者面临预算约束；即便 2026 年 discretionary retail sector
              被描述为「deteriorating」，这种分化也有利于高端、面向富裕人群的品类。Wayfair 自己的 10-K 披露了「View in Room
              3D」增强现实工具和移动端占多数的流量，说明可视化技术已成为地毯这类视觉驱动品类的主流投入，正在降低历史上约束线上地毯购买的退货风险。The Good Trade 的 2026 sustainable-brand
              roundup 记录了消费者对 ethical sourcing 和 artisan provenance 的需求上升，这与 Nordic Knots 自身强调 master artisans 和 select
              mills 的定位相匹配。最清晰的约束是关税暴露和消费疲软。Furniture Today 报道称，美国于 2025 年 8 月将印度商品关税提高至 50%，导致 India 对 US 出口在 2025 年 5
              月至 9 月下降 37.5%；随后 Supreme Court 推翻关税，政府提出将其降至 18%——但依赖进口的地毯品牌成本稳定性仍未解决。在此之上，Fitch 和 Zacks 都提示 2026 年
              discretionary retail 背景偏软，Williams-Sonoma 自己的 2026 财年 Q1 earnings call 也仅指引 comparable brand revenue 增长
              2%-6%。最后，NAR 预测 2026 年 existing-home sales 反弹 14%——这是经典家具需求驱动——但 Furniture Today 自己的报道直接相反，把 2026
              年定义为「normalization, not momentum」，因此本分析把该驱动保留为存在争议，而不是确认成立。
