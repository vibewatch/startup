        title: 产品定义、模块地图与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 销售带有 Scandinavian 风格的家纺产品，覆盖地毯（在适用处包括 plush、flatweave、handwoven、high-pile 和 outdoor）、量尺定制窗帘和
              Roman shades、满铺地毯、定制尺寸地毯、床品、家居装饰，以及按码销售面料；自家网站按房间、风格和署名设计师系列组织产品（CE001，CE002，CE040）。典型客户工作流从 editorial
              和社交内容发现开始，进入配置阶段（选择尺寸、材料和颜色，并用公司建议的 masking-tape sizing method
              在下单前辅助判断尺寸），可选择加入免费线上或店内设计咨询，随后是购买、生产或履约，最后是收货、护理和持续支持（CE029，CE003）。量尺定制窗帘和 Roman shades 交付周期为 1-3 周；PRO
              trade program 在同一核心目录之上，为建筑师和室内设计师叠加专属客户管理和 24 小时申请 turnaround（CE003，CE004，CE005）。从发现到售后支持的这条链条，在下方
