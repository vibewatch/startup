      - - Wayfair（上市）
        - FY2025 收入 $12,457m；市值 $12.47bn
        - 约 1.0x 收入
        - 最大线上家居用品零售商，可提供电商模式语境
        - 平台 / 一件代发模式，在库存或利润率结构上不可比
      - - SKIMS（私营）
        - 约 $750m-$1bn+ 收入；$5bn 估值（Nov 2025）
        - 约 5-6.7x 收入
        - 可获得披露中估值最高的私营 DTC 消费品牌倍数，可作上限参考
        - 品类不同（服装 / 塑身衣），且 NK 没有名人创始人带来的动态
      - - Reformation（私营，Permira 控制；June 2026 提交 S-1）
        - 约 $507m FY2025 净收入；未披露定价估值
