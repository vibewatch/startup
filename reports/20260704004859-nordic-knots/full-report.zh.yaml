  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：同业、既有龙头、相邻品牌与替代方案
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 在高端或设计导向地毯销售上直接与 Ruggable、Loloi、Revival Rugs 和 Beni Rugs 竞争；RH 是规模大得多的 luxury
              home-furnishings 既有龙头，The Citizenry 和 Parachute Home 则是相邻的高端 DTC
              家纺品牌，而不是以地毯为先的竞争者。最清晰的现状替代品并不是高端同业：Wayfair 的大众线上 marketplace 拥有 2025 财年 $12.46 billion
              净收入和自有品牌地毯，是那些并非专门寻找高端或设计驱动产品买家的默认渠道。已审查公开来源没有记录正式的 in-house-build 替代方案——独立本地 workroom 或 bespoke rug
              dealer 是全定制订单的合理但未记录的现状替代品，因此本分析保留这一缺口，而不是猜测。格局并非静态：Home Accents Today 的 2026 rug-report coverage 显示，既有老牌
              Couristan（庆祝 100 周年）和较新挑战者 Rug'Society、Ege Carpets 都在同期发布系列；这证明新进入者和既有品牌更新持续存在，而不是一组固定对手。
