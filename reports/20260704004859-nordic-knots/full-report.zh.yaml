  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与相邻品类
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 自有规范站点结构将产品定义为地毯、定制尺寸地毯、满铺地毯、量尺定制窗帘、按米销售面料，以及床品 / 家居装饰；因此正确的市场边界是高端、direct-to-consumer
              家纺，而不是仅限区域地毯。纳入支出包括手工打结和量尺定制地毯、定制满铺地毯、定制窗帘，以及通过公司自有数字渠道和旗舰店以高端价格销售的相邻床品 /
              家居装饰。排除支出包括大众市场机器制造地毯、由总包安装的大卖场宽幅卷毯，以及无关家具品类。最清晰的相邻支出品类是室内设计服务、hospitality FF&E 采购，以及独立趋势报道记录的更广泛可持续 /
              工匠家居用品运动。最重要的现状替代品不是直接高端竞争者，而是大众线上 marketplace 渠道：Wayfair 自己的 10-K 描述了一个自有品牌、算法化陈列的家居用品平台，2025 财年净收入
              $12.46 billion；这显示出商品化替代方案的规模，也说明设计驱动的高端品牌必须靠工艺、定制化和信任来区分，而不是靠价格或选择广度。
            claimRefs:
