  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 的看多逻辑建立在真实且可印证的信号上：一个已有十年、由创始人主导的品牌，LTM 收入达到约 SEK 670m（约 $70m/€61m），EBIT 利润率超过 20%，2025 年 YoY
              增长 85%；DTC 覆盖八个市场；PRO/专业客户渠道增长（约 30% 客户）；四城实体零售版图，并将于 2026 年 6 月扩至 Los Angeles；投资财团由 Imaginary Ventures
              领投（有 Skims、Reformation 和 Westman Atelier 投资记录），Creades、Iris Ventures 和 Lauren Santo Domingo 的 St Dominique
              Capital 跟投。反论点是，所有这些数字都来自公司或投资人口径，未经审计；本轮按约 31x LTM 收入给公司定价——远高于 SKIMS 在相近收入规模时的 5x 倍数，也远高于 RH、Wayfair 和
              Arhaus 基于审计公开财务的 0.88x-1.0x 交易倍数；本轮发行可转换优先股，清算优先权和转换条款未披露；品类层面结构性风险（付费获客成本通胀、营运资本密集、大件地毯逆向物流拖累）对 Nordic
              Knots 本身没有量化。论点取决于 Nordic Knots 是一代级品牌例外；反论点是，价格已经假设这个例外已经发生。
