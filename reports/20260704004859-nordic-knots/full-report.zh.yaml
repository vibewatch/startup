      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 给出了一个连贯的增长与盈利叙事——85% YoY growth、20%+ EBIT margin、八个市场 DTC footprint，以及可信的机构 / 战略投资人
              syndicate——但支撑该叙事的所有量化主张都来自公司或其新投资人，围绕单一融资公告发出，主要由 Creades AB
              自己受监管但高层级的披露佐证，而不是经审计财务报表。收入质量无法在线项层面核验（channel mix、product-line mix、one-time vs. recurring
              items）；利润率路径只是被声称，而非被展示（没有多年 P&L、没有 gross margin、没有 unit economics）；资本强度从结构上看可能较高（实体零售建设、India-sourced
              手工编织库存、多市场履约），但完全未量化。二级来源在 round size（SEK 946.39m vs. SEK 870m vs. EUR 92.59m vs. 被广泛引用的 $100m/€86m）和
              valuation（SEK 20,820.58m vs.「SEK 2.2bn」vs. $2.2bn/€1.9bn）上的差异，进一步说明 private-market terms
              通过媒体传播时多么不精确。关键尽调阻断项包括：经审计财务报表（income statement、balance sheet、cash flow）；cash-on-hand、burn 和
              runway；inventory turns 和 days-of-inventory；按渠道拆分的 CAC / AOV / contribution margin；以及新发行 convertible
              preferred stock 的完整 cap-table 条款。作为参照，RH、Wayfair 和 Arhaus 在经审计公开财务上都以约 0.88x-1.0x trailing revenue 交易，凸显
              Nordic Knots 隐含 private valuation multiple 距离成熟、经审计同业所支持区间有多远——这一点在 Valuation 章节进一步展开。
