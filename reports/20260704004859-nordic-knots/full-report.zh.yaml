      - number: '7.5'
        title: 缓释措施与否决条件
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 披露的最强缓释措施，是两项私人认证——GoodWeave 覆盖劳工合规，B Corp 覆盖更广泛 ESG
              治理；二者都涉及反复第三方审计和重新评估，而不是一次性徽章。认证之外，公司没有披露关税对冲、具名供应链备选方案，也没有公开确认下一家旗舰店时间表；因此截至运行日，本章大多数其他风险仍未缓释。可监测的否决条件集中在六个触发点：有效
              US-India 关税率进一步高于当前 18% 对等水平；GoodWeave 或 B Corp
              认证失效或出现负面发现；公司遭遇第二起无关法律诉讼；下一家旗舰店开业确认延期或取消；任一剩余运营中的联合创始人离开运营岗位；主要研究机构对奢侈品板块需求预测从「谨慎」转为明确负面。以上每项都可通过公开来源独立观察，无需私人披露也会实质改变对公司的风险调整后看法。
