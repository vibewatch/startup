companyProfile:
  summary: >-
    Nordic Knots 是一家创立于 Stockholm 的高端家纺品牌，围绕 Scandinavian 设计、高端天然材料，以及与富裕美国消费者和 trade
    买家的直接关系搭建业务。公司从创始人主导的地毯品牌，扩展为覆盖定制地毯、窗帘、床品和家居装饰的更完整产品线；同时靠旗舰展厅、设计师联名、GoodWeave 认证的印度地毯生产，以及新取得的 B Corp
    资质守住高端定位。承销难点不在需求验证，而在证据不透明：业务看起来盈利且增长很快，但投资者仍缺少经审计报表、细颗粒度客户质量数据和 cap table 清晰度。
