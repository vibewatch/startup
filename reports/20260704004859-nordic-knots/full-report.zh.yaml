      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 于 2026 年 3 月 27 日宣布完成首次外部融资：广泛报道为约 $100m/€86m，由 Imaginary Ventures 领投，Creades（SEK 105.4m 对应约
              5%）、Iris Ventures 和 Lauren Santo Domingo 的 St Dominique Capital 参投，估值约 $2.2bn/€1.9bn。一个 deal-intelligence
              platform 的同期记录显示，融资额为 SEK 946.39m，post-money valuation 为 SEK 20,820.58m（取决于所用汇率，约 $2.0-2.2bn），并把工具识别为
              convertible preferred stock——这一结构细节对 cap table 有真实影响（liquidation preference stacking、潜在 conversion
              triggers），但融资报道中均未披露。另有 2025 年 2 月 M&A-intelligence report 显示，创始人约 13 个月前曾委任 Rothschild 探索「ownership
              options」，意味着公司在最终选择少数股 growth-equity raise 之前，评估过更广路径（潜在出售、recapitalization）。公司未披露 cash balance、monthly
              burn rate、runway、use-of-funds breakdown（除门店建设、产品线扩张、trade-channel staffing 等定性表述外）或 debt / project-finance
              obligations。计划中的实体零售扩张规模（2026 年 6 月 Los Angeles，以及更多「key global cities」旗舰店）意味着实质 capex 和 lease
              commitments，但公开来源完全未量化。
