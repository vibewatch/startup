      - number: '3.5'
        title: 护城河耐久性、商品化风险与竞争者负面证据
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 证据最清晰的护城河是设计可信度：其 2026 年与设计师 Alex Eagle 和 Sophie Hodges 获得 EDIDA floor-covering
              奖，是独立第三方认可；已审查的大众市场或纯批发竞争者尚未显示能把这种认可与真正量尺定制尺寸能力结合起来。即便如此，商品化风险真实且具体：Home Accents Today 的 2026 rug-report
              coverage 显示，Ruggable 与 Anthropologie 合作推出簇绒地毯产品线，并明确称其把「Scandinavian flat-weave geometry」与其他图案融合，起价接近
              $139——这是具体证据，说明 Nordic Knots 的核心审美语言可以被低价很多的大众竞争者复刻。负面侧，Ruggable 2023 年 1 月裁掉 100 名企业员工，Parachute Home
              2024-2025 年从 26 家门店缩减至 7 家（CEO 承认公司「overreached」），都表明即便资金充足、知名度高的 DTC 和高端家纺同业，近期也遭遇真实成本和渠道战略挫折；同一 coverage
              还明确把 Parachute 与 Casper、Glossier、Peloton 等 DTC 时代品牌并列，这些品牌都在早期 boom 后经历挣扎。已审查来源中未发现 Loloi、Revival
              Rugs、Beni Rugs、RH 或 The Citizenry 有可比负面事件。总体看，没有单一竞争者能在所有维度同时击败 Nordic
              Knots——每家只在一个轴上最强——因此耐久性问题不是某一个对手，而是 Nordic Knots 能否在下方价格压力和上方分销 / 规模压力同时加大时，守住设计可信度和定制尺寸能力。
            claimRefs: []
