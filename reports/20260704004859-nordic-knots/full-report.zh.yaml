      - number: '1.4'
        title: 规模、封面指标与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 曾披露，某个更早但未公开的财政年度年收入约 EUR 34 million、利润 EUR 6.9 million；据报 2025 年收入升至约 EUR 61 million，EBIT
              利润率 20%，Fabian Berglund 告诉 WWD，2025 年销售额较 2024 年增长约 85%（CO016，CO017，CO018）。公司目标是 2026 年收入超过 $100
              million，并把这一年称为成立十周年（CO019）。这些数字均未经独立审计；Nordic Knots 也未公开总员工数或活跃客户数，因此两项都构成封面指标要求下的明确缺口（CO044；见
              evidenceGaps）。在里程碑时间线上，公司增长受益于疫情期间的家装热潮（CO030），随后按顺序搭建实体零售：Stockholm 旗舰店设在一座 1918 年改造的电影院内（2023 年 3
              月），美国首家旗舰店位于 New York SoHo（2024 年中），London Mount Street 六个月展厅驻留（2025 年 10 月），以及计划中的 Los Angeles 旗舰店（2026 年
              6 月）（CO026，CO027，CO028，CO029）。Studio Giancarlo Valle 设计了两家已确认旗舰店，因此成为反复出现的实体零售设计伙伴（CO035）。产品里程碑包括与
              Campbell-Rey、Studio MRS 的 Michelle R. Smith，以及 Studio Mellone 的 Andre Mellone
              反复推出署名设计师联名（CO031，CO032，CO033，CO034）。资料对首次 Campbell-Rey 联名的确切年份说法不一：一篇简介写 2021 年，而设计师自己在 Homes & Gardens
              中称为 2022 年（CO032 与 CO031 矛盾），说明即便覆盖较充分的品牌里程碑也会有来源不一致。
