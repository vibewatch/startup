              治理风险集中在小型创始人团队：Fabian Berglund（CEO）和妻子 Liza Berglund Laserow（首席创意总监）负责公司日常运营；第三位联合创始人、Fabian 的兄弟 Felix
              Berglund
              已退至顾问角色——这是创始人层面流失已经发生的信号，不是假设风险。剩余两名运营中的联合创始人都没有正规设计训练；按二人自述，产品方向完全经由他们过滤，任何一人离开都会对品牌和产品连续性构成高严重度事件。财务上，Nordic
              Knots 为私营公司，没有公开申报文件，因此杠杆、营运资本和利润率敏感性无法独立验证；已披露的是 2026 年 3 月增长轮（Imaginary Ventures 领投，约 EUR86M，估值约
              EUR1.9B），并明确部分用于偏重 US 的零售扩张。执行风险随之而来：已发布的「Regional Director, US West
              Coast」岗位显示公司正为新旗舰店招聘，但开业日期、地址和租约条款均未确认，新资本多快转化为产生收入的门店仍有时间表风险。执行发生在 100% India 采购关税暴露和 2026
              年奢侈家居需求谨慎的背景下——Bain、Morgan Stanley 和 J.P. Morgan 均如此描述；如果关税成本转嫁给本已价格敏感的奢侈品买家，利润率压缩可能与收入增长放缓叠加。
