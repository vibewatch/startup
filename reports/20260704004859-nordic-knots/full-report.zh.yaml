      - number: '8.2'
        title: 融资背景、入场纪律与优先股悬顶
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 于 2026 年 3 月 27 日完成首次外部融资：广泛报道口径约为 $100m/€86m，估值约 $2.2bn/€1.9bn，由 Imaginary Ventures
              领投，Creades（SEK 105.4m 换取约 5%）、Iris Ventures 和 St Dominique Capital 参投。交易情报平台的同期记录显示，本轮融资额为 SEK
              946.39m，投后估值为 SEK 20,820.58m，并标明发行证券为可转换优先股——这意味着新投资人大概率持有清算优先权（这类增长轮通常至少为 1x
              非参与型，尽管确切倍数未披露），在下行情景中排在创始人普通股之前。没有来源披露任何此前融资形成的优先权堆栈数量、期权池规模或董事会控制条款。2025 年 2 月一份并购情报报告显示，创始人约 13 个月前已委任
              Rothschild
              探索「所有权方案」，说明公司在敲定少数股权增长资本融资前，曾权衡更广的路径（潜在出售、资本重组）；这个流程细节支持一定价格纪律（竞争性流程，而非单一主动报价条款清单），但本身不能证明最终倍数合理。对今天的新投资人来说，入场纪律偏弱：支撑价格的收入或利润率数字没有独立审计，本轮工具本身（条款未披露的可转换优先股）也让普通股下行情景无法建模。
