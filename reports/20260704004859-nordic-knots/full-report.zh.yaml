      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 下一轮融资出现降价轮或平轮
        - 下一轮估值低于或等于约 $2.2bn
        - 直接证伪市场愿意为当前倍数买单
        - 立即重估入场价格和股权结构保护
      - - 披露现金消耗大幅缩短跑道
        - 任何披露月度消耗显示融资后现金跑道 <18 个月
        - 说明 EBIT 利润率叙事没有转化成现金生成
        - 要求更新现金流量表和修订后的资金用途计划
      - - 收入增速向品类常态回落
        - 同比增速连续两个期间低于约 30-40%
        - 削弱约 31x 倍数中包含的增长溢价
        - 用降低后的增长假设重跑情景模型
      - - 营运资本或库存问题浮出水面
        - 披露库存减记、缺货或供应商付款纠纷
        - 证实印度手工编织生产对应营运资本风险尚未量化
        - 要求披露库存账龄和供应商条款
      - - 创始人离任或角色发生重大变化
        - 任一 Berglund 联合创始人退出经营角色
        - 拿掉支撑投资逻辑的核心品牌 / 创意资产
        - 视为基本面投资逻辑破裂，而不是治理脚注
      - - 品类层面的 DTC 失败模式出现在 Nordic Knots
        - 出现依赖付费获客、渠道集中或缺少忠诚度计划的证据
        - 匹配 2022 年以来 50 起 DTC 品牌倒闭背后的已记录模式
        - 进一步投入资本前，要求提供渠道组合和复购数据
    notes: 阈值是基于品类常态及本章和“财务情况”章识别出的具体缺口（此处本地重述）的示意性尽调触发器， 不是公司披露的契约条款。
