  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年收入超过 $100m/EUR86m 指引；EBIT 利润率保持在 20%+；多品类扩张成功
        - 入场价若要靠基本面而不只是稀缺性成立，多年内倍数必须压缩到约 5-7x（类似 SKIMS）
        - 同时推进 4+ 家新店开业和 2+ 个新品类，执行风险高
        - 低至中：需要多年零失误执行，且未披露应急计划
      - - 基准
        - 增长向已披露的三年平均约 60%/年回落；零售资本开支和营运资本放大，利润率小幅压缩
        - 若 2-3 年后收入达到约 $100-130m，当前约 $2.2bn 估值仍意味着约 17-22x，仍明显高于可比公司； 下一轮融资更可能是平轮或小幅上轮
        - 品类整体 CAC 膨胀（2021-2024 年平均从 $34 升至 $57）；大件地毯逆向物流拖累（品类退货率 19-23%）
        - 中：与公司自身历史增长趋势一致
      - - 悲观
        - 增长大幅放缓至品类常见水平；来自印度的库存和零售扩张占用营运资本，即便 EBIT 盈利也压现金
        - 降价轮或困境出售变得可能；可转换优先股堆叠让普通股最先承压
        - DTC 品牌失败模式（依赖付费获客、忠诚体系薄弱、渠道集中）已在 2022 年以来 50 起可比品牌倒闭中出现
        - 低至中：目前没有 Nordic Knots 特定困境证据，但高端 DTC 品类失败的基准概率不可忽视
    notes: 估值 / 回报逻辑中的数字为示意值，来自把品类基准倍数套用于情景收入假设；除单一 2026 年收入目标外， Nordic Knots 未发布自身情景指引。
