      - number: '8.3'
        title: 可比集合——公开、私营与品类背景
        blocks:
          - type: paragraph
            body: >
              高端 DTC 地毯/家纺品牌没有直接公开纯业务可比公司，因此本章以最接近的参照类别为 Nordic Knots 定标。拥有自有库存的公开家居用品零售商——RH（FY2025 收入 $3,440m，毛利率
              44.07%，经营利润率 11.26%，市值 $3.19bn，约 0.93x 收入）、Williams-Sonoma（收入 $7,807m，毛利率 46.15%，经营利润率 18.13%，市值
              $26.79bn，约 3.43x 收入）、Arhaus（收入 $1,379m，毛利率 38.89%，经营利润率 6.44%，市值 $1.22bn，约 0.88x 收入）和 Wayfair（收入
              $12,457m，毛利率 30.22%，经营利润率 0.14%，市值 $12.47bn，约 1.0x 收入）——都基于经审计财务，按 0.88x-3.43x 过去收入交易。同类最佳的私营 DTC
              消费品牌能拿到更高、但仍低得多的倍数：SKIMS 在 2025 年 11 月估值 $5bn，对应约 $750m-$1bn+ 收入（约 5-6.7x）；Reformation 2019 年被 Permira
              收购多数股权，FY2025 净收入 $507.1m，并于 2026 年 6 月提交 S-1，计划在 NYSE 上市（ticker REF），但尚未披露价格区间或估值。Nordic Knots 约 $2.2bn
              估值对应约 $70m LTM 收入，隐含倍数约 31x——是可得最佳私营 DTC 可比的 5-9 倍，是经审计公开可比的 9-35
              倍。高端地毯/纺织品品类中，没有公开记录到规模可比的并购交易，因此可比集合本身就是本估值判断的重要限制，不只是倍数问题。
