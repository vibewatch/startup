      - number: '1.5'
        title: 负面信号、招聘足迹与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 的负面信号主要来自独立评论者，而不是公司自己的营销材料。Interior Insider
              的测评提到，客户反复抱怨第三方快递承运商导致发货延误，以及营销图片与实际交付地毯的颜色或图案不匹配（CO036）；同一来源还发现，Nordic Knots
              羊毛地毯在最初数月使用中掉毛明显，黄麻混纺边缘容易磨损，高流量家庭中的耐用性下降更快（CO037）。Trustpilot
              通常承载这类客户反馈，但本次审查中抓取被阻断，无法独立取得，因此客户情绪的完整分布只得到部分验证。招聘方面，Nordic Knots 在 Stockholm、New
              York、Paris、London、Berlin 和 Los Angeles 发布职位，覆盖零售、电商、CRM、商品运营和市场职能；这与一家扩张多市场零售和 DTC
              运营的公司相符，但公司未披露总员工数（CO044）。连同上文的融资与治理缺口，最重要的开放尽调项包括：准确员工数和客户基础；Nordic Knots
              在新增股权之外是否还有任何债务或项目融资义务；除非正式评论投诉外，是否存在未披露法律或监管事项；以及 EUR 1.9 billion 估值相对于收入规模相近的 DTC 家纺品牌是否合理。每一项都作为明确
              evidence gap 记录，而不是被假设消失。
            claimRefs:
              - CO036
              - CO037
              - CO044
