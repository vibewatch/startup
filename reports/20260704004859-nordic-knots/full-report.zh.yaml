      - number: '4.3'
        title: 成本结构、利润率驱动与营运资本
        blocks:
          - type: paragraph
            body: >
              按新主要投资者 Creades AB 自己受监管的新闻稿，以及多篇 2026 年 3 月融资报道，Nordic Knots 报告 LTM 收入 SEK 670m，EBIT 利润率「over 20%」/「just
              over 20%」。在最近一次披露的更早财年，公司报告 turnover 为 SEK 377m（约 €34m），profit 为 SEK 75m（约 €6.9m），隐含净利率约 20%，与更新的 EBIT
              数字大体一致；不过两个期间使用不同利润定义（net profit vs. EBIT），且均未来自已发布、经审计 income statement。公司未披露 gross margin、SG&A ratio 或
              cost-of-goods breakdown。作为背景，拥有库存的上市 home-goods 可比公司（Williams-Sonoma、Arhaus、RH）在有规模且经审计财务上报告 gross margins
              为 38-46%、operating margins 为 6-18%；对同一组可比公司 SEC filings 的独立分析显示，它们为 110-145 天库存融资（turns 为
              2.65x-3.26x）。对持有实体库存、按 lead time 生产、并在发货前向供应商支付 deposits 的地毯和家具零售商而言，这是常见的结构性现金拖累。Nordic Knots 通过 India
              手工编织生产，并由 GoodWeave ethical-sourcing partnership 支撑——这一模式通常比国内 drop-shipped goods 拥有更长 lead times 和更高
              working-capital intensity——但公司没有披露自身 inventory turns、days-of-inventory、supplier payment terms 或
              return-rate data，因此其 cash-conversion profile 相对上市可比公司无法核验。
