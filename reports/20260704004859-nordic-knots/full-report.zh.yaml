  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 的风险画像主要由结构性集中主导：披露的全部地毯线都由单一国家（India）的工匠手工打结，窗帘面料只在未具名意大利工厂织造，没有披露制造多元化。叠加其上的是波动的 2025-2026
              US-India 关税环境：手工打结地毯从 0% 基准关税升到 2025 年 8 月叠加后 50%，又在 2026 年 2 月回落到 18% 对等关税；公司没有披露任何对冲。监管/法律风险真实存在但部分缓释：US
              Department of Labor 仍将印度手工打结地毯列为童工风险品类，Nordic Knots 通过 GoodWeave 认证和 B Corp 身份应对；2024 年 ADA
              网站无障碍诉讼（Hernandez v. Nordic Knots）在三个月内和解并驳回。执行和治理风险来自创始人高度集中的领导结构——三名联合创始人之一已退至顾问角色——同时公司在 2026 年 3
              月增长轮资金支持下推进资本密集的多城市旗舰店扩张；背景又是 Bain、Morgan Stanley 和 J.P. Morgan 均称 2026 年奢侈家居需求偏谨慎而非扩张。
