      - number: '8.6'
        title: 建议、置信度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              入场倍数约为 31x LTM 收入，支撑它的完全是公司和投资方口径；可转换优先股资本结构未披露；品类层面结构性风险在抽象层面已有充分记录，却没有针对 Nordic Knots
              量化。在这些条件下，合适立场是继续研究，而非买入或回避：品牌增长和盈利信号可信，并得到多家独立媒体及一份受监管主体（Creades
              AB）披露印证；但估值没有任何经审计财务证据支撑，也没有相似倍数的可比交易支撑。未来承销判断应以以下信息为前提：经审计财务报表；账面现金、现金消耗和跑道期；可转换优先股的指定证书（清算优先权倍数、参与权、转换触发条件、董事会控制）；库存周转和渠道层面单位经济模型；以及对本轮规模和估值用单一币种调和后的数字，因为二级来源之间约有
              10% 差异。缺少这些，任何投资人都无法独立验证约 31x 倍数究竟反映了一个覆盖稀薄品类中的真实稀缺价值，还是一个跑在公司自身披露基本面前面的定价离群点。
