      - number: '3.4'
        title: 切换成本、锁定、分销力量与供应准入
        blocks:
          - type: paragraph
            body: >-
              切换成本取决于产品架构。Ruggable 的两件式可水洗设计（印花 cover 加独立防滑垫）鼓励反复购买新 cover，而不是一次性 heirloom 购买；这是一个软性的 recurring-revenue
              机制，Nordic Knots 的单件式地毯并不具备。Nordic Knots 自家的量尺定制和定制尺寸产品制造了另一种锁定：一旦地毯或窗帘按客户房间的精确尺寸裁切，更换为通用竞品 SKU
              就需要重新测量和重新定制，这有利于未来房间继续向同一品牌复购。分销力量方面，Loloi 的 wholesale / trade dealer 与 showroom 网络、RH 的 Gallery 房地产，都比
              Nordic Knots 的直销线上加两家旗舰展厅模式触达更多家庭，给两家既有龙头带来明显更高的货架存在感。供应准入方面，Beni Rugs 和 Revival Rugs 都依赖明确国家的工匠网络（Beni 依赖
              Morocco；Revival 依赖 Turkey、Morocco 和 India），与 Nordic Knots 自身依赖「select
              mills」可直接类比——也就是说，这三个品牌的竞争耐久性都建立在维护特定供应商关系上，而不是建立在多元、可互换的供应基础上。
