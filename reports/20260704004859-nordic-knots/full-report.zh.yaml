              评论还增加了物流特定风险——到货尺寸小于广告标注，且至少一起承运商遗失货件争议处理缓慢；总体
              3.1/5、「Average」（一般）评级显示的是服务执行不一致，而非系统性失败。伙伴依赖集中在四处：两个未披露制造关系（地毯的 India 工匠网络、窗帘面料的未具名意大利工厂）；两个支撑公司合规和 ESG
              证明的私人认证机构（GoodWeave 和 B Lab）；2026 年 3 月轮后新集中的投资方群体（Imaginary Ventures、Creades、Iris
              Ventures）；以及唯一得到独立印证的旗舰酒店业案例（Hotel Il Pellicano），若该关系失效，会削弱公司最强的公开客户证明。Nordic Knots
              没有披露任一制造依赖的供应商名称、工厂数量、审计报告或合同条款，因此除认证本身外，韧性无法验证。竞争上，Nordic Knots 处在拥挤的中间层——一边是 Ruggable 等可水洗地毯 DTC
              规模玩家，另一边是 The Rug Company 等超高端手工打结专家；除设计和认证外，公司没有披露结构性护城河。
