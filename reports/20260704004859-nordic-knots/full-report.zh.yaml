      - number: '8.5'
        title: 退出准备度与论点失效触发项
        blocks:
          - type: paragraph
            body: >
              Nordic Knots 没有披露 IPO 时间表，2026 年整体风投退出环境也好坏参半：根据 Crunchbase Q1 2026 数据，Q1 2026 全球超过 $1bn 的风投支持退出仅 21
              家公司（多数在 China）；即便后期私募融资激增，U.S. 新上市 IPO 市场也「在更广泛的软件股抛售中放缓」。这样的市场背景，对 Nordic Knots
              这种规模的消费品品牌，更支持继续私有持有，而不是短期公开上市。近期最可能的结果包括：后续私募轮（估值更高，或在执行不及预期时更低）、出售给更大的家居/生活方式集团，或靠自身 EBIT
              盈利加新资本继续独立增长。论点失效触发项包括：后续融资估值持平或下降（降价轮信号）；尽管有新资本，披露的现金消耗仍明显缩短跑道期；85% YoY
              增速向品类典型区间放缓；披露库存或应收账款问题，且与独立分析师提示的营运资本风险一致；或作为品牌核心资产的创始人经营者离开。
