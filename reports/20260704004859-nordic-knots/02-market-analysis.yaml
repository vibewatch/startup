- id: sizing-gaps-and-market-verdict
  title: Diligence gaps, contradictory estimates, and market verdict
  body: 'Taken together, the evidence supports a real, structurally growing category for premium home textiles, but not a precise, Nordic Knots-specific TAM. No reviewed source isolates ''premium DTC rugs and home textiles'' from the broader carpet/rug, home-textile, or luxury-decor totals, and the two pairs of competing lenses (carpet/rug and home textile) diverge by billions of dollars and multiple CAGR points on the same nominal category. Tariff policy remains litigation-dependent, and the single most-cited furniture-demand driver — housing turnover — is itself contradicted between NAR''s optimistic 2026 forecast and Furniture Today''s more cautious industry read. Rather than resolving these gaps with a constructed point estimate, this analysis preserves the contradictions and directs diligence toward a bottoms-up model: Nordic Knots'' actual price bands, target household counts, and trade/hospitality pipeline data would do more to bound the addressable market than any additional top-down report. The market verdict is that Nordic Knots operates in a real, multi-billion-dollar adjacent category with credible premiumization and sustainability tailwinds, but the public sizing evidence is not precise enough to underwrite a valuation on category growth alone.'
