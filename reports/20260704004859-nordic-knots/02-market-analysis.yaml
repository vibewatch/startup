callouts:
- calloutType: insight
  title: Every sizing lens points the same direction, but none is Nordic Knots-specific
  body: Five independent 2026 market estimates all show mid-single-digit to low-double-digit growth for carpet/rug, home textile, or luxury decor, but none isolates premium DTC rugs and home textiles as its own category. Any valuation argument should treat the reviewed figures as directional context, not a precise TAM for Nordic Knots.
  claimRefs:
  - CM007
  - CM008
  - CM010
  - CM011
  - CM012
  - CM013
- calloutType: risk
  title: Tariff policy for imported rugs is still unresolved
  body: The 2025 Indian rug tariff spike to 50% was challenged in court and is reportedly being negotiated down to 18%, but the outcome and refund process remain unsettled going into the back half of 2026, leaving near-term landed-cost assumptions uncertain for any import-dependent premium rug brand.
  claimRefs:
  - CM025
  - CM027
  - CM028
- calloutType: assumption
  title: Affluent-consumer resilience is the load-bearing growth assumption
  body: Fitch's 2026 outlook explicitly separates affluent consumers (benefiting from housing and asset-price gains) from lower-income consumers facing budget constraints. Nordic Knots' premium price points make this bifurcation, rather than aggregate discretionary spending, the more relevant demand signal to track.
  claimRefs:
  - CM022
  - CM029
  - CM030
