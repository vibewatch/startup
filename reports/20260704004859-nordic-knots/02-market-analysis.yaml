    missingEvidence: A bottoms-up serviceable-obtainable-market (SOM) estimate specific to premium DTC rugs and home textiles, isolated from broader carpet/rug, home-textile, or luxury-decor totals.
    whyItMatters: Without an isolated SOM, any valuation argument built on 'the market is large and growing' risks anchoring to a category Nordic Knots does not fully address.
    diligencePath: Commission or build a bottoms-up model using Nordic Knots' known price bands, target household income deciles, and US/EU premium-rug household counts.
