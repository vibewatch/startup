companyProfile:
  summary: >-
    Avatr Technology is a Chongqing-rooted premium smart EV company backed by Changan, CATL, and Huawei. Public evidence
    shows real commercial scale with 2025 revenue above RMB25 billion, 122,702 deliveries, and 3,978 staff at year-end
    2025, plus continued export-market rollout and a 2026 IPO push. The company still lacks clean public disclosure on
    the post-Series-C cap table, governance, and customer economics, so it remains a strategically backed but still
    partially opaque premium EV platform rather than a fully transparent public-company profile.
