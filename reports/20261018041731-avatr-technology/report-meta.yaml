  topStrengths:
    - Backing from Changan, CATL, and Huawei gives Avatr manufacturing, battery, and smart-vehicle depth.
    - >-
      2025 revenue above RMB25 billion and 122,702 deliveries show that the business has moved well beyond concept-stage
      scale.
    - Premium branding and overseas rollout support a real platform rather than a one-market, one-model story.
  topRisks:
    - Valuation, preference, and debt terms remain opaque, limiting price-sensitive underwriting.
    - Partner dependence is high across manufacturing, batteries, and intelligent-driving software.
    - 2026 momentum and profitability are still too weak for a clean public-market-style conviction call.
  unresolvedGaps:
    - Audited FY2025 and FY2026 financial statements, including cash, debt, burn, and runway.
    - Full cap table and preference stack after Series C and the Yinwang stake purchase.
    - Monthly 2026 sell-through, cancellation, and inventory data by model and channel.
    - Realized ASP, discounting, and gross-margin bridge by model rather than portfolio averages.
    - Cohort retention, repeat purchase, and export-market conversion data.
