company:
  name: Avatr Technology
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The assigned evidence supports a narrow market definition: premium intelligent passenger EVs
    sold primarily in China, with selective distributor-led export expansion. Avatr disclosed a
    2023 Avatr 11 average price of RMB 360,000, while later secondary evidence shows growing
    company-wide volume but weakening sales for that original model. No retained source isolates a
    defensible TAM, SAM, or SOM for Avatr's exact price, powertrain, and geographic wedge.
sections:
  - id: market-boundary
    title: The supportable boundary is premium intelligent EVs, not the whole auto market
    body: >-
      Avatr and its largest shareholder consistently define the company around premium intelligent
      electric vehicles, and the product evidence narrows that label further. The official global
      site lists sedans, SUVs, and limited editions, while the Avatr 11 is described as a mid-size
      luxury crossover available in battery-electric and range-extended forms. That makes the
      relevant spend pool premium passenger-vehicle purchases in smart-EV categories, with
      conventional premium cars, mass-market EVs, and broad mobility services acting as substitutes
      or adjacencies rather than included spend. The 2023 Avatr 11 snapshot—12,000 deliveries at an
      average price of RMB 360,000—anchors the observed price tier but does not establish the size of
      that tier.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Company scale is observable, but category TAM, SAM, and SOM are not
    body: >-
      The available sources provide company and model scale rather than a category denominator.
      Wikipedia records Avatr-wide sales of 73,606 vehicles in 2024 and 120,000 in 2025, while an
      independent brand profile says cumulative sales had exceeded 150,000 by September 2026. Those
      measures have different periods and denominators and therefore cannot be stacked into a
      market-share calculation. The model-level evidence is also mixed: the Avatr 11 retail series
      shown by Wikipedia falls from 21,665 units in 2023 to 8,645 in 2024 and 3,283 in 2025 even as
      the overall brand broadens its lineup. This supports an execution lens based on actual sales,
      price bands, and model mix—not a top-down TAM claim.
    claimRefs: [CM007, CM008, CM014, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-adoption-path
    title: The observable buyer path is consumer retail supported by physical channels
    body: >-
      Avatr's public surfaces emphasize vehicle configuration, an owner app, owner-shared driving
      experiences, and showrooms. That pattern supports a consumer-retail interpretation in which an
      individual or household is usually the buyer, user, and payer, although the retained evidence
      does not quantify fleet sales, leasing, financing, or demographic cohorts. Physical
      distribution remains material: in August 2023 Avatr said it had more than 200 showrooms and
      targeted 350 points of sale by year-end. Product adoption is framed around Huawei-assisted
      driving and cockpit software, CATL battery technology, high-voltage charging, and multiple
      body-style and powertrain choices. These are company claims, not independent proof of
      willingness to pay or retention.
    claimRefs: [CM002, CM003, CM006, CM012, CM013, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-geography
    title: Selective exports widen reach, while weak model momentum and missed timing constrain adoption
    body: >-
      International expansion is real but bounded. The Avatr 11 source records launches in Nepal,
      Thailand, Brunei, Qatar, and Pakistan, and an independent profile describes Thailand as a
      bridgehead for other right-hand-drive Southeast Asian markets. The same profile also says Avatr
      missed its stated UK launch target and had not confirmed a replacement date by September 2026.
      Domestically, cumulative brand sales and a broader lineup are positive demand signals, but the
      profile still characterizes Avatr as roughly the 35th-to-50th brand by monthly Chinese sales,
      and the Avatr 11 series shows sharp model-level erosion. Underwriting should therefore focus on
      sell-through by model, channel productivity, achieved pricing, and export conversion before
      assigning value to a broad international growth narrative.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM016]
