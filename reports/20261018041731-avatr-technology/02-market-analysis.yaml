      - ["AVATR / 2023", "China", "RMB 360,000", "Average price for the first 12,000 Avatr 11 deliveries", "Company disclosure", "medium", "Historical realized average; mix and discounts undisclosed"]
      - ["Wikipedia / 2024", "China", "73,606 vehicles", "Avatr-wide 2024 production output / annual sales table", "Secondary compilation", "medium", "Underlying series is not independently audited in this pool"]
      - ["Wikipedia / 2025", "China", "120,000 vehicles", "Avatr-wide annual sales", "Secondary compilation", "medium", "Company scale, not TAM, SAM, SOM, or market share"]
      - ["Wikipedia / 2023-2025", "China", "21,665 -> 8,645 -> 3,283", "Avatr 11 annual retail sales", "Secondary compilation of cited sales rankings", "medium", "One model; powertrain and channel definitions vary by row"]
    notes: >-
      Values are not additive and use different periods and denominators. No CAGR is calculated, and
      no retained source provides a defensible premium-intelligent-EV TAM, SAM, SOM, or category
      denominator for Avatr's exact wedge.
    claimRefs: [CM004, CM014, CM016]
