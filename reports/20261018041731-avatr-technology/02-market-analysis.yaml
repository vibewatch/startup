      share, financing mix, and demographic conversion remain undisclosed.
    claimRefs: [CM002, CM003, CM006, CM009, CM011, CM012, CM015]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Six nested evidence layers narrow Avatr's opportunity from stated category ambition to observed
      model-level conversion without presenting the layers as a numeric TAM/SAM/SOM hierarchy.
    data:
      items:
        - label: Stated category
          displayValue: "Premium intelligent EV"
          note: "Company and shareholder positioning; no category value supplied."
          claimRefs: [CM001]
        - label: Primary served geography
          displayValue: "China, plus selective exports"
          note: "The retained evidence does not support a global served-market denominator."
          claimRefs: [CM009, CM011]
        - label: Product boundary
          displayValue: "Sedans and SUVs; BEV and EREV"
          note: "Official and secondary product evidence shows multiple body styles and powertrains."
          claimRefs: [CM002, CM003]
        - label: Historical price anchor
          displayValue: "RMB 360,000 average"
          note: "Company-reported average for the first 12,000 Avatr 11 deliveries as of August 2023."
          claimRefs: [CM004]
        - label: Brand scale
          displayValue: "120,000 vehicles in 2025"
          note: "Secondary annual sales compilation; not market size or share."
          claimRefs: [CM014]
        - label: Model conversion signal
          displayValue: "3,283 Avatr 11 retail units in 2025"
          note: "Secondary model series, down from 21,665 in 2023."
          claimRefs: [CM016]
    approximationNotes: >-
      Pyramid order represents progressive boundary narrowing, not proportional magnitude. The
      values have different denominators and periods and must not be added, divided, or interpreted
      as TAM, SAM, SOM, conversion rates, or market share.
    claimRefs: [CM001, CM002, CM003, CM004, CM009, CM011, CM014, CM016]
callouts:
  - calloutType: insight
    title: Use a constrained served-market lens
    body: >-
      Public evidence supports premium smart-EV price, product, channel, and company-scale lenses,
      but not a defensible top-down market value for Avatr's exact wedge.
    claimRefs: [CM001, CM004, CM014]
  - calloutType: risk
    title: Brand growth masks original-model erosion
    body: >-
      Broader brand volume increased while the Avatr 11 retail series fell sharply, so market
      underwriting requires model-level sell-through and achieved-price evidence.
    claimRefs: [CM014, CM016]
