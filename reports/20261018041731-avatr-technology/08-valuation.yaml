      - ["Premium product position", "Official materials and early model pricing support a premium intelligent-EV positioning rather than a low-end volume play.", "Heavy discounting, weak inventory turns, or margin regression would show that premium positioning is not translating into economic value."]
      - ["Scale and profitability pressure", "2026 sell-through and cumulative losses still look weak versus what a durable premium valuation would normally require.", "A sustained step-up in monthly deliveries and cash preservation would reduce the anti-thesis weight."]
      - ["Valuation transparency gap", "Historical rounds and a pre-IPO implied mark exist, but no retained source publishes a live price range or full preference stack.", "A disclosed valuation range plus clean cap-table terms would turn the debate from 'can we price this?' to 'is the price attractive?'."]
    notes: >-
      Thesis rows combine source-backed facts with explicit falsifiers so the chapter stays price-sensitive instead of grading company quality in the abstract.
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "IPO or private financing clears near or above the last implied ~RMB 26 billion mark, monthly deliveries accelerate materially from the Jan-May 2026 run rate, and margin improvement holds.", "Historical valuation markers can hold if Avatr converts strategic backing into visible scale and cleaner self-funding.", "Execution miss on scale, margin giveback, or terms that privilege new capital.", "Possible but not yet evidenced by retained 2026 operating data."]
      - [Base, "Premium brand position and funding access remain intact, but current pricing terms stay undisclosed and sales remain below leading EV peers.", "Public evidence supports watchlist ownership logic, not a precise invest-now return case.", "Hidden dilution, further cash burn, and IPO delay.", "Most consistent with the retained evidence set."]
      - [Bear, "Losses persist, cash keeps falling, and new capital or IPO demand arrives at weaker terms than the last observed marker.", "Return math compresses through valuation reset, dilution, or both before scale catches up.", "Down round, extended holding period, or liquidity event that favors insiders over new equity.", "Material risk given the current gap between premium story and scale proof."]
    notes: >-
      Scenario logic is directional because the retained sources do not disclose a live IPO range, current cap table, or preference stack needed for precise share-price underwriting.
    claimRefs:
