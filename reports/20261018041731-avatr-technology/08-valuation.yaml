  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-transparency
      missingEvidence: Current IPO price range or private-round term sheet, including share count, preference stack, and anti-dilution terms.
      whyItMatters: Without live pricing and downside terms, the last observed valuation marker cannot be translated into an investable return case.
      diligencePath: Request the current draft prospectus cap table or financing materials and reconcile them to the last disclosed implied valuation.
      relatedQuestionRefs:
        - QV005
        - QV006
    - type: stale
      severity: material
      topic: 2026-commercial-traction
      missingEvidence: Monthly 2026 sell-through, discounting, and inventory by model after May 2026.
      whyItMatters: The current chapter is forced to judge valuation risk on an incomplete operating year and cannot tell whether recent scale weakness is temporary or structural.
      diligencePath: Obtain monthly delivery, channel-inventory, and realized-ASP reporting by model for June 2026 onward.
      relatedQuestionRefs:
        - QV002
        - QV007
    - type: private-evidence-only
      severity: material
      topic: balance-sheet-durability
      missingEvidence: Audited cash, debt, runway, and covenant disclosures after the April 2026 cash balance and the Yinwang investment.
      whyItMatters: Capital intensity and financing terms can dominate equity returns in auto platforms even when revenue growth and brand traction look real.
      diligencePath: Review the latest audited statements, debt schedules, and board-approved financing plan before underwriting a price-sensitive recommendation.
      relatedQuestionRefs:
        - QV002
        - QV008
