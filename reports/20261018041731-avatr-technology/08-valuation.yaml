company:
  name: Avatr Technology
chapter:
  number: 8
  title: Valuation
  summary: >-
    Avatr has credible strategic backing, premium-brand positioning, and improving gross margin, but the public
    evidence does not support a current valuation classification or an invest-now opportunity. Historical valuation markers
    around RMB 20 billion in Series B and about RMB 26 billion before the Hong Kong filing are not enough to clear
    current 2026 scale, burn, and pricing-term uncertainty, so the supportable call remains research-more.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The supportable recommendation is research-more, not because Avatr lacks strategic quality, but because the
      current public package is not price-complete. The upside case is easy to see: Changan, CATL, and Huawei backing
      still matter; the brand has held premium price points; and historical funding rounds show repeated investor
      support. The problem is that the latest evidence is still a partial underwriting record. Avatr refiled its Hong
      Kong application after the prior prospectus lapsed, the latest public valuation marker is only an implied
      November 2025 transfer at about RMB 26 billion, and none of the retained sources disclose a live IPO price
      range, liquidation preference stack, or current debt terms. At the same time, first-five-month 2026 deliveries
      averaged only about 4,032 units per month while losses and cash drawdown remained material. That combination can
      support a watchlist stance or a conditional entry screen, but not a conviction buy at unknown terms.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV012
      - CV013
      - CV015
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: financing-context-and-scenario-range
    title: Financing context and scenario range
    body: >-
      The public financing trail shows why Avatr still deserves diligence time. The company completed Series B in
      August 2023 with RMB 3 billion raised at an estimated RMB 20 billion valuation, then secured more than RMB 11
      billion in Series C in December 2024. By the 2025 Hong Kong filing, a disclosed stake transfer implied roughly
      RMB 26 billion of equity value, while first-half 2025 revenue reached RMB 12.21 billion and gross margin turned
      positive at 10.1%. Those data points support a real premium-EV platform rather than a concept story. Still,
      the 2026 evidence is not clean enough to underwrite that valuation marker as durable. CnEVPost reported 2025
      gross margin of only 9.4%, cost of sales at 90.6% of revenue, cumulative losses above RMB 13.2 billion from
      2022 to 2025, and cash falling to RMB 6.25 billion by April 30, 2026. The right scenario frame is therefore
      milestone-based: better sell-through and preserved cash can justify re-engagement, while weak conversion of IPO
      readiness into self-funded scale raises down-round risk.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV003
  - id: diligence-gates-and-thesis-breakers
    title: Diligence gates and thesis-breakers
    body: >-
      The remaining work is less about deciding whether Avatr is a real company and more about deciding whether a
      specific price is defensible. Public evidence supports a premium intelligent-EV positioning, confirms material
      historical fundraising, and shows some operating improvement. It does not yet answer the questions that matter
      most for downside underwriting: the current IPO or private-round valuation range, the preference and dilution
      structure after Series C and the Yinwang investment, model-level discounting and inventory in 2026, and the
      durability of cash versus continuing losses. The thesis breaks if 2026 sell-through remains subscale, if gross
      margin progress reverses once growth is pushed harder, or if new capital arrives on meaningfully weaker terms
      than the last implied mark. The thesis improves if Avatr can show cleaner pricing discipline, better cash
      preservation, and transparent terms that leave room for venture-style upside after dilution and preferences.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
callouts:
  - calloutType: recommendation
    title: Current call
    body: >-
      Research-more is the disciplined call until Avatr discloses live pricing terms or a cleaner private entry point
      that compensates for continuing losses, 2026 scale risk, and possible dilution/preference overhang.
    claimRefs:
      - CV012
      - CV015
  - calloutType: risk
    title: Main downside to monitor
    body: >-
      The clearest downside path is a weaker financing window or down-round dynamic before Avatr proves that current
      premium positioning can translate into materially higher volume without giving back margin or cash.
    claimRefs:
      - CV008
      - CV009
      - CV016
