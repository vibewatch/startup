      - ["Supplier-enabled software stack", "Huawei cockpit and intelligent-driving systems repeatedly disclosed", "Assigned pool does not provide equivalent disclosures for named rivals", "Strong disclosed stack for buyer messaging; hard to prove uniqueness from this pool alone"]
      - ["Battery / vehicle platform leverage", "CATL-backed platform and high-voltage architecture disclosed", "Peer-class comparison unavailable in assigned pool", "Helps Avatr claim technical credibility without proving category leadership"]
      - ["Powertrain breadth", "BEV and EREV offered on Avatr 06T; flagship T09 described as super-hybrid triple-motor", "Alternative-set specifics unknown in assigned pool", "Broader product coverage supports multi-homing defense inside premium EV demand"]
      - ["Export route to market", "70 countries / regions claimed; Thailand and Egypt highlighted in 2026 reporting", "Assigned pool lacks equivalent peer export metrics", "Useful wedge for growth narrative, but externally verified sell-through is missing"]
      - ["Independent benchmark transparency", "No assigned-source third-party comparison tests or customer review datasets", "Same gap applies to peer rows in this pool", "This is the chapter's biggest comparability blocker, not evidence of superiority"]
    notes: >-
      Unsupported competitor cells are intentionally marked as unknown or missing because the
      worker pool lacks retained competitor official pages, benchmark tests, and review datasets.
    claimRefs: [CP003, CP005, CP007, CP009, CP010, CP012, CP013, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer / signal
      - Price / unit / contract model
      - Included capabilities
      - Competitive implication
    rows:
      - ["Avatr 06T", "RMB 219,900-279,900 list price; five variants", "BEV and EREV options; Huawei Qiankun ADS 4 on the line; wagon body style", "Broadens Avatr below its earlier 11 price points without dropping out of premium positioning"]
      - ["Avatr 11 Harmony Edition", "RMB 280,000 starting price", "Harmony cabin plus Huawei ADS 2.0", "Creates an entry point into Avatr's premium SUV stack while preserving software-led branding"]
      - ["Avatr 11 delivered mix (2023 disclosure)", "Average price RMB 360,000; dual-motor above RMB 400,000", "High-end pure electric SUV positioning", "Shows Avatr was already pricing in the first tier of the RMB 300,000 pure-electric SUV market"]
      - ["Avatr T09 concept", "Targeted at the RMB 500,000 luxury SUV segment", "New flagship series, super-hybrid triple-motor setup, Huawei Qiankun stack", "Pushes the brand into a higher luxury tier and raises direct confrontation with premium incumbents"]
      - ["Overseas premium push", "Average selling price above RMB 300,000 claimed in overseas markets", "Export to 70 countries / regions claimed; profitability, Egypt share, and Thailand ranking cited", "Suggests Avatr is competing for premium EV niches abroad, but realized channel economics are not disclosed"]
    notes: >-
      All prices here are public list-price or company-claimed pricing signals from the assigned
      pool; the chapter does not infer realized discounts, financing, or competitor transaction
      prices that are not directly supported.
    claimRefs: [CP005, CP006, CP007, CP008, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of where Avatr's current offers and closest documented internal alternative sit
      on disclosed partner-stack leverage versus premium price/brand tier.
    data:
      xAxis:
        label: Partner-stack leverage
        min: 1
        max: 5
        lowLabel: Less supplier-led
        highLabel: More supplier-led
        description: "Ordinal score based on how prominently the evidence cites Changan, CATL, and Huawei as the product stack."
      yAxis:
        label: Premium price / brand tier
        min: 1
        max: 5
        lowLabel: Mainstream
        highLabel: Flagship luxury
        description: "Ordinal score based on disclosed price bands or explicit premium-segment language in the assigned pool."
      points:
        - label: Deepal sibling alternative
          x: 2
          y: 2
          note: "Mainstream Changan sibling, not the premium end."
        - label: Avatr 06T
          x: 4
          y: 3
          note: "Huawei ADS 4; RMB 219,900-279,900 wagon."
        - label: Avatr 11 Harmony Edition
          x: 4
          y: 4
          note: "RMB 280,000 starting price with Huawei ADS 2.0."
        - label: Avatr 11 delivered mix
          x: 4
          y: 4
          note: "Average delivered price RMB 360,000 in 2023 disclosure."
        - label: Avatr overseas premium niche
          x: 4
          y: 4
          note: "Claimed ASP above RMB 300,000 and profitable export markets."
        - label: Avatr T09 flagship
          x: 5
          y: 5
          note: "Targeted at the RMB 500,000 luxury SUV segment."
    approximationNotes: >-
      Axes are ordinal rather than benchmark-normalized because the assigned pool lacks peer-by-peer
      external pricing and product-test datasets; scores summarize disclosed segment and stack
      signals only.
    claimRefs: [CP005, CP006, CP007, CP010, CP012, CP013]
