      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["SEV / CHN vehicle platform", "Shared EV foundation across multiple Avatr nameplates", "Changan-led vehicle engineering plus Avatr product planning", "Platform flexibility is clear on official surfaces, but public disclosure does not show platform economics or defect history"]
      - ["Battery and high-voltage charging", "Supports BEV range, EREV backup, and rapid charging claims", "CATL cells and packs; Shenxing 5C battery on 07L; NMC packs on 11 variants", "Battery supply and charging claims are partner dependent and cycle-based rather than field-verified"]
      - ["Intelligent driving stack", "Provides lane-keeping, parking, and navigation-assist features", "Huawei ADS / Qiankun ADS software, sensors, and LiDAR hardware", "Feature credibility depends on Huawei roadmap, local regulation, and model-by-model sensor configuration"]
      - ["Cockpit and in-vehicle OS", "Delivers infotainment, displays, and app experience", "HarmonyOS / HarmonySpace and Huawei vehicle-control systems", "Software quality outside China is not independently underwritten in this pool"]
      - ["Cloud, app, and OTA loop", "Remote operations, data training, and post-sale feature updates", "Avatr app plus cloud big-data training and OTA pipeline", "No independent disclosure here on data governance, security testing, or OTA failure rates"]
      - ["Sales, service, and export operations", "Turns product spec into a delivered ownership experience", "Avatr points of sale, local distributors, and country certification workflows", "After-sales coverage and export-market support remain unevenly evidenced across the assigned sources"]
    notes: "Maps official architecture statements to model-level evidence and execution risks; blank financial or reliability metrics remain diligence asks rather than inferred facts."
    claimRefs: [CE002, CE003, CE004, CE006, CE008, CE009, CE011, CE014]
