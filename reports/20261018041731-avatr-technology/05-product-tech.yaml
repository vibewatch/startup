      - ["Dealer or distributor export sourcing", "Channel partner needs a premium Chinese EV with recognizable suppliers", "Avatr 11 is sold as a Huawei/CATL/Changan-backed export proposition", "Official and reseller sources both stress Huawei software and CATL battery credibility", "Export workflow still depends on local certification, service readiness, and market-specific documentation"]
