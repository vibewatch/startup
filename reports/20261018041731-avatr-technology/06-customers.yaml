schemaVersion: report-v2
artifact: customers
slug: avatr-technology
runDate: 2026-10-18
company:
  name: Avatr Technology
chapter:
  number: 6
  title: Customers
  summary: >-
    Avatr has credible retail-adoption proof through delivered vehicles, a
    multi-model lineup, domestic channel expansion, and production launches in
    Thailand and the Middle East. The evidence remains much weaker on retention,
    repeat purchase, sell-through, satisfaction, and channel concentration, so
    shipment growth should not be read as proof of durable customer economics.
sections:
  - id: retail-segmentation
    title: Public evidence supports a premium B2C retail base, not account-level segmentation
    body: |-
      Avatr's customer evidence is oriented toward individual vehicle buyers rather than enterprise accounts. Its Singapore and Hong Kong sites consistently position the marque as a premium intelligent EV brand, while an independent private-market profile labels the customer focus B2C and the revenue model product sales. The global site lists six current nameplates, and an independent market profile describes four models actively sold in China, indicating a portfolio broad enough to segment customers by body style, price band, and geography rather than a single flagship. This public segmentation is still incomplete: no assigned source quantifies private versus fleet sales, buyer income, financing mix, model-level customer composition, or who ultimately bears the payment obligation in distributor-led export markets.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Deliveries and channel build-out prove commercialization, but the denominators conflict
    body: |-
      Customer adoption is better evidenced than retention. Avatr's 2023 funding announcement reported 12,000 delivered Avatr 11 vehicles at an average price of RMB 360,000 and more than 200 showrooms, establishing production use and premium transaction evidence rather than reservation-only demand. BitAuto later reported 73,606 vehicles sold in 2024, 5,279 monthly sales in April 2026, more than 150,000 cumulative deliveries, and over 700 domestic channel touchpoints. It also reported roughly 70,000 Avatr 07 deliveries one year after launch. These measures show meaningful scale, but public definitions are not reconciled: users, owners, sales, deliveries, channel touchpoints, wholesale shipments, and retail sell-through are not interchangeable, and the available pages do not disclose cancellations or inventory.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
  - id: durability-expansion
    title: Overseas production adoption is visible while retention and execution remain unproven
    body: |-
      Thailand is the clearest export-market customer proof in the assigned evidence: BitAuto reports an initial Avatr 07 delivery cohort of more than 100 users and more than 1,000 cumulative Avatr 11 deliveries, while the Avatr 11 reference page records a September 2024 Thailand launch. Qatar and the UAE provide additional production-market evidence, but public unit depth is thinner. Expansion is not frictionless: Chinese Car Brands says Avatr missed its targeted UK launch by the end of 2025 and still lacked a revised date in September 2026. The same source characterizes Avatr as a relatively niche domestic brand despite more than 150,000 cars sold since launch. No assigned source provides retention, repeat purchase, owner satisfaction, dealer productivity, or distributor concentration, leaving durability a material diligence gap.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
    tableRefs:
      - TU003
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale or proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Mainland China premium retail
        - Public evidence points to a B2C owner-driver; payer mix is undisclosed
        - Premium intelligent EV ownership across sedan and SUV formats
        - Six nameplates appear on the official global site; an independent profile says four models are sold in China
        - Core domestic volume and premium-price validation
        - No private-versus-fleet, financing, or model-level customer mix
      - - Thailand right-hand-drive retail
        - Retail owner through local distribution; distributor economics are undisclosed
        - Right-hand-drive Avatr 07 and Avatr 11 ownership
        - 100+ initial Avatr 07 users and 1,000+ cumulative Avatr 11 deliveries reported
        - Clearest overseas production-adoption beachhead
        - No monthly sell-through, cohort retention, or dealer productivity
      - - Middle East premium retail
        - Retail owner through importer or distributor; payer structure is undisclosed
        - Avatr 11 and broader premium EV market entry
        - UAE deliveries and a Qatar launch are documented
        - Tests portability of the premium proposition beyond China
        - No comparable country-level units, retention, or service utilization
      - - Prospective UK and wider Europe
        - Future retail buyer; no delivered customer base is established
        - Intended premium EV expansion
        - The stated UK timing was missed and no replacement date was confirmed
        - Strategic option rather than current customer value
        - No live sales, owner, or service-density evidence
    notes: >-
      Segments are inferred from public product, launch, and delivery evidence;
      null or undisclosed payer and channel fields require management data.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU013
      - CU015
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Avatr 11 delivered units and average price
        - 12,000 units; RMB 360,000 average price
        - As of 2023-08-30
        - AVATR Series B announcement
        - Medium
        - Confirms delivered premium vehicles rather than reservations
        - Active fleet, cancellations, satisfaction, and repeat purchase
      - - Domestic channel footprint
        - More than 200 showrooms; target of 350 points of sale
        - Actual by 2023-08-30; target for end-2023
        - AVATR Series B announcement
        - Medium
        - Shows early distribution investment
        - Number opened, productive, retained, or profitable
      - - Annual and monthly sales
        - 73,606 in 2024; 5,279 in April 2026
        - 2024 and 2026-04
        - BitAuto
        - Medium
        - Demonstrates material commercial volume
        - Wholesale versus retail sell-through, inventory, and cancellations
      - - Cumulative delivery and channel scale
        - More than 150,000 deliveries; 700+ touchpoints in 200+ cities
        - As of 2026-04
        - BitAuto
        - Medium
        - Indicates an installed base and broad domestic access
        - Definitions for users, owners, sales, deliveries, and active customers
      - - Avatr 07 model adoption
        - Approximately 70,000 cumulative deliveries
        - One year after launch
        - BitAuto
        - Medium
        - Suggests traction beyond the original Avatr 11
        - Exact cutoff date, geography, powertrain mix, and cancellations
    notes: >-
      Metrics retain their source periods and labels; users, owners, sales,
      deliveries, showrooms, and touchpoints are not treated as one denominator.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or market proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Thailand Avatr 07 and Avatr 11 owner cohorts
        - Export retail
        - Right-hand-drive premium EV ownership
        - Production
        - More than 100 initial Avatr 07 users and more than 1,000 cumulative Avatr 11 deliveries reported
        - Owners are not individually named; retention and dealer productivity are absent
      - - Qatar and UAE buyers
        - Export retail
        - Middle East premium EV market entry
        - Production launch / delivery
        - Qatar launch dated 2025-02-24; UAE deliveries reported from January 2025
        - Comparable unit counts and cohort outcomes are unavailable
      - - Prospective UK buyers
        - Prospective export retail
        - Intended Avatr 11 launch
        - Not proven
        - The end-2025 launch target was missed and no new date was confirmed by September 2026
        - This is execution-risk evidence, not customer traction
    notes: >-
      This is a partial sample of public market-level proof; no assigned source
      provides a complete named-owner, fleet-customer, or distributor roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Assigned public sources cover selected country launches and delivery
        milestones, not the full population of Avatr owners or channel partners.
    claimRefs:
      - CU012
      - CU013
      - CU015
figures:
  - id: FU001
    title: Retail customer journey and expansion loop
    type: journey-map
    summary: >-
      Public evidence traces a retail path from premium positioning to delivered
      ownership and service, with export replication constrained by execution.
    data:
      items:
        - label: Premium discovery
          detail: Official regional pages frame Avatr as a premium intelligent EV brand.
          touchpoints:
            - Brand pages
            - Partner ecosystem
        - label: Model consideration
          detail: Six nameplates on the global site support sedan and SUV choice.
          touchpoints:
            - Vehicle lineup
            - Intelligent-EV technology proposition
        - label: Showroom conversion
          detail: More than 200 showrooms were reported by August 2023.
          touchpoints:
            - Physical retail
            - Planned points-of-sale expansion
        - label: Delivered ownership
          detail: Delivered-unit and average-price disclosures demonstrate paid production use.
          touchpoints:
            - Vehicle handover
            - Installed-base growth
        - label: Digital and service engagement
          detail: The official app promotes owner sharing, while public reporting describes after-sales and OTA services.
          touchpoints:
            - AVATR app
            - Battery monitoring
            - OTA upgrades
        - label: Export replication
          detail: Thailand and Gulf deployment provide proof, while the missed UK timing shows execution friction.
          touchpoints:
            - Local distributors
            - Right-hand-drive rollout
    approximationNotes: >-
      The sequence is an evidence-based journey map, not a measured conversion
      funnel; no stage conversion rates or cohort retention are publicly disclosed.
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU012
      - CU013
      - CU015
      - CU016
callouts:
  - calloutType: strength
    title: Production adoption is established
    body: >-
      Delivered-unit, average-price, model, and channel disclosures are stronger
      evidence than launch announcements alone and show a real premium retail base.
    claimRefs:
      - CU007
      - CU009
      - CU010
      - CU011
  - calloutType: risk
    title: Durability remains a management-data question
    body: >-
      Public sources do not disclose retention, repeat purchase, satisfaction,
      cancellations, dealer productivity, or distributor concentration.
    claimRefs:
      - CU014
      - CU015
