  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The supportable boundary is premium intelligent EVs, not the whole auto market
        blocks:
          - type: paragraph
            body: >-
              Avatr and its largest shareholder consistently define the company around premium intelligent electric
              vehicles, and the product evidence narrows that label further. The official global site lists sedans,
              SUVs, and limited editions, while the Avatr 11 is described as a mid-size luxury crossover available in
              battery-electric and range-extended forms. That makes the relevant spend pool premium passenger-vehicle
              purchases in smart-EV categories, with conventional premium cars, mass-market EVs, and broad mobility
              services acting as substitutes or adjacencies rather than included spend. The 2023 Avatr 11
              snapshot—12,000 deliveries at an average price of RMB 360,000—anchors the observed price tier but does not
              establish the size of that tier.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
