      - number: '3.3'
        title: Price ladder and route-to-market show premium intent, not yet benchmarked superiority
        blocks:
          - type: paragraph
            body: >-
              The chapter's public pricing evidence is enough to show a deliberate premium ladder. Avatr's 2023
              announcement said the Avatr 11 had delivered 12,000 units at an average price of RMB 360,000, with the
              dual-motor version above RMB 400,000, and set a lower starting price of RMB 280,000 for the 11 Harmony
              Edition. In 2026, the 06T launched at RMB 219,900 to RMB 279,900, while the T09 concept was explicitly
              positioned for the RMB 500,000 luxury SUV segment. Distribution is also part of the competitive pitch:
              Avatr targeted 350 points of sale by the end of 2023 and later claimed presence in 70 countries and
              regions with profitability in overseas markets. What the pool does not show is whether those prices or
              markets outperform direct premium EV peers on sell-through, dealer economics, or realized discounts.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.4'
        title: Durability risks center on overlap, under-disclosed external proof, and momentum
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in the assigned pool points to competitive fragility even though Avatr has a credible
              premium narrative. CarNewsChina reported modest disclosed 2026 monthly sales and said Changan planned to
              integrate Avatr and Deepal amid loss pressure, while another independent profile called Avatr's
              home-market performance respectable rather than spectacular and noted a missed UK launch target. Those
              signals matter because they suggest the brand still has to prove that partner-backed technology, export
              ambition, and premium pricing convert into durable independent demand. Until the company discloses more
              competitor-by-competitor benchmarks, customer retention, or third-party product comparisons, the moat
              looks credible enough to win attention but not yet independently proven enough to dismiss commoditization
              or sibling-brand overlap risk.
            claimRefs:
              - CP009
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner stack accelerates premium product breadth
            body: >-
              Public evidence shows Avatr already spans sedan, SUV, wagon, and flagship concept positions while leaning
              on Changan manufacturing, CATL battery depth, and Huawei cockpit/ADAS systems, which is a faster premium
              buildout than a standalone startup would usually disclose.
            calloutType: strength
            claimRefs:
