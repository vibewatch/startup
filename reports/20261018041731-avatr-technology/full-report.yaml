      - number: '5.2'
        title: Platform architecture and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              The official technical story is a partner-enabled smart-vehicle stack. Avatr's global surfaces describe an
              all-new intelligent EV platform with flexible model coverage, domain-fused electronics, Huawei operating
              systems for the cockpit and intelligent driving, cloud-data training, and OTA updates. The Hong Kong
              about-us page adds the corporate dependency layer: Changan remains the manufacturing anchor, CATL supplies
              the battery technology, and Huawei provides intelligent components including ADAS algorithms and cockpit
              solutions. Product-level evidence makes that stack concrete. The Avatr 11 is repeatedly described as
              Huawei Inside with HarmonyOS, a 34-sensor assisted driving suite, and high-voltage charging, while the 07L
              extends the same architecture into a newer mid-to-large SUV with Qiankun ADS 5, HarmonySpace, CATL's
              Shenxing battery, and trim-based LiDAR differentiation. The technical upside is integration and feature
              density; the structural risk is that Avatr's customer promise depends heavily on third-party software,
              sensor, and battery partners instead of a fully vertically controlled stack.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE008
              - CE009
              - CE011
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE011
