      - number: '4.2'
        title: Pricing, margin path, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Avatr's public pricing posture is clearly premium, but pricing visibility is still list-price heavy. The
              company said in its 2023 Series B release that the first model, Avatr 11, had delivered 12,000 units at an
              average price of RMB360,000, while CathayEV reported that the August 2026 China range stretched from
              CNY219,900 on a limited-time promotion to CNY279,900 for the tri-motor Ultra trim. Those data points help
              bracket positioning, but they are not a realized ASP bridge by model or channel. Independent reporting is
              more useful on the cost side: Electric Viking says cost of sales was 90.6% of revenue in 2025 and gross
              margin improved from 6.3% to 9.4%, which is progress but still thin for a capital-intensive OEM. Because
              the public record lacks CAC, payback, outlet productivity, warranty reserves, and working-capital detail,
              the underwriteable conclusion is not "improving SaaS economics" but "early hardware margin progress with
              major commercial-efficiency blind spots."
            claimRefs:
              - CI004
              - CI006
              - CI011
              - CI012
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Capital adequacy and underwriting view
        blocks:
          - type: paragraph
            body: >-
              The main underwriting issue is not whether Avatr can sell vehicles, but whether improving scale can outrun
              cash consumption without another large financing event. Electric Viking reports cumulative losses above
              $1.9 billion from 2022 through 2025, a remaining expectation of net loss in 2026, and cash and cash
              equivalents falling from $2.8 billion at the end of 2024 to $1.4 billion at year-end 2025 and then $918.5
              million by 30 April 2026. Against that backdrop, strategic backing still matters: Avatr's 2023 Series B
              raised RMB3 billion at up to RMB20 billion valuation, and official surfaces still present Changan and CATL
              as the largest shareholders while Huawei remains a strategic technology partner. That mix supports another
              financing path if required, but it also underlines partner dependence and the absence of clean stand-alone
              profitability evidence. Financially, the verdict is "credible traction, improving margin, insufficient
              disclosure on burn, debt, working capital, and realized pricing to underwrite without additional
              diligence."
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is no longer hypothetical
            body: >-
              Public 2025 disclosures of more than RMB25 billion in revenue and 122,702 deliveries mean Avatr should be
              evaluated as a scaling OEM, not as a pre-revenue premium EV concept.
            calloutType: strength
            claimRefs:
              - CI002
              - CI003
          - type: callout
            title: Margin improvement still sits inside a cash-burn story
            body: >-
              Even with improving gross margin, public reporting still shows cumulative losses through 2025 and a
              material cash decline by April 2026, which keeps financing dependency central to the underwriting case.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Underwrite only with management-account detail
            body: >-
              The next diligence step is not another top-line market narrative; it is audited FY2025/FY2026 statements
              plus monthly burn, debt, inventory, and realized ASP detail by model and channel.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product footprint and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Avatr's current delivered product is not one premium EV but a family of premium intelligent vehicles aimed
              at adjacent customer jobs. The global homepage lists the 06, 06T, 07, 07L, 11, and 12, plus the halo 011
              and 012 editions, while third-party coverage describes the line as a mix of fastback SUVs, conventional
              SUVs, and saloons. The practical workflow evidence in the assigned pool centers on the 11, 07, and 07L:
              the 11 is positioned as a large luxury crossover for buyers weighing premium export inventory, the 07
              guide frames the product around commuting, long-distance travel, and family use, and the 07L launch shows
              Avatr refreshing the core SUV offer rather than relying on a static catalog. That makes the chapter's
              product map a live portfolio view, but public evidence for the 06/06T/012 outside Avatr surfaces is still
              shallow, so diligence should confirm each nameplate's actual production status, market availability, and
              export readiness before underwriting a broad multi-model expansion story.
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE010
