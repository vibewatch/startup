      - number: '2.3'
        title: The observable buyer path is consumer retail supported by physical channels
        blocks:
          - type: paragraph
            body: >-
              Avatr's public surfaces emphasize vehicle configuration, an owner app, owner-shared driving experiences,
              and showrooms. That pattern supports a consumer-retail interpretation in which an individual or household
              is usually the buyer, user, and payer, although the retained evidence does not quantify fleet sales,
              leasing, financing, or demographic cohorts. Physical distribution remains material: in August 2023 Avatr
              said it had more than 200 showrooms and targeted 350 points of sale by year-end. Product adoption is
              framed around Huawei-assisted driving and cockpit software, CATL battery technology, high-voltage
              charging, and multiple body-style and powertrain choices. These are company claims, not independent proof
              of willingness to pay or retention.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
