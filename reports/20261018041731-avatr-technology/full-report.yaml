              - CP014
      - number: '3.2'
        title: Differentiation is real, but heavily supplier-mediated
        blocks:
          - type: paragraph
            body: >-
              Avatr's strongest public differentiation is not a uniquely disclosed cost or channel advantage; it is a
              bundled product proposition built around premium design language, Huawei-enabled cockpit and driving
              systems, and CATL-backed battery and platform claims. Official materials repeatedly anchor the stack
              around "new architecture, powerful computing, and high-voltage charging," while independent summaries also
              describe Huawei's intelligent driving and smart-cockpit software as defining product elements. That gives
              Avatr a credible premium-smart-EV story and helps it segment away from mainstream Chinese EV volume
              brands, but it also narrows moat durability because the most visible differentiators are partner-led
              components and shared industrial capabilities rather than publicly evidenced proprietary assets that only
              Avatr controls.
            claimRefs:
