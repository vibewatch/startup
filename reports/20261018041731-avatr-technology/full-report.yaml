  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Avatr's delivered product stack layers customer workflows on top of a shared EV platform, Huawei software domains,
      and partner-dependent battery/service infrastructure.
    data:
      layers:
        - label: Customer workflows
          detail: Daily driving, long trips, and export-channel use cases anchor the public product story.
          items:
            - label: Premium commuting
              displayValue: 07 / 07L daily-use intelligent EV
            - label: Long-distance travel
              displayValue: 11 BEV/EREV and 07L fast charging
            - label: Dealer export sourcing
              displayValue: 11-led premium inventory proposition
        - label: Product portfolio
          detail: The product surface spans core nameplates plus low-volume halo editions.
          items:
            - label: Core lineup
              displayValue: 06, 06T, 07, 07L, 11, 12
            - label: Halo editions
              displayValue: 011 and 012
        - label: Smart vehicle software
          modules:
            - label: Cockpit
              displayValue: HarmonyOS / HarmonySpace
            - label: Driver assistance
              displayValue: Huawei ADS 2.0 / ADS 5 with trim-based LiDAR
            - label: Cloud loop
              displayValue: App, remote ops, OTA, big-data training
        - label: Vehicle hardware and energy
          detail: Recent models pair high-voltage EV hardware with CATL battery supply and optional EREV coverage.
          items:
            - label: Platform
              displayValue: SEV / CHN multi-model EV architecture
            - label: Battery systems
              displayValue: CATL NMC packs, Shenxing 5C LFP, EREV extender option
            - label: Charging
              displayValue: High-voltage fast charging, 800V on recent models
        - label: Execution layer
          outputs:
            - label: Enablers
              displayValue: Changan manufacturing, CATL supply, Huawei software stack
            - label: Constraints
              displayValue: Service, certification, and security proof outside China remain thinner
