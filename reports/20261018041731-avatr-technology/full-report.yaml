              - CP012
          - type: callout
            title: The most visible differentiation is shared, not uniquely owned
            body: >-
              The same evidence that supports Avatr's premium pitch also shows dependency on suppliers and
              parent-company infrastructure, leaving open the risk that overlap with Deepal or similar supplier-enabled
              OEM programs compresses any moat that is not yet validated by independent benchmarks or sustained volume
              leadership.
            calloutType: risk
            claimRefs:
