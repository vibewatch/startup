  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a vehicle-led revenue model rather than a software- or services-led one.
              NewTimeSpace's HKEX-based summary says Avatr designs, develops, and sells BEV and REEV passenger vehicles
              using an asset-light model with Changan as exclusive manufacturer, CATL as a battery partner, and Huawei
              as the intelligent-vehicle stack partner. That fits the official surfaces, which emphasize the owner app,
              after-sales support, and user-operation ecosystem but do not disclose any separate software subscription
              revenue line. On public scale, the company is no longer pre-revenue or niche only in pilot channels:
              NewTimeSpace says 2025 revenue exceeded RMB25 billion and 2025 deliveries reached 122,702 vehicles, while
              an independent market profile says cumulative sales since launch exceeded 150,000 vehicles. The public gap
              is mix: investors can see that vehicle sales drive the P&L, but not how much of that revenue comes from
              each model, geography, financing program, or ancillary service.
