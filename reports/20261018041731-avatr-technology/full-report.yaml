      - number: '2.2'
        title: Company scale is observable, but category TAM, SAM, and SOM are not
        blocks:
          - type: paragraph
            body: >-
              The available sources provide company and model scale rather than a category denominator. Wikipedia
              records Avatr-wide sales of 73,606 vehicles in 2024 and 120,000 in 2025, while an independent brand
              profile says cumulative sales had exceeded 150,000 by September 2026. Those measures have different
              periods and denominators and therefore cannot be stacked into a market-share calculation. The model-level
              evidence is also mixed: the Avatr 11 retail series shown by Wikipedia falls from 21,665 units in 2023 to
              8,645 in 2024 and 3,283 in 2025 even as the overall brand broadens its lineup. This supports an execution
              lens based on actual sales, price bands, and model mix—not a top-down TAM claim.
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM016
