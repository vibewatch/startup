              - CO008
      - number: '1.3'
        title: Capitalization and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Public financing disclosures indicate that Avatr is a late private company with meaningful capital behind
              it, but still short of fully transparent public-company reporting. The clearest supported funding markers
              are the August 2023 Series B announcement and the December 2024 Series C reported by Multiples, which
              together support a step-up from roughly RMB 20 billion valuation in 2023 to more than RMB 30 billion or
              about $4.3 billion by late 2024. The same secondary source reports meaningful commercial scale—$1.1
              billion of round-linked revenue context, RMB 7.386 billion of revenue for the first eight months of 2024,
              and 73,606 vehicles sold in 2024—but also reports a RMB 2.121 billion net loss and accumulated debt, so
              funding raised should not be treated as cash available or as proof of near-term profitability.
            claimRefs:
