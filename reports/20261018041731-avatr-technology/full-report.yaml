  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          IPO or private financing clears near or above the last implied ~RMB 26 billion mark, monthly deliveries
          accelerate materially from the Jan-May 2026 run rate, and margin improvement holds.
        - >-
          Historical valuation markers can hold if Avatr converts strategic backing into visible scale and cleaner
          self-funding.
        - Execution miss on scale, margin giveback, or terms that privilege new capital.
        - Possible but not yet evidenced by retained 2026 operating data.
      - - Base
        - >-
          Premium brand position and funding access remain intact, but current pricing terms stay undisclosed and sales
          remain below leading EV peers.
        - Public evidence supports watchlist ownership logic, not a precise invest-now return case.
        - Hidden dilution, further cash burn, and IPO delay.
        - Most consistent with the retained evidence set.
      - - Bear
        - >-
          Losses persist, cash keeps falling, and new capital or IPO demand arrives at weaker terms than the last
          observed marker.
        - Return math compresses through valuation reset, dilution, or both before scale catches up.
        - Down round, extended holding period, or liquidity event that favors insiders over new equity.
        - Material risk given the current gap between premium story and scale proof.
    notes: >-
      Scenario logic is directional because the retained sources do not disclose a live IPO range, current cap table, or
      preference stack needed for precise share-price underwriting.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
