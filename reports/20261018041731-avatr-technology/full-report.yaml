  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence points to a vehicle-led revenue bridge with thin gross margin and continued financing dependence.
    data:
      nodes:
        - id: demand
          label: Premium EV demand
          value: China premium NEV segment above RMB200k
          note: NewTimeSpace says Avatr ranked eighth in this segment in 2025.
        - id: deliveries
          label: Vehicle deliveries
          value: 122,702 in 2025
          note: Commercial scale is real, but mix by model and geography is undisclosed.
        - id: pricing
          label: List price / ASP
          value: RMB360,000 disclosed 2023 Avatr 11 average; CNY219,900-CNY279,900 Aug 2026 public range
          note: Current realized ASP and discounting remain undisclosed.
        - id: revenue
          label: Revenue
          value: '> RMB25bn in 2025'
          note: Public disclosure confirms scale, not stream mix.
        - id: gross-profit
          label: Gross profit
          value: 9.4% 2025 gross margin; 90.6% cost of sales
          note: Margin improved, but hardware economics remain thin.
        - id: capital
          label: Cash / financing need
          value: $918.5M cash at 2026-04-30; 2026 net loss may continue
          note: Public data suggests further capital support could be required before stand-alone profitability.
