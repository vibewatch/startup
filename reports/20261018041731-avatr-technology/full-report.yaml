              - CM009
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Selective exports widen reach, while weak model momentum and missed timing constrain adoption
        blocks:
          - type: paragraph
            body: >-
              International expansion is real but bounded. The Avatr 11 source records launches in Nepal, Thailand,
              Brunei, Qatar, and Pakistan, and an independent profile describes Thailand as a bridgehead for other
              right-hand-drive Southeast Asian markets. The same profile also says Avatr missed its stated UK launch
              target and had not confirmed a replacement date by September 2026. Domestically, cumulative brand sales
              and a broader lineup are positive demand signals, but the profile still characterizes Avatr as roughly the
              35th-to-50th brand by monthly Chinese sales, and the Avatr 11 series shows sharp model-level erosion.
              Underwriting should therefore focus on sell-through by model, channel productivity, achieved pricing, and
              export conversion before assigning value to a broad international growth narrative.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Use a constrained served-market lens
            body: >-
              Public evidence supports premium smart-EV price, product, channel, and company-scale lenses, but not a
              defensible top-down market value for Avatr's exact wedge.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM014
          - type: callout
            title: Brand growth masks original-model erosion
            body: >-
              Broader brand volume increased while the Avatr 11 retail series fell sharply, so market underwriting
              requires model-level sell-through and achieved-price evidence.
            calloutType: risk
            claimRefs:
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and the real alternatives buyers can choose
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broad competitive set rather than a clean one-company list. Avatr itself
              frames the brand as a premium intelligent EV player and shows a multi-model lineup spanning sedans, SUVs,
              and a wagon, while independent coverage places it on the premium end of Changan's EV portfolio and
              separates that role from the more mainstream Deepal brand. That means the practical alternatives are not
              only named premium smart-EV peers but also Changan's adjacent internal offer, luxury SUV incumbents
              competing for the same wallet, and status-quo premium vehicles for buyers who value dealer trust more than
              software novelty. The evidence is strongest on Avatr's self-positioning and internal adjacency, and much
              weaker on named external peer economics, so the chapter treats the peer set as a partially evidenced
              landscape rather than pretending the assigned pool supports a precise league table.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
              - CP011
