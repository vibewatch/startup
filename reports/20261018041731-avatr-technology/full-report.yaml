      - number: '5.3'
        title: Maturity signals and unresolved control gaps
        blocks:
          - type: paragraph
            body: >-
              Public maturity signals are credible but incomplete. Avatr's own 2023 Series B announcement tied fresh
              capital to model R&D, branding, and network development, and said the "Four Models in Four Years" plan and
              a 350-point sales footprint were on track. By 2026, independent launch coverage still shows Avatr adding
              major trims such as the 07L and using them to push sales growth, which supports the view that the product
              roadmap is active rather than frozen. Even so, the trust-and-control layer is not yet underwritten by this
              pool. The assigned sources contain public references to ADAS features, C-NCAP safety scores, OTA
              upgrading, and buyer caveats on after-sales support, but they do not supply independent cybersecurity
              audits, privacy controls, warranty SLA detail, or broad evidence on software-update reliability outside
              China. Product diligence therefore needs to move past architecture claims and validate service operations,
              homologation, and software-governance controls in each export market.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation comes from orchestration, not a single proprietary subsystem
            body: >-
              The supportable product edge is Avatr's ability to bundle Changan manufacturing, CATL batteries, and
              Huawei cockpit/ADAS software into a premium EV experience across multiple nameplates, rather than evidence
              of a fully in-house software or battery stack.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
          - type: callout
            title: Export execution risk sits below the glossy architecture layer
            body: >-
              Public sources support impressive charging, cockpit, and assisted-driving claims, but they also warn that
              international certification, after-sales coverage, and market-specific support still need direct
              verification before the technical story can be treated as operationally repeatable outside China.
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Public evidence supports a premium B2C retail base, not account-level segmentation
        blocks:
          - type: paragraph
            body: >-
              Avatr's customer evidence is oriented toward individual vehicle buyers rather than enterprise accounts.
              Its Singapore and Hong Kong sites consistently position the marque as a premium intelligent EV brand,
              while an independent private-market profile labels the customer focus B2C and the revenue model product
              sales. The global site lists six current nameplates, and an independent market profile describes four
              models actively sold in China, indicating a portfolio broad enough to segment customers by body style,
              price band, and geography rather than a single flagship. This public segmentation is still incomplete: no
              assigned source quantifies private versus fleet sales, buyer income, financing mix, model-level customer
              composition, or who ultimately bears the payment obligation in distributor-led export markets.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU013
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU012
              - CU013
              - CU015
              - CU016
      - number: '6.2'
        title: Deliveries and channel build-out prove commercialization, but the denominators conflict
        blocks:
          - type: paragraph
            body: >-
              Customer adoption is better evidenced than retention. Avatr's 2023 funding announcement reported 12,000
              delivered Avatr 11 vehicles at an average price of RMB 360,000 and more than 200 showrooms, establishing
              production use and premium transaction evidence rather than reservation-only demand. BitAuto later
              reported 73,606 vehicles sold in 2024, 5,279 monthly sales in April 2026, more than 150,000 cumulative
              deliveries, and over 700 domestic channel touchpoints. It also reported roughly 70,000 Avatr 07 deliveries
              one year after launch. These measures show meaningful scale, but public definitions are not reconciled:
              users, owners, sales, deliveries, channel touchpoints, wholesale shipments, and retail sell-through are
              not interchangeable, and the available pages do not disclose cancellations or inventory.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Overseas production adoption is visible while retention and execution remain unproven
        blocks:
          - type: paragraph
            body: >-
              Thailand is the clearest export-market customer proof in the assigned evidence: BitAuto reports an initial
              Avatr 07 delivery cohort of more than 100 users and more than 1,000 cumulative Avatr 11 deliveries, while
              the Avatr 11 reference page records a September 2024 Thailand launch. Qatar and the UAE provide additional
              production-market evidence, but public unit depth is thinner. Expansion is not frictionless: Chinese Car
              Brands says Avatr missed its targeted UK launch by the end of 2025 and still lacked a revised date in
              September 2026. The same source characterizes Avatr as a relatively niche domestic brand despite more than
              150,000 cars sold since launch. No assigned source provides retention, repeat purchase, owner
              satisfaction, dealer productivity, or distributor concentration, leaving durability a material diligence
              gap.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU013
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production adoption is established
            body: >-
              Delivered-unit, average-price, model, and channel disclosures are stronger evidence than launch
              announcements alone and show a real premium retail base.
            calloutType: strength
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
          - type: callout
            title: Durability remains a management-data question
            body: >-
              Public sources do not disclose retention, repeat purchase, satisfaction, cancellations, dealer
              productivity, or distributor concentration.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital-markets and regulatory exposure ranks first
        blocks:
          - type: paragraph
            body: >-
              The most acute public risk is not a discrete lawsuit or recall in the assigned pool; it is the combination
              of financing dependence and disclosure burden around a listing that had to be revived after lapse.
              Caixin's preview says Avatr restarted its Hong Kong IPO after the prior application lapsed, while
              AsiaTechDaily says the company is targeting up to $1 billion of proceeds and had already raised RMB 11.1
              billion in Series C financing. That mix implies the business is still relying on external capital even
              after large private funding rounds. The same public record also points to a dense related-party perimeter,
              with Changan and CATL holding major stakes and Avatr buying 10% of Huawei's Yinwang, so regulatory and
              governance diligence needs to focus on prospectus completeness, related-party disclosures, and whether
              listing proceeds are now essential rather than opportunistic.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR009
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Loss-making scale-up and software-heavy operations raise execution risk
        blocks:
          - type: paragraph
            body: >-
              Public performance disclosures still show a company that is scaling but has not proven durable operating
              leverage. The Standard says first-half revenue rose 98.5% year over year to 12.2 billion yuan while net
              loss still widened 10.8% to 1.58 billion yuan, and AsiaTechDaily separately reports 2024 revenue of RMB
              15.35 billion with RMB 4.02 billion of net loss. Avatr's own technology pages emphasize robust computing,
              cloud data, OTA upgrades, and defense-in-depth information security, which is directionally positive but
              also means more moving parts across software, batteries, and vehicle systems. The public plan to add new
              models, channels, and overseas markets before public evidence closes runway, warranty, and
              incident-monitoring gaps keeps residual execution risk elevated even if topline growth remains strong.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Strategic dependencies are a structural concentration risk
        blocks:
          - type: paragraph
            body: >-
              Avatr's differentiation is inseparable from a concentrated partner stack. Company-controlled materials and
              EVKX both describe a model in which Changan anchors manufacturing, CATL anchors battery systems and
              high-voltage architecture, and Huawei supplies key intelligent-driving and cockpit components. That setup
              can accelerate product delivery, but it also means margin, roadmap timing, service quality, and
              contingency planning may depend on counterparties whose contracts are not public in the assigned pool. The
              risk is magnified because Caixin says Changan is already restructuring its new-energy vehicle operations
              and deepening Huawei cooperation to reverse a sharp decline in Avatr deliveries, which suggests Avatr's
              response options are tied to partner decisions as much as to standalone management execution.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: Kill criteria should focus on funding continuity, partner terms, and safety proof
        blocks:
          - type: paragraph
            body: >-
              The underwriting bar should tighten around three measurable triggers. First, if the Hong Kong listing
              slips again, reprices materially, or no longer looks capable of delivering the capital Avatr says it
              wants, the investment case becomes much more dependent on insider support. Second, if delivery recovery
              does not follow the product and channel build-out, the current pattern of revenue growth with persistent
              losses can turn into a balance-sheet risk rather than a growth investment. Third, if diligence cannot
              obtain hard evidence on warranty, recalls, cybersecurity incidents, and partner termination rights, the
              residual downside remains too open-ended for a clean risk discount. The current pool is enough to rank the
              pressure points, but not enough to close those underwriting questions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-consequence kill criteria
            body: >-
              Treat a second material IPO delay, continued delivery deterioration after the current launch cycle, or
              inability to verify partner termination rights and incident history as thesis-break events rather than
              issues to price through.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR016
          - type: callout
            title: Why this chapter stops short of a cleaner downside bound
            body: >-
              The assigned pool is sufficient to show capital dependence, partner concentration, and a software-heavy
              operating model, but it does not include audited runway data, contract terms, or independent
              safety/regulatory records that would let an investor sharply narrow residual downside.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR009
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The supportable recommendation is research-more, not because Avatr lacks strategic quality, but because
              the current public package is not price-complete. The upside case is easy to see: Changan, CATL, and
              Huawei backing still matter; the brand has held premium price points; and historical funding rounds show
              repeated investor support. The problem is that the latest evidence is still a partial underwriting record.
              Avatr refiled its Hong Kong application after the prior prospectus lapsed, the latest public valuation
              marker is only an implied November 2025 transfer at about RMB 26 billion, and none of the retained sources
              disclose a live IPO price range, liquidation preference stack, or current debt terms. At the same time,
              first-five-month 2026 deliveries averaged only about 4,032 units per month while losses and cash drawdown
              remained material. That combination can support a watchlist stance or a conditional entry screen, but not
              a conviction buy at unknown terms.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV008
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV012
              - CV015
      - number: '8.2'
        title: Financing context and scenario range
        blocks:
          - type: paragraph
            body: >-
              The public financing trail shows why Avatr still deserves diligence time. The company completed Series B
              in August 2023 with RMB 3 billion raised at an estimated RMB 20 billion valuation, then secured more than
              RMB 11 billion in Series C in December 2024. By the 2025 Hong Kong filing, a disclosed stake transfer
              implied roughly RMB 26 billion of equity value, while first-half 2025 revenue reached RMB 12.21 billion
              and gross margin turned positive at 10.1%. Those data points support a real premium-EV platform rather
              than a concept story. Still, the 2026 evidence is not clean enough to underwrite that valuation marker as
              durable. CnEVPost reported 2025 gross margin of only 9.4%, cost of sales at 90.6% of revenue, cumulative
              losses above RMB 13.2 billion from 2022 to 2025, and cash falling to RMB 6.25 billion by April 30, 2026.
              The right scenario frame is therefore milestone-based: better sell-through and preserved cash can justify
              re-engagement, while weak conversion of IPO readiness into self-funded scale raises down-round risk.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Diligence gates and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is less about deciding whether Avatr is a real company and more about deciding whether
              a specific price is defensible. Public evidence supports a premium intelligent-EV positioning, confirms
              material historical fundraising, and shows some operating improvement. It does not yet answer the
              questions that matter most for downside underwriting: the current IPO or private-round valuation range,
              the preference and dilution structure after Series C and the Yinwang investment, model-level discounting
              and inventory in 2026, and the durability of cash versus continuing losses. The thesis breaks if 2026
              sell-through remains subscale, if gross margin progress reverses once growth is pushed harder, or if new
              capital arrives on meaningfully weaker terms than the last implied mark. The thesis improves if Avatr can
              show cleaner pricing discipline, better cash preservation, and transparent terms that leave room for
              venture-style upside after dilution and preferences.
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Research-more is the disciplined call until Avatr discloses live pricing terms or a cleaner private entry
              point that compensates for continuing losses, 2026 scale risk, and possible dilution/preference overhang.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV015
          - type: callout
            title: Main downside to monitor
            body: >-
              The clearest downside path is a weaker financing window or down-round dynamic before Avatr proves that
              current premium positioning can translate into materially higher volume without giving back margin or
              cash.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV016
