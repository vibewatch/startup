  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The residual risk picture is dominated by IPO continuity, partner dependence, and unresolved safety/compliance
      proof.
    data:
      columns:
        - label: Likelihood
          note: 1 low to 5 high
        - label: Impact
          note: 1 low to 5 high
        - label: Mitigation maturity
          note: 1 early to 5 mature
        - label: Residual severity
          note: Post-mitigation residual risk
      rows:
        - label: IPO and financing continuity
          values:
            - score: 4
              tone: warning
              detail: Refiled after lapse and still pursuing up to $1 billion of IPO proceeds
            - score: 5
              tone: critical
              detail: Capital access affects scale-up and overseas expansion
            - score: 2
              tone: medium
              detail: Strategic backers help but do not replace public-market execution
            - score: 5
              tone: critical
              detail: Residual remains high until filing, pricing, and proceeds are confirmed
        - label: Volume, margin, and loss trajectory
          values:
            - score: 4
              tone: warning
              detail: Public disclosures show losses widening even with strong revenue growth
            - score: 5
              tone: critical
              detail: Persistent losses can force further financing or pricing pressure
            - score: 2
              tone: medium
              detail: No public runway bridge in the assigned pool
            - score: 4
              tone: warning
              detail: Residual stays high until cash, debt, and inventory evidence is available
        - label: Huawei, Changan, and CATL dependence
          values:
            - score: 4
              tone: warning
              detail: Core manufacturing, battery, and software roles are concentrated
            - score: 4
              tone: warning
              detail: Counterparty change would affect roadmap, cost, and service quality
            - score: 2
              tone: medium
              detail: Equity alignment exists, but contracts are not public
            - score: 4
              tone: warning
              detail: Residual remains elevated without termination and substitution rights
        - label: Safety, cybersecurity, and compliance proof
          values:
            - score: 3
              tone: medium
              detail: Software-heavy stack and OTA dependence increase monitoring needs
            - score: 5
              tone: critical
              detail: A material incident or recall could damage brand and export plans
            - score: 1
              tone: low
              detail: Public pool shows design intent, not incident-history proof
            - score: 4
              tone: warning
              detail: Independent recall, litigation, and incident checks are still missing
        - label: Overseas channel execution
          values:
            - score: 4
              tone: warning
              detail: Public plans call for a broad country and sales-channel expansion
            - score: 4
              tone: warning
              detail: Service or compliance gaps could impair overseas growth
            - score: 2
              tone: medium
              detail: Public evidence describes targets but not country-level operating controls
            - score: 4
              tone: warning
              detail: Residual stays high without dealer, service, and homologation evidence
        - label: Product portfolio complexity
          values:
            - score: 3
              tone: medium
              detail: The current site displays eight model variants while further launches are planned
            - score: 4
              tone: warning
              detail: More variants increase launch, inventory, quality, and service coordination needs
            - score: 3
              tone: medium
              detail: A flexible shared platform provides some architectural mitigation
            - score: 3
              tone: medium
              detail: Residual is medium pending model-level quality and inventory evidence
    approximationNotes: Scores are ordinal synthesis from cited public evidence and evidence gaps; they are not actuarial probabilities.
    claimRefs:
      - CR001
      - CR003
      - CR009
      - CR010
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports a milestone-based watchlist stance rather than a clean buy call at unknown terms.
    data:
      nodes:
        - id: strategic-backing
          label: Strategic backing
          detail: Changan, CATL, and Huawei remain the core industrial support.
        - id: historical-funding
          label: Historical funding proof
          detail: Series B raised RMB 3 billion at up to RMB 20 billion valuation, and Series C raised over RMB 11 billion.
        - id: operating-progress
          label: Operating progress
          detail: Revenue and gross margin improved into 2025, supporting a real premium platform.
        - id: 2026-scale-risk
          label: 2026 scale risk
          detail: >-
            Jan-May 2026 deliveries averaged about 4,032 vehicles per month while losses and cash drawdown remained
            material.
        - id: pricing-gap
          label: Current pricing gap
          detail: Retained sources do not disclose a live IPO price range or full post-Series C preference stack.
        - id: recommendation
          label: Recommendation
          detail: Research-more / valuation unknown until terms and 2026 proof improve.
      edges:
        - from: strategic-backing
          to: historical-funding
          label: Enables repeat capital formation
        - from: historical-funding
          to: operating-progress
          label: Supports product and network build-out
        - from: operating-progress
          to: 2026-scale-risk
          label: Progress still trails needed scale proof
        - from: 2026-scale-risk
          to: pricing-gap
          label: Raises sensitivity to entry terms
        - from: pricing-gap
          to: recommendation
          label: Keeps the call price-disciplined
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV012
      - CV015
