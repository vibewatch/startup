      - number: '1.4'
        title: Milestones and refresh readout
        blocks:
          - type: paragraph
            body: >-
              Avatr's milestone trail shows steady product and financing execution, but the refresh evidence is not
              uniformly positive. Official 2023 releases support tangible progress from AVATR 11 deliveries to AVATR 12
              mass production, while later public profiles record the 2024 Series C close and a 2025 leadership handoff.
              The most current independent launch coverage is more mixed: the August 2026 07L launch expands the lineup
              and keeps the Hong Kong IPO path alive, yet the same coverage says Avatr sold only 35,250 vehicles in the
              first seven months of 2026 and remained well behind China's leading EV startups. For downstream chapters,
              the grounded take is a strategically backed premium EV platform with real scale, but with weaker 2026
              momentum and unresolved transparency on current governance, customer count, headcount, and the
              post-Series-C cap table.
