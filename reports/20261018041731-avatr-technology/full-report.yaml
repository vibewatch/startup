chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently describes Avatr as a premium intelligent electric-vehicle platform
              rather than a generic auto startup. Secondary profiles trace the business back to the July 2018
              Changan-NIO venture and describe a 2021 reset into the Avatr brand, while the official homepage still
              presents the company as a design-led smart EV brand focused on future-oriented mobility. The operating
              model is partner-heavy: Avatr's public materials tie the product stack to a Huawei software and
              intelligent-driving layer plus CATL battery capability, with Chongqing as the organizational center and
              Munich cited as a design outpost.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Leadership, governance, and partner dependence
        blocks:
          - type: paragraph
            body: >-
              Governance remains directionally visible but not cleanly documented in the assigned pool. Avatr's own
              October 2023 release named Tan Benhong as chairman and CEO, while a later secondary profile names Chen
              Zhuo as president and Wang Hui as chairman from September 2025. That is enough to establish material
              leadership change, but not enough to lock the current official leadership page or full board composition.
              Economically and operationally, the company appears tightly coupled to Changan, CATL, and Huawei, which
              creates both support and concentration risk: current ownership percentages conflict across public
              secondary sources, and Huawei remains critical even where sources describe it as a non-equity partner.
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO013
              - CO014
