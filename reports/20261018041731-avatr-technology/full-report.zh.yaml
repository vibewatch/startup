            title: 本章为何不进一步收窄下行边界
            body: 指定资料足以显示资本依赖、合作伙伴集中和软件密集型运营模式，但没有经审计的资金期限数据、合同条款或独立安全 / 监管记录，投资者无法据此明显收窄剩余下行空间。
            calloutType: assumption
            claimRefs:
              - CR003
              - CR009
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              可支持的建议是继续研究，不是因为 Avatr 缺乏战略质量，而是当前公开资料还不足以完成定价判断。上行逻辑很清楚：Changan、CATL 和 Huawei
              的支持仍然重要；品牌守住了高端价格点；历史融资轮次显示投资人持续支持。问题在于，最新证据仍只是部分投资判断记录。Avatr 在此前招股书失效后重新提交香港申请，最新公开估值标志只是 2025 年 11 月约
              RMB 26 billion 的隐含转让价，保留资料没有披露当前 IPO 价格区间、清算优先股堆叠或债务条款。同时，2026 年前五个月交付月均仅约 4,032
              辆，亏损和现金消耗仍然显著。这可以支持观察名单或有条件的进入筛选，但不足以在条款未知时形成坚定买入判断。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV008
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV012
              - CV015
      - number: '8.2'
        title: 融资背景与情景区间
        blocks:
          - type: paragraph
            body: >-
              公开融资轨迹说明 Avatr 仍值得投入尽调时间。公司在 2023 年 8 月完成 Series B，以估计 RMB 20 billion 估值募得 RMB 3 billion；随后在 2024 年 12
              月完成超过 RMB 11 billion 的 Series C。根据 2025 年香港申报文件，披露的股权转让隐含约 RMB 26 billion 股权价值；2025 年上半年收入达到 RMB 12.21
              billion，毛利率转正至 10.1%。这些数据支持其是真实的高端电动车平台，而非概念故事。但 2026 年证据还不够干净，无法将该估值标志视为持久。CnEVPost 报道 2025 年毛利率仅
              9.4%，销售成本占收入 90.6%，2022 至 2025 年累计亏损超过 RMB 13.2 billion，现金到 2026 年 4 月 30 日降至 RMB 6.25
              billion。因此应以里程碑构建情景：更好的实际销售和现金保留可支持重新接触；若 IPO 准备未能转化为自有资金驱动的规模增长，降价融资风险就会上升。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 尽调门槛与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              剩下的工作不是判断 Avatr 是否是真实公司，而是判断某个具体价格是否站得住。公开证据支持其高端智能电动车定位，确认了重要的历史融资，也显示运营有所改善。但它尚未回答下行投资判断最关键的问题：当前 IPO
              或私募轮估值区间、Series C 和 Yinwang 投资后的优先权与稀释结构、2026 年按车型的折扣和库存，以及现金相对于持续亏损的可持续性。如果 2026
              年实际销售仍未达到规模，如果加速增长后毛利率改善逆转，或新资本的条款明显弱于上一次隐含估值，投资论点就会失效。如果 Avatr
              能展示更严格的定价纪律、更好的现金保留能力，以及在稀释和优先权之后仍留有风险投资式上行空间的透明条款，论点则会改善。
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 当前判断
            body: 在 Avatr 披露当前定价条款，或提供足以补偿持续亏损、2026 年规模风险及潜在稀释 / 优先权压力的更清晰私募进入点之前，继续研究是更有纪律的判断。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV015
          - type: callout
            title: 需要监测的主要下行风险
            body: 最清晰的下行路径是：在 Avatr 证明当前高端定位能够转化为明显更高的销量、且不牺牲利润率或现金之前，融资窗口转弱或出现降价融资。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV016
