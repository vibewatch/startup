      - number: '2.2'
        title: 公司规模可观察，但品类 TAM、SAM 和 SOM 不可得
        blocks:
          - type: paragraph
            body: >-
              现有资料提供的是公司和车型规模，而不是品类分母。Wikipedia 记录 Avatr 全品牌 2024 年销量为 73,606 辆、2025 年为 120,000 辆；独立品牌资料则称，截至 2026 年 9
              月累计销量已超过 150,000 辆。这些数据的期间和分母不同，不能叠加计算市场份额。车型层面的证据也不一致：Wikipedia 展示的 Avatr 11 零售序列从 2023 年的 21,665 辆降至
              2024 年的 8,645 辆和 2025 年的 3,283 辆，即使全品牌持续扩充阵容。这支持以实际销量、价格带和车型组合为基础的执行分析，而不是自上而下的 TAM 论断。
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM016
