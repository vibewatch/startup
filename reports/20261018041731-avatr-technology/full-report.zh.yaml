      - number: '1.4'
        title: 里程碑与更新判断
        blocks:
          - type: paragraph
            body: >-
              Avatr 的里程碑轨迹显示产品和融资执行较为持续，但更新证据并不全然积极。2023 年官方公告支持从 AVATR 11 交付到 AVATR 12 量产的实质进展，后续公开资料则记录了 2024 年 Series
              C 完成和 2025 年领导层交接。最新的独立上市报道更为复杂：2026 年 8 月 07L 上市扩大了车型阵容，也让香港 IPO 继续推进，但同一报道称 Avatr 在 2026 年前七个月仅售出 35,250
              辆，明显落后于中国领先电动车初创公司。对后续章节而言，更稳妥的判断是：这是一个有战略支持、具备真实规模的高端电动车平台，但 2026 年势头较弱，当前治理、客户数、员工数和 Series C
              后股权结构表仍不透明。
