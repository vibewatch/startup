              所称的资本，投资论点就会更依赖内部支持。第二，如果交付恢复没有跟上产品和渠道建设，收入增长但持续亏损的模式可能变成资产负债表风险，而非增长投资。第三，如果尽调无法取得保修、召回、网络安全事故和合作伙伴终止权的硬证据，剩余下行空间就过于开放，无法给予清晰的风险折价。当前资料足以排列压力点，但不足以解决这些投资判断问题。
