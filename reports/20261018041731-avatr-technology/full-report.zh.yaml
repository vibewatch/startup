chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              指定证据始终将 Avatr 描述为高端智能电动车平台，而非普通汽车初创公司。二手资料将其业务追溯至 2018 年 7 月的 Changan-NIO 合资项目，并称公司在 2021 年重塑为 Avatr
              品牌；官方主页则仍将其定位为以设计驱动、聚焦未来出行的智能电动车品牌。其运营模式高度依赖合作伙伴：公开材料显示，产品体系依托 Huawei 的软件和智能驾驶层以及 CATL
              的电池能力，组织中心位于重庆，慕尼黑则是设计据点。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: 领导层、治理与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              治理方向虽可见，但指定资料没有给出清晰记录。Avatr 自己在 2023 年 10 月的公告中称 Tan Benhong 为董事长兼 CEO，之后的二手资料则称 Chen Zhuo 自 2025 年 9
              月起担任总裁、Wang Hui 担任董事长。这足以确认领导层发生了重大变化，却不足以锁定当前官方领导层页面或完整董事会构成。公司在经济和运营上都与 Changan、CATL、Huawei
              紧密绑定，既获得支持，也面临集中度风险：公开二手资料对当前持股比例说法不一，而 Huawei 即便被描述为非股权合作伙伴，仍是关键依赖。
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO013
              - CO014
