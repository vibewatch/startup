  - id: FU001
    title: 零售客户旅程与扩张循环
    type: journey-map
    summary: 公开证据描绘出一条从高端定位到交付、使用和服务的零售路径，但扩张复制受执行能力约束。
    data:
      items:
        - label: 高端认知
          detail: 官方区域页面将 Avatr 定位为高端智能电动车品牌。
          touchpoints:
            - 品牌页面
            - 合作伙伴生态
        - label: 车型考虑
          detail: 全球网站上的六款车型支持轿车和 SUV 选择。
          touchpoints:
            - 车型阵容
            - 智能电动车技术主张
        - label: 展厅转化
          detail: 截至 2023 年 8 月，据报道展厅超过 200 家。
          touchpoints:
            - 线下零售
            - 计划中的销售点扩张
        - label: 交付后的使用
          detail: 交付量和平均价格披露证明产品已实现付费生产和使用。
          touchpoints:
            - 车辆交付
            - 存量用户增长
        - label: 数字与服务互动
          detail: 官方 App 推动车主分享，公开报道则描述了售后和 OTA 服务。
          touchpoints:
            - AVATR App
            - 电池监测
            - OTA 升级
        - label: 出口复制
          detail: 泰国和海湾地区的部署提供了证明，而英国时间表落空显示出执行摩擦。
          touchpoints:
            - 当地经销商
            - 右舵车型推出
    approximationNotes: 该顺序是基于证据的旅程图，不是经过测量的转化漏斗；公开资料没有披露各阶段转化率或用户群留存率。
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU012
      - CU013
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险主要集中在 IPO 连续性、对合作伙伴的依赖，以及尚未解决的安全 / 合规证明。
    data:
      columns:
        - label: 可能性
          note: 1 低至 5 高
        - label: 影响
          note: 1 低至 5 高
        - label: 缓释成熟度
          note: 1 初期至 5 成熟
        - label: 剩余严重度
          note: 缓释后的剩余风险
      rows:
        - label: IPO 与融资连续性
          values:
            - score: 4
              tone: warning
              detail: 申报失效后重新提交，仍在争取最高 $10 亿 IPO 募资
            - score: 5
              tone: critical
              detail: 资本渠道影响规模扩张和海外扩张
            - score: 2
              tone: medium
              detail: 战略支持者有帮助，但不能替代公开市场执行
            - score: 5
              tone: critical
              detail: 在申报、定价和募资到账确认前，剩余风险仍高
        - label: 规模、利润率与亏损轨迹
          values:
            - score: 4
              tone: warning
              detail: 公开披露显示，即使收入强劲增长，亏损仍在扩大
            - score: 5
              tone: critical
              detail: 持续亏损可能迫使公司进一步融资或承受定价压力
            - score: 2
              tone: medium
              detail: 指定来源池没有公开的现金续航桥接
            - score: 4
              tone: warning
              detail: 在获得现金、债务和库存证据前，剩余风险维持高位
        - label: 对 Huawei、Changan 和 CATL 的依赖
          values:
            - score: 4
              tone: warning
              detail: 核心制造、电池和软件角色高度集中
            - score: 4
              tone: warning
              detail: 交易对手变化会影响路线图、成本和服务质量
            - score: 2
              tone: medium
              detail: 存在股权协同，但合同未公开
            - score: 4
              tone: warning
              detail: 在没有终止和替代权的情况下，剩余风险仍处高位
        - label: 安全、网络安全与合规证明
          values:
            - score: 3
              tone: medium
              detail: 软件占比较高且依赖 OTA，增加了监测需求
            - score: 5
              tone: critical
              detail: 重大事故或召回可能损害品牌和出口计划
            - score: 1
              tone: low
              detail: 公开证据池显示的是设计意图，而不是事故历史证明
            - score: 4
              tone: warning
              detail: 独立召回、诉讼和事故检查仍缺失
        - label: 海外渠道执行
          values:
            - score: 4
              tone: warning
              detail: 公开计划要求扩大国家覆盖和销售渠道
            - score: 4
              tone: warning
              detail: 服务或合规缺口可能削弱海外增长
            - score: 2
              tone: medium
              detail: 公开证据描述了目标，但没有国家层面的运营控制
            - score: 4
              tone: warning
              detail: 在获得经销商、服务和车型认证证据前，剩余风险维持高位
        - label: 产品组合复杂度
          values:
            - score: 3
              tone: medium
              detail: 当前网站展示八个车型版本，且还计划推出更多车型
            - score: 4
              tone: warning
              detail: 更多版本会增加发布、库存、质量和服务协调需求
            - score: 3
              tone: medium
              detail: 灵活的共享平台提供了一定架构层面的缓释
            - score: 3
              tone: medium
              detail: 在获得车型级质量和库存证据前，剩余风险为中等
    approximationNotes: 分数是对引用的公开证据和证据缺口进行的序数综合，不是精算概率。
    claimRefs:
      - CR001
      - CR003
      - CR009
      - CR010
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据支持以里程碑为基础的观察名单立场，而不是在条款未知时直接买入。
    data:
      nodes:
        - id: strategic-backing
          label: 战略支持
          detail: Changan、CATL 和 Huawei 仍是核心产业支持方。
        - id: historical-funding
          label: 历史融资证明
          detail: Series B 融资额为 RMB 3 billion，估值最高达 RMB 20 billion；Series C 融资超过 RMB 11 billion。
        - id: operating-progress
          label: 经营进展
          detail: 收入和毛利率在 2025 年改善，支持其确实具备高端平台属性。
        - id: 2026-scale-risk
          label: 2026 年规模风险
          detail: 2026 年 1—5 月月均交付约 4,032 辆，同时亏损和现金消耗仍然重大。
        - id: pricing-gap
          label: 当前定价缺口
          detail: 保留来源没有披露实时 IPO 价格区间或完整的 C 轮融资后优先股堆叠。
        - id: recommendation
          label: 建议
          detail: 继续研究 / 在条款和 2026 年验证改善前，估值未知。
      edges:
        - from: strategic-backing
          to: historical-funding
          label: 支持重复融资
        - from: historical-funding
          to: operating-progress
          label: 支持产品和网络建设
        - from: operating-progress
          to: 2026-scale-risk
          label: 进展仍落后于所需的规模证明
        - from: 2026-scale-risk
          to: pricing-gap
          label: 提高对入场条款的敏感度
        - from: pricing-gap
          to: recommendation
          label: 让建议保持价格纪律
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV012
      - CV015
