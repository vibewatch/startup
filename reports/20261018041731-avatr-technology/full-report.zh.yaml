  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据指向以车辆为主的收入桥，毛利率偏薄，且仍依赖持续融资。
    data:
      nodes:
        - id: demand
          label: 高端电动车需求
          value: China premium NEV segment above RMB200k
          note: NewTimeSpace 称，Avatr 在 2025 年该细分市场排名第八。
        - id: deliveries
          label: 车辆交付
          value: 122,702 in 2025
          note: 商业规模真实存在，但按车型和地域划分的组合未披露。
        - id: pricing
          label: 标价 / ASP
          value: RMB360,000 disclosed 2023 Avatr 11 average; CNY219,900-CNY279,900 Aug 2026 public range
          note: 当前实际 ASP 和折扣情况仍未披露。
        - id: revenue
          label: 收入
          value: '> RMB25bn in 2025'
          note: 公开披露确认了规模，但没有确认收入构成。
        - id: gross-profit
          label: 毛利
          value: 9.4% 2025 gross margin; 90.6% cost of sales
          note: 利润率有所改善，但硬件经济性仍然偏薄。
        - id: capital
          label: 现金 / 融资需求
          value: $918.5M cash at 2026-04-30; 2026 net loss may continue
          note: 公开数据表明，在实现独立盈利前，公司可能仍需要进一步资本支持。
      edges:
        - from: demand
          to: deliveries
          relationship: 转化为
        - from: deliveries
          to: pricing
          relationship: 乘以
        - from: pricing
          to: revenue
          relationship: 驱动
        - from: revenue
          to: gross-profit
          relationship: 扣除制造和渠道成本
        - from: gross-profit
          to: capital
          relationship: 从公开证据看，不足以自行弥补亏损和投资
    approximationNotes: 组合、渠道折扣和现金消耗均未公开；桥接图使用公开规模锚点，而不是管理层账目。
    claimRefs:
      - CI002
      - CI003
      - CI006
      - CI008
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Avatr 的交付产品栈以共享电动车平台、Huawei 软件领域以及依赖合作伙伴的电池 / 服务基础设施为底座，承载客户工作流。
    data:
      layers:
        - label: 客户工作流
          detail: 日常驾驶、长途出行和出口渠道使用场景构成公开产品故事的核心。
          items:
            - label: 高端通勤
              displayValue: 07 / 07L daily-use intelligent EV
            - label: 长途出行
              displayValue: 11 BEV/EREV and 07L fast charging
            - label: 经销商出口采购
              displayValue: 11-led premium inventory proposition
        - label: 产品组合
          detail: 产品覆盖核心车型以及低销量光环版车型。
          items:
            - label: 核心产品线
              displayValue: 06, 06T, 07, 07L, 11, 12
            - label: 光环版车型
              displayValue: 011 and 012
        - label: 智能汽车软件
          modules:
            - label: 座舱
              displayValue: HarmonyOS / HarmonySpace
            - label: 驾驶辅助
              displayValue: Huawei ADS 2.0 / ADS 5 with trim-based LiDAR
            - label: 云端闭环
              displayValue: App, remote ops, OTA, big-data training
        - label: 车辆硬件与能源
          detail: 近期车型将高压电动车硬件与 CATL 电池供应结合，并可选 EREV 配置。
          items:
            - label: 平台
              displayValue: SEV / CHN multi-model EV architecture
            - label: 电池系统
              displayValue: CATL NMC packs, Shenxing 5C LFP, EREV extender option
            - label: 充电
              displayValue: High-voltage fast charging, 800V on recent models
        - label: 执行层
          outputs:
            - label: Enablers
              displayValue: Changan manufacturing, CATL supply, Huawei software stack
            - label: Constraints
              displayValue: Service, certification, and security proof outside China remain thinner
        - label: 控制与尽调问题
          outputs:
            - label: Needed proof
              displayValue: Cybersecurity, privacy, homologation, and service SLA evidence
            - label: Why it matters
              displayValue: Validates that the stack can be supported outside China, not just marketed
