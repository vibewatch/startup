  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开进展
        blocks:
          - type: paragraph
            body: >-
              公开证据支持以汽车销售为主的收入模式，而非软件或服务驱动模式。NewTimeSpace 基于 HKEX 的摘要称，Avatr 采用轻资产模式设计、开发并销售 BEV 和 REEV 乘用车，Changan
              是独家制造商，CATL 是电池合作伙伴，Huawei
              是智能汽车体系合作伙伴。这与官方界面相符：官方强调车主应用、售后支持和用户运营生态，但没有披露单独的软件订阅收入线。从公开规模看，公司已不再是没有收入、只能依靠试点渠道的公司：NewTimeSpace 称
              2025 年收入超过 RMB25 billion，2025 年交付达到 122,702 辆；独立市场资料则称其自上市以来累计销量超过 150,000
