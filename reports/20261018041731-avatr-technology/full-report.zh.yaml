  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合与买方真正可选的替代方案
        blocks:
          - type: paragraph
            body: >-
              指定证据支持一个宽泛的竞争集合，而不是一份整齐的单一公司名单。Avatr 自身将品牌定位为高端智能电动车玩家，展示覆盖轿车、SUV 和旅行车的多车型阵容；独立报道则将其放在 Changan
              电动车组合的高端，并将这一角色与更大众化的 Deepal 品牌区分开来。因此，实际替代方案不仅包括知名高端智能电动车同业，还包括 Changan 的相邻内部产品、争夺同一消费预算的豪华 SUV
              老牌厂商，以及那些更看重经销商信任、而非软件新颖性的买方所选择的传统高端车型。证据对 Avatr
              的自我定位和内部相邻产品最充分，对明确外部同业的经济性则弱得多，因此本章将同业集合视为证据不完整的市场图景，而不是假装指定资料足以支撑精确排名。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
              - CP011
              - CP012
