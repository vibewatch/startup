      - number: '3.4'
        title: 持久性风险集中在产品重叠、外部证据不足和增长势头
        blocks:
          - type: paragraph
            body: >-
              指定资料中的反向证据指向竞争脆弱性，尽管 Avatr 的高端叙事可信。CarNewsChina 报道称，2026 年已披露的月度销量 modest，并称 Changan 计划在亏损压力下整合 Avatr 与
              Deepal；另一份独立资料则认为 Avatr
              在本土市场的表现尚可但并不突出，并指出其错过英国上市目标。这些信号之所以重要，是因为它们表明品牌仍需证明：合作伙伴支持的技术、出口雄心和高端定价能够转化为持久的独立需求。在公司披露更多逐一对比的竞争基准、客户留存或第三方产品比较之前，其护城河足以吸引关注，但尚未得到独立证明，无法排除产品商品化或兄弟品牌重叠风险。
