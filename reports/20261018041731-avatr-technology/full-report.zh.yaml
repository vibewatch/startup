      - number: '3.2'
        title: 差异化真实存在，但高度由供应商驱动
        blocks:
          - type: paragraph
            body: >-
              Avatr 最强的公开差异化并不是某项独有披露的成本或渠道优势，而是一套围绕高端设计语言、Huawei 驱动的座舱和驾驶系统，以及 CATL
              支持的电池和平台主张打造的组合产品。官方材料反复将产品体系锚定在“全新架构、强大算力和高压充电”上，独立摘要也将 Huawei 的智能驾驶和智能座舱软件描述为产品的定义性要素。这让 Avatr
              的高端智能电动车叙事可信，也帮助其区别于中国主流电动车量产品牌；但最显眼的差异化来自合作伙伴组件和共享工业能力，而不是只有 Avatr 掌握、且已有公开证据支持的专有资产，因此护城河的持久性受到限制。
