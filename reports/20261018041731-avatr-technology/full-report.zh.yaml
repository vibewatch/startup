      - number: '3.3'
        title: 价格梯度和进入市场路径体现高端意图，但尚未证明优于同业
        blocks:
          - type: paragraph
            body: >-
              本章的公开定价证据足以显示一条有意设计的高端价格梯度。Avatr 在 2023 年公告中称，Avatr 11 已交付 12,000 辆，平均价格 RMB 360,000，双电机版本超过 RMB
              400,000；11 Harmony Edition 的起售价则下调至 RMB 280,000。2026 年，06T 以 RMB 219,900 至 RMB 279,900 上市，而 T09 概念车明确定位于
              RMB 500,000 豪华 SUV 市场。分销同样是竞争卖点的一部分：Avatr 计划在 2023 年底前达到 350 个销售点，后来又称已覆盖 70
              个国家和地区，并在海外市场实现盈利。但指定资料尚未显示这些价格或市场是否在实际销售、经销商经济性或实现折扣上优于直接竞争的高端电动车。
            claimRefs:
