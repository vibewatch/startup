    data:
      xAxis:
        label: 合作伙伴组合杠杆
        min: 1
        max: 5
        lowLabel: Less supplier-led
        highLabel: More supplier-led
        description: Ordinal score based on how prominently the evidence cites Changan, CATL, and Huawei as the product stack.
      yAxis:
        label: 高端价格 / 品牌层级
        min: 1
        max: 5
        lowLabel: Mainstream
        highLabel: Flagship luxury
        description: Ordinal score based on disclosed price bands or explicit premium-segment language in the assigned pool.
      points:
        - label: Deepal 兄弟品牌替代方案
          x: 2
          'y': 2
          note: Changan 的主流兄弟品牌，不在高端端。
        - label: Avatr 06T
          x: 4
          'y': 3
          note: Huawei ADS 4；旅行车，售价 RMB 219,900—279,900。
        - label: Avatr 11 Harmony Edition
          x: 4
          'y': 4
          note: 起售价 RMB 280,000，搭载 Huawei ADS 2.0。
        - label: Avatr 11 交付组合
          x: 4
          'y': 4
          note: 2023 年披露的平均交付价格为 RMB 360,000。
        - label: Avatr 海外高端细分市场
          x: 4
          'y': 4
          note: 公司称 ASP 高于 RMB 300,000，且出口市场实现盈利。
        - label: Avatr T09 旗舰车型
          x: 5
          'y': 5
          note: 面向 RMB 500,000 豪华 SUV 细分市场。
    approximationNotes: 由于指定来源池缺少逐一对比的外部定价和产品测试数据集，坐标轴是序数轴而非基准标准化结果；分数仅汇总已披露的细分市场与合作组合信号。
