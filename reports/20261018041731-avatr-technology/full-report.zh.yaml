companyProfile:
  summary: >-
    Avatr Technology 是一家扎根重庆的高端智能电动车公司，由 Changan、CATL 和 Huawei 支持。公开证据显示，公司已有真实商业规模：2025 年收入超过 RMB25 billion，交付 122,702
    辆，2025 年底员工 3,978 人，并继续拓展出口市场、推进 2026 年 IPO。但公司仍未清晰公开 Series C
    后的股权结构表、治理和客户经济性，因此它仍是一个有战略股东支持、但透明度有限的高端电动车平台，而不是信息完全透明的公众公司。
