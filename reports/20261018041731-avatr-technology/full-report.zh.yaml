        - 如果 Avatr 把战略支持转化为可见的规模和更干净的自我造血，历史估值锚点可以守住。
        - 规模执行不及预期、利润率回吐，或条款偏向新资本。
        - 有可能，但保留的 2026 年经营数据尚未证明这一点。
      - - 基准
        - 高端品牌定位和融资渠道保持不变，但当前定价条款仍未披露，销量仍低于领先电动车同行。
        - 公开证据支持列入观察名单，而不足以支持精确的立即投资回报判断。
        - 隐性稀释、现金继续消耗，以及 IPO 延迟。
        - 与保留证据集最为一致。
      - - 空头
        - 亏损持续、现金继续下降，而新资本或 IPO 需求以弱于上次观察锚点的条款出现。
        - 在规模追上来之前，估值重置、稀释或两者共同作用会压缩回报测算。
        - 下调轮、持有期拉长，或更有利于内部人的流动性事件。
        - 鉴于高端故事与规模证明之间当前的差距，风险重大。
