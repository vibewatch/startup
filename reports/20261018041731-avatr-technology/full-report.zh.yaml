      - number: '1.3'
        title: 资本结构与已披露规模
        blocks:
          - type: paragraph
            body: >-
              公开融资披露表明，Avatr 已是有重要资本支持的后期私人公司，但仍未达到公众公司披露的透明度。最清晰、可相互印证的融资节点是 2023 年 8 月的 Series B 公告，以及 Multiples 报道的
              2024 年 12 月 Series C；两者共同表明，公司估值从 2023 年约 RMB 20 billion 提升至 2024 年底超过 RMB 30 billion、约 $4.3
              billion。同一二手资料还披露了可观的商业规模——与轮次关联的 $1.1 billion 收入口径、2024 年前八个月 RMB 7.386 billion 收入，以及 2024 年售出 73,606
              辆车——但同时报告 RMB 2.121 billion 净亏损和累计债务。因此，已募集资金不能视为可用现金，也不能证明公司短期内能够盈利。
