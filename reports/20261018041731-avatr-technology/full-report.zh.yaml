  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 可支持的边界是高端智能电动车，而非整个汽车市场
        blocks:
          - type: paragraph
            body: >-
              Avatr 及其最大股东始终将公司定义为高端智能电动车企业，而产品证据进一步收窄了这一标签。官方全球网站列出轿车、SUV 和限量版车型；Avatr 11
              则被描述为可选纯电和增程版本的中型豪华跨界车。因此，相关支出池应是智能电动车类别中的高端乘用车购买；传统高端汽车、大众市场电动车和广义出行服务属于替代品或相邻市场，不应计入。2023 年 Avatr 11
              的快照——交付 12,000 辆、平均价格 RMB 360,000——锚定了观察到的价格层级，但不能证明该层级的规模。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
