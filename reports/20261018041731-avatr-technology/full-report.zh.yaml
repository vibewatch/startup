      - number: '4.2'
        title: 定价、利润路径与单位经济性透明度
        blocks:
          - type: paragraph
            body: >-
              Avatr 的公开定价姿态明显偏高端，但价格透明度仍以标价为主。公司在 2023 年 Series B 公告中称，首款车型 Avatr 11 已交付 12,000 辆，平均价格
              RMB360,000；CathayEV 则报道，2026 年 8 月中国市场价格区间从限时促销价 CNY219,900 到三电机 Ultra 版本的
              CNY279,900。这些数据有助于框定定位，但不是按车型或渠道拆分的实际 ASP 桥接。独立报道对成本端更有帮助：Electric Viking 称，2025 年销售成本占收入 90.6%，毛利率从 6.3%
              提升至 9.4%；这是进步，但放在资本密集型 OEM 的成本结构里看，仍然偏薄。由于公开记录缺少 CAC、回本周期、门店生产力、保修准备金和营运资金细节，可用于投资判断的结论不是“ SaaS
              经济性改善”，而是“硬件利润率初步改善，但商业效率仍有重大盲点”。
