      - number: '4.3'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              投资判断的核心问题不是 Avatr 能否卖车，而是规模增长能否在不再进行大额融资的情况下跑赢现金消耗。Electric Viking 报道称，2022 至 2025 年累计亏损超过 $1.9
              billion，2026 年预计仍将净亏损；现金及现金等价物从 2024 年底的 $2.8 billion 降至 2025 年底的 $1.4 billion，并在 2026 年 4 月 30 日降至 $918.5
              million。战略支持因此仍很重要：Avatr 2023 年 Series B 以最高 RMB20 billion 估值募得 RMB3 billion，官方界面仍将 Changan 和 CATL
              列为最大股东，Huawei
              仍是战略技术伙伴。这种组合在需要时支持再次融资，但也凸显合作伙伴依赖，以及缺少清晰的独立盈利证据。财务结论是：“商业进展可信、利润率改善，但现金消耗、债务、营运资金和实际定价披露不足，无法在没有进一步尽调的情况下完成投资判断。”
            claimRefs:
              - CI005
              - CI007
