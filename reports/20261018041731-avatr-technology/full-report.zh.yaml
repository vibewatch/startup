        - 伙伴承诺减弱，或以明显更差的条款募资，都会削弱战略溢价逻辑。
      - - 高端产品定位
        - 官方材料和早期车型定价支持 Avatr 定位为高端智能电动车，而不是低端走量车型。
        - 大幅折扣、库存周转疲弱或利润率回落，都说明高端定位没有转化为经济价值。
      - - 规模与盈利压力
        - 相比可持续高端估值通常需要的水平，2026 年实际销售和累计亏损仍显疲弱。
        - 月度交付持续跃升并守住现金，将减轻反方论点的权重。
      - - 估值透明度缺口
        - 公司有历史融资轮和 IPO 前的隐含估值，但保留的来源没有披露实时价格区间或完整优先股堆叠。
