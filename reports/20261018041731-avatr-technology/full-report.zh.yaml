      - number: '2.4'
        title: 选择性出口扩大触达，但车型势头疲弱和时间错失限制采用
        blocks:
          - type: paragraph
            body: >-
              国际扩张确实存在，但边界有限。Avatr 11 的资料记录了其在尼泊尔、泰国、文莱、卡塔尔和巴基斯坦上市；独立资料则将泰国描述为进入其他右舵东南亚市场的桥头堡。同一资料还称，Avatr
              错过了既定的英国上市目标，截至 2026 年 9 月仍未确认替代日期。在国内，累计品牌销量和更宽的车型阵容是积极需求信号，但该资料仍将 Avatr 归为中国月度销量约第 35 至 50 位的品牌，Avatr 11
              系列也显示出明显的车型级下滑。因此，在给广泛的国际增长叙事赋予价值之前，应先关注各车型的实际销售、渠道生产力、实现价格和出口转化。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
