      - number: '2.3'
        title: 可观察的购车路径是实体渠道支撑的消费者零售
        blocks:
          - type: paragraph
            body: >-
              Avatr
              的公开界面强调车辆配置、车主应用、车主分享的驾驶体验和展厅。这种模式支持消费者零售的判断：通常由个人或家庭同时充当买方、用户和付款方，但现有证据没有量化车队销售、租赁、融资或人口群组。实体分销仍然重要：Avatr
              在 2023 年 8 月称已有超过 200 家展厅，并计划在年底前达到 350 个销售点。产品采用围绕 Huawei 辅助驾驶和座舱软件、CATL
              电池技术、高压充电以及多种车身和动力系统选择展开。这些是公司口径，并非消费者支付意愿或留存的独立证明。
