evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: ownership
    missingEvidence: A current primary cap table, board-rights summary, and any related-party or preference disclosures after Series C.
    whyItMatters: >-
      Ownership concentration and control rights affect governance, exit timing, and dependency on strategic
      shareholders.
    diligencePath: >-
      Obtain the latest shareholder register, IPO filing, or signed financing documentation directly from the company or
      exchange process.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: An official current leadership and board page, including committee structure and named directors.
    whyItMatters: The assigned pool shows a leadership transition but not the current official governance state or decision makers.
    diligencePath: Pull the company's current governance materials, board resolutions, or IPO prospectus governance section.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-scale-disclosures
    missingEvidence: Current public customer-count and headcount disclosures with dates and definitions.
    whyItMatters: These are cover metrics requested by the report brief and they are unavailable in reliable assigned-pool evidence.
    diligencePath: Request management KPI packs or use an IPO filing, official HR disclosures, or verifiable channel/customer data.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: fy2025-fy2026-financials
    missingEvidence: Audited FY2025 and FY2026 financial statements covering revenue, gross margin, cash, debt, burn, and runway.
    whyItMatters: >-
      The assigned pool supports historical financing and some 2024 operating scale, but not current liquidity or
      profitability quality.
    diligencePath: Obtain the latest audited statements, IPO draft, lender materials, or management reporting package.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A source-backed category denominator for premium intelligent EV demand by price band, powertrain, body style, and
      geography.
    whyItMatters: >-
      Without a comparable category denominator, Avatr's company and model volumes cannot be converted into defensible
      TAM, SAM, SOM, market share, or CAGR.
    diligencePath: >-
      Obtain current regulator, industry-association, or audited public-company datasets segmented by Chinese
      passenger-EV price band and powertrain, then reconcile them to Avatr's served models and export markets.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-productivity
    missingEvidence: >-
      Monthly registrations, sell-through, cancellations, inventory aging, achieved prices, and showroom productivity by
      model and region.
    whyItMatters: >-
      Headline deliveries and points of sale do not distinguish end demand from channel loading, discounting, or model
      substitution.
    diligencePath: >-
      Request management's monthly retail and wholesale bridge, model-level ASPs, order-to-delivery conversion,
      cancellations, and store cohort economics.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Buyer demographics, household income, financing and leasing mix, fleet share, repeat purchase, and export-market
      cohort conversion.
    whyItMatters: >-
      These data determine budget ownership, willingness to pay, and whether the consumer-retail interpretation scales
      beyond early adopters.
    diligencePath: Request anonymized customer cohorts and financing mix by model, channel, geography, and purchase month.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: comparability-gap
    missingEvidence: >-
      Named competitor official pricing pages, feature documentation, and independent product reviews for the same
      premium EV buyer set.
    whyItMatters: >-
      Without peer-level source parity, the chapter can position Avatr but cannot prove product or price superiority
      versus direct premium EV rivals.
    diligencePath: >-
      Retain competitor official product or pricing pages and third-party road-test or buyer-review evidence for at
      least three named direct peers.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: distribution
    missingEvidence: Realized dealer economics, sell-through, cancellation, and discounting data by model and market.
    whyItMatters: >-
      Public list pricing and market-entry claims do not show whether Avatr's channels are winning profitably against
      premium EV or incumbent alternatives.
    diligencePath: Obtain management or dealer data on realized ASP, incentives, inventory turns, and export-market sell-through.
    relatedQuestionRefs:
      - QP003
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-risk
    missingEvidence: >-
      Independent evidence on customer retention, cross-shopping, and the effect of Avatr-Deepal integration on brand
      separation.
    whyItMatters: >-
      The core moat question is whether buyers see Avatr as distinctly premium or as one supplier-enabled option inside
      Changan's broader portfolio.
    diligencePath: Review channel checks, customer surveys, and post-integration brand or dealer disclosures once available.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Model-level realized ASP, rebates, financing subsidies, and channel discounting by month for 2025 and 2026.
    whyItMatters: >-
      List prices and one historical average delivered price do not show whether reported revenue scale came from
      healthy pricing or heavy incentive spend.
    diligencePath: Request invoiced ASP and incentive bridge by model, trim, channel, and geography for 2025 and YTD 2026.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: >-
      Monthly operating cash burn, capex, debt maturities, covenant package, and unrestricted-versus-restricted cash
      after 2026-04-30.
    whyItMatters: The public cash decline is directionally important, but it does not show actual runway or next-round timing.
    diligencePath: >-
      Request monthly management accounts, debt schedules, and cash waterfall from year-end 2025 through the current
      quarter.
    relatedQuestionRefs:
      - QI005
      - QI007
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, payback period, outlet productivity, repeat-purchase rate, and marketing efficiency by channel and market.
    whyItMatters: >-
      Rapid outlet expansion can destroy contribution margin if customer-acquisition efficiency and local utilization
      are weak.
    diligencePath: >-
      Request cohort and channel analysis showing CAC, payback, utilization, and repeat behavior for China and export
      markets.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: >-
      Inventory days, dealer floorplan support, receivable aging, payable terms, warranty reserve methodology, and
      parts/service gross margin.
    whyItMatters: >-
      A hardware business can report improving gross margin while still suffering poor cash conversion and hidden
      service-cost drag.
    diligencePath: Request monthly working-capital bridge, inventory aging by model, and warranty/service margin detail.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Independent cybersecurity, privacy, software-governance, and certification documentation for the Huawei-led
      cockpit and ADAS stack in export markets.
    whyItMatters: >-
      Without external control evidence, the product story rests on feature marketing and a single model's safety score
      rather than repeatable governance proof.
    diligencePath: >-
      Request homologation files, privacy/security audit reports, warranty terms, and regulator-facing documentation for
      each export market before underwriting scale.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: service-support-risk
    missingEvidence: Country-level service footprint, parts availability, and software-support SLAs for markets outside mainland China.
    whyItMatters: >-
      A premium EV proposition can fail operationally if the service network and update support do not travel with the
      hardware and software stack.
    diligencePath: >-
      Obtain distributor agreements, service-center lists, spare-parts commitments, and OTA support policies for each
      target market.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: lineup-maturity
    missingEvidence: Independent operating detail for the 06, 06T, 011, and 012 beyond official listing pages.
    whyItMatters: >-
      The broad lineup supports the portfolio narrative, but not every nameplate has the same evidence depth or proof of
      commercial traction.
    diligencePath: >-
      Confirm live production status, pricing, and market availability for each listed model before using the full
      lineup as a growth assumption.
    relatedQuestionRefs:
      - QE001
  - type: missing-source
    severity: material
    topic: retention-and-cohorts
    missingEvidence: >-
      Retention, repeat-purchase, referral, satisfaction, and service-engagement data by model, purchase cohort,
      channel, and geography.
    whyItMatters: >-
      Delivery growth does not establish whether Avatr creates repeat demand, durable premium pricing, or satisfied
      long-term owners.
    diligencePath: >-
      Request VIN-level cohort data for repurchase, referral, NPS, warranty, service visits, app activity, and resale
      outcomes by model and market.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
