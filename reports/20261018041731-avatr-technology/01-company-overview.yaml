company:
  name: Avatr Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Avatr is a Chongqing-rooted premium smart EV company whose identity is clear—Changan manufacturing, Huawei software, and CATL battery support—but whose current governance and cap table still need primary re-verification. Public evidence supports large late-stage financing and meaningful 2024 scale, while 2026 launch coverage still frames sales momentum as behind leading Chinese EV startups.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      The assigned evidence consistently describes Avatr as a premium intelligent electric-vehicle platform rather than a generic auto startup. Secondary profiles trace the business back to the July 2018 Changan-NIO venture and describe a 2021 reset into the Avatr brand, while the official homepage still presents the company as a design-led smart EV brand focused on future-oriented mobility. The operating model is partner-heavy: Avatr's public materials tie the product stack to a Huawei software and intelligent-driving layer plus CATL battery capability, with Chongqing as the organizational center and Munich cited as a design outpost.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
  - id: leadership-governance-and-dependence
    title: Leadership, governance, and partner dependence
    body: >-
      Governance remains directionally visible but not cleanly documented in the assigned pool. Avatr's own October 2023 release named Tan Benhong as chairman and CEO, while a later secondary profile names Chen Zhuo as president and Wang Hui as chairman from September 2025. That is enough to establish material leadership change, but not enough to lock the current official leadership page or full board composition. Economically and operationally, the company appears tightly coupled to Changan, CATL, and Huawei, which creates both support and concentration risk: current ownership percentages conflict across public secondary sources, and Huawei remains critical even where sources describe it as a non-equity partner.
    claimRefs:
      - CO004
      - CO007
      - CO008
      - CO013
      - CO014
    tableRefs:
      - TO002
      - TO003
  - id: capitalization-and-disclosed-scale
    title: Capitalization and disclosed scale
    body: >-
      Public financing disclosures indicate that Avatr is a late private company with meaningful capital behind it, but still short of fully transparent public-company reporting. The clearest supported funding markers are the August 2023 Series B announcement and the December 2024 Series C reported by Multiples, which together support a step-up from roughly RMB 20 billion valuation in 2023 to more than RMB 30 billion or about $4.3 billion by late 2024. The same secondary source reports meaningful commercial scale—$1.1 billion of round-linked revenue context, RMB 7.386 billion of revenue for the first eight months of 2024, and 73,606 vehicles sold in 2024—but also reports a RMB 2.121 billion net loss and accumulated debt, so funding raised should not be treated as cash available or as proof of near-term profitability.
    claimRefs:
      - CO005
      - CO006
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO001
  - id: milestone-and-refresh-readout
    title: Milestones and refresh readout
    body: >-
      Avatr's milestone trail shows steady product and financing execution, but the refresh evidence is not uniformly positive. Official 2023 releases support tangible progress from AVATR 11 deliveries to AVATR 12 mass production, while later public profiles record the 2024 Series C close and a 2025 leadership handoff. The most current independent launch coverage is more mixed: the August 2026 07L launch expands the lineup and keeps the Hong Kong IPO path alive, yet the same coverage says Avatr sold only 35,250 vehicles in the first seven months of 2026 and remained well behind China's leading EV startups. For downstream chapters, the grounded take is a strategically backed premium EV platform with real scale, but with weaker 2026 momentum and unresolved transparency on current governance, customer count, headcount, and the post-Series-C cap table.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    figureRefs:
      - FO001
