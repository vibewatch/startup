        - date: 2022-06-25
          label: CHN platform launched
          detail: Secondary sources date the CHN intelligent EV platform launch to June 2022.
          tone: positive
          claimRefs:
            - CO004
        - date: 2023-08-30
          label: Series B closes
          detail: Avatr announced RMB 3 billion of Series B funding at up to RMB 20 billion valuation.
          tone: positive
          claimRefs:
            - CO005
            - CO011
        - date: 2023-10-11
          label: AVATR 12 mass production wrapped up
          detail: The company said AVATR 12 completed mass production in Chongqing with Q4 2023 deliveries planned.
          tone: positive
          claimRefs:
            - CO012
            - CO013
        - date: 2024-12-17
          label: Series C disclosed
          detail: Multiples reports a December 2024 Series C of roughly $1.5 billion / RMB 11.101 billion at about $4.3 billion valuation.
          tone: positive
          claimRefs:
            - CO006
        - date: 2025-09
          label: Leadership handoff visible in public profiles
          detail: Grokipedia identifies Wang Hui as chairman from September 2025 and Chen Zhuo as president.
          tone: neutral
          claimRefs:
            - CO014
        - date: 2026-08-09
          label: 07L launch amid slower 2026 pace
          detail: CnEVPost says the 07L launch came while Avatr's first-seven-month 2026 sales still trailed leading Chinese EV startups.
          tone: risk
          claimRefs:
            - CO015
            - CO016
