    title: Company milestone timeline
    type: timeline
    summary: >-
      Avatr's documented path runs from a 2018 JV origin through 2023-2024 financing and product milestones into a weaker-but-still-active 2026 launch and IPO push.
    data:
      items:
        - date: 2018-07-10
          label: Changan-NIO joint venture formed
          detail: Avatr's lineage starts with the July 2018 Changan NIO new-energy JV.
          tone: neutral
          claimRefs:
            - CO001
        - date: 2021-05-20
          label: Avatr brand reset
          detail: Public profiles say the company adopted the Avatr name in 2021 after NIO's exit and a Huawei-CATL partnership reset.
          tone: positive
          claimRefs:
