company:
  name: Avatr Technology
chapter:
  number: 4
  title: Financials
  summary: >-
    Avatr has moved beyond concept-stage scale: public 2025 disclosures point to
    revenue above RMB25 billion and 122,702 deliveries, while independent
    reporting shows modest gross margin improvement to 9.4% but continued heavy
    losses and a shrinking cash balance into April 2026. The supportable
    financial read is that Avatr has real commercial traction and strategic
    backing, but still depends on external capital and undisclosed hardware
    economics before the business is underwritable on a conventional margin or
    runway basis.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Public evidence supports a vehicle-led revenue model rather than a
      software- or services-led one. NewTimeSpace's HKEX-based summary says
      Avatr designs, develops, and sells BEV and REEV passenger vehicles using
      an asset-light model with Changan as exclusive manufacturer, CATL as a
      battery partner, and Huawei as the intelligent-vehicle stack partner.
      That fits the official surfaces, which emphasize the owner app,
      after-sales support, and user-operation ecosystem but do not disclose any
      separate software subscription revenue line. On public scale, the company
      is no longer pre-revenue or niche only in pilot channels: NewTimeSpace
      says 2025 revenue exceeded RMB25 billion and 2025 deliveries reached
      122,702 vehicles, while an independent market profile says cumulative
      sales since launch exceeded 150,000 vehicles. The public gap is mix:
      investors can see that vehicle sales drive the P&L, but not how much of
      that revenue comes from each model, geography, financing program, or
      ancillary service.
    claimRefs: [CI001, CI002, CI003, CI012, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: pricing-margin-and-unit-economics
    title: Pricing, margin path, and unit-economics visibility
    body: >-
      Avatr's public pricing posture is clearly premium, but pricing visibility
      is still list-price heavy. The company said in its 2023 Series B release
      that the first model, Avatr 11, had delivered 12,000 units at an average
      price of RMB360,000, while CathayEV reported that the August 2026 China
      range stretched from CNY219,900 on a limited-time promotion to CNY279,900
      for the tri-motor Ultra trim. Those data points help bracket positioning,
      but they are not a realized ASP bridge by model or channel. Independent
      reporting is more useful on the cost side: Electric Viking says cost of
      sales was 90.6% of revenue in 2025 and gross margin improved from 6.3% to
      9.4%, which is progress but still thin for a capital-intensive OEM.
      Because the public record lacks CAC, payback, outlet productivity,
      warranty reserves, and working-capital detail, the underwriteable
      conclusion is not "improving SaaS economics" but "early hardware margin
      progress with major commercial-efficiency blind spots."
    claimRefs: [CI004, CI006, CI011, CI012, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-view
    title: Capital adequacy and underwriting view
    body: >-
      The main underwriting issue is not whether Avatr can sell vehicles, but
      whether improving scale can outrun cash consumption without another large
      financing event. Electric Viking reports cumulative losses above $1.9
      billion from 2022 through 2025, a remaining expectation of net loss in
      2026, and cash and cash equivalents falling from $2.8 billion at the end
      of 2024 to $1.4 billion at year-end 2025 and then $918.5 million by 30
      April 2026. Against that backdrop, strategic backing still matters:
      Avatr's 2023 Series B raised RMB3 billion at up to RMB20 billion
      valuation, and official surfaces still present Changan and CATL as the
      largest shareholders while Huawei remains a strategic technology partner.
      That mix supports another financing path if required, but it also
      underlines partner dependence and the absence of clean stand-alone
      profitability evidence. Financially, the verdict is "credible traction,
      improving margin, insufficient disclosure on burn, debt, working capital,
      and realized pricing to underwrite without additional diligence."
    claimRefs: [CI005, CI007, CI008, CI009, CI010, CI013, CI014]
