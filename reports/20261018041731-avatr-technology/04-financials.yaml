callouts:
  - calloutType: strength
    title: Scale is no longer hypothetical
    body: >-
      Public 2025 disclosures of more than RMB25 billion in revenue and 122,702
      deliveries mean Avatr should be evaluated as a scaling OEM, not as a
      pre-revenue premium EV concept.
    claimRefs: [CI002, CI003]
  - calloutType: risk
    title: Margin improvement still sits inside a cash-burn story
    body: >-
      Even with improving gross margin, public reporting still shows cumulative
      losses through 2025 and a material cash decline by April 2026, which keeps
      financing dependency central to the underwriting case.
    claimRefs: [CI006, CI007, CI008]
  - calloutType: recommendation
    title: Underwrite only with management-account detail
    body: >-
      The next diligence step is not another top-line market narrative; it is
      audited FY2025/FY2026 statements plus monthly burn, debt, inventory, and
      realized ASP detail by model and channel.
    claimRefs: [CI008, CI011, CI014]
