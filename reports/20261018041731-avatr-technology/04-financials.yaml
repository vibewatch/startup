  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / metric
      - Price / unit / contract
      - List vs realized
      - Discounts / unknowns
      - Source
    rows:
      - ["Avatr 11 initial premium positioning", "Average price RMB360,000 on 12,000 delivered units", "Appears realized on delivered units, not only list", "Vintage is 2023 and limited to the first model cohort", "2023 Series B press release"]
      - ["Avatr 11 Harmony Edition", "Starting price RMB280,000", "List price", "No public discounting or trim-mix disclosure", "2023 Series B press release"]
      - ["China lineup (Aug 2026) entry point", "CNY219,900 limited-time promotional price", "Promotional list price", "Promotion timing and realized take rate undisclosed", "CathayEV"]
      - ["China lineup (Aug 2026) high end", "CNY279,900 for tri-motor Ultra", "List price", "No realized ASP or incentive bridge", "CathayEV"]
      - ["Software / service monetization", null, "Undisclosed publicly", "No public subscription, attach-rate, or software gross-margin disclosure", "Official global site and technology page"]
    notes: "List prices, promotional prices, and one disclosed average delivered price are not a substitute for current realized ASP by model and channel."
    claimRefs: [CI004, CI011, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Gross margin", "9.4% in 2025 vs 6.3% in 2024", medium, "Shows that scale is improving economics, but still leaves little room for warranty, channel, and pricing shocks", "Model-level gross margin bridge, warranty accruals, and fixed-versus-variable manufacturing cost split"]
      - ["Cost of sales as % of revenue", "90.6% in 2025", medium, "Confirms the business is still structurally thin-margin at the gross-profit line", "BOM, battery cost, manufacturing fee, logistics, and dealer support breakdown"]
      - ["Cash and cash equivalents", "$2.8B end-2024 -> $1.4B end-2025 -> $918.5M on 2026-04-30", medium, "Best public runway proxy; direction matters more than the exact quarter-end balance", "Monthly burn, capex, debt maturities, covenants, and unrestricted cash bridge"]
      - ["CAC / payback", null, low, "Required to judge whether outlet and market expansion is creating durable contribution margin", "Channel CAC, payback by model and geography, and repeat-purchase or referral mix"]
      - ["Working capital / inventory", null, low, "Hardware companies can look better on revenue than on cash conversion if inventory or dealer finance expands", "Inventory days, receivable days, payable terms, floorplan support, and channel inventory aging"]
    notes: "Null entries mark public disclosure gaps, not zero values; public unit economics are limited to gross-profit and cash proxies."
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
