schemaVersion: "report-v2"
artifact: valuation
slug: omni-analytics
runDate: 2026-10-23
company:
  name: Omni Analytics
chapter:
  number: 8
  title: Valuation
  summary: Omni has credible product differentiation and a reported $1.5B Series C valuation, but the public record does not provide a current revenue denominator, retention profile, or full financing terms. The resulting price-sensitive conclusion is track at the reported mark until ARR, margins, dilution, and preference terms are verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that Omni is building a coherent governed analytics platform rather than a
      standalone chatbot. The company describes AI operating on a semantic layer with governed
      metrics, joins, permissions, and reusable evaluation workflows, while third-party material
      describes the platform as combining self-service analytics, embedded delivery, and AI. A
      reported Series C at $1.5B and the hiring record's reference to a $120M round indicate
      substantial investor support, while a low-reputation third-party profile reports 4x annual
      revenue growth. These are financing and directional operating signals rather than proof of
      operating value. The anti-thesis is equally concrete: public revenue, ARR, retention,
      gross margin, burn, and customer concentration are not established by the assigned
      evidence. Competitive sources also identify custom pricing, a small review base, and
      integration or maturity questions. Without a denominator, a valuation multiple cannot be
      calculated responsibly, so the investment case depends on diligence rather than a forced
      buy call.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      The strongest current price signal is a reported $120M Series C at a $1.5B valuation,
      alongside a separate company job listing that repeats the same valuation and round size.
      Those sources are not independent corroboration of a fair price: the article supplies a
      reported financing account, while the job listing is company-issued. The pool also contains
      a pricing benchmark that describes annual contract values from $15,000 for small teams to
      $150,000 or more for larger deployments, but it is anonymized benchmark context and not
      Omni revenue. An October 2026 public-software dataset places BI and analytics software at
      3.2x EV/NTM revenue. That benchmark cannot be applied directly to a private financing
      valuation without a comparable NTM revenue basis, net cash or debt, growth, margins, and a
      public/private adjustment. Entry discipline should therefore require a verified latest cap
      table, primary round documents, preference stack, option-pool treatment, secondary/tender
      mechanics, current ARR or revenue, and a bridge from bookings to recognized revenue.
    claimRefs: [CV006, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear scenarios
    body: >-
      The scenarios are decision ranges, not forecasts. The bull case requires verified
      sustained growth, strong retention, defensible gross margins, and evidence that semantic
      governance and embedded AI convert into durable expansion rather than feature parity. The
      base case assumes product traction continues but public financial disclosure remains thin,
      competition limits pricing power, and the reported financing mark is difficult to underwrite
      against a missing denominator. The bear case is triggered by a down round, weak renewals,
      commercialization friction, margin pressure from model or warehouse dependencies, or
      customer-facing analytics failures. The available evidence supports the direction of these
      sensitivities: Omni markets semantic-model grounding and evals, while independent and
      competitor material highlights custom pricing, limited review depth, ecosystem gaps, and
      the risk that semantic layers become a feature. Until the missing inputs are obtained,
      probability signals should remain qualitative and no scenario should be presented as a
      precise equity value.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation, exit readiness, and diligence asks
    body: >-
      Recommendation: track, with medium confidence and a stretched valuation stance at the
      reported $1.5B mark. This is not a judgment that the product is weak; it is a judgment that
      the price cannot be tested against public operating performance. A buy decision would
      require a verified revenue denominator, cohort retention, gross margin, net burn and
      runway, customer concentration, renewal evidence, and the exact Series C capitalization and
      preference terms. Exit readiness is also conditional: a credible path would require
      repeatable enterprise expansion, durable embedded-analytics adoption, clear AI quality and
      security controls, and enough audited or diligence-grade financial history for a strategic
      or public-market buyer to underwrite the business. Thesis-break triggers are a down round,
      material churn, a security or reliability event that weakens trust in governed analytics,
      inability to integrate embedded capabilities, or a valuation reset without corresponding
      operating growth.
    claimRefs: [CV002, CV003, CV016, CV017, CV018]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, Do not underwrite a buy at the reported mark without primary financial and financing diligence]
      - [Confidence, medium, Product and financing signals are credible but operating denominators remain unverified]
      - [Risk rating, high, Thin disclosure and competition create material downside uncertainty]
      - [Valuation stance, stretched, $1.5B is reported but cannot be tested against current ARR or revenue]
      - [Decision implication, diligence-gated, "Revisit after cap table, cohort, margin, burn, and preference evidence"]
    notes: "Assessment synthesizes assigned public evidence; null or undisclosed operating metrics are not treated as zero."
    claimRefs: [CV006, CV010, CV016, CV017]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Governed AI can differentiate the platform, "Semantic-model grounding, permissions, evals, and MCP/API delivery are described in Omni's materials", "Independent accuracy, adoption, and renewal evidence would strengthen the thesis"]
      - [Enterprise traction may support premium economics, "The financing report describes a $120M Series C at a $1.5B valuation", "Verified ARR, growth, gross margin, and cohort retention are required"]
      - [Breadth may create platform leverage, "BI, spreadsheets, embedded analytics, and AI are positioned on one model", "Evidence of attach rates and expansion by product line would validate cross-sell"]
      - [Price may be ahead of proof, "Public sources do not establish a current revenue denominator or exact terms", "Primary financials and capitalization documents could reduce the discount"]
      - [Competitive pressure can compress value, "Competitor material cites custom pricing, small review depth, and ecosystem gaps", "Win rates, displacement data, and durable renewal cohorts would mitigate this concern"]
    notes: "Rows separate supporting and disconfirming signals; company-issued descriptions are not treated as independent validation."
    claimRefs: [CV001, CV003, CV006, CV010, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified high growth, strong retention, healthy gross margin, durable embedded adoption, and clean financing terms", "A premium software multiple could be supportable only against verified revenue or ARR; no numeric equity value is asserted", "Low-to-medium until denominator evidence is obtained", "Growth or retention misses, weak AI quality, or inability to monetize breadth"]
      - [Base, "Product traction continues, but disclosure remains thin and competition limits pricing power", "Track the reported $1.5B mark and require a material evidence discount until current revenue and terms are verified", "Medium", "No timely financial disclosure, flat adoption, or margin compression"]
      - [Bear, "Down round, weak renewals, customer concentration, platform dependency, or embedded integration failure", "Multiple compression and dilution can reduce investor returns; loss magnitude cannot be quantified without the cap table", "Material risk", "Down round, material churn, security/reliability event, or failed commercialization"]
      - [Diligence case, "Primary financing documents and operating KPIs become available", "Re-rate using a model-appropriate revenue or ARR multiple and explicit dilution/preference waterfall", "Required before buy", "Evidence remains private, inconsistent, or unaudited"]
    notes: "Scenario ranges are qualitative because the assigned pool lacks a verified current revenue or ARR denominator and complete capitalization terms."
    claimRefs: [CV006, CV009, CV010, CV011, CV014, CV015, CV018]
figures:
