    title: Recommendation logic
    type: flow
    summary: Product and financing signals support continued diligence, while missing denominators and downside risks keep the recommendation at track.
    data:
      nodes:
        - id: scale
          label: Product scale
          detail: Governed semantic model spans BI, embedded analytics, and AI workflows.
        - id: proof
          label: Financing proof
          detail: Reported $120M Series C at a $1.5B valuation.
        - id: gap
          label: Denominator gap
          detail: Current ARR, revenue run rate, retention, margin, and burn are not established here.
        - id: risk
          label: Downside risks
          detail: Competition, pricing opacity, dependency exposure, and commercialization or integration risk.
        - id: discipline
          label: Entry discipline
          detail: Require primary financing terms and diligence-grade operating KPIs.
        - id: call
          label: Track
          detail: Medium confidence; stretched valuation stance pending verification.
      edges:
        - [scale, proof]
        - [proof, gap]
        - [gap, risk]
        - [risk, discipline]
        - [discipline, call]
    claimRefs: [CV001, CV006, CV010, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Track pending denominator evidence
    body: The reported price is investable only after ARR or revenue, retention, margins, capitalization, and preference terms are independently verified.
    claimRefs: [CV006, CV009, CV016]
  - calloutType: risk
    title: Downside is disclosure-sensitive
    body: Missing operating denominators make multiple compression and down-round risk impossible to size from the assigned public evidence.
    claimRefs: [CV010, CV017, CV018]
