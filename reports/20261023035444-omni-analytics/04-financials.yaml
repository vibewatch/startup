  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: runway-gap
      missingEvidence: >-
        Current cash balance, primary versus secondary Series C proceeds, monthly net burn,
        debt and credit facilities, committed obligations, and downside runway.
      whyItMatters: >-
        Funding raised cannot be treated as cash available, and one month of reported
        profitability cannot establish free-cash-flow durability.
      diligencePath: >-
        Obtain bank statements, the financing close statement, monthly cash-flow statements,
        debt schedules, and a 24-month base and downside liquidity model.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: >-
        Gross margin, NRR, GRR, logo churn, customer concentration, CAC allocation, sales
        cycle, implementation cost, and CAC payback by segment.
      whyItMatters: >-
        Public growth signals cannot establish revenue durability, sales efficiency, or a
        credible margin path without cohort and cost evidence.
      diligencePath: >-
