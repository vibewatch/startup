schemaVersion: "report-v2"
artifact: financials
slug: omni-analytics
runDate: 2026-10-23
company:
  name: Omni Analytics
chapter:
  number: 4
  title: Financials
  summary: >-
    Omni has credible growth and financing signals: independent reporting says ARR nearly
    quadrupled over the prior year and the company first reached profitability in March
    2026, while its April Series C raised $120 million at a $1.5 billion valuation. The
    financial case remains ununderwriteable from public evidence because absolute ARR,
    realized pricing, gross margin, retention, cash, burn, runway, and capital obligations
    are not disclosed.
sections:
  - id: monetization-architecture
    title: Broad monetization surfaces, opaque contract economics
    body: >-
      Omni publicly presents one governed semantic model across dashboards, workbooks,
      spreadsheets, SQL, embedded analytics, and AI workflows. That breadth creates several
      plausible commercial surfaces: the core analytics platform, customer-facing embedded
      delivery, and AI or agent usage. It does not establish that each surface is separately
      priced or reported as a revenue stream. Omni also says customers can create custom
      pricing tiers for AI products, while competitor-authored pricing reviews describe the
      platform as sales-led rather than governed by a stable public rate card. A customer
      review on AWS Marketplace separately flags difficulty navigating credit consumption.
      These observations support a recurring enterprise-software model with expansion
      potential, but not an estimate of realized ACV, revenue mix, discounting, or AI
      overage economics. The distinction matters because list architecture and product
      breadth are not evidence of recognized revenue or gross profit.
    claimRefs: [CI001, CI002, CI004, CI005, CI012]
    tableRefs: [TI001, TI002]
  - id: traction-and-unit-economics
    title: Growth is visible; unit economics are not
    body: >-
      The strongest current traction evidence comes from Fortune's independent reporting:
      ARR nearly quadrupled over the preceding year, Omni reached profitability for the
      first time in March 2026, and BambooHR was serving more than 100,000 users through
      Omni. Ramp's October 2026 vendor data separately reports 6% adoption among
      organizations using a business-intelligence vendor, up two percentage points year
      over year. These signals indicate commercial momentum and deployment scale, but they
      do not reveal absolute ARR, GAAP revenue, recurring versus services mix, NRR, churn,
      customer concentration, or sales efficiency. One month of accounting profitability
      is not evidence of sustained profitability or positive free cash flow. Direct-query
      warehouse execution and reliance on external LLM providers also expose cost drivers
      whose customer pass-through and margin effects remain unknown.
    claimRefs: [CI003, CI006, CI007, CI008, CI009, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-verdict
    title: A large round reduces financing pressure but does not establish runway
    body: >-
      Omni announced a $120 million Series C at a $1.5 billion valuation in April 2026, with
      multiple retained sources reporting the same headline terms. The transaction also
      included a $30 million employee tender offer, so the headline funding amount should
      not be treated as cash available for operations without the financing documents and
      cash-flow statement. Public evidence does not disclose primary versus secondary
      proceeds, cash on hand, monthly burn, debt or credit facilities, project obligations,
      or the next-round trigger. The resulting verdict is positive on demand momentum and
      access to capital, but cautious on revenue quality, margin durability, and capital
      adequacy. Underwriting requires a data-room bridge from bookings to recognized
      revenue, cohorts and concentration, a gross-margin walk, and a fully diluted
      cash-and-obligations schedule before the financing can be translated into runway.
    claimRefs: [CI010, CI011, CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Publicly visible revenue surfaces
    columns:
      - Revenue surface
      - Mechanism
      - Public unit
      - Current evidence
      - Revenue-quality view
      - Diligence ask
    rows:
      - - Core analytics platform
        - Governed BI, workbooks, SQL, spreadsheets, and semantic modeling
        - Not disclosed
        - Product surface verified; realized pricing and revenue mix unavailable
        - Recurring potential, but contract duration and renewal behavior are unknown
        - Contract schedule by ACV, term, seat or capacity unit, discount, and renewal date
      - - Embedded analytics
        - Customer-facing dashboards, self-service, and tenant-aware delivery
        - External user, tenant, capacity, or usage unit not disclosed
        - Product surface verified; separate embedded revenue unavailable
        - Expansion potential, but external-user economics are unverified
        - Embedded ARR, active tenants, usage bands, overages, and gross margin
      - - AI and agent workflows
        - Chat, dashboard builder, routines, Slack agent, APIs, and MCP
        - Credits, queries, tokens, or bundled allowance not disclosed
        - Capabilities verified; customer review mentions credit consumption
        - Usage expansion is plausible, but model-cost pass-through is unknown
        - AI revenue, credits consumed, model cost per query, and overage pricing
      - - Implementation and support
        - Migration, modeling, deployment, and enterprise support
        - Project or support fee not disclosed
        - Partner evidence shows migration work; Omni services revenue is not disclosed
        - May aid adoption but could mix recurring and nonrecurring economics
        - Services attach rate, partner share, implementation cost, and support margin
    notes: >-
      Product surfaces are public, but rows do not assert that Omni reports each as a
      separate revenue stream; units, realized pricing, mix, and recognition are unavailable.
    claimRefs: [CI001, CI002, CI003, CI005, CI012, CI013]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Commercial component
      - Public price or unit
      - Evidence status
      - Underwriting implication
      - Required evidence
    rows:
      - - Platform commitment
        - Not disclosed
        - Competitor reviews describe sales-led custom pricing
        - Base ARR and discount discipline cannot be modeled
        - Executed order forms and ARR bridge by cohort
      - - Creator and administrator access
        - Not disclosed
        - No retained source provides seat pricing or included quantities
        - Land economics and expansion by seat remain unknown
        - Seat schedule, role mix, list-to-realized discount, and true-up terms
      - - Embedded external usage
        - Not disclosed
        - User, tenant, session, load, or capacity basis is not public
        - External-user scale could improve expansion or pressure delivery margin
        - Contracted usage metric, minimums, overages, and tenant-level contribution margin
      - - AI and credit consumption
        - Not disclosed
        - AWS Marketplace reviewer reports difficulty navigating credit consumption
        - Variable AI cost and customer price realization cannot be reconciled
        - Credit definition, included allowance, model pass-through, and gross margin per query
    notes: >-
      Pricing observations combine competitor-authored comparisons and one customer review;
      they do not establish Omni's realized prices or the terms of any specific contract.
    claimRefs: [CI004, CI005, CI012]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Absolute ARR or revenue run rate
        - null
        - Low
        - Growth rates cannot anchor scale, valuation multiples, or burn efficiency
        - Monthly ARR bridge, GAAP revenue, bookings, and deferred revenue
      - - ARR growth
        - Nearly 4x over the preceding year
        - Medium
        - Signals momentum but lacks an absolute denominator and cohort decomposition
        - Starting and ending ARR, organic versus acquired growth, and constant-currency basis
      - - Profitability
        - First achieved in March 2026
        - Medium
        - One month does not establish sustained operating profit or positive cash flow
        - Monthly income statement and cash-flow statement through September 2026
      - - Gross margin
        - null
        - Low
        - Warehouse, support, embedding, and LLM costs may produce different margin profiles
        - Gross margin by product surface with hosting and model costs separated
      - - NRR, churn, CAC, and payback
        - null
        - Low
        - Revenue durability and sales efficiency cannot be tested
        - Cohort NRR and GRR, logo churn, CAC allocation, sales cycle, and payback
      - - Cash, burn, and runway
        - null
        - Low
        - Funding raised is not cash available, and profitability is not free cash flow
        - Cash balance, net burn, debt, tender mechanics, obligations, and downside runway
    notes: >-
      Null means no value was found in the assigned successful source pool; reported growth
      and profitability are not substitutes for audited revenue, cash flow, or cohort data.
    claimRefs: [CI007, CI008, CI010, CI011, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Publicly supportable activity-to-economics bridge
    type: flow
    summary: >-
      Product activity and delivery mechanics are visible, but billing conversion, gross
      margin, and free cash flow remain outside the public evidence boundary.
    data:
      nodes:
        - id: user-activity
          label: Customer and analyst activity
          detail: Dashboard, workbook, SQL, spreadsheet, embedded, or AI interaction
        - id: governed-query
          label: Governed semantic query
          detail: Metrics, joins, permissions, and business context applied
        - id: warehouse-execution
          label: Warehouse execution
          detail: Direct-query work occurs against customer data infrastructure
        - id: delivered-output
          label: Delivered analytics output
          detail: Internal BI, embedded experience, API, Slack, or external agent
        - id: contracted-billing
          label: Contracted billing
          detail: Pricing unit, minimum commitment, credits, and overages are undisclosed
        - id: gross-profit-and-cash
          label: Gross profit and free cash flow
          detail: Delivery costs, margin, collections, burn, and runway are undisclosed
    approximationNotes: >-
      Ordered conceptual flow only; it does not imply conversion rates, values, or a
      disclosed contractual sequence.
    claimRefs: [CI001, CI003, CI005, CI013, CI015, CI016]
callouts:
  - calloutType: risk
    title: Financing headlines do not resolve the underwriting gaps
    body: >-
      The $120 million Series C improves access-to-capital confidence, but a disclosed
      $30 million employee tender and the absence of cash, burn, margin, and retention data
      prevent conversion of the round into a defensible runway or valuation multiple.
    claimRefs: [CI010, CI011, CI014, CI015, CI016]
