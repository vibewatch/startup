      - [Metabase, "Open Source $0; Starter starting at $85/month for 5 users", "G2 listing identifies open-source and Starter tiers", "Actual realized price and enterprise terms unknown", "Transparent entry pricing can anchor lower-cost evaluations"]
      - [Looker, "No comparable public price retained", "Google Cloud product with AI, semantic layer, APIs, and embedded analytics", "Contract and bundle terms unknown", "Existing cloud procurement may reduce incremental friction"]
      - [Tableau Next, "Sold standalone or bundled with Tableau Cloud in Tableau+ Bundle", "API-first, composable, Data 360 and Hyperforce positioning", "Bundle discount and realized price unknown", "Bundling can increase incumbent retention"]
      - [Power BI, "No comparable public price retained", "Broad BI, visualization, connectivity, and ETL capabilities in review evidence", "Plan and enterprise agreement terms unknown", "Microsoft relationship and bundle economics are key diligence variables"]
      - [ThoughtSpot, "No comparable public price retained", "Search-based and AI-driven analytics", "Contract terms, user tiers, and discounts unknown", "AI-led alternative needs a controlled price and outcome comparison"]
