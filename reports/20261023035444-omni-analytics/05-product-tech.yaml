company:
  name: Omni Analytics
chapter:
  number: 5
  title: Product & Technology
  summary: Omni presents a warehouse-native analytics platform centered on a governed semantic model that feeds SQL, spreadsheets, dashboards, embedded analytics, and AI workflows. The product surface is broad and increasingly agentic, but public evidence is mostly company- or partner-authored and does not establish production reliability, security assurance, or implementation outcomes at scale.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      Omni is delivered as a direct-query business-intelligence and embedded-analytics
      platform. Its workflow begins with governed metrics and relationships, then lets
      business users ask natural-language questions, build dashboards, refine workbooks,
      or use SQL and spreadsheet-style formulas. The official product surface also lists
      Slack delivery, scheduled and conditional routines, APIs, and an MCP server. This
      creates a coherent path from a governed definition to an end-user answer, while
      preserving several interaction modes for technical and non-technical users. A
      partner implementation describes the same operating model as a layered system:
      raw database schema, governed data model, and ad-hoc workbook model. The practical
      buyer value is reduced metric disagreement and faster self-service; the diligence
      question is how much modeling and administration are required before those benefits
      appear in a real warehouse.
    claimRefs: [CE001, CE003]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture
    title: Architecture and AI control plane
    body: >-
      The strongest technical differentiator is the semantic layer as an execution
      boundary rather than a documentation layer. Omni says its AI generates semantic
      queries, which are translated to SQL against the warehouse, and that the model
      carries metrics, dimensions, joins, access controls, and AI-specific instructions.
      Its AI page says the coordinator plans actions, selects tools, executes queries,
      evaluates results, and can perform multi-step analysis. It also says Omni uses
      AWS Bedrock-hosted Claude models for most tasks and OpenAI models for advanced AI
      visualizations. These are credible product architecture claims, but they remain
      vendor descriptions: the public material does not provide independent benchmark
      results, latency distributions, evaluation datasets, or failure-rate evidence.
      A public MCP specification supports the interoperability premise, but not the
      security of any particular Omni deployment.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
  - id: maturity-and-dependencies
    title: Maturity, integrations, and dependencies
    body: >-
      Omni exposes a broad integration and deployment surface: the official business
      intelligence page references APIs, an MCP server, Slack and email delivery, and
      bi-directional dbt integration. The official AI material describes AI Hub,
      reusable prompt-set evals, branch comparisons, and row-level filters. A public
      GitHub repository for an Omni Cursor plugin documents REST API access, API-key
      setup, and operations against the semantic layer, while also marking that plugin
      deprecated in favor of a successor repository. Ramp's proprietary panel reports
      6% adoption among organizations using a business-intelligence vendor as of October
      2026, but that category-level estimate does not establish production depth or
      workload scale. Together these signals show a real developer surface and market
      presence, but they also expose dependencies on cloud warehouses, model providers,
      APIs, and evolving agent tooling. No public source establishes uptime,
      support response, migration duration, or a complete release and deprecation policy.
    claimRefs: [CE010, CE012, CE013]
  - id: risk-and-diligence
    title: Trust, reliability, and implementation risks
    body: >-
      Omni's control story is directionally strong: the company says row-level security
      and user attributes are enforced through the semantic layer, only necessary data
      is sent to external LLMs, and evals can compare prompt-set runs before production
      changes ship. However, the available evidence does not independently verify SOC 2,
      HIPAA, GDPR, incident history, or the effectiveness of those controls. A third-party
      product profile says setup and integration are required and that AI effectiveness
      depends on semantic-model quality; a partner account describes the layered
      operating model while noting that its partnership was new. An independent
      practitioner adds that semantic-layer projects surface unresolved ownership of
      metric definitions rather than solving that organizational problem automatically. The main
      product risk is therefore not a missing feature but implementation burden and
      operational dependence: customers must model business definitions, govern access,
      monitor AI behavior, and manage warehouse and model-provider changes. Buyers should
      require a live proof of concept with representative joins, permission tests,
      adversarial prompts, rollback evidence, and measured query cost before treating the
      platform as production-ready.
    claimRefs: [CE004, CE013, CE014, CE015, CE016, CE017]
