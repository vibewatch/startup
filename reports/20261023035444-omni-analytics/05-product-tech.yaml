callouts:
  - calloutType: strength
    title: Coherent governed-semantic thesis
    body: Omni connects one semantic model to BI, workbooks, embedded analytics, and AI rather than presenting AI as an isolated chatbot.
    claimRefs: [CE001, CE005, CE006]
  - calloutType: risk
    title: Control claims exceed public proof
    body: Public material describes permissions, data minimization, and evals, but does not independently establish reliability, security assurance, or production incident performance.
    claimRefs: [CE014, CE015, CE016]
  - calloutType: recommendation
    title: Gate production adoption with a measured proof of concept
    body: Require representative semantic models, tenant and row-level permission tests, adversarial AI evaluation, query-cost measurement, and rollback evidence before committing to a broad deployment.
    claimRefs: [CE005, CE014, CE016]
