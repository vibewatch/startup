  - id: TE001
    title: Product surface and workflow map
    columns: [Surface, Primary user, Delivery mechanism, Maturity signal, Diligence gap]
    rows:
      - [Natural-language analysis, Business users, "AI chat and multi-step analysis", "Officially described; no independent accuracy benchmark", "Measure answer accuracy and abstention on representative questions"]
      - [Governed metrics, Data teams, "Semantic model with metrics, joins, and business logic", "Core platform architecture", "Test metric versioning and semantic-model ownership"]
      - [Workbook analysis, Analysts, "Point-and-click, SQL, and spreadsheet formulas", "Officially described and partner-demonstrated", "Measure learning curve and complex-model failure modes"]
      - [Dashboards, Analysts and executives, Interactive visualizations and scheduled delivery, "Official product capability", "Validate refresh latency, alerting, and permission behavior"]
      - [Embedded analytics, Product teams, "APIs and embedded AI", "Officially described; partner migration example", "Verify tenant isolation, SDK stability, and support SLA"]
    notes: "Rows synthesize official and partner descriptions; maturity is not an independent production certification."
    claimRefs: [CE001, CE003, CE016]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Omni solution, Measurable benefit, Limitation]
    rows:
      - [Answer a recurring business question, "Ask data team or build a one-off query", "AI chat grounded in the semantic model", "Faster self-service is the stated goal", "No public benchmark for time-to-answer or correctness"]
      - [Define a trusted metric, "Reconcile competing dashboard definitions", "Central metrics, joins, and business logic", "Single governed definition can be reused", "Requires modeling and ongoing ownership"]
      - [Explore an unfamiliar dataset, "Write SQL or wait for an analyst", "Workbook, point-and-click, and formulas", "Broader user access to live data", "Setup and integration remain required"]
      - [Ship customer-facing analytics, "Build and maintain a separate embedded layer", "APIs and embedded AI", "One platform can serve internal and external use", "Tenant isolation and deployment evidence are not public"]
      - [Monitor a live business condition, "Schedule a report and inspect it manually", "Routines and conditional notifications", "Alerts can be targeted to a condition", "No public false-positive or missed-alert rates"]
    notes: "Benefits are product claims or stated use cases, not independently measured outcomes."
    claimRefs: [CE001, CE003, CE004, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer/process, Role, Dependency, Risk or control question]
    rows:
      - [Warehouse and raw schema, "Tables, columns, relationships, constraints, and views", "Customer warehouse", "Validate supported dialects, query cost, and schema-change handling"]
      - [Governed semantic model, "Metrics, dimensions, joins, permissions, and business context", "Customer modeling and governance", "Test definition drift, fanouts, and ownership"]
      - [Workbook model, "Ad-hoc calculations and exploration that can be promoted", "User-created formulas and fields", "Test review, promotion, and rollback controls"]
      - [Agent coordinator, "Plans actions, selects tools, runs queries, evaluates results", "External LLMs and Omni tools", "Measure hallucination, tool errors, latency, and safe failure"]
      - [SQL execution and result interpretation, "Translates semantic queries to SQL and summarizes results", "Warehouse connectivity and query engine", "Verify generated SQL, cost controls, and traceability"]
      - [External agent surface, "MCP server and APIs expose governed analytics", "MCP clients, API keys, and integrations", "Test authentication, authorization, rate limits, and deprecation policy"]
    notes: "Architecture layers combine Omni's official description with the public MCP protocol and partner implementation material; undocumented internals are intentionally left as diligence questions."
    claimRefs: [CE005, CE006, CE007, CE013]
