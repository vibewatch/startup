      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: "A complete executive and board roster, leadership-change history, succession plans, cap table, and investor-control rights."
      whyItMatters: "Founder dependence and financing control terms affect execution resilience, governance quality, and downside protection."
      diligencePath: "Obtain board minutes and committee charters, the current cap table, investor-rights summary, executive employment terms, and succession plan."
