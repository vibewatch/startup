  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: scale
      missingEvidence: "Absolute revenue and ARR, active-customer count, current headcount, retention, concentration, gross margin, burn, and runway."
      whyItMatters: "Without denominators and audited financial evidence, the private valuation and growth claim cannot be assessed for durability or capital efficiency."
      diligencePath: "Request audited statements, monthly management accounts, an ARR bridge and definition, customer cohorts, concentration schedules, payroll census, and cash-runway plan under NDA."
