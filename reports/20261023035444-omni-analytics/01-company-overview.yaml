company:
  name: Omni Analytics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Omni Analytics is a San Francisco-based Series C analytics company built around a governed
    semantic model for BI and AI workflows. Its April 2026 financing established a $1.5 billion
    private valuation, but absolute revenue, customer count, headcount, board composition, and
    financing-control terms remain material diligence gaps.
sections:
  - id: identity-product-and-leadership
    title: Identity, product, and founder-market fit
    body: >-
      Omni was founded in 2022 by a team reported to include Colin Zima, Christopher Merrick,
      and Jamie Davidson, all with Looker backgrounds. Current sources identify Zima as CEO and
      place the company in San Francisco. The product proposition is a governed semantic model
      that stores business definitions, relationships, and permissions, then applies them across
      dashboards, workbooks, spreadsheets, SQL, and AI queries. Omni says this model also
      governs external-agent access through its MCP server. That continuity between founder
      experience and product architecture is credible founder-market fit, but it is not proof of
      execution durability. The assigned evidence does not disclose a complete executive roster,
      board composition, succession plan, or independent assessment of AI accuracy and security.
    claimRefs: [CO001, CO002, CO003, CO004, CO014]
    tableRefs: [TO001, TO002]
  - id: capital-stage-and-scale
    title: Capitalization, stage, and scale signals
    body: >-
      Omni announced a $120 million Series C on April 23, 2026 at a $1.5 billion valuation. The
      transaction was led by ICONIQ, with Theory Ventures, First Round Capital, Redpoint
      Ventures, and GV participating, and included a $30 million employee tender offer. The
      announcement described a step-up from a $650 million valuation in March 2025 and claimed
      4x year-over-year revenue growth. A current company-authored job listing says total capital
      raised is $217 million, but funding raised is not cash available and the public evidence
      provides no financing ledger, debt schedule, burn, or runway. Ramp reports a 6% adoption
      rate among organizations in its Business Intelligence vendor sample, up two percentage
      points year over year; that denominator is Ramp's measured vendor population, not Omni's
      customer count.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: milestones-risks-and-diligence
    title: Milestones, counter-signals, and diligence priorities
    body: >-
      The evidence traces a founder transition from Looker, Omni's 2022 founding, a reported
      2023 launch from stealth, a March 2025 valuation marker, the reported October 2025 Explo
      acquisition, and the April 2026 Series C. Current hiring and adoption observations extend
      the timeline without implying audited scale. Counter-signals come mostly from competitors
      or comparison platforms: Astrato highlights Omni's limited G2 review base as an enterprise
      procurement concern, Knowi says pricing is unpublished and sales-led, and RFP.wiki flags
      opaque pricing while ranking Omni seventh in its agentic-analytics comparison. Those are
      evaluation signals, not independent benchmarks of product quality. The assigned pool also
      does not establish whether material legal, regulatory, outage, or security incidents exist;
      absence from this bounded evidence set is not evidence of absence.
    claimRefs: [CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
