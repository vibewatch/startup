evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: >-
      Absolute revenue and ARR, active-customer count, current headcount, retention, concentration, gross margin, burn,
      and runway.
    whyItMatters: >-
      Without denominators and audited financial evidence, the private valuation and growth claim cannot be assessed for
      durability or capital efficiency.
    diligencePath: >-
      Request audited statements, monthly management accounts, an ARR bridge and definition, customer cohorts,
      concentration schedules, payroll census, and cash-runway plan under NDA.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A complete executive and board roster, leadership-change history, succession plans, cap table, and
      investor-control rights.
    whyItMatters: >-
      Founder dependence and financing control terms affect execution resilience, governance quality, and downside
      protection.
    diligencePath: >-
      Obtain board minutes and committee charters, the current cap table, investor-rights summary, executive employment
      terms, and succession plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: Independent legal, regulatory, outage, breach, security-control, and incident-history evidence.
    whyItMatters: >-
      The bounded assigned pool does not establish incident status, and absence of a retained incident record is not
      proof of absence.
    diligencePath: >-
      Run counsel-led litigation and regulator checks, inspect trust-center attestations and incident logs, and obtain
      customer security questionnaires.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: Primary Explo acquisition documents and an independently verified product-launch chronology.
    whyItMatters: Secondary competitor coverage may frame integration timing selectively and does not disclose transaction terms.
    diligencePath: >-
      Request the Explo purchase agreement, integration roadmap, customer-migration metrics, and dated product release
      archive.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Omni-specific ARR, customer count, qualified pipeline, conversion, retention, and contract-value data by segment.
    whyItMatters: Without these denominators, category budget intent cannot support a dollar SAM or SOM.
    diligencePath: >-
      Request cohort-level revenue, pipeline, renewal, pricing, and win-loss data segmented by internal BI, embedded,
      and AI use cases.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Published or diligence-accessible price cards and implementation economics by user, query, tenant, and embedded
      workload.
    whyItMatters: Custom pricing and deployment cost determine buyer payback and the portion of category spend Omni can capture.
    diligencePath: >-
      Obtain representative quotes, discount policy, implementation hours, and gross-margin assumptions from customer
      references and management.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: adoption
    missingEvidence: >-
      A transparent denominator and methodology reconciling Ramp's vendor-panel adoption percentages with Omni's
      customer disclosures.
    whyItMatters: The 6% and 5% figures are directional and cannot be treated as market share without panel construction details.
    diligencePath: Request Ramp methodology and reconcile it to Omni's active-account definition and enterprise segmentation.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized prices, contract minimums, discounting, and implementation costs for Omni and the principal
      alternatives.
    whyItMatters: >-
      Price and deployment economics determine whether Omni's multi-surface capability creates value or loses to bundled
