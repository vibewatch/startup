    whyItMatters: >-
      Feature descriptions do not show whether Omni lowers operating cost or improves outcomes against incumbent and
      specialist platforms.
    diligencePath: >-
      Run a controlled proof of concept with matched data, representative workloads, and pre-registered accuracy and
