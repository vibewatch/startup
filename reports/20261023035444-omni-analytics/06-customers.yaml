      - [AI-enabled workflows, Data or AI leadership, Analysts executives and operations teams, Chat routines Slack and external agents, Named AI workflow references, Extends usage beyond dashboards, Repeat-use and accuracy denominators undisclosed]
      - [Implementation partners, Customer data leadership, Analytics engineers and administrators, Migration modeling and dashboard delivery, phData client migration account, Can accelerate adoption and services delivery, Partner-sourced bookings and dependency undisclosed]
    notes: Segments synthesize assigned official, partner, practitioner, and third-party evidence; they are not disclosed revenue bands or an exhaustive customer taxonomy.
    claimRefs: [CU001, CU002, CU003, CU005, CU009]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Period, Source basis, Confidence, Implication, Missing denominator]
    rows:
      - [Business-intelligence category adoption, "6%; up 2 percentage points YoY", "October 2026", Ramp vendor data, medium, Directional external adoption momentum, Sample size and conversion to Omni customer count]
      - [Company-size adoption range, "5%-6%", "October 2026", Ramp vendor data, medium, Adoption appears present from SMB through enterprise, Organization counts and spend by cohort]
      - [Reported revenue growth, "4x YoY", "April 2026 financing coverage", Company-issued release and independent restatement, medium, Commercial demand appears strong, Revenue base ARR and customer-count denominator]
      - [BambooHR launch reach, "30,000+ people in four months; 100,000+ people later served", "April 2026", Company and independent reporting, high, Quantified production-scale external reach, Active-use definition contract value and renewal]
      - [External review footprint, "4.8/5 across 71 external ratings", "October 2026 access", AWS Marketplace aggregation of G2 reviews, medium, Substantive reference volume for a young platform, Verified-buyer mix and representativeness]
    notes: Metrics retain each source's period and denominator; revenue growth is not ARR, deployment reach is not customer count, and review volume is not retention.
    claimRefs: [CU004, CU005, CU013]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or deployment, Segment, Use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: Named deployments described in assigned sources fetched for the 2026-10-23 refresh; this is not a complete customer roster.
    rows:
      - [BambooHR, Embedded and internal analytics, Elite Analytics and broader analytics service, Production claim, "30,000+ people in four months and 100,000+ people served", No renewal contract value or active-use definition]
      - [Cribl, Internal analytics and AI, Company-wide self-service AI after migration, Production claim, Full migration reported in three months, No user count retention or commercial terms]
      - [Guitar Center, Internal analytics, BI consolidation and governed AI foundation, Production claim, Multiple BI tools reportedly consolidated, No timing quantified outcome or contract data]
      - [ActiveProspect, Embedded analytics, Customer-facing dashboards, Production claim, Rebuild reportedly completed in under two weeks, No adoption retention or monetization result]
      - [phData client, Internal analytics migration, Tableau dashboards recreated in Omni, Partner-described production work, Features replicated with claimed performance and flexibility gains, Customer unnamed and outcome unquantified]
      - [Spicy Data client, Embedded analytics, Customer-specific ROI dashboards, Practitioner-described deployment, Omni selected over Tableau and Looker, Customer unnamed and renewal effect unverified]
    notes: Partial enumeration distinguishes reported production work from logo proof; company-issued outcomes remain claims until validated through customer references.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: The plausible path runs from a governed-model entry point to broader internal, embedded, and AI usage, but public evidence stops before renewal and concentration validation.
    data:
      nodes:
        - id: entry
          label: Select entry use case
          detail: Internal BI migration or customer-facing analytics establishes the initial buyer and deployment boundary.
          touchpoints: [Data leadership, Product leadership, Implementation partner]
        - id: model
          label: Define governed metrics
          detail: Analytics engineers encode measures relationships and permissions in the shared semantic model.
          touchpoints: [Metric review, Access controls, Data-model validation]
        - id: launch
          label: Launch production analytics
          detail: Dashboards workbooks or embedded reports reach employees or external users.
          touchpoints: [Migration, Embedded rollout, User enablement]
        - id: self-service
          label: Expand self-service
          detail: Business users add point-and-click spreadsheet SQL or AI-assisted workflows.
          touchpoints: [Adoption monitoring, Training, Content governance]
        - id: ai-and-embed
          label: Extend channels
          detail: The customer adds routines Slack APIs MCP or embedded AI to reuse governed context.
          touchpoints: [Workflow expansion, Premium tier, External agents]
        - id: durability
          label: Validate durability
          detail: Renewal expansion concentration and production-conversion data determine whether usage becomes durable revenue.
          touchpoints: [NRR and GRR, Cohort expansion, Top-customer share]
    approximationNotes: This is an evidence-based mechanism map, not a measured funnel; no conversion rates or stage populations are implied.
    claimRefs: [CU002, CU011, CU012, CU014, CU016]
callouts:
  - calloutType: strength
    title: Quantified production reach
    body: BambooHR provides the clearest named scale signal, with more than 30,000 people reached in four months and more than 100,000 later served.
    claimRefs: [CU005]
  - calloutType: risk
    title: Deployment is not retention
    body: No retained source discloses NRR, GRR, churn, renewal cohorts, contract duration, or customer concentration.
    claimRefs: [CU016]
  - calloutType: recommendation
    title: Test expansion economics directly
    body: Require cohort retention, production-conversion, account concentration, and paid expansion schedules before underwriting durable growth.
    claimRefs: [CU012, CU016]
