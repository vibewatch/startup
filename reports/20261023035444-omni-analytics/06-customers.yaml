company:
  name: Omni Analytics
chapter:
  number: 6
  title: Customers
  summary: >-
    Omni has credible adoption signals across internal analytics, embedded products, and AI workflows, led by quantified BambooHR reach and several named migrations. Evidence of retention, contract durability, expansion economics, and customer concentration remains unavailable, so deployment proof should not be treated as recurring-revenue proof.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Omni addresses several related customer motions rather than one homogeneous buyer. Internal deployments sell governed analytics to data leaders and serve analysts, business teams, and executives through SQL, spreadsheets, point-and-click workflows, dashboards, and AI. Embedded deployments sell to SaaS product or data leaders, while their end customers become the users of reports and natural-language analytics. A third motion extends the same governed model into Slack, external agents, APIs, or MCP-enabled applications. This breadth may increase expansion potential because one semantic model can support multiple interfaces, but it also obscures the underlying revenue mix. Public sources do not split customers, bookings, or contract value by internal BI, embedded analytics, or AI use case, and they do not reveal whether pricing scales by creator, viewer, tenant, query, or another consumption unit.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-and-named-proof
    title: Adoption trajectory and named production proof
    body: >-
      The strongest customer evidence is deployment-specific. Omni and independent coverage report that BambooHR launched Elite Analytics to more than 30,000 people in four months and later served more than 100,000 people, a materially stronger signal than a logo alone. Company-issued material also describes a three-month Cribl migration and a Guitar Center consolidation, while Omni's product guide says ActiveProspect rebuilt customer-facing dashboards in under two weeks. Partner and practitioner accounts add implementation texture: phData describes a Tableau migration for a client, and a consultant says Omni won an embedded ROI evaluation against Tableau and Looker. Ramp provides the broadest external adoption metric, estimating 6% adoption among organizations with a business-intelligence vendor in October 2026, up two percentage points year over year. That estimate lacks a visible sample denominator and is not interchangeable with customer count, ARR, or active usage.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration risk
    body: >-
      The customer thesis is stronger on initial deployment than on durability. Omni's own surfaces describe an expansion loop from a governed model into self-service, embedded analytics, scheduled routines, and external AI workflows; named case summaries show that this path can reach customer-facing products. Yet the assigned evidence discloses no NRR, GRR, churn, renewal cohorts, contract length, account-level revenue, or top-customer share. Practitioner evidence also identifies friction that could limit expansion: a growing chart library, a fast-changing interface, and maintenance burdens from customer-specific customizations. AWS-hosted G2 reviews provide a positive 4.8/5 aggregate across 71 external ratings, but one October review says AI handled simple tasks while failing at dashboard construction. A competitor comparison raises additional procurement concerns, but it is competitor-issued rather than an independent benchmark. Investment diligence should therefore test cohort retention, paid expansion, production conversion, and concentration directly.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
