  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Omni is delivered as a direct-query business-intelligence and embedded-analytics platform. Its workflow
              begins with governed metrics and relationships, then lets business users ask natural-language questions,
              build dashboards, refine workbooks, or use SQL and spreadsheet-style formulas. The official product
              surface also lists Slack delivery, scheduled and conditional routines, APIs, and an MCP server. This
              creates a coherent path from a governed definition to an end-user answer, while preserving several
              interaction modes for technical and non-technical users. A partner implementation describes the same
              operating model as a layered system: raw database schema, governed data model, and ad-hoc workbook model.
              The practical buyer value is reduced metric disagreement and faster self-service; the diligence question
              is how much modeling and administration are required before those benefits appear in a real warehouse.
            claimRefs:
              - CE001
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE013
              - CE014
      - number: '5.2'
        title: Architecture and AI control plane
        blocks:
          - type: paragraph
            body: >-
              The strongest technical differentiator is the semantic layer as an execution boundary rather than a
              documentation layer. Omni says its AI generates semantic queries, which are translated to SQL against the
              warehouse, and that the model carries metrics, dimensions, joins, access controls, and AI-specific
              instructions. Its AI page says the coordinator plans actions, selects tools, executes queries, evaluates
              results, and can perform multi-step analysis. It also says Omni uses AWS Bedrock-hosted Claude models for
              most tasks and OpenAI models for advanced AI visualizations. These are credible product architecture
              claims, but they remain vendor descriptions: the public material does not provide independent benchmark
              results, latency distributions, evaluation datasets, or failure-rate evidence. A public MCP specification
              supports the interoperability premise, but not the security of any particular Omni deployment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE013
      - number: '5.3'
        title: Maturity, integrations, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Omni exposes a broad integration and deployment surface: the official business intelligence page
              references APIs, an MCP server, Slack and email delivery, and bi-directional dbt integration. The official
              AI material describes AI Hub, reusable prompt-set evals, branch comparisons, and row-level filters. A
              public GitHub repository for an Omni Cursor plugin documents REST API access, API-key setup, and
              operations against the semantic layer, while also marking that plugin deprecated in favor of a successor
              repository. Ramp's proprietary panel reports 6% adoption among organizations using a business-intelligence
              vendor as of October 2026, but that category-level estimate does not establish production depth or
              workload scale. Together these signals show a real developer surface and market presence, but they also
              expose dependencies on cloud warehouses, model providers, APIs, and evolving agent tooling. No public
              source establishes uptime, support response, migration duration, or a complete release and deprecation
              policy.
            claimRefs:
              - CE010
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, reliability, and implementation risks
        blocks:
          - type: paragraph
            body: >-
              Omni's control story is directionally strong: the company says row-level security and user attributes are
              enforced through the semantic layer, only necessary data is sent to external LLMs, and evals can compare
              prompt-set runs before production changes ship. However, the available evidence does not independently
              verify SOC 2, HIPAA, GDPR, incident history, or the effectiveness of those controls. A third-party product
              profile says setup and integration are required and that AI effectiveness depends on semantic-model
              quality; a partner account describes the layered operating model while noting that its partnership was
              new. An independent practitioner adds that semantic-layer projects surface unresolved ownership of metric
              definitions rather than solving that organizational problem automatically. The main product risk is
              therefore not a missing feature but implementation burden and operational dependence: customers must model
              business definitions, govern access, monitor AI behavior, and manage warehouse and model-provider changes.
              Buyers should require a live proof of concept with representative joins, permission tests, adversarial
              prompts, rollback evidence, and measured query cost before treating the platform as production-ready.
            claimRefs:
              - CE004
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent governed-semantic thesis
            body: >-
              Omni connects one semantic model to BI, workbooks, embedded analytics, and AI rather than presenting AI as
              an isolated chatbot.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: callout
            title: Control claims exceed public proof
            body: >-
              Public material describes permissions, data minimization, and evals, but does not independently establish
              reliability, security assurance, or production incident performance.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
          - type: callout
            title: Gate production adoption with a measured proof of concept
            body: >-
              Require representative semantic models, tenant and row-level permission tests, adversarial AI evaluation,
              query-cost measurement, and rollback evidence before committing to a broad deployment.
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Omni addresses several related customer motions rather than one homogeneous buyer. Internal deployments
              sell governed analytics to data leaders and serve analysts, business teams, and executives through SQL,
              spreadsheets, point-and-click workflows, dashboards, and AI. Embedded deployments sell to SaaS product or
              data leaders, while their end customers become the users of reports and natural-language analytics. A
              third motion extends the same governed model into Slack, external agents, APIs, or MCP-enabled
              applications. This breadth may increase expansion potential because one semantic model can support
              multiple interfaces, but it also obscures the underlying revenue mix. Public sources do not split
              customers, bookings, or contract value by internal BI, embedded analytics, or AI use case, and they do not
              reveal whether pricing scales by creator, viewer, tenant, query, or another consumption unit.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU009
      - number: '6.2'
        title: Adoption trajectory and named production proof
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence is deployment-specific. Omni and independent coverage report that BambooHR
              launched Elite Analytics to more than 30,000 people in four months and later served more than 100,000
              people, a materially stronger signal than a logo alone. Company-issued material also describes a
              three-month Cribl migration and a Guitar Center consolidation, while Omni's product guide says
              ActiveProspect rebuilt customer-facing dashboards in under two weeks. Partner and practitioner accounts
              add implementation texture: phData describes a Tableau migration for a client, and a consultant says Omni
              won an embedded ROI evaluation against Tableau and Looker. Ramp provides the broadest external adoption
              metric, estimating 6% adoption among organizations with a business-intelligence vendor in October 2026, up
              two percentage points year over year. That estimate lacks a visible sample denominator and is not
              interchangeable with customer count, ARR, or active usage.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The customer thesis is stronger on initial deployment than on durability. Omni's own surfaces describe an
              expansion loop from a governed model into self-service, embedded analytics, scheduled routines, and
              external AI workflows; named case summaries show that this path can reach customer-facing products. Yet
              the assigned evidence discloses no NRR, GRR, churn, renewal cohorts, contract length, account-level
              revenue, or top-customer share. Practitioner evidence also identifies friction that could limit expansion:
              a growing chart library, a fast-changing interface, and maintenance burdens from customer-specific
              customizations. AWS-hosted G2 reviews provide a positive 4.8/5 aggregate across 71 external ratings, but
              one October review says AI handled simple tasks while failing at dashboard construction. A competitor
              comparison raises additional procurement concerns, but it is competitor-issued rather than an independent
              benchmark. Investment diligence should therefore test cohort retention, paid expansion, production
              conversion, and concentration directly.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU011
              - CU012
              - CU014
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Quantified production reach
            body: >-
              BambooHR provides the clearest named scale signal, with more than 30,000 people reached in four months and
              more than 100,000 later served.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Deployment is not retention
            body: >-
              No retained source discloses NRR, GRR, churn, renewal cohorts, contract duration, or customer
              concentration.
            calloutType: risk
            claimRefs:
              - CU016
          - type: callout
            title: Test expansion economics directly
            body: >-
              Require cohort retention, production-conversion, account concentration, and paid expansion schedules
              before underwriting durable growth.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is execution complexity. Omni is expanding from governed BI into agentic AI, MCP
              integrations, scheduled routines, and embedded workflows while a third-party comparison describes an Explo
              integration as mid-integration through 2026 and notes only 64 G2 reviews. That is not proof of failure,
              but it creates a measurable deployment and product-maturity risk for enterprise buyers. A second high risk
              is platform dependency: the company describes AWS Bedrock-hosted Claude models and public hiring material
              names Snowflake, BigQuery, Redshift, AWS, Databricks, and Bedrock in the operating stack. A change in
              model access, warehouse economics, or platform terms could affect reliability, gross margin, or roadmap
              control. A third risk is AI assurance. Omni says its AI Hub can run evals and that permissions and
              row-level filters are enforced through the semantic layer, but those are product claims rather than
              independent operating evidence. Investment monitoring should therefore prioritize release quality,
              migration completion, eval pass rates, material security events, dependency concentration, and customer
              renewal evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR013
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Omni's AI features can create regulatory exposure even if the platform is generally low risk in ordinary
              business-intelligence use. The European Commission says the AI Act's transparency rules apply from August
              2026 and that the AI Office and member-state authorities become responsible for implementation and
              enforcement from 2 August 2026. The same source describes high-risk obligations including risk assessment,
              logging, documentation, human oversight, robustness, cybersecurity, and accuracy, with certain
              sensitive-use deadlines extending into 2027. Omni's public page says its AI uses external LLMs, semantic
              queries, row-level security, and result-set sharing for summarization; those mechanics make
              data-processing, disclosure, access-control, and customer-use-case scoping important diligence topics.
              NIST's framework is voluntary, so it is a useful control reference rather than a certification. The Cloud
              Security Alliance listing provides a CAIQ questionnaire context, but the retained text does not establish
              that Omni completed a certification or that controls were independently audited. No retained source
              establishes litigation, enforcement, or a material privacy incident, so those remain open questions rather
              than clean bills of health.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, security, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Omni has credible architectural mitigations but a broad operational blast radius. Its AI page says the
              semantic layer scopes topics and fields, applies user-attribute permissions and row-level filters, and
              lets customers inspect the SQL used for an AI response. It also says only necessary data is shared with
              external LLMs, distinguishing metadata from query results. These controls reduce the risk of unconstrained
              answers, but they do not show how often controls fail, how quickly incidents are contained, or whether
              customers receive complete audit trails. NIST's AI RMF emphasizes managing risks to individuals,
              organizations, and society and provides a voluntary framework for design, development, use, and
              evaluation; applying it could improve governance, but public adoption evidence is absent. The company also
              depends on several warehouses and external model infrastructure. A practical kill criterion is a material
              unauthorized data disclosure, repeated permission bypass, or sustained service degradation without a
              documented corrective-action trend. Procurement should request architecture diagrams, subprocessors,
              recovery objectives, penetration-test summaries, incident metrics, and dependency exit plans.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR012
              - CR016
      - number: '7.4'
        title: Financial, partner, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is disclosure-driven rather than a known accounting loss. The retained public job
              material reports a $1.5 billion Series C valuation and $217 million raised, while the independent
              financing report describes a $120 million round, roughly 200 employees, nearly fourfold ARR growth, and
              first-time profitability in the prior month. These figures have different issuers and publication
              contexts, so they should not be treated as a complete cash, burn, or runway statement. A third-party
              adoption page reports 6% usage among organizations with a business-intelligence vendor, but it does not
              provide the denominator or customer economics needed to infer revenue quality. The main partner and
              concentration risks are dependence on cloud/model providers and the possibility that enterprise buyers
              require more deployment history, security evidence, or pricing transparency than public materials provide.
              The thesis should be downgraded if renewal or gross-margin evidence weakens, if the embedded integration
              misses its migration milestones, if external-model or warehouse costs compress economics, or if regulatory
              obligations materially delay deployments. Until those indicators are disclosed, the appropriate stance is
              to track with targeted diligence rather than assign a precise loss probability.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break risk
            body: >-
              A material permission failure, data disclosure, or sustained service degradation would directly challenge
              Omni's governed-AI value proposition; require incident chronology, control testing, and customer
              remediation evidence before treating the risk as contained.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: callout
            title: Diligence priority
            body: >-
              Request independent security evidence, AI-eval results, recovery objectives, dependency economics, and
              embedded-integration milestones before relying on public product claims in an enterprise underwriting
              decision.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Omni is building a coherent governed analytics platform rather than a standalone
              chatbot. The company describes AI operating on a semantic layer with governed metrics, joins, permissions,
              and reusable evaluation workflows, while third-party material describes the platform as combining
              self-service analytics, embedded delivery, and AI. A reported Series C at $1.5B and the hiring record's
              reference to a $120M round indicate substantial investor support, while a low-reputation third-party
              profile reports 4x annual revenue growth. These are financing and directional operating signals rather
              than proof of operating value. The anti-thesis is equally concrete: public revenue, ARR, retention, gross
              margin, burn, and customer concentration are not established by the assigned evidence. Competitive sources
              also identify custom pricing, a small review base, and integration or maturity questions. Without a
              denominator, a valuation multiple cannot be calculated responsibly, so the investment case depends on
              diligence rather than a forced buy call.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV010
              - CV016
              - CV017
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest current price signal is a reported $120M Series C at a $1.5B valuation, alongside a separate
              company job listing that repeats the same valuation and round size. Those sources are not independent
              corroboration of a fair price: the article supplies a reported financing account, while the job listing is
              company-issued. The pool also contains a pricing benchmark that describes annual contract values from
              $15,000 for small teams to $150,000 or more for larger deployments, but it is anonymized benchmark context
              and not Omni revenue. An October 2026 public-software dataset places BI and analytics software at 3.2x
              EV/NTM revenue. That benchmark cannot be applied directly to a private financing valuation without a
              comparable NTM revenue basis, net cash or debt, growth, margins, and a public/private adjustment. Entry
              discipline should therefore require a verified latest cap table, primary round documents, preference
              stack, option-pool treatment, secondary/tender mechanics, current ARR or revenue, and a bridge from
              bookings to recognized revenue.
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenarios are decision ranges, not forecasts. The bull case requires verified sustained growth, strong
              retention, defensible gross margins, and evidence that semantic governance and embedded AI convert into
              durable expansion rather than feature parity. The base case assumes product traction continues but public
              financial disclosure remains thin, competition limits pricing power, and the reported financing mark is
              difficult to underwrite against a missing denominator. The bear case is triggered by a down round, weak
              renewals, commercialization friction, margin pressure from model or warehouse dependencies, or
              customer-facing analytics failures. The available evidence supports the direction of these sensitivities:
              Omni markets semantic-model grounding and evals, while independent and competitor material highlights
              custom pricing, limited review depth, ecosystem gaps, and the risk that semantic layers become a feature.
              Until the missing inputs are obtained, probability signals should remain qualitative and no scenario
              should be presented as a precise equity value.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV013
              - CV016
      - number: '8.4'
        title: Recommendation, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: track, with medium confidence and a stretched valuation stance at the reported $1.5B mark.
              This is not a judgment that the product is weak; it is a judgment that the price cannot be tested against
              public operating performance. A buy decision would require a verified revenue denominator, cohort
              retention, gross margin, net burn and runway, customer concentration, renewal evidence, and the exact
              Series C capitalization and preference terms. Exit readiness is also conditional: a credible path would
              require repeatable enterprise expansion, durable embedded-analytics adoption, clear AI quality and
              security controls, and enough audited or diligence-grade financial history for a strategic or
              public-market buyer to underwrite the business. Thesis-break triggers are a down round, material churn, a
              security or reliability event that weakens trust in governed analytics, inability to integrate embedded
              capabilities, or a valuation reset without corresponding operating growth.
            claimRefs:
              - CV002
              - CV003
              - CV016
              - CV017
              - CV018
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending denominator evidence
            body: >-
              The reported price is investable only after ARR or revenue, retention, margins, capitalization, and
              preference terms are independently verified.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV016
          - type: callout
            title: Downside is disclosure-sensitive
            body: >-
              Missing operating denominators make multiple compression and down-round risk impossible to size from the
              assigned public evidence.
            calloutType: risk
            claimRefs:
              - CV010
              - CV017
              - CV018
