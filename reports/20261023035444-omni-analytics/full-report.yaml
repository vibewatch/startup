      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Verified high growth, strong retention, healthy gross margin, durable embedded adoption, and clean financing
          terms
        - >-
          A premium software multiple could be supportable only against verified revenue or ARR; no numeric equity value
          is asserted
        - Low-to-medium until denominator evidence is obtained
        - Growth or retention misses, weak AI quality, or inability to monetize breadth
      - - Base
        - Product traction continues, but disclosure remains thin and competition limits pricing power
        - >-
          Track the reported $1.5B mark and require a material evidence discount until current revenue and terms are
          verified
        - Medium
        - No timely financial disclosure, flat adoption, or margin compression
      - - Bear
        - Down round, weak renewals, customer concentration, platform dependency, or embedded integration failure
        - >-
          Multiple compression and dilution can reduce investor returns; loss magnitude cannot be quantified without the
          cap table
        - Material risk
        - Down round, material churn, security/reliability event, or failed commercialization
      - - Diligence case
        - Primary financing documents and operating KPIs become available
        - Re-rate using a model-appropriate revenue or ARR multiple and explicit dilution/preference waterfall
        - Required before buy
        - Evidence remains private, inconsistent, or unaudited
    notes: >-
      Scenario ranges are qualitative because the assigned pool lacks a verified current revenue or ARR denominator and
      complete capitalization terms.
    claimRefs:
      - CV006
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV018
