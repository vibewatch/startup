      - number: '4.2'
        title: Growth is visible; unit economics are not
        blocks:
          - type: paragraph
            body: >-
              The strongest current traction evidence comes from Fortune's independent reporting: ARR nearly quadrupled
              over the preceding year, Omni reached profitability for the first time in March 2026, and BambooHR was
              serving more than 100,000 users through Omni. Ramp's October 2026 vendor data separately reports 6%
              adoption among organizations using a business-intelligence vendor, up two percentage points year over
              year. These signals indicate commercial momentum and deployment scale, but they do not reveal absolute
              ARR, GAAP revenue, recurring versus services mix, NRR, churn, customer concentration, or sales efficiency.
              One month of accounting profitability is not evidence of sustained profitability or positive free cash
              flow. Direct-query warehouse execution and reliance on external LLM providers also expose cost drivers
              whose customer pass-through and margin effects remain unknown.
