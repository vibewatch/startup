  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Omni's relevant competitive set is broader than direct semantic-layer vendors. Looker and Tableau
              represent incumbent enterprise platforms with semantic, embedded, and AI roadmaps; Power BI represents a
              broad-distribution suite; ThoughtSpot represents search- and AI-led analytics; Metabase represents a
              lower-cost open-source-to-commercial path; and Astrato is an adjacent modern analytics alternative. The
              status quo is a collection of warehouse SQL, spreadsheets, analyst-built dashboards, and internal tooling.
              Omni's own materials position one semantic model behind dashboards, embedded analytics, SQL, spreadsheets,
              conversational analytics, and MCP/API surfaces, while independent comparison material emphasizes that
              embedded buyers care about metric consistency, tenant boundaries, and AI governance rather than dashboard
              presence alone. This makes Omni's strongest wedge a governance-and-surface combination, not an unqualified
              feature lead.
            claimRefs:
