              Davidson, all with Looker backgrounds. Current sources identify Zima as CEO and place the company in San
              Francisco. The product proposition is a governed semantic model that stores business definitions,
              relationships, and permissions, then applies them across dashboards, workbooks, spreadsheets, SQL, and AI
              queries. Omni says this model also governs external-agent access through its MCP server. That continuity
              between founder experience and product architecture is credible founder-market fit, but it is not proof of
              execution durability. The assigned evidence does not disclose a complete executive roster, board
              composition, succession plan, or independent assessment of AI accuracy and security.
