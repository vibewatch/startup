  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer problem
        blocks:
          - type: paragraph
            body: >-
              The relevant market is governed, warehouse-connected analytics that lets teams define metrics once and
              reuse them across internal BI, self-service exploration, embedded customer analytics, and AI-assisted
              workflows. This boundary excludes raw data infrastructure, general-purpose LLMs, and visualization-only
              tools that do not own metric definitions or permissions. Omni's own documentation describes the product as
              combining a shared data model with SQL flexibility, while its AI material says the semantic layer defines
              metrics, dimensions, relationships, and business logic for consistent answers. The buyer problem is
              therefore not simply making charts; it is reducing metric drift and governance overhead while widening
              access to analysis. The principal substitutes are incumbent internal BI suites, specialist embedded
              analytics, a dbt-centered semantic layer paired with another BI tool, and the status quo of analyst-built
              SQL and spreadsheets.
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: Demand signals and constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public market evidence is strongest on adoption intent and budget direction, not on a company-specific
              dollar opportunity. Futurum's 1H 2026 survey of 818 decision-makers at organizations with at least $100
              million of annual revenue reports that 44.5% plan to increase semantic-layer spending within 24 months and
              14.4% plan to newly adopt, or nearly 59% directing incremental budget. The same source reports 29.3%
              citing integration complexity and 24.6% citing lack of transactional write-back as infrastructure
              barriers. Gartner separately frames universal semantic layers as critical infrastructure by 2030, while
              Deloitte reports that 66% of surveyed organizations already report productivity or efficiency gains from
              AI but only 34% are truly reimagining the business. These figures establish a widening budget pool and
              adoption rationale, but they are not additive TAM layers and do not reveal Omni's obtainable share. The
              sizing table therefore preserves multiple lenses and explicitly marks the missing denominator.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
      - number: '2.3'
        title: Buyer segmentation, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The most plausible initial buyer is a data or analytics leader in a warehouse-first organization that
              needs governed metrics but cannot make every answer dependent on a central analyst team. Data teams own
              semantic modeling, permissions, and evaluation; business subject-matter experts and executives are the
              daily users; and product or engineering teams become budget owners when analytics is embedded into a
              customer application. Omni's partner description shows this workflow in practice: SMEs, analytic
              engineers, and executives use different parts of the same model, and one client migrated Tableau
              dashboards using Snowflake and Redshift connections. Ramp's October 2026 directional data places Omni at
              6% adoption among organizations with a vendor in its Business Intelligence category, with 5% among
              enterprise companies; this is a vendor-panel adoption signal, not market share. Adoption is constrained by
              model-building discipline, integration complexity, procurement proof, custom pricing, and the risk that an
              incumbent suite or a focused semantic-layer product is already embedded in the workflow.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Valuation relevance and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              For valuation, the attractive part of the market thesis is the possibility that one governed model becomes
              infrastructure for several budgets: BI, embedded analytics, and AI governance. The risk is that this
              breadth expands the competitive set and lengthens proof requirements. Independent category evidence points
              to skills, integration, governance, and measurable ROI as the gating variables, while competitor and
              partner material identifies custom pricing, limited public deployment signal, and incumbent alternatives
              as procurement friction. Omni-specific ARR, customer count, win rate, retention, contract value, and
              serviceable geography are not established by this pool. A defensible next step is to obtain cohort-level
              pipeline and renewal data, price by use case, implementation time, and the share of qualified
              opportunities that involve embedded or AI workloads before converting category percentages into a dollar
              forecast.
            claimRefs:
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate market definition, external demand signals, and the operating roles that must
              participate in an Omni purchase. Values are retained with their population, period, and limitations;
