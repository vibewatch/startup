  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Broad monetization surfaces, opaque contract economics
        blocks:
          - type: paragraph
            body: >-
              Omni publicly presents one governed semantic model across dashboards, workbooks, spreadsheets, SQL,
              embedded analytics, and AI workflows. That breadth creates several plausible commercial surfaces: the core
              analytics platform, customer-facing embedded delivery, and AI or agent usage. It does not establish that
              each surface is separately priced or reported as a revenue stream. Omni also says customers can create
              custom pricing tiers for AI products, while competitor-authored pricing reviews describe the platform as
              sales-led rather than governed by a stable public rate card. A customer review on AWS Marketplace
              separately flags difficulty navigating credit consumption. These observations support a recurring
              enterprise-software model with expansion potential, but not an estimate of realized ACV, revenue mix,
              discounting, or AI overage economics. The distinction matters because list architecture and product
              breadth are not evidence of recognized revenue or gross profit.
