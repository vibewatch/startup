      - number: '4.3'
        title: A large round reduces financing pressure but does not establish runway
        blocks:
          - type: paragraph
            body: >-
              Omni announced a $120 million Series C at a $1.5 billion valuation in April 2026, with multiple retained
              sources reporting the same headline terms. The transaction also included a $30 million employee tender
              offer, so the headline funding amount should not be treated as cash available for operations without the
              financing documents and cash-flow statement. Public evidence does not disclose primary versus secondary
              proceeds, cash on hand, monthly burn, debt or credit facilities, project obligations, or the next-round
              trigger. The resulting verdict is positive on demand momentum and access to capital, but cautious on
              revenue quality, margin durability, and capital adequacy. Underwriting requires a data-room bridge from
              bookings to recognized revenue, cohorts and concentration, a gross-margin walk, and a fully diluted
              cash-and-obligations schedule before the financing can be translated into runway.
