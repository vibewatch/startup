      - number: '3.2'
        title: Capability, distribution, and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              The capability comparison favors Omni where a buyer wants a common governed model spanning internal BI,
              embedded product analytics, and AI workflows. Looker and Tableau have materially stronger incumbent
              distribution and ecosystem leverage, while Power BI benefits from broad enterprise adoption and data
              connectivity. ThoughtSpot is a credible AI/search alternative, and Metabase can win on transparent entry
              pricing and open-source familiarity. Public list pricing is not comparable across the retained sources:
              Metabase's G2 listing shows Open Source at $0 and Starter starting at $85 per month for five users, while
              the Omni, Looker, Tableau, Power BI, and ThoughtSpot materials do not provide directly comparable realized
              prices. The absence of comparable Omni pricing is itself a diligence gap, not evidence that Omni is
              cheaper or more expensive.
