      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Omni's potential moat is the compounding value of a semantic model reused across many interfaces, plus
              governance controls and an AI agent layer that can operate on those definitions. Its security page claims
              ISO/IEC 27001:2022 certification, annual SOC 2 Type II audits, HIPAA compliance auditing, encryption,
              isolation, and least-privilege access controls. Its hiring evidence also shows active investment in agent
              harnesses, context management, retrieval, evaluation, and post-training. Those are meaningful capability
              signals, but they remain largely company- or job-posting-issued evidence. Against that, Looker, Tableau,
              and ThoughtSpot are adding governed conversational or agentic experiences, and broad suites can bundle
              analytics into existing relationships. Ramp reports 6% usage among organizations with a BI vendor in
              October 2026, with 5% enterprise adoption; this is a directional adoption signal, not market share or
              proof of switching. The durable question is whether Omni can convert cross-surface governance into lower
              deployment friction and repeatable distribution before incumbents commoditize the same workflow.
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Competitive diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public evidence does not establish realized pricing, win rates, churn or renewal performance by
              competitor, implementation effort, migration costs, feature-level performance benchmarks, or the share of
              Omni deployments using multiple surfaces. Reviews and vendor pages describe capabilities, but they do not
              provide a controlled head-to-head benchmark or customer-verified switching-cost study. Buyers should test
              semantic-model migration effort, row-level security and tenant isolation under production load, AI
              grounding and evaluation error rates, connector and embedded latency, administrator workload, and the
              commercial cost of replacing incumbent dashboards. Omni's roadmap velocity is promising, but the same pace
              can increase execution and platform-complexity risk if customers must continuously retrain workflows.
            claimRefs:
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated architecture
            body: >-
              Omni's clearest differentiation is a governed semantic model reused across BI, embedded analytics,
              spreadsheets, SQL, and AI surfaces; this is more specific than a generic dashboard feature list.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Incumbent bundle pressure
            body: >-
              Looker, Tableau, Power BI, and ThoughtSpot are all credible alternatives with distribution, ecosystem, or
              AI advantages that can compress the value of a standalone analytics layer.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: callout
            title: Validate displacement economics
            body: >-
              A buyer or investor should require customer-level evidence on migration time, realized price, renewal,
              multi-surface adoption, and measurable AI accuracy before underwriting durable competitive advantage.
            calloutType: recommendation
            claimRefs:
