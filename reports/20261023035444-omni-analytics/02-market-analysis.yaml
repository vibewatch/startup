artifact: market-analysis
slug: omni-analytics
runDate: 2026-10-23
company:
  name: Omni Analytics
chapter:
  number: 2
  title: Market Analysis
  summary: Omni participates in a governed analytics and semantic-layer market whose demand is being pulled forward by AI trust, embedded analytics, and self-service adoption. Public evidence supports strong category momentum and clear buyer segments, but not a defensible dollar TAM/SAM/SOM for Omni; pricing, customer penetration, and serviceable share remain diligence gaps.
sections:
  - id: market-boundary
    title: Market boundary and buyer problem
    body: >-
      The relevant market is governed, warehouse-connected analytics that lets teams define
      metrics once and reuse them across internal BI, self-service exploration, embedded
      customer analytics, and AI-assisted workflows. This boundary excludes raw data
      infrastructure, general-purpose LLMs, and visualization-only tools that do not own
      metric definitions or permissions. Omni's own documentation describes the product as
      combining a shared data model with SQL flexibility, while its AI material says the
      semantic layer defines metrics, dimensions, relationships, and business logic for
      consistent answers. The buyer problem is therefore not simply making charts; it is
      reducing metric drift and governance overhead while widening access to analysis.
      The principal substitutes are incumbent internal BI suites, specialist embedded
      analytics, a dbt-centered semantic layer paired with another BI tool, and the status
      quo of analyst-built SQL and spreadsheets.
    claimRefs: [CM001, CM002, CM004]
    tableRefs: [TM001]
  - id: demand-and-sizing
    title: Demand signals and constrained sizing
    body: >-
      Public market evidence is strongest on adoption intent and budget direction, not on a
      company-specific dollar opportunity. Futurum's 1H 2026 survey of 818 decision-makers
      at organizations with at least $100 million of annual revenue reports that 44.5% plan
      to increase semantic-layer spending within 24 months and 14.4% plan to newly adopt,
      or nearly 59% directing incremental budget. The same source reports 29.3% citing
      integration complexity and 24.6% citing lack of transactional write-back as
      infrastructure barriers. Gartner separately frames universal semantic layers as
      critical infrastructure by 2030, while Deloitte reports that 66% of surveyed
      organizations already report productivity or efficiency gains from AI but only 34%
      are truly reimagining the business. These figures establish a widening budget pool
      and adoption rationale, but they are not additive TAM layers and do not reveal
      Omni's obtainable share. The sizing table therefore preserves multiple lenses and
      explicitly marks the missing denominator.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: segments-and-adoption
    title: Buyer segmentation, adoption path, and constraints
    body: >-
      The most plausible initial buyer is a data or analytics leader in a warehouse-first
      organization that needs governed metrics but cannot make every answer dependent on a
      central analyst team. Data teams own semantic modeling, permissions, and evaluation;
      business subject-matter experts and executives are the daily users; and product or
      engineering teams become budget owners when analytics is embedded into a customer
      application. Omni's partner description shows this workflow in practice: SMEs,
      analytic engineers, and executives use different parts of the same model, and one
      client migrated Tableau dashboards using Snowflake and Redshift connections. Ramp's
      October 2026 directional data places Omni at 6% adoption among organizations with a
      vendor in its Business Intelligence category, with 5% among enterprise companies;
      this is a vendor-panel adoption signal, not market share. Adoption is constrained by
      model-building discipline, integration complexity, procurement proof, custom pricing,
      and the risk that an incumbent suite or a focused semantic-layer product is already
      embedded in the workflow.
    claimRefs: [CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: diligence-boundary
    title: Valuation relevance and unresolved sizing
    body: >-
      For valuation, the attractive part of the market thesis is the possibility that one
      governed model becomes infrastructure for several budgets: BI, embedded analytics,
      and AI governance. The risk is that this breadth expands the competitive set and
      lengthens proof requirements. Independent category evidence points to skills,
      integration, governance, and measurable ROI as the gating variables, while
      competitor and partner material identifies custom pricing, limited public deployment
      signal, and incumbent alternatives as procurement friction. Omni-specific ARR,
      customer count, win rate, retention, contract value, and serviceable geography are
      not established by this pool. A defensible next step is to obtain cohort-level
      pipeline and renewal data, price by use case, implementation time, and the share of
      qualified opportunities that involve embedded or AI workloads before converting
      category percentages into a dollar forecast.
    claimRefs: [CM016, CM017]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate market definition, external demand signals, and the operating
      roles that must participate in an Omni purchase. Values are retained with their
      population, period, and limitations; unavailable figures remain null rather than
      being inferred. The sizing exhibit is intentionally a set of non-additive lenses:
      survey intent, forecast language, and directional vendor-panel adoption answer
      different questions. That distinction prevents a market narrative from turning
      broad category momentum into an unsupported Omni revenue forecast. The buyer map
      likewise distinguishes user, budget owner, and adoption trigger so that a diligence
      discussion can test who signs, who operates, and who realizes value.
    claimRefs: [CM005, CM011, CM016]
