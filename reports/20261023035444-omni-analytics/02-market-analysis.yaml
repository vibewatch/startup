        - {label: "Omni enterprise BI-panel adoption", value: 5, unit: "%", detail: "Ramp October 2026 vendor-panel measure"}
    approximationNotes: "The values are separate evidence lenses with different denominators and are not additive or proportional layers; the pyramid indicates analytical ordering only, not market magnitude."
    claimRefs: [CM005, CM006, CM007, CM008, CM012]
callouts:
