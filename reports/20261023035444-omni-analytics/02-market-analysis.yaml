      - [Semantic-layer infrastructure, "Metric definitions, joins, lineage, permissions, downstream consumption", "Data transformation platforms without consumption workflows", "Data platform or analytics engineering", "Category infrastructure lens; overlaps other segments"]
      - [Status quo and substitutes, "Analyst SQL, spreadsheets, incumbent BI, dbt plus another BI tool", "New software spend attributable to Omni", "Existing analytics and business teams", "Primary displacement and no-purchase alternative"]
    notes: "Boundary is analytical rather than a market-size estimate; categories overlap and rows are not additive."
    claimRefs: [CM001, CM002, CM004]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [Publisher, Year or period, Geography or population, Value, Methodology, Confidence, Limitation]
    rows:
