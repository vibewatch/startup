      - [The Futurum Group, "1H 2026", "Same survey population; n=818", "14.4% plan to newly adopt semantic layers", "Two-wave enterprise data analytics survey", high, "Adoption intent is not realized deployment"]
      - [The Futurum Group, "1H 2026", "Same survey population; n=818", "Nearly 59% combine increase-spend and newly-adopt responses", "44.5% plus 14.4% as reported by publisher", high, "Reported combined signal is not an additive TAM"]
      - [The Futurum Group, "1H 2026", "GenAI and agentic-AI prioritizers", "Approximately 47% production plus pilot adoption", "Enterprise survey comparison", medium, "Subpopulation and category differ from Omni's full market"]
      - [Ramp, "October 2026", "Organizations with a BI-category vendor", "6% use Omni; 5% among enterprise companies", "Directional vendor-adoption panel", medium, "Panel denominator and absolute account count are not disclosed"]
      - [Gartner, "2026-03-11", "Data and analytics leaders; forecast horizon to 2030", "Universal semantic layers treated as critical infrastructure by 2030", "Analyst prediction", medium, "Forecast is directional and not a dollar market estimate"]
    notes: "These lenses are deliberately not converted into TAM/SAM/SOM because denominators, spend levels, overlap, and Omni serviceable share are not public."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM012]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow and trigger, Adoption constraint]
    rows:
      - [Warehouse-first enterprise analytics, "Chief data or analytics leader", "Analysts and business SMEs", "Data and analytics budget", "Standardize metrics when dashboards disagree", "Model ownership and migration proof"]
      - [Embedded SaaS analytics, "Product or platform leader", "External customer and support teams", "Product engineering budget", "Add governed dashboards or AI inside the product", "Tenant isolation, performance, and integration timing"]
      - [AI governance and agent workflows, "AI or technology leader", "Business users and AI agents", "AI transformation budget", "Ground answers in governed definitions and evaluate responses", "Integration, skills, and governance maturity"]
      - [Mid-market self-service BI, "Operations or finance leader", "Executives and functional teams", "Departmental analytics budget", "Reduce analyst queue and enable spreadsheet-like exploration", "Custom pricing and limited implementation capacity"]
      - [Data platform teams using dbt, "Analytics engineering leader", "Data modelers and downstream tool users", "Data platform budget", "Reuse centrally defined metrics across applications", "Existing dbt workflow and tool-selection inertia"]
    notes: "Roles and triggers synthesize the cited product and partner descriptions; customer-specific budget ownership and conversion rates require diligence."
    claimRefs: [CM011, CM013, CM014, CM015, CM016]
