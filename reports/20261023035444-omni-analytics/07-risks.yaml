chapter:
  number: 7
  title: Risks
  summary: Omni's principal risks are execution and assurance risks around a fast-expanding AI and embedded platform, dependency on external infrastructure and models, and a still-developing compliance evidence base. Public evidence supports concrete mitigations such as semantic governance, evals, and row-level controls, but does not establish incident history, control effectiveness, or financial resilience.
sections:
  - id: risk-ranking
    title: Ranked risk profile
    body: >-
      The highest residual risk is execution complexity. Omni is expanding from governed BI into agentic AI, MCP integrations, scheduled routines, and embedded workflows while a third-party comparison describes an Explo integration as mid-integration through 2026 and notes only 64 G2 reviews. That is not proof of failure, but it creates a measurable deployment and product-maturity risk for enterprise buyers. A second high risk is platform dependency: the company describes AWS Bedrock-hosted Claude models and public hiring material names Snowflake, BigQuery, Redshift, AWS, Databricks, and Bedrock in the operating stack. A change in model access, warehouse economics, or platform terms could affect reliability, gross margin, or roadmap control. A third risk is AI assurance. Omni says its AI Hub can run evals and that permissions and row-level filters are enforced through the semantic layer, but those are product claims rather than independent operating evidence. Investment monitoring should therefore prioritize release quality, migration completion, eval pass rates, material security events, dependency concentration, and customer renewal evidence.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Omni's AI features can create regulatory exposure even if the platform is generally low risk in ordinary business-intelligence use. The European Commission says the AI Act's transparency rules apply from August 2026 and that the AI Office and member-state authorities become responsible for implementation and enforcement from 2 August 2026. The same source describes high-risk obligations including risk assessment, logging, documentation, human oversight, robustness, cybersecurity, and accuracy, with certain sensitive-use deadlines extending into 2027. Omni's public page says its AI uses external LLMs, semantic queries, row-level security, and result-set sharing for summarization; those mechanics make data-processing, disclosure, access-control, and customer-use-case scoping important diligence topics. NIST's framework is voluntary, so it is a useful control reference rather than a certification. The Cloud Security Alliance listing provides a CAIQ questionnaire context, but the retained text does not establish that Omni completed a certification or that controls were independently audited. No retained source establishes litigation, enforcement, or a material privacy incident, so those remain open questions rather than clean bills of health.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operational-dependencies
    title: Operational, security, and dependency risk
    body: >-
      Omni has credible architectural mitigations but a broad operational blast radius. Its AI page says the semantic layer scopes topics and fields, applies user-attribute permissions and row-level filters, and lets customers inspect the SQL used for an AI response. It also says only necessary data is shared with external LLMs, distinguishing metadata from query results. These controls reduce the risk of unconstrained answers, but they do not show how often controls fail, how quickly incidents are contained, or whether customers receive complete audit trails. NIST's AI RMF emphasizes managing risks to individuals, organizations, and society and provides a voluntary framework for design, development, use, and evaluation; applying it could improve governance, but public adoption evidence is absent. The company also depends on several warehouses and external model infrastructure. A practical kill criterion is a material unauthorized data disclosure, repeated permission bypass, or sustained service degradation without a documented corrective-action trend. Procurement should request architecture diagrams, subprocessors, recovery objectives, penetration-test summaries, incident metrics, and dependency exit plans.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: thesis-breaks
    title: Financial, partner, and thesis-break triggers
    body: >-
      The financial-model risk is disclosure-driven rather than a known accounting loss. The retained public job material reports a $1.5 billion Series C valuation and $217 million raised, while the independent financing report describes a $120 million round, roughly 200 employees, nearly fourfold ARR growth, and first-time profitability in the prior month. These figures have different issuers and publication contexts, so they should not be treated as a complete cash, burn, or runway statement. A third-party adoption page reports 6% usage among organizations with a business-intelligence vendor, but it does not provide the denominator or customer economics needed to infer revenue quality. The main partner and concentration risks are dependence on cloud/model providers and the possibility that enterprise buyers require more deployment history, security evidence, or pricing transparency than public materials provide. The thesis should be downgraded if renewal or gross-margin evidence weakens, if the embedded integration misses its migration milestones, if external-model or warehouse costs compress economics, or if regulatory obligations materially delay deployments. Until those indicators are disclosed, the appropriate stance is to track with targeted diligence rather than assign a precise loss probability.
    claimRefs: [CR013, CR014, CR015, CR016]
tables:
  - id: TR001
    title: Operational and execution risk register
    columns: [Risk, Likelihood, Severity, Mitigation maturity, Residual exposure]
    rows:
      - [Platform expansion and integration complexity, high, high, developing, "Enterprise deployment timing and feature-parity evidence remain incomplete"]
      - [External model and warehouse dependency, medium, high, developing, "Provider pricing, availability, and portability are not disclosed"]
      - [AI answer quality or permission failure, medium, critical, developing, "Public controls are described; independent effectiveness evidence is absent"]
      - [Security incident or service outage, unknown, high, developing, "No retained incident-severity or recovery-history evidence"]
    notes: "Assessment synthesizes retained company, partner, independent, and regulatory sources; likelihood and residual exposure are qualitative because incident rates, control tests, and dependency concentration are not publicly quantified."
    claimRefs: [CR001, CR002, CR009, CR010, CR011]
  - id: TR002
    title: "Regulatory / legal risk register"
    columns: [Rule or issue, Jurisdiction, Status, Severity, Mitigation or diligence path, Residual exposure]
    rows:
      - [AI Act transparency and disclosure obligations, European Union, applicable from August 2026, high, "Map AI chat and generated-content disclosures to customer workflows", "Scope and customer-use-case classification unresolved"]
      - [High-risk AI controls and documentation, European Union, selected deadlines in 2027-2028, high, "Maintain risk assessment, logs, documentation, human oversight, robustness, and accuracy evidence", "Applicability depends on deployment context"]
      - [AI governance and trustworthy-AI controls, United States / global, NIST AI RMF voluntary, medium, "Use NIST AI RMF and retain control ownership and testing evidence", "No public adoption or audit evidence retained"]
      - [Cloud security control assurance, global procurement, CAIQ listing context only, medium, "Obtain completed questionnaire, certifications, penetration-test summary, and audit scope", "Listing does not establish independent certification"]
    notes: "Regulatory status is based on the retained European Commission and NIST pages; Omni-specific applicability, certifications, litigation, and enforcement require legal and security diligence."
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and assurance references retained for Omni's AI and cloud analytics deployment as of 2026-10-23"
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty, Role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Foundation models, AWS Bedrock / Claude and OpenAI, "External model providers", "Model, API, or policy change degrades quality or availability", high, "Semantic queries, evals, and ability to inspect SQL", "No portability test or provider concentration disclosed"]
      - [Cloud data warehouses, Snowflake / BigQuery / Redshift / Databricks, "Customer data platforms", "Warehouse change, cost increase, or connector failure", high, "Warehouse-native integrations and shared semantic model", "Connector performance and switching costs are unquantified"]
      - [Embedded analytics integration, Explo, "Acquired embedded capability", "Migration or feature-parity delay disrupts new deployments", high, "Migration plan and continued platform development", "Public comparison describes 2026 integration as in progress"]
      - [Security and compliance assurance, customers and auditors, "Procurement and control gatekeepers", "Insufficient evidence delays or blocks enterprise deals", medium, "CAIQ context, permissions, row-level filters, and AI Hub evals", "Independent audit scope and incident history are not public"]
    notes: "Dependencies and mitigations are drawn from company disclosures, a public job listing, an independent financing report, a competitor comparison, and CSA; counterparty concentration and contractual protections are not disclosed."
    claimRefs: [CR002, CR003, CR009, CR012, CR016]
