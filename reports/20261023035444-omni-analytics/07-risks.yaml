        - label: Security incident
          values: [unknown, high, developing, high]
        - label: Commercial durability
          values: [unknown, high, developing, high]
    approximationNotes: "Qualitative ratings reflect the retained public evidence and explicitly preserve unknown likelihood where no incident or retention baseline was found."
    claimRefs: [CR001, CR005, CR009, CR013]
callouts:
  - calloutType: risk
    title: Primary thesis-break risk
    body: "A material permission failure, data disclosure, or sustained service degradation would directly challenge Omni's governed-AI value proposition; require incident chronology, control testing, and customer remediation evidence before treating the risk as contained."
    claimRefs: [CR009, CR010, CR011]
  - calloutType: recommendation
    title: Diligence priority
    body: "Request independent security evidence, AI-eval results, recovery objectives, dependency economics, and embedded-integration milestones before relying on public product claims in an enterprise underwriting decision."
    claimRefs: [CR003, CR007, CR012, CR016]
