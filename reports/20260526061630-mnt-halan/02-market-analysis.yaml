    - Apply via mobile app or loan officer visit; purpose-built products for women entrepreneurs in Pakistan
    - Business income; DFI-backed financial-inclusion mandate
    - Business funding need; access to Shariah-compliant finance
  notes: Each segment has a different competitive dynamic. Consumer BNPL overlaps with Tabby and Tamara in GCC; payroll advances overlap with Khazna in Egypt; SME lending overlaps with Fawry's growing loan book. Women-entrepreneur targeting differentiates MNT-Halan for DFI fundraising.
