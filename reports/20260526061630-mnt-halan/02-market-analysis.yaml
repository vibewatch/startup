    - All informal spend excluded from market size due to lack of pricing or default data
    - Informal social network; no contractual enforcement
    - Direct displacement target; MNT-Halan wins by offering documented terms, digital disbursement, and credit-building
  notes: Market boundary excludes formal bank consumer credit, insurance, investment products, and MNT-Halan's real estate investment fund which is at early stage.
