callouts:
- title: Egypt microfinance market understatement risk
  calloutType: risk
  body: >-
    The implied $2.8B Egypt microfinance outstanding is derived from a single company-claimed share figure.
    If MNT-Halan's actual share is lower, or if the market has grown significantly since the disclosure,
    the true SAM could be materially larger — which would be positive for growth but harder to defend
    against new entrants. Conversely, if the market is smaller, penetration is near saturation.
  claimRefs:
  - CM010
  - CM011
  - CM036

- title: Egypt regulatory tightening is the near-term market risk that matters most
  calloutType: risk
  body: >-
    Public debate about consumer-finance bubble risk in Egypt emerged explicitly in May 2026. Any policy
    response — whether minimum capital requirements, mandatory iScore checks, or lending caps — would
    directly affect MNT-Halan's loan-book growth rate. This is the single market-level constraint most
    likely to move from theoretical to operational risk within the 2026 diligence window.
  claimRefs:
  - CM037
  - CM038
  - CM039

- title: Multi-market diversification offsets Egypt concentration but introduces FX complexity
  calloutType: insight
  body: >-
    Turkey (40% of group revenue), Pakistan, and UAE together provide geographic diversification against
    Egypt macro risk. However, all four currencies have experienced devaluation against the dollar since
    2021, meaning dollar-denominated valuation metrics could misrepresent local-currency performance.
    The Turkey 40% revenue share is disproportionately large relative to Turkey's 37.5% of the stated
    group book, suggesting higher Turkey revenue yield or different product mix.
  claimRefs:
  - CM021
  - CM033
  - CM034

