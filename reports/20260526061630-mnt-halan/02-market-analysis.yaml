        (~$2.8B implied), Turkey micro-leasing/SME (~$750M implied from Tam Finans share), Pakistan greenfield
        (household debt at 3–4% of $370B GDP but largely informal), UAE/GCC underserved consumer segment.
        Proxied from disclosed market shares and macro data; not a third-party analyst estimate.
