figures:
- id: FM001
  type: pyramid
  title: Market sizing lens — TAM/SAM/SOM
  summary: >-
    Three-layer sizing pyramid using bottom-up proxies from publicly available market-share and portfolio data.
    TAM represents the broader MENA non-bank consumer and SME lending addressable opportunity across
    underbanked populations. SAM reflects MNT-Halan's active four-market footprint. SOM is anchored by
    current portfolio and the CEO's publicly stated 2026 target.
  approximationNotes: >-
    TAM is an order-of-magnitude estimate using GSMA regional scale, comparable-company proxy (Tabby $10B+ annualized
    volume), and the implied Egypt segment ($2.8B) plus Turkey ($750M), Pakistan (significant headroom from 3–4% debt/GDP),
    and GCC; no single analyst report provides a definitive figure. SAM uses four-market proxies. SOM is
    anchored to CEO-disclosed figures. Do not treat any layer as an audited market research estimate.
  claimRefs:
  - CM001
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM019
  data:
    items:
    - id: tam
      label: TAM — MENA non-bank underbanked lending
      value: '>$20B+'
      description: >-
        Estimated total non-bank consumer and SME credit available to unbanked/underbanked across MENA; includes
        Egypt, Turkey, Pakistan, GCC, and adjacent North Africa markets. No single audited figure; order-of-magnitude
        proxy derived from GSMA's 308M mobile internet users and regional GDP share. Egypt segment alone implied
        at ~$2.8B formal microfinance; total consumer credit market much larger.
