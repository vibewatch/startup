    - End-user of electronics, furniture, vehicle
    - Consumer via installment schedule over 6–36 months
    - In-store or in-app BNPL, instant credit check, purchase approved at point of sale
    - Consumer income; no down payment in MNT-Halan model per app listing
    - Desire for specific consumer item without upfront cash; promotional vendor partnerships
  - - Underserved migrant worker or low-income resident (UAE/GCC)
