companyProfile:
  summary: "MNT-Halan is an Egyptian lending-led financial super app that combines nano, micro, SME, payroll, and consumer credit with wallet, card, BNPL, commerce, and investment-adjacent products for underserved users. The company was co-founded by Mounir Nakhla and Ahmed Mohsen, grew from an Egyptian ride-hailing concept into a fintech platform, crossed the unicorn threshold in 2023, and expanded into Pakistan, Turkey, and the UAE by 2024. Public sources support meaningful operating scale, multi-market ambition, and continued backing from IFC and repeat institutional investors, but they do not yet provide audited consolidated disclosure on revenue quality, credit performance, or capital-stack detail."
