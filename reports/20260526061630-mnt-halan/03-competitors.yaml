callouts:
- calloutType: insight
  title: The field is defined by multiple buyer jobs, not one fintech category
  body: MNT-Halan competes whenever a user wants credit, wage access, digital payments, BNPL checkout, or wallet convenience. That is why direct and adjacent rivals both matter.
  claimRefs:
  - CP001
  - CP013
  - CP021
  - CP023
- calloutType: risk
  title: Fawry’s transparency and Paymob’s lighter model both pressure MNT-Halan differently
  body: Fawry proves scale and profitability in public, while Paymob shows a less capital-intensive route through merchant rails. Those are distinct but credible competitive threats.
  claimRefs:
  - CP005
  - CP006
  - CP011
  - CP039
- calloutType: recommendation
  title: Treat underwriting and funding access as the core moat hypothesis to test
  body: Feature breadth is increasingly commoditized. The real diligence question is whether MNT-Halan can keep underwriting underserved borrowers profitably and funding that book cheaply.
