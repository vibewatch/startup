- id: direct-and-adjacent-peer-profiles
  title: Direct and adjacent peer profiles show different strategic shapes, not one perfect mirror rival
  body: 'The public record shows that no single rival mirrors MNT-Halan exactly, but several competitors attack important pieces of the stack. Fawry is the strongest domestic benchmark on public evidence: its 1Q2026 filing showed EGP 2.41 billion of quarterly revenue, a gross loan portfolio above EGP 6.18 billion, and diversification across payments, financial services, and supply-chain products. Paymob is lighter on balance-sheet credit but powerful on merchant distribution, serving more than 350,000 merchants across five MENA markets and offering 50-plus payment methods. Khazna is the most relevant underserved-credit overlap because it is already profitable on core credit, has more than 500,000 users, and is trying to secure a digital-banking license that would lower its funding cost. Regionally, Tabby and Tamara prove that installment-led platforms can scale to tens of millions of users and tens of thousands of merchants, while OPay, Kuda, and M-PESA illustrate how consumers increasingly
    expect a wallet to bundle payments, savings, and credit. That means MNT-Halan must defend several flanks at once instead of winning a simple one-versus-one product battle.'
