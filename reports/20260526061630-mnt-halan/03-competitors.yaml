- id: moat-durability-and-adverse-evidence
  title: Moat durability depends on underwriting and funding access, while adverse evidence points to regulatory and commoditization risk
  body: 'The evidence does not support a durable moat based on feature breadth alone. Payments, installment checkout, wallets, and even broad app menus are now common across MENA fintechs. MNT-Halan’s more defensible edge looks narrower and deeper: local lending licenses, experience underwriting underserved borrowers, and access to debt or institutional capital that can keep a loan book growing. That is also where the adverse evidence bites hardest. Fawry already shows stronger public profitability and transparency. Paymob operates a less capital-intensive merchant model. Khazna is trying to secure cheaper deposit-based funding. Tabby and Tamara already have the merchant and financing scale to dominate pure checkout credit. Most importantly, Egypt’s 2026 debate over consumer-finance expansion shows that the regulatory environment could tighten for all non-bank lenders if credit standards or borrower stress become a policy concern. The chapter verdict is therefore balanced: MNT-Halan remains
    strategically differentiated, but its moat is most credible where credit discipline and funding meet, not where the product can be copied by any well-funded payments or BNPL app.'
