company:
  name: MNT-Halan
chapter:
  number: 3
  title: Competitors
  summary: 'MNT-Halan competes across a wider field than the label “Egyptian fintech” suggests: Fawry and Paymob pressure payments and merchant rails, Khazna overlaps in underserved credit, and Tabby, Tamara, OPay, Kuda, and M-PESA show how fast adjacent super-app and BNPL models can scale. The evidence suggests MNT-Halan’s most defensible moat is not feature breadth alone but the combination of licensed lending, underwriting, and access to funding for balance-sheet credit.'
sections:
- id: landscape-and-competitive-boundaries
  title: Landscape, competitor classes, and why the arena is broader than Egypt-only fintech
  body: 'MNT-Halan no longer competes in a single, tidy bucket. The company still faces the Egypt-centric overlap that TechCrunch flagged in 2023, especially with Khazna and Paymob, but its public scale and regional expansion have widened the arena. Fawry is the clearest incumbent-style rival because it already combines payments, consumer-facing rails, financial services, and public profitability at national scale. Paymob is different: it is stronger on merchant acceptance and less exposed to credit risk, which makes it dangerous even without matching MNT-Halan’s loan-book model. Khazna sits closer to the company’s underserved-credit thesis because it targets the same low- and middle-income users through payroll-linked and unsecured lending. Beyond those direct peers, MNT-Halan now runs into regional super-app and BNPL leaders such as Tabby and Tamara, plus wallet and digital-bank substitutes like OPay, Kuda, and M-PESA. The most important implication is that competitive pressure comes from
    multiple buyer jobs at once: borrowing, paying, receiving wages, checking out with installments, and keeping money inside a single app.'
