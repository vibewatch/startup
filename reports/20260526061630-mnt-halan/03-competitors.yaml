  - Key limitation versus MNT-Halan
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant direct, adjacent, substitute, and status-quo alternatives visible in the 2025-2026 public source pack, not every MENA fintech.
  rows:
  - - Fawry
    - Direct incumbent-style rival
    - EGP 2.41bn 1Q2026 revenue; EGP 6.18bn gross loan portfolio; 54.1m users
    - Mass retail users, merchants, MSMEs
    - Dense service-point network and public profitability
    - Less clearly credit-led for underbanked users than MNT-Halan
  - - Paymob
    - Direct acceptance / merchant-rules rival
    - 350k+ merchants; 50+ payment methods; $90m+ raised
    - SMBs, enterprise merchants, platforms
    - Merchant acceptance, embedded finance, omnichannel checkout
    - Less balance-sheet credit depth than MNT-Halan
  - - Khazna
    - Direct underserved-credit rival
    - 500k+ users; $63m+ funding; break-even on core credit
    - Low- and middle-income workers, payroll users, gig workers
    - Payroll-linked and unsecured lending to underserved users
    - Smaller public scale than MNT-Halan and still seeking cheaper funding base
  - - Tabby
    - Regional adjacent BNPL rival
    - 15m customers; 40k brands; $3.3bn valuation
    - Retail shoppers and merchants in GCC
    - Regional checkout scale and broader financial-services roadmap
    - Primarily BNPL-led rather than full underbanked lending stack
  - - Tamara
    - Regional adjacent BNPL rival
    - 20m+ customers; 87k+ merchants; $2.4bn facility
    - Retail shoppers and merchants in Gulf markets
    - No-late-fee BNPL with large merchant base
    - Geographic concentration is more GCC than Egypt-centered
  - - OPay
    - Adjacent wallet / super-app substitute
    - Large app-based payments platform with cards, wealth, and transfers
    - Consumers and small merchants
    - Broad consumer wallet scope and incentives
    - Public Egypt-specific scale is less transparent
  - - Kuda
    - Adjacent digital-bank substitute
    - Digital bank with transfers, savings, investments, loans, payroll, and business APIs
    - Consumers and businesses needing a digital bank
    - Integrated bank-like UX with business tooling
    - No obvious Egypt consumer-lending footprint
  - - M-PESA / mobile-money status quo
    - Substitute / benchmark model
    - Mobile-money rail with savings, loans, and merchant payments
    - Consumers and merchants comfortable with wallet rails
    - Proof that payments-plus-credit bundles can become default behavior
    - Not a direct Egypt consumer-lender today
  notes: Rows compare public positioning and scale signals, not a perfect apples-to-apples financial model. Private-company metrics remain incomplete for several rivals.
