- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk theme
  - Evidence
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Licensed underbanked lending
    - MNT-Halan has multi-category lending plus wallet licenses
    - High opportunity
    - Licenses and underwriting are harder to copy than app features
    - Verify capital adequacy and loss rates by product
  - - Payments commoditization
    - Fawry and Paymob are already scaled on payment rails
    - High risk
    - If payments are the entry point, incumbents already own many rails
    - Measure retention and monetization from payment-only users
  - - BNPL regional scale disadvantage
    - Tabby and Tamara operate at multi-country merchant and financing scale
    - Medium-high risk
    - Regional merchant networks could outcompete MNT-Halan in checkout credit
    - Quantify merchant acquisition cost and approval rates outside Egypt
  - - Funding-cost compression by rivals
    - Khazna is pursuing a digital-bank license; Fawry is already public
    - Medium risk
    - Lower-cost funding could narrow MNT-Halan’s credit edge
    - Track cost of capital, deposit access, and securitization spreads by competitor
  - - Consumer-finance regulation
    - Egyptian bankers and regulators are debating tighter oversight of non-bank lending
    - High risk
    - Sector rules could directly hit growth and underwriting flexibility
    - Stress-test growth under tighter credit checks and funding rules
  - - Multi-homing and low app lock-in
    - Wallets and BNPL tools are easy to adopt in parallel
    - Medium risk
    - Low switching costs compress CAC payback and brand durability
    - Request active multi-app usage, repeat borrowing, and merchant exclusivity data
  notes: Severity is a synthesis of the source pack, not a scored model. The highest-risk rows are the ones where public data show strong rival scale plus policy sensitivity.
