  - type: missing-source
    severity: material
    topic: regulatory-tightening-risk
    missingEvidence: >-
      The May 2026 MEObserver article documents regulatory concern from CIB's CEO but provides no official FRA or CBE
      policy announcement or formal consultation on non-bank lending standards. No company-specific regulatory
      correspondence is in the public record.
    whyItMatters: >-
      If Egypt introduces mandatory iScore checking, lending caps, or minimum provisioning for non-bank consumer
      lenders, MNT-Halan's loan-book growth plan (targeting $5 billion by end 2026) would face a material headwind that
      is not currently priced into management guidance.
    diligencePath: >-
      Request FRA consultation pipeline, any formal correspondence between MNT-Halan and CBE/FRA on credit standards,
      and management's scenario analysis for lending under tighter regulation.
