      - QM015
      - QM020
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: moderate
    topic: digital-distribution-cac
    missingEvidence: >-
      No public source discloses MNT-Halan's customer acquisition cost (CAC) for mobile-first versus branch-based
      borrower onboarding. Without CAC data, it is impossible to independently verify the claimed cost advantage of
      digital distribution over traditional branch-only microfinance.
    whyItMatters: >-
      MNT-Halan's growth thesis depends heavily on mobile-first distribution being structurally cheaper than
      branch-based models. If digital CAC is not materially lower than branch CAC, the scalability argument for the
      market expansion strategy weakens.
    diligencePath: >-
      Request CAC breakdown by channel (digital app vs loan officer vs branch) and cohort vintage analysis showing
      payback period by acquisition channel.
    relatedQuestionRefs:
