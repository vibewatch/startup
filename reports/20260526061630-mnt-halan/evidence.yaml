      - QO021
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: egypt-market-size
    missingEvidence: >-
      No independent analyst report provides an audited total market size for Egypt's non-bank consumer and SME lending
      to unbanked and underbanked populations. The $2.8 billion implied microfinance estimate is a bottom-up proxy from
      a single company-claimed share figure with no independent validation.
    whyItMatters: >-
      The TAM/SAM framing depends on a single share fraction from MNT-Halan's own disclosures. If the microfinance
      segment has grown substantially, or if MNT-Halan's share has shifted, the sizing basis changes materially. Without
      an independent market report, TAM confidence remains medium-low.
    diligencePath: >-
      Request FRA or CBE aggregate statistics on total outstanding consumer microfinance and non-bank SME credit in
      Egypt; cross-reference with World Bank FINDEX or IMF Article IV data for Egypt credit penetration.
    relatedQuestionRefs:
      - QM001
      - QM014
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: turkey-market-size
    missingEvidence: >-
      Tam Finans's 40% market share refers to customers served, not portfolio balance. No independent source confirms
      the Turkish micro-leasing total portfolio outstanding, so the implied $750 million figure is approximate and could
      vary by 50%+ depending on loan size distribution.
    whyItMatters: >-
      Turkey accounts for 40% of MNT-Halan's group revenue. Understanding the actual addressable market size in Turkey
      is material to evaluating whether MNT-Halan is already approaching market saturation in its Turkish segment.
    diligencePath: >-
      Request Turkish financial regulator (BDDK) data on total micro-leasing and SME non-bank lending outstanding;
      cross-reference with Tam Finans's pre-acquisition loan book audit.
    relatedQuestionRefs:
      - QM006
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pakistan-market-traction
    missingEvidence: >-
      MNT-Halan disclosed only early-stage Pakistan metrics (19 branches, 62,000 Advans clients at acquisition). No
      public source confirms Pakistan loan book size, current customer count, or delinquency rates as of May 2026,
