    relatedQuestionRefs:
      - QO019
      - QO026
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: independent-analyst-coverage
    missingEvidence: >-
      No independent equity research reports, rating-agency assessments of the group entity, or development-finance
      institution public project assessments contain a quantified growth or credit quality assessment for MNT-Halan as a
      whole. The IFC project disclosure (SII-46427) is public but contains only compliance and grievance information,
      not a credit or growth analysis.
    whyItMatters: >-
      Without independent analyst coverage, growth sustainability claims rest entirely on company-stated KPIs and
      press-reported executive interviews; an independent assessment would meaningfully de-risk the IPO case.
    diligencePath: >-
      Request any rating reports, board presentations, investor memos, or external consulting assessments prepared for
      the IFC, EBRD, DPI, or Chimera in connection with their investments.
