evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-current
    missingEvidence: >-
      Post-2023 equity valuation mark; no public round or secondary transaction has established a new valuation since
      the $1B+ unicorn round in January 2023, other than directional statements that valuation remains above $1B.
    whyItMatters: >-
      A 2025 or 2026 valuation is required to benchmark decacorn ambition, assess the IPO price range, and analyze
      dilution in later securitization structures.
    diligencePath: >-
      Request most recent board-approved 409A or fair-value assessment; review any convertible notes or secondary trades
      that have established a new reference price.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-board-composition
    missingEvidence: >-
      Full board composition, independent director identities, committee structure, and governance documents are not
      publicly available. Key-person risk for Mounir Nakhla is asserted but not measured against documented succession
      or board-override mechanisms.
    whyItMatters: >-
      Board structure is a foundational diligence item for the IPO scenario and for investors relying on governance as a
      risk mitigant.
    diligencePath: >-
      Request articles of association, shareholder agreements, board minutes and composition, and any governance reports
      prepared for the IFC or other development-finance investors.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: cap-table-detail
    missingEvidence: >-
      Equity ownership percentages for all investors other than Chimera Abu Dhabi (20%+) and founders are not publicly
      disclosed. The exact allocation of the 2021 and 2024 rounds across DPI, Lorax, Apis, Lunate, and GB Corp is
      unknown from public sources.
    whyItMatters: >-
      Cap table detail is necessary to assess dilution, alignment, control provisions, drag-along rights, and the
      implications of the planned IPO on existing holders.
    diligencePath: >-
      Request full capitalization table from management, including fully-diluted equity and any outstanding options,
      warrants, or convertibles.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: gcc-saudi-expansion
    missingEvidence: >-
      Saudi Arabia regulatory approval, licensing status, and timeline for MNT-Halan's entry are not confirmed through
      public sources. The company has stated Saudi Arabia as a target but no formal entry announcement or license grant
      has been publicly documented.
    whyItMatters: >-
      GCC is the stated next growth frontier; clarity on Saudi entry timeline and partner/license structure is needed to
      assess the 2026-2027 growth case.
    diligencePath: >-
      Request SAMA (Saudi Central Bank) licensing application status, Saudi Arabia partnership agreements, and internal
      GCC expansion roadmap with dates and capital commitments.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: revenue-profitability-2024-2025
    missingEvidence: >-
      The most recent disclosed revenue figure is $300M for 2022 with a 35% annual growth rate claimed; 2024 and 2025
      actual revenue, gross margin, operating profit, and net income are not publicly available.
    whyItMatters: >-
      Financial performance data is required to validate loan-book quality, cost of capital, and the credibility of
      decacorn and IPO ambitions.
    diligencePath: >-
      Request audited financial statements for 2023, 2024, and 2025 covering all four market entities on a consolidated
      basis, including NPL ratios and provision coverage.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Full management team below CEO and CTO level, including CFO identity, Chief Risk Officer, Chief Compliance
      Officer, and independent board members, is not publicly available.
    whyItMatters: >-
      Risk management, financial reporting, and compliance leadership are critical for an institution planning a public
