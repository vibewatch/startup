  - type: missing-source
    severity: moderate
    topic: currency-devaluation-impact
    missingEvidence: >-
      No public source provides a reconciliation of MNT-Halan's dollar-denominated revenue trend against local-currency
      portfolio growth across Egypt, Turkey, and Pakistan. The revenue mix (59% Egypt, 40% Turkey) is from AGBI but no
      bridge is available showing how devaluation of EGP, TRY, and PKR has affected dollar-equivalent revenue since
      2021.
    whyItMatters: >-
      All four operating currencies have devalued significantly versus the dollar since 2021. Dollar- denominated
      valuation metrics could overstate actual purchasing-power-parity performance or understate local-currency growth.
