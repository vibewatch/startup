              from an impressive narrative-backed scale story into an underwritable investment case. Audited
              consolidated financials are first. Without them, the analyst cannot verify how the credit platform
              converts loan-book growth into revenue, margin, and cash generation. Second is capital-stack detail: debt
              covenants, overcollateralization, investor protections, and any preference terms that could change
              downside economics. Third is geography-level performance data. Expansion into Turkey, Pakistan, and the
              UAE is strategically important, but investors need to know which markets are accretive, which are still
              experimental, and how much concentration remains. Finally, there is IPO readiness itself. If listing plans
              are real, board structures, governance preparation, bank engagement, and public-company reporting design
              should be visible. Until those materials exist, thesis-breakers remain straightforward: leverage without
              disclosure, growth without credit-quality proof, and expansion without evidence that diversification is
              raising earnings quality rather than just headline scale.
            claimRefs:
