  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Disclosure does not improve
        - No audited consolidated financials or risk metrics before major IPO or financing step
        - Valuation remains narrative-led and multiple support stays weak
        - Keep recommendation at track/research-more or cut fair-value range.
      - - Debt ramps faster than controls
        - Large new issuance without credit-loss transparency
        - Investors value MNT-Halan more like a leveraged credit platform
        - Increase risk discount and treat upside as conditional.
      - - Geographic diversification stalls
        - Egypt/Turkey still dominate economics while new markets remain immaterial
        - Expansion narrative stops reducing concentration risk
        - Do not pay a regional-platform premium.
      - - IPO-readiness slips
        - No visible governance, auditor, or listing milestones
        - The late-stage rerating case loses timing credibility
        - Push bull case further out or remove it.
      - - Credit quality weakens
        - Vintage losses or defaults rise materially once disclosed
        - Funding model and valuation thesis both compress
        - Re-rate toward bear case immediately.
    notes: >-
      These triggers are framed as investment-kill criteria rather than operating observations because they would
      directly change valuation support.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV035
      - CV036
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited consolidated financials
        - Revenue, EBITDA, net income, balance sheet, and cash flow for the full group
        - Turns valuation from headline-driven to underwritable
        - Request audited FY2025/FY2026 statements and audit opinion.
      - - Capital stack
        - Preference terms, debt covenants, collateral package, overcollateralization, and investor protections
        - Changes downside economics and sensitivity to stress
        - Request cap table, debt summaries, and securitization documents.
      - - Geography-level performance
        - Revenue, margin, and cost-of-risk by Egypt, Turkey, Pakistan, and UAE
        - Shows whether diversification is improving quality or just scale
        - Request management reporting and audited segment notes.
      - - Vintage loss data
        - Delinquency, charge-off, and recovery curves by product and cohort
        - Needed to stress-test a debt-funded credit platform
        - Request warehouse tapes or rating-pack credit exhibits.
      - - IPO readiness
        - Banks engaged, governance charters, board committees, reporting readiness
        - Determines whether a multi-billion rerating is timing-realistic
        - Request listing-readiness workplan and governance package.
    notes: >-
      These diligence asks are designed to close the specific gaps blocking a stronger recommendation, not to satisfy
      generic curiosity.
    claimRefs:
      - CV033
      - CV034
      - CV035
