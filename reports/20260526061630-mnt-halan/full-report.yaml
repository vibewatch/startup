        title: Landscape, competitor classes, and why the arena is broader than Egypt-only fintech
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan no longer competes in a single, tidy bucket. The company still faces the Egypt-centric overlap
              that TechCrunch flagged in 2023, especially with Khazna and Paymob, but its public scale and regional
              expansion have widened the arena. Fawry is the clearest incumbent-style rival because it already combines
              payments, consumer-facing rails, financial services, and public profitability at national scale. Paymob is
              different: it is stronger on merchant acceptance and less exposed to credit risk, which makes it dangerous
              even without matching MNT-Halan’s loan-book model. Khazna sits closer to the company’s underserved-credit
              thesis because it targets the same low- and middle-income users through payroll-linked and unsecured
              lending. Beyond those direct peers, MNT-Halan now runs into regional super-app and BNPL leaders such as
              Tabby and Tamara, plus wallet and digital-bank substitutes like OPay, Kuda, and M-PESA. The most important
              implication is that competitive pressure comes from multiple buyer jobs at once: borrowing, paying,
              receiving wages, checking out with installments, and keeping money inside a single app.
