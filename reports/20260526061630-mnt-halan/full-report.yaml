      - number: '2.3'
        title: >-
          Buyer, user, and payer segmentation: five distinct customer archetypes with different budget owners, triggers,
          and adoption paths
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan's market is not homogeneous. Five distinct buyer archetypes emerge from the source pack, each
              with a different workflow, budget owner, adoption trigger, and relationship to traditional banking. The
              first and largest is the unbanked or underbanked consumer, typically earning below the threshold for a
              bank account or credit card, living partly in the informal economy, and needing small-ticket credit for
              consumer goods, household appliances, education, medical expenses, or personal emergencies. For this
              segment, the buyer is the borrower, the payer is the borrower (with digital disbursement removing the cash
              friction), and the adoption trigger is a specific purchase need at a vendor that offers BNPL or a referral
              within a social network. MNT-Halan explicitly serves this segment through its nano loans, consumer
              microlending, and BNPL products that require no bank account and operate through more than 5,000 vendors.
              The second archetype is the micro-entrepreneur or small business owner who needs working capital,
              inventory finance, or vehicle finance to operate a productive asset — a motorcycle courier, a corner-shop
              owner, or a small manufacturer. This segment's budget owner is the business, the repayment source is
              business cash flow, and the adoption trigger is a short operational funding gap. MNT-Halan addresses this
              segment through its microfinance and SME lending products with credit limits up to EGP 5 million. The
              third archetype is the payroll or wage worker seeking a salary advance or short-term personal loan before
              payday, a segment that lends itself to employer partnerships because the repayment source is deducted from
              salary. Khazna targets this same segment in Egypt, which signals real competitive overlap. The fourth
              archetype is the aspirational consumer who wants to buy electronics, furniture, or a used vehicle on
              installment without bank credit; this buyer is active in e-commerce and physical retail channels and is
              motivated by affordability and speed of approval. In this segment, BNPL providers including Tabby and
              Tamara also compete in the GCC, and Egypt's own domestic BNPL market is served by multiple non-bank
              providers alongside MNT-Halan. The fifth archetype is the underserved migrant worker or low-income earner
              in the UAE/GCC — a substantial population in the Gulf states who may lack formal credit history in their
              host country and have historically depended on remittances and cash management. MNT-Halan's auto-loan soft
              launch for used cars in the UAE and its salary-advance partnership with Al Ansari Exchange address this
              demographic directly. The gender dimension is material: MNT-Halan has reported that 53 to 54 percent of
              its borrowers are women, making women entrepreneurs and low-income women the largest single customer group
              by count. That skew matters for regulatory positioning, for DFI attractiveness (IFC invested $40 million
              partly for the financial-inclusion mandate), and for portfolio risk characteristics. Each segment implies
              a different product surface, pricing range, distribution channel, and competitive set.
