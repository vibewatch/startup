  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, excluded spend, adjacencies, and the status-quo substitutes MNT-Halan displaces
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan's core market is non-bank consumer and SME credit extended to unbanked and underbanked
              populations in emerging markets where traditional banks either cannot or do not profitably serve
              small-ticket borrowers. In Egypt, that segment includes individuals who lack formal credit history,
              micro-entrepreneurs seeking working capital below the threshold banks consider economic, and small and
              medium businesses locked out of collateral- based lending. The company also serves adjacent demand for
              digital payments, buy-now-pay-later installment checkout, salary-linked finance, and e-commerce — but
              these surfaces amplify and support the lending core rather than replacing it. The right market boundary
              therefore separates included spend from excluded spend carefully. Included spend covers consumer
              microlending, nano loans, SME lending, payroll advances, vehicle finance, and BNPL installment credit. It
              also includes the digital wallet, card, and payment infrastructure that lowers acquisition cost, builds
              repayment discipline data, and keeps borrowers inside the ecosystem. Excluded spend is investment-grade
              corporate credit, mortgage origination, international trade finance, insurance underwriting, and the
              mass-market payments processing that Fawry and Paymob dominate through merchant-acceptance rails. Those
              products sit in the same fintech conversation but are not where MNT-Halan's loan-book economics live.
              Adjacencies that matter for valuation include the BNPL checkout market that Tabby and Tamara have proven
              can reach billions of dollars in annualized transaction volume, and the broader digital-bank substitution
              model that OPay and Kuda represent in sub-Saharan Africa. These show how a super-app lending platform can
              scale, but they compete only at the margin of MNT-Halan's current Egypt market. Status-quo substitutes are
              informal moneylenders, rotating savings clubs known as gameyyas in Egypt, pawnbrokers, unregulated
              microfinance providers, and relatives — all of which lack pricing transparency, offer no credit-history
              building, and carry social rather than contractual enforcement. MNT-Halan displaces these incumbents by
              offering documented loan terms, instant digital disbursement, and data-driven credit scoring that can
              serve first-time borrowers without collateral. The market definition also excludes MNT-Halan's Turkey
              subsidiary Tam Finans from the primary Egyptian analysis but includes it in the multi-market TAM/SAM
              framing because the Turkish micro- leasing and SME finance market adds meaningful portfolio capacity. In
              Pakistan, the market is greenfield relative to MNT-Halan's presence, with formal household credit
              remaining at 3 to 4 percent of GDP against a large informal cash economy that MNT-Halan has explicitly
              targeted as its opportunity.
