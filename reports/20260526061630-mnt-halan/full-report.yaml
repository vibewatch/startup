        title: Pricing signals are visible at the edge, but distribution and switching costs matter more than list terms
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is uneven, which is itself an important finding. MNT-Halan discloses some
              user-facing terms on its own site, including BNPL limits up to EGP 200,000 and installments up to 36
              months, while Tamara publicly emphasizes no late fees and payment plans of up to 24 months. But many
              finance-critical metrics remain hidden: realized APRs, merchant discount rates, effective take rates, and
              balance-sheet loss assumptions are mostly absent from the public record. That forces the competitive lens
              toward distribution and switching behavior. Fawry’s more than 300,000 service points, Paymob’s
              350,000-plus merchants, MNT-Halan’s branch-and-app expansion in Pakistan and the UAE, and Khazna’s
              payroll-linked presence all matter because they create repeated touchpoints that can feed new products.
              Even so, true lock-in appears mixed. It should be highest where payroll, underwriting, and branch or
              merchant data sit inside the app, and lowest where consumer payments or checkout installments can be
              layered onto existing habits without exclusive contracts. In other words, user convenience makes adoption
              easy, but embedded credit and distribution make retention harder to dislodge.
