              checkout, wallets, and even broad app menus are now common across MENA fintechs. MNT-Halan’s more
              defensible edge looks narrower and deeper: local lending licenses, experience underwriting underserved
              borrowers, and access to debt or institutional capital that can keep a loan book growing. That is also
              where the adverse evidence bites hardest. Fawry already shows stronger public profitability and
              transparency. Paymob operates a less capital-intensive merchant model. Khazna is trying to secure cheaper
