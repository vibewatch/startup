      - number: '4.3'
        title: Capital adequacy increasingly depends on debt-market execution, not only equity rounds
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan’s capital structure is the clearest differentiator in the public financial record. The company
              raised $157.5 million in 2024 with IFC and existing investors, following the 2023 round that combined more
              than $200 million of Chimera equity with $140 million of securitized debt and a path to more primary
              capital. The IFC filing independently confirms that IFC’s participation took the form of an equity
              investment into MNT Investments BV, with the project approved and invested in 2024. Since then, the
              funding mix has tilted further toward local capital markets. Public reports in 2025 show a EGP 2.5 billion
              corporate bond, a broader EGP 8 billion FRA-approved securitization programme, and a seventh securitized
              issuance worth EGP 3.4 billion. Fresh bond-market coverage adds that the May 2025 Tasaheel issuance was
              split into EGP 2 billion 12-month and EGP 500 million 36-month tranches, carried a BBB+ MERIS rating, and
              used CI Capital, KPMG Hazem Hassan, and Matouk Bassiouny as core transaction advisers. That matters
              because it looks like institutional funding infrastructure around the lending arm, not just a one-off
              headline deal. The debt window is open, but still macro-dependent; Fitch’s 2024 sovereign upgrade cited
              renewed debt-market inflows yet still described Egypt’s domestic debt interest burden as extreme, and the
              World Bank’s 2026 financing package explicitly targeted more efficient domestic debt markets and lower
              government funding costs. This pattern implies that MNT-Halan is funding loan-book growth through
              repeatable debt instruments, not only new venture rounds. That is strategically positive because it can
              lower dilution and match asset-backed lending with debt capital, but it also means capital adequacy
              increasingly depends on loan performance, investor appetite, and functioning domestic credit markets.
              Public sources support the debt-engine thesis, but they do not disclose current liquidity headroom or
              covenant stress.
