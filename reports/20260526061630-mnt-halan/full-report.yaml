      - number: '2.2'
        title: >-
          Market sizing: TAM/SAM/SOM across four geographies using bottom-up proxies, CEO targets, and disclosed market
          shares
        blocks:
          - type: paragraph
            body: >-
              No single third-party analyst report in the public source pack provides an audited TAM figure for the
              exact segment MNT-Halan serves — non-bank lending to unbanked and underbanked consumers and SMEs across
              Egypt, Turkey, Pakistan, and the UAE. The sizing analysis therefore uses multiple lenses: implied market
              size from MNT-Halan's own disclosed share, CEO-stated addressable market proxies, national macro data, and
              comparable company metrics from adjacent BNPL and super-app platforms. In Egypt, MNT-Halan has stated it
              holds more than 25 percent of the microfinance market, and its Egypt loan book stood above $700 million as
              of mid-2025. Using that share fraction, the current Egyptian microfinance outstanding implies a total
              segment size of approximately $2.8 billion — a bottom-up proxy for the SAM in MNT-Halan's primary segment.
              The company's Egypt loan book already exceeds most Egyptian banks' personal loan portfolios, which signals
              that MNT-Halan has captured an outsized share of the formal non-bank lending available to this population.
              The broader Egyptian consumer and SME credit market — including formal banking — is much larger and harder
              to bound publicly. Egypt has 36 commercial banks supervised by the Central Bank and roughly 2,500 non-bank
              financing companies, according to May 2026 media coverage of the consumer-finance debate. That supply
              fragmentation suggests demand is substantial, though credit concentration and regulatory risk are also
              elevated. In Turkey, the Tam Finans acquisition provided MNT-Halan with an entry into a segment where Tam
              Finans itself held 40 percent of the micro-leasing market as measured by customers served and had a $300
              million loan book pre-acquisition. Implying a Turkish micro-leasing addressable segment of roughly $750
              million is therefore reasonable as a lower-bound SAM for the Turkish market, though MNT-Halan now adds
              consumer credit atop the leasing foundation. In Pakistan, MNT-Halan's CEO noted that household debt-to-GDP
              sits at just 3 to 4 percent, GDP is roughly $370 billion, and the economy runs on $33 billion in daily
              cash transactions, suggesting enormous headroom if digital lending formalizes even a fraction of informal
              credit. The company's own Pakistan target — a $500 million loan book within five years — functions as a
              demand-constrained SOM estimate for that geography. In the UAE and GCC, MNT-Halan has onboarded 1.5
              million payment service users and extended loans to 220,000 customers within approximately 18 months of
              launch, with Saudi Arabia identified as the next priority given that 21 percent of Saudi adults remain
              unbanked and the Kingdom's e-payment rate already jumped from 18 to 79 percent between 2016 and 2024. At
              the group level, MNT-Halan's own stated ambition — targeting $4.5 to $5 billion in outstanding portfolio
              by end of 2026 and a $10-plus billion company within the decade — provides a management-stated SAM/SOM
              framing even if external validation of that target is not yet available. GSMA's 2025 MENA Mobile Economy
              report counted 308 million mobile internet users and noted that mobile technologies added $350 billion to
              regional GDP in 2024 at 5.7 percent of MENA GDP, which contextualizes the distribution reach but not the
              credit market size directly. The comparison data point from the BNPL segment — Tabby at $10 billion-plus
              in annualized transaction volume and $3.3 billion in valuation — shows that adjacent digital-credit
              markets in MENA can already support top-decile valuations, reinforcing that the overall digital finance
              TAM in the region is substantial even if MNT-Halan's direct microfinance segment remains smaller.
