              not support a conclusion that concentration risk has disappeared. Turkey added a meaningful acquired loan
              book, Pakistan added a licensed microfinance bank, and the UAE launch gives the group a live GCC
              experiment. Even so, AGBI’s 2025 profile still described 59% of income coming from Egypt and 40% from
