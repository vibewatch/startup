              The clearest product fact pattern is that MNT-Halan is not a single-loan app and not yet a public digital
              bank in the classic sense; it is a lending-led financial super app that keeps extending the number of
              adjacent jobs it can solve for underbanked consumers and small businesses. The homepage, LinkedIn company
              page, and multiple independent interviews all align on the same core stack: small and micro-business
              lending, consumer finance, payments, consumer commerce, and card-like wallet functionality. Within that
              stack, lending is still the anchor. Official pages expose microfinance, SME lending, nano loans, BNPL,
              payroll lending, and vehicle finance before they describe downstream wallet or commerce features. Payments
              and commerce matter because they deepen user touchpoints and create data exhaust, but the public surface
              still reads as credit-first rather than payments-first. That is important for diligence because the
              central customer job is not only “move money” but “obtain credit, spend it, repay it, and stay inside the
              same ecosystem for the next financial task.” The product breadth is real; the caveat is that packaging
              detail is still marketing-level rather than contract-level, so the app looks operationally broad but
