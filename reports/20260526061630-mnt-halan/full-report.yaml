        blocks:
          - type: paragraph
            body: >-
              MNT-Halan’s customer picture is broad, but the strongest evidence still clusters around financially
              underserved users rather than affluent prime-bank customers. Historical and current disclosures
              consistently point to small merchants, informal workers, wage earners, and retail borrowers as the core
              Egyptian base. AllBusiness explains that the earliest wedge came from motorcycle-taxi drivers, shop
              owners, and other unbanked workers; the GPCA case study adds women entrepreneurs as a major customer
              cohort; the current company page and Forbes profile update that story with multi-million user counts and
              app-download scale. Cross-border expansion extends the same pattern, but with local adaptations: Pakistan
              adds microfinance clients and planned branch growth, Turkey adds a business-heavy factoring base, and the
              UAE starts with salary-finance users tied to employers and exchange houses. What matters for underwriting
              is that the company appears to know who it serves and why those users are hard for traditional banks to
              reach. What remains weaker is the payer mix by product line and geography. Public pages do not break down
