            body: >-
              MNT-Halan’s public materials consistently describe a credit-led ecosystem rather than a pure payments or
              commerce app. The homepage and 2024 raise release together show the company monetizing business and
              consumer lending, BNPL, wallets and cards, bill payments, payroll finance, and commerce. That matters
              because the revenue bridge starts with credit and transactional activity, then broadens into product
              attach rather than the other way around. The strongest public pricing evidence is still user-facing, not
              investor-grade. MNT-Halan discloses headline terms such as BNPL limits up to EGP 200,000 and installment
              periods up to 36 months, but it does not publish realized APRs, take rates, discounting, merchant subsidy
              economics, or the share of revenue coming from lending versus payments versus commerce. The public
              evidence therefore supports the existence of multiple monetization surfaces, but not a clean
              revenue-recognition or contribution-margin split. For underwriting, the right interpretation is that
              MNT-Halan is clearly more diversified than a single-product lender, yet still too opaque for precise
              product-line forecasting without private diligence.
