      - number: '7.2'
        title: Credit quality, fraud control, and capital-markets dependence are the core operating risks
        blocks:
          - type: paragraph
            body: >-
              The more consequential downside is not a one-off launch hiccup but the interaction between loan quality,
              fraud control, and external funding. Public reporting makes clear that MNT-Halan is already a large lender
              with a group loan book measured in the hundreds of millions of dollars and a funding stack that
              increasingly leans on corporate bonds and securitizations. That can be efficient when receivables stay
              healthy, but it creates a sharper feedback loop when they do not. Halan’s own wallet terms reserve
              account-suspension rights for suspected fraud, and TechCrunch’s 2023 reporting noted that management did
              not disclose an NPL ratio even as lending remained the company’s core business. The 2025-2026 bond and
              securitization coverage strengthens the same interpretation: MNT-Halan is becoming more sophisticated in
              capital markets, but also more exposed to refinancing conditions, investor appetite, and
              portfolio-performance scrutiny. Credit stress, fraud spikes, or complaint blow-ups would therefore matter
              twice—first operationally, then financially through funding access and pricing.
