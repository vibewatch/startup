- id: mitigations-monitors-and-kill-criteria
  title: Mitigations are visible, but the public diligence package is still too thin
  body: MNT-Halan is not operating without mitigants. The public record shows formal licences, complaint
    escalation paths, cross-border approvals, and repeated access to debt markets. Those are real signs
    of institutionalisation. The problem is that the most decision-useful monitors remain private. There
    is still no public product-level NPL disclosure, no covenant package for the securitization stack,
    no regulator-correspondence file, and no complaint or freeze dashboard that would let an external
    investor test whether operational controls scale as quickly as balances do. That forces the analyst
    to focus on kill criteria rather than comfort. If loss rates widen, if market funding tightens, if
    complaints and dispute timelines deteriorate, or if regulatory correspondence turns from approvals
    to remediation demands, the downside would move fast because the credit and funding loops are tightly
    linked. The right response is therefore not to assume disaster, but to define the exact metrics and
    documents that must arrive before risk can be marked down with confidence.
  claimRefs:
