- id: geographic-diversification-vs-execution
  title: Geographic diversification helps, but it has not removed concentration or execution risk
  body: Expansion has reduced the idea that MNT-Halan is only an Egypt story, but the public evidence
    still does not support a conclusion that concentration risk has disappeared. Turkey added a meaningful
    acquired loan book, Pakistan added a licensed microfinance bank, and the UAE launch gives the group
    a live GCC experiment. Even so, AGBI’s 2025 profile still described 59% of income coming from Egypt
    and 40% from Turkey, leaving only a small residual share for newer markets. That means most of the
    earnings story still rests on a narrow set of countries even after a visible international push. The
    execution risk is equally obvious in the way expansion is described. Pakistan still requires capital
    increases, branch rollout, and digital upgrades; the UAE story is still framed through early customer
    counts and partner acquisition; and GCC expansion remained an explicit target in late-2025 reporting.
    Diversification exists, but it is still being built, and unfinished diversification can increase execution
    burden before it meaningfully lowers concentration.
