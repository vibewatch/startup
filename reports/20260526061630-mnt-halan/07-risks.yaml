- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Credit-quality slippage
    - Delinquency or write-off trend
    - Any sustained deterioration without compensating disclosure or reserves
    - Pause upside underwriting and demand loan-vintage evidence.
  - - Funding-market dependence
    - Failed or materially wider-priced issuance
    - Missed issuance window or sharply weaker demand
    - Reprice liquidity risk and reduce fair-value range.
  - - Complaint and freeze friction
    - Complaint backlog or regulator escalations
    - Service complaints rising faster than customer growth
    - Treat trust and conduct as central rather than peripheral risk.
  - - Regulatory posture shift
    - Approval language changes to remediation or conditions
    - New formal correspondence, fines, or operating restrictions
    - Move risk rating higher immediately.
  - - Diversification failure
    - New markets remain immaterial while debt and loan-book growth accelerate
    - Egypt/Turkey concentration stays dominant despite expansion claims
    - Treat diversification as narrative support, not risk reduction.
  notes: Kill criteria are designed for live monitoring. The public record supports the existence of mitigants,
    but not enough disclosure to waive these triggers.
