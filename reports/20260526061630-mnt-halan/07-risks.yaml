  evidenceGaps:
  - type: missing-source
    severity: material
    topic: loss-rates
    missingEvidence: Product-level delinquency, charge-off, and loss-rate disclosure by geography and
      vintage.
    whyItMatters: Without loss curves, credit-quality risk remains one of the least directly evidenced
      pieces of the underwriting case.
    diligencePath: Request investor deck or lender presentation with vintage performance, NPL, write-off,
      and recovery data by market.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: covenants
    missingEvidence: Advance-rate, overcollateralization, and covenant terms for the securitization and
      bond stack.
    whyItMatters: These terms determine how quickly a portfolio wobble can turn into a funding squeeze.
    diligencePath: Ask management and arrangers for recent offering memoranda and trustee reports.
    relatedQuestionRefs:
