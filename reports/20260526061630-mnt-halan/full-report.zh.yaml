  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河或风险主题
      - 证据
      - 严重程度
      - 为何重要
      - 缓释措施 / 尽调请求
    rows:
      - - 持牌服务低银行覆盖人群的信贷
        - MNT-Halan 拥有多类别贷款和钱包牌照
        - 机会高
        - 牌照和风控比 App 功能更难复制
        - 按产品核验资本充足率和损失率
      - - 支付商品化
        - Fawry 和 Paymob 已在支付通道上形成规模
        - 高风险
        - 如果支付是入口，既有玩家已经掌握许多通道
        - 衡量仅支付用户的留存和变现
      - - BNPL 区域规模劣势
        - Tabby 和 Tamara 已具备多国商户和融资规模
        - 中高风险
        - 区域商户网络可能在结账信贷上压过 MNT-Halan
        - 量化埃及以外的商户获客成本和审批通过率
      - - 对手压低资金成本
        - Khazna 正在申请数字银行牌照；Fawry 已上市
        - 中风险
        - 更低资金成本可能压窄 MNT-Halan 的信贷优势
        - 按竞争对手跟踪资本成本、存款获取和证券化利差
      - - 消费金融监管
        - 埃及银行家和监管方正在讨论加强非银贷款监管
        - 高风险
        - 行业规则可能直接打击增长和风控灵活性
        - 在更严格信贷检查和融资规则下压力测试增长
      - - 多 App 并用与低锁定效应
        - 钱包和 BNPL 工具很容易并行使用
        - 中风险
        - 低切换成本会压缩 CAC 回本和品牌耐久性
        - 索取活跃多 App 使用、重复借款和商户独家数据
    notes: 严重程度来自来源包综合判断，不是评分模型。风险最高的行，是公开数据同时显示对手规模强、政策敏感度高的领域。
