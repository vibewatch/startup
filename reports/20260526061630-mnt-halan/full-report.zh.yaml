      - 目标细分市场
      - 差异化
      - 相比 MNT-Halan 的关键限制
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant direct, adjacent, substitute, and status-quo alternatives visible in the 2025-2026
        public source pack, not every MENA fintech.
    rows:
      - - Fawry
        - 直接的现有巨头型竞争者
        - 1Q2026 收入 EGP 2.41bn；总贷款组合 EGP 6.18bn；54.1m 用户
        - 大众零售用户、商户、MSME
        - 密集服务点网络和公开盈利能力
        - 相比 MNT-Halan，对银行服务不足用户的定位不那么明显由信贷驱动
      - - Paymob
        - 直接收单 / 商户规则竞争者
        - 350k+ 商户；50+ 种支付方式；融资 $90m+
        - SMB、企业商户、平台
        - 商户收单、嵌入式金融、全渠道结账
        - 资产负债表信贷深度不及 MNT-Halan
      - - Khazna
        - 直接的服务不足人群信贷竞争者
        - 500k+ 用户；融资 $63m+；核心信贷达到盈亏平衡
        - 中低收入劳动者、工资用户、零工劳动者
        - 面向服务不足用户的工资挂钩和无抵押贷款
        - 公开规模小于 MNT-Halan，仍在寻找更便宜的资金基础
      - - Tabby
        - 区域相邻 BNPL 竞争者
        - 15m 客户；40k 品牌；估值 $3.3bn
        - GCC 零售购物者和商户
        - 区域结账规模和更宽的金融服务路线图
        - 主要由 BNPL 驱动，不是完整的服务不足人群贷款堆栈
      - - Tamara
        - 区域相邻 BNPL 竞争者
        - 20m+ 客户；87k+ 商户；$2.4bn 融资额度
        - 海湾市场的零售购物者和商户
        - 大商户基础上的无滞纳金 BNPL
        - 地理重心更偏 GCC，而不是以埃及为中心
      - - OPay
        - 相邻钱包 / 超级 app 替代方案
        - 大型 app 支付平台，覆盖卡、财富管理和转账
        - 消费者和小商户
        - 覆盖面广的消费者钱包和激励
        - 埃及市场具体规模公开透明度较低
      - - Kuda
        - 相邻数字银行替代方案
        - 数字银行，覆盖转账、储蓄、投资、贷款、工资和企业 API
        - 需要数字银行的消费者和企业
        - 集成式类银行 UX 和企业工具
        - 没有明显的埃及消费贷款足迹
      - - M-PESA / 移动货币现状
        - 替代方案 / 标杆模型
        - 移动货币轨道，覆盖储蓄、贷款和商户支付
        - 习惯钱包轨道的消费者和商户
        - 证明支付 + 信贷捆绑可以成为默认行为
        - 目前不是埃及直接消费贷款机构
    notes: 各行比较的是公开定位和规模信号，不是口径完全可比的财务模型。多家私营公司的指标仍不完整。
