        - 扩张在运营上尚未完成，经济性仍集中在少数市场。
        - 提供国家层面的收入和利润率证据，证明多元化具有增厚作用。
      - - 公开可比公司支撑
        - Fawry 和 Nu 证明，在业绩披露充分时，金融科技公司可以获得大体量估值。
        - MNT-Halan 的披露还不像公开公司，资产负债表上的信贷风险也更重。
        - 交付公开公司级别报告和治理。
      - - 区域私营可比公司支撑
        - Tabby 证明 MENA 金融科技公司可以达到数十亿美元估值。
        - 同业商业模式和资产负债表强度差异显著。
        - 说明 MNT-Halan 在支付到信贷光谱上的位置。
    notes: 反向逻辑来自披露质量和资产负债表敏感性，不是怀疑公司规模。
