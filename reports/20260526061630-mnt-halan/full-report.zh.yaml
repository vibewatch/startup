      - number: '4.2'
        title: 公开牵引力很强，但单位经济性大多仍是私有信息
        blocks:
          - type: paragraph
            body: >-
              公开牵引力叙事相当强。Forbes 报告称，累计放款超过 $11 billion，客户超过 8 million，2024 年交易额 $4.2 billion，到 2024 年 12 月下载量 11.7
              million、活跃用户 2 million。AGBI 补充称，到 2025 年，集团贷款账簿约 $1.3 billion，其中埃及超过 $700 million，公司仅 2024 年就放贷超过 $2.2
              billion。Entrepreneur 也引用了 1.1 million 活跃借款人和每季度服务超过 2.3 million 人的数据。Apis Partners 2024 年 7 月交易新闻稿补充了新增
              2.2 million 季度活跃用户、5 million 金融客户，以及埃及 3 million 借款人、累计放款超过 $4.4 billion
              的数据；虽然这是合作伙伴承载的公司数据，但有助于三角验证运营密度。这些都是强牵引力信号，但并不等同于干净的单位经济性。公开来源没有披露毛利率、净息差、逾期、获客成本、回本周期或队列留存。即便最好的公开收入数字——2023
              年轮次前后引用的约 $300 million，以及后来关于收入达数亿美元的描述——也太旧或太宽，无法支撑精确的 2026 年运行率模型。结论不是经济性弱，而是公开牵引力明显超过公开单位经济性透明度。
