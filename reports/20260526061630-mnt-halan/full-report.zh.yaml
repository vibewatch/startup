      - number: '2.2'
        title: 市场规模测算：用自下而上代理、CEO 目标和已披露市场份额拆解四个地域的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              公开来源包里，没有任何单一第三方分析师报告给出 MNT-Halan 所服务精确细分的经审计 TAM——即埃及、土耳其、巴基斯坦和阿联酋四地，面向无银行账户和银行服务不足消费者与 SME
              的非银信贷。因此，规模测算采用多重视角：由 MNT-Halan 自身披露份额倒推的隐含市场规模、CEO 给出的可服务市场代理、国家宏观数据，以及相邻 BNPL
              和超级应用平台的可比公司指标。在埃及，MNT-Halan 称自己持有超过 25% 的微金融市场份额；截至 2025 年中，其埃及贷款账簿高于 $700
              million。按这个份额倒推，当前埃及微金融存量隐含总细分规模约 $2.8 billion——这是 MNT-Halan 主细分 SAM 的自下而上代理。公司埃及贷款账簿已经超过多数埃及银行个人贷款组合，说明
              MNT-Halan 在这个人群可获得的正规非银信贷中拿下了超比例份额。更广义的埃及消费和 SME 信贷市场——包括正规银行——要大得多，也更难用公开资料划界。根据 2026 年 5
              月关于消费金融争议的媒体报道，埃及有 36 家 Central Bank 监管的商业银行，以及约 2,500 家非银融资公司。这种供给碎片化说明需求可观，但信用集中和监管风险也更高。在土耳其，收购 Tam
              Finans 让 MNT-Halan 进入一个细分：按服务客户数衡量，Tam Finans 自身持有微型租赁市场 40% 份额，收购前贷款账簿为 $300 million。因此，把土耳其微型租赁可服务细分倒推为约
              $750 million，作为土耳其市场 SAM 下限是合理的；不过 MNT-Halan 现在还会在租赁基础上叠加消费信贷。在巴基斯坦，MNT-Halan 的 CEO 提到家庭债务占 GDP 只有
              3%–4%，GDP 约 $370 billion，经济中每天有 $33 billion 现金交易；如果数字信贷哪怕只把非正式信贷正规化一小部分，空间也很大。公司自己的巴基斯坦目标——五年内做到 $500
              million 贷款账簿——可作为该地域受需求约束的 SOM 估计。在阿联酋和 GCC，MNT-Halan 上线约 18 个月内已接入 1.5 million 支付服务用户，并向 220,000
              名客户发放贷款；公司把沙特列为下一优先市场，因为沙特 21% 成年人仍无银行账户，而该国电子支付率已从 2016 年的 18% 跃升至 2024 年的 79%。集团层面，MNT-Halan 自己的目标——到
              2026 年底未偿组合达到 $4.5 billion 至 $5 billion，并在十年内成为超过 $10 billion 公司——提供了管理层口径的 SAM/SOM 框架，尽管外部验证尚未出现。GSMA 的
              2025 MENA Mobile Economy 报告统计了 308 million 移动互联网用户，并指出移动技术在 2024 年为区域 GDP 贡献 $350 billion，占 MENA GDP 的
              5.7%；这能解释分销触达，但不能直接说明信贷市场规模。BNPL 细分的可比点——Tabby 年化交易量超过 $10 billion、估值 $3.3 billion——表明 MENA
              相邻数字信贷市场已经能支撑顶级估值，从而强化一个判断：即便 MNT-Halan 的直接微金融细分更小，区域整体数字金融 TAM 仍然可观。
