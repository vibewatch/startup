            body: >-
              扩张降低了 MNT-Halan 只是一个埃及故事的说法，但公开证据仍不足以得出集中度风险已经消失的结论。土耳其 增加了有意义的收购贷款账簿，巴基斯坦增加了持牌小额金融银行，阿联酋上线则给集团一个真实的 GCC
              实验。即便如此，AGBI 2025 年画像仍描述 59% 收入来自埃及、40%
              来自土耳其，新市场只剩很小的残余份额。这意味着，即便国际推进已经可见，盈利故事的大部分仍压在少数国家上。执行风险同样明显，体现在扩张叙述本身。巴基斯坦
              仍需要增资、分支扩张和数字升级；阿联酋故事仍由早期客户数和合作伙伴获取来定义；GCC 扩张在 2025 年末报道中仍是明确目标。多元化已经存在，但仍在建设中；未完成的多元化，可能先增加执行负担，再真正降低集中度。
