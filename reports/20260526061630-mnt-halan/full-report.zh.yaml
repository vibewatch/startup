      - number: '8.3'
        title: 正确判断是价格敏感的谨慎，而不是坚定买入
        blocks:
          - type: paragraph
            body: >-
              情景分析指向一个建议：它对证据质量和公司野心同样敏感。MNT-Halan 有足够的规模、融资历史和跨境触达，值得被当作严肃的后期区域
              金融科技公司讨论，而不是一个狭窄的本土放贷方。但同一组证据也说明，今天的热情不该推到买入结论。近期评论把很大权重放在融资组合增长、债务发行和潜在 IPO
              时间上。这些是有用信号，但也告诉投资者，估值由增长野心和融资可得性支撑，而不是由完全披露的盈利机器支撑。因此，最干净的立场是继续研究 /
              观察，置信度中等，估值观感为合理到偏高。乐观情景只有在债务市场执行、投资组合质量和披露同步改善时才成立。悲观情景则出现在杠杆比透明度增长更快、公开市场投资者把 MNT-Halan
              定价得更接近已披露本地金融科技公司，而不是区域数十亿美元私有冠军时。
