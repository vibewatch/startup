      - number: '3.3'
        title: 定价信号在边缘可见，但分销和切换成本比标价条款更重要
        blocks:
          - type: paragraph
            body: >-
              公开定价证据并不均匀，这本身就是一个重要发现。MNT-Halan 在自有网站披露了一些面向用户的条款，包括 BNPL 额度最高 EGP 200,000、分期期限最长 36 个月；Tamara
              则公开强调无滞纳金、付款计划最长 24 个月。但许多财务关键指标仍然隐藏：实际 APR、商户折扣率、有效抽成率和资产负债表损失假设，大多未出现在公开记录里。这迫使竞争视角转向分销和切换行为。Fawry 超过
              300,000 个服务点、Paymob 超过 350,000 商户、MNT-Halan 在巴基斯坦和阿联酋的分支 + 应用扩张，以及 Khazna
              的工资挂钩存在感，都很重要，因为它们创造反复触点，可以喂给新产品。即便如此，真正锁定效应看起来仍然混合。工资、承保、分支或商户数据都留在应用内部时，锁定效应应最高；消费支付或结账分期可以无排他合同地叠加到既有习惯上时，锁定效应最低。换句话说，用户便利让采用变容易，但嵌入式信贷和分销让留存更难被撬走。
