      - number: '1.3'
        title: 资本基础、投资者图谱与融资历史
        blocks:
          - type: paragraph
            body: >
              MNT-Halan 搭起了多层资本基础，横跨股权轮、证券化债务和公司债。第一笔机构融资是 2021 年 9 月的 $120 million，投资方包括 Development Partners
              International (DPI)、Apis Growth Fund II 和 Lorax Capital Partners。标志性轮次发生在 2023 年 1 月：Chimera Abu
              Dhabi——一家管理上市和非上市股权多元组合的私营投资公司——以超过 $200 million 股权投资换取公司超过 20% 股份。再加上 $140 million 证券化债券发行（由子公司 Tasaheel
              Microfinance Company 和 Halan Consumer Finance 发行，CIB 担任安排人）以及国际投资者的额外股权，MNT-Halan 估值越过 $1
              billion，成为埃及第一家金融科技独角兽。2024 年 7 月，公司又融资 $157.5 million（IFC 出资 $40 million，其余来自 DPI、Lorax、Apis
              Partners、Lunate 和 GB Corp），用于土耳其、巴基斯坦收购以及 GCC 扩张。


              截至 2024 年 7 月，公司股权和债务融资合计已超过 $630 million（TechCrunch）。The FinTech Times 在 2024 年中引用了更宽口径的 $722
              million，反映额外结构化债务发行。此后，MNT-Halan 大幅提高资本市场使用强度：公司在 2025 年 5 月完成 $49 million 公司债发行（MERIS 评级 BBB+），2025 年 10
              月在 FRA 批准的 EGP 8 billion 计划下完成第四期 EGP 3.4 billion 证券化债券发行，并计划在 2026 年发行 EGP 40-50 billion 债务工具。区域 IPO
              被描述为近期目标（按 2025 年末报道约 12-18 个月），这会带来治理和透明度的显著跃迁。IFC 的项目披露（MNT Group，SII project 46427）独立确认了这家国际发展金融机构的投资。
