  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管边界和法律文件决定下行风险外沿
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的风险画像，首先取决于其模式需要多少许可才能持续运营。公开记录显示，公司现在横跨受监管放贷、钱包功能、巴基斯坦
              小额金融银行，以及阿联酋薪资融资入口。战略上这有用，但也意味着增长受多市场监管和法律文件约束。巴基斯坦 收购官方材料需要 State Bank 和 Competition Commission 双重批准；公开的
              Halan Cash 条款则把开户、KYC、交易限额、投诉升级和欺诈响应明确锚定到 Central Bank of Egypt 规则。Central Bank of Egypt
              自身消费者权益指引要求，投诉应在两个工作日内拿到参考编号，15 个工作日内得到首次回复；如果第二次回复仍未解决，用户有权上报央行。巴基斯坦 State Bank 同样运营 Sunwai
              门户，作为一般银行业务的正式投诉渠道。这些不是后台细节；它们说明，在埃及和巴基斯坦，用户摩擦多快会变成监管问题。巴基斯坦
              条款同样法律化，责任免责声明和巴基斯坦法院管辖语言说明，本地文件本身就是运营模式的一部分。实际看，MNT-Halan
              今天并不面对单一的存亡牌照问题。它面对的是一个持续负担：产品和地区扩张快于多数公开披露包可验证的速度，同时还要守住多个不断演变的边界。
