chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营模式
        blocks:
          - type: paragraph
            body: >
              MNT-Halan 把自己定位为埃及领先的金融科技生态，也是该国面向无银行账户和银行服务不足人群的最大非银贷款机构。公司名把早期机构支持者 MNT Investments B.V. 的首字母 MNT
              与「Halan」放在一起；MNT Investments B.V. 是一家位于荷兰的微贷专营机构，「Halan」在埃及阿拉伯语中意为「now」——对应公司对即时、低摩擦金融触达的强调。2018 年，联合创始人
              Mounir Nakhla 和 Ahmed Mohsen 在埃及推出两轮和三轮车网约车应用 Halan，公司正式成立。最初运营 18 个月后，团队又用同样长的时间搭建自研 API-First Core
              Banking 平台 Neuron，随后在 2019 年全面转向金融科技，并与 MNT Investments 合并。


              运营模式围绕一个金融超级应用展开：微型和小企业贷款、消费金融、BNPL（先买后付）、预付卡、电子钱包、数字支付、电商、黄金和货币市场基金投资，以及与工资挂钩的薪资垫付，都被收进同一个移动界面。信贷是主要收入驱动和资产负债表引擎；支付和电商等配套服务则加深客户互动、降低流失。MNT-Halan
              称其信贷方法由数据驱动：申请人缺少正式信用记录时，系统会使用平台交易历史等替代数据。公司持有埃及 Financial Regulatory Authority (FRA)
              授予的微型、SME、消费和极小额金融牌照，也持有其称为 Central Bank of Egypt (CBE) 发出的首张独立电子钱包牌照。这些牌照是多年才拿下的结构性护城河。总部在埃及吉萨（大开罗）。截至
              2024 年 12 月，Halan 应用下载量达到 11.7 million 次，活跃用户 2 million，仅 2024 年处理交易额就达到 $4.2 billion。
