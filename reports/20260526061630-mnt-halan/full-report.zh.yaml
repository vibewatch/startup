      - number: '6.2'
        title: 采用轨迹：总体增长信号很强，具名证据主要集中在应用商店和少数市场披露
        blocks:
          - type: paragraph
            body: >-
              采用故事显然真实，但证据分布不均。在总体层面，官方页面、LinkedIn、FinTech Global、Forbes、AGBI 和 Empower Africa 都给出同一个方向：客户数从 2023 年的
              5-million 区间，增长到埃及超过 7 million、到 2025 或 2026 年跨市场超过 8 million；活跃用户则从 2023 年每月 1.3 million，增长到 2024 年约 2
              million 活跃用户或 2.2 million 季度活跃用户，再到 2025 年 LinkedIn 更新中的 2.5 million 活跃客户。跨境客户证据也存在。巴基斯坦 带来一家拥有 62,000
              名客户的银行，之后提出 200,000 客户目标；土耳其通过 Tam Finans 带来 50,000+ 企业客户基础；阿联酋披露则从上线时 40,000 名客户，推进到 100,000 笔已赚工资提前支取
              贷款，之后又按日期和产品不同出现 220,000 名借款人或 1.5 million 名支付用户。具名证据更薄，但仍有意义。当前最强的具名终端用户证据，其实是公开
              应用商店证据：数千条评分，加上描述真实生产使用的详细评论，既有正面，也有负面。
