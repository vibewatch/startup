  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群结构：公开记录支持一个覆盖零售借款人、商户、中小企业和雇主绑定员工的广泛欠银行服务用户群
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的客户画像很宽，但最强证据仍集中在金融服务不足的用户，而不是富裕的优质银行客户。历史和当前披露一贯指向小商户、非正规工人、工资收入者和零售借款人，这是埃及的核心基础。AllBusiness
              解释，最早的切入口来自摩托车出租司机、店主和其他无银行账户工人；GPCA 案例研究又把女性创业者列为重要客户群；当前公司页面和 Forbes 画像则用数百万级用户数和 app
              下载规模更新了这个故事。跨境扩张延续同一模式，但会做本地适配：巴基斯坦
              增加小额金融客户和计划中的分支增长，土耳其增加以企业为主的保理基础，阿联酋则从绑定雇主和兑换所的薪资融资用户切入。做投资判断时，关键在于公司似乎清楚自己服务谁，也清楚传统银行为什么难以触达这些人。较弱的地方，是各产品线和地区的付款方结构。公开页面没有拆出哪些客群贡献最多收入、还款表现最好，或客户终身价值最高。
