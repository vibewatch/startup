      - number: '6.4'
        title: 扩张与集中度：渠道杠杆很清楚，但依赖和集中度披露仍有限
        blocks:
          - type: paragraph
            body: >-
              扩张是 MNT-Halan 最清晰的客户优势之一，也是最不透明的尽调领域之一。公司不是只靠付费获客或单一零售渠道，而是用商户网络做 BNPL，在巴基斯坦借助分支和银行基础设施，在土耳其接入大型 SME
              账簿，在阿联酋 使用雇主或兑换所合作。Meatechwatch 点名 Al Ansari Exchange 和 Lean Technologies
              尤其有用，因为它把渠道讨论从泛泛的“合作伙伴”语言推进了一步。即便如此，公开记录仍没有告诉投资者，客户基础按 logo、雇主项目、商户队列或地区到底有多集中。即便 Business Wire 的 246,000
              份合同数据点，也更能说明颗粒度，而不是集中度。由于没有披露大客户和渠道结构，正确解读不是集中度一定危险，而是集中度缺少文档支撑。渠道依赖也一样。公开证据证明这些路径重要；它没有量化每条路径背后有多少收入或还款表现。因此，集中度仍是一个真实的尽调工作流，而不是已经关闭的问题。
