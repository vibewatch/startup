        title: 运营模式看起来如何运转：移动获客、替代数据承保，以及作为共同控制平面的 Neuron
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的部分，是共同运营底座确实存在；较弱的部分，是深层技术内部细节。Business Wire 最早把 Neuron 描述为生态背后的自研技术；后来 The Fintech Times 和
              Entrepreneur 的采访明确称其为 MNT-Halan 的 API-first
              核心银行系统，并把它与信贷模型和面向消费者的应用相连。这些描述方向上足够具体，可以支撑一个架构判断：获客和服务发生在移动优先应用层；正式信用档案较薄时，承保依赖替代数据或自有数据；Neuron
              位于信贷、支付、商业和新区域上线之下，是标准化工作流的系统。AGBI 关于基于交易历史做信用评估的报道支持这一解读。公开材料没有提供的内容同样重要。所审阅材料里没有公开可得的 API
              参考文档、SDK、工程博客或公开状态页面，因此尽调可以验证统一核心的叙事，却无法验证具体云设计、故障域、模型治理控制或安全架构。这让 MNT-Halan 的技术故事可信，但仍有一部分是黑箱。
