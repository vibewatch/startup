  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 披露没有改善
        - 重大 IPO 或融资动作前，没有经审计合并财务报表或风险指标
        - 估值仍由叙事驱动，倍数支撑偏弱
        - 将建议维持在观察 / 继续研究，或下调公允价值区间。
      - - 债务扩张快于控制体系
        - 大额新发行缺少信贷损失透明度
        - 投资者会更像给杠杆化信贷平台那样给 MNT-Halan 估值
        - 提高风险折价，并将上行视为有条件成立。
      - - 地理多元化停滞
        - 埃及 / 土耳其仍主导经济性，新市场仍不重要
        - 扩张叙事不再降低集中度风险
        - 不支付区域平台溢价。
      - - IPO 准备度滑坡
        - 看不到治理、审计师或上市里程碑
        - 后期重估逻辑失去时点可信度
        - 将乐观情景进一步后移，或直接移除。
      - - 信贷质量走弱
        - 一旦披露，分期批次损失或违约明显上升
        - 融资模式和估值逻辑同时压缩
        - 立即向悲观情景重估。
    notes: 这些触发项被定义为投资否决标准，而非经营观察，因为它们会直接改变估值支撑。
