      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              MNT-Halan 由 Mounir Nakhla（董事长兼 CEO）和 Ahmed Mohsen（联合创始人兼 CTO）共同创办。Nakhla
              自公司创立以来一直是最主要的公开面孔；转向科技之前，他在埃及搭建线下信贷和金融服务业务已有十多年经验。他曾说，2017 年参访印尼 Gojek，是公司形成移动优先、超级应用愿景的催化剂。Mohsen
              设计了公司自研核心银行系统 Neuron，并负责技术。两人构成典型的创始人-市场匹配组合：一位懂商业和分销，一位能搭技术底座，且都理解埃及服务不足的信贷市场。


              领导团队已经加入区域运营负责人。Omar Ramadan 担任 Halan GCC 董事总经理，负责阿联酋和沙特扩张。Hakan Karamanlı 是 2024 年 7 月收购的土耳其子公司 Tam
              Finans 的 CEO。Andre Valavanis 担任投资和企业战略 VP。关键人物风险很高：Nakhla 驱动战略、融资关系和公司公开叙事。公开资料中没有看到正式接班计划，也没有看到一个有权推翻 CEO
              决策的独立董事会。能达到上市公司标准的治理文件未通过公开渠道披露，尽调时必须索取。LinkedIn 显示有 1,567 名员工公开关联 MNT-Halan，而公司自称规模为
              10,001+，这意味着更大的外延员工网络，可能包括地面分销代理和被融资子公司。
