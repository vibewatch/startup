    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: MNT-Halan 的公开轨迹始于 2018 年的网约车业务，随后转向金融科技、成为独角兽，并扩张到四个国家；到 2026 年，围绕非银消费信贷泡沫风险的监管讨论开始浮出水面。
    data:
      items:
        - date: '2018'
          label: 以 Halan 网约车业务创立
          detail: Nakhla 和 Mohsen 在埃及推出两轮、三轮车网约车应用。
          tone: neutral
        - date: '2019'
          label: 转向金融科技，并与 MNT 合并
          detail: 放弃网约车；与 MNT Investments B.V. 合并；Neuron 核心银行系统完成。
          tone: positive
        - date: 2021-09
          label: $120M 机构轮
          detail: DPI、Apis Growth Fund II 和 Lorax Capital Partners 投资；首次获得大型股权资金验证。
          tone: positive
        - date: 2023-01
          label: 独角兽 — $1B+ 估值
          detail: Chimera Abu Dhabi 投入 $200M+（20%+ 股权）；$140M 证券化交易补齐 $400M 融资轮。
          tone: positive
        - date: 2024-03
          label: 收购巴基斯坦 Advans
          detail: 收购 Advans Pakistan Microfinance Bank；62,000 名客户；获 State Bank of Pakistan 批准。
          tone: positive
        - date: 2024-07
          label: $157.5M 融资 + 收购土耳其资产
          detail: IFC 领投其中 $40M；DPI、Lorax、Apis、Lunate、GB Corp 跟投；收购 Tam Finans，新增 $300M+ 贷款账面。
          tone: positive
        - date: 2024-12
          label: 进入阿联酋（Halan Advance）
          detail: 工资融资产品进入阿联酋；数周内获得 40,000+ 客户；目标客群是 3.7M 银行服务不足的外籍人士。
          tone: positive
        - date: '2025'
          label: $49M BBB+ 债券 + EGP 3.4B 证券化
          detail: 投资级公司债；EGP 8B 项目下第四笔证券化；总贷款账面 $1.3B。
