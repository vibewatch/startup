companyProfile:
  summary: >-
    MNT-Halan 是埃及一家以信贷为主的金融超级应用，面向服务不足的用户，把极小额、小微、SME、薪资和消费信贷，与钱包、卡、BNPL、商业和投资相邻产品放在一起。公司由 Mounir Nakhla 和 Ahmed Mohsen
    联合创办，先从埃及网约车概念长成金融科技平台，2023 年跨过独角兽门槛，2024 年扩展到巴基斯坦、土耳其和阿联酋。公开来源支持其已有可观运营规模、多市场野心，也显示 IFC
    和多家机构投资者持续支持；但收入质量、信用表现和资本结构细节仍没有经审计的合并披露。
