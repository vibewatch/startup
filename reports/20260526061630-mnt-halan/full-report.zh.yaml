  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点支持更高的后期价格，但桥接逻辑仍披露不足
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的公开估值故事，从清晰的 2023 年独角兽锚点开始，之后进入更模糊的区域。2023 年融资包把大额股权资本和证券化债务组合在一起，BusinessWire 和 TechCrunch
              都称其让公司达到约或超过 US$1 billion 标记。2024 年轮次又加入 US$157.5 million，后续画像把累计融资推到约 US$550
              million，并突出持续的客户和交易规模。这些事实支持一个高于最初独角兽标记的后期估值。但它们还没有提供一条从融资历史通向内在价值的干净、经审计桥。公开记录显示，集团规模可观、信贷增长激进、国际化广度改善；它还没有展示合并经审计的收入和亏损披露，足以让投资者有把握地承保一个精确溢价倍数。锚点真实，精度不足。
