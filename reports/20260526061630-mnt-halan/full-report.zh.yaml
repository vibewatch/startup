  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计合并财务报表
        - 整个集团的收入、EBITDA、净利润、资产负债表和现金流
        - 让估值从标题驱动转向可以逐项测算
        - 索取经审计 FY2025/FY2026 报表和审计意见。
      - - 资本结构
        - 优先权条款、债务契约、抵押品组合、超额抵押和投资者保护
        - 改变下行情景经济性和压力敏感性
        - 索取股权结构表、债务摘要和证券化文件。
      - - 地区层面表现
        - 埃及、土耳其、巴基斯坦和阿联酋的收入、利润率和风险成本
        - 判断地域多元化是在提升质量，还是只是在做大规模
        - 索取管理层报表和经审计的分部附注。
      - - Vintage 损失数据
        - 按产品和队列拆分的逾期、核销和回收曲线
        - 压测这个靠债务融资的信贷平台时必须拿到
        - 索取仓库资产磁带或评级包中的信贷材料。
      - - IPO 准备度
        - 已聘银行、治理章程、董事会委员会、报告准备度
        - 判断数十亿美元级重估在时间上是否现实
        - 索取上市准备工作计划和治理材料包。
    notes: 这些尽调要求针对阻碍更强推荐结论的具体缺口，不是为了满足泛泛的好奇心。
