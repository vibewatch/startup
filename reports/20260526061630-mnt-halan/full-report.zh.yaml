  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、竞争者类别，以及为什么战场已不只是埃及本土金融科技
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 已经不再只在一个整齐的类别里竞争。公司仍面对 TechCrunch 在 2023 年指出的埃及中心重叠，尤其是 Khazna 和 Paymob，但公开规模和区域扩张已经把战场拉宽。Fawry
              是最清晰的既有玩家式对手，因为它已经把支付、面向消费者的通道、金融服务和公开盈利能力，在全国范围内结合起来。Paymob 不一样：它更强在商户收单，信用风险暴露更少；即便不复制 MNT-Halan
              的贷款账簿模式，也有威胁。Khazna 离公司的服务不足信贷逻辑更近，因为它通过工资挂钩和无抵押贷款瞄准同一批中低收入用户。除这些直接同行外，MNT-Halan 现在还会碰到 Tabby、Tamara
              等区域超级应用和 BNPL 领导者，以及 OPay、Kuda、M-PESA 这类钱包和数字银行替代方案。最重要的含义是，竞争压力来自多个买方任务同时挤压：借钱、付款、收工资、分期结账，以及把钱留在同一个应用里。
