        - US$1.1B-US$1.8B
        - 债务增长放缓，披露滞后，投资者转向保守的本地可比框架。
      - - 基准
        - 50%
        - 公司相对最初独角兽锚点保留后期溢价，但相对区域愿景叙事仍有折价。
        - US$1.8B-US$2.8B
        - 增长延续，债务市场保持开放，关键尽调项改善但未完全消除。
      - - 乐观
        - 25%
        - 公开公司准备度和信贷表现足以支撑公司向区域数十亿美元同业区间靠拢。
        - US$2.8B-US$4.0B
        - 经审计财务、强损失控制和可信 IPO 准备度同时出现。
      - - 中枢观点
        - 100%
        - 权重更偏向一家已有规模、但仍受披露约束的信贷平台。
        - 约 US$2.3B-US$2.5B
        - 证据足以支撑相对旧独角兽标记的溢价，但不足以支撑不受约束的重估。
