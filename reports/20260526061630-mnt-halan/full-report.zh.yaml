      - number: '3.4'
        title: 护城河耐久度取决于承保和融资通道，反向证据则指向监管和商品化风险
        blocks:
          - type: paragraph
            body: >-
              证据不支持仅靠功能宽度形成耐久护城河。支付、分期结账、钱包，甚至宽菜单应用，在 MENA 金融科技里都已常见。MNT-Halan
              更可防守的边，窄但更深：本地信贷牌照、服务不足借款人的承保经验，以及能让贷款账簿持续增长的债务或机构资本通道。反向证据也正是在这里咬得最狠。Fawry 已经展示更强的公开盈利能力和透明度。Paymob
              运营资本强度更低的商户模式。Khazna 正尝试拿到更便宜的存款型资金。Tabby 和 Tamara 已有商户和融资规模，可以主导纯结账信贷。最重要的是，埃及 2026
              年围绕消费金融扩张的争论显示，如果信贷标准或借款人压力成为政策关切，所有非银贷款机构的监管环境都可能收紧。本章结论因此是平衡的：MNT-Halan
              仍具战略差异化，但其护城河最可信的地方在于信贷纪律和资金相遇之处，而不是任何资金充足的支付或 BNPL 应用都能复制的产品表面。
