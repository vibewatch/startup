        blocks:
          - type: paragraph
            body: >-
              公开记录对受监管经营许可的披露，远多于对工程保障的披露。当前官方和公司渠道反复提到 Financial Regulatory Authority 的放贷牌照、Central Bank of Egypt
              的钱包牌照、巴基斯坦监管批准，以及阿联酋合规表述。这些控制有意义，因为 MNT-Halan
              的产品贴近受监管的资金流转和信贷发放。它们证明公司不是在正式体系之外跑一套影子系统。但这些材料回答不了更难的技术尽调问题。本章审阅的材料里，没有公开的 SOC 2 报告，没有 ISO
              认证包，没有外部可见的事故历史档案，也没有公开可靠性看板。即便是应用商店式的数据安全披露，也更像消费者界面信号，而不是企业级证据。因此，产品成熟度最强的地方是广度、市场匹配和监管嵌入；最弱的地方，是缺少能让外部投资者或机构伙伴在不直接接触管理层时评估韧性、隐私治理和安全运营的文档层。完成本章证据收集后，留下的主要产品技术风险就是这个透明度缺口。
