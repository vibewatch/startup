      - number: '1.4'
        title: 里程碑、地理扩张与反向背景
        blocks:
          - type: paragraph
            body: >
              MNT-Halan 的增长轨迹有八年可查里程碑：2018 年从网约车初创公司起步，到 2025 年中成为在四个国家运营、贷款账簿达到 $1.3 billion 的平台。最关键的运营里程碑是 2019
              年金融科技转型：放弃网约车，全面押注信贷和支付，同时搭建 Neuron。2023 年独角兽轮是资本信用里程碑，让公司有资产负债表能力做跨境 M&A。2024 年，MNT-Halan 同时推进三件事：3 月收购
              Advans Pakistan Microfinance Bank，7 月融资 $157.5 million，7 月收购土耳其 Tam Finans，随后在 2024 年 12 月以 Halan
              Advance（薪资金融）进入阿联酋。仅土耳其收购就新增超过 $300 million 贷款账簿，以及覆盖 26 个城市的 39 家分支。


              公司给出的 2026 年目标，是把融资组合扩至 $4.5-5 billion，发行 EGP 40-50 billion 债务工具（sukuk、证券化债券、绿色债券），并在区域交易所上市。CEO Nakhla
              曾描述未来五到七年内实现 decacorn 目标（$10B+ 估值）。


              反向维度也真实存在。2026 年 5 月，埃及 CIB CEO Hisham Ezz Al-Arab 在公开电视采访中警告，埃及非银消费金融快速扩张可能制造融资泡沫；他担心市场上约 2,500
              家融资公司里，一些公司的信贷检查和风险管理标准不足。他特别指出，银行业不良贷款率（NPL）约 ~1.9%，而非银部门违约率低于 3%，两者之间存在差距。MNT-Halan
              虽未被直接点名，但公司是这个细分市场的主导者。Egypt's Financial Regulatory Authority 报告称，到 2025 年底，消费金融细分的融资规模同比增长 57%，超过 EGP 96
              billion。这场监管与信用质量争论，是后续财务、风险和估值章节必须继续跟进的活尽调事项。
