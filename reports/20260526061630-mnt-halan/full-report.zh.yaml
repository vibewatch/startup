      - number: '6.3'
        title: 持久性和重复使用：交叉销售逻辑可信，但公开留存证据仍薄，客服风险可见
        blocks:
          - type: paragraph
            body: >-
              最好的公开留存信号不是硬指标，而是概念逻辑。MNT-Halan 的整体产品策略，就是让用户为不止一种金融需求留在同一个生态里：借款、还款、转账、缴费、购物、用卡，并可能增加储蓄或投资行为。The Fintech
              Times 文章明确说，使用更多服务会降低流失、改善客户终身价值；Halan.com 又用卡片、更高额度和更多产品类别拓宽重复使用场景。这个逻辑可信。没有公开的是硬持久性数据。审阅来源均未披露
              NRR、GRR、客户 logo 流失、续约率、合同期限，或按客群和地区拆分的队列留存。缺少这些指标时，应用商店 证据更有价值。Apple 的 4.6 分说明一个平台上存在健康的满意用户群；但 Google
              Play 的 2.3 分，以及关于登录、卡激活、投资转账和支持薄弱的详细投诉，显示客户体验质量不均。结果是，本章里重复使用逻辑说得通，但仅凭公开证据，仍无法干净地判断客户持久性。
