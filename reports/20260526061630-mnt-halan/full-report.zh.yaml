      - number: '2.3'
        title: 买方、用户和付款方分层：五类客户画像对应不同预算负责人、触发点和采用路径
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan
              的市场并不均质。来源包里浮现出五类不同买方画像，每一类的工作流、预算负责人、采用触发点以及与传统银行的关系都不同。第一类也是最大的一类，是无银行账户或银行服务不足的消费者：收入通常低于开立银行账户或信用卡的门槛，部分生活在非正规经济中，需要小额信贷购买消费品、家电、教育、医疗，或应对个人急用。这个细分里，买方是借款人，付款方也是借款人（数字放款去掉了现金摩擦），采用触发点是在提供
              BNPL 的商户处出现具体购买需求，或来自社交网络推荐。MNT-Halan 通过极小额贷款、消费微贷和 BNPL 产品明确服务这类人群；这些产品不要求银行账户，并通过超过 5,000
              家商户运行。第二类是需要营运资金、库存融资或车辆金融来运营生产性资产的微型创业者或小企业主——例如摩托车快递员、街角小店店主或小型制造商。这个细分的预算负责人是企业，还款来源是企业现金流，采用触发点是短期运营资金缺口。MNT-Halan
              通过微金融和 SME 贷款产品服务该细分，授信额度最高 EGP 5 million。第三类是发薪日前寻求工资垫付或短期个人贷款的薪资 / 工资劳动者；因为还款来源从工资中扣除，这个细分适合雇主合作。Khazna
              在埃及也瞄准同一细分，说明竞争重叠真实存在。第四类是希望不用银行信贷、以分期购买电子产品、家具或二手车的上升型消费者；这些买方活跃在电商和实体零售渠道，受可负担性和审批速度驱动。在这个细分，Tabby、Tamara
              等 BNPL 提供方也在 GCC 竞争，埃及本土 BNPL 市场除 MNT-Halan 外也有多家非银提供方。第五类是阿联酋 / GCC
              服务不足的移民工人或低收入者——海湾国家中一个庞大群体，可能在所在国没有正式信用历史，过去依赖汇款和现金管理。MNT-Halan 在阿联酋针对二手车软启动汽车贷款，并与 Al Ansari Exchange
              做薪资垫付合作，直接触达这一人群。性别维度也重要：MNT-Halan 报告称，女性占借款人的 53%–54%，使女性创业者和低收入女性成为按数量计最大的单一客户群。这种倾斜影响监管定位、影响对 DFI
              的吸引力（IFC 投资 $40 million 部分出于金融普惠使命），也影响组合风险特征。每个细分都意味着不同的产品表面、定价区间、分销渠道和竞争集合。
