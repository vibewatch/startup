      - number: '8.2'
        title: 可比公司分析要求纪律：MNT-Halan 大于埃及小型金融科技公司，但还没有上市龙头那样透明
        blocks:
          - type: paragraph
            body: >-
              可比组不得不混合选择。Fawry 是最有用的本地公开基准，因为它展示了一个披露充分的埃及金融科技公司在收入、盈利和市值上可以长成什么样。Fawry 1Q2026
              发布显示，这是一个规模大且盈利的平台，利润率强劲；TechCabal 2026 年画像则把市值放在约 US$1.3 billion。Nu Holdings 位于光谱另一端：这是一家已上市的拉美金融科技公司，May
              2026 市值超过 US$60 billion，但它也享有深得多的披露和宽得多的投资者基础。区域私有可比也有用。Tabby 的 US$3.3 billion
              估值说明，只要平台快速扩张、市场相信产品扩张路径，MENA 投资者愿意支持数十亿美元级金融科技定价。不过，Tamara、OPay、Kuda 和 M-Pesa
              也说明，为什么同业选择必须谨慎。支付重或生态重的模式远看相似，但资产负债表风险、信贷强度和披露质量可能非常不同。
