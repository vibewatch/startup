  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、排除支出、相邻市场，以及 MNT-Halan 正在替代的现状方案
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的核心市场，是在传统银行无法服务、或服务小额借款人并不赚钱的新兴市场里，向无银行账户和银行服务不足人群发放的非银消费和 SME
              信贷。在埃及，这个群体包括没有正式信用记录的个人、需要低于银行经济门槛营运资金的微型创业者，以及被抵押品贷款挡在门外的中小企业。公司也服务数字支付、先买后付分期结账、薪资挂钩金融和电商等相邻需求——但这些表面业务是在放大和支撑信贷核心，而不是取代它。因此，正确的市场边界必须仔细区分纳入支出和排除支出。纳入支出包括消费微贷、极小额贷款、SME
              贷款、薪资垫付、车辆金融和 BNPL
              分期信贷，也包括数字钱包、卡和支付基础设施；这些基础设施降低获客成本、积累还款纪律数据，并把借款人留在生态里。排除支出包括投资级企业信贷、按揭发放、国际贸易融资、保险承保，以及 Fawry 和 Paymob
              通过商户收单网络主导的大众支付处理。这些产品都属于同一个金融科技叙事，但不是 MNT-Halan 贷款账簿经济性的所在地。影响估值的相邻市场包括 BNPL 结账市场，Tabby 和 Tamara
              已证明该市场可以做到数十亿美元年化交易量；还包括 OPay 和 Kuda 在撒哈拉以南非洲代表的更广义数字银行替代模型。这些案例展示了超级应用信贷平台可以如何放大，但只在 MNT-Halan
              当前埃及市场边缘竞争。现状替代方案是非正式放贷人、埃及称为 gameyyas
              的轮转储蓄会、典当行、未受监管的微金融提供方以及亲属——它们都缺少定价透明度，不能积累信用历史，执行靠社会关系而非合同。MNT-Halan
              用有文件记录的贷款条款、即时数字放款和数据驱动信用评分替代这些旧方案，从而服务没有抵押品的首次借款人。市场定义还把 MNT-Halan 的土耳其子公司 Tam Finans 排除在主要埃及分析之外，但在多市场
              TAM/SAM 框架中纳入它，因为土耳其微型租赁和 SME 金融市场带来了有意义的组合容量。在巴基斯坦，相对 MNT-Halan 的存在而言，市场仍是绿地；正规家庭信贷只占 GDP 的
              3%–4%，而大型非正式现金经济正是 MNT-Halan 明确瞄准的机会。
