  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: MNT-Halan 实际交付什么：以信贷为主的金融超级应用，外层包裹支付和商业
        blocks:
          - type: paragraph
            body: >-
              最清晰的产品事实是，MNT-Halan 不是一个单一贷款应用，也还不是经典意义上的公开数字银行；它是一个信贷主导的金融超级应用，不断增加可为银行服务不足消费者和小企业解决的相邻任务。官网、LinkedIn
              公司页和多篇独立采访，都指向同一套核心堆栈：小微企业贷款、消费金融、支付、消费商业，以及类似卡的钱包功能。在这套堆栈中，信贷仍是锚。官方页面先展示微金融、SME
              贷款、极小额贷款、BNPL、薪资贷款和车辆金融，再描述下游钱包或商业功能。支付和商业重要，因为它们加深用户触点并制造数据尾迹，但公开表面读起来仍是信贷优先，而非支付优先。对尽调来说，这很重要，因为核心客户任务不只是「转钱」，而是「获得信贷、花掉、还款，并留在同一个生态里处理下一个金融任务」。产品宽度真实存在；但限制在于，包装细节仍停在营销级而非合同级，因此应用在运营上看起来很宽，但商业上不如成熟银行或软件平台透明。
