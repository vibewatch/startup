  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、变现表面，以及公开定价揭示和没有揭示的内容
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 的公开材料始终把它描述为信贷主导的生态，而不是纯支付或商业应用。官网和 2024
              年融资新闻稿一起显示，公司通过企业和消费信贷、BNPL、钱包和卡、账单支付、薪资金融以及商业变现。这很重要，因为收入桥先从信贷和交易活动出发，再扩展到产品附着，而不是反过来。最强的公开定价证据仍是面向用户的，不是投资者级别的。MNT-Halan
              披露了 BNPL 额度最高 EGP 200,000、分期期限最长 36 个月等头部条款，但没有公布实际
              APR、抽成率、折扣、商户补贴经济性，或信贷、支付、商业各自的收入占比。因此，公开证据支持多个变现表面的存在，却无法支撑干净的收入确认或贡献利润率拆分。做承保时，正确解读是：MNT-Halan
              明显比单一产品贷款机构更多元，但如果没有私下尽调，仍过于不透明，无法做精确产品线预测。
