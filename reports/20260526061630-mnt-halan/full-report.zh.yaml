      - number: '8.4'
        title: 尽调索取清单很具体，因为当前估值逻辑仍不完整
        blocks:
          - type: paragraph
            body: >-
              缺失项不是装饰。它们是把 MNT-Halan
              从一个叙事支撑的亮眼规模故事，变成可承保投资案例所需的具体文件和数据集。第一项是经审计的合并财务。没有它，分析师无法验证信贷平台如何把贷款账簿增长转化为收入、利润率和现金生成。第二项是资本栈细节：债务
              约束条款、超额抵押、投资者保护，以及任何可能改变下行经济性的优先权条款。第三项是地区级表现数据。进入土耳其、巴基斯坦 和阿联酋具有战略意义，但投资者需要知道哪些市场在增厚收益、哪些仍是实验、集中度还剩多少。最后是
              IPO
              准备本身。如果上市计划真实，董事会结构、治理准备、投行接触和上市公司报告设计都应该可见。在这些材料出现之前，投资逻辑的破坏条件很直接：杠杆没有披露支撑，增长没有信贷质量证明，扩张没有证据显示多元化正在提升盈利质量，而不只是抬高表层规模。
