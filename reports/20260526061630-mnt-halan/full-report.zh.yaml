    title: 市场规模视角 — TAM/SAM/SOM
    summary: >-
      这套三层规模金字塔，用公开市场份额和组合数据自下而上做代理。TAM 代表 MENA 更广泛的非银消费者和中小企业贷款机会，覆盖银行服务不足人群；SAM 反映 MNT-Halan 当前活跃的四个市场；SOM 以现有组合和 CEO
      公开给出的 2026 年目标为锚。
    approximationNotes: >-
      TAM 是数量级估算，采用 GSMA 区域规模、可比公司代理（Tabby 年化交易量 $10B+），以及隐含的埃及分部（$2.8B）、土耳其（$750M）、巴基斯坦（债务 / GDP 仅 3–4%，仍有大量空间）和
      GCC；没有单一分析师报告给出确定数字。SAM 使用四个市场的代理值。SOM 以 CEO 披露数字为锚。任何一层都不应视为经审计的市场研究估计。
