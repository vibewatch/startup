      - number: '7.2'
        title: 信贷质量、欺诈控制和资本市场依赖是核心运营风险
        blocks:
          - type: paragraph
            body: >-
              更关键的下行不是一次性的上线小故障，而是贷款质量、欺诈控制和外部融资之间的相互作用。公开报道清楚显示，MNT-Halan
              已经是一个大型放贷方，集团贷款账簿以数亿美元计，融资栈也越来越依赖公司债和证券化。应收资产健康时，这套结构效率很高；一旦资产恶化，反馈回路会更陡。Halan
              自身钱包条款保留了对疑似欺诈账户的暂停权，TechCrunch 2023 年报道还提到，尽管借贷仍是公司核心业务，管理层没有披露 NPL 比率。2025-2026
              年的债券和证券化报道强化了同一个解读：MNT-Halan
              在资本市场上更成熟，也更暴露于再融资环境、投资者胃口和投资组合表现审查。信贷压力、欺诈激增或投诉爆发因此会造成双重影响——先冲击运营，再通过融资可得性和定价冲击财务。
