      - number: '3.2'
        title: 直接和相邻同行画像显示战略形态不同，并不存在一个完美镜像对手
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，没有单一对手能完整镜像 MNT-Halan，但几家公司正在攻击堆栈里的关键部分。按公开证据看，Fawry 是最强的本土基准：其 1Q2026 文件显示季度收入 EGP 2.41
              billion，总贷款组合超过 EGP 6.18 billion，并横跨支付、金融服务和供应链产品。Paymob 资产负债表信贷更轻，但商户分销很强，覆盖五个 MENA 市场的超过 350,000
              商户，并提供超过 50 种支付方式。Khazna 是最相关的服务不足信贷重叠玩家，因为它的核心信贷已盈利，用户超过 500,000，并正尝试拿下能降低资金成本的数字银行牌照。区域层面，Tabby 和 Tamara
              证明，以分期为主的平台可以放大到数千万用户和数万商户；OPay、Kuda 和 M-PESA 则说明，消费者越来越期待一个钱包同时打包支付、储蓄和信贷。也就是说，MNT-Halan
              必须同时防守多个侧翼，而不是赢下一场简单的一对一产品战。
