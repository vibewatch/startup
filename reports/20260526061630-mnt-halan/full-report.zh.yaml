      - number: '4.3'
        title: 资本充足性越来越取决于债务市场执行，而不只是股权轮
        blocks:
          - type: paragraph
            body: >-
              在公开财务记录中，MNT-Halan 的资本结构是最清晰的差异点。公司 2024 年从 IFC 和既有投资者处融资 $157.5 million，此前 2023 年轮次把超过 $200 million 的
              Chimera 股权、$140 million 证券化债务，以及继续募集新股资本的路径结合在一起。IFC 文件独立确认，IFC 以股权投资形式投向 MNT Investments BV，项目在 2024
              年获批并完成投资。此后，融资组合进一步转向本地资本市场。2025 年公开报道显示，公司发行 EGP 2.5 billion 公司债，拥有更广义的 FRA 批准 EGP 8 billion 证券化计划，并完成第七期
              EGP 3.4 billion 证券化发行。新的债券市场报道补充称，2025 年 5 月 Tasaheel 发行拆成 EGP 2 billion 12 个月期和 EGP 500 million 36
              个月期两档，MERIS 评级 BBB+，CI Capital、KPMG Hazem Hassan 和 Matouk Bassiouny
              是核心交易顾问。这很重要，因为围绕信贷部门的机构资金基础设施看起来已经成形，而不只是一次性头条交易。债务窗口是打开的，但仍依赖宏观；Fitch 2024
              年主权评级上调提到债务市场资金流入恢复，但仍把埃及国内债务利息负担描述为极端；World Bank 2026 年融资包也明确瞄准更高效的国内债务市场和更低政府融资成本。这一模式意味着，MNT-Halan
              通过可重复债务工具为贷款账簿增长融资，而不只是靠新的风险投资轮。这在战略上是正面的，因为它可以降低稀释，并把资产支持型贷款与债务资本匹配起来；但也意味着资本充足性越来越依赖贷款表现、投资者胃口和运转正常的本地信贷市场。公开来源支持债务引擎逻辑，但没有披露当前流动性余量或债务契约压力。
