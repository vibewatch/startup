      - number: '7.4'
        title: 缓释因素可见，但公开尽调包仍然太薄
        blocks:
          - type: paragraph
            body: >-
              MNT-Halan 并非没有缓释因素。公开记录显示正式牌照、投诉升级路径、跨境批准，以及反复进入债务市场的能力。这些都是真实的机构化信号。问题在于，最能支持决策的监控指标仍是私有信息。现在仍没有公开的产品级
              NPL 披露，没有证券化栈的约束条款包，没有监管往来文件，也没有投诉或冻结看板，能让外部投资者测试运营控制是否和余额一样扩得够快。因此，分析师必须盯住
              否决条件，而不是直接获得舒适感。如果损失率扩大、市场融资收紧、投诉和争议处理时间恶化，或监管往来从批准转向整改要求，下行会走得很快，因为信贷和融资回路紧密相连。正确做法不是预设灾难，而是定义风险能够被有信心下调之前，必须拿到哪些精确指标和文件。
