  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "MNT-Halan has real, multi-market customer proof: the company discloses multi-million Egyptian user counts, app-download scale, active-borrower figures, inherited customer books in Pakistan and Turkey, and a fast-start UAE salary-finance business. The strongest independent customer-proof sources in this run are the app-store listings and Google Play reviews, which prove real production use but also surface meaningful customer-support friction on Android. My customer verdict is therefore positive on adoption breadth and channel reach, but cautious on durability because public disclosures still do not provide retention, renewal, churn, or concentration evidence strong enough for a full underwriting of customer quality."
  },
  "sections": [
    {
      "id": "segment-mix-and-adoption-surface",
      "title": "Segment mix: the public record supports a broad underbanked-user base spanning retail borrowers, merchants, SMEs, and employer-linked workers",
      "body": "MNT-Halan’s customer picture is broad, but the strongest evidence still clusters around financially underserved users rather than affluent prime-bank customers. Historical and current disclosures consistently point to small merchants, informal workers, wage earners, and retail borrowers as the core Egyptian base. AllBusiness explains that the earliest wedge came from motorcycle-taxi drivers, shop owners, and other unbanked workers; the GPCA case study adds women entrepreneurs as a major customer cohort; the current company page and Forbes profile update that story with multi-million user counts and app-download scale. Cross-border expansion extends the same pattern, but with local adaptations: Pakistan adds microfinance clients and planned branch growth, Turkey adds a business-heavy factoring base, and the UAE starts with salary-finance users tied to employers and exchange houses. What matters for underwriting is that the company appears to know who it serves and why those users are hard for traditional banks to reach. What remains weaker is the payer mix by product line and geography. Public pages do not break down which segments carry the most revenue, best repayment behavior, or the highest lifetime value.",
