    {
      "id": "expansion-and-concentration-risks",
      "title": "Expansion and concentration: channel leverage is clear, but dependency and concentration disclosures remain limited",
      "body": "Expansion is one of MNT-Halan’s clearest customer strengths and one of its least transparent underwriting areas. The company is not relying only on paid acquisition or one retail channel. Instead it uses merchant networks for BNPL, branch and bank infrastructure in Pakistan, a large SME book in Turkey, and employer or exchange-house partnerships in the UAE. Meatechwatch naming Al Ansari Exchange and Lean Technologies is especially helpful because it moves channel discussion beyond generic “partners” language. That said, the public record still stops short of telling investors how concentrated the customer base is by logo, by employer program, by merchant cohort, or by geography. Even Business Wire’s 246,000-contract data point is more helpful on granularity than on concentration. Because top-customer and channel mix are not disclosed, the right reading is not that concentration is necessarily dangerous, but that concentration is under-documented. The same is true for channel dependence. Public evidence proves these routes matter; it does not quantify how much revenue or repayment performance sits behind each of them. That leaves concentration as a real diligence workstream rather than a closed question.",
