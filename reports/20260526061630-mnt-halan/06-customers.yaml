    {
      "id": "durability-repeat-usage-and-satisfaction-gaps",
      "title": "Durability and repeat usage: the cross-sell logic is credible, but public retention evidence is still thin and customer-support risk is visible",
      "body": "The best public retention signal is conceptual rather than metric-heavy. MNT-Halan’s whole product strategy is built around keeping users inside one ecosystem for more than one financial need: borrow, repay, transfer, pay bills, shop, use cards, and potentially add savings or investment behavior. The Fintech Times article explicitly says that using more services reduces churn and improves lifetime value, and Halan.com broadens the repeat-use case with cards, larger limits, and additional product categories. That logic is believable. What is not public is hard durability data. None of the reviewed sources disclose NRR, GRR, logo churn, renewal rates, contract term, or cohort retention by segment or geography. In the absence of those metrics, app-store evidence becomes more valuable. Apple’s 4.6 rating suggests a healthy satisfied-user cohort on one platform, but Google Play’s 2.3 rating and detailed complaints about logins, card activation, investment transfers, and weak support show that customer experience quality is uneven. The result is a chapter where repeat-use logic is plausible, but customer durability still cannot be cleanly underwritten from public evidence alone.",
