    {
      "id": "adoption-trajectory-and-public-proof",
      "title": "Adoption trajectory: aggregate growth signals are strong, while named proof is deepest in app stores and selected market-specific disclosures",
      "body": "The adoption story is clearly real, but it is unevenly evidenced. At the aggregate level, official pages, LinkedIn, FinTech Global, Forbes, AGBI, and Empower Africa all tell the same directional story: customer counts have moved from the 5-million range in 2023 to 7 million plus in Egypt and 8 million plus across markets by 2025 or 2026, while active-user figures range from 1.3 million monthly in 2023 to roughly 2 million active users or 2.2 million quarterly active users in 2024 and 2.5 million active customers in the 2025 LinkedIn update. Cross-border customer proof also exists. Pakistan brought a 62,000-client bank and later a 200,000-customer target, Turkey brought a 50,000-plus business customer base through Tam Finans, and UAE disclosures moved from 40,000 customers at launch to 100,000 earned wage access loans and later 220,000 borrowers or 1.5 million payment users depending on the date and product. Named proof is thinner but still meaningful. The strongest current named end-user proof is actually public app-store evidence: thousands of ratings plus detailed reviews describing real production use, both positive and negative.",
