  enumerationScope:
    coverage: partial
    basis: Rows cover the public monetization surfaces visible from official pages and 2024-2025 coverage, not a management-certified revenue segmentation.
  rows:
  - - Business and consumer lending
    - Interest income and fees from nano, micro, SME, payroll, and consumer loans
    - Loan principal and repayment terms vary by product
    - Clearly core to the business
    - Potentially high yield but balance-sheet intensive
    - Request portfolio yield, loss rates, and margins by product
  - - BNPL
    - Merchant-supported or consumer installment financing
    - Up to EGP 200,000; installments up to 36 months
    - Publicly marketed
    - Good growth lever but economics undisclosed
    - Request approval rates, take rates, and loss assumptions
  - - Digital payments and wallets
    - Wallet transfers, bill payment, card, collection, and throughput fees
    - Homepage cites $100m+ monthly throughput
    - Publicly active
    - Potentially recurring and high-frequency
    - Request fee take rate and active user monetization
  - - Commerce / e-commerce
    - Home appliances, electronics, FMCG, merchant and consumer commerce flows
    - Homepage cites $50m+ monthly sales
    - Publicly active
    - Can feed lending but margin quality unclear
    - Request gross merchandise value versus recognized revenue
  - - Investments and ancillary finance
    - Gold and money-market-fund distribution plus related wallet activity
    - Product present in app ecosystem
    - Publicly described but not segmented
    - Could improve wallet stickiness and cross-sell
    - Request contribution revenue and attach rate by product
  notes: Public sources confirm multiple monetization surfaces but do not disclose product-level revenue contribution, margin, or recognition policy.
