- id: public-traction-and-unit-economics
  title: Public traction is strong, but unit economics remain largely private
  body: The public traction story is substantial. Forbes reported more than $11 billion of cumulative loan disbursements, over 8 million customers, $4.2 billion of 2024 transactions, 11.7 million downloads, and 2 million active users by December 2024. AGBI added that the group loan book had reached about $1.3 billion by 2025, including more than $700 million in Egypt, and that the company lent more than $2.2 billion in 2024 alone. Entrepreneur also cited 1.1 million active borrowers and more than 2.3 million people served quarterly. Apis Partners’ July 2024 transaction release added +2.2 million quarterly active users, 5 million financial clients, and 3 million borrowers in Egypt after more than $4.4 billion of loans disbursed, which helps triangulate operating density even though it is partner-carried company data. Those are strong traction signals, but they are not the same as clean unit economics. Public sources do not disclose gross margin, net interest margin, delinquency, customer-acquisition cost, payback period, or cohort retention. Even the best public revenue figure — the roughly $300 million figure cited around the 2023 round and later descriptions of revenue in the hundreds of millions — is too old or too broad for a precise 2026 run-rate model. The conclusion
    is not that economics are weak; it is that public traction materially exceeds public unit-economics transparency.
