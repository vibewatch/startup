  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: A management-quality split of revenue between lending, payments, commerce, treasury, and investment products by market.
    whyItMatters: Without revenue mix, investors cannot tell whether growth is coming from recurring payment behavior, risky credit expansion, or low-margin commerce.
    diligencePath: Request segment revenue, gross profit, take rate, and contribution margin by product and geography.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: margin-disclosure
    missingEvidence: Actual gross margin, net interest margin, default rates, and credit-loss ratios by lending product.
    whyItMatters: Unit economics and valuation depend on whether scale is being bought through thin-margin or loss-making credit.
    diligencePath: Request vintage curves, NPL data, loss reserves, and gross margin by product line.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt maturities, covenant headroom, and runway under base and stress cases.
    whyItMatters: Capital adequacy cannot be fully underwritten without liquidity data and debt-service obligations.
    diligencePath: Request board reporting on liquidity, cash bridge, debt schedule, and 12-24 month funding plan.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI020
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: regulatory-risk
    missingEvidence: Company-specific delinquency and provisioning data showing how MNT-Halan would perform if Egypt tightens consumer-finance supervision.
    whyItMatters: Macro caution is visible, but company-specific resilience is not.
    diligencePath: Request stress-test outputs, provisioning policy, and regulator correspondence tied to credit-risk oversight.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
