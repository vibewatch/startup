  rows:
  - - BNPL
    - Up to EGP 200,000 credit line with installment terms up to 36 months
    - List terms partially visible
    - Strong customer messaging but not enough for unit-economics modeling
    - Need effective APR, subsidies, and default-rate disclosure
  - - Microfinance
    - Loans up to 200,000 EGP with decision in about 3 working days
    - List-style customer promise only
    - Suggests fast distribution and underwriting workflow
    - Need average ticket, yield, and acquisition cost
  - - SME lending
    - 200,000 EGP to 5,000,000 EGP public ticket range
    - List-style product range only
    - Shows broader TAM than consumer-only fintechs
    - Need average loan size, tenor, and risk-adjusted return
  - - Payroll lending / salary finance
    - Salary advances up to 80% on the homepage; UAE Halan Advance product launch
    - Mechanics visible, realized pricing not public
    - Potentially sticky, payroll-linked revenue stream
    - Need employer contracts, fee split, and repayment curves
  - - Wallet and payments
    - No public fee card in fetched pack
    - Realized pricing not public
    - Payments could be high-frequency but low-margin
    - Need take rate, active wallet monetization, and merchant pricing
  notes: MNT-Halan’s public materials are clearer on product access than on realized pricing. This is enough to map surfaces, not enough to model normalized revenue per user.
