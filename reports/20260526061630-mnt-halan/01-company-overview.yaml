  - id: section-O3
    title: Capital base, investor map, and funding history
    body: >
      MNT-Halan has assembled a multi-layered capital base that spans equity rounds, securitized debt, and corporate
      bonds. The first institutional raise of $120 million came in September 2021 from Development Partners International
      (DPI), Apis Growth Fund II, and Lorax Capital Partners. The landmark round came in January 2023 when Chimera Abu
      Dhabi — a private investment firm managing a diversified portfolio of listed and unlisted equities — invested more
      than $200 million in equity in exchange for over 20% of the company. Alongside $140 million in securitized bond
      issuances (through subsidiaries Tasaheel Microfinance Company and Halan Consumer Finance with CIB as arranger),
      and additional equity from international investors, MNT-Halan's valuation crossed $1 billion, making it Egypt's
      first fintech unicorn. In July 2024 the company raised a further $157.5 million ($40 million from the IFC and the
      remainder from DPI, Lorax, Apis Partners, Lunate, and GB Corp) to fund the Turkey and Pakistan acquisitions and
      GCC expansion.


      As of July 2024, the company had raised more than $630 million in equity and debt (TechCrunch). A broader figure
      of $722 million was cited by The FinTech Times in mid-2024, reflecting additional structured debt issuances.
      MNT-Halan has since scaled its use of capital markets aggressively: the company completed a $49 million corporate
      bond issuance in May 2025 (rated BBB+ by MERIS), closed a fourth securitized bond issuance of EGP 3.4 billion
      under its EGP 8 billion FRA-approved program in October 2025, and plans EGP 40-50 billion in debt issuances
      for 2026. A regional IPO is described as a near-term objective (12-18 months from late 2025 reporting), which
      would represent a significant governance and transparency step-change. IFC's project disclosure (MNT Group, SII
      project 46427) independently confirms the international development-finance institution's investment.
