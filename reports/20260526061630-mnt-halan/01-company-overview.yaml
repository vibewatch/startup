  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-current
      missingEvidence: >-
        Post-2023 equity valuation mark; no public round or secondary transaction has established a new valuation
        since the $1B+ unicorn round in January 2023, other than directional statements that valuation remains above $1B.
      whyItMatters: >-
        A 2025 or 2026 valuation is required to benchmark decacorn ambition, assess the IPO price range, and analyze
        dilution in later securitization structures.
      diligencePath: >-
        Request most recent board-approved 409A or fair-value assessment; review any convertible notes or secondary
        trades that have established a new reference price.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO001

    - type: missing-source
      severity: material
      topic: governance-board-composition
      missingEvidence: >-
        Full board composition, independent director identities, committee structure, and governance documents
        are not publicly available. Key-person risk for Mounir Nakhla is asserted but not measured against
        documented succession or board-override mechanisms.
      whyItMatters: >-
        Board structure is a foundational diligence item for the IPO scenario and for investors relying on governance
        as a risk mitigant.
      diligencePath: >-
        Request articles of association, shareholder agreements, board minutes and composition, and any governance
        reports prepared for the IFC or other development-finance investors.
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: material
      topic: cap-table-detail
      missingEvidence: >-
        Equity ownership percentages for all investors other than Chimera Abu Dhabi (20%+) and founders are not
        publicly disclosed. The exact allocation of the 2021 and 2024 rounds across DPI, Lorax, Apis, Lunate, and
        GB Corp is unknown from public sources.
      whyItMatters: >-
        Cap table detail is necessary to assess dilution, alignment, control provisions, drag-along rights, and
        the implications of the planned IPO on existing holders.
      diligencePath: >-
        Request full capitalization table from management, including fully-diluted equity and any outstanding
        options, warrants, or convertibles.
      relatedQuestionRefs:
