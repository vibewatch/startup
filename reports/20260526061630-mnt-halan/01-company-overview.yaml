company:
  name: MNT-Halan
chapter:
  number: 1
  title: Company Overview
  summary: >-
    MNT-Halan is Egypt's first fintech unicorn: a Cairo-based financial superapp founded in 2018 that pivoted from
    ride-hailing to become the country's largest non-bank lender to the unbanked, with a $1B+ valuation achieved in
    January 2023. It has disbursed over $12 billion in loans, serves more than 8 million customers globally, and holds
    a $1.3 billion gross loan book across Egypt, Turkey, Pakistan, and the UAE. The capital base exceeds $630 million in
    equity and debt raised. IPO and decacorn ambitions are on record for 2026-2027. Key diligence risks include
    leadership concentration in CEO Mounir Nakhla, rapid leverage through securitization, and a May 2026 regulatory
    warning from Egypt's largest private bank about non-bank consumer finance bubble risks.
sections:
  - id: section-O1
    title: Identity, product scope, and operating model
    body: >
      MNT-Halan positions itself as Egypt's leading fintech ecosystem and the country's largest non-bank lender to the
      unbanked and underbanked. The name combines the initials of MNT Investments B.V., a Netherlands-based micro-lending
      specialist that was an early institutional backer, with "Halan", an Egyptian Arabic word meaning "now" — reflecting
      the company's focus on instant, frictionless financial access. The company was formally incorporated in 2018 when
      co-founders Mounir Nakhla and Ahmed Mohsen launched Halan as a two- and three-wheeler ride-hailing app in Egypt.
      After 18 months of initial operations, the team spent that same period building Neuron, its proprietary API-First
      Core Banking platform, before pivoting fully to fintech in 2019 and merging with MNT Investments.


      The operating model is built around a financial superapp that bundles micro and small-business lending, consumer
      finance, BNPL (buy now, pay later), prepaid cards, e-wallets, digital payments, e-commerce, gold and money-market
      fund investments, and payroll-linked salary advances under a single mobile interface. Lending is the primary revenue
      driver and balance-sheet engine; the complementary payments and e-commerce services deepen customer engagement and
      reduce churn. MNT-Halan describes its credit approach as data-driven: where applicants lack formal credit histories,
      the system uses alternative data such as transaction history on the platform. The company holds regulatory licenses
      from Egypt's Financial Regulatory Authority (FRA) for micro, SME, consumer, and nano finance, and holds what it
      describes as the first independent electronic wallet license issued by the Central Bank of Egypt (CBE). These
      licenses are structural moats that took years to secure. Headquarters are in Giza (greater Cairo), Egypt.
      The Halan app had been downloaded 11.7 million times and had 2 million active users as of December 2024, with
      $4.2 billion in transactions processed during 2024 alone.
