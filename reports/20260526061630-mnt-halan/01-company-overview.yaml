  - id: section-O2
    title: Leadership, governance, and key-person dependence
    body: >
      MNT-Halan was co-founded by Mounir Nakhla (Chairman and CEO) and Ahmed Mohsen (Co-founder and CTO). Nakhla has
      been the dominant public face of the business since inception and has more than a decade of prior experience
      building brick-and-mortar lending and financial services businesses in Egypt before pivoting to tech. He has cited
      a 2017 visit to Gojek in Indonesia as the catalyst for the company's mobile-first, superapp vision. Mohsen
      architected Neuron, the company's proprietary core banking system, and leads technology. Together they represent
      a classic founder-market-fit pairing: a commercial/distribution expert and a technical builder, both with domain
      knowledge in Egypt's underserved credit markets.


      The leadership team has expanded with regional operations heads. Omar Ramadan serves as Managing Director of Halan
      GCC, overseeing UAE and Saudi expansion. Hakan Karamanlı is CEO of Tam Finans, the Turkish subsidiary acquired in
      July 2024. Andre Valavanis serves as VP of Investment and Corporate Strategy. Key-person risk is significant:
      Nakhla drives strategy, capital-raising relationships, and the company's public narrative. There is limited public
      disclosure of a formal succession plan or an independent board with power to override the CEO. Governance
      documentation that would satisfy a listed-company standard is not available through public channels and must be
      requested in diligence. LinkedIn shows 1,567 employees publicly linked to MNT-Halan with a company-stated size of
      10,001+, suggesting a larger extended workforce including on-ground distribution agents and financed subsidiaries.
