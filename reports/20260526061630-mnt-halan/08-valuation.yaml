company:
  name: MNT-Halan
chapter:
  number: 8
  title: Valuation
  summary: MNT-Halan has enough operating scale and funding momentum to justify a clear step up from its
    original unicorn anchor, but the public record still does not provide audited consolidated disclosure
    strong enough for a clean premium multiple. The best-supported call on current evidence is therefore
    research-more / track with medium confidence and a fair-to-stretched valuation stance.
sections:
- id: valuation-anchors-and-price-support
  title: Valuation anchors support a higher late-stage price, but the bridge is still disclosure-light
  body: MNT-Halan’s public valuation story starts with a clear 2023 unicorn anchor and then moves into
    more ambiguous territory. The 2023 financing package combined large equity capital with securitized
    debt and was described by both BusinessWire and TechCrunch as taking the company to roughly or above
    the US$1 billion mark. The 2024 round then added US$157.5 million, while later profiles pushed total
    funding to about US$550 million and highlighted continued operating scale in customers and transactions.
    Those facts support a higher late-stage valuation than the original unicorn mark. What they do not
    yet provide is a clean, audited bridge from funding history to intrinsic value. The public record
    shows a group with meaningful scale, aggressive credit growth, and improving international breadth.
    It does not yet show the sort of consolidated, audited revenue and loss disclosure that would let
    investors underwrite a precise premium multiple with confidence. The anchor is real; the precision
    is not.
  claimRefs:
