  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited consolidated revenue, profitability, balance-sheet, and cost-of-risk disclosure
      for the full group.
    whyItMatters: Without audited consolidated financials, valuation remains anchored to funding events
      and proxy comps rather than to a clean operating model.
    diligencePath: Request audited FY2025/FY2026 statements and a management bridge from loan-book growth
      to revenue and profit.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: Preference stack, covenants, collateral package, and dilution terms across debt and
      equity financings.
    whyItMatters: Entry economics can change materially if downside outcomes are absorbed differently
      across instruments.
    diligencePath: Request current cap table, debt term sheets, trust-deed summary, and any investor side-letter
      constraints.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: geographic-margins
    missingEvidence: Revenue, margin, and cost-of-risk mix by Egypt, Turkey, Pakistan, and the UAE.
    whyItMatters: Expansion only improves valuation quality if new geographies improve or stabilize earnings,
      not just headline TAM.
    diligencePath: Request country-level management reporting and audited segment notes.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: vintage-loss-data
    missingEvidence: Vintage loss, delinquency, and recovery data by lending product and geography.
    whyItMatters: A debt-funded growth model cannot be stress-tested credibly without product-vintage
      credit data.
    diligencePath: Request warehouse tapes, rating packs, and vintage curves used in recent securitization
      processes.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Board, governance, auditor, and listing-readiness milestones for any IPO process.
    whyItMatters: The recommendation can move materially if IPO readiness is real rather than only aspirational.
    diligencePath: Request IPO workplan, bank engagement letters, governance charter set, and public-company
      readiness timetable.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV005
  - type: missing-source
    severity: material
    topic: TV004 comparable coverage
    missingEvidence: A fuller comparable-set bridge linking public-market data, private rounds, and official
      filings for every selected comp.
    whyItMatters: The valuation table is intentionally partial, so readers need a named gap documenting
      what remains outside the exhibit.
    diligencePath: Extend the comp book with additional public filings, market-cap pages, and directly
      comparable MENA fintech rounds.
    relatedTableRefs:
    - TV004
