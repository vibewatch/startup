- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / date
  - Anchor
  - Relevance to MNT-Halan
  - Limitation
  rows:
  - - MNT-Halan 2023 financing
    - Private, Jan 2023
    - ~US$1.0B to >US$1.0B valuation anchor
    - Clear starting point for current valuation bridge
    - Old and based on a private funding event, not a public market price.
  - - MNT-Halan 2024 round
    - Private, Jul 2024
    - US$157.5M additional capital; total funding later cited at US$550M
    - Shows continued investor support and financing momentum
    - Did not publicly publish a new headline valuation.
  - - Fawry
    - Listed Egypt fintech, 1Q26 / Apr 2026
    - ~US$1.3B market cap with disclosed revenue and profitability
    - Best local public disclosure benchmark
    - Different business mix and public-company discipline.
  - - Nu Holdings
    - Listed global fintech, May 2026
    - US$61.88B market cap
    - Upper-bound reminder of what large disclosed fintechs can be worth
    - Far larger geography, disclosure, and earnings depth.
  - - Tabby
    - Private MENA fintech, Feb 2025
    - US$3.3B valuation
    - Regional proof that multi-billion fintech pricing is possible
    - BNPL-led model is narrower and less balance-sheet heavy.
  - - Tamara / OPay / Kuda / M-Pesa
    - Mixed peer set, 2025-2026 product pages
    - Business-model comparators rather than clean valuation anchors
    - Useful for framing where MNT-Halan sits on the payments-to-credit spectrum
    - Not all provide public valuation or equivalent disclosure.
  notes: This table is intentionally selective. It covers the most decision-useful valuation anchors and
    comp lenses rather than every imaginable emerging-market fintech.
