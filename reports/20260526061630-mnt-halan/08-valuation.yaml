- id: public-and-regional-comparables
  title: 'Comparable work argues for discipline: MNT-Halan is larger than small Egyptian fintechs, but
    not yet as transparent as listed leaders'
  body: 'The comp set is mixed by necessity. Fawry is the most useful local public benchmark because it
    shows what a disclosed Egyptian fintech can look like in revenue, profitability, and market value.
    Fawry’s 1Q2026 release showed a large profitable platform with strong margins, while TechCabal’s 2026
    profile put market capitalization at roughly US$1.3 billion. Nu Holdings sits at the opposite end
    of the spectrum: a publicly listed Latin American fintech with a May 2026 market capitalization above
    US$60 billion, but also one that benefits from far deeper disclosure and a much broader investor base.
    Regional private comps are helpful too. Tabby’s US$3.3 billion valuation shows that MENA investors
    will support multi-billion fintech pricing when the platform is scaling rapidly and the market believes
    in the product expansion path. Yet Tamara, OPay, Kuda, and M-Pesa also show why peer selection matters.
    Payments-heavy or ecosystem-heavy models can look similar from a distance while carrying very different
    balance-sheet risk, credit intensity, and disclosure quality.'
  claimRefs:
