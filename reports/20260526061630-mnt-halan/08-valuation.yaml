  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more / track
    - Do not pay for a full public-market rerating before audited disclosure arrives.
  - - Confidence
    - medium
    - The public record is directionally supportive but still incomplete on core underwriting variables.
  - - Risk rating
    - high
    - Debt-funded growth and incomplete disclosure can reprice the case quickly.
  - - Valuation stance
    - fair-to-stretched
    - The company has scale and momentum, but margin of safety is not obvious from public evidence.
  - - Cleanest public anchor
    - 2023 US$1B unicorn mark plus later funding and scale updates
    - Useful as a floor for serious late-stage status, not a precise 2026 intrinsic value.
  - - Upgrade trigger
    - Audited consolidated financials plus clean IPO-readiness evidence
    - Would justify tighter comp work and a more constructive entry view.
  - - Primary downside trigger
    - Leverage or issuance ramps ahead of disclosure quality
    - Would pull the story closer to a credit-risk multiple than to a platform premium.
  notes: This recommendation is intentionally price-sensitive and evidence-sensitive. It reflects the
    strength of the public record today, not a claim that MNT-Halan lacks long-term upside.
