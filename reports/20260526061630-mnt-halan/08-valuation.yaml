- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Supportive evidence
  - Counterweight
  - What would change the view
  rows:
  - - Scale
    - Millions of customers, billions of dollars of transactions, and a >US$1bn loan book show real platform
      relevance.
    - Scale is not yet paired with audited consolidated profit and risk disclosure.
    - Publish audited revenue, margin, and loss data.
  - - Funding access
    - Repeated equity and debt access suggest institutional confidence.
    - The same funding record increases dependence on debt-market conditions and portfolio quality.
    - Show durable access to capital on stable terms through a full cycle.
  - - Regional expansion
    - Turkey, Pakistan, and UAE entry broaden TAM and strategic optionality.
    - Expansion remains operationally unfinished and still concentrated in a small set of markets.
    - Provide country-level revenue and margin proof that diversification is accretive.
  - - Public-comp support
    - Fawry and Nu show fintechs can command large values with disclosed performance.
    - MNT-Halan is not yet disclosed like a public company and carries more balance-sheet credit risk.
    - Deliver public-company-grade reporting and governance.
  - - Regional private-comp support
    - Tabby shows MENA fintechs can reach multi-billion valuations.
    - Peer business models and balance-sheet intensity differ materially.
    - Clarify where MNT-Halan belongs on the payments-to-credit spectrum.
  notes: The anti-thesis is driven by disclosure quality and balance-sheet sensitivity rather than by
    disbelief in the company’s scale.
