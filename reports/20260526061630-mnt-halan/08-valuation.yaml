- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation logic
  - Range view
  - What must be true
  rows:
  - - Bear
    - 25%
    - Markets price MNT-Halan closer to disclosed local fintechs if leverage outpaces transparency.
    - US$1.1B-US$1.8B
    - Debt growth slows, disclosure lags, and investors lean on conservative local comp frameworks.
  - - Base
    - 50%
    - Company preserves late-stage premium over the original unicorn anchor but still trades at a discount
      to regional aspirational narratives.
    - US$1.8B-US$2.8B
    - Growth continues, debt markets stay open, and key diligence items improve but do not fully clear.
  - - Bull
    - 25%
    - Public-company readiness and credit performance justify moving toward regional multi-billion peer
      territory.
    - US$2.8B-US$4.0B
    - Audited financials, strong loss control, and credible IPO readiness all arrive together.
  - - Central view
    - 100%
    - Weighted toward a scaled but still disclosure-constrained credit platform.
    - around US$2.3B-US$2.5B
    - Enough evidence for a premium to the old unicorn mark, not enough for an unconstrained rerating.
  notes: Scenario ranges are analytical judgments derived from public anchors, comp discipline, and the
