- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Implied valuation
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bear
    - Lower-margin mix stays heavy, integration drags, and public disclosure never proves premium economics.
    - US$1.2B - US$1.6B
    - About 6x-8.5x annualised revenue; range compresses toward de-rated public comp behaviour.
    - Material if FY27 evidence still shows margin drag and no clean standalone KPI pack.
    - Margin dilution, slower growth, and strategic premium collapse.
  - - Base
    - Melio remains strategically useful to Xero, synergies progress, but standalone disclosure still only partly improves.
    - US$1.7B - US$2.1B
    - About 9x-11x annualised revenue; respects the 2024 round but discounts the 2025 strategic-control premium.
    - Highest-likelihood path on current evidence.
    - Evidence quality remains moderate and the range is still sensitive to one or two missing metrics.
  - - Bull
    - Cross-sell, syndication, and distribution convert into strong growth while H2 FY28 breakeven remains credible.
    - US$2.3B - US$2.8B
    - About 12x-15x annualised revenue; much of the strategic premium is earned back through execution.
    - Low until Xero or Melio publishes clearer mix, margin, and earnout proof.
    - Requires synergy delivery and much better disclosure than the market has today.
  notes: Scenarios are deliberately range-based because current public evidence is strong on anchors and weaker on standalone operating detail.
