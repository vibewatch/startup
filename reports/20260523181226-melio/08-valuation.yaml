- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - BILL
    - LTM revenue / EV / gross margin
    - US$1.60B revenue; US$3.31B EV; ~2.07x EV-revenue; ~83.7% gross margin
    - Closest listed hybrid software-plus-payments benchmark in the retained set.
    - Public multiple is de-rated and reflects a larger, more diversified business than standalone Melio.
  - - AvidXchange
    - LTM revenue / EV / gross margin
    - US$446.72M revenue; US$1.74B EV; ~3.91x EV-sales; ~72.5% gross margin
    - Useful AP-automation and buyer-supplier workflow analogue.
    - Growth is much slower and the company was moving off public markets, which can distort comp cleanliness.
  - - Xero
    - TTM revenue / EV / margin / multiple
    - AUD2.29B revenue; AUD10.14B EV; 83.9% FY26 gross margin; ~4.96x EV-revenue
    - Current owner and clearest benchmark for what a rich software platform can trade at in public markets.
    - Xero's core software mix is structurally richer than Melio's payments-heavy revenue model.
  - - Melio Series E (2024)
    - Private round
    - US$2.0B post-money mark; rough ~10.7x on March 2025 annualised revenue
    - Latest pre-sale private mark and best venture-era reference.
    - Set before full Xero control and without the disclosure depth needed to make it a precise reusable mark.
  - - Xero acquisition (2025)
    - Strategic control transaction
    - US$2.5B upfront plus up to US$0.5B contingent; ~13.4x upfront multiple or ~9.7x including FY28 synergy credit
    - Hardest observable transaction anchor in the file set.
    - Embeds buyer-specific synergies, control value, and employment-linked contingent consideration rather than plain minority value.
  notes: Comparable set intentionally mixes public comps, the 2024 private round, and the 2025 control transaction because Melio no longer fits a single-model comp framework.
  enumerationScope:
    coverage: partial
    basis: Covers the public and private valuation references most relevant to Melio's current hybrid software-plus-payments ownership context, but does not attempt an exhaustive fintech or payments comp universe.
