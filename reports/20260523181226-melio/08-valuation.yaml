  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-opacity
    missingEvidence: A clean revenue split between subscriptions, payment fees, float, and syndication for the post-close Melio business.
    whyItMatters: Without revenue mix, investors cannot tell how much of Melio deserves SaaS-like multiples versus lower-margin payments multiples.
    diligencePath: Request a post-close revenue bridge by product and channel plus historical mix back to FY25.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: contingent-trigger-opacity
    missingEvidence: Exact outperformance thresholds, rollover mechanics, and current tracking for the up-to-US$0.5 billion contingent package.
    whyItMatters: The maximum strategic value is not reusable unless investors know how much of it is realistically earnable.
    diligencePath: Request the earnout framework, milestone scorecard, and leadership-retention status from Xero or Melio management.
    relatedQuestionRefs:
    - QV016
    - QV031
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: standalone-margin-ebitda
    missingEvidence: Standalone gross margin by rail, payment take rate, and a pre-synergy EBITDA or burn bridge.
    whyItMatters: The biggest reason the chapter stops at research-more is that current public evidence does not prove minority-value economics independently of Xero.
    diligencePath: Request monthly management accounts, margin by product, and a pre-synergy operating plan under NDA.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV004
    - TV006
  - type: missing-source
    severity: material
    topic: post-close-cap-table-and-rollover
    missingEvidence: A post-close view of rollover equity, preference clean-up, and any remaining economic overhang relevant to a new minority entry.
    whyItMatters: The acquisition removed some classic venture-cap-table noise, but investors still need to know whether any rollover or contingent economics distort a fresh valuation mark.
    diligencePath: Request the post-close cap-table summary and any continuing rollover terms tied to management or former shareholders.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
