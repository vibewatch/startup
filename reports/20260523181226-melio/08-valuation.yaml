- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'Thesis: Melio has real scale and strategic scarcity in US SMB bill pay.'
    - 80,000 customers, >US$30B FY25 payments, US$153M FY25 revenue, and partner distribution support real strategic value.
    - Fresh FY27 disclosure showing the scale is monetising into durable margin and cash generation would strengthen the thesis.
  - - 'Thesis: Xero paid for control and explicit synergies, not just current revenue.'
    - Xero disclosed ~US$70M of FY28 revenue synergies, ~US$20M of cost synergies, and a much larger North America revenue base post-close.
    - Proof that synergy capture is on track and not simply deal-model optimism would justify a richer view.
  - - 'Anti-thesis: The 2025 price is well above public comp levels.'
    - Public EV-revenue comps for BILL, AVDX, and Xero sit around 2.1x to 5.0x versus Xero's 13.4x upfront multiple for Melio.
    - If Melio discloses premium growth, margin, and take-rate quality, the gap to public comps could become more defensible.
  - - 'Anti-thesis: Payments mix drags margin quality versus pure SaaS.'
    - Xero's FY26 materials explicitly say Melio lowers gross-margin profile and only reaches run-rate adj-EBITDA breakeven in H2 FY28.
    - Standalone gross margin by rail and EBITDA bridges would show whether the mixed margin profile is already normalising.
  - - 'Anti-thesis: Critical valuation inputs remain private.'
    - Revenue mix, contingent-trigger thresholds, take rate, burn, and post-close revenue-quality metrics are still not public.
    - A diligence pack with mix, margin, burn, and earnout scorecards would narrow the range and could move the call toward fair.
  notes: Each row links the current view to the specific evidence that would move it.
