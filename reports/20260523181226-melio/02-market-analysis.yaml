tables:
- id: TM001
  title: Market definition table
  columns:
  - Market slice
  - Included spend / workflow
  - Excluded spend / workflow
  - Buyer / payer
  - Why it matters
  rows:
  - - Accounting-led SMB bill pay and AP
    - Supplier bill entry, approvals, payment execution, reconciliation, and cash-flow management inside accounting-led workflows
    - Full consumer payments, payroll, lending, and generic POS acquiring
    - Owner, finance admin, controller, or accountant on behalf of the SMB
    - This is the narrow market Xero actually described when it launched embedded bill pay and cited the $29B TAM.
  - - Standalone SMB AP automation
    - Invoice capture, approval routing, vendor payment orchestration, and audit trail outside the core GL
    - Broad ERP transformation or enterprise procurement suites
    - Controller, finance lead, or outsourced bookkeeper
    - Melio competes here when sold standalone or via accountants, even before full Xero embedding.
  - - Embedded bank or vertical SaaS bill pay
    - White-label or syndicated payment workflows delivered through banks or vertical software
    - Direct-to-consumer banking or unrelated SaaS monetization
    - Bank partner, SaaS platform owner, and SMB operator
    - This channel expands reach to pre-accounting customers and raises the market beyond direct software seats.
  - - Status-quo manual rails
    - Printed checks, manual bank transfers, spreadsheet approvals, and disconnected bookkeeping handoffs
    - Fully automated end-to-end AP with live reconciliation
    - Small-business operator ultimately funds the payment and labor cost
    - The status quo remains the main substitute and explains why rail modernization alone does not equal software adoption.
  - - Adjacent financial operations
    - A/R, working-capital lending, payroll, and cross-border treasury products
    - Core domestic supplier-bill workflow inside the current embedded launch
    - Broader finance stack buyer rather than a single AP budget owner
    - These adjacencies matter for long-term platform expansion but should not inflate current SAM.
  notes: Included market is accounting-led SMB AP and bill pay. Adjacencies such as A/R, payroll, lending, and most cross-border workflows are tracked separately so TAM and SAM stay comparable.
