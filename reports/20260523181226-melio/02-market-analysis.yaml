  evidenceGaps:
  - type: missing-source
    severity: material
    topic: integration-penetration
    missingEvidence: A current third-party estimate of the exact share of US SMBs that already use integrated accounting and AP software.
    whyItMatters: Without a penetration baseline, the chapter can size demand but cannot separate true whitespace from already-satisfied demand with precision.
    diligencePath: Request survey crosstabs or vendor-side market-share studies from Xero, Intuit, BILL, or independent market researchers that quantify integrated AP usage by business size.
    relatedQuestionRefs:
    - QM018
  - type: private-evidence-only
    severity: material
    topic: post-close-conversion
    missingEvidence: Post-close active-user counts, attach rates, payment take rates, retention, and cohort conversion metrics for Xero-powered Melio usage.
    whyItMatters: Current SOM math relies on pre-close Melio run-rate data rather than verified post-integration adoption or monetization.
    diligencePath: Ask management for post-close KPI packs showing active payers, ARPU, transaction margins, and retention by direct and syndicated channel.
    relatedQuestionRefs:
    - QM027
  - type: missing-source
    severity: material
    topic: tam-segmentation
    missingEvidence: A public breakdown of the $29B TAM by employer size, industry vertical, or workflow type.
    whyItMatters: The chapter can estimate a SAM from integration-demand ratios, but it cannot isolate the highest-yield subsegments without a disclosed TAM decomposition.
    diligencePath: Request Xero's TAM backup or third-party market models showing how the TAM splits across employer bands, verticals, and pre-accounting channel cohorts.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM002
