      - number: '2.2'
        title: TAM、SAM 与 SOM 测算
        blocks:
          - type: paragraph
            body: >-
              给 Melio 测算市场，最干净的方法是一次只用一种计量口径。Xero 给出的顶层收入池 TAM 是 U.S. SMB 支付， 规模为 $29 billion。随后，公开买方需求证据支持把该数字收窄成会计驱动的
              SAM，而不是假设整个 TAM 今天都同样可触达。 Xero 称，超过 70 percent 的 U.S. SMB 高度重视集成式会计与 AP；收购报道引用的类似数字略高，约 78
              percent。用这些比例推算，会计驱动部分的可服务范围约为 $20.3 billion 至 $22.6 billion。


              SOM 必须保持克制，因为公开变现证据仍是交割前口径。Tech Funding News 称，Melio 在 FY25 处理了超过 $30 billion 支付，March 2025 年化收入为 $187
              million。这支持一个当前 SOM 代理值： 仅约 $29 billion TAM 的 0.6 percent。按买方数量看，分母也会明显收窄：SBA 的 36.2 million
              小企业总量，在剔除非雇主企业后降至 6.4 million 雇主企业。市场很大，但可服务部分明显小于标题数字暗示的规模。
