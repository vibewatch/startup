      - number: '7.3'
        title: 伙伴集中、竞争和收购整合会很快传导到增长质量
        blocks:
          - type: paragraph
            body: >-
              Melio 不只是独立 AP 工具，也是一个嵌入式支付网络，分销依赖具名伙伴和收购后的承诺。官方材料把 Melio 与 Fiserv、Capital One、Shopify、Clover 和 Gusto
              绑定在一起；Xero 交易材料则把 Melio 的联合分销网络描述为一条路径，可借助数千家金融机构触达数百万美国
              SMB。这套架构是资产，但也带来集中风险：伙伴政策变化、整合延迟或渠道优先级调整，都可能直接流入支付量和获客。Xero 交易让挑战更复杂。Melio 称公司将继续作为独立应用存在，继续支持 QuickBooks
              和其他软件，同时与 Xero 更深度集成。双轨承诺有商业吸引力，但运营上要求很高。竞争压力也很清楚。BILL 和 QuickBooks 都在营销嵌入式审批、AP
              自动化、供应商管理、安全控制和集成账单支付工作流；Melio 的负面评论还直接把工作流质量与 BILL 对比。结果是，伙伴依赖、产品执行和竞争切换成本相互牵连，构成一个风险系统。
