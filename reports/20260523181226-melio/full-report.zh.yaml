      - number: '6.4'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              即使没有正式留存指标，Melio 的扩张逻辑也可见。会计师事务所可以增加客户、解锁更高伙伴层级、邀请更多协作者、 路由更多审批，并从账单支付延伸到 AR、W-9 和 1099
              相邻工作流。直接用户可以通过国际支付、更快支付、 客户退款和更频繁的经常性账单批次加深使用。伙伴渠道又增加一层扩张，因为 Melio 可以藏在更大的软件或金融品牌后面，
              而不必把每个客户都拉进独立获客路径。Gusto 伙伴关系尤其值得注意，因为它打开了超过 400,000 SMB 的可寻址基础， 即使资格和层级门槛会限制实际附着率。


              同样的渠道也制造集中风险。公开具名证据高度集中在会计事务所，这让 Melio 在会计人员中介工作流的场景里显得最强。 Xero 同时是增长界面和风险界面：今天仅限 U.S. 国内美元，不导入历史独立 Melio
              数据，并承载了本章最清晰的负面评论。 QuickBooks 是警示案例，说明伙伴路径可以逆转；Bill Pay powered by Melio 在 2024 被关闭，尽管 Melio 自身继续运行。由于
              Melio 没有公开披露最大客户集中度，或按收入 / 支付量拆分的直接相对伙伴组合， 尽调应把伙伴依赖、渠道可迁移性和证据集偏斜视为重大开放项，而不是小脚注。
