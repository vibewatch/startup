      - number: '4.4'
        title: 财务展望与公开尽调缺口
        blocks:
          - type: paragraph
            body: >-
              已披露的前瞻图景，方向比精度更清楚。Xero 的 FY26 演示材料显示集团增长强劲、U.S. 加速清晰、 协同目标明确，并给出 Melio 在 H2 FY28 达到 run-rate EBITDA
              盈亏平衡的目标。这支持一个合理的乐观情形： Melio 给 Xero 带来一层支付能力，拥有多个收入驱动因素，改善 ARPC，并实质性抬升 U.S. 分部动能。 但同一组资料也支持更谨慎的解读。Xero 自己说
              Melio 的支付组合毛利率低于订阅收入；围绕 2024 估值下调融资 和 FY26 盈利拖累的负面报道也表明，这项资产带来的不只是上行空间，还有估值重置和整合风险包袱。


              最大剩余阻碍是披露深度。公开资料足以估算收入收益率和基准毛利区间，但没有给出严格承保模型需要的私营公司输入： 按支付通道拆分的独立毛利率、按渠道拆分的 CAC 和回本期、NRR
              或流失、烧钱和资金续航，以及交割后订阅相对交易与伙伴渠道的收入结构。 这些未知项很关键，因为 Melio 可能仍是 Xero 非常好的战略资产，但在当前证据水平下，独立财务质量可能只是尚可。
              因此，本章把展望定为有前景但仅部分承保，并在缺口表中明示最重要的缺失指标，而不是用无支撑假设填满它们。
