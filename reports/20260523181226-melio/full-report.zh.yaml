    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 意义
      - 局限
    rows:
      - - BILL
        - LTM 收入 / EV / 毛利率
        - US$1.60B 收入；US$3.31B EV；~2.07x EV-revenue；~83.7% 毛利率
        - 保留样本中最接近的上市“软件 + 支付”混合标尺。
        - 上市倍数已经降档，且反映的是比独立 Melio 更大、更多元的业务。
      - - AvidXchange
        - LTM 收入 / EV / 毛利率
        - US$446.72M 收入；US$1.74B EV；~3.91x EV-sales；~72.5% 毛利率
        - 可用作 AP 自动化和买方与供应商工作流类比。
        - 增长慢得多，且公司正退出公开市场，会影响可比样本的干净程度。
      - - Xero
        - TTM 收入 / EV / 利润率 / 倍数
        - AUD2.29B 收入；AUD10.14B EV；FY26 毛利率 83.9%；~4.96x EV-revenue
        - 现控股方，也是观察高估值软件平台在公开市场可交易水平的最清晰标尺。
        - Xero 的核心软件组合在结构上比 Melio 偏支付的收入模型更优质。
      - - Melio Series E 轮 (2024)
        - 私募轮次
        - US$2.0B 投后估值；按 March 2025 年化收入粗略为 ~10.7x
        - 出售前最新私募估值，也是风投阶段最好的参照。
        - 该估值形成于 Xero 完全控制前，披露深度也不足，难以作为可精确复用的估值标尺。
      - - Xero 收购 (2025)
        - 战略控制权交易
        - US$2.5B 前期对价，加最高 US$0.5B 或有对价；前期倍数 ~13.4x，若计入 FY28 协同抵扣约 ~9.7x
        - 本文件集中最硬的可观察交易锚。
        - 内含买方特定协同、控制权价值和与雇佣挂钩的或有对价，并非普通少数股权价值。
    notes: 可比组有意混合上市可比公司、2024 年私募轮和 2025 年控制权交易，因为 Melio 已不再适合单一模型可比框架。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public and private valuation references most relevant to Melio's current hybrid
        software-plus-payments ownership context, but does not attempt an exhaustive fintech or payments comp universe.
