      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Melio 没有在保留资料中发布正式云或系统图，因此最干净的架构描述，是把直接有文档支持的内容和推断内容拆开。 直接有文档支持：Melio
              暴露账单捕获和收件箱界面、审批和权限控制、多种出资与交付方式、会计连接器、税表工作流， 以及嵌入式伙伴层。ACH 页面展示了通过 Plaid 或 micro-deposits 连接银行的可见机制，并列出用于
              ACH 处理的银行伙伴。安全页面记录了加密、密码处理、第三方 PCI 处理、bug bounty 覆盖，以及跨职能安全治理。 QuickBooks、Xero 和 Amazon
              页面显示，工作流状态会持续推送到外部系统，而不是停留在孤立账本里。


              从这些公开碎片看，最可信的运营模型是分层工作流栈：顶部是用户工作区；中间是捕获、编码和审批逻辑；下方是跨 ACH、卡、电汇、支票、虚拟卡和国际交付的支付编排；再下面是把状态同步到会计系统和伙伴嵌入面的连接层。
              Agent Mel 位于工作流数据之上，是助手层，而不是独立产品。仍未验证的是底层基础设施：公开页面没有标明 Melio 的云服务商、数据存储、事件总线、排队模型或官方 API
              端点结构。因此，本章把可见产品架构视为文档充分， 但底层技术基座仅部分可观察。
