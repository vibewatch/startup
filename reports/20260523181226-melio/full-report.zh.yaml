      - number: '6.2'
        title: 具名客户证据与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Melio 通过了基本的具名客户证据测试，因为有多个在线案例研究给出具体结果，而且这组证据比 logo 墙更新、更细。 主导模式是会计师主导部署。AccounTAXstic、Accounting
              Solutions、Walker Agency、Latitude、Cubepros 和 CPA Business Advisors 都描述了生产使用，而不是试点；每个案例都把 Melio 绑定到重复 AP 或
              AR 工作流， 而非一次性付款。报告结果很强：支付处理时间减少 40% 至 90%，导入和审计工作节省，每月节省数十小时， 其中一个案例称每年节省约
              $40,000。这些仍是公司发布的客户故事，因此应视为方向性证据，而不是经审计的单位经济。


              最重要的非会计反例是 QBench。它的案例研究显示，Melio 进入了软件公司运营场景，而不只是记账事务所。 QBench 称，其几乎所有付款都使用 Melio，包括国际支付、快速支付和客户退款；月度账单量升至
              40-50 笔付款， 每周最多节省 16 小时。这很重要，因为它证明 Melio 能支撑外包会计之外的重复运营节奏。即便如此，相比 Melio 声称的规模，公开具名样本仍然偏窄。因此，增长 /
              采用证据在平台层面可信，但仍集中于会计师故事，以及少数其他具名操作者和 Xero、Gusto 等伙伴界面。
