  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: Melio 当前最强的能力是核心 AP 工作流、会计同步和合作伙伴嵌入式分发。AI 辅助和税务工作流是有意义的增量，但公开技术披露仍薄于产品和工作流披露。
    data:
      columns:
        - 工作流覆盖
        - 自动化深度
        - 集成广度
        - 控制 / 合规深度
        - 外部分发深度
      rows:
        - label: AP 自动化核心
          values:
            - 高 — 端到端捕获、审核、审批、付款和同步
            - 高 — AI 捕获、批量操作、排期、经常性付款
            - 中 — 取决于连接器和供应商 / 付款方式支持
            - 中 — 可见控制较强，但审计材料未公开
            - 中 — 直接产品加合作伙伴复用
        - label: AR 和付款请求
          values:
            - 中 — 发票、品牌化支付链接、直达银行结算
            - 中 — 收款和跟踪摩擦低，但工作流深度低于 AP
            - 低到中 — 保留资料集中点名的外部 AR 专用集成较少
            - 中 — 支付保护有营销表述，但公开证据深度有限
            - 中 — 在合作伙伴嵌入中复用
        - label: 会计同步
          values:
            - 高 — 直接和嵌入式体验的核心
            - 中 — 带有注意事项的自动双向同步
            - 高 — QuickBooks、Xero、Amazon 导入、Tax1099、Gmail 邻近工作流
            - 中 — 验证和审计影响重要，但只被部分记录
            - 高 — Xero 和 Gusto 定位的核心
        - label: 会计师工作区
          values:
            - 高 — 一个仪表盘覆盖多个客户
            - 中 — 审批、权限、计费和支持工具
            - 中 — 主要绑定会计连接器，而不是广泛应用商店深度
            - 高 — 6 个角色、W-9/1099 支持、付费档位高级控制
            - 低 — 主要直接面向事务所，而非白标分发
        - label: 嵌入式合作伙伴平台
          values:
            - 高 — 已在多个合作伙伴渠道中上线
            - 中 — 品牌化部署和分析，但公开 API 细节很薄
            - 高 — 银行、SaaS、市场、会计平台
            - 中 — 合作伙伴场景继承合规义务，但功能深度并不统一
            - 高 — 当前主要增长向量
        - label: AI 和助手层
          values:
            - 中 — 可用于 AP、支持和可视化用例
            - 中 — 已上线捕获和对话式助手，但没有公开深度技术文档
            - 低 — 保留资料中面向外部 AI 开发者的直接 API 或 SDK 证据很少
            - 低到中 — 公开护栏和评估细节缺席
            - 中 — 出现在直接产品和合作伙伴邻近叙事中
        - label: 税务和承包商自动化
          values:
            - 中 — 聚焦但实用的工作流延伸
            - 中 — TIN 验证和 Tax1099 同步增加了真实自动化
            - 低 — 生态主要集中在 Tax1099 和核心支付通道周围
            - 高 — 文档中可见具体合规效用
            - 低 — 主要是直接产品的控制界面
