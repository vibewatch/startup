      - number: '2.3'
        title: 细分、买方与分发
        blocks:
          - type: paragraph
            body: >-
              买方图谱不是一个模板。Xero 自身信息明确说，Melio 面向小企业、会计师和记账人员；收购报道则称，合并后的产品不只覆盖 1-20 名员工 SMB，也扩展到自雇企业和 20
              名以上员工企业。这个差异很关键，因为不同细分里的用户、 预算所有者和审批流都会变化。在极小企业里，老板或行政人员往往直接设置产品并付款；在财务结构更完整的雇主型 SMB 里，
              授权审批人和财务主管更重要。会计师和记账人员也关键，因为一次工作流决策可以传导到多个客户。


              分发也把市场扩展到直接软件席位之外。收购报道称，联营分发模式通过银行和垂直 SaaS 渠道触达尚未进入会计栈的客户； Tech Funding News 指向 Shopify、Capital One、Fiserv
              等伙伴。Xero 的 FAQ 又给出一个实际工作流线索： 权限决定谁能启用账单支付，谁只能安排付款等待审批。因此，真正的买方图谱横跨直接 SMB 经营者、外包财务用户、内部审批人，
              以及希望在会计栈完全标准化之前用账单支付加深参与度的渠道伙伴。
