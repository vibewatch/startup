      - number: '5.3'
        title: 集成与生态
        blocks:
          - type: paragraph
            body: >-
              Melio 的生态现在是产品的重要组成部分，不只是附件。与 QuickBooks、Xero 和 Amazon Business 的直接集成覆盖最明显的会计和发票导入任务， 而伙伴平台把分发拉得更远。Melio
              自己的伙伴页面称，公司能在数周内交付品牌化网页和移动端 AP/AR 体验， 并明确列出 Fiserv、Capital One、Shopify、Clover 和 Gusto
              等已上线伙伴界面。外部伙伴文档进一步证明这不是理论： Xero 在 March 2026 上线由 Melio 支撑的在线账单支付，Gusto 的在线账单支付产品由 Melio 支撑， Amazon
              Business 则用对账 API 连接把发票导入 Melio。


              生态强度也伴随技术注意项。会计连接器很强，但不同场景下并不完全对称：QuickBooks Desktop 支持受层级限制， Amazon sync 是单向的，Xero 嵌入式体验不会继承历史独立 Melio
              数据。Xero 的 FAQ 还显示，伙伴嵌入可以有自己的产品约束， 包括今天仅限 U.S. 国内美元，以及仍计划在 later in 2026 推出的完整审批工作流。结果是，分发和集成故事很强，
              但依赖图也更清楚：Melio 越来越依赖外部平台、嵌入式渠道和连接器行为来完成客户体验。
