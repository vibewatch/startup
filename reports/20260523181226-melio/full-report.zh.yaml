  - id: TM001
    title: 市场定义表
    columns:
      - 市场切片
      - 纳入支出 / 工作流
      - 排除支出 / 工作流
      - 买方 / 付款方
      - 重要性
    rows:
      - - 会计主导的 SMB 账单支付和 AP
        - 会计主导工作流中的供应商账单录入、审批、付款执行、对账和现金流管理
        - 完整消费者支付、薪资、借贷和通用 POS 收单
        - 代表 SMB 的业主、财务管理员、财务主管或会计师
        - 这是 Xero 推出嵌入式账单支付并引用 $29B TAM 时实际描述的窄口径市场。
      - - 独立 SMB AP 自动化
        - 核心 GL 之外的发票采集、审批路由、供应商付款编排和审计轨迹
        - 广义 ERP 转型或企业采购套件
        - 财务主管、财务负责人或外包记账员
        - Melio 以独立产品或通过会计师销售时，即使尚未完全嵌入 Xero，也在这里竞争。
      - - 嵌入式银行或垂直 SaaS 账单支付
        - 通过银行或垂直软件交付的白标或联合支付工作流
        - 面向消费者的直接银行服务或无关 SaaS 变现
        - 银行伙伴、SaaS 平台所有者和 SMB 经营者
        - 这一渠道触达前会计客户，并把市场从直接软件席位抬高。
      - - 现状下的手工支付轨道
        - 纸质支票、手工银行转账、电子表格审批和割裂的记账交接
        - 带实时对账的全自动端到端 AP
        - 小企业经营者最终承担付款和人工成本
        - 现状仍是主要替代方案，也解释了为什么支付轨道现代化本身不等于软件采用。
      - - 相邻财务运营
        - A/R、营运资本借贷、薪资和跨境资金管理产品
        - 当前嵌入式发布中的核心国内供应商账单工作流
        - 更广泛财务栈买方，而非单一 AP 预算负责人
        - 这些相邻领域关系到长期平台扩张，但不应抬高当前 SAM。
    notes: 纳入的市场是会计主导的 SMB AP 和账单支付。A/R、薪资、借贷和大多数跨境工作流等相邻领域单独跟踪，这样 TAM 和 SAM 才保持可比。
