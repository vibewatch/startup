            body: >-
              情景区间应该较宽，因为硬价格锚点的证据质量不错，但足以支撑某一个精确数字的独立经济性仍然证据不足。熊市情景为 US$1.2 billion 至 US$1.6
              billion，假设公开可比压缩占上风，低毛利支付结构仍然较重，且整合拖累超过交叉销售。基准情景为 US$1.7 billion 至 US$2.1 billion，明确承认 Melio
              的规模、嵌入式分销和战略稀缺性，但仍因独立证明不完整而折价 Xero 2025 年控股溢价。牛市情景为 US$2.3 billion 至 US$2.8 billion，本质上假设 Melio
              能通过证明协同、分销杠杆和 H2 FY28 盈亏平衡，赚回大部分战略溢价。因此建议刻意保守：research-more，置信度中等；在或高于 Xero 前期价格时，估值姿态偏紧。换句话说，本章并不是说 Melio
              质量低，而是说当前公开记录支持战略价值，但独立精度还不足，无法在没有新数据的情况下承销一个按 2025 年战略标记刷新的价格。
