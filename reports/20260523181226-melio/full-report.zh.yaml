      - number: '8.4'
        title: 最终尽调问题和论点破坏项
        blocks:
          - type: paragraph
            body: >-
              能改变判断的工作很具体，而且大多藏在公开帷幕之后；Melio 现在是一个被整合的私人资产。最大缺口是订阅、支付和联合分销之间的收入结构，支付 take
              rate，按支付轨道拆分的毛利率，以及在计入协同之前清晰的独立 EBITDA
              或现金消耗桥。投资者还需要看到或有对价背后的确切超额表现门槛、领导层留任目标是否达成的证据，以及对分销网络内部伙伴集中度更清楚的判断。在这些事实出现之前，正确姿态是把不确定性转成否决标准，而不是含糊带过。如果
              Xero 不再重申协同交付，如果毛利稀释在没有增长抵消的情况下持续，或者收入质量的证据缺口继续存在，基准情景就应迅速下调。反过来，如果管理层开始披露结构、take rate
              和盈亏平衡进展，并缩小战略价值与可复用独立价值之间的缺口，本章会准备从 research-more 转向更公平的立场。这也是尽调问题与数字区间同等重要的原因。
