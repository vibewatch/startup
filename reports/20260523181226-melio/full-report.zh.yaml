      - number: '4.3'
        title: Xero 交易后的资本结构与充足性
        blocks:
          - type: paragraph
            body: >-
              Melio 已经进入 Xero 体系后，核心财务问题不再是 Melio 能否按 2021 式风投条款再融一轮独立融资。 问题变成：母公司出资结构是否留出足够资产负债表容量和战略耐心，让 Melio 在 Xero
              内扩张，同时吸收整合成本。 保留申报文件在这一点上异常有用。Xero 披露前期对价 $2.5 billion，另有最高 $0.5 billion 的或有、递延和展期对价。 完成交割文件还显示前期金额如何筹资：约
              US$1.8 billion 现金、US$0.4 billion 债务融资，以及约 US$0.36 billion 新发行股票；其中现金部分来自大型机构配售、购股计划和 US$0.5 billion
              资产负债表现金。


              这一资金组合意味着，Melio 不再像通常私营公司那样受到融资续航约束，但也引入了另一种纪律。 Xero 现在必须证明收购杠杆、股权稀释和短期盈利拖累是合理的，同时完成业务整合。公司自己的 FY26 资料指引
              Melio 在 H2 FY28 达到 run-rate adjusted EBITDA 盈亏平衡，并给出明确协同目标，这是建设性的。但公开资料仍未披露 Melio
              交割后的独立现金余额、烧钱曲线或债务义务，因此尽调还不能用仅 Melio 报表承保资本充足性，而必须通过 Xero 继续投入该资产的意愿和能力来承保。
