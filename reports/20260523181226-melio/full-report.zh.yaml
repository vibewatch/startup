      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强驱动是工作流需求真实且已经发生，并非假设。Xero 称，集成式会计与 AP 对超过 70 percent 的 U.S. SMB 很重要；Visa 看到市场对一站式金融工作流、嵌入式金融和虚拟卡驱动 B2B
              支付的需求上升。Nacha 的 2025 数据解释了为什么软件提供商重视这一点：ACH 体量巨大，same-day ACH 增长很快，B2B 是该网络最重要的增长细分。
              这些事实支持这样一个市场论点：更好的软件靠提速、对账和可变现的支付通道选择，从既有支付行为里捕获价值。


              但约束同样清晰。MHC 称，多数 AP 团队仍是混合模式，只有 9 percent 完全自动化，66 percent 仍在手工处理大多数发票。 Federal Reserve 仍记录大量支票金额，Xero
              也仍需支持邮寄支票，说明供应商偏好仍在拖慢数字化转化。 采购群体也比简单的自助 SaaS 叙事复杂：Forrester 称采购部门很早就会参与，试用也很常见。最后，产品完整度和执行仍然重要。 Xero 的 FAQ
              称，完整审批和国际账单支付仍处于计划中，而非完全上线；负面评论则认为，收购价格假设 Xero 能把整合逻辑转化为真实交叉销售和留存。
            claimRefs:
              - CM002
