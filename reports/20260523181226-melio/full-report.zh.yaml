  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              分析 Melio 时，市场边界应比泛 B2B 支付更窄。Xero 的 March 2026 上线公告把机会表述为 $29 billion 的 U.S. SMB 支付
              TAM，但实际推出的产品界面是会计驱动的供应商账单支付：账单录入、支付方式选择、对账、 现金流可见性，以及在记账系统内或其旁边的授权审批。也就是说，核心市场包括面向 SMB、会计人员和渠道伙伴的 AP
              工作流软件与嵌入式账单支付编排；它不会自动覆盖每一种 B2B 支付、薪资、信贷或完整跨境资金管理。


              现状仍然重要，因为软件替代的是混乱的运营行为，而不只是旧支付轨道。Xero 自己说，小企业账单管理高度碎片化。 FAQ 确认，嵌入式工作流仍要通过 ACH、卡和邮寄支票来适配供应商现实；Federal
              Reserve 也仍在报告庞大的商业支票金额。 换句话说，Melio 面对的不只是其他软件供应商，还包括手工支票、银行门户、电子表格审批和割裂的记账交接。
              这个边界让市场具备投资性：痛点是工作流碎片化，而不只是存在支付量。
