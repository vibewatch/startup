  - id: FU002
    title: 采用 / 部署流
    type: flow
    layout: wide
    summary: 部署路径从直接、会计师主导和合作伙伴嵌入式入口汇合到验证、首笔付款、经常性使用，并最终走向扩展或渠道特定摩擦。
    data:
      nodes:
        - id: direct-signup
          label: 直接注册
          detail: 独立企业发现 Melio 并启动自己的设置。
        - id: accountant-invite
          label: 会计师邀请
          detail: 事务所创建或管理带有预设控制的客户工作区。
        - id: xero-entry
          label: Xero 账单支付入口
          detail: 客户从 Xero 开始，并接受单独的 Xero + Melio 条款。
        - id: gusto-entry
          label: Gusto Bill Pay 入口
          detail: 符合资格的 Gusto 客户开启 Bill Pay，某些功能可能需要 Money Plus。
        - id: verification
          label: 验证和同步
          detail: 配置企业信息、资金来源和会计连接。
        - id: first-transaction
          label: 首笔交易
          detail: 用户上传、导入或排期首个账单或发票。
        - id: recurring-cycle
          label: 经常性循环
          detail: 审批、供应商付款、发票收款和同步按固定节奏重复。
        - id: expand-or-friction
          label: 扩展或摩擦
          detail: 客户增加更多客户、支付通道或工作流，或者遇到合作伙伴特定迁移、计费或同步约束。
      edges:
        - from: direct-signup
          to: verification
          label: 自助设置
        - from: accountant-invite
          to: verification
          label: 托管启用
        - from: xero-entry
          to: verification
          label: 嵌入式设置 + 重新验证
        - from: gusto-entry
          to: verification
          label: 资格 + 计划门槛
        - from: verification
          to: first-transaction
          label: 连接并导入
        - from: first-transaction
          to: recurring-cycle
          label: 证明工作流价值
        - from: recurring-cycle
          to: expand-or-friction
          label: 使用加深或断裂
