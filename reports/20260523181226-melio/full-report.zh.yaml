      - number: '1.4'
        title: 里程碑与当前尽调标记
        blocks:
          - type: paragraph
            body: >-
              Melio 的里程碑曲线很重要，因为它解释了 Xero 为什么不是只延长应用商店关系，而是直接买下公司。 早期里程碑是公司建设：2018 创立、January 2021 让公司进入独角兽行列的 Series
              C、late 2021 的 $4 billion Series D，以及用于支撑 U.S. 快速增长的 Denver 扩张。随后是产品和分发里程碑：2022 推出国际支付，2023 接入 Xero
              sync，Fiserv 伙伴分发加深，2024 又新增 Amazon Business 合作， 并补上财务和合规领导岗位。


              当前阶段由整合和执行定义。2024 融资把 Melio 私有估值较 2021 砍半；即便同时有收入增长报道，这也是反向信号。 随后 Xero 在 June 2025 宣布收购，Melio 新闻室记录了 May
              2025 的 Gusto 上线和 January 2026 的 Agent Mel；Xero 的 March 2026 公告则显示，交割后策略已经进入市场。怀疑派市场评论如今较少质疑产品契合度， 更多聚焦
              Xero 是否按满价买入，以及能否把资产干净整合进去。
