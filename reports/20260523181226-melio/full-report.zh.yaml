      - number: '8.2'
        title: 可比分析和标记纪律
        blocks:
          - type: paragraph
            body: >-
              公共可比桥让估值标记纪律变得很直观。BILL 是留存样本中最干净的上市混合软件加支付可比公司，交易约为 2.1x EV-revenue，毛利率在 80%+。AvidXchange 更接近 AP
              工作流和买卖双方自动化，交易约为 3.9x EV-sales，毛利率在 70% 出头。Xero 自身交易约为 5.0x EV-revenue，毛利率接近
              84%，因为其核心软件业务结构上比支付更厚。对照这个公开区间，Melio 观察到的标记高得多：如果把 2024 年 US$2.0 billion 轮次与 March 2025 年化收入相比，约为 10.7x；按
              Xero 的前期战略价格算，为 13.4x。这并不自动说明交易错误。它意味着 2025 年 Xero 标记应被理解为控股加协同交易，而不是可复用的少数股定价模板。正确结论是，Melio
              因规模、伙伴分销和战略契合，应相对公开可比区间有一定溢价；但在独立毛利、take-rate 和收入结构披露仍薄的情况下，不能盲目接受完整战略倍数。
