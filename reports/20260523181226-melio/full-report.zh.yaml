        - label: 经济性
          value: 2.5
          unit: score
          note: 低利润率支付组合和较晚的盈亏平衡，使经济性仍只得到部分验证。
        - label: 风险
          value: 2.5
          unit: score
          note: 超付、协同和披露风险仍然重大。
        - label: 估值
