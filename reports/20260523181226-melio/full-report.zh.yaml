      - number: '7.2'
        title: 运营风险已经体现在有记录的支付摩擦、支持负荷和控制依赖中
        blocks:
          - type: paragraph
            body: >-
              Melio 的公开支持材料清楚说明，运营风险不是假设。公司自己的故障排查部分列出付款被拒、ACH
              交付失败、支票交付延迟、银行验证失败、批量付款错误和作废支票等反复出现的支持案例。微额存款文章又增加了一个现实摩擦点：三次验证失败后，银行账户会被封锁 48
              小时，用户只能改用其他支付方式或重新设置账户。跨境指引进一步抬高风险，因为国际付款可能涉及中介银行、合规检查、欺诈暴露、费用和发货延迟。安全披露是真实且有帮助的——PCI 合规的银行卡处理、SOC 2
              可用、ISO 认证可按需提供、加密，以及由 CISO 牵头的项目——但这些控制并不会在审批工作流、支付路由或支持响应时间令人失望时消除客户痛点。独立评论证据在这里很关键：Trustpilot 和
              ComplaintsBoard 都出现了关户、供应商付款和支持缓慢的投诉，运营控制由此直接转化为留存和声誉风险。
