    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 用户工作区
        - 面向 AP、AR 和管理的企业、会计师及嵌入式伙伴界面
        - 浏览器和移动端产品界面，以及合作伙伴前端
        - 公开文档展示用户可见行为，但未披露会话架构、租户边界或管理员覆盖逻辑
      - - 采集与摄取层
        - 从上传文件、邮件收件箱、会计同步、Gmail 和 Amazon Business 导入中拉取账单
        - OCR / AI 提取、文件处理、邮箱路由和导入连接器
        - 没有关于畸形文档提取准确率、队列延迟或失败处理的公开基准
      - - 审批与控制层
        - 付款执行前应用角色、审批、委派、排程和批量规则
        - 权限模型、会计师仪表盘、套餐门控和伙伴特定管理角色
        - 审批证据、政策版本管理和完整企业级工作流深度仅有部分文档说明
      - - 支付编排层
        - 将已排程意图转换为 ACH、卡、电汇、支票、虚拟卡、即时或国际交付
        - 赞助银行、第三方 PCI 处理方、卡网络、供应商交付偏好和合规检查
        - 支付轨道可用性、限额和幕后交付转换随场景变化，并未完全透明
      - - 连接器与对账层
        - 让 Melio 与会计 / 伙伴系统在账单、供应商、发票和付款上保持一致
        - QuickBooks、Xero、Amazon Business、Tax1099、Gmail 和合作伙伴嵌入
        - 不同文档和嵌入场景下，同步节奏与数据可移植性行为并不一致
      - - 嵌入式分发层
        - 将 Melio 能力重新打包进 Xero、Gusto、Shopify、Capital One、Clover、Fiserv 等合作伙伴环境
        - 伙伴入驻、UX 定制、品牌化组件和伙伴支持模型
        - 更多使用迁移到伙伴控制界面后，商业集中度和功能碎片化会上升
      - - 信任与合规服务
        - 加密数据、验证企业、管理税表工作流，并暴露安全响应路径
        - AES / TLS 控制、尽调义务、bug bounty、SOC 2 / ISO 文档、W-9 校验、Tax1099 同步
        - 公司声称控制较强，但公开获取审计文档和控制测试证据仍受限
      - - 助手与分析层
        - 通过 Agent Mel 提供账单采集智能、付款指引和对话式回答
        - 底层支付 / 工作流数据和 AI 提取组件
        - 公开来源未披露模型、可观测性、兜底处理或提示词护栏实现
    notes: 多行是报告基于已记录工作流界面和连接器行为推断的抽象，不是供应商确认的微服务地图。它们描述的是可见运营模型。
