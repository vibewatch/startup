      - number: '4.2'
        title: 单位经济与基准化毛利代理
        blocks:
          - type: paragraph
            body: >-
              Melio 的独立单位经济在公开证据中仍只部分可见，因此正确做法是拆开披露数字、计算代理值和基准区间。 公开交易报道足以粗略估算变现效率：在 $30 billion 支付量上实现 $153 million 至
              $187 million 收入， 意味着约 0.51% 至 0.62% 的收益率区间；同一收入区间除以披露的 80,000 客户，意味着每个披露客户年收入约 $1.9 thousand 至 $2.3
              thousand。这些是有用的方向性锚点，但不能替代 CAC、回本期、毛利率、NRR 或队列数据。


              即使缺少硬单位财务指标，客户证据也表明 Melio 创造了真实工作流价值。QBench 提到每周最高节省 16 小时； CPA Business Advisors 估算，相比替代账单支付工具每年节省约
              $40,000。做毛利框架时，保留样本里最有用的公开可比公司是 BILL 和 AvidXchange：BILL 在 FY2025 的 GAAP 毛利率高于 80%，AvidXchange 在 FY2024 报告
              73.6% non-GAAP 毛利率和 19.3% 调整后 EBITDA 利润率。Xero 自己的 FY26 投资者演示材料 是这里的关键警示，因为它明确说 Melio
              的支付组合会拉低相对于纯订阅收入的毛利率轮廓。结论不是 Melio 弱， 而是在管理层披露更好证据之前，承保应假设它是支付混合型毛利率，而不是经典高 80% 区间的纯软件毛利率。
