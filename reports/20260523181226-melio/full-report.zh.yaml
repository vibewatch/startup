  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品平台与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Melio 当前产品足迹比简单账单支付工具更宽。官方界面如今描述的是一个一体化平台，把应付账款、应收账款、 ACH 和卡出资支付、审批工作流、AI
              辅助账单捕获、税表收集、国际支付、付款链接和会计师专用多客户控制组合在一起。 产品不是围绕孤立 SKU 组织，而是围绕要完成的任务组织：捕获或导入账单，审核并编码，路由审批，选择出资和交付方式，
              执行支付，再把结果同步回会计总账。在应收侧，同一系统可以生成发票、发送品牌化付款链接，并把资金直接存入企业银行账户。


              这种工作流框架很重要，因为 Melio 同时服务多类操作者。SMB 业主获得轻量 AP 和 AR；会计事务所获得集中仪表盘、
              六级权限和多客户监督；更大的渠道伙伴则能把同样的支付能力嵌入自有产品。定价页还显示出刻意设计的能力阶梯： 低摩擦入门层保留自助动线，Core、Boost 和 Unlimited
              则增加同步、审批、供应商抵扣、高级角色、 高级支持和白手套式导入。换句话说，模块图本质上是工作流和控制图：同一组核心支付通道 被重新打包给直接用户、会计人员和嵌入式伙伴。
