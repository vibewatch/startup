      - number: '5.5'
        title: 路线图与 R&D 信号
        blocks:
          - type: paragraph
            body: >-
              2026 最可见的 R&D 信号是 Agent Mel。Melio 的 January 2026 上线资料把它描述为完全嵌入、无需设置的助手， 可以回答支付、产品和供应商问题，展示余额和支付状态，并建立在既有
              AI 账单捕获和数据录入工具之上。 这很重要，因为它说明 Melio 公开创新路径的重心不是推出全新产品线，而是在已经成熟的 AP/AR 工作流之上叠加辅助和自动化。 并购后的 Xero 公告也指向同一方向：把
              Melio 支付基础设施与 JAX 驱动的对账、AI 驱动的操作系统叙事配对。


              再往外，路线图更多是方向性而非明确排期。Amazon Business 集成显示公司此前投入了基于外部 API 的发票导入； Gusto 的在线嵌入式体验说明 Melio
              平台可以重新包装成伙伴原生工作流。Xero 的 FAQ 给出最清晰的前瞻里程碑： 更完整的审批工作流计划在 later in 2026 推出。但保留资料没有找到独立 Melio 变更日志、带日期的发布日历、
              公开状态历史或详细公开 API 路线图。因此，R&D 结论是建设性但有条件的：Melio 显然仍在发货，尤其围绕 AI 辅助和嵌入式金融；但除伙伴公告外，公开路线图仍然稀疏。
