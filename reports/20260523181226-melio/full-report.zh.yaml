      - number: '1.3'
        title: 融资历史、估值重置与股东图谱
        blocks:
          - type: paragraph
            body: >-
              Melio 的资本历史同时显示爆发式增长和后续估值重置。Business Wire 报道，公司在 January 2021 完成 $110 million 融资，估值 $1.3 billion。Later in
              2021，Melio 宣布 $250 million Series D， 估值升至 $4 billion，并把投资者扩展到 Thrive Capital、General Catalyst、Tiger
              Global、Accel、 Bessemer、Coatue、Corner Ventures 和 Latitude。到 late 2024，公司又以 $2 billion 估值融资 $150 million，由
              Fiserv 领投，Shopify Ventures 和 Capital One Ventures 参投。该轮仍说明分发需求强， 但也确认估值较 2021 峰值下调。


              2025 年所有权变化更剧烈。June 25, 2025，Xero 宣布协议收购 Melio 100% 股权，前期对价 $2.5 billion，另有最高 $0.5 billion
              的或有、递延和展期对价，主要与业绩和留任挂钩。公开资料指向交易在 October 15, 2025 完成。出售前，公开报道的累计融资额只能收敛到约 $650 million 至 $656 million，
              因此精确的完全稀释后股权结构仍需要私下确认。
