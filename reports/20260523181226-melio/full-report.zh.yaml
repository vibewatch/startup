  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 所有权背景和估值方法
        blocks:
          - type: paragraph
            body: >-
              Melio 现在有两个硬性的私人估值锚点，这改变了本章的写法。2024 年 Series E 在融资 US$150 million 后给出 US$2.0 billion 标记；Xero 的 2025 年交易给出
              US$2.5 billion 前期价格，并有最高 US$0.5 billion 与超额表现和留任挂钩的额外对价。这两个数字都真实存在，但不能互换。2024 年标记是金融科技市场重置期的一轮风险融资；2025
              年标记则是战略控股收购，带有明确协同假设、分销价值和与任职绑定的或有对价。因此，严谨的 2026 年方法不能简单平均过期的私人估值，也不能把 Melio 硬塞进纯 SaaS
              上市可比公司组。它必须同时用三副镜片三角定位：2024 年风险融资、2025 年战略控股交易，以及 2026 年公共市场给混合软件加支付业务的估值区间。这个方法很重要，因为 Xero 自己披露 Melio
              会拉低集团毛利率，而且要到 H2 FY28 才达到 run-rate 调整后 EBITDA 盈亏平衡。换句话说，战略价格里嵌入了价值，但当前公开证据还没有证明少数股投资者也能复用这些价值。
