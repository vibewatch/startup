  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Melio 的公开收入模式更应理解为订阅软件、支付交易费和分发经济的混合体，而不是纯 SaaS 席位业务。 当前定价页销售四个自助 SMB 层级和一个定制 Platinum
              层级，同时仍把最有价值的支付动作单独变现。ACH 使用部分打包，但顶层以下并非无限；卡出资支付收取 2.9% 费用，更快出款选项叠加额外收费，跨境支付也有自己的费率表。
              因此，公开标价只设定收入底线；实际变现仍取决于支付方式组合、紧急程度、地域和月度支付量。


              更难的承保点在于，公开资料没有给出干净的收入结构拆分。Melio 披露 October 2024 融资发生在收入较 2021 增长十倍之后；第三方收购报道后来描述了约 $153 million 收入、$187
              million 年化收入、80,000 客户和 $30 billion 支付量。这些披露支持一个可信的规模图景，也让尽调能够估算支付量收益率，但没有拆分订阅、
              交易、伙伴和国际收入贡献。因此，本章把没有支撑的结构单元保留为估算或空值，而不是把标价当作实际净收入。
