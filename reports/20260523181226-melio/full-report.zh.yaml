      - number: '6.3'
        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >-
              公开留存披露是 Melio 客户档案中最弱的一块。保留资料没有暴露 NRR、GRR、logo 流失、合同期限、续约率， 或官方 NPS/CSAT
              基准。这迫使本章依赖重复使用代理，而不是真正的留存经济。这些代理并不空。Xero 的 FAQ 展示了预定付款和审批人路由工作流，这些工作流假设客户一旦设置完成就会重复使用。TrustRadius
              评论描述了持续多实体或多 LLC 使用、某用户每年支票数量从约 300-400 张降到少于 10 张，以及 ACH 主导工作流每月节省 $100-$200。 QBench 的 40-50
              笔月度账单和会计师案例中经常性客户账本也指向同一方向：当工作流契合时，Melio 可以成为日常运营层。


              警示在于渠道特定满意度。Xero 的 App Store 页面显示，14 条评论给出 1.79/5 的低评分；认证评论者 抱怨同步缺失、每周断连、技术工单未解决和合并付款问题。SelectHub
              的更广泛聚合更正面，但那仍是外部评论汇总， 而非一手留存数据。结果是一个分裂结论：直接和会计师管理用例显示可信的重复使用深度，但嵌入式渠道情绪——尤其是
              Xero——仍明显混合。因此，投资者应把当前公开证据视为工作流粘性的证据，而不是有吸引力客户群组经济性的证据。
