  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 因素
      - 方向
      - 证据
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 会计 + AP 集成需求
        - 驱动因素
        - Xero 称，>70% 的美国 SMB 看重紧密的会计和 AP 集成；收购报道引用 ~78%。
        - 当前
        - 支撑软件主导的 SAM，而不是把支付视为单纯支付通道功能。
        - 测试这类需求在有雇员 SMB、会计师还是渠道主导分群中最强。
      - - ACH 和当日 ACH 增长
        - 驱动因素
        - Nacha 报告称，2025 网络增长、当日 ACH 增长强劲，B2B 是增长最快的细分。
        - 当前至近期
        - 更快的数字支付通道让平台内账单支付更有用，也降低结算摩擦。
        - 询问管理层，Melio 支付中从支票转向 ACH 和当日 ACH 的占比是多少。
      - - 嵌入式金融和虚拟卡
        - 驱动因素
        - Visa 预计，美国 B2B 嵌入式金融到 2026 将超过 $2.6T，虚拟卡仍会继续放量。
        - 近期
        - 利好把软件流程、支付变现和营运资本功能合在一起的平台。
        - 索取刷卡出资账单支付与 ACH 出资账单支付的分群经济性。
      - - 会计师和顾问流程价值
        - 驱动因素
        - Xero 反复向 SMB 及其顾问营销集成流程。
        - 当前
        - 会计师可以放大分发：一个集成决定可能影响许多客户。
        - 量化会计师主导分群中每家事务所的客户采用率和流失率。
      - - 手工与混合 AP 持续存在
        - 约束因素
        - MHC 称，只有 9% 的 AP 部门已完全自动化，66% 仍手工处理大多数供应商发票。
        - 当前
        - 市场之所以大，部分原因是纸质和混合流程仍顽固存在。
        - 衡量上线摩擦、文档收集工作量和供应商启用时间。
      - - 支票延续和供应商偏好异质性
        - 约束因素
        - Xero 仍支持邮寄支票，Fed 仍报告巨额支票金额。
        - 当前
        - 单靠数字 UX 不能消除传统供应商接受要求。
        - 按 ACH、支票、卡和电汇拆分供应商付款结构。
      - - 采购群体复杂度与采购摩擦
        - 约束因素
        - Forrester 称，采购群体规模大，采购部门早早介入，试用很常见。
        - 当前
        - 中端市场和渠道销售可能比纯 SMB 自助获客打法暗示的周期更长。
        - 按细分市场和伙伴路径检查销售周期长度。
      - - 执行与集成风险
        - 约束因素
        - 审批和国际账单支付仍有产品缺口；反向评论称，Xero 买的是一个成功集成案例。
        - 2026 更新窗口
        - 近期增长取决于能否把当前流程需求转成交割后采用，而不只是拥有 Melio。
        - 在承销激进 SOM 扩张前，要求提供交割后附加采用、留存和功能补齐指标。
    notes: 方向反映当前市场影响，而非永久事实。多行因素会同时起作用：同样能扩大 TAM 的支付通道现代化，也可能暴露流程、供应商和集成瓶颈。
