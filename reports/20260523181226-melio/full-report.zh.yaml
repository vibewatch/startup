      - number: '1.2'
        title: 领导连续性与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层仍然高度创始人中心，但公开记录已经把 Melio 管理层直接接入 Xero 的 U.S. 组织。Melio 资料仍把 Matan Bar 呈现为 Melio 联合创始人兼 CEO；Xero 的 March
              2026 上线公告称，他担任 Xero US CEO，负责 Xero US 和 Melio。 Ilan Atias 仍是联合创始人兼 CTO，Tomer Barel 也继续以总裁身份出现在当前公司信息和
              late-2024 报道中。 这一组合说明，产品和支付经验在所有权切换中保持了连续。


              更大的管理梯队只部分可见。Melio 的 2024 新闻室显示，公司补上了治理相关岗位：任命首位 CFO Boaz BenDavid， 以及首席合规官 Nicholas
              Passarelli。历史治理也比当前治理更清楚：2021 Series D 公告称 Ken Chenault 加入成为董事会观察员。到 2026 仍缺的是 Xero 交易后 Melio
              当前独立董事会名单或委员会架构，因此尽调能看到关键高管， 但看不全治理设计。
