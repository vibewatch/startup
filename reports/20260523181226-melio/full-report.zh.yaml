  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户概览与细分
        blocks:
          - type: paragraph
            body: >-
              Melio 的公开客户故事显然真实，但并非均匀分布在各细分。当前最强证据把官方规模口径和非常可见的会计师主导动线结合在一起。 Melio 的 2026 官方资料称，超过 100,000
              名企业主和会计人员使用该平台，处理金额超过 $100B，40M+ 账单完成支付，2M+ 供应商获得付款，平均每月节省时间超过 15 小时。对一个位于付款人、审批人、供应商和会计系统之间的工作流产品来说，
              这些都是有意义的采用标记。与此同时，公开细分图谱明显偏向记账人员、会计事务所和伙伴嵌入式用例，而不是广泛且均衡的自助 SMB 垂直样本。


              这种细分模式对尽调很关键。会计师管理的客户获得差异化经济性和控制界面：事务所有免费 Boost 方案、45-day
              客户试用、付费方案折扣、伙伴层级计划，以及覆盖管理员、审批人和只读协作者的六级权限。嵌入式伙伴流又增加一层客户细分。 Xero 由 Melio 支撑的账单支付体验仅限 U.S.
              国内美元，并需要单独设置；Gusto 则向符合条件的公司在薪资和开票工作流里暴露 Melio。净图景是三块基础——直接 SMB、会计师主导账本和伙伴主导嵌入式用户——但公开资料没有按客户群组
              拆分收入、支付量或留存组合。
