      - number: '5.4'
        title: 信任、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              Melio 的信任姿态比底层基础设施披露具体得多。安全页面称，静态数据用 AES-256 加密，传输中数据使用 TLS 1.3、 最低 TLS 1.2，用户密码经过哈希和加盐。Melio
              还称，其不直接存储、处理或传输卡号，而是依赖获得认证的 Level 1 PCI 合规第三方处理商。运营上，同一页面指向每日测试、活跃的 HackerOne 漏洞赏金，以及覆盖 CISO、安全团队和由
              Infrastructure、R&D、Operations、Legal、IT 参与的论坛式安全监督。对一个位于企业操作者、 供应商、银行和会计系统之间的支付工作流产品来说，这些控制有意义。


              合规故事不错，但公开层面仍不完整。Xero 的 FAQ 补充了一个重要法律细节：Melio 是 U.S. 持牌资金转移机构， 因此必须对用户做尽调。承包商税务工作流又通过安全 W-9 收集、TIN 验证和
              Tax1099 同步增加了一层控制。 但最强证据仍无法公开检查：ISO 证书只能按请求提供，Melio 的 SOC 2 Type II 报告可能需要 NDA。
              对尽调来说，这意味着公开记录支持一个可信控制环境，但认证范围、审计新近度和控制测试深度仍部分留在销售或安全门后。
