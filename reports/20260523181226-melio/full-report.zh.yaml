  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 悲观
        - 低利润率业务组合占比仍高，整合拖累持续，公开披露始终无法证明溢价经济性。
        - US$1.2B - US$1.6B
        - 约 6x-8.5x 年化收入；区间向降档后的上市可比公司表现压缩。
        - 如果 FY27 证据仍显示利润率拖累，且没有干净的独立 KPI 包，这一路径就有实质权重。
        - 利润率稀释、增长放慢、战略溢价坍塌。
      - - 基准
        - Melio 对 Xero 仍有战略价值，协同推进，但独立披露仍只部分改善。
        - US$1.7B - US$2.1B
        - 约 9x-11x 年化收入；承认 2024 轮估值，但折价处理 2025 战略控制权溢价。
        - 基于当前证据，这是概率最高的路径。
        - 证据质量仍属中等，一两个缺失指标仍会牵动区间。
      - - 乐观
        - 交叉销售、联合分发和渠道分发转化为强增长，同时 H2 FY28 盈亏平衡仍可信。
        - US$2.3B - US$2.8B
        - 约 12x-15x 年化收入；执行兑现后，战略溢价大部分被挣回来。
        - 在 Xero 或 Melio 披露更清晰的结构、利润率和 earnout 证据前，概率较低。
        - 需要协同落地，披露也必须明显好于当前市场可见信息。
    notes: 情景有意用区间表达，因为当前公开证据对锚点支持强，对独立运营细节支持弱。
    claimRefs:
      - CV009
      - CV011
      - CV013
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 协同滑坡
        - Xero 不再重申 ~US$70M 收入协同、~US$20M 成本协同或 H2 FY28 盈亏平衡。
        - 战略溢价逻辑变弱，和上市可比倍数的差距失去支撑。
        - 将估值观点移向悲观区间，并把 2025 年价格视为过时的战略乐观。
      - - 利润率拖累持续
        - Melio 持续稀释集团利润率，却没有 ARPU 或增长证据抵消。
        - 支持 Melio 更像低利润率支付量、而非高溢价 SaaS 的判断。
        - 把估值压向 BILL 和 AVDX 式上市可比区间。
      - - 规模停滞
        - 客户、支付量或收入锚点未能明显超过 80k / >US$30B / US$153M-US$187M 标记。
        - 削弱相对上市可比水平支付溢价的理由。
        - 降低战略溢价叠加，维持 research-more。
      - - 领导层或 earnout 扰动
        - 与留任挂钩的经济利益或超额表现里程碑看起来不太可能兑现。
        - 会表明或有部分更像愿望，而非大概率事项。
        - 下调乐观情景，承销时不纳入 2025 最高价值。
      - - 透明度仍不足
        - 收入结构、take rate、按支付轨道拆分的毛利率，或烧钱 / EBITDA 仍无干净披露。
        - 维持核心理由：该价格不能转移给少数股权投资者使用。
        - 不要把 Xero 价格作为新估值标尺；建议维持 research-more。
    notes: 这些触发因素应对照未来 Xero 披露或尽调材料监控，而不是对照泛化的风投情绪。
    claimRefs:
      - CV015
      - CV016
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入结构
        - 订阅、支付和联合分发收入按年份、队列拆分。
        - 决定 Melio 有多少收入应按 SaaS 型倍数处理，多少应按支付型倍数处理。
        - 向 Xero 财务团队索取交割后收入桥接，或在 NDA 下向 Melio 管理层索取。
      - - 按支付轨道拆分的毛利率
        - ACH、卡支付、国际支付和订阅收入的毛利率。
        - 整个可比桥接取决于：Melio 中有多少在结构上属于低利润率。
        - 索取队列和产品层面的毛利率明细。
      - - Take rate 和 yield
        - 支付 take rate、float 贡献及任何合作伙伴分成条款。
        - 说明交易量增长能否转化为高质量收入，而不是低价值吞吐量。
        - 索取支付 yield 历史和合作伙伴经济瀑布。
      - - 独立 EBITDA / 烧钱桥接
        - Xero 交割后，干净的协同前 EBITDA 和现金消耗桥接。
        - 用于判断 H2 FY28 盈亏平衡是否可信，还是主要由模型驱动。
        - 索取月度管理账和交割后经营计划。
      - - 或有对价记分卡
        - 精确绩效门槛，以及当前相对最高 US$0.5B 或有方案的达成进度。
        - 显示最高价值中有多少现实可赚，多少只是理论值。
        - 索取 earnout 框架、里程碑记分卡和领导层留任状态。
      - - 渠道集中度
        - 按 Fiserv、金融机构和嵌入式渠道拆分的合作伙伴级交易量、收入和依赖度。
        - 战略契合度可能很强，即便集中风险让独立估值标尺变脆弱。
        - 索取合作伙伴集中度表和合同续约时间线。
    notes: 这些问题是把战略控制权价格转化为可复用估值标尺所需的最低集合。
    claimRefs:
      - CV007
      - CV012
      - CV013
      - CV041
      - CV047
      - CV050
