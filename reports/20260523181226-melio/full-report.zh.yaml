  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变观点
    rows:
      - - 投资逻辑：Melio 在美国 SMB 账单支付上已有真实规模和战略稀缺性。
        - 80,000 客户、>US$30B FY25 支付额、US$153M FY25 收入，以及合作伙伴分发，共同支撑真实战略价值。
        - 新的 FY27 披露若显示规模正在转化为可持续利润率和现金生成，会强化投资逻辑。
      - - 投资逻辑：Xero 买的是控制权和明确协同，不只是当前收入。
        - Xero 披露 FY28 收入协同约 ~US$70M、成本协同约 ~US$20M，交割后北美收入基数也大得多。
        - 证明协同落地按计划推进，而不只是交易模型里的乐观假设，才支撑更高估值。
      - - 反向逻辑：2025 年价格明显高于上市可比公司水平。
        - BILL、AVDX 和 Xero 的上市 EV-revenue 可比倍数约在 2.1x 到 5.0x，而 Xero 为 Melio 支付的前期倍数是 13.4x。
        - 如果 Melio 披露高质量增长、利润率和 take rate，和上市可比公司的差距可能更站得住。
      - - 反向逻辑：支付业务组合拖累利润率质量，弱于纯 SaaS。
        - Xero 的 FY26 材料明确称 Melio 会拉低毛利率画像，并且到 H2 FY28 才达到 run-rate adj-EBITDA 盈亏平衡。
        - 按支付轨道拆分的独立毛利率和 EBITDA 桥接，可显示混合利润率结构是否已经正常化。
      - - 反向逻辑：关键估值输入仍未公开。
        - 收入结构、或有支付触发门槛、take rate、烧钱速度，以及交割后的收入质量指标仍未公开。
        - 包含结构、利润率、烧钱速度和 earnout 记分卡的尽调包，会收窄估值区间，并可能把结论推向合理。
    notes: 每行都把当前观点和可能改变观点的具体证据相连。
