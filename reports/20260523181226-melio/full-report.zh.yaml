    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Melio 是一家聚焦 U.S. 的 B2B 支付平台，2018 由 Matan Bar、Ilan Atias 和 Ziv Paz 创立。 现有官方资料显示，公司横跨 New York、Denver 和 Tel
              Aviv，并把使命定义为简化 SMB、会计人员及其供应商的企业支付。 产品范围已经不只是账单支付：Melio 对外销售的是一整套应付账款和应收账款栈，覆盖发票创建、付款链接、审批、 卡或银行账户出资、国际支付和
              AI 辅助工作流自动化。


              当前运营画像要分两层读：官方产品口径，以及确定的所有权事实。Melio 称，已有超过 100,000 名企业主使用该平台， 40M+ 账单按时支付、$100B+ 支付被处理、2M+
              供应商收到付款。这些指标来自公司披露，并非审计数据，但足以说明规模已经可观。 同样重要的是，Xero 交易后独立 Melio 服务仍在运行；与此同时，Xero 已经把由 Melio 支撑的账单支付嵌入其 U.S.
              平台。
