  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律暴露是结构性风险，不是偶发问题
        blocks:
          - type: paragraph
            body: >-
              Melio 最持久的风险不是纯软件执行，而是法律定位和受监管资金流转。留存下来的法律材料显示三条具体约束。第一，Melio
              的争议条款把大多数用户纠纷推向个人约束性仲裁，避开集体程序；这可能降低公开诉讼可见度，但如果客户不满在法院取证之外累积，也会抬高声誉风险。第二，Melio 自己的投诉和牌照页面写明，汇款服务由 Melio
              Solutions Inc. 提供，并把未解决投诉导向州监管机构；这更像是在州级牌照预期内运营的业务，而不是纯粹不受监管的 SaaS 工具。第三，隐私、AML 和制裁义务仍然存在，因为 Melio
              处理银行凭证、跨境转账和伙伴数据共享，而 OFAC 与 FinCEN 在 2026
              年仍持续强调基于风险的合规项目。投资含义是，法律开销会反复出现：牌照、投诉处理、制裁筛查、隐私治理和收购审批条件，即使产品需求健康，也都可能拖慢增长或抬高成本。
