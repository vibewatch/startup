  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Melio 的客户旅程从三类入口之一开始——直接 SMB、会计师主导部署，或合作伙伴嵌入——随后进入验证、首笔付款、经常性审批，并扩展到更深的财务工作流。
    data:
      nodes:
        - id: entry-direct
          label: 直接 SMB 发现
          detail: 所有者或财务负责人为供应商付款、支付链接或现金流时点找到 Melio，而不是从合作伙伴平台进入。
          tone: neutral
        - id: entry-accountant
          label: 会计师主导部署
          detail: 会计师事务所把客户邀请进托管工作流，权限、审批和折扣计划结构已预先定义。
          tone: positive
        - id: entry-partner
          label: 合作伙伴嵌入入口
          detail: 客户在 Xero 或 Gusto 内遇到 Melio，而不是通过独立获客进入，因此设置、计费和支持部分由渠道塑形。
          tone: warning
        - id: verify-connect
          label: 验证和连接
          detail: 客户验证企业信息，连接银行或会计软件，并在首次真实使用前配置角色。
          tone: neutral
        - id: first-live
          label: 首个真实账单或发票
          detail: 用户导入账单、排期付款、发送发票或路由审批，且无需手动重复录入时，初始价值出现。
          tone: positive
        - id: repeat-use
          label: 重复使用和协作
          detail: 当客户、审批人、供应商和员工在大量账单、实体或客户账簿中重复该循环时，工作流变得有粘性。
          tone: positive
        - id: expand-anchor
          label: 扩展和留存锚点
          detail: 客户通过更多客户、更多支付量、AR、国际支付或嵌入式合作伙伴工作流深化使用，但合作伙伴特有摩擦仍可能削弱留存。
          tone: risk
    claimRefs:
