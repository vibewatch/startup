companyProfile:
  summary: >
    Melio 是一家聚焦 U.S. 的 B2B 支付与工作流平台，2018 由 Matan Bar、Ilan Atias 和 Ziv Paz 创立。 产品把应付账款、应收账款、开票、审批、卡或银行账户出资、国际支付，以及通过
    Xero、Gusto、Fiserv、 Shopify、Capital One 等渠道的嵌入式伙伴分发整合在一起。做到有意义的 SMB 规模后，Melio 在 June 2025 同意出售给 Xero；到 March
    2026，Xero 已把由 Melio 支撑的在线账单支付嵌入其 U.S. 产品，同时保留 Melio 作为独立产品继续运行。
