  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: Melio 的核心运营流从账单或发票摄入开始，进入审核和审批，再通过支付通道执行，并把结果状态同步回会计和合作伙伴系统。
    data:
      nodes:
        - id: ingest-document
          label: 账单或发票到达
          detail: 用户上传文件、转发邮件、从会计软件导入、连接 Amazon Business，或手动创建应收请求。
        - id: capture-and-code
          label: 捕获并分类
          detail: Melio 提取供应商、金额、到期日、明细行和编码细节，AI 捕获会随用户纠正逐步学习。
        - id: review-and-approve
          label: 审核和审批路由
          detail: 团队成员或会计师审核草稿，应用角色和权限，并触发审批或批量排期逻辑。
        - id: choose-rail
          label: 选择资金和交付方式
          detail: 付款方选择 ACH、银行转账、卡、电汇、支票、虚拟卡交付或支持的国际支付选项。
        - id: execute-payment
          label: 执行付款或请求
          detail: Melio 从资金来源扣款，发出选定交付方式，并跟踪 AP 支出和 AR 收款的付款状态。
        - id: sync-and-reconcile
          label: 同步并对账
          detail: 账单、供应商、付款、发票和状态同步回 QuickBooks、Xero 或合作伙伴界面，用于记账和可视化。
        - id: monitor-and-assist
          label: 监控状态并询问 Agent Mel
          detail: 用户查看仪表盘、未清余额、供应商历史或付款状态，也可以向 Agent Mel 查询上下文答案。
      edges:
        - from: ingest-document
          to: capture-and-code
          label: 导入或上传
        - from: capture-and-code
          to: review-and-approve
          label: 草稿创建
        - from: review-and-approve
