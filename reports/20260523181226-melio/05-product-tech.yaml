    title: Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      Publicly documented Melio workflow layers stack user workspaces on top of capture, approvals, payment
      orchestration, connector sync, and trust/intelligence services. The lower-level infrastructure beneath
      those visible layers is not publicly disclosed in the retained sources.
    data:
      layers:
        - label: User and workspace surfaces
          detail: >-
            Direct Melio business UI, accountant multi-client dashboard, payment links, invoice views, and
            embedded partner surfaces such as Xero and Gusto bill pay.
        - label: Workflow applications
          detail: >-
            Accounts payable, accounts receivable, invoice management, contractor/tax workflows, and
            client-management surfaces exposed as user-facing product modules.
        - label: Capture and control services
          detail: >-
            AI bill capture, document inboxes, uploads, scheduling, batch actions, roles, permissions,
            and approval policies that prepare a payment for execution.
        - label: Payment orchestration
          detail: >-
            ACH, card-funded payments, wire, check, virtual-card delivery, same-day and instant options,
