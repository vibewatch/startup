  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: certification-artifacts
      missingEvidence: Publicly inspectable SOC 2 scope details, report date, exceptions, and the specific ISO certificates currently held by Melio.
      whyItMatters: Buyers and regulated partners need to validate control scope and audit recency rather than rely on request-only statements.
      diligencePath: Request Melio's SOC 2 bridge letter and latest ISO certificate package under NDA from the security team.
      relatedQuestionRefs: [QE012]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: api-surface
      missingEvidence: Official public API reference, authentication model, webhook schema, rate-limit policy, and deprecation policy for partner or embedded developers.
      whyItMatters: API diligence cannot rely on aggregator metadata alone when assessing integration effort, breakage risk, or support burden.
      diligencePath: Obtain direct developer documentation or partner implementation guides from Melio's partner engineering team and compare them to API Tracker listings.
      relatedQuestionRefs: [QE015]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: architecture-opacity
      missingEvidence: Vendor-confirmed infrastructure architecture covering hosting, data stores, event processing, resilience, monitoring, and incident response.
      whyItMatters: The public workflow view is not enough to underwrite reliability, concentration, recovery posture, or multi-tenant operational risk.
      diligencePath: Request a current architecture review deck, security architecture diagram, and SRE or platform-readiness materials from Melio technical leadership.
      relatedQuestionRefs: [QE018]
      relatedTableRefs: [TE003]
    - type: conflicting-data
      severity: material
      topic: sync-cadence
      missingEvidence: A connector-specific statement reconciling real-time marketing language with the help-center claim that QuickBooks Online sync runs every 5 minutes.
      whyItMatters: Sync timing affects reconciliation accuracy, operational trust, and the design of partner or accountant workflows.
      diligencePath: Ask product support or partner engineering for documented SLA-style sync timing by connector, entity type, and failure mode.
      relatedQuestionRefs: [QE020]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: roadmap-visibility
      missingEvidence: A dated standalone Melio changelog, release calendar, or roadmap artifact covering product, API, and platform changes.
      whyItMatters: Without a release record, technical diligence cannot assess pace of shipping, deprecation risk, or roadmap credibility independently.
      diligencePath: Request a product-release archive or roadmap readout from product leadership and compare it to partner-facing feature announcements.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE005]
    - type: missing-source
      severity: minor
      topic: mobile-disclosure
      missingEvidence: A current dedicated mobile product page or capability matrix showing which AP, AR, approval, and support tasks are supported in the mobile app.
      whyItMatters: Mobile depth may matter for owner-operators and field teams even if it is not the core enterprise differentiator.
      diligencePath: Request current iOS and Android feature documentation or product screenshots from Melio and compare them against desktop workflows.
      relatedQuestionRefs: [QE026]
      relatedTableRefs: [TE001]
    - type: enumeration-incomplete
      severity: material
      topic: partner-ecosystem
      missingEvidence: A complete current catalog of all live embedded partners, accounting connectors, and third-party integrations, including which features are GA versus pilot.
      whyItMatters: Ecosystem breadth is a major part of Melio's moat and distribution story, but the public named-partner list may not be exhaustive.
      diligencePath: Request a partner and integration inventory from business development or partner engineering, including live, beta, and deprecated surfaces.
      relatedQuestionRefs: [QE027]
      relatedTableRefs: [TE001]
    - type: missing-source
      severity: material
      topic: status-history
      missingEvidence: A direct official status page, incident archive, or API uptime history that can be cited publicly.
      whyItMatters: Operational transparency is part of technical diligence, especially for a workflow product that coordinates funds movement and accounting sync.
      diligencePath: Ask Melio for a public or shareable status-history source, or request incident summaries and uptime reports under diligence NDA.
      relatedQuestionRefs: [QE028]
