        - label: Trust and intelligence services
          detail: >-
            Business verification and compliance checks, encryption, external PCI processing, bug bounty,
            security governance, and Agent Mel on top of workflow data.
    approximationNotes: >-
      This is a report-authored architecture abstraction built from public product and partner pages. It models
      the visible operating layers rather than any vendor-confirmed internal microservice design.
