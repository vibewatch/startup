      - CE018
      - CE019
      - CE034
      - CE042
      - CE043
callouts:
  - calloutType: strength
    title: Workflow-first product can travel across direct and embedded channels
    body: >-
      Melio's biggest current product advantage is not an exotic rail or a proprietary hardware asset. It is the
      portability of the AP/AR workflow across standalone SMB use, accountant multi-client operations, and
      embedded partner surfaces such as Xero and Gusto. That portability expands distribution while keeping the
      core product centered on the same capture, approval, payment, and reconciliation jobs.
    claimRefs:
      - CE001
      - CE018
      - CE019
      - CE021
      - CE045
      - CE050
  - calloutType: risk
    title: Low-level technical architecture remains partly opaque
    body: >-
      Public evidence is strong on visible workflow behavior and trust controls, but weak on the internal system
      design beneath those surfaces. The retained set did not reveal a public standalone systems diagram,
      infrastructure stack, database design, event bus, or official API reference, so architecture beyond the
      user-visible stack is still partly inferred.
    claimRefs:
      - CE037
      - CE038
      - CE039
      - CE041
  - calloutType: risk
    title: Partner-led growth introduces feature-fragmentation and migration risk
    body: >-
      Melio's ecosystem is valuable, but partner surfaces are not interchangeable with the standalone product.
      Amazon sync is one-way, Xero embedded bill pay does not import historical standalone Melio data, and
      partner contexts can impose their own scope or pricing constraints. Distribution strength therefore comes
      with portability and consistency trade-offs.
    claimRefs:
      - CE017
      - CE025
      - CE046
      - CE049
      - CE050
