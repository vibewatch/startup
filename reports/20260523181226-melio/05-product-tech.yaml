  - id: roadmap-and-rd-signals
    title: Roadmap and R&D signals
    body: |-
      The most visible 2026 R&D signal is Agent Mel. Melio's January 2026 launch materials describe it as a fully embedded, no-setup assistant that answers payment, product, and vendor questions, surfaces balances and payment status, and builds on pre-existing AI bill-capture and data-entry tooling. That is important because it shows Melio's public innovation path is not centered on launching an all-new product line; it is about layering assistance and automation on top of an already mature AP/AR workflow. The post-acquisition Xero release points in the same direction by pairing Melio payments infrastructure with JAX-driven reconciliation and an AI-powered operating system narrative.

      Beyond that, the roadmap is more directional than explicit. Amazon Business integration shows prior investment in external API-based invoice ingestion, and Gusto's live embedded experience shows Melio's platform can be repackaged into partner-native workflows. Xero's FAQ provides the clearest forward-looking milestone by stating that a fuller approvals workflow is planned later in 2026. But the retained set did not surface a standalone Melio changelog, dated release calendar, public status history, or detailed public API roadmap. So the R&D conclusion is constructive but qualified: Melio is clearly still shipping, especially around AI assistance and embedded finance, yet outside partner releases the public roadmap remains sparse.
