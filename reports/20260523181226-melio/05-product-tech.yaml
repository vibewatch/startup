  title: Product & Technology
  summary: >-
    Melio's product is best understood as a workflow-centric AP/AR platform rather than a narrow payment button.
    Current public sources show a mature direct product for SMBs and accountants plus a meaningful embedded
    distribution layer through Xero, Gusto, Shopify, Amazon Business, Capital One, Clover, and Fiserv.
    Public evidence documents workflows, controls, and partner surfaces well, but low-level API and
    infrastructure detail remains limited, so parts of the operating architecture are necessarily inferred.
sections:
  - id: product-platform-and-workflows
    title: Product platform and workflow coverage
    body: |-
      Melio's current product footprint is broader than a simple bill-pay tool. Official surfaces now describe an all-in-one platform that combines accounts payable, accounts receivable, ACH and card-funded payments, approval workflows, AI-assisted bill capture, tax-form collection, international payments, payment links, and accountant-specific multi-client controls. The product is organized around the job to be done rather than around isolated SKUs: capture or import a bill, review and code it, route it for approval, choose a funding and delivery method, execute the payment, then sync the result back into the accounting ledger. On the receivables side, the same system can generate invoices, send branded payment links, and deposit funds directly into the business bank account.

      That workflow framing matters because Melio serves several operators at once. SMB owners get lightweight AP and AR, accounting firms get centralized dashboards with six permission levels and multi-client oversight, and larger channel partners can embed the same payment capabilities inside their own products. The pricing page also shows a deliberate capability ladder: low-friction entry tiers preserve the self-serve motion, while Core, Boost, and Unlimited add sync, approvals, vendor credits, advanced roles, premium support, and white-glove onboarding. In other words, the module map is really a workflow-and-control map: the same core rails are repackaged for direct users, accountants, and embedded partners.
