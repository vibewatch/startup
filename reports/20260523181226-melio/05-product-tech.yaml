  - id: integrations-and-ecosystem
    title: Integrations and ecosystem
    body: |-
      Melio's ecosystem is now a material part of the product, not just an accessory. The direct integrations with QuickBooks, Xero, and Amazon Business cover the most obvious accounting and invoice-ingestion jobs, while the partner platform stretches farther into distribution. Melio's own partner page says the company can deliver branded web and mobile AP/AR experiences in a matter of weeks and explicitly names Fiserv, Capital One, Shopify, Clover, and Gusto as live partner surfaces. External partner documentation reinforces that this is not theoretical: Xero launched online bill payments powered by Melio in March 2026, Gusto's live bill-pay product is powered by Melio, and Amazon Business uses a reconciliation-API connection to import invoices into Melio.

      The ecosystem strength comes with technical caveats. The accounting connectors are powerful but not perfectly symmetric across contexts: QuickBooks Desktop support is tier-limited, Amazon sync is one-way, and Xero's embedded experience does not inherit historical standalone Melio data. Xero's FAQ also shows that partner embeds can have their own product constraints, including domestic-USD-only scope today and a still-planned full approvals workflow later in 2026. The result is a strong distribution and integration story, but also a dependency map in which Melio increasingly relies on external platforms, embedded channels, and connector behavior to complete the customer experience.
