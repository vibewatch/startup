  - id: FE004
    title: Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Melio's strongest current capabilities are its core AP workflow, accounting sync, and partner-embedded
      distribution. AI assistance and tax workflows are meaningful additions, but public technical disclosure
      remains thinner than product and workflow disclosure.
    data:
      columns:
        - Workflow coverage
        - Automation depth
        - Integration breadth
        - Control / compliance depth
        - External distribution depth
      rows:
        - label: AP automation core
          values:
            - High — end-to-end capture, review, approval, payment, and sync
            - High — AI capture, batch actions, scheduling, recurring payments
            - Medium — depends on connectors and vendor/payment-method support
            - Medium — strong controls visible, but audit artifacts are not public
            - Medium — direct product plus partner reuse
        - label: AR and payment requests
          values:
            - Medium — invoices, branded payment links, direct-to-bank settlement
            - Medium — low-friction collection and tracking, less workflow depth than AP
            - Low-to-medium — fewer named external AR-specific integrations in retained set
            - Medium — payment protection is marketed, but public evidence depth is modest
            - Medium — reused in partner embeds
        - label: Accounting sync
          values:
            - High — core to direct and embedded experience
            - Medium — automated two-way sync with caveats
            - High — QuickBooks, Xero, Amazon import, Tax1099, Gmail-adjacent workflows
            - Medium — verification and audit implications matter, but are only partly documented
            - High — central to Xero and Gusto positioning
        - label: Accountant workspace
          values:
            - High — one dashboard across clients
            - Medium — approvals, permissions, billing, and support tooling
            - Medium — primarily tied to accounting connectors rather than broad app-store depth
            - High — six roles, W-9/1099 support, premium controls on paid tiers
            - Low — mostly direct-to-firm rather than white-labeled distribution
        - label: Embedded partner platform
          values:
            - High — live inside multiple partner channels
            - Medium — branded deployment and analytics, but public API detail is thin
            - High — banks, SaaS, marketplaces, accounting platforms
            - Medium — partner contexts inherit compliance obligations but not uniform feature depth
            - High — major current growth vector
        - label: AI and assistant layer
          values:
            - Medium — useful across AP, support, and visibility use cases
            - Medium — live capture plus conversational assistant, but no public deep technical docs
            - Low — few retained direct API or SDK artifacts for external AI developers
            - Low-to-medium — public guardrail and evaluation detail absent
            - Medium — appears in direct product and partner-adjacent narratives
        - label: Tax and contractor automation
          values:
            - Medium — focused but practical workflow extension
            - Medium — TIN validation and Tax1099 sync add real automation
            - Low — ecosystem mostly concentrated around Tax1099 and core payment rails
            - High — concrete compliance utility visible in docs
            - Low — mainly a direct-product control surface
    approximationNotes: >-
      Matrix ratings are report-authored qualitative assessments based on current public surfaces, not Melio's own
      internal scorecard or a validated third-party benchmark.
