  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - Pay domestic and cross-border supplier bills from one dashboard
        - Email or upload invoices, review, approve, choose ACH/card/wire/check, then reconcile manually
        - Melio AP workflow captures, routes, pays, and syncs bills inside one interface
        - Melio claims 15+ hours saved monthly on average and 40M+ bills paid through the platform
        - Public sources do not break out success rates or exception rates by rail, geography, or ticket size
      - - Let an accounting firm manage AP and AR for multiple clients without losing control
        - Client-by-client logins, manual handoffs, and unclear approval ownership
        - Accountant dashboard centralizes clients, roles, approvals, support, and synced books
        - Six permission levels and one login reduce handoff friction for firms
        - Public docs do not fully detail audit-log visibility, impersonation controls, or SOX-style approval evidence
      - - Get paid faster without forcing customers to create accounts
        - Email invoices, wait for checks, or collect bank details manually
        - Branded invoices and payment links accept card or ACH and settle to bank accounts
        - Customers can pay in a few clicks and businesses can decide who covers card fees
        - Public sources do not disclose conversion rates, fraud rates, or disputes by channel
      - - Pull Amazon Business invoices into AP workflow and pay them flexibly
        - Switch between Amazon invoice pages and separate bill-pay tools
        - Amazon invoices import into Melio and can be paid by card, ACH, or instant transfer
        - Batch, recurring, and partial payments reduce invoice-by-invoice admin work
        - Paid status does not round-trip back to Amazon because the sync is one-way
      - - Run bill pay inside a partner platform such as Gusto or Xero
        - Use separate payroll, accounting, and bill-pay products with duplicate entry
        - Embedded Melio bill pay lets users stay inside the partner surface while Melio handles rails and verification
        - Gusto and Xero both market cash-flow visibility and reduced switching between tools
        - Embedded products have partner-specific feature limits, including domestic-USD-only scope in Xero today and add-on-gated features in Gusto
    notes: >-
      Benefits mix direct company claims with partner-surface descriptions. Limitations reflect explicit partner
      constraints or clear disclosure gaps rather than hypothetical failure modes.
