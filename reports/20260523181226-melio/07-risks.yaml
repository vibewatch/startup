  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fraud-loss-disclosure
    missingEvidence: Segmented fraud-loss, reserve, chargeback, and payout-hold metrics for Melio by product and customer cohort.
    whyItMatters: Without loss and reserve data, it is hard to tell whether public complaints are edge cases or symptoms of a broader risk-control cost.
    diligencePath: Request fraud-loss, reserve, and payout-hold dashboards plus cohort trend lines under NDA.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: partner-bank-contracts
    missingEvidence: Public or diligence-accessible partner-bank agreements, reserve rights, termination triggers, and migration timelines for Melio’s banking relationships.
    whyItMatters: Partner dependence is central to the thesis, but the public record does not show how much unilateral termination or reserve power sits outside Melio’s control.
    diligencePath: Request key banking contracts, reserve-policy summaries, and contingency migration plans.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: integration-retention
    missingEvidence: Post-close attrition, retention-plan uptake, and milestone-level roadmap reporting for the Xero integration.
    whyItMatters: Leadership continuity and employee retention are explicit assumptions in the acquisition case, but the public record is too thin to underwrite them with confidence.
    diligencePath: Request post-close attrition by function, retention-package design, and roadmap milestone scorecards.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: A public incident log, support SLA history, processor outage history, or security-incident trend data for Melio.
    whyItMatters: Security and support controls look real, but there is not enough longitudinal public evidence to quantify operational reliability.
    diligencePath: Request a 24-month incident register, processor dependency map, and support SLA dashboard.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: enumeration-incomplete
    severity: minor
    topic: state-license-coverage
    missingEvidence: Independent regulator confirmations for the full state-by-state license footprint beyond Melio’s own disclosure page and one Indiana snapshot.
    whyItMatters: The company page appears broad, but independent confirmation remains sparse, which leaves some licensing breadth uncorroborated.
    diligencePath: Expand regulator lookups state by state and save screenshots or regulator extracts for each active jurisdiction.
    relatedQuestionRefs:
    - QR003
    - QR029
    relatedTableRefs:
    - TR001
