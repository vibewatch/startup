- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Licensing or complaint escalation
    - State regulator actions or unresolved complaint backlog
    - Named regulatory action, license restriction, or complaint-aging trend that persists for two quarters
    - Move the thesis to hold or avoid until remediation evidence is public.
  - - Support and workflow friction
    - Review sentiment and support response time
    - Sustained account-closure or workflow complaints without visible product/service improvement
    - Assume higher churn and lower attach on premium workflows.
  - - Partner concentration
    - Named partner continuity and attachment rates
    - Loss or material de-prioritization of a major embedded partner channel
    - Reduce growth expectations and re-underwrite distribution economics.
  - - Integration retention
    - Leadership continuity and employee attrition
    - Key executive departure or missed retention milestones in the first 12 months post-close
    - Treat execution risk as thesis-critical and demand new diligence before increasing exposure.
  - - Security and privacy controls
    - Incident disclosures, audit exceptions, or major privacy complaints
    - Material incident, repeat privacy issue, or weakened control attestations
    - Re-rate operational and legal risk upward and require an updated control review.
  - - Competitive workflow gap
    - Buyer switching evidence versus BILL or QuickBooks
    - Repeated evidence that approvals, support, or vendor-payment workflows lag leading alternatives
    - Lower terminal margin assumptions and downgrade premium-product upside.
  notes: Kill criteria are framed as monitorable public or diligence-obtainable signals rather than as abstract risk labels.
