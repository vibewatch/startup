- id: operational-support-risk
  title: Operational risk shows up in documented payment friction, support load, and control dependencies
  body: 'Melio’s public support corpus makes clear that operational risk is not hypothetical. The company’s own troubleshooting section lists payment denials, ACH-delivery failures, check-delivery delays, failed bank verification, batch-payment errors, and voided checks as recurring support cases. The micro-deposit article adds another practical friction point: after three failed verification attempts, a bank account is blocked for 48 hours, forcing users into alternative payment methods or new account setup. Cross-border guidance increases the stakes because international payments can involve intermediary banks, compliance checks, fraud exposure, fees, and shipment delays. Security disclosures are real and helpful—PCI-compliant card processing, SOC 2 availability, ISO certifications on request, encryption, and a CISO-led program—but those controls do not remove customer pain when approval workflows, payment routing, or support response times disappoint. Independent review evidence matters
    here: Trustpilot and ComplaintsBoard both surface account-closure, vendor-payment, and slow-support complaints that translate operational controls directly into retention and reputation risk.'
