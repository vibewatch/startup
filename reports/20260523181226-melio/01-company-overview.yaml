- id: capital-ownership
  title: Funding history, valuation reset, and stakeholder map
  body: |-
    Melio’s capital history shows both breakout growth and a later valuation reset. Business Wire reported a $110 million January 2021 round at a $1.3 billion valuation. Later in 2021, Melio announced a $250 million Series D that lifted valuation to $4 billion and broadened the investor base around Thrive Capital, General Catalyst, Tiger Global, Accel, Bessemer, Coatue, Corner Ventures, and Latitude. By late 2024, the company raised another $150 million at a $2 billion valuation, with Fiserv leading and Shopify Ventures plus Capital One Ventures participating. The round still signaled strong distribution demand, but it also confirmed a down-round versus the 2021 peak.

    Ownership changed more dramatically in 2025. On June 25, 2025, Xero announced an agreement to acquire 100% of Melio for $2.5 billion upfront plus up to $0.5 billion of contingent, deferred, and rollover consideration tied mainly to performance and retention. Public sources suggest the deal closed on October 15, 2025. Across the pre-sale period, reported total capital raised converges only to a range of roughly $650 million to $656 million, so the precise fully diluted cap table still requires private confirmation.
