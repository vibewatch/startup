  title: Governance and cap-table visibility remain materially incomplete
  body: Public materials are good enough to establish founders, major investors, and the headline Xero consideration, but they are not good enough to reconstruct the current board, post-close delegation model, or exact sale waterfall. Those are still management-only diligence items.
