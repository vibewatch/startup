- id: leadership-governance
  title: Leadership continuity and governance visibility
  body: |-
    Leadership remains strongly founder-centric, but the public record now ties Melio management directly into Xero’s US organization. Matan Bar is still presented as Melio co-founder and CEO in Melio materials, and Xero’s March 2026 launch release says he is CEO of Xero US with responsibility for both Xero US and Melio. Ilan Atias remains co-founder and CTO, while Tomer Barel continues to appear as president in current company info and late-2024 coverage. That combination suggests continuity in product and payments expertise through the ownership transition.

    The broader bench is only partially visible. Melio’s 2024 press room shows governance-related hiring with the appointment of a first CFO, Boaz BenDavid, and a chief compliance officer, Nicholas Passarelli. Historical governance is also clearer than current governance: the 2021 Series D release said Ken Chenault joined as a board observer. What is missing in 2026 is a current standalone Melio board roster or committee map after the Xero transaction, so diligence can see key executives but not the full governance design.
