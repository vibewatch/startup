  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-board
    missingEvidence: A current post-close Melio board roster, committee structure, and the exact line between Melio governance and Xero governance are not publicly disclosed.
    whyItMatters: Board composition and delegated authority determine how much autonomy Melio still has inside Xero and who approves major compliance, product, and capital-allocation decisions.
    diligencePath: Request the post-close governance chart, board or committee roster, and delegation-of-authority memo from management or counsel.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-cap-table
    missingEvidence: The exact fully diluted cap table, seller mix, rollover economics, and precise pre-sale total raised figure are not available on the public record.
    whyItMatters: Economic ownership affects return attribution, retention incentives, and how much of the Xero purchase price accrued to founders, employees, and each late-stage investor.
    diligencePath: Request the final cap table, sale waterfall, rollover schedule, and round-by-round financing ledger from management or lead counsel.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: post-close-financial-disclosure
    missingEvidence: No current standalone Melio revenue run-rate, take-rate, gross margin, or customer-cohort disclosure is available on a public post-close basis.
    whyItMatters: Without post-close financial disclosure, outside investors cannot judge whether the Xero integration is preserving Melio growth, improving monetization, or diluting economics.
    diligencePath: Request a post-close KPI pack with revenue, payment volume, take rate, gross margin, cohort trends, and partner-channel mix.
    relatedQuestionRefs:
    - QO026
