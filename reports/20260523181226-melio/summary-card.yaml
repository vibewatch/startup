summary:
  headline: >-
    Melio is a strategically valuable but still hard-to-underwrite SMB payments platform: Xero's deal confirms real
    scale and distribution value, yet the standalone economics remain too opaque to treat the strategic acquisition
    price as a reusable entry mark.
  overallScore: 6.5
