companyProfile:
  summary: >
    Melio is a U.S.-focused B2B payments and workflow platform founded in 2018 by Matan Bar, Ilan Atias,
    and Ziv Paz. The product combines accounts payable, receivable, invoicing, approvals, card-or-bank
    funding, international payments, and embedded partner distribution across channels such as Xero,
    Gusto, Fiserv, Shopify, and Capital One. After reaching meaningful SMB scale, Melio agreed to sell
    itself to Xero in June 2025; by March 2026, Xero had already embedded online bill payments powered by
    Melio into its U.S. product while keeping Melio live as a standalone offering.
  foundedDate: "2018-01-01"
