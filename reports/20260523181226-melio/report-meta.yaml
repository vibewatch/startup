    invoice customers, fund supplier payments by bank or card, send international payments, and embed bill-pay
    capabilities inside partner ecosystems.
  customerFocus: >
    U.S. small businesses, accountants, bookkeepers, and partner-distributed SMB customers that want integrated
    bill pay and receivables workflows.
  businessModel: >
    Hybrid software-plus-payments model combining workflow subscriptions or packaged plans with usage-based
    transaction monetization on card-funded, expedited, international, and embedded payment flows.
  stage: "Acquired / post-close Xero platform"
