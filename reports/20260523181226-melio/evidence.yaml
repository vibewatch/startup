evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-board
    missingEvidence: >-
      A current post-close Melio board roster, committee structure, and the exact line between Melio governance and Xero
      governance are not publicly disclosed.
    whyItMatters: >-
      Board composition and delegated authority determine how much autonomy Melio still has inside Xero and who approves
      major compliance, product, and capital-allocation decisions.
    diligencePath: >-
      Request the post-close governance chart, board or committee roster, and delegation-of-authority memo from
      management or counsel.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-cap-table
    missingEvidence: >-
      The exact fully diluted cap table, seller mix, rollover economics, and precise pre-sale total raised figure are
      not available on the public record.
    whyItMatters: >-
      Economic ownership affects return attribution, retention incentives, and how much of the Xero purchase price
      accrued to founders, employees, and each late-stage investor.
    diligencePath: >-
      Request the final cap table, sale waterfall, rollover schedule, and round-by-round financing ledger from
      management or lead counsel.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: post-close-financial-disclosure
    missingEvidence: >-
      No current standalone Melio revenue run-rate, take-rate, gross margin, or customer-cohort disclosure is available
      on a public post-close basis.
    whyItMatters: >-
      Without post-close financial disclosure, outside investors cannot judge whether the Xero integration is preserving
      Melio growth, improving monetization, or diluting economics.
    diligencePath: >-
      Request a post-close KPI pack with revenue, payment volume, take rate, gross margin, cohort trends, and
      partner-channel mix.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: material
    topic: integration-penetration
    missingEvidence: >-
      A current third-party estimate of the exact share of US SMBs that already use integrated accounting and AP
      software.
    whyItMatters: >-
      Without a penetration baseline, the chapter can size demand but cannot separate true whitespace from
      already-satisfied demand with precision.
    diligencePath: >-
      Request survey crosstabs or vendor-side market-share studies from Xero, Intuit, BILL, or independent market
      researchers that quantify integrated AP usage by business size.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: material
    topic: post-close-conversion
    missingEvidence: >-
      Post-close active-user counts, attach rates, payment take rates, retention, and cohort conversion metrics for
      Xero-powered Melio usage.
    whyItMatters: >-
      Current SOM math relies on pre-close Melio run-rate data rather than verified post-integration adoption or
      monetization.
    diligencePath: >-
      Ask management for post-close KPI packs showing active payers, ARPU, transaction margins, and retention by direct
      and syndicated channel.
    relatedQuestionRefs:
      - QM027
  - type: missing-source
    severity: material
    topic: tam-segmentation
    missingEvidence: A public breakdown of the $29B TAM by employer size, industry vertical, or workflow type.
    whyItMatters: >-
      The chapter can estimate a SAM from integration-demand ratios, but it cannot isolate the highest-yield subsegments
      without a disclosed TAM decomposition.
    diligencePath: >-
      Request Xero's TAM backup or third-party market models showing how the TAM splits across employer bands,
      verticals, and pre-accounting channel cohorts.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: cross-vendor-security-matrix
    missingEvidence: >-
      A certification-by-certification and control-by-control matrix across Melio, BILL, Ramp, AvidXchange, Tipalti, and
      Stampli using current SOC, PCI, tax, and fraud-control documents.
    whyItMatters: >-
      Public security pages show broad parity, but they do not make it possible to compare exact audit scope or control
      depth, which limits trust-posture conclusions.
    diligencePath: >-
      Request current security questionnaires, SOC reports, PCI attestations, and buyer security response packs from
      each vendor.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Current cohort-level win/loss, attach, churn, and renewal data for Melio versus BILL, QuickBooks Bill Pay, Ramp,
      Tipalti, AvidXchange, and Stampli.
    whyItMatters: >-
      Moat durability ultimately depends on realized commercial performance, not just public packaging, and that
      evidence is not available in retained public sources.
    diligencePath: >-
      Ask management for segment-level competitive dashboards, recent win/loss reviews, accountant-channel attach, and
      churn by product cohort.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-implementation
    missingEvidence: >-
      Signed quotes, discount schedules, implementation statements of work, and actual payment-fee schedules across the
      vendor set.
    whyItMatters: >-
      Editorial comparisons show directionally large TCO differences, but realized procurement outcomes can diverge
      sharply from public entry pricing and materially change platform choice.
    diligencePath: >-
      Collect recent customer quotes or procurement memos for Melio, BILL, Ramp, Tipalti, AvidXchange, QuickBooks Bill
      Pay, and Stampli at comparable invoice volumes.
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: >-
      Standalone Melio gross margin and contribution margin by subscription, ACH, card, speed fee, partner, and
      international payment stream.
    whyItMatters: >-
      Without a direct margin bridge, underwriting cannot tell whether current revenue quality looks closer to software
      economics or to lower-margin payment processing economics.
    diligencePath: Request a 24-month monthly gross-profit bridge by revenue stream plus transaction-cost detail by rail and channel.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales and marketing spend, channel mix, and payback by direct, accountant, and embedded-partner channel.
    whyItMatters: >-
      Melio can look strategically valuable while still generating weak incremental economics if partner or sales-led
      growth is too expensive.
    diligencePath: Request cohort-level CAC and payback by acquisition channel, plus channel rev-share or incentive schedules.
    relatedQuestionRefs:
      - QI011
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Logo churn, gross retention, NRR, and cohort retention curves for direct and embedded customers.
    whyItMatters: >-
      Retention quality determines whether public revenue growth represents durable recurring monetization or only high
      gross adds.
    diligencePath: Request monthly retention cohorts with customer counts, revenue retention, and contraction / expansion by segment.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Standalone cash balance, burn rate, runway, and parent-funding policy for Melio post-close.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from parent-level Xero statements alone if Melio still requires material
      investment before FY28 breakeven.
    diligencePath: >-
      Request a standalone treasury pack with monthly cash bridge, budgeted burn, approved operating plan, and
      intercompany funding commitments.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: obligations
    missingEvidence: >-
      Melio-specific debt schedule, warehouse or project-finance facilities, guarantees, indemnities, and
      contingent-consideration KPI schedule.
    whyItMatters: Hidden obligations could make the asset materially more capital intensive than public deal coverage suggests.
    diligencePath: >-
      Request legal-entity debt schedules, guarantee summaries, contingent consideration KPI definitions, and any
      warehouse or credit facilities.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: certification-artifacts
    missingEvidence: >-
      Publicly inspectable SOC 2 scope details, report date, exceptions, and the specific ISO certificates currently
      held by Melio.
    whyItMatters: >-
      Buyers and regulated partners need to validate control scope and audit recency rather than rely on request-only
      statements.
    diligencePath: Request Melio's SOC 2 bridge letter and latest ISO certificate package under NDA from the security team.
    relatedQuestionRefs:
      - QE012
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: api-surface
    missingEvidence: >-
      Official public API reference, authentication model, webhook schema, rate-limit policy, and deprecation policy for
      partner or embedded developers.
    whyItMatters: >-
      API diligence cannot rely on aggregator metadata alone when assessing integration effort, breakage risk, or
      support burden.
    diligencePath: >-
      Obtain direct developer documentation or partner implementation guides from Melio's partner engineering team and
      compare them to API Tracker listings.
    relatedQuestionRefs:
      - QE015
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: architecture-opacity
    missingEvidence: >-
      Vendor-confirmed infrastructure architecture covering hosting, data stores, event processing, resilience,
      monitoring, and incident response.
    whyItMatters: >-
      The public workflow view is not enough to underwrite reliability, concentration, recovery posture, or multi-tenant
      operational risk.
    diligencePath: >-
      Request a current architecture review deck, security architecture diagram, and SRE or platform-readiness materials
      from Melio technical leadership.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE003
  - type: conflicting-data
    severity: material
    topic: sync-cadence
    missingEvidence: >-
      A connector-specific statement reconciling real-time marketing language with the help-center claim that QuickBooks
      Online sync runs every 5 minutes.
    whyItMatters: Sync timing affects reconciliation accuracy, operational trust, and the design of partner or accountant workflows.
    diligencePath: >-
      Ask product support or partner engineering for documented SLA-style sync timing by connector, entity type, and
      failure mode.
    relatedQuestionRefs:
      - QE020
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: roadmap-visibility
    missingEvidence: >-
      A dated standalone Melio changelog, release calendar, or roadmap artifact covering product, API, and platform
      changes.
    whyItMatters: >-
      Without a release record, technical diligence cannot assess pace of shipping, deprecation risk, or roadmap
      credibility independently.
    diligencePath: >-
      Request a product-release archive or roadmap readout from product leadership and compare it to partner-facing
      feature announcements.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: minor
    topic: mobile-disclosure
    missingEvidence: >-
      A current dedicated mobile product page or capability matrix showing which AP, AR, approval, and support tasks are
      supported in the mobile app.
    whyItMatters: Mobile depth may matter for owner-operators and field teams even if it is not the core enterprise differentiator.
    diligencePath: >-
      Request current iOS and Android feature documentation or product screenshots from Melio and compare them against
      desktop workflows.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE001
  - type: enumeration-incomplete
    severity: material
    topic: partner-ecosystem
    missingEvidence: >-
      A complete current catalog of all live embedded partners, accounting connectors, and third-party integrations,
      including which features are GA versus pilot.
    whyItMatters: >-
      Ecosystem breadth is a major part of Melio's moat and distribution story, but the public named-partner list may
      not be exhaustive.
    diligencePath: >-
      Request a partner and integration inventory from business development or partner engineering, including live,
      beta, and deprecated surfaces.
    relatedQuestionRefs:
      - QE027
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: status-history
    missingEvidence: A direct official status page, incident archive, or API uptime history that can be cited publicly.
    whyItMatters: >-
      Operational transparency is part of technical diligence, especially for a workflow product that coordinates funds
      movement and accounting sync.
    diligencePath: >-
      Ask Melio for a public or shareable status-history source, or request incident summaries and uptime reports under
      diligence NDA.
    relatedQuestionRefs:
      - QE028
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, and logo-churn data for direct, accountant-managed, and partner-embedded customers.
    whyItMatters: >-
      Without cohort retention metrics, the chapter can show workflow fit but cannot quantify customer durability or the
      revenue impact of partner-channel friction.
    diligencePath: >-
