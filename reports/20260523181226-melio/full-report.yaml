      - number: '1.4'
        title: Milestones and current diligence flags
        blocks:
          - type: paragraph
            body: >-
              Melio’s milestone arc matters because it explains why Xero bought the company instead of merely extending
              an app-store relationship. The early milestones were company-building: founding in 2018, a unicorn-making
              Series C in January 2021, the $4 billion Series D in late 2021, and a Denver expansion meant to support
              rapid US growth. Product and distribution milestones followed: international payments launched in 2022,
              the Xero sync integration arrived in 2023, Fiserv partnership distribution deepened, and 2024 added Amazon
              Business collaboration plus finance and compliance leadership hires.


              The current phase is defined by integration and execution. The 2024 funding round cut Melio’s private
              valuation in half versus 2021, which is an adverse signal even alongside reported revenue growth. Xero
              then announced the acquisition in June 2025, Melio’s press room logged a Gusto launch in May 2025 and
              Agent Mel in January 2026, and Xero’s March 2026 release showed the post-close strategy already in market.
              Skeptical market commentary now centers less on product fit than on whether Xero paid a full price and can
              integrate the asset cleanly.
