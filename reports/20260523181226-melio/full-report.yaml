  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is structural, not incidental
        blocks:
          - type: paragraph
            body: >-
              Melio’s most durable risk starts with legal posture and regulated money movement rather than with pure
              software execution. The retained legal corpus shows three concrete constraints. First, Melio’s dispute
              language pushes most user conflicts into individual binding arbitration and away from class procedures,
              which can reduce public litigation visibility but also raises reputational risk if customer grievances
              accumulate outside court discovery. Second, Melio’s own complaint and licensing page states that money
              transmission services are provided by Melio Solutions Inc. and routes unresolved complaints to state
              regulators, which is consistent with a business operating inside state-by-state licensing expectations
              rather than a purely unregulated SaaS tool. Third, privacy, AML, and sanctions obligations stay live
              because Melio handles banking credentials, cross-border transfers, and partner data sharing while OFAC and
              FinCEN both continue to emphasize risk-based compliance programs in 2026. The investment implication is
              that legal overhead is recurring: licensing, complaint handling, sanctions screening, privacy governance,
              and acquisition-approval conditions can all slow growth or raise cost even if product demand stays
              healthy.
