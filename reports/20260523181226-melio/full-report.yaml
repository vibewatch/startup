            body: >-
              People and execution risk are unusually important for Melio because the Xero transaction concentrates
              accountability while expanding the number of moving parts. Public materials say Matan Bar will lead the
              combined U.S. business and that part of the acquisition consideration is tied to continued employment and
              annual objectives. That improves alignment, but it also means key roadmap, partner, and culture outcomes
              still depend on post-close retention rather than on already-proven steady state execution. Public evidence
              is thinner on employee attrition, support staffing, fraud-loss trends, reserve practices, and partner-bank
              contract rights, so the right investment posture is to convert uncertainty into monitored triggers rather
              than hand-wave it away. Melio does have mitigation levers—formal support channels, state complaint routes,
              security controls, and continuing product investment—but those only protect the thesis if they remain
              visible in lower complaint intensity, stable partner continuity, and on-time integration milestones. If
