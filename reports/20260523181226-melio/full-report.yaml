      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Melio does not publish a formal cloud or systems diagram in the retained sources, so the cleanest
              architectural description separates what is directly documented from what is inferred. Directly
              documented: Melio exposes capture and inbox surfaces, approval and permission controls, multiple funding
              and delivery methods, accounting connectors, tax-form workflows, and an embedded partner layer. The ACH
              page adds visible bank-connectivity mechanics through Plaid or micro-deposits and names banking partners
              used for ACH processing. The security page documents encryption, password handling, third-party PCI
              processing, bug bounty coverage, and cross-functional security governance. The QuickBooks, Xero, and
              Amazon pages show that workflow state is continuously pushed across external systems rather than staying
              in an isolated ledger.


              From those public pieces, the most credible operating model is a layered workflow stack: user workspaces
              at the top; capture, coding, and approval logic in the middle; payment orchestration across ACH, cards,
              wires, checks, virtual cards, and international delivery beneath that; then a connector layer that syncs
              state to accounting systems and partner embeds. Agent Mel sits above the workflow data as an assistant
              layer rather than as a separate product. What remains unverified is the underlying infrastructure: public
              pages do not identify Melio's cloud provider, data stores, event bus, queueing model, or official API
              endpoint structure. The chapter therefore treats the visible product architecture as well documented, but
              the low-level technical substrate as only partly observable.
