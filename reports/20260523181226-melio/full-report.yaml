          detail: >-
            Accounting firm invites a client into a managed workflow with permissions, approvals, and discounted plan
            structure already defined.
          tone: positive
        - id: entry-partner
          label: Partner-embedded entry
          detail: >-
            Customer encounters Melio inside Xero or Gusto rather than through standalone acquisition, so setup,
            billing, and support are partly channel-shaped.
