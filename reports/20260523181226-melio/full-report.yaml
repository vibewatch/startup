      - number: '5.4'
        title: Trust, security, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Melio's trust posture is much more concrete than its low-level infrastructure disclosure. The security
              page states that data at rest is encrypted with AES-256, data in transit uses TLS 1.3 at minimum TLS 1.2,
              and user passwords are hashed and salted. Melio also says it does not store, process, or transfer card
              numbers directly, instead relying on a certified Level 1 PCI-compliant third-party processor.
              Operationally, the same page points to daily testing, an active HackerOne bug bounty, and security
              oversight that spans a CISO, security team, and forum including Infrastructure, R&D, Operations, Legal,
              and IT. Those are meaningful controls for a payment workflow product that sits between business operators,
              vendors, banks, and accounting systems.


              The compliance story is good but incomplete in public. Xero's FAQ adds an important legal detail by
              stating that Melio is a licensed money transmitter in the US and therefore must perform due diligence on
              users. The contractor-tax workflow adds another control layer through secure W-9 collection, TIN
              validation, and Tax1099 sync. But the strongest artifacts are still not openly inspectable: ISO
              certificates are available only on request, and Melio's SOC 2 Type II report may require an NDA. For
              diligence, that means the public record supports a credible control environment, while still leaving
              certification scope, audit recency, and control testing depth partly behind a sales or security gate.
