      - number: '8.4'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The work that would move the call is specific, and most of it sits behind the public veil that still
              surrounds Melio as an integrated private asset. The biggest missing items are revenue mix by subscriptions
              versus payments and syndication, payment take rate, gross margin by rail, and a clean standalone EBITDA or
              burn bridge before synergy credit. Investors also need the exact outperformance thresholds behind the
              contingent consideration, evidence on whether leadership-retention targets are being met, and a clearer
              read on partner concentration inside the distribution network. Until those facts arrive, the correct
              posture is to translate uncertainty into kill criteria rather than to hand-wave it away. If Xero no longer
              reiterates synergy delivery, if margin dilution persists without growth offsets, or if the evidence gap on
              revenue quality stays open, the base case should move down quickly. Conversely, if management begins to
              disclose mix, take rate, and breakeven progression in a way that narrows the gap between strategic value
              and reusable standalone value, the chapter would be prepared to move from research-more toward a fairer
              stance. That is why the diligence asks are as important as the numeric range.
