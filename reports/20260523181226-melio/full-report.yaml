      - number: '6.4'
        title: Expansion and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Melio's expansion logic is visible even without formal retention metrics. Accountant firms can add more
              clients, unlock higher partner tiers, invite more collaborators, route more approvals, and extend from
              bill pay into AR, W-9, and 1099-adjacent workflows. Direct users can deepen usage with international
              payments, faster payments, customer refunds, and more frequent recurring bill runs. Partner channels add
              another expansion layer because Melio can sit behind larger software or financial brands rather than
              forcing every customer into standalone acquisition. The Gusto partnership is especially notable because it
              opens an addressable base of more than 400,000 SMBs, even if eligibility and tier gating limit realized
              attach.


              Those same channels create concentration risk. Public named proof is heavily concentrated in accounting
              firms, which makes Melio look strongest where accountants intermediate the workflow. Xero is
              simultaneously a growth surface and a risk surface: it is domestic-USD-only today, does not import
              historical standalone Melio data, and hosts the chapter's clearest adverse reviews. QuickBooks is the
              warning example that partner routes can be reversible; Bill Pay powered by Melio was shut down in 2024
              even though Melio itself continued. Because Melio does not publicly disclose top-customer concentration or
              direct-versus-partner mix by revenue or payment volume, diligence should treat partner dependence, channel
              portability, and proof-set skew as material open items rather than minor footnotes.
