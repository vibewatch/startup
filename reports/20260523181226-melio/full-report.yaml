  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      Melio's core operating flow starts with bill or invoice ingestion, moves through review and approvals, then
      executes through payment rails and syncs the resulting state back into accounting and partner systems.
    data:
      nodes:
        - id: ingest-document
          label: Bill or invoice arrives
          detail: >-
            A user uploads a file, forwards an email, imports from accounting software, connects Amazon Business, or
            creates a receivable request manually.
        - id: capture-and-code
          label: Capture and classify
          detail: >-
            Melio extracts vendor, amount, due date, line-item, and coding details, with AI capture learning from user
            corrections over time.
        - id: review-and-approve
          label: Review and approval routing
          detail: >-
            Team members or accountants review the draft, apply roles and permissions, and trigger approval or batch
            scheduling logic.
        - id: choose-rail
          label: Choose funding and delivery method
          detail: >-
            The payer selects ACH, bank transfer, card, wire, check, virtual-card delivery, or supported international
            payout options.
        - id: execute-payment
          label: Execute payment or request
          detail: >-
            Melio debits the funding source, issues the selected delivery method, and tracks payment state for both AP
            disbursements and AR collections.
        - id: sync-and-reconcile
          label: Sync and reconcile
          detail: >-
            Bills, vendors, payments, invoices, and statuses sync back to QuickBooks, Xero, or partner surfaces for
            bookkeeping and visibility.
        - id: monitor-and-assist
          label: Monitor status and ask Agent Mel
          detail: >-
            Users review dashboards, outstanding balances, vendor history, or payment status and can query Agent Mel for
            contextual answers.
      edges:
        - from: ingest-document
          to: capture-and-code
          label: Import or upload
        - from: capture-and-code
          to: review-and-approve
          label: Draft created
        - from: review-and-approve
          to: choose-rail
          label: Approved or scheduled
        - from: choose-rail
          to: execute-payment
          label: Payment intent finalized
        - from: execute-payment
          to: sync-and-reconcile
          label: Status and remittance recorded
        - from: sync-and-reconcile
          to: monitor-and-assist
          label: Books and dashboards updated
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE014
      - CE016
      - CE017
      - CE031
      - CE042
      - CE043
