      - number: '8.3'
        title: Scenario range and recommendation
        blocks:
          - type: paragraph
            body: >-
              The scenario range should be wide because the evidence quality is good on hard price anchors but still
              weak on the exact standalone economics that would justify one precise number. The bear case is US$1.2
              billion to US$1.6 billion, which assumes public-comp compression wins, lower-margin payments mix stays
              heavy, and integration creates more drag than cross-sell. The base case is US$1.7 billion to US$2.1
              billion, which gives Melio clear credit for scale, embedded distribution, and strategic scarcity, but
              still discounts Xero's 2025 control premium because standalone proof remains incomplete. The bull case is
              US$2.3 billion to US$2.8 billion, which effectively says Melio can earn back much of the strategic premium
              by proving synergies, distribution leverage, and H2 FY28 breakeven. The recommendation that follows is
              deliberately conservative: research-more, with medium confidence and a stretched valuation stance at or
              above the Xero upfront price. Put differently, the chapter does not say Melio is low quality. It says the
              current public record supports strategic value, but not enough standalone precision to underwrite paying a
              fresh price at the 2025 strategic mark without new data.
