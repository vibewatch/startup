  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Melio should be analyzed inside a narrower market than generic B2B payments. Xero's March 2026 launch
              framed the opportunity as a $29 billion US SMB payments TAM, but the actual product surface it shipped is
              accounting-led supplier bill pay: bill entry, payment choice, reconciliation, cash-flow visibility, and
              delegated approvals inside or adjacent to bookkeeping. That means the core market includes AP workflow
              software and embedded bill-pay orchestration for SMBs, accountants, and channel partners; it does not
              automatically include every form of B2B payment, payroll, lending, or full cross-border treasury.


              The status quo still matters because software is replacing messy operating behavior, not just an old
              payment rail. Xero itself says small-business bill management has been highly fragmented. The FAQ confirms
              the embedded workflow still has to meet supplier reality through ACH, cards, and mailed checks, while the
              Federal Reserve still reports enormous commercial check values. In other words, Melio competes against
              manual checks, bank portals, spreadsheet approvals, and disconnected bookkeeping handoffs as much as it
              competes against other software vendors. That boundary is what makes the market investable: the pain is
              workflow fragmentation, not simply the existence of payment volume.
