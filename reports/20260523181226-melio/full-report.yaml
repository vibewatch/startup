  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Melio no longer competes only against one other SMB bill-pay tool. The current landscape splits into at
              least four practical buckets. First are direct software peers such as BILL, which still targets SMB
              finance teams but increasingly packages a broader AP, AR, procurement, and partner-embedded platform.
              Second are broader finance-operations suites such as Ramp, which approach the same payables job from a
              corporate-card, procurement, and treasury bundle. Third are deeper AP specialists such as Tipalti,
              AvidXchange, and Stampli, which become more credible as buyer complexity rises toward multi-entity
              workflows, supplier-network management, or cross-border payouts. Fourth are incumbents and substitutes
              such as QuickBooks Bill Pay and bank bill pay, which remove the need for a separate AP vendor altogether
              for simpler use cases.


              That segmentation matters because Melio's strongest current edge is not maximum workflow depth. It is
              low-friction adoption for SMBs and accountants who want ACH, check, card, approvals, invoicing, and
              accounting sync without a heavy implementation project. Official pricing and product surfaces still center
              on free or low-cost entry, QuickBooks/Xero sync, approval workflows, and payment flexibility. But current
              2025-2026 evidence also shows why the field is tightening: BILL has far more network scale, Ramp now uses
              free entry pricing plus a broader finance stack, Tipalti is investing aggressively with fresh financing
              and AI claims, and QuickBooks has already replaced its earlier Melio-powered flow with a native bill-pay
              product. Melio is therefore competing across multiple buyer decision frames at once, not one clean
              category.
