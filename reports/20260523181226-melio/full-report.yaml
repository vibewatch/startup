      - number: '2.3'
        title: Segments, buyers, and distribution
        blocks:
          - type: paragraph
            body: >-
              The buyer map is not one-size-fits-all. Xero's own messaging makes clear that Melio is for small
              businesses, accountants, and bookkeepers, while acquisition coverage says the combined offer expands
              beyond 1-20 employee SMBs to self-employed businesses and 20-plus employee firms. That matters because the
              user, budget owner, and approval flow change by segment. In very small businesses, the owner or admin
              often sets up the product and funds payments directly. In employer SMBs with more finance structure,
              delegated approvers and controllers become more important. Accountants and bookkeepers matter because one
              workflow decision can propagate across many clients.


              Distribution also broadens the market beyond direct software seats. Acquisition coverage says the
              syndication model reaches pre-accounting customers through bank and vertical SaaS channels, and Tech
              Funding News points to partners such as Shopify, Capital One, and Fiserv. Xero's FAQ adds a practical
              workflow clue: permissions determine who can activate bill pay and who can merely schedule payments for
              approval. So the real buyer map spans direct SMB operators, outsourced finance users, internal approvers,
              and channel partners that want bill pay to deepen engagement before the accounting stack is fully
              standardized.
