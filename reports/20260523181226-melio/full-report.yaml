      - number: '2.2'
        title: TAM, SAM, and SOM sizing
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size Melio's market is to stay in one unit system at a time. Xero supplies the
              top-line revenue-pool TAM at $29 billion for US SMB payments. Public buyer-demand evidence then supports
              narrowing that figure into an accounting-led SAM instead of pretending the whole TAM is equally reachable
              today. Xero says more than 70 percent of US SMBs highly value integrated accounting and AP; acquisition
              coverage cites a similar but slightly higher figure of roughly 78 percent. Using those ratios produces a
              serviceable range of roughly $20.3 billion to $22.6 billion for the accounting-led slice.


              SOM has to stay modest because public monetization proof is still pre-close. Tech Funding News says Melio
              processed more than $30 billion in FY25 payments and ran at a March 2025 annualized revenue rate of $187
              million. That supports a current SOM proxy of only about 0.6 percent of the $29 billion TAM. On the
              buyer-count side, the denominator also narrows sharply: the SBA's 36.2 million small-business universe
              drops to 6.4 million employer firms once nonemployers are stripped out. The market is large, but the
              serviceable slice is meaningfully smaller than the headline suggests.
