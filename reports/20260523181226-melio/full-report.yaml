  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer overview and segmentation
        blocks:
          - type: paragraph
            body: >-
              Melio's public customer story is clearly real, but it is not evenly distributed across segments. The
              strongest current evidence combines official scale claims with a very visible accountant-led motion.
              Melio's 2026 official materials say more than 100,000 business owners and accountants use the platform,
              with more than $100B processed, 40M+ bills paid, 2M+ vendors paid, and average time savings above 15 hours
              per month. Those are meaningful adoption markers for a workflow product that sits between payers,
              approvers, vendors, and accounting systems. At the same time, the public segment map tilts heavily toward
              bookkeepers, accounting firms, and partner-embedded use cases rather than a broad, balanced cross-section
              of self-serve SMB verticals.


              The segmentation pattern matters for diligence. Accountant-managed customers get differentiated economics
              and control surfaces: free Boost plans for firms, 45-day client trials, discounted paid plans, a partner
              tier program, and six permission levels spanning admins, approvers, and view-only collaborators. Embedded
              partner flows add another layer of customer segmentation. Xero's bill-pay experience powered by Melio is
              domestic-USD-only and requires separate setup, while Gusto exposes Melio inside payroll and invoicing
              workflows for eligible companies. The net picture is a three-part base—direct SMBs, accountant-led books,
              and partner-led embedded users—but public materials do not break that base into revenue, volume, or
              retention mix by cohort.
