  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      Publicly documented Melio workflow layers stack user workspaces on top of capture, approvals, payment
      orchestration, connector sync, and trust/intelligence services. The lower-level infrastructure beneath those
      visible layers is not publicly disclosed in the retained sources.
    data:
      layers:
        - label: User and workspace surfaces
          detail: >-
            Direct Melio business UI, accountant multi-client dashboard, payment links, invoice views, and embedded
            partner surfaces such as Xero and Gusto bill pay.
        - label: Workflow applications
          detail: >-
            Accounts payable, accounts receivable, invoice management, contractor/tax workflows, and client-management
            surfaces exposed as user-facing product modules.
        - label: Capture and control services
          detail: >-
            AI bill capture, document inboxes, uploads, scheduling, batch actions, roles, permissions, and approval
            policies that prepare a payment for execution.
        - label: Payment orchestration
          detail: >-
            ACH, card-funded payments, wire, check, virtual-card delivery, same-day and instant options, plus
            international payout handling in supported currencies and corridors.
        - label: Connectors and embedded distribution
          detail: >-
            Two-way accounting sync with QuickBooks and Xero, Amazon Business invoice import, Tax1099 sync, Gmail
            import, and branded partner integrations for financial institutions and SaaS platforms.
        - label: Trust and intelligence services
          detail: >-
            Business verification and compliance checks, encryption, external PCI processing, bug bounty, security
            governance, and Agent Mel on top of workflow data.
    approximationNotes: >-
      This is a report-authored architecture abstraction built from public product and partner pages. It models the
      visible operating layers rather than any vendor-confirmed internal microservice design.
