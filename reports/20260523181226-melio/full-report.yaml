        - US$1.7B - US$2.1B
        - About 9x-11x annualised revenue; respects the 2024 round but discounts the 2025 strategic-control premium.
        - Highest-likelihood path on current evidence.
        - Evidence quality remains moderate and the range is still sensitive to one or two missing metrics.
      - - Bull
        - Cross-sell, syndication, and distribution convert into strong growth while H2 FY28 breakeven remains credible.
        - US$2.3B - US$2.8B
        - About 12x-15x annualised revenue; much of the strategic premium is earned back through execution.
        - Low until Xero or Melio publishes clearer mix, margin, and earnout proof.
        - Requires synergy delivery and much better disclosure than the market has today.
    notes: >-
      Scenarios are deliberately range-based because current public evidence is strong on anchors and weaker on
      standalone operating detail.
    claimRefs:
      - CV009
      - CV011
      - CV013
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Synergy slippage
        - Xero stops reiterating ~US$70M revenue synergies, ~US$20M cost synergies, or H2 FY28 breakeven.
        - Strategic-premium logic weakens and the gap to public comp multiples loses support.
        - Move the valuation view toward bear-case ranges and treat the 2025 price as stale strategic optimism.
      - - Persistent margin drag
        - Melio keeps diluting group margin without offsetting ARPU or growth evidence.
        - Supports the view that Melio behaves more like lower-margin payments volume than premium SaaS.
        - Compress valuation toward BILL and AVDX-style public comp ranges.
      - - Scale stagnation
        - >-
          Customer, payment-volume, or revenue anchors fail to move materially beyond the 80k / >US$30B /
          US$153M-US$187M markers.
        - Weakens the case for paying a premium to public comp levels.
        - Reduce the strategic-premium overlay and stay at research-more.
      - - Leadership or earnout disruption
        - Retention-linked economics or outperformance milestones appear unlikely to be earned.
        - Would signal that the contingent portion was more aspirational than probable.
        - Haircut the bull case and keep the 2025 maximum value out of underwriting.
      - - Opacity persists
        - No clean disclosure on revenue mix, take rate, gross margin by rail, or burn/EBITDA.
        - Maintains the key reason the price is non-transferable to minority investors.
        - Do not use the Xero price as a fresh mark; hold the recommendation at research-more.
    notes: >-
      Triggers are meant to be monitored against future Xero disclosures or diligence materials, not against generic
      venture sentiment.
    claimRefs:
      - CV015
      - CV016
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue mix
        - Subscriptions vs payments vs syndication revenue split by year and by cohort.
        - Determines how much of Melio deserves SaaS-like versus payments-like multiple treatment.
        - Request a post-close revenue bridge from Xero finance or under NDA from Melio leadership.
      - - Gross margin by rail
        - Gross margin for ACH, card-funded payments, international payments, and subscription revenue.
        - The entire comp bridge depends on knowing how much of Melio is structurally lower-margin.
        - Request cohort and product-level gross-margin schedules.
      - - Take rate and yield
        - Payment take rate, float contribution, and any partner rev-share terms.
        - Explains whether volume growth can translate into quality revenue rather than low-value throughput.
        - Request payment-yield history and partner-economic waterfalls.
      - - Standalone EBITDA / burn bridge
        - A clean pre-synergy EBITDA and cash-burn bridge after the Xero close.
        - Needed to decide whether H2 FY28 breakeven is credible or still mostly model-driven.
        - Request monthly management accounts and a post-close operating plan.
      - - Contingent-consideration scorecard
        - Exact performance thresholds and current tracking against the up-to-US$0.5B contingent package.
        - Shows how much of the maximum value is realistically earnable versus theoretical.
        - Request the earnout framework, milestone scorecard, and leadership-retention status.
      - - Channel concentration
        - Partner-level volume, revenue, and dependency by Fiserv, financial institutions, and embedded channels.
        - Strategic fit may be strong even while concentration risk makes the standalone mark fragile.
        - Request partner concentration tables and contract-renewal timelines.
    notes: These asks are the minimum set needed to convert a strategic-control price into a reusable valuation mark.
    claimRefs:
      - CV007
      - CV012
      - CV013
      - CV041
      - CV047
      - CV050
