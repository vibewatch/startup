      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest driver is that workflow demand is real and current, not hypothetical. Xero says integrated
              accounting and AP matters to more than 70 percent of US SMBs, while Visa sees growing demand for
              one-stop-shop financial workflows, embedded finance, and virtual-card-driven B2B payments. Nacha's 2025
              data shows why software providers care: ACH is enormous, same-day ACH is growing quickly, and B2B is the
              network's most significant growth segment. Those facts support a market thesis in which better software
              captures value from existing payment behavior by adding speed, reconciliation, and monetizable rail
              choice.


              But constraints are just as visible. MHC says most AP teams are still hybrid, with only 9 percent fully
              automated and 66 percent still manually handling most invoices. The Federal Reserve still tracks huge
              check values, and Xero still has to support mailed checks, showing that supplier preference remains a
              brake on digital conversion. Buying groups are also more complex than a simple self-serve SaaS story:
              Forrester says procurement is involved early and trials are common. Finally, product completeness and
              execution still matter. Xero's FAQ says full approvals and international bill pay are still planned rather
              than fully live, and adverse commentary says the acquisition price assumes Xero can convert integration
              logic into real cross-sell and retention.
