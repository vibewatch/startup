  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Ownership context and valuation method
        blocks:
          - type: paragraph
            body: >-
              Melio now has two hard private valuation anchors, and that changes how the chapter should be written. The
              2024 Series E set a US$2.0 billion mark after a US$150 million raise, while Xero's 2025 transaction set a
              US$2.5 billion upfront price with up to US$0.5 billion more contingent on outperformance and retention.
              Those two numbers are real, but they are not interchangeable. The 2024 mark was a venture round in a reset
              fintech market, whereas the 2025 mark was a strategic-control acquisition with explicit synergy
              assumptions, distribution value, and employment-linked contingent consideration. A disciplined 2026 method
              therefore cannot simply average stale private marks or force Melio into a pure-SaaS public comp set. It
              has to triangulate three lenses at once: the 2024 venture round, the 2025 strategic-control transaction,
              and the 2026 public-market valuation band for hybrid software-plus-payments businesses. That approach
              matters because Xero itself discloses that Melio lowers group gross margin and only reaches run-rate
              adjusted EBITDA breakeven in H2 FY28. In other words, the strategic price embeds value that current public
              evidence does not yet prove a minority investor can reuse.
