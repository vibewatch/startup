    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Melio is a US-focused B2B payments platform founded in 2018 by Matan Bar, Ilan Atias, and Ziv Paz. Its
              current official materials place the company across New York, Denver, and Tel Aviv, while describing a
              mission to simplify business payments for SMBs, accountants, and their vendors. The product scope is no
              longer just bill pay: Melio markets a full accounts payable and receivable stack spanning invoice
              creation, payment links, approvals, card-or-bank funding, international payments, and AI-assisted workflow
              automation.


              The current operating profile should be read as a mix of official product claims and hard ownership facts.
              Melio says more than 100,000 business owners use the platform, 40M+ bills have been paid on time, $100B+
              has been processed, and 2M+ vendors have been paid. Those metrics are company-reported rather than
              audited, but they establish meaningful scale. Just as important, the standalone Melio service remains live
              after the Xero deal, even as Xero has already embedded bill payments powered by Melio into its own US
              platform.
