        - id: repeat-use
          label: Repeat use and collaboration
          detail: >-
            The workflow becomes sticky when clients, approvers, vendors, and staff repeat the cycle across many bills,
            entities, or customer books.
          tone: positive
        - id: expand-anchor
          label: Expansion and retention anchor
          detail: >-
            Customers deepen usage through more clients, more payment volume, AR, international payments, or embedded
