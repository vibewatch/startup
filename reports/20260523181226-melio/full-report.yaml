      - number: '4.2'
        title: Unit economics and benchmarked margin proxies
        blocks:
          - type: paragraph
            body: >-
              Melio's standalone unit economics remain only partially visible in public evidence, so the right approach
              is to separate disclosed figures, computed proxies, and benchmark ranges. Public deal coverage gives
              enough to estimate rough monetization efficiency: $153 million to $187 million of revenue on $30 billion
              of payment volume implies a yield band of about 0.51% to 0.62%, while the same revenue range over 80,000
              disclosed customers implies about $1.9 thousand to $2.3 thousand of annual revenue per disclosed customer.
              Those are useful directional anchors, but they are not substitutes for CAC, payback, gross margin, NRR, or
              cohort data.


              Customer proof suggests that Melio creates real workflow value even when hard financial unit metrics are
              absent. QBench cited up to 16 hours of weekly savings, and CPA Business Advisors estimated about $40,000
              of annual savings versus alternative bill-pay tools. For margin framing, BILL and AvidXchange are the most
              useful public comps in the retained set: BILL ran above 80% GAAP gross margin in FY2025, while AvidXchange
              reported 73.6% non-GAAP gross margin and 19.3% adjusted EBITDA margin for FY2024. Xero's own FY26 investor
              presentation is the key warning flag here because it explicitly says Melio's payments mix lowers
              gross-margin profile versus pure subscription revenue. The implication is not that Melio is weak; it is
              that underwriting should expect a payments-hybrid margin profile, not a classic high-80s pure software
              profile, until management discloses better evidence.
