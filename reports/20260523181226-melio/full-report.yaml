      - number: '4.3'
        title: Capital structure and adequacy after the Xero transaction
        blocks:
          - type: paragraph
            body: >-
              Because Melio is now inside Xero, the central financial question is no longer whether Melio can raise
              another standalone round on 2021-style venture terms. It is whether the parent-funded structure leaves
              enough balance-sheet capacity and strategic patience for Melio to scale inside Xero while still absorbing
              integration costs. The retained filings are unusually useful on this point. Xero disclosed $2.5 billion of
              upfront consideration plus up to $0.5 billion of contingent, deferred, and rollover consideration. The
              completion filing also shows how the upfront amount was funded: about US$1.8 billion of cash, a US$0.4
              billion debt facility, and about US$0.36 billion of newly issued shares, with the cash slice itself coming
              from a large institutional placement, a share purchase plan, and US$0.5 billion of balance-sheet cash.


              That funding mix means Melio no longer screens as venture-runway constrained in the usual private-company
              sense, but it does introduce a different discipline. Xero must now justify acquisition leverage, equity
              dilution, and near-term earnings drag while the business is integrated. The company's own FY26 materials
              guide to run-rate adjusted EBITDA breakeven for Melio in H2 FY28 and to explicit synergy targets, which is
              constructive. But public sources still do not disclose a standalone Melio cash balance, burn profile, or
              debt obligations post-close, so diligence cannot yet underwrite capital adequacy from Melio-only
              statements. It has to underwrite it through Xero's willingness and capacity to keep funding the asset.
