      - number: '8.2'
        title: Comparable analysis and mark discipline
        blocks:
          - type: paragraph
            body: >-
              The public comp bridge makes the mark discipline obvious. BILL is the cleanest listed hybrid
              software-plus-payments analogue in the retained set and trades around 2.1x EV-revenue with an 80%+
              gross-margin profile. AvidXchange, which is closer to AP workflow and buyer-supplier automation, trades
              around 3.9x EV-sales with gross margin in the low-70s. Xero itself trades around 5.0x EV-revenue and
              near-84% gross margin because its core software business remains structurally richer than payments.
              Against that public band, Melio's observed marks sit much higher: roughly 10.7x if one compares the 2024
              US$2.0 billion round to March 2025 annualised revenue, and 13.4x on Xero's upfront strategic price. That
              does not automatically make the deal wrong. It does mean the 2025 Xero mark should be read as a
              control-and-synergy transaction, not as a reusable minority pricing template. The right conclusion is that
              Melio deserves some premium to the public comp band because of its scale, partner distribution, and
              strategic fit, but not blind acceptance of the full strategic multiple while standalone margin, take-rate,
              and revenue-mix disclosure remain thin.
