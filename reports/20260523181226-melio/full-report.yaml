      - number: '3.4'
        title: Competitive risks
        blocks:
          - type: paragraph
            body: >-
              The biggest competitive risk is not that one vendor cleanly outfeatures Melio on every dimension. It is
              that multiple rivals each own one decision trigger that can intercept the buyer before Melio becomes
              necessary. QuickBooks can keep bill pay inside the ledger. Ramp can make AP part of a wider CFO automation
              bundle. BILL can sell network scale, broader controls, and embedded distribution. Tipalti, AvidXchange,
              and Stampli can move the conversation to global complexity, middle-market process depth, or procure-to-pay
              collaboration. When those motions work, Melio's affordability alone may not be enough to hold the deal.


              The second risk is pricing compression. Independent 2026 pricing analysis shows that Melio and Ramp often
              remain among the lowest-cost choices at modest invoice volumes, but that advantage is fragile when
              QuickBooks bundles bill pay or when broader platforms waive transaction frictions to pull buyers into a
              suite. The third risk is evidence opacity. Public sources do not disclose Melio's current win rate,
              attach, churn, or realized pricing against these named peers, so the strongest moat claims still depend on
              management-only data. Current public evidence supports a credible niche and a still-useful product, but it
              does not yet prove that Melio can dominate as incumbents and bundled finance stacks intensify competition.
