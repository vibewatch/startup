      - number: '6.3'
        title: Retention, repeat usage, and satisfaction
        blocks:
          - type: paragraph
            body: >-
              Public retention disclosure is the weakest part of Melio's customer dossier. The retained set does not
              expose NRR, GRR, logo churn, contract length, renewal rates, or an official NPS/CSAT benchmark. That
              forces the chapter to rely on repeat-usage proxies instead of true retention economics. The proxies are
              not empty. Xero's FAQ shows scheduled-payment and approver-routing workflows that assume repeated use once
              a customer is set up. TrustRadius reviews describe ongoing multi-entity or multi-LLC usage, a reduction
              from roughly 300-400 checks per year to fewer than 10 for one user, and $100-$200 per month of savings
              from ACH-led workflows. QBench's 40-50 monthly bills and accountant case studies with recurring client
              books point in the same direction: Melio can become a routine operating layer when the workflow fits.


              The caution flag is channel-specific satisfaction. Xero's App Store listing shows a low 1.79/5 rating from
              14 reviews, and verified reviewers complain about missing sync, weekly disconnects, unresolved technical
              tickets, and combined-payment issues. SelectHub's broader aggregation is more favorable, but that is still
              an outside review summary rather than first-party retention data. The result is a split conclusion: direct
              and accountant-managed use cases show credible repeat-use depth, but embedded-channel sentiment—especially
              Xero—remains visibly mixed. Investors should therefore treat current public proof as evidence of workflow
              stickiness, not as evidence of attractive cohort economics.
