  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Evidence
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Integrated accounting + AP demand
        - Driver
        - Xero says >70% of US SMBs value tight accounting and AP integration; acquisition coverage cites ~78%.
        - Now
        - Supports software-led SAM instead of treating payments as a pure rail feature.
        - Test whether this demand is strongest among employer SMBs, accountants, or channel-led cohorts.
      - - ACH and same-day ACH growth
        - Driver
        - Nacha reports strong 2025 network growth, same-day ACH growth, and B2B as the top growth segment.
        - Now to near-term
        - Faster digital rails make on-platform bill pay more useful and reduce settlement friction.
        - Ask management what mix of Melio payments has shifted from checks to ACH and same-day ACH.
      - - Embedded finance and virtual cards
        - Driver
        - Visa expects US B2B embedded finance to surpass $2.6T by 2026 and virtual cards to keep scaling.
        - Near-term
        - Favors platforms that combine software workflow with payment monetization and working-capital features.
        - Request cohort economics for card-funded bill pay versus ACH-funded bill pay.
      - - Accountant and advisor workflow value
        - Driver
        - Xero repeatedly markets the integrated workflow to SMBs and their advisors.
        - Now
        - Accountants can be multipliers because one integration decision can influence many clients.
        - Quantify client-per-firm adoption and churn inside accountant-led cohorts.
      - - Manual and hybrid AP persistence
        - Constraint
        - MHC says only 9% of AP departments are fully automated and 66% still handle most supplier invoices manually.
        - Now
        - The market is large partly because paper and hybrid processes remain stubbornly common.
        - Measure onboarding friction, document-collection effort, and supplier enablement time.
      - - Check persistence and supplier preference heterogeneity
        - Constraint
        - Xero still supports mailed checks and the Fed still reports huge check values.
        - Now
        - Digital UX alone does not eliminate legacy supplier acceptance requirements.
        - Break down supplier payment mix by ACH, check, card, and wire.
      - - Buying-group complexity and procurement friction
        - Constraint
        - Forrester says buying groups are large, procurement engages early, and trials are common.
        - Now
        - Mid-market and channel sales may take longer than pure SMB self-serve motions suggest.
        - Inspect sales-cycle length by segment and partner route.
      - - Execution and integration risk
        - Constraint
        - >-
          Product gaps remain for approvals and international bill pay, and adverse commentary says Xero paid for a
          successful integration case.
        - 2026 refresh window
        - >-
          Near-term growth depends on converting current workflow demand into post-close adoption, not just owning
          Melio.
        - >-
          Demand post-close attach, retention, and feature-completion metrics before underwriting aggressive SOM
          expansion.
    notes: >-
      Direction reflects current market influence rather than a permanent truth. Several rows matter simultaneously: the
      same rail modernization that expands TAM can also expose workflow, supplier, and integration bottlenecks.
