  - - Ramp
    - Adjacent but increasingly direct substitute
    - 50,000+ businesses and disclosed $32B valuation in 2025
    - SMBs through enterprise finance teams already consolidating spend tools
    - Free entry tier, AP plus cards/procurement/treasury, strong AI marketing
    - Broader platform story can be more than simple SMB bill pay buyers need
  - - Stampli
    - Adjacent direct AP / P2P workflow vendor
    - Latest disclosed financing is 2023 $61M Series D
    - AP teams needing broader procure-to-pay collaboration
    - Stronger procure-to-pay orientation than pure bill pay
    - Less public self-serve pricing clarity and weaker SMB simplicity signal
  - - QuickBooks Bill Pay
    - Incumbent ledger-native substitute
    - Basic plan included inside QuickBooks subscription; Premium $15/mo; Elite $90/mo
    - QuickBooks Online users wanting AP inside the books
    - Native ledger workflow, free standard ACH, built-in vendor and 1099 handling
    - Best fit is strongest inside the QuickBooks ecosystem rather than across systems
  - - Chase Business Pay & Transfer
    - Status-quo banking substitute
    - Embedded in existing business-banking relationship rather than standalone AP software
    - Low-complexity businesses already using Chase for payments
    - No new software buying step for basic payment execution
    - Does not replicate modern AP automation, approvals, or accounting-led workflow depth
