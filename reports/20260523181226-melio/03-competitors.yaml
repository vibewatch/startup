- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Low-friction SMB onboarding and accountant usability
    - QuickBooks bundles bill pay in-ledger and Ramp subsidizes AP inside a broader suite
    - High
    - Melio remains cheap and easy, but QuickBooks and Ramp both lower the need for a separate AP decision
    - Measure win rates for QuickBooks-first and Ramp-card-led buyers by channel and cohort
  - - QuickBooks/Xero-centered workflow stickiness
    - Incumbent accounting vendors can absorb the bill-pay layer
    - High
    - Intuit already replaced the older Melio-powered flow with native QuickBooks Bill Pay
    - Quantify how much Melio demand comes from non-QBO accounts and from accountants managing multiple ledgers
  - - Payment-rail flexibility (ACH, check, card, international)
    - Feature parity and free-entry pricing from larger bundles
    - Medium
    - Multiple rivals now advertise comparable payment execution, while Melio still competes well on affordability
    - Test whether rail choice still drives NPS or whether buyers now rank bundle breadth higher
  - - Trust and compliance posture
    - Security parity across peers reduces differentiation
    - Medium
    - Melio, BILL, AvidXchange, and Ramp all maintain dedicated security pages and controls claims
    - Request certification-level security matrices and buyer security questionnaires to see whether parity is real
  - - Focused simplicity versus enterprise complexity
    - Broader suites can cross-sell from cards, procurement, or supplier networks
    - High
    - BILL, Ramp, Tipalti, AvidXchange, and Stampli all have stronger breadth stories for some buyer classes
    - Ask management for segment-level retention and attach by buyer complexity to confirm where simplicity really wins
  - - Affordable standard packaging
    - Commoditization pressure from free or bundled plans plus hidden implementation economics
    - High
    - Independent 2026 pricing analysis shows large year-one dispersion even when public entry prices look close
    - Collect recent customer quotes and implementation SOWs to compare realized TCO, not just list price
  notes: Severity reflects current competitive impact on Melio's lane, not an absolute company risk rating.
