  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cross-vendor-security-matrix
    missingEvidence: A certification-by-certification and control-by-control matrix across Melio, BILL, Ramp, AvidXchange, Tipalti, and Stampli using current SOC, PCI, tax, and fraud-control documents.
    whyItMatters: Public security pages show broad parity, but they do not make it possible to compare exact audit scope or control depth, which limits trust-posture conclusions.
    diligencePath: Request current security questionnaires, SOC reports, PCI attestations, and buyer security response packs from each vendor.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Current cohort-level win/loss, attach, churn, and renewal data for Melio versus BILL, QuickBooks Bill Pay, Ramp, Tipalti, AvidXchange, and Stampli.
    whyItMatters: Moat durability ultimately depends on realized commercial performance, not just public packaging, and that evidence is not available in retained public sources.
    diligencePath: Ask management for segment-level competitive dashboards, recent win/loss reviews, accountant-channel attach, and churn by product cohort.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-implementation
    missingEvidence: Signed quotes, discount schedules, implementation statements of work, and actual payment-fee schedules across the vendor set.
    whyItMatters: Editorial comparisons show directionally large TCO differences, but realized procurement outcomes can diverge sharply from public entry pricing and materially change platform choice.
    diligencePath: Collect recent customer quotes or procurement memos for Melio, BILL, Ramp, Tipalti, AvidXchange, QuickBooks Bill Pay, and Stampli at comparable invoice volumes.
    relatedQuestionRefs:
    - QP028
