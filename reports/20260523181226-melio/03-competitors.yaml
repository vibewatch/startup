    - SMBs, accountants, QuickBooks/Xero-led finance teams
    - Low-friction onboarding, pay-by-card, ACH/check/international mix, strong accounting sync
    - Public evidence is lighter on multi-entity depth and enterprise workflow breadth
  - - BILL
    - Direct peer, increasingly broader finance platform
    - Approx. 500,000 SMBs, 9,000 accounting firms, 8 million network members in FY25
    - SMBs to midsize companies plus accounting firms and embedded partners
    - Broader AP/AR/procurement controls, partner embeds, large network scale
