  - - Tipalti
    - Direct / adjacent upmarket AP and payouts suite
    - $200M financing in 2025; >$200M ARR; 5,000+ global companies; $75B annualized payment volume
    - Mid-market, global, multi-entity, payout-heavy finance teams
