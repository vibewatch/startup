- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Current entry pricing / model
  - Included capabilities at entry
  - Incremental / unknowns
  - Implication
  rows:
  - - Melio
    - $0 Go; Core $25/mo; Boost $55/mo; Unlimited $80/mo
    - ACH, card/check/wire options, AI bill capture, international pay, AR invoicing; richer sync and approvals on paid tiers
    - Card fees 2.9%; ACH allowances by tier; Platinum custom for high-volume buyers
    - Very strong for self-serve SMB adoption and accountant-led onboarding
  - - BILL
    - $49/user/mo Essentials; $65 Team; $89 Corporate; Enterprise custom
    - AP/AR automation, approval workflows, invoicing, centralized inbox, network payments
    - Transaction fees still apply; deeper ERP/procurement/security features expand with tier
    - Priced for teams that need more controls and are willing to standardize on the suite
  - - Tipalti
    - $99/mo Select; $199/mo Advanced; Elevate custom
    - Supplier onboarding, tax/compliance screening, AI invoice processing, ERP integrations
    - Per-volume, entity, and module charges still apply; higher tiers are custom
    - Entry price is public, but the product is optimized for more complex finance operations than Melio
  - - Ramp
    - $0/mo/user Free; Plus $15/user/mo + platform fee; Enterprise custom
    - AP OCR, approval workflows, fraud checks, card/check/ACH/wire payments, broader finance bundle
    - Advanced procurement, integrations, and enterprise services gated by higher tiers
    - Strong bundle pressure when buyers already want cards, procurement, or treasury
  - - QuickBooks Bill Pay
    - $0 Basic in subscription; Premium $15/mo; Elite $90/mo
    - Native bill pay, free standard ACH, vendor setup, approvals, 1099s, reconciliation
    - Instant payment, checks, and faster ACH carry extra fees; value is tied to QBO footprint
    - Powerful incumbent substitute for QBO-centered SMBs
  - - AvidXchange
    - Quote-led / get-price motion
    - End-to-end AP workflow, supplier portal, payment automation, configurable approvals
    - Realized pricing and implementation terms are not public on official pages
    - Less likely to win on impulse-buy pricing and more likely to win on middle-market process depth
  - - Stampli
    - Custom / volume-based pricing in editorial estimates; no simple self-serve public entry point
    - Procure-to-pay collaboration and AP automation
    - Implementation and negotiated deal terms vary materially by buyer
    - Competitive when workflow depth matters more than lowest monthly sticker price
  notes: List pricing and editorially modeled price ranges are separated from realized enterprise quotes; the table is for packaging comparison, not realized net revenue analysis.
