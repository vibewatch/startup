chapter:
  number: 4
  title: Financials
  summary: Melio's public financial picture shows a hybrid subscription-plus-payments revenue model with clear pricing surfaces, meaningful recent scale, and strong parent-backed capital support after the Xero deal. But the company still withholds the standalone metrics that matter most for underwriting—gross margin by rail, CAC and payback, retention, cash burn, runway, and detailed revenue mix—so the chapter treats revenue quality and margin path as partly estimated rather than fully disclosed.
sections:
- id: revenue-model-pricing
  title: Revenue model and pricing architecture
  body: 'Melio''s public revenue model is best understood as a hybrid of subscription software, payment transaction fees, and distribution economics rather than as a pure SaaS seat business. The current pricing page sells four self-serve SMB tiers plus a custom Platinum tier, while still monetizing the most valuable payment actions separately. ACH usage is partly bundled but not unlimited below the top tier, card-funded payments carry a 2.9% fee, faster disbursement options layer on additional charges, and cross-border payments carry their own fee schedule. That means public list pricing only sets the floor for revenue; realized monetization still depends on payment method mix, urgency, geography, and monthly payment volume.


    The harder underwriting point is that public sources stop short of a clean revenue-mix disclosure. Melio discloses that the October 2024 round followed a tenfold revenue increase since 2021, while third-party acquisition coverage later described roughly $153 million of revenue, $187 million of annualized revenue, 80,000 customers, and $30 billion of payment volume. Those disclosures support a credible scale picture and let diligence estimate yield on volume, but they do not split subscription, transaction, partner, and international revenue contributions. That is why the chapter keeps unsupported mix cells as estimated or null rather than treating list pricing as realized net revenue.'
