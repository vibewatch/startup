- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why the gap matters
  - Best public proxy today
  - Exact diligence path
  - Severity
  rows:
  - - Standalone gross margin by rail
    - Needed to judge whether the business is a software-led or payments-led margin profile
    - Xero says Melio lowers group gross margin versus subscription revenue; BILL and AvidXchange provide public comp bands
    - Request monthly gross profit bridge by subscription, ACH, card, speed fees, partner revenue, and international payments
    - Material
  - - CAC and payback by channel
    - Required to underwrite incremental growth efficiency and partner economics
    - Customer proof shows value, but not acquisition cost
    - Request sales / marketing spend, signed-partner economics, pipeline conversion, and payback by direct versus embedded channel
    - Material
  - - NRR and churn
    - Needed to assess whether the product compounds after land or faces price-sensitive churn
    - No retained public proxy beyond customer anecdotes
    - Request cohort retention, NRR, gross retention, and active-customer decay curves
    - Material
  - - Cash, burn, and runway
    - Core adequacy metric if Melio is still expected to absorb investment before FY28 breakeven
    - Parent-level Xero cash, debt, and FCF are public; Melio-only liquidity is not
    - Request standalone cash waterfall, burn bridge, and treasury support policy from Xero
    - Blocking
  - - Revenue mix by stream and channel
    - Needed to know how much revenue is recurring versus payments-volume sensitive
    - Current sources show monetization surfaces, not realized mix
    - Request revenue split by subscriptions, transaction fees, partner channels, and international payments
    - Material
  - - Contingent consideration KPI schedule
    - Needed to know which operating metrics still drive payout pressure
    - Only high-level contingent structure is public
    - Request the KPI tree, measurement periods, and retention conditions
    - Material
  - - Standalone P&L and debt obligations post-close
    - Needed to separate strategic value from pure subsidiary economics
    - Xero group metrics and filings provide parent context only
    - Request current legal-entity structure, intercompany debt, guarantees, and Melio-only monthly P&L
    - Blocking
  notes: Every row is a live diligence blocker or material unknown rather than a generic wish list; null public values are intentional.
