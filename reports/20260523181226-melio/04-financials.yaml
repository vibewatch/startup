- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public evidence
  - Current status
  - Quality
  - Diligence ask
  rows:
  - - Subscriptions
    - Monthly software plans from Go through Unlimited plus custom Platinum
    - Go/Core/Boost/Unlimited pricing with custom Platinum
    - Disclosed list pricing
    - List prices only; realized discounts unknown
    - Request MRR and customer mix by plan.
  - - ACH overages
    - $0.50 per ACH payment after included monthly allowance
    - Melio pricing page
    - Disclosed
    - Clear fee schedule but no realized mix
    - Request share of customers exceeding included ACH limits.
  - - Card-funded AP
    - 2.9% fee on domestic card-funded vendor payments
    - Melio pricing page and Xero fee page
    - Disclosed
    - High-value transaction fee but no attach rate disclosed
    - Request card-funded payment mix by segment and average ticket size.
  - - Speed and check fees
    - Checks, instant bank transfer, same-day ACH, same-day wire, and related expedited fees
    - Melio pricing page and Xero bill-pay fee page
    - Disclosed
    - Mechanics visible; realized usage mix unknown
    - Request volume and margin by speed option.
  - - Cross-border payments
    - USD flat-fee transfers plus FX-priced local-currency or card-funded global payments
    - Melio pricing page
    - Disclosed
    - Public fee schedule exists, but country and currency mix do not
    - Request international GMV, corridor mix, and FX revenue.
  - - Partner and embedded revenue
    - Partner page shows embedded B2B payments distribution beyond direct app subscriptions
    - Melio partner page and Xero launch materials
    - Disclosed qualitatively
    - Channel existence is clear; economics are not
    - Request partner revenue split, rev-share terms, and concentration.
  notes: Mixes official list pricing with qualitative channel evidence; public sources show monetization surfaces but not realized revenue mix.
