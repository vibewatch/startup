- id: outlook-and-gaps
  title: Financial outlook and public diligence gaps
  body: 'The disclosed forward picture is better on direction than on precision. Xero''s FY26 presentation shows strong group growth, clear US acceleration, explicit synergy targets, and a stated H2 FY28 run-rate EBITDA breakeven goal for Melio. That supports a reasonable bullish case: Melio gives Xero a payments layer with multiple revenue drivers, improves ARPC, and materially lifts US segment momentum. But the same source set also supports a more cautious interpretation. Xero itself says Melio''s payments mix carries lower gross margin than subscription revenue, and adverse coverage around the 2024 down round plus the FY26 earnings drag shows that the asset came with valuation-reset and integration-risk baggage, not just upside.


    The biggest remaining blocker is disclosure depth. Public sources provide enough evidence to estimate revenue yield and benchmark margin bands, but they do not provide the private-company inputs that a strict underwriting model would need: standalone gross margin by rail, CAC and payback by channel, NRR or churn, burn and runway, and post-close revenue mix by subscriptions versus transaction and partner channels. Those unknowns matter because Melio could still be a very good strategic asset for Xero while offering only fair standalone financial quality at the current evidence level. The chapter therefore treats the outlook as promising but only partly underwritten, and it keeps the most important missing metrics explicit in the gaps table instead of filling them with unsupported assumptions.'
