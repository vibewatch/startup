- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - What is disclosed
  - What is still unknown
  - Underwriting implication
  rows:
  - - 2024 strategic round
    - $150M at $2B valuation
    - Round size and valuation were public
    - Exact use of proceeds and residual cash at close are not public
    - Shows fresh pre-sale capital, but not standalone liquidity today.
  - - Upfront consideration
    - $2.5B
    - Officially disclosed by Melio and Xero
    - Purchase price allocation and earn-out accounting detail require filings or management detail
    - Confirms strategic significance of the asset.
  - - Contingent consideration
    - Up to $0.5B over three years
    - Performance / retention-linked contingent, deferred, and rollover structure disclosed
    - Specific KPI triggers and rollover mechanics are not public
    - Adds forward dependency on execution milestones.
  - - Cash funding
    - ~US$1.8B cash total, including A$1.85B placement, A$129.5M SPP, and US$0.5B balance-sheet cash
    - Xero completion filing provides the stack
    - Standalone Melio cash at close is not disclosed
    - Parent funding materially de-risks near-term liquidity.
  - - Debt funding
    - US$0.4B debt facility drawn
    - Tenor and opening margin are disclosed in filing
    - Covenants and future refinancing terms are not public here
    - Melio is funded inside a leveraged parent structure, not a net-cash startup shell.
  - - Equity funding
    - ~US$0.36B of newly issued Xero shares
    - Issued to existing Melio shareholders
    - Exact economic alignment by holder is not public
    - Dilution and rollover alignment matter for incentive design.
  - - Profitability outlook
    - Run-rate adj. EBITDA breakeven targeted for H2 FY28
    - Xero provided explicit timing guidance
    - Bridge from current margin to that target is not public
    - Suggests patient capital, but not immediate standalone profitability.
  - - Standalone liquidity disclosure
    - 'null'
    - No retained public source shows Melio-only cash, burn, or runway
    - Board-approved budget and capital allocation remain private
    - Cannot underwrite capital adequacy from Melio-only numbers.
  - - Melio-specific debt or warehouse obligations
    - 'null'
    - No retained public source discloses them
    - Need debt schedule, guarantees, and contingent obligations
    - Potential hidden capital intensity remains a diligence blocker.
  notes: Company Overview owns round chronology; this table focuses on what the parent-funded structure means for forward adequacy and what remains undisclosed.
