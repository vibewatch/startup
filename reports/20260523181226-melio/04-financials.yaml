  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Standalone Melio gross margin and contribution margin by subscription, ACH, card, speed fee, partner, and international payment stream.
    whyItMatters: Without a direct margin bridge, underwriting cannot tell whether current revenue quality looks closer to software economics or to lower-margin payment processing economics.
    diligencePath: Request a 24-month monthly gross-profit bridge by revenue stream plus transaction-cost detail by rail and channel.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales and marketing spend, channel mix, and payback by direct, accountant, and embedded-partner channel.
    whyItMatters: Melio can look strategically valuable while still generating weak incremental economics if partner or sales-led growth is too expensive.
    diligencePath: Request cohort-level CAC and payback by acquisition channel, plus channel rev-share or incentive schedules.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Logo churn, gross retention, NRR, and cohort retention curves for direct and embedded customers.
    whyItMatters: Retention quality determines whether public revenue growth represents durable recurring monetization or only high gross adds.
    diligencePath: Request monthly retention cohorts with customer counts, revenue retention, and contraction / expansion by segment.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Standalone cash balance, burn rate, runway, and parent-funding policy for Melio post-close.
    whyItMatters: Capital adequacy cannot be underwritten from parent-level Xero statements alone if Melio still requires material investment before FY28 breakeven.
    diligencePath: Request a standalone treasury pack with monthly cash bridge, budgeted burn, approved operating plan, and intercompany funding commitments.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: obligations
    missingEvidence: Melio-specific debt schedule, warehouse or project-finance facilities, guarantees, indemnities, and contingent-consideration KPI schedule.
    whyItMatters: Hidden obligations could make the asset materially more capital intensive than public deal coverage suggests.
    diligencePath: Request legal-entity debt schedules, guarantee summaries, contingent consideration KPI definitions, and any warehouse or credit facilities.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
