figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Melio's customer journey begins in one of three entry channels—direct SMB, accountant-led rollout, or partner embed—then moves through verification, first payment, recurring approvals, and expansion into deeper finance workflows.
  data:
    nodes:
    - id: entry-direct
      label: Direct SMB discovery
      detail: Owner or controller finds Melio for vendor payments, payment links, or cash-flow timing without starting from a partner platform.
      tone: neutral
    - id: entry-accountant
      label: Accountant-led rollout
      detail: Accounting firm invites a client into a managed workflow with permissions, approvals, and discounted plan structure already defined.
      tone: positive
    - id: entry-partner
      label: Partner-embedded entry
      detail: Customer encounters Melio inside Xero or Gusto rather than through standalone acquisition, so setup, billing, and support are partly channel-shaped.
      tone: warning
    - id: verify-connect
      label: Verification and connection
      detail: Customer verifies business details, connects bank or accounting software, and configures roles before first live usage.
      tone: neutral
    - id: first-live
      label: First live bill or invoice
      detail: Initial value arrives when a user imports a bill, schedules payment, sends an invoice, or routes an approval without manual double entry.
      tone: positive
    - id: repeat-use
      label: Repeat use and collaboration
      detail: The workflow becomes sticky when clients, approvers, vendors, and staff repeat the cycle across many bills, entities, or customer books.
      tone: positive
    - id: expand-anchor
      label: Expansion and retention anchor
      detail: Customers deepen usage through more clients, more payment volume, AR, international payments, or embedded partner workflows, but partner-specific friction can still weaken retention.
      tone: risk
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU011
