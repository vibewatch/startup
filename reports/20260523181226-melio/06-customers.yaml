  body: Public sources support repeat usage, but they do not provide the metrics investors would normally use to underwrite customer durability. NRR, GRR, churn, NPS, contract length, and top-customer concentration all remain open diligence items.
  claimRefs:
  - CU065
  - CU066
  - CU067
- calloutType: risk
  title: Embedded channels create both reach and customer-experience dependence
  body: Xero and Gusto clearly expand Melio's customer surface, but partner setup, billing, permissions, and support materially shape the user experience. The Xero review record shows how partner-surface friction can become visible adverse customer proof.
  claimRefs:
  - CU016
  - CU018
  - CU050
  - CU051
  - CU052
  - CU058
  - CU068
  - CU069
