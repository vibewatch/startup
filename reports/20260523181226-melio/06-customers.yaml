- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: Deployment paths converge from direct, accountant-led, and partner-embedded entry points into verification, first payment, recurring usage, and either expansion or channel-specific friction.
  data:
    nodes:
    - id: direct-signup
      label: Direct signup
      detail: Standalone business discovers Melio and starts its own setup.
    - id: accountant-invite
      label: Accountant invite
      detail: Firm creates or manages a client workspace with predefined controls.
    - id: xero-entry
      label: Xero bill-pay entry
      detail: Customer starts from Xero and accepts separate Xero + Melio terms.
    - id: gusto-entry
      label: Gusto Bill Pay entry
      detail: Eligible Gusto customer turns on Bill Pay and may need Money Plus for some features.
    - id: verification
      label: Verification and sync
      detail: Business details, funding sources, and accounting connections are configured.
    - id: first-transaction
      label: First transaction
      detail: User uploads, imports, or schedules the first bill or invoice.
    - id: recurring-cycle
      label: Recurring cycle
      detail: Approvals, vendor payments, invoice collection, and sync repeat on a regular cadence.
    - id: expand-or-friction
      label: Expansion or friction
      detail: Customer adds more clients, rails, or workflows—or runs into partner-specific migration, billing, or sync constraints.
    edges:
    - from: direct-signup
      to: verification
      label: Self-serve setup
    - from: accountant-invite
      to: verification
      label: Managed onboarding
    - from: xero-entry
      to: verification
      label: Embedded setup + re-verification
    - from: gusto-entry
      to: verification
      label: Eligibility + plan gating
    - from: verification
      to: first-transaction
      label: Connect and import
    - from: first-transaction
      to: recurring-cycle
      label: Prove workflow value
    - from: recurring-cycle
      to: expand-or-friction
      label: Usage deepens or breaks
