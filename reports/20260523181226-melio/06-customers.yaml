- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Accountant partner program and multi-client dashboard
    - Public proof skews strongly toward accountant-led deployments
    - Segment concentration may hide weaker direct-SMB or enterprise durability
    - Request customer counts, revenue, and churn by accountant-managed vs direct cohorts
  - - Xero embedded bill pay
    - USD-only scope plus no transfer of historical standalone data
    - Limits portability and can depress expansion for customers already on standalone Melio
    - Request Xero attach, activation, churn, and migration-friction metrics
  - - Gusto embedded bill pay
    - Eligibility and Gusto Money Plus gating may narrow realized adoption
    - Large top-of-funnel does not automatically convert into paying, retained Melio users
    - Request attach, paid conversion, partner economics, and feature-usage data
  - - QuickBooks partner route after 2024 shutdown
    - Partner embeds can be replaced even if Melio standalone remains live
    - Shows distribution reliance can create abrupt migration and revenue risk
    - Request post-shutdown retention, reactivation, and revenue-impact analysis
  - - Named non-accounting proof
    - QBench is the clearest retained non-accounting case study
    - Cross-vertical resilience is harder to judge than accountant-channel fit
    - Request more named live customers outside accounting firms and partner embeds
  - - Top-customer and channel mix disclosure
    - No public concentration metrics are available
    - Investors cannot size exposure to any single customer, partner, or route-to-market motion
    - Request top-10 customer share, top-5 partner share, and direct-vs-partner payment-volume split
  notes: The table separates visible expansion mechanisms from concentration unknowns because Melio's public customer materials show motion but not enough mix data to size exposure precisely.
