- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption trajectory
  body: |-
    Melio passes the basic named-customer-proof test because there are multiple live case studies with concrete outcomes, and the proof set is fresher and more detailed than a logo wall. The dominant pattern is accountant-led deployment. AccounTAXstic, Accounting Solutions, Walker Agency, Latitude, Cubepros, and CPA Business Advisors all describe production use, not pilots, and each ties Melio to repeated AP or AR workflows rather than one-off payments. The reported outcomes are strong: 40% to 90% reductions in payment-handling time, onboarding and audit-effort savings, dozens of hours saved per month, and one case claiming roughly $40,000 per year of savings. Those are still company-published customer stories, so they should be treated as directional proof, not audited unit economics.

    The most important non-accounting counterexample is QBench. Its case study shows Melio in a software-company operating context, not just in a bookkeeping practice. QBench says it uses Melio for almost all payments, including international payments, fast payments, and customer refunds, with monthly bill volume rising to 40-50 payments and up to 16 hours per week saved. That matters because it proves Melio can support recurring operational cadence beyond outsourced accountants. Even so, the public named set remains narrow relative to Melio's claimed scale. The growth/adoption evidence is therefore credible at the platform level, but still concentrated in accountant stories plus a small number of other named operators and partner surfaces like Xero and Gusto.
