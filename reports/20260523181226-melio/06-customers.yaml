tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Revenue or strategic value signal
  - Gap
  rows:
  - - Direct SMB operators
    - Owner or controller / AP admin / business payer
    - Pay vendors, manage cash flow, and get paid without building separate finance ops
    - '>100,000 combined users are claimed, but standalone-SMB count is not broken out'
    - Official scale metrics plus time-saved claim suggest broad self-serve utility
    - No public direct-SMB share of revenue, volume, or retention
  - - Accounting firms and bookkeepers
    - Firm partner or controller / staff accountant + client approver / firm or client payer
    - Multi-client AP and AR with shared permissions, approvals, and discounted plan management
    - Strongest named-customer proof set across AccounTAXstic, Accounting Solutions, Walker, Latitude, Cubepros, and CPA Business Advisors
    - Free firm Boost plan, partner tiers, client discounts, and six permission levels create a clear accountant motion
    - No public attach rate from accountant-led proof into the total Melio base
  - - Multi-entity accountant-managed clients
    - External finance lead / staff + entity approvers / each managed entity
    - Handle rapid entity creation, common ownership structures, and centralized bill processing
    - CPA Business Advisors cites clients opening 10-20 entities per year
    - Complexity raises likely stickiness even without disclosed contract data
    - No public concentration data for these high-complexity books
  - - Embedded Xero bill-pay users
    - Xero admin / accounting staff / business payer
    - Pay domestic USD bills inside Xero with approver routing and usage-based fees
    - Meaningful public surface, but Xero-specific active-user count is not disclosed
    - Xero FAQ plus app listing prove live deployment and visible customer sentiment
    - USD-only scope, re-verification, and no historical-data transfer from standalone Melio
  - - Embedded Gusto bill-pay users
    - Gusto admin / payroll-finance operator / business payer
    - Manage bills and invoices in the same place as payroll
    - Large potential partner surface because Gusto serves 400,000+ SMBs, but realized Melio attach is undisclosed
    - Embedded AP/AR could lower acquisition cost if eligibility and pricing do not suppress adoption
    - Eligibility criteria and Money Plus gating limit how universal the surface is
  - - Complex-use software SMBs
    - COO or finance lead / ops-finance team / business payer
    - Run recurring domestic, international, and refund workflows with accounting sync
    - QBench is the clearest named non-accounting production proof in the retained set
    - Shows Melio can support more than accountant-mediated bill pay
    - Public non-accounting named proof remains thin relative to claimed overall scale
  notes: Rows summarize the externally visible customer cohorts Melio discloses today; they do not imply a complete segment P&L or customer-count breakout.
