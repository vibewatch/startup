  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, and logo-churn data for direct, accountant-managed, and partner-embedded customers.
    whyItMatters: Without cohort retention metrics, the chapter can show workflow fit but cannot quantify customer durability or the revenue impact of partner-channel friction.
    diligencePath: Request a customer-retention pack with NRR, GRR, logo churn, and cohort tables split by direct, accountant-managed, Xero, and Gusto channels.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: satisfaction-metrics
    missingEvidence: Latest first-party NPS or CSAT results, including sample size and segment-level breakouts.
    whyItMatters: Review-platform signals are noisy and channel-skewed; management-quality satisfaction data is necessary to reconcile positive case studies with adverse embedded reviews.
    diligencePath: Request the latest customer-satisfaction dashboard or board materials showing NPS, CSAT, ticket volume, and support-resolution trends by channel.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: Standard contract length, auto-renew logic, termination rights, and renewal behavior by customer segment and partner channel.
    whyItMatters: Durability differs materially between monthly SMB subscriptions, accountant-managed books, and partner-embedded deployments, so terms matter for churn risk and expansion quality.
    diligencePath: Request sample MSAs, standard subscription terms, partner terms, and renewal / downgrade behavior by segment.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: TU003 named-customer-proof coverage
    missingEvidence: More named live customers outside accountant-led case studies, ideally with independent customer-owned references or partner-confirmed deployments.
    whyItMatters: TU003 is necessarily partial today because Melio's public named-customer proof is concentrated in accounting-firm stories plus one clear non-accounting example, which weakens cross-segment confidence.
    diligencePath: Request a named-customer roster by segment, production status, and referenceability, prioritizing non-accounting SMBs and partner-confirmed live accounts.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: top-customer-concentration
    missingEvidence: Top-customer concentration data by payment volume, revenue, and gross profit, plus any single-customer churn history.
    whyItMatters: Public proof shows named logos and partner channels, but not whether Melio is exposed to a small number of outsized books or enterprise relationships.
    diligencePath: Request top-10 customer concentration, largest-book exposure, and any customer-loss postmortems from the last 24 months.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Direct-versus-partner customer counts, payment volume, revenue, and contribution margin by channel.
    whyItMatters: The chapter can see reach through Xero and Gusto, but without channel mix it cannot determine whether embedded partners are a diversification benefit or a concentration risk.
    diligencePath: Request a channel-mix bridge showing direct, accountant-managed, Xero, Gusto, and other partner-originated customers, volume, revenue, and retention.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
