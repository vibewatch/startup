company:
  name: Namirial
chapter:
  number: 4
  title: Financials
  summary: >-
    Independent reporting puts Namirial's 2025 turnover at EUR270 million and management's 2026
    target above EUR300 million, but the public record does not disclose revenue mix, gross margin,
    cash, debt, burn, or unit economics. The underwriting case therefore rests on demonstrated scale
    and a broad product surface while cash conversion and acquisition funding remain material gaps.
sections:
  - id: revenue-scale-and-quality
    title: Revenue scale is visible, but its composition is not
    body: >-
      Il Sole 24 Ore reported EUR270 million of turnover for 2025 and a management target above
      EUR300 million for 2026. That is the strongest current revenue evidence in the assigned pool,
      but it is not an audited series and does not separate organic growth from acquisitions.
      Namirial's 2020 announcement supplies a historical anchor of EUR50 million of FY2019 revenue
      and says its digital-transaction-management business had grown at more than 30% CAGR. Product
      disclosures identify e-signature, identity, onboarding, certified communication, archiving,
      invoicing, and workflow offerings; they do not disclose revenue by product, geography,
      customer segment, deployment model, or recurring versus transactional basis. Signaturit's
      reported ARR growth belongs to the acquisition target, not to Namirial or the combined group,
      so it cannot be used as a group ARR proxy.
    claimRefs: [CI001, CI006, CI007, CI008, CI009, CI011]
    tableRefs: [TI001]
  - id: monetization-and-commercial-efficiency
    title: Commercial reach is clearer than pricing or sales efficiency
    body: >-
      The evidence supports multiple delivery and distribution paths: Namirial has described direct
      and indirect channels, while transaction material also describes cloud services, on-premise
      software, and trusted-service operations. Those surfaces could support licenses,
      subscriptions, usage charges, implementation work, or managed-service fees, but none of the
      retained sources states the realized contract mix or price basis. The April 2026 CRO
      appointment explicitly covers commercial performance, new business, and alignment of
      revenue-generating functions, indicating that go-to-market execution is a management priority.
      It does not provide sales-cycle length, customer-acquisition cost, payback, retention,
      discounting, partner commissions, or channel contribution. These missing inputs prevent a
      defensible bridge from customer activity to recognized revenue.
    claimRefs: [CI002, CI003, CI016]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Operating leverage cannot be inferred from volume alone
    body: >-
      Transaction and customer counts demonstrate operating breadth, not profitability. The July
      2025 combination announcement described roughly 1,400 employees and 240,000 customers for the
      proposed combined Namirial-Signaturit group. ZeroComa reporting is less consistent: its
      financial adviser said more than 550 customers, while Il Sole 24 Ore said over 650 clients.
      Different dates or definitions may explain the gap, but the sources do not reconcile them.
      More importantly, no retained source provides hosting expense, trust-service operating cost,
      implementation labor, support burden, gross margin, working capital, or capital expenditure.
      Customer, employee, transaction, and revenue figures therefore should not be combined into
      productivity or margin ratios without a common perimeter and period.
    claimRefs: [CI004, CI005, CI010, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Sponsor backing does not establish operating liquidity
    body: >-
      The 2025 combination material described Bain Capital, Ambienta, Namirial's founder and
      management as shareholders, with PSG and Signaturit management expected to reinvest alongside
      them. That structure signals institutional support and an acquisition-led strategy, but
      funding raised or sponsor participation is not cash available to the company. Il Sole 24 Ore
      reported an estimated EUR1.1 billion valuation for the 2025 majority-stake transfer and said
      the ZeroComa purchase price was undisclosed. No retained source states current cash, net debt,
      credit facilities, covenant headroom, burn, runway, acquisition financing, planned use of
      funds, or a next-round trigger. Financial diligence should therefore treat scale as credible
      but revenue quality, margin durability, and capital adequacy as unproven until management
      supplies audited and cohort-level evidence.
    claimRefs: [CI012, CI013, CI014, CI015]
