      - [Legacy professional and enterprise applications, "Accounting, HR, tax, construction, and cyber-defence software", "Described in the 2020 portfolio; current contribution unavailable", "Current perimeter and strategic importance are unclear", "Current product map, revenue mix, and discontinued-product bridge"]
    notes: "The table distinguishes disclosed product mechanisms from unavailable stream economics; no row converts product presence into recurring revenue or margin."
    claimRefs: [CI001, CI003, CI004, CI005, CI014]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Dimension, Public evidence, Underwriting implication, Missing input]
    rows:
      - [List pricing, "No retained source states a public Namirial price", "Price realization cannot be benchmarked", "Current price books by product and geography"]
      - [Contract basis, "Cloud and on-premise delivery are described", "Delivery mode does not establish subscription, license, or service mix", "Order forms, contract terms, and revenue-recognition policy"]
      - [Usage monetization, "Transaction activity is described without a price per transaction", "Volume is not revenue or gross profit", "Metered units, minimum commitments, overages, and realized take-rate"]
      - [Channel economics, "Direct and indirect channels are described", "Partner reach may trade off against gross margin", "Partner-sourced bookings, commissions, discounts, and concentration"]
      - [Sales efficiency, "The CRO mandate covers commercial performance and new business", "Management focus is not measured efficiency", "Sales cycle, fully loaded CAC, payback, win rate, and quota attainment"]
    notes: "Null or unavailable commercial terms mean the assigned public evidence did not disclose them; they must not be interpreted as zero."
    claimRefs: [CI002, CI003, CI016]
  - id: TI003
    title: Unit economics and capital underwriting
    columns: [Metric, Public value, Confidence and perimeter, Why it matters, Diligence ask]
    rows:
      - [Turnover, "EUR270m in 2025; management target >EUR300m in 2026", "Medium; independent report, current Namirial perimeter not audited here", "Establishes scale but not organic growth or cash conversion", "Audited revenue bridge by product, geography, and acquisition"]
      - [Historical revenue, "EUR50m in FY2019", "Medium; historical company announcement", "Provides a distant anchor across a materially changed perimeter", "Organic versus acquired revenue bridge since 2019"]
      - [Combined customers, "~240,000 for the proposed Namirial-Signaturit group", "Medium; transaction-party release", "Denominator depends on completion and active-customer definition", "Active, paying, and transacting customer cohorts"]
      - [Gross margin, null, "Unavailable", "Determines software and service operating leverage", "Gross margin by product, deployment, channel, and geography"]
      - [CAC and payback, null, "Unavailable", "Tests whether growth is economically efficient", "Fully loaded CAC, sales cycle, retention, and cohort payback"]
      - ["Cash, debt, burn, and runway", null, "Unavailable", "Determines financing dependency and downside resilience", "Cash-flow bridge, debt schedule, covenants, and base/downside runway"]
    notes: "Reported values retain their stated period and perimeter; null means no reliable public value appears in the assigned successful source set, not zero."
    claimRefs: [CI006, CI007, CI008, CI010, CI015]
figures:
  - id: FI001
    title: Publicly evidenced revenue model bridge
    type: flow
    summary: >-
      Public evidence reaches from customer workflows through delivery channels, but the pricing,
      recognition, and gross-profit links remain undisclosed.
    data:
      nodes:
        - {id: customer-needs, label: "Regulated customer workflows", detail: "Identity, onboarding, signatures, certified communication, archiving, and invoicing"}
        - {id: product-activity, label: "Product activity", detail: "Software use, trust services, integrations, and transaction processing"}
        - {id: deployment, label: "Delivery modes", detail: "Cloud services, on-premise software, and trusted-service operations"}
        - {id: channels, label: "Commercial channels", detail: "Direct and indirect distribution"}
        - {id: monetization, label: "Monetization terms unavailable", detail: "No public price basis, contract mix, or realized discount evidence"}
        - {id: recognized-revenue, label: "Recognized revenue", detail: "Turnover is reported, but product and organic-acquired mix are unavailable"}
        - {id: gross-profit, label: "Gross profit unavailable", detail: "No public cost-to-serve or gross-margin bridge"}
    approximationNotes: "This is a qualitative sequence, not a conversion funnel or quantitative waterfall; it does not infer prices, conversion rates, or margins."
    claimRefs: [CI015]
callouts:
  - calloutType: strength
    title: Material reported scale
    body: >-
      Independent reporting indicates EUR270 million of 2025 turnover and a management target above
      EUR300 million in 2026, while the product set spans several regulated transaction workflows.
    claimRefs: [CI001, CI006, CI007]
  - calloutType: risk
    title: Scale is not cash conversion
    body: >-
      The assigned public evidence does not disclose gross margin, cash, debt, burn, runway, realized
      pricing, CAC, or payback, so reported turnover cannot establish capital adequacy.
    claimRefs: [CI015]
  - calloutType: recommendation
    title: Make operating evidence a financing prerequisite
    body: >-
      Require audited accounts, an organic-acquired revenue bridge, product-level margins, customer
      cohorts, channel economics, and a debt-and-cash-flow package before underwriting valuation.
    claimRefs: [CI006, CI012, CI013, CI014, CI015]
