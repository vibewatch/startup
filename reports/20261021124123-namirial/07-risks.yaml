    columns: [Failure mode, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Multi-country service reliability, "Cloud services, on-premise software, and trusted service operations span multiple countries", medium, high, partial, high, "No assigned source quantifies outages, SLA attainment, recovery time, or service credits"]
      - [Customer-experience deterioration, "The fetched Trustpilot URL text presents Namirial products and support but does not establish a representative service-quality metric", medium, medium-high, weak, medium-high, "Obtain verified complaint taxonomy, response times, churn cohorts, and referenceable customer sample"]
      - [Acquisition integration and control failure, "Signaturit combination and ZeroComa acquisition broaden products and geographies; approval and integration conditions apply", medium-high, high, partial, high, "Obtain integration scorecard, systems map, control owners, and milestone variance"]
      - [Financial model opacity, "Public coverage reports EUR270m 2025 turnover and a target above EUR300m in 2026, but assigned evidence is not audited financial reporting", medium, high, weak, high, "Obtain audited statements, margin bridge, cash conversion, debt, working capital, and acquisition accounting"]
    notes: "Likelihood, severity, and residual exposure are analyst assessments anchored to the cited operating signals; no zero is used for unavailable incident or financial metrics."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - [Acquisition approvals and employee consultation, "Signaturit, PSG Equity, Namirial shareholders", "Transaction delay, scope change, or failed approvals slows geographic and product integration", high, "Ownership groups reinvest and transaction process includes customary approvals", medium-high, "Approval status, close date, integration milestones, employee attrition"]
      - [Founder and management continuity, "ZeroComa founders and co-CEOs", "Loss of local regulatory and customer knowledge weakens Spanish execution", medium-high, "Founders expected to remain and acquire a Namirial stake", medium, "Retention, customer renewal, product certification, leadership succession"]
      - [Strategic partner network, "More than 1,000 strategic partners described by Namirial/PSG materials", "Partner concentration or channel underperformance reduces distribution and service coverage", high, "International partner network and multi-country footprint", medium-high, "Revenue and pipeline concentration by partner, partner churn, channel-sourced retention"]
    notes: "Partner counts and roles are source-reported; concentration, contract terms, and failure recoverability are not disclosed in the assigned pool and require verification."
    claimRefs: [CR010, CR011, CR012]
