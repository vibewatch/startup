chapter:
  number: 7
  title: Risks
  summary: Namirial's principal risks are execution and integration complexity around rapid European expansion, regulated trust-service obligations, and the transparency gap around financial and operational resilience. The evidence supports a diversified risk register, but public sources do not establish incident history, customer concentration, margin resilience, or the status of every regulatory control.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Namirial operates in a high-consequence trust-services environment rather than a
      conventional low-regulation software niche. The Cloud Signature Consortium describes
      it as both a software and service company and a certification authority, while its
      product set includes e-signature, registered email, e-invoicing, and long-term
      archiving. The same source says Namirial is a qualified trust-services provider under
      EU Regulation 910/2014 eIDAS. The PSG announcement separately says the company is
      actively engaging with the EU Digital Identity Framework and Regulation 2024/1183.
      These are meaningful compliance capabilities, but they also create exposure to
      certification, privacy, identity, evidentiary, and cross-border rule changes. The
      ZeroComa acquisition adds Spanish electronic-notification, invoicing, and reporting
      compliance workflows; Arcano says completion remained subject to customary
      conditions. Public evidence does not confirm the full license register, audit
      findings, unresolved disputes, or post-acquisition control integration, so these
      remain diligence items rather than assumed strengths.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-financial
    title: Operating, quality, and financial model risks
    body: >-
      The operating model combines cloud services, on-premise software, and trusted
      service operations across multiple countries. That breadth can support resilience and
      customer choice, but it also increases the number of interfaces where reliability,
      security, data handling, and service-level failures could occur. The 2025 combination
      announcement described a group with approximately 1,400 employees and approximately
      240,000 customers worldwide, while the later ZeroComa coverage reported more than
      1,400 employees and operations in more than 90 countries; the differing snapshots
      should not be treated as a clean growth series. The same article reported 2025
      turnover of EUR270 million and a 2026 target above EUR300 million, but those figures
      are not audited in the assigned evidence. Trustpilot's archived page showed an
      “Average” 3.1/5 rating, which is a directional customer-experience signal, not a
      representative churn or reliability measure. Public sources do not quantify burn,
      working capital, gross margin, outage frequency, breach history, or service credits.
      Investors should therefore monitor integration milestones and independently verify
      the financial and operational denominator behind any growth narrative.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependency-and-thesis-breaks
    title: Partner, dependency, and thesis-break controls
    body: >-
      Namirial's expansion is materially dependent on acquisitions, sponsor support,
      partner channels, and the ability to integrate adjacent trust and transaction
      products. The PSG announcement says Signaturit would enter exclusive negotiations,
      remain subject to regulatory approvals and employee consultation, and bring PSG and
      Signaturit management into the combined ownership structure. It also describes
      Namirial's international reach and more than 1,000 strategic partners. The CRO
      appointment in April 2026 places responsibility for global growth and revenue
      functions with a newly appointed executive, which may improve commercial
      coordination but creates an execution checkpoint during a complex expansion phase.
      ZeroComa's founders were expected to remain involved and acquire a stake, aligning
      continuity while also making key-person and integration dependency relevant. The
      highest-value monitoring indicators are approval and integration completion, control
      audit outcomes, service availability, customer retention by cohort, and cash
      conversion after acquisitions. A thesis break should be declared if material
      regulatory approval fails, integration misses agreed milestones, customer
      complaints worsen without remediation, or financial disclosure cannot substantiate
      the stated scale and growth.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Highest residual exposure
    body: >-
      The largest residual exposure is not a single disclosed lawsuit or outage; it is
      the compound risk that regulated-service obligations, multi-country integration, and
      acquisition-led growth outpace Namirial's publicly visible control and financial
      disclosure.
    claimRefs: [CR001, CR005, CR010, CR013]
  - calloutType: recommendation
    title: Diligence priority
    body: >-
      Require a current trust-service license and audit pack, incident and availability
      history, customer concentration and retention cohorts, acquisition integration KPIs,
      and audited financial statements before underwriting growth or assigning a low risk
      rating.
    claimRefs: [CR003, CR007, CR008, CR013]
