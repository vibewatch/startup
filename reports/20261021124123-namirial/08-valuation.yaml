callouts:
  - calloutType: recommendation
    title: Price discipline overrides company quality
    body: >-
      A credible platform and historical transaction mark do not establish an attractive current
      entry. Advance only after the denominator, leverage, dilution, and preference stack are
      evidenced and the offered price supports the required downside-adjusted return.
    claimRefs: [CV003, CV004, CV016]
  - calloutType: risk
    title: Do not average conflicting public counts
    body: >-
      Public sources disagree on acquisition and ZeroComa customer counts. Reconcile these data
      with management records before using them in operating or integration models.
    claimRefs: [CV006, CV007, CV010, CV011]
