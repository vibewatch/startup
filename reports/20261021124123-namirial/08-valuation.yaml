company:
  name: Namirial
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports scale and strategic momentum but not a price-specific investment
    decision. A reported €1.1 billion 2025 majority-transfer valuation and €270 million of 2025
    revenue provide a historical anchor, while current entry price, profitability, leverage,
    retention, preference terms, and decision-grade comparable multiples remain undisclosed.
sections:
  - id: decision-frame
    title: Decision frame and valuation context
    body: >-
      The recommended stance is research more / track, with medium confidence and high
      underwriting risk. Il Sole 24 Ore reports €270 million of 2025 turnover, a management aim
      to exceed €300 million in 2026, and an estimated €1.1 billion valuation when the majority
      stake moved from Ambienta to Bain Capital in 2025. The reported mark equates to roughly
      4.1 times 2025 revenue, but that is an analyst calculation from a historical transaction
      mark, not a current enterprise-value multiple or an investable price. The public source
      set does not disclose EBITDA, net debt, recurring-revenue mix, retention, cash conversion,
      preference terms, or the price now available to a new investor. Those omissions prevent a
      defensible equity-value range or target return.
    claimRefs: [CV001, CV002, CV003, CV004, CV016]
    tableRefs: [TV001]
  - id: thesis-balance
    title: Thesis, anti-thesis, and execution burden
    body: >-
      The thesis rests on demonstrated revenue scale, a broad European trust-services platform,
      and continued consolidation. The Signaturit combination was described as creating a group
      with about 1,400 employees and 240,000 customers, while company-issued materials said
      Signaturit's annual recurring revenue had increased more than tenfold over five years.
      Namirial also appointed a chief revenue officer to coordinate organic and non-organic
      growth. The anti-thesis is that this is an acquisition-heavy platform whose integration
      load cannot be priced from public evidence. Tracxn's two pages disagree on whether Namirial
      has completed six or seven acquisitions, and Il Sole 24 Ore and transaction adviser Arcano
      cite different ZeroComa customer counts. These discrepancies are not evidence of operating
      failure, but they show why management data must replace public aggregation before approval.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV015]
    tableRefs: [TV002]
  - id: scenarios-entry
    title: Scenarios and entry discipline
    body: >-
      Scenario analysis should remain conditional rather than assign unsupported probabilities
      or valuation ranges. The bull case requires audited proof that revenue growth converts into
      recurring gross profit, retention, and cash generation while integrations preserve service
      quality. The base case treats the €1.1 billion 2025 mark as a negotiation reference only:
      any new price must be reconciled to current net debt, EBITDA, recurring revenue, and fully
      diluted ownership. The bear case is multiple compression combined with missed integration
      or revenue targets, leaving a sponsor-owned consolidator with limited public liquidity.
      Without those inputs, downside protection should come from price discipline, preference
      review, governance rights, milestone-based funding, or a decision not to invest.
    claimRefs: [CV002, CV003, CV004, CV005, CV010, CV011, CV012, CV016]
    tableRefs: [TV003]
  - id: diligence-exit
    title: Diligence, exit readiness, and thesis breaks
    body: >-
      The final diligence package should include audited 2024-2026 financials, monthly recurring
      revenue by product and geography, gross and EBITDA margins, net debt, cash conversion,
      retention cohorts, acquisition purchase accounting, integration scorecards, the fully
      diluted capitalization table, and every preference or management rollover. The source set
      establishes independent analyst attention through an IDC vendor profile, but it does not
      provide a relevant public-company multiple set or evidence of an IPO timetable. Thesis-break
      triggers should therefore be measurable: failure to substantiate the 2026 revenue objective,
      material contraction in recurring growth or retention, integration slippage, leverage that
      eliminates downside coverage, or terms that place new money behind an undisclosed preference
      overhang. Exit underwriting should wait for buyer mapping and sponsor liquidity plans.
    claimRefs: [CV002, CV013, CV014, CV016]
    figureRefs: [FV001]
