callouts:
  - calloutType: strength
    title: Compliance-led breadth
    body: The product surface combines transaction workflows with identity, trust services, archiving, and regulated communications, which can reduce the need for customers to assemble multiple vendors.
    claimRefs: [CE001, CE005, CE010]
  - calloutType: risk
    title: Reliability proof is thin
    body: Redundant certification-authority infrastructure is a positive control signal, but public sources do not provide independently verified uptime, recovery, incident, or security-performance data.
    claimRefs: [CE007, CE014]
  - calloutType: insight
    title: Platform breadth is the central product thesis
    body: Namirial's strongest observable product advantage is the combination of workflow, trust, identity, records, and compliance capabilities; the evidence is less conclusive on whether those capabilities operate as one deeply integrated platform.
    claimRefs: [CE001, CE003, CE005, CE010]
  - calloutType: assumption
    title: Public technical evidence is selective
    body: The chapter treats company and partner descriptions as evidence of capabilities and design intent, not as independent verification of performance, security, customer outcomes, or integration depth.
    claimRefs: [CE007, CE011, CE014]
