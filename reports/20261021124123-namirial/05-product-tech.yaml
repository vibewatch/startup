  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer or practitioner evidence such as repository activity, package downloads, API forum usage, or comparable integration telemetry.
      whyItMatters: Product breadth and company-issued descriptions do not show whether developers actively adopt, integrate, or extend Namirial services.
      diligencePath: Request API usage, integration counts, SDK download data, developer-support volumes, and a current public developer-surface inventory.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Independent service-level, disaster-recovery, security-testing, incident, and support-performance records.
      whyItMatters: Namirial operates regulated trust infrastructure where availability and control effectiveness are central to customer risk.
      diligencePath: Obtain current certifications, audit reports, penetration-test summaries, uptime history, recovery-test results, and incident register under NDA.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: integration
      missingEvidence: Product-level architecture, integration inventory, migration plans, and post-acquisition operating model.
      whyItMatters: A broad portfolio can create implementation friction and duplicated platforms even when the individual modules are credible.
      diligencePath: Request the current product catalog, shared-service map, API documentation, integration backlog, and customer migration evidence.
      relatedQuestionRefs: [QE003, QE007]
    - type: stale
      severity: minor
      topic: operating-scale
      missingEvidence: Current validation of the historical DTM scale figures and current product-level usage metrics.
      whyItMatters: The historical volume figures demonstrate past scale but do not establish 2026 activity, growth, or service quality.
      diligencePath: Request 2025-2026 transaction volumes, archived pages, signature volumes, active tenants, and denominators by product.
      relatedQuestionRefs: [QE004]
