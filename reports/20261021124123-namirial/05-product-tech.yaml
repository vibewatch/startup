chapter:
  number: 5
  title: Product & Technology
  summary: Namirial delivers digital transaction-management and trust services spanning identity, electronic signatures, certified communications, archiving, invoicing, and workflow orchestration. Public evidence shows a broad compliance-oriented product surface and selected operating proof, including AWS-backed generative-AI experimentation and a dual-certification-authority continuity design, but detailed product telemetry, independent reliability metrics, and public developer activity remain limited.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Namirial's product is best understood as a regulated digital-process layer rather than a
      single signing application. The available product documentation describes Digital Transaction
      Management as capturing legally compliant electronic signatures, managing and tracking
      document flows, and supporting on-premise, cloud, or hybrid deployment. The broader group
      portfolio adds customer onboarding, digital identity orchestration, certified communications,
      qualified archiving, and electronic invoicing. This breadth supports workflows in which a
      customer is identified, a document or transaction is routed for approval, signatures and
      evidence are collected, and records are retained under applicable trust-service rules.
      The acquired ZeroComa capability extends the workflow into Spanish electronic invoicing,
      public-authority notifications, and tax reporting. That product adjacency is strategically
      useful, but the public record does not establish how deeply the modules share data models,
      administration, pricing, or service-level commitments.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-resilience
    title: Architecture, trust controls, and resilience
    body: >-
      Public evidence points to a multi-layer operating architecture: customer-facing cloud and
      on-premise or hybrid workflow products sit above identity, signature, trust-service, and
      archival capabilities. The historical DTM material identifies eSignAnyWhere, biometric and
      HTML5 signing options, remote signatures, qualified timestamps, and digital archiving as
      components of the operating model. Namirial's current continuity page describes two
      equivalent Qualified Certification Authorities, each with a primary and disaster-recovery
      data center, and names Milan/Senigallia and Barcelona/Naples locations. In 2026, Namirial
      also described a Digital Product Passport service in which role-based supply-chain actors
      generate and update passport data, while a registry handles identifiers and registration
      information. These are credible design signals, but they remain largely company-issued:
      independent uptime, recovery-time, penetration-test, incident, and integration-performance
      evidence was not available in the assigned pool.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation
    title: Maturity, differentiation, and implementation risk
    body: >-
      Namirial has evidence of operating maturity in regulated trust services and high-volume
      document workflows, but maturity is unevenly observable across the portfolio. The DTM
      material reports more than two billion pages digitally archived annually and more than
      350,000 handwritten-biometric signature stations, while the AWS case study describes
      eSignAnyWhere experimentation with Amazon Bedrock to develop new features. The DPP article
      goes further by describing an active, production-ready Food Metaverse project and Namirial's
      role as a DPP Service Provider. Differentiation therefore appears to rest on qualified trust
      status, compliance know-how, workflow breadth, geographic coverage, and continuity
      infrastructure more than on a publicly measurable software moat.       The main diligence risk is
      implementation complexity: customers may need country-specific legal configuration,
      integrations, identity controls, and migration across acquired products. Public evidence does
      not quantify defect rates, support response, service availability, security incidents, or
      product-level adoption.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
