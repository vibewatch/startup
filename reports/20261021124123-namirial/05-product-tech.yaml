  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Namirial solution, Measurable benefit, Limitation]
    rows:
      - [Execute a legally meaningful agreement, Identify signer and collect signature evidence, DTM workflow with multiple signature types and trust services, Compliance-oriented digital completion, No public conversion or cycle-time benchmark]
      - [Route a multi-party document, Assign workflow steps and track completion, E-signature workflow orchestration and auto-stepping rules, Fewer missing-step process failures are the stated objective, No independent proof of realized reduction]
      - [Retain transaction records, Archive documents and evidence for the long term, Qualified electronic archiving, Durable compliance record, No public retrieval or preservation SLA]
      - [Issue or receive regulated business communications, Send certified communications and manage notices, Certified communications and ZeroComa public-authority notification capability, Digitized tax and notification workflows, Country-specific coverage and integration economics unclear]
      - [Create a traceable product record, Register product identity and lifecycle events, DPP infrastructure with role-based updates and data carriers, Supply-chain traceability and controlled access, Regulatory rollout and external deployment scale remain uncertain]
    notes: >-
      The measurable-benefit column records the benefit described or implied by the source, not a
      verified KPI. No public source in the assigned pool supplies comparable cycle-time, uptime,
      defect, or customer-outcome measurements.
    claimRefs: [CE002, CE005, CE006, CE008, CE009, CE012]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Customer workflow layer, "Onboarding, agreement automation, signing, and invoicing", "Identity and trust-service components", "Cross-product integration and configuration complexity"]
      - [Trust and identity layer, "Qualified signatures, identity verification, timestamps, and certification", "eIDAS and other applicable legal frameworks", "Regulatory change and assurance obligations"]
      - [Data and records layer, "Certified communications, archiving, and DPP information", "Data carriers, identifiers, role rights, and retention processes", "Data portability and long-term persistence"]
      - [Availability layer, "Primary and disaster-recovery certification authorities", "Four named data-center locations across two CA setups", "Independent recovery and uptime evidence not disclosed"]
      - [Innovation layer, "Generative-AI feature experimentation and DPP service development", "AWS Bedrock and company-operated services", "Governance, security, and production-scale validation"]
    notes: >-
      This architecture is a synthesis of named public capabilities and infrastructure descriptions;
      it is not a disclosed end-to-end technical diagram. Dependencies and risks are diligence
      interpretations, not claims that a failure has occurred.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE011, CE012]
