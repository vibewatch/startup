company:
  name: Namirial
chapter:
  number: 1
  title: Company Overview
  summary: Namirial is an Italian-founded digital transaction management and qualified trust-service provider expanding across Europe through acquisitions and the combination with Signaturit. Public materials support a large, growing operating footprint, but private-company disclosure leaves valuation, capital structure, and several current scale metrics dependent on issuer or press estimates.
sections:
  - id: identity-and-platform
    title: Identity, product scope, and operating footprint
    body: >-
      Namirial was founded in Italy in 2000 and is headquartered in Senigallia, Italy, according to Bain
      Capital's acquisition announcement. Its offering covers e-signature workflows, onboarding and digital
      identity orchestration, digital trust technologies, qualified electronic archiving, certified
      communications, and electronic invoicing for enterprises, SMEs, professionals, and public
      administrations. The company describes itself as an accredited qualified trust service provider under
      EU Regulation 910/2014 (eIDAS), while its transaction materials describe operations in more than 85
      countries and several million transactions processed each day. The Signaturit combination broadens
      the platform with identity verification, KYC and fraud prevention, eID wallet, document analysis,
      and related trust services. These are strong indicators of a regulated, multi-product platform, but
      the sources do not provide audited product-level revenue or retention data.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, ownership, and governance
    body: >-
      Max Pellegrini has led Namirial as CEO since 2020, while founder Enrico Giacomelli remains materially
      involved in ownership and strategic communication. Bain Capital announced a definitive agreement to
      acquire a controlling stake from Ambienta in March 2025, with financial terms undisclosed; the
      transaction materials identify Bain, Ambienta, the founder and management as stakeholders. The
      planned Signaturit combination adds PSG Equity and Signaturit management as significant minority
      partners, subject to customary approvals and consultation. José Vallés joined the executive
      leadership team as CRO in April 2026, reporting to Pellegrini and overseeing revenue-generating
      functions. The available record shows strengthened commercial leadership and sponsor-backed
      governance, but it does not disclose a complete board roster, voting agreement, debt package, or
      succession plan. Key-person dependence therefore remains a diligence question rather than a
      quantified conclusion.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: capital-and-milestones
    title: Capital events, acquisitions, and unresolved scale metrics
    body: >-
      Namirial's documented growth path is acquisition-led as well as organic. Public materials identify
      the acquisition of a controlling stake by Bain Capital in 2025, the proposed Signaturit combination
      announced in July 2025, and the later acquisition of Spanish e-invoicing and e-notification provider
      ZeroComa. Il Sole 24 Ore reports €270 million of 2025 turnover, a target above €300 million in 2026,
      more than 1,400 employees, operations in more than 90 countries, and an estimated €1.1 billion
      valuation; the same article attributes the valuation to press reporting and does not provide a
      primary transaction filing. Signaturit's post-combination page reports €260 million of 2025 revenue
      for the combined business, while Bain's announcement reports approximately 1,000 Namirial employees
      and thousands of customers before the combination. These figures are not directly comparable by
      perimeter or publication context and should not be combined into a single precise KPI. Exact total
      capital raised, current valuation, revenue run-rate, customer count, and debt remain undisclosed or
      conflicting in the retained evidence.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Ground-truth implications for later diligence
    body: >-
      The evidence supports an established European trust-services platform with meaningful regulatory
      accreditation, sponsor capital, multi-country distribution, and a broadening product perimeter.
      The main analytical constraint is disclosure quality: company and sponsor releases provide extensive
      operating assertions, whereas valuation, financing terms, audited revenue composition, customer
      concentration, board control, and integration outcomes are not disclosed in the assigned sources.
      The ZeroComa transaction also illustrates the value of local regulatory and tax-compliance capabilities
      while leaving purchase price and integration economics unknown. Later analysis should preserve the
      distinction between Namirial-only metrics, proposed-combination metrics, and post-combination company
      claims rather than treating them as a continuous series.
    claimRefs: [CO003, CO011, CO012, CO014]
  - id: exhibits
    title: Exhibits
    body: >-
      The snapshot table separates reported values from gaps, the leadership table records the named
      operating and capital stakeholders, and the stakeholder map identifies the control and integration
      questions that require primary diligence. The milestone timeline is intentionally limited to dated
      events supported by the retained source texts; it does not infer transaction closing dates from an
      announcement date. Each exhibit preserves source perimeter, publication context, and unresolved
      definitions so that later chapters can reuse the evidence without converting estimates into audited
      facts or treating the absence of a retained adverse source as proof of no adverse event.
    claimRefs: [CO006, CO007, CO010, CO013]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns: [Metric, Value or status, Date or period, Confidence, Gap]
    rows:
      - [Founded, "2000; Italy", "Historical", high, "Exact founding day and founders' original ownership are not disclosed in the retained sources."]
      - [Headquarters, "Senigallia, Italy", "Current in 2025 announcement", high, "No current office or legal-entity register was retained."]
      - [Countries served, ">85 countries", "2025", medium, "Source is a sponsor announcement; geographic revenue mix is unavailable."]
      - [Employees, "~1,000 Namirial employees; >1,400 for the later combined group", "2025-2026 source contexts", medium, "Perimeter and timing differ; current Namirial-only headcount is not reconciled."]
      - [Revenue, "€270m reported turnover; >€300m target", "2025 actual / 2026 target", medium, "Il Sole 24 Ore reports the figures; audited statements and definition are unavailable."]
      - [Valuation, "€1.1bn estimated in financial press", "2025", low, "Transaction terms were undisclosed by Bain; primary valuation evidence is unavailable."]
      - [Customers, "Thousands of customers; ~240,000 for proposed combined group", "2025", low, "Namirial-only active customer count and definition are not disclosed."]
      - [Transactions, "Several million processed per day", "2025", medium, "Issuer/sponsor description lacks an auditable denominator and product split."]
    notes: "Values preserve source perimeter and qualification: Namirial-only, proposed combined group, issuer claim, and press estimate are not interchangeable."
    claimRefs: [CO001, CO003, CO010, CO011, CO012, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns: [Person or group, Role, Background or coverage, Key-person or governance implication]
    rows:
      - ["Enrico Giacomelli", "Founder; shareholder/management stakeholder", "Founded Namirial in Italy; remains involved in strategic communications.", "Founder continuity is visible, but voting rights and succession arrangements are undisclosed."]
      - ["Max Pellegrini", "CEO since 2020", "Leads the group through sponsor transition and European expansion.", "Integration and growth execution are concentrated in the CEO role; board oversight is not disclosed."]
      - ["José Vallés", "Chief Revenue Officer from April 2026", "Former SAP Spain managing director; prior Sitecore and Telefónica Digital leadership.", "Adds senior commercial coverage and reports directly to Pellegrini; retention terms are unknown."]
      - ["Álvaro and Alejandro Allende", "Co-CEOs of ZeroComa", "Continue leading the acquired Spanish company and acquire a stake in Namirial.", "Management continuity supports local execution, but integration authority and incentives are undisclosed."]
    notes: "Named people and roles are drawn from sponsor, company, and transaction-adviser materials; this is not a complete board or executive enumeration."
    enumerationScope:
      coverage: partial
      basis: "Named founders and operating leaders appearing in retained 2025-2026 company, sponsor, and transaction materials"
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - ["Bain Capital", "Controlling investor announced in 2025", "Control stake and growth/M&A sponsorship", "Obtain purchase agreement, ownership percentage, governance rights, and financing terms."]
      - ["Ambienta", "Prior private-equity owner; continuing named shareholder in combination materials", "Historical sponsor and possible continuing minority interest", "Confirm rollover, exit proceeds, and remaining voting/economic rights."]
      - ["Enrico Giacomelli and management", "Founder and management shareholders", "Founder continuity and operating incentives", "Review rollover, option pool, leaver terms, and succession protections."]
      - ["PSG Equity", "Signaturit sponsor; reinvesting minority partner in proposed combination", "Source of Signaturit capital and integration influence", "Confirm closing status, minority protections, and post-merger ownership."]
      - ["Signaturit management", "Reinvesting significant minority partner", "Operational continuity across Spain and France", "Test integration milestones, retention, and decision rights across the combined platform."]
      - ["ZeroComa founders and co-CEOs", "Acquired-company management and new Namirial stakeholders", "Local Spanish tax-compliance expertise and customer continuity", "Obtain purchase price, earn-out/equity terms, and integration plan."]
    notes: "The map distinguishes announced or proposed economic roles from control rights; transaction terms and closing status are not fully disclosed."
    enumerationScope:
      coverage: partial
      basis: "Stakeholders named in retained Bain, PSG, company, Arcano, and financial-press transaction disclosures through 2026-10-21"
    claimRefs: [CO005, CO006, CO007, CO010, CO014]
