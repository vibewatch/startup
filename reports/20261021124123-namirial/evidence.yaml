evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Primary purchase agreement, equity value, debt financing, and capitalization table for the Bain transaction and
      subsequent combinations.
    whyItMatters: >-
      The reported €1.1bn valuation is an attributed press estimate and cannot establish entry price, leverage, or
      current equity value.
    diligencePath: >-
      Obtain transaction documents and lender or sponsor diligence materials from the company, sponsors, or relevant
      registry.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A reconciled KPI schedule defining Namirial-only versus combined-group revenue, headcount, customer count,
      countries, and transaction volumes by period.
    whyItMatters: >-
      The retained figures use different perimeters and source types, so combining them would overstate precision and
      distort trend analysis.
    diligencePath: Request audited accounts, management reporting, and a post-merger perimeter bridge with metric definitions.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, committee, ownership, voting, and succession disclosure.
    whyItMatters: >-
      Sponsor and founder roles are visible, but control rights and key-person dependence cannot be assessed from the
      partial leadership record.
    diligencePath: Review shareholder agreement, governance charter, board biographies, and management incentive plan.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-evidence
    missingEvidence: >-
      Independent legal, regulatory, incident, and customer-complaint checks covering Namirial and its acquired
      businesses.
    whyItMatters: >-
      The assigned adverse search returned no retained result, which is a coverage limitation rather than evidence that
      no adverse event exists.
    diligencePath: >-
      Run targeted registry, regulator, litigation, sanctions, outage, and complaint searches and reconcile them with
      company disclosures.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: Namirial revenue by product, geography, customer segment, and recurring versus transactional mix.
    whyItMatters: >-
      Without company-level revenue and penetration denominators, the global category estimate cannot be converted into
      SAM, SOM, or a valuation-relevant share trajectory.
    diligencePath: >-
      Request a product-by-geography revenue bridge, customer cohort file, pricing and contract mix, win-loss data, and
      management's bottom-up SAM/SOM model.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: sizing-limitations
    missingEvidence: >-
      A primary or independently reproducible DTM market forecast that reconciles the reported 8.009 billion value,
      25.39% CAGR, and negative increase.
    whyItMatters: >-
      The arithmetic inconsistency can materially distort growth expectations and prevents reliable use of the
      syndicated estimate as a valuation anchor.
    diligencePath: >-
      Obtain the underlying HTF methodology or replace it with transparent analyst, regulatory, or industry-association
      data using a common definition and period.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Customer-level evidence tying each priority vertical to budget owner, purchase cycle, deployment model, and
      realized ROI.
    whyItMatters: >-
      An industry coverage page establishes breadth but not willingness to pay, conversion, retention, or the timing of
      adoption.
    diligencePath: >-
      Sample contracts and case studies by vertical, including buyer persona, ACV or transaction economics,
      implementation duration, renewal, and expansion.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: market-size
    missingEvidence: A current 2026 market estimate with the same boundary as the 2023–2029 HTF forecast.
    whyItMatters: >-
      The run date is 2026, so an older estimate may not reflect regulatory implementation, consolidation, or AI-enabled
      product changes.
    diligencePath: >-
      Purchase or obtain a current analyst or industry-association forecast and document its inclusion, exclusion,
      geography, and currency basis.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized pricing, discounting, contract terms, and implementation cost by customer segment for Namirial
      and named alternatives.
    whyItMatters: Without realized economics, breadth cannot be translated into buyer value, margin potential, or displacement risk.
    diligencePath: Request anonymized quotes, renewal cohorts, implementation statements of work, and like-for-like competitor bids.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: Win-loss, retention, churn reasons, multi-homing, and partner concentration data by country and segment.
    whyItMatters: These measures distinguish a regulated software moat from a broad but substitutable feature set.
    diligencePath: >-
      Obtain CRM win-loss exports, gross/net retention cohorts, partner revenue concentration, and customer reference
      interviews.
    relatedQuestionRefs:
      - QP006
      - QP007
      - QP008
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A validated list of country-specific trust-service providers, global suites, tax-compliance specialists, and
      likely entrants.
    whyItMatters: The retained pool supports named examples but not an exhaustive European competitor census.
    diligencePath: >-
      Run a country-by-country procurement and trust-service registry review and validate the resulting matrix with
      customers.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A reconciled baseline for Namirial and the proposed combined group's employees, customers, countries, and
      transaction volumes.
    whyItMatters: >-
      Different announcements use different scopes and dates, so scale comparisons may otherwise overstate or
      double-count the combination.
    diligencePath: Request a dated KPI dictionary and post-close consolidation bridge from management.
    relatedQuestionRefs:
      - QP003
      - QP010
  - type: missing-source
    severity: blocking
    topic: financial-statements
    missingEvidence: >-
      Audited consolidated income statement, balance sheet, cash-flow statement, and debt schedule for the current
      perimeter.
    whyItMatters: Reported turnover and sponsor participation do not establish cash conversion, liquidity, or financing dependency.
    diligencePath: >-
      Request audited accounts, current monthly management reporting, a twelve-month cash-flow bridge, and the complete
      debt and covenant schedule.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
      - QI009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Realized pricing, discounting, contract duration, renewal, churn, CAC, payback, and product-level gross margin.
    whyItMatters: Product breadth and transaction activity cannot establish recurring revenue quality or incremental profitability.
    diligencePath: >-
      Request cohort-level bookings, billings, recognized revenue, retention, sales cost, and gross margin by product,
      channel, geography, and deployment model.
