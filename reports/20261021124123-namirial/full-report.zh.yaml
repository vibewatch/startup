chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营版图
        blocks:
          - type: paragraph
            body: >-
              根据 Bain Capital 的收购公告，Namirial 于 2000
              年在意大利创立，总部位于意大利塞尼加利亚。公司产品覆盖电子签名流程、开户与数字身份编排、数字信任技术、合格电子归档、认证通信，以及面向企业、中小企业、专业人士和公共行政机构的电子发票。公司称自己是符合欧盟
              910/2014 号法规（eIDAS）的认可合格信托服务提供商；交易材料则称其业务覆盖 85 个以上国家，每天处理数百万笔交易。与 Signaturit 的合并将进一步加入身份验证、KYC
              与反欺诈、电子身份钱包、文档分析及相关信托服务。这些信息有力表明其是一个受监管的多产品平台，但来源没有提供经审计的产品级收入或留存数据。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: 管理层、所有权与治理
        blocks:
          - type: paragraph
            body: >-
              Max Pellegrini 自 2020 年起担任 Namirial CEO；创始人 Enrico Giacomelli 仍实质参与所有权安排和战略沟通。Bain Capital 于 2025 年 3
              月宣布已与 Ambienta 签署确定性协议，收购控股股权，但财务条款未披露；交易材料将 Bain、Ambienta、创始人和管理层列为利益相关方。拟议的 Signaturit 合并将引入 PSG Equity
              和 Signaturit 管理层作为重要少数股东，但仍需完成惯常审批与咨询程序。José Vallés 于 2026 年 4 月加入执行领导团队担任 CRO，向 Pellegrini
              汇报并负责收入职能。现有记录显示商业领导力和赞助方支持的治理得到加强，但完整董事会名单、表决协议、债务安排和继任计划均未披露。因此，关键人物依赖仍是尽调问题，而非已量化结论。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
