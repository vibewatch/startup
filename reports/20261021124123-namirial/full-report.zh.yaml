              运营模式将云服务、本地部署软件和信托服务运营结合起来，并跨越多个国家。这种广度可以支撑韧性和客户选择，但也增加了可靠性、安全、数据处理和服务等级可能出问题的接口数量。2025 年合并公告称，集团约有 1,400
              名员工和约 240,000 名全球客户；之后 ZeroComa 报道称员工超过 1,400 人、业务覆盖 90 多个国家，不同快照不应视为干净的增长序列。同一文章报告 2025 年营业额为 EUR270
              million、2026 年目标超过 EUR300 million，但指定证据中的这些数字未经审计。Trustpilot 存档页面显示“Average”评分为
              3.1/5，这是方向性的客户体验信号，不代表客户流失或可靠性。公开来源没有量化现金消耗、营运资金、毛利率、宕机频率、泄露历史或服务抵扣。投资者因此应跟踪整合里程碑，并独立核验任何增长叙事背后的财务和运营分母。
            claimRefs:
              - CR005
              - CR006
