      - number: '7.3'
        title: 合作伙伴、依赖与论点失效控制
        blocks:
          - type: paragraph
            body: >-
              Namirial 的扩张高度依赖收购、赞助方支持、伙伴渠道，以及整合相邻信托与交易产品的能力。PSG 公告称 Signaturit 将进入排他性谈判，但仍需监管审批和员工咨询，并将 PSG 与
              Signaturit 管理层带入合并后的所有权结构。公告还描述 Namirial 拥有国际覆盖和超过 1,000 个战略合作伙伴。2026 年 4 月的 CRO
              任命将全球增长和收入职能交给新任高管；这可能改善商业协同，但在复杂扩张阶段也形成执行检查点。ZeroComa
              创始人预计将继续参与并取得股权，这有助于保持连续性，同时也使关键人物和整合依赖更值得关注。最有价值的监测指标包括审批与整合完成情况、控制审计结果、服务可用性、按客户群划分的留存，以及收购后的现金转化。如果重大监管审批失败、整合未达到约定里程碑、客户投诉恶化却没有补救，或财务披露无法支持所述规模和增长，就应宣布投资论点失效。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 最大剩余风险敞口
            body: 最大的剩余风险并非某一宗已披露诉讼或宕机，而是受监管服务义务、多国整合和收购驱动增长叠加后，超过 Namirial 公开可见的控制能力与财务披露能力。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR013
          - type: callout
            title: 尽调优先事项
            body: 在对增长进行投资判断或给予低风险评级前，要求提供当前信托服务许可证及审计材料、事故与可用性历史、客户集中度与留存客户群、收购整合 KPI 和经审计财务报表。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
              - CR008
