      - number: '1.3'
        title: 资本事件、收购与未解的规模指标
        blocks:
          - type: paragraph
            body: >-
              Namirial 的已记录增长路径既依靠收购，也依靠内生增长。公开材料提到 Bain Capital 于 2025 年收购控股股权、2025 年 7 月宣布拟与 Signaturit
              合并，以及之后收购西班牙电子发票与电子通知服务商 ZeroComa。Il Sole 24 Ore 报道，2025 年营收为 €270 million、2026 年目标超过 €300 million、员工超过
              1,400 人、业务覆盖 90 多个国家，估值估计为 €1.1 billion；同一文章将估值归因于媒体报道，没有提供主要交易文件。Signaturit 合并后的页面称合并业务 2025 年营收为 €260
              million；Bain 的公告则称合并前 Namirial 约有 1,000 名员工和数千名客户。这些数字的公司口径或发布背景并不直接可比，不应合并成单一精确
              KPI。累计融资总额、当前估值、收入运行率、客户数和债务，在留存证据中仍未披露或相互冲突。
