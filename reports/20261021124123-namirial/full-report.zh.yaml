  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策框架与估值背景
        blocks:
          - type: paragraph
            body: >-
              建议立场为继续研究 / 跟踪，信心中等，投资判断风险高。Il Sole 24 Ore 报道 2025 年营业额为 €270 million，管理层目标是 2026 年超过 €300 million；2025
              年多数股权从 Ambienta 转给 Bain Capital 时，估值估计为 €1.1 billion。按 2025 年收入计算，报道中的估值约为 4.1
              倍收入，但这只是根据历史交易估值计算的分析师指标，不是当前企业价值倍数或可投资价格。公开来源没有披露
              EBITDA、净债务、经常性收入结构、留存、现金转化、优先权条款或新投资者当前可获得的价格。这些缺口使可辩护的股权价值区间或目标回报无法建立。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV016
      - number: '8.2'
        title: 论点、反论点与执行负担
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在已证明的收入规模、广泛的欧洲信托服务平台和持续整合之上。Signaturit 合并被描述为将形成约 1,400 名员工、240,000 名客户的集团；公司材料称 Signaturit
              的年度经常性收入在五年内增长超过十倍。Namirial 还任命首席营收官协调内生和非内生增长。反论点是，这是一个收购密集型平台，公开证据无法为其整合负担定价。Tracxn 的两页资料对 Namirial
              已完成六次还是七次收购意见不一；Il Sole 24 Ore 与交易顾问 Arcano 引用的 ZeroComa 客户数也不同。这些差异不是经营失败的证据，但说明在批准前，管理层数据必须取代公开信息拼接。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV016
      - number: '8.3'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景分析应保持条件性，不应赋予没有依据的概率或估值区间。乐观情景要求经审计证据证明收入增长能够转化为经常性毛利、留存和现金生成，同时整合不损害服务质量。基准情景只把 2025 年 €1.1 billion
              估值作为谈判参考：任何新价格都必须与当前净债务、EBITDA、经常性收入和完全摊薄后的所有权结构核对。悲观情景是估值倍数压缩叠加整合或收入目标落空，使公司成为公开流动性有限的赞助方持有型整合者。在这些输入缺失时，下行保护应来自价格纪律、优先权审查、治理权、基于里程碑的融资，或决定不投资。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: 尽调、退出准备与论点失效
        blocks:
          - type: paragraph
            body: >-
              最终尽调材料应包括经审计的 2024-2026 年财务数据、按产品和地域划分的月度经常性收入、毛利率和 EBITDA
              利润率、净债务、现金转化、留存客户群、收购购买会计、整合计分卡、完全摊薄资本表，以及所有优先权或管理层滚存安排。来源集通过 IDC 供应商简介证明独立分析师关注，但没有提供相关上市公司倍数集合或 IPO
              时间表证据。因此，论点失效触发条件应可量化：无法证明 2026
              年收入目标、经常性增长或留存明显收缩、整合延期、杠杆消除下行保护，或新资金排在未披露的优先权负担之后。退出投资判断应等到买方映射和赞助方流动性计划明确后再进行。
            claimRefs:
              - CV002
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 价格纪律优先于公司质量
            body: 可信的平台和历史交易估值不能证明当前入场价格有吸引力。只有在分母、杠杆、稀释和优先股堆叠得到证据支持，且报价能够带来所需的经风险调整下行保护回报后，才应推进。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV016
          - type: callout
            title: 不要平均相互冲突的公开数字
            body: 公开来源对收购次数和 ZeroComa 客户数存在分歧。在将其用于经营或整合模型前，应以管理层记录核对这些数据。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
