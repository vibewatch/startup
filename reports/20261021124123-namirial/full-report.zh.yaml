              收购增加了西班牙电子通知、发票和报告合规流程；Arcano 称交易完成仍需满足惯常条件。公开证据没有确认完整许可证登记、审计发现、未解决争议或收购后的控制整合，因此这些仍是尽调事项，不应假定为优势。
