        title: 对后续尽调的事实基准含义
        blocks:
          - type: paragraph
            body: >-
              证据支持这样一个判断：Namirial
              是一家已建立业务的欧洲信托服务平台，拥有较强监管资质、赞助方资本、多国分销能力和不断扩大的产品范围。主要分析约束在于披露质量：公司及赞助方公告提供了大量经营层面的公司口径，但估值、融资条款、经审计收入结构、客户集中度、董事会控制权和整合结果，在指定来源中均未披露。ZeroComa
              交易也说明本地监管与税务合规能力的价值，但收购价格和整合经济性仍未知。后续分析应区分 Namirial 单体指标、拟议合并指标和合并后的公司口径，不应把它们当成连续序列。
