    title: 竞争定位图
    type: quadrant
    summary: 有证据支持的序数定位图，将受监管信任服务广度与地域及分销触达分开；坐标是分析评分，不是市场份额测量。
    data:
      points:
        - label: Namirial
          x: 4
          'y': 3
          detail: 广泛的受监管信任服务组合和覆盖 85 个国家的业务有来源支持；评分为序数综合判断。
        - label: Signaturit
          x: 3
          'y': 3
          detail: 云端 DTM 广度和覆盖 40 多个国家的业务有来源支持；评分为序数综合判断。
        - label: ZeroComa
          x: 2
          'y': 1
          detail: 西班牙财政工作流专业服务商，拥有 550 多家客户；评分为序数综合判断。
        - label: DocuSign
          x: 3
          'y': 4
          detail: 全球规模这一说法和套件广度来自竞争对手编写的对比材料；未经独立基准验证。
        - label: Adobe Sign
          x: 2
          'y': 4
          detail: 仅出现在竞争对手编写的对比材料中；未保留独立的规模和受监管信任服务证据。
        - label: 内部自建
          x: 1
          'y': 1
          detail: 替代方案类别，并非经测量的公司；评分体现外部证据所支持的触达范围和信任服务广度较低。
      xAxis: 受监管信任服务与工作流广度（序数 1–4）
      yAxis: 地域 / 分销触达（序数 1–4）
    approximationNotes: 坐标是根据所引证据明确编制的序数评估，不是经过测量的市场份额、营收或能力评分。
    claimRefs:
      - CP002
      - CP005
      - CP006
      - CP007
      - CP008
  - id: FI001
    title: 有公开证据支持的收入模型桥接
    type: flow
    summary: 公开证据从客户工作流延伸到交付渠道，但定价、收入确认和毛利环节仍未披露。
    data:
      nodes:
        - id: customer-needs
          label: 受监管客户工作流
          detail: 身份、入驻、签名、认证通信、归档和开票
        - id: product-activity
          label: 产品活动
          detail: 软件使用、信任服务、集成和交易处理
        - id: deployment
          label: 交付模式
          detail: 云服务、本地部署软件和可信服务运营
        - id: channels
          label: 商业渠道
          detail: 直接和间接分销
        - id: monetization
          label: 变现条款不可得
          detail: 没有公开的定价依据、合同组合或实际折扣证据
        - id: recognized-revenue
          label: 已确认收入
          detail: 营收已有报道，但产品与自然增长 / 收购增长的构成不可得
        - id: gross-profit
          label: 毛利不可得
          detail: 没有公开的服务成本或毛利率桥接
    approximationNotes: 这是定性序列，不是转化漏斗或定量瀑布图；不推断价格、转化率或利润率。
    claimRefs:
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Namirial 的公开产品和运营层，将客户工作流连接到信任服务、记录、韧性认证基础设施及新兴数据生态。
    data:
      layers:
        - label: 客户工作流
          detail: 组织发起数字交易的入口
          items:
            - label: 入驻与身份
              detail: 客户与签署人身份识别
            - label: 协议自动化
              detail: 文档路由与电子签名编排
            - label: 开票与通信
              detail: 电子开票、认证通信和税务通知
        - label: 信任服务
          detail: 合格身份、签名、认证和记录
          items:
            - label: 合格签名
              detail: 合格签名与远程签名服务
            - label: 认证机构
              detail: 信任服务与证书运营
            - label: 归档与时间戳
              detail: 合格的长期记录与时间证据
        - label: 身份与访问
          detail: 经验证的组织、用户和基于角色的权限
          items:
            - label: 数字身份
              detail: 身份验证与可信凭证
            - label: 基于角色的访问
              detail: 对工作流和生命周期数据的授权访问
        - label: 数据与生命周期
          detail: 结构化产品与交易信息
          items:
            - label: DPP 注册接口
              detail: 产品标识、注册和基于角色的访问
            - label: 供应链事件
              detail: 经授权运营方更新生命周期信息
        - label: 可用性
          detail: 连续性与灾难恢复基础设施
          items:
            - label: 主要运营
              detail: 认证机构日常工作负载
            - label: 灾难恢复
              detail: 二级数据中心恢复模式
        - label: 创新
          detail: 新兴能力与功能开发
          items:
            - label: 双 CA 连续性
              detail: 主数据中心与灾难恢复数据中心
            - label: AI 功能开发
              detail: 为 eSignAnyWhere 进行 Amazon Bedrock 实验
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 从细分市场进入到扩张的客户旅程
    type: journey-map
    summary: Namirial 披露的客户旅程从面向细分市场的入口产品开始，经过受监管工作流部署，再到潜在的跨产品或地域扩张；留存证据仍未解决。
    data:
      items:
        - index: 1
          label: 进入细分市场
          detail: 面向企业 / 公共管理部门的编排方案，或面向中小企业 / 专业人士的标准化产品与产品驱动增长入口
          value: Multiple segments
          note: 入口路径由公司描述；未披露转化率
        - index: 2
          label: 采用受监管工作流
          detail: 入驻、电子签名、身份、认证通信、归档或电子开票
          value: Several million transactions daily reported
          note: 吞吐量不是客户层面的使用分母
        - index: 3
          label: 平台扩张
          detail: 相邻产品、战略合作伙伴、收购及跨境运营布局
          value: '>1,000 strategic partners reported'
          note: 合作伙伴数量不能证明合作伙伴来源收入或交叉销售
        - index: 4
          label: 持续账户价值
          detail: 续约、重复使用、扩张及集中度可见性
          value: Not disclosed
          note: NRR、GRR、流失率、客户群组和集中度证据仍是尽调缺口
        - label: 参考验证
          detail: 具名客户参考、采购记录及客户编写的成果
          value: Not disclosed
          note: 汇总数量和预览用户不能证明独立的生产环境客户参考
        - label: 集中度审查
          detail: 头部客户营收、合作伙伴来源占比、细分市场组合及地域集中度
          value: Not disclosed
          note: 覆盖范围广，仍可能存在重大的对手方依赖
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当受监管义务与收购驱动的运营复杂性相遇，而公开披露又不完整时，剩余风险最高。
    data:
      columns:
        - 可能性
        - 剩余严重性
      rows:
        - label: eIDAS 与信任服务合规
          values:
            - 中
            - 高
        - label: 欧盟数字身份框架变化
          values:
            - 中
            - 中高
        - label: 多国可靠性
          values:
            - 中
            - 高
        - label: 收购整合
          values:
            - 中高
            - 高
        - label: 财务模型不透明
          values:
            - 中
            - 高
        - label: 合作伙伴集中度
          values:
            - 高
            - 中高
    approximationNotes: 可能性和剩余严重性是根据指定证据作出的定性分析师分类，不是经测量的概率。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR010
      - CR011
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从报道的规模出发，经由整合与披露检验，最终形成有条件的继续研究立场。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 报道的 2025 年 €270m 营收
        - id: historical-mark
          label: 历史交易估值
          detail: 报道的 2025 年 €1.1bn 估值
        - id: expansion
          label: 平台扩张
          detail: Signaturit 合并与持续收购
        - id: quality-test
          label: 盈利质量检验
          detail: 需要验证经常性收入组合、留存率、利润率和现金转换
        - id: ownership-test
          label: 所有权与下行检验
          detail: 需要核实净债务、稀释、优先权安排和治理
        - id: decision
          label: 继续研究 / 跟踪
          detail: 基于当前公开证据，不提出具体价格的买入建议
    approximationNotes: 该有序流程为定性分析，不赋予概率、估值权重或转化率。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV015
      - CV016
