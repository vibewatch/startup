  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与需求结构
        blocks:
          - type: paragraph
            body: >-
              相关市场是数字交易管理（DTM）及其相邻的数字信任服务，包括电子签名、身份验证与开户、认证通信、合格归档、电子发票和工作流编排。市场边界涵盖将基于文档或身份的交易转化为安全电子流程的软件与信托服务运营。它不包括一般文档存储、通用企业内容管理、纸质流程外包和无关的网络安全支出。HTF
              将 DTM 描述为面向文档交易的云服务，并明确纳入但不限于电子签名。Namirial
              自己的行业页面将产品定位于银行、保险、医疗、公共服务、零售、物流及其他垂直行业，因此买方范围跨行业，而不是单一垂直预算。现状替代方案仍包括纸质流程、人工核验、电子邮件和电子表格流程、内部开发，以及只购买某一个环节的点状产品。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: 市场规模证据与局限
        blocks:
          - type: paragraph
            body: >-
              公开规模证据只能提供方向，无法形成干净的 Namirial TAM/SAM/SOM 桥接。HTF 2023 年 4 月的联合研究称，全球 DTM 市场规模为 USD 8.009 billion，2023–2029
              年 CAGR 为 25.39%，但同时给出格式错误的“USD -8.0099
              Billion”增量；这一矛盾显著降低了把该新闻稿当作精确预测的可信度。其按软件、硬件、服务、企业规模、行业和地域划分的结构可用于绘制市场地图，但没有披露 Namirial 可服务的细分市场。IDC
              的供应商简介将需求描述为跨行业可信且安全的数字签名流程，并把 eIDAS 2.0 同时视为挑战与机会。Namirial 的分析师页面称 Aragon 于 2026 年评估了 19 家全球 DTM
              供应商，但供应商是否入选及是否处于领导者位置，不等于市场规模或份额。因此，证据支持多种观察视角——品类支出、受监管信托流程以及垂直/地域扩张——而不是精确 SOM。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
      - number: '2.3'
        title: 买方、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              来源支持的买方包括金融机构、企业、专业人士和公共行政机构；Namirial
              自身定位还覆盖零售、医疗、房地产、物流、公用事业及其他垂直领域。公开材料没有说明每种流程的确切预算负责人、采购周期、实施成本或付款方，因此这些字段仍是尽调缺口，不应假定为组织事实。采用驱动因素更清晰：2025 年
              Namirial-Signaturit 公告提到持续数字化，以及更严格的欧洲合规与安全要求；Il Sole 24 Ore 则将 ZeroComa
              交易与西班牙税务合规数字化和强制电子发票联系起来。约束同样明显：HTF 警告各地区法律不同，IDC 将 eIDAS 2.0
              同时定位为挑战与机会。因此，监管是双向因素：它为具备法律效力的流程创造需求，也提高进入每个国家市场的本地化和合规负担。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 品类增长可信，但尚无法衡量捕获
            body: 证据支持合规数字流程存在结构性需求，但现有公开材料无法证明 Namirial 的 SAM、SOM、定价、赢单率或份额。因此，估值工作应评估客户和地域层面的渗透率，而不是把联合研究的全球 CAGR 资本化。
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM014
          - type: callout
            title: 监管复杂度既是护城河，也是摩擦
            body: 合规为合格信托服务创造需求，同时提高国家扩张、产品认证、系统集成和持续证据收集的成本与周期。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与规模
        blocks:
          - type: paragraph
            body: >-
              相关市场比单独的电子签名更广。Namirial 将自己描述为端到端数字交易管理平台，覆盖开户、身份编排、电子签名流程、信任技术、认证通信、合格归档和电子发票。2025 年合并公告将 Signaturit
              描述为相邻的云 DTM 服务商，拥有身份管理、数字签名、KYC 与反欺诈以及电子身份钱包；Namirial 则带来强大的意大利基础、覆盖 85 个国家的业务，以及面向企业、中小企业和专业人士的定位。这种广度既与
              Signaturit 及 DocuSign、Adobe Sign 等全球套件直接重叠，也让 Namirial 面对专业身份服务、发票、税务合规和内部开发等替代方案。ZeroComa
              展现出相邻扩张路径：其西班牙业务组合覆盖公共机构通知、发票和税务申报，据其顾问称服务超过 550 名客户。收购价值未披露，因此可观察到范围扩张，但无法观察其投入资本回报率。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP014
      - number: '3.2'
        title: 面向买方的能力与定位
        blocks:
          - type: paragraph
            body: >-
              买方似乎在综合信任平台、区域专业服务商、全球横向套件和点状方案之间做选择。当合格信托服务、欧洲监管能力和多个交易阶段需要同时满足时，Namirial 的防守位置最强；2025 年公告称其依据 eIDAS
              获得合格信托服务提供商资质，并每天处理数百万笔交易。Signaturit 是直接相邻的同业，提供云 DTM、KYC、反欺诈及电子身份钱包能力；ZeroComa 则增加了西班牙税务流程深度。某竞争对手撰写的对比将
              DocuSign 描述为规模更大、全球化程度更高，但其定价、功能和合规口径不是独立基准，不应视为已验证事实。公开证据无法证明 Namirial 的实际定价、折扣、实施时间、留存或赢单率。             
              买方需要围绕保证等级、国家覆盖、集成、数据驻留、流程深度和总成本开展概念验证（PoC），而不是宣称产品处处更优。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 护城河持久性、切换与替代
        blocks:
          - type: paragraph
            body: >-
              潜在护城河来自受监管信托服务资质、积累的集成、本地运营知识和不断扩大的安装基数的组合，而非某一项软件功能。2025 年公告称 Namirial 约有 1,000 名员工、1,000
              多个战略合作伙伴、数千名客户及每日数百万笔交易；这些数字由公司提供，留存材料中没有独立审计。Signaturit 交易将增加规模和相邻能力，但公告时仍需监管审批和员工咨询。Namirial 于 2026 年 4
              月任命
              CRO，表明公司明确推动商业表现优化以及内生和非内生增长；这可能强化分销，同时增加整合与执行要求。切换成本、多平台使用、合作伙伴集中度和内部开发经济性均未披露。主要不利情景是基础签名商品化，并被捆绑式全球套件或本地合规专家替代；留存来源没有中立的赢单/失单研究或经验证的定价比较来化解这一风险。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP014
      - number: '3.4'
        title: 证据缺口
        blocks:
          - type: paragraph
            body: >-
