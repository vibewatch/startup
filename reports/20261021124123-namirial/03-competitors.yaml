        - {label: Signaturit, x: 3, y: 3, detail: "Cloud DTM breadth and 40+ country reach are source-backed; scores are ordinal synthesis."}
        - {label: ZeroComa, x: 2, y: 1, detail: "Spanish fiscal workflow specialist with 550+ customers; scores are ordinal synthesis."}
