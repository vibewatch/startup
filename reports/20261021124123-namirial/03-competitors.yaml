        - {label: Internal build, x: 1, y: 1, detail: "Substitute category, not a measured company; score expresses lower externally evidenced reach and trust-service breadth."}
      xAxis: "Regulated-trust and workflow breadth (ordinal 1–4)"
      yAxis: "Geographic / distribution reach (ordinal 1–4)"
    approximationNotes: "Coordinates are explicitly authored ordinal assessments from the cited evidence, not measured market shares, revenue, or capability scores."
    claimRefs: [CP002, CP005, CP006, CP007, CP008]
callouts:
  - calloutType: strength
    title: Breadth plus regulated trust
    body: "Namirial's strongest visible differentiation is the combination of a broad transaction stack with qualified trust-service credentials and European operating reach."
    claimRefs: [CP001, CP002, CP005]
  - calloutType: risk
    title: Quantitative competitive proof is missing
    body: "Pricing, retention, win rates, switching costs, and independent benchmark evidence are not disclosed in the retained source set, limiting confidence in moat durability."
    claimRefs: [CP009, CP014]
  - calloutType: recommendation
    title: Underwrite through a like-for-like proof of concept
    body: "Compare Namirial, Signaturit, and at least one global suite on assurance level, country coverage, integration effort, realized cost, and customer references before treating platform breadth as durable advantage."
    claimRefs: [CP008, CP014]
