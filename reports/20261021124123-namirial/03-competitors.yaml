      - [Fiscal and public-authority workflows, "Electronic invoicing and certified communications in portfolio", "Not established", "e-notifications, e-invoicing and e-reporting", "Not established", "ZeroComa evidence is strongest; other cells are unknown"]
      - [Geographic reach and channels, "85 countries; 1,000+ strategic partners stated in release", "40+ countries and 90,000+ customers stated in release", "Spain-focused", "Global reach claim is competitor-authored", "Reported scope, not comparable market share"]
    notes: "Cells marked Not established or unknown are evidence gaps, not negative capability findings. The comparison is directional because sources use different definitions and issuers."
    claimRefs: [CP002, CP005, CP006, CP007, CP008]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Public price or contract model, Included capability evidence, Switching / lock-in signal, Diligence implication]
    rows:
      - [Namirial, "Quote-based pricing; no verified list price retained", "Modular trust, identity, transaction, archive, communication and invoicing portfolio", "Regulated workflows and integrations may create operational switching costs; not measured", "Request realized price, implementation fees, renewal, and migration data"]
      - [Signaturit, "No verified list price retained", "Cloud DTM, identity, signature, KYC/fraud prevention and eID wallet", "Cloud workflow and adjacent product overlap; retention and migration data unavailable", "Compare cohorts, API compatibility, and overlap after combination"]
      - [DocuSign / global suites, "Competitor-authored comparison cites tiered monthly prices; not independently verified", "Global signing and contract-management capabilities asserted by comparison source", "Potential suite bundling and global distribution; customer switching data unavailable", "Run like-for-like volume and compliance proof of concept"]
      - [Internal build / status quo, "No public price; labor, infrastructure, certification and legal costs unknown", "Can be tailored to internal workflow", "Data and process control may increase lock-in to internal systems", "Model total cost of ownership and compliance liability"]
    notes: "No retained source supplies comparable realized prices, discounts, transaction volumes, renewal terms, or switching costs; all such fields remain diligence asks."
    claimRefs: [CP009, CP014]
