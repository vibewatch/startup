chapter:
  number: 6
  title: Customers
  summary: Namirial discloses a broad enterprise, public-administration, SME, and professional customer model, with international reach and several scale indicators, but the assigned evidence is materially stronger on customer populations and product use cases than on retention, net expansion, or customer-level outcomes. Recent acquisitions add adoption and integration potential while also increasing the need to verify production deployment and concentration by cohort.
sections:
  - id: customer-segmentation
    title: Buyer, user, and customer segments
    body: Namirial serves distinct customer groups rather than one homogeneous buyer population. Its own LinkedIn profile describes end-to-end orchestration for enterprises and central public administrations, while positioning off-the-shelf products and a product-led-growth model for professionals, SMEs, and local public administrations. The same source identifies a network of business partners and customers across Europe, America, and Asia, and lists regulated workflows such as identity, signatures, archiving, and certified communications. The 2025 Namirial-Signaturit transaction announcement adds a cross-border customer base and a combined platform thesis, but its approximately 240,000-customer figure is for the combined group rather than Namirial alone. This supports segment breadth and international distribution, not a verified Namirial-only active-account count, revenue mix, or payer-versus-user split.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and customer proof
    body: "The evidence supports several adoption surfaces: Namirial reports thousands of customers worldwide and several million transactions processed every day in the 2025 transaction announcement, while LinkedIn reports approximately 1,400 professionals and more than 29,000 followers as company-scale signals. The AWS case study is stronger product-use evidence than a logo list: Namirial built a document-summarization feature and an intelligent assistant for eSignAnywhere, launched them to preview users within weeks, and reports that more than 130 engineers use generative-AI tools. ZeroComa adds a distinct Spanish compliance cohort, with more than 550 customers in Arcano's transaction description and more than 650 in the company's acquisition announcement as reproduced by Il Sole 24 Ore. These figures are not directly comparable: some are combined-group, acquired-company, employee, or platform-adoption measures, and none establishes Namirial customer retention or paid production usage."
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration diligence
    body: The assigned sources describe growth ambitions, acquisitions, adjacent products, and international expansion, but they do not disclose Namirial NRR, GRR, logo churn, renewal rates, contract lengths, cohort retention, customer concentration, or a verified revenue split by segment. The Signaturit announcement reports that Signaturit's ARR grew more than tenfold over five years, but that is a Signaturit metric and cannot be transferred to Namirial. Similarly, the ZeroComa customer count describes an acquired Spanish provider and does not prove cross-sell or post-close retention in the Namirial base. Namirial's commercial model therefore has credible expansion surfaces—regulated workflows, product adjacency, partner distribution, and geographic breadth—but the investment case remains dependent on customer-level evidence showing production status, recurring economics, renewal durability, and concentration.
    claimRefs: [CU012, CU013, CU014, CU015]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Broad segment coverage
    body: Namirial explicitly targets enterprises, public administrations, professionals, and SMEs, with both integrated and off-the-shelf routes to adoption.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Retention is not disclosed
    body: No assigned source provides Namirial NRR, GRR, churn, renewal, cohort, or customer-concentration data; these remain material diligence gaps rather than negative estimates.
    claimRefs: [CU012, CU013, CU014]
  - calloutType: recommendation
    title: Verify production cohorts
    body: Request a customer-level bridge separating active paid accounts, pilots, acquired-company customers, partner-referred accounts, renewal cohorts, and top-customer revenue concentration.
    claimRefs: [CU015]
