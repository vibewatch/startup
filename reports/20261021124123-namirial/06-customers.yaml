  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: "Namirial NRR, GRR, churn, renewal, contract length, cohort retention, and customer satisfaction metrics with definitions and periods."
      whyItMatters: "Without durability metrics, broad customer and transaction counts cannot establish recurring revenue quality or expansion."
      diligencePath: "Request monthly recurring-revenue cohorts, gross and net retention bridges, logo churn, renewal rates, contract terms, and the denominator for every reported retention metric."
      relatedQuestionRefs: [QU006, QU007, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof
      missingEvidence: "At least three independently verifiable named customer deployments with production status, use case, outcome, and date."
      whyItMatters: "The assigned sources show product and acquired-cohort evidence but do not provide a sufficiently independent named-customer reference set."
      diligencePath: "Obtain customer-approved references, procurement records, or customer-authored announcements that distinguish production deployments from pilots."
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-10 customer revenue share, segment revenue mix, partner-sourced share, and geographic concentration."
      whyItMatters: "A wide logo or account footprint can coexist with material dependence on a small number of customers, partners, or public-sector contracts."
      diligencePath: "Request a concentration schedule by customer, segment, geography, partner channel, contract value, renewal date, and share of revenue or ARR."
      relatedQuestionRefs: [QU009, QU007]
    - type: conflicting-data
      severity: minor
      topic: acquired-cohort
      missingEvidence: "A reconciled ZeroComa customer count and a definition of customers served, active, contracted, or billed."
      whyItMatters: "The more-than-550 and more-than-650 figures may reflect different dates or denominators and should not be combined."
      diligencePath: "Confirm the acquisition-date customer register and reconcile active, contracted, and billed accounts."
      relatedQuestionRefs: [QU003, QU010]
