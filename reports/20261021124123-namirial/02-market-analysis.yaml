        - label: Namirial industry categories
          value: 15
          unit: categories
          tone: neutral
          note: "Count of categories displayed on the official industries page"
          claimRefs: [CM009]
        - label: Namirial SOM
          value: null
          unit: null
          tone: neutral
          note: "Not publicly isolated; requires customer, revenue, pricing, and geography data"
          claimRefs: [CM014]
    approximationNotes: >-
      This is an ordered evidence lens, not a proportional TAM/SAM/SOM calculation.
      Values retain their source units and populations; the category estimate, vendor
      count, geography count, and industry count must not be combined arithmetically.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM014, CM015]
