  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gaps
      missingEvidence: Namirial revenue by product, geography, customer segment, and recurring versus transactional mix.
      whyItMatters: Without company-level revenue and penetration denominators, the global category estimate cannot be converted into SAM, SOM, or a valuation-relevant share trajectory.
      diligencePath: Request a product-by-geography revenue bridge, customer cohort file, pricing and contract mix, win-loss data, and management's bottom-up SAM/SOM model.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: sizing-limitations
      missingEvidence: A primary or independently reproducible DTM market forecast that reconciles the reported 8.009 billion value, 25.39% CAGR, and negative increase.
      whyItMatters: The arithmetic inconsistency can materially distort growth expectations and prevents reliable use of the syndicated estimate as a valuation anchor.
      diligencePath: Obtain the underlying HTF methodology or replace it with transparent analyst, regulatory, or industry-association data using a common definition and period.
      relatedQuestionRefs: [QM002, QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-segments
      missingEvidence: Customer-level evidence tying each priority vertical to budget owner, purchase cycle, deployment model, and realized ROI.
      whyItMatters: An industry coverage page establishes breadth but not willingness to pay, conversion, retention, or the timing of adoption.
      diligencePath: Sample contracts and case studies by vertical, including buyer persona, ACV or transaction economics, implementation duration, renewal, and expansion.
      relatedQuestionRefs: [QM004, QM006]
      relatedTableRefs: [TM003]
    - type: stale
      severity: minor
      topic: market-size
      missingEvidence: A current 2026 market estimate with the same boundary as the 2023–2029 HTF forecast.
      whyItMatters: The run date is 2026, so an older estimate may not reflect regulatory implementation, consolidation, or AI-enabled product changes.
      diligencePath: Purchase or obtain a current analyst or industry-association forecast and document its inclusion, exclusion, geography, and currency basis.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
