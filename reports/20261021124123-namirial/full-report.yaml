  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risk or probability signal
    rows:
      - - Bull
        - 2026 revenue exceeds €300m; recurring growth, retention, margins, and integration are validated
        - Supportable only after audited earnings and cash conversion establish the multiple denominator
        - 'Signal: target delivery plus clean cohort and integration evidence'
      - - Base
        - Revenue scales but integration consumes part of the benefit
        - Anchor negotiations to the reported 2025 mark and adjust for current net debt, dilution, and earnings quality
        - 'Signal: stable growth with mixed synergy realization'
      - - Bear
        - Revenue target misses, retention weakens, or leverage and preferences absorb equity value
        - Require a material price reset, contractual downside protection, or decline the investment
        - 'Signal: target miss, integration slippage, or undisclosed senior claims'
    notes: >-
      No numeric probability, equity-value range, or target return is assigned because current EBITDA, net debt,
      cap-table, preference, and entry-price evidence is unavailable.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV009
      - CV010
