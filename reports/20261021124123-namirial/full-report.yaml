  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand architecture
        blocks:
          - type: paragraph
            body: >-
              The relevant market is digital transaction management (DTM) and its adjacent digital trust services:
              electronic signatures, identity verification and onboarding, certified communications, qualified
              archiving, e-invoicing, and workflow orchestration. The boundary includes software and trust-service
              operations that convert document-based or identity-dependent transactions into secure electronic
              workflows. It excludes general document storage, generic enterprise content management, paper-process
              outsourcing, and unrelated cybersecurity spend. HTF describes DTM as cloud services for document-based
              transactions and explicitly includes, but is not limited to, electronic signatures. Namirial's own
              industry page positions the product across banking, insurance, healthcare, public services, retail,
              logistics, and other verticals, so the buyer universe is cross-industry rather than a single vertical
              budget. Status-quo substitutes remain paper, manual verification, email and spreadsheet workflows,
              internal builds, and point products purchased for only one step.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: Sizing evidence and limits
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is directional rather than a clean Namirial TAM/SAM/SOM bridge. HTF's April 2023
              syndicated study describes a global DTM market value of USD 8.009 billion and a 25.39% CAGR for 2023–2029,
              while also presenting a malformed "USD -8.0099 Billion" increase; the inconsistency materially lowers
              confidence in using the release as a precise forecast. Its segmentation by software, hardware, services,
              enterprise size, industry, and geography is useful for a market map but does not disclose Namirial's
              serviceable slice. IDC's vendor-profile description frames demand around trusted and secure digital
              signing workflows across industries and identifies eIDAS 2.0 as both challenge and opportunity. Namirial's
              analyst page reports that Aragon evaluated 19 global DTM vendors in 2026, but vendor inclusion and a
              leader placement are not market size or share. The evidence therefore supports multiple lenses—category
              spend, regulated trust workflows, and vertical/territorial expansion—not a precise SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The source-backed buyer set includes financial institutions, enterprises, professionals, and public
              administrations, while Namirial's own positioning extends across retail, healthcare, real estate,
              logistics, utilities, and other verticals. The public material does not identify the precise budget owner,
              purchase cycle, implementation cost, or payer for each workflow, so those fields remain diligence gaps
              rather than assumed organizational facts. Adoption drivers are clearer: the 2025 Namirial-Signaturit
              announcement cites continuous digitization and stronger European compliance and security requirements,
              while Il Sole 24 Ore links the ZeroComa transaction to Spanish tax-compliance digitization and mandatory
              electronic invoicing. Constraints are also visible in HTF's warning that laws vary regionally and IDC's
              framing of eIDAS 2.0 as both a challenge and an opportunity. This makes regulation a two-sided factor: it
              creates demand for legally valid workflows but raises the localization and compliance burden of entering
              each national market.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is credible; capture is not yet measurable
            body: >-
              The evidence supports structural demand for compliant digital workflows, but the available public material
              does not establish Namirial's SAM, SOM, pricing, win rate, or share. Valuation work should therefore
              underwrite customer and geography-level penetration rather than capitalize a syndicated global CAGR.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM014
          - type: callout
            title: Regulatory complexity is both moat and friction
            body: >-
              Compliance creates demand for qualified trust services while increasing the cost and duration of country
              expansion, product certification, integration, and ongoing evidence collection.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than standalone e-signature. Namirial describes an end-to-end digital
              transaction management proposition spanning onboarding, identity orchestration, e-signature workflows,
              trust technologies, certified communications, qualified archiving, and electronic invoicing. The 2025
              combination announcement presents Signaturit as an adjacent cloud DTM provider with identity management,
              digital signature, KYC and fraud prevention, and an eID wallet, while Namirial brings a strong Italian
              base, operations across 85 countries, and a stated enterprise, SME, and professional focus. That breadth
              creates direct overlap with Signaturit and with global suites such as DocuSign and Adobe Sign, but also
              puts Namirial against specialized identity, invoicing, tax-compliance, and internal-build alternatives.
              ZeroComa illustrates the adjacency strategy: its Spanish portfolio covered public-authority notifications,
              invoicing, and tax reporting and served more than 550 customers according to its adviser. The acquisition
              value was undisclosed, so breadth expansion is observable but its return on invested capital is not.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP014
      - number: '3.2'
        title: Buyer-facing capability and positioning
        blocks:
          - type: paragraph
            body: >-
              Buyers appear to choose among integrated trust platforms, regional specialists, global horizontal suites,
              and point solutions. Namirial's defensible position is strongest where qualified trust services, European
              regulatory posture, and multiple transaction stages matter together; the 2025 announcement says it is
              accredited as a qualified trust service provider under eIDAS and processes several million transactions
              daily. Signaturit is a direct adjacent peer with cloud DTM, KYC, fraud prevention, and eID-wallet
              capabilities, while ZeroComa adds Spanish fiscal workflow depth. A competitor-authored comparison frames
              DocuSign as larger and more globally scaled, but its pricing, feature, and compliance assertions are not
              independent benchmarks and should not be treated as verified. Public evidence does not establish
              Namirial's realized pricing, discounting, implementation time, retention, or win rate. The buyer
              implication is a proof-of-concept comparison around assurance level, country coverage, integrations, data
              residency, workflow depth, and total cost rather than a claim of universal product superiority.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Moat durability, switching, and displacement
        blocks:
          - type: paragraph
            body: >-
              The potential moat is a combination of regulated trust-service status, accumulated integrations, local
              operating knowledge, and a growing installed base rather than a single software feature. The 2025 release
              describes approximately 1,000 employees, more than 1,000 strategic partners, thousands of customers, and
              several million daily transactions for Namirial; these figures are company-provided and not independently
              audited in the retained material. The Signaturit transaction would add scale and adjacent capabilities,
              but it remained subject to regulatory approvals and employee consultation when announced. Namirial's CRO
              appointment in April 2026 indicates an explicit push to optimize commercial performance and pursue organic
              and non-organic growth, which may strengthen distribution while increasing integration and execution
              demands. Switching costs, multi-homing, partner concentration, and internal-build economics are not
              disclosed. The main adverse case is commoditization of basic signing and displacement by bundled global
              suites or local compliance specialists; no retained source supplies a neutral win-loss study or a verified
              pricing comparison to resolve that risk.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP014
      - number: '3.4'
        title: Evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The public record is sufficient to map named alternatives and strategic adjacency, but not to underwrite
              competitive durability quantitatively. In particular, the evidence does not provide comparable realized
              price per transaction, gross retention, net retention, implementation cost, share by country, competitive
              win rates, or customer-level reasons for churn. A diligence process should request cohort retention and
              win-loss data by segment, a product and compliance feature matrix validated by customers, partner
              concentration and channel economics, and a country-by-country migration plan for the combined platform.
            claimRefs:
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth plus regulated trust
            body: >-
              Namirial's strongest visible differentiation is the combination of a broad transaction stack with
              qualified trust-service credentials and European operating reach.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: callout
            title: Quantitative competitive proof is missing
            body: >-
              Pricing, retention, win rates, switching costs, and independent benchmark evidence are not disclosed in
              the retained source set, limiting confidence in moat durability.
            calloutType: risk
            claimRefs:
              - CP009
              - CP014
          - type: callout
            title: Underwrite through a like-for-like proof of concept
            body: >-
              Compare Namirial, Signaturit, and at least one global suite on assurance level, country coverage,
              integration effort, realized cost, and customer references before treating platform breadth as durable
              advantage.
            calloutType: recommendation
            claimRefs:
              - CP008
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue scale is visible, but its composition is not
        blocks:
          - type: paragraph
            body: >-
              Il Sole 24 Ore reported EUR270 million of turnover for 2025 and a management target above EUR300 million
              for 2026. That is the strongest current revenue evidence in the assigned pool, but it is not an audited
              series and does not separate organic growth from acquisitions. Namirial's 2020 announcement supplies a
              historical anchor of EUR50 million of FY2019 revenue and says its digital-transaction-management business
              had grown at more than 30% CAGR. Product disclosures identify e-signature, identity, onboarding, certified
              communication, archiving, invoicing, and workflow offerings; they do not disclose revenue by product,
              geography, customer segment, deployment model, or recurring versus transactional basis. Signaturit's
              reported ARR growth belongs to the acquisition target, not to Namirial or the combined group, so it cannot
              be used as a group ARR proxy.
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI014
      - number: '4.2'
        title: Commercial reach is clearer than pricing or sales efficiency
        blocks:
          - type: paragraph
            body: >-
              The evidence supports multiple delivery and distribution paths: Namirial has described direct and indirect
              channels, while transaction material also describes cloud services, on-premise software, and
              trusted-service operations. Those surfaces could support licenses, subscriptions, usage charges,
              implementation work, or managed-service fees, but none of the retained sources states the realized
              contract mix or price basis. The April 2026 CRO appointment explicitly covers commercial performance, new
              business, and alignment of revenue-generating functions, indicating that go-to-market execution is a
              management priority. It does not provide sales-cycle length, customer-acquisition cost, payback,
              retention, discounting, partner commissions, or channel contribution. These missing inputs prevent a
              defensible bridge from customer activity to recognized revenue.
            claimRefs:
              - CI002
              - CI003
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI015
      - number: '4.3'
        title: Operating leverage cannot be inferred from volume alone
        blocks:
          - type: paragraph
            body: >-
              Transaction and customer counts demonstrate operating breadth, not profitability. The July 2025
              combination announcement described roughly 1,400 employees and 240,000 customers for the proposed combined
              Namirial-Signaturit group. ZeroComa reporting is less consistent: its financial adviser said more than 550
              customers, while Il Sole 24 Ore said over 650 clients. Different dates or definitions may explain the gap,
              but the sources do not reconcile them. More importantly, no retained source provides hosting expense,
              trust-service operating cost, implementation labor, support burden, gross margin, working capital, or
              capital expenditure. Customer, employee, transaction, and revenue figures therefore should not be combined
              into productivity or margin ratios without a common perimeter and period.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
              - CI015
      - number: '4.4'
        title: Sponsor backing does not establish operating liquidity
        blocks:
          - type: paragraph
            body: >-
              The 2025 combination material described Bain Capital, Ambienta, Namirial's founder and management as
              shareholders, with PSG and Signaturit management expected to reinvest alongside them. That structure
              signals institutional support and an acquisition-led strategy, but funding raised or sponsor participation
              is not cash available to the company. Il Sole 24 Ore reported an estimated EUR1.1 billion valuation for
              the 2025 majority-stake transfer and said the ZeroComa purchase price was undisclosed. No retained source
              states current cash, net debt, credit facilities, covenant headroom, burn, runway, acquisition financing,
              planned use of funds, or a next-round trigger. Financial diligence should therefore treat scale as
              credible but revenue quality, margin durability, and capital adequacy as unproven until management
              supplies audited and cohort-level evidence.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Material reported scale
            body: >-
              Independent reporting indicates EUR270 million of 2025 turnover and a management target above EUR300
              million in 2026, while the product set spans several regulated transaction workflows.
            calloutType: strength
            claimRefs:
              - CI001
              - CI006
              - CI007
          - type: callout
            title: Scale is not cash conversion
            body: >-
              The assigned public evidence does not disclose gross margin, cash, debt, burn, runway, realized pricing,
              CAC, or payback, so reported turnover cannot establish capital adequacy.
            calloutType: risk
            claimRefs:
              - CI015
          - type: callout
            title: Make operating evidence a financing prerequisite
            body: >-
              Require audited accounts, an organic-acquired revenue bridge, product-level margins, customer cohorts,
              channel economics, and a debt-and-cash-flow package before underwriting valuation.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI012
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Namirial's product is best understood as a regulated digital-process layer rather than a single signing
              application. The available product documentation describes Digital Transaction Management as capturing
              legally compliant electronic signatures, managing and tracking document flows, and supporting on-premise,
              cloud, or hybrid deployment. The broader group portfolio adds customer onboarding, digital identity
              orchestration, certified communications, qualified archiving, and electronic invoicing. This breadth
              supports workflows in which a customer is identified, a document or transaction is routed for approval,
              signatures and evidence are collected, and records are retained under applicable trust-service rules. The
              acquired ZeroComa capability extends the workflow into Spanish electronic invoicing, public-authority
              notifications, and tax reporting. That product adjacency is strategically useful, but the public record
              does not establish how deeply the modules share data models, administration, pricing, or service-level
              commitments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE008
              - CE009
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE008
              - CE009
              - CE012
      - number: '5.2'
        title: Architecture, trust controls, and resilience
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a multi-layer operating architecture: customer-facing cloud and on-premise or
              hybrid workflow products sit above identity, signature, trust-service, and archival capabilities. The
              historical DTM material identifies eSignAnyWhere, biometric and HTML5 signing options, remote signatures,
              qualified timestamps, and digital archiving as components of the operating model. Namirial's current
              continuity page describes two equivalent Qualified Certification Authorities, each with a primary and
              disaster-recovery data center, and names Milan/Senigallia and Barcelona/Naples locations. In 2026,
              Namirial also described a Digital Product Passport service in which role-based supply-chain actors
              generate and update passport data, while a registry handles identifiers and registration information.
              These are credible design signals, but they remain largely company-issued: independent uptime,
              recovery-time, penetration-test, incident, and integration-performance evidence was not available in the
              assigned pool.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: Maturity, differentiation, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Namirial has evidence of operating maturity in regulated trust services and high-volume document
              workflows, but maturity is unevenly observable across the portfolio. The DTM material reports more than
              two billion pages digitally archived annually and more than 350,000 handwritten-biometric signature
              stations, while the AWS case study describes eSignAnyWhere experimentation with Amazon Bedrock to develop
              new features. The DPP article goes further by describing an active, production-ready Food Metaverse
              project and Namirial's role as a DPP Service Provider. Differentiation therefore appears to rest on
              qualified trust status, compliance know-how, workflow breadth, geographic coverage, and continuity
              infrastructure more than on a publicly measurable software moat.       The main diligence risk is
              implementation complexity: customers may need country-specific legal configuration, integrations, identity
              controls, and migration across acquired products. Public evidence does not quantify defect rates, support
              response, service availability, security incidents, or product-level adoption.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Compliance-led breadth
            body: >-
              The product surface combines transaction workflows with identity, trust services, archiving, and regulated
              communications, which can reduce the need for customers to assemble multiple vendors.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE010
          - type: callout
            title: Reliability proof is thin
            body: >-
              Redundant certification-authority infrastructure is a positive control signal, but public sources do not
              provide independently verified uptime, recovery, incident, or security-performance data.
            calloutType: risk
            claimRefs:
              - CE007
              - CE014
          - type: callout
            title: Platform breadth is the central product thesis
            body: >-
              Namirial's strongest observable product advantage is the combination of workflow, trust, identity,
              records, and compliance capabilities; the evidence is less conclusive on whether those capabilities
              operate as one deeply integrated platform.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE010
          - type: callout
            title: Public technical evidence is selective
            body: >-
              The chapter treats company and partner descriptions as evidence of capabilities and design intent, not as
              independent verification of performance, security, customer outcomes, or integration depth.
            calloutType: assumption
            claimRefs:
              - CE007
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and customer segments
        blocks:
          - type: paragraph
            body: >-
              Namirial serves distinct customer groups rather than one homogeneous buyer population. Its own LinkedIn
              profile describes end-to-end orchestration for enterprises and central public administrations, while
              positioning off-the-shelf products and a product-led-growth model for professionals, SMEs, and local
              public administrations. The same source identifies a network of business partners and customers across
              Europe, America, and Asia, and lists regulated workflows such as identity, signatures, archiving, and
              certified communications. The 2025 Namirial-Signaturit transaction announcement adds a cross-border
              customer base and a combined platform thesis, but its approximately 240,000-customer figure is for the
              combined group rather than Namirial alone. This supports segment breadth and international distribution,
              not a verified Namirial-only active-account count, revenue mix, or payer-versus-user split.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU011
      - number: '6.2'
        title: Adoption trajectory and customer proof
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several adoption surfaces: Namirial reports thousands of customers worldwide and
              several million transactions processed every day in the 2025 transaction announcement, while LinkedIn
              reports approximately 1,400 professionals and more than 29,000 followers as company-scale signals. The AWS
              case study is stronger product-use evidence than a logo list: Namirial built a document-summarization
              feature and an intelligent assistant for eSignAnywhere, launched them to preview users within weeks, and
              reports that more than 130 engineers use generative-AI tools. ZeroComa adds a distinct Spanish compliance
              cohort, with more than 550 customers in Arcano's transaction description and more than 650 in the
              company's acquisition announcement as reproduced by Il Sole 24 Ore. These figures are not directly
              comparable: some are combined-group, acquired-company, employee, or platform-adoption measures, and none
              establishes Namirial customer retention or paid production usage.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU011
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Retention, expansion, and concentration diligence
        blocks:
          - type: paragraph
            body: >-
              The assigned sources describe growth ambitions, acquisitions, adjacent products, and international
              expansion, but they do not disclose Namirial NRR, GRR, logo churn, renewal rates, contract lengths, cohort
              retention, customer concentration, or a verified revenue split by segment. The Signaturit announcement
              reports that Signaturit's ARR grew more than tenfold over five years, but that is a Signaturit metric and
              cannot be transferred to Namirial. Similarly, the ZeroComa customer count describes an acquired Spanish
              provider and does not prove cross-sell or post-close retention in the Namirial base. Namirial's commercial
              model therefore has credible expansion surfaces—regulated workflows, product adjacency, partner
              distribution, and geographic breadth—but the investment case remains dependent on customer-level evidence
              showing production status, recurring economics, renewal durability, and concentration.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad segment coverage
            body: >-
              Namirial explicitly targets enterprises, public administrations, professionals, and SMEs, with both
              integrated and off-the-shelf routes to adoption.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Retention is not disclosed
            body: >-
              No assigned source provides Namirial NRR, GRR, churn, renewal, cohort, or customer-concentration data;
              these remain material diligence gaps rather than negative estimates.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
          - type: callout
            title: Verify production cohorts
            body: >-
              Request a customer-level bridge separating active paid accounts, pilots, acquired-company customers,
              partner-referred accounts, renewal cohorts, and top-customer revenue concentration.
            calloutType: recommendation
            claimRefs:
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Namirial operates in a high-consequence trust-services environment rather than a conventional
              low-regulation software niche. The Cloud Signature Consortium describes it as both a software and service
              company and a certification authority, while its product set includes e-signature, registered email,
              e-invoicing, and long-term archiving. The same source says Namirial is a qualified trust-services provider
              under EU Regulation 910/2014 eIDAS. The PSG announcement separately says the company is actively engaging
              with the EU Digital Identity Framework and Regulation 2024/1183. These are meaningful compliance
              capabilities, but they also create exposure to certification, privacy, identity, evidentiary, and
              cross-border rule changes. The ZeroComa acquisition adds Spanish electronic-notification, invoicing, and
              reporting compliance workflows; Arcano says completion remained subject to customary conditions. Public
              evidence does not confirm the full license register, audit findings, unresolved disputes, or
              post-acquisition control integration, so these remain diligence items rather than assumed strengths.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating, quality, and financial model risks
        blocks:
          - type: paragraph
            body: >-
              The operating model combines cloud services, on-premise software, and trusted service operations across
              multiple countries. That breadth can support resilience and customer choice, but it also increases the
              number of interfaces where reliability, security, data handling, and service-level failures could occur.
              The 2025 combination announcement described a group with approximately 1,400 employees and approximately
              240,000 customers worldwide, while the later ZeroComa coverage reported more than 1,400 employees and
              operations in more than 90 countries; the differing snapshots should not be treated as a clean growth
              series. The same article reported 2025 turnover of EUR270 million and a 2026 target above EUR300 million,
              but those figures are not audited in the assigned evidence. Trustpilot's archived page showed an “Average”
              3.1/5 rating, which is a directional customer-experience signal, not a representative churn or reliability
              measure. Public sources do not quantify burn, working capital, gross margin, outage frequency, breach
              history, or service credits. Investors should therefore monitor integration milestones and independently
              verify the financial and operational denominator behind any growth narrative.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR010
              - CR011
      - number: '7.3'
        title: Partner, dependency, and thesis-break controls
        blocks:
          - type: paragraph
            body: >-
              Namirial's expansion is materially dependent on acquisitions, sponsor support, partner channels, and the
              ability to integrate adjacent trust and transaction products. The PSG announcement says Signaturit would
              enter exclusive negotiations, remain subject to regulatory approvals and employee consultation, and bring
              PSG and Signaturit management into the combined ownership structure. It also describes Namirial's
              international reach and more than 1,000 strategic partners. The CRO appointment in April 2026 places
              responsibility for global growth and revenue functions with a newly appointed executive, which may improve
              commercial coordination but creates an execution checkpoint during a complex expansion phase. ZeroComa's
              founders were expected to remain involved and acquire a stake, aligning continuity while also making
              key-person and integration dependency relevant. The highest-value monitoring indicators are approval and
              integration completion, control audit outcomes, service availability, customer retention by cohort, and
              cash conversion after acquisitions. A thesis break should be declared if material regulatory approval
              fails, integration misses agreed milestones, customer complaints worsen without remediation, or financial
              disclosure cannot substantiate the stated scale and growth.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual exposure
            body: >-
              The largest residual exposure is not a single disclosed lawsuit or outage; it is the compound risk that
              regulated-service obligations, multi-country integration, and acquisition-led growth outpace Namirial's
              publicly visible control and financial disclosure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR013
          - type: callout
            title: Diligence priority
            body: >-
              Require a current trust-service license and audit pack, incident and availability history, customer
              concentration and retention cohorts, acquisition integration KPIs, and audited financial statements before
              underwriting growth or assigning a low risk rating.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision frame and valuation context
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is research more / track, with medium confidence and high underwriting risk. Il
              Sole 24 Ore reports €270 million of 2025 turnover, a management aim to exceed €300 million in 2026, and an
              estimated €1.1 billion valuation when the majority stake moved from Ambienta to Bain Capital in 2025. The
              reported mark equates to roughly 4.1 times 2025 revenue, but that is an analyst calculation from a
              historical transaction mark, not a current enterprise-value multiple or an investable price. The public
              source set does not disclose EBITDA, net debt, recurring-revenue mix, retention, cash conversion,
              preference terms, or the price now available to a new investor. Those omissions prevent a defensible
              equity-value range or target return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and execution burden
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on demonstrated revenue scale, a broad European trust-services platform, and continued
              consolidation. The Signaturit combination was described as creating a group with about 1,400 employees and
              240,000 customers, while company-issued materials said Signaturit's annual recurring revenue had increased
              more than tenfold over five years. Namirial also appointed a chief revenue officer to coordinate organic
              and non-organic growth. The anti-thesis is that this is an acquisition-heavy platform whose integration
              load cannot be priced from public evidence. Tracxn's two pages disagree on whether Namirial has completed
              six or seven acquisitions, and Il Sole 24 Ore and transaction adviser Arcano cite different ZeroComa
              customer counts. These discrepancies are not evidence of operating failure, but they show why management
              data must replace public aggregation before approval.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV016
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should remain conditional rather than assign unsupported probabilities or valuation
              ranges. The bull case requires audited proof that revenue growth converts into recurring gross profit,
              retention, and cash generation while integrations preserve service quality. The base case treats the €1.1
              billion 2025 mark as a negotiation reference only: any new price must be reconciled to current net debt,
              EBITDA, recurring revenue, and fully diluted ownership. The bear case is multiple compression combined
              with missed integration or revenue targets, leaving a sponsor-owned consolidator with limited public
              liquidity. Without those inputs, downside protection should come from price discipline, preference review,
              governance rights, milestone-based funding, or a decision not to invest.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: Diligence, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The final diligence package should include audited 2024-2026 financials, monthly recurring revenue by
              product and geography, gross and EBITDA margins, net debt, cash conversion, retention cohorts, acquisition
              purchase accounting, integration scorecards, the fully diluted capitalization table, and every preference
              or management rollover. The source set establishes independent analyst attention through an IDC vendor
              profile, but it does not provide a relevant public-company multiple set or evidence of an IPO timetable.
              Thesis-break triggers should therefore be measurable: failure to substantiate the 2026 revenue objective,
              material contraction in recurring growth or retention, integration slippage, leverage that eliminates
              downside coverage, or terms that place new money behind an undisclosed preference overhang. Exit
              underwriting should wait for buyer mapping and sponsor liquidity plans.
            claimRefs:
              - CV002
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides company quality
            body: >-
              A credible platform and historical transaction mark do not establish an attractive current entry. Advance
              only after the denominator, leverage, dilution, and preference stack are evidenced and the offered price
              supports the required downside-adjusted return.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV016
          - type: callout
            title: Do not average conflicting public counts
            body: >-
              Public sources disagree on acquisition and ZeroComa customer counts. Reconcile these data with management
              records before using them in operating or integration models.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
