      - number: '1.4'
        title: Ground-truth implications for later diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an established European trust-services platform with meaningful regulatory
              accreditation, sponsor capital, multi-country distribution, and a broadening product perimeter. The main
              analytical constraint is disclosure quality: company and sponsor releases provide extensive operating
              assertions, whereas valuation, financing terms, audited revenue composition, customer concentration, board
              control, and integration outcomes are not disclosed in the assigned sources. The ZeroComa transaction also
              illustrates the value of local regulatory and tax-compliance capabilities while leaving purchase price and
              integration economics unknown. Later analysis should preserve the distinction between Namirial-only
              metrics, proposed-combination metrics, and post-combination company claims rather than treating them as a
              continuous series.
            claimRefs:
              - CO003
              - CO011
              - CO012
              - CO014
