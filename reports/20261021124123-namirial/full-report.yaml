chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Namirial was founded in Italy in 2000 and is headquartered in Senigallia, Italy, according to Bain
              Capital's acquisition announcement. Its offering covers e-signature workflows, onboarding and digital
              identity orchestration, digital trust technologies, qualified electronic archiving, certified
              communications, and electronic invoicing for enterprises, SMEs, professionals, and public administrations.
              The company describes itself as an accredited qualified trust service provider under EU Regulation
              910/2014 (eIDAS), while its transaction materials describe operations in more than 85 countries and
              several million transactions processed each day. The Signaturit combination broadens the platform with
              identity verification, KYC and fraud prevention, eID wallet, document analysis, and related trust
              services. These are strong indicators of a regulated, multi-product platform, but the sources do not
              provide audited product-level revenue or retention data.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, ownership, and governance
        blocks:
          - type: paragraph
            body: >-
              Max Pellegrini has led Namirial as CEO since 2020, while founder Enrico Giacomelli remains materially
              involved in ownership and strategic communication. Bain Capital announced a definitive agreement to
              acquire a controlling stake from Ambienta in March 2025, with financial terms undisclosed; the transaction
              materials identify Bain, Ambienta, the founder and management as stakeholders. The planned Signaturit
              combination adds PSG Equity and Signaturit management as significant minority partners, subject to
              customary approvals and consultation. José Vallés joined the executive leadership team as CRO in April
              2026, reporting to Pellegrini and overseeing revenue-generating functions. The available record shows
              strengthened commercial leadership and sponsor-backed governance, but it does not disclose a complete
              board roster, voting agreement, debt package, or succession plan. Key-person dependence therefore remains
              a diligence question rather than a quantified conclusion.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capital events, acquisitions, and unresolved scale metrics
        blocks:
          - type: paragraph
            body: >-
              Namirial's documented growth path is acquisition-led as well as organic. Public materials identify the
              acquisition of a controlling stake by Bain Capital in 2025, the proposed Signaturit combination announced
              in July 2025, and the later acquisition of Spanish e-invoicing and e-notification provider ZeroComa. Il
              Sole 24 Ore reports €270 million of 2025 turnover, a target above €300 million in 2026, more than 1,400
              employees, operations in more than 90 countries, and an estimated €1.1 billion valuation; the same article
              attributes the valuation to press reporting and does not provide a primary transaction filing.
              Signaturit's post-combination page reports €260 million of 2025 revenue for the combined business, while
              Bain's announcement reports approximately 1,000 Namirial employees and thousands of customers before the
              combination. These figures are not directly comparable by perimeter or publication context and should not
              be combined into a single precise KPI. Exact total capital raised, current valuation, revenue run-rate,
              customer count, and debt remain undisclosed or conflicting in the retained evidence.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
