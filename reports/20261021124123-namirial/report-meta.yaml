companyProfile:
  summary: >-
    Namirial is an Italian-founded digital transaction management and qualified trust-services
    provider with products spanning electronic signatures, identity and onboarding, certified
    communications, archiving, and electronic invoicing. Public materials describe sponsor-backed
    European expansion through acquisitions and the proposed combination with Signaturit, while
    financial quality, ownership terms, and current operating perimeters remain incompletely
    disclosed.
  foundedDate: null
  founders:
    - name: Enrico Giacomelli
      role: Founder and shareholder
      background: Founded Namirial in Italy.
      claimRefs: [CO001, CO005]
  foundingLocation: Italy
  headquarters: Senigallia, Italy
  productSummary: >-
    Digital transaction management and trust products including electronic signatures, digital
    identity, onboarding, certified communications, qualified archiving, and electronic invoicing.
  customerFocus: Enterprises, small and medium-sized businesses, professionals, and public administrations.
  businessModel: >-
    A multi-product software and trust-services platform using cloud, on-premise, direct, and
    indirect delivery models; public sources do not disclose the realized pricing or revenue mix.
  stage: Private, sponsor-backed
  fundingStatus: >-
    Bain Capital announced a controlling-stake acquisition in 2025; transaction consideration,
    current ownership percentages, debt, and total capital raised are not publicly disclosed in
    the retained evidence.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO011, CO012, CI002, CI003, CI015]
