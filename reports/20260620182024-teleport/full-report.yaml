      - number: '3.4'
        title: Teleport Differentiation
        blocks:
          - type: paragraph
            body: >-
              Teleport's clearest differentiation is structural rather than cosmetic. Its Auth Service acts as a
              certificate authority for users, machines, and resources, while the Proxy Service brokers access across
              SSH, Kubernetes, databases, RDP, web apps, and machine identities without relying on long-lived shared
              credentials. That lets Teleport pitch an access plane where authentication, authorization, and audit are
              unified instead of stitched together from a vault, jump host, VPN, and scattered policy engines. The
              company has also expanded outward: recent releases highlighted IdP-compromise mitigations, a broader
              identity-security layer, machine and workload identity, and a new Agentic Identity Framework for AI
              systems. Those moves widen the category Teleport is trying to own. The tradeoff is that Teleport's old
              open-source discovery advantage is less clean after the 2024 community-license change, so architectural
