      - number: '1.3'
        title: Funding history, valuation, and capital structure
        blocks:
          - type: paragraph
            body: >-
              Teleport has disclosed three funding rounds totaling $165M. The first was a $25M Series A led by Kleiner
              Perkins, announced on the company blog when the company was still operating as Gravitational. The Series A
              blog post named early customers NASDAQ, Splunk, TicketMaster, Mulesoft, and Samsung, and noted the company
              had recently reached profitability. The Series A was followed by a $30M Series B led by S28 Capital and
              Kleiner Perkins in 2021; that round followed a quarter with net new ARR up 5x year-over-year and ARR up
              2.5x compared to Q2 2020, suggesting the company's revenue was scaling rapidly off a small base. The
              company did not disclose ARR in dollar terms at that time.


              The largest round, a $110M Series C led by Bessemer Venture Partners with participation from Insight
              Venture Partners, was announced in May 2022 at a $1.1B valuation. Bessemer's investment blog (bvp.com) and
              the Teleport announcement blog both confirm this valuation. The Series C named ARR up 2.8x year-over-year
              and net new ARR up 4.5x at the time of the round, and came less than a year after the Series B. Mary
              D'Onofrio from Bessemer joined the board; Matt Koran from Insight joined as a board observer. No public
              evidence of a subsequent funding round after May 2022 has been identified. The $1.1B valuation mark is
              therefore approximately four years old as of the run date, and private-market conditions have materially
              changed since then.


              GetLatka, a third-party data aggregator, reported in a 2025 snapshot that Teleport raised $140M across two
              rounds, which differs from the company's disclosed $165M across three rounds. GetLatka also estimated the
              company's 2024 revenue at $49M and headcount at approximately 246 as of late 2025; these figures are
              unconfirmed third-party estimates and should not be treated as verified financial data.
