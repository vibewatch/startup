      - number: '8.3'
        title: Scenario Analysis and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              The scenario range depends far more on verified revenue scale and growth durability than on spreadsheet
              complexity. In the bull case, Teleport's AI Infrastructure Identity repositioning works, Beams becomes a
              credible agent-identity wedge, and ARR compounds above 35% annually from the $49M 2024 estimate to roughly
              $85M by 2027. Applying a 15x multiple—roughly the high end of a transparent public PAM anchor rather than
              an aggressive AI bubble multiple— yields approximately $1.28B, only modestly above the old mark. That is
              an acceptable but not spectacular late-stage upside case. The base case assumes the product remains
              relevant and customer quality is solid, but growth settles closer to 25% annually. That reaches about $73M
              ARR by 2027. At 10x to 12x, consistent with a healthy but not euphoric security-software multiple band,
              implied value is about $730M to $875M. The bear case assumes the license transition slows developer-led
              acquisition, competitors pressure pricing, and the AI repositioning takes longer than the narrative
              suggests; under 15% annual growth, ARR only reaches about $60M, and a 6x to 8x range implies $360M to
              $480M. Put differently, most realistic paths need either better-than- public growth evidence or a lower
              entry price before risk-adjusted returns become compelling.
