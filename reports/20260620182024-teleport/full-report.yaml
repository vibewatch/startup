  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape
        blocks:
          - type: paragraph
            body: >-
              Teleport's competitor set is broader than classic password-vault PAM. The closest field includes incumbent
              suites such as CyberArk, BeyondTrust, and Delinea; modern infrastructure-access challengers such as
              StrongDM and HashiCorp Boundary; and adjacency from Okta, which can extend existing workforce identity
              relationships into privileged server access. Bessemer's infrastructure-access framing helps explain why
              buyers do not evaluate Teleport inside only one box: the practical job spans connectivity, authentication,
              authorization, and audit across servers, clusters, databases, and increasingly AI-operated infrastructure
              workflows. Independent comparison and review sites reinforce that this is the active buyer short list. The
              market therefore is not a winner-take-all feature race but a segmentation contest between broad enterprise
              incumbents, cloud-native specialists, and identity-platform bundlers, with Teleport strongest where buyers
              want one modern control plane rather than a legacy vault plus point proxies.
