  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: License Change and Open-Source Community Risk
        blocks:
          - type: paragraph
            body: >-
              Teleport created a self-inflicted trust risk when it moved Community Edition compiled artifacts from
              Apache 2.0 to a commercial license starting with Teleport v16 in June 2024. The policy applies to
              companies with 100 or more employees or at least $10 million of annual revenue, and it also blocks resale
              or embedding of Community Edition artifacts. That change matters because Teleport built much of its
              category credibility through developer adoption and had more than 15,000 GitHub stars when the
              announcement was made. The source code remains available, but the practical thing most enterprises consume
              is the binary, image, or AMI, so the commercial restriction changes the lived developer experience even if
              the repository stays public. The resulting risk is broader than social-media backlash. It creates fork
              incentives, reduces bottom-up evangelism, complicates upgrade paths from older Apache-licensed builds, and
              invites criticism that Teleport is no longer behaving like a conventional infrastructure open-source
              project under the Open Source Initiative definition.
            claimRefs:
              - CR001
