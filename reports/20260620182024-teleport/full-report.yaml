      - number: '7.2'
        title: Self-Hosted Complexity and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Teleport's architecture delivers strong control and audit benefits, but it pushes operational burden onto
              customers in ways that can become investment risk. Competitor materials from StrongDM argue that Teleport
              agents run as root on target servers, creating a meaningful privileged attack surface, and they also frame
              Teleport as a potential single point of failure when the control plane is not designed for high
              availability. Those claims are directional rather than neutral, but they align with customer-review
              evidence that large deployments can be complicated to configure and operate. The self-hosted model
              requires customers to own infrastructure sizing, patching, upgrade sequencing, disaster recovery, and
              outage planning for auth and proxy components. Teleport has published security-audit material and FIPS
              140-3 support, which are real mitigants, but those do not erase architecture fragility or implementation
              complexity. FedRAMP adds another layer: Teleport documents how customers can satisfy control families with
              the product, yet the public corpus does not show Teleport Cloud itself holding a FedRAMP authorization,
              which can create confusion in public-sector sales cycles.
            claimRefs:
