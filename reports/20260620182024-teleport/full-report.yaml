      - number: '5.3'
        title: Agentic Identity and Machine & Workload Identity
        blocks:
          - type: paragraph
            body: >-
              Teleport Machine & Workload Identity (MWI) provides non-human service accounts using the same
              certificate-based model as human access. Services authenticate via tbot, receive short-lived X.509 or SSH
              certificates, and those certificates authorize access to databases, Kubernetes clusters, internal APIs,
              and MCP servers — all logged to the same audit trail. This creates a single identity fabric for humans and
              machines rather than a parallel secret-management system.

              The Agentic Identity Framework, announced January 2026, extends that model to AI agents. It defines four
              layers: identity (cryptographic agent certificates), access (RBAC/ABAC enforcement through the Teleport
              proxy), security (behavioral monitoring and locks), and scheduling (orchestration patterns for Kubernetes
              and Temporal). The June 2026 public beta of Beams added two concrete capabilities: LLM Proxy (sits between
              an agent and its inference endpoint, logs every request/response, enforces per-Beam allowlists) and
              Delegated Identity (allows a human or orchestrator to assign least-privilege permissions to an agent
              session). Each Beam runs in a Firecracker microVM with ephemeral storage, injected identity, virtual
              networking, and a session-bound lifecycle of approximately 24 hours. Beams is currently Enterprise Cloud
              only and in public beta — not generally available.
            claimRefs:
