      - number: '2.3'
        title: Buyer Types, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Teleport's buyer map is cross-functional because the product collapses security, platform, and compliance
              workflows into one access layer. Day-to-day users are typically platform engineers, SRE or DevOps teams,
              security engineers, infrastructure administrators, and database or Kubernetes operators. Budget ownership
              depends on the purchase trigger. Security-led deals often sit with the CISO organization, platform-led
              rollouts can be owned by engineering infrastructure teams, and compliance-led public-sector or
              regulated-enterprise deals often pull in GRC stakeholders because FedRAMP and SOC 2 evidence collection
              matter alongside access control. Pricing reinforces that shared ownership: Teleport charges on monthly
              active users and machine/workload identities, so the commercial model expands with identity adoption
              rather than with one fixed appliance footprint. Developer-led evaluation still matters because the open
              repository has 15,000-plus stars, but enterprise conversion appears strongest in regulated and
              cloud-native organizations, including large financial-services buyers. The weakest fit appears in
              legacy-heavy hybrid estates where buyers prioritize broad protocol coverage and simpler migration over
              Teleport's cloud-native depth.
