              evidence does not confirm the operating scale that would justify keeping that mark today. GetLatka
              estimates 2024 ARR at $49M, but it is explicitly an estimated single-source data point rather than company
              disclosure. If that estimate is directionally correct, the stale mark implies about 22.4x EV/ARR. CyberArk
