  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial model, revenue structure, and customer base
        blocks:
          - type: paragraph
            body: >-
              Teleport's commercial model is usage-based and multi-product. The pricing page discloses three billing
              metrics: Monthly Active Users (MAU) for Zero Trust Access and Identity Governance modules,
              Machine/Workload Identities (MWI) for the Machine and Workload Identity module, and Teleport Protected
              Resources (TPR) for Identity Security. No public list price is disclosed; all pricing requires commercial
              engagement with the sales team. Enterprise Edition supports cloud, on-premises (standard and FIPS),
              multi-region high availability, and hybrid deployment modes. The Beams AI agent runtime product entered
              public beta in June 2026 and is not yet publicly priced.


              The Community Edition free tier — available for companies under 100 employees and under $10M annual
              revenue since the June 2024 license change — creates a deliberate forcing function for commercial
              conversion as customers grow. Customer case studies show the breadth of enterprise deployment: GoTo
              (Indonesia's largest digital platform, managing multi-cloud access across complex infrastructure), Exness
              (regulated global trading firm with stringent security requirements), Gladly (SaaS platform with SOC 2
              compliance requirements), and ExtraHop (security-focused cloud network detection company). Each represents
              a different vertical and compliance posture. The careers page states more than 600 customers globally as
              of October 2025.


              Revenue drivers visible from public materials include: (1) usage expansion as MAU, MWI, and TPR metrics
              grow with infrastructure scale without requiring re-negotiation; (2) community-to-enterprise conversion as
              companies cross the 100-employee or $10M AR threshold; (3) multi-module upsell as customers adopt Identity
              Governance, Identity Security, and AI agent identity modules; and (4) AI agent market opportunity through
              Beams and the Machine Workload Identity module. Session recording, database access, and MCP server access
              also create upsell in compliance-sensitive sectors.
