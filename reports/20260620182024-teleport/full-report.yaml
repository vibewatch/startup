      - number: '3.3'
        title: Cloud-Native Challengers
        blocks:
          - type: paragraph
            body: >-
              StrongDM, HashiCorp Boundary, and Okta matter because they attack Teleport from three different angles.
              StrongDM competes head-on for modern infrastructure access, but it frames itself as easier for mixed
              estates because it supports more legacy systems and authentication methods and does not require Teleport's
              exact certificate-only operating model. Boundary is narrower, yet technically important: its
              identity-aware proxy plus Vault integration gives it credibility for teams already standardized on
              HashiCorp tooling. Okta approaches the market from an IAM adjacency route, extending SSO, ephemeral server
              access, and session recording into Linux and Windows infrastructure for customers that already trust Okta
              as an identity control plane. Together these challengers show why Teleport cannot rely on cloud-native
              branding alone; each rival brings a distinct distribution mechanism, from platform adjacency to direct
