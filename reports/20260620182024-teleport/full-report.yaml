      - number: '7.4'
        title: Financial Opacity and Valuation Risk
        blocks:
          - type: paragraph
            body: >-
              The financial debate around Teleport is defined less by visible weakness than by missing visibility.
              Public funding history is clear through the March 2022 Series C, when Teleport announced a $110 million
              round at a $1.1 billion valuation led by Bessemer Venture Partners, bringing cumulative funding to roughly
              $140 million across Series A, B, and C. What is not clear is current scale, margin structure, cash
              efficiency, or profitability. The only ARR figure in the source set is a GetLatka estimate of $49 million
              for 2024, and that figure is unverified by Teleport. If it were directionally correct, the last disclosed
              valuation would imply roughly a 22 times ARR multiple, which is demanding for a private infrastructure
              company without public proof of growth durability. Because no newer round is visible in the provided
              corpus, investors are forced to underwrite against a four-year-stale price anchor. That combination of
              stale mark, estimated ARR, and absent unit-economics data makes downside harder to quantify and gives
              better-resourced public comparables more influence over market sentiment.
