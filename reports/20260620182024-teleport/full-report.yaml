  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Teleport is a certificate authority (CA) and identity-aware access proxy that implements SSH, RDP, HTTPS,
              Kubernetes API, and a variety of SQL and NoSQL database protocols. The product is distributed as a single
              Go binary that combines authentication, authorization, auditing, and tunneling in one deployable unit.
              Teleport operates internal Certificate Authorities for both hosts and users; every identity — human,
              machine, or AI — receives a short-lived certificate rather than a long-lived credential, eliminating
              secrets sprawl at the architecture level.

              The product suite now spans five branded product pillars: Zero Trust Access (SSH, Kubernetes, databases,
              RDP, web apps), Machine & Workload Identity (non-human service credentials), Identity Governance, Identity
              Security (access analytics and threat detection), and the Agentic Identity Framework (AI agent identity +
              Beams runtime). The feature matrix distinguishes Enterprise Cloud, Enterprise Self-Hosted, and Community
              Edition, with Beams trusted runtimes exclusive to Enterprise Cloud. Each major release has shipped every
              four months historically; version 18 (current) arrived July 2025 with version 19.0 planned. The June 2024
              community-license change restricted compiled binaries for companies with over 100 employees or $10 M+ AR,
              a shift with lasting ecosystem implications.
            claimRefs:
