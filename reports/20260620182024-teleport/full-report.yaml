      - number: '3.2'
        title: Incumbent PAM
        blocks:
          - type: paragraph
            body: >-
              CyberArk, BeyondTrust, and Delinea still define the incumbent end of the market because they sell
              privileged access into broad enterprise and hybrid estates, not only into greenfield cloud teams.
              CyberArk's official positioning emphasizes a single PAM platform, cyber-risk reduction, audit and
              compliance outcomes, and zero-standing-privilege access across hybrid environments. BeyondTrust tells a
              similar story around least privilege, credential injection, and privileged remote access that can remove
              the need for VPNs and known credentials. Delinea's Secret Server remains anchored in vaulting, discovery,
              password rotation, and session monitoring, with new AI-driven session analysis language layered on top.
              None of these vendors market themselves as Teleport-style open infrastructure identity platforms, but the
              overlap is material enough that Teleport must win by architecture simplicity for modern estates, not by
              assuming incumbents are trapped in old password-vault workflows.
