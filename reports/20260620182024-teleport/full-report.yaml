  - id: FE001
    title: Teleport Infrastructure Identity Platform — Product Architecture Stack
    type: stack
    layout: standard
    summary: Five product pillars layered over the unified Auth and Proxy control plane.
    data:
      layers:
        - label: Agentic Identity Framework (Beams, LLM Proxy, Delegated Identity)
          modules:
            - Beams Firecracker VM runtime (public beta, Enterprise Cloud only)
            - LLM Proxy — enforcement between agent and inference endpoint
            - Delegated Identity — least-privilege agent session permissions
            - MCP Server Proxy — first-class MCP enrollment + audit
        - label: Identity Security & Governance
          modules:
            - Identity Security (Crown Jewels monitoring, SQL editor, anomaly alerts)
            - Identity Governance (access lists, nested groups, JIT requests, ChatOps)
        - label: Machine & Workload Identity
          modules:
            - tbot — issues short-lived X.509 / SSH certificates for workloads
            - SPIFFE-compatible attestation — no standing service secrets
        - label: Zero Trust Access
          modules:
            - SSH — certificate-only, no SSH keys, full PTY audit
            - Kubernetes — per-cluster RBAC + kubectl exec session recording
            - Databases — PostgreSQL, MySQL, MongoDB, CockroachDB protocol proxy
            - Windows/RDP — browser-native RDP, screen-level session recording
            - Web Apps — HTTPS proxy with identity-based access
        - label: Auth and Proxy Control Plane
          modules:
            - Auth Service (CA, config store, gRPC API, audit log collector)
            - Proxy Service (TLS routing, reverse tunnels, Web UI, port 443)
            - BoringCrypto FIPS 140-3 module (Enterprise, CMVP
            - Backend store (etcd / DynamoDB / Postgres / Teleport Cloud storage)
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
      - CE020
