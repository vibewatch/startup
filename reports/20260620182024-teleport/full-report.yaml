  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Scope, Adjacencies, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Teleport's own positioning and product architecture make the market boundary broader than classic
              privileged access management but narrower than the entire zero-trust stack. The company describes itself
              as an AI Infrastructure Identity company and sells certificate-based access for SSH, Kubernetes,
              databases, Windows, internal web apps, machine identities, and AI-related infrastructure workflows. That
              means the included spend is the control plane for infrastructure access: privileged access, workload
              identity, access audit, and compliance-oriented infrastructure access modernization. It does not justify
              counting broad workforce IAM, customer identity, endpoint security, SIEM, or general AI application spend
              as core market value, even if those budgets sometimes influence the deal. The status quo substitute set is
              still large — VPNs, bastions, long-lived keys, database passwords, cloud-native point IAM, and manual
              audit workflows all compete for the same job. An adverse competitor view from StrongDM is useful here
              because it argues Teleport remains a point solution for modern cloud estates rather than a universal
              access platform, which is a real constraint on inflated TAM narratives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
