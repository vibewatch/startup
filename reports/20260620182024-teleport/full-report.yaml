        title: Valuation and comparable public-market multiples
        blocks:
          - type: paragraph
            body: >-
              The only external valuation data point for Teleport is the $1.1B mark from the May 2022 Series C. As of
              June 2026, this mark is approximately four years old and has not been refreshed. At GetLatka's $49M
              estimated ARR, the implied revenue multiple is approximately 22.4x — materially above where comparable
              public cybersecurity companies traded in mid-2026.


              CyberArk Software (CYBR), the closest publicly traded comparable for privileged access management, had a
              market cap of approximately $20.63B and TTM revenue of approximately $1.30B as of June 2026, implying
              roughly a 15.9x revenue multiple. CyberArk revenue grew from approximately $590M in 2022 to $1.30B TTM in
              2025, a 2.2x increase in roughly three years. Okta (OKTA), the closest identity and access management
              comparable, had a market cap of approximately $20.65B and TTM revenue of approximately $2.91B as of June
              2026, implying approximately 7.1x. Okta revenue grew from $1.85B to $2.91B over the same period (1.6x
              growth). Both companies are substantially larger in revenue than Teleport's estimated ARR.


              At the midpoint of these two public peers' revenue multiples (~11x), $49M ARR implies Teleport's
              enterprise value at approximately $540M, well below the $1.1B mark. Even at CyberArk's 15.9x multiple, the
              implied value is approximately $779M. At the Series C close in May 2022, CyberArk itself traded at
              approximately $5.27B market cap on $590M revenue (~9x), and Okta at ~$10.94B on $1.85B revenue (~6x),
              suggesting Teleport's 22x+ implied multiple was already ~2x the comparable range at issuance. The
              private-market premium implicit in the 2022 mark has likely eroded further under post-2022 market
              corrections.
