      - number: '2.4'
        title: Regulatory, AI, Cloud, and Security Drivers
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled forward by a mix of standards, compliance pressure, cloud complexity, and new
              AI-agent risk. NIST SP 800-207 gives zero trust a formal architecture definition, while CISA's Zero Trust
              Maturity Model operationalizes that architecture across five pillars and three cross-cutting capabilities,
              which legitimizes budget allocation for identity-centric infrastructure controls. Teleport benefits when
              those abstract frameworks translate into concrete FedRAMP and SOC 2 access-control requirements,
              especially because it documents FIPS 140 support and control mappings. AI adds a sharper near-term
              catalyst. Teleport's 2026 survey says 92% of respondents have near-term AI initiatives, 79% are evaluating
              or deploying agentic AI, only 13% feel extremely prepared, and 60% have had or suspect AI-related
              incidents. Separate 2026 newsroom data says 73% of cybersecurity leaders are hearing enterprise questions
              about AI agent security. At the same time, multi-cloud sprawl and the broader cloud-era shift toward
              unified control planes support the category. The main adoption drag is not lack of need but switching
              cost: buyers still have to unwind incumbents, re-architect access paths, and decide whether Teleport's
              modern-cloud strengths outweigh legacy-coverage concerns.
