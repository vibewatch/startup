      - number: '1.5'
        title: License change, FedRAMP positioning gap, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The most material recent adverse development is the June 2024 community license change. Starting with
              Teleport 16, the company switched compiled Community Edition binaries and container images from Apache 2.0
              to a commercial license. The new license allows free commercial use only for companies with fewer than 100
              employees and under $10M in annual revenue. The AGPLv3 license on the source code repository was not
              changed, meaning large companies can still compile from source, but the convenience of downloading
              pre-built binaries is now restricted. This move is consistent with other open-core companies protecting
              community monetization but represents a clear tightening of the community offering that some users and
              enterprises noticed critically.


              On FedRAMP, Teleport's public documentation and marketing describe the product as enabling customers to
              meet FedRAMP compliance requirements. Teleport Enterprise builds are compiled against FIPS 140-validated
              cryptographic modules, and the FedRAMP documentation page describes how Teleport helps achieve specific
              FedRAMP controls. However, no evidence in the publicly available corpus confirms that Teleport's own cloud
              service has received a FedRAMP Authorization To Operate (ATO). The FedRAMP positioning is as a
              compliance-enabling tool, not as a FedRAMP-authorized service provider. This gap matters for federal
              buyers who may expect the SaaS itself to carry an ATO.


              Adverse product signals from third-party review platforms are also notable. PeerSpot reviewers cite
              initial setup complexity, RBAC configuration difficulty, and integration challenges with SIEM and
              monitoring tools. A competitor comparison page from StrongDM claims Teleport's agent-based architecture
              requires agents running as root on every monitored server, creating a new attack surface; the same page
              claims Teleport Cloud has reliability issues including outages during updates. These claims originate from
              a competing vendor and should be read critically, but they represent the categories of weakness that
              evaluating buyers consider.
            claimRefs:
              - CO033
              - CO034
              - CO035
              - CO036
              - CO037
              - CO039
              - CO040
              - CO041
