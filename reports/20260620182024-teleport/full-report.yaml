  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buying Profile
        blocks:
          - type: paragraph
            body: >-
              Teleport's buyer is primarily the engineering or platform-security team at mid-to-large enterprises,
              particularly in technology, financial services, and global digital platforms. The product is bought by
              infrastructure engineering leaders (VPs of Engineering, Platform Engineers, CISOs), with DevOps and SRE
              teams as the primary users. The official customer page and case studies show a consistent pattern of
              companies seeking to replace VPN-plus-shared-credentials approaches with certificate-based infrastructure
              access.

              Verticals represented in public case studies include fintech (Carta, Exness), global SaaS platforms (GoTo,
              Gladly), network detection (ExtraHop), and enterprise observability (IBM Instana). The Series A funding
              announcement named Nasdaq (stock exchange), Splunk (SIEM/observability), TicketMaster (live
