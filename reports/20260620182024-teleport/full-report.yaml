        - Gross margin, burn, runway, and sales efficiency
        - Without unit economics the entry price cannot be stress tested
        - Finance workstream and management interviews
      - - Cap table
        - Preference stack, anti-dilution terms, and liquidation rights
        - Preference overhang can impair return even if enterprise value grows
        - Company counsel and financing document review
      - - License-change impact
        - Pipeline mix before and after CE transition
        - Community motion changes could alter CAC and conversion assumptions
        - GTM analytics review with product and sales leadership
      - - FedRAMP roadmap
        - Authorization plan, timing, and go-to-market dependence on federal buyers
        - Government TAM cannot be fully counted without an execution path
        - Security/compliance review and federal pipeline diligence
    notes: Each ask is directly tied to a valuation variable that is currently opaque in public materials.
