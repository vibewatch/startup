              disclosed data on what those costs are.


              Capital adequacy is similarly opaque. The company has raised $165M across three disclosed rounds, with the
              most recent $110M Series C in May 2022. No new financing has been publicly confirmed since. At an
              industry-typical cash burn rate for a company of Teleport's stage, the Series C proceeds could support
              three to five years of operations depending on burn discipline — suggesting the company may not need new
              capital immediately, but this is entirely speculative without actual balance-sheet data. No debt, credit
              facility, or project finance is disclosed.


