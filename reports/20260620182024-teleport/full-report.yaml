      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Teleport's control plane consists of two canonical services: the Auth Service (the cluster CA, config
              store, and audit-log collector) and the Proxy Service (the public-internet entry point and reverse-tunnel
              hub). These two services are stateless relative to each other, communicate over gRPC, and can be scaled
              horizontally for high availability. On Teleport Cloud, both services are fully managed by Teleport Inc.;
              on Enterprise Self-Hosted, customers operate them on their own infrastructure.

              Resource enrollment follows three paths: Teleport Agents (deployed as daemons on target machines and
              reverse-tunnelled back to the Proxy), agentless mode for certain protocols, and Machine & Workload
              Identity tokens (tbot-based short-lived certificates for workloads). The authentication flow is consistent
              across protocols: a user (or machine) runs tsh login, receives a client certificate, and that certificate
              is accepted by SSH, Kubernetes, database, RDP, and MCP proxies without re-authentication. Session
              recording is configurable at node or proxy level, synchronously or asynchronously, and captures full PTY
              output for SSH and Kubernetes, screen content for desktop sessions, and query streams for database
              sessions.

              StrongDM's competitive analysis notes that Teleport agents run as root on target servers, creating an
              additional attack surface; the company also criticizes limited legacy-protocol support and intermittent
              cloud reliability. PeerSpot users independently flag RBAC complexity, initial-setup burden, and
              clipboard-access security in RDP sessions as real friction points.
            claimRefs:
              - CE010
