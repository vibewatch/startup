              15.8x. Okta, a broader identity platform that now sells privileged access, trades nearer 7.1x. Those
              public multiples are not perfect one-for-one equivalents, but they do establish gravity: Teleport needs
              either materially more ARR than $49M, much faster present-day growth than is publicly verified, or a
              durable AI-identity premium to deserve the old private mark. Without that proof, the valuation reads as
