              - CV042
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Stale mark plus unverified ARR is the core underwriting problem
            body: >-
              Teleport's only public valuation mark is the March 2022 $1.1B Series C, and the only current ARR figure is
              GetLatka's unconfirmed $49M 2024 estimate, which implies about 22.4x EV/ARR.
            calloutType: risk
            claimRefs:
              - CV001
