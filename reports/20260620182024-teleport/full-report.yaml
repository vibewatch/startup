          - type: callout
            title: Large markets and strong investors keep the story investable
            body: >-
              Teleport still benefits from large secular PAM and zero-trust demand, a credible enterprise customer base,
              and support from Bessemer, Insight, Kleiner Perkins, and S28.
            calloutType: strength
            claimRefs:
