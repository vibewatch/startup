chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, product, and headquarters
        blocks:
          - type: paragraph
            body: >-
              Teleport is the self-described "AI Infrastructure Identity Company," headquartered at 2100 Franklin St,
              Suite 400, Oakland, California 94612. The company modernizes identity, access, and policy for
              infrastructure, positioning the product as a platform that simultaneously improves engineering velocity
              and raises resilience against identity-based attacks. The company was originally incorporated as
              Gravitational Inc. and renamed itself Teleport in 2021, migrating from gravitational.com to
              goteleport.com; the blog post announcing the name change explicitly states that the Teleport product
              became the company's primary focus. The legal entity retains the Gravitational Inc. corporate name on
              package-signing certificates (Apple Developer ID QH8AA5B8UP Gravitational Inc.), confirming the corporate
              continuity.


              Teleport describes its product as a unified identity layer that replaces fragmented access management
              systems across servers (SSH), Kubernetes, databases, RDP, web applications, and MCP servers with a
              certificate-authority model that issues short-lived credentials tied to the identity of the requestor.
              This architecture aligns with the NIST SP 800-207 Zero Trust Architecture framework, which defines zero
              trust as eliminating implicit trust based on network location and requiring per-request authentication and
              authorization. The revenue model, per the public pricing page, is usage-based, metered by Monthly Active
              Users (MAU), Machine and Workload Identities (MWI), and Teleport Protected Resources (TPR). A free
              Community Edition exists for companies under 100 employees and $10M in annual revenue, while Enterprise
              Edition requires commercial engagement. The company is privately held; no revenue, margin, cash, or burn
              data is publicly disclosed.
