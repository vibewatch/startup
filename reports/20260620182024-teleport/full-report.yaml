      - number: '4.2'
        title: Revenue and ARR estimates — an entirely unverified picture
        blocks:
          - type: paragraph
            body: >-
              Teleport discloses no financial data. The only publicly available ARR estimate comes from GetLatka, a
              third-party data aggregator, which reported that Teleport hit $49M in revenue in December 2024. GetLatka
              also estimated headcount at approximately 246 as of late 2025. These figures have not been confirmed by
              Teleport, any investor, or any independent source. GetLatka's own funding summary shows $140M across 2
              rounds, diverging from the company-disclosed $165M across 3 rounds, further eroding confidence in the
              dataset's completeness.


              Working backward from the ARR growth rates disclosed in funding announcements: the Series C blog (May
              2022) reported total ARR up 2.8x and net new ARR up 4.5x year-over-year; the Series B blog (2021) reported
              total ARR up 2.5x and net new ARR up 5x year-over-year versus Q2 2020. If these growth rates are correct
              and the company was tracking to triple revenue in 2021 per the Series B era disclosures, the implied ARR
              at the Series C close was approximately $17–20M. Growing from that level to $49M by 2024 implies a
              post-fundraising CAGR of roughly 22%, a significant deceleration from the pre-Series-C trajectory. This
              cannot be confirmed without management data, but it is directionally consistent with the broader SaaS
              market slowdown in 2022–2024.


              GTM efficiency metrics are completely absent. No sales cycle length, CAC, payback period, or quota
              attainment data is public. The best proxy for GTM effectiveness is the customer count trajectory (600+
              cited in 2025) and the quality of named logos, but neither converts to revenue-per-customer or expansion
              rate without further data.
