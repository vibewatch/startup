      - number: '2.2'
        title: Sizing Lenses and Estimate Variance
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence supports a layered view rather than a single headline TAM. A narrow PAM lens from
              Precedence Research puts the market at $4.50 billion in 2025, while two broader zero-trust estimates place
              the market around $36.96 billion in 2024 and $40.01 billion in 2025, with long-range forecasts extending
              materially higher. Teleport likely sits between those lenses because it addresses privileged
              infrastructure access and identity control, but does not capture every network, endpoint, data, and
              application control dollar embedded in broad zero-trust research. Category language is also still
              settling: Bessemer described infrastructure access as a new product category, which helps explain why
              analyst coverage spans overlapping definitions rather than one settled taxonomy. Demand signals are strong
              enough to support a real market, not just a concept. Teleport reports 600-plus customers, and its 2026
              survey plus 2026 newsroom evidence show AI-driven identity concerns rising quickly. Even so, a precise
              Teleport SAM or SOM cannot be isolated from public evidence because customer mix, contract value, and
              deployment distribution remain undisclosed, and one Fortune Business Insights PAM source returned the
              wrong content entirely.
