  topStrengths:
    - Unified certificate-based access architecture across SSH, Kubernetes, databases, web apps, and machine identities.
    - Open-source distribution and strong developer credibility supported by a large GitHub footprint.
    - Blue-chip named customers including Nasdaq, DoorDash, IBM Instana, Carta, Samsung, Elastic, and Snowflake.
    - Strong investor syndicate with Kleiner Perkins, S28, Bessemer, and Insight supporting category creation.
    - New AI-agent identity and Beams positioning may create an additional growth wedge if adoption materializes.
  topRisks:
    - The $1.1B Series C valuation is stale and screens rich versus 2026 public identity and PAM comparables.
    - The only current ARR figure ($49M for 2024) is a third-party estimate rather than company-confirmed data.
    - The June 2024 community-license change may weaken bottom-up conversion and community goodwill.
    - Public sources support FedRAMP compliance tooling, but do not verify a FedRAMP authorization for Teleport Cloud itself.
    - Large competitors and cloud-native alternatives can bundle adjacent identity and privileged-access capabilities.
  unresolvedGaps:
    - Current ARR, gross margin, burn, cash runway, and NRR are not publicly disclosed.
    - The 600+ customer figure is company-stated and not independently verified.
    - Teleport Cloud FedRAMP authorization status remains unconfirmed from accessible public sources.
    - Cap-table terms, liquidation preferences, and board composition beyond announced investors remain private.
    - Secondary-market pricing or any refreshed post-2022 valuation evidence is not publicly available.
disclaimer: This report is based on publicly available information and includes clearly marked third-party estimates where Teleport has not disclosed current metrics.
