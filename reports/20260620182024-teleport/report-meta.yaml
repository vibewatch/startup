  foundingLocation: Oakland, California, USA
  headquarters: Oakland, California, USA
  productSummary: Certificate-based infrastructure identity platform covering SSH, Kubernetes, databases, web apps, Windows/RDP, MCP servers, machine identities, and AI-agent runtimes.
  customerFocus: Mid-market and enterprise engineering, platform, security, fintech, and regulated infrastructure teams.
  businessModel: Usage-based enterprise SaaS and self-hosted software monetized by monthly active users, machine/workload identities, and protected resources; free community tier only for smaller companies.
