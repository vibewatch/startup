companyProfile:
  summary: Teleport is a private infrastructure identity company founded in 2015 that unifies access and policy for servers, Kubernetes clusters, databases, web apps, machines, and AI agents. The company grew from an open-source access project into a multi-module commercial platform spanning Zero Trust Access, Machine and Workload Identity, Identity Governance, Identity Security, and the Beams agentic runtime. Teleport has raised $165M across three disclosed rounds, reached a $1.1B valuation in May 2022, and has strong named customer proof across technology, fintech, and regulated infrastructure, but its current financial profile remains largely undisclosed.
  foundedDate: '2015-01-01'
  founders:
