      role: Co-founder & CEO
      background: Former Rackspace/Mailgun operator who remains Teleport's primary public spokesperson.
      claimRefs: [CO004, CO007, CO009, CO010]
    - name: Alexander Klizhentas
      role: Co-founder & CTO
      background: Former Rackspace/Mailgun engineer; leads Teleport's technical architecture and core product direction.
