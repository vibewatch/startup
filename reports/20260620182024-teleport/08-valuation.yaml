- id: recommendation-summary
  title: Recommendation and Evidence Assessment
  body: The recommendation is research-more with medium confidence, a high risk rating, and an expensive valuation stance. Teleport appears strategically relevant, customer-validated, and well backed, but the investment committee does not need to decide whether the company is good; it needs to decide whether the entry price is supportable today. On currently public evidence, it is not. The 2022 $1.1B mark can only be defended if one assumes either meaningfully higher current ARR than the sole GetLatka estimate, a still-elevated growth rate that has not been publicly disclosed since Series C, or a premium AI-identity valuation regime that public comps do not yet validate. The evidence base is directionally useful but incomplete. Official sources strongly support the financing history, customer signaling, and product narrative, and public comps provide a clean benchmark showing that verified-sector multiples are lower than Teleport's implied estimated multiple. What is missing are the core
    financial disclosures that turn a narrative into a price. The recommendation should only improve if Teleport can verify ARR above roughly $70M, show NRR above 100%, confirm current growth at or above 25% YoY, provide visibility into gross margin and burn, and demonstrate either government-readiness progress or concrete exit timing. Until then, this remains a promising company with underwritten valuation risk.
