  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: verified-arr
    missingEvidence: Audited or CFO-attested ARR figures for 2024 and 2025, plus customer-backed revenue bridge.
    whyItMatters: The current valuation case depends on a single third-party ARR estimate that is not company verified.
    diligencePath: Request data-room ARR schedule, board materials, and cohort revenue bridge from finance leadership.
    relatedQuestionRefs:
    - QV005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Current gross margin, NRR, burn rate, and cash runway with management attribution.
    whyItMatters: Without unit economics, investors cannot judge whether the 2022 mark is premium, fair, or unsustainably rich.
    diligencePath: Request monthly KPI package from CFO and reconcile to management P&L and board decks.
    relatedQuestionRefs:
    - QV020
  - type: missing-source
    severity: material
    topic: secondary-liquidity
    missingEvidence: Any credible secondary-market price discovery, tender activity, or formal liquidity timeline.
    whyItMatters: Late-stage investors need some visibility into whether the next value-reset event is IPO, M&A, or a flat/down round.
    diligencePath: Ask management and lead investors about tender history, 409A cadence, and current financing plans.
    relatedQuestionRefs:
    - QV032
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full cap table with liquidation preferences, anti-dilution, pro rata rights, and any side letters.
    whyItMatters: Preference overhang can materially reduce common-equity outcomes even if enterprise value grows from today's mark.
    diligencePath: Obtain financing documents and updated cap-table export from company counsel before pricing any investment.
    relatedQuestionRefs:
    - QV029
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: tv004 comparable valuation table coverage
    missingEvidence: Additional disclosed private security or infrastructure access transactions at a comparable ARR scale.
    whyItMatters: The comparable set relies on two public anchors and reference bands because very few transparent private marks are public for this niche.
    diligencePath: Expand the comparable set in a data room using secondary market color, banker comps, and management-provided financing history.
    relatedTableRefs:
    - TV004
