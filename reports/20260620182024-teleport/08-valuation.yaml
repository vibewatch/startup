- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold/Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - ARR verification fails
    - Verified ARR is materially below $49M or 2025 ARR is not growing credibly
    - Entry multiple rises well beyond already-expensive public and private reference points
    - Pause or reprice below the stale $1.1B mark
  - - Growth quality disappoints
    - Current YoY growth is below 25% or NRR is below 100%
    - Base case becomes too optimistic and multiple support compresses
    - Move from research-more to avoid unless price resets
  - - Gross margin is weak
    - Gross margin is below software-like thresholds or burn is structurally heavy
    - AI or infrastructure narrative does not convert into attractive SaaS economics
    - Require a very different valuation framework or pass
  - - License change hurts funnel
    - Community-led pipeline meaningfully declines after the CE shift
    - Bottom-up differentiation and capital efficiency weaken together
    - Discount long-term growth assumptions and CAC efficiency
  - - Federal readiness stalls
    - No credible FedRAMP path for Teleport Cloud in target vertical strategy
    - Government and regulated TAM narrative becomes more limited than pitched
    - Remove federal upside from sizing and scenario ranges
  notes: These are pre-commitment diligence triggers rather than post-investment operating KPIs.
