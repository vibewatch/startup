company:
  name: Teleport
chapter:
  number: 8
  title: Valuation
  summary: Teleport remains strategically relevant, but the public evidence base does not justify underwriting the stale $1.1B March 2022 valuation mark with confidence. Using GetLatka's unconfirmed $49M 2024 ARR estimate implies about 22.4x EV/ARR, which is expensive versus CyberArk's roughly 15.8x verified public multiple and therefore supports a research-more recommendation until ARR, growth, margins, and cap-table terms are verified.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The investment thesis starts with market structure and positioning rather than current financial disclosure. Teleport sells into privileged access management and zero-trust access, two security budgets that remain strategically important even in slower software spending environments. Precedence Research sizes PAM at $4.50B in 2025 growing at 23.4% CAGR, while zero trust is a much larger $40.01B market growing at 16.39% CAGR. Teleport also benefits from a developer-led distribution story: the open-source repository has built broad awareness, the company claims 600+ customers, and official references highlight adoption by three of the top five financial services firms. The investor base—Bessemer, Insight, Kleiner Perkins, and S28—adds credibility, and the 2026 Agentic Identity Framework / Beams repositioning offers a plausible narrative for expanding beyond classic human privileged access into machine and AI-agent identity. The anti-thesis is stronger than a normal late-stage software
    diligence memo because the key underwriting variable is still not publicly verified. GetLatka''s unconfirmed $49M 2024 ARR estimate is the only current revenue anchor; if used, it implies roughly 22.4x EV/ARR against the stale $1.1B March 2022 Series C mark. That is richer than CyberArk''s roughly 15.8x verified public multiple and far above Okta''s roughly 7.1x. Competition is not theoretical: CyberArk, Okta, BeyondTrust, StrongDM, and Boundary all frame adjacent infrastructure access problems. The 2024 community-license change may also reduce the bottom-up open-source funnel that originally differentiated Teleport. Finally, the absence of FedRAMP authorization for Teleport Cloud narrows near-term federal upside, while no new primary round, IPO filing, or public liquidity signal has reset valuation expectations since 2022.'
