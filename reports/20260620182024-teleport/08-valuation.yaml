- id: valuation-context-and-comps
  title: Valuation Context and Comparable Set
  body: 'Teleport''s only disclosed valuation mark is the March 2022 Series C: $110M raised at a $1.1B post-money valuation led by Bessemer Venture Partners with Insight Venture Partners participating. Series B in 2021 added $30M, Series A in 2020 added $25M, and disclosed lifetime primary capital is therefore about $140M. No later primary financing, secondary quote, IPO filing, or other public mark has been announced in the official newsroom, leaving investors to assess a four-year-stale price against 2026 software comp conditions. The critical problem is not that $1.1B was impossible in 2022; it is that current public evidence does not confirm the operating scale that would justify keeping that mark today. GetLatka estimates 2024 ARR at $49M, but it is explicitly an estimated single-source data point rather than company disclosure. If that estimate is directionally correct, the stale mark implies about 22.4x EV/ARR. CyberArk provides the closest public PAM anchor at about $20.63B market
    cap and $1.30B TTM revenue, or roughly 15.8x. Okta, a broader identity platform that now sells privileged access, trades nearer 7.1x. Those public multiples are not perfect one-for-one equivalents, but they do establish gravity: Teleport needs either materially more ARR than $49M, much faster present-day growth than is publicly verified, or a durable AI-identity premium to deserve the old private mark. Without that proof, the valuation reads as expensive rather than simply premium.'
