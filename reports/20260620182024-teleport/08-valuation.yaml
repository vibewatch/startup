- id: TV002
  title: Investment Thesis and Anti-Thesis
  columns:
  - Side
  - Argument
  - Evidence Anchor
  - What Would Change the View
  rows:
  - - Thesis
    - Large and expanding PAM and zero-trust markets can support long-duration category growth.
    - PAM $4.50B in 2025; zero trust $40.01B in 2025.
    - Market growth slows materially or Teleport fails to convert TAM into verified ARR growth.
  - - Thesis
    - Open-source distribution, GitHub traction, and 600+ customers suggest durable product relevance.
    - GitHub stars and enterprise customer claims support awareness and adoption.
    - Evidence of community decline, weak conversion, or major customer churn would weaken this.
  - - Thesis
    - Bessemer, Insight, Kleiner Perkins, and S28 make the syndicate credible for future financing or exits.
    - Series A/B/C disclosures and investor commentary.
    - If the next round is flat/down or insiders avoid supporting a process, syndicate strength matters less.
  - - Thesis
    - The 2026 AI-agent identity repositioning could expand Teleport beyond classic human privileged access.
    - Agentic Identity Framework and Beams launches.
    - If Beams fails to monetize or remains a demo narrative, the premium should disappear.
  - - Anti-thesis
    - The only public ARR anchor is an unconfirmed $49M estimate, implying an expensive ~22.4x multiple.
    - GetLatka plus Series C valuation math.
    - Verified ARR materially above $70M with strong growth would narrow the valuation concern.
  - - Anti-thesis
    - CyberArk, Okta, BeyondTrust, StrongDM, and Boundary all pressure achievable multiples.
    - Public comp data and competitor product pages.
    - A clear feature and growth gap in Teleport's favor could support a premium again.
  - - Anti-thesis
    - The CE license change may weaken bottom-up community-led acquisition.
    - Official license-change announcement and GitHub/community context.
    - If conversion efficiency and self-serve pipeline stayed strong after the change, this risk falls.
  - - Anti-thesis
    - FedRAMP absence and no public IPO or secondary signal reduce near-term optionality.
    - FedRAMP-oriented materials without authorization plus no later financing/IPO mark.
    - Authorization progress or a formal financing/exit process would improve the risk-adjusted view.
  notes: Arguments are framed only around valuation relevance; they are not a generic quality scorecard.
