- id: exit-readiness-and-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: 'Exit readiness is mixed. On the positive side, the founding team remains visible, the company continues launching product, and the investor syndicate is deep enough to support either a strategic sale or a later IPO attempt. The most plausible strategic acquirers are large security or infrastructure vendors that already touch identity, PAM, or zero-trust workflows, such as CyberArk, Palo Alto Networks, Cisco, or Microsoft. That said, nothing in the public record indicates that Teleport is currently on an IPO path, and there is no disclosed liquidity mechanism resetting price discovery for late-stage holders. The strategic-exit argument is therefore a possibility, not a valuation backstop. The diligence burden is high because the missing evidence sits exactly where valuation should be anchored: verified ARR for 2024 and 2025, current growth rate, net revenue retention, gross margin, burn, cap-table preferences, and the practical effect of the CE license change on new logo creation.
    Federal market expansion is another gating item because Teleport discusses FedRAMP-oriented use cases but does not have public authorization for Teleport Cloud. A prudent investor should therefore treat this as a data-room-dependent decision rather than a conviction round based on narrative momentum alone.'
