- id: FM004
  title: Typical adoption path from trigger to scale
  type: flow
  layout: standard
  summary: Most Teleport evaluations appear to move from risk or compliance trigger into a scoped pilot before broader identity expansion.
  data:
    nodes:
    - id: trigger
      label: Risk or compliance trigger
      detail: Zero-trust, FedRAMP, SOC 2, or AI-agent security pressure creates budget attention.
      tone: positive
    - id: pilot
      label: Scoped infrastructure pilot
      detail: Buyer starts with SSH, Kubernetes, database, or contractor access instead of enterprise-wide identity replacement.
      tone: neutral
    - id: control-map
      label: Control and audit proof
      detail: Session recording, FIPS, and policy evidence are validated for internal or external stakeholders.
      tone: positive
    - id: expand
      label: Identity expansion
      detail: MAU and MWI pricing lets the deployment spread to more users, machines, and workflows if value is proven.
      tone: positive
    - id: scale-risk
      label: Scale or stall decision
      detail: Projects accelerate in cloud-native estates or stall where incumbent switching cost and legacy-coverage gaps dominate.
      tone: neutral
    edges:
    - from: trigger
      to: pilot
    - from: pilot
      to: control-map
    - from: control-map
      to: expand
    - from: expand
      to: scale-risk
  approximationNotes: Adoption sequence is a synthesized pattern drawn from compliance positioning, pricing structure, customer proof, and competitive constraints; it is not a disclosed funnel conversion chart.
