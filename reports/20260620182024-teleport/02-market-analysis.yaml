- id: gaps-and-constraints
  title: Adoption Barriers, Diligence Gaps, and Contradictory Evidence
  body: The biggest market-analysis constraint is not weak demand; it is weak precision. Public sources do not isolate how much of Teleport's addressable spend comes from regulated enterprises, public-sector contractors, AI-native teams, or existing customer expansion. The last disclosed financing event is still the May 2022 Series C at a $1.1 billion valuation, so the outside world is interpreting a fast-moving category through a stale capital-market anchor. The published market estimates are directionally useful but methodologically inconsistent because PAM and zero-trust reports use different scope definitions, and the accessible Fortune Business Insights PAM URL returned unrelated agricultural content instead of a usable market page. Teleport's own materials are rich on product breadth and compliance alignment, but they do not disclose public win rates, deployment duration, churn, ACV, or split between self-hosted and cloud deals. As a result, conviction on demand direction is reasonable,
    while conviction on monetizable share and efficient capture remains materially lower until management provides segment-level revenue and conversion evidence.
  claimRefs:
  - CM037
  - CM038
  - CM039
  - CM040
