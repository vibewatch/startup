- id: TM001
  title: Market definition and adjacency boundary
  columns:
  - Segment/Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer
  - Relevance to Teleport
  rows:
  - - Privileged access management for infrastructure
    - Privileged-session control, just-in-time access, audit, database and server access brokering
    - General workforce SSO, consumer identity, non-privileged app login
    - CISO / security engineering
    - Core narrow market lens and closest paid control budget
  - - Zero-trust infrastructure access
    - Identity-aware access for SSH, Kubernetes, databases, RDP, internal web apps, policy enforcement
    - Endpoint, network, and data controls not tied to infrastructure access workflows
    - Security architecture / platform engineering
    - Broader but still relevant adjacent market lens
  - - Machine and workload identity
    - Certificate issuance for bots, services, CI-CD, and infrastructure workloads
    - General secrets management or PKI spend unrelated to access workflows
    - Platform engineering / security platform
    - High relevance because Teleport monetizes MWI directly
  - - Compliance and audit automation tied to access
    - FedRAMP, SOC 2, evidence capture, session recording, access review support
    - Full GRC suite spend, external auditor fees, broad compliance consulting
    - Security / compliance / public-sector program owner
    - Adjacency that expands deal value but should not be counted as standalone TAM
  - - AI agent identity and access control
    - Identity, authorization, and audit for agentic infrastructure actions and MCP-linked workflows
    - General AI model training, application-layer copilots, and non-infrastructure AI tooling
    - Security platform / AI platform owner
    - Emerging expansion vector for Teleport's positioning
  - - Workforce IAM / CIAM / endpoint or SIEM tools
    - Only admin-access slices that directly touch infrastructure identity
    - Routine employee SSO, customer identity, endpoint prevention, general log analytics
    - CIO / IAM / IT operations
    - Adjacent but mostly excluded from core Teleport market sizing
  notes: Boundary table separates the monetizable infrastructure-identity control plane from broader identity, endpoint, and analytics categories that may influence deals but should not be counted as core TAM.
