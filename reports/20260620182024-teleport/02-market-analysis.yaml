callouts:
- calloutType: insight
  title: The cleanest market frame is infrastructure identity, not generic zero trust
  body: 'Teleport is too broad to treat as only PAM and too narrow to claim the entire zero-trust security market. The most decision-useful frame is infrastructure identity: unified access, workload identity, and audit for infrastructure operated by humans, machines, and now AI agents.'
  claimRefs:
  - CM001
  - CM013
  - CM014
  - CM027
- calloutType: risk
  title: Public evidence supports demand direction more than monetizable-share precision
  body: The market chapter can justify a positive demand thesis, but it cannot produce a high-confidence Teleport SAM or SOM because public evidence still lacks customer mix, ACV, deployment split, and a fully triangulated narrow PAM baseline.
  claimRefs:
  - CM037
  - CM038
  - CM039
  - CM045
- calloutType: recommendation
  title: Highest-value diligence asks are segment mix, conversion, and AI-security monetization
  body: Management should be asked to break revenue and pipeline by regulated enterprise, public-sector contractor, cloud-native commercial, and AI-led workloads, then show how MAU and MWI usage expand after the initial pilot. That is the shortest path to turning a strong category story into a credible valuation model.
  claimRefs:
  - CM015
  - CM021
  - CM025
  - CM037
  - CM040
