- id: FM001
  title: Market sizing lens stack
  type: pyramid
  layout: standard
  summary: Teleport sits between a narrow PAM core and a broad zero-trust ceiling, with an emerging AI identity layer increasing urgency inside the reachable middle layer.
  data:
    nodes:
    - label: TAM
      detail: Broad zero-trust security budgets spanning identity, network, application, data, and workload controls; useful as an outer ceiling, not as Teleport's direct revenue pool.
      tone: neutral
    - label: SAM
      detail: Cloud-native infrastructure access, workload identity, compliance-led access modernization, and AI-agent control planes for infrastructure workflows.
      tone: positive
    - label: SOM
      detail: Reachable near-term share appears concentrated in regulated, cloud-forward enterprises and contractors that value certificate-based unified access and audit.
      tone: neutral
  approximationNotes: Lens boundaries are analytical syntheses based on product scope and standards mapping; only the outer-market reference points come from published analyst numbers.
