  evidenceGaps:
  - type: missing-source
    severity: material
    topic: teleport-sam-isolation
    missingEvidence: Segment-level revenue or customer mix showing Teleport exposure by regulated enterprise, public-sector contractor, cloud-native commercial, and AI-led workloads.
    whyItMatters: Without segment mix and contract-value data, the chapter can describe a reasonable market lens but cannot isolate a defensible Teleport SAM or SOM.
    diligencePath: Request management reporting or board materials that break pipeline, ARR, and installed customers by segment, deployment model, and average contract size.
    relatedQuestionRefs:
    - QM007
    - QM027
  - type: conflicting-data
    severity: material
    topic: pam-market-consistency
    missingEvidence: A directly comparable narrow PAM dataset from an additional independent analyst using a clearly defined scope and current-year baseline.
    whyItMatters: Current public sizing evidence mixes PAM and zero-trust definitions, which weakens confidence in any single market-size anchor used for valuation.
    diligencePath: Add a second usable PAM analyst source or obtain banker-style market mapping that reconciles market definitions before relying on one figure.
    relatedQuestionRefs:
    - QM011
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: material
    topic: fortune-pam-access
    missingEvidence: A usable privileged access management page or report from Fortune Business Insights that actually contains PAM content.
    whyItMatters: The broken triangulation source removes one independent reference point that could have narrowed the spread across market estimates.
    diligencePath: Re-fetch the URL through a different access path or replace it with another independent analyst source that is publicly retrievable.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: go-to-market-economics
    missingEvidence: Win-rate, sales-cycle, deployment-duration, and churn data by segment.
    whyItMatters: Those metrics determine whether strong demand drivers convert into efficient market capture or merely into interest with high migration friction.
    diligencePath: Request funnel and cohort data from management, then tie it back to MAU versus MWI expansion behavior.
    relatedQuestionRefs:
    - QM017
    - QM025
