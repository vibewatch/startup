- id: TR005
  title: Kill Criteria and Monitoring Triggers
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold/Event
  - Action Implication
  rows:
  - - License/community backlash
    - Meaningful fork traction or major enterprise objections tied to v16 licensing
    - Top-of-funnel loss or named deals blocked because Community Edition is no longer treated as open source
    - Re-underwrite growth efficiency and ecosystem moat downward
  - - FedRAMP ambiguity
    - Public-sector diligence requests vendor authorization evidence
    - Teleport cannot show clear service-boundary language or any vendor authorization package
    - Delay underwriting of government expansion and escalate compliance review
  - - Control-plane resilience
    - Reference architecture and outage evidence
    - No persuasive HA, DR, or uptime evidence for self-hosted or cloud operations
    - Treat architecture fragility as thesis-negative for mission-critical deployments
  - - Financial opacity
    - Current ARR, burn, and margin pack
    - Management cannot reconcile 2024 estimate with current operating metrics
    - Haircut valuation and demand a wider downside case
  - - AI pivot execution
    - Beams beta conversion and governance milestones
    - No clear adoption, GA path, or policy controls by next diligence milestone
    - Treat AI upside as free option rather than as value-bearing core thesis
  - - Competitive displacement
    - Win-loss and renewal data
    - Legacy-support or bundle-driven losses rise against StrongDM, Okta, or CyberArk
    - Lower pricing power assumptions and sales-efficiency expectations
  notes: These triggers are intentionally monitorable so diligence can separate fixable disclosure gaps from structural reasons to stop or reprice.
