company:
  name: Teleport
chapter:
  number: 7
  title: Risks
  summary: Teleport's highest risks cluster around the June 2024 Community Edition license change, self-hosted operational complexity, large-platform competition, FedRAMP authorization ambiguity, limited current financial disclosure, and execution stretch from the new agentic AI identity push. Mitigants exist — FIPS support, security-audit transparency, enterprise traction, and real product breadth — but the residual risk profile remains elevated until legal, resilience, and current financial evidence improve.
sections:
- id: license-community-risk
  title: License Change and Open-Source Community Risk
  body: Teleport created a self-inflicted trust risk when it moved Community Edition compiled artifacts from Apache 2.0 to a commercial license starting with Teleport v16 in June 2024. The policy applies to companies with 100 or more employees or at least $10 million of annual revenue, and it also blocks resale or embedding of Community Edition artifacts. That change matters because Teleport built much of its category credibility through developer adoption and had more than 15,000 GitHub stars when the announcement was made. The source code remains available, but the practical thing most enterprises consume is the binary, image, or AMI, so the commercial restriction changes the lived developer experience even if the repository stays public. The resulting risk is broader than social-media backlash. It creates fork incentives, reduces bottom-up evangelism, complicates upgrade paths from older Apache-licensed builds, and invites criticism that Teleport is no longer behaving like a conventional
    infrastructure open-source project under the Open Source Initiative definition.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-self-hosted-risk
  title: Self-Hosted Complexity and Operational Risk
  body: 'Teleport''s architecture delivers strong control and audit benefits, but it pushes operational burden onto customers in ways that can become investment risk. Competitor materials from StrongDM argue that Teleport agents run as root on target servers, creating a meaningful privileged attack surface, and they also frame Teleport as a potential single point of failure when the control plane is not designed for high availability. Those claims are directional rather than neutral, but they align with customer-review evidence that large deployments can be complicated to configure and operate. The self-hosted model requires customers to own infrastructure sizing, patching, upgrade sequencing, disaster recovery, and outage planning for auth and proxy components. Teleport has published security-audit material and FIPS 140-3 support, which are real mitigants, but those do not erase architecture fragility or implementation complexity. FedRAMP adds another layer: Teleport documents how customers
    can satisfy control families with the product, yet the public corpus does not show Teleport Cloud itself holding a FedRAMP authorization, which can create confusion in public-sector sales cycles.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  tableRefs:
  - TR002
  figureRefs: []
- id: competitive-market-risk
  title: Competitor Pressure and Market Concentration Risk
  body: 'Teleport is operating in attractive categories, but attractive categories draw larger and better-capitalized rivals. CyberArk and Okta each carried market capitalizations above $20 billion in June 2026, with materially larger revenue bases than Teleport''s estimated scale, giving them more room to bundle privileged access, absorb product overlap, and outspend Teleport in enterprise sales. StrongDM attacks Teleport on legacy-system coverage and operational simplicity, which matters because many enterprise access estates are hybrid rather than cloud-native. HashiCorp Boundary remains an identity-aware proxy alternative with open-source roots, while AWS, Google Cloud, and Microsoft all provide native IAM and privileged-access features that can be good enough for cloud-only buyers. Teleport''s 600-plus customers and named recognition on the 2026 Fortune Cyber 60 and Citizens Cyber 66 lists show real market traction, but they also raise the bar: once a vendor is in top-tier enterprise
    evaluations, feature gaps, packaging friction, and license trust questions are tested against better-funded platforms rather than against no incumbent at all.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  tableRefs:
