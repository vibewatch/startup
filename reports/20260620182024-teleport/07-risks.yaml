callouts:
- calloutType: risk
  title: License change is the most avoidable risk on the page
  body: Teleport can mitigate many market and architecture risks through execution, but the June 2024 Community Edition licensing change is already a realized trust event. Because the company built distribution through developer goodwill, a self-inflicted licensing shock can damage funnel quality, increase fork risk, and make competitors feel safer to evaluate even when Teleport remains technically strong.
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR006
  - CR008
- calloutType: risk
  title: FedRAMP messaging needs precise diligence before underwriting public-sector upside
  body: 'Teleport clearly documents how customers can use the platform inside FedRAMP programs, and FIPS 140-3 support is a real asset. The unresolved issue is narrower but important: the public corpus reviewed here does not show Teleport Cloud itself holding a FedRAMP authorization. That ambiguity can derail late-stage procurement if buyers assume the vendor service is already authorized.'
  claimRefs:
  - CR016
  - CR017
  - CR018
- calloutType: recommendation
  title: Highest-value diligence asks are legal, resilience, and current financial proof
  body: 'Before treating Teleport as an underwritten premium infrastructure-security asset, investors should request four things: a license-transition memo covering v16+ customer obligations, hard evidence of HA and outage resilience, a precise statement of Teleport Cloud''s authorization posture in regulated environments, and a current ARR/burn package that reconciles the stale 2022 valuation with present operating reality.'
  claimRefs:
  - CR007
  - CR017
  - CR031
  - CR032
  - CR045
