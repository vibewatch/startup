  claims:
  - id: CR001
    statement: Teleport announced that Community Edition compiled artifacts moved from Apache 2.0 to a commercial license starting with Teleport v16 in June 2024.
    type: company-claimed
    topic: license-change
    sourceRefs:
    - SR001
    - SR011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR002
    sectionRefs:
    - license-community-risk
  - id: CR002
    statement: The new Community Edition terms apply to companies with at least 100 employees or $10 million of annual revenue and prohibit resale or embedding.
    type: company-claimed
    topic: license-scope
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR003
    sectionRefs:
    - license-community-risk
  - id: CR003
    statement: Teleport's repository remains public, but the practical licensing change is concentrated in binaries, images, and AMIs that many enterprises actually deploy.
    type: inferred
    topic: artifact-economics
    sourceRefs:
    - SR001
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    sectionRefs:
    - license-community-risk
  - id: CR004
    statement: The Open Source Initiative definition does not treat usage-restricted commercial licenses as open source, so Teleport Community Edition no longer fits the standard OSS definition after v16.
    type: inferred
    topic: osi-definition
    sourceRefs:
    - SR001
    - SR031
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR004
    sectionRefs:
    - license-community-risk
  - id: CR005
    statement: Teleport said the project had more than 15000 GitHub stars when it announced the license change, showing that any community backlash touches a large developer audience.
    type: company-claimed
    topic: developer-footprint
    sourceRefs:
    - SR001
    - SR011
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QR005
    sectionRefs:
    - license-community-risk
  - id: CR006
    statement: Because Teleport historically benefited from developer-led adoption, the new licensing gate can weaken bottom-up enterprise pipeline and increase willingness to test alternatives.
    type: inferred
    topic: distribution-risk
    sourceRefs:
    - SR001
    - SR011
    - SR025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR001
    sectionRefs:
    - license-community-risk
  - id: CR007
    statement: Enterprises that standardized on Apache-era Teleport builds face artifact-provenance and upgrade-review risk when moving into the v16+ commercial-license regime.
    type: inferred
    topic: upgrade-risk
    sourceRefs:
    - SR001
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
    sectionRefs:
    - license-community-risk
  - id: CR008
    statement: License-driven community distrust creates credible fork and ecosystem-goodwill risk because users who want open-source-style access controls now have clearer incentive to evaluate substitutes.
    type: inferred
    topic: fork-risk
    sourceRefs:
    - SR001
    - SR022
    - SR025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR033
    sectionRefs:
    - license-community-risk
  - id: CR009
    statement: The licensing change may improve monetization conversion, but it also introduces a reputational overhang that investors must treat as a structural distribution risk rather than as a one-time announcement artifact.
    type: inferred
    topic: monetization-tradeoff
    sourceRefs:
    - SR001
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    sectionRefs:
    - license-community-risk
  - id: CR010
    statement: StrongDM's comparison page says Teleport agents run as root on target servers, which increases the privileged software footprint on managed infrastructure.
    type: third-party-reported
    topic: root-agent
    sourceRefs:
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
    sectionRefs:
    - operational-self-hosted-risk
  - id: CR011
    statement: StrongDM also frames Teleport as a potential single point of failure when the control plane is unavailable, making high-availability design mission critical.
    type: third-party-reported
    topic: spof-risk
    sourceRefs:
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
    - QR033
    sectionRefs:
    - operational-self-hosted-risk
  - id: CR012
    statement: StrongDM positions broader legacy access support as a competitive advantage over Teleport, implying fit risk in hybrid estates with older protocols or workflows.
    type: third-party-reported
    topic: legacy-support-gap
    sourceRefs:
    - SR016
    - SR017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR015
    sectionRefs:
    - operational-self-hosted-risk
  - id: CR013
    statement: PeerSpot review evidence points to deployment and RBAC complexity in larger environments, reinforcing the view that Teleport can be operationally heavy to roll out.
    type: third-party-reported
    topic: deployment-complexity
    sourceRefs:
    - SR023
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR014
    sectionRefs:
    - operational-self-hosted-risk
  - id: CR014
    statement: Teleport's self-hosted model requires customers to own infrastructure, patching, upgrades, and resilience planning for auth and proxy services.
    type: inferred
    topic: self-hosted-burden
    sourceRefs:
    - SR006
    - SR010
    confidence: medium
