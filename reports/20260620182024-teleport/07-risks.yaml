  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: license-transition-terms
    missingEvidence: Current license FAQ, customer contract language, and any internal guidance on migration from Apache-era deployments to v16+ commercial artifacts.
    whyItMatters: Public blog language is enough to identify trust risk, but not enough to quantify customer liability, grandfathering, or enforcement posture.
    diligencePath: Request full commercial-license text, redlines from enterprise customers, and sales enablement guidance used in upgrade discussions.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: ha-and-outage-proof
    missingEvidence: Reference architectures, uptime history, disaster-recovery tests, and support data for self-hosted and cloud control planes.
    whyItMatters: Operational-resilience underwriting cannot rely on competitor criticism and review sentiment alone.
    diligencePath: Request SRE metrics, recent incident reviews, customer references for HA deployments, and upgrade-failure rates.
    relatedQuestionRefs:
    - QR012
    - QR013
    - QR014
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-pack
    missingEvidence: Current ARR, growth, net retention, burn, gross margin, and runway figures reconciled to board or fundraising materials.
    whyItMatters: The only visible ARR figure is an unverified external estimate, which is not enough to defend a premium valuation entry point.
    diligencePath: Request current board deck metrics, finance model, and any 2025-2026 fundraising or secondary materials.
    relatedQuestionRefs:
    - QR023
    - QR024
    - QR025
    - QR026
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: management-depth-and-ai-governance
    missingEvidence: Succession planning, management bench depth, Beams beta adoption metrics, and internal policy controls for agentic access governance.
    whyItMatters: AI upside should not be underwritten without evidence that the organization can support it without weakening the core access platform.
    diligencePath: Request org chart, succession plan, AI roadmap staffing split, beta conversion funnel, and internal governance policy pack.
    relatedQuestionRefs:
    - QR028
    - QR029
    - QR030
    - QR031
    - QR034
    relatedTableRefs:
    - TR004
    - TR005
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-and-license-risk-register
    missingEvidence: Customer-specific contract disputes, enforcement correspondence, and private public-sector procurement objections are not visible in the public corpus.
    whyItMatters: The regulatory and license register is deliberately partial because material legal exposure often sits in negotiated contracts and diligence-room documents, not in marketing pages.
    diligencePath: Run contract review, legal diligence, and public-sector deal review alongside product diligence before final underwriting.
    relatedTableRefs:
    - TR001
