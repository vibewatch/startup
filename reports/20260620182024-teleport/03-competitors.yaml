company:
  name: Teleport
chapter:
  number: 3
  title: Competitors
summary: Teleport competes across a layered field that includes CyberArk, BeyondTrust, and Delinea as incumbent PAM suites; StrongDM and HashiCorp Boundary as cloud-native access challengers; and Okta as an IAM-adjacent bundler. Teleport's strongest wedge is its certificate-authority architecture and unified access plane across infrastructure resources, but that moat is conditional because incumbents have larger distribution, StrongDM attacks its legacy fit and root-agent model, and the 2024 community-license change weakened one historical open-source advantage.
sections:
- id: landscape
  title: Landscape
  body: 'Teleport''s competitor set is broader than classic password-vault PAM. The closest field includes incumbent suites such as CyberArk, BeyondTrust, and Delinea; modern infrastructure-access challengers such as StrongDM and HashiCorp Boundary; and adjacency from Okta, which can extend existing workforce identity relationships into privileged server access. Bessemer''s infrastructure-access framing helps explain why buyers do not evaluate Teleport inside only one box: the practical job spans connectivity, authentication, authorization, and audit across servers, clusters, databases, and increasingly AI-operated infrastructure workflows. Independent comparison and review sites reinforce that this is the active buyer short list. The market therefore is not a winner-take-all feature race but a segmentation contest between broad enterprise incumbents, cloud-native specialists, and identity-platform bundlers, with Teleport strongest where buyers want one modern control plane rather than a
    legacy vault plus point proxies.'
  claimRefs:
  - CP015
  - CP016
  - CP017
  - CP041
  - CP042
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: incumbent-pam
  title: Incumbent PAM
  body: CyberArk, BeyondTrust, and Delinea still define the incumbent end of the market because they sell privileged access into broad enterprise and hybrid estates, not only into greenfield cloud teams. CyberArk's official positioning emphasizes a single PAM platform, cyber-risk reduction, audit and compliance outcomes, and zero-standing-privilege access across hybrid environments. BeyondTrust tells a similar story around least privilege, credential injection, and privileged remote access that can remove the need for VPNs and known credentials. Delinea's Secret Server remains anchored in vaulting, discovery, password rotation, and session monitoring, with new AI-driven session analysis language layered on top. None of these vendors market themselves as Teleport-style open infrastructure identity platforms, but the overlap is material enough that Teleport must win by architecture simplicity for modern estates, not by assuming incumbents are trapped in old password-vault workflows.
  claimRefs:
  - CP004
  - CP005
  - CP006
  - CP007
  - CP024
  - CP025
  - CP035
  tableRefs: []
  figureRefs: []
- id: cloud-native-challengers
  title: Cloud-Native Challengers
  body: 'StrongDM, HashiCorp Boundary, and Okta matter because they attack Teleport from three different angles. StrongDM competes head-on for modern infrastructure access, but it frames itself as easier for mixed estates because it supports more legacy systems and authentication methods and does not require Teleport''s exact certificate-only operating model. Boundary is narrower, yet technically important: its identity-aware proxy plus Vault integration gives it credibility for teams already standardized on HashiCorp tooling. Okta approaches the market from an IAM adjacency route, extending SSO, ephemeral server access, and session recording into Linux and Windows infrastructure for customers that already trust Okta as an identity control plane. Together these challengers show why Teleport cannot rely on cloud-native branding alone; each rival brings a distinct distribution mechanism, from platform adjacency to direct attack ads to bundle-led cross-sell.'
  claimRefs:
  - CP008
  - CP009
  - CP010
  - CP012
  - CP013
  - CP014
  - CP023
  - CP026
  - CP033
  - CP034
