- id: moat-risks
  title: Moat Risks
  body: Teleport has real switching-cost potential, but the moat is conditional rather than unbreakable. Once a customer standardizes audit logs, certificate issuance, access workflows, and compliance evidence on one platform, replacement becomes operationally painful. That dynamic benefits incumbents too, which is why CyberArk and BeyondTrust can still defend accounts even as the market modernizes. Teleport also faces three direct risks. First, large public comparables such as CyberArk and Okta have much larger balance sheets and installed bases, giving them room to bundle or discount. Second, StrongDM's adverse messaging around legacy fit and root-agent architecture gives buyers a concrete counter-thesis in hybrid estates. Third, public customer-review evidence is more supportive than hostile, but the retained set is still thin on large-scale onboarding pain, leaving investors without decisive proof that Teleport's deployment model scales frictionlessly across conservative enterprises.
