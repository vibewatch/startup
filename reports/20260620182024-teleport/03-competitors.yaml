- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat Claim
  - Supporting Evidence
  - Threat
  - Severity
  - Mitigation/Diligence Ask
  rows:
  - - Unified infrastructure identity plane
    - Teleport CA + proxy architecture spans multiple resource types under one audit model
    - CyberArk, BeyondTrust, and Okta continue adding zero-standing-privilege and session capabilities
    - High
    - Request win/loss data by resource type and proof that unified architecture shortens deployment or reduces admin burden
  - - Developer-led discovery and open-source pull
    - Public repo scale and historical community roots create awareness
    - Community-license restrictions reduce bottom-up goodwill and make Boundary-style open lineage more attractive
    - High
    - Request community funnel, self-serve conversion, and post-v16 contribution or adoption trends
  - - Modern cloud-native fit
    - Teleport and StrongDM are optimized for modern infrastructure workflows
    - StrongDM attacks Teleport on legacy coverage and root-agent architecture in hybrid estates
    - High
    - Request protocol roadmap, deployment-hardening evidence, and win-loss split for legacy-heavy prospects
  - - Compliance and trust posture
    - Security-audit publication plus identity-security docs support enterprise trust
    - Incumbents already own large compliance relationships and can bundle adjacent controls
    - Medium
    - Request enterprise reference calls in regulated sectors and control-level displacement examples
  - - AI and machine identity expansion
    - Teleport now markets Agentic Identity Framework, Beams, and machine/workload identity
    - Competitors may add agentic features quickly, while current market demand is still forming
    - Medium
    - Request attach-rate, pipeline, and monetization evidence for AI and non-human identity modules
  - - Switching-cost accumulation after rollout
    - Policy, audit, cert issuance, and access workflows can become embedded once deployed
    - Large public comparables have stronger distribution and discount capacity before Teleport is entrenched
    - High
    - Request median time-to-value, renewal or expansion data, and proof of competitive displacement against CyberArk or Okta
  notes: Risk register focuses on moat durability rather than generic product risk; severity reflects competitive pressure, not a quantified probability model.
