  - type: missing-source
    severity: material
    topic: 2026-competitor-launch-freshness
    missingEvidence: Comparable 2026 product-update or release-detail sources for CyberArk, BeyondTrust, Okta, and Boundary that would let the chapter compare recent momentum across the whole peer set.
    whyItMatters: Without freshness parity, the chapter can show Teleport's and StrongDM or Delinea's recent movement but cannot rank all major competitors on 2026 product momentum with equal confidence.
    diligencePath: Pull 2026 changelog, newsroom, or release-note sources for the major peers and update TP001 or TP002 with like-for-like recency evidence.
