- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale
  - Target Segment
  - Differentiation
  - Key Limitation
  rows:
  - - Teleport
    - Infrastructure identity / modern PAM
    - Private; 15,000+ GitHub stars and 600+ customers disclosed elsewhere
    - Cloud-native enterprises, regulated infrastructure teams, platform engineering
    - Unified CA + proxy architecture across SSH, Kubernetes, databases, RDP, workloads, and AI agents
    - Legacy-heavy estates may prefer broader protocol coverage and simpler migration narratives
  - - CyberArk
    - Incumbent enterprise PAM
    - $20.63B market cap; $1.30B TTM revenue
    - Large hybrid enterprises and regulated security teams
    - Unified PAM platform, zero-standing-privilege positioning, strong compliance and audit posture
    - Heavier legacy-enterprise motion can feel less developer-native than Teleport
  - - BeyondTrust
    - Incumbent PAM / privileged remote access
    - Large incumbent vendor; public corpus emphasizes Gartner standing rather than current financials
    - Enterprise security, third-party/vendor access, hybrid IT
    - Least-privilege framing, credential injection, VPN replacement, vendor privileged access
    - Less evidence in retained set of Teleport-style unified cloud-native control plane
  - - Delinea
    - Incumbent PAM / secret vaulting
    - Private vendor; scale not publicly quantified in retained set
    - Broad enterprise PAM buyers, especially secret-vault and rotation use cases
    - Fast deployment language, discovery, password rotation, session monitoring, AI session analysis
    - Private financial visibility is thin and architecture remains closer to classic secret management
  - - StrongDM
    - Cloud-native challenger / access broker
    - Private vendor now inside Delinea; direct attack-marketing visible
    - Hybrid enterprises needing modern plus legacy access coverage
    - Identity Firewall narrative, continuous authorization, full session visibility, broader protocol/auth method coverage
    - Relies heavily on competitor framing in retained evidence; public pricing and scale are sparse
  - - HashiCorp Boundary
    - Identity-aware access proxy
    - HashiCorp-backed product with large adjacent community
    - Platform teams already using HashiCorp identity and infrastructure stack
    - SSO plus dynamic credentials via Vault for least-privileged access
    - Narrower product surface than Teleport across databases, compliance packaging, and AI identity
  - - Okta
    - IAM-adjacent privileged access
    - $20.65B market cap; $2.91B TTM revenue
    - Existing Okta identity customers extending into server access
    - Cross-sell from workforce identity, static credential elimination, SSH/RDP session recording
    - Infrastructure depth is narrower than Teleport for Kubernetes, databases, and broader access brokering
  notes: 'Coverage is intentionally partial: it focuses on the direct and adjacent vendors most likely to appear in Teleport buyer evaluations for PAM and infrastructure identity as of June 2026, not every long-tail admin-access or cloud-native point tool.'
  enumerationScope:
    coverage: partial
    basis: Coverage of direct and adjacent vendors competing for PAM and infrastructure identity spend as of June 2026, based on official product pages, independent comparison sites, and public market data for the most visible solution classes.
