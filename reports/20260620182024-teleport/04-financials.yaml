chapter:
  number: 4
  title: Financials
  summary: >-
    Teleport is a private company with no disclosed financial statements. The only third-party revenue estimate is
    GetLatka's $49M ARR for 2024, which is unconfirmed. The $1.1B valuation from the May 2022 Series C implies a
    ~22x ARR multiple that compares unfavorably to public peers at mid-2026 market conditions. The commercial model
    is usage-based and multi-product, with natural expansion levers tied to infrastructure scale, AI agent identity,
    and a regulated-industry customer segment — but gross margin, NRR, and burn rate are completely opaque.
