  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR
      missingEvidence: >-
        Audited or management-reported annual recurring revenue, broken down by module and customer cohort,
        for fiscal years 2022–2025.
      whyItMatters: >-
        GetLatka's $49M estimate for 2024 is the only public ARR proxy and is unverified. Without actual
        financial statements, the revenue quality, growth trajectory, and valuation support cannot be
        underwritten.
      diligencePath: >-
        Request financial data room from management including ARR bridge, monthly cohort expansion/churn,
        and audited P&L.
      relatedQuestionRefs:
        - QI002
        - QI003
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Gross margin, COGS breakdown, and software gross margin trajectory for Teleport as a SaaS company.
      whyItMatters: >-
        Gross margin determines the real value of ARR. At 70%+ margin typical for infrastructure SaaS,
        $49M ARR would support a different valuation thesis than at 50% margin.
      diligencePath: >-
        Request P&L with COGS line items and SaaS Metrics snapshot from CFO.
      relatedQuestionRefs:
        - QI013
        - QI021
    - type: private-evidence-only
      severity: blocking
      topic: net-revenue-retention
      missingEvidence: >-
        Net revenue retention rate, monthly expansion rate, and churn data by cohort and customer tier.
      whyItMatters: >-
        NRR above 120% would justify a premium multiple; anything below 100% would raise serious concerns
        about platform stickiness. The current expansion model (MAU/MWI/TPR growth) could produce very high
        NRR if customers grow infrastructure rapidly, but this is unverifiable without data.
      diligencePath: >-
        Request monthly NRR data by cohort and product module from customer success or finance team.
      relatedQuestionRefs:
        - QI021
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: >-
        A refreshed valuation — either a new financing round, a 409A valuation report, or a secondary
        transaction — to replace the stale May 2022 $1.1B mark.
      whyItMatters: >-
        Public-market cybersecurity multiples declined significantly between 2022 and 2024 before partially
        recovering. The 2022 vintage mark was set at peak private-market valuations.
      diligencePath: >-
        Request most recent 409A report from company. Monitor for any public financing event, secondary
        sale, or tender offer announcement.
      relatedQuestionRefs:
        - QI007
        - QI011
        - QI025
    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: >-
        No SEC Form D or equivalent state securities filing was publicly identified for Teleport's three
        private placement rounds, preventing independent verification of investor stakes.
      whyItMatters: >-
        Without Form D filings, investor names, amounts, and round dates cannot be independently verified.
        The public capitalization record rests entirely on company-authored blog posts.
      diligencePath: >-
        Search Delaware and California state securities databases for Gravitational Inc. or Teleport Inc.
        Form D filings. Request investor verification letters from company counsel.
      relatedQuestionRefs:
        - QI020
