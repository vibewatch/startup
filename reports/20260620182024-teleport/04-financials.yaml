callouts:
  - calloutType: strength
    title: Usage-based multi-module model creates natural revenue expansion
    body: >-
      Teleport's MAU/MWI/TPR billing ties revenue to infrastructure scale without re-negotiation. Customer case
      studies across GoTo (digital platform), Exness (regulated finance), Gladly (SaaS), and ExtraHop (security)
      show broad vertical penetration. Machine/Workload Identity and AI agent modules expand the TAM beyond
      human identity.
    claimRefs:
      - CI001
      - CI033
      - CI034
      - CI035
  - calloutType: risk
    title: Stale $1.1B mark and unconfirmed $49M ARR are the central underwriting blockers
    body: >-
      The 22x implied ARR multiple at GetLatka's estimate exceeds mid-2026 public peer ranges (CyberArk 15.9x,
      Okta 7.1x). Without a confirmed ARR figure and a refreshed valuation, any current investment at or near
      the 2022 mark carries significant mark-to-market risk.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
  - calloutType: risk
    title: Gross margin, NRR, burn rate, and GTM efficiency are entirely opaque
    body: >-
      Standard SaaS unit economics are unavailable. The financial case must be treated as a market-positioning
      thesis, not a data-driven underwriting, until a full data room is disclosed with audited P&L, NRR cohort
      data, and cash position.
    claimRefs:
      - CI012
      - CI013
      - CI025
  - calloutType: insight
    title: AI agent identity opens a large new TAM but has no disclosed revenue
    body: >-
      Machine/Workload Identity documentation confirms Teleport is targeting AI agent identity as a production
      use case. The Beams AI runtime product (June 2026) and the MWI module represent a potential second growth
      wave on top of the human-identity platform. Revenue contribution is zero in the current public record.
    claimRefs:
      - CI038
      - CI039
