  - id: section-4
    title: Cost structure, capital adequacy, and financial verdict
    body: >-
      Teleport's cost structure is completely opaque in public materials. No COGS breakdown, gross margin figure,
      infrastructure cost, or personnel expense data is available. The best reference points are from public
      cybersecurity SaaS peers, where gross margins typically run 65–75% for infrastructure-oriented products.
      If Teleport's gross margin is in that range, $49M ARR could generate $32–37M in gross profit — a serviceable
      foundation, but one that must support ongoing product investment, G&A, and sales cost without disclosed
      data on what those costs are.


      Capital adequacy is similarly opaque. The company has raised $165M across three disclosed rounds, with
      the most recent $110M Series C in May 2022. No new financing has been publicly confirmed since. At an
      industry-typical cash burn rate for a company of Teleport's stage, the Series C proceeds could support
      three to five years of operations depending on burn discipline — suggesting the company may not need
      new capital immediately, but this is entirely speculative without actual balance-sheet data. No debt,
      credit facility, or project finance is disclosed.


      The financial verdict is mixed. The demand signal is real: 600+ enterprise customers, regulated-industry
      logos, and Fortune Cyber 60 recognition all indicate an active go-to-market. The revenue model is well-
      structured for land-and-expand dynamics. However, the underwriting case is blocked by fundamental opacity:
      no verified ARR, no gross margin, no NRR, no burn rate, no current valuation. The 2022 mark implies a
      multiple that is difficult to defend at current public-market comparables. Any investment at or near the
      $1.1B mark requires an updated 409A or data room disclosure to resolve the core valuation question.
    claimRefs:
