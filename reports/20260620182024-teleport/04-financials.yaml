figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Teleport converts infrastructure demand into usage-based revenue through a community-to-enterprise funnel and
      multi-module upsell, but the link between deployment scale and retained gross margin is entirely opaque.
    data:
      nodes:
        - id: community
          label: Community Edition free tier
          detail: >-
            Free for companies under 100 employees / $10M AR; creates developer-led adoption and conversion
            pipeline. License gate at Teleport 16 (June 2024) tightened the gate.
          tone: neutral
        - id: enterprise
          label: Enterprise Edition (commercial)
          detail: >-
            Usage-based pricing on MAU, MWI, and TPR; requires commercial engagement. Four billing modules.
            No list price published.
          tone: positive
        - id: multiproduct
          label: Multi-module upsell
          detail: >-
            Identity Governance, Identity Security, Machine/Workload Identity, and Beams AI agent runtimes
            each add revenue per account as adoption deepens.
          tone: positive
        - id: gross_revenue
          label: Gross ARR pool (~$49M est. 2024)
          detail: >-
            GetLatka estimates $49M ARR for 2024; unconfirmed by company. Growth rate post-Series C is
            directionally estimated at ~22% per year from inferred ARR trajectory.
          tone: neutral
        - id: costs
          label: Undisclosed cost structure
          detail: >-
            No COGS, SRE cost, or support expense data is public. Gross margin typically 65–75% for
            infrastructure SaaS, but actual figure is unknown for Teleport.
          tone: warning
        - id: retained
          label: Retained gross profit (unknown)
          detail: >-
            Cannot underwrite without gross margin disclosure. Is the anchor data point for all valuation models.
          tone: warning
      edges:
        - from: community
          to: enterprise
        - from: enterprise
          to: multiproduct
        - from: enterprise
          to: gross_revenue
        - from: multiproduct
          to: gross_revenue
        - from: gross_revenue
          to: costs
        - from: costs
          to: retained
    approximationNotes: >-
      Qualitative bridge only; no public pricing, ARPU, or gross margin data is available. ARR of $49M is an
      unconfirmed third-party estimate from GetLatka.
