  - id: trust-compliance-roadmap
    title: Trust, Compliance, and Roadmap
    body: >-
      Teleport Enterprise includes FIPS 140-validated cryptographic modules. Versions 17.7.3+ and 18.0.0+ use BoringCrypto
      CMVP certificate #4735 (FIPS 140-3); earlier versions used certificate #4407 (FIPS 140-2). This makes Teleport a
      viable accelerator for FedRAMP-Moderate authorization because it covers AC-02 through AU-12 and other NIST SP 800-53
      controls natively. Teleport also documents SOC 2 coverage across four of nine control categories (CC6, CC6 physical,
      CC7, CC8). An independent security audit by Cure53 in 2019 found no critical vulnerabilities; the single high-severity
      directory-traversal issue in the roles API was patched in the same release.

      The release cadence is one major version per year (switching from four-month cadence); version 18 is the current
      supported release (EOL August 2027) and version 17 the stable supported release (EOL August 2026). Upcoming roadmap
      items include Linux Desktop Access (remote sessions to Linux hosts), directory-sharing enhancements for Windows RDP,
      and AI-summarized session recordings in Identity Security. The community-license change starting with version 16
      (June 2024) is the most significant ongoing trust risk: compiled binaries, container images, and AMIs are no longer
      Apache-licensed for companies above 100 employees or $10 M AR. The source code remains AGPLv3, but most enterprises
      consume compiled artifacts, making the commercial restriction the effective license.
    claimRefs:
