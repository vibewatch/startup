chapter:
  number: 5
  title: Product & Technology
  summary: Teleport's Infrastructure Identity Platform delivers certificate-based, secretless access across SSH, Kubernetes, databases, Windows/RDP, internal web apps, MCP servers, and cloud APIs through a unified proxy-and-CA architecture. The platform has matured from an SSH bastion to a broad identity fabric spanning machine/workload identity, AI agentic access (Beams), and Identity Security analytics. Core technology differentiation rests on ephemeral certificates, hardware-rooted identity, and a single Go binary; the 2024 community-license change and root-agent installation requirement represent meaningful product risks flagged by competitors and users.

sections:
  - id: product-definition
    title: Product Definition and Module Map
    body: >-
      Teleport is a certificate authority (CA) and identity-aware access proxy that implements SSH, RDP, HTTPS, Kubernetes API,
      and a variety of SQL and NoSQL database protocols. The product is distributed as a single Go binary that combines
      authentication, authorization, auditing, and tunneling in one deployable unit. Teleport operates internal Certificate
      Authorities for both hosts and users; every identity — human, machine, or AI — receives a short-lived certificate
      rather than a long-lived credential, eliminating secrets sprawl at the architecture level.

      The product suite now spans five branded product pillars: Zero Trust Access (SSH, Kubernetes, databases, RDP, web apps),
      Machine & Workload Identity (non-human service credentials), Identity Governance, Identity Security (access analytics
      and threat detection), and the Agentic Identity Framework (AI agent identity + Beams runtime). The feature matrix
      distinguishes Enterprise Cloud, Enterprise Self-Hosted, and Community Edition, with Beams trusted runtimes exclusive
      to Enterprise Cloud. Each major release has shipped every four months historically; version 18 (current) arrived
      July 2025 with version 19.0 planned. The June 2024 community-license change restricted compiled binaries for companies
      with over 100 employees or $10 M+ AR, a shift with lasting ecosystem implications.
