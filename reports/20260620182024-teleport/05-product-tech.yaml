        - tsh login → short-lived cert → ssh user@host; auto audit log
        - Eliminates standing SSH keys; 80% drop in time spent on access (company-claimed)
        - Agent must run as root on target; legacy OS support limited
      - - Kubernetes cluster access
        - kubectl with long-lived kubeconfig tokens; separate RBAC per cluster
        - Teleport injects cert into kubeconfig; RBAC centralized; per-query audit
        - Single SSO for all k8s clusters; per-exec session recording
        - Agent footprint adds ops complexity
      - - Database access (Postgres/MySQL)
        - Direct DB credentials; shared passwords; no query audit
        - Teleport DB proxy; short-lived cert; query-level audit log
        - No DB credentials on developer laptop
        - Not all DB engines supported in all versions
      - - Windows desktop (RDP)
        - Separate RDP clients; VPN + RDP credentials stored on laptops
        - Browser-based RDP through Teleport Web UI; no RDP client needed
        - Screen-capture session recording; no VPN required
        - Clipboard security concern noted in user reviews
