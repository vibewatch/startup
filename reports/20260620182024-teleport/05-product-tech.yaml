        - Agent as root expands attack surface on every enrolled host
      - - tbot (MWI agent)
        - Issues and renews short-lived certificates for workloads
        - Teleport Auth Service; SPIFFE-compatible certificate format
        - tbot credential exposure if process isolation is weak
      - - Certificate Authorities
        - Sign host and user certs; enable zero-trust cluster membership
        - Hardware Security Module optional; BoringCrypto for FIPS
        - CA compromise would invalidate entire cluster; rotation automation needed
      - - Session Recording Store
        - Captures PTY/screen/query streams; tamper-resistant audit
        - S3-compatible object store or Teleport Cloud storage
        - Users can attempt to conceal PTY commands via encoding (documented risk)
