callouts:
  - calloutType: risk
    title: Root-Agent Installation and Reliability Risks
    body: Teleport agents run as root on every enrolled server, creating an additional attack surface. A competitor
      audit and independent PeerSpot users both flag this. StrongDM also claims Teleport Cloud updates can cause
      access outages of up to six hours. Teleport does not publish an uptime SLA or incident history publicly,
      making independent reliability assessment difficult.
    claimRefs:
      - CE016
      - CE018
      - CE019

  - calloutType: risk
    title: Community License Change Restricts Open-Source Ecosystem
    body: Starting with Teleport 16 (June 2024), compiled Community Edition binaries require a commercial license
      for companies with 100+ employees or $10 M+ revenue. While source code remains AGPLv3, most operators
      consume compiled artifacts, meaning the practical open-source path is materially restricted for enterprises.
      This may drive some potential customers to evaluate fully open-source alternatives like Boundary.
    claimRefs:
      - CE035
      - CE036

  - calloutType: strength
    title: Single Binary, Protocol-Agnostic Identity Fabric
    body: Teleport's architecture consolidates SSH, Kubernetes, database, RDP, web-app, MCP, and AI-agent access
      under one certificate-based identity model without requiring separate secret stores or credential rotation
      workflows. This reduces attack surface and operational complexity simultaneously, which is the core
      value proposition validated by IBM Instana, Carta, ExtraHop, and Exness deployments.
    claimRefs:
      - CE001
      - CE010
      - CE012
      - CE013

