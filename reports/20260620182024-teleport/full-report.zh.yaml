  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 许可变更与开源社区风险
        blocks:
          - type: paragraph
            body: >-
              2024 年 6 月，Teleport 从 v16 开始把 Community Edition 编译产物从 Apache 2.0 迁至商业许可，制造了一个自伤型信任风险。该政策适用于员工 100
              人及以上或年收入至少 $10 million 的公司，也禁止转售或嵌入 Community Edition 产物。这个变化很关键，因为 Teleport 很大一部分类别信誉来自开发者采用；公告发布时，项目已有超过
              15,000 个 GitHub stars。源代码仍然可用，但大多数企业实际消费的是二进制文件、镜像或 AMI，因此即使仓库保持公开，商业限制也改变了开发者的真实体验。由此产生的风险不只是社交媒体反弹。它会激励
              fork，削弱自下而上的布道，复杂化旧 Apache 许可构建的升级路径，并招致批评：Teleport 已不再像 Open Source Initiative 定义下的常规基础设施开源项目那样行事。
