      - number: '2.5'
        title: 采用障碍、尽调缺口和矛盾证据
        blocks:
          - type: paragraph
            body: >-
              市场分析最大约束不是需求弱，而是精度弱。公开来源无法隔离 Teleport 可寻址支出中有多少来自受监管企业、公共部门承包商、AI 原生团队或既有客户扩张。最近一次已披露融资事件仍是 2022 年 5 月以
              $1.1 billion 估值完成的 Series C，因此外界正用一个过时资本市场锚点解读快速变化的类别。已发布市场估算方向上有用，但方法论并不一致，因为 PAM 和零信任报告使用不同范围定义，而且可访问的
              Fortune Business Insights PAM URL 返回了无关农业内容，而不是可用市场页面。Teleport
              自有材料在产品广度和合规对齐上很丰富，但不披露公开赢单率、部署周期、流失率、ACV，或自托管与云交易的拆分。因此，对需求方向可以有合理信心；但在管理层提供分部收入和转化证据前，对可变现份额和高效捕获的信心要低得多。
