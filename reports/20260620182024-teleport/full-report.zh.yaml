      - number: '1.5'
        title: 许可证变更、FedRAMP 定位缺口和负面信号
        blocks:
          - type: paragraph
            body: >-
              近期最重大的负面进展是 2024 年 6 月社区许可证变更。从 Teleport 16 开始，公司将编译后的 Community Edition 二进制文件和容器镜像从 Apache 2.0
              改为商业许可证。新许可证只允许员工少于 100 人且年收入低于 $10M 的公司免费商业使用。源代码仓库的 AGPLv3
              许可证未变，意味着大公司仍可从源码编译，但下载预构建二进制文件的便利性现在受限。这一动作与其他 open-core 公司保护社区变现的做法一致，但也清楚收紧了社区产品，一些用户和企业对此有批评。


              FedRAMP 方面，Teleport 公开文档和营销材料称产品可帮助客户满足 FedRAMP 合规要求。Teleport Enterprise 构建使用通过 FIPS 140 验证的加密模块编译，FedRAMP
              文档页说明 Teleport 如何帮助实现具体 FedRAMP 控制项。不过，公开语料中没有证据确认 Teleport 自身云服务已获得 FedRAMP Authorization To
              Operate（ATO）。Teleport 的 FedRAMP 定位是合规赋能工具，而不是获得 FedRAMP 授权的服务提供商。联邦买家可能预期 SaaS 本身具备 ATO，因此该缺口重要。


              第三方评论平台上的负面产品信号也值得注意。PeerSpot 评论者提到初始设置复杂、RBAC 配置困难，以及与 SIEM 和监控工具集成有挑战。StrongDM 的竞品对比页面声称，Teleport
              基于代理的架构要求代理以 root 身份运行在每台被监控服务器上，创造新的攻击面；同一页面还称 Teleport Cloud
              存在可靠性问题，包括更新期间宕机。这些说法来自竞争供应商，应批判性阅读，但它们代表了买家评估时会考虑的弱点类别。
