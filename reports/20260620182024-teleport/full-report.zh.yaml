      - number: '2.3'
        title: 买家类型、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              Teleport 的买家地图是跨职能的，因为产品把安全、平台和合规工作流压缩到同一个访问层。日常用户通常是平台工程师、SRE 或 DevOps 团队、安全工程师、基础设施管理员，以及数据库或 Kubernetes
              运维人员。预算归属取决于采购触发点。安全主导的交易常落在 CISO 组织；平台主导的推广可由工程基础设施团队负责；合规主导的公共部门或受监管企业交易往往会拉入 GRC 相关方，因为 FedRAMP 和 SOC 2
              取证与访问控制同样重要。定价也强化了这种共享所有权：Teleport 按月活跃用户和机器 /
              工作负载身份收费，因此商业模型随身份采用扩张，而不是绑定一个固定设备部署规模。开发者主导评估仍然重要，因为开源仓库有超过 15,000
              颗星，但企业转化似乎在受监管和云原生组织中最强，包括大型金融服务买家。最弱契合点是遗留系统较重的混合环境，买家更看重广泛协议覆盖和更简单迁移，而不是 Teleport 的云原生深度。
