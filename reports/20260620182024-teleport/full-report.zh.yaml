        - id: costs
          label: 未披露的成本结构
          detail: 公开材料没有 COGS、SRE 成本或支持费用数据。基础设施 SaaS 毛利率通常为 65–75%，但 Teleport 的实际数字未知。
          tone: warning
        - id: retained
          label: 留存毛利润（未知）
