      - number: '4.2'
        title: 收入和 ARR 估算——完全未经验证的图景
        blocks:
          - type: paragraph
            body: >-
              Teleport 不披露任何财务数据。唯一公开 ARR 估算来自第三方数据聚合商 GetLatka，后者报告 Teleport 在 2024 年 12 月达到 $49M 收入。GetLatka 还估算截至
              2025 年底员工数约 246 人。这些数字未得到 Teleport、任何投资人或任何独立来源确认。GetLatka 自己的融资摘要显示 2 轮共 $140M，与公司披露的 3 轮 $165M
              不一致，进一步削弱了对该数据集完整性的信心。


              从融资公告披露的 ARR 增长率倒推：Series C 博客（2022 年 5 月）报告总 ARR 同比增长 2.8x、净新增 ARR 同比增长 4.5x；Series B 博客（2021 年）报告总 ARR 较
              2020 年 Q2 同比增长 2.5x、净新增 ARR 同比增长 5x。如果这些增长率正确，且公司按 Series B 时期披露所称正走向 2021 年收入三倍增长，那么 Series C 交割时隐含 ARR
              约为 $17–20M。从该水平增长到 2024 年 $49M，意味着融资后 CAGR 约 22%，较 Series C 前轨迹明显减速。没有管理层数据无法确认这一点，但它与 2022–2024 年更广泛 SaaS
              市场放缓方向一致。


              GTM 效率指标完全缺失。公开资料没有销售周期长度、CAC、回本期或 quota 达成数据。GTM 有效性的最佳代理是客户数轨迹（2025 年提到
              600+）和具名客户标识质量，但没有进一步数据，二者都无法转化为单客户收入或扩张率。
