  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围、相邻领域和替代品
        blocks:
          - type: paragraph
            body: >-
              Teleport 自身定位和产品架构决定了市场边界：比传统特权访问管理更宽，但比整个零信任堆栈更窄。公司称自己是 AI Infrastructure Identity 公司，销售基于证书的访问，覆盖
              SSH、Kubernetes、数据库、Windows、内部 Web 应用、机器身份和 AI
              相关基础设施工作流。因此，可纳入的支出是基础设施访问控制平面：特权访问、工作负载身份、访问审计，以及面向合规的基础设施访问现代化。即使这些预算有时影响交易，也不足以把广义员工 IAM、客户身份、端点安全、SIEM
              或通用 AI 应用支出计入核心市场价值。现状替代品仍然很多——VPN、堡垒机、长期密钥、数据库密码、云原生单点 IAM 和手工审计工作流都在争同一件事。StrongDM 的负面竞品视角在这里有用，因为它认为
              Teleport 对现代云资产仍是点状方案，而非通用访问平台；这是真实约束，会压住夸大的 TAM 叙事。
