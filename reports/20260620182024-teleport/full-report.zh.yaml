      - number: '2.2'
        title: 规模测算视角和估算差异
        blocks:
          - type: paragraph
            body: >-
              规模证据支持分层看法，而不是单一醒目的 TAM。Precedence Research 的狭义 PAM 视角认为 2025 年市场为 $4.50 billion；两个更宽的零信任估算则把市场放在 2024 年约
              $36.96 billion、2025 年 $40.01 billion，长期预测明显更高。Teleport
              可能位于这些视角之间，因为它解决特权基础设施访问和身份控制，但无法捕获广义零信任研究中包含的所有网络、端点、数据和应用控制支出。类别语言也仍在稳定：Bessemer
              将基础设施访问描述为一个新产品类别，这解释了为什么分析师覆盖跨越多个重叠定义，而非一套固定分类法。需求信号足以支撑真实市场，而不只是概念。Teleport 报告有 600 多家客户，2026 年调研和 2026
              年新闻室证据显示 AI 驱动的身份担忧正在快速上升。即便如此，公开证据仍无法隔离精确的 Teleport SAM 或 SOM，因为客户组合、合同价值和部署分布均未披露，而且一个 Fortune Business
              Insights PAM 来源返回的内容完全错误。
