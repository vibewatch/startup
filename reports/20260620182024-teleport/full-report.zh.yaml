      - number: '1.2'
        title: 创始人、领导层和关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              Teleport 由三位联合创始人于 2015 年创立。三人在 Rackspace 收购 Mailgun 后于 Rackspace 共事，Mailgun 是他们此前打造的开发者邮件基础设施创业公司。Ev
              Kontsevoy 担任 CEO，是公司最主要的公开声音。Alexander Klizhentas（Sasha）担任 CTO。Taylor Wakefield 担任 COO。截至本次报告日期，Teleport
              关于页面确认三人仍在活跃高管岗位。创始团队共同具备云基础设施和开发者工具背景，这是公开来源中最清晰的创始人—市场匹配信号。


              创始团队之外的领导层包括 CRO Jeff Bunten 和 CMO Diana Jovin，二人均出现在外部媒体报道中。Jovin 于 2026 年 4 月在 RSAC 被引用，新闻室也称其为
              CMO。Bunten 在关于页面列为 CRO。关键人物风险不低：Kontsevoy 签署了三次融资公告，是 Agentic Identity Framework 发布和 Fortune Cyber 60
              公告中的具名发言人，也出现在每一次主要外部访谈中。除融资轮中提到的投资人外，公司未公开更多董事会成员。
