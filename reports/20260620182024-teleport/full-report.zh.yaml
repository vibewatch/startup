  - id: FE001
    title: Teleport Infrastructure Identity Platform——产品架构栈
    type: stack
    layout: standard
    summary: 五个产品支柱叠在统一的 Auth 和 Proxy 控制平面之上。
    data:
      layers:
        - label: 智能体身份框架（Beams、LLM Proxy、Delegated Identity）
          modules:
            - Beams Firecracker VM 运行时（公开 beta，仅 Enterprise Cloud）
            - LLM Proxy——在代理和推理端点之间执行控制
            - Delegated Identity——最小权限代理会话权限
            - MCP Server Proxy——一等 MCP 注册 + 审计
        - label: Identity Security 与 Governance
          modules:
            - Identity Security（Crown Jewels 监控、SQL 编辑器、异常警报）
            - Identity Governance（访问列表、嵌套组、JIT 请求、ChatOps）
        - label: Machine & Workload Identity
          modules:
            - tbot——为工作负载签发短期 X.509 / SSH 证书
            - SPIFFE 兼容证明——没有长期服务密钥
        - label: Zero Trust Access
          modules:
            - SSH——仅证书、无 SSH 密钥、完整 PTY 审计
            - Kubernetes——按集群 RBAC + kubectl exec 会话录制
            - 数据库——PostgreSQL、MySQL、MongoDB、CockroachDB 协议代理
            - Windows/RDP——浏览器原生 RDP、屏幕级会话录制
            - Web Apps——基于身份访问的 HTTPS 代理
        - label: Auth 和 Proxy 控制平面
          modules:
            - Auth Service（CA、配置存储、gRPC API、审计日志收集器）
            - Proxy Service（TLS 路由、反向隧道、Web UI、端口 443）
            - BoringCrypto FIPS 140-3 模块（Enterprise，CMVP
            - 后端存储（etcd / DynamoDB / Postgres / Teleport Cloud 存储）
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
      - CE020
