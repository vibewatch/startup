  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和模块地图
        blocks:
          - type: paragraph
            body: >-
              Teleport 是证书颁发机构（CA）和身份感知访问代理，支持 SSH、RDP、HTTPS、Kubernetes API，以及多种 SQL 和 NoSQL 数据库协议。产品以单一 Go
              二进制文件分发，把认证、授权、审计和隧道放在一个可部署单元里。Teleport 为主机和用户运行内部 Certificate Authorities；每个身份——人、机器或
              AI——获得短期证书，而非长期凭证，从架构层面消除密钥蔓延。

              产品套件现在覆盖五个品牌化产品支柱：Zero Trust Access（SSH、Kubernetes、数据库、RDP、Web 应用）、Machine & Workload
              Identity（非人服务凭证）、Identity Governance、Identity Security（访问分析和威胁检测），以及 Agentic Identity Framework（AI 代理身份 +
              Beams 运行时）。功能矩阵区分 Enterprise Cloud、Enterprise Self-Hosted 和 Community Edition，Beams 可信运行时仅限 Enterprise
              Cloud。历史上每四个月发布一个主要版本；版本 18（当前）于 2025 年 7 月到来，版本 19.0 已规划。2024 年 6 月社区许可证变更，限制员工超过 100 人或 AR 超过 $10 M
              的公司使用编译二进制文件，这一变化对生态影响持久。
