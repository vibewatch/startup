      - number: '3.4'
        title: Teleport 差异化
        blocks:
          - type: paragraph
            body: >-
              Teleport 最清晰的差异化是结构性的，不是表面的。它的 Auth Service 充当用户、机器和资源的证书颁发机构，Proxy Service 则在 SSH、Kubernetes、数据库、RDP、Web
              应用和机器身份之间代理访问，不依赖长期共享凭证。Teleport 因此能销售一种访问平面：认证、授权和审计统一在一起，而不是由密码库、跳板机、VPN 和分散策略引擎拼接。公司也在向外扩张：近期版本强调 IdP
              攻陷缓解、更宽的身份安全层、机器和工作负载身份，以及面向 AI 系统的新 Agentic Identity Framework。这些动作扩大了 Teleport 想拥有的类别。代价是，2024
              年社区许可证变更后，Teleport 旧有开源发现优势不再那么干净，因此架构一致性比单纯社区好感更重要。
