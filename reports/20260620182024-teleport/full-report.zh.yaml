  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论与反论
        blocks:
          - type: paragraph
            body: >-
              投资正论首先来自市场结构和定位，而不是当前财务披露。Teleport 面向特权访问管理和零信任访问销售，这两类安全预算即使在软件支出放缓时仍具战略重要性。Precedence Research 估算 PAM
              2025 年规模为 $4.50B，CAGR 为 23.4%；零信任市场更大，规模 $40.01B，CAGR 为 16.39%。Teleport 还受益于开发者驱动分发：开源仓库建立了广泛认知，公司声称拥有
              600+ 客户，官方引用强调五大金融服务公司中的三家采用。投资人阵容——Bessemer、Insight、Kleiner Perkins 和 S28——增加可信度；2026 年 Agentic Identity
              Framework / Beams 重新定位，也提供了一个可讲通的叙事：从传统人类特权访问扩张到机器和 AI agent 身份。反论比普通后期软件尽调备忘录更强，因为关键承销变量仍未公开验证。GetLatka
              未确认的 2024 年 $49M ARR 估算，是唯一当前收入锚；若采用该数字，相对过时的 2022 年 3 月 $1.1B Series C 标记，隐含约 22.4 倍 EV / ARR。这个水平高于
              CyberArk 约 15.8 倍的经验证公开倍数，也远高于 Okta 约 7.1 倍。竞争并非理论风险：CyberArk、Okta、BeyondTrust、StrongDM 和 Boundary
              都在定义相邻的基础设施访问问题。2024 年社区许可变更也可能削弱最初让 Teleport 差异化的自下而上开源漏斗。最后，Teleport Cloud 缺少 FedRAMP 授权压窄了近期联邦市场上行，而
              2022 年以来没有新一级融资、IPO 申报或公开流动性信号来重置估值预期。
