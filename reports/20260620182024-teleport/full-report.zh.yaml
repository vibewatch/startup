    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命、产品和总部
        blocks:
          - type: paragraph
            body: >-
              Teleport 自称「AI Infrastructure Identity Company」，总部位于加利福尼亚州奥克兰 Franklin St 2100 号 Suite 400，邮编
              94612。公司为基础设施改造身份、访问和策略，把产品定位成一个平台：既提升工程速度，也增强对身份攻击的韧性。公司最初注册为 Gravitational Inc.，2021 年更名为 Teleport，并从
              gravitational.com 迁至 goteleport.com；宣布更名的博客明确称，Teleport 产品已成为公司的主要重心。法律实体在包签名证书上仍保留 Gravitational Inc.
              公司名（Apple Developer ID QH8AA5B8UP Gravitational Inc.），证明公司延续性。


              Teleport 将产品描述为统一身份层，用证书颁发机构模型取代服务器（SSH）、Kubernetes、数据库、RDP、Web 应用和 MCP
              服务器之间碎片化的访问管理系统；该模型为请求者身份签发短期凭证。该架构与 NIST SP 800-207 Zero Trust Architecture
              框架一致：零信任消除基于网络位置的隐式信任，并要求每次请求都认证和授权。公开定价页显示，收入模型按用量计费，计量口径包括 Monthly Active Users（MAU）、Machine and
              Workload Identities（MWI）和 Teleport Protected Resources（TPR）。Community Edition 对员工少于 100 人且年收入低于 $10M
              的公司免费，Enterprise Edition 则需要商业接洽。公司为私有企业；未公开收入、利润率、现金或烧钱数据。
