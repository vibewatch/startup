      - number: '1.3'
        title: 融资历史、估值和资本结构
        blocks:
          - type: paragraph
            body: >-
              Teleport 已披露三轮融资，总额 $165M。首轮是 Kleiner Perkins 领投的 $25M Series A，公司当时仍以 Gravitational 名义运营，并在公司博客上宣布。Series
              A 博客列出早期客户 NASDAQ、Splunk、TicketMaster、Mulesoft 和 Samsung，并称公司近期已实现盈利。随后是 2021 年由 S28 Capital 和 Kleiner
              Perkins 领投的 $30M Series B；该轮发生在一个季度之后，当季净新增 ARR 同比增长 5x，总 ARR 较 2020 年 Q2 增长 2.5x，说明公司收入正从较小基数快速放大。公司当时未披露
              ARR 金额。


              最大一轮是 2022 年 5 月宣布的 $110M Series C，由 Bessemer Venture Partners 领投，Insight Venture Partners 参投，估值
              $1.1B。Bessemer 投资博客（bvp.com）和 Teleport 公告博客均确认该估值。Series C 当时披露总 ARR 同比增长 2.8x、净新增 ARR 增长 4.5x，距离 Series B
              不到一年。Bessemer 的 Mary D'Onofrio 加入董事会；Insight 的 Matt Koran 担任董事会观察员。未发现 2022 年 5
              月之后后续融资轮的公开证据。因此，截至本次报告日期，$1.1B 估值标记已有约四年，私募市场环境也已明显变化。


              第三方数据聚合商 GetLatka 在 2025 年快照中称 Teleport 两轮融资共 $140M，这与公司披露的三轮 $165M 不一致。GetLatka 还估算公司 2024 年收入为 $49M，2025
              年底员工数约 246 人；这些数字是未经确认的第三方估算，不应视为已验证财务数据。
