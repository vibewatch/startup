      - number: '5.2'
        title: 架构和运行模型
        blocks:
          - type: paragraph
            body: >-
              Teleport 控制平面由两项标准服务组成：Auth Service（集群 CA、配置存储和审计日志收集器）与 Proxy Service（公网入口和反向隧道枢纽）。两项服务彼此之间无状态，通过 gRPC
              通信，并可水平扩展以实现高可用。在 Teleport Cloud 上，两项服务均由 Teleport Inc. 全托管；在 Enterprise Self-Hosted 中，客户在自有基础设施上运行它们。

              资源接入有三条路径：Teleport Agents（以守护进程部署在目标机器上，并反向隧道回 Proxy）、部分协议的无代理模式，以及 Machine & Workload Identity tokens（基于
              tbot 的工作负载短期证书）。认证流程跨协议一致：用户（或机器）运行 tsh login，获得客户端证书，随后 SSH、Kubernetes、数据库、RDP 和 MCP
              代理接受该证书，无需重新认证。会话录制可在节点或代理层配置，可同步或异步，并捕获 SSH 与 Kubernetes 的完整 PTY 输出、桌面会话屏幕内容，以及数据库会话查询流。

              StrongDM 的竞争分析指出，Teleport agents 在目标服务器上以 root 身份运行，增加额外攻击面；该公司还批评其遗留协议支持有限、云可靠性间歇性不足。PeerSpot
              用户也独立指出，RBAC 复杂、初始设置负担重，以及 RDP 会话中的剪贴板访问安全，是实际摩擦点。
