  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业模型、收入结构和客户基础
        blocks:
          - type: paragraph
            body: >-
              Teleport 的商业模型按用量计费且多产品。定价页披露三项计费指标：Zero Trust Access 和 Identity Governance 模块的 Monthly Active
              Users（MAU），Machine and Workload Identity 模块的 Machine / Workload Identities（MWI），以及 Identity Security 的
              Teleport Protected Resources（TPR）。未公开标价；所有定价都需要与销售团队商业接洽。Enterprise Edition 支持云、本地部署（标准和
              FIPS）、多区域高可用和混合部署模式。Beams AI 代理运行时产品于 2026 年 6 月进入公开测试版，尚未公开定价。


              Community Edition 免费层——自 2024 年 6 月许可证变更后，面向员工少于 100 人且年收入低于 $10M
              的公司——有意把客户增长转化为商业升级触发器。客户案例显示企业部署广度：GoTo（印度尼西亚最大数字平台，管理复杂基础设施上的多云访问）、Exness（安全要求严格的受监管全球交易公司）、Gladly（有 SOC
              2 合规要求的 SaaS 平台）和 ExtraHop（聚焦安全的云网络检测公司）。每个案例代表不同垂直行业和合规姿态。招聘页面称，截至 2025 年 10 月，全球客户超过 600 家。


              公开材料中可见的收入驱动因素包括：（1）随着基础设施规模扩大，MAU、MWI 和 TPR 指标增长，不必重新谈判即可带来用量扩张；（2）公司跨过 100 名员工或 $10M AR
              门槛后，从社区版转向企业版；（3）客户采用 Identity Governance、Identity Security 和 AI 代理身份模块，带来多模块加购；（4）通过 Beams 和 Machine
              Workload Identity 模块切入 AI 代理市场机会。会话录制、数据库访问和 MCP 服务器访问也在合规敏感行业创造加购。
