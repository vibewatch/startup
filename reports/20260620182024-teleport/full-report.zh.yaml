  - id: FM001
    title: 市场规模分层视角
    type: pyramid
    layout: standard
    summary: Teleport 处在狭义 PAM 核心与广义 zero-trust 天花板之间；新兴 AI 身份层又在可触达的中间层里抬高紧迫性。
    data:
      nodes:
        - label: TAM
          detail: 广义 zero-trust 安全预算横跨身份、网络、应用、数据和 workload 控制；适合作为外层天花板，而不是 Teleport 的直接收入池。
          tone: neutral
        - label: SAM
          detail: 云原生基础设施访问、workload 身份、合规驱动的访问现代化，以及面向基础设施工作流的 AI-agent 控制平面。
          tone: positive
        - label: SOM
          detail: 近期可触达份额似乎集中在受监管、云优先的企业和承包商，它们看重基于证书的统一访问和审计。
          tone: neutral
    approximationNotes: 分层边界是基于产品范围和标准映射的分析综合；只有外层市场参考点来自已发布的分析师数字。
    claimRefs:
      - CM013
      - CM014
      - CM015
      - CM017
