      - number: '7.3'
        title: 竞争压力与市场集中风险
        blocks:
          - type: paragraph
            body: >-
              Teleport 所处赛道有吸引力，但有吸引力的赛道会吸引更大、资金更充足的对手。2026 年 6 月，CyberArk 和 Okta 的市值均超过 $20 billion，收入基数也明显大于 Teleport
              的估算规模，因此更有空间捆绑特权访问、吸收产品重叠，并在企业销售上压过 Teleport。StrongDM 攻击 Teleport
              的传统系统覆盖和运营简单性；这很重要，因为许多企业访问资产是混合形态，而非云原生。HashiCorp Boundary 仍是一个带开源根基的身份感知代理替代方案；AWS、Google Cloud 和
              Microsoft 也都提供原生 IAM 与特权访问功能，对只用云的买家可能已经足够。              Teleport 的 600 多家客户，以及登上 2026 Fortune Cyber 60 和
              Citizens Cyber 66
              榜单的具名认可，证明了真实市场牵引力，但也提高了门槛：一旦供应商进入顶级企业评估，功能缺口、打包摩擦和许可信任问题，都会被拿来与资金更充足的平台比较，而不是与没有既有供应商的空白局面比较。
