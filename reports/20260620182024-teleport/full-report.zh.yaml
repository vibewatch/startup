      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Teleport 不公开披露 NRR、GRR、logo 流失或续约率。Series C 博客提到 ARR 同比增长 2.8 倍、净新增 ARR 增长 4.5 倍，符合来自现有客户的强扩张特征，但这些数字来自
              2022 年，如今已是历史数据。PeerSpot 用户称 Teleport「通过集中访问控制改变了我们的工作流」，多位评论者把它描述为替代传统 SSH 密钥流程的粘性工具——两者都指向较高切换成本。

              Exness（数百个 Kubernetes 集群）、GoTo（多云、多垂直）和 ExtraHop（数百个独立节点）的企业部署深度，说明 Teleport 已嵌入基础设施，形成有意义的切换成本。IBM
              Instana 的云架构师明确提到，这是他在不同公司推动的第三次 Teleport 部署，是顾问驱动重复采用的强信号。

              扩张风险：StrongDM 的竞争批评认为，Teleport 缺少传统协议支持和 SIEM 集成，这可能限制其向混合传统 /
              云环境客户扩张。社区许可变更（v16+）限制了大型公司的免费社区层，可能增加社区漏斗转商业扩张的摩擦。集中度是实质风险：公开具名客户明显偏向金融科技和云基础设施里的技术原生公司；医疗、制造、政府和零售行业在公开证据中代表性不足。Fortune
              Cyber 60 提到「五大金融服务公司中的三家」，说明单一垂直行业集中度显著。
