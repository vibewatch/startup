      - number: '7.4'
        title: 财务不透明与估值风险
        blocks:
          - type: paragraph
            body: >-
              Teleport 的财务争议更多来自可见度缺失，而不是可见弱点。公开融资历史清楚到 2022 年 3 月 Series C：Teleport 宣布由 Bessemer Venture Partners 领投，以
              $1.1 billion 估值融资 $110 million，Series A、B、C 累计融资约 $140 million。看不清的是当前规模、利润率结构、现金效率和盈利能力。来源集合中唯一 ARR 数字是
              GetLatka 对 2024 年 $49 million 的估算，且 Teleport 未验证。若该数字方向正确，最后披露估值意味着约 22 倍 ARR
              倍数；对一家没有公开增长耐久性证明的私有基础设施公司而言，这个要求很高。给定材料中没有更新融资可见，投资者只能围绕一个已过时四年的价格锚承销。旧估值、估算 ARR
              和缺失的单位经济数据叠加，使下行更难量化，也让资源更强的上市可比公司对市场情绪有更大影响。
            claimRefs:
