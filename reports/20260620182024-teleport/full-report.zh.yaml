        title: 自托管复杂性与运营风险
        blocks:
          - type: paragraph
            body: >-
              Teleport 的架构带来强控制和审计收益，但也把运营负担推给客户，可能演变为投资风险。StrongDM 的竞争材料称，Teleport agent 在目标服务器上以 root
              运行，形成有意义的特权攻击面；他们还把 Teleport
              描述为潜在单点故障，前提是控制平面没有按高可用设计。这些说法带有方向性，并非中立评价，但与客户评论中的证据相吻合：大型部署配置和运营都可能复杂。自托管模式要求客户自行负责 auth 和 proxy
              组件的基础设施容量、补丁、升级顺序、灾难恢复和宕机预案。Teleport 发布过安全审计材料并支持 FIPS 140-3，这些确实是缓释因素，但无法抹掉架构脆弱性或实施复杂度。FedRAMP
              又增加一层：Teleport 文档说明客户如何用产品满足控制族要求，但公开材料没有显示 Teleport Cloud 自身持有 FedRAMP 授权，这会在公共部门销售周期中制造混淆。
