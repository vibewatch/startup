      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度喜忧参半。积极一面是，创始团队仍然可见，公司继续推出产品，投资人联盟也足够深，可以支持战略出售或后续 IPO 尝试。最可能的战略收购方是已经触达身份、PAM 或零信任工作流的大型安全或基础设施厂商，例如
              CyberArk、Palo Alto Networks、Cisco 或 Microsoft。话虽如此，公开记录中没有任何迹象显示 Teleport 当前处在 IPO
              路径上，也没有披露的流动性机制为后期持有人重置价格发现。因此，战略退出论点只是一种可能性，不是估值托底。尽调负担很高，因为缺失证据正好落在估值应当锚定的位置：2024 和 2025 年经验证
              ARR、当前增长率、净收入留存、毛利率、burn、股权结构优先权，以及 CE 许可变更对新 logo 生成的实际影响。联邦市场扩张也是门槛项，因为 Teleport 讨论了面向 FedRAMP 的用例，但
              Teleport Cloud 没有公开授权。因此，谨慎投资者应把它视为依赖 data room 的决策，而不是单靠叙事动能就能形成确信的一轮。
