      - number: '5.4'
        title: 信任、合规和路线图
        blocks:
          - type: paragraph
            body: >-
              Teleport Enterprise 包含通过 FIPS 140 验证的加密模块。版本 17.7.3+ 和 18.0.0+ 使用 BoringCrypto CMVP certificate #4735（FIPS
              140-3）；更早版本使用 certificate #4407（FIPS 140-2）。这让 Teleport 成为 FedRAMP-Moderate 授权的可行加速器，因为它原生覆盖 AC-02 到 AU-12
              及其他 NIST SP 800-53 控制项。Teleport 还记录了 SOC 2 在九个控制类别中的四项覆盖（CC6、CC6 physical、CC7、CC8）。Cure53 于 2019
              年进行的独立安全审计未发现严重漏洞；roles API 中一个高危目录遍历问题已在同一版本修复。

              发布节奏为每年一个主要版本（从四个月节奏切换而来）；版本 18 是当前受支持版本（EOL 2027 年 8 月），版本 17 是稳定受支持版本（EOL 2026 年 8 月）。即将到来的路线图事项包括 Linux
              Desktop Access（到 Linux 主机的远程会话）、Windows RDP 的目录共享增强，以及 Identity Security 中 AI 总结的会话录制。从版本 16（2024 年 6
              月）开始的社区许可证变更，是最重大的持续信任风险：员工超过 100 人或 AR 超过 $10 M 的公司使用编译二进制文件、容器镜像和 AMI，不再适用 Apache 许可证。源代码仍是
              AGPLv3，但多数企业使用编译产物，因此商业限制成为事实许可证。
