  - id: FM003
    title: 买方与细分决策地图
    type: matrix
    layout: wide
    summary: 安全、平台、合规和 AI 相关方都会参与，但占比随细分市场和触发因素而变。
    data:
      columns:
        - 安全主导
        - 平台主导
        - 合规主导
        - AI 主导
      rows:
        - label: 受监管云企业
          values:
            - label: 主要
              tone: positive
              detail: CISO 或安全平台通常发起访问现代化项目。
            - label: 共同
              tone: neutral
              detail: 平台团队负责落地和日常使用。
            - label: 高
              tone: positive
              detail: 审计证据和会话录制很重要。
            - label: 新兴
              tone: neutral
              detail: agent 项目进入基础设施后，AI 身份开始变得相关。
        - label: 联邦 / 公共部门承包商
          values:
            - label: 高
              tone: positive
              detail: 安全控制是授权和采购的核心。
            - label: 共同
              tone: neutral
              detail: 采购完成后由运营团队运行系统。
            - label: 主要
              tone: positive
              detail: FedRAMP 和 FIPS 问题抬高合规负责人的权重。
            - label: 低
              tone: neutral
              detail: AI 主导的需求存在，但今天不是第一触发因素。
        - label: 平台原生 SaaS
          values:
            - label: 共同
              tone: neutral
              detail: 安全团队会批准，但不一定独自持有预算。
            - label: 主要
              tone: positive
              detail: 平台工程通常最先感到碎片化访问的痛点。
            - label: 低
              tone: neutral
              detail: 除非买方服务受监管客户，否则合规通常更晚才重要。
            - label: 新兴
              tone: neutral
              detail: agent 工作流可能随时间带来第二条预算线。
        - label: AI-native 基础设施团队
          values:
            - label: 共同
              tone: neutral
              detail: 安全仍然治理最小权限和审计。
            - label: 高
              tone: positive
              detail: 平台和 MLOps 团队需要给 agent 接上身份管道。
            - label: 低
              tone: neutral
              detail: 试点阶段，正式合规通常是次要事项。
            - label: 主要
              tone: positive
              detail: 非人类身份和 MCP-linked 访问是核心触发因素。
        - label: 传统系统重的混合企业
          values:
            - label: 共同
              tone: neutral
              detail: 安全团队看得到风险，但迁移太难时可能犹豫。
            - label: 中
              tone: neutral
              detail: 传统系统占主导时，平台收益较低。
            - label: 中
              tone: neutral
              detail: 合规可以帮助证明变更必要性，但未必能克服适配问题。
            - label: 低
              tone: negative
              detail: AI 主导的紧迫性很少压过协议覆盖顾虑。
    approximationNotes: 矩阵单元格是基于产品范围、定价、合规用例、社区信号和竞争对手负面定位综合出的定性权重，不是披露的细分收入组合。
    claimRefs:
      - CM020
      - CM021
      - CM022
      - CM024
      - CM025
      - CM026
      - CM017
      - CM036
  - id: FM004
    title: 从触发到规模化的典型采用路径
    type: flow
    layout: standard
    summary: 多数 Teleport 评估似乎从风险或合规触发开始，先进入范围明确的试点，再推进更广的身份扩张。
    data:
      nodes:
        - id: trigger
          label: 风险或合规触发
          detail: Zero-trust、FedRAMP、SOC 2 或 AI-agent 安全压力带来预算关注。
          tone: positive
        - id: pilot
          label: 范围明确的基础设施试点
          detail: 买方先从 SSH、Kubernetes、数据库或承包商访问切入，而不是替换全企业身份系统。
          tone: neutral
        - id: control-map
          label: 控制和审计证明
          detail: 为内部或外部相关方验证会话录制、FIPS 和策略证据。
          tone: positive
        - id: expand
          label: 身份扩张
          detail: 如果价值被证明，MAU 和 MWI 定价让部署扩展到更多用户、机器和工作流。
          tone: positive
        - id: scale-risk
          label: 扩张或停滞决策
          detail: 项目在云原生资产中加速；若 incumbent 切换成本和传统覆盖缺口占主导，则停滞。
          tone: neutral
      edges:
        - from: trigger
          to: pilot
        - from: pilot
          to: control-map
        - from: control-map
          to: expand
        - from: expand
          to: scale-risk
    approximationNotes: 采用顺序是从合规定位、定价结构、客户证明和竞争约束中综合出的模式；它不是已披露的漏斗转化图。
    claimRefs:
