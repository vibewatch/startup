      - number: '4.3'
        title: 估值和上市可比公司倍数
        blocks:
          - type: paragraph
            body: >-
              Teleport 唯一外部估值数据点是 2022 年 5 月 Series C 的 $1.1B 标记。截至 2026 年 6 月，该标记已有约四年，且未更新。按 GetLatka 估算的 $49M
              ARR，隐含收入倍数约 22.4x——显著高于 2026 年中可比上市网络安全公司的交易水平。


              CyberArk Software（CYBR）是特权访问管理领域最接近的上市可比公司，截至 2026 年 6 月市值约 $20.63B，TTM 收入约 $1.30B，隐含收入倍数约 15.9x。CyberArk
              收入从 2022 年约 $590M 增至 2025 年 TTM $1.30B，约三年增长 2.2x。Okta（OKTA）是最接近的身份与访问管理可比公司，截至 2026 年 6 月市值约 $20.65B，TTM
              收入约 $2.91B，隐含约 7.1x。Okta 收入同期从 $1.85B 增至 $2.91B（增长 1.6x）。两家公司收入规模都远高于 Teleport 的估算 ARR。


              按这两家上市同行收入倍数中点（约 11x）计算，$49M ARR 对应 Teleport 企业价值约 $540M，远低于 $1.1B 标记。即使按 CyberArk 15.9x 倍数，隐含价值也约
              $779M。2022 年 5 月 Series C 交割时，CyberArk 自身以约 $5.27B 市值对应 $590M 收入（约 9x），Okta 以约 $10.94B 对应 $1.85B 收入（约
              6x），说明 Teleport 22x+ 的隐含倍数在发行时已经约为可比区间的 2x。2022 年后市场调整之下，2022 年标记中隐含的私募市场溢价可能进一步侵蚀。
