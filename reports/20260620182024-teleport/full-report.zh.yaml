  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局
        blocks:
          - type: paragraph
            body: >-
              Teleport 的竞争集合比传统密码库 PAM 更宽。最接近的阵营包括 CyberArk、BeyondTrust、Delinea 等老牌套件；StrongDM、HashiCorp Boundary
              等现代基础设施访问挑战者；以及来自 Okta 的相邻竞争，Okta 可以把既有员工身份关系延伸到特权服务器访问。Bessemer 对基础设施访问的定义解释了为什么买家不会只在一个框里评估
              Teleport：实际任务横跨服务器、集群、数据库，以及越来越多由 AI
              操作的基础设施工作流，包含连接、认证、授权和审计。独立对比与评论网站也强化了这份活跃买家候选名单。这个市场因此不是赢家通吃的功能竞赛，而是广义企业既有厂商、云原生专家和身份平台捆绑方之间的分层竞争；Teleport
              在买家想要一个现代控制平面，而不是遗留密码库加点状代理时最强。
