      - number: '3.2'
        title: 老牌 PAM
        blocks:
          - type: paragraph
            body: >-
              CyberArk、BeyondTrust 和 Delinea 仍定义市场中的既有厂商一端，因为它们把特权访问卖给广义企业和混合环境，而不只是卖给绿地云团队。CyberArk 官方定位强调单一 PAM
              平台、降低网络风险、审计与合规结果，以及跨混合环境的零常驻特权访问。BeyondTrust 讲述类似故事，围绕最小权限、凭证注入和特权远程访问，可消除对 VPN 和已知凭证的需求。Delinea 的 Secret
              Server 仍锚定凭证库、发现、密码轮换和会话监控，并在其上叠加新的 AI 驱动会话分析表述。这些供应商都没有把自己营销成 Teleport 式开放基础设施身份平台，但重叠已经足够实质，Teleport
              必须靠现代环境中的架构简洁性取胜，而不能假设既有厂商被困在旧密码库工作流里。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP024
              - CP025
              - CP035
      - number: '3.3'
        title: 云原生挑战者
        blocks:
          - type: paragraph
            body: >-
              StrongDM、HashiCorp Boundary 和 Okta 重要，是因为它们从三个不同角度攻击 Teleport。StrongDM
              在现代基础设施访问上正面竞争，但它把自己包装成更适合混合环境：支持更多遗留系统和认证方法，也不要求 Teleport 那套精确的纯证书运行模型。Boundary 范围更窄，但技术上重要：身份感知代理加 Vault
              集成，让它在已标准化 HashiCorp 工具的团队中有可信度。Okta 从 IAM 相邻路线切入市场，把 SSO、临时服务器访问和会话录制延伸到 Linux 与 Windows 基础设施，面向已经信任 Okta
              作为身份控制平面的客户。这些挑战者共同说明，Teleport 不能只靠云原生品牌；每个对手都带来不同分发机制，从平台相邻、直接攻击广告，到捆绑式交叉销售。
