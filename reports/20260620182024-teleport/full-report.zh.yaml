  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Teleport 通过社区到企业的漏斗和多模块追加销售，把基础设施需求转成按用量计费的收入，但部署规模与留存毛利率之间的关系完全不透明。
    data:
      nodes:
        - id: community
          label: Community Edition 免费层
          detail: 面向 100 名员工以下 / $10M AR 以下公司免费；带来开发者主导的采用和转化管线。Teleport 16（2024 年 6 月）的许可门槛收紧了入口。
          tone: neutral
        - id: enterprise
          label: Enterprise Edition（商业版）
          detail: 基于 MAU、MWI 和 TPR 的用量定价；需要商务接洽。四个计费模块。未公布标价。
          tone: positive
        - id: multiproduct
          label: 多模块追加销售
          detail: Identity Governance、Identity Security、Machine/Workload Identity 和 Beams AI 代理运行时，都会在采用加深后增加单客户收入。
          tone: positive
        - id: gross_revenue
          label: 总 ARR 池（2024 年估计约 $49M）
          detail: GetLatka 估计 2024 年 ARR 为 $49M；公司未确认。Series C 之后的增长率按推断 ARR 轨迹方向性估计为每年约 22%。
