      - number: '2.4'
        title: 监管、AI、云和安全驱动因素
        blocks:
          - type: paragraph
            body: >-
              标准、合规压力、云复杂度和新的 AI 代理风险共同把需求向前拉。NIST SP 800-207 给零信任正式架构定义，CISA 的 Zero Trust Maturity Model
              又把该架构落实到五大支柱和三项跨领域能力，为围绕身份的基础设施控制预算提供正当性。当这些抽象框架转化为具体 FedRAMP 和 SOC 2 访问控制要求时，Teleport 受益，尤其因为它记录了 FIPS
              140 支持和控制项映射。AI 是更尖锐的近期催化剂。Teleport 2026 年调研称，92% 受访者有近期 AI 计划，79% 正在评估或部署 agentic AI，只有 13% 觉得准备极充分，60%
              已发生或怀疑发生 AI 相关事件。另一组 2026 年新闻室数据称，73% 网络安全领导者正在听到企业对 AI
              代理安全的提问。与此同时，多云蔓延和云时代向统一控制平面的更广泛迁移也支撑类别。主要采用阻力不是没有需求，而是切换成本：买家仍要拆掉存量方案、重构访问路径，并判断 Teleport
              的现代云强项是否足以压过遗留覆盖担忧。
