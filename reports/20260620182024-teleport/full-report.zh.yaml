        title: 客户分层和购买画像
        blocks:
          - type: paragraph
            body: >-
              Teleport 的买方主要是中大型企业里的工程团队或平台安全团队，技术、金融服务和全球数字平台公司尤其典型。采购决策通常由基础设施工程负责人（工程副总裁、平台工程师、CISO）推动，DevOps 和 SRE
              团队是核心用户。官方客户页和案例研究呈现出一致模式：企业希望用基于证书的基础设施访问，替代 VPN 加共享凭证的做法。

              公开案例覆盖的垂直行业包括金融科技（Carta、Exness）、全球 SaaS 平台（GoTo、Gladly）、网络检测（ExtraHop）和企业可观测性（IBM Instana）。Series A 融资公告点名
              Nasdaq（证券交易所）、Splunk（SIEM / 可观测性）、TicketMaster（现场娱乐）、Mulesoft（API 集成）和 Samsung（消费电子）；Series C 则明确点名
              Nasdaq、DoorDash 和 Snowflake。Fortune Cyber 60 新闻稿（2025 年 10 月）称，「超过 600 家公司，包括五大金融服务公司中的三家，以及 AI
              研究、算力和云领域的领导者」依赖 Teleport——这是迄今最宽泛的客户基数表述，但来自公司自身。

              地域上，客户高度集中在北美和全球科技公司，GoTo 总部在东南亚（印度尼西亚），Exness 则在全球金融市场运营。公司规模从成长阶段企业（Series B
