      - number: '1.4'
        title: 里程碑、规模和产品演进
        blocks:
          - type: paragraph
            body: >-
              Teleport 的里程碑显示，公司用约十年时间从面向开发者的访问工具，走向完整基础设施身份平台。开源 Teleport 项目于 2016 年在 GitHub 以 AGPLv3 许可证公开；到 2024 年 6
              月社区许可证博客发布时，仓库已累计超过 15,000 颗星。公司在连续几个大版本中加入 Kubernetes 访问、数据库访问（PostgreSQL、MongoDB、MySQL）、Windows RDP
              访问，最近又加入 MCP 服务器访问。Teleport 16（2024 年 6 月）和 Teleport 17（2024 年 10 月）是最近两个主要版本，Teleport 已改用每年一个主要版本的发布节奏。


              官方材料中的具名客户标识包括
              NASDAQ、Snowflake、DoorDash、IBM（Instana）、Carta、GoTo、Exness、KnowBe4、Turo、Gladly、ThredUP、ExtraHop
              等。案例研究页面列出十余个详细案例，招聘页面称「全球超过 600 家客户」。公司在 2025 年和 2026 年获得 Fortune Cyber 60 榜单（2025 年 10 月）和 Citizens
              Securities Cyber 66 榜单（2026 年 4 月）认可。2026 年 1 月，Teleport 发布 Agentic Identity Framework，这是一条面向生产基础设施中 AI
              代理安全的 AI 路线图。2026 年 6 月，Teleport 宣布 Beams，这是在 beams.run 为 AI 代理提供可信运行时的新产品。
