            body: >-
              Teleport 现在的战略风险来自两线作战：既要守住成熟的基础设施访问业务，又要扩张到 agentic AI identity。领导层集中度值得注意：Ev Kovyrin、Sasha Klizhentas 和
              Taylor Wakefield 仍分别担任 CEO、CTO 和
              COO，处在产品、工程和运营执行的中心。已审阅的公开材料没有披露继任计划、更广的管理梯队深度或当前员工数，外部难以判断管理冗余。与此同时，Teleport 已把自己重塑为 AI Infrastructure
              Identity Company，2026 年 1 月发布 Agentic Identity Framework，2026 年 6 月推出 Beams
              公测。这些动作可能带来真实上行，但也引入路线图复杂性、支持负担，以及围绕委托权限、审计覆盖和 agent 运行时隔离的治理问题。核心风险不是公司不该向 AI
              相邻领域扩张；而是在变现和控制成熟前，投资者仍需要证据证明新打法强化了既有访问业务，而不是分散注意力。
