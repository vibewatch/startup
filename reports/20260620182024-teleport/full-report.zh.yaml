            body: >-
              六个客户在 goteleport.com 上有深入、公开的案例研究，均确认生产环境使用：

              **IBM Instana**（2020 年被 IBM 收购）：云架构师 Hunter Madison 用 Teleport 替代 VPN 加共享凭证来访问 Dropwizard，并表示这是他主导
              Teleport 迁移的第三家公司。引述：「这是我做这件事的第三家公司，让 Teleport 发挥作用，给我们能力去改善安全态势。」确认生产使用；信息独立且具体。

              **Carta**（金融科技，估值 $7 B+）：将 Teleport 与 Okta 集成，用于 Kubernetes 和数据库 RBAC、带细粒度审计的基于角色访问策略，以及更顺畅的开发者入职 /
              离职流程。确认用于 SOC 2 / ISO 27001 合规。已在规模化生产环境使用。

              **GoTo**（东南亚最大数字平台，已上市）：用 Teleport 替代自研工具，管理私有 Kubernetes 集群（「我们所有 Kubernetes
              集群都是私有的——也就是说无法被公开访问」）。多云规模的生产部署；由合规驱动（上市公司）。

              **Exness**（全球金融科技，受监管金融服务）：称「Teleport 是评估过的方案中唯一满足所有要求的一个」，包括全自动化、GitOps 就绪、SSO 和机器身份。生产环境覆盖数百个 Kubernetes
              集群。确认满足 PCI DSS、SOC 2 和 ISO 27001。

              **Gladly**（SaaS CX 平台）：用 Teleport 作为 RBAC 的证书颁发机构，替代静态 SSH 密钥。确认无密钥服务器访问用于合规和基于证据的安全审计。

              **ExtraHop**（网络检测与响应）：用 Teleport 保障基于身份的 SSH 和 Kubernetes 访问，覆盖半打 Kubernetes 集群，每个集群运行数百个独立节点。

              官方新闻稿验证过的 logo 包括 Nasdaq、DoorDash、Snowflake、Splunk、TicketMaster、Mulesoft、Samsung（Series A / C
              博客）。Square、Elastic 和 Bloomberg 出现在官方客户页上，但缺少单独案例研究。NVIDIA 未在官方来源中验证。
