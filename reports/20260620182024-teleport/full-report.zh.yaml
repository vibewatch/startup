      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 验证
        - 2024 年和 2025 年经审计或 CFO 证明的 ARR，以及客户桥接
        - 当前公开锚点来自单一来源估算
        - 财务资料室与客户 cohort 复核
      - - 增长和留存
        - 当前 YoY 增长、NRR、流失率和扩张 cohort
        - 溢价倍数逻辑取决于经验证的增长质量
        - CFO 材料、董事会材料和 cohort 分析
      - - 经济性
        - 毛利率、烧钱、runway 和销售效率
        - 没有单位经济性，入场价格无法做压力测试
        - 财务工作流和管理层访谈
      - - 股权结构
        - 优先权堆栈、反稀释条款和清算权
        - 即便企业价值增长，优先权悬垂也可能损害回报
        - 公司法律顾问与融资文件审查
      - - 许可证变化影响
        - CE 转换前后的管线构成
        - 社区动作变化可能改写 CAC 和转化假设
        - 与产品和销售负责人复核 GTM 分析
      - - FedRAMP 路线图
        - 授权计划、时间表，以及 go-to-market 对联邦买家的依赖
        - 没有执行路径，就不能把政府 TAM 完整计入
        - 安全 / 合规复核和联邦管线尽调
    notes: 每项问题都直接对应一个目前在公开材料中不透明的估值变量。
    claimRefs:
      - CV024
      - CV035
      - CV036
      - CV042
      - CV043
      - CV048
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Teleport 的公开记录从 2015 年创立开始，经过 2022 年 $1.1B Series C，延伸到 2026 年 AI agent 产品扩张；其中 2024 年许可证变化是最不利的经营里程碑。
    data:
      items:
        - date: '2015'
          label: 以 Gravitational 创立
          detail: Ev Kontsevoy、Sasha Klizhentas 和 Taylor Wakefield 创立 Gravitational Inc.，Teleport 是旗舰产品。
          tone: positive
        - date: '2016'
          label: 在 GitHub 开源
          detail: Teleport 以 AGPLv3 在 GitHub 发布；开发者社区开始采用。
          tone: positive
        - date: '2019'
          label: Series A 轮 — $25M（Kleiner Perkins）
          detail: 首轮机构融资；客户包括 NASDAQ、Splunk、Samsung。公司接近盈利。
          tone: positive
        - date: '2021'
          label: Series B — $30M；公司更名为 Teleport
          detail: ARR YoY 2.5x；推出 MongoDB 支持。公司品牌与产品名统一。
          tone: positive
        - date: 2022-05
          label: Series C — $110M，估值 $1.1B
          detail: Bessemer 领投；ARR YoY 2.8x。最后一次已知外部估值——现在已过时约 4 年。
          tone: positive
        - date: 2024-06
          label: 许可证变化 — 限制编译后二进制文件
          detail: Community Edition 二进制文件改为商业许可证，适用于员工 >100 人或 AR >$10M 的公司。
          tone: warning
        - date: 2025-10
          label: 入选 Fortune Cyber 60
          detail: 入选 2026 Fortune Cyber 60，并披露 600+ 客户。
          tone: positive
        - date: 2026-01
          label: 推出 Agentic Identity Framework
          detail: 发布 AI-first 身份路线图；把 Teleport 定位到 agentic AI 时代。
          tone: positive
        - date: 2026-04
          label: 入选 Citizens Cyber 66
          detail: 被 Citizens Securities 评为最热门私营网络安全公司。
          tone: positive
        - date: 2026-06
          label: Beams 公测
          detail: 独立 AI agent runtime 产品在 beams.run 发布。
          tone: positive
    approximationNotes: Series A 日期为近似值（2019 年由 KP perspectives 文章推断；确切交割月份未在已审阅来源中确认）。其他所有日期均来自官方公告。
    claimRefs:
      - CO013
      - CO014
      - CO015
      - CO016
      - CO025
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: Teleport 的开源社区和企业客户群共同喂给基于用量的收入引擎，但过时的 2022 年估值标记、受限社区许可证，以及未确认的 FedRAMP ATO 缺口构成约束。
    data:
      nodes:
        - id: founders
          label: 创始团队（Kontsevoy / Klizhentas / Wakefield）
          detail: 三位联合创始人都有 Mailgun/Rackspace 背景，且仍在担任高管。Kontsevoy 身上存在较高关键人集中度。
          tone: positive
        - id: oss
          label: 开源社区
          detail: GitHub stars 15,000+；AGPLv3 源码仍保持开放。自 Teleport 16 起，Community Edition 仅限小公司使用。
          tone: neutral
        - id: enterprise
          label: 企业客户（具名 600+）
          detail: NASDAQ、Snowflake、DoorDash、IBM、Carta、GoTo 等；基于用量的定价把收入与部署规模绑定。
          tone: positive
        - id: capital
          label: 资本结构（已披露 $165M）
          detail: Kleiner Perkins、S28 Capital、Bessemer、Insight；2022 年 5 月的 $1.1B 估值是唯一标记。未找到 2022 年后的融资轮。
          tone: neutral
        - id: ai_expansion
          label: AI agent 扩张（Beams / Agentic Framework）
          detail: 面向 AI agent 身份的新产品；扩大可服务市场，但收入贡献尚未验证。
          tone: positive
        - id: constraints
          label: 尽调约束
          detail: 过时的 $1.1B 标记；ARR 未确认；无 FedRAMP SaaS ATO；许可证变化引发社区摩擦；竞争对手批评其可靠性。
          tone: warning
      edges:
        - from: founders
          to: oss
        - from: founders
          to: enterprise
        - from: oss
          to: enterprise
        - from: enterprise
          to: capital
        - from: capital
          to: ai_expansion
        - from: constraints
          to: capital
        - from: constraints
          to: enterprise
    approximationNotes: null
