      - number: '5.3'
        title: Agentic Identity 与 Machine & Workload Identity
        blocks:
          - type: paragraph
            body: >-
              Teleport Machine & Workload Identity（MWI）用与人类访问相同的证书模型，为非人服务账户提供身份。服务通过 tbot 认证，接收短期 X.509 或 SSH
              证书，再用这些证书授权访问数据库、Kubernetes 集群、内部 API 和 MCP 服务器——全部记录到同一条审计轨迹里。这为人和机器创建了单一身份网络，而不是另起一套密钥管理系统。

              2026 年 1 月发布的 Agentic Identity Framework 把该模型延伸到 AI 代理。它定义四层：身份（加密代理证书）、访问（通过 Teleport proxy 执行 RBAC /
              ABAC）、安全（行为监控和锁定）以及调度（Kubernetes 和 Temporal 的编排模式）。2026 年 6 月 Beams 公开测试版增加两项具体能力：LLM
              Proxy（位于代理与推理端点之间，记录每个请求 / 响应，并执行每个 Beam 的允许列表）和 Delegated Identity（允许人类或编排器为一个代理会话分配最小权限）。每个 Beam 在
              Firecracker microVM 中运行，具备临时存储、注入身份、虚拟网络，以及约 24 小时的会话绑定生命周期。Beams 目前仅限 Enterprise Cloud，处于公开测试版——尚未正式可用。
