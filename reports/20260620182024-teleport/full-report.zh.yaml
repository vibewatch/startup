      - - Teleport Agent
        - 运行在目标节点上；通过反向隧道把流量送回 Proxy
        - 目标 OS（Linux/Windows）；多数模式需要 root 级访问
        - 以 root 运行 Agent 会放大每台接入主机的攻击面
      - - tbot（MWI agent）
        - 为工作负载签发并续期短期证书
        - Teleport Auth Service；兼容 SPIFFE 的证书格式
        - 如果进程隔离较弱，tbot 凭证可能暴露
      - - Certificate Authorities
        - 签发主机和用户证书；支撑零信任集群成员资格
        - Hardware Security Module 可选；FIPS 使用 BoringCrypto
        - CA 一旦被攻破，整个集群都会失效；需要自动化轮换
      - - Session Recording Store
        - 捕获 PTY、屏幕、查询流；审计记录防篡改
        - S3 兼容对象存储或 Teleport Cloud 存储
        - 用户可尝试用编码隐藏 PTY 命令（文档已披露的风险）
      - - Identity Security Analytics
        - 用 SQL 编辑器查询访问图；Crown Jewels 监控；AI 异常检测
        - 摄取 Okta、AWS、GitHub 日志，以及 Teleport 审计流
        - AI 告警准确性尚无独立验证
      - - Beams Runtime（beta）
        - 每个 agent 会话一个 Firecracker microVM；LLM Proxy；Delegated Identity
        - OpenAI / Anthropic 推理端点；Teleport 身份层
        - beta；仅限 Enterprise Cloud；GA 时间未披露
    notes: 架构基于 Teleport 官方文档和功能矩阵；StrongDM 的说法来自竞争对手，可能带有偏向。
