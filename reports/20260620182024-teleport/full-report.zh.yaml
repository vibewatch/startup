      - number: '8.3'
        title: 情景分析与敏感性
        blocks:
          - type: paragraph
            body: >-
              情景区间主要取决于经验证收入规模和增长耐久性，而不是表格模型复杂度。牛市情景中，Teleport 的 AI Infrastructure Identity 重新定位奏效，Beams 成为可信的 agent
              身份切入点，ARR 从 2024 年 $49M 估算起，以每年 35% 以上复合增长，到 2027 年约 $85M。套用 15 倍倍数——大致是透明公开 PAM 锚的高端，而不是激进 AI 泡沫倍数——得到约
              $1.28B，只比旧标记略高。这是可接受但不惊艳的后期上行情景。基准情景假设产品仍相关、客户质量扎实，但增长回落到每年约 25%。到 2027 年 ARR 约 $73M。按 10 倍至 12
              倍，对应健康但不亢奋的安全软件倍数区间，隐含价值约 $730M 至 $875M。熊市情景假设许可过渡拖慢开发者驱动获客，竞争者压迫定价，AI 重新定位兑现慢于叙事；在年增长低于 15% 时，ARR 仅约
              $60M，6 倍至 8 倍区间隐含 $360M 至 $480M。换句话说，大多数现实路径都需要优于公开证据的增长证明，或更低入场价，风险调整后回报才有吸引力。
            claimRefs:
