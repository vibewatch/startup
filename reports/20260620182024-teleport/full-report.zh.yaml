        title: 护城河风险
        blocks:
          - type: paragraph
            body: >-
              Teleport
              确实有切换成本潜力，但护城河有条件，并非不可攻破。一旦客户把审计日志、证书签发、访问工作流和合规证据标准化到一个平台，替换就会带来运营痛感。这种机制也利好既有厂商，所以即便市场现代化，CyberArk 和
              BeyondTrust 仍能防守账户。Teleport 还面临三项直接风险。第一，CyberArk、Okta 等大型上市可比公司拥有大得多的资产负债表和装机基础，有空间捆绑或折扣。第二，StrongDM
              围绕遗留契合度和 root-agent 架构的负面信息，给混合环境买家提供了具体反方论点。第三，公开客户评论证据支持多于敌意，但保留下来的样本仍缺少大规模上线痛点，投资人无法获得决定性证据来证明 Teleport
              部署模型能在保守企业中无摩擦扩张。
