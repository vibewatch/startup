            body: Teleport 太宽，不能只按 PAM 看；又太窄，不能把整个零信任安全市场都算进来。最有决策价值的框架是基础设施身份：为人、机器以及现在的 AI 代理所运营的基础设施，提供统一访问、工作负载身份和审计。
