      - number: '8.2'
        title: 估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Teleport 唯一披露的估值标记是 2022 年 3 月 Series C：由 Bessemer Venture Partners 领投、Insight Venture Partners 参与，以 $1.1B
              投后估值融资 $110M。2021 年 Series B 增加 $30M，2020 年 Series A 增加 $25M，因此披露的累计一级资本约 $140M。官方新闻室没有宣布后续一级融资、二级报价、IPO
              申报或其他公开标记，投资者只能用一个过时四年的价格，对照 2026 年软件可比公司环境来评估。关键问题不是 $1.1B 在 2022
              年不可能；而是当前公开证据没有确认足以支撑今天维持该标记的经营规模。GetLatka 估算 2024 ARR 为 $49M，但它明确只是估算的单一来源数据点，并非公司披露。若该估算方向正确，过时估值隐含约
              22.4 倍 EV / ARR。CyberArk 是最接近的公开 PAM 锚，市值约 $20.63B、TTM 收入 $1.30B，约 15.8 倍。Okta 是更广义的身份平台，如今也销售特权访问，交易倍数接近
              7.1 倍。这些公开倍数并非完全一一对应，但确实建立了估值重力：Teleport 需要证明 ARR 显著高于 $49M、当下增长远快于公开可验证水平，或拥有持久的 AI
              身份溢价，才配得上旧私有市场标记。没有这些证明，估值看起来是昂贵，而不只是溢价。
