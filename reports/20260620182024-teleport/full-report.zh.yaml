companyProfile:
  summary: >-
    Teleport 是一家成立于 2015 年的私有基础设施身份公司，把服务器、Kubernetes 集群、数据库、Web 应用、机器和 AI 代理的访问与策略统一起来。公司从开源访问项目长成多模块商业平台，覆盖 Zero Trust
    Access、Machine and Workload Identity、Identity Governance、Identity Security，以及 Beams 代理运行时。Teleport 已在三轮已披露融资中募资
    $165M，2022 年 5 月估值达到 $1.1B，并在科技、金融科技和受监管基础设施领域有强势具名客户背书，但当前财务画像仍大多未披露。
