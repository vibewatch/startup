      - number: '8.5'
        title: 建议与证据评估
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等，风险评级高，估值立场为昂贵。Teleport
              看起来具备战略相关性、客户验证和强投资人背书，但投委会不需要判断公司是否优秀；真正要判断的是今天的入场价格是否站得住。基于当前公开证据，答案是否定的。2022 年 $1.1B 标记只有在几个假设下才能辩护：当前
              ARR 明显高于唯一的 GetLatka 估算；Series C 以来未公开披露的增长率仍然较高；或存在公共可比公司尚未验证的高溢价 AI
              身份估值体系。证据基础方向上有用，但不完整。官方来源强力支持融资历史、客户信号和产品叙事，公开可比公司也提供了干净基准，显示经验证行业倍数低于 Teleport
              隐含的估算倍数。缺的是把叙事转化为价格的核心财务披露。只有当 Teleport 能验证 ARR 高于约 $70M、显示 NRR 高于 100%、确认当前同比增长不低于 25%、提供毛利率和 burn
              可见度，并证明政府市场准备度进展或具体退出时间表时，建议才应上调。在此之前，它仍是一家有前景但估值风险需要承销的公司。
