      severity: minor
      topic: stakeholders
      missingEvidence: >-
        Current cap table, secondary transaction history, and confirmed board composition and investor rights for
        Teleport as of June 2026.
      whyItMatters: >-
        The stakeholder map (TO003) is based on public funding announcements from 2019 to 2022. All subsequent
        investor activity, secondary transactions, and governance changes are private. The table's investor stakes
