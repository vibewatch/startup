  - id: section-4
    title: Milestones, scale, and product evolution
    body: >-
      Teleport's milestone history shows a company that moved from a developer-focused access tool to a full
      infrastructure identity platform over roughly a decade. The open-source Teleport project was made public in
      2016 on GitHub under the AGPLv3 license; the repository had accumulated over 15,000 stars by the time of the
      June 2024 community license blog post. The company added Kubernetes access, database access (PostgreSQL,
      MongoDB, MySQL), Windows RDP access, and most recently MCP server access across successive major releases.
      Teleport 16 (June 2024) and Teleport 17 (October 2024) are the most recent major versions, with Teleport
      adopting an annual major-release cadence.


      Named customer logos that appear in official materials include NASDAQ, Snowflake, DoorDash, IBM (Instana), Carta,
      GoTo, Exness, KnowBe4, Turo, Gladly, ThredUP, ExtraHop, and others. The case-study page lists more than a dozen
      detailed case studies, and the careers page references "more than 600 customers around the globe." The company
      received recognition in 2025 and 2026 from the Fortune Cyber 60 list (October 2025) and the Citizens Securities
      Cyber 66 list (April 2026). In January 2026 Teleport launched the Agentic Identity Framework, an AI-focused
      roadmap for securing AI agents in production infrastructure. In June 2026 Teleport announced Beams, a new product
      providing trusted runtimes for AI agents at beams.run.
