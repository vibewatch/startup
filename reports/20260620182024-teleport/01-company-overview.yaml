  - id: section-2
    title: Founders, leadership, and key-person concentration
    body: >-
      Teleport was founded in 2015 by three co-founders who met while working at Rackspace following that company's
      acquisition of Mailgun, a developer email infrastructure startup the three had built. Ev Kontsevoy serves as
      CEO and is the primary public voice for the company. Alexander Klizhentas (known as Sasha) serves as CTO.
      Taylor Wakefield serves as COO. All three remain in active executive roles, as confirmed by the Teleport about
      page as of the run date. The founders' shared background in cloud infrastructure and developer tooling is the
      clearest founder-market fit signal available in public sources.


      Leadership beyond the founding team includes Jeff Bunten as CRO and Diana Jovin as CMO, both of whom appear in
      external press coverage. Jovin was quoted at RSAC in April 2026 and is cited in the newsroom as CMO. Bunten is
      listed on the about page as CRO. Key-person risk is material: Kontsevoy is the signatory for all three
      fundraising announcements, is the named spokesperson for the Agentic Identity Framework launch and the Fortune
      Cyber 60 announcement, and is cited in every major external interview. No public board membership beyond the
      investors named at funding rounds is disclosed by the company.
    claimRefs:
      - CO007
