  topStrengths:
    - 基于证书的统一访问架构覆盖 SSH、Kubernetes、数据库、Web 应用和机器身份。
    - 开源分发和庞大 GitHub 足迹支撑了强开发者可信度。
    - 已披露蓝筹客户包括 Nasdaq、DoorDash、IBM Instana、Carta、Samsung、Elastic 和 Snowflake。
    - Kleiner Perkins、S28、Bessemer 和 Insight 组成的强投资人组合支撑品类创建。
    - 新的 AI-agent 身份和 Beams 定位若能落地采用，可能打开额外增长楔子。
  topRisks:
    - $1.1B Series C 估值已经陈旧，相比 2026 年公开身份和 PAM 可比公司显得偏贵。
    - 唯一当前 ARR 数字（2024 年 $49M）来自第三方估计，并非公司确认数据。
    - 2024 年 6 月社区许可证变更可能削弱自下而上转化和社区好感。
    - 公开资料支持其拥有 FedRAMP 合规工具，但未验证 Teleport Cloud 本身获得 FedRAMP 授权。
    - 大型竞争对手和云原生替代方案可以打包相邻身份与特权访问能力。
  unresolvedGaps:
    - 当前 ARR、毛利率、烧钱速度、现金跑道和 NRR 均未公开披露。
    - 600+ 客户数字由公司自述，尚未独立验证。
    - 可访问公开资料仍无法确认 Teleport Cloud 的 FedRAMP 授权状态。
    - 除已宣布投资人外，股权结构条款、清算优先权和董事会构成仍属私密。
    - 二级市场定价或任何 2022 年后更新估值证据均未公开。
