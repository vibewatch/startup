  - id: retention-expansion-risk
    title: Retention, Expansion, and Concentration Risk
    body: >-
      Teleport does not publicly disclose NRR, GRR, logo churn, or renewal rates. The Series C blog mentioned ARR growing 2.8x year over year and net-new ARR up 4.5x, consistent with strong expansion from existing customers, but these figures are from 2022 and are now historical. PeerSpot users report that Teleport "changed our workflow by centralizing access control," and several reviewers describe it as a sticky replacement for legacy SSH key workflows — both signals of high switching costs.

      The depth of enterprise deployments at Exness (hundreds of Kubernetes clusters), GoTo (multi-cloud, multi-vertical), and ExtraHop (hundreds of individual nodes) suggests high infrastructure integration depth that creates meaningful switching costs. IBM Instana's cloud architect explicitly notes this is his third Teleport deployment across different companies, which is a strong signal of advisor-driven repeat adoption.

      Expansion risk: StrongDM's competitive critique argues that Teleport lacks legacy-protocol support and SIEM integration, which could limit expansion to customers with mixed legacy/cloud environments. The community-license change (v16+) restricts the free community tier for large companies, potentially increasing friction for commercial expansion from the community funnel. Concentration is a material risk: publicly named customers skew heavily toward tech-native companies in fintech and cloud infrastructure; healthcare, manufacturing, government, and retail sectors are underrepresented in public proof. Fortune Cyber 60 noted "three of the top five financial services firms," which is significant concentration in a single vertical.
