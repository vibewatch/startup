figures:
  - id: FU001
    title: Teleport Customer Journey Map
    type: journey-map
    layout: standard
    summary: How a typical enterprise customer discovers, evaluates, deploys, and expands Teleport.
    data:
      items:
        - label: 1. Discovery
          stage: Discovery
          actor: Platform Engineer / CISO
          action: Finds Teleport via GitHub, Hacker News, or peer referral; evaluates Community Edition
          pain: VPN and SSH key sprawl; audit-log gaps; compliance pressure
          outcome: Discovers secretless SSH and Kubernetes access model
        - label: 2. Evaluation
          stage: Evaluation
          actor: VP Engineering / Security team
          action: Compares Teleport vs StrongDM, Boundary, CyberArk; runs internal proof-of-concept
          pain: Legacy tools require credential vaults; Teleport requires root agent per host
          outcome: Trial Enterprise license; Teleport selected for modern cloud-native stacks
        - label: 3. Pilot
          stage: Pilot
          actor: Platform / DevOps team
          action: Deploys Teleport Auth and Proxy services; enrolls SSH nodes; integrates Okta SSO
          pain: Initial RBAC configuration complexity; root-agent installation overhead
          outcome: SSH and Kubernetes access secured; compliance audit trail demonstrated
        - label: 4. Production Deploy
          stage: Production Deploy
          actor: Engineering organization
          action: Full rollout across SSH, K8s, databases; session recording enabled; audit log flowing
          pain: Legacy-protocol gaps; agent uptime dependency creates access risk
          outcome: All engineers access resources via tsh; compliance team has session-recording evidence
        - label: 5. Expansion
          stage: Expansion
          actor: Security / Platform team
          action: Adds Database Access, Identity Security, Machine & Workload Identity
          pain: Enterprise-only features require upsell; Beams available only on Cloud
          outcome: Deeper identity fabric; increased MAU and TPR billing metrics
        - label: 6. Renewal
          stage: Renewal
          actor: Finance / CISO
          action: Annual contract renewal under usage-based pricing model
          pain: Pricing scales with user and resource count; large enterprises face significant cost
          outcome: High switching cost due to certificate infrastructure integration depth
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU030
      - CU031

