  - id: named-customer-proof
    title: Named Customer Proof and Case Study Quality
    body: >-
      Six customers have deep, publicly documented case studies on goteleport.com, all confirming production use:

      **IBM Instana** (acquired by IBM 2020): Cloud Architect Hunter Madison replaced VPN-plus-shared-credentials with Teleport for Dropwizard access and states this is the third company where he has led a Teleport migration. Quote: "This is company number three I've done this at, to have Teleport in play to give us the ability to go and help our security posture." Confirms production use; independent and specific.

      **Carta** (fintech, $7 B+ valuation): Integrated Teleport with Okta for Kubernetes and database RBAC, role-based access policies with fine-grained auditing, and streamlined developer onboarding/offboarding. Confirms SOC 2/ISO 27001 compliance use. Production at scale.

      **GoTo** (Southeast Asia's largest digital platform, publicly listed): Replaced in-house tools with Teleport for private Kubernetes clusters ("all our Kubernetes clusters are private—meaning they can't be accessed publicly"). Production at multi-cloud scale; compliance-driven (publicly listed company).

      **Exness** (global fintech, regulated financial services): "Teleport was the only evaluated solution that met every requirement" including full automation, GitOps readiness, SSO, and machine identity. Production across hundreds of Kubernetes clusters. Confirmed compliance with PCI DSS, SOC 2, and ISO 27001.

      **Gladly** (SaaS CX platform): Uses Teleport as certificate authority for RBAC instead of static SSH keys. Confirms secretless server access for compliance and evidence-based security audits.

      **ExtraHop** (network detection and response): Secured half a dozen Kubernetes clusters each running hundreds of individual nodes with Teleport for identity-based SSH and Kubernetes access.

      Verified logos from official press releases: Nasdaq, DoorDash, Snowflake, Splunk, TicketMaster, Mulesoft, Samsung (Series A/C blogs). Square, Elastic, and Bloomberg appear on the official customer page but lack individual case studies. NVIDIA is not verified in official sources.
