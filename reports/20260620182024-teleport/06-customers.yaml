  - id: adoption-trajectory
    title: Adoption Trajectory and Scale Signals
    body: >-
      Teleport's most authoritative customer-count statement comes from the October 2025 Fortune Cyber 60 press release: "More than 600 companies, including three of the top five financial services firms and the leaders in AI research, compute, and cloud, depend on Teleport." This is company-stated and cannot be independently audited. Earlier milestones include the Series A blog's "handful of early adopters to an impressive portfolio of some of the world's largest and most innovative companies" and the Series C tracking of "net new ARR up 4.5x year over year." The Getlatka database (as of November 2025) reported approximately $49 M in annual revenue and ~246 employees, consistent with mid-market SaaS scale.

      The case study page lists at least 15 named customers publicly — GoTo, Exness, Gladly, ExtraHop, IBM Instana, Carta, KnowBe4, Turo, Rush Street Interactive, Buyers Edge, ThredUP, Qwilt, Mapgears, ECMWF, Flywheel — plus many more described without names. The diversity spans North American SaaS, global fintech, gaming, e-commerce, biomedical research, and weather infrastructure. Deployment depth appears to run deep: Exness reports "hundreds of Kubernetes clusters across on-prem and cloud" managed through Teleport, and GoTo describes Teleport managing access "across multiple cloud providers" for their vast infrastructure.

      Teleport has been named to the Fortune Cyber 60 for multiple years and was recognized as a "revenue category mover" in the Citizens Cyber 66 April 2026 report, indicating continued business momentum. Independent revenue data is limited; Getlatka's $49 M estimate is unverified. NVIDIA appears on some unofficial logo walls but is not confirmed in any official press release or case study — treated here as a gap.
