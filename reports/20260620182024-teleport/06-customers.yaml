  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: customer-count
      missingEvidence: "Independent verification of the '600+ companies' customer count from any third-party analyst, database, or customer survey"
      whyItMatters: Customer count is a key diligence metric; the only source is a company press release; no analyst database (Getlatka, G2, PeerSpot) confirms this figure
      diligencePath: Request Teleport customer roster with company sizes, ARR by cohort, and top-10 customer concentration from management
      relatedQuestionRefs:
        - QU001
        - QU013

    - type: missing-source
      severity: blocking
      topic: retention-gap
      missingEvidence: NRR, GRR, logo churn rate, and average contract length for Teleport's enterprise customer base
      whyItMatters: Without retention metrics, it is impossible to assess whether the customer base is durable or growing through pure new-logo acquisition
      diligencePath: Request NRR/GRR by cohort year and by product tier from Teleport CFO; review enterprise contract templates for minimum commitment
      relatedQuestionRefs:
        - QU007

    - type: missing-source
      severity: material
      topic: unverified-customer
      missingEvidence: Official confirmation of NVIDIA, Square, Bloomberg, or Elastic as individually named active production customers with case studies
      whyItMatters: These names may appear on unofficial logo walls; including them in customer-count or proof claims without official sources risks overstating the customer base quality
      diligencePath: Request customer reference list from Teleport; ask whether each logo has a signed reference agreement
      relatedQuestionRefs:
        - QU006
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: vertical-concentration
      missingEvidence: Breakdown of ARR or customer count by industry vertical (fintech vs cloud vs government vs healthcare vs manufacturing)
      whyItMatters: Public evidence shows heavy tech-fintech concentration; horizontal expansion into healthcare, government, or manufacturing would reduce concentration risk
      diligencePath: Request ARR segmentation by vertical from Teleport sales leadership
      relatedQuestionRefs:
        - QU027

    - type: private-evidence-only
      severity: material
      topic: arr-growth
      missingEvidence: Current ARR, ARR growth rate, and net-new ARR as of 2025-2026
      whyItMatters: The 4.5x net-new ARR growth figure is from 2022 (Series C era); no updated revenue growth metrics have been publicly disclosed
      diligencePath: Request current ARR by product tier from Teleport CFO; cross-reference Getlatka estimate with audited figures
      relatedQuestionRefs:
        - QU005
        - QU019

    - type: private-evidence-only
      severity: minor
      topic: community-conversion
      missingEvidence: Community-to-Enterprise conversion rate before and after the v16 commercial license change in June 2024
      whyItMatters: The license change is the primary acquisition mechanism change; understanding its impact on pipeline is essential for assessing growth trajectory
      diligencePath: Request community trial conversion data from Teleport product/sales team
      relatedQuestionRefs:
        - QU014

    - type: missing-source
      severity: minor
      topic: financial-services-customers
      missingEvidence: Individual case studies or named customers among the three top-five financial services firms mentioned in Fortune Cyber 60
      whyItMatters: Financial services is the highest-concentration vertical; only Nasdaq is named; the others are anonymous
      diligencePath: Request reference customers in financial services from Teleport; review financial sector press releases
      relatedQuestionRefs:
        - QU021

    - type: stale
      severity: minor
      topic: revenue-headcount
      missingEvidence: Current headcount and revenue as of June 2026; Getlatka data is from November 2025
      whyItMatters: Headcount and revenue are volatile metrics; the Getlatka estimate is 7 months old
      diligencePath: Check LinkedIn for current employee count; request Teleport management overview for current headcount
      relatedQuestionRefs:
        - QU024

acknowledgedWarnings:
  - dimension: figureType
    reason: "Cohort figure used for retention signal matrix instead of dedicated cohort figure; quantitative retention data (NRR/GRR) is not publicly available for Teleport, making a numeric cohort the best available representation of qualitative switching cost signals."
