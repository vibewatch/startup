  title: Customers
  summary: Teleport's customer base spans hundreds of companies with officially named logos including Nasdaq, DoorDash, Snowflake, Square, Elastic, IBM Instana, Carta, Bloomberg, Splunk, TicketMaster, and Mulesoft. A Fortune Cyber 60 press release in October 2025 stated that "more than 600 companies" depend on Teleport, but this is company-stated and cannot be independently verified. Deep case studies for IBM Instana, Carta, GoTo, Exness, Gladly, and ExtraHop confirm production deployments; NVIDIA is unconfirmed and should be treated as a gap. Customer count and NRR are private; the main durability risks are concentration among tech-finance verticals and a licensing change that may increase enterprise friction.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Buying Profile
    body: >-
      Teleport's buyer is primarily the engineering or platform-security team at mid-to-large enterprises, particularly in technology, financial services, and global digital platforms. The product is bought by infrastructure engineering leaders (VPs of Engineering, Platform Engineers, CISOs), with DevOps and SRE teams as the primary users. The official customer page and case studies show a consistent pattern of companies seeking to replace VPN-plus-shared-credentials approaches with certificate-based infrastructure access.

      Verticals represented in public case studies include fintech (Carta, Exness), global SaaS platforms (GoTo, Gladly), network detection (ExtraHop), and enterprise observability (IBM Instana). The Series A funding announcement named Nasdaq (stock exchange), Splunk (SIEM/observability), TicketMaster (live entertainment), Mulesoft (API integration), and Samsung (consumer electronics), while Series C specifically named Nasdaq, DoorDash, and Snowflake. The Fortune Cyber 60 press release (October 2025) stated "more than 600 companies, including three of the top five financial services firms and the leaders in AI research, compute, and cloud," depend on Teleport — the most expansive customer base claim to date, though this is company-stated.

      Geography is heavily North America and global-tech, with GoTo based in Southeast Asia (Indonesia) and Exness operating globally across financial markets. Company size ranges from growth-stage (Series-B era customers) to major public enterprises (Nasdaq, Samsung, IBM). The Community Edition provides a top-of-funnel acquisition path for smaller companies and teams under 100 employees or $10 M AR, with Enterprise sales triggered by the commercial license threshold.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
