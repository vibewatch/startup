callouts:
  - calloutType: strength
    title: Deep Case Studies With Specific Technical Proof
    body: Six named customers (IBM Instana, Carta, GoTo, Exness, Gladly, ExtraHop) have official case studies with named individuals, specific technical details (Kubernetes cluster counts, protocol lists, compliance certifications achieved), and direct quotes — all confirming production deployments. Exness's statement that "Teleport was the only evaluated solution that met every requirement" is a particularly strong competitive endorsement.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023

  - calloutType: risk
    title: NVIDIA Unverified — Do Not Claim Without Source
    body: NVIDIA appears on some third-party or community logo compilations as a Teleport customer, but is not mentioned in any official Teleport press release, case study, or funding announcement. This is a factual gap and should not be included in customer counts or customer-proof claims until confirmed by Teleport directly.
    claimRefs:
      - CU038

  - calloutType: risk
    title: Customer Count Is Company-Stated and Not Independently Verified
    body: The "600+ companies" figure comes from a single Teleport press release (October 2025 Fortune Cyber 60). No independent analyst, customer survey, or third-party database confirms this count. Getlatka reports no customer count for Teleport. For investment diligence, require Teleport to disclose ARR by cohort and top-10 customer concentration.
    claimRefs:
      - CU010
      - CU011

