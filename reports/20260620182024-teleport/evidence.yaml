evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: >-
      A verified post-2022 funding round or secondary transaction that would provide a refreshed valuation mark for
      Teleport.
    whyItMatters: >-
      The $1.1B Series C mark is four years old. Private-market valuations for cybersecurity SaaS companies moved
      materially between 2022 and 2026. Any investment decision requires either a management-provided updated valuation
      or a new external financing event.
    diligencePath: >-
      Request cap table and any internal 409A valuation or tender offer documentation from company counsel. Monitor for
      any public secondary market activity or investor press release.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: blocking
    topic: ARR
    missingEvidence: Audited or management-reported ARR, gross margin, burn rate, and cash position data for 2023, 2024, and 2025.
    whyItMatters: >-
      The only available ARR figure is GetLatka's $49M estimate for 2024, which is unconfirmed. Without actual financial
      statements, the revenue quality, growth rate, and margin trajectory cannot be underwritten.
    diligencePath: >-
      Request financial data room with management accounts (P&L, cash flow, ARR cohort analysis) and audited financials
      if available.
    relatedQuestionRefs:
      - QO010
      - QO011
  - type: missing-source
    severity: material
    topic: FedRAMP
    missingEvidence: >-
      Confirmation from the FedRAMP Program Management Office or marketplace listing showing that Teleport's cloud
      service holds a FedRAMP ATO, either at the Moderate or High impact level.
    whyItMatters: >-
      Federal buyers and regulated enterprises may require that Teleport's SaaS itself carries an ATO, not just that its
      tooling supports the customer's compliance journey. The current public record only supports FIPS/compliance
      tooling claims.
    diligencePath: >-
      Search the FedRAMP marketplace (marketplace.fedramp.gov) for Teleport. Request ATO documentation or Agency
      Agreement from company sales team.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current cap table, board composition post-Series C, and option pool size for Teleport as of June 2026.
    whyItMatters: >-
      No post-2022 public board updates are available. Whether Kleiner Perkins and S28 have board seats or observer
      rights, and whether management holds controlling voting rights, cannot be determined from public materials.
    diligencePath: Request cap table and board resolutions from company counsel or lead investor.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: >-
      Full board roster with current seat-holders, independent directors, and any post-Series-C governance changes for
      Teleport.
    whyItMatters: >-
      The leadership and founder table (TO002) covers five named individuals from public sources, but board composition
      has not been updated publicly since the May 2022 Series C. Key-person risk assessment depends on board
      composition.
    diligencePath: >-
      Request board minutes or written resolutions from company counsel; ask lead investor (Bessemer) for board
      composition update.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Post-2022 product and commercial milestones not covered in public press releases, including ARR trajectory by year
      (2022, 2023, 2024, 2025), major contract wins, and any litigation or adverse regulatory events.
    whyItMatters: >-
      The milestone table (TO004) is built from publicly available announcements and funding events only. The entire
      2022-2024 period is a gap in the public record; no major commercial milestones or adverse events were publicly
      disclosed during that time.
    diligencePath: >-
      Request a management-authored milestone timeline from the company covering product releases, customer wins, team
      expansions, and any legal or regulatory events since May 2022.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholders
    missingEvidence: >-
      Current cap table, secondary transaction history, and confirmed board composition and investor rights for Teleport
      as of June 2026.
    whyItMatters: >-
