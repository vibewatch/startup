evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      Current leadership roster, founder biographies, board composition, ownership, and evidence of key-person
      succession or retention.
    whyItMatters: >-
      A thinly documented leadership bench can create execution and governance concentration risk, but the available
      page does not establish current roles or dependency.
    diligencePath: >-
      Obtain a current organization chart, cap table, board records, founder biographies, and references confirming
      present responsibilities.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: >-
      Primary financing announcements or transaction documents specifying the angel amount, instrument, investor
      allocations, district support terms, and any later rounds.
    whyItMatters: >-
      Reported financing does not establish cash received, current liquidity, dilution, valuation, or runway, and the
      separate RMB 30 million support may not be additive.
    diligencePath: Review investment agreements, capitalization records, bank evidence of proceeds, and government-support contracts.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating metrics
    missingEvidence: >-
      Dated, company-level revenue, ARR where applicable, gross margin, paid customer and deployment counts, headcount,
      cash, and working-capital metrics.
    whyItMatters: >-
      Without operating denominators, public partnership and prototype announcements cannot show commercial scale or
      financial sustainability.
    diligencePath: >-
      Request audited or management-certified monthly financials, customer schedules, delivery/acceptance records,
      headcount roll-forward, and cash/runway reconciliation.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: partnership
    missingEvidence: >-
      Definitive China Wantian and Suining contracts, purchase orders, scope, acceptance criteria, pricing, payment
      milestones, and realized deliveries.
    whyItMatters: A framework or cooperation announcement may not create enforceable orders, revenue, or repeat demand.
    diligencePath: Obtain executed agreements, purchase orders, invoices, acceptance certificates, and customer references.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: policy risk
    missingEvidence: >-
      Company-specific export-control, procurement eligibility, data-security, safety-certification, incident, and
      compliance records for intended deployment jurisdictions.
    whyItMatters: >-
      The cited policy proposal is sector-level and does not establish a restriction or incident involving Xingchen, but
      cross-border deployment could face jurisdiction-specific constraints.
    diligencePath: >-
      Request counsel's jurisdictional assessment, product connectivity/data-flow documentation, safety certifications,
      and incident-response records.
    relatedQuestionRefs:
      - QO009
  - type: conflicting-data
    severity: material
    topic: china-humanoid-market-sizing
    missingEvidence: >-
      Primary methodologies and consistent denominators for the global revenue forecast, China's output and shipment
      projections, and ETC Journal's 2025 company-share estimates.
    whyItMatters: >-
      The sources mix revenue forecasts, production growth, shipment shares, and undefined market shares; they cannot be
      combined into a reliable market base case.
    diligencePath: >-
      Obtain the underlying research methodologies and a definition-matched shipment and revenue dataset, then compare
      geography, product scope, periods, and share denominators.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: xingchen-sam-som
    missingEvidence: >-
      Xingchen-specific paid customer deployments, contract values, product pricing, annual unit volumes, and an
      independently supportable SAM/SOM.
    whyItMatters: >-
      Broad global forecasts and reported partnerships cannot establish the company's reachable spend, conversion, or
      share of market.
    diligencePath: >-
      Request a customer-level contract and pilot schedule, paid-versus-unpaid status, product price list, deployment
      and renewal data, and a bottom-up segment model with explicit geography and workflow assumptions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: us-robot-procurement
    missingEvidence: >-
      The current legislative status and final scope of the March 2026 U.S. federal procurement proposal described by
      FDD and ETC Journal.
    whyItMatters: >-
      A proposal could affect only certain federal customers and products, while treating it as enacted or broadly
      applicable would overstate market-access risk.
    diligencePath: >-
      Verify the bill's current status and text using an official legislative record before assigning any product- or
      customer-specific exposure.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: deployment-economics
    missingEvidence: >-
      Customer-validated uptime, task success, deployment cost, maintenance burden, and paid-versus-pilot status for the
