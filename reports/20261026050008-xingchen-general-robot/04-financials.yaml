company:
  name: Xingchen General Robot
chapter:
  number: 4
  title: Financials
  summary: Public evidence identifies a 2025 angel round and a local-government support figure, but does not establish Xingchen's realized revenue, pricing, margins, cash balance, or runway. Sector comparables show both rapid price compression and selective peer profitability; neither can substitute for company-level underwriting data.
sections:
  - id: revenue-visibility
    title: Revenue visibility remains the central underwriting gap
    body: >-
      The available company-specific financial evidence is limited to a Baidu Baike profile
      reporting a 2025 angel round of several tens of millions of RMB, naming Xiangjiang
      State-owned Investment and Hunan Haichuang, and separately describing RMB 30 million
      of district-level support. The article says financing was intended for core-technology
      iteration and mass production of a wheeled dual-arm robot. It also reports a three-year
      sales target above RMB 1.3 billion for a Changsha project. These are third-party
      reported financing and project targets, not recognized revenue, cash on hand, or proof
      of orders. The source does not establish whether the support amount overlaps with the
      angel round. No retained source provides a reported revenue total, revenue mix, or
      recognition policy for Xingchen.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI019
      - CI020
    tableRefs:
      - TI001
  - id: pricing-and-monetization
    title: Pricing and monetization cannot yet be modeled from public evidence
    body: >-
      The assigned evidence does not provide a current Xingchen list price, realized selling
      price, customer contract, or fee schedule. Baidu Baike reported that an engineering
      prototype had been validated and was expected to launch by the end of 2025; that
      forward-looking date has passed, and the source does not verify a commercial launch or
      paid deliveries. Industry price observations indicate a fast-changing market, but the
      available comparisons concern other suppliers and product tiers. RoboZaps explicitly
      says only Unitree R1 and G1 prices in its dataset were verified from official sources;
      other entries were announcements or estimates. These observations frame pricing risk,
      not Xingchen's realized ASP or customer willingness to pay.
    claimRefs:
      - CI006
      - CI008
      - CI010
      - CI019
    tableRefs:
      - TI002
  - id: cost-and-margin-path
    title: Cost and margin signals are directional, not company unit economics
    body: >-
      Sector reports point to a widening gap between hardware cost reductions and the still
      uncertain ability to monetize reliable deployments. ChinaBizInsider reports sharp
      declines in humanoid-robot rental rates, while Tianxia Gongchang Research repeats a
      TrendForce estimate of 62,500 China shipments in 2026, up 94% year over year. TrendForce
      also reports that Unitree's 2025 humanoid-robot revenue exceeded its quadruped revenue
      and represented more than 51% of total revenue, with 60% combined gross margin across
      those segments. Those are peer- and sector-level disclosures; they do not establish
      Xingchen's bill of materials, manufacturing yield, support burden, gross margin, or
      payback. Sun Tzu China's compensation ranges are explicitly estimates with a stated
      20%-30% variation, and are at most a directional labor-cost signal.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy
    title: Capital adequacy is not assessable without cash and burn disclosure
    body: >-
      The reported financing round and local support offer evidence of historical capital
      access, but not of present liquidity. The source set contains no verified cash balance,
      monthly cash burn, runway, debt or project-finance obligations, working-capital
      requirements, or next-round trigger. Nor does it quantify the relationship between the
      RMB 30 million support figure and the reported angel round, so the two amounts should
      not be added. Peer financing and public-market activity demonstrate that capital is
      available to some robotics companies, not that Xingchen can raise on comparable terms.
      The diligence verdict is therefore to treat capital adequacy and the conversion of
      project targets into collected revenue as material, unresolved underwriting risks.
      A proposed U.S. federal procurement restriction is a jurisdiction-specific external
      risk; the assigned evidence does not show that Xingchen sells into that market.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI015
      - CI016
      - CI019
      - CI020
    figureRefs:
      - FI001
tables:
  - id: TI001
    title: Revenue streams and current evidence
    columns:
      - Potential stream
      - Evidence status
      - Current value or unit
      - Underwriting implication
      - Diligence request
    rows:
      - - Robot hardware sales
        - Product category and manufacturing/sales scope are reported; realized sales are not.
        - null
        - Do not convert the reported project target into current revenue.
        - Obtain audited revenue by SKU, paid units, realized ASP, and delivery dates.
      - - Project deployment or integration
        - A three-year project sales target is reported, but contracts and recognition terms are absent.
        - null
        - Project value, backlog, and recognized revenue are not interchangeable.
        - Request signed contracts, acceptance milestones, backlog, and revenue-recognition policy.
      - - Software, service, or recurring fees
        - No recurring fee schedule or recognized software/service revenue appears in assigned sources.
        - null
        - Recurring revenue and retention cannot be assumed from a robotics product roadmap.
        - Request software attach rates, service contracts, renewal rates, and collections.
      - - Grants, investment, and other financing
        - A 2025 angel round and RMB 30 million support figure are reported; overlap is unclear.
        - RMB; amounts are not safely additive
        - Financing is not revenue and does not establish cash available today.
        - Reconcile instruments, disbursement dates, restrictions, and balance-sheet treatment.
    notes: >-
      Source: Baidu Baike's company profile. It reports financing and a forward sales target,
      not audited financial statements; null means no company-level value was disclosed in
      the assigned sources. Do not add the reported support to the angel round without
      confirming whether the amounts overlap.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI019
      - CI020
  - id: TI002
    title: Unit-economics inputs required for underwriting
    columns:
      - Metric
      - Public evidence for Xingchen
      - Value or denominator
      - Why it matters
      - Diligence ask
    rows:
      - - Realized selling price
        - Not disclosed in assigned sources.
        - null
        - List price and realized ASP may differ by product, deployment, and discount.
        - Request SKU-level invoices, discounts, and contract terms.
      - - Revenue and revenue mix
        - No reported period total, segment mix, or recognition policy found.
        - null
        - Project targets do not establish recognized sales or recurring revenue.
        - Request audited monthly revenue by product and customer.
      - - Gross margin
        - No Xingchen margin disclosure; peer figures are not a company proxy.
        - null
        - Margin must include hardware, integration, warranty, and support costs.
        - Request contribution margin by shipped unit and deployment cohort.
      - - CAC, sales cycle, and payback
        - No company-specific acquisition cost, cycle, or payback disclosed.
        - null
        - Long enterprise cycles can consume working capital before acceptance.
        - Request funnel conversion, sales-cycle distributions, CAC, and cash payback.
      - - Manufacturing and service-delivery cost
        - No Xingchen BOM, yield, rework, service-hours, or warranty data disclosed.
        - null
        - Hardware scale does not guarantee positive contribution economics.
        - Request BOM, yield, labor, rework, warranty claims, and field-service hours.
      - - Working capital and capital intensity
        - No inventory, receivable, payable, capex, or project-finance data disclosed.
        - null
        - Deposits, acceptance delays, and inventory can make accounting revenue a poor liquidity proxy.
        - Request cash-conversion cycle, capex plan, inventory aging, and project funding terms.
    notes: >-
      The table records unavailable private metrics rather than estimating values. Competitor
      prices and margins in other sources are not substitutes for Xingchen's realized
      economics; null means no company-level input was disclosed in the assigned pool.
    claimRefs:
      - CI008
      - CI010
      - CI012
      - CI019
  - id: TI003
    title: Reported financing and sector context
    columns:
      - Evidence item
      - Reported metric
      - Scope and period
      - Interpretation
      - Caveat
    rows:
      - - Xingchen angel financing
        - Several tens of millions RMB
        - Reported 2025-09 round
        - Evidence of a reported historical financing event.
        - Secondary profile; instrument detail and current cash are not shown.
      - - District-level support
        - RMB 30 million
        - Reported support; exact disbursement and overlap are unspecified.
        - Potentially relevant funding support, not an additive cash balance.
        - Relationship to the angel-round amount is unclear.
      - - Changsha project sales target
        - More than RMB 1.3 billion
        - Reported target over three years
        - Forward project ambition, not realized revenue or backlog.
        - No contracts, milestones, or customer acceptance data supplied.
      - - Unitree peer economics
        - Humanoid revenue was over 51% of total revenue; combined segment gross margin was 60%.
        - TrendForce report on 2025 results
        - Demonstrates that a peer reported product-level revenue and margin metrics.
        - Not a Xingchen benchmark; denominator is Unitree's total revenue and two segments.
      - - China shipment outlook
        - 62,500 units; +94% year over year
        - 2026 estimate attributed to TrendForce
        - Indicates a sector supply-growth scenario relevant to pricing and competition.
        - Forecast is not company-specific demand or a shipment outcome.
    notes: >-
      Amounts, periods, denominators, and status are preserved as reported. Do not add the
      angel-round and support figures, treat the sales target as actual revenue, or transfer
      peer margins to Xingchen. The shipment figure is a forecast, not observed output.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI011
      - CI012
      - CI013
      - CI016
