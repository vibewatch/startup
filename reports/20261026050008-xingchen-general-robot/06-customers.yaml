chapter:
  number: 6
  title: Customers
  summary: Public evidence identifies a robot deployed in Shenzhen's Qianhai public-park service setting and a July 2026 strategic framework agreement with China Wantian. Neither establishes paid production revenue, repeat deployment, customer concentration, or retention; the agreement expressly says it creates no substantive rights or obligations.
sections:
  - id: visible-customer-segments
    title: What the public evidence can segment
    body: >-
      The available evidence points to two demand surfaces, not a measurable customer
      portfolio. In Qianhai, a robot attributed to Xingchen was reported in a public
      park context for patrol, safety and etiquette reminders, and visitor questions.
      Separately, China Wantian's subsidiary signed a framework covering proposed
      embodied-AI products and government, urban-governance, public-service, and
      smart-government scenarios. The public sources do not identify a paid buyer,
      contract value, account count, geography beyond the reported project, or revenue
      contribution. Accordingly, the segmentation below separates an observed use
      setting from a proposed route to market instead of treating either as a proven
      revenue segment.
    claimRefs: [CU001, CU002, CU004, CU010]
    tableRefs: [TU001]
  - id: adoption-and-deployment-proof
    title: Adoption is visible, but scale is not
    body: >-
      Independent coverage describes robots operating at Qianhaishi Park in Shenzhen
      in March 2026, including a robot from Xingchen assigned to patrol and visitor
      assistance. This is evidence of a real public-facing deployment, but the
      reporting also characterizes the initiative as a showcase and testing ground.
      The stories do not establish whether Xingchen's participation was paid, whether
      the machines were in continuous production service, how many users they served,
      or whether the deployment renewed or expanded. Multiple outlets repeat the
      same CNS/AP account, so their publication across domains should not be mistaken
      for several independently sourced customer references.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU012]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: commercial-terms-and-expansion
    title: Partnership is a channel hypothesis, not booked demand
    body: >-
      The July 28, 2026 announcement describes a proposed cooperation between Xingchen
      and China Wantian's wholly owned AI subsidiary. Its intended mechanisms include
      product supply and technical support, joint promotion, scenario development,
      and exploration of government projects, technology services, and operations
      and maintenance services. These terms suggest a possible channel and
      implementation partner, but the same disclosure states the agreement is a
      basic framework that creates no substantive rights or obligations. No named
      end customer, executed purchase order, price, minimum volume, delivery schedule,
      or attributable customer outcome is disclosed in the assigned sources.
    claimRefs: [CU001, CU002, CU003, CU010]
  - id: durability-and-diligence
    title: Customer durability remains unverified
    body: >-
      The assigned evidence set contains no customer-level revenue, active-account
      count, deployment denominator, utilization, renewal, churn, gross retention,
      net retention, contract duration, or concentration data. The absence of these
      metrics from this limited source set is not evidence that no customers or
      incidents exist; it means the public proof is insufficient to underwrite
      recurring demand or customer economics. Sector commentary from TrendForce
      describes a broader shift toward tangible user value in the second half of
      2026, but it does not report Xingchen customer performance. Before treating
      the park use or Wantian framework as durable adoption, diligence should obtain
      contract status, payment and renewal records, service-level results, and
      customer references.
    claimRefs: [CU009, CU011]
callouts:
  - calloutType: risk
    title: Do not count a framework as a customer contract
    body: >-
      China Wantian's announcement explicitly says the strategic framework creates
      no substantive rights or obligations. Treat it as a proposed route to market,
      not a binding order, recognized revenue, or proof of customer retention.
    claimRefs: [CU001, CU003]
