      - ["Category-level scrutiny of Chinese robot controls may affect market diligence", "Conditional on destination markets and policy status", "Potentially high for affected sales; no Xingchen-specific security issue established", "Unknown", "Conditional", "Track policy and customer requirements; obtain company-specific security architecture and test results"]
      - ["2025 target for market launch not reverified in current evidence", "Unknown; the announcement is historical", "Medium: affects commercialization assessment, not proof of missed delivery", "Unknown", "Unresolved", "Obtain current production status, units delivered, acceptance records, and customer references"]
    notes: >-
      Company milestones are attributed to the company; sector commentary is not a
      company-specific benchmark. The assigned sources do not quantify likelihood or
      establish that a failure or incident occurred.
    claimRefs: [CR007, CR010, CR011, CR012, CR015, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Public evidence, Failure scenario, Severity, Mitigation maturity, Residual exposure / diligence]
    rows:
      - ["Capital providers", "Company announcement names two angel investors in a September 2025 round; amount stated only as tens of millions of RMB", "Funding is insufficient or unavailable for production ramp and working capital", "High if runway is short; actual exposure unknown", "Unknown", "Material / obtain round documents, current cash, burn, debt, commitments, and runway"]
      - ["Manufacturing and supply chain", "Announcement describes plans to advance production; no supplier or capacity metrics in assigned evidence", "Component, quality, or working-capital constraints prevent consistent delivery", "Potentially high at scale; current exposure unknown", "Unknown", "Material / request supplier map, qualification status, capacity, yields, lead times, and contingency plans"]
      - ["Commercial partners", "Company announcement names China Resources Digital, Haier Smart Home, and Long Teng Travel as strategic partners", "Partnerships do not convert to paid deployments or dependable recurring demand", "Medium-to-high if these relationships are core to go-to-market", "Unknown", "Material / inspect signed contracts, scope, revenue, exclusivity, renewal, and delivery obligations"]
    notes: >-
      Public relationships and financing are company-announced; the pool does not establish
      contract terms, actual cash availability, supplier concentration, or current dependency
      levels.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
