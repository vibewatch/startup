  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-capital-runway
      missingEvidence: Current cash balance, burn, debt, working capital, committed capital, and runway after the September 2025 angel financing.
      whyItMatters: The historical funding announcement does not show cash available now or whether production and commercialization can be financed.
      diligencePath: Obtain current management accounts, bank and debt schedules, round documents, monthly burn, working-capital needs, and a downside runway forecast.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR003]
    - type: stale
      severity: material
      topic: production-plan
      missingEvidence: Current status of the announced end-2025 market launch, production volume, paid deliveries, customer acceptance, and manufacturing yields.
      whyItMatters: The announced milestone is historical and no assigned source verifies the outcome; neither delay nor successful launch can be inferred.
      diligencePath: Request monthly production and delivery records, signed acceptance, order backlog, yield/rework data, and customer references.
      relatedQuestionRefs: [QR004, QR010]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: safety-security-reliability
      missingEvidence: Product safety case, cybersecurity architecture and tests, incident history, uptime, failure rates, service burden, and remediation records.
      whyItMatters: The physical-system risk cannot be rated from general sector commentary, and no recorded incident in this pool would not establish absence of incidents.
      diligencePath: Review safety assessments, penetration-test reports, incident and near-miss logs, customer uptime data, and corrective-action records.
      relatedQuestionRefs: [QR008, QR007]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: partner-supplier-dependencies
      missingEvidence: Signed partner contracts, commercial status, supplier map, concentration, capacity, lead times, and contingency plans.
      whyItMatters: Public announcements do not establish revenue, exclusivity, delivery obligations, or resilience of the manufacturing chain.
      diligencePath: Review executed agreements, top-supplier spend, qualification and capacity records, component lead times, and dual-source plans.
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: minor
      topic: eu-ai-regulation
      missingEvidence: Xingchen's EU market plans, intended-use classifications, and provider/deployer role for any AI-enabled product.
      whyItMatters: The AI Act summary makes applicability conditional on market, role, and use case; no assigned source establishes those facts.
      diligencePath: Obtain product deployment plans and have EU counsel classify each intended use and applicable compliance date.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
    - type: conflicting-data
      severity: material
      topic: china-regulation-effective-date
      missingEvidence: A primary-source clarification of the effective date, because Sidley's April 7 date differs from the translated provision's March 31 issue date and Article 18 commencement wording.
      whyItMatters: The date affects compliance timing and the legal basis for treating the regime as active.
      diligencePath: Obtain the authoritative Chinese text and a qualified local-counsel opinion on promulgation and effective dates.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: enumeration-incomplete
      severity: material
      topic: Regulatory / legal risk register coverage
