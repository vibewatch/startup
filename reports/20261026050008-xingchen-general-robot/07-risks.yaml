company:
  name: Xingchen General Robot
chapter:
  number: 7
  title: Risks
  summary: Public evidence identifies meaningful conditional exposure to China-related supply-chain rules, prospective U.S. market restrictions, and use-dependent EU AI obligations. Company-disclosed financing and a 2025 production milestone do not establish current runway, delivery, reliability, or security posture, so execution and partner risks remain materially unresolved.
sections:
  - id: china-cross-border-regulation
    title: China and cross-border regulatory exposure
    body: >-
      The strongest evidenced legal exposure is jurisdictional rather than a demonstrated
      violation by Xingchen. A translated State Council provision establishes investigation
      and countermeasure powers for specified conduct affecting industrial and supply-chain
      security; Sidley's analysis also flags potential conflict-of-laws issues for China-linked
      operations, supply-chain diligence, and cross-border data flows. The materials do not
      agree on the effective date: Sidley says April 7, 2026, while the translated text gives
      a March 31 promulgation date and says it takes effect on its date of issue. They do not
      establish how authorities would apply those powers to Xingchen or whether the company
      has a documented compliance program. Treat this as a high-impact diligence item, not
      evidence of enforcement against the company. Counsel should map China-based entities,
      suppliers, data transfers, and foreign customer commitments before relying on any
      mitigation.
    claimRefs: [CR002, CR003, CR004, CR005, CR014, CR018]
    tableRefs: [TR001]
  - id: market-access-and-ai-rules
    title: Market-access and AI compliance
    body: >-
      A robotics publication reports that the GUARD Act was introduced in June 2026 and
      describes a proposed route to restrict certain foreign-adversary robots through the
      FCC Covered List. The cited article is not the bill text, and the assigned evidence
      does not show enactment or a company-specific designation; U.S. access is therefore a
      contingent, high-impact exposure rather than a current ban. Separately, the EU AI Act
      summary makes obligations dependent on provider role, market/use, and high-risk
      classification. No assigned source establishes Xingchen's EU activity or intended
      uses. Confirm destination markets and application-level classification before
      assigning a compliance cost or probability.
    claimRefs: [CR006, CR007, CR008, CR009]
  - id: operating-and-product-assurance
    title: Operating execution and product assurance
    body: >-
      Xingchen's October 2025 company announcement described an engineering prototype,
      small-batch production as the next step, and a market launch expected by the end of
      2025. That dated target has passed, but the assigned pool contains no current
      production, delivery, uptime, failure-rate, safety, or cybersecurity record; this is
      an evidence gap, not proof of delay or an incident. Wider sector commentary identifies
      reliability, cost reduction, and demonstrated business value as commercialization
      hurdles, while a market database warns that some industry figures are not independently
      verified. Those sources do not benchmark Xingchen. Require current deployment logs,
      customer acceptance, service burden, safety controls, and security test evidence before
      treating the product as production-ready.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: capital-and-counterparty-dependencies
    title: Capital and counterparty dependencies
    body: >-
      The company-announced September 2025 angel financing named two investors and described
      the amount only as tens of millions of renminbi. The release said proceeds would fund
      technology iteration, production, and commercialization, but funding raised is not
      evidence of cash still available, runway, or committed follow-on capital. The same
      release named several strategic partners without disclosing contract scope, revenue,
      exclusivity, or renewal terms. These are company-issued claims rather than independent
      evidence of paid deployments or customer durability. Concentration and delivery
      dependencies therefore remain unknown until contracts, current cash data, and supplier
      commitments are reviewed.
    claimRefs: [CR010, CR011, CR013]
    tableRefs: [TR003]
