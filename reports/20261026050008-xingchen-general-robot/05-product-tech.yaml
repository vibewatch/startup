    title: External reference architecture—not Xingchen's verified stack
    columns: [Layer / component, Source-reported role, Evidence status, Xingchen diligence request]
    rows:
      - ["Perception and spatial reasoning", "Google describes embodied reasoning for spatial understanding, perception, and planning.", "Vendor-described reference capability.", "Identify sensors, perception models, localization methods, and tested operating envelope."]
      - ["Task policy / action generation", "Google describes a VLA model that outputs physical actions; NVIDIA describes multimodal robot foundation models.", "Two vendors describe their own products; no Xingchen linkage shown.", "Obtain model lineage, training data rights, action interface, and task-level evaluation."]
      - ["Embodiment-specific control", "Google says its reasoning model can connect to existing low-level controllers.", "Reference design principle, not a verified Xingchen control path.", "Document controller boundaries, control rates, fallback modes, and emergency stops."]
      - ["Simulation and data pipeline", "NVIDIA lists data pipelines and simulation frameworks in Isaac GR00T.", "NVIDIA platform description only.", "Show simulation coverage, real-world validation, dataset provenance, and sim-to-real results."]
      - ["Runtime compute and middleware", "NVIDIA lists middleware, accelerated runtime libraries, and robot compute in its platform.", "Supplier-issued product description; no Xingchen supplier relationship established.", "Provide hardware/software versions, dependencies, update policy, and offline behavior."]
    notes: "Rows summarize Google and NVIDIA materials about their own platforms; they must not be read as a Xingchen architecture or integration claim."
    claimRefs: [CE005, CE006, CE008, CE009]
  - id: TE003
    title: Product maturity, differentiation, and risk tests
    columns: [Test, Sector evidence, What it does not prove for Xingchen, Minimum diligence evidence]
    rows:
      - ["Repeatable task execution", "Sourcebotics reports that deployed autonomy may combine teleoperation and scripted skills.", "No Xingchen autonomy share, intervention rate, or task success rate.", "Task-level logs across repeated runs, with human interventions and failure taxonomy."]
      - ["Deployment economics", "Sourcebotics describes multi-cycle buyer validation and a long path to stable deployment.", "No Xingchen integration cost, service cost, or payback data.", "Paid deployment cohort, installation hours, utilization, uptime, and lifecycle cost."]
      - ["Technical differentiation", "Google and NVIDIA publish distinct embodied-model and platform approaches.", "Competitor or supplier materials do not establish Xingchen IP or performance advantage.", "Patent/product mapping, controlled benchmark protocol, and reproducible results."]
      - ["Commercial scale", "TrendForce reports scale milestones for Unitree and AgiBot.", "Those competitors' output is not Xingchen production or demand.", "Audited production, delivery, acceptance, and repeat-order records."]
      - ["Physical safety", "Google describes layered safety research and embodiment-specific low-level controllers.", "No Xingchen safety case or validation results in assigned evidence.", "Hazard analysis, safety architecture, test reports, and incident escalation records."]
      - ["Reliability and support", "A sector-focused article identifies reliability and business value as commercialization challenges.", "No Xingchen uptime, MTBF, repair, or support metrics.", "Field logs by product version, failure rates, repair times, and support SLAs."]
      - ["Privacy and cybersecurity", "The assigned technical sources do not assess Xingchen's data handling.", "No company-specific privacy or security controls established.", "Data-flow map, retention policy, access controls, threat model, and vulnerability response."]
      - ["Export / procurement exposure", "FDD describes a proposed U.S. procurement restriction and wider component-control concerns in March 2026.", "The article is not a legal-status update or an assessment of Xingchen's eligibility.", "Current counsel review by target jurisdiction and component-level export classification."]
    notes: "Sector reports aggregate third-party research and company-reported examples; their figures and timelines are not Xingchen metrics. The policy item is a dated analysis of a proposal, not a claim that a restriction became law or applies to Xingchen."
    claimRefs: [CE002, CE003, CE004, CE005, CE007, CE008, CE011, CE012, CE013]
