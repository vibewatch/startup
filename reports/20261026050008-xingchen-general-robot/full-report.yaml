  - id: FR001
    title: 'Risk heatmap: exposure versus evidence quality'
    type: matrix
    summary: >-
      Conditional policy exposures can have high impact, while current company-specific operating and capital evidence
      remains incomplete.
    data:
      columns:
        - Likelihood basis
        - Potential impact
        - Evidence quality / trigger
      rows:
        - label: China cross-border rules
          values:
            - Unknown; company-specific trigger not established
            - High if restrictive measures apply
            - Primary translated text and legal analysis; confirm date and application
        - label: U.S. market access
          values:
            - Proposal reported; current enactment not established
            - High if restrictions cover products
            - Single secondary account; verify legislative status and product scope
        - label: EU AI compliance
          values:
            - Conditional on market, role, and high-risk use
            - Potentially high for covered systems
            - Secondary summary; confirm destination, intended use, and provider role
        - label: Production and capital
          values:
            - Unknown from current assigned evidence
            - Material to execution and runway
            - Historical company announcement; obtain current delivery and cash records
        - label: Partner commitments
          values:
            - Company announcement only; terms unverified
            - Material if partner delivery or revenue is concentrated
            - Obtain executed agreements and current delivery status
        - label: Product assurance
          values:
            - Incident history is unestablished; absence in this pool is not proof of none
            - Potentially high for deployed physical systems
            - Request safety, security, uptime, and incident evidence
