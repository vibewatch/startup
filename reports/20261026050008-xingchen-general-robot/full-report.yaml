      - number: '6.3'
        title: Partnership is a channel hypothesis, not booked demand
        blocks:
          - type: paragraph
            body: >-
              The July 28, 2026 announcement describes a proposed cooperation between Xingchen and China Wantian's
              wholly owned AI subsidiary. Its intended mechanisms include product supply and technical support, joint
              promotion, scenario development, and exploration of government projects, technology services, and
              operations and maintenance services. These terms suggest a possible channel and implementation partner,
              but the same disclosure states the agreement is a basic framework that creates no substantive rights or
              obligations. No named end customer, executed purchase order, price, minimum volume, delivery schedule, or
              attributable customer outcome is disclosed in the assigned sources.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
      - number: '6.4'
        title: Customer durability remains unverified
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set contains no customer-level revenue, active-account count, deployment
              denominator, utilization, renewal, churn, gross retention, net retention, contract duration, or
              concentration data. The absence of these metrics from this limited source set is not evidence that no
              customers or incidents exist; it means the public proof is insufficient to underwrite recurring demand or
              customer economics. Sector commentary from TrendForce describes a broader shift toward tangible user value
              in the second half of 2026, but it does not report Xingchen customer performance. Before treating the park
              use or Wantian framework as durable adoption, diligence should obtain contract status, payment and renewal
              records, service-level results, and customer references.
            claimRefs:
              - CU009
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not count a framework as a customer contract
            body: >-
              China Wantian's announcement explicitly says the strategic framework creates no substantive rights or
              obligations. Treat it as a proposed route to market, not a binding order, recognized revenue, or proof of
              customer retention.
            calloutType: risk
            claimRefs:
              - CU001
              - CU003
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: China and cross-border regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest evidenced legal exposure is jurisdictional rather than a demonstrated violation by Xingchen.
              A translated State Council provision establishes investigation and countermeasure powers for specified
              conduct affecting industrial and supply-chain security; Sidley's analysis also flags potential
              conflict-of-laws issues for China-linked operations, supply-chain diligence, and cross-border data flows.
              The materials do not agree on the effective date: Sidley says April 7, 2026, while the translated text
              gives a March 31 promulgation date and says it takes effect on its date of issue. They do not establish
              how authorities would apply those powers to Xingchen or whether the company has a documented compliance
              program. Treat this as a high-impact diligence item, not evidence of enforcement against the company.
              Counsel should map China-based entities, suppliers, data transfers, and foreign customer commitments
              before relying on any mitigation.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
              - CR018
          - type: table
