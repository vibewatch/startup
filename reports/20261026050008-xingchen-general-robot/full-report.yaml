  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with low confidence in any investment price and high risk until financing
              terms and operating evidence are available. The assigned pool provides no Xingchen financing price,
              company financials, share count, cash runway, or liquidation terms, so a target return, hold threshold, or
              exit value cannot be calculated without inventing inputs. Apptronik's reported financing and UBTECH's
              interim operating results are useful context, not substitutes for Xingchen data or directly comparable
              valuation benchmarks. Keep valuation stance unknown and do not convert competitor marks into a price for
              Xingchen. Revisit only after company-level terms and evidence are tied to the proposed entry price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV011
              - CV014
      - number: '8.2'
        title: Peer marks are context, not price discovery
        blocks:
          - type: paragraph
            body: >-
              Public comparables show capital formation, not a transferable price for Xingchen. CNBC reported Apptronik
              at a $5 billion valuation in its 2026 $520 million financing; Apptronik's syndicated company release
              described the extension as opened at a 3x multiple of its Series A valuation but did not state an absolute
              mark. Forbes and CNBC also reported $935 million of total Series A funding. The Silicon Review reports a
              $2.21 billion LimX pre-IPO mark, without transaction documents in the assigned article. MarketScreener's
              profile describes UBTECH across education, logistics, sector-tailored and consumer robotics, while
              Quartr's summary includes the effects of a major acquisition. These issuers, business mixes, periods and
              financing disclosures are not harmonized. RoboZaps itself says only Unitree R1 and G1 prices were verified
              from official sources; other prices were announcements or estimates. None of these peer marks is an
              independent benchmark for Xingchen's price.
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario underwriting without false precision
        blocks:
          - type: paragraph
            body: >-
              A bull case would require repeatable paid deployments, improving unit economics, and production scale that
              is actually achieved; TrendForce's shipment outlook and competitor rollout figures are sector signals, not
              Xingchen forecasts. A base case should assume commercialization remains milestone-dependent and should not
              capitalize a market-size narrative before customer-level economics are disclosed. A bear case includes
              delayed adoption, reliability or integration limits, financing dilution, and lower peer multiples.
              Robozaps' production-cost discussion itself says estimates vary widely across machines and volumes, while
              QubitTool cautions that a foundation model label does not establish transfer or production readiness. The
              available evidence cannot support numeric company valuation ranges or scenario probabilities.
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Commercial proof and technical transfer remain valuation gates
        blocks:
          - type: paragraph
            body: >-
              UBTECH's Quartr summary reports H1 2026 revenue of RMB1,269.1 million and gross margin of 44.7%, but it
              also labels itself a partial AI-generated view and describes the effects of a major acquisition; these
              metrics are not a clean standalone multiple for Xingchen. TrendForce forecasts a 94% rise in China's 2026
              humanoid output and expects Unitree and AgiBot to account for nearly 80% of shipments, but those are
              forecasts, not audited realized demand. For a premium valuation, diligence must establish
              paid-versus-pilot revenue, renewal and utilization, gross margin by product, service burden, manufacturing
              yields, safety performance, and transfer across tasks and embodiments. Without that proof, broad market
              growth should not reduce the execution discount.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: Entry discipline and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The current decision is to defer price underwriting, not to infer that financing or commercial progress is
              absent. Before investing, request a fully diluted cap table, instrument and preference waterfall, debt and
              shareholder rights, cash and committed funding schedule, current revenue recognized by product, gross
              margin, burn and working-capital needs, and signed customer contracts with paid deployment and renewal
              status. Set the entry price only after reconciling those inputs with a model appropriate to the company's
              stage and a documented exit path. A missed deployment or production milestone, persistent negative unit
              economics, material customer churn, or a financing round with senior preferences should reopen the call;
              the assigned sources do not quantify Xingchen-specific thresholds.
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV014
              - CV015
