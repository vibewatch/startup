chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, location, and product direction
        blocks:
          - type: paragraph
            body: >-
              Baidu Baike identifies Shenzhen Xingchen General Robot Co., Ltd. as established on 22 July 2024 and
              describes its business as embodied-AI robotics research and development, with service-consumer,
              industrial, and special-purpose robotics in its stated scope. The same page reports that the company moved
              its headquarters from Shenzhen to Changsha's Wangcheng District in July 2025 while its registered address
              remained in Shenzhen; this distinction matters because registration and operating location are not
              interchangeable. The page names former UBTECH vice president Zhang Chengwen and USTC PhD Liu Jinsu in the
              founding team, but the assigned evidence does not independently verify their biographies or the company's
              current leadership structure. Baidu Baike describes a "one-brain, multiple-bodies" approach and
              company-developed decision and motion-control systems. These are company-technology descriptions reported
              by a secondary reference, not independently measured capability claims. (CO001–CO007)
            claimRefs:
