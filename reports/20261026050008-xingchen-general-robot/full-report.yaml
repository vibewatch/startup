      - number: '1.2'
        title: Financing, commercial signals, and operating gaps
        blocks:
          - type: paragraph
            body: >-
              Baidu Baike reports a September 2025 angel financing described only as "several tens of millions of yuan,"
              naming Xiangjiang Guotou and Hunan Haichuang as investors. It separately reports RMB 30 million of support
              from a district investment company through a direct-investment and government-guidance-fund arrangement;
              the supplied account does not clarify the legal instrument, recipient entity, or whether that amount
              overlaps the angel round, so it must not be added to capital raised. There is no independently established
              valuation, revenue, ARR, customer count, headcount, cash balance, or deployment volume in the assigned
              sources. A July 2026 China Wantian-related framework agreement is a commercial signal, but the
              announcement says it creates no substantial rights or obligations and leaves specific terms to future
              agreements. The agreement is reported in two outlets from the same partner-side disclosure, not
              independently corroborated. The broad sector sources provide context, not Xingchen-specific operating
              metrics. (CO008–CO012, CO014, CO016)
