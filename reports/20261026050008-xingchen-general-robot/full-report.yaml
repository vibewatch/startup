      - number: '7.2'
        title: Market-access and AI compliance
        blocks:
          - type: paragraph
            body: >-
              A robotics publication reports that the GUARD Act was introduced in June 2026 and describes a proposed
              route to restrict certain foreign-adversary robots through the FCC Covered List. The cited article is not
              the bill text, and the assigned evidence does not show enactment or a company-specific designation; U.S.
              access is therefore a contingent, high-impact exposure rather than a current ban. Separately, the EU AI
              Act summary makes obligations dependent on provider role, market/use, and high-risk classification. No
              assigned source establishes Xingchen's EU activity or intended uses. Confirm destination markets and
              application-level classification before assigning a compliance cost or probability.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operating execution and product assurance
        blocks:
          - type: paragraph
            body: >-
              Xingchen's October 2025 company announcement described an engineering prototype, small-batch production as
              the next step, and a market launch expected by the end of 2025. That dated target has passed, but the
              assigned pool contains no current production, delivery, uptime, failure-rate, safety, or cybersecurity
              record; this is an evidence gap, not proof of delay or an incident. Wider sector commentary identifies
              reliability, cost reduction, and demonstrated business value as commercialization hurdles, while a market
              database warns that some industry figures are not independently verified. Those sources do not benchmark
              Xingchen. Require current deployment logs, customer acceptance, service burden, safety controls, and
              security test evidence before treating the product as production-ready.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
