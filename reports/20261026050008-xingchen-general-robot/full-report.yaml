      - number: '6.2'
        title: Adoption is visible, but scale is not
        blocks:
          - type: paragraph
            body: >-
              Independent coverage describes robots operating at Qianhaishi Park in Shenzhen in March 2026, including a
              robot from Xingchen assigned to patrol and visitor assistance. This is evidence of a real public-facing
              deployment, but the reporting also characterizes the initiative as a showcase and testing ground. The
              stories do not establish whether Xingchen's participation was paid, whether the machines were in
              continuous production service, how many users they served, or whether the deployment renewed or expanded.
              Multiple outlets repeat the same CNS/AP account, so their publication across domains should not be
              mistaken for several independently sourced customer references.
            claimRefs:
              - CU004
