      - number: '7.4'
        title: Capital and counterparty dependencies
        blocks:
          - type: paragraph
            body: >-
              The company-announced September 2025 angel financing named two investors and described the amount only as
              tens of millions of renminbi. The release said proceeds would fund technology iteration, production, and
              commercialization, but funding raised is not evidence of cash still available, runway, or committed
              follow-on capital. The same release named several strategic partners without disclosing contract scope,
              revenue, exclusivity, or renewal terms. These are company-issued claims rather than independent evidence
              of paid deployments or customer durability. Concentration and delivery dependencies therefore remain
              unknown until contracts, current cash data, and supplier commitments are reviewed.
            claimRefs:
