              - CO012
              - CO013
      - number: '1.3'
        title: Milestones and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The available milestone record is thin and largely comes from one Baidu Baike page; the dated events below
              should therefore be treated as reported milestones pending primary-document review. It describes a 2025
              Changsha relocation and project signing, the angel financing, a later Shenzhen registered-address change,
              and a December 2025 Suining cooperation. The most recent dated company-specific item in this pool is the
              28 July 2026 China Wantian framework agreement. Neither that announcement nor the broader industry
              coverage establishes paid deliveries, repeat customers, or durable unit economics. The Foundation for
              Defense of Democracies describes a proposed U.S. federal-procurement restriction for certain
              foreign-adversary unmanned ground systems; this is a jurisdiction-specific policy risk to diligence, not
              evidence that Xingchen itself is named or restricted. Priority diligence is to obtain corporate and
              financing documents, current leadership and ownership records, definitive customer contracts, audited
              operating metrics, and deployment and safety evidence. (CO003, CO009, CO010, CO012–CO016)
