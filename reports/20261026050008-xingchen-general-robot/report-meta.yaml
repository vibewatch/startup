companyProfile:
  summary: >-
    Xingchen General Robot is a Chinese embodied-robotics developer established in 2024, with Baidu Baike reporting an
    operating-headquarters move to Changsha while the registered entity remains in Shenzhen. That same secondary source
    describes service-consumer, industrial, and special-purpose robotics, a one-brain/multiple-bodies approach, a
    wheeled dual-arm prototype, and a September 2025 angel round; the product's current launch status and financing
    terms are not established. A July 2026 China Wantian framework is a commercial signal rather than evidence of a
    binding order or paid deployment. Company financials, customers, headcount, and valuation remain undisclosed in the
    assigned evidence, while founder and leadership details lack independent corroboration.
