    title: Commercial evidence and market-access qualifications
    type: matrix
    summary: The evidence mixes adjacent-market context, reported deployments, and a competitor price point; rows are not a common scale or proof of market size.
    data:
      columns:
        - What the source reports
        - What it does not establish
      rows:
        - label: China industrial-robot baseline
          values:
            - 300,000 industrial robots installed in 2024, as reported by FDD.
            - Adjacent automation context only; not humanoid units.
        - label: WAIC exhibition
          values:
            - RobotToday reports 208 embodied-intelligence terminals and more than 300 operational robots displayed.
            - Exhibition counts are not paid deployments or market shipments.
        - label: Warehouse deployment
          values:
            - RobotToday reports an AgiBot–JD Logistics operational warehouse use case.
            - Uptime and total deployment cost were not disclosed.
        - label: Proposed U.S. procurement restriction
          values:
            - FDD reports a bill introduced on March 26, 2026, proposing restrictions on federal purchases of certain foreign-adversary unmanned ground systems.
            - A proposal is not enacted law; Xingchen-specific eligibility is not assessed.
        - label: Semiconductor supply constraint
          values:
            - ETC Journal describes advanced semiconductors as subject to U.S. export controls.
            - The fetched article does not quantify Xingchen's exposure or supply needs.
        - label: Reported low-price point
          values:
            - ChinaBizInsider reports a RMB 9,998 entry-level humanoid price.
            - A single reported competitor price is not an independent price survey or evidence of Xingchen unit economics.
    claimRefs:
      - CM007
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
