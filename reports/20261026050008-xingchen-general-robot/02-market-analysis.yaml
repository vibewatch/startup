      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM009
  - id: TM003
    title: Buyer, workflow, budget, and adoption evidence
    columns:
      - Segment
      - Buyer / user
      - Payer or budget owner
      - Workflow / trigger
      - Evidence status
    rows:
      - - Factory automation
        - Manufacturing operator / production-line team.
        - Not identified in assigned evidence.
        - Repetitive or structured production tasks; demand is described at sector level.
        - Adjacent industrial-robot base is not humanoid demand; Xingchen paid deployments are not shown.
      - - Warehouse logistics
        - Logistics operator and warehouse staff.
        - Not identified; no contract economics provided.
        - Material handling and palletizing use cases.
        - RobotToday reports one AgiBot–JD operational warehouse case; uptime and total cost remain undisclosed.
      - - Commercial service / retail
        - Retail or service-chain operator and customer-facing staff.
        - Not identified; reported cooperation is not proof of a customer budget.
        - New-service and retail contexts are described in connection with Xingchen.
        - Baidu Baike lists strategic cooperation but no paid status, contract value, or repeat deployment evidence.
      - - Household
        - Household end user.
        - Household purchase; willingness to pay is unmeasured in this pool.
        - Consumer humanoid purchase or pre-order.
        - RoboZaps reports competitor prices from USD 4,900 to USD 25,000; this is not Xingchen pricing or demand.
    notes: >-
      Buyer/user roles are analytical segment definitions; payer, budget
      authority, purchase conversion, and renewal data are marked unknown when
      absent from assigned sources.
