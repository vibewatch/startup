company:
  name: Xingchen General Robot
chapter:
  number: 2
  title: Market Analysis
  summary: Public evidence points to a fast-growing but still forecast-heavy humanoid-robot market, with China shipment estimates and product-level price signals that are not interchangeable with a defensible market size. Xingchen's disclosed product scope and reported partnerships indicate possible industrial and service entry points, but the assigned sources do not establish its addressable spend, paid deployments, or unit economics.
sections:
  - id: market-boundary
    title: A narrow market boundary is essential
    body: >-
      This chapter uses humanoid and embodied robots sold into work or service
      settings as its core market, with household humanoids treated as an
      adjacent segment rather than assumed demand. The boundary excludes the
      installed base and revenue of conventional industrial robots, general AI
      software, and unrelated consumer devices. That distinction matters:
      FDD's cited 300,000 industrial-robot installations in China in 2024 are
      an adjacent automation baseline, not humanoid units or a humanoid TAM
      (CM007). The Silicon Review identifies reliability, cost reduction, and
      business value beyond demonstrations as adoption hurdles (CM008), not
      as evidence of market size.
      Xingchen's reported business scope spans service-consumer, industrial,
      and special-purpose robots (CM014); this breadth is a product-scope
      statement, not proof that each category is commercially addressable.
    claimRefs:
      - CM007
      - CM008
      - CM014
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Forecasts describe different measures, not one TAM
    body: >-
      The assigned evidence offers a dollar forecast with unspecified
      geography, China production and shipment forecasts, and product price
      listings; these are separate
      lenses with different geographies, periods, and denominators. RoboZaps
      reproduces a MarketsandMarkets estimate of USD 2.9 billion in 2025 and
      USD 15.3 billion in 2030, with a 39% CAGR, while explicitly saying it
      does not independently verify the projections (CM001). TrendForce's
      94% figure is forecast annual output growth in China for 2026, not
      revenue growth or market value (CM002). TrendForce also projects that
      Unitree and AgiBot could account for nearly 80% of China humanoid
      shipments, while ETC Journal reports 2025 company shares without
      specifying the denominator (CM003, CM004). RoboZaps' 26-robot tracker
      and its 14-product commercial-availability count describe that
      publisher's sample, not the total market (CM005). None of these measures
      yields a defensible Xingchen-specific TAM, SAM, or SOM.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM002
  - id: buyers-and-budget
    title: Buyers are identifiable; budget evidence is not
    body: >-
      The evidence points to factory operators, logistics providers,
      commercial-service businesses, and household buyers as distinct
      potential segments, but it does not identify a common payer or budget
      owner. RobotToday reports a warehouse deployment with JD Logistics and
      describes orders across automotive, consumer-electronics, and logistics
      applications as signs of commercial traction; the publication also
      notes that operating economics were not disclosed (CM010, CM011).
      Baidu Baike lists Xingchen's broad robot categories and cooperation
      involving 华润数科, 海尔智家, and 龙腾出行 in new-service and retail
      contexts (CM014, CM015). Those reported relationships do not establish
      paid orders,
      purchase authority, or repeat use. RoboZaps' consumer listings show
      product prices, not verified demand for Xingchen or the segment
      (CM006).
    claimRefs:
      - CM006
      - CM010
      - CM011
      - CM014
      - CM015
    tableRefs:
      - TM003
  - id: adoption-and-constraints
    title: Deployment signals remain short of adoption economics
    body: >-
      Current coverage mixes exhibition activity, early deployment reports,
      cost claims, and policy risk. RobotToday says WAIC 2026 displayed 208
      embodied-intelligence terminals and more than 300 operational robots;
      those show-floor counts are not sales or installed-base measurements
      (CM009). Its account of the AgiBot–JD warehouse deployment is a
      company/use-case signal, while the same report says uptime and total
      deployment cost were not disclosed (CM010, CM011). ChinaBizInsider
      reports a RMB 9,998 entry-level price for a competing
      humanoid, but this single-source listing does not establish Xingchen
      pricing or a buyer's return on investment (CM016).
      Separately, FDD describes a proposed U.S. federal procurement
      restriction, and ETC Journal discusses advanced-semiconductor export
      controls; both are potential market-access or supply constraints, not
      evidence of enacted restrictions on Xingchen (CM012, CM013).
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM016
    figureRefs:
      - FM001
tables:
  - id: TM001
    title: Working market boundary and buyer map
    columns:
      - Segment
      - Included activity
      - Excluded or unproven spend
      - Potential buyer / payer
      - Xingchen relevance
    rows:
      - - Factory automation
        - Humanoid or embodied-robot equipment and deployment for production tasks.
        - Conventional industrial-robot installed base and general factory automation revenue.
        - Manufacturer or plant operator; budget owner not identified in assigned sources.
        - Baidu Baike lists industrial-robot activities for Xingchen; commercial fit and paid demand are unverified.
      - - Warehouse and logistics
        - Humanoid systems deployed for handling or warehouse workflows.
        - General warehouse software and non-humanoid automation spend.
        - Logistics operator or third-party logistics provider; contract payer is undisclosed.
        - A reported JD Logistics use case signals category activity, not Xingchen adoption.
      - - Commercial service and retail
        - Service robots and robot-enabled retail or customer-service workflows.
        - General retail technology and non-robot service spending.
        - Service-chain or retailer operator; no budget owner or contract value is provided.
        - The reported company scope includes service-consumer robotics, but the source does not establish market size.
      - - Household humanoids
        - Consumer humanoid hardware and related deployment or support.
        - Smart-home devices and consumer robotics outside humanoids.
        - Household end buyer; repeat purchase and willingness-to-pay evidence is absent.
        - RoboZaps lists competitor product prices; no Xingchen consumer price is in the pool.
    notes: >-
      Analyst-defined working boundary from the assigned evidence, not a
      publisher's standardized taxonomy. Conventional industrial-robot
      installations are excluded from humanoid market size; company-scope and
      price listings are not treated as paid demand.
    claimRefs:
      - CM006
      - CM007
      - CM014
      - CM015
  - id: TM002
    title: Sizing lenses and their limits
    columns:
      - Publisher / attribution
      - Year and geography
      - Metric and reported value
      - Method / confidence
      - Limitation for Xingchen sizing
    rows:
      - - MarketsandMarkets, as reproduced by RoboZaps
        - 2025–2030; geography not specified in the fetched article
        - USD 2.9B in 2025 to USD 15.3B in 2030; reported CAGR 39%.
        - Third-party estimate reproduced in a marketplace report; not independently verified by RoboZaps.
        - Fetched text does not provide a market boundary or methodology; not a Xingchen SAM.
      - - TrendForce
        - 2026; China
        - Annual humanoid-robot output growth forecast at 94%.
        - Analyst forecast reported by TrendForce.
        - Output growth is not dollar-market growth, realized shipments, or Xingchen share.
      - - TrendForce
        - 2026; China shipments
        - Unitree and AgiBot together projected to account for nearly 80% of total shipments.
        - Analyst projection; denominator is total shipments.
        - No unit or value share for Xingchen is disclosed.
      - - ETC Journal
        - 2025; global market share reported by ETC Journal, denominator unspecified
        - AgiBot 39%, Unitree 32%, and UBTECH 7% reported shares.
        - Secondary-source estimates; the fetched article does not define the denominator.
        - Do not compare directly with TrendForce's 2026 China shipment projection.
      - - RoboZaps tracker
        - 2026 report; 7 countries
        - 26 humanoid robots tracked; 14 marked commercially available.
        - Publisher-defined sample; availability includes purchase or pre-order with confirmed pricing.
        - A curated product count is not shipment, demand, or market-share evidence.
      - - RoboZaps price listings
        - 2026 report; consumer products
        - USD 4,900–25,000 reported consumer price range.
        - Only Unitree R1 and G1 prices are identified as officially verified.
        - Competitor pricing does not establish Xingchen pricing or unit economics.
      - - FDD
        - 2024; China industrial-robot installations
        - China installed 300,000 industrial robots, nearly ten times the U.S. count.
        - FDD reports an industrial-robot installation measure.
        - Adjacent automation context only; not humanoid shipments or market revenue.
      - - RobotToday
        - WAIC 2026; exhibition
        - 208 embodied-intelligence terminals and more than 300 operational robots displayed.
        - Conference figures reported by RobotToday.
        - Exhibition counts are not paid deployments or shipment totals.
    notes: >-
      Values retain each source's metric, geography, period, and attribution.
      The dollar projection, output growth, shipment forecasts, and
      shipment-share projection have different denominators and cannot be
      added or treated as comparable TAM/SAM/SOM estimates.
    claimRefs:
