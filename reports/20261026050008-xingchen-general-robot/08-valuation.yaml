  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: company-valuation-gap
      missingEvidence: Xingchen's current financing price, instrument, fully diluted capitalization, preferences, debt, and committed versus available cash.
      whyItMatters: Without price and capital-structure terms, no entry valuation, dilution analysis, downside recovery, or investor return can be calculated.
      diligencePath: Request the current cap table, executed financing documents, debt schedule, preference waterfall, and cash reconciliation from management and lead investors.
      relatedQuestionRefs: [QV001, QV007]
    - type: private-evidence-only
      severity: material
      topic: company-unit-economics
      missingEvidence: Xingchen revenue by product, gross margin, recognized versus contracted revenue, burn, working capital, and customer-level paid deployment and renewal data.
      whyItMatters: Peer revenue growth and market forecasts cannot establish Xingchen's conversion, contribution margin, cash needs, or ability to support a valuation multiple.
      diligencePath: Reconcile audited or management financials to signed contracts, invoices, utilization logs, renewals, unit costs, and cash-burn forecasts.
      relatedQuestionRefs: [QV002, QV004, QV007]
    - type: missing-source
      severity: material
      topic: technical-commercialization-risk
      missingEvidence: Independent evidence for Xingchen robot reliability, safety performance, service burden, production yield, and task transfer across deployments.
      whyItMatters: These operating outcomes determine whether projected scale and labor-value claims can convert into durable revenue and lower cost.
      diligencePath: Obtain customer references, deployment-level uptime and intervention logs, safety records, production yield data, and repeatable task evaluations.
      relatedQuestionRefs: [QV004, QV006, QV008]
    - type: conflicting-data
      severity: minor
      topic: peer-valuation
      missingEvidence: Primary transaction documents or issuer-confirmed valuation terms for peer marks reported by secondary market and trade publications.
      whyItMatters: Unverified peer marks can create false precision if treated as comparable financing benchmarks.
      diligencePath: Confirm each peer's financing instrument, pre- or post-money basis, date, and dilution from issuer releases or transaction participants before using a multiple.
      relatedQuestionRefs: [QV003, QV005]
