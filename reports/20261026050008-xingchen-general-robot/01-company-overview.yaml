company:
  name: Xingchen General Robot
chapter:
  number: 1
  title: Company Overview
  summary: Public material identifies Xingchen as a young Chinese embodied-robotics developer with roots in Shenzhen and a reported operating move to Changsha, a reported 2025 angel round, and a July 2026 cooperation framework with China Wantian. Most operating, financing, governance, and commercialization details remain based on a single low-tier company-information page or are not established by the assigned sources.
sections:
  - id: identity-and-product
    title: Identity, location, and product direction
    body: >-
      Baidu Baike identifies Shenzhen Xingchen General Robot Co., Ltd. as
      established on 22 July 2024 and describes its business as embodied-AI
      robotics research and development, with service-consumer, industrial, and
      special-purpose robotics in its stated scope. The same page reports that
      the company moved its headquarters from Shenzhen to Changsha's Wangcheng
      District in July 2025 while its registered address remained in Shenzhen;
      this distinction matters because registration and operating location are
      not interchangeable. The page names former UBTECH vice president Zhang
      Chengwen and USTC PhD Liu Jinsu in the founding team, but the assigned
      evidence does not independently verify their biographies or the
      company's current leadership structure. Baidu Baike describes a
      "one-brain, multiple-bodies" approach and company-developed decision and
      motion-control systems. These are company-technology descriptions
      reported by a secondary reference, not independently measured capability
      claims. (CO001–CO007)
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001, TO002]
  - id: financing-and-commercial-evidence
    title: Financing, commercial signals, and operating gaps
    body: >-
      Baidu Baike reports a September 2025 angel financing described only as
      "several tens of millions of yuan," naming Xiangjiang Guotou and Hunan
      Haichuang as investors. It separately reports RMB 30 million of support
      from a district investment company through a direct-investment and
      government-guidance-fund arrangement; the supplied account does not
      clarify the legal instrument, recipient entity, or whether that amount
      overlaps the angel round, so it must not be added to capital raised.
      There is no independently established valuation, revenue, ARR, customer
      count, headcount, cash balance, or deployment volume in the assigned
      sources. A July 2026 China Wantian-related framework agreement is a
      commercial signal, but the announcement says it creates no substantial
      rights or obligations and leaves specific terms to future agreements.
      The agreement is reported in two outlets from the same partner-side
      disclosure, not independently corroborated. The broad sector sources
      provide context, not Xingchen-specific operating metrics. (CO008–CO012,
      CO014, CO016)
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO014, CO016]
    tableRefs: [TO003]
  - id: milestones-and-risk
    title: Milestones and diligence priorities
    body: >-
      The available milestone record is thin and largely comes from one
      Baidu Baike page; the dated events below should therefore be treated as
      reported milestones pending primary-document review. It describes a
      2025 Changsha relocation and project signing, the angel financing, a
      later Shenzhen registered-address change, and a December 2025 Suining
      cooperation. The most recent dated company-specific item in this pool is
      the 28 July 2026 China Wantian framework agreement. Neither that
      announcement nor the broader industry coverage establishes paid
      deliveries, repeat customers, or durable unit economics. The Foundation
      for Defense of Democracies describes a proposed U.S. federal-procurement
      restriction for certain foreign-adversary unmanned ground systems; this
      is a jurisdiction-specific policy risk to diligence, not evidence that
      Xingchen itself is named or restricted. Priority diligence is to obtain
      corporate and financing documents, current leadership and ownership
      records, definitive customer contracts, audited operating metrics, and
      deployment and safety evidence. (CO003, CO009, CO010, CO012–CO016)
    claimRefs: [CO003, CO009, CO010, CO012, CO013, CO014, CO016, CO017]
    figureRefs: [FO001]
