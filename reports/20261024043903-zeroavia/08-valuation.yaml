        - {id: milestone, label: "Milestone conversion", detail: "Certification, industrialization, paid deployments"}
        - {id: comparables, label: "Comparator normalization", detail: "Public peers differ in product, maturity and operating model"}
        - {id: economics, label: "Economic disclosure", detail: "Valuation, cash, burn, margin and preference terms"}
        - {id: risk, label: "Residual risk", detail: "Certification delay, dilution, infrastructure and customer conversion"}
        - {id: decision, label: "Decision", detail: "Research-more"}
        - {id: trigger, label: "Upgrade trigger", detail: "Verified terms plus paid commercial milestones"}
      edges:
        - {from: evidence, to: milestone}
        - {from: milestone, to: comparables}
        - {from: comparables, to: economics}
        - {from: economics, to: risk}
        - {from: risk, to: decision}
        - {from: decision, to: trigger}
    claimRefs: [CV002, CV004, CV006, CV009, CV011, CV013, CV014, CV015]
