company:
  name: ZeroAvia
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a technically credible, strategically backed hydrogen-electric aviation platform, but it does not disclose the current price, cash balance, revenue conversion, or preference stack needed for a buy decision. The appropriate stance is research-more until financing terms and milestone conversion are verified.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      ZeroAvia has assembled a credible technical and strategic platform: its own materials describe
      aerospace-grade hydrogen-electric power and propulsion systems, while the FAA has published
      final special conditions for the ZA601 electric engine. Independent reporting also describes
      customer discussions, conditional orders, and a broad investor and airline-partner set. These
      are meaningful de-risking signals, but they are not equivalent to certified commercial revenue.
      The anti-thesis is therefore price and execution sensitive. The public record does not establish
      a post-money valuation, current cash, monthly burn, product gross margin, backlog conversion,
      or preference terms. A recommendation stronger than research-more would require documentary
      proof that the next certification and customer milestones convert into cash-generating deliveries
      before the current financing runway is consumed. Public-company references from Archer, Vertical
      Aerospace, and Joby provide disclosure channels and sector context, but the retained pages do not
      supply a like-for-like valuation mark for a private propulsion-system supplier.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013, CV014, CV015]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenarios-and-entry
    title: Scenarios and entry discipline
    body: >-
      Scenario analysis should be milestone based rather than a false-precision revenue multiple.
      The bull case depends on the ZA601 certification path, successful industrialization, and
      conversion of announced partnerships or pre-orders into binding, paid deployments. The base
      case assumes continued technical progress but a longer certification and infrastructure ramp,
      requiring another financing round before material revenue. The bear case combines delay,
      dilution, and weak customer conversion; the 2024 failure of Universal Hydrogen is a relevant
      sector warning, not a forecast for ZeroAvia. Because the latest financing is reported as $150
      million with two years of runway but the current valuation and cash balance are undisclosed,
      entry discipline should be tied to verified runway, cap-table seniority, and a price that
      compensates for certification and commercialization risk. No numeric target return, holding-period
      return, or exit multiple is supportable from the retained public evidence.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV015]
    tableRefs: [TV003]
  - id: diligence-and-decision
    title: Diligence asks and decision
    body: >-
      The decision is track or research-more, not buy, because the evidence supports capability and
      strategic interest more strongly than it supports investable economics. The next diligence
      package should include the executed Series D term sheet, post-money capitalization, liquidation
      preferences, option pool, debt and grant restrictions, monthly cash bridge, burn, gross margin
      by product, and customer-level backlog conversion. Technical diligence should reconcile the
      FAA special-conditions record with the current certification schedule and identify the remaining
      means-of-compliance, manufacturing, service, and safety obligations. Commercial diligence should
      distinguish announced partnerships, conditional orders, pre-orders, and paid recurring or
      delivered revenue. A price reset, transparent financing terms, or independently verified paid
      deployments could improve the call; a delayed certification, runway below the next milestone,
      or another rescue financing would break the thesis.
    claimRefs: [CV004, CV005, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: []
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a buy without current price and financing terms."]
      - [Confidence, "Medium", "Technical and strategic evidence is stronger than economic disclosure."]
      - [Risk rating, "High", "Certification, infrastructure, funding, and commercialization remain material."]
      - [Valuation stance, "Indeterminate", "Post-money valuation, dilution, and preference stack are not public."]
      - [Target return / exit, "Not supportable", "No retained source provides a defensible private valuation or exit multiple."]
      - [Comparable reference, "Archer, Vertical Aerospace, and Joby", "Useful for sector disclosure and milestone framing, not a like-for-like price anchor."]
    notes: "Evidence combines company disclosures, independent reporting, and regulatory records; null economics remain unverified."
    claimRefs: [CV001, CV004, CV006, CV009, CV013, CV014, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Technical platform", "ZA601 has FAA final special conditions; the company reports a broad hydrogen-electric portfolio.", "Evidence of certification completion and repeatable production."]
      - ["Strategic validation", "Airline, OEM, defense, and investor relationships are reported.", "Signed paid orders and disclosed customer concentration."]
      - ["Funding support", "Series D is reported at $150M and two years of runway.", "Audited cash bridge, burn, and remaining runway."]
      - ["Commercialization risk", "Independent reporting notes certification and competitor-funding failure risk.", "Delivered aircraft, recognized revenue, and margin evidence."]
      - ["Comparable limits", "Public aviation peers disclose through investor portals but differ in product and operating model.", "Current market values normalized to cash, debt, maturity, and certification stage."]
    notes: "Rows are analytical judgments anchored to cited claims; announced relationships are not treated as realized revenue."
    claimRefs: [CV002, CV003, CV005, CV006, CV010, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "ZA601 certification progresses; industrialization and customer discussions convert to paid deployments.", "Re-rate only after milestone evidence supports a revenue or backlog-based valuation.", "Low-to-medium: strategic validation exists but conversion is unproven.", "Certification or production milestone slips."]
      - [Base, "Certification continues but infrastructure and customer conversion take longer; another round is needed.", "Research-more; price must reflect dilution and extended time to revenue.", "Medium: consistent with disclosed runway and current opacity.", "Cash falls below the next certification milestone."]
      - [Bear, "Certification or commercialization stalls and financing requires dilution or rescue capital.", "Avoid at the current unknown price; loss severity depends on preference stack.", "Material: sector precedent shows funding failure can end a peer.", "Down-round, insolvency filing, or cancellation of core programs."]
      - [Entry discipline, "No public post-money valuation, cash balance, burn, gross margin, or like-for-like comparator mark.", "Require verified cap table, terms, runway, and paid-customer evidence before pricing.", "High confidence as a disclosure gap, not a forecast.", "Any price set without those documents."]
    notes: "Scenarios are qualitative decision cases, not forecasts; no public valuation or revenue base supports a precise target price."
    claimRefs: [CV006, CV007, CV009, CV010, CV011, CV015]
