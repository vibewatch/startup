      - [ZA600 propulsion, "Planned hydrogen-electric powertrain for 10–20-seat aircraft", "Prototype flight-tested; hundreds of engine orders claimed in a company release", "Orders are not deliveries or revenue", "Reconcile signed contracts, deposits, cancellation terms, and delivery milestones"]
      - [ZA2000 propulsion, "Larger powertrain for 40–80-seat aircraft", "Development and regulatory milestones described; price and timing undisclosed", "Pre-commercial development", "Obtain development budget, certification gate plan, and customer commitments"]
      - [Hydrogen storage/refuelling, "Gaseous/liquid storage and mobile dispensing equipment", "Product portfolio described; no list pricing or realized economics", "Official product description", "Obtain bill of materials, installed cost, service model, and gross margin"]
    notes: "Sources include ZeroAvia official pages and a company financing release; no row should be interpreted as reported revenue without contracts and accounting schedules."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Item, List or realized price, Contract form, Known qualification, Underwriting implication]
    rows:
      - [SuperStack Flex, null, "Supply/deployment discussed; terms undisclosed", "No public price or revenue amount", "Cannot calculate ARPU, gross margin, or payback"]
      - [ZA600 engine, null, "Conditional orders and launch-customer references", "Order count is not recognized revenue", "Need deposit, delivery, warranty, and cancellation terms"]
      - [ZA2000 engine, null, "Development/customer collaboration", "Certification and configuration remain in progress", "Need target price, development contribution, and support obligation"]
      - [Hydrogen infrastructure, null, "Equipment/system sales or deployment model not disclosed", "Technology page describes products, not commercial contracts", "Need installation economics and recurring service assumptions"]
    notes: "Null prices are unavailable public inputs, not zero prices; official product descriptions and third-party coverage do not establish realized pricing."
    claimRefs: [CI001, CI002, CI003, CI014]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Cash on hand, null, "Unavailable", "Determines ability to fund certification and production", "Obtain latest bank and restricted-cash reconciliation"]
      - [Monthly cash burn, null, "Unavailable", "Tests whether the stated two-year runway is sufficient", "Provide 24-month monthly cash bridge by program"]
      - [Gross margin by product, null, "Unavailable", "Separates component sales from development spending", "Provide product-level unit-cost and warranty schedule"]
      - [CAC/payback or sales cycle, null, "Unavailable", "Tests whether airline and defense pipeline converts efficiently", "Provide funnel, sales-cycle, channel-fee, and customer-acquisition data"]
      - [Certification capex and working capital, null, "Unavailable", "Defines next-round trigger and dilution risk", "Provide milestone-linked capex, inventory, supplier deposits, and financing plan"]
    notes: "Public sources describe funding, grants, products, and risks but do not disclose these unit-economics fields; nulls are explicit diligence blockers."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI015]
