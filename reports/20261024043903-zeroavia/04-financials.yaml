callouts:
  - calloutType: strength
    title: Financing and dual-use optionality
    body: "The latest financing announcement says runway was extended for two years, while SuperStack Flex is described as already supplied to defense and applicable to civil systems."
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Capital adequacy remains unproven
    body: "The public record does not disclose cash, burn, gross margin, debt, or certification capex, and an adverse review reports funding uncertainty and staff reductions."
    claimRefs: [CI007, CI008, CI009, CI015]
  - calloutType: recommendation
    title: Underwrite milestones, not headline funding
    body: "Require contract-level bookings, monthly cash reporting, unit-cost evidence, and certification-linked financing triggers before treating the funding and order narrative as revenue visibility."
    claimRefs: [CI002, CI005, CI012, CI015]
