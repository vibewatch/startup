company:
  name: ZeroAvia
chapter:
  number: 4
  title: Financials
  summary: ZeroAvia has a capital-intensive, pre-certification revenue model built around propulsion systems, modular fuel-cell power systems, and related infrastructure. Public evidence supports significant grant and equity funding and a stated two-year runway extension, but does not disclose recurring revenue, realized pricing, cash balance, burn, gross margin, or customer-level backlog conversion; an adverse review also flags funding dependency, difficult operating economics, and repeated schedule slippage.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      ZeroAvia's public materials describe two monetization paths rather than a
      mature recurring-revenue business. The first is the sale or deployment of
      hydrogen-electric propulsion systems for existing aircraft segments,
      including the planned ZA600 for 10–20-seat aircraft and a larger
      40–80-seat powertrain. The second is component and systems revenue:
      the company says it is already supplying SuperStack Flex modular fuel-cell
      power generation to the defense sector and is discussing deployments with
      eVTOL and fixed-wing commercial players. Its technology page also presents
      hydrogen storage and refuelling equipment, creating possible
      infrastructure and service revenue, but it does not publish a price list,
      contract terms, recognized revenue, or gross-margin data. Conditional
      orders, partnership agreements, and investor support therefore indicate
      demand validation and financing capacity, not booked revenue. A
      commercialization underwriting should separate launch-customer interest
      from delivered systems and distinguish grants from customer receipts.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: capital-and-costs
    title: Capital needs, costs, and runway
    body: >-
      The financing record points to a long, capital-intensive certification
      cycle. AeroTime reports a December 2025 financing round and quotes the
      company as saying the investment extended cash runway for two years;
      PRNewswire similarly says the new financing supports industrialization
      for aviation and defense. Earlier public descriptions also identify UK,
      EU, and US grants and UK R&D tax credits, while historical financing
      evidence lists multiple equity rounds. These are not interchangeable:
      grants and tax credits may be restricted or milestone-dependent, equity
      proceeds are not current cash after spending, and a runway statement is
      not a disclosed cash balance or burn rate. The adverse Alpha2 review
      reports that the latest accounts contained “material uncertainty” about
      going-concern status, described funding needs beyond Q1 2026, and
      reported staff cuts. The later financing announcement reduces immediate
      liquidity risk as described by the company, but it does not disclose
      monthly burn, remaining cash, debt, capex, working capital, or the
      financing trigger for certification and entry into service.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: underwriting-verdict
    title: Underwriting verdict and evidence gaps
    body: >-
      Public evidence supports strategic interest but not a financeable
      operating model. AeroTime describes a $150 million financing context,
      customer agreements, and an FAA grant, while ZeroAvia's own pages
      describe proprietary systems, more than 30 granted patents, and more
      than 100 pending.       Global Market Insights and Grand View Research publish materially
      different hydrogen-aircraft market forecasts, and neither forecast is
      ZeroAvia revenue or a company forecast. The adverse review identifies
      payload, range, hydrogen-cost, infrastructure, certification, and
      schedule constraints that could delay revenue or increase required
      capital. The near-term financial verdict is therefore “capital-backed
      option with high execution and disclosure risk”: financing runway and
      dual-use products may preserve the path, but an investor cannot yet
      underwrite revenue quality, contribution margin, cash conversion, or
      runway sufficiency from public data. The highest-value diligence is a
      monthly cash bridge, product-level bookings-to-revenue reconciliation,
      unit-cost build, customer contract schedule, and certification-linked
      capex plan.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: []
    figureRefs: []
