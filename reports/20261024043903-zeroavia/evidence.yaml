evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current post-money valuation, financing amount, dilution, liquidation preferences, and ownership percentages.
    whyItMatters: Financing totals and investor names do not show the price paid, investor protections, or available equity value.
    diligencePath: Request the latest financing term sheet, cap table, and board-approved capitalization summary under NDA.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cash
    missingEvidence: Current cash balance, monthly burn, runway end date, revenue, and gross margin by product.
    whyItMatters: >-
      A stated two-year runway extension cannot be translated into solvency or financing need without starting cash and
      burn.
    diligencePath: Obtain current management accounts, cash waterfall, budget versus actuals, and product-level unit economics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete current executive, board, and senior technical roster after the 2026 departures.
    whyItMatters: >-
      The public record identifies an interim operating arrangement but not the complete succession and functional
      coverage.
    diligencePath: Request a current organization chart, board roster, succession plan, and retention package summary.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: commercialization
    missingEvidence: >-
      Customer-by-customer schedule showing binding orders, deposits, delivery dates, certification dependencies, and
      recognized revenue.
    whyItMatters: Orders, discussions, prototypes, and demonstrations are not interchangeable measures of commercial traction.
    diligencePath: Reconcile the order book to executed contracts, invoices, delivery records, and certification milestones.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      Comparable full methodologies that reconcile the 2026 market values, included technologies, revenue boundaries,
      and forecast assumptions.
    whyItMatters: The retained estimates differ by more than twofold in 2026 and cannot support a precise ZeroAvia SAM or SOM.
    diligencePath: >-
      Obtain the complete GMI and Business Research Company methodologies and rebuild a like-for-like regional
      hydrogen-electric propulsion segment.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Current certification status, executed customer contracts, deposits, delivery schedules, route economics, and
      evidence of routine commercial service.
    whyItMatters: >-
      Historical targets and provisional announcements do not establish certified entry into service or contracted
      demand.
    diligencePath: >-
      Request regulator correspondence and a customer-level contract schedule showing binding status, cancellation
      rights, deposits, milestones, and route dependencies.
    relatedQuestionRefs:
      - QM005
      - QM009
      - QM010
  - type: missing-source
    severity: material
    topic: infrastructure
    missingEvidence: >-
      Airport-specific hydrogen supply, permitting, safety, capex, and utilization evidence for the first proposed route
      pairs.
    whyItMatters: Infrastructure cost and readiness can delay adoption even when an aircraft system is technically certifiable.
    diligencePath: >-
      Validate two candidate route pairs with airport engineering studies, hydrogen offtake agreements, permits,
      emergency-response plans, and independent total-cost models.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable price, unit, discount, contract duration, lifecycle cost, and realized margin data for ZeroAvia and
      named alternatives.
    whyItMatters: >-
      Without a common mission and cost denominator, capability breadth cannot be translated into buyer value or
      defensible margin.
    diligencePath: >-
      Request product price books, bid data, customer contracts, lifecycle-cost models, and competitor win-loss analyses
      normalized by aircraft mission.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
