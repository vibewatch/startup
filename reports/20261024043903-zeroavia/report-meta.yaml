companyProfile:
  summary: >-
    ZeroAvia is a British-American hydrogen-electric aviation company pursuing propulsion, modular fuel-cell power, and
    hydrogen-enablement systems for civil and defense applications. Its public record combines strategic investment,
    government support, flight-test progress, and customer discussions with material uncertainty around certification
    timing, financing terms, operating economics, and commercial conversion.
  founders:
    - name: Val Miftakhov
      role: Founder and former chief executive
      background: Founded ZeroAvia and led its hydrogen-electric aviation strategy.
      claimRefs:
        - CO002
        - CO008
  foundingLocation: United States
  headquarters: Everett, Washington, USA; Kemble/Cotswold, UK
  productSummary: >-
    Hydrogen-electric propulsion and power systems, including the ZA600 and ZA2000 programs, SuperStack Flex modular
    fuel-cell power generation, hydrogen storage, and refuelling infrastructure.
  customerFocus: >-
    Regional and special-mission aviation, defense, airlines, aircraft lessors, and adjacent electric-aircraft
    operators.
  businessModel: >-
    Develop and certify propulsion and modular power systems, then sell or deploy them through aircraft, defense,
    infrastructure, and strategic customer relationships.
  stage: Post-Series C / pre-commercial
