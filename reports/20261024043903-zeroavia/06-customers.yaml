company:
  name: ZeroAvia
chapter:
  number: 6
  title: Customers
  summary: >-
    ZeroAvia has credible named engagement across airlines, regional operators, aircraft
    developers, airports, and adjacent power-system buyers, but the public record still
    describes demonstrations, exploration agreements, and conditional commitments rather
    than scaled production adoption. Retention, realized backlog conversion, contract
    economics, and customer concentration remain material diligence gaps.
sections:
  - id: customer-segments-and-buying-centers
    title: Customer segments and buying centers
    body: >-
      ZeroAvia addresses several related but distinct buying centers. Airlines and regional
      operators are the most visible prospective propulsion customers, while aircraft
      developers and OEMs act as integration partners or buyers of power-generation
      systems. Airports, hydrogen suppliers, and infrastructure operators are adoption
      enablers rather than necessarily engine customers, and defense, eVTOL, and other
      fixed-wing programs create an adjacent route to revenue for modular fuel-cell
      systems. This breadth improves optionality but makes a single "customer count"
      misleading: a named airline demonstrator, an OEM collaboration, a conditional engine
      order, and an infrastructure memorandum do not represent the same commercial stage
      or revenue quality.
    claimRefs: [CU001, CU009, CU011, CU012, CU013]
    tableRefs: [TU001]
  - id: named-proof-and-commercial-quality
    title: Named proof is real, but mostly pre-production
    body: >-
      The strongest public proof is specific and asset-linked. Horizon Air handed over a
      76-seat Q400 for conversion, Mehair placed a conditional order for up to 20 ZA600
      engines, KLM described a planned hydrogen-powered demonstration flight, and Jekta
      publicly explained why it selected ZeroAvia for a power-generation collaboration.
      These signals are stronger than logo placement because they identify an aircraft,
      use case, or commitment. They still fall short of routine production service:
      conditional orders can lapse, demonstrations do not establish utilization or paid
      fleet deployment, and exploratory operating agreements do not show recurring
      revenue, renewal, or realized customer outcomes.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU015]
    tableRefs: [TU003]
  - id: adoption-trajectory-and-conversion
    title: Adoption trajectory depends on certification and infrastructure
    body: >-
      Public milestones show movement from prototype flight and partner exploration toward
      larger-aircraft demonstrations and a formal certification basis. The FAA's 2026
      special-conditions process is important evidence that the ZA601 is in a real
      certification pathway, but it also documents safety and reliability requirements
      that must be cleared before broad customer deployment. Commercial conversion also
      depends on hydrogen storage, transport, and refuelling at operating locations.
      ZeroAvia is developing those capabilities itself, which may reduce coordination
      friction, but it also expands the implementation surface beyond the engine and makes
      each deployment dependent on airport and fuel-system readiness.
    claimRefs: [CU002, CU003, CU004, CU011, CU012, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: retention-expansion-and-concentration
    title: Retention, expansion, and concentration are not publicly measurable
    body: >-
      The retained evidence does not disclose net or gross revenue retention, churn,
      renewal rates, contract duration, realized backlog conversion, customer revenue, or
      top-customer concentration. The company's undated facts page claims more than 2,000
      engine pre-orders representing over $10 billion of backlog, but it does not provide
      cancellation rights, deposits, delivery schedules, pricing, or the share tied to
      certified products. Expansion could occur from demonstrator to fleet retrofit, from
      a propulsion program into hydrogen infrastructure, or from aviation engines into
      modular power systems. None of those loops is yet quantified publicly, so diligence
      should treat the named relationships as strategic validation rather than evidence of
      durable recurring customer economics.
    claimRefs: [CU008, CU010, CU011, CU012, CU015]
