figures:
  - id: FU001
    title: Customer adoption path and expansion surfaces
    type: journey-map
    summary: >-
      Public relationships cluster before production service, with certification and
      hydrogen infrastructure separating demonstrations from durable fleet adoption.
    data:
      nodes:
        - id: need
          label: Fleet or mission need
          detail: "Airline, operator, OEM, or defense program identifies an emissions, resilience, or power requirement."
          touchpoints: ["Fleet strategy", "Sustainability plan", "Aircraft program"]
        - id: evaluation
          label: Technical evaluation
          detail: "Counterparty assesses aircraft fit, payload-range trade-offs, power-system maturity, and hydrogen availability."
          touchpoints: ["Engineering study", "Supplier review", "Infrastructure assessment"]
        - id: partnership
          label: Exploration agreement
          detail: "Parties announce a study, memorandum, or development collaboration without proven production economics."
          touchpoints: ["MOU", "Joint study", "Program announcement"]
        - id: commitment
          label: Asset or conditional commitment
          detail: "A test aircraft, conditional order, or named demonstrator creates stronger evidence than a logo alone."
          touchpoints: ["Aircraft handover", "Conditional order", "Demonstrator plan"]
        - id: certification
          label: Demonstration and certification
          detail: "Flight testing and regulatory compliance must establish safety, durability, and installation readiness."
          touchpoints: ["Ground test", "Flight test", "FAA or CAA certification"]
        - id: service
          label: Production service and expansion
          detail: "Commercial proof would require delivered systems, routine operations, renewals, follow-on fleet orders, and measurable outcomes."
          touchpoints: ["Entry into service", "Fleet expansion", "Infrastructure rollout"]
    approximationNotes: "The sequence is analytical, not a measured funnel; no conversion rates or common cohort are publicly disclosed."
    claimRefs: [CU001, CU002, CU011, CU012, CU014, CU015]
callouts:
  - calloutType: strength
    title: Stronger than logo-only validation
    body: >-
      Aircraft handovers, conditional engine quantities, and direct customer quotations
      provide specific evidence of buyer interest and technical engagement.
    claimRefs: [CU002, CU005, CU006, CU007]
  - calloutType: risk
    title: Backlog quality is not auditable publicly
    body: >-
      The company-claimed preorder value lacks disclosed cancellation terms, deposits,
      certification dependencies, delivery timing, realized revenue, and customer
      concentration.
    claimRefs: [CU008, CU010, CU015]
