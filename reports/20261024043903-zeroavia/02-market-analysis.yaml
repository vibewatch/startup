company:
  name: ZeroAvia
chapter:
  number: 2
  title: Market Analysis
  summary: ZeroAvia's most credible initial market is regional and special-mission hydrogen-electric aviation, with defense modules and airport-enablement products providing adjacent entry paths. Published market estimates diverge materially, so adoption timing, certification, infrastructure, and customer conversion are more decision-useful than a single headline TAM.
sections:
  - id: market-boundary
    title: Market boundary and entry wedge
    body: >-
      ZeroAvia's core served market is narrower than either sustainable aviation or the full hydrogen-aircraft category. The practical boundary is hydrogen-electric powertrains and enabling systems for regional and short-haul aircraft, with fuel-cell modules, cargo and special-mission applications, and aviation-specific hydrogen handling as adjacencies. Conventional turbine aircraft, sustainable aviation fuel, battery-electric propulsion, and hydrogen combustion remain substitutes or alternative decarbonization pathways rather than part of the same served market. The evidence points to a small-aircraft entry wedge: AeroTime reports that ZA600 is designed for 10-20-seat commercial aircraft, while H2Fly's chief executive independently argues that aircraft up to 19 passengers can reach market earlier because certification and infrastructure are less complex. Historical coverage framed short-haul and commuter routes as the initial use case, but that issuer repeated company projections and should not be treated as an independent measure of realized demand.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      The retained market estimates are too inconsistent to support a precise ZeroAvia TAM, SAM, or SOM. Global Market Insights places the hydrogen-aircraft market at $1.2 billion in 2026 and $16.9 billion in 2035, a 33.6% forecast CAGR. The Business Research Company instead reports $2.64 billion in 2026 and $5.59 billion in 2030, a 20.6% forecast CAGR, and explicitly defines market value as factory-gate revenues for aircraft components and related services. These are not interchangeable denominators: they use different current-year values, horizons, segment definitions, and methods. Narrower GMI lenses are more useful for directional segmentation, including a $456.3 million short-haul segment in 2025 and a 52% commercial-aviation application share. Even those figures remain publisher estimates rather than evidence of ZeroAvia revenue. The investable sizing case therefore has to start with certificable aircraft classes and funded programs, then apply conversion evidence that is not publicly available.
    claimRefs: [CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      Operators and airframe manufacturers are the direct propulsion buyers, but they do not control the entire adoption budget. Airports, hydrogen producers, infrastructure providers, regulators, and public-sector funders must coordinate supply, storage, dispensing, emergency response, and certification. Defense and special-mission programs offer a separate budget path: AeroTime reported in December 2025 that ZeroAvia was already supplying SuperStack Flex to the defense sector, while AeroTime's archive also shows cargo and US Air Force activity. For civil operators, the relevant triggers are certified payload and range, dependable hydrogen at both ends of a route, and economics that survive infrastructure charges. For airport and energy partners, utilization and route-network commitments matter because much of the required investment lies outside the airport boundary. This split means the user, buyer, and payer can be different organizations, making coordinated route activation more important than isolated engine interest.
    claimRefs: [CM005, CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: constraints-and-gaps
    title: Constraints and diligence implications
    body: >-
      Infrastructure is not a secondary implementation detail. World Economic Forum and McKinsey analysis estimates 600-1,700 TWh of clean energy demand for alternative propulsion by 2050 and $700 billion-$1.7 trillion of cumulative capital investment, with about 90% directed off-airport. ZeroAvia itself says hydrogen-electric aviation depends on safe storage, transport, and refueling across airfields, while an independent market-research summary describes certification, cryogenic storage, safety, production, distribution, and airport readiness as simultaneous dependencies. Timing evidence is also weak: a September 2024 AeroTime article recorded an expectation of ZA600 certification in 2025 and entry into service in 2026, but the assigned evidence does not establish whether those milestones were achieved by the run date. AIN's fetched page adds a useful adverse discipline by warning that provisional sales announcements are poor indicators of program success. Current certification status, executed contracts, route economics, and realized commercial service remain material diligence gaps rather than evidence of absence.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: risk
    title: Headline TAM is not a serviceable market
    body: The two 2026 market estimates differ by more than twofold before accounting for certification, aircraft class, geography, infrastructure availability, or customer conversion.
    claimRefs: [CM006, CM007, CM008]
  - calloutType: insight
    title: Route activation is the commercial unit
    body: A certifiable engine does not create an operating market unless aircraft owners, airports, hydrogen suppliers, regulators, and route endpoints commit on compatible timelines.
    claimRefs: [CM003, CM004, CM012, CM014]
