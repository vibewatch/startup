  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and entry wedge
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia's core served market is narrower than either sustainable aviation or the full hydrogen-aircraft
              category. The practical boundary is hydrogen-electric powertrains and enabling systems for regional and
              short-haul aircraft, with fuel-cell modules, cargo and special-mission applications, and aviation-specific
              hydrogen handling as adjacencies. Conventional turbine aircraft, sustainable aviation fuel,
              battery-electric propulsion, and hydrogen combustion remain substitutes or alternative decarbonization
              pathways rather than part of the same served market. The evidence points to a small-aircraft entry wedge:
              AeroTime reports that ZA600 is designed for 10-20-seat commercial aircraft, while H2Fly's chief executive
              independently argues that aircraft up to 19 passengers can reach market earlier because certification and
              infrastructure are less complex. Historical coverage framed short-haul and commuter routes as the initial
              use case, but that issuer repeated company projections and should not be treated as an independent measure
              of realized demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM009
              - CM011
              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained market estimates are too inconsistent to support a precise ZeroAvia TAM, SAM, or SOM. Global
              Market Insights places the hydrogen-aircraft market at $1.2 billion in 2026 and $16.9 billion in 2035, a
              33.6% forecast CAGR. The Business Research Company instead reports $2.64 billion in 2026 and $5.59 billion
              in 2030, a 20.6% forecast CAGR, and explicitly defines market value as factory-gate revenues for aircraft
              components and related services. These are not interchangeable denominators: they use different
              current-year values, horizons, segment definitions, and methods. Narrower GMI lenses are more useful for
              directional segmentation, including a $456.3 million short-haul segment in 2025 and a 52%
              commercial-aviation application share. Even those figures remain publisher estimates rather than evidence
              of ZeroAvia revenue. The investable sizing case therefore has to start with certificable aircraft classes
              and funded programs, then apply conversion evidence that is not publicly available.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Operators and airframe manufacturers are the direct propulsion buyers, but they do not control the entire
              adoption budget. Airports, hydrogen producers, infrastructure providers, regulators, and public-sector
              funders must coordinate supply, storage, dispensing, emergency response, and certification. Defense and
              special-mission programs offer a separate budget path: AeroTime reported in December 2025 that ZeroAvia
              was already supplying SuperStack Flex to the defense sector, while AeroTime's archive also shows cargo and
              US Air Force activity. For civil operators, the relevant triggers are certified payload and range,
              dependable hydrogen at both ends of a route, and economics that survive infrastructure charges. For
              airport and energy partners, utilization and route-network commitments matter because much of the required
              investment lies outside the airport boundary. This split means the user, buyer, and payer can be different
              organizations, making coordinated route activation more important than isolated engine interest.
            claimRefs:
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Constraints and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Infrastructure is not a secondary implementation detail. World Economic Forum and McKinsey analysis
              estimates 600-1,700 TWh of clean energy demand for alternative propulsion by 2050 and $700 billion-$1.7
              trillion of cumulative capital investment, with about 90% directed off-airport. ZeroAvia itself says
              hydrogen-electric aviation depends on safe storage, transport, and refueling across airfields, while an
              independent market-research summary describes certification, cryogenic storage, safety, production,
              distribution, and airport readiness as simultaneous dependencies. Timing evidence is also weak: a
              September 2024 AeroTime article recorded an expectation of ZA600 certification in 2025 and entry into
              service in 2026, but the assigned evidence does not establish whether those milestones were achieved by
              the run date. AIN's fetched page adds a useful adverse discipline by warning that provisional sales
              announcements are poor indicators of program success. Current certification status, executed contracts,
              route economics, and realized commercial service remain material diligence gaps rather than evidence of
              absence.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline TAM is not a serviceable market
            body: >-
              The two 2026 market estimates differ by more than twofold before accounting for certification, aircraft
              class, geography, infrastructure availability, or customer conversion.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Route activation is the commercial unit
            body: >-
              A certifiable engine does not create an operating market unless aircraft owners, airports, hydrogen
              suppliers, regulators, and route endpoints commit on compatible timelines.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The competitive boundary is wider than hydrogen-electric powertrain startups. H2Fly is the clearest direct
              peer in smaller regional aircraft, while Airbus ZEROe represents an incumbent hydrogen program and
              Rolls-Royce/easyJet efforts represent hydrogen combustion rather than fuel cells. Battery-electric and
              hybrid-electric designs compete for shorter missions, and conventional turboprops remain the operational
              status quo. Defense also has adjacent entrants: Hymotive reports that Heven Aerotech's Z1 Blue was cleared
              for rapid military deployment. Universal Hydrogen's 2024 collapse after it failed to secure further
              funding shows that technology progress does not remove financing risk. Internal aircraft-maker development
              is another plausible buyer option, but the assigned evidence does not identify a comparable named internal
              program.
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
      - number: '3.2'
        title: Capability and positioning
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia presents itself as an integrated systems supplier rather than a single-engine demonstrator. Its
              official technology page covers fuel-cell stacks, electric motors, inverters, gaseous and liquid hydrogen
              storage, and mobile dispensing systems, and reports more than 30 granted patents plus more than 100
              pending. H2Fly also frames the opportunity as an ecosystem spanning aircraft, fuel storage, airport
              infrastructure, operations, and certification, so integration breadth is not unique by itself. The
              meaningful differentiation test is whether ZeroAvia can turn its broader component portfolio into reusable
              certification artifacts, lower integration effort, and repeat deployments. The positioning map therefore
              uses explicit ordinal judgments rather than unsupported market share, performance, or price estimates.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
              - CP015
      - number: '3.3'
        title: Distribution, switching costs, and pricing
        blocks:
          - type: paragraph
            body: >-
              Distribution power currently appears relationship-led. The Marshall Aerospace collaboration brings
              military modification, integration, and certification experience, but both retained reports describe the
              effort as early-stage prototyping and evaluation without named aircraft. AeroTime separately reported that
              ZeroAvia was already supplying SuperStack Flex systems to the defense sector in December 2025. Those
              signals may shorten customer access, yet they do not disclose volumes, prices, contract duration,
              switching terms, or recognized revenue. Public pricing is also absent for H2Fly and the incumbent pathways
              in the assigned evidence. Buyers therefore face potential switching costs around aircraft integration,
              certification evidence, hydrogen handling, training, and maintenance, but the economic size of those costs
              remains private.
            claimRefs:
              - CP010
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence is sector-wide. GAO reported that no manned electric aircraft had
              received FAA type certification as of March 2026 and that commercial timing remained unclear. It also
              found limited airport infrastructure, with 47 airports identifying electric-aircraft charging stations in
              their plans, mostly within BETA Technologies' network. H2Fly's smaller-aircraft strategy reflects the same
              constraint: less complex missions may reach service sooner, while Airbus has moved its ZEROe timeline into
              the 2030s. ZeroAvia can build a moat if its integrated stack, regulatory work, and partners make
              deployment repeatable, but it can still be displaced by a better-capitalized incumbent, a simpler battery
              mission, hydrogen combustion, or the conventional fleet. Current evidence supports differentiation, not
              proven lock-in or dominance.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated system option
            body: >-
              ZeroAvia's public portfolio spans propulsion components and hydrogen handling, offering more integration
              surfaces than a single demonstrator.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Sector bottlenecks dominate
            body: >-
              Type certification and airport infrastructure remain unresolved across the category, so technical breadth
              alone does not prove commercial timing.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
          - type: callout
            title: Underwrite conversion, not announcements
            body: >-
              The next competitive proof is priced, certified, repeat deployment with disclosed contract economics
              rather than another partnership announcement.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia's public materials describe two monetization paths rather than a mature recurring-revenue
              business. The first is the sale or deployment of hydrogen-electric propulsion systems for existing
              aircraft segments, including the planned ZA600 for 10–20-seat aircraft and a larger 40–80-seat powertrain.
              The second is component and systems revenue: the company says it is already supplying SuperStack Flex
              modular fuel-cell power generation to the defense sector and is discussing deployments with eVTOL and
              fixed-wing commercial players. Its technology page also presents hydrogen storage and refuelling
              equipment, creating possible infrastructure and service revenue, but it does not publish a price list,
              contract terms, recognized revenue, or gross-margin data. Conditional orders, partnership agreements, and
              investor support therefore indicate demand validation and financing capacity, not booked revenue. A
              commercialization underwriting should separate launch-customer interest from delivered systems and
              distinguish grants from customer receipts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
      - number: '4.2'
        title: Capital needs, costs, and runway
        blocks:
          - type: paragraph
            body: >-
              The financing record points to a long, capital-intensive certification cycle. AeroTime reports a December
              2025 financing round and quotes the company as saying the investment extended cash runway for two years;
              PRNewswire similarly says the new financing supports industrialization for aviation and defense. Earlier
              public descriptions also identify UK, EU, and US grants and UK R&D tax credits, while historical financing
              evidence lists multiple equity rounds. These are not interchangeable: grants and tax credits may be
              restricted or milestone-dependent, equity proceeds are not current cash after spending, and a runway
              statement is not a disclosed cash balance or burn rate. The adverse Alpha2 review reports that the latest
              accounts contained “material uncertainty” about going-concern status, described funding needs beyond Q1
              2026, and reported staff cuts. The later financing announcement reduces immediate liquidity risk as
              described by the company, but it does not disclose monthly burn, remaining cash, debt, capex, working
              capital, or the financing trigger for certification and entry into service.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Underwriting verdict and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports strategic interest but not a financeable operating model. AeroTime describes a
              $150 million financing context, customer agreements, and an FAA grant, while ZeroAvia's own pages describe
              proprietary systems, more than 30 granted patents, and more than 100 pending.       Global Market Insights
              and Grand View Research publish materially different hydrogen-aircraft market forecasts, and neither
              forecast is ZeroAvia revenue or a company forecast. The adverse review identifies payload, range,
              hydrogen-cost, infrastructure, certification, and schedule constraints that could delay revenue or
              increase required capital. The near-term financial verdict is therefore “capital-backed option with high
              execution and disclosure risk”: financing runway and dual-use products may preserve the path, but an
              investor cannot yet underwrite revenue quality, contribution margin, cash conversion, or runway
              sufficiency from public data. The highest-value diligence is a monthly cash bridge, product-level
              bookings-to-revenue reconciliation, unit-cost build, customer contract schedule, and certification-linked
              capex plan.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing and dual-use optionality
            body: >-
              The latest financing announcement says runway was extended for two years, while SuperStack Flex is
              described as already supplied to defense and applicable to civil systems.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Capital adequacy remains unproven
            body: >-
              The public record does not disclose cash, burn, gross margin, debt, or certification capex, and an adverse
              review reports funding uncertainty and staff reductions.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI015
          - type: callout
            title: Underwrite milestones, not headline funding
            body: >-
              Require contract-level bookings, monthly cash reporting, unit-cost evidence, and certification-linked
              financing triggers before treating the funding and order narrative as revenue visibility.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI005
              - CI012
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and customer workflow
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia’s product is not only an aircraft engine. The operating proposition combines hydrogen storage and
              dispensing, fuel-cell power generation, inverters, electric motors, propulsion monitoring, and aircraft
              integration. The company describes the ZA600 as a 600-kilowatt-class system for smaller regional aircraft,
              while its roadmap extends to multi-megawatt ZA2000 and larger programs. In the customer workflow, an
              operator must source hydrogen, move it through airport-side storage and refuelling equipment, install the
              powertrain in an aircraft, and maintain the system under an aviation certification regime. That integrated
              workflow is a potential differentiator because it addresses infrastructure as well as propulsion, but it
              also expands the number of dependencies that must mature before airline-level deployment.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE012
      - number: '5.2'
        title: Architecture, maturity, and certification
        blocks:
          - type: paragraph
            body: >-
              The technical architecture is specific enough to identify real engineering work: hydrogen and air feed a
              fuel-cell stack, electricity passes through inverters to an electric motor, and an
              engine-health-monitoring layer supports real-time performance monitoring. Company materials describe
              in-house motors, inverters, compressors, fuel-cell development, and storage/refuelling systems, while the
              conference presentation identifies partner-supplied fuel-cell modules in the early ZA600 configuration.
              Demonstrations have progressed from the Piper test aircraft to the Dornier 228 and a 1.8-megawatt
              Hypertruck test platform. The maturity evidence is therefore stronger for component and flight-test
              activity than for certified, repeatable production hardware. GAO’s 2026 review adds an external
              constraint: the FAA was still evaluating electric-aircraft designs case by case and had not issued a type
              certification for a manned electric aircraft as of March 2026.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
              - CE013
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Differentiation, deployment, and technology risk
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation case is control of the critical propulsion stack and the ability to adapt it
              across aircraft sizes, rather than a single disclosed performance metric. The company reports a
              substantial patent portfolio and positions high-temperature PEM fuel cells, modular power electronics,
              electric motors, and hydrogen handling as reusable building blocks. Independent coverage records airline
              and aircraft-maker interest, but those relationships are not equivalent to certified production deployment
              or realized reliability and economics. The main adverse signal is execution timing: in February 2026,
              ZeroAvia confirmed that funding constraints had forced a workforce reduction and that fuel-cell
              certification was targeted for 2027, with the complete ZA600 powertrain potentially two years later. The
              technology thesis can remain attractive while the underwriting case stays exposed to certification rework,
              industrialization cost, hydrogen availability, airport retrofits, and the gap between demonstration
              performance and service reliability.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technology thesis
            body: >-
              ZeroAvia’s defensibility is most plausibly a systems-integration and certification capability spanning
              fuel cells, power electronics, motors, software, and hydrogen operations; public sources do not yet prove
              production-scale reliability or economics.
            calloutType: insight
            claimRefs:
              - CE003
              - CE005
              - CE010
              - CE011
          - type: callout
            title: Evidence boundary
            body: >-
              Public announcements, interviews, and technical presentations establish development activity and external
              interest, but they do not establish certified commercial service, realized unit economics, or fleet-level
              availability.
            calloutType: assumption
            claimRefs:
              - CE009
              - CE011
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia addresses several related but distinct buying centers. Airlines and regional operators are the
              most visible prospective propulsion customers, while aircraft developers and OEMs act as integration
              partners or buyers of power-generation systems. Airports, hydrogen suppliers, and infrastructure operators
              are adoption enablers rather than necessarily engine customers, and defense, eVTOL, and other fixed-wing
              programs create an adjacent route to revenue for modular fuel-cell systems. This breadth improves
              optionality but makes a single "customer count" misleading: a named airline demonstrator, an OEM
              collaboration, a conditional engine order, and an infrastructure memorandum do not represent the same
              commercial stage or revenue quality.
            claimRefs:
              - CU001
              - CU009
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Named proof is real, but mostly pre-production
        blocks:
          - type: paragraph
            body: >-
              The strongest public proof is specific and asset-linked. Horizon Air handed over a 76-seat Q400 for
              conversion, Mehair placed a conditional order for up to 20 ZA600 engines, KLM described a planned
              hydrogen-powered demonstration flight, and Jekta publicly explained why it selected ZeroAvia for a
              power-generation collaboration. These signals are stronger than logo placement because they identify an
              aircraft, use case, or commitment. They still fall short of routine production service: conditional orders
              can lapse, demonstrations do not establish utilization or paid fleet deployment, and exploratory operating
              agreements do not show recurring revenue, renewal, or realized customer outcomes.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU015
      - number: '6.3'
        title: Adoption trajectory depends on certification and infrastructure
        blocks:
          - type: paragraph
            body: >-
              Public milestones show movement from prototype flight and partner exploration toward larger-aircraft
              demonstrations and a formal certification basis. The FAA's 2026 special-conditions process is important
              evidence that the ZA601 is in a real certification pathway, but it also documents safety and reliability
              requirements that must be cleared before broad customer deployment. Commercial conversion also depends on
              hydrogen storage, transport, and refuelling at operating locations. ZeroAvia is developing those
              capabilities itself, which may reduce coordination friction, but it also expands the implementation
              surface beyond the engine and makes each deployment dependent on airport and fuel-system readiness.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
              - CU012
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU012
              - CU014
              - CU015
      - number: '6.4'
        title: Retention, expansion, and concentration are not publicly measurable
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not disclose net or gross revenue retention, churn, renewal rates, contract
              duration, realized backlog conversion, customer revenue, or top-customer concentration. The company's
              undated facts page claims more than 2,000 engine pre-orders representing over $10 billion of backlog, but
              it does not provide cancellation rights, deposits, delivery schedules, pricing, or the share tied to
              certified products. Expansion could occur from demonstrator to fleet retrofit, from a propulsion program
              into hydrogen infrastructure, or from aviation engines into modular power systems. None of those loops is
              yet quantified publicly, so diligence should treat the named relationships as strategic validation rather
              than evidence of durable recurring customer economics.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stronger than logo-only validation
            body: >-
              Aircraft handovers, conditional engine quantities, and direct customer quotations provide specific
              evidence of buyer interest and technical engagement.
            calloutType: strength
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Backlog quality is not auditable publicly
            body: >-
              The company-claimed preorder value lacks disclosed cancellation terms, deposits, certification
              dependencies, delivery timing, realized revenue, and customer concentration.
            calloutType: risk
            claimRefs:
              - CU008
              - CU010
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk register
        blocks:
          - type: paragraph
            body: >-
              The most material risk is schedule conversion: an independent trade report says ZeroAvia reduced its
              workforce by roughly half after the December 2025 financing and shifted priority from complete ZA600
              powertrain certification to fuel-cell-system certification by 2027, with full powertrain certification
              expected 12–24 months later. This is not evidence that certification will fail, but it increases the
              probability that milestones, commercial entry and cash needs move together. The same report says no test
              flights are planned for the next 12–18 months, which removes a near-term operating proof point. The risk
              is partly mitigated by FAA and CAA engagement and by the company's stated focus on a modular fuel-cell
              product, but the mitigation is not yet demonstrated by recurring commercial revenue or routine
              zero-emission service.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory, technical and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Certification is a gated, jurisdiction-specific dependency rather than a single company milestone.
              AeroTime reports that the electric propulsion system was being pursued through the FAA while the broader
              powertrain path involved the UK CAA, and it identifies certification as a central uncertainty. ZeroAvia's
              own technical materials describe high-temperature PEM stacks, liquid and gaseous hydrogen storage, mobile
              dispensing and boil-off management; those systems expand the safety, reliability and infrastructure
              surface that must work in an aviation operating environment. The 2026 FAA special conditions article in
              the pool is not usable evidence because its fetched page contains only a membership prompt, so this
              chapter does not treat it as proof of approval. The exact means of compliance, remaining certification
              findings, test-flight schedule and safety case should therefore be verified directly with the regulators
              and the company.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR008
              - CR012
      - number: '7.3'
        title: Dependencies, financial pressure and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia depends on financing, suppliers, aircraft and airline partners, and airport hydrogen
              infrastructure. AeroTime describes partnerships and conditional orders across airlines, operators and
              aircraft developers, but those relationships are not equivalent to production deployments, paid revenue or
              independent retention evidence. The December 2025 funding coverage says the round extended runway for two
              years of development, while the later workforce reduction indicates that the capital plan did not sustain
              the prior roadmap. Public company filings confirm that UK accounts were last made up to 31 December 2025,
              but the pool does not provide cash, burn, margin or concentration disclosures. A thesis break would be a
              further certification delay without a funded plan, inability to demonstrate safe and repeatable test
              operations, or partner commitments failing to convert into paid deployments.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary residual exposure
            body: >-
              The workforce reduction and 12–24 month powertrain delay make financing runway and certification
              sequencing the coupled risks to monitor most closely.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR009
          - type: callout
            title: Diligence priority
            body: >-
              Require regulator-confirmed milestone status, a cash-and-burn bridge through the revised plan, and
              contract-level evidence separating paid deployments from conditional orders.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia has assembled a credible technical and strategic platform: its own materials describe
              aerospace-grade hydrogen-electric power and propulsion systems, while the FAA has published final special
              conditions for the ZA601 electric engine. Independent reporting also describes customer discussions,
              conditional orders, and a broad investor and airline-partner set. These are meaningful de-risking signals,
              but they are not equivalent to certified commercial revenue. The anti-thesis is therefore price and
              execution sensitive. The public record does not establish a post-money valuation, current cash, monthly
              burn, product gross margin, backlog conversion, or preference terms. A recommendation stronger than
              research-more would require documentary proof that the next certification and customer milestones convert
              into cash-generating deliveries before the current financing runway is consumed. Public-company references
              from Archer, Vertical Aerospace, and Joby provide disclosure channels and sector context, but the retained
              pages do not supply a like-for-like valuation mark for a private propulsion-system supplier.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be milestone based rather than a false-precision revenue multiple. The bull case
              depends on the ZA601 certification path, successful industrialization, and conversion of announced
              partnerships or pre-orders into binding, paid deployments. The base case assumes continued technical
              progress but a longer certification and infrastructure ramp, requiring another financing round before
              material revenue. The bear case combines delay, dilution, and weak customer conversion; the 2024 failure
              of Universal Hydrogen is a relevant sector warning, not a forecast for ZeroAvia. Because the latest
              financing is reported as $150 million with two years of runway but the current valuation and cash balance
              are undisclosed, entry discipline should be tied to verified runway, cap-table seniority, and a price that
              compensates for certification and commercialization risk. No numeric target return, holding-period return,
              or exit multiple is supportable from the retained public evidence.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Diligence asks and decision
        blocks:
          - type: paragraph
            body: >-
              The decision is track or research-more, not buy, because the evidence supports capability and strategic
              interest more strongly than it supports investable economics. The next diligence package should include
              the executed Series D term sheet, post-money capitalization, liquidation preferences, option pool, debt
              and grant restrictions, monthly cash bridge, burn, gross margin by product, and customer-level backlog
              conversion. Technical diligence should reconcile the FAA special-conditions record with the current
              certification schedule and identify the remaining means-of-compliance, manufacturing, service, and safety
              obligations. Commercial diligence should distinguish announced partnerships, conditional orders,
              pre-orders, and paid recurring or delivered revenue. A price reset, transparent financing terms, or
              independently verified paid deployments could improve the call; a delayed certification, runway below the
              next milestone, or another rescue financing would break the thesis.
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The public record supports a credible platform and strategic interest, but the price-sensitive inputs that
              determine investor returns remain undisclosed.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV011
          - type: callout
            title: Certification is necessary but not sufficient
            body: >-
              FAA special conditions define part of the certification basis; they do not establish a completed type
              certificate, commercial delivery, revenue, or profitability.
            calloutType: risk
            claimRefs:
              - CV004
              - CV010
