  - id: FE001
    title: ZeroAvia product architecture map
    type: stack
    summary: >-
      Hydrogen and air feed a monitored fuel-cell powertrain, while storage and refuelling enable the aircraft operating
      environment.
    data:
      layers:
        - name: Airport energy interface
          label: Airport energy interface
          detail: Hydrogen supply and airfield handling
          items:
            - name: Hydrogen supply
              detail: Hydrogen input; source, purity, and lifecycle profile remain diligence items.
            - name: LH2/GH2 storage and dispensing
              detail: Mobile storage, compressor/cascade fill, boil-off management, and refuelling operations.
        - name: Power generation
          label: Power generation
          detail: Air and hydrogen converted into electricity
          items:
            - name: Air compressor
              detail: Shaft-driven compressor supplies air to the fuel-cell system.
            - name: Fuel-cell stacks
              detail: LTPEM/HTPEM stack modules convert hydrogen and oxygen into electricity.
        - name: Power conversion
          label: Power conversion
          detail: Electrical power controlled and monitored
          items:
            - name: Silicon-carbide inverters
              detail: Power-control layer described as aerospace-grade and developed in-house.
            - name: Engine health monitoring
              detail: Real-time performance-monitoring software described in the technical presentation.
        - name: Propulsion
          label: Propulsion
          detail: Electric shaft power integrated into aircraft
          items:
            - name: Electric motor
              detail: Aerospace-grade motor drives the propulsor; the ZA600 presentation states 660 kW peak power.
            - name: Propulsor and aircraft integration
              detail: >-
                Electric shaft power is integrated into a test or customer aircraft under the applicable certification
                process.
        - name: Aircraft integration
          label: Aircraft integration
          detail: Powertrain installed and tested in an airframe
          items:
            - name: Test aircraft
              detail: Piper Malibu and Dornier 228 flight-test platforms are described in the technical presentation.
            - name: Larger demonstrator
              detail: Hypertruck testing is described as a 1.8 MW electric-propulsion scalability demonstration.
        - name: Certification and production
          label: Certification and production
          detail: Regulatory approval and repeatable industrialization
          items:
            - name: Certification basis
              detail: FAA and CAA engagement establishes the compliance path; complete type certification remains open.
            - name: Industrialization
              detail: Facilities, workforce, quality systems, and supply chain must mature for production deployment.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
  - id: FU001
    title: Customer adoption path and expansion surfaces
    type: journey-map
    summary: >-
      Public relationships cluster before production service, with certification and hydrogen infrastructure separating
      demonstrations from durable fleet adoption.
    data:
      nodes:
        - id: need
          label: Fleet or mission need
          detail: Airline, operator, OEM, or defense program identifies an emissions, resilience, or power requirement.
          touchpoints:
            - Fleet strategy
            - Sustainability plan
            - Aircraft program
        - id: evaluation
          label: Technical evaluation
          detail: >-
            Counterparty assesses aircraft fit, payload-range trade-offs, power-system maturity, and hydrogen
            availability.
          touchpoints:
            - Engineering study
            - Supplier review
            - Infrastructure assessment
        - id: partnership
          label: Exploration agreement
          detail: Parties announce a study, memorandum, or development collaboration without proven production economics.
          touchpoints:
            - MOU
            - Joint study
            - Program announcement
        - id: commitment
          label: Asset or conditional commitment
          detail: A test aircraft, conditional order, or named demonstrator creates stronger evidence than a logo alone.
          touchpoints:
            - Aircraft handover
            - Conditional order
            - Demonstrator plan
        - id: certification
          label: Demonstration and certification
          detail: Flight testing and regulatory compliance must establish safety, durability, and installation readiness.
          touchpoints:
            - Ground test
            - Flight test
            - FAA or CAA certification
        - id: service
          label: Production service and expansion
          detail: >-
            Commercial proof would require delivered systems, routine operations, renewals, follow-on fleet orders, and
            measurable outcomes.
          touchpoints:
            - Entry into service
            - Fleet expansion
            - Infrastructure rollout
    approximationNotes: The sequence is analytical, not a measured funnel; no conversion rates or common cohort are publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU012
      - CU014
      - CU015
