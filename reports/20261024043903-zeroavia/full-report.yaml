        title: Milestones, certification, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia has accumulated flight-test, patent, financing, and partnership milestones, but the evidence does
              not support treating announced orders or demonstrations as recognized revenue or routine commercial
