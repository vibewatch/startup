  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              ZeroAvia describes itself as developing hydrogen-electric propulsion and power systems for civil and
              defense applications. Its product direction combines fuel-cell power generation, electric propulsion
              components, hydrogen storage and refueling, and planned integrated powertrains rather than a single
              aircraft platform. Independent coverage identifies the company as established in 2018 and describes a
              British-American footprint; the official site lists UK and US locations, while the Companies House record
              confirms an active UK corporate entity with accounts filed through 31 December 2025. This is an
              engineering-led, certification-dependent business whose commercial model is still forming around prototype
              systems, component supply, aircraft integration, and eventual engine programs.
