        title: Leadership, funding, and governance
        blocks:
          - type: paragraph
            body: >-
              The financing record is meaningful but not fully transparent. Public reporting places cumulative financing
              above $250 million by September 2024, while a 2025 financing announcement says the latest round extended
              runway for two years without disclosing the amount. The disclosed investor set includes strategic
              aerospace, climate, infrastructure, and specialist funds. At the same time, 2026 reporting says founder
