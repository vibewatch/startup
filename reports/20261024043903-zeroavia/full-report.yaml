          detail: Global WEF/McKinsey scenario across battery-electric and hydrogen pathways
        - label: Global clean-energy requirement
          value: 600-1,700 TWh in 2050
          detail: Scenario demand for alternative propulsion, not market revenue
        - label: Publisher-defined hydrogen-aircraft market
          value: $1.2bn in 2026
