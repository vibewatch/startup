  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Technical and strategic evidence supports continued diligence, while missing price and conversion evidence
      prevents a buy recommendation.
    data:
      nodes:
        - id: evidence
          label: Technical and strategic evidence
          detail: FAA special conditions, platform portfolio, funding and partnerships
        - id: milestone
          label: Milestone conversion
          detail: Certification, industrialization, paid deployments
        - id: comparables
          label: Comparator normalization
          detail: Public peers differ in product, maturity and operating model
        - id: economics
          label: Economic disclosure
          detail: Valuation, cash, burn, margin and preference terms
        - id: risk
          label: Residual risk
          detail: Certification delay, dilution, infrastructure and customer conversion
        - id: decision
          label: Decision
          detail: Research-more
        - id: trigger
          label: Upgrade trigger
          detail: Verified terms plus paid commercial milestones
