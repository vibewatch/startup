company:
  name: ZeroAvia
chapter:
  number: 1
  title: Company Overview
  summary: ZeroAvia is a British-American developer of hydrogen-electric propulsion and power systems for civil and defense aviation. Public evidence shows substantial strategic backing and technical progress, but the 2026 record also shows leadership turnover, a narrower operating footprint, and continuing certification and commercialization dependencies.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: >-
      ZeroAvia describes itself as developing hydrogen-electric propulsion and power systems for civil and defense applications. Its product direction combines fuel-cell power generation, electric propulsion components, hydrogen storage and refueling, and planned integrated powertrains rather than a single aircraft platform. Independent coverage identifies the company as established in 2018 and describes a British-American footprint; the official site lists UK and US locations, while the Companies House record confirms an active UK corporate entity with accounts filed through 31 December 2025. This is an engineering-led, certification-dependent business whose commercial model is still forming around prototype systems, component supply, aircraft integration, and eventual engine programs.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, funding, and governance
    body: >-
      The financing record is meaningful but not fully transparent. Public reporting places cumulative financing above $250 million by September 2024, while a 2025 financing announcement says the latest round extended runway for two years without disclosing the amount. The disclosed investor set includes strategic aerospace, climate, infrastructure, and specialist funds. At the same time, 2026 reporting says founder and CEO Val Miftakhov stepped down, at least three other C-suite leaders departed, and board chair Christine Ourmieres was managing day-to-day operations while a successor search continued. The combination is a material key-person and execution transition, even though the company says its mission remains unchanged.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-gaps
    title: Milestones, certification, and unresolved diligence
    body: >-
      ZeroAvia has accumulated flight-test, patent, financing, and partnership milestones, but the evidence does not support treating announced orders or demonstrations as recognized revenue or routine commercial service. AeroTime reported a 19-seat hydrogen-electric testbed flight and a planned certification path involving the FAA and UK CAA; the company later described a prototype as extensively flight tested and its first engine as submitted for certification. The GAO's March 2026 review provides important context: the FAA had not issued a type certification for a manned electric aircraft and commercial timing remained unclear. Accordingly, the central diligence question is milestone conversion: whether certification, manufacturing readiness, customer commitments, and cash runway can align before further financing is required.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
