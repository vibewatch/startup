callouts:
  - calloutType: strength
    title: Strategic and technical stack
    body: ZeroAvia has combined flight testing, proprietary fuel-cell and propulsion development, strategic investors, and aviation partnerships into a credible technical platform.
    claimRefs: [CO004, CO005, CO011, CO013]
  - calloutType: risk
    title: Milestone conversion and leadership risk
    body: The investment case remains exposed to certification timing, cash transparency, customer conversion, and the 2026 founder and executive transition.
    claimRefs: [CO007, CO008, CO009, CO012, CO014]
  - calloutType: recommendation
    title: Ground-truth the operating reset
    body: Before relying on public order, funding, or location claims, request current cap-table terms, cash and burn, executive roster, certification schedule, and delivered-customer evidence.
    claimRefs: [CO006, CO007, CO010, CO012, CO016]
