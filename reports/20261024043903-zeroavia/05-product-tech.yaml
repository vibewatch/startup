    title: Technology thesis
    body: ZeroAvia’s defensibility is most plausibly a systems-integration and certification capability spanning fuel cells, power electronics, motors, software, and hydrogen operations; public sources do not yet prove production-scale reliability or economics.
    claimRefs: [CE003, CE005, CE010, CE011]
  - calloutType: assumption
    title: Evidence boundary
    body: Public announcements, interviews, and technical presentations establish development activity and external interest, but they do not establish certified commercial service, realized unit economics, or fleet-level availability.
    claimRefs: [CE009, CE011, CE014, CE015]
