chapter:
  number: 5
  title: Product & Technology
  summary: ZeroAvia is building a vertically integrated hydrogen-electric propulsion and refuelling stack, with the ZA600 and larger ZA2000 programs linked to fuel-cell, motor, power-electronics, storage, and airport-infrastructure work. Public evidence shows meaningful flight-test and certification progress, but the current plan has shifted toward certifying the fuel-cell “heart” before the complete ZA600 powertrain, leaving certification timing, industrialization, infrastructure, and supplier execution as the central technology risks.
sections:
  - id: product-system
    title: Product system and customer workflow
    body: >-
      ZeroAvia’s product is not only an aircraft engine. The operating proposition combines hydrogen
      storage and dispensing, fuel-cell power generation, inverters, electric motors, propulsion
      monitoring, and aircraft integration. The company describes the ZA600 as a 600-kilowatt-class
      system for smaller regional aircraft, while its roadmap extends to multi-megawatt ZA2000 and
      larger programs. In the customer workflow, an operator must source hydrogen, move it through
      airport-side storage and refuelling equipment, install the powertrain in an aircraft, and
      maintain the system under an aviation certification regime. That integrated workflow is a
      potential differentiator because it addresses infrastructure as well as propulsion, but it
      also expands the number of dependencies that must mature before airline-level deployment.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture, maturity, and certification
    body: >-
      The technical architecture is specific enough to identify real engineering work: hydrogen
      and air feed a fuel-cell stack, electricity passes through inverters to an electric motor,
      and an engine-health-monitoring layer supports real-time performance monitoring. Company
      materials describe in-house motors, inverters, compressors, fuel-cell development, and
      storage/refuelling systems, while the conference presentation identifies partner-supplied
      fuel-cell modules in the early ZA600 configuration. Demonstrations have progressed from the
      Piper test aircraft to the Dornier 228 and a 1.8-megawatt Hypertruck test platform. The
      maturity evidence is therefore stronger for component and flight-test activity than for
      certified, repeatable production hardware. GAO’s 2026 review adds an external constraint:
      the FAA was still evaluating electric-aircraft designs case by case and had not issued a type
      certification for a manned electric aircraft as of March 2026.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-risk
    title: Differentiation, deployment, and technology risk
    body: >-
      The strongest differentiation case is control of the critical propulsion stack and the
      ability to adapt it across aircraft sizes, rather than a single disclosed performance
      metric. The company reports a substantial patent portfolio and positions high-temperature
      PEM fuel cells, modular power electronics, electric motors, and hydrogen handling as reusable
      building blocks. Independent coverage records airline and aircraft-maker interest, but those
      relationships are not equivalent to certified production deployment or realized reliability
      and economics. The main adverse signal is execution timing: in February 2026, ZeroAvia
      confirmed that funding constraints had forced a workforce reduction and that fuel-cell
      certification was targeted for 2027, with the complete ZA600 powertrain potentially two years
      later. The technology thesis can remain attractive while the underwriting case stays exposed
      to certification rework, industrialization cost, hydrogen availability, airport retrofits,
      and the gap between demonstration performance and service reliability.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015]
