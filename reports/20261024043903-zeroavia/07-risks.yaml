      - [Hydrogen aviation safety and infrastructure, "Company describes HTPEM stacks, liquid/gaseous storage, mobile dispensing and boil-off management.", medium, critical, "Partial: technology portfolio described; operating safety case unavailable.", high, "Review hazard analyses, permits, test incidents and airport operating procedures."]
      - [Regulatory status ambiguity, "AeroTime describes separate FAA and CAA certification paths; the assigned FAA article is inaccessible in fetched text.", medium, high, "Low: direct approval status cannot be confirmed from retained text.", high, "Obtain regulator correspondence and current means-of-compliance status."]
      - [IP / freedom-to-operate uncertainty, "PlainPatent provides a grant-portfolio view but explicitly says its metrics do not measure legal strength.", medium, high, "Partial: portfolio visibility exists; FTO opinion is absent.", medium, "Commission a current FTO and ownership review by product."]
    notes: "Rows synthesize assigned fetched sources; likelihood and residual exposure are analytical judgments bounded by the cited status, not measured incident frequencies."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented legal, regulatory and IP exposures available in the assigned October 2026 source pool."
    claimRefs: [CR001, CR005, CR006, CR007, CR008]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Evidence, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Reduced engineering capacity, "CompositesWorld reports roughly half of the approximately 300-person workforce was laid off.", high, critical, "Low to partial: roadmap narrowed, but capability impact is not quantified.", high, "Obtain current headcount by certification workstream and retention plan."]
      - [Test-flight gap, "The same report says no test flights are planned for the next 12–18 months.", high, high, "Partial: fuel-cell focus may preserve a product path.", high, "Verify flight-test calendar, aircraft availability and safety gates."]
      - [Manufacturing and reliability scale-up, "Company describes aerospace-focused fault tolerance, durability and modular systems; no production yield or field-reliability series is retained.", medium, high, "Low: design intent is not operating evidence.", high, "Review qualification data, supplier quality metrics and production controls."]
      - [Security / privacy / cyber incident visibility, "No incident or certification evidence is retained in the assigned pool.", unknown, high, "Unknown.", high, "Request incident register, threat model, controls and customer security attestations."]
    notes: "Null or unknown operating evidence is preserved as an explicit gap; no absence-of-reporting inference is made."
    claimRefs: [CR001, CR003, CR006, CR008, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring trigger]
    rows:
      - [Funding and runway, "Climate and strategic investors; December 2025 financing", "Capital is insufficient for the revised certification and manufacturing plan.", critical, "Funding extended stated runway by two years; workforce reduction shows pressure remains.", high, "Quarterly cash balance, burn, financing close and headcount."]
      - [Airline and aircraft partners, "American Airlines, KLM, Jekta, Mehair and others cited by AeroTime", "Conditional orders or demonstration agreements do not convert to paid production.", high, "Multiple counterparties and customer discussions.", high, "Signed purchase commitments, deposits, milestones and cancellations."]
      - [Hydrogen ecosystem, "Airports, suppliers and infrastructure partners", "Hydrogen storage, dispensing or supply is unavailable or uneconomic at launch sites.", critical, "Company is developing storage and dispensing technologies.", high, "Site permits, supply contracts, delivered cost and uptime."]
      - [Regulatory counterparties, "FAA and UK CAA", "Means-of-compliance or certification findings extend the schedule.", critical, "Separate regulator engagement paths and prior test-aircraft collaboration.", high, "Open findings, formal issue papers and milestone acceptance."]
    notes: "Partner names and relationships are reported relationships or company descriptions; they do not establish paid deployment, exclusivity or concentration percentages."
    claimRefs: [CR003, CR009, CR010, CR011, CR013, CR014]
