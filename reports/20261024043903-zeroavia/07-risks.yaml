company:
  name: ZeroAvia
chapter:
  number: 7
  title: Risks
  summary: ZeroAvia's principal risks are certification and schedule slippage, financing and execution pressure, and dependency on partners and hydrogen infrastructure. The evidence shows meaningful technical and regulatory progress, but the 2026 workforce reduction and roadmap reset materially increase residual execution risk.
sections:
  - id: ranked-risk-register
    title: Ranked risk register
    body: >-
      The most material risk is schedule conversion: an independent trade report says ZeroAvia reduced
      its workforce by roughly half after the December 2025 financing and shifted priority from complete
      ZA600 powertrain certification to fuel-cell-system certification by 2027, with full powertrain
      certification expected 12–24 months later. This is not evidence that certification will fail, but it
      increases the probability that milestones, commercial entry and cash needs move together. The same
      report says no test flights are planned for the next 12–18 months, which removes a near-term
      operating proof point. The risk is partly mitigated by FAA and CAA engagement and by the company's
      stated focus on a modular fuel-cell product, but the mitigation is not yet demonstrated by recurring
      commercial revenue or routine zero-emission service.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-and-technical
    title: Regulatory, technical and safety exposure
    body: >-
      Certification is a gated, jurisdiction-specific dependency rather than a single company milestone.
      AeroTime reports that the electric propulsion system was being pursued through the FAA while the
      broader powertrain path involved the UK CAA, and it identifies certification as a central uncertainty.
      ZeroAvia's own technical materials describe high-temperature PEM stacks, liquid and gaseous hydrogen
      storage, mobile dispensing and boil-off management; those systems expand the safety, reliability and
      infrastructure surface that must work in an aviation operating environment. The 2026 FAA special
      conditions article in the pool is not usable evidence because its fetched page contains only a
      membership prompt, so this chapter does not treat it as proof of approval. The exact means of
      compliance, remaining certification findings, test-flight schedule and safety case should therefore
      be verified directly with the regulators and the company.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Dependencies, financial pressure and thesis breaks
    body: >-
      ZeroAvia depends on financing, suppliers, aircraft and airline partners, and airport hydrogen
      infrastructure. AeroTime describes partnerships and conditional orders across airlines, operators
      and aircraft developers, but those relationships are not equivalent to production deployments,
      paid revenue or independent retention evidence. The December 2025 funding coverage says the round
      extended runway for two years of development, while the later workforce reduction indicates that
      the capital plan did not sustain the prior roadmap. Public company filings confirm that UK accounts
      were last made up to 31 December 2025, but the pool does not provide cash, burn, margin or
      concentration disclosures. A thesis break
      would be a further certification delay without a funded plan, inability to demonstrate safe and
      repeatable test operations, or partner commitments failing to convert into paid deployments.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Primary residual exposure
    body: The workforce reduction and 12–24 month powertrain delay make financing runway and certification sequencing the coupled risks to monitor most closely.
    claimRefs: [CR001, CR002, CR009]
  - calloutType: recommendation
    title: Diligence priority
    body: Require regulator-confirmed milestone status, a cash-and-burn bridge through the revised plan, and contract-level evidence separating paid deployments from conditional orders.
    claimRefs: [CR003, CR010, CR011]
