companyProfile:
  summary: Legora is a Stockholm-founded legal AI company that in 2026 positioned itself as an agentic operating system for legal work. The platform supports research, review, drafting, and diligence workflows for law firms and in-house legal teams, with product expansion reinforced by content partnerships, workflow integrations, and acquisitions such as Qura and Cadastral. Public evidence shows unusual growth speed for a private software company, but still limited disclosure on pricing, retention, margins, and governance.
  foundedDate: '2020-01-01'
  founders:
    - name: Max Junestrand
      role: CEO & cofounder
      background: Previously worked at YC startups, McKinsey, venture capital, Ericsson, and Abios; Y Combinator profiles him as combining machine-learning and business training.
      claimRefs: [CO006, CO008]
    - name: Sigge Labor
      role: Cofounder
      background: Public official materials identify him as a cofounder, though detailed public background disclosure is limited in the reviewed source pack.
      claimRefs: [CO007]
  foundingLocation: Stockholm, Sweden
  headquarters: Stockholm, Sweden
  productSummary: Enterprise legal AI platform spanning legal research, document review, drafting, diligence, content-integrated workflows, and Microsoft 365-adjacent productivity surfaces.
  customerFocus: Large law firms, upper-mid-market firms, and corporate legal departments.
  businessModel: Enterprise SaaS sold to legal teams with workflow expansion across research, review, drafting, and diligence use cases.
