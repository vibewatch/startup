figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: Legora's public journey typically starts with pilot or champion-led evaluation and expands into broader workflow adoption for sophisticated legal buyers.
    data:
      items:
        - label: Discovery / evaluation
          note: Innovation leaders, managing partners, or legal managers test Legora against existing legal workflows or competing tools.
        - label: Pilot on live matters
          note: Customers such as Trowers, Bird & Bird, Browne Jacobson, and Mishcon validate use cases on live documents and practice teams.
        - label: Governance and procurement review
          note: Security, confidentiality, data handling, and stakeholder alignment become decisive for regulated or enterprise deployments.
        - label: Production rollout
          note: Successful pilots graduate into enterprise-wide or global-law-firm deployments such as White & Case, Baker McKenzie, and Erste Group.
        - label: Workflow expansion
          note: Usage broadens from research and review into Word drafting, playbooks, workflows, portal collaboration, and diligence.
        - label: Expansion or friction
          note: Satisfied buyers add users, modules, or partner workflows; dissatisfied or cautious buyers may stall on pricing, data-custody, or change-management concerns.
    claimRefs: [CU002, CU012, CU013, CU015, CU021, CU027, CU030, CU035, CU036]
    approximationNotes: This journey is structural rather than quantitative because Legora does not publish conversion rates between the stages.
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: Public evidence shows a recurring adoption funnel from evaluation to rollout, especially among large legal organizations.
    data:
      nodes:
        - id: N1
          label: Market awareness / referral
        - id: N2
          label: Pilot or bake-off
        - id: N3
          label: Governance / security review
        - id: N4
          label: Firmwide or enterprise rollout
        - id: N5
          label: Workflow and partner expansion
        - id: N6
          label: Renewal / concentration unknown
      edges:
        - from: N1
          to: N2
          label: Reference logos, partner channels, or customer-led evaluation
        - from: N2
          to: N3
          label: Live-matter proof and champion feedback
        - from: N3
          to: N4
          label: Buyer clears confidentiality, security, and implementation hurdles
        - from: N4
          to: N5
          label: Customers add more practice groups, modules, or partner workflows
        - from: N5
          to: N6
          label: Public sources stop before renewal and concentration data appear
    claimRefs: [CU010, CU011, CU012, CU013, CU021, CU035, CU036, CU040]
    approximationNotes: The last stage is intentionally non-quantified because public sources do not disclose retention or expansion rates.
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Reference quality is strongest for global law firms and regulated enterprises, while durability visibility remains thin almost everywhere.
    data:
      columns:
        - Evidence quality
        - Outcome specificity
        - Source independence
        - Durability visibility
      rows:
        - label: White & Case
          values: [High, "High (global rollout to all lawyers in 43 offices / 29 countries)", "High (customer and vendor sources)", Low]
        - label: Baker McKenzie
          values: [High, "Medium-high (global network rollout and workflow-design partnership)", "High (customer, vendor, and legal press)", Low]
        - label: Erste Group
          values: ["Medium-high", "High (250 lawyers, 30+ departments, seven jurisdictions)", "Medium (vendor case study only)", Low]
        - label: BAHR
          values: [Medium, "High (80% active users; 30% 10x/day)", "Low (vendor case study)", Medium]
        - label: Trowers & Hamlins
          values: [Medium, "High (97/88/87 pilot metrics)", "Low (vendor case study)", "Medium-low"]
        - label: Independent review layer
          values: [Medium, "Medium (pricing, data-custody, and fit critiques)", "High (independent reviews)", "Low on portfolio retention"]
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU027, CU030, CU038, CU039]
    approximationNotes: The matrix scores evidence quality qualitatively because public sources rarely disclose common enterprise-software KPI denominators.
callouts:
  - calloutType: strength
    title: Reference quality is strong for a private legal-tech vendor
    body: Legora has real public proof with elite global law firms and at least one large regulated bank, not just anonymous logos or marketing quotes.
    claimRefs: [CU009, CU010, CU011, CU038]
  - calloutType: insight
    title: Adoption appears to be pulling geographic expansion
    body: The APAC and Europe office announcements read more like customer-following moves than speculative territory planting, which is a good GTM signal.
    claimRefs: [CU018, CU019]
  - calloutType: risk
    title: Durability remains under-disclosed
    body: Public sources never bridge adoption headlines to NRR, GRR, logo churn, renewal, or top-customer concentration, so customer quality still needs private diligence.
    claimRefs: [CU024, CU033, CU040]
  - calloutType: recommendation
    title: Ask for a customer-cohort bridge before underwriting expansion
    body: Management should provide cohort retention, segment mix, top-account concentration, and module attach data so investors can test whether flagship references translate into diversified recurring revenue.
    claimRefs: [CU024, CU033, CU034, CU035, CU040]
