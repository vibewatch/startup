schemaVersion: report-v2
artifact: customers
slug: legora
runDate: '2026-06-13'
company:
  name: Legora
chapter:
  number: 6
  title: Customers
  summary: >-
    Legora has unusually strong public customer proof for a private legal-AI company:
    named deployments span White & Case, Baker McKenzie, Erste Group, BAHR,
    Trowers & Hamlins, Browne Jacobson, Mishcon de Reya, Dentons Europe, Bird &
    Bird, and Deloitte, while top-line disclosures move from 400+ customers in
    late 2025 to 1,200+ organizations and 100,000+ users by June 2026. The
    strongest durability signals are customer-specific repeat-usage metrics such
    as BAHR's 80% active-user rate and Trowers' 97% weekly pilot usage, but
    public NRR, churn, renewal, and concentration data remain absent. The right
    diligence conclusion is that real adoption and enterprise reference quality
    are well supported, while retention quality and diversification still require
    private evidence.
sections:
  - id: segmentation-buyer-user-payer
    title: Segmentation by buyer, user, payer, geography, and customer type
    body: |
      Legora’s public customer mix is clearest at the high end of the legal market rather than in the long tail. Official customer pages and rollout announcements show three recurring payer patterns: large law firms buying for firmwide or cross-office lawyer populations; regulated enterprises such as Erste Group buying for centralized legal organizations; and professional-services partners such as Deloitte using the platform internally while also helping clients implement it. End users are typically lawyers, legal operations staff, or innovation teams, while sponsors are managing partners, CIOs, legal innovation leads, or centralized procurement owners.

      Geographically, the customer proof is broad and increasingly global. Official customer pages cover firms in the Nordics, UK, continental Europe, and large global networks, while separate APAC and Europe expansion releases explicitly tie new offices to existing demand from customers in Singapore, Tokyo, Spain, Italy, and France. The main caveat is that public segmentation is much better by enterprise profile and geography than by revenue band or contract structure. Legora does not publicly split its customer count between law firms, in-house teams, financial institutions, and implementation partners, so the safest read is that the customer book is demonstrably top-tier and international but still opaque on mix and monetization.
    claimRefs: [CU001, CU002, CU014, CU016, CU018, CU019, CU020, CU034]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-named-proof
    title: Adoption trajectory and named customer proof
    body: |
      Legora’s adoption story is strongest when viewed as a sequence of increasingly heavyweight deployments. Legal Technology reported that the company moved from roughly 250 customers in May 2025 to more than 400 by October 2025, then official and press sources moved the count to more than 800 by March 2026, more than 1,000 across 50 markets by April 2026, and more than 1,200 organizations and 100,000 users by June 2026. That top-line trajectory is supported by named rollouts at White & Case, Baker McKenzie, Browne Jacobson, Trowers & Hamlins, and Mishcon de Reya, plus public case studies spanning BAHR, Erste Group, Dentons Europe, Bird & Bird, Deloitte, and Gorrissen Federspiel.

      The quality of named proof is unusually strong for a private legal-tech company because several references are elite global law firms or regulated buyers rather than anonymous logos. White & Case says rollout extends across all lawyers in 43 offices and 29 countries; Baker McKenzie and Browne Jacobson describe global or enterprise-wide availability after evaluation; Erste says implementation spans 250 lawyers across 30-plus legal departments in seven jurisdictions; BAHR and Trowers publish concrete repeat-usage indicators. The limitation is that many of these proofs still originate on Legora-controlled surfaces, so public adoption breadth is credible but independently verified seat depth remains thinner than the logo list suggests.
    claimRefs: [CU005, CU006, CU009, CU010, CU011, CU012, CU013, CU017, CU021, CU022, CU037, CU038, CU039]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: retention-repeat-usage-and-satisfaction
    title: Retention, repeat usage, and satisfaction signals
    body: |
      Public durability evidence exists, but it is uneven and far short of what an investor would want for a renewal model. The best repeat-usage proof is customer specific: BAHR says about 80% of its people are active users and as many as 30% use Legora more than ten times a day, while Trowers & Hamlins says 97% of pilot participants used the platform weekly, 88% rated quality good or excellent, and 87% found it easy or very easy to use. Mishcon de Reya’s post-pilot rollout adds qualitative confirmation that lawyers are using the product repeatedly across contract review, drafting, summarization, and research workflows.

      What is missing is the commercial durability bridge. No reviewed public source discloses NRR, GRR, churn, renewal rate, cohort retention, contract duration, seat expansion by vintage, or revenue concentration by top account. Independent commentary also introduces real caution: GC AI and Comparateur both emphasize demo-only pricing and procurement opacity, while Irys argues lawyers should probe third-party API routing, data-custody implications, and vendor maturity before adopting the product for privileged work. The result is a chapter that can support strong adoption and meaningful workflow value, but not a fully underwritten view of retention quality or customer economics.
    claimRefs: [CU007, CU008, CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU040]
    tableRefs: [TU004]
    figureRefs: []
  - id: expansion-and-concentration-risk
    title: Expansion levers, procurement friction, and concentration risk
    body: |
      The expansion motion is visible even though the revenue math is not. Product-wise, Legora has a credible land-and-expand path from pilot research or document review into Word drafting, workflow automation, portal collaboration, regulatory monitoring, and data-room diligence. That path is reinforced by partner and implementation signals: Datasite embeds Legora into virtual data-room workflows, Deloitte positions it across legal, tax, compliance, risk, and M&A transformation, and several customer pages describe the product as something being built deeper into everyday delivery rather than used as a one-off chatbot.

      Concentration risk, however, remains materially unresolved. The public customer book skews toward large international law firms and sophisticated enterprise buyers, which is strategically attractive but could also imply heavier dependence on a relatively narrow band of high-ACV logos. No public source breaks out revenue by top customer, geography, or segment, and there is no disclosed split between law-firm subscriptions, in-house departments, and partner-led deployments. Investors should therefore treat the current evidence as strong proof of reference quality and procurement credibility, but incomplete proof on diversification, renewal economics, and how much of the book is truly embedded versus still expanding from pilot to standard workflow.
    claimRefs: [CU015, CU017, CU018, CU019, CU027, CU028, CU029, CU030, CU032, CU033, CU035, CU036, CU040]
    tableRefs: [TU005, TU006]
    figureRefs: []
