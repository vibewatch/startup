  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-opacity
      missingEvidence: Portfolio-level NRR, GRR, renewal rate, churn, and cohort retention by customer vintage or segment.
      whyItMatters: Without renewal and churn data, it is impossible to distinguish impressive logo acquisition from durable revenue quality.
      diligencePath: Request a cohort bridge covering gross and net retention, logo churn, seat expansion, and contract duration for the last eight quarters.
      relatedQuestionRefs: [QU018, QU025]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-opacity
      missingEvidence: Revenue share of the top customer, top ten customers, and law-firm versus in-house versus partner-led ARR mix.
      whyItMatters: A concentrated enterprise book can look attractive on logos while still carrying significant downside if a few large accounts dominate the business.
      diligencePath: Request customer concentration and ARR-mix schedules from management, including top-account exposure and segment-level ACV distribution.
      relatedQuestionRefs: [QU019, QU025]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A fuller public roster of named customers with independent confirmation of rollout depth, outcomes, and renewal status.
      whyItMatters: The current named proof is strong but still partial versus a reported 1,200-plus customer base, so public evidence may over-represent flagship references.
      diligencePath: Request a dated reference list with customer permission to discuss deployment scope, outcomes, and renewal history; sample at least ten logos.
      relatedQuestionRefs: [QU026]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: segment-mix-opacity
      missingEvidence: A disclosed split of customers by law firm, in-house team, financial institution, and professional-services partner.
      whyItMatters: Segment mix affects sales efficiency, support burden, renewal dynamics, and how repeatable the GTM motion really is.
      diligencePath: Request booked ARR, logo count, and average seats by segment and geography, then reconcile against the public 1,200-plus organization claim.
      relatedQuestionRefs: [QU001, QU004]
      relatedTableRefs: [TU001]
    - type: private-evidence-only
      severity: material
      topic: small-firm-fit
      missingEvidence: Actual win rates, churn, and ACV for smaller firms or low-procurement buyers versus top-tier enterprise customers.
      whyItMatters: Independent reviews suggest the product and procurement model may bias strongly toward sophisticated buyers, which could narrow the true expansion runway.
      diligencePath: Ask for pipeline conversion, CAC payback, and retention segmented by firm size and procurement complexity.
      relatedQuestionRefs: [QU023]
      relatedTableRefs: [TU005, TU006]