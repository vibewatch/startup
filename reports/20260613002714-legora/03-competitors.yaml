callouts:
  - calloutType: strength
    title: Collaborative workspace is Legora's most defensible differentiator
    body: >-
      Unlike Harvey (which centres on individually deployed agents) and incumbents
      (which are historically single-user research tools), Legora's multi-user
      collaborative workspace embeds at team level, increasing switching cost and
      driving the 80% daily-active-user rates reported at leading Legora customers.
      Baker McKenzie's global deployment and Dentons' reference to scaling
      7,000+ lawyers' knowledge are the clearest evidence this pitch is landing.
    claimRefs:
      - CP003
      - CP009
      - CP025
      - CP033

  - calloutType: risk
    title: Harvey's 2x ARR gap and AmLaw 100 dominance are the primary near-term competitive risk
    body: >-
      Harvey's $190M ARR vs Legora's $100M, combined with its established
      relationships with the majority of AmLaw 100 and 500+ in-house teams,
      means Harvey has the land-and-expand position at the largest US law firms
      that Legora most needs to win. Harvey's push into Europe in 2026 directly
      threatens Legora's home-market advantage. If Legora cannot convert its
      US Series D momentum into AmLaw 100 wins within 12–18 months, the gap
      may widen structurally.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP007
      - CP008
      - CP036

  - calloutType: risk
    title: Foundation-model legal plugins threaten vertical AI pricing power across the sector
    body: >-
      Anthropic's February 2026 legal plugin for Claude and Microsoft Copilot's
      legal use cases represent a structural threat to the pricing premium of
      dedicated legal AI platforms, including both Legora and Harvey. The
      TechCrunch Series D article explicitly noted that publicly listed legal
      software companies saw their stocks decline on the Anthropic announcement.
      Legora's CEO has articulated a clear defensive positioning ("not solving for
      the same use case as consumer legal tools"), but this differentiation rests
      on workflow depth and collaboration that must keep pace with foundation-model
      capability gains.
    claimRefs:
      - CP030
      - CP031
      - CP037

