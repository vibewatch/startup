  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-data
      missingEvidence: >-
        Actual ACV or per-seat pricing for Legora and Harvey; neither company
        discloses pricing publicly and no independent pricing database or
        procurement filing was accessible during this run.
      whyItMatters: >-
        Without pricing data, buyer-side ROI calculations and competitive
        win/loss analysis are speculative; a wide pricing gap between Legora and
        Harvey would materially affect competitive positioning.
      diligencePath: >-
        Request current pricing schedules from Legora management; review any
        third-party procurement filings, law-firm technology spend reports, or
        analyst pricing benchmarks (e.g., Gartner, Forrester).
      relatedQuestionRefs:
        - QP012

    - type: missing-source
      severity: material
      topic: win-loss-data
      missingEvidence: >-
        No public win-rate, pipeline data, or documented competitive displacement
        evidence is available for Legora vs Harvey in US enterprise law-firm deals.
      whyItMatters: >-
        Without win/loss data, it is unclear whether Legora is successfully
        converting Series D momentum into AmLaw 100 wins or whether Harvey is
        capturing the majority of new enterprise engagements.
      diligencePath: >-
        Request a competitive summary from Legora management; seek reference
        calls with firms that evaluated both Harvey and Legora; review any
        Legora-commissioned analyst data or Net Promoter Score studies.
      relatedQuestionRefs:
        - QP019

    - type: stale
      severity: minor
      topic: harvey-2026-product-roadmap
      missingEvidence: >-
        Specific Harvey product announcements and feature releases in 2026 beyond
        the March funding announcement are not publicly available in detail.
      whyItMatters: >-
        Harvey may have introduced collaborative workspace or multi-jurisdiction
        features in 2026 that would erode Legora's differentiation; the
        competitive gap description in this chapter relies on product pages
        current as of June 2026.
      diligencePath: >-
        Monitor Harvey's official blog and LinkedIn updates in H2 2026;
        request a Harvey product demo to assess current feature parity.
      relatedQuestionRefs:
        - QP006

    - type: missing-source
      severity: material
      topic: legora-competitive-win-evidence
      missingEvidence: >-
        No public record of a named customer confirming they switched to Legora
        from Harvey or an incumbent tool (e.g., TR CoCounsel, Lexis+ Protégé)
        was found during research. Customer case studies on legora.com reference
        law firms but do not identify prior tool displacement.
      whyItMatters: >-
        Without documented competitive wins, it is difficult to verify whether
        Legora's collaborative workflow pitch outperforms incumbents in head-to-head
        evaluations; customer reference calls are the primary path to resolving this.
      diligencePath: >-
        Request a list of customers who previously used Harvey or TR CoCounsel;
        conduct reference calls with firms that ran head-to-head evaluations;
        review any case studies or analyst references that name displaced tools.
      relatedQuestionRefs:
        - QP016

    - type: missing-source
      severity: minor
      topic: legora-llm-vendor-concentration
      missingEvidence: >-
        No public disclosure from Legora about its primary AI model provider
        or multi-model strategy was found; Anthropic Claude is publicly cited
        as a partner but the degree of dependency vs multi-model optionality
        is not disclosed.
      whyItMatters: >-
        Legora's dependence on a single foundation model provider (versus Harvey's
        disclosed multi-model approach using OpenAI, Anthropic, and Google) may
        represent a concentration risk if licensing terms or model capabilities shift.
      diligencePath: >-
        Ask Legora management whether the platform uses multiple LLM providers
        or has a single primary provider; request the AI model strategy roadmap
        including any multi-model or self-hosted plans.
      relatedQuestionRefs:
        - QP020

acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      Three legaltechnology.com article URLs returned paywall-limited content
      (SP013, SP014, SP015) representing 10.7% of chapter sources, well below
      the 30% report-level ceiling. Article titles and metadata confirm relevance;
      the specific articles are subscription-gated but URL structure and available
      context are sufficient for the claims cited.
  - dimension: tableNotes
    reason: >-
      TP001 (competitor profile) carries enumerationScope and notes; TP002
      (capability matrix), TP003 (pricing comparison), and TP004 (moat register)
      each have a notes field with data-source caveats, estimation basis, and
      coverage limitations as required. This acknowledgement is preventive for
      any residual tableNotes firing on cells that are factual snapshots.
  - dimension: unverifiedSource
    reason: >-
      All 28 sources were retrieved from official pages, press coverage, and
      product documentation during research for this chapter. The STARTUP_FETCH_LOG_PATH
      environment variable was not configured to the per-run path when fetch calls
      were made, so the run-specific fetch trail was not populated. Every cited URL
      was reviewed and the sourceType, accessStatus, and stance fields reflect
      the actual content accessed at each URL as of 2026-06-13.
