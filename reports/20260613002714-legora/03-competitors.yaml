company:
  name: Legora
chapter:
  number: 3
  title: Competitors
  summary: >-
    Legora's most direct rival is Harvey, an AI-native legal platform that by
    early 2026 had nearly double Legora's ARR ($190M vs $100M) and a valuation
    more than twice as large ($11B vs $5.6B), while also claiming the majority of
    the AmLaw 100. Incumbents Thomson Reuters (CoCounsel / Westlaw) and LexisNexis
    (Lexis+ with Protégé) possess proprietary legal-database moats that no AI
    startup yet matches, and CLM specialists Ironclad and DocuSign occupy the
    contract-workflow lane that partially overlaps Legora's document-review
    capabilities. Legora's clearest differentiation is its collaborative
    multi-user workspace and European law-firm network, while its main
    competitive risks are Harvey's faster US penetration, incumbent database
    advantages, and the growing threat from foundation-model providers deploying
    legal plugins directly into their platforms.

sections:
  - id: direct-ai-native-rivals
    title: Direct AI-native rivals
    body: >-
      Harvey is Legora's closest strategic peer and most intensively covered
      competitor. Founded in 2022 by Winston Weinberg (O'Melveny & Myers) and
      Gabe Pereyra (former Google DeepMind), Harvey describes itself as "the
      operating system for legal and professional services," a positioning that
      mirrors Legora's own "agentic operating system for legal work" messaging
      and signals direct brand-level competition. By March 2026 Harvey had raised
      $200 million at an $11 billion valuation led by Sequoia and GIC, bringing
      its total capital raised above $1 billion — roughly 1.6 times Legora's
      $600 million cumulative raise. Harvey's disclosed ARR of $190 million at
      end-2025 was nearly double Legora's $100 million milestone announced in
      April 2026, and Dealroom noted that both companies have been on "almost
      identical revenue trajectories," meaning Harvey simply got there faster
      and with a larger US installed base.


      Harvey reported 100,000+ lawyers across 1,300+ organizations in 60+
      countries, with the majority of the AmLaw 100 and 500+ in-house legal
      teams as customers. Harvey's 25,000+ custom agents operating on the
      platform signal a product philosophy oriented toward autonomous,
      single-workflow execution. Legora, by contrast, emphasizes team
      collaboration and embedded workflow — citing an average of 4.3 non-billable
      hours saved per lawyer per week and emphasising that 80% of users at some
      firms use Legora daily. The CEO of Legora has explicitly acknowledged that
      Harvey is pushing into Europe while Legora expands into the US, creating
      direct geographic overlap in 2026 for the first time. Harvey is built on
      top of LLMs from OpenAI, Anthropic, and Google, fine-tuned on proprietary
      legal datasets; Legora is primarily built on Claude. Both companies
      therefore share a structural dependency on foundation-model providers, and
      any model commoditisation affects both equally.


      Beyond Harvey, the niche legal AI segment includes EvenUp (personal injury),
      Supio (plaintiff law), and Finch (paralegal workflows). These are
      complementary verticals rather than direct substitutes for Legora's
      multi-practice platform, but they signal that well-funded specialists are
      targeting the same broad market from narrower entry points.
    claimRefs:
