          label: 法律内容伙伴
          description: Wolters Kluwer、Qura、官方法律数据库和其他授权内容来源。
        - id: d5
          label: 工作流控制伙伴
          description: Datasite 和其他保留文档权限与工作流上下文的系统。
        - id: d6
          label: 企业客户
          description: 处理特权数据的律所、银行、咨询公司和企业法务团队。
        - id: d7
          label: 监管机构 / 律师执业规则
          description: AI Act、GDPR / ICO 和法律伦理预期塑造部署方式。
      edges:
        - from: d2
          to: d1
          label: 模型 / 托管
        - from: d3
          to: d1
          label: 网页检索
        - from: d4
          to: d1
          label: 权威内容
        - from: d5
          to: d1
          label: 工作流入口
        - from: d7
          to: d1
          label: 合规义务
        - from: d1
          to: d6
          label: 法律工作成果
        - from: d6
          to: d7
          label: 投诉 / 审查
    approximationNotes: 该图展示控制依赖，而非收入集中度；各合作伙伴的商业重要性未公开披露。
    claimRefs:
      - CR012
      - CR014
      - CR015
      - CR040
      - CR041
      - CR042
      - CR048
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从运营证明和稀缺性溢价出发，到当前估值下给出「观察」建议的决策链。
    data:
      nodes:
        - id: n1
          label: 规模证明：$100M+ ARR、1,000+ 客户、400+ 员工
        - id: n2
          label: 工作流深度：企业法律增长和 Datasite 集成
        - id: n3
          label: 私募溢价：类似 Harvey 的法律 AI 稀缺性倍数
        - id: n4
          label: 缺失经济性：NRR、毛利率、CAC、烧钱、股权结构表条款
        - id: n5
          label: 公开现实：可比公司交易大多约为 1.5x-5.0x 收入
        - id: n6
          label: 建议：以 $5.6B 估值观察；等待更强证据或更好价格
      edges:
        - from: n1
          to: n6
          label: 支撑关注
        - from: n2
          to: n6
          label: 支撑溢价
        - from: n3
          to: n6
          label: 解释当前估值
        - from: n4
          to: n6
          label: 限制确信度
        - from: n5
          to: n6
          label: 锚定纪律
    claimRefs:
      - CV003
      - CV005
      - CV010
      - CV016
      - CV025
      - CV039
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值敏感性示意显示，ARR 和倍数假设一变，股权价值就会迅速从折价转向温和上行空间。
    data:
      items:
        - label: $150M ARR × 15x（基准情景）
          value: 2.25
          note: 偏悲观结果：增长放缓，估值倍数大幅压缩。
        - label: $180M ARR × 20x（乐观情景）
          value: 3.6
          note: 基准情景低端，低于当前估值。
        - label: $220M ARR × 25x（上行情景）
          value: 5.5
          note: 基准情景高端，相比今天大致持平。
        - label: $250M ARR × 35x（高增长情景）
          value: 8.75
          note: 乐观情景，但摊薄前仍只有中等上行空间。
        - label: $300M ARR × 40x（极端乐观情景）
          value: 12
          note: 公开证据下最好的乐观情景，需要规模和溢价持久性同时兑现。
    claimRefs:
      - CV016
      - CV017
      - CV033
      - CV036
      - CV037
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景范围从大幅折价到温和上行，同时给出以 $5.6 billion 入场价隐含的回报门槛。
    data:
      items:
        - label: 悲观情景
          low: 1.4
          mid: 1.8
          high: 2.3
          note: 增长放缓，估值在 $120M-$150M ARR 基础上向 12x-15x 收敛。
        - label: 基准情景
          low: 3.6
          mid: 4.5
          high: 5.5
          note: ARR 增至大约 $180M-$220M，但倍数压缩至 20x-25x。
        - label: 乐观情景
          low: 8.8
          mid: 10.5
          high: 12
          note: ARR 达到大约 $250M-$300M，Legora 仍能守住 35x-40x 的稀缺性倍数。
        - label: 2x MOIC 门槛
          low: 11.2
          mid: 11.2
          high: 11.2
          note: 要让 $5.6B 入场价翻倍，退出时摊薄前股权价值至少要达到的水平。
        - label: 3x MOIC 门槛
          low: 16.8
          mid: 16.8
          high: 16.8
          note: 要取得 3x 总回报，退出时摊薄前股权价值至少要达到的水平。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格记分卡，概括 Legora 哪些地方强、当前估值又在哪些方面仍缺少公开证据。
    data:
      items:
        - label: 市场 / 需求
          value: 8/10
          note: 采用证据扎实，法律 AI 品类也在快速放大。
        - label: 产品 / 工作流深度
          value: 7/10
          note: Datasite 和企业工作流支撑更宽的平台叙事。
        - label: 竞争位置
          value: 6/10
          note: Harvey 验证了品类，也设下了很高的对标门槛。
        - label: 经济性可见度
          value: 3/10
          note: NRR、毛利率、CAC 和烧钱速度仍未在公开来源披露。
        - label: 融资通道
          value: 8/10
          note: $600M 轮融资和战略投资者显示，赞助方支持很强。
        - label: 风险画像
          value: 4/10
          note: 高入场价风险叠加执行风险，让新资金面对不对称下行。
        - label: 估值支撑
          value: 2/10
          note: 公开可比公司目前不支持支付 Harvey 式 ARR 倍数。
        - label: 证据质量
          value: 5/10
          note: 增长故事证据充分，但决定性的后期 KPI 组合仍未公开。
    claimRefs:
      - CV024
      - CV029
      - CV030
      - CV040
      - CV041
      - CV042
      - CV043
