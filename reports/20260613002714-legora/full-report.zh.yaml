      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >
              Legora 的采用故事，放在一串越来越重的部署中看最有说服力。Legal Technology 报道称，公司客户数从 2025 年 5 月约 250 家，增至 2025 年 10 月超过 400
              家；随后官方和媒体来源把数字推到 2026 年 3 月超过 800 家、2026 年 4 月跨 50 个市场超过 1,000 家，以及 2026 年 6 月超过 1,200 个组织、100,000
              名用户。这个顶线轨迹还有具名上线支撑，包括 White & Case、Baker McKenzie、Browne Jacobson、Trowers & Hamlins 和 Mishcon de
              Reya；公开案例研究覆盖 BAHR、Erste Group、Dentons Europe、Bird & Bird、Deloitte 和 Gorrissen Federspiel。


              对一家私人法律科技公司来说，具名证据质量异常强，因为多个参考客户是顶级全球律所或受监管买方，而不是匿名客户标识。White & Case 称上线覆盖 43 个办公室、29 个国家的所有律师；Baker
              McKenzie 和 Browne Jacobson 描述了评估后的全球或企业级可用性；Erste 称实施覆盖 7 个司法辖区、30 多个法务部门的 250 名律师；BAHR 和 Trowers
              发布了具体重复使用指标。限制在于，许多证据仍来自 Legora 控制的界面，因此公开采用广度可信，但独立验证的席位深度仍比客户名单暗示的更薄。
