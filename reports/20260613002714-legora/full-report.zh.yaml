      - number: '5.3'
        title: 部署、集成、可靠性与支持姿态
        blocks:
          - type: paragraph
            body: >-
              部署模式偏企业级，而不是自助式。安全与法律文件显示，Legora 是一项云服务，可通过浏览器、桌面应用、约定的 API，以及其他软件的插件或加载项使用。产品页展示了嵌入 Word 和 Outlook 的
              Legora；支持国家页面显示其地理覆盖很广，但少数司法辖区有配置限制。Microsoft 上架页又补上 SharePoint、Azure、SSO 和数据驻留选项；MCP
              文章则把集成范围扩展到文档管理系统、CRM 工具、电子签名系统和定制内部系统。合起来看，公开证据支持这样一个判断：Legora 的企业部署模型是嵌进现有法律技术栈，而不是直接替换周边所有系统。


              可靠性和支持证据，在控制措施上强于服务结果。安全措施文件称，备份每四小时运行一次，生产访问使用 MFA，数据在多个 Azure 地点复制，日志集中保留至少十二个月，并且每年做渗透测试。DPA 又加入 36
              小时泄露通知承诺，以及正式的子处理方更新和异议流程。这些都是有意义的信任信号，但不能等同于公开的正常运行历史、状态页，或清晰的响应时间 / SLO
              承诺。支持访问控制很严，并以客户批准为前提，这对保密有利；但缺少公开可靠性指标，意味着投资人仍需在私下尽调中核实事件率、恢复表现、支持人员配置，以及新模块在生产负载下的表现。
