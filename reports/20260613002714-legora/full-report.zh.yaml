      - number: '7.2'
        title: 即使控制措施可见，运营、质量和安全风险仍结构性偏高
        blocks:
          - type: paragraph
            body: >-
              公开下行情景最容易从输出质量看出来。法律 AI 有记录在案的幻觉问题，本报告包中最强的独立证据称，即便领先的法律研究系统，也仍会以不可忽视的比例编造答案或错误溯源。法院和律师协会越来越多地制裁未核验 AI
              生成法律依据的律师，这意味着法律 AI 供应商不需要发生网络攻击也会遭受信任损害；依据薄弱的输出本身就足够。Legora 的产品雄心放大了这种暴露，因为公司明确称其 Agent
              会端到端计划、执行、审阅和交付复杂工作。同样的自主性，在工作流触及内部文件、外部工具或实时尽调资料库时，也抬高了保密风险；这直接映射到 OWASP 发布的 LLM
              风险类别，包括提示注入、敏感信息披露、过度代理和过度依赖。好消息是，Legora 已发布有意义的控制：不用客户数据训练模型、支持访问需书面批准、MFA、每四小时备份、日志记录、Azure
              复制，以及多项治理承诺。核保问题在于，这些仍主要是公司自述控制。没有公开正常运行历史，没有披露 Legora 专属幻觉率，也没有公开事件登记表说明公司多常在客户之前拦截坏输出。
