  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、披露牵引力与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Legora 应按具备经常性订阅经济的企业软件公司来承销，但公开记录对增长的说明远比对变现机制清晰。最强的公开收入事实，是公司 2026-04-02 声明：自 2024 年 10 月全面可用后不到 18
              个月，ARR 超过 $100M，并服务 50 个市场的 1,000+ 个客户。2026 年 3 月融资报道给出了上一阶段运营快照：800 个客户、数万名每日法律用户，以及过去一年团队从 40 人扩到 400
              人。到 2026 年 6 月新闻中心索引，Legora 声称已有 1,200+ 家组织的 100,000+ 名法律专业人士。这足以支撑真实需求，但不足以按律所 vs 企业法务客户、按地域或按产品模块拆分收入。


              明显缺失的是价格透明度。本次审阅的官方新闻稿、about 页面和更广公开来源包，都没有披露标价、按席位定价、最低合同额、服务附加、折扣或收入确认政策。因此最稳妥的收入模型归纳是：企业 B2B
              SaaS，围绕部署、研究、起草和尽调用例进行工作流扩展和实施投入。对私营公司而言，收入线索异常充分，但投资者仍需要逐收入流桥接，才能把 $100M ARR 视作成熟、高质量 SaaS 收入的等价物。
