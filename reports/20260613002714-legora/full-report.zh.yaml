  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 法律输出可靠性失败
        - 有记录的伪造权威依据、错误成文法文本，或与 Legora 输出相关的反复客户升级
        - 两起重大事项中的独立客户事故、一次法院制裁，或管理层无法展示人工覆盖 / 纠正指标
        - 暂停承保，或要求设置强合同留置，直到产品 QA 证据和人工审阅关卡得到证明。
      - - 保密或隐私失败
        - 涉及特权内容的公开事故、监管问询或已通知客户的数据泄露
        - 任何涉及客户法律材料的已确认事故，或无法解释工具调用 / 访问日志
        - 转为回避，除非事故范围、根因和补救措施得到独立验证。
      - - 依赖冲击
        - 关键供应商、内容伙伴或 VDR 集成改变条款或服务退化
        - 权威内容源丢失、重大模型 / 搜索供应商变化，或现场事项中反复出现集成宕机
        - 在备用技术栈和客户迁移计划得到证明前，视为投资逻辑受损。
      - - 执行过载
        - 招聘速度跑赢控制、支持或发布质量
        - 区域扩张中出现流失率飙升、实施放缓、SLA 未达标或质量升级增加
        - 降低仓位、要求运营指标，或等待规模化后稳定。
      - - 估值与增长错配
        - 增长和续约证明不再支撑溢价叙事
        - ARR 增长明显减速，同时信任或质量指标走弱，或关键客户因风险担忧推迟扩张
        - 按更低倍数重新承保；若管理层无法证明有韧性的留存和利润率路径，则退出。
    notes: 这些否决标准刻意设计为可监测项；如果流程推进，应配套尽调权、信息承诺或董事会报告要求。
    claimRefs:
      - CR018
      - CR020
      - CR028
      - CR029
