      - number: '8.3'
        title: 情景区间、回报纪律与退出准备度
        blocks:
          - type: paragraph
            body: >-
              回报算术是保持纪律的核心原因。新投资人以 $5.6 billion 进入，需要超过 $11.2 billion 的退出股权价值，才能在稀释前实现简单 2x 投入资本总倍数；3x 则需要超过 $16.8
              billion。如果退出前公司还需要 15% 到 20% 的稀释，3x 门槛会升至 $20 billion 以上。这并非不可能，但要求 Legora 从 $100 million ARR
              扩至数亿美元，同时守住远高于公开可比公司的溢价倍数。因此乐观情景既需要运营交付，也需要持续稀缺性：约 $250 million 到 $300 million ARR 加上 35x 到 40x 倍数，可支撑
              $8.8 billion 到 $12.0
              billion，若后续稀释不是很小，相对当前估值只能带来中等上行。基准情景假设继续增长但倍数部分回归，结果接近持平到小幅下行。悲观情景不是归零，但会很痛：增长放慢叠加公开市场式倍数，会造成有意义的估值下调。这个画像支持耐心，也支持把近期退出更可能看作另一轮私募融资或战略交易，而不是干净的公开市场首秀。
            claimRefs:
