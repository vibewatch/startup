      - number: '1.3'
        title: 资本轨迹与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Legora 2025–2026 年融资曲线，是本档案中最强的外部验证信号。2026 年 3 月公司发布、TechCrunch 和 CNBC 均指向一笔由 Accel 领投、估值 $5.55B 的 $550M
              Series D，Benchmark、Bessemer、General Catalyst、ICONIQ、Redpoint 和 Y Combinator 等老股东参与。一个月后，公司、CNBC 和 Legal IT
              Insider 又报道了 $50M 延伸轮，使总轮次达到 $600M，投后估值达到 $5.6B，并引入 Atlassian 和 NVentures。


              同期，规模信号也快速上台阶。2026 年 4 月 ARR 公告称，Legora 在全面可用不到 18 个月后跨过 $100M 年经常性收入（ARR），客户超过 1,000 个，覆盖 50 个市场。2026 年 6
              月新闻中心更新把运营图景进一步推至 100,000+ 名法律专业人士、1,200+ 家律所和企业团队，以及四大洲 16
              座城市。部分第三方页面仍明显落后于这一节奏，这本身就是尽调信号：投资者应优先相信更新的一手发布，而不是滞后的目录，但仍要向管理层索取带日期的运营 KPI 包和当前股权结构表摘要。
