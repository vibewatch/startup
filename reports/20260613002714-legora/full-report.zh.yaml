      - number: '3.2'
        title: 既有法律研究与工作流平台
        blocks:
          - type: paragraph
            body: >-
              Thomson Reuters 和 LexisNexis 是 AI
              原生法律技术栈最深的结构性威胁，因为两者拥有当前初创公司无法匹配的资产：数十年沉淀的、经人工整理的自有法律数据库，支撑了整个法律研究市场。Thomson Reuters 的 Westlaw 现更名为
              Westlaw Advantage，其产品页称之为“AI 驱动的法律研究工具”，并把 TR 的生成式 AI 法律助手 CoCounsel 直接集成进 Westlaw 研究环境。CoCounsel Core 提供
              AI 起草的研究备忘录、合同分析、证词准备和文档审阅，全部扎根于 Westlaw 的一手法律语料。2026 年 Thomson Reuters AI in Professional Services
              报告发现，40% 的法律专业人士已使用 GenAI——接近上一年的两倍——且 80% 的 GenAI 用户每周接触 AI 工具，说明通向律所的既有分销渠道已经在捕捉 Legora 试图搭上的采用浪潮。


              LexisNexis 在 2026 年 2 月把 Lexis+ AI 更名为“Lexis+ with Protégé”，把 Protégé AI 助手嵌入研究、起草和分析工作流。Protégé 将
              Shepard's citations——LexisNexis 自有引用验证服务——直接整合进起草工作流，给律师提供来源层面的权威核查；Legora
              若没有同等深度法律数据库，暂时无法复制这一点。LexisNexis 还支持 iManage、SharePoint 和 NetDocuments DMS
              集成，让律师能在一个工作区内同时处理自己的文档和权威法律来源——这一能力部分映照 Legora 的协作工作区主张。LexisNexis 委托 Forrester 于 2025 年完成的 TEI
              研究发现，大型律所三年 ROI 为 344%；另一项研究发现企业法务部门 ROI 为 284%。这些数字由厂商委托，不应照单全收，但它们显示了 LexisNexis 用来支撑续约和增购对话的数据基础设施。


              2025 年，主导型执业管理平台 Clio 收购了拥有 40+ million 份法律文档的法律研究提供商 vLex，进一步加深数据库位置。这让 Clio 成为 TR 和 LexisNexis
              之外少数拥有有意义法律数据库护城河的公司之一，而这正是 Legora 试图通过收购 Qura 建立的资产。截至 2026 年 6 月，Clio 又收购了加拿大法律 AI 公司 Jurisage，强化其 AI
              原生研究野心。Clio 与 Legora 的主要差异在于其执业管理层（计费、案件、信托账户、支付），Legora 并不提供这些能力，因此 Clio 在小型和独立律师事务所中更强，而 Legora 面向更大型业务。
