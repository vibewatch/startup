  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 反向逻辑
      - 观点改变条件
    rows:
      - - 对一家私人法律 AI 公司而言，需求证明异常强。
        - $100M+ ARR、1,000+ 客户和 50+ 市场支撑真实产品市场契合。
        - 公开记录仍未披露 NRR、毛利率、CAC 和烧钱速度。
        - 提供高于 120% 的队列留存、高于 80% 的毛利率，以及可信的现金效率指标。
      - - 工作流深度可以支撑相对单点解决方案同行的溢价。
        - Datasite 集成和企业法务采用，说明产品有机会更深嵌入工作流并继续扩张。
        - 公开来源没有量化这些工作流贡献了多少收入或 ACV 提升。
        - 展示伙伴来源管道、企业法务收入结构，以及工作流模块带来的净扩张。
      - - 私人市场正在为法律 AI 领导者支付稀缺性倍数。
        - Harvey 和 Legora 都在接近高 50x ARR 区间交易，说明顶级名字享有品类溢价。
        - 公开法律和工作流软件可比公司约按 1.5x 到 5.0x 收入交易，因此私人估值可能急剧压缩。
        - 在保持超高增长的同时披露足够强的经济性，证明有能力守住高于公开可比区间的估值。
      - - 融资可得性降低了近期偿付风险。
        - $600M 轮次和新战略投资人表明赞助方支持强，未来融资可信度高。
        - 优先股堆叠条款未披露，因此企业价值上行未必能干净转化为普通股等价回报。
        - 提供 Series D 后股权结构表、优先级、清算优先权和反稀释条款。
      - - 退出天花板足够高，值得关注。
        - 如果执行保持顶尖，定义品类的法律 AI 平台仍可能成为数百亿美元级资产。
        - 新投资人以 $5.6B 入场，需要非常大的退出才能赚到目标回报，尤其是在稀释之后。
        - 在把当前估值视为有吸引力之前，先证明通往 $250M-$300M ARR 和持久溢价定价的路径。
    notes: 投资逻辑的核心是质量加价格；正面的运营判断并不自动证明当前入场估值合理。
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV010
      - CV016
      - CV024
      - CV025
      - CV028
      - CV031
      - CV042
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - ARR 扩张到约 $250M-$300M，工作流深度改善定价权，市场继续把 Legora 视为类似 Harvey 的稀缺资产。
        - $8.8B-$12.0B，约 35x-40x ARR；按今天估值、稀释前约 1.6x-2.1x。
        - 有可能，但需要顶尖执行和私人市场继续亢奋。
        - 任何放缓、稀释或公开可比公司收敛都会快速侵蚀上行空间。
      - - 基准
        - ARR 约达 $180M-$220M，但投资人要求更清晰的经济性后，倍数压缩到 20x-25x。
        - $3.6B-$5.5B；较当前标记大致持平到下行。
        - 公开证据下最可能：增长仍可延续，但定价权会回归常态。
        - 如果经济性继续不披露，或下一轮融资热度降温，新资金回报有限。
      - - 悲观
        - ARR 仅温和增至约 $120M-$150M，或增速放缓快于预期，估值收敛到 12x-15x。
        - $1.4B-$2.3B；相对 $5.6B 大幅下调。
        - 尾部风险实质存在，尤其在下一轮融资市场不再愿意为叙事增长买单时。
        - 下轮降估、优先权包袱、品类情绪重置，都可能压低普通股回收。
    notes: 情景输出是分析师基于已披露 ARR、可比公司倍数和回报门槛推算的估计，不是公司指引。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Harvey
        - $190M ARR 对应 $11.0B 估值
        - ~57.9x ARR
        - 最接近的私有法律 AI 龙头，也是最清晰的稀缺性溢价参照。
        - 热融资市场里的私募标记；经济性披露仍有限。
      - - DocuSign
        - $3.21B 收入对应 $8.59B 市值
        - ~2.7x 收入
        - 大规模协议与 CLM 工作流平台，分销体系成熟。
        - 产品组合更宽，增速也远慢于 Legora。
      - - Intapp
        - $0.54B 收入对应 $1.84B 市值
        - ~3.4x 收入
        - 面向法律及其他受监管专业服务公司的垂直软件平台。
        - 规模更小，终端市场组合也比纯法律 AI 平台更分散。
      - - CS Disco
        - $0.15B 收入对应 $0.22B 市值
        - ~1.5x 收入
        - 上市法律科技纯标的，说明市场会如何惩罚低增长法律软件。
        - 产品集不同，增长画像也弱于 Legora。
      - - Thomson Reuters
        - $7.66B TTM 收入对应 $35.53B 市值
        - ~4.6x 收入
        - 数据厚实的法律信息老牌公司，工作流和内容资产耐久。
        - 成熟多元化龙头，不是高增长私有 AI 平台。
      - - RELX
        - $11.83B 收入对应 $59.44B 市值
        - ~5.0x 收入
        - 另一家有数据护城河的法律 / 专业信息龙头，也是上市可比区间高端。
        - 全球化规模龙头，利润率、增速和组合结构都不同。
    notes: 上市可比公司使用 2026 年 6 月市值和收入页面；在已审阅来源包中，Harvey 是唯一可直接比较的私有法律 AI 溢价参照。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows intentionally cover the most decision-useful direct private peer plus adjacent public legal and workflow
        software references available in public sources as of 2026-06-13; this is not an exhaustive software comp
        screen.
