      - number: '6.4'
        title: 扩张杠杆、采购摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >
              扩张动作可见，即使收入算式不可见。产品上，Legora 有一条可信的先落地再扩张路径：从试点研究或文件审阅，延伸到 Word
              起草、工作流自动化、门户协作、监管监测和数据室尽调。合作伙伴与实施信号也强化这条路径：Datasite 把 Legora 嵌入虚拟数据室工作流，Deloitte 把它放进法律、税务、合规、风险和 M&A
              转型场景；多篇客户页把产品描述为更深地进入日常交付，而不是一次性聊天机器人。


              但集中度风险仍重大且未解决。公开客户账本偏向大型国际律所和成熟企业买方，战略上很有吸引力，但也可能意味着对较窄一批高 ACV
              客户的依赖更重。没有公开来源按头部客户、地域或细分市场拆收入，也没有披露律所订阅、企业法务部门和伙伴主导部署之间的占比。投资人因此应把当前证据视为参考客户质量和采购可信度的强证明，但在多元化、续约经济性，以及账本中有多少真正嵌入、多少仍在从试点扩张到标准工作流的问题上，证据仍不完整。
