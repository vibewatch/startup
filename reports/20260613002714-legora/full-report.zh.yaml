  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接 AI 原生对手
        blocks:
          - type: paragraph
            body: >-
              Harvey 是 Legora 最接近的战略同业，也是覆盖最密集的竞争对手。Harvey 由 Winston Weinberg（O'Melveny & Myers）和 Gabe Pereyra（前 Google
              DeepMind）于 2022 年创立，自称“法律和专业服务的操作系统”；这一定位映照 Legora 自己“法律工作的智能体操作系统”信息，显示出直接的品牌层面竞争。到 2026 年 3 月，Harvey
              已完成由 Sequoia 和 GIC 领投、估值 $11B 的 $200M 融资，累计融资超过 $1B——约为 Legora $600M 累计融资的 1.6 倍。Harvey 披露的 2025 年末 ARR 为
              $190M，几乎是 Legora 2026 年 4 月宣布的 $100M 里程碑的两倍；Dealroom 指出，两家公司走在“几乎相同的收入轨迹”上，意味着 Harvey
              只是更快到达，并且拥有更大的美国装机基础。


              Harvey 报告称，其覆盖 60+ 个国家、1,300+ 家组织、100,000+ 名律师，客户包括多数 AmLaw 100 和 500+ 家企业法务团队。平台上运行的 25,000+
              个定制智能体显示，其产品理念偏向自主、单一工作流执行。相较之下，Legora 强调团队协作和嵌入式工作流——引用每名律师每周平均节省 4.3 个非计费小时，并强调部分律所 80% 的用户每天使用
              Legora。Legora CEO 已明确承认，Harvey 正推进欧洲，而 Legora 正扩张美国，2026 年首次形成直接地域重叠。Harvey 构建在 OpenAI、Anthropic 和 Google
              的 LLM 之上，并用自有法律数据集微调；Legora 主要构建在 Claude 之上。因此，两家公司都结构性依赖基础模型提供商，任何模型商品化都会同等影响双方。


              Harvey 之外，细分法律 AI 赛道还包括 EvenUp（人身伤害）、Supio（原告律师业务）和 Finch（律师助理工作流）。这些更像互补垂直，而不是 Legora
              多业务平台的直接替代品，但它们表明，资金充足的专业厂商正从更窄切入口进攻同一广阔市场。
