      - number: '8.4'
        title: 否决触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              不应为本轮强行追价的主要原因在于，缺失的尽调恰好决定后期回报质量。公开来源证明了采用和融资能力，但没有展示 $600 million
              轮在股权结构表中如何落位，留存和毛利率是否支撑软件式耐久性，或烧钱速度和现金跑道是否会很快迫使公司再做一轮激进融资。最强负面证据不是 Legora 本身，而是这个品类：Robin AI 在 2025
              年底裁员并进入困境出售流程，说明法律 AI 叙事一旦增长和融资落后预期，可以多快破裂。对 Legora 而言，如果下一轮融资价格低于当前估值，披露 ARR
              增速在缺少利润率证明的情况下大幅放缓，或工作流扩张故事未能转化为粘性的经常性收入，投资逻辑就会破。尽调议程因此很直接：拿到股权结构表，拿到队列留存和毛利率，拿到烧钱速度和现金跑道，并量化企业法务与伙伴主导工作流是否真的在复利，而不只是扩展故事。
