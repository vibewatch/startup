  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流需求
      - Legora 方案
      - 可衡量或已陈述收益
      - 限制 / 观察点
    rows:
      - - 尽调 / 批量审阅
        - 审阅大量合同或证据文件，并一致地抽取风险
        - Tabular Review 加 Agent 或 Workflows，构建结构化网格、标记问题，并可起草报告章节
        - 减少手工抽取，并让每个答案都链接到来源文档
        - 没有公开基准测试量化大规模错误率或审阅者返工
      - - 研究备忘录或带引用答案
        - 结合内部知识、网页研究和可信法律内容
        - Legal Research 加 Assistant 返回带引用的综合结果，并可流转到 Editor 或 Word
        - 把 Legora 定位为有来源支撑的通用聊天机器人替代品
        - 公开材料没有展示按合作伙伴拆分的完整覆盖范围，或引用颗粒度测试
      - - 在 Word 中起草和修订
        - 不离开 Word，就能编辑客户模板、应用规则手册并生成修订记录
        - Word Add-in 校对草稿和条款，运行规则手册，并返回带引用红线
        - 让律师留在原生起草环境中，减少上下文切换
        - 具体权限和 add-in 部署模型没有在公开文档中详细说明
      - - 事项协调 / 交割清单
        - 在实时交易或争议工作中跟踪事实、任务、负责人和来源引用
        - Lists 从来源文档自动填充行，并支持分派、评论和签核
        - 去掉手工电子表格或 Word 表格跟踪，同时保留可辩护性
        - Lists 仍是第一版，未来延伸到其他界面还只是路线图，交付情况尚未完整记录
      - - 监管监测和后续执行
        - 跟踪官方法律变化、分拣并转化为有负责人的行动
        - Monitors 按计划扫描官方来源，然后把工作路由到研究、Lists 和 Editor
        - 把发现到行动压进同一个法律工作区，而不是拆在多个工具里
        - 覆盖广度和精度仍停留在公司说法，缺少独立公开指标
      - - 客户协作与交付
        - 向客户共享输出文件和工作流，同时不暴露内部逻辑
        - Portal 提供品牌化共享工作区，带引用答案和基于角色的访问控制
        - 平台价值从内部提效延伸到面向客户的交付
        - 公开材料尚未展示外部用户生命周期保留或审计导出示例的细节
    notes: 收益结合了公司说法和可观察的工作流设计；限制项记录每个用例在公开证据上的主要保留点。
