            body: >-
              Legora 正试图先按品类赢家的速度扩张，再补上品类赢家级别的控制证据。独立和官方来源都指向极快扩张：超过 400 名员工，一年内 EMEA 员工达到 700 人的目标，年底前美国员工预计超过 300 人，以及
              16
              城全球布局。这可能带来强大的分发和工程优势，也会成倍放大入职、发布、支持和管理带宽风险。公开领导层故事仍由创始人主导，管理梯队深度相对偏薄，投资人不应默认运营层已经像融资层一样成熟。融资层无疑很高端：$550
              million Series D 之后，很快又以 $5.6 billion 投后估值追加 $50
              million。在这种结构下，执行失误不必灾难性就能打破投资逻辑；只要足够可见，能拖慢扩张、动摇采购团队，或让外界质疑公司是否跑在治理曲线前面即可。务实回应是，把这些担忧转成否决标准，绑定事件、质量指标、伙伴变更管理，以及规模化期间运营纪律的证据。
