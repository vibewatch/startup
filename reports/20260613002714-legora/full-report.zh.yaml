    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Legora 最新的官方定位不是狭窄的单点工具，而是“法律工作的智能体操作系统”。在新闻中心、产品页和法律研究页面，公司持续强调自己支持律师做研究、审阅和起草；产品页又加入文档对比、表格化审阅、Word
              add-in 和工作流支持。公司也强调，其助手不是通用聊天机器人，而是为法律专业人士打造；带引用的答案和工作流集成是核心承诺。


              公开地点叙事方向清晰，但并不完全干净。官方材料把 Legora 锚定在 Stockholm，而增长叙事已经明显跨国：官方发布提到 Stockholm、London、New York、Denver、Sydney 和
              Bengaluru 团队，并在 2026 年晚些时候扩至 Singapore、Tokyo、Madrid、Milan 和 Paris。公司自己的 about 页面仍落后于更新的新闻中心说法，显示 375+
              名同事、980+ 个客户和 30+ 个市场；而 2026 年 6 月新闻中心页面把这些数字显著推高。因此最稳妥的归纳是：创立于 Stockholm、全球运营，并且扩张快到部分官方页面已经过时。
