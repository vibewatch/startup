      - number: '1.4'
        title: 里程碑、合作伙伴与反向信号
        blocks:
          - type: paragraph
            body: >-
              里程碑顺序显示，公司正从 AI 起草助手转向更广的法律工作流平台。官方材料称，Legora 在早期开发中与 Mannheimer Swartling 密切合作，并于 2024 年 10 月全面可用。2026
              年，公司又叠加了大额融资、通过 Qura 扩展法律研究、通过 Cadastral 扩展商业地产、新国家办公室，以及 Datasite、Wolters Kluwer Legal & Regulatory US
              等工作流合作。这些动作合在一起，支撑了管理层的判断：法律 AI 的价值正在从孤立提示词转向系统级、以文档为中心的工作流。


              主要负面信号不是公开法律危机或融资压力，而是披露不一致和执行负担。不同来源在创立日期、员工数、办公室数、客户数和累计融资额上不一致；这些差异大多可由时间点、过时目录或延伸轮前后口径差解释。TechCrunch
              也直接点出了 Legora 的护城河挑战：Harvey 仍是资金充足的对手，而 Microsoft Copilot、Anthropic
              的法律插件工作以及其他通用模型提供商，可能从下方挤压工作流厂商。这并不会推翻公司故事，但意味着尽调应聚焦数据护城河、留存、部署深度和治理，而不是假设快速收入增长本身就能解决投资问题。
