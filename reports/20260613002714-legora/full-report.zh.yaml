      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              核心增长驱动因素，是律所和企业法务团队可获得的结构性劳动力套利：AI 能处理目前大量消耗律师助理和初级律师时间的高频、文档密集型任务。根据 BRC 市场报告引用的 Clio 数据，律所专业人士中的 AI 采用率从
              2023 年的 19% 飙升至 2026 年的 79%——这种异常加速反映了模型成本下降和用户舒适度提升。TR 2026 报告发现，80% 的法律专业人士把研究列为首要 AI
              用例，其后是文档审阅（74%）和摘要（73%），这与 Legora 的产品足迹直接对应。智能体 AI 采用仍处早期——目前只有 16% 的律所使用——但 77% 的专业人士预计，到 2030
              年它将成为工作流核心，从而验证 Legora 的 AaaS（Agent as a Service）定位是一项面向未来的押注。


              主要约束是信任、保密、变革管理，以及通用平台竞争。TR 2026 报告显示，只有 17% 的法律专业人士对 AI 提供法律建议在伦理上感到安心；23% 犹豫，19% 担忧。律所受 ABA Model Rule
              1.6（客户保密）和 Rule 1.1（胜任能力）约束，这意味着任何数据处理没有锁死的 AI 工具都会卡在合规门口。Legora 的 ISO 42001、ISO 27001 和 SOC 2 Type 2
              认证直接回应这一点，但大型律所采购团队通常会独立开展数据处理审计，把销售周期再拉长数月。


              最值得投资者特别关注的竞争约束，是基础模型提供商从下方侵蚀垂直法律 AI 平台的风险。TechCrunch 2026 年 3 月报道指出，Anthropic 为 Claude
              推出法律插件后，公开上市法律软件公司股价下跌；Microsoft Copilot 也在对标工作流厂商。Harvey 的战略是通过深度嵌入、覆盖 60 个国家 1,300
              家组织的定制智能体，成为法律工作的操作系统；这与 Legora 的定位相互映照，也说明该市场存在赢家通吃大部分的真实风险。Harvey 更高的 ARR（$190M vs Legora 的
              $100M）和更高估值（$11B vs $5.6B），提供了一个 Legora 必须跑赢才足以支撑当前倍数的基准。
