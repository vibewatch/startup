              - CR048
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格敏感型建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资问题不是 Legora 是否真实，而是新投资人还能否从最新公开估值中赚到有吸引力的回报。正向案例很扎实。官方和独立来源一致显示，Legora 到 2026 年 4 月初已超过 $100 million
              ARR，客户组织超过 1,000 家、覆盖 50 多个市场，员工数从约 40 人扩至 400 人，并且在完成 $550 million Series D 仅数周后，仍找到 $50 million
              延伸轮需求。Harvey 对比同样重要：市场显然愿意为品类领先的法律 AI 平台支付稀缺性溢价，前提是它们看起来像工作流基础设施，而不是单任务
              copilot。反向逻辑是，当前价格已经把这套叙事的大部分资本化。按披露 ARR 约 56x 计算，Legora 定价几乎与 Harvey
              完全一致，并远高于本文审阅的所有公开法律或工作流软件可比公司；同时它仍未披露 NRR、毛利率、CAC、烧钱速度、现金和优先股堆叠条款。这种组合支持「观察」而不是「买入」：公司强、入口贵，且过度依赖未披露的私有
              KPI。
