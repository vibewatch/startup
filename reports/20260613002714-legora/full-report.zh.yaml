      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Legora 自己的架构语言足够具体，能支撑一个可信的运营模型判断。aOS
              页面把产品界面、法律专用智能体能力、上下文和知识、数据与集成，以及负责工具路由、控制流、记忆管理、模型选择和护栏的智能体执行框架分开。Workflows
              页面让这一点具体化：律师可以用自然语言给系统一个目标，上传源文档，再让平台创建计划、调用工具、执行结构化审阅、拉取带引用的法律研究，并起草交付物。因此，公司把平台定位为覆盖多种工具和数据源的控制层，而不是单模型
              UI。


              Microsoft 和 MCP 证据进一步强化了这幅图。Microsoft marketplace 列表把 Legora 放进 Word、Outlook 和 SharePoint，并称工作区运行在 Azure
              上。MCP 文章称，Legora 可以连接 MCP servers，从已连接系统检索文件，在 Legora 内处理，再返回更新版本；基础 MCP 规范解释了这一点为何重要：它是把 AI
              应用连接到工具、数据和工作流的通用接口。由此形成的公开架构图，优势清晰——以文档为中心的编排、多用户界面、与企业系统集成——但也有一个真实尽调约束：仍没有公开的客户侧 API
              或实施文档，能展示权限、文件传输和连接器部署在生产环境中究竟如何运作。
