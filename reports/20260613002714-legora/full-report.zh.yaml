      - number: '6.3'
        title: 留存、重复使用与满意度信号
        blocks:
          - type: paragraph
            body: >
              公开的耐久性证据存在，但不均衡，离投资人核保续约模型所需还差很远。最好的重复使用证据来自具体客户：BAHR 称约 80% 员工是活跃用户，最多 30% 每天使用 Legora 超过十次；Trowers &
              Hamlins 称 97% 试点参与者每周使用平台，88% 认为质量良好或优秀，87% 认为易用或非常易用。Mishcon de Reya
              试点后的推广又提供了定性确认：律师在合同审阅、起草、总结和研究工作流中反复使用产品。


              缺的是商业耐久性的桥。审阅到的公开来源没有披露 NRR、GRR、流失、续约率、队列留存、合同期限、按批次的席位扩张，或头部账户收入集中度。独立评论也带来真实警示：GC AI 和 Comparateur
              都强调只在演示后报价、采购不透明；Irys 则认为律师采用产品处理特权工作前，应追问第三方 API
              路由、数据托管影响和供应商成熟度。结果是，本章能支撑强采用和有意义的工作流价值，但还不足以完整核保留存质量或客户经济性。
