  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与职业义务风险是首要核保问题
        blocks:
          - type: paragraph
            body: >-
              Legora 所处的 AI 部署场景几乎最不容错：法律工作同时涉及客户保密文件、受监管数据传输，以及能力与诚实披露的职业义务。欧盟 AI Act 已不再是遥远抽象概念；其一般适用日期是 2026 年 8
              月，而禁止性做法规则和通用 AI 义务更早已开始生效。这个时间点很关键，因为 Legora 现在营销的是智能体工作流，而不只是起草辅助。与此同时，官方隐私和律师协会指引也指向同一方向：处理法律工作的 AI
              系统需要持续治理、DPIA、透明度、保密控制和有记录的人类监督；EDPB 也已把 AI 模型数据保护问题提升为正式委员会意见。Legora 公开的 DPA
              和安全材料强于最低要求，并提供真实合同抓手，包括审计权、泄露通知和子处理方异议。但当前公开记录仍未给出产品级合规证明、监管沟通记录，或第三方关于这些控制如何在真实智能体工作流中运作的摘要。因此，监管 /
              法律风险不是公开执法已经发生；而是公司进入高风险使用场景的速度，快过公开证据能独立验证其治理能力的速度。
