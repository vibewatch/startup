        - Tabular Review Editor、Word Add-in、Word Edits 文章
        - Microsoft 文档格式和文档质量差异
        - 输出质量取决于来源干净程度和工作流设计，但缺少公开基准
      - - 知识与内容层
        - Legal Research 结合内部数据库、开放网络和可信法律内容合作方
        - Legal Research 页面和合作方引用
        - 合作方内容权利、更新节奏和司法辖区完整性
        - 外部读者很难核验覆盖缺口或特定合作方内容新鲜度
      - - 集成层
