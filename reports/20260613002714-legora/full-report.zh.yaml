      - number: '4.2'
        title: GTM 动作、销售效率代理指标与成本结构形态
        blocks:
          - type: paragraph
            body: >-
              公开证据指向高接触企业 GTM 模型，而非产品驱动采用。官方 Series D 表述强调与客户并肩上线、深度嵌入工作流，并在关键市场提供客户支持；公司同时开设 Houston 和
              Chicago，扩充美国团队，并计划到 2026 年底拥有 300+ 名美国员工。Datasite 集成和 Qura/Cadastral 收购强化了这一判断：Legora
              试图成为高价值法律工作流内部的基础设施，而不是按自助方式销售的研究聊天机器人。这通常意味着销售周期更长、实施和客户成功费用更重，即使收入按软件确认，也可能带有服务型交付成本。


              因此，最佳公开效率代理指标是行为层面的，而不是会计层面的。Legora 称，受访律所每名律师每周节省 4.3 个非计费小时，且 42% 因平台赢得新业务。这些是企业买方有用的 ROI 指标，但不能替代
              CAC、回本周期或净留存。成本结构证据同样间接：一年内员工从 40 人到 400 人、4 月已有九个全球办公室、2026
              年新增美国办公室，以及持续的产品和基础设施投资，都意味着可观烧钱水平。由于毛利率、支持负担、云成本、实施强度和获客经济性仍未公开，正确尽调姿态是，在管理层证明相反事实前，把 Legora
              视为一家带有重大服务和扩张开销的软件业务。
