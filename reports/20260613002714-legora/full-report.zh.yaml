      - CR048
      - CR050
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 信心
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 中
        - 如果没有更好的私有 KPI 披露或更便宜的入场价，不要追最新估值。
      - - 风险评级
        - 高
        - 中
        - 执行失误和估值倍数压缩都会迅速伤害后期回报。
      - - 估值立场
        - 昂贵
        - 高
        - 约 56x ARR 的价格已经假设了类似 Harvey 的稀缺性和持久性。
      - - 回报门槛
        - 2x 需要 >$11.2B；3x 需要 >$16.8B（稀释前）
        - 高
        - 新投资人要拿到标准风险投资回报，公司必须先大幅放大规模。
      - - 持有 / 退出姿态
        - 可能多年持有；公开披露质量不支持近期 IPO
        - 中
        - 应把它按私人市场复利故事承保，而不是快速上市退出。
      - - 上调触发因素
        - 披露 NRR、毛利率、烧钱速度和优先股堆叠，或给出接近 25x-35x 远期 ARR 的入场价
        - 中
        - 这些数据会显著提高对当前价格承保的信心。
    notes: 评估只反映截至 2026-06-13 的公开证据，不包含任何保密 KPI、客户队列或股权结构材料。
