      - number: '8.2'
        title: 当前估值对比私募溢价与公开可比公司
        blocks:
          - type: paragraph
            body: >-
              最干净的估值框架很简单。Legora 以 $100 million-plus ARR 对应 $5.6 billion 投后估值，意味着约 56x ARR。Harvey 2026 年 3 月融资也在同一区间，以
              $11 billion 估值和 $190 million ARR 计约 58x ARR，说明私募市场正为最顶级法律 AI 名字支付高倍数。公开市场宽容度低得多。相邻的法律和专业软件公司收入倍数显著更低：用
              2026 年 6 月市值和收入数据计算，DocuSign 约 2.7x，Intapp 3.4x，CS Disco 1.5x，Thomson Reuters 4.6x，RELX
              5.0x。因此可比组传递的信息是，Legora 不只是高于公开可比公司，而是比公开区间高端还高出一个数量级以上。这不意味着本轮不理性，因为 Legora
              增长远快于成熟公开同行；但也意味着，当前价格支撑取决于公司能否维持 Harvey 式稀缺性，并证明强得多的经济性，而这些都还未在公开记录中可见。
