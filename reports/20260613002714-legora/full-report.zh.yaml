  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户、付款方、地域和客户类型划分
        blocks:
          - type: paragraph
            body: >
              Legora 的公开客户组合，在法律市场高端比长尾更清楚。官方客户页和上线公告显示三类反复出现的付款方模式：大型律所为全所或跨办公室律师群体采购；Erste Group
              这类受监管企业为集中法律组织采购；Deloitte 这类专业服务伙伴内部使用平台，同时帮助客户实施。终端用户通常是律师、法律运营人员或创新团队；赞助方则是管理合伙人、CIO、法律创新负责人或集中采购负责人。


              地理上，客户证据广且越来越全球化。官方客户页覆盖北欧、英国、欧洲大陆和大型全球网络的律所；另有 APAC
              和欧洲扩张新闻，明确把新办公室与新加坡、东京、西班牙、意大利和法国客户的既有需求相连。主要限制在于，公开分层按企业画像和地域很充分，按收入带或合同结构却弱得多。Legora
              没有公开拆分律所、企业法务团队、金融机构和实施伙伴之间的客户数，因此最稳妥的读法是：客户账本已明显具备顶级和国际化特征，但组合与变现仍不透明。
