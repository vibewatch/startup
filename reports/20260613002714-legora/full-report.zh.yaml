      - number: '2.2'
        title: 买方格局与采用路径
        blocks:
          - type: paragraph
            body: >-
              法律 AI 有两个结构上不同的买方群体：律所（外部法律顾问）和企业内部法务部门。在律所中，买方通常是管理合伙人或首席运营官，但用户是做研究和起草工作的律师助理、律师或资深律师。付款方是律所 IT
              或法律科技预算；这笔预算越来越多由合伙人层面逐项批准，而不是作为 IT 开销处理。律所采购周期很长——大型 Magic Circle 和 AmLaw 100
              律所通常会跑数月试点，并在签署企业协议前要求安全和数据处理认证。中型律所往往通过一名倡导型合伙人或创新委员会更快采用。


              企业内部法务团队购买动因不同。公司法务部门承受董事会层面压力，需要在控制人员增长的同时吸收更多监管和合同工作量。Legora 2026 年 4
              月延伸轮发布明确称，企业法务部门已经成为公司增长最快的细分市场之一，并列举 Barclays 为代表客户。TR 2026 报告确认，62% 的法律专业人士认为 AI 应用于自己的工作，但只有 15% 的组织在衡量
              AI ROI——这表明预算负责人更多基于战略理由批准支出，而不是基于已验证的单位经济证据。


              两类客户的采用路径呈现一致模式：单一拥护者（合伙人、总法律顾问或法律科技负责人）先非正式采用，在一个工作流中证明价值（TR 2026 报告显示最常见是研究，占 80% 律所），再推动全所或全部门采购。Harvey
              博客提到，其平台上已有 25,000+ 个定制智能体运行，代表采用正在从任务级走向工作流级；Legora 通过智能体操作系统定位，也瞄准同一模式。Wolters Kluwer 合作（美国成文法和监管内容）与
              Datasite 集成（虚拟数据室文档分析）都旨在让 Legora 更深嵌入律所工作流，降低部署后的切换成本，从而加深采用漏斗。
