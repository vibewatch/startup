  - id: TV005
    title: 论点失效与退出触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 降估融资
        - 下一轮任何主融资低于当前 $5.6B 投后标记
        - 说明后续投资人不再承销 Harvey 式溢价经济性。
        - 暂停出资，参与前重新承销股权结构。
      - - 增长放缓
        - 下一次披露的 ARR 里程碑指向低于 60% 的年化增长，或到 2027 年中 ARR 仍低于约 $150M
        - 削弱其维持高于上市可比公司溢价倍数的核心理由。
        - 下调为继续研究 / 避免，等待估值重置。
      - - 经济性不及预期
        - 管理层披露毛利率低于 70%，或 NRR 低于 110%
        - 冲掉支撑当前倍数所需的软件质量耐久性。
        - 要求入场估值大幅降低，否则不投。
      - - 跑道承压
        - 现金跑道低于 18 个月，且没有明确已融资计划
        - 谈判筹码变弱时，稀释性融资概率上升。
        - 立即要求现金瀑布、融资计划和优先权栈分析。
      - - 工作流货币化落空
        - 企业法务或伙伴驱动扩张，未转化为有意义的净扩张或 ACV 提升
        - 打破“工作流宽度应享结构性溢价”的论点。
        - 按单点解决方案厂商看待，估值重定价到上市可比公司附近。
      - - 品类情绪重置
        - 另一家融资充足的法律 AI 同行虽有真实收入，却出现融资压力或被迫出售
        - 说明资本市场收紧时，后期品类倍数很脆弱。
        - 提高折现率，假设倍数更快压缩，并重审下行情景。
    notes: 上述阈值是公开市场监控规则，不是公司指引；私有 KPI 披露可能大幅收紧或放松阈值。
    claimRefs:
      - CV021
      - CV023
      - CV033
      - CV035
      - CV041
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构与优先权
        - Series D 后股权结构表、股份类别、清算优先权、反稀释条款，以及任何偏向内部人或战略方的结构。
        - 后期回报质量取决于横盘或小幅上行情形下谁先拿钱。
        - 任何条款清单工作前，在 NDA 下向 CFO / 领投方索取。
      - - 留存与毛利率
        - NRR、毛利率、服务负担，以及律所与企业法务分部的队列表现。
        - 核心变量决定 Legora 是否配得上软件式溢价倍数。
        - 索取经审计 KPI 包和队列表。
      - - CAC、回本与销售效率
        - CAC、回本周期、销售周期长度，以及扩张对新增 ARR 的贡献。
        - 入场价格高时，如果获客效率不足，强增长仍可能带来很差的投资人回报。
        - 索取董事会材料或 GTM KPI 看板。
      - - 现金消耗与跑道
        - 当前现金余额、月度净烧钱、招聘计划，以及管理层设定的最低跑道阈值。
        - 这个价格下的高增长公司，如果烧钱超过市场胃口，仍可能被迫接受痛苦的下一轮。
        - 索取财务模型和最新管理账。
      - - 企业法务与伙伴组合
        - 企业法务部署的收入占比、客户标识组合、ACV 和留存，以及 Datasite 等伙伴来源工作流。
        - 工作流宽度究竟是真货币化，还是叙事包装，这一项最能检验。
        - 索取分部桥接表和伙伴影响管线分析。
      - - 退出与流动性准备
        - 下一轮、二级流动性、IPO 准备，以及战略兴趣图谱的内部规划。
        - 如果披露质量继续偏薄，中期退出路径比抽象的长期 TAM 更重要。
        - 询问管理层和领投方，如何从这里兑现 2x-3x 结果。
    notes: 事项按其改变入场价格决策的直接程度排序；前四项实质上会卡住高确信买入案例。
    claimRefs:
      - CV025
      - CV026
      - CV028
      - CV040
      - CV043
      - CV045
      - CV048
