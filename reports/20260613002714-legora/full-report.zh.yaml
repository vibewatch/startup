        - 面向企业买家的基线安全管理信号
        - 公开材料不包含可下载证书文件
      - - SOC 2 Type 2
        - 信任页面声称
        - 跨系统安全合规地管理数据
        - 对买方安全审查很重要，尤其是美国企业采购
        - 未审阅到公开报告摘录或控制范围摘要
      - - 不用客户数据训练模型
        - 信任页面声称
        - 客户数据仍由客户私有
        - 降低特权材料微调共享基础模型的担忧
        - 每条模型 / 提供商路径都需要合同层面确认
      - - 访问与认证控制
        - Security 和安全措施页面有描述
        - 零信任、最小权限、MFA、SAML SSO、bcrypt、日志
        - 支撑敏感法律工作流中的保密性和可追溯性
        - 公开证据没有展示实际管理员策略默认值或租户配置选项
      - - 恢复与韧性控制
        - 安全措施中有描述
        - 每 4 小时备份、Azure 复制、年度渗透测试、12 个月日志留存
        - 提供最低连续性和取证信号
        - 仍无公开 uptime 目标、RTO/RPO 披露或事故历史
      - - 隐私与处理义务
        - DPA 和分包处理方名单中有描述
        - 书面指示、审计协作、30 天异议窗口、36 小时违约通知
        - 展示面向企业客户的成熟处理方姿态
        - 公开读者仍无法查看谈判例外或附件层面的客户差异
      - - 分包处理方与区域部署治理
        - 分包处理方名单和支持国家页面点名
        - Microsoft、AWS、Google、OpenAI、Intercom、Linkup、DeepL、Exa，加上广泛国家支持
        - 对数据驻留、搜索 / 模型依赖和客户审批流程很重要
        - 尽调中需要客户特定的区域映射和精确数据路径图
    notes: 对一家私营法律 AI 供应商来说，公开信任材料细节异常充分，但几项重要验证材料仍未公开。
