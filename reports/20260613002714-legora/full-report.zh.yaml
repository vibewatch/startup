  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与规模测算
        blocks:
          - type: paragraph
            body: >-
              全球法律 AI 市场覆盖把机器学习和大语言模型技术应用到法律工作流的软件和服务，核心是研究、文档审阅、合同分析、起草和合规。三家在 2026 年发布估算的分析机构，把市场规模放在 $4.7B（MarkWide
              Research，口径较窄）到 $5.59B（Business Research Company）之间。Research and Markets 把 2025 年基线锚在 $4.59B；按一年 22.3%
              增长推算，2026 年数字与 BRC 估计一致。这些估算差异部分来自定义分歧：宽口径包括电子发现处理、合同生命周期管理（CLM）平台和法律分析工具；窄口径则限制在类似 Legora 所售的 AI
              原生工作流软件。投资者应保留三种估算，而不是取平均，因为每一种都对应不同的可服务市场。


              风险定价给出的代理信号也有信息量。Legora 在 2026 年 4 月延伸轮后的 $5.6B 投后估值，是在披露 $100M ARR 的基础上定价，意味着投资者按 56× ARR
              给公司估值。若更保守地假设工作流 AI 平台仅实现 10–15× SAM 渗透，则仅该类平台当前隐含可服务市场（SAM）约为 $1–1.5B，并到 2030 年向 $5B+
              扩张。美国市场在结构上占主导：Legora CEO Max Junestrand 公开称，美国法律支出约为欧洲的九倍，这解释了公司为何在总部仍位于 Stockholm 的同时，在
              Houston、Chicago、New York 和 Denver 开设办公室。按 BRC，North America 是 2025 年最大的法律 AI 区域，Asia-Pacific 则是增长最快区域。对
              Legora 而言，这一区域层级意味着美国销售生产率是近期最重要的需求信号。


              法律 AI
              替代的现状方案包括人工研究时间（初级律师和律师助理）、静态法律数据库订阅（LexisNexis、Westlaw），以及尽调和诉讼中的手工文档审阅。律所为这些劳动密集且高成本活动付出很高代价，因此即使采用率温和，AI
              平台的 ROI 叙事也很强。Legora 自己的 2026 年 4 月发布称，在受访律所中，每名律师每周平均节省 4.3 个非计费小时；42% 的律所表示，使用平台直接帮助其赢得新业务。
