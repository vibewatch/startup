      - - Outlook Add-in + Email the Assistant（邮件助手）
        - 分拣邮件线程和附件的律师
        - 2026 年新发布，似乎是对核心桌面工作流的增量补充
        - 把摘要、起草和文件回存带入收件箱工作流
