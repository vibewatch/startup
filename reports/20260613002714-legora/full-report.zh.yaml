        - 要求管理层履历、任期、继任覆盖，以及 COO / CTO / CISO 同等岗位的推荐访谈。
      - - 估值压力下的资本纪律
        - $5.55B-$5.6B 估值、$600M 轮次和快速美国 / EMEA 扩张，会提高增长放缓或过度建设的代价。
        - '3'
        - '5'
        - 大额融资给投资争取时间，但也把完美执行的门槛抬高。
        - 要求招聘产出、烧钱路径、续约证据，以及增长回归正常后的下行情景计划。
    notes: 人才风险登记表纳入了最关键的财务模型执行压力，因为公开记录对增长雄心的证明强于对运营体系深度的证明。
