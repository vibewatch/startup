      - number: '5.4'
        title: 差异化、成熟度与路线图方向
        blocks:
          - type: paragraph
            body: >-
              Legora 最清晰的产品差异化，不是某个孤立的模型技巧，而是把带引用的法律研究、结构化多文档审阅、工作流编排，以及 Microsoft 原生的起草和收件箱界面放进同一个系统。外部评论中，Tabular
              Review 仍是最稳定的差异化模块，包括负面的 GC AI 评测也承认这一点；它能把大规模法律文件集转成结构化、带来源链接的表格，再接到起草或报告环节。Workflows
              进一步抬高了目标，把研究、抽取、起草和律所特定标准串成一次运行。Portal、Lists 和 Monitors 又把差异化从律师个人效率扩展到客户交付、法律项目结构和监管监测；这比单纯的助手 SKU
              更接近一套运营模型。


              但路线图和成熟度仍不均衡。对快速扩张的平台来说这很正常，却仍值得仔细核保。2026 年的发布节奏指向当前创新主线：编排式工作流、监管监测、移动端、收件箱集成和批量 Word 编辑。Lists
              明确只是第一版，移动端刻意比桌面端更窄，Workflows 仍在宣传未来功能，包括深度研究、记忆、实时引用、VDR
              触发器和外部数据抓取。公司能持续把东西推出来，这当然积极；但买方不应假设每个宣传中的界面都同样成熟。正确的尽调问题不是路线图是否活跃——显然活跃——而是哪些模块已经能在客户具体工作流里规模化进生产，哪些仍处在较早的采用曲线上。
