      - number: '3.3'
        title: 合同生命周期管理与相邻 CLM 玩家
        blocks:
          - type: paragraph
            body: >-
              合同生命周期管理（CLM）是一条相邻赛道，与 Legora 的文档审阅和表格化审阅能力有重叠，但买方角色和用例并不相同。领先的独立 CLM 厂商 Ironclad 已在 2,000+ 个客户中处理超过 2
              billion 份合同，并提供三款差异化 AI 产品：Ironclad Assistant（面向法律运营和采购的自然语言查询）、Ironclad Agents（多步骤合同流程的工作流自动化），以及
              Jurist（为处理高风险起草、红线修改和风险分析的商业律师打造的专用 AI）。Jurist 的起草和风险标记能力与 Legora 的文档对比和审阅功能直接重叠，但 Ironclad 的强项是来自 2
              billion 份已处理合同的数据优势——它能基于历史交易数据浮现谈判立场，这一点 Legora 尚无法复制。Ironclad 执行零数据留存，并将客户数据排除在 AI
              训练之外；这一治理立场也被其主动营销给企业买方。


              DocuSign CLM 处在同一赛道，但企业分销显著更强。DocuSign 连续六年被 Gartner Magic Quadrant for CLM 评为领导者，并服务 2,200 家企业客户。DocuSign
              声称 ROI 为 449%，生成新合同所需时间减少 90%，错误减少 85%。这些数字由公司自行披露，应视为方向性信号。DocuSign
              的核心强项是通过既有电子签名客户和深度采购系统集成分销（Salesforce、Slack 和 100+ 个预配置工作流步骤）。这意味着，多数考虑 CLM 的大型企业，采购对话中已经有
              DocuSign；在合同密集型工作流中，这给包括 Legora 在内的新进入者制造了显著分销优势差距。Legora 目前并不把自己定位为
              CLM；其文档审阅工具服务于法律工作流中的律师，而不是法律运营和采购团队，因此重叠真实存在，但只是部分重叠，并取决于买方语境。
