      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 核心风险是在高风险法律工作流中失去信任
            body: Legora 最大的下行不是普通 SaaS 流失，而是在特权法律工作中，因输出不准确、监督薄弱或不安全而失去信任。产品逻辑已经从点工具转向智能体操作系统，一个可见失败就可能同时传导到采购、续约、支持成本和估值。
            calloutType: risk
            claimRefs:
              - CR018
              - CR020
              - CR046
              - CR047
          - type: callout
            title: 公开缓释措施有意义，但仍主要是自述
            body: 公司发布了 DPA、安全措施、子处理方清单，以及不使用客户数据训练模型的明确声明，比许多同业走得更远。这改善了尽调起点，但投资人仍需要第三方材料和 Legora 专属错误率证据，才可把运营风险视为受控。
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR050
          - type: callout
            title: 把依赖风险按产品质量问题核保，而不是采购脚注
            body: 外部模型、搜索工具、法律内容授权方和 VDR 伙伴，对 Legora 来说不是后台供应商；它们位于决定答案质量、权限和客户信任的产品路径上。任何投资案例都应要求这套栈的备用方案和变更管理权。
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR015
              - CR041
