      - number: '4.3'
        title: 资本历史、充足性，以及公开文件仍无法回答的问题
        blocks:
          - type: paragraph
            body: >-
              Legora 的融资阶梯异常可见，尽管财务报表不可见。证据最充分的顺序是：2025 年 5 月以 $675M 估值完成 $80M Series B；2025 年 10 月以 $1.8B 估值完成 $150M
              Series C；2026 年 3 月以 $5.55B 估值完成 $550M Series D；2026 年 4 月再追加 $50M 延伸轮，使该轮达到 $600M，投后估值
              $5.6B。仅汇总这些公开披露轮次，已知股权资本就超过 $780M。在披露的 $100M ARR 基础上，2026 年 3–4 月估值约为 55x 至 56x
              ARR，是一个激进倍数，假设公司能持续超高速增长并最终拿出强利润率。


              不过，融资故事只解决了资本充足性问题的一部分。管理层已清晰说明资金主要用途：美国扩张、本地招聘，以及持续产品和基础设施投资；Atlassian、NVentures 和 Salesforce Ventures
              等战略投资者也强化了平台叙事。仍不可得的是账上现金、月度烧钱速度、现金跑道、债务或任何类债务义务。来源包中唯一真正的登记文件来自英国 LEGORA LTD 的 Companies House，显示公司成立和 £1
              股本声明，但没有提交账目。因此，登记文件提供的是法人确认和时间背景，而不是对运营集团损益表或资产负债表的审计支持。
