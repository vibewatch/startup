      - number: '4.4'
        title: 财务结论、同业基准与承销阻碍
        blocks:
          - type: paragraph
            body: >-
              Legora 的公开财务案例强于许多私营软件公司，因为公司披露了头部 ARR 和详细融资曲线，独立媒体也大体交叉印证了两者。不过，Harvey 基准让预期维持在高位：Harvey 2026 年 3 月报告以
              $11B 估值完成 $200M 融资，覆盖 1,300 家组织的 100,000+ 名律师；Forbes 称其到 2025 年末达到 $190M ARR。TechCrunch 还补充称，Dealroom 认为
              Harvey 和 Legora 处在几乎相同的收入轨迹上，意味着市场会拿 Legora 与增长最快的法律 AI 同业比较，而不是与通用垂直 SaaS 平均水平比较。


              主要反向教训是，快速叙事增长并不能消除执行风险。Robin AI 在 2025 年末裁员、融资失败并进入困境出售流程，说明法律 AI 公司在增长低于期待超额结果的投资者预期时，仍可能撞墙。对 Legora
              而言，乐观情景是真实经常性需求加深厚投资者支持；谨慎点在于，55x+ ARR 倍数、快速招聘和扩大的工作流范围，让利润率不达预期的空间很小。核心阻碍仍相同：没有披露定价实现，没有毛利率或留存数据，没有
              CAC/回本周期证据，没有现金或跑道可见度，也没有主要运营业务的审计文件。在这些材料提供前，正确结论是：收入质量有前景，但耐久性、利润率路径和自筹资金能力的证明仍不完整。
