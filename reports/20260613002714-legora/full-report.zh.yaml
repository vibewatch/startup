  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Legora 的公开产品故事已经从单一法律聊天机器人，走向一个连接式法律工作平台。aOS 页面描述的是法律工作的操作系统；产品页和发布文章显示，套件现在包括 Agent、Workflows、Tabular
              Review、Legal Research、Editor、Portal、Word Add-in、Outlook Add-in、Lists、Monitors
              和移动应用。共同的工作流线索是：律师从文档、邮件或高层事项目标开始，在同一工作区内完成分析、起草、协作和交付。这一点重要，因为 Legora
              不是在销售一次孤立模型交互；它销售的是面向律所和企业法务团队的工作流技术栈，把有来源支撑的输出、机构 playbook 和协作控制放进一个环境。


              模块地图对角色适配和成熟度也异常明确。Agent 和 Workflows 位于编排核心；Tabular Review 和 Legal Research 处理结构化抽取和带引用分析；Editor 与 Word
              Add-in 覆盖不同起草时点；Outlook 和移动端把系统延伸到收件箱和移动场景；Portal、Lists 与 Monitors
              则把平台扩至客户交付、事项管理和监管前沿扫描。证据支持产品面正在扩张，而不是静态 SKU 列表；但最稳妥的尽调解读仍是，部分模块比其他模块更新。Lists
              被明确称为第一版迭代，移动端明确比桌面端更窄，Monitors 的运营主张仍是公司自述，而非独立基准验证。
