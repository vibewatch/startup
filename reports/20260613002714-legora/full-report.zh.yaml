      - number: '5.5'
        title: 信任、安全、安保、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              信任与合规是 Legora 销售产品的核心。安全页面声称公司具备 ISO 42001、ISO 27001 和 SOC 2 Type
              2，客户数据不会用于训练基础模型，并强调零信任设计、客户批准的支持访问、BYOK、SSO、数据治理工具和可审计性。安全措施和 DPA 文件把这些说法落得更具体：最小权限访问、bcrypt 密码哈希、基于 SAML
              的 SSO、静态 AES-256 加密、传输中 TLS 1.2+、逻辑隔离的订阅者环境、年度渗透测试，以及 36 小时泄露通知。aOS
              页面又补充了职业隔离墙、跨事项隔离，以及工具调用和文件访问审计轨迹，贴合大型法律事项的保密需求。


              隐私和监管图景总体正面，但仅靠公开材料还无法完全外部验证。DPA 和子处理方清单显示，Legora
              已建立较成熟的法律框架，覆盖处理方义务、子处理方治理、跨境传输和客户异议权。支持国家页面和合作伙伴内容也支撑其全球 GTM。与此同时，公开读者仍看不到证书范围、例外历史，或关于 Monitors
              精准度和覆盖质量的独立证据。欧盟 AI Act 背景让这些问题更重要，而不是更次要；一家主打可信、人本、来源有据自动化的法律 AI
              平台，之后会越来越多地按运营证据接受评判，而不只是看政策表述。尽调层面，Legora 的信任姿态在公开文件深度上高于平均水平，但若干最关键验证仍藏在私有审计包之后。
