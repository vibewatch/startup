    rows:
      - - AI Act、GDPR 和法律伦理合规随着智能体工作流扩张而漂移
        - AI Act 的阶段性要求已在 2026 年 8 月全面生效前启动；ICO、NYC Bar 和 California Bar 都要求法律 AI 具备治理、透明度、保密性和人工监督。
        - EU、UK、美国法律行业
        - '4'
        - '5'
        - Legora 宣传 ISO 42001 治理、法律来源伙伴关系、DPA 条款和人工在环定位。
        - 在客户证明产品级 DPIA、部署控制和律师监督规则之前，风险仍高。
        - 要求提供逐产品合规矩阵、DPIA、客户角色映射，以及外部律师关于 AI Act / GDPR 适用性的备忘录。
      - - 提示词、集成或自主动作泄露特权信息或保密信息
        - 律师协会指引警告，缺少保护措施不得共享机密数据；Legora 的 DPA 和安全页面展示了控制措施，但也承认客户涉及敏感监管行业。
        - 跨境法律工作流
        - '3'
        - '5'
        - 不用客户数据训练、支持访问需书面批准、BYOK、SSO、留存控制和审计权。
        - 法律事项涉及特权、受监管且往往跨境的数据，因此风险高。
        - 要求架构走查、日志边界、红队结果，以及客户访问批准流程样本。
      - - 幻觉或伪造权威依据引发执业过失、制裁或客户信任受损
        - Stanford、NYC Bar、NYSBA 和 Thomson Reuters 都记录了法律实践中持续存在的幻觉和制裁。
        - 法院、律所、企业法务团队
        - '4'
        - '5'
        - Legora 强调权威来源、引用和法律内容伙伴关系。
        - 产品明确承诺端到端法律工作，而律师仍要为错误输出负责，因此风险高。
        - 要求 Legora 专属准确率基准、人工审阅关卡，以及针对虚假引用或错误推理的客户升级日志。
      - - 子处理方或传输地图变化触发采购延迟或法律挑战
        - Legora 给予客户反对新增子处理方的权利，并在 EU 和美国触点使用多个 AI、云、搜索和翻译供应商。
