        - 目前已普遍可用，但覆盖质量仍只是公司主张
        - 定时扫描官方来源，在同一平台内分派分拣任务并留下审计轨迹
        - 需要验证来源覆盖、误报率和企业告警工作流
      - - Mobile App
        - 移动中的 partner 和资深律师
        - 现已可用，刻意比桌面端更窄
        - 在设备间同步 assistant 历史、文件访问和带引用摘要
        - 需要看到 MDM 控制、离线行为，以及轻度使用场景之外的采用情况
