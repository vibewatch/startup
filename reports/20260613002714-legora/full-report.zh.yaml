        - 每一次重大供应商变更都可能重新打开企业尽调，因此风险中高。
        - 要求按季度披露子处理方变更历史、传输评估，以及关键供应商的合同兜底方案。
    notes: 该登记表按公开证据视角排序严重性；它不能替代受保密特权保护的法律分析，只反映截至 2026-06-13 或此前可获得的证据。
