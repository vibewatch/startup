      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人叙事是本章公开歧义最明显的部分之一。Legora 官方新闻中心称公司创立于 2020 年，并列出 Max Junestrand 和 Sigge Labor 为联合创始人。相较之下，Forbes、Craft
              和一篇历史 PitchBook 文章把 Legora 描述为 2023 年创立。最合理的调和方式是：2020 年对应更早品牌和产品迭代下的起点，2023
              年对应较晚的公司或品牌形成里程碑，被部分第三方数据库收录。正确的尽调姿态是保留这一冲突，而不是强行给出虚假的精确性。


              领导层披露最集中在 CEO Max Junestrand 身上。官方发布反复引用他对融资、地域扩张和产品方向的表述；Y Combinator 创始人页面补充了他在 YC
              初创公司、McKinsey、风险投资、Ericsson 和 Abios 的经历，以及 KTH 和 SSE 的机器学习与商业学位。其他高管的公开信息明显更薄。官方材料明确列出 Sigge Labor
              为联合创始人，但在本轮审阅来源中，当前公开董事会名单、委员会结构和控制权摘要均不可得。因此，即使公司的运营叙事异常连贯，关键人依赖仍高，治理尽调也未完成。
