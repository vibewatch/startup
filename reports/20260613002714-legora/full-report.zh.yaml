        - MCP 文章、Microsoft marketplace、Tabular Review 页面
        - 客户系统质量和连接器配置
        - 没有公开的 Legora 专用 API 或 SDK 文档可看实现细节
      - - 身份与授权
        - SSO、RBAC、零信任、道德隔离墙和审计轨迹管控访问
        - Security 页面、aOS 页面、安全措施、Zanzibar 论文
        - 客户租户内的身份提供商设置和策略卫生
        - 公开证据没有展示访问设计的策略模板、管理员 UX 或外部审计材料
      - - 基础设施与恢复
        - 基于 Azure 的托管、加密数据、MFA、备份、复制、日志和渗透测试支撑平台运行
        - Security 页面、安全措施、Microsoft 客户案例
