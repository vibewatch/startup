      - 具名证据
      - 关键依赖
      - 主要风险
    rows:
      - - 用户触点
        - Web 应用、桌面端上下文、移动端、Word、Outlook 和 Portal，是律师或客户与系统交互的入口
        - aOS、移动端、Word、Outlook 和 Portal 页面
        - Microsoft 365 分发，以及跨触点一致的权限控制
        - 功能成熟度随触点而变；移动端明确比桌面端窄
      - - 智能体式编排层
