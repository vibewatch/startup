      - number: '7.3'
        title: 依赖风险就在产品内部，而不是产品外部
        blocks:
          - type: paragraph
            body: >-
              Legora 最强的商业卖点——权威法律研究和直接嵌入法律工作流的 AI——也制造了一张密集依赖图。公开材料显示，其技术栈包含多个云和模型供应商、搜索提供商、翻译提供商、法律内容来源，以及 Datasite
              这类工作流控制伙伴。这些不是泛泛的供应商关系。它们影响系统能否检索最新法律、保留权限、理解文件，并让客户采购团队接受架构。法律研究产品公开混合内部数据库、授权法律内容和开放网络，这意味着来源管理和伙伴新鲜度是永久运营纪律，而不是一次性设置任务。Qura
              和 Wolters Kluwer 帮助补内容缺口，但也确认护城河仍在逐个市场拼装和授权。Datasite 同样通过避免手工导出改善工作流安全，却把信任集中到权限传递和 API
              完整性上。对受监管客户而言，这个技术栈的每一次重大变化都可能重新触发隐私、采购和法律审查，尤其因为 DPA 明确给予客户反对新子处理方的权利。
