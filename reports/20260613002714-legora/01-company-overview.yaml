- id: capital-trajectory-and-scale
  title: Capital trajectory and public scale signals
  body: 'Legora’s 2025-2026 financing curve is the strongest external validation signal in the file. The March 2026 company release, TechCrunch, and CNBC all align on a $550 million Series D at a $5.55 billion valuation led by Accel, with Benchmark, Bessemer, General Catalyst, ICONIQ, Redpoint, and Y Combinator among returning backers. One month later, the company, CNBC, and Legal IT Insider all reported a $50 million extension that brought the total round to $600 million and the post-money valuation to $5.6 billion, while adding Atlassian and NVentures.


    Scale signals also stepped up quickly over the same period. The April 2026 ARR announcement said Legora crossed $100 million annual recurring revenue less than 18 months after general availability and had more than 1,000 customers across 50 markets. June 2026 newsroom updates pushed the operating picture further to more than 100,000 legal professionals, more than 1,200 law firms and in-house teams, and 16 cities across four continents. Some third-party pages remain well behind this pace, which is itself a diligence signal: investors should trust fresher primary releases over lagging directories but still ask management for a dated operating KPI pack and current cap-table summary.'
