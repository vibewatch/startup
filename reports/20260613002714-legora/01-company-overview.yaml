callouts:
- calloutType: strength
  title: Legora has already crossed the threshold from feature vendor to workflow platform narrative
  body: The strongest positive signal is not just the size of the 2026 financing but the consistency between product, partnership, and content-integration moves. Datasite, Wolters Kluwer, Qura, and Cadastral all extend the company beyond a drafting assistant toward a system that sits on top of legal documents, data rooms, and trusted legal content.
  claimRefs:
  - CO027
  - CO028
  - CO029
  - CO030
- calloutType: risk
  title: Public disclosure quality is weaker than the financing headline
  body: Legora looks fast-growing, but investors still lack a clean public board roster, cap-table detail, definitive founding chronology, and synchronized KPI reporting across official surfaces. Those gaps matter because late-stage valuation confidence should come from repeatable disclosure discipline, not just momentum.
  claimRefs:
  - CO005
  - CO042
  - CO043
  - CO044
  - CO045
  - CO046
- calloutType: insight
  title: The current company story is best understood as “legal OS with agentic workflows,” not just “AI assistant for lawyers”
  body: Official messaging in 2026 repeatedly reframes the product from task-level assistance to a broader operating system that can combine trusted content, customer permissions, document review, and drafting into end-to-end workflows. That positioning is strategically important for later market, product, and valuation analysis.
  claimRefs:
  - CO001
  - CO002
  - CO027
  - CO028
  - CO036
