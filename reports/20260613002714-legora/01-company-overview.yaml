  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and any founder or investor control-rights summary.
    whyItMatters: A multibillion-dollar late-stage company should be underwritten with governance visibility, especially given the pace of hiring and capital formation.
    diligencePath: Request the current board deck index, board roster, and financing governance documents under NDA.
    relatedQuestionRefs:
    - QO007
    - QO025
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: Definitive incorporation, rebrand, and commercial-launch chronology tying together 2020 and 2023 public dates.
    whyItMatters: Founding chronology affects narrative credibility, employee-tenure interpretation, and investor claims about growth speed.
    diligencePath: Request certificate-of-incorporation dates, earlier trading names, and an approved company timeline from management.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table, ownership by round, and terms for the Series D plus the April 2026 extension.
    whyItMatters: Without ownership and preference data, valuation and downside protection cannot be assessed rigorously.
    diligencePath: Request the latest cap table and stock purchase agreements from counsel or finance.
