callouts:
- calloutType: strength
  title: Large addressable market with early penetration
  body: >-
    A $5.6 billion TAM growing at 22%+ annually, combined with Legora's $100M ARR implying
    only ~1.8% penetration, gives the company a long runway for expansion. The shift from
    task-level AI assistance to agentic workflow systems — and associated AaaS pricing models
    — could materially enlarge per-customer revenue over a 3–5 year horizon.
  claimRefs:
  - CM001
  - CM036
  - CM018
- calloutType: risk
  title: Harvey leads on ARR and valuation — winner-take-most risk is real
  body: >-
    Harvey's $190M ARR, $11B valuation, and majority AmLaw 100 penetration establish a
    higher-quality benchmark than Legora's current metrics. If the legal AI market consolidates
    around one dominant platform per major geography, Legora must defend its European base
    while aggressively gaining US share. Legora's $9×-smaller ARR relative to the US legal
    market opportunity underscores the asymmetry between ambition and current scale.
  claimRefs:
  - CM024
  - CM025
  - CM026
  - CM027
