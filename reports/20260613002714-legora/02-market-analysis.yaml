- id: TM001
  title: Market definition and boundary map
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Legora
  rows:
  - - AI-native legal workflow platforms
    - Subscription SaaS for research, drafting, document review, agentic workflow
    - Traditional database subscriptions without AI, e-discovery processing fees
    - Law firms, in-house legal teams
    - Core market; Legora's primary competitive arena
  - - Legal research AI
    - AI-enhanced case law search, regulatory monitoring, cited-answer generation
    - Static database licenses (LexisNexis, Westlaw) without AI features
    - Lawyers and paralegals; paid by firm or department
    - Top use case; 80% of legal AI users use it for research per TR 2026
  - - Contract lifecycle management AI
    - AI-embedded CLM, contract analysis, redlining automation
    - Standalone CLM without AI; spreadsheet-based contract tracking
    - Corporate legal and procurement; CLO / VP Legal budget
    - Adjacent; Legora competes here with product extensions
  - - E-discovery AI
    - AI-powered document review, production, and privilege log generation
    - Traditional linear review services billed by hour or page
    - Litigation teams, outside counsel; billed as services
    - Adjacent; high volume but historically dominated by specialist vendors
  - - Legal analytics and prediction
    - Outcome-prediction models, judge analytics, litigation trend tools
    - Generic BI dashboards, firm-run manual analysis
    - Litigation partners, general counsel; strategy budget
    - Niche; not a primary Legora use case today
  notes: >-
    Segment boundaries are contested across analyst sources. BRC and Research and Markets use
    broad definitions that include CLM and e-discovery; MarkWide Research uses a narrower scope.
    Confidence in included/excluded spend is medium because no public pricing breakout separates
    AI-native workflow revenue from total legal tech spend.
