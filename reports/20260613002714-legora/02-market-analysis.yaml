figures:
- id: FM001
  title: Legal AI market sizing lens
  type: pyramid
  layout: standard
  summary: >-
    Three-layer pyramid from global legal services spend to current analyst-estimated
    AI-in-legal TAM to publicly visible vendor revenue, showing substantial headroom
    and the gap between market and captured revenue.
  data:
    nodes:
    - label: Global legal services spend (2026 proxy)
      value: 1100
      description: >-
        Global legal services market estimated at $1.1 trillion in 2026 (extrapolated
        from ~$1 trillion in 2022 at mid-single-digit CAGR); represents the outer bound
        of spend that AI platforms can eventually address.
    - label: AI-in-legal TAM (BRC, 2026)
      value: 5.59
      description: >-
        Business Research Company estimate of global AI-in-legal software and services
        market in 2026, covering research, review, drafting, CLM, analytics, and
        e-discovery applications; CAGR 22.3% to $12.49B by 2030.
    - label: Harvey + Legora combined ARR (2026 proxy)
      value: 0.29
      description: >-
        Combined $290M ARR proxy from two leading pure-play vendors as of mid-2026:
        Harvey $190M (end-2025), Legora $100M (April 2026). Illustrates that even the
        two largest platforms together represent roughly 5% of the BRC TAM estimate,
        signalling early market stage.
  approximationNotes: >-
    Global legal services spend is an approximation; no single authoritative 2026 figure
    is publicly available. The pyramid compresses incompatible units: the top layer uses
    USD trillion, while inner layers use USD billion. Values are not additive.
  claimRefs:
  - CM001
  - CM002
  - CM025
  - CM037
