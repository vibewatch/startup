  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      No public breakout of the SAM for AI-native workflow platforms (distinct from e-discovery,
      CLM, and legal analytics), making it impossible to calculate Legora's precise addressable
      market from public data alone.
    whyItMatters: >-
      Without a clean SAM figure, it is hard to determine whether Legora's $100M ARR represents
      high or low penetration of its true competitive arena, which affects both the growth
      outlook and the valuation multiple justification.
    diligencePath: >-
      Request management's internal SAM definition, the firmographic breakdown of Legora's
      addressable law firm universe, and any industry-analyst reports they rely on for
      market sizing in their board materials.
    relatedQuestionRefs:
    - QM003
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Net revenue retention (NRR) and gross revenue retention for Legora are not publicly
      disclosed, making it impossible to verify whether rapid top-line ARR growth is accompanied
      by strong cohort retention.
    whyItMatters: >-
      High NRR is the primary evidence that workflow embedding is real and that customers expand
      their use over time. Without it, the ARR growth could reflect new logo acquisition masking
      churn in early cohorts.
    diligencePath: >-
      Request cohort-level retention data, average contract value by segment, and expansion
      revenue as a share of total ARR from the last four quarters.
    relatedQuestionRefs:
    - QM004
  - type: missing-source
    severity: minor
    topic: hallucination-risk
    missingEvidence: >-
      No 2026-specific published benchmark or incident report on hallucination rates in
      legal AI platforms was found during this research run; the Mata v. Avianca (2023)
      case was the most recent adverse incident in the public record.
    whyItMatters: >-
      Hallucination risk is frequently cited as a constraint on adoption in high-stakes
      legal matters, but without current benchmark data it is unclear how much the issue
      has been mitigated by model improvements since 2023.
    diligencePath: >-
      Search for post-2024 court rulings or bar association guidance on AI hallucination
      incidents; request any internal accuracy benchmarks or error-rate data from Legora.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      The three analyst estimates for 2026 legal AI market size span $4.7B–$5.59B without
      a clear reconciliation of definitional scope — particularly regarding the inclusion
      of e-discovery processing revenue, hardware, and consulting services.
    whyItMatters: >-
      If the SAM for AI-native workflow platforms (Legora's primary segment) is closer to
      the MarkWide lower bound after excluding e-discovery and CLM incumbents, Legora's
      implied penetration and market opportunity would be materially smaller.
    diligencePath: >-
      Compare each analyst's segment classification to Legora's product scope; request
      a market-sizing memo from management that specifies which estimate they use for
      board planning purposes.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: geography
    missingEvidence: >-
      No geographic revenue breakdown for Legora is publicly available; the US-to-Europe
      ratio of legal spending is CEO-cited but not independently verified per this
      research run.
    whyItMatters: >-
      US revenue concentration is the most critical near-term growth signal. Without the
      revenue split, it is unclear whether Legora's US push has yet translated into US
      revenue leadership.
    diligencePath: >-
      Request US vs. Europe vs. APAC ARR split and US sales pipeline metrics from
      management; cross-check against office headcount distribution.
    relatedQuestionRefs:
    - QM020
