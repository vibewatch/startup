      - number: '3.2'
        title: Incumbent legal research and workflow platforms
        blocks:
          - type: paragraph
            body: >-
              Thomson Reuters and LexisNexis are the deepest structural threats to the AI-native legal stack, because
              both possess what no startup currently matches: decades of curated, proprietary legal databases that
              underpin the entire legal research market. Thomson Reuters' Westlaw, now branded as Westlaw Advantage, is
              described on its product page as an "AI-Powered Legal Research Tool" that integrates CoCounsel, TR's
              generative AI legal assistant, directly into the Westlaw research environment. CoCounsel Core offers
              AI-drafted research memos, contract analysis, deposition preparation, and document review, all grounded in
              Westlaw's primary-law corpus. The 2026 Thomson Reuters AI in Professional Services report found that 40%
              of legal professionals now use GenAI — nearly double the prior year — and that 80% of GenAI users engage
              with AI tools weekly, signalling that the incumbent distribution channel into law firms is already
              capturing the adoption wave Legora is trying to ride.


              LexisNexis rebranded Lexis+ AI to "Lexis+ with Protégé" in February 2026, embedding the Protégé AI
              assistant across research, drafting, and analysis workflows. Protégé integrates Shepard's citations —
              LexisNexis's proprietary citation-validation service — directly into the drafting workflow, giving lawyers
              source-level authority checking that Legora cannot yet replicate without a comparably deep legal database.
              LexisNexis also supports iManage, SharePoint, and NetDocuments DMS integrations, enabling lawyers to work
              from their own documents alongside authoritative legal sources in one workspace — a capability that
              partially mirrors Legora's collaborative workspace pitch. A Forrester TEI study commissioned by LexisNexis
              in 2025 found a 344% ROI over three years for large law firms; a separate study found 284% ROI for
              corporate legal departments. These numbers are vendor-commissioned and should not be taken at face value,
              but they signal the data infrastructure LexisNexis is using to justify renewal and upsell conversations
              with its existing installed base.


              Clio, the dominant practice-management platform, deepened its database position in 2025 by acquiring vLex,
              a legal research provider with 40+ million legal documents. This made Clio one of the only companies
              besides TR and LexisNexis to hold a meaningful legal-database moat, which is precisely what Legora is
              trying to build through its own Qura acquisition. As of June 2026, Clio has additionally acquired
