        title: Scenario range, return discipline, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Return math is the core reason to stay disciplined. A new investor entering at $5.6 billion needs more
              than $11.2 billion of exit equity value for a simple 2x gross multiple of invested capital before
              dilution, and more than $16.8 billion for 3x. If the company needs another 15% to 20% dilution before
              exit, the 3x hurdle rises above $20 billion. That is possible, but it requires Legora to scale from $100
              million ARR toward several hundred million while still defending a premium multiple far above public
              comps. The bull case therefore needs both operating delivery and sustained scarcity: roughly $250 million
              to $300 million ARR plus a 35x to 40x multiple can justify $8.8 billion to $12.0 billion, creating only
              moderate upside from the current mark unless later dilution is minimal. The base case assumes continued
              growth but partial multiple convergence, landing near flat to modest downside. The bear case is not zero,
              but it is painful: slower growth plus public-market-style multiples produces a meaningful markdown. That
              profile argues for patience and for treating any near-term exit as more likely another private financing
              or a strategic transaction than a clean public-market debut.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV048
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV036
              - CV037
              - CV038
      - number: '8.4'
        title: Kill triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The main reason not to stretch for the round is that the missing diligence is exactly the diligence that
              determines late-stage return quality. Public sources prove adoption and financing access, but they do not
              show how the $600 million round sits in the cap table, whether retention and gross margin justify
              software-like durability, or whether cash burn and runway force another aggressive financing soon. The
              best adverse evidence is not about Legora specifically but about the category: Robin AI’s layoffs and
              distressed sale process in late 2025 show how quickly legal AI narratives can break when growth and
              fundraising slip behind expectations. For Legora, the thesis breaks if the next financing prices below the
              current mark, if disclosed ARR growth decelerates sharply without margin proof, or if workflow-expansion
              stories fail to convert into sticky recurring revenue. The diligence agenda is therefore straightforward:
              get the cap table, get cohort retention and gross margin, get cash-burn and runway, and quantify whether
              corporate-legal and partner-led workflows are truly compounding rather than just expanding the story.
            claimRefs:
              - CV021
              - CV022
