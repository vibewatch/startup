  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Scenario range from severe markdown to moderate upside, plus the return hurdles implied by a $5.6 billion entry.
    data:
      items:
        - label: Bear case
          low: 1.4
          mid: 1.8
          high: 2.3
          note: Growth slows and valuation converges toward 12x-15x on $120M-$150M ARR.
        - label: Base case
          low: 3.6
          mid: 4.5
          high: 5.5
          note: ARR grows to roughly $180M-$220M but multiple compresses toward 20x-25x.
        - label: Bull case
          low: 8.8
          mid: 10.5
          high: 12
          note: ARR reaches roughly $250M-$300M and Legora retains a 35x-40x scarcity multiple.
        - label: 2x MOIC hurdle
          low: 11.2
          mid: 11.2
          high: 11.2
          note: Minimum pre-dilution exit equity value required to double a $5.6B entry.
        - label: 3x MOIC hurdle
          low: 16.8
          mid: 16.8
          high: 16.8
          note: Minimum pre-dilution exit equity value required for a 3x gross return.
