              global or enterprise-wide availability after evaluation; Erste says implementation spans 250 lawyers
              across 30-plus legal departments in seven jurisdictions; BAHR and Trowers publish concrete repeat-usage
              indicators. The limitation is that many of these proofs still originate on Legora-controlled surfaces, so
