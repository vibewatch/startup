  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, disclosed traction, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Legora should be underwritten as an enterprise software company with recurring subscription economics, but
              the public record is much clearer on growth than on monetization mechanics. The strongest disclosed
              top-line fact is the company's 2026-04-02 statement that it surpassed $100 million ARR less than 18 months
              after general availability in October 2024, while serving more than 1,000 customers across 50 markets.
              March 2026 financing coverage showed the immediately prior operating snapshot: 800 customers, tens of
              thousands of daily legal users, and a team scaled from 40 to 400 over the preceding year. By the June 2026
              newsroom index, Legora was claiming more than 100,000 legal professionals at more than 1,200
              organizations. That is enough to support real demand, but not enough to disaggregate revenue by law-firm
              versus in-house customer, by geography, or by product module.


              What remains notably absent is price transparency. None of the reviewed official press releases, the about
              page, or the broader public source pack discloses list pricing, per-seat pricing, minimum contract values,
              services attach, discounts, or revenue-recognition policy. The safest revenue-model synthesis is therefore
              enterprise B2B SaaS with workflow expansion and implementation effort around deployment, research,
              drafting, and diligence use cases. The top-line is unusually well signaled for a private company, but
              investors still need a stream-by-stream bridge before treating the $100 million ARR figure as equivalent
              to mature, high-quality SaaS revenue.
