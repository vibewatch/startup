  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition, boundaries, and sizing
        blocks:
          - type: paragraph
            body: >-
              The global AI-in-legal market covers software and services that apply machine-learning and
              large-language-model technology to legal workflows — principally research, document review, contract
              analysis, drafting, and compliance. Three analyst publishers who published estimates in 2026 put the
              market at between $4.7 billion (MarkWide Research, using a narrow scope) and $5.59 billion (Business
              Research Company). Research and Markets anchors its 2025 baseline at $4.59 billion, which implies a 2026
              figure consistent with the BRC estimate after one year of 22.3% growth. These estimates vary partly
              because of definitional disagreements: broader definitions include e-discovery processing, contract
              lifecycle management (CLM) platforms, and legal analytics tools; narrower ones restrict the scope to
              AI-native workflow software similar to what Legora sells. Investors should retain all three estimates
              rather than averaging them, because each reflects a different serviceable market.


              The proxy suggested by venture pricing is also informative. Legora's $5.6 billion post-money valuation
              from the April 2026 extension was set against a disclosed $100 million ARR, implying investors priced the
              company at 56× ARR. At a more conservative 10–15× SAM penetration, the implied SAM for workflow-AI
              platforms alone is roughly $1–1.5 billion today, scaling toward $5+ billion by 2030. The US market is
              structurally dominant: Legora CEO Max Junestrand stated publicly that US legal spending is roughly nine
              times that of Europe, which explains why the company opened offices in Houston, Chicago, New York, and
              Denver while still headquartered in Stockholm. North America was the largest legal AI region in 2025 per
              BRC, and Asia-Pacific is the fastest-growing region. For Legora, that regional hierarchy makes US sales
              productivity the single most important near-term demand signal.


              The status-quo substitutes that legal AI displaces are human research time (junior associates and
              paralegals), static legal database subscriptions (LexisNexis, Westlaw), and manual document review in
              diligence and litigation. Because these are labour- intensive and high-cost activities for firms, the ROI
              case for AI platforms is strong even at modest adoption rates. Legora's own April 2026 release cited an
              average of 4.3 non-billable hours saved per lawyer per week across surveyed law firms, and 42% of those
              firms said they had won new work as a direct result of using the platform.
