      - number: '4.3'
        title: Capital history, adequacy, and what public filings still cannot answer
        blocks:
          - type: paragraph
            body: >-
              Legora's financing ladder is unusually visible even though its financial statements are not. The
              best-supported progression is an $80 million Series B at a $675 million valuation in May 2025, a $150
              million Series C at a $1.8 billion valuation in October 2025, a $550 million Series D at a $5.55 billion
              valuation in March 2026, and a further $50 million extension in April 2026 that brought the round to $600
              million at a $5.6 billion post-money valuation. Summing only those publicly disclosed rounds gives more
              than $780 million of known equity capital. On a disclosed $100 million ARR base, that places the
              March-April 2026 valuation at roughly 55x to 56x ARR, which is an aggressive multiple that assumes
              sustained hypergrowth and eventual strong margins.


              The financing story does, however, solve only one part of the adequacy question. Management has clearly
              stated the primary uses of funds: U.S. expansion, local hiring, and continued product and infrastructure
              investment, with strategic investors such as Atlassian, NVentures, and Salesforce Ventures reinforcing the
              platform story. What remains unavailable is cash on hand, monthly burn, runway, debt, or any debt-like
              obligations. The one genuine filing source in the pack is Companies House for LEGORA LTD in the UK, which
              shows incorporation and a £1 statement of capital but no filed accounts. That means the registry adds
              legal-entity confirmation and timing context, not audited income-statement or balance-sheet support for
              the operating group.
