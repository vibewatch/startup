      - - Return hurdle
        - 2x requires >$11.2B; 3x requires >$16.8B pre-dilution
        - high
        - The company needs very large scale-up before a new investor earns standard venture outcomes.
      - - Holding / exit posture
        - Likely multi-year hold; near-term IPO unsupported by public disclosure quality
        - medium
        - Underwrite this as a private compounding story, not a quick public exit.
      - - Upgrade trigger
        - Disclose NRR, gross margin, burn, and preference stack or offer entry closer to 25x-35x forward ARR
        - medium
        - Those datapoints would materially improve confidence in underwriting the price.
    notes: >-
      Assessments reflect public evidence only as of 2026-06-13 and exclude any confidential KPI, customer-cohort, or
      cap-table materials.
