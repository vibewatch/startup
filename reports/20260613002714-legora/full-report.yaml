      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Legora’s freshest official positioning is not a narrow point tool but an “agentic operating system for
              legal work.” Across its newsroom, product, and legal-research pages, the company consistently says it
              supports lawyers in research, review, and drafting, while product pages add document comparison, tabular
              review, Word add-ins, and workflow support. The company also emphasizes that its assistant is built for
              legal professionals rather than as a generic chatbot, with cited answers and workflow integration as the
              core promise.


              The public location story is directionally strong but not perfectly clean. Official materials anchor
              Legora in Stockholm, while its growth narrative is now clearly multinational: official releases mention
              teams in Stockholm, London, New York, Denver, Sydney, and Bengaluru, with later 2026 expansion into
              Singapore, Tokyo, Madrid, Milan, and Paris. The company’s own about page still lags some fresher newsroom
              claims, showing 375+ coworkers, 980+ customers, and 30+ markets, whereas June 2026 newsroom pages move
              those numbers materially higher. That makes the safest synthesis “Stockholm-founded, globally operating,
              and scaling quickly enough that some official surfaces are already stale.”
