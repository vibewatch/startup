              Harvey's $190M ARR, $11B valuation, and majority AmLaw 100 penetration establish a higher-quality
              benchmark than Legora's current metrics. If the legal AI market consolidates around one dominant platform
              per major geography, Legora must defend its European base while aggressively gaining US share. Legora's
