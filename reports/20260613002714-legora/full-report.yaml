    Legora is a Stockholm-founded legal AI company that in 2026 positioned itself as an agentic operating system for
    legal work. The platform supports research, review, drafting, and diligence workflows for law firms and in-house
    legal teams, with product expansion reinforced by content partnerships, workflow integrations, and acquisitions such
    as Qura and Cadastral. Public evidence shows unusual growth speed for a private software company, but still limited
    disclosure on pricing, retention, margins, and governance.
