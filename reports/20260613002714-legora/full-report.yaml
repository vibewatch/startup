      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver is the structural labour arbitrage available to law firms and corporate legal
              teams: AI can handle high-volume, document-intensive tasks that currently consume disproportionate
              associate and paralegal time. According to Clio data cited in the BRC market report, AI adoption among law
              firm professionals surged from 19% in 2023 to 79% by 2026 — an extraordinary acceleration that reflects
              both falling model costs and rising user comfort. The TR 2026 report found that 80% of legal professionals
              cite research as their top AI use case, followed by document review (74%) and summarisation (73%), which
              directly maps to Legora's product footprint. Agentic AI adoption is still early — only 16% of firms use it
              currently — but 77% of professionals expect it to be central to workflows by 2030, validating Legora's
              AaaS (Agent as a Service) positioning as a forward bet.


              The principal constraints are trust, confidentiality, change management, and competition from generalist
              platforms. The TR 2026 report shows that only 17% of legal professionals feel ethically comfortable with
              AI giving legal advice; 23% feel hesitant and 19% feel concerned. Law firms operate under ABA Model Rule
              1.6 (client confidentiality) and Rule 1.1 (competence), which means any AI tool whose data handling is not
              locked down will stall at the compliance gate. Legora's ISO 42001, ISO 27001, and SOC 2 Type 2
              certifications address this directly, but procurement teams at large firms typically run independent
              data-handling audits that add months to the sales cycle.


              The competitive constraint that warrants specific investor attention is the risk that foundation model
              providers erode vertical legal AI platforms from below. TechCrunch's March 2026 coverage noted that
              publicly listed legal software companies saw their stocks fall when Anthropic launched a legal plug-in for
              Claude, and that Microsoft Copilot is positioning against workflow vendors. Harvey's strategy — to become
              the operating system for legal work through deeply embedded custom agents across 1,300 organisations in 60
              countries — mirrors Legora's positioning and demonstrates that winner-take-most dynamics are a real risk
              in this market. Harvey's higher ARR ($190M vs Legora's $100M) and higher valuation ($11B vs $5.6B) provide
              a benchmark that Legora must outperform to justify its current multiple.
