      - number: '2.2'
        title: Buyer landscape and adoption path
        blocks:
          - type: paragraph
            body: >-
              Legal AI has two structurally distinct buyer segments: law firms (external counsel) and corporate in-house
              legal departments. In law firms, the buyer is typically the managing partner or chief operating officer,
              but the user is the associate or senior lawyer who does the research and drafting work. The payer is the
              firm's IT or legal- technology budget, which is increasingly line-item approved at the partnership level
              rather than treated as an IT overhead. Law firm procurement cycles are long — large Magic Circle and AmLaw
              100 firms typically run multi-month pilots and require security and data-handling certification before
              signing enterprise agreements. Mid-tier firms often adopt faster through a champion partner or innovation
              committee.


              In-house legal teams are buying for different reasons. Corporate legal departments are under board-level
              pressure to reduce headcount growth while absorbing more regulatory and contractual workload. Legora's
              April 2026 extension release explicitly said corporate legal departments had become one of the company's
              fastest-growing segments, with Barclays cited as a representative customer. The TR 2026 report confirms
              that 62% of legal professionals believe AI should be applied to their work, but only 15% of organisations
              are measuring AI ROI — suggesting budget holders are approving spend on strategic grounds rather than
              proven unit-economics evidence.


              The adoption path for both segments follows a consistent pattern: a single champion (partner, general
              counsel, or legal-tech director) adopts informally, demonstrates value in one workflow (most commonly
              research at 80% of firms per the TR 2026 report), then sponsors a firm-wide or department-wide
              procurement. Harvey's blog noted that more than 25,000 custom agents now operate on its platform,
              representing a maturation of adoption from task-level to workflow-level — a pattern Legora is also
              targeting through its agentic operating system positioning. The Wolters Kluwer partnership (US statutory
              and regulatory content) and Datasite integration (virtual data-room document analysis) are both designed
              to deepen the adoption funnel by making Legora more embedded into firm workflows and reducing the
              switching cost once deployed.
