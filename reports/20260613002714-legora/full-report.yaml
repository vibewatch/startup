      - number: '6.3'
        title: Retention, repeat usage, and satisfaction signals
        blocks:
          - type: paragraph
            body: >
              Public durability evidence exists, but it is uneven and far short of what an investor would want for a
              renewal model. The best repeat-usage proof is customer specific: BAHR says about 80% of its people are
              active users and as many as 30% use Legora more than ten times a day, while Trowers & Hamlins says 97% of
              pilot participants used the platform weekly, 88% rated quality good or excellent, and 87% found it easy or
              very easy to use. Mishcon de Reya’s post-pilot rollout adds qualitative confirmation that lawyers are
              using the product repeatedly across contract review, drafting, summarization, and research workflows.


              What is missing is the commercial durability bridge. No reviewed public source discloses NRR, GRR, churn,
              renewal rate, cohort retention, contract duration, seat expansion by vintage, or revenue concentration by
              top account. Independent commentary also introduces real caution: GC AI and Comparateur both emphasize
              demo-only pricing and procurement opacity, while Irys argues lawyers should probe third-party API routing,
              data-custody implications, and vendor maturity before adopting the product for privileged work. The result
              is a chapter that can support strong adoption and meaningful workflow value, but not a fully underwritten
              view of retention quality or customer economics.
