      - number: '7.2'
        title: Operational, quality, and security risk remains structurally high even with visible controls
        blocks:
          - type: paragraph
            body: >-
              The public downside case is easiest to see in output quality. Legal AI has a documented hallucination
              problem, and the best independent evidence in this pack says even leading legal-research systems still
              fabricate or mis-ground answers at non-trivial rates. Courts and bar groups are increasingly sanctioning
              lawyers who fail to verify AI-generated authorities, which means a legal-AI vendor does not need a cyber
              breach to suffer trust damage; weakly grounded output can do the job on its own. Legora’s product ambition
              increases that exposure because the company explicitly says its Agent plans, executes, reviews, and
              delivers complex work end to end. That same autonomy also raises confidentiality risk when the workflow
              touches internal documents, external tools, or live diligence repositories, which maps directly to OWASP’s
              published LLM risk categories around prompt injection, sensitive-information disclosure, excessive agency,
              and overreliance. The good news is that Legora has published meaningful controls: no customer-data model
              training, written-approval gates for support access, MFA, backups every four hours, logging, Azure
              replication, and multiple governance commitments. The underwriting problem is that these are still mostly
              company-described controls. There is no public uptime history, no disclosed Legora-specific hallucination
              rate, and no public incident register showing how often the company catches bad outputs before customers
              do.
