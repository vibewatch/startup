      - number: '1.4'
        title: Milestones, partnerships, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a company moving from AI drafting assistant toward a broader legal workflow
              platform. Official materials say Legora reached general availability in October 2024 after working closely
              with Mannheimer Swartling during early development. In 2026, the company then layered on major financing,
              legal-research expansion through Qura, commercial-real-estate expansion through Cadastral, new country
              offices, and workflow partnerships such as Datasite and Wolters Kluwer Legal & Regulatory US. Those moves
              collectively support management’s thesis that legal AI value is shifting from isolated prompts toward
              system-level, document-centric workflows.


              The main negative signal is not a public legal crisis or financing stress but disclosure inconsistency and
              execution burden. Different sources disagree on founding date, employee count, office count, customer
              count, and total capital raised, with the discrepancies mostly explainable by timing, stale directories,
              or the gap between pre- and post-extension funding. TechCrunch also frames Legora’s moat challenge
              directly: Harvey remains a well-funded rival, while Microsoft Copilot, Anthropic’s legal plug-in work, and
              other generalist model providers can pressure workflow vendors from below. This does not break the company
              story, but it does mean diligence should focus on data moats, retention, deployment depth, and governance
              rather than assuming rapid top-line growth alone settles the investment case.
