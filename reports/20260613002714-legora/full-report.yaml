    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation by buyer, user, payer, geography, and customer type
        blocks:
          - type: paragraph
            body: >
              Legora’s public customer mix is clearest at the high end of the legal market rather than in the long tail.
              Official customer pages and rollout announcements show three recurring payer patterns: large law firms
              buying for firmwide or cross-office lawyer populations; regulated enterprises such as Erste Group buying
              for centralized legal organizations; and professional-services partners such as Deloitte using the
              platform internally while also helping clients implement it. End users are typically lawyers, legal
              operations staff, or innovation teams, while sponsors are managing partners, CIOs, legal innovation leads,
              or centralized procurement owners.


              Geographically, the customer proof is broad and increasingly global. Official customer pages cover firms
              in the Nordics, UK, continental Europe, and large global networks, while separate APAC and Europe
              expansion releases explicitly tie new offices to existing demand from customers in Singapore, Tokyo,
              Spain, Italy, and France. The main caveat is that public segmentation is much better by enterprise profile
              and geography than by revenue band or contract structure. Legora does not publicly split its customer
              count between law firms, in-house teams, financial institutions, and implementation partners, so the
              safest read is that the customer book is demonstrably top-tier and international but still opaque on mix
              and monetization.
