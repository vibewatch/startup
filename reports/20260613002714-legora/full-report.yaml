      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Legora’s own architecture language is specific enough to support a credible operating-model view. The aOS
              page separates product interfaces, legal-specific agent capabilities, context and knowledge, data and
              integrations, and an agentic harness that handles tool routing, control flow, memory management, model
              selection, and guardrails. The Workflows pages make that concrete: a lawyer can give the system a
              natural-language goal, upload source documents, and let the platform create a plan, invoke tools, perform
              structured review, pull cited legal research, and draft deliverables. The company is therefore positioning
              the platform as a control layer over multiple tools and data sources rather than as a single-model UI.


              The Microsoft and MCP evidence sharpens that picture further. Microsoft’s marketplace listing places
              Legora inside Word, Outlook, and SharePoint and says the workspace runs on Azure. The MCP post says Legora
              can connect to MCP servers, retrieve files from connected systems, work on them inside Legora, and return
              updated versions, while the base MCP spec explains why that matters: it is a common interface for
              connecting AI applications to tools, data, and workflows. The result is a public architecture picture with
              clear strengths—document-centric orchestration, multiple user surfaces, and integration into enterprise
              systems—but also one real diligence constraint: there is still no public customer-facing API or
              implementation documentation that shows exactly how permissions, file transfer, and connector deployment
              work in production.
