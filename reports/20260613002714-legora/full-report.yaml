  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Why it matters
      - Anti-thesis
      - What would change the view
    rows:
      - - Demand proof is unusually strong for a private legal AI company.
        - $100M+ ARR, 1,000+ customers, and 50+ markets support real product-market fit.
        - The public record still omits NRR, gross margin, CAC, and burn.
        - Provide cohort retention above 120%, gross margin above 80%, and credible cash-efficiency metrics.
      - - Workflow depth can justify a premium to point-solution peers.
        - Datasite integration and corporate-legal adoption suggest broader workflow embed and expansion potential.
        - Public sources do not quantify how much revenue or ACV uplift these workflows contribute.
        - Show partner-sourced pipeline, corporate-legal revenue mix, and net expansion from workflow modules.
      - - Private markets are paying scarcity multiples for legal AI leaders.
        - Harvey and Legora both trade near the high-50x ARR zone, implying a category premium for top names.
        - >-
          Public legal and workflow software comps trade around 1.5x to 5.0x revenue, so private marks can compress
          sharply.
        - Maintain hypergrowth while disclosing economics strong enough to defend staying outside the public comp band.
      - - Financing access reduces immediate solvency risk.
        - A $600M round and new strategic investors indicate strong sponsor support and future financing credibility.
        - >-
          Preference-stack terms are undisclosed, so enterprise-value upside may not convert cleanly into
          common-equivalent returns.
        - Provide the post-Series-D cap table, seniority, liquidation preferences, and anti-dilution terms.
      - - The exit ceiling is high enough to matter.
        - >-
          A category-defining legal AI platform could still become a multi-tens-of-billions asset if execution stays
          elite.
        - A new investor at $5.6B needs a very large exit to earn target returns, especially after dilution.
        - Prove the path to $250M-$300M ARR and durable premium pricing before treating the current mark as attractive.
    notes: >-
      The thesis is fundamentally about quality plus price; a positive operating view does not automatically justify the
      current entry valuation.
