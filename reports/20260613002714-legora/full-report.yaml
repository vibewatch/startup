  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round financing
        - Any next primary round below the current $5.6B post-money mark
        - Signals that later investors no longer underwrite Harvey-like premium economics.
        - Pause deployment and re-underwrite the cap table before participating.
      - - Growth deceleration
        - Next disclosed ARR milestone points to sub-60% annualized growth or ARR remains below about $150M by mid-2027
        - Weakens the main justification for sustaining a premium multiple above public comps.
        - Downgrade to research-more / avoid until valuation resets.
      - - Economics disappointment
        - Management reveals gross margin below 70% or NRR below 110%
        - Undercuts the software-quality durability required to defend the current multiple.
        - Require materially lower entry valuation or do not invest.
      - - Runway pressure
        - Cash runway below 18 months without a clearly funded plan
        - Raises the odds of dilutive financing under weaker negotiating leverage.
        - Demand cash waterfall, financing plan, and preference-stack analysis immediately.
      - - Workflow monetization miss
        - Corporate-legal or partner-led expansion does not translate into meaningful net expansion or ACV lift
        - Breaks the argument that workflow breadth deserves a structural premium.
        - Treat the business more like a point-solution vendor and re-rate toward public comps.
      - - Category sentiment reset
        - Another well-funded legal-AI peer shows funding stress or forced sale despite real revenue
        - Demonstrates that late-stage category multiples are fragile when capital markets tighten.
        - Increase discount rate, assume faster multiple compression, and revisit downside case.
    notes: >-
      Thresholds are public-market monitoring rules rather than company guidance; private KPI disclosure could tighten
      or relax them materially.
    claimRefs:
      - CV021
      - CV023
      - CV033
      - CV035
      - CV041
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and preferences
        - >-
          Post-Series-D capitalization table, share classes, liquidation preferences, anti-dilution, and any structure
          favoring insiders or strategics.
        - Late-stage return quality depends on who gets paid first in flat or moderately up outcomes.
        - Request from CFO / lead investor under NDA before any term-sheet work.
      - - Retention and gross margin
        - NRR, gross margin, services burden, and cohort behavior by law-firm versus corporate segment.
        - These are the core variables that determine whether Legora deserves software-like premium multiples.
        - Request audited KPI pack and cohort tables.
      - - CAC, payback, and sales efficiency
        - CAC, payback period, sales-cycle length, and expansion contribution to new ARR.
        - Strong growth without efficient acquisition can still produce poor investor returns at a high entry price.
        - Request board materials or go-to-market KPI dashboard.
      - - Cash burn and runway
        - Current cash balance, monthly net burn, hiring plan, and the minimum runway threshold management targets.
        - A fast-growing company at this price can still force a painful next round if burn outruns market appetite.
        - Request finance model and latest management accounts.
      - - Corporate legal and partner mix
        - >-
          Revenue share, logo mix, ACV, and retention for corporate legal deployments plus partner-sourced workflows
          such as Datasite.
        - This is the cleanest test of whether workflow breadth is real monetization or narrative embellishment.
        - Request segment bridge and partner-influenced pipeline analysis.
      - - Exit and liquidity readiness
        - Internal planning for next round, secondary liquidity, IPO readiness, and strategic-interest map.
        - If disclosure quality stays thin, the medium-term exit path matters more than the abstract long-run TAM.
        - Ask management and lead investors how they expect a 2x-3x outcome to be realized from here.
    notes: >-
      Items are ordered by how directly they could change the entry-price decision; the first four are effectively
      blocking for a full-conviction buy case.
    claimRefs:
      - CV025
      - CV026
      - CV028
