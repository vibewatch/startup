      - number: '5.5'
        title: Trust, safety, security, privacy, and compliance
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance are central to the way Legora sells the product. The security page claims ISO 42001,
              ISO 27001, and SOC 2 Type 2, says customer data is not used to train foundation models, and highlights
              zero-trust design, customer-approved support access, BYOK, SSO, data-governance tooling, and auditability.
              The security measures and DPA documents make those claims more concrete by describing least-privilege
              access, bcrypt password hashing, SAML-based SSO, AES-256 encryption at rest, TLS 1.2+ in transit,
              logically separated subscriber environments, annual penetration testing, and 36-hour breach notification.
              The aOS page adds ethical walls, cross-matter isolation, and audit trails for tool calls and file access,
              which is aligned with the confidentiality needs of large legal matters.


              The privacy and regulatory picture is positive but not fully externally testable from public artifacts
              alone. The DPA and subprocessor list show a mature legal framework for processor obligations, subprocessor
              governance, cross-border transfers, and customer objection rights. The supported-countries page and
              partner content also support a global go-to-market. At the same time, public readers still cannot inspect
              certificate scopes, exception histories, or independent evidence on Monitors precision and coverage
              quality. The EU AI Act context makes those questions more important, not less, because a legal-AI platform
              that markets trustworthy, human-centric, source-grounded automation will increasingly be judged on
              operational proof, not just policy language. For diligence purposes, Legora’s trust posture is above
              average in public documentation depth, but some of the most important verification still sits behind
              private audit packs.
