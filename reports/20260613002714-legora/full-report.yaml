      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard summarizing where Legora looks strong and where the current valuation still lacks public proof.
    data:
      items:
        - label: Market / demand
          value: 8/10
          note: Adoption proof is strong and the legal-AI category is scaling fast.
        - label: Product / workflow depth
          value: 7/10
          note: Datasite and corporate workflows support a broader platform case.
        - label: Competitive position
          value: 6/10
          note: Harvey validates the category but also sets a very demanding benchmark.
        - label: Economics visibility
          value: 3/10
          note: NRR, gross margin, CAC, and burn remain undisclosed in public sources.
        - label: Financing access
          value: 8/10
          note: The $600M round and strategic investors indicate strong sponsor support.
        - label: Risk profile
          value: 4/10
          note: High-entry-price risk plus execution risk create asymmetric downside for new money.
        - label: Valuation support
          value: 2/10
          note: Public comparables do not support paying Harvey-like ARR multiples today.
        - label: Evidence quality
          value: 5/10
          note: The growth story is well supported, but the decisive late-stage KPI set is still private.
    claimRefs:
      - CV024
      - CV029
      - CV030
      - CV040
      - CV041
      - CV042
