  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Legora’s public product story has moved beyond a single legal chatbot into a connected legal-work
              platform. Its aOS page describes an operating system for legal work, while the product pages and launch
              posts show a suite that now includes Agent, Workflows, Tabular Review, Legal Research, Editor, Portal,
              Word Add-in, Outlook Add-in, Lists, Monitors, and a mobile app. The common workflow thread is that lawyers
              start with documents, emails, or a high-level matter goal, then move through analysis, drafting,
              collaboration, and delivery without leaving the same workspace. That matters because Legora is not selling
              one isolated model interaction; it is selling a workflow stack for law firms and in-house teams that want
              source-grounded outputs, institutional playbooks, and collaboration controls inside one environment.


              The module map is also unusually explicit about role fit and maturity. Agent and Workflows sit at the
              orchestration core; Tabular Review and Legal Research handle structured extraction and cited analysis;
              Editor and the Word Add-in cover drafting at different moments; Outlook and mobile expand the system into
              inbox and on-the-go contexts; Portal, Lists, and Monitors extend the platform into client delivery, matter
              management, and regulatory horizon scanning. The evidence supports a broadening product surface rather
              than a static SKU list, but the safest diligence reading is still that some modules are newer than others.
              Lists is explicitly called a first iteration, mobile is explicitly narrower than desktop, and Monitors’
              operational claims are still company-described rather than independently benchmarked.
