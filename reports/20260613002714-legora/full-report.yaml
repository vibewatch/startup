  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Illustrative valuation sensitivity showing how ARR and multiple assumptions move equity value quickly from
      markdown to modest upside.
    data:
      items:
        - label: $150M ARR × 15x
          value: 2.25
          note: Bear-style outcome with slower growth and heavy multiple compression.
        - label: $180M ARR × 20x
          value: 3.6
          note: Low end of base case and below the current mark.
        - label: $220M ARR × 25x
          value: 5.5
          note: Upper base case and roughly flat versus today.
        - label: $250M ARR × 35x
          value: 8.75
          note: Bull case that still offers only moderate upside before dilution.
        - label: $300M ARR × 40x
          value: 12
          note: Best public-evidence bull case requiring both scale and premium durability.
