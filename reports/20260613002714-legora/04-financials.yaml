chapter:
  number: 4
  title: Financials
  summary: 'Legora has one of the stronger public top-line stories in private legal AI: the company said it crossed $100 million ARR on 2026-04-02, went from roughly $1 million to $100 million ARR in under 18 months, and raised a $550 million Series D at a $5.55 billion valuation that became $600 million at a $5.6 billion post-money valuation one month later. The positive case is real recurring-software demand and unusually strong financing access; the underwriting problem is that pricing, gross margin, CAC, NRR, cash, burn, runway, revenue recognition, and debt are still undisclosed. The best current verdict is hypergrowth with credible demand proof, but still high dependence on continued execution and future capital-market support.'
  letter: I
  contentRequirements:
  - Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
  - GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics).
  - Cost structure, gross margin drivers, working capital, capex, and service-delivery costs.
  - Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps.
  - Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations.
  - Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
