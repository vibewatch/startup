- id: TI002
  title: Pricing / monetization table
  columns:
  - Public signal
  - Value / status
  - Confidence
  - Interpretation
  - What remains unknown
  rows:
  - - List pricing
    - Not publicly disclosed
    - high
    - Legora does not market transparent list pricing in the reviewed public pack.
    - Per-seat pricing, minimum ACV, usage tiers, and discount bands.
  - - Contract structure
    - Enterprise B2B software agreements inferred from customer profile and rollout motion
    - medium
    - Large law firms, in-house teams, and workflow integrations imply negotiated annual or multi-year contracts.
    - Term length, ramp clauses, pilots versus full rollouts, and renewal structure.
  - - ROI proof used in selling
    - 4.3 non-billable hours saved per lawyer per week; 42% of surveyed firms reported new work won
    - medium
    - These are outcome claims that likely support sales conversion and expansion conversations.
    - Survey sample size, methodology, customer mix, and linkage to realized ACV uplift.
  - - Monetization evolution
    - Shift from SaaS framing toward AaaS / agentic workflow positioning
    - medium
    - Could justify higher pricing or expansion if customers pay for completed workflows rather than seats alone.
    - Whether pricing is still seat-based, workflow-based, or outcome-linked.
  - - Revenue recognition policy
    - Not publicly disclosed
    - high
    - Without accounting policy, headline ARR cannot be translated cleanly into GAAP-like revenue quality.
    - Recognition timing for pilots, services, implementation, partnerships, and multi-year contracts.
  notes: The strongest public evidence concerns customer outcomes, not contracted price realization. That is useful for demand quality but insufficient for revenue-quality analysis.
