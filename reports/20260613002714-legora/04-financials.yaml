  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-recognition
    missingEvidence: List pricing, realized pricing, discounting, contract duration, and revenue-recognition policy.
    whyItMatters: Without pricing realization and accounting policy, the disclosed ARR milestone cannot be translated into revenue-quality confidence.
    diligencePath: Request standard order forms, pricing schedules, discount waterfalls, and the accounting memo for subscriptions, pilots, and service elements.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI027
    relatedTableRefs:
    - TI001
    - TI002
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-unit-economics
    missingEvidence: Gross margin by stream, NRR, CAC, payback, LTV, and contribution margin by cohort.
    whyItMatters: These metrics determine whether Legora is becoming a capital-efficient software platform or a more support-heavy enterprise workflow business.
    diligencePath: Request cohort tables, gross-margin waterfalls, CAC/payback analysis, and customer-success cost allocation.
    relatedQuestionRefs:
    - QI008
    - QI010
    - QI027
    - QI028
    relatedTableRefs:
    - TI002
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Cash on hand, monthly net burn, runway months, and board downside case.
    whyItMatters: Capital adequacy cannot be judged from financing headlines alone when hiring and expansion remain aggressive.
    diligencePath: Request a 24-month cash bridge, current bank balances, burn history, and board-approved operating plan.
    relatedQuestionRefs:
    - QI011
    - QI021
    - QI023
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-obligations
    missingEvidence: Debt facilities, guarantees, leasing commitments, and any venture-debt or credit agreements.
    whyItMatters: These obligations can materially change dilution risk and short-term liquidity even after a large equity raise.
    diligencePath: Obtain debt schedules, covenant packages, material lease commitments, and any side letters on financing obligations.
    relatedQuestionRefs:
    - QI022
    - QI027
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-mix-and-retention
    missingEvidence: Revenue mix by law firm versus in-house customers, by geography, and by product / workflow; gross logo retention and NRR by segment.
    whyItMatters: Mix and retention determine whether disclosed ARR is broad-based and durable or concentrated in a narrow set of flagship accounts.
    diligencePath: Request segment revenue bridge, top-customer concentration, logo churn, and NRR by cohort and geography.
    relatedQuestionRefs:
    - QI004
    - QI007
    - QI027
    relatedTableRefs:
    - TI001
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited consolidated income statement, balance sheet, and cash flow statement for the main operating business.
    whyItMatters: Companies House confirms only a UK legal entity, not the consolidated operating and cash picture investors need.
    diligencePath: Request the latest audited group financials plus legal-entity mapping and intercompany structure.
    relatedQuestionRefs:
    - QI024
    - QI027
    - QI028
    relatedTableRefs:
    - TI005
