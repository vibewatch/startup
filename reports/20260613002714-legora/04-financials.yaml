- id: TI004
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin
    - 'null'
    - low
    - Determines whether Legora scales like software or carries heavier service and support costs than public narrative implies.
    - Provide gross margin by segment and by software versus service component.
  - - Net revenue retention
    - 'null'
    - low
    - NRR is the cleanest check on whether workflow depth and agentic positioning produce durable expansion.
    - Provide quarterly and annual NRR by law-firm and in-house cohorts.
  - - CAC / payback
    - 'null'
    - low
    - The enterprise sales motion likely requires significant field, implementation, and customer-success expense.
    - Share CAC, payback period, sales-cycle length, and quota-carrying headcount productivity.
  - - LTV / contribution margin
    - 'null'
    - low
    - Needed to know whether the current growth model creates economic surplus or just front-loads spend.
    - Provide LTV assumptions and contribution margin by cohort.
  - - Burn / runway
    - 'null'
    - low
    - Fresh capital reduces immediate concern, but not enough to underwrite capital adequacy.
    - Provide cash balance, monthly burn, and base/downside runway.
  - - Revenue recognition policy
    - 'null'
    - low
    - Without policy detail, ARR headlines cannot be converted into revenue-quality confidence.
    - Provide accounting memo for subscriptions, pilots, services, and partner-linked deals.
  notes: Nulls are intentional. The public pack supports demand and financing analysis far better than conventional SaaS unit-economics analysis.
