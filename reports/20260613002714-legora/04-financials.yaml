  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Series B
    - 'May 2025: $80M at $675M valuation'
    - medium
    - Establishes the starting point for the current valuation step-up.
    - Confirm exact close date, ownership changes, and governance rights.
  - - Series C
    - 'October 2025: $150M at $1.8B valuation'
    - high
    - Shows the company was already scaling quickly before the 2026 breakout round.
    - Provide term sheet, post-money, and any secondary components.
  - - Series D initial close
    - 'March 2026: $550M at $5.55B valuation'
    - high
    - This is the core external validation event and funds U.S. expansion.
    - Provide investor allocations, preferences, and board-rights changes.
  - - Series D extension
    - 'April 2026: +$50M to $600M total at $5.6B post-money'
    - high
    - Shows capital remained available one month later and added strategic investors.
    - Clarify whether the extension changed economics or governance.
  - - Cash, burn, runway
    - Not publicly disclosed
    - low
    - Headline fundraising does not answer solvency or timing of next capital need.
    - Provide current cash, monthly net burn, and runway under base/downside cases.
  - - Debt or other obligations
    - No public debt facility identified in reviewed pack
    - low
    - Hidden obligations can materially alter dilution and liquidity risk.
    - Disclose debt, leases, guarantees, and any venture-debt or credit facilities.
  notes: Capital access is well evidenced; capital adequacy is not. The missing variables are cash, burn, debt, and runway rather than round headlines.
