- id: TI006
  title: Funding progression and benchmark table
  columns:
  - Reference point
  - Value
  - Interpretation
  - Benchmark implication
  - Caveat
  rows:
  - - Legora Series B valuation
    - $675M
    - First disclosed 2025 valuation anchor.
    - Shows how fast investor expectations reset in less than one year.
    - Private-company mark; not a public-market price.
  - - Legora Series C valuation
    - $1.8B
    - Large step-up only months after Series B.
    - Confirms strong financing momentum before the 2026 mega-round.
    - Still no public revenue figure disclosed at that time.
  - - Legora Series D valuation
    - $5.55B to $5.6B
    - Implies extreme confidence in U.S. expansion and product leadership.
    - Creates a high bar for future growth, margin expansion, and exit outcomes.
    - Headline valuation says little about liquidation preferences.
  - - Legora implied ARR multiple
    - About 55x to 56x on $100M ARR
    - Rich even by top-tier software standards.
    - Leaves limited room for execution misses if growth slows.
    - Based on ARR, not audited revenue or free cash flow.
  - - Harvey valuation / ARR benchmark
    - $11B valuation; Forbes says $190M ARR by end-2025
    - Closest public peer benchmark in legal AI.
    - Harvey sets the market's expectation ceiling for speed and scale.
    - Harvey's own figures are also private-company disclosures.
  - - Total disclosed Legora equity raised
    - More than $780M across Series B, C, D, and extension
    - Shows access to deep sponsor capital.
    - Provides runway potential, but not proof of efficient capital use.
    - Ignores any undisclosed earlier rounds or secondary sales.
  notes: This table is about financing interpretation, not mark-to-market certainty. The relevant investor question is what operational performance must follow from a 55x-plus ARR multiple.
