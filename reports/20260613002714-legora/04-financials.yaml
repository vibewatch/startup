callouts:
- calloutType: risk
  title: A 55x-plus ARR multiple means top-line proof alone is not enough
  body: Legora has unusually strong public top-line and funding disclosure for a private legal-AI company, but a $5.55B-$5.6B valuation on $100M ARR requires not just continued growth but also eventual proof of durable margins, efficient sales expansion, and a credible path to self-funding.
  claimRefs:
  - CI018
  - CI021
  - CI040
- calloutType: insight
  title: The revenue story is public; the economics story is not
  body: Investors can support the existence of real recurring demand from ARR, customer growth, and enterprise customer names. They still cannot underwrite gross margin, NRR, CAC, or runway from the public record.
  claimRefs:
  - CI001
  - CI023
  - CI034
  - CI035
- calloutType: recommendation
  title: Request a stream-by-stream bridge before treating Legora like mature SaaS
  body: The next diligence package should include pricing realization, segment revenue mix, gross margin by stream, NRR, CAC/payback, cash balance, monthly burn, runway, and financing terms. Without that pack, the business should be treated as a high-potential but incompletely proven enterprise software asset.
  claimRefs:
  - CI034
  - CI035
  - CI036
  - CI040
