- id: gtm-sales-efficiency-proxies-and-cost-shape
  title: GTM motion, sales-efficiency proxies, and cost structure shape
  body: 'The public evidence points to a high-touch enterprise go-to-market model rather than product-led adoption. Official Series D language emphasizes side-by-side rollout with clients, deep workflow embedding, and customer support in key markets; the company is simultaneously opening Houston and Chicago, expanding its U.S. bench, and targeting more than 300 U.S. employees by the end of 2026. The Datasite integration and Qura/Cadastral acquisitions reinforce that reading: Legora is trying to become infrastructure inside high-value legal workflows, not just a research chatbot sold on a self-serve basis. That usually implies longer sales cycles, heavier implementation and customer-success expense, and potentially services-like delivery costs even when revenue is booked as software.


    The best public efficiency proxies are therefore behavioral rather than accounting-based. Legora says surveyed law firms saved 4.3 non-billable hours per lawyer per week and that 42% reported new work won due to the platform. Those are useful ROI indicators for enterprise buyers, but they are not substitutes for CAC, payback, or net retention. Cost-structure evidence is likewise indirect: 40 to 400 employees in a year, nine global offices by April, additional U.S. offices in 2026, and continued product and infrastructure investment all imply a substantial burn profile. Because gross margin, support burden, cloud costs, implementation intensity, and customer-acquisition economics are still private, the right diligence posture is to treat Legora as a software business with material service and expansion overhead until management proves otherwise.'
