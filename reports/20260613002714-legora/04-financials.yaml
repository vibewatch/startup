- id: financial-verdict-benchmarks-and-diligence-blockers
  title: Financial verdict, peer benchmarks, and underwriting blockers
  body: 'Legora''s public financial case is stronger than many private software companies because the company has disclosed both headline ARR and a detailed financing curve, and independent press broadly corroborates both. The Harvey benchmark nevertheless keeps expectations high: Harvey reported a $200 million round at an $11 billion valuation in March 2026, more than 100,000 lawyers at 1,300 organizations, and Forbes said it reached $190 million ARR by the end of 2025. TechCrunch added that Dealroom viewed Harvey and Legora as being on almost identical revenue trajectories, implying the market will judge Legora against the fastest legal-AI peers rather than against generic vertical SaaS averages.


    The main adverse lesson is that rapid narrative growth does not eliminate execution risk. Robin AI''s late-2025 layoffs, failed fundraise, and distressed sale process show that legal AI companies can still hit a wall when growth underperforms an investor base expecting outsized outcomes. For Legora, the bull case is real recurring demand plus deep investor sponsorship; the caution is that a 55x-plus ARR multiple, rapid hiring, and expanding workflow scope leave little room for margin disappointment. The core blockers remain the same: no disclosed pricing realization, no gross-margin or retention data, no CAC/payback evidence, no cash or runway visibility, and no audited filings for the main operating business. Until those are supplied, the correct verdict is promising revenue quality with incomplete proof of durability, margin path, and self-funding capacity.'
