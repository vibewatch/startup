tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / pricing basis
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core legal workflow subscription
    - Recurring enterprise software sold to law firms and in-house teams for research, review, drafting, and agentic workflows.
    - Contracted platform subscription; exact seat, matter, or usage metric undisclosed.
    - $100M+ ARR disclosed, but no stream split or realized pricing disclosed.
    - High if primarily recurring software, but quality cannot be confirmed without mix and retention data.
    - Request revenue by segment, geography, contract length, and revenue-recognition policy.
  - - Workflow expansion within existing accounts
    - Customers expand from discrete research or review tasks into multi-step document workflows and structured outputs.
    - Unknown expansion basis; likely more seats, workspaces, or workflow volume.
    - Public evidence shows broader workflow adoption, not monetization detail.
    - Potentially high because expansion inside enterprise accounts usually carries strong gross margin, but NRR is undisclosed.
    - Provide cohort expansion data, logo retention, and NRR by customer segment.
  - - Corporate legal department deployments
    - In-house teams adopt the same platform previously proven with outside counsel.
    - Enterprise agreement; no public price point.
    - Official extension release says corporate legal is one of the fastest-growing segments.
    - Potentially attractive because buyer value is tied to labor savings and faster turnaround, but sales cycle and service load are unknown.
    - Break out corporate legal revenue, win rates, and implementation burden.
  - - Datasite-enabled diligence workflows
    - Partnership allows Datasite documents to be analyzed inside Legora, potentially deepening transaction-workflow usage.
    - Bundled platform value or partner-linked enterprise expansion; no public attach pricing.
    - Commercial importance is visible, direct revenue contribution is not.
    - Medium to high if it drives upsell and retention rather than low-margin services.
    - Quantify partner-sourced pipeline, ACV uplift, and support cost.
  - - Legal research moat via Qura and adjacent workflows via Cadastral
    - Acquisitions extend content depth and workflow coverage rather than create separately priced public SKUs.
    - No standalone public pricing.
    - Strategically important; financial contribution not separately disclosed.
    - Medium until management shows whether acquisitions improve retention, pricing power, or gross margin.
    - Provide post-acquisition revenue contribution, integration cost, and margin impact.
  notes: Public evidence supports a recurring enterprise software core, but no source in the reviewed pack discloses stream-level revenue mix or standalone pricing by module.
