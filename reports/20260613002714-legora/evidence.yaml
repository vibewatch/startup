evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and any founder or investor control-rights summary.
    whyItMatters: >-
      A multibillion-dollar late-stage company should be underwritten with governance visibility, especially given the
      pace of hiring and capital formation.
    diligencePath: Request the current board deck index, board roster, and financing governance documents under NDA.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: Definitive incorporation, rebrand, and commercial-launch chronology tying together 2020 and 2023 public dates.
    whyItMatters: >-
      Founding chronology affects narrative credibility, employee-tenure interpretation, and investor claims about
      growth speed.
    diligencePath: >-
      Request certificate-of-incorporation dates, earlier trading names, and an approved company timeline from
      management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table, ownership by round, and terms for the Series D plus the April 2026 extension.
    whyItMatters: Without ownership and preference data, valuation and downside protection cannot be assessed rigorously.
    diligencePath: Request the latest cap table and stock purchase agreements from counsel or finance.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: operating-kpis
    missingEvidence: >-
      A single dated operating KPI sheet reconciling customers, users, offices, and employees across all official
      surfaces.
    whyItMatters: Unsynchronized public metrics create avoidable uncertainty around scale and disclosure discipline.
    diligencePath: Ask investor relations for a current KPI one-pager and date-stamped public-fact sheet.
    relatedQuestionRefs:
      - QO014
      - QO023
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      No public breakout of the SAM for AI-native workflow platforms (distinct from e-discovery, CLM, and legal
      analytics), making it impossible to calculate Legora's precise addressable market from public data alone.
    whyItMatters: >-
      Without a clean SAM figure, it is hard to determine whether Legora's $100M ARR represents high or low penetration
      of its true competitive arena, which affects both the growth outlook and the valuation multiple justification.
    diligencePath: >-
      Request management's internal SAM definition, the firmographic breakdown of Legora's addressable law firm
      universe, and any industry-analyst reports they rely on for market sizing in their board materials.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Net revenue retention (NRR) and gross revenue retention for Legora are not publicly disclosed, making it
      impossible to verify whether rapid top-line ARR growth is accompanied by strong cohort retention.
    whyItMatters: >-
      High NRR is the primary evidence that workflow embedding is real and that customers expand their use over time.
      Without it, the ARR growth could reflect new logo acquisition masking churn in early cohorts.
    diligencePath: >-
      Request cohort-level retention data, average contract value by segment, and expansion revenue as a share of total
      ARR from the last four quarters.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: minor
    topic: hallucination-risk
    missingEvidence: >-
      No 2026-specific published benchmark or incident report on hallucination rates in legal AI platforms was found
      during this research run; the Mata v. Avianca (2023) case was the most recent adverse incident in the public
      record.
    whyItMatters: >-
      Hallucination risk is frequently cited as a constraint on adoption in high-stakes legal matters, but without
      current benchmark data it is unclear how much the issue has been mitigated by model improvements since 2023.
    diligencePath: >-
      Search for post-2024 court rulings or bar association guidance on AI hallucination incidents; request any internal
      accuracy benchmarks or error-rate data from Legora.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      The three analyst estimates for 2026 legal AI market size span $4.7B–$5.59B without a clear reconciliation of
      definitional scope — particularly regarding the inclusion of e-discovery processing revenue, hardware, and
      consulting services.
    whyItMatters: >-
      If the SAM for AI-native workflow platforms (Legora's primary segment) is closer to the MarkWide lower bound after
      excluding e-discovery and CLM incumbents, Legora's implied penetration and market opportunity would be materially
      smaller.
    diligencePath: >-
      Compare each analyst's segment classification to Legora's product scope; request a market-sizing memo from
      management that specifies which estimate they use for board planning purposes.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: geography
    missingEvidence: >-
      No geographic revenue breakdown for Legora is publicly available; the US-to-Europe ratio of legal spending is
      CEO-cited but not independently verified per this research run.
    whyItMatters: >-
      US revenue concentration is the most critical near-term growth signal. Without the revenue split, it is unclear
      whether Legora's US push has yet translated into US revenue leadership.
    diligencePath: >-
      Request US vs. Europe vs. APAC ARR split and US sales pipeline metrics from management; cross-check against office
      headcount distribution.
    relatedQuestionRefs:
      - QM020
  - type: missing-source
    severity: material
    topic: pricing-data
    missingEvidence: >-
      Actual ACV or per-seat pricing for Legora and Harvey; neither company discloses pricing publicly and no
      independent pricing database or procurement filing was accessible during this run.
    whyItMatters: >-
      Without pricing data, buyer-side ROI calculations and competitive win/loss analysis are speculative; a wide
      pricing gap between Legora and Harvey would materially affect competitive positioning.
    diligencePath: >-
      Request current pricing schedules from Legora management; review any third-party procurement filings, law-firm
      technology spend reports, or analyst pricing benchmarks (e.g., Gartner, Forrester).
    relatedQuestionRefs:
      - QP012
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      No public win-rate, pipeline data, or documented competitive displacement evidence is available for Legora vs
      Harvey in US enterprise law-firm deals.
    whyItMatters: >-
      Without win/loss data, it is unclear whether Legora is successfully converting Series D momentum into AmLaw 100
      wins or whether Harvey is capturing the majority of new enterprise engagements.
    diligencePath: >-
      Request a competitive summary from Legora management; seek reference calls with firms that evaluated both Harvey
      and Legora; review any Legora-commissioned analyst data or Net Promoter Score studies.
    relatedQuestionRefs:
      - QP019
  - type: stale
    severity: minor
    topic: harvey-2026-product-roadmap
    missingEvidence: >-
      Specific Harvey product announcements and feature releases in 2026 beyond the March funding announcement are not
      publicly available in detail.
    whyItMatters: >-
      Harvey may have introduced collaborative workspace or multi-jurisdiction features in 2026 that would erode
      Legora's differentiation; the competitive gap description in this chapter relies on product pages current as of
      June 2026.
    diligencePath: >-
      Monitor Harvey's official blog and LinkedIn updates in H2 2026; request a Harvey product demo to assess current
      feature parity.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: legora-competitive-win-evidence
    missingEvidence: >-
      No public record of a named customer confirming they switched to Legora from Harvey or an incumbent tool (e.g., TR
      CoCounsel, Lexis+ Protégé) was found during research. Customer case studies on legora.com reference law firms but
      do not identify prior tool displacement.
    whyItMatters: >-
      Without documented competitive wins, it is difficult to verify whether Legora's collaborative workflow pitch
      outperforms incumbents in head-to-head evaluations; customer reference calls are the primary path to resolving
      this.
    diligencePath: >-
      Request a list of customers who previously used Harvey or TR CoCounsel; conduct reference calls with firms that
      ran head-to-head evaluations; review any case studies or analyst references that name displaced tools.
    relatedQuestionRefs:
      - QP016
  - type: missing-source
    severity: minor
    topic: legora-llm-vendor-concentration
    missingEvidence: >-
      No public disclosure from Legora about its primary AI model provider or multi-model strategy was found; Anthropic
      Claude is publicly cited as a partner but the degree of dependency vs multi-model optionality is not disclosed.
    whyItMatters: >-
