- id: TR004
  title: People / execution risk register
  columns:
  - Role / function
  - Dependency or gap
  - Likelihood (1-5)
  - Severity (1-5)
  - Mitigation
  - Diligence path
  rows:
  - - Engineering and product leadership
    - Rapid expansion to 400-plus staff, three engineering poles, and target of 700 EMEA employees within 6-12 months raises manager-bandwidth and release-quality risk.
    - '4'
    - '5'
    - Deep funding and explicit hiring plan give resourcing headroom.
    - Request org chart, engineering-manager spans, release process, and attrition by level.
  - - Customer success / implementation
    - High-touch legal deployment into privileged workflows demands expert onboarding, training, and escalation coverage across regions.
    - '3'
    - '4'
    - Official messaging stresses close-to-customer rollout and legal engineering hubs.
    - Request deployment staffing ratios, escalation SLAs, and customer-success churn by cohort.
  - - Executive bench depth
    - Public evidence is founder-centric and thin on broader management depth, succession, and operator tenure.
    - '3'
    - '4'
    - Strong investor backing can help recruiting, but not substitute for proven bench.
    - Request management bios, tenure, succession coverage, and references for COO / CTO / CISO equivalents.
  - - Capital discipline under valuation pressure
    - A $5.55B-$5.6B valuation, $600M round, and fast U.S./EMEA build-out raise the cost of slowing growth or overbuilding.
    - '3'
    - '5'
    - Large funding base buys time to invest, but also raises the bar for flawless execution.
    - Request hiring productivity, burn path, renewal evidence, and downside plan if growth normalizes.
