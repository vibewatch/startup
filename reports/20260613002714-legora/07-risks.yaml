callouts:
- calloutType: risk
  title: The central risk is trust failure in high-stakes legal workflows
  body: Legora’s biggest downside is not generic SaaS churn but a loss of trust caused by inaccurate, weakly supervised, or insecure outputs in privileged legal work. Because the product thesis has moved from point tools to an agentic operating system, one visible failure can transmit into procurement, renewals, support cost, and valuation simultaneously.
  claimRefs:
  - CR018
  - CR020
  - CR046
  - CR047
- calloutType: insight
  title: Public mitigations are meaningful but still mostly self-described
  body: The company has done more than many peers by publishing a DPA, security measures, subprocessor list, and explicit claims around no model training on customer data. That improves diligence starting position, but investors still need third-party artifacts and Legora-specific error-rate evidence before treating operational risk as contained.
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR050
- calloutType: recommendation
  title: Underwrite dependency risk as a product-quality issue, not a procurement footnote
  body: External models, search tools, legal-content licensors, and VDR partners are not back-office vendors for Legora; they sit inside the product path that determines answer quality, permissions, and customer trust. Any investment case should demand fallback plans and change-management rights for that stack.
  claimRefs:
  - CR012
  - CR015
  - CR041
  - CR042
  - CR048
