sections:
- id: regulatory-and-professional-duty-risk
  title: Regulatory and professional-duty risk is the top underwriting issue
  body: 'Legora operates in one of the least forgiving AI deployment contexts: legal work that combines confidential customer documents, regulated data transfers, and professional duties of competence and candor. The EU AI Act is no longer a distant abstraction; its general application date is August 2026, while prohibited-practices rules and general-purpose AI obligations started earlier. That timing matters because Legora now markets agentic workflows rather than just drafting assistance. In parallel, official privacy and bar guidance points in the same direction: AI systems processing legal work need ongoing governance, DPIAs, transparency, confidentiality controls, and documented human supervision, and the EDPB has already elevated AI-model data protection questions into a formal board opinion. Legora’s public DPA and security materials are better than the bare minimum and do provide real contractual hooks, including audit rights, breach notice, and subprocessor objections. But the current public record still stops short of product-specific compliance proof, regulator correspondence,
    or third-party summaries of how those controls work inside live agentic workflows. The regulatory/legal risk is therefore not that public enforcement has already happened; it is that the company has moved into high-stakes use cases faster than public evidence shows its governance can be independently verified.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
