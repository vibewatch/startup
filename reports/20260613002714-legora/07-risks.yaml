company:
  name: Legora
chapter:
  number: 7
  title: Risks
  summary: Legora’s public risk profile is dominated by the mismatch between how ambitious the product has become and how much independently verifiable control evidence is available. The company has published better-than-average legal, privacy, and security materials for a private legal-AI startup, but the core exposures remain legal-output reliability, confidentiality in privileged workflows, partner-stack dependence, and execution strain from hypergrowth under a $5.6 billion valuation.
  letter: R
  contentRequirements:
  - Severity-ranked risks with likelihood, impact, mitigation maturity, residual exposure, and investment implication.
  - Regulatory/legal risk — licenses, approvals, litigation, enforcement, IP, privacy, environmental/safety.
  - Operational risk — supply chain, manufacturing, logistics, reliability, outages, recalls, safety, facilities, labor.
  - Partner/dependency risk — supplier, distributor, cloud/platform, capital provider, regulator, key customer concentration.
  - Financial/model risk — burn, capital intensity, credit/loss exposure, fraud, working capital, margin compression.
  - Mitigations, monitoring indicators, thesis-break triggers, and diligence asks.
