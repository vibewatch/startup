- id: dependency-and-partner-risk
  title: Dependency risk sits inside the product itself, not outside it
  body: Legora’s strongest commercial pitch—authoritative legal research and AI embedded directly in legal workflows—also creates a dense dependency graph. Public materials show a stack that includes multiple cloud and model vendors, search providers, translation providers, legal-content sources, and workflow-control partners such as Datasite. Those are not generic vendor relationships. They affect whether the system can retrieve current law, preserve permissions, reason over documents, and keep customer procurement teams comfortable with the architecture. The legal-research product openly mixes internal databases, licensed legal content, and the open web, which means provenance management and partner freshness are permanent operating disciplines rather than one-time setup tasks. Qura and Wolters Kluwer help close content gaps, but they also confirm that the moat is still being assembled and licensed market by market. Datasite similarly improves workflow security by avoiding manual exports,
    yet it concentrates trust in permission propagation and API integrity. For regulated customers, every material change to this stack can reopen privacy, procurement, and legal review, especially because the DPA explicitly gives customers rights to object to new subprocessors.
  claimRefs:
