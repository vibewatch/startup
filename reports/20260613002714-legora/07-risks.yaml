    - California guidance highlights agentic confidentiality risks, and OWASP’s LLM Top 10 flags prompt injection, sensitive-information disclosure, insecure plugin design, and excessive agency; Legora’s own workflows span open web, internal data, partner content, and VDR integrations.
    - '3'
    - '5'
