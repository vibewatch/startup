- id: people-execution-and-kill-criteria
  title: Execution risk is amplified by hypergrowth, public metric drift, and premium valuation pressure
  body: 'Legora is trying to scale like a category winner before its control evidence is category-winner quality. Independent and official sources converge on very fast expansion: more than 400 employees, a target of 700 EMEA staff within a year, more than 300 U.S. employees expected by year-end, and a 16-city global footprint. That can create a large distribution and engineering advantage, but it also multiplies onboarding, release, support, and management-bandwidth risk. The public leadership story is still founder-led and comparatively thin on bench depth, which means investors should not assume the operating layer is as mature as the financing layer. The financing layer is unmistakably premium: a $550 million Series D followed quickly by a $50 million extension at a $5.6 billion post-money valuation. In that setup, execution misses do not have to be catastrophic to break the thesis; they only have to be visible enough to slow expansion, unsettle procurement teams, or raise questions
    about whether the company is ahead of its governance curve. The practical response is to convert these concerns into kill criteria tied to incidents, quality metrics, partner change-management, and evidence of operating discipline during scale.'
