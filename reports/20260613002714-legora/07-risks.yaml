  evidenceGaps:
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: Independent public documentation of any Legora-specific security incident register, regulator correspondence, or court dispute involving AI output misuse.
    whyItMatters: The absence of public incidents is not the same as proof of no incidents, so investors still need direct diligence before treating operational exposure as de minimis.
    diligencePath: Request security incident history, regulator inquiry log, customer complaint log, and outside-counsel summary for the last 24 months.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: compliance-proof
    missingEvidence: Independent audit artifacts behind ISO 42001, ISO 27001, SOC 2, and penetration-testing outcomes, plus any customer-facing uptime or incident metrics.
    whyItMatters: Public pages describe controls, but underwriting security maturity requires third-party evidence rather than marketing-level control descriptions.
    diligencePath: Request current certificates, SOC report bridge letter, pen-test executive summaries, and quarterly uptime/SLA history.
    relatedQuestionRefs:
    - QR021
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: leadership-bench
    missingEvidence: Management bench map, attrition data, engineering-manager spans, and operating cadences for U.S. and EMEA scaling.
    whyItMatters: Hypergrowth to 400-plus staff and a 700-EMEA target can fail operationally even when demand is strong if management depth and hiring quality lag.
    diligencePath: Request org chart, monthly attrition by function, hiring plan, and references on engineering and customer-success leaders.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: output-quality-metrics
    missingEvidence: Legora-specific hallucination, override, escalation, citation-verification, and support-ticket metrics for agentic workflows and legal research outputs.
    whyItMatters: The central operating risk is quality at scale, yet no public source discloses defect rates or how often lawyers must correct or suppress bad outputs.
    diligencePath: Request internal quality dashboards, red-team findings, customer escalation statistics, and model-governance review materials.
    relatedQuestionRefs:
    - QR011
    - QR019
    - QR022
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: partner-commercials
    missingEvidence: Commercial concentration, renewal dependencies, SLAs, and exit provisions for core model, search, VDR, and legal-content partners.
    whyItMatters: Dependency risk is partly contractual rather than technical, and the commercial layer determines how quickly Legora can respond if a partner changes price, access, or terms.
    diligencePath: Request top-partner contract summaries, concentration by spend and revenue influence, and contingency plans for each critical partner.
    relatedQuestionRefs:
    - QR009
    - QR010
    - QR024
    - QR026
    relatedTableRefs:
    - TR003
