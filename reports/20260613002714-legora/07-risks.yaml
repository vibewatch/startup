- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Legal-output reliability failure
    - Documented fabricated authority, wrong statutory text, or repeated customer escalation tied to Legora outputs
    - Two independent customer incidents in material matters, one court sanction, or management cannot show override / correction metrics
    - Pause underwriting or require hard contractual holdbacks until product QA evidence and human-review gates are proven.
  - - Confidentiality or privacy failure
    - Public incident, regulator inquiry, or customer-notified breach involving privileged content
    - Any confirmed incident involving customer legal material or inability to explain tool-call / access logs
    - Move to avoid unless incident scope, root cause, and remediation are independently verified.
  - - Dependency shock
    - Critical vendor, content partner, or VDR integration changes terms or degrades service
    - Loss of authoritative content feed, major model / search vendor change, or repeated integration outage in live matters
    - Treat as thesis impairment until fallback stack and customer migration plan are proven.
  - - Execution overload
    - Hiring pace outruns controls, support, or release quality
    - Attrition spikes, slowed implementation, missed SLAs, or rising quality escalations during regional expansion
    - Cut position size, demand operating metrics, or wait for post-scale stabilization.
  - - Valuation-growth mismatch
    - Growth and renewal proof stop justifying premium narrative
    - ARR growth decelerates materially while trust or quality metrics weaken, or key customers delay expansion over risk concerns
    - Re-underwrite to a lower multiple or walk if management cannot show resilient retention and margin path.
  notes: These kill criteria are intentionally monitorable and should be paired with diligence rights, information covenants, or board-reporting asks if the process advances.
