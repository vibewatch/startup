tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Public evidence
  - Jurisdiction / surface
  - Likelihood (1-5)
  - Severity (1-5)
  - Current mitigation
  - Residual exposure
  - Investment implication / diligence path
  rows:
  - - AI Act, GDPR, and legal-ethics compliance drift as agentic workflows expand
    - AI Act phases are active before full Aug. 2026 go-live; ICO, NYC Bar, and California Bar all require governance, transparency, confidentiality, and human supervision for legal AI.
    - EU, UK, U.S. legal profession
    - '4'
    - '5'
    - Legora markets ISO 42001 governance, legal-source partnerships, DPA terms, and human-in-the-loop positioning.
    - High until product-specific DPIAs, deployment controls, and lawyer-supervision rules are evidenced by customers.
    - Request product-by-product compliance matrix, DPIAs, customer role mapping, and outside-counsel memo on AI Act / GDPR applicability.
  - - Privilege or confidentiality leakage through prompts, integrations, or autonomous actions
    - Bar guidance warns against sharing confidential data without safeguards; Legora’s DPA and security pages show controls but also acknowledge sensitive regulated customers.
    - Cross-border legal workflows
    - '3'
    - '5'
    - No training on customer data, written approval for support access, BYOK, SSO, retention controls, and audit rights.
    - High because legal matters involve privileged, regulated, and often cross-border data.
    - Request architecture walkthrough, logging boundaries, red-team results, and sample customer access-approval workflow.
  - - Hallucinated or fabricated authority leading to malpractice, sanctions, or customer trust damage
    - Stanford, NYC Bar, NYSBA, and Thomson Reuters all document persistent hallucinations and sanctions in legal practice.
    - Courts, law firms, enterprise legal teams
    - '4'
    - '5'
    - Legora emphasizes authoritative sources, citations, and legal-content partnerships.
    - High because the product explicitly promises end-to-end legal work and lawyers remain liable for bad outputs.
    - Request Legora-specific accuracy benchmarks, human-review checkpoints, and customer escalation logs for false citations or bad reasoning.
  - - Subprocessor or transfer-map changes triggering procurement delay or legal challenge
    - Legora offers objection rights to new subprocessors and uses multiple AI, cloud, search, and translation vendors across EU and U.S. surfaces.
    - Customer contracting and privacy review
    - '3'
    - '4'
    - DPA transparency, SCC language, and published subprocessor list improve transparency.
    - Medium-high because each material vendor change can reopen enterprise diligence.
    - Request quarterly subprocessor-change history, transfer assessments, and contract fallbacks for critical vendors.
  notes: Severity-ranked from a public-evidence perspective; the register does not replace privileged legal analysis and reflects only evidence available on or before 2026-06-13.
  enumerationScope:
    coverage: partial
    basis: Severity-ranked public register of the main external legal and regulatory exposures visible in public evidence as of the run date, not an exhaustive privileged legal memo.
