- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and preferences
    - Post-Series-D capitalization table, share classes, liquidation preferences, anti-dilution, and any structure favoring insiders or strategics.
    - Late-stage return quality depends on who gets paid first in flat or moderately up outcomes.
    - Request from CFO / lead investor under NDA before any term-sheet work.
  - - Retention and gross margin
    - NRR, gross margin, services burden, and cohort behavior by law-firm versus corporate segment.
    - These are the core variables that determine whether Legora deserves software-like premium multiples.
    - Request audited KPI pack and cohort tables.
  - - CAC, payback, and sales efficiency
    - CAC, payback period, sales-cycle length, and expansion contribution to new ARR.
    - Strong growth without efficient acquisition can still produce poor investor returns at a high entry price.
    - Request board materials or go-to-market KPI dashboard.
  - - Cash burn and runway
    - Current cash balance, monthly net burn, hiring plan, and the minimum runway threshold management targets.
    - A fast-growing company at this price can still force a painful next round if burn outruns market appetite.
    - Request finance model and latest management accounts.
  - - Corporate legal and partner mix
    - Revenue share, logo mix, ACV, and retention for corporate legal deployments plus partner-sourced workflows such as Datasite.
    - This is the cleanest test of whether workflow breadth is real monetization or narrative embellishment.
    - Request segment bridge and partner-influenced pipeline analysis.
  - - Exit and liquidity readiness
    - Internal planning for next round, secondary liquidity, IPO readiness, and strategic-interest map.
    - If disclosure quality stays thin, the medium-term exit path matters more than the abstract long-run TAM.
    - Ask management and lead investors how they expect a 2x-3x outcome to be realized from here.
  notes: Items are ordered by how directly they could change the entry-price decision; the first four are effectively blocking for a full-conviction buy case.
