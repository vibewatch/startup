- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Harvey
    - $11.0B valuation on $190M ARR
    - ~57.9x ARR
    - Closest private legal-AI leader and the clearest scarcity-premium reference.
    - Private mark in a hot funding market; economics disclosure remains limited.
  - - DocuSign
    - $8.59B market cap on $3.21B revenue
    - ~2.7x revenue
    - Large-scale agreement and CLM workflow platform with mature distribution.
    - Broader product mix and much slower growth than Legora.
  - - Intapp
    - $1.84B market cap on $0.54B revenue
    - ~3.4x revenue
    - Vertical software platform for law and other regulated professional firms.
    - Smaller scale and broader end-market mix than a pure legal-AI platform.
  - - CS Disco
    - $0.22B market cap on $0.15B revenue
    - ~1.5x revenue
    - Public legal-tech pure-play showing how unforgiving markets can be to slower-growth legal software.
    - Different product set and weaker growth profile than Legora.
  - - Thomson Reuters
    - $35.53B market cap on $7.66B TTM revenue
    - ~4.6x revenue
    - Data-rich legal incumbent with durable workflow and content assets.
    - Mature diversified incumbent, not a fast-growing private AI platform.
  - - RELX
    - $59.44B market cap on $11.83B revenue
    - ~5.0x revenue
    - Another data-moat legal/professional information incumbent and the high end of the public comp range.
    - Global scaled incumbent with different margin, growth, and portfolio mix.
  notes: Public-comp values use June 2026 market-cap and revenue pages; Harvey provides the only directly comparable private legal-AI premium reference in the reviewed source pack.
  enumerationScope:
    coverage: partial
    basis: Rows intentionally cover the most decision-useful direct private peer plus adjacent public legal and workflow software references available in public sources as of 2026-06-13; this is not an exhaustive software comp screen.
