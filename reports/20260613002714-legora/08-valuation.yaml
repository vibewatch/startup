- id: scenario-range-return-discipline-and-exit-readiness
  title: Scenario range, return discipline, and exit readiness
  body: 'Return math is the core reason to stay disciplined. A new investor entering at $5.6 billion needs more than $11.2 billion of exit equity value for a simple 2x gross multiple of invested capital before dilution, and more than $16.8 billion for 3x. If the company needs another 15% to 20% dilution before exit, the 3x hurdle rises above $20 billion. That is possible, but it requires Legora to scale from $100 million ARR toward several hundred million while still defending a premium multiple far above public comps. The bull case therefore needs both operating delivery and sustained scarcity: roughly $250 million to $300 million ARR plus a 35x to 40x multiple can justify $8.8 billion to $12.0 billion, creating only moderate upside from the current mark unless later dilution is minimal. The base case assumes continued growth but partial multiple convergence, landing near flat to modest downside. The bear case is not zero, but it is painful: slower growth plus public-market-style multiples
    produces a meaningful markdown. That profile argues for patience and for treating any near-term exit as more likely another private financing or a strategic transaction than a clean public-market debut.'
