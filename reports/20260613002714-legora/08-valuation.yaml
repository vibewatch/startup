sections:
- id: price-sensitive-recommendation
  title: Price-sensitive recommendation, thesis, and anti-thesis
  body: 'The investable question is not whether Legora is real; it is whether a new investor can still earn an attractive return from the latest public mark. The positive case is substantial. Official and independent sources align that Legora reached more than $100 million ARR by early April 2026, expanded past 1,000 customer organizations in 50-plus markets, scaled from roughly 40 to 400 employees, and still found demand for a $50 million extension only weeks after closing a $550 million Series D. The Harvey comparison also matters: the market is clearly willing to pay a scarcity premium for category-leading legal AI platforms that look like workflow infrastructure rather than single-task copilots. The anti-thesis is that the current price already capitalizes much of that narrative. At roughly 56x disclosed ARR, Legora is priced almost exactly like Harvey and far above every public legal or workflow software comparable reviewed here, while still withholding NRR, gross margin, CAC, burn,
    cash, and preference-stack terms. That combination supports a Track recommendation rather than a Buy: strong company, expensive entry, and too much dependence on undisclosed private KPIs.'
