- id: kill-triggers-and-final-diligence-asks
  title: Kill triggers and final diligence asks
  body: 'The main reason not to stretch for the round is that the missing diligence is exactly the diligence that determines late-stage return quality. Public sources prove adoption and financing access, but they do not show how the $600 million round sits in the cap table, whether retention and gross margin justify software-like durability, or whether cash burn and runway force another aggressive financing soon. The best adverse evidence is not about Legora specifically but about the category: Robin AI’s layoffs and distressed sale process in late 2025 show how quickly legal AI narratives can break when growth and fundraising slip behind expectations. For Legora, the thesis breaks if the next financing prices below the current mark, if disclosed ARR growth decelerates sharply without margin proof, or if workflow-expansion stories fail to convert into sticky recurring revenue. The diligence agenda is therefore straightforward: get the cap table, get cohort retention and gross margin, get
    cash-burn and runway, and quantify whether corporate-legal and partner-led workflows are truly compounding rather than just expanding the story.'
