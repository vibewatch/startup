  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Post-Series-D capitalization table, liquidation preferences, anti-dilution terms, and any structured rights granted to new or strategic investors.
    whyItMatters: A late-stage investor can be correct on enterprise value growth and still earn weak common-equivalent returns if preference overhang is heavy.
    diligencePath: Request the cap table and term sheet from management or lead investors under NDA before underwriting the round.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-runway
    missingEvidence: NRR, gross margin, CAC/payback, cash balance, monthly burn, and runway policy.
    whyItMatters: These are the core variables that determine whether Harvey-like multiples are durable or vulnerable to fast compression.
    diligencePath: Request management KPI decks, cohort tables, and current management accounts with burn and runway analysis.
    relatedQuestionRefs:
    - QV016
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: material
    topic: corporate-legal-segment-mix
    missingEvidence: Revenue share, ACV, retention, and net expansion data for corporate legal deployments and partner-enabled workflows.
    whyItMatters: Workflow-depth narratives only support premium valuation if they produce measurable segment economics rather than marketing breadth.
    diligencePath: Request a segment bridge showing law-firm versus corporate mix, partner-sourced pipeline, and expansion contribution.
    relatedQuestionRefs:
    - QV017
    relatedTableRefs:
    - TV002
    - TV006
  - type: missing-source
    severity: material
    topic: exit-planning-and-liquidity
    missingEvidence: Management view on next-round timing, secondary liquidity, IPO readiness, and strategic-interest map.
    whyItMatters: At a $5.6 billion entry, return timing and exit path materially affect underwriting even if the business keeps growing.
    diligencePath: Ask management and lead investors how they specifically expect a 2x-3x outcome to be realized from the current mark.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable-set-boundary
    missingEvidence: A broader software comp screen including additional public legal, information, and workflow vendors beyond the six rows shown in TV004.
    whyItMatters: TV004 is intentionally selective and decision-oriented rather than exhaustive, so readers should not treat it as a full market map of every possible comparable.
    diligencePath: Expand the comp screen during live diligence if the committee wants a wider public-SaaS or adjacent-information benchmark set.
    relatedQuestionRefs:
    - QV009
    relatedTableRefs:
    - TV004
