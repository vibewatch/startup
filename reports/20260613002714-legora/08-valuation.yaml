- id: current-mark-versus-public-and-private-comps
  title: Current mark versus private premium and public comparables
  body: 'The cleanest valuation framing is simple. Legora’s $5.6 billion post-money value on $100 million-plus ARR implies about 56x ARR. Harvey’s March 2026 financing sits in the same neighborhood at roughly 58x ARR on $11 billion valuation and $190 million ARR, which shows the private market is paying premium multiples for the very top legal AI names. The public market is much less forgiving. Adjacent legal and professional-software businesses trade on markedly lower revenue multiples: about 2.7x for DocuSign, 3.4x for Intapp, 1.5x for CS Disco, 4.6x for Thomson Reuters, and 5.0x for RELX using June 2026 market-cap and revenue data. The comp set therefore says Legora is not merely above public comps; it is more than an order of magnitude above the high end of the public range. That does not make the round irrational, because Legora’s growth is much faster than mature public peers, but it means price support now depends on sustaining Harvey-like scarcity and proving much stronger economics
    than anything visible in the public record.'
