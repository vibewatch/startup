company:
  name: Legora
chapter:
  number: 8
  title: Valuation
  summary: Legora looks like a strong company at a difficult price. Public evidence supports the operating story — $100 million-plus ARR, more than 1,000 customers, and a $600 million Series D — but the latest $5.6 billion post-money valuation equates to roughly 56x ARR, close to Harvey’s private premium and far above public legal and workflow software comps that mostly trade around 1.5x to 5.0x revenue. The public-only verdict is Track with medium confidence, high risk, and an expensive valuation stance until management discloses retention, margins, burn, and cap-table terms or the entry price resets.
  letter: V
  contentRequirements:
  - Investment thesis and anti-thesis tied to market, product, customers, financials, competition, and risks.
  - Recommendation, confidence, risk rating, valuation stance, and target return/hold/exit where supportable.
  - Current financing/valuation context, entry discipline, dilution/preference overhang, and whether public evidence supports the price.
  - Bull/base/bear cases with explicit assumptions, valuation ranges, probability signals, and downside triggers.
  - Comparable set — public companies, private rounds, M&A, milestone or model-appropriate references.
  - Exit readiness and final diligence asks plus thesis-break triggers.
