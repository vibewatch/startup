- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round financing
    - Any next primary round below the current $5.6B post-money mark
    - Signals that later investors no longer underwrite Harvey-like premium economics.
    - Pause deployment and re-underwrite the cap table before participating.
  - - Growth deceleration
    - Next disclosed ARR milestone points to sub-60% annualized growth or ARR remains below about $150M by mid-2027
    - Weakens the main justification for sustaining a premium multiple above public comps.
    - Downgrade to research-more / avoid until valuation resets.
  - - Economics disappointment
    - Management reveals gross margin below 70% or NRR below 110%
    - Undercuts the software-quality durability required to defend the current multiple.
    - Require materially lower entry valuation or do not invest.
  - - Runway pressure
    - Cash runway below 18 months without a clearly funded plan
    - Raises the odds of dilutive financing under weaker negotiating leverage.
    - Demand cash waterfall, financing plan, and preference-stack analysis immediately.
  - - Workflow monetization miss
    - Corporate-legal or partner-led expansion does not translate into meaningful net expansion or ACV lift
    - Breaks the argument that workflow breadth deserves a structural premium.
    - Treat the business more like a point-solution vendor and re-rate toward public comps.
  - - Category sentiment reset
    - Another well-funded legal-AI peer shows funding stress or forced sale despite real revenue
    - Demonstrates that late-stage category multiples are fragile when capital markets tighten.
    - Increase discount rate, assume faster multiple compression, and revisit downside case.
  notes: Thresholds are public-market monitoring rules rather than company guidance; private KPI disclosure could tighten or relax them materially.
