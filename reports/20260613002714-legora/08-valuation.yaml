- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - ARR expands to roughly $250M-$300M, workflow depth improves pricing power, and the market continues to treat Legora as a Harvey-like scarcity asset.
    - $8.8B-$12.0B at roughly 35x-40x ARR; about 1.6x-2.1x on today's mark before dilution.
    - Possible, but it requires both elite execution and continued private-market exuberance.
    - Any slowdown, dilution, or public-comp convergence erodes the upside quickly.
  - - Base
    - ARR reaches roughly $180M-$220M but the multiple compresses toward 20x-25x as investors demand clearer economics.
    - $3.6B-$5.5B; roughly flat to down versus the current mark.
    - Most plausible from public evidence because growth can continue even while pricing power normalizes.
    - Limited return for new money if economics stay private or the next round is less exuberant.
  - - Bear
    - ARR grows only modestly to roughly $120M-$150M or growth decelerates faster than expected, and valuation converges toward 12x-15x.
    - $1.4B-$2.3B; severe markdown versus $5.6B.
    - Material tail risk, especially if the next financing market is less willing to fund narrative growth.
    - Down-round, preference overhang, and category-sentiment reset could impair equity recovery.
  notes: Scenario outputs are analyst estimates derived from disclosed ARR, peer multiples, and return-hurdle math rather than company guidance.
