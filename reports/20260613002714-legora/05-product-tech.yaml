  - id: deployment-integrations-reliability-and-support
    title: Deployment, integrations, reliability, and support posture
    body: |-
      Deployment is enterprise-oriented rather than self-serve. Security and legal documentation describe a cloud service available through browser, desktop app, APIs where agreed, and plug-ins or add-ins to other software. Product pages show Legora embedded in Word and Outlook, and the supported-countries page shows wide geographic availability with configuration caveats in a few jurisdictions. The Microsoft listing adds SharePoint, Azure, SSO, and data residency options, while the MCP post extends the integration picture to document management systems, CRM tools, e-signature systems, and bespoke internal systems. Taken together, the public evidence supports an enterprise deployment model designed to sit inside an existing legal stack instead of replacing every adjacent system outright.

      Reliability and support evidence is stronger on controls than on service outcomes. The security measures document says backups run every four hours, production access uses MFA, data is replicated across Azure locations, logs are centrally retained for at least twelve months, and annual penetration tests are performed. The DPA adds a 36-hour breach-notice commitment and a formal subprocessor update and objection process. Those are meaningful trust signals, but they are not the same as public uptime history, a status page, or clear response-time/SLO commitments. Support access is tightly controlled and customer-approval based, which is good for confidentiality, but the absence of public reliability metrics means investors still need private diligence on incident rates, recovery performance, support staffing, and how new modules behave under production load.
    claimRefs:
