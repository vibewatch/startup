  - id: differentiation-maturity-and-roadmap
    title: Differentiation, maturity, and roadmap direction
    body: |-
      Legora’s clearest product differentiation is not one isolated model trick; it is the combination of cited legal research, structured multi-document review, workflow orchestration, and Microsoft-native drafting and inbox surfaces inside the same system. Tabular Review remains the most consistently differentiated module in outside commentary, including the adverse GC AI review, because it turns large legal document sets into structured, source-linked grids that can then feed drafting or reporting. Workflows raises the ambition further by chaining research, extraction, drafting, and firm-specific standards in one run. Portal, Lists, and Monitors extend the differentiation from lawyer productivity into client delivery, legal project structure, and regulatory monitoring, which is a broader operating model than a pure assistant SKU.

      The roadmap and maturity picture nonetheless remains uneven, which is normal for a fast-expanding platform but still worth underwriting carefully. The 2026 release cadence points to orchestrated workflows, regulatory monitoring, mobility, inbox integration, and bulk Word editing as the current innovation arc. Lists is explicitly a first iteration, mobile is intentionally narrower than desktop, and Workflows still advertises future additions such as deep research, memory, real-time citation, VDR triggers, and external data fetches. That is encouraging because the company is shipping visibly, but it also means a buyer should not assume every advertised surface is equally mature. The right diligence question is not whether the roadmap is active—it clearly is—but which modules are already production-grade at scale for the customer’s exact workflow and which remain earlier in the adoption curve.
