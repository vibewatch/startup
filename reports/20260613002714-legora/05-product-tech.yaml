  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: public-reliability-gap
      missingEvidence: Customer-facing uptime targets, RTO/RPO commitments, incident history, and a status surface or equivalent reliability reporting for the production platform.
      whyItMatters: Control descriptions are useful, but investors still need outcome evidence to underwrite production reliability for sensitive legal workflows.
      diligencePath: Request the latest reliability pack, status-history exports, incident postmortems, and enterprise SLA or support exhibits for core modules and new releases.
      relatedQuestionRefs: [QE017, QE026]
    - type: private-evidence-only
      severity: material
      topic: api-doc-gap
      missingEvidence: Customer-facing API, SDK, or MCP implementation documents showing connector deployment, file-transfer permissions, auth flows, admin controls, and audit behavior.
      whyItMatters: Integration depth is central to Legora’s product thesis, but public materials remain high-level and do not show how the connector model works in production.
      diligencePath: Request customer integration docs, admin guides, sample MCP server patterns, and architecture walkthroughs for Microsoft, DMS, and bespoke-system deployments.
      relatedQuestionRefs: [QE015, QE016, QE025]
    - type: private-evidence-only
      severity: material
      topic: certification-scope
      missingEvidence: Certificate identifiers, audit scopes, expiry dates, and any bridge letters or summaries for ISO 42001, ISO 27001, and SOC 2 Type 2.
      whyItMatters: Public trust claims are directionally strong, but buyers need scope-level confirmation to know which entities, products, and controls are actually covered.
      diligencePath: Request the latest security pack, trust-center access, auditor letters, and product-to-certification scope mapping for each deployment option.
      relatedQuestionRefs: [QE022, QE018, QE021]
    - type: missing-source
      severity: material
      topic: monitors-gap
      missingEvidence: Independent validation of Monitors coverage quality, source-list completeness, alert precision or recall, and production customer outcomes.
      whyItMatters: Regulatory-monitoring breadth is a major differentiator claim, but it is also the hardest module to verify externally without coverage or quality evidence.
      diligencePath: Ask for reference customers using Monitors in production, source-export samples, alert-quality metrics, and examples of missed-or-caught regulatory changes.
      relatedQuestionRefs: [QE011, QE023, QE026]