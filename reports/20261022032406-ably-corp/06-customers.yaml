    notes: >-
      Values preserve each source's period, currency, and scope; they are not normalized because the assigned evidence
      does not provide a common methodology or exchange-rate basis.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU012, CU013, CU014]
  - id: TU003
