schemaVersion: report-v2
artifact: customers
slug: ably-corp
runDate: 2026-10-22
company:
  name: ABLY Corporation
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows a large consumer audience and a widening portfolio: reported monthly active users rose from
    4.2 million in 2021 to 8.8 million in late 2024, while March 2025 industry data indicated further year-over-year
    growth. The evidence does not establish retention, cohort economics, seller concentration, or named reference
    customers, and a 2026 tax audit creates a material seller-friction diligence issue.
sections:
  - id: customer-segments-and-surfaces
    title: Customer segments and commerce surfaces
    body: >-
      ABLY is a two-sided consumer marketplace rather than a conventional enterprise vendor: shoppers use its
      recommendation-led storefronts, while merchants depend on listing, selling, and delivery infrastructure.
      Bloomberg describes the company as providing women's and men's fashion e-commerce in South Korea, and
      MoneyToday identifies the core ABLY audience as women in their teens and twenties. The portfolio also includes
      the men's-fashion mall 4910 and Japan-facing Amood, with the core service expanding into beauty and household
      goods. These disclosures support buyer and use-case segmentation, but they do not disclose payer mix, merchant
      revenue bands, seller concentration, or surface-level economics. The portfolio therefore broadens addressable
      demand without proving that each surface has durable, independently scaled customer economics.
    claimRefs: [CU001, CU008, CU009, CU010, CU011]
    tableRefs: [TU001, TU003]
  - id: adoption-trajectory
    title: Adoption and transaction trajectory
    body: >-
      Reported usage expanded materially across several point-in-time observations. KED Global reported 4.2 million
      monthly active users in 2021; KoreaTechDesk reported 7 million in 2023; SCMP cited 8.05 million in March 2024;
      and the Korea Herald cited 8.8 million in November 2024. Internet Retailing subsequently reported 21.0% MAU
      growth in March 2025. Separately, BusinessKorea described transaction volume rising from the 700 billion won
      range in 2021 toward the 2 trillion won range in 2024, while Internet Retailing reported 2024 consolidated and
      standalone volumes in translated US-dollar terms. These observations indicate reach and commerce activity, but
      differing dates, currencies, scopes, and source methodologies prevent a clean cohort or monetization comparison.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU012, CU013, CU014]
    tableRefs: [TU002]
  - id: durability-expansion-and-friction
    title: Durability, expansion, and seller friction
    body: >-
      The public record supports plausible expansion mechanisms but not measured durability. ABLY's integrated
      selling-and-delivery workflow can reduce merchant operating friction, while adjacent categories can increase
      shopper purchase occasions. Alibaba's reported investment adds a strategic relationship that could help Asian
      expansion, but no evidence in the assigned pool quantifies channel contribution or dependency. More
      importantly, the sources disclose no NRR, GRR, churn, repeat-purchase rate, cohort curves, contract length, or
      top-seller share. MoneyToday's September 2026 report adds an adverse counterpoint: the National Tax Service was
      auditing ABLY and alleged that the investigated fashion platforms used their market position to impose high
      fees or shift burdens to listed companies. ABLY characterized the audit as routine, so the allegation remains
      unresolved rather than a proven violation.
    claimRefs: [CU009, CU010, CU015, CU016]
    figureRefs: [FU001]
