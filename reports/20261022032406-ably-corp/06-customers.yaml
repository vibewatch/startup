      - ["4910", "Men's-fashion shoppers", "Men's specialty fashion commerce", "Described as an operated specialty mall", null, "No surface-specific customer, usage, GMV, or outcome metric"]
      - ["Amood", "Japanese fashion shoppers", "Japan-facing fashion commerce", "Described as an operated fashion mall", null, "No named customer, usage, seller, GMV, or outcome metric"]
    notes: >-
      This is a partial enumeration of publicly named customer-facing surfaces, not named individual or enterprise
      references; null means no surface-specific outcome was disclosed in the assigned evidence.
    enumerationScope:
      coverage: partial
      basis: Publicly named ABLY-operated commerce surfaces found in the assigned prefetched source pool.
    claimRefs: [CU001, CU004, CU011]
figures:
  - id: FU001
    title: Customer adoption and expansion loop
    type: journey-map
    summary: >-
      Public evidence supports a six-step operating loop from discovery through merchant and geographic expansion,
      while retention and concentration remain unmeasured.
    data:
      items:
        - label: Discover
          detail: Personalized recommendations expose shoppers to fashion inventory.
          touchpoints: ["ABLY app", "Recommendation feed"]
        - label: Browse
          detail: Core women's fashion demand broadens into men's fashion and adjacent categories.
          touchpoints: ["ABLY", "4910", "Beauty and household goods"]
        - label: Purchase
          detail: Large reported MAU creates an audience for marketplace transactions.
          touchpoints: ["Mobile commerce", "Fashion marketplace"]
        - label: Fulfill
          detail: The platform supports product sales and delivery for sellers in one workflow.
          touchpoints: ["Seller operations", "Delivery"]
        - label: Expand basket
          detail: Beauty and household categories create additional shopper occasions.
          touchpoints: ["Beauty", "Household goods"]
        - label: Expand geography
          detail: Amood addresses Japan while Alibaba provides a strategic regional relationship.
          touchpoints: ["Amood", "Alibaba relationship"]
    approximationNotes: >-
      The sequence is an analytical operating loop, not a measured funnel; no conversion, retention, or stage-volume
      rates are inferred.
    claimRefs: [CU009, CU010, CU011, CU015]
callouts:
  - calloutType: strength
    title: Scaled audience with continued momentum
    body: >-
      Four point-in-time sources show MAU rising from 4.2 million in 2021 to 8.8 million in late 2024, followed by
      reported year-over-year MAU growth in March 2025.
    claimRefs: [CU002, CU004, CU005, CU006, CU007]
  - calloutType: risk
    title: Durability and seller economics remain unproven
    body: >-
      Public sources do not disclose retention, repeat-purchase cohorts, seller concentration, or take rate, while a
      2026 tax audit report raises an unresolved allegation that high fees shifted burdens to listed companies.
    claimRefs: [CU016]
