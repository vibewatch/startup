    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: "A reconciled Korean style-commerce market size with geography, channel, category, and denominator definitions, plus an ABLY-specific serviceability filter."
      whyItMatters: "Without a common denominator, company GMV and MAU cannot be translated into a defensible TAM, SAM, SOM, or market share."
      diligencePath: "Obtain a reputable market dataset and management sizing model that reconcile category spend, online penetration, merchant supply, and reachable geographies."
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics-gap
      missingEvidence: "Segment-level take rate, contribution margin, repeat behavior, acquisition cost, returns, subsidy intensity, and seller concentration."
      whyItMatters: "Marketplace throughput and users can grow while merchant or cohort economics deteriorate, changing both adoption durability and valuation relevance."
      diligencePath: "Request monthly buyer cohorts and seller schedules by ABLY, 4910, Amood, and category, reconciled to GMV, revenue, returns, promotions, and contribution margin."
      relatedQuestionRefs: [QM010]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: sizing-basis
      missingEvidence: "A management reconciliation of the May 2021 annual GMV snapshot, 2021 transaction value, consolidated platform GMV, standalone transaction volume, and accounting revenue."
      whyItMatters: "The public sources use different periods and denominators, so they cannot establish a continuous market-share or monetization series."
      diligencePath: "Reconcile audited or management accounts to calendar-period GMV, platform scope, transaction volume, service revenue, and product revenue."
      relatedQuestionRefs: [QM009, QM010]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: regulatory-constraint
      missingEvidence: "Primary National Tax Service documentation, ABLY's detailed response, and any final assessment from the September 2026 audit."
      whyItMatters: "The reporting establishes that an audit was underway and relays allegations, but it does not establish findings, liability, or remediation."
      diligencePath: "Obtain the audit notice, company response, adviser analysis, and final assessment before assigning a quantified financial or market-access impact."
