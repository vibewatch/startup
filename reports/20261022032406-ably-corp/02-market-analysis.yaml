    notes: "Boundary synthesized from the assigned product listing and reporting; GMV, revenue, MAU, downloads, and geographic availability use different denominators and are not additive."
    claimRefs: [CM001, CM002, CM014, CM016]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [Publisher, Year/period, Geography, Value, Growth/metric, Methodology, Confidence, Limitation]
    rows:
      - [KED Global, "May 2021 snapshot", South Korea, "KRW 400 billion", "Annual GMV", "Reported company metric", medium, "Period basis is not reconciled to later calendar-year transaction value"]
      - [KoreaTechDesk, "2021", South Korea, "KRW 700 billion", "Transaction value; 84% year-over-year growth", "Reported company metric", medium, "Company throughput, not market TAM"]
      - [The Chosun Daily, "2025", South Korea, "KRW 2.8 trillion", "Platform GMV; 12% year-over-year growth", "Reported consolidated platform result", medium, "Company GMV, not category spend"]
      - [The Chosun Daily, "2025", South Korea, "KRW 2.5 trillion", "Standalone ABLY transaction volume", "Reported standalone platform result", medium, "Different scope from consolidated platform GMV"]
      - [The Chosun Daily, "2025", South Korea, "KRW 369.7 billion", "Revenue; 10.6% year-over-year growth", "Reported company financial result", medium, "Revenue is not GMV or ARR"]
      - [KED Global, "May 2024", South Korea, "8.33 million", "Monthly active users", "Wiseapp Retail Goods data cited by KED Global", medium, "Engagement measure, not spend or retained buyers"]
      - [The Chosun Daily, "December 2025", South Korea, "3.4 million", "4910 monthly active users", "Reported app metric", medium, "Adjacent-app engagement, not market size"]
    notes: "The sources use different periods, scopes, and denominators. These values are scale lenses only and must not be combined into a TAM/SAM/SOM funnel."
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM010, CM013]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Core style consumers, "Individual shopper", "Individual shopper", "Individual shopper", "Discover, compare, purchase, and receive products", "Household discretionary budget", "Personalized selection, discounts, delivery, and free shipping"]
      - [Core ABLY merchants, "Merchant seeking demand", "Merchant operator", "Merchant through platform fees", "List products, acquire demand, fulfill, and manage sales", "Merchant commerce and distribution budget", "Traffic, seller tools, fulfillment, and acceptable fees"]
      - [4910 men's-fashion consumers, "Individual shopper", "Individual shopper", "Individual shopper", "Discover and buy through a dedicated men's vertical", "Household discretionary budget", "Segment-specific assortment and recommendation"]
      - [Amood ecosystem, "Japanese shopper and Korean seller", "Consumers and merchant operators", "Consumers and participating merchants", "Discover Korean fashion and sell cross-border", "Household and merchant expansion budgets", "Local access, assortment, and export reach"]
      - [Cross-border substitute platforms, "Shopper or merchant", "Consumers and merchant operators", "Consumers and merchants", "Choose a rival multi-region storefront", "Household and distribution budgets", "Geographic availability and established traffic"]
    notes: "Buyer and payer roles are an evidence-constrained operating map, not disclosed customer segmentation; segment take rates, acquisition costs, repeat behavior, and contribution margins remain private."
    claimRefs: [CM001, CM002, CM009, CM010, CM011, CM012, CM014, CM016]
