    - type: private-evidence-only
      severity: material
      topic: capitalization
      missingEvidence: "Signed Alibaba transaction documents, a post-money capitalization table, venture-debt terms, and evidence that any planned follow-on financing closed."
      whyItMatters: "Headline funding does not establish liquidation preferences, governance rights, dilution, debt service, or cash currently available."
