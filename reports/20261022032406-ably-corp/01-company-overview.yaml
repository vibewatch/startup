    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "A complete executive roster, board composition, committee structure, succession plan, and current organization chart."
      whyItMatters: "Founder concentration and undisclosed leadership depth create unquantified key-person, oversight, and execution risk."
      diligencePath: "Request director and executive biographies, board and committee minutes, the organization chart, delegations of authority, and succession materials."
      relatedQuestionRefs: [QO002, QO010]
