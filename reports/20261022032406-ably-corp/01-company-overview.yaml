company:
  name: ABLY Corporation
chapter:
  number: 1
  title: Company Overview
  summary: ABLY is a Seoul-based, privately held Korean style-commerce operator whose portfolio spans the ABLY women's-fashion app, men's platform 4910, and Japan-facing Amood. Alibaba's December 2024 investment validated substantial scale, but incomplete governance and transaction terms, volatile profitability, and a current tax audit keep the company profile materially under-disclosed.
sections:
  - id: identity-and-business-scope
    title: Identity and business scope
    body: >-
      ABLY Corporation is a privately held South Korean commerce company whose main
      app launched in March 2018 after the company was founded in 2015. A private-
      market database places its headquarters in Seoul, but that point lacks a
      primary corporate filing in the assigned evidence and therefore remains less
      certain than the operating identity. Independent news accounts consistently
      describe a portfolio comprising the ABLY women's-fashion platform, men's-
      fashion marketplace 4910, and Japan-facing Amood. The model combines marketplace
      discovery with personalized recommendations, seller enablement, and category
      expansion. This supports a broader style-commerce description rather than a
      narrow apparel retailer, while the legal-entity perimeter and ownership of each
      product remain private-evidence questions.
    claimRefs: [CO001, CO002]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-capital-and-control
    title: Leadership, capital, and control
    body: >-
      Public reporting consistently identifies Watcha co-founder Kang Seok-hoon as
      ABLY's founder and chief executive, but the retained pool does not enumerate a
      broader executive team or board. The clearest ownership event is Alibaba's
      December 2024 investment of KRW 100 billion for a reported 5% stake, implying
      a KRW 3 trillion valuation. That headline does not disclose share class,
      liquidation preference, governance rights, or whether a planned additional
      raise closed. Earlier financing evidence includes a KRW 67 billion pre-Series C
      at a KRW 900 billion valuation in January 2022 and KRW 50 billion of venture
      debt from Pine Tree Asset Management in 2023. The financing history demonstrates
      access to capital, not the amount of unrestricted cash available today.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: scale-and-profitability
    title: Scale and profitability
    body: >-
      ABLY reached approximately 8.8 million monthly active users in October 2024,
      according to two Korean news reports citing WiseApp data. Scale has not produced
      a linear earnings path. Coverage of 2023 reports KRW 259.5 billion of sales and
      KRW 3.3 billion of operating profit, while Chosun Biz reports 2024 revenue of
      KRW 334.3 billion, GMV of KRW 2.5 trillion, and a KRW 15.4 billion operating
      loss. MoneyToday then reports 2025 revenue of KRW 369.7 billion, GMV of about
      KRW 2.8 trillion, and KRW 4.4 billion of operating profit. These period-specific
      figures show growth and a reported return to profit, but they do not disclose
      audited segment economics, cash flow, take rate, or the separate investment
      burden of 4910, Amood, content, and payments.
    claimRefs: [CO009, CO010, CO011, CO012]
  - id: governance-and-regulatory-exposure
    title: Governance and regulatory exposure
    body: >-
      In September 2026, MoneyToday reported that Korea's National Tax Service was
      conducting a tax audit of ABLY; the company characterized it as routine and
      said detailed confirmation was difficult. The same article relayed broader NTS
      allegations concerning two audited fashion platforms, including pricing
      pressure, high fees, and accounting or related-party concerns. Those allegations
      are not findings against ABLY and should not be presented as established
      misconduct. Separately, Korean online-marketplace operators face disclosure,
      withdrawal, advertising, and consumer-complaint obligations. A proposed
      domestic-representative regime concerns foreign businesses without a Korean
      place of business and does not itself show direct applicability to ABLY, but it
      illustrates the tightening framework relevant to cross-border platform expansion.
    claimRefs: [CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Strategic capital validated meaningful scale
    body: Alibaba's reported KRW 100 billion investment for a 5% stake and ABLY's approximately 8.8 million October 2024 MAU support strategic relevance and consumer reach.
    claimRefs: [CO004, CO005, CO012]
  - calloutType: risk
    title: Profitability remains volatile
    body: Public reporting moves from a 2023 operating profit to a 2024 loss and back to a smaller 2025 profit, without audited segment or cash-flow detail.
    claimRefs: [CO009, CO010, CO011]
  - calloutType: assumption
    title: Governance and financing terms require primary evidence
    body: Board composition, leadership depth, Alibaba's exact rights, venture-debt covenants, and the completion of planned follow-on funding remain unsupported by the retained public sources.
    claimRefs: [CO003, CO004, CO006, CO007]
