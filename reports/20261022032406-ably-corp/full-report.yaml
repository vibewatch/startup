      - number: '1.2'
        title: Leadership, capital, and control
        blocks:
          - type: paragraph
            body: >-
              Public reporting consistently identifies Watcha co-founder Kang Seok-hoon as ABLY's founder and chief
              executive, but the retained pool does not enumerate a broader executive team or board. The clearest
              ownership event is Alibaba's December 2024 investment of KRW 100 billion for a reported 5% stake, implying
              a KRW 3 trillion valuation. That headline does not disclose share class, liquidation preference,
              governance rights, or whether a planned additional raise closed. Earlier financing evidence includes a KRW
              67 billion pre-Series C at a KRW 900 billion valuation in January 2022 and KRW 50 billion of venture debt
              from Pine Tree Asset Management in 2023. The financing history demonstrates access to capital, not the
              amount of unrestricted cash available today.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
