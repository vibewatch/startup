              - CO004
              - CO007
              - CO008
              - CO013
              - CO014
      - number: '1.3'
        title: Scale and profitability
        blocks:
          - type: paragraph
            body: >-
              ABLY reached approximately 8.8 million monthly active users in October 2024, according to two Korean news
              reports citing WiseApp data. Scale has not produced a linear earnings path. Coverage of 2023 reports KRW
              259.5 billion of sales and KRW 3.3 billion of operating profit, while Chosun Biz reports 2024 revenue of
              KRW 334.3 billion, GMV of KRW 2.5 trillion, and a KRW 15.4 billion operating loss. MoneyToday then reports
              2025 revenue of KRW 369.7 billion, GMV of about KRW 2.8 trillion, and KRW 4.4 billion of operating profit.
              These period-specific figures show growth and a reported return to profit, but they do not disclose
              audited segment economics, cash flow, take rate, or the separate investment burden of 4910, Amood,
              content, and payments.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Governance and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              In September 2026, MoneyToday reported that Korea's National Tax Service was conducting a tax audit of
              ABLY; the company characterized it as routine and said detailed confirmation was difficult. The same
              article relayed broader NTS allegations concerning two audited fashion platforms, including pricing
              pressure, high fees, and accounting or related-party concerns. Those allegations are not findings against
              ABLY and should not be presented as established misconduct. Separately, Korean online-marketplace
              operators face disclosure, withdrawal, advertising, and consumer-complaint obligations. A proposed
              domestic-representative regime concerns foreign businesses without a Korean place of business and does not
              itself show direct applicability to ABLY, but it illustrates the tightening framework relevant to
              cross-border platform expansion.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic capital validated meaningful scale
            body: >-
              Alibaba's reported KRW 100 billion investment for a 5% stake and ABLY's approximately 8.8 million October
              2024 MAU support strategic relevance and consumer reach.
            calloutType: strength
            claimRefs:
              - CO004
              - CO005
              - CO012
          - type: callout
            title: Profitability remains volatile
            body: >-
              Public reporting moves from a 2023 operating profit to a 2024 loss and back to a smaller 2025 profit,
              without audited segment or cash-flow detail.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
              - CO011
          - type: callout
            title: Governance and financing terms require primary evidence
            body: >-
              Board composition, leadership depth, Alibaba's exact rights, venture-debt covenants, and the completion of
              planned follow-on funding remain unsupported by the retained public sources.
            calloutType: assumption
            claimRefs:
              - CO003
              - CO004
              - CO006
