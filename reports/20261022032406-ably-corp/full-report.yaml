  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              ABLY's relevant market is digital style commerce: consumer discovery and purchase of fashion, beauty, and
              lifestyle goods through a recommendation-led marketplace, together with the merchant services that enable
              those transactions. The company's app listing emphasizes personalized recommendations, promotions, free
              shipping, and category breadth, while reporting identifies a portfolio comprising the core ABLY app,
              men's-fashion app 4910, and Japan-facing Amood. Included activity is therefore platform-mediated
              merchandise volume and related service or product revenue. The boundary excludes offline retail, general
              ecommerce transactions outside ABLY's platforms, and the total value of apparel production. Status-quo
              substitutes include merchant-owned stores, generalist marketplaces, other Korean fashion apps, and
              cross-border fashion platforms. This boundary prevents GMV, revenue, users, and downloads from being
              mislabeled as one market-size measure.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM014
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports company-scale lenses, not a clean TAM/SAM/SOM stack. KED Global reported annual
              GMV of KRW 400 billion in May 2021, while KoreaTechDesk later reported KRW 700 billion of 2021 transaction
              value and 84% growth. The different vintages and wording require reconciliation rather than an assumed
              growth series. For 2025, reporting put company platform GMV at KRW 2.8 trillion, standalone ABLY
              transaction volume at KRW 2.5 trillion, and revenue at KRW 369.7 billion. Those figures demonstrate
              meaningful throughput and monetization, but remain ABLY metrics rather than category spend. A
              valuation-grade sizing model still needs category-level online spend, geographic scope, attainable seller
              supply, take rate, and repeat behavior before converting operating scale into serviceable or obtainable
              market share.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: Buyers, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Consumers are the buyers and users of the shopping experience, while merchants are the supply-side
              customers and fee payers. Personalized discovery, discounts, delivery convenience, and broad category
              selection can reduce consumer search friction. Merchant adoption depends on access to demand, manageable
              platform fees, fulfillment support, and a credible route to overseas buyers. ABLY's adjacent platforms
              provide early signs of a wider opportunity: reporting says 4910 transaction volume grew 137% in 2025, its
              MAU rose from about 1.7 million in March to about 3.4 million in December, Amood reached 6.5 million
              cumulative downloads, and more than 25,000 markets had entered Japan through Amood. These are adoption
              indicators, not proof that adjacent users or sellers have the same retention, take rate, or contribution
              margin as the core app.
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Reported MAU increased across successive snapshots from 7 million in 2023 to above 8 million in 2024,
              supporting a demand-density thesis but not establishing cohort durability. Category expansion, specialized
              verticals, and cross-border distribution could extend ABLY's addressable activity; Musinsa's own
              multi-region location selector also shows that cross-border reach is a competitive requirement rather than
              unique whitespace. Constraints are material. MoneyToday reported a National Tax Service audit in September
              2026 and attributed allegations about high merchant fees and sudden price increases to the agency. An
              audit is not a finding of wrongdoing, but the reported concerns make merchant economics, pricing power,
              and regulatory exposure central diligence issues. Until segment cohorts, seller concentration, returns,
              subsidies, and take rates are disclosed, valuation should rely on reconciled company economics rather than
              a headline market-share assumption.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Company scale is visible; addressable spend is not
            body: >-
              Reported GMV, revenue, and engagement show a scaled platform, but none of the assigned sources supplies a
              common denominator for Korean style-commerce TAM or an ABLY-specific SAM and SOM.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Merchant economics may limit expansion
            body: >-
              The 2026 audit report and attributed fee allegations do not establish liability, but they make seller take
              rate, price changes, and platform bargaining power priority diligence items.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Ably's direct arena is Korean online fashion commerce, where the evidence places it alongside Musinsa,
              ZigZag, W Concept, and Brandi rather than in a generic e-commerce market. Its adjacent alternatives
              include Coupang and Naver-linked commerce, while seller-led social discovery and direct-to-consumer
              storefronts remain substitutes. Internal build is also a real alternative for larger brands that can
              assemble storefront, payments, marketing, and fulfillment capabilities themselves. Ably's proposition is
              differentiated by personalized discovery, seller aggregation, Ably Pay, and cross-border support, but the
              sources do not establish that those features create a durable moat against better-capitalized platforms.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The buyer choice is not only a feature comparison. Ably emphasizes curation, recommendation, and seller
              reach; Coupang and Musinsa are described as more logistics- and private-brand-oriented; and Naver-linked
              or direct channels can offer reach without giving a marketplace the same role in merchandising. Public
              list pricing and realized take rates are not disclosed in the assigned evidence, so the comparison keeps
              price and fee fields explicitly unknown. Ably's 2026 fulfillment investment and its seller-facing
              expansion support distribution, while the Fair Trade Commission's e-commerce rules make disclosure,
              cancellation, refund, and complaint handling part of the trust baseline for every marketplace.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Ably has evidence of scale and product breadth: its 2025 first-half revenue and transaction volume were
              reported at record levels, 4910's monthly active users reached 1.21 million, and Ably Pay transaction
              volume was 4.7 times its comparison period. Those signals support a discovery and cross-sell advantage,
              not a guaranteed moat. The adverse evidence is material: 2025 reporting described a 15.4 billion won
              operating loss, higher advertising and labor costs, lower advertising efficiency, and limited results from
              4910 and Amood relative to investment. A 2026 tax audit adds regulatory and trust uncertainty, although
              Ably characterized it as routine. The central diligence question is whether personalization, seller
              liquidity, and payment/fulfillment integration lower switching and multi-homing enough to offset incumbent
              response and expansion costs.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits and evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate sourced facts from analytical scoring. The profile table records what the assigned
              sources actually disclose about each alternative; the capability matrix marks unsupported cells as unknown
              rather than inferring parity; and the pricing comparison preserves unavailable public fee information. The
              positioning map is an ordinal diligence aid, not a market-share or quality index. It uses the
              evidence-backed dimensions of discovery/curation and logistics/ distribution, with rationale retained in
              the point notes. This chapter therefore treats Ably's reported transaction and user metrics as company or
              third-party reported signals, not as proof that competitors cannot replicate the product.
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation signal
            body: >-
              Ably's strongest demonstrated distinction is the combination of personalized discovery, seller
              aggregation, payment expansion, and cross-border enablement rather than a single feature.
            calloutType: strength
            claimRefs:
              - CP003
              - CP006
              - CP009
          - type: callout
            title: Durability risk
            body: >-
              The 2025 operating-loss report and limited results attributed to 4910 and Amood show that breadth can
              increase cost and execution risk before it becomes a defensible moat.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and quality
        blocks:
          - type: paragraph
            body: >-
              ABLY monetizes a multi-sided fashion-commerce platform rather than a pure subscription product.
              DigitalToday reports that 2025 services revenue was KRW 227.3 billion and       merchandise revenue was
              KRW 142.3 billion; the company described services revenue as scaling with seller transactions and its
              Partners model as a source of merchandise revenue. That split is useful but does not establish realized
              take rate, contribution margin, or whether merchandise revenue carries inventory or fulfillment risk.
              ABLY's 2025 revenue of KRW 369.7 billion increased 10.6% year over year, while transaction volume rose 12%
              to about KRW 2.8 trillion. Dividing those figures would not establish a take rate because the reported
              revenue includes distinct service and merchandise streams while the transaction-volume denominator may
              span businesses with different recognition policies and economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI007
              - CI013
      - number: '4.2'
        title: Margin path and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              The public trajectory is directionally positive but not yet clean enough to underwrite a durable margin
              profile. DigitalToday reports a 2025 operating loss of KRW 4.3 billion, down 72% year over year, and
              operating cash flow of KRW 15.05 billion. Biz Chosun separately reported that advertising expense rose
              from KRW 26.6 billion in 2023 to KRW 42.3 billion in 2024 while ROAS fell from 1,133% to 790%; it also
              placed gross profit margin at 44.5% in 2024 versus 39.5% in 2023. MoneyToday's later report instead labels
              the 2025 operating result a KRW 4.4 billion profit, directly conflicting with DigitalToday's KRW 4.3
              billion loss. Until audited statements reconcile that sign discrepancy, the margin direction is more
              reliable than the precise result. The pool supplies no CAC, payback, repeat-purchase cohorts, segment
              contribution profit, or free-cash-flow bridge.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Capital access has been demonstrated, but the evidence does not prove unrestricted liquidity or a fully
              funded plan. Korea Herald reports a KRW 100 billion Alibaba investment for roughly 5% of ABLY, while KED
              Global earlier described letters of intent for a possible KRW 200 billion raise and said that final
              investor details were unavailable. DigitalToday reports approximately KRW 100.0 billion of cash and cash
              equivalents at 2025 year-end and positive 2025 operating cash flow of KRW 15.05 billion. These facts
              reduce near-term financing pressure relative to the earlier loss-making profile, but KoreaTechDesk's
              report of a KRW 50 billion venture-debt financing confirms that debt belongs in the capital-structure
              review. Public evidence does not specify restricted cash, debt maturity, covenants, planned capital
              expenditure, or the cash consumed by 4910, Amood, fintech, and other expansion initiatives. MoneyToday
              also reports a September 2026 National Tax Service audit and says ABLY characterized it as routine; the
              investigation's outcome and any financial exposure are unresolved.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI008
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              ABLY's revenue quality is improving from a scale perspective: 2025 revenue reached a record level,
              transaction volume expanded, the reported operating loss narrowed sharply, and operating cash flow turned
              positive. The counterweight is that this remains a commerce business with meaningful marketing
              sensitivity: 2024 advertising expense rose while reported ROAS fell, even as gross margin improved. The
              unresolved sign conflict in the 2025 operating result further limits precision. The current evidence
              supports a medium-confidence view that the core platform may be approaching self-financing, not a
              conclusion that ABLY has durable free-cash-flow generation. Underwriting should remain conditional on
              audited segment reporting, unit economics, debt terms, cash restrictions, and the resolution or quantified
              impact of the tax audit.
            claimRefs:
              - CI005
              - CI007
              - CI011
              - CI012
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core platform is near operating break-even
            body: >-
              2025 operating loss narrowed to KRW 4.3 billion while operating cash flow was a KRW 15.05 billion surplus,
              a meaningful improvement over the earlier loss-making profile.
            calloutType: strength
            claimRefs:
              - CI005
              - CI015
          - type: callout
            title: Operating-result sign is unresolved
            body: >-
              DigitalToday reports a KRW 4.3 billion 2025 operating loss, while MoneyToday later reports a KRW 4.4
              billion operating profit for the same period; audited statements must reconcile the discrepancy.
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
          - type: callout
            title: Cash is not the same as runway
            body: >-
              The disclosed year-end cash balance cannot be converted into months of runway without debt,
              restricted-cash, capex, working-capital, and segment burn data.
            calloutType: assumption
            claimRefs:
              - CI006
              - CI011
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflows
        blocks:
          - type: paragraph
            body: >-
              ABLY is better understood as a portfolio of commerce surfaces than as one undifferentiated shopping app.
              Independent reporting identifies the core ABLY marketplace, the men's-fashion surface 4910, and
              Japan-facing Amood; the current 4910 storefront visibly exposes recommendation, brand, sports, and
              popularity navigation. Yicai further describes the core app as enabling independent designers and
              influencers to create digital storefronts. The portfolio now also includes the in-house Ably Pay payment
              method and extends into beauty and household goods, according to reporting. These facts support a customer
              workflow spanning discovery, seller onboarding, checkout, and category or geographic expansion, but not a
              claim that each surface has equivalent maturity or economics.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
              - CE012
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
              - CE012
              - CE016
      - number: '5.2'
        title: Recommendation and seller operating system
        blocks:
          - type: paragraph
            body: >-
              Recommendation-led discovery is the clearest publicly described technical differentiation. KED Global
              reported in July 2024 that ABLY had developed an AI personalized-recommendation algorithm and held more
              than 2.5 billion pieces of user data. Earlier reporting described personalized recommendations based on
              browsing or product-streaming behavior and purchase history. On the supply side, the disclosed operating
              model includes digital storefronts, listing and transaction management, inventory or logistics support,
              and a one-step sales-and-delivery workflow. Together these elements suggest a data-informed marketplace
              operating system rather than a static catalog. They do not reveal recommendation lift, model governance,
              catalog integrity, data rights, seller retention, or implementation-level integration.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE010
              - CE014
              - CE016
      - number: '5.3'
        title: Payments, fulfillment, and product maturity
        blocks:
          - type: paragraph
            body: >-
              Dated adoption signals indicate that newer surfaces moved beyond concept stage, although the evidence is
              company-reported through media. The Investor reported that Ably Pay transaction volume in the second
              quarter of 2025 was 4.7 times its level in the third quarter of 2024. The same source reported 1.21
              million monthly active users for 4910 in the first half of 2025, a 7.5-fold increase, and 50 percent
              year-on-year transaction-volume growth for Amood in that half. It also described an expanded Seongsu
              fulfillment center intended to support global commerce. These are useful operating signals, but they are
              not uptime, latency, integration, fraud, settlement, fulfillment-SLA, or contribution-margin evidence.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE010
              - CE011
              - CE013
              - CE015
      - number: '5.4'
        title: Trust, controls, and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              Payments, personalized ranking, seller-generated catalogs, fulfillment, and cross-border commerce enlarge
              the reliability, privacy, fraud, tax, and compliance control surface. MoneyToday reported in September
              2026 that the National Tax Service was conducting an audit targeting ABLY, while the company said it
              understood the review as routine. That is an adverse diligence signal, not proof of a product defect or a
              completed regulatory finding. More broadly, the assigned prefetched evidence contains no API
              documentation, security certification, uptime history, incident record, public repository, or release log
              for ABLY. The official newsroom retrieval exposed corporate footer text rather than technical material.
              Technical maturity therefore remains a management-diligence question rather than a conclusion supported by
              the public evidence set.
            claimRefs:
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation-led commerce is the visible product edge
            body: >-
              Public reporting consistently links ABLY's product differentiation to personalized discovery informed by
              user behavior and purchase data.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE014
          - type: callout
            title: Functional evidence exceeds engineering evidence
            body: >-
              Product adoption and operating expansion are visible, but architecture, reliability, security, privacy,
              and developer-signal evidence remain unavailable in the assigned source set.
            calloutType: risk
            claimRefs:
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and commerce surfaces
        blocks:
          - type: paragraph
            body: >-
              ABLY is a two-sided consumer marketplace rather than a conventional enterprise vendor: shoppers use its
              recommendation-led storefronts, while merchants depend on listing, selling, and delivery infrastructure.
              Bloomberg describes the company as providing women's and men's fashion e-commerce in South Korea, and
              MoneyToday identifies the core ABLY audience as women in their teens and twenties. The portfolio also
              includes the men's-fashion mall 4910 and Japan-facing Amood, with the core service expanding into beauty
              and household goods. These disclosures support buyer and use-case segmentation, but they do not disclose
              payer mix, merchant revenue bands, seller concentration, or surface-level economics. The portfolio
              therefore broadens addressable demand without proving that each surface has durable, independently scaled
              customer economics.
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU009
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
              - CU011
      - number: '6.2'
        title: Adoption and transaction trajectory
        blocks:
          - type: paragraph
            body: >-
              Reported usage expanded materially across several point-in-time observations. KED Global reported 4.2
              million monthly active users in 2021; KoreaTechDesk reported 7 million in 2023; SCMP cited 8.05 million in
              March 2024; and the Korea Herald cited 8.8 million in November 2024. Internet Retailing subsequently
              reported 21.0% MAU growth in March 2025. Separately, BusinessKorea described transaction volume rising
              from the 700 billion won range in 2021 toward the 2 trillion won range in 2024, while Internet Retailing
              reported 2024 consolidated and standalone volumes in translated US-dollar terms. These observations
              indicate reach and commerce activity, but differing dates, currencies, scopes, and source methodologies
              prevent a clean cohort or monetization comparison.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Durability, expansion, and seller friction
        blocks:
          - type: paragraph
            body: >-
              The public record supports plausible expansion mechanisms but not measured durability. ABLY's integrated
              selling-and-delivery workflow can reduce merchant operating friction, while adjacent categories can
              increase shopper purchase occasions. Alibaba's reported investment adds a strategic relationship that
              could help Asian expansion, but no evidence in the assigned pool quantifies channel contribution or
              dependency. More importantly, the sources disclose no NRR, GRR, churn, repeat-purchase rate, cohort
              curves, contract length, or top-seller share. MoneyToday's September 2026 report adds an adverse
              counterpoint: the National Tax Service was auditing ABLY and alleged that the investigated fashion
              platforms used their market position to impose high fees or shift burdens to listed companies. ABLY
              characterized the audit as routine, so the allegation remains unresolved rather than a proven violation.
            claimRefs:
              - CU009
              - CU010
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled audience with continued momentum
            body: >-
              Four point-in-time sources show MAU rising from 4.2 million in 2021 to 8.8 million in late 2024, followed
              by reported year-over-year MAU growth in March 2025.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Durability and seller economics remain unproven
            body: >-
              Public sources do not disclose retention, repeat-purchase cohorts, seller concentration, or take rate,
              while a 2026 tax audit report raises an unresolved allegation that high fees shifted burdens to listed
              companies.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Public reporting in September 2026 says the National Tax Service was actively auditing Ably and that the
              company described the process as routine while declining to provide investigation details. The same report
              attributes broader allegations to the tax authority, including omission of sales through irregular
              accounting, excessive payments to related entities, and inflated costs from high-priced inventory
              purchases. Those statements are allegations in an ongoing process, not findings against Ably. The
              immediate investment implication is therefore uncertainty around potential tax, accounting, governance,
              and reputational outcomes rather than a confirmed violation. A disciplined monitor is the publication of
              an official disposition, quantified assessment, restatement, or statement that the audit closed without
              adjustment. Until then, the audit should remain a high-severity unresolved exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
      - number: '7.2'
        title: Operating, quality, and financial resilience
        blocks:
          - type: paragraph
            body: >-
              Ably has scaled transaction volume and revenue, but the public record shows meaningful earnings volatility
              and continuing investment demands. A July 2025 report described 334.3 billion won of sales and a 15.4
              billion won operating loss in the prior year, alongside higher advertising, labor, and fixed costs; it
              also reported that advertising spend rose while ROAS fell. A later September 2026 report described 369.7
              billion won of revenue and 4.4 billion won of operating profit for the prior year, so the direction
              improved but does not remove the need to reconcile periods, accounting scope, and new-business
              contribution. The residual risk is margin compression or cash needs if growth requires sustained
              promotion, logistics, content, fintech, and overseas investment. Investors should monitor contribution
              margin by business, cash conversion, return rates, and whether new ventures reach self-funding milestones.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
      - number: '7.3'
        title: Dependencies, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Alibaba's 100 billion won investment is strategically useful but introduces a concentrated partner and
              financing dependency. Reports say the exact number of shares was not disclosed in the primary coverage,
              while other coverage described an approximately 5% stake and a 3 trillion won valuation. Ably also planned
              to seek another 100 billion won from overseas investors, and earlier reporting described letters of intent
              rather than completed financing. The key risk is not that Alibaba's investment is inherently adverse; it
              is that strategic alignment, future funding, overseas expansion, and valuation expectations may become
              mutually reinforcing assumptions without enough public disclosure on terms or cash needs. A thesis break
              would be an adverse official tax outcome, a material restatement, inability to fund planned expansion,
              deterioration in advertising efficiency or gross margin, or failure of new businesses to reach stated
              milestones.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              The highest-priority trigger is an adverse official tax outcome or accounting restatement, followed by
              evidence that expansion spending is not converting into durable contribution profit. Public reporting does
              not establish either outcome today, so the correct posture is high residual risk with explicit monitoring
              rather than a categorical conclusion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
          - type: callout
            title: What public evidence cannot yet establish
            body: >-
              The assigned sources do not disclose signed financing terms, cash runway, business-level unit economics,
              security incidents, seller concentration, or the final disposition of the tax audit. These are
              underwriting gaps, not evidence that the underlying risks are absent.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR011
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Alibaba invested KRW 100 billion in December 2024 and reportedly received about 5% of ABLY, placing the
              company near a KRW 3 trillion valuation. That headline price represented a rapid step-up from an estimated
              KRW 400 billion financing value in 2021 and KRW 900 billion around the January 2022 pre-Series C. A July
              2024 report described letters of intent for a KRW 200 billion round, while later reporting confirmed
              Alibaba's KRW 100 billion investment and said another KRW 100 billion would be sought. The assigned public
              evidence does not establish that the additional tranche closed. Multiples.vc calculates the December 2024
              mark at 8.7x revenue, materially above the selected public retail and fashion revenue references in the
              same dataset. Entry at the headline valuation therefore requires audited current revenue quality,
              cap-table and preference terms, and proof that growth can compound without another loss-making expansion
              cycle.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: Evidence for the thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is based on scale rather than a purely prospective narrative. Reported 2024 revenue
              reached KRW 334.3 billion on KRW 2.5 trillion of transaction volume, and a 2026 article reported KRW 369.7
              billion of 2025 revenue and KRW 4.4 billion of operating profit. ABLY also reported 9.4 million monthly
              active users, while 4910 and Amood supplied early evidence of category and geographic expansion. The
              counterweight is the volatility of consolidated earnings: 2024 produced a KRW 15.4 billion operating loss
              after 2023's KRW 3.3 billion profit, advertising spend rose while ROAS fell, and the National Tax Service
              began a tax audit in 2026. Those facts make the investment case depend on the durability and cash
              conversion of the core platform, not just GMV or user growth.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario range and comparable-set limits
        blocks:
          - type: paragraph
            body: >-
              A revenue-multiple framework is the least misleading public method because ABLY's EBITDA, free cash flow,
              net debt, and segment contribution are not disclosed in the evidence set. Applying selected disclosed LTM
              revenue references to reported 2025 revenue gives an illustrative range well below the KRW 3 trillion
              headline mark: the bear case uses 1.0x, the base case uses 1.8x-2.5x, and the bull case uses 4.3x-4.5x.
              These are sensitivity bands, not an appraisal, because the cited businesses differ in geography, category,
              growth, and margins. PayPal and Block are useful only as boundary references for a future payments
              strategy: PayPal's revenue scale and Block's diversified seller, consumer-finance, and bitcoin portfolio
              are too different to justify importing their valuation logic into ABLY. Probability signals remain
              qualitative until audited cohort, take-rate, and cash-flow data are available.
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Recommendation, exit readiness, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high risk, and a stretched valuation stance.
              The view would improve if a primary financing document confirms clean preferences and limited dilution,
              audited 2025 and 2026 data show durable positive operating cash flow, and 4910, Amood, and fintech report
              positive incremental contribution without weakening the core marketplace. It would worsen if the tax audit
              creates a material liability, advertising efficiency continues to fall, consolidated losses recur, or
              another round prices below the 2024 mark. Exit readiness is not established: the evidence set lacks a
              current cap table, board and governance package, segment reporting, audited cash conversion, and a
              credible IPO or strategic-sale timetable. Until those items are obtained, neither a target return nor a
              hold period can be responsibly underwritten from public information.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment committee stance
            body: >-
              Do not treat ABLY's unicorn status as price validation. Advance only to primary diligence, with valuation
              contingent on financing terms, audited cash conversion, segment contribution, and resolution of the tax
              audit.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV011
              - CV016
