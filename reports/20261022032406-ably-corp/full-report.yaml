  - id: FP001
    title: Evidence-backed competitive positioning map
    type: quadrant
    summary: >-
      Ably is positioned as relatively strong on discovery/curation and intermediate on logistics/distribution, while
      incumbents and substitutes occupy different trade-offs; scores are ordinal analytical judgments, not market
      measurements.
    data:
      xAxis: Discovery and curation orientation (ordinal)
      yAxis: Logistics and distribution power (ordinal)
      points:
        - label: Ably
          x: 5
          'y': 3
          note: >-
            Personalization, seller aggregation, Ably Pay and fulfillment expansion are reported; logistics scale is not
            quantified.
        - label: Musinsa
          x: 3
          'y': 4
          note: >-
            Named as a major style-commerce platform; reporting contrasts its logistics and private-brand focus with
            Ably's curation.
        - label: Coupang
          x: 2
          'y': 5
          note: >-
            The assigned evidence identifies broad online-shopping scale and logistics-led convenience, not fashion
            curation.
        - label: Naver-linked or Kream
          x: 3
          'y': 3
          note: Adjacent competition is identified, but assigned sources do not establish comparable capability scores.
        - label: Direct-to-consumer
          x: 4
          'y': 2
          note: Direct channels can preserve control and merchandising, but distribution depends on each seller.
        - label: Internal build
          x: 3
          'y': 2
          note: A build alternative can reproduce capabilities, but cost, time, and operating performance are unquantified.
    approximationNotes: >-
