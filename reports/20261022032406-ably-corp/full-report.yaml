chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business scope
        blocks:
          - type: paragraph
            body: >-
              ABLY Corporation is a privately held South Korean commerce company whose main app launched in March 2018
              after the company was founded in 2015. A private- market database places its headquarters in Seoul, but
              that point lacks a primary corporate filing in the assigned evidence and therefore remains less certain
              than the operating identity. Independent news accounts consistently describe a portfolio comprising the
              ABLY women's-fashion platform, men's- fashion marketplace 4910, and Japan-facing Amood. The model combines
              marketplace discovery with personalized recommendations, seller enablement, and category expansion. This
              supports a broader style-commerce description rather than a narrow apparel retailer, while the
              legal-entity perimeter and ownership of each product remain private-evidence questions.
            claimRefs:
              - CO001
              - CO002
