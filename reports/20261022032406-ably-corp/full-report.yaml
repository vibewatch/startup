  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and renewed profit improve the case, but premium pricing and unresolved financing, operating, and regulatory
      evidence lead to research-more.
    data:
      nodes:
        - id: scale
          label: Proven scale
          detail: KRW 369.7B reported 2025 revenue after KRW 334.3B in 2024
        - id: operating-proof
          label: Operating proof
          detail: KRW 4.4B reported 2025 operating profit, following a 2024 loss
        - id: expansion
          label: Expansion option
          detail: 4910, Amood, and fintech can add growth but lack segment contribution disclosure
        - id: price
          label: Premium price
          detail: Last disclosed valuation near KRW 3T and 8.7x 2024 revenue
        - id: unresolved-risk
          label: Unresolved risk
          detail: Tax audit, preference terms, dilution, cash conversion, and exit timing remain open
        - id: decision
          label: Research more
          detail: Proceed only after primary terms and audited unit economics support the price
    approximationNotes: >-
      The flow is a qualitative decision chain; it does not assign probabilities or imply that GMV, revenue, operating
      profit, and valuation are interchangeable.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV013
      - CV016
