  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Publicly described workflow, ABLY surface, Reported benefit or signal, Limitation]
    rows:
      - ["Discover relevant products", "Use browsing behavior and purchase history for personalization", "ABLY recommendations", "More than 2.5 billion pieces of user data reported in July 2024", "No public relevance, conversion-lift, or bias metric"]
      - ["Open a digital storefront", "List items and manage transactions", "Marketplace seller tooling", "Independent designers and influencers can create storefronts", "No public seller activation or retention cohort"]
      - ["Manage inventory and delivery", "Use manufacturing, distribution, inventory, or logistics support", "Seller operating infrastructure", "Broader workflow than listing alone", "No public system boundary, SLA, or partner dependency map"]
      - ["Complete and settle purchases", "Use in-house payment and marketplace checkout", "Ably Pay", "Transaction volume reportedly increased 4.7x in the stated comparison", "No public authorization, fraud, chargeback, or settlement result"]
      - ["Reach overseas demand", "Sell through Japan-facing commerce and expanded fulfillment", "Amood and Seongsu fulfillment center", "Reported Amood growth and physical infrastructure expansion", "No country-level retention, service level, or compliance result"]
    notes: "Benefits are attributed to the named reports and retain their stated periods; no metric is treated as independently audited or as a substitute for unit economics."
    claimRefs: [CE002, CE003, CE004, CE006, CE007, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Functional layer, Publicly supported role, Dependency, Principal risk, Required diligence]
    rows:
      - ["Discovery and ranking", "Personalize catalog exposure", "Behavioral and purchase data", "Privacy, bias, and model drift", "Data lineage, legal basis, model cards, and online/offline evaluation"]
      - ["Seller storefront and catalog", "Create storefronts and list products", "Seller-generated content and transaction tooling", "Catalog integrity, counterfeit goods, and permissions", "Moderation controls, audit logs, and seller-quality metrics"]
      - ["Payments", "Support checkout through Ably Pay", "Internal payment workflow and external rails", "Fraud, chargebacks, settlement, and licensing", "Payment licenses, PCI scope, reconciliation, and incident history"]
      - ["Fulfillment and delivery", "Connect sale and delivery and support global commerce", "Seller operations and the Seongsu facility", "Service failure, returns, and inventory exceptions", "SLAs, return rates, capacity, and exception controls"]
      - ["International and category surfaces", "Extend the portfolio to Japan, men's fashion, beauty, and household goods", "Localization, catalog, fulfillment, and market controls", "Fragmentation and market-specific compliance", "Shared-stack map, localization controls, and surface-level economics"]
      - ["Trust and operations", "Govern the expanded commerce control surface", "Security, privacy, tax, fraud, and reliability processes", "Regulatory, financial, and reputational exposure", "Audit outcome, security reports, privacy assessments, uptime, and postmortems"]
    notes: "This is a functional operating map assembled from disclosed product surfaces; it does not assert a specific cloud, API, data-store, model, or deployment implementation."
    claimRefs: [CE003, CE005, CE007, CE010, CE011, CE013, CE015]
