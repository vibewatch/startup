      rows:
        - label: Tax audit and accounting allegations
          values: [Possible, Critical, Low, Critical]
        - label: Advertising and operating-cost pressure
          values: [Likely, High, Medium, High]
        - label: New-business cash consumption
          values: [Possible, High, Low, High]
        - label: Alibaba and follow-on financing dependency
          values: [Possible, High, Medium, High]
        - label: International execution and compliance
          values: [Possible, Medium, Low, Medium]
        - label: AI/data governance and service quality
          values: [Possible, Medium, Low, Medium]
    claimRefs: [CR001, CR005, CR010, CR014]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: "The highest-priority trigger is an adverse official tax outcome or accounting restatement, followed by evidence that expansion spending is not converting into durable contribution profit. Public reporting does not establish either outcome today, so the correct posture is high residual risk with explicit monitoring rather than a categorical conclusion."
    claimRefs: [CR001, CR005, CR006, CR009]
  - calloutType: assumption
    title: What public evidence cannot yet establish
    body: "The assigned sources do not disclose signed financing terms, cash runway, business-level unit economics, security incidents, seller concentration, or the final disposition of the tax audit. These are underwriting gaps, not evidence that the underlying risks are absent."
    claimRefs: [CR003, CR011, CR012, CR014, CR015]
