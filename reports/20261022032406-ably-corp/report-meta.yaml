companyProfile:
  summary: >-
    ABLY Corporation is a privately held Seoul-based Korean style-commerce operator founded in 2015 and launched around
    the ABLY app in 2018. Its portfolio spans the flagship women's-fashion marketplace, men's-fashion platform 4910, and
    Japan-facing Amood, with public reporting also describing payments, seller tools, and cross-border expansion.
