      - QR006
      - QR007
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: AI-and-security
    missingEvidence: >-
      Independent security, privacy, uptime, incident, AI-governance, seller-quality, and cross-border compliance
      records.
    whyItMatters: >-
      The platform's recommendation, payments, logistics, and international expansion increase operational and
