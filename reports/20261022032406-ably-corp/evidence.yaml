    whyItMatters: >-
      Entry ownership, effective valuation, downside protection, and future dilution cannot be modeled from the headline
      investment alone.
    diligencePath: >-
      Obtain the executed Alibaba and venture-debt agreements, an updated fully diluted cap table, board approvals, and
      bank evidence for every closed tranche.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Audited cash-flow statements, segment contribution, board composition, internal controls, IPO readiness work,
