    relatedQuestionRefs:
      - QR005
      - QR009
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Signed financing documents, the current cap table, exact ownership, liquidation preferences, anti-dilution terms,
