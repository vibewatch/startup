    whyItMatters: >-
      The reported audit and allegations could affect tax liabilities, accounting integrity, governance, and reputation,
      but public reporting does not establish the outcome.
    diligencePath: >-
      Obtain the official notice and management representation, then reconcile any assessment, reserve, restatement, or
      remediation to audited accounts.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR010
    relatedTableRefs:
      - TR001
