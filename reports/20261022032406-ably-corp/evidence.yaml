evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A complete executive roster, board composition, committee structure, succession plan, and current organization
      chart.
    whyItMatters: >-
      Founder concentration and undisclosed leadership depth create unquantified key-person, oversight, and execution
      risk.
    diligencePath: >-
      Request director and executive biographies, board and committee minutes, the organization chart, delegations of
      authority, and succession materials.
    relatedQuestionRefs:
      - QO002
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Signed Alibaba transaction documents, a post-money capitalization table, venture-debt terms, and evidence that any
      planned follow-on financing closed.
    whyItMatters: >-
      Headline funding does not establish liquidation preferences, governance rights, dilution, debt service, or cash
      currently available.
    diligencePath: >-
      Obtain share purchase and shareholder agreements, the fully diluted cap table, debt schedule, covenant
      certificates, and bank-confirmed closing records.
    relatedQuestionRefs:
      - QO003
      - QO008
      - QO010
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: profitability
    missingEvidence: >-
      Audited statements reconciling 2023 profit, 2024 loss, and 2025 profit across the same legal entities and
      accounting policies.
    whyItMatters: The apparent earnings reversal affects operating-leverage, cash-needs, and valuation conclusions.
    diligencePath: >-
      Request audited consolidated financials, cash-flow statements, segment accounts, take-rate bridges, and
      normalization schedules for expansion costs.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tax-audit
    missingEvidence: >-
      The National Tax Service audit notice, exact scope, company response, counsel assessment, and any findings or
      resolution.
    whyItMatters: News reporting establishes an audit but not liability, misconduct, tax exposure, or remediation.
    diligencePath: >-
      Obtain primary NTS correspondence, management representations, the tax counsel memorandum, reserves, and final
      assessment when available.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: company-identity
    missingEvidence: >-
      A current Korean corporate registry extract establishing the registered headquarters, incorporation date,
      directors, and subsidiary ownership.
    whyItMatters: The assigned pool supports the operating identity but not the complete legal-entity structure.
    diligencePath: >-
      Order a current corporate registry extract and reconcile every operating brand and subsidiary to the consolidated
      financial statements.
    relatedQuestionRefs:
      - QO001
      - QO002
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: minor
    topic: cross-border-regulation
    missingEvidence: >-
      A legal-entity and jurisdiction map showing whether any ABLY affiliate falls within foreign-platform
      domestic-representative rules.
    whyItMatters: The general legal update does not establish direct applicability to ABLY or Amood.
    diligencePath: >-
      Have Korean and Japanese counsel map seller-of-record, platform-intermediary, consumer-redress, and representative
      obligations by entity.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A reconciled Korean style-commerce market size with geography, channel, category, and denominator definitions,
      plus an ABLY-specific serviceability filter.
    whyItMatters: >-
      Without a common denominator, company GMV and MAU cannot be translated into a defensible TAM, SAM, SOM, or market
      share.
    diligencePath: >-
      Obtain a reputable market dataset and management sizing model that reconcile category spend, online penetration,
      merchant supply, and reachable geographies.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: >-
      Segment-level take rate, contribution margin, repeat behavior, acquisition cost, returns, subsidy intensity, and
      seller concentration.
    whyItMatters: >-
      Marketplace throughput and users can grow while merchant or cohort economics deteriorate, changing both adoption
      durability and valuation relevance.
    diligencePath: >-
      Request monthly buyer cohorts and seller schedules by ABLY, 4910, Amood, and category, reconciled to GMV, revenue,
      returns, promotions, and contribution margin.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: sizing-basis
    missingEvidence: >-
      A management reconciliation of the May 2021 annual GMV snapshot, 2021 transaction value, consolidated platform
      GMV, standalone transaction volume, and accounting revenue.
    whyItMatters: >-
      The public sources use different periods and denominators, so they cannot establish a continuous market-share or
      monetization series.
    diligencePath: >-
      Reconcile audited or management accounts to calendar-period GMV, platform scope, transaction volume, service
      revenue, and product revenue.
    relatedQuestionRefs:
      - QM009
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: regulatory-constraint
    missingEvidence: >-
      Primary National Tax Service documentation, ABLY's detailed response, and any final assessment from the September
      2026 audit.
    whyItMatters: >-
      The reporting establishes that an audit was underway and relays allegations, but it does not establish findings,
      liability, or remediation.
    diligencePath: >-
      Obtain the audit notice, company response, adviser analysis, and final assessment before assigning a quantified
      financial or market-access impact.
    relatedQuestionRefs:
      - QM007
      - QM010
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited segment-level take rate, CAC, payback, cohort retention, repeat purchase, NRR, and contribution margin for
      ABLY, 4910, Amood, and related services.
    whyItMatters: >-
      Reported revenue and GMV show scale but cannot establish whether growth creates durable contribution profit or
      depends on subsidies and marketing.
    diligencePath: >-
      Request monthly cohort and segment P&L schedules, customer-acquisition cohorts, seller fee schedules, returns,
      subsidies, and contribution-margin bridges under NDA.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current debt, venture-debt covenants, leases, guarantees, restricted cash, capex, monthly burn, and runway
      forecast.
    whyItMatters: >-
      A year-end cash balance and positive operating cash flow do not reveal financing dependency or obligations that
      could consume liquidity.
    diligencePath: >-
      Obtain bank statements, audited cash-flow statements, debt agreements, maturity schedule, covenant calculations,
      and a 24-month base/downside cash plan.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      Closing documents and cap-table reconciliation for the reported Alibaba investment and the later-described
      financing intentions.
    whyItMatters: >-
      The public record distinguishes a reported KRW 100 billion investment from a possible larger raise, but does not
      establish exact closing status, terms, or cash available.
    diligencePath: >-
      Request signed financing agreements, cap table, investor list, use-of-proceeds schedule, and confirmation of any
      unclosed commitments.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: Outcome, scope, findings, and financial exposure from the September 2026 National Tax Service audit.
    whyItMatters: >-
      A tax investigation can create liabilities, penalties, restatements, or operational constraints even when
      management describes it as routine.
    diligencePath: >-
      Request counsel correspondence, audit notices, provision analysis, tax-contingency memo, and final disposition
      when available.
    relatedQuestionRefs:
      - QI007
  - type: conflicting-data
    severity: material
    topic: operating-result
    missingEvidence: >-
      Audited 2025 income statement reconciling DigitalToday's reported KRW 4.3 billion operating loss with MoneyToday's
      reported KRW 4.4 billion operating profit.
    whyItMatters: >-
      The sign of the operating result determines whether ABLY crossed break-even and changes the interpretation of its
      margin trajectory.
    diligencePath: >-
      Obtain the audited 2025 financial statements and reconcile translation, period, scope, and sign conventions with
      both reports.
    relatedQuestionRefs:
      - QI003
      - QI007
  - type: missing-source
    severity: material
    topic: architecture-and-reliability
    missingEvidence: >-
      Current architecture diagram, API and integration documentation, uptime and latency history, incident postmortems,
      release process, and deployment-control evidence.
    whyItMatters: >-
      Portfolio expansion across payments, fulfillment, categories, and countries increases dependency and failure
      complexity that product-adoption metrics do not measure.
    diligencePath: >-
      Request architecture and dependency maps, service-level results, an incident register, deployment controls, and
      integration inventory from management.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: security-privacy-and-payments
    missingEvidence: >-
      Security certifications or audit reports, penetration-test summary, privacy impact assessments, payment licensing
      scope, fraud metrics, and settlement controls.
    whyItMatters: >-
      Personalized ranking and in-house payments expose sensitive data and regulated transaction workflows, while public
      feature descriptions do not validate the controls.
    diligencePath: >-
      Obtain security and privacy audit artifacts, data-flow and retention maps, payment licenses, PCI scope, fraud and
      chargeback results, and remediation logs.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public engineering evidence such as repositories, release notes, API forums, package activity, technical talks, or
      a documented practitioner-community proxy.
    whyItMatters: >-
      The assigned pool does not validate engineering cadence, integration quality, external adoption, or technical-team
      depth.
    diligencePath: >-
      Request a verified engineering surface or private technical-diligence session and interview engineering leaders
      about releases, incidents, and integrations.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: compliance
    missingEvidence: Scope, findings, remediation, and final disposition of the September 2026 National Tax Service audit.
    whyItMatters: >-
      An active audit may affect merchant economics, platform controls, and trust, but the cited report does not
      establish a completed finding.
    diligencePath: >-
      Obtain management's written response, regulator notices, audit scope, findings, remediation plan, and any later
      disposition.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Buyer and merchant retention by cohort, repeat-purchase frequency, churn, NRR or GRR, and customer-acquisition
      payback by platform and category.
    whyItMatters: Point-in-time MAU and transaction volume cannot establish whether demand is durable or economically retained.
    diligencePath: >-
      Request monthly buyer and merchant cohort tables, order-frequency curves, reactivation logic, and reconciled NRR
      or GRR definitions for ABLY, 4910, and Amood.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named buyer and merchant references, production tenure, seller concentration, top-customer exposure, and
      surface-level outcomes for 4910 and Amood.
    whyItMatters: >-
      Platform names and aggregate activity do not prove reference quality, concentration resilience, or durable
      outcomes for individual customer cohorts.
    diligencePath: >-
      Obtain a reference list segmented by buyer and merchant, interview at least three merchants and three repeat
      buyers per major surface, and reconcile top-10 seller GMV concentration.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: blocking
    topic: tax-audit
    missingEvidence: >-
      Official National Tax Service disposition, assessment, settlement, or closure notice and Ably counsel or auditor
