schemaVersion: "report-v2"
artifact: financials
slug: ably-corp
runDate: 2026-10-22
company:
  name: ABLY Corporation
chapter:
  number: 4
  title: Financials
  summary: ABLY reported record 2025 revenue, positive operating cash flow, and approximately KRW 100 billion of year-end cash, but its own operating-loss disclosure conflicts with a later report of operating profit. Segment take rate, CAC payback, free cash flow, runway, and debt terms remain unavailable, so the evidence supports improving economics rather than fully underwritten self-funding.
sections:
  - id: revenue-quality
    title: Revenue model and quality
    body: >-
      ABLY monetizes a multi-sided fashion-commerce platform rather than a pure
      subscription product. DigitalToday reports that 2025 services revenue was
      KRW 227.3 billion and       merchandise revenue was KRW 142.3 billion; the company
      described services revenue as scaling with seller transactions and its
      Partners model as a source of merchandise revenue. That split is useful but
      does not establish realized take rate, contribution margin, or whether
      merchandise revenue carries inventory or fulfillment risk. ABLY's 2025
      revenue of KRW 369.7 billion increased 10.6% year over year, while transaction
      volume rose 12% to about KRW 2.8 trillion. Dividing those figures would not
      establish a take rate because the reported revenue includes distinct service
      and merchandise streams while the transaction-volume denominator may span
      businesses with different recognition policies and economics.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: margin-and-efficiency
    title: Margin path and sales efficiency
    body: >-
      The public trajectory is directionally positive but not yet clean enough to
      underwrite a durable margin profile. DigitalToday reports a 2025 operating
      loss of KRW 4.3 billion, down 72% year over year, and operating cash flow of
      KRW 15.05 billion. Biz Chosun separately reported that advertising expense
      rose from KRW 26.6 billion in 2023 to KRW 42.3 billion in 2024 while ROAS
      fell from 1,133% to 790%; it also placed gross profit margin at 44.5% in
      2024 versus 39.5% in 2023. MoneyToday's later report instead labels the 2025 operating
      result a KRW 4.4 billion profit, directly conflicting with DigitalToday's
      KRW 4.3 billion loss. Until audited statements reconcile that sign
      discrepancy, the margin direction is more reliable than the precise result.
      The pool supplies no CAC, payback, repeat-purchase cohorts, segment
      contribution profit, or free-cash-flow bridge.
    claimRefs: [CI005, CI007, CI008, CI015, CI016]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      Capital access has been demonstrated, but the evidence does not prove
      unrestricted liquidity or a fully funded plan. Korea Herald reports a KRW
      100 billion Alibaba investment for roughly 5% of ABLY, while KED Global
      earlier described letters of intent for a possible KRW 200 billion raise and
      said that final investor details were unavailable. DigitalToday reports
      approximately KRW 100.0 billion of cash and cash equivalents at 2025 year-end
      and positive 2025 operating cash flow of KRW 15.05 billion. These facts
      reduce near-term financing pressure relative to the earlier loss-making
      profile, but KoreaTechDesk's report of a KRW 50 billion venture-debt
      financing confirms that debt belongs in the capital-structure review. Public
      evidence does not specify restricted cash, debt maturity, covenants, planned
      capital expenditure, or the cash consumed by 4910, Amood, fintech, and other
      expansion initiatives.
      MoneyToday also reports a September 2026 National Tax Service audit and says
      ABLY characterized it as routine; the investigation's outcome and any
      financial exposure are unresolved.
    claimRefs: [CI006, CI009, CI010, CI011, CI012, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      ABLY's revenue quality is improving from a scale perspective: 2025 revenue
      reached a record level, transaction volume expanded, the reported operating
      loss narrowed sharply, and operating cash flow turned positive. The
      counterweight is that this remains a commerce business with meaningful
      marketing sensitivity: 2024 advertising expense rose while reported ROAS
      fell, even as gross margin improved. The unresolved sign conflict in the
      2025 operating result further limits precision. The current
      evidence supports a medium-confidence view that the core platform may be
      approaching self-financing, not a conclusion that ABLY has durable free-cash-flow
      generation. Underwriting should remain conditional on audited segment
      reporting, unit economics, debt terms, cash restrictions, and the resolution
      or quantified impact of the tax audit.
    claimRefs: [CI005, CI007, CI011, CI012, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns: [Stream, Mechanism, Current value or status, Quality, Diligence ask]
    rows:
      - [Services revenue, "Platform revenue tied to seller transactions", "KRW 227.3bn in 2025; up 20.2% year over year", "Reported by ABLY through DigitalToday; not audited here", "Disclose take rate, seller fee schedule, refunds, and contribution margin"]
      - [Merchandise revenue, "ABLY Partners / merchandise activity", "KRW 142.3bn in 2025", "Reported figure; inventory and fulfillment exposure not quantified", "Separate gross versus net recognition and inventory ownership"]
      - [Advertising and promotion, "Seller and external-corporate advertising", "2024 advertising expense KRW 42.3bn; ROAS 790%", "Adverse third-party report; not a revenue disclosure", "Provide advertising revenue, subsidy share, and incremental contribution profit"]
      - [Transaction volume, "GMV flowing through the platform", "About KRW 2.8tn in 2025, up 12%", "Company-reported operating metric; not revenue", "Reconcile GMV by ABLY, 4910, Amood, geography, and category"]
    notes: "Values are reported revenue, expense, ROAS, or GMV as labeled by the cited sources; GMV is not revenue and the implied monetization ratio is not a disclosed take rate."
    claimRefs: [CI001, CI002, CI003, CI004, CI007]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Mechanism, Public evidence, List versus realized pricing, Limitation, Diligence ask]
    rows:
      - [Platform services, "KRW 227.3bn of 2025 services revenue tied by the company to seller transactions", "Neither list fees nor realized take rate disclosed", "Revenue growth does not reveal fee incidence, refunds, or subsidies", "Provide seller contracts, fee schedules, take rate, refunds, and net revenue by segment"]
      - [ABLY Partners merchandise, "KRW 142.3bn of 2025 merchandise revenue", "Realized product margin and fulfillment pricing not disclosed", "Gross-versus-net recognition and inventory ownership are unclear", "Provide recognition policy, inventory exposure, fulfillment charges, and gross margin"]
      - [Advertising, "Biz Chosun reported seller and external-corporate advertising as a growing revenue source", "Rate card and realized yield not disclosed", "The same report documents rising advertising expense but no advertising revenue amount", "Provide ad revenue, impressions, effective CPM/CPC, seller concentration, and contribution profit"]
      - [Discounts and promotion, "No complete public price or discount schedule in the assigned evidence", "Unknown", "Promotion funding can change realized monetization without changing list fees", "Provide discount policy, company-funded incentives, seller-funded promotions, and cohort-level net revenue"]
    notes: "The assigned pool contains revenue-mechanism descriptions but no complete list-price, realized-price, fee, discount, or take-rate schedule; unknown does not mean zero."
    claimRefs: [CI002, CI003, CI007, CI013]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue growth, "KRW 369.7bn in 2025; +10.6% year over year", medium, "Shows scale growth but not revenue quality", "Provide audited segment and cohort revenue bridges"]
      - [Transaction volume, "About KRW 2.8tn in 2025; +12% year over year", high, "Provides platform-scale context but is not revenue", "Reconcile GMV by app, category, geography, cancellation, and return status"]
      - [Operating result, "DigitalToday: KRW 4.3bn loss; MoneyToday: KRW 4.4bn profit for 2025", low, "The sign conflict prevents a precise profitability conclusion", "Provide audited income statement and source reconciliation"]
      - [Gross profit margin, "44.5% in 2024 versus 39.5% in 2023", medium, "Suggests gross-margin improvement despite operating loss", "Provide accounting definition, segment mix, and audited basis"]
      - [Operating cash flow, "KRW 15.05bn surplus in 2025", medium, "Positive operating cash flow is not free cash flow", "Reconcile to capex, working capital, financing, and free cash flow"]
      - [Cash and cash equivalents, "About KRW 100.0bn at 2025 year-end", medium, "Provides a liquidity point but not runway", "Obtain bank confirmation, restrictions, and a monthly cash forecast"]
      - [Venture debt, "KRW 50bn financing reported in 2023", medium, "Debt terms could materially change available runway", "Provide principal outstanding, interest, covenants, security, and maturities"]
      - [CAC and payback, null, low, "Needed to test whether growth is economically repeatable", "Provide blended and cohort CAC, payback, retention, and contribution margin"]
    notes: "Null denotes unavailable public evidence, not zero. Funding raised is not cash available, operating cash flow is not free cash flow, and conflicting operating-result signs remain unreconciled."
    claimRefs: [CI001, CI004, CI005, CI006, CI008, CI011, CI013, CI014, CI015, CI016]
