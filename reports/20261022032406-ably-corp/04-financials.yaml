  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: "Audited segment-level take rate, CAC, payback, cohort retention, repeat purchase, NRR, and contribution margin for ABLY, 4910, Amood, and related services."
      whyItMatters: "Reported revenue and GMV show scale but cannot establish whether growth creates durable contribution profit or depends on subsidies and marketing."
      diligencePath: "Request monthly cohort and segment P&L schedules, customer-acquisition cohorts, seller fee schedules, returns, subsidies, and contribution-margin bridges under NDA."
      relatedQuestionRefs: [QI004]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current debt, venture-debt covenants, leases, guarantees, restricted cash, capex, monthly burn, and runway forecast."
      whyItMatters: "A year-end cash balance and positive operating cash flow do not reveal financing dependency or obligations that could consume liquidity."
      diligencePath: "Obtain bank statements, audited cash-flow statements, debt agreements, maturity schedule, covenant calculations, and a 24-month base/downside cash plan."
      relatedQuestionRefs: [QI008]
    - type: missing-source
      severity: material
      topic: funding
      missingEvidence: "Closing documents and cap-table reconciliation for the reported Alibaba investment and the later-described financing intentions."
      whyItMatters: "The public record distinguishes a reported KRW 100 billion investment from a possible larger raise, but does not establish exact closing status, terms, or cash available."
      diligencePath: "Request signed financing agreements, cap table, investor list, use-of-proceeds schedule, and confirmation of any unclosed commitments."
      relatedQuestionRefs: [QI006]
    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: "Outcome, scope, findings, and financial exposure from the September 2026 National Tax Service audit."
      whyItMatters: "A tax investigation can create liabilities, penalties, restatements, or operational constraints even when management describes it as routine."
      diligencePath: "Request counsel correspondence, audit notices, provision analysis, tax-contingency memo, and final disposition when available."
      relatedQuestionRefs: [QI007]
    - type: conflicting-data
      severity: material
      topic: operating-result
      missingEvidence: "Audited 2025 income statement reconciling DigitalToday's reported KRW 4.3 billion operating loss with MoneyToday's reported KRW 4.4 billion operating profit."
      whyItMatters: "The sign of the operating result determines whether ABLY crossed break-even and changes the interpretation of its margin trajectory."
      diligencePath: "Obtain the audited 2025 financial statements and reconcile translation, period, scope, and sign conventions with both reports."
      relatedQuestionRefs: [QI003, QI007]
