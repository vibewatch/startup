callouts:
  - calloutType: strength
    title: Core platform is near operating break-even
    body: "2025 operating loss narrowed to KRW 4.3 billion while operating cash flow was a KRW 15.05 billion surplus, a meaningful improvement over the earlier loss-making profile."
    claimRefs: [CI005, CI015]
  - calloutType: risk
    title: Operating-result sign is unresolved
    body: "DigitalToday reports a KRW 4.3 billion 2025 operating loss, while MoneyToday later reports a KRW 4.4 billion operating profit for the same period; audited statements must reconcile the discrepancy."
    claimRefs: [CI005, CI016]
  - calloutType: assumption
    title: Cash is not the same as runway
    body: "The disclosed year-end cash balance cannot be converted into months of runway without debt, restricted-cash, capex, working-capital, and segment burn data."
    claimRefs: [CI006, CI011, CI014, CI015]
