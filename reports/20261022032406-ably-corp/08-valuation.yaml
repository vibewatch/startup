schemaVersion: "report-v2"
artifact: valuation
slug: ably-corp
runDate: 2026-10-22
company:
  name: ABLY Corporation
chapter:
  number: 8
  title: Valuation
  summary: >-
    ABLY combines meaningful commerce scale and a 2025 return to operating profit
    with a last disclosed valuation near KRW 3 trillion. Public evidence still
    supports a research-more recommendation because that price implies a premium
    revenue multiple while financing terms, segment economics, preference rights,
    and exit readiness remain undisclosed.
sections:
  - id: financing-and-entry-price
    title: Financing context and entry discipline
    body: >-
      Alibaba invested KRW 100 billion in December 2024 and reportedly received
      about 5% of ABLY, placing the company near a KRW 3 trillion valuation.
      That headline price represented a rapid step-up from an estimated KRW 400
      billion financing value in 2021 and KRW 900 billion around the January
      2022 pre-Series C. A July 2024 report described letters of intent for a
      KRW 200 billion round, while later reporting confirmed Alibaba's KRW 100
      billion investment and said another KRW 100 billion would be sought.
      The assigned public evidence does not establish that the additional
      tranche closed. Multiples.vc calculates the December 2024 mark at 8.7x
      revenue, materially above the selected public retail and fashion revenue
      references in the same dataset. Entry at the headline valuation therefore
      requires audited current revenue quality, cap-table and preference terms,
      and proof that growth can compound without another loss-making expansion
      cycle.
    claimRefs: [CV001, CV002, CV003, CV004, CV013, CV014]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Evidence for the thesis and anti-thesis
    body: >-
      The positive case is based on scale rather than a purely prospective
      narrative. Reported 2024 revenue reached KRW 334.3 billion on KRW 2.5
      trillion of transaction volume, and a 2026 article reported KRW 369.7
      billion of 2025 revenue and KRW 4.4 billion of operating profit. ABLY also
      reported 9.4 million monthly active users, while 4910 and Amood supplied
      early evidence of category and geographic expansion. The counterweight is
      the volatility of consolidated earnings: 2024 produced a KRW 15.4 billion
      operating loss after 2023's KRW 3.3 billion profit, advertising spend rose
      while ROAS fell, and the National Tax Service began a tax audit in 2026.
      Those facts make the investment case depend on the durability and cash
      conversion of the core platform, not just GMV or user growth.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario range and comparable-set limits
    body: >-
      A revenue-multiple framework is the least misleading public method because
      ABLY's EBITDA, free cash flow, net debt, and segment contribution are not
      disclosed in the evidence set. Applying selected disclosed LTM revenue
      references to reported 2025 revenue gives an illustrative range well below
      the KRW 3 trillion headline mark: the bear case uses 1.0x, the base case
      uses 1.8x-2.5x, and the bull case uses 4.3x-4.5x. These are sensitivity
      bands, not an appraisal, because the cited businesses differ in geography,
      category, growth, and margins. PayPal and Block are useful only as boundary
      references for a future payments strategy: PayPal's revenue scale and
      Block's diversified seller, consumer-finance, and bitcoin portfolio are
      too different to justify importing their valuation logic into ABLY.
      Probability signals remain qualitative until audited cohort, take-rate,
      and cash-flow data are available.
    claimRefs: [CV007, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation, exit readiness, and thesis-break tests
    body: >-
      The recommendation is research-more with medium confidence, high risk, and
      a stretched valuation stance. The view would improve if a primary financing
      document confirms clean preferences and limited dilution, audited 2025 and
      2026 data show durable positive operating cash flow, and 4910, Amood, and
      fintech report positive incremental contribution without weakening the
      core marketplace. It would worsen if the tax audit creates a material
      liability, advertising efficiency continues to fall, consolidated losses
      recur, or another round prices below the 2024 mark. Exit readiness is not
      established: the evidence set lacks a current cap table, board and
      governance package, segment reporting, audited cash conversion, and a
      credible IPO or strategic-sale timetable. Until those items are obtained,
      neither a target return nor a hold period can be responsibly underwritten
      from public information.
    claimRefs: [CV004, CV007, CV008, CV011, CV012, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision item
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, "Research more", "Do not underwrite an entry at the headline valuation without primary financing and operating evidence."]
      - [Confidence, "Medium", "Multiple independent reports corroborate scale and financing, but private terms and cash flow remain unavailable."]
      - [Risk rating, "High", "Earnings volatility, expansion spending, financing opacity, and an active tax audit create material downside paths."]
      - [Valuation stance, "Stretched", "The reported KRW 3 trillion mark and 8.7x revenue multiple exceed the selected disclosed public-comparable references."]
      - [Entry discipline, "Price- and terms-sensitive", "Require a material discount or substantially stronger audited economics, plus clean preference and dilution terms."]
    notes: >-
      Assessments use public evidence through 2026-10-22; no current cap table,
      liquidation-preference schedule, net debt, or primary round document was available.
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV011, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - [Thesis, "Scaled core marketplace", "2024 revenue of KRW 334.3B and transaction volume of KRW 2.5T", "Audited evidence that take rate, repeat behavior, and cash conversion remain durable"]
      - [Thesis, "Operating leverage can reappear", "A 2026 report cited 2025 revenue of KRW 369.7B and operating profit of KRW 4.4B", "Two consecutive years of positive operating cash flow without subsidy escalation"]
      - [Thesis, "Optionality beyond women's fashion", "4910 and Amood reported rapid transaction growth and meaningful user or download scale", "Segment contribution data showing positive incremental returns"]
      - [Anti-thesis, "Growth has not produced stable consolidated profit", "2024 operating loss was KRW 15.4B after a KRW 3.3B profit in 2023", "Sustained profit while maintaining core share and funding new products"]
      - [Anti-thesis, "Acquisition efficiency weakened", "Advertising expense rose to KRW 42.3B while reported ROAS fell to 790%", "Cohort evidence that repeat behavior offsets lower marketing efficiency"]
      - [Anti-thesis, "Regulatory and tax uncertainty", "The National Tax Service was conducting a tax audit in September 2026", "Closed audit with immaterial liability and no adverse control findings"]
    notes: >-
      Company-reported operating and user metrics are separated from independent
      adverse reporting; transaction volume is not revenue and operating profit is not cash flow.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Scenario
      - Operating assumptions
      - Illustrative valuation logic
      - Probability signal
      - Downside or invalidation trigger
    rows:
      - [Bear, "Growth slows and operating losses recur as expansion and customer acquisition absorb core profit", "1.0x reported 2025 revenue implies about KRW 0.37T", "Meaningful while profitability remains volatile", "Tax liability, renewed loss, down round, or further ROAS deterioration"]
      - [Base, "Core growth moderates, operating profit remains positive, and new businesses approach contribution break-even", "1.8x-2.5x revenue implies about KRW 0.67T-0.92T", "Most defensible from current public evidence", "Failure to disclose segment economics or convert operating profit into cash"]
      - [Bull, "Core share holds, margins expand, and 4910, Amood, and fintech become profitable growth engines", "4.3x-4.5x revenue implies about KRW 1.59T-1.66T", "Requires evidence not currently public", "Expansion remains subsidy-dependent or an exit window fails to emerge"]
    notes: >-
      Illustrative values multiply reported 2025 revenue of KRW 369.7B by selected
      revenue-reference bands from Multiples.vc; they are sensitivity outputs, not
      enterprise-value appraisals, and exclude net debt, preferences, dilution, and FX.
    claimRefs: [CV007, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and renewed profit improve the case, but premium pricing and unresolved
      financing, operating, and regulatory evidence lead to research-more.
    data:
      nodes:
        - id: scale
          label: Proven scale
          detail: "KRW 369.7B reported 2025 revenue after KRW 334.3B in 2024"
        - id: operating-proof
          label: Operating proof
          detail: "KRW 4.4B reported 2025 operating profit, following a 2024 loss"
        - id: expansion
          label: Expansion option
          detail: "4910, Amood, and fintech can add growth but lack segment contribution disclosure"
        - id: price
          label: Premium price
          detail: "Last disclosed valuation near KRW 3T and 8.7x 2024 revenue"
        - id: unresolved-risk
          label: Unresolved risk
          detail: "Tax audit, preference terms, dilution, cash conversion, and exit timing remain open"
        - id: decision
          label: Research more
          detail: "Proceed only after primary terms and audited unit economics support the price"
    approximationNotes: >-
      The flow is a qualitative decision chain; it does not assign probabilities
      or imply that GMV, revenue, operating profit, and valuation are interchangeable.
    claimRefs: [CV009, CV010, CV011, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Investment committee stance
    body: >-
      Do not treat ABLY's unicorn status as price validation. Advance only to
      primary diligence, with valuation contingent on financing terms, audited
      cash conversion, segment contribution, and resolution of the tax audit.
    claimRefs: [CV002, CV004, CV007, CV011, CV016]
