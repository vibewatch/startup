  - id: TE002
    title: Legal Workflow Execution and Automation Analysis
    columns:
      - User Job
      - Current Manual Workflow
      - Filevine Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Client Intake & Lead Qualification
        - Fragmented emails, phone messages, and manual web form entry
        - Lead Docket with automated intake qualification and case creation
        - Eliminates dropped leads; immediate routing to case files
        - Requires customized intake forms and staff training
      - - Medical Record Chronology & Review
        - Manual review of hundreds of pages of medical bills and records
        - MedChron automated medical indexing and event timeline extraction
        - Reduces record review hours from days to minutes
        - Gaps in processing non-standard OCR or low-resolution scans
      - - Settlement Demand Generation
        - Copy-pasting matter notes into template documents
        - DemandsAI drafting directly populated from matter data and medical records
        - Compresses drafting turnaround and enforces structured demand consistency
        - Still requires attorney verification to avoid erroneous factual claims
      - - Matter Collaboration & Communication
        - Disconnected Outlook threads, text messages, and sticky notes
        - Centralized matter communication hub connecting emails, SMS, and task notes
        - Full audit trail and single source of case truth
        - Heavy user adoption discipline required across entire firm staff
    notes: Workflow comparison derived from platform documentation and comparative legal technology evaluations; benefits represent typical user improvements while limitations reflect structural implementation boundaries.
    claimRefs:
      - CE001
      - CE002
      - CE008
      - CE013
  - id: TE003
    title: Technology Architecture and Operating Stack
    columns:
      - Layer / Component
      - System Role
      - Key Dependency
      - Operational Risk
    rows:
      - - Data Layer & System of Record
        - Centralized matter database storing case files, contacts, notes, and timelines
        - Cloud database infrastructure (multi-tenant relational data store)
        - Large data migration complexity from on-premises legacy software
      - - Contextual Intelligence Engine (LOIS)
        - Context assembly, prompt engineering, and structured matter graph retrieval
        - Foundation LLM APIs and proprietary legal prompt pipelines
        - API availability, provider latency, and downstream cost per query
      - - Workflow & Automation Pipeline
        - Task automation, calendaring rules, conflict checking, and settlement calculations
        - Background job queues and webhook orchestration engine
        - Queue latency under high-volume batch automation
      - - Trust, Security & Compliance Layer
        - Access control, encryption in transit/at rest, audit logging, and regulatory controls
        - Cloud security services, OAuth/SAML identity providers, HIPAA controls
        - Misconfiguration of user-level granular permissions
    notes: Architecture analysis compiled from executive interviews, technical platform summaries, and compliance disclosures; risk items identify primary diligence vulnerabilities.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE011
      - CE014
figures:
  - id: FE001
    title: Product Architecture and Technology Stack Map
    type: stack
    summary: Six-layer architectural hierarchy illustrating Filevine's unified system from client-facing interfaces down to enterprise security and cloud infrastructure.
    data:
      layers:
        - label: Presentation & Specialized User Interfaces
          detail: Web application, standalone LOIS Console, LOIS for Word (Pincites), and client intake portal.
        - label: Agentic Intelligence & Assistance Layer
          detail: LOIS legal operating intelligence system, SidebarAI assistant, and automated drafting agents.
        - label: Domain Workflow Engines
          detail: Lead Docket, MedChron medical chronology, DemandsAI settlement packages, and Vinesign e-signatures.
        - label: Core Legal Operations & Case Management
          detail: Matter management, centralized document repository, time tracking, billing, invoicing, and Payments by Filevine.
        - label: Data Management & Structured Graph Layer
          detail: Structured matter graph, relational case database, audit logging, and data migration ingestion pipeline.
        - label: Security, Compliance & Infrastructure Foundation
          detail: SOC 2 Type II, HIPAA 0-day retention controls, CJIS, ISO 27001/27002, and multi-tenant cloud infrastructure.
    approximationNotes: Conceptual architectural abstraction based on publicly disclosed platform components, executive interviews, and compliance specifications.
    claimRefs:
      - CE001
      - CE006
      - CE011
callouts:
  - calloutType: insight
    title: System-of-Record Moat vs. Point AI Tools
    body: Filevine's strategic technical advantage lies in housing the underlying system of record. Whereas point AI solutions rely on external document uploads or read-only summarization, Filevine's LOIS agent interacts directly with historical matter data, timelines, and communications, allowing AI generations to write back into operational workflows.
    claimRefs:
      - CE001
      - CE002
      - CE006
  - calloutType: risk
    title: Underlying Foundation Model API Dependencies
    body: Although Filevine emphasizes proprietary prompt engineering and structured matter graph retrieval to minimize hallucinations, the platform remains operationally dependent on underlying commercial foundation models. Changes in third-party API availability, inference pricing, or context window terms pose direct margin and reliability risks.
    claimRefs:
      - CE006
      - CE014
