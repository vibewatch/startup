evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting-and-cash-flow
    missingEvidence: >-
      Audited financial statements, current annual recurring revenue (ARR), cash burn rates, and free-cash-flow margins
      post-2023.
    whyItMatters: >-
      Without audited financial statements, Filevine's profitability, burn runway, and operational leverage cannot be
      independently validated.
    diligencePath: >-
      Request confidential audited financial exhibits and trailing twelve-month revenue cohort reports during management
      diligence.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-investor-enumeration
    missingEvidence: Complete cap-table equity allocations, board member voting agreements, and secondary transaction share marks.
    whyItMatters: >-
      Partial governance visibility limits assessment of liquidation preferences and voting control among institutional
      investors.
    diligencePath: >-
      Review complete capitalization table, investor rights agreements, and voting trusts under mutual non-disclosure
      agreement.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: ai-revenue-disaggregation
    missingEvidence: >-
      Audited financial breakdown separating base case-management SaaS subscription revenue from consumption-based AI
      tool fees (DemandsAI, MedChron, LOIS for Word) and gross margins across software tiers.
    whyItMatters: >-
      Without segmented financial disclosures, it is impossible to verify whether the reported 130% AI revenue growth
      represents high-margin software expansion or subsidized model compute pass-through.
    diligencePath: >-
      Request management reporting disaggregating annual recurring revenue by module, tracking per-case AI gross
      margins, and evaluating customer AI attach cohorts.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: ai-attach-and-migration
    missingEvidence: >-
      Granular breakdown of realized customer attach rates for premium LOIS AI modules (DemandsAI, MedChron) and audited
      churn rates among firms migrating from legacy on-premise PMS.
    whyItMatters: >-
      Directly impacts durability assessment: determines whether Filevine's growth is driven by expanding software ARPU
      or vulnerable to unbundling by point AI solutions.
    diligencePath: >-
      Request customer cohort retention data, module attach metrics, and customer win/loss reports against Clio and
      specialized PI tools during management diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: gaap-margins-and-unit-economics
    missingEvidence: >-
      Audited financial statements detailing gross margins, hosting and third-party AI compute costs, and contribution
      margins by software module.
    whyItMatters: >-
      Without disclosed cost of goods sold, underwriters cannot evaluate whether AI agentic features (LOIS) cause gross
      margin compression relative to traditional 75-80% SaaS benchmarks.
    diligencePath: >-
      Request confidential disclosure of audited fiscal year income statements, hosting infrastructure invoices, and LLM
      token API pass-through expenses.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: retention-and-burn-profile
    missingEvidence: >-
      Cohort-level net revenue retention (NRR), gross churn by customer segment, and current operating monthly cash
      burn.
    whyItMatters: >-
      Forward capital adequacy and runway depend on whether Filevine generates self-sustaining free cash flow or remains
      reliant on external growth equity rounds to subsidize operations.
    diligencePath: >-
      Obtain management reporting package showing cohort retention waterfall, average contract value progression, and
      trailing twelve-month cash flow bridge.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: ai-inference-benchmarks
    missingEvidence: >-
      Audited model inference latency metrics, dedicated compute hardware configurations, and specific commercial
      foundation model provider allocations (such as OpenAI versus Anthropic endpoints) for LOIS queries.
    whyItMatters: >-
      Without disclosure of inference cost structures and token routing economics, underwriters cannot verify long-term
      gross margin durability as usage shifts from static software seats to intensive agentic automation.
    diligencePath: >-
      Request engineering architecture documentation detailing average API latency per prompt, token consumption per
      matter, and fallover SLAs across third-party LLM vendors during technical diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-api-benchmarks
    missingEvidence: >-
      Public developer API endpoint documentation, rate limit specifications, and third-party webhook performance
      metrics.
    whyItMatters: >-
      Custom integrations with bespoke firm accounting or legacy on-premises databases rely on REST and webhook
      reliability, which currently requires authenticated partner credentials to assess.
    diligencePath: >-
      Review developer portal API schemas and sandbox test logs under a non-disclosure agreement to evaluate throughput
      and data sync limits.
    relatedQuestionRefs:
      - QE001
    relatedTableRefs:
      - TE003
  - type: stale
    severity: material
    topic: current-customer-scale
    missingEvidence: >-
      A current customer count with paying, active, and retained account definitions, plus active-seat and module-attach
      denominators.
    whyItMatters: >-
      The available company scale disclosures describe 2023 and cannot establish customer growth or contraction through
      the 2026-10-12 run date.
    diligencePath: >-
      Request monthly customer, seat, and module cohorts from 2023 through the latest closed month, reconciled to billed
      subscriptions.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Current GRR, numeric NRR, logo churn, renewal rates, contract length, and retention cohorts by firm size and
      practice area.
    whyItMatters: >-
      Historical upsell and qualitative NDR language cannot establish current durability or separate expansion from
      customer churn.
    diligencePath: Obtain cohort schedules and renewal files, then reconcile them to customer references and billed ARR.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-1, top-5, top-10, and top-20 customer revenue concentration, channel contribution, and renewal timing.
    whyItMatters: Large legal organizations may carry disproportionate ARR or renewal risk even when total customer count is broad.
    diligencePath: >-
      Review an anonymized customer revenue schedule with contract end dates, modules, channels, and historical
      expansion.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Independent confirmation of deployed modules, production status, go-live dates, seat counts, and measured outcomes
      for the named customer sample.
    whyItMatters: >-
      Company-issued relationship announcements and anonymous reviews do not establish representative production depth
      or realized outcomes.
    diligencePath: >-
      Conduct reference calls with customers selected across firm size and practice area, including churned or
      dissatisfied accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: Regulatory / legal risk register
    missingEvidence: >-
      Comprehensive docket audit of confidential commercial settlements, pending state bar ethics inquiries, and
      contractual dispute filings across key state jurisdictions.
    whyItMatters: >-
      Unresolved legal disputes or confidential customer litigation over implementation failures could impose unexpected
      financial liabilities and damage brand reputation in enterprise markets.
    diligencePath: >-
      Request litigation disclosure schedules, state bar correspondence, and customer dispute settlement logs during
      formal investment diligence.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: customer-cohort-retention-and-churn
    missingEvidence: >-
      Granular customer cohort retention data, gross churn breakdown by firm size segment, and net promoter score
      distributions across certified vs non-certified partner implementations.
    whyItMatters: >-
      Implementation friction and custom quote complexity could obscure underlying gross churn rates that threaten
      long-term net revenue retention.
    diligencePath: >-
      Review audited cohort retention tables, customer satisfaction audit logs, and logo churn breakdowns across
      small-firm versus enterprise accounts.
  - type: private-evidence-only
    severity: blocking
    topic: financial-transparency
    missingEvidence: Audited financial statements confirming current gross margin, net cash burn, and free-cash-flow margins.
    whyItMatters: >-
      A 14.6x forward ARR multiple requires gross margins above 75% and a path to positive free cash flow to avoid
      dilutive recapitalizations.
    diligencePath: Request audited GAAP financial statements and monthly management accounts under non-disclosure agreement.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: >-
      Detailed capitalization table disclosing seniority tiers, liquidation preference multiples, and anti-dilution
      rights for Series E/F preferred stock.
    whyItMatters: >-
      A $400 million preferred capital stack can wipe out common and secondary equity returns in flat or down-round M&A
      outcomes.
    diligencePath: Review full amended Certificate of Incorporation and schedule of investors from lead legal counsel.
    relatedQuestionRefs:
      - QV008
