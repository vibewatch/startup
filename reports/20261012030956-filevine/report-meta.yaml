  topStrengths:
    - Broad legal operating platform with sticky workflow depth across documents, billing, payments, and AI tools.
    - Meaningful customer traction and scale supported by public growth disclosures and a large installed base.
    - Well-capitalized private profile with major growth-equity backing and continued product expansion.
  topRisks:
