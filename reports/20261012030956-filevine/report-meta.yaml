companyProfile:
  summary: >-
    Filevine is a Salt Lake City-founded legal technology company that provides an AI-native legal operating platform
    spanning matter management, documents, billing, payments, and LOIS agentic tools. It serves litigation-heavy firms,
    enterprise legal teams, and public-sector legal users, with public disclosures pointing to roughly 6,000 customer
    organizations and a 2025 financing package that reinforced its growth trajectory. The company remains privately
    held, so current audited margins, burn, and capital structure details are still not public.
