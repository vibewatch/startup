callouts:
  - calloutType: risk
    title: Onboarding Complexity as Structural Churn Bottleneck
    body: >-
      Filevine's extensive configurability creates substantial risk of protracted implementations. Because realization
      of software value depends on customized matter phases, template automation, and trained internal champions, poor
      onboarding experiences create early customer friction, elevate year-one churn risk, and depress net promoter
      scores.
    claimRefs:
      - CR004
      - CR005
  - calloutType: insight
    title: TCO Expansion and Specialization Pressures
    body: >-
      While Filevine provides broad matter and practice management capabilities, total cost of ownership often expands
      1.5x to 2x beyond base subscription fees due to consultant setup costs and modular add-on pricing. This cost
      inflation, combined with competing specialized point solutions for pre-litigation tasks, creates ongoing
      displacement exposure among mid-sized law firms.
    claimRefs:
      - CR005
      - CR006
      - CR007
