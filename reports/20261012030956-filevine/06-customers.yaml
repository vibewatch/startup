company:
  name: "Filevine"
chapter:
  number: 6
  title: "Customers"
  summary: "Filevine has credible historical adoption across litigation-heavy law firms and has widened its stated reach to enterprises and government agencies, but the strongest scale evidence is company-issued and dated to 2023. Current retention, customer concentration, and production outcomes remain private, while a 50-review snapshot shows both solid aggregate satisfaction and a meaningful one-star tail."
sections:
  - id: "segments-and-buyer-fit"
    title: "Segments and buyer fit"
    body: >-
      Filevine presents one platform for law firms, global enterprises, and government agencies,
      while its sitemap targets organizations from solo and small practices through Big Law,
      in-house teams, public defenders, prosecutors, and federal agencies. Independent and
      competitor-authored comparisons narrow the strongest fit to litigation-heavy, high-volume,
      and personal-injury workflows where customization can justify implementation effort. That
      evidence supports a broad addressable customer surface but not equal product-market fit in
      every segment. Small or generalist practices face a less favorable trade-off because reviewers
      consistently pair Filevine's configurability with higher setup complexity, opaque pricing, and
      the need for an internal operational owner.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "historical-adoption-signals"
    title: "Historical adoption signals"
    body: >-
      The most concrete adoption disclosures are historical. Filevine said it surpassed 3,500
      customers during 2023, welcomed nearly 300 new customers in the fourth quarter, and was used
      daily by more than 3,400 law firms and legal teams when the release was published in February
      2024. It also reported 6,200 Filevine University users completing nearly 27,000 courses and a
      2,000% increase in SidebarAI usage during the first week after launch. These metrics show
      onboarding activity, new-logo momentum, and initial feature engagement, but they do not
      establish a current customer count, active-seat denominator, durable AI usage, or paid AI
      attach rate as of the 2026-10-12 run date.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-adverse-feedback"
    title: "Named proof and adverse feedback"
    body: >-
      Company-issued evidence names law firms that selected Filevine and lists additional notable
      customers, which is stronger than a logo wall but still does not disclose contract scope,
      deployed modules, go-live dates, or measured outcomes. The assigned independent evidence adds
      production-use texture through verified reviewers rather than independently verified customer
      case studies. Software Finder's 2026 snapshot contains 50 verified customer reviews with a
      4.1-out-of-5 average, alongside a 16% one-star share. Three visible one-star reviews from
      organizations with 1-50 employees cite cost, support, fit, and implementation friction. This
      combination supports real use and real dissatisfaction, but not a representative churn estimate.
    claimRefs:
      - "CU009"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-concentration"
    title: "Durability, expansion, and concentration"
    body: >-
      Filevine's February 2024 release attributed more than 50% growth in ending ARR during 2023 to
      both new-logo sales and existing-customer upsell, and described net dollar retention as
      best-in-class without publishing the percentage. The platform design creates plausible
      expansion surfaces from intake into matter and document management, AI tools, billing,
      payments, integrations, and analytics. However, this is mechanism evidence rather than
      current retention proof. The assigned sources provide no current GRR, NRR, churn, renewal,
      cohort, contract-length, top-customer concentration, or segment-level AI attach data. Those
      omissions prevent a durable revenue-quality judgment and should be resolved with customer
      cohort schedules and reference calls before underwriting expansion.
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU016"
    figureRefs:
      - "FU001"
callouts:
