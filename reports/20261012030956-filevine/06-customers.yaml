  evidenceGaps:
    - type: "stale"
      severity: "material"
      topic: "current-customer-scale"
      missingEvidence: "A current customer count with paying, active, and retained account definitions, plus active-seat and module-attach denominators."
      whyItMatters: "The available company scale disclosures describe 2023 and cannot establish customer growth or contraction through the 2026-10-12 run date."
      diligencePath: "Request monthly customer, seat, and module cohorts from 2023 through the latest closed month, reconciled to billed subscriptions."
      relatedQuestionRefs:
        - "QU002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention"
      missingEvidence: "Current GRR, numeric NRR, logo churn, renewal rates, contract length, and retention cohorts by firm size and practice area."
      whyItMatters: "Historical upsell and qualitative NDR language cannot establish current durability or separate expansion from customer churn."
      diligencePath: "Obtain cohort schedules and renewal files, then reconcile them to customer references and billed ARR."
      relatedQuestionRefs:
        - "QU004"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Top-1, top-5, top-10, and top-20 customer revenue concentration, channel contribution, and renewal timing."
      whyItMatters: "Large legal organizations may carry disproportionate ARR or renewal risk even when total customer count is broad."
      diligencePath: "Review an anonymized customer revenue schedule with contract end dates, modules, channels, and historical expansion."
      relatedQuestionRefs:
        - "QU006"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: "Independent confirmation of deployed modules, production status, go-live dates, seat counts, and measured outcomes for the named customer sample."
      whyItMatters: "Company-issued relationship announcements and anonymous reviews do not establish representative production depth or realized outcomes."
      diligencePath: "Conduct reference calls with customers selected across firm size and practice area, including churned or dissatisfied accounts."
      relatedQuestionRefs:
        - "QU003"
      relatedTableRefs:
        - "TU003"
