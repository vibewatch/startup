      - Anti-Thesis Risk & Headwinds
      - What Would Change the View
    rows:
      - - Platform & Data Gravity
        - >-
          Deep matter management, documents, billing, and payments create high switching costs across 5,000+ customer
          firms.
        - >-
          Complex custom onboarding and multi-module sprawl cause long implementation cycles (4 to 8 weeks) and
          operational friction.
        - Standardized self-serve onboarding metrics and reduced time-to-value across mid-market deployments.
      - - Agentic AI Expansion
        - >-
          LOIS and DemandsAI leverage matter context to automate high-value tasks, driving expanding ARPU and customer
          upsell.
        - >-
          Modular add-on pricing and per-case fees encourage firms to evaluate focused point solutions (e.g.
          ProPlaintiff, EvenUp).
        - Disclosed high net expansion (>125% NRR) specifically attributed to core LOIS seat and consumption adoption.
      - - Financing & Scale
        - >-
          Over $550M total raised ($400M in Sept 2025) backed by Insight Partners and Accel provides deep runway for M&A
          and R&D.
        - >-
          Demanding ~$3.0B valuation (~14.6x run-rate ARR) leaves little margin for error under higher cost-of-capital
          regimes.
        - >-
          Public verification of sustained >50% revenue growth accompanied by positive operating cash flow and >75%
          gross margins.
    notes: >-
      Pillars contrast strategic platform advantages with commercial and valuation risks identified across industry
      reviews.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Operating & Growth Assumptions
      - Implied ARR & Valuation Multiple
      - Projected Valuation & Return Logic
    rows:
      - - Bull Case
        - 25%
        - LOIS drives rapid ARPU growth; ARR grows 55% YoY to $320M; Rule of 40 maintained with >20% FCF margin.
        - 'ARR: $320M | Multiple: 18.0x EV/ARR'
        - $5.76B enterprise value; delivers ~1.9x gross return from the September 2025 round; primes 2027 IPO.
      - - Base Case
        - 50%
        - >-
          Steady mid-market expansion; core ARR reaches $275M (34% YoY); multiple compresses to market vertical SaaS
          levels.
        - 'ARR: $275M | Multiple: 11.0x EV/ARR'
        - $3.025B enterprise value; flat equity value protecting preferred capital but offering minimal common upside.
      - - Bear Case
        - 25%
        - Competitors (Clio, Litify, AI specialists) squeeze churn; ARR growth slows to 15% ($235M ARR); burn persists.
        - 'ARR: $235M | Multiple: 6.5x EV/ARR'
        - >-
          $1.528B enterprise value; triggers significant down-round dilution and preference impairment for junior
          holders.
    notes: >-
      Probabilities and multiples reflect comparable vertical software transactions and broader software market
      benchmarks.
    claimRefs:
      - CV002
      - CV003
