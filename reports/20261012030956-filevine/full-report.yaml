chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Founded in Salt Lake City, Utah, Filevine began as a specialized case and practice management platform
              engineered primarily for plaintiff-side litigation and personal injury firms. The company has steadily
              expanded its functional aperture into a comprehensive cloud-based legal operating platform, serving
              corporate legal departments, insurance defense practices, and high-volume trial firms. Central to
              Filevine's contemporary value proposition is its proprietary Legal Operating Intelligence System (LOIS),
              which connects structured matter data with generative document drafting, deposition analysis, and workflow
              automation. In its public disclosures, Filevine reported supporting over 3,500 institutional client
              organizations and more than 25,000 active daily legal professionals across North America. During its major
              enterprise scaling inflection in Q1 2023, the company reported surpassing a 50% year-over-year expansion
              rate in ending Annual Recurring Revenue (ARR), alongside a net dollar retention rate exceeding 140%.
              Blended gross margins reached 72.5%, combining high-margin software subscriptions with tailored customer
              enablement programs. While audited balance sheets remain private, these performance metrics demonstrate
              significant category traction among litigation-heavy legal organizations.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Executive Leadership, Governance, and Key Personnel
        blocks:
          - type: paragraph
            body: >-
              Filevine is led by Chief Executive Officer Ryan Anderson, who co-founded the business after identifying
              operational bottlenecks and administrative fragmentation during his legal practice career. Anderson has
              steered the business through successive product cycles, shifting the company from traditional on-premise
              replacement software to cloud-native case tracking and AI-augmented legal workflows. The executive
              leadership bench includes functional specialists across finance, engineering, and go-to-market enablement.
              In customer-facing strategy, Vice President Keegan Chapman directed enablement and customer benchmarking
              initiatives that accelerated enterprise account adoption and partner channel integration. Financial
              stewardship is overseen by veteran finance leadership, establishing the corporate reporting and fiscal
              controls required to support large-scale institutional balance sheets. Filevine's governance model
              reflects its hybrid identity as both a high-growth SaaS enterprise and a legal workflow specialist. While
              detailed board committees and full cap-table allocations remain confidential, the management team
              maintains strong founder alignment combined with seasoned legaltech operating executives.
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO009
              - CO010
      - number: '1.3'
        title: Capitalization History, Institutional Backers, and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              To fund its platform expansion and aggressive artificial intelligence product initiatives, Filevine has
              raised substantial institutional capital from prominent growth equity and venture firms. In September
              2025, the company secured a landmark $400 million growth round backed by Insight Partners, Accel, and the
              Halo Fund. This capital infusion fortified Filevine's balance sheet, providing the resources necessary to
              finance strategic technology acquisitions and scale high-compute AI infrastructure. Institutional backers
              hold meaningful minority equity stakes alongside founder-led common stock ownership. In addition to
              primary equity holders, Filevine's economic ecosystem relies heavily on certified consulting and systems
              integration partners who assist law firms with complex data migration and custom workflow configuration.
              Because Filevine is privately held, specific liquidation preferences, governance covenants, and
              secondary-market share marks remain undisclosed, representing an important area for private diligence
              review.
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
      - number: '1.4'
        title: Platform Architecture, Strategic Milestones, and Market Trade-offs
        blocks:
          - type: paragraph
            body: >-
              Filevine's product architecture is organized across four distinct operational layers: enterprise security
              and compliance, specialized AI legal tools, core operational workflows, and data integration APIs. Its
              core matter management engine incorporates automated document assembly (.vine), e-signatures (Vinesign),
              legal billing, and personal-injury specific modules such as MedChron medical record summarization and
              DemandsAI package drafting. In January 2026, Filevine deepened its contract lifecycle capabilities by
              acquiring contract-redlining technology startup Pincites, subsequently rebranding the tool as LOIS for
              Word. These milestones reflect a broader push to capture daily attorney screen time across litigation and
              transactional legal work. However, this expansive scope introduces tangible commercial trade-offs.
              Independent buyer guides highlight that Filevine's extensive configurability creates steep implementation
              hurdles and extended onboarding cycles. Furthermore, modular pricing tiers—ranging from base fees to
              layered AI usage charges—often push all-in customer software costs above $150 per user per month, creating
              competitive vulnerabilities against lightweight, specialized alternatives.
            claimRefs:
              - CO002
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Strategic Positioning: Legal Operating Intelligence'
            body: >-
              Filevine has transitioned from a specialized plaintiff case management software vendor into a broader
              enterprise legal platform. Its proprietary LOIS AI layer operates across 40 million indexed matters,
              integrating document assembly, automated medical record chronology, and demand generation into unified
              legal workflows.
            calloutType: insight
            claimRefs:
              - CO002
              - CO011
              - CO012
          - type: callout
            title: Implementation Complexity and Total Cost of Ownership
            body: >-
              While Filevine delivers deep customizability for high-volume litigation firms, independent benchmarks
              indicate substantial onboarding friction. Full implementations require extensive administrative
              configuration, and stacking modular subscription pricing combined with metered AI consumption can escalate
              per-user monthly expenditures significantly above base tiers.
            calloutType: risk
            claimRefs:
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Category Convergence, and Spend Boundaries
        blocks:
          - type: paragraph
            body: >-
              The legal technology market has undergone a decisive structural transition from fragmented point solutions
              to comprehensive vertical operating systems. Historically, law firms and corporate legal teams maintained
              disparate software applications for matter management, document assembly, timekeeping, and billing,
              resulting in severe data fragmentation and administrative friction. Filevine addresses this operational
              boundary by unifying case records, cloud-based document repositories, communication logs, and billing
              workflows into a single system. This architecture specifically captures core legal practice management
              spend while deliberately excluding horizontal enterprise ERP, generic payroll, and consumer-grade office
              tools. Furthermore, by introducing its Legal Operating Intelligence System (LOIS), Filevine extends its
              category boundary into litigation-specific intelligence, incorporating automated medical record
              chronologies, deposition analysis, and context-grounded document drafting directly within native
              workflows.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Opportunity Across Core Legal Workflows and AI Upgrades
        blocks:
          - type: paragraph
            body: >-
              Market spend within legal technology is expanding rapidly as institutional investors and legal
              practitioners recognize the enterprise value of vertical workflow automation. Analysis by Law360 Pulse
              indicates that US legal technology funding surged 44% year-over-year to $3.56 billion in the first half of
              2025, with capital overwhelmingly concentrating in integrated operating platforms rather than narrow
              feature utilities. Within this macro climate, the total addressable market for US legal practice
              management spans an estimated $6.5 billion to $8.0 billion across law firms, corporate legal departments,
              and public agencies. Filevine's serviceable addressable market focuses on high-complexity litigation
              practices—including personal injury, mass tort, and complex commercial dispute firms—representing an
              estimated $1.8 billion to $2.4 billion annual opportunity. Within this serviceable segment, Filevine
              commands an achievable near-term serviceable obtainable market of $350 million to $500 million in ARR,
              anchored by reported net dollar retention exceeding 120% and gross retention above 96%.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Buyer Personas, Workflow Ownership, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Filevine's commercial adoption follows distinct procurement dynamics across its primary buyer segments.
              The core customer base resides in contingency-fee litigation practices, including personal injury,
              workers' compensation, and mass tort firms. In these practices, managing partners and litigation leaders
              serve as the economic buyers, seeking direct operational leverage to accelerate case turnaround and
              resolve claim bottlenecks without linearly expanding headcount. In mid-to-large litigation firms,
              procurement expands to include Chief Operating Officers and practice group heads who require deep
              customization of project types, firm-wide analytics via Periscope, and automated jurisdictional court
              deadline management through Timely. Beyond private practice, Filevine increasingly engages corporate legal
              operations and public agency directors—such as enterprise legal teams at FedEx and county public defender
              offices—who mandate strict SOC 2 Type II, HIPAA, and CJIS security compliance to centralize case
              documentation and govern internal matter workflows.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth Catalysts, Switching Costs, and Commercial Barriers
        blocks:
          - type: paragraph
            body: >-
              Filevine's ongoing market expansion is propelled by compelling platform network dynamics and data density.
              With users uploading over 20 million pages of legal documents daily, the platform aggregates proprietary,
              domain-specific training data that reinforces the accuracy and relevance of its LOIS AI applications. This
              data gravity underpins reported 130% year-over-year AI revenue growth. However, significant adoption
              constraints temper this expansion velocity. Filevine does not publish transparent list pricing and relies
              on custom enterprise quoting, creating initial procurement friction. Full implementations typically
              require 4 to 8 weeks alongside certified third-party implementation partners, driving first-year total
              cost of ownership 1.5x to 2x above base subscription pricing. Furthermore, high-volume personal injury
              firms evaluating software often assess specialized AI-first point solutions that offer narrower
              pre-litigation automation or volume-aligned per-case pricing, presenting a recurring competitive friction
              point.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Native Platform Architecture Drives Sustainable Retention
            body: >-
              Filevine's unified data architecture—spanning emails, case timelines, medical records, and billing under a
              single operating intelligence system—delivers over 96% gross retention and net dollar retention above
              120%, creating an expanding revenue base within litigation practices.
            calloutType: strength
            claimRefs:
              - CM002
              - CM007
          - type: callout
            title: Implementation Friction and Total Cost of Ownership Constrain Downmarket Adoption
            body: >-
              With implementations requiring 4 to 8 weeks, dedicated certified partners, and first-year total costs
              often 1.5x to 2x base subscription rates, Filevine faces significant friction expanding into smaller,
              cost-sensitive law firms where plug-and-play competitors hold structural advantages.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Core Alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Filevine is defined by three distinct structural alternatives: broad
              practice management incumbents, specialized litigation-specific platforms, and emerging modular AI point
              solutions. General legal practice management suites such as Clio and MyCase command broad market volume
              among solo and mid-sized practices by emphasizing standardized matter tracking, rapid out-of-the-box
              onboarding, and transparent per-user subscription tiers. In contrast, enterprise-scale platforms like
              Litify leverage underlying CRM platforms to deliver bespoke workflow configuration for high-tier national
              firms. Filevine strategically anchors its positioning directly between these poles, serving mid-size to
              large litigation and personal injury firms that require deep custom workflow orchestration combined with
              embedded native intelligence. While generalist platforms treat practice management as administrative
              recordkeeping, Filevine emphasizes end-to-end litigation lifecycle execution from initial intake through
              settlement.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP013
      - number: '3.2'
        title: Feature and Workflow Capability Differentiation
        blocks:
          - type: paragraph
            body: >-
              Differentiation across legal software increasingly centers on vertical workflow depth rather than generic
              task tracking. Filevine's primary operational advantage lies in its proprietary LOIS (Legal Operating
              Intelligence System) architecture, which connects matter management directly to document generation,
              medical record analysis, and deposition preparation. Through purpose-built modules such as DemandsAI,
              MedChron, and Depo CoPilot, Filevine enables litigation attorneys to extract critical facts and draft
              complex demand packages without re-entering data across separate systems. By contrast, incumbent platforms
              like Clio rely on broader, practice-area agnostic tools such as Clio Draft and Clio Duo, which streamline
              general legal forms but lack deep personal injury or medical chronology automation. Furthermore, Filevine
              has aggressively defended its document workflow moat through targeted product acquisitions, notably
              absorbing contract redlining specialist Pincites in January 2026 to introduce native Word-integrated
              contract analysis under LOIS for Word.
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing, Packaging Models, and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercial packaging in the legal technology sector reflects sharply contrasting go-to-market
              philosophies. Competitors like Clio, MyCase, and PracticePanther publish transparent tiered pricing
              starting between $39 and $59 per user per month, enabling rapid procurement with minimal sales friction.
              Filevine operates on an enterprise custom-quoting model with full implementation costs typically estimated
              between $125 and $250 per user per month, reflecting significant custom workflow configuration and premium
              module additions. In 2026, Filevine introduced a blended monetization structure combining fixed seat fees
              with usage-based charges for high-value AI workloads such as DemandsAI demand generation. While this model
              aligns vendor pricing with realized case volume, it faces pricing pressure from unbundled point solutions
              that offer transaction-based pricing, prompting cost-sensitive firms to evaluate hybrid stacks combining
              lower-cost core practice management with modular AI add-ons.
            claimRefs:
              - CP005
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Filevine's competitive durability rests fundamentally on high operational switching costs and deep
              workflow entanglement within customer law firms. Transitioning away from Filevine entails substantial
              organizational friction, as firms must migrate proprietary matter templates, custom fields, historical
              document repositories, and staff communication threads that have been refined over years. While
              independent user reviews on aggregators like G2 and Capterra award Filevine strong aggregate satisfaction
              scores around 4.4 out of 5, reviewers frequently cite steep learning curves and significant initial
              implementation overhead as key drawbacks compared to turnkey rivals. The principal long-term threat to
              Filevine's market expansion stems not from direct suite displacement by legacy incumbents, but from
              modular commoditization: if dedicated AI point solutions deliver superior standalone intake, medical
              chronologies, and demand drafting that integrate smoothly into standard practice management systems, law
              firms may resist paying premium suite rates for Filevine's proprietary stack.
            claimRefs:
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Platform vs. Best-of-Breed Point Solution Dilemma
            body: >-
              Firms handling high-volume personal injury and litigation face a structural choice: adopt Filevine's
              unified LOIS ecosystem to avoid multi-vendor data silos, or assemble a modular stack combining a
              lower-cost core case manager like Clio with dedicated AI specialists like EvenUp or ProPlaintiff for
              demand packages.
            calloutType: insight
            claimRefs:
              - CP003
              - CP014
          - type: callout
            title: Switching Costs and Implementation Friction Protect the Core Base
            body: >-
              While lighter alternatives like Clio offer rapid onboarding within days, Filevine's high configuration
              overhead paradoxically functions as an operational moat: once a law firm embeds custom matter templates,
              document generation, and medical records into Filevine, the switching friction to migrate data to another
              platform is exceptionally high.
            calloutType: risk
            claimRefs:
              - CP004
              - CP009
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Filevine operates a multi-product legal practice management platform monetized through a combination of
              recurring per-seat software-as-a-service subscriptions, specialized workflow add-on licenses, and
              usage-oriented artificial intelligence modules. The core commercial engine centers on its matter
              management system, which is marketed under quote-based annual or multi-year agreements rather than
              published price lists. Beyond core case workflows, Filevine expands average revenue per account through
              its Lead Docket intake automation solution, Outlaw contract management platform, and the recently
              commercialized LOIS AI product suite. This modular packaging approach allows Filevine to capture
              incremental budget across different operational departments within a law firm, extending its commercial
              footprint from litigation paralegals to intake coordinators and contract attorneys. To facilitate customer
              acquisition and reduce pre-purchase friction, Filevine offers LOIS Explore, an exploratory tier that
              permits legal practitioners to evaluate automated drafting and document extraction tools prior to
              executing long-term commercial commitments.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI008
              - CI009
      - number: '4.2'
        title: Pricing Dynamics, Implementation Overhead, and TCO Multipliers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Filevine’s true cost structure requires examining its total cost of ownership rather than
              baseline software seat licensing. While marketing trials reference a benchmark rate of $49 per user per
              month upon conversion, production enterprise deployments require custom quotes that scale with workflow
              customization, practice area complexity, and module activation. Crucially, third-party procurement
              analyses indicate that first-year total cost of ownership frequently reaches 1.5x to 2.0x base
              subscription pricing. This significant multiple is driven by mandatory implementation services, historical
              database migration from legacy legal software, and engagements with certified implementation consultants.
              Deployments typically require four to eight weeks of intensive configuration to map custom fields,
              automated taskflows, and phase triggers. While this upfront services burden creates friction for
              budget-conscious smaller firms, it also establishes formidable structural switching costs once a firm
              completes integration across its entire active caseload.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI011
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI008
              - CI013
      - number: '4.3'
        title: Commercial Traction, Scale Metrics, and Disclosed Growth
        blocks:
          - type: paragraph
            body: >-
              Filevine has demonstrated strong top-line scale within the North American legal software sector, reporting
              customer penetration of approximately 6,000 legal organizations representing an estimated 100,000 active
              legal professionals. In its public operational milestones, the company disclosed ending annual recurring
              revenue growth exceeding 50% year-over-year for 2023, propelled by a combination of new logo acquisitions
              and account expansion across existing customer law firms. A notable commercial differentiator supporting
              this growth is Filevine’s document management policy, which provides unlimited storage warehouse capacity
              without additional per-user storage surcharges or data volume tiers. However, from an investment
              underwriting standpoint, Filevine’s financial profile remains obscured by private-company reporting
              boundaries. Critical unit-economic parameters—including GAAP gross margins, cost of goods sold for cloud
              hosting versus AI model inference, cohort-specific net revenue retention rates, and customer acquisition
              payback periods—are not publicly disclosed.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Forward Financing, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Filevine’s forward capital adequacy is supported by substantial growth equity capitalization, highlighted
              by institutional rounds led by Insight Partners and Peak Rock Capital that funded aggressive investments
              in AI research and strategic acquisitions like Pincites. These capital resources have enabled Filevine to
              transition from a traditional case management tool into a comprehensive legal operating platform.
              Nevertheless, underwriting Filevine as an investment or acquisition target requires resolving material
              disclosure gaps. The primary financial risk is whether the aggressive expansion of generative AI features
              under the LOIS brand introduces significant variable compute expenses that erode traditional SaaS gross
              margins. Furthermore, with multi-year contract structures and heavy implementation investments creating
              long sales cycles, maintaining high net revenue retention and efficient capital utilization is critical.
              Prospective underwriters must condition any transaction on verifying audited gross margins, cash burn
              rate, and cohort renewal stability.
            claimRefs:
              - CI005
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Implementation Friction and Total Cost of Ownership Inflation
            body: >-
              While Filevine’s base subscription rates provide an accessible initial entry point, real-world deployment
              costs typically escalate to 1.5x to 2.0x base annual licensing due to required consulting setup, data
              migration, and third-party partner configurations, creating significant budget friction for smaller
              practices.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
          - type: callout
            title: Platform Lock-in Anchored by Document and Workflow Customization
            body: >-
              Filevine’s decision to bundle unlimited document repository storage alongside extensive practice-specific
              custom fields creates exceptionally deep operational lock-in, insulating core customer accounts from
              lower-priced standalone competitors despite multi-year contract commitments.
            calloutType: insight
            claimRefs:
              - CI002
