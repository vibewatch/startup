      platform.
    data:
      items:
        - date: '2015-01-01'
          label: Company Founding
          detail: Filevine founded in Salt Lake City, Utah, focusing on case management for litigation law firms.
          tone: neutral
        - date: '2022-10-15'
          label: Document Assembly Launch
          detail: Released Filevine Document Assembly (.vine) in Q4 2022 to automate complex legal document generation.
          tone: positive
        - date: '2023-02-20'
          label: LEX Summit & Filevine University
          detail: Hosted nearly 1,000 attendees at LEX Summit and launched Filevine University certification programs.
          tone: positive
        - date: '2023-04-11'
          label: Record Q1 Financial Expansion
          detail: Surpassed 3,500 clients, achieved >50% ARR growth, >140% NDR, and 72.5% blended gross margin.
          tone: positive
        - date: '2025-09-15'
          label: $400M Growth Round
          detail: Secured $400 million financing led by Insight Partners, Accel, and Halo Fund for legal AI expansion.
          tone: positive
        - date: '2026-01-15'
          label: Pincites Acquisition & LOIS for Word
