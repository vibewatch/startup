  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Decision chain mapping operational traction, valuation multiples, and diligence gaps to the final research-more
      stance.
    data:
      nodes:
        - id: scale-and-market-proof
          label: 1. Operational Scale & Traction
          detail: Serving ~5,000-6,000 firms, 100k+ users, and $205M run-rate ARR with full-suite legal workflow coverage.
        - id: valuation-multiple-assessment
          label: 2. Valuation Multiples Assessment
          detail: September 2025 ~$3.0B valuation implies ~14.6x forward ARR multiple, pricing in flawless growth execution.
        - id: competitive-and-cost-friction
          label: 3. Workflow Friction & Competition
          detail: High implementation complexity and custom-quote pricing face pressure from agile PI-specific AI tools.
        - id: private-evidence-deficits
          label: 4. Material Diligence Deficits
          detail: Absence of public gross margin, cash burn, cohort retention, and preferred liquidation preference terms.
        - id: investment-recommendation-output
          label: '5. Recommendation: Research-More'
          detail: >-
            Maintain disciplined 'research-more' stance and 'expensive' rating pending confidential diligence
            verification.
        - id: definitive-diligence-actions
          label: 6. Required Diligence Actions
          detail: Condition capital deployment on full audit of gross margins, GAAP burn rate, and preference terms.
    approximationNotes: Flow diagram illustrates the analytical synthesis leading to the research-more recommendation.
