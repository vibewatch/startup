      - CE006
      - CE011
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The product surface supports a multi-module expansion path, but public evidence does not quantify conversion or
      retention at any stage.
    data:
      items:
        - label: Evaluate fit
          detail: Assess practice-area complexity, workflow volume, implementation capacity, and custom pricing.
          touchpoints:
            - Sales demonstration
            - Workflow discovery
        - label: Configure and migrate
          detail: Define matter structures, move data, connect systems, and train administrators and users.
          touchpoints:
            - Data migration
            - Filevine University
        - label: Adopt core workflows
          detail: Use intake, matter management, documents, tasks, and timelines as the operating record.
          touchpoints:
            - Leads and client intake
            - Matter management
        - label: Add specialized tools
          detail: Layer in analytics, signatures, AI drafting, depositions, or medical chronology.
          touchpoints:
            - Specialized tools
            - LOIS workflows
        - label: Extend financial workflows
          detail: Add time capture, billing, payments, integrations, and APIs where relevant.
          touchpoints:
            - Billing and payment
            - Integrations and APIs
        - label: Renew and expand
          detail: Broaden module and team use if outcomes justify renewal; public cohort conversion rates remain undisclosed.
          touchpoints:
            - Module expansion
            - Renewal decision
    approximationNotes: >-
      Conceptual sequence derived from the published platform surface; it is not a measured funnel and no conversion
      rates are implied.
