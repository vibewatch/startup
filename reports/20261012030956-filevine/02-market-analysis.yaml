    rows:
      - - Litigation Practice Management
        - Case tracking, matter timelines, court docketing, calendaring, client messaging
        - General horizontal CRM, stand-alone accounting suites, generic office suites
        - Managing Partners, Litigation Operations Directors
        - Core anchor workflow generating high customer stickiness and >96% gross retention
      - - Legal Operating Intelligence (AI)
        - Deposition analysis, AI document drafting (Word), medical record summarization (MedChron)
        - Standalone consumer LLMs, unauthorized public chatbots, non-legal generative tools
        - Senior Litigation Partners, Practice Group Leaders, IT/Security Committees
        - High-growth expansion driver with reported 130% YoY AI revenue growth
      - - Legal Document & Record Management
        - Cloud document repository, OCR search, matter-linked files, PDF redaction and annotation
        - On-premise legacy file servers, consumer cloud storage (Dropbox, Box without legal controls)
        - Firms Records Managers, Compliance Officers, Operations Leads
        - Proprietary training data source with 20M+ document pages uploaded daily
      - - Billing, Payments & Accounting
        - Timekeeping, LEDES electronic invoicing, payment processing, trust accounting
        - Enterprise ERP systems, non-legal payroll software, general merchant gateways
        - Managing Partners, Firm Administrators, Billing Coordinators
        - Direct monetization stream expanded via Payments by Filevine and integrated invoicing
    notes: Categorization reflects legal technology spend allocations and Filevine product footprint as of 2026. Data synthesis derived from platform disclosures and independent market reviews.
