        - Managing Partner, Practice Group Leader, COO
        - Litigation Associates, Legal Assistants, Billing Specialists
        - Executive Committee / Operations Budget
        - Multi-office matter management, deposition transcription, timekeeping, client communication
        - Need for deep custom workflow configuration and centralized practice analytics (Periscope)
      - - Corporate Legal Departments
        - General Counsel, VP of Legal Operations
        - In-House Counsel, Legal Operations Managers, Compliance Officers
        - Legal Operations / Enterprise Software Budget
        - Outside counsel management, internal matter intake, contract review (LOIS for Word), compliance
        - Pressure to control outside legal spend, streamline vendor management, and automate standard contracts
      - - Government & Public Defender Agencies
        - Agency Director, Chief Public Defender
        - Public Defenders, Staff Investigators, Case Administrators
        - Agency Technology & Operating Budget
        - High-volume case tracking, document management, CJIS/HIPAA compliant evidence storage
        - Legacy paper/on-premise system replacement, security and compliance mandate requirements
    notes: Segment mapping reflects reported client profiles across Filevine's 6,000 customers, including boutique litigation firms, corporate enterprises, and public agencies.
