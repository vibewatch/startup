callouts:
  - calloutType: strength
    title: Native Platform Architecture Drives Sustainable Retention
    body: Filevine's unified data architecture—spanning emails, case timelines, medical records, and billing under a single operating intelligence system—delivers over 96% gross retention and net dollar retention above 120%, creating an expanding revenue base within litigation practices.
    claimRefs:
      - CM002
      - CM007
  - calloutType: risk
    title: Implementation Friction and Total Cost of Ownership Constrain Downmarket Adoption
    body: With implementations requiring 4 to 8 weeks, dedicated certified partners, and first-year total costs often 1.5x to 2x base subscription rates, Filevine faces significant friction expanding into smaller, cost-sensitive law firms where plug-and-play competitors hold structural advantages.
    claimRefs:
      - CM013
      - CM014
