        blocks:
          - type: paragraph
            body: >-
              Filevine 运营多产品法律业务管理平台，通过按席位计费的经常性 SaaS
              订阅、专业工作流增值许可和面向使用量的人工智能模块组合变现。核心商业引擎是案件管理系统，采用按报价确定的年度或多年协议，而非公开价目表。除核心案件工作流外，Filevine 还通过 Lead Docket
              intake 自动化方案、Outlaw 合同管理平台和近期商业化的 LOIS AI 产品套件提升单个账户收入。这种模块化打包让 Filevine 能从律所不同运营部门获取增量预算，把商业触点从诉讼助理扩展到
              intake 协调员和合同律师。为促进获客、降低购买前摩擦，Filevine 提供 LOIS Explore 探索层，允许法律从业者在签订长期商业承诺前评估自动起草和文档提取工具。
