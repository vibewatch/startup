figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Filevine 从诉讼业务软件发展为多产品 AI 法律智能平台的时间轨迹。
    data:
      items:
        - date: '2015-01-01'
          label: 公司成立
          detail: Filevine 在犹他州盐湖城成立，专注为诉讼律所提供案件管理。
          tone: neutral
        - date: '2022-10-15'
          label: 文档组装上线
          detail: 2022 年第四季度发布 Filevine Document Assembly（.vine），自动生成复杂法律文档。
          tone: positive
        - date: '2023-02-20'
          label: LEX Summit 与 Filevine University
          detail: LEX Summit 吸引近 1,000 名参会者，并推出 Filevine University 认证项目。
          tone: positive
        - date: '2023-04-11'
          label: Q1 财务创纪录扩张
          detail: 客户数超过 3,500，ARR 增长 >50%，NDR >140%，综合毛利率 72.5%。
          tone: positive
        - date: '2025-09-15'
          label: $400M 增长轮
          detail: Insight Partners、Accel 和 Halo Fund 领投 $400 million 融资，用于扩展法律 AI。
          tone: positive
        - date: '2026-01-15'
          label: 收购 Pincites 与 LOIS for Word
          detail: 收购合同修订初创公司 Pincites，并将其技术并入 LOIS AI 法律套件。
          tone: positive
    approximationNotes: 成立日期为约略的日历年份；财务里程碑来自季度披露和融资报告。
