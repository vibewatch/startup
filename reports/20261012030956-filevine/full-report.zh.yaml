      - number: '4.2'
        title: 定价动态、实施负担与 TCO 倍数
        blocks:
          - type: paragraph
            body: >-
              评估 Filevine 的真实成本结构，不能只看基础软件席位许可，还要看总拥有成本。营销试用转付费时参考每用户每月 $49
              的基准费率，但生产环境企业部署需要定制报价，价格随工作流定制、业务领域复杂度和模块启用而变。第三方采购分析显示，第一年总拥有成本经常达到基础订阅价格的 1.5x 至
              2.0x。这个倍数主要由强制实施服务、从旧法律软件迁移历史数据库以及认证实施顾问服务驱动。部署通常需要 4 至 8
              周密集配置，用于映射自定义字段、自动任务流和阶段触发器。前期服务负担会给预算敏感的小型律所带来摩擦，但律所完成整个活跃案件组合的集成后，也会形成强大的结构性转换成本。
