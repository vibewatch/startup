      - number: '5.4'
        title: 部署、集成与企业治理
        blocks:
          - type: paragraph
            body: >-
              由于法律案件涉及高度机密的客户披露、受保护健康信息和法院密封文件，Filevine 大力投入严格的安全、隐私和监管控制。平台运行于安全的多租户云基础设施，遵循严格企业标准，保持 SOC 2 Type II
              合规、ISO 27001 和 ISO 27002 认证，以及 Criminal Justice Information
              Services（CJIS）合规，以支持公共部门执法和辩护业务。对于处理医疗记录的医疗诉讼和人身伤害律所，Filevine 尤其强调 HIPAA 合规，并对生成式 AI 查询实行严格的 0-day
              数据留存政策，确保客户数据不会在外部存储，也不会用于训练第三方基础模型。平台内，管理员可配置细粒度的字段级访问权限，在高关注度诉讼团队内隔离敏感数据；REST API 和迁移导入工具则支持与外部企业技术栈集成。
            claimRefs:
              - CE004
              - CE005
              - CE011
      - number: '5.5'
        title: 技术差异化、架构风险与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              相比 Clio 等市场竞争者和细分法律科技初创公司，Filevine 的主要技术差异化来自深度可配置能力和原生系统记录集成。它不是通用 CRM
              或孤立的法律研究聊天机器人，而是把智能代理能力嵌入活跃案件记录所在的位置，让自动化工具可以把变更写回案件数据库。不过，架构广度也带来实质性尽调取舍。平台的定制数据架构使初始导入和从旧本地软件迁移历史数据变得复杂且耗时。评估软件的高案件量人身伤害律所还经常拿
              Filevine 的多业务套件与更窄、更专用的诉前自动化工具比较，后者采用更简单的按案件定价。从技术投资评估角度看，Filevine 高度依赖第三方商业基础模型
              API，因此暴露于第三方推理延迟、模型停用和可变算力成本结构，这些细节尚未公开。
            claimRefs:
              - CE001
              - CE012
              - CE013
              - CE014
