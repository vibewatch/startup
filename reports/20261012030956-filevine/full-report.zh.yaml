  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营势头、估值倍数和尽调缺口串联至最终 research-more 立场的决策链。
    data:
      nodes:
        - id: scale-and-market-proof
          label: 1. 运营规模与势头
          detail: 服务约 5,000-6,000 家律所、100k+ 用户，run-rate ARR 为 $205M，并覆盖全套法律工作流。
        - id: valuation-multiple-assessment
          label: 2. 估值倍数评估
          detail: 2025 年 9 月约 $3.0B 的估值对应约 14.6x forward ARR 倍数，隐含增长执行必须毫无瑕疵。
        - id: competitive-and-cost-friction
          label: 3. 工作流摩擦与竞争
          detail: 高实施复杂度和定制报价，正受到敏捷的 PI 专用 AI 工具挤压。
        - id: private-evidence-deficits
          label: 4. 重大尽调缺口
          detail: 公开渠道缺少毛利率、现金消耗、cohort 留存和优先股清算优先权条款。
        - id: investment-recommendation-output
          label: 5. 建议：Research-More
          detail: 在保密尽调完成核验前，维持纪律性的“research-more”立场和“expensive”评级。
        - id: definitive-diligence-actions
          label: 6. 必要尽调行动
          detail: 只有完成毛利率、GAAP 烧钱率和优先权条款的全面审计后，才部署资本。
    approximationNotes: 流程图展示了导向 research-more 建议的分析综合过程。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV010
      - CV012
