      - number: '5.2'
        title: 模块化 SKU 架构与专业法律工具
        blocks:
          - type: paragraph
            body: >-
              Filevine 的产品架构由一套模块化专业应用组成，分别对应法律业务的不同运营阶段。客户导入阶段由 Lead Docket 提供自动 intake
              评分、网页表单集成和线索资格筛选，确保新案件无需人工重复录入即可完成资格判断和分流。在诉讼准备和人身伤害业务中，MedChron、DemandsAI
              等专业工具从案件数据中提取医疗记录时间线并组装完整和解需求包，自动化耗时的行政工作流。公司收购 Pincites 后进一步扩展合同智能能力，并将其整合为 LOIS for Word，在应用内提供合同修订和
              playbook 合规检查。此外，SidebarAI 等平台内虚拟助手可即时回答查询；原生电子签名工具 Vinesign 和集成财务处理 Payments by Filevine
              让律所能在单一环境内完成文档签署和收入收取。
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE008
              - CE010
      - number: '5.3'
        title: 技术架构、结构化案件图谱与 AI 层
        blocks:
          - type: paragraph
            body: >-
              Filevine
              的底层技术架构分为四层技术栈：云基础设施、数据管理、领域工作流引擎和面向用户的智能界面。公司的一项关键技术优先事项，是避免成为薄层大语言模型封装：它重组工程组织，让机器学习团队直接负责核心数据层。为解决法律文件中的生成式人工智能幻觉问题，LOIS
              将生成结果建立在自有结构化案件图谱上，该图谱由案件记录、事实时间线和经过验证的法律先例构成。律师生成草稿或查询案件事实时，LOIS
              从律所系统记录中调取已验证上下文，并使用针对诉讼准确性优化的提示工程管线。Filevine 还推出独立的 LOIS Console，让法律团队在维护集中编排的同时，跨外部数据仓库部署智能代理工作流。
            claimRefs:
