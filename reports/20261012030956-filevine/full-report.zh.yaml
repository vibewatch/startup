        title: 展示项
        blocks:
          - type: callout
            title: 系统记录护城河与 AI 点状工具
            body: >-
              Filevine 的战略技术优势在于掌握底层系统记录。点状 AI 方案依赖外部文档上传或只读摘要，而 Filevine 的 LOIS 智能代理直接访问历史案件数据、时间线和沟通记录，让 AI
              生成内容能够写回运营工作流。
            calloutType: insight
