  - id: FI001
    title: 收入模型桥接：客户案件转化为现金流
    type: flow
    summary: 按顺序展示法律案件生命周期如何产生基础 SaaS 订阅、AI 附加功能用量和交易计费收入。
    data:
      nodes:
        - id: intake-conversion
          label: 线索接入与筛选（Lead Docket）
          value: Lead Acquisition Funnel
          detail: 律所用自动化筛选工作流收集并分流潜在客户咨询。
        - id: matter-subscription
          label: 核心案件工作流执行
          value: Per-Seat Annual Subscription
          detail: 法律团队在核心席位上管理项目里程碑、任务流、截止日期和沟通。
        - id: document-repository
          label: 文档仓库与文件组装
          value: Platform Retention Anchor
          detail: 无限云端文档存储和模板自动化，构成深度运营黏性。
        - id: ai-augmentation
          label: LOIS AI 套件（DemandsAI 与 MedChron）
          value: Modular AI Add-on & Consumption
          detail: 专业 AI 工具按模块生成索赔材料包并总结医疗记录。
        - id: billing-collections
          label: 时间追踪、开票与支付
          value: Payment Processing & Collections
          detail: 集成支付、自动记录工时和 IOLTA 信托会计提升平台效用。
        - id: realized-cash-flow
          label: 毛利与现金变现
          value: Net Cash Flow Stream
          detail: 已实现的毛现金流还要扣除云基础设施、客户入驻和计算成本。
    approximationNotes: null
    claimRefs:
      - CI008
      - CI013
  - id: FE001
    title: 产品架构与技术栈图
    type: stack
    summary: 六层架构层级展示 Filevine 从面向客户的界面到底层企业安全和云基础设施的统一系统。
    data:
      layers:
        - label: 展示层与专业用户界面
          detail: Web 应用、独立 LOIS Console、LOIS for Word（Pincites）和客户接入门户。
        - label: 智能体智能与辅助层
          detail: LOIS 法律运营智能系统、SidebarAI 助手和自动化起草智能体。
        - label: 领域工作流引擎
          detail: Lead Docket、MedChron 医疗时间线、DemandsAI 和解材料包及 Vinesign 电子签名。
        - label: 核心法律运营与案件管理
          detail: 案件管理、集中式文档库、时间追踪、计费、开票和 Payments by Filevine。
        - label: 数据管理与结构化图层
          detail: 结构化案件图谱、关系型案件数据库、审计日志和数据迁移摄取管道。
        - label: 安全、合规与基础设施底座
          detail: SOC 2 Type II、HIPAA 0-day 保留控制、CJIS、ISO 27001/27002 和多租户云基础设施。
    approximationNotes: 基于公开披露的平台组件、高管访谈和合规规范形成的概念性架构抽象。
    claimRefs:
      - CE001
      - CE006
      - CE011
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 产品覆盖面支持多模块扩张路径，但公开证据没有量化任何阶段的转化或留存。
    data:
      items:
        - label: 评估匹配度
          detail: 评估业务领域复杂度、工作流量、实施能力和定制定价。
          touchpoints:
            - 销售演示
            - 工作流调研
        - label: 配置与迁移
          detail: 定义案件结构、迁移数据、连接系统，并培训管理员和用户。
          touchpoints:
            - 数据迁移
            - Filevine University
        - label: 采用核心工作流
          detail: 将接入、案件管理、文档、任务和时间线作为运营记录。
          touchpoints:
            - 线索与客户接入
            - 案件管理
        - label: 增加专业工具
          detail: 叠加分析、签名、AI 起草、取证或医疗时间线功能。
          touchpoints:
            - 专业工具
            - LOIS 工作流
        - label: 延伸财务工作流
          detail: 视情况增加工时记录、计费、支付、集成和 API。
          touchpoints:
            - 计费与支付
            - 集成与 API
        - label: 续约与扩张
          detail: 如果结果足以支撑续约，就扩大模块和团队使用；公开 cohort 转化率仍未披露。
          touchpoints:
            - 模块扩张
            - 续约决策
    approximationNotes: 基于已发布的平台覆盖面形成的概念性序列；这不是经测量的漏斗，也不暗示任何转化率。
    claimRefs:
      - CU002
      - CU015
      - CU016
