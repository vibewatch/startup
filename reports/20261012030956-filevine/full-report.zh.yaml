  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心工作流操作系统
        blocks:
          - type: paragraph
            body: >-
              Filevine 是完整的云端法律操作系统，旨在解决诉讼密集和高案件量法律业务中的运营割裂。它不只是数字文件柜或基础案件追踪器，而是把案件管理、沟通、文档和计费统一为单一运营记录系统。平台中心是
              LOIS（Legal Operating Intelligence
              System），一个嵌入式人工智能套件，充当主动型法律同事，直接在律所工作流中执行行政和研究任务。用户通过统一案件仪表盘使用平台，仪表盘把客户沟通、法院期限、intake
              笔记和财务记录汇总成连贯的案件历史。通过协调原先分散的运营孤岛，Filevine 让法律团队无需在互不相连的点状方案之间切换，就能自动完成常规 intake 资格筛选、安排证词、追踪计费工时和收款。
            claimRefs:
              - CE001
              - CE002
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
