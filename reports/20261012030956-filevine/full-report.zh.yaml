          description: 现有核心客户和企业扩张账户可在近期实现的现实 ARR
          level: 6
    approximationNotes: 数值是结合行业风险投资基准、业务管理市场数据和 Filevine 披露的客户指标形成的分析性估计。金字塔各层展示相对可寻址性的约束。
    claimRefs:
      - CM002
      - CM005
      - CM006
      - CM008
