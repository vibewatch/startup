    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Differentiation
      - Key Limitations
    rows:
      - - Clio
        - General Legal PMS
        - 400,000+ legal professionals; $900M+ raised
        - Solo, small, and mid-sized general practices
        - Massive market share, rapid deployment, broad third-party app ecosystem, standardized matter workflows
        - Less customizable litigation logic; lighter personal injury and medical record depth
      - - Litify
        - Enterprise Legal Platform
        - Enterprise private; backed by Bessemer / Salesforce
        - Large enterprise law firms and corporate legal departments
        - Built natively on Salesforce; enterprise security, multi-office scalability, bespoke reporting
        - Extremely high implementation overhead; cost-prohibitive for small and mid-market firms
      - - CASEpeer / MyCase
        - Specialized / Mid-Market PMS
        - AffiniPay portfolio; widespread mid-market adoption
        - Plaintiff personal injury and mid-sized volume practices
        - Turnkey PI case tracking, settled intake flows, built-in payments and client portal
        - Limited proprietary generative AI depth compared to Filevine's LOIS platform
      - - Specialized AI Point Solutions (e.g. ProPlaintiff, EvenUp)
        - Modular Legal AI
        - Venture-backed point solutions; rapid startup growth
        - High-volume personal injury and pre-litigation practices
        - Deep purpose-built automation for medical record summaries and demand package generation
        - Lacks core practice management; requires multi-vendor integration and synchronization
    notes: Competitor profiles synthesized from public platform documentation, industry analyst benchmarks, and comparative review guides as of 2026; private scale metrics reflect latest reported disclosures.
