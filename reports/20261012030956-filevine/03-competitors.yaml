  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying Criteria
      - Filevine (LOIS)
      - Clio (Manage / Duo)
      - Litify
      - Specialized AI Point Tools
    rows:
      - - Complex Litigation Matter Management
        - Native customizable matter management with automated task workflows
        - Standardized matter tracking; less custom litigation logic
        - Enterprise Salesforce-backed custom litigation architecture
        - Not supported; requires integration with existing PMS
      - - AI Demand Letter & Medical Chronology
        - Native DemandsAI and MedChron modules integrated into case files
        - Clio Draft / Duo for general legal forms and drafting
        - Partner integrations or custom enterprise builds
        - Specialized single-purpose AI pipelines with per-document pricing
      - - Bespoke Document Automation & Redlining
        - LOIS for Word (Pincites acquisition) and automated doc generation
        - Clio Draft court form automation
        - Enterprise document generation and contract workflows
        - Standalone contract redlining point solutions
      - - Security & Enterprise Compliance
        - SOC 2 Type II, FedRAMP 20X readiness, ISO 27001/2 governance
        - Standard SOC 2 cloud compliance for small/mid practices
        - Enterprise Salesforce security and compliance framework
        - Variable; depends on individual vendor BAA and security posture
    notes: Capability matrix evaluated across published vendor product specifications and technical reviews as of 2026; point solutions require external practice management systems.
    claimRefs:
      - CP003
      - CP006
      - CP007
      - CP008
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform
      - Pricing Model
      - Reported Price Range
      - Included AI Capabilities
      - Tradeoffs & Hidden Costs
    rows:
      - - Filevine
        - Custom quote; base platform fee plus usage-based AI add-ons
        - Estimated $125-$250/user/month (starting tier ~$87/user/month)
        - Core LOIS platform; DemandsAI and specialized tools on usage/tier basis
        - High setup and implementation effort; custom pricing lacks upfront transparency
      - - Clio
        - Transparent per-user tiered subscription (4 tiers)
        - Starts at $59/user/month up to premium tiers
        - Manage AI / Clio Duo included in higher tiers; Clio Work add-ons
        - Standardized functionality; less suited for complex customized litigation workflows
      - - MyCase / PracticePanther
        - Transparent per-user tiered subscription
        - $39-$89/user/month depending on tier
        - Basic AI drafting and workflow reminders
        - Lacks advanced litigation-specific AI tools like medical chronologies
      - - Specialized AI Point Solutions
        - Per-case, per-document, or transactional usage fee
        - Variable ($50-$300 per demand package or per-matter fee)
        - Deep single-workflow automation (demands, intake, chronologies)
        - Requires multi-vendor integration and synchronization across case management systems
    notes: Pricing synthesized from published vendor pricing pages and industry review benchmarks as of 2026; Filevine pricing reflects estimated market ranges from implementation reviews as official pricing is custom.
