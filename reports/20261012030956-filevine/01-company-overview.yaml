company:
  name: Filevine
chapter:
  number: 1
  title: Company Overview
  summary: Filevine is a Salt Lake City-based legal technology enterprise providing
    an AI-native case management and workflow platform for over 3,500 legal organizations.
    Backed by major institutional investors including Insight Partners and Accel with
    $400 million in growth financing, the company combines core practice management
    with its proprietary LOIS legal intelligence suite.
sections:
- id: company-identity-and-mission
  title: Company Identity, Origins, and Core Mission
  body: Founded in Salt Lake City, Utah, Filevine began as a specialized case and
    practice management platform engineered primarily for plaintiff-side litigation
    and personal injury firms. The company has steadily expanded its functional aperture
    into a comprehensive cloud-based legal operating platform, serving corporate legal
    departments, insurance defense practices, and high-volume trial firms. Central
    to Filevine's contemporary value proposition is its proprietary Legal Operating
    Intelligence System (LOIS), which connects structured matter data with generative
    document drafting, deposition analysis, and workflow automation. In its public
    disclosures, Filevine reported supporting over 3,500 institutional client organizations
    and more than 25,000 active daily legal professionals across North America. During
    its major enterprise scaling inflection in Q1 2023, the company reported surpassing
    a 50% year-over-year expansion rate in ending Annual Recurring Revenue (ARR),
    alongside a net dollar retention rate exceeding 140%. Blended gross margins reached
    72.5%, combining high-margin software subscriptions with tailored customer enablement
    programs. While audited balance sheets remain private, these performance metrics
    demonstrate significant category traction among litigation-heavy legal organizations.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Executive Leadership, Governance, and Key Personnel
  body: Filevine is led by Chief Executive Officer Ryan Anderson, who co-founded the
    business after identifying operational bottlenecks and administrative fragmentation
    during his legal practice career. Anderson has steered the business through successive
    product cycles, shifting the company from traditional on-premise replacement software
    to cloud-native case tracking and AI-augmented legal workflows. The executive
    leadership bench includes functional specialists across finance, engineering,
    and go-to-market enablement. In customer-facing strategy, Vice President Keegan
    Chapman directed enablement and customer benchmarking initiatives that accelerated
    enterprise account adoption and partner channel integration. Financial stewardship
    is overseen by veteran finance leadership, establishing the corporate reporting
    and fiscal controls required to support large-scale institutional balance sheets.
    Filevine's governance model reflects its hybrid identity as both a high-growth
    SaaS enterprise and a legal workflow specialist. While detailed board committees
    and full cap-table allocations remain confidential, the management team maintains
    strong founder alignment combined with seasoned legaltech operating executives.
  claimRefs:
  - CO001
  - CO008
  - CO009
  - CO010
  tableRefs:
  - TO002
- id: capitalization-and-stakeholders
  title: Capitalization History, Institutional Backers, and Stakeholder Mapping
  body: To fund its platform expansion and aggressive artificial intelligence product
    initiatives, Filevine has raised substantial institutional capital from prominent
    growth equity and venture firms. In September 2025, the company secured a landmark
    $400 million growth round backed by Insight Partners, Accel, and the Halo Fund.
    This capital infusion fortified Filevine's balance sheet, providing the resources
    necessary to finance strategic technology acquisitions and scale high-compute
    AI infrastructure. Institutional backers hold meaningful minority equity stakes
    alongside founder-led common stock ownership. In addition to primary equity holders,
    Filevine's economic ecosystem relies heavily on certified consulting and systems
    integration partners who assist law firms with complex data migration and custom
    workflow configuration. Because Filevine is privately held, specific liquidation
    preferences, governance covenants, and secondary-market share marks remain undisclosed,
    representing an important area for private diligence review.
  claimRefs:
  - CO006
  - CO007
  tableRefs:
  - TO003
- id: platform-evolution-and-milestones
  title: Platform Architecture, Strategic Milestones, and Market Trade-offs
  body: 'Filevine''s product architecture is organized across four distinct operational
    layers: enterprise security and compliance, specialized AI legal tools, core operational
    workflows, and data integration APIs. Its core matter management engine incorporates
    automated document assembly (.vine), e-signatures (Vinesign), legal billing, and
    personal-injury specific modules such as MedChron medical record summarization
    and DemandsAI package drafting. In January 2026, Filevine deepened its contract
    lifecycle capabilities by acquiring contract-redlining technology startup Pincites,
    subsequently rebranding the tool as LOIS for Word. These milestones reflect a
    broader push to capture daily attorney screen time across litigation and transactional
    legal work. However, this expansive scope introduces tangible commercial trade-offs.
    Independent buyer guides highlight that Filevine''s extensive configurability
    creates steep implementation hurdles and extended onboarding cycles. Furthermore,
    modular pricing tiers—ranging from base fees to layered AI usage charges—often
    push all-in customer software costs above $150 per user per month, creating competitive
    vulnerabilities against lightweight, specialized alternatives.'
  claimRefs:
  - CO002
  - CO008
  - CO011
  - CO012
  - CO013
  - CO014
  figureRefs:
  - FO001
