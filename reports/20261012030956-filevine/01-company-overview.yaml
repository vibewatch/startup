callouts:
- calloutType: insight
  title: 'Strategic Positioning: Legal Operating Intelligence'
  body: Filevine has transitioned from a specialized plaintiff case management software
    vendor into a broader enterprise legal platform. Its proprietary LOIS AI layer
    operates across 40 million indexed matters, integrating document assembly, automated
    medical record chronology, and demand generation into unified legal workflows.
  claimRefs:
  - CO002
  - CO011
  - CO012
- calloutType: risk
  title: Implementation Complexity and Total Cost of Ownership
  body: While Filevine delivers deep customizability for high-volume litigation firms,
    independent benchmarks indicate substantial onboarding friction. Full implementations
    require extensive administrative configuration, and stacking modular subscription
    pricing combined with metered AI consumption can escalate per-user monthly expenditures
    significantly above base tiers.
  claimRefs:
  - CO013
