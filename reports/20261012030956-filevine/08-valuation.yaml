company:
  name: "Filevine"
chapter:
  number: 8
  title: "Valuation"
  summary: "Filevine's reported ~$3.0B valuation represents a demanding forward revenue multiple (~14.6x on ~$205M run-rate ARR) that prices in seamless execution across its LOIS agentic suite, sustained >50% growth, and strong retention. Without public disclosure of gross margins, cash burn, unit economics, or cap-table liquidation preferences, public evidence warrants an expensive valuation stance and a research-more recommendation."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "Filevine has established a robust market position by expanding beyond traditional legal case management into a comprehensive legal operations platform integrating intake, document assembly, billing, payments, and agentic AI workflows CV001. The core investment thesis rests on Filevine's extensive workflow capture and data gravity across more than 5,000 to 6,000 customer organizations and 100,000 active users, providing a proprietary operational substrate for agentic automation under its LOIS suite CV002. By embedding AI capabilities such as DemandsAI, MedChron, and LOIS for Word directly into daily practice workflows, Filevine achieves superior user stickiness, demonstrated by a reported >50% growth in ending ARR and a 99% year-over-year increase in new ARR CV004, CV007. However, the anti-thesis highlights critical structural and competitive headwinds. Filevine's custom-quote pricing model and modular add-on structure create high total cost of ownership and implementation complexity (typically requiring 4 to 8 weeks and substantial onboarding fees) CV003, CV005. Furthermore, nimble AI-first pre-litigation specialists such as ProPlaintiff, specialized platforms like CloudLex and CASEpeer, and established ecosystem incumbents like Clio and Litify exert competitive pressure across individual product segments, challenging Filevine's pricing power and expansion margins CV006, CV008."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV002"
  - id: "valuation-context-and-financing-history"
    title: "Financing History and Valuation Multiples"
    body: "Filevine announced $400 million in combined financing across two funding rounds in September 2025 led by Insight Partners, Accel, and Halo Fund, which established a reported post-money valuation of approximately $3.0 billion CV002. When evaluated against annualized run-rate ARR of ~$205 million (reflecting reported scale of ~6,000 customers and historical 50%+ ARR expansion), this mark implies an enterprise value to ARR multiple of approximately 14.6x CV002, CV004. In the legal technology peer group, public and private comparables illustrate a significant multiple premium: general practice management leader Clio maintains broad scale across 400,000 legal professionals with lower-friction transparent pricing CV003, while AI claims intelligence specialist EvenUp was valued above $2.0 billion in October 2025 CV002. Filevine's 14.6x multiple sits at the upper tier of vertical software valuations, requiring top-decile capital efficiency and sustained net expansion. However, critical investment parameters remain obscured from public view: Filevine does not publish audited financials, gross margins, cash burn rates, or free-cash-flow margins CV009. Crucially, the liquidation preferences, dividend seniorities, and governance covenants attached to the $400 million late-stage preferred capital are undisclosed, creating meaningful downside preference overhang for common shareholders and secondary buyers CV010."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-analysis-and-diligence-framework"
    title: "Scenario Analysis, Exit Readiness, and Diligence Asks"
    body: "Scenario modeling highlights the asymmetric sensitivity of Filevine's valuation to organic growth durability and enterprise retention CV011. Under a Bull Case scenario (25% probability), Filevine successfully scales LOIS as an indispensable legal agentic operating system, accelerates ARR toward $320 million, achieves Rule-of-40 operating performance, and warrants an 18.0x multiple delivering a $5.76 billion valuation prior to an IPO window CV004, CV011. Under the Base Case scenario (50% probability), Filevine sustains steady mid-market expansion to reach ~$275 million ARR, but multiple compression toward a standard vertical SaaS multiple of 11.0x yields a $3.025 billion valuation, essentially flat against the September 2025 round CV002, CV011. Under the Bear Case scenario (25% probability), implementation fatigue, custom-quote friction, and targeted displacement by specialized point-solution AI vendors depress net ARR growth to 15% (~$235 million ARR), triggering multiple contraction to 6.5x and a $1.528 billion valuation that breaches preferred investment liquidation hurdles CV005, CV006, CV011. Consequently, public evidence supports an 'expensive' valuation stance and a disciplined 'research-more' recommendation, with definitive investment decisions deferred until private diligence confirms gross margins, burn rate, cohort retention, and cap-table preferences CV011, CV012."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
