callouts:
  - calloutType: "insight"
    title: "Valuation Sensitivity to Agentic AI Monetization"
    body: "Filevine's premium valuation multiple cannot be justified by legacy case management economics alone. Sustaining a ~$3.0 billion market mark requires Filevine to successfully convert its user base from base subscription pricing into high-margin usage and per-case fees for LOIS agentic modules, while defending against specialized pre-litigation AI providers."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV008"
  - calloutType: "risk"
    title: "Cap-Table Liquidation Preference Overhang"
    body: "With $400 million raised in September 2025 in a market pricing in significant execution risk, preferred shareholders likely hold senior liquidation preferences and protective covenants. In down-round or multiple-compression scenarios, this preference stack substantially impairs returns for common equity holders and secondary purchasers."
    claimRefs:
      - "CV002"
      - "CV010"
      - "CV011"
