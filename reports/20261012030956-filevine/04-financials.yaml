callouts:
- calloutType: risk
  title: High Implementation Friction and Total Cost of Ownership Inflation
  body: While Filevine’s base subscription rates provide an accessible initial entry point, real-world deployment costs typically
    escalate to 1.5x to 2.0x base annual licensing due to required consulting setup, data migration, and third-party partner
    configurations, creating significant budget friction for smaller practices.
  claimRefs:
  - CI003
  - CI004
- calloutType: insight
  title: Platform Lock-in Anchored by Document and Workflow Customization
  body: Filevine’s decision to bundle unlimited document repository storage alongside extensive practice-specific custom fields
    creates exceptionally deep operational lock-in, insulating core customer accounts from lower-priced standalone competitors
    despite multi-year contract commitments.
  claimRefs:
  - CI002
  - CI007
  - CI013
