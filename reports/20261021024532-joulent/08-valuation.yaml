company:
  name: Joulent
chapter:
  number: 8
  title: Valuation
  summary: >-
    Joulent has unusually strong strategic validation for a newly public infrastructure
    platform, but the reported 35% stake and roughly $5 billion implied value are not
    enough to underwrite a price. The appropriate current stance is track / research
    more: Project Kilby has contracted demand and blue-chip partners, while final
    investment approval, the full capital stack, operating economics, preference terms,
    and repeatable pipeline evidence remain undisclosed.
sections:
  - id: valuation-view
    title: Recommendation and entry discipline
    body: >-
      The current recommendation is track / research more, with medium confidence, high
      risk, and a stretched-to-unproven valuation stance. Joulent announced a $1.75
      billion strategic minority investment from National Grid, while independent
      secondary reports describe the stake as 35% and infer a roughly $5 billion value.
      That simple implication is not a verified post-money valuation because the public
      evidence does not disclose transaction mechanics, securities, preferences, debt,
      or whether all proceeds become unrestricted company cash. The financing validates
      strategic appetite for contracted AI-power infrastructure, but public evidence is
      too thin to determine whether the entry price offers an attractive risk-adjusted
      return. A buy-style recommendation would require verified capitalization,
      project-level economics, and evidence that value extends beyond one anchor asset.
    claimRefs: [CV001, CV002, CV003, CV010, CV015]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Contracted proof versus concentrated execution risk
    body: >-
      The thesis rests on a rare combination of contracted demand, strategic capital,
      equipment access, and project-development partners. Kilby is described as a 2.67
      gigawatt project serving a Microsoft-operated campus under a 20-year power purchase
      agreement, with Joulent holding 50% of the project. That structure can support
      long-duration cash-flow visibility, but price, take-or-pay protections, completion
      guarantees, and termination remedies are not public. The anti-thesis is equally
      material: Kilby concentrates initial value in one customer, one project, and a
      construction schedule that still depends on a final investment decision. A
      secondary estimate of $7 billion to $9 billion for the first phase also indicates
      that the announced corporate investment should not be treated as proof that the
      entire build is funded.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV013, CV014]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-comparables
    title: Scenario framing without false precision
    body: >-
      Public evidence supports conditional scenarios, not defensible numeric valuation
      ranges. The bull case requires Kilby to clear its final investment decision, hold
      its 2028 delivery path, preserve contracted economics, and turn partner validation
      into a repeatable multi-project pipeline. The base case assumes Kilby advances but
      financing and delivery risks continue to justify a discount to fully operating
      infrastructure. The bear case follows from delay, cost escalation, weakened AI
      demand, or a failure to diversify beyond Microsoft. Caplight identifies VoltaGrid,
      Talen Energy, and Bloom Energy as similarity-based comparables, but its public page
      does not provide the valuation or operating metrics needed to normalize those
      businesses against Joulent. Those names are reference points for further work, not
      a multiple set.
    claimRefs: [CV008, CV009, CV011, CV012, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and decision-changing diligence
    body: >-
      Exit readiness is not established by the current source set. The immediate
      milestone is project de-risking rather than a public-market or strategic-exit
      timetable: diligence should verify final investment approval, the construction
      budget and contingencies, sources and uses, PPA protections, project debt terms,
      equity ownership, liquidation preferences, governance rights, and partner
      completion obligations. Investors should also request revenue, margin, burn,
      committed-capital, and liquidity schedules that distinguish corporate cash from
      restricted project financing. The call can improve if those materials show funded
      construction, attractive contracted returns, and a credible second customer or
      project. It should deteriorate if final approval slips, the capital stack leaves a
      large funding gap, customer concentration persists, or disclosed preferences make
      the headline valuation economically misleading.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV015, CV016]
