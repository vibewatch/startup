      - [Confidence, Medium, "The financing and project are corroborated, but operating and transaction disclosures are sparse."]
      - [Risk rating, High, "One project, one anchor customer, construction exposure, and an incomplete capital stack dominate."]
      - [Valuation stance, "Stretched-to-unproven", "The reported 35% stake implies roughly $5B only on simple headline math; security terms are unknown."]
      - [Upgrade condition, "Funded FID plus repeatable pipeline", "Require verified project returns, protections, and evidence beyond Kilby."]
    notes: >-
      Qualitative investment judgment based only on the retained public evidence; funding
      raised is not treated as cash available, and no numeric return range is supportable.
    claimRefs: [CV001, CV002, CV003, CV007, CV008, CV009, CV010, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Current evidence, What would change the view]
    rows:
      - [Thesis, "Contracted anchor demand", "Kilby is described as serving Microsoft under a 20-year PPA.", "Disclosure of pricing, take-or-pay terms, termination rights, and credit support."]
      - [Thesis, "Strategic execution ecosystem", "National Grid, GE Vernova, and Chevron relationships span capital, equipment, and development.", "Binding delivery obligations, guarantees, and a funded schedule."]
      - [Thesis, "Meaningful ownership", "Joulent says it formalized a 50% interest in Kilby.", "Verified project cash-flow waterfall and distributions to corporate equity."]
      - [Anti-thesis, "Customer and asset concentration", "A critical secondary source describes the flagship plant as dedicated to one Microsoft campus.", "A second contracted customer and independently financed project."]
      - [Anti-thesis, "Capital intensity", "A secondary briefing estimates $7B-$9B of first-phase investment.", "Audited sources-and-uses and committed debt/equity covering contingencies."]
      - [Anti-thesis, "Pre-operation schedule risk", "A secondary report says FID is expected before end-2026 and first power in 2028.", "Completed FID, permits, equipment milestones, and schedule guarantees."]
    notes: >-
      The $7B-$9B project figure is a low-confidence secondary estimate, not a verified
      budget; contractual descriptions do not disclose economic terms.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "FID closes; 2028 delivery remains credible; PPA economics are attractive; a second project is contracted.", "Value could exceed the roughly $5B headline implication, but no numeric range is supportable without cash flows and cap-table terms.", "Funded construction and repeatable contracted pipeline.", "Loss of schedule, customer, or committed financing."]
      - [Base, "Kilby advances with normal megaproject friction; pipeline remains largely undisclosed.", "Current implied value remains unproven and should be discounted for construction, concentration, and financing risk.", "FID progress with incomplete economics and no second named customer.", "Material cost escalation or preference overhang."]
      - [Bear, "FID slips or fails; AI-power demand weakens; capital costs rise; diversification does not emerge.", "Down-round or impairment risk is plausible; public evidence cannot quantify a floor.", "Delayed milestones, funding gap, or weakened contracted returns.", "Contract termination, prolonged delay, or inability to fund completion."]
    notes: >-
      These are decision scenarios rather than probability-weighted forecasts; public
      evidence does not support numeric valuation ranges or assigned probabilities.
    claimRefs: [CV003, CV006, CV007, CV008, CV009, CV011, CV012, CV016]
