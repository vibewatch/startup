        title: 展示项
        blocks:
          - type: callout
            title: 已签需求并未消除执行风险
            body: Kilby 的长期承购关系有助于融资逻辑，但 EPC 能力、电气设备、空气许可、融资和燃气脱碳问题仍是采用和进度约束。
            calloutType: risk
            claimRefs:
