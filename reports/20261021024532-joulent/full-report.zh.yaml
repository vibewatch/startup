  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - FID 完成；2028 年交付仍可信；PPA 经济性有吸引力；第二个项目签约。
        - 价值可能超过约 $5B 的标题所示隐含价值，但在缺少现金流和股权结构条款的情况下，无法支持任何数值区间。
        - 建设资金到位，且签约项目管线可重复。
        - 进度、客户或已承诺融资出现损失。
      - - 基准
        - Kilby 在大型项目常见的摩擦中推进；项目管线大多仍未披露。
        - 当前隐含价值仍未经证实，应针对建设、集中度和融资风险打折。
        - FID 有进展，但经济性不完整，且没有第二个具名客户。
        - 成本大幅上升或优先权负担过重。
      - - 悲观
        - FID 延后或失败；AI 电力需求走弱；资本成本上升；多元化未能出现。
        - 下轮融资或减值风险确实存在；公开证据无法量化底价。
        - 里程碑延迟、资金缺口或签约回报走弱。
        - 合同终止、长期延误或无法筹足完工资金。
    notes: 这些是决策情景，而非按概率加权的预测；公开证据不支持数值化估值区间或指定概率。
