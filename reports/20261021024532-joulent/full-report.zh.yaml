      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              对 Kilby 而言，已有证据支持的买方和用户是 Microsoft 运营的数据中心园区，20 年期购电协议构成商业锚点。Joulent
              及其新闻稿发布渠道也将工业电气化和新技术列为潜在的大型负荷细分市场，但现有证据池没有确定第二个具名客户。因此，采用路径看起来由项目驱动：锁定信用可靠的承购方，组装发电和电气设备，取得空气排放许可，完成项目融资，敲定工程和施工能力，然后在负荷旁供电。预算归属可能由数据中心基础设施、能源采购和项目融资职能共同承担，但具体内部付款方和采购流程仍属私密信息。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
