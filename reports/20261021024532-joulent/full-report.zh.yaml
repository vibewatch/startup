              - CO003
              - CO014
      - number: '1.3'
        title: 资本形成与利益相关方协同
        blocks:
          - type: paragraph
            body: >-
              National Grid 于 2026 年 7 月 1 日同意通过 National Grid Ventures 投入 $1.75 billion
              进行战略性少数股权投资。公告称，这笔资本用于支持当前多吉瓦项目、推进项目管线和扩大组织规模；不能将其解读为已筹集的总资金或可用现金。同一公告确认 Joulent 持有 Project Kilby 50%
              的权益。一份独立报道将投资人持股描述为 35%，但无论是审阅过的官方材料还是公开的 Caplight 页面，都没有建立可辩护的公司估值、完整资本表、历史融资总额、债务余额或二级交易记录。GE
              Vernova、Chevron、National Grid 和 Microsoft 各自承担不同执行角色，既形成较强协同，也让平台明显依赖少数利益相关方。
