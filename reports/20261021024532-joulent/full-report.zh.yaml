      - number: '1.2'
        title: 管理层深度与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Chris James
              领导一支管理团队，公开职务覆盖运营、财务、投资、基础设施、开发、增长、人才、能源软件和法务。项目平台要协调融资、发电设备、并网、建设和客户，这样的职能覆盖因此具有意义。独立背景材料将 James 与 Engine
              No. 1
              及其过往投资和自然资源活动联系起来，提供了一定的创始人与市场背景。但公开材料没有列出董事、保留事项、投资人同意权、继任安排或详细高管履历。因此，治理仍集中在明确的创始人和战略伙伴周围，关键人依赖和董事会监督程度无法从公开证据衡量。
            claimRefs:
              - CO003
              - CO014
