      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              核心采用驱动是更快获得电力：一份保留的报告称，截至 2025 年，美国许多地区的并网排队需要 5 至 10 年，而公司将共址定位为更快服务大型负荷的方式。即使需求已经签约，高压设备、EPC
              能力、许可和融资短缺仍可能改变进度。Kilby
              当前依赖燃气，也带来脱碳和许可方面的张力，而不是相对于电网供电普遍更优的替代方案。就估值而言，大额战略股权支票和长期合同属于有用验证，但不能证明全市场经济性：公开财务披露有限，Caplight
              未提供公开估值和总融资额，本文也未量化可复制的项目管线。
            claimRefs:
              - CM006
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
