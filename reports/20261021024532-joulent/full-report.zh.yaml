          - type: paragraph
            body: >-
              当前建议为跟踪 / 继续研究，信心中等、风险高，估值立场从偏高延伸至尚未证实。Joulent 宣布 National Grid 投入 $1.75 billion 进行战略性少数股权投资；独立二手报道称持股为
              35%，并推算约 $5 billion 价值。这个简单推算不是经核实的投后估值，因为公开证据没有披露交易机制、证券、优先权、债务，或全部资金是否会成为不受限制的公司现金。融资验证了战略方对签约 AI
              电力基础设施的兴趣，但公开证据太薄，无法判断入场价格是否提供有吸引力的风险调整后回报。要给出买入式建议，还需要核实资本结构、项目层面经济性，以及价值不止来自一个锚定资产的证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.2'
        title: 已签验证与集中执行风险的对照
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在签约需求、战略资本、设备渠道和项目开发伙伴的罕见组合上。Kilby 被描述为一个 2.67 GW 项目，依据 20 年期购电协议服务 Microsoft 运营的园区，Joulent 持有项目 50%
              权益。这种结构可以支持长期现金流可见度，但价格、照付不议保障、完工保证和终止救济均未公开。反面逻辑同样重大：Kilby 将初始价值集中在一个客户、一个项目和一个仍取决于最终投资决策的建设进度上。二手估计首期成本为
              $7 billion to $9 billion，也说明已宣布的公司投资不能被视为整项建设已获融资。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV013
              - CV014
      - number: '8.3'
        title: 不制造虚假精确度的情景框架
        blocks:
          - type: paragraph
            body: >-
              公开证据支持条件式情景，而不是可辩护的数字估值区间。乐观情景要求 Kilby 通过最终投资决策、保持 2028 年交付路径、保住合同经济性，并将伙伴验证转化为可复制的多项目管线。基准情景假设 Kilby
              继续推进，但融资和交付风险仍足以让市场相对成熟运营基础设施给予折价。悲观情景来自延期、成本上升、AI 需求减弱，或无法摆脱对 Microsoft 的依赖。Caplight 将 VoltaGrid、Talen
              Energy 和 Bloom Energy 列为基于相似度的可比公司，但其公开页面没有提供将这些业务与 Joulent 标准化比较所需的估值或运营指标。这些公司只能作为进一步研究的参照点，而不是倍数集合。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: 退出准备度与改变决策的尽调
        blocks:
          - type: paragraph
            body: >-
              当前来源集不能证明已具备退出条件。近期里程碑是项目去风险，而不是公开市场或战略退出时间表：尽调应核实最终投资批准、建设预算和预备金、资金来源与用途、PPA
              保障、项目债务条款、股权、清算优先权、治理权和伙伴完工义务。投资人还应索取收入、利润率、烧钱、已承诺资本和流动性安排，以区分公司现金和受限项目融资。如果这些材料显示建设资金已落实、合同回报有吸引力，并拥有可信的第二个客户或项目，判断可以改善。若最终批准延期、资本结构留下巨大资金缺口、客户集中持续，或已披露优先权使
              headline 估值在经济上产生误导，判断应恶化。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 战略质量不能消除入场价格风险。在投资人能够核对证券条款、项目全部融资和签约项目回报前，维持跟踪 / 继续研究立场。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV015
