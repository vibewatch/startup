      - number: '3.3'
        title: 商业模式、分销与定价透明度
        blocks:
          - type: paragraph
            body: >-
              最强的商业证明是 Project Kilby：一个已披露的 2.67 GW 设施，依据 20 年期购电协议服务 Microsoft 运营的数据中心园区。National Grid Ventures 以据报道
              35% 的持股投入 $1.75 billion，带来资本、高压电力专业能力和供应链渠道；Chevron 与 GE Vernova 则贡献项目开发和设备能力。这个伙伴网络更像分销及执行基础设施，而非传统软件
              go-to-market 渠道。Joulent
              及其伙伴称该方案具有成本竞争力、能够降低计算成本，但没有保留来源公布电价、能源价格、容量付款、调价公式或客户实际节省。竞争者的具体商业条款也缺失，无法形成可辩护的价格排名。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
