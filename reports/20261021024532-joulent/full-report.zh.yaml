              - CP012
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Joulent 的近期护城河是签约需求、战略资本、预留设备、燃料和基础设施专业能力的协同组合，而不是已被证实的共址发电垄断。长期 PPA
              和专用实体资产在建成后难以替换，因此这一组合可以制造项目层面的转换成本；但它也让执行高度依赖少数伙伴和一个公开锚定客户。审阅来源显示，项目仍等待预计于 2026 年完成的最终投资决策，目标于 2028
              年首次供电；截至报告日，交付表现尚未验证。类似初创公司和由现有企业主导的模式可能使该架构商品化；在伙伴组装模式成为持久平台优势前，Joulent 必须证明项目可复制、客户多元化且经济性更优。
            claimRefs:
              - CP006
              - CP008
