              接口，以及连接中央 AI 增强控制器的本地控制系统。Kilby 是唯一公开定义的运营模板：约 2.67 GW，专门服务 Microsoft 运营的园区，依据一份 20
              年期购电协议供电。这给产品提供了具体客户流程和资产边界，但不能证明商业运营、可复制性或实测表现。
