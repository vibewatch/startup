        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是需求和容量指标阶梯，而不是传统 TAM/SAM/SOM。某二手报道引用国际能源署预测称，到 2030 年数据中心年耗电量将超过 945 TWh；Kilby 则以一份 20 年期 Microsoft
              购电协议下约 2.67 GW 的容量构成公司层面的锚点。              Joulent 起步时还获得了 4 GW 燃气轮机的供应渠道，National Grid 据报道以 $1.75 billion
              购买 35% 股权，则是一个资本市场信号。这些指标单位不兼容；若没有价格、利用率、持股、项目管线和项目成本证据，不能相加或换算为收入。
