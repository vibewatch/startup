      - number: '3.2'
        title: 能力定位与差异化
        blocks:
          - type: paragraph
            body: >-
              Joulent 披露的方案结合小型和大型燃气轮机、长时电池储能、可再生能源、表后电网连接和集中式编排。官方材料称，其 AI 增强控制层协调表后和表前资源。Pondero
              将这一模式描述为避开专用电厂到负荷路径的传统并网流程，而 Joulent 自己的公告称项目可能随时间接入电网。这种集成架构是有意义的定位主张，但不是交付成本或可靠性更优的证明。现有证据没有记录
              VoltaGrid、Talen 或 Bloom 的等价功能，因此能力矩阵将这些单元标为未知，而不是把 Caplight 的相似度得分转化为产品主张。
