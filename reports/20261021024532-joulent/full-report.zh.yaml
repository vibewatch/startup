  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有竞争格局不只是风投支持的同类公司名单。Caplight 将 VoltaGrid、Talen Energy 和 Bloom Energy 列为 Joulent 的可比公司，嵌入相似度得分分别为 80%、73%
              和 71%，但其公开页面没有披露解读这些排名所需的运营指标。Pondero 另将 Applied Digital 以及已宣布的 Chevron/ExxonMobil
              数据中心电力合作描述为类似模式的参与者。实际替代方案还包括等待传统公用事业并网、内部组建由超大规模客户主导的项目，或从多家供应商购买发电、储能和电网整合能力。Pondero 称，截至 2025
              年，美国许多地区的并网队列已拉长至 5 至 10 年，使供电速度成为核心竞争维度；但这一单一来源并不是所有替代方案的独立基准。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
