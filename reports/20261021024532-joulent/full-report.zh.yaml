  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Joulent 面向的并非泛化的发电市场。现有证据支持的边界是：在大型新增负荷旁提供专门建设的稳定电力，初期主要服务 AI
              数据中心，并最终接入电网、可能向外输电。买方也可以等待公用事业并网、与现有开发商签约、内部建设发电设施，或削减并分阶段增加负荷。Latitude Media 将工业负荷和 AI 数据中心描述为 Joulent
              的目标，并称运营商为避开漫长排队，正转向吉瓦级共址微电网。工业电气化这一邻近机会由公司提出，但没有独立量化；在有签约项目或买方管线支撑前，不应纳入核心市场规模判断。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
