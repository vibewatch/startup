chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Joulent 是一家总部位于 Houston 的能源公司，于 2026 年 6 月 22
              日公开亮相，此前曾处于一段据独立来源报道的私下开发期。公司将核心产品描述为面向大型工业负荷、尤其是先进计算园区的稳定基荷电力。其 Across-the-Meter
              模式让发电与客户需求共址，并结合燃气轮机、电池储能、可再生能源和控制系统，最终计划将可外送容量接入电网。这是基础设施开发，而非传统软件业务：进展取决于资本、设备、许可、建设、燃料和长期客户合同。现有证据支持其是一个开发阶段平台，拥有一个已披露的旗舰项目，而非成熟运营资产群或已有公开经常性收入基础。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO012
