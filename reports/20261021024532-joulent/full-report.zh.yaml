      - - 正论
        - 战略执行生态
        - National Grid、GE Vernova 和 Chevron 的合作关系覆盖资本、设备和开发。
        - 具有约束力的交付义务、保证和已获资金支持的时间表。
      - - 正论
        - 具有实质意义的所有权
        - Joulent 称其已正式确立在 Kilby 的 50% 权益。
        - 经验证的项目现金流分配瀑布及向公司股权的分配。
      - - 反论
        - 客户与资产集中
        - 一份关键的二手来源称旗舰电站专门服务一个 Microsoft 园区。
        - 第二个已签约客户和独立融资的项目。
      - - 反论
        - 资本密集度
        - 一份二手简报估计第一阶段投资额为 $7B-$9B。
        - 经审计的资金来源与用途，以及覆盖应急事项的已承诺债务 / 股权。
      - - 反论
        - 投产前进度风险
        - 一份二手报道称 FID 预计在 2026 年底前完成，首次送电在 2028 年。
        - 已完成的 FID、许可、设备里程碑和进度保证。
    notes: $7B-$9B 的项目金额是低置信度的二手估算，并非经核实的预算；合同描述没有披露经济条款。
