  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 签约基础设施是收入逻辑，但尚不是已披露的损益表
        blocks:
          - type: paragraph
            body: >-
              Joulent 披露的商业模式是项目制电力基础设施，而非软件订阅收入。Project Kilby 计划依据 20 年期购电协议为 Microsoft 运营的数据中心园区供电；Joulent 称其
              Across-the-Meter 模式让发电与客户需求共址，之后再接入电网。National Grid
              将这一敞口描述为带有合同现金流的长期基础设施，这支持合同化，但没有披露已确认收入、电价设计、最低量保障、调价机制或毛利。官方电力堆栈页面还声称能降低计算成本，却没有给出价格或独立测量的节省。结果是概念上的收入可见度较强，但公开证据对收入的可量化程度很弱。
            claimRefs:
