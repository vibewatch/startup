      - number: '1.4'
        title: 里程碑、集中度与下一步验证点
        blocks:
          - type: paragraph
            body: >-
              与典型新成立公司相比，Joulent 公开亮相时获得了更多验证：设备和开发伙伴、战略资本提供方，以及支持首个约 2.67 GW 项目的 20 年期购电协议。但运营证据仍属前瞻性信息。独立报道称，Project
              Kilby 预计在 2026 年底前完成最终投资决策，目标于 2028 年首次供电。报道还称，Microsoft
              的合同覆盖项目全部产出，因此客户集中度与初始投资逻辑不可分割。近期最重要的验证点是最终投资决策、开工、融资交割，以及第二个客户或项目的证据。审阅过的来源没有提供经核实的运营历史、收入基础、员工数或已完工项目数量。
