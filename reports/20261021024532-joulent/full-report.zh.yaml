        title: 展示项
        blocks:
          - type: callout
            title: 已签需求并未消除开发风险
            body: >-
              据报道，Microsoft 签约购买 Project Kilby 的全部 2.67 GW 产出，但在审阅的独立报道中，该项目仍等待最终投资决策，首次供电目标仍为 2028
              年。需求可见度提高的同时，首个平台也因此依赖一个项目和一个公开点名的客户。
