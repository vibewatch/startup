chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Joulent is a Houston-headquartered energy company that publicly launched on June 22, 2026 after an
              independently reported period of private development. The company describes its core offer as firm
              baseload power for large industrial loads, especially advanced-computing campuses. Its Across-the-Meter
              model co-locates generation with customer demand, combines turbines, battery storage, renewables, and
              controls, and is intended eventually to connect exportable capacity to the grid. This is infrastructure
              development rather than a conventional software business: progress depends on capital, equipment,
              permitting, construction, fuel, and long-duration customer contracts. The reviewed evidence supports a
              development-stage platform with one disclosed flagship project, not a mature operating fleet or a
              disclosed recurring-revenue base.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO009
              - CO010
              - CO011
              - CO015
      - number: '1.2'
        title: Leadership depth and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Chris James leads an executive group whose published roles cover operations, finance,
              investing, infrastructure, development, growth, talent, energy software, and legal affairs. That
              functional breadth is relevant for a project platform that must coordinate financing, generation
              equipment, interconnection, construction, and customers. Independent background material links James to
              Engine No. 1 and prior investing and natural-resources activity, providing some founder-market context.
              However, the reviewed public materials do not identify directors, reserved matters, investor consent
              rights, succession arrangements, or detailed executive biographies. Governance therefore remains
              concentrated around a named founder and strategic partners, with key-person dependence and board oversight
              not measurable from public evidence.
            claimRefs:
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO014
      - number: '1.3'
        title: Capital formation and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              National Grid agreed to make a $1.75 billion strategic minority investment through National Grid Ventures
              on July 1, 2026. The announcement says the capital supports the current multi-gigawatt project, pipeline
              advancement, and organizational scaling; it should not be read as total funding raised or cash available.
              The same announcement formalized Joulent's 50% interest in Project Kilby. An independent report describes
              the investor stake as 35%, but neither the reviewed official materials nor the public Caplight page
              establishes a defensible company valuation, complete capitalization table, historical funding total, debt
              balance, or secondary activity. GE Vernova, Chevron, National Grid, and Microsoft each fill a distinct
              execution role, creating strong alignment but also material dependency on a small stakeholder set.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO010
              - CO011
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Milestones, concentration, and next proof points
        blocks:
          - type: paragraph
            body: >-
              Joulent emerged publicly with more validation than a typical newly launched company: equipment and
              development partners, a strategic capital provider, and a 20-year power purchase agreement supporting an
              approximately 2.67 GW first project. Yet the operating evidence is still prospective. Independent
              reporting says Project Kilby's final investment decision was expected before the end of 2026 and first
              power was targeted for 2028. It also says Microsoft's contract covers the project's full output, making
              customer concentration inseparable from the initial investment case. The most important near-term proof
              points are the final investment decision, construction start, financing closure, and evidence of a second
              customer or project. No reviewed source supplies a verified operating history, revenue base, headcount, or
              completed-project count.
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO009
              - CO015
              - CO016
