      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Contracted project proof and strategic partners are offset by unresolved financing, concentration, execution, and
      valuation terms, leading to a track / research-more call.
    data:
      nodes:
        - id: contracted-proof
          label: Contracted proof
          value: 2.67 GW / 20 years
          detail: Kilby is tied to a Microsoft-operated campus under a long-term PPA.
        - id: strategic-validation
          label: Strategic validation
          value: $1.75B minority investment
          detail: National Grid adds capital and infrastructure expertise alongside GE Vernova and Chevron.
        - id: execution-gate
          label: Execution gate
          value: FID and 2028 delivery
          detail: The project still faces approval, construction, financing, and schedule risk.
        - id: concentration
          label: Concentration
          value: One anchor project and customer
          detail: Initial value depends heavily on Kilby and Microsoft.
        - id: valuation-gap
          label: Valuation gap
          value: Roughly $5B implied
          detail: Headline stake math lacks security terms, project economics, and a full cap table.
        - id: recommendation
          label: Recommendation
          value: Track / research more
          detail: Require funded execution and repeatable economics before underwriting an entry.
    approximationNotes: >-
      The roughly $5B value is a secondary-source headline implication, not a verified post-money valuation; the flow is
      qualitative and does not assign probabilities.
    claimRefs:
      - CV004
      - CV006
      - CV013
      - CV014
