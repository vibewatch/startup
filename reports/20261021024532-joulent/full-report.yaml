              - CI013
              - CI014
      - number: '4.3'
        title: Strategic capital reduces platform risk but does not establish runway or full project funding
        blocks:
          - type: paragraph
            body: >-
              National Grid agreed to a $1.75 billion strategic minority investment intended to help Joulent execute its
              current project, advance its pipeline, and scale capabilities. Joulent also formalized a 50% interest in
              Kilby. Those facts strengthen sponsor credibility, but funding raised is not cash on hand: public
              materials do not disclose closing mechanics, use-of-funds restrictions, corporate cash, burn, debt,
              partner contributions, or the complete Kilby capital stack. Company Overview contains the financing
              chronology; for forward sufficiency, the key public milestone is the reported final investment decision
              expected by the end of 2026, with first power targeted for 2028. Until the project budget and committed
              sources and uses are reconciled, the amount and timing of additional equity, debt, or project finance
              remain unknown.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI010
              - CI013
      - number: '4.4'
        title: 'Financial verdict: contracted demand, unproven economics, and concentrated execution'
        blocks:
          - type: paragraph
            body: >-
              The best evidence is the combination of an anchor PPA, strategic industrial partners, and long-dated
              infrastructure framing. The adverse case is equally concrete: independent commentary warns that
              transmission, permitting, fuel availability, and execution can delay projects even after PPAs are signed,
              while another analysis notes that capital-intensive AI-power projects could face overcapacity if demand
              growth slows. Joulent's first disclosed revenue engine is concentrated in one project and one named
              offtaker, and no retained source shows current revenue or margins. The investment case should therefore be
              treated as a development-stage infrastructure underwriting: attractive contracted-demand potential, but no
              public basis yet for valuing earnings quality, margin durability, liquidity, or returns on invested
              capital.
            claimRefs:
              - CI005
              - CI008
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing announced is not liquidity proven
            body: >-
              The $1.75 billion strategic investment improves sponsor credibility, but without closing, restriction,
              sources-and-uses, cash, burn, debt, and partner-contribution data it cannot be treated as cash available
              or proof that Kilby's full capital requirement is funded.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and asset definition
        blocks:
          - type: paragraph
            body: >-
              Joulent presents its product as an integrated power-delivery system for data centers and other
              compute-intensive industrial loads, not as a catalog of separately priced software or hardware. The
              published stack combines small and large turbines, long-duration battery storage, renewable generation, an
              Across-the-Meter interface, and local controls connected to a central AI-enhanced controller. Kilby is the
              only publicly defined operating template: approximately 2.67 GW dedicated to a Microsoft-operated campus
              under a 20-year power purchase agreement. That gives the product a concrete customer workflow and asset
              boundary, but it does not establish commercial operation, repeatability, or measured performance.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE008
              - CE009
              - CE012
              - CE013
      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              The architecture joins physical generation and storage with grid-facing equipment and a controls layer.
              Joulent says battery storage absorbs rapid data-center load transients and optimizes charging or dispatch,
              while local controls feed a central decision layer. The model begins with generation co-located beside
              demand and contemplates eventual grid connection and exportable capacity. Delivery therefore depends on
              more than control software: turbine supply, EPC capacity, high-voltage equipment, system balancing, fuel,
              construction, and partner execution are all integral. National Grid, GE Vernova, Chevron affiliate Energy
              Forge, and Microsoft cover important roles, but public interfaces, redundancy design, failover behavior,
              and acceptance criteria are not disclosed.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE007
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE012
      - number: '5.3'
        title: Deployment, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              Kilby is advanced enough to have a named customer, contracted term, ownership structure, identified
              generation supplier, and reserved EPC capacity. It is not yet evidence of an operating fleet. Public
              reporting still describes a final investment decision as expected before the end of 2026 and first power
              as targeted for 2028. Those are milestones rather than achieved outcomes. Joulent also refers to a broader
              multi-gigawatt pipeline, but the retained sources do not identify its sites, customers, specifications,
              approvals, or schedules. Investors should therefore underwrite the present product as a first-project
              delivery platform whose repeatability remains to be demonstrated, not as a proven portfolio.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: Differentiation, assurance, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The differentiated proposition is organizational and architectural: assemble contracted demand, generation
              equipment, fuel and development capability, infrastructure capital, and controls around a customer site to
              reduce dependence on conventional interconnection timing. The partner set and long-term PPA strengthen
              execution credibility, but they do not verify product-level reliability, cybersecurity, privacy,
              environmental compliance, or quality controls. The official product page labels the controller AI-enhanced
              without publishing benchmarks, model governance, certifications, uptime history, incident reporting, or
              security architecture. No public developer repository, API documentation, package activity, or
              practitioner-community proxy appears in the assigned evidence. The 2028 target also remains exposed to
              permitting, turbine delivery, and EPC execution.
            claimRefs:
              - CE006
              - CE011
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concrete first-project architecture
            body: >-
              Kilby links a named 2.67 GW asset, a 20-year customer contract, a 50% Joulent interest, secured turbine
              capacity, and experienced infrastructure partners.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE011
          - type: callout
            title: Verification lags the ambition
            body: >-
              Public evidence does not establish FID completion, operating reliability, cyber assurance, control-system
              performance, or a repeatable pipeline beyond Kilby.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation is credible but mostly prospective
        blocks:
          - type: paragraph
            body: >-
              The only named end customer in the retained evidence is Microsoft, whose operated data center campus is
              the demand anchor for Project Kilby. Joulent and its backers describe a broader target market of
              hyperscale data centers, industrial electrification projects, and other advanced-industry large loads, but
              those categories are addressable segments rather than disclosed customers. The buyer is therefore best
              understood as a sophisticated long-duration infrastructure offtaker seeking reliable power, schedule
              certainty, and cost visibility; the user is the co-located compute or industrial campus. No evidence
              discloses a channel-led motion, smaller-customer offer, geographic customer mix, revenue bands, or a
              second contracted account.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU016
      - number: '6.2'
        title: Contracted capacity is strong proof, but operating adoption has not begun
        blocks:
          - type: paragraph
            body: >-
              Kilby provides concrete commercial evidence beyond a logo: company and independent sources describe
              approximately 2.67 gigawatts supporting a Microsoft-operated campus under a 20-year power purchase
              agreement, while one independent account says the agreement covers the project's full output. The maturity
              boundary is equally important. Independent reports place the final investment decision before the end of
              2026 and first power in 2028, so contracted demand should not be presented as active usage, delivered
              capacity, or a realized customer outcome. Joulent was publicly launched in June 2026; the available
              customer evidence is therefore a forward contract and project-development milestone, not an operating
              cohort.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
              - CU016
      - number: '6.3'
        title: The contract indicates duration, not retention economics
        blocks:
          - type: paragraph
            body: >-
              A 20-year power purchase agreement is meaningful evidence of contractual durability and can support
              project financing, and National Grid explicitly frames its investment as exposure to long-duration
              infrastructure with contractual cash flows. It does not reveal software-style retention metrics or all of
              the economics that determine customer quality. The retained sources disclose no NRR, GRR, churn, renewal
              option, pricing formula, take-or-pay protection, termination rights, utilization history, satisfaction
              score, or realized savings. Joulent claims its system will improve reliability, timing, and cost,
              including lower cost of compute, but no independent post-deployment measurement is yet possible because
              first power remains prospective.
            claimRefs:
              - CU002
              - CU006
              - CU012
              - CU013
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Expansion is a platform thesis with single-customer concentration
        blocks:
          - type: paragraph
            body: >-
              Joulent says Kilby is the first model for a multi-project platform and claims a broader multi-gigawatt
              pipeline, yet the independent report that records that pipeline also notes that project locations were not
              specified. The customer case is consequently concentrated at three levels: one named end customer, one
              named project, and one future operating start. An independent analysis explicitly identifies Microsoft
              concentration and customer diversification as a risk. Expansion could come from follow-on campuses,
              additional large-load sectors, renewable additions, or eventual export to local power markets, but the
              retained evidence does not establish a repeat purchase, second account, completed deployment, or measured
              land-and-expand loop.
            claimRefs:
              - CU007
              - CU008
              - CU011
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract quality does not remove concentration risk
            body: >-
              The 20-year Microsoft-linked PPA is strong demand proof, but first power remains future dated and retained
              evidence identifies no second end customer or operating outcome.
            calloutType: risk
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk hierarchy and regulatory gates
        blocks:
          - type: paragraph
            body: >-
              Project Kilby is still described as awaiting a final investment decision, while first power is targeted
              for 2028. That makes schedule and construction execution the highest residual risk: the disclosed 2.67 GW
              scope is unusually large for a first public project, and the available material does not identify the
              permits, environmental approvals, emissions obligations, or interconnection milestones that sit on the
              critical path. The disclosed $1.75 billion minority investment is material, but it should not be treated
              as equivalent to the estimated $7-9 billion project investment or as proof that all project funding is
              committed. Investment should remain conditional on documentary evidence for FID, permits, financing
              commitments, and a dated construction schedule.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR011
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Operational, quality, and technical exposure
        blocks:
          - type: paragraph
            body: >-
              Joulent describes an integrated power stack spanning turbines, long-duration battery storage, renewables,
              grid-facing resources, and centralized AI-enhanced controls. That architecture can mitigate load
              transients and support phased capacity, but it also creates commissioning, controls-integration, cyber,
              equipment-availability, and performance-guarantee dependencies. National Grid says it adds high-voltage,
              system-integration, and supply-chain capabilities, which is a credible mitigation; however, Kilby's
              pre-operational status means public evidence cannot yet establish availability, heat rate, forced-outage
              performance, battery response, or incident history. The kill criterion is failure to provide independent
              engineering reports, contracted equipment slots, performance guarantees, and an owner-approved
              commissioning plan before major follow-on capital is required.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR012
              - CR015
      - number: '7.3'
        title: Partner, customer, and capital concentration
        blocks:
          - type: paragraph
            body: >-
              The model is deliberately partner-led: Microsoft anchors demand, Energy Forge and Chevron contribute
              project and fuel capabilities, GE Vernova supplies core generation equipment, and National Grid
              contributes capital and grid expertise. This reduces capability gaps but concentrates execution across
              counterparties whose contracts, step-in rights, termination provisions, and cost-sharing arrangements are
              not public. Retained evidence identifies Microsoft as Kilby's named offtaker and does not name a second
              customer or operating project. A 20-year PPA supports revenue visibility only after delivery and does not
              eliminate delay, performance, credit-allocation, or contract-termination risk. Diversification should be
              measured by signed, financed projects rather than pipeline claims.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should track four measurable gates: documented FID and financing close; permit
              and equipment milestones against the 2028 target; evidence that the Microsoft PPA allocates delay and
              performance risk sustainably; and at least one additional financed project or named offtaker. Thesis break
              occurs if FID slips beyond the disclosed end-2026 expectation without a funded replacement schedule, if
              committed capital cannot cover Joulent's contractual share, if permits or equipment delivery move first
              power materially beyond 2028, or if the anchor PPA is reduced or terminated. Public-data inconsistencies
              also require direct document verification: one market-data page misstates the investor and rounds the
              investment amount, while another withholds core round fields from its public view.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not the same as funded project cost
            body: >-
              The $1.75 billion strategic investment should not be equated with cash available for Kilby or with full
              financing of the independently reported $7-9 billion project estimate. The uses, timing, debt capacity,
              partner contributions, and contingency remain diligence items.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
          - type: callout
            title: Conditions before underwriting follow-on value
            body: >-
              Require FID and financing evidence, the permit and equipment critical path, the Microsoft PPA
              risk-allocation schedule, and a second financed project or customer. Slippage without funded remediation
              should move the thesis from track to decline.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR011
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is track / research more, with medium confidence, high risk, and a
              stretched-to-unproven valuation stance. Joulent announced a $1.75 billion strategic minority investment
              from National Grid, while independent secondary reports describe the stake as 35% and infer a roughly $5
              billion value. That simple implication is not a verified post-money valuation because the public evidence
              does not disclose transaction mechanics, securities, preferences, debt, or whether all proceeds become
              unrestricted company cash. The financing validates strategic appetite for contracted AI-power
              infrastructure, but public evidence is too thin to determine whether the entry price offers an attractive
              risk-adjusted return. A buy-style recommendation would require verified capitalization, project-level
              economics, and evidence that value extends beyond one anchor asset.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.2'
        title: Contracted proof versus concentrated execution risk
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a rare combination of contracted demand, strategic capital, equipment access, and
              project-development partners. Kilby is described as a 2.67 gigawatt project serving a Microsoft-operated
              campus under a 20-year power purchase agreement, with Joulent holding 50% of the project. That structure
              can support long-duration cash-flow visibility, but price, take-or-pay protections, completion guarantees,
              and termination remedies are not public. The anti-thesis is equally material: Kilby concentrates initial
              value in one customer, one project, and a construction schedule that still depends on a final investment
              decision. A secondary estimate of $7 billion to $9 billion for the first phase also indicates that the
              announced corporate investment should not be treated as proof that the entire build is funded.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing without false precision
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional scenarios, not defensible numeric valuation ranges. The bull case
              requires Kilby to clear its final investment decision, hold its 2028 delivery path, preserve contracted
              economics, and turn partner validation into a repeatable multi-project pipeline. The base case assumes
              Kilby advances but financing and delivery risks continue to justify a discount to fully operating
              infrastructure. The bear case follows from delay, cost escalation, weakened AI demand, or a failure to
              diversify beyond Microsoft. Caplight identifies VoltaGrid, Talen Energy, and Bloom Energy as
              similarity-based comparables, but its public page does not provide the valuation or operating metrics
              needed to normalize those businesses against Joulent. Those names are reference points for further work,
              not a multiple set.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: Exit readiness and decision-changing diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the current source set. The immediate milestone is project de-risking
              rather than a public-market or strategic-exit timetable: diligence should verify final investment
              approval, the construction budget and contingencies, sources and uses, PPA protections, project debt
              terms, equity ownership, liquidation preferences, governance rights, and partner completion obligations.
              Investors should also request revenue, margin, burn, committed-capital, and liquidity schedules that
              distinguish corporate cash from restricted project financing. The call can improve if those materials show
              funded construction, attractive contracted returns, and a credible second customer or project. It should
              deteriorate if final approval slips, the capital stack leaves a large funding gap, customer concentration
              persists, or disclosed preferences make the headline valuation economically misleading.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Strategic quality does not resolve entry-price risk. Maintain a track / research-more stance until
              investors can reconcile the security terms, full project funding, and contracted project returns.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV015
