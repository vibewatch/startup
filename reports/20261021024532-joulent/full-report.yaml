              - CO013
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted demand does not remove development risk
            body: >-
              Microsoft reportedly contracts for Project Kilby's full 2.67 GW output, but the project still faced a
              final investment decision and a 2028 first-power target in the reviewed independent account. The same
              concentration that improves demand visibility also makes the initial platform dependent on one project and
              one publicly named customer.
