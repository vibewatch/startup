              - CM013
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              For Kilby, the supported buyer and user is a Microsoft-operated data-center campus, with the 20-year power
              purchase agreement functioning as the commercial anchor. Joulent and its release syndications also
              identify industrial electrification and new technologies as prospective large-load segments, but no second
              named customer is established in this pool. Adoption therefore appears project-led: secure a creditworthy
              offtaker, assemble generation and electrical equipment, obtain air permits, close project financing,
              finalize engineering and construction capacity, then deliver power beside the load. Budget ownership is
              likely shared across data center infrastructure, energy procurement, and project-finance functions, but
              the exact internal payer and procurement process remain private.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The central adoption driver is speed to power: one retained report places U.S. interconnection queues at
              five to ten years in many regions as of 2025, while the company positions co-location as a way to serve
              large loads sooner. Scarce high-voltage equipment, EPC capacity, permits, and financing can still shift
              the schedule even when demand is contracted. Kilby's current reliance on gas also creates decarbonization
              and permitting tension rather than a universally superior substitute for grid supply. For valuation, a
              large strategic equity check and a long contract are useful validation, but they do not prove market-wide
              economics: public financial disclosure is limited, Caplight omits public valuation and total funding
              figures, and no repeatable pipeline has been quantified here.
            claimRefs:
              - CM006
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted demand does not remove execution risk
            body: >-
              Kilby's long-term offtake supports financing logic, but EPC capacity, electrical equipment, air permits,
              financing, and gas-related decarbonization concerns remain adoption and schedule constraints.
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and alternatives
        blocks:
          - type: paragraph
            body: >-
              The available landscape is broader than a list of venture-backed peers. Caplight identifies VoltaGrid,
              Talen Energy and Bloom Energy as Joulent comparables, with embedding-similarity scores of 80%, 73% and
              71%, respectively, but its public page does not disclose the operating metrics needed to interpret those
              rankings. Pondero separately describes Applied Digital and announced Chevron/ExxonMobil data-center power
              partnerships as participants in a similar model. The practical substitutes also include waiting for a
              traditional utility interconnection, assembling a hyperscaler-led project internally, or buying
              generation, storage and grid-integration capabilities from multiple suppliers. Pondero reports that U.S.
              interconnection queues had stretched to five to ten years in many regions as of 2025, making time-to-power
              the central competitive axis, but that single source is not an independent benchmark of every alternative.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP008
