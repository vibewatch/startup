  - id: FU001
    title: Disclosed customer journey and expansion pathway
    type: journey-map
    summary: >-
      The public evidence supports a contract-to-build pathway, while operation, measured outcomes, renewal, and a
      second-customer loop remain unobserved.
    data:
      nodes:
        - id: demand
          label: Large-load demand
          detail: Data center or advanced-industry buyer seeks reliable power, timing, and cost certainty.
          touchpoints:
            - Direct infrastructure procurement
            - Large-load project scoping
        - id: configuration
          label: Tailored power configuration
          detail: Joulent describes customer- and geography-optimized generation, storage, and renewable components.
          touchpoints:
            - Load and site design
            - Power-mix configuration
        - id: contract
          label: Long-duration contract
          detail: Kilby is anchored by a 20-year PPA supporting a Microsoft-operated campus.
          touchpoints:
            - Power purchase agreement
            - Project financing support
        - id: development
          label: Project development
          detail: Final investment decision, construction, and commissioning precede customer use.
          touchpoints:
            - Investment decision
            - Construction and commissioning
        - id: operation
          label: Power delivery
          detail: First power is targeted for 2028, so utilization and outcomes are not yet measurable.
          touchpoints:
            - Generation delivery
            - Reliability and cost measurement
        - id: expansion
          label: Expansion loop
          detail: >-
            Joulent proposes additional projects, renewable additions, and eventual grid export, but no repeat customer
            is disclosed.
          touchpoints:
            - Follow-on campuses
            - Additional customers and technologies
    approximationNotes: >-
      This is an evidence-bounded sequence, not a conversion funnel; no stage rates, elapsed times, or
      completed-customer outcomes are available.
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Pre-FID schedule and single-project/customer concentration rank above technology architecture risk because
      mitigations remain contractual or design-stage rather than operating proof.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from disclosed status and unresolved evidence.
        - label: Impact
          detail: Potential effect on first power, project economics, or the investment thesis.
        - label: Mitigation maturity
          detail: Public evidence of how far the mitigation has progressed.
      rows:
        - label: FID and 2028 delivery
          values:
            - label: High
            - label: Critical
            - label: Developing
        - label: Permits and approvals
          values:
            - label: Unknown
            - label: Critical
            - label: Undisclosed
        - label: Project financing completeness
          values:
            - label: Medium-high
            - label: Critical
            - label: Partial
        - label: Microsoft concentration
          values:
            - label: Medium
            - label: Critical
            - label: Contracted, not diversified
        - label: Strategic-partner execution
          values:
            - label: Medium
            - label: High
            - label: Partner-backed
        - label: Operating reliability and controls
          values:
            - label: Unknown
            - label: High
            - label: Pre-operational
    approximationNotes: >-
      Qualitative categories are analytical judgments, not measured probabilities; unknown denotes missing public
      evidence rather than a zero likelihood.
