  - id: FP001
    title: Competitive evidence positioning map
    type: quadrant
    summary: >-
      Ordinal placement separates structural-similarity evidence from public commercial evidence depth; it does not rank
      market share, cost or operating performance.
    data:
      xAxis:
        label: Structural similarity evidence (1=archetype only; 5=closest disclosed match)
        min: 1
        max: 5
      yAxis:
        label: Public commercial evidence depth (1=name only; 5=project and contract disclosed)
        min: 1
        max: 5
      points:
        - label: Joulent
          x: 5
          'y': 5
          detail: Reference company; disclosed project, contract, partner stack and operating model.
        - label: VoltaGrid
          x: 5
          'y': 1
          detail: Caplight similarity 80%; no allocated operating or commercial profile.
        - label: Talen Energy
          x: 4
          'y': 1
          detail: Caplight similarity 73%; no allocated operating or commercial profile.
        - label: Bloom Energy
          x: 4
          'y': 1
          detail: Caplight similarity 71%; no allocated operating or commercial profile.
        - label: Applied Digital / similar entrants
          x: 3
          'y': 2
          detail: Pondero identifies a similar model but provides no like-for-like economics.
        - label: Traditional grid interconnection
          x: 1
          'y': 3
          detail: Status-quo archetype with reported queue evidence, not a company similarity score.
    approximationNotes: >-
      Analyst ordinal synthesis, not measured performance. X maps Caplight similarity of 80% to 5 and 70-79% to 4;
      category-only similarity is 3 and the status-quo archetype is 1. Y reflects disclosure depth in the assigned
      evidence, not business quality.
