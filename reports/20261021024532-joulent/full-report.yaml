  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Joulent's relevant market is not electricity generation generally. The supported boundary is
              purpose-built, firm power delivered beside very large new loads, initially AI data centers, with eventual
              grid interconnection and possible exports. The buyer's alternative is to wait for utility interconnection,
              contract with an incumbent developer, build generation internally, or reduce and phase load. Latitude
              Media describes industrial loads and AI data centers as Joulent's target and reports a broader turn toward
              gigawatt-scale co-located microgrids as operators avoid long queues. The adjacent opportunity in
              industrial electrification is company-identified rather than independently quantified, so it belongs
              outside the core sizing case until a contracted project or buyer pipeline substantiates it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a ladder of demand and capacity indicators, not a conventional TAM/SAM/SOM.
              A secondary report cites an International Energy Agency projection of more than 945 TWh of annual
              data-center consumption by 2030, while Kilby provides the company-specific anchor at approximately 2.67 GW
              under a 20-year Microsoft power purchase agreement. Joulent also began with access to four gigawatts of
              gas turbines, and National Grid's reported $1.75 billion purchase of a 35% stake is a capital-market
              signal. These measures use incompatible units and cannot be added or converted into revenue without price,
              utilization, ownership, pipeline, and project-cost evidence.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
