              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP016
      - number: '3.2'
        title: Capability position and differentiation
        blocks:
          - type: paragraph
            body: >-
              Joulent's disclosed proposition combines small and large turbines, long-duration battery storage,
              renewables, across-the-meter grid connections and centralized orchestration. Its official material
              describes an AI-enhanced control layer that coordinates behind-the-meter and front-of-the-meter resources.
              Pondero's account frames the model as avoiding the conventional interconnection process for the dedicated
              plant-to-load path, while Joulent's own release says projects may connect to the grid over time. This
              integrated architecture is a meaningful positioning claim, not proof of superior delivered cost or
              reliability. The assigned evidence does not document equivalent feature sets for VoltaGrid, Talen or
              Bloom, so the capability matrix marks those cells unknown instead of converting Caplight's similarity
              scores into product claims.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: Commercial model, distribution and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The strongest commercial proof is Project Kilby: a disclosed 2.67 GW facility for a Microsoft-operated
              data-center campus under a 20-year power purchase agreement. National Grid Ventures' $1.75 billion
              investment for a reported 35% stake adds capital, high-voltage expertise and supply-chain access, while
              Chevron and GE Vernova contribute project-development and equipment capabilities. That partner network
              functions as distribution and execution infrastructure rather than a conventional software go-to-market
              channel. Joulent and its partners describe the offer as cost-competitive and as lowering compute cost, but
              no retained source publishes a tariff, energy price, capacity payment, escalation formula or realized
              customer saving. Competitor-specific commercial terms are also absent, preventing a defensible price
              ranking.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Joulent's near-term moat is the coordinated package of contracted demand, strategic capital, reserved
              equipment, fuel and infrastructure expertise, not an evidenced monopoly over co-located generation. That
              package can create project-specific switching costs because a long-duration PPA and dedicated physical
              assets are difficult to replace after construction, but it also concentrates execution dependence in a
              small group of partners and one disclosed anchor customer. The project still faced a final investment
              decision expected in 2026 and targeted first power in 2028 in the reviewed sources, leaving delivered
              performance unproven as of the report date. Similar startup and incumbent-led models could commoditize the
              architecture; Joulent must demonstrate repeatable projects, diversified customers and superior economics
              before partnership assembly becomes a durable platform advantage.
            claimRefs:
              - CP006
              - CP008
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partnership assembly is the current differentiator
            body: >-
              National Grid, Chevron, GE Vernova and Microsoft collectively cover capital, project development,
              equipment and contracted demand, giving Joulent a stronger disclosed execution package than the thinly
              evidenced peer set.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP014
          - type: callout
            title: Comparative economics remain unverified
            body: >-
              Neither Joulent nor the named comparables disclose like-for-like delivered pricing in the assigned
              evidence, so no cost-leadership conclusion is supportable.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Contracted infrastructure is the revenue thesis, not yet a disclosed income statement
        blocks:
          - type: paragraph
            body: >-
              Joulent's disclosed commercial model is project-based power infrastructure rather than software
              subscription revenue. Project Kilby is intended to supply a Microsoft-operated data center campus under a
              20-year power purchase agreement, while Joulent says its Across-the-Meter model co-locates generation with
              customer demand and later connects projects to the grid. National Grid describes the exposure as
              long-duration infrastructure with contractual cash flows, which supports contractability but does not
              reveal recognized revenue, tariff design, minimum-volume protection, escalation, or gross profit. The
              official power-stack page also claims a lower cost of compute, but supplies no price or independently
              measured saving. The result is strong revenue visibility in concept and weak revenue measurability in
              public evidence.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
              - CI016
