      - number: '4.2'
        title: Pricing, cost structure, and unit economics remain private
        blocks:
          - type: paragraph
            body: >-
              The retained sources disclose contract duration, generation capacity, and ownership, but not the values
              needed to calculate project or corporate economics. No source provides the PPA price per megawatt-hour,
              price escalators, dispatch or curtailment terms, heat rate, fuel pass-through, capacity factor, capex per
              gigawatt, operating cost, gross margin, EBITDA, or distribution waterfall. Caplight's public page
              identifies a July 2026 strategic round while leaving the amount and valuation fields blank and restricting
              its filing detail. ValueAdd VC separately estimates an approximately $5 billion valuation from a reported
              $1.75 billion purchase of a 35% stake, but that secondary calculation is not a substitute for transaction
              documents. Neither list pricing nor realized economics can therefore be underwritten from public evidence.
            claimRefs:
              - CI009
              - CI011
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
