evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board roster, investor rights, reserved matters, voting thresholds, succession plan, and management incentive
      documents.
    whyItMatters: >-
      The public executive roster does not establish who controls strategic decisions or how founder and investor
      dependence is mitigated.
    diligencePath: >-
      Request the operating agreement, capitalization table, board minutes, investor-rights documents, delegation
      matrix, and succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financials, current cash, revenue, burn, debt, total funding history, valuation terms, and total employee
      count.
    whyItMatters: The $1.75 billion investment cannot establish liquidity, total capitalization, operating performance, or runway.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank and debt schedules, financing documents, payroll
      roster, and a fully diluted capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: customer-concentration
    missingEvidence: Complete customer and project pipeline with contracted capacity, stage, economics, and counterparty identity.
    whyItMatters: Only Microsoft and Project Kilby are publicly named, so diversification and repeatability cannot be tested.
    diligencePath: >-
      Request the project pipeline, executed and pending customer contracts, capacity by stage, and probability-weighted
      delivery schedule.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: company-history
    missingEvidence: >-
      Primary documentation for the pre-launch development start, intermediate financing, and material milestones before
      June 2026.
    whyItMatters: >-
      The public timeline otherwise begins at launch and relies on one independent retrospective for the
      private-development period.
    diligencePath: >-
      Request formation records, historical investor updates, project-development agreements, and a management-certified
      milestone chronology.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent, geography-specific data on addressable gigawatts, project count, power pricing, utilization, and
      annual revenue for dedicated large-load power.
    whyItMatters: >-
      Without common-unit demand and price evidence, a revenue TAM, SAM, or SOM would be a false precision rather than
      an investable market estimate.
    diligencePath: >-
      Obtain independent grid-queue and large-load forecasts, then reconcile them with project-level price, utilization,
      ownership, and commissioning assumptions.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      A named, stage-qualified project and customer pipeline beyond Microsoft and Kilby, including geography, load,
      offtake status, and expected commissioning.
    whyItMatters: >-
      One contracted project does not establish repeatable demand, customer diversity, or a defensible share of a
      broader market.
    diligencePath: >-
      Request the project pipeline and customer CRM export, then verify named prospects against counterparties,
      site-control records, and contract status.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: buyer-mechanism
    missingEvidence: >-
      Contract pricing, escalation, utilization obligations, credit support, and the buyer's internal energy-procurement
      and budget-approval process.
    whyItMatters: >-
      Capacity and term alone cannot establish revenue, margin, switching cost, or the speed from commercial interest to
      final investment decision.
    diligencePath: >-
      Review the redacted Kilby PPA, financing model, customer approval map, and investment-committee materials in a
      management data room.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable delivered-energy prices, capacity charges, escalation clauses, availability guarantees and realized
      customer savings for Joulent and named alternatives.
    whyItMatters: Without normalized commercial terms, cost leadership and customer switching economics cannot be underwritten.
    diligencePath: >-
      Obtain the Kilby PPA term sheet and like-for-like proposals from VoltaGrid, Talen, Bloom and at least one utility
      pathway.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-data-gap
    missingEvidence: >-
      Primary product, project, customer, pricing and operating-scale evidence for each named comparable and
      internal-build alternative.
    whyItMatters: >-
      The current landscape identifies alternatives but cannot establish exhaustive coverage or rank execution
      capability.
    diligencePath: >-
      Collect official filings, project documents, customer contracts and procurement evidence for each peer before
      investment committee review.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Cash at close, monthly burn, restricted cash, committed draws, and downside runway.
    whyItMatters: >-
      The announced investment cannot be converted into deployable liquidity or runway without transaction and cash-flow
      detail.
    diligencePath: >-
      Obtain the closing statement, latest monthly management accounts, 24-month cash forecast, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
