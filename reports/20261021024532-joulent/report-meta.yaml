  topStrengths:
    - Approximately 2.67 GW of contracted anchor demand under a 20-year Microsoft-linked PPA.
    - A $1.75 billion National Grid strategic investment adds capital and infrastructure expertise.
    - GE Vernova, Chevron-linked Energy Forge, and National Grid provide a credible execution network.
  topRisks:
    - Kilby remains exposed to final-approval, construction, equipment, permitting, and 2028 schedule risk.
    - The complete project capital stack, committed sources and uses, and contingency funding are undisclosed.
    - Initial value is concentrated in one named project and one named customer.
    - Revenue, pricing, margins, cash, debt, transaction preferences, and project returns are not public.
  unresolvedGaps:
    - Signed final investment approval, financing close, permit register, and dated construction schedule.
    - Full Kilby sources and uses, project debt, partner contributions, contingencies, and capital-call obligations.
    - Microsoft PPA pricing, take-or-pay protections, escalation, performance remedies, and termination rights.
    - A second named, contracted, and financed customer or project that demonstrates repeatability.
    - Current revenue, margins, cash, burn, debt, capitalization, governance rights, and preference terms.
