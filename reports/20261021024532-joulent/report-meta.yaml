companyProfile:
  summary: >-
    Joulent is a Houston-based energy-infrastructure developer that publicly launched in June 2026. Its first disclosed
    project, the approximately 2.67 GW Project Kilby, is intended to serve a Microsoft-operated data center campus under
    a 20-year power purchase agreement. National Grid Ventures announced a $1.75 billion strategic minority investment,
    while GE Vernova and Chevron-linked Energy Forge support equipment and project development. The platform remains
    development-stage, with first power targeted for 2028 and no public operating financial history.
