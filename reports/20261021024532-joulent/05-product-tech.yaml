  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-assurance
      missingEvidence: >-
        Independent reliability tests, availability history, control-system architecture,
        cybersecurity controls, certifications, safety cases, privacy boundaries, and incident records.
      whyItMatters: >-
        The product must coordinate critical physical infrastructure, but marketing descriptions do
        not establish resilience, security, compliance, or safe failure behavior.
      diligencePath: >-
        Obtain control narratives, architecture diagrams, third-party audits, certification scope,
        reliability test results, incident logs, and customer acceptance criteria.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: >-
        A public developer repository, API or integration documentation, package activity, technical
        forum, practitioner talk, engineering publication, or comparable community signal.
      whyItMatters: >-
        Without a public developer or practitioner surface, software maturity, integration effort,
        release cadence, and technical adoption cannot be independently assessed.
      diligencePath: >-
        Request API and integration documentation, release history, engineering ownership, code and
        deployment metrics, customer operator references, and relevant technical presentations.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: project-milestone
      missingEvidence: >-
        Current evidence of Kilby FID completion, permits, construction progress, commissioning plan,
        turbine delivery schedule, and binding milestone remedies.
      whyItMatters: >-
