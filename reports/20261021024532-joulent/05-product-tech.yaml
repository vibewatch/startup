company:
  name: Joulent
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Joulent's product is a project-based power stack rather than a standalone software SKU:
    co-located generation, storage, grid interfaces, and centralized controls are assembled
    around large industrial loads. Kilby provides credible project-level definition and
    partner commitments, but final investment, first-power timing, control-system performance,
    security assurance, and repeatability beyond the first project remain incompletely verified.
sections:
  - id: product-and-asset-definition
    title: Product and asset definition
    body: >-
      Joulent presents its product as an integrated power-delivery system for data centers and
      other compute-intensive industrial loads, not as a catalog of separately priced software
      or hardware. The published stack combines small and large turbines, long-duration battery
      storage, renewable generation, an Across-the-Meter interface, and local controls connected
      to a central AI-enhanced controller. Kilby is the only publicly defined operating template:
      approximately 2.67 GW dedicated to a Microsoft-operated campus under a 20-year power
      purchase agreement. That gives the product a concrete customer workflow and asset boundary,
      but it does not establish commercial operation, repeatability, or measured performance.
    claimRefs: [CE001, CE002, CE004, CE005, CE010]
    tableRefs: [TE001]
  - id: operating-architecture
    title: Operating architecture and dependencies
    body: >-
      The architecture joins physical generation and storage with grid-facing equipment and a
      controls layer. Joulent says battery storage absorbs rapid data-center load transients and
      optimizes charging or dispatch, while local controls feed a central decision layer. The
      model begins with generation co-located beside demand and contemplates eventual grid
      connection and exportable capacity. Delivery therefore depends on more than control
      software: turbine supply, EPC capacity, high-voltage equipment, system balancing, fuel,
      construction, and partner execution are all integral. National Grid, GE Vernova, Chevron
      affiliate Energy Forge, and Microsoft cover important roles, but public interfaces,
      redundancy design, failover behavior, and acceptance criteria are not disclosed.
    claimRefs: [CE002, CE003, CE004, CE007, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-maturity
    title: Deployment, integration, and maturity
    body: >-
      Kilby is advanced enough to have a named customer, contracted term, ownership structure,
      identified generation supplier, and reserved EPC capacity. It is not yet evidence of an
      operating fleet. Public reporting still describes a final investment decision as expected
      before the end of 2026 and first power as targeted for 2028. Those are milestones rather
      than achieved outcomes. Joulent also refers to a broader multi-gigawatt pipeline, but the
      retained sources do not identify its sites, customers, specifications, approvals, or
      schedules. Investors should therefore underwrite the present product as a first-project
      delivery platform whose repeatability remains to be demonstrated, not as a proven portfolio.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE002]
  - id: differentiation-and-assurance
    title: Differentiation, assurance, and technical risk
    body: >-
      The differentiated proposition is organizational and architectural: assemble contracted
      demand, generation equipment, fuel and development capability, infrastructure capital, and
      controls around a customer site to reduce dependence on conventional interconnection timing.
      The partner set and long-term PPA strengthen execution credibility, but they do not verify
      product-level reliability, cybersecurity, privacy, environmental compliance, or quality
      controls. The official product page labels the controller AI-enhanced without publishing
      benchmarks, model governance, certifications, uptime history, incident reporting, or
      security architecture. No public developer repository, API documentation, package activity,
      or practitioner-community proxy appears in the assigned evidence. The 2028 target also
      remains exposed to permitting, turbine delivery, and EPC execution.
    claimRefs: [CE006, CE011, CE013, CE014, CE015, CE016]
