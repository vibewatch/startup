callouts:
  - calloutType: strength
    title: Concrete first-project architecture
    body: >-
      Kilby links a named 2.67 GW asset, a 20-year customer contract, a 50% Joulent interest,
      secured turbine capacity, and experienced infrastructure partners.
    claimRefs: [CE005, CE006, CE007, CE011]
  - calloutType: risk
    title: Verification lags the ambition
    body: >-
      Public evidence does not establish FID completion, operating reliability, cyber assurance,
      control-system performance, or a repeatable pipeline beyond Kilby.
    claimRefs: [CE008, CE009, CE010, CE013, CE016]
