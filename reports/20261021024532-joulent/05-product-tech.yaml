      - ["Battery storage", "Handle load transients and optimize charge or discharge", "Storage sizing, controls, degradation management", "No public duration, response, warranty, or safety specification"]
      - ["Across-the-Meter interface", "Coordinate co-located supply, customer load, and eventual grid exchange", "High-voltage equipment, interconnection, protection, and approvals", "Interface and regulatory design are not public"]
      - ["Controls and orchestration", "Join local control loops to a central AI-enhanced controller", "Telemetry, communications, models, operators, and failover", "No benchmark, cyber assurance, uptime, or incident evidence"]
    notes: "Architecture is reconstructed only from retained public descriptions; undisclosed interfaces and controls are recorded as gaps rather than inferred."
    claimRefs: [CE002, CE003, CE007, CE011, CE012, CE013]
