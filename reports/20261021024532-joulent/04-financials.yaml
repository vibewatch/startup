company:
  name: "Joulent"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Joulent has a potentially financeable infrastructure model anchored by a 20-year Microsoft power purchase
    agreement, a 50% interest in the 2.67 GW Project Kilby, and a $1.75 billion strategic minority investment.
    Underwriting remains blocked by the absence of public revenue, realized pricing, cost, margin, cash, burn,
    leverage, and project-capital-stack data; the investment amount is not evidence of cash available.
sections:
  - id: "revenue-model"
    title: "Contracted infrastructure is the revenue thesis, not yet a disclosed income statement"
    body: >-
      Joulent's disclosed commercial model is project-based power infrastructure rather than software subscription
      revenue. Project Kilby is intended to supply a Microsoft-operated data center campus under a 20-year power
      purchase agreement, while Joulent says its Across-the-Meter model co-locates generation with customer demand
      and later connects projects to the grid. National Grid describes the exposure as long-duration infrastructure
      with contractual cash flows, which supports contractability but does not reveal recognized revenue, tariff
      design, minimum-volume protection, escalation, or gross profit. The official power-stack page also claims a
      lower cost of compute, but supplies no price or independently measured saving. The result is strong revenue
      visibility in concept and weak revenue measurability in public evidence.
    claimRefs: ["CI004", "CI005", "CI006", "CI007", "CI012", "CI016"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "pricing-and-unit-economics"
    title: "Pricing, cost structure, and unit economics remain private"
    body: >-
      The retained sources disclose contract duration, generation capacity, and ownership, but not the values needed
      to calculate project or corporate economics. No source provides the PPA price per megawatt-hour, price
      escalators, dispatch or curtailment terms, heat rate, fuel pass-through, capacity factor, capex per gigawatt,
      operating cost, gross margin, EBITDA, or distribution waterfall. Caplight's public page identifies a July 2026
      strategic round while leaving the amount and valuation fields blank and restricting its filing detail.
      ValueAdd VC separately estimates an approximately $5 billion valuation from a reported $1.75 billion purchase
      of a 35% stake, but that secondary calculation is not a substitute for transaction documents. Neither list
      pricing nor realized economics can therefore be underwritten from public evidence.
    claimRefs: ["CI009", "CI011", "CI013", "CI014"]
    tableRefs: ["TI002", "TI003"]
  - id: "capital-adequacy"
    title: "Strategic capital reduces platform risk but does not establish runway or full project funding"
    body: >-
      National Grid agreed to a $1.75 billion strategic minority investment intended to help Joulent execute its
      current project, advance its pipeline, and scale capabilities. Joulent also formalized a 50% interest in
      Kilby. Those facts strengthen sponsor credibility, but funding raised is not cash on hand: public materials do
      not disclose closing mechanics, use-of-funds restrictions, corporate cash, burn, debt, partner contributions,
      or the complete Kilby capital stack. Company Overview contains the financing chronology; for forward
      sufficiency, the key public milestone is the reported final investment decision expected by the end of 2026,
      with first power targeted for 2028. Until the project budget and committed sources and uses are reconciled,
      the amount and timing of additional equity, debt, or project finance remain unknown.
    claimRefs: ["CI001", "CI002", "CI003", "CI009", "CI010", "CI013"]
  - id: "financial-verdict"
    title: "Financial verdict: contracted demand, unproven economics, and concentrated execution"
    body: >-
      The best evidence is the combination of an anchor PPA, strategic industrial partners, and long-dated
      infrastructure framing. The adverse case is equally concrete: independent commentary warns that transmission,
      permitting, fuel availability, and execution can delay projects even after PPAs are signed, while another
      analysis notes that capital-intensive AI-power projects could face overcapacity if demand growth slows.
      Joulent's first disclosed revenue engine is concentrated in one project and one named offtaker, and no retained
      source shows current revenue or margins. The investment case should therefore be treated as a development-stage
      infrastructure underwriting: attractive contracted-demand potential, but no public basis yet for valuing
      earnings quality, margin durability, liquidity, or returns on invested capital.
    claimRefs: ["CI005", "CI008", "CI013", "CI015"]
