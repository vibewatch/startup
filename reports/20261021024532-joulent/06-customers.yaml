figures:
  - id: FU001
    title: Disclosed customer journey and expansion pathway
    type: journey-map
    summary: >-
      The public evidence supports a contract-to-build pathway, while operation, measured
      outcomes, renewal, and a second-customer loop remain unobserved.
    data:
      nodes:
        - id: demand
          label: Large-load demand
          detail: Data center or advanced-industry buyer seeks reliable power, timing, and cost certainty.
          touchpoints:
            - Direct infrastructure procurement
            - Large-load project scoping
        - id: configuration
          label: Tailored power configuration
          detail: Joulent describes customer- and geography-optimized generation, storage, and renewable components.
          touchpoints:
            - Load and site design
            - Power-mix configuration
        - id: contract
          label: Long-duration contract
          detail: Kilby is anchored by a 20-year PPA supporting a Microsoft-operated campus.
          touchpoints:
            - Power purchase agreement
            - Project financing support
        - id: development
          label: Project development
          detail: Final investment decision, construction, and commissioning precede customer use.
          touchpoints:
            - Investment decision
            - Construction and commissioning
        - id: operation
          label: Power delivery
          detail: First power is targeted for 2028, so utilization and outcomes are not yet measurable.
          touchpoints:
            - Generation delivery
            - Reliability and cost measurement
        - id: expansion
          label: Expansion loop
          detail: Joulent proposes additional projects, renewable additions, and eventual grid export, but no repeat customer is disclosed.
          touchpoints:
            - Follow-on campuses
            - Additional customers and technologies
    approximationNotes: >-
      This is an evidence-bounded sequence, not a conversion funnel; no stage rates, elapsed
      times, or completed-customer outcomes are available.
    claimRefs: [CU006, CU007, CU009, CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: Contract quality does not remove concentration risk
    body: >-
      The 20-year Microsoft-linked PPA is strong demand proof, but first power remains future
      dated and retained evidence identifies no second end customer or operating outcome.
    claimRefs: [CU002, CU009, CU010, CU011, CU016]
