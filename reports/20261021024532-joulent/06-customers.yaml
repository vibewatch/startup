artifact: customers
slug: joulent
runDate: 2026-10-21
company:
  name: Joulent
chapter:
  number: 6
  title: Customers
  summary: >-
    Joulent has unusually strong contract proof for a newly launched infrastructure platform:
    Project Kilby is tied to a 20-year power purchase agreement for a Microsoft-operated data
    center campus. That proof is also the central customer risk because retained evidence names
    no second end customer, first power remains targeted for 2028, and no operating retention,
    utilization, satisfaction, or realized-outcome metrics are public.
sections:
  - id: customer-segmentation
    title: Customer segmentation is credible but mostly prospective
    body: >-
      The only named end customer in the retained evidence is Microsoft, whose operated data
      center campus is the demand anchor for Project Kilby. Joulent and its backers describe a
      broader target market of hyperscale data centers, industrial electrification projects, and
      other advanced-industry large loads, but those categories are addressable segments rather
      than disclosed customers. The buyer is therefore best understood as a sophisticated
      long-duration infrastructure offtaker seeking reliable power, schedule certainty, and
      cost visibility; the user is the co-located compute or industrial campus. No evidence
      discloses a channel-led motion, smaller-customer offer, geographic customer mix, revenue
      bands, or a second contracted account.
    claimRefs: [CU001, CU005, CU006, CU016]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Contracted capacity is strong proof, but operating adoption has not begun
    body: >-
      Kilby provides concrete commercial evidence beyond a logo: company and independent
      sources describe approximately 2.67 gigawatts supporting a Microsoft-operated campus under
      a 20-year power purchase agreement, while one independent account says the agreement
      covers the project's full output. The maturity boundary is equally important. Independent
      reports place the final investment decision before the end of 2026 and first power in
      2028, so contracted demand should not be presented as active usage, delivered capacity, or
      a realized customer outcome. Joulent was publicly launched in June 2026; the available
      customer evidence is therefore a forward contract and project-development milestone, not
      an operating cohort.
    claimRefs: [CU002, CU003, CU004, CU009, CU010]
    tableRefs: [TU002, TU003]
  - id: durability-and-economics
    title: The contract indicates duration, not retention economics
    body: >-
      A 20-year power purchase agreement is meaningful evidence of contractual durability and
      can support project financing, and National Grid explicitly frames its investment as
      exposure to long-duration infrastructure with contractual cash flows. It does not reveal
      software-style retention metrics or all of the economics that determine customer quality.
      The retained sources disclose no NRR, GRR, churn, renewal option, pricing formula,
      take-or-pay protection, termination rights, utilization history, satisfaction score, or
      realized savings. Joulent claims its system will improve reliability, timing, and cost,
      including lower cost of compute, but no independent post-deployment measurement is yet
      possible because first power remains prospective.
    claimRefs: [CU002, CU006, CU012, CU013, CU015]
    figureRefs: [FU001]
  - id: concentration-and-expansion
    title: Expansion is a platform thesis with single-customer concentration
    body: >-
      Joulent says Kilby is the first model for a multi-project platform and claims a broader
      multi-gigawatt pipeline, yet the independent report that records that pipeline also notes
      that project locations were not specified. The customer case is consequently concentrated
      at three levels: one named end customer, one named project, and one future operating
      start. An independent analysis explicitly identifies Microsoft concentration and customer
      diversification as a risk. Expansion could come from follow-on campuses, additional
      large-load sectors, renewable additions, or eventual export to local power markets, but
      the retained evidence does not establish a repeat purchase, second account, completed
      deployment, or measured land-and-expand loop.
    claimRefs: [CU007, CU008, CU011, CU014, CU016]
