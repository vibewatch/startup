  - - Hearing-loss users
    - User = hearing-impaired adult; buyer/payer not yet clearly disclosed
    - Selective listening in noise via Hear
    - Public preview proof only
    - Possible adjacent customer base
    - Need commercial shipments and repeat-usage data
