  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer counts and active devices
    missingEvidence: Current active devices, shipped units, and customer counts by segment and geography.
    whyItMatters: Without denominators, named stories cannot be translated into market traction or deployment scale.
    diligencePath: Request installed-base dashboard, shipments by SKU, and active-device estimates by segment.
