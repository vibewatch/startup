    - QU023
  - type: private-evidence-only
    severity: material
    topic: retention and repeat economics
    missingEvidence: Renewal, churn, replacement, upgrade, and repeat-purchase metrics across veterans, schools, and direct buyers.
    whyItMatters: Customer durability is the key missing link between proof-of-use and proof-of-business.
    diligencePath: Request cohort retention, repeat purchase, and upgrade funnel data by product family.
