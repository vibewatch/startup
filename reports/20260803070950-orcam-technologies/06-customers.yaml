- id: adoption-and-deployment-signals
  title: Adoption trajectory and deployment signals
  body: 'The public adoption trail is mostly composed of soft operational signals rather than hard customer counts. OrCam keeps multiple live product, testimonial, demo, support, and store surfaces up, which suggests an active installed base worth serving. Financing plans, free shipping, a one-year warranty, and a 30-day guarantee indicate that the company still expects individual purchasing friction and seeks to reduce it. School-contact pages explicitly ask prospects to leave information for a personal demo, which is consistent with a consultative sales motion rather than a pure click-to-buy education funnel. The apps also reveal ongoing support surfaces and mobile control layers for devices already in the field. What is absent is denominator math: no public active-device count, shipped-unit number, demo-to-close rate, or renewal rate is visible. Therefore, adoption can be described as evidenced but not quantified at scale.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: retention-expansion-and-concentration
  title: Retention, expansion, and concentration risks
  body: 'Retention and concentration are the least transparent parts of the customer story. Public testimonials strongly imply satisfaction and repeat use, but they do not reveal renewal rates, repeat purchase, device upgrade cycles, or cohort churn. Product family breadth does create plausible expansion loops: a veteran or visually impaired user might start with MyEye or Read and later use app-connected features; a school might move from an individual assistive purchase to a broader Learn deployment; and families may purchase add-on or replacement devices as needs evolve. But the public record also suggests concentration risk. VA coverage, blinded-veteran partnerships, specialist distributors, and school demos all point to channel dependence. Adverse reporting that Arab-country purchases were frozen during wartime further shows that important demand pockets can be disrupted by geopolitical or channel-specific events. The proper conclusion is not that the customer base is concentrated beyond
    repair, but that its durability cannot be underwritten without segment-level revenue and retention data.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer verdict and diligence blockers
  body: 'The customer evidence clears the threshold of reality but not of transparency. OrCam clearly serves real blind, low-vision, and reading-support users; it has proof in veterans channels and schools; and it shows enough post-sale and testimonial activity to reject the idea that the company is purely conceptual. At the same time, almost every scaling question remains open: how many active users, what share self-pay versus funded, which segments expand, how concentrated channel revenue is, and how many customers upgrade or churn. For a diligence process, management would need to provide segment-by-segment unit shipments, active devices, funded-versus-self-pay mix, top-partner concentration, upgrade rates, and customer-support intensity. Until then, the best-supported position is that OrCam has authentic customer proof and several viable niches, but no public evidence yet robust enough to prove durable, diversified customer economics.'
  claimRefs:
