company:
  name: OrCam Technologies
chapter:
  number: 6
  title: Customers
  summary: 'OrCam’s customer base is real, but publicly it is better evidenced through named stories and channel surfaces than through aggregate adoption metrics. The strongest visible segments are blind or visually impaired end users, legally blind veterans using VA-linked funding pathways, students with reading differences or low vision, and the educators or caregivers who support them. Public proof includes named users such as Scotty Smiley and Ashley Mizell, school references such as Moon Hall School and CESA #5, and self-service commerce surfaces offering financing, warranties, and demos. What is missing is equally important: no public NRR, churn, cohort retention, or customer-concentration data. The customer verdict is therefore that OrCam has genuine deployment proof and multi-segment fit, but its durability still depends disproportionately on funded channels, testimonials, and high-touch sales motion rather than on transparent repeat-usage data.'
sections:
- id: customer-segments-and-payers
  title: Customer segmentation by user, buyer, and payer
  body: OrCam’s customer map is multi-sided. The end user is often a blind, low-vision, or reading-challenged individual, but the buyer and payer vary by segment. Retail-style commerce pages suggest direct or family-supported purchases for MyEye and Read devices, especially where installment plans and 30-day guarantees are emphasized. Veterans surfaces point to a distinct payer structure in which VA-linked funding or blinded-veteran associations can offset or fully cover device cost. Learn pages reveal a third structure in which teachers, schools, occupational therapists, and families participate in the purchase or deployment decision. These school-facing materials also suggest that the person benefiting from the product is rarely the sole decision-maker. The result is not one uniform customer base but a portfolio of segments with very different procurement friction, affordability, and proof requirements. That customer diversity is strategically positive, but it also makes OrCam more dependent
    on channel execution and advocacy than a purely self-serve accessibility app would be.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof
  title: Named customer proof is stronger than aggregate customer counting
  body: 'Public customer evidence is much more tangible at the named-deployment level than at the portfolio level. OrCam’s veteran materials and blog stories identify real users such as Scotty Smiley and describe device usage in rehabilitative daily living. Read 3 testimonials name Ashley Mizell and make the device’s role in reading to children and navigating blindness concrete. Learn materials surface named adults and organizations, including Michelle Catterson at Moon Hall School, Charisa Cheek at Cooperative Educational Services Agency #5 in Wisconsin, and Dr. Helen Ross as an independent researcher and British Dyslexia Association leader. These references matter because they show use in schools, home learning, and rehabilitation settings rather than only in generic marketing copy. The weakness is that these stories mostly prove relevance, not scaled commercial penetration. We know more about how several users benefited than about how many customers remain active today, what portion came
    through funded programs, or how many upgraded beyond the first device.'
  claimRefs:
  - CU004
  - CU009
