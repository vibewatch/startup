evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current valuation
    missingEvidence: >-
      Primary documents for the reported July 2024 convertible event, current preference stack, and any 2025-2026
      financing terms.
    whyItMatters: >-
      Current valuation is the central bridge fact for investment judgment, yet public market-data estimates and adverse
      reporting diverge sharply.
    diligencePath: Request the latest cap table, convertible note or SAFE documents, and board-approved financing materials.
    relatedQuestionRefs:
      - QO013
      - QO020
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: current headcount
    missingEvidence: A company-provided current employee count by function and geography after the 2024-2025 restructuring period.
    whyItMatters: >-
      Headcount is a key signal for product support capacity, burn, and whether the vision business is still staffed
      meaningfully.
    diligencePath: Request current HR roster, payroll summary, and restructuring timeline by department.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue and profitability
    missingEvidence: Audited or board-level revenue, gross margin, operating expense, and cash-burn data for 2024-2026.
    whyItMatters: >-
      Public adverse reporting suggests severe revenue compression, but official materials provide no company-side
      financial disclosure to confirm stabilization or deterioration.
    diligencePath: Request monthly management accounts, 2023-2025 actuals, and 2026 budget-versus-actuals.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: minor
    topic: board and governance
    missingEvidence: A current board roster, observer rights, committee structure, and founder-control explanation.
    whyItMatters: >-
      Investor disputes and recapitalization stress elevate governance quality from a nice-to-have to a core diligence
      item.
    diligencePath: Request board materials, shareholder agreements, and any current governance memo.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: true OrCam SAM and SOM
    missingEvidence: >-
      A company or investor model breaking down targetable users by geography, funding path, channel, and product
      family.
    whyItMatters: >-
      Public market reports size categories, but none isolates the real subset that OrCam can economically reach and
      convert.
    diligencePath: Request internal TAM/SAM/SOM model, channel conversion data, and cohort-level customer mix.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: reimbursement and institutional procurement rates
    missingEvidence: Hard data on VA approvals, school procurement win rates, insurer reimbursement, and abandonment after training.
    whyItMatters: The market thesis depends on funded or institutionally supported adoption rather than only self-pay purchases.
    diligencePath: Request reimbursement pathway documentation, school contract data, and funded-volume history by cohort.
    relatedQuestionRefs:
      - QM013
      - QM024
  - type: private-evidence-only
    severity: material
    topic: device retention versus smartphone substitutes
    missingEvidence: Usage, retention, or outcome data comparing dedicated OrCam devices with free smartphone accessibility tools.
    whyItMatters: >-
      Substitute pressure is the key commercial constraint, but public evidence shows features rather than comparative
      outcomes.
    diligencePath: Request task-level benchmarking, churn reasons, and longitudinal engagement data by product.
    relatedQuestionRefs:
      - QM019
      - QM024
  - type: stale
    severity: minor
    topic: market-report methodology transparency
    missingEvidence: Open methodology notes showing how syndicated market publishers derived the 2026 low-vision market size.
    whyItMatters: >-
      Commercial market figures are helpful but should not be over-trusted without seeing whether definitions and data
      inputs match OrCam’s actual category.
    diligencePath: Obtain the full analyst reports or triangulate with procurement datasets and public-company segment disclosures.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: competitive churn and win rates
    missingEvidence: >-
      OrCam retention, replacement, and deal-win data against specific substitutes such as Seeing AI, Be My Eyes, and
      Envision.
    whyItMatters: >-
      Without head-to-head usage or churn data, moat durability must be inferred from features and channels rather than
      demonstrated commercially.
    diligencePath: Request competitive CRM notes, lost-deal analysis, churn reasons, and renewal retention by product.
    relatedQuestionRefs:
      - QP023
      - QP025
  - type: missing-source
    severity: material
    topic: realized competitor pricing
    missingEvidence: >-
      Current public price sheets for Envision, eSight, IrisVision, and HumanWare products that are comparable on an
      apples-to-apples basis.
    whyItMatters: >-
      Pricing power is central to OrCam’s relative value proposition, but most retained competitor sources did not
      disclose clean list prices.
    diligencePath: Collect dealer quotes, financing sheets, and trial-program terms from each competitor or distributor.
    relatedQuestionRefs:
      - QP017
  - type: private-evidence-only
    severity: material
    topic: task-level outcome superiority
    missingEvidence: >-
      Benchmark data comparing success rate, speed, and satisfaction on representative tasks across OrCam, phone apps,
      volunteer services, and peer devices.
    whyItMatters: >-
      Feature overlap alone does not prove which product actually delivers better daily outcomes for different user
      cohorts.
    diligencePath: Run controlled user-task studies or obtain internal usability benchmarks by cohort and task.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: minor
    topic: channel-specific economics
    missingEvidence: Margin and conversion data for specialist distributors, VA pathways, school channels, and direct web sales.
    whyItMatters: >-
      Distribution strength is part of the moat, but public sources reveal channel existence rather than economic
      quality.
    diligencePath: Request channel P&Ls, demo-to-sale conversion, and support burden by route to market.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: cash and burn
    missingEvidence: Current cash balance, monthly burn, and runway by board-approved plan.
    whyItMatters: >-
      Runway is the central underwriting question and cannot be solved from public list pricing or historical funding
      alone.
    diligencePath: Request latest cash report, trailing monthly burn, and weekly cash forecast.
    relatedQuestionRefs:
      - QI015
      - QI020
      - QI024
  - type: private-evidence-only
    severity: material
    topic: realized pricing and margin
