            body: >-
              OrCam 的商业化动作比简单的直接面向消费者设备销售复杂。公开页面显示授权分销、直接立即购买界面、 面向学校的 OrCam Learn 销售，以及面向合法失明退伍军人的 VA
              覆盖路径。这个组合很重要，因为它意味着至少部分业务转换周期很长， 且售后有真实的上手和支持义务。应用商店列表强化了这一点：配套 app 免费，并包含 Wi-Fi 设置、
              设备查找、设置控制和支持联系流程，说明硬件发货后，服务和留存工作仍在继续。虽然这些不是完整单位经济性， 但在财务上有关联。它们意味着不低的售后支持成本，以及对渠道伙伴或付款方资格认定的某种依赖。与此同时，VA
              覆盖或学校预算等资助路线，可以提高支付意愿，并降低许多用户面对标价时难以承受的自付压力。
