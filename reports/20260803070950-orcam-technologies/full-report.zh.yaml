      - number: '3.2'
        title: 直接设备同行与功能重叠
        blocks:
          - type: paragraph
            body: >-
              OrCam 的专用设备竞争者在阅读、视觉描述和低视力增强上高度重叠，但架构不同。Envision Glasses 运行在 Google Glass Enterprise Edition 2
              上，强调免手持文本捕获、场景描述、物体和人物识别，以及实时陪伴通话。 eSight Go 与其说是 AI 旁白，不如说是面向中央视力损失的数字视觉增强头显，重点在放大、图像稳定和 45 度视野。
              IrisVision 同样通过可穿戴放大视野瞄准低视力增强，而不是文本优先叙事；HumanWare 智能阅读器品类则更接近文档和图像描述任务。 OrCam 相比这些同行的优势是宽度：MyEye 和 Read 把
              OCR、识别和 AI 助手功能收进一个产品家族。代价是聚焦度。 eSight 和 IrisVision 看起来更专注于残余视力增强；Envision 的 Google Glass
              底座则给了它可识别的免手持智能眼镜形态。 因此，当买方想用一个设备家族覆盖多种盲人和低视力任务时，OrCam 会赢；当买方想要针对某个狭窄视觉用例的最专门工具时，它未必占优。
