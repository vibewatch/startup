      - number: '8.4'
        title: 可比锚点与退出选项
        blocks:
          - type: paragraph
            body: >-
              可比公司组要求保持估值纪律。Mobileye 是与创始人有渊源的以色列计算机视觉成功案例，2024 年收入约 $1.7B，2026 年 8 月市值约 $6.77B，平台规模远大于今天的 OrCam。Sight
              Sciences 是规模小得多的上市眼科技术公司，更接近 OrCam 真正需要回答的规模问题；它 2025 年收入为 $77.4M，估值只有约 $0.28B。Glaukos 是高溢价上市眼科成长可比公司，但其近
              $9.83B 市值对应的是一个受监管眼科平台，净销售额约 $383.5M，而不是一家困境中的利基硬件公司。Sonova
              则从反面提醒：有规模的辅助设备龙头可以很值钱，但前提是已经跑出全球分销、强财务表现和数十亿美元销售额。因此退出逻辑更偏战略交易，而非先 IPO。Intel 2017 年以 $15.3B 协议收购
              Mobileye，说明战略买家愿意为品类领先的计算机视觉资产付费；但 OrCam 当前公开规模不足以把这一先例当成基准情形。若 OrCam
              能从这里实现良好退出，更可信的路径是战略交易，或与特定产品资产挂钩的结构化融资，而不是近期独立 IPO。
