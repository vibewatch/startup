  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代品
        blocks:
          - type: paragraph
            body: >-
              定义 OrCam 市场最清楚的方法，是先收窄再向外扩。核心是低视力辅助设备品类：阅读设备、放大器、可穿戴设备、 屏幕阅读器，以及其他帮助用户获取其无法稳定独立访问的视觉信息的工具。The Business
              Research Company 和 Research and Markets 都这样界定该品类，并明确纳入阅读设备、可穿戴设备和电子放大器。核心之外是更大的辅助技术外圈； WHO
              将白手杖、助听器、语音识别和字幕等产品纳入其中。OrCam 显然触及这个更大空间，因为它销售视觉设备、教育工具和听力产品； 但它并不竞争整个辅助技术 TAM。它也不能干净地归入整个 AI
              医疗设备市场，后者包括医院软件、影像和临床监测系统， 距离 OrCam 的消费者或康复工作流很远。最后，现状替代品也很重要。白手杖、定向行走训练、志愿者和移动 app 可以解决许多相同的日常任务，而不需要购买
              $3,000-$4,000 的专用设备。
