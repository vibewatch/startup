companyProfile:
  summary: >-
    OrCam Technologies 是一家以色列私营辅助技术公司，2010 年由 Amnon Shashua 和 Ziv Aviram 创立。公司靠 OrCam MyEye、OrCam Read 等可穿戴和手持 AI
    设备建立口碑，帮助盲人或视障用户阅读文字、 识别人脸并获取视觉信息，之后又推出用于听力支持的 OrCam Hear。公开证据显示，这家公司确实把产品做了出来， 也有有意义的客户故事和历史独角兽地位；但它同时面临来自智能手机和平台型
    AI 的强替代压力、收入收缩、 裁员，以及资本重组不确定性。
  foundedDate: '2010-01-01'
  founders:
    - name: Amnon Shashua
      role: 联合创始人
      background: 联合创立 Mobileye，并把深厚的计算机视觉和硬件可信度带入 OrCam 最初的产品愿景。
    - name: Ziv Aviram
      role: 联合创始人
      background: 联合创立 Mobileye，并在 OrCam 成长期帮助塑造商业化和融资叙事。
  foundingLocation: Jerusalem, Israel
  headquarters: Jerusalem, Israel
  productSummary: AI 驱动的辅助设备，包括 OrCam MyEye 可穿戴视觉辅助器、OrCam Read 手持阅读辅助器，以及带配套 app 界面的 OrCam Hear 听力支持硬件。
  customerFocus: 盲人和视障个人、获得资助的退伍军人准入渠道、学校与学习支持环境，以及相邻的无障碍买方。
  businessModel: 主要是硬件销售，配合高接触度支持、渠道 / 资助准入依赖，以及若干 app 或服务层；并不是一个清晰披露的经常性软件模式。
  stage: Late-stage private / special situation
  fundingStatus: 历史定价轮在 2018 年达到独角兽里程碑，但当前公开来源在一个看似当前的 ~$1.03B 估算和严重的 2025 年估值重置叙事之间存在冲突。
