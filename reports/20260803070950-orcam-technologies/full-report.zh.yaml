      - number: '8.3'
        title: 情景区间与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录没有揭示一轮干净的当下定价融资，因此框架应是情景估值，而不是伪精确。乐观情形下，OrCam 完成资本重组，守住 Globes 描述的盈利性阅读眼镜经济模型，证明 Hear
              能成为第二增长腿，并把收入修复到足以支撑高端利基设备倍数的区间。这是唯一能清楚支撑估值留在独角兽线附近的路径。基准情形下，OrCam
              仍是一家真实但更窄的辅助设备公司，有资助渠道、重支持的商业化模式，也有足够产品意义来稳定业务，却没有足够证据拿到顶级倍数。悲观情形下，平台替代品继续压缩视觉用例，融资条款变得惩罚性，结果更像结构化资本重组、拆分或战略资产出售。入场纪律应直接跟着这些情景走：若买方今天按公开独角兽标记付款，就等于在管理层证明之前先承销了乐观情形。
