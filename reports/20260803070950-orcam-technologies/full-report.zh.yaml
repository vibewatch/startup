      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              OrCam 依赖几个自己无法完全控制的外部系统。退伍军人路径、失明退伍军人协会、学校演示、分销商、应用商店、智能手机平台，以及可能更广泛的资金提供方，都出现在公开运营图景里。Hear 当前公开应用形态明显依赖
              iPhone；与此同时，Google 和 Apple 也在把眼镜与无障碍能力进一步推入自家平台。这制造了合作伙伴悖论：帮助分发 OrCam
              部分软件界面的平台，也在打造替代能力。对分销商和资助渠道的依赖又增加了一层脆弱性，因为这些路径可能放慢、收窄或重新排序需求。合作方杠杆越强，OrCam
              越需要把工作流掌握得足够深，让替代变难；或者在平台竞争加剧前，更快分散渠道。
