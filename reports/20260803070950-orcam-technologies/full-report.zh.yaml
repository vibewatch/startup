      - number: '5.4'
        title: 差异化、know-how 与技术护城河
        blocks:
          - type: paragraph
            body: >-
              OrCam 的技术差异化，不应主要理解为秘密模型架构，而应理解为辅助产品化。公司反复把计算机视觉或语音分离能力嵌进受限硬件、 直觉控制和定向辅助工作流中。这包括 Read 上的激光引导捕获和离线阅读、MyEye
              上的多模态控制、Learn 的教师分析叙事，以及 Hear 的说话人选择 UI。CES 2024 的外部报道还显示，当 OrCam 把嘈杂环境中的选择性听力这类难题包装成清晰演示时，
              仍能激发真实产品兴趣。护城河风险在于，许多底层使能技术——OCR、摘要、场景描述、语言交互，甚至部分语音隔离—— 正在通用平台上变得更普遍。因此，OrCam
              的防线是特定工作流封装、人体工学和领域聚焦，而不是公开材料中明显证明的封闭技术平台或独特披露 IP 护城河。
            claimRefs:
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
