  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最严重的残余风险集中在技术替代、资本充足性、合作伙伴依赖，以及披露不足的合规深度。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
