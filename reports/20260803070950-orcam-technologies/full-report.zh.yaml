      - number: '8.2'
        title: 当前公开估值标记究竟能确认什么
        blocks:
          - type: paragraph
            body: >-
              公开估值线索并没有初看那么一致。Tracxn 和 2018 年 Times of Israel 报道都支持 Series B 阶段前后存在 $1B 里程碑，Seedtable
              也强化一点：其留存档案中最后一轮清晰定价融资可追溯到 2018 年 2 月。Caplight 不同：它给出晚得多的 $1.03B 估算估值、2024 年 7 月可转债轮，以及 $98.9M
              累计融资额。这些数据有用，但本身不能证明在该估值上存在一轮干净的后期定价股权融资。与之相对，是本组证据里最具杀伤力的独立材料：Globes 报道了 2025 年围绕复苏方案的争议、收入从 2023 年约
              $45-50M 降至 2024 年 $16M，并估计公允价值下跌超过 90%，至约
              $150M。结论不是某个来源一定完全正确、其他来源一定错误，而是公开投资者面对两套互不相容的故事：一个数据商估算的独角兽，和一个可能需要困境资本重组的候选公司。在管理层用当前签署条款和当前收入质量补上这道缺口前，价格仍是核心尽调问题。
