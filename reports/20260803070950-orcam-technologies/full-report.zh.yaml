  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 按用户、买方与付款方划分的客户分层
        blocks:
          - type: paragraph
            body: >-
              OrCam 的客户图谱是多边的。终端用户通常是盲人、低视力或阅读困难个人，但买方和付款方因细分市场而异。 零售式商业页面显示，MyEye 和 Read 设备可能由个人直接购买或家庭支持购买，尤其是在分期计划和
              30 天保证被强调的地方。 退伍军人界面指向一种独特付款结构：VA 相关资助或盲人退伍军人协会可以抵消或完全覆盖设备成本。Learn
              页面揭示第三种结构，教师、学校、职业治疗师和家庭都会参与购买或部署决策。这些面向学校的材料也说明，产品受益者很少是唯一决策者。
              结果不是一个统一客户群，而是一组采购摩擦、可负担性和证明要求差异很大的细分组合。这种客户多样性在战略上有利， 但也让 OrCam 比纯自助式无障碍 app 更依赖渠道执行和倡导。
