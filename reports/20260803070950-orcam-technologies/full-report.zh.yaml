  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              公开法律和监管信号不是非黑即白，而是好坏交织。好的一面是，OrCam 公开了正式使用条款、产品条款与条件、隐私声明中心、Cookie 政策、无障碍声明，以及 FDA
              报告注册记录。这说明公司至少围绕电商和公开支持界面搭起了法律外壳。坏的一面是，这些公开材料没有像部分相邻无障碍工具那样，清楚回答具体产品分类、设备家族监管状态或事件治理。OrCam
              条款明确写明，公司不是医疗机构，网站也不是为诊断或医疗建议而设计；这有助于界定范围，也凸显用户如何理解产品背后的法律敏感性。无障碍声明进一步显示，公司有意满足 WCAG/Section 508
              标准，但意向声明不等于完整产品合规审计。因此法律结论是：可管理，但披露不足。现有结构足以降低明显疏忽风险，却不足以跳过监管或隐私尽调。
