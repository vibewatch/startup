  - id: TV005
    title: 投资论点破裂与终止触发器表
    notes: 触发器设计成可监测且影响估值。
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 新融资验证深度重置
        - 新定价轮或结构化救援融资远低于独角兽估值
        - 确认历史价格叙事已经失效
        - 按重置条款重建估值，不看历史标签
      - - 收入未能稳定
        - 没有证据显示从 2024 年 ~$16M 水平恢复，或收入继续下滑
        - 乐观和基准情景失去支撑
        - 权重转向悲观 / 资产出售结果
      - - 主流 AI 替代核心工作流
        - 用户任务可以可信地用更便宜的平台工具复现
        - 专用设备护城河收窄
        - 下调收入倍数和战略溢价假设
      - - 资助渠道侵蚀
        - 退伍军人或类似资助准入路径走弱
        - 获客经济性恶化
        - 提高折价，降低基准情景概率
      - - 员工进一步收缩或支持恶化
        - 再次大幅裁员，或服务明显下滑
        - 存量用户信任和产品维护走弱
        - 视为产品质量和商业化警讯
      - - 接近或高于 $1B 的透明轮次
        - 独立需求用干净条款支撑溢价
        - 公开估值标记冲突明显收窄
        - 只有拿到收入证据，才重启溢价情景承做
