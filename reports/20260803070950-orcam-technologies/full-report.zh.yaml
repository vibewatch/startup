        - label: 报道的 2023 年收入
          value: ~$45M-$50M
          unit: Globes
          detail: 可作为近期公开收入上限
        - label: 建议
          value: Research-more
          unit: current stance
          detail: 缺少干净证据时，不按历史独角兽价格承销
