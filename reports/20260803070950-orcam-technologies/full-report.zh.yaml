              留存和集中度是客户故事中最不透明的部分。公开推荐语强烈暗示满意度和重复使用，但不披露续约率、复购、 设备升级周期或 cohort 流失。产品家族宽度确实创造了可能的扩张循环：退伍军人或视障用户可能从 MyEye
              或 Read 起步，之后使用 app 连接功能；学校可能从单个辅助采购扩展到更广的 Learn 部署；家庭也可能随需求变化购买附加或替换设备。 但公开记录也显示集中风险。VA
              覆盖、盲人退伍军人合作、专业分销商和学校演示，都指向渠道依赖。不利报道还称， 战时阿拉伯国家购买被冻结，进一步说明重要需求口袋可能被地缘政治或渠道特定事件打断。合适结论不是客户群已经集中到无可挽回，
              而是如果没有细分层面的收入和留存数据，其耐久性无法承保。
