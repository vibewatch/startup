      - number: '7.3'
        title: 资本、运营与人员风险
        blocks:
          - type: paragraph
            body: >-
              运营风险和财务风险绑得很紧。硬件辅助业务本来就要扛库存、支持、保修和渠道复杂度；收入急剧收缩后，这些负担更难供养。公开报道显示，2024 年出现三轮裁员，部分阿拉伯国家需求冻结，救助融资流程到 2025
              年仍有争议。这些事实立刻抬高人员和执行风险：团队缩小后，可能难以支撑多条产品线、维持质量，并以足够速度继续创新来追上平台竞争者。硬件和应用组合还会在制造、分销、上手引导和软件更新之间制造可靠性风险，但公开记录没有披露事件率或故障指标。因此运营问题不是
              OrCam 到底能不能发货，而是它在可见压力下，能否守住产品质量、渠道响应和资本纪律。
