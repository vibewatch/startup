      - number: '5.2'
        title: 架构与运行模式
        blocks:
          - type: paragraph
            body: >-
              公开架构足够具体，可以看出系统模式，尽管还不到工程图级披露。MyEye 和 Read 产品把传感硬件、边缘交互和音频输出组合起来， 围绕辅助阅读和识别运行。Read 3 最清楚地暴露了其中一部分：13MP
              摄像头、700 mAh 电池、BLE 和 Wi-Fi 连接、手持和支架模式、智能放大器控制，以及 AI 辅助交互。MyEye 的手册和产品界面显示，阅读、人脸识别、
              产品识别、钞票、颜色和个性化等任务，采用手势、触控条和语音命令交互。Hear 使用另一套栈，由 TWS 耳机、 智能手机 dongle、低延迟 Bluetooth 和运行说话人分离控制的 iPhone app
              组成。贯穿这些产品的统一运行模式， 是把辅助 AI 放进高度受限的界面，减少对屏幕的依赖。缺失的一层是：各模式下有多少推理在设备端、手机端或云端运行； 公开材料足够理解工作流，但不足以支持完整技术审计。
