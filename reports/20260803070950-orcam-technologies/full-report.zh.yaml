  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              OrCam
              值得进入尽调讨论，但不值得盲目按溢价入场。公司仍有真实辅助产品、真实客户故事，以及曾经支撑严肃公开市场抱负的创始人脉络。这让它不至于落入“概念破产”桶。问题在于，公开价格证据与公开运营压力证据已经剧烈分叉。Caplight
              仍显示约 $1.03B 的估算估值和 2024 年 7 月可转债轮；但最强的负面报道说，2024 年收入降至约
              $16M，仍需额外救助资金，机构投资者实际上正在围绕公允价值重置谈判。在这种背景下，正确投资立场不是抽象的“投”或“不投”，而是“只有价格重置或证据改善才投”。今天我不会按旧独角兽叙事为新资金定价。我会跟踪公司，要求直接股权结构和收入证明，只有当前条款给出足够上行、能补偿高残余风险时才接触。
