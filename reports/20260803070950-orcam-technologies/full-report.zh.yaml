      - number: '2.4'
        title: 支撑采用的增长驱动
        blocks:
          - type: paragraph
            body: >-
              增长逻辑靠人口结构需求、技术改进，以及机构越来越愿意把无障碍视为值得付费的结果共同支撑。WHO 和 NEI 数据显示，需求池由人口老龄化、持续存在的屈光和白内障相关损伤，以及大量未满足的护理需求支撑。TBRC
              明确把低视力设备市场增长与视觉损伤患病率上升、糖尿病相关视力损失联系起来，同时强调对便携式可穿戴设备、 电子放大器和 AI 辅助工具的需求。OrCam 自身近期产品信息很契合这些趋势：Read 3 和 MyEye
              3 Pro 现在把 AI 助手功能、翻译和放大定位为增量价值层，而不只是 OCR。WHO 的全球辅助技术工作还提供政策论点：
              能保留独立性的设备可改善教育、就业和公民生活中的包容性，从而为公共或机构买方创造投资回报逻辑。对 OrCam
              来说，这一点很重要，因为市场增长不只发生在需要帮助的人变多时，也发生在学校、退伍军人系统和家庭认定设备驱动的独立性值得付费时。
