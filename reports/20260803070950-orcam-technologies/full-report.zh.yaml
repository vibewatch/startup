  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与变现组合
        blocks:
          - type: paragraph
            body: >-
              可见收入模式仍以硬件为主。OrCam 公开销售 MyEye 和 Read 设备，通过伙伴渠道分销，并用配套 app 支持这些设备，而不是提供独立付费软件层。MyEye 3 Pro 标价 $4,250，Read 3
              起价 $2,790； 这意味着公司并不试图靠低客单价规模取胜。它看起来依赖高端设备经济性，并由能够承受培训和采购摩擦的买方群体支撑。 公开页面还显示至少两条相邻变现路径。第一，面向学校的 OrCam Learn
              被定位为服务学生和教育工作者、带分析功能的解决方案， 更像机构预算项，而不是纯消费者销售。第二，不利报道称 OrCam Hear 正进入营销和销售，说明未来可能多元化，
              但还不是成熟的当前收入基础。Caplight 将业务归类为硬件销售、订阅 SaaS、服务与咨询的组合；但公开官方证据强力支持硬件优先， 只部分支持经常性或服务权重较高的收入。
