      - number: '3.3'
        title: 软件和服务替代品是最大的位移威胁
        blocks:
          - type: paragraph
            body: >-
              最危险的竞争者并不总是最好的专用设备，而往往是最便宜、足够好的替代方案。Seeing AI 免费、移动端可用， 覆盖范围越来越完整，可处理文档、产品、场景、货币、颜色、手写内容，以及围绕扫描文本的 AI
              聊天。Be My Eyes 提供少有私营硬件公司能匹配的规模：免费 app、150 个国家、180 种语言、数十万用户、数百万志愿者， 以及通过 Be My AI 实现的 AI 图像描述。Aira 比这些 app
              层更贵，但承诺完全不同：专业视觉解读员、 接入地点，以及随处可用的订阅式辅助。Apple 借 Magnifier、Accessibility Reader 和连接 Apple Intelligence
              的探索功能，更深地推入基础操作系统；这意味着许多主流设备所有者无需再买另一套硬件平台，也能获得低视力帮助。 这些工具并不总能替代
              OrCam，尤其是对想要免手持或专用设备可靠性的用户。但它们无疑压低了日常阅读和场景描述任务的价格伞， 而这些任务曾让 OrCam 硬件显得更独特。
