  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 由用户工作流定义的产品线
        blocks:
          - type: paragraph
            body: >-
              描述 OrCam 产品图谱，按用户任务比单纯按 SKU 清单更合适。MyEye 是盲人或视障用户的可穿戴任务引擎， 让他们在日常移动中获得实时阅读、识别和场景描述。Read 和 Read 3
              服务文档访问工作流，面向视力损失、 阅读疲劳或学习困难人群，让文字被朗读、总结、放大，或按指令导航。Learn 把这个工作流延伸到学校场景， 提供阅读练习、理解提示和教师侧分析。Hear
              是独立的音频注意力产品，面向嘈杂对话环境，而不是视觉设备。 这在战略上重要，因为 OrCam 不只是发售一个小工具；它试图把一组辅助工作流转化为专用硬件和 app 体验。
              这种做法的技术强项是封装。技术弱点是，每个产品家族如今都在与能力越来越强的通用 AI 系统竞争。
