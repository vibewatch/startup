      - number: '4.3'
        title: 成本结构、资本强度与单位经济性可见度
        blocks:
          - type: paragraph
            body: >-
              OrCam 销售的是专用辅助硬件，而不是纯软件，因此其成本结构几乎肯定包括 BOM、组装、质量控制、分销利润、 退货、培训和客户支持。公开记录间接证明了其中一些要素。移动 app
              和版本说明界面显示设备支持仍活跃； 退伍军人和学校叙事中出现培训和引导；公司产品横跨可穿戴、手持和教育形态，可能提高库存和支持复杂度。公开记录没有揭示的内容同样重要： 实现
              ASP、分销商折扣、毛利率、CAC、回本期、保修成本、退货率和库存过时风险都不可得。这意味着不能把硬件价格误当作硬件利润率。 事实上，不利报道说明利润率压力可能很严重，因为免费或低价 AI
              替代品已经削弱了继续投资低视力产品开发的经济理由。 结果是，这个财务画像天然比软件无障碍产品更重资本、也更难观察；公开证据不足以支撑高效增长承保。
