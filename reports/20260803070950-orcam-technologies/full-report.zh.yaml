  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 按竞争者类别划分的格局
        blocks:
          - type: paragraph
            body: >-
              竞争格局按类别理解，比拉平为供应商清单更清楚。第一类是直接专用设备同行：Envision Glasses、eSight Go、 IrisVision Vista 和 HumanWare
              智能阅读器家族，都明确向盲人或低视力用户销售硬件。第二类是 Aira 和 Be My Eyes 等人工辅助或服务替代品，它们不向用户出售高价阅读设备，却能解决许多相同的日常任务。第三类是以 Apple 和
              Microsoft 为首的平台级替代品，无障碍功能叠加在用户已经拥有的智能手机或电脑上。第四类是白手杖和定向行走教学等现状支持， 它们不试图用 AI
              替代视觉，却仍是关键独立工具，因此争夺时间、注意力和部分预算。OrCam 仍属于直接设备类别， 因为 MyEye 和 Read
              仍是专用硬件。但前两章的市场证据已经很清楚：战略战场越来越转向替代品类别，而不只是另一个智能眼镜创业公司。
