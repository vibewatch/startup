      - number: '2.2'
        title: 规模测算口径，以及为什么需要多个分母
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只有在分母被拆开时才有用。WHO 的视力损伤事实表显示，漏斗顶部需求基数巨大：至少 2.2 billion 人存在近视力或远视力损伤，其中至少 1 billion 个病例可预防或尚未处理。WHO
              的辅助技术事实表把问题进一步扩大： 当前超过 2.5 billion 人需要一种或多种辅助产品，到 2050 年将升至 3.5 billion。这些数字描述的是需求， 不是 OrCam 的实际
              SAM。商业品类口径要小得多。TBRC 称，低视力辅助设备市场在 2025 年达到 $1.23 billion，2026 年达到 $1.34 billion，并可能以约 9% CAGR 增长到 2030 年的
              $1.89 billion； Research and Markets 给出同样的 2026 年和 2030 年数值。更宽的相邻口径来自 AI 加持的医疗设备； TBRC 和 Grand View
              Research 指向规模数十亿美元、增长更快的市场。这个口径对组件和技术顺风有战略意义， 但单独用来支撑 OrCam 当前收入机会，太宽。
