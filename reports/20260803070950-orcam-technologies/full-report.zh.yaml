      - number: '1.3'
        title: 融资历史与估值可见度
        blocks:
          - type: paragraph
            body: >-
              OrCam 的历史资本化在独角兽节点之前有较好支撑，但当前标记并未清晰落定。Tracxn 复原出 2014 年 $15 million Series A、2017 年 $41 million 轮，以及 2018
              年 2 月由 Clal Insurance 和 Meitav 领投的 $30.4 million 轮，使披露融资额达到 $86.4 million。Globes 和 The Times of Israel
              分别佐证了 2018 年融资和 $1 billion 投前估值。更新近的数据库视图开始分叉。Seedtable 称有四轮融资；Caplight 报告总融资 $98.9 million，将最近事件标为 2024 年
              7 月可转债，并估算估值为 $1.03 billion。 这一图景被 Globes 2025 年 3 月关于困境恢复计划的报道直接挑战，该报道称内部估算已把价值压到约 $150 million。
              正确结论不是某一个数字一定正确，而是 OrCam 2018 年独角兽地位有历史验证；当前估值和融资状态则存在争议，不能在没有原始融资文件时当作已定事实。
