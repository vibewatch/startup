      - number: '3.5'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              OrCam 的护城河真实存在，但很脆。耐久的部分是专用辅助硬件、低视力用户体验、培训渠道，以及识别、阅读、放大等日常生活功能的整合。 脆弱的部分在于，这些功能中许多正被拆进免费或补贴软件层。Apple 和
              Seeing AI 的材料尤其值得注意， 因为它们把高质量无障碍能力带入用户可能已经拥有的设备。Be My Eyes 和 Aira 说明，人工或 AI 支持可以叠加到用户现有的拍照手机上；eSight 或
              IrisVision 则说明，低视力增强专家可以直接进攻残余视力人群。 即使专用设备同行，如今也提供教练、VA 路径和配套通话功能，削弱 OrCam 在渠道和支持上的差异化。结果还不是商品化。
              在一体化设备能在速度、隐私、人体工学和资助准入上胜过 app 的地方，OrCam 仍能赢。但护城河不能只靠品牌守住； 它取决于证明这种整合确实比越来越拥挤的替代栈产生更好结果。
