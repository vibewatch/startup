      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              用户通常是盲人或低视力个人，但买方往往是别人。OrCam 自身渠道至少显示四条反复出现的购买路径。第一是消费者直接购买，
              由经销商和线上商店行为支撑。第二是机构影响下的个人购买，家庭、康复专家或教师帮助证明设备对日常阅读或学校使用的必要性。 第三是学校采购，用户是学生，但经济买方可能是学校、学区或特殊需求项目；OrCam Learn
              for Schools 通过强调教师分析和进展监控，把这一点说得很明确。第四是福利资助或公共路径购买，尤其是有 VA 覆盖的退伍军人。
              在这些情况下，用户仍是视障个人，但付款方可能是公共项目。因此，更广的市场横跨个人使用、医疗健康相邻预算和教育预算。 这很有吸引力，因为它创造多条采用路径；但它也拉长销售周期，提高培训和结果证明的重要性，并意味着
              OrCam 不是在一个同质化的结账场景里销售。
