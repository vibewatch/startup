  - id: FV001
    title: 推荐逻辑
    type: flow
    description: 从真实产品证据，到价格冲突和尽调关口，再到当前建议的决策路径。
    data:
      nodes:
        - id: proof
          label: 真实公司证据
          detail: Read、MyEye、Hear、受资助渠道和创始人履历支撑其仍有非零价值
        - id: conflict
          label: 价格冲突
          detail: Caplight 约 $1.03B，对比 2025 年不利报道给出的约 $150M 公允价值估计
        - id: price
          label: 当前签约价已知？
          detail: 可取得新近定价轮或经审计的二级交易
        - id: economics
          label: 收入与优先权结构已知？
          detail: 收入 run-rate、毛利率和稀释悬垂已厘清
        - id: premium
          label: 溢价估值有支撑？
          detail: 证据支持按接近历史独角兽水平的价格买入
        - id: research
          label: 继续研究 / 跟踪
          detail: 在价格冲突未解前，默认维持当前立场
        - id: avoid
          label: 避开历史价格
          detail: 如果缺少当前轮证据，或经济性仍弱
        - id: conditional
          label: 有条件特殊情境买入
          detail: 只有重置价格或结构创造非对称上行时才成立
      edges:
        - from: proof
          to: conflict
          label: 仍需价格
        - from: conflict
          to: price
          label: 解决冲突
        - from: price
          to: research
          label: 否
        - from: price
          to: economics
          label: 是
        - from: economics
          to: research
          label: 否
        - from: economics
          to: premium
          label: 是
        - from: premium
          to: avoid
          label: 否
        - from: premium
          to: conditional
          label: 是
    claimRefs:
      - CV007
      - CV010
      - CV028
      - CV029
      - CV030
      - CV032
