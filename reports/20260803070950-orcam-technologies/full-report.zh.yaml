      - number: '3.4'
        title: 转换成本、锁定与分销力量
        blocks:
          - type: paragraph
            body: >-
              转换成本有意义，但不是绝对。OrCam 用户学会了手势、设备工作流和配件之后，确实会产生习惯和培训成本。当设备通过学校、
              退伍军人项目或专业分销商资助，而不是随手在线购买时，专用设备也会形成更强黏性。但市场中相当一部分仍适合多归属： 用户可以拥有一台 OrCam 设备，同时在不同任务上继续依赖 Seeing AI、Be My
              Eyes、白手杖或 Aira。 从这个意义上说，战斗不太是硬锁定，而是日常使用时刻份额。分销力量也按类别明显不同。Aira 和 Be My Eyes 受益于应用商店规模和机构准入伙伴关系；Apple 和
              Microsoft 借默认平台分发；Envision、 eSight、IrisVision、HumanWare 和 OrCam 更依赖专业销售、演示、转介和培训渠道。因此，OrCam
              在美国的分销商和退伍军人证据具有战略意义：它帮助公司打一场单靠消费者平台触达打不赢的分销战。
