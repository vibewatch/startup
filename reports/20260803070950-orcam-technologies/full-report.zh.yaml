        title: 信任、安全、质量与合规姿态
        blocks:
          - type: paragraph
            body: >-
              OrCam 的公开信任姿态好坏参半。积极一面很清楚：手册、入门内容、设备 app、支持界面，以及 FDA 报告商业注册足迹都有证据。
              这些不能证明安全性更强，但说明公司在结构化支持辅助硬件用户。较弱一面是公开合规细节相对稀薄。与 Microsoft 的 Seeing AI 手册相比——后者明确写出预期用途、禁忌和 MDR 分类——OrCam
              可读公开材料披露的安全和监管结构少得多。 App store 数据披露较基础，公开摘录没有暴露安全架构、正式质量体系声明、事件处理，或各设备家族认证范围。
              这不能证明质量失败。它意味着尽调应把信任和合规视为披露不足的技术领域，而不是已经解决的强项。
