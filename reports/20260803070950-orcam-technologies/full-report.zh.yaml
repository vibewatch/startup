        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              按披露口径看，OrCam 的公开财务画像达不到投资级。证据足以说明，公司曾经支撑高端硬件定价、建立可信的机构渠道，
              并且在某些语境下可能仍保有有利润的视觉产品。证据也足以说明，业务经历了严重收入冲击、反复裁员，并依赖救援融资或重组，
              才能走向任何由听力业务牵引的未来恢复。核心尽调阻断项不只是细节缺失，而是不对称：公开记录里最具体的数字是负面数字。 承保时，管理层需要拿出 cohort 层面的单位销量、按渠道实现的
              ASP、按产品线毛利率、当前月度烧钱、账上现金、 库存敞口，以及经调和的融资历史。没有这些，正确立场是：OrCam 可能仍有有价值的产品和渠道，但利润率路径和独立资本充足性仍未被证明。
