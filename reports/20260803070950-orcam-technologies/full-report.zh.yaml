      - number: '8.5'
        title: 最终尽调问题与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              缺失证据异常具体。第一，当前价格是多少？不是数据商估算，不是过时的 2018 年轮次，也不是媒体对困境的估计，而是实际签署的当前条款。第二，投资者应承销哪组收入：2024 年低谷、稳定后的 2025
              年运行率，还是一个彻底改变收入基数的拆分公司前瞻计划？第三，救助场景中普通股之上压着什么：反稀释要求、贷款、可转工具、清算优先权，或产品级出售权？这些不是收尾问题。它们决定一个看似诱人的估值重置是否真的可投。最清晰的论点失效触发点同样具体：一轮验证深度价值重置的融资、再次大幅裁员、更多证据显示主流
              AI 完全替代核心低视力工作流，或当前支撑需求的资助准入渠道流失。正向触发因素也同样清楚：一轮透明定价的新融资、收入已经稳定的证据、Hear
              能在不过度烧钱的情况下放大的证明，以及更干净的资本结构。在此之前，OrCam 属于观察名单 / 特殊情境池，不属于标准成长股权投资池。
