  - id: TV006
    title: 最终尽调问题表
    notes: 尽调问题按对投资决策的价值排序，而不是按收集难度排序。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前股权结构表
        - 最新定价轮、转换条款、清算优先顺位、反稀释权
        - 不弄清谁排在普通股前面，估值就不可信
        - 管理层 + 法律顾问资料室
      - - 当前收入桥
        - 2024 年实际值、2025 年年化收入、拆分后公司备考口径、产品组合
        - 哪个收入基数真实，会大幅改变情景权重
        - CFO 材料包 + 董事会材料
      - - 毛利率与支持负担
        - 按设备线拆分的利润率、保修成本、培训 / 支持费用
        - 专用硬件收入看起来可以，贡献利润率可能很弱
        - 财务 + 运营复核
      - - Hear 牵引力
        - 听力产品的销售漏斗、付费转化、留存和销售效率
        - 乐观情景依赖 Hear 不只是抵消视觉业务下滑的概念
        - 产品 + 销售尽调
      - - 战略兴趣
        - 按资产线拆分的活跃买方、合作伙伴或结构化融资流程
        - 战略可选性可能支撑高于纯上市可比测算的价值
        - 董事会 / 投行讨论
      - - 治理与恢复计划
        - 2025 年争议后，董事会批准的经营计划与投资人对齐情况
        - 如果治理仍未对齐，执行风险会继续偏高
        - 董事会会议纪要 + 融资文件
