      - number: '4.4'
        title: 资本充足性与困境信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开信号指向资本压力，而不是经营杠杆。Tracxn 报告三轮总融资 $86.4 million；Caplight 显示 $98.9 million 和 2024 年 7 月可转债事件；Seedtable
              建模为四轮融资，但只暴露有限细节。 这些差异已经讲出一个尽调故事：即使基础融资历史，在公开来源里也没有完全落定。更关键的证据来自不利报道。Calcalist 写道，2024
              年裁员发生在公司决定停止进一步开发低视力产品之后，原因是基于智能手机的 AI 替代品让这些产品在经济上变得冗余。 Globes 后来报道，2024 年收入从 2023 年的 $45-50 million 降至约
              $16 million，创始人及盟友发起一轮 $12.5 million 融资，其中约 $7 million 来自 Shashua，公司仍需要另外 $12-15 million。同样重要的是， Globes
              称拟议的 $2 million 贷款只能让公司维持一两个月。合在一起，公开图景是一家公司有有意义的历史融资， 但近期 runway 很薄，救援融资有争议，且商业模式承受替代技术压力。
