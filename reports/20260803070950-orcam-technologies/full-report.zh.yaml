      - number: '1.5'
        title: 不利信号、转向风险与未解问题
        blocks:
          - type: paragraph
            body: >-
              本轮最强的负面证据来自以色列商业报道，而不是监管行动。Calcalist 2024 年 7 月报道称，OrCam 关闭了面向视障者的眼镜开发活动， 执行当年第三轮裁员，并因生成式 AI
              和基于智能手机的图像处理快速进步削弱了继续开发低视力产品的必要性，而把重心转向 Hear。 Globes 2025 年 3 月的报道更进一步，称投资人争议拖延了恢复融资，收入从 2023 年约 $45-50
              million 降至 2024 年 $16 million，并且公司计划拆分业务、筹集应急资本。这些报道不能证明消费者视觉业务已经消失； 官方页面仍在积极营销 MyEye 和
              Read。但它们确实证明，后续章节必须把智能手机替代、资本结构压力和战略不稳定， 当作核心尽调问题，而不是假设性风险。主要未解问题是当前员工数、2024 年可转债事件真实状态、精确的当前收入，
              以及公司是否正围绕更窄的产品组合重新稳定下来。
