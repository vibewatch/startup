      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事异常容易核验，因为 OrCam 自身材料和独立报道都把公司直接指向 Amnon Shashua 和 Ziv Aviram， 也就是 Mobileye 背后的同一组搭档。领导层页面仍列出 Shashua
              为联合创始人兼董事长、Aviram 为联合创始人兼董事， 同时列出 Elad Serfaty 为首席执行官、Shmuel Turgeman 为首席财务官、Tzahi Israel 为销售高级副总裁。
              Caplight 还补充了围绕较新的 Hear 业务的额外运营角色，包括 Tal Rosenwein 任 CEO-Hear，以及 Inbal Levy-March
              负责运营。这种组合说明，公司仍由知名创始人压阵，但日常运营不再只靠他们两人驱动。与此同时，公开治理可见度仍然偏薄。 OrCam
              当前网站展示了创始人和核心管理层，但没有完整的董事会名单、委员会结构，或清楚说明视觉、教育和听力产品线之间如何分权。 对尽调来说，问题不在于领导层是否存在，而在于创始人以下的控制权和接班安排是否足够透明。
