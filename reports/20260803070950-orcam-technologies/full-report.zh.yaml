    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与产品范围
        blocks:
          - type: paragraph
            body: >-
              OrCam 官方材料一贯把公司描述为一家辅助技术专家，核心是 AI 加持的可穿戴和手持产品，而不是泛消费电子品牌。 关于我们页面将 OrCam
              定位为聚焦低视力和学习挑战的全球领导者；主页和产品页显示，当前产品线包括 MyEye 3 Pro、 MyEye 2 Pro、Read 5、Read 3、Read、Learn 和
              Hear。最扎实的产品事实集中在当前旗舰设备上。MyEye 3 Pro 仍是可穿戴个人助手，可朗读文字、识别人脸、识别产品和钞票，并增加环境描述和 Smart Magnifier 工作流。 Read 3
              更像阅读平台，而不是通用可穿戴设备：它既是手持 OCR 阅读器，也是可接屏的 Smart Magnifier， 还是基于支架的固定阅读器。FDA 报告索引还显示，U.S. ORCAM INC
              在纽约地址有注册；Tracxn 和 Caplight 则都把公司中心放在耶路撒冷。因此，最站得住脚的运营画像是：OrCam 是一家扎根耶路撒冷、同时在美国有重要商业或监管足迹的公司。
