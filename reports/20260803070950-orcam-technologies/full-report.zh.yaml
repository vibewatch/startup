      - number: '5.3'
        title: 部署、支持与路线图信号
        blocks:
          - type: paragraph
            body: >-
              部署看起来被有意简化。移动 app 免费，手册强调充电、手势和入门，设备设计通过音频反馈工作，而不是依赖复杂视觉 UI。 Read 3 明确支持手持和固定阅读器操作；Hear 则依赖 iPhone app
              和连接手机的 dongle，形成更紧的智能手机依赖。 支持界面包括 FAQ、版本说明、应用商店诊断字段，以及从 app 内直接联系支持。路线图可见度则不均衡。
              版本说明页面确认仍在更新，但可读摘录中很少发布结构化变更历史。Hear 的 CES 时期报道显示产品处于预览或早期发货模式， 外部评测强调潜力多于成熟商业规模。因此，整个产品栈成熟度不均：MyEye 和 Read
              看起来像成熟辅助设备； Learn 看起来特定于工作流但已建立；Hear 仍像一个较新的押注，并且实质依赖 app 质量和持续调校。
