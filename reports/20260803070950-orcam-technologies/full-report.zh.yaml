      - number: '2.5'
        title: 采用约束、替代压力与规模缺口
        blocks:
          - type: paragraph
            body: >-
              最难的市场问题不是无障碍需求是否存在，而是在软件替代品吸收任务之前，专用硬件能否捕获足够价值。免费或低成本智能手机工具如今覆盖了许多曾经支撑专用阅读器或可穿戴设备的单项任务。 Microsoft 的 Seeing
              AI 在移动端免费读取文档、产品、场景、人物、货币、颜色和手写内容。Be My Eyes 提供免费志愿者帮助、AI 图像描述，以及全球范围内的大品牌服务接入。Aira 在其上叠加付费人工视觉解读和 AI。
              Apple 正在把 Magnifier 和 Accessibility Reader 做进自身生态，并让能力更强；Envision Glasses 则说明专用 AI 可穿戴设备已不再是单一玩家品类。WHO
              也强调了结构性摩擦：认知不足、成本高、准入有限、 采购挑战和劳动力缺口。这些摩擦让实际 SAM 小于标题式需求。由此可见，只有当专用设备显著优于免费 app、
              拿到报销，或在具备培训和支持的场景中交付独立性时，OrCam 的市场才有吸引力。否则，即使底层需求持续上升，采用也可能停滞。
