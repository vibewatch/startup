      - number: '7.2'
        title: 技术替代与模型挤压风险
        blocks:
          - type: paragraph
            body: >-
              技术替代是最清晰的投资论点风险。Calcalist 直接报道称，语言模型进步让继续投入低视力开发变得不必要；Globes 则报道称，AI 公司竞争是推动复苏方案的两记重击之一。替代集合不再抽象：OpenAI 与
              Be My Eyes 的合作、Apple 的无障碍能力栈、Microsoft Seeing AI，以及 Google
              宣布的智能眼镜，都指向同一件事——主流玩家正把视觉和听力辅助嵌进通用平台。这不能证明这些产品在每个工作流都胜过 OrCam，却能证明辅助感知已不再是受保护的功能集。OrCam
              的防线在包装、人体工学、资助渠道和使命契合。如果这些因素压不过通用模型进步，公司就会面临毛利挤压、需求流失，以及专用设备研发理由变弱。
            claimRefs:
              - CR009
              - CR010
