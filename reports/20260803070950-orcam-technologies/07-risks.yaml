  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TR001 regulatory / legal risk register coverage
    missingEvidence: Device-family regulatory inventory, intended-use statements, complaint handling, and privacy governance by product.
    whyItMatters: Legal shell pages reduce ambiguity at the website level, but not at the product-risk level investors need.
    diligencePath: Request product-by-product regulatory matrix, risk files, privacy architecture, and incident escalation process.
    relatedTableRefs:
    - TR001
    relatedQuestionRefs:
    - QR005
    - QR016
    - QR023
  - type: private-evidence-only
    severity: material
    topic: operational quality and support metrics
    missingEvidence: Failure rates, returns, support backlog, app stability, and release-quality trends.
    whyItMatters: The combination of hardware, software, and vulnerable users makes support quality a thesis-critical risk.
    diligencePath: Request QA dashboards, returns analysis, support SLAs, ticket aging, and release defect data.
    relatedQuestionRefs:
    - QR013
    - QR019
    - QR026
  - type: private-evidence-only
    severity: material
    topic: partner and channel concentration
    missingEvidence: Revenue dependence by VA, distributor, school, geography, and direct sales.
    whyItMatters: Partner and funded-channel reliance can turn a diversified user story into a concentrated revenue reality.
    diligencePath: Request route-to-market revenue mix, top-partner concentration, and geographic exposure analysis.
    relatedQuestionRefs:
    - QR012
    - QR014
    - QR022
  - type: private-evidence-only
    severity: material
    topic: capital and recapitalization terms
    missingEvidence: Current cash, signed bridge/rescue documents, covenant stack, and post-money cap table.
