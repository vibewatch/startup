schemaVersion: report-v2
artifact: risks
slug: orcam-technologies
runDate: '2026-08-03'
company:
  name: OrCam Technologies
chapter:
  number: 7
  title: Risks
  summary: 'OrCam’s risk profile is dominated by technology substitution, capital fragility, and disclosure gaps rather than by one single regulatory red flag. The public record shows a company selling premium assistive hardware into vulnerable but real use cases, while competing against fast-improving platform AI and free accessibility software. Adverse reporting suggests that this competition has already harmed revenue and triggered layoffs. At the same time, OrCam’s own public legal and accessibility materials show a structured but incomplete trust posture: there are terms, privacy, accessibility, and support surfaces, but much less structured product-risk disclosure than some software competitors publish. The highest-risk investment implication is not that OrCam has no mitigation path. It is that several core risks—capital adequacy, platform displacement, partner concentration, and product-compliance depth—still require management evidence rather than public inference.'
sections:
- id: regulatory-and-legal-risks
  title: Regulatory and legal risks
  body: 'Public legal and regulatory signals are mixed rather than binary. On the positive side, OrCam exposes formal terms of use, product terms and conditions, a privacy statement hub, a cookies policy, an accessibility statement, and an FDA-report registration footprint. That suggests a company that has at least built a legal shell around its commerce and public support surfaces. On the negative side, these public materials do not clearly resolve product-specific classification, device-family regulatory status, or incident governance in the same way some adjacent accessibility tools do. OrCam’s terms explicitly state that the company is not a medical organization and that the website is not designed to provide diagnosis or medical advice, which helps define scope but also highlights legal sensitivity around how users interpret the product. The accessibility statement further shows intent to meet WCAG/Section 508 standards, but an intent statement is not a full product-compliance audit.
    The legal verdict is thus manageable but under-disclosed: there is enough structure to reduce obvious negligence risk, but not enough product-level detail to dismiss regulatory or privacy diligence.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
