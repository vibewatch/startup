  - FO003
- id: adverse-signals-and-open-questions
  title: Adverse signals, pivot risk, and unresolved questions
  body: The strongest negative evidence in this run comes from Israeli business reporting rather than regulator actions. Calcalist reported in July 2024 that OrCam shut its glasses-development activity for the visually impaired, executed its third layoff round of the year, and shifted focus toward Hear because rapid progress in generative AI and smartphone-based image processing had eroded the need for further low vision-product development. Globes’ March 2025 reporting went further, describing an investor dispute that stalled a recovery financing, a revenue drop from roughly $45-50 million in 2023 to $16 million in 2024, and a plan to split the business and raise emergency capital. Those reports do not prove the consumer vision business disappeared; official pages still market MyEye and Read aggressively. But they do prove that later chapters must treat smartphone substitution, capital-structure stress, and strategy instability as core diligence issues rather than hypothetical risks. The
    main unresolved questions are current headcount, the real status of the 2024 convertible event, precise current revenue, and whether the company is again stabilizing around a narrower product set.
  claimRefs:
