company:
  name: OrCam Technologies
chapter:
  number: 1
  title: Company Overview
  summary: 'OrCam Technologies is a Jerusalem-founded assistive-AI company built by Mobileye co-founders Amnon Shashua and Ziv Aviram, with a current portfolio spanning wearable vision devices, handheld reading tools, education products, and a newer hearing product. Official product pages still show a broad low-vision offering and global user base, but 2024-2025 Israeli business reporting paints a much more stressed picture: layoffs, a pivot toward Hear, investor disputes, and sharp disagreement over the company’s current scale and valuation. The reliable through-line is historical product credibility and a documented 2018 unicorn round, not a clean 2026 snapshot of financial health.'
sections:
- id: identity-and-product-scope
  title: Identity, headquarters, and product scope
  body: Official OrCam materials consistently describe the company as an assistive-technology specialist built around AI-enabled wearable and handheld products, not as a generic consumer-electronics brand. The about-us page frames OrCam as a global leader focused on low vision and learning challenges, while the home page and product pages show a current lineup that includes MyEye 3 Pro, MyEye 2 Pro, Read 5, Read 3, Read, Learn, and Hear. The strongest product facts cluster around the current flagship devices. MyEye 3 Pro remains the wearable personal assistant that reads text, recognizes faces, identifies products and money notes, and adds environment descriptions and a Smart Magnifier workflow. Read 3 is more clearly a reading platform than a general wearable, functioning as a handheld OCR reader, a screen-connected Smart Magnifier, and a stand-based stationary reader. FDA-report indexing also shows a U.S. ORCAM INC registration at a New York address, while Tracxn and Caplight both place
    the corporate center in Jerusalem. The most defensible operating picture is therefore a Jerusalem-rooted company with a meaningful U.S. commercial or regulatory footprint.
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO021
  - CO035
  - CO036
  - CO042
  figureRefs:
  - FO002
- id: founders-and-leadership
  title: Founders, leadership, and governance visibility
  body: The founder story is unusually easy to verify because both OrCam and independent reporting tie the company directly to Amnon Shashua and Ziv Aviram, the same duo behind Mobileye. The leadership page still presents Shashua as co-founder and chairman and Aviram as co-founder and director, while listing Elad Serfaty as chief executive officer, Shmuel Turgeman as chief financial officer, and Tzahi Israel as senior vice president of sales. Caplight adds extra operating roles around the newer Hear business, including Tal Rosenwein as CEO-Hear and Inbal Levy-March in operations. That combination suggests a company still anchored by its famous founders but no longer run only through them on a day-to-day basis. At the same time, public governance visibility remains thin. OrCam’s current website surfaces founders and core management, but not a robust board roster, committee structure, or a clean explanation of how authority is split across the vision, education, and hearing product lines.
    For diligence, the issue is not whether leadership exists; it is whether control and succession below the founders are sufficiently transparent.
  claimRefs:
  - CO001
  - CO010
  - CO011
  - CO012
  - CO040
  tableRefs:
  - TO002
- id: funding-history-and-valuation-visibility
  title: Funding history and valuation visibility
  body: OrCam’s historical capitalization is well supported up to the unicorn moment, but the current mark is not cleanly settled. Tracxn reconstructs a $15 million Series A in 2014, a $41 million 2017 round, and a $30.4 million February 2018 round led by Clal Insurance and Meitav, bringing disclosed funding to $86.4 million. Globes and The Times of Israel independently corroborate the 2018 round and the $1 billion pre-money valuation. More recent database views diverge. Seedtable speaks of four funding rounds, while Caplight reports total funding raised of $98.9 million, labels the most recent event as July 2024 convertible debt, and estimates valuation at $1.03 billion. That picture is directly challenged by Globes’ March 2025 reporting on a distressed recovery plan, which said internal estimates had pushed value down to roughly $150 million. The right takeaway is not that one number is certainly correct, but that OrCam’s 2018 unicorn status is historically verified whereas its current
    valuation and financing status are contested and should not be treated as settled without primary round documents.
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO032
  - CO034
