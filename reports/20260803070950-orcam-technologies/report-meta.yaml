companyProfile:
  summary: OrCam Technologies is a private Israeli assistive-technology company founded in 2010 by Amnon Shashua and Ziv Aviram. It built its reputation on wearable and handheld AI devices such as OrCam MyEye and OrCam Read that help blind or visually impaired users read text, recognize faces, and navigate visual information, and it later added OrCam Hear for hearing support. Public evidence shows a company with genuine productization, meaningful customer stories, and historic unicorn status, but also with intense substitution pressure from smartphone and platform AI, revenue contraction, layoffs, and recapitalization uncertainty.
  foundedDate: '2010-01-01'
  founders:
  - name: Amnon Shashua
    role: Co-founder
    background: Co-founded Mobileye and brought deep computer-vision and hardware credibility into OrCam’s original product vision.
  - name: Ziv Aviram
    role: Co-founder
    background: Co-founded Mobileye and helped shape OrCam’s commercialization and fundraising narrative through its growth years.
  foundingLocation: Jerusalem, Israel
  headquarters: Jerusalem, Israel
  productSummary: AI-powered assistive devices including OrCam MyEye wearable vision aids, OrCam Read handheld reading aids, and OrCam Hear hearing-support hardware with companion app surfaces.
  customerFocus: Blind and visually impaired individuals, funded veteran-access channels, schools and learning-support environments, and adjacent accessibility buyers.
  businessModel: Primarily hardware sales with high-touch support, channel/funded-access reliance, and some app or service layers rather than a clearly disclosed recurring-software model.
  stage: Late-stage private / special situation
  fundingStatus: Historic priced rounds culminated in a 2018 unicorn milestone, but current public sources conflict between a current-looking ~$1.03B estimate and a severe 2025 valuation-reset narrative.
