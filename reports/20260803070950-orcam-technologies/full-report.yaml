      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The user is usually the blind or low-vision individual, but the buyer is often someone else. OrCam’s own
              channels suggest at least four recurring buying paths. First is direct consumer purchase, supported by
              reseller and online-store behavior. Second is institutionally influenced personal purchase, where
              families, rehab specialists, or teachers help justify a device for daily reading or school use. Third is
              school procurement, where the user is a student but the economic buyer may be a school, district, or
              special-needs program; OrCam Learn for Schools makes this explicit by emphasizing teacher analytics and
              progress monitoring. Fourth is benefit-funded or public-pathway acquisition, especially veterans with VA
              coverage. In those cases, the user remains the visually impaired individual but the payer may be a public
              program. The broader market therefore spans personal-use, healthcare-adjacent, and educational budgets.
              That is attractive because it creates multiple routes to adoption, but it also lengthens sales cycles,
              increases the importance of training and proof-of-outcome, and means OrCam is not selling into a single
              homogeneous checkout moment.
            claimRefs:
              - CM011
              - CM015
              - CM025
              - CM026
              - CM027
              - CM028
              - CM037
