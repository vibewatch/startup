      - number: '6.5'
        title: Customer verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The customer evidence clears the threshold of reality but not of transparency. OrCam clearly serves real
              blind, low-vision, and reading-support users; it has proof in veterans channels and schools; and it shows
              enough post-sale and testimonial activity to reject the idea that the company is purely conceptual. At the
              same time, almost every scaling question remains open: how many active users, what share self-pay versus
              funded, which segments expand, how concentrated channel revenue is, and how many customers upgrade or
              churn. For a diligence process, management would need to provide segment-by-segment unit shipments, active
              devices, funded-versus-self-pay mix, top-partner concentration, upgrade rates, and customer-support
              intensity. Until then, the best-supported position is that OrCam has authentic customer proof and several
              viable niches, but no public evidence yet robust enough to prove durable, diversified customer economics.
