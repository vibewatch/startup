  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and monetization mix
        blocks:
          - type: paragraph
            body: >-
              The visible revenue model is still predominantly hardware-led. OrCam publicly sells MyEye and Read
              devices, distributes them through partner channels, and supports them with a companion app rather than a
              standalone paid software layer. MyEye 3 Pro is listed at $4,250 and Read 3 starts at $2,790, which means
              the company is not trying to win with low-ticket volume. Instead it appears to depend on premium-device
              economics supported by buyer segments that can tolerate training and procurement friction. Public pages
              also show at least two adjacent monetization paths. First, OrCam Learn for schools is framed as a solution
              for students and educators with analytics, suggesting an institutional budget line rather than a pure
              consumer sale. Second, OrCam Hear is described in adverse reporting as entering marketing and sales, which
              suggests future diversification but not a mature current revenue base. Caplight classifies the business as
              a mix of hardware sales, subscription SaaS, and services and consulting, but public official evidence
              strongly supports hardware first and only partially supports recurring or service-heavy revenue.
