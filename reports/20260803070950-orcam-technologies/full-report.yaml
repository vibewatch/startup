      - number: '4.4'
        title: Capital adequacy and distress signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public signals concern capital stress rather than operating leverage. Tracxn reports $86.4
              million of total funding across three rounds, while Caplight shows $98.9 million and a July 2024
              convertible-debt event, and Seedtable models four funding rounds but only exposes limited detail. Those
              differences already tell a diligence story: even basic funding history is not perfectly settled in public
              sources. The more consequential evidence comes from adverse reporting. Calcalist wrote that layoffs in
              2024 followed a decision to stop further development of low-vision products because smartphone-based AI
              alternatives had made them economically redundant. Globes later reported that 2024 revenue fell to about
              $16 million from $45-50 million in 2023, that the founders and allies had initiated a $12.5 million
              financing round with roughly $7 million from Shashua, and that the company still needed another $12-15
              million. Just as important, Globes said a proposed $2 million loan would keep the company afloat only for
              a month or two. Taken together, the public picture is of a company with meaningful historical funding but
              very thin recent runway, contested rescue financing, and a business model under pressure from substitute
              technology.
