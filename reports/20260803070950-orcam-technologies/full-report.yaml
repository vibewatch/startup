      - number: '7.4'
        title: Partner and dependency risks
        blocks:
          - type: paragraph
            body: >-
              OrCam depends on several external systems it does not fully control. Veterans pathways, blinded-veteran
              associations, school demos, distributors, app stores, smartphone platforms, and possibly broader capital
              providers all appear in the public operating picture. Hear is visibly iPhone-dependent in its current
              public app form, while Google and Apple are simultaneously moving eyewear and accessibility further into
              their own platforms. That creates a partner paradox: the very platforms that help distribute some of
              OrCam’s software surfaces are also building substitute capabilities. Distributor and funded-channel
              reliance adds another layer of fragility because those routes can slow, narrow, or reprioritize demand.
              Where partner leverage is strongest, OrCam must either own the workflow so deeply that substitution is
              hard, or diversify channels faster than platform competition intensifies.
            claimRefs:
              - CR024
              - CR025
              - CR026
              - CR027
