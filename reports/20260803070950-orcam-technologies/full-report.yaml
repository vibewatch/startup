      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The main risk mitigants are conceptually visible even if not yet fully proven. OrCam can still lean on
              funded access routes, workflow-specific ergonomics, premium support, and segmentation where dedicated
              hardware outperforms smartphone substitutes. But those mitigants need evidence. If management cannot prove
              sufficient runway, stable gross margin on core devices, durable funded-channel demand, and a credible
              product roadmap against Apple/Google/OpenAI-type entrants, the thesis weakens quickly. Clear kill criteria
              would include another sharp drop in reported revenue, failure to close rescue capital, loss of veteran or
              school channels, meaningful product-support deterioration, or further evidence that low-vision functions
              are being replaced by mainstream AI at much lower cost. Because public disclosure is partial, diligence
              should focus on monitorable thresholds rather than on broad optimism about assistive-technology growth.
            claimRefs:
