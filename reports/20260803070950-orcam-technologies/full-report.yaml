            body: >-
              OrCam’s go-to-market motion is more complex than a simple direct-to-consumer device sale. Public pages
              show authorized distribution, a direct buy-now surface, school-oriented selling for OrCam Learn, and VA
              coverage pathways for legally blind veterans. That mix matters because it implies long conversion cycles
              for at least part of the business, together with real onboarding and support obligations after the sale.
              The app-store listings reinforce this view: the companion app is free and includes Wi-Fi setup, device
              finding, settings control, and support contact flows, indicating that service and retention work continue
              after hardware shipment. These are financially relevant signals even though they are not full unit
              economics. They imply nontrivial post-sale support cost and some dependence on channel partners or payer
              qualification. At the same time, funded routes like VA coverage or school budgets can raise willingness to
              pay and reduce the personal out-of-pocket burden that otherwise makes the list price difficult for many
