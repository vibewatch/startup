      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually easy to verify because both OrCam and independent reporting tie the company
              directly to Amnon Shashua and Ziv Aviram, the same duo behind Mobileye. The leadership page still presents
              Shashua as co-founder and chairman and Aviram as co-founder and director, while listing Elad Serfaty as
              chief executive officer, Shmuel Turgeman as chief financial officer, and Tzahi Israel as senior vice
              president of sales. Caplight adds extra operating roles around the newer Hear business, including Tal
              Rosenwein as CEO-Hear and Inbal Levy-March in operations. That combination suggests a company still
              anchored by its famous founders but no longer run only through them on a day-to-day basis. At the same
              time, public governance visibility remains thin. OrCam’s current website surfaces founders and core
              management, but not a robust board roster, committee structure, or a clean explanation of how authority is
              split across the vision, education, and hearing product lines. For diligence, the issue is not whether
              leadership exists; it is whether control and succession below the founders are sufficiently transparent.
