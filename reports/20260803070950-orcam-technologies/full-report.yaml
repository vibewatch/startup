  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape is best understood by class rather than by a flat vendor list. First are direct
              dedicated-device peers: Envision Glasses, eSight Go, IrisVision Vista, and HumanWare’s smart reader family
              all sell hardware explicitly for blind or low-vision users. Second are human-assistance or service
              substitutes such as Aira and Be My Eyes, which solve many of the same daily jobs without selling the user
              a premium reading device. Third are platform-level substitutes led by Apple and Microsoft, where
              accessibility features ride on top of already-owned smartphones or computers. Fourth are status-quo
              supports such as white canes and orientation-and-mobility instruction, which do not try to replace vision
              with AI but remain essential independence tools and therefore compete for time, attention, and some
              budget. OrCam still belongs in the direct-device class because MyEye and Read remain specialized hardware.
              But market evidence from the last two chapters makes clear that the strategic battle is increasingly
              against the substitute classes, not just against one more smart-glasses startup.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
