chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and product scope
        blocks:
          - type: paragraph
            body: >-
              Official OrCam materials consistently describe the company as an assistive-technology specialist built
              around AI-enabled wearable and handheld products, not as a generic consumer-electronics brand. The
              about-us page frames OrCam as a global leader focused on low vision and learning challenges, while the
              home page and product pages show a current lineup that includes MyEye 3 Pro, MyEye 2 Pro, Read 5, Read 3,
              Read, Learn, and Hear. The strongest product facts cluster around the current flagship devices. MyEye 3
              Pro remains the wearable personal assistant that reads text, recognizes faces, identifies products and
              money notes, and adds environment descriptions and a Smart Magnifier workflow. Read 3 is more clearly a
              reading platform than a general wearable, functioning as a handheld OCR reader, a screen-connected Smart
              Magnifier, and a stand-based stationary reader. FDA-report indexing also shows a U.S. ORCAM INC
              registration at a New York address, while Tracxn and Caplight both place the corporate center in
              Jerusalem. The most defensible operating picture is therefore a Jerusalem-rooted company with a meaningful
              U.S. commercial or regulatory footprint.
