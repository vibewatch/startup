      - number: '2.2'
        title: Sizing lenses and why multiple denominators matter
        blocks:
          - type: paragraph
            body: >-
              Public market sizing works only if the denominators are separated. WHO’s vision-impairment fact sheet
              shows the top-of-funnel need base is enormous: at least 2.2 billion people have near or distance vision
              impairment, with at least 1 billion cases preventable or unaddressed. WHO’s assistive-technology fact
              sheet broadens the problem further, saying more than 2.5 billion people need one or more assistive
              products today, rising to 3.5 billion by 2050. Those figures describe need, not OrCam’s practical SAM. The
              commercial category lens is much smaller. TBRC says the low-vision assistive-devices market reached $1.23
              billion in 2025 and $1.34 billion in 2026 and may grow to $1.89 billion by 2030 at about 9% CAGR; Research
              and Markets presents the same 2026 and 2030 values. A much wider adjacent lens comes from AI-enabled
              medical devices, where TBRC and Grand View Research point to multi-billion-dollar markets growing far
              faster. That lens is strategically relevant for component and technology tailwinds, but it is too broad to
              underwrite OrCam’s current revenue opportunity on its own.
