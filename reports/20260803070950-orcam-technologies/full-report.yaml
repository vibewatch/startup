              - CR024
              - CR031
      - number: '7.2'
        title: Technology substitution and model-displacement risks
        blocks:
          - type: paragraph
            body: >-
              Technology substitution is the clearest thesis risk. Calcalist reported directly that language-model
              advances made further low-vision development unnecessary, while Globes reported that competition from AI
              companies was one of the two blows driving the recovery plan. The substitute set is no longer abstract:
              OpenAI’s work with Be My Eyes, Apple’s accessibility stack, Microsoft Seeing AI, and Google’s announced
              intelligent eyewear all point toward mainstream actors embedding vision and hearing assistance into
              general platforms. That does not prove those products beat OrCam in every workflow. It does prove that
              assistive perception is no longer a protected feature set. OrCam’s defense is packaging, ergonomics,
              funded channels, and mission fit. If those do not outweigh generic model progress, the company faces
              margin compression, demand erosion, and reduced justification for dedicated-device R&D.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Capital, operational, and people risks
        blocks:
          - type: paragraph
            body: >-
              Operational and financial risks are tightly coupled. A hardware accessibility business already carries
              inventory, support, warranty, and channel complexity. When revenue contracts sharply, those burdens become
              harder to fund. Public reporting indicates three rounds of layoffs in 2024, a freeze in some Arab-country
              demand, and a rescue-financing process that was still contested in 2025. Those facts raise people and
              execution risk immediately: a smaller workforce may struggle to support multiple product lines, maintain
              quality, and continue innovation fast enough to match platform competitors. Hardware and app combinations
              also create reliability risk across manufacturing, distribution, onboarding, and software updates, yet the
              public record does not expose incident rates or failure metrics. The operating question is therefore not
              whether OrCam can ship products at all; it is whether it can sustain product quality, channel
              responsiveness, and capital discipline under visible stress.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
