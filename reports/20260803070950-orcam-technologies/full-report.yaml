  - id: FV001
    title: Recommendation logic
    type: flow
    description: Decision path from real product proof through price conflict and diligence gates to the current recommendation.
    data:
      nodes:
        - id: proof
          label: Real company proof
          detail: Read, MyEye, Hear, funded channels, and founder pedigree support non-zero value
        - id: conflict
          label: Price conflict
          detail: Caplight ~$1.03B versus adverse 2025 ~$150M fair-value estimate
        - id: price
          label: Current signed price known?
          detail: Fresh priced-round or audited secondary transaction available
        - id: economics
          label: Revenue and preference stack known?
          detail: Run-rate, gross margin, and dilution overhang resolved
        - id: premium
          label: Premium mark justified?
          detail: Evidence supports paying near legacy unicorn levels
        - id: research
          label: RESEARCH-MORE / TRACK
          detail: Default current stance while price conflict remains unresolved
        - id: avoid
          label: AVOID LEGACY PRICE
          detail: If current round evidence is absent or economics stay weak
        - id: conditional
          label: CONDITIONAL SPECIAL-SITUATION BUY
          detail: Only if reset or structure creates asymmetric upside
      edges:
        - from: proof
          to: conflict
          label: still need price
        - from: conflict
          to: price
          label: resolve conflict
        - from: price
          to: research
          label: 'NO'
        - from: price
          to: economics
          label: 'YES'
        - from: economics
          to: research
          label: 'NO'
        - from: economics
          to: premium
          label: 'YES'
        - from: premium
          to: avoid
          label: 'NO'
        - from: premium
          to: conditional
          label: 'YES'
    claimRefs:
