  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              OrCam deserves a diligence discussion, but not a blind premium entry. The company still has real assistive
              products, real customer stories, and a founder lineage that once supported serious public-market ambition.
              That keeps it out of the “broken concept” bucket. The problem is that public evidence on price has
              diverged violently from public evidence on operating stress. Caplight still shows an estimated valuation
              of about $1.03 billion and a July 2024 convertible-debt round, but the strongest adverse reporting says
              revenue fell to roughly $16 million in 2024, additional rescue money was still needed, and institutional
              investors were effectively negotiating around a fair-value reset. In that context, the right investment
              stance is not “yes” or “no” in the abstract; it is “only if the price resets or the evidence improves.” I
              would not underwrite new money at a legacy unicorn narrative today. I would track the company, demand
              direct cap-table and revenue proof, and only engage if current terms create enough upside to compensate
              for the high residual risk.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV028
              - CV029
              - CV030
              - CV031
