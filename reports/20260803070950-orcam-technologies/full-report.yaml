  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define OrCam’s market is to start narrow and then expand outward. At the core sits the
              low-vision assistive-device category: reading devices, magnifiers, wearables, screen readers, and other
              tools that help users extract visual information they cannot reliably access unaided. The Business
              Research Company and Research and Markets both frame the category this way and explicitly include reading
              devices, wearable devices, and electronic magnifiers. Around that core is a broader assistive-technology
              envelope, where WHO includes products such as white canes, hearing aids, speech recognition, and
              captioning. OrCam clearly touches that broader space because it sells vision devices, education tools, and
              a hearing product, but it does not compete for the full assistive-technology TAM. It also does not cleanly
              belong inside the entire AI-medical-device market, which includes hospital software, imaging, and clinical
              monitoring systems far from OrCam’s consumer or rehab workflow. Finally, status-quo alternatives matter.
              White canes, orientation-and-mobility training, volunteers, and mobile apps solve many of the same daily
              jobs without requiring a $3,000-$4,000 dedicated device purchase.
