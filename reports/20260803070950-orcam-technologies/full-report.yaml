      - number: '5.4'
        title: Differentiation, know-how, and technical moat
        blocks:
          - type: paragraph
            body: >-
              OrCam’s technical differentiation is not best understood as secret model architecture; it is best
              understood as assistive productization. The company has repeatedly taken computer-vision or speech
              separation capabilities and embedded them in constrained hardware, intuitive controls, and targeted
              assistive workflows. That includes laser-guided capture and offline reading on Read, multi-modal control
              on MyEye, teacher-analytics framing for Learn, and speaker-selection UI for Hear. External coverage from
              CES 2024 also suggests that OrCam can still generate genuine product interest when it packages a hard
              problem, such as selective hearing in noise, into a clear demonstration. The moat risk is that many
              underlying enabling technologies—OCR, summarization, scene description, language interaction, even some
              voice isolation—are becoming more widely available on general-purpose platforms. OrCam’s defense is
              therefore workflow-specific packaging, ergonomics, and domain focus rather than obvious public proof of a
              closed technical platform or uniquely disclosed IP moat.
