      - number: '1.4'
        title: Scale signals, channel structure, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The public evidence on present-day scale is directionally useful but internally inconsistent. Official
              pages say OrCam serves users across 50 countries and 25 languages and improves life for tens of thousands
              of people worldwide. The Google Play and App Store listings confirm an active companion app used to
              control settings, connect devices to Wi-Fi, and reach support, which suggests ongoing product maintenance
              rather than a fully abandoned installed base. Channel evidence also matters: GetOrCam markets itself as an
              authorized worldwide distributor, and both the Blinded Veterans Association page and OrCam’s own
              veterans-benefits content suggest VA-funded procurement pathways for qualifying users. Education is a
              second channel, not a side note: OrCam Learn for Schools explicitly targets educators, tracking student
              progress and citing school and therapist testimonials. But public scale numbers conflict badly on
              headcount. Tracxn and Caplight list 171-172 employees in 2026, while Israeli reporting after multiple 2024
              layoffs suggested only several dozen to fewer than 100 employees remained. That gap is too large to
              ignore, so headcount should be treated as disputed rather than precise.
