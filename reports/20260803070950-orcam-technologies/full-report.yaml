      - number: '6.4'
        title: Retention, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Retention and concentration are the least transparent parts of the customer story. Public testimonials
              strongly imply satisfaction and repeat use, but they do not reveal renewal rates, repeat purchase, device
              upgrade cycles, or cohort churn. Product family breadth does create plausible expansion loops: a veteran
              or visually impaired user might start with MyEye or Read and later use app-connected features; a school
              might move from an individual assistive purchase to a broader Learn deployment; and families may purchase
              add-on or replacement devices as needs evolve. But the public record also suggests concentration risk. VA
              coverage, blinded-veteran partnerships, specialist distributors, and school demos all point to channel
              dependence. Adverse reporting that Arab-country purchases were frozen during wartime further shows that
              important demand pockets can be disrupted by geopolitical or channel-specific events. The proper
              conclusion is not that the customer base is concentrated beyond repair, but that its durability cannot be
              underwritten without segment-level revenue and retention data.
