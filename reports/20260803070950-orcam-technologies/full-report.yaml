      - number: '8.2'
        title: What current public marks actually confirm
        blocks:
          - type: paragraph
            body: >-
              The public valuation trail is less coherent than it first appears. Tracxn and the 2018 Times of Israel
              coverage both support the existence of a $1 billion milestone around the Series B era, while Seedtable
              reinforces that the last clearly priced round in its retained profile dates back to February 2018.
              Caplight is different: it presents a much later estimated valuation of $1.03 billion, a July 2024
              convertible-debt round, and total funding raised of $98.9 million. Those data points are useful, but they
              do not by themselves prove a clean late-stage priced equity round at that valuation. Against them sits the
              most damaging independent evidence in the set: Globes reported a 2025 dispute over the recovery plan, a
              fall in revenue from roughly $45-50 million in 2023 to $16 million in 2024, and an estimate that fair
              value had fallen by more than 90% to about $150 million. The conclusion is not that one source must be
              perfectly right and the others wrong. It is that public investors are looking at two incompatible stories:
              a vendor-estimated unicorn and a distressed recap candidate. Until management resolves that gap with
              current signed terms and current revenue quality, price remains the core diligence problem.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV032
          - type: table
