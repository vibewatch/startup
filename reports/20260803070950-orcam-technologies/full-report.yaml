      - number: '4.3'
        title: Cost structure, capital intensity, and unit economics visibility
        blocks:
          - type: paragraph
            body: >-
              Because OrCam sells purpose-built assistive hardware rather than pure software, its cost structure almost
              certainly includes BOM, assembly, quality control, distribution margin, returns, training, and customer
              support. The public record proves some of these elements indirectly. Device support is active on mobile
              apps and release-note surfaces; training and orientation show up in veteran and school narratives; and the
              company’s products span wearable, handheld, and educational form factors, which likely increases inventory
              and support complexity. What the public record does not reveal is just as important: realized ASP,
              distributor discounting, gross margin, CAC, payback, warranty cost, return rate, and inventory
              obsolescence are all unavailable. That means hardware price should not be mistaken for hardware margin. In
              fact, adverse reporting suggests margin pressure may be severe because free or cheap AI substitutes have
              damaged the economic case for continued investment in low-vision product development. The result is a
              financial profile that looks inherently more capital intensive and less observable than a software
              accessibility product, with public evidence insufficient to underwrite efficient growth.
