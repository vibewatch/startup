      - number: '8.4'
        title: Comparable anchors and exit options
        blocks:
          - type: paragraph
            body: >-
              The comparable set argues for discipline. Mobileye, a founder-adjacent Israeli computer-vision success
              story, had roughly $1.7 billion of 2024 revenue and an August 2026 market cap around $6.77 billion, which
              is a far larger platform than OrCam today. Sight Sciences, a much smaller public eye-care technology
              company, sits closer to the scale question that matters for OrCam and is valued at only about $0.28
              billion against $77.4 million of 2025 revenue. Glaukos is the premium public ophthalmic growth comp, but
              its nearly $9.83 billion market cap is attached to a regulated ophthalmic platform with approximately
              $383.5 million of net sales, not to a distressed niche hardware company. Sonova provides the opposite
              reminder: scaled assistive-device incumbents can be worth a great deal, but only after they have achieved
              global distribution, strong financials, and billions of sales. Exit logic therefore tilts strategic before
              IPO. Intel’s $15.3 billion 2017 agreement to acquire Mobileye shows that strategic buyers will pay for
              category-leading computer-vision assets, but OrCam’s present public scale does not justify treating that
              precedent as a base case. If OrCam exits well from here, the more credible path is a strategic transaction
              or structured financing linked to specific product assets, not a near-term standalone IPO.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV021
              - CV022
              - CV023
              - CV024
              - CV041
              - CV043
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
              - CV017
              - CV018
              - CV020
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The missing evidence is unusually specific. First, what is the current price? Not a vendor estimate, not a
              stale 2018 round, and not a press estimate of distress—actual signed current terms. Second, what revenue
              should investors underwrite: the 2024 trough, a stabilized 2025 run-rate, or a split-company forward plan
              that changes the revenue base entirely? Third, what sits above common equity in a rescue scenario:
              anti-dilution demands, loans, convertible instruments, liquidation preferences, or product-level sale
              rights? These are not cleanup questions. They determine whether a seemingly attractive reset is actually
              investable. The cleanest thesis-break triggers are equally concrete: a financing that validates a deep
              value reset, another sharp workforce reduction, further evidence that mainstream AI fully replaces core
              low-vision workflows, or loss of funded access channels that currently support demand. The positive
              triggers are just as clear: a transparently priced new round, evidence that revenue has stabilized, proof
              that Hear can scale without burning excessive capital, and a cleaner cap structure. Until then, OrCam
              belongs in the watchlist / special-situations bucket, not in the standard growth-equity bucket.
            claimRefs:
              - CV024
              - CV028
              - CV029
              - CV030
              - CV032
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV024
              - CV029
              - CV030
              - CV032
              - CV039
              - CV040
              - CV041
              - CV042
