      - number: '3.4'
        title: Switching costs, lock-in, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching costs are meaningful but not absolute. OrCam users who have learned its gestures, device
              workflows, and accessories face real habit and training costs. Dedicated devices also create attachment
              when they are funded through a school, a veterans program, or a specialist distributor rather than bought
              casually online. But much of the market still appears multi-homing-friendly: a user can own an OrCam
              device and still rely on Seeing AI, Be My Eyes, a white cane, or Aira for different tasks. In that sense,
              the battle is less about hard lock-in and more about share of daily-use moments. Distribution power also
              differs sharply by class. Aira and Be My Eyes benefit from app-store scale and institutional access
              partnerships; Apple and Microsoft ride default platform distribution; Envision, eSight, IrisVision,
              HumanWare, and OrCam rely more on specialist sales, demos, referrals, and training channels. OrCam’s U.S.
              distributor and veterans evidence is therefore strategically important: it helps the company fight a
              distribution war it cannot win through consumer-platform reach alone.
