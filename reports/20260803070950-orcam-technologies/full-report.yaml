  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              Public legal and regulatory signals are mixed rather than binary. On the positive side, OrCam exposes
              formal terms of use, product terms and conditions, a privacy statement hub, a cookies policy, an
              accessibility statement, and an FDA-report registration footprint. That suggests a company that has at
              least built a legal shell around its commerce and public support surfaces. On the negative side, these
              public materials do not clearly resolve product-specific classification, device-family regulatory status,
              or incident governance in the same way some adjacent accessibility tools do. OrCam’s terms explicitly
              state that the company is not a medical organization and that the website is not designed to provide
              diagnosis or medical advice, which helps define scope but also highlights legal sensitivity around how
              users interpret the product. The accessibility statement further shows intent to meet WCAG/Section 508
              standards, but an intent statement is not a full product-compliance audit. The legal verdict is thus
              manageable but under-disclosed: there is enough structure to reduce obvious negligence risk, but not
              enough product-level detail to dismiss regulatory or privacy diligence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
