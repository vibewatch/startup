  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by user, buyer, and payer
        blocks:
          - type: paragraph
            body: >-
              OrCam’s customer map is multi-sided. The end user is often a blind, low-vision, or reading-challenged
              individual, but the buyer and payer vary by segment. Retail-style commerce pages suggest direct or
              family-supported purchases for MyEye and Read devices, especially where installment plans and 30-day
              guarantees are emphasized. Veterans surfaces point to a distinct payer structure in which VA-linked
              funding or blinded-veteran associations can offset or fully cover device cost. Learn pages reveal a third
              structure in which teachers, schools, occupational therapists, and families participate in the purchase or
              deployment decision. These school-facing materials also suggest that the person benefiting from the
              product is rarely the sole decision-maker. The result is not one uniform customer base but a portfolio of
              segments with very different procurement friction, affordability, and proof requirements. That customer
              diversity is strategically positive, but it also makes OrCam more dependent on channel execution and
              advocacy than a purely self-serve accessibility app would be.
            claimRefs:
