      - number: '3.5'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              OrCam’s moat is real but fragile. The durable part is the integration of purpose-built assistive hardware,
              low-vision user experience, training channels, and daily-living features such as recognition, reading, and
              magnification. The fragile part is that many of these features are being unbundled into free or subsidized
              software layers. The Apple and Seeing AI materials are especially notable because they bring high-quality
              accessibility into devices users may already own. Be My Eyes and Aira show that human or AI support can be
              layered into the user’s existing camera phone, and eSight or IrisVision show that low-vision enhancement
              specialists can attack residual-vision cohorts directly. Even dedicated device peers now offer coaches, VA
              pathways, and companion-calling features that reduce OrCam’s channel and support differentiation. The
              result is not commodity status yet. OrCam can still win where a self-contained device outperforms apps on
              speed, privacy, ergonomics, and funded access. But the moat will not hold on brand alone; it depends on
              proving that this integration genuinely produces better outcomes than the increasingly crowded substitute
              stack.
