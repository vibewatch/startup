  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product lines defined by user workflow
        blocks:
          - type: paragraph
            body: >-
              OrCam’s product map is best described by user job rather than by SKU list alone. MyEye is the wearable job
              engine for blind or visually impaired users who need real-time reading, recognition, and scene description
              while moving through daily life. Read and Read 3 serve the document-access workflow for people with vision
              loss, reading fatigue, or learning difficulty who want text read aloud, summarized, magnified, or
              navigated by command. Learn extends that workflow into school settings with reading practice,
              comprehension prompts, and teacher-facing analytics. Hear is a separate audio-attention product for noisy
              conversational environments rather than a vision device. That matters strategically because OrCam is not
              merely shipping one gadget; it is trying to turn a family of assistive workflows into specialized hardware
              and app experiences. The technical strength of that approach is packaging. The technical weakness is that
              every product family now competes against increasingly capable general-purpose AI systems.
