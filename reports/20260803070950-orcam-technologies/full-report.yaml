            body: >-
              The public adoption trail is mostly composed of soft operational signals rather than hard customer counts.
              OrCam keeps multiple live product, testimonial, demo, support, and store surfaces up, which suggests an
              active installed base worth serving. Financing plans, free shipping, a one-year warranty, and a 30-day
              guarantee indicate that the company still expects individual purchasing friction and seeks to reduce it.
              School-contact pages explicitly ask prospects to leave information for a personal demo, which is
              consistent with a consultative sales motion rather than a pure click-to-buy education funnel. The apps
              also reveal ongoing support surfaces and mobile control layers for devices already in the field. What is
              absent is denominator math: no public active-device count, shipped-unit number, demo-to-close rate, or
