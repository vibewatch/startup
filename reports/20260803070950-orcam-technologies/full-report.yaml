      - number: '5.5'
        title: Trust, safety, quality, and compliance posture
        blocks:
          - type: paragraph
            body: >-
              OrCam’s public trust posture is mixed. The positive side is clear evidence of manuals, onboarding content,
              device apps, support surfaces, and an FDA-report commercial registration footprint. Those are not proof of
              superior safety, but they do show a structured effort to support users of assistive hardware. The weaker
              side is the relative thinness of public compliance detail. Compared with Microsoft’s Seeing AI
              manual—which explicitly states intended purpose, contraindications, and MDR classification—OrCam’s
              readable public materials reveal much less structured safety and regulatory disclosure. App-store data
              disclosures are basic, and public extracts do not expose security architecture, formal quality-system
              claims, incident handling, or certification scope for each device family. This does not prove a quality
              failure. It does mean diligence should treat trust and compliance as under-disclosed technical domains
              rather than as resolved strengths.
