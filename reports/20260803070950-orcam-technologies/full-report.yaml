      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The public architecture is concrete enough to see the system pattern even if it is not disclosed at
              engineering-diagram level. MyEye and Read products combine sensing hardware, edge interaction, and audio
              output around assistive reading and recognition. Read 3 exposes some of this most clearly: a 13MP camera,
              700 mAh battery, BLE and Wi-Fi connectivity, handheld and stand-based modes, smart magnifier controls, and
              AI-assisted interaction. MyEye’s manual and product surfaces show a gesture, touch-bar, and voice-command
              interaction model for reading, face recognition, product identification, banknotes, colors, and
              personalization. Hear uses a different stack built from TWS earbuds, a smartphone dongle, low-latency
              Bluetooth, and an iPhone app that runs speaker-separation controls. Across these products, the unifying
              operating model is assistive AI delivered through highly constrained interfaces that reduce screen
              dependence. The missing layer is how much inference runs on device versus phone or cloud in each mode;
              public materials reveal enough for workflow understanding, but not enough for a full technical audit.
