            body: >-
              Public customer evidence is much more tangible at the named-deployment level than at the portfolio level.
              OrCam’s veteran materials and blog stories identify real users such as Scotty Smiley and describe device
              usage in rehabilitative daily living. Read 3 testimonials name Ashley Mizell and make the device’s role in
              reading to children and navigating blindness concrete. Learn materials surface named adults and
              organizations, including Michelle Catterson at Moon Hall School, Charisa Cheek at Cooperative Educational
              Services Agency #5 in Wisconsin, and Dr. Helen Ross as an independent researcher and British Dyslexia
              Association leader. These references matter because they show use in schools, home learning, and
              rehabilitation settings rather than only in generic marketing copy. The weakness is that these stories
              mostly prove relevance, not scaled commercial penetration. We know more about how several users benefited
              than about how many customers remain active today, what portion came through funded programs, or how many
