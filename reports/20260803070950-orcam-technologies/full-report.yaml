      - number: '1.3'
        title: Funding history and valuation visibility
        blocks:
          - type: paragraph
            body: >-
              OrCam’s historical capitalization is well supported up to the unicorn moment, but the current mark is not
              cleanly settled. Tracxn reconstructs a $15 million Series A in 2014, a $41 million 2017 round, and a $30.4
              million February 2018 round led by Clal Insurance and Meitav, bringing disclosed funding to $86.4 million.
              Globes and The Times of Israel independently corroborate the 2018 round and the $1 billion pre-money
              valuation. More recent database views diverge. Seedtable speaks of four funding rounds, while Caplight
              reports total funding raised of $98.9 million, labels the most recent event as July 2024 convertible debt,
              and estimates valuation at $1.03 billion. That picture is directly challenged by Globes’ March 2025
              reporting on a distressed recovery plan, which said internal estimates had pushed value down to roughly
              $150 million. The right takeaway is not that one number is certainly correct, but that OrCam’s 2018
              unicorn status is historically verified whereas its current valuation and financing status are contested
              and should not be treated as settled without primary round documents.
