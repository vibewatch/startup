        - CFO package + board materials
      - - Gross margin and support burden
        - Margin by device line, warranty costs, training/support expense
        - Dedicated hardware can look attractive on revenue but weak on contribution margin
        - Finance + operations review
      - - Hear traction
        - Pipeline, paid conversions, retention, and sales efficiency for hearing product
        - Bull case depends on Hear becoming more than a concept offset to vision decline
        - Product + sales diligence
      - - Strategic interest
        - Any live buyer, partner, or structured-financing process by asset line
        - Strategic optionality could justify value above pure public-comp math
        - Board / banker discussions
      - - Governance and recovery plan
        - Board-approved operating plan and investor alignment after 2025 dispute
        - Execution risk remains high if governance is still misaligned
        - Board minutes + financing documents
    claimRefs:
      - CV024
      - CV029
      - CV030
      - CV032
      - CV039
      - CV040
      - CV041
