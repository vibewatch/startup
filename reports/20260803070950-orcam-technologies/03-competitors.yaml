- id: direct-device-peers
  title: Direct device peers and feature overlap
  body: 'OrCam’s dedicated-device competitors overlap heavily on reading, visual description, and low-vision augmentation, but they do so through different architectures. Envision Glasses run on Google Glass Enterprise Edition 2 and emphasize hands-free text capture, scene description, object and people recognition, and live companion calling. eSight Go is less an AI narrator and more a digital vision-enhancement headset for central-vision loss, leaning on magnification, image stabilization, and a 45-degree field of view. IrisVision similarly targets low-vision enhancement through wearable magnified vision rather than text-first narration, while HumanWare’s smart-reader category stays closer to the document and image-description job. OrCam’s advantage versus these peers is breadth: MyEye and Read collect OCR, recognition, and AI assistant functions into one family. The tradeoff is focus. eSight and IrisVision appear more specialized for residual-vision enhancement, while Envision’s Google
    Glass base gives it a recognizable hands-free smart-glasses form factor. OrCam therefore wins when buyers want one device family for multiple blind and low-vision tasks, not when they want the most specialized tool for one narrow visual use case.'
