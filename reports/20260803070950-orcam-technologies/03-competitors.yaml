- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Purpose-built assistive hardware
    - Free smartphone accessibility apps replicate core reading and description tasks
    - High
    - Prove materially better speed, ergonomics, and outcome quality on daily workflows
  - - Broad feature family across wearable and handheld form factors
    - Specialists like eSight or IrisVision can win narrow visual-use cases with deeper optimization
    - Medium
    - Show conversion by user condition and task, not just by feature count
  - - Channel access via veterans, schools, and distributors
    - Platform players and app stores own far larger distribution reach
    - High
    - Quantify funded-channel conversion and retention where platforms cannot easily sell
  - - User familiarity and training
    - Multi-homing is easy; users can keep OrCam and still default to free apps for many tasks
    - Medium-high
    - Show frequency-of-use and task share after onboarding
  - - Brand and long product history
    - Competitor AI and platform features are improving quickly, compressing differentiation
    - High
    - Maintain rapid software cadence and disclose benchmark wins against substitutes
  - - Integrated support ecosystem
    - Peers also offer coaching, calls to trusted contacts, or human assistance networks
    - Medium
    - Clarify what support elements are unique, scalable, and margin-accretive
  notes: The key competitive question is not whether OrCam has a moat at all, but whether that moat still justifies premium hardware pricing as substitutes improve.
