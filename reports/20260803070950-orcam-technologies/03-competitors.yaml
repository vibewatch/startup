  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive churn and win rates
    missingEvidence: OrCam retention, replacement, and deal-win data against specific substitutes such as Seeing AI, Be My Eyes, and Envision.
    whyItMatters: Without head-to-head usage or churn data, moat durability must be inferred from features and channels rather than demonstrated commercially.
    diligencePath: Request competitive CRM notes, lost-deal analysis, churn reasons, and renewal retention by product.
    relatedQuestionRefs:
    - QP023
    - QP025
  - type: missing-source
    severity: material
    topic: realized competitor pricing
    missingEvidence: Current public price sheets for Envision, eSight, IrisVision, and HumanWare products that are comparable on an apples-to-apples basis.
    whyItMatters: Pricing power is central to OrCam’s relative value proposition, but most retained competitor sources did not disclose clean list prices.
    diligencePath: Collect dealer quotes, financing sheets, and trial-program terms from each competitor or distributor.
    relatedQuestionRefs:
    - QP017
  - type: private-evidence-only
    severity: material
    topic: task-level outcome superiority
    missingEvidence: Benchmark data comparing success rate, speed, and satisfaction on representative tasks across OrCam, phone apps, volunteer services, and peer devices.
    whyItMatters: Feature overlap alone does not prove which product actually delivers better daily outcomes for different user cohorts.
    diligencePath: Run controlled user-task studies or obtain internal usability benchmarks by cohort and task.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: channel-specific economics
    missingEvidence: Margin and conversion data for specialist distributors, VA pathways, school channels, and direct web sales.
    whyItMatters: Distribution strength is part of the moat, but public sources reveal channel existence rather than economic quality.
    diligencePath: Request channel P&Ls, demo-to-sale conversion, and support burden by route to market.
    relatedQuestionRefs:
    - QP022
