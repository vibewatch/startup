  - Limitation
  rows:
  - - OrCam
    - Dedicated device family
    - Private; disputed valuation; premium device pricing visible
    - Blind, low-vision, reading-fatigue, school, veterans channels
    - Broad mix of OCR, recognition, wearable and handheld options
    - Premium hardware price and substitute pressure from apps
  - - Envision Glasses
    - Dedicated smart glasses
    - Private scale not disclosed in retained sources
    - Blind and low-vision users wanting hands-free smart glasses
    - Rich hands-free feature stack on Google Glass hardware
    - Pricing and broad commercial scale not visible in retained evidence
  - - eSight Go
    - Dedicated low-vision headset
    - Low-vision specialist; TBRC notes Gentex acquired certain eSight assets in 2024
    - Users with significant central vision loss
    - Strong magnification and residual-vision enhancement orientation
    - Less clearly a general AI narrator or document assistant
  - - IrisVision Vista
    - Dedicated low-vision headset
    - Company claims 3,000+ people helped
    - Users with low vision who benefit from magnified wearable enhancement
    - Augmented-reality style vision enhancement plus coaching
    - Less evidence of broad non-visual task coverage than OrCam or Envision
  - - HumanWare Smart Reader
    - Reading-device incumbent
    - Established blindness and low-vision vendor; specific financial scale not disclosed here
    - Users focused on reading printed material and image description
    - Document-first reading utility from a known assistive-tech brand
    - Less evidence of broad scene or people-recognition coverage
  - - Aira
    - Human interpreting service substitute
    - Subscription-based service with access-location network
    - Blind or low-vision users who need human-guided visual interpreting
    - 24/7 trained interpreters plus AI image descriptions
    - Ongoing minute-based cost and dependence on live service
  - - Be My Eyes
    - Volunteer + AI substitute
    - 750k+ users and 8M+ volunteers
    - Blind or low-vision users needing free on-demand help
    - Free, global, AI + volunteer blend, broad service directory
    - No dedicated hardware and variable experience by use case
  - - Seeing AI / Apple
    - Platform substitute
    - Distributed through mobile ecosystems users may already own
    - Mainstream-device owners needing reading and scene-description tools
    - Free or bundled accessibility integrated into existing devices
    - Not purpose-built dedicated hardware; safety disclaimers limit some uses
  notes: Profile table mixes dedicated peers and substitutes because buyers compare jobs-to-be-done, not only corporate form factors.
