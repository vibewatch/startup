  rows:
  - - OrCam MyEye 3 Pro
    - $4,250 listed device price
    - Wearable reading, recognition, Smart Magnifier, AI assistant, accessories
    - Realized pricing and channel discounts unknown
    - Premium dedicated-device positioning requires funded access or clear superiority
  - - OrCam Read 3
    - Starts at $2,790
    - Handheld reading, Smart Magnifier, stationary reader mode
    - Actual regional pricing and financing unknown
    - Still materially above zero-cost app substitutes
  - - Aira
    - Subscription from $26/month to $1,160/month depending minutes
    - Live interpreters, access anywhere, AI descriptions, minute bundles
    - Many public spaces offer free access; usage is time-bound
