- id: software-and-service-substitutes
  title: Software and service substitutes are the biggest displacement threat
  body: 'The most dangerous competitors are not always the best dedicated devices; they are often the cheapest good-enough alternatives. Seeing AI is free, mobile, and increasingly comprehensive, covering documents, products, scenes, currency, colors, handwriting, and AI chat around scanned text. Be My Eyes adds scale that few private hardware companies can match: a free app, 150 countries, 180 languages, hundreds of thousands of users, millions of volunteers, and AI image description through Be My AI. Aira is more expensive than these app layers but offers a very different promise: professional visual interpreters, access locations, and subscription-based assistance anywhere. Apple pushes still deeper into the base operating system with Magnifier, Accessibility Reader, and Apple Intelligence-linked exploration features, which means many mainstream-device owners receive low-vision help without buying another hardware platform at all. These tools do not always replace OrCam, especially for
    users wanting hands-free or dedicated-device reliability. But they unquestionably compress the price umbrella for the daily reading and scene-description tasks that once made OrCam’s hardware more singular.'
