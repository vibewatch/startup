company:
  name: OrCam Technologies
chapter:
  number: 3
  title: Competitors
  summary: OrCam no longer competes in a niche it can own alone. Its most direct dedicated-device peers now include Envision, eSight, IrisVision, and text-reading hardware from HumanWare, while the largest substitute threat comes from free or low-cost software and service stacks such as Seeing AI, Be My Eyes, Aira, and Apple’s built-in accessibility tools. OrCam’s strongest differentiator is the combination of purpose-built hardware, on-device reading, and broad daily-living features in one product family; its weakest point is price discipline in a world where many core tasks are increasingly solved by smartphones, volunteers, or subscriptions. The competitive verdict is not that OrCam lacks differentiation, but that its moat is narrowing unless dedicated hardware materially outperforms these substitutes on reliability, hands-free usage, and funded-access channels.
sections:
- id: landscape-and-classes
  title: Landscape by competitor class
  body: 'The competitive landscape is best understood by class rather than by a flat vendor list. First are direct dedicated-device peers: Envision Glasses, eSight Go, IrisVision Vista, and HumanWare’s smart reader family all sell hardware explicitly for blind or low-vision users. Second are human-assistance or service substitutes such as Aira and Be My Eyes, which solve many of the same daily jobs without selling the user a premium reading device. Third are platform-level substitutes led by Apple and Microsoft, where accessibility features ride on top of already-owned smartphones or computers. Fourth are status-quo supports such as white canes and orientation-and-mobility instruction, which do not try to replace vision with AI but remain essential independence tools and therefore compete for time, attention, and some budget. OrCam still belongs in the direct-device class because MyEye and Read remain specialized hardware. But market evidence from the last two chapters makes clear that the
    strategic battle is increasingly against the substitute classes, not just against one more smart-glasses startup.'
