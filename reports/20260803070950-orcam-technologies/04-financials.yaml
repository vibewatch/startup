  - Why it matters
  - Diligence ask
  rows:
  - - Historical funding total
    - 'Conflicting: $86.4M (Tracxn) vs $98.9M (Caplight)'
    - Low-medium
    - Even basic financing chronology is not fully reconciled in public data
    - Reconcile total raised by round, instrument, and close date
  - - Latest financing status
    - 'Conflicting: Caplight shows Jul 2024 convertible debt; Seedtable shows last funding date Feb 2018; Globes describes 2024-2025 rescue financing efforts'
    - Low-medium
    - Determines seniority, dilution, and whether the company already bridged its runway
    - Provide cap table, note documents, and post-2024 financing ledger
  - - 2024 revenue
    - ~$16M per Globes
    - Medium
    - Shows post-crisis scale of the operating business
    - Provide audited or board-approved 2024 revenue by product
  - - 2023 revenue
    - ~$45-50M per Globes
    - Medium
    - Useful baseline for contraction analysis
    - Provide 2023 monthly revenue and mix by product/channel
  - - Immediate bridge capital
    - $2M loan would fund only one to two months per Globes
    - Medium
    - Implies thin runway and urgent cash need
    - Provide cash-on-hand and weekly cash forecast
  - - Additional capital need
    - $12-15M beyond founder-led round per Globes
    - Medium
    - Quantifies rescue financing dependency
    - Provide operating plan showing exact cash requirement and milestones
  - - Valuation condition
    - Globes estimates >90% decline to ~ $150M; Caplight still shows est. valuation $1.03B
    - Low
    - Signals severe uncertainty around solvency and dilution economics
    - Provide latest 409A / board valuation and any recap terms
  notes: Capital adequacy is where the public evidence is strongest and most adverse.
