  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash and burn
    missingEvidence: Current cash balance, monthly burn, and runway by board-approved plan.
    whyItMatters: Runway is the central underwriting question and cannot be solved from public list pricing or historical funding alone.
    diligencePath: Request latest cash report, trailing monthly burn, and weekly cash forecast.
    relatedQuestionRefs:
    - QI015
    - QI020
    - QI024
  - type: private-evidence-only
    severity: material
    topic: realized pricing and margin
    missingEvidence: Net ASP, discounts, COGS, gross margin, and returns by product and channel.
    whyItMatters: Premium device list prices do not establish attractive economics if discounting or support costs are heavy.
    diligencePath: Request channel-level invoices, gross-margin bridge, and warranty/return reserves.
    relatedQuestionRefs:
    - QI018
    - QI020
  - type: private-evidence-only
    severity: material
    topic: product-line revenue mix
    missingEvidence: Revenue contribution from MyEye, Read, Learn, Hear, and any services or subscriptions.
    whyItMatters: Without product mix, investors cannot judge whether profitable vision products still finance the transition to Hear.
    diligencePath: Request monthly revenue by product family and channel for 2023-2026 YTD.
    relatedQuestionRefs:
    - QI001
    - QI008
    - QI024
  - type: private-evidence-only
    severity: material
    topic: reconciled financing chronology
    missingEvidence: Executed documents for any 2024 convertible debt, founder bridge, and updated capitalization table.
