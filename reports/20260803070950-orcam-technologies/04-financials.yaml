- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash on hand
    - Impossible to assess runway directly
    - Request latest balance sheet, bank cash, and restricted cash
  - - Monthly burn
    - Cannot size rescue financing need independently
    - Request trailing 12-month monthly P&L and cash-flow bridge
  - - Gross margin by product
    - Cannot determine whether premium pricing produces attractive economics
    - Request product-level COGS and support allocation
  - - Realized ASP by channel
    - List prices may materially overstate actual revenue capture
    - Request invoiced ASP for direct, distributor, VA, and school sales
  - - Units sold and installed base
    - Cannot translate revenue into product traction or support burden
    - Request shipments, active devices, and churn / replacement data
  - - Inventory and reserves
    - Hardware transition risk may hide write-downs
    - Request inventory aging, obsolete stock reserve, and warranty reserve
  - - Hear commercialization metrics
    - Cannot tell whether the new focus can finance the company
    - Request pilots, orders, revenue, and gross margin for Hear
  notes: The missing metrics align closely with the company’s highest-risk underwriting questions.
