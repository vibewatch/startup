- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'OrCam’s public financial profile is not investment-grade on disclosure. There is enough evidence to conclude that the company once supported premium hardware pricing, built credible institutional channels, and may still retain profitable vision products in some contexts. There is also enough evidence to conclude that the business absorbed a severe revenue shock, made repeated layoffs, and depends on rescue financing or restructuring to bridge toward any future hearing-led recovery. The core diligence blocker is not merely missing detail but asymmetry: the most concrete numbers in the public record are adverse numbers. For underwriting, management would need to produce cohort-level unit sales, realized ASP by channel, gross margin by product line, current monthly burn, cash on hand, inventory exposure, and a reconciled funding history. Without those, the correct stance is that OrCam may still have valuable products and channels, but its margin path and standalone capital adequacy
    remain unproven.'
  claimRefs:
  - CI018
  - CI024
  - CI028
  - CI030
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
