company:
  name: OrCam Technologies
chapter:
  number: 4
  title: Financials
  summary: 'OrCam’s financial story is defined more by sharp volatility and financing dependency than by stable, well-disclosed hardware economics. Public evidence shows a premium-priced device business sold through direct, distributor, school, and veteran pathways, with revenue historically anchored in low-vision products and supplemented by newer school and hearing initiatives. But the same public record also shows severe recent stress: Calcalist reported repeated layoffs and a shift away from low-vision development in 2024, while Globes reported 2024 revenue collapsing to about $16 million from roughly $45-50 million in 2023 and described a stalled recovery plan needing additional capital. Underwriting therefore cannot rest on list pricing alone. The investable question is whether OrCam still has enough profitable device and channel activity to finance support, inventory, and product transition without a highly dilutive rescue round.'
sections:
- id: revenue-model-and-mix
  title: Revenue model, pricing, and monetization mix
  body: The visible revenue model is still predominantly hardware-led. OrCam publicly sells MyEye and Read devices, distributes them through partner channels, and supports them with a companion app rather than a standalone paid software layer. MyEye 3 Pro is listed at $4,250 and Read 3 starts at $2,790, which means the company is not trying to win with low-ticket volume. Instead it appears to depend on premium-device economics supported by buyer segments that can tolerate training and procurement friction. Public pages also show at least two adjacent monetization paths. First, OrCam Learn for schools is framed as a solution for students and educators with analytics, suggesting an institutional budget line rather than a pure consumer sale. Second, OrCam Hear is described in adverse reporting as entering marketing and sales, which suggests future diversification but not a mature current revenue base. Caplight classifies the business as a mix of hardware sales, subscription SaaS, and services
    and consulting, but public official evidence strongly supports hardware first and only partially supports recurring or service-heavy revenue.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-motion-and-channel-economics
  title: GTM motion and channel economics proxies
  body: 'OrCam’s go-to-market motion is more complex than a simple direct-to-consumer device sale. Public pages show authorized distribution, a direct buy-now surface, school-oriented selling for OrCam Learn, and VA coverage pathways for legally blind veterans. That mix matters because it implies long conversion cycles for at least part of the business, together with real onboarding and support obligations after the sale. The app-store listings reinforce this view: the companion app is free and includes Wi-Fi setup, device finding, settings control, and support contact flows, indicating that service and retention work continue after hardware shipment. These are financially relevant signals even though they are not full unit economics. They imply nontrivial post-sale support cost and some dependence on channel partners or payer qualification. At the same time, funded routes like VA coverage or school budgets can raise willingness to pay and reduce the personal out-of-pocket burden that otherwise
    makes the list price difficult for many users.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs: []
  figureRefs:
  - FI002
- id: cost-structure-and-unit-economics
  title: Cost structure, capital intensity, and unit economics visibility
  body: 'Because OrCam sells purpose-built assistive hardware rather than pure software, its cost structure almost certainly includes BOM, assembly, quality control, distribution margin, returns, training, and customer support. The public record proves some of these elements indirectly. Device support is active on mobile apps and release-note surfaces; training and orientation show up in veteran and school narratives; and the company’s products span wearable, handheld, and educational form factors, which likely increases inventory and support complexity. What the public record does not reveal is just as important: realized ASP, distributor discounting, gross margin, CAC, payback, warranty cost, return rate, and inventory obsolescence are all unavailable. That means hardware price should not be mistaken for hardware margin. In fact, adverse reporting suggests margin pressure may be severe because free or cheap AI substitutes have damaged the economic case for continued investment in low-vision
    product development. The result is a financial profile that looks inherently more capital intensive and less observable than a software accessibility product, with public evidence insufficient to underwrite efficient growth.'
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  tableRefs:
  - TI003
  figureRefs:
  - FI004
- id: capital-adequacy-and-distress-signals
  title: Capital adequacy and distress signals
  body: 'The strongest public signals concern capital stress rather than operating leverage. Tracxn reports $86.4 million of total funding across three rounds, while Caplight shows $98.9 million and a July 2024 convertible-debt event, and Seedtable models four funding rounds but only exposes limited detail. Those differences already tell a diligence story: even basic funding history is not perfectly settled in public sources. The more consequential evidence comes from adverse reporting. Calcalist wrote that layoffs in 2024 followed a decision to stop further development of low-vision products because smartphone-based AI alternatives had made them economically redundant. Globes later reported that 2024 revenue fell to about $16 million from $45-50 million in 2023, that the founders and allies had initiated a $12.5 million financing round with roughly $7 million from Shashua, and that the company still needed another $12-15 million. Just as important, Globes said a proposed $2 million loan
    would keep the company afloat only for a month or two. Taken together, the public picture is of a company with meaningful historical funding but very thin recent runway, contested rescue financing, and a business model under pressure from substitute technology.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
