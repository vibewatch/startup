- id: TV005
  title: Thesis-break and kill triggers table
  notes: Triggers are designed to be monitorable and valuation-relevant.
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - New financing validates deep reset
    - Fresh priced round or structured rescue far below unicorn mark
    - Confirms legacy price story is broken
    - Rebuild valuation from reset terms, not historic labels
  - - Revenue does not stabilize
    - No evidence of recovery from ~$16M 2024 level or further decline
    - Bull and base cases lose support
    - Shift weighting toward bear / asset-sale outcomes
  - - Mainstream AI replaces core workflow
    - User tasks become credibly replicable on cheaper platform tools
    - Dedicated-device moat compresses
    - Cut revenue multiple and strategic-premium assumptions
  - - Funded channel erosion
    - Veterans or similar funded-access routes weaken
    - Customer-acquisition economics worsen
    - Raise discount and lower base-case probabilities
  - - Further workforce shrink or support degradation
    - Another major reduction or visible service decline
    - Installed-base trust and product upkeep weaken
    - Treat as product-quality and commercialization warning
  - - Transparent round near or above $1B
    - Independent demand supports premium price with clean terms
    - Public mark conflict narrows materially
    - Re-open premium-case underwriting only with revenue proof
