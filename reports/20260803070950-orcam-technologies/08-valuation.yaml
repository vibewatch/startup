- id: scenario-ranges-and-entry-discipline
  title: Scenario ranges and entry discipline
  body: 'Because the public record does not reveal a clean present-day priced round, the right framework is scenario valuation rather than faux precision. In the bull case, OrCam closes its recapitalization, preserves the profitable reading-glasses economics described by Globes, proves that Hear can become a second leg of growth, and restores revenue into a range that can justify a premium niche-device multiple. That is the only path that cleanly supports staying near the unicorn line. In the base case, OrCam remains a real but narrower assistive-device company with funded channels, a support-heavy go-to-market model, and enough product relevance to stabilize but not enough proof to command elite multiples. In the bear case, platform substitutes keep compressing the vision use case, funding terms turn punitive, and the outcome looks more like a structured recap, spinout, or strategic asset sale. Entry discipline should follow those scenarios directly: a buyer paying today’s public unicorn
    mark is implicitly underwriting the bull case before management has proven it.'
