company:
  name: OrCam Technologies
chapter:
  number: 8
  title: Valuation
  summary: OrCam still looks like a real company with real product proof, but the public record does not justify underwriting a clean unicorn valuation today. The strongest optimistic anchor is Caplight’s August-2026-style estimated valuation of about $1.03B, yet Tracxn’s $1B label is explicitly tied to the 2018 Series B round rather than a fresh priced round, and Globes reported in 2025 that the company’s fair value may have fallen by more than 90% to roughly $150M amid revenue collapse, layoffs, and recap stress. That conflict makes the right call price-sensitive rather than binary. At legacy unicorn marks, the recommendation is avoid / research-more. A structured or reset entry could be interesting, but only after current revenue, preference stack, and recap terms are verified.
sections:
- id: valuation-recommendation
  title: Recommendation and valuation stance
  body: OrCam deserves a diligence discussion, but not a blind premium entry. The company still has real assistive products, real customer stories, and a founder lineage that once supported serious public-market ambition. That keeps it out of the “broken concept” bucket. The problem is that public evidence on price has diverged violently from public evidence on operating stress. Caplight still shows an estimated valuation of about $1.03 billion and a July 2024 convertible-debt round, but the strongest adverse reporting says revenue fell to roughly $16 million in 2024, additional rescue money was still needed, and institutional investors were effectively negotiating around a fair-value reset. In that context, the right investment stance is not “yes” or “no” in the abstract; it is “only if the price resets or the evidence improves.” I would not underwrite new money at a legacy unicorn narrative today. I would track the company, demand direct cap-table and revenue proof, and only engage if
    current terms create enough upside to compensate for the high residual risk.
  claimRefs:
  - CV001
  - CV006
  - CV007
  - CV008
