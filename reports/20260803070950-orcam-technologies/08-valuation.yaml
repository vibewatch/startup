    - Recap closes, Hear gains traction, vision products stay profitable, revenue recovers toward $60M-$70M
    - USD 0.85B-1.30B
    - Roughly 12x-18x on restored niche-device revenue and strategic scarcity
    - Execution, funding, platform substitution
    - Requires proof strong enough to defend or re-earn the Caplight-like mark
  - - Base
    - Business stabilizes as a narrower assistive-device company with funded channels and partial recovery to $35M-$50M revenue
