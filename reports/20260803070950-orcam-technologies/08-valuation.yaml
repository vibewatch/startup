- id: comparables-and-exit-options
  title: Comparable anchors and exit options
  body: 'The comparable set argues for discipline. Mobileye, a founder-adjacent Israeli computer-vision success story, had roughly $1.7 billion of 2024 revenue and an August 2026 market cap around $6.77 billion, which is a far larger platform than OrCam today. Sight Sciences, a much smaller public eye-care technology company, sits closer to the scale question that matters for OrCam and is valued at only about $0.28 billion against $77.4 million of 2025 revenue. Glaukos is the premium public ophthalmic growth comp, but its nearly $9.83 billion market cap is attached to a regulated ophthalmic platform with approximately $383.5 million of net sales, not to a distressed niche hardware company. Sonova provides the opposite reminder: scaled assistive-device incumbents can be worth a great deal, but only after they have achieved global distribution, strong financials, and billions of sales. Exit logic therefore tilts strategic before IPO. Intel’s $15.3 billion 2017 agreement to acquire Mobileye
    shows that strategic buyers will pay for category-leading computer-vision assets, but OrCam’s present public scale does not justify treating that precedent as a base case. If OrCam exits well from here, the more credible path is a strategic transaction or structured financing linked to specific product assets, not a near-term standalone IPO.'
