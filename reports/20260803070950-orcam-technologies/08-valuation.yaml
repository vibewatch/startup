  - - OrCam (Globes adverse estimate)
    - Distress/fair-value signal
    - ~$150M after >90% fall from 2021 value
    - Best retained adverse price-reset signal
    - Media estimate, not signed transaction
  - - Mobileye
    - Public market cap and 2024 revenue
    - ~$6.77B market cap on ~$1.7B revenue (~4.0x)
    - Israeli computer-vision founder adjacency and strategic-acquirer precedent
    - Far larger platform and different end market
  - - Glaukos
    - Public market cap and 2024 net sales
    - ~$9.83B market cap on ~$383.5M net sales (~25.6x)
    - Premium public ophthalmic growth comp
    - Regulated ophthalmic platform, not distressed assistive hardware
  - - Sight Sciences
    - Public market cap and 2025 revenue
    - ~$0.28B market cap on ~$77.4M revenue (~3.6x)
    - Useful small-cap eye-tech downside / reality anchor
    - Different procedure economics and reimbursement model
  - - Sonova
    - Public market cap and 2025/26 sales
    - ~$16.54B market cap with CHF 3.606B sales
    - Scaled assistive-device incumbent showing what maturity can look like
    - Much larger, diversified global platform
  - - Intel / Mobileye 2017
    - Strategic M&A precedent
    - ~$15.3B equity value acquisition
    - Shows strategic buyers will pay for mission-critical vision AI
    - Not a like-for-like current valuation anchor for OrCam
