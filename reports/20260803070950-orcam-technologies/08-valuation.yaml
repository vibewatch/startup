- id: final-diligence-asks
  title: Final diligence asks and thesis-break triggers
  body: 'The missing evidence is unusually specific. First, what is the current price? Not a vendor estimate, not a stale 2018 round, and not a press estimate of distress—actual signed current terms. Second, what revenue should investors underwrite: the 2024 trough, a stabilized 2025 run-rate, or a split-company forward plan that changes the revenue base entirely? Third, what sits above common equity in a rescue scenario: anti-dilution demands, loans, convertible instruments, liquidation preferences, or product-level sale rights? These are not cleanup questions. They determine whether a seemingly attractive reset is actually investable. The cleanest thesis-break triggers are equally concrete: a financing that validates a deep value reset, another sharp workforce reduction, further evidence that mainstream AI fully replaces core low-vision workflows, or loss of funded access channels that currently support demand. The positive triggers are just as clear: a transparently priced new round,
    evidence that revenue has stabilized, proof that Hear can scale without burning excessive capital, and a cleaner cap structure. Until then, OrCam belongs in the watchlist / special-situations bucket, not in the standard growth-equity bucket.'
