- id: TV002
  title: Thesis / anti-thesis table
  notes: The debate is not whether OrCam built meaningful technology, but whether today’s price is justified by today’s evidence.
  columns:
  - Dimension
  - Thesis argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Product reality
    - Read, MyEye, and Hear show real productization and user value
    - Real products can still be overvalued if substitutes commoditize the workflow
    - Show current product mix, gross margin, and retention by device line
  - - Funding history
    - OrCam achieved real institutional support and historic unicorn status
    - Most transparent priced-round evidence is old, while recent evidence is conflicted or distressed
    - Provide current signed cap-table and latest financing memo
  - - Founder / strategic halo
    - Shashua/Aviram lineage and Mobileye adjacency can attract strategic interest
    - Founder halo does not erase declining revenue or weak current price evidence
    - Show live strategic interest or bids tied to current product assets
  - - Comparable support
    - Premium eye-tech comps prove specialized device businesses can hold value
    - Mainstream public medtech and vision-AI multiples are far below a 2024-distress unicorn multiple
    - Show why OrCam deserves premium multiple persistence despite revenue stress
  - - Exit path
    - Strategic sale could still unlock value from niche assets
    - IPO path looks weak until price, growth, and cap structure are stabilized
    - Show audited forward plan and bankable exit pathway
  - - Current mark
    - Caplight suggests a unicorn-scale estimate still exists
    - Globes implies a drastic reset may already be the truer economic signal
    - Resolve the gap with a fresh priced round or audited secondary transaction
