  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: compute architecture and data flow
    missingEvidence: Per-product breakdown of what runs on device, phone, and cloud, plus latency, uptime, and failure-mode data.
    whyItMatters: Assistive reliability and privacy depend heavily on compute placement and fallback behavior.
    diligencePath: Request architecture diagrams, inference placement notes, offline/online matrix, and latency benchmarks by product.
    relatedQuestionRefs:
    - QE008
    - QE015
    - QE019
  - type: private-evidence-only
    severity: material
    topic: quality, safety, and compliance controls
    missingEvidence: Formal intended-use statements, risk controls, incident processes, certifications, and quality-system scope for each device family.
    whyItMatters: Assistive devices create user trust obligations that marketing pages do not satisfy.
    diligencePath: Request device regulatory files, quality manual, complaint trends, and certification inventory.
    relatedQuestionRefs:
    - QE016
    - QE018
    - QE025
  - type: private-evidence-only
    severity: material
    topic: reliability and support performance
    missingEvidence: Crash rates, support ticket volumes, hardware failure rates, app ratings trend, and release-by-release defect history.
    whyItMatters: Deployment maturity and support burden cannot be judged from product pages alone.
    diligencePath: Request QA dashboards, support SLAs, ticket taxonomy, and release metrics by device/app.
    relatedQuestionRefs:
    - QE011
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: supply and manufacturing dependencies
    missingEvidence: Core component suppliers, manufacturing footprint, inventory strategy, and single-source risks.
    whyItMatters: Hardware and hearables businesses can fail operationally even when the workflow experience is compelling.
    diligencePath: Request supplier concentration map, manufacturing partners, and contingency plans.
    relatedQuestionRefs:
    - QE019
    - QE025
