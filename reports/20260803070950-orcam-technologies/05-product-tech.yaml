company:
  name: OrCam Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: 'OrCam’s product stack is broader than the company’s low-vision headline suggests. It spans wearable vision assistance (MyEye), handheld and stationary reading (Read / Read 3), education support (Learn), and a newer hearing platform (Hear). The common design pattern is edge-like assistive interaction built around camera or microphone capture, AI processing, and audio guidance, usually mediated by simple user controls rather than complex screens. Public evidence is strongest on workflow and features, weaker on underlying models, supply chain, and compliance depth. That leaves a mixed technical verdict: OrCam clearly knows how to package assistive AI into usable hardware and apps, but its public disclosures do not fully prove the durability, certification depth, or development velocity needed to defend that package as mainstream AI platforms improve.'
sections:
- id: product-lines-and-user-jobs
  title: Product lines defined by user workflow
  body: OrCam’s product map is best described by user job rather than by SKU list alone. MyEye is the wearable job engine for blind or visually impaired users who need real-time reading, recognition, and scene description while moving through daily life. Read and Read 3 serve the document-access workflow for people with vision loss, reading fatigue, or learning difficulty who want text read aloud, summarized, magnified, or navigated by command. Learn extends that workflow into school settings with reading practice, comprehension prompts, and teacher-facing analytics. Hear is a separate audio-attention product for noisy conversational environments rather than a vision device. That matters strategically because OrCam is not merely shipping one gadget; it is trying to turn a family of assistive workflows into specialized hardware and app experiences. The technical strength of that approach is packaging. The technical weakness is that every product family now competes against increasingly capable
    general-purpose AI systems.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
