- id: deployment-support-and-roadmap
  title: Deployment, support, and roadmap signals
  body: 'Deployment appears deliberately simplified. The mobile apps are free, the manual emphasizes charging, gestures, and getting started, and the devices are designed to work through audio feedback rather than through visual UI complexity. Read 3 explicitly supports handheld and stationary-reader operation, while Hear depends on an iPhone app and phone-connected dongle, creating a tighter smartphone dependency. Support surfaces include FAQ, release notes, app-store diagnostics fields, and direct support contact from the app itself. Roadmap visibility, however, is uneven. The release-notes page confirms ongoing updates but publishes little structured change history in the readable extract. Hear’s CES-era coverage shows the product in preview or early shipping mode, and external reviews emphasized promise more than mature commercial scale. That leaves product maturity uneven across the stack: MyEye and Read look like mature assistive devices, Learn looks workflow-specific but established,
    and Hear still looks like a newer bet that depends materially on app quality and continued tuning.'
  claimRefs:
  - CE016
  - CE017
  - CE018
