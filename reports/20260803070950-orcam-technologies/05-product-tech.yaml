- id: TE001
  title: Product module / asset matrix
  columns:
  - Product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - MyEye
    - Blind or visually impaired users needing wearable daily assistance
    - Mature public flagship
    - Wearable reading, recognition, scene description, voice/gesture/touch control
    - Need clearer public detail on compute architecture and certifications
  - - Read / Read 3
    - Users needing document access, magnification, or reading support
    - Mature public handheld line
    - Offline reading, full-page capture, stationary mode, Smart Magnifier, AI assistant
    - Need actual adoption, failure-rate, and cloud dependency detail
  - - Learn
    - Students and educators in reading-support workflows
    - Established but niche workflow product
    - Reading fluency, comprehension feedback, teacher analytics
    - Need public contract structure, deployment scale, and data-governance detail
  - - Hear
    - Users with hearing difficulty in noisy environments
    - Newer preview-to-early commercial product
    - Selective speaker isolation through earbuds, dongle, and app
    - Need shipping status, Android support, and real-world performance data
  - - Companion apps and support surfaces
    - Installed-base users
    - Active support layer
    - Settings, Wi-Fi setup, device finding, diagnostics, control
    - Need release cadence, stability metrics, and support SLAs
  notes: Product maturity is based on public workflow evidence, not on audited shipment history.
