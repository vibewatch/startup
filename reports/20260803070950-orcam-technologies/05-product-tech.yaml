  - - Assistive AI / computer vision
    - Turn captured inputs into reading, description, or recognition outputs
    - Model quality, device compute, and possibly connected features
    - Commoditization risk as mainstream models improve
  - - Voice, gesture, and touch controls
    - Reduce need for screen-heavy UI
    - Reliable interaction design and onboarding
    - Accessibility gains disappear if controls are inconsistent
  - - Smart Magnifier / station mode
    - Expand reading and magnification workflows
    - Read 3 hardware plus stand or smart screen context
    - Feature complexity may increase support burden
  - - Hear dongle + earbuds + app
    - Isolate chosen voices and deliver low-latency output
    - iPhone app, dongle, Bluetooth, and mic array workflow
    - Phone dependency and latency can impair experience
  - - Connectivity / apps / updates
    - Configure devices, support Wi-Fi, personalization, and updates
    - App-store distribution and support operations
    - Sparse public release history limits auditability
  notes: Table reflects publicly visible operating components, not proprietary internal code structure.
