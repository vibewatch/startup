- id: growth-drivers
  title: Growth drivers supporting adoption
  body: 'The growth case rests on a combination of demographic need, technological improvement, and expanding institutional willingness to treat accessibility as an outcome worth funding. WHO and NEI data show the demand pool is supported by ageing populations, persistent refractive and cataract-related impairment, and significant unmet care needs. TBRC explicitly ties low-vision-device market growth to rising visual impairment prevalence and diabetes-related vision loss, while also highlighting demand for portable wearables, electronic magnifiers, and AI-powered assistive tools. OrCam’s own recent product messaging fits these trends well: Read 3 and MyEye 3 Pro now position AI assistant features, translation, and magnification as incremental value layers rather than just OCR. WHO’s global assistive-technology work adds a policy argument: devices that preserve independence can improve inclusion in education, employment, and civic life, creating a return-on-investment case for public or institutional
    buyers. For OrCam, that matters because the market grows not only when more people need help, but when schools, veterans systems, and families conclude that device-enabled independence is worth paying for.'
