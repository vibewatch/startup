company:
  name: OrCam Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: OrCam operates inside a real but narrower market than generic “AI healthcare” rhetoric suggests. The relevant core is the low-vision assistive-device segment—reading devices, magnifiers, wearables, and related accessibility tools—supported by broader assistive-technology demand and adjacent AI-device innovation. Public sizing lenses cluster around a roughly $1.34 billion 2026 low-vision-assistive-device market growing toward about $1.89 billion by 2030, while WHO and U.S. health agencies show a far larger underlying need base in vision impairment and assistive-technology access. The commercial bottleneck is not demand for accessibility in the abstract, but conversion of that need into reimbursed, trained, and paid device adoption amid strong smartphone and human-assistance substitutes.
sections:
- id: market-boundary-and-status-quo
  title: Market boundary, adjacencies, and status-quo substitutes
  body: 'The cleanest way to define OrCam’s market is to start narrow and then expand outward. At the core sits the low-vision assistive-device category: reading devices, magnifiers, wearables, screen readers, and other tools that help users extract visual information they cannot reliably access unaided. The Business Research Company and Research and Markets both frame the category this way and explicitly include reading devices, wearable devices, and electronic magnifiers. Around that core is a broader assistive-technology envelope, where WHO includes products such as white canes, hearing aids, speech recognition, and captioning. OrCam clearly touches that broader space because it sells vision devices, education tools, and a hearing product, but it does not compete for the full assistive-technology TAM. It also does not cleanly belong inside the entire AI-medical-device market, which includes hospital software, imaging, and clinical monitoring systems far from OrCam’s consumer or rehab
    workflow. Finally, status-quo alternatives matter. White canes, orientation-and-mobility training, volunteers, and mobile apps solve many of the same daily jobs without requiring a $3,000-$4,000 dedicated device purchase.'
