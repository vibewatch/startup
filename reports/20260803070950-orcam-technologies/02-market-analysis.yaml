- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Ageing and persistent vision-impairment burden
    - Driver
    - Structural / long-term
    - Expands need base for reading and daily-living assistance
    - Quantify targetable cohorts by geography and channel, not only global prevalence
  - - AI-powered portable and wearable assistive devices
    - Driver
    - Current / medium-term
    - Improves feature set and perceived device usefulness
    - Show where dedicated hardware beats free mobile apps on task success and speed
  - - School analytics and independence narrative
    - Driver
    - Current
    - Creates institutional budget case beyond consumer purchase
    - Provide procurement cycle length and renewal data for Learn-like offerings
  - - VA or public-benefit pathways
    - Driver
    - Current
    - Can unlock otherwise unaffordable purchases for qualified users
    - Show conversion rates, authorization timing, and funded volumes
  - - High upfront device price
    - Constraint
    - Immediate
    - Shrinks practical SAM even when need is obvious
    - Provide subsidy, financing, and payback data by channel
  - - Smartphone and volunteer substitutes
    - Constraint
    - Immediate
    - Free or low-cost alternatives reduce willingness to buy dedicated hardware
    - Prove dedicated-device superiority on high-frequency workflows
  - - Training and onboarding requirements
    - Constraint
    - Near-term
    - Raises support cost and slows adoption for seniors or new users
    - Share training hours, retention by trained cohort, and support burden
  - - Fragmented policy and limited access
    - Constraint
    - Structural
    - Need does not automatically convert into paid procurement
    - Map reimbursement and institutional access by country and buyer class
  notes: Market growth is real, but adoption economics depend on whether dedicated hardware clears the substitute bar and finds a payer path.
