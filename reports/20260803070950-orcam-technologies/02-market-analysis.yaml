- id: adoption-constraints-and-gaps
  title: Adoption constraints, substitute pressure, and sizing gaps
  body: 'The hardest market question is not whether accessibility need exists; it is whether dedicated hardware captures enough value before software substitutes absorb the job. Free or low-cost smartphone tools now cover many individual tasks that once justified a dedicated reader or wearable. Microsoft’s Seeing AI reads documents, products, scenes, people, currency, colors, and handwriting for free on mobile. Be My Eyes offers free volunteer help, AI image descriptions, and major-brand service access at global scale. Aira layers in paid human interpreting plus AI. Apple is making Magnifier and Accessibility Reader more powerful inside its own ecosystem, while Envision Glasses show that dedicated AI wearables are no longer a category of one. WHO also underscores structural frictions: low awareness, high costs, limited access, procurement challenges, and workforce gaps. Those frictions shrink practical SAM relative to headline need. The implication is that OrCam’s market is attractive when
    a dedicated device materially outperforms free apps, secures reimbursement, or delivers independence in settings where training and support are available. Without that, adoption can stall even as the underlying need keeps rising.'
