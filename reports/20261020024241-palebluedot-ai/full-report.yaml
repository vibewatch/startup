  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around AI compute capacity and closely attached infrastructure
              services, not the entire AI software or cloud market. PaleBlueDot AI presents three monetization surfaces:
              self-owned GPU clusters, a marketplace that connects customers to supply partners, and serverless
              inference. Its custom-compute offer adds dedicated clusters, reserved capacity, architecture work, and
              flexible GPU sourcing. Included spend therefore comprises dedicated training and inference capacity,
              brokered GPU access, and serverless inference consumption. Excluded spend includes models, application
              software, general-purpose cloud services, data labeling, and customer-owned equipment that does not flow
              through PaleBlueDot AI. Hyperscaler GPU instances, direct server procurement, colocation, internal
              clusters, and delayed workloads remain status-quo substitutes. This boundary avoids counting adjacent AI
              budgets that the company has not shown it can monetize.
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence provides company-scale indicators rather than an independent market denominator.
              PaleBlueDot AI reports 150+ GPU clusters, 220,000+ connected GPUs, 60+ regions, and 25+ supply partners;
              these figures describe network reach, but connected capacity is not necessarily owned, available,
              utilized, or revenue-generating capacity. The company also reported more than $5 billion in signed
              customer contracts as of the end of September 2026 and more than 10-fold year-over-year revenue growth in
              January 2026. Neither disclosure includes recognized revenue, contract duration, cancellation terms,
              pricing, utilization, or a starting revenue base. Tech Jacks Solutions explicitly cautions that the
              contract total is self-reported and unaudited. These signals support demand interest, but they cannot be
              converted into TAM, SAM, SOM, ARR, or backlog conversion without private operating data.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
