              controlled-capacity layer, while the marketplace broadens hardware and geography through external
              suppliers; serverless inference and model APIs sit above that infrastructure. The official homepage
              reports more than 150 GPU clusters, 220,000 connected GPUs, more than 60 regions, and more than 25 supply
              partners, but these are company-published network counts without definitions for active capacity,
              ownership, availability, or double counting. The architecture should therefore be diligenced as an
