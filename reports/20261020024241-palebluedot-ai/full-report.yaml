  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI was founded in 2024 and is headquartered in Palo Alto, California. Its stated operating
              model combines three supply modes: company-owned GPU clusters for dedicated workloads, a marketplace that
              draws on third-party capacity, and serverless inference for developers and enterprises. The current
              website presents substantial operating reach - 150-plus clusters, more than 220,000 connected GPUs, more
              than 60 regions, and more than 25 supply partners - but these are company-displayed indicators rather than
              independently audited capacity. The combination may broaden hardware and location choice, while also
              making service consistency partly dependent on the controls applied across external suppliers.
