      - number: '4.3'
        title: Cost structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              The operating model combines owned clusters with third-party supply, creating different cost and
              working-capital profiles. Owned capacity can require substantial hardware, data-center, power, networking,
              and deployment spending before utilization is proven; marketplace capacity may reduce upfront ownership
              but introduces supplier economics and availability risk. TokenRouter can add a software and governance
              layer, yet public materials do not separate its pricing or gross profit from underlying model and
              inference costs. None of the reviewed sources quantifies gross margin, utilization, power cost,
              depreciation, support cost, CAC, payback, churn, or net retention. A cohort-level contract-to-cash and
              capacity-to-gross-profit bridge is the minimum evidence needed to test whether reported scale improves
              economics.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI006
              - CI007
              - CI008
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Independent reporting described a $150 million Series B at a valuation above $1 billion in January 2026,
              while company releases later announced a $200 million Series C at a $3.2 billion valuation. The latest
              stated use of proceeds is additional compute capacity, and management also plans investment in full-stack
              and go-to-market teams. These facts indicate continued capital intensity and expansion dependence; they do
              not reveal current cash, debt, equipment financing, burn, or runway. SiliconANGLE also reported exposure
              to markets affected by North American chip restrictions and tariffs, a potential procurement and
              deployment risk. The financial verdict is therefore positive on demand signals but ununderwritable on
              revenue quality, margin path, and capital adequacy until management supplies audited financials and
              contract-level conversion data.
            claimRefs:
              - CI005
              - CI010
              - CI011
              - CI014
              - CI016
