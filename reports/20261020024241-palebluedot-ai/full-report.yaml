              The company labels the more-than-$5-billion figure as signed customer contracts. Without duration,
              termination, committed-consumption, and recognition terms, it cannot be treated as ARR, recognized
              revenue, backlog, or available cash.
            calloutType: risk
            claimRefs:
              - CI012
              - CI015
          - type: callout
            title: Require a contract-to-cash bridge
            body: >-
              Before underwriting the latest valuation, obtain monthly recognized revenue, collections, deferred
              revenue, remaining obligations, utilization, and gross margin by owned clusters, marketplace capacity, and
              TokenRouter.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI's public product surface joins three delivery modes rather than a single homogeneous cloud
              SKU: customized dedicated clusters for large or specialized workloads, marketplace capacity sourced
              through supply partners, and serverless inference for developers and enterprises. The official site
              describes the customized path as request, architecture, then deployment, while the Dot-1.1 launch record
              adds GPU filtering, deployment planning, and DeepSeek model access. This creates a potentially useful
              progression from resource discovery to configured infrastructure and API consumption, but the public
              materials do not disclose common commercial packaging, interoperability boundaries, or production service
              levels across those surfaces.
