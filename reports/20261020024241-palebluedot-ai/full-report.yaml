      - number: '3.3'
        title: Pricing, packaging, and switching
        blocks:
          - type: paragraph
            body: >-
              No retained source provides directly comparable per-GPU, reservation, or serverless prices. Growth
              Engineer says marketplace prices are refreshed daily through Dot-1.1 but that specific tiers and unit
              rates are not public; enterprise cluster design therefore appears sales-led. That opacity blocks a
              credible total-cost comparison with CoreWeave, Lambda, or hyperscalers. PaleBlueDot AI's marketplace could
              reduce single-provider lock-in by exposing multiple suppliers, yet supplier-specific contracts, data
              movement, orchestration, security reviews, and reserved-capacity terms may create switching costs of their
              own. Internal build offers more control but shifts procurement, utilization, and reliability risk to the
              buyer. Multi-homing is plausible from the architecture, but public portability and termination evidence is
              insufficient to claim that it is frictionless.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Moat durability and adverse view
        blocks:
          - type: paragraph
            body: >-
              The financing and contract narrative demonstrates capacity ambition, not defensibility by itself.
              PaleBlueDot AI reported more than $5 billion of signed customer contracts and raised a $200 million Series
              C at a $3.2 billion valuation, but Tech Jacks Solutions notes that the contract figure is self-reported,
              unaudited, and not recognized revenue. Hoodline further highlights the neocloud sector's dependence on
              contract duration and the risk of a pricing correction if chip supply normalizes. A marketplace can add
              geographic and hardware choice, while simultaneously exposing the company to supplier quality and pricing
              variability that vertically integrated rivals control more directly. The current moat is therefore best
              framed as executional access and orchestration. Durability requires evidence of backlog conversion, repeat
              usage, price advantage, workload portability, and consistent service levels across partner capacity.
            claimRefs:
              - CP004
              - CP006
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid supply is both the wedge and the dependency
            body: >-
              A broad partner network can improve location and hardware choice, but without supplier-level service,
              pricing, and portability disclosures it is not yet possible to distinguish durable orchestration leverage
              from a capacity-broker model vulnerable to margin and quality dispersion.
            calloutType: risk
            claimRefs:
              - CP002
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI presents a blended infrastructure model rather than a pure SaaS model. Dedicated GPU
              clusters serve large or specialized workloads, the marketplace provides on-demand access through supply
              partners, and TokenRouter adds a single API layer across frontier providers and PaleBlueDot-hosted
              inference. The company website reports more than 150 clusters, 220,000 connected GPUs, and 25 supply
              partners, but these are capacity and network indicators, not billable utilization or revenue. No retained
              source gives list prices, minimum commitments, reservation periods, overage rates, marketplace take rates,
              or realized discounts. Underwriting therefore requires separate price and margin schedules for owned
              capacity, partner-supplied capacity, and token routing.
