              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The disclosed product mix implies several adoption paths. Frontier labs and enterprise AI infrastructure
              teams can procure dedicated clusters for long-running training or specialized workloads; platform and
              product engineering teams can use marketplace capacity for variable demand; and developers can consume
              serverless inference without managing clusters. The likely economic buyers are infrastructure,
              engineering, research, or CIO organizations, while day-to-day users are machine-learning and platform
              teams. Those buyer and budget-owner assignments are analytical inferences, not disclosed procurement
              evidence, and require customer confirmation. Geographic adoption is visible but concentrated: the company
              described operations across North America and key Asian markets, while company-originated reporting and
              The AI Insider say U.S. and Japan customers together represented more than half of monthly revenue. That
              concentration makes regional enterprise adoption and supply availability central to the serviceable
              market.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include larger training workloads, growing inference use, and bursty real-time
              applications, all of which increase the value of flexible capacity and regional availability. PaleBlueDot
              AI's company- issued benchmark says its HGX B300 cluster exceeded 98% of NVIDIA reference performance
              across six training configurations; the same source frames Exemplar Cloud status as a procurement
              reference. This may reduce performance diligence friction, but it is not independent proof of uptime,
              economics, customer outcomes, or fleet-wide performance. Adoption constraints remain substantial: buyers
              must trust a young provider with critical workloads, capacity depends partly on supply partners, switching
              costs rise after deployment, and economics depend on pricing and utilization that are not public. The
              official site also warns that dated materials may be superseded. Valuation should therefore weight
              verified contract conversion, gross margin, capacity ownership, utilization, and retention more heavily
              than footprint or contract headlines.
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite signed contracts as revenue or TAM
            body: >-
              The company-reported $5 billion-plus contract value is a demand signal, not disclosed ARR, recognized
              revenue, cash, or an independently audited market-size measure. Underwriting requires contract duration,
              cancellation rights, deployment schedules, pricing, and conversion data.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and category boundary
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than named neocloud peers. Growth Engineer identifies CoreWeave,
              Lightning AI, and Lambda as direct specialist alternatives, while its buyer guidance and AIPressRoom also
              place AWS, Azure, and Google Cloud in the decision set. Buyers can additionally assemble capacity across
              providers, procure through brokers, or build dedicated infrastructure internally. Those substitutes trade
              convenience and geographic optionality against integration depth and operational control. Generic company
              databases are unreliable for this task: Multiples lists businesses such as Zetwerk, Inxeption, RigUp, and
              Tridge as PaleBlueDot AI competitors, a category mismatch that is not used as market evidence. The profile
              table therefore treats the landscape as a buyer-choice set and marks unsupported competitor scale and
              pricing fields as unknown rather than filling them from weak comparables.
            claimRefs:
              - CP008
              - CP009
              - CP015
              - CP016
