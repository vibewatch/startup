      - number: '3.2'
        title: Position, capability, and distribution
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI's primary differentiation is structural rather than a publicly demonstrated price
              advantage. It combines owned clusters, a partner-supplied marketplace, and serverless inference; its
              official site claims more than 150 clusters, 220,000 connected GPUs, 60 regions, and 25 supply partners.
              The company also offers dedicated clusters, reserved capacity, and flexible sourcing for complex
              deployments. This model can widen hardware and location choice, particularly for a customer base
              concentrated in the United States and Japan, but it also splits delivery across assets the company owns
              and a network it coordinates. The positioning map is an evidence-backed ordinal view of access breadth and
              buyer control, not a performance benchmark; thin public evidence for competing providers makes relative
              placements directional.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
