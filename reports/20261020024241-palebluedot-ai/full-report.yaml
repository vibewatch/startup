        title: Financing and commercial scale
        blocks:
          - type: paragraph
            body: >-
              Financing accelerated during 2026. The company announced a $150 million Series B in January at a valuation
              above $1 billion, followed by a $200 million Series C in October at a $3.2 billion valuation. Those two
              disclosed rounds alone total $350 million, but the assigned evidence does not establish a fully reconciled
              lifetime funding total, debt balance, or financing terms. Management also reported more than $5 billion of
              signed customer contracts by the end of September. That figure is a contracted amount, not recognized
              revenue, ARR, backlog conversion, or cash availability. Customers in the United States and Japan
              represented more than half of monthly revenue, indicating meaningful geographic concentration without
