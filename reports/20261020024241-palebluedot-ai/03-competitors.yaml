        - Enterprise AI workloads
        - Third-party review describes broader enterprise and geographic reach
        - No primary CoreWeave source or current price evidence in the assigned pool
      - - Lambda
        - Specialist GPU cloud
        - Not established in the assigned evidence
        - Smaller and developer-led AI workloads
        - Third-party review describes a simpler GPU-cloud offer
        - No primary Lambda source or current price evidence in the assigned pool
      - - AWS, Azure, and Google Cloud
        - Hyperscaler incumbents
        - Not quantified in the assigned evidence
        - Enterprises already using integrated cloud estates
        - Broader integrated services and extensive GPU resources
        - Relative cost and exact GPU availability are not evidenced here
      - - Internal dedicated build
        - Substitute
        - Buyer-specific and private
        - Large users seeking maximum control
        - Direct architecture, security, and capacity control
        - Procurement, utilization, staffing, and refresh-cycle burden
      - - Multi-provider procurement or broker
        - Status quo substitute
        - Not established in the assigned evidence
        - Buyers prioritizing sourcing flexibility
        - Supplier optionality without committing to one platform
        - Fragmented contracts, observability, and service accountability
    notes: >-
      Partial buyer-choice sample as of 2026-10-20; competitor scale, current
      prices, and primary-provider claims are marked unknown where the assigned
      evidence pool does not support them.
    claimRefs: [CP002, CP006, CP008, CP009, CP011, CP015, CP016]
  - id: TP002
    title: Capability and operating-model matrix
    columns:
      - Buying criterion
      - PaleBlueDot AI
      - Specialist neocloud peers
      - Hyperscalers
      - Internal build
    rows:
      - - Capacity sourcing
        - Owned clusters plus 25+ claimed supply partners
        - Direct specialist-cloud capacity; peer details not established here
        - Broad owned cloud estates; exact current capacity not evidenced here
        - Buyer-procured and buyer-operated
      - - Deployment modes
        - Dedicated, reserved, flexible marketplace, and serverless
        - Cloud GPU offers; exact peer packaging not established here
        - Integrated cloud services and GPU instances
        - Fully customized to buyer requirements
      - - Geographic option
        - Company claims 60+ regions and material U.S./Japan business
        - Growth Engineer describes CoreWeave as broader than PaleBlueDot AI
        - Broad reach asserted by comparison sources, not quantified here
        - Limited to buyer-selected facilities
      - - Price discovery
        - Daily-updated marketplace indications; unit rates undisclosed
        - Current comparable rates absent from assigned evidence
        - Current comparable rates absent from assigned evidence
        - Hardware and operating costs borne directly
      - - Control and accountability
        - Split between owned clusters and coordinated suppliers
        - Provider-operated
        - Vertically integrated provider-operated service
        - Highest direct control with highest operating burden
    notes: >-
      Directional matrix based only on retained evidence; "not established"
      denotes an evidence gap, not absence of the capability.
    claimRefs: [CP001, CP002, CP003, CP005, CP009, CP010, CP011, CP012, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Option
      - Pricing or contract model
      - Included capability
      - Public price evidence
      - Buyer implication
    rows:
      - - PaleBlueDot marketplace
        - Dynamic marketplace pricing
        - Multi-supplier GPU discovery and sourcing
        - Daily updates described; no retained per-unit rates
        - Potential price discovery, but realized discounts cannot be tested
      - - PaleBlueDot dedicated or reserved cluster
        - Custom sales-led contract
        - Architecture, reserved capacity, and deployment
        - No retained list price or minimum commitment
        - Negotiated terms may increase switching and renewal friction
      - - PaleBlueDot serverless inference
        - Public contract structure not established
        - Flexible inference compute
        - No retained per-token or per-request rate
        - Cannot compare economics with integrated clouds
      - - CoreWeave or Lambda
        - Current packaging not established in assigned evidence
        - Specialist GPU cloud
        - No retained directly comparable rates
        - Primary-source quote is required before price ranking
      - - Hyperscaler or internal build
        - Consumption, commitment, or owned-capacity economics
        - Integrated cloud stack or maximum direct control
        - No normalized comparison in retained evidence
        - Existing integration or control may outweigh headline GPU price
    notes: >-
      Public-price coverage is incomplete; null comparisons must be closed with
      same-date, same-GPU, same-region, and same-commitment quotes before use in
      procurement or valuation.
    claimRefs: [CP003, CP009, CP010, CP011, CP015]
figures:
  - id: FP001
    title: Directional buyer-choice positioning
    type: quadrant
    summary: >-
      Ordinal placement shows the tradeoff between breadth of access and direct
      buyer control; scores are evidence-constrained analyst judgments.
    data:
      xAxis:
        label: Breadth of geographic and supplier access
        min: 1
        max: 5
      yAxis:
        label: Buyer control and integration depth
        min: 1
        max: 5
      points:
        - label: PaleBlueDot AI
          x: 5
          y: 3
          detail: Hybrid owned-cluster, marketplace, and serverless model across 60+ claimed regions.
        - label: CoreWeave
          x: 4
          y: 4
          detail: Directional specialist-neocloud placement; current primary evidence is unavailable.
        - label: Lambda
          x: 3
          y: 3
          detail: Directional simpler GPU-cloud placement from one third-party comparison.
        - label: Hyperscalers
          x: 5
          y: 4
          detail: Broad integrated cloud services, with no current normalized price comparison here.
        - label: Internal build
          x: 1
          y: 5
          detail: Maximum buyer control with limited supplier and regional optionality.
        - label: Multi-provider broker
          x: 4
          y: 1
          detail: Broad sourcing option with fragmented integration and accountability.
    approximationNotes: >-
      Scores use a 1-5 ordinal scale derived from the cited product-model and
      comparison evidence; they are not measured benchmarks, market shares, or
      performance rankings. Thin peer evidence makes all non-PaleBlueDot
      placements provisional.
    claimRefs: [CP002, CP003, CP005, CP008, CP009, CP012, CP015]
