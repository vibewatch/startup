        - "$200M Series C at $3.2B; company claims 220,000+ connected GPUs"
        - AI startups, frontier labs, and enterprises
        - Owned clusters plus marketplace and serverless inference; APAC presence
        - Unit pricing, realized performance, and contract conversion undisclosed
      - - CoreWeave
        - Specialist neocloud
