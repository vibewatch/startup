schemaVersion: "report-v2"
artifact: financials
slug: palebluedot-ai
runDate: 2026-10-20
company:
  name: PaleBlueDot AI
chapter:
  number: 4
  title: Financials
  summary: >-
    PaleBlueDot AI discloses three monetization surfaces—dedicated clusters, a GPU
    marketplace, and serverless/model-routing access—and says it had signed more than
    $5 billion of customer contracts by September 2026. Those disclosures indicate
    demand but do not establish recognized revenue, ARR, gross margin, cash burn, or
    runway, leaving the core underwriting bridge unavailable.
sections:
  - id: revenue-model
    title: Revenue model and pricing visibility
    body: >-
      PaleBlueDot AI presents a blended infrastructure model rather than a pure SaaS
      model. Dedicated GPU clusters serve large or specialized workloads, the
      marketplace provides on-demand access through supply partners, and TokenRouter
      adds a single API layer across frontier providers and PaleBlueDot-hosted
      inference. The company website reports more than 150 clusters, 220,000 connected
      GPUs, and 25 supply partners, but these are capacity and network indicators, not
      billable utilization or revenue. No retained source gives list prices, minimum
      commitments, reservation periods, overage rates, marketplace take rates, or
      realized discounts. Underwriting therefore requires separate price and margin
      schedules for owned capacity, partner-supplied capacity, and token routing.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI007, CI008, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-quality
    title: Public traction and revenue quality
    body: >-
      The strongest current commercial disclosure is company-issued: more than $5
      billion in signed customer contracts as of the end of September 2026. The same
      release says U.S. and Japanese customers generated more than half of monthly
      revenue. This is directionally stronger than the January statement that revenue
      had grown more than tenfold, because it adds a period and a geographic mix
      indicator. It still does not disclose contract duration, cancellation rights,
      committed consumption, backlog conversion, or recognized revenue. Contract
      value must therefore remain a bookings-style signal, not ARR, revenue, or cash,
      and the geographic split is not a customer-concentration measure.
    claimRefs: [CI009, CI012, CI013, CI015, CI016]
    tableRefs: [TI003]
  - id: economics-and-costs
    title: Cost structure and unit-economics gaps
    body: >-
      The operating model combines owned clusters with third-party supply, creating
      different cost and working-capital profiles. Owned capacity can require
      substantial hardware, data-center, power, networking, and deployment spending
      before utilization is proven; marketplace capacity may reduce upfront ownership
      but introduces supplier economics and availability risk. TokenRouter can add a
      software and governance layer, yet public materials do not separate its pricing
      or gross profit from underlying model and inference costs. None of the reviewed
      sources quantifies gross margin, utilization, power cost, depreciation, support
      cost, CAC, payback, churn, or net retention. A cohort-level contract-to-cash and
      capacity-to-gross-profit bridge is the minimum evidence needed to test whether
      reported scale improves economics.
    claimRefs: [CI002, CI003, CI004, CI006, CI007, CI008, CI016]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Independent reporting described a $150 million Series B at a valuation above $1
      billion in January 2026, while company releases later announced a $200 million
      Series C at a $3.2 billion valuation. The latest stated use of proceeds is
      additional compute capacity, and management also plans investment in full-stack
      and go-to-market teams. These facts indicate continued capital intensity and
      expansion dependence; they do not reveal current cash, debt, equipment financing,
      burn, or runway. SiliconANGLE also reported exposure to markets affected by North
      American chip restrictions and tariffs, a potential procurement and deployment
      risk. The financial verdict is therefore positive on demand signals but
      ununderwritable on revenue quality, margin path, and capital adequacy until
      management supplies audited financials and contract-level conversion data.
    claimRefs: [CI005, CI010, CI011, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns:
      - Stream
      - Mechanism
      - Commercial unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - [Dedicated clusters, "Customized owned GPU capacity for large or specialized workloads", "Cluster, reserved capacity, or workload term", "Operating; 150+ clusters claimed across the platform", "Potentially contracted but utilization and recognition are undisclosed", "Contract term, committed spend, utilization, capex, depreciation, and gross margin"]
      - [GPU marketplace, "On-demand access to a global network of supply partners", "GPU capacity or workload consumption", "Operating; 25+ supply partners claimed", "Potentially asset-lighter, but take rate and supplier cost are undisclosed", "Marketplace GMV, net revenue, take rate, supplier concentration, and cancellation terms"]
      - [Serverless inference, "Flexible inference compute for developers and enterprises", "Tokens or inference consumption", "Offered within the platform", "Usage-linked in concept; realized pricing and model cost are undisclosed", "Token volume, blended price, model/provider cost, caching benefit, and gross margin"]
      - [TokenRouter, "Single API layer with routing, failover, and cost governance", "API or token usage; public price unavailable", "Launched in April 2026", "Software layer may improve mix, but no standalone revenue disclosure exists", "Paid accounts, free-credit conversion, price schedule, retention, and contribution margin"]
    notes: >-
      Mechanisms and scale indicators come from company-issued materials; no row
      provides recognized revenue, realized price, utilization, or audited margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI008, CI016]
  - id: TI002
    title: Pricing and contracting visibility
    columns:
      - Offer
      - Public price or unit
      - Contract evidence
      - Discount or realization evidence
      - Underwriting implication
    rows:
      - [Dedicated clusters, "Unavailable", "Customized and reserved capacity are described; term and commitment are not", "Unavailable", "Cannot derive revenue per cluster or payback"]
      - [Marketplace capacity, "Unavailable", "On-demand access is described; take rate and supplier settlement are not", "Unavailable", "Cannot separate gross billings from net revenue"]
      - [TokenRouter and serverless inference, "Token or API usage implied; rate unavailable", "Platform access is public; paid conversion is undisclosed", "Free credits are offered to selected users, but value is not stated", "Cannot infer realized price, CAC, or contribution margin"]
    notes: >-
      Public product and launch pages describe delivery mechanisms rather than a
      binding price card; unavailable entries must be replaced with executed contracts
      and billing extracts during diligence.
    claimRefs: [CI002, CI003, CI004, CI016]
  - id: TI003
    title: Unit economics and capital underwriting matrix
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Signed customer contracts, "More than $5B as of 2026-09-30; company-claimed", Medium, "Signals demand but not revenue recognition or cash conversion", "Contract list by value, duration, committed minimum, cancellation right, and recognized revenue"]
      - [Monthly revenue mix, "U.S. and Japan together above 50%; company-claimed", Medium, "Shows geographic mix but not customer concentration", "Revenue by country and top customers, with gross margin and collections"]
      - [Revenue growth, "More than 10x in the year preceding the January 2026 financing; company-claimed", Medium, "Growth rate lacks starting value and accounting basis", "Monthly GAAP revenue bridge and comparable-period base"]
      - [Gross margin and utilization, "Unavailable", Low, "Core test of owned-versus-partner capacity economics", "Margin by stream, GPU utilization, power and hosting costs, depreciation, and support costs"]
      - ["Cash, burn, runway, and obligations", "Unavailable", Low, "Determines financing dependency despite recent funding", "Bank statements, monthly cash burn, capex commitments, debt, leases, equipment financing, and downside runway"]
    notes: >-
      Contract value, monthly revenue mix, and growth are company-issued disclosures;
      null financial metrics are not estimates and require primary financial records.
    claimRefs: [CI009, CI012, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from workload to reported signals
    type: flow
    summary: >-
      PaleBlueDot can route demand through owned clusters, partner capacity, or an API
      layer, but public evidence stops before pricing, recognition, and gross profit.
    data:
      nodes:
        - id: demand
          label: Enterprise or developer workload
          detail: "Large, specialized, on-demand, or inference demand enters the platform."
        - id: dedicated
          label: Dedicated cluster
          detail: "Customized company-owned capacity for large or specialized workloads."
        - id: marketplace
          label: Marketplace capacity
          detail: "On-demand capacity sourced through a network of 25+ claimed supply partners."
        - id: tokenrouter
          label: TokenRouter and serverless inference
          detail: "Single API access, routing, failover, and inference delivery."
        - id: contracts
          label: Signed customer contracts
          detail: "Company-reported value above $5B as of the end of September 2026."
        - id: economics
          label: Revenue and gross profit
          detail: "Recognition timing, realized price, utilization, and gross margin remain undisclosed."
      edges:
        - from: demand
          to: dedicated
          label: Reserved or customized route
        - from: demand
          to: marketplace
          label: On-demand partner route
        - from: demand
          to: tokenrouter
          label: API and inference route
        - from: dedicated
          to: contracts
          label: Commercial agreement
        - from: marketplace
          to: contracts
          label: Commercial agreement
        - from: tokenrouter
          to: contracts
          label: Usage or commercial agreement
        - from: contracts
          to: economics
          label: Undisclosed conversion and recognition
    approximationNotes: >-
      The flow is conceptual and not value-proportional; it preserves disclosed
      mechanisms but does not infer prices, conversion rates, revenue, or margins.
    claimRefs: [CI002, CI003, CI004, CI008, CI012, CI013, CI015, CI016]
callouts:
  - calloutType: risk
    title: Contract value is not revenue
    body: >-
      The company labels the more-than-$5-billion figure as signed customer contracts.
      Without duration, termination, committed-consumption, and recognition terms, it
      cannot be treated as ARR, recognized revenue, backlog, or available cash.
    claimRefs: [CI012, CI015]
  - calloutType: recommendation
    title: Require a contract-to-cash bridge
    body: >-
      Before underwriting the latest valuation, obtain monthly recognized revenue,
      collections, deferred revenue, remaining obligations, utilization, and gross
      margin by owned clusters, marketplace capacity, and TokenRouter.
    claimRefs: [CI012, CI013, CI016]
