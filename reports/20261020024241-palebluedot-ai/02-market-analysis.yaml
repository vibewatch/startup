    - type: "missing-source"
      severity: "material"
      topic: "market-sizing"
      missingEvidence: >-
        Independent market data with a clearly defined AI compute denominator,
        geography, period, methodology, and non-overlapping TAM, SAM, and SOM.
      whyItMatters: >-
        Company footprint and contract signals cannot establish market size,
        market share, or a realistic serviceable opportunity.
      diligencePath: >-
        Obtain current analyst or industry datasets for GPU cloud and AI
        infrastructure, reconcile category definitions, and triangulate them
        against company revenue by product and geography.
      relatedQuestionRefs:
        - "QM009"
      relatedTableRefs:
        - "TM002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: >-
        Product-level pricing, owned versus partner capacity, available and
        utilized GPU-hours, gross margin, and contract-to-revenue conversion.
      whyItMatters: >-
        These inputs determine the monetizable serviceable market and whether
        reported network and contract scale converts into attractive economics.
      diligencePath: >-
        Review the data room, cohort revenue schedules, capacity inventory,
        utilization reports, supplier contracts, and recognized-revenue
        reconciliations.
