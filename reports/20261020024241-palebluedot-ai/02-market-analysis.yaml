    title: "Do not underwrite signed contracts as revenue or TAM"
    body: >-
      The company-reported $5 billion-plus contract value is a demand signal,
      not disclosed ARR, recognized revenue, cash, or an independently audited
      market-size measure. Underwriting requires contract duration,
      cancellation rights, deployment schedules, pricing, and conversion data.
