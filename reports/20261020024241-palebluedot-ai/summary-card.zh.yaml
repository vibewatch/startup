  topStrengths:
    - 专属集群、市场平台和无服务器产品组成的混合布局，覆盖了企业采购算力的多条路径。
    - 公司自报签约合同额超过 $5B、接入 GPU 超过 220,000 张，显示需求和供给触达都相当可观，但仍待核实。
    - 2026 年两轮股权融资和一笔独立的再融资工具，说明公司还能获得资金继续扩容。
    - 覆盖 60 多个地区，以及日本 B300 集群获得 NVIDIA Exemplar Cloud 认证，都是运营成熟度的信号。
  topRisks:
    - 签约合同额未经审计，未必能转化为确认收入、回款或有吸引力的毛利率。
    - 高资本开支扩张和再融资票据带来流动性与承诺风险，而烧钱速度、现金 runway、债务契约和利用率仍未披露。
    - 伙伴提供的容量带来服务质量、定价、控制权和供应商集中度风险，公开证据尚未量化这些风险。
    - 美国和日本客户贡献了超过一半的月度收入，但客户层面的集中度和留存数据不可得。
    - 董事会控制权、所有权、关联方技术许可、安全保障和监管风险仍缺乏充分文件支持。
  unresolvedGaps:
    - 经审计的确认收入或 ARR、按交付模式拆分的毛利率、利用率、烧钱速度、现金、runway，以及从合同到现金的转化桥接。
    - 活跃客户数、头部客户集中度、NRR、GRR、流失率、合同期限、取消权，以及经独立核验的客户成果。
    - 当前股权结构表、完全摊薄后的所有权、清算优先权、反稀释权利、债务契约、再融资义务和基础设施承诺。
    - 完整的董事会和管理层名单、创始人的运营角色、投票控制权、继任梯队和关联方治理。
    - 最新的安全审计和认证、事故与宕机记录、服务水平表现、数据处理条款、实体关系图，以及按司法辖区开展的法律或监管核查。
