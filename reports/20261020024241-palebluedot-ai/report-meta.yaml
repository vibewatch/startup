companyProfile:
  summary: >-
    PaleBlueDot AI is a 2024-founded, Palo Alto-based AI compute company. It combines dedicated GPU clusters, a partner
    capacity marketplace, and serverless inference, and reports a footprint of more than 150 clusters, 220,000 connected
    GPUs, more than 60 regions, and more than 25 supply partners. Its October 2026 Series C established a $3.2 billion
    private financing mark, while its more-than-$5-billion signed-contract disclosure remains unaudited and is not
    recognized revenue.
