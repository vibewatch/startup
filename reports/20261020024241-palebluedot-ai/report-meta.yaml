  topStrengths:
    - >-
      Hybrid dedicated-cluster, marketplace, and serverless product breadth addresses multiple enterprise compute buying
      paths.
    - >-
      Company-reported $5B-plus signed contracts and 220,000-plus connected GPUs indicate substantial demand and supply
      reach, subject to verification.
    - >-
      Two 2026 equity rounds and a separate refinancing facility demonstrate access to capital for continued capacity
      expansion.
    - >-
      Geographic reach across more than 60 regions and NVIDIA Exemplar Cloud status for a Japan B300 cluster provide
      operating-maturity signals.
  topRisks:
    - >-
      Signed contract value is unaudited and may not convert into recognized revenue, collections, or attractive gross
      margin.
    - >-
      Capital-intensive expansion and a refinancing note create liquidity and commitment risk while burn, runway, debt
      covenants, and utilization remain undisclosed.
    - >-
      Partner-supplied capacity introduces service-quality, pricing, control, and supplier-concentration risks that
      public evidence does not quantify.
    - >-
      United States and Japan customers generate more than half of monthly revenue, while customer-level concentration
      and retention are unavailable.
    - >-
      Board control, ownership, affiliate technology licenses, security assurance, and regulatory exposure remain
      insufficiently documented.
  unresolvedGaps:
    - >-
      Audited recognized revenue or ARR, gross margin by delivery mode, utilization, burn, cash, runway, and a
      contract-to-cash conversion bridge.
    - >-
      Active customer count, top-customer concentration, NRR, GRR, churn, contract duration, cancellation rights, and
      independently verified customer outcomes.
    - >-
      Current cap table, fully diluted ownership, liquidation preferences, anti-dilution rights, debt covenants,
      refinancing obligations, and infrastructure commitments.
    - >-
      Complete board and executive roster, founder operating roles, voting control, succession depth, and related-party
      governance.
    - >-
      Current security audits and certifications, incident and outage history, service-level performance,
      data-processing terms, entity map, and jurisdiction-specific legal or regulatory checks.
