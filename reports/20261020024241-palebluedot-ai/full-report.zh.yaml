        title: 证据展品
        blocks:
          - type: callout
            title: 不要把已签合同作为收入或 TAM 计入投资判断
            body: 公司报告的 $5 billion+ 合同金额是需求信号，不是已披露的 ARR、已确认收入、现金或独立审计的市场规模指标。投资判断需要合同期限、取消权、部署进度、价格和转化数据。
