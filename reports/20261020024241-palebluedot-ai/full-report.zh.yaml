  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI 展示的是混合基础设施模式，而非纯 SaaS 模式。专用 GPU 集群服务大型或特殊工作负载，市场通过供给合作伙伴提供按需访问，TokenRouter 则在前沿模型供应商和
              PaleBlueDot 托管的推理之间提供单一 API 层。公司网站报告有 150 多个集群、220,000 个接入 GPU 和 25
              家供给合作伙伴，但这些是产能和网络指标，不是可计费利用率或收入。没有留存来源给出目录价、最低承诺、预留期限、超额费率、市场抽成或实际折扣。因此，投资判断需要分别取得自有产能、合作伙伴产能和 token
