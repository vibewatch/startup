        title: 证据展品
        blocks:
          - type: callout
            title: 首要投资逻辑破坏触发条件
            body: 如果产能承诺不断增加，而已签合同持续无法转化为已确认且已收款的收入，应将其视为投资逻辑破坏，而不是暂时的报告缺口。
            calloutType: risk
            claimRefs:
              - CR011
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资确定了估值锚点，不是投资判断
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI 于 2026 年 10 月 1 日宣布以 $3.2 billion 估值完成 $200 million C 轮融资，此前 1 月以超过 $1 billion 估值完成 $150
              million B 轮融资。另一家融资追踪机构报告已披露股权融资 $350 million；公司 7 月公告还披露一笔 $255
              million、期限三年的私募票据，部分用于再融资现有融资工具。这些工具说明公司同时能获得股权和信贷，但融资额不等于可用现金；由于票据部分用于再融资，不能把全部票据视为新增增长资本。运营披露提供了真实的规模信号：公司描述了横跨自有集群、GPU
              市场和无服务器推理的平台，官网声称有 220,000+ 个接入 GPU、150+ 个集群和 60+ 个地区。但这些是公司报告的产能指标，不是经过审计的利用率或盈利能力指标。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV016
      - number: '8.2'
        title: 积压转化是估值核心问题
        blocks:
          - type: paragraph
            body: >-
              公司报告截至 2026 年 9 月已签客户合同超过 $5
              billion，并称美国和日本客户合计贡献了月收入的一半以上。独立报道正确提醒，已签合同金额不是已确认收入，积压数字也未经独立审计。区别至关重要：合同期限、取消权、部署进度、电力可用性、硬件交付、客户信用和毛利经济性，都可能使标题中的订单与产生现金的收入相去甚远。公开记录还缺少当前
              ARR 或已确认收入基数、毛利率、留存、烧钱和跑道，无法检验 $3.2 billion
              估值是否有运营倍数支撑。可以列出竞争集合，但现有证据没有标准化的可比公司收入、利润率、增长或估值指标，因此使用可比公司倍数会制造虚假精确度。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: 情景结果取决于证据，而不是臆造区间
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求合同需求转化为已确认收入并保持持久毛利，同时公司把客户基础从美日集中拓展出去，并在扩大规模时不破坏服务质量。基准情景是融资和产能继续增长，但公开证据仍不足以把最新非公开估值转化为可投资回报预测。悲观情景则是转化不足、客户集中、定价压力、再融资负担，或大型云厂商和新型云竞争压低下一轮融资估值。由于拟议入场证券、持股比例、清算优先权、稀释、现金流和可比指标都不可得，因此没有给出数值估值区间、目标
              IRR 或退出倍数。入场纪律应表达为证据条件：在把 $3.2 billion 融资估值视为公允价值前，先取得收入质量和资本表数据。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
              - CV016
      - number: '8.4'
        title: 推荐：跟踪待确认的转化与条款
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪，置信度中低，投资判断风险高。要形成买入建议，需要证据证明报告的合同基础能以有吸引力的毛利率转化为已确认收入、客户集中度正在下降，且债务偿付和基础设施承诺符合现金生成能力。法律和经济尽调还必须确认核心技术由谁拥有或持有许可：公司
              about
              页面称部分专有技术可能向关联方授权或从关联方获得授权，但未说明资产或条款。投资逻辑破坏触发条件包括重大合同取消、下轮融资、部署里程碑未达成、不利再融资、客户集中度恶化，或毛利不足以补偿资本密集度。可信的退出情景还需要一条可融资的正现金生成路径，以及公共或战略买方可以尽调的经审计指标。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
