              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 证据展品
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 将 $3.2 billion 轮融资估值视为融资参考，而不是经独立验证的公允价值；要改变投资结论，必须取得经过审计的转化、利润率、流动性和证券条款证据。
            calloutType: recommendation
            claimRefs:
              - CV001
