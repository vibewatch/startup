            body: >-
              运营模式将自有集群与第三方供给结合，形成不同的成本和营运资本特征。自有产能在利用率得到验证前，可能需要大量硬件、数据中心、电力、网络和部署投入；市场产能可减少前期所有权投入，却引入供应商经济性和可用性风险。TokenRouter
              可以增加软件和治理层，但公开材料没有将其价格或毛利与底层模型和推理成本分开。所审阅来源均未量化毛利率、利用率、电力成本、折旧、支持成本、CAC、回本期、流失或净留存。要检验报告的规模是否改善经济性，最低要求是按客户
