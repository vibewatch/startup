          label: 规模披露
          detail: 公司报告称有 220,000+ 个已连接 GPU、150+ 个集群和 60+ 个地区。
        - id: capital
          label: 资本渠道
          detail: $200M C 轮融资对应 $3.2B 估值，另有单独披露的 $255M 再融资票据。
