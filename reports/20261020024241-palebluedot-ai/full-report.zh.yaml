      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              已披露的产品组合暗示了几条采用路径。前沿实验室和企业 AI
              基础设施团队可以采购用于长期训练或专用工作负载的集群；平台和产品工程团队可以用市场产能应对波动需求；开发者则可在不管理集群的情况下使用无服务器推理。可能的经济买方包括基础设施、工程、研究或 CIO
              组织，日常用户则是机器学习和平台团队。这些买方及预算归属判断属于分析推断，并非已披露的采购证据，仍需客户确认。地域采用情况可见但较为集中：公司描述其业务覆盖北美和亚洲主要市场，而公司自有报道及 The AI
              Insider 称美国和日本客户合计贡献了月收入的一半以上。因此，区域企业采用和供给可得性是可服务市场的核心变量。
