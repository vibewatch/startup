  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应围绕 AI 算力及紧密相连的基础设施服务划定，而不是整个 AI 软件或云市场。PaleBlueDot AI 提供三类变现入口：自有 GPU
              集群、连接客户与供给合作伙伴的市场，以及无服务器推理。其定制算力服务还包括专用集群、预留产能、架构工作和灵活 GPU 采购。因此，纳入的支出包括专用训练和推理产能、经纪式 GPU
              访问以及无服务器推理消耗；排除的支出包括模型、应用软件、通用云服务、数据标注，以及不经过 PaleBlueDot AI 的客户自有设备。大型云厂商的 GPU
              实例、直接采购服务器、托管机房、内部集群和延后工作负载仍是现状替代方案。这样的边界避免把公司尚未证明能够变现的相邻 AI 预算计入市场。
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
