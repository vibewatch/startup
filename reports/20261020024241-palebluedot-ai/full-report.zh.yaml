  - id: TV003
    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 取决于证据的假设
      - 估值 / 回报逻辑
      - 概率信号与下行情景触发因素
    rows:
      - - 乐观
        - 积压合同转化为确认收入；利润率保持吸引力；客户结构更加分散；新增产能得到利用。
        - 只有经审计的经营证据建立起可信的增长和现金创造倍数后，最新私募估值才可能得到支持。
        - 信号：已披露的转化率和利润率队列。触发下行：部署延误或合同取消。
      - - 基准
        - 融资渠道和产能扩张继续，但确认收入、单位经济性和证券条款仍属非公开信息。
        - 无法负责任地推导数字区间或目标回报；维持观察状态，并要求访问数据室。
        - 信号：融资和部署进展稳定。触发下行：继续依赖订单，却不披露收入。
      - - 悲观
        - 转化不及预期、集中度持续、竞争压低价格，或再融资和基础设施承诺挤压流动性。
        - 下轮融资或倍数大幅压缩变得可能；在缺少优先权和债务条款时，无法界定下行空间。
        - 信号：不利再融资或未达里程碑。触发因素：下一轮条款转弱、客户流失，或利润率证据低于资本成本。
    notes: 情景是条件式框架，不是预测；由于所需财务和证券条款尚未公开，本文不提出概率百分比、估值区间或回报估算。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV014
      - CV016
