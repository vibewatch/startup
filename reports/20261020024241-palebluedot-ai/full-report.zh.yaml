          label: 需求信号
          detail: 据报告，已签署合同金额超过 $5B，但这不是确认收入。
        - id: economics
          label: 经济性缺口
          detail: 确认收入、毛利率、留存、烧钱速度、现金跑道和转化数据均未披露。
        - id: terms
          label: 条款与所有权缺口
          detail: 优先权、稀释、债务契约和关联方技术许可条款需要尽调。
        - id: decision
          label: 观察
          detail: 只有收入质量、资本结构和客户分散度证据填补投资判断缺口后，才推进决策。
    approximationNotes: 节点顺序表示证据序列，不代表规模、概率、转化率或与价值成比例的尺度。
