        title: 定价、打包与切换
        blocks:
          - type: paragraph
            body: >-
              没有留存来源提供可直接比较的单 GPU、预留或无服务器价格。Growth Engineer 称市场价格通过 Dot-1.1
              每日刷新，但具体层级和单位价格未公开；因此企业集群设计看起来由销售驱动。这样的不透明使得无法与 CoreWeave、Lambda 或大型云厂商进行可信的总成本比较。PaleBlueDot AI
              的市场通过暴露多个供应商，可能降低对单一供应商的锁定；但供应商专属合同、数据迁移、编排、安全审查和预留产能条款也可能各自产生切换成本。内部建设提供更多控制，却把采购、利用率和可靠性风险转给买方。从架构看，多云并用是可能的，但公开的可迁移性和终止证据不足以声称切换没有摩擦。
