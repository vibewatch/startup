      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素包括更大的训练工作负载、不断增加的推理使用，以及突发式实时应用；这些因素都提升了灵活产能和地域可用性的价值。PaleBlueDot AI 发布的公司基准测试称，其 HGX B300
              集群在六种训练配置下超过 NVIDIA 参考性能的 98%；同一来源将 Exemplar Cloud
              认证定位为采购参考。这或许能降低性能尽调摩擦，但不是对可用性、经济性、客户结果或全机群表现的独立证明。采用约束仍然明显：买方必须把关键工作负载交给一家年轻供应商，产能部分依赖合作伙伴，部署后切换成本会上升，而经济性取决于尚未公开的价格和利用率。官网还提醒，过时材料可能已被替换。因此，估值应更多权重于经验证的合同转化、毛利率、产能所有权、利用率和留存，而不是覆盖范围或合同标题。
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
              - CM016
