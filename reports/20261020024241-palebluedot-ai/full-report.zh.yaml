    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI 成立于 2024 年，总部位于加州 Palo Alto。公司所述运营模式包含三种供给方式：为专用工作负载提供自有 GPU
              集群、调用第三方产能的市场，以及面向开发者和企业的无服务器推理。当前网站展示了较大的运营覆盖——150 多个集群、超过 220,000 个接入 GPU、覆盖 60 多个地区以及超过 25
              家供给合作伙伴——但这些是公司展示的指标，并非独立审计的产能。该组合可能扩大硬件和地域选择，同时也意味着服务一致性部分取决于对外部供应商施加的控制。
