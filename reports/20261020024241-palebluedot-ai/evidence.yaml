evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited revenue, ARR, gross margin, burn, cash, debt, active customer count, customer concentration, and current
      employee roster.
    whyItMatters: >-
      Contract value and website capacity indicators cannot establish revenue quality, operating leverage, liquidity, or
      organizational capacity.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank statements, debt schedules, customer-level ARR
      exports, and a dated HR roster.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, executive, founder-role, ownership, voting-control, and investor-rights enumeration.
    whyItMatters: >-
      Public names do not reveal who controls strategic decisions, financing approvals, related-party matters, or
      succession.
    diligencePath: >-
      Review the current cap table, charter, bylaws, voting agreements, board minutes, investor rights, option plan, and
      executive organization chart.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent court, regulator, security-incident, and outage records sufficient to assess whether material adverse
      events occurred.
    whyItMatters: >-
      A search returning no assigned result does not prove the absence of litigation, enforcement, outages, breaches, or
      customer disputes.
    diligencePath: >-
      Run jurisdiction-specific court and regulator searches, review security attestations and incident logs, and
      request customer references.
