company:
  name: "PaleBlueDot AI"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    PaleBlueDot AI discloses meaningful commercial scale through more than $5 billion
    of signed customer contracts and a global infrastructure footprint, but those are
    company-issued figures rather than independently audited adoption metrics. Public
    evidence names only Xiaohongshu/RedNote, omits retention metrics, and shows that the
    United States and Japan together contribute more than half of monthly revenue.
sections:
  - id: "customer-segments"
    title: "Customer segments and buying paths"
    body: >-
      PaleBlueDot AI addresses at least two distinct buying motions. Startups and
      developers can seek flexible capacity through a marketplace or serverless
      inference, while enterprises with large or specialized workloads can request
      dedicated clusters, reserved capacity, and customized architecture. The public
      site describes a three-step Request, Architecture, and Deployment workflow,
      which implies a consultative enterprise sale rather than purely self-service
      consumption. Third-party profiles also describe an Asia-Pacific-heavy customer
      footprint and identify Xiaohongshu/RedNote as a customer. The company now says
      it is prioritizing frontier labs, Neolabs, and enterprises in the United States,
      but it does not disclose customer counts, segment revenue, pricing, or average
      contract size, limiting confidence in the relative economic importance of each
      segment.
    claimRefs:
      - "CU005"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory"
    title: "Adoption and commercial-scale signals"
    body: >-
      The strongest current adoption signal is PaleBlueDot AI's statement that it had
      signed more than $5 billion in customer contracts by the end of September 2026.
      That disclosure is accompanied by operating-scale counters of more than 150 GPU
      clusters, 220,000 connected GPUs, 60 regions, and 25 supply partners. Earlier,
      the company said revenue had increased more than tenfold during the year leading
      into its January 2026 financing. These measures point to demand and capacity
      expansion, but they are not interchangeable: signed contract value is not
      recognized revenue, infrastructure connected to the platform is not customer
      utilization, and revenue growth without a base does not reveal absolute scale.
      None of the assigned evidence supplies active accounts, paid workloads, renewal
      cohorts, or audited revenue.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU006"
      - "CU008"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "reference-quality"
    title: "Named proof, outcomes, and retention"
    body: >-
      Public customer proof remains narrow relative to the scale claimed. The reviewed
      evidence names Xiaohongshu/RedNote and describes an overseas arrangement, but it
      does not establish contract value, current production volume, duration, renewal,
      or a measured customer outcome. Other disclosures refer to customer cohorts in
      the United States, Japan, South Korea, Singapore, and Southeast Asia without
      naming accounts. No assigned source reports NRR, GRR, churn, renewal rate,
      contract term, satisfaction, or cohort retention. PaleBlueDot AI also states
      that website materials do not create a binding commitment without a definitive
      written agreement, reinforcing that marketing pages cannot substitute for
      executed contracts, invoices, usage logs, or customer references in diligence.
    claimRefs:
      - "CU010"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "expansion-and-concentration"
    title: "Expansion potential and concentration risk"
    body: >-
      The product architecture offers plausible land-and-expand paths: a customer can
      begin with marketplace capacity, move to reserved or dedicated infrastructure,
      and add serverless inference as workloads mature. That path is analytically
      plausible but not demonstrated by public cohort data. Geographic concentration
      is already material: the company reported, and Techflier highlighted, that the
      United States and Japan together generated more than half of monthly revenue.
      Management's stated plan to broaden the base toward U.S. frontier labs, Neolabs,
      and enterprises is therefore a strategy rather than proof of completed
      diversification. Investment diligence should reconcile the $5 billion signed
      contract figure to enforceable backlog, identify the top ten customers and
      renewal dates, and test whether supply-partner dependence constrains customer
      delivery or gross-margin durability.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU011"
      - "CU012"
      - "CU013"
