  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-evidence"
      missingEvidence: >-
        NRR, GRR, logo churn, revenue churn, renewal rates, contract duration, and
        customer cohorts by segment and geography.
      whyItMatters: >-
        Without retention and cohort data, rapid contract signing cannot establish
        durable recurring demand or land-and-expand performance.
      diligencePath: >-
        Obtain monthly customer-level revenue cohorts, renewal schedules, churn logs,
        and management reconciliations for the last eight quarters.
      relatedQuestionRefs:
        - "QU005"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customers"
      missingEvidence: >-
        A complete customer roster with deployment status, workload, contract value,
        start date, usage, outcome, and reference contact.
      whyItMatters: >-
        One named relationship and unnamed geographic cohorts do not verify broad
        production adoption or customer outcomes.
      diligencePath: >-
        Sample the top twenty accounts and obtain executed agreements, invoices,
        workload telemetry, renewal status, and direct customer reference calls.
      relatedQuestionRefs:
        - "QU004"
      relatedTableRefs:
        - "TU003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "contract-value"
      missingEvidence: >-
        Contract terms underlying the reported more-than-$5-billion signed total,
        including committed value, cancellation rights, duration, delivery schedule,
        recognized revenue, and customer concentration.
      whyItMatters: >-
        Gross signed value can overstate realizable revenue when contracts are
        conditional, long-dated, cancellable, or capacity-dependent.
      diligencePath: >-
        Reconcile every material contract to billing, capacity delivery, revenue
        recognition, remaining performance obligations, and top-customer exposure.
