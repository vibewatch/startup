company:
  name: "PaleBlueDot AI"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    PaleBlueDot AI's principal residual risks are converting a company-reported
    $5 billion-plus contract book into recognized revenue, maintaining consistent
    service across owned and partner-supplied capacity, and substantiating legal,
    security, and operational controls across a broad regional footprint. The
    recent financing reduces near-term funding pressure but increases the need
    for audited conversion, concentration, reliability, and compliance evidence.
sections:
  - id: "ranked-residual-risks"
    title: "Ranked residual risks"
    body: >-
      The highest residual exposure is financial and execution risk around contract
      conversion. PaleBlueDot AI says it had signed more than $5 billion of customer
      contracts by September 2026, but an independent analysis notes that the figure
      is self-reported, unaudited, and not equivalent to recognized revenue. The
      second tier combines operational scale and partner-delivery risk: the company
      advertises more than 150 clusters, 220,000 connected GPUs, and over 25 supply
      partners, while its marketplace extends service delivery beyond wholly owned
      infrastructure. Legal, privacy, and security assurance remains a high-impact
      evidence gap rather than a confirmed incident. The heatmap therefore ranks
      residual exposure from disclosed architecture and missing verification, not
      from an assumed failure history.
    claimRefs: [CR001, CR002, CR004, CR006, CR011, CR012, CR016]
    figureRefs: [FR001]
  - id: "operational-and-financial-execution"
    title: "Operational and financial execution"
    body: >-
      A three-part platform spanning owned clusters, a third-party marketplace, and
      serverless inference broadens capacity options but also creates heterogeneous
      reliability, pricing, and quality-control surfaces. The October Series C adds
      $200 million for capacity expansion, following a $150 million Series B that
      management said came after revenue grew more than tenfold. Those disclosures
      show access to capital and demand signals, but they do not reveal utilization,
      gross margin, cash burn, contract cancellation rights, or deployment schedules.
      Management should reconcile signed contract value to activated capacity,
      recognized revenue, cash collection, and remaining capital commitments by
      quarter. A material and sustained conversion miss while capacity commitments
      rise would break the investment thesis.
    claimRefs: [CR005, CR006, CR008, CR009, CR010, CR011, CR013, CR015]
    tableRefs: [TR002]
  - id: "legal-regulatory-and-control-assurance"
    title: "Legal, regulatory, and control assurance"
    body: >-
      The public evidence establishes breadth rather than assurance: the company
      advertises service across more than 60 regions, and its site notes that
      technologies may be licensed to or from affiliates and that additional terms
      can govern specific services. The assigned evidence does not identify the
      contracting entity by jurisdiction, named privacy or security certifications,
      regulatory approvals, litigation status, or a verified incident history.
      Accordingly, this chapter does not infer that incidents or proceedings are
      absent. Before investment, counsel should map operating entities, licenses,
      data-processing obligations, export-control exposure, insurance, and material
      disputes, while technical diligence should review current audit reports,
      penetration tests, incident logs, and service-level performance.
    claimRefs: [CR003, CR014, CR016]
    tableRefs: [TR001]
  - id: "dependencies-monitors-and-kill-criteria"
    title: "Dependencies, monitors, and kill criteria"
    body: >-
      Dependency risk is concentrated in three places. First, more than 25 supply
      partners support marketplace capacity, but public materials do not disclose
      supplier shares, termination rights, pass-through pricing, or standardized
      controls. Second, the United States and Japan together contributed more than
      half of monthly revenue, leaving customer and geographic diversification only
      partly demonstrated. Third, continued capacity build-out depends on converting
      large contracts quickly enough to fund or justify hardware and facility
      commitments. Monthly monitoring should cover activated contract value,
      recognized revenue, cash collection, top-customer share, partner-delivered
      uptime, gross margin by capacity source, and security exceptions. Thesis-break
      triggers are persistent conversion shortfalls, material service failures,
      loss of a critical supply partner, or inability to produce current compliance
      evidence.
    claimRefs: [CR004, CR007, CR008, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR003]
