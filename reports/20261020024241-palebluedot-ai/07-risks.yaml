  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "regulatory-compliance"
      missingEvidence: >-
        Operating-entity map, licenses, regulatory approvals, litigation and
        enforcement searches, privacy obligations, export-control analysis, and
        current third-party security certifications by jurisdiction.
      whyItMatters: >-
        A 60-plus-region footprint can create material legal, data-transfer, and
        service-delivery obligations that cannot be ranked from company marketing.
      diligencePath: >-
        Obtain the entity and jurisdiction schedule, then have counsel reconcile it
        to regulator, court, sanctions, permit, and certification records.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: "missing-source"
      severity: "material"
      topic: "incident-history"
      missingEvidence: >-
        Verified outage, breach, incident, service-credit, root-cause, recovery-time,
        and customer-notification records for owned and partner capacity.
      whyItMatters: >-
        Public infrastructure counts do not establish reliability or control
        effectiveness, and absence of a sourced incident is not evidence of absence.
      diligencePath: >-
        Review status history, incident register, postmortems, SOC reports, customer
        SLA reports, cyber-insurance claims, and partner escalation records.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR002]
    - type: "private-evidence-only"
      severity: "material"
      topic: "contract-conversion"
      missingEvidence: >-
        Contract-level deployment schedules, cancellation rights, take-or-pay terms,
        revenue recognition, collections, backlog aging, gross margin, burn, and
        committed capital expenditure.
      whyItMatters: >-
        Funding raised and signed contract value do not show available cash,
        recognized revenue, unit economics, or the cost of delivering contracted
        capacity.
      diligencePath: >-
        Reconcile audited financials, bank statements, contract samples, remaining
        performance obligations, billing, collections, and capacity commitments.
      relatedTableRefs: [TR002, TR003]
