artifact: company-overview
slug: palebluedot-ai
runDate: 2026-10-20
company:
  name: PaleBlueDot AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    PaleBlueDot AI is a 2024-founded, Palo Alto AI-compute company that says it
    combines owned GPU clusters, a supply marketplace, and serverless inference.
    Its October 2026 Series C reset the disclosed valuation to $3.2 billion, but
    most scale metrics remain company-issued and diligence-grade revenue,
    headcount, customer-count, ownership, and governance evidence is unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      PaleBlueDot AI was founded in 2024 and is headquartered in Palo Alto,
      California. Its stated operating model combines three supply modes:
      company-owned GPU clusters for dedicated workloads, a marketplace that
      draws on third-party capacity, and serverless inference for developers and
      enterprises. The current website presents substantial operating reach -
      150-plus clusters, more than 220,000 connected GPUs, more than 60 regions,
      and more than 25 supply partners - but these are company-displayed
      indicators rather than independently audited capacity. The combination
      may broaden hardware and location choice, while also making service
      consistency partly dependent on the controls applied across external
      suppliers.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: financing-and-commercial-scale
    title: Financing and commercial scale
    body: >-
      Financing accelerated during 2026. The company announced a $150 million
      Series B in January at a valuation above $1 billion, followed by a $200
      million Series C in October at a $3.2 billion valuation. Those two
      disclosed rounds alone total $350 million, but the assigned evidence does
      not establish a fully reconciled lifetime funding total, debt balance, or
      financing terms. Management also reported more than $5 billion of signed
      customer contracts by the end of September. That figure is a contracted
      amount, not recognized revenue, ARR, backlog conversion, or cash
      availability. Customers in the United States and Japan represented more
      than half of monthly revenue, indicating meaningful geographic
      concentration without revealing the absolute revenue denominator.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      Independent reporting identifies Jonathan Zhu and Shaodong "Sheldon" Huang
      as the founders. Stephen Watts is the current chief executive and was
      reported to have joined in early 2026 to lead enterprise expansion after
      prior cloud, data-center, and technology operating roles. Public material
      in the assigned pool does not establish the board roster, executive team
      beyond the CEO, founder operating roles, voting control, ownership
      percentages, or investor protective rights. This makes key-person and
      governance assessment incomplete: leadership has an experienced operating
      face, but founder continuity, succession depth, and decision rights remain
      private-evidence questions rather than verified strengths.
    claimRefs: [CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: evidence-quality-and-open-diligence
    title: Evidence quality and open diligence
    body: >-
      The strongest current disclosures are financing events and company-issued
      operating indicators. A third-party company database estimates $2.1
      million of annual revenue and more than 50 employees, but gives no
      diligence-grade methodology and predates the October financing; these
      values are therefore retained as unverified estimates, not cover facts.
      Separately, commentary on the model flags the possibility that reliance on
      supply partners introduces quality-control and pricing-stability
      complexity relative to vertically integrated clouds. No assigned adverse
      search result establishes a lawsuit, outage, breach, or enforcement event,
      but that search outcome is not evidence that none occurred. Primary
      financials, customer schedules, cap-table documents, board materials, and
      legal searches remain necessary.
    claimRefs: [CO013, CO014, CO015, CO016]
callouts:
  - calloutType: risk
    title: Contract value is not revenue
    body: >-
      The company-reported figure of more than $5 billion is signed customer
      contracts as of September 2026; without term, cancellation, delivery, and
      recognition data it should not be treated as ARR, recognized revenue, or
      available cash.
    claimRefs: [CO009]
