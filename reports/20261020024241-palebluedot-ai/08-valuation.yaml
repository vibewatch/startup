    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-structure"
      missingEvidence: "Cap table, fully diluted ownership, liquidation preferences, anti-dilution rights, debt covenants, refinancing schedule, and infrastructure purchase commitments."
      whyItMatters: "Security terms and senior claims determine dilution, downside protection, cash obligations, and the investor's actual entry economics."
      diligencePath: "Review the current capitalization table, Series C documents, private-note agreement, covenant calculations, and a sources-and-uses bridge in the data room."
      relatedQuestionRefs: ["QV002"]
    - type: "missing-source"
      severity: "material"
      topic: "comparable-set"
      missingEvidence: "Standardized revenue, growth, gross-margin, capital-intensity, and valuation metrics for the named public and private competitors or relevant M&A transactions."
      whyItMatters: "Competitor names alone do not support a comparable-company multiple or a numerical valuation range."
      diligencePath: "Build a date-aligned comp set from public filings and verified private-round terms, then normalize revenue definitions, lease and debt treatment, growth, and margins."
      relatedQuestionRefs: ["QV004"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "revenue-quality"
      missingEvidence: "Recognized revenue or ARR, contract duration and cancellation rights, deployment schedule, collections, gross margin, retention, burn, and runway."
      whyItMatters: "These data determine whether signed contracts convert into durable cash-generating economics and whether the current financing mark can support a target return."
