      - ["Anti-thesis", "The reported $5B-plus signed-contract figure is unaudited and is not recognized revenue.", "Cohort-level deployment, billing, cancellation, and collection data would substantiate conversion."]
      - ["Anti-thesis", "Customer revenue is concentrated in the U.S. and Japan, while peer and pricing data are absent.", "Diversified revenue and standardized comparable metrics would improve confidence in the mark."]
    notes: "The backlog and geographic mix are company-reported; independent sources provide interpretation but not an audit of the underlying contracts or revenue."
    claimRefs:
      - "CV004"
