  - id: "TV003"
    title: "Bull, base, and bear valuation scenarios"
    columns:
      - "Scenario"
      - "Evidence-dependent assumptions"
      - "Valuation / return logic"
      - "Probability signal and downside trigger"
    rows:
      - ["Bull", "Backlog converts into recognized revenue; margins remain attractive; customer mix broadens; added capacity is utilized.", "The latest private mark may be supportable only after audited operating proof establishes a credible growth and cash-generation multiple.", "Signal: disclosed conversion and margin cohorts. Trigger against: deployment slippage or contract cancellations."]
      - ["Base", "Financing access and capacity expansion continue, but recognized revenue, unit economics, and security terms remain private.", "No responsible numeric range or target return can be derived; remain on track status and require data-room access.", "Signal: stable financing and deployment updates. Trigger against: continued reliance on bookings without revenue disclosure."]
      - ["Bear", "Conversion disappoints, concentration persists, competition pressures pricing, or refinancing and infrastructure commitments strain liquidity.", "A down round or material multiple compression becomes plausible; downside cannot be bounded without preference and debt terms.", "Signal: adverse refinancing or missed milestones. Trigger: weaker next-round terms, customer losses, or margin evidence below the cost of capital."]
    notes: "Scenarios are conditional frameworks, not forecasts; no probability percentages, valuation ranges, or return estimates are asserted because the required financial and security terms are not public."
    claimRefs:
