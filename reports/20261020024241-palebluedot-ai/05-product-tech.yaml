    columns:
      - User job
      - Current workflow problem
      - PaleBlueDot AI solution
      - Publicly measurable benefit
      - Limitation
    rows:
      - ["Find suitable GPU capacity", "Compare model, region, size, and price across fragmented supply", "Cluster Marketplace plus daily price observations", "No customer-level benefit quantified", "No disclosed coverage, price methodology, or booking conversion"]
      - ["Plan a customized deployment", "Translate workload requirements into cluster architecture", "Dot-1.1 planning plus request, architecture, and deployment workflow", "No deployment-time or cost saving quantified", "Planner accuracy and human-review requirements are undisclosed"]
      - ["Run models through an API", "Evaluate and integrate models before local deployment", "DeepSeek PBD Access and serverless inference", "No latency, throughput, or uptime metric disclosed", "Public API documentation and production reference evidence are absent"]
      - ["Operate sensitive workloads", "Retain greater control over data and infrastructure", "Private-cloud deployment option", "No control or compliance outcome quantified", "Certification scope, tenant isolation, audit evidence, and data residency terms are absent"]
    notes: "Benefits remain unquantified where the assigned public sources provide product descriptions but no comparable customer outcome or performance denominator."
    claimRefs: [CE005, CE011, CE012, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Principal risk
    rows:
      - ["Customer planning and access", "Requirements capture, resource filtering, cluster planning, and model API access", "Dot-1.1, marketplace data, and model endpoints", "Opaque recommendation quality, pricing freshness, and API reliability"]
      - ["Inference and orchestration", "Serverless model execution and deployment coordination", "Control plane, model serving, and multi-tenant cloud architecture", "No public benchmark, SLA, observability, or isolation evidence"]
      - ["Capacity aggregation", "Adds on-demand GPU supply across locations and hardware", "More than 25 company-reported supply partners", "Supplier quality, capacity provenance, concentration, and support accountability"]
      - ["Dedicated infrastructure", "Provides customized clusters for large or specialized workloads", "GPU procurement, colocation facilities, networking, power, and operations", "Capital intensity, component availability, utilization, and regional failover"]
    notes: "This is a source-bounded operating model, not a verified internal architecture; dependencies and risks are analytical implications of the disclosed owned-plus-partner supply structure."
    claimRefs: [CE001, CE004, CE007, CE008, CE009, CE013, CE014, CE015]
