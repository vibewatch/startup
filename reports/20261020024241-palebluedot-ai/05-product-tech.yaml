      - [Dot-1.1 AI Cloud Agent, "Teams planning GPU deployments", "Released in 2025; current adoption undisclosed", "Requirement analysis, price observations, and cost-oriented cluster plans", "Planning accuracy, workflow automation depth, active users, and roadmap delivery"]
      - [DeepSeek PBD Access, "Developers evaluating or integrating DeepSeek models", "Announced with Dot-1.1", "API access before local deployment", "API documentation, data handling, model versions, reliability, and commercial terms"]
    notes: "Status and differentiation are drawn from company-issued materials; no row should be read as independent verification of production adoption, performance, or service levels."
