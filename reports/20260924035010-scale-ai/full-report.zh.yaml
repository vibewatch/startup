  - id: TV006
    title: 最终尽调核心诉求表
    columns:
      - 主题
      - 缺失证据
      - 关键影响
      - 负责人 / 尽调路径
    rows:
      - - 客户流失后各业务线 ARR
        - Google 与 OpenAI 曾为最大客户；两者贡献的 ARR 规模以及其离场后的净 ARR 均未公开披露
        - 不掌握收入缺口及替代 ARR 的填补节奏，就无法为任何估值情景提供投资依据
        - 数据室：调取 2024 年 Q1 至 2025 年 Q4 各业务线 ARR 瀑布图；如受 NDA 限制可作脱敏处理
      - - 政府合同排期与续约时间表
        - DoD 合同期权期、合同总价值（TCV）及续约率均未公开披露
        - 政府业务护城河是核心投资支柱；合同未能续约是最可能导致逻辑证伪的单点事件
        - 通过 USASpending.gov 核查公开合同；数据室：索取载明期权期的政府合同台账；与 Scale 政府业务负责人直接沟通
      - - Meta 交易后现金储备与跑道
        - Meta 交易所得款项已分配给股东；当前营运现金、烧钱速度与跑道均未公开披露
        - 若无法看清现金跑道，便无法判断公司能否在不引入稀释性股权融资的前提下完成业务转型
        - 数据室：调取资产负债表、损益表与现金流量表；核实留存营运资金与已分配股东资金的具体金额
      - - 企业级 GenAI Platform ARR 与增速
        - 未公开披露 GenAI Platform 的 ARR、客户数或标注业务向平台的转化率
        - 平台转型是乐观情景的核心驱动力；缺乏 ARR 数据支撑，乐观情景仅为空谈
        - 数据室：调取截至 2025 年 Q4 及 2026 年 Q1 的 GenAI Platform ARR、商机储备（pipeline）数据及代表性企业客户合同
      - - 管理团队留存与正式 CEO 人选方案
        - 未公开宣布正式 CEO 遴选进展或预期任命时间表；Droege 上任后核心高管留存情况不明
        - 管理层连续性对维护政府关系及推进企业级转型至关重要
        - 与董事会沟通：确认 CEO 遴选进展；要求提供核心高管 90 天留存评估；协同 HR 团队评估关键人员流失风险
      - - Meta 治理防火墙与数据访问协议
        - Meta 与 Scale AI 间的投资人权利协议未公开披露；尚无证据证实对 Meta 作为投资人的数据访问权限设有约束
        - 若缺乏确凿的防火墙机制，Meta 带来的利益冲突风险便无法化解，企业客户对数据主权的顾虑亦无法消除
        - 数据室：调取投资人权利协议及任何数据访问限制附表；就防火墙的充分性出具法律意见书
    notes: 在 $29B 隐含估值下，作出投资决定前必须核实上述六项。其中优先级最高的三项——各业务线 ARR、政府合同排期和现金跑道——应在讨论初步投资条款（term sheet）前查清。
