  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 核心论点
      - 证据基础
      - 何种情形会改变该观点
    rows:
      - - 投资逻辑：政府护城河以高切换成本与多年期合同确立了可持续的收入底线
        - 具备 DoD IL4、FedRAMP High 资质，拥有 Donovan 平台及 DIU / DARPA 合同；未见未续约公告
        - 一旦政府合同遭取消或安全复审未过，该逻辑支柱将被推翻
      - - 投资逻辑：数据基础设施与标注平台沉淀了 9 年难以复制的工程质量体系
        - scale.com 披露了 RLHF 平台、500K+ 名标注人员网络及模型评测工具链；获斯坦福 HAI 机构背书
