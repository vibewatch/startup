              - CV009
              - CV029
              - CV030
      - number: '8.6'
        title: 展品
        blocks:
          - type: callout
            title: $29B 估值由战略买方定价——不符合财务投资人理性
            body: >-
              $29B 隐含估值由 Meta 以战略收购方身份给出，而非财务投资人。Meta 愿意支付估计 ARR 58–145x 的高倍数，源于其对专有 RLHF 数据基础设施的迫切需求，而非基于财务回报考量。按 $29B
              共同入场的财务投资人支付了无法通过财务回报收回的战略溢价。在基准情景下，财务投资人的公允价值在 $8–12B 之间，意味着当前入场需减记 60–70%。
            calloutType: insight
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
          - type: callout
            title: 政府合同时间表是单项最重要的未决数据点
            body: >-
              Scale 的整套投资逻辑完全依赖于政府 / 国防收入底座。DoD 与情报界（IC）合同的期权期安排、续约率及合同总价值（TCV）均未公开披露。USASpending.gov
              虽能部分填补该信息缺口，却无法覆盖涉密合同。一次未续约事件，就是最可能致命的单点破题因素。
            calloutType: insight
            claimRefs:
              - CV006
              - CV007
              - CV031
          - type: callout
            title: 企业 GenAI Platform ARR 尚属未知且未公开披露
            body: >-
              乐观与基准情景均要求企业 GenAI Platform 收入在 18–24 个月内弥补 AI 实验室业务的流失。该 ARR 数据未公开披露。若缺乏该数据，所有前瞻预测皆属空想。TIME
              的部署案例是唯一公开的企业级生产部署佐证，但其 ARR 贡献并未量化披露。
            calloutType: insight
            claimRefs:
              - CV005
              - CV008
              - CV017
              - CV029
