            body: >-
              合成数据生成——即利用 AI 生成的训练数据来补充或替代人工标注数据——对 Scale 的核心标注业务构成了长期的结构性威胁。若各大 AI 实验室将 30–50% 的标注预算转向合成数据管线，人工标注数据的
              TAM 可能在未来 3–5 年内出现实质性萎缩。Scale 战略转向模型评测（离不开人类主观判断）与政府防务 AI（高度依赖人工安全审核），仅能部分对冲这一系统性风险。
