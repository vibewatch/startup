        - 经多方信源核实的投资案；创下 AI 领域有史以来最大单笔战略投资纪录
        - Meta 削减数据采购规模，或试图以低估值吞并剩余股权
      - - 投资逻辑：企业级 GenAI Platform 创造增量收入，对冲 AI 实验室客户流失
        - TIME 落地案例研究；标杆企业客户背书；GenAI Platform 官方产品页面
        - 24 个月内（截至 2027 年中），企业平台 ARR 未能弥补 AI 实验室收入损失的 >50%
      - - 反向逻辑：战略买家锚定的 $29B 估值脱离财务投资人理性范畴
        - 入场倍数高达 58x–145x ARR；前两大客户流失同步发生；Google 与 OpenAI 退出已成事实
        - 入场估值大幅调低（<$15B），或证实客户流失后 ARR 迅速企稳回升
      - - 反向逻辑：数据标注商品化对核心 RLHF 收入构成结构性威胁
        - 麦肯锡及斯坦福 HAI 报告显示单 token 标注成本持续走低；合成数据生成技术正缩减人工标注需求
        - 有证据表明 Scale 的平台级评估服务（非基础标注）能够抵御商品化冲击
      - - 反向逻辑：CEO 更迭叠加 Meta 利益冲突带来前所未有的管理与治理风险
        - Wang 离职已证实；Droege 出任临时 CEO 已证实；未见启动正式 CEO 选聘的公开信息
        - 选聘具备政府 AI 与企业平台实绩的正式 CEO；证实 Meta 与 Scale 客户数据之间设立了结构性业务防火墙
    notes: 正反两方论点均有事实依据，不纳入纯推测性观点。正向逻辑本身成立，但收入能否由新业务补足仍须非公开数据验证；反向逻辑则可仅凭公开信息观察。
