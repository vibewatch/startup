      - number: '6.5'
        title: 客户增购扩张与大客户集中度风险
        blocks:
          - type: paragraph
            body: >
              Scale 的大客户集中度风险已在 2025 年显现：曾是 Scale 最大客户的 Google 与核心客户 OpenAI 在同一季度相继离开，成为公司迄今最重大的客户流失事件。据 CNBC 报道，Google
              离开是因为 Meta 入股后引发的竞争冲突顾虑。两家头部 AI 实验室因同一利益冲突相继退出，也让其他与 Meta 存在潜在竞争关系的 AI 客户面临合作风险。


              与 Meta 的合作既带来重要增购机会（Meta 前沿 AI 研发需要大量优质训练数据，双方据称仍在扩大合作），也加深依赖风险：失去 Google 和 OpenAI 后，Scale 相当比例的收入可能集中于
              Meta 这一持股约 49% 的战略投资方和核心大客户。这种客户与投资方身份重叠的结构在风投支持的独角兽中并不常见，可能持续引发其他商业客户顾虑。


              从数据标注、RLHF、模型评测到 GenAI Platform 和 Donovan，Scale 理论上可以逐步向客户销售更多产品。TIME
              案例显示，企业客户能够从标注试点转向生产级平台应用；但增购转化率、留存扩张倍数和平均客单价（ARPU）均无公开数据。Scale 于 2025 年 9 月起诉
              Mercor，指其挖走客户，显示至少有一家资金充足的竞品正争夺 Scale 的现有客户。SuperAnnotate 与 Mercor 也在扩展企业级标注产品，可能分流 Scale Data Engine 的收入。
