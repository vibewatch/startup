      - number: '7.4'
        title: 合作伙伴与生态依赖风险
        blocks:
          - type: paragraph
            body: >
              Scale AI 最重大的生态依赖风险来自 Meta：Meta 持有约 49% 股权，是 Scale 最大股东和最大的在册 AI 实验室客户，也是原 CEO 的新雇主。风投支持的 AI
              公司中，这种三重关系极为少见。若 Meta 减少战略支持或数据采购，或推出自有竞品，Scale 可能同时面临客户收入下滑、估值承压和治理风险。


              对底层云算力基础设施（AWS 等）的依赖是 AI 基础软件厂商的通用行业风险，但在 Scale 拓展政府业务时尤为敏感，平台主权与训练算力可控性皆为硬性国防合规指标。Scale
              现有的国防资质表明其具备合规的云架构部署方案，但任何公有云战略合作变动均可能扰乱政府涉密准入。OpenAI 与 Google 的终止合作不仅斩断了关键营收支柱，更削弱了顶级同业的品牌背书。其余 AI
              实验室合作伙伴（如 Cohere 等）体量相对有限，无法以单个客户的规模提供等量级的营收托底。


              至于政府采办渠道与生态合作，集中度反而体现为正向护城河：政府订单依托成熟的采购框架（如 GSA、DIU、DARPA
              渠道）规范化落地，履约确定性强。然而，联邦预算审批周期与持续决议案（CR）的博弈可能导致项目回款节奏出现季节性波动。Snorkel AI 建立的生态伙伴矩阵以及 SuperAnnotate
              推进的企业级伙伴计划表明，竞品同样在加速构建依赖生态渠道的 GTM 体系，争夺企业级客户生态锁定的竞赛全面打响。
