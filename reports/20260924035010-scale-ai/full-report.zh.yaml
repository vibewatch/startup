      - number: '7.5'
        title: 团队、执行与财务风险
        blocks:
          - type: paragraph
            body: >
              管理层交接风险是 Scale AI 当前最重大的实质风险之一。创始人 Alexandr Wang 掌舵九年，一直是公司政府、企业与 AI 实验室关系的核心代表。他离职加入 Meta，同时 Meta 跃升为
              Scale 最大投资方，在客户、员工和投资人眼前直接形成了委托代理冲突。现任 CEO Francis deSouza 虽是资深企业软件老将，但加入 Scale 时日尚短；自 2025 年以来公司已历经两次 CEO
              更迭，在管理层稳住 Meta 入局后的新战略前，执行风险依然高企。


              大裁员后的人才留存同样面临风险。2025 年 7 月裁减 200 名全职员工与 500 名外包人员，可能打击了其余约 1,000
              名在职员工的士气，特别是当核心骨干感知到过渡领导层下方向不明时更是如此。掌握国防合同与企业部署组织记忆的关键政企大客户经理属于不可替代的资产；能否留住这批骨干，直接关系到合同续约与平台扩张。


              财务风险虽因 Meta 战略投资获得部分缓冲，但该交易资金全部分配给了老股东，并未留存为 Scale 资产负债表上的运营资金。分配之后，Scale
              的实际现金头寸与资金跑道随之成谜。目前未公开披露任何烧钱速度、现金头寸或盈利路径数据。若 AI 实验室业务流失规模正如 Google 与 OpenAI 离场所暗示的那样巨大，除非企业与政府业务增速超预期，否则
              Scale 在 2025-2026 年可能面临实质性收入缺口，必须寻求额外外部资本。
