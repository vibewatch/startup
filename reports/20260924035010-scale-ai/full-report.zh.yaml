  - id: TV005
    title: 逻辑证伪与一票否决触发条件表
    columns:
      - 触发条件
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 政府合同未续约
        - 任何 DoD 或情报界（IC）合同被取消，或在既定期权期未获续约
        - 打破政府业务托底逻辑；基准情景估值暴跌至 Appen 可比水平（$1.5–3B 区间）
        - 一票否决（Hard pass）——政府业务护城河是核心投资支柱；该支柱倒塌属于无法修复的逻辑破裂
      - - 更多企业客户以与 Meta 存在利益冲突为由解约或拒采
        - 任何非 AI 实验室企业客户明确以 Meta 投资关系为由流失或放弃采购
        - 证实与 Meta 的冲突已演变为系统性 GTM 阻碍，而非局限于 AI 实验室的偶发问题；TAM 风险扩散至 AI 实验室以外的企业市场
        - 若证实则一票否决；须提高进入估值折扣，以反映结构性获客阻力
      - - Meta ARR 下滑
        - Meta 数据采购 ARR 连续两个季度环比下滑 >20%，且未被其他企业客户增长填补
        - 打破乐观情景中的核心大客户假设；公司再无大型基本盘客户，面临客户集中度崩溃
        - 一票否决——收入托底不复存在；触发对所有情景的重新测算
      - - 截至 2026 年 Q4 GenAI Platform ARR 低于 $30M
        - 企业级 GenAI Platform ARR 经证实低于 $30M（2026 年 Q4 收入节点或数据室披露）
        - 证实向企业级业务转型未达最低可行转化门槛；在投资周期内，新增 ARR 替换节奏不足以对冲 AI 实验室客户流失
        - 放弃投资或严守价格纪律：在基准情景上限基础上压低 40% 进入价格
      - - CEO 过渡受阻信号
        - Droege 上任前 12 个月内未能敲定任何单一金额 >$5M 的企业订单，或在其任命后出现 2+ 位资深高管离职
        - 表明管理团队难以推进企业级转型；放大执行风险系数
        - 黄灯预警——重新评估管理层能力；推进前须要求董事会明确正式 CEO 选聘时间表
    notes: 上述触发条件均可在无需内部知情的前提下，通过公开报道或数据室披露直接观察。其中政府合同触发条件最为关键：其结果呈二元分布、具备公开可观察性（USASpending.gov），且会直接击穿核心投资支柱。
