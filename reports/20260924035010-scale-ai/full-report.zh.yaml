      - number: '2.3'
        title: 买方与用户客群分层及采用路径
        blocks:
          - type: paragraph
            body: >
              Scale AI 的目标客群涵盖四类核心买方，其在预算决策权、采购流程及切换成本上存在实质性差异。深入理解这些细分客群，对评估 Scale 收入的持久性与增长天花板至关重要。


              第一类客群——AI 科研实验室与基础模型开发商——是 Scale 最早的核心基本盘。OpenAI、Meta、Google DeepMind、Anthropic、Cohere 及 Adept 等机构，在预训练及
              RLHF 阶段需要海量的高质量标注数据。预算决策权归属于研发与工程部门。采购通常采取直接商业谈判并签订多年期合同。切换成本处于中等水平：各实验室既可自建内部标注流水线，亦能更换供应商，OpenAI 和
              Google 于 2025 年的相继离场充分印证了这一点。该客群潜藏极高的客户集中度风险。


              第二类客群——大型企业 AI 采纳者——涵盖借助 AI 实现内部自动化、优化客户产品及构建竞争壁垒的 Fortune 500 企业。Cisco、Etsy、Instacart 及 Pinterest
              等公司均属此类，其借助 Scale 的 GenAI Platform 开发特定行业领域的 AI 应用。预算决策权往往归属于 CTO 或 CDO
              团队，并伴随多年期平台采购承诺。鉴于平台集成度较深，其切换成本显著高于普通数据标注服务。


              第三类客群——美国政府与防务部门——是 Scale 最具辨识度且防守壁垒最强的基本盘。预算决策权掌握在 DoD 项目办公室、DHS、NSA/IC
              及各民事机构手中。采购严格遵循联邦采购条例并采用多年期合同工具。受制于严苛的安全准入资质（DoD IL4、FedRAMP High）、深厚的业务机构认知以及 Donovan
              平台构建的壁垒，其切换成本极高。该客群能贡献长周期、稳健的现金流，且能有效对冲商业客户集中度风险。


              第四类客群——AI 初创企业与学术研究机构——主要通过自助服务层接入 Scale。其预算决策权较为分散，单客支出偏低但客群基数庞大。采用按量付费模式，切换成本极低。
