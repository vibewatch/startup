      - - 商业模式转型执行风险
        - 以企业级 GenAI Platform ARR 作为转型成效指标；Donovan 斩获新合同情况
        - 裁员后 18 个月内（截至 2027 年 1 月），GenAI Platform ARR 未能弥补 AI 实验室 ARR 损失的 >50%
        - 黄牌警示 —— 转型节奏落后；重新评估资金充足度与现金跑道
    notes: 一票否决指标围绕投资逻辑对政府护城河、企业平台增长及管理层稳定性的核心要求设定。监测触发项均设计为无需非公开信息即可观察的指标。临界阈值均为分析师预估。
