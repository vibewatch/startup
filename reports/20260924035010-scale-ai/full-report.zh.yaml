  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Scale AI 处于数个相互独立但紧密关联的市场交汇处，在进行有实质意义的规模测算前，必须先厘清市场边界。其核心市场为 AI
              数据服务：为机器学习模型收集、标注、整理并验证训练与评测数据。该市场涵盖面向计算机视觉、自然语言处理、语音识别及多模态 AI 的人工标注数据。与之相邻的是 AI
              模型评测市场——针对大语言模型的可信基准测试与安全评测，Scale Evaluation 和 Scale Leaderboard 均布局于此。


              向外拓展来看，Scale 的 GenAI Platform 切入的是企业级 AI 部署市场：协助大型机构在基础模型之上构建、定制并投产生成式 AI 应用的工具与服务。该市场与超大规模云厂商的 AI
              服务（Azure AI、AWS Bedrock、Google Vertex AI）、精品 AI 咨询机构以及 AI 模型 API 供应商存在重叠。Donovan 平台则开辟出专用的政府与防务 AI
              垂直赛道，其受制于与商业 AI 支出完全不同的采购规章及预算机制。


              Scale 核心数据标注服务的现有替代方案包括内部人工审核团队（诸多大型 AI
              实验室与企业最初均自建标注流水线）、低成本离岸服务商，以及自动化合成数据生成技术。市场测算的核心分歧在于，是将目标服务市场窄化定义为仅限 AI 数据标注服务，还是泛化定义为全部 AI
              基础设施与工具链支出。本章将核心主市场界定为 AI 数据服务与评测基础设施（标注、RLHF、基准测试），并将企业级 GenAI 平台与政府 AI 视为相邻子市场。
            claimRefs:
