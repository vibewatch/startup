      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Scale AI 的运营模式融合了软件工具与人机协同（human-in-the-loop）执行机制，属于混合型 AI 辅助标注架构，而非纯软件或纯人工模式。底层技术栈主要由五大模块构成：(1)
              支持多模态标注任务的 Web 端标注工具平台；(2) 负责审核、交叉校验与反馈的质检管道；(3) 向企业与实验室客户以编程方式开放服务的 API 基础设施；(4) 承载大语言模型定制工作流的 GenAI
              Platform；(5) 面向防务任务的 Donovan AI Agent 运行时。


              标注贡献者网络是由 Scale 自主招募、培训、准入考核并全流程管理的全球化专有人力资产。该平台（Scale
              称之为“任务撮合市场”）将标注任务智能分发给具备相应技能的贡献者，实时监控作业质量，并将高敏任务升级至资深评审员复核。Scale
              将贡献者质量管控视为核心差异化壁垒，据公司自述，其专有质检管道输出的标注质量超越同业竞品。


              Scale API 是 Data Engine 面向开发者的核心接入端，支持以编程方式提交标注作业、拉取交付数据集，并与 ML 训练流水线无缝集成。该 API
              全面支持各类标注任务（文本分类、边界框、语义分割、RLHF 偏好对排序等），并内置 Webhook 回调机制以实现作业完成后的实时通知。


              GenAI Platform 交付架构涵盖：数据接入与前置预处理、LLM 选型与提示词工程、微调或 RAG 流水线搭建、红队攻防对抗与安全评测，以及上线部署与运行时监控。这属于典型由 Scale
              工程师团队协同平台工具共同交付定制 AI 应用的托管服务模式。


              Donovan 架构则高度针对保密涉密环境定制：部署在通过 DoD IL4 认证的合规云基础设施之上，打通涉密政府数据系统，支持规划、情报检索、决策推演等多模态 AI Agent
              工作流，并提供军事任务必备的可解释性功能。Donovan 的底层技术架构细节未对外公开；其商业落地形态更贴近军工 IT 托管服务，而非标准商业 SaaS 产品。
