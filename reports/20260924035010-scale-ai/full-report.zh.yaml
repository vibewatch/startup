  - id: TM002
    title: TAM / SAM / SOM 或规模测算视角表
    columns:
      - 规模测算视角
      - 市场范围
      - 估计
      - 置信度
      - 依据 / 关键假设
    rows:
      - - TAM — 广义 AI 数据与基础设施
        - 全球所有 AI 数据服务 + 评估 + 企业 GenAI 工具
        - $10B–$30B
        - 低
        - McKinsey：88% 的组织使用 AI；若大型组织在数据 / 工具上支出 $1M–$10M，合计达 $10B+；不确定性高
      - - TAM — 仅限 AI 数据标注
        - 全球面向 ML 的人工标注数据服务
        - $2B–$8B
        - 低
        - 由上市公司对标数据（Appen 营收代理）+ 全球市场放大系数推导；高度不确定
      - - SAM — 高端 AI 数据（Scale 定位）
        - 大型企业、AI 实验室、政府——高端标注 + 评估 + 平台
        - $1.5B–$6B
        - 低
        - Scale 瞄准高质端；SAM 约为标注 TAM 的 30–50%；政府业务构成了独立的 SAM 细分板块
      - - SAM — 政府 / 国防子市场
        - Scale 可触达的美国政府 AI 数据与评估预算
        - $300M–$1B
        - 低
        - 基于 DoD AI 投资增长及涉密供应商供给瓶颈估算；无公开预算明细
      - - SOM — Scale 3-5 年可获取市场
        - 结合竞争格局，Scale AI 在未来 3-5 年内可现实捕获的收入规模
        - $500M–$2B
        - 低
        - 若 ARR 处于 $500M-$2B 区间，则与 15-60x ARR 下的 $29B 估值相符；收入未获证实
    notes: 所有估算均基于市场代理数据、投资者报道及公开业务指标推算的受限近似值。收入未公开披露。上述数据仅具方向参考意义，需对照实际财务数据核验。
