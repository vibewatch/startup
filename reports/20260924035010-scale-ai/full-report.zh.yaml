      - number: '7.3'
        title: 运营与执行风险
        blocks:
          - type: paragraph
            body: >
              Scale AI 当下面临的最严峻运营挑战，在于逆风环境下商业模式转型的落地执行。公司正试图从依赖基础标注作业量的旧模式（受 AI 实验室流失及合成数据浪潮冲击而显著下滑），全面转向依托企业级 GenAI
              Platform 与政府防务 Donovan 平台的新模式（处于成长阶段但放量节奏存疑）。这一战略大调头与 CEO 换帅、团队大幅精简以及单季度痛失两大超级客户高度同步发生。


              数据安全隔离与标注质量管控是贯穿 Scale
              核心底座的内在运营风险。作为处理客户专有训练数据的核心服务商，任何数据泄露事故、重大质检失误或客户专有资产违规滥用，都将对企业客户信任及政府涉密采办准入资质造成不可逆的破坏。虽然 SOC 2 Type
              II、ISO 27001、DoD IL4 与 FedRAMP High 认证提供了防护网，但无法完全消除人为与技术纰漏。本次尽调未发现公开的数据安全责任事故。


              供应链风险主要来自众包标注贡献者生态。Scale 重度依赖全球人类标注网络；若该群体出现劳资争端、作业质量滑坡或遭遇以 Mercor 为代表的同业恶意挖角，将直接危及标注交付质量与履约周期。2025 年 7
              月裁撤约 500 名外包人员，可能在一定程度上削弱了标注供应链的运营冗余度。此外，Scale 对 AWS
              等主流底层公有云的依赖构成了常见的云平台集中度风险，在满足美国国防部基础设施主权与本地化合规诉求时尤其值得关注。
