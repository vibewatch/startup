      - number: '1.6'
        title: 展项
        blocks:
          - type: callout
            title: 政府级 AI 数据基础设施中的先发优势
            body: >-
              Scale AI 在美国政府和防务 AI 数据基础设施中占据独特且可防守的地位。DoD IL4 临时授权和 FedRAMP High 认证，加上 Donovan
              平台与正在执行的美国国防部数据整理合同，形成了大多数商业 AI 数据公司难以匹敌的显著准入门槛。这块政府业务带来高粘性的多年期合同，使 Scale 处于有利位置以承接联邦 AI 支出的快速增长。
            calloutType: strength
            claimRefs:
              - CO027
              - CO029
              - CO030
          - type: callout
            title: 客户集中度：Meta 交易后 Google 和 OpenAI 离场
            body: >-
              Meta 入股后，Scale AI 最大的两家商业客户 Google 和 OpenAI 均释放出缩减或退出合作的信号。两家 AI
              实验室客户同时缩减或终止合作，不仅带来实质性收入风险，也印证了投资者对利益冲突的担忧：战略投资方 Meta 本身就是 Scale 最大客户的直接竞争对手。由于收入未披露，这项客户集中度风险的实际规模无法量化。
            calloutType: risk
            claimRefs:
              - CO035
              - CO036
              - CO038
          - type: callout
            title: CEO 交接与治理不透明
            body: >-
              Alexandr Wang 转投 Meta——即刚刚向 Scale 投资 $14.3 billion 的公司——引发了双重担忧：(1) 失去了通过远见和行业关系奠定 Scale 独特地位的创始人；(2) Wang
              同时在 Meta 任职并保留 Scale 董事席位，导致治理边界模糊。临时 CEO Jason Droege 拥有过硬的运营履历，但此前从未带领大型科技公司完成重大战略转型。Meta
              交易后的董事会构成未公开披露。
            calloutType: risk
            claimRefs:
              - CO011
              - CO013
              - CO015
              - CO016
          - type: callout
            title: Meta 交易实为资本再分配，而非为业务增长注资
            body: >-
              不同于传统融资轮次，Meta 战略投资所得款项主要分配给了既有股东及已归属股权持有人，并未注入 Scale 的运营金库。因此，这笔 $14.3 billion 的交易并未实质性改善 Scale
              交易完成后的现金头寸与现金跑道。评估 Scale 的投资者必须独立审视其烧钱速度、剩余现金储备，以及企业级平台转型所需的资金需求。
            calloutType: insight
            claimRefs:
