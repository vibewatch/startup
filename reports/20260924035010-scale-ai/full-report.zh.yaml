      - number: '4.5'
        title: 财务裁决——收入质量、利润率路径与尽调堵点
        blocks:
          - type: paragraph
            body: >
              Scale AI 的财务特征呈现多重交织：资本储备充沛，收入走向不明朗，管理层在客户大规模流失背景下正推进高风险业务模式转型。


              收入质量值得警惕。作为历史上最大的收入引擎，数据标注业务呈现明显的大宗商品化定位，面临结构性逆风（Appen 公开收入下滑即为先行指标）、客户流失（Google 和 OpenAI
              相继退出）以及直接竞品分流。GenAI Platform 与政府防务业务收入质量更优（合同期更长、客户绑定更深、大宗化风险较低），但在总收入中的当前贡献占比尚未披露且体量预计较小。2025 年后 AI
              实验室客群的净收入留存率（NRR）大概率低于 100%。


              若业务转型取得成功，利润率中长期有望向好：剥离低毛利数据标注人力，做大高毛利平台与政府业务，将逐步改善综合毛利率。然而，转型本身伴随重大执行风险，在平台与政府业务形成规模效益前，2025–2027
              年过渡阶段大概率经历收入压缩期。


              资金充足度是最突出的财务优势。Scale 累计融资超 $1.6B+，Meta 交易亦为股东提供了流动性（并补充了部分初级资本）。裁员后公司以更精简的人员编制和更低的烧钱率运行。现金跑道估算在 3
              年以上，足以支撑转型推进。


              核心尽调堵点：(1) 缺乏公开收入与 ARR 数据——估值倍数无法确证；(2) Google 与 OpenAI 流失对营收的具体冲击尚未可知；(3) 政府合同收入规模及增长轨迹未披露；(4)
              各业务线分部毛利率未公开；(5) Meta 交易中新股与老股的具体拆分比例未经证实；(6) Mercor 诉讼判决可能产生财务牵连（赔偿责任、客户流失）。
            claimRefs:
