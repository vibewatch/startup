      - number: '6.2'
        title: 采纳轨迹与业务增长信号
        blocks:
          - type: paragraph
            body: >
              Scale AI 从未公开披露其活跃客户数、营收规模、ARR 或系统实际部署指标。外界对其业务采纳趋势的推断，只能依赖已公开里程碑节点、团队人员增减、贡献者外包报酬以及第三方参照数据进行综合研判。


              最显著的规模指标包括：(1) 累计向全球标注贡献者支付超过 $1B 报酬，印证了其底层庞大的标注作业吞吐规模；(2) 累计处理超过 15B+ 次人工标注判断，显示出其平台级数据处理沉淀；(3) 2024 年 5
              月以 $13.8B 估值完成 F 轮融资，跟投方汇集 Amazon、Cisco、Intel、AMD、ServiceNow 等企业级买方，反映出头部企业客户对该平台的认可。引入本身具备企业客户身份的战略投资人，为
              Scale 平台的技术成熟度提供了独立佐证。


              2025 年 7 月团队裁员 14%（削减约 200 名全职员工与 500 名外包人员），且精准集中于传统数据标注业务线，属于关键的滞后性采纳指标：表明随着 Google 与 OpenAI 撤离以及公司重心向
              GenAI Platform 和 Donovan 转移，其 RLHF 与基础数据标注业务体量较峰值出现实质性萎缩。与此同时，Snorkel AI、SuperAnnotate 与 Mercor
              等竞品相继升级企业级标注产品，官方产品主页与生态伙伴榜单更新频繁，表明尽管 Scale 正在战略换道，外部市场竞争依然十分活跃。


              自助服务端口的增长缺乏量化数据。Scale 的 API 文档与定价页面面向公众开放，表明开发者群体保持正常接入，但官方未公开任何活跃自助客户规模或付费转化率。Scale 客户案例官网上展示的
              Etsy、Instacart、Pinterest、Cohere 等企业客户，除品牌 Logo 外均无具体案例细节或量化成果指标，限制了对上述头部客户实际业务采纳深度的求证。
