      - number: '3.6'
        title: 展项
        blocks:
          - type: callout
            title: 政府安全准入资质是 Scale 最持久的竞争护城河
            body: >-
              Scale AI 持有的 DoD IL4 临时授权及 FedRAMP High 权威认证，加之专有 Donovan 防务 AI 智能体平台的协同，使其在涉密 AI
              数据与智能体业务领域构筑起近乎排他的独占地位。尚无公开披露的竞争对手具备同等规格的涉密准入资质。获取此类认证不仅动辄耗时数载，更要求企业持续重投安全合规基础设施；即便砸入巨资，短期内也绝难抹平这道多年期竞争壁垒。
            calloutType: strength
            claimRefs:
              - CP015
              - CP016
              - CP026
          - type: callout
            title: Meta 战略投资演变为牵制业务发展的竞争包袱
            body: >-
              Meta 的战略投资造成罕见的竞争冲突：Scale 最大股东 Meta 与最重要的客户 Google、OpenAI
              直接竞争。两家客户随后都缩减或结束合作，说明质量溢价不足以留住面临结构性利益冲突的客户。Scale 在诉讼中指控 Mercor 挖角，也显示竞对正试图利用这一弱点。
            calloutType: risk
