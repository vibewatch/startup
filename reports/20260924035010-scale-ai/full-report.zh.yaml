      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              驱动 Scale AI 目标市场扩容的最强劲引擎，是企业级市场对 AI 采纳的全面提速。McKinsey 2025 年 State of AI 调研报告显示，在至少一项业务职能中应用 AI 的机构占比同比从
              78% 跃升至 88%，其中 62% 正积极试验 AI 智能体。这种宏观扩张为上述四类买方客群带来了对数据标注、模型评测以及企业级 AI 部署工具的结构性需求。


              第二大驱动因素是大语言模型厂商不断增多。OpenAI、Meta、Anthropic、Google、Mistral、Cohere 等厂商都需要持续开展 RLHF
              迭代、安全基准测试和大规模能力评估。基础模型开发商越多，市场对专家级训练数据和中立评测基础设施的需求也越大。Scale 的 Evaluation 产品和 Scale Leaderboard
              正好卡位受益于这一浪潮。


              美国政府的 AI 投资是一项尤为坚挺的增长驱动力。依托持有的合规准入资质（DoD IL4、FedRAMP High）、Donovan 平台以及正在履约的防务合同，Scale 具备抢占更多联邦 AI
              预算的有利条件。随着 DoD 将 AI 融入侦察监视、后勤保障、网络安全及自主无人系统，防务 AI 支出预期将大幅攀升，而这些前沿场景均对可信数据基础设施存在刚性依赖。


              市场采用面临的制约同样不容忽视。第一，在 Meta 进行战略投资后，头部 AI 实验室正逐步摆脱对 Scale 的单一依赖而走向多元化采购，对公司营收产生潜在下行压力。第二，合成数据生成技术（部分头部 AI
              实验室已在内部自研使用）随着时间推移，可能会逐步削减特定场景对人工标注数据的需求。第三，来自低成本服务商（Appen、SuperAnnotate
              及离岸外包团队）的激烈竞争，不断挤压大宗标准化标注业务的利润空间。第四，企业级 AI 项目当下仍大量停留在试点或 POC 验证阶段——McKinsey
              指出多数机构仍处于测试阶段而非规模化推广——企业级平台收入的放量节奏可能因此滞后于技术采纳趋势。第五，政府采购周期漫长且高度绑定财政预算，导致合同收入呈现较强的波动性。
