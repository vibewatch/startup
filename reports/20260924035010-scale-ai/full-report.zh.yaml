  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Scale AI 在 AI 数据与基础设施市场的数个重叠细分赛道上展开竞争，各赛道的竞对格局各异。在核心的 AI 数据标注赛道，Scale 面临来自
              Appen（澳交所上市，为唯一的上市直属对标标的）、SuperAnnotate、Labelbox 以及 Surge AI 的竞争。针对 RLHF 及大语言模型训练数据这一垂直方向，Surge AI 与
              Mercor 是最为聚焦的直接竞对。至于企业级模型评测与基准测试，Labelbox 的评测套件和 Snorkel AI 的程序化弱监督标注构成了近场威胁。至于企业级 GenAI 平台部署，Scale
              则直面超大规模云厂商（AWS Bedrock、Azure AI、Google Vertex AI）、精品 AI 咨询机构及系统集成商——这是一批规模远超 Scale、资源储备更为雄厚的重磅对手。


              竞争格局中还包含相邻领域的传统既有势力：传统数据外包巨头（Accenture、Capita）、众包标注平台（Amazon Mechanical Turk、Remotasks），以及扮演「内部自建」替代力量的各大
              AI 实验室自建标注团队。很可能出现的新进入者包括正在内部自建标注与评测能力的大型科技公司，以及源自学术界或垂直领域 AI 背景的专业精品团队。


              当下最为关键的竞争变局来自 Meta 的战略投资：Meta 在成为 Scale 最大投资者的同时，直接引爆了同业竞争的利益冲突，进而导致 Scale 最大的两家 AI 实验室客户 Google 和 OpenAI
              终止或缩减了与 Scale 的业务往来。这种由自家投资人直接诱发核心商业客群流失的局面在创投界极为罕见。而体量更小的新兴竞对 Mercor，则在积极抓住这一脆弱窗口直接招揽客户，Scale 于 2025 年 9
              月提起的诉讼便是明证。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs: []
      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Appen（ASX: APX）是 Scale AI 标注业务唯一公开上市的直接可比对标企业。Appen 为全球企业和政府客户提供涵盖图像、视频、语音、文本和文档标注的 AI 训练数据。随着 AI
              标注市场逐步转向高品质及 LLM 专业化服务，Appen 公开财报显示的营收呈现持续下滑态势。Appen 业务覆盖全球企业与政府客群，与 Scale 的客户群存在一定重叠。Appen
              主要依托品类广度与成本效益展开竞争，有别于 Scale 主打的高端品质溢价路线。


              Labelbox 是一家总部位于旧金山的数据标注与模型评测平台，聚焦服务企业级 AI 团队。Labelbox 已从核心标注业务延伸至 RLHF 数据采集与模型排行榜，在 Scale
              的多条产品线上形成了正面竞争。Labelbox 的定价门槛低于 Scale 的企业级合同，并构建了面向关键品质标注任务的专家网络（Labelbox Expert Network）。此外，Labelbox
              还针对机器人 AI 训练推出了专有产品，而这块细分领域目前尚未被 Scale 公开重点强调。


              Snorkel AI 专注于利用 AI 辅助的弱监督技术进行程序化数据标注，旨在破除人工介入（human-in-the-loop）的产能瓶颈。Snorkel 主打需要构建 AI
              训练集但希望规避繁重人工标注的企业客户。Snorkel 的技术路径与 Scale 依托的人类专家模式存在根本分歧——Snorkel 致力于减少对人工标注的依赖，而 Scale
              的业务底座则高度倚仗人工质检水准。Snorkel 的客户矩阵囊括了大型企业及部分政府机构。


              SuperAnnotate 是一款面向企业级团队的 AI 标注平台，提供协同标注工作流、质量管控以及与 ML 流水线的深度集成。SuperAnnotate
              针对企业合规提供了针对性的安全特性，并已全面扩展至计算机视觉、NLP 及多模态标注。Mercor 则是新兴的挑战者，主打服务于 RLHF、模型评测和数据标注的 AI 人才撮合市场，由前 Scale
              核心贡献者创办。Scale 于 2025 年 9 月起诉 Mercor 涉嫌恶意挖角客户，说明 Mercor 正直接渗透 Scale 的企业客户池。


              Surge AI（现已并入更广泛的 RLHF 数据生态体系）专精于为大语言模型训练提供高质量人类反馈数据，其构建的专家标注员网络在模式上类似 Scale 但规模相对精简。Invisible
              Technologies 则主打 AI 驱动的业务运营与数据支持服务，与 Scale 的企业级自动化和标注能力构成竞争。
