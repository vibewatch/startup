      - - 基准情景
        - 政府合同按 85% 续约；GenAI Platform 达到 $75–100M ARR；Meta 贡献的 ARR 保持平稳；AI 实验室业务温和收缩
        - $350M–450M
        - 20–22x 远期 ARR（平台与服务综合估值倍数）
        - $7.7B–10.4B
        - 55% —— 大多数经营结果符合具备政府护城河的标注企业历史轨迹
