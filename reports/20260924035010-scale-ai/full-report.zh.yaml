      - number: '8.5'
        title: 建议、置信度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              对 Scale AI 的建议是继续研究；若入场估值大幅下调，可考虑有条件放弃。现有证据支持其核心资产质量——政府业务壁垒、数据标注基础设施、品牌和 Meta 背书——但以目前的证据质量和收入走势，尚不足以支撑
              $29B 估值。Meta 按战略收购逻辑设定入场价格，而非财务投资人所需的回报框架。缺少客户流失后的 ARR、政府合同续约安排、企业平台转化指标和现金跑道信息时，按 $29B 投资缺乏充分依据。


              建议置信度为中低，因为最关键的数据——政府合同 ARR、企业平台 ARR 和交易后现金头寸——均未公开。若这些数据经核实且表现良好，可考虑在 $15B 以下有条件买入；若估值为 $8–12B
              且附带严格的里程碑保护，也可考虑结构化买入。目前应保持审慎：本章 30 个研究问题中，有 8 个因关键信息属于非公开资料而仅部分解决或尚未解决。


              以下情况将使建议转为放弃（否决）：任何政府合同取消、另有企业客户以 Meta 利益冲突为由离开，或确认截至 2026 年 Q1 GenAI Platform ARR 低于 $30M。若政府合同如期续约、企业平台
              ARR 超过 $75M，且公司任命具备政府 AI 或企业平台运营经验的正式 CEO，则可考虑上调至有条件买入。核心尽调问题有望较快得到答案：从研究基准日起 12–18
              个月内，政府合同期权期和企业平台业务爬坡应能带来可观察的收入信号。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV017
              - CV029
              - CV030
              - CV031
