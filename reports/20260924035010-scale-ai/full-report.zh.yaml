      - number: '5.6'
        title: 支撑材料
        blocks:
          - type: callout
            title: 涉密资质构筑难以撼动的产品护城河
            body: >-
              Scale AI 取得的 DoD IL4 与 FedRAMP High 认证是其产品矩阵中最具防御性的护城河。公开的 AI 数据服务同业竞品均未获得同等涉密资质。此类认证历经 2–4
              年合规审核且需持续运维投入。对于 Donovan 平台及公共部门 Data Engine，此类准入筑起了极高的准排他竞争壁垒，新进入者几乎无法在短期内完成追赶复制。
            calloutType: strength
            claimRefs:
              - CE016
              - CE017
              - CE011
          - type: callout
            title: GenAI Platform 面临云厂商巨头正面竞争
            body: >-
              Scale GenAI Platform 正直面来自 Amazon Web Services (Bedrock)、Google (Vertex AI) 与 Microsoft Azure (Azure AI
              Studio) 的激烈竞争，各云巨头均以更低基建成本和强大分销网络推销企业级 LLM 定制方案。Scale 的差异化依赖优质标注管道的深度打通，但云厂商完全可通过投资并购或生态结盟补齐标注能力。GenAI
              Platform 作为 Scale 战略转型的核心支柱，无法单凭算力成本与基础架构能力抗衡巨头。
            calloutType: risk
            claimRefs:
              - CE021
              - CE023
          - type: callout
            title: 合成数据技术对标注商业模式构成中长期替代
            body: >-
              对 Scale AI 传统数据标注模式最具毁灭性的中长期潜在威胁来自合成数据：即在多类场景下直接替代人工标注数据集的 AI 生成式训练数据。以 Snorkel AI
              为代表的竞品正大力发展低人工依赖的弱监督标注方案。若合成数据在 LLM 预训练与微调中的质量全面匹敌人工标注，Scale 核心 Data Engine 的潜在市场规模（TAM）恐将遭受实质性侵蚀。Scale
              尚未公开披露在合成数据领域的战略布局，构成技术路线图的重大缺失。
            calloutType: risk
            claimRefs:
              - CE024
              - CE025
          - type: callout
            title: Scale Leaderboard 转化为开发者心智护城河
            body: >-
              Scale Leaderboard 是一项常被外界低估的战略级资产。通过将自身塑造为 LLM 性能评测的权威中立裁判，Scale 在 AI 这为 Scale
              在学术和开发者社区持续带来品牌曝光。工程师参考排行榜选择模型时，也会接触到 Scale 的评测服务，为企业付费评测和政府独立 AI 审计业务带来潜在客户。
            calloutType: insight
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户群细分画像
        blocks:
          - type: paragraph
            body: >
              Scale AI 的客群结构主要划分为三大垂直板块：AI 实验室与前沿模型开发商、Fortune 500
              强大型企业，以及美国政府与国防机构。各板块的采购决策人画像、采购周期、应用场景、营收结构和切换成本均明显不同。


              AI 实验室（历史上规模最大的业务板块）主要采购 Scale 的 RLHF 与模型评测服务，用于大语言模型的对齐训练与基准评测。此类客户在历史上涵盖 OpenAI、Google/DeepMind、Cohere 与
              Anthropic 等，属于具备直接采购自主权的高成熟度技术型买方，其采购节奏往往以季度为周期，与底层前沿模型训练算力排期高度绑定。该板块目前陷入结构性萎缩：Google 于 2025 年 6 月以 Meta
              入股引发直接业务竞争冲突为由全面终止合作，OpenAI 亦于同月大幅缩减合作敞口，标志着前沿模型厂商加速自建内部标注能力的行业趋势。


              企业客户群——包括 TIME、Etsy、Instacart、Pinterest 等——主要采购 Scale GenAI Platform 与 Data Engine，用于特定业务场景下的 AI
              应用落地，涵盖内容安全防御测试、智能推荐算法及电商 AI 等。该类买方决策链通常由企业 IT 与数据部门高管主导，采购周期长达 6–18 个月，伴随数年期的持续落地承诺。TIME TIME
              案例是目前最有说服力的公开证据：GenAI Platform 不到 2 个月便完成部署，并在生产环境中针对 TIME 的 AI 生成内容测试了 7,000 多种对抗性攻击向量。


              政府与国防客户——主要依托美国国防部（DoD）及各情报机构——通过多年期采办框架合同接入服务，采购场景包括军工数据集清洗标注、无人自主系统 AI 项目，以及面向涉密运行环境的 Donovan 平台。由于 DoD
              IL4 与 FedRAMP High 严苛合规门槛、涉密内网系统深度集成以及联邦采办惯性，该板块客户切换成本极高。从地理分布来看，Scale
              现阶段已披露的客户群体高度集中于美国本土，海外客户数量及国际业务收入占比从未公开披露。
