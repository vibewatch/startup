  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业模式与收入结构拆解
        blocks:
          - type: paragraph
            body: >
              Scale AI 的商业收入主要依托三大核心来源：(1) 企业级数据标注及 RLHF 训练服务；(2) Scale GenAI Platform（企业级生成式 AI 落地开发）；(3) 依托 Donovan
              平台与 Public Sector Data Engine 承接的美国政府及防务采购合同。此外，自助服务层构成了第四条体量较小、面向科研及实验性项目的补充收入来源。


              企业级数据标注业务在历史上一直是 Scale 最大的增长引擎，支撑了其从 2016 年创立到 2024 年 F 轮融资的迅猛扩张。该板块向大型企业及头部 AI
              实验室按项目或按标注处理量收取费用，覆盖数据标注、RLHF 样本采集及模型评测。其收费机制高度定制化且极不透明——Scale 从未对外公开其标注服务的企业级报价细则。自助服务层则提供 1,000
              个免费标注单元，超出部分按量计费，以此构建用于获取长尾小客户的免费增值服务机制。


              Scale GenAI Platform 代表了利润率更高、更贴近标准化 SaaS 的收入模式，专门面向亟需落地定制化 AI 应用的成熟企业。该板块深耕 Fortune 500
              客户群体，涵盖零售电商（Etsy、Instacart）及主流媒体（TIME）等多元行业。Scale
              为企业客户定制开发基于大语言模型的业务应用，并深度打通其专有数据流与内部审批工作流。尽管具体的定价细则未公开披露，但该板块具备衍生出高黏性软件订阅与托管服务费的商业想象空间。


              政府及防务采购构成了第三条正处于高速扩张且极具战略护城河属性的核心收入来源。Scale 凭借持有的 DoD IL4 与 FedRAMP High 安全准入认证，能够承接涉密与高精防务级 AI
              数据专项工程。Donovan 防务智能体平台与 Scale Public Sector Data Engine 深度切入防务采购生态，该市场的合同报价通常对外保密，且高度受制于联邦采购计划节点。拿下 DIU
              RCV 竞标以及正在履约中的 DoD 数据整理专项合同，充分印证了该业务线的商业转化落地成效。尽管该板块当下的营收规模很可能不及商业大宗标注，但鉴于其极为严苛的切换壁垒，其中长期发展潜力更大且持续造血能力更强。
