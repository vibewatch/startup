  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Scale AI 的投资逻辑建立在三根结构性支柱之上。第一，政府与防务：Scale 旗下的 Donovan AI 平台、DoD IL4/FedRAMP High
              认证以及深厚政府关系，构筑起一道兼具高切换成本、长合同周期且与 AI 实验室几无竞争重叠的持久收入底座。无论商业 AI 实验室业务如何变化，该板块作为战略资产本身就能支撑 $3–5B
              的最低估值。第二，数据护城河：Scale 历经九年打磨出标注质量基础设施、标注人员网络管理及模型评估工具链，难以被大规模快速复制。随着 Fortune 500 企业从 AI
              试验走向需要“人在回路”数据工作流的生产部署，这套基础设施使公司能够卡位获取企业 GenAI Platform 收入。第三，Meta 背书：作为全球最成熟的 AI 投资方之一，Meta 注资 $14.3B
              提供了财务与声誉层面的双重验证，不仅向市场释放了 Scale 数据基础设施战略价值的信号，更带来了不断扩大的客户采购关系。


              反向逻辑同样扎实。在 $29B 隐含估值下，Scale 交易倍数高达估计 ARR 的 58x–145x，而此时两大核心收入来源（Google 与 OpenAI）双双离场，创始人 CEO
              已经出走，商业模式正处于转型半途。标注商品化风险（合成数据、前沿实验室自建 RLHF）对 AI 实验室板块构成了结构性威胁。Meta 兼具投资人与客户的双重身份形成了治理阴影，既吓退了其他客户，又在 AI
              领域制造了史无前例的委托代理冲突。临时 CEO Droege 在 Scale 核心市场并无经过验证的过往战绩。要支撑 $29B 估值，只能寄希望于一组关于政府合同续约、企业平台转化以及 Meta ARR
              增长的乐观情景假设——而这些假设目前全无公开证据确认。基准情景则意味着按该入场价进入存在重大稀释风险。


              综合各项证据，Scale 属于深陷结构性逆境的高质量资产。尽调路径必须查明三点：政府业务底座是否稳固、企业平台 ARR
              增速是否足够快、管理团队能否在不引入稀释性条款的情况下完成转型。在这些问题获得解答前，现有证据并不支持按 $29B
              隐含估值进行投资。鉴于当前证据质量，合适的建议是有条件放弃——即仅在入场估值显著更低且里程碑考核达标时才考虑入场——或维持继续研究立场。
