      - number: '5.4'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >
              Scale AI 在信任体系与合规资质上重度下注，尤以政府客户方向为甚。公司公开披露的合规资质包括：SOC 2 Type II（企业安全控制审计）、ISO 27001（信息安全管理体系认证）、DoD IL4
              临时授权（美国国防部针对受控非密信息及部分密级的数据安全认证），以及 FedRAMP High 授权（美国联邦政府面向涉密与高影响系统的最高级别云安全认证）。


              针对 AI 安全，Scale 主动签署了 2024 年白宫 AI 安全自律承诺，涵盖 RLHF 安全工程实践、红队渗透测试以及负责任的 AI 部署规范。Scale 开创并贡献了
              WMDP（大规模杀伤性武器代理）基准，旨在评估前沿 LLM 是否经过有效安全对齐以防范危险生物或化学危害信息生成。WMDP 基准专注评测军民两用敏感领域的 AI 安全性，同时 Scale
              的测试与评估白皮书系统阐述了其针对负责任 AI 模型的测评框架。


              Scale
              的标注质量控制体系属于非公开专有技术，但公开信息显示其涵盖：任务定制化质检指南、高风险关键任务的多人交叉冗余标注、统计质量波动监控、资深审核员兜底升级机制，以及标注员一致性评分模型。尽管公司宣称具备业界领先的标注质量，但目前尚无独立的第三方公开质量审计报告予以核验。


              TIME 客户标杆案例（GenAI 平台在不到 2 个月内完成交付上线，针对性测试了 7,000+ 个对抗性攻击向量）部分印证了其红队工程攻防实力。中标 DIU 快速商业虚拟化（RCV）项目则表明 Scale
              技术通过了严苛的国防采办审查。这些实例构成技术能力的旁证，但仍不能完全等同于独立第三方的硬性技术审计。


              隐私与数据治理维度：Scale 的企业级标注业务深度接触包含商业机密或高敏信息的客户专有数据。SOC 2 Type II 与 ISO 27001 等资质为其数据治理提供了基础保障；面对政府客户，DoD IL4 与
              FedRAMP High 施加了极其严苛的数据隔离流转限制，Scale 已验证了其合规达成能力。但在日常标注管道中（特别是针对手握专有训练资产的顶级前沿 AI
              实验室），客户敏感数据的防泄漏保障仍是公开资料难以完全释疑的尽调核心关切。
            claimRefs:
