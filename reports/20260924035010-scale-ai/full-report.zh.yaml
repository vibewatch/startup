      - number: '4.4'
        title: 资金充足度与融资历程
        blocks:
          - type: paragraph
            body: >
              Scale AI 累计外部股权融资超过约 $1.6B+。融资历程涵盖：2016–2019 年种子轮与早期融资（投资方包括 Y Combinator、Index Ventures、Founders Fund
              等）；2021 年完成 $325M 的 E 轮融资，投后估值约 $7.3B；F 轮前累计股权融资约 $600M；以及 2024 年 5 月由 Accel 领投的 $1B 的 F 轮融资，投后估值达
              $13.8B，跟投方包括 Amazon、Meta、Cisco、Intel、AMD、ServiceNow、Nvidia、DFJ Growth、WCM，以及 Tiger
              Global、Thrive、Greenoaks、Wellington、Nat Friedman、Elad Gil 等老股东。F 轮融资同时包含初级新股（公司获得新现金）与老股转让（现有股东套现变现）。


              2025 年 6 月，Meta 完成约 $14.3B 战略投资以获取少数股权（约占已发行股份的 49%）。关键在于，Meta
              绝大部分投资款项直接分配给现有股东及已归属期权持有者，并未注入公司运营资金账户，符合老股交易架构。Meta 交易为 Scale 运营业务带来的净新增初级资金规模尚未完全披露。Scale
              仍保持独立法人实体结构，Meta 仅持有少数股权。


              缺乏公开财务报表的前提下，账面现金储备无法确证。F 轮于 2024 年 5 月完成交割，若其中相当比例属于初级资本（注资入账 $500M+），结合 Meta 交易中的初级部分，Scale
              在当前资金消耗速度下预计拥有 3 年以上的充足跑道。2025 年 7 月裁撤 200 名员工和 500 名外包人员，叠加大规模退出基础数据标注，属于旨在延长跑道、提升现金效率的控费措施。


              具体资金消耗率未公开披露。裁员前支出体量（1,400+ 名员工加上高额标注外包支出）反映月度资金消耗可观。裁员落地后，现金效率理应显著改善。Scale 尚无公开披露的债务融资工具或项目融资负债。Meta
              交易构成了结构性依赖（Meta 既是核心股东，又是相关 AI 服务的大客户），但未见已披露的排他性财务契约或业务限制。
