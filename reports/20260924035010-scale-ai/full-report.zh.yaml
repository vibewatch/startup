          - type: callout
            title: 数据标注大宗商品化是不可逆的长期结构性威胁
            body: >-
              Appen 公开披露的营收下滑态势，是纯数据标注市场大宗化滑坡的风向标先行指标。Scale 于 2025 年 7
              月宣布的裁员重点削减了数据标注相关岗位，从侧面印证了管理层内部已清醒认识到通用标注赛道正面临巨大的生存挤压。若合成数据技术与 AI 辅助标注工具进一步大幅侵蚀对人工标注的需求基数，Scale
              必须全力突围转型至模型评测、企业级 GenAI 平台以及防务安全等新兴业务——尽管上述板块正处于增长轨道，但在缺乏公司详细财务披露的前提下，其业务体量能否支撑起 Scale 当前的高昂估值仍无从验证。
