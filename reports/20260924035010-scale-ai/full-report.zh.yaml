  - id: TV001
    title: 投资建议汇总表
    columns:
      - 评估维度
      - 评估结论
      - 依据
      - 适用前提 / 限定条件
    rows:
      - - 投资建议
        - 继续研究 / 有条件放弃
        - 估值锚定战略买家逻辑定价；财务投资人获取合理回报要求入场门槛显著调低
        - 若政府合同交付节奏获证实且 GenAI Platform ARR 突破 $75M，则评级上调至“有条件买入”
      - - 置信度
        - 中低（35%）
        - 核心变量（政府业务 ARR、企业平台 ARR、现金跑道）均属非公开数据，尚未得到证实
        - 若 2026 年 Q2 收入数据验证了基准情景发展轨迹，置信度将提升至“中高”
      - - 风险评级
        - 高
        - 叠加四大高危风险（集中度、CEO 更迭、Meta 利益冲突、转型执行）；此前未曾展现应对此类风险共振的能力
        - 若政府合同顺利续约且管理层企稳，风险评级可下调至“中”
      - - 估值立场
        - 隐含 $29B 估值对财务投资人而言显著高估
        - 58x–145x 的预估 ARR 倍数由战略收购方逻辑推高；财务回报模型要求入场估值压降至 $8–15B
        - 合理价值区间：基准情景 $8–12B；乐观情景 $15–22B
      - - 决策指引
        - 若无法调阅尽调数据室深入核实，切勿在 $29B 估值下投资
        - 基准情景下，在 $29B 入场预期收益为负；该投资逻辑需多重乐观变量同时兑现
        - 申请调阅非公开尽调数据室；严格执行 <$15B 的估值纪律；磋商基于里程碑达成的估值调整机制
    notes: 投资建议对证据充分度和价格都高度敏感。本评估受限于公开信息，并采用基准情景估值框架。若入场价格改变，或数据室核实了关键 ARR 指标，结论可能转为“有条件买入”或“继续观察”。
