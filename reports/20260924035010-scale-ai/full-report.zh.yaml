      - number: '4.6'
        title: 支撑材料
        blocks:
          - type: callout
            title: 客户集中度风险——Google 与 OpenAI 退出
            body: >-
              Scale AI 的标注业务收入高度集中于少数大型 AI 实验室客户；据报道，在 2025 年 Meta 投资前，Google 曾是 Scale 的最大客户。Meta 投资落地后，Google 与 OpenAI
              均已终止或大幅削减与 Scale 的合作。客户流失带来的财务影响尚未完全明朗但可能极为重大——单季度内流失前三大 AI 实验室客户中的两家，构成严峻的短期营收阻力，未获取 Scale 财务报表前难以精确量化。
            calloutType: risk
            claimRefs:
              - CI022
              - CI023
              - CI025
          - type: callout
            title: 市销率估值倍数无法验证
            body: >-
              基于 Meta 交易中 Scale 隐含的 $29B+ 估值，在缺乏公开财务数据的情况下，隐含市销率倍数无法验证。若 Scale 的 ARR 落在 $200–500M
              区间，隐含倍数（58x–145x）将处于超高增长溢价 SaaS 的估值区间，这必须依赖高增速、强 NRR
              与毛利率扩张提供支撑——然而上述指标皆无公开数据佐证。尽调投资方在对估值合理性做出研判前，必须获取审计后营收数据。
            calloutType: risk
            claimRefs:
              - CI021
              - CI022
              - CI024
          - type: callout
            title: 充足资本储备为商业模式转型提供缓冲
            body: >-
              尽管客户流失带来短期营收逆风，Scale AI 充裕的资金实力（估算账面现金 $500M–$1B+）与裁员后成本结构为其推进企业与政府业务转型提供了数年跑道。来自 Meta
              的战略投资强化了结构稳定性，降低了短期实现盈利的紧迫性。充足的资本缓冲是抵御转型执行风险的核心财务缓释因素。
            calloutType: strength
            claimRefs:
              - CI016
              - CI017
              - CI018
              - CI019
          - type: callout
            title: Appen 作为标注业务经济学的公开参照物
            body: >-
              Appen（ASX: APX）是 Scale AI 标注业务唯一公开上市的直接可比标的。Appen 的毛利率水平（历史区间 25–40%）、收入下滑趋势及众包标注运营模式，为研判 Scale
              核心板块的经济学特征提供了最可靠的公开参照。关键差异在于：Scale 聚焦高客单价优质标注，人员规模小于 Appen 的海量众包网络，且已向高毛利的平台与政府板块多元化拓展。Appen
              的营收下滑印证了大宗通用标注行业面临的结构性逆风。
