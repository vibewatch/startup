      - number: '6.3'
        title: 标杆客户成效与证据质量
        blocks:
          - type: paragraph
            body: >
              Scale AI 已披露的关键标杆客户覆盖传媒出版、国防安全、电子商务与前沿 AI 研发领域。时代周刊（TIME Media）案例是目前可信度最高、成果最清晰的公开证据：Scale GenAI Platform
              针对 TIME 正式刊发前的 AI 生成内容，完成了超过 7,000 个对抗性攻击向量的渗透测试。这是在真实生产环境中落地的内容安全防线，拥有明确、可量化的结果指标，整个部署周期不到 2 个月，已被 Scale
              作为标杆收录于官方客户主页。


              Meta 兼具 Scale 最大战略投资方（2025 年 6 月收购约 49% 股权）与持续放量的高价值 RLHF 客户双重角色。这种深度绑定既锁定了关键业务基本盘，又带来了复杂的治理隐患：Meta
              作为核心股东拥有的特权信息知情权，叠加其客户身份，令其他审视 Scale 数据安全隔离措施的外部客户产生了极大的数据保密与利益冲突疑虑。


              美国国防部与情报界客户群体的落地证据，主要见于 Scale 官方博客披露的国防部联合作战数据清洗合同，以及 Donovan
              平台在国家安全场景的实战部署。受制于保密条例，具体涉密采购机构名称并未对外公布，但这已成为公开资料中确定性极高的政府落地实证，并与 Scale 获得的 DoD IL4 及 FedRAMP High
              资质形成了相互印证。相比之下，Etsy、Instacart、Pinterest 等企业客户仅展示 Logo，缺乏详尽业务案例或投产成效数据。


              2025 年 9 月爆发的 Mercor 诉讼案（Scale 指控其涉嫌不正当抢夺客户与恶意挖角）从反面提供了间接证据，证明 Scale
              拥有一批极具商业价值且招致竞品公然觊觎的成熟企业客户，但也暴露了其大客户续约防守上的脆弱性。Snorkel AI、SuperAnnotate 与 Mercor 的产品动态显示，企业级 AI
              数据与标注平台市场需求依然旺盛，在印证行业大方向的同时，也凸显了市场竞争的日趋白热化。
