              本分析尚无法准确量化 Google 和 OpenAI 离开 Scale AI 所造成的具体收入冲击。若这两大客户合计占到 Scale 营收的
              30–50%（与其作为最大/主力客户的定位相符），则每年潜在的收入缺口可高达数亿美元。在 Scale 正式按业务板块披露营收构成之前，企业端与政府端战略转型的真实市场空间仍无法公开求证。
