      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Scale AI 业务横跨防务 AI、企业级数据资产处理与 AI 安全三大前沿监管重点领域。核心监管风险聚焦于三方面：美国政府防务 AI 合规框架（包括 ITAR 军品管制、技术出口限制、AI
              安全硬性标准）、适用于企业专有数据处理的数据隐私与 AI 治理法规，以及由 Mercor 诉讼案引发的不正当竞争与司法纠纷。


              防务 AI 维度上，Scale 拥有的 DoD IL4 与 FedRAMP High 联合认证说明其合规底盘扎实。公司亦主动签署了白宫 AI 安全自律承诺，展现出拥抱前沿 AI
              治理的主动姿态。该领域最主要的监管风险在于：面向 AI 模型与数据服务的出口管制政策存在潜在收紧可能，特别是若 Scale 向国防承包商交付的 AI 服务涉及敏感技术转移，或将招致更严苛的 ITAR
              军规审查。美国国会对 AI 的监管审查持续加码，Scale 亦曾出席国会听证会陈词。


              数据隐私维度，Scale 企业级标注业务深度处理客户商业机密数据。欧盟《人工智能法案》（EU AI Act）、通用数据保护条例（GDPR）及美国各州陆续出台的 AI 立法，构成了持续演进的合规义务。Scale
              安全合规主页显示其持有生效中的 SOC 2 Type II 与 ISO 27001 认证，表明企业级合规体系运转正常。针对 Mercor 提起的诉讼（Scale AI 诉 Mercor，2025 年 9
              月）指控其涉嫌客户抢夺与商业机密侵权。尽管判决结果尚难预料，该案带来了诉讼不确定性、管理层精力分散以及潜在反诉风险。目前诉讼尚未对 Scale 核心业务运转或涉密准入资质构成直接威胁。
