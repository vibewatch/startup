      - number: '8.4'
        title: 可比公司组与估值定位
        blocks:
          - type: paragraph
            body: >
              Scale AI 横跨多个市场，估值可参照几套不同框架。关键矛盾是：公司当前大部分收入仍来自数据标注与处理服务，市场却按前沿 AI 平台公司为其定价。因此估值框架并不匹配：按标注服务倍数（Appen：0.5–2x
              ARR）估值为 $100M–1B；按国防 AI 平台倍数（Palantir：25–30x ARR）为 $5B–15B；按前沿 AI 平台倍数（OpenAI 私募轮：100x+ ARR）则超过
              $20B。适用哪套框架，取决于 Scale 未来哪块业务成为主要收入来源。


              Appen (ASX: APX) 是最具启发意义的负面可比对象：这家上市数据标注公司在各大 AI 实验室自建标注能力并削减 RLHF 支出后，营收暴跌 60–80%。Appen 的市值从巅峰期的约 AUD
              $3.5B 跌至客户流失后的约 AUD $250M，显示标注商品化会显著压低估值。Scale 与 Appen 的关键差异在于政府业务：Scale 的国防业务提供了 Appen 所没有的收入底座。


              Palantir (NYSE: PLTR) 则提供了政府 AI 平台的可比参照：这家企业深度融入 DoD 及情报界（IC），客户切换成本极高，手握多年期政府订单，凭借强劲增长叙事享有 25–30x ARR
              倍数。Palantir 市值在估计 $2B+ ARR 基础上已突破 $100B，表明以政府业务为锚的 AI 平台能够维持高倍数。然而，Palantir 在政府收入之外已验证了持续的商业落地能力；而 Scale
              的商业模式转型尚未规模化验证。


              Labelbox（非上市，估值约 $1B）可作为缺乏政府护城河的标注基础设施可比公司。其估值通常仅为 8–10x ARR，远低于 Scale 的隐含倍数。两者的估值差距表明，市场为 Scale 的政府护城河及
              Meta 带来的战略期权价值计入约 $20B 以上溢价。要证明这部分溢价合理，仍需核实政府合同周期和企业 ARR 增长轨迹，才能判断这部分溢价是否合理。
