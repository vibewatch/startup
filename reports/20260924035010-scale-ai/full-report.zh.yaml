      - number: '4.2'
        title: 定价策略、GTM 路径与销售能效
        blocks:
          - type: paragraph
            body: >
              Scale AI
              的市场拓展（GTM）路径主要依托自上而下的企业级销售牵引，并辅以自下而上的产品驱动增长（PLG）自助服务层。企业销售端高度依赖专属大客户销售团队、商务深耕关系以及方案架构工程师，与客户协同界定并交付海量级标注或企业级平台系统。企业级合同均遵循专属定制报价并绑定专项运营支持与严苛的
              SLA 服务承诺，说明其客单价（ACV）高企，且相较于典型 SaaS 软件企业具有更漫长的商务谈判周期。


              数据标注服务的定价通常按处理量或具体项目核算。Scale 的自助服务层确立了基准公开价格锚点：在消耗完首批 1,000
              个免费单元后，用户需按公开披露的单价付费购买。企业级客户针对大规模标注工程进行专项价格谈判，合同往往打包了专属标注员梯队、质保工作流及技术系统集成。官方未公开披露任何折扣政策或典型交易合同规模。


              销售周期跨度与获客成本（CAC）均未公开披露。作为一家数据服务与基础设施提供商，Scale 的企业级销售周期大概率较为漫长（通常在 3–12
              个月），且伴随大量的专业交付与咨询服务。政府及防务合同的销售周期更为漫长（从启动立项到产生首笔收入往往耗时 12–36 个月）。净留存率（NRR）目前无从验证——Google 与 OpenAI 于 2025
              年的客户流失意味着 AI 实验室板块 NRR 严重承压，但具体财务影响仍不清楚。


              渠道包括大客户直销、政府与防务采购关系（DoD、情报界）、AI 实验室合作，以及供开发者和研究人员使用的自助 API / 平台。Scale
              与核心战略投资人（Accel、Amazon、Meta、Nvidia、Cisco）的股权绑定为其开辟了联合销售与客户转介的高阶战略渠道，但具体的商业增量贡献并未公开披露。


              Scale 的数据标注业务高度依赖少数头部 AI 实验室客户（Google、OpenAI、Meta、Anthropic）。Meta 入股后，Google 与 OpenAI 于 2025
              年终止或大幅缩减合作，给核心标注业务带来显著的客户集中度与营收压力。
