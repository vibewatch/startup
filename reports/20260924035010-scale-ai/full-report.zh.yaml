      - number: '4.3'
        title: 成本结构、毛利率与资本强度
        blocks:
          - type: paragraph
            body: >
              Scale AI 的营业成本以人力成本为主，即执行数据标注、RLHF 反馈采集以及模型评估任务的众包标注人员。Scale 全球累计向贡献者网络支付超过
              $1B，印证了核心标注业务的高劳动密集度特征。与纯软件业务相比，这种人力成本在结构上拉低了数据标注的毛利率。公开上市的可比标注公司 Appen 行业数据表明，标注业务毛利率一般在 25–45%
              区间，且随着市场大宗商品化而持续承压走低。


              Scale GenAI Platform 与评估产品因软件复用度更高、单位产出人力依赖更低，毛利率理应高于标注业务。然而，企业级 GenAI Platform
              落地依然需要大量专业服务与运营投入，使得利润率难以达到纯 SaaS 水平。政府数据服务合同通常受采购费率框架限制，毛利率往往落在 15–30% 区间。


              营业支出涵盖研发与工程（构建标注工具体系、GenAI Platform、Donovan 及评估基础设施）、销售与营销（企业销售团队与政府业务拓展），以及一般行政费用。2025 年 7 月裁员前，Scale 拥有约
              1,400 名员工，裁员后约为 1,000 名；14% 的正式员工裁撤加上 500 名外包人员削减，大幅降低了营业支出，主要精简了数据标注成本基础。这与公司通过剥离低毛利大宗标注人力以提升综合毛利率的战略相吻合。


              Scale 业务模式的资本密集度主要体现为运营资金占用（向标注贡献者支付报酬），而非实体资本开支（硬件、机房设施）。基础设施成本（用于标注工具及模型评估的云算力）属于次要资本开支。相较硬件 AI 企业，Scale
              资金使用效率较为可观，但劳动密集度明显高于纯 SaaS 模式。$1B 的 F 轮融资与 Meta 战略投资提供了充足资金储备，支持公司向高毛利的企业与政府业务转型。
