      - number: '8.2'
        title: 估值背景与当前融资
        blocks:
          - type: paragraph
            body: >
              Scale AI 当前约 $29B 的隐含估值源于 Meta 在 2025 年 6 月以 $14.3B 收购公司约 49%
              股权。该交易经由多家独立知名媒体（TechCrunch、CNBC、Reuters）报道，在本分析中视为已证实。公司隐含总估值（$29B）基于报道的约 49% 股权推算；具体的投前 /
              投后处理方式与股权结构表均未公开披露。关键在于，Meta 交易所得款项已分配给既有股东，并未留存至 Scale 资产负债表用于日常运营，导致 Scale 实际营运资金与现金跑道仍不明确。


              在 $29B 隐含估值下：

              - 低 ARR 估计（$200M）：145x 收入倍数 —— 与 2024 年初前沿 AI 实验室估值倍数一致，但放到一家正经历客户流失的公司身上，倍数极端偏高

              - 中 ARR 估计（$350M）：83x 收入倍数 —— 相当于市场巅峰时期的高增长企业级 SaaS 估值水平

              - 高 ARR 估计（$500M）：58x 收入倍数 —— 唯有在政府 ARR 迅猛增长且企业平台转化提速的前提下才算合理


              Scale 融资史上最直接可比的事件是 2024 年 5 月的 Series F 轮，按约 $200–300M 的估计 ARR 估值 $13.8B（46–69x ARR）。尽管同期 Scale
              两大客户相继离场，Meta 交易仍在约 13 个月内使该估值翻倍。这种动态说明 Meta 给出的估值反映战略收购逻辑（Meta 需要专有 RLHF 数据基础设施），而非财务回报最优。因此，按 $29B
              隐含估值共同投资者支付的是战略买家定出的价格，而不是独立财务投资者可接受的回报框架。这是估值纪律的关键症结：战略买家愿意承担财务投资人无法承销的溢价。尽调路径必须为财务投资人敲定一个入场价格上限。


              股权稀释与优先权压力尚属未知。在 Meta 交易前，Scale 累计筹集了约 $1.6B 股权资金；其优先股堆叠、清算权以及参与型与非参与型优先股结构均未公开披露。任何按 $29B
              隐含估值入场的财务投资人，都必须审慎评估悲观情景下优先权清算瀑布对普通股回报的冲击。
