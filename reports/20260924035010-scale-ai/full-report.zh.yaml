figures:
  - id: FO001
    title: Scale AI 发展历程时间线
    type: timeline
    summary: 梳理从 2016 年创立到 2025 年 Meta 投资及组织转型的关键里程碑，重点标出融资事件、产品发布及负面事件。
    data:
      items:
