      - number: '6.4'
        title: 客户留存、续约韧性与满意度信号
        blocks:
          - type: paragraph
            body: >
              Scale AI
              从未公开披露任何净收入留存率（NRR）、毛收入留存率（GRR）、客户流失率、续约率、总客户数或客户满意度（NPS/CSAT）指标。这对投资分析构成了实质性的信息空白。下文所有留存分析，均基于合同形态、客户迁移成本、竞争格局以及负面突发事件所作出的结构性推演，而非源自官方披露数据。


              政府与防务客户是其留存韧性最强的客群底盘。多年期国防采办合同、DoD IL4 与 FedRAMP High 资质高墙、涉密内网系统深度嵌合，以及政府采办极高的迁移摩擦，共同构筑了强大的客户绑定黏性。2024
              年美国国防部联合作战数据清洗合同以及 Donovan 平台在涉密场景的持续落地，表明该板块年度续约率极高；结合类似军工 IT 合同的历史续约参照，推算续约率维持在 90–97%
              高位。该业务底盘的韧性，在很大程度上独立于前沿 AI 实验室客群的动荡。


              企业级客户（如 TIME、Etsy、Instacart、Pinterest）很可能签署的是 12–36 个月合同，到期具备续约选择权。在缺乏 NRR
              数据的前提下，无法证实“增购扩张（Land-and-Expand）”模式是否运转顺畅。GenAI Platform 理论上构成了从 Data Engine 向上增购的转化路径，TIME
              的成功交付也验证了从标注概念验证向生产级安全平台演进的可行性，但增购转化率或客单价扩张等硬性财务指标均无公开披露。


              前沿 AI 实验室板块则处于明显的业务收缩期。Google 与 OpenAI 于 2025 年 6 月双双终止合作，据估算占历史 AI 实验室板块收入的
              20–40%（该数据未获官方披露，系依据客户重要性公开报道所作测算）。其余 AI 实验室客户（如 Cohere 等）同样面临自建内部标注团队的结构性诉求。截至本次调研，G2、Gartner Peer
              Insights 或 Capterra 等主流企业软件评测网站均未收录关于 Scale AI 企业级平台的独立用户评价，导致客户实际满意度完全无法量化求证。
