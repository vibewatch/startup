          value: 29000
    notes: >-
      金额单位均为百万美元。柱状图代表不同 ARR 与估值倍数组合下的隐含企业价值。$29B 入场基准线表明，仅有最乐观情景能接近该入场价格。所有基准与悲观情景均意味着相比入场价格大幅折价。ARR
      估算与估值倍数均为分析师假设，非公司官方指引。
  - id: FV003
    title: 估值与回报区间
    type: range
    data:
      items:
        - label: 悲观情景——估值
          low: 1500
          mid: 1750
          high: 2000
          unit: $M
        - label: 基准情景——估值
          low: 7700
          mid: 9300
          high: 11250
          unit: $M
        - label: 乐观情景——估值
          low: 17500
          mid: 21000
          high: 25500
          unit: $M
        - label: 战略收购方估值（Meta 隐含估值）
          low: 27000
          mid: 29000
          high: 32000
          unit: $M
        - label: 建议财务投资人入场估值上限
          low: 8000
          mid: 11000
          high: 14000
          unit: $M
    notes: >-
      金额单位均为百万美元。区间代表分析师基于 ARR 情景分析及可比倍数的估算。“建议财务投资人入场估值上限”是在基准与乐观情景概率加权结果下仍能提供正期望值的最高入场价格。在任何赋予基准情景权重超过 40% 的情景加权下，以
      $29B 入场都将导致期望值为负。
  - id: FV004
    title: 投资核心评估指标
    type: kpi
    data:
      items:
        - label: 市场规模吸引力
          value: 7/10
          unit: score
          trend: stable
        - label: 产品与技术实证
          value: 7/10
          unit: score
          trend: stable
        - label: 政府业务壁垒强度
          value: 8/10
          unit: score
          trend: stable
        - label: 管理层稳定性
          value: 3/10
          unit: score
          trend: down
        - label: 客户留存质量
          value: 4/10
          unit: score
          trend: down
        - label: 财务能见度
          value: 2/10
          unit: score
          trend: unknown
        - label: 估值合理性（财务投资人视角）
          value: 2/10
          unit: score
          trend: down
        - label: 证据质量（各章节）
          value: 5/10
          unit: score
          trend: stable
        - label: 风险调整后回报预期
          value: 3/10
          unit: score
          trend: down
    notes: >-
      评分区间 1–10 分；10 分为最优。政府业务壁垒和产品实证是最强支柱。管理层稳定性、财务能见度以及估值合理性最为薄弱，反映出 CEO
      更迭、缺乏公开财务披露以及战略买方定价的入场估值。投委会（IC）整体建议受这后三项最低分项主导，在当前隐含价格下，这些因素构成了阻碍投资的一票否决项。
