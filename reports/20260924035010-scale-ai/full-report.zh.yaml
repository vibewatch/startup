      - number: '2.2'
        title: TAM、SAM 与 SOM 的多视角规模测算
        blocks:
          - type: paragraph
            body: >
              公开渠道无法获取具备足够颗粒度且能支撑高置信度估值分析的 AI 数据服务 TAM/SAM/SOM 精确数据。此处呈现的数值，是基于公开市场代理指标、投资者报道及同业披露规律综合得出的、受证据约束的估算。


              截至 2025 年，全球 AI 数据服务与基础设施——包含标注、RLHF、评测以及 GenAI 平台工具链——的总可用市场（TAM）预估为每年 $5 to $20
              billion，该宽幅区间反映了市场的快速演变以及各分析机构估算口径界定不一带来的高度不确定性。该估算锚定于 McKinsey 的调研发现：受访机构中有 88% 目前已在至少一项业务职能中应用 AI（高于
              2024 年的 78%）；同时 Stanford HAI AI Index 2025 显示 AI 领域的投资出现急剧加速。若每家引入 AI 的 Fortune 1000 企业每年在 AI 数据及评测基础设施上支出
              $1M–$10M，仅企业端总支出便达 $1B–$10B，AI 实验室还将带来可观的增量需求。


              针对 Scale AI 的可服务市场（SAM）——即拥有复杂 AI 数据需求且具备采购高品质服务预算的大型企业、头部 AI 实验室及美国政府机构——预估为 $2 to $8 billion，这印证了 Scale
              扎根于高端品质市场而非低成本大宗标注赛道的市场定位。其可获取市场（SOM）——即 Scale 在未来 3-5 年内切实可捕获的业务规模——预估为 $500M to
              $2B，这与其后期私募估值所隐含的企业与政府端收入轨迹大体一致。公司未公开披露营收数据；上述估算伴随极高不确定性，亟待实际财务数据加以印证。
