  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与客户工作流
        blocks:
          - type: paragraph
            body: >
              Scale AI 的产品组合针对 AI 开发中的四大核心工作流痛点：(1) 为模型开发生产高质量训练数据；(2) 采集人类反馈以进行大语言模型对齐与 RLHF；(3) 独立评测 AI
              模型的安全性与能力边界；(4) 在企业级规模部署定制化生成式 AI 应用。此外，第五条产品线 Donovan 专门服务于国防与情报机构的特定任务 AI 工作流。


              Scale Data Engine 是 Scale 的基石核心产品。它支持 AI 团队跨模态（文本、图像、视频、音频、3D）采集、清洗、标注并质检训练数据集。其客户工作流为：AI
              工程师定义标注规范与质量标准；Scale 贡献者网络在专有标注工具体系与质检管道引导下执行标注任务；标注完毕的数据集回流至客户的 MLOps 流程中。Data Engine 贯穿从预训练数据清洗、RLHF
              到模型评测的完整研发全生命周期。


              Scale GenAI Platform 聚焦企业级 AI 落地工作流。企业客户（涵盖零售、媒体、金融、政府等领域的 Fortune 500 强企业）接入专有数据与业务场景诉求，Scale 将其转化为定制化
              LLM 驱动型应用。该平台涵盖数据接入、LLM 微调、RAG 管道编排及生产环境部署支持，专门面向渴望部署定制 AI 却缺乏自建底层 ML 专业能力的成熟企业。


              Scale Evaluation 与 Scale Leaderboard 提供第三方独立基准评测服务。AI 实验室与大型企业利用 Scale
              Evaluation，从复杂推理、安全对齐、代码生成及专业领域知识等多维度评测 LLM 能力。Scale Leaderboard 则是面向开发者的公开 LLM 性能排行榜，帮助 Scale 确立了 AI
              领域公认权威第三方评测机构的地位。WMDP（大规模杀伤性武器代理）基准则是其在 AI 安全评测领域的重要专项贡献。


              Donovan 依托 AI Agent 矩阵为美国国防部（DoD）、情报界（IC）及民事政府机构的关键任务工作流赋能。它深度集成涉密数据源，支持合规保密运行环境，为防务与情报决策提供 AI
              辅助支持。Donovan 已在获得 DoD IL4 认证的环境中完成部署，构成 Scale 在政府防务板块的核心竞争壁垒。
            claimRefs:
