      - number: '2.5'
        title: 测算缺口、矛盾估算与尽调问题
        blocks:
          - type: paragraph
            body: >
              AI 数据服务的市场规模测算存在显著的结构性不确定性。尚无公开分析师报告能就 AI
              数据标注目标市场提供口径一致、颗粒度精细的拆解数据。各方估算差异极大，主要取决于核算边界是仅局限于人工数据标注服务，还是进一步延伸至 AI 模型评测、企业级 AI 工具链及政府 AI
              平台支出。本章给出的宽幅区间（$5B–$20B TAM）如实反映了分析机构之间的真实分歧与市场边界的模糊性，而非测算失误所致。


              合成数据市场的兴起进一步增加了规模测算的不确定性：部分预测认为，合成数据将在未来 3–5 年内大幅替代许多任务中的人工标注，从而压缩 Scale 这类厂商的 TAM。另有观点认为，人类评测、RLHF
              和对抗性红队测试始终需要人类判断，且需求会随模型厂商增多而上升。这是投资逻辑层面的关键不确定性，潜在投资者须通过对头部 AI 实验室和 Scale 客户的一手调研加以判断。


              Scale AI 公开披露的业务数据（完成 15B 次标注决策、向全球贡献者累计支付超 $1B）仅能体现业务体量规模，无法反映真实的营收状况。在缺乏营收披露的情况下，外界根本无法验证究竟是哪个业务板块主导了
              Scale 的营收结构，亦无法断定企业级平台与政府业务能否填补 AI 实验室客户流失造成的收入缺口。Google 与 OpenAI 这两大主力客户的离场——假定二者位列 Scale 营收贡献前 10
              大客户——留下了具体金额未知的营收断层，亟需企业端与政府端转型来弥补。对这两大客户流失造成的收入冲击进行量化，是 Scale 投资论证中最为关键且悬而未决的市场测算课题。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
      - number: '2.6'
        title: 展项
        blocks:
          - type: callout
            title: 企业级 AI 采纳创造了庞大且持续扩张的市场——但 Scale 必须赢下企业客户，而不能仅依赖实验室
            body: >-
              McKinsey 调研显示 88% 的机构已在至少一项业务职能中应用 AI（62% 正在试验 AI 智能体），印证了这一庞大且高速成长的市场红利。然而，Scale 过往的营收高度集中于 AI
              实验室（而这类客户当前正相继离场）。由 Cisco、Etsy、Instacart 及 TIME 等客户为代表的企业级客群，必须成为接棒的核心增长引擎。目前企业级 AI
              整体仍处于试点阶段，意味着收入的实质性释放将比技术采纳曲线滞后 12–24 个月。
            calloutType: insight
