    title: 工作流与用例对照表
    columns:
      - 用户目标任务
      - 原有工作流
      - Scale 解决方案
      - 可量化收益
      - 局限性
    rows:
      - - 使用标注数据训练机器学习模型
        - 由内部团队或众包平台手动标注；耗时长且一致性差
        - Scale Data Engine：通过 API 提交原始数据；接收已标注数据集；自动化 QA
        - 吞吐量较内部团队提升 10x+；一致性更高（公司宣称）
        - 定价需单独协商；Meta 投资引发冲突后 AI 实验室客户正在流失
      - - 按人类偏好对齐大语言模型（RLHF）
        - 搭建内部偏好采集流程；聘请专家评估员
        - Scale RLHF：规模化获取专家人工反馈；配对标注；偏好排序
        - 为大语言模型对齐训练提供高质量专家反馈
        - OpenAI 与 Google 已终止合作；与 Meta 合作虽在扩大但存在集中度风险
      - - 为企业部署定制生成式 AI 应用
        - 由内部机器学习工程师自研；通常需 12–24 个月
        - Scale GenAI Platform：从数据到定制大语言模型应用耗时 < 2 个月（TIME 案例）
        - TIME 案例：在 <2 个月内完成部署；测试了 7,000+ 种攻击向量
        - 超大规模云厂商（AWS、Google、Azure）以更低成本提供同类平台
      - - 独立评测大语言模型的能力与安全性
