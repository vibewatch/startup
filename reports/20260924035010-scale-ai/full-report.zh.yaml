      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >
              Scale AI 的情景分析取决于三个核心驱动变量：（1）政府 / 国防 ARR 增长轨迹及现有 DoD 合同的续约率；（2）商业转型中企业 GenAI Platform 的客户转化率与 ARR
              增速；（3）Meta 客户关系的持久性，以及 AI 实验室客户的进一步流失或新增。


              乐观情景：政府合同以 >90% 的比率续约，并随着新增 Donovan 项目中标而进一步扩张；在 Fortune 500 企业生产部署带动下，企业 GenAI Platform 到 2027 年实现 $150M+
              ARR；Meta 将数据采购规模扩大至 $300M+ ARR；临时 CEO Droege 稳住运营，并在 12 个月内物色到知名永久 CEO。基于这些假设，2027 年总 ARR 将达到 $600M–800M，按
              25–30x 前瞻倍数计算，估值达 $18–24B。这意味相对 $29B 入场价仅有温和上行空间，且唯有多项利好同时兑现才能达成。


              基准情景：政府合同以 85% 续约并温和增长；企业 GenAI Platform 到 2027 年达成 $75–100M ARR（爬坡速度慢于乐观情景）；Meta 贡献的 ARR 维持现状；AI 实验室
              ARR（Cohere 等）温和下滑。2027 年总 ARR 达到 $350–450M，按 20–25x 前瞻倍数计算，对应估值为 $8–11B —— 较 $29B
              入场价大幅减记。结合现有证据，这是最可能出现的情景。


              悲观情景：政府合同延期或遭遇重大不续约；企业 GenAI Platform 到 2027 年未能跑通产品市场匹配（平台净 ARR < $50M）；Meta 建立自研标注能力后削减数据采购；更多 AI
              实验室客户相继退出。2027 年总 ARR 将跌落至 $150–200M，按 10–12x 前瞻倍数计算，对应估值仅为 $1.5–2.5B。在这一估值水平下，$29B
              入场在财务上是毁灭性的；即便优先股堆叠也恐难抵御本金全损。


              各情景的概率信号极不对称：乐观情景需要多项利好同时兑现，而悲观情景只需发生“政府合同未能如期续约”这单一事件。这种不对称性，加之入场价由战略买家锚定，使得按 $29B
              入场的财务投资人面临结构性不利的风险收益比。基准情景意味着 60–70% 的减记，悲观情景则意味着财务价值几近全损。唯有能将政府护城河的战略期权价值定价在 $20B+ 的投资人，才有理由在 $29B 价位入场。
            claimRefs:
