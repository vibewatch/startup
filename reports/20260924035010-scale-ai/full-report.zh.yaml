      - number: '3.4'
        title: 切换成本、客户锁定与多供应商并用
        blocks:
          - type: paragraph
            body: >
              Scale AI 业务所涉不同客群的切换成本呈现出剧烈分化。针对主要采购 Scale 数据标注及 RLHF 服务的头部 AI
              实验室，切换成本仅处于中等水平：标注流水线在很大程度上具备可替代性，且各实验室已展现出主动切换服务商的意愿（Google 和 OpenAI 于 2025 年的离场便是佐证）。这恰恰解释了为何 Meta
              投资引发的利益冲突会导致如此迅速的客户流失——当客户面对数据供应商新引入投资方带来的结构性利益冲突时，既有的切换成本根本不足以留住他们。


              采用 Scale GenAI Platform 的企业级客户，切换成本则明显更高：该平台深度牵涉数据迁移、与企业现有系统的工作流集成、定制化数据管线配置以及组织维度的经验迁移。其切换摩擦力大致相当于中端 SaaS
              平台的迁移成本（周期约 6–18 个月）。


              美国政府与防务客户的切换成本极高。更换新服务商要求竞对必须取得同等的安全准入资质（获取 DoD IL4 及 FedRAMP High 授权通常耗时 12–36
              个月）、重新沉淀专有业务认知并穿透复杂的联邦采购审查流程。这为 Scale 的防务业务板块筑牢了长达数年的高黏性锁定效应。


              数据标注市场普遍存在多供应商并用（Multi-homing）：不少大型机构，包括 AI 实验室和成熟企业，会同时委托多家服务商标注，以横向比较质量、压低成本并分散供应风险。因此，即使是公开披露的大客户，Scale
              也未必拥有独家服务权。Scale 的自助服务层更是在机制上鼓励这种多供应商并用（低绑定门槛、按量计费）。Labelbox 打造的专家网络与 Surge 聚焦高端品质的打法，均表明其具备能力分流 Scale
              既有客户在多供应商采购中的标注预算。


              在分发渠道与供给端，Scale 的全球贡献者网络（累计向全球贡献者支付超过 $1B）构成专有的人工标注供给池。竞对若要在质量和吞吐量上与之竞争，也必须建立同等规模的人力网络。运营 AI 人才撮合市场的
              Mercor，正在试图打造一套差异化的专家贡献者供应链，直接分食 Scale 的人工供给底盘。
            claimRefs:
              - CP021
