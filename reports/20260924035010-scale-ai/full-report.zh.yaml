  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 风险严重度评级总览
        blocks:
          - type: paragraph
            body: >
              Scale AI 步入当前投资窗口期的风险特征，主要偏向战略转型与业务落地风险，而非合规或底层运维风险。截至研究基准日，大客户集中度过高（已随 Google 与 OpenAI
              相继流失而实质爆发）属于发生概率最高、负面影响最深的风险因素。客户离场、Meta 巨额入股与核心领导层更迭三者高度重叠，在 2025 年第二季度集中爆发了三大深度交织的重度风险事件。


              尤为关键的观察在于顶层风险的强关联性：Meta 投资引发了 Google 撤单（业务竞争冲突），进而倒逼 Scale 重新评估此前过度依赖前沿 AI
              实验室营收的商业模式可持续性，最终触发了管理层换帅与大规模裁员。多重风险层层传导放大。投资机构必须重点评估：政府防务壁垒与 Meta 客户关系的持续深化，能否提供足够的营收安全垫，以支撑公司穿越 AI
              实验室客群流失及企业级业务转型的震荡期。


              监管与法律风险整体处于可控范畴。Scale 获得的 DoD IL4 与 FedRAMP High 认证彰显了其在承接政府涉密业务上的强合规底盘。Mercor
              诉讼案属于持续中的司法纠纷，但短期内演变为颠覆性威胁的概率较低。防务 AI 的出口管制风险客观存在，但已有现行认证体系与合规机制予以防范。面向未来，最核心的潜在风险在于：在当前现金跑道消耗殆尽前，企业级
              GenAI Platform 能否迅速形成足够的增量营收，以对冲前沿 AI 实验室板块的萎缩缺口。
