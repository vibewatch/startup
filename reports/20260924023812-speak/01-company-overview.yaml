schemaVersion: report-v2
artifact: company-overview
slug: speak
runDate: '2026-09-24'
company:
  name: Speak
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Speak is a San Francisco-based AI language-learning company built around speaking-first tutoring, consumer
    subscriptions, and an enterprise language-training product. Public evidence supports the late-2024 unicorn step-up,
    a clear founder-led narrative, and meaningful consumer and business traction, but it still leaves current
    headcount, full board composition, and detailed governance under-disclosed.
sections:
  - id: identity-and-product
    title: Identity, product scope, and business model
    body: >-
      Speak is the consumer-facing brand of Speakeasy Labs, a voice-first language-learning app focused on spoken
      fluency rather than passive memorization. The company positions itself as an AI tutor that pushes learners to
      speak out loud, receive instant feedback, and build conversational confidence. Its public product surface now
      spans consumer subscriptions and a business product for employers, so the company is no longer just a single-app
      wedge.

      The current public position is simple: Speak sells a monthly or annual consumer subscription, while Speak for
      Business gives organizations a seat-based or contract-style way to train employees. The homepage and business
      page emphasize a speaking-first method, and the business page emphasizes admin controls, learner progress, and
      workplace use cases. That makes Speak’s commercial model easier to understand than its private-company economics.
    claimRefs: [CO001, CO002, CO008, CO009]
    tableRefs: [TO001]
  - id: founders-and-funding
    title: Founders, leadership, and funding history
    body: >-
      The company remains founder-led. Public materials identify Connor Zwick as CEO and Andrew Hsu as CTO/co-founder,
      and they tie the company back to a 2016 founding in San Francisco. The founders’ prior experience with Flashcards+
      and their education backgrounds are part of the company’s founder-market-fit story and still appear in current
      company materials.

      Speak’s financing step-up in 2024 is well supported. The company announced a $20M Series B-3 in June 2024 at a
      $500M valuation, then a $78M Series C in December 2024 at a $1B valuation. The Series C also says total funding
      reached $162M and names Accel, the OpenAI Startup Fund, Khosla Ventures, and Y Combinator among the backers.
    claimRefs: [CO003, CO004, CO005, CO011]
    tableRefs: [TO002, TO003]
    figureRefs: [FO001]
  - id: scale-and-milestones
    title: Scale, traction, and open governance gaps
    body: >-
      Speak now has enough public traction to look like a scaled private company rather than an early experiment. The
      company says it has more than 10 million learners in 40+ countries, more than 15 million downloads, and 200+
      enterprise customers or brands. Independent app-store listings corroborate a strong consumer base, and Google Play
      recognized Speak as a Best App of 2024 in Hong Kong, Korea, and Taiwan.

      The remaining diligence gaps are governance and internal scale. Public sources do not give a clean current headcount
      or a full board roster, and the company-controlled career page is not a substitute for a current organizational
      chart. Speak is plainly more mature than a seed-stage app, but the absence of current headcount, cap-table detail,
      and board disclosure still limits underwriting confidence.
    claimRefs: [CO006, CO007, CO010, CO012]
    tableRefs: []
