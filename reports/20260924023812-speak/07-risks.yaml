      - [Voice recognition failures, Medium, High, Medium, 'Users cannot progress smoothly']
      - [Latency or provider degradation, Medium, High, Medium, 'Live conversation feels broken']
      - [Support / refund friction, Medium, Medium, Low, 'Negative reviews and churn']
      - [Security assurance gap, Medium, Medium, Low, 'Enterprise trust barrier']
    notes: This table summarizes operational quality rather than financial or legal exposure.
    claimRefs: [CR007, CR008, CR009, CR010, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [App stores, Apple / Google, Distribution and billing, High, 'Policy or fee changes squeeze economics', High, 'Direct web funnel and strong product retention', 'Still constrained by platform rules']
      - [AI model providers, OpenAI / external providers, Voice / roleplay capability, Medium, 'Quality or price changes alter the product', High, 'Multi-provider stack and feature-specific routing', 'Provider mix still external']
      - [WebRTC / edge transport, LiveKit Cloud, Real-time audio transport, Medium, 'Regional outage or latency spike', High, 'Failover and observability', 'Latency sensitivity remains']
      - [Enterprise buyers, HR / L&D customers, B2B demand, Medium, 'A few accounts matter too much', Medium, 'Broaden account base', 'Concentration still undisclosed']
    notes: Concentration is directionally inferred because the company does not disclose a named customer list or top-account mix.
    claimRefs: [CR011, CR012]
