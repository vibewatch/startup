chapter:
  number: 7
  title: Risks
  summary: >-
    Speak’s main risks cluster around privacy, child-data handling, product quality, and platform dependence. The company
    has clear terms and privacy materials, but the same materials also show meaningful legal, regulatory, and consumer
    protection exposure because the product processes voice data and serves a broad learning audience.
sections:
  - id: legal-regulatory-risk
    title: Legal and regulatory risk
    body: >-
      Speak’s privacy notice says the app collects microphone and audio recordings to evaluate pronunciation and improve
      voice input. Its terms also impose strong restrictions on scraping, AI training, and commercial benchmarking,
      while adding mandatory arbitration and a class-action waiver. Those terms are not unusual for a consumer platform,
      but they do show real legal friction points if the product, content, or data pipeline becomes contested.

      The child-data question matters because COPPA applies when a service is directed to children under 13 or when the
      operator knowingly collects personal information from children under 13. Speak’s app-store age rating is 13+, but
      language-learning products can still attract younger users in practice, so the child-data posture is not trivial.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    tableRefs: [TR001]
  - id: product-and-platform-risk
    title: Product quality and platform dependence
    body: >-
      Product-quality risk is visible in multiple public surfaces. Speak’s help center has a dedicated article for voice
      recognition failures, and independent criticism says the app can be too lenient on pronunciation, which can create
      false mastery. App-store reviews also mention recognition delays and mic pickup problems. Those complaints do not
      kill the product, but they matter because the company is selling confidence as much as software.

      Platform risk is the other half of the story. Speak relies on app stores for distribution and on third-party AI,
      speech, and networking providers for key parts of the experience. If those providers change pricing, quality, or
      policy, Speak’s economics and UX can move quickly.
    claimRefs: [CR007, CR008, CR009, CR010]
    tableRefs: []
    figureRefs: [FR001]
  - id: severity-and-mitigation
    title: Severity, mitigation, and thesis-break triggers
    body: >-
      The right risk ranking puts privacy and trust controls at the top, followed by product-quality and platform risk,
      then by more ordinary execution risk. Speak can mitigate some of this with better policy clarity, tighter model
      evaluation, and clearer support flows, but not all of it disappears. If the product becomes materially worse on
      pronunciation or the privacy posture becomes hard to defend, the thesis gets weaker quickly.

      The main thing to watch is whether the company can keep the UX feeling safe, responsive, and trustworthy as it
      scales. If it cannot, the product may still grow, but customer trust and enterprise adoption could become much
      harder to sustain.
    claimRefs: [CR011, CR012]
    tableRefs: [TR002, TR003]
