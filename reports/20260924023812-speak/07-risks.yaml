      basis: Public legal and policy surfaces only; this is not a complete internal risk register.
    notes: Rows are ordered by severity / diligence urgency rather than by legal-code taxonomy.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR008, CR009]
