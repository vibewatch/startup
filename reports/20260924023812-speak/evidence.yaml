evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    relatedTableRefs:
      - TO002
      - TO003
    missingEvidence: Current headcount by function and a full board roster with committee structure.
    whyItMatters: Governance concentration and staffing scale affect execution risk and diligence confidence.
    diligencePath: Request the current org chart, board deck, and cap-table summary from management.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: operating-metrics
    missingEvidence: A current management KPI packet for MAU, paid subscribers, and enterprise seat counts.
    whyItMatters: It would sharpen the public traction picture beyond downloads and marketing claims.
    diligencePath: Ask for the latest internal operating dashboard or investor update.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A current third-party market report with a defendable language-learning TAM/SAM/SOM model.
    whyItMatters: It would convert the market thesis from directional to underwriteable.
    diligencePath: Pull a recent paid or public market-sizing report and reconcile it against Speak’s category definition.
    relatedQuestionRefs:
      - QM002
  - type: access-blocked
    severity: minor
    topic: traffic-gap
    missingEvidence: A readable traffic estimate from Similarweb or another neutral analytics source.
    whyItMatters: It would help quantify whether Speak’s consumer traction is keeping pace with its peers.
    diligencePath: Pull a direct analytics source or a management dashboard that shows traffic and app-session trends.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: private-metrics-gap
    missingEvidence: Current ARR, gross margin, CAC, retention, and runway model.
    whyItMatters: Those inputs determine whether the current valuation is justified by fundamentals.
    diligencePath: Request the latest board deck and monthly operating packet.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: A public SOC 2, ISO 27001, or equivalent enterprise security assurance artifact.
    whyItMatters: Enterprise buyers usually want formal assurance before rolling language software into employee workflows.
    diligencePath: Ask management for the latest security audit or compliance packet.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: blocking
    topic: retention-gap
    relatedTableRefs:
      - TU003
    missingEvidence: Cohort retention, churn, NRR, and top-customer concentration.
    whyItMatters: Those metrics are essential to know whether customer demand is durable or mostly trial-driven.
    diligencePath: Request the enterprise renewal report and consumer cohort dashboard.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: missing-source
    severity: material
    topic: assurance-gap
    relatedTableRefs:
      - TR001
    missingEvidence: A public SOC 2, ISO 27001, or equivalent enterprise assurance artifact.
    whyItMatters: Enterprise buyers typically want formal security proof before broad rollout.
    diligencePath: Request the latest security audit or compliance packet.
    relatedQuestionRefs:
      - QR007
      - QR008
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Preference stack, full cap table, and any secondary rights.
