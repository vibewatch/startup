chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Speak’s public product story is unusually technical for a consumer language app: the company discloses a speaking-
    first learning loop, real-time voice-agent infrastructure, ASR improvements, and a release cadence that keeps
    adding new language and roleplay features. The strongest evidence is on product capability; the weakest is on formal
    trust and compliance disclosure.
sections:
  - id: product-surface
    title: Product surface and learner workflow
    body: >-
      Speak’s public workflow is stable across home pages, help docs, and product posts: learners are pushed through a
      Learn → Practice → Apply loop rather than passive memorization. The visible module set includes tutor lessons,
      speaking drills, roleplays, Free Talk, progress tracking, and newer retention features such as unit refreshers and
      Speak Level. That makes the product feel closer to a speaking coach than a language reference tool.

      The company’s differentiated claim is that it gets users to speak early and often, then uses immediate feedback to
      keep the experience moving. Public materials also show that the app has broadened beyond the original English-
      learning wedge into multiple languages and market-specific releases. In other words, product scope is expanding,
      but the core workflow remains speaking-first.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-voice-stack
    title: Architecture and voice stack
    body: >-
      Speak now publicly describes a non-trivial voice stack. The company says it upgraded its ASR systems with a
      backend Conformer-CTC model, then layered a broader voice-agent platform that uses WebRTC, LiveKit, external ASR
      and TTS providers, and OpenAI Realtime for some live roleplay experiences. Public posts also describe the
      decision to choose between cascade and speech-to-speech by feature rather than by ideology.

      That architecture suggests real technical depth, but also real operating complexity. The stack is multi-provider,
      region-aware, and built around low latency. That helps explain why the company spends so much time on turn
      detection, tail latency, provider failover, and model evaluation. The product works only if the voice system feels
      natural enough that the learner does not notice the plumbing.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: trust-quality-and-roadmap
    title: Trust, quality, and roadmap
    body: >-
      Speak’s trust story is better than a generic AI wrapper, but it is still incomplete. The company discloses
      microphone and audio usage in its privacy notice, uses support content to help users fix voice-recognition issues,
      and updates the product frequently. At the same time, the public record does not show formal security attestations
      such as SOC 2 or ISO 27001, and independent reviewers still flag pronunciation leniency and occasional false
      mastery. In practical diligence terms, that means the product is credible enough to believe, but not yet
      transparent enough to treat as enterprise-grade without follow-up questions on controls, testing, and incident
      response.

      The roadmap is clearly active. Speak’s 2025 and 2026 posts added new languages, winter-release personalization,
      Speak Level, and more immersive roleplay experiences. The company is moving quickly, but the diligence question is
      whether the quality gains and trust controls are keeping pace with the pace of feature expansion.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE012]
