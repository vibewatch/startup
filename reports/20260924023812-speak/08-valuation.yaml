      - ['Series C re-priced the company to $1B quickly', 'Need evidence the step-up was not only funding-momentum driven']
      - ['Enterprise product opens a second revenue rail', 'Need ACV, renewal, and concentration proof']
      - ['Consumer adoption is visible in app-store and review surfaces', 'Need conversion, churn, and gross margin']
    notes: The table is designed to show what would make a bullish view more durable.
    claimRefs: [CV001, CV002, CV003, CV004, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, 'Strong retention + enterprise expansion + better disclosure', 'Multiple can hold or expand', 'Execution and competition', 'Possible but unproven']
      - [Base, 'Good product, moderate growth, limited disclosure', 'Private-market premium persists', 'Opaque economics', 'Most plausible today']
      - [Bear, 'Soft retention, price compression, or weak enterprise durability', 'Multiple compresses', 'Commoditization and churn', 'Cannot be ruled out']
      - [Stretch, 'Consumer and business usage both compound', 'Premium can be justified longer', 'Disclosure lag', 'Would need fresh evidence']
    notes: Scenario table is qualitative because the source set does not provide a public financial model.
    claimRefs: [CV005, CV006, CV007, CV008, CV010, CV011]
