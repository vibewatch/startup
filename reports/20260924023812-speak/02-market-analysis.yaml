    title: Market sizing pyramid
    type: pyramid
    summary: Evidence-constrained sizing layers from free substitutes up to employer-paid language training.
    data:
      nodes:
        - label: Free substitutes
          detail: Translation, YouTube, flashcards, and peer exchange
          tone: neutral
        - label: Consumer subscriptions
          detail: Mid-priced speaking and fluency apps
          tone: positive
        - label: Live tutoring
          detail: Human lesson marketplaces and premium coaching
          tone: neutral
        - label: AI speaking tutors
          detail: Speak-style voice-first AI products
          tone: positive
        - label: Employer training
          detail: Corporate language budgets for employees
          tone: positive
        - label: Broad language-learning spend
          detail: Speak’s company-claimed $100B+ framing
          tone: warning
    approximationNotes: The pyramid is qualitative because public sources do not disclose a clean cross-category market model.
    claimRefs: [CM001, CM005, CM006, CM008]
