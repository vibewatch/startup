      - [Live tutoring marketplaces, 'Per-lesson human tutoring spend', 'Internal corporate training not sold per lesson', 'Learner or parent', 'Major substitute']
      - [Language exchange, 'Free or low-cost peer practice', 'Formal paid instruction', 'Learner', 'Low-cost substitute']
      - [Employer language training, 'Corporate L&D and upskilling budgets', 'Consumer discretionary spend', 'Employer / HR / L&D', 'Second revenue surface']
      - ["Adjacency: translation / chatbots", 'Not a direct spend bucket', 'Standalone language learning spend', 'User, not payer', 'Attention competitor / substitute']
    notes: Boundary table; excluded items are shown so the market does not collapse into one over-broad number.
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: Sizing lens table
    columns: [Publisher, Year, Geography, Value, Methodology, Confidence, Limitation]
    rows:
      - [Speak, 2024, Global, '$100B+', 'Company-claimed broad market framing', medium, 'Too broad for underwriting']
      - [Speak, 2024, Global, '10M+ learners / 40+ countries', 'Traction proxy rather than market size', medium, 'Learners are not payers']
      - [Duolingo, 2026, Global, 'Large public consumer base', 'Public app and SEC disclosures', high, 'Does not isolate speaking spend']
      - [Busuu / HelloTalk / ELSA, 2026, Global, 'Large installed bases', 'Homepage / public marketing claims', medium, 'Installed base is not revenue']
    notes: Sizing lens table intentionally uses multiple proxies because no public third-party market report in the current source set gives a clean TAM.
    claimRefs: [CM005, CM006, CM007, CM010]
  - id: TM003
    title: Segment / buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Adoption trigger]
    rows:
      - [Consumer English learner, Individual, Learner, Individual subscriber, Self-study app, 'Need to speak for travel, work, or confidence']
      - [Consumer multilingual learner, Individual, Learner, Individual subscriber, AI tutor practice, 'Wants a speaking-first alternative to drills']
      - [Employer upskilling, HR / L&D, Employee, Employer, Team language training, 'Communication friction in meetings or customer work']
      - [Live tutoring buyer, Individual or parent, Learner, Individual buyer, Human lesson booking, 'Wants human feedback or accountability']
      - [Language exchange participant, Individual, Peer learner, Free, Peer practice, 'Wants cost-free conversation and cultural exchange']
    notes: The buyer map separates user from payer because the purchase decision differs materially by segment.
    claimRefs: [CM004, CM006, CM008, CM009]
