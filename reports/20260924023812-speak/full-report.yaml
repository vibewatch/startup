      - number: '4.2'
        title: Cost structure and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Speak is not capital-intensive in the hardware or inventory sense, but the product is not cheap to run.
              Voice recognition, LLM inference, speech-to-speech interactions, localization, and customer support all
              create variable cost layers that a simple content app would not have. That likely means delivery cost
              matters more than capex.

              The company has also raised enough capital to suggest investor confidence, but the public record does not
              tell us whether that capital is being translated into efficient growth or simply funding expensive product
              iteration. In a business with both consumer and enterprise rails, the real question is how much of each
              dollar becomes durable gross profit after platform fees and AI delivery costs.
            claimRefs:
