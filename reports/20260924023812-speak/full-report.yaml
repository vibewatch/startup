chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and business model
        blocks:
          - type: paragraph
            body: >-
              Speak is the consumer-facing brand of Speakeasy Labs, a voice-first language-learning app focused on
              spoken fluency rather than passive memorization. The company positions itself as an AI tutor that pushes
              learners to speak out loud, receive instant feedback, and build conversational confidence. Its public
              product surface now spans consumer subscriptions and a business product for employers, so the company is
              no longer just a single-app wedge.

              The current public position is simple: Speak sells a monthly or annual consumer subscription, while Speak
              for Business gives organizations a seat-based or contract-style way to train employees. The homepage and
              business page emphasize a speaking-first method, and the business page emphasizes admin controls, learner
              progress, and workplace use cases. That makes Speak’s commercial model easier to understand than its
              private-company economics.
