      - number: '3.2'
        title: Feature, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The market comparison is less about identical features than about trade-offs. Duolingo wins on reach and
              habit, live tutor platforms win on human feedback, community products win on social practice, and Speak
              wins when a user wants structured speaking practice with immediate AI feedback. The question is whether
              that advantage is durable enough to justify a premium subscription and enough differentiated from cheap
              substitutes to avoid commoditization.

              Public pricing signals are also important. Speak’s price sits in the middle of the category, below
              repeated human tutoring but above free exchange products. That means the company needs value proof, not
              just product novelty. The app-store review surface and independent criticism show that Speak is
              appreciated for speaking practice, but the same surface also reveals complaints about recognition quality
              and false mastery.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
