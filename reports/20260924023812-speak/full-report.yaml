      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The adoption signal is strong on the consumer side and middling on the enterprise side. App-store ratings
              and reviews show that users are actually trying the product and often like the speaking-first design.
              Speak for Business says it helps teams practice real workplace situations, and the company claims 85%
              employee adoption, which is a meaningful indicator of usage depth.

              What is missing is the evidence that would turn strong adoption into a full retention picture. The public
              sources do not provide churn, renewal, contract length, or concentration. In other words, Speak has proof
              of usage and proof of interest, but not enough public data to prove durability.
            claimRefs:
