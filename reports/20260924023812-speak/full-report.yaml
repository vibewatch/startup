  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Speak’s core market is spoken language learning: consumers and employers paying for help that gets people
              to speak, not just read or memorize. That boundary is important because it excludes the status quo tools
              many learners still use for free—generic translation, rote vocabulary drills, and passive content
              consumption. It also captures a wide substitute set: live tutoring marketplaces, language exchange apps,
              and AI-first speaking tutors that compete on convenience, price, and speaking confidence rather than
              curriculum breadth alone.

              The company’s own Series B-3 copy says it is disrupting a $100B+ online and in-person language-learning
              market, which is directionally useful but too broad to be a diligence-grade sizing answer. A defensible
              view has to split the market into consumer subscriptions, live tutoring, peer exchange, and employer-paid
              language training instead of collapsing all language spend into one top-line number.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and demand signals
        blocks:
          - type: paragraph
            body: >-
              The best public evidence suggests that demand is real and broad, but the precise size of the opportunity
              is still uncertain. Speak’s own traction claims show millions of learners, while competitor surfaces show
              huge installed bases at Duolingo, Busuu, HelloTalk, ELSA, and others. That combination tells us the
              category has scale and that speaking-focused products can win attention, but it does not reveal how much
              of the category is monetizable at subscription prices.

              The market is also cross-linked with geography. Several language-learning products are much stronger in
              specific language pairs or regions, which means a true sizing exercise needs to think in local adoption
              curves, not just a global aggregate. For Speak, the most plausible near-term path is not owning the entire
              category, but converting a niche of speaking-intensive learners and employer buyers who care about fluency
              outcomes.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Adoption drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver is obvious: learners want to speak comfortably, and many are willing to pay
              for feedback that feels faster and less awkward than a human tutor. The main constraints are also clear.
              Consumers can multi-home across apps, compare options quickly, and churn if the app does not help them
              speak in a way that feels useful. Employers buy more slowly, but they may be willing to pay if the app
              reduces communication friction for globally distributed teams.

              The main diligence gap is still market math. Public sources do not provide a current, evidence-constrained
              TAM, nor do they show a clean split between consumer subscription spend and enterprise language training.
              That leaves the market thesis directionally strong but numerically incomplete.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
