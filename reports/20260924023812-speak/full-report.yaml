      - number: '5.2'
        title: Architecture and voice stack
        blocks:
          - type: paragraph
            body: >-
              Speak now publicly describes a non-trivial voice stack. The company says it upgraded its ASR systems with
              a backend Conformer-CTC model, then layered a broader voice-agent platform that uses WebRTC, LiveKit,
              external ASR and TTS providers, and OpenAI Realtime for some live roleplay experiences. Public posts also
              describe the decision to choose between cascade and speech-to-speech by feature rather than by ideology.

              That architecture suggests real technical depth, but also real operating complexity. The stack is
              multi-provider, region-aware, and built around low latency. That helps explain why the company spends so
              much time on turn detection, tail latency, provider failover, and model evaluation. The product works only
              if the voice system feels natural enough that the learner does not notice the plumbing.
            claimRefs:
