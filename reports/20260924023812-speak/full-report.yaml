              - CP009
      - number: '3.3'
        title: Moat durability and competitive risks
        blocks:
          - type: paragraph
            body: >-
              Speak’s moat is strongest where it combines pedagogy, speech feedback, and low-friction consumer
              onboarding. It is weaker where other products can copy the speaking-first idea or where human tutoring
              feels more trustworthy. The biggest strategic risk is commoditization: AI tutors are likely to get
              cheaper, better, and easier to build. If that happens, Speak will need either brand, data, or workflow
              lock-in to keep pricing power. The more subtle risk is that users may not compare products on a clean
              feature checklist; instead they compare the subjective experience of progress, confidence, and feedback
              quality. That makes execution quality and retention design part of the moat, not just the model stack.

              The company’s own review pages and independent criticism suggest that some users already see value, but
              not all users see enough precision in pronunciation feedback or enough depth in assessment. That makes the
              moat question partly a product-quality question and partly a distribution question.
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Speak appears to monetize through two visible rails. The consumer rail is subscription software sold
              through mobile app stores and the business rail is Speak for Business, an enterprise product sold to
              organizations that want language training for teams. The public pricing anchor is mid-market: the homepage
              says Speak offers a 7-day free trial and that price varies by region, while store listings show annual and
              monthly subscription tiers.

              That makes the business model easier to understand than the revenue quality. The public evidence tells us
              how the company wants to charge, but not how much it actually collects after trial conversion, app-store
              fees, refunds, discounts, or enterprise services. The result is a visible monetization architecture with
              weak underwriting visibility.
