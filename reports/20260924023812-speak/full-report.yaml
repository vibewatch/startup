              - CR012
      - number: '7.3'
        title: Severity, mitigation, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The right risk ranking puts privacy and trust controls at the top, followed by product-quality and
              platform risk, then by more ordinary execution risk. Speak can mitigate some of this with better policy
              clarity, tighter model evaluation, and clearer support flows, but not all of it disappears. If the product
              becomes materially worse on pronunciation or the privacy posture becomes hard to defend, the thesis gets
              weaker quickly.

              The main thing to watch is whether the company can keep the UX feeling safe, responsive, and trustworthy
              as it scales. If it cannot, the product may still grow, but customer trust and enterprise adoption could
              become much harder to sustain.
            claimRefs:
