      - number: '1.2'
        title: Founders, leadership, and funding history
        blocks:
          - type: paragraph
            body: >-
              The company remains founder-led. Public materials identify Connor Zwick as CEO and Andrew Hsu as
              CTO/co-founder, and they tie the company back to a 2016 founding in San Francisco. The founders’ prior
              experience with Flashcards+ and their education backgrounds are part of the company’s founder-market-fit
              story and still appear in current company materials.

              Speak’s financing step-up in 2024 is well supported. The company announced a $20M Series B-3 in June 2024
              at a $500M valuation, then a $78M Series C in December 2024 at a $1B valuation. The Series C also says
              total funding reached $162M and names Accel, the OpenAI Startup Fund, Khosla Ventures, and Y Combinator
              among the backers.
