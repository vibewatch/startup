  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers and substitute models
        blocks:
          - type: paragraph
            body: >-
              Speak’s closest rivals are not all the same kind of company. Duolingo is the mass-market learning app with
              the broadest brand reach; Cambly and italki sell human tutoring; Busuu and HelloTalk blend learning with
              community; Praktika is the most obvious AI-native speaking tutor; and ELSA focuses on English speaking and
              pronunciation. That mix matters because Speak is not simply defending a feature set—it is defending a
              product category.

              The substitute set is especially broad. A learner can practice for free in a language exchange app, buy a
              human lesson, use a freemium gamified app, or switch to a cheaper AI tutor. That means Speak’s
              differentiation has to survive both price comparison and behavior comparison: users can multi-home, pause,
              or switch when they stop feeling progress.
            claimRefs:
