  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Speak’s privacy notice says the app collects microphone and audio recordings to evaluate pronunciation and
              improve voice input. Its terms also impose strong restrictions on scraping, AI training, and commercial
              benchmarking, while adding mandatory arbitration and a class-action waiver. Those terms are not unusual
              for a consumer platform, but they do show real legal friction points if the product, content, or data
              pipeline becomes contested.

              The child-data question matters because COPPA applies when a service is directed to children under 13 or
              when the operator knowingly collects personal information from children under 13. Speak’s app-store age
              rating is 13+, but language-learning products can still attract younger users in practice, so the
              child-data posture is not trivial.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
