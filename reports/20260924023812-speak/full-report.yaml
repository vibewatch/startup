    multilingual tutoring through mobile apps and an enterprise training product.
  customerFocus: >-
    Consumers learning spoken English and other languages, plus employers using English upskilling and workplace
    language practice.
  businessModel: Consumer subscriptions with in-app pricing plus enterprise seat-based or contract language-training offerings.
  stage: Series C private / growth-stage edtech unicorn
