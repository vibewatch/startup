      - number: '1.3'
        title: Scale, traction, and open governance gaps
        blocks:
          - type: paragraph
            body: >-
              Speak now has enough public traction to look like a scaled private company rather than an early
              experiment. The company says it has more than 10 million learners in 40+ countries, more than 15 million
              downloads, and 200+ enterprise customers or brands. Independent app-store listings corroborate a strong
              consumer base, and Google Play recognized Speak as a Best App of 2024 in Hong Kong, Korea, and Taiwan.

              The remaining diligence gaps are governance and internal scale. Public sources do not give a clean current
              headcount or a full board roster, and the company-controlled career page is not a substitute for a current
              organizational chart. Speak is plainly more mature than a seed-stage app, but the absence of current
              headcount, cap-table detail, and board disclosure still limits underwriting confidence.
            claimRefs:
