              - CR006
              - CR008
              - CR009
      - number: '7.2'
        title: Product quality and platform dependence
        blocks:
          - type: paragraph
            body: >-
              Product-quality risk is visible in multiple public surfaces. Speak’s help center has a dedicated article
              for voice recognition failures, and independent criticism says the app can be too lenient on
              pronunciation, which can create false mastery. App-store reviews also mention recognition delays and mic
              pickup problems. Those complaints do not kill the product, but they matter because the company is selling
              confidence as much as software.

              Platform risk is the other half of the story. Speak relies on app stores for distribution and on
              third-party AI, speech, and networking providers for key parts of the experience. If those providers
              change pricing, quality, or policy, Speak’s economics and UX can move quickly.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
