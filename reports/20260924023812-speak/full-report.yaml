              - CI005
      - number: '4.3'
        title: Financial verdict and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Speak’s financial verdict is cautiously positive on demand and cautious on transparency. The company has
              real traction, a recent unicorn mark, and enough public pricing to show that customers are paying
              something. But the public record still lacks the data needed for a conviction underwriting call: ARR,
              gross margin, payback, retention, concentration, runway, and enterprise contract quality. Even capital
              adequacy is only inferable from the latest financing headline rather than from a disclosed cash balance or
              burn profile.

              That means the financing story is credible but incomplete. The company may be healthy and growing quickly,
              but the current public evidence cannot distinguish between “good business with hidden unit economics” and
              “expensive growth supported by strong capital markets.” Until those private metrics are shared, the right
              conclusion is that the revenue model is plausible but still not fully underwritten.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and learner workflow
        blocks:
          - type: paragraph
            body: >-
              Speak’s public workflow is stable across home pages, help docs, and product posts: learners are pushed
              through a Learn → Practice → Apply loop rather than passive memorization. The visible module set includes
              tutor lessons, speaking drills, roleplays, Free Talk, progress tracking, and newer retention features such
              as unit refreshers and Speak Level. That makes the product feel closer to a speaking coach than a language
              reference tool.

              The company’s differentiated claim is that it gets users to speak early and often, then uses immediate
              feedback to keep the experience moving. Public materials also show that the app has broadened beyond the
              original English- learning wedge into multiple languages and market-specific releases. In other words,
              product scope is expanding, but the core workflow remains speaking-first.
            claimRefs:
