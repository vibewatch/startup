      - number: '6.3'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Speak’s customer question is no longer whether people will try it; it is whether they will stay, expand,
              and pay enough to justify the current valuation. The business seems set up for land-and-expand: a learner
              can begin on a consumer plan and later bring the product into an employer context, or an employer can buy
              seats and then expand to more teams. But the concentration risk is still unknown because the company does
              not publicly disclose a named customer list, top-customer concentration, or renewal history.

              That leaves the customer story in a partially complete state. Public review evidence is strong enough to
              show real satisfaction and repeated use, but not strong enough to prove durable revenue quality. The next
              diligence step is a proper enterprise cohort pack, not more reviews.
            claimRefs:
