      - number: '5.3'
        title: Trust, quality, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Speak’s trust story is better than a generic AI wrapper, but it is still incomplete. The company discloses
              microphone and audio usage in its privacy notice, uses support content to help users fix voice-recognition
              issues, and updates the product frequently. At the same time, the public record does not show formal
              security attestations such as SOC 2 or ISO 27001, and independent reviewers still flag pronunciation
              leniency and occasional false mastery. In practical diligence terms, that means the product is credible
              enough to believe, but not yet transparent enough to treat as enterprise-grade without follow-up questions
              on controls, testing, and incident response.

              The roadmap is clearly active. Speak’s 2025 and 2026 posts added new languages, winter-release
              personalization, Speak Level, and more immersive roleplay experiences. The company is moving quickly, but
              the diligence question is whether the quality gains and trust controls are keeping pace with the pace of
              feature expansion.
            claimRefs:
