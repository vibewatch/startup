  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Speak owns a differentiated speaking-first product in a large category,
              has shown real consumer distribution, and convinced investors to reprice it from $500M to $1B within six
              months in 2024. The company also has a second revenue surface in Speak for Business, which makes it more
              than a single-app consumer bet.

              The anti-thesis is just as clear. The company is private and undisclosed on the numbers that matter most.
              Public evidence does not show ARR, gross margin, churn, or runway, so the $1B mark is still a
              funding-round mark rather than a fundamentals-mark. In other words, the company is interesting enough to
              own on a watchlist, but not yet transparent enough to buy with high conviction.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
      - number: '8.2'
        title: Scenarios and comparables
        blocks:
          - type: paragraph
            body: >-
              Speak’s valuation should be judged against a public comp set that includes Duolingo and other
              language-learning alternatives, plus the company’s own pricing and adoption signals. The point is not to
              map a perfect revenue multiple—Speak does not disclose one—but to ask whether the current price makes
              sense if the business is really a fast-growing, mid-priced, subscription-plus-enterprise AI tutor.

              The public comp evidence cuts both ways. Duolingo is larger, public, and far more transparent; the private
              language-learning field is crowded; and consumer pricing is not obviously high enough to support a huge
              multiple without strong retention. That combination keeps the valuation stance stretched even if the
              product story is real.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Diligence asks and conclusion
        blocks:
          - type: paragraph
            body: >-
              The valuation verdict is therefore conservative. Speak has enough evidence to justify continued diligence
              and probably enough traction to deserve a meaningful private-market premium, but not enough disclosure to
              justify a conviction upgrade. The unresolved questions are the same private-company questions that matter
              everywhere: revenue quality, unit economics, retention, concentration, and cap-table structure.

              Until those are answered, the right conclusion is not that Speak is bad; it is that Speak is still
              underwritten more by momentum than by published fundamentals. That is a valid growth-company profile, but
              it is not yet a fully transparent one.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
