  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and adoption
        blocks:
          - type: paragraph
            body: >-
              Speak serves two visible customer groups. The consumer side is broad: learners discover the app through
              app-store rankings, ratings, and word of mouth, then use a speaking-first curriculum to build confidence.
              The enterprise side is narrower but important: Speak for Business targets HR, L&D, and training teams that
              want language training for employees.

              Public evidence shows that Speak’s customer base is not just theoretical. The company claims 200+
              enterprise customers or brands, app-store listings show a large consumer base, and public reviews
              repeatedly mention speaking confidence and real-world use. That said, the public record still lacks a
              clean segmentation by geography, revenue band, or retention cohort.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
