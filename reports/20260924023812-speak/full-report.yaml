companyProfile:
  summary: >-
    Speak is a private AI language-learning company building a voice-first tutor for spoken fluency across consumer and
    employer use cases. The company pairs a differentiated speaking-focused curriculum with generative AI and speech
    technologies, giving it stronger product proof than many education apps. Public evidence shows meaningful global
    distribution and investor support, but still leaves too many financial, retention, and cap-table questions
    unanswered for a high-conviction price call.
  foundedDate: '2016-01-01'
  founders:
    - name: Connor Zwick
      role: Co-founder, CEO
      background: Previously built Flashcards+ and has been the main external operator and fundraising voice for Speak.
      claimRefs: []
    - name: Andrew Hsu
      role: Co-founder, CTO
      background: Technical co-founder shaping Speak's product, speech, and AI stack.
      claimRefs: []
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
