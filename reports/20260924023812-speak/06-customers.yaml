chapter:
  number: 6
  title: Customers
  summary: >-
    Speak’s public customer proof is strongest on consumer satisfaction and enterprise adoption counts, but weak on
    retention, concentration, and named enterprise case studies. The company shows real usage and strong review depth,
    yet it still does not disclose churn, NRR, or a clean customer concentration picture.
sections:
  - id: customer-segmentation
    title: Customer segmentation and adoption
    body: >-
      Speak serves two visible customer groups. The consumer side is broad: learners discover the app through app-store
      rankings, ratings, and word of mouth, then use a speaking-first curriculum to build confidence. The enterprise side
      is narrower but important: Speak for Business targets HR, L&D, and training teams that want language training for
      employees.

      Public evidence shows that Speak’s customer base is not just theoretical. The company claims 200+ enterprise
      customers or brands, app-store listings show a large consumer base, and public reviews repeatedly mention speaking
      confidence and real-world use. That said, the public record still lacks a clean segmentation by geography,
      revenue band, or retention cohort.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The adoption signal is strong on the consumer side and middling on the enterprise side. App-store ratings and
      reviews show that users are actually trying the product and often like the speaking-first design. Speak for
      Business says it helps teams practice real workplace situations, and the company claims 85% employee adoption,
      which is a meaningful indicator of usage depth.

      What is missing is the evidence that would turn strong adoption into a full retention picture. The public sources do
      not provide churn, renewal, contract length, or concentration. In other words, Speak has proof of usage and proof
      of interest, but not enough public data to prove durability.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-and-expansion
    title: Retention, expansion, and concentration risk
    body: >-
      Speak’s customer question is no longer whether people will try it; it is whether they will stay, expand, and pay
      enough to justify the current valuation. The business seems set up for land-and-expand: a learner can begin on a
      consumer plan and later bring the product into an employer context, or an employer can buy seats and then expand
      to more teams. But the concentration risk is still unknown because the company does not publicly disclose a named
      customer list, top-customer concentration, or renewal history.

      That leaves the customer story in a partially complete state. Public review evidence is strong enough to show real
      satisfaction and repeated use, but not strong enough to prove durable revenue quality. The next diligence step is
      a proper enterprise cohort pack, not more reviews.
    claimRefs: [CU009, CU010, CU011, CU012]
