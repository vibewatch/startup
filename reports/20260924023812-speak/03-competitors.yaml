    notes: The matrix intentionally uses coarse labels because public sources do not support fully normalized product benchmarks.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP008, CP009, CP010]
  - id: TP003
    title: Pricing / packaging comparison
