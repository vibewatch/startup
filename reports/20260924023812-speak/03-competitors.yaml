company:
  name: Speak
chapter:
  number: 3
  title: Competitors
  summary: >-
    Speak competes against a mixed field of mass-market apps, live tutoring marketplaces, language exchange networks,
    and AI-native speaking tutors. The moat question is not whether competitors exist—they do—but whether speaking-first
    AI plus fast product iteration can hold differentiation against cheaper, broader, or more social substitutes.
sections:
  - id: direct-peers
    title: Direct peers and substitute models
    body: >-
      Speak’s closest rivals are not all the same kind of company. Duolingo is the mass-market learning app with the
      broadest brand reach; Cambly and italki sell human tutoring; Busuu and HelloTalk blend learning with community;
      Praktika is the most obvious AI-native speaking tutor; and ELSA focuses on English speaking and pronunciation.
      That mix matters because Speak is not simply defending a feature set—it is defending a product category.

      The substitute set is especially broad. A learner can practice for free in a language exchange app, buy a human
      lesson, use a freemium gamified app, or switch to a cheaper AI tutor. That means Speak’s differentiation has to
      survive both price comparison and behavior comparison: users can multi-home, pause, or switch when they stop
      feeling progress.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007]
    tableRefs: [TP001, TP002]
  - id: feature-and-price
    title: Feature, pricing, and distribution comparison
    body: >-
      The market comparison is less about identical features than about trade-offs. Duolingo wins on reach and habit,
      live tutor platforms win on human feedback, community products win on social practice, and Speak wins when a user
      wants structured speaking practice with immediate AI feedback. The question is whether that advantage is durable
      enough to justify a premium subscription and enough differentiated from cheap substitutes to avoid commoditization.

      Public pricing signals are also important. Speak’s price sits in the middle of the category, below repeated human
      tutoring but above free exchange products. That means the company needs value proof, not just product novelty. The
      app-store review surface and independent criticism show that Speak is appreciated for speaking practice, but the
      same surface also reveals complaints about recognition quality and false mastery.
    claimRefs: [CP008, CP009, CP010, CP011]
    tableRefs: [TP003]
    figureRefs: [FP001]
  - id: moat-and-risks
    title: Moat durability and competitive risks
    body: >-
      Speak’s moat is strongest where it combines pedagogy, speech feedback, and low-friction consumer onboarding. It is
      weaker where other products can copy the speaking-first idea or where human tutoring feels more trustworthy. The
      biggest strategic risk is commoditization: AI tutors are likely to get cheaper, better, and easier to build. If
      that happens, Speak will need either brand, data, or workflow lock-in to keep pricing power. The more subtle
      risk is that users may not compare products on a clean feature checklist; instead they compare the subjective
      experience of progress, confidence, and feedback quality. That makes execution quality and retention design part
      of the moat, not just the model stack.

      The company’s own review pages and independent criticism suggest that some users already see value, but not all
      users see enough precision in pronunciation feedback or enough depth in assessment. That makes the moat question
      partly a product-quality question and partly a distribution question.
    claimRefs: [CP010, CP011, CP012]
