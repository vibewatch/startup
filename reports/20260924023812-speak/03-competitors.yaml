      - [Cambly, 'Tutoring plans / per-lesson pricing', 'Live human tutoring', 'Teacher mix and realized discounting', 'Higher-touch but costlier substitute']
      - [italki, 'Teacher-set pay-as-you-go pricing', 'Marketplace lessons', 'Average spend per learner', 'Flexible but fragmented']
      - [HelloTalk, 'Free plus premium features', 'Peer exchange / community', 'Paid conversion and ARPU', 'Low-cost substitute']
      - [Duolingo, 'Freemium with paid tiers', 'Gamified broad learning', 'Current paid-tier mix', 'Habit-forming competitor with low entry price']
    notes: Public prices are list prices or model descriptions, not realized net revenue.
    claimRefs: [CP008, CP009, CP010, CP011]
