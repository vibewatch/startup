  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群画像与产品采纳情况
        blocks:
          - type: paragraph
            body: >-
              Speak 明确服务于两大客群。消费端基数庞大：个人学员通过应用商店榜单、评分与口碑发现该应用，并依靠口语优先课程建立对话信心；企业端相对垂直但战略意义突出：Speak for Business
              瞄准有员工语言培训需求的人力资源、学习与发展（L&D）及企业培训部门。

              公开证据表明，Speak 的客户基础切实存在。公司声称拥有 200+
              家企业客户或品牌，应用商店数据印证了庞大的个人用户群，公开评价也屡次提及产品对开口信心与日常实战的帮助。尽管如此，公开信息中依然缺乏按地域、收入区间或留存队列清晰切分的客户细分数据。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
      - number: '6.2'
        title: 渗透增长轨迹与客户背书证据
        blocks:
          - type: paragraph
            body: >-
              产品在消费端展现出强劲的采纳信号，在企业端表现中规中矩。应用商店评分与评价显示用户正在高频使用该产品，普遍认可其口语优先理念。Speak for Business
              表示可协助团队演练真实职场沟通，公司声称员工渗透率达到 85%，反映出可观的使用深度。

              目前缺失的是将高采纳度转化为完整留存全貌的关键数据。公开渠道未披露客户流失率、续约率、合同期限或客户集中度。换言之，Speak 证实了用户使用意愿与活跃度，但缺乏足够公开数据来证实收入的持久性。
            claimRefs:
              - CU005
