      - number: '6.3'
        title: 留存表现、增购扩张与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Speak
              面临的核心客户问题已不再是用户是否愿意尝试，而是他们能否持续留存、增购扩容并支付足以匹配当前估值的费用。公司业务架构契合“先落地后扩张”模式：个人学习者从个人订阅切入，随后可将产品引荐至雇主企业；企业客户亦可先采购少量席位，再逐步拓展至更多团队。由于公司未公开具体企业客户名单、头部客户集中度或续约历史，客户集中度风险目前依然未知。

              这导致其客户维度的说服力仅部分成立。公开评价足以证明用户的真实满意度与复用习惯，但尚不足以证明长期收入质量的稳定性。后续尽调的关键在于获取严谨的企业客户队列数据包，而非收集更多零散评价。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管合规风险
        blocks:
          - type: paragraph
            body: >-
              Speak 隐私政策说明，应用采集麦克风与音频录音用于发音评估及语音输入优化。服务条款对爬虫抓取、AI
              训练与商业竞品基准评测施加了严格限制，并加入了强制仲裁条款与集体诉讼弃权声明。这些条款在消费级平台中较为常见，但一旦产品、内容或数据流水线陷入争议，将构成切实的法律纠纷风险点。

              儿童数据合规问题不容忽视。根据《儿童在线隐私保护法》（COPPA），若服务面向 13 岁以下儿童，或运营方在明知情况下收集 13 岁以下儿童的个人信息，均须遵循该法案监管。Speak 在应用商店的年龄评级为
              13+，但语言学习类产品在实际运营中极易吸引低龄用户，儿童数据合规管控决非小事。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
