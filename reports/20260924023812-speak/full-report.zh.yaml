companyProfile:
  summary: >-
    Speak 是一家未上市的 AI 语言学习公司，面向个人与企业客户打造主打口语流利度的语音优先导师。公司将差异化的口语课程与生成式 AI
    及语音技术结合，产品验证成效优于多数教育类应用。公开证据显示其具备可观的全球分发能力与投资方支持，但财务、留存及股权结构表仍有诸多未解问题，尚不足以支撑高确定性的估值判断。
