  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Speak
              的核心市场是口语学习：个人消费者与企业雇主付费获取开口表达支持，而非停留在阅读或死记硬背。划清这一边界十分关键，因为它排除了大量学习者仍在免费使用的传统工具——通用翻译软件、机械背单词工具及被动内容消费。同时，这也划定了广泛的替代品范围：真人外教撮合平台、语言交换应用，以及以
              AI 为核心、在便利性、价格和开口信心而非单纯课程广度上展开竞争的口语辅导产品。

              公司在 B-3 轮宣传中称其正在颠覆规模达 $100B+
              的线上与线下语言学习市场。该表述虽具方向参考价值，但口径过宽，不足以作为尽调级别的市场测算依据。审慎的评估必须将市场拆解为个人订阅、真人外教、语伴互助以及雇主付费的企业语言培训，而非将全部语言消费简单合并为一个总额数字。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 测算视角与需求信号
        blocks:
          - type: paragraph
            body: >-
              最佳公开证据显示，口语学习需求真实且广泛，但具体市场空间仍具不确定性。Speak 官方声称的运营数据呈现数百万学习者，同时 Duolingo、Busuu、HelloTalk、ELSA
              等竞品均展示出庞大的装机量。这种组合印证了该赛道具备可观规模，聚焦口语的产品能够争夺用户注意力，但尚未揭示该赛道究竟有多少比例能按订阅价格实现商业化。

              该市场同时与地域深度绑定。多款语言学习产品在特定语种配对或特定地区优势明显，严谨的市场规模测算必须考量本地化渗透曲线，而非仅看全球总量。Speak
              最具可行性的近期路径并非通吃整个赛道，而是拿下注重流利度效果的重度口语学习者与企业买方这一细分客群。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
