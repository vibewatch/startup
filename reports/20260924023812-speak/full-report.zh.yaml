      - number: '4.3'
        title: 财务结论与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Speak
              的财务评估结论表现为对需求持谨慎乐观，对数据透明度持保守态度。公司展现了切实的增长势头，近期跻身独角兽行列，公开定价亦证明有真实付费客群。然而公开记录仍缺乏支撑高确定性投资测算的关键数据：年经常性收入（ARR）、毛利率、回本周期、留存率、客户集中度、现金跑道以及企业合同质量。甚至其资金充裕程度也只能根据最新融资新闻推断，缺乏明确披露的现金余额或烧钱速度。

              融资故事可信但不够完整。公司可能健康且处于快速增长期，但现有公开证据无法厘清其究竟是“单位经济模型优秀的优质标的”，还是“依赖资本市场输血的昂贵扩张”。在未披露非公开核心指标前，最合理的结论是：其收入模式成立，但仍未通过完整的财务尽调测算。
