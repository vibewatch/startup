  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与学员学习闭环
        blocks:
          - type: paragraph
            body: >-
              Speak 在官网、帮助文档与产品博客中呈现的学习流程始终一致：引导学习者进入“学习 → 练习 → 应用”（Learn → Practice →
              Apply）闭环，而非被动记忆。其核心功能模块包括导师课程、口语演练、情景角色扮演、自由对话（Free Talk）、学习进度追踪，以及单元复习和 Speak Level
              等近期上线的留存机制。这让该产品更接近随身口语教练，而非单纯的语言工具书。

              公司差异化的核心主张在于让用户尽早开口、高频开口，并凭借即时反馈维持流畅学习体验。公开材料同时显示，应用已突破早期单一的英语口语切入点，拓展至多语种并推出针对特定市场的定制版本。产品边界在不断延伸，但核心体验始终坚持口语优先。
