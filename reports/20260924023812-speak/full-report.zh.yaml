      - number: '3.3'
        title: 护城河壁垒与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Speak 结合教学法、语音反馈与低门槛消费端体验的能力构筑了其最坚固的护城河；但在其他产品易于复制口语优先理念或真人教学信任度更高的环节，防线相对薄弱。最大的战略风险在于同质化与大宗商品化：AI
              口语导师大概率会变得更便宜、效果更好且更容易搭建。届时 Speak
              必须依靠品牌、数据或工作流锁定效应来维持定价权。另一重更隐蔽的风险在于，用户不会严格比对功能清单，而是凭进步幅度、开口信心与反馈质量等主观体验做决策。执行质量与留存机制设计同样构成了护城河的核心要素，而非仅仅取决于底层模型架构。

              官方评价与第三方测评显示，部分用户已认可其价值，但仍有用户反馈发音纠错精度不足或能力评估缺乏深度。护城河的稳固程度，既取决于底层产品质量，亦取决于分发能力。
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价策略
        blocks:
          - type: paragraph
            body: >-
              Speak 主要通过两条路径实现商业化变现。消费端依靠移动应用商店销售订阅制软件；企业端则依托 Speak for Business 向有团队语言培训需求的企业机构销售服务。公开定价锚定中端市场：官网显示
              Speak 提供 7-day 免费试用，价格因地区而异，应用商店列表则呈现按月和按年订阅档位。

              商业模式清晰易懂，但收入质量难以穿透。公开证据展示了公司的收费机制，却未披露试用期转化、应用商店分成、退款、折扣及企业实施服务后的实际收款净额。变现架构一目了然，但底层财务测算的透明度依然薄弱。
            claimRefs:
              - CI001
