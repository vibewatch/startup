              - CV004
              - CV009
      - number: '8.2'
        title: 情景推演与可比公司对标
        blocks:
          - type: paragraph
            body: >-
              评估 Speak 的估值，需综合对标包括 Duolingo 在内的上市可比公司集群及其他语言学习替代品，并结合公司自身的定价与用户渗透表现。核心目的并非推导出一个完美的市销率倍数（Speak
              未披露营收数据），而是研判当前定价在“一家处于高增长阶段、定价处于中游、兼具个人订阅与企业级业务的 AI 口语导师”这一假设前提下是否合理。

              公开可比公司证据兼具正反两面。Duolingo
              规模更大、已公开上市且数据透明度极高；未上市语言学习赛道竞争拥挤；个人端定价水平并不拔尖，若缺乏强劲的留存率支撑，难以消化过高的估值倍数。即便产品逻辑切实成立，上述因素叠加依然导致其当期估值处于偏高状态。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
