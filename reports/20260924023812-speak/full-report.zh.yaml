  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品与替代形态
        blocks:
          - type: paragraph
            body: >-
              Speak 面临的核心竞品并非同质化企业。Duolingo 作为大众消费级学习应用，拥有最广阔的品牌认知；Cambly 与 italki 主营真人外教辅导；Busuu 与 HelloTalk
              融合了语言学习与社区交流；Praktika 是最具代表性的 AI 原生口语导师；ELSA 则专注于英语口语与发音。这一竞争格局表明，Speak 不仅要保卫自身的功能特性，更要确立其独立的产品品类地位。

              其替代品范围尤为广泛。学习者可以在语言交换应用中免费练习、购买真人课程、使用免费增值的游戏化应用，或转向价格更低的 AI 导师。Speak
              的差异化优势必须同时经受价格与用户使用习惯的双重考验：一旦用户感受不到进步，便会跨应用混用、暂停使用或直接流失。
