      - number: '7.2'
        title: 产品交付质量与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              产品交付质量风险在多处公开渠道均有显现。Speak
              帮助中心专门设有针对语音识别故障的排查指引，独立测评指出该应用在发音判定上可能过于宽松，从而造成“虚假掌握感”。应用商店评价亦提及识别延迟与麦克风拾音异常问题。此类抱怨虽不至于致命，但由于公司销售的不仅是软件工具更是开口信心，交付瑕疵仍具实质影响。

              平台依赖风险是另一大隐患。Speak 在分发上高度依赖各大移动应用商店，在核心交互体验上则依赖第三方 AI、语音及网络服务商。若这些底层供应商调整价格、降低服务质量或变更服务政策，Speak
              的财务模型与用户体验将迅速受到冲击。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
