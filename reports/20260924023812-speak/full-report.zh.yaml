    sections:
      - number: '1.1'
        title: 业务定位、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Speak 是 Speakeasy Labs 旗下面向消费者的品牌，属于主打口语流利度而非被动死记硬背的语音优先语言学习应用。公司将自身定位为 AI
              导师，引导学习者大声开口、获取实时反馈并建立对话信心。其公开产品界面现已覆盖个人订阅以及面向雇主的企业产品，不再局限于单一移动端切入点。

              当前的公开商业定位十分清晰：Speak 提供月度或年度个人订阅，Speak for Business
              则为机构提供按席位或按合同采购的员工培训方案。官网首页与企业版页面均强调口语优先教学法，企业版页面还突出管理端控制、学员进度追踪与职场应用场景，商业模式清晰易懂，但非公开财务状况仍不透明。
