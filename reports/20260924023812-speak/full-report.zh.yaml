      - number: '3.2'
        title: 功能、定价与分发渠道对比
        blocks:
          - type: paragraph
            body: >-
              横向对比各家产品，核心差异不在于功能罗列，而在于定位取舍。Duolingo 胜在用户触达与习惯养成，真人外教平台胜在互动反馈，社区类产品胜在社交化实战，Speak 则在学习者需要结构化口语练习与即时 AI
              反馈的场景下胜出。核心疑问在于：这项优势是否足够持久以支撑其溢价订阅，以及是否具备足够的差异化以抵御低价替代品冲击、避免沦为通用商品。

              公开定价信号同样关键。Speak 的定价处于行业中位，低于持续的高频真人私教，但高于免费语言交换工具。公司必须拿出扎实的价值证明，而不能单靠产品新奇感。应用商店评价与独立第三方测评显示，Speak
              的口语练习受到认可，但针对语音识别质量与“虚假掌握感”的抱怨亦不容忽视。
