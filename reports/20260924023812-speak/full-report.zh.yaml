      - number: '4.2'
        title: 成本结构与资本密集度
        blocks:
          - type: paragraph
            body: |-
              Speak 并非重硬件或重库存的生意，但产品运营并不便宜。语音识别、大语言模型推理、语音到语音交互、本地化和客户支持，都会带来简单内容应用无需承担的多层可变成本。服务交付成本很可能比资本支出更重要。
              融资规模也释放了投资者看好的信号，但公开记录没有说明，资金究竟带来了高效增长，还是仅用于昂贵的产品迭代。消费端与企业端业务并行，关键要看扣除平台费用和 AI 交付成本后，每 1 美元收入能留下多少可持续毛利。
