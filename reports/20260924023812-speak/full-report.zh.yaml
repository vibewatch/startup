      - number: '5.3'
        title: 信任机制、交付质量与研发路线图
        blocks:
          - type: paragraph
            body: >-
              Speak 在安全与信任机制上的建设优于普通的 AI 套壳应用，但仍不够完善。公司在隐私政策中披露了麦克风与音频数据的采集用途，提供客服支持指导用户排查语音识别故障，并维持着高频的产品迭代。与此同时，公开记录未见
              SOC 2 或 ISO 27001
              等正式安全合规认证，独立测评人也指出了发音纠错判定偏宽以及偶现“虚假掌握”的问题。从尽调实务来看，该产品具备一定的可信度，但在内控流程、测试机制和应急响应仍需深入追问的前提下，尚不足以被认定为成熟的企业级产品。

              其产品迭代路线图推进迅速。Speak 在 2025 年与 2026 年的官方发文中陆续上线了新语种、冬季个性化版本、Speak Level
              等级体系以及更沉浸的角色扮演体验。公司扩张步伐敏捷，但尽调核心疑问在于：交付质量提升与合规风控建设，能否跟得上功能扩张节奏。
            claimRefs:
              - CE001
              - CE002
