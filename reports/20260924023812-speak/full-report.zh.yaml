      - number: '8.3'
        title: 尽调诉求与总结裁定
        blocks:
          - type: paragraph
            body: >-
              估值裁定结论偏向审慎。Speak
              展现的商业证据足以支撑持续跟进尽调，其增长动能大概率也配得上显著的一级市场溢价，但信息披露深度不足以支撑上调确定性评级。悬而未决的疑问依然聚焦于未上市企业通用的核心问题：收入质量、单位经济效益、客户留存、集中度风险以及股权结构表设计。

              在上述核心问题获得解答之前，恰当的判断并非否定 Speak 的商业价值，而是指出其估值目前更多由市场势头驱动，而非源自扎实透明的公开基本面支撑。这符合成长型企业的典型特征，但尚未达到具备充分透明度的投资级别。
            claimRefs:
              - CV009
              - CV010
