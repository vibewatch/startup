      - number: '5.2'
        title: 技术架构与语音底层设施
        blocks:
          - type: paragraph
            body: >-
              Speak 公开披露了一套具备相当复杂度的语音技术栈。公司表示已将后端自动语音识别（ASR）系统升级为 Conformer-CTC 模型，并搭建了更广泛的语音智能体平台，整合了 WebRTC、LiveKit、外部
              ASR 与文本转语音（TTS）供应商，并在部分实时角色扮演场景中接入了 OpenAI Realtime。官方博客亦阐述了根据具体功能需求而非技术教条，在级联方案与端到端语音转语音之间做出灵活选择的设计策略。

              该架构展现出扎实的技术积累，同时也带来了极高的运维复杂度。该技术栈跨多家供应商、具备地域感知能力，并全面围绕低延迟进行优化。这解释了公司为何将大量精力投入到话轮检测、长尾延迟优化、供应商故障切换与模型评估中。只有语音交互足够自然、让学习者感知不到底层工程链路的存在，产品体验才能真正成立。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
