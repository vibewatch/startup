company:
  name: Speak
chapter:
  number: 4
  title: Financials
  summary: >-
    Speak has a credible monetization stack—consumer subscriptions plus enterprise contracts—but public financial
    disclosure remains thin. The company has raised meaningful capital and shown obvious consumer demand, yet ARR,
    gross margin, churn, CAC, and runway remain opaque.
sections:
  - id: revenue-model
    title: Revenue model and pricing
    body: >-
      Speak appears to monetize through two visible rails. The consumer rail is subscription software sold through
      mobile app stores and the business rail is Speak for Business, an enterprise product sold to organizations that
      want language training for teams. The public pricing anchor is mid-market: the homepage says Speak offers a
      7-day free trial and that price varies by region, while store listings show annual and monthly subscription tiers.

      That makes the business model easier to understand than the revenue quality. The public evidence tells us how the
      company wants to charge, but not how much it actually collects after trial conversion, app-store fees, refunds,
      discounts, or enterprise services. The result is a visible monetization architecture with weak underwriting
      visibility.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure
    title: Cost structure and capital intensity
    body: >-
      Speak is not capital-intensive in the hardware or inventory sense, but the product is not cheap to run. Voice
      recognition, LLM inference, speech-to-speech interactions, localization, and customer support all create variable
      cost layers that a simple content app would not have. That likely means delivery cost matters more than capex.

      The company has also raised enough capital to suggest investor confidence, but the public record does not tell us
      whether that capital is being translated into efficient growth or simply funding expensive product iteration. In a
      business with both consumer and enterprise rails, the real question is how much of each dollar becomes durable
      gross profit after platform fees and AI delivery costs.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: financial-verdict
    title: Financial verdict and diligence gaps
    body: >-
      Speak’s financial verdict is cautiously positive on demand and cautious on transparency. The company has real
      traction, a recent unicorn mark, and enough public pricing to show that customers are paying something. But the
      public record still lacks the data needed for a conviction underwriting call: ARR, gross margin, payback,
      retention, concentration, runway, and enterprise contract quality. Even capital adequacy is only inferable from
      the latest financing headline rather than from a disclosed cash balance or burn profile.

      That means the financing story is credible but incomplete. The company may be healthy and growing quickly, but the
      current public evidence cannot distinguish between “good business with hidden unit economics” and “expensive
      growth supported by strong capital markets.” Until those private metrics are shared, the right conclusion is that
      the revenue model is plausible but still not fully underwritten.
    claimRefs: [CI009, CI010, CI011, CI012]
