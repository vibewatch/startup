    notes: Public prices are list prices or public model descriptions, not realized net revenue.
    claimRefs: [CI001, CI002, CI005]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value / status, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, null, low, 'Core scale metric is not public', 'Request current ARR and billings']
      - [Gross margin, null, low, 'Computes delivery efficiency', 'Request gross margin by channel']
      - [CAC / payback, null, low, 'Shows growth efficiency', 'Request CAC and payback by channel']
      - [Churn / retention, null, low, 'Tests product stickiness', 'Request churn, NRR, and GRR']
      - [Runway / burn, null, low, 'Shows financing dependency', 'Request current cash and burn model']
      - [Enterprise ACV, null, low, 'Tests B2B quality', 'Request ACV and renewal rates']
    notes: This table is intentionally sparse because those metrics are not public in the reviewed source set.
    claimRefs: [CI007, CI008, CI009, CI010]
