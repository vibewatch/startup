chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Ripple addresses institutional cross-border value movement, but the available
    evidence does not support a clean revenue TAM, SAM, or SOM. Published figures
    describe gross payment flows and distribution proxies, while product choice,
    regulatory eligibility, and stablecoin substitution constrain how much of that
    activity can create revenue for Ripple or demand for XRP.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The defensible market boundary is institutional cross-border value movement,
      not the full value of global payments and not retail XRP speculation. Ripple
      describes financial institutions, businesses, governments, and developers as
      its users, while a third-party product review distinguishes fiat-capable
      messaging products from On-Demand Liquidity, which uses XRP as a bridge asset.
      Included workflows therefore span cross-border payment orchestration,
      liquidity conversion, and regulated institutional exchange or transfer
      services. Excluded from a software-market estimate are the gross principal
      value of payments, retail token trading, and any assumption that every Ripple
      product creates XRP demand. Stablecoins are a direct internal substitute:
      Ripple's chief executive said a stablecoin may solve some payment problems
      better than XRP, making product adoption and token value capture separate
      questions.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM009"
      - "CM010"
      - "CM014"
    tableRefs:
      - "TM001"
  - id: "sizing-evidence"
    title: "Sizing evidence and its limits"
    body: >-
      The largest figures in the assigned evidence are flow measures rather than
      vendor revenue pools. Rainmaker Securities cites $156 trillion of global B2B
      cross-border payments in 2022 and approximately $702 billion of remittances in
      2020. Neither figure supplies a software take rate, addressable customer count,
      current growth rate, or Ripple-specific share. Distribution indicators are
      also inconsistent in scope: the profile reports more than 300 customers and
      solutions active in 40 countries, whereas Ripple's current company page claims
      delivery in more than 90 countries. Different vintages or definitions may
      explain the gap, but the sources do not reconcile it. These figures justify a
      broad opportunity thesis only; they cannot be multiplied or treated as a
      nested TAM-to-SOM calculation.
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers, adoption path, and budget ownership"
    body: >-
      The source-backed buyer set includes financial institutions, businesses,
      governments, developers, and regulated institutional crypto customers. Access
      is jurisdiction- and entity-specific rather than universal. Ripple's European
      disclosure says its exchange and transfer services are offered exclusively to
      institutional customers and not to retail clients. Its UK disclosure limits
      directed services to defined relevant persons, including investment
      professionals and qualifying high-net-worth companies or bodies. The likely
      operational users are payments, treasury, and compliance teams, but the
      assigned sources do not identify the actual budget owner, procurement cycle,
      contract value, or implementation hurdle by segment. Adoption should therefore
      be evaluated as a regulated enterprise sale whose reachable population depends
      on service permissions, customer eligibility, and the selected settlement
      asset.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Avoiding pre-funded destination accounts is the clearest economic driver in
      the assigned evidence, but XRP is not required across every reviewed Ripple
      product. Stablecoins can reduce exposure to a volatile bridge asset and may
      win payment use cases even when Ripple supplies the surrounding infrastructure.
      An independent XRP-focused newsletter frames the unresolved issue directly:
      Ripple's corporate expansion does not automatically establish value capture
      for XRP. Regulation remains another adoption constraint. The SEC's May 2025
      release described a settlement framework tied to the existing $125,035,150
      civil penalty, while expressly stating that seeking resolution was not an
      assessment of the claims' merits or a position on other cases. Ripple also
      reported substantial XRP holdings and escrow balances in 2023; those are supply
      facts, not evidence of current market demand or available cash.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
      - "CM016"
