callouts:
  - calloutType: "insight"
    title: "Company adoption is not the same as XRP demand"
    body: >-
      The evidence supports a market for Ripple's institutional infrastructure, but
      product rails that do not require XRP and payment use cases better served by a
      stablecoin break any one-to-one link between customer growth and token demand.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM014"
