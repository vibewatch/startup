evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited revenue, ARR, profitability, current valuation, exact customer count, exact payroll headcount, and
      unrestricted cash.
    whyItMatters: >-
      Without consistently defined private-company metrics, operating scale cannot be translated into growth quality,
      runway, or valuation multiples.
    diligencePath: >-
      Request audited financial statements, management KPI definitions, customer cohort schedules, payroll records,
      capitalization documents, and bank statements.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled financing schedule covering primary equity, strategic investments, secondaries, debt, token-related
      proceeds, and cash uses.
    whyItMatters: >-
      The $700 million database total covers two rounds and conflicts with the broader historical financing list, while
      neither figure measures cash available.
    diligencePath: >-
      Reconcile board-approved financing documents, the fully diluted cap table, cash-flow statements, and closing
      records for every round.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-control
    missingEvidence: >-
      A current board roster, committee charters, investor appointment rights, ownership percentages, voting agreements,
      and related-party policies.
    whyItMatters: >-
      Public financing participation does not establish current ownership or control, and the assigned governance source
      explicitly says board composition is incomplete.
    diligencePath: >-
      Obtain the charter, bylaws, board and committee roster, investor-rights agreements, voting agreements, and fully
      diluted cap table from the company secretary.
    relatedQuestionRefs:
      - QO002
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: >-
      Current contract values, product-level transaction volumes, take rates, eligible customer counts, and conversion
      assumptions for a bottom-up SAM and SOM.
    whyItMatters: Gross payment flows do not establish Ripple's monetizable revenue pool or attainable share.
    diligencePath: >-
      Request product-level bookings, processed volume, pricing, customer cohorts, corridor economics, and management's
      reconciled TAM-to-SOM model.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Named budget owners, procurement stages, implementation timelines, and approval thresholds for each institutional
      buyer segment.
    whyItMatters: Adoption timing and sales efficiency cannot be assessed from buyer labels alone.
    diligencePath: >-
      Review representative contracts and interview payments, treasury, compliance, and technology stakeholders at
      current and lost accounts.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitive-scale
    missingEvidence: >-
      Comparable current revenue, payment volume, active institutional customer, and funding data across the major
      competitive classes.
    whyItMatters: Without common denominators, reported reach cannot establish share, growth, or relative commercial scale.
    diligencePath: >-
      Request audited corridor volumes and customer counts, then collect primary disclosures from named competitors on
      the same period and denominator.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Matched realized pricing, spreads, implementation cost, service levels, and discounts for Ripple and each buyer's
      incumbent alternative.
    whyItMatters: Network-fee claims do not reveal total enterprise cost or whether switching produces a positive return.
    diligencePath: >-
      Run a corridor-level request for proposal using identical currencies, volumes, compliance requirements, and
      exception scenarios.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-multihoming
    missingEvidence: >-
      Customer retention cohorts, exclusivity terms, integration effort, rail-level usage mix, and reasons for churn or
      multi-homing.
    whyItMatters: Distribution reach is not a durable moat if customers can route around XRP or switch rails at low cost.
    diligencePath: >-
      Interview current and former customers and inspect contracts, integration maps, and monthly rail-level transaction
      logs.
    relatedQuestionRefs:
      - QP007
      - QP009
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: independent-performance
    missingEvidence: >-
      An independent, like-for-like benchmark of realized settlement time, failure rate, liquidity cost, compliance
      handling, and total cost by corridor.
    whyItMatters: Vendor and commentator comparisons cannot establish operational superiority or quantify the moat.
    diligencePath: Commission controlled tests across Ripple, the incumbent route, a stablecoin route, and one bank-led alternative.
    relatedQuestionRefs:
      - QP003
      - QP008
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: operating-gross-margins
    missingEvidence: >-
      Audited gross margins, cost of goods sold, and hosting/infrastructure expenditures segmented across Ripple
      Payments, Hidden Road clearing, and RLUSD reserve custody.
    whyItMatters: >-
      Without segmented gross margins, an underwriting analyst cannot model unit profitability or distinguish
      high-margin enterprise software fees from capital-intensive brokerage clearing.
    diligencePath: >-
      Request confidential CIM disclosures, audited TTM income statements, and management cost allocation schedules
      during formal pre-IPO diligence.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-cac
    missingEvidence: >-
      Enterprise sales cycle length, Customer Acquisition Cost (CAC), and customer net revenue retention (NRR) across
      banking and institutional remittance partners.
    whyItMatters: >-
      Prevents validation of commercial sales efficiency and whether customer contract expansion offsets enterprise
      direct sales overhead across 15 global offices.
    diligencePath: Review institutional cohort retention tables and direct enterprise sales productivity benchmarks.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-specifications
    missingEvidence: >-
      Direct public access to primary system architecture diagrams, low-level validator node latency benchmarks, and
      verified production API uptime statistics outside of recruiting posts and marketing summaries.
    whyItMatters: >-
      Independent institutional underwriting cannot verify cross-border transaction throughput ceilings, node consensus
      failover latency, or SLA adherence without unredacted system engineering telemetry.
    diligencePath: >-
      Request production SLA dashboards, SOC 2 Type II engineering controls reports, and third-party penetration testing
      summaries under confidentiality agreements during technical diligence.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: treasury-metrics
    missingEvidence: >-
      Audited transaction volumes, customer retention metrics, and segregated software license revenues for the Ripple
      Treasury SaaS forecasting product.
    whyItMatters: >-
      While recruiting disclosures state that Ripple Treasury manages over $100 billion in daily cash flow across 40+
      countries, commercial ARR and contract durability cannot be independently segregated from overall corporate
      holdings.
    diligencePath: >-
      Obtain SaaS cohort retention data, customer count breakdown by tier, and gross revenue reconciliation for the
      treasury division during financial diligence.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: Customer Retention and Churn Rates
    missingEvidence: >-
      Audited Gross Revenue Retention (GRR), Net Revenue Retention (NRR), and annualized logo churn statistics across
      Ripple Payments and Ripple Treasury.
    whyItMatters: >-
      Without verifiable retention and expansion rates, investors cannot evaluate whether Ripple's enterprise revenue
      represents durable, expanding customer cohorts or relies on ongoing replacement sales.
    diligencePath: >-
      Request historical cohort retention reports, renewal rate history, and expansion metrics during confidential
      management diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: Named Customer Proof Table Enumeration Scope
    missingEvidence: An exhaustive registry of all active commercial customers, deployment stages, and transaction volume per account.
    whyItMatters: >-
      Public customer references represent a self-selected sample; an exhaustive audit is required to assess customer
      concentration and the share of accounts utilizing XRP versus fiat software.
    diligencePath: >-
      Obtain an anonymized customer master list showing annualized billings, contract start dates, and product modules
      active per account.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive non-public settlement records and active bilateral licensing covenants across Asian and Latin
      American subsidiaries.
    whyItMatters: >-
      Full visibility into jurisdictional operating covenants and capital adequacy restrictions is required to quantify
      multi-regional compliance cost.
    diligencePath: Request confidential subsidiary audit schedules and jurisdictional compliance filings during management diligence.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: counterparty-concentration
    missingEvidence: Detailed balance sheet breakdowns of client funds by individual credit institution and custodian.
    whyItMatters: >-
      Client money safeguarding disclosures state Ripple exercises due skill but does not guarantee credit institution
      solvency; single-bank failure exposure cannot be quantified.
    diligencePath: Obtain depository allocation schedules and insurance certificates for all safeguarding and custody bank partners.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited GAAP income statements, cash flow statements, and segment gross margins for Ripple Labs Inc.
    whyItMatters: >-
      Current revenue estimates ($1.2B) and valuation multiples (33.3x-41.7x) rely on secondary funding reports without
      verified cash burn or profitability.
    diligencePath: >-
      Request audited financial statements for FY2024-FY2025, board-approved management forecasts, and detailed software
      vs. prime brokerage revenue breakdowns during confidential data room review.
    relatedQuestionRefs:
      - QV001
      - QV008
  - type: conflicting-data
    severity: minor
    topic: valuation
    missingEvidence: >-
      Reconciliation between Tracxn's reported $11B Series C valuation and subsequent $40B-$50B secondary and primary
      valuation marks.
    whyItMatters: Historical round databases often lag private secondary transaction marks and tender offer pricing updates.
    diligencePath: >-
      Obtain the official cap table, 409A valuation appraisals, and latest secondary share price transaction records
      directly from Ripple investor relations.
    relatedQuestionRefs:
      - QV001
