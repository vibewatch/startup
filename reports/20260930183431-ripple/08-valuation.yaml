callouts:
  - calloutType: "insight"
    title: "Secondary Tender Offers vs. Primary Valuation Signals"
    body: "Ripple's $50 billion headline valuation stems from a $750 million secondary share buyback in March 2026 rather than fresh capital entering the balance sheet. Investors should distinguish secondary liquidity events—which reflect private shareholder appetite and cap table liquidity—from primary funding rounds with negotiated investor protections, board seats, and standard liquidation preferences."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
  - calloutType: "risk"
    title: "Structural Decoupling of Enterprise Equity and XRP Token Treasury"
    body: "Although Ripple's enterprise equity is marked at $50 billion and XRP carried a market cap of approximately $90.5 billion in August 2026, equity holders have no direct legal claim on the digital token treasury. Valuing Ripple by directly attributing its 38-40 billion XRP treasury at market value creates substantial downside risk if token prices decouple or secondary markets discount token liquidity."
    claimRefs:
      - "CV005"
      - "CV006"
