callouts:
  - calloutType: "insight"
    title: "Enterprise Adoption Decoupled From Floating Bridge Assets"
    body: "Institutional customer adoption of Ripple's infrastructure in 2026 demonstrates clear traction in software licensing, compliance-first custody, and fiat-pegged stablecoins like RLUSD, but this growth does not mandate transactional utilization of XRP. While early network narratives assumed cross-border banks would hold and settle XRP, current institutional adoption shows commercial lenders adopting Ripple Custody and RLUSD to avoid cryptocurrency balance-sheet volatility."
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
  - calloutType: "risk"
    title: "Absence of Disclosed Retention and Cohort Metrics"
    body: "While Ripple Treasury reports $100M ARR in the Office of the CFO software domain, Ripple does not publish gross or net retention rates, cohort churn, or customer concentration percentages for its payment network. The absence of public contract renewal rates leaves investors unable to audit whether client logos translate into durable, growing transactional cash flows."
    claimRefs:
      - "CU011"
      - "CU014"
      - "CU015"
