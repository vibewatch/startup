chapter:
  number: 6
  title: "Customers"
  summary: "Ripple serves a segmented institutional customer base across global banks, regional payment firms, cryptocurrency exchanges, and enterprise CFO treasury desks. Commercial traction across Ripple Payments, Ripple Custody, and the RLUSD stablecoin demonstrates expanding enterprise utility, but direct XRP utilization remains concentrated among a documented subset of remittance partners, with customer retention, net revenue retention, and contract values remaining undisclosed."
sections:
  - id: "customer-segmentation-and-buyer-personas"
    title: "Customer Base Segmentation, Buyer Personas, and Revenue Architecture"
    body: "Ripple's commercial monetization spans four distinct customer segments: global banking institutions and regional commercial banks, payment service providers and remittance operators, digital asset exchanges and OTC brokers, and corporate treasury offices. Each segment engages with different modules across Ripple's institutional product suite and operates under distinct regulatory and procurement constraints. Commercial banks and payment providers, such as Jeonbuk Bank, Santander, and SBI Remit, utilize Ripple Payments infrastructure to accelerate cross-border messaging and settlement. Regional banking institutions face high capital costs from bilateral nostro pre-funding in foreign currency corridors, motivating adoption of distributed settlement. In contrast, corporate treasury departments engage through Ripple Treasury, an enterprise SaaS solution delivering 24/7 liquidity access, cash visibility, and yield management for the Office of the CFO. High-touch enterprise account management is required because buyer personas range from Heads of Global Transaction Banking and Chief Information Officers at tier-one banks to corporate Treasurers and Controllers evaluating rail-agnostic payment options."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory, Enterprise Deployments, and Product-Level Decoupling"
    body: "Evaluating Ripple's enterprise adoption requires separating general software relationships from verified asset utilization. While historical marketing highlights over 100 RippleNet participants across more than 90 countries—including Itaú Unibanco, InstaReM, CIBC, and Kotak Mahindra Bank—the majority deploy software messaging or bilateral clearing via xCurrent rather than native digital asset settlement. Public evidence verifies that direct XRP use is limited to specific corridors managed by partners including SBI Remit, Bitso, and Tranglo. In 2026, Ripple expanded its institutional footprint across custody and stablecoins without requiring counterparties to hold XRP. Notable deployments include South Korea's Jeonbuk Bank adopting Ripple Payments for cross-border flows in August 2026, and Kbank implementing Ripple Custody wallet infrastructure in April 2026. Furthermore, the launch of Ripple USD (RLUSD) catalyzed regional adoption in Türkiye through partnerships with BiLira, Bitexen, and Bitlo, scaling institutional stablecoin market capitalization to $1.7 billion. These expansions demonstrate institutional demand for compliant, regulated digital asset rails while highlighting that client growth is decoupled from mandatory XRP adoption."
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics, Diligence Gaps, and Concentration Constraints"
    body: "Despite commercial expansion across payments and custody, Ripple's customer profile presents significant underwriting uncertainties regarding retention, unit economics, and client concentration. Ripple does not disclose standard software metrics such as Gross Revenue Retention (GRR), Net Revenue Retention (NRR), customer churn rates, or average contract value across its product lines. In enterprise treasury operations, Ripple Treasury reports a $100 million ARR run rate for its CFO software suite, relying on formal reference programs to mitigate long enterprise sales cycles and competitive friction. However, customer concentration in cross-border payments remains opaque, with transaction volumes heavily dependent on high-volume corridor partners such as SBI Remit in Japan and Bitso in Latin America. Additionally, regulatory enforcement history continues to influence customer procurement: legal resolutions such as the May 2025 SEC civil settlement framework—addressing historical institutional sales of digital assets for a $50 million payment—highlight how past institutional contracting disputes created compliance friction for US banking prospects. As institutional buyers evaluate alternative rails, Ripple's ability to maintain high retention depends on delivering predictable compliance and liquidity across diverse multi-asset corridors."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
