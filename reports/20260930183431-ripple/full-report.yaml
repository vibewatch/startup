    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Growth & Operating Assumptions
      - Enterprise Valuation Range
      - Key Vulnerabilities
      - Probability Signal
    rows:
      - - Bull Case
        - Ripple Prime doubles revenue; RLUSD surpasses $10B market cap; enterprise revenue reaches $2.5B
        - $60B - $75B (24x-30x multiple)
        - Stablecoin yield compression and enterprise churn
        - 25% (Requires sustained crypto institutional adoption and IPO window)
      - - Base Case
        - Cross-border payments grow 15%-20%; prime brokerage maintains steady volumes; revenue reaches $1.3B - $1.5B
        - $35B - $45B (25x-30x multiple)
        - Secondary multiple contraction toward traditional fintech peers
