chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Ripple is a private company founded in 2012 and based in San Francisco. Its official materials position
              the business as financial infrastructure for institutions operating across traditional and digital assets,
              with cross-border payments and digital-asset custody at the center of the current offering. That is
              broader than a single-token thesis: the company describes services for banks and fintechs, while its
              corporate page frames the mission around storing, moving, and exchanging value. The evidence does not
              disclose a current pricing model or revenue mix, so the relative contribution of software, transaction
              services, custody, treasury products, and digital-asset holdings remains a diligence question rather than
              a verified business-model split.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Scale and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Ripple reports more than 1,000 employees and more than 15 offices, while FundedIQ places employment in a
              501–1,000 band. These measures use different formats and are not an audited point-in-time headcount, so
              they establish scale but not a precise denominator. Financing evidence is also non-comparable: FundedIQ
              records $700 million across two recent rounds, whereas Wikipedia's historical table lists older angel,
              seed, Series A, Series B, and Series C financings in addition to a November 2025 strategic investment.
              Accordingly, $700 million is a database-specific recorded total, not a defensible lifetime-capital figure,
              and neither source establishes cash currently available. Revenue, ARR, valuation, customer count, and
              profitability remain unsupported in the assigned pool.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO014
              - CO015
      - number: '1.3'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies Brad Garlinghouse as chief executive officer, Monica Long as president, and
              Chris Larsen and Jed McCaleb as founders. It does not provide a reliable, complete current board roster,
              committee structure, voting rights, or ownership percentages. XRP Academy proposes a board composition
              involving founders, strategic investors, and independent directors, but the same page explicitly says the
              exact composition is not fully disclosed and labels several seats as likely or estimated. That content is
              therefore useful only as a map of questions, not confirmation of directors. Governance diligence should
              focus on the current cap table, board appointment rights, committees, related-party controls, and the
              separation between operating-company decisions and XRP-related economic exposure.
            claimRefs:
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.4'
        title: Milestones and Regulatory Position
        blocks:
          - type: paragraph
            body: >-
              Ripple's history combines corporate formation, venture financing, product launches, international
              expansion, and a material U.S. enforcement action. The SEC sued Ripple and two executives in December 2020
              over alleged unregistered offers and sales of XRP. A 2024 final judgment imposed a $125,035,150 civil
              penalty and an injunction; the SEC's May 2025 release described a proposed settlement framework that would
              have modified those terms, not a completed reduction. Separately, Ripple's September 2026 compliance page
              lists regulated entities in the United Kingdom, Dubai, Luxembourg, and Singapore. These licenses support
              the existence of a multi-jurisdiction operating footprint, but they do not establish consolidated
              financial performance, product adoption, or the absence of regulatory restrictions elsewhere.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
