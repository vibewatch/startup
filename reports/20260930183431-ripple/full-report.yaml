      - - Bear Case
        - Injunction restricts institutional XRP growth; RLUSD loses share to USDC/USDT; revenue falls below $800M
        - $15B - $20B (15x-20x multiple)
        - Renewed regulatory sanctions, liquidity squeeze on debt notes, institutional partner churn
        - 25% (Reflects downside exposure if secondary market liquidity freezes)
