  topStrengths:
    - 庞大的机构分销网络与多司法管辖区合规牌照布局。
    - 除 XRP 之外拓展出多条变现业务线，包括支付、托管、资金管理与主经纪商业务。
    - 具备可观的一级市场估值及显见的资本获取能力。
  topRisks:
    - 经审计财务数据、现金生成能力及各分部经济效益仍不透明。
    - 并非所有产品都必须依赖 XRP 需求，代币上行收益未必能跟上业务经营增长。
    - 历史监管诉累与合规复杂性可能持续压制业务落地与估值水平。
  unresolvedGaps:
    - 经审计的 FY2024-FY2025 财务报表及各分部毛利率。
    - 当前确切的客户数量、留存指标以及各支付走廊层面的经济效益。
    - 与近期一级市场交易挂钩的确定性股权结构表及股东权益。
