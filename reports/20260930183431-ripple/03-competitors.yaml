company:
  name: "Ripple"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Ripple competes simultaneously with SWIFT and correspondent banking, Stellar and other
    public ledgers, stablecoin rails, and bank-controlled settlement systems. Its enterprise
    distribution and regulatory footprint are meaningful, but public evidence does not establish
    superior total cost, switching durability, or a requirement that customers use XRP.
sections:
  - id: "competitive-landscape"
    title: "The competitive set is broader than crypto payment tokens"
    body: >-
      The relevant buyer decision is not simply Ripple versus Stellar. A financial institution can
      retain correspondent banking and a modernized SWIFT workflow, use a public ledger with a
      stablecoin, join a bank-controlled tokenized-deposit network, connect through card-network
      infrastructure, or build around central-bank and internal rails. Contemporary third-party
      analysis identifies SWIFT, stablecoins, Stellar, smart-contract platforms, and bank-led
      systems as distinct alternatives, while an older review also identified CBDCs and SWIFT as
      substitutes. This breadth matters because several alternatives preserve an institution's
      existing compliance, treasury, or distribution relationships rather than asking it to adopt
      XRP as bridge liquidity. Public sources support the categories, but not a complete market-share
      ranking or comparable funding data for every alternative.
    claimRefs: ["CP009", "CP010", "CP011", "CP013", "CP016"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "capability-and-distribution"
    title: "Distribution and settlement-asset choice are the decisive axes"
    body: >-
      Ripple's official positioning is enterprise-first: it says its products serve financial
      institutions, businesses, governments, and developers, and that it operates across more than
      90 countries. That reach is a commercial asset, but SWIFT's reported connection to more than
      11,000 institutions creates a formidable installed-base advantage. Stellar overlaps in
      payments, remittances, asset issuance, and low-cost settlement, while stablecoins offer a
      price-stable settlement asset. Bank-led systems and modernized incumbent rails can compete by
      using relationships, controls, and balance-sheet structures that buyers already understand.
      The resulting moat is therefore distribution plus regulatory execution, not an exclusive
      technical capability; multi-homing remains plausible because the sources do not demonstrate
      contractual exclusivity or prohibitive integration costs.
    claimRefs: ["CP001", "CP002", "CP008", "CP009", "CP010", "CP011", "CP012", "CP016"]
    tableRefs: ["TP002"]
  - id: "pricing-trust-and-switching"
    title: "Public pricing is insufficient for a total-cost comparison"
    body: >-
      Ripple's European disclosure provides the clearest available packaging evidence: the covered
      exchange and transfer services are offered only to institutional customers, transaction terms
      are negotiated individually, and pricing references approved regulated venues plus a spread
      and/or transaction fee. Ripple also says it does not publish aggregated transaction data for
      those services. This prevents a defensible comparison of realized price, implementation cost,
      liquidity cost, and service levels against SWIFT, Stellar-based providers, stablecoin rails,
      or internal builds. Regulatory permissions and client-money controls can lower perceived
      adoption risk, yet the 2023 court order and 2025 SEC settlement release show that legal
      history remains part of trust diligence. Buyers should require corridor-level bids and
      implementation evidence rather than infer economics from network-level fee claims.
    claimRefs: ["CP003", "CP004", "CP005", "CP006", "CP007"]
    tableRefs: ["TP003"]
  - id: "durability-verdict"
    title: "The moat is credible but not demonstrated as durable"
    body: >-
      The strongest durability case is Ripple's combination of enterprise focus, geographic reach,
      regulated operating entities, and a product set that can support crypto assets, fiat, and
      stablecoins. The counterargument is structural: stablecoins may strengthen Ripple's corporate
      offering while reducing the need for XRP, and SWIFT can absorb ledger interoperability into a
      familiar institutional network. Historical commentary also raises concentration and default
      validator-list concerns, while a user discussion shows that claimed decentralization,
      transaction advantages, and real-world utilization remain contested rather than independently
      benchmarked. The evidence therefore supports a differentiated contender, not an inevitable
      winner. Investment diligence should test customer retention, multi-rail usage, corridor-level
      economics, and the share of payment volume that specifically requires XRP.
    claimRefs: ["CP002", "CP008", "CP012", "CP014", "CP015", "CP016"]
