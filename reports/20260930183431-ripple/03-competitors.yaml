figures:
  - id: "FP001"
    title: "Ordinal positioning: institutional distribution versus external bridge-asset dependence"
    type: "quadrant"
    summary: >-
      Analyst-scored positions compare relative institutional distribution (x) and dependence on an
      external volatile bridge asset (y), both on a 1-low to 5-high ordinal scale.
    data:
      points:
        - label: "Ripple / XRP-centric corridor"
          x: 4
          y: 5
          detail: "Strong enterprise reach claim; highest bridge-asset dependence when XRP is required."
        - label: "Ripple / stablecoin or fiat corridor"
          x: 4
          y: 2
          detail: "Same enterprise channel with lower XRP dependence, subject to product and corridor terms."
        - label: "SWIFT modernization"
          x: 5
          y: 1
          detail: "Largest reported institutional connectivity and no native volatile bridge-token requirement."
        - label: "Stellar / issued-asset rail"
          x: 3
          y: 2
          detail: "Overlapping payment capability with stablecoin-oriented settlement and less evidenced bank reach."
        - label: "Independent stablecoin rail"
          x: 3
          y: 1
          detail: "Stable-value settlement lowers bridge-token exposure; distribution varies by issuer and chain."
        - label: "Bank-led tokenized deposits"
          x: 4
          y: 1
          detail: "Institution-controlled distribution with settlement in deposits or defined institutional assets."
    approximationNotes: >-
      Ordinal analyst scores, not measured market shares or performance benchmarks. Scores synthesize
      the assigned sources' distribution and settlement-asset descriptions; one-point differences
      are directional and should not be read as quantified gaps.
    claimRefs: ["CP008", "CP012", "CP016"]
callouts:
  - calloutType: "risk"
    title: "Corporate success may not require XRP"
    body: >-
      Ripple can strengthen its payments business through stablecoins, fiat connectivity, custody,
      and regulated exchange services even if customers do not require XRP as bridge liquidity.
    claimRefs: ["CP008", "CP016"]
  - calloutType: "recommendation"
    title: "Underwrite the corridor, not the headline network fee"
    body: >-
      Request matched corridor bids covering implementation, spread, liquidity, compliance,
      exception handling, and realized settlement time across Ripple and the incumbent alternative.
    claimRefs: ["CP003", "CP004", "CP005"]
