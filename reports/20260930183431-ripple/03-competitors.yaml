      - ["SWIFT / correspondent", "Not disclosed in assigned evidence", "Bank and correspondent relationship", "Messaging, coordination, and incumbent workflow", "Bank, corridor, FX, and intermediary charges are unknown", "Compare an actual incumbent payment trace, not headline fees"]
      - ["Stellar or stablecoin provider", "Source describes low network fees but no audited enterprise total cost", "Open rail plus issuer, wallet, exchange, and off-ramp providers", "Token or stablecoin transfer and conversion", "Liquidity, redemption, compliance, and off-ramp charges are unknown", "Price the full corridor and failure handling"]
