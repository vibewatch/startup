      - number: '3.2'
        title: 分销渠道与结算资产选择是决定性维度
        blocks:
          - type: paragraph
            body: >-
              Ripple 官方主打企业级定位：称其产品服务于金融机构、企业、政府与开发者，且业务遍布超 90 个国家。这一触达能力属于商业资产，但据报道 SWIFT 连接了 11,000
              多家机构，形成了巨大的存量装机优势。Stellar 在支付、汇款、资产发行与低成本结算上与 Ripple
              重合，而稳定币则提供了价格稳定的结算资产。银行主导的系统与现代化的传统通道，可凭借买方早已熟悉的客情关系、风控机制及资产负债表结构展开竞争。因此，由此构建的护城河体现在渠道分销叠加监管执行力，而非排他性的技术实力；鉴于现有资料未证实存在排他性合同条款或过高的对接成本，客户采用多家方案（multi-homing）依然普遍可行。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP010
