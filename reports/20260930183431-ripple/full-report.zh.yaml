      - number: '1.4'
        title: 发展里程碑与监管处境
        blocks:
          - type: paragraph
            body: >-
              Ripple 的发展历程交织着企业创立、风险融资、产品上线、国际扩张以及美国监管机构的关键执法行动。SEC 于 2020 年 12 月起诉 Ripple 及两名高管，指控其未经注册要约并发售 XRP。2024
              年终审判决处以 $125,035,150 民事罚款并下达禁令；SEC 于 2025 年 5 月发布的新闻稿中，仅提出了拟修改上述条款的拟议和解框架，并非已经落地的罚额减免。此外，Ripple 2026 年 9
              月的合规页面列出了在英国、迪拜、卢森堡和新加坡的受监管实体。这些牌照印证了其跨多个司法管辖区的展业布局，但不能证明其合并财务表现、产品采用情况，也无法排除其他地区存在监管限制的可能。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
