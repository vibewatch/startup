chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 机构定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Ripple 成立于 2012
              年，总部位于旧金山，是一家非上市私营企业。官方资料将其定位为贯通传统资产与数字资产的机构级金融基础设施，当前核心业务为跨境支付与数字资产托管。这一业务定位远超单一代币逻辑：公司说明其主要服务银行与金融科技公司，官方主页则将使命定位于价值的存储、流转与兑换。现有公开证据未披露其现行定价模式或收入结构，因此软件、交易服务、托管、资金管理产品与数字资产储备各自的贡献占比，仍是有待尽调核实的问题，而非经过验证的商业模式拆分。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 业务规模与资本结构
        blocks:
          - type: paragraph
            body: >-
              Ripple 官方披露员工逾 1,000 人、办事处超 15 处，而 FundedIQ 将其员工规模划在 501–1,000
              人区间。两类统计口径不一，均非经审计的时点员工数，只能说明公司具备一定体量，无法作为精确的分母。融资维度的证据同样口径割裂：FundedIQ 记录其近期两轮融资合计 $700 million，而
              Wikipedia 历史表格除 2025 年 11 月的战略投资外，还列出了早期的天使轮、种子轮、Series A、Series B 及 Series C 融资。因此，$700 million
              仅是特定数据库记录的合计数，并非站得住脚的历史累计融资额，两处来源均无法证实其当前可用现金。在给定证据池中，营业收入、ARR、估值、客户数及盈利能力均缺乏数据支持。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
