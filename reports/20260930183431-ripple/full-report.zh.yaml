  - id: FP001
    title: 序数定位：机构分销渠道 vs 外部桥接资产依赖度
    type: quadrant
    summary: 分析师评分对比了相对机构分销能力（x 轴）与对外部高波动桥接资产的依赖度（y 轴），二者均按 1（低）至 5（高）的序数刻度划分。
    data:
      points:
        - label: Ripple / XRP 核心走廊
          x: 4
          'y': 5
          detail: 公司自述具备极强的企业触达能力主张；在必须使用 XRP 时对桥接资产依赖最高。
        - label: Ripple / 稳定币或法币走廊
          x: 4
          'y': 2
          detail: 共用相同企业渠道但对 XRP 依赖较低，具体取决于产品与走廊条款约定。
        - label: SWIFT 现代化改造
          x: 5
          'y': 1
          detail: 据报道拥有最广泛的机构连接网络，且无原生高波动桥接代币要求。
        - label: Stellar / 发行资产通道
          x: 3
          'y': 2
          detail: 具备重叠的支付功能，侧重稳定币结算，但银行端触达能力缺乏充分证据支持。
        - label: 独立稳定币通道
          x: 3
          'y': 1
          detail: 稳定价值结算降低了桥接代币敞口；分销能力因发行方与公链而异。
        - label: 银行主导的代币化存款
          x: 4
          'y': 1
          detail: 机构自主掌控分销网络，以存款或指定机构资产进行结算。
    approximationNotes: 此为分析师序数评分，并非实测市场份额或性能基准。评分综合了指定证据源对分销与结算资产的描述；1 分的分差仅代表方向倾向，不应理解为量化差距。
