    sections:
      - number: '6.1'
        title: 客群细分、买方画像与收入架构
        blocks:
          - type: paragraph
            body: >-
              Ripple 的商业化变现覆盖四类互不相同的客群：全球性银行机构与区域商业银行、支付服务商与汇款公司、数字资产交易所与场外交易（OTC）经纪商，以及企业司库部门。各类客群分别使用 Ripple
              机构产品套件的不同模块，所面临的监管环境与采购约束也各不相同。Jeonbuk Bank、Santander 和 SBI Remit 等商业银行及支付服务商利用 Ripple Payments
              基础设施加快跨境信息交互与结算。区域银行机构在外币走廊中承受着双边往来账户预存资金的高昂资本成本，因而更有动力采用分布式结算。相比之下，企业司库部门则使用企业级 SaaS 解决方案 Ripple
              Treasury，为首席财务官办公室提供全天候的资金流动性触达、现金透视及收益管理。由于买方决策人既有一流银行的全球交易银行部主管和首席信息官，也有考量多通道支付方案的企业司库主管与财务总监，公司必须采用深度介入的大客户管理服务模式。
