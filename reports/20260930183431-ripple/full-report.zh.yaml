            body: >-
              2026 年机构客户对 Ripple 基础设施的采用表明，其在软件授权、合规托管及 RLUSD 等法币稳定币上势头明显，但这一增长并不强制要求在交易中使用 XRP。早期网络叙事设想跨国银行将持有并结算
              XRP，而当前的机构采用现状显示，商业贷款机构更倾向于使用 Ripple Custody 和 RLUSD，以避免加密货币带来的资产负债表波动。
            calloutType: insight
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
          - type: callout
            title: 留存率与群组指标未予披露
            body: >-
              尽管 Ripple Treasury 在 CFO 软件领域报告了 $100M ARR，但 Ripple
              并未公布其支付网络的总留存率、净留存率、群组流失率或客户集中度占比。由于缺乏公开的合同续约率数据，投资者无法核实签约客户名单能否转化为持续增长的实际交易现金流。
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律执法风险敞口
        blocks:
          - type: paragraph
            body: >-
              Ripple Labs 面临的监管与法律环境，深受美国证券交易委员会（SEC）于 2020 年 12 月发起的民事执法行动遗留影响及持续合规后果制约。2023 年 7 月 13
              日，美国纽约南区联邦地区法院作出具有里程碑意义的简易判决，根据发售渠道对 XRP 代币交易进行了定性区分：尽管法院裁定在数字资产交易所通过算法撮合的程序化销售不构成证券交易，但认定 Ripple
              依据书面合同进行的 $728.9 million 机构直接销售违反了《1933 年证券法》第 5 条。随后，Analisa Torres 法官于 2024 年 8 月 7 日作出终审判决，判处
              $125,035,150 民事罚款，并下达禁止未来违反注册规定的永久禁令。尽管 SEC 与 Ripple 于 2025 年 5 月达成和解意向，拟解除禁令并将罚款降至 $50 million，但 Torres
              法官以缺乏特殊情况为由驳回了撤销判决的动议。2025 年 8 月 7 日，双方撤回了向第二巡回上诉法院提起的未决上诉，判决正式确立生效。因此，Ripple
              在机构直签合同与流动性分发模式上处于永久性的司法监管之下，要求其对所有机构加密业务展开严格的事前法律筛查。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
      - number: '7.2'
        title: 运营、托管与结算失效模式
        blocks:
          - type: paragraph
            body: >-
              除美国联邦诉讼之外，Ripple 的国际业务还在多个金融司法管辖区面临严苛的运营、合规与牌照监管要求。Ripple Markets UK Ltd
              在英国金融行为监管局（FCA）授权下作为电子货币机构（EMI）及注册加密资产企业运营，但其业务牌照严格限定于投资专业人士及高净值企业实体。在欧盟，Ripple Payments Europe S.A.
              获得了卢森堡 CSSF 颁发的 EMI 许可，并在《加密资产市场监管法案》（MiCAR）下注册为加密资产服务商（CASP），获准在欧洲经济区 30
              个国家开展受监管的兑换与转账通行服务。然而合规披露明确指出，Ripple
              并非银行或信贷机构。因此，其在支付或电子货币交易中收取的客户资金仅存管于商业合作银行的指定保障账户中，并未享受英国金融服务补偿计划（FSCS）或卢森堡存款保障基金（FGDL）等法定存款保险计划的保护。此外，在
              MiCAR 的利益冲突防范要求下，Ripple 在代币兑换业务中以自营主体（principal）身份交易，在内部定价机制、自营订单撮合及路由客观性上带来结构性风险，需要建立严格的信息隔离墙与独立合规监督。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: 银行对手方、托管机构与企业级工具依赖
        blocks:
          - type: paragraph
            body: >-
              作为一家企业级金融科技服务商，Ripple 的商业模式在银行、数字资产托管及云基础设施领域产生了显著的第三方对手方依赖。在法币清算、按需流动性结算及客户资金保护上，Ripple
              依赖英国、欧盟及阿拉伯联合酋长国持牌信贷机构的合作关系。一旦存管信贷机构发生破产，客户资金虽与 Ripple
              的债权人相隔离，但仍可能因超出存款补偿上限而遭受损失，进而可能引发客户纠纷与业务停滞。在运维层，Ripple 的 Financial Core 工程层依靠 Java、Spring Boot、PostgreSQL
              和 Kubernetes 在该托管网络中编排资金流与自动化结算工作流。在企业工具层，商业报告、客户管理与财务运营依托于 SAP、Tableau 和 Salesforce
              等外部软件供应商。上述任何银行交易对手或云平台出现服务中断或访问终止，均构成重大运营风险，可能阻碍交易吞吐并需要人工介入处理。
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR014
      - number: '7.4'
        title: 代币效用解耦、财务敞口与风险热力图
        blocks:
          - type: paragraph
            body: >-
              机构市场参与者面临的核心战略风险，是 Ripple 企业级业务扩张与 XRP 代币直接商业需求之间的结构性解耦。尽管 Ripple 已筹集资金并在 Web3 和生态投资中布局了超过 $600
              million，但市场分析人士指出，Ripple 支付与资金管理软件基础设施的大部分核心组件均可完全独立于 XRP 运行。法币抵押稳定币 RLUSD
              的推出，为机构提供了币值稳定的结算选择，在无法承受价格波动的走廊中，可能会分流原属于 XRP 桥梁流动性的交易频次。尽管在监管明确后，机构通过芝商所（CME）期货交易及交易所交易产品（ETP）拓宽了获取 XRP
              的渠道，但二级市场价格天然具有高波动性，且对加密资产宏观周期高度敏感。投资者必须将受主经纪商及资金管理软件收购强化的 Ripple Labs
              企业股权价值，与底层代币的投机性流动性特征严格区分开来；后者依然极易受到全市场避险情绪及全球监管政策转向的冲击。
            claimRefs:
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 判决禁令后的合规成本与 ODL 业务限制
            body: >-
              尽管 SEC 诉 Ripple 案撤回上诉为二级市场带来了明朗预期，但地方法院的终审判决以及针对未来违反第 5 条行为的永久禁令，对 Ripple 的机构直接销售构成了制约，并要求其对书面跨境 ODL
              合同保持持续监控。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: 资金保障机制与存款保险限额的差异
            body: Ripple 在英国及欧洲的合规披露强调，客户资金存管于第三方信贷机构，并未纳入银行存款保险计划的覆盖范围，这实际上将对手方信用风险直接转嫁给了机构客户。
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              Ripple 当前的公司估值基于 2026 年 3 月针对员工和早期投资者的股票要约收购中所确立的 $50 billion 私募估值。该流动性事件为老股交易定价，相比 2025 年 11 月完成的 $40
              billion 轮次（投资方包括 Fortress Investment Group 和 Citadel Securities）溢价 25%。然而，该交易完全构建为老股回购，并无增量新股资金注入 Ripple
              资产负债表，亦未稀释股权结构表。虽然记录显示 Ripple 截至 2025 年底预估年化收入为 $1.2 billion，但这对应 $40 billion 估值时高达 33.3 倍的市销率倍数，在 $50
              billion 估值下更是高达 41.7 倍。潜在投资者必须审慎评估：这一溢价究竟是否有底层软件现金流作为支撑，抑或是私募二级市场交易脱离了可验证的业务扩张节奏。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV011
              - CV015
      - number: '8.2'
        title: 投资评级与决策框架
        blocks:
          - type: paragraph
            body: >-
              我们给予 Ripple「继续研究」（research-more）的投资建议，置信度为中，风险评级为高，估值立场偏高。2025 年 8 月 SEC 民事执法行动的落幕，以 Ripple 缴纳 $125
              million 罚款并接受关于未经注册的机构 XRP 发售的永久禁令告终，消除了长达五年的不确定性阴霾。然而，Ripple 仍是一家非上市企业，并未公开披露经审计的 GAAP
              收益表、现金消耗率或分业务分部的毛利率。在 $50 billion 估值水平下，Ripple 的估值高于 Coinbase 等上市同行，但财务透明度却大幅落后，且仍受制于法院判决对机构销售的限制。在 Ripple
              能够提供经审计的财务数据、证明其摆脱加密市场周期具有独立的软件盈利能力之前，以当前价格进行直接的新股或老股投资均缺乏吸引力。
            claimRefs:
              - CV004
              - CV006
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV015
      - number: '8.3'
        title: 估值倍数与情景分析
        blocks:
          - type: paragraph
            body: >-
              情景分析显示，收益回报路径存在显著分化，主要取决于 Ripple Prime 的商业化速度以及 RLUSD 稳定币的企业级采用情况。在乐观情景中，依托对 Hidden Road 的 $1.25 billion
              收购及近期发行的 $275 million BBB 级优先债券，Ripple Prime 实现快速放量，同时 RLUSD 流通规模突破 $10 billion，推动公司估值升至 $60 billion 至 $75
              billion。在基准情景中，支付网络规模在 70 个走廊内保持平稳增长，主经纪商收入回归常态，公允价值区间维持在 $35 billion 至 $45
              billion。相反，在悲观情景中，受二级市场估值倍数承压、传统主经纪商及稳定币发行方竞争加剧，以及永久禁令下潜在监管审查的影响，公司私募企业价值可能被压缩至 $15 billion 至 $20 billion。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: 可比公司对标与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              一项至关重要的尽调结论是：Ripple Labs 的股权与公开市场 XRP 代币生态系统之间存在结构性解耦。尽管 XRP 市值超过 $90 billion，但企业股东对 Ripple 储备的数十亿枚 XRP
              数字资产并无法定主张或求偿权，股权持有者因而无法将资产负债表上的代币资产作为清算下行保护抵押物。此外，早年融资记录（如 Tracxn 记录的估值 $11 billion 的 Series C
              轮）表明，在缺乏相应信息披露的情况下，二级市场交易价格经历了多么急剧的抬升。在参与任何 Pre-IPO 老股大宗交易之前，机构尽调团队必须索取 FY2024 至 FY2025 的经审计财务报表、Ripple
              Prime 债务票据的到期日与契约条款清单，以及证实公司现金流与代币分发之间法律界限的文件凭证。
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 老股要约收购与新股估值信号的差异
            body: >-
              Ripple 的 $50 billion 账面估值来自 2026 年 3 月一笔 $750 million
              的老股回购，并非计入资产负债表的新增资本。投资者应当明确区分两类性质：一类是老股流动性事件，体现的是非公开股东意向与股权结构表流动性；另一类则是新股融资，附带协商确定的投资人保护条款、董事席位及标准清算优先权。
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: 企业股权与 XRP 代币金库结构性脱钩
            body: >-
              尽管 Ripple 的企业股权估值达 $50 billion，且 XRP 在 2026 年 8 月的市值约为 $90.5
              billion，但股权持有人对这笔数字代币金库并无直接法定主张或求偿权。若直接按市价将金库中 38-40 billion 枚 XRP 算作 Ripple
              的价值，一旦代币价格脱钩或二级市场大幅折算代币流动性，就会引发显著的下行风险。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
