              - CO014
              - CO015
      - number: '1.3'
        title: 领导层与公司治理
        blocks:
          - type: paragraph
            body: >-
              公开证据显示 Brad Garlinghouse 担任首席执行官，Monica Long 担任总裁，Chris Larsen 与 Jed McCaleb
              为联合创始人。但证据未提供可靠、完整的现任董事会名册、委员会架构、表决权或股权比例。XRP Academy
              虽提出涵盖创始人、战略投资者及独立董事的董事会名单，但该页面明确指出具体构成尚未完全披露，且将多个席位标为可能或预估。因此，该内容仅能作为尽调疑问清单，不能作为董事确认依据。治理尽调应聚焦于当前股权结构表、董事任命权、专业委员会、关联方控制，以及经营实体决策与
              XRP 经济风险敞口之间的隔离。
            claimRefs:
