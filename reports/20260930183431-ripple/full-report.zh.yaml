              - CP004
              - CP005
              - CP008
      - number: '3.4'
        title: 护城河逻辑可信，但持续性尚待检验
        blocks:
          - type: paragraph
            body: >-
              支撑其护城河持续性的最有力论据，在于 Ripple 兼具企业级定位、全球触达、受监管运营实体，以及能同时支持加密资产、法币与稳定币的产品矩阵。反向逻辑则源于结构性矛盾：稳定币在强化 Ripple
              企业级产品力的同时可能减少对 XRP 的需求，而 SWIFT
              亦可将分布式账本互操作性整合至机构熟悉的现有网络中。此外，过往评论指出了节点集中度与默认验证人列表问题；用户讨论也表明，公司宣称的去中心化程度、交易优势及实际落地使用情况仍存争议，并未经过独立基准测试。因此，现有证据支持其作为具备差异化优势的挑战者，但不能断言其为必然的胜出者。投资尽调应测试客户留存率、多通路使用情况、走廊层面的经济模型，以及确需
              XRP 的支付量占比。
            claimRefs:
              - CP002
              - CP008
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 图表
        blocks:
