    title: 投资建议逻辑
    type: flow
    summary: 决策推演流程：串联机构业务规模、监管和解、二级市场定价摩擦与估值不确定性，共同支撑“继续研究”的投资建议。
    data:
      nodes:
        - id: n1
          label: 企业级规模
          description: Ripple 全球支付业务覆盖 90+ 个国家，累计结算交易量达 $95B
        - id: n2
          label: 产品版图扩张
          description: 收购 Hidden Road 与 GTreasury，将版图延伸至机构主经纪商业务与财资管理软件
        - id: n3
          label: 监管和解落地
          description: SEC 交叉上诉于 2025 年 8 月结案驳回，附带 $125M 民事罚款，并对面向机构的 XRP 销售施加永久禁令
        - id: n4
          label: 二级市场估值泡沫
          description: 2026 年 3 月要约收购将股权估值锚定在 $50B，但并无新股现金注资，隐含倍数高达 ~33.3x-41.7x
        - id: n5
          label: 财务披露缺口
          description: 未披露公开经审计的损益表，单客毛利率、净烧钱速度以及对代币金库的依赖均不透明
        - id: n6
          label: 继续研究立场
          description: 暂缓直接配置资金，直至公司提供经审计的财务报表并清晰划定股权与代币的权责边界
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 推演流程图基于已验证的公司公告、法律诉讼与二级市场里程碑，定性综合出尽调决策关卡。
