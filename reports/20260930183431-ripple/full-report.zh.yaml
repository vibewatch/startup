      - number: '2.3'
        title: 买方画像、采用路径与预算归属
        blocks:
          - type: paragraph
            body: >-
              有公开材料背书的买方群体包括金融机构、企业、政府、开发者以及合规机构类加密客户。服务准入因司法管辖区及主体资质而异，并非普遍开放。Ripple
              的欧洲披露文件说明，其兑换与转账服务仅向机构客户提供，不对零售客户开放；其英国披露文件将定向服务限定为特定的合规关联人士，包括投资专业人士及符合条件的高净值企业或团体。一线业务用户很可能是支付、资金及合规团队，但给定材料并未按客群细分披露具体的预算负责人、采购周期、合同金额或实施壁垒。因此，评估其采用情况时，应将其视作受监管的企业级销售：可触达客户群完全取决于牌照许可权限、客户资质以及所选用的结算资产。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
      - number: '2.4'
        title: 驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              免去目标地预设账户资金占用（pre-funding），是给定证据中最明确的经济驱动力，但在审阅过的各项 Ripple 产品中，XRP 并非必需品。稳定币能降低对高波动桥梁资产的风险敞口，即使 Ripple
              提供周边基础设施，支付场景也可能被稳定币抢占。一份聚焦 XRP 的独立行业通讯直陈痛点：Ripple 公司的商业扩张，并不自动等于 XRP 实现了价值捕获。监管依然是制约落地应用的另一瓶颈。SEC 2025 年
              5 月的新闻稿阐述了与既有 $125,035,150 民事罚款挂钩的和解框架，同时明确声明寻求和解并不代表对指控实质理由做出裁定，亦非对其他案件表明立场。Ripple 在 2023 年也报告了大量的 XRP
              持仓与托管锁定余额；这些均属供给层面的事实，并非当前市场需求或可用现金的证据。
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 公司业务落地并不等于 XRP 需求增长
            body: 证据印证了 Ripple 机构基础设施的市场需求，但由于存在不依赖 XRP 的产品通路，且部分支付场景使用稳定币效果更好，客户增长与代币需求之间并不存在一一对应的绑定关系。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范畴远超加密支付代币
        blocks:
          - type: paragraph
            body: >-
              买方的真实决策绝非仅在 Ripple 与 Stellar 之间二选一。金融机构既可保留代理行业务并接入现代化 SWIFT
              流程，亦可在公链上使用稳定币、加入银行主导的代币化存款网络、通过卡组织网络连接，或基于央行系统及行内专线搭建。当下的第三方分析将
              SWIFT、稳定币、Stellar、智能合约平台及银行系网络列为不同替代路径，早期的评测报告也将央行数字货币（CBDC）与 SWIFT
              视为替代选项。这种宽泛性十分关键，因为其中数种方案能够沿用机构既有的合规、资金或渠道合作关系，而无需迫使其采用 XRP
              作为桥梁流动性。公开材料能够佐证这些类别，但尚未能支持完整的市场份额排名或各家方案之间可比的融资数据。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
