      - number: '3.3'
        title: 公开定价不足以支持综合成本对比
        blocks:
          - type: paragraph
            body: >-
              Ripple 欧洲披露文件提供了最清晰的产品打包证据：所涉兑换与转账服务仅面向机构客户，交易条款实行一客一议，定价参考合规获批交易场所的价格基准，外加点差及/或交易手续费。Ripple
              还明确表示不公布上述服务的汇总交易数据。这导致外界无法就实际落地价格、实施成本、流动性成本及服务水平，与 SWIFT、基于 Stellar
              的服务商、稳定币网络或自建方案进行站得住脚的横向对比。监管许可及客户资金保护机制固然能降低采用风险预期，但 2023 年法院命令以及 2025 年 SEC
              和解公告表明，过往法律纠纷依然是信任度尽调的一部分。买方应要求提供特定走廊层面的报价与实施证据，而非单纯根据网络层面的费率主张推算经济效益。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP003
            claimRefs:
