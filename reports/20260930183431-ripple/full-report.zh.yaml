  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              合理的市场边界应限定为机构跨境价值流转，而非全球支付的全部体量，更非零售端 XRP 投机。Ripple 官方将金融机构、企业、政府和开发者列为用户；第三方产品评测则将支持法币的信息交互产品，与使用 XRP
              作为桥梁资产的 On-Demand
              Liquidity（ODL）区分开来。因此，纳入口径的工作流包括跨境支付编排、流动性转换以及受监管的机构级兑换或转账服务。测算软件市场规模时，须剔除支付本金总额、零售代币交易，以及任何每款 Ripple
              产品都会带动 XRP 需求的假设。稳定币是直接的内部替代品：Ripple 首席执行官曾表示，稳定币在解决某些支付痛点上可能优于 XRP，这使得产品落地与代币价值捕获成为两个相互独立的问题。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM014
      - number: '2.2'
        title: 市场测算依据及其局限
        blocks:
          - type: paragraph
            body: >-
              给定证据中金额最大的数字均为资金流转规模，而非软件厂商的收入池。Rainmaker Securities 援引的数据显示，2022 年全球 B2B 跨境支付规模达 $156 trillion，2020
              年汇款规模约 $702 billion。两项数据均未给出软件抽成率（take rate）、可触达客户数、当前增速或 Ripple 的具体份额。分销指标在统计口径上也存在矛盾：简介显示其拥有超 300
              家客户且解决方案覆盖 40 个国家，而 Ripple 现有官网则宣称在超 90
              个国家提供服务。统计年份或定义差异或许能解释这一出入，但现有材料未予以弥合。上述数据仅能支撑宏观层面的机遇逻辑，绝不能直接相乘或当作层层递进的 TAM 至 SOM 测算。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
