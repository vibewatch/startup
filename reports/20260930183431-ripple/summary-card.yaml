  topStrengths:
    - Large institutional distribution and multi-jurisdiction regulatory footprint.
    - Multiple monetization lines beyond XRP, including payments, custody, treasury, and prime brokerage.
    - Material private-market valuation and apparent access to capital.
  topRisks:
    - Audited financials, cash generation, and segment economics remain opaque.
    - XRP demand is not required across all products, so token upside may not track operating growth.
    - Regulatory history and compliance complexity could constrain adoption and valuation.
