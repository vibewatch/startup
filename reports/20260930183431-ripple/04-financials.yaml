callouts:
  - calloutType: "insight"
    title: "Dichotomy Between Operating Topline and Token Asset Exposure"
    body: "Institutional investors evaluate Ripple along two divergent axes: an expanding commercial fintech business targeting a $1 billion operating revenue run rate by end-2026 via payments, custody, RLUSD, and prime brokerage, contrasted with a balance sheet holding 34 to 38 billion escrowed XRP. Because secondary equity prices track XRP market volatility rather than operating multiples, financial underwriting requires separating operational earnings quality from token treasury swings."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI009"
      - "CI014"
  - calloutType: "risk"
    title: "Financial Information Opacity in Private Pre-IPO Markets"
    body: "Despite private marks reaching $40 billion in November 2025 and $50 billion during the March 2026 share buyback, Ripple does not publish audited GAAP financial statements, operating margins, or customer unit economics. The severe supply overhang in secondary share listings and lack of routine reporting create acute information asymmetry for late-stage investors."
    claimRefs:
      - "CI007"
      - "CI009"
      - "CI012"
