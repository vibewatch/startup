- id: TI005
  title: Public financial gaps that still block underwriting
  columns:
  - Missing metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Cash, burn, and runway
    - Blocking
    - The 2025 raise cannot be translated into solvency or next-round timing without these numbers
    - Request latest monthly cash waterfall, operating budget, and board reporting pack
  - - Store-level P&L line split
    - Material
    - 22% store margin is not enough without food, labor, occupancy, packaging, and delivery costs
    - Request mature-store and new-store contribution statements
  - - Channel mix and marketplace economics
    - Material
    - Exact digital and delivery share determines whether peer digital-mix proxies are relevant and whether
      commissions are dilutive
    - Request sales by in-store, first-party pickup, first-party delivery, marketplace delivery, and catering
      plus commission schedules
  - - Cohorted same-store sales bridge
    - Material
    - Positive comps can come from traffic, mix, or price; each has different durability
    - Request monthly traffic, ticket, promo, and mix bridge by cohort and market
  - - Drive-thru capex and payback detail
    - Material
    - New formats can either improve throughput or absorb incremental capital with weak returns
    - Request Livingston scorecard and approved economics for the next two drive-thru stores
  - - Debt, lease, and covenant package
    - Material
    - Lease obligations or hidden debt could materially change effective leverage despite the equity raise
    - Request debt schedule, lease commitments, and covenant summary
  notes: These are not cosmetic disclosure asks; each item would change a valuation, downside case, or
    willingness to underwrite store growth.
