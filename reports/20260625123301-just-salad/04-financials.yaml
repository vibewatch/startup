  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, runway, and any debt or lease covenant schedule.
    whyItMatters: Without these figures the latest $200 million raise cannot be converted into a runway
      or solvency view.
    diligencePath: Request the latest board deck, monthly cash waterfall, debt schedule, and 12-month
      operating plan from finance.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: store-p-and-l
    missingEvidence: Wall-by-wall P&Ls with food, labor, occupancy, packaging, delivery-fee, and marketing
      lines.
    whyItMatters: Management-cited 22% store margin cannot be stress-tested without the cost-line split
      that determines durability.
    diligencePath: Request twelve-month trailing store contribution statements for a mature urban store,
      a suburban store, and the drive-thru format.
    relatedQuestionRefs:
    - QI008
    - QI019
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: digital-mix
    missingEvidence: Channel mix by first-party app, pickup, in-store, catering, and third-party delivery
      plus realized marketplace fee rates.
    whyItMatters: Delivery and digital ordering affect realized margin, loyalty ROI, packaging usage,
      and whether comp proxies from CAVA and Sweetgreen are relevant.
    diligencePath: Pull a last-twelve-month sales bridge by channel, attach marketplace contracts, and
      show net revenue after commissions and promos.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: material
    topic: same-store-sales
    missingEvidence: Cohorted same-store sales, traffic, mix, and pricing bridge for 2024-2026 by market
      and format.
    whyItMatters: Public claims of positive comps and traffic-led growth are not enough to underwrite
      price elasticity or maturity curves.
    diligencePath: Request monthly same-store sales dashboards with traffic, average check, promo penetration,
      and delivery mix by cohort.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: drive-thru-capex
    missingEvidence: Per-unit capex, lease terms, payback period, and labor model for drive-thru stores
      versus legacy inline stores.
    whyItMatters: New-format expansion can improve traffic but also increase capex intensity and execution
      risk if throughput gains are overestimated.
    diligencePath: Request the Livingston post-open scorecard and the investment committee memo for the
      next two drive-thru openings.
    relatedQuestionRefs:
    - QI016
    - QI024
    relatedTableRefs:
    - TI004
