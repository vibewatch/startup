- id: TI004
  title: Capital adequacy and financing dependency
  columns:
  - Item
  - Value / status
  - Public signal
  - Confidence
  - Notes
  rows:
  - - Latest equity raise
    - $200M in February 2025
    - Confirmed by company press release and Restaurant Business
    - high
    - Largest hard funding datapoint in the public record
  - - Implied valuation
    - ~$1B post-money
    - Confirmed by company press release, Restaurant Business, and CFO.com reporting
    - high
    - Valuation is known; cash balance is not
  - - Use of funds
    - New unit growth, menu innovation, technology, customer experience
    - Management statement in fundraising release
    - high
    - Suggests growth capex plus software/experience spend
  - - Cash on hand
    - Undisclosed
    - No public Just Salad source reviewed provides cash or cash-equivalent balance
    - low
    - Prevents runway analysis
  - - Monthly burn / runway
    - Undisclosed
    - No public burn bridge or budget disclosed
    - low
    - Cannot infer from raise size alone
  - - Debt / project-finance obligations
    - Undisclosed
    - No reviewed public source disclosed debt, revolver, or covenant package
    - low
    - Lease-adjusted fixed-charge burden remains unknown
  - - Format expansion dependency
    - Drive-thru and store growth continue after the 2025 raise
    - First drive-thru opened in 2025; 4-6 more slated for 2026 per QSR
    - medium
    - Expansion speed increases the need for capex discipline
  - - Financing-process friction
    - Former CFO sued over an alleged $1.2M payout tied to the successful raise
    - CFO.com lawsuit coverage
    - medium
