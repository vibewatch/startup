tables:
- id: TI001
  title: Revenue streams
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Signature salads, wraps, warm bowls, market plates
    - Direct in-store / pickup entrée sales across multiple categories
    - Orders × average check
    - Live menu active; QSR says 50% of sales now come from non-salad items
    - Medium-high — diversified menu reduces single-SKU dependence, but no audited revenue by category
    - Provide category-mix revenue by month and market
  - - Build-your-own and add-ons
    - Base entrée plus paid proteins, cheeses, dressings, and toppings
    - Incremental dollars per attachment
    - BYO base starts at $9.99; premium add-ons priced separately in the live menu data
    - High as a margin lever if attachment rates are stable
    - Share attachment rates and gross margin by add-on class
  - - Smoothies, soups, snacks, and drinks
    - Cross-sell and daypart-expansion items
    - Units × add-on price
    - Smoothies list at $6.99–$8.99; drinks and snacks create lower-ticket basket lifts
    - Medium — useful check builders, but mix not disclosed
    - Show beverage/snack mix and margin contribution
  - - Catering and office orders
    - Group ordering for employers and events
    - Trays / platters / bundled meals
    - Official catering page is active and structured for office use; no public revenue disclosed
    - Medium — likely more recurring and larger-ticket than individual orders
    - Disclose catering share of sales, margins, and cancellation rates
  - - Third-party delivery
    - Same menu sold via marketplace delivery with platform intermediation
    - Delivered orders × realized net check
    - Operationally active; exact mix and commission burden undisclosed
    - Medium-low — convenient channel but likely lower margin after fees/promos
    - Provide channel mix, commission rates, and promo spend
  - - Drive-thru format
    - Incremental access channel for suburban traffic using the same menu
    - Drive-thru orders per unit
    - First unit opened in Livingston in 2025; 4-6 more expected in 2026 per QSR
    - Unproven at scale — promising throughput upside but capex and labor assumptions need proof
    - Share drive-thru sales mix, capex, and payback versus inline stores
  notes: Rows mix product and channel streams because public disclosure is channel-light; all category
    economics remain management-level until supported by wall-by-wall P&Ls.
  claimRefs:
