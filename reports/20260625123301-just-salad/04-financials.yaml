- id: capital-adequacy
  title: Capital Adequacy and Expansion Dependency
  body: 'The clearest hard financial fact in public is the February 2025 raise: $200 million at roughly
    a $1 billion valuation. Management said the money will fund new units, menu innovation, technology,
    and customer experience. That is a sensible use-of-funds profile for a chain pushing suburban expansion
    and drive-thru format development, but it still leaves the most important underwriting questions unanswered.
    The company does not disclose current cash, burn, debt, or lease obligations, so investors cannot
    translate the raise into runway. The picture is further complicated by execution ambition: PR Newswire
    and Restaurant Dive both described 2025 as a drive-thru launch year, and QSR said four to six more
    drive-thrus were slated for 2026. New formats can broaden access and improve throughput, but they
    also tend to increase buildout complexity and fixed-cost exposure. The former CFO lawsuit is not an
    existential issue by itself, yet it is a reminder that the 2024-25 financing cycle involved enough
    complexity to create compensation disputes around what qualified as a successful liquidity-like event.'
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI033
  - CI034
  - CI037
  - CI038
  - CI048
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: financial-verdict
  title: Financial Verdict and Diligence Blockers
  body: 'Just Salad looks financially more credible than the average private growth restaurant concept
    because public reporting now points to real scale: roughly 110 year-end locations, $195 million preliminary
    2025 revenue, ~22% store-level margins, and enough investor appetite to support a $200 million primary
    raise. Menu breadth and digital features support revenue quality, while reusable bowls and carbon
    labels probably strengthen brand affinity and help moderate packaging externalities. The problem is
    not absence of a story; it is absence of audited proof. There is still no public cash balance, burn
    figure, channel mix, gross margin, food-cost percentage, labor-cost percentage, or debt schedule.
    Delivery-channel risk is visible through litigation and customer complaints, but not quantified. In
    underwriting terms, Just Salad is a promising but still partially opaque restaurant growth asset:
    good enough to justify deeper diligence, not transparent enough to price capital without a data room.'
  claimRefs:
  - CI021
  - CI022
  - CI026
  - CI028
  - CI029
