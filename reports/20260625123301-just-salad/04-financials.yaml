schemaVersion: report-v2
artifact: financials
slug: just-salad
runDate: '2026-06-25'
company:
  name: Just Salad
chapter:
  number: 4
  title: Financials
  summary: Just Salad's public financial story is unusually rich for a private restaurant chain but still
    incomplete where underwriting matters most. Management and trade reporting point to a $200 million
    2025 raise at roughly a $1 billion valuation, preliminary 2025 revenue of about $195 million, roughly
    $2 million AUVs, and ~22% store-level margins. The catch is that these figures are largely management-cited
    rather than audited, while cash, burn, debt, and channel mix remain undisclosed. The result is a concept
    that appears to have attractive unit economics and strong menu breadth, but still requires data-room
    proof on margin durability, delivery economics, and runway.
sections:
- id: revenue-model
  title: Revenue Model and Pricing Architecture
  body: 'Just Salad monetizes a broader fast-casual meal occasion than its name suggests. Official materials
    and the live ordering stack show revenue coming from signature salads, warm bowls, market plates,
    wraps, smoothies, soups, snacks, drinks, catering, and digital ordering channels. QSR reported that
    fully half of sales now come from non-salad items, which matters because it reduces dependence on
    a single hero SKU and supports daypart expansion beyond office-lunch salads. On price, the current
    menu supports an entry point below Sweetgreen-like premium positioning: build-your-own salads and
    wraps list at $9.99, most signature salads sit in the low-to-mid teens, and the pick-two combo reaches
    $16.99. That is still premium fast casual, but it leaves room for add-ons, drinks, and smoothies to
    raise realized check without forcing list-price spikes. The rewards program also nudges customers
    toward a $12+ threshold, effectively setting a floor for orders that qualify for mystery-box incentives.'
  claimRefs:
  - CI002
  - CI005
  - CI006
  - CI007
  - CI009
  - CI032
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: digital-delivery
  title: Digital, Delivery, and Channel Mix Proxies
  body: 'Digital ordering is not peripheral to Just Salad''s model; it is embedded in the proposition.
    The app advertises nutrition and carbon-footprint information, one-tap reorder, pickup, delivery,
    and exclusive offers, while BringBack only works through the app for pickup orders. That suggests
    first-party digital is both a commerce and a sustainability surface. App ratings are directionally
    positive on iOS but notably weaker on Google Play, where users report glitches and, in one recent
    review, a roughly $7 higher price when redirected to DoorDash. Management also told QSR that it has
    learned which third-party delivery promotions and ad spend are effective versus wasteful, implying
    the delivery channel is important enough to optimize but not clean enough to treat as frictionless
    growth. Because Just Salad does not disclose exact digital or delivery mix, public comparables matter:
    Sweetgreen reported 61.8% digital revenue in 2025, while CAVA reported 37.9% digital mix. Those public
    peers set a plausible range for a digitally engaged salad concept, but Just Salad''s exact placement
    inside that band remains a diligence item.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI039
  - CI040
  - CI043
  - CI044
  - CI047
  figureRefs:
  - FI003
- id: unit-economics
  title: Unit Economics and Cost Structure Proxies
  body: 'Just Salad''s public unit-economics story is better than most private restaurants but still not
    audit-grade. QSR reported approximately $2 million AUVs, ~22% store-level margins for three straight
    years, and about $850,000 buildout cost with greater-than-50% cash-on-cash returns by year two. Those
    are strong claims if they hold across formats. They also fit the menu structure: a broad low-teens
    entrée ladder, beverages and smoothies that can lift check, and reusable-bowl incentives that may
    reduce packaging spend or at least strengthen retention. Labor remains a material cost driver, especially
    because the brand still preps vegetables, dressings, and proteins in-store and advertises benefits
    such as 401(k) matching, health plans, daily pay, and free meals. Waste and packaging programs help
    at the margin, but they do not replace the need to see food, labor, occupancy, and marketing lines.
    Public comps help frame the ceiling and floor: Sweetgreen''s 2025 restaurant-level economics were
    pressured by negative same-store sales and only 15.2% restaurant-level margin, while CAVA posted 24.4%
    restaurant-level margin and $2.9 million AUV. Just Salad''s management-cited numbers place it between
    those peers on volume and much closer to CAVA on margin, but the claim remains unaudited.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI026
  - CI028
  - CI029
  - CI030
  - CI031
