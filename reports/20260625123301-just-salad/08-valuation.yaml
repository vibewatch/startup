company:
  name: Just Salad
chapter:
  number: 8
  title: Valuation
  summary: Just Salad has enough public proof to justify staying engaged, but not enough disclosure to justify a price-insensitive buy at its roughly $1 billion 2025 round mark. Using QSR's preliminary $195 million 2025 revenue figure, the round implied about 5.1x sales—cheaper than CAVA's June 2026 public multiple, but far richer than Sweetgreen or Shake Shack while carrying more private-company opacity around preferences, debt, and audited earnings quality. The evidence supports a track recommendation with medium confidence, high risk, and a stretched valuation stance unless diligence confirms the claimed unit economics and clarifies the cap table.
sections:
- id: recommendation-price-discipline
  title: Recommendation and price discipline
  body: 'The core valuation question is not whether Just Salad is an attractive concept; it is whether the current entry price leaves enough room for execution, category, and structure risk. Public reporting now supports a real operating story: a Wellington-led $200 million round at about a $1 billion valuation, roughly 110 locations by the end of 2025, about $195 million of preliminary 2025 revenue, three years of roughly 22% store-level margins, and a drive-thru prototype that management says lifted sales by more than 30%. Those are strong signals for a private restaurant brand. They also help explain why the business can plausibly screen above slower or weaker public restaurant comps. But the evidence is still management-led rather than filing-grade. Investors still lack public visibility into audited financials, liquidation preferences, debt and lease burdens, and whether suburban/drive-thru economics will scale beyond a small sample. That means the right posture is disciplined interest,
    not unconditional enthusiasm: track the company, keep diligence active, and avoid treating the last round as obviously cheap.'
