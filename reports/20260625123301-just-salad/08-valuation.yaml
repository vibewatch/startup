- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - Public reporting now supports real scale and fast growth rather than a concept-stage story.
    - thesis
    - Audited 2025 financials that validate the reported revenue and unit-economics claims would strengthen conviction.
  - - Store-level margins, AUVs, and early drive-thru lift suggest the model could travel into suburban formats.
    - thesis
    - Evidence that new-format margins or paybacks are materially worse than the core estate would weaken the upside case.
  - - Just Salad is still cheaper than CAVA on sales, leaving some room if it compounds into a premium-health chain.
    - thesis
    - If growth slows and the company loses any claim to CAVA-like execution quality, the discount is not enough.
  - - The last round is materially richer than Sweetgreen or Shake Shack despite much weaker disclosure.
    - anti-thesis
    - Publishing audited statements and the preference stack would make the premium easier to defend.
  - - The category is facing consumer trade-down and value pressure, so a premium bowl concept can de-rate quickly.
    - anti-thesis
    - Sustained positive traffic, strong same-store sales, and proven value architecture through 2026 would soften this concern.
  notes: Arguments are written against the current $1 billion mark, not against a hypothetical lower entry price.
