tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - decision field
  - current view
  - decision implication
  rows:
  - - Recommendation
    - track
    - Stay engaged and diligence the company, but do not chase the last round as a price-insensitive buy.
  - - Confidence
    - medium
    - Public evidence is directionally strong on scale and weak on audited economics and capital structure.
  - - Risk rating
    - high
    - Execution, category softness, and undisclosed preference/debt terms can all compress realized returns.
  - - Valuation stance
    - stretched
    - At about 5.1x preliminary 2025 revenue, the round already assumes sustained premium execution.
  - - Entry discipline
    - Require better evidence or better terms
    - Either confirm audited margins and cap-table cleanliness, or demand a lower effective entry multiple.
  - - Hold / exit posture
    - Multi-year only
    - The current mark needs 2-3 more years of execution and disclosure improvement before it looks easy.
  notes: 'This table is explicitly price-sensitive: it translates the current round mark into an investment action rather than a generic view on company quality.'
