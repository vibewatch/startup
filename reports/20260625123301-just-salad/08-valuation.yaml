  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: preference stack
    missingEvidence: 2025 round term sheet, charter, and cap-table details showing liquidation preferences, participation, anti-dilution, and any investor control rights.
    whyItMatters: The headline $1 billion valuation may materially overstate common-equity value if the round structure is investor-favorable.
    diligencePath: Request the signed term sheet, amended charter, cap table, and board consents from company counsel.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: cash runway and fixed charges
    missingEvidence: Current cash balance, debt schedule, lease obligations, covenant package, and monthly burn or cash-generation bridge.
    whyItMatters: Expansion can look attractive on sales while still creating financing risk if the balance sheet is tighter than the headline round suggests.
    diligencePath: Request the latest balance sheet, debt agreements, lease maturity schedule, and monthly liquidity reporting package.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: format economics
    missingEvidence: Wall-by-wall economics for urban inline stores versus drive-thru and suburban units, including buildout, labor, delivery mix, and payback.
    whyItMatters: The bull case depends on new-format rollout, so one strong pilot is not enough to underwrite the national expansion story.
    diligencePath: Review unit-level P&Ls, buildout budgets, and post-opening cohorts for the pilot drive-thru and the next expansion wave.
    relatedQuestionRefs:
    - QV006
    - QV026
  - type: private-evidence-only
    severity: material
    topic: audited financial quality
    missingEvidence: Audited FY2025 revenue, same-store sales bridge, restaurant-level margin reconciliation, and corporate EBITDA or free cash flow.
    whyItMatters: The current round multiple is being assessed against management-cited economics, so even a small restatement could materially change the valuation view.
    diligencePath: Request audited FY2025 financial statements and YTD 2026 management accounts reconciled to board materials.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV029
