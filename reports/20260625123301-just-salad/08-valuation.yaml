- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue reaches roughly $300M, store margins stay at or above 20%, drive-thru and suburban expansion replicate early lift, and the market keeps granting premium-health growth multiples.
    - At 5.5x-6.5x sales, equity value reaches roughly $1.65B-$1.95B, or about 1.7x-2.0x the last round before dilution.
    - Requires the QSR-reported economics to prove durable and category demand to hold.
    - low-medium
  - - Base
    - Revenue climbs to roughly $240M, margins normalize to 18%-20%, and investors value the company at about 4.0x-4.5x sales because disclosure remains private-company quality.
    - Equity value clusters around roughly $960M-$1.08B, near flat to modest upside from the headline round value before dilution.
    - Even solid execution may not outrun multiple discipline and private-company discounts.
    - medium
  - - Bear
    - Revenue stalls near roughly $210M, value pressure worsens, and investors reset the company closer to slower public restaurant comps at 2.0x-2.5x sales.
    - Equity value falls to about $420M-$525M, implying severe down-round risk and potentially worse outcomes for common equity if preferences are heavy.
    - This can happen without a brand collapse if traffic, delivery mix, or expansion economics disappoint.
    - medium
  notes: Scenario values are simple revenue-multiple bridges in USD millions; they are discussion tools, not management guidance.
