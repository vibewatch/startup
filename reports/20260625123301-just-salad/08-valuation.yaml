- id: scenario-downside-transmission
  title: Scenario logic and downside transmission
  body: 'The bull case is straightforward: if Just Salad keeps compounding revenue toward $300 million, defends 20%+ store margins, proves drive-thru and suburban stores can replicate the early 30%+ sales-lift signal, and continues to look more like a smaller CAVA than a smaller Sweetgreen, then the company can plausibly grow into or above the last round. The base case is less exciting but still plausible: if revenue rises into the mid-$200 millions while public comparable multiples remain disciplined, investors may only earn a flat-to-modest outcome from the current mark. The bear case does not require a collapse in brand demand. It only requires some combination of category trade-down, margin normalization, weaker-than-advertised delivery economics, or expansion hiccups that move the company closer to Sweetgreen''s public-market penalty box than to CAVA''s premium bucket. The key lesson from public comps and failed category peers is that a restaurant concept can remain real, liked, and
    growing while still being overvalued if traffic, value perception, or format execution soften.'
