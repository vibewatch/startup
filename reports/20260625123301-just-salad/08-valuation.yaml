- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Preference stack
    - Liquidation preferences, participation rights, anti-dilution terms, and board controls from the 2025 round
    - Headline valuation can overstate common-equity value if the stack is investor-favorable.
    - Request the full cap table, term sheet, and charter documents from company counsel.
  - - Audited 2025 financials
    - Audited revenue, same-store sales bridge, restaurant-level margins, and corporate EBITDA / cash burn
    - The current $1B mark relies on management-cited economics that have not been publicly audited.
    - Request FY2025 audited financial statements and YTD 2026 management accounts.
  - - Balance-sheet burden
    - Cash balance, debt, lease obligations, and covenant package
    - Runway and fixed-charge intensity determine whether expansion creates value or forces a down-round.
    - Request debt schedules, lease maturity tables, and monthly cash bridge.
  - - Format economics
    - Wall-by-wall returns for urban inline stores versus drive-thru / suburban stores
    - The bull case depends on format expansion, not just core-city density.
    - Review unit-level P&Ls, buildout budgets, and post-opening performance cohorts.
  - - Channel mix
    - Owned digital, marketplace delivery, catering, and app-loyalty contribution to revenue and margin
    - Delivery or promo-heavy growth can look healthy in sales but weak in cash generation.
    - Request channel gross-margin bridge and promo/commission detail by market.
  notes: These asks are ordered by how directly they can change the recommendation or the effective entry multiple.
