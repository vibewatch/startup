- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Just Salad (last private round)
    - Approx. valuation / preliminary 2025 revenue
    - ~5.1x ($1.0B / $195M)
    - Closest anchor for the current entry price; ties directly to the underwriting question.
    - Revenue and margin figures are management-cited, not audited, and preference terms are undisclosed.
  - - CAVA
    - Market cap / TTM revenue
    - ~8.2x ($9.57B / $1.17B)
    - Best public premium-health fast-casual comp because growth, margins, and unit expansion remain strong.
    - Public-liquidity premium and audited disclosure justify some of the valuation gap.
  - - Sweetgreen
    - Market cap / TTM revenue
    - ~1.5x ($1.05B / $0.68B)
    - Closest direct public salad comp and the cleanest warning on what traffic softness can do to multiples.
    - Operational issues and turnaround status make it a downside anchor, not a target outcome.
  - - Shake Shack
    - Market cap / TTM revenue
    - ~1.6x ($2.34B / $1.49B)
    - Useful floor reference for a scaled, audited public restaurant brand with national liquidity.
    - Burger-led format and broader mass appeal make it only a valuation floor, not an operating twin.
  - - Tender Greens / One Table
    - Distressed outcome
    - Chapter 11; lender-led sale; 22 Tender Greens units remained post-process
    - Adverse precedent that healthy fast-casual concepts can still destroy equity when traffic, delivery, and debt dynamics break.
    - Not a going-concern multiple and not directly comparable on format or geography.
  notes: The set mixes direct, adjacent, and adverse references because no single public comp fully matches Just Salad on menu, scale, growth, and disclosure profile.
