  customerFocus: Urban and suburban health-conscious consumers, office lunch customers, digital-order pickup users, and workplace catering buyers.
  businessModel: Company-operated restaurant sales supplemented by digital ordering, third-party delivery, workplace catering, and loyalty-driven repeat purchase.
