  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance disclosure
    missingEvidence: Current board composition, committee structure, and a fuller executive bench beyond
      Nick Kenner and public sustainability spokespeople.
    whyItMatters: Leadership concentration is clear, but governance depth and succession risk cannot be
      properly underwritten from founder-centric public materials alone.
    diligencePath: Request a current org chart, board list, and bios for finance, operations, technology,
      and legal leaders.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Exact lifetime capital raised before the 2025 Series C, any debt or secondary proceeds,
      and the post-round cap table.
    whyItMatters: Investor influence, ownership concentration, and dilution cannot be modeled from the
      disclosed round headline alone.
    diligencePath: Ask management for a financing history schedule, cap table, and board-rights summary
      tied to the February 2025 transaction.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Public numeric disclosure for revenue, ARR, headcount, customer count, and quantified
      profitability.
    whyItMatters: The company and media discuss growth and profitability qualitatively, but valuation
      and operating leverage cannot be tested without hard numbers.
    diligencePath: Request management KPIs, cohort data, same-store sales history, and current headcount
      from the data room.
    relatedQuestionRefs:
    - QO015
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: current store count harmonization
    missingEvidence: A run-date-synchronized store list or official count that reconciles the over-100,
      more-than-100, and 110-location markers.
    whyItMatters: The strategic takeaway is clear, but exact footprint math affects unit growth modeling
      and market-saturation assumptions.
    diligencePath: Ask for the current location roster by state and opening year, including any Washington,
      D.C. classification convention.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
