- id: capital-and-stakeholders
  title: Funding, Valuation, and Stakeholders
  body: 'The clearest capital event in the public record is the February 2025 Series C. The official PR
    Newswire announcement and multiple independent outlets agree that Just Salad raised $200 million,
    that Wellington Management led the round, and that D1 Capital Partners, Neuberger Berman, and Stripes
    joined the syndicate. Those same sources anchor the headline valuation at approximately $1 billion
    and state that the proceeds were meant to support new unit growth, menu innovation, technology, and
    customer experience. Reuters adds the most useful ownership nuance by noting that Kenner still holds
    a large stake but is not a majority owner, implying meaningful founder influence even after the round.
    What is not publicly reconstructed from retained sources is equally important: the exact pre-Series
    C cap table, lifetime capital raised before 2025, any debt or secondary component, and current board
    observer or governance rights. Management and the company also make qualitative claims about best-in-class
    unit economics, same-store sales growth, dramatic revenue growth, and enterprise-level profitability,
    but no audited numerical disclosure is public in the retained source set.'
  claimRefs:
  - CO014
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  tableRefs:
  - TO003
- id: sustainability-technology-milestones-and-risks
  title: Sustainability, Technology, Milestones, and Adverse Signals
  body: 'Sustainability is not just incidental branding for Just Salad; it is part of the company''s public
    differentiation stack. The company says its reusable-bowl program dates to 2006, B Lab shows certification
    since April 2023, and company plus third-party sources say Just Salad was the first U.S. restaurant
    chain to carbon label its menu. Hospitality Technology adds useful detail by tying the carbon-label
    system to Planet FWD verification and describing the BringBack QR-based reuse workflow, while a later
    official release shows the brand extending its digital personalization story with Salad AI. Those
    claims matter because current growth stories are not built on kitchen automation: both NRN and QSR
    report that Kenner still emphasizes hand-prepped produce, house-made dressings, and no-automation
    restaurant execution even as the chain experiments with drive-thru formats. The main public adverse
    issues are managerial rather than food-safety or regulatory crises. CFO.com and QSR reported a 2025
    lawsuit by former CFO Stefan Boyd over a disputed $1.2 million payout tied to the February 2025 financing
    mechanics, and Top Class Actions reported a June 2026 investigation into whether salaried assistant
    managers were misclassified and denied overtime. A Violation Tracker parent search produced no record
    at fetch time, but BBB complaint surface area and the two labor-compensation stories are enough to
    treat legal and labor diligence as a live risk item.'
