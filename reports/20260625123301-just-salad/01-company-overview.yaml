- id: founders-leadership-governance
  title: Founders, Leadership, and Governance
  body: Founder concentration is unusually visible in the public record. Nick Kenner is still the face
    of strategy, fundraising, product posture, and growth-format decisions across the financing announcement,
    QSR interviews, and NRN coverage, which makes key-person dependence material for any diligence process.
    Rob Crespi is still identifiable as a co-founder in the retained public record, but he is not prominent
    in current company messaging, suggesting that today's public narrative is heavily centered on Kenner.
    Public visibility below the founder level is thinner. The retained sources do surface a named sustainability
    lead, Alex Harden, and the former CFO Stefan Boyd appears in 2025 litigation coverage, but there is
    no robust public board page or current executive bench disclosure comparable to what later-stage public
    companies provide. Reuters also reported that Kenner holds a large stake but is not a majority owner,
    which supports a founder-influenced but not obviously founder-majority control picture. The result
    is a leadership profile that is understandable at the founder level yet still incomplete on governance
    depth, succession, and current finance leadership.
  claimRefs:
