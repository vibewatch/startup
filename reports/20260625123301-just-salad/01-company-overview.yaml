company:
  name: Just Salad
chapter:
  number: 1
  title: Company Overview
  summary: Just Salad is a New York-founded fast-casual restaurant chain that pairs plant-centric meals
    with a long-running sustainability brand, and it entered a new capital phase with a $200 million Series
    C at an approximately $1 billion valuation in February 2025. Public sources support the core identity,
    founder-led operating model, East Coast/Midwest footprint, reusable-bowl and carbon-label differentiation,
    and recent tech and drive-thru experiments, but exact headcount, board composition, and lifetime capital
    raised remain private. Adverse public signals in 2025-2026 include a former CFO compensation lawsuit
    and a wage-and-hour investigation involving assistant managers.
sections:
- id: identity-footprint-business-model
  title: Identity, Footprint, and Business Model
  body: 'Just Salad presents itself as a fast-casual restaurant chain that tries to combine healthy convenience
    with sustainability rather than as a narrow salad-only concept. The current homepage and about page
    describe fresh salads, bowls, wraps, soups, and smoothies, while the founder interviews and financing
    release show management increasingly talking about a broader lunch-and-dinner platform with suburban,
    residential, and drive-thru formats. Public footprint markers have moved upward over the past eighteen
    months: the February 2025 financing announcement said the company had over 90 locations, the current
    about page says over 100 locations across seven states, and a January 2026 QSR profile said the chain
    ended 2025 with 110 locations spanning New York City, the Tri-State area, Chicago, Massachusetts,
    Philadelphia, Washington, D.C., and Florida. That progression supports the user-supplied intuition
    that the brand is primarily an East Coast and Midwest operator, not yet a fully national chain. Headquarters
    markers are consistent at New York, even though the company does not publish a deep corporate profile
    or SEC-style governance disclosure because it remains private.'
