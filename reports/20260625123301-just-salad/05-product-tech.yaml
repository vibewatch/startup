- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - Just Salad Solution
  - Measurable Benefit / Signal
  - Limitation
  rows:
  - - Build a fast lunch
    - Browse menu, inspect ingredients, compare calories manually
    - Owned menu surface shows calories, protein, ingredients, and carbon label per item
    - Faster comparison across health and climate attributes
    - No public evidence on how often these fields change conversion
  - - Earn and redeem loyalty value
    - Buy an eligible order, wait for reward, redeem inside app
    - Mystery-style reward after each eligible $12+ purchase
    - Simple rule set versus points accounting
    - Reward posting can take up to a day and public reviews cite edge-case failures
  - - Get a recommendation without menu overload
    - Scroll through menu and customize manually
    - Salad AI survey recommends four personalized builds
    - Reduces decision paralysis for new or occasional users
    - No public A/B test, usage, or reorder lift disclosed
  - - Order pickup with reusable packaging
    - Place digital pickup order, return bowl later
    - BringBack flow uses a green returnable bowl and app-confirmed drop-off
    - Reuse is extended from in-store to pickup orders
    - Current store count and return-rate reporting are inconsistent
  - - Feed an office or event
    - Assemble group order with dietary complexity
    - Catering offers labeled requests, trays, and pickup/delivery logistics
    - Simplifies large-order coordination
    - No public SLA, prep-time, or fulfillment-performance reporting
  - - Order via marketplace delivery
    - Use DoorDash/Uber Eats or other delivery surface
    - Marketplace presence and DeliverZero-compatible reuse experiments
    - Expands demand capture outside owned channels
    - Rewards cannot be earned or redeemed on third-party delivery
