      type: dependency
    - id: d4
      label: Salad AI
      detail: Survey-based recommendation flow living inside the mobile app.
      type: dependency
    - id: d5
      label: BringBack Program
      detail: Returnable-bowl pickup workflow and in-store sanitization loop.
      type: dependency
    - id: d6
      label: DoorDash / Uber Eats
      detail: Marketplace demand capture and advertising surfaces outside owned loyalty economics.
      type: dependency
    - id: d7
