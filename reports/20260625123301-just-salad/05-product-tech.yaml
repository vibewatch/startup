- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Process
  - Role
  - Key Dependency
  - Risk
  rows:
  - - Fresh-prep kitchen operations
    - Prepare produce, proteins, dressings, and item assembly
    - Daily labor execution and store process consistency
    - Labor dependency remains high because management rejects kitchen automation
  - - Menu + nutrition/carbon data model
    - Expose calories, protein, carbon footprint, ingredients, and filters across surfaces
    - Accurate recipe data and verified carbon methodology
    - Wrong or stale data would directly weaken trust in health and climate claims
  - - Owned ordering surfaces
    - Support browse, reorder, pickup, delivery, and promotions in app/web
    - Mobile app stability, payment rails, and order-routing stack
    - No public uptime history or incident reporting
  - - Loyalty + personalization layer
    - Determine reward eligibility and generate Salad AI recommendations
    - Business rules, survey logic, and user-account state
    - Public reviews show that reward logic and app UX can fail at user level
  - - Reuse logistics layer
    - Coordinate BringBack bowl issue, return, sanitization, and store participation
    - Store-level cleaning process and participating-location coverage
    - Pilot scale and live footprint are not clearly reconciled in public sources
  - - Delivery and channel mix layer
    - Extend demand capture through owned channels and marketplaces
    - Marketplace economics and reusable-delivery partnerships such as DeliverZero
    - Rewards exclusion on third-party delivery can fragment user behavior across channels
