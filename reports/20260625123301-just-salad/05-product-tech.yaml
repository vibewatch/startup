- id: FE004
  title: Product Maturity / Capability Map
  type: matrix
  layout: wide
  summary: 'Different surfaces are mature to different degrees: menu, ordering, and privacy disclosures are established, while Salad AI and BringBack remain less-proven modules.'
  data:
    columns:
    - In-store core
    - Owned app / web
    - Marketplace extension
    - Catering / group ordering
    rows:
    - label: Menu transparency
      values:
      - High — item prep and labeling are core operating model
      - High — item details, calories, and carbon data exposed
      - Low — marketplace transparency not documented in reviewed sources
      - Medium — dietary labeling exists but item-level digital depth is narrower publicly
    - label: Rewards / personalization
      values:
      - Low — rewards require app scan to travel in-store
      - Medium — rewards mature, Salad AI newer
      - Low — rewards excluded on third-party delivery
      - Low — no public loyalty-specific group-order tooling surfaced
    - label: Reuse integration
      values:
      - High — MyBowl long-running
      - Medium — BringBack pilot and carbon-neutral checkout are live
      - Medium — DeliverZero-style reuse experiments exist but are not core UX
      - Low — catering reuse workflow not publicly documented
    - label: Support / reliability confidence
      values:
      - Medium — store ops visible but no SLA metrics
      - Medium — active updates plus visible app complaints
      - Low — third-party behavior partly externalized
      - Medium — clear policy disclosures but no public performance metrics
    - label: Roadmap confidence
      values:
      - High — fresh-prep model clearly maintained
      - Medium — active releases and funded tech investment, but limited KPIs
      - Medium — marketplace spend persists, but loyalty remains outside it
      - Medium — existing offer is clear, future tooling roadmap is not
  approximationNotes: High/Medium/Low ratings reflect public evidence quality and rollout maturity, not internal company scores.
