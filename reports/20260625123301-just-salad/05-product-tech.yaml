- id: FE002
  title: Customer Workflow / Operating Flow — App Order to Pickup or Delivery
  type: flow
  layout: wide
  summary: A digital guest can browse the menu, optionally invoke Salad AI, apply rewards or reuse options, check out, and then complete pickup, delivery, or bowl return.
  data:
    nodes:
    - id: n1
      label: Browse Menu
      detail: Guest compares chef-designed items with calorie, protein, and carbon data.
      type: step
    - id: n2
      label: Filter or Personalize
      detail: Guest uses dietary filters or Salad AI survey to narrow options.
      type: decision
    - id: n3
      label: Add Reward / Promotion
      detail: Eligible reward or digital promotion is applied inside the app if cart rules are satisfied.
      type: step
    - id: n4
      label: Choose Fulfillment
      detail: Guest selects in-store pickup, delivery, catering, or BringBack pickup where available.
      type: decision
    - id: n5
      label: Checkout
      detail: Payment occurs through supported cards or digital wallets; optional carbon credit can be added in app.
      type: step
    - id: n6
      label: Complete Order
      detail: Guest receives meal or returns BringBack bowl later through a participating store drop-off bin.
      type: step
  approximationNotes: The flow condenses multiple public user journeys into one operating map; marketplace delivery and catering diverge after fulfillment selection.
  claimRefs:
  - CE004
  - CE005
  - CE008
  - CE010
  - CE019
  - CE028
  - CE034
