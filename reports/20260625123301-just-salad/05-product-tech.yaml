  evidenceGaps:
  - type: missing-source
    severity: material
    topic: order-stack-vendors
    missingEvidence: A current system diagram or vendor list for app, web ordering, POS routing, payments, and marketplace integrations.
    whyItMatters: Public materials show channel behavior but not the underlying integration stack, making migration risk, single points of failure, and vendor concentration hard to underwrite.
    diligencePath: Request architecture docs, core vendor contracts, API ownership, and incident-responsibility mappings for owned digital ordering.
    relatedQuestionRefs:
    - QE003
    - QE015
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: salad-ai-adoption
    missingEvidence: Post-launch Salad AI usage, conversion, repeat-order lift, retention, and recommendation-acceptance metrics.
    whyItMatters: Without product analytics, it is impossible to tell whether Salad AI is a durable engagement moat or mainly a launch-period marketing story.
    diligencePath: Request monthly active users for Salad AI, recommendation acceptance rates, A/B test results, and downstream reorder behavior.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE005
  - type: conflicting-data
    severity: minor
    topic: bringback-footprint
    missingEvidence: A reconciled current BringBack store list and explanation for the difference between the 16-store FY2023 report and the 14-location current page.
    whyItMatters: An unreconciled pilot footprint makes it harder to judge whether BringBack is expanding, shrinking, or simply being inconsistently disclosed.
    diligencePath: Request a live participating-store roster, monthly active return rate, and any stores added or removed since fiscal 2023.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Independent security-assurance materials such as PCI scope detail, penetration-test summaries, status history, or incident postmortems for the app and web ordering surfaces.
    whyItMatters: Current public trust evidence is mostly disclosure-based, so diligence cannot test the operating quality of privacy, uptime, and incident-response controls.
    diligencePath: Request a security-program overview, vendor-risk framework, breach log, uptime dashboard, and most recent penetration-test or audit summaries.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
