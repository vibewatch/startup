- id: section-3
  title: Trust, Privacy, Support, and Reliability Controls
  body: 'The trust layer that is publicly visible today is disclosure-heavy and assurance-light. On privacy, Just Salad publishes a relatively detailed policy that covers device and browser metadata, general and precise location, order and payment history, communications, marketing preferences, and restaurant security-camera footage; the policy also references SMS alerts, California CCPA rights, and a child-directed-data boundary. App-store labels add a second lens: Apple''s listing says contact info and identifiers may be used for cross-app tracking, while Google Play says the Android app shares app activity, app-performance data, and device identifiers with third parties, encrypts data in transit, and supports deletion requests. Support paths are also explicit: public app and rewards surfaces route guests to comments@justsalad.com. What is missing is equally important. No public status page, uptime history, incident postmortem archive, or independent security certification surfaced in
    the reviewed materials, so diligence can confirm what data is collected and what controls are promised, but not the operating quality of those controls under failure. Public Android reviews therefore matter as a live proxy: they repeatedly surface reward failures, freezes, notification friction, and delivery-order errors.'
  claimRefs:
  - CE012
  - CE014
  - CE015
  - CE031
  - CE032
  - CE033
  - CE034
  - CE041
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: section-4
  title: Roadmap, Scaling Signals, and What Just Salad Is Not Building
  body: 'The public roadmap signals point toward more digital guidance, more format experimentation, and more operational scaling, but not toward automation-heavy kitchen tech. Salad AI was launched in January 2025 as an app feature rather than a back-of-house system, and management has described it as a retention and acquisition tool that reduces menu decision fatigue. The February 2025 fundraise explicitly earmarked capital for menu innovation, advanced technology initiatives, and customer experience, reinforcing that more consumer-facing software investment should be expected. On the physical side, NRN reports that the first drive-thru opened in early 2025, generated a 30%-plus sales lift, and is being followed by four to six more drive-thru openings in 2026 with a three-minute service target. At the same time, Nick Kenner has publicly said there is no automation and no desire for robots to serve humans in stores. That matters strategically: Just Salad appears to be scaling through process
    control, staffing tenure, marketing, and owned-channel UX improvements, while keeping food prep fresh and manual. The result is a differentiated but still labor-dependent operating model whose next proof points are digital reliability and repeat-use performance, not robotics demos.'
