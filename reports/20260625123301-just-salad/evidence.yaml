    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: just-salad-channel-mix
    missingEvidence: >-
      Company-level data on Just Salad's same-store sales, digital mix, catering share, office-exposed locations, and
      repeat behavior.
    whyItMatters: >-
      Public category data cannot reveal whether Just Salad is advantaged or disadvantaged versus public comps on
