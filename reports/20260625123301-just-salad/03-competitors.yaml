    - Third-party visible range from $7.49 craft salad to $10.49 listed premium salads (estimated)
    - Custom salads, grain salads, sandwiches / wraps
    - Salads, grain salads, snacks, drinks
    - MenuXP explicitly warns prices may vary; QSR metrics are older than 2026 count
    - Likely price-near to Just Salad, with convenience formats carrying more weight than list price
  - - DIG
    - No stable public list-price source retained this run
    - Scratch-cooked bowls, salads, proteins, seasonal comfort food
    - Warm bowls and comfort-food leaning menu
    - Current market-level pricing remains a diligence gap
    - Competes on warm meal occasion and ingredient quality more than transparent list pricing
  - - Tender Greens
    - $4 soups, $6 simple salads, $11 big salads (estimated)
    - Soups, salads, and plate-style entrées
    - More entrée-like than salad-only
    - MenuXP is estimated and location-sensitive
    - Can undercut some premium salad chains on entry price while widening dinner utility
  - - CAVA
    - No stable public list-price source retained this run
    - Curated/custom bowls and pitas plus digital and grocery adjacency
    - Mediterranean bowls, pitas, dips/spreads
    - Need direct ordering scrape or on-site store check for current list prices
    - Scale and broad format matter more than transparent public list pricing here
  - - Panera
    - Official fetched menu emphasized breadth rather than stable national list pricing
    - Menu plus combo logic (e.g., You Pick Two) and broad bakery-cafe format
    - Salads, soups, sandwiches, bowls, breakfast, beverages
