- id: product-pricing-competition
  title: Capability and pricing competition
  body: Just Salad still looks differentiated on brand tone and sustainability communication, but the core buyer comparison is increasingly about breadth, convenience, and whether a chain can cover more than one meal occasion. Just Salad markets salads, wraps, warm bowls, soups, smoothies, catering, and app rewards, which keeps it competitive with specialist peers. But Sweetgreen’s current public menu now spans wraps, bowls, protein plates, kids meals, sides, and item-level CO2e data; CAVA combines curated and customizable bowls with pitas and grocery-distributed dips; Chopt and DIG both emphasize warm bowls; and Tender Greens moves even further into plate-style entrées. Public pricing is uneven because only some chains expose stable list prices on fetched pages. Still, Just Salad’s own June 2026 seasonal launch showed $12.69–$12.99 entry points for featured salads and market plates plus a $4.69 soup, while third-party menu trackers place Chopt’s visible range around $7.49–$10.49 for older
    signature salads and Tender Greens at $4 soups, $6 simple salads, and $11 big salads. The practical implication is that Just Salad appears priced close to premium fast-casual peers rather than meaningfully below them, so sustained traffic depends more on brand affinity, digital retention, and convenient format than on a clear list-price advantage.
