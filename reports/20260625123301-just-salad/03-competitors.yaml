- id: TP006
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Sustainability-first brand identity
    - Reusable bowls, carbon labels, climatarian framing, B Corp positioning
    - Sweetgreen already surfaces item-level CO2e; larger peers can copy menu messaging
    - High
    - Verify whether sustainability positioning drives repeat rate or enterprise catering wins, not just brand awareness
  - - Loyalty and rewards habit
    - JS Rewards, freebies, stamp-based incentives
    - Promotions are easy for peers to match; no structural contract lock-in is visible
    - Medium
    - Request cohort retention and repeat frequency by rewards member vs non-member
  - - Low-hundreds footprint in dense markets
    - 100–120+ disclosed locations and office/catering cues
    - CAVA at 439 and Sweetgreen at 281 can out-spend and out-locate Just Salad
    - High
    - Map overlap by trade area and compare same-market opening cadence
  - - Healthy lunch specialization
    - Salads, wraps, bowls, soups, smoothies built around a clear use case
    - Panera, delivery apps, prepared grocery, and Factor solve the same use case through broader channels
    - High
    - Test whether Just Salad wins on NPS or frequency in mixed-channel customer cohorts
  - - Private-company agility
    - No public-market reporting burden, flexible seasonal launches
    - Opaque metrics make it harder for outsiders to judge true margin resilience or expansion capacity
    - Medium
    - Request store count by market, AUV, and store-level margin trend under NDA
  - - Category tailwind toward protein-rich, customizable salads
    - Toast trend data and active seasonal launches across chains
    - Tender Greens bankruptcy and public-filer risk factors show the category is still operationally tough
    - High
    - Underwrite downside with traffic softness, delivery fee pressure, and suburban competition scenarios
  notes: Severity reflects likely impact on Just Salad’s ability to defend traffic and pricing power, not enterprise value directly. Several risks are category-wide rather than company-specific, which reduces the uniqueness of the moat.
