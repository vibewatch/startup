  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: just-salad-footprint
    missingEvidence: A single, company-certified 2026 unit count for Just Salad that reconciles the over-100 and 120-plus public disclosures.
    whyItMatters: Scale is central to comparing distribution power against Sweetgreen and CAVA; an imprecise count weakens apples-to-apples footprint analysis.
    diligencePath: Request a current store count by state from management or the media team and reconcile it to the live locator.
    relatedQuestionRefs:
    - QP004
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: Direct, location-stable official list prices for Sweetgreen, CAVA, DIG, and Panera rather than dynamic menus or third-party trackers.
    whyItMatters: Pricing is a volatile fact and a key part of substitute pressure; estimated or partial price visibility limits confidence in the pricing table.
    diligencePath: Collect screenshots or direct-store cart pulls from representative ZIP codes for each brand on the same day.
    relatedQuestionRefs:
    - QP009
    - QP016
  - type: missing-source
    severity: minor
    topic: likely-entrants
    missingEvidence: A current source set showing which adjacent bowl, grocery, or convenience operators are entering Just Salad overlap markets next.
    whyItMatters: The threat set is broader than named salad chains, but public evidence on likely entrants is fragmented and market-specific.
    diligencePath: Review lease trackers, local retail opening coverage, and private-equity restaurant roll-up announcements in Just Salad’s expansion geographies.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: private-chain-economics
    missingEvidence: Current realized margins, same-store sales, and capital backing details for private chains such as Chopt, DIG, Tender Greens, and Just Salad.
    whyItMatters: Competitive durability depends on whether private peers are profitably expanding or merely sustaining footprints; public proxies do not answer that cleanly.
    diligencePath: Request management metrics or lender/investor materials under NDA and compare them with public-category benchmarks.
    relatedQuestionRefs:
    - QP027
  - type: missing-source
    severity: minor
    topic: local-market-overlap
    missingEvidence: Trade-area level overlap data showing where Just Salad most directly competes with CAVA, Sweetgreen, Chopt, and Panera.
    whyItMatters: National footprint counts do not show which competitors matter most in the exact neighborhoods where Just Salad is opening next.
    diligencePath: Build a market overlap map from store locators and third-party mobility data before underwriting further expansion.
    relatedQuestionRefs:
    - QP026
