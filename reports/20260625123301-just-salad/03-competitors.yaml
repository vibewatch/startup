  rows:
  - - Just Salad
    - Direct peer
    - Private; public materials show over 100 to 120+ locations in 2026
    - Urban/suburban health-conscious lunch and office meals
    - Reusable bowls, carbon labels, climatarian framing, broad salad+bowl menu
    - Private metrics are opaque; footprint disclosure is not standardized across sources
  - - Sweetgreen
    - Direct public peer
    - 281 restaurants at FY2025 end
    - Premium health-forward fast casual, office lunch, digital diners
    - Large footprint, visible CO2e labeling, Infinite Kitchen automation, protein plates
    - Still a highly competitive restaurant model; public filing flags same-store and growth risk
  - - Chopt
    - Direct peer
    - 103 locations (ScrapeHero Apr 2026); 87 locations / $165M sales in prior QSR profile
    - East Coast premium salads and bowls
    - Strong suburban build-out, digital-first formats, drive-thru pickup lanes
    - Private ownership and current realized margins are opaque
  - - DIG
    - Adjacent peer
    - 36 restaurants as of Oct 2025
    - Northeast diners choosing scratch-cooked bowls, vegetables, and comfort food
    - Warm plates and seasonal vegetables widen meal occasion beyond salad
    - Smaller footprint and weaker national brand awareness
  - - Tender Greens
    - Adjacent peer / cautionary comp
    - 22 units after bankruptcy sale
    - California-led diners seeking chef-style salads and plates
    - Chef-driven plates and salads at mid-premium price points
    - Chapter 11 and contraction show fragile category economics
  - - CAVA
    - Scaled adjacent peer
    - 439 restaurants at FY2025 end
    - Broad health/wellness fast casual across dayparts and demographics
    - Largest direct scale set here; curated/custom bowls and pitas; grocery CPG touchpoints
    - Mediterranean positioning is broader than salad, so not a pure apples-to-apples comp
  - - Panera
    - Incumbent substitute
    - Nationwide U.S. café network via official locator
    - Mass-market lunch, family, and office occasions
    - Very broad menu, combo structure, national convenience
    - Less specialized on salad quality/customization than specialist peers
  - - DoorDash / grocery / ready-to-eat delivery
    - Status-quo substitute
    - Multi-merchant distribution rather than unit count
    - Customers prioritizing convenience and choice over brand loyalty
    - Aggregates many healthy merchants, grocery prepared foods, and at-home meals
    - Weak direct brand affinity; quality and pricing vary by merchant and market
  notes: Scale figures mix public filings, data-provider counts, and company disclosures. Private-chain footprint figures are directionally useful but less standardized than public-company restaurant counts.
