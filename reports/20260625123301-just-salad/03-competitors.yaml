    - Price varies by merchant, markup, and basket size
    - Marketplace order, grocery add-to-cart, or home delivery subscription
    - Prepared salads, bowls, wraps, ready meals
    - Fees, taxes, and promos change effective price materially
    - Makes transparent chain-vs-chain pricing less decisive because shoppers compare total convenience cost
