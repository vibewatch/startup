- id: switching-costs-distribution
  title: Switching costs, distribution power, and multi-homing
  body: 'Competitive pressure is not just brand-vs-brand; it is also channel-vs-channel. Just Salad’s strongest retention assets are its app rewards loop, office/catering presence, reusable-bowl habit, and carbon-label identity. Those features can increase repeat purchase among existing fans, but they are lighter-weight than the distribution advantages held by larger peers and incumbents. CAVA’s footprint and broad demographic positioning give it more geographic reach and awareness. Sweetgreen’s automation roadmap suggests it is still pushing throughput and labor efficiency. Chopt’s suburban drive-thru pickup model directly attacks the convenience axis in trade areas where a walk-in salad specialist is less advantaged. Panera’s nationwide café base and much wider menu make it easy for a group or family order to bypass a salad-focused chain entirely. Meanwhile, DoorDash, Instacart, and Factor-type services make the lunch occasion multi-home by default: a customer can switch from a salad chain
    to a grocery prepared salad, a warm bowl from another merchant, or a ready-to-eat home delivery option without signing a new contract or accepting meaningful setup cost. That keeps switching costs low and makes location density, speed, and habit formation more valuable than menu novelty alone.'
