  evidenceGaps:
  - type: missing-source
    severity: material
    topic: active-loyalty-members
    missingEvidence: A current public or management-provided count of JS Rewards members, direct app MAUs, and direct digital order share.
    whyItMatters: Without a direct-member denominator, public app ratings and reward mechanics cannot be translated into customer economics or retention value.
    diligencePath: Request monthly JS Rewards members, app MAUs, app-order share, and first-party reorder rate by platform.
    relatedQuestionRefs:
    - QU024
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: A split of revenue or orders across office catering, first-party direct digital, in-store scan usage, and third-party marketplaces.
    whyItMatters: Channel mix determines customer quality, margin structure, and whether growth is compounding in channels Just Salad controls.
    diligencePath: Request channel mix by revenue, orders, and contribution margin, plus first-party vs third-party customer overlap.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
    - TU006
  - type: private-evidence-only
    severity: material
    topic: enterprise-logo-roster
    missingEvidence: Named enterprise accounts, repeat-order data, order frequency, and measurable outcomes for the office-catering book of business.
    whyItMatters: Anonymous testimonials prove usage but do not prove account quality, diversification, renewal, or land-and-expand dynamics.
    diligencePath: Request top 20 office accounts, annualized order volume, renewal cadence, and any branded case studies under NDA.
