- id: adoption-and-channel-traction
  title: Adoption Trajectory and Channel Traction
  body: 'Adoption evidence is meaningful even though it is messy. Independent trade coverage in early 2026 said Just Salad had crossed 100 locations, with QSR Magazine specifying 110 units, nearly double the 2022 footprint, five consecutive years of same-store sales growth, and roughly $195 million of 2025 system revenue. The iPhone app also shows scale, with 17,000 ratings and product features built around repeat use such as one-tap reordering, customization, and digital promotions. At the same time, third-party and marketplace profiles lag badly: one current ezCater profile still says 34 locations while a Yelp business profile says more than 50. The safest interpretation is not that the chain is small, but that customer-facing channel metadata is inconsistent across partners. That inconsistency matters because investors want one clean adoption dashboard. Publicly, Just Salad instead offers a patchwork of app ratings, footprint counts, delivery availability, and loyalty-launch rhetoric
    rather than a single disclosed customer KPI set.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU013
