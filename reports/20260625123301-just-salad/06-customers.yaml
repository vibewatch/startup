slug: just-salad
runDate: '2026-06-25'
company:
  name: Just Salad
chapter:
  number: 6
  title: Customers
  summary: 'Just Salad''s customer proof is strongest in three places: direct consumer app usage, office catering/testimonial surfaces, and broad third-party delivery availability. The February 2026 JS Rewards relaunch gives the brand a clearer first-party repeat-purchase loop, but public customer evidence is still much stronger for anonymous office occasions and consumer reviews than for named enterprise accounts or retention economics. The main risk is not lack of demand proof; it is visibility, because Just Salad does not publicly disclose customer counts, corporate account concentration, or post-launch repeat-frequency data.'
sections:
- id: customer-segmentation
  title: Customer Segmentation and Buying Roles
  body: 'Just Salad''s public surfaces show a hybrid customer base rather than a single archetype. The homepage pushes three distinct demand paths: individual ordering, office ordering, and catering, while the catering page is written for coordinators planning meals for groups of at least ten people and emphasizes dietary coverage, clear labeling, and pickup or delivery across the chain. That implies at least three economic actors in the same system: the self-paying everyday diner, the office coordinator or meeting planner placing group orders, and the employee or attendee consuming those meals. Delivery marketplaces add a fourth route by widening access for convenience-driven buyers who may never enter the first-party app. The customer story is therefore broader than ''healthy lunch consumer'' alone. It includes workplace occasions, recurring corporate meal programs, and high-frequency digital users who respond to convenience, customization, and rewards. The caveat is that Just Salad still
    does not publish a customer-count breakout or revenue mix by direct consumer, office catering, and marketplace channels, so the segmentation is visible but not fully quantified.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU020
  - CU025
  - CU031
  - CU032
  - CU041
  tableRefs:
  - TU001
