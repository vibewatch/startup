- id: expansion-and-concentration-risk
  title: Expansion Paths and Concentration Risk
  body: The expansion story is plausible, especially in office meals and first-party digital frequency, but public concentration data is thin. BusinessWire's 2025 ezCater data suggests recurring workplace food programs are becoming more common, with larger budgets and strong personal-order conversion after employer-provided meals; that should help a brand already merchandising office ordering, catering, and delivery. Just Salad's own 2026 rewards relaunch also gives management a clearer tool for driving frequency and reducing dependence on blunt discounting. Still, three risks remain. First, marketplace delivery may be broad, but terms explicitly exclude third-party delivery from rewards, so Just Salad could grow channel usage without capturing corresponding first-party data or loyalty value. Second, office catering proof remains largely anonymous, which makes it hard to tell whether demand is diversified across many small accounts or concentrated in a handful of repeat buyers. Third, the
    company does not publish customer counts, retention metrics, enterprise logo rosters, or channel-mix economics. That means the main diligence risk is opacity rather than demand collapse.
  claimRefs:
