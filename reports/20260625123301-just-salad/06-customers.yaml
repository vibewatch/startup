callouts:
- calloutType: strength
  title: Just Salad clearly has real demand across direct, office, and marketplace channels
  body: The combination of 100+ locations, a 17K-rated iOS app, active office-catering pages, and broad delivery-platform presence shows real customer adoption. This is not a concept still searching for product-market fit; it is a scaled fast-casual brand with multiple customer-entry paths.
  claimRefs:
  - CU001
  - CU007
  - CU020
  - CU021
- calloutType: risk
  title: Public customer quality data is much thinner than public customer reach data
  body: Just Salad can show many ways to acquire a customer, but it cannot publicly show enterprise logo depth, account concentration, formal retention, or post-launch frequency gains. The diligence problem is therefore measurement opacity and service-friction risk, not absence of customer activity.
  claimRefs:
  - CU034
  - CU038
  - CU039
  - CU040
- calloutType: recommendation
  title: Ask management for direct-vs-marketplace mix and post-JS-Rewards frequency uplift
  body: The key diligence unlock is not another anecdote; it is instrumentation. Investors should request first-party app member counts, reward redemption rates, direct-versus-third-party order mix, repeat office-account rates, and top-customer concentration to determine whether customer growth is compounding inside channels Just Salad actually controls.
  claimRefs:
  - CU017
  - CU032
  - CU040
