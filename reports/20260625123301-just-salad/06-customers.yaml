- id: named-customer-proof
  title: Named and Attributable Customer Proof
  body: Just Salad does have real customer proof, but most of it is either anonymized B2B testimonial content or attributable consumer reviews rather than disclosed marquee enterprise logos. On the positive side, the official catering page includes direct quotes from an architecture company, a leading civil defense litigation law firm, and a health insurance company, each describing a successful employee meal occasion and repeat intent. Yelp adds a more detailed office-lunch anecdote in which a reviewer said the director of catering personally walked through the order, kept the meal on budget, and delivered enough food for the group. On the consumer side, public app-store and Google Play reviews show identifiable users discussing repeat ordering and product friction in concrete terms. This is useful proof that customers exist, order repeatedly, and care about the digital experience. It is weaker proof of durable enterprise contracts, because Just Salad still does not disclose named national
    corporate accounts, contract sizes, or measured outcome case studies.
  claimRefs:
  - CU004
  - CU005
  - CU010
  - CU027
  - CU028
  - CU039
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-repeat-and-satisfaction
  title: Retention, Repeat Usage, and Satisfaction
  body: 'Repeat-usage signals are present, but hard retention metrics are absent. The strongest positive repeat-use proxies are built into the product itself: the iPhone app advertises one-tap reordering, the loyalty program gives a reward after every eligible purchase, the stamp system can keep users engaged over a year, and the office-catering testimonials explicitly mention using Just Salad again. Those are supported by a large iOS ratings base and by trade coverage that says the new loyalty architecture is designed to drive frequency and reduce friction. But the negative side is impossible to ignore. Google Play reviewers, JustUseApp summaries, PissedConsumer call logs, and Revdex complaints all point to delivery errors, rewards confusion, app freezing, poor service recovery, and closed-location ordering problems. Even the official FAQ has a troubleshooting section for delayed rewards, grayed-out rewards, and missed scans. The result is a mixed satisfaction picture: consumers like convenience,
    healthy options, and ordering tools, but service and app reliability still threaten repeat usage. Public NRR, GRR, churn, cohort, or account-retention metrics are not disclosed.'
