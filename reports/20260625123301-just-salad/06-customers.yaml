- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Individual lunch diners
    - Buyer=user=payer in direct retail occasions
    - Everyday salad, wrap, bowl, smoothie, pickup, delivery
    - Homepage, app-store, delivery-platform, and review surfaces
    - Core base that can repeat frequently through app and rewards
    - No public active-customer or visit-frequency count
  - - Direct app loyalty users
    - Buyer=user; payer direct digital orderer
    - Order ahead, customize, reorder, redeem rewards, view carbon/nutrition info
    - App Store, Google Play, Rewards FAQ, loyalty press
    - Highest-value first-party data and repeat-frequency channel
    - No disclosed member count or conversion uplift
  - - Office catering coordinators
    - Buyer/payer is office manager, admin, HR, or meeting planner; users are employees
    - Lunch meetings, office events, dietary-restricted group ordering
    - Official catering page, CaterCow listing, Yelp office-lunch review
    - B2B occasion with larger baskets and repeat-program potential
    - No named logo roster or account concentration data
  - - Employees receiving employer meals
    - User only; payer is employer
    - Recurring office meal programs and one-off catered events
    - Architecture, law-firm, and health-insurance testimonials; ezCater context
    - Can convert from trial at work to personal orders later
    - No proof of how much conversion Just Salad itself achieves
  - - Third-party delivery customers
    - Buyer=user on marketplace apps
    - Convenience-led scheduled or on-demand delivery
    - Uber Eats brand page and broad app complaints about delivery frictions
    - Expands reach beyond first-party app footprint
    - Terms exclude these orders from rewards economics
  - - Suburban drive-thru / convenience users
    - Buyer=user or family payer
    - Quick pickup and drive-thru visit occasions
    - Woodbridge location page with drive-thru and catering
    - Broadens usage beyond dense urban office corridor traffic
    - No public mix by suburban vs urban sales
  notes: Segmentation is inferred from customer-facing ordering surfaces and testimonials rather than company-disclosed revenue mix or account counts.
