            body: >-
              Digital ordering is not peripheral to Just Salad's model; it is embedded in the proposition. The app
              advertises nutrition and carbon-footprint information, one-tap reorder, pickup, delivery, and exclusive
              offers, while BringBack only works through the app for pickup orders. That suggests first-party digital is
              both a commerce and a sustainability surface. App ratings are directionally positive on iOS but notably
              weaker on Google Play, where users report glitches and, in one recent review, a roughly $7 higher price
              when redirected to DoorDash. Management also told QSR that it has learned which third-party delivery
              promotions and ad spend are effective versus wasteful, implying the delivery channel is important enough
              to optimize but not clean enough to treat as frictionless growth. Because Just Salad does not disclose
              exact digital or delivery mix, public comparables matter: Sweetgreen reported 61.8% digital revenue in
              2025, while CAVA reported 37.9% digital mix. Those public peers set a plausible range for a digitally
