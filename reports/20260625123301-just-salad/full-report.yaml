      - number: '1.3'
        title: Funding, Valuation, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              The clearest capital event in the public record is the February 2025 Series C. The official PR Newswire
              announcement and multiple independent outlets agree that Just Salad raised $200 million, that Wellington
              Management led the round, and that D1 Capital Partners, Neuberger Berman, and Stripes joined the
              syndicate. Those same sources anchor the headline valuation at approximately $1 billion and state that the
              proceeds were meant to support new unit growth, menu innovation, technology, and customer experience.
              Reuters adds the most useful ownership nuance by noting that Kenner still holds a large stake but is not a
              majority owner, implying meaningful founder influence even after the round. What is not publicly
              reconstructed from retained sources is equally important: the exact pre-Series C cap table, lifetime
              capital raised before 2025, any debt or secondary component, and current board observer or governance
              rights. Management and the company also make qualitative claims about best-in-class unit economics,
              same-store sales growth, dramatic revenue growth, and enterprise-level profitability, but no audited
              numerical disclosure is public in the retained source set.
