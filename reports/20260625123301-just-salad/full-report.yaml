    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Just Salad presents itself as a fast-casual restaurant chain that tries to combine healthy convenience
              with sustainability rather than as a narrow salad-only concept. The current homepage and about page
              describe fresh salads, bowls, wraps, soups, and smoothies, while the founder interviews and financing
              release show management increasingly talking about a broader lunch-and-dinner platform with suburban,
              residential, and drive-thru formats. Public footprint markers have moved upward over the past eighteen
              months: the February 2025 financing announcement said the company had over 90 locations, the current about
              page says over 100 locations across seven states, and a January 2026 QSR profile said the chain ended 2025
              with 110 locations spanning New York City, the Tri-State area, Chicago, Massachusetts, Philadelphia,
              Washington, D.C., and Florida. That progression supports the user-supplied intuition that the brand is
              primarily an East Coast and Midwest operator, not yet a fully national chain. Headquarters markers are
              consistent at New York, even though the company does not publish a deep corporate profile or SEC-style
              governance disclosure because it remains private.
