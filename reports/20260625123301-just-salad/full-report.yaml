      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The category has real structural tailwinds. Retained market data and consumer research point to a
              sustained appetite for fresh, healthy, customizable meals, and federal nutrition guidance continues to
              legitimize vegetable-forward, lean-protein menu architecture. Digital ordering and operational technology
              also strengthen the format, especially because health-forward chains tend to over-index toward busy urban
              and younger consumers who value convenience. Sustainability can create additional brand lift, particularly
              when it also improves waste discipline. But the adoption constraints are at least as important as the
              drivers. NRA summary materials show 2025 was a traffic-weak, margin-thin year for operators, while BLS and
              CPI data confirm restaurant inflation remains elevated. Toast survey evidence and public-company filings
              show that labor, food costs, and channel economics still pressure operators hard. Sweetgreen specifically
              warns that hybrid work has shifted sales away from in-store traffic and that off-premise channels can
              carry lower margins because of fees, promotions, and refunds. The result is a market that is
              unquestionably scalable, but only for operators that can hold a premium-quality proposition while
              defending throughput, labor productivity, and value perception.
            claimRefs:
