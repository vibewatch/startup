      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a real but fragile moat. Just Salad is ahead of most private salad chains in making
              sustainability visible at the point of purchase: it has a reusable-bowl program, dedicated carbon-label
              education, and a climatarian framing that few peer pages match. That can matter for dense urban
              professionals and employer accounts that care about climate signaling. But the moat is fragile because
              larger rivals can copy parts of it faster than Just Salad can copy their scale. Sweetgreen already
              publishes item-level CO2e on its public menu, and CAVA’s restaurant count plus grocery presence widen its
              touchpoints beyond four walls. The category also carries adverse operating evidence. Tender Greens and
              parent One Table went through Chapter 11 and emerged with fewer units, showing that “healthy fast casual”
              does not automatically protect a concept from delivery missteps, cannibalization, or capital strain.
              Public filings from both Sweetgreen and CAVA also explicitly warn investors that restaurant growth can
              pressure same-store performance and profitability in a highly competitive market. The resulting verdict is
              that Just Salad’s moat is best understood as brand-positioning plus habit-forming product mechanics—not a
              structural barrier on the order of national scale, proprietary distribution, or hard-to-copy operations.
