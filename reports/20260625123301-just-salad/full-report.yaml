  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call balances real operating proof against category softness, disclosure gaps, and a still-demanding private
      valuation.
    data:
      nodes:
        - id: scale
          label: Real scale
          detail: Public reporting points to ~110 locations and ~$195M preliminary 2025 revenue.
          tone: positive
        - id: economics
          label: Healthy unit economics
          detail: QSR cites ~22% store margins, ~$2M AUVs, and >50% year-two cash-on-cash returns.
          tone: positive
        - id: price
          label: $1B round mark
          detail: The financing implies about 5.1x preliminary 2025 revenue.
          tone: warning
        - id: public-comps
          label: Public comp spread
          detail: CAVA supports upside, while Sweetgreen and Shake Shack anchor the downside.
          tone: warning
        - id: structure
          label: Disclosure / preference gap
          detail: Public sources do not disclose the 2025 round stack, debt load, or audited earnings quality.
          tone: warning
        - id: decision
          label: Track / stretched
          detail: Stay engaged, but require better diligence evidence or better terms before buying.
          tone: neutral
      edges:
        - from: scale
          to: price
        - from: economics
          to: price
        - from: price
          to: decision
        - from: public-comps
          to: decision
        - from: structure
          to: decision
    approximationNotes: null
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV010
      - CV026
      - CV041
      - CV043
      - CV050
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: At the current revenue base, small changes in the assumed sales multiple create very large swings in equity value.
    data:
      items:
        - label: 2.0x on $195M
          value: 390
          detail: Deep discount / stressed public-restaurant case.
          tone: negative
        - label: 3.0x on $195M
          value: 585
          detail: Private growth case with meaningful caution still embedded.
          tone: warning
        - label: 4.0x on $195M
          value: 780
          detail: Disciplined base-case premium for real growth but limited disclosure.
          tone: warning
        - label: Current round
          value: 1000
          detail: Approximate last disclosed valuation mark.
          tone: neutral
        - label: 6.0x on $195M
          value: 1170
          detail: Requires sustained premium execution and cleaner disclosure.
          tone: positive
        - label: CAVA-like 8.2x
          value: 1599
          detail: Illustrates the upside ceiling if Just Salad ever earns a top-tier public multiple.
          tone: positive
    approximationNotes: >-
      All values are simple revenue-multiple bridges in USD millions using the public preliminary 2025 revenue figure;
      they are not DCF outputs.
    claimRefs:
      - CV006
      - CV010
      - CV026
      - CV041
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The public evidence supports a wide range because category multiples and disclosure quality matter almost as much
      as growth.
    data:
      items:
        - label: Bear case
          low: 420
          mid: 473
          high: 525
          displayValue: $420M-$525M
          detail: Revenue stalls near ~$210M and multiple resets to 2.0x-2.5x.
          tone: negative
        - label: Base case
          low: 960
          mid: 1020
          high: 1080
          displayValue: $960M-$1.08B
          detail: Revenue reaches ~$240M and multiple settles at 4.0x-4.5x.
          tone: warning
        - label: Bull case
          low: 1650
          mid: 1800
          high: 1950
          displayValue: $1.65B-$1.95B
          detail: Revenue reaches ~$300M and premium multiple holds at 5.5x-6.5x.
          tone: positive
    approximationNotes: Ranges are scenario-based revenue-multiple outputs before any dilution or preference-stack effects.
    claimRefs:
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Just Salad scores well on growth and unit-economics narrative, but much lower on disclosure quality and cap-table
      visibility.
    data:
      items:
        - label: Market demand
          score: 7
          detail: Revenue growth and unit expansion signals are real, but category demand is softening.
          tone: positive
        - label: Unit economics
          score: 8
          detail: Reported AUVs and store margins are attractive if they hold in a data room.
          tone: positive
        - label: Differentiation
          score: 6
          detail: Sustainability and digital habits help, but the moat is still lighter than public leaders' scale advantages.
          tone: neutral
        - label: Category backdrop
          score: 4
          detail: Fast-casual traffic and value perception look weaker in the 2025-2026 data set.
          tone: warning
        - label: Disclosure quality
          score: 4
          detail: Public evidence is still management-led rather than filing-grade.
          tone: warning
        - label: Cap-table visibility
          score: 3
          detail: Preference and debt terms remain undisclosed in public round coverage.
          tone: warning
        - label: Valuation support
          score: 5
          detail: The round is below CAVA but well above weaker public comps, leaving little room for mistakes.
          tone: warning
    approximationNotes: >-
      Scores are IC heuristics on a 0-10 scale synthesized from the cited evidence; they are not a mechanical rating
      model.
    claimRefs:
      - CV007
      - CV010
      - CV026
      - CV033
      - CV041
      - CV043
      - CV050
