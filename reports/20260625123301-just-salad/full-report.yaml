  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Just Salad now carries the risk profile of a scaled, multi-format growth chain rather than a niche New
              York salad concept. The 2025 capital raise valued the business at about $1 billion and explicitly funded
              new units, technology, and customer-experience investment, which raises the cost of execution misses. The
              top residual risks are food-safety variance during rapid expansion, labor and compensation disputes,
              delivery-channel margin leakage, and the possibility that management is adding complexity faster than it
              is hardening controls. The brand has real mitigants: owned digital ordering, a differentiated reuse and
              sustainability story, strong customer traffic, and evidence of organizational build-out. But the same
              facts that support the bull case also widen the operating surface area. A chain that preps produce daily,
              runs dense urban stores plus a new drive-thru format, pushes loyalty through its app, and pilots
              reusable-container logistics has more ways to stumble than a simpler concept. The right lens is therefore
              not whether risk exists, but which risks can break the expansion thesis before new-store density and
              digital frequency absorb them.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
