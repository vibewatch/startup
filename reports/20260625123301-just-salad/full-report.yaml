      - number: '8.2'
        title: Financing context and comparable stack
        blocks:
          - type: paragraph
            body: >-
              The most useful public benchmark is a sales-multiple stack built from current restaurant comps, not a
              faux-precise DCF. Just Salad's last round implies roughly 5.1x preliminary 2025 revenue. That is
              materially below CAVA's approximately 8.2x June 2026 market-cap-to-revenue multiple, which is supported by
              audited 22.5% FY2025 revenue growth, 24.4% restaurant-level margin, and continued 2026 momentum. It is
              materially above Sweetgreen's roughly 1.5x, where audited FY2025 revenue growth slowed to 0.4%, same-store
              sales fell 7.9%, and restaurant-level margin compressed to 15.2%. It is also above Shake Shack's roughly
              1.6x, which is not a direct product comp but is a useful public-market floor for a scaled restaurant brand
              with audited reporting and liquidity. In that context, Just Salad is being priced neither like a
              distressed salad chain nor like the strongest public growth restaurant in the set. The market is
              effectively assuming it deserves a meaningful private premium over struggling public peers while still
              accepting a discount to the best-in-class public operator.
