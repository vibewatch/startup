        title: Trust, Privacy, Support, and Reliability Controls
        blocks:
          - type: paragraph
            body: >-
              The trust layer that is publicly visible today is disclosure-heavy and assurance-light. On privacy, Just
              Salad publishes a relatively detailed policy that covers device and browser metadata, general and precise
              location, order and payment history, communications, marketing preferences, and restaurant security-camera
              footage; the policy also references SMS alerts, California CCPA rights, and a child-directed-data
              boundary. App-store labels add a second lens: Apple's listing says contact info and identifiers may be
              used for cross-app tracking, while Google Play says the Android app shares app activity, app-performance
              data, and device identifiers with third parties, encrypts data in transit, and supports deletion requests.
              Support paths are also explicit: public app and rewards surfaces route guests to comments@justsalad.com.
              What is missing is equally important. No public status page, uptime history, incident postmortem archive,
              or independent security certification surfaced in the reviewed materials, so diligence can confirm what
              data is collected and what controls are promised, but not the operating quality of those controls under
              failure. Public Android reviews therefore matter as a live proxy: they repeatedly surface reward failures,
              freezes, notification friction, and delivery-order errors.
