  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Just Salad monetizes a broader fast-casual meal occasion than its name suggests. Official materials and
              the live ordering stack show revenue coming from signature salads, warm bowls, market plates, wraps,
              smoothies, soups, snacks, drinks, catering, and digital ordering channels. QSR reported that fully half of
              sales now come from non-salad items, which matters because it reduces dependence on a single hero SKU and
              supports daypart expansion beyond office-lunch salads. On price, the current menu supports an entry point
              below Sweetgreen-like premium positioning: build-your-own salads and wraps list at $9.99, most signature
              salads sit in the low-to-mid teens, and the pick-two combo reaches $16.99. That is still premium fast
              casual, but it leaves room for add-ons, drinks, and smoothies to raise realized check without forcing
              list-price spikes. The rewards program also nudges customers toward a $12+ threshold, effectively setting
              a floor for orders that qualify for mystery-box incentives.
