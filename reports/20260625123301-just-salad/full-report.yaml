      - number: '7.4'
        title: Partner, Delivery-Platform, and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Just Salad has built more channel control than many restaurant peers, but it is still exposed to the
              economics and rules of outside partners. Rewards enrollment, ordering, and promotional frequency are
              centered on the app and order.justsalad.com, yet the company also uses third-party ecosystems for
              off-premise reach, including reusable-container programs that run through DoorDash, Caviar, and
              DeliverZero. New York City's delivery-app rules are useful protection, but the need for fee caps and the
              city's 2026 enforcement action against HungryPanda show how quickly app economics can drift against
              restaurants when margins are thin. Platform reliance also pushes risk outside the four walls: worker
              misclassification, algorithmic pay opacity, and safety issues in app-based delivery do not sit cleanly on
              Just Salad's payroll, but they still affect customer experience, availability, and brand adjacency. The
              channel mix therefore matters twice—first for gross-margin leakage and second for control leakage. The
              investment case improves if the chain keeps shifting frequency into owned channels while using apps as a
              selective acquisition layer; it degrades if app demand becomes necessary rather than optional.
            claimRefs:
