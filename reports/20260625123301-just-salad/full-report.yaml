      - number: '7.5'
        title: People, Financial Model, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The remaining risk bucket is less about a single red flag than about whether the organization and
              financial model are robust enough for the pace of growth implied by the 2025 financing. Public sources
              speak positively about unit economics, same-store sales, and profitability, but none provide the detailed
              four-wall contribution, occupancy-cost burden, delivery mix, or corporate burn data an investor would
              normally want before endorsing aggressive national expansion. Leadership additions since 2023 help, yet
              they also underline that the management bench is still being built for the next phase. The brand's
              sustainability positioning and gamified loyalty program can deepen attachment, but each adds execution
              overhead and customer expectation risk if service consistency or claimed outcomes slip. For underwriting
              purposes, the practical kill criteria are monitorable: more severe or repeated health-code failures in
              core markets, widening labor litigation, evidence that app fees or promos are eroding order profitability,
              or a slowdown in store productivity that would make the new capital look more like catch-up spending than
              offensive investment. Absent private data, the residual exposure remains moderate-to-high.
            claimRefs:
