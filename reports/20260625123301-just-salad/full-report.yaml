      - number: '6.4'
        title: Retention, Repeat Usage, and Satisfaction
        blocks:
          - type: paragraph
            body: >-
              Repeat-usage signals are present, but hard retention metrics are absent. The strongest positive repeat-use
              proxies are built into the product itself: the iPhone app advertises one-tap reordering, the loyalty
              program gives a reward after every eligible purchase, the stamp system can keep users engaged over a year,
              and the office-catering testimonials explicitly mention using Just Salad again. Those are supported by a
              large iOS ratings base and by trade coverage that says the new loyalty architecture is designed to drive
              frequency and reduce friction. But the negative side is impossible to ignore. Google Play reviewers,
              JustUseApp summaries, PissedConsumer call logs, and Revdex complaints all point to delivery errors,
              rewards confusion, app freezing, poor service recovery, and closed-location ordering problems. Even the
              official FAQ has a troubleshooting section for delayed rewards, grayed-out rewards, and missed scans. The
              result is a mixed satisfaction picture: consumers like convenience, healthy options, and ordering tools,
              but service and app reliability still threaten repeat usage. Public NRR, GRR, churn, cohort, or
              account-retention metrics are not disclosed.
