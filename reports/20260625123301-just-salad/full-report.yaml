      - number: '8.4'
        title: Dilution risk, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The last missing piece is structure. The public record is good enough to describe the headline valuation,
              but it is not good enough to underwrite common-equity returns. The round coverage names investors, amount,
              and use of proceeds, yet it does not disclose liquidation preferences, participation rights, anti-dilution
              protections, board terms, debt covenants, or any current cash position. That gap matters because a flat
              headline value can still translate into weak realized returns if the preference stack is heavy or if fresh
              capital arrives at less friendly terms. Exit readiness is likewise mixed. Just Salad has enough scale and
              narrative coherence to look IPO-optional over time, but it does not yet present the filing-grade
              disclosure set that supports a public-market valuation argument today. The right next step is not to
              reject the company outright; it is to make the remaining diligence asks explicit and to treat them as
              gating items before using the last round as a true mark of fair value.
            claimRefs:
              - CV001
