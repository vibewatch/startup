companyProfile:
  summary: >-
    Just Salad is a founder-led fast-casual restaurant chain founded in New York City in 2006 by Nick Kenner and Rob
    Crespi. The company has expanded from an urban salad concept into a broader healthy-meals platform spanning salads,
    warm bowls, wraps, soups, smoothies, catering, and digital ordering. Its brand differentiation centers on
    sustainability features such as reusable bowls, carbon-labeled menus, and B Corp certification, plus product
    features like Salad AI in the app. Public sources show a step-up in scale after a $200 million Series C in February
    2025 at roughly a $1 billion valuation, with the chain reaching more than 100 locations and QSR reporting 110 units
    by the end of 2025.
