      - number: '5.2'
        title: Sustainability Overlay as Product and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Just Salad's most distinctive product architecture is not hidden software; it is the way sustainability
              data and reuse logistics are fused into customer-facing ordering. Carbon labels are displayed across the
              menu, website, and mobile app, the owned channels expose lower-impact Climatarian or Earth-Friendly
              discovery paths, and checkout can add Patch-backed carbon credits dynamically based on cart footprint.
              Reuse is also segmented by channel. MyBowl is an in-store program that exchanges habitual reuse for a free
              topping, while BringBack is an app-only pickup workflow in which the guest selects a returnable bowl,
              returns it to a participating store, and confirms the return in the app. Public technical documentation is
              unusually strong for this part of the product: Just Salad cites Planet FWD verification for
              cradle-to-grave carbon accounting, and both MyBowl and BringBack have external NYSP2I life-cycle
              assessments showing global-warming benefits versus disposable bowls after roughly two uses. That
              combination of consumer UX, operational handling, and third-party validation makes sustainability a real
              module of the product, not just a marketing wrapper.
