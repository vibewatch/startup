  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Just Salad should be analyzed inside limited-service eating places and, more specifically, inside the
              premium health-forward fast-casual subset rather than the whole restaurant universe. BLS draws the broad
              sector line between full-service and limited-service eating places, while retained market-data publishers
              describe fast casual as the format that combines speed with fresher ingredients, customization, and a
              higher-quality environment than conventional fast food. That boundary matters because the relevant spend
              is not every food dollar; it is the food-away-from-home occasions where a diner pays for a quick,
              customizable lunch or dinner, whether ordered in-store, through the app, through delivery, or through
              catering. On the other side of the line are home cooking and grocery spend, which solve the same need at a
              lower price, and full-service dining, which sells a different service bundle. Public healthy fast-casual
              comps reinforce the narrower boundary: CAVA and Sweetgreen both position the niche around premium,
              customizable bowls and salads rather than generic QSR fare. Just Salad adds a sustainability layer with
              reusable bowls and carbon labels, but the public evidence suggests those features augment the category
              proposition rather than redefine it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM046
