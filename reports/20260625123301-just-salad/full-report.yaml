      - number: '7.2'
        title: Regulatory, Legal, and Labor Risk
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory stack is material because Just Salad has crossed the threshold from local
              operator to chain subject to broad consumer, worker, and food-service rules. Federal menu-labeling
              requirements attach once a chain has 20 or more locations with substantially similar menu items, and Just
              Salad's 90-plus to nearly-100-unit footprint clearly puts it inside that regime. New York City health
              rules also matter more than usual because the concept sells raw and temperature-sensitive foods, posts
              calorie information, and experiments with reusable-container workflows. Labor exposure is already visible
              in public sources: attorneys are soliciting assistant managers for a misclassification and unpaid overtime
              investigation, and the Department of Labor emphasizes that exempt status turns on actual duties, not job
              titles. Governance risk is not hypothetical either, because the former CFO is suing over an allegedly
              withheld $1.2 million separation payout linked to the 2025 financing. None of these items prove a systemic
              compliance failure, but together they show that the company is operating in a denser legal zone than its
              consumer-facing brand suggests. Investors should underwrite compliance process quality, not just brand
              momentum.
            claimRefs:
              - CR008
              - CR009
