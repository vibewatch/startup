            body: >-
              The clearest hard financial fact in public is the February 2025 raise: $200 million at roughly a $1
              billion valuation. Management said the money will fund new units, menu innovation, technology, and
              customer experience. That is a sensible use-of-funds profile for a chain pushing suburban expansion and
              drive-thru format development, but it still leaves the most important underwriting questions unanswered.
              The company does not disclose current cash, burn, debt, or lease obligations, so investors cannot
              translate the raise into runway. The picture is further complicated by execution ambition: PR Newswire and
              Restaurant Dive both described 2025 as a drive-thru launch year, and QSR said four to six more drive-thrus
