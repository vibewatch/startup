  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The core valuation question is not whether Just Salad is an attractive concept; it is whether the current
              entry price leaves enough room for execution, category, and structure risk. Public reporting now supports
              a real operating story: a Wellington-led $200 million round at about a $1 billion valuation, roughly 110
              locations by the end of 2025, about $195 million of preliminary 2025 revenue, three years of roughly 22%
              store-level margins, and a drive-thru prototype that management says lifted sales by more than 30%. Those
              are strong signals for a private restaurant brand. They also help explain why the business can plausibly
              screen above slower or weaker public restaurant comps. But the evidence is still management-led rather
              than filing-grade. Investors still lack public visibility into audited financials, liquidation
              preferences, debt and lease burdens, and whether suburban/drive-thru economics will scale beyond a small
              sample. That means the right posture is disciplined interest, not unconditional enthusiasm: track the
              company, keep diligence active, and avoid treating the last round as obviously cheap.
            claimRefs:
              - CV001
