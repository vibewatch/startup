  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Growth deceleration
        - 2026 revenue or same-store sales materially miss the implied path toward ~$240M-$300M revenue
        - The current multiple no longer has a growth justification and drifts toward Sweetgreen-like discounting.
        - Do not add capital at the last-round price; re-underwrite at a lower sales multiple.
      - - Margin deterioration
        - Store-level margins fall clearly below the reported ~22% band or delivery mix worsens
        - The premium unit-economics narrative breaks and the CAVA comparison weakens.
        - Move to avoid unless a lower price or stronger structural protections offset the risk.
      - - Drive-thru / suburban rollout miss
        - The next 4-6 drive-thrus fail to replicate the reported 30%+ lift or extend payback materially
        - A key upside path for national scaling becomes less credible.
        - Cut the bull-case range and shrink position sizing assumptions.
      - - Cap-table overhang
        - Diligence reveals heavy liquidation preferences, participation, ratchets, or hidden debt
        - A flat or modestly up headline valuation may still produce poor common-equity returns.
        - Require term protection, lower price, or pass on the round.
      - - Category trade-down persists
        - Public premium fast-casual comps continue losing traffic and sub-2x outcomes remain common outside CAVA
        - The market stops rewarding premium bowl concepts for narrative alone.
        - Treat the company as a track / research-more name until the price resets or demand proves resilient.
    notes: Thresholds are framed as monitorable underwriting triggers rather than absolute predictions.
