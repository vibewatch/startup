        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Just Salad's delivered product is broader than a salad menu. The core SKU set spans chef-designed salads,
              wraps, warm bowls, soups, smoothies, and avocado toast, and the menu surface exposes calories, protein,
              and carbon-footprint data at the item level. The company's owned digital layer then turns that menu into
              several separate user journeys: a standard browse-and-order flow, a rewards flow for repeat purchasers, a
              Salad AI recommendation path for users who want help deciding, and a BringBack pickup path for users who
              want a returnable bowl. The app and web surfaces emphasize dietary filtering, one-tap reordering,
              promotions, and pickup or delivery ordering rather than deep account gamification or subscription
              mechanics. Rewards are intentionally simple: eligible $12-plus purchases unlock a reward rather than
              accumulating points, but redemption still requires app-side logic such as adding the qualifying item to
              the cart. This keeps the workflow legible for frequent diners, while also making public review complaints
              about reward friction and ordering bugs more meaningful because those defects sit directly inside the
              repeat-use loop.
