      - number: '7.3'
        title: Food Safety and Operational Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Food safety is the clearest operating risk because Just Salad's core menu is built around raw leafy
              greens, high-velocity produce prep, protein handling, and distributed store execution. Public inspection
              data do not suggest a chainwide crisis, but they do show recurring critical issues across New York
              locations in 2026, including temperature-control failures, contamination controls, sanitation misses, and
              pest-related findings. That matters because even one highly publicized outbreak or repeated local
              inspection problem could damage a health-positioned brand faster than it would a lower-expectation quick
              service concept. Upstream produce risk also remains structural: FDA and congressional materials continue
              to describe leafy greens as a recurring outbreak vector, with contamination pathways that include water,
              dust, adjacent animal operations, worker hygiene, and post-harvest handling. Just Salad's reusable-bowl
              strategy is strategically differentiating, but it adds another layer of sanitation and reverse-logistics
              discipline. The net result is a business where operations, food safety, and brand promise are tightly
              coupled. If store-level controls weaken during expansion, the downside can move from local remediation to
              network-wide reputation damage.
            claimRefs:
