      - number: '4.3'
        title: Unit Economics and Cost Structure Proxies
        blocks:
          - type: paragraph
            body: >-
              Just Salad's public unit-economics story is better than most private restaurants but still not
              audit-grade. QSR reported approximately $2 million AUVs, ~22% store-level margins for three straight
              years, and about $850,000 buildout cost with greater-than-50% cash-on-cash returns by year two. Those are
              strong claims if they hold across formats. They also fit the menu structure: a broad low-teens entrée
              ladder, beverages and smoothies that can lift check, and reusable-bowl incentives that may reduce
              packaging spend or at least strengthen retention. Labor remains a material cost driver, especially because
              the brand still preps vegetables, dressings, and proteins in-store and advertises benefits such as 401(k)
              matching, health plans, daily pay, and free meals. Waste and packaging programs help at the margin, but
              they do not replace the need to see food, labor, occupancy, and marketing lines. Public comps help frame
              the ceiling and floor: Sweetgreen's 2025 restaurant-level economics were pressured by negative same-store
              sales and only 15.2% restaurant-level margin, while CAVA posted 24.4% restaurant-level margin and $2.9
              million AUV. Just Salad's management-cited numbers place it between those peers on volume and much closer
              to CAVA on margin, but the claim remains unaudited.
