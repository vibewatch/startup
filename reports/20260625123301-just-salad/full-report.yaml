  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buying Roles
        blocks:
          - type: paragraph
            body: >-
              Just Salad's public surfaces show a hybrid customer base rather than a single archetype. The homepage
              pushes three distinct demand paths: individual ordering, office ordering, and catering, while the catering
              page is written for coordinators planning meals for groups of at least ten people and emphasizes dietary
              coverage, clear labeling, and pickup or delivery across the chain. That implies at least three economic
              actors in the same system: the self-paying everyday diner, the office coordinator or meeting planner
              placing group orders, and the employee or attendee consuming those meals. Delivery marketplaces add a
              fourth route by widening access for convenience-driven buyers who may never enter the first-party app. The
              customer story is therefore broader than 'healthy lunch consumer' alone. It includes workplace occasions,
              recurring corporate meal programs, and high-frequency digital users who respond to convenience,
              customization, and rewards. The caveat is that Just Salad still does not publish a customer-count breakout
              or revenue mix by direct consumer, office catering, and marketplace channels, so the segmentation is
              visible but not fully quantified.
