  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitute channels'
        blocks:
          - type: paragraph
            body: >-
              The nearest direct competitors to Just Salad are the other modern fast-casual chains built around
              customizable bowls, salads, and high-frequency lunch occasions: Sweetgreen, Chopt, CAVA, DIG, and Tender
              Greens. Sweetgreen and CAVA matter most on scale. Sweetgreen ended fiscal 2025 with 281 restaurants and is
              still investing in Infinite Kitchen automation, while CAVA ended 2025 with 439 restaurants in 28 states
              plus Washington, D.C. Chopt is smaller but remains an important East Coast overlap brand: ScrapeHero
              counted 103 locations in April 2026, and its parent Founders Table has leaned into suburban stores,
              digital-only formats, and drive-thru pickup lanes. DIG and Tender Greens broaden the competitive set
              because they sell scratch-cooked warm bowls and plate-based meals that address the same “healthy
              lunch/dinner” occasion without requiring a salad-first brand promise. Panera belongs in the landscape as
              an incumbent substitute rather than a direct salad specialist: its national bakery-cafe network, salads,
              soups, bowls, sandwiches, breakfast, and You Pick Two structure let it capture the same office and
              convenience demand with a much wider menu. Outside restaurant brands, delivery marketplaces,
              prepared-grocery salads, and ready-to-eat meal services matter because they solve the same need—fast,
              health-forward food—with low switching friction and high merchant choice.
            claimRefs:
              - CP007
              - CP010
              - CP012
              - CP016
              - CP020
              - CP021
