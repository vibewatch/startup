- id: TM001
  title: Market Definition — Included and Excluded Spend
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Just Salad
  rows:
  - - Broad U.S. restaurant & foodservice TAM
    - All restaurant and foodservice sales; dine-in, takeout, delivery, and catering
    - Grocery retail and home cooking
    - Households, employers, institutions
    - Useful only as top-down TAM context, not as Just Salad's practical SAM
  - - Fast-casual limited-service restaurants
    - Quick, higher-quality, customizable meals ordered at the counter, kiosk, app, or pickup shelf
    - Full-service sit-down dining with heavier service bundle
    - Individual diners; some workplace buyers
    - Core category lens used by public publishers
  - - Health-forward salad / bowl fast casual
    - Fresh salads, bowls, wraps, and similar protein-led meals with wellness positioning
    - Commodity burgers, pizza, and snack-led QSR unless clearly substitutable on the same occasion
    - Primarily self-pay diners; some office budgets
    - Closest practical SAM, but not cleanly sized in public sources
  - - Sustainability-enhanced healthy dining
    - The same meals plus reusables, carbon labels, and waste-reduction branding
    - Pure sustainability claims without convenient meal occasion
    - Consumers and office buyers who value sustainability as a tie-breaker
    - Relevant to differentiation, but not yet a separately published market category
  notes: Boundary uses BLS category definitions, retained fast-casual market reports, and Just Salad's own channel positioning; excluded spend marks substitutes or adjacencies rather than zero-competition categories.
