callouts:
- calloutType: strength
  title: Large TAM, narrow but scalable served niche
  body: 'The TAM story is easy: Just Salad competes inside a $1.55 trillion U.S. restaurant economy. The more useful insight is that health-forward fast casual is still a relatively narrow served niche inside that TAM, which is exactly why chains like CAVA and Sweetgreen can still compound units nationally without approaching saturation.'
  claimRefs:
  - CM009
  - CM014
  - CM017
- calloutType: risk
  title: Price sensitivity is a direct constraint on healthy fast casual
  body: Healthy positioning does not neutralize affordability pressure. Pew shows healthy food inflation is widely felt, BLS shows food-away-from-home inflation remains elevated, and NRA summaries show operators are still wrestling with traffic softness and thin profitability. Premium salad concepts have to win on value, not just virtue.
  claimRefs:
  - CM023
  - CM038
  - CM039
  - CM040
- calloutType: insight
  title: Digital mix expands demand but can hide margin pressure
  body: The category's adoption engine is increasingly digital, yet public-company filings show that channel mix matters as much as demand. Delivery, catering, and marketplace orders create more occasions, but they can also carry higher fees and promotions than in-store orders.
  claimRefs:
  - CM025
  - CM026
  - CM032
  - CM043
- calloutType: assumption
  title: Salad-specific SAM is still an inferred subset, not a published market
  body: Retained public sources can size restaurants, fast casual, healthy dining, and public healthy fast-casual leaders, but not a clean U.S. salad-focused fast-casual market. Any investor SAM number for Just Salad is therefore a modeling choice rather than a published industry fact.
  claimRefs:
  - CM008
  - CM011
  - CM012
  - CM017
- calloutType: recommendation
  title: Validate office exposure, repeat behavior, and channel economics before assigning a premium multiple
  body: Public evidence supports category demand, but valuation sensitivity will hinge on what portion of Just Salad's traffic depends on office density, how often users repeat digitally, and whether reusables and sustainability create measurable retention or pricing power. Those are company-specific, not category-level, diligence questions.
  claimRefs:
  - CM018
  - CM024
  - CM041
  - CM045
  - CM047
