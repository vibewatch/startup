  evidenceGaps:
  - type: missing-source
    severity: material
    topic: salad-specific-sam
    missingEvidence: A reputable public source that sizes the U.S. salad-focused fast-casual subsegment directly rather than the whole fast-casual category.
    whyItMatters: Without a clean published subsegment estimate, TAM/SAM math for Just Salad depends on analyst interpretation and public-comp proxies.
    diligencePath: Request management's internal market-sizing deck and compare it with third-party traffic panels or category scanner data for salad and bowl specialists.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: just-salad-channel-mix
    missingEvidence: Company-level data on Just Salad's same-store sales, digital mix, catering share, office-exposed locations, and repeat behavior.
    whyItMatters: Public category data cannot reveal whether Just Salad is advantaged or disadvantaged versus public comps on channel economics and office exposure.
    diligencePath: Request cohort retention, channel mix, order frequency, and store-level sales data split by office-density corridors.
    relatedQuestionRefs:
    - QM011
    - QM021
    - QM026
  - type: missing-source
    severity: material
    topic: sustainability-premium
    missingEvidence: Direct evidence that reusable bowls or carbon labels create measurable willingness to pay, visit frequency, or enterprise catering conversion.
    whyItMatters: Sustainability is visible in the brand, but public evidence does not yet prove it creates pricing power or differentiated demand.
    diligencePath: Ask for A/B tests, loyalty-retention analysis, or survey work tying reuse participation to order frequency and margin.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
