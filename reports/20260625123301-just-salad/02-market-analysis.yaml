- id: sizing-lenses
  title: 'Sizing Lenses: TAM, SAM, and Evidence-Constrained SOM'
  body: 'The broadest TAM lens is clear even if the niche is not: NRA materials project roughly $1.55 trillion of U.S. restaurant and foodservice sales in 2026 after approximately $1.4 trillion in 2025. The narrower category lens is much more debatable. Expert Market Research sizes the U.S. fast-casual market at about $48.5 billion in 2025, while Technavio says the market will add $84.5 billion from 2025 to 2029 at a 13.7% CAGR. Those two numbers are not directly contradictory so much as evidence that publishers are using different boundaries and modeling assumptions. For Just Salad, the practical SAM is the health-forward customizable subset inside fast casual, not the entire restaurant TAM. Public-company comps show the served niche is real but still modest relative to total foodservice: CAVA operated 459 restaurants as of April 2026 and Sweetgreen 285 as of March 2026. That makes a private-company SOM analysis more about corridor-by-corridor share capture in dense lunch, digital, and
    catering occasions than about headline national restaurant share. The key diligence takeaway is not that the market is small, but that public data do not isolate salad-focused fast casual cleanly enough to support a single point-estimate SAM.'
  claimRefs:
