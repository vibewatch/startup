- id: buyer-user-payer
  title: Buyer, User, and Payer Segmentation
  body: 'The core transaction is simple: the same person is usually buyer, user, and payer. But the market becomes more interesting when channels split. Pew shows that taste remains the dominant food-choice criterion, with cost next, then health, then convenience. That hierarchy helps explain why healthy fast casual can win share from QSR without ever becoming a purely health-led category. The primary retail segment is the self-pay diner who wants a fresh meal quickly; the key adoption trigger is a combination of menu customization, perceived ingredient quality, and time savings. A second segment is digital convenience demand, where app, pickup, and delivery behavior matter as much as dine-in experience. Public comps underline this: CAVA reported almost 40% digital revenue mix in Q1 2026, and Sweetgreen warns that channel mix changes are now economically material. A third segment is workplace and group occasions. Just Salad explicitly markets office ordering and catering, which means budget
    ownership can shift from an individual consumer to an office administrator or team budget. Sustainability-oriented features likely help as a brand tiebreaker for some users, but public consumer evidence still says taste, value, health, and convenience lead the purchase decision.'
