  topStrengths:
    - >-
      Founder-led brand with a clear sustainability story built around reusable bowls, carbon labels, and B Corp
      certification.
    - >-
      Publicly reported growth to roughly 110 locations and about $195 million of 2025 revenue suggests real
      concept-market fit beyond an early urban niche.
    - >-
      Management-cited unit economics (~$2 million AUVs, ~22% store-level margins, >50% year-two cash-on-cash returns)
      imply attractive four-wall performance if validated.
  topRisks:
    - >-
      The 2025 unicorn valuation implies a premium multiple despite private-company opacity on preferences, leases,
      debt, and audited earnings quality.
    - >-
      Expansion adds operating complexity across food safety, labor compliance, digital ordering, and new
      suburban/drive-thru formats.
    - >-
      Customer and channel durability are not yet proven with public retention, cohort, or owned-versus-third-party
      delivery profitability data.
  unresolvedGaps:
    - >-
      Exact lifetime capital raised, current cash balance, debt and lease obligations, and preference-stack terms remain
      undisclosed.
    - >-
      Public unit-economics claims need data-room support with mature-store AUV, contribution margin, and channel
      gross-margin bridges.
    - >-
      No audited disclosure exists for customer retention, loyalty economics, or concentration in workplace catering and
      delivery channels.
