  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Store-level contribution margins, occupancy-cost burden, cash payback, and corporate burn/runway by opening cohort.
    whyItMatters: The public risk picture cannot distinguish healthy expansion from growth that is being subsidized by the fresh capital raise.
    diligencePath: Request board materials or lender-style unit economics by market, format, and channel mix.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: labor-litigation
    missingEvidence: Actual complaint, claims inventory, settlement history, and EPLI coverage detail for assistant-manager overtime exposure.
    whyItMatters: Without primary litigation documents, investors cannot size contingent liability or decide whether the issue is isolated or systemic.
    diligencePath: Request outside-counsel memo, wage-and-hour claims log, and insurance coverage schedule.
    relatedQuestionRefs:
    - QR006
    - QR007
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: delivery-economics
    missingEvidence: Current delivery sales mix by app versus direct channel, blended fee load, refunds, and promo-adjusted contribution margin.
    whyItMatters: The company can appear to grow while still losing economic control if app orders are necessary but structurally low margin.
    diligencePath: Request channel P&L, app agreements, and monthly fee and refund dashboards for core markets.
