- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Food-safety execution
    - NYC and core-market inspection severity
    - Repeat scores in penalty range or another flagship-location Z-grade event
    - Pause new-store openings in affected market until corrective actions prove durable
  - - Labor compliance
    - Wage-hour claims status
    - Complaint filed, class certified, or multi-state demand pattern emerges
    - Re-cut underwriting for contingent liability and SG&A compliance spend
  - - Delivery-platform economics
    - Net contribution after app fees and promos
    - App orders are structurally lower-margin than direct orders with no CAC offset
    - Shift promo budget to owned channels and renegotiate app usage
  - - Expansion productivity
    - New-store payback and mature-store comps
    - Opening cohorts miss planned payback or traffic weakens after funding surge
    - Slow unit pace and re-evaluate real-estate filter
  - - Reusable-program execution
    - Return rate and sanitation exceptions
    - Return rates stagnate or sanitation incidents rise
    - Narrow program scope until operations stabilize
  - - Governance / management maturity
    - Senior turnover or unresolved executive dispute
    - Additional finance or operations departures, or litigation expands
    - Raise required return and governance diligence threshold
  notes: Kill criteria translate public risk signals into monitoring metrics that an investor can track between diligence and post-investment oversight.
