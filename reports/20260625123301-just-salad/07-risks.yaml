company:
  name: Just Salad
chapter:
  number: 7
  title: Risks
  summary: 'Just Salad''s highest-conviction risks are executional rather than existential: rapid, well-funded unit growth is colliding with food-safety variance in New York inspections, live labor and executive-dispute signals, and channel dependence on digital ordering and third-party delivery economics. Regulatory exposure is manageable but real—menu labeling, privacy, worker-classification, and local health-code compliance all scale with the chain''s footprint—so the core underwriting question is whether store growth and owned-channel engagement can outrun operating complexity.'
sections:
- id: severity-ranked-overview
  title: Severity-Ranked Risk Overview
  body: 'Just Salad now carries the risk profile of a scaled, multi-format growth chain rather than a niche New York salad concept. The 2025 capital raise valued the business at about $1 billion and explicitly funded new units, technology, and customer-experience investment, which raises the cost of execution misses. The top residual risks are food-safety variance during rapid expansion, labor and compensation disputes, delivery-channel margin leakage, and the possibility that management is adding complexity faster than it is hardening controls. The brand has real mitigants: owned digital ordering, a differentiated reuse and sustainability story, strong customer traffic, and evidence of organizational build-out. But the same facts that support the bull case also widen the operating surface area. A chain that preps produce daily, runs dense urban stores plus a new drive-thru format, pushes loyalty through its app, and pilots reusable-container logistics has more ways to stumble than a simpler
    concept. The right lens is therefore not whether risk exists, but which risks can break the expansion thesis before new-store density and digital frequency absorb them.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR007
  - CR041
  - CR044
  figureRefs:
  - FR001
- id: regulatory-legal-labor
  title: Regulatory, Legal, and Labor Risk
  body: 'The legal and regulatory stack is material because Just Salad has crossed the threshold from local operator to chain subject to broad consumer, worker, and food-service rules. Federal menu-labeling requirements attach once a chain has 20 or more locations with substantially similar menu items, and Just Salad''s 90-plus to nearly-100-unit footprint clearly puts it inside that regime. New York City health rules also matter more than usual because the concept sells raw and temperature-sensitive foods, posts calorie information, and experiments with reusable-container workflows. Labor exposure is already visible in public sources: attorneys are soliciting assistant managers for a misclassification and unpaid overtime investigation, and the Department of Labor emphasizes that exempt status turns on actual duties, not job titles. Governance risk is not hypothetical either, because the former CFO is suing over an allegedly withheld $1.2 million separation payout linked to the 2025 financing.
    None of these items prove a systemic compliance failure, but together they show that the company is operating in a denser legal zone than its consumer-facing brand suggests. Investors should underwrite compliance process quality, not just brand momentum.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR020
  - CR021
  tableRefs:
  - TR001
- id: food-safety-operations
  title: Food Safety and Operational Reliability Risk
  body: 'Food safety is the clearest operating risk because Just Salad''s core menu is built around raw leafy greens, high-velocity produce prep, protein handling, and distributed store execution. Public inspection data do not suggest a chainwide crisis, but they do show recurring critical issues across New York locations in 2026, including temperature-control failures, contamination controls, sanitation misses, and pest-related findings. That matters because even one highly publicized outbreak or repeated local inspection problem could damage a health-positioned brand faster than it would a lower-expectation quick service concept. Upstream produce risk also remains structural: FDA and congressional materials continue to describe leafy greens as a recurring outbreak vector, with contamination pathways that include water, dust, adjacent animal operations, worker hygiene, and post-harvest handling. Just Salad''s reusable-bowl strategy is strategically differentiating, but it adds another layer
    of sanitation and reverse-logistics discipline. The net result is a business where operations, food safety, and brand promise are tightly coupled. If store-level controls weaken during expansion, the downside can move from local remediation to network-wide reputation damage.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR042
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-delivery-dependency
  title: Partner, Delivery-Platform, and Dependency Risk
  body: 'Just Salad has built more channel control than many restaurant peers, but it is still exposed to the economics and rules of outside partners. Rewards enrollment, ordering, and promotional frequency are centered on the app and order.justsalad.com, yet the company also uses third-party ecosystems for off-premise reach, including reusable-container programs that run through DoorDash, Caviar, and DeliverZero. New York City''s delivery-app rules are useful protection, but the need for fee caps and the city''s 2026 enforcement action against HungryPanda show how quickly app economics can drift against restaurants when margins are thin. Platform reliance also pushes risk outside the four walls: worker misclassification, algorithmic pay opacity, and safety issues in app-based delivery do not sit cleanly on Just Salad''s payroll, but they still affect customer experience, availability, and brand adjacency. The channel mix therefore matters twice—first for gross-margin leakage and second
    for control leakage. The investment case improves if the chain keeps shifting frequency into owned channels while using apps as a selective acquisition layer; it degrades if app demand becomes necessary rather than optional.'
  claimRefs:
  - CR032
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR043
  - CR046
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-financial-kill-criteria
  title: People, Financial Model, and Kill Criteria
  body: 'The remaining risk bucket is less about a single red flag than about whether the organization and financial model are robust enough for the pace of growth implied by the 2025 financing. Public sources speak positively about unit economics, same-store sales, and profitability, but none provide the detailed four-wall contribution, occupancy-cost burden, delivery mix, or corporate burn data an investor would normally want before endorsing aggressive national expansion. Leadership additions since 2023 help, yet they also underline that the management bench is still being built for the next phase. The brand''s sustainability positioning and gamified loyalty program can deepen attachment, but each adds execution overhead and customer expectation risk if service consistency or claimed outcomes slip. For underwriting purposes, the practical kill criteria are monitorable: more severe or repeated health-code failures in core markets, widening labor litigation, evidence that app fees or promos
    are eroding order profitability, or a slowdown in store productivity that would make the new capital look more like catch-up spending than offensive investment. Absent private data, the residual exposure remains moderate-to-high.'
  claimRefs:
  - CR006
  - CR007
  - CR039
  - CR040
  - CR041
  - CR044
  - CR045
