              Just Salad 在财务上看起来比普通私营增长型餐饮概念更可信，因为公开报道已经指向真实规模：年末约 110 家门店、2025 年初步收入 $195M、约 22% 门店级利润率，以及足以支撑 $200M
              主融资的投资者胃口。菜单广度和数字功能支撑收入质量，可重复使用餐碗和碳标签大概率强化品牌亲和力，并帮助缓和包装外部性。问题不是没有故事，而是缺少经审计证明。公开层面仍没有现金余额、烧钱数字、渠道组合、毛利率、食材成本占比、人工成本占比或债务期限表。配送渠道风险通过诉讼和客户投诉可见，但未量化。用承销语言说，Just
