      - number: '3.3'
        title: 切换成本、分发力和多平台使用
        blocks:
          - type: paragraph
            body: >-
              竞争压力不只是品牌对品牌，也包括渠道对渠道。Just Salad 最强的留存资产，是应用奖励循环、办公室 /
              餐饮服务存在感、可重复使用餐碗习惯和碳标签身份。这些功能可以提高现有粉丝复购，但比大型同业和既有巨头掌握的分发优势更轻。CAVA 的门店版图和广泛人群定位给了它更强地理触达和认知。Sweetgreen
              的自动化路线图显示它仍在推高出餐效率和劳动效率。Chopt 的郊区 drive-thru 自取模式，直接攻击步入式沙拉特化门店优势较弱商圈的便利轴。Panera
              的全国咖啡馆基础和宽得多的菜单，让团体或家庭订单很容易完全绕开沙拉导向连锁。同时，DoorDash、Instacart 和 Factor
              类型服务让午餐场景天然多平台：客户可以从沙拉连锁切到杂货预制沙拉、另一商家的热碗，或即食到家选项，无需签新合同，也没有实质设置成本。这让切换成本保持低位，并使门店密度、速度和习惯养成比单纯菜单新奇更有价值。
