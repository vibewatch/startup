        title: 扩张路径和集中风险
        blocks:
          - type: paragraph
            body: >-
              扩张故事可信，特别是在办公室餐食和第一方数字频次上，但公开集中度数据很薄。BusinessWire 的 2025 年 ezCater
              数据显示，经常性职场餐食项目正变得更常见，预算更大，且雇主提供餐食后个人订单转化强；这应当利好一个已经在营销办公室点单、餐饮服务和配送的品牌。Just Salad 自己 2026
              年会员重启也给管理层一个更清晰的工具，用来拉动频次并降低对粗放折扣的依赖。不过仍有三项风险。第一，平台配送触达或许很广，但条款明确把第三方配送排除在奖励之外，因此 Just Salad
              可能增长渠道使用，却拿不到相应第一方数据或会员价值。第二，办公室餐饮证明大多匿名，难以判断需求是分散在许多小账户，还是集中在少数复购买方。第三，公司不公布客户数、留存指标、企业 logo
              名单或渠道组合经济性。这意味着主要尽调风险是不透明，而不是需求崩塌。
