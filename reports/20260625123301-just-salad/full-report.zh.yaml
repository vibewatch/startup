      - number: '1.4'
        title: 可持续、技术、里程碑和负面信号
        blocks:
          - type: paragraph
            body: >-
              对 Just Salad 来说，可持续不只是顺手贴上的品牌标签，而是公司公开差异化栈的一部分。公司称可重复使用餐碗项目可追溯到 2006 年；B Lab 显示公司自 2023 年 4
              月起获得认证；公司和第三方来源称 Just Salad 是美国第一家为菜单做碳标签的餐饮连锁。Hospitality Technology 提供了有用细节：碳标签系统由 Planet FWD
              验证，BringBack 复用流程基于 QR；后续官方发布则显示品牌用 Salad AI 延伸数字个性化叙事。这些主张重要，因为当前增长故事并不建立在厨房自动化上：NRN 和 QSR 都报道，Kenner
              仍强调手工备菜、自制酱料和无自动化的门店执行，即使公司在试验 drive-thru 形态。主要公开负面事项偏管理，而非食品安全或监管危机。CFO.com 和 QSR 报道，前 CFO Stefan Boyd 在
              2025 年提起诉讼，争议是一笔与 2025 年 2 月融资机制相关的 $1.2M 支付；Top Class Actions 报道，2026 年 6
              月有人调查受薪助理经理是否被错误归类并被拒付加班费。Violation Tracker 母公司搜索在抓取时没有记录，但 BBB 投诉表面积和两起劳工薪酬故事足以把法律与劳工尽调视为仍在发生的风险项。
