  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层和购买角色
        blocks:
          - type: paragraph
            body: >-
              Just Salad
              的公开表面显示，其客户基础是混合型，而不是单一画像。官网首页推三条不同需求路径：个人点单、办公室点单和餐饮服务；餐饮服务页面面向为至少十人团体安排餐食的协调者，强调饮食覆盖、清晰标注，以及全连锁范围内自取或配送。这意味着同一系统里至少有三类经济角色：自费日常食客、下团体订单的办公室协调者或会议策划者，以及食用这些餐食的员工或参会者。配送平台增加第四条路径，扩大对便利驱动买方的触达，其中一些人可能从不进入第一方应用。因此，客户故事不只是“健康午餐消费者”。它还包括职场场景、经常性企业餐食项目，以及响应便利、定制化和奖励的高频数字用户。限制在于，Just
              Salad 仍不公布客户数量拆分，也不按直接消费者、办公室餐饮和平台渠道披露收入组合，因此分层可见但没有完全量化。
