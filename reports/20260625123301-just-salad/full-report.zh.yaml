          type: step
        - id: n4
          label: 选择履约方式
          detail: 客人选择店内自提、配送、餐饮外烩，或在可用地区选择 BringBack 自提。
          type: decision
        - id: n5
          label: 结账
          detail: 通过支持的银行卡或数字钱包付款；app 内可选加购碳信用。
          type: step
        - id: n6
          label: 完成订单
          detail: 客人收到餐食，或之后通过参与门店的投放箱归还 BringBack 碗。
          type: step
    approximationNotes: 这条流程把多个公开用户路径压缩成一张运营图；选择履约方式之后，外卖平台配送和餐饮外烩会分叉。
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE010
      - CE019
