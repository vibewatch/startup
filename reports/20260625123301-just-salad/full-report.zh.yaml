            body: >-
              公开层面最清晰的硬财务事实，是 2025 年 2 月以约 $1B 估值融资 $200M。管理层称资金将用于新店、菜单创新、技术和客户体验。对一家推动郊区扩张和 drive-thru
              形态开发的连锁来说，这个资金用途组合合理，但仍留下最重要的承销问题。公司不披露当前现金、烧钱、债务或租赁义务，投资者无法把融资额换算成 runway。执行野心让图景更复杂：PR Newswire 和
              Restaurant Dive 都把 2025 年描述为 drive-thru 启动年；QSR 称 2026 年还计划开四到六家
              drive-thru。新形态可以拓宽触达、提升出餐效率，但也往往提高建店复杂度和固定成本暴露。前 CFO 诉讼本身不是生死问题，却提醒投资者：2024–25
              年融资周期足够复杂，已经围绕哪些事件算成功的类流动性事件引发薪酬争议。
