      - number: '4.3'
        title: 单店经济性和成本结构代理指标
        blocks:
          - type: paragraph
            body: >-
              Just Salad 的公开单店经济性故事好过多数私营餐饮公司，但仍达不到审计级。QSR 报道约 $2M AUV、连续三年约 22% 门店级利润率、约 $850,000 建店成本，以及第二年超过 50%
              的现金对现金回报。若这些数字能跨形态成立，就是很强的主张。它们也契合菜单结构：十几美元低段的宽主菜阶梯、能抬高客单的饮料和冰沙，以及可能降低包装支出或至少强化留存的可重复使用餐碗激励。劳动力仍是实质成本驱动因素，特别是品牌仍在店内备蔬菜、酱料和蛋白，并宣传
              401(k) 匹配、健康计划、每日薪资和免费餐等福利。废弃物和包装项目能在边际上帮忙，但无法替代查看食材、劳动力、租金占用和营销明细的必要性。公开可比公司帮助框定天花板和地板：Sweetgreen 2025
              年餐厅级经济性受到负同店销售和仅 15.2% 餐厅级利润率挤压；CAVA 则实现 24.4% 餐厅级利润率和 $2.9M AUV。Just Salad 管理层提到的数字让它在销售体量上位于二者之间、利润率上更接近
