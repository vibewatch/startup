  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: Just Salad 当前逻辑把创始人主导定位、可持续证明点、数字互动和资本支持的业态扩张连在一起。
    data:
      nodes:
        - id: n1
          label: 创始人主导品牌
          detail: Nick Kenner 仍是公开运营和融资声音。
