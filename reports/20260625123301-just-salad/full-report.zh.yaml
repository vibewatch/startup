  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Just Salad 这个概念是否有吸引力，而是当前入场价格是否为执行、品类和结构风险留下足够空间。公开报道已经支撑一个真实运营故事：Wellington 领投 $200M，估值约 $1B；到
              2025 年底约 110 家门店；2025 年初步收入约 $195M；门店层利润率连续三年约 22%；管理层称 drive-thru 原型让销售额提高超过
              30%。这些都是私营餐饮品牌的强信号，也解释了为什么公司筛选倍数可以高于增长更慢或更弱的上市餐饮可比公司。但证据仍由管理层主导，不是申报级披露。投资人仍看不到审计财务、清算优先权、债务和租赁负担，以及郊区 /
              drive-thru 经济性能否在小样本之外扩展。因此，正确姿态是有纪律的兴趣，不是无条件热情：跟踪公司，保持尽调，避免把上一轮融资视为显然便宜。
