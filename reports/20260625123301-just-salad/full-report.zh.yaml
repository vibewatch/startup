      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              核心交易很简单：同一个人通常同时是买方、用户和付款方。但渠道拆开后，市场就更有意思。Pew 显示，口味仍是食品选择的首要标准，其次是成本，再是健康，然后是便利。这个层级解释了为什么健康快休闲可以从 QSR
              抢份额，却不必变成一个纯健康驱动品类。首要零售客群是自费、想快速吃到新鲜一餐的食客；关键采用触发因素是菜单定制化、感知食材质量和省时间的组合。第二个分层是数字便利需求，应用、自取和配送行为与堂食体验同等重要。公开可比公司印证这一点：CAVA
              报告 2026 年 Q1 数字收入占比接近 40%，Sweetgreen 警告渠道组合变化现在已经具备经济实质性。第三个分层是职场和团体场景。Just Salad
              明确营销办公室点单和餐饮服务，这意味着预算所有权可能从个人消费者转向办公室管理员或团队预算。可持续导向功能可能帮助部分用户在品牌之间做取舍，但公开消费者证据仍显示，口味、价值、健康和便利主导购买决定。
