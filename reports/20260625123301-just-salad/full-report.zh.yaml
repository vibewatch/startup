      - number: '2.4'
        title: 增长驱动因素和采用约束
        blocks:
          - type: paragraph
            body: >-
              品类有真实结构性顺风。留存市场数据和消费者研究都指向对新鲜、健康、可定制餐食的持续胃口；联邦营养指南也继续为蔬菜前置、精益蛋白菜单架构背书。数字点单和运营技术同样强化这一业态，尤其是健康导向连锁往往更偏向忙碌城市人群和重视便利的年轻消费者。可持续还能带来额外品牌提升，特别是当它同时改善废弃物纪律时。但采用约束至少同样重要。NRA
              摘要材料显示，2025 年运营商面临客流疲软、利润很薄；BLS 和 CPI 数据确认餐厅通胀仍高。Toast 调查证据和上市公司文件显示，劳动力、食材成本和渠道经济性仍然强力挤压运营商。Sweetgreen
              特别警告，混合办公把销售从店内客流转走，外卖等店外渠道还可能因费用、促销和退款拖低利润率。结果是：市场无疑可规模化，但只有能守住高端品质主张，同时防住出餐效率、劳动生产率和价值感的运营商，才跑得出来。
