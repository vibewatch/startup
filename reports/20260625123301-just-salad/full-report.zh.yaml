  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 该判断在真实运营证据与品类疲软、披露缺口、仍有要求的私募估值之间做平衡。
    data:
      nodes:
        - id: scale
          label: 真实规模
          detail: 公开报道指向约 110 家门店和约 $195M 的 2025 年初步收入。
          tone: positive
        - id: economics
          label: 健康的单店经济性
          detail: QSR 引用约 22% 门店利润率、约 $2M AUV，以及第二年 >50% 的现金回报率。
          tone: positive
        - id: price
          label: $1B 融资轮标记
          detail: 这轮融资隐含约 5.1x 的 2025 年初步收入倍数。
          tone: warning
        - id: public-comps
          label: 上市可比公司区间
          detail: CAVA 支撑上行空间，Sweetgreen 和 Shake Shack 则锚定下行区间。
          tone: warning
        - id: structure
          label: 披露 / 优先权缺口
          detail: 公开来源没有披露 2025 年融资轮的轮次结构、债务负担或经审计盈利质量。
          tone: warning
        - id: decision
          label: 跟踪 / 偏紧
          detail: 继续跟踪，但买入前必须拿到更强的尽调证据或更好的条款。
          tone: neutral
