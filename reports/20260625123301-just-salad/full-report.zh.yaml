      - number: '7.4'
        title: 合作伙伴、配送平台与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Just Salad 比许多餐饮同行建立了更多渠道控制，但仍暴露在外部合作伙伴的经济性和规则之下。奖励注册、点单和促销频次以 app 和 order.justsalad.com
              为中心，但公司也借助第三方生态触达店外场景，包括通过 DoorDash、Caviar 和 DeliverZero 运行的可重复使用容器项目。纽约市配送 app 规则提供了有用保护，但收费上限的必要性，以及纽约市
              2026 年对 HungryPanda 的执法行动，说明在利润率很薄时，app 经济性会多快偏离餐厅利益。平台依赖还把风险推出门店四墙之外：app 配送中的劳动者错误分类、算法薪酬不透明和安全问题，并不干净地落在
              Just Salad 工资表上，但仍会影响客户体验、供给可得性和品牌邻近性。因此，渠道组合有两重意义——第一是毛利流失，第二是控制权流失。如果连锁继续把频次转入自有渠道，并把 app
              当作选择性获客层，投资论点会改善；如果 app 需求从可选变成必要，论点会恶化。
