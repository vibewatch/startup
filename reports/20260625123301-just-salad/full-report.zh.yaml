  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在当前收入基数下，假设销售倍数的小幅变化会让股权价值大幅摆动。
    data:
      items:
        - label: 按 $195M 计 2.0x
          value: 390
          detail: 深度折价 / 承压上市餐饮公司情景。
          tone: negative
        - label: 按 $195M 计 3.0x
          value: 585
          detail: 私营成长情景，但仍嵌入明显审慎折扣。
          tone: warning
        - label: 按 $195M 计 4.0x
          value: 780
          detail: 基准情景下的克制溢价：增长真实，但披露有限。
          tone: warning
        - label: 当前轮次
          value: 1000
          detail: 近似对应最后披露的估值标记。
          tone: neutral
        - label: 按 $195M 计 6.0x
          value: 1170
          detail: 需要持续跑出溢价执行力，并拿出更干净的披露。
          tone: positive
        - label: 类 CAVA 8.2x
          value: 1599
          detail: 如果 Just Salad 未来拿到一线上市公司倍数，这就是上行天花板。
          tone: positive
    approximationNotes: 所有数值都以公开披露的 2025 年初步收入为基数，按简单收入倍数桥接得出，单位为百万美元； 它们不是 DCF 输出。
