        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              公开记录里，创始人集中度异常清晰。融资公告、QSR 访谈和 NRN 报道中，Nick Kenner 仍是战略、融资、产品姿态和增长形态决策的门面；任何尽调都应把关键人依赖列为实质问题。Rob Crespi
              在留存公开记录中仍可识别为联合创始人，但在公司当前信息中并不突出，说明今天的公开叙事高度围绕 Kenner 展开。创始人以下的可见度更薄。留存来源提到一位具名可持续负责人 Alex Harden，前 CFO
              Stefan Boyd 出现在 2025 年诉讼报道中；但公司没有稳健的公开董事会页面，也没有可比后期上市公司的当前高管梯队披露。Reuters 还报道称 Kenner
              持有较大股份但不是多数股东，支持“创始人影响力强、但不明显由创始人多数控制”的判断。结论是：创始人层面画像可理解，但治理深度、接班安排和当前财务领导层仍不完整。
