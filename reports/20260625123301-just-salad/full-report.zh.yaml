      - number: '5.4'
        title: 路线图、规模化信号，以及 Just Salad 没在做什么
        blocks:
          - type: paragraph
            body: >-
              公开路线图信号指向更多数字引导、更多形态试验和更多运营规模化，但不是重自动化厨房技术。Salad AI 于 2025 年 1
              月作为应用功能推出，而不是后厨系统；管理层把它描述为留存和获客工具，帮助减少菜单决策疲劳。2025 年 2
              月融资明确把资金拨给菜单创新、先进技术计划和客户体验，强化了市场应预期更多面向消费者软件投资的判断。实体侧，NRN 报道首家 drive-thru 于 2025 年初开业，带来 30% 以上销售提升；后续
              2026 年计划再开四到六家 drive-thru，并以三分钟服务为目标。与此同时，Nick Kenner 公开表示门店没有自动化，也不希望机器人服务人类。这在战略上重要：Just Salad
              看起来通过流程控制、员工任期、营销和自有渠道 UX 改进来规模化，同时保持新鲜、手工的备餐方式。结果是一个有差异化但仍依赖劳动力的运营模型；下一批证明点应是数字可靠性和复用表现，而不是机器人 demo。
