      - number: '3.2'
        title: 能力和定价竞争
        blocks:
          - type: paragraph
            body: >-
              Just Salad 在品牌语气和可持续沟通上仍显得有差异，但核心买方比较越来越围绕广度、便利，以及一家连锁能否覆盖不止一个用餐场景。Just Salad
              营销沙拉、卷饼、热碗、汤、冰沙、餐饮服务和应用奖励，因此仍能与专业同业竞争。但 Sweetgreen 当前公开菜单已经覆盖卷饼、碗餐、蛋白盘、儿童餐、配菜和单品级 CO2e 数据；CAVA
              把精选与可定制碗餐同皮塔饼、杂货渠道蘸酱结合；Chopt 和 DIG 都强调热碗；Tender Greens 走得更远，进入盘餐式主菜。公开定价不均衡，因为只有部分连锁在抓取页面暴露稳定标价。即便如此，Just
              Salad 自己 2026 年 6 月季节新品显示，特色沙拉和 market plates 入门价为 $12.69–$12.99，汤为 $4.69；第三方菜单追踪器则把 Chopt 可见老款招牌沙拉区间放在约
              $7.49–$10.49，Tender Greens 为 $4 汤、$6 简单沙拉和 $11 大沙拉。实际含义是，Just Salad
              定价看起来接近高端快休闲同业，而不是显著低于它们；因此，持续客流更依赖品牌亲和力、数字留存和便利形态，而不是清晰标价优势。
