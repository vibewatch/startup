      - number: '6.4'
        title: 留存、复用和满意度
        blocks:
          - type: paragraph
            body: >-
              复用信号存在，但硬留存指标缺失。最强的正向复用代理指标内置在产品本身：iPhone 应用宣传一键复购；会员计划在每次合格购买后给出奖励；印章系统可以让用户在一年内保持参与；办公室餐饮推荐语明确提到会再次使用
              Just Salad。这些信号由大量 iOS 评分基础支撑，也由行业报道支撑，后者称新会员架构旨在提升频次并减少摩擦。但负面一面无法忽视。Google Play 评论者、JustUseApp
              摘要、PissedConsumer 通话记录和 Revdex 投诉都指向配送错误、奖励混乱、应用卡顿、服务补救差，以及关闭门店仍可下单的问题。即便官方 FAQ
              也有关于奖励延迟、奖励变灰和漏扫的故障排除部分。结果是一幅混合满意度图景：消费者喜欢便利、健康选项和点单工具，但服务与应用可靠性仍威胁复用。公开 NRR、GRR、流失、队列或账户留存指标均未披露。
