      - CV044
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 牛市
        - 收入达到约 $300M，门店利润率保持在 20% 或以上，drive-thru 和郊区扩张复制早期拉动，市场继续给予高端健康增长倍数。
        - 按 5.5x-6.5x 销售额计算，股权价值达到约 $1.65B-$1.95B，即稀释前约为上一轮的 1.7x-2.0x。
        - 需要 QSR 报道的经济性证明可持续，且品类需求守住。
        - 中低
      - - 基准
        - 收入升至约 $240M，利润率回归 18%-20%，由于披露仍是私营公司质量，投资人按约 4.0x-4.5x 销售额估值。
        - 股权价值集中在约 $960M-$1.08B，较本轮标题估值大致持平到小幅上涨，稀释前如此。
        - 即使执行扎实，也未必跑赢倍数纪律和私营公司折价。
        - 中
      - - 熊市
        - 收入在约 $210M 附近停滞，价值压力加重，投资人把公司重置到更接近增速较慢上市餐饮可比公司的 2.0x-2.5x 销售额。
        - 股权价值降至约 $420M-$525M，意味着严重 down round 风险；如果优先权较重，普通股结果可能更差。
        - 即使品牌没有崩盘，只要客流、外卖结构或扩张经济性不及预期，也可能发生。
        - 中
    notes: 情景估值是简单的收入倍数桥，单位为 USD millions；它们是讨论工具，不是管理层指引。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV019
      - CV026
      - CV046
      - CV047
      - CV048
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Just Salad（上一轮私募）
        - 约估值 / 初步 2025 年收入
        - ~5.1x ($1.0B / $195M) 收入倍数
        - 当前入场价格最接近的锚点；直接对应承销问题。
        - 收入和利润率数字来自管理层引用，未经审计，优先权条款未披露。
      - - CAVA
        - 市值 / TTM 收入
        - ~8.2x ($9.57B / $1.17B) 收入倍数
        - 最好的上市高端健康快休闲可比公司，因为增长、利润率和门店扩张仍然强劲。
        - 公开流动性溢价和经审计披露，使部分估值差距合理。
      - - Sweetgreen
        - 市值 / TTM 收入
        - ~1.5x ($1.05B / $0.68B) 收入倍数
        - 最接近的上市沙拉直接可比公司，也是客流走弱如何压缩倍数的最清晰警示。
        - 运营问题和扭转状态让它成为下行情景锚点，而不是目标结果。
      - - Shake Shack
        - 市值 / TTM 收入
        - ~1.6x ($2.34B / $1.49B) 收入倍数
        - 可作为一个有规模、经审计、具备全国流动性的上市餐饮品牌下限参考。
        - 汉堡主导业态和更广泛大众吸引力，使它只能作为估值下限，而不是运营孪生。
      - - Tender Greens / One Table
        - 困境结果
        - Chapter 11；贷方主导出售；流程后保留 22 家 Tender Greens 门店
        - 反向先例：健康快休闲概念在客流、外卖和债务动态断裂时，仍可能摧毁股权价值。
        - 不是持续经营倍数，业态或地域也不能直接比较。
    notes: 这组可比混合了直接、邻近和反向参照，因为没有单一上市可比公司能在菜单、规模、增长和披露画像上完全匹配 Just Salad。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive within the report's chosen valuation frame: the live Just Salad round mark, the two most relevant
        public healthy fast-casual comps, one public restaurant floor comp, and one distressed cautionary precedent as
        of 2026-06-25.
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV019
      - CV026
      - CV031
      - CV038
      - CV041
  - id: TV005
    title: 论点失效和终止触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 增长减速
        - 2026 年收入或同店销售明显偏离通往约 $240M-$300M 收入的隐含路径
        - 当前倍数不再有增长支撑，会滑向类似 Sweetgreen 的折价。
        - 不要按上一轮价格追加资本；用更低销售倍数重新承销。
      - - 利润率恶化
        - 门店层面利润率明显低于已披露的约 22% 区间，或外卖结构恶化
        - 高端单位经济性叙事破裂，CAVA 可比性削弱。
        - 除非更低价格或更强结构性保护抵消风险，否则转向规避。
      - - Drive-thru / 郊区铺开不达预期
        - 接下来 4-6 家 drive-thru 未能复制已披露的 30%+ 拉动，或显著拉长回本周期
        - 全国扩张的关键向上路径可信度下降。
        - 下调牛市情景区间，并缩小持仓规模假设。
      - - 股权结构拖累
        - 尽调发现沉重清算优先权、参与权、棘轮条款或隐藏债务
        - 标题估值持平或小幅上涨，仍可能带来糟糕的普通股回报。
        - 要求条款保护、降价，或放弃本轮。
      - - 品类降级持续
        - 上市高端快休闲可比公司继续流失客流，CAVA 之外低于 2x 的结果仍常见
        - 市场不再仅凭叙事奖励高端碗类概念。
        - 在价格重置或需求证明韧性前，把公司视为跟踪 / 继续研究标的。
    notes: 阈值写成可监控的承销触发项，而不是绝对预测。
    claimRefs:
      - CV007
      - CV009
      - CV014
      - CV020
      - CV033
      - CV034
      - CV035
      - CV036
      - CV043
      - CV048
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 优先权结构
        - 2025 年轮次的清算优先权、参与权、反稀释条款和董事会控制
        - 如果条款对投资人有利，标题估值可能高估普通股价值。
        - 向公司法律顾问索取完整 cap table、term sheet 和章程文件。
      - - 经审计 2025 年财务
        - 经审计收入、同店销售桥、餐厅层面利润率、公司 EBITDA / 现金消耗
        - 当前 $1B 估值依赖管理层引用的经济性，尚未经过公开审计。
        - 索取 FY2025 经审计财务报表和 2026 年 YTD 管理账。
      - - 资产负债表负担
        - 现金余额、债务、租赁义务和 covenant 套件
        - 跑道和固定费用强度决定扩张是在创造价值，还是会迫使 down round。
        - 索取债务明细、租赁到期表和月度现金桥。
      - - 业态经济性
        - 城市临街门店与 drive-thru / 郊区门店的逐店回报
        - 牛市情景依赖业态扩张，不只是核心城市密度。
        - 审阅单店 P&L、建设预算和开业后表现批次。
      - - 渠道结构
        - 自有数字渠道、平台外卖、团餐和 app 会员对收入和利润率的贡献
        - 依赖外卖或促销的增长，销售额看起来健康，但现金生成可能偏弱。
        - 索取按市场拆分的渠道毛利桥和促销 / 佣金明细。
    notes: 这些要求按其改变建议或有效入场倍数的直接程度排序。
    claimRefs:
      - CV008
      - CV009
      - CV043
      - CV044
      - CV045
      - CV049
