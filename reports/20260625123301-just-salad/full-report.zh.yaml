        - 中
        - 中高
        - 加厚管理梯队，并下放开店决策权
        - 审阅运营节奏和授权矩阵
      - - 一线用工模型
        - 助理经理分类和加班做法正在受审视
        - 中
        - 高
        - 更新岗位设计、排班和薪资控制
        - 审阅岗位层级职责、豁免资格和劳动索赔历史
      - - 财务 / 治理
        - 近期与前 CFO 的争议引发流程问题
        - 中
        - 中高
        - 收紧薪酬治理和董事会文档
        - 审阅奖金计划、离职模板和审计委员会监督
      - - 跨职能扩张
        - 门店快速增长、可复用项目和数字促销增加协同负荷
        - 中
        - 高
        - 在门店增长前补充一线 QA、食品安全和分析能力
        - 审阅组织架构、管理跨度和 2026 年招聘计划
