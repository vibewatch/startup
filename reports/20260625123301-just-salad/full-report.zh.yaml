        - BYO 基础款起价 $9.99；实时菜单数据显示，高端加料单独计价
        - 若加料率稳定，可作为高质量利润杠杆
        - 按加料类别披露加料率和毛利率
      - - 思慕雪、汤、小吃和饮料
        - 交叉销售和扩展时段的单品
