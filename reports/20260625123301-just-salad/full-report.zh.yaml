      - number: '8.2'
        title: 融资背景与可比公司栈
        blocks:
          - type: paragraph
            body: >-
              最有用的公开基准不是假装精确的 DCF，而是用当前餐饮可比公司搭出的销售倍数栈。Just Salad 上一轮融资隐含约 5.1x 的 2025 年初步收入。这个水平明显低于 CAVA 2026 年 6 月约
              8.2x 的市值 / 收入倍数；后者由经审计的 FY2025 收入增长 22.5%、餐厅层利润率 24.4% 以及 2026 年持续动能支撑。它又明显高于 Sweetgreen 约 1.5x
              的水平；Sweetgreen 经审计的 FY2025 收入增长放缓至 0.4%，同店销售下降 7.9%，餐厅层利润率压缩到 15.2%。它也高于 Shake Shack 约 1.6x
              的水平；后者不是直接产品可比，但作为一家有审计披露和流动性的规模化餐饮品牌，是有用的公开市场底线。在这个背景下，Just Salad
              的定价既不像困境沙拉连锁，也不像该组中最强的上市增长餐饮。市场实际上假设：相较陷入挣扎的上市同行，它值得显著的私营溢价；相较同类最佳上市运营商，它仍要接受折价。
