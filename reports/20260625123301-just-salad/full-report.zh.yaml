companyProfile:
  summary: >-
    Just Salad 是一家创始人主导的快休闲餐饮连锁，Nick Kenner 和 Rob Crespi 于 2006
    年在纽约市创立。公司已从城市沙拉概念扩展为更宽的健康餐平台，覆盖沙拉、热碗、卷饼、汤、冰沙、餐饮服务和数字点单。品牌差异化集中在可持续功能，例如可重复使用餐碗、碳标签菜单和 B Corp 认证，也包括应用内的 Salad AI
    等产品功能。公开资料显示，2025 年 2 月公司以约 $1B 估值完成 $200M Series C 后规模明显上台阶，门店数超过 100 家，QSR 报道称 2025 年底达到 110 家。
