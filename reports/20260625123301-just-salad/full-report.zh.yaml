      - number: '7.3'
        title: 食品安全与运营可靠性风险
        blocks:
          - type: paragraph
            body: >-
              食品安全是最清晰的运营风险，因为 Just Salad 的核心菜单围绕生食叶菜、高频农产品预处理、蛋白质处理和分散门店执行展开。公开检查数据没有显示全链条危机，但确实显示 2026
              年纽约门店反复出现关键问题，包括温控失效、污染控制、卫生缺漏和虫害发现。这一点重要，因为哪怕一次高度曝光的食源性事件，或反复的地方检查问题，都可能比在低预期快餐概念中更快伤害一个主打健康的品牌。上游农产品风险也仍是结构性的：FDA
              和国会材料继续把叶菜描述为反复出现的疫情载体，污染路径包括水、灰尘、邻近动物作业、员工卫生和采后处理。Just Salad
              的可重复使用碗策略在战略上有差异化，但也新增了一层卫生和逆向物流纪律。结果是，运营、食品安全和品牌承诺紧紧绑在一起。扩张中一旦门店层控制变弱，下行可能从本地整改转向全网络声誉损害。
