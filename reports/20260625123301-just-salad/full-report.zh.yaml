chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图和商业模式
        blocks:
          - type: paragraph
            body: >-
              Just Salad
              公开定位不是窄口径的“只卖沙拉”概念，而是一家试图把健康便利与可持续结合起来的快休闲餐饮连锁。当前官网首页和关于页面描述的是新鲜沙拉、碗餐、卷饼、汤和冰沙；创始人访谈与融资新闻稿则显示，管理层越来越多把公司讲成覆盖午餐和晚餐的平台，并延伸到郊区、住宅区和
              drive-thru 形态。过去 18 个月，公开门店指标持续上移：2025 年 2 月融资公告称公司拥有 90 多家门店，当前关于页面称在七个州拥有 100 多家门店，2026 年 1 月 QSR
              专访称这条连锁 2025 年底拥有 110 家门店，覆盖纽约市、Tri-State 区域、芝加哥、马萨诸塞、费城、Washington, D.C.
              和佛罗里达。这一演进支持用户给出的直觉：品牌主要仍是东海岸和中西部运营商，还不是完全全国化连锁。总部信息一致指向纽约；公司仍为私营，因此没有发布深入企业档案或 SEC 式治理披露。
