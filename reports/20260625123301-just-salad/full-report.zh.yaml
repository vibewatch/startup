      - number: '7.5'
        title: 人才、财务模型与否决条件
        blocks:
          - type: paragraph
            body: >-
              剩余风险不太像单一红旗，更像是在问：组织和财务模型是否足够结实，能承接 2025
              年融资隐含的增长速度。公开资料正面描述单店经济、同店销售和盈利能力，但没有提供投资人在支持激进全国扩张前通常会要求的详细四墙贡献、租赁成本负担、配送组合或公司层面烧钱数据。2023
              年以来补充管理层有帮助，但也说明管理梯队仍在为下一阶段搭建。品牌的可持续定位和游戏化忠诚度计划可以加深黏性，但如果服务一致性或声称成果滑坡，两者都会增加执行负担和客户预期风险。承销时，实用否决条件可以监测：核心市场更严重或反复的卫生法规失败、劳工诉讼扩大、app
              费用或促销侵蚀订单盈利的证据，或门店生产率放缓，使新资本看起来更像补课支出，而不是进攻性投资。没有私有数据时，残余暴露仍为中高。
