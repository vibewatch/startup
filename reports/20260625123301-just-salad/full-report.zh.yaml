      - number: '4.2'
        title: 数字、配送和渠道组合代理指标
        blocks:
          - type: paragraph
            body: >-
              数字点单不是 Just Salad 模型的外围功能，而是嵌在价值主张里。应用宣传营养和碳足迹信息、一键复购、自取、配送和独家优惠；BringBack
              只通过应用支持自取订单。这说明第一方数字既是交易界面，也是可持续界面。应用评分在 iOS 上方向性积极，但 Google Play 明显更弱，用户报告故障；一条近期评论称，跳转到 DoorDash 后价格高出约
              $7。管理层也告诉 QSR，公司已经学会哪些第三方配送促销和广告支出有效、哪些浪费，暗示配送渠道重要到值得优化，但不干净到可被视为无摩擦增长。Just Salad
              不披露精确数字或配送组合，因此公开可比公司很重要：Sweetgreen 2025 年数字收入占比 61.8%，CAVA 报告数字组合 37.9%。这些上市同业为数字参与度较高的沙拉概念设定了一个合理区间，但
              Just Salad 在该区间内的确切位置仍是尽调事项。
