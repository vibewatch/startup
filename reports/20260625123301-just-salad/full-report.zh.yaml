        - 官方餐饮页面活跃，并围绕办公室场景设计；未公开披露收入
        - 中——相比个人订单，可能更具复购性、客单更高
        - 披露餐饮销售占比、利润率和取消率
      - - 第三方配送
        - 同一菜单经由平台中介在外卖市场销售
        - 配送订单 × 实现净客单
        - 运营上已活跃；确切组合和佣金负担未披露
        - 中低——渠道方便，但扣除费用 / 促销后利润率可能更低
        - 提供渠道组合、佣金率和促销支出
      - - 得来速业态
        - 用同一菜单为郊区客流增加触达渠道
        - 每店得来速订单
        - 首店 2025 年在 Livingston 开业；QSR 称 2026 年预计再开 4-6 家
        - 规模化尚未验证——吞吐提升有吸引力，但资本开支和用工假设需要证明
        - 披露得来速销售组合、资本开支，以及相对街铺店的回本期
    notes: 表中混合了产品和渠道收入，因为公开披露很少按渠道拆分；在逐店 P&L 支撑前，所有品类经济性仍停留在管理层口径。
