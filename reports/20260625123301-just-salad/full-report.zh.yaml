      - number: '2.2'
        title: 规模测算视角：TAM、SAM 和证据约束下的 SOM
        blocks:
          - type: paragraph
            body: >-
              即便细分市场不清楚，最宽 TAM 视角也清楚：NRA 材料预计，美国餐厅和餐饮服务销售额在 2025 年约 $1.4T 后，2026 年将达到约 $1.55T。更窄的品类视角争议大得多。Expert Market
              Research 估算美国快休闲市场 2025 年约 $48.5B；Technavio 称该市场将在 2025–2029 年增加 $84.5B，CAGR 为
              13.7%。这两个数字并非直接矛盾，更像是在说明发布方采用了不同边界和建模假设。对 Just Salad 来说，实用 SAM 是快休闲内部的健康导向、可定制子集，不是整个餐饮
              TAM。上市公司可比对象显示，已服务细分真实存在，但相对整体餐饮服务仍不大：截至 2026 年 4 月，CAVA 经营 459 家餐厅；截至 2026 年 3 月，Sweetgreen 经营 285
              家。这让私营公司 SOM 分析更像是逐走廊拿下高密度午餐、数字和餐饮服务场景份额，而不是讨论全国餐饮头条份额。关键尽调结论不是市场小，而是公开数据无法把沙拉导向快休闲干净切出来，因此不足以支撑单点估算 SAM。
