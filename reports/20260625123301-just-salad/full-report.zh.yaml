  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头和替代渠道
        blocks:
          - type: paragraph
            body: >-
              最接近 Just Salad 的直接竞争者，是其他围绕可定制碗餐、沙拉和高频午餐场景搭建的现代快休闲连锁：Sweetgreen、Chopt、CAVA、DIG 和 Tender Greens。Sweetgreen
              和 CAVA 在规模上最重要。Sweetgreen 2025 财年末拥有 281 家餐厅，仍在投资 Infinite Kitchen 自动化；CAVA 2025 年末在 28 个州加 Washington,
              D.C. 拥有 439 家餐厅。Chopt 更小，但仍是重要的东海岸重叠品牌：ScrapeHero 统计 2026 年 4 月有 103 家门店，其母公司 Founders Table
              已转向郊区门店、纯数字形态和 drive-thru 自取车道。DIG 和 Tender Greens 扩大了竞争集，因为它们销售现做热碗和盘餐，满足同一个“健康午餐 /
              晚餐”场景，却不要求以沙拉为第一品牌承诺。Panera 应纳入格局，但它是既有替代者而非直接沙拉特化玩家：全国烘焙咖啡馆网络、沙拉、汤、碗餐、三明治、早餐和 You Pick Two
              结构，让它用更宽菜单吃到同样的办公室和便利需求。餐饮品牌之外，配送平台、杂货预制沙拉和即食餐服务也重要，因为它们以低切换摩擦和高商家选择，解决同一需求——快速、健康导向食品。
