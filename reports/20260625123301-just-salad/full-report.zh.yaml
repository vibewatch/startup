  - id: TV001
    title: 建议摘要表
    columns:
      - 决策字段
      - 当前判断
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 继续保持接触并尽调公司，但不要把上一轮当成不计价格的买入机会来追。
      - - 信心
        - 中
        - 公开证据在规模上方向性较强，但在经审计经济性和资本结构上较弱。
      - - 风险评级
        - 高
        - 执行、品类走弱、未披露的优先权 / 债务条款，都可能压缩实际回报。
      - - 估值立场
        - 偏高
        - 按初步 2025 年收入约 5.1x 计算，本轮已经假设公司能持续交出高溢价执行。
      - - 入场纪律
        - 要么拿到更强证据，要么拿到更好条款
        - 要么确认经审计利润率和股权结构干净，要么要求更低的有效入场倍数。
      - - 持有 / 退出姿态
        - 只能按多年期看
        - 当前估值还需要 2-3 年执行和披露改善，才会看起来轻松。
    notes: 这张表明确受价格影响：它把当前轮估值转换成投资动作，而不是泛泛评价公司质量。
    claimRefs:
      - CV010
      - CV041
      - CV043
      - CV045
      - CV050
  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 方向
      - 什么会改变判断
    rows:
      - - 公开报道现在支持真实规模和高速增长，而不是概念阶段故事。
        - 正向论点
        - 如果经审计 2025 年财务数据验证已披露收入和单位经济性说法，信心会增强。
      - - 门店层面利润率、AUV 和早期 drive-thru 拉动表明，模型可能迁移到郊区业态。
        - 正向论点
        - 如果新业态利润率或回本周期明显差于核心门店，向上空间判断会削弱。
      - - Just Salad 按销售额看仍低于 CAVA；如果它能复合成长为高端健康连锁，仍有一些空间。
        - 正向论点
        - 如果增长放慢，公司失去任何类似 CAVA 执行质量的说法，这个折价就不够。
      - - 上一轮价格明显高于 Sweetgreen 或 Shake Shack，但披露弱得多。
        - 反向论点
        - 发布经审计报表和优先权结构，会让溢价更容易自圆其说。
      - - 品类正面临消费者降级和价值压力，高端碗类概念可能很快降估值。
        - 反向论点
        - 到 2026 年，如果客流持续为正、同店销售强劲，并且价值架构被证明有效，这一担忧会缓和。
    notes: 这些论点针对当前 $1 billion 估值，而不是假设中的更低入场价格。
    claimRefs:
