      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: TAM 很大，已服务细分窄但可扩张
            body: >-
              TAM 故事很简单：Just Salad 在 $1.55T 的美国餐饮经济里竞争。更有用的洞察是，健康导向快休闲仍是这个 TAM 内相对狭窄的已服务细分；正因如此，CAVA 和 Sweetgreen
              这样的连锁仍能在全国复合开店而远未接近饱和。
            calloutType: strength
            claimRefs:
              - CM009
              - CM014
              - CM017
          - type: callout
            title: 价格敏感度直接约束健康快休闲
            body: 健康定位不能抵消可负担性压力。Pew 显示健康食品通胀被广泛感知，BLS 显示外出就餐通胀仍高，NRA 摘要显示运营商仍在应对客流疲软和盈利薄。高端沙拉概念必须靠价值取胜，而不只是靠美德叙事。
            calloutType: risk
            claimRefs:
              - CM023
              - CM038
              - CM039
              - CM040
          - type: callout
            title: 数字组合扩大需求，但也可能遮住利润压力
            body: 该品类的采用引擎越来越数字化，但上市公司文件显示，渠道组合与需求本身同样重要。配送、餐饮服务和平台订单创造更多场景，但它们的费用和促销成本也可能高于店内订单。
            calloutType: insight
            claimRefs:
              - CM025
              - CM026
              - CM032
              - CM043
          - type: callout
            title: 沙拉专属 SAM 仍是推断子集，不是已发布市场
            body: 留存公开来源可以测算餐厅、快休闲、健康餐饮和上市健康快休闲龙头，却无法干净测算美国沙拉导向快休闲市场。因此，任何给 Just Salad 的投资人 SAM 数字都是建模选择，而不是已发布的行业事实。
            calloutType: assumption
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM017
          - type: callout
            title: 给出高估值倍数前，先验证办公室暴露、复购行为和渠道经济性
            body: 公开证据支持品类需求，但估值敏感度取决于 Just Salad 有多少客流依赖办公室密度、用户数字复购频率如何，以及可重复使用餐具和可持续是否创造可衡量的留存或定价权。这些是公司特定尽调问题，不是品类层面问题。
            calloutType: recommendation
            claimRefs:
              - CM018
