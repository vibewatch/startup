    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Just Salad 现在已不再是一个纽约小众沙拉概念，而是一家规模化、多业态增长连锁，风险画像也随之改变。2025 年融资把公司估值推到约
              $1B，并明确投向新门店、技术和客户体验；执行失误的代价因此更高。最主要的残余风险包括：快速扩张中的食品安全波动、劳工和薪酬争议、配送渠道侵蚀毛利，以及管理层增加复杂度的速度可能快过控制体系加固。品牌也有真实缓冲：自有数字点单、差异化的重复使用与可持续叙事、强客流，以及组织扩建的证据。但支撑乐观情景的同一组事实，也把运营暴露面拉大了。一条连锁每天处理生鲜农产品，同时经营高密度城市门店和新的
              drive-thru 业态，用 app 推动忠诚度，还试点可重复使用容器物流，它比简单业态有更多失足点。因此，正确问题不是有没有风险，而是哪些风险会在新店密度和数字频次吸收之前先击穿扩张论点。
            claimRefs:
