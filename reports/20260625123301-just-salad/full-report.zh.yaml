  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 食品安全执行
        - NYC 和核心市场检查严重性
        - 处罚区间内重复评分，或另一家旗舰门店出现 Z 级事件
        - 暂停受影响市场的新店开设，直到整改动作证明可持续
      - - 劳动合规
        - 工资工时索赔状态
        - 投诉提交、集体认证，或多州索赔需求模式浮现
        - 重新测算或有负债和 SG&A 合规支出
      - - 配送平台经济性
        - 扣除平台费用和促销后的净贡献
        - 平台订单结构上比直营订单利润率更低，又没有 CAC 抵消
        - 将促销预算转向自有渠道，并重新谈判平台使用条件
      - - 扩张效率
        - 新店回本周期和成熟门店同店销售
        - 新开批次达不到计划回本，或融资潮后客流转弱
        - 放慢开店节奏，重新评估选址筛选标准
      - - 可重复使用计划执行
        - 归还率和清洁消毒异常
        - 归还率停滞，或清洁消毒事件上升
        - 缩小计划范围，直到运营稳定
      - - 治理 / 管理成熟度
        - 高管离职或悬而未决的管理层争议
        - 财务或运营高管继续离职，或诉讼扩大
        - 提高所需回报率和治理尽调门槛
    notes: 终止标准把公开风险信号转成可监控指标，投资人可以在尽调和投后监督之间持续跟踪。
