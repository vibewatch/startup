      - number: '5.3'
        title: 信任、隐私、支持和可靠性控制
        blocks:
          - type: paragraph
            body: >-
              今天公开可见的信任层，披露多、保证少。隐私方面，Just Salad 发布了相对详细的政策，覆盖设备和浏览器元数据、大致与精确位置、订单和支付历史、通信、营销偏好以及餐厅安防摄像头画面；政策还提到 SMS
              提醒、California CCPA 权利和面向儿童数据边界。应用商店标签提供第二个视角：Apple 列表称联系信息和标识符可能用于跨应用追踪；Google Play 称 Android
              应用会与第三方共享应用活动、应用性能数据和设备标识符，传输中加密数据，并支持删除请求。支持路径也明确：公开应用和奖励页面把顾客导向
              comments@justsalad.com。缺失的内容同样重要。审阅材料中没有出现公开状态页、正常运行时间历史、事故复盘档案或独立安全认证，因此尽调可以确认收集了什么数据、承诺了什么控制，却无法确认这些控制在故障下的运营质量。因此，公开
              Android 评论是活的代理指标：它们反复提到奖励失败、卡顿、通知摩擦和配送订单错误。
