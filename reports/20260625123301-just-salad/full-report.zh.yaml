        - 高
        - 核验可持续定位是否拉动复购率或企业餐饮中标，而不只是提升品牌认知
      - - 会员与奖励习惯
        - JS Rewards、免费赠品、集章式激励
        - 同行很容易跟进促销；看不到结构性合同锁定
        - 中
        - 索取奖励会员与非会员的分 cohort 留存和复购频次
      - - 密集市场里的低百家门店网络
        - 已披露 100–120+ 家门店，并有办公 / 餐饮线索
        - CAVA 有 439 家、Sweetgreen 有 281 家，投放和选址都能压过 Just Salad
        - 高
        - 按商圈绘制重叠，并比较同市场开店节奏
      - - 健康午餐专门化
        - 沙拉、卷饼、碗餐、汤、思慕雪都围绕清晰场景搭建
        - Panera、外卖平台、预制食品杂货和 Factor 用更宽渠道解决同一场景
        - 高
        - 测试 Just Salad 在混合渠道客户 cohort 中是否赢在 NPS 或频次
      - - 私营公司的敏捷性
        - 没有公开市场披露负担，季节性上新更灵活
        - 指标不透明，外部更难判断真实利润韧性或扩张能力
        - 中
        - 在 NDA 下索取分市场门店数、AUV 和门店级利润率趋势
      - - 品类顺风转向高蛋白、可定制沙拉
        - Toast 趋势数据和各连锁品牌活跃的季节性上新
        - Tender Greens 破产和上市公司风险因素说明，这个品类运营仍然难做
        - 高
        - 用客流疲软、配送费压力和郊区竞争情景测算下行
    notes: 严重度衡量的是风险可能如何影响 Just Salad 守住客流和定价权，而不是直接影响企业价值。几项风险属于整个品类，不是公司特有，因此削弱了护城河的独特性。
