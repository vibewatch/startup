      - number: '8.3'
        title: 情景逻辑与下行传导
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：如果 Just Salad 继续把收入复利推向 $300M，守住 20%+ 门店利润率，证明 drive-thru 和郊区门店可以复制早期 30%+ 销售提升信号，并继续更像小一号 CAVA
              而不是小一号 Sweetgreen，公司就有可能长进上一轮估值，甚至超过它。基准情景没那么兴奋，但仍然合理：如果收入升至 $200M
              中段，而公开可比倍数保持克制，投资人从当前标记入场可能只能获得持平到温和的结果。悲观情景不需要品牌需求崩塌。只要品类降级消费、利润率正常化、配送经济性弱于宣传，或扩张磕绊以某种组合出现，公司就会更接近
              Sweetgreen 的公开市场惩罚区，而不是 CAVA 的溢价桶。公开可比公司和失败品类同行给出的关键教训是：即便一个餐饮概念真实、受欢迎、还在增长，只要客流、价值感知或业态执行走弱，它仍可能被高估。
