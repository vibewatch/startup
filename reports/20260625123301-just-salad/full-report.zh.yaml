      - number: '7.2'
        title: 监管、法律与劳工风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管栈已经变得重要，因为 Just Salad 已经跨过地方经营者门槛，成为受广泛消费者、劳动者和餐饮服务规则约束的连锁。美国联邦菜单标识要求在连锁拥有 20 家或更多、菜单基本相似的门店时触发；Just
              Salad 90 多家到近 100
              家门店的足迹，显然已落入该制度。纽约市卫生规则也比通常更关键，因为这一业态销售生食和对温度敏感的食品，披露卡路里信息，还试验可重复使用容器流程。劳工暴露已见于公开资料：律师正招募助理经理参与错误分类和未付加班费调查，而美国劳工部强调，豁免身份取决于实际职责，不取决于职位名称。治理风险也不是假设，前
              CFO 已就一笔据称被扣留、挂钩 2025 年融资的 $1.2M
              离职付款提起诉讼。这些事项都不能证明系统性合规失败，但合在一起说明，公司所处法律区域比面向消费者的品牌形象更密。投资人要承销的是合规流程质量，不只是品牌势头。
