      - number: '8.4'
        title: 稀释风险、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最后一块缺口是结构。公开记录足以描述头部估值，但不足以承销普通股回报。融资报道列出了投资人、金额和资金用途，却没有披露清算优先权、参与权、反稀释保护、董事会条款、债务契约或任何当前现金头寸。这个缺口很重要，因为如果优先权栈很重，或新资本以更不友好的条款进入，持平的头部估值仍可能转化为疲弱的实际回报。退出准备度也参差不齐。Just
              Salad 有足够规模和叙事一致性，长期看可以保留 IPO
              选项，但目前还没有拿出支持公开市场估值论证的申报级披露组合。下一步不是直接否决公司，而是把剩余尽调问题列明，并在把上一轮作为真实公允价值标记之前，将它们设为闸门项。
