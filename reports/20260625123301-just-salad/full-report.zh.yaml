      - CE034
  - id: FE003
    title: 关键依赖图 —— 自有渠道、复用与外卖平台延伸
    type: dag
    layout: wide
    summary: Just Salad 依赖自有 app / web 层承载会员和个性化；外卖平台与复用合作伙伴则把触达延伸到核心之外。
    data:
      nodes:
        - id: d1
          label: 门店备餐 + 自提运营
          detail: 餐厅内的新鲜备餐执行、贴标和交接。
          type: dependency
        - id: d2
          label: 自有 App / Web
          detail: 承载奖励、复购、数字促销和碳感知点单的主要界面。
          type: dependency
        - id: d3
          label: 奖励规则
          detail: 资格、购物车逻辑和奖励履约绑定注册账户。
          type: dependency
        - id: d4
          label: Salad AI
          detail: 位于移动 app 内的问卷式推荐流程。
          type: dependency
        - id: d5
          label: BringBack 项目
          detail: 可退还碗自提流程和店内消毒闭环。
          type: dependency
        - id: d6
          label: DoorDash / Uber Eats
          detail: 自有会员经济性之外的外卖平台需求捕获和广告界面。
          type: dependency
        - id: d7
          label: DeliverZero / 复用合作伙伴
          detail: 为部分配送和自提订单提供可重复使用容器延伸。
          type: dependency
      edges:
        - from: d1
          to: d2
          label: 菜单、备餐和履约供给自有渠道
        - from: d2
          to: d3
          label: 奖励留在自有账户内
        - from: d2
          to: d4
          label: Salad AI 基于 app
        - from: d2
          to: d5
          label: BringBack 自提在线选择
        - from: d1
          to: d5
          label: 门店清洗并消毒归还物
        - from: d1
          to: d6
          label: 平台订单仍依赖门店执行
        - from: d6
          to: d7
          label: 可复用配送试验延伸平台工作流
    approximationNotes: 这些依赖是公开渠道和伙伴关系，不是私有系统集成或合同排他安排。
