  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 品牌
      - 公开价格信号
      - 包装 / 下单模型
      - 覆盖宽度
      - 折扣 / 未知项
      - 影响
    rows:
      - - Just Salad
        - $12.69–$12.99 季节性主菜；$4.69 季节性汤品；第三方平均单品价 $9.34
        - 厨师设计沙拉、卷饼、热碗餐、市集餐盘、冰沙；app 和办公室点单
        - 沙拉 + 碗餐 + 卷饼 + 汤 + 冰沙
        - 实际价格随市场变化；第三方菜单聚合商为估算
        - 定价是高端快休闲，不是折扣挑战者
      - - Sweetgreen
        - 抓取的官方菜单未暴露稳定标价
        - 单点沙拉、碗餐、卷饼、蛋白质餐盘、儿童餐、配菜
        - 午餐 / 晚餐覆盖较宽
        - 抓取菜单价格不透明，限制标价的一一对比
        - 竞争更多靠品牌 + 品类组合 + 自动化，而不是透明低价
      - - Chopt
        - 第三方可见区间从 $7.49 手作沙拉到 $10.49 标价高端沙拉（估算）
        - 定制沙拉、谷物沙拉、三明治 / 卷饼
        - 沙拉、谷物沙拉、小食、饮品
        - MenuXP 明确提示价格可能变化；QSR 指标早于 2026 年门店数
        - 价格可能接近 Just Salad，便利形态比标价权重更高
      - - DIG
        - 本次未保留稳定公开标价来源
        - 现做碗餐、沙拉、蛋白质、时令慰藉食物
        - 热碗餐和偏慰藉食物的菜单
        - 当前市场级定价仍是尽调缺口
        - 竞争更多靠热食场景和食材质量，而不是透明标价
      - - Tender Greens
        - $4 汤品、$6 简单沙拉、$11 大份沙拉（估算）
        - 汤、沙拉和餐盘式主菜
        - 比纯沙拉更像主菜
        - MenuXP 为估算且受地点影响
        - 入门价可低于部分高端沙拉连锁，同时扩大晚餐用途
      - - CAVA
        - 本次未保留稳定公开标价来源
        - 精选 / 定制碗餐和皮塔，加上数字化和杂货邻近触点
        - 地中海碗餐、皮塔、蘸酱 / 抹酱
        - 需要直接抓取点单页或到店检查当前标价
        - 在这里，规模和宽形态比透明公开标价更重要
      - - Panera
        - 抓取的官方菜单强调宽度，而不是稳定全国标价
        - 菜单加套餐逻辑（如 You Pick Two）和宽面包房咖啡馆形态
        - 沙拉、汤、三明治、碗餐、早餐、饮品
        - 全国价格会变化，抓取菜单文本未清晰披露
        - 更像价值 / 便利替代品，而不是高端垂直品牌
      - - 外卖 / 杂货 / 即食替代品
        - 价格随商户、加价和购物篮大小变化
        - 平台下单、杂货加购，或送餐到家订阅
        - 预制沙拉、碗餐、卷饼、即食餐
        - 费用、税费和促销会显著改变有效价格
        - 消费者比较的是总便利成本，透明的连锁对连锁定价因此没那么决定性
    notes: 各连锁价格质量不均，因为许多官方菜单是动态或按地点变化的。若只有第三方菜单追踪器披露价格，这些数字只作方向性参考，不作承销级依据。
