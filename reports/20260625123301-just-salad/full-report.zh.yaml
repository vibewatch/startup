      - number: '5.2'
        title: 可持续叠层：既是产品，也是运营架构
        blocks:
          - type: paragraph
            body: >-
              Just Salad 最有辨识度的产品架构不是隐藏软件，而是把可持续数据和复用物流融合进面向客户的点单。碳标签展示在菜单、网站和移动应用上；自有渠道提供低影响的 Climatarian 或
              Earth-Friendly 发现路径；结账时还能根据购物车足迹动态加入 Patch 支持的碳信用。复用也按渠道切分。MyBowl 是店内项目，用免费加料换取习惯性复用；BringBack
              则是仅限应用的自取流程，顾客选择可归还餐碗，把它还到参与门店，并在应用内确认归还。这部分产品的公开技术文档异常扎实：Just Salad 引用 Planet FWD 验证 cradle-to-grave
              碳核算；MyBowl 和 BringBack 都有外部 NYSP2I 生命周期评估，显示大约使用两次后，相比一次性餐碗可带来全球变暖效益。消费者
              UX、运营处理和第三方验证结合起来，让可持续成为产品的真实模块，而不只是营销外壳。
