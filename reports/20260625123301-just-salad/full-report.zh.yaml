  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和定价架构
        blocks:
          - type: paragraph
            body: >-
              Just Salad 变现的快休闲用餐场景，比公司名字暗示的更宽。官方材料和实时点单栈显示，收入来自招牌沙拉、热碗、market plates、卷饼、冰沙、汤、零食、饮料、餐饮服务和数字点单渠道。QSR
              报道称，非沙拉单品现在已贡献整整一半销售额；这很重要，因为它降低了对单一 hero SKU 的依赖，并支持把 daypart 扩展到办公室午餐沙拉之外。价格上，当前菜单支持低于 Sweetgreen
              式高端定位的入门点：自选沙拉和卷饼标价 $9.99，多数招牌沙拉位于十几美元低到中段，pick-two 组合达到
              $16.99。这仍是高端快休闲，但为加料、饮料和冰沙抬高实际客单留下空间，而不必强行跳涨标价。奖励计划也把客户推向 $12+ 门槛，实际上为有资格获得 mystery-box 激励的订单设定了地板。
