  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和替代品
        blocks:
          - type: paragraph
            body: >-
              分析 Just Salad，应放在有限服务餐饮场所里，更准确地说，是放在高端、健康导向的快休闲子集里，而不是整个餐饮宇宙。BLS
              将大行业边界划在全服务与有限服务餐饮场所之间；留存市场数据发布方则把快休闲描述为兼具速度、更新鲜食材、定制化，以及比传统快餐更高质量环境的业态。这个边界重要，因为相关支出不是每一美元食品开支，而是外出就餐场景中，食客为快速、可定制午餐或晚餐付费的那些
              occasion——无论是在店内、通过应用、通过配送还是通过餐饮服务下单。边界另一侧是家庭烹饪和杂货支出，它们以更低价格解决同一需求；以及全服务餐饮，它卖的是另一套服务组合。上市健康快休闲可比公司强化了更窄的边界：CAVA
              和 Sweetgreen 都围绕高端、可定制碗餐和沙拉来定位这一细分，而不是泛 QSR 餐品。Just Salad
              用可重复使用餐碗和碳标签增加了一层可持续属性，但公开证据显示，这些功能是在增强品类主张，而不是重新定义品类。
