      - number: '3.4'
        title: 护城河耐久性和负面证据
        blocks:
          - type: paragraph
            body: >-
              证据支持一条真实但脆弱的护城河。Just Salad 在购买点把可持续做得可见，领先大多数私营沙拉连锁：它有可重复使用餐碗项目、专门的碳标签教育，以及同业页面少见的 climatarian
              叙事。对在意气候信号的高密度城市专业人群和雇主账户，这可能有意义。但护城河脆弱，因为大型竞争者复制其中一部分的速度，可能快过 Just Salad 复制它们规模的速度。Sweetgreen 已在公开菜单发布单品级
              CO2e，CAVA 的餐厅数量加杂货存在感把触点延伸到店墙之外。品类也有负面经营证据。Tender Greens 及母公司 One Table 经历 Chapter 11
              后以更少门店走出，说明“健康快休闲”不会自动保护一个概念免受配送失误、蚕食或资本压力影响。Sweetgreen 和 CAVA
              的公开文件也明确警告投资者，在高度竞争市场里，餐厅增长可能挤压同店表现和盈利能力。由此得出的判断是：Just Salad
              的护城河最好理解为品牌定位加促成习惯的产品机制，而不是全国规模、专有分发或难复制运营那种结构性壁垒。
