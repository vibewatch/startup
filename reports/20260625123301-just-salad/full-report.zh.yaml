  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面和客户流程
        blocks:
          - type: paragraph
            body: >-
              Just Salad 交付的产品比沙拉菜单更宽。核心 SKU
              集合覆盖厨师设计沙拉、卷饼、热碗、汤、冰沙和牛油果吐司；菜单表面在单品级展示卡路里、蛋白质和碳足迹数据。公司自有数字层再把这套菜单拆成几条独立用户旅程：标准浏览和点单流程、面向复购用户的奖励流程、为需要决策帮助的用户提供
              Salad AI 推荐路径，以及给想使用可归还餐碗用户的 BringBack
              自取路径。应用和网页表面强调饮食筛选、一键复购、促销以及自取或配送点单，而不是深度账户游戏化或订阅机制。奖励体系刻意保持简单：符合条件的 $12
              以上购买解锁一个奖励，而不是累积积分；但兑换仍需要应用侧逻辑，例如把符合资格的商品加入购物车。这让高频食客容易理解流程，也让关于奖励摩擦和点单 bug 的公开评论更有意义，因为这些缺陷正卡在复用循环里。
