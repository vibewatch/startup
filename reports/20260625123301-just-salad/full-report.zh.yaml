        title: 采用轨迹和渠道牵引
        blocks:
          - type: paragraph
            body: >-
              采用证据有意义，即使很杂。2026 年初独立行业报道称 Just Salad 已跨过 100 家门店；QSR Magazine 具体称 110 家门店、几乎是 2022 年版图的两倍、连续五年同店销售增长，以及
              2025 年系统收入约 $195M。iPhone 应用也显示规模，拥有 17,000 条评分，并围绕复用建立了功能，例如一键复购、定制化和数字促销。与此同时，第三方和平台档案严重滞后：一个当前 ezCater
              档案仍称 34 家门店，Yelp 企业档案称超过 50 家。最安全的解读不是这条连锁很小，而是面向客户的渠道元数据在伙伴之间不一致。这种不一致重要，因为投资者想要一套干净的采用仪表盘。公开层面，Just
              Salad 提供的却是应用评分、门店数、配送可用性和会员发布话术拼成的补丁，而不是单一披露的客户 KPI 集合。
