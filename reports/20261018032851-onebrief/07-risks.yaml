  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-assurance-surface
      missingEvidence: Publicly reviewable accreditation, incident-history, and third-party assurance evidence for classified and partner-network deployments.
      whyItMatters: Without external assurance proof, the highest-severity security and regulatory risks remain management-described rather than independently validated.
      diligencePath: Request current ATO/authorization scope by enclave, incident log, penetration-test summaries, and customer security review findings.
      relatedQuestionRefs: [QR001, QR002, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: government-concentration
      missingEvidence: Revenue mix, contract ceilings, renewal rates, and top-program concentration across Army, ACC, and broader DoD deployments.
      whyItMatters: Concentration cannot be sized from public proof points alone, so downside to budget or procurement changes remains hard to quantify.
      diligencePath: Obtain cohort revenue by customer/program, renewal history, and the pipeline split between existing commands and new-service expansion.
      relatedQuestionRefs: [QR003]
    - type: missing-source
      severity: material
      topic: valuation-underwriting
      missingEvidence: Audited or board-level revenue, gross margin, burn, cash runway, and working-capital evidence tied to the post-step-up valuation.
      whyItMatters: Public evidence shows a fast mark-up and illiquid security structure but does not show the fundamentals needed to underwrite that price.
      diligencePath: Review the latest financial package, budget, and valuation-support materials used for the most recent financing.
      relatedQuestionRefs: [QR005]
    - type: private-evidence-only
      severity: material
