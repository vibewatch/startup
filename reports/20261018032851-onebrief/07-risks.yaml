callouts:
  - calloutType: risk
    title: Security proof is mostly management-described
    body: >-
      The retained sources document controls, classified-network deployment, and cyber-hardening intent, but they do
      not show third-party assurance artifacts or incident-history evidence. Residual security risk therefore stays
      high until diligence moves from website claims to operating proof.
    claimRefs: [CR006, CR007, CR008, CR009, CR016]
  - calloutType: risk
    title: Concentration is strategic, not incidental
    body: >-
      Onebrief's best public proof points all sit inside the same customer complex: ACC, the Army, and broader DoD
      operational planning. That is a wedge, but it also means procurement friction or budget shifts could hit growth,
      references, and perceived defensibility at the same time.
    claimRefs: [CR010, CR012, CR013, CR014]
  - calloutType: recommendation
    title: Kill criteria for the next diligence round
    body: >-
      Do not underwrite the current risk posture as merely technical. If management cannot produce contract-mix,
      renewal, incident, assurance, and unit-economics evidence that reconciles with the valuation step-up and the
      illiquid security structure, this should remain a high-risk diligence case.
    claimRefs: [CR001, CR002, CR003, CR004, CR012]
