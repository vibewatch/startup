        title: Onebrief 看起来差异化的地方
        blocks:
          - type: paragraph
            body: >-
              资料中最强的差异化证据来自原生工作流深度，而不是已公布的价格优势。Onebrief 描述了一个由实时同步作战数据、AI 工作流和可互操作 API 构成的单一工作区；ACC
              试点措辞则称，产品是在现有技术栈上增强能力，而不是替换某个单一的既有记录系统。独立评论强化了这一定位：AI Business Weekly 认为 Palantir 在数据分析和情报上最强，Anduril
              则强在自主系统和传感器，这说明这些竞争者切入的是相邻决策层，而非完全相同的规划核心任务。总体上，Onebrief 形成了差异化的“指挥工作流”姿态，但目前更多靠能力叙事定义，缺少标准化的第三方基准。
