        title: 融资历史、采购势头与里程碑质量
        blocks:
          - type: paragraph
            body: >-
              公开融资证据呈现出三个阶段：Series B 公告将累计融资额推至 $53 million；2025 年 6 月的扩展轮将估值抬至 $1.1 billion；2026 年融资则明确把公司推入 Series D
              阶段，但独立记录对其描述并不一致。当前最清晰的牵引指标是采购渠道，而不是披露的单位经济性：Onebrief 的 2026 年 9 月企业合同建立了为期五年的 Army
              下单路径，公司称第一笔任务订单在一小时内执行；更早的 ACC 项目则显示了军种级推广和集成工作。主要风险在于，公开热度跑在财务可见性前面：QuantLogix
