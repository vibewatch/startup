      - number: '8.2'
        title: 估值背景与可比信号
        blocks:
          - type: paragraph
            body: >-
              公开估值逻辑建立在平台雄心，而不是已披露经济性上。看多逻辑很直接：规划原生采用、已有记录的 API 和涉密网络部署主张，以及向模拟扩展的路径，可能把 Onebrief
              从工作流工具变成有黏性的指挥平台。反方逻辑同样直接：不利情景指向约 $19.1M 收入对应 $2.15B 估值，意味着三位数收入倍数；当前外部价格信号也已经低于最近一轮。因此，可比退出逻辑与其说取决于近期
              IPO，不如说取决于 Onebrief 能否证明采购深度和产品边界可以跑赢较慢的联邦销售周期及更大技术栈的竞争。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 情景、尽调要求与逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              情景框架应锚定可观察估值，而不是伪精确。乐观情景只有在 Army
              全域采购路径、向模拟扩展的产品，以及指挥部级采用信号转化为高质量收入、填平最近一轮与当前外部估值之间的差距时才成立。基准情景假设公司具有战略价值，但在私下尽调厘清合同持久性、利润率、烧钱和优先权之前，公开
              headline 仍然过高。悲观情景是典型的下轮融资：倍数压缩、采购转化变慢，以及更大国防软件栈设定平台天花板。关键尽调要求包括 2026 年股权结构表条款、收入桥接、cohort 留存、烧钱 / 现金跑道，以及
              2026 年 1 月融资中有多少是真正的新增资本、多少属于二级流动性。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 继续跟进，但入场纪律要低于 headline 轮次
            body: Onebrief 的战略相关性足以支持继续研究，但证明责任现在落在经济性和条款，而不是产品可信度上。审慎做法是继续研究，同时对估值保持克制。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV010
          - type: callout
            title: 最清晰的下行路径是倍数压缩，而非产品失败
            body: 公司可以是真实的，同时仍然太贵。如果指挥部级牵引没有转化为可见的经常性收入，或 2026 年融资的经济条款只在 headline 上对投资者友好，下一次估值就可能大幅重置。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV013
          - type: callout
            title: 只有 Onebrief 成为指挥平台，而不只是更好的参谋工作流，估值才站得住
            body: 溢价逻辑需要规划、AI 辅助和模拟共同形成黏性。如果更大的国防数据栈拿走更广泛的运营层，Onebrief 的天花板会下降，最近一轮估值也更难守住。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV012
              - CV013
