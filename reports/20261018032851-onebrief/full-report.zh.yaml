        title: 创始人匹配度、管理层梯队与组织规模
        blocks:
          - type: paragraph
            body: >-
              公开可核实的最强创始人信号来自 Grant Demaree 的运营背景：Business Insider 报道称，这位联合创始人兼 CEO 曾任第 101 空降师军官并毕业于 West
              Point；这与公司的军事规划逻辑吻合，也可能帮助他理解国防工作流中的用户。最清晰的管理层扩张记录来自 Series B 公告：David Wolf 任工程副总裁，Colten O'Malley 任
              CISO，Blake Lackey 任销售负责人，同时公司披露全球员工超过 100 人。这说明公司正在补齐产品、安全和市场拓展职能；但当前员工数、董事会构成以及 2025—2026
              年高管变动在指定来源中大多不公开，因此 Demaree 的关键人依赖仍然明显。
