        - 如果平台广度和合同转化变得可见，可支撑约 $2.0B-$2.3B 的区间，大致对应 2026 年 1 月融资轮。
        - 联邦销售周期仍可能延迟收入确认；平台扩张未必能转化为预算授权。
        - 需要私人尽调证明留存、利润率和合同扩张都很强，而不只是使用量增长。
      - - 基准
        - 产品和指挥层采用仍可信，但通过公开证据能看到的合同转化和经济数据仍然有限。
        - $1.4B-$1.8B 区间，锚定当前外部估值而非上一轮融资对外披露的估值。
        - 如果 ARR 质量、烧钱和优先权条款仍未披露，价格就仍跑在证据之前。
        - 符合当前证据集：公司可信，但价格支撑不完整。
      - - 悲观
        - 增长放缓、技术栈竞争加剧，且 2026 年融资条款被证明不如对外宣传所暗示的那么干净。
        - $0.9B-$1.2B 区间，由引用的二级市场成交价和下轮融资风险锚定。
        - 倍数压缩、合同规模有限，或二级交易占比较高的融资轮，均可能迫使估值重置。
        - 如果采购里程碑没有转化为可见收入，或条款清单对投资者不友好，这一情景就可能出现。
    notes: 情景区间不是模型输出，而是锚定已观察到的公开估值标记；管理层提供收入、利润率、烧钱和资本结构细节后，应以更完整的投资判断模型替代。
