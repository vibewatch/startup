          detail: ACC 的铺开包括上线培训和嵌入式商业支持，并伴随指挥机构采用。
        - id: usage
          label: 运营使用量扩张
          detail: 陆军用户称，部分规划工作时长已从约三小时降至 30 至 40 分钟。
        - id: scale
          label: 平台规模和集成
          detail: Onebrief 将新增资本投入与工程、基础设施、AI、API 集成以及支持 100,000 名同时协作者联系起来。
        - id: economics
          label: 收入和毛利润兑现
          detail: 经常性软件价值看起来合理，但定价、合同金额、利润率和支持强度仍未披露。
      edges:
        - from: prototype
          to: vehicle
          label: 原型采用转化为主合同准入
        - from: vehicle
          to: deployment
          label: 任务订单资助铺开和支持
        - from: deployment
          to: usage
          label: 运营使用创造价值证明
        - from: usage
          to: scale
          label: 更广泛的指挥机构采用推动容量需求
        - from: scale
          to: economics
          label: 经济性取决于软件杠杆相对于服务和基础设施负荷的表现
    approximationNotes: 各阶段反映公开收入机制，不代表量化的转化率或金额。
    claimRefs:
      - CI001
      - CI004
      - CI009
      - CI010
      - CI011
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开描述的技术栈从可复用运营数据出发，延伸到协作输出、AI 工作流以及部署 / 集成控制。
    data:
      layers:
        - label: 运营数据层
          detail: 持续更新的运营态势和可复用的 Cards 数据模型，是所有下游产品的锚点。
          modules:
            - label: 结构化数据模型
              detail: 为计划、订单和任务信息提供共享上下文。
            - label: Cards
              detail: 可复用的规划内容单元，所到之处都能反映相同内容。
        - label: 工作流和输出层
          detail: 实时协作界面把同一份数据转化为多种参谋产品。
          outputs:
            - label: Documents / briefs
              detail: Plans, orders, slides, and presentations built from live content.
            - label: Maps / timelines / whiteboards
              detail: Operational artifacts stay synchronized instead of fragmenting into separate files.
        - label: AI 工作流层
          detail: 具备上下文意识的 AI 可以起草、更新、总结和解释规划文档。
          modules:
            - label: 符合条令的起草
              detail: 根据计划上下文和模板生成并更新计划、命令和简报。
            - label: 智能代理工作流支持
              detail: 支持上下文规划、情报处理和行动方案开发。
        - label: 部署和互操作层
          detail: 企业控制将 Onebrief 接入任务系统和国防网络环境。
          modules:
            - label: 双向 API + 导入
              detail: 连接任务数据源，并摄取 Word、PowerPoint、Excel 和 PDF 内容。
            - label: 网络 / 控制界面
              detail: 声称覆盖机密、非机密和伙伴网络，并配有权限、审计日志和恢复架构。
        - label: 治理和保障层
          detail: 访问和审计控制被描述为生产工作流的一部分，而不是外接模块。
          modules:
            - label: 基于角色的权限
              detail: 敏感规划工作可以限制只有合适的人或群组访问。
            - label: 审计日志 + 版本控制
              detail: 每项变更都会被记录，团队可以查看历史并恢复旧版本。
        - label: 采用和任务支持层
          detail: 商业化方案包括嵌入式支持，目的是让铺开成为日常参谋工作流的一部分。
          outputs:
            - label: Templates and training
              detail: Reusable workflow templates and in-app or hands-on support reduce startup friction.
            - label: Embedded representatives
              detail: Dedicated support personnel feed field requirements back to engineers during exercises and operations.
    approximationNotes: 图示只反映指定公开证据明确描述的层级，并非内部架构示意图。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE007
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据暗示一条面向国防领域的逐步扩张路径：从工作流痛点，到试点、铺开，再到企业采购。
    data:
      items:
        - label: 旧工作流痛点
          actor: 军方参谋机构和规划人员
          stage: 问题
          tone: risk
          touchpoints:
            - 零散的邮件、幻灯片和断开的规划数据，构成采用 Onebrief 的切入口。
        - label: 嵌入式上线培训试点
          actor: ACC 和 Onebrief 实施团队
          stage: 试点
          tone: neutral
          touchpoints:
            - 嵌入式团队与用户并肩工作，迁移规划工作流并衡量效率提升。
        - label: 参谋部门铺开
          actor: ACC 参谋部门
          stage: 铺开
          tone: positive
          touchpoints:
            - 平台按指挥机构范围铺开，而不是留在单一工作中心内。
        - label: 生产环境中的指挥工作流
          actor: AMC 总部和作战联队
          stage: 生产
          tone: positive
          touchpoints:
            - 核心规划工作和会议准备进入平台，覆盖真实的指挥机构工作流。
        - label: 企业采购扩张
          actor: 陆军合同官和陆军 G4
          stage: 扩张
          tone: positive
          touchpoints:
            - 直接的陆军合同工具让首轮原型阶段后能够快速下达任务订单。
        - label: 广度验证瓶颈
          actor: 外部尽调利益相关方
          stage: 验证
          tone: risk
          touchpoints:
            - 合同限制和未披露指标，限制了对客户广度和留存的独立验证。
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU010
      - CU011
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 这是基于保留公开证据、对最高残余风险的相对快照。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
      rows:
        - label: 机密网络保障负担
          note: 深度接入任务系统后，任何安全、认证或数据处理失误的代价都会上升。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 公开描述了控制措施，但没有外部保障证据。
        - label: 受对抗环境下的网络韧性
          note: 资本已指定用于加固，但公开的事故和正常运行时间证据很少。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
        - label: AI 和集成依赖
          note: Anthropic Claude 加上任务系统集成，带来对第三方和政策的依赖。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
        - label: Battle Road 集成执行
          note: 收购扩大了能力，但路线图整合仍是管理层声明。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
        - label: 国防部采购集中度
          note: 公开牵引力最强的领域是陆军、ACC 及更广泛的国防部工作流。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
        - label: 估值、流动性和披露不透明
          note: 公开资本市场证据对价格和风险披露很明确，但对基本面的信息很弱。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: low
    approximationNotes: 热力图单元格是根据引用证据综合得出的序数判断，不是模型推导的概率。
