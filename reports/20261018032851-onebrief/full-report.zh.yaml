  summary: >-
    Onebrief 是一家国防软件公司，向政府和国防机构销售军事规划与指挥工作流平台。公开证据显示，公司已有真实采购牵引，宣称产品已部署在涉密网络，且 Army 和 Air Force
    的采用范围正在扩大；但通常用于支撑清晰私募市场投资逻辑的经营指标，仍高度不透明。
