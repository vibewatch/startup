        blocks:
          - type: paragraph
            body: >-
              建议仍是继续研究，而不是买入，因为当前投资判断的问题更多在价格纪律，而非产品是否真实。Onebrief
              在军事参谋规划中有可信切入口，公司和第三方报道都指向自下而上的用户拉动、不断扩大的采购渠道，以及从协作软件走向 AI 辅助规划和模拟的推进。但最近披露的融资轮将价格重置到约 $2.15B，此前仅几个月前还跳升至
              $1.1B；而本章保留的最新外部估值明显低于该水平。证据足以让投资者继续跟进，却不足以在拿不到私营经营和资本结构数据的情况下，把最近一轮 headline 估值纳入投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
