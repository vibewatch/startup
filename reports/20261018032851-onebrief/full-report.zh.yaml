  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              指定资料支持将 Onebrief 归入军事作战规划、任务指挥协作及相邻的指挥决策支持工作流，而不是宽泛的横向生产力或通用 AI 市场。Onebrief
              的平台和功能页面始终将其描述为一个集成工作区：实时作战数据、计划、命令、地图、时间线和简报在其中保持同步；Carahsoft
              则将产品定位为服务于在涉密和非涉密环境中协作的分布式团队的安全政府工作流环境。由此，纳入的支出范围更具体：替代碎片化
              PowerPoint、Word、邮件和文件式军事规划的规划软件、参谋协作工具、决策支持工作流、集成和部署服务。纯办公套件、独立情报分析、武器系统和通用 IT 基础设施可能与 Onebrief
              共存，但不属于直接有证据支持的采购任务，因此排除或仅获间接支持。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一笔多方参与的国防软件交易：用户是规划人员和参谋机构，买方是推动任务指挥现代化的指挥部，付款方则是采购办公室或能够支持企业级、试点部署的指挥部预算。ACC 公告展示了指挥部级采用路径：Onebrief
              赢得作战规划合同，计划推广至 ACC 全部参谋部门，并配套嵌入式上手支持，把现有工作中心迁入新工作流。2026 年 9 月的 Army
              合同又把这条路径从本地项目支持扩展到更广泛的部门级采购渠道，允许获授权的合同官在五年期 IDIQ
              下直接下单。这些披露说明，采用并不只是由功能驱动的软件决策；它还取决于集成、实施支持、安全姿态，以及让指挥部无需另建合同结构就能采购的渠道。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: 受证据约束的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              资料没有披露 Onebrief 清晰的 TAM/SAM/SOM 口径，因此测算只能依赖多个不完整视角，而不能采用一个未经拆解的市场 headline 数字。公司发布的一种口径较宽：2025
              年独角兽估值公告称，国防科技年支出超过 $140 billion，优化军事参谋工作或可释放超过 $100 billion 的 Future Years Defense Program
              节省空间。独立的品类资本信号方向相同，但测量对象不同：Business Insider 引用 McKinsey 和 PitchBook 数据，显示资本正加速流入国防科技；AI Business Weekly
              则把机会描述为每个指挥部、单位和总部都需要的任务规划软件。这些视角可用于理解估值叙事和市场兴趣，却无法单独圈定 Onebrief 的可服务市场，因为公开证据仍缺少透明定价、席位数、合同金额和客户集中度。
