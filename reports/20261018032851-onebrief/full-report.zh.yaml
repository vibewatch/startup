      - number: '3.3'
        title: 分销、切换成本与定价不透明
        blocks:
          - type: paragraph
            body: >-
              在这组证据中，分销是 Onebrief 面向买方最清晰的优势。Army 企业级 IDIQ 以及授标后一小时内执行的第一笔任务订单，展示了一条远比通用创投软件销售动作更具体的采购路径；QuantLogix
              的联邦授标数据也指向同一方向。切换成本看起来同样不低，因为 Onebrief
              一再围绕导入、互操作和对现有系统的增强来描述采用路径：这降低了初始部署摩擦，却仍会促使团队把实时规划工作迁移到共享工作区。最大的商业弱点是公开定价仍不透明：ToolMage 称 Onebrief
              采用定制企业模式，因此外部买方仅凭公开记录无法比较标价、折扣或实际合同经济性。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP010
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
