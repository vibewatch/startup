  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐意见处在产品信心与价格怀疑之间：真实的采购和工作流牵引力已经存在，但估值仍需要私人经济数据来证明。
    data:
      nodes:
        - id: traction
          label: 规划原生牵引力
          value: Real command-level user pull
          note: 自下而上的采用声明、七个指挥机构中四个的渗透，以及 ACC 部署，支持真实的切入口。
          tone: positive
        - id: moat
          label: 产品护城河路径
          value: Live data + AI + simulation ambition
          note: 该平台的主张取决于同步数据、API 集成和 Battle Road 扩张。
          tone: positive
        - id: procurement
          label: 采购拓宽
          value: ACC rollout plus Army-wide IDIQ
          note: 公开里程碑显示了更广泛的准入路径，但尚未完整披露风险投资规模的经济数据。
          tone: neutral
        - id: economics
          label: 经济证明缺口
          value: Revenue and contract visibility remain thin
          note: 不利报道和缺失的运营披露，使投资判断缺口仍然存在。
          tone: risk
        - id: pricing
          label: 外部价格压力
          value: Current external marks below last round
          note: QuantLogix 的 QL Price 和引用的二级市场成交价，都低于 2026 年 1 月的 headline 估值。
          tone: risk
        - id: decision
          label: 推荐
          value: research-more / stretched
          note: 保持参与，但在将上一轮估值视为已验证之前，要求完成私人尽调并坚持价格纪律。
          tone: warning
      edges:
        - from: traction
          to: moat
          label: 支持
        - from: moat
          to: procurement
          label: 帮助变现
        - from: procurement
          to: economics
          label: 仍需
        - from: economics
          to: pricing
          label: 流入
        - from: pricing
          to: decision
          label: 驱动
    approximationNotes: 这是一条逻辑链，而非量化模型；节点概括保留证据以及对投资判断最重要的尽调缺口。
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
      - CV010
      - CV012
