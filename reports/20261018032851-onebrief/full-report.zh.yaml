            title: 采购渠道比预算获取更清晰
            body: 最强的公开市场信号不是某个披露的 TAM 数字，而是指挥部通过 ACC 项目、经销商渠道和 Army 五年期 IDIQ 载体采购并部署 Onebrief 的能力正在扩大。
