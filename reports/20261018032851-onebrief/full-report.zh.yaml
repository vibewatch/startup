        title: 竞争框架与替代方案
        blocks:
          - type: paragraph
            body: >-
              指定资料支持一个宽泛的替代方案集合，尽管没有一套清晰的直接同业基准。Onebrief 自身材料和 Carahsoft
              合作伙伴页面把现状定义为幻灯片、文档、邮件和版本控制的反复折腾，而不是某个单一用途的规划产品。独立来源又把竞争范围向外扩展：QuantLogix 明确列出 Palantir、Anduril Lattice 和
              Govini，AI Business Weekly 则把 Lockheed Martin、Raytheon、Northrop Grumman
              等传统主承包商放进同一采购语境。实际决策因此不只是“哪个规划应用胜出”，而更接近“继续修补现有工具、围绕现有系统搭建，还是购买原生服务规划的指挥层？”
