chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与运营版图
        blocks:
          - type: paragraph
            body: >-
              Onebrief 将自己定位为服务军事参谋机构的指挥决策平台，而不是通用企业协作应用。其官网和 Carahsoft
              合作伙伴页面都将产品描述为一个实时、安全的工作流环境，把规划、协作、地图、时间线和简报统一到单一作战工作区；官方 ACC 试点公告还补充了明确的 API
              和跨网络部署细节。这足以确立其核心商业模式——向政府规划工作流销售软件并提供实施支持——但无法拼出一份关于总部、客户数、收入等基本信息的完整公开公司画像。就连总部所在地在这组证据中也尚未定论：QuantLogix
              将 Onebrief 标为总部在 Honolulu，而一篇 2026 年 1 月的行业文章称其总部在 Washington, D.C.；因此后续章节应把地点视为待核实事项，而非直接继承的事实。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
              - CO016
