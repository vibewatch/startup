evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: 2026-financing
    missingEvidence: >-
      Primary company or investor materials that reconcile the January 2026 round size, valuation, participant list, and
      any secondary-sale component.
    whyItMatters: >-
      Public sources disagree on both dollars raised and the quality of the valuation step-up, which directly affects
      underwriting.
    diligencePath: Request the latest financing deck, term sheet summary, and investor-consortium confirmation from management.
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, gross margin, burn, runway, and contract-value disclosure.
    whyItMatters: >-
      The public evidence supports demand momentum but not whether the current valuation is justified by software
      economics.
    diligencePath: Ask for CFO KPI pack, budget-to-actuals, and top-contract concentration detail.
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table
    missingEvidence: Complete executive roster, board membership, and any leadership changes after the Series B announcement.
    whyItMatters: Key-person dependence and governance quality cannot be assessed from a founder-plus-hires snapshot alone.
    diligencePath: Request an org chart, board observer list, and executive biographies updated for 2026.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map
    missingEvidence: >-
      Full cap table, board rights, investor ownership, and channel-economics detail for Carahsoft and Army procurement
      pathways.
    whyItMatters: >-
      Public names alone do not show control, economics, or concentration risk across financing and distribution
      channels.
    diligencePath: Request cap-table summary, investor rights matrix, and procurement ceiling / task-order detail.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      Publicly disclosed pricing tiers, seat counts, contract values, or budget denominators that would convert category
      proxies into a Onebrief-specific SAM or SOM.
    whyItMatters: >-
      Without monetization inputs, valuation and adoption analysis can describe market relevance but cannot quantify
      budget capture with confidence.
    diligencePath: >-
      Request customer contract exhibits, pricing sheets, or procurement award values tied to named deployments and map
      them to command-level user counts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Customer count, renewal behavior, contract expansion data, and buyer concentration by command or service.
    whyItMatters: >-
      These metrics determine whether deployment anecdotes translate into durable revenue and whether the market is
      concentrated in a few flagship commands.
    diligencePath: >-
      Obtain cohort-level pipeline, renewal, and expansion data by military branch or command, plus churn reasons where
      deployments did not expand.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: independent-roi
    missingEvidence: >-
      Independent benchmarks validating time savings, productivity gains, or workflow reduction claims in real command
      deployments.
    whyItMatters: >-
      ROI is central to the adoption story, but unverified marketing multiples can overstate how quickly budget owners
      will standardize on the platform.
    diligencePath: >-
      Ask for customer references, after-action reviews, or third-party studies comparing planning-cycle duration before
      and after deployment.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Public contract values, pricing structure, seat minima, and discounting policy for Onebrief and named rivals.
    whyItMatters: >-
      Without realized pricing, external buyers cannot tell whether Onebrief's workflow edge clears the cost of
      adoption.
    diligencePath: >-
      Request redacted pricing sheets, task-order values, and procurement history from the company or from customer RFP
      packages.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: direct-peer-benchmark
    missingEvidence: >-
      Neutral feature, deployment, and switching-cost benchmarks for Palantir, Anduril Lattice, Govini, and incumbent
      prime alternatives.
    whyItMatters: Category-level competition is visible, but vendor-by-vendor differentiation remains under-specified.
    diligencePath: >-
      Collect competitor product sheets, public procurement records, and customer comparison documents tied to the same
      planning workflow.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-adoption-depth
    missingEvidence: Renewal rates, active-user counts, multi-homing behavior, and workload share inside deployed commands.
    whyItMatters: >-
      Program wins and pilots do not prove durable lock-in if staff teams still rely heavily on other systems or revert
      to existing tools.
    diligencePath: >-
      Obtain cohort retention, seat-activation, and mission-workflow usage data from customer references or
      diligence-room exports.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited revenue, ARR definition, growth rate, and gross-margin breakdown by software versus services.
    whyItMatters: >-
      These metrics determine whether the visible defense adoption is translating into scalable, high-quality recurring
      revenue.
    diligencePath: Request board or investor reporting with monthly revenue, ARR, gross margin, and revenue-recognition notes.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
      - QI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Cash balance, monthly burn, debt facilities, and runway assumptions after the January 2026 financing.
    whyItMatters: >-
      Capital raised cannot be translated into financing risk without knowing how much cash remains and what obligations
      consume it.
    diligencePath: Request treasury, debt, and operating-plan materials showing current cash, burn, and base/upside/downside runway.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Sample contract values, billing unit, discounting policy, and software-versus-implementation revenue mix.
    whyItMatters: Pricing mechanics drive revenue quality, sales efficiency, and the credibility of margin expansion.
    diligencePath: Review customer contracts, pricing approvals, and sales compensation materials for recent Army and ACC deals.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Customer concentration, renewal cohorts, and classified versus unclassified revenue split.
    whyItMatters: >-
      A narrow defense-customer base can create budgeting, procurement, and renewal volatility that public usage
      anecdotes do not reveal.
    diligencePath: Request cohort retention, top-customer concentration, and contract-expiry schedules by command and program.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A practitioner or developer-signal proxy such as public repos, package usage, community forums, public API docs
      with activity, or integration-partner engineering evidence.
    whyItMatters: >-
      Without any public builder/community signal, it is difficult to separate product-market excitement from
      software-quality or ecosystem depth.
    diligencePath: >-
      Request a product telemetry packet covering API usage, public docs analytics, integration-partner references, and
      any community or practitioner adoption proxy the company tracks.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Independent proof of security accreditation details, certification identifiers, uptime history, incident history,
      and recovery testing results.
    whyItMatters: >-
      Defense workflow software can win pilots on mission fit but still fail enterprise underwriting if trust and
      resilience claims are only self-described.
    diligencePath: >-
      Request current accreditation packages, control mappings, external assessments, uptime reports,
      incident/postmortem history, and named customer security reviews.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: implementation-depth
    missingEvidence: >-
      Named deployment references showing implementation timelines, user counts, workflow conversion rates, and renewal
      behavior by command or program.
    whyItMatters: >-
      Public procurement signals show access and demand, but they do not prove repeatable rollout quality or durable
      product usage.
    diligencePath: >-
      Request three implementation case studies with deployment scope, go-live timeline, active-seat trend, training
      burden, and renewal/expansion outcome.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rate, contract duration, and cohort data by command or program.
    whyItMatters: >-
      Customer durability is central to underwriting whether command-level adoption becomes recurring, expanding
      revenue.
    diligencePath: Request cohort retention, renewal, and ACV data by command/program during management diligence.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: >-
      Customer count, active-seat counts, task-order volume, and disclosed contract value realization across Army and
      Air Force deployments.
    whyItMatters: >-
      Adoption depth and revenue concentration cannot be quantified without denominators behind the public deployment
      claims.
    diligencePath: >-
      Request customer roster, active-user statistics, contract-value bridge, and top-account concentration from the
      data room.
    relatedQuestionRefs:
      - QU003
      - QU006
  - type: missing-source
    severity: material
    topic: diversification
    missingEvidence: >-
      Credible independent proof of non-U.S. or non-military production customers and expansion revenue outside U.S.
      defense.
    whyItMatters: >-
      If the business is overwhelmingly concentrated in U.S. defense buyers, procurement cycles and budget shifts could
      dominate growth and retention.
    diligencePath: Ask for named allied or commercial references, production case studies, and revenue mix by customer category.
    relatedQuestionRefs:
      - QU008
  - type: access-blocked
    severity: minor
    topic: breadth-verification
    missingEvidence: Independently verifiable command names or project names behind the broadest usage claims.
    whyItMatters: Breadth-of-use claims are directionally positive but remain hard to verify without named references.
    diligencePath: >-
      Ask management for reference customers or redacted program names that can be checked against procurement or
      operator testimony.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: TU003 named-customer coverage
    missingEvidence: >-
      A fuller set of independently sourced customer references beyond the publicly named AMC, ACC, Army, and broad
      command claims.
    whyItMatters: >-
      The named customer table is representative rather than exhaustive, so it cannot prove breadth, diversification, or
      renewal quality on its own.
    diligencePath: >-
      Build a reconciled customer-reference list from procurement records, operator talks, and management-supplied
      reference calls.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
