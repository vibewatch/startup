  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Detailed cap table, liquidation preferences, participation rights, ratchets, and the split between new primary capital and secondary liquidity in the January 2026 round.
      whyItMatters: The public $2.15 billion headline can overstate common-equity entry value if preferences or secondary-heavy proceeds skew the economics for new investors.
      diligencePath: Request the full term sheet, cap table waterfall, and board-approved financing summary; reconcile new-money proceeds versus secondary shares and all seniority rights.
      relatedQuestionRefs: [QV009]
    - type: missing-source
      severity: material
      topic: operating-economics
      missingEvidence: ARR and revenue bridge, gross margin, burn, runway, net revenue retention, and top-contract concentration by year.
      whyItMatters: Public evidence shows point signals on awards, usage, and valuation marks, but it does not show whether current economics can support the last private valuation.
      diligencePath: Obtain the CFO KPI pack or board deck covering booked ARR, recognized revenue, gross margin, burn, runway, cohort retention, and contract concentration.
      relatedQuestionRefs: [QV009]
