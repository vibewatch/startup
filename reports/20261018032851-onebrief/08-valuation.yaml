artifact: valuation
slug: onebrief
runDate: 2026-10-18
company:
  name: Onebrief
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports Onebrief as one of the more credible planner-native defense
    software vendors, but not as a clean buy at the January 2026 headline mark. The strongest
    fresh price signals now sit below the last disclosed round while disclosed product and
    procurement traction remains real yet too thin to fully underwrite a $2.15B valuation without
    private diligence on revenue quality, burn, and financing terms.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation remains research-more rather than buy because the underwriting problem is
      now more about price discipline than product legitimacy. Onebrief has a credible wedge in
      military staff planning, and both company and third-party reporting point to bottom-up user
      pull, widening procurement access, and a push from collaboration software into AI-assisted
      planning and simulation. But the latest disclosed round reset the price to roughly $2.15B
      after a prior jump to $1.1B only months earlier, while the freshest external mark retained in
      this chapter sits materially below that level. That leaves enough evidence to stay engaged,
      but not enough to underwrite the round headline without access to private operating and
      capital-structure data.
    claimRefs: [CV001, CV002, CV003, CV007, CV010, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context-and-comparable-signals
    title: Valuation context and comparable signals
    body: >-
      The public valuation case rests on platform ambition rather than disclosed economics. The
      bull story is straightforward: planner-native adoption, documented API and classified-network
      deployment claims, and a simulation expansion path could turn Onebrief from a workflow tool
      into a sticky command platform. The anti-thesis is equally straightforward: the adverse case
      points to roughly $19.1M of revenue against a $2.15B mark, which implies a triple-digit
      revenue multiple, while the current external price signals already clear below the last round.
      Comparable exit logic therefore depends less on a near-term IPO and more on Onebrief proving
      that procurement depth and product scope can outrun both slower federal sales cycles and
      larger-stack competition.
    claimRefs: [CV002, CV003, CV004, CV005, CV008, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-diligence-asks-and-thesis-breaks
    title: Scenarios, diligence asks, and thesis-breaks
    body: >-
      The scenario frame should anchor on observable marks rather than false precision. The bull
      case only holds if the Army-wide procurement path, product expansion into simulation, and
      command-level adoption signals convert into revenue quality that can close the gap between the
      last round and the current external marks. The base case assumes the company is strategically
      valuable but still over-earning its public headline until private diligence clarifies contract
      durability, margins, burn, and preferences. The bear case is a classic down-round setup:
      multiple compression, slower procurement conversion, and a platform ceiling imposed by a
      larger defense software stack. The key diligence asks are the 2026 cap-table terms, revenue
      bridge, cohort retention, burn/runway, and how much of the Jan. 2026 financing was true
      primary capital versus secondary liquidity.
    claimRefs: [CV003, CV004, CV006, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Current read
      - Evidence anchor
      - Decision implication
    rows:
      - [Recommendation, research-more, "Credible product/procurement traction, but price support is incomplete.", "Stay engaged, but do not underwrite the Jan. 2026 mark without private diligence."]
      - [Confidence, medium, "Signals are directionally strong, yet operating disclosure remains thin.", "Base the call on falsifiable milestones rather than narrative."]
      - [Risk rating, high, "Procurement pacing, stack competition, and financing opacity keep downside wide.", "Require downside protection and explicit thesis-break triggers."]
      - [Valuation stance, stretched, "Last disclosed round near $2.15B versus a $1.6B external mark and a $928.8M secondary print.", "Entry discipline should anchor below the last round unless diligence materially upgrades the economics."]
      - [Likely exit path, strategic-or-late-private, "No S-1 is on file; procurement proof matters more than public-market timing.", "Underwrite to strategic relevance or later private liquidity, not near-term IPO expansion."]
    notes: >-
      Recommendation rows synthesize retained public evidence; valuation stance is anchored to the
      last disclosed round, QuantLogix's QL Price, and QuantLogix's cited secondary print rather
      than a standalone DCF.
    claimRefs: [CV002, CV003, CV004, CV010, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - Evidence
      - What would change the view
    rows:
      - ["Planner-native adoption and workflow fit create a real wedge inside military staffs.", thesis, "Bottom-up usage claims, four-of-seven command penetration, and ACC deployment support real user pull.", "Referenceable renewals, larger recurring contract values, and proof that usage growth converts into durable budget lines."]
      - ["Planning plus simulation could justify platform status if Battle Road materially deepens the product stack.", thesis, "The Battle Road acquisition and Onebrief's documented AI/API stack support a broader command-platform ambition.", "Evidence that simulation becomes exclusive, sticky, and monetized rather than adjacent functionality."]
      - ["The 2026 headline mark outruns disclosed economics.", anti-thesis, "Adverse reporting cites ~$19.1M of revenue against a $2.15B valuation, while fresher external pricing clears below the round.", "Audited revenue quality, margin, and retention data that compress the implied multiple for new money."]
      - ["A larger defense-data platform could cap upside or force valuation compression.", anti-thesis, "Implicator frames Palantir as the stack threat, and Onebrief still has to prove it owns more than the planning layer.", "Proof that Onebrief controls procurement, data flows, and simulation workflows strongly enough to resist platform bundling."]
    notes: >-
      Rows separate the thesis from the anti-thesis instead of netting them together; the intent is
      to show exactly which missing diligence items would move the call.
    claimRefs: [CV003, CV005, CV007, CV008, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Army-wide procurement path converts into larger recurring programs, Battle Road deepens the product moat, and disclosed economics close toward software-quality benchmarks.", "~$2.0B-$2.3B supportable range, roughly around the Jan. 2026 round, if platform breadth and contract conversion become visible.", "Long federal sales cycles still delay revenue recognition; platform expansion may not translate into budget authority.", "Would require private diligence to show strong retention, margin, and contract expansion, not just usage growth."]
      - [Base, "Product and command-level adoption remain credible, but contract conversion and economics stay only partly visible through public evidence.", "~$1.4B-$1.8B range, anchored closer to the current external mark than to the last round headline.", "Price remains ahead of proof if ARR quality, burn, and preference terms stay undisclosed.", "Fits the current evidence set: credible company, incomplete price support."]
      - [Bear, "Growth slows, stack competition tightens, and 2026 financing terms prove less clean than the headline suggests.", "~$0.9B-$1.2B range, anchored by the cited secondary print and down-round risk.", "Multiple compression, limited contract scale, or a secondary-heavy round can force valuation reset.", "Would become likely if procurement milestones do not convert into visible revenue or if term-sheet economics are investor-unfriendly."]
    notes: >-
      Scenario bands are not model outputs; they are anchored to observed public marks and should be
      replaced by a fuller underwriting model once management supplies revenue, margin, burn, and
      capital-structure detail.
    claimRefs: [CV003, CV004, CV005, CV006, CV010, CV011, CV013]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays between product conviction and price skepticism: real procurement and
      workflow traction exist, but the valuation still needs private economic proof.
    data:
      nodes:
        - id: traction
          label: Planner-native traction
          value: "Real command-level user pull"
          note: "Bottom-up adoption claims, four-of-seven command penetration, and ACC deployment support a real wedge."
          tone: positive
        - id: moat
          label: Product moat path
          value: "Live data + AI + simulation ambition"
          note: "The platform claim depends on synchronized data, API integrations, and the Battle Road expansion."
          tone: positive
        - id: procurement
          label: Procurement widening
          value: "ACC rollout plus Army-wide IDIQ"
          note: "Public milestones show broader access paths, but not yet fully disclosed venture-scale economics."
          tone: neutral
        - id: economics
          label: Economic proof gap
          value: "Revenue and contract visibility remain thin"
          note: "Adverse reporting and missing operating disclosure keep the underwriting gap open."
          tone: risk
        - id: pricing
          label: External price pressure
          value: "Current external marks below last round"
          note: "QuantLogix's QL Price and cited secondary print both sit below the Jan. 2026 headline mark."
          tone: risk
        - id: decision
          label: Recommendation
          value: "research-more / stretched"
          note: "Stay engaged, but require private diligence and price discipline before treating the last round as validated."
          tone: warning
      edges:
        - from: traction
          to: moat
          label: supports
        - from: moat
          to: procurement
          label: helps monetize
        - from: procurement
          to: economics
          label: still needs
        - from: economics
          to: pricing
          label: flows into
        - from: pricing
          to: decision
          label: drives
    approximationNotes: >-
      This is a logic chain rather than a quantitative model; nodes summarize retained evidence and
      the underwriting gaps that matter most to the investment call.
    claimRefs: [CV003, CV005, CV007, CV008, CV010, CV012]
callouts:
  - calloutType: recommendation
    title: Stay engaged, but keep entry discipline below the headline round
    body: >-
      Onebrief looks strategically relevant enough to merit continued work, but the burden of proof
      now sits on economics and terms rather than product plausibility. The prudent posture is
      research-more with a stretched valuation stance.
    claimRefs: [CV003, CV005, CV010]
  - calloutType: risk
    title: The cleanest downside path is multiple compression, not product failure
    body: >-
      The company can be real and still be too expensive. If command-level traction does not convert
      into visible recurring revenue or if the 2026 financing economics were investor-friendly only
      in headline form, the next mark can reset sharply.
    claimRefs: [CV003, CV004, CV013]
  - calloutType: assumption
    title: The valuation only works if Onebrief becomes a command platform, not just a better staff workflow
    body: >-
      The premium case needs planning, AI assistance, and simulation to become sticky together. If a
      larger defense-data stack captures the broader operating layer, Onebrief's ceiling falls and
      the last round becomes harder to defend.
    claimRefs: [CV008, CV012, CV013]
