  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The clearest public monetization evidence is not list pricing but procurement structure. Onebrief
              disclosed in September 2026 that Army Contracting Command awarded a decentralized, single-award enterprise
              IDIQ that lets warranted contracting officers issue task and delivery orders directly for Onebrief
              planning capabilities, moving the company from prototype subcontractor status into a direct procurement
              path. A separate Air Combat Command release shows the business also sells into rollout programs that
              include onboarding and embedded support, while Interesting Engineering reported planning tasks compressing
              from roughly three hours to 30 to 40 minutes in Army experimentation. That combination supports a revenue
              model built around enterprise defense software adoption and follow-on task orders, but not a public view
              of realized revenue per command, user, or contract.
