  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays between product conviction and price skepticism: real procurement and workflow traction
      exist, but the valuation still needs private economic proof.
    data:
      nodes:
        - id: traction
          label: Planner-native traction
          value: Real command-level user pull
          note: Bottom-up adoption claims, four-of-seven command penetration, and ACC deployment support a real wedge.
          tone: positive
        - id: moat
          label: Product moat path
          value: Live data + AI + simulation ambition
          note: The platform claim depends on synchronized data, API integrations, and the Battle Road expansion.
          tone: positive
        - id: procurement
          label: Procurement widening
          value: ACC rollout plus Army-wide IDIQ
          note: Public milestones show broader access paths, but not yet fully disclosed venture-scale economics.
          tone: neutral
        - id: economics
          label: Economic proof gap
          value: Revenue and contract visibility remain thin
          note: Adverse reporting and missing operating disclosure keep the underwriting gap open.
          tone: risk
        - id: pricing
          label: External price pressure
          value: Current external marks below last round
          note: QuantLogix's QL Price and cited secondary print both sit below the Jan. 2026 headline mark.
          tone: risk
        - id: decision
          label: Recommendation
          value: research-more / stretched
          note: >-
            Stay engaged, but require private diligence and price discipline before treating the last round as
            validated.
          tone: warning
      edges:
        - from: traction
          to: moat
          label: supports
        - from: moat
          to: procurement
          label: helps monetize
        - from: procurement
          to: economics
          label: still needs
        - from: economics
          to: pricing
          label: flows into
        - from: pricing
          to: decision
          label: drives
    approximationNotes: >-
      This is a logic chain rather than a quantitative model; nodes summarize retained evidence and the underwriting
      gaps that matter most to the investment call.
