        title: Funding history, procurement momentum, and milestone quality
        blocks:
          - type: paragraph
            body: >-
              Public funding evidence shows three distinct phases: a Series B announcement that brought cumulative
              capital to $53 million, a June 2025 extension that lifted valuation to $1.1 billion, and a 2026 round that
              clearly pushed the company into Series D territory but is not consistently described across independent
              records. The cleanest current traction marker is procurement access rather than disclosed unit economics:
              Onebrief's September 2026 enterprise contract created a five-year Army ordering pathway and the company
              says its first task order executed within an hour, while the earlier ACC program shows branch-level
              rollout and integration work. The main caution is that public enthusiasm outpaces financial visibility:
              QuantLogix's current model estimate sits below the last disclosed round, and there is still no public
              revenue, ARR, customer-count, or cap-table-term disclosure to show whether the $2B-plus mark is supported
              by fundamentals or simply by strategic-demand momentum.
