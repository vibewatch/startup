      - number: '4.2'
        title: Pricing, delivery costs, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public materials still stop short of disclosing price cards or unit economics. No reviewed source
              publishes seat pricing, command-level minimums, task-order dollar values, discounts, or realized expansion
              rates. Instead, the evidence shows the likely cost drivers: Onebrief says new capital is being used to
              expand engineering, infrastructure, AI, and support for 100,000 simultaneous collaborators, while product
              and ACC deployment pages describe bidirectional API work, document imports, embedded onboarding, and
              support across classified and unclassified environments. Those details suggest a business that mixes
              recurring software value with non-trivial implementation and support load, which means gross-margin
              potential depends on software scale outrunning services intensity and infrastructure spend, but public
              evidence is insufficient to measure that path.
