      - number: '3.3'
        title: Distribution, switching costs, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Distribution is where Onebrief has the clearest buyer-facing edge in this evidence set. The Army
              enterprise IDIQ and the first task order executed within an hour of award show a procurement path that is
              much more concrete than a generic venture software sales motion, and QuantLogix's federal-awards data
              points in the same direction. Switching costs also look meaningful because Onebrief repeatedly frames
              adoption around imports, interoperability, and augmentation of existing systems, which lowers initial
              deployment friction while still encouraging teams to move live planning work into its shared workspace.
              The biggest commercial weakness is that public pricing remains opaque: ToolMage says Onebrief runs a
              custom enterprise model, so outside buyers cannot benchmark list price, discounting, or realized contract
              economics from the public record alone.
