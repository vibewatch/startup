  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a defense-enterprise software revenue path that runs from prototypes and pilots into direct
      task-order procurement, then into broader deployment and usage expansion.
    data:
      nodes:
        - id: prototype
          label: NGC2 prototyping and pilots
          detail: Earlier work included subcontractor support for NGC2 prototyping and operational experimentation.
        - id: vehicle
          label: Direct procurement vehicle
          detail: >-
            The Army enterprise IDIQ gives warranted contracting officers a direct task-order path for Onebrief
            capabilities.
        - id: deployment
          label: Deployment and onboarding
          detail: ACC rollout includes onboarding and embedded commercial support alongside command adoption.
        - id: usage
          label: Operational usage expansion
          detail: Army users reported some planning work falling from roughly three hours to 30 to 40 minutes.
        - id: scale
          label: Platform scale and integrations
          detail: >-
            Onebrief ties new capital to engineering, infrastructure, AI, API integrations, and support for 100,000
            simultaneous collaborators.
        - id: economics
          label: Revenue and gross-profit realization
          detail: >-
            Recurring software value appears plausible, but pricing, contract values, margin, and support intensity
            remain undisclosed.
      edges:
        - from: prototype
          to: vehicle
          label: Prototype adoption becomes prime-contract access
        - from: vehicle
          to: deployment
          label: Task orders fund rollout and support
        - from: deployment
          to: usage
          label: Operational use creates value proof
        - from: usage
          to: scale
          label: Broader command adoption drives capacity needs
        - from: scale
          to: economics
          label: Economics depend on software leverage versus service and infrastructure load
    approximationNotes: Flow stages reflect public revenue mechanics, not quantified conversion rates or dollar amounts.
    claimRefs:
      - CI001
      - CI004
      - CI009
      - CI010
      - CI011
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly described stack runs from reusable operational data through collaboration outputs, AI workflows, and
      deployment/integration controls.
    data:
      layers:
        - label: Operational data layer
          detail: Continuously updated operational picture and reusable Cards data model anchor every downstream product.
          modules:
            - label: Structured data model
              detail: Shared context for plans, orders, and mission information.
            - label: Cards
              detail: Reusable units of planning content reflected everywhere they are used.
        - label: Workflow and output layer
          detail: Live collaboration surfaces turn the same data into multiple staff products.
          outputs:
            - label: Documents / briefs
              detail: Plans, orders, slides, and presentations built from live content.
            - label: Maps / timelines / whiteboards
              detail: Operational artifacts stay synchronized instead of fragmenting into separate files.
        - label: AI workflow layer
          detail: Context-aware AI drafts, updates, summarizes, and explains planning artifacts.
          modules:
            - label: Doctrine-aware drafting
              detail: Generates and updates plans, orders, and briefs from plan context and templates.
            - label: Agentic workflow support
              detail: Supports contextual planning, intelligence processing, and course-of-action development.
        - label: Deployment and interoperability layer
          detail: Enterprise controls connect Onebrief to mission systems and defense network environments.
          modules:
            - label: Bidirectional API + imports
              detail: Connects mission data sources and ingests Word, PowerPoint, Excel, and PDF content.
            - label: Network / control surface
              detail: >-
                Claims span classified, unclassified, and partner networks with permissions, audit logging, and recovery
                architecture.
        - label: Governance and assurance layer
          detail: Access and audit controls are described as part of the production workflow rather than external bolt-ons.
          modules:
            - label: Role-based permissions
              detail: Access can be restricted to the right people or groups across sensitive planning work.
            - label: Audit logging + version control
              detail: Every change is tracked so teams can review history and restore prior versions.
        - label: Adoption and mission-support layer
          detail: The go-to-market package includes embedded support intended to make rollout part of daily staff workflow.
          outputs:
            - label: Templates and training
              detail: Reusable workflow templates and in-app or hands-on support reduce startup friction.
            - label: Embedded representatives
              detail: Dedicated support personnel feed field requirements back to engineers during exercises and operations.
    approximationNotes: >-
      Diagram reflects only the layers explicitly described in assigned public evidence; it is not an internal
      architecture schematic.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE007
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence implies a defense-specific land-and-expand motion from workflow pain to pilot, rollout, and
      enterprise procurement.
    data:
      items:
        - label: Legacy workflow pain
          actor: Military staffs and planners
          stage: Problem
          tone: risk
          touchpoints:
            - Fragmented emails, slides, and disconnected planning data create the entry wedge for adoption.
        - label: Pilot with embedded onboarding
          actor: ACC and Onebrief implementation teams
          stage: Pilot
          tone: neutral
          touchpoints:
            - Embedded teams work alongside users to migrate planning workflows and benchmark efficiencies.
        - label: Directorate rollout
          actor: ACC staff directorates
          stage: Rollout
          tone: positive
          touchpoints:
            - The platform is rolled out command-wide rather than left in a single work center.
        - label: Production command workflow
          actor: AMC headquarters and operational wings
          stage: Production
          tone: positive
          touchpoints:
            - Core planning work and conference preparation move into the platform across a real command workflow.
        - label: Enterprise procurement expansion
          actor: Army contracting officers and Army G4
          stage: Expansion
          tone: positive
          touchpoints:
            - A direct Army contract vehicle enables rapid task orders after an initial prototype phase.
        - label: Breadth verification bottleneck
