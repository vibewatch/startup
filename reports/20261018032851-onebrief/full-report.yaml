        - Multiple compression, limited contract scale, or a secondary-heavy round can force valuation reset.
        - >-
          Would become likely if procurement milestones do not convert into visible revenue or if term-sheet economics
          are investor-unfriendly.
    notes: >-
      Scenario bands are not model outputs; they are anchored to observed public marks and should be replaced by a
      fuller underwriting model once management supplies revenue, margin, burn, and capital-structure detail.
    claimRefs:
      - CV003
      - CV004
