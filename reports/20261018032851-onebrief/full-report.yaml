      - number: '3.4'
        title: Durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The moat case is credible but incomplete. Onebrief's planner-native feature set, classified-network
              posture, and direct contract vehicle help, and the company has raised enough capital to keep widening the
              product surface. At the same time, adjacent platforms, incumbent primes, and internal-build paths all
              remain viable ways to contest the account. The assigned pool offers category-level evidence that those
              competitors exist, but not enough neutral benchmarking to prove that Onebrief wins on realized cost,
              deployment speed, or long-run retention. That means the durability question currently rests on program
              momentum and workflow fit more than on audited proof that rivals cannot match the product or
              route-to-market.
