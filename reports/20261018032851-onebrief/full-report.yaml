              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
      - number: '6.3'
        title: Expansion logic is visible; retention and concentration economics are not
        blocks:
          - type: paragraph
            body: >-
              The public expansion motion is a land-and-expand pattern inside defense: pilot and onboarding activity at
              ACC, HQ-to-wing broadening at AMC, and a new enterprise contract vehicle with the Army. That is meaningful
              commercial progress, but it is not the same as durable recurring revenue. Business Insider reported that
              CEO Grant Demareee said “Almost all of the military's largest plans are built in our software” while
              declining to cite specific plans because of contractual constraints, which underscores how difficult
              breadth-of-use claims are to verify independently. Across this pool, named deployments are overwhelmingly
              U.S. defense accounts, so customer concentration and renewal dependence on a narrow buyer set remain
              material open questions.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real command adoption is visible
            body: >-
              The chapter has stronger customer proof than a typical private defense software company: AMC expansion,
              ACC rollout, and an Army enterprise contract all point to real operational usage rather than logo-only
              marketing.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Durability and concentration are still opaque
            body: >-
              Public evidence does not disclose customer counts, retention, contract values, or concentration by
              command, and management has explicitly limited breadth-of-use disclosure. That keeps renewal quality and
              revenue concentration as unresolved diligence risks.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security, accreditation, and assurance burden
        blocks:
          - type: paragraph
            body: >-
              Onebrief's own materials describe a platform already deployed across classified, unclassified, and partner
              networks, with an API that can run on SIPR, NIPR, and JWICS, while Carahsoft describes secure deployment
              and role-based controls for sensitive content. That is a real mitigation base, not slideware, and the
              company also says new capital is being used to harden the platform and keep it operational during
              cyberattacks. The risk is that a system positioned this deep inside mission-planning workflows inherits a
              much heavier assurance burden than ordinary enterprise SaaS, while public third-party evidence of
              accreditations, incident history, or model governance remains absent from the retained source set.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Operational scaling and integration execution
        blocks:
          - type: paragraph
            body: >-
              The execution story is ambitious even by defense-software standards. January 2026 funding was tied to the
              Battle Road acquisition and to platform hardening, while the 2025 company release said the roadmap targets
              support for 100,000 simultaneous collaborators under adversarial conditions. At the same time, the ACC
              rollout required onboarding and embedded government-commercial teams throughout 2025, and the product
              strategy relies on AI-assisted workflows plus deep integration into existing command systems. That
              combination creates a clear operational risk: if integration, performance, or post-acquisition execution
              lags, the same features that power adoption can become the bottleneck that slows wider branch-level
              expansion.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.3'
        title: Government concentration and ecosystem dependence
        blocks:
          - type: paragraph
            body: >-
              The strongest proof points also define the concentration risk. Public evidence centers on the U.S.
              military: ACC rolled the platform to all staff directorates, the September 2026 Army enterprise IDIQ
              created a five-year department-wide procurement path, Sapphire describes a hybrid go-to-market motion
              reinforced by military relationships, and the StartEngine offering repeats the claim that Onebrief powers
              three of the Department of Defense's four most significant operational plans. These are valuable signals,
              but they point to one dominant customer complex, one procurement environment, and one mission domain. If
              budgets, priorities, or contracting pathways shift, a large share of both growth evidence and commercial
              leverage can move at once.
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Capital-markets risk and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public marketability evidence is materially weaker than product-adoption evidence. StartEngine makes
              explicit that the 2026 security was a membership interest rather than direct shares and that the exposure
              was speculative, illiquid, and capable of a total loss. Meanwhile, the retained 2025 sources show a rapid
              valuation reset from $650 million to $1.1 billion in roughly one quarter, while Business Insider also
              reports that management would not identify specific plans because of contractual constraints. The
              resulting investment risk is not that the product lacks demand; it is that public evidence does not yet
              let an outsider test whether contract concentration, unit economics, and assurance depth justify the pace
              of mark-up. That is the chapter's core kill criterion.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Security proof is mostly management-described
            body: >-
              The retained sources document controls, classified-network deployment, and cyber-hardening intent, but
              they do not show third-party assurance artifacts or incident-history evidence. Residual security risk
              therefore stays high until diligence moves from website claims to operating proof.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: callout
            title: Concentration is strategic, not incidental
            body: >-
              Onebrief's best public proof points all sit inside the same customer complex: ACC, the Army, and broader
              DoD operational planning. That is a wedge, but it also means procurement friction or budget shifts could
              hit growth, references, and perceived defensibility at the same time.
            calloutType: risk
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
          - type: callout
            title: Kill criteria for the next diligence round
            body: >-
              Do not underwrite the current risk posture as merely technical. If management cannot produce contract-mix,
              renewal, incident, assurance, and unit-economics evidence that reconciles with the valuation step-up and
              the illiquid security structure, this should remain a high-risk diligence case.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation remains research-more rather than buy because the underwriting problem is now more
              about price discipline than product legitimacy. Onebrief has a credible wedge in military staff planning,
              and both company and third-party reporting point to bottom-up user pull, widening procurement access, and
              a push from collaboration software into AI-assisted planning and simulation. But the latest disclosed
              round reset the price to roughly $2.15B after a prior jump to $1.1B only months earlier, while the
              freshest external mark retained in this chapter sits materially below that level. That leaves enough
              evidence to stay engaged, but not enough to underwrite the round headline without access to private
              operating and capital-structure data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
      - number: '8.2'
        title: Valuation context and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The public valuation case rests on platform ambition rather than disclosed economics. The bull story is
              straightforward: planner-native adoption, documented API and classified-network deployment claims, and a
              simulation expansion path could turn Onebrief from a workflow tool into a sticky command platform. The
              anti-thesis is equally straightforward: the adverse case points to roughly $19.1M of revenue against a
              $2.15B mark, which implies a triple-digit revenue multiple, while the current external price signals
              already clear below the last round. Comparable exit logic therefore depends less on a near-term IPO and
              more on Onebrief proving that procurement depth and product scope can outrun both slower federal sales
              cycles and larger-stack competition.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Scenarios, diligence asks, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The scenario frame should anchor on observable marks rather than false precision. The bull case only holds
              if the Army-wide procurement path, product expansion into simulation, and command-level adoption signals
              convert into revenue quality that can close the gap between the last round and the current external marks.
              The base case assumes the company is strategically valuable but still over-earning its public headline
              until private diligence clarifies contract durability, margins, burn, and preferences. The bear case is a
              classic down-round setup: multiple compression, slower procurement conversion, and a platform ceiling
              imposed by a larger defense software stack. The key diligence asks are the 2026 cap-table terms, revenue
              bridge, cohort retention, burn/runway, and how much of the Jan. 2026 financing was true primary capital
              versus secondary liquidity.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Stay engaged, but keep entry discipline below the headline round
            body: >-
              Onebrief looks strategically relevant enough to merit continued work, but the burden of proof now sits on
              economics and terms rather than product plausibility. The prudent posture is research-more with a
              stretched valuation stance.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV010
          - type: callout
            title: The cleanest downside path is multiple compression, not product failure
            body: >-
              The company can be real and still be too expensive. If command-level traction does not convert into
              visible recurring revenue or if the 2026 financing economics were investor-friendly only in headline form,
              the next mark can reset sharply.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV013
          - type: callout
            title: The valuation only works if Onebrief becomes a command platform, not just a better staff workflow
            body: >-
              The premium case needs planning, AI assistance, and simulation to become sticky together. If a larger
              defense-data stack captures the broader operating layer, Onebrief's ceiling falls and the last round
              becomes harder to defend.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV012
              - CV013
