        title: Maturity, differentiation, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The clearest maturity signals in the assigned pool are operational and procurement-oriented rather than
              developer-facing. In 2026, public reporting tied Onebrief both to the Army's next-generation
              command-and-control effort and to an Army enterprise contract that moved the company from subcontractor to
