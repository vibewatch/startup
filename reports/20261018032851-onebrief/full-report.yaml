        title: Where Onebrief appears differentiated
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation evidence in the pool is workflow-native depth rather than a published price
              edge. Onebrief describes a single workspace built from live, synchronized operational data, AI workflows,
