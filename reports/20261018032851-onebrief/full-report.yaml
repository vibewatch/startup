    title: Customers
    sections:
      - number: '6.1'
        title: Defense organizations are the visible buyer, user, and payer base
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool points to a concentrated customer base: U.S. military staffs and commands are
              the only clearly documented paying and using organizations. Salesforce Ventures says Onebrief is already
              in active use across the Joint Staff and major U.S. Combatant Commands, while a 2025 company funding
              release said adoption had reached four of seven geographic combatant commands. The buyer appears to be
              command-level defense organizations procuring collaboration and planning software for staff officers and
              planners, not decentralized line users. Public materials support strategic relevance, but they do not
              disclose customer counts, contract values, renewal cohorts, or commercial-sector mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU014
      - number: '6.2'
        title: Named deployments show command-level traction, but proof quality varies
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is strongest where the company ties product use to a specific command workflow. Air
              Mobility Command is the clearest example: independent coverage says the deployment entered its third
              consecutive fiscal year, expanded from headquarters to operational wings, and became the sole planning
              product for a 2026 conference workflow. Air Combat Command adds pilot-to-rollout evidence, including
              deployment across staff directorates and an onboarding effort embedded with users. The Army proof is more
              procurement-centric: a five-year enterprise contract and an immediate Army G4 task order show a direct
              buying path, but not yet the revenue or seat density behind it.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
