      - number: '4.3'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Funding disclosure is much stronger than operating disclosure. Onebrief's official June 2025 announcement
              and Business Insider's contemporaneous reporting support the $20 million Series C extension at a $1.1
              billion valuation, and QuantLogix now lists a January 2026 Series D of $359.28 million with $303 million
              raised in total. That capital stack should reduce immediate financing pressure, but the public record
              still omits cash on hand, monthly burn, debt terms, and runway, so investors cannot test whether the 2026
              balance sheet merely funds growth or is already committed to infrastructure, staffing, acquisition, or
              classified deployment demands. QuantLogix's lower $1.6 billion model price and steep secondary-price
              discount imply that private-market confidence may be less robust than the headline last-round mark.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI012
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The positive financial read is that Onebrief has visible procurement momentum, referenceable
              defense-command adoption, and enough disclosed capital raises to keep scaling. The negative read is that
              nearly every underwriting variable that would convert those signals into a defensible revenue-quality or
              margin thesis is still private: revenue mix, contract values, renewal cohorts, customer concentration by
              dollars, software-versus-services gross margin, burn, runway, and debt obligations. As a result, public
              diligence can support a view that Onebrief is building a real enterprise-defense revenue engine, but it
              cannot support a clean judgment on revenue quality, capital efficiency, or the timing and terms of the
              next financing trigger.
            claimRefs:
