  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Planner-native workspace and product surface
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently describe Onebrief as software that replaces fragmented PowerPoint, Word,
              email, and file-based military staff work with a single live workspace. The core operating idea is a
              shared structured data model built around reusable Cards, so the same underlying information can feed
              lists, timelines, maps, whiteboards, slides, and documents without manual copy-and-paste. That product
              surface matters because it defines Onebrief less as a point planning app and more as a system of record
              for staff products across echelons. The company and channel materials also make the AI layer concrete
              enough to underwrite a workflow claim: Onebrief says its AI uses plan context and doctrinal templates to
              draft and update plans, orders, and briefs rather than merely adding a generic chatbot beside static
              files.
