  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports defining Onebrief's category as military operational planning, mission-command
              collaboration, and adjacent command decision-support workflows rather than a broad horizontal productivity
              or generic AI market. Onebrief's own platform and features pages consistently describe an integrated
              workspace where live operational data, plans, orders, maps, timelines, and briefs stay synchronized, while
              the Carahsoft listing frames the product as a secure government workflow environment for distributed teams
              operating in classified and unclassified settings. That makes the included spend logic more specific:
              planning software, staff-collaboration tooling, decision-support workflows, integrations, and deployment
              services that replace fragmented PowerPoint, Word, email, and file-based military planning. Excluded or
              only indirectly supported categories include pure office productivity suites, stand-alone intelligence
              analytics, weapons systems, and general IT infrastructure that may coexist with Onebrief but are not the
              directly evidenced buying job.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a multi-stakeholder defense-software sale in which users are planners and
              staffs, buyers are commands pursuing mission-command modernization, and payers are procurement offices or
              command budgets that can sponsor enterprise or pilot deployment. The ACC release shows a command-level
              adoption path: Onebrief won an operational-planning contract, planned rollout to all ACC staff
              directorates, and paired software with embedded onboarding to migrate existing work centers into the new
              workflow. The September 2026 Army contract expands that path from local program sponsorship to a broader
              department-wide procurement channel by allowing warranted contracting officers to issue orders under a
              five-year IDIQ. Those disclosures imply that adoption is not only a feature-led software decision; it
              depends on integration, implementation support, security posture, and a procurement route that lets
              commands buy without inventing a fresh contracting structure.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The pool does not disclose a clean TAM/SAM/SOM stack for Onebrief, so sizing must rely on multiple
              incomplete lenses instead of one asserted headline market number. One company-issued lens is broad: the
              2025 unicorn-valuation release says defense tech exceeds $140 billion in annual spend and that military
              staff optimization could unlock more than $100 billion of Future Years Defense Program savings.
              Independent category-capital signals point in the same direction but measure something different: Business
              Insider cites McKinsey and PitchBook data showing capital flowing aggressively into defense technology,
              while AI Business Weekly describes the opportunity as mission-planning software needed by every command,
              unit, and headquarters. Those lenses are useful for valuation framing and market interest, but they do not
              isolate Onebrief's serviceable market because public evidence still lacks transparent pricing, seat
              counts, contract values, and customer concentration.
            claimRefs:
              - CM008
              - CM009
