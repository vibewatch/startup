              reports that the cofounder and CEO is a former 101st Airborne officer and West Point graduate, which
              aligns with the company's military-planning thesis and likely helps with user empathy inside defense
              workflows. The clearest documented leadership expansion comes from the Series B announcement, which names
              David Wolf as VP of Engineering, Colten O'Malley as CISO, and Blake Lackey as Head of Sales, alongside a
              stated employee base of 100+ worldwide. That supports a view of functional bench-building across product,
              security, and go-to-market, but current headcount, board composition, and any 2025-2026 executive turnover
