chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Onebrief presents itself as a command-decision platform built for military staffs rather than a generic
              enterprise collaboration app. Its homepage and Carahsoft partner page both describe a live, secure
              workflow environment that unifies planning, collaboration, maps, timelines, and briefings inside a single
              operational workspace, while the official ACC pilot release adds explicit API and cross-network deployment
              detail. That establishes the core business model—software sold into government planning workflows with
              implementation support—but not a clean public company profile on basics like headquarters, customer count,
              or revenue. Even the headquarters field is not fully settled in this evidence pack: QuantLogix profiles
              Onebrief as Honolulu-based, while one January 2026 trade article calls it Washington, D.C.-based, so later
              chapters should treat location as a live diligence item rather than inherited fact.
