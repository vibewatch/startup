  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive frame and substitute set
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a wide substitute set even though it does not provide a clean direct-peer
              benchmark pack. Onebrief's own materials and its Carahsoft partner page define the status quo as slide,
              document, email, and version-control churn rather than an incumbent single-purpose planning product.
              Independent sources then expand the field outward: QuantLogix explicitly lists Palantir, Anduril Lattice,
              and Govini as competitors, while AI Business Weekly places traditional primes such as Lockheed Martin,
              Raytheon, and Northrop Grumman in the same buying conversation. That makes the practical decision set
              broader than "Which planning app wins?" and closer to "Do we keep patching existing tools, build around
              current systems, or buy a planner-native command layer?"
