    title: Market definition table
    columns:
      - Segment / category
      - Included spend / workflow
      - Excluded spend / workflow
      - Buyer / payer
      - Relevance
    rows:
      - [Military operational planning software, "Collaborative plan creation, orders, briefs, maps, timelines, and synchronized operational data", "General office productivity suites or document storage sold without mission-planning workflow", "Commands, staffs, and procurement offices", "Core market boundary evidenced by platform and features pages"]
      - [Mission-command collaboration, "Cross-echelon collaboration, live updates, workflow coordination, onboarding and change management", "Standalone chat, email, or file-sharing products without operational-planning layer", "Command leadership and directorates", "ACC and Carahsoft evidence show enterprise workflow replacement"]
      - [Decision-support and AI-assisted staff tooling, "AI workflows, summarization, plan generation, and structured data reuse inside command workflows", "Generic horizontal copilots with no defense-specific planning context", "Operational planners and command leadership", "Important adoption driver but still tied to planning workflow rather than generic AI spend"]
      - [Secure defense deployment and integration, "Classified/unclassified deployment, open API integrations, permissions, implementation support", "Core IT infrastructure spend unrelated to mission-planning applications", "Government IT and mission owners", "Necessary adoption layer for defense buyers even if not the primary user-facing value proposition"]
    notes: >-
      Boundary is inferred from the assigned pool's direct product, partner, and contract evidence;
      it separates evidenced workflow scope from adjacent defense-IT categories that may coexist
      but are not directly supported as Onebrief's addressable market.
    claimRefs: [CM001, CM002, CM003, CM007]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Lens / publisher
      - Year / period
      - Geography / scope
      - Value
      - CAGR / growth signal
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Onebrief unicorn-valuation release", "2025", "Defense tech / U.S. DoD modernization context", ">$140B annual spend", null, "Company-issued top-down category framing", low, "Broad category lens, not a Onebrief SAM or buyer budget denominator"]
      - ["Onebrief unicorn-valuation release", "2025", "Future Years Defense Program staff-optimization context", ">$100B potential savings", null, "Company-issued efficiency pool estimate", low, "Savings potential is not software spend or captured revenue"]
      - ["Business Insider citing McKinsey", "2024", "Defense-related venture funding", "$31B invested", "33% YoY", "Independent capital-market proxy for category enthusiasm", medium, "Tracks venture investment, not end-customer software budgets"]
      - ["Business Insider citing PitchBook", "Q1 2025", "Defense funding rounds", "$1.4B vs $200M prior-year quarter", "7x YoY on cited quarters", "Independent capital-flow proxy", medium, "Funding momentum is not equivalent to addressable demand for planning software"]
      - ["AI Business Weekly", "2026", "Mission-planning software opportunity", "Every military command, unit, and headquarters requires mission planning capabilities", null, "Top-down use-case proxy based on buyer universe logic", medium, "No disclosed spend denominator or unit-price assumption"]
    notes: >-
      Public evidence supports multiple sizing lenses but not a clean TAM/SAM/SOM stack. Values mix
      category spend, efficiency-savings pools, and capital-market proxies, so they should frame
      opportunity breadth rather than be treated as directly comparable revenue pools.
    claimRefs: [CM008, CM009, CM010, CM011, CM012]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Air Combat Command staff modernization", "ACC leadership and program sponsors", "Airmen, Guardians, planners, and staff directorates", "ACC program / command budget", "Mission planning, command-and-control collaboration, and live operational updates", "Command modernization and operational planning owners", "ABL EMC3 contract plus embedded onboarding and 2025 directorate rollout"]
      - ["Army / Department-wide procurement pathway", "Army and broader DoW contracting officers", "Army organizations ordering planning capabilities", "Task and delivery orders under IDIQ", "Procurement access to planning capabilities and government-furnished property use", "Contracting offices and mission sponsors", "Five-year enterprise contract that removes bespoke contracting friction"]
      - ["Secure government workflow deployments", "Government teams buying through reseller channels", "Distributed staffs operating on classified and unclassified networks", "Enterprise software and services budget", "Single-source-of-truth workflow, templates, maps, whiteboards, and interoperability", "IT/security and mission-workflow owners", "Need for secure deployment, permissions, and faster coordination under operational tempo"]
    notes: >-
      Public evidence identifies the workflow and procurement path more clearly than the exact
      appropriation line or contract economics. Budget-owner descriptions are therefore functional
      inferences anchored to the disclosed command and contracting surfaces.
    claimRefs: [CM003, CM004, CM005, CM006]
figures:
  - id: FM001
    title: Constrained market-sizing lens from public evidence
    type: pyramid
    summary: >-
      Public evidence narrows from broad defense-software spend proxies toward concrete procurement
      and rollout evidence, but the monetizable slice stays opaque because pricing and contract
      economics are undisclosed.
    data:
      items:
        - label: Broader defense-tech category
          value: ">$140B annual spend"
          note: Company-issued 2025 lens for defense-tech demand, not Onebrief's direct market
        - label: Workflow-efficiency pool
          value: ">$100B potential savings"
          note: Company-issued estimate for staff optimization inside the Future Years Defense Program
        - label: Category capital momentum
          value: "$31B in 2024 VC; $1.4B in Q1 2025 rounds"
          note: Independent capital-flow proxy cited by Business Insider rather than end-buyer spend
        - label: Department procurement aperture
          value: "5-year Army / DoW IDIQ"
          note: Concrete route to buy, but not a disclosed budget total
        - label: Command-level deployment proof
          value: "ACC rollout to all staff directorates"
          note: Adoption evidence inside one major command
        - label: Monetizable slice still unknown
          value: No public pricing or contract values
          note: Public evidence does not isolate SAM, SOM, or unit economics
    approximationNotes: >-
      The pool does not disclose a formal TAM/SAM/SOM stack. This pyramid therefore orders
      supported public lenses from broad category proxy to concrete procurement proof and uses
      numeric values only where the assigned sources state them directly.
    claimRefs: [CM006, CM008, CM010, CM011, CM012, CM013, CM014]
callouts:
  - calloutType: insight
    title: Procurement access is clearer than budget capture
    body: >-
      The strongest public market signal is not a disclosed TAM number but the widening ability of
      commands to buy and deploy Onebrief through ACC programs, reseller channels, and the Army's
      five-year IDIQ vehicle.
    claimRefs: [CM004, CM006]
  - calloutType: risk
    title: Public SAM / SOM remains opaque
    body: >-
      Investors can see category enthusiasm and deployment anecdotes, but they still cannot convert
      those signals into a reliable revenue-backed market model because pricing, seat counts,
      contract values, and retention are not public.
    claimRefs: [CM010, CM011, CM013, CM014, CM015]
