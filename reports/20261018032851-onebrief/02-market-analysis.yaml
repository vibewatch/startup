  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-som
      missingEvidence: Publicly disclosed pricing tiers, seat counts, contract values, or budget denominators that would convert category proxies into a Onebrief-specific SAM or SOM.
      whyItMatters: Without monetization inputs, valuation and adoption analysis can describe market relevance but cannot quantify budget capture with confidence.
      diligencePath: Request customer contract exhibits, pricing sheets, or procurement award values tied to named deployments and map them to command-level user counts.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: customer-economics
      missingEvidence: Customer count, renewal behavior, contract expansion data, and buyer concentration by command or service.
      whyItMatters: These metrics determine whether deployment anecdotes translate into durable revenue and whether the market is concentrated in a few flagship commands.
      diligencePath: Obtain cohort-level pipeline, renewal, and expansion data by military branch or command, plus churn reasons where deployments did not expand.
      relatedQuestionRefs: [QM003, QM004]
      relatedTableRefs: [TM003]
    - type: missing-source
