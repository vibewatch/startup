company:
  name: "Onebrief"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Onebrief looks strongest where a defense buyer wants a planner-native workspace
    with direct Army procurement access instead of another document stack or a more
    general defense software layer. The assigned evidence is much thinner on public,
    apples-to-apples pricing and deployment benchmarks for named rivals, so the
    competitive picture is clearer by category than by precise vendor-by-vendor score.
sections:
  - id: "competitive-frame"
    title: "Competitive frame and substitute set"
    body: >-
      The assigned pool supports a wide substitute set even though it does not provide
      a clean direct-peer benchmark pack. Onebrief's own materials and its Carahsoft
      partner page define the status quo as slide, document, email, and version-control
      churn rather than an incumbent single-purpose planning product. Independent sources
      then expand the field outward: QuantLogix explicitly lists Palantir, Anduril
      Lattice, and Govini as competitors, while AI Business Weekly places traditional
      primes such as Lockheed Martin, Raytheon, and Northrop Grumman in the same buying
      conversation. That makes the practical decision set broader than "Which planning
      app wins?" and closer to "Do we keep patching existing tools, build around current
      systems, or buy a planner-native command layer?"
    claimRefs:
      - CP002
      - CP006
      - CP007
      - CP008
      - CP009
      - CP016
    tableRefs:
      - TP001
  - id: "differentiation"
    title: "Where Onebrief appears differentiated"
    body: >-
      The strongest differentiation evidence in the pool is workflow-native depth rather
      than a published price edge. Onebrief describes a single workspace built from live,
      synchronized operational data, AI workflows, and interoperable APIs, and ACC's
      pilot language says the product augments an existing stack instead of replacing a
      single incumbent record system. Independent commentary reinforces that positioning:
      AI Business Weekly characterizes Palantir as strongest in data analytics and
      intelligence and Anduril in autonomous systems and sensors, which suggests those
      rivals attack adjacent decision layers rather than the exact same planning-centric
      job. The net effect is a differentiated "command workflow" posture, but one that is
      still defined more by capability narrative than by standardized third-party
      benchmarks.
    claimRefs:
      - CP001
      - CP003
      - CP007
      - CP008
      - CP014
      - CP016
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: "distribution-and-pricing"
    title: "Distribution, switching costs, and pricing opacity"
    body: >-
      Distribution is where Onebrief has the clearest buyer-facing edge in this evidence
      set. The Army enterprise IDIQ and the first task order executed within an hour of
      award show a procurement path that is much more concrete than a generic venture
      software sales motion, and QuantLogix's federal-awards data points in the same
      direction. Switching costs also look meaningful because Onebrief repeatedly frames
      adoption around imports, interoperability, and augmentation of existing systems,
      which lowers initial deployment friction while still encouraging teams to move live
      planning work into its shared workspace. The biggest commercial weakness is that
      public pricing remains opaque: ToolMage says Onebrief runs a custom enterprise model,
      so outside buyers cannot benchmark list price, discounting, or realized contract
      economics from the public record alone.
    claimRefs:
      - CP002
      - CP004
      - CP005
      - CP010
      - CP015
      - CP016
    tableRefs:
      - TP003
  - id: "durability-and-risk"
    title: "Durability and displacement risks"
    body: >-
      The moat case is credible but incomplete. Onebrief's planner-native feature set,
      classified-network posture, and direct contract vehicle help, and the company has
      raised enough capital to keep widening the product surface. At the same time,
      adjacent platforms, incumbent primes, and internal-build paths all remain viable
      ways to contest the account. The assigned pool offers category-level evidence that
      those competitors exist, but not enough neutral benchmarking to prove that Onebrief
      wins on realized cost, deployment speed, or long-run retention. That means the
      durability question currently rests on program momentum and workflow fit more than on
      audited proof that rivals cannot match the product or route-to-market.
    claimRefs:
      - CP004
      - CP008
      - CP009
      - CP011
      - CP012
      - CP013
      - CP014
      - CP016
callouts:
  - calloutType: "insight"
    title: "Best-evidenced edge: planner-native workflow plus procurement access"
    body: >-
      The strongest public differentiation in this pool is not list pricing or a formal
      benchmark report; it is the combination of live collaborative planning workflows and
      a direct Army-wide contracting path.
    claimRefs:
      - CP001
      - CP004
      - CP005
  - calloutType: "risk"
    title: "Hardest diligence question: opaque price-performance versus adjacent platforms"
    body: >-
      Public sources establish that Onebrief competes with adjacent defense platforms and
      incumbent primes, but they do not provide apples-to-apples pricing, deployment, or
      retention metrics that would show whether that narrative converts into durable
      economic advantage.
    claimRefs:
      - CP007
      - CP010
      - CP016
