      - ["Recurring platform access", "Live collaboration, API integration, imports, and synchronized planning workspace sold into commands", "Site / command / user (not disclosed)", "Public evidence shows usage scope, not billing unit", "Product scope visible, billing basis absent", "Request billing metric, minimum commitments, and overage structure"]
    notes: "Public sources show procurement pathways and deployment scope, but not contract values, billing units, or realized recurring revenue."
    claimRefs: [CI001, CI003, CI004, CI010, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - Public signal
      - List vs realized pricing
      - Implication
      - Source
    rows:
      - ["Published list price", "No reviewed official or third-party source published list pricing", "No public list or realized price", "External buyers cannot benchmark pricing power from public evidence", "Official site and media coverage reviewed"]
      - ["Army contract structure", "Five-year enterprise IDIQ enabling task and delivery orders", "Vehicle public; task-order pricing undisclosed", "Monetization appears contract-driven rather than self-serve", "Army contract disclosures"]
      - ["Onboarding / services load", "ACC rollout includes comprehensive onboarding and embedded support", "Services pricing undisclosed", "Implementation effort could compress gross margin until deployments scale", "ACC release"]
      - ["Platform scale investment", "Funding release ties capital to engineering, infrastructure, AI, and 100,000 simultaneous collaborators", "Cost-to-serve undisclosed", "Margin path depends on software leverage outrunning infrastructure and support costs", "Onebrief funding release"]
    notes: "This table separates structure from economics: the contract and support model is public, while realized pricing remains undisclosed."
    claimRefs: [CI003, CI004, CI009, CI012, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue / ARR", null, "Low", "Needed to anchor valuation, growth, and sales-efficiency math", "Request revenue, ARR definition, growth, and recognition policy"]
      - ["Gross margin", null, "Low", "Distinguishes software leverage from services and infrastructure drag", "Request gross margin split between software and services/support"]
      - ["Cash burn / runway / debt", null, "Low", "Determines whether disclosed funding is ample or already committed", "Request cash balance, monthly burn, debt terms, and base-case runway"]
      - ["Public hard-dollar traction proxy", "$29.58M obligated across 18 prime federal awards in the last 36 months; largest disclosed award $3.5M", "Medium", "Best public dollar proxy, but incomplete because subcontracts and classified work are excluded", "Reconcile USASpending-visible awards to total bookings and classified revenue"]
      - ["Customer concentration / renewals", "Disclosed users center on Army, ACC, and Joint Force commands; renewal data undisclosed", "Medium", "Government concentration can create budget timing and renewal risk", "Request top-customer share, contract expiry ladder, and renewal cohorts"]
    notes: "Null means not publicly disclosed as of the 2026-10-18 run date; qualitative proxies are separated from missing hard metrics."
    claimRefs: [CI007, CI012, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a defense-enterprise software revenue path that runs from prototypes and
      pilots into direct task-order procurement, then into broader deployment and usage expansion.
    data:
      nodes:
        - id: prototype
          label: NGC2 prototyping and pilots
          detail: "Earlier work included subcontractor support for NGC2 prototyping and operational experimentation."
        - id: vehicle
          label: Direct procurement vehicle
          detail: "The Army enterprise IDIQ gives warranted contracting officers a direct task-order path for Onebrief capabilities."
        - id: deployment
          label: Deployment and onboarding
          detail: "ACC rollout includes onboarding and embedded commercial support alongside command adoption."
        - id: usage
          label: Operational usage expansion
          detail: "Army users reported some planning work falling from roughly three hours to 30 to 40 minutes."
        - id: scale
          label: Platform scale and integrations
          detail: "Onebrief ties new capital to engineering, infrastructure, AI, API integrations, and support for 100,000 simultaneous collaborators."
        - id: economics
          label: Revenue and gross-profit realization
          detail: "Recurring software value appears plausible, but pricing, contract values, margin, and support intensity remain undisclosed."
      edges:
        - from: prototype
          to: vehicle
          label: "Prototype adoption becomes prime-contract access"
        - from: vehicle
          to: deployment
          label: "Task orders fund rollout and support"
        - from: deployment
          to: usage
          label: "Operational use creates value proof"
        - from: usage
          to: scale
          label: "Broader command adoption drives capacity needs"
        - from: scale
          to: economics
          label: "Economics depend on software leverage versus service and infrastructure load"
    approximationNotes: "Flow stages reflect public revenue mechanics, not quantified conversion rates or dollar amounts."
    claimRefs: [CI001, CI004, CI009, CI010, CI011, CI013]
callouts:
  - calloutType: insight
    title: Procurement momentum is more visible than monetization
    body: >-
      Public evidence now shows direct federal procurement pathways and visible deployment activity,
      but not the contract values or recurring revenue those pathways produce.
    claimRefs: [CI001, CI003, CI004, CI013]
  - calloutType: risk
    title: Capital raised does not equal underwritable liquidity
    body: >-
      The 2025 and 2026 rounds make near-term financing stress less likely, but without cash, burn,
      debt, and runway disclosure the public record still cannot prove capital adequacy.
    claimRefs: [CI007, CI008, CI012, CI015]
