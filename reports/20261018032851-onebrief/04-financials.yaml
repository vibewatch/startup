schemaVersion: report-v2
artifact: financials
slug: onebrief
runDate: 2026-10-18
company:
  name: Onebrief
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a government-enterprise software revenue model with expanding direct
    procurement pathways, but it still does not disclose revenue, margin, burn, or runway. The
    company has materially de-risked near-term financing through the 2025 extension and 2026 Series
    D, yet the latest third-party secondary-price signal suggests public operating disclosure still
    lags the valuation step-up.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The clearest public monetization evidence is not list pricing but procurement structure.
      Onebrief disclosed in September 2026 that Army Contracting Command awarded a decentralized,
      single-award enterprise IDIQ that lets warranted contracting officers issue task and delivery
      orders directly for Onebrief planning capabilities, moving the company from prototype
      subcontractor status into a direct procurement path. A separate Air Combat Command release
      shows the business also sells into rollout programs that include onboarding and embedded
      support, while Interesting Engineering reported planning tasks compressing from roughly three
      hours to 30 to 40 minutes in Army experimentation. That combination supports a revenue model
      built around enterprise defense software adoption and follow-on task orders, but not a public
      view of realized revenue per command, user, or contract.
    claimRefs: [CI001, CI002, CI003, CI004, CI011, CI013, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-costs-and-unit-economics
    title: Pricing, delivery costs, and unit economics
    body: >-
      Public materials still stop short of disclosing price cards or unit economics. No reviewed
      source publishes seat pricing, command-level minimums, task-order dollar values, discounts, or
      realized expansion rates. Instead, the evidence shows the likely cost drivers: Onebrief says
      new capital is being used to expand engineering, infrastructure, AI, and support for
      100,000 simultaneous collaborators, while product and ACC deployment pages describe bidirectional
      API work, document imports, embedded onboarding, and support across classified and
      unclassified environments. Those details suggest a business that mixes recurring software value
      with non-trivial implementation and support load, which means gross-margin potential depends on
      software scale outrunning services intensity and infrastructure spend, but public evidence is
      insufficient to measure that path.
    claimRefs: [CI004, CI009, CI010, CI012, CI013]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-financing-dependence
    title: Capital adequacy and financing dependence
    body: >-
      Funding disclosure is much stronger than operating disclosure. Onebrief's official June 2025
      announcement and Business Insider's contemporaneous reporting support the $20 million Series C
      extension at a $1.1 billion valuation, and QuantLogix now lists a January 2026 Series D of
      $359.28 million with $303 million raised in total. That capital stack should reduce immediate
      financing pressure, but the public record still omits cash on hand, monthly burn, debt terms,
      and runway, so investors cannot test whether the 2026 balance sheet merely funds growth or is
      already committed to infrastructure, staffing, acquisition, or classified deployment demands.
      QuantLogix's lower $1.6 billion model price and steep secondary-price discount imply that
      private-market confidence may be less robust than the headline last-round mark.
    claimRefs: [CI005, CI006, CI007, CI008, CI012, CI015]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The positive financial read is that Onebrief has visible procurement momentum, referenceable
      defense-command adoption, and enough disclosed capital raises to keep scaling. The negative
      read is that nearly every underwriting variable that would convert those signals into a
      defensible revenue-quality or margin thesis is still private: revenue mix, contract values,
      renewal cohorts, customer concentration by dollars, software-versus-services gross margin,
      burn, runway, and debt obligations. As a result, public diligence can support a view that
      Onebrief is building a real enterprise-defense revenue engine, but it cannot support a clean
      judgment on revenue quality, capital efficiency, or the timing and terms of the next financing
      trigger.
    claimRefs: [CI007, CI008, CI012, CI014, CI015, CI016]
