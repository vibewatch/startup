      - ["ACC rollout and onboarding", "Platform rollout across staff directorates with onboarding and embedded support", "Program / deployment", "Rollout beginning January 2025 disclosed; contract value not public", "Delivery model visible, revenue split unknown", "Request software versus services mix and rollout-to-expansion conversion"]
