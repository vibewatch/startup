          tone: neutral
          claimRefs: [CO003]
        - period: "2025-01"
          label: ACC rollout starts
          detail: The ACC release says rollout to all staff directorates begins in January 2025, with API deployment across SIPR, NIPR, and JWICS.
          tone: positive
          claimRefs: [CO009]
        - period: "2025-06"
          label: Series C extension
          detail: The company and Business Insider both describe a $20M extension that lifted valuation to $1.1B from $650M three months earlier.
          tone: positive
          claimRefs: [CO008]
