          label: Trade-reported 2026 raise
          detail: AI Business Weekly reports a $200M round led by Battery Ventures and Sapphire Ventures with Salesforce Ventures participating.
          tone: positive
          claimRefs: [CO012]
        - period: "2026-Q1"
          label: QuantLogix Series D lens
          detail: QuantLogix records the last confirmed mark as $2.15B and describes the January 2026 Series D as a larger $359.28M round.
          tone: warning
          claimRefs: [CO013]
        - period: "2026-09-11"
          label: Army contract notice surfaces
          detail: The September 2026 enterprise vehicle appeared in the Department of War's official contracts announcement.
          tone: positive
          claimRefs: [CO010]
        - period: "2026-09-17"
          label: Enterprise contract announced
          detail: Onebrief says the five-year award enabled its first task order within an hour of contract award.
          tone: positive
          claimRefs: [CO011]
        - period: "2026-10-18"
          label: Secondary-market valuation caution
          detail: QuantLogix published a $1.6B QL Price, 24% below the last disclosed round.
          tone: adverse
          claimRefs: [CO014]
    approximationNotes: null
    claimRefs: [CO003, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
callouts:
  - calloutType: risk
    title: Public traction is clearer than public economics
    body: >-
      The assigned evidence strongly supports product relevance and government-access momentum, but it does not provide
      revenue, customer, or contract-value data, and even 2026 financing specifics diverge across independent sources.
    claimRefs: [CO011, CO012, CO013, CO014]
