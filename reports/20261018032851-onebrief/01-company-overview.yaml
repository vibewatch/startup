artifact: company-overview
slug: onebrief
runDate: 2026-10-18
company:
  name: Onebrief
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Onebrief is a military planning and command-workflow software company whose retained evidence supports real
    procurement traction, classified-network deployment claims, and multiple financing step-ups through 2026. The same
    pool also shows why underwriting remains hard from public data: revenue, customer count, and current headcount are
    undisclosed, while 2026 round-size and headquarters descriptions diverge across independent sources.
sections:
  - id: identity-and-footing
    title: Identity, product scope, and operating footprint
    body: >-
      Onebrief presents itself as a command-decision platform built for military staffs rather than a generic enterprise
      collaboration app. Its homepage and Carahsoft partner page both describe a live, secure workflow environment that
      unifies planning, collaboration, maps, timelines, and briefings inside a single operational workspace, while the
      official ACC pilot release adds explicit API and cross-network deployment detail. That establishes the core
      business model—software sold into government planning workflows with implementation support—but not a clean public
      company profile on basics like headquarters, customer count, or revenue. Even the headquarters field is not
      fully settled in this evidence pack: QuantLogix profiles Onebrief as Honolulu-based, while one January 2026
      trade article calls it Washington, D.C.-based, so later chapters should treat location as a live diligence item
      rather than inherited fact.
    claimRefs: [CO001, CO002, CO003, CO015, CO016]
    tableRefs: [TO001]
  - id: leadership-and-organization
    title: Founder fit, leadership bench, and organizational scale
    body: >-
      The strongest publicly verifiable founder signal is Grant Demaree's operator background: Business Insider reports
      that the cofounder and CEO is a former 101st Airborne officer and West Point graduate, which aligns with the
      company's military-planning thesis and likely helps with user empathy inside defense workflows. The clearest
      documented leadership expansion comes from the Series B announcement, which names David Wolf as VP of Engineering,
      Colten O'Malley as CISO, and Blake Lackey as Head of Sales, alongside a stated employee base of 100+ worldwide.
      That supports a view of functional bench-building across product, security, and go-to-market, but current
      headcount, board composition, and any 2025-2026 executive turnover remain largely private in the assigned source
      set, which keeps key-person dependence on Demaree materially relevant.
    claimRefs: [CO004, CO006, CO007]
    tableRefs: [TO002]
  - id: funding-stakeholders-and-milestones
    title: Funding history, procurement momentum, and milestone quality
    body: >-
      Public funding evidence shows three distinct phases: a Series B announcement that brought cumulative capital to
      $53 million, a June 2025 extension that lifted valuation to $1.1 billion, and a 2026 round that clearly pushed
      the company into Series D territory but is not consistently described across independent records. The cleanest
      current traction marker is procurement access rather than disclosed unit economics: Onebrief's September 2026
      enterprise contract created a five-year Army ordering pathway and the company says its first task order executed
      within an hour, while the earlier ACC program shows branch-level rollout and integration work. The main caution is
      that public enthusiasm outpaces financial visibility: QuantLogix's current model estimate sits below the last
      disclosed round, and there is still no public revenue, ARR, customer-count, or cap-table-term disclosure to show
      whether the $2B-plus mark is supported by fundamentals or simply by strategic-demand momentum.
    claimRefs: [CO005, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date / period
      - Confidence
      - Gap / diligence note
    rows:
      - ["Founding year", "2019", "Historical", "medium", "Supported by QuantLogix profile; corroborating primary filing not present in this pool."]
      - ["Current stage", "Series D (public 2026 round descriptions disagree on size)", "2026", "low", "Resolve against company or investor materials before reusing as a precise financing fact."]
      - ["Last disclosed valuation", "$2.15B last confirmed mark", "2026-Q1", "low", "QuantLogix supplies the mark, but independent public evidence for exact economics is incomplete."]
      - ["Current third-party valuation signal", "$1.6B QL Price (-24% vs last round)", "2026-10-18", "low", "Model estimate, not a live quote or negotiated transaction disclosure."]
      - ["Revenue / ARR", null, null, "low", "No public revenue, ARR, gross margin, burn, or runway disclosure in the retained sources."]
      - ["Customer count / command coverage", null, null, "low", "Adoption anecdotes exist, but exact customer and contract counts remain undisclosed or classified."]
      - ["Headcount", "100+ employees worldwide (stale disclosed point)", "Series B period", "medium", "Current employee count is not public; only a dated hiring signal is visible."]
      - ["Headquarters", "Honolulu, HI profile vs Washington, D.C.-based trade descriptor", "2026", "low", "Confirm legal HQ and operating footprint directly with the company."]
    notes: >-
      Null means the assigned public evidence did not support a precise current value; conflicting rows preserve source
      disagreement rather than forcing a single number.
    claimRefs: [CO003, CO007, CO012, CO013, CO014, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background / evidence
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Grant Demaree", "Cofounder & CEO", "Business Insider says Demaree served in the 101st Airborne and graduated from West Point.", "Direct operator credibility with military planning users and buyers.", "High: public evidence centers heavily on Demaree's background and voice."]
      - ["David Wolf", "VP of Engineering", "Series B release says Wolf joined from Opendoor after founding JetClosing as CTO.", "Adds scaled consumer-software engineering depth to a defense workflow product.", "Medium: product execution bench improves, but current scope is not independently detailed."]
      - ["Colten O'Malley", "CISO", "Series B release says O'Malley came from Omni Federal and prior Army command-and-control support roles.", "Provides security and accreditation coverage for classified and sensitive deployments.", "Medium: role matters materially for wartime-resilience claims, but current team size is undisclosed."]
      - ["Blake Lackey", "Head of Sales", "Series B release says Lackey retired as a U.S. Army Colonel after operational-planning roles.", "Supports DoD go-to-market and command relationships.", "Medium: revenue ownership is implied, but commercial pipeline data is not public."]
    notes: >-
      Public leadership evidence is partial: this table captures the named founder and senior hires visible in the
      retained sources, not the full executive team or board roster.
    enumerationScope:
      coverage: partial
      basis: Public roster built only from the Business Insider founder profile plus the named senior hires in the Series B release.
    claimRefs: [CO004, CO006, CO007]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - ["Human Capital", "Series B lead investor", "Led the round that brought disclosed cumulative capital to $53M.", "Clarify ownership stake, board rights, and whether it still holds pro rata influence."]
      - ["9Yards Capital", "Series B participant", "Named participant in the official Series B announcement.", "Confirm current ownership and whether it participated in later rounds."]
      - ["Caffeinated Capital", "Series B participant", "Named participant in the official Series B announcement.", "Confirm signaling value versus economic significance in later financings."]
      - ["Battery Ventures", "June 2025 extension lead and named 2026 round lead in QuantLogix", "Appears central to the valuation step-up from $650M to unicorn status and later Series D reporting.", "Reconcile exact 2026 lead economics, ownership, and any secondary component."]
      - ["Sapphire Ventures", "Named 2026 round participant/lead in trade reporting", "Appears in the January 2026 financing report that pushed Onebrief into Series D territory.", "Verify whether Sapphire led, co-led, or simply participated, and on what terms."]
      - ["Salesforce Ventures", "Named 2026 participant in trade reporting", "Signals enterprise-software validation if participation is accurate.", "Confirm participation directly; this is not corroborated by a primary filing in the assigned pool."]
      - ["Army Contracting Command / ACC-APG", "Procurement pathway owner", "Created a five-year single-award vehicle that can shorten departmental access to Onebrief.", "Request task-order values, ceiling details, and whether usage is concentrated in a few programs."]
      - ["Carahsoft", "Channel / deployment partner", "Adds reseller and implementation leverage for government distribution.", "Understand revenue share, exclusivity, and whether Carahsoft is material for expansion."]
    notes: >-
      This is a public-visibility map, not a cap table; economic control, board seats, and secondary-sale terms remain
      mostly private.
    enumerationScope:
      coverage: partial
      basis: Public stakeholder list synthesized from retained financing announcements, trade reporting, partner listings, and Army procurement evidence only.
    claimRefs: [CO005, CO008, CO011, CO012, CO013]
