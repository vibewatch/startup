schemaVersion: "report-v2"
artifact: customers
slug: onebrief
runDate: 2026-10-18
company:
  name: Onebrief
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real command-level adoption inside U.S. defense organizations:
    Air Mobility Command expanded Onebrief into a third fiscal year, Air Combat
    Command rolled out a pilot across staff directorates, and the Army created a
    direct enterprise contracting path. What remains unproven from public evidence
    is durability economics—customer counts, contract values, renewals, churn,
    and concentration are still mostly undisclosed.
sections:
  - id: defense-customer-base
    title: Defense organizations are the visible buyer, user, and payer base
    body: >-
      The assigned evidence pool points to a concentrated customer base: U.S.
      military staffs and commands are the only clearly documented paying and
      using organizations. Salesforce Ventures says Onebrief is already in active
      use across the Joint Staff and major U.S. Combatant Commands, while a 2025
      company funding release said adoption had reached four of seven geographic
      combatant commands. The buyer appears to be command-level defense
      organizations procuring collaboration and planning software for staff
      officers and planners, not decentralized line users. Public materials
      support strategic relevance, but they do not disclose customer counts,
      contract values, renewal cohorts, or commercial-sector mix.
    claimRefs: [CU001, CU002, CU003, CU004, CU014]
    tableRefs: [TU001]
  - id: named-adoption-proof
    title: Named deployments show command-level traction, but proof quality varies
    body: >-
      Named customer proof is strongest where the company ties product use to a
      specific command workflow. Air Mobility Command is the clearest example:
      independent coverage says the deployment entered its third consecutive
      fiscal year, expanded from headquarters to operational wings, and became
      the sole planning product for a 2026 conference workflow. Air Combat
      Command adds pilot-to-rollout evidence, including deployment across staff
      directorates and an onboarding effort embedded with users. The Army proof
      is more procurement-centric: a five-year enterprise contract and an
      immediate Army G4 task order show a direct buying path, but not yet the
      revenue or seat density behind it.
    claimRefs: [CU005, CU006, CU007, CU008, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Expansion logic is visible; retention and concentration economics are not
    body: >-
      The public expansion motion is a land-and-expand pattern inside defense:
      pilot and onboarding activity at ACC, HQ-to-wing broadening at AMC, and a
      new enterprise contract vehicle with the Army. That is meaningful
      commercial progress, but it is not the same as durable recurring revenue.
      Business Insider reported that CEO Grant Demareee said “Almost all of the
      military's largest plans are built in our software” while declining to cite
      specific plans because of contractual constraints, which underscores how
      difficult breadth-of-use claims are to verify independently. Across this
      pool, named deployments are overwhelmingly U.S. defense accounts, so
      customer concentration and renewal dependence on a narrow buyer set remain
      material open questions.
    claimRefs: [CU009, CU010, CU011, CU012, CU014]
    figureRefs: [FU001]
tables:
