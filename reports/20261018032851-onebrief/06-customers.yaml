  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - Air Mobility Command (AMC)
        - Air Force logistics command
        - HQ-to-wing planning, orders production, battle-rhythm events, and continuity planning
        - Production / expanded renewal
        - Entered a third consecutive fiscal year and supported real-world operations across two Combatant Commands
        - Independent corroboration is narrow and no quantitative efficiency outcome is disclosed
      - - Air Combat Command (ACC)
        - Air Force command
        - EMC3 collaboration system and mission-planning workflow augmentation
        - Pilot / rollout
        - Rollout to all ACC staff directorates plus embedded onboarding through 2025
        - Company-issued proof only; no steady-state usage or renewal metrics
      - - Army G4 / Army organizations
        - Army enterprise buyer
        - Department-wide procurement path for planning software
        - Production procurement path
        - Prime single-award enterprise contract with first task order executed within an hour
        - Order volume, end-user breadth, and spend remain undisclosed
      - - Joint Staff & major U.S. Combatant Commands
        - Joint command organizations
        - Global operational planning and collaboration
        - Production claim
        - Investor narrative says workflows that took days now happen in minutes
        - Specific commands and measured outcomes are not independently named
    notes: Proof quality ranges from named operational deployments to investor-authored narratives; logos or broad command claims are not equivalent to retention evidence.
