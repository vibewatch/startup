  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, churn, renewal rate, contract duration, and cohort data by command or program.
      whyItMatters: Customer durability is central to underwriting whether command-level adoption becomes recurring, expanding revenue.
      diligencePath: Request cohort retention, renewal, and ACV data by command/program during management diligence.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: customer-scale
      missingEvidence: Customer count, active-seat counts, task-order volume, and disclosed contract value realization across Army and Air Force deployments.
      whyItMatters: Adoption depth and revenue concentration cannot be quantified without denominators behind the public deployment claims.
      diligencePath: Request customer roster, active-user statistics, contract-value bridge, and top-account concentration from the data room.
      relatedQuestionRefs: [QU003, QU006]
    - type: missing-source
      severity: material
      topic: diversification
      missingEvidence: Credible independent proof of non-U.S. or non-military production customers and expansion revenue outside U.S. defense.
      whyItMatters: If the business is overwhelmingly concentrated in U.S. defense buyers, procurement cycles and budget shifts could dominate growth and retention.
      diligencePath: Ask for named allied or commercial references, production case studies, and revenue mix by customer category.
      relatedQuestionRefs: [QU008]
    - type: access-blocked
      severity: minor
      topic: breadth-verification
      missingEvidence: Independently verifiable command names or project names behind the broadest usage claims.
      whyItMatters: Breadth-of-use claims are directionally positive but remain hard to verify without named references.
      diligencePath: Ask management for reference customers or redacted program names that can be checked against procurement or operator testimony.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: TU003 named-customer coverage
      missingEvidence: A fuller set of independently sourced customer references beyond the publicly named AMC, ACC, Army, and broad command claims.
      whyItMatters: The named customer table is representative rather than exhaustive, so it cannot prove breadth, diversification, or renewal quality on its own.
      diligencePath: Build a reconciled customer-reference list from procurement records, operator talks, and management-supplied reference calls.
      relatedTableRefs: [TU003]
