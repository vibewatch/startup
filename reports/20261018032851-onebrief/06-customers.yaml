        - Expands buying surface beyond a single prototype program
        - Task-order volume, contract value realization, and renewal data are undisclosed
    notes: Public evidence supports command-level segmentation, but revenue mix and customer-count denominators remain undisclosed.
    claimRefs: [CU002, CU003, CU004, CU005, CU007, CU008, CU014]
