    claimRefs: [CU003, CU005, CU006, CU007, CU008, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence implies a defense-specific land-and-expand motion from workflow pain to pilot, rollout, and enterprise procurement.
    data:
      items:
        - label: Legacy workflow pain
          actor: Military staffs and planners
          stage: Problem
          tone: risk
          touchpoints:
            - Fragmented emails, slides, and disconnected planning data create the entry wedge for adoption.
        - label: Pilot with embedded onboarding
          actor: ACC and Onebrief implementation teams
          stage: Pilot
          tone: neutral
          touchpoints:
            - Embedded teams work alongside users to migrate planning workflows and benchmark efficiencies.
        - label: Directorate rollout
          actor: ACC staff directorates
          stage: Rollout
          tone: positive
          touchpoints:
            - The platform is rolled out command-wide rather than left in a single work center.
        - label: Production command workflow
          actor: AMC headquarters and operational wings
          stage: Production
          tone: positive
          touchpoints:
            - Core planning work and conference preparation move into the platform across a real command workflow.
        - label: Enterprise procurement expansion
          actor: Army contracting officers and Army G4
          stage: Expansion
          tone: positive
          touchpoints:
            - A direct Army contract vehicle enables rapid task orders after an initial prototype phase.
        - label: Breadth verification bottleneck
          actor: External diligence stakeholders
          stage: Verification
          tone: risk
          touchpoints:
            - Contractual constraints and undisclosed metrics limit independent verification of customer breadth and retention.
    claimRefs: [CU005, CU007, CU008, CU010, CU011, CU013, CU014]
callouts:
  - calloutType: insight
    title: Real command adoption is visible
    body: >-
      The chapter has stronger customer proof than a typical private defense
      software company: AMC expansion, ACC rollout, and an Army enterprise
      contract all point to real operational usage rather than logo-only
      marketing.
    claimRefs: [CU005, CU006, CU007, CU008]
  - calloutType: risk
    title: Durability and concentration are still opaque
    body: >-
      Public evidence does not disclose customer counts, retention, contract
      values, or concentration by command, and management has explicitly limited
      breadth-of-use disclosure. That keeps renewal quality and revenue
      concentration as unresolved diligence risks.
    claimRefs: [CU009, CU011, CU014]
