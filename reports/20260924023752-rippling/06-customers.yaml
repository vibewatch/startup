  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Rippling has a large and diverse customer base, but the public evidence is strongest in testimonials and integration proof rather than in audited cohort data. The company clearly resonates with software-heavy and multi-product buyers, while the weakest evidence remains around concentration, retention outside the PEO segment, and the fit for hourly operations."
  },
  "sections": [
    {
      "id": "customer-segments",
      "title": "Who buys and uses the product",
      "body": "The clearest customer fit in the fetched evidence is for software-heavy or operationally complex businesses that want HR, IT, and finance to share one employee graph. Official customer pages and AI testimonials repeatedly feature knowledge-worker companies, while comparison and review sources warn that hourly or frontline businesses have different needs. That makes the customer base broad, but not uniform: Rippling sells into multiple segments, and each segment values a different module mix. It also means product proofs can look very different depending on whether the buyer is a SaaS company, a finance team, or a frontline operator. That is why the report keeps separate customer lenses instead of collapsing them into one segment.",
      "claimRefs": ["CU001", "CU002", "CU003", "CU004"],
      "tableRefs": ["TU001"],
      "figureRefs": ["FU001"]
    },
    {
      "id": "proof-of-adoption",
      "title": "Evidence of adoption and expansion",
      "body": "The strongest public adoption signals come from the sheer volume of named testimonials, the company claims around AI-driven time savings, and the installed-base proxy that points to thousands of companies. Those sources do not prove retention on their own, but they do show that customers are willing to publicly associate with the platform and describe concrete workflow gains. That is a better signal than generic marketing copy because it ties the product to specific roles, tasks, and time savings. It suggests adoption is happening inside real workflows rather than just in trial accounts. Public proof is still the best evidence available for a private company.",
      "claimRefs": ["CU005", "CU006", "CU007", "CU008"],
      "tableRefs": ["TU002", "TU003"]
    },
    {
      "id": "concentration-and-risk",
      "title": "Concentration and risk",
      "body": "Customer risk is still only partially visible. The fetched sources show broad logos and positive case studies, but they do not give a clean cohort curve, customer concentration schedule, or retention outside narrower PEO evidence. Review sources also show that some users perceive the platform as powerful but complex, which is exactly the kind of friction that can slow expansion or make a buyer consider a specialist alternative. The open questions are concentration, renewal quality, and how often customers add modules after the first purchase. Those questions matter more here than logo count alone.",
      "claimRefs": ["CU009", "CU010", "CU011", "CU012"],
      "tableRefs": [],
      "figureRefs": []
    }
  ],
