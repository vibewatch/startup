      - number: '3.2'
        title: 差异化优势与护城河
        blocks:
          - type: paragraph
            body: >-
              信源指出的核心差异化优势在于员工数据图谱：一旦 HR、IT 和财务共享底层档案，平台便变得极难被替换，同时极易横向扩张。这筑牢了名副其实的复合型软件护城河，但也意味着 Rippling
              必须持续推出新模块以维持这种“全能溢价”。多份研报将该公司描绘为典型的复合型增长故事，印证了其护城河既源于赛道卡位，也同样取决于产品迭代节奏。这一底层数据层还让产品更容易横向扩张，因为新模块可以直接继承身份、权限和行为数据。其网络效应具有滚雪球特征：每增加一项工作流，平台迁移门槛便加码一层，在续约时也就大概率更容易守住阵地。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
