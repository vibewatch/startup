      - number: '6.3'
        title: 客户集中度与潜在风险
        blocks:
          - type: paragraph
            body: >-
              客户维度的风险目前仍处于半透明状态。所获信源展示了丰富的客户 Logo 及正面案例，却未能提供清晰的客群队列留存曲线、客户集中度明细，抑或是 PEO
              狭窄范畴之外的全面留存数据。行业评测亦显示部分用户认为平台虽强但过于繁冗，而这种体验阻力恰恰会拖累客户增购步伐，甚至促使其转向垂直领域的替代工具。核心悬念在于集中度、续约质量以及初次采买后加购模块的频次。与单纯清点
              Logo 数量相比，这些拷问显然更加举足轻重。
            claimRefs:
