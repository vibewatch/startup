      - number: '4.2'
        title: 收入模式与商业化路径
        blocks:
          - type: paragraph
            body: >-
              调研信源表明其采取模块化创收模型，而非一刀切的全包订阅制。Rippling 按照员工人头和功能模块计费，在此基础上叠加
              EOR、企业卡、硬件寄送等交易性或服务挂钩的收入。这种多元构成解释了为何一家未上市公司在缺乏公开毛利率明细的情况下依然能展现高增长：公司销售的是软件与工作流服务的捆绑包，而两者的商业经济模型截然不同。就买家感知而言，公司将工作流聚合、交叉销售与运营便利性打包进行了综合变现。这种结构也意味着在测算利润率时，必须将服务与纯软件模块拆开独立建模。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
