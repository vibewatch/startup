      - 严重程度
      - 缓释举措
      - 一票否决指标
    rows:
      - - 商业秘密 / 产品诉讼纠纷
        - Runlayer 诉讼相关报道
        - 高
        - 在产品宣传口径上保持克制审慎
        - 禁令升级或被判高额赔偿
      - - 数据隐私 / 权限访问控制
        - 平台掌控全量员工敏感数据
        - 高
        - 收紧权限配置与日志审计追踪
        - 发生实质性数据泄露事故
      - - 跨境用工合规
        - 跨国薪酬发放与 EOR 名义雇主业务
        - 高
        - 强化属地化合规落地能力
        - 频遭监管处罚或叫停业务
      - - 劳动用工与 HR 法规合规
        - 作为贯穿 HR 各工作流的核心记录系统
        - 高
        - 强化政策法务审查与合规监督
        - 资质牌照缺失或监管报备违规
    notes: 本登记表系统梳理可能冲击平台商业信誉或大企业客户采买决策的法律与合规隐患。
    enumerationScope:
      coverage: sample
      basis: Most material legal and compliance risks highlighted in the fetched evidence set.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
  - id: TR002
    title: 运营、系统质量与信息安全风险登记表
    columns:
      - 风险项
      - 佐证依据
      - 严重程度
      - 缓释举措
      - 一票否决指标
    rows:
      - - 交付实施复杂度高
        - 测评信源均指出上手门槛较陡峭
        - 高
        - 强化客户上线引导与入职交付
        - 首年客户流失率居高不下
      - - 应用集成意外中断
        - 对接海量第三方 API
        - 中
        - 部署实时监控与熔断降级预案
        - 数据同步频繁报错失效
      - - 权限策略配置疏漏
        - 基于角色的权限访问控制机制
        - 高
        - 实施默认安全的严苛权限策略
        - 发生敏感信息越权访问事故
      - - 系统吞吐规模与延迟响应
        - 底层报表与数据分析层
        - 中
        - 做好容量规划与扩容冗余
        - 出现用户可感知的明显卡顿卡死
    notes: 本表重点聚焦即使在系统表面正常运行状态下，依然可能引发服务中断或劣化客户体验的隐患。
    enumerationScope:
      coverage: sample
      basis: Operational and technical failure modes surfaced in reviews, guides, and official product descriptions.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR003
    title: 合作伙伴与外部依赖风险登记表
    columns:
      - 核心依赖项
      - 风险表现
      - 为何至关重要
      - 缓释举措
    rows:
      - - 外部 SaaS API
        - 接口失效中断
        - 集成层强依赖外部生态伙伴
        - 监控告警与多版本兼容
      - - 底层云基础设施
        - 可用性风险
        - 易诱发全局平台宕机瘫痪
        - 冗余容灾与故障自动切换
      - - 客户输入数据质量
        - 脏数据输入
        - 自动化工作流会成倍扩散错误数据
        - 严格校验规则与拦截控制
      - - 渠道合作伙伴
        - 利益与协作脱节
        - 渠道侧背书信噪比较高
        - 建立清晰明确的渠道伙伴治理机制
    notes: 依赖视角将第三方集成、云底座可靠性与数据质量视作一类战略风险，而非细枝末节的技术实现细节。
    enumerationScope:
      coverage: partial
      basis: Common dependency classes implied by the product architecture and partner/customer sources.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
  - id: TV001
    title: 投资建议研判汇总表
    columns:
      - 核心拷问
      - 明确研判
      - 关键佐证
      - 决策指征
    rows:
      - - 资金储备是否充足？
        - 是
        - Series G 轮及豪华资方结构
        - 融资断流风险极低
      - - 业务增长是否扎实？
        - 大概率属实
        - 收入与客户维度的交叉指标
        - 估值具备基本支撑逻辑
      - - 利润率是否公开透明？
        - 否
        - 缺乏经审计的毛利率明细拆解
        - 估值倍数依然充满变数
      - - 诉讼风险是否构成实质影响？
        - 是
        - Runlayer 诉讼相关报道
        - 商业信任折价依然存在
      - - 平台矩阵是否足够宽广？
        - 是
        - HR/IT/财务/AI 全栈能力
        - 既是护城河也是复杂度包袱
    notes: 本汇总表将信源证据转化为务实的尽调研判，而非机械的测算模型输出。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV012
  - id: TV002
    title: 投资逻辑与反向逻辑对照表
    columns:
      - 投资逻辑
      - 反向逻辑
      - 关键佐证
      - 决策影响
    rows:
      - - 复合型平台
        - 杂糅服务拖累的简单拼凑
        - 客户留存与模块横向广度
        - 支撑估值溢价
      - - 增购扩张收入
        - 定价机制不透明
        - 人头费叠加模块费
        - 高度依赖商业信任
      - - 雄厚资金底座
        - 估值定价过高
        - Series G 轮估值达 $16.8B
        - 增速一旦放缓回报空间受限
      - - 品牌强劲势头
        - 诉讼阴霾挥之不去
        - Runlayer 相关媒体报道
        - 应在估值倍数上给予折价
    notes: 本表特意采用正反二元对立框架，因估值高低很大程度上取决于哪套叙事占据上风。
    enumerationScope:
      coverage: sample
      basis: Most material thesis and anti-thesis points visible in the public evidence set.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 可比公司估值参考表
    columns:
      - 可比对照组
      - 公开市场信号
      - 为何具有参考价值
      - 核心研判启示
    rows:
      - - 一级市场高增长 SaaS 对标组
        - 高增长、非上市、一体化套件厂商
        - 最接近的对标框架
        - 享有溢价但绝非二级市场那种便宜价格
      - - 时薪劳动力垂直工具
        - 垂直定位、范围较窄
        - 平台广度溢价较低
        - Rippling 估值倍数应高于此类标的
      - - 二级市场 SaaS 龙头
        - 利润率与 ARR 全透明
        - 信息披露质量更高
        - 相比之下 Rippling 应享有一定折价
      - - 后期非上市同业梯队
        - 融资特征与路径相近
        - 具参考性的估值倍数区间
        - 最终估值倍数取决于利润率实证
    notes: 此处的可比估值仅作为定性参照框架，而非严谨的二级市场交易可比分析模型。
    enumerationScope:
      coverage: sample
      basis: Representative valuation anchors used when public share prices are not available.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
