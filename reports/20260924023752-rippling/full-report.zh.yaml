chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 机构定位与运营版图
        blocks:
          - type: paragraph
            body: >-
              Rippling 将自身定位为统一的劳动力管理平台，而非单点 HR 工具。公司称其能帮企业在单一系统中统筹
              HR、IT、财务等事务，并以员工数据作为贯穿各工作流的通用底层。公开资料亦显示，其办公网络广泛分布于北美、欧洲、印度及亚太地区，契合一家面向全球中端市场及大企业客户的软件厂商特征。这一版图之所以关键，是因为它表明该公司绝非单点小工具，而是一个具备足够客户需求支撑国际销售、客户成功及合规职能的多产品平台；同时也意味着公司有能力跨区域、跨职能维持分布式运营架构。鉴于公司仍为非上市公司，其分支机构清单更多体现业务方向，而非经过全面审计的精确普查。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
