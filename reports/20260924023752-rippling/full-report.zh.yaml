  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              理解 Rippling 的最佳视角是劳动力运营平台，而非单纯的 HRIS。其官方资料将产品定位为建立在共享员工数据之上的 HR、IT、财务与 AI
              自动化系统，直接将市场边界推向薪酬或福利管理之外。划定这一边界十分关键，因为企业买家可能将 Rippling
              与大型横向通用套件、身份与设备管理的单点工具，或是面向时薪与一线团队的垂直劳动力平台做比对。这一定位不仅重塑了竞对名单的构成，更改变了企业归集软件预算的归口与促成采购的核心动因。因此，该市场的定义既取决于传统
              HR 软件类别，也取决于工作流聚合能力。在实际采购中，这意味着真实的替代品集合涵盖了触达员工生命周期各个环节的产品套件、工作流中间件及垂直单点工具。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
