            body: >-
              最强烈的公开采纳信号源于大量实名背书案例、官方对 AI
              节约工时的量化主张，以及指向数千家装机客群的第三方统计。这些信源固然不能孤立证明客户留存情况，但确实展现出客户乐于公开站台并陈述切实的工作流提效成果。相比泛泛的营销宣传，这是含金量更高的信号，因为它将产品与具体岗位、任务及节省的工时直接挂钩；它表明系统渗透到了真实业务运作中，而非停留在试用账号层面。面向未上市企业，公开证言仍是目前可获取的最扎实质证。
            claimRefs:
