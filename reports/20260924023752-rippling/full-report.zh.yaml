      - number: '3.3'
        title: 产品打包、定价策略与诉讼压力
        blocks:
          - type: paragraph
            body: >-
              产品打包是一把双刃剑。Rippling 的模块化策略有助于做大增购收入，但同时也拔高了买家比价和市场教育的门槛。与 Runlayer
              的诉讼官司亦表明，该公司在开创全新产品类别的同时，也可能卷入新的法律纷争。这一打法虽极具增长爆发力，但当买家拿它与定位更加聚焦的替代方案比对时，对执行力、商业信誉和客户实证的要求也随之水涨船高。从尽职调查角度来看，该公司不仅要靠广度取胜，更需拿出铁证证明这种广度确实降低了实际运营阻力。
