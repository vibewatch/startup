  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 目标买家与核心用户画像
        blocks:
          - type: paragraph
            body: >-
              检索到的证据显示，该产品最契合重度依赖软件或业务运作复杂的企业，这类客户极度渴求 HR、IT 与财务共用同一张员工图谱。官方客户案例及 AI
              证言屡次重点展示知识型员工公司；与此同时，对比评测信源则提醒时薪制或一线劳动力企业的诉求截然不同。这导致其客户基础虽然宽广却并不均质：Rippling
              面向多个细分市场销售，而各板块看重的模块组合大相径庭。这也意味着在面对 SaaS 公司、财务团队或一线运营方时，产品实证的呈现形式差异极大。本报告因而保留了多维客户视角，而非将其机械合并为单一客群。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
