      - number: '1.3'
        title: 管理层延续性与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              Rippling 的公众形象依然紧密绑定 Parker Conrad，其过往在 Zenefits 的经历仍是公司创始人故事的核心叙事。自上次尽调以来，公司在产品和法律层面均迎来了新里程碑，包括推出聚焦 AI
              的多项功能，以及此前引发关注但最终以撤诉告终且未达成和解的 Runlayer
              公开纠纷。这些事件至关重要，既展现了产品迭代的高速度，也折射出在拥挤且易发诉讼的赛道中快节奏狂奔所伴生的风险。尽调的核心结论是：公司既持续推出肉眼可见的重量级产品，同时也背负着源于创始人背景与诉讼纠纷的严密审视，这可能波及大企业客户的采购信任度。
            claimRefs:
              - CO011
              - CO012
