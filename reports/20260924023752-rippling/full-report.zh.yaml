  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与合规监管敞口
        blocks:
          - type: paragraph
            body: >-
              本次更新中最显性的风险在于法律诉讼与声誉层面。TechCrunch、《纽约邮报》等负面信源将 Runlayer 纠纷视作公开的警示案例，即便双方诉讼此后均已撤销。当平台横跨 HR、薪酬、身份与 AI
              访问权限时，诉讼风险不容小觑——买家担心的不仅是官司本身，更在于产品决策会在多快时间内演变成信任危机。在供应商能够触控敏感操作的赛道上，信任本身就是产品不可或缺的一环。买家采购的绝非单纯功能特性，更是厂商的专业判断与风控流程。这一点在大企业采购谈判中暴露得尤为明显。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
