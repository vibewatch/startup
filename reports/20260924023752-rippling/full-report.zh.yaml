        title: 支撑图表
        blocks:
          - type: callout
            title: 公开业务规模明确，审计财务状况仍模糊
            body: 我们尽可确信该公司体量庞大且弹药充足，但由于缺乏公开且经审计的收入、毛利率及分部明细数据，估值测算的精确度依然受限。
