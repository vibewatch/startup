      - number: '1.2'
        title: 融资历程、业务规模与运营指标
        blocks:
          - type: paragraph
            body: >-
              本次更新证实，Rippling 仍是劳动力运营领域资金最充裕的非上市软件厂商之一。公开融资文件及第三方调研均指向 2025 年 5 月的 Series G 轮融资，对应 $16.8B 估值及约 $1.85B
              的累计融资总额。第三方运营数据亦表明其在收入、客户数、留存率和员工规模上均具可观体量，但最新的经审计财务报表仍未公开。这种高额融资、据报道留存表现优异与披露透明度有限并存的特征，正是后期非上市软件公司的典型写照——其估值主要依靠增长预期的可信度，而非公开市场可比公司估值倍数。
            claimRefs:
