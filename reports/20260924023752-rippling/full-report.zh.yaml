  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品核心功能与价值
        blocks:
          - type: paragraph
            body: >-
              理解 Rippling 产品的最佳定位是面向员工运营的工作流引擎。公司称其基于统一的员工档案来编排 HR、IT、财务与 AI
              任务，所引信源亦反复将该共享档案称为平台最核心的产品基元。在业务实践中，这意味着企业采买的是一个运营操作系统，而非单独某款应用。这一区别在买家评估替换风险与实施范围时格外重要，同时也解释了为何其销售推进过程更像平台级采购，而非单一功能采购。这使该产品超越了功能模块的机械拼凑：它实质上是一个统揽跨应用权限、自动化、设备管理、报表及员工操作的控制中枢。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
