            body: >-
              第三方机构数据持续指出其年化收入约 $570M、客户数约 20,000 家，且 PEO 业务板块的年度客户留存率达
              99.5%，但这并非经过审计的正式财报。目前最关键的缺口依然是软件与服务收入在公开层面的拆分比例，以及毛利率、ARR 和 PEO
              狭窄范畴之外的真实留存表现。在这些疑团解开之前，其估值依然更多依赖于团队可信度与同业参照，而非全透明的财务模型。这也决定了尽调工作必须倚重多方信号交叉验证，而无法仅靠阅读一份干净明了的公开损益表。一套更完备的模型亟需获得跨产品与跨地域的分部披露数据。
