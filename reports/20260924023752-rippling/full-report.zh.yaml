  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历程与资本架构
        blocks:
          - type: paragraph
            body: >-
              本次更新显示，Rippling 稳居资金实力最雄厚的非上市软件公司梯队。公开融资材料与第三方研报均锁定 2025 年 5 月完成的 Series G 轮融资，对应 $16.8B 估值及约 $1.85B
              累计融资。这一资本画像表明，公司早已跨过生死存亡的资金门槛，后续融资更多是为了保留战略灵活性、提供员工流动性以及筹备首次公开募股（IPO）。其资本结构亦透露出投资机构承销的是其业务规模与平台广度，而非单一产品线。这也促使估值讨论聚焦于规模体量与执行力，而非仅看短期运行率增速。这构成了当前尽调的核心命题。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
