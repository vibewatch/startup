    "number": 8,
    "title": "Valuation",
    "summary": "Rippling still screens as a premium private compound-software company, but the valuation case remains stretched because public evidence is incomplete and the product/legal surface is broad. The refresh supports a research-more / hold posture rather than a clean buy signal, with the main gap still being audited revenue quality and a clearer path from scale to durable margin."
  },
  "sections": [
    {
      "id": "valuation-anchor",
      "title": "Current valuation anchor",
      "body": "Rippling's public anchor remains the May 2025 Series G at a $16.8 billion valuation. Third-party profiles continue to pair that mark with about $1.85 billion of total capital raised and roughly $570 million of annualized revenue, which implies a lofty but not absurd multiple for a company with strong retention and a wide product surface. The problem is not that the valuation is impossible; the problem is that the public evidence still leaves too many key inputs opaque.",
      "claimRefs": ["CV001", "CV002", "CV003", "CV004"],
      "tableRefs": ["TV001"],
      "figureRefs": ["FV001"]
    },
    {
      "id": "bull-bear",
      "title": "Bull and bear framing",
      "body": "The bull case is that Rippling compounds like a platform company: strong customer retention, broad product expansion, and enough capital to keep investing. If product breadth keeps turning into cross-sell, the premium can persist. That would make Rippling look more like a compound platform than a bundle of tools. The market wants to see that in the numbers. Otherwise the premium is fragile. That is the current risk today now. The bear case is that the same breadth hides service-like economics, integration complexity, and litigation drag, all of which can suppress multiple expansion. That is why the same company can look expensive and still be worth watching. It is a quality question more than a binary question. The next refresh should test that claim again. Put differently, the valuation can be defended only if the company keeps proving that it is more software than services and more platform than bundle.",
      "claimRefs": ["CV005", "CV006", "CV007", "CV008"],
      "tableRefs": ["TV002"],
      "figureRefs": []
    },
    {
      "id": "diligence-verdict",
      "title": "Verdict and diligence asks",
      "body": "The best public conclusion is still a stretched but credible category leader that deserves continued diligence, not a clean underwriting win. Investors should treat the current mark as a trust-based premium. Investors should press for audited revenue quality, gross margin, ARR, and retention outside the PEO slice before paying a premium multiple. The key question is whether the platform can convert product breadth into durable economics fast enough to justify the mark.",
      "claimRefs": ["CV009", "CV010", "CV011", "CV012"],
      "tableRefs": ["TV003"],
      "figureRefs": []
    }
  ],
