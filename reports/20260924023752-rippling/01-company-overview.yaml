    "number": 1,
    "title": "Company Overview",
    "summary": "Rippling is a late-stage private workforce platform that combines HR, IT, finance, and related workflow automation on a single employee-data layer. Public materials still show Parker Conrad as the public founder-CEO figure, while current financing and operating data indicate a large but still privately held compound-software business with meaningful scale, strong retention, and an active adverse-litigation history."
  },
  "sections": [
    {
      "id": "identity-footprint",
      "title": "Identity and operating footprint",
      "body": "Rippling presents itself as a unified workforce management platform rather than a single-point HR tool. The company says it helps businesses run HR, IT, finance, and more from one system, with employee data acting as the common layer across workflows. Public company materials also show a broad office footprint across North America, Europe, India, and Asia-Pacific, which is consistent with a software company selling globally into mid-market and enterprise customers. That footprint matters because it suggests the business is not a small point solution; it is a multi-product platform with enough demand to support international sales, customer success, and compliance functions. It also implies the company can sustain a distributed operating model across regions and functions. The company is still private, so the office list is directional rather than a fully audited census.",
      "claimRefs": ["CO001", "CO002", "CO003", "CO004"],
      "tableRefs": ["TO001"],
      "figureRefs": ["FO001"]
    },
    {
      "id": "funding-scale",
      "title": "Funding, scale, and operating metrics",
      "body": "The refresh confirms that Rippling remains one of the best-capitalized private software vendors in workforce operations. Public financing materials and third-party profiles converge on a May 2025 Series G, a $16.8 billion valuation, and roughly $1.85 billion of total capital raised. Third-party operating data also continue to point to meaningful scale in revenue, customers, retention, and employee count, but the latest audited financial statements still are not public. That combination of large funding, strong reported retention, and limited disclosure is typical of late-stage private software, where valuation depends heavily on growth credibility rather than public-market comparables.",
      "claimRefs": ["CO005", "CO006", "CO007", "CO008", "CO009", "CO010"],
      "tableRefs": ["TO002", "TO003"]
    },
    {
      "id": "leadership-milestones",
      "title": "Leadership continuity and milestones",
      "body": "Rippling's public identity still revolves around Parker Conrad, whose prior Zenefits history remains part of the company's founder narrative. The business has also added new product and legal milestones since the prior refresh, including AI-focused launches and the public Runlayer dispute that later ended without a settlement. Those events matter because they show both product velocity and the risks that come with moving quickly in a crowded, litigation-prone category. For diligence, the important takeaway is that the company continues to ship visible products while also carrying founder-specific and litigation-specific scrutiny that can affect enterprise trust.",
      "claimRefs": ["CO011", "CO012"],
      "tableRefs": [],
      "figureRefs": []
    }
  ],
