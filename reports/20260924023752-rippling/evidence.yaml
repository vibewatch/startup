evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A complete cap table, secondary pricing, and board-rights summary from a company disclosure or investor memo.
    whyItMatters: Private-company control and dilution terms affect valuation confidence and refresh judgment.
    diligencePath: Request a current financing memo, data room extract, or board-approved investor update.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-investors
    missingEvidence: A complete, company-approved roster of current executives and all material investors.
    whyItMatters: The public sources support only the named founders, a few executives, and lead investors.
    diligencePath: Obtain the latest board or investor presentation with current roster detail.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: A third-party or company-backed 2026 market-sizing report with explicit TAM/SAM/SOM math.
    whyItMatters: This would let the report move from adoption lenses to a more explicit market-size estimate.
    diligencePath: Pull a current analyst report or build a bottom-up sizing model from customer counts and spend assumptions.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: A current market share or win-rate benchmark against the named competitors.
    whyItMatters: The sources support category framing, but not exact share trends or deal conversion rates.
    diligencePath: Request sales win/loss data, customer reference lists, or a third-party market-share study.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, ARR, and product-level retention outside the PEO segment.
    whyItMatters: Those inputs drive whether the current valuation should be treated as stretched or merely fair.
    diligencePath: Request a recent finance packet, board deck, or investor memo with a product-line bridge.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: developer-signal
    missingEvidence: A direct public repository, changelog, or package registry signal from Rippling itself.
    whyItMatters: The current proxies indicate discussion, but not an open-source or API-centric developer footprint.
    diligencePath: Check whether Rippling publishes a public developer portal, changelog, or SDK repo.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: A public or board-level retention curve, concentration schedule, or renewal dataset.
    whyItMatters: Customer proof is strong on anecdotes but weak on durable economics.
    diligencePath: Ask for cohort retention, top-customer concentration, and net expansion by product line.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU002
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: coverage
    missingEvidence: A segmented cohort breakdown showing which customer groups expand fastest.
    whyItMatters: That would close the remaining partial coverage on the customer-segmentation question.
    diligencePath: Pull product-line renewals or cohort data by customer segment.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: legal-discovery
    missingEvidence: Court filings or settlement documents that show the exact legal outcome and customer impact.
    whyItMatters: The public articles describe the dispute but do not fully resolve the commercial downside.
    diligencePath: Review case dockets, filings, or counsel memos for the final legal posture.
    relatedQuestionRefs:
      - QR001
      - QR005
    relatedTableRefs:
