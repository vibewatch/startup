    "number": 2,
    "title": "Market Analysis",
    "summary": "Rippling sits in a broad workforce-operations market that spans HR, IT, payroll, identity, spend, and compliance workflows. The refresh supports a view that buyers adopt the platform when employee data, device management, and finance workflows need to be joined, but the market is still fragmented across horizontal suites and vertical hourly-workforce tools."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and substitutes",
      "body": "Rippling is best understood as a workforce-operations platform, not just an HRIS. Its own materials frame the product as HR, IT, finance, and AI automation on top of shared employee data, which pushes the market boundary beyond payroll or benefits alone. That boundary matters because buyers can compare Rippling with broad horizontal suites, point tools for identity and device management, and specialized workforce platforms aimed at hourly or frontline teams. That framing is important because it changes which companies get counted as competitors, which budgets get attributed to the category, and which adoption triggers matter most. The market is therefore defined as much by workflow consolidation as by classic HR software categories. In practice, that means the real substitute set includes product suites, workflow layers, and specialist tools that touch different parts of the employee lifecycle.",
      "claimRefs": ["CM001", "CM002", "CM003", "CM004"],
      "tableRefs": ["TM001"],
      "figureRefs": ["FM001"]
    },
    {
      "id": "buyers-sizing",
      "title": "Buyer segments and sizing lenses",
      "body": "The strongest adoption signal comes from companies that need to coordinate people data, apps, devices, and spend in one place. That tends to include knowledge-worker companies with distributed SaaS stacks, globally expanding businesses that need payroll and compliance support, and mixed-workforce operators that want a single control plane. Third-party market pages also show that the installed base spans several employee-size bands, which is consistent with an increasingly modular buying motion rather than a single persona or company size.",
      "claimRefs": ["CM005", "CM006", "CM007", "CM008"],
      "tableRefs": ["TM002", "TM003"]
    },
    {
      "id": "drivers-constraints",
      "title": "Growth drivers and constraints",
      "body": "Demand is driven by rising compliance complexity, more remote and cross-border workers, and the desire to reduce duplicate systems. Constraints are also clear: Rippling's modular pricing is quote-based, buyer fit changes materially by workforce type, and general-purpose platforms can underperform specialist hourly-workforce tools on scheduling, tips, and frontline hiring. The market still rewards consolidation, but the user clearly needs to model operational fit rather than assume all workforce software is interchangeable. The biggest mistake would be to use one generic software category to explain every buyer.",
      "claimRefs": ["CM009", "CM010", "CM011", "CM012"],
      "tableRefs": [],
      "figureRefs": []
    }
  ],
