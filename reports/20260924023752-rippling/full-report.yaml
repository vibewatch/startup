companyProfile:
  summary: >-
    Rippling is a late-stage private workforce-management platform that combines HR, IT, finance, payroll, and AI-driven
    workflow automation on a shared employee-data layer. The company is still centered on founder-CEO Parker Conrad,
    with public financing materials showing a May 2025 Series G at a $16.8 billion valuation and roughly $1.85 billion
    of total capital raised. Third-party profiles continue to point to roughly $570 million of annualized revenue, about
    20,000 customers, and strong retention, but the public evidence still leaves the mix between software and services
    only partially disclosed.
