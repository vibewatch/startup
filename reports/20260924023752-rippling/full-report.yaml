              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU012
      - number: '6.2'
        title: Evidence of adoption and expansion
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals come from the sheer volume of named testimonials, the company claims
              around AI-driven time savings, and the installed-base proxy that points to thousands of companies. Those
              sources do not prove retention on their own, but they do show that customers are willing to publicly
              associate with the platform and describe concrete workflow gains. That is a better signal than generic
              marketing copy because it ties the product to specific roles, tasks, and time savings. It suggests
              adoption is happening inside real workflows rather than just in trial accounts. Public proof is still the
              best evidence available for a private company.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Concentration and risk
        blocks:
          - type: paragraph
            body: >-
              Customer risk is still only partially visible. The fetched sources show broad logos and positive case
              studies, but they do not give a clean cohort curve, customer concentration schedule, or retention outside
              narrower PEO evidence. Review sources also show that some users perceive the platform as powerful but
              complex, which is exactly the kind of friction that can slow expansion or make a buyer consider a
              specialist alternative. The open questions are concentration, renewal quality, and how often customers add
              modules after the first purchase. Those questions matter more here than logo count alone.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Positive testimonials do not replace cohort data
            body: >-
              Public customer stories are strong on usability and time savings, but they do not by themselves prove
              durable retention or low concentration risk.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The most visible risk in the refresh is legal and reputational. TechCrunch, the New York Post, and other
              adverse sources describe the Runlayer dispute as a public cautionary tale, even though the lawsuits were
              later dropped. For a platform that sits across HR, payroll, identity, and AI access, litigation risk
              matters because buyers worry not only about the lawsuit itself but also about how quickly product
              decisions can become trust questions. In a category where the vendor can control sensitive actions, trust
              is itself part of the product. Buyers are not only buying features; they are buying judgment and process.
              That becomes visible during enterprise procurement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR012
      - number: '7.2'
        title: Operational, security, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the product's breadth is both a strength and a vulnerability. Review sources and technical
              guides note that the platform is powerful but complex, that migrations can be hard, and that integrations
              can break when external APIs change. Because the system touches payroll, permissions, and devices, a small
              failure can become a multi-team incident rather than a contained product bug. That increases the need for
              consistent rollback, logging, and support processes. It also raises the cost of sloppy release management.
              Reliability work is therefore a commercial requirement, not just an engineering preference.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Execution risk and mitigation
        blocks:
          - type: paragraph
            body: >-
              The company can mitigate some of that risk with clearer permissions, better support, and tighter
              implementation discipline, but the public evidence does not prove that every customer gets that
              experience. The key diligence question is whether Rippling can keep scaling breadth without letting trust,
              support, or deployment complexity outrun its product gains. That is especially important for a platform
              used as a system of record. A single bad rollout can create outsized brand damage. The support team has to
              be part of the control plane, not an afterthought. Otherwise incidents and renewals feed each other. That
              is a serious diligence issue today.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth magnifies failures
            body: >-
              Rippling's integrated stack creates a failure multiplier: an issue in permissions, integrations, or legal
              trust can affect many customer workflows at once.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation anchor
        blocks:
          - type: paragraph
            body: >-
              Rippling's public anchor remains the May 2025 Series G at a $16.8 billion valuation. Third-party profiles
              continue to pair that mark with about $1.85 billion of total capital raised and roughly $570 million of
              annualized revenue, which implies a lofty but not absurd multiple for a company with strong retention and
              a wide product surface. The problem is not that the valuation is impossible; the problem is that the
              public evidence still leaves too many key inputs opaque.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV012
      - number: '8.2'
        title: Bull and bear framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Rippling compounds like a platform company: strong customer retention, broad product
              expansion, and enough capital to keep investing. If product breadth keeps turning into cross-sell, the
              premium can persist. That would make Rippling look more like a compound platform than a bundle of tools.
              The market wants to see that in the numbers. Otherwise the premium is fragile. That is the current risk
              today now. The bear case is that the same breadth hides service-like economics, integration complexity,
              and litigation drag, all of which can suppress multiple expansion. That is why the same company can look
              expensive and still be worth watching. It is a quality question more than a binary question. The next
              refresh should test that claim again. Put differently, the valuation can be defended only if the company
              keeps proving that it is more software than services and more platform than bundle.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Verdict and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The best public conclusion is still a stretched but credible category leader that deserves continued
              diligence, not a clean underwriting win. Investors should treat the current mark as a trust-based premium.
              Investors should press for audited revenue quality, gross margin, ARR, and retention outside the PEO slice
              before paying a premium multiple. The key question is whether the platform can convert product breadth
              into durable economics fast enough to justify the mark.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation stance remains stretched
            body: >-
              The current evidence supports a hold / research-more stance because the company looks strong but still not
              fully underwritten. That is the right posture until the margins are clearer.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV012
