        - Discount the multiple
    notes: The table is intentionally binary because valuation depends on which narrative dominates.
    enumerationScope:
      coverage: sample
      basis: Most material thesis and anti-thesis points visible in the public evidence set.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Comparable valuation table
    columns:
      - comparable
      - public signal
      - why it matters
      - takeaway
    rows:
      - - Private SaaS comp set
        - High-growth, private, integrated suites
        - Closest framing
        - Premium but not public-market cheap
      - - Hourly-workforce tools
        - Specialist, narrower scope
        - Lower breadth premium
        - Rippling should trade above them
      - - Public SaaS leaders
        - Transparent margins and ARR
        - Better disclosure
        - Rippling deserves a discount to them
      - - Late-stage private peers
        - Similar financing pattern
        - Relevant multiple band
        - Multiple depends on margin proof
    notes: Comparable valuation here is a framing device rather than a clean trading comp model.
    enumerationScope:
      coverage: sample
      basis: Representative valuation anchors used when public share prices are not available.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
