      - number: '1.2'
        title: Funding, scale, and operating metrics
        blocks:
          - type: paragraph
            body: >-
              The refresh confirms that Rippling remains one of the best-capitalized private software vendors in
              workforce operations. Public financing materials and third-party profiles converge on a May 2025 Series G,
              a $16.8 billion valuation, and roughly $1.85 billion of total capital raised. Third-party operating data
              also continue to point to meaningful scale in revenue, customers, retention, and employee count, but the
              latest audited financial statements still are not public. That combination of large funding, strong
              reported retention, and limited disclosure is typical of late-stage private software, where valuation
              depends heavily on growth credibility rather than public-market comparables.
            claimRefs:
