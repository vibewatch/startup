      - number: '4.2'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The sources support a modular revenue model rather than a single all-in subscription. Rippling charges per
              employee and per module, then layers in EOR, cards, shipping, and other transactional or services-linked
              revenue. That mix helps explain how a private company can show strong growth while still lacking a public
              gross-margin bridge: the business is selling a bundle of software and workflow services that do not all
              behave the same way economically. In buyer terms, the company is monetizing workflow consolidation,
              cross-sell, and operational convenience together. The mix also implies that services and modules must be
              modeled separately when estimating margin.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Disclosure gaps and diligence questions
        blocks:
          - type: paragraph
            body: >-
              Third-party profiles continue to point to about $570 million of annualized revenue, about 20,000
              customers, and 99.5% annual client retention in the PEO segment, but those are not audited statements. The
              most important gap is still the public mix between software and services, along with gross margin, ARR,
              and retention outside the narrower PEO lens. Until those are closed, valuation depends more on credibility
              and comparables than on a fully transparent financial model. That makes diligence more about triangulating
              signals than about reading a clean public income statement. A more complete model would need segment-level
              disclosures across products and geographies.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The valuation question is still about disclosure quality
            body: >-
              Rippling looks expensive or stretched only if the market assumes SaaS-like margin quality without proof.
              The missing audited bridge is the biggest underwriting gap.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product does
        blocks:
          - type: paragraph
            body: >-
              Rippling's product is best understood as a workflow engine for employee operations. The company says it
              uses one employee record to orchestrate HR, IT, finance, and AI tasks, and the fetched sources repeatedly
              describe that shared record as the core product primitive. In practice, that means buyers are buying an
              operating layer rather than a single app. The distinction matters when they evaluate replacement risk and
              implementation scope. It also explains why the sales motion can feel like a platform sale instead of a
              simple feature sale. That makes the product more than a bundle of modules: it is a control plane for
              permissions, automation, device management, reporting, and employee actions across apps.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE009
              - CE012
      - number: '5.2'
        title: Architecture and workflows
        blocks:
          - type: paragraph
            body: >-
              The architecture evidence points to a layered system built around employee identity, permissions,
              integrations, and reporting. Public pages say Rippling can provision devices, connect to hundreds of apps,
              and generate reports from a unified data model. That is a meaningful engineering moat because every new
              module has a common foundation, but it also means the platform has to keep every layer reliable enough for
              payroll, access control, and finance workflows to run in sync. Any failure in one layer can propagate
              quickly across the rest of the stack. That is why security and permissions reviews matter so much in this
              category.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE009
      - number: '5.3'
        title: Trust, security, and maturity
        blocks:
          - type: paragraph
            body: >-
              The product also carries the usual trust burden of a system of record. Review and comparison sources
              praise the depth, but they also note implementation complexity and a meaningful learning curve. That is
              consistent with a platform that can replace several tools at once: it is powerful because it is broad, but
              the same breadth raises the bar for security, permissions hygiene, support quality, and change management.
              The diligence question is whether the team can keep complexity invisible to admins. If not, the product
              loses much of its consolidation advantage.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth increases both power and complexity
            body: >-
              Rippling's architecture is attractive because modules share a single data model, but that also makes
              implementation quality and permission hygiene critical.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who buys and uses the product
        blocks:
          - type: paragraph
            body: >-
              The clearest customer fit in the fetched evidence is for software-heavy or operationally complex
              businesses that want HR, IT, and finance to share one employee graph. Official customer pages and AI
              testimonials repeatedly feature knowledge-worker companies, while comparison and review sources warn that
              hourly or frontline businesses have different needs. That makes the customer base broad, but not uniform:
              Rippling sells into multiple segments, and each segment values a different module mix. It also means
              product proofs can look very different depending on whether the buyer is a SaaS company, a finance team,
              or a frontline operator. That is why the report keeps separate customer lenses instead of collapsing them
              into one segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
