chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Rippling presents itself as a unified workforce management platform rather than a single-point HR tool.
              The company says it helps businesses run HR, IT, finance, and more from one system, with employee data
              acting as the common layer across workflows. Public company materials also show a broad office footprint
              across North America, Europe, India, and Asia-Pacific, which is consistent with a software company selling
              globally into mid-market and enterprise customers. That footprint matters because it suggests the business
              is not a small point solution; it is a multi-product platform with enough demand to support international
              sales, customer success, and compliance functions. It also implies the company can sustain a distributed
              operating model across regions and functions. The company is still private, so the office list is
              directional rather than a fully audited census.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
