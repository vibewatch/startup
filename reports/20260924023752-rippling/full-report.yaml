      - number: '1.3'
        title: Leadership continuity and milestones
        blocks:
          - type: paragraph
            body: >-
              Rippling's public identity still revolves around Parker Conrad, whose prior Zenefits history remains part
              of the company's founder narrative. The business has also added new product and legal milestones since the
              prior refresh, including AI-focused launches and the public Runlayer dispute that later ended without a
              settlement. Those events matter because they show both product velocity and the risks that come with
              moving quickly in a crowded, litigation-prone category. For diligence, the important takeaway is that the
              company continues to ship visible products while also carrying founder-specific and litigation-specific
              scrutiny that can affect enterprise trust.
