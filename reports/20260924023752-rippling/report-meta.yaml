  topStrengths:
    - Broad employee-data platform with product breadth across HR, IT, finance, and AI
    - Strong reported customer retention and large installed-base signals
    - Well-capitalized private-market position with public IPO-prep hints
  topRisks:
    - Audited financials and gross-margin detail remain opaque
    - Legal and trust exposure from public disputes and broad access to sensitive data
    - Complex implementation and weaker fit for some hourly-workforce buyers
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, and the mix between software and service-heavy products.
    - CAC, payback, retention, and concentration outside the narrower public PEO and review evidence.
    - Full cap-table terms, preferences, secondary pricing, and governance rights at the Series G mark.
    - >-
      Licensing, legal-entity, and country-by-country compliance completeness for payroll and global employment
      products.
    - Litigation discovery detail, possible settlement paths, and customer impact from the Runlayer matter.
