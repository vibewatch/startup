      - CV006
      - CV007
      - CV009
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 牛市
        - 工厂覆盖转化为持久的 SaaS 扩张；市场份额说法得到验证；留存和利润率强劲。
        - 目前无法支持任何数值区间；只有在 KPI 得到核验后，证据才足以支持测试已观察到的外部区间上沿。
        - 公司报告的覆盖范围无法通过独立的客户和收入核对。
        - 经审计的 ARR 增长、队列留存、毛利率和清晰的 Series D 条款会强化这一情景。
      - - 基准
        - 商业进展延续，但运营和融资透明度仍不完整。
        - 仅将已观察到的 $1-2.5B Dealroom 区间作为尽调参考，不视为公允价值或入场目标。
        - 实际 Series D 价格和优先股堆叠无法提供足够的下行保护。
        - 这最符合当前组合：近期轮次信号仍在，但投资判断所需输入缺失。
      - - 熊市
        - 该轮融资按报告中的规模定价，但经常性收入经济性、稀释幅度和退出准备度仍然薄弱或不透明。
        - 没有经过核验的收入、现金使用和优先级，就无法计算可信的估值下限；应当回避，而不是臆造折价。
        - 出现降价轮、留存疲弱、收入集中，或高优先级权利形成的压制。
        - 如果一手文件无法核对融资追踪器，或管理层不提供 KPI 细节，这一情景会增强。
    notes: 情景具有条件性且偏定性，因为指定证据只提供了一个宽泛的外部估值区间，没有经过核验的交易价格、运营预测或回报分母。
    claimRefs:
      - CV005
      - CV006
