companyProfile:
  summary: >-
    Black Lake Technologies 是一家总部位于上海的制造业软件公司，成立于 2016 年，如今围绕生产全流程推广云 MES、 工厂协作和工业 AI 智能体工作流。公开资料及近期报道显示，公司确有多轮融资历史、2026
    年 D 轮融资和大规模 工厂覆盖主张，但收入质量、留存和所有权条款仍存在重大披露不足。
  founders:
    - name: Yuxiang Zhou
      role: 创始人兼首席执行官
      background: 从金融和投资背景转型为工业软件创始人。
      claimRefs:
        - CO008
  foundingLocation: Shanghai, China
