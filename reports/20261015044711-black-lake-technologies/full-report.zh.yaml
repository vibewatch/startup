  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 支持证据
      - 哪些信息会改变判断
    rows:
      - - 正方
        - Black Lake 似乎在 2026 年再次筹得机构资本。
        - Caplight 列出 2026 年 4 月 23 日的 Series D。
        - 审阅已签署的条款清单和资金到账凭证后，提高置信度。
      - - 正方
        - 公司可能拥有可观的商业覆盖。
        - LinkedIn 公司页面宣称覆盖近 40,000 家工厂、占据 52.7% 的细分市场份额。
        - 待客户级和第三方验证把工厂、客户及活跃付费部署对上后，再提高置信度。
      - - 正方
        - 经常性软件估值方法可能适用于该商业模式。
        - Dealroom 将 Black Lake 定义为订阅制 SaaS。
        - 只有在 ARR、留存、利润率和增长得到验证后，才使用收入倍数。
      - - 反方
        - 公开融资时间线尚未对齐。
        - Startup Fundraising 仍将 2021 年 2 月称为最新披露轮次，而 Caplight 列出 2026 年 4 月的 Series D。
        - 用一手交割文件和投资者确认来解决。
      - - 反方
        - 公开估值区间过宽，无法据此严格制定入场纪律。
        - Dealroom 报告 $1-2.5B；Caplight 未显示 Series D 金额或估值。
        - 需要准确的投前估值、投后估值、股价和稀释幅度。
      - - 反方论点
        - 规模口径可能使用了不断变化的分母。
        - 公司提供的简介提到近 5,000 家早期客户，而 LinkedIn 声称覆盖近 40,000 家工厂。
        - 核对付费客户、工厂、用户、供应链参与者和活跃队列。
    notes: 覆盖范围仅限于指定的预取来源；公司发布的规模说法不视为独立验证，两个融资追踪器也有意作为相互冲突的记录呈现。
