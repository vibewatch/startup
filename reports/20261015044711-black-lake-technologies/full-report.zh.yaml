        title: 展示材料
        blocks:
          - type: callout
            title: 中小企业可及性是最清晰的公开切入点
            body: 最强的外部可见差异化不是已发布的正面基准，而是一套产品包装叙事：按需付费部署、快速上线，以及有意触达经常被 重量级 MES 忽略的小型工厂。
            calloutType: insight
            claimRefs:
              - CP003
              - CP007
              - CP008
          - type: callout
            title: 具名同业基准仍然稀薄
            body: 本章可以描绘竞争者类别和指示性对手名称，但指定资料池尚未为大多数具名同业提供经验证的 2026 年价格、迁移或 参考客户证据，这限制了对护城河持久性的判断。
            calloutType: risk
            claimRefs:
              - CP012
              - CP015
