  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 截至 2026 年 10 月，按影响和可能性排列 Black Lake 主要公开证据风险的定性矩阵。
    data:
      columns:
        - 影响
        - 可能性
        - 缓解成熟度
      rows:
        - label: 部署集成 / 变革管理拖累
          values:
            - text: 严重
              note: 客户现场集成是指定资料池中最明确的外部不利因素。
            - text: 高
              note: 独立评论称，工厂 IT 异构性和变革管理仍是采用瓶颈。
            - text: 中等
              note: Alibaba 的营销材料宣称实施更快、集成更容易，但没有经审计的推广队列。
        - label: Series D 后的国际扩张
          values:
            - text: 严重
              note: 当前战略取决于将新资本转化为海外进展。
            - text: 中
              note: 管理层此前将东南亚描述为概念验证，而非规模化执行。
            - text: 中等
              note: 新资本和合作伙伴信号有所帮助，但区域运营证据仍然薄弱。
        - label: KPI 定义与披露漂移
          values:
            - text: 偏高
              note: 不一致的收入、客户、员工数量和估值快照可能扭曲投资判断。
            - text: 高
              note: 当前公开来源之间已经存在分歧。
            - text: 低
              note: 缓解依赖管理层核对，而不是公开证据。
        - label: 服务能力错配
          values:
            - text: 偏高
              note: 若确实覆盖 40,000 家工厂，就需要大量的上线、支持和治理能力。
            - text: 中
              note: 规模说法被反复提及，但活跃站点深度和人员配置尚未核对。
            - text: 低
              note: 客户证言不能替代续约、使用率或服务负载数据。
        - label: 依赖合作伙伴渠道
          values:
            - text: 偏高
              note: 云和生态合作伙伴出现在市场进入链路中。
            - text: 中
              note: 资料池显示合作伙伴存在，但没有呈现确切经济性或集中度。
            - text: 中等
              note: 如果尽调证实渠道贡献和可迁移性，依赖程度或许可控。
        - label: 法律 / 网络安全盲点
          values:
            - text: 严重
              note: 隐藏的事故或合规缺口会立即影响企业投资判断。
            - text: 较低
              note: 指定资料池中没有出现有力的监管、法院或事故披露。
            - text: 低
              note: 指定证据集中没有公开的缓解方案。
    approximationNotes: 定性矩阵源自风险登记表和公开来源一致性检查；不代表存在数值评分模型。
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR008
      - CR010
      - CR013
      - CR015
