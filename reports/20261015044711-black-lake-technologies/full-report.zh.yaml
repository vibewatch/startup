      - number: '3.3'
        title: 持久性与未决风险
        blocks:
          - type: paragraph
            body: >-
              乐观情形是 Black Lake 正试图沿价值链上移，从记录和协调进入运营决策支持。Fortune 称产品如今包含可读取订单、 生成报价和安排生产的智能体，公司的 2026 年公关材料又加入采购、质量和 CAD
              转流程自动化主张。如果这些能力能在真实 工厂中运行，它们可能使 Black Lake 比单一执行工具更难被替代。风险在于公开证明仍不均衡：Fortune 明确表示更广泛的工业 AI
              论点仍未得到证明，具名同业的价格和切换数据仍很少，财新较早关于东南亚的报道也仍将该地区描述为概念验证，而非 已完全规模化的第二战场。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
              - CP015
              - CP016
