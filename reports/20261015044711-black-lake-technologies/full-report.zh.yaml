              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观投资判断
        blocks:
          - type: paragraph
            body: >-
              订阅式 SaaS 模式是最合适的起始视角，因为 Dealroom 如此描述 Black Lake，但指定证据中的公开来源没有提供采用收入倍数
              方法所需的收入、ARR、增长、毛利率、留存或现金流数据。乐观情形要求公司的工厂覆盖和市场份额主张转化为持久的扩张收入和
              健康利润率。基准情形是商业持续进展，但透明度不足以确定进入倍数。悲观情形是融资按公司报告的规模定价，而运营质量、稀释 和优先权仍被隐藏。精确的情景估值区间或概率会制造虚假精确；唯一观察到的区间是 Dealroom
              的 $1-2.5 billion 区间，它是市场数据指示，而非经验证的交易价值。因此，情景变化应与文件级证据绑定，而不是编造数字预测。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
