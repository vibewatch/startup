              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与投资论点失效
        blocks:
          - type: paragraph
            body: >-
              公开证据没有证明 IPO 或并购准备度。EquityZen 将 IPO、合并或收购以及符合条件的 Express Deals 描述为一般私人投资退出路径，但没有证明当前存在 Black Lake
              二级市场或公司特定退出时间表。Dealroom 报告股权结构表上有 14 名投资者，这使得在评估新仓位前理解股份类别和优先权顺位更加重要。下一套尽调材料应包括已签署的 D
              轮条款清单、投后股权结构表、每股价格、清算优先权、董事会权利，以及覆盖收入或 ARR、毛利率、留存、集中度、现金使用和部署定义的 KPI 桥接。若管理层不提供这些材料、所称
              工厂规模无法转化为经常性经济性，或新一轮资金排在沉重的优先股堆叠之后且没有可支撑的回报路径，投资论点即告失效。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开证据支持尽调，而非批准价格
            body: 继续关注 Black Lake，但在一手融资文件和当前运营 KPI 支持进入估值及目标回报之前，推迟任何投资决定。
            calloutType: recommendation
            claimRefs:
