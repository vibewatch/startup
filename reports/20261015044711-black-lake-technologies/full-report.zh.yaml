        title: 领导层、资本基础与披露质量
        blocks:
          - type: paragraph
            body: >-
              可访问资料中的公开领导层较为单薄：Yuxiang Zhou 一贯被介绍为创始人兼 CEO，EquityZen 还列 Yuchen Huang 为
              CTO，但保留证据没有呈现更完整的管理团队或董事会结构。资本形成比治理更容易追踪。Multiples 记录了六轮 融资和 2026 年 4 月的大额 D 轮融资，36Kr
              补充了公司声称盈利和增长的叙事，财新则将更早的 2021 年融资 与淡马锡支持的区域扩张联系起来。即便如此，投资者最关心的披露质量仍然较弱：现有资料只给出估值区间而非 精确数值，且 LinkedIn 与
              Dealroom 的公开员工人数信号严重冲突。
