              当前公开页面上的融资记录彼此不一致。Startup Fundraising 报告 $120 million 已披露融资，并仍将 2021 年 2 月 C 轮列为最新已披露轮次。财新独立报道称，2021 年融资为
              500 million yuan（$77 million），并称 2019 年或 2021 年融资后均未公布估值。Caplight 现列出日期为 2026 年 4 月 23 日的 D 轮，AI Market
              Watch 则给出约 RMB 1 billion（$138 million）的未经证实估算。Dealroom 的 $100-500 million 融资区间过宽，无法调和这些记录。商业规模也取决于定义：公司提供的
              Gritt 资料描述早期客户近 5,000 家，而当前 LinkedIn 公司页面声称近 40,000 家工厂。因此，投资论点取决于验证融资事件本身，以及不断扩大的 部署底数究竟代表什么。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
