      - number: '3.2'
        title: 产品与分销取舍
        blocks:
          - type: paragraph
            body: >-
              Black Lake 最明显的公开差异化在于可及性。阿里云市场页面将 Black Lake 智能制造定位为低成本、按需付费的软件， 可两天启动并在四至六周内实施；Fortune 则称，Black Lake
              正有意重建销售方式以触达中国小型工厂，而不是只面向大型 企业账户。这并不能证明其相对具名竞争者具有决定性优势，但确实暗示其进入市场的姿态不同于重量级 MES 部署。Dealroom 还称平台可连接 ERP 和
              WMS，这具有竞争意义，因为它意味着 Black Lake 可以叠加到现有技术栈中，而不必一次性替换 工厂所有现有的记录系统。
