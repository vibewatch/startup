              - CV011
          - type: callout
            title: 观察到的区间不是交易价值
            body: Dealroom 的 $1-2.5 billion 区间可作为背景，但不能替代 D 轮价格、稀释、优先股堆叠或以运营结果为基础的估值方法。
            calloutType: risk
            claimRefs:
              - CV006
