  customerFocus: 中小企业至大型制造商，尤其是工厂运营团队。
  businessModel: 具有按需付费和工业 AI 增购定位的经常性 SaaS。
  stage: Series D
  fundingStatus: 2026 年 4 月完成近 RMB 1 billion 的 D 轮融资，此前已有多轮风险投资。
