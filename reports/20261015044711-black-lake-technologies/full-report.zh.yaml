      - number: '1.3'
        title: 里程碑与执行注意事项
        blocks:
          - type: paragraph
            body: >-
              有日期的里程碑显示公司确有发展进程，而非纯粹的 AI 概念故事。Black Lake 在 2016 年成立后不久获得早期 融资，2018 年推出产品，2021 年完成淡马锡领投融资，并在 2026 年经历融资和
              WAIC 面向国际市场的 AI 营销 周期。这一势头值得重视，但风险视角并不简单：财新较早的报道显示，疫情延误后东南亚业务仍处于概念验证阶段， 而保留资料中最谨慎的 2026
              年分析仍认为，采用取决于逐家工厂的艰难集成、变革管理和异构 IT 环境。因此， 本章支持其商业相关性，但不能得出扩张或工业 AI 变现已经去风险的结论。
