chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与公开规模主张
        blocks:
          - type: paragraph
            body: >-
              可访问的公开资料一致将 Black Lake 定位于上海，并将公司成立时间指向 2016 年；尽管公司仍为非上市企业， 这为后续章节提供了稳定的身份锚点。如今其产品叙事将制造业 SaaS 与工业 AI
              语言结合起来：LinkedIn 和 EquityZen 将其描述为面向工厂运营的云软件平台，而公司当前材料则将产品框定为叠加在生产管理工作流之上的 工业 AI。公开规模声称已明显扩大，从 2021 年服务近
              2,000 家制造商，扩大到公司控制材料中当前全球近 40,000 家工厂，但不同来源的底数尚未调和，所引用的 IDC 市占率声称也未在保留资料池中得到独立复现。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
