  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界是连接工厂订单、生产、物料、质量、排程和履约的云软件，并在这些工作流上叠加工业 AI 智能体。 其中包括 Black Lake
              的生产管理产品、轻量级移动工单工具，以及面向流程规划、报价、排程、检验和追踪的智能体。 这一定义排除底层 ERP 和仓储系统、工业机械、通用云基础设施及自动化硬件，除非 Black Lake 直接将这些层变现。
              现有状态也不只是竞争 MES：公司材料称，传统工业软件记录数据并协调工人，而工程师和一线员工仍手动做出关键 决策。因此，电子表格、纸质工单、互不连接的点工具、现有 MES 安装和内部工作流都仍是现实替代方案。
              EquityZen 的独立资料支持更窄的车间协作定位，但指定资料池没有量化从每种替代方案中获得的支出。
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: 缺少市场底数的规模化证据
        blocks:
          - type: paragraph
            body: >-
              现有数字描述的是 Black Lake 的覆盖范围，而不是市场可服务支出的总量。公司报告称覆盖超过 40,000 家工厂、 超过 200 万用户和超过 30 个行业。SpatialDaily 另报道称，IDC 将
              Black Lake 在中国云端生产管理软件细分市场 的份额评为 52.7%，Black Lake 也在其 LinkedIn 页面重复了这一数字。该份额可能很重要，但指定证据缺少原始 IDC
              报告、细分市场收入、方法、日期基准和竞争者底数。工厂和用户数也不能直接转换为经常性收入：资料没有调和 付费客户、活跃部署、免费或低价用户、合同价值或留存。因此，估值模型应将这些数字作为采用信号，并在确定 TAM、
              SAM、SOM 或渗透率前，要求自下而上的付费站点和合同分析。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据至少支持三种采用路径。小型工厂可以从面向一线协作的可配置移动工作表开始；阿里云市场页面称该产品可在 三小时内实施。Dealroom 的独立资料将中大型制造商描述为核心受众，采用订阅式
              SaaS，并与现有企业系统和设备 集成。多工厂集团及供应链参与者构成更广泛的协作路径，而 Black Lake 自有网站将企业主、工厂经理、计划人员
              和生产主管列为运营用户。付款方和预算负责人仍不清晰：指定来源没有说明合同由工厂运营、企业 IT、数字化转型团队
              还是业务部门负责。这一歧义很重要，因为不同细分市场的部署速度、采购审查、实施服务和扩张经济性可能存在重大差异。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用源于可衡量的运营问题，而非笼统的 AI 需求。Black Lake 声称其软件可以提高产能利用率、降低库存资金占用
              并改善订单毛利率；这些是可信的买方价值假设，但在指定资料池中仍属于厂商自报结果。公司发布的材料还称，工厂 AI
              必须在设备、物料、产能、交付、流程和质量约束内进行推理，说明嵌入式生产语境可能比独立模型更有价值。这些约束也会放慢采用：集成、数据质量、流程差异、一线可用性、可解释性以及错误决策的责任归属都可能提高实施风险。
              因此，核心估值张力在于证据质量。已报告的份额和部署广度支持其在窄类别中的产品市场契合，但在缺少独立客户 ROI、 留存、付费站点数、合同价值和支出底数的情况下，不能证明可变现市场的规模或持久性。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 覆盖范围不等于经常性收入
            body: 40,000 家工厂和 200 万用户的数字是公司主张，未披露与付费站点、活跃部署、合同价值或留存的调和关系；不应将其 直接乘入市场规模。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局与替代类别
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一个广泛的竞争格局，而不是一份清晰且充分披露的直接可比竞争者名单。Black Lake 的保留材料将公司 定位在云生产管理软件和工业 AI 领域；第三方资料页及 Fortune
              报道则显示，买方也可以继续使用传统 MES 龙头，将 ERP/WMS 系统作为运营骨干，或维持人工及工程师主导的规划工作流。指定资料池中最清晰的具名同业名单来自 AI Market Watch， 其列举
              Siemens、SAP、Rockwell、中控科技、SemiTech、新禾云和鼎捷；由于该来源的信誉低于 Fortune 或财新，它适合作为 指示性名单，而非穷尽或经过独立基准验证的市场地图。
            claimRefs:
