            body: >-
              2026 年证据集给予 Black Lake 足够的公开牵引力，使其看起来具有真实商业性，但不足以精确评估效率。最强公开信号是 2026 年 4 月 D 轮融资、管理层关于盈利、收入增长超过 60%、服务近
              40,000 家工厂以及在超过 10 个国家拥有 100 多家 海外客户的主张。最佳 GTM 和交付代理指标是间接而非财务性的：合作伙伴材料强调快速上线、可配置产品和量化客户成果， WAIC 发布则称 AI
              相关收入正在成为新的增长来源，客户购买工业 AI 智能体所需时间正在缩短。这些是正面输入，但仍 没有揭示 CAC、回本期、留存或各细分市场的服务强度。
