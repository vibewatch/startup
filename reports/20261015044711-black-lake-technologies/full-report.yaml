      - number: '6.2'
        title: Named deployment proof is strongest at workflow level
        blocks:
          - type: paragraph
            body: >-
              Black Lake's best customer evidence is concrete workflow usage rather than generic logo walls. The Alibaba
              Cloud marketplace listing includes two quantified customer anecdotes: ChinaUST Group says Smart
              Manufacturing saved 7,000 man-hours and helped it win more orders, while JYD Technology says Mini
              Worksheet improved order-delivery rate by 5% after one month. LinkedIn posts add fresher but less
              quantified examples from Sun Valley Foods, Meiheng, Wanju, Wuxi Guofeng, and Larbee, each tied to specific
              operational use cases such as quality traceability, production execution, procurement, or SKU
              coordination. Together those cases make the product feel deployed in production contexts, not just
              marketed to prospects, but most examples remain company-authored and do not disclose contract scope,
              module breadth, user counts, or whether the reference covers one plant or a scaled multi-site rollout.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Durability, expansion, and concentration remain the weak points
        blocks:
          - type: paragraph
            body: >-
              The chapter's main limitation is not whether Black Lake has real customers; it is whether those customers
              renew, expand, and diversify revenue in a durable way. Caixin's 2021 reporting already showed recognizable
              manufacturers and some Southeast Asia contracts, but it also quoted management describing the region as
              still in an early proof-of-concept stage. A newer AI Market Watch commentary on the 2026 WAIC launch
              similarly argues that industrial-AI adoption still faces integration complexity, change management, and
              heterogeneous factory IT stacks. Those frictions are plausible customer-success risks, and none of the
              retained sources discloses NRR, GRR, logo churn, contract length, top-customer share, or the
              installed-base denominator behind the 40,000-factories claim. Black Lake therefore looks more proven on
              acquisition and reference generation than on disclosed retention economics.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is credible; durability is not yet disclosed
            body: >-
              Black Lake looks stronger on proving broad manufacturing relevance and repeatable workflow deployment than
              on proving retention, multi-year expansion, or customer concentration quality.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU013
          - type: callout
            title: International and AI upsell claims still need cohort-level proof
            body: >-
              The 2026 expansion narrative is plausible, but the retained pool still lacks the cohort metrics needed to
              show how many customers have moved from domestic MES-style workflows into multi-region industrial-AI
              spend.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Public-evidence risk ranking
        blocks:
          - type: paragraph
            body: >-
              The public record supports a high-risk ranking for Black Lake's execution layer rather than an immediate
              legal red flag. Black Lake is pushing industrial AI into decision workflows such as scheduling, quotation,
              procurement, and quality inspection, which raises the cost of customer deployment failures because errors
              can affect real factory throughput rather than back-office reporting alone. At the same time, the cleanest
              public adverse point in the assigned pool is not a lawsuit or outage but the implementation burden itself:
              independent commentary says factory-by-factory integration complexity and change management remain the key
              constraint on adoption. The diligence implication is straightforward: the thesis breaks first if Black
              Lake cannot turn the 2026 AI and expansion narrative into repeatable production deployments with a
              reconciled KPI set.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR010
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
