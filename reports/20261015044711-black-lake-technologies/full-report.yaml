      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The public architecture story is specific enough to outline operating layers, even if Black Lake does not
              publish a detailed technical reference. Dealroom says the platform connects with dozens of enterprise
              systems such as ERP and WMS and also ingests data from thousands of machine devices, suggesting Black
              Lake's operating model depends on connecting existing systems rather than replacing every system of
              record. AI Market Watch adds a cloud-native microservices architecture, IoT-enabled real-time data
              collection, and a proprietary industrial knowledge engine that captures factory-specific rules and
              equipment constraints. Combined with the current-year WAIC descriptions of quoting, procurement,
              scheduling, inspection, and tracking agents, the evidence points to an application stack that turns data
              capture and workflow coordination into reusable decision-support flows.
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE008
