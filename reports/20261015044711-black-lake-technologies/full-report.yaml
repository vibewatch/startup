              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: Financing record and thesis tension
        blocks:
          - type: paragraph
            body: >-
              The financing record is internally inconsistent across current public pages. Startup Fundraising reports
              $120 million of disclosed funding and still identifies the February 2021 Series C as the latest disclosed
              round. Caixin independently reported that the 2021 round raised 500 million yuan ($77 million) and said no
              valuation was announced after the 2019 or 2021 rounds. Caplight now lists a Series D dated April 23, 2026,
              and AI Market Watch gives an uncorroborated estimate of about RMB 1 billion ($138 million) for that round.
              Dealroom's funding range of $100-500 million is too broad to reconcile these records. Commercial scale is
              also definition-sensitive: a company-supplied Gritt profile describes nearly 5,000 early customers, while
              the current LinkedIn company page claims nearly 40,000 factories. The thesis therefore depends on
              validating both the financing event and what the expanding deployment denominator actually represents.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Bull, base, and bear underwriting
        blocks:
          - type: paragraph
            body: >-
              A subscription SaaS model is the most appropriate starting lens because Dealroom describes Black Lake that
              way, but no public source in the assigned evidence provides revenue, ARR, growth, gross margin, retention,
              or cash-flow data needed for a revenue-multiple method. The bull case requires the company's factory reach
              and market-share claims to convert into durable expansion revenue and healthy margins. The base case is
              continued commercial progress with insufficient transparency to set an entry multiple. The bear case is a
              financing priced against company-reported scale while operating quality, dilution, and preferences remain
              hidden. Precise scenario valuation ranges or probabilities would be false precision; the only observed
              range is Dealroom's $1-2.5 billion bracket, which is a market-data indication rather than a verified
              transaction value. Scenario movement should therefore be tied to document-level evidence, not invented
              numerical forecasts.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish IPO or M&A readiness. EquityZen describes IPO, merger or acquisition,
              and eligible Express Deals as general private-investment exit routes, but it does not demonstrate a
              current Black Lake secondary market or a company-specific exit timetable. Dealroom reports 14 investors on
              the cap table, increasing the importance of understanding share classes and preference seniority before
              underwriting a new position. The next diligence package should include the signed Series D term sheet,
              post-money cap table, price per share, liquidation preferences, board rights, and a KPI bridge covering
              revenue or ARR, gross margin, retention, concentration, cash use, and deployment definitions. The thesis
              breaks if management will not provide those materials, if claimed factory scale does not translate into
              recurring economics, or if the round terms place new capital behind a heavy preference stack without a
              supportable return path.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports diligence, not price approval
            body: >-
              Keep Black Lake under review, but defer any investment decision until primary financing documents and
              current operating KPIs support an entry valuation and target return.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
          - type: callout
            title: The observed range is not a transaction value
            body: >-
              Dealroom's $1-2.5 billion range is useful context but cannot substitute for the Series D price, dilution,
              preference stack, or a valuation method grounded in operating results.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV011
