              - CP015
      - number: '3.3'
        title: Durability and open risks
        blocks:
          - type: paragraph
            body: |-
              The bullish case is that Black Lake is trying to move one layer up the value chain, from
              recording and coordination into operational decision support. Fortune says the product now
              includes agents that can read orders, generate quotes, and schedule production, and the
              company's 2026 PR materials add procurement, quality, and CAD-to-process automation claims.
              If those capabilities work in real factories, they could make Black Lake harder to displace
              than a narrow execution tool. The risk is that the public proof is still uneven: Fortune
              explicitly says the broader industrial-AI thesis remains unproven, named-peer pricing and
              switching data remain thin, and Caixin's earlier Southeast Asia reporting still described the
              region as proof-of-concept rather than a fully scaled second theater.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: SME accessibility is the clearest public wedge
            body: >-
              The strongest externally visible differentiation is not a published head-to-head benchmark, but a
              packaging story: pay-as-you-go deployment, fast onboarding, and deliberate outreach to smaller factories
              that often sit below heavyweight MES attention.
            calloutType: insight
            claimRefs:
              - CP003
              - CP007
              - CP008
          - type: callout
            title: Named-peer benchmarking is still thin
            body: >-
              The chapter can map competitor classes and indicative rival names, but the assigned pool does not yet
              provide verified 2026 pricing, migration, or reference-customer evidence for most named peers, which
              limits conviction on moat durability.
            calloutType: risk
            claimRefs:
              - CP012
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Black Lake's public materials consistently describe a cloud software business selling manufacturing
              workflow products plus newer industrial AI agents, which is enough to establish a recurring-software
              revenue model but not enough to price the business precisely. The product stack spans entry-level workflow
              tooling for smaller factories, broader smart manufacturing and supply-chain collaboration modules, and AI
              agents for quotation, planning, scheduling, procurement, and quality tasks. What is still missing is the
              conversion layer between positioning and realized economics: public evidence shows pay-as-you-go and
              fast-start messaging, but not list prices, discounting behavior, contract length, attach rates, or the
              share of revenue now coming from AI modules versus legacy cloud software.
            claimRefs:
