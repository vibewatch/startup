      - number: '4.2'
        title: Traction signals and commercial efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The 2026 evidence set gives Black Lake enough public traction to look commercially real, but not enough to
              underwrite efficiency with precision. The strongest public signals are the April 2026 Series D,
              management's claim of profitability, revenue growth above 60%, nearly 40,000 factories served, and more
              than 100 overseas customers across more than 10 countries. The best GTM and delivery proxies are indirect
              rather than financial: partner materials emphasize rapid onboarding, configurable products, and quantified
              customer outcome claims, while the WAIC release says AI-related revenue is becoming a new growth source
              and that customers are taking less time to buy industrial AI agents. Those are positive inputs, but they
              still do not reveal CAC, payback, retention, or services intensity by segment.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
          - type: table
            tableRef: TI003
