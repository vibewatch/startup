  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Black Lake's public positioning is strongest on SME-friendly deployment and operational AI breadth; incumbent and
      local alternatives are visible, but the assigned pool leaves most third-party packaging details unverified.
    data:
      xAxis:
        label: Factory accessibility and deployment speed (1=harder enterprise rollout, 5=easier SME adoption)
        min: 1
        max: 5
      yAxis:
        label: Decision-automation breadth (1=recording / coordination, 5=AI-assisted operational decisions)
        min: 1
        max: 5
      points:
        - label: Black Lake
          x: 5
          'y': 5
          detail: Pay-as-you-go positioning plus quoting, scheduling, procurement, quality, and tracking agents.
        - label: Traditional MES incumbents
          x: 1
          'y': 2
          detail: >-
            Visible mainly as the legacy MES benchmark Black Lake says it replaces; current-pool AI breadth is
            unverified.
        - label: Regional Chinese MES vendors
          x: 2
          'y': 2
          detail: Named as peers, but public feature and pricing proof in this pool is thin.
        - label: ERP / WMS-adjacent stack
          x: 2
          'y': 1
          detail: >-
            Black Lake integrates with ERP and WMS, so those systems can coexist but are not evidenced here as
            equivalent decision agents.
        - label: Manual / internal workflow
          x: 5
          'y': 1
          detail: >-
