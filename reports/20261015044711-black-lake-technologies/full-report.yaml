  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Qualitative matrix placing Black Lake's main public-evidence risks by impact and likelihood as of October 2026.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
      rows:
        - label: Deployment integration / change-management drag
          values:
            - text: Severe
              note: Customer-site integration is the clearest external adverse point in the assigned pool.
            - text: High
              note: >-
                Independent commentary says factory IT heterogeneity and change management remain the adoption
                bottleneck.
            - text: Moderate
              note: >-
                Alibaba marketing presents faster implementation and easier integration, but not audited rollout
                cohorts.
        - label: Post-Series-D international expansion
          values:
            - text: Severe
              note: The strategy now depends on converting fresh capital into overseas traction.
            - text: Medium
              note: Management previously described Southeast Asia as proof-of-concept rather than scaled execution.
            - text: Moderate
              note: New capital and partner signaling help, but regional operating proof is still thin.
        - label: KPI definition and disclosure drift
          values:
            - text: Elevated
              note: Inconsistent revenue, customer, headcount, and valuation snapshots can distort underwriting.
            - text: High
              note: The disagreement already exists across current public sources.
            - text: Low
              note: Mitigation depends on management reconciliation rather than public evidence.
        - label: Services-capacity mismatch
          values:
            - text: Elevated
              note: A real 40,000-factory footprint would require substantial onboarding, support, and governance capacity.
            - text: Medium
              note: Scale claims are repeated, but active-site depth and staffing are not reconciled.
            - text: Low
              note: Customer testimonials do not substitute for renewal, utilization, or services-load data.
        - label: Partner-channel dependence
          values:
            - text: Elevated
              note: Cloud and ecosystem partners are visible in the go-to-market surface.
            - text: Medium
              note: The pool shows partner presence but not exact economics or concentration.
            - text: Moderate
              note: Dependency could be manageable if channel contribution and portability hold up in diligence.
        - label: Legal / cyber blind spots
          values:
            - text: Severe
              note: A hidden incident or compliance gap would matter immediately for enterprise underwriting.
            - text: Lower
              note: No strong regulator, court, or incident disclosure surfaced in the assigned pool.
            - text: Low
              note: There is no public mitigation package in the assigned evidence set.
    approximationNotes: >-
      Qualitative matrix derived from the risk registers and public-source consistency checks; no numeric scoring model
      is implied.
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR008
      - CR010
      - CR013
      - CR015
