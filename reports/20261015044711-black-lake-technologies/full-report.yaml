      - number: '1.3'
        title: Milestones and execution caveats
        blocks:
          - type: paragraph
            body: >-
              The dated milestones show real company progression rather than a purely conceptual AI story. Black Lake
              moved from early funding soon after its 2016 founding to a 2018 product launch, a 2021 Temasek-led round,
              and a 2026 cycle of financing plus international-facing AI marketing at WAIC. That momentum matters, but
              the risk lens is not trivial: Caixin's older reporting shows Southeast Asia was still at proof-of-concept
              stage after pandemic delays, and the most skeptical retained 2026 analysis still argues that adoption
              depends on difficult factory-by-factory integration, change management, and heterogeneous IT estates. The
              chapter therefore supports commercial relevance, but not a clean conclusion that expansion or
              industrial-AI monetization is already de-risked.
