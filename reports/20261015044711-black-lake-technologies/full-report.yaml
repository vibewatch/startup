chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and public scale claims
        blocks:
          - type: paragraph
            body: >-
              Accessible public profiles consistently place Black Lake in Shanghai and date the company to 2016, giving
              later chapters a stable identity anchor even though the business is still privately held. The product
              narrative now blends manufacturing SaaS with industrial-AI language: LinkedIn and EquityZen describe a
              cloud software platform for factory operations, while current company materials frame the offer as
              industrial AI layered onto production-management workflows. Public scale claims have expanded sharply,
              from nearly 2,000 manufacturers served in 2021 to nearly 40,000 factories worldwide in current
              company-controlled materials, but the underlying denominator is not reconciled across sources and the
              cited IDC market-share claim is not independently reproduced in the retained pool.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
