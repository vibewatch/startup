            title: Integration is a core execution dependency
            body: >-
              Because Black Lake's value proposition depends on connecting enterprise systems and machine data, customer
              implementation quality is likely a gating factor for product success even if the company does not publish
              connector-level performance data.
            calloutType: assumption
