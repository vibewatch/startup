  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Black Lake should remain in active diligence, but public evidence does not support an invest-now decision
              at an unknown price. Caplight lists a Series D on April 23, 2026, while Dealroom records a very broad
              $1-2.5 billion 2026 valuation range. Neither source discloses the exact round amount, valuation, share
              price, or investor terms, and EquityZen places company-specific valuation, cap-table, preference, and
              financial information behind verified access. The positive case is credible commercial reach: Black Lake's
              LinkedIn profile claims nearly 40,000 factories and a 52.7% segment share. Those are company-issued claims
              rather than independently audited economics. With revenue, ARR, margin, retention, customer concentration,
              cash use, and preference terms unavailable, confidence is low, risk is high, and the valuation stance is
              unverified rather than a defensible point estimate.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
