      - number: '1.2'
        title: Leadership, capital base, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The public leadership bench in accessible sources is narrow: Yuxiang Zhou is consistently presented as
              founder and CEO, and EquityZen also names Yuchen Huang as CTO, but the retained evidence does not expose a
              fuller management team or board structure. Capital formation is easier to trace than governance. Multiples
              logs six funding rounds and a large April 2026 Series D, while 36Kr adds a company-claim narrative of
              profitability and growth and Caixin ties the earlier 2021 round to Temasek-backed regional expansion. Even
              so, disclosure quality remains weak where investors would care most: the available sources give only a
              valuation range rather than an exact mark and public headcount signals conflict sharply between LinkedIn
              and Dealroom.
