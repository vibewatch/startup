              - CR005
              - CR006
              - CR008
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Operational deployment and model-governance risk
        blocks:
          - type: paragraph
            body: >-
              Black Lake's strongest mitigation evidence is also a reminder of where the execution burden sits. Alibaba
              Cloud's marketplace listing advertises short implementation windows, easy integration, and measurable
              customer outcomes, while PRNASIA says the company's AI products are already being used in
              production-oriented functions and judged on reliability, explainability, and scalability. Those facts
              lower the risk of a zero-product scenario, but they do not clear the harder question of whether the same
              implementation quality holds across thousands of factory environments, legacy systems, and multilingual
              international rollouts. Management can claim speed and accuracy; the investment question is whether
              customer-site rollout, services capacity, and model governance scale at the same pace as the commercial
              story.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR012
              - CR015
      - number: '7.3'
        title: Capital, partner, and expansion dependency risk
        blocks:
          - type: paragraph
            body: >-
              The April 2026 Series D creates both cushion and pressure. Publicly, management says the funding is meant
              to accelerate industrial-AI deployment and international expansion, and outside profiles show that cloud
              and signaling partners already matter to the story. That is positive if Black Lake can use capital plus
              partner access to shorten overseas sales cycles, but it also means investors are underwriting a more
              complicated execution plan than domestic MES replacement alone. Caixin's earlier reporting is a useful
              check on exuberance: management already described Southeast Asia as an early proof-of-concept effort after
              an earlier fundraise, so the refreshed risk view should assume foreign growth remains a monitored
              milestone rather than a proven capability.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Transparency, legal, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The sharpest diligence blocker is public-data inconsistency, not an identified scandal. GetLatka,
              LinkedIn, Dealroom, and AI Market Watch all describe Black Lake at meaningful scale, but they disagree on
              customer definitions, headcount, and the precision of valuation and funding. That mismatch makes it
              difficult to judge whether the company is a capital-efficient software scale story, a services-heavy
              deployment organization, or a mix of both. The assigned pool also does not surface regulator, court, or
              security-disclosure material strong enough to clear legal and cyber diligence, so the correct
              interpretation is not "low risk" but "insufficient public evidence." Kill criteria should therefore
              include any inability to reconcile paid customers versus factories served, exact valuation terms, and
              security or compliance posture during management diligence.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
