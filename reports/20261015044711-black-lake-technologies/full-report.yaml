    Black Lake Technologies is a Shanghai-based manufacturing software company founded in 2016 that now markets cloud
    MES, factory collaboration, and industrial AI-agent workflows across the production lifecycle. Public profiles and
    recent press point to a real multi-round funding history, a 2026 Series D, and large factory-reach claims, but the
    evidence still leaves revenue quality, retention, and ownership terms materially under-disclosed.
