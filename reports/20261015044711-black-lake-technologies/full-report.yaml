  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint and segmentation
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a broad but still partly company-mediated picture of who Black Lake serves.
              Official materials repeated through AI Watch, Breezy Today, and LinkedIn say the company now serves nearly
              40,000 factories across more than 30 industries, while independent profiles on Dealroom, EquityZen, and AI
              Market Watch place the customer range from SMEs to Fortune 500 manufacturers. The operating model appears
              deliberately segmented: Mini Worksheet is framed as a fast-start wedge for small factories and frontline
              teams, while Smart Manufacturing and broader industrial-AI workflows are positioned for larger, more
              integrated production environments. That breadth matters because it suggests Black Lake is not relying on
              one narrow buyer persona, but the pool still does not disclose how many of those factories are paying
              logos, active plants, channel-driven signups, or AI-agent customers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
