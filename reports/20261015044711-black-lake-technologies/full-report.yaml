              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting view
        blocks:
          - type: paragraph
            body: >-
              Black Lake's forward funding story is credible enough to support continued expansion, but not yet
              transparent enough for clean underwriting. Multiple sources confirm that the company raised nearly RMB 1
              billion in April 2026 and intends to spend that capital on industrial-AI deployment and international
              expansion, which implies both ambition and an ongoing need to finance productization, localization, and
              sales capacity. At the same time, public market-data surfaces still show valuation and cumulative-funding
              ranges rather than exact current terms, while no retained source discloses cash on hand, burn, runway,
              gross margin, net revenue retention, or customer concentration. The result is a financial profile with
              real momentum but too many missing denominators to judge revenue quality, margin durability, or next-round
              timing confidently.
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
              - CI013
