        - label: Terms gap
          value: unavailable
          note: Share price, dilution, preferences, and investor rights are not public.
        - label: Risk assessment
          value: high
          note: Scale and valuation cannot be reconciled to recurring economics.
        - label: Recommendation
          value: research-more
          note: Review primary financing documents and a current KPI pack before pricing.
