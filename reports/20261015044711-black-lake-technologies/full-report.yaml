              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Monitor the execution proof, not the headline count
            body: >-
              The core break points are slower-than-advertised enterprise rollout, overseas expansion still stuck at
              proof-of-concept despite fresh capital, and management's inability to reconcile paid customers, factories
              served, employee scale, and exact valuation terms during diligence.
            calloutType: risk
            claimRefs:
              - CR003
