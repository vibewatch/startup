      - [Black Lake Smart Manufacturing, "Cloud MES / collaboration SaaS for broader shop-floor management", "Plant / factory / seat basis not disclosed", "Core cloud platform with 4-6 week implementation claim", "Recurring software model visible; revenue mix not disclosed", "ARR by product, services mix, and module attach by customer size"]
      - [Black Lake Supply Chain, "Supply-chain collaboration software linked to factory and partner workflows", "Buyer / supplier unit not disclosed", "Product line disclosed, but commercialization details are not public", "Product existence verified; economics opaque", "Pricing mechanics, customer concentration, and GMV or subscription mix"]
      - [Industrial AI agents, "Module or workflow upsell for quotation, procurement, scheduling, quality, and order tracking", "Per agent / module / usage basis not disclosed", "Management says AI revenue is becoming a new growth source in 2026", "Strategic direction is clear; realized monetization is not", "AI attach rate, standalone pricing, gross margin, and renewal behavior"]
    notes: >-
      Partial public snapshot of the revenue stack. Rows enumerate disclosed product lines, not an
      exhaustive audited revenue breakdown; public sources do not disclose list prices, realized
      pricing, or revenue mix by product.
    claimRefs: [CI001, CI002, CI003, CI008, CI009]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public monetization signal
      - List vs realized pricing
      - Public caveat
      - Source
    rows:
      - [Black Lake Mini Worksheet, "Low Cost & Pay as You Go; 2 Days to Get Started", "No public list price or realized price disclosed", "Quick-start messaging is not a contract schedule", "SI005"]
      - [Black Lake Smart Manufacturing, "4-6 Weeks Implementation; continuous upgrade; ease of integration", "No public list price or services fee disclosed", "Implementation timing does not reveal ACV or gross margin", "SI005"]
      - [Platform-level software model, "Subscription-based SaaS with pay-as-you-go access", "Recurring model visible, contract economics not public", "Market-data description, not a customer contract", "SI004"]
      - [Industrial AI agents, "AI-related products are becoming a new source of growth; customers take less time to buy", "No public per-agent price or attach rate disclosed", "Revenue contribution is directional, not quantified", "SI006"]
    notes: >-
      Public pricing evidence is positioning-heavy. The retained sources show monetization posture
      and onboarding claims, but not price cards, discount ladders, term length, or realized
      customer economics.
    claimRefs: [CI002, CI003, CI008, CI009]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annual revenue growth", ">60% (company-claimed)", medium, "Shows momentum, but not the revenue base or mix behind it", "Monthly revenue bridge, bookings, and ARR/revenue reconciliation"]
      - [Profitability, "Company says profitable", medium, "Determines whether AI expansion is self-funded or subsidy-dependent", "Definition of profitability plus EBITDA and operating cash flow history"]
      - ["Overseas commercial footprint", ">100 overseas customers in 10+ countries", medium, "Tests whether international expansion is becoming efficient revenue, not just logos", "Revenue by geography, average contract size, and sales cycle by market"]
      - ["Deployment proxy", "2 Days to Get Started; 4-6 Weeks Implementation", medium, "Fast deployment can support lower services burden and faster payback", "Implementation hours, partner share, and gross margin by deployment motion"]
      - ["Gross margin / CAC / payback / NRR / concentration", null, low, "Core underwriting metrics remain undisclosed in public sources", "Cohort retention, gross margin by product, CAC/payback, and top-customer concentration exports"]
    notes: >-
      Null means no retained public source disclosed a reliable figure. The non-null rows are
      mostly company-claimed or partner-surface proxies rather than audited unit-economics metrics.
    claimRefs: [CI003, CI005, CI007, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources imply a tiered workflow-software base that feeds newer industrial-AI upsell,
      but they do not disclose the price, attach rate, or gross margin at each step.
    data:
      nodes:
        - id: smb-demand
          label: SME factory demand
          detail: Mini Worksheet is positioned for SME factories and frontline workers.
        - id: mini-worksheet
          label: Mini Worksheet SaaS
          value: Low Cost & Pay as You Go
          note: 2 Days to Get Started.
        - id: broader-manufacturers
          label: Growth and multi-plant manufacturers
          detail: Smart Manufacturing and Supply Chain target broader factory and partner workflows.
        - id: core-platform
          label: Smart Manufacturing + Supply Chain
          note: 4-6 Weeks Implementation; cloud-based collaboration and data aggregation.
        - id: ai-upsell
          label: Industrial AI agents
          detail: Quotation, procurement, scheduling, quality inspection, and order-tracking agents.
        - id: public-revenue-signal
          label: Public revenue signal
          note: Company says AI revenue grew significantly in 2026 and overall revenue growth exceeded 60%; gross margin remains undisclosed.
    approximationNotes: >-
      Qualitative bridge only. Retained sources establish product layers and monetization posture,
      but not customer-to-revenue conversion rates or gross-profit math.
    claimRefs: [CI001, CI002, CI003, CI008, CI013]
callouts:
  - calloutType: insight
    title: Real revenue engine, thin disclosure layer
    body: >-
      The evidence supports a real cloud-software and AI commercialization stack, but most of the
      public monetization detail still stops at product positioning rather than realized economics.
    claimRefs: [CI001, CI002, CI003, CI009]
  - calloutType: risk
    title: Capital adequacy is directionally positive, not underwritable
    body: >-
      A large 2026 round and international expansion plan are visible, but precise valuation, cash,
      burn, runway, and margin data remain absent from retained public sources.
    claimRefs: [CI004, CI010, CI012, CI013]
  - calloutType: recommendation
    title: Require a true finance data room before valuation work
    body: >-
      The next diligence step should be a product-level revenue bridge, cohort retention, gross
      margin, cash-burn runway schedule, and representative contracts rather than more top-of-funnel
      narrative.
    claimRefs: [CI009, CI013]
