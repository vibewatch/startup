schemaVersion: report-v2
artifact: financials
slug: black-lake-technologies
runDate: 2026-10-15
company:
  name: Black Lake Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real recurring software-and-AI revenue engine and a real April 2026
    financing event, but most underwriting-critical economics remain undisclosed. Black Lake points
    to more than 60% revenue growth, profitability, and expanding international adoption, yet
    public sources still do not disclose realized pricing, revenue mix, gross margin, retention, or
    runway.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: >-
      Black Lake's public materials consistently describe a cloud software business selling
      manufacturing workflow products plus newer industrial AI agents, which is enough to establish
      a recurring-software revenue model but not enough to price the business precisely. The
      product stack spans entry-level workflow tooling for smaller factories, broader smart
      manufacturing and supply-chain collaboration modules, and AI agents for quotation, planning,
      scheduling, procurement, and quality tasks. What is still missing is the conversion layer
      between positioning and realized economics: public evidence shows pay-as-you-go and fast-start
      messaging, but not list prices, discounting behavior, contract length, attach rates, or the
      share of revenue now coming from AI modules versus legacy cloud software.
    claimRefs: [CI001, CI002, CI003, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-commercial-efficiency
    title: Traction signals and commercial efficiency proxies
    body: >-
      The 2026 evidence set gives Black Lake enough public traction to look commercially real, but
      not enough to underwrite efficiency with precision. The strongest public signals are the April
      2026 Series D, management's claim of profitability, revenue growth above 60%, nearly 40,000
      factories served, and more than 100 overseas customers across more than 10 countries. The
      best GTM and delivery proxies are indirect rather than financial: partner materials emphasize
      rapid onboarding, configurable products, and quantified customer outcome claims, while the
      WAIC release says AI-related revenue is becoming a new growth source and that customers are
      taking less time to buy industrial AI agents. Those are positive inputs, but they still do
      not reveal CAC, payback, retention, or services intensity by segment.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-view
    title: Capital adequacy and underwriting view
    body: >-
      Black Lake's forward funding story is credible enough to support continued expansion, but not
      yet transparent enough for clean underwriting. Multiple sources confirm that the company
      raised nearly RMB 1 billion in April 2026 and intends to spend that capital on industrial-AI
      deployment and international expansion, which implies both ambition and an ongoing need to
      finance productization, localization, and sales capacity. At the same time, public market-data
      surfaces still show valuation and cumulative-funding ranges rather than exact current terms,
      while no retained source discloses cash on hand, burn, runway, gross margin, net revenue
      retention, or customer concentration. The result is a financial profile with real momentum
      but too many missing denominators to judge revenue quality, margin durability, or next-round
      timing confidently.
    claimRefs: [CI004, CI010, CI011, CI012, CI013]
