  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash-and-runway
      missingEvidence: >-
        Current cash balance, monthly burn, debt or project-finance obligations, covenant package,
        and management runway forecast after the April 2026 Series D.
      whyItMatters: >-
        Capital adequacy is the chapter's central underwriting question, and a large financing
        round alone does not reveal how long the business can fund AI deployment and expansion.
      diligencePath: >-
        Request monthly cash bridge, debt schedule, board-approved budget, and 12- to 18-month
        runway model with downside scenario assumptions.
      relatedQuestionRefs: [QI006]
    - type: missing-source
      severity: material
      topic: realized-pricing-and-mix
      missingEvidence: >-
        Product-level list pricing, realized pricing, discounting rules, contract duration,
        implementation fees, and revenue mix by legacy cloud software versus AI modules.
      whyItMatters: >-
        Without realized pricing and mix, it is impossible to judge revenue quality, AI attach
        rates, or whether quick-start messaging converts into durable recurring revenue.
      diligencePath: >-
        Review representative contracts, pricing approval policy, bookings waterfall, and product
        P&L by segment and geography.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Gross margin by product, CAC, payback, NRR, logo churn, customer concentration, and
        services versus software margin split.
      whyItMatters: >-
        Public growth and profitability claims can look attractive while hiding poor renewal
        quality, high services burden, or concentration risk.
      diligencePath: >-
        Pull cohort retention dashboards, gross-margin bridge, top-customer revenue concentration,
        and acquisition-cost reporting from the finance and RevOps systems.
      relatedQuestionRefs: [QI005, QI007]
      relatedTableRefs: [TI003]
