evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-Series-D valuation, share count, and any liquidation or downside-protection terms.
    whyItMatters: A broad valuation range is not enough to judge pricing, dilution, or downside protections for new capital.
    diligencePath: Request the latest cap table, share-class summary, and board-approved financing documents.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Current revenue base, ARR, gross margin, burn, and cash-runway evidence after the April 2026 Series D.
    whyItMatters: >-
      Growth and profitability claims are directionally helpful but insufficient to underwrite durability or margin
      quality.
    diligencePath: Request audited management accounts, cohort retention, and monthly operating KPI packs.
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Reconciled employee count with an as-of date and scope definition across company and database sources.
    whyItMatters: >-
      Headcount is a key scale signal and affects interpretation of productivity, operating leverage, and go-to-market
      reach.
    diligencePath: Request an HR roster snapshot and management explanation for the LinkedIn versus Dealroom discrepancy.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Board composition, reporting structure, and a fuller executive roster beyond the founder/CEO and CTO.
    whyItMatters: Key-person concentration and governance quality cannot be assessed from a two-name public leadership view.
    diligencePath: Request the management org chart, board list, and committee structure.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: >-
      Complete ownership map, board-seat allocation, secondaries, debt facilities, and investor rights after the Series
      D.
    whyItMatters: Public investor-name lists do not reveal control, economics, or downside protections.
    diligencePath: Request the full cap table and latest financing term sheet.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-share-methodology
    missingEvidence: >-
      The underlying IDC publication or methodology behind the 52.7% market-share claim and a definition of what counts
      as a served factory.
    whyItMatters: >-
      Without the original benchmark and denominator, the scale narrative can be directionally true but still overstated
      or incomparable.
    diligencePath: Request the cited IDC excerpt and customer-count methodology from management.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: >-
      The original IDC report supporting the 52.7% share, including category definition, period, market value, vendor
      denominator, and methodology.
    whyItMatters: >-
      Without the primary market study, a narrow vendor-share claim cannot be translated into market size, revenue, or
      durable competitive position.
    diligencePath: >-
      Obtain the cited IDC report or an authorized extract and reconcile its category, period, vendor set, and currency
      denominator to Black Lake's disclosed products.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Paying and active factory counts, recurring contract values, retention, expansion, segment-level pricing, and
      budget-owner data.
    whyItMatters: >-
      Company-reported factories and users cannot establish monetizable penetration or support bottom-up SAM and SOM
      without these denominators.
    diligencePath: >-
      Request anonymized customer and contract cohorts by product, factory size, geography, paid status, annual contract
      value, retention, and expansion.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Current 2026 pricing, contract structure, and deployment terms for Siemens, SAP, Rockwell, Zhongkong, SemiTech,
      Xinhe Cloud, and Dingjie.
    whyItMatters: >-
      Without verified named-peer packaging, the chapter cannot benchmark Black Lake's price-to-value wedge or likely
      discount pressure.
    diligencePath: >-
      Collect current vendor quotes, RFP responses, or customer purchase proposals for the named peers and reconcile
      them with Black Lake's packaging claims.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Reference customers or migration case studies showing factories switching from named incumbent MES or local
      Chinese peers onto Black Lake.
    whyItMatters: >-
      Switching friction and coexistence versus rip-and-replace are central to moat durability, but public proof is
      still thin.
    diligencePath: >-
      Request migration case studies, churn and NRR cuts by segment, and implementation timelines for factories that
      replaced incumbent systems.
  - type: stale
    severity: material
    topic: international-expansion
    missingEvidence: Current 2026 customer count and deployment depth outside China, especially in Southeast Asia.
    whyItMatters: >-
      Caixin's 2021 proof-of-concept framing may no longer be current, yet international scale is part of the
      competitive story after the 2026 Series D.
    diligencePath: >-
      Obtain 2026 customer references, partner disclosures, or regional bookings data for Southeast Asia, Latin America,
      and Eastern Europe.
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: >-
      Current cash balance, monthly burn, debt or project-finance obligations, covenant package, and management runway
      forecast after the April 2026 Series D.
    whyItMatters: >-
      Capital adequacy is the chapter's central underwriting question, and a large financing round alone does not reveal
      how long the business can fund AI deployment and expansion.
    diligencePath: >-
      Request monthly cash bridge, debt schedule, board-approved budget, and 12- to 18-month runway model with downside
      scenario assumptions.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: realized-pricing-and-mix
    missingEvidence: >-
      Product-level list pricing, realized pricing, discounting rules, contract duration, implementation fees, and
      revenue mix by legacy cloud software versus AI modules.
    whyItMatters: >-
      Without realized pricing and mix, it is impossible to judge revenue quality, AI attach rates, or whether
      quick-start messaging converts into durable recurring revenue.
    diligencePath: >-
      Review representative contracts, pricing approval policy, bookings waterfall, and product P&L by segment and
      geography.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by product, CAC, payback, NRR, logo churn, customer concentration, and services versus software
      margin split.
    whyItMatters: >-
      Public growth and profitability claims can look attractive while hiding poor renewal quality, high services
      burden, or concentration risk.
    diligencePath: >-
      Pull cohort retention dashboards, gross-margin bridge, top-customer revenue concentration, and acquisition-cost
      reporting from the finance and RevOps systems.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Primary security, privacy, compliance, and reliability documentation such as certifications, audit reports,
      incident history, or a status surface.
    whyItMatters: >-
      Buyers in regulated or high-throughput factories need proof that Black Lake can secure operational data and govern
      production-critical automation safely.
    diligencePath: >-
      Request security architecture, certification registers, data-processing controls, incident logs, and customer
      security review materials from management.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner evidence such as API documentation, repositories, package activity, engineering
      talks, or community implementation threads.
    whyItMatters: >-
      Without a developer or practitioner surface, it is harder to judge integration readiness, ecosystem adoption, and
      whether Black Lake's platform is extensible beyond managed deployments.
    diligencePath: >-
      Ask for public API docs, SDK or connector inventories, integrator references, and any practitioner-community
      footprints that can substitute for open-source signals.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: module-reliability
    missingEvidence: >-
      Module-level uptime, rollout scale, renewal, and outcome data for Smart Manufacturing, Supply Chain, and
      industrial AI agents beyond the marketed CAD-to-Process example.
    whyItMatters: >-
      The product story is strongest where public metrics exist; without comparable operating evidence across modules,
      diligence cannot separate a broad roadmap from durable deployed capability.
    diligencePath: >-
      Request module-by-module customer counts, implementation timelines, uptime/SLA history, attach rates for AI
      agents, and named reference calls by industry.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and contract length by customer cohort or segment.
    whyItMatters: >-
      Without retention data, customer count alone cannot show whether Black Lake is compounding durable revenue or
      replacing churn with new logos.
    diligencePath: >-
      Request cohort retention tables, renewal schedules, and customer-success KPIs broken out by SME versus enterprise
      segment.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, top-10 customer share, and channel or partner concentration by geography.
    whyItMatters: >-
      Concentration could materially change the quality of the customer base even if headline factory counts keep
      growing.
    diligencePath: >-
      Obtain a customer concentration schedule and revenue bridge that separates direct accounts, partner-led accounts,
      and any marquee enterprise logos.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: >-
      A complete customer-reference list separating pilots from production deployments, with region, module, start date,
      and current status.
    whyItMatters: >-
      The named examples in the pool show real usage, but they are a curated sample and do not establish how
      representative production deployment is across the installed base.
    diligencePath: >-
      Request the full customer-reference roster or an auditable sample frame that distinguishes active production sites
      from marketing references.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: international-expansion
    missingEvidence: Live paying-site counts, ARR, or customer retention by country for Southeast Asia and other newer regions.
    whyItMatters: >-
      Expansion may be strategically important, but the pool only supports a thesis of intent and early proof points
      rather than disclosed regional scale.
    diligencePath: Ask management for regional customer counts, go-live dates, and AI attach-rate metrics for non-China deployments.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: legal-and-cyber-clearance
    missingEvidence: Regulator, court, or security-disclosure evidence specific to Black Lake's legal, privacy, and incident posture.
    whyItMatters: >-
      Without direct legal or cyber records, the chapter can only flag diligence gaps rather than clear the risk
      surface.
    diligencePath: >-
      Run counsel-supported docket, enforcement, sanctions, and security-review searches plus request incident history
      and certifications from management.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
      - TR002
  - type: conflicting-data
    severity: material
    topic: public-kpi-opacity
    missingEvidence: >-
      A reconciled management table tying customers, factories served, ARR or revenue, headcount, and valuation to one
      date and one definition set.
    whyItMatters: >-
      The public sources disagree enough that it is hard to judge operating leverage, customer quality, and price
      discipline from external evidence alone.
    diligencePath: >-
      Request board-approved KPI definitions, latest monthly reporting pack, and cap-table or financing documents that
      reconcile the published snapshots.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Retention, expansion, concentration, and pilot-to-production conversion data for paying deployments.
    whyItMatters: Named logos and factories-served counts do not prove durable revenue quality or healthy cohort behavior.
    diligencePath: >-
      Obtain cohort-level retention, top-customer share, and multi-site deployment data with at least one
      customer-reference call outside company marketing.
    relatedQuestionRefs:
      - QR006
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Contract terms, revenue contribution, exclusivity, and operational obligations for cloud and ecosystem partners.
    whyItMatters: >-
      The public evidence shows partner presence, but not whether those relationships are strategic leverage or hidden
      concentration.
    diligencePath: Review partner contracts, sourced-pipeline contribution, and deployment architecture responsibilities by channel.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: series-d-terms
    missingEvidence: >-
      Exact Series D amount, pre-money and post-money valuation, price per share, dilution, liquidation preferences,
      board rights, and investor-control terms.
    whyItMatters: >-
      Entry discipline and downside protection cannot be assessed from a round date and broad third-party valuation
      range.
    diligencePath: >-
      Obtain the signed Series D term sheet, closing statement, and post-money cap table from management or the lead
      investor.
    relatedQuestionRefs:
      - QV004
  - type: private-evidence-only
    severity: material
