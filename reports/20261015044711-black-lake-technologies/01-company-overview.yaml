callouts:
  - calloutType: strength
    title: Real operating footprint, but still mostly through company-shaped evidence
    body: >-
      The chapter can support a credible identity, a multi-round funding history, and a visible manufacturing-software footprint, but several of the
      headline scale metrics still rely on company-controlled or aggregator sources rather than underlying primary documents.
    claimRefs:
      - CO003
      - CO005
      - CO006
  - calloutType: risk
    title: Public disclosure quality is still below investment-grade comfort
    body: >-
      Exact valuation, ownership terms, board structure, and even current headcount remain either undisclosed or inconsistent across accessible
      sources, while outside analysis still highlights factory integration and change-management friction in the industrial-AI story.
    claimRefs:
      - CO010
      - CO013
      - CO014
