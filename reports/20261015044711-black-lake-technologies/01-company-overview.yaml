company:
  name: Black Lake Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Black Lake's public footprint supports a real China-centric manufacturing software platform with a founder-led identity,
    a 2026 Series D, and visible traction claims, but the evidence remains uneven on exact valuation, ownership, and even
    current headcount. The strongest verified anchors are the company's 2016 Shanghai founding, a disclosed funding arc
    through April 2026, and a recent push to recast the product story around industrial AI agents.
sections:
  - id: identity-positioning
    title: Identity, positioning, and public scale claims
    body: >-
      Accessible public profiles consistently place Black Lake in Shanghai and date the company to 2016, giving later
      chapters a stable identity anchor even though the business is still privately held. The product narrative now blends
      manufacturing SaaS with industrial-AI language: LinkedIn and EquityZen describe a cloud software platform for factory
      operations, while current company materials frame the offer as industrial AI layered onto production-management
      workflows. Public scale claims have expanded sharply, from nearly 2,000 manufacturers served in 2021 to nearly
      40,000 factories worldwide in current company-controlled materials, but the underlying denominator is not reconciled
      across sources and the cited IDC market-share claim is not independently reproduced in the retained pool.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO007
    tableRefs:
      - TO001
  - id: leadership-capital
    title: Leadership, capital base, and disclosure quality
    body: >-
      The public leadership bench in accessible sources is narrow: Yuxiang Zhou is consistently presented as founder and
      CEO, and EquityZen also names Yuchen Huang as CTO, but the retained evidence does not expose a fuller management team
      or board structure. Capital formation is easier to trace than governance. Multiples logs six funding rounds and a
      large April 2026 Series D, while 36Kr adds a company-claim narrative of profitability and growth and Caixin ties the
      earlier 2021 round to Temasek-backed regional expansion. Even so, disclosure quality remains weak where investors
      would care most: the available sources give only a valuation range rather than an exact mark and public headcount
      signals conflict sharply between LinkedIn and Dealroom.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO014
      - CO015
    tableRefs:
      - TO002
      - TO003
  - id: milestones-risks
    title: Milestones and execution caveats
    body: >-
      The dated milestones show real company progression rather than a purely conceptual AI story. Black Lake moved from
      early funding soon after its 2016 founding to a 2018 product launch, a 2021 Temasek-led round, and a 2026 cycle of
      financing plus international-facing AI marketing at WAIC. That momentum matters, but the risk lens is not trivial:
      Caixin's older reporting shows Southeast Asia was still at proof-of-concept stage after pandemic delays, and the most
      skeptical retained 2026 analysis still argues that adoption depends on difficult factory-by-factory integration,
      change management, and heterogeneous IT estates. The chapter therefore supports commercial relevance, but not a clean
      conclusion that expansion or industrial-AI monetization is already de-risked.
    claimRefs:
      - CO006
      - CO011
      - CO012
      - CO013
    figureRefs:
      - FO001
