  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: series-d-terms
      missingEvidence: Exact Series D amount, pre-money and post-money valuation, price per share, dilution, liquidation preferences, board rights, and investor-control terms.
      whyItMatters: Entry discipline and downside protection cannot be assessed from a round date and broad third-party valuation range.
      diligencePath: Obtain the signed Series D term sheet, closing statement, and post-money cap table from management or the lead investor.
      relatedQuestionRefs: [QV004]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Current revenue or ARR, growth, gross margin, retention, customer concentration, cash use, and AI attach rate by cohort.
      whyItMatters: A SaaS valuation and target return require verified recurring economics and a consistent operating denominator.
      diligencePath: Request the latest board KPI pack, audited financials, customer cohort bridge, and cash forecast.
      relatedQuestionRefs: [QV002, QV005, QV008]
    - type: conflicting-data
      severity: material
      topic: financing-history
      missingEvidence: Primary confirmation reconciling the 2021-latest-round tracker, Caplight's April 2026 Series D record, and AI Market Watch's round estimate.
      whyItMatters: Unreconciled funding history prevents a reliable invested-capital total and valuation anchor.
      diligencePath: Reconcile company closing documents with confirmations from the Series D lead investor and prior-round cap-table records.
      relatedQuestionRefs: [QV001]
    - type: missing-source
      severity: material
      topic: scale-definition
      missingEvidence: Independently verified definitions and current counts for paid customers, active factories, users, deployments, and market share.
      whyItMatters: Company-issued scale claims cannot be translated into revenue quality or scenario probability without consistent denominators.
      diligencePath: Review customer-level billing data, active-use cohorts, churn records, and the underlying IDC market-share methodology.
      relatedQuestionRefs: [QV003, QV008]
