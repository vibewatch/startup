schemaVersion: report-v2
artifact: valuation
slug: black-lake-technologies
runDate: 2026-10-15
company:
  name: Black Lake Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Independent market-data pages indicate a 2026 Series D and a broad $1-2.5 billion valuation
    range, but the public record does not disclose the round price, amount, investor protections,
    or current operating economics. The resulting recommendation is research-more: Black Lake
    may merit continued diligence, but available evidence cannot support a precise entry value
    or target return.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      Black Lake should remain in active diligence, but public evidence does not support an
      invest-now decision at an unknown price. Caplight lists a Series D on April 23, 2026, while
      Dealroom records a very broad $1-2.5 billion 2026 valuation range. Neither source discloses
      the exact round amount, valuation, share price, or investor terms, and EquityZen places
      company-specific valuation, cap-table, preference, and financial information behind
      verified access. The positive case is credible commercial reach: Black Lake's LinkedIn
      profile claims nearly 40,000 factories and a 52.7% segment share. Those are company-issued
      claims rather than independently audited economics. With revenue, ARR, margin, retention,
      customer concentration, cash use, and preference terms unavailable, confidence is low,
      risk is high, and the valuation stance is unverified rather than a defensible point
      estimate.
    claimRefs: [CV005, CV006, CV007, CV011, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-record-and-thesis
    title: Financing record and thesis tension
    body: >-
      The financing record is internally inconsistent across current public pages. Startup
      Fundraising reports $120 million of disclosed funding and still identifies the February
      2021 Series C as the latest disclosed round. Caixin independently reported that the 2021
      round raised 500 million yuan ($77 million) and said no valuation was announced after the
      2019 or 2021 rounds. Caplight now lists a Series D dated April 23, 2026, and AI Market Watch
      gives an uncorroborated estimate of about RMB 1 billion ($138 million) for that round.
      Dealroom's funding range of $100-500 million is too broad to reconcile these records.
      Commercial scale is also definition-sensitive: a company-supplied Gritt profile describes
      nearly 5,000 early customers, while the current LinkedIn company page claims nearly 40,000
      factories. The thesis therefore depends on validating both the financing event and what
      the expanding deployment denominator actually represents.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV013, CV015, CV016]
    tableRefs: [TV002]
  - id: scenario-underwriting
    title: Bull, base, and bear underwriting
    body: >-
      A subscription SaaS model is the most appropriate starting lens because Dealroom describes
      Black Lake that way, but no public source in the assigned evidence provides revenue, ARR,
      growth, gross margin, retention, or cash-flow data needed for a revenue-multiple method.
      The bull case requires the company's factory reach and market-share claims to convert into
      durable expansion revenue and healthy margins. The base case is continued commercial
      progress with insufficient transparency to set an entry multiple. The bear case is a
      financing priced against company-reported scale while operating quality, dilution, and
      preferences remain hidden. Precise scenario valuation ranges or probabilities would be
      false precision; the only observed range is Dealroom's $1-2.5 billion bracket, which is a
      market-data indication rather than a verified transaction value. Scenario movement should
      therefore be tied to document-level evidence, not invented numerical forecasts.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Public evidence does not establish IPO or M&A readiness. EquityZen describes IPO, merger or
      acquisition, and eligible Express Deals as general private-investment exit routes, but it
      does not demonstrate a current Black Lake secondary market or a company-specific exit
      timetable. Dealroom reports 14 investors on the cap table, increasing the importance of
      understanding share classes and preference seniority before underwriting a new position.
      The next diligence package should include the signed Series D term sheet, post-money cap
      table, price per share, liquidation preferences, board rights, and a KPI bridge covering
      revenue or ARR, gross margin, retention, concentration, cash use, and deployment
      definitions. The thesis breaks if management will not provide those materials, if claimed
      factory scale does not translate into recurring economics, or if the round terms place new
      capital behind a heavy preference stack without a supportable return path.
    claimRefs: [CV010, CV011, CV012, CV013, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision element
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, research-more, "A 2026 Series D is indicated, but exact pricing and operating metrics are absent.", "Continue diligence; do not approve an investment from public evidence alone."]
      - [Confidence, low, "Financing databases conflict and the strongest scale metrics are company-issued.", "Treat the conclusion as provisional until primary documents are reviewed."]
      - [Risk rating, high, "Cap-table terms, revenue quality, retention, margins, concentration, and cash use are undisclosed.", "Require downside-protection analysis before setting exposure."]
      - [Valuation stance, unverified, "Dealroom shows only a broad $1-2.5B range rather than a verified transaction value.", "Do not convert the range into a point estimate or entry multiple."]
      - [Target return, not supportable, "No verified entry price, dilution terms, operating forecast, or exit timetable is public.", "Set a return hurdle only after the Series D documents and KPI model are available."]
    notes: >-
      Analyst synthesis from the linked public sources; the recommendation is price-sensitive,
      and unavailable values are reported as gaps rather than estimates.
    claimRefs: [CV005, CV006, CV007, CV011, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - [Thesis, "Black Lake appears to have raised institutional capital again in 2026.", "Caplight lists a Series D on April 23, 2026.", "Upgrade confidence after reviewing the signed term sheet and funding receipt."]
      - [Thesis, "The company may have meaningful commercial reach.", "The LinkedIn company page claims nearly 40,000 factories and 52.7% segment share.", "Upgrade after customer-level and third-party validation reconciles factories, customers, and active paid deployments."]
      - [Thesis, "A recurring-software valuation method may fit the business model.", "Dealroom characterizes Black Lake as subscription SaaS.", "Use a revenue multiple only after ARR, retention, margin, and growth are verified."]
      - [Anti-thesis, "The public funding chronology is not reconciled.", "Startup Fundraising still calls February 2021 the latest disclosed round, while Caplight lists an April 2026 Series D.", "Resolve with primary closing documents and investor confirmation."]
      - [Anti-thesis, "The public valuation indication is too broad for entry discipline.", "Dealroom reports $1-2.5B; Caplight displays no Series D amount or valuation.", "Require the exact pre-money, post-money, share price, and dilution."]
      - [Anti-thesis, "Scale claims may use changing denominators.", "A company-supplied profile references nearly 5,000 early customers, while LinkedIn claims nearly 40,000 factories.", "Reconcile paid logos, factories, users, supply-chain participants, and active cohorts."]
    notes: >-
      Coverage is limited to the assigned prefetched sources; company-issued scale statements are
      not treated as independent validation, and the two funding trackers are intentionally shown
      as conflicting records.
    claimRefs: [CV002, CV005, CV006, CV007, CV009, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key downside trigger
      - Probability signal
    rows:
      - [Bull, "Factory reach converts into durable SaaS expansion; market-share claims validate; retention and margins are strong.", "No numerical range is supportable yet; evidence would justify testing the upper part of the observed external bracket only after KPI verification.", "Company-reported reach fails independent customer and revenue reconciliation.", "Strengthens with audited ARR growth, cohort retention, gross margin, and clean Series D terms."]
      - [Base, "Commercial progress continues, but operating and financing transparency remains incomplete.", "Use the observed $1-2.5B Dealroom bracket only as a diligence reference, not fair value or an entry target.", "The actual Series D price and preference stack leave insufficient downside protection.", "Most consistent with the current mix of a recent round signal and missing underwriting inputs."]
      - [Bear, "The round was priced on reported scale while recurring economics, dilution, and exit readiness remain weak or opaque.", "No defensible floor can be calculated without verified revenue, cash use, and seniority; avoid rather than invent a discount.", "A down round, weak retention, concentrated revenue, or a senior preference overhang emerges.", "Strengthens if primary documents do not reconcile the funding trackers or management withholds KPI detail."]
    notes: >-
      Scenarios are conditional and qualitative because the assigned evidence supplies one broad
      external valuation range but no verified transaction price, operating forecast, or return
      denominator.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV011, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Evidence progresses from commercial and financing signals through unresolved operating and
      terms gaps to a research-more decision.
    data:
      nodes:
        - label: Commercial signal
          value: "Nearly 40,000 factories claimed"
          note: "Company-issued LinkedIn statement; independently unverified."
        - label: Financing signal
          value: "Series D dated Apr 23, 2026"
          note: "Caplight public round history; amount and valuation are blank."
        - label: External valuation signal
          value: "$1-2.5B"
          note: "Dealroom 2026 range, not a verified transaction price."
        - label: Operating-economics gap
          value: unavailable
          note: "Revenue, ARR, margin, retention, concentration, and cash use are not public."
        - label: Terms gap
          value: unavailable
          note: "Share price, dilution, preferences, and investor rights are not public."
        - label: Risk assessment
          value: high
          note: "Scale and valuation cannot be reconciled to recurring economics."
        - label: Recommendation
          value: research-more
          note: "Review primary financing documents and a current KPI pack before pricing."
    claimRefs: [CV005, CV006, CV007, CV010, CV011, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Public evidence supports diligence, not price approval
    body: >-
      Keep Black Lake under review, but defer any investment decision until primary financing
      documents and current operating KPIs support an entry valuation and target return.
    claimRefs: [CV005, CV006, CV007, CV011]
  - calloutType: risk
    title: The observed range is not a transaction value
    body: >-
      Dealroom's $1-2.5 billion range is useful context but cannot substitute for the Series D
      price, dilution, preference stack, or a valuation method grounded in operating results.
    claimRefs: [CV006, CV007, CV011]
