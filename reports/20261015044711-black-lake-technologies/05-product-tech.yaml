  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Primary security, privacy, compliance, and reliability documentation such as certifications, audit reports, incident history, or a status surface.
      whyItMatters: Buyers in regulated or high-throughput factories need proof that Black Lake can secure operational data and govern production-critical automation safely.
      diligencePath: Request security architecture, certification registers, data-processing controls, incident logs, and customer security review materials from management.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer or practitioner evidence such as API documentation, repositories, package activity, engineering talks, or community implementation threads.
      whyItMatters: Without a developer or practitioner surface, it is harder to judge integration readiness, ecosystem adoption, and whether Black Lake's platform is extensible beyond managed deployments.
      diligencePath: Ask for public API docs, SDK or connector inventories, integrator references, and any practitioner-community footprints that can substitute for open-source signals.
      relatedQuestionRefs: [QE007, QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: module-reliability
      missingEvidence: Module-level uptime, rollout scale, renewal, and outcome data for Smart Manufacturing, Supply Chain, and industrial AI agents beyond the marketed CAD-to-Process example.
      whyItMatters: The product story is strongest where public metrics exist; without comparable operating evidence across modules, diligence cannot separate a broad roadmap from durable deployed capability.
      diligencePath: Request module-by-module customer counts, implementation timelines, uptime/SLA history, attach rates for AI agents, and named reference calls by industry.
      relatedQuestionRefs: [QE004, QE008]
      relatedTableRefs: [TE001, TE002, TE003]
