          detail: Machine and workflow events captured from plant operations.
          modules:
            - label: Machine-device telemetry
            - label: Work-order, quality, and procurement events
        - label: Integration and synchronization
          detail: Connectors align operational data with enterprise systems.
          modules:
            - label: ERP, WMS, and other enterprise systems
            - label: Real-time aggregation and multi-tier synchronization
        - label: Workflow applications
          detail: Core factory software products coordinate execution and collaboration.
          modules:
            - label: Mini Worksheet / Xiaogongdan
            - label: Smart Manufacturing / Zhizao
            - label: Supply Chain collaboration
        - label: Industrial AI agents
          detail: Current-year agent products target decision-heavy manufacturing tasks.
          modules:
            - label: CAD-to-Process
            - label: Quotation and pricing
            - label: Procurement, scheduling, inspection, and tracking
        - label: Decision-support logic
          detail: Agent outputs depend on factory rules and production constraints.
          modules:
            - label: Factory rules, equipment capabilities, and process requirements
            - label: Reusable software-invoked decision workflows
        - label: Deployment footprint
          detail: Public positioning spans SMEs, larger factories, and global expansion markets.
          modules:
            - label: SME factories through multi-plant and Fortune 500 customers
    approximationNotes: The layer boundaries are synthesized from public product descriptions because Black Lake does not publish a detailed system diagram in the assigned pool.
    claimRefs: [CE003, CE005, CE007, CE008, CE010, CE011]
callouts:
  - calloutType: strength
    title: Broad workflow footprint
    body: >-
      The public product set spans frontline work orders, smart manufacturing coordination, supply-chain
      collaboration, and newer AI-agent workflows, which is broader than a single-point factory app pitch.
    claimRefs: [CE004, CE005, CE010]
  - calloutType: risk
    title: Technical proof lags the product story
    body: >-
      Public sources offer named workflow coverage and one strong CAD-to-Process metric, but they do not provide
      primary evidence for uptime, security controls, model-governance practices, or module-level adoption.
    claimRefs: [CE006, CE013, CE014]
  - calloutType: assumption
    title: Integration is a core execution dependency
    body: >-
      Because Black Lake's value proposition depends on connecting enterprise systems and machine data, customer
      implementation quality is likely a gating factor for product success even if the company does not publish
      connector-level performance data.
    claimRefs: [CE003, CE007]
