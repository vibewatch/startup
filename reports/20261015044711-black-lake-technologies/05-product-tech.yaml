      - ["Multi-plant production coordination", "Fragmented collaboration across staff and facilities", "Smart Manufacturing provides cloud collaboration and monitoring", "Alibaba highlights 40% improved scheduling efficiency and 10% improved capacity utilization", "Benefits are marketplace marketing claims rather than audited studies"]
      - ["Engineering drawing interpretation and process planning", "Experienced engineers manually interpret drawings and define process steps", "CAD-to-Process Agent generates process steps and technical requirements", "OHSEM and PR Newswire cite about one minute analysis with over 95% accuracy", "Public evidence does not explain sample size or failure modes"]
      - ["Quoting, procurement, scheduling, inspection, and order tracking", "Human experts make repetitive operational decisions", "WAIC 2026 industrial AI agents target each workflow", "Current-year product breadth is explicit across these functions", "No public attach-rate or customer-by-customer deployment data"]
    notes: Benefits mix partner-marketed and company-issued examples; absent denominators or methodology are treated as limitations rather than normalized into comparable KPIs.
    claimRefs: [CE005, CE006, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Data capture and machine telemetry", "Collects real-time shop-floor signals", "Requires machine-device connectivity and clean operating data", "Public sources do not disclose data quality controls or fallback behavior"]
      - ["Enterprise-system integration", "Connects ERP, WMS, and other enterprise systems", "Depends on customer system access and implementation resources", "Integration burden and connector coverage are not documented publicly"]
      - ["Workflow and collaboration applications", "Coordinate staff from managers to line workers", "Depends on user adoption and mobile/web workflows", "Public evidence lacks cohort-level usage and renewal data by module"]
      - ["Industrial AI knowledge and agent layer", "Applies rules and experience to planning, pricing, scheduling, and quality tasks", "Depends on factory-specific rules, equipment constraints, and review loops", "No public governance detail for model validation, security controls, or rollback"]
    notes: The stack is reconstructed from Dealroom, AI Market Watch, LinkedIn, and current-year product releases because Black Lake does not publish a technical reference architecture in the assigned pool.
    claimRefs: [CE001, CE003, CE005, CE007, CE008]
