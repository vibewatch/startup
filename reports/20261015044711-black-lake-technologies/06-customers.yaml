  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-economics
      missingEvidence: NRR, GRR, logo churn, renewal rates, and contract length by customer cohort or segment.
      whyItMatters: Without retention data, customer count alone cannot show whether Black Lake is compounding durable revenue or replacing churn with new logos.
      diligencePath: Request cohort retention tables, renewal schedules, and customer-success KPIs broken out by SME versus enterprise segment.
      relatedQuestionRefs:
        - QU008
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, top-10 customer share, and channel or partner concentration by geography.
      whyItMatters: Concentration could materially change the quality of the customer base even if headline factory counts keep growing.
      diligencePath: Obtain a customer concentration schedule and revenue bridge that separates direct accounts, partner-led accounts, and any marquee enterprise logos.
      relatedQuestionRefs:
        - QU008
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-coverage
      missingEvidence: A complete customer-reference list separating pilots from production deployments, with region, module, start date, and current status.
      whyItMatters: The named examples in the pool show real usage, but they are a curated sample and do not establish how representative production deployment is across the installed base.
      diligencePath: Request the full customer-reference roster or an auditable sample frame that distinguishes active production sites from marketing references.
      relatedQuestionRefs:
        - QU004
        - QU005
      relatedTableRefs:
        - TU003
    - type: missing-source
