  - calloutType: risk
    title: International and AI upsell claims still need cohort-level proof
    body: >-
      The 2026 expansion narrative is plausible, but the retained pool still lacks the cohort metrics needed
      to show how many customers have moved from domestic MES-style workflows into multi-region industrial-AI spend.
    claimRefs:
      - CU010
      - CU012
      - CU014
