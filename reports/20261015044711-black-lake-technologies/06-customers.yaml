    title: Breadth is credible; durability is not yet disclosed
    body: >-
      Black Lake looks stronger on proving broad manufacturing relevance and repeatable workflow deployment
      than on proving retention, multi-year expansion, or customer concentration quality.
    claimRefs:
      - CU001
      - CU002
      - CU007
