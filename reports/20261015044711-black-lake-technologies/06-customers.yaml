  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - ChinaUST Group
        - Manufacturing enterprise
        - Replaced traditional MES with Black Lake Smart Manufacturing for production management and traceability
        - Production workflow reference
        - Saved 7,000 man-hours and says stronger traceability helped win more orders
        - Partner marketplace quote only; no deployment scope, contract duration, or baseline methodology
      - - JYD Technology
        - Manufacturing SME
        - Uses Black Lake Mini Worksheet for daily collaboration and bottleneck management
        - Production workflow reference
        - Reported a 5% improvement in order delivery rate after one month
        - Single-account anecdote on partner marketplace; no follow-on retention or spend data
      - - Sun Valley Foods
        - Food manufacturer
        - Connects weighing, material handling, reporting, packaging, and quality checks in one operating flow
        - Production workflow example
        - Company frames the deployment around frontline usability in a complex food supply chain
        - No quantified ROI, site count, or contract information
      - - Meiheng
        - Industrial equipment manufacturer
        - Connects production execution, material management, quality inspection, and project progress
        - Production workflow example
        - Black Lake says real-time visibility improves issue detection and delivery coordination
        - Company-authored post with no independent verification
      - - Wuxi Guofeng
        - 18-person precision machining SME
        - Mini Worksheet connects drawings, process steps, reporting, inspection, tool usage, and procurement requests
        - Production workflow example
        - Shows fit for high-mix, small-batch SME manufacturing rather than only large enterprises
        - No commercial details and no quantified before/after metrics
    notes: >-
      Partial sample of named deployments visible in the assigned pool's Alibaba Cloud listing and LinkedIn
      company posts; the pool does not provide a complete customer-reference registry or third-party rollout audit.
