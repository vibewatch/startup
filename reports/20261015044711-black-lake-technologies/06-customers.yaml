company:
  name: Black Lake Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Black Lake shows credible customer breadth across factory sizes and verticals, but the strongest
    proof in the assigned pool is still company-channeled workflow evidence rather than independently
    verified retention or concentration data. The evidence supports real deployment activity and some
    expansion logic, while leaving durability, paying-logo definitions, and international depth unresolved.
sections:
  - id: customer-footprint-and-segmentation
    title: Customer footprint and segmentation
    body: >-
      The assigned pool supports a broad but still partly company-mediated picture of who Black Lake serves.
      Official materials repeated through AI Watch, Breezy Today, and LinkedIn say the company now serves
      nearly 40,000 factories across more than 30 industries, while independent profiles on Dealroom,
      EquityZen, and AI Market Watch place the customer range from SMEs to Fortune 500 manufacturers.
      The operating model appears deliberately segmented: Mini Worksheet is framed as a fast-start wedge for
      small factories and frontline teams, while Smart Manufacturing and broader industrial-AI workflows are
      positioned for larger, more integrated production environments. That breadth matters because it suggests
      Black Lake is not relying on one narrow buyer persona, but the pool still does not disclose how many of
      those factories are paying logos, active plants, channel-driven signups, or AI-agent customers.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU011
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: named-deployment-proof
    title: Named deployment proof is strongest at workflow level
    body: >-
      Black Lake's best customer evidence is concrete workflow usage rather than generic logo walls. The
      Alibaba Cloud marketplace listing includes two quantified customer anecdotes: ChinaUST Group says Smart
      Manufacturing saved 7,000 man-hours and helped it win more orders, while JYD Technology says Mini
      Worksheet improved order-delivery rate by 5% after one month. LinkedIn posts add fresher but less
      quantified examples from Sun Valley Foods, Meiheng, Wanju, Wuxi Guofeng, and Larbee, each tied to
      specific operational use cases such as quality traceability, production execution, procurement, or SKU
      coordination. Together those cases make the product feel deployed in production contexts, not just
      marketed to prospects, but most examples remain company-authored and do not disclose contract scope,
      module breadth, user counts, or whether the reference covers one plant or a scaled multi-site rollout.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU003
  - id: durability-expansion-and-concentration-risks
    title: Durability, expansion, and concentration remain the weak points
    body: >-
      The chapter's main limitation is not whether Black Lake has real customers; it is whether those
      customers renew, expand, and diversify revenue in a durable way. Caixin's 2021 reporting already showed
      recognizable manufacturers and some Southeast Asia contracts, but it also quoted management describing
      the region as still in an early proof-of-concept stage. A newer AI Market Watch commentary on the 2026
      WAIC launch similarly argues that industrial-AI adoption still faces integration complexity, change
      management, and heterogeneous factory IT stacks. Those frictions are plausible customer-success risks,
      and none of the retained sources discloses NRR, GRR, logo churn, contract length, top-customer share,
      or the installed-base denominator behind the 40,000-factories claim. Black Lake therefore looks more
      proven on acquisition and reference generation than on disclosed retention economics.
    claimRefs:
      - CU010
      - CU012
      - CU013
      - CU014
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - SME frontline factories
        - Owner or plant manager buys; frontline workers use; plant budget pays
        - Work orders, production visibility, worker performance, traceability
        - Mini Worksheet claims 3-hour implementation and 2-day start; Wuxi Guofeng example covers an 18-person shop
        - Fast wedge for high-volume SMB acquisition and low-friction onboarding
        - No disclosed ACV, renewal, or attach-rate from Mini Worksheet into broader platform spend
      - - Mid-market single-site manufacturers
        - Operations and IT managers buy; shop-floor supervisors and workers use; operations budget pays
        - Production execution, quality traceability, material management, scheduling
        - ChinaUST, JYD, Sun Valley, and Wanju references show workflow-specific deployment proof
        - Core monetization tier where quantified efficiency and delivery outcomes are most visible
        - Customer count is not broken out by paying site, module mix, or annual spend
      - - Multi-plant and enterprise manufacturers
        - Central digital team or plant leadership buys; cross-functional factory teams use; enterprise operations budget pays
        - Multi-plant collaboration, AI-ready data layer, supply-chain coordination
        - LinkedIn, EquityZen, and AI Market Watch say customers range to Fortune 500 manufacturers
        - Provides brand validation and opens larger land-and-expand paths
        - Pool does not distinguish marquee logos from pilots, one-site deployments, or full-network rollouts
      - - Overseas and supply-chain expansion accounts
        - Regional operations leaders and supply-chain teams buy; factory and procurement teams use; expansion budget pays
        - Supplier coordination, fulfillment reliability, international factory digitization
        - Caixin cites Southeast Asia contracts; 2026 company releases name Southeast Asia, Latin America, and Eastern Europe as priorities
        - Could widen TAM beyond domestic MES replacement into global industrial AI workflows
        - No disclosed live-site, ARR, or renewal data outside China
    notes: >-
      Synthesizes assigned-pool evidence across official, partner, and independent profiles; segment economics
      and payer detail are inferred where the sources describe users and use cases but not contract structure.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU008
      - CU010
      - CU014
