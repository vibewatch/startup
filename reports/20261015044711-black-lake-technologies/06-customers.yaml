        - The company does not define active paying factories versus broader served locations
      - - Coverage breadth
        - 30+ industries
        - "2026"
        - AI Watch / Breezy Today / LinkedIn / AI Market Watch
        - high
        - Broadens the case that Black Lake can sell repeatably across manufacturing verticals
        - The pool does not reveal revenue mix by industry
      - - Deployment speed claim
        - 4-6 weeks implementation; 2 days to get started
        - null
        - Alibaba Cloud marketplace
