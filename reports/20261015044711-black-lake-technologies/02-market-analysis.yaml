    title: Evidence hierarchy for market sizing
    type: pyramid
    summary: >-
      Six progressively more decision-useful sizing layers show that the evidence
      stops before an independently verified monetizable-market denominator.
    data:
      nodes:
        - label: Total addressable market spend
          value: null
          unit: USD
          detail: No assigned source provides a market-value denominator.
        - label: Serviceable market spend
          value: null
          unit: USD
          detail: Geography, segment, contract value, and buyer budget are not reconciled.
        - label: Reported narrow-category share
          value: 52.7
          unit: percent
          detail: SpatialDaily reports IDC, but the original report and denominator are unavailable.
        - label: Factories served
          value: 40000
          unit: factories
          detail: Company-claimed worldwide footprint; paid and active sites are not reconciled.
        - label: Users supported
          value: 2000000
          unit: users
          detail: Company claim with no disclosed active-user or payer definition.
        - label: Industries covered
          value: 30
          unit: industries
          detail: Company-claimed breadth; it does not quantify spend or penetration.
    approximationNotes: >-
      Values are reproduced as disclosed and are not comparable populations,
      nested layers, or a calculated funnel; null means the assigned sources do
      not support a value.
    claimRefs: [CM006, CM007, CM008, CM009, CM016]
