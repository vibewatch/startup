          detail: "Public sources do not quantify renewal, cohort retention, or expansion within existing accounts."
          touchpoints: ["Management retention schedule required", "Customer reference calls required"]
    approximationNotes: "The ordered stages synthesize public adoption surfaces; they are not a measured conversion funnel and carry no inferred stage rates."
    claimRefs: [CU004, CU008, CU009, CU012, CU013]
