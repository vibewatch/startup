      - ["Nooks", "AI-native sales tools", "Fresh prospect intelligence for sales agents", "Described as switched production provider", "70.5% reported reduction in web-grounding spend", "No contract value, workload mix, sample size, or renewal evidence"]
      - ["Opendoor / Starbridge", "Real estate and public-sector intelligence", "HOA verification and government-site research", "Described as live workflows", "HOA work reduced to about two minutes of verification; Starbridge integrated within days", "Independent article relays customer reports; scale and durability remain undisclosed"]
