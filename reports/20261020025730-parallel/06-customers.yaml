      - ["Genpact field organization", "Enterprise sales", "Meeting Assist for account, financial, competitor, decision-maker, and buying-center intelligence", "Production", "Reported efficiency and scaled engagement, without a numeric result", "No usage volume, revenue impact, or retention evidence"]
