      - [Tavily, "Direct search API", "Unknown in allocated evidence", "Search, extraction, crawling, mapping, research", "Simple public pricing and framework integrations", "Comparative quality evidence is competitor-authored"]
      - [Linkup, "Direct search API", "Unknown in allocated evidence", "Trusted-source fact retrieval", "Two-tier Standard / Deep offer", "Crawling and browser interaction not established"]
