      - [Firecrawl, "One credit per page; competitor page describes flat model", "Standard plan described at $99 monthly or $83 monthly billed annually", "1,000 credits per month", "Self-reported on Firecrawl's own comparison"]
      - [Exa, "$7 per 1,000 search requests", "$12-$15 per 1,000 deep searches", "1,000 requests per month", "Terms reported by competitor Firecrawl"]
      - [Tavily, "$0.008 per credit for PAYG basic search", "Research endpoint available; comparable deep price not retained", "1,000 credits per month", "Terms reported by competitor Firecrawl"]
      - [Linkup, "EUR5 per 1,000 Standard searches", "EUR50 per 1,000 Deep searches", "EUR5 of queries per month", "Terms reported by competitor Firecrawl"]
      - ["Internal build", "No list price", "Engineering, crawling, proxy, inference, and maintenance cost", "None", "Total cost depends on coverage, latency, and compliance requirements"]
    notes: >-
      Point-in-time list pricing from Parallel's homepage and Firecrawl's 2026 competitor page;
      values are not realized customer prices, and currency, included usage, and service levels
      are not fully comparable.
    claimRefs: [CP003, CP008, CP014]
figures:
  - id: FP001
    title: Competitive positioning by workflow breadth and research depth
    type: quadrant
    summary: >-
      Analyst ordinal map separates suite breadth from deep-research orientation; it is not a
      measured quality or market-share ranking.
    data:
      xAxis:
        label: "Workflow breadth (1=narrow, 5=broad)"
        min: 1
        max: 5
      yAxis:
        label: "Research depth orientation (1=primitive, 5=deep)"
        min: 1
        max: 5
      points:
        - label: Parallel
          x: 4.5
          y: 4.6
          note: "Broad official suite plus company-run deep-research benchmarks."
        - label: Firecrawl
          x: 5
          y: 3.1
          note: "Broad crawl, scrape, search, and interaction stack; research depth scored from competitor self-description."
        - label: Exa
          x: 3
          y: 3.5
          note: "Semantic discovery, content retrieval, research, and similar-page focus."
        - label: Tavily
          x: 3.8
          y: 3.4
          note: "Search, extract, crawl, map, and research endpoints in the retained comparison."
        - label: Linkup
          x: 2.4
          y: 3.7
          note: "Narrower trusted-source search proposition with Standard and Deep tiers."
        - label: "Internal build"
          x: 4.2
          y: 2.2
          note: "Potentially broad but depth depends on buyer engineering and data-access investment."
    approximationNotes: >-
      Coordinates are analyst-assigned ordinal scores derived from disclosed product scope and
      research orientation. They are rounded judgments, not benchmark results; competitor-issued
      descriptions and unknown capabilities reduce confidence.
    claimRefs: [CP005, CP007, CP010, CP016]
callouts:
  - calloutType: risk
    title: Benchmark evidence is not neutral
    body: >-
      Parallel and Firecrawl each publish comparisons favorable to their own products. Treat the
      results as testable hypotheses until a buyer-run workload benchmark controls for query set,
      latency, accuracy, source quality, and total cost.
    claimRefs: [CP007, CP010, CP016]
  - calloutType: recommendation
    title: Underwrite outcomes and switching behavior
    body: >-
      Require cohort retention, expansion by API, migration evidence, and a neutral bake-off
      before assigning a moat premium to index scale or product breadth.
    claimRefs: [CP002, CP012, CP013]
