      - ["Responses", "Conversational product needing a finished answer", "Commercial API on official product surface", "Synchronous cited synthesis", "Quality and latency distribution on customer workloads"]
      - ["Task", "Team automating multi-step research", "Commercial API with reported production deployment", "Structured cited research with confidence signals", "Processor-level reliability, cost, and completion rates"]
      - ["FindAll", "Team building entity datasets", "Commercial API on official product surface", "Natural-language discovery and structured enrichment", "Recall, duplicate handling, and update guarantees"]
      - ["Monitor", "Team tracking changing external facts", "Commercial API on official product surface", "Webhook alerts for material changes", "Polling cadence, missed-event rate, and delivery SLA"]
      - ["Parallel Web Index", "All retrieval and agent modules", "Proprietary production dependency", "Index designed for machine retrieval", "Coverage, licensing mix, crawl policy, and geographic depth"]
    notes: "Public status and differentiation are based primarily on company descriptions; undisclosed reliability and coverage fields are shown as diligence gaps, not inferred values."
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE005", "CE010", "CE015"]
  - id: "TE002"
    title: "Workflow and use-case evidence"
    columns:
      - "User job"
      - "Prior or current workflow"
      - "Parallel solution"
      - "Reported measurable benefit"
      - "Limitation"
    rows:
      - ["Ground a live assistant response", "Agent retrieves current external context", "Search, Extract, or Responses", "No independently audited benefit disclosed", "Customer-specific accuracy and latency are unknown"]
      - ["Produce a structured research deliverable", "Analyst or agent performs multi-step web research", "Task API", "No independently audited cross-customer benefit disclosed", "Upper-tier latency can extend to background-job timescales"]
      - ["Watch prices, regulations, or competitors", "Team repeatedly checks changing web sources", "Monitor API with webhook alerts", "No public missed-event or false-alert rate", "Reliability and cadence commitments are undisclosed"]
      - ["Price insurance replacement items", "Manual line-item price research", "Genpact Property Contents Pricing AI Assist using Task API", "Partner reports 55% touchless processing and 50% lower cycle time", "Partner-issued release; baseline and audit method are not public"]
      - ["Run research-heavy legal agents", "Legal professionals require granular source control", "Parallel retrieval within Harvey's agents", "No quantified outcome disclosed", "Reported by news coverage, without a public technical case study"]
    notes: "Benefits are retained with their original issuer and denominator; 'no benefit disclosed' means the reviewed pool supplied no auditable metric."
    claimRefs: ["CE002", "CE003", "CE004", "CE011", "CE015", "CE016"]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns:
      - "Layer or component"
      - "Role"
      - "Dependency"
      - "Primary technical risk"
    rows:
      - ["Integration surface", "Connects applications through REST, SDK, MCP, and compatible frameworks", "Stable schemas, authentication, and client libraries", "Breaking changes or framework-specific behavior"]
      - ["Web Agents", "Plan questions and return synthesized, cited outputs", "Custom models, orchestration harness, and retrieval tools", "Opaque model behavior and variable latency or cost"]
      - ["Web Tools", "Searches, ranks, and extracts raw web context", "Index freshness and page-access success", "Dynamic sites, rate limits, gates, and extraction errors"]
      - ["Basis", "Attaches provenance and confidence information", "Citation resolution and calibration process", "Confidence methodology is not independently disclosed"]
      - ["Parallel Web Index", "Supplies ranked web content to every product", "Crawling, licensing, deduplication, and ranking", "Coverage gaps, publisher restrictions, and single-vendor dependence"]
      - ["Enterprise controls", "Supports security and procurement requirements", "Audit scope, retention controls, identity, and contractual terms", "Claims require audit-report and control-level verification"]
    notes: "Architecture is a synthesis of disclosed components; no undisclosed implementation detail, throughput, or availability level is assumed."
    claimRefs: ["CE005", "CE006", "CE007", "CE008", "CE009", "CE012"]
