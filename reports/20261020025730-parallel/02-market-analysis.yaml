      - Segment or category
      - Included spend
      - Excluded or adjacent spend
      - Buyer or payer
      - Relevance to Parallel
    rows:
      - ["Agent web retrieval", "Programmatic search and fresh context for software agents", "Human search advertising and consumer search interfaces", "AI product or engineering budget", "Core"]
      - ["Web extraction", "Page and PDF extraction prepared for model use", "Generic document management and private-corpus RAG", "Engineering or data platform budget", "Core"]
      - ["Agentic research", "Cited multi-source research and structured outputs", "General chat subscriptions and unaudited summaries", "Product, research, or functional operations budget", "Core"]
      - ["Monitoring and enrichment", "External-web alerts, entity discovery, and live record enrichment", "Internal application observability and static purchased datasets", "Operations, intelligence, or data budget", "Core to adjacent"]
      - ["Content access infrastructure", "Licensed or compensated content used by agent workflows", "Publisher advertising and subscriptions unrelated to agent access", "Infrastructure provider and content-supply economics", "Enabling adjacency"]
      - ["Status-quo alternatives", "DIY crawl/index/parse stacks, browser automation, narrow data vendors, and human research", "None; these are substitution paths rather than a single spend pool", "Engineering, operations, or outsourced-services budget", "Competitive constraint"]
    notes: >-
      Boundary is synthesized from current product descriptions and the assigned independent
      market analysis; categories overlap and are not additive.
    claimRefs: [CM001, CM002, CM007]
  - id: TM002
    title: Market sizing lenses and limitations
    columns:
      - Lens
      - Period
      - Geography
      - Reported value
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["AI-agent software", "2025 estimates", "Not specified", "$7.6B-$7.8B", "Adjacent published estimates summarized by Marvin Vista", "Low", "Only a share could fund agent web infrastructure"]
      - ["Web scraping services", "2025 estimates", "Not specified", "Approximately $1B-$9B", "Adjacent published estimates summarized by Marvin Vista", "Low", "Very wide range and includes non-agent workloads"]
      - ["Enterprise search", "2025 estimates", "Not specified", "$5.3B-$6.7B", "Adjacent published estimates summarized by Marvin Vista", "Low", "Mostly internal search; only a slice concerns the open web"]
      - ["AI-native team spend input", "Illustrative current run-rate", "Not specified", "$125M-$500M", "5,000 teams multiplied by $25k-$100k annual spend", "Low", "Buyer count and spend assumptions are not independently verified"]
      - ["Enterprise team spend input", "Illustrative current run-rate", "Not specified", "$200M-$1B", "2,000 enterprises multiplied by $100k-$500k annual spend", "Low", "Buyer count, procurement timing, and spend assumptions are unverified"]
      - ["Bottom-up SAM", "Illustrative current run-rate", "Not specified", "$300M-$1.5B", "Rounded synthesis of the two buyer-spend inputs", "Low", "Not a company forecast or independently validated market study"]
    notes: >-
      Values preserve the source's periods, ranges, denominators, and illustrative methodology.
      Inputs overlap with broad adjacent markets and must not be summed into a TAM.
    claimRefs: [CM010, CM011, CM012, CM013]
  - id: TM003
    title: Segment, user, payer, and adoption map
    columns:
      - Segment
      - Buyer
      - User
      - Payer or budget owner
      - Workflow
      - Adoption trigger
    rows:
      - ["AI-native product companies", "Head of AI, product, or engineering", "Agent developers", "Product or engineering budget", "Live search, extraction, and cited research inside a product", "DIY stack becomes unreliable or expensive at production volume"]
      - ["Automation and workflow platforms", "Platform product or engineering leader", "Integration developers and downstream customers", "Platform infrastructure budget", "Embedded web research and enrichment tools", "A native integration expands platform capability"]
      - ["Enterprise internal-agent teams", "Enterprise AI or data-engineering leader", "Analysts, operations teams, and internal-agent builders", "AI transformation budget with security and procurement review", "Research, compliance, market intelligence, or account enrichment", "Production use requires auditability, security controls, and fresh data"]
      - ["Service providers and BPOs", "Practice or transformation leader", "Delivery teams and workflow designers", "Client-delivery or automation budget", "Continuous research embedded in managed processes", "Automation must replace repetitive human work with traceable outputs"]
      - ["Individual developers and evaluators", "Developer", "Developer", "Personal or small-team tooling budget", "MCP search and prototype agents", "Free allowance and low-friction integration enable testing"]
    notes: >-
      Buyer and payer roles are evidence-constrained hypotheses from two secondary analyses and
      current integration/pricing surfaces; procurement ownership and segment conversion rates
      remain unverified.
    claimRefs: [CM003, CM004, CM005, CM006, CM015]
figures:
  - id: FM001
    title: Evidence-constrained market sizing pyramid
    type: pyramid
    summary: >-
      Broad adjacent estimates narrow through explicit buyer-spend assumptions to an illustrative
      SAM and a scenario capture range; the layers are not additive.
    data:
      nodes:
        - label: Broad AI-agent software adjacency
          value: "$7.6B-$7.8B"
          detail: "2025 estimate range; only a portion could map to agent web infrastructure."
        - label: Broad web-scraping adjacency
          value: "Approximately $1B-$9B"
          detail: "2025 estimate range spanning agent and non-agent workloads."
        - label: AI-native buyer input
          value: "$125M-$500M"
          detail: "Illustrative: 5,000 teams multiplied by $25k-$100k annual spend."
        - label: Enterprise buyer input
          value: "$200M-$1B"
          detail: "Illustrative: 2,000 enterprises multiplied by $100k-$500k annual spend."
        - label: Illustrative SAM
          value: "$300M-$1.5B"
          detail: "Rounded secondary-analysis range; not independently validated."
        - label: Execution-case capture
          value: "5%-15% of SAM over about five years"
          detail: "Scenario sensitivity, not a forecast or reported revenue."
    approximationNotes: >-
      The pyramid preserves one secondary analysis's ranges and buyer-count assumptions. Layers
      are directional evidence lenses, not strictly nested or additive markets; no independent
      TAM/SAM/SOM study was available in the assigned pool.
    claimRefs: [CM010, CM011, CM013, CM014]
callouts:
  - calloutType: risk
    title: Do not capitalize the broad adjacencies
    body: >-
      AI-agent software, web scraping, and enterprise search overlap and include substantial
      spend outside Parallel's market. The illustrative SAM should remain a sensitivity range
      until buyer counts and annual spend are independently verified.
    claimRefs: [CM010, CM011, CM012, CM013]
  - calloutType: insight
    title: Adoption proof is ahead of budget proof
    body: >-
      Named production users, integrations, and a claimed 1,000-plus team footprint support
      category demand, but public evidence does not disclose paying-customer count, segment
      conversion, workload retention, or contract values.
    claimRefs: [CM004, CM005, CM006, CM015]
