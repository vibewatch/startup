  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Parallel's relevant market is narrower than search, AI software, or enterprise automation in aggregate.
              The product is positioned as machine-oriented infrastructure for agents that need live retrieval, page
              extraction, cited synthesis, entity discovery, and continuous monitoring. The included spend is therefore
              the portion of software and data budgets assigned to programmatic open-web access and research workflows.
              Human-facing search advertising, generic chat, private-corpus RAG, internal observability, and broad RPA
              are adjacencies rather than direct market size. Buyers can also assemble search APIs, crawlers, parsers,
              browser automation, caching, and model prompts internally; use model-platform browsing; buy narrow data
              products; or retain human research teams. This boundary matters because adding every adjacent category
              would double count overlapping workflows and materially overstate the addressable opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not contain an authoritative, independently sourced market study for
              agent-facing web infrastructure. One secondary analysis instead triangulates from adjacent 2025 estimates:
              AI-agent software at $7.6 billion to $7.8 billion, web scraping services at roughly $1 billion to $9
              billion, and enterprise search at $5.3 billion to $6.7 billion, while warning that only portions of these
              categories map to the target market. Its illustrative bottom-up SAM of $300 million to $1.5 billion
              assumes 5,000 AI-native teams spending $25,000 to $100,000 annually plus 2,000 enterprises spending
              $100,000 to $500,000. A five-year 5% to 15% capture scenario is a sensitivity case, not a forecast. These
              ranges should inform diligence bounds, not valuation math, until buyer counts, workload volumes,
              retention, and gross-margin evidence are independently verified.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
