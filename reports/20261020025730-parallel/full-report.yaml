          - type: callout
            title: Do not capitalize the broad adjacencies
            body: >-
              AI-agent software, web scraping, and enterprise search overlap and include substantial spend outside
              Parallel's market. The illustrative SAM should remain a sensitivity range until buyer counts and annual
