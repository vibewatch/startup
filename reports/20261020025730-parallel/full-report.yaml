              - CP008
              - CP011
              - CP014
      - number: '3.2'
        title: Capability, pricing, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Parallel's competitive pitch is a unified product family running on a proprietary index: Search and
              Extract provide primitives, Responses serves synchronous answers, Task supports deeper research, FindAll
              builds datasets, and Monitor tracks changes. The company also advertises citation and confidence tooling,
              SOC 2 Type II certification, and per-request pricing. Firecrawl's comparison presents a different
              boundary, arguing that its open-source, self-hostable stack adds crawling and browser interaction that
              Parallel does not offer. That is useful buyer evidence but not an independent benchmark because Firecrawl
              is a competitor. Composio's Hermes integration shows that Parallel can enter agent workflows through an
              ecosystem connector, which reduces integration friction but does not establish durable lock-in. Pricing is
              sufficiently public for directional procurement comparison, yet realized enterprise discounts, minimum
              commitments, service levels, and overage terms remain unavailable in the allocated evidence.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
