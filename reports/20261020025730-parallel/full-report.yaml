        blocks:
          - type: paragraph
            body: >-
              The available record describes three major financing steps: an approximately $30 million seed round in
              January 2024, a $100 million Series A at an approximately $740 million valuation in November 2025, and a
              $100 million Series B at a $2 billion valuation in April 2026. The Series B report puts cumulative capital
              raised at $230 million. Named investors span Khosla Ventures, First Round Capital, Index Ventures,
