  - id: FM001
    title: Evidence-constrained market sizing pyramid
    type: pyramid
    summary: >-
      Broad adjacent estimates narrow through explicit buyer-spend assumptions to an illustrative SAM and a scenario
      capture range; the layers are not additive.
    data:
      nodes:
        - label: Broad AI-agent software adjacency
          value: $7.6B-$7.8B
          detail: 2025 estimate range; only a portion could map to agent web infrastructure.
        - label: Broad web-scraping adjacency
          value: Approximately $1B-$9B
          detail: 2025 estimate range spanning agent and non-agent workloads.
        - label: AI-native buyer input
          value: $125M-$500M
          detail: 'Illustrative: 5,000 teams multiplied by $25k-$100k annual spend.'
        - label: Enterprise buyer input
          value: $200M-$1B
          detail: 'Illustrative: 2,000 enterprises multiplied by $100k-$500k annual spend.'
        - label: Illustrative SAM
          value: $300M-$1.5B
          detail: Rounded secondary-analysis range; not independently validated.
        - label: Execution-case capture
          value: 5%-15% of SAM over about five years
          detail: Scenario sensitivity, not a forecast or reported revenue.
    approximationNotes: >-
      The pyramid preserves one secondary analysis's ranges and buyer-count assumptions. Layers are directional evidence
      lenses, not strictly nested or additive markets; no independent TAM/SAM/SOM study was available in the assigned
      pool.
    claimRefs:
      - CM010
      - CM011
      - CM013
      - CM014
  - id: FP001
    title: Competitive positioning by workflow breadth and research depth
    type: quadrant
    summary: >-
      Analyst ordinal map separates suite breadth from deep-research orientation; it is not a measured quality or
      market-share ranking.
    data:
      xAxis:
        label: Workflow breadth (1=narrow, 5=broad)
        min: 1
        max: 5
      yAxis:
        label: Research depth orientation (1=primitive, 5=deep)
        min: 1
        max: 5
      points:
        - label: Parallel
          x: 4.5
          'y': 4.6
          note: Broad official suite plus company-run deep-research benchmarks.
        - label: Firecrawl
          x: 5
          'y': 3.1
          note: Broad crawl, scrape, search, and interaction stack; research depth scored from competitor self-description.
        - label: Exa
          x: 3
          'y': 3.5
          note: Semantic discovery, content retrieval, research, and similar-page focus.
        - label: Tavily
          x: 3.8
          'y': 3.4
          note: Search, extract, crawl, map, and research endpoints in the retained comparison.
        - label: Linkup
          x: 2.4
          'y': 3.7
          note: Narrower trusted-source search proposition with Standard and Deep tiers.
        - label: Internal build
          x: 4.2
          'y': 2.2
          note: Potentially broad but depth depends on buyer engineering and data-access investment.
    approximationNotes: >-
      Coordinates are analyst-assigned ordinal scores derived from disclosed product scope and research orientation.
      They are rounded judgments, not benchmark results; competitor-issued descriptions and unknown capabilities reduce
      confidence.
    claimRefs:
      - CP005
      - CP007
      - CP010
      - CP016
  - id: FI001
    title: Revenue model bridge from activity to cash economics
    type: flow
    summary: >-
      Public evidence supports the activity-to-billing steps, while realized revenue, gross profit, and cash conversion
      remain private.
    data:
      nodes:
        - id: customer-workflow
          label: Customer workflow
          detail: Self-serve developer, embedded platform, or enterprise agent use case.
        - id: api-product
          label: API product
          detail: Search, Extract, Responses, Task, FindAll, Entity Search, or Monitor.
        - id: usage-tier
          label: Usage and processor tier
          detail: Requests, URLs, runs, matches, or checks; depth changes price and likely delivery cost.
        - id: metered-charge
          label: Metered or contracted charge
          detail: Public list pricing or bespoke higher-volume agreement.
        - id: realized-revenue
          label: Realized revenue
          detail: 'Private: mix, discounts, commitments, refunds, and accounting recognition are undisclosed.'
        - id: gross-profit-cash
          label: Gross profit and cash
          detail: 'Private: direct infrastructure, content, support, working-capital, and collection effects are undisclosed.'
      edges:
        - from: customer-workflow
          to: api-product
        - from: api-product
          to: usage-tier
        - from: usage-tier
          to: metered-charge
        - from: metered-charge
          to: realized-revenue
        - from: realized-revenue
          to: gross-profit-cash
    approximationNotes: Conceptual bridge only; it does not estimate conversion rates, revenue, margin, or cash.
