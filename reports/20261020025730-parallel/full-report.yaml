  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "AI search." Direct API peers include Exa, Tavily, Linkup,
              and Firecrawl, while Perplexity and model-platform web tools from OpenAI, Anthropic, and Google can bundle
              retrieval into an existing inference relationship. Buyers can also assemble search, crawling, parsing,
              caching, and prompts internally, use RPA for narrow workflows, purchase structured datasets, or keep human
              research teams. These routes solve different portions of the job: Firecrawl emphasizes crawl, scrape, and
              browser interaction; Exa emphasizes semantic discovery; Tavily emphasizes accessible search workflows;
              Linkup emphasizes trusted-source fact retrieval; and Parallel spans retrieval, extraction, research,
              enrichment, and monitoring. Public profiles do not provide a comparable funding, revenue, customer, or
              workload series for all peers, so scale cells are deliberately marked as company-claimed or unknown rather
              than normalized.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
              - CP011
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
