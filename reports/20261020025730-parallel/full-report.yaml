      - number: '3.3'
        title: Performance claims and competitive positioning
        blocks:
          - type: paragraph
            body: >-
              Parallel's strongest differentiation evidence is benchmark-led, but the provenance limits the underwriting
              conclusion. A 2025 company post reported 58% BrowseComp accuracy against a 25% human baseline and 41% for
              GPT-5. The current homepage reports a September 2026 company-run evaluation in which Parallel Advanced
              reached 74% on a 50-question BrowseComp sample at $399 per thousand questions, versus 70% for Exa at $971
              and 66% for Tavily at $935 using the same frontier-agent tier. In the other direction, Firecrawl reports
              an AIMultiple test of 100 queries where Parallel Search Pro took 13.6 seconds and Firecrawl 1.335 seconds.
              These results measure different products, harnesses, samples, and objectives; they cannot be merged into a
              single performance ranking. The positioning map therefore uses evidence-backed ordinal judgments about
              workflow breadth and research depth, not a claimed market-share or objective quality score.
            claimRefs:
              - CP007
              - CP010
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP016
      - number: '3.4'
        title: Durability and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Parallel's most plausible moat is the combination of its proprietary index, multi-product workflow
              coverage, distribution integrations, and operational trust features. None is conclusively durable on the
              public record. Model providers can bundle web retrieval with inference, reducing willingness to pay for a
              standalone layer; publishers can shift value from crawling quality toward licensed access; and rivals can
              compete on open source, browser automation, semantic discovery, or simpler packaging. The allocated
              evidence does not disclose retention, expansion, migration cost, contract duration, exclusive content
              rights, or a neutral head-to-head benchmark. One third-party page in the pool explicitly warns that its
              content is AI-generated and may be inaccurate, illustrating why low-signal comparison pages cannot close
              those gaps. The investable conclusion is differentiation with unproven lock-in: validate repeatable
              customer outcomes and switching behavior before assigning a durable platform premium.
            claimRefs:
              - CP002
              - CP004
              - CP009
              - CP012
              - CP013
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Benchmark evidence is not neutral
            body: >-
              Parallel and Firecrawl each publish comparisons favorable to their own products. Treat the results as
              testable hypotheses until a buyer-run workload benchmark controls for query set, latency, accuracy, source
              quality, and total cost.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP016
          - type: callout
            title: Underwrite outcomes and switching behavior
            body: >-
              Require cohort retention, expansion by API, migration evidence, and a neutral bake-off before assigning a
              moat premium to index scale or product breadth.
            calloutType: recommendation
            claimRefs:
              - CP002
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is visible; revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Parallel monetizes a broad API surface rather than a single subscription. Its official site describes
              per-request pricing, a recurring free allowance, and bespoke arrangements for higher rate limits, while
              the product catalog spans search, extraction, synthesized responses, deep-research tasks, entity
              discovery, and monitoring. That design can support land-and-expand economics: a developer can begin with
              low-cost retrieval and consume higher-value research or monitoring as a workflow matures. It also creates
              mix risk because compute, crawl, and content-access intensity vary sharply by product and processor tier.
              Public list prices establish the billing mechanism, not realized revenue, discounts, minimum commitments,
              renewal behavior, or gross-profit contribution.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
