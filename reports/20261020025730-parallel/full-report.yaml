      - number: '5.2'
        title: Operating architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture has three principal layers: a proprietary web index, raw Search and Extract
              tools, and specialized Web Agents that plan, retrieve, read, and synthesize. Parallel says the index spans
              billions of pages and is updated by millions of additions or refreshes each day; it also says agent
              outputs can carry citations, reasoning traces, and calibrated confidence through its Basis framework.
              SiliconANGLE separately reports that the APIs use an index optimized for machine retrieval. These sources
              support the architectural outline, not the undisclosed crawler design, ranking models, coverage by
              geography or language, licensed-content share, or confidence-calibration methodology.
            claimRefs:
              - CE005
              - CE006
              - CE007
