              - CM013
              - CM014
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Two third-party syntheses converge on three core buyer groups: AI-native product teams, enterprise AI or
              data-engineering organizations, and platforms that embed web tools for downstream developers; service
              providers are an additional channel. Developers and agent product teams are the daily users, while
              engineering or product leaders likely own self-serve budgets and enterprise AI, security, procurement, or
              functional leaders participate in larger purchases. Parallel claims more than 1,000 teams use the
              platform, while independent reporting names Harvey and Notion as production users; those signals establish
              adoption, not paying-customer count or contract value. Composio's Hermes integration and Parallel's free
              allowance lower experimentation friction, but no retained source quantifies conversion from free use to
              paid production workloads.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand grows if agents increasingly need facts newer than model training data and if MCP, SDK, gateway,
              and workflow integrations make external web tools easy to adopt. The usage model can expand with customer
              query volume, and per-request pricing gives teams an observable unit for testing ROI. The counterweight is
              structural: websites change, anti-bot systems and logins restrict coverage, browser-driven research can be
              slow and expensive, and regulated workflows require citations, auditability, security review, and reliable
              access rights. Internal builds and bundled model-provider browsing cap pricing power. One assigned
              third-party page is explicitly AI-generated and warns of inaccuracies, illustrating why low-quality
              ecosystem content cannot validate market size. Valuation should therefore hinge on paid production volume,
              retention, access economics, and gross margin rather than broad agent-market growth alone.
            claimRefs:
              - CM008
              - CM009
              - CM015
              - CM016
