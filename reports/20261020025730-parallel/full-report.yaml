  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence shows multiple acquisition and deployment surfaces, while renewal and account expansion remain
      unquantified.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: Developers encounter Parallel through its website, customer examples, and ecosystem integrations.
          touchpoints:
            - Official product site
            - Customer stories
            - Framework listings
        - id: evaluate
          label: Evaluate
          detail: Teams can test web search and research against representative production questions.
          touchpoints:
            - Free monthly allowance
            - Per-request pricing
            - Source and confidence outputs
        - id: integrate
          label: Integrate
          detail: Developers connect APIs directly or use cloud and framework distribution surfaces.
          touchpoints:
            - REST APIs
            - Google Cloud
            - Composio and agent frameworks
        - id: deploy
          label: Deploy
          detail: Named evidence includes live insurance, sales, real-estate, and public-sector research workflows.
          touchpoints:
            - Genpact
            - Nooks
            - Opendoor
            - Starbridge
        - id: expand
          label: Expand
          detail: Usage can spread across search, research, enrichment, and monitoring jobs.
          touchpoints:
            - Task
            - Search
            - FindAll
            - Monitor
        - id: renew
          label: Renew
          detail: Public sources do not quantify renewal, cohort retention, or expansion within existing accounts.
          touchpoints:
            - Management retention schedule required
            - Customer reference calls required
    approximationNotes: >-
      The ordered stages synthesize public adoption surfaces; they are not a measured conversion funnel and carry no
      inferred stage rates.
    claimRefs:
