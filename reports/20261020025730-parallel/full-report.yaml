chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Parallel Web Systems, commonly branded as Parallel, is a privately held Palo Alto software and
              data-infrastructure company founded in 2023. Its core proposition is not a human search destination but an
              API layer through which AI agents search, extract, research, discover, and monitor the live web. The
              product suite combines raw retrieval tools with longer-running research agents and a proprietary web
              index. The commercial model is usage based: the company says customers pay per request rather than per
              token, with web search starting at $1 per 1,000 requests. This architecture positions Parallel as an
              embedded developer dependency whose expansion potential depends on customer query volume, while also
              exposing buyers to vendor concentration and variable workload costs.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO013
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Independent reporting identifies former Twitter chief executive Parag Agrawal and Travers Nisbet as
              co-founders, with Agrawal serving as chief executive. Agrawal's prior experience leading a consumer-scale
              platform is directly relevant to Parallel's index and reliability thesis, but it also creates visible
              key-person dependence because the available evidence does not establish a broader current executive bench.
              EquityZen lists Clay Fisher and Mamoon Hamid as directors, yet the assigned evidence does not establish
              whether that list is complete, current, or accompanied by observer and protective rights. Governance
              diligence should therefore treat the public roster as partial rather than exhaustive.
