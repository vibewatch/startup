      - CU008
      - CU009
      - CU012
      - CU013
  - id: FR001
    title: Residual risk and mitigation-maturity heatmap
    type: matrix
    summary: >-
      Qualitative matrix separates structural likelihood, impact, mitigation maturity, and residual severity without
      implying measured probabilities.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Publisher / content access
          note: Company licensing claims plus independent publisher-dependency analysis
          values:
            - Medium
            - High
            - Early-to-scaling
            - High
        - label: Web-input reliability
          note: External web brittleness is structural; citations and review reduce consequence
          values:
            - High
            - High
            - Scaling
            - Medium-high
        - label: Security / privacy control failure
          note: Control claims exist, but independent scope and incident history are unavailable
          values:
            - Unknown
            - High
            - Company-documented
            - Medium-high
        - label: Model-provider bundling
