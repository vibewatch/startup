  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Strong paid conversion, durable retention, and expanding gross margin
        - Exit above $6B is required to exceed 3.0x gross MOIC from a $2B entry
        - Unassigned until audited cohorts and margins are available
        - Growth without margin expansion or viable publisher access
      - - Base
        - Adoption continues but economics remain undisclosed
        - No supportable fair-value range from the assigned public evidence
        - Current evidence supports research-more, not a calibrated probability
        - Failure to produce primary financial evidence before the next round
      - - Bear
        - Bundling pressure, weak conversion, or high web-access costs
        - Any exit below $2B produces a gross nominal loss before dilution and preferences
        - Material because current pricing and cost structure are not public
        - Down round, sustained negative gross margin, or customer concentration
    notes: >-
      These are decision scenarios, not company forecasts. The only numerical threshold is arithmetic from the reported
      $2 billion entry mark; no revenue multiple or scenario probability is estimated.
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV013
      - CV015
      - CV016
