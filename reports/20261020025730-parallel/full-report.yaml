  - id: FV001
    title: Recommendation logic from proof to price
    type: flow
    summary: >-
      Adoption and distribution signals are meaningful, but missing operating economics prevent the reported financing
      mark from becoming an investable fair-value estimate.
    data:
      nodes:
        - id: developer-signal
          label: 100,000+ developers reported
          detail: Third-party adoption signal; paid conversion is undisclosed.
        - id: team-signal
          label: 1,000+ teams claimed
          detail: Company-issued breadth signal; revenue concentration is undisclosed.
        - id: distribution-signal
          label: Partner integration available
          detail: Composio supports Parallel in Hermes; usage is not disclosed.
        - id: financing-signal
          label: $2B Series B valuation
          detail: Reported five months after the $740M Series A mark.
        - id: economics-gap
          label: Revenue and margin evidence missing
          detail: No public EV/revenue multiple supports a fair-value estimate.
        - id: recommendation
          label: Research more
          detail: Require primary financials and financing terms before underwriting price.
    approximationNotes: Ordered logic only; node order does not imply conversion rates, probabilities, or value-proportional magnitude.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV014
