company:
  name: "Parallel"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Parallel is a Palo Alto developer-infrastructure company founded in 2023 that sells
    usage-priced web search, extraction, research, discovery, and monitoring APIs for AI
    agents. Public evidence supports rapid product and financing milestones through 2026,
    but revenue, margins, headcount, cap-table terms, and a complete governance roster
    remain unavailable.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Parallel Web Systems, commonly branded as Parallel, is a privately held Palo Alto
      software and data-infrastructure company founded in 2023. Its core proposition is
      not a human search destination but an API layer through which AI agents search,
      extract, research, discover, and monitor the live web. The product suite combines
      raw retrieval tools with longer-running research agents and a proprietary web
      index. The commercial model is usage based: the company says customers pay per
      request rather than per token, with web search starting at $1 per 1,000 requests.
      This architecture positions Parallel as an embedded developer dependency whose
      expansion potential depends on customer query volume, while also exposing buyers
      to vendor concentration and variable workload costs.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Independent reporting identifies former Twitter chief executive Parag Agrawal and
      Travers Nisbet as co-founders, with Agrawal serving as chief executive. Agrawal's
      prior experience leading a consumer-scale platform is directly relevant to
      Parallel's index and reliability thesis, but it also creates visible key-person
      dependence because the available evidence does not establish a broader current
      executive bench. EquityZen lists Clay Fisher and Mamoon Hamid as directors, yet the
      assigned evidence does not establish whether that list is complete, current, or
      accompanied by observer and protective rights. Governance diligence should
      therefore treat the public roster as partial rather than exhaustive.
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capital-and-stakeholders"
    title: "Capital history and stakeholder structure"
    body: >-
      The available record describes three major financing steps: an approximately $30
      million seed round in January 2024, a $100 million Series A at an approximately
      $740 million valuation in November 2025, and a $100 million Series B at a $2
      billion valuation in April 2026. The Series B report puts cumulative capital raised
      at $230 million. Named investors span Khosla Ventures, First Round Capital, Index
      Ventures, Terrain, Kleiner Perkins, and Sequoia Capital, creating a strong
      institutional syndicate. However, funding raised is not cash available, and the
      evidence does not disclose liquidation preferences, dilution, secondary
      components, debt, ownership, or board-control rights. Those omissions prevent a
      reliable assessment of runway or economic alignment.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "scale-milestones-and-diligence-posture"
    title: "Scale, milestones, and diligence posture"
    body: >-
      Parallel says more than 1,000 teams use its platform and displays customers
      including Notion, Harvey, Pfizer, LangChain, Replit, and others. A Genpact-issued
      partnership release adds production evidence: Genpact reports that a Parallel-based
      insurance workflow was deployed with two top-ten U.S. property and casualty
      insurers and produced 55% touchless processing and a 50% cycle-time reduction.
      These are meaningful adoption signals, but they do not reveal paid-customer count,
      contract value, retention, revenue, or margins. Independent commentary also flags
      closed-cloud dependence, slow deep-research tiers, and a steep cost ladder. The
      resulting profile is one of fast technical and financing progress with substantial
      disclosure risk around commercial scale and economics.
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
