  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不止“AI 搜索”。直接 API 同行包括 Exa、Tavily、Linkup 和 Firecrawl；Perplexity，以及 OpenAI、Anthropic 和 Google 的模型平台
              Web 工具，也能把检索捆绑进现有推理关系。买方还可以自行组装搜索、爬取、解析、缓存和提示词；用 RPA 处理窄工作流；购买结构化数据集；或保留人工研究团队。这些路径解决的是不同部分：Firecrawl
              强调爬取、抓取和浏览器交互；Exa 强调语义发现；Tavily 强调易用的搜索工作流；Linkup 强调可信来源事实检索；Parallel
              则覆盖检索、提取、研究、数据增强和监控。公开资料没有为所有同行提供可比的融资、收入、客户或工作负载序列，因此规模单元格有意标注为公司声称或未知，而不是强行标准化。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
              - CP011
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
              - CP011
              - CP014
      - number: '3.2'
        title: 能力、定价与信任对比
        blocks:
          - type: paragraph
            body: >-
              Parallel 的竞争卖点是运行在自有索引上的统一产品家族：Search 和 Extract 提供基础能力，Responses 提供同步回答，Task 支持更深度研究，FindAll 构建数据集，Monitor
              跟踪变化。公司还宣传引用与置信度工具、SOC 2 Type II 认证和按请求计费。Firecrawl 的对比采用不同边界，认为其开源、可自托管技术栈补充了 Parallel
              不提供的爬取和浏览器交互。这是有用的买方证据，但 Firecrawl 本身是竞争对手，不能视为独立基准。Composio 的 Hermes 集成表明 Parallel
              可通过生态连接器进入智能体工作流，降低集成摩擦，但不能证明锁定效应持久。公开定价足以进行方向性的采购比较，但实际企业折扣、最低承诺、服务等级和超额用量条款仍未见于分配的证据。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP011
              - CP013
          - type: table
