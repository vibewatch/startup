  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构可见，但收入质量不可见
        blocks:
          - type: paragraph
            body: >-
              Parallel 通过广泛的 API 产品面变现，而不是依赖单一订阅。官网介绍了按请求计费、周期性免费额度，以及为更高
              速率限制提供的定制安排；产品目录覆盖搜索、提取、综合回答、深度研究任务、实体发现和监控。这种设计可以支持 先落地再扩张：开发者先以低成本使用检索，工作流成熟后再消费更高价值的研究或监控能力。但它也带来组合风险，
              因为不同产品和处理器层级的计算、爬取及内容访问强度差异很大。公开标价说明计费机制，不代表实际收入、折扣、 最低承诺、续约行为或毛利贡献。
