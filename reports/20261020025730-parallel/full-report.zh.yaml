      - number: '2.4'
        title: 增长动力、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              如果智能体越来越需要比模型训练数据更新的事实，且 MCP、SDK、网关和工作流集成让外部 Web 工具更易采用，需求就会增长。按用量计费的模式可随客户查询量扩张；按请求定价也为团队测试 ROI
              提供了可观测单位。反向约束是结构性的：网站会变化，反爬系统和登录限制覆盖范围，浏览器驱动的研究可能又慢又贵，受监管工作流还要求引用、可审计性、安全审查和稳定访问权。自建以及模型提供商捆绑的浏览能力会压制定价权。一份指定的第三方页面明确由
              AI 生成并警告可能存在错误，这说明低质量生态内容不能验证市场规模。因此，估值应依赖付费生产量、留存、访问经济性和毛利率，而不能只看智能体市场的广泛增长。
            claimRefs:
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把广义相邻市场资本化
            body: AI 智能体软件、网页抓取和企业搜索彼此重叠，且包含大量 Parallel 市场之外的支出。在独立核实买方数量和年度支出前，示例性 SAM 应保持为敏感性区间。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
