  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与内容权利风险
        blocks:
          - type: paragraph
            body: >-
              Parallel 称其索引通过内容合作覆盖获得许可的付费墙、优质和专有来源；Sacra 则把同一市场视为结构性依赖：出版商退出、
              限制性条款或更高补偿都可能减少覆盖或压缩利润率。因此，内容权利和访问连续性是首要法律与商业风险，尽管指定证据没有 证明存在具体诉讼或执法行动。Parallel 还声称具备 SOC 2 Type
              II、HIPAA、GDPR、零数据保留和 SSO 控制，但这些是公司 发布的陈述；公司另一页面重复展示 SOC 2 徽章，却没有提供审计报告。因此，在把这些控制视为独立验证前，投资尽调应
              审查许可条款、出版商集中度、DPA 与子处理器、SOC 2 报告及例外、HIPAA 范围，以及任何监管机构或索赔方往来文件。
            claimRefs:
              - CR001
