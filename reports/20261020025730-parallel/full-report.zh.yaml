      - number: '3.3'
        title: 性能主张与竞争定位
        blocks:
          - type: paragraph
            body: >-
              Parallel 最强的差异化证据来自基准测试，但来源限制了投资判断。公司在 2025 年的一篇文章称，BrowseComp 准确率为 58%，人类基线为 25%，GPT-5 为 41%。当前官网报告了 2026
              年 9 月公司自测：Parallel Advanced 在 50 道 BrowseComp 样本中达到 74%，每千道题成本 $399；相同 frontier-agent 层级下，Exa 为
              70%、$971，Tavily 为 66%、$935。另一方面，Firecrawl 引述 AIMultiple 对 100 个查询的测试称，Parallel Search Pro 用时 13.6
              秒，Firecrawl 用时 1.335 秒。这些结果测量的是不同产品、测试工具、样本和目标，不能合并成单一性能排名。因此，定位图采用有证据支持的工作流广度和研究深度序数判断，而不是声称的市场份额或客观质量分数。
            claimRefs:
              - CP007
              - CP010
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP016
      - number: '3.4'
        title: 持久性与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Parallel 最可能形成护城河的组合是自有索引、多产品工作流覆盖、分销集成和运营信任功能。但公开记录无法证明其中任何一项具有确定的持久性。模型提供商可以把 Web
              检索与推理捆绑，降低买方为独立层付费的意愿；出版商可以把价值从爬取质量转向授权访问；竞争对手则能在开源、浏览器自动化、语义发现或更简单的产品包装上竞争。分配的证据没有披露留存、扩张、迁移成本、合同期限、独家内容权或中立的正面对比基准。证据池中的一份第三方页面明确警告其内容由
              AI 生成且可能不准确，说明低信号比较页面无法填补这些缺口。可投资结论是差异化存在，但锁定效应尚未证明：在给予持久平台溢价前，应先验证可重复的客户结果和切换行为。
            claimRefs:
              - CP002
              - CP004
              - CP009
              - CP012
              - CP013
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 基准证据并不中立
            body: Parallel 和 Firecrawl 都发布了有利于自身产品的比较。应把这些结果视为可检验假设，直到买方主导的工作负载基准控制查询集、延迟、准确率、来源质量和总成本。
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP016
          - type: callout
            title: 评估结果与切换行为
            body: 在给索引规模或产品广度赋予护城河溢价前，要求提供 cohort 留存、按 API 的扩张、迁移证据和中立的 bake-off。
            calloutType: recommendation
            claimRefs:
              - CP002
