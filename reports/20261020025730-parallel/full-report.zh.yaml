              产品继承了困难的外部条件：网站变化、登录和 cookie 门槛、反爬控制、速率限制，以及不完整或过时的来源材料。Parallel 自身警告，Web
              证据可能过时、不准确或不完整，简单关键词匹配也会制造噪声。缓解措施包括引用、置信度评分、监控、确定性 风险政策，以及对不利事件的人工复核。这些控制可以降低，但不能消除模型、检索和来源质量风险。公司的基准披露有用，
              但仍是自报数据、样本有限，并依赖 LLM 评审；一名独立分析师还警告，优化排行榜未必能泛化。指定证据池没有公开事故史、 状态历史、渗透测试报告或恢复指标，因此生产韧性仍是重大尽调缺口，而不能据此判断 uptime
