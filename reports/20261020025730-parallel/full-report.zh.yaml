      - number: '4.4'
        title: 财务结论与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              收入模式在形式上很有吸引力：用量可衡量，入门价格低，企业工作流可以扩张，深层产品的标价高得多。投资判断的 难点在证据，而不在概念匹配。公开采用数量不是付费客户数量，第三方 ARR
              估算不是公司披露收入，已募集融资也不是 可用现金。处理器价格梯度还使客户账单和交付成本高度依赖工作负载。达到投资级别的尽调应要求按产品和层级拆分的
              月度收入、净留存和客户集中度、每次请求的实际价格、直接基础设施与内容成本、按处理器拆分的贡献毛利、按渠道拆分 的 CAC 与回收期，以及现金到 runway
              的桥接表。在提供这些记录前，收入质量虽合理但未验证，利润率路径不透明，资本 强度仍是重大风险。
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
              - CI010
              - CI013
              - CI014
              - CI016
