      points:
        - label: Parallel
          x: 4.5
          'y': 4.6
          note: 广泛的官方套件，加上公司执行的深度研究基准测试。
        - label: Firecrawl
          x: 5
          'y': 3.1
          note: 广泛的抓取、爬取、搜索和交互栈；研究深度根据竞争对手自述评分。
        - label: Exa
          x: 3
          'y': 3.5
          note: 聚焦语义发现、内容检索、研究和相似页面。
        - label: Tavily
          x: 3.8
          'y': 3.4
          note: 保留比较中的搜索、提取、爬取、映射和研究端点。
        - label: Linkup
          x: 2.4
          'y': 3.7
          note: 更窄的可信来源搜索定位，分为 Standard 和 Deep 层级。
        - label: 内部构建
          x: 4.2
          'y': 2.2
          note: 广度可能较大，但深度取决于买方工程和数据访问投入。
    approximationNotes: 坐标是分析师根据已披露产品范围和研究取向赋予的序数分数。它们是四舍五入后的判断，不是基准测试结果；竞争对手发布的描述和未知能力降低了信心。
    claimRefs:
      - CP005
      - CP007
      - CP010
      - CP016
  - id: FI001
    title: 从活动到现金经济性的收入模型桥接
    type: flow
    summary: 公开证据支持从活动到计费的步骤，但实际收入、毛利和现金转化仍是非公开信息。
    data:
      nodes:
        - id: customer-workflow
          label: 客户工作流
          detail: 自助式开发者、嵌入式平台或企业 agent 使用场景。
        - id: api-product
          label: API 产品
          detail: Search、Extract、Responses、Task、FindAll、Entity Search 或 Monitor。
        - id: usage-tier
          label: 使用量与处理器层级
          detail: 请求、URL、运行、匹配或检查；深度会改变价格和可能的交付成本。
        - id: metered-charge
          label: 按量计费或合同收费
          detail: 公开目录价或定制的高用量协议。
        - id: realized-revenue
          label: 实际收入
          detail: 非公开：收入组合、折扣、承诺、退款和会计确认均未披露。
        - id: gross-profit-cash
          label: 毛利与现金
          detail: 非公开：直接基础设施、内容、支持、营运资金和回款影响均未披露。
      edges:
        - from: customer-workflow
          to: api-product
        - from: api-product
          to: usage-tier
        - from: usage-tier
          to: metered-charge
        - from: metered-charge
          to: realized-revenue
        - from: realized-revenue
          to: gross-profit-cash
    approximationNotes: 仅为概念桥接；不估算转化率、收入、利润率或现金。
    claimRefs:
      - CI001
      - CI003
      - CI013
      - CI014
  - id: FE001
    title: 已披露的产品架构图
    type: stack
    summary: Parallel 的公开架构从应用集成延伸至 Web Agents 和工具，再连接到专有索引；来源溯源和企业控制覆盖整个输出链路。
    data:
      layers:
        - label: 应用集成
          detail: 产品和工作流开发者的入口。
          items:
            - REST API
            - Python SDK
            - TypeScript SDK
            - MCP
            - OpenAI 兼容端点
        - label: 工作流产品
          detail: 按延迟和任务深度选择的成品能力。
          items:
            - Responses
            - Task
            - FindAll
            - Monitor
        - label: Web Agents
          detail: 专用 agent 负责规划、搜索、阅读和综合。
          items:
            - 定制模型
            - 专用 harness
            - 结构化引用输出
        - label: Web Tools
          detail: 由用户或 Web Agents 直接使用的原始检索原语。
          items:
            - Search
            - Extract
        - label: Parallel Web Index
          detail: 公司描述的、为 agent 优化的专有索引。
          items:
            - 抓取与更新
            - 排名
            - 授权内容和开放网络内容
        - label: 信任与交付控制
          detail: 横跨全链路的输出和企业控制。
          items:
            - 依据引用
            - 置信度评分
            - 零数据保留选项
            - SSO/SAML
    approximationNotes: 仅为概念排序；审阅来源没有披露物理拓扑、数据流、吞吐量、冗余或控制边界。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 公开证据显示存在多种获客和部署入口，但续约和账户扩张仍未量化。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 开发者通过 Parallel 网站、客户案例和生态集成接触到 Parallel。
          touchpoints:
            - Official product site
            - Customer stories
            - Framework listings
        - id: evaluate
          label: 评估
          detail: 团队可以用代表性生产问题测试网络搜索和研究能力。
          touchpoints:
            - Free monthly allowance
            - Per-request pricing
            - Source and confidence outputs
        - id: integrate
          label: 集成
          detail: 开发者直接连接 API，或使用云平台和框架分发入口。
          touchpoints:
            - REST APIs
            - Google Cloud
            - Composio and agent frameworks
        - id: deploy
          label: 部署
          detail: 已有证据包括保险、销售、房地产和公共部门研究工作流的实际运行。
          touchpoints:
            - Genpact
            - Nooks
            - Opendoor
            - Starbridge
        - id: expand
          label: 扩张
          detail: 使用量可以扩展到搜索、研究、数据丰富和监测任务。
          touchpoints:
            - Task
            - Search
            - FindAll
            - Monitor
        - id: renew
          label: 续约
          detail: 公开来源没有量化现有账户内的续约、队列留存或扩张。
          touchpoints:
            - Management retention schedule required
            - Customer reference calls required
    approximationNotes: 有序阶段综合了公开采用入口；它不是实测转化漏斗，也不包含推断的阶段转化率。
    claimRefs:
      - CU004
      - CU008
      - CU009
      - CU012
      - CU013
  - id: FR001
    title: 剩余风险与缓解成熟度热力图
    type: matrix
    summary: 定性矩阵将结构性可能性、影响、缓解成熟度和剩余严重性分开，不暗示实测概率。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重性
      rows:
        - label: 出版商 / 内容访问
          note: 公司授权声明，加上独立的出版商依赖分析
          values:
            - 中
            - 高
            - 从早期到扩展
            - 高
        - label: 网络输入可靠性
          note: 外部网络脆弱性具有结构性；引用和复核会降低后果
          values:
            - 高
            - 高
            - 扩展中
            - 中高
        - label: 安全 / 隐私控制失效
          note: 存在控制声明，但独立范围和事故历史不可得
          values:
            - Unknown
            - 高
            - 公司记录
            - 中高
        - label: 模型提供商捆绑
          note: 独立分析指出，接近零价格的捆绑构成挤压风险
          values:
            - 中
            - 高
            - 差异化驱动
            - 中高
        - label: 单位经济性承压
          note: 可见内容成本是可变的；收入、利润率、现金消耗和现金跑道均未披露
          values:
            - Unknown
            - 高
            - 未公开量化
            - 高
        - label: 客户集中度
          note: 团队总数由公司自述，未披露收入分布
          values:
            - Unknown
            - 高
            - 未公开量化
            - Unknown
    approximationNotes: 所有单元格均为基于保留证据和明确缺口的定性分析师分类；它们不是概率、实测损失率，也不是经独立验证的控制评分。
    claimRefs:
      - CR002
      - CR003
      - CR006
      - CR009
      - CR011
      - CR012
      - CR016
  - id: FV001
    title: 推荐逻辑：从证据到定价
    type: flow
    summary: 采用和分发信号有意义，但运营经济数据缺失，无法将披露的融资估值转化为可据以投资的公允价值估计。
    data:
      nodes:
        - id: developer-signal
          label: 据报道有 100,000+ 名开发者
          detail: 第三方采用信号；付费转化率未披露。
        - id: team-signal
          label: 公司声称有 1,000+ 个团队
          detail: 公司发布的覆盖面信号；收入集中度未披露。
        - id: distribution-signal
          label: 可用的合作伙伴集成
          detail: Composio 在 Hermes 中支持 Parallel；使用情况未披露。
        - id: financing-signal
          label: $2B B 轮估值
          detail: 据报道，这一估值出现在 $740M A 轮估值公布五个月后。
        - id: economics-gap
          label: 缺少收入和利润率证据
          detail: 没有公开的 EV/收入倍数可支持公允价值估计。
        - id: recommendation
          label: 继续研究
          detail: 在评估价格前，需要一手财务数据和融资条款。
    approximationNotes: 仅为有序逻辑；节点顺序不代表转化率、概率或与价值成比例的大小。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV014
