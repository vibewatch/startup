  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前建议是继续研究，信心中等、风险高，估值偏高。TechCrunch 报道称，Sequoia 于 2026 年 4 月领投 $100 million Series B，估值 $2
              billion。该估值此前五个月刚跟随一轮据报估值 $740 million 的 Series A，约上涨 2.7 倍。重新定价的速度本身不是估值过高的证据，但提高了对经营表现的举证要求。公开证据集没有披露
              Parallel 的收入、盈利能力或 EV/收入倍数。因此，不能用收入倍数法评估当前价格；在一手财务数据和融资条款证明价格与业绩之间存在可支持的关系前，建议不应上调。
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与证明负担
        blocks:
          - type: paragraph
            body: >-
              投资论点是 Parallel 可以成为智能体长期依赖的 Web 基础设施层：TechCrunch 报道开发者超过 100,000 名，而 Parallel 目前声称有超过 1,000
              个团队，并提供按量计费的搜索。与 Composio 的伙伴集成提供了另一项分销信号，但不能证明使用量或收入。 反论点是，采用广度可能无法转化为有吸引力的单位经济性。一名独立分析师将其模式描述为按用量计费的
              API，并指出毛利率是 核心未知数，因为爬取、推理和反爬处理可能成本高昂。用于工程、产品和客户增长的资金支持执行，但无法解决留存、付费转化、 毛利率或现金消耗问题。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
      - number: '8.3'
        title: 牛市、基准与熊市逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以建立按概率加权的公允价值区间，因此情景采用回报门槛而非预测。在 $2 billion 入场价格下，$6 billion 退出 是扣除稀释和优先权前达到 3.0x
              总倍数的最低数学门槛。乐观情景要求采用转化为规模化、持久且具备可防守毛利率的收入，退出价格高于该门槛。基准情景在财务披露允许使用适合模型的倍数前仍不定价。悲观情景是任何低于当前报告估值的结果，尤其是捆绑搜索
              压低价格或 Web 访问成本阻碍利润率扩张时。没有设置数值概率，因为校准概率所需的分母数据属于私有信息。
            claimRefs:
              - CV001
              - CV009
              - CV011
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV009
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              融资历史和投资人名单显示公司能够获得私募资本，但指定证据无法证明其已准备好进入公开市场、存在收购兴趣或有可比退出倍数。
              下一道决策门槛应要求按产品拆分的经审计或董事会批准收入、按工作负载拆分的毛利率、留存和付费转化 cohort、消耗与 runway， 以及客户集中度。投资人还应取得 Series A 和 B
              的资本化记录、清算优先权、老股出售细节、期权池变动，以及债务或项目融资义务。 论点失效触发器包括：运营改善不足以匹配的 down round、规模化工作负载持续负毛利、开发者使用广泛但付费转化弱，或失去经济上
              可行的出版商访问。在这些检查通过前，融资势头不能替代估值支撑。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的决策
            body: 不要只凭融资势头评估 $2 billion 估值。只有在一手收入、毛利率、留存、消耗、runway 和优先权证据支持适合模型的回报案例后， 才应推进。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV011
              - CV013
              - CV016
