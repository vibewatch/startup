            body: >-
              独立报道确认，前 Twitter CEO Parag Agrawal 与 Travers Nisbet 是联合创始人，Agrawal 担任 CEO。Agrawal 领导消费级平台的经历与 Parallel
              的索引和可靠性逻辑直接相关，但也带来明显的关键人物依赖，因为现有证据无法证明公司拥有更完整的现任高管班底。EquityZen 将 Clay Fisher 和 Mamoon Hamid
              列为董事，但指定证据无法确认该名单是否完整、是否最新，也无法确认是否附带观察员权利和保护性权利。因此，治理尽调应把公开名单视为部分名单，而非完整名单。
