  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Parallel 所处的相关市场比广义搜索、AI
              软件或企业自动化更窄。产品定位是面向机器的智能体基础设施，服务实时检索、页面提取、带引用综合、实体发现和持续监控。因此，计入的支出应是软件和数据预算中用于程序化开放 Web
              访问及研究工作流的部分。面向人的搜索广告、通用聊天、私有语料 RAG、内部可观测性和广义 RPA 都是相邻领域，不应直接计入市场规模。买方还可以自行组装搜索
              API、爬虫、解析器、浏览器自动化、缓存和模型提示词；使用模型平台的浏览能力；购买窄领域数据产品；或保留人工研究团队。明确边界很重要，因为把所有相邻品类都算进去，会重复计算重叠工作流，显著夸大可服务机会。
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定证据不包含权威、独立来源的面向智能体 Web 基础设施市场研究。一份二手分析改以 2025 年相邻市场估算进行三角验证：AI 智能体软件 $7.6 billion–$7.8 billion、网页抓取服务约
              $1 billion–$9 billion、企业搜索 $5.3 billion–$6.7 billion，同时警告这些品类只有一部分对应目标市场。其示例性自下而上 SAM 为 $300 million–$1.5
              billion，假设 5,000 个原生 AI 团队每年支出 $25,000–$100,000，另有 2,000 家企业每年支出 $100,000–$500,000。五年 5%–15%
              的渗透情景是敏感性分析，不是预测。在独立核实买方数量、工作负载量、留存和毛利率证据前，这些区间只能用于界定尽调范围，不能用于估值计算。
            claimRefs:
