              - CR003
              - CR006
              - CR009
              - CR011
              - CR012
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决策门槛
            body: 在管理层提供出版商和客户集中度、权利与续约条款、经审计的安全证据、事故历史，以及按处理器拆分的毛利率、消耗和 runway 前，不要评估风险调整后的经济性。
