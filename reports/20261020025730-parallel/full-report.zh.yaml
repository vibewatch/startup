      - number: '7.4'
        title: 监控、缓解措施与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              风险状况应作为验证计划管理，而不是声称不存在不利事件。投资前，管理层应提供最大出版商和客户敞口、标准及例外内容
              权利、经过审计的安全控制证据、事故与宕机历史、按处理器拆分的毛利率、消耗、runway，以及在客户工作负载上的基准复现。
              论点失效触发器包括：关键内容访问丢失且没有替代方案、无法证明高价值来源的权利、重大泄露或长期宕机且没有可信补救、 单位成本上涨快于合同收入，或平台捆绑抹平 Parallel
              经质量调整后的价格优势。在融资前拒绝披露集中度、控制报告或单位 经济性，应暂停决策。在审阅这些私有记录前，剩余排名仍是暂定的。
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
