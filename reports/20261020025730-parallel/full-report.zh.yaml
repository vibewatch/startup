              现有记录描述了三次主要融资：2024 年 1 月约 $30 million 的种子轮、2025 年 11 月估值约 $740 million 的 $100 million Series A，以及 2026 年 4
              月估值 $2 billion 的 $100 million Series B。Series B 报道称累计融资额为 $230 million。已披露投资者包括 Khosla Ventures、First
