chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Parallel Web Systems 通常以 Parallel 品牌运营，是一家位于 Palo Alto、成立于 2023 年的私营软件与数据基础设施公司。它不是面向人的搜索目的地，而是让 AI
              智能体搜索、提取、研究、发现并监控实时 Web 的 API 层。产品组合把原始检索工具、长时运行的研究智能体和自有 Web 索引结合起来。商业模式按用量计费：公司称客户按请求付费，而不是按 token
              付费；Web 搜索起价为每 1,000 次请求 $1。这种架构让 Parallel 成为嵌入式开发者依赖，扩张潜力取决于客户查询量，同时也让买方面临供应商集中度和可变工作负载成本。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
