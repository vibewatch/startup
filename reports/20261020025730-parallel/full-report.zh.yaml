        blocks:
          - type: paragraph
            body: >-
              Parallel 宣布以 $2 billion 估值完成 $100 million Series B，累计融资额为 $230 million。管理层称新资金将用于扩展 Web
              索引、企业覆盖和出版商市场机制。这些用途在战略上连贯，但也表明基础设施、分销和内容经济仍需持续投入。
              累计融资额不等于当前现金；审阅的证据没有量化手头现金、月度消耗、runway、债务、营运资金需求或合同内容义务。 毛利率同样关键：即便价格下降，爬取、索引、推理、反爬处理和授权内容也可能随用量增长。没有
