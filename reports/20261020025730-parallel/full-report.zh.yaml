      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              两份第三方综合分析都指向三类核心买方：原生 AI 产品团队、企业 AI 或数据工程组织，以及为下游开发者嵌入 Web
              工具的平台；服务商是额外渠道。开发者和智能体产品团队是日常用户，工程或产品负责人可能掌管自助预算，而企业 AI、安全、采购或业务职能负责人参与较大采购。Parallel 声称有超过 1,000
              个团队使用平台，独立报道则点名 Harvey 和 Notion 为生产用户；这些信号证明采用，而非付费客户数量或合同金额。Composio 的 Hermes 集成和 Parallel
              的免费额度降低了试用门槛，但保留的来源没有量化从免费使用转为付费生产工作负载的转化率。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
          - type: table
