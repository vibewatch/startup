          values: ["Medium", "High", "Early-to-scaling", "High"]
        - label: "Web-input reliability"
          note: "External web brittleness is structural; citations and review reduce consequence"
          values: ["High", "High", "Scaling", "Medium-high"]
        - label: "Security / privacy control failure"
          note: "Control claims exist, but independent scope and incident history are unavailable"
          values: ["Unknown", "High", "Company-documented", "Medium-high"]
        - label: "Model-provider bundling"
          note: "Independent analysis identifies near-zero-price bundling as a squeeze risk"
          values: ["Medium", "High", "Differentiation-led", "Medium-high"]
        - label: "Unit-economics compression"
          note: "Variable content costs are visible; revenue, margin, burn, and runway are not"
          values: ["Unknown", "High", "Not publicly quantified", "High"]
        - label: "Customer concentration"
          note: "Broad team count is company-claimed and does not disclose revenue distribution"
          values: ["Unknown", "High", "Not publicly quantified", "Unknown"]
    approximationNotes: >-
      All cells are qualitative analyst classifications grounded in retained
