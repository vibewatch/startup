evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current ARR or revenue, product mix, gross margin, burn, cash balance, runway, net retention, and customer
      concentration.
    whyItMatters: >-
      Funding raised and private valuation cannot establish operating scale, capital efficiency, or financing
      durability.
    diligencePath: >-
      Obtain management accounts, audited financial statements, bank statements, revenue cohorts, customer concentration
      schedules, and the current operating plan.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A complete current executive, director, board-observer, committee, ownership, and investor-rights roster.
    whyItMatters: >-
      The public names do not establish control allocation, succession depth, protective provisions, or key-person
      resilience.
    diligencePath: >-
      Review the charter, bylaws, voting agreements, investor-rights agreements, board consents, capitalization table,
      option ledger, and current organization chart.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Comprehensive legal, regulatory, security-incident, outage, layoff, and leadership- change records for the company
      and its operating subsidiaries.
    whyItMatters: >-
      The assigned pool supports operating constraints but is not comprehensive enough to conclude that no material
      adverse event occurred.
    diligencePath: >-
      Run counsel-led litigation and regulatory searches, review security and uptime histories, request incident logs,
      and verify leadership changes with the company.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market study with a defined category, geography, period, methodology, source buyer counts, and
      non-overlapping TAM and SAM.
    whyItMatters: >-
      The retained sizing ranges come from one secondary synthesis and cannot support a valuation-grade market share or
      revenue forecast.
    diligencePath: >-
      Commission a bottom-up study using verified agent-builder and enterprise buyer counts, production query volumes,
      annual contract values, and workload-specific infrastructure allocation.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: attainable-market-share
    missingEvidence: >-
      Paid-customer count, segment conversion, retained production workloads, average annual spend, gross margin by
      product, and competitive win-loss data.
    whyItMatters: >-
      Without commercial and unit-economic evidence, the 5% to 15% capture scenario cannot be distinguished from an
      aspirational sensitivity case.
    diligencePath: >-
      Review cohort-level billing exports, customer contracts, workload retention, gross-margin bridges, and
      independently referenced win-loss records by buyer segment.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Independent procurement records or customer interviews identifying budget owners, security review duration,
      switching thresholds, and approved annual spend by segment.
    whyItMatters: >-
      Buyer personas and payer roles are currently hypotheses, limiting confidence in sales cycle, expansion, and
      serviceable-market assumptions.
    diligencePath: >-
      Interview at least three production customers per segment and inspect redacted purchase orders, approval
      workflows, renewal decisions, and deployment-volume histories.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Cohort retention, expansion by API, multi-homing rates, migration effort, contract duration, and churn reasons.
    whyItMatters: Product breadth and integrations do not demonstrate economic lock-in or durable distribution power.
    diligencePath: >-
      Request customer-level retention cohorts, API attach rates, contract terms, churn interviews, and two migration
      case studies.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: peer-scale
    missingEvidence: Comparable current revenue, funding, customer, workload, and gross-margin measures for Parallel and direct peers.
    whyItMatters: Issuer claims cannot establish relative scale or whether benchmark leadership converts into commercial leadership.
    diligencePath: >-
      Obtain management KPI definitions and normalize them against filings, financing documents, and direct competitor
      disclosures.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A neutral benchmark using identical workloads, products, models, latency definitions, source-quality scoring, and
      total cost.
    whyItMatters: Company- and competitor-issued tests point in different directions and cannot support a durable quality ranking.
    diligencePath: >-
      Run a buyer-controlled bake-off on representative production queries and retain raw outputs, timestamps,
      citations, and invoices.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue disclosure gaps
    missingEvidence: Monthly recognized revenue and ARR by product, processor tier, contract type, geography, and customer cohort.
    whyItMatters: >-
      The public record cannot distinguish recurring contracted revenue from volatile usage, discounts, free usage, or a
      low-confidence ARR estimate.
    diligencePath: >-
      Obtain the revenue ledger, billing exports, signed-contract sample, deferred-revenue schedule, and ARR bridge
      through 2026-09-30.
    relatedQuestionRefs:
      - QI002
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Direct infrastructure, model, crawling, anti-bot, content-licensing, support, and payment costs allocated by
      product and processor.
    whyItMatters: >-
      Usage growth may not translate into gross profit if deeper workflows and content access scale direct costs faster
      than realized prices.
    diligencePath: >-
      Review monthly contribution-margin cohorts, vendor invoices, internal cost attribution, and processor-level unit
      cost for the latest twelve months.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current cash, monthly burn, working-capital profile, debt and lease obligations, hiring plan, capex, and
      base/downside runway.
    whyItMatters: Cumulative funding and announced proceeds cannot identify the next financing trigger or dilution risk.
    diligencePath: >-
      Reconcile the latest balance sheet to bank statements and build a monthly cash bridge through at least 2028 under
      base and downside usage assumptions.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales efficiency
    missingEvidence: >-
      Paying-customer count, paid conversion, customer concentration, net retention, churn, CAC, sales cycle, discounts,
      and channel fees.
    whyItMatters: >-
      Developer and team counts cannot establish efficient conversion, durable expansion, or concentration-adjusted
      revenue quality.
    diligencePath: >-
      Request customer and developer cohorts by signup month, contract channel, spend band, retention status, and fully
      loaded acquisition cost.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-reliability
    missingEvidence: >-
      Public uptime target, historical availability, incident log, recovery objectives, and module-level latency
      distributions.
    whyItMatters: >-
      Parallel is an embedded dependency, so customer workflows inherit outages, latency tails, and recovery
      limitations.
    diligencePath: >-
      Request the enterprise SLA, status history, incident register, architecture review, and twelve months of
      module-level SLO attainment.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: security-compliance
    missingEvidence: >-
      SOC 2 report scope and exceptions, penetration-test summary, subprocessors, retention defaults, data residency,
      and breach-notification terms.
    whyItMatters: >-
      Public badges do not establish whether controls cover the index, agent execution, logs, integrations, and all
      customer data paths.
    diligencePath: >-
      Review the current SOC 2 report and bridge letter, data-flow diagram, DPA, subprocessor list, penetration test,
      and security questionnaire.
    relatedQuestionRefs:
      - QE006
      - QE009
  - type: missing-source
    severity: material
    topic: publisher-access
    missingEvidence: >-
      Independent evidence of licensed-source coverage, publisher economics, exclusion controls, robots-policy
      enforcement, and geographic breadth.
    whyItMatters: Index quality and legal durability depend on continued, appropriately licensed access to high-value web content.
    diligencePath: >-
      Request the licensed-content inventory by category, sample publisher agreements, exclusion procedures, and
      third-party legal review.
    relatedQuestionRefs:
      - QE010
  - type: missing-source
    severity: material
    topic: benchmark-validation
    missingEvidence: >-
      Independent replication of accuracy, cost, latency, confidence calibration, and citation correctness on
      representative customer workloads.
    whyItMatters: >-
      Company-run benchmarks do not establish generalization, operational reliability, or performance under
      customer-specific constraints.
    diligencePath: >-
      Run a blinded bake-off on customer queries with fixed budgets, human adjudication, tail-latency measurement, and
      citation verification.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract durations, cohort retention, and usage expansion by customer
      segment.
    whyItMatters: Production references do not establish recurring durability or whether usage grows after initial deployment.
    diligencePath: >-
      Request anonymized monthly cohorts, renewal schedules, usage expansion by product, and direct references from
      renewed customers.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue and usage concentration by top customer, segment, channel, and cloud or framework partner.
    whyItMatters: A small number of large deployments or a dominant channel could create material renewal and bargaining exposure.
    diligencePath: >-
      Review top-10 customer revenue and gross-profit concentration, partner-attributed bookings, and procurement
      dependencies.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: Independent validation, sample sizes, measurement windows, and error-rate baselines for named customer outcomes.
    whyItMatters: >-
      Customer-issued percentages and case-study results cannot be generalized across workloads without measurement
      context.
    diligencePath: Obtain customer reference calls, before-and-after operating data, and methodology for each highlighted outcome.
    relatedQuestionRefs:
      - QU006
      - QU007
    relatedTableRefs:
      - TU002
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: A complete current roster of paying customers with deployment status, use case, contract value, and geography.
    whyItMatters: >-
      The public sample cannot establish segment mix, logo quality, paid status, or the representativeness of named
      deployments.
    diligencePath: >-
      Request a customer export reconciled to billing records and classify production, pilot, free, inactive, and
      partner-only relationships.
    relatedQuestionRefs:
      - QU001
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: legal-regulatory
    missingEvidence: >-
      Complete licenses, litigation and claims schedule, regulatory correspondence, DPA and subprocessors, SOC 2 report
      and exceptions, HIPAA scope, and content-rights terms.
    whyItMatters: >-
      These records determine whether high-value content can be used legally and whether company-stated enterprise
      controls cover production processing.
    diligencePath: >-
      Obtain the legal and compliance data room, interview privacy and security owners, and sample the largest publisher
      contracts and enterprise DPAs.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: >-
      Status history, security-incident register, penetration-test results, uptime, recovery-time objective,
      recovery-point objective, and root-cause reports.
    whyItMatters: >-
      Public product and control claims do not establish production availability, breach frequency, containment quality,
      or recovery capability.
    diligencePath: >-
      Review 24 months of incident and availability records, test disaster recovery evidence, and interview security and
      site-reliability leadership.
    relatedQuestionRefs:
      - QR004
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Revenue by product and customer, processor-level gross margin, inference and publisher costs, burn, runway,
      contracted pricing, and renewal cohorts.
    whyItMatters: >-
      Usage growth can destroy rather than create value if variable content and compute costs scale faster than net
      revenue.
    diligencePath: >-
      Reconcile billing, cloud and model invoices, publisher payouts, and support costs to cohort revenue and contracted
      price escalators.
    relatedQuestionRefs:
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-10 customer revenue and usage share, NRR and GRR, largest publisher contribution, distribution-channel mix,
      and termination or renewal rights.
    whyItMatters: >-
      A broad company-claimed team count does not reveal whether revenue, usage, content supply, or customer acquisition
      depends on a few counterparties.
    diligencePath: >-
      Obtain anonymized concentration schedules, contracts, renewal history, and sensitivity analyses for loss of the
      largest customer, publisher, and channel.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Board-approved or audited revenue by product, gross margin by workload, retention, paid conversion, burn, runway,
      and customer concentration.
    whyItMatters: >-
      These denominators are required to choose a model-appropriate valuation method, calibrate scenario probabilities,
      and test whether usage creates durable value.
    diligencePath: >-
      Review monthly financial statements, cohort exports, cloud and crawling cost schedules, customer-level revenue,
      and the latest board plan in a management session.
    relatedQuestionRefs:
      - QV003
      - QV005
      - QV007
      - QV009
      - QV010
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Series A and B term sheets, capitalization tables, liquidation preferences, secondary components, option-pool
      changes, and debt obligations.
    whyItMatters: >-
      Headline valuation and capital raised do not reveal effective entry price, seniority, dilution, or the downside
      allocation among security classes.
    diligencePath: >-
      Obtain executed financing documents and a fully diluted capitalization table, then model proceeds by security
      class across downside and exit outcomes.
    relatedQuestionRefs:
      - QV006
      - QV010
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      Audited public-company segment metrics, relevant private-round operating metrics, and acquisition multiples for
      businesses with comparable web-index and agent usage.
    whyItMatters: >-
      Named infrastructure companies without matched revenue, growth, margin, and business model data do not provide a
      defensible trading or transaction multiple.
    diligencePath: >-
      Build a banker-supported comparable set with matched business models and periods, and normalize revenue quality,
      growth, gross margin, and capital intensity.
    relatedQuestionRefs:
      - QV003
      - QV009
