  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: >-
        Board-approved or audited revenue by product, gross margin by workload, retention,
        paid conversion, burn, runway, and customer concentration.
      whyItMatters: >-
        These denominators are required to choose a model-appropriate valuation method,
        calibrate scenario probabilities, and test whether usage creates durable value.
      diligencePath: >-
        Review monthly financial statements, cohort exports, cloud and crawling cost
        schedules, customer-level revenue, and the latest board plan in a management session.
      relatedQuestionRefs: [QV003, QV005, QV007, QV009, QV010]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Series A and B term sheets, capitalization tables, liquidation preferences,
        secondary components, option-pool changes, and debt obligations.
      whyItMatters: >-
        Headline valuation and capital raised do not reveal effective entry price, seniority,
        dilution, or the downside allocation among security classes.
      diligencePath: >-
        Obtain executed financing documents and a fully diluted capitalization table, then
        model proceeds by security class across downside and exit outcomes.
      relatedQuestionRefs: [QV006, QV010]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: >-
        Audited public-company segment metrics, relevant private-round operating metrics,
        and acquisition multiples for businesses with comparable web-index and agent usage.
      whyItMatters: >-
        Named infrastructure companies without matched revenue, growth, margin, and business
        model data do not provide a defensible trading or transaction multiple.
      diligencePath: >-
        Build a banker-supported comparable set with matched business models and periods,
        and normalize revenue quality, growth, gross margin, and capital intensity.
      relatedQuestionRefs: [QV003, QV009]
