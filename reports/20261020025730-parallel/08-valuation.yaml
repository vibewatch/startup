        - id: economics-gap
          label: "Revenue and margin evidence missing"
          detail: "No public EV/revenue multiple supports a fair-value estimate."
        - id: recommendation
          label: "Research more"
          detail: "Require primary financials and financing terms before underwriting price."
    approximationNotes: >-
      Ordered logic only; node order does not imply conversion rates, probabilities, or
      value-proportional magnitude.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV014]
callouts:
  - calloutType: recommendation
    title: Price-sensitive decision
    body: >-
      Do not underwrite the $2 billion mark from financing momentum alone. Advance only
      after primary revenue, gross-margin, retention, burn, runway, and preference evidence
      supports a model-appropriate return case.
    claimRefs: [CV001, CV009, CV011, CV013, CV016]
