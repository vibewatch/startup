  topStrengths:
    - Broad product surface spanning retrieval, extraction, research, discovery, and monitoring.
    - Production workflow evidence extends beyond logos into insurance, sales, legal, and real-estate use cases.
    - Proprietary index, multiple integration routes, and strong institutional backing support continued execution.
  topRisks:
    - Revenue, gross margin, retention, burn, runway, and customer concentration are not publicly verified.
    - Publisher access, content licensing, crawling, inference, and anti-bot costs may constrain coverage and margins.
    - Bundled model-provider retrieval and limited switching-cost evidence weaken the case for durable pricing power.
    - Security, incident, uptime, and benchmark claims lack sufficient independent production verification.
  unresolvedGaps:
    - >-
      Obtain board-approved or audited revenue by product, gross margin by workload, retention, paid conversion,
      customer concentration, burn, and runway.
    - >-
      Review Series A and B capitalization records, liquidation preferences, secondary components, debt, ownership, and
      governance rights.
    - >-
      Verify publisher licenses, content-access concentration, renewal economics, and the durability of scaled content
      supply.
    - Review the SOC 2 report, penetration tests, subprocessors, incident and outage history, uptime, RTO, and RPO.
    - >-
      Build a matched comparable set and valuation model using verified operating metrics rather than financing marks
      alone.
