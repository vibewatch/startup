            body: >-
              核心用户工作流灵活，但仍有鲜明取向。Omni 文档列出多种进入分析的入口：独立 Omni Agent、Workbook Agent、点击式工作簿探索、可编辑 Omni SQL、直接 SQL
              标签页、上传，以及电子表格标签页。关键实现细节在于，AI 路径感知模型，而不是从原始 SQL 开始。Omni 称，代理会规划动作，通过共享模型生成语义查询，把语义查询翻译成 SQL，并允许用户在工作簿里检查
              SQL。这让产品的治理叙事强于许多 AI 外挂，但灵活性也有限。SQL 标签页完全绕过模型；电子表格标签页很适合连接实时数据的 Excel
              式工作流，但在治理上仍是二等公民，因为仅存在于电子表格里的逻辑无法回流到共享模型或其他查询。因此，当团队清楚哪些工作应进入共享语义定义、哪些应留在 ad hoc 工作簿或电子表格空间时，Omni 最强。
