      - number: '8.3'
        title: 情景数学与风险折扣
        blocks:
          - type: paragraph
            body: >-
              因为 Omni 不披露绝对 ARR，评估 $1.5B 最诚实的方式，是倒推收入倍数数学，而不是断言一个证据无法支持的公允价值。按 20x 收入倍数，当前价格只隐含约 $75M ARR 或收入。按 15x，隐含约
              $100M。按 12x，约 $125M。按 10x，约 $150M；按 8x 至 7x，则约 $188M 至 $214M。这些门槛有用，因为它们显示结论对一个投资人目前看不到的分母有多敏感。如果 Omni
              已经超过约 $100M 高留存 ARR，并拥有耐久的嵌入式变现和不错毛利率，$1.5B 可以放进一个高溢价分析叙事里。如果真实基数明显更小，估值就开始显得更满。

              折扣逻辑也双向作用。盈利评论、约 200 人团队，以及 Omni 帮客户打造可变现分析产品的证据，都支持其获得高于商品化 BI
              工具的倍数。但定价不透明、留存和集中度公开披露弱、捆绑式语义层越来越多，都支持从任何完美 AI 平台倍数上砍掉几个倍数档位。评价还带来另一点温和折扣：G2 和 AWS Marketplace
              反馈总体正面，但仍指出学习曲线成本、功能缺口、文档滞后，以及大型仪表盘上的性能疲软。换句话说，公开材料支持相对普通仪表盘软件的有意义溢价，但不支持一个假设零执行摩擦、零捆绑压力的英雄式溢价。
