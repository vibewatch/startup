        - 2026 年 7 月市值约 $88.20B，产品内置 Semantic Views
        - 既是估值参照，也是捆绑式语义层替代品
        - 公开市场规模和平台宽度远超 Omni
      - - MongoDB
        - 上市可比公司
        - 2026 年 7 月市值约 $27.01B，且可直接查阅 SEC 申报
        - 说明成熟数据平台应有的信息披露深度和市值区间
        - 产品形态和客户经济性不同
      - - Cloudflare
        - 上市可比公司
