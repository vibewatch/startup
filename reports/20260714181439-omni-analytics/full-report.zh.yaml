      - 可支撑倍数区间
      - 支撑 $1.5B 所需 ARR 或收入
      - 必须成立的条件
      - 什么会打破情景
    rows:
      - - 牛市
        - 15x-20x
        - $75M-$100M
        - Omni 已达溢价规模，留存强、嵌入式变现跑通、毛利率健康
        - 隐藏分母被证明更小，或捆绑替代品限制付费意愿
      - - 基准
        - 10x-12x
        - $125M-$150M
        - 增长真实，但投资人仍会把私营公司不透明和品类竞争纳入定价
        - 留存、集中度或价格兑现弱于叙事暗示
      - - 熊市
        - 7x-8x
        - $187.5M-$214.3M
        - 买方更把 Omni 视为竞争激烈的分析软件，且捆绑风险不小
        - 披露 ARR 仍太低，无法用较低倍数支撑当前价格
    notes: 情景框架用固定 $1.5B 估值反推收入门槛，而不是假装公开证据足以支撑单一公允价值。
