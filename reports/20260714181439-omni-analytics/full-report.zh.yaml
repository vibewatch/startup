  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块
      - 主要用户
      - 当前作用
      - 差异化
      - 尽调缺口
    rows:
      - - 共享语义模型
        - 数据和分析团队
        - 指标、join 和业务逻辑的受控来源，可在 BI 和 AI 中复用
        - 一个模型复用于工作簿、API、MCP 和嵌入式界面
        - 公开文档未给出完整语义语言参考，也没有正式 OSI 导出路线图
      - - 工作簿和仪表盘
        - 分析师和业务用户
        - 主要自助分析和展示界面
        - 用户可在聊天、点选、SQL 和已保存工作簿流程之间切换
        - 可视化深度的公开文档不如 Tableau 或 Power BI 等品类领导者清楚
      - - 电子表格 / 计算
        - 财务和运营用户
        - 在工作簿内做 Excel 式实时数据分析
        - 连接式电子表格页避开 CSV 导出，同时让公式贴近受控数据
        - 仅在电子表格内的逻辑无法反向提升为共享语义定义；部分电子表格功能也有意缺席
      - - Omni AI agents（AI 智能体）
        - 业务用户和分析师
        - 自然语言分析、摘要和多步问答
        - 先走语义查询的 AI，相比直接提示原始表，更能保持定义一致
        - 延迟、评测质量和失败案例的公开基准有限
      - - 嵌入式分析
        - 产品和平台团队
        - 面向客户的仪表盘、工作簿和 AI 工作流
        - 白标、行级隔离、API 和 MCP 都在同一套栈里
        - 还需要更多公开细节来判断运营规模上限和推出模式
      - - API、MCP 和 Model IDE
        - 开发者和分析工程师
        - 程序化访问，加上代码式模型治理
        - REST 端点、MCP 认证模式、pull request 发布和 YAML API，都指向软件工程式运营
        - 插件废弃和仓库整合显示，开发者工具仍在演进
    notes: 来源组合包括 Omni 产品页、技术文档、Holistics 和 TrustRadius；差异化字段只概括公开证据。
