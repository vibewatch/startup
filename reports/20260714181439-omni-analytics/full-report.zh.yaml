  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险最高的地方，是结构性市场压力、披露稀薄与执行密集的 AI 和实施要求叠在一起。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 风险类型
        - 剩余敞口
      rows:
        - label: 套件挤压 / 商品化
          values:
            - 高
            - 高
            - 低-中
            - 结构性
            - 高
        - label: 估值与披露缺口
          values:
            - 中-高
            - 高
            - 低
            - 结构性
            - 高
        - label: AI 运行时准确性证明缺口
          values:
            - 中
            - 高
            - 中
            - 执行
            - 高
        - label: 实施与产品成熟度
          values:
            - 中-高
            - 中-高
            - 中
            - 执行
            - 中-高
        - label: 留存 / 集中度未知
          values:
            - 高
            - 高
            - 低
            - 结构性
            - 高
        - label: 安全、合规与平台依赖
          values:
            - 中
            - 高
            - 中
            - 混合
            - 中-高
    approximationNotes: 这些分档评级概括保留证据集，不是管理层指引或统计预测。
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR022
      - CR023
      - CR027
      - CR032
      - CR038
      - CR041
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 结构性压力和执行失误都会流向更慢扩张、更高支持负担和估值压缩。
    data:
      nodes:
        - id: bundle
          label: 套件挤压
          detail: 更大套件里的原生语义和 AI 功能扩张。
        - id: accuracy
          label: AI 准确性缺口
          detail: 公开运行时质量证明弱于架构主张。
        - id: config
          label: 配置复杂度
          detail: 权限、SQL 路径、电子表格和 MCP 设置都需要纪律。
        - id: disclosure
          label: 披露稀薄
          detail: 留存、集中度和单位经济分母仍保密。
        - id: quality
          label: 质量摩擦
          detail: 延迟、崩溃、文档和图表深度投诉拖慢信任形成。
        - id: expansion
          label: 扩张放慢
          detail: 信任或差异化变弱时，先落地再扩张的动作会削弱。
        - id: support
          label: 更高支持负担
          detail: 高接触落地和排障消耗毛利和管理层注意力。
        - id: valuation
          label: 估值压缩
          detail: 如果增长质量或差异化不及预期，溢价倍数会收窄。
      edges:
        - from: bundle
          to: expansion
          label: 收窄获胜面
        - from: accuracy
          to: expansion
          label: 削弱信任
        - from: config
          to: quality
          label: 制造
        - from: quality
          to: support
          label: 抬高
        - from: disclosure
          to: valuation
          label: 限制确信度
        - from: expansion
          to: valuation
          label: 传导
        - from: support
          to: valuation
          label: 挤压
        - from: config
          to: accuracy
          label: 可能恶化
        - from: quality
          to: expansion
          label: 拖慢
        - from: bundle
          to: valuation
          label: 压缩倍数
    approximationNotes: null
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR022
      - CR023
      - CR038
      - CR040
      - CR041
      - CR043
      - CR046
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Omni 位于数据仓库、转换、AI 客户端、嵌入式宿主和客户管理员配置的交叉点。
    data:
      nodes:
        - id: aws
          label: AWS / IdP
          detail: 基础设施、存储和身份边界。
        - id: snowflake
          label: Snowflake
          detail: 原生语义视图和 Cortex Analyst 路径。
        - id: databricks
          label: Databricks
          detail: Unity Catalog 指标视图和 Genie 路径。
        - id: dbt
          label: dbt
          detail: 元数据、模型和一个竞争性语义层。
        - id: ai
          label: 外部 AI 客户端
          detail: Claude、ChatGPT、Cursor、VS Code 以及其他 MCP 消费方。
        - id: admins
          label: 客户管理员
          detail: 权限、PAT、嵌入和部署纪律。
        - id: hosts
          label: 嵌入式宿主应用
          detail: 产品 UX、品牌和租户上下文。
        - id: omni
          label: Omni 核心平台
          detail: 语义模型、工作簿、API 和智能体层。
        - id: cust
          label: 企业客户
          detail: 买方决定 Omni 是核心控制平面，还是可选层。
      edges:
        - from: aws
          to: omni
        - from: snowflake
          to: omni
        - from: databricks
          to: omni
        - from: dbt
          to: omni
        - from: ai
          to: omni
        - from: admins
          to: omni
        - from: hosts
          to: omni
        - from: omni
          to: cust
        - from: snowflake
          to: cust
        - from: databricks
          to: cust
    approximationNotes: 该图突出最高杠杆的依赖节点，而不是来源集里的每一个集成或商业化关系。
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR036
      - CR038
      - CR039
      - CR041
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策路径从可信的私募市场标记出发，穿过分母不透明和套件风险，落到跟踪立场。
    data:
      nodes:
        - id: price
          label: $1.5B 价格锚
          detail: Series C 轮标记得到佐证
        - id: proof
          label: 真实动能
          detail: 4x ARR 说法、盈利、约 200 名员工
        - id: opacity
          label: 分母缺失
          detail: ARR、留存、毛利率、集中度和条款未披露
        - id: bundle
          label: 套件风险
          detail: Snowflake、Databricks、dbt 和 Microsoft 收窄稀缺性
        - id: outcome
          label: 跟踪
          detail: 尽调补齐缺口前，估值合理至偏高
      edges:
        - from: price
          to: proof
          label: 支撑进一步工作
        - from: proof
          to: opacity
          label: 被抵消
        - from: opacity
          to: bundle
          label: 放大
        - from: bundle
          to: outcome
          label: 导致
    claimRefs:
      - CV010
      - CV019
      - CV021
      - CV028
      - CV050
      - CV051
      - CV052
      - CV056
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 价格固定在 $1.5B 时，最终能撑住哪档收入倍数，会直接决定 ARR 门槛高低。
    data:
      items:
        - label: 20x 收入
          value: 75
        - label: 15x 收入
          value: 100
        - label: 12x 收入
          value: 125
        - label: 10x 收入
          value: 150
        - label: 8x 收入
          value: 187.5
        - label: 7x 收入
          value: 214.3
      yAxis:
        label: 支撑 $1.5B 所需 ARR 或收入（USD M）
    approximationNotes: 数值是用 $1.5B 除以各档倍数反推的门槛；它们只是情景工具，不是 Omni 披露的指标。
    claimRefs:
      - CV029
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 证据质量一弱，可支撑的倍数区间就会迅速收窄；这还没计入结构或集中度带来的任何下行影响。
    data:
      items:
        - label: 乐观支撑区间
          low: 15
          mid: 17
          high: 20
          detail: 只有 ARR 规模和留存已经像优质资产，才站得住
        - label: 基准支撑区间
          low: 10
          mid: 11
          high: 12
          detail: 假设增长真实，同时对不透明度和竞争压力给出明显折价
        - label: 悲观支撑区间
          low: 7
          mid: 8
          high: 9
          detail: 反映套件挤压
          weaker quality: null
          or a smaller hidden denominator: null
    approximationNotes: 图中展示的是可支撑的收入倍数区间，不是股权价值点估计；当前价格固定，但缺失的分母并不固定。
    claimRefs:
      - CV029
      - CV038
      - CV051
      - CV052
      - CV054
      - CV055
