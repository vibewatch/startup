      - number: '2.3'
        title: 买方、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Omni 的购买动作天然是多角色的，这对进入市场和市场规模测算都很重要。Microsoft 明确把 Power BI 卖给业务用户、报表创建者和开发者；Tableau 则通过差异化的
              Creator、Explorer 和 Viewer 层级面向分析师、高管、业务用户及其他角色。Databricks metric views 可以从
              notebooks、dashboards、alerts、Genie Spaces 和外部 BI 工具查询，把平台工程和分析用户放进同一条工作流。Omni
              的嵌入式分析页面进一步拓宽买方地图，把受治理指标连接到面向客户的产品体验、更快部署和高级定价机会。也就是说，在经典自助部署中，付款方可能是 BI
              或数据负责人；当语义层靠近仓库时，付款方可能是平台或数据工程负责人；当分析嵌进软件体验时，付款方可能是产品或应用负责人。采用通常从窄试点开始，而不是企业全量铺开。Basedash
              建议集中一小组核心指标并分阶段扩展；Promethium 则认为，把自助服务当成纯软件采购会制造混乱。实践中，Omni 的胜场在于买方希望一个受治理模型复用于内部 BI、产品分析和 AI
              工作流，而不是为每个场景维护独立工具和指标定义。
