  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群和部署原型
        blocks:
          - type: paragraph
            body: >-
              Omni 的公开客户集合并不集中在单一买方角色或单一部署风格上。最反复出现的模式，是数据、分析或产品负责人购买一层受治理分析层，同时服务内部团队和下游终端用户。ActiveProspect
              明确希望用一个平台同时支撑嵌入式分析和内部 BI；Brevo 整合了五个内部 BI 工具以及面向客户的报告；SWBC 则把 Omni
              评估为一个服务内部与客户报告的平台。产品和数据团队也会一起出现在购买动作中：BambooHR 把分析定位为产品层级决策，WorkRamp 优化的是数千名外部用户且不能停机，Checkr 和 Cribl 则把
              Omni 用作内部自助服务的受治理 AI 与分析基础。Logo 覆盖 HR 软件、营销自动化、安全、背景调查、酒店订餐、消费应用和电商；投资人和媒体来源还补充了
              Perplexity、Writer、BuzzFeed、Mercury、Pendo、Guitar Center 等更广泛名称。[CU002] [CU006] [CU010] [CU011] [CU015]
              [CU016] [CU020] [CU021] [CU023] [CU027] [CU028] [CU031] [CU032] [CU033] [CU034]


              因此，实际分群不是二元，而是三类。第一类是内部 BI 部署，围绕业务团队的自助服务、受治理指标和 AI 辅助分析展开，Caraway、Feeld、Cribl 和 Checkr
              都体现这一点。第二类是混合部署，同一语义层同时支持内部用户和面向客户的分析，ActiveProspect、Brevo、Ordermentum 和 SWBC
              最清楚。第三类是嵌入式优先或产品主导部署，分析成为客户自身产品体验的一部分，BambooHR 和 WorkRamp 展示了这一点。这种组合很重要，因为它意味着 Omni
              可以从内部分析问题切入，再扩展到产品分析；也可以从面向客户的用例落地，再拓宽到内部治理和 AI 工作流。[CU003] [CU004] [CU005] [CU012] [CU017] [CU018]
