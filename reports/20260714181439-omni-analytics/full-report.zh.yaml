      - 维度
      - 正向论点
      - 反向论点
      - 什么会改变判断
    rows:
      - - 增长
        - 4x ARR 增长口径和首次盈利，说明经营杠杆可能真实存在
        - 公开材料仍遮住 ARR 分母和毛利率质量
        - 经审计 ARR 桥接和毛利率披露
      - - 变现界面
        - 嵌入式分析和 AI 工作流能把合同价值抬到普通仪表盘席位之上
        - 公开证据仍未展示已实现扩张或续约数学
        - 模块级 ARR 和续约同期群
      - - 定价权
        - 报价主导的包装可以支撑高端企业合同
        - 价格不透明也可能掩盖折扣压力或不均衡的价格兑现
        - 合同原型和已实现 ACV 区间
      - - 品类位置
        - Omni 用面向 AI 的语义层来定义自己，时机正好，客户侧用例也有辨识度
        - Snowflake、Databricks、dbt 和 Microsoft 用捆绑替代品削弱稀缺性
        - 对原生和捆绑替代品的赢单 / 输单数据
      - - 资本效率
        - 约 200 名员工加上盈利口径，意味着效率好于单纯靠人数堆出来的故事
        - 单月盈利不等于可持续现金生成
        - 现金流历史、烧钱速度或资金跑道细节
    notes: 反向论点主要指向估值支撑和品类拥挤，而不是缺少真实产品需求。
