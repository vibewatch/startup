        - 服务需要可编辑查询控制的高级用户
        - 方言 SQL 加 Omni SQL 辅助函数
        - SQL 标签页会绕过模型；过度使用会削弱治理
      - - dbt 集成
        - 拉取元数据、切换环境，并查询 dbt 语义定义
        - dbt 仓库、omni_dbt 虚拟 schema 和分支模式
        - 累计 dbt 指标不受支持，环境设置也必须谨慎维护
