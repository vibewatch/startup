  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Omni 路径
      - 可衡量或结构性收益
      - 已知限制
    rows:
      - - 业务用户提问
        - 从聊天开始，再检查结果
        - Omni Agent 或 Workbook Agent 创建建模查询和工作簿输出
        - 让答案绑定受控定义和可见 SQL
        - 可信度仍取决于模型质量和权限设计
      - - 分析师做 ad hoc 分析
        - 使用带字段选择器或 SQL 的工作簿标签页
        - 在点选、Omni SQL 和直接 SQL 标签页之间切换
        - 在一个分析界面内减少工具切换
        - 直接 SQL 标签页会绕过共享模型
      - - 财务或运营用户想在实时数据上使用 Excel 式逻辑
        - 把工作簿查询连接到电子表格标签页
        - 在 Omni 内使用公式、导入和受保护查询表
        - 避开 CSV 导出，并保留到查询输出的实时链接
        - 没有数据透视表或表内图表；仅电子表格数据留在本地
      - - 产品团队交付客户分析
        - 创建带属性和行级过滤器的签名嵌入 URL
        - 使用 iframe 嵌入、品牌化和 API
        - 一层语义层可同时支撑内部和外部分析
        - 公开文档讲设置机制更多，硬性规模上限更少
      - - 外部 AI 客户端需要受控答案
        - 用 OAuth 或 API key 通过 MCP 连接
        - 用 MCP 工具执行查询，并运行长耗时 askOmni 作业
        - 团队可在 Claude、Cursor 或其他客户端复用语义治理
