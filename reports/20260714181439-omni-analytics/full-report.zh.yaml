  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 语义层和产品表面
        blocks:
          - type: paragraph
            body: >-
              Omni 的产品论点异常明确：语义层不是后台建模便利工具，而是 BI、嵌入式分析、API、MCP 和 AI
              的共享控制平面。官网反复把模型定位为专家定义指标和业务逻辑的地方，下游用户据此提问、迭代，并持续探索，而不必在每个界面重新编码定义。独立对比报道与这个框架方向一致。Holistics 描述了带
              schema、shared 和 workbook 层级的 YAML 模型；TrustRadius 强调共享模型一致性与 SQL 自由度的组合。实际结论是，Omni
              卖的是一个在多种界面之间复用的受治理模型，而不是把几个独立产品胶带粘在一起。相比 AI、嵌入式和语义治理分别住在不同子系统里的工具，这是一项有意义的架构差异。
