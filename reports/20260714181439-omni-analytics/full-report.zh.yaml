      - number: '2.4'
        title: 增长驱动和采用约束
        blocks:
          - type: paragraph
            body: >-
              Omni 所在品类的增长逻辑很强，因为底层 AI 和分析问题的成本在上升而不是下降。Deloitte 称，AI 正在带来效率收益，但真正重塑业务的组织只有 34%；Morgan Stanley 则把 AI
              描述为一次工业化建设，前方仍有近 $3 trillion 基础设施支出。Futurum 调查把这股宏观顺风细化为品类需求：用 GenAI
              替代传统分析时，准确性和幻觉风险是主要顾虑；语义层拿到增量预算，部分原因正是它能约束这些失效模式。Gartner 警告，到 2030 年，AI
              代理部署失败中可能有一半源自运行时治理和互操作性不足，这强化了同一点。Snowflake 的 Autopilot 发布、Databricks metric views、dbt 的 benchmark，以及
              Omni 自己的语义层论证，都说明受治理指标正在成为可信 AI 的控制平面。约束同样重要。Futurum 标出集成复杂度、缺乏事务性写回和技能短缺加剧；Basedash 和 Promethium
              都显示，信任受损、支持工单过载、治理薄弱和陈旧仪表盘会毁掉自助采用；而 Snowflake、Databricks、Microsoft 和 Tableau 更强的原生能力，可能降低 Omni
              拿下简单账户的必要性。所以，市场真实且在增长，但执行风险落在部署复杂度、组织准备度和既有厂商套餐压力上，而不是品类是否存在。
