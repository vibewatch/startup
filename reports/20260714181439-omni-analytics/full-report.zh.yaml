      - number: '2.2'
        title: 规模测算口径和有边界的 SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              公开规模测算只有在边界处理谨慎时才对 Omni 品类有用。已审阅材料中最窄的公开口径，是 Intel Market Research 对 AI 语义层的估算：2026 年 $0.95B，到 2034 年增长到
              $2.10B。Futurum 给出另一种同样重要的口径：不是干净的收入总量，而是一条增长轨迹，其中语义层增速从 2026 年的 16.0% 加速到 2031 年的
              30.0%，并跑赢传统商业智能增长。Futurum 调查还提供预算分配视角：44.5% 的企业计划增加语义层支出，另有 14.4% 计划新采用。既有平台定价随后说明，机会比纯语义软件数字更宽。Power BI
              把支出分散在免费、Pro、Premium、Fabric 和 Embedded 模型上；Tableau 则分散在 Creator、Explorer、Viewer、Cloud+ 和 Tableau+
              套餐里。这些定价结构证明，受治理分析和嵌入式交付已经有真实预算，但不能隔离出其中应计入 Omni 可服务市场的比例。因此，正确结论应有边界而非精确：Omni 的实际机会大于狭义语义层软件，小于全部既有 BI
              支出；任何 SAM 或 SOM 都应作为方向性承保区间，而不是已发布市场事实。
