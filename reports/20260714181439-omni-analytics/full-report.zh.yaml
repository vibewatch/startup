      - number: '8.4'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              本章结论应对估值敏感，而不是无视公司质量。Omni 看起来是一家严肃的晚期分析公司，有真实客户证据、可信的 AI 语义层架构，以及足以支撑继续关注的效率信号。多头情景很直接：如果隐藏的 ARR
              分母已经足够大，如果嵌入式和 AI 工作流能顺利变现，如果留存和集中度健康，那么 Series C 事后可能显得合理，甚至聪明。反向投资命题也同样直接：如果未披露 ARR
              基数仍不大，如果实际价格兑现弱于叙事，或者买方越来越愿意接受数据仓库原生语义，那么公司的定价可能隐含了超过证据所能支撑的确定性。

              因此，正确判断是跟踪，而不是买入。公开证据足以说明估值可信，但不足以说明它明显有吸引力。承销价格前的尽调负担是机械性的，而非哲学性的：绝对 ARR、NRR 或
              GRR、毛利率、客户集中度、现金消耗与可支撑月数、合同类型，以及 Series C 的精确经济条款。如果这些指标显示，这已经是一家高质量、可扩展、ARR 超过约 $100M
              且留存强劲的公司，判断可以上调。如果不是，倍数支撑会很快压缩。在此之前，对当前估值最公允的描述是公允偏高；不透明带来的下行，多于仅靠叙事带来的上行。
