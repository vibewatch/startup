      - number: '7.5'
        title: 缓释因素、监测指标与投资命题破裂触发点
        blocks:
          - type: paragraph
            body: >-
              好消息是，Omni
              的风险并非无边界，公开缓释因素也有分量。产品围绕受治理定义构建，而不是自由提示；权限颗粒度细；客户案例显示平台可以支撑真实分析产品；安全姿态也强于典型早期初创公司。公司看起来也清楚自己试图解决的 AI
              问题：自身信息和 Checkr 案例都强调，上下文、权限和测试循环比模型原始聪明程度更重要。这是正确的概念基础。


              承销挑战在于，最强缓释因素主要降低执行风险，而不是消除结构性风险。如果捆绑式在位厂商持续改进，如果公开耐久性数据仍然薄，或者 AI
              运行时质量无法被清晰衡量，仅靠架构救不了投资命题。因此，正确的尽调反应应由事件驱动：要求续约和集中度数据，索要 AI
              评估评分卡，检查事故与支持指标，并测试如果买方标准化到单一供应商栈，客户价值还能保留多少。这些信号区分的是差异化控制平面，还是一个强但可替换的产品叙事。
