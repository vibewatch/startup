      - number: '4.4'
        title: 财务结论、情景和尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              公开结论是，业务动能为正，但财务信息仍不完整。Omni 看起来是一家真实的成长期软件公司：企业客户可信，产品扩张面多，迁移和部署证明快，投资人也愿意在略多于一年内把公司估值从 $650 million
              激进重定价到约 $1.5 billion。最佳情景解读是，Omni 已经展现出分析基础设施公司少见的强资本效率：ARR
              快速增长，近期达到盈利里程碑，且产品层证据显示嵌入式分析能推动高级客户层和更广泛的工作流采用。


              谨慎情景同样重要。没有公开 ARR 分母，估值就无法换算成可靠倍数。没有毛利率，就无法判断实施、支持、权限工程和大型仪表盘调优到底像轻量企业软件开销，还是更重的服务层。没有烧钱或现金披露，已融资额只说明 Omni
              能获得融资，并不说明在增长放缓情景下能自我供血多久。因此，正确承保姿态应由证据驱动并带条件：把已披露增长、盈利评论和客户证明视为真实正面因素，但在收入质量、利润率路径、客户集中度和现金跑道上保留明确缺口，不要用
              SaaS 默认值填补。
