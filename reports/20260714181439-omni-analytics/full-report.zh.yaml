  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 类型
      - 当前或公开状态
      - 为何相关
      - 局限性
    rows:
      - - Datadog
        - 上市可比公司
        - 2026 年 Q1 收入 $1,006M，2026 年 7 月市值约 $92.67B
        - 展示高溢价云软件在公开市场需要怎样的信息披露和规模
        - 规模和业务多元化远高于 Omni
      - - Snowflake
