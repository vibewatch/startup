      - number: '3.2'
        title: 能力和信任对比
        blocks:
          - type: paragraph
            body: >-
              Omni 最强的产品论点是，一层受治理语义层可以同时服务内部 BI、面向客户的分析、API 和 AI 助手，不必迫使团队在刚性治理和敏捷分析之间二选一。这一点有差异化，但已不再独一无二。Looker 现在描述基于
              LookML 和嵌入式 API 的 agentic BI；Tableau Next 在 Salesforce 数据服务之上加入 AI 注入的语义层；Power BI 把 Copilot、OneLake 和
              Direct Lake 接入 Fabric；ThoughtSpot 推 Spotter 和关系搜索；Sigma 主张 AI 应用应在受治理仓库数据上行动；Hex 组合 notebooks、apps 和
              agents；Cube、AtScale 和 dbt 则把模型本身放在中心。信任叙事也同样是竞争性的，而不是空白。Omni、Sigma、Hex 和 ThoughtSpot 都呈现企业安全语言；Microsoft 和
              Google 则继承更广泛的云治理可信度。因此，比较的关键不在于谁有没有语义或 AI 故事，而在于谁能为真实买方工作流提供最干净的广度、治理和实施速度组合。
