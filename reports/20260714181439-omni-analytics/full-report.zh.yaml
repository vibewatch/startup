      - number: '7.4'
        title: 客户质量不透明与执行产能风险
        blocks:
          - type: paragraph
            body: >-
              客户故事足够可信，能够证明真实需求，但仍太不透明，无法证明收入耐久性。Omni 的公开案例集在部署速度和使用野心上很亮眼：BambooHR 快速推出 Elite 分析层，并增长到 100,000+
              下游用户；Checkr 把 Omni 当作受治理 AI 上下文层；更广泛的案例库强调迁移速度、支持和嵌入式价值。这些都是有用信号，因为它们表明产品已经进生产环境，也能对客户产生战略意义。但它们没有回答 $1.5B
              估值下最关键的问题：有多少客户续约？NRR 或 GRR 是多少？收入在少数旗舰客户上有多集中？扩张中有多少来自内部 BI、嵌入式分析和 AI 工作流？


              执行风险自然来自这种不透明。在语义层品类里，支持和上线就是产品的一部分，因为价值取决于模型质量、权限、数据合同和买方教育。公开评价基础薄，且评价中围绕隐藏高级功能、仪表盘不稳定和文档滞后的抱怨并存，使人很难判断产品质量能否在长尾账户中干净扩展，还是
              Omni 仍部分依靠团队对早期采用者的异常深度投入赢单。增长期这可以管理，但当公司试图同时捍卫估值和品类领导地位、对抗更大套件时，风险会变得更实质。
