      - number: '1.2'
        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              创始人故事是 Omni 最强的承保正面因素之一。官方公司材料点名 Colin Zima、Jamie Davidson 和 Chris Merrick 为联合创始人；About 页面和投资人材料把 Zima 与
              Davidson 连接到 Looker 和 Google，把 Merrick 连接到 Stitch 和 Talend。Omni 进攻的正是这些人有直接经验的品类，创始人—市场匹配是真实的。Zima
              是公司的公开门面，反复阐释 AI 为什么需要受治理的业务上下文。Davidson 以总裁身份出现，也是演示和公司页面中可见的产品建设者；Merrick 则在第三方公司资料中列为
              CTO。结果是一组三角领导层，技术可信度高，并且直接匹配产品高度依赖架构的价值主张。


              治理披露比创始人披露薄得多。公开材料清楚展示创始人、当前招聘广度，以及至少一个 2022 年董事会信号：Redpoint 合伙人 Tomasz Tunguz 曾表示，在领投 Series A 后加入 Omni
              董事会。除此之外，Omni
              官方页面没有发布完整董事名单、委员会结构或财务负责人梯队。第三方数据库暗示还有其他独立董事，但这些信息没有得到官方治理页面佐证。尽调上，正确结论不是治理薄弱，而是治理透明度仍低于融资动能和产品叙事。公司看起来仍以创始人为中心，关键人集中度围绕
              Zima 的市场叙事和创始团队过往 BI 声誉。
