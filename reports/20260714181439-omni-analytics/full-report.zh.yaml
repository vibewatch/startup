      - number: '5.4'
        title: 治理、安全和变更管理
        blocks:
          - type: paragraph
            body: >-
              Omni 信任模型最强的公开证据是具体控制，而不是愿景口号。内容设置可以强制通过 pull request 发布、禁用高风险文档动作，并限制低权限用户可执行的操作。SQL 创建和 SQL
              结果可见性明确被围到更高权限角色，viewer 工作簿访问则排除 SQL 标签页和非 topic 标签页。运营侧，Omni 表示其信息安全计划由 CTO 审查，通过 SOC 2 Type II
              年度审计，并用最小权限、MFA、日志和可撤销支持访问执行。嵌入式部署用签名 URL 加用户属性做行级过滤；Snowflake Cortex 选项把 AI 流量留在 Snowflake
              边界内，而不是把上下文发送到单独供应商端点。变更管理也比许多 BI 同类更像软件工程，因为模型分支、pull request、YAML 模式和 checksum 冲突检测都属于有文档的界面，即便公开 CI/CD
              深度仍轻于完整 DevOps playbook。
