  - id: TP004
    title: 切换成本 / 多平台并用表
    columns:
      - 层级
      - 粘性来自哪里
      - 仍可并用什么
      - 证据信号
      - Omni 启示
    rows:
      - - 语义模型
        - 指标定义、连接、权限和业务词汇会沉淀组织知识
        - 迁移时，外部 BI 工具和应用往往能指向同一语义层或新语义层
        - Cube、dbt、Databricks 和 Snowflake 都强调可复用、受治理的定义，而不是单体前端
        - 赢下语义层有帮助，但不会自动锁住整套分析栈
      - - 仪表盘 / 工作簿 / 实时看板
        - 报表逻辑、筛选器、告警和用户习惯重建起来很费事
        - 过渡期团队仍可并行跑多个 BI 前端
        - Metabase 文档、ThoughtSpot、Tableau 和 Power BI 都默认仪表盘与报表流程会持续存在
        - 替换型销售会遇到迁移摩擦，但不是不可突破的技术锁定
      - - 嵌入式分析
        - 面向客户的报表、品牌呈现和权限映射重做成本高
        - API 和 iframe 让部分买家不用彻底重写就能试用替代方案
        - Omni、Looker、Power BI、Metabase、Hex 和 Cube 都提供嵌入路径
        - 嵌入式部署最有机会让 Omni 的运营粘性强过纯 BI 场景
      - - AI / 聊天体验
        - Prompt 模式、信任调优和模型上下文会越用越好
        - 助手层迁移速度可能快过仪表盘或数据仓库迁移
        - Omni、Looker、Power BI、ThoughtSpot、Hex、Cube、Snowflake 和 Databricks 都在推自然语言分析
        - AI 界面已经足够可迁移，速度和信任比新鲜感更重要
      - - 身份 / 治理集成
        - SAML、群组映射、行级规则和审计预期会抑制草率换工具
        - 现有云身份体系仍可快速延伸到新应用
        - Omni、Hex、ThoughtSpot、Metabase、Microsoft 和 Google 都强调治理挂钩能力
        - 身份与合规已经集中管理的地方，存量厂商仍占优势
      - - 仓库原生语义 + 内部自建
        - 把定义留在数据仓库里，可以减少新增组件
        - Metabase 这类轻量前端可以替换，也可以补位
        - Databricks 和 Snowflake 都把语义向外暴露给外部 BI 工具；Metabase 和自定义应用可以叠在上面
        - 这是现金成本最低、最干净的多平台并用路径，也是 Omni 最清晰的中期护城河威胁
    notes: 表格关注运营粘性，而不是法律合同锁定；迁移成本确实存在，但 2026 年来源集反复显示，买家可以把语义、BI 和应用层混搭起来。
    claimRefs:
      - CP023
      - CP025
      - CP029
      - CP030
      - CP034
      - CP036
      - CP039
  - id: TP005
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 主要威胁
      - 严重度
      - 破局原因
      - 尽调问题
    rows:
      - - 跨 BI、嵌入式和 AI 的统一模型
        - Omni 产品和文档显示，一个受治理界面可在三类场景中复用
        - 存量厂商在更大套件内补上同样层级
        - 高
        - Looker、Tableau Next、Power BI/Fabric 和 ThoughtSpot 已经把智能体和语义广度作为卖点
        - 索取近期竞争输赢记录，按替换目标和部署范围拆分
      - - 基于语义的 AI 信任
        - Omni 和许多对手都把语义层包装成可信 AI 的控制平面
        - 叙事商品化
        - 高
        - Databricks、Snowflake、AtScale、Cube、dbt 和存量厂商都在使用类似的可信语义表述
        - 要求提供相对传统 BI 和仓库原生替代方案的答案质量或采用率实测差异
      - - 以嵌入式分析切入粘性场景
        - Omni、Cube、Metabase、Hex、Looker 和 Power BI 都提供嵌入路径
        - 嵌入式成为标配
        - 中
        - API 和 iframe 交付已很常见，所以分发和实施速度比是否有嵌入功能更重要
        - 索取嵌入式客户相对于仅内部 BI 客户的附加率和续约数据
      - - 企业信任 / 合规姿态
        - Omni 的安全页面和功能清单具备可信度
        - 云平台存量厂商继承了更大的合规生态
        - 中
        - 每个入围工具都有强控制时，安全是必要条件，但不再构成差异化
        - 询问买家，Omni 相对 Microsoft、Google 和 Salesforce 赢下或输掉哪些具体合规异议
      - - 仓库中立灵活性
        - Omni 位于数据仓库之上，避免强迫客户陷入仓库原生锁定
        - 仓库原生语义降低了再加一层的必要性
        - 高
        - Databricks metric views 和 Snowflake semantic views 把逻辑留得更靠近数据，同时仍服务外部工具
        - 索取来自已标准化 Databricks 或 Snowflake 账户的迁移证据
      - - 替换存量仪表盘的成本
        - 评论证据显示，存量工具可能昂贵或令人沮丧
        - 由于分发和熟悉度，存量用户仍可能忍受痛点
        - 中
        - 如果技术栈已经付费并纳入治理，差 UX 本身很少触发迁移
        - 要求证明相对 Power BI 和 Tableau 替换项目的达值时间和重建速度
      - - 维持现状自建对多数买家太难
        - Metabase 加仓库原生语义，比购买 Omni 需要更多工程投入
        - 工程能力强的买家可能偏好更低现金支出
        - 中
        - 技术团队可能觉得，自建第一年够用且更便宜
        - 索取 Omni 在总成本和实施风险上击败 Metabase / 自建的客户赢单画像
      - - 执行护城河
        - 公开证据支持真实切入口，但不足以证明决定性锁定
        - 产品广度未能转化为可复制商业赢单
        - 高
        - 公开语料缺少许多新 AI 功能的实际定价、迁移摩擦和使用深度数据
        - 尽调优先看实际定价、切换成本、产品采用和按部署类型拆分的扩张
    notes: 严重度衡量的是对持久定价权和替换经济性的风险，而不是对品类存在的风险；表格强调最直接削弱或支撑长期防御力的证据。
