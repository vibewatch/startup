      - number: '4.2'
        title: 牵引和单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Omni 更愿意披露方向性牵引，而不是绝对规模。2025 年 3 月 Series B 材料称，收入和客户使用量都同比增长 8x，已有超过 200 家公司使用平台。2026 年 4 月 Series C
              材料随后从使用语言转向财务语言，称收入同比增长 4x；Yahoo 转载的 Fortune 报道称 ARR 几乎增长四倍，Omni 在前一个月实现盈利，员工约 200
              人。这些信号有意义，因为它们指向一家在没有披露庞大团队的情况下快速扩张的公司。但它们仍不完整，因为分母缺失：没有公开 ARR 基数、TTM 收入、NRR、毛利率或 CAC 回收期。


              因此，客户部署是单位经济和销售效率的最佳代理指标。BambooHR 在四个月内向 30,000+ 人推出新的分析层，后来扩至 100,000+ 人，把 Omni 直接连接到可加购的嵌入式产品。Cribl
              在五周内重建约 100 个仪表盘，三个月内完全迁移，并提到迁移 CSAT 接近 89，且至少一名用户每月节省 15 小时。Guitar Center 替换 150+ 个仪表盘，并在六个月内关闭
              Tableau；Synthesia 则用 Omni 在不到三个月内加快预测和自助服务。这些案例支撑快速价值实现和整合叙事。但负面证据也重要：AWS Marketplace
              同步的评论提到学习曲线、大型仪表盘延迟、缺少图表类型、偶发不稳定和文档滞后。这意味着，按业务价值看，Omni 的部署经济性可能优于传统 BI，但仍会带来不小的支持和上手成本，而公开材料没有量化这些成本。
