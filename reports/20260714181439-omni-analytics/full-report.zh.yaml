  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: Omni 夹在公开口径较窄的语义层软件市场和更宽的既有分析平台预算池之间；可投资视角应是一段重叠区间，而不是单一 TAM 数字。
    data:
      nodes:
        - id: tam
          label: TAM — 宽口径既有分析与嵌入式预算池
          detail: 口径太宽，不能直接使用；其中包含 Power BI、Tableau 以及相邻分析平台支出，超过 Omni 真正重叠的市场。
        - id: sam
          label: SAM — Omni 相关重叠区间：~$1.0B-$4.0B（2026 年估算）
          detail: 方向性分析区间，边界落在狭义语义层软件与更广的受治理 BI / 嵌入式 / AI 控制平面预算之间
        - id: som
          label: SOM — 近期可触达切入楔子：~$0.2B-$0.8B
          detail: 需要在 BI、嵌入式分析和 AI 之间共用一个受治理模型的客户，而非只用原生点工具
    approximationNotes: SAM 和 SOM 是明确的低置信度承保边界，因为没有公开来源能拆出 Omni 的精确重叠市场；外围 TAM 层有意保留定性口径，因为既有平台预算太宽，不能全当作 Omni 的收入机会。
