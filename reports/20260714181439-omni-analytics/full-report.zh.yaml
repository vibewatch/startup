      - number: '7.2'
        title: AI 治理、实施复杂度与产品成熟度风险
        blocks:
          - type: paragraph
            body: >-
              Omni 的产品故事很连贯，但这种连贯也暴露了实施风险可能出现的位置。受治理路径在客户把工作留在共享主题、有权限控制的工作簿和受控智能体界面内时效果最好。但 Omni 自己的文档显示，高级 SQL
              编辑可以在共享模型之外生成特定查询字段，电子表格标签页不能把自身逻辑提升回治理层，使用 MCP 还要求组织启用功能、管理 PAT 或 OAuth
              设置，并正确对齐角色。换句话说，产品关于准确性和治理的故事不会自动兑现；它取决于管理员质量、建模纪律和周到的推广决策。


              公开材料对 AI 准确性的证明，也比对 AI 架构的证明更薄。Omni 的融资公告和 query API 示例解释了受治理定义与权限如何流入 AI 查询；Checkr
              案例说明客户为什么需要上下文和可靠性循环。但公开语料仍没有披露基准化幻觉率、错误回答率、权限逃逸测试，或 AI
              输出专属事故数量。评价和从业者证据又叠加了第二层风险：大型仪表盘可能卡顿或崩溃，图表覆盖仍在扩展，文档可能落后于新版本，外部开发者界面也出现过可见的弃用和整合。这不会推翻产品投资命题，但意味着运营打磨仍是承销问题的一部分。
