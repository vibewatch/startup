      - number: '6.5'
        title: 集中度、耐久性，以及公开证据仍未显示的内容
        blocks:
          - type: paragraph
            body: >-
              Omni 的客户证据足以证明真实采用，但不足以支撑集中度或留存判断。公开来源披露了客户名称、上线速度、少数嵌入式部署里的下游用户数量，以及 200+
              家公司这类方向性规模说法。它们没有披露准确客户数、嵌入式与内部部署构成、NRR、GRR、流失、合同期限、续约客群，或大客户集中度。这个缺口重要，因为许多最亮眼的公开故事——BambooHR、WorkRamp、ActiveProspect、SWBC——恰恰是旗舰部署，足以讲出好看的叙事，却仍让收入质量保持不透明。[CU011]
              [CU023] [CU032] [CU033] [CU045] [CU046]


              至少一个负面来源也需要纳入。Embeddable 的竞品比较认为，Omni 仍更像以 BI 容器为中心，而不是完全原生 UI 的分析平台；面向多租户 SaaS
              体验时，可能还需要额外配置。即便扣掉竞品偏见，这一批评也有用地强化了独立评价已暗示的结论：当买方更看重受治理指标、自助服务和快速部署，而不是像素级控制或公开的续约深度证据时，Omni
              最强。因此，本章应给出的结论是：客户采用真实，客户标识质量可观，落地后扩张逻辑可见——但确切耐久性、集中度和部署组合经济性仍是尽调事项，不是公开事实。[CU042] [CU043] [CU044] [CU045]
