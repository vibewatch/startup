      - 对投资测算的影响
      - 具体尽调路径
    rows:
      - - 绝对 ARR 和滚动收入
        - 无法做估值倍数、客群规模测算，也无法按分母检验增长
        - 索取董事会 KPI 包，或包含当前 ARR、TTM 收入和季末历史的月度收入桥表
      - - 按产品线拆分的毛利率
        - 无法判断 Omni 更像高毛利软件，还是部署和支持更重的模式
        - 索取 GAAP 毛利率，并拆分核心平台、支持 / 服务，以及任何嵌入式或 AI 占比高的工作负载
      - - 现金余额、burn 和现金跑道
        - 即便融资支持很强，资本充足性分析仍要附带条件
        - 索取最新资产负债表、月度现金消耗，以及基准 / 下行情景现金跑道模型
      - - ACV、合同结构和折扣
        - 没有标价到实际成交价的数据，就无法检验收入质量和回本周期
        - 审阅近期合同，查看期限、席位或用量、嵌入式权益和折扣政策
      - - NRR、流失率和客户集中度
        - 看不出采用是否能高效扩张，也看不出收入是否压在少数大客户上
        - 索取 cohort 留存表、前 10 大客户收入占比，以及按细分市场拆分的 gross logo churn
      - - 实施和支持经济性
        - 客户成功投入强度可能左右毛利，复杂嵌入式或迁移项目尤其如此
        - 索取 onboarding 工作量、解决方案工程参与度，以及适用时的服务毛利率
      - - 嵌入式和 AI 收入贡献
        - 战略叙事重扩张，但收入结构未知
        - 拆出嵌入式分析、电子表格、API 和 AI 相关功能贡献的 bookings 与 ARR
    notes: 这些是从方向性分析推进到可支撑投资判断模型所需的最低限度缺失字段。
