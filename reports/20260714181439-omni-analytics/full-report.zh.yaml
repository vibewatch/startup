      - number: '1.3'
        title: 融资历史、牵引和利益相关方
        blocks:
          - type: paragraph
            body: >-
              Omni 的资本形成速度很快。2022 年 8 月发布公告披露 $26.9M 融资，包括 Redpoint 领投的 $17.5M Series A 和 First Round 领投的 $9.4M
              种子轮，GV、Box Group、Quiet、Scribble 以及 100 多名天使参与。到 2025 年 3 月，ICONIQ 已公开以 Series B 领投方身份站台，描述平台采用强劲，已有超过 200
              家公司使用。一年后，Omni 宣布完成由 ICONIQ 领投、Theory Ventures、First Round Capital、Redpoint Ventures 和 GV 参与的 $120M Series
              C，估值 $1.5B，另有 $30M 员工要约收购。第三方融资数据库显示，截至 2026 年 4 月，公司已披露终身融资约 $236M，并将上一轮估值置于 2025 年 3 月的
              $650M，意味着本轮估值大幅上调。


              虽然公司不披露绝对 ARR 基数，牵引披露仍方向性强。Series C 材料称 ARR 在前一年增长 4x；Business Wire 称在此前 4x 增长之后，年初至今收入又翻了三倍。Fortune 2026
              年 4 月报道补充，Omni 在本轮融资前一个月实现盈利，员工约 200 人。客户证明也异常具体：Omni 及其投资人点名 BambooHR、Checkr、Cribl、dbt Labs、Guitar
              Center、Heidi AI、Mercury、Pendo、Synthesia、Perplexity、Writer 和
              BuzzFeed；客户页面量化迁移速度、仪表盘重建和部署规模。资本结构、客户标识和参考架构合在一起，支撑的是一条真实的后期企业软件轨迹，而不是纯靠叙事的 AI 融资。
