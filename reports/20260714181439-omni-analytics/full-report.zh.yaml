  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方或尽调路径
    rows:
      - - 绝对 ARR 或收入运行率
        - 当前经常性收入基数，以及从已披露增长率推回的桥接
        - 没有分母，就无法干净判断公开估值
        - CFO 数据室或董事会材料
      - - 留存
        - 按队列和产品拆分的 NRR 或 GRR
        - 只有增长质量可持续，高溢价倍数才守得住
        - 队列留存资料包和续约分析
      - - 客户集中度
        - 头部客户和嵌入式占比高客户的收入结构
        - 知名客户有帮助，但如果一两个客户主导 ARR，仍然不够
        - 客户集中度明细表
      - - 毛利率
        - 托管或支持负担，以及服务收入占比
        - 用于判断 Omni 更像高端软件，还是实施更重的工具
        - 经审计 P&L 及分部注释
      - - 合同类型与实际成交价
        - ACV 区间、折扣、模块附加率和期限结构
        - 以报价为主的定价既可能藏着上行，也可能藏着压力
        - 销售运营与采购样本合同
      - - Series C 证券条款
        - 清算优先权、参与权，以及其他结构性保护
        - 标题估值质量可能偏离普通股经济性
        - 融资律师和股权结构表审阅
      - - 现金消耗与资金续航期
        - 当前现金余额，以及基准到下行情形下的融资需求
        - 仅有盈利表述，不能证明公司可以持续自我造血
        - 资金预测和董事会经营计划
    notes: 这些问题就是目前缺乏支撑的指标和证据缺口，也正是今天无法给出更强建议的原因。
