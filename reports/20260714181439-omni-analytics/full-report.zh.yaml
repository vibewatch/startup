      - number: '6.4'
        title: 独立评价信号、支持与上线启示
        blocks:
          - type: paragraph
            body: >-
              独立证据方向上支持 Omni，但材料厚度明显不如官方案例库。TrustRadius 只基于两条评价给 Omni 打出 8.6/10；AWS Marketplace 则展示了 65 条同步的 G2 评价，评分为
              4.8/5。这些评价持续肯定灵活仪表盘、受治理指标、SQL
              加电子表格的工作流，以及响应及时的支持。它们也补上了官方案例淡化的买方细节：有用户一开始觉得搭建流程难懂，有些大型仪表盘会卡顿或崩溃，有些图表类型仍需要写代码，文档有时追不上近期发布。一个偏 B2B2C
              的评价者还抱怨，成千上万终端用户只是偶尔访问分析时，按席位计费会很别扭。[CU035] [CU036] [CU037] [CU038] [CU039]


              这些评价模式与实施故事相互印证。BambooHR、SWBC 等更大或监管更重的客户强调权限、负载测试、产品上线和战略性供应商支持。Cribl 和 Checkr
              强调上下文工程、模型治理和变更管理循环，而不只是迁移仪表盘。Spicy Data 的嵌入式实施复盘尤其有用，因为它解释了 Omni 为什么能赢下一些面向客户的场景——Git/dbt
              工作流、血缘、灵活授权——同时也揭示了较新平台真实的运营取舍，包括界面仍在演进、图表库仍在扩充。结论是：上线和支持看起来是产品的一部分，不是事后补丁；但买方应预期，模型设计和推广纪律会真正影响结果。[CU013]
