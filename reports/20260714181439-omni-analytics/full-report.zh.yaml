chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品和阶段
        blocks:
          - type: paragraph
            body: >-
              Omni 一直把自己定位为 AI 分析平台，而不是单点 BI 插件。从官网首页、平台页面、AI 文档到 2026 年 4
              月融资材料，核心承诺都一致：在原始数据仓库与下游用户或代理之间放入一层受治理语义模型，把公司数据变成 AI 和分析可依赖的真相源。公司称，用户可以用自然语言提问，在工作簿里细化答案，切换到 SQL
              或电子表格式公式，再把同一套受治理逻辑复用于仪表盘、嵌入式分析、API，以及接入 MCP 的外部 AI 工具。这种产品叙事很关键，因为它让 Omni 不只是替换仪表盘；公司卖的是 AI 时代数据解读的控制层。


              作为一家私有基础设施初创公司，Omni 的公开身份也异常清晰。Omni 官方 About 页面称，创始人在 Looker、Google、Stitch 和 Talend 的职业经历后于 2022
              年重新聚到一起；多家第三方资料则把总部定位在 San Francisco。同一批官方页面显示，公司运营足迹横跨 San Francisco、Santa
              Cruz、Philadelphia、Toronto、Dublin 和
              Sydney；这与目前在北美、欧洲和澳大利亚支持与销售岗位上的招聘一致。综合来看，证据支撑一个后期私有公司的身份：创始人主导、面向企业、进入市场覆盖已具全球化雏形，并围绕语义层论点搭建架构，管理层如今又明确把该论点连接到
              AI 代理可靠性。
