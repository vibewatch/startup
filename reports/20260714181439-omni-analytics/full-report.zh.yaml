  - id: TV005
    title: 打破投资论点与否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 分母低于预期
        - 披露 ARR 明显低于约 $100M
        - 当前高溢价区间会下移到更低的支撑区
        - 按基准或悲观情形重切模型，避免激进入场
      - - 留存或集中度偏弱
        - NRR 或 GRR 偏弱，或收入集中在少数客户
        - 客户背书无法再转化为可持续的估值质量
        - 下调倍数，并要求按队列拆分的证据
      - - 优先权偏重的融资条款
        - Series C 经济条款明显偏向优先股持有人，或嵌入标题里看不到的保护
        - 标题估值夸大了普通股权益质量
        - 从股权结构表重做投资测算，而不是照搬新闻稿
      - - 买方接受捆绑方案
        - 赢单 / 输单数据表明 Snowflake、Databricks、dbt 或 Microsoft 原生选项往往已经够用
        - 稀缺性溢价被侵蚀，定价权被压缩
        - 对倍数做结构性折价
      - - 产品成熟度拖累
        - 客户规模扩大后，大型看板卡顿、功能缺口或文档债仍然存在
        - 实施摩擦增加，会削弱高端软件质量
        - 证据改善前，入场价格更保守
    notes: 这些触发项把折价逻辑落到运营证据上，而不是把估值争论简化成一个是或否的判断。
