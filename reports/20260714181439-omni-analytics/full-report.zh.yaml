  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价和变现
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑的是一个销售驱动的企业软件模型，带有多处扩张面，而不是单一席位 BI 资费。Omni
              自己的平台和嵌入式分析页面显示，一层受治理语义层服务内部仪表盘、工作簿和电子表格工作流、面向客户的嵌入式分析、API 和 MCP 式外部访问，以及 AI
              查询。这在财务上重要，因为它意味着合同价值可以跨部署类型扩张，而不是依赖单一仪表盘席位数。最强的变现证明不是 Omni 已发布价目表——审阅过的官方页面中没有价目表。证明来自客户包装证据。BambooHR 用
              Omni 推出 Elite analytics tier；Omni 自己的嵌入式分析页面也明确告诉潜在客户，他们可以创造新收入流和高级定价机会。内部场景里，Omni 还营销基于电子表格的财务工作流，连接实时
              ERP、CRM 和 HRIS 数据，把产品表面拓宽到 RevOps 和财务报告。


              承保限制在于，标价缺失，但买方预算锚点并不缺。Omni 官方页面仍没有说明价格实现、折扣、模块门槛，以及 AI 或嵌入式工作流是打包还是单独变现。相比之下，Microsoft 和 Tableau
              发布席位与套餐锚点，让买方能把 Omni 和既有替代方案对标，即便这些既有厂商也不披露企业实际折扣。因此，财务读法很清楚：Omni
              似乎靠更高价值的平台合同、嵌入式分析和工作流扩张变现，但公开记录仍无法说明起步价、平均合同价值或扩张机制究竟是什么。
