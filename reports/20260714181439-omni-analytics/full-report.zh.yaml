  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 厂商 / 类别
      - 公开定价信号
      - 合同模式
      - 已包含 / 设门槛能力
      - 未知项
      - 含义
    rows:
      - - Omni
        - 保留来源未显示公开标价
        - 销售主导的企业软件
        - 统一语义 BI、嵌入、API、MCP、AI 分析
        - 实际成交价、折扣和扩展机制不公开
        - Omni 必须靠 ROI 和技术栈简化取胜，而不是靠入门价透明
      - - Looker
        - 联系销售；版本包含用户数和 API 配额
        - 年度订阅，按平台 + 用户定价
        - Standard、Enterprise 和 Embed 版本；对话 token 配额和超额费
        - 实际版本定价和折扣不公开
        - 适配大客户，但不透明定价会加大捆绑 / 对比压力
      - - Tableau
        - Viewer $15、Explorer $42、Creator $75，按年计费的月费；Cloud+ / Tableau+ 联系销售
        - 按角色席位收费，并叠加套餐上售
        - 传统 BI 席位仍然透明，但智能体能力被放进更高阶套餐
        - 企业实际价格、站点数和数据积分经济性都不透明
        - 功能强但昂贵的产品组合逻辑，可能更利好存量厂商，而不是从零部署的简单方案
      - - Power BI
        - 免费；Pro $14；Premium Per User $24；嵌入式定价不定
        - 按用户收费，叠加 Fabric / Premium 容量
        - 入门成本低、分享面广，但部分 AI / 免许可证场景需要更高阶 SKU
        - 实际 Fabric 容量支出取决于规模和工作负载组合
        - 在 Microsoft 使用很重的客户里，这是 Omni 面临的最尖锐商业捆绑威胁
      - - Sigma
        - 公开页面导向联系销售，不列价格
        - 销售主导的企业合同
        - AI 应用、仓库原生 BI、治理和嵌入作为一个平台打包销售
        - 保留来源未披露席位、用量或应用定价
        - 商务不透明会拖慢评估，但保留谈判弹性
      - - Hex
        - 免费层叠加按分钟计算的算力、付费积分 / 更高阶方案
        - 自助 + 企业上售的混合模式
        - 智能体、笔记本、应用和协作随方案层级加深
        - 企业客户如何一起购买席位、积分和算力仍未公开
        - 试验灵活性强，但 TCO 取决于工作负载形态
      - - ThoughtSpot
        - 数据定价和用户定价都有披露；更高阶企业能力看起来由套餐驱动
        - 用户、用量和企业包装的混合模式
        - Spotter、面向智能体的语义层、MCP 服务器和更大规模能力
        - 最终企业合同结构仍需谈判
        - 用户评论里，ThoughtSpot 可能看起来比 Tableau 便宜，但仍显著高于 Power BI
      - - Metabase
        - 开源自托管、可选用量费，嵌入从 $575/month 起
        - 开源叠加云 / 企业上售
        - 入门便宜，AI token、转换和嵌入式分析作为附加项销售
        - 大型企业支持的经济性取决于部署方式和 SLA 需求
        - 愿意少要一些企业功能的成本敏感团队，现金门槛最低
      - - Cube
        - 没有简单公开席位价目表；按月自助和年度订单表都明确存在
        - 按月自助，或年度企业订单表
        - 语义层、BI 界面、API、缓存和智能体连接器
        - 除包装机制外，用量、席位和超额费用未公开
        - 这种包装更适合重度平台团队，而不是随手采购 BI 的部门买家
      - - dbt Semantic Layer（语义层）
        - Starter 为 $100/user/month；查询指标上限明确
        - 开发者席位订阅，带用量上限和企业上售
        - 基础语义层早期套餐就能用，高级语义层和 Mesh 上探企业市场
        - 下游 BI 和应用成本仍在 dbt 之外
        - dbt 更容易按指标治理工具来评估，而不是按完整 Omni 替代品来评估
    notes: 定价行区分公开标价与明确由销售主导或混合包装；未知单元格明确保留，因为多数厂商的实际折扣、积分和企业套餐条款并不公开。
