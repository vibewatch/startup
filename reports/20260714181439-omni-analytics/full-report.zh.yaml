  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 品类
      - 规模 / 分发信号
      - 目标客户群
      - 差异化
      - 关键限制
    rows:
      - - Omni
        - 统一语义 BI + 嵌入式 + AI 分析
        - 未上市 AI 分析厂商；第 1 章背景披露其近期完成大额私募融资
        - 希望用一套受治理模型贯通 BI 和 AI 的现代数据团队、产品团队和企业
        - 一套受治理模型可复用于 BI、嵌入、API、MCP 和 AI 助手
        - 定价不公开，公开输赢证据有限，商业耐久性仍有部分未验证
      - - Looker
        - 在位云 BI + 语义层
        - Google Cloud 分发和既有 BigQuery / IAM 足迹
        - 已靠近 Google Cloud 的企业内部 BI 和嵌入式分析买方
        - LookML 语义层、嵌入式 API、智能体式 BI 叙事和强云安全姿态
        - 定价多由销售推动，常搭在更大的 Google 合同上，而不是清晰的独立采购决策
      - - Tableau
        - 在位可视化主导 BI
        - Salesforce 庞大装机量和成熟企业分析足迹
        - 重视可视化广度和受治理报表的数据与业务团队
        - 强可视化、广泛角色化许可，以及新的 Tableau Next / 语义层路径
        - 规模化后成本高，产品组合 / 捆绑结构复杂
      - - Power BI
        - 在位捆绑型 BI 平台
        - 借 Fabric、Azure 和 M365 获得庞大 Microsoft 分发
        - 已在 Microsoft 身份和生产力栈上标准化的组织
        - 免费 / 低成本入口、Fabric 集成、嵌入路径和 Copilot 路线图
        - AI 和免许可共享往往需要更高容量 SKU；产品复杂度仍被抱怨
      - - Sigma
        - 数仓原生协作式 BI / AI 应用
        - 企业 SaaS；主打实时数仓定位和强合规叙事
        - 想要类电子表格探索和受治理 AI 应用的云数仓客户
        - 实时查询架构、受治理数据模型、嵌入式分析，以及面向行动的 AI 应用叙事
        - 公开定价仍由销售推动，仪表盘到应用的迁移价值还需要卖出来
      - - Hex
        - Notebook + 应用 + 智能体分析
        - 在技术用户中认知强，计算和协作模式灵活
        - 想把 Notebook 和应用放在同一界面的分析工程师、分析师和产品团队
        - 组合 Notebook、数据应用、智能体、Slack/MCP 和可复用语义组件
        - 作为传统仪表盘密集型资产的广泛 BI 替代品，标准化路径不够显性
      - - ThoughtSpot
        - 搜索优先的企业 BI / AI 分析师
        - 成熟企业分析品牌，自助搜索定位强
        - 希望规模化搜索和对话式分析的大型企业
        - Spotter AI、关系搜索、liveboards 和语义模型训练闭环
        - 评测证据显示，可视化灵活性和定价可能落后于 Power BI 或 Tableau 预期
      - - Metabase
        - 开源 BI 和嵌入式替代品
        - 开源和自托管入口，叠加简单 SaaS 升级销售
        - 追求成本和速度的初创公司、中小企业和工程主导团队
        - 初始现金成本低，支持嵌入、SQL 兜底，以及基础语义层 / AI 功能
        - 企业深度功能和大规模性能弱于高端平台
      - - Cube
        - 开放语义层 + BI / 嵌入式分析
        - 开源语义核心，配自助和订单合同式套餐
        - 构建面向客户分析的数据平台团队和 SaaS 厂商
        - 代码优先语义层、Semantic SQL、API、缓存，以及可供智能体使用的模型抽象
        - 团队必须接受语义层架构，而不是只买更简单的仪表盘工具
      - - AtScale
        - 通用语义层专家
        - 定位企业语义基础设施，覆盖主要 BI 工具和 AI 智能体
        - 希望不搬迁数据就复用语义的大型企业
        - 无需数据搬迁的通用语义层、受治理指标、CI/CD，以及 AI/BI 互操作
        - 公开定价和广泛 SMB 式自助证据有限
      - - dbt Semantic Layer（语义层）
        - 分析工程语义层
        - dbt 生态分发，加上明确打包的可查询指标
        - 以 dbt 为中心、为报表、应用和 AI 工作流标准化指标的团队
        - 指标定义贴近分析工程工作流，并可供给多个下游界面
        - 语义基础，而非完整的一方 BI 前端
      - - 数仓原生 + 内部自建
        - Snowflake / Databricks 语义，加 Metabase 或自定义 UI
        - 从既有数仓和工程支出中抽取预算
        - 已在数仓、notebook 或自定义产品界面上标准化的团队
        - 让业务逻辑贴近数据，并可搭配既有 BI 或定制应用层
        - 需要更多内部工程投入，打包体验也比 Omni 更少预设
    notes: 覆盖有意保留部分但保持宽度：包括具名直接同行、在位厂商、语义层邻近品类，以及 2026 年审阅来源集中可见、最现实的数仓原生或内部自建替代方案。
    enumerationScope:
      coverage: partial
      basis: >-
