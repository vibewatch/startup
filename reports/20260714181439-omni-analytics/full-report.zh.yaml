  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Omni 用一个共享语义核心托住多种用户界面、外部接口和 AI 控制，并不把 BI 和 AI 拆成两套栈。
    data:
      layers:
        - label: 数据仓库与数据源连接
          detail: 客户数据留在 Snowflake、Databricks 和 BigQuery 等已连接 SQL 仓库中。
          modules:
            - Snowflake
            - Databricks
            - BigQuery
        - label: Schema / 语义建模层
          detail: Schema、共享和工作簿模型层定义了原始结构如何变成受治理逻辑，以及本地扩展点如何落位。
          modules:
            - Schema 模型
            - 共享模型
            - 工作簿模型
        - label: 查询与工作簿运行层
          detail: 运行层支持点选查询、Omni SQL 辅助、直接 SQL 标签页、工作簿历史和保存文档。
          modules:
            - 点选
            - Omni SQL
            - SQL 标签页
            - 工作簿版本历史
        - label: 电子表格与计算层
          detail: 电子表格标签页和 Excel 风格计算叠在实时查询表之上，用于财务和规划场景。
          modules:
            - 电子表格标签页
            - 受保护查询表
            - Excel 风格公式
        - label: AI 与语义编排
          detail: Agent 生成语义查询，使用模型元数据，也可选择经 Snowflake Cortex 或其他提供方运行。
          modules:
            - Omni Agent
            - 工作簿 Agent
            - 建模 Agent
            - Snowflake Cortex 选项
        - label: 外部交付界面
          detail: 同一语义核心暴露给嵌入式分析、REST API 和 MCP 客户端。
          modules:
            - 嵌入式 iframe
            - REST API
            - MCP 服务器
