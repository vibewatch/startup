      - number: '8.2'
        title: 可比背景、定价与捆绑风险
        blocks:
          - type: paragraph
            body: >-
              Omni 的估值案例必须同时放在变现证据和品类拥挤度里看。正面看，Omni 呈现的是一个横跨内部分析、受治理指标、面向客户分析和 AI
              工作流的平台。它的嵌入式分析页面明确称，客户可以创造新收入流和高级定价机会；这很重要，因为它暗示产品可以支撑平台合同，而不是狭窄的仪表盘席位销售。Vendr 的 2026 年定价摘要也显示，Omni
              按企业软件定价，而不是轻量自助 BI：席位、层级、合同期限和部署形态都重要，企业定价仍需询价。

              负面看，定价不透明和捆绑风险仍真实存在。Microsoft、Tableau 和 ThoughtSpot 都发布官方定价页面，而 Omni
              的公开页面没有披露可比的企业价目表。更重要的是，语义层市场已不再稀缺。Basedash、Atlan 和 TypeDef AI 都描述了一个 2026
              年有多种可行路径的格局；Snowflake、Databricks 和 dbt 也各自推销原生或紧密集成的语义层能力。Snowflake 现在把业务概念直接存进 Semantic Views，Databricks
              通过 Unity Catalog metric views 治理标准化指标，dbt 则销售一层跨工具的「一次定义」指标层。这并不意味着 Omni 没有差异化；它的嵌入式和 AI
              定位真实存在。它意味着投资人不应像受治理指标和对 AI 安全的语义只有一家供应商能提供那样，支付稀缺性溢价。

              公开市场背景强化了同样的谨慎。Multiples.vc 称，2026 年 6 月软件估值高度分层，并深受 AI 相关性和技术深度影响；PublicComps 和 BVP Emerging Cloud Index
              则更像动态基准，而不是单一数字答案。Datadog 2026 年 Q1 业绩，以及 Datadog、Snowflake、MongoDB、Confluent 和 Cloudflare 的 2026 年 7
              月市值快照，清楚显示了规模错配：最佳公开分析和数据平台可比公司，规模远大、披露更多、业务也更多元。它们适合设定合理边界条件，但不能假装 Omni 在没有私营公司不透明折价的情况下，理应享受同样倍数。
