      - number: '7.3'
        title: 法律、安全与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              在信任信号上，Omni 比许多年轻分析厂商位置更好，但公开法律和合规表面仍给买方留下工作。使用条款是标准的加州法管辖网站条款；隐私政策明确说，客户数据由合同而非公开政策治理；安全页面强调年度 SOC 2 Type
              II 审计和广泛合规说法；Trust Center 与 CSA STAR 收录则改善采购观感。对于一个想成为企业数据语义与 AI 控制平面的产品来说，这些是真实缓释因素。它们并不等同于公开证明每个企业部署都有成熟
              DPA、子处理方安排、支持访问边界、事件流程，或面向客户的行级权限与智能体控制实施。


              依赖风险会放大法律和安全图景。Omni 依赖 AWS 基础设施、集中式认证和客户侧权限设计，同时又试图接入 dbt、Snowflake 语义视图、Databricks 指标视图、嵌入式应用，以及通过 MCP
              连接外部 AI 客户端。这种桥接策略在战略上聪明，但每多一座桥，就多一个地方可能因上线质量、兼容性漂移或上游供应商产品动作，削弱 Omni 对端到端体验的控制。对欧洲以及监管更重的买方而言，AI Act 和
              NIST 式可信 AI 预期，也会提高透明度、监控和文档化控制的门槛，尤其是 AI 辅助答案如何生成和复核。
