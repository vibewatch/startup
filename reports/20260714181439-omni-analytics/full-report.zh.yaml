      - - 2026 年资本计划用途
        - 扩大 AI 分析平台，并推动企业采用 AI；详细预算未公开
        - 中
        - 资金用途细节影响现金跑道和招聘假设
        - 提供产品、基础设施、GTM 和国际扩张的预算分配
      - - 盈利信号
        - Fortune/Yahoo 称 Series C 前一个月已盈利
        - 中
