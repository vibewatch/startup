  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              定义 Omni 市场的最清晰方式，不是把它归入通用商业智能软件，也不是把它看成独立语义层工具。Omni 自己的产品页面呈现的是一个平台：团队可以定义并信任共享指标，在内部 BI
              中使用这些指标，并把同一套受治理逻辑推到面向客户的分析里。它的语义层文章更进一步，把语义层框定为控制平面，决定仪表盘、notebook 和 AI
              答案到底共享同一个业务定义，还是各自漂移。第三方品类来源也指向同一方向。AtScale 称语义层已从 BI 便利功能跨入必要 AI 基础设施；Futurum 称价值正在从可视化仪表盘转向逻辑指标库；Gartner
              预测，到 2030 年，通用语义层会成为关键基础设施。这意味着相关支出池包括语义建模、受治理指标、内部分析、嵌入式分析和 AI grounding
              工作流；不包括原始仓库支出、通用数据集成、独立模型训练预算，以及没有受治理分析层的定制应用 UI。因此，替代集合很宽：既有 BI 里的 Power BI 和 Tableau，仓库原生语义里的 Databricks
              和 Snowflake，以及那些试图在没有共享业务模型下回答自然语言问题的直接 text-to-SQL 路径。
