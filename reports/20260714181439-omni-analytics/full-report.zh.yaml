  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Omni 公开估值材料里最强的事实，就是融资本身的跃升。Omni 官方 2026 年 4 月新闻稿和创始人信都称，公司由 ICONIQ 领投，以 $1.5B 估值融资 $120M，并配套 $30M
              员工股份回购。Yahoo/Fortune 和 Silicon Valley Daily 也佐证，公司定价约在 $1.5B 至
              $1.51B，因此名义估值足够真实，可以作为锚点。上一个锚点对一家私营公司来说也异常清楚：Omni 2025 年 3 月 Series B 帖文称，它以 $650M 估值融资
              $69M。这意味着市场在略多于一年时间里，把公司估值上调了约 2.3x。

              问题不在于是否发生了估值上调，而在于市场究竟为这次上调买了什么。Omni 创始人信称 ARR 在过去一年扩大 4x；Yahoo/Fortune 补充说 ARR 近乎四倍增长，公司在融资前一个月实现盈利，员工数约
              200。这些都是有意义的正面信号，尤其因为它们暗示的是资本效率，而不是纯靠招聘拉动的扩张。但任何公开 Series B 或 Series C 来源都没有披露绝对 ARR 分母、NRR、集中度、毛利率、现金消耗，或
              Series C 证券的经济细节。因此，公开材料足以验证真实市场价格和方向性强劲动能，却仍太薄，无法支持传统内在价值模型，也无法给出干净的公允价值点估计。
            claimRefs:
