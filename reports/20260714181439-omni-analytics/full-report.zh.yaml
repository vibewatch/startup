        - 把受控查询和管理工作流暴露到 UI 之外
        - MCP 客户端、API key 或 OAuth，以及 Omni 实例 API base URL
        - 集成能力越强，需要管理的凭证和权限面越大
      - - Git / PR 和 YAML 端点
        - 支持基于分支的模型编辑和发布控制
        - 模型分支、pull request、YAML 文件模式、checksum 校验
