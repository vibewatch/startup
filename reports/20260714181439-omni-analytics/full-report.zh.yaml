      - number: '1.4'
        title: 里程碑、控制和负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司从商业智能有步骤地扩展到 AI 基础设施。2022 年发布公告把 Omni
              定位为灵活分析与企业治理之间的桥梁。此后的产品、文档和演示页面显示，平台沿三条线拓宽：更深的建模和仓库支持、面向客户的嵌入式分析，以及 Blobby、MCP 连接、按用户 API token、AI session
              history、Snowflake Cortex 模型选择、agentic query API 等 AI 接口。结果是一家公司，其产品时间线与当前“面向 AI 的语义层”叙事吻合，而不是把 AI
              话术硬套到一个未变的 BI 产品上。


              控制图景有喜有忧，但仍可投资。正面看，Omni 反复强调权限、受治理指标、基于 Git 的工作流、类似 CI/CD
              的变更管理，以及客户数据不会用于训练模型。负面看，第三方用户评论称，产品初期可能难懂，大型仪表盘可能延迟或崩溃，一些高级功能藏得较深，图表覆盖仍落后于成熟既有厂商，文档也可能落后于新版本。因此，公开证据支撑一种细致判断：Omni
              有真实技术深度和品类洞察，但在冲向独角兽估值的同时，产品易用性和完整度仍在成熟。绝对 ARR、客户数和完整董事会构成等封面指标没有支撑，应明确保持开放，而不是从叙事中猜出来。
