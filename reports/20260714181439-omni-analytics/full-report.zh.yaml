        - 可观察公开市场对高增长基础设施型公司的偏好
        - 并非 BI 或语义层业务
      - - Confluent
        - 上市可比公司
        - 2026 年 7 月市值约 $11.13B
        - 提供规模较低的现代数据平台参照
        - 工作负载和变现模式不同
      - - Multiples.vc
        - 公开市场视角
        - 2026 年 6 月软件倍数显示估值分化大，且按品类明显分层
        - 有助于划出合理倍数区间，而不是套一个任意倍数
        - 提供全市场背景，不是公司级估值
      - - PublicComps 与 BVP Cloud Index
        - 基准比较视角
        - 提供实时看板和云软件基准方法论，而非静态点估计
        - 强调可比公司分析必须纳入增长和质量
        - 无法解决 Omni 分母不透明的问题
      - - 既有厂商定价页
        - 定价背景
        - Microsoft、Tableau 和 ThoughtSpot 公开官方套餐，Omni 仍更依赖报价
        - 凸显定价上的捆绑压力和透明度压力
        - 定价页不等于实际合同价格
