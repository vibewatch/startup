        title: 资本充足性、融资和估值信号
        blocks:
          - type: paragraph
            body: >-
              尽管信息不完整，资本故事方向性强。Omni 的公开融资路径从 2022 年发布时披露的 $26.9 million，推进到 2025 年 3 月以 $650 million 估值完成 $69 million
              Series B，再到 2026 年 4 月以 $1.5 billion 估值完成 $120 million Series C，并配套 $30 million
              员工要约收购。这个台阶足够大，具备财务意义：它说明投资人看到的不只是泛 AI 热情，还有品类动能和公司特定执行。官方与转载报道也一致认为，2026 年融资由快速收入增长和企业采用扩大支撑；Yahoo 转载的
              Fortune 版本还补充了融资前刚达成的盈利里程碑。


              公开证据仍无法让投资人承保经典资本充足性栈。审阅过的来源没有披露账上现金、月度烧钱、基础情景跑道、风险债或任何类债务义务。资金用途仅高层次表述为扩展 AI 分析平台和企业采用，而非详细预算。这意味着，正确解读不是
              Omni 资本不足。考虑到 2025-2026 年已披露一级资本已有 $189 million，且还未计早期轮次，资本不足大概率不是问题。正确解读是，Omni
              有充足的头部融资支持，但公开资产负债表细节不足，无法建模下一轮时点、下行情景跑道，或增长正常化时还剩多少估值保护。
