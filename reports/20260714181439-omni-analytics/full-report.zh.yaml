companyProfile:
  summary: >-
    Omni Analytics 是一家总部位于 San Francisco 的 AI 分析公司，2022 年由 Colin Zima、Jamie Davidson 和 Chris Merrick 创立；三人的背景横跨
    Looker、Google、Stitch 和 Talend。产品围绕一层受治理的语义层展开，并在内部 BI、嵌入式分析、API、MCP 和 AI 工作流之间复用，让团队在仪表盘和代理之间保留同一个可信业务模型。自发布以来，Omni
    已从 $26.9M 的种子轮加 Series A 融资推进到估值 $1.5B 的 $120M Series C；公开牵引信号包括 2025 年有 200+ 家公司使用平台，以及 BambooHR、Checkr、Cribl、dbt
    Labs、Mercury、Pendo、Synthesia 等具名客户。
