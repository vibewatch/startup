    title: 定价 / 变现表
    columns:
      - 来源 / 方案信号
      - 价格 / 单位 / 合同
      - 标价与实际
      - 包含能力
      - 折扣 / 未知
      - 含义
    rows:
      - - Omni 官方产品页
        - 无公开标价
        - 实际定价未知
        - 语义模型、仪表盘、嵌入式分析、AI、电子表格、API
        - 席位数、模块闸口、期限和折扣未披露
        - Omni 看起来靠企业 ROI 销售，而不是透明费率卡
      - - BambooHR Elite 层级案例研究
        - 客户推出更高阶分析层级，但 Omni 抽成率不公开
        - 这是客户变现信号，不是厂商标价
        - 嵌入式分析、自助报告、权限、定制
        - 未公开拆分 BambooHR 如何为该功能定价，或 Omni 能拿到多少
        - 即便自身费率保密，Omni 也能支撑可上售的产品包装
      - - Microsoft Power BI 定价
        - 免费；Pro $14/user/month；Premium Per User $24/user/month；部分免许可证分享需要更高容量
        - 公开标价锚
        - 存量 BI 席位 + 容量和分享模型
        - 企业容量支出和实际折扣仍有差异
        - 提供低端存量预算锚，Omni 必须证明更高 ROI 才能对抗
      - - Tableau 定价
        - Viewer $15；Explorer $42；Creator $75/user/month；Cloud+ 和 Tableau+ 需联系销售
        - 公开标价 + 套餐信号
        - 基于角色的分析 + 更高阶智能体套餐
        - 企业套餐定价和折扣仍不透明
        - 即便高级套餐需定制，买家也能用已知席位经济性对标 Omni
      - - Omni 财务工作流博客
        - 无公开 SKU 价格
        - 仅是扩张界面信号
        - 实时电子表格建模、ARR 报告、月度报告
        - 未披露电子表格是否抬高 ACV，或是否需要高级包装
        - 暗示 Omni 可把钱包份额扩到财务场景，但没有公开证明实际变现
      - - 案例研究 ROI 叙事
        - 更快上线、节省工程、关停工具，而不是公开厂商标价
        - 结果代理，不是价格
        - 迁移速度、整合、产品差异化、自助服务
        - 不能直接换算为毛利或回本周期
        - 商业故事由价值牵引，必须在合同层面尽调验证
    notes: 表格把公开标价锚与价值证明分开，避免把客户 ROI 误当成 Omni 的实际收入或利润率。
