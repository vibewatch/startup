  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局和解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Omni 面对的不是一个整齐的竞争集合。买方可以用既有 BI 套件、AI 优先分析产品、语义层专家、仓库原生语义，或由开源与云原生基础组件拼成的内部栈，来解决同一件事。直接同类是 Sigma、Hex 和
              ThoughtSpot，因为它们都在推介带 AI 辅助、并带有一定受治理上下文的现代分析界面。既有厂商集合是 Looker、Tableau 和 Power
              BI，它们如今把语义、嵌入式和代理式功能包进更大的企业合同里。相邻集合是 Cube、dbt Semantic Layer 和 AtScale，它们从受治理指标层向 Omni 施压，而不要求客户完成完整经典 BI
              标准化。替代集合则包括 Databricks metric views、Snowflake semantic views，以及把仓库语义与 Metabase
              或定制应用界面组合起来的内部建设模式。这种宽度很重要，因为 Omni 的切入点只有在“一个模型贯穿 BI、嵌入式和 AI”的故事确实比这些组合更容易购买和部署时才成立。
