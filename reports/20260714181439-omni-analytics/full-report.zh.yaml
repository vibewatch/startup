            body: >-
              竞争压力同样是商业问题，而不只是技术问题。Power BI 用免费层和低价 Pro、Premium Per User 许可证锚住低端；许多买方已经有 Microsoft
              分发和身份体系，这一点很重要。Tableau 仍昂贵但熟悉，如今又把最具代理式的功能留给 Cloud+ 和 Tableau+ 套餐。Looker、Sigma、ThoughtSpot、Cube、AtScale
              以及许多面向企业的产品大多维持销售驱动定价，这能保护折扣灵活度，但也让价值比较更难。Hex 和 Metabase 展示了两种不同的现代表达：一边是按计算和 credit
              做实验，另一边是低成本开源加可选使用费。切换成本有意义，但不是绝对的。指标模型、权限、仪表盘定义和嵌入式端点都会制造迁移工作，但买方仍可多栖使用，因为语义层、前端 BI
              和应用界面越来越能跨工具连接。这降低了试用门槛，增加了套餐压力，也奖励那些能证明栈蔓延更少、而不只是功能更多的供应商。
