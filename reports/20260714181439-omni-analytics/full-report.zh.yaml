  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 结构性市场压力与估值风险
        blocks:
          - type: paragraph
            body: >-
              Omni 最难的风险是结构性的：同一波受治理语义层需求，也让更大的平台吸收更多价值。Snowflake 现在把语义概念直接存进数据库级语义视图，并把它们喂给 Cortex Analyst；Databricks
              把集中式指标视图放进 Unity Catalog，并让它们流入 Genie、仪表盘、告警和外部 BI 工具；dbt 推销一层可服务指标、嵌入式应用和 AI 工作流的语义层；Microsoft 则把 Copilot
              绑定进 Fabric 和 Power BI 容量控制，而许多企业已经授权这些产品。Cube、Holistics 和 Labs4Change 的独立比较页面都指向同一个压力模式：语义治理和对 AI
              安全的指标，已不再是一个小众楔子。在更简单的单一数据仓库部署里，原生或已经付费的技术栈可能已经足够好，即便 Omni 的架构更干净。


              这种结构性压力更重要，是因为 Omni 现在背着晚期估值，市场假设它不仅有产品新意，还能成为品类领导者并持续扩张。2026 年 4 月，公司以 $1.5B
              估值融资，伴随强劲增长说法，但公开分母仍很薄：没有经审计的公开 P&L，没有公开毛利率曲线，没有披露 NRR 或流失客群，也没有清晰的集中度披露。因此，投资人承销的不只是 Omni
              能不能赢，而是它能否在品类商品化之前，赢得足够快、足够持久，跑赢捆绑式竞争。
