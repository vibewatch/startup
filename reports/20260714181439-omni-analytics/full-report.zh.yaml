      - number: '6.3'
        title: 落地扩张动作和产品包装
        blocks:
          - type: paragraph
            body: >-
              Omni 客户故事里最有吸引力的一点，是清晰可见的落地后扩张逻辑。BambooHR 把分析能力做成可收费的产品层，而不是后台仪表盘功能；ActiveProspect 把 Create Mode
              描述为面向高参与度客户的高级产品；Brevo 则称，嵌入式分析叠加 AI 和定制化，帮助用户转化到高级套餐。WorkRamp 和 SWBC 评估 Omni
              时看的也不只是仪表盘，而是带品牌、面向客户的分析能力能否成为自身产品包装里的差异化部分。Omni 的嵌入式分析页面也强化了这种商业化叙事：它直接承诺更高定价机会、客户自助服务，以及面向客户且对 AI
              安全的部署。[CU005] [CU012] [CU017] [CU021] [CU023] [CU024]


              扩张路径也跨职能。Ordermentum 用同一个平台服务 SQL 用户、习惯电子表格的业务用户，以及自然语言 AI 工作流。Feeld 把财务和营销工作搬到同一层受治理的基础上；Checkr 和 Cribl 把
              Omni 当作人类分析和 AI 分析共用的语义底座；SWBC 的上线故事则显示，产品、客户成功和高管用户都在早期验证价值。换句话说，Omni
              在一个客户内部扩张，常常靠覆盖更多角色，而不只是增加仪表盘查看席位。风险在于，公开来源对扩张路径说得多，对已实现的扩张数学说得少：所审阅来源没有披露附加率、按客户群组的席位增长、嵌入式与内部使用的构成，或从早期试点续转为稳定企业合同的转化率。[CU019]
