evidenceGaps:
  - type: missing-source
    severity: material
    topic: absolute-arr
    missingEvidence: Absolute ARR, revenue run rate, gross margin, NRR, and burn/runway figures.
    whyItMatters: The Series C valuation cannot be underwritten on directional growth commentary alone.
    diligencePath: Request monthly SaaS KPI packs, board materials, and audited management accounts from the finance team.
    relatedQuestionRefs:
      - QO014
      - QO015
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Exact paying customer count, seat count, ACV bands, and top-customer concentration.
    whyItMatters: Named logos and migration case studies do not reveal revenue concentration or breadth of deployment.
    diligencePath: Request CRM exports, customer cohorts, top-20 account data, and product usage dashboards segmented by plan.
    relatedQuestionRefs:
      - QO017
      - QO018
  - type: missing-source
    severity: material
    topic: board-depth
    missingEvidence: Current board roster, committee structure, board observers, and executive finance/compliance coverage.
    whyItMatters: Founder-centric disclosure is acceptable only if governance depth is stronger than the public materials show.
    diligencePath: Request the current board deck, cap table governance rights, and executive org chart during management diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: headcount-precision
    missingEvidence: Exact employee count by function and geography dated within 30 days of diligence kickoff.
    whyItMatters: Headcount is the cleanest public proxy for burn, hiring discipline, and go-to-market scale after the Series C.
    diligencePath: Request payroll-backed headcount snapshots and recruiting pipeline reports.
    relatedQuestionRefs:
      - QO016
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      A full cap table, full partner inventory, and the complete customer-reference list behind the public stakeholder
      map.
    whyItMatters: The public map proves quality but not full concentration, control rights, or all material dependencies.
    diligencePath: Request the cap table, board rights summary, top-partner inventory, and formal customer reference list.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: omni-sam-som-isolation
    missingEvidence: >-
      A bottom-up public source or management disclosure that isolates Omni's true semantic-layer-plus-embedded-plus-AI
      overlap market and quantifies reachable budget by stack and company size.
    whyItMatters: Without that evidence, SAM and SOM remain analytical bounds rather than auditable market facts.
    diligencePath: >-
      Request management's TAM/SAM model, pipeline segmentation by incumbent stack, and win-rate assumptions against
      Power BI, Tableau, Snowflake, and Databricks.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: embedded-budget-ownership
    missingEvidence: >-
      Customer-level evidence on who signs, funds, and expands Omni embedded analytics deals versus internal BI
      deployments, including monetization and attach-rate data.
    whyItMatters: >-
      Embedded analytics materially broadens the buyer map, but the exact payer mix determines how large Omni's
      product-led wedge really is.
    diligencePath: >-
      Ask for closed-won embedded deal examples, pricing constructs, upsell paths, and expansion data by product-led
      versus analytics-led account.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Current Omni pricing sheets, realized discounting ranges, and sample contracted economics versus Looker, Sigma,
      ThoughtSpot, and Hex.
    whyItMatters: >-
      The public list-price corpus shows packaging direction but not whether Omni wins on total cost once enterprise
      discounts, bundle credits, or usage overages are negotiated.
    diligencePath: >-
      Request current price books, sample MSAs, and three recent deal comparisons showing starting land price, expansion
      path, and discount authority by segment.
    relatedQuestionRefs:
