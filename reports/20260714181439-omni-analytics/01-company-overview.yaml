  evidenceGaps:
  - type: missing-source
    severity: material
    topic: absolute-arr
    missingEvidence: Absolute ARR, revenue run rate, gross margin, NRR, and burn/runway figures.
    whyItMatters: The Series C valuation cannot be underwritten on directional growth commentary alone.
    diligencePath: Request monthly SaaS KPI packs, board materials, and audited management accounts from the finance team.
    relatedQuestionRefs:
    - QO014
    - QO015
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Exact paying customer count, seat count, ACV bands, and top-customer concentration.
    whyItMatters: Named logos and migration case studies do not reveal revenue concentration or breadth of deployment.
    diligencePath: Request CRM exports, customer cohorts, top-20 account data, and product usage dashboards segmented by plan.
    relatedQuestionRefs:
    - QO017
    - QO018
  - type: missing-source
    severity: material
    topic: board-depth
    missingEvidence: Current board roster, committee structure, board observers, and executive finance/compliance coverage.
    whyItMatters: Founder-centric disclosure is acceptable only if governance depth is stronger than the public materials show.
    diligencePath: Request the current board deck, cap table governance rights, and executive org chart during management diligence.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: headcount-precision
    missingEvidence: Exact employee count by function and geography dated within 30 days of diligence kickoff.
    whyItMatters: Headcount is the cleanest public proxy for burn, hiring discipline, and go-to-market scale after the Series C.
    diligencePath: Request payroll-backed headcount snapshots and recruiting pipeline reports.
    relatedQuestionRefs:
    - QO016
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: A full cap table, full partner inventory, and the complete customer-reference list behind the public stakeholder map.
    whyItMatters: The public map proves quality but not full concentration, control rights, or all material dependencies.
    diligencePath: Request the cap table, board rights summary, top-partner inventory, and formal customer reference list.
    relatedTableRefs:
    - TO003
