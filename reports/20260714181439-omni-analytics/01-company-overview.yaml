- id: milestones-controls-adverse-signals
  title: Milestones, Controls, and Adverse Signals
  body: 'The milestone record shows a company that has expanded methodically from business intelligence into AI infrastructure. The 2022 launch announcement framed Omni as the bridge between flexible analytics and enterprise governance. Product, docs, and demo pages since then show the platform widening in three directions: deeper modeling and warehouse support, customer-facing embedded analytics, and AI interfaces such as Blobby, MCP connectivity, per-user API tokens, AI session history, Snowflake Cortex model choice, and agentic query APIs. The result is a business whose product chronology lines up with its current semantic-layer-for-AI narrative rather than retrofitting AI language onto an unchanged BI product.


    The control picture is mixed but investable. On the positive side, Omni repeatedly emphasizes permissions, governed metrics, Git-based workflows, CI/CD-style change management, and the fact that customer data is not used to train models. On the negative side, third-party user reviews say the product can be hard to understand initially, large dashboards may lag or crash, some advanced features are hidden, chart coverage still trails mature incumbents, and documentation can lag new releases. Public evidence therefore supports a nuanced view: Omni has authentic technical depth and category insight, but it is still maturing product ergonomics and completeness while scaling toward a unicorn valuation. Unsupported cover metrics such as absolute ARR, customer count, and full board composition should stay explicitly open rather than guessed from the narrative.'
