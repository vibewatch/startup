      - number: '3.2'
        title: Capability and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              Omni's strongest product argument is that one governed semantic layer can serve internal BI,
              customer-facing analytics, APIs, and AI assistants without forcing teams to choose between rigid
              governance and agile analysis. That is differentiated, but no longer unique. Looker now describes agentic
              BI on top of LookML and embedded APIs; Tableau Next adds an AI-infused semantic layer above Salesforce
              data services; Power BI ties Copilot, OneLake, and Direct Lake into Fabric; ThoughtSpot pushes Spotter and
              relational search; Sigma argues AI applications should act on governed warehouse data; Hex combines
              notebooks, apps, and agents; Cube, AtScale, and dbt center the model itself. The trust story is similarly
              competitive rather than empty. Omni, Sigma, Hex, and ThoughtSpot all present enterprise security language,
              while Microsoft and Google inherit broader cloud-governance credibility. The comparison therefore turns
              less on who has any semantic or AI story at all, and more on who offers the cleanest combination of
              breadth, governance, and implementation speed for a real buyer workflow.
