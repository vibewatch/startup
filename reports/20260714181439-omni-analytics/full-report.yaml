  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Structural pressure and execution misses both flow into slower expansion, higher support burden, and valuation
      compression.
    data:
      nodes:
        - id: bundle
          label: Bundle pressure
          detail: Native semantic and AI features expand inside larger suites.
        - id: accuracy
          label: AI accuracy gap
          detail: Public proof of runtime quality is lighter than the architectural claim.
        - id: config
          label: Config complexity
          detail: Permissions, SQL paths, spreadsheets, and MCP settings need discipline.
        - id: disclosure
          label: Thin disclosure
          detail: Retention, concentration, and unit-economics denominators stay private.
        - id: quality
          label: Quality friction
          detail: Lag, crash, docs, and chart-depth complaints slow trust formation.
        - id: expansion
          label: Slower expansion
          detail: Land-and-expand motion weakens when trust or differentiation fades.
        - id: support
          label: Higher support burden
          detail: Hands-on rollout and troubleshooting consume margin and leadership attention.
        - id: valuation
          label: Valuation compression
          detail: Premium multiple narrows if growth quality or differentiation disappoints.
      edges:
        - from: bundle
          to: expansion
          label: narrows win surface
        - from: accuracy
          to: expansion
          label: weakens trust
        - from: config
          to: quality
          label: creates
        - from: quality
          to: support
          label: raises
        - from: disclosure
          to: valuation
          label: caps conviction
        - from: expansion
          to: valuation
          label: feeds
        - from: support
          to: valuation
          label: pressures
        - from: config
          to: accuracy
          label: can worsen
        - from: quality
          to: expansion
          label: slows
        - from: bundle
          to: valuation
          label: compresses multiple
