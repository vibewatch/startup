  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Monetization
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a sales-led enterprise software model with several expansion surfaces, not a
              single-seat BI tariff. Omni's own platform and embedded analytics pages show one governed semantic layer
              serving internal dashboards, workbook and spreadsheet workflows, embedded customer-facing analytics, APIs
              and MCP-style external access, and AI querying. That matters financially because it implies contract value
              can expand across deployment types rather than relying on one dashboard seat count. The strongest
              monetization proof is not a published Omni rate card, because there is none in the reviewed official
              pages. Instead, it is customer packaging evidence. BambooHR used Omni to launch an Elite analytics tier,
              and Omni's own embedded analytics page explicitly tells prospects they can create new revenue streams and
              premium pricing opportunities. Internally, Omni also markets spreadsheet-based finance workflows on live
              ERP, CRM, and HRIS data, which broadens the product surface into RevOps and finance reporting.


              The underwriting limitation is that list pricing is missing while buyer budget anchors are not. Official
              Omni pages remain opaque on price realization, discounting, module gating, and whether AI or embedded
              workflows are bundled or separately monetized. By contrast, Microsoft and Tableau publish seat and bundle
              anchors that let buyers benchmark Omni against incumbent alternatives even if those incumbents do not
              reveal realized enterprise discounts. So the financial read-through is clear: Omni appears to monetize
              through higher-value platform contracts, embedded analytics, and workflow expansion, but the public record
              still cannot say what the starting price, average contract value, or expansion mechanics actually are.
