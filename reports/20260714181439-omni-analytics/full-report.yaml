      - number: '7.4'
        title: Customer-quality opacity and execution-capacity risk
        blocks:
          - type: paragraph
            body: >-
              The customer story is credible enough to prove real demand, but still too opaque to prove revenue
              durability. Omni's public case-study set is impressive on deployment speed and usage ambition: BambooHR
              launched an Elite analytics tier quickly and grew to 100,000+ downstream users, Checkr treated Omni as a
              governed AI context layer, and the broader case-study library emphasizes migration speed, support, and
              embedded value. Those are useful signals because they show the product is in production and can matter
              strategically to customers. But they do not answer the questions that matter most at a $1.5B valuation:
              How many customers renew? What is NRR or GRR? How concentrated is revenue in a handful of flagship logos?
              How much expansion comes from internal BI versus embedded analytics versus AI workflows?


              Execution risk follows naturally from that opacity. Support and onboarding are part of the product in a
              semantic-layer category because value depends on model quality, permissions, data contracts, and buyer
              education. A thin public review base and mixed review complaints around hidden advanced features,
              dashboard instability, and documentation lag make it hard to tell whether product quality scales cleanly
              across the long tail of accounts or whether Omni still wins partly because the team is unusually hands-on
              with early adopters. That is manageable in growth mode, but it becomes more material as the company tries
              to defend both valuation and category leadership against larger suites.
