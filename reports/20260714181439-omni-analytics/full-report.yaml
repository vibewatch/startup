      - number: '6.3'
        title: Land-and-expand motion and product packaging
        blocks:
          - type: paragraph
            body: >-
              The most attractive part of Omni's customer story is the visible land-and-expand logic. BambooHR treated
              analytics as a monetizable product tier rather than a back-office dashboard feature, ActiveProspect
              described Create Mode as a premium offering for its most engaged customers, and Brevo said embedded
              analytics plus AI and customization helped conversion to premium tiers. WorkRamp and SWBC both evaluated
              Omni not just on dashboarding but on whether branded, customer-facing analytics could become a
              differentiated part of their own product packaging. Omni's embedded analytics page reinforces that
              commercialization framing by explicitly promising premium pricing opportunities, customer self-service,
              and AI-safe customer-facing deployments. [CU005] [CU012] [CU017] [CU021] [CU023] [CU024]


              The expansion path is also cross-functional. Ordermentum used one platform for SQL users,
              spreadsheet-native business users, and natural-language AI workflows. Feeld moved finance and marketing
              work onto the same governed layer; Checkr and Cribl treated Omni as a semantic foundation for both human
              and AI analysis; and SWBC's onboarding story shows product, customer success, and executive users all
              testing value early. In other words, Omni often expands inside a logo by spanning roles rather than only
              adding dashboard viewers. The risk is that public sources say much more about the expansion path than the
              realized expansion math: no reviewed source discloses attach rate, seat growth by cohort,
              embedded-versus-internal mix, or renewal conversion from early pilots to durable enterprise contracts.
