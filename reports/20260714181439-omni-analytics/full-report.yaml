            Omni's true overlap market
        - id: sam
          label: 'SAM — Omni-relevant overlap: ~$1.0B-$4.0B (2026 est.)'
          detail: >-
            Directional analytical range bounded between narrow semantic-layer software and broader governed BI /
            embedded / AI-control-plane budgets
        - id: som
          label: 'SOM — near-term reachable wedge: ~$0.2B-$0.8B'
          detail: Accounts that need one governed model across BI, embedded analytics, and AI rather than native point tools
