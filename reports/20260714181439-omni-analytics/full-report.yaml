              Omni's customer proof is good enough to establish real adoption, but not good enough to underwrite
              concentration or retention. Public sources disclose logo names, rollout speed, downstream-user counts in a
              few embedded deployments, and directional scale claims such as 200+ companies. They do not disclose exact
              customer count, embedded-versus-internal deployment mix, NRR, GRR, churn, contract length, renewal
              cohorts, or top-customer concentration. That omission matters because many of the most impressive public
              stories are exactly the kind of flagship deployments—BambooHR, WorkRamp, ActiveProspect, SWBC—that can
              create an attractive narrative while still leaving revenue quality opaque. [CU011] [CU023] [CU032] [CU033]
