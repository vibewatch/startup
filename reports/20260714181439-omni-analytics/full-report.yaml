  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The decision path runs from a credible private-market mark through denominator opacity and bundle risk to a Track
      stance.
    data:
      nodes:
        - id: price
          label: $1.5B price anchor
          detail: Series C mark is corroborated
        - id: proof
          label: Real momentum
          detail: 4x ARR commentary, profitability, ~200 employees
        - id: opacity
          label: Missing denominator
          detail: ARR, retention, margin, concentration, and terms are undisclosed
        - id: bundle
          label: Bundle risk
          detail: Snowflake, Databricks, dbt, and Microsoft narrow scarcity
        - id: outcome
          label: Track
          detail: Fair to stretched until diligence closes the gaps
      edges:
        - from: price
          to: proof
          label: supports further work
        - from: proof
          to: opacity
          label: offset by
        - from: opacity
          to: bundle
          label: amplifies
        - from: bundle
          to: outcome
          label: leads to
    claimRefs:
      - CV010
      - CV019
      - CV021
      - CV028
      - CV050
      - CV051
      - CV052
      - CV056
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      A fixed $1.5B price implies very different ARR thresholds depending on which revenue multiple ultimately proves
      defensible.
    data:
      items:
        - label: 20x revenue
          value: 75
        - label: 15x revenue
          value: 100
        - label: 12x revenue
          value: 125
        - label: 10x revenue
          value: 150
        - label: 8x revenue
          value: 187.5
        - label: 7x revenue
          value: 214.3
      yAxis:
        label: ARR or revenue needed for $1.5B (USD M)
    approximationNotes: >-
      Values are reverse-engineered thresholds from $1.5B divided by each multiple; they are scenario tools, not
      disclosed Omni metrics.
    claimRefs:
      - CV029
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The supportable multiple band narrows sharply as evidence quality weakens, even before any downside from structure
      or concentration is applied.
    data:
      items:
        - label: Bull support band
          low: 15
          mid: 17
          high: 20
          detail: Works only if ARR scale and retention already look premium
        - label: Base support band
          low: 10
          mid: 11
          high: 12
          detail: Assumes real growth plus meaningful opacity and competition discounts
        - label: Bear support band
          low: 7
          mid: 8
          high: 9
          detail: Reflects bundle pressure
          weaker quality: null
          or a smaller hidden denominator: null
    approximationNotes: >-
      The figure shows supportable revenue-multiple bands, not a point estimate of equity value, because the current
      price is fixed while the missing denominator is not.
    claimRefs:
      - CV029
      - CV038
      - CV051
      - CV052
      - CV054
      - CV055
