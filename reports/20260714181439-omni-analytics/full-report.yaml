    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Stage
        blocks:
          - type: paragraph
            body: >-
              Omni consistently presents itself as an AI analytics platform rather than a point BI add-on. Across its
              homepage, platform pages, AI documentation, and April 2026 fundraising materials, the core promise is the
              same: turn company data into a trusted source of truth for AI and analytics by placing a governed semantic
              model between raw warehouse data and downstream users or agents. The company says users can ask questions
              in natural language, refine the answer in workbooks, switch into SQL or spreadsheet-style formulas, and
              then reuse the same governed logic across dashboards, embedded analytics, APIs, and MCP-connected external
              AI tools. That product framing matters because it makes Omni more than a dashboarding replacement; it is
              selling a control layer for AI-era data interpretation.


              The public company identity is also unusually clear for a private infrastructure startup. Omni’s official
              About page says the founders reunited in 2022 after prior careers at Looker, Google, Stitch, and Talend,
              while multiple third-party profiles place headquarters in San Francisco. The same official pages show a
              multi-hub operating footprint spanning San Francisco, Santa Cruz, Philadelphia, Toronto, Dublin, and
              Sydney, which is consistent with current hiring across support and sales roles in North America, Europe,
              and Australia. Taken together, the evidence supports a late-stage private company identity: founder-led,
              enterprise-facing, already global in go-to-market coverage, and architected around a semantic-layer thesis
              that management now explicitly ties to AI-agent reliability.
