  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Price Anchor and Disclosure Gap
        blocks:
          - type: paragraph
            body: >-
              The strongest fact in Omni's public valuation file is the financing step-up itself. Omni's official April
              2026 press release and founder letter both state that the company raised $120M at a $1.5B valuation, led
              by ICONIQ, and paired the round with a $30M employee tender. Yahoo/Fortune and Silicon Valley Daily
              corroborate that the company was being priced around $1.5B to $1.51B, so the headline valuation is real
              enough to use as an anchor. The prior anchor is also unusually clear for a private company: Omni's March
              2025 Series B post said it raised $69M at a $650M valuation. That means the market marked the company up
              by roughly 2.3x in a little over a year.

              The problem is not whether a markup happened; it is what the markup was actually buying. Omni's founder
              letter says ARR scaled 4x over the prior year, and Yahoo/Fortune adds that ARR grew nearly fourfold, the
              company hit profitability in the month before the round, and headcount was roughly 200. Those are
              meaningful positives, especially because they suggest capital efficiency rather than pure hiring-led
              expansion. But none of the public Series B or Series C sources discloses the absolute ARR denominator,
              NRR, concentration, gross margin, burn, or the economic details of the Series C security. So the public
              file is good enough to verify a real market price and directionally strong momentum, yet still too thin to
              support a traditional intrinsic model or a clean point estimate on fair value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV007
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV010
      - number: '8.2'
        title: Comparable Context, Pricing, and Bundle Risk
        blocks:
          - type: paragraph
            body: >-
              Omni's valuation case has to be framed against both monetization evidence and category crowding. On the
              positive side, Omni presents a platform that spans internal analytics, governed metrics, customer-facing
              analytics, and AI workflows. Its embedded analytics page explicitly says customers can create new revenue
              streams and premium pricing opportunities, which is important because it implies the product can support a
              platform contract rather than a narrow dashboard seat sale. Vendr's 2026 pricing summary also suggests
              Omni is priced as enterprise software rather than lightweight self-serve BI: seats, tiering, contract
              term, and deployment shape all matter, and enterprise pricing is still quote-based.

              The negative side is that pricing opacity and bundle risk remain real. Microsoft, Tableau, and ThoughtSpot
              all publish official pricing pages, while Omni's public pages do not disclose a comparable enterprise
              price sheet. More importantly, the semantic-layer market is no longer scarce. Basedash, Atlan, and TypeDef
              AI all describe a 2026 landscape with multiple viable approaches, while Snowflake, Databricks, and dbt
              each market native or tightly integrated semantic-layer capabilities. Snowflake now stores business
              concepts directly in Semantic Views, Databricks governs standardized metrics through Unity Catalog metric
              views, and dbt sells a define-once metric layer across tools. That does not mean Omni is undifferentiated;
              its embedded and AI positioning is real. It does mean investors should not pay a scarcity premium as if
              governed metrics and AI-safe semantics were available from only one vendor.

              Public market context reinforces the same caution. Multiples.vc says June 2026 software valuations are
              highly segmented and heavily influenced by AI relevance and technical depth, while PublicComps and the BVP
              Emerging Cloud Index function as living benchmarks rather than single-number answers. Datadog's Q1 2026
              results and July 2026 market-cap snapshots for Datadog, Snowflake, MongoDB, Confluent, and Cloudflare show
              the scale mismatch clearly: the best public analytics and data-platform comps are vastly larger, more
              disclosed, and more diversified than Omni. They are useful for setting plausible boundary conditions, but
              not for pretending Omni deserves the same multiple without a private-company opacity haircut.
