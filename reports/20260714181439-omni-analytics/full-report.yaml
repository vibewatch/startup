      - number: '4.3'
        title: Capital Adequacy, Funding, and Valuation Signals
        blocks:
          - type: paragraph
            body: >-
              The capital story is directionally strong even though it is incomplete. Omni's public financing path moved
              from $26.9 million disclosed at launch in 2022 to a $69 million Series B at a $650 million valuation in
              March 2025, then to a $120 million Series C at a $1.5 billion valuation in April 2026 with a $30 million
              employee tender offer. That step-up is large enough to matter financially: it suggests investors saw both
              category momentum and company-specific execution, not just generic AI enthusiasm. Official and syndicated
              coverage also agree that the 2026 round was justified by rapid revenue growth and growing enterprise
              adoption, while Yahoo's Fortune-syndicated version adds a profitability milestone just before the raise.


              What investors still cannot underwrite from public evidence is the classic capital-adequacy stack. No
              reviewed source discloses cash on hand, monthly burn, base-case runway, venture debt, or any debt-like
              obligations. Planned use of funds is framed at a high level around scaling the AI analytics platform and
              enterprise adoption, not a detailed budget. That means the right interpretation is not that Omni is
              undercapitalized. It probably is not, given the $189 million of disclosed 2025-2026 primary capital before
              earlier rounds. The correct interpretation is that Omni has ample headline financing support but
              insufficient public balance-sheet detail to model next-round timing, downside runway, or how much
              valuation protection exists if growth normalizes.
