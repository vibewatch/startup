            body: >-
              The core user workflow is flexible but still opinionated. Omni documents several entry points into
              analysis: a standalone Omni Agent, a Workbook Agent, point-and-click workbook exploration, editable Omni
              SQL, direct SQL tabs, uploads, and spreadsheet tabs. The important implementation detail is that the AI
              path is model-aware rather than raw-SQL-first. Omni says the agent plans actions, generates semantic
              queries through the shared model, translates those into SQL, and lets the user inspect the SQL in a
              workbook. That gives the product a stronger governance story than many AI overlays, but the flexibility
              has limits. SQL tabs bypass the model entirely, and spreadsheet tabs stay excellent for live connected
              Excel-style workflows while remaining second-class for governance because spreadsheet-only logic cannot
              flow back into the shared model or other queries. This makes Omni strongest when teams know which work
              belongs in shared semantic definitions versus ad hoc workbook or spreadsheet space.
