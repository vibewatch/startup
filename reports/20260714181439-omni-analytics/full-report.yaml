  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - Missing private metric
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Absolute ARR and trailing revenue
        - Prevents valuation-multiple work, cohort sizing, and denominator-based growth analysis
        - Request board KPI pack or monthly revenue bridge with current ARR, TTM revenue, and quarter-end history
      - - Gross margin by product line
        - Blocks judgment on whether Omni behaves like high-margin software or a heavier deployment-and-support model
        - >-
          Request GAAP gross margin plus split between core platform, support/services, and any embedded or AI-heavy
          workloads
      - - Cash balance, burn, and runway
        - Makes capital-adequacy analysis conditional despite strong fundraising support
        - Request latest balance sheet, monthly cash burn, and base/downside runway model
      - - ACV, contract structure, and discounting
        - Without list-to-realized pricing data, revenue quality and payback cannot be tested
        - Review recent contracts showing term length, seats or usage, embedded entitlements, and discount policy
      - - NRR, churn, and customer concentration
        - Hides whether adoption expands efficiently and whether revenue rests on a few large logos
        - Request cohort retention tables, top-10 revenue share, and gross logo churn by segment
      - - Implementation and support economics
        - Customer success intensity may be a margin driver, especially in complex embedded or migration cases
        - Request onboarding effort, solutions-engineering involvement, and services gross margin if applicable
      - - Embedded and AI revenue contribution
        - The strategic narrative is expansion-heavy, but the revenue mix is unknown
        - Break out bookings and ARR from embedded analytics, spreadsheets, APIs, and AI-related features
    notes: These are the minimum missing fields needed to move from directional analysis to a defensible underwriting model.
