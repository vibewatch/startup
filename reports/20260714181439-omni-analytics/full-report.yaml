  - id: TP004
    title: Switching cost / multi-homing table
    columns:
      - Layer
      - What creates stickiness
      - What can still multi-home
      - Evidence signal
      - Implication for Omni
    rows:
      - - Semantic model
        - Metric definitions, joins, permissions, and business vocabulary accumulate institutional knowledge
        - External BI tools and apps can often point at the same or a new semantic layer during migration
        - >-
          Cube, dbt, Databricks, and Snowflake all describe reusable governed definitions rather than monolithic front
          ends
        - Winning the semantic layer helps, but does not automatically lock the full analytics stack
      - - Dashboards / workbooks / liveboards
        - Report logic, filters, alerting, and user habits are tedious to rebuild
        - Teams can still run parallel BI fronts during transition
        - Metabase docs, ThoughtSpot, Tableau, and Power BI all assume ongoing dashboard and report workflows
        - Replacement sales face migration friction but not impossible technical lock-in
      - - Embedded analytics
        - Customer-facing reports, branding, and permission mapping are costly to re-implement
        - APIs and iframes let some buyers trial alternatives without total rewrite
        - Omni, Looker, Power BI, Metabase, Hex, and Cube all surface embedded paths
        - Embedded deployments are Omni’s best chance to create stronger operational stickiness than BI-only use cases
      - - AI / chat experiences
        - Prompt patterns, trust tuning, and model context improve with use
        - Assistant layers can move faster than dashboard or warehouse migrations
        - Omni, Looker, Power BI, ThoughtSpot, Hex, Cube, Snowflake, and Databricks all pitch natural-language analytics
        - AI interfaces are becoming portable enough that speed and trust matter more than novelty
      - - Identity / governance integration
        - SAML, group mapping, row-level rules, and audit expectations deter reckless tool churn
        - Existing cloud identity can still extend to new apps quickly
        - Omni, Hex, ThoughtSpot, Metabase, Microsoft, and Google all emphasize governance hooks
        - Incumbents keep an advantage wherever identity and compliance are already centralized
      - - Warehouse-native semantics + internal build
        - Keeping definitions in the warehouse minimizes new moving parts
        - A lightweight front end like Metabase can be swapped or complemented
        - >-
          Databricks and Snowflake both expose semantics outward to external BI tools; Metabase and custom apps can sit
          on top
        - This is the cleanest low-cash multi-home path and the clearest medium-term moat threat to Omni
    notes: >-
      The table focuses on operational stickiness rather than legal contract lock-in; migration effort is real, but the
      2026 source set repeatedly shows architectures that let buyers mix semantic, BI, and application layers.
    claimRefs:
      - CP023
      - CP025
      - CP029
      - CP030
      - CP034
      - CP036
      - CP039
  - id: TP005
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Supporting evidence
      - Main threat
      - Severity
      - Why it could break
      - Diligence ask
    rows:
      - - Unified model across BI, embedded, and AI
        - Omni product and docs show one governed surface reused across all three
        - Incumbents add the same layers inside larger suites
        - High
        - Looker, Tableau Next, Power BI/Fabric, and ThoughtSpot are already marketing agentic and semantic breadth
        - Request recent competitive win-loss notes by replacement target and deployment scope
      - - AI trust grounded in semantics
        - Omni and many rivals now frame semantics as the control plane for trustworthy AI
        - Narrative commoditization
        - High
        - Databricks, Snowflake, AtScale, Cube, dbt, and incumbents all use similar trusted-semantic language
        - Ask for measured answer-quality or adoption deltas versus legacy BI and warehouse-native alternatives
      - - Embedded analytics as a sticky wedge
        - Omni, Cube, Metabase, Hex, Looker, and Power BI all offer embedded paths
        - Embedded becomes table stakes
        - Medium
        - >-
          API and iframe delivery are now common, so distribution and implementation speed matter more than existence of
          embed features
        - Request attach rate and renewal data for embedded customers versus internal BI-only customers
      - - Enterprise trust / compliance posture
        - Omni has a credible security page and feature list
        - Cloud-platform incumbents inherit larger compliance ecosystems
        - Medium
        - Security becomes necessary but not differentiating when every shortlisted tool offers strong controls
        - Ask buyers which specific compliance objections Omni wins or loses versus Microsoft, Google, and Salesforce
      - - Warehouse-neutral flexibility
        - Omni sits above warehouse data and avoids forcing warehouse-native lock-in
        - Warehouse-native semantics reduce need for another layer
        - High
        - >-
          Databricks metric views and Snowflake semantic views keep logic closer to the data while still serving
          external tools
        - Request migration evidence from Databricks- or Snowflake-standardized accounts
      - - Cost of replacing incumbent dashboards
        - Reviewer evidence says incumbents can be costly or frustrating
        - Incumbent users may still tolerate pain because of distribution and familiarity
        - Medium
        - Bad UX alone rarely causes migration if the stack is already paid for and governed
        - Ask for proof of time-to-value and rebuild speed relative to Power BI and Tableau replacements
      - - Status-quo internal build is too hard for most buyers
        - Metabase plus warehouse-native semantics requires more engineering than buying Omni
        - Engineering-heavy buyers may prefer lower cash spend
        - Medium
        - For technical teams, internal build can be good enough and cheaper in year one
        - Request profile of customer wins where Omni beat Metabase/custom build on total cost and implementation risk
      - - Execution moat
        - Public evidence supports a real wedge but not decisive lock-in
        - Failure to translate product breadth into repeatable commercial wins
        - High
        - The public corpus lacks realized pricing, migration friction, and usage depth data for many new AI features
        - >-
          Prioritize diligence on pricing realization, switching cost, product adoption, and expansion by deployment
          type
    notes: >-
      Severity reflects risk to durable pricing power and replacement economics, not to category existence; the table
      emphasizes the evidence that most directly weakens or supports long-term defensibility.
