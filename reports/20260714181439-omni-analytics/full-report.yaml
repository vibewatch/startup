  - id: FO001
    title: Omni milestone and financing timeline
    type: timeline
    summary: >-
      Omni’s public story compresses a 2022 launch, 2025 growth-equity validation, and 2026 unicorn round into just over
      four years, with product and AI milestones tracking the capital curve.
