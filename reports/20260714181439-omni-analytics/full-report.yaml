  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Omni sits at the intersection of warehouses, transformation, AI clients, embedded hosts, and customer-admin
      configuration.
    data:
      nodes:
        - id: aws
          label: AWS / IdP
          detail: Infrastructure, storage, and identity boundary.
        - id: snowflake
          label: Snowflake
          detail: Native semantic views and Cortex Analyst path.
        - id: databricks
          label: Databricks
          detail: Unity Catalog metric views and Genie path.
        - id: dbt
          label: dbt
          detail: Metadata, models, and a competing semantic layer.
        - id: ai
          label: External AI clients
          detail: Claude, ChatGPT, Cursor, VS Code, and other MCP consumers.
        - id: admins
          label: Customer admins
          detail: Permissions, PATs, embeds, and rollout discipline.
        - id: hosts
          label: Embedded host apps
          detail: Product UX, branding, and tenant context.
        - id: omni
          label: Omni core platform
          detail: Semantic model, workbooks, APIs, and agent layer.
        - id: cust
          label: Enterprise customers
          detail: Buyers deciding whether Omni is a core control plane or an optional layer.
      edges:
        - from: aws
          to: omni
        - from: snowflake
          to: omni
        - from: databricks
          to: omni
        - from: dbt
          to: omni
        - from: ai
          to: omni
        - from: admins
          to: omni
        - from: hosts
          to: omni
        - from: omni
          to: cust
        - from: snowflake
          to: cust
        - from: databricks
          to: cust
    approximationNotes: >-
      The map highlights the highest-leverage dependency nodes rather than every integration or go-to-market
      relationship in the source set.
