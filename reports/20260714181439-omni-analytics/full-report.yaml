        title: Semantic layer and product surface
        blocks:
          - type: paragraph
            body: >-
              Omni's product thesis is unusually explicit: the semantic layer is not a back-office modeling convenience
              but the shared control plane for BI, embedded analytics, APIs, MCP, and AI. The official site repeatedly
              positions the model as the place where experts define metrics and business logic so that downstream users
              can ask questions, iterate, and keep exploring without re-encoding definitions in every surface.
              Independent comparison coverage is directionally consistent with that framing. Holistics describes a
              layered YAML model with schema, shared, and workbook tiers, while TrustRadius emphasizes the mix of
              shared-model consistency and SQL freedom. The practical takeaway is that Omni is selling one governed
              model reused across many interfaces, not separate products duct-taped together. That is a meaningful
              architectural distinction versus tools where AI, embedded, and semantic governance live in separate
              subsystems.
