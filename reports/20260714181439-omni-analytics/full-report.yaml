      - number: '3.3'
        title: Pricing, Packaging, Switching, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Competitive pressure is just as much commercial as technical. Power BI anchors the low end with a free
              tier and inexpensive Pro and Premium Per User licenses, which matters because many buyers already have
              Microsoft distribution and identity in place. Tableau remains expensive but familiar, and now reserves its
              most agentic features for Cloud+ and Tableau+ bundles. Looker, Sigma, ThoughtSpot, Cube, AtScale, and many
              enterprise-focused products keep pricing mostly sales-led, which can protect discounting flexibility but
              also makes value comparison harder. Hex and Metabase show two different modern alternatives: compute- and
              credit-based experimentation on one side, and low-cost open source plus optional usage fees on the other.
              The switching-cost profile is meaningful but not absolute. Metric models, permissions, dashboard
              definitions, and embedded endpoints all create migration work, yet buyers can still multi-home because
              semantic layers, front-end BI, and application surfaces increasingly connect across tools. That lowers the
              bar for trial, increases bundle pressure, and rewards vendors that can prove lower stack sprawl rather
              than simply more features.
