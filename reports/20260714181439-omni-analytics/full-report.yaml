  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Omni does not face one tidy competitor set. The buyer can solve the same job with incumbent BI suites,
              AI-first analytics products, semantic-layer specialists, warehouse-native semantics, or an internal stack
              stitched together from open source and native cloud primitives. The direct peer set is Sigma, Hex, and
              ThoughtSpot because each pitches a modern analytics interface with AI assistance and some degree of
              governed context. The incumbent set is Looker, Tableau, and Power BI, which now wrap semantic, embedded,
              and agentic features inside much larger enterprise contracts. The adjacent set is Cube, dbt Semantic
              Layer, and AtScale, which pressure Omni from the governed-metrics layer without requiring a full classic
              BI standardization. The substitute set is Databricks metric views, Snowflake semantic views, and internal
              build patterns that pair warehouse semantics with Metabase or bespoke application surfaces. That breadth
              matters because Omni's wedge is real only if its one-model-across-BI-embedded-and-AI story is materially
              easier to buy and deploy than those mixes.
