companyProfile:
  summary: >-
    Omni Analytics is a San Francisco-based AI analytics company founded in 2022 by Colin Zima, Jamie Davidson, and
    Chris Merrick, whose backgrounds span Looker, Google, Stitch, and Talend. The product centers on a governed semantic
    layer reused across internal BI, embedded analytics, APIs, MCP, and AI workflows so teams can keep one trusted
    business model across dashboards and agents. Since launch, Omni has progressed from a $26.9M seed-plus-Series-A
    financing to a $120M Series C at a $1.5B valuation, with public traction signals including 200+ companies using the
    platform in 2025 and named customers such as BambooHR, Checkr, Cribl, dbt Labs, Mercury, Pendo, and Synthesia.
