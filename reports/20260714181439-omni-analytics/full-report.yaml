    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      Omni sits between a narrow published semantic-layer software market and a much broader incumbent
      analytics-platform budget pool, so the investable lens is an overlap range rather than a single TAM statistic.
    data:
      nodes:
        - id: tam
