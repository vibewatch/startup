      - number: '1.3'
        title: Funding History, Traction, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Omni’s capital formation has accelerated quickly. The August 2022 launch announcement disclosed $26.9M
              across a $17.5M Series A led by Redpoint and a $9.4M seed led by First Round, with GV, Box Group, Quiet,
              Scribble, and more than 100 angels participating. By March 2025, ICONIQ was publicly positioning itself as
              the Series B lead, describing strong adoption and over 200 companies on the platform. One year later, Omni
              announced a $120M Series C at a $1.5B valuation led by ICONIQ with Theory Ventures, First Round Capital,
              Redpoint Ventures, and GV participating, plus a $30M employee tender. Third-party funding databases
              indicate the company’s disclosed lifetime funding had reached roughly $236M by April 2026 and place the
              prior valuation at $650M in March 2025, implying a sharp mark-up into the current round.


              Traction disclosure is directionally strong even though the company withholds the absolute ARR base. The
              Series C materials say ARR grew 4x over the prior year, while Business Wire says revenue tripled year to
              date after that earlier 4x growth. Fortune’s April 2026 profile adds that Omni hit profitability the month
              before the round and employed roughly 200 people. Customer proof is unusually concrete: Omni and its
              investors name BambooHR, Checkr, Cribl, dbt Labs, Guitar Center, Heidi AI, Mercury, Pendo, Synthesia,
              Perplexity, Writer, and BuzzFeed, and customer pages quantify migration speed, dashboard rebuilds, and
              deployment scale. The capital stack, customer logos, and reference architectures together support a
              legitimate late-stage enterprise software trajectory rather than a purely narrative AI financing.
