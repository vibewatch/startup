  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and deployment archetypes
        blocks:
          - type: paragraph
            body: >-
              Omni's public customer set is not concentrated in one buyer persona or one deployment style. The strongest
              repeated pattern is a data, analytics, or product leader buying a governed analytics layer that serves
              both internal teams and downstream end users. ActiveProspect explicitly wanted one platform for embedded
              analytics and internal BI, Brevo consolidated five internal BI tools plus customer-facing reporting, and
              SWBC evaluated Omni as one platform for internal and client-facing reporting. Product and data teams also
              show up together in the buying motion: BambooHR framed analytics as a product-tier decision, WorkRamp
              optimized for thousands of external users without downtime, and Checkr and Cribl used Omni as a governed
              AI-and-analytics foundation for internal self-service. The logo set spans HR software, marketing
              automation, security, background checks, hospitality ordering, consumer apps, and ecommerce, while
              investor and press sources add broader names such as Perplexity, Writer, BuzzFeed, Mercury, Pendo, and
              Guitar Center. [CU002] [CU006] [CU010] [CU011] [CU015] [CU016] [CU020] [CU021] [CU023] [CU027] [CU028]
              [CU031] [CU032] [CU033] [CU034]


              The practical segmentation split is therefore three-way rather than binary. First are internal-BI
              deployments centered on self-service, governed metrics, and AI-assisted analysis for business teams, shown
              by Caraway, Feeld, Cribl, and Checkr. Second are hybrid deployments where the same semantic layer supports
