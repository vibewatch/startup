      - number: '6.2'
        title: Named proof, implementation speed, and deployment quality
        blocks:
          - type: paragraph
            body: >-
              Omni's named customer proof is unusually concrete for a private analytics platform. ActiveProspect rebuilt
              customer-facing dashboards in less than two weeks and increased internal BI adoption by 90%. BambooHR
              launched an Elite Analytics tier to 30,000+ people in four months and later scaled that footprint to
              100,000+ users. Ordermentum consolidated Metabase, Tableau, and Looker into Omni in under two months;
              WorkRamp relaunched its customer-facing reporting in less than three months with zero downtime; SWBC moved
              internal executive, product, and sales users onto governed self-service in under six months; and Cribl
              fully migrated in three months after rebuilding roughly 100 dashboards in five weeks. Even where the proof
              is more internal than external, Feeld, Caraway, Checkr, and Cribl still show that Omni is being used in
              production analytics environments rather than as a demo-only layer. [CU007] [CU008] [CU011] [CU014]
              [CU018] [CU020] [CU023] [CU026] [CU027] [CU029] [CU031]


              The caveat is source independence. Most high-signal logo proof comes from Omni's own case-study corpus or
              company-amplified press, not from customer-issued blog posts or procurement records. BusinessWire and
              Yahoo help corroborate some cases, and the ICONIQ piece broadens the public logo set, but the balance
              still tilts toward company-published evidence. That means investors can take the implementation-speed and
              deployment-mode claims seriously, yet should still distinguish between verified named production use and
              independently proven revenue durability. Public evidence says Omni gets deployed quickly and across real
              logos; it does not yet show how many of those logos renew, expand, or represent material ARR. [CU022]
              [CU029] [CU032] [CU033] [CU035] [CU038] [CU045]
