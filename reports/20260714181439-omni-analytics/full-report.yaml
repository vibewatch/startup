            body: >-
              The strongest public evidence on Omni's trust model is concrete rather than aspirational. Content settings
              can force pull-request publication, disable risky document actions, and restrict what lower-permission
              users can do. SQL creation and SQL-result visibility are explicitly fenced to higher-permission roles,
              while viewer workbook access excludes SQL tabs and non-topic tabs. On the operational side, Omni states
