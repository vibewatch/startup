      - number: '6.4'
        title: Independent review signals, support, and onboarding implications
        blocks:
          - type: paragraph
            body: >-
              Independent evidence is directionally supportive but materially thinner than the official case-study
              stack. TrustRadius scores Omni 8.6/10 from only two reviews, while AWS Marketplace shows 4.8/5 across 65
              syndicated G2 reviews. Those reviews consistently praise flexible dashboards, governed metrics,
              SQL-plus-spreadsheet workflows, and responsive support. They also add practical buyer color that the
              official case studies downplay: some users found the build process hard to understand at first, some large
              dashboards lagged or crashed, some chart types still required code, and documentation sometimes lagged
              recent releases. A B2B2C-style reviewer also complained that per-seat economics can be awkward when
              thousands of end users only access analytics occasionally. [CU035] [CU036] [CU037] [CU038] [CU039]


              Those review patterns line up with the implementation stories. Larger or more regulated customers such as
              BambooHR and SWBC highlighted permissions, load testing, product onboarding, and strategic vendor support.
              Cribl and Checkr emphasized context engineering, model governance, and change-management loops rather than
              just dashboard migration. Spicy Data's embedded implementation writeup is especially useful because it
              confirms why Omni wins some customer-facing use cases—Git/dbt workflow, lineage, flexible licensing—while
              also surfacing the real operational trade-offs of a newer platform, including evolving interfaces and a
              still-growing chart library. Net: onboarding and support appear to be part of the product, not an
              afterthought, but buyers should expect model design and rollout discipline to matter. [CU013] [CU022]
