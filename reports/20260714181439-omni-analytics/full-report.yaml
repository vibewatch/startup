      - number: '8.3'
        title: Scenario Math and Risk Haircuts
        blocks:
          - type: paragraph
            body: >-
              Because Omni does not disclose absolute ARR, the most honest way to evaluate $1.5B is to invert the
              revenue-multiple math instead of asserting a fair value that the evidence cannot support. At 20x revenue,
              the current price implies only about $75M of ARR or revenue. At 15x it implies about $100M. At 12x it
              implies about $125M. At 10x it implies about $150M, and at 8x to 7x it implies roughly $188M to $214M.
              Those thresholds are useful because they show how sensitive the conclusion is to a denominator investors
              cannot currently see. If Omni is already above roughly $100M of high-retention ARR with durable embedded
              monetization and decent gross margin, $1.5B can fit a premium analytics narrative. If the real base is
              materially smaller, the valuation starts to look much fuller.

              The haircut logic also cuts both ways. Profitability commentary, a roughly 200-person team, and proof that
              Omni helps customers build monetizable analytics products all support paying more than a commodity BI-tool
              multiple. But pricing opacity, weak public disclosure on retention and concentration, and the growing
              availability of bundled semantic layers all argue for shaving turns off any pristine AI-platform multiple.
              Reviews add another modest haircut: G2 and AWS Marketplace feedback is generally positive, yet it still
              flags learning-curve costs, feature gaps, documentation lag, and performance softness on bigger
              dashboards. In other words, the public file supports a meaningful premium to ordinary dashboard software,
              but not a heroic premium that assumes zero execution friction and zero bundle pressure.
