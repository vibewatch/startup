chapter:
  number: 3
  title: Competitors
  summary: Omni competes against incumbent BI suites, AI-native analytics products, semantic-layer specialists, and warehouse-native substitutes rather than a single peer set. Official pricing and product pages show Omni’s wedge is a unified governed model reused across BI, embedded analytics, and AI, but the same 2026 corpus also shows severe bundle pressure from Power BI/Fabric, Tableau+/Next, Looker, ThoughtSpot, and native semantic layers in Snowflake and Databricks. Independent review evidence preserves openings on cost, complexity, and visualization tradeoffs, yet the moat still looks executional rather than structurally locked in.
sections:
- id: landscape-and-solution-classes
  title: Landscape and Solution Classes
  body: Omni does not face one tidy competitor set. The buyer can solve the same job with incumbent BI suites, AI-first analytics products, semantic-layer specialists, warehouse-native semantics, or an internal stack stitched together from open source and native cloud primitives. The direct peer set is Sigma, Hex, and ThoughtSpot because each pitches a modern analytics interface with AI assistance and some degree of governed context. The incumbent set is Looker, Tableau, and Power BI, which now wrap semantic, embedded, and agentic features inside much larger enterprise contracts. The adjacent set is Cube, dbt Semantic Layer, and AtScale, which pressure Omni from the governed-metrics layer without requiring a full classic BI standardization. The substitute set is Databricks metric views, Snowflake semantic views, and internal build patterns that pair warehouse semantics with Metabase or bespoke application surfaces. That breadth matters because Omni's wedge is real only if its one-model-across-BI-embedded-and-AI
    story is materially easier to buy and deploy than those mixes.
