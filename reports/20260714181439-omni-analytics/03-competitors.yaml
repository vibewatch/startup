- calloutType: risk
  title: Bundle and native-response pressure is the main disconfirming evidence
  body: The harshest risk is not feature absence. It is that Microsoft, Google, Salesforce, Snowflake, Databricks, and semantic-layer specialists are all extending similar trust-and-AI stories inside cheaper bundles or lower-friction existing stacks.
