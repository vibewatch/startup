  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Current Omni pricing sheets, realized discounting ranges, and sample contracted economics versus Looker, Sigma, ThoughtSpot, and Hex.
    whyItMatters: The public list-price corpus shows packaging direction but not whether Omni wins on total cost once enterprise discounts, bundle credits, or usage overages are negotiated.
    diligencePath: Request current price books, sample MSAs, and three recent deal comparisons showing starting land price, expansion path, and discount authority by segment.
    relatedQuestionRefs:
    - QP017
    - QP018
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: migration-and-switching
    missingEvidence: Win-loss notes, dashboard rebuild effort, semantic-model rewrite burden, and implementation timelines for Power BI, Tableau, Looker, and warehouse-native replacements.
    whyItMatters: The public architecture evidence shows plausible switching cost, but not the actual replacement friction that determines whether Omni’s wedge is durable or merely interesting.
    diligencePath: Ask for migration case studies with before-and-after deployment scope, person-weeks of rebuild effort, and retention outcomes by source platform.
    relatedQuestionRefs:
    - QP020
    - QP024
    - QP025
    relatedTableRefs:
    - TP004
    - TP005
  - type: missing-source
    severity: material
    topic: ai-feature-adoption
    missingEvidence: Customer usage, retention, or quality data for newer AI surfaces such as Omni agents, Looker conversational analytics, Tableau Next, Spotter, and Power BI Copilot.
    whyItMatters: Competitive durability depends on whether these agentic layers are heavily adopted and trusted in production, not just announced on marketing pages.
    diligencePath: Request product usage cohorts, prompt volume, weekly active AI users, and measurable workflow outcomes for AI-assisted deployments across both Omni and named replacements.
    relatedQuestionRefs:
    - QP019
    - QP024
    relatedTableRefs:
    - TP005
  - type: missing-source
    severity: minor
    topic: atscale-public-pricing-and-adoption
    missingEvidence: Public AtScale pricing, self-serve packaging detail, and customer-adoption density comparable to the more visible BI vendors and open semantic-layer tools.
    whyItMatters: AtScale is a relevant semantic-layer substitute, but public evidence is stronger on positioning than on commercial traction or buyer affordability.
    diligencePath: Ask management and channel partners how often AtScale appears in competitive shortlists and request recent AtScale commercial benchmarks from customers or SI partners.
