- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / distribution signal
  - Target segment
  - Differentiation
  - Key limitation
  rows:
  - - Omni
    - Unified semantic BI + embedded + AI analytics
    - Private AI analytics vendor with recent large private financing disclosed in Chapter 1 context
    - Modern data teams, product teams, and enterprises that want one governed model across BI and AI
    - One governed model reused across BI, embedding, APIs, MCP, and AI assistants
    - Private pricing and limited public win-loss evidence keep commercial durability partially unverified
  - - Looker
    - Incumbent cloud BI + semantic layer
    - Google Cloud distribution and existing BigQuery / IAM footprint
    - Enterprise internal BI and embedded analytics buyers already near Google Cloud
    - LookML semantic layer, embedded APIs, agentic BI framing, strong cloud security posture
    - Pricing is mostly sales-led and often rides larger Google contracts rather than a clean standalone decision
  - - Tableau
    - Incumbent visualization-led BI
    - Large Salesforce installed base and mature enterprise analytics footprint
    - Data and business teams that prioritize visualization breadth and governed reporting
    - Strong visualization, broad role-based licensing, and new Tableau Next / semantics layer path
    - High cost and complex portfolio/bundle structure at scale
  - - Power BI
    - Incumbent bundled BI platform
    - Massive Microsoft distribution through Fabric, Azure, and M365
    - Organizations already standardized on Microsoft identity and productivity stack
    - Free / low-cost entry, Fabric integration, embedded path, and Copilot roadmap
    - AI and license-free sharing often require higher-capacity SKUs; product complexity remains a complaint
  - - Sigma
    - Warehouse-native collaborative BI / AI apps
    - Enterprise SaaS with live-warehouse positioning and strong compliance messaging
    - Cloud data warehouse customers that want spreadsheet-like exploration and governed AI apps
    - Live-query architecture, governed data models, embedded analytics, and action-oriented AI app framing
    - Public pricing is still sales-led and dashboard-to-application migration value must be sold
  - - Hex
    - Notebook + app + agent analytics
    - Strong technical-user mindshare with flexible compute and collaboration model
    - Analytics engineers, analysts, and product teams that want notebooks and apps in one surface
    - Combines notebooks, data apps, agents, Slack/MCP, and reusable semantic components
    - Less obviously standardized as a broad incumbent BI replacement for classic dashboard-heavy estates
  - - ThoughtSpot
    - Search-first enterprise BI / AI analyst
    - Established enterprise analytics brand with strong self-service search positioning
    - Large enterprises that want search and conversational analytics at scale
    - Spotter AI, relational search, liveboards, and semantic-model training loops
    - Reviewer evidence says visualization flexibility and pricing can lag Power BI or Tableau expectations
  - - Metabase
    - Open-source BI and embedded substitute
    - Open-source and self-hosted entry point with simple SaaS upsell
    - Startups, SMBs, and engineering-led teams optimizing for cost and speed
    - Low initial cash cost, embedding, SQL escape hatch, and basic semantic layer / AI features
    - Enterprise-depth features and large-scale performance are weaker than premium platforms
  - - Cube
    - Open semantic layer + BI / embedded analytics
    - Open-source semantic core with self-serve and order-form packaging
    - Data-platform teams and SaaS vendors building customer-facing analytics
    - Code-first semantic layer, Semantic SQL, APIs, caching, and agent-ready model abstraction
    - Requires teams to buy into a semantic-layer architecture rather than a simpler dashboard-only tool
  - - AtScale
    - Universal semantic layer specialist
    - Enterprise semantic-infrastructure positioning across major BI tools and AI agents
    - Large enterprises that want semantic reuse without moving data
    - No-data-movement universal semantic layer, governed metrics, CI/CD, and AI/BI interoperability
    - Public pricing and broad SMB-style self-serve evidence are limited
  - - dbt Semantic Layer
    - Analytics-engineering semantic layer
    - dbt ecosystem distribution plus explicit queried-metrics packaging
    - dbt-centered teams standardizing metrics for reports, apps, and AI workflows
    - Metric definitions stay close to analytics engineering workflow and can feed many downstream surfaces
    - It is a semantic foundation, not a full first-party BI front end
  - - Warehouse-native + internal build
    - Snowflake / Databricks semantics plus Metabase or custom UI
    - Pulls budget from existing warehouse and engineering spend
    - Teams already standardized on warehouse, notebooks, or custom product surfaces
    - Keeps business logic close to data and can be paired with existing BI or bespoke application layers
    - Requires more internal engineering and produces a less opinionated packaged experience than Omni
  notes: 'Coverage is intentionally partial but broad: it includes the named direct peers, incumbents, semantic-layer adjacencies, and the most realistic warehouse-native or internal-build substitutes visible in the reviewed 2026 source set.'
  enumerationScope:
    coverage: partial
    basis: The table covers the named competitor set in the brief plus the most realistic warehouse-native and internal-build substitutes evidenced in fetched 2026 official and review sources, rather than every long-tail BI or semantic-layer vendor.
