callouts:
- calloutType: strength
  title: The wedge is packaging, not just semantics
  body: Omni looks strongest when the buyer wants one governed model to serve analyst workflows, embedded customer experiences, and AI interfaces without stitching together separate semantic, BI, and application layers.
  claimRefs:
