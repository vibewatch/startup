- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / class
  - Published pricing signal
  - Contract model
  - Included / gated capability
  - Unknowns
  - Implication
  rows:
  - - Omni
    - No public list price in retained sources
    - Sales-led enterprise software
    - Unified semantic BI, embedding, APIs, MCP, AI analytics
    - Realized price, discounting, and expansion mechanics are private
    - Omni must win on ROI and stack simplification, not entry-price transparency
  - - Looker
    - Contact sales; editions include users and API quotas
    - Annual subscription with platform + user pricing
    - Standard, Enterprise, and Embed editions; conversational token quotas and overages
    - Actual edition pricing and discounting are not public
    - Strong fit for large accounts, but opaque pricing increases bundle/comparison pressure
  - - Tableau
    - Viewer $15, Explorer $42, Creator $75 monthly billed annually; Cloud+ / Tableau+ contact sales
    - Role-based seats plus bundle upsell
    - Classic BI seats remain visible while agentic capabilities move into higher bundles
    - Enterprise realized pricing, site counts, and data-credit economics are opaque
    - Powerful but expensive portfolio logic can favor incumbency over greenfield simplicity
  - - Power BI
    - Free, Pro $14, Premium Per User $24, embedded variable
    - Per-user plus Fabric / Premium capacity
    - Low-cost entry and broad shareability, but some AI / license-free scenarios require higher SKUs
    - Actual Fabric capacity spend depends on scale and workload mix
    - This is the sharpest commercial bundle threat to Omni in Microsoft-heavy accounts
  - - Sigma
    - Public page routes to contact rather than a list price
    - Sales-led enterprise contract
    - AI apps, warehouse-native BI, governance, and embedding sold as one platform
    - Seat, usage, or app pricing is not public in retained sources
    - Commercial opacity can slow evaluation but preserves negotiation flexibility
  - - Hex
    - Free tier plus per-minute compute and paid credits / higher plans
    - Hybrid self-serve plus enterprise upsell
    - Agents, notebooks, apps, and collaboration expand with plan depth
    - How enterprise customers actually buy seats, credits, and compute together is still private
    - Flexible experimentation is strong, but TCO depends on workload shape
  - - ThoughtSpot
    - Data pricing and user pricing both surfaced; higher enterprise capabilities appear bundle-led
    - Hybrid user, usage, and enterprise packaging
    - Spotter, semantic layer for agents, MCP server, and higher-scale capabilities
    - Final enterprise contract structure remains negotiated
    - ThoughtSpot can look cheaper than Tableau but still materially above Power BI in user commentary
  - - Metabase
    - Open-source self-hosted, optional usage fees, embedding from $575/month
    - Open source plus cloud / enterprise upsell
    - Cheap entry, AI tokens, transforms, and embedded analytics sold as add-ons
    - Large-enterprise support economics depend on deployment and SLA needs
    - Lowest cash barrier for cost-sensitive teams willing to accept fewer enterprise features
  - - Cube
    - No simple public seat list; self-serve monthly and order-form annual are both explicit
    - Monthly self-serve or annual enterprise order form
    - Semantic layer, BI surfaces, APIs, caching, and agent connectors
    - Usage, seats, and overages are private beyond packaging mechanics
    - Packaging fits serious platform teams more than casual departmental BI buyers
  - - dbt Semantic Layer
    - $100 per user/month Starter; queried-metric limits are explicit
    - Developer-seat subscription with usage caps and enterprise upsell
    - Basic semantic layer starts early, advanced semantic layer and Mesh move upmarket
    - Downstream BI and application cost still sits outside dbt
    - dbt is easier to underwrite for metric governance than as a full Omni substitute
  notes: Pricing rows separate published list prices from clearly sales-led or hybrid packaging; unknown cells are left explicit because realized discounts, credits, and enterprise bundle terms are not public for most vendors.
