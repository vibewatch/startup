- id: moat-durability-and-adverse-evidence
  title: Moat Durability and Adverse Evidence
  body: 'The disconfirming evidence is strong enough that Omni should be treated as having an execution moat, not an unassailable structural moat. Semantic layers are being commoditized in two directions at once: incumbents are bundling them into broader BI and AI contracts, while warehouse-native and code-first vendors are unbundling them into reusable governed-metrics infrastructure. Review evidence does show openings. Power BI is criticized for complexity and sharing friction, Tableau for cost and performance, ThoughtSpot for visualization and pricing tradeoffs, and Metabase for enterprise-depth limits. Those weaknesses create room for a product that is easier to trust and faster to ship. But they do not prove winner-take-all durability, because the same sources also show why buyers stick with familiar platforms: visualization depth, distribution, installed identity, and improving AI features. The underwriting question is therefore not whether Omni has a wedge. It does. The harder question
    is whether the company can turn that wedge into repeatable, low-friction replacement economics before native and bundled alternatives erase the surplus value.'
