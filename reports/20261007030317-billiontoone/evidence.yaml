evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration-scope
    missingEvidence: >-
      Full unredacted organizational chart including all vice presidents, directors, and functional managers across
      clinical laboratory operations.
    whyItMatters: >-
      Table TO002 covers a representative sample of executive officers and co-founders; full functional depth requires
      comprehensive disclosure of secondary operational leads.
    diligencePath: >-
      Consult future Form 10-K annual reports and proxy statements (DEF 14A) for detailed executive officer listings and
      committee rosters.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: credit-facility-terms
    missingEvidence: >-
      Complete disclosure of interest rate spreads, covenants, milestone triggers, and warrant overhang for the
      September 2024 Oberland Capital credit agreement.
    whyItMatters: >-
      Understanding debt service obligations, collateral pledges, and potential dilution or encumbrances on molecular
      diagnostic revenues is critical to assessing equity risk.
    diligencePath: >-
      Review Exhibit 10 material contract filings within BLLN's Form 10-K or Form 10-Q SEC filings, or request credit
      facility agreements directly via investor relations.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent prenatal, therapy-selection, response-monitoring, and MRD market estimates with explicit geography,
      year, test-price assumptions, patient denominators, and methodology.
    whyItMatters: >-
      Company opportunity claims cannot establish a reachable SAM or support a market-share-based valuation without
      independent denominators and assumptions.
    diligencePath: >-
      Obtain current industry research and public-company market disclosures, then reconcile patient incidence, testing
      eligibility, utilization, reimbursement, and realized ASP.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: payer-economics
    missingEvidence: >-
      Product-level covered lives, paid-claim rates, denial and appeal rates, contracted versus realized reimbursement,
      patient responsibility, and payer concentration.
    whyItMatters: >-
      Contracted lives do not measure reimbursed utilization, while ASP gains may not persist if payer mix, coding, or
      collection performance changes.
    diligencePath: >-
      Review payer contracts, claims cohorts, remittance data, and revenue concentration by payer and product with
      management and billing operations.
    relatedQuestionRefs:
      - QM004
      - QM006
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: payer-concentration-and-denial-rates
    missingEvidence: >-
      Detailed breakdown of commercial payer concentration, initial claims denial percentages, and realized net revenue
      per payer tier.
    whyItMatters: >-
      BillionToOne intentionally deferred $10 million in claims awaiting in-network code activation; without granular
      denial and write-off data, long-term reimbursement durability cannot be confirmed.
    diligencePath: >-
      Request audited revenue cycle management logs, aging accounts receivable schedules by payer, and historical
      denial-recovery curves during technical diligence.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: product-level-gross-margin-split
    missingEvidence: >-
      Direct disclosure of unit COGS, sequencing consumables, and gross margins segmented separately for prenatal assays
      versus oncology liquid biopsy tests.
    whyItMatters: >-
      Oncology assays carry higher initial COGS and may dilute corporate gross margins below the 70% threshold as test
      mix shifts toward oncology.
    diligencePath: >-
      Examine management accounting gross margin schedules by product line and sub-contract laboratory sequencing
      expense allocations.
    relatedQuestionRefs:
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: bioinformatics-cloud-costs
    missingEvidence: >-
      Granular breakdown of cloud compute costs and latency metrics for smNGS bioinformatics deconvolution pipelines as
      test volumes scale.
    whyItMatters: >-
      Single-molecule sequencing generates substantial raw read volume, and pipeline compute efficiency directly
      dictates gross margin durability.
    diligencePath: >-
      Request AWS cloud architecture diagrams, pipeline run costs per sample, and serverless/cluster autoscaling
      benchmarks during management diligence.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: reagent-supply-chain
    missingEvidence: Supplier redundancy agreements and synthetic QCT oligonucleotide quality control specifications.
    whyItMatters: >-
      Sole-sourcing critical synthetic spike-in calibrators exposes high-throughput clinical laboratory operations to
      supply chain disruptions.
    diligencePath: >-
      Review vendor quality agreements and secondary supplier qualification audits for proprietary QCT template
      manufacturing.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-cohort-churn
    missingEvidence: >-
      Disclosed net revenue retention (NRR), gross revenue retention (GRR), and clinic-level cohort churn rates for
      ordering OB-GYN and oncology practices.
    whyItMatters: >-
      Without clinic-level retention and re-order rates, diligence cannot definitively verify whether volume growth is
      driven by expanding adoption among existing accounts or purely by new clinic acquisition.
    diligencePath: >-
      Request physician cohort re-order matrices and account-level net volume retention curves under confidentiality
      during management diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: epic-aura-utilization-metrics
    missingEvidence: >-
      Quantitative data showing the proportion of total test volume ordered through Epic Aura versus legacy portals,
      along with active health system deployment counts.
    whyItMatters: >-
      Proves whether EHR integration is materially driving commercial expansion and workflow stickiness or remains in
      early gradual rollout across hospital networks.
    diligencePath: >-
      Obtain electronic order intake reports segmented by ordering channel (Epic Aura, web portal, paper requisition)
      from laboratory operations.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: payer-claim-denial-rates
    missingEvidence: >-
      Granular payer-specific initial denial rates and final appealed collection yields across commercial insurers and
      state Medicaid programs.
    whyItMatters: >-
      Payer contracts cover contracted lives, but actual realized cash ASP is subject to medical necessity denials and
      prior authorization disputes.
    diligencePath: Inspect revenue cycle management denial logs and bad-debt allowance bridges across top ten payer counterparties.
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: litigation-exposure-quantification
    missingEvidence: >-
      Quantitative disclosure of ongoing legal defense costs, potential settlement ranges, or insurance indemnity
      coverage for prenatal false-negative malpractice and consumer fraud claims.
    whyItMatters: >-
      While management reports zero litigation reserves under ordinary-course standards, unresolved consumer fraud
      claims targeting core NIPT marketing representations create unpredictable tail liability and headline risk.
    diligencePath: >-
      Review ongoing Swieczkowski status conference filings in the Northern District of Illinois, monitor class-action
      consolidation filings, and request detailed insurance coverage limits during management diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: single-source-supplier-identity
    missingEvidence: >-
      Specific identity of sole-source sequencer and reagent manufacturers, contract duration, and volume discount
      terms.
    whyItMatters: >-
