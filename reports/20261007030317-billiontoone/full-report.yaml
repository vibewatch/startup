  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Landscape Across Prenatal Testing and Liquid Biopsy
        blocks:
          - type: paragraph
            body: >-
              BillionToOne operates across prenatal genetics and precision oncology, positioning its proprietary
              Quantitative Counting Template (QCT) platform against established diagnostic giants and specialized
              genomic innovators. In prenatal testing, traditional non-invasive prenatal testing (NIPT) workflows from
              market leaders focus primarily on fetal chromosomal aneuploidies such as trisomies 21, 18, and 13. When
              screening for inherited recessive single-gene conditions, conventional care models rely on maternal
              carrier screening followed by paternal testing if the mother is identified as a carrier. Because paternal
              samples are frequently unavailable or delayed, detection rates in real-world clinical practice remain
              constrained. BillionToOne’s flagship UNITY platform addresses this operational bottleneck by assessing
              both fetal chromosomal abnormalities and fetal risk for severe single-gene recessive disorders (including
              cystic fibrosis, spinal muscular atrophy, sickle cell disease, and thalassemias) directly from cell-free
              DNA in a single maternal blood tube without requiring partner testing. Concurrently, BillionToOne has
              expanded its commercial reach into the oncology liquid biopsy market through its Northstar suite
              (comprising Northstar Select for genomic profiling and Northstar Response for treatment response
              monitoring, alongside the newly introduced Northstar Origin for tissue-of-origin identification). In
              oncology, the competitive dynamics differ substantially: BillionToOne faces entrenched diagnostic leaders
              like Guardant Health, Foundation Medicine, and Natera, whose platforms possess extensive prospective
              clinical trial validation, broad Medicare MolDX reimbursement determination, and established institutional
              physician adoption.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP011
