      - number: '6.4'
        title: Customer Concentration, Payer Friction, and Competitive Durability
        blocks:
          - type: paragraph
            body: >-
              Despite rapid commercial scaling, BillionToOne exhibits significant revenue concentration in prenatal
              testing, which accounted for $277 million or 90.8% of its $305 million in total revenue during full-year
              2025. While oncology testing expanded significantly to $10.7 million in Q1 2026, prenatal screening
              continues to represent the vast majority of cash collections. Furthermore, molecular diagnostics adoption
              faces structural payer and competitive hurdles. In prenatal testing, BillionToOne competes intensely
              against entrenched incumbents including Natera, Labcorp, and Myriad Genetics, all of which maintain
              extensive clinical sales forces and deep institutional relationships. Furthermore, although contracted
              lives reached 300 million, underlying test reimbursement remains vulnerable to payer coverage policies,
              medical necessity denials, and prior-authorization requirements across commercial and Medicaid plans.
              Diligence must monitor product-level contribution margins, true underlying ASP durability, and whether
              oncology liquid biopsy adoption can diversify the revenue base before prenatal growth moderates.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Significance of Epic Aura Workflow Integration
            body: >-
              Securing integration with Epic's Aura diagnostics suite represents a substantial competitive advantage in
              molecular diagnostics. Traditional specialized laboratory tests frequently suffer from significant
              requisition friction, requiring clinicians to navigate manual paper requisitions or disjointed third-party
              portals. By embedding UNITY Complete and Northstar order placement directly into standard clinical
              workflows and returning discrete data into patient charts, BillionToOne significantly lowers ordering
              friction across major health systems and community practices.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
          - type: callout
            title: Persistent Product Concentration and Incumbent Competitive Pressure
            body: >-
              With over 90% of 2025 revenue and 89% of Q1 2026 revenue generated by prenatal testing, BillionToOne
              remains vulnerable to prenatal reimbursement dynamics and competitive countermoves by well-capitalized
              incumbents like Natera. Long-term commercial durability requires sustaining prenatal market share gains
              while successfully scaling Northstar liquid biopsy adoption.
            calloutType: risk
            claimRefs:
              - CU008
