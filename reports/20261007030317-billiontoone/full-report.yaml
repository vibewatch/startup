              - CR010
              - CR012
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Prenatal Screening Liability Precedent
            body: >-
              The denial of BillionToOne's motion to dismiss in Swieczkowski v. BillionToOne establishes that clinicians
              relying on promotional NIPT sensitivity claims without receiving full multi-page disclaimer materials does
              not insulate the testing laboratory under Illinois consumer fraud law. If certified or expanded, claims
              challenging prenatal screening false-negative communication could create material headline and damages
              exposure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Sole-Source Sequencing Bottleneck
            body: >-
              With key next-generation sequencers and proprietary chemistry sourced from a limited number of specialized
              instrumentation vendors, replacing an upstream partner requires an estimated one to nine months and
              comprehensive test revalidation, leaving continuous clinical lab throughput vulnerable to vendor-level
              supply disruptions.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The operating evidence is strong but not sufficient for a price-sensitive Buy decision. BillionToOne
              reported first-quarter 2026 revenue of $108.4 million, 84% year-over-year growth, a 73% gross margin, and
              $17.8 million of operating income. It also held $537.45 million of cash and cash equivalents against
              $90.005 million of long-term debt at March 31, 2026. Those figures support a constructive company-quality
              view, while management's $450 million to $465 million 2026 revenue guidance provides a measurable
              execution benchmark. However, no assigned source supplies a current share price, fully diluted share
              count, market capitalization, enterprise value, or independently benchmarked trading multiple as of the
              run date. The recommendation is therefore Track / Research More with medium confidence and high valuation
              uncertainty, not a price target or implied return presented with false precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
