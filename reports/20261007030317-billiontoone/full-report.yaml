      - number: '6.3'
        title: Institutional Deployments, Strategic Partnerships, and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              To accelerate clinical adoption and streamline routine specimen procurement, BillionToOne has pursued
              direct workflow integration into enterprise electronic health record systems alongside institutional
              research partnerships. In December 2025, BillionToOne finalized an agreement with Epic Systems to
              integrate its prenatal and oncology testing portfolio into Epic's Aura diagnostics suite, enabling
              ambulatory and health system clinicians to order UNITY Complete and Northstar tests directly within native
              EHR workflows. Discrete diagnostic results return directly into Epic clinical records and the MyChart
              patient portal, mitigating ordering friction across community practices and maternal-fetal medicine
              clinics. In oncology, the company secured institutional validation through the selection of Northstar
              Select for the LC-SCRUM-TRY clinical study at Japan's National Cancer Center Hospital East, evaluating
              treatment-resistant solid tumors. These institutional integrations reduce administrative burden and
              provide clinical decision support at the point of care, though verified metrics detailing exact order
              percentages routed via Epic or live enterprise health system counts remain undisclosed.
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU012
