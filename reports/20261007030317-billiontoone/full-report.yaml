  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Corporate Evolution
        blocks:
          - type: paragraph
            body: >-
              BillionToOne, Inc. is a precision diagnostics company incorporated in Delaware in 2016 and headquartered
              in Menlo Park, California. The company went public on the Nasdaq Global Select Market under the ticker
              symbol BLLN in November 2025, transitioning from a venture-backed startup into a high-growth commercial
              enterprise. BillionToOne was founded with the mission to build accurate, accessible genetic tests that
              transform healthcare decision-making, beginning with non-invasive prenatal screening and systematically
              expanding into clinical oncology diagnostics. The foundational technical asset across all commercial
              product lines is the patented Quantitative Counting Templates (QCT) technology, a proprietary smNGS
              (single-molecule next-generation sequencing) molecular counting platform capable of directly counting DNA
              fragments at the single-molecule level. By quantifying minute biological variations from cell-free DNA
              (cfDNA) obtained via standard maternal or patient blood draws, BillionToOne eliminates the need for
              invasive procedures such as amniocentesis or surgical tissue biopsies.
