      - number: '5.3'
        title: Software Infrastructure, Security Controls, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              BillionToOne's operational scalability and regulatory posture rely on custom cloud and portal
              infrastructure designed to handle protected health information (PHI) under strict HIPAA compliance rules.
              The outward-facing clinical portal, developed in partnership with DjangoStars, is built upon a
              Python/Django and Flask backend deployed on Amazon Web Services (AWS) infrastructure utilizing PostgreSQL
              relational databases. This portal automates medical data transfer between ordering obstetricians,
              oncologists, phlebotomy networks, and internal laboratory information systems (LIMS), eliminating manual
              transcription errors and automating Salesforce CRM updates. Enterprise security and compliance governance
              are maintained through a formal Trust Center powered by SafeBase, providing audit transparency into SOC 2
              Type II controls, HIPAA safeguards, and third-party risk assessments. Key technical risks center on
              laboratory automation scaling, bioinformatics compute costs, and integration dependencies. Because smNGS
              generates extensive sequencing datasets per patient to count single molecules reliably, cloud data storage
              and pipeline compute represent significant operational expenses. Furthermore, any disruption in robotic
              liquid handling platforms, reagent supply chains for synthetic QCT oligos, or third-party CRM and EHR
              synchronization can introduce sample turnaround delays that directly threaten high-volume clinical
              laboratory operations.
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-Molecule Resolution Eliminates Paternal Testing Requirements
            body: >-
              By achieving single-molecule counting resolution through synthetic QCT templates, Unity Complete
              accurately quantifies fetal cfDNA proportions for single-gene conditions directly from maternal blood.
              This removes the logistical friction and high non-compliance rates historically associated with obtaining
              obligate paternal carrier samples.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
          - type: callout
            title: High-Volume Testing Strains Automated Liquid Handling and Compute
            body: >-
              With quarterly test volume reaching 188,000 delivered tests in Q1 2026, BillionToOne's high-throughput
              CLIA lab operations are highly dependent on continuous robotic liquid handling uptime and cloud
              bioinformatics compute. Laboratory bottlenecks or reagent supply shocks directly threaten turnaround
              reliability.
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Payer-Provider Architecture
        blocks:
          - type: paragraph
            body: >-
              BillionToOne operates a specialized dual-market commercial architecture spanning prenatal genetics and
              precision oncology, where the clinical test orderer and the economic payer are structurally decoupled. In
              prenatal diagnostics, the primary purchasing and ordering decision-makers are OB-GYN clinicians,
              maternal-fetal medicine specialists, and hospital-based clinical laboratory directors, while commercial
              health plans and Medicaid serve as the ultimate payers. In oncology, medical oncologists and oncology
              clinical trial sponsors represent the core ordering constituents for Northstar Select genomic profiling
              and Northstar Response therapy monitoring assays. Because patient out-of-pocket exposure directly
              influences physician ordering compliance and sample completion, commercial viability heavily hinges on
              broad in-network insurer contracts. By early 2026, BillionToOne expanded its in-network coverage footprint
              to approximately 300 million contracted lives across the United States, representing over 90% of insured
              individuals nationwide following successive agreements with major national payers including Anthem and
              UnitedHealthcare.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
