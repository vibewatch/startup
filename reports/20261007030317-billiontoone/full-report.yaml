              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Bull, Base, and Bear Framework
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be anchored to observable operating signals rather than invented valuation
              ranges. The bull signal is performance above the high end of the $450 million to $465 million revenue
              guide while preserving the reported 73% gross margin and positive operating income. The base signal is
              delivery within guidance with continued profitability and liquidity discipline. The bear signal is a
              guidance miss, material margin reversal, renewed operating losses, or a deterioration in the cash-to-debt
              position. FundedIQ's statement that the latest $130 million round exceeded its $8.1 million biotechnology
              round-size median is a financing-size benchmark, not a valuation multiple and not evidence of public-share
              upside. Because the pool lacks current enterprise value and comparable trading multiples, each scenario's
              valuation range and target return remain explicitly unquantified pending the same diligence bridge.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
          - type: table
