  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Diagnostic Product Portfolio and Clinical Workflows
        blocks:
          - type: paragraph
            body: >-
              BillionToOne commercializes molecular diagnostic assays spanning reproductive health and precision
              oncology, centered on non-invasive analysis of cell-free DNA (cfDNA). In prenatal screening, its flagship
              Unity Complete screen provides personalized fetal risk assessments for single-gene recessive
              conditions—such as sickle cell disease, cystic fibrosis, and spinal muscular atrophy—alongside chromosomal
              aneuploidies from a single maternal blood draw as early as nine weeks of gestation without requiring a
              paternal blood sample. In May 2026, the company expanded its reproductive testing portfolio by launching
              Unity Confirm, a circulating fetal cell-based confirmation assay using proprietary Fetal Cell Capture
              technology to isolate intact fetal cells from maternal peripheral blood, providing diagnostic confirmation
              without the miscarriage risks associated with invasive chorionic villus sampling or amniocentesis. In
              precision oncology, the Northstar suite leverages single-molecule next-generation sequencing across
              distinct clinical indications: Northstar Select detects actionable somatic genomic alterations to guide
              therapy selection, Northstar Response quantifies changes in circulating tumor DNA down to 0.01% tumor
              fraction to monitor treatment response and predict immunotherapy outcomes, and Northstar Origin identifies
              tissue of origin for cancers of unknown primary. Across all offerings, the commercial workflow depends on
              an integrated healthcare web portal that coordinates clinical order intake, sample tracking, lab status
              communication, and Salesforce CRM data synchronization.
