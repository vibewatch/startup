    columns:
      - Issue
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Growth
        - Q1 2026 revenue increased 84% year over year.
        - One quarter does not establish durable multi-year growth.
        - Several quarters at or above guidance with consistent definitions.
      - - Economics
        - Q1 gross margin was 73% and operating income was $17.8 million.
        - Durability across product mix and reimbursement cycles is not established here.
