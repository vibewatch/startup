  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision dimension
      - Current assessment
      - Evidence
      - Decision implication
    rows:
      - - Recommendation
        - Track / Research More
        - Strong current operating evidence; current price and enterprise value absent from the assigned evidence.
        - Do not underwrite a Buy until the valuation bridge is complete.
      - - Confidence
        - Medium on operations; low on valuation
        - Q1 2026 financial metrics are detailed, while present market inputs are missing.
        - Separate operating conviction from price conviction.
      - - Risk rating
        - High valuation uncertainty
        - Historical valuation records conflict and do not establish a run-date market value.
        - Require a wider margin of safety than operating momentum alone would suggest.
      - - Valuation stance
        - Undetermined
        - No supported current market capitalization, enterprise value, or public-comparable multiple set.
        - Treat any precise valuation range as an open diligence item.
      - - Entry discipline
        - Conditional
        - Use current fully diluted enterprise value and same-date diagnostics comparables.
        - Advance only if the premium is justified by sustained growth, margin, and profitability.
    notes: >-
      Operating metrics are from the company-issued Q1 2026 release; valuation conclusions are deliberately withheld
      because the assigned sources do not provide a current, corroborated enterprise-value bridge.
