      - number: '3.3'
        title: Moat Durability, Switching Costs, and Incumbent Response
        blocks:
          - type: paragraph
            body: >-
              BillionToOne’s competitive moat rests on two pillars: the analytical sensitivity and PCR error reduction
              of its proprietary QCT molecular counting chemistry, and the simplified clinical workflow that removes
              paternal testing friction for obstetricians. In prenatal care, replacing a multi-step, two-parent testing
              protocol with a single maternal blood draw provides substantial operational efficiency for OB/GYN
              practices, driving high clinician retention and rapid volume growth. However, switching barriers in
              commercial diagnostics are asymmetrical. While independent OB/GYN clinics can readily switch or multi-home
              send-out prenatal testing, large health systems and integrated delivery networks remain tied to enterprise
              reference laboratory contracts with Labcorp or Quest Diagnostics that bundle hundreds of routine
              laboratory tests. Furthermore, in oncology liquid biopsy, incumbent switching costs are formidable:
              oncologists established on Guardant360 or FoundationOne benefit from institutional EHR integration,
              automated pathology reflex workflows, and established prior authorization support. In monitoring, Natera’s
              Signatera creates structural lock-in because tumor-informed MRD requires initial tumor tissue sequencing
              before serial blood draws can occur. Adversely, BillionToOne’s reliance on proprietary
              laboratory-developed test (LDT) frameworks leaves it exposed to regulatory scrutiny and payer coverage
              friction. As dominant incumbents like Natera defend their core market shares through aggressive commercial
              contracting and counter-detailing, BillionToOne must continuously substantiate that its analytical
              sensitivity translates into superior health economics and durable reimbursement.
            claimRefs:
              - CP003
              - CP008
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow Consolidation as a Prenatal Disruption Wedge
            body: >-
              BillionToOne’s primary commercial wedge against Natera and national lab incumbents is operational
              consolidation. In standard OB/GYN workflows, identifying fetal risk for recessive conditions requires
              ordering maternal carrier screening, awaiting positive carrier results, contacting the biological father
              for follow-up testing, and often facing lost follow-ups or patient drop-out. UNITY eliminates the paternal
              step by measuring fetal cell-free DNA directly when the mother tests positive, raising real-world carrier
              risk detection from roughly 41% to over 98% while delivering a unified report from a single blood draw.
            calloutType: insight
            claimRefs:
              - CP002
              - CP008
              - CP011
          - type: callout
            title: Incumbent Payer and Contracting Asymmetry in Oncology
            body: >-
              While BillionToOne has achieved rapid penetration in prenatal screening, its oncology liquid biopsy suite
              faces entrenched competitors with structural contracting moats. Competitors like Guardant Health,
              Foundation Medicine, and Natera hold established Medicare MolDX coverage, broader in-network private payer
              contracts, and FDA companion diagnostic designations that dictate institutional oncology treatment
              pathways. Displacing these incumbents will require substantial prospective clinical trial data proving
              superior outcomes alongside intensive health economic detailing.
            calloutType: risk
            claimRefs:
              - CP003
              - CP010
              - CP014
              - CP015
  - number: 4
    title: Financials
