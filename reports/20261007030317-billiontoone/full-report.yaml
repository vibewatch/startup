      - number: '7.3'
        title: Integrated Risk Evaluation and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Underwriting an investment in BillionToOne requires balancing accelerating clinical testing volume and
              high gross margins against asymmetric regulatory, legal, and dependency tail risks. A holistic risk
              appraisal highlights three primary thesis-break triggers that warrant continuous monitoring by
              institutional investors. First, adverse legal findings or class-action consolidation in the Swieczkowski
              litigation would impair commercial trust among OB-GYN ordering networks and potentially invalidate
              marketing claims surrounding single-molecule counting precision. Second, supply-chain rationing or
              regulatory trade restrictions targeting primary sequencing hardware manufacturers would interrupt
              laboratory throughput and exhaust the company's three-month inventory cushion. Third, third-party payer
              resistance—such as restrictive non-invasive prenatal screening reimbursement policies or denial of
              coverage for expanded carrier microdeletions—would directly degrade average selling prices and compress
              operating margins. Ongoing diligence must rigorously track Northern District of Illinois court docket
              milestones, state laboratory inspection survey findings from CDPH and CLEP, and quarterly oncology revenue
              diversification away from pure prenatal reliance.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR010
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
