        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than "genetic testing" and should be segmented by clinical job.
              BillionToOne sells laboratory tests for prenatal risk screening, oncology therapy selection, and oncology
              treatment-response monitoring; a September 2026 launch added a tissue-of-origin liquid-biopsy application.
