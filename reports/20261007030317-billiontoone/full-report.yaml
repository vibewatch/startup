  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              BillionToOne operates in an intensively regulated diagnostic environment where legal exposure and
              regulatory oversight present material tail risks. In October 2024, plaintiffs Monika and Artur
              Swieczkowski filed a lawsuit against BillionToOne in the Northern District of Illinois, alleging Illinois
              Consumer Fraud and Deceptive Business Practices Act (ICFA) violations, common law fraud, and negligent
              misrepresentation regarding the UNITY Complete prenatal screening test. The complaint contends that
              marketing materials emphasized a 99.9% sensitivity rate and non-invasive certainty while failing to
              adequately disclose higher real-world false negative rates for Trisomy 18 that independent studies report
              as high as 7.9%. Crucially, on August 28, 2025, presiding District Judge Sharon Johnson Coleman denied
              BillionToOne's Rule 12(b)(6) motion to dismiss, rejecting the defense that the learned intermediary
              doctrine shields the company when treating physicians receive abbreviated summary result sheets without
              explicit false negative warnings. While BillionToOne recorded zero litigation reserves in its 2025 Form
              10-K disclosures under the position that adverse outcomes are not probable or estimable, surviving
              motion-to-dismiss scrutiny elevates exposure to uncapped punitive damages and reputational damage across
              OB-GYN physician networks. Beyond litigation, BillionToOne markets all current genetic tests as laboratory
              developed tests (LDTs) under federal CLIA certification and CAP accreditation. Although the FDA rescinded
              recent LDT oversight rules, potential federal legislative action or renewed FDA enforcement discretion
              creates perpetual compliance uncertainty across its California and New York licensed facilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
