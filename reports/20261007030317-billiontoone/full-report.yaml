      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              BillionToOne's proprietary Quantitative Counting Templates (QCT) platform delivers notable cost advantages
              over conventional high-depth next-generation sequencing. By counting single DNA molecules directly, the
              company minimizes sequencing instrument overhead and chemistry waste. Corporate gross margin expanded from
              53% in 2024 to 68% in 2025, reaching 73% in Q1 2026 with gross profit of $79.1 million on cost of revenue
              of $29.3 million. Average cost per delivered test stood at approximately $154 in Q1 2026. However, unit
              cost dynamics are shifting: scaling oncology liquid biopsy assays introduces near-term margin dilution due
              to higher consumables and flow-cell sequencing requirements compared to mature prenatal panels.
              Additionally, the aggressive addition of 70 commercial sales representatives in the first half of 2026
              increased operating expenses and introduced temporary rep productivity dilution before expected payback in
              late 2026.
