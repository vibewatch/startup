      - number: '4.2'
        title: Pricing Dynamics and ASP Expansion
        blocks:
          - type: paragraph
            body: >-
              The core catalyst driving BillionToOne's revenue acceleration is compounding expansion in realized average
              selling price (ASP) alongside test delivery volumes. Overall ASP increased 35% in full-year 2025 to $495
              per test and advanced another 28% year-over-year in Q1 2026 to reach $571 per test. This pricing
              realization reflects improved in-network payer contract execution, enhanced coverage determinations, and
              greater panel depth across both prenatal and oncology tests. However, reimbursement timing remains
              sensitive: management intentionally withheld over $10 million in diagnostic claims during 2026 to await
              national commercial payer in-network code implementations, which created temporary collections drag.
              Furthermore, sequential quarterly revenue stability between Q1 and Q2 2026 was impacted by a lower true-up
              revenue contribution in Q2, even as underlying core volume expanded 8% sequentially. Managing payer cash
              conversion cycles is vital as commercial agreements mature.
            claimRefs:
