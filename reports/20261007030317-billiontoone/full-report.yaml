              molecular-diagnostic revenue attached to these workflows. Obstetric care, cancer treatment, imaging,
              tissue biopsy, and invasive prenatal confirmation are substitutes or adjacent spend rather than part of
              the evidenced revenue boundary. The pool does not establish what portion of those alternatives is
