      - number: '7.2'
        title: Operational Supply-Chain and Dependency Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              BillionToOne's operational scalability faces critical single-point dependencies across hardware, reagents,
              and commercial revenue generation. In its audited SEC disclosures, the company confirms reliance on a
              limited number of suppliers—including sole or single-source vendors—for specialized next-generation
              sequencers, proprietary reagents, blood collection tubes, and capital instruments required for clinical
              processing. Management estimates that replacing a critical vendor would require between one and nine
              months, involving extensive assay re-engineering, bioinformatics recalibration, and clinical revalidation
              under CLIA and CAP standards. While the company maintains an operational buffer by striving to hold at
              least three months of raw material inventory, prolonged supply disruptions from primary sequencing vendors
              represent an existential threat to continuous test turnaround times. Furthermore, commercial dependency
              risk is heavily concentrated in a single product vertical. In the first quarter of 2026, prenatal testing
              generated $96.5 million out of $108.4 million in total clinical revenue, demonstrating that 89.0% of the
              firm's commercial inflow hinges on OB-GYN test adoption. While oncology liquid biopsy tests (Northstar
              Select and Northstar Response) generated $10.7 million in Q1 2026 with rapid year-over-year expansion,
              non-prenatal offerings remain early in their commercial lifecycle. Operational continuity also requires
              navigating complex third-party payor relationships where over 90% of revenue is derived from health
              insurance reimbursement subject to multi-month appeal cycles and variable consideration adjustments.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
