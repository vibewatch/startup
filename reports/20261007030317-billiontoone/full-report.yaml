      - number: '6.2'
        title: Adoption Trajectory and Volume Scaling
        blocks:
          - type: paragraph
            body: >-
              Commercial test utilization has expanded rapidly across BillionToOne's clinical laboratory operations.
              During the first quarter of 2026, the company accessioned 189,000 total tests and delivered 188,000 tests,
              reflecting a 44% year-over-year increase in delivered testing volume compared to 131,000 tests delivered
              in the first quarter of 2025. Sequential test delivery volume grew approximately 10% quarter-over-quarter
              in prenatal screening and approximately 25% quarter-over-quarter in oncology liquid biopsy. This volume
              expansion drove first-quarter 2026 total revenue to $108.4 million, representing 84% year-over-year
              top-line growth. Top-line revenue expansion outpaced delivered unit volume growth due to a 28%
              year-over-year increase in average selling price to $571 per test, supported by expanded carrier panel
              Medicaid reimbursement codes and favorable payer mix shifts despite seasonal first-quarter deductible
              resets. While oncology volume grew rapidly, total revenue remains heavily weighted toward prenatal
              testing, which generated $96.5 million of the $108.4 million total quarterly revenue.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU011
