        - A reconciled EV bridge including all debt, warrants, options, and dilution.
      - - Financing history
        - The 2024 Series D established substantial institutional financing support.
        - Sources disagree on post-money valuation and cumulative funding coverage.
        - Primary financing documents or filed capitalization records.
