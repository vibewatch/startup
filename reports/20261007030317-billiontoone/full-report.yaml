        title: Revenue Streams and Commercial Mix
        blocks:
          - type: paragraph
            body: >-
              BillionToOne operates a high-growth molecular diagnostics commercial model anchored by reproductive health
              screening and expanding into precision oncology liquid biopsy. Total revenue grew 100% in full-year 2025
