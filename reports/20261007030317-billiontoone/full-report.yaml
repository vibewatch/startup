            body: >-
              BillionToOne holds an exceptionally strong balance sheet following its public listing, closing 2025 with
              $496.0 million in cash and cash equivalents and expanding reserves to $537.5 million by March 31, 2026.
              The business achieved self-sustaining operational cash flow in Q1 2026, generating $11.0 million in cash
