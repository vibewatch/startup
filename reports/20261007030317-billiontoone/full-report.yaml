      - number: '5.2'
        title: QCT Molecular Counting Architecture and Laboratory Operations
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator powering BillionToOne's clinical tests is its patented Quantitative
              Counting Templates (QCT) molecular counting platform, executed via single-molecule next-generation
              sequencing (smNGS). Traditional cfDNA sequencing techniques amplify target DNA fragments through
              polymerase chain reaction (PCR) cycles, but non-uniform amplification kinetics create background noise
              that obscures rare variant signals below 0.1% to 1% allele frequency. BillionToOne bypasses this
              limitation through a four-stage molecular counting process: synthetic, traceable DNA fragments (QCTs) are
              spiked into the plasma sample at known molecular concentrations alongside unknown target fragments; target
              fragments and QCTs undergo competitive PCR amplification at identical reaction rates; post-sequencing
              readouts measure both synthetic QCT counts and endogenous fragments; and proprietary bioinformatics
              pipelines calculate an exact amplification multiplier to quantify absolute target DNA molecules present in
              the original sample. Operational execution occurs within high-complexity CLIA-certified and CAP-accredited
              clinical laboratories in Menlo Park and Union City, California. High-throughput automation relies on
              robotic liquid handlers such as Agilent Bravo, Hamilton STAR, and Beckman Coulter Biomek systems for
              automated sample accessioning, DNA extraction, library preparation, and reagent dispensing. As commercial
              sample volume scaled to 188,000 delivered tests in the first quarter of 2026, process engineering teams
              implemented statistical process control, Six Sigma methodologies, and automated error tracking to prevent
              throughput bottlenecks and maintain analytical turnaround times.
            claimRefs:
              - CE001
              - CE002
              - CE008
