  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or confirmation trigger
    rows:
      - - Bull
        - >-
          Revenue exceeds the $465 million high end while gross margin remains near or above 73% and operating income
          stays positive.
        - >-
          Range not supportable until current EV and comparable multiples are obtained; upside requires the entry
          multiple not to pre-price execution.
        - Strengthening only after reported outperformance.
        - Invalidated by margin compression or a return to operating loss.
      - - Base
        - Revenue lands within $450 million to $465 million with continued profitability and disciplined liquidity.
        - >-
          Range not supportable; compare current EV/revenue and EV/operating-income metrics with same-date diagnostics
          peers.
        - Most directly aligned with management's current guidance.
        - Reassess on a guidance revision or material change in cash and debt.
      - - Bear
        - Revenue misses guidance, gross margin reverses materially, operating losses recur, or liquidity weakens.
        - >-
          Downside cannot be quantified without a current entry value; require an explicit stress-case multiple after
          the EV bridge is built.
        - Rises if operating evidence weakens before price support is established.
        - A guidance miss, material margin decline, operating loss, or worsening net cash.
    notes: >-
      These are evidence-bound scenario conditions, not forecasts; probability signals are qualitative and valuation
      ranges remain a documented gap rather than unsupported point estimates.
