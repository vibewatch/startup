chapter:
  number: 4
  title: "Financials"
  summary: "BillionToOne achieved a decisive transition to GAAP profitability in early 2026, delivering $108.4 million in Q1 revenue (up 84% year-over-year) and $17.8 million in operating income behind 73% gross margins and $571 blended average selling prices. While supported by $537.5 million in cash, deliberate deferral of over $10 million in commercial claims and gross margin dilution from scaling oncology tests remain core diligence concerns."
sections:
  - id: "revenue-streams-and-commercial-mix"
    title: "Revenue Streams and Commercial Mix"
    body: "BillionToOne operates a high-growth molecular diagnostics commercial model anchored by reproductive health screening and expanding into precision oncology liquid biopsy. Total revenue grew 100% in full-year 2025 to $305.1 million, driven by prenatal clinical testing revenue of $277.1 million and oncology testing revenue of $25.0 million. In the first quarter of 2026, top-line acceleration continued with revenue expanding 84% year-over-year to $108.4 million. Prenatal diagnostics remains the primary volume generator at $96.5 million in Q1 2026, while oncology testing surged roughly fourfold to $10.7 million as clinical adoption of Northstar Select and Northstar Response widened across academic and community cancer networks. Contracted health plan access now covers approximately 300 million lives in the United States, providing a broad in-network commercial foundation that supports full-year 2026 revenue guidance of $450 million to $465 million."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI005"
      - "CI010"
      - "CI015"
    tableRefs:
      - "TI001"
  - id: "pricing-dynamics-and-asp-expansion"
    title: "Pricing Dynamics and ASP Expansion"
    body: "The core catalyst driving BillionToOne's revenue acceleration is compounding expansion in realized average selling price (ASP) alongside test delivery volumes. Overall ASP increased 35% in full-year 2025 to $495 per test and advanced another 28% year-over-year in Q1 2026 to reach $571 per test. This pricing realization reflects improved in-network payer contract execution, enhanced coverage determinations, and greater panel depth across both prenatal and oncology tests. However, reimbursement timing remains sensitive: management intentionally withheld over $10 million in diagnostic claims during 2026 to await national commercial payer in-network code implementations, which created temporary collections drag. Furthermore, sequential quarterly revenue stability between Q1 and Q2 2026 was impacted by a lower true-up revenue contribution in Q2, even as underlying core volume expanded 8% sequentially. Managing payer cash conversion cycles is vital as commercial agreements mature."
    claimRefs:
      - "CI002"
      - "CI007"
      - "CI011"
      - "CI012"
      - "CI015"
    tableRefs:
      - "TI002"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit Economics"
    body: "BillionToOne's proprietary Quantitative Counting Templates (QCT) platform delivers notable cost advantages over conventional high-depth next-generation sequencing. By counting single DNA molecules directly, the company minimizes sequencing instrument overhead and chemistry waste. Corporate gross margin expanded from 53% in 2024 to 68% in 2025, reaching 73% in Q1 2026 with gross profit of $79.1 million on cost of revenue of $29.3 million. Average cost per delivered test stood at approximately $154 in Q1 2026. However, unit cost dynamics are shifting: scaling oncology liquid biopsy assays introduces near-term margin dilution due to higher consumables and flow-cell sequencing requirements compared to mature prenatal panels. Additionally, the aggressive addition of 70 commercial sales representatives in the first half of 2026 increased operating expenses and introduced temporary rep productivity dilution before expected payback in late 2026."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-underwriting-verdict"
    title: "Capital Adequacy and Underwriting Verdict"
    body: "BillionToOne holds an exceptionally strong balance sheet following its public listing, closing 2025 with $496.0 million in cash and cash equivalents and expanding reserves to $537.5 million by March 31, 2026. The business achieved self-sustaining operational cash flow in Q1 2026, generating $11.0 million in cash flow from operations net of capital expenditures. Unlike capital-dependent diagnostic peers that continue to burn substantial equity, BillionToOne has demonstrated positive GAAP operating income of $17.8 million and expects continued profitability for full-year 2026. From an underwriting perspective, the business has moved past venture refinancing risk. However, institutional diligence must monitor three key areas: exposure to commercial payer denial cycles exemplified by $10 million in deferred claims, gross margin resilience as dilutive oncology volume grows, and the capital efficiency of scaling the dedicated oncology laboratory facility."
    claimRefs:
      - "CI003"
      - "CI006"
      - "CI009"
      - "CI010"
      - "CI011"
