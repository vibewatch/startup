  topStrengths:
    - Strong revenue growth with GAAP operating profitability and high gross margin.
    - Large in-network payer footprint and commercial adoption across prenatal and oncology workflows.
    - Public listing provides liquidity and a clearer valuation reference point than the private stage.
  topRisks:
    - Payer concentration, denial rates, and product-level gross margins remain partly undisclosed.
    - Pending litigation and regulatory uncertainty create reputational and legal overhang.
    - Current valuation still lacks a fully diluted share-count bridge and same-date comparable set.
  unresolvedGaps:
    - >-
      Current headcount is still not publicly disclosed with full operating detail; the best public marker is still a
      third-party estimate.
    - >-
      Payer concentration, denial rates, true underlying ASP durability, and product-level gross margins remain
      undisclosed, limiting confidence in how repeatable the recent revenue acceleration really is.
    - >-
      The precise economics of the note-purchase / non-dilutive financing facility remain unclear, including tranche
      conditions, pricing, and any warrant or covenant overhang.
    - >-
      Public materials describe Epic workflow benefits but do not quantify live site counts, go-live timelines, or the
      share of orders routed through Aura or MyChart.
    - >-
      The reviewed sources do not quantify the likely cost, timing, or operational impact of the Illumina and
      Swieczkowski litigation.
    - >-
      A fully diluted cap-table bridge and current valuation framing beyond simple market cap remain missing,
      constraining more aggressive upside underwriting.
