company:
  name: "BillionToOne"
chapter:
  number: 8
  title: "Valuation"
  summary: "BillionToOne's first-quarter 2026 growth, margin, profitability, and liquidity support a positive operating thesis, but the assigned evidence does not establish a current share price, fully diluted capitalization, enterprise value, or comparable-company multiple set. The appropriate stance is therefore Track / Research More rather than Buy: require a current valuation bridge and corroborated public comparables before underwriting an entry price or target return."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: >-
      The operating evidence is strong but not sufficient for a price-sensitive Buy decision. BillionToOne
      reported first-quarter 2026 revenue of $108.4 million, 84% year-over-year growth, a 73% gross margin,
      and $17.8 million of operating income. It also held $537.45 million of cash and cash equivalents against
      $90.005 million of long-term debt at March 31, 2026. Those figures support a constructive company-quality
      view, while management's $450 million to $465 million 2026 revenue guidance provides a measurable
      execution benchmark. However, no assigned source supplies a current share price, fully diluted share
      count, market capitalization, enterprise value, or independently benchmarked trading multiple as of the
      run date. The recommendation is therefore Track / Research More with medium confidence and high
      valuation uncertainty, not a price target or implied return presented with false precision.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-history-and-evidence-quality"
    title: "Financing History, Preferences, and Evidence Quality"
    body: >-
      Historical financing records are useful context but do not substitute for current public-market valuation.
      Forge reports a $130.47 million Series D at a $1.25 billion post-money valuation, while Tracxn reports a
      $130 million Series D at a $1 billion post-money valuation. The sources also disagree on cumulative
      capital raised: Tracxn reports $389 million, FundedIQ reports $249 million across four recorded rounds,
      and Forge reports $396.39 million. These differences reflect unlike round coverage and possible treatment
      of debt, grants, and extensions, so none should be treated as cash available today. Forge's historical
      Series D record shows a 1.2x liquidation-preference multiplier and 1.2x conversion ratio, but the assigned
      evidence does not establish whether any equivalent economic overhang survived the November 2025 public
      listing. A fully diluted capitalization bridge and current security terms remain required diligence.
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: >-
      Scenario analysis should be anchored to observable operating signals rather than invented valuation
      ranges. The bull signal is performance above the high end of the $450 million to $465 million revenue
      guide while preserving the reported 73% gross margin and positive operating income. The base signal is
      delivery within guidance with continued profitability and liquidity discipline. The bear signal is a
      guidance miss, material margin reversal, renewed operating losses, or a deterioration in the cash-to-debt
      position. FundedIQ's statement that the latest $130 million round exceeded its $8.1 million biotechnology
      round-size median is a financing-size benchmark, not a valuation multiple and not evidence of public-share
      upside. Because the pool lacks current enterprise value and comparable trading multiples, each scenario's
      valuation range and target return remain explicitly unquantified pending the same diligence bridge.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV014"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-decision-triggers"
    title: "Exit Readiness and Final Diligence Triggers"
    body: >-
      BillionToOne is already public according to Tracxn, which records a November 6, 2025 listing, so the
      decision is public-market entry discipline rather than a private-company exit forecast. The available
      valuation summaries are not reliable enough to set that entry point: one Silicon Valley Investment Club
      page displays a $2.7 billion IPO valuation but separately describes approximately $1.4 billion, and
      EquityZen still withholds valuation and stock-price information behind registration while presenting the
      company in a pre-IPO marketplace frame. The view would improve only after reconciling current basic and
      diluted shares, options and warrants, debt and cash, and a same-date public comparable set. The thesis
      breaks if guidance, gross margin, profitability, or liquidity deteriorates before valuation support is
      established; it strengthens if those measures persist and the resulting enterprise multiple offers a
      documented discount or justified premium to relevant diagnostics peers.
    claimRefs:
      - "CV013"
      - "CV015"
      - "CV016"
      - "CV004"
      - "CV005"
      - "CV006"
