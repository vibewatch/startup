  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              运营证据很强，但不足以支持对价格敏感的 Buy 决策。BillionToOne 报告 2026 年第一季度收入 $108.4 million，同比增长 84%，毛利率 73%，营业收入 $17.8
              million；截至 2026 年 3 月 31 日，公司现金及现金等价物 $537.45 million，长期债务 $90.005 million。这些数字支持对公司质量的积极判断，管理层 $450
              million–$465 million 的 2026 收入指引也提供了可衡量的执行基准。但指定来源没有提供运行日期的当前股价、完全稀释股数、市值、企业价值或独立基准交易倍数。因此建议为中等信心、高估值不确定性的
              Track / Research More，而不是给出虚假精确的目标价或隐含回报。
