  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 诊断产品组合与临床工作流
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 销售覆盖生殖健康和精准肿瘤学的分子诊断检测，核心是无创分析无细胞 DNA（cfDNA）。产前筛查旗舰 Unity Complete
              只需一次母体采血，孕九周起即可评估单基因隐性疾病（镰状细胞病、囊性纤维化、脊髓性肌萎缩等）和染色体非整倍体风险，无需父亲样本。2026 年 5 月，公司推出 Unity Confirm，利用专有 Fetal
              Cell Capture 技术从母体外周血分离完整胎儿细胞，提供循环胎儿细胞确认检测，避免绒毛膜取样或羊膜穿刺的流产风险。精准肿瘤学方面，Northstar
              系列用单分子下一代测序服务不同适应症：Northstar Select 检测可行动的体细胞基因组改变以指导治疗选择；Northstar Response 将循环肿瘤 DNA 的肿瘤比例量化至
              0.01%，监测治疗反应并预测免疫治疗结果；Northstar Origin 判断原发灶不明癌症的组织来源。所有产品都依赖整合式医疗门户，协调临床下单、样本追踪、实验室状态沟通和 Salesforce CRM
              数据同步。
            claimRefs:
