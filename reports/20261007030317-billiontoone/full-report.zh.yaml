      - number: '8.2'
        title: 融资历史、优先权与证据质量
        blocks:
          - type: paragraph
            body: >-
              历史融资记录可作背景参考，但不能替代当前公开市场估值。Forge 报告称 Series D 融资额为 $130.47 million，投后估值为 $1.25 billion；Tracxn 则报告融资额为 $130
              million，投后估值为 $1 billion。各来源对累计募资额也有分歧：Tracxn 报告 $389 million，FundedIQ 报告四轮记录合计 $249 million，Forge 报告
              $396.39 million。这些差异源于覆盖的轮次不同，以及对债务、赠款和增资延期的处理可能不同，因此不能把其中任何数字视为公司今天可用的现金。Forge 的历史 Series D 记录显示，清算优先权倍数为
              1.2x，转换比例为 1.2x；但现有证据无法确认类似的经济负担是否在 2025 年 11 月上市后仍然存在。尽调仍需完整稀释口径的资本结构桥接表和当前证券条款。
