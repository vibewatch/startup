              Swieczkowski v. BillionToOne 中驳回公司驳回动议表明：医生依赖宣传性的 NIPT 灵敏度表述、却未收到完整多页免责声明时，检测实验室不能据此在 Illinois
              消费者欺诈法下免责。若相关指控获认证或扩大，针对产前筛查假阴性沟通的诉讼可能造成重大舆论和赔偿暴露。
