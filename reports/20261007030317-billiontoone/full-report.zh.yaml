      - number: '7.2'
        title: 运营供应链与依赖脆弱性
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的运营扩张在硬件、试剂和商业收入上存在关键单点依赖。经审计的 SEC
              披露确认，公司依赖少数供应商（包括唯一或单一来源供应商）提供专业下一代测序仪、专有试剂、采血管和临床处理所需资本设备。管理层估计更换关键供应商需 1 至 9 个月，涉及检测重构、生物信息学重新校准，以及按
              CLIA 和 CAP 标准重新临床验证。公司力求维持至少 3 个月原材料库存，但主要测序供应商长期中断会威胁持续检测周转。商业依赖也集中在单一产品垂直领域：2026 年第一季度产前检测收入 $96.5
              million，占临床收入 $108.4 million 的 89.0%，说明商业流入依赖 OB-GYN 采用。Northstar Select 和 Northstar Response 第一季度收入 $10.7
              million、同比快速增长，但非产前产品仍处商业早期。运营连续性还依赖复杂的第三方支付方关系；超过 90% 收入来自受数月申诉周期和可变对价调整影响的医保报销。
            claimRefs:
