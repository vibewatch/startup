      - number: '8.3'
        title: 乐观、中性与悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              情景分析应锚定可观察的经营信号，而不是臆造估值区间。乐观信号是收入超过 $450 million 至 $465 million 指引的上限，同时维持报告中的 73%
              毛利率和正经营利润。中性信号是在指引范围内交付，并继续保持盈利和流动性纪律。悲观信号包括未达指引、利润率大幅反转、经营亏损重现，或现金与债务状况恶化。FundedIQ 称最近一轮 $130 million
              融资超过其 $8.1 million
              生物科技融资轮额中位数；这只是融资规模基准，不是估值倍数，也不是公开市场股价上行空间的证据。由于现有资料缺少当前企业价值和可比公司交易倍数，各情景的估值区间和目标回报在完成同一套尽调桥接前仍明确无法量化。
