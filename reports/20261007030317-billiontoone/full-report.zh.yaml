  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 产前检测与液体活检的市场格局
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 同时布局产前遗传学和精准肿瘤学，以专有 Quantitative Counting
              Template（QCT）平台对抗成熟诊断巨头和专业基因组创新者。产前检测方面，市场领导者的传统无创产前检测（NIPT）主要筛查 21、18、13
              三体等胎儿染色体非整倍体；遗传性隐性单基因疾病通常先做母体携带者筛查，母亲为携带者后再检测父亲，但父亲样本常常缺失或延迟，真实临床检出率因此受限。BillionToOne 的 UNITY
              平台直接从一管母体血液的无细胞 DNA 中同时评估胎儿染色体异常和严重隐性单基因疾病风险，包括囊性纤维化、脊髓性肌萎缩、镰状细胞病和地中海贫血，无需伴侣检测，解决了这一工作流瓶颈。公司还通过 Northstar
              系列进入肿瘤液体活检市场：Northstar Select 做基因组分析，Northstar Response 监测治疗反应，新增 Northstar Origin 判断组织来源。肿瘤领域竞争完全不同，公司面对
              Guardant Health、Foundation Medicine 和 Natera 等根基深厚的诊断龙头；这些平台拥有大量前瞻性临床试验验证、广泛的 Medicare MolDX
              报销认定和成熟的机构医生采用。
            claimRefs:
              - CP001
