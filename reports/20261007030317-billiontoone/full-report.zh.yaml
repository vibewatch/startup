      - number: '5.3'
        title: 软件基础设施、安全控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的运营扩展和监管体系依赖定制云与门户基础设施，在严格 HIPAA 合规规则下处理受保护健康信息（PHI）。与 DjangoStars 合作开发的对外临床门户采用
              Python/Django 和 Flask 后端，部署在使用 PostgreSQL 关系数据库的 Amazon Web
              Services（AWS）上。门户自动在下单产科医生、肿瘤医生、采血网络和内部实验室信息系统（LIMS）之间传输医疗数据，消除人工转录错误并自动更新 Salesforce CRM。企业安全与合规治理由
              SafeBase 驱动的 Trust Center 维护，透明呈现 SOC 2 Type II 控制、HIPAA 防护和第三方风险评估。主要技术风险在于实验室自动化扩张、生物信息学计算成本和集成依赖。smNGS
              为可靠计数单分子而为每名患者生成大量测序数据，云存储和管线计算因此开支显著；机器人液体处理平台、合成 QCT 寡核苷酸供应链或第三方 CRM 与 EHR
              同步一旦中断，就可能延迟样本周转，直接威胁高通量临床实验室运营。
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
