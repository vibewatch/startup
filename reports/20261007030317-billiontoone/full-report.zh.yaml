        - 跟踪 / 继续研究
        - 当前运营证据强劲；指定证据中缺少当前价格和企业价值。
        - 在完成估值桥接前，不要据此买入。
      - - 信心
        - 对运营判断中等；对估值判断低
        - 2026 年第一季度财务指标详细，但当前市场数据缺失。
        - 将运营信心与价格信心分开。
      - - 风险评级
        - 估值不确定性高
        - 历史估值记录相互冲突，无法确定报告日市场价值。
        - 要求的安全边际应宽于单凭运营势头所暗示的水平。
      - - 估值立场
        - 未确定
        - 没有有支撑的当前市值、企业价值或公开可比公司倍数集合。
        - 将任何精确估值区间视为待解决的尽调事项。
      - - 入场纪律
        - 有条件
        - 使用当前完全摊薄企业价值及同日期诊断公司可比数据。
        - 只有持续增长、利润率和盈利能力足以证明溢价合理时才推进。
    notes: 运营指标来自公司发布的 2026 年第一季度公告；由于指定来源未提供当前且相互印证的企业价值桥接，估值结论暂不作出。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 议题
      - 论点
      - 反论点
      - 哪些情况会改变判断
    rows:
      - - 增长
        - 2026 年第一季度收入同比增长 84%。
        - 单个季度不能证明多年增长具备持续性。
        - 连续多个季度达到或超过指引，且口径一致。
      - - 经济性
        - 第一季度毛利率为 73%，营业收入为 $17.8M。
        - 本表尚未证明其能跨越产品组合和报销周期保持稳定。
        - 产品组合变化期间毛利率稳定且营业收入为正。
      - - 流动性
        - 截至 2026 年 3 月 31 日，现金及现金等价物显著高于已报告的长期债务。
        - 现金不等于企业价值，现金池也无法提供当前摊薄后资本结构。
        - 一份纳入全部债务、认股权证、期权和摊薄因素的核对后 EV 桥接。
      - - 融资历史
        - 2024 年 D 轮建立了可观的机构融资支持。
        - 各来源对投后估值和累计融资覆盖范围存在分歧。
        - 原始融资文件或已提交的资本结构记录。
    notes: 本表将已报告的会计和融资事实与估值推断区分开；相互冲突的私募轮数据予以保留，不作平均。
