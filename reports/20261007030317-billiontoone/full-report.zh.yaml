            body: >-
              在 2025 年 11 月 IPO 前，BillionToOne 通过多轮风险股权融资和非稀释性信贷工具累计募资超过 $400 million。重要私募融资包括 2020 年 $15 million A
              轮、后续增长轮、Premji Invest 于 2024 年 6 月领投的 $130 million D 轮（估值 $1.25 billion），以及 Oberland Capital 于 2024 年 9
