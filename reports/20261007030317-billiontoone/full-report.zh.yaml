      - number: '5.2'
        title: QCT 分子计数架构与实验室运营
        blocks:
          - type: paragraph
            body: >-
              公司临床检测的核心技术差异化来自专利 QCT 分子计数平台，通过单分子下一代测序（smNGS）执行。传统 cfDNA 测序用 PCR 扩增目标 DNA，但扩增动力学不均会制造背景噪声，掩盖低于 0.1%–1%
              等位基因频率的稀有变异。BillionToOne 以四阶段计数绕开这一限制：将已知分子浓度的可追踪合成 DNA 片段（QCT）与未知目标片段一起加入血浆；二者以相同反应速率进行竞争 PCR；测序后同时读取合成
              QCT 和内源片段数量；生物信息学管线计算精确扩增倍数，量化原始样本中的绝对目标 DNA 分子数。运营在 Menlo Park 和 Union City 的高复杂度 CLIA 认证、CAP
              认可实验室进行。高通量自动化依赖 Agilent Bravo、Hamilton STAR 和 Beckman Coulter Biomek 等机器人液体处理器。2026 年第一季度交付量达到 188,000
              项后，流程工程团队实施统计过程控制、Six Sigma 和自动错误追踪，防止吞吐瓶颈并维持分析周转时间。
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
              - CE015
