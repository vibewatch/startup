      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 以工作流整合作为产前业务的切入口
            body: >-
              BillionToOne 对 Natera 和全国性实验室 incumbent 的主要切入口是工作流整合。标准 OB-GYN
              流程要先订购母体携带者筛查，等待阳性结果，再联系生父复查，期间常出现失联或患者流失。母亲检测阳性后，UNITY 直接测量胎儿无细胞 DNA，省去父亲环节；真实携带者风险检出率由约 41% 提升至超过
              98%，并通过一次采血交付统一报告。
            calloutType: insight
            claimRefs:
              - CP002
              - CP008
              - CP011
          - type: callout
            title: 肿瘤业务中在位支付方与签约的不对称
            body: >-
              BillionToOne 在产前筛查快速渗透，但肿瘤液体活检系列面对拥有结构性签约壁垒的成熟对手。Guardant Health、Foundation Medicine 和 Natera 已获得 Medicare
              MolDX 覆盖、更多私立支付方网络内合同及 FDA 伴随诊断认定，并影响机构肿瘤治疗路径。要替代这些 incumbent，公司需要大量前瞻性临床试验数据证明结果更优，还要进行深入的健康经济学论证。
