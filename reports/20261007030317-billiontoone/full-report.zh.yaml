              BillionToOne 形成覆盖产前遗传学和精准肿瘤学的双市场商业架构，临床下单者与经济支付方在结构上分离。产前诊断主要由 OB-GYN、母胎医学专家和医院临床实验室负责人采购下单，最终支付方则是商业健康计划和
