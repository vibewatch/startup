  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行或确认触发条件
    rows:
      - - 乐观
        - 收入超过 $465M 的高端指引，毛利率维持在 73% 附近或以上，营业收入保持为正。
        - 在取得当前 EV 和可比倍数前，无法支持估值区间；上行空间的前提是入场倍数没有预先计入执行结果。
        - 只有已报告业绩超预期后，信号才会增强。
        - 若利润率压缩或重新出现营业亏损，情景失效。
      - - 基准
        - 收入落在 $450M 至 $465M 之间，同时保持盈利和有纪律的流动性管理。
        - 无法支持估值区间；将当前 EV / 收入和 EV / 营业收入指标与同日期诊断公司同行比较。
        - 与管理层当前指引最直接一致。
        - 若指引修订，或现金和债务出现重大变化，则重新评估。
      - - 悲观
        - 收入低于指引、毛利率大幅反转、营业亏损再现，或流动性转弱。
        - 没有当前入场价值就无法量化下行空间；完成 EV 桥接后，要求明确的压力情景倍数。
        - 在建立价格支撑前，运营证据若转弱，悲观概率上升。
        - 指引未达标、利润率大幅下降、营业亏损或净现金恶化。
    notes: 这些是受证据约束的情景条件，而非预测；概率信号为定性判断，估值区间仍是已记录的缺口，而不是无依据的点估计。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 2016 至 2026 年公司、技术、融资和商业关键里程碑的时间顺序演进。
    data:
      items:
        - label: 2016：公司成立
          detail: Dr. Oguzhan Atay 和 Dr. David Tsao 在 Menlo Park 创立公司，开发单分子计数诊断技术。
          claimRefs:
            - CO002
        - label: 2017：种子轮融资
          detail: 获得早期种子资金，用于构建定量计数模板（QCT）初始原型。
          claimRefs:
            - CO013
        - label: 2020：A 轮融资
          detail: 完成 $15M A 轮融资，推进 UNITY 产前筛查的商业化开发。
          claimRefs:
            - CO012
        - label: 2022：C 轮扩张
          detail: 分多批完成总额超过 $170M 的 C 轮融资，用于扩建实验室基础设施和商业团队。
          claimRefs:
            - CO013
        - label: 2023：Northstar 肿瘤业务推出
          detail: 推出 Northstar Select 和 Northstar Response 液体活检检测，用于晚期癌症治疗方案选择。
          claimRefs:
            - CO006
        - label: 2024：D 轮与债务融资
          detail: 获得 Premji Invest 领投的 $130M D 轮融资，估值 $1.25B；随后从 Oberland Capital 获得 $140M 债务融资额度。
          claimRefs:
            - CO008
            - CO013
        - label: 2025：纳斯达克首次公开募股
          detail: 以股票代码 BLLN 在 Nasdaq Global Select Market 完成 IPO；员工人数超过 500 人。
          claimRefs:
            - CO001
            - CO005
        - label: 2026：实现盈利并扩展产品组合
          detail: 2026 年第一季度收入达到 $108.4M，GAAP 营业收入为正；推出 Unity Confirm 和 Northstar Origin，并将 2026 财年指引上调至 $450M-$465M。
          claimRefs:
            - CO009
            - CO014
            - CO015
