      - number: '7.3'
        title: 综合风险评估与投资逻辑破裂触发因素
        blocks:
          - type: paragraph
            body: >-
              对 BillionToOne 的投资判断，需要在临床检测量加速和高毛利率与监管、法律、依赖性尾部风险之间权衡。综合评估有三项需机构投资者持续监控的投资逻辑破裂触发因素：第一，Swieczkowski
              诉讼出现不利裁决或合并集体诉讼，会损害 OB-GYN 下单网络的商业信任，并可能推翻围绕单分子计数精度的营销表述；第二，供应链配给或针对主要测序硬件厂商的贸易监管限制，会打断实验室吞吐并耗尽 3
              个月库存缓冲；第三，第三方支付方抵制，例如限制性无创产前筛查报销政策或拒绝覆盖扩展携带者微缺失，会直接压低 ASP 并压缩营业利润率。持续尽调必须严格跟踪 Illinois Northern District
              法院案卷节点、CDPH 和 CLEP 的州实验室检查结果，以及肿瘤季度收入是否摆脱纯产前依赖而实现多元化。
