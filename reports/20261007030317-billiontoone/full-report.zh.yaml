  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险架构
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 所处的诊断环境监管密集，法律暴露和监管监督构成重大尾部风险。2024 年 10 月，Monika 和 Artur Swieczkowski 在 Illinois Northern
              District 起诉公司，指控 UNITY Complete 产前筛查违反 Illinois Consumer Fraud and Deceptive Business Practices
              Act（ICFA），并构成普通法欺诈和过失失实陈述。诉状称营销材料强调 99.9% 灵敏度和无创确定性，却未充分披露独立研究报告的 Trisomy 18 真实假阴性率最高达 7.9%。2025 年 8 月 28
              日，主审法官 Sharon Johnson Coleman 驳回公司 Rule 12(b)(6) 驳回动议，否定医生收到简化结果单且没有明确假阴性警告时可由 learned intermediary
              doctrine 免责的抗辩。公司 2025 年 Form 10-K 认为不利结果不太可能或无法估计，因此未计提诉讼准备金；但案件经受驳回审查仍使其面临无上限惩罚性赔偿和 OB-GYN
              网络声誉损害。除诉讼外，公司所有现有基因检测均作为联邦 CLIA 认证、CAP 认可下的 LDT 销售。FDA 虽撤销近期 LDT 监管规则，潜在联邦立法或 FDA 重新执法仍让 California 和 New
              York 持证设施长期面临合规不确定性。
