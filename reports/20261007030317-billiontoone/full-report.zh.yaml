      - number: '3.2'
        title: 竞争对手画像、规模与技术取舍
        blocks:
          - type: paragraph
            body: >-
              竞争对手在技术路线、商业规模和市场集中度上差异明显。产前诊断中，Natera 凭借基于 SNP 的 Panorama 估计占美国 NIPT 市场 60%，BillionToOne 则快速取得约
              15%。Natera 将 Panorama 染色体非整倍体检测与 Horizon 携带者筛查分开提供；BillionToOne 则在 UNITY Complete 中整合非整倍体、单基因胎儿风险和胎儿 RhD /
              抗原检测。Labcorp（MaterniT21）和 Quest Diagnostics（QNatal Advanced）拥有庞大的物流分发网络、医院关系和患者服务中心，但其标准 NIPT
              主要覆盖整条染色体非整倍体及部分微缺失，并不整合单基因胎儿风险。Myriad Genetics 将 Prequel NIPT 与 Foresight
              携带者筛查配套，同样需要采集父亲样本判断胎儿遗传风险。肿瘤液体活检方面，Guardant Health 以获 FDA 批准的 Guardant360 CDx 主导治疗选择；Foundation Medicine
              的 FoundationOne Liquid CDx 借助 Roche 的全球商业规模和广泛伴随诊断标签；Natera 的 Signatera 以个体化肿瘤知情测序领先 MRD
              和纵向监测。BillionToOne 宣称 Northstar Select 和 Northstar Response 在更低 VAF
              下具备更高分析灵敏度，并采用组织无关的甲基化监测，但其肿瘤临床量和第三方覆盖成熟度明显落后于主要液体活检对手。
            claimRefs:
