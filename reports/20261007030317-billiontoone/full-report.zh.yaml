  - id: FE001
    title: 诊断平台技术与运营架构栈
    type: stack
    summary: 将 BillionToOne 的精准诊断技术栈从临床前端接入拆解至分子计数化学。
    data:
      layers:
        - label: 临床界面与集成层
          detail: 部署在 AWS 上的 Django/Flask 网页门户连接诊所、实验室和 Salesforce CRM，用于订单登记及符合 HIPAA 要求的报告分发
        - label: 实验室机器人与自动化层
          detail: Agilent Bravo、Hamilton STAR 和 Biomek 液体处理器在 CLIA/CAP 设施中自动执行 DNA 提取和文库制备
        - label: 高通量测序层
          detail: 新一代测序仪读取共同扩增的患者 cfDNA 片段和合成计数模板
        - label: 生物信息学与定量倍增层
          detail: 专有算法对测序读段进行解卷积，计算扩增倍数，从而测量原始目标分子的丰度
        - label: 合成校准化学层
          detail: 向血浆样本中加入定量计数模板（QCT），为 PCR 共同扩增建立精确的内部校准标准
        - label: 单分子分辨率层
          detail: 单分子计数化学技术支持检测低至 0.01% 变异等位基因频率和肿瘤分数阈值的游离 DNA
    approximationNotes: 平台架构抽象总结自官方技术规格、工程岗位招聘需求和供应商集成文档。
    claimRefs:
      - CE002
      - CE008
      - CE010
      - CE011
      - CE014
      - CE015
  - id: FU001
    title: BillionToOne 客户旅程与医疗提供方参与生命周期
    type: journey-map
    summary: 多阶段临床医生参与模型，展示医疗提供方从认知、EHR 下单、样本处理到纵向监测的各个触点。
    data:
      items:
        - label: 临床认知与证据
          touchpoints:
            - 医学会议专题研讨会（ACOG、ASCO、SMFM）及经同行评审的临床验证研究
            - 现场商务专员和医学事务临床联络员直接参与
            - 专业协会指南及围绕单基因 cfDNA 的教育推广
        - label: 付款方核验与准入
          touchpoints:
            - 核实覆盖 3 亿名签约商业保险和 Medicaid 参保人的网络内资格
            - 事先授权核验及患者自付账单透明工具
            - 与付款方医学主任协调，确保分子检测符合承保范围要求
        - label: 工作流集成与下单
          touchpoints:
            - 通过 Aura diagnostics 套件在 Epic EHR 内一键生成原生电子订单
            - 门诊采血套件和单份孕妇血样采集流程
            - 预填充检测申请面板，无需分别下单携带者筛查和 NIPT
        - label: 集中式 CLIA 实验室处理
          touchpoints:
            - 在 Union City CLIA 认证实验室完成样本接收登记和高通量处理
            - 使用专有 QCT smNGS 测序检测进行单分子定量计数
            - 执行全面的实验室质量控制和临床生物信息学流程
        - label: 结果交付与临床决策支持
          touchpoints:
            - 离散诊断数据直接回流至 Epic 中患者的电子健康记录
            - 患者和医疗提供方可通过 MyChart 门户查看可执行的结果可视化
            - 通过 UNITY Confirm 获得遗传咨询师支持和快速反射确认路径
        - label: 纵向护理与扩张循环
          touchpoints:
            - 在后续妊娠期间重复筛查，并扩大产科检测组合的采用
            - 跨专科医生将患者转介至 Northstar 肿瘤液体活检应用
            - 使用 Northstar Response 纵向监测癌症治疗反应并追踪复发
    approximationNotes: 基于已发布的企业集成和临床研究方案，展示概括性的商业与临床工作流触点。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU007
      - CU010
      - CU012
