companyProfile:
  summary: >-
    BillionToOne 是一家商业化阶段的精准分子诊断公司，利用专有的 Quantitative Counting Templates
    平台提供产前筛查和肿瘤液体活检检测。公司已从风险资本支持的增长阶段进入公开市场阶段，近期收入增长强劲、盈利能力改善，商业化部署规模也在扩大。
  foundedDate: '2016-01-01'
  founders:
    - name: Dr. Oguzhan Atay, PhD
      role: 联合创始人、董事长兼 CEO
      background: 受过 Stanford 训练的科学家，也是 QCT 平台的共同发明人。
    - name: Dr. David Tsao, PhD
      role: 联合创始人兼总裁 / CTO
      background: 负责平台架构和产品开发的科学联合创始人。
  foundingLocation: Menlo Park, California, USA
  headquarters: Menlo Park, California, USA
  productSummary: 基于 QCT 单分子计数平台的产前筛查和肿瘤液体活检分子诊断检测。
  customerFocus: 妇产科、母胎医学、肿瘤科及医疗系统实验室工作流
  businessModel: 按服务收费的临床诊断业务，由商业保险支付方、Medicaid 及其他健康计划报销
  stage: Public
  fundingStatus: 上市公司；历史融资包括 2024 年 6 月的 $130M D 轮融资及此前的风险投资轮次。
  disclosureProfile: public
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与企业演进
        blocks:
          - type: paragraph
            body: >-
              BillionToOne, Inc. 于 2016 年在 Delaware 注册成立，总部位于 California 的 Menlo Park。公司于 2025 年 11 月在 Nasdaq Global
              Select Market 上市，股票代码为
              BLLN，从风险投资支持的初创公司转型为高速增长的商业企业。公司创立使命是打造准确、可及的基因检测，改变医疗决策，先从无创产前筛查做起，再系统拓展至临床肿瘤诊断。所有商业产品线的底层技术资产都是获得专利的
              Quantitative Counting Templates（QCT）技术，即可直接在单分子层级计数 DNA 片段的专有 smNGS（单分子下一代测序）平台。公司通过标准母体或患者采血获得无细胞
              DNA（cfDNA），量化其中极微小的生物学变化，从而无需羊膜穿刺或手术组织活检等侵入性操作。
