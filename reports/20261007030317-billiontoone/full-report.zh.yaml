      - number: '3.3'
        title: 壁垒持久性、切换成本与在位巨头应对
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的竞争壁垒有两根支柱：专有 QCT 分子计数化学带来的分析灵敏度和 PCR
              误差降低，以及为产科医生消除父亲检测摩擦的简化临床流程。产前护理中，用一次母体采血替代双亲多步骤检测，能显著提高 OB-GYN 诊所效率，带来较高医生留存和快速放量。但商业诊断的切换壁垒并不对称：独立
              OB-GYN 诊所可轻易更换或多家外送产前检测；大型医疗系统和整合式医疗网络却受制于与 Labcorp 或 Quest Diagnostics
              的企业参考实验室合同，这些合同打包数百项常规检测。肿瘤液体活检的切换成本更高：已使用 Guardant360 或 FoundationOne 的肿瘤医生受益于机构 EHR
              集成、自动病理反射流程和既有事前授权支持；Natera 的 Signatera 则因 MRD 需要先进行肿瘤组织测序再连续采血而形成结构性锁定。另一方面，BillionToOne
              依赖专有实验室开发检测（LDT）框架，容易受到监管审查和支付方覆盖摩擦影响。Natera 等 incumbent 通过激进签约和反向推广守住份额，公司必须持续证明灵敏度能转化为更优健康经济学和持久报销。
