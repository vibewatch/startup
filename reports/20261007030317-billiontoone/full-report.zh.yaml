              治疗监测检测的核心下单者。患者自付额会直接影响医生下单配合和样本完成率，因此商业可行性高度依赖广泛的网络内保险合同。2026 年初，公司将网络内覆盖扩大至美国约 3 亿签约人群，占全国受保人群超过
              90%，此前已与 Anthem、UnitedHealthcare 等主要全国支付方连续签约。
