      - number: '8.4'
        title: 退出准备度与最终尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              Tracxn 记录 BillionToOne 已于 2025 年 11 月 6 日上市，因此当前要解决的是公开市场买入纪律，而不是预测私人公司的退出。现有估值摘要不足以确定买入价位：Silicon Valley
              Investment Club 的一个页面显示 IPO 估值为 $2.7 billion，但在另一处又写约 $1.4 billion；EquityZen 仍将估值和股价信息锁在注册之后，同时把公司放在 IPO
              前交易平台的框架中。只有核对当前基本股数和稀释后股数、期权与认股权证、债务与现金，以及同日的公开市场可比公司后，判断才会改善。若在估值依据建立前，指引、毛利率、盈利能力或流动性恶化，投资论点就会失效；若这些指标保持稳定，且由此得到的企业价值倍数相对相关诊断公司体现有据可查的折价或有理有据的溢价，论点则会增强。
            claimRefs:
              - CV013
              - CV015
              - CV016
              - CV004
              - CV005
