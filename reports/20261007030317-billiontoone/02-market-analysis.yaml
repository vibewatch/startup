schemaVersion: "report-v2"
artifact: market-analysis
slug: billiontoone
runDate: 2026-10-07
company:
  name: BillionToOne
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    BillionToOne participates in two distinct molecular-diagnostics markets: a scaled prenatal
    franchise and a much earlier oncology franchise. Current operating data demonstrate adoption,
    but the assigned evidence does not independently validate the company's 15% prenatal-share
    estimate or its claims of more than $20 billion in late-stage oncology and an additional
    $30 billion in minimal-residual-disease opportunity.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market is narrower than "genetic testing" and should be segmented by clinical
      job. BillionToOne sells laboratory tests for prenatal risk screening, oncology therapy
      selection, and oncology treatment-response monitoring; a September 2026 launch added a
      tissue-of-origin liquid-biopsy application. IncFact classifies the company in Medical
      Laboratories (NAICS 621511), which is useful for industry placement but not for estimating
      addressable spend. The relevant spend is therefore per-test molecular-diagnostic revenue
      attached to these workflows. Obstetric care, cancer treatment, imaging, tissue biopsy, and
      invasive prenatal confirmation are substitutes or adjacent spend rather than part of the
      evidenced revenue boundary. The pool does not establish what portion of those alternatives is
      economically contestable by BillionToOne.
    claimRefs: [CM001, CM002, CM013]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing through commercial and opportunity lenses
    body: >-
      The strongest sizing evidence is bottom-up commercial activity, not a publisher-built TAM.
      BillionToOne reported 188,000 tests delivered in Q1 2026, $96.5 million of prenatal clinical
      testing revenue, and $10.7 million of oncology clinical testing revenue. Those figures measure
      company throughput and revenue, not total market demand. The broader opportunity figures are
      management estimates: roughly 15% U.S. prenatal share in 2024, more than $20 billion for
      late-stage oncology liquid biopsy, and an additional $30 billion for tumor-naive minimal
      residual disease. None includes an assigned-source methodology, geography, price denominator,
      or independently reproduced calculation. They should be treated as strategic category claims,
      not valuation-ready TAM, SAM, or SOM.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption mechanics
    body: >-
      The clinical user and economic buyer vary by segment. OB-GYNs initiate prenatal workflows,
      while oncologists and hospital systems use therapy-selection and response-monitoring results.
      Insurers remain a separate gatekeeper: BillionToOne stated that expanded payer contracts
      reached "300 million contracted lives" in the United States, but the assigned evidence does
      not disclose covered-product mix, reimbursement rates, denial rates, or patient out-of-pocket
      exposure. Q1 growth combined volume and price effects: delivered tests increased 44% while
      overall average selling price rose 28% to $571 from $445. That combination supports observed
      adoption and monetization, yet it does not show which buyer segment drove the improvement or
      whether the price gain is durable.
    claimRefs: [CM002, CM007, CM008, CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-constraints-and-diligence
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Prenatal scale, broader payer contracting, and portfolio expansion are the visible adoption
      drivers. Northstar exceeded 3,000 ordered tests in Q4 2024, while the September 2026 Northstar
      Origin launch widened the oncology use-case set. The constraint case is also material:
      independent commentary identifies reimbursement changes and competitive offerings as key
      risks, and an AI-generated SWOT assessment describes payer negotiation as a major hurdle and
      rivalry with established diagnostics companies as intense. Revenue guidance moved from the
      $415 million-$430 million range cited in January to $450 million-$465 million in May, but this
      trajectory is evidence of company growth rather than proof of category size. Valuation should
      therefore rely on observed volumes, realized ASP, and product-level reimbursement evidence
      until independent market-sizing work closes the present gaps.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
