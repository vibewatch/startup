        - Low precision; company revenue is not market size
      - - Company-estimated prenatal share
        - "2024"
        - United States
        - "Approximately 15%"
        - Company estimate; denominator not disclosed
        - Medium-low; no independent reproduction in assigned evidence
      - - Late-stage oncology liquid-biopsy opportunity
        - "2025 company statement"
        - Not specified
        - "More than $20 billion"
        - Company estimate; methodology and period not disclosed
        - Low for valuation use; not a demonstrated SAM or SOM
      - - Tumor-naive MRD opportunity
        - "2025 company statement"
        - Not specified
        - "Additional $30 billion"
        - Company estimate; methodology and period not disclosed
        - Low for valuation use; product was described as in development
      - - Current commercial throughput
        - Q1 2026
        - Company-wide
        - "188,000 tests delivered"
        - Reported delivered-test count
        - Medium; combines prenatal and oncology tests
    notes: >-
      Values preserve each source's metric, period, and stated scope. Company estimates are not
      independently verified, and no row should be summed with another to create a synthetic TAM.
    claimRefs: [CM001, CM003, CM004, CM005, CM006, CM007]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns:
      - Segment
      - Clinical user
      - Economic gatekeeper
      - Evidenced workflow or trigger
      - Adoption evidence
      - Unresolved budget question
    rows:
      - - Prenatal screening
        - OB-GYN
        - Insurer or patient; split not disclosed
        - Maternal blood draw for fetal-risk analysis
        - "$96.5 million Q1 2026 revenue; 72% year-over-year growth"
        - Product-level reimbursement and denial rates
      - - Oncology therapy selection
        - Oncologist
        - Hospital or insurer; allocation not disclosed
        - Blood-based insights for stage III or IV therapy choice
        - Included in $10.7 million Q1 2026 oncology revenue
        - Ordering-site count, coverage, and realized ASP
      - - Oncology response monitoring
        - Oncologist
        - Hospital or insurer; allocation not disclosed
        - Repeated blood-based monitoring during treatment
        - Northstar products exceeded 3,000 Q4 2024 ordered tests
        - Repeat frequency and retention by account
      - - Payer access
        - Market-access and contracting teams
        - Insurance payer
        - Contract expansion and coverage negotiation
        - Company stated 300 million contracted lives in the U.S.
        - Covered-product mix and paid-claim conversion
    notes: >-
      Buyer and payer roles are limited to those described by assigned sources. Revenue, order,
      contracted-life, and workflow metrics have different denominators and are not conversion stages.
    claimRefs: [CM002, CM009, CM010, CM011, CM012, CM014, CM015]
figures:
  - id: FM001
    title: Evidence-strength pyramid for market sizing
    type: pyramid
    summary: >-
      Reported company throughput and segment revenue form the measurable base, while broad
      opportunity claims sit at the least-verified top of the sizing hierarchy.
    data:
      nodes:
        - label: Delivered tests
          value: 188000
          unit: Q1 2026 tests
          detail: Company-reported total delivered tests across prenatal and oncology.
        - label: Prenatal clinical-testing revenue
          value: 96.5
          unit: USD millions, Q1 2026
          detail: Realized company revenue, not total prenatal-market spend.
        - label: Oncology clinical-testing revenue
          value: 10.7
          unit: USD millions, Q1 2026
          detail: Realized company revenue across oncology products.
        - label: U.S. prenatal share
          value: 15
          unit: percent, 2024 estimate
          detail: Company estimate without an assigned-source denominator.
        - label: Late-stage oncology opportunity
          value: 20
          unit: more than USD billions
          detail: Company estimate with unspecified geography and methodology.
        - label: Tumor-naive MRD opportunity
          value: 30
          unit: USD billions, additional
          detail: Company estimate for a product described as in development.
    approximationNotes: >-
      No values are added or transformed. The 15% share and both billion-dollar opportunities are
      company estimates; "more than $20 billion" is preserved as a lower-bound description.
    claimRefs: [CM004, CM005, CM006, CM007, CM009, CM010]
callouts:
  - calloutType: recommendation
    title: Underwrite adoption, not headline TAM
    body: >-
      Base valuation work on test volumes, realized average selling price, segment revenue, and
      reimbursed claims. Treat the $20 billion and $30 billion opportunity statements as hypotheses
      until independent methodology and a reachable U.S. serviceable market are documented.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
