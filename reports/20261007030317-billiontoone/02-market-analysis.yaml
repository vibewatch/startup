        - Cancer drugs, tissue biopsy, and imaging
        - Oncologist user; hospital and payer budgets not quantified
        - Early oncology commercial wedge
      - - Oncology response monitoring
        - Per-test Northstar Response clinical-testing revenue
        - Treatment delivery and standard-of-care imaging
        - Oncologist user; payer terms not disclosed
        - Repeat-testing opportunity, frequency unverified
      - - Tissue-of-origin liquid biopsy
        - Northstar Origin testing revenue after launch
        - Broader diagnostic workup and imaging
        - Clinical user and budget owner not established in the pool
        - September 2026 adjacency with no disclosed revenue
    notes: >-
      Boundary reflects products and workflows named in assigned sources; excluded spend is not
      counted as addressable revenue, and undisclosed buyer or payer details remain explicit gaps.
    claimRefs: [CM001, CM002, CM013]
