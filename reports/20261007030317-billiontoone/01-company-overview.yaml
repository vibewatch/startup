chapter:
  number: 1
  title: "Company Overview"
  summary: "BillionToOne is a commercial-stage precision molecular diagnostics company (NASDAQ: BLLN) headquartered in Menlo Park, California, leveraging its proprietary Quantitative Counting Templates (QCT) platform for single-molecule resolution in prenatal screening and oncology liquid biopsy. Following its November 2025 Nasdaq listing, the company delivered $108.4 million in Q1 2026 revenue (up 84% year-over-year) and achieved GAAP operating profitability, while expanding total headcount to approximately 749 employees."
sections:
  - id: "company-identity-and-corporate-evolution"
    title: "Company Identity and Corporate Evolution"
    body: "BillionToOne, Inc. is a precision diagnostics company incorporated in Delaware in 2016 and headquartered in Menlo Park, California. The company went public on the Nasdaq Global Select Market under the ticker symbol BLLN in November 2025, transitioning from a venture-backed startup into a high-growth commercial enterprise. BillionToOne was founded with the mission to build accurate, accessible genetic tests that transform healthcare decision-making, beginning with non-invasive prenatal screening and systematically expanding into clinical oncology diagnostics. The foundational technical asset across all commercial product lines is the patented Quantitative Counting Templates (QCT) technology, a proprietary smNGS (single-molecule next-generation sequencing) molecular counting platform capable of directly counting DNA fragments at the single-molecule level. By quantifying minute biological variations from cell-free DNA (cfDNA) obtained via standard maternal or patient blood draws, BillionToOne eliminates the need for invasive procedures such as amniocentesis or surgical tissue biopsies."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO009"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-governance-and-organization"
    title: "Leadership, Governance, and Organizational Scale"
    body: "The company was co-founded by Chief Executive Officer Dr. Oguzhan Atay, PhD, and President and Chief Technology Officer Dr. David Tsao, PhD, both of whom serve on the board of directors and retain central roles in guiding corporate strategy, scientific innovation, and clinical development. Executive leadership has been further strengthened by the appointments of Chief Financial Officer Ross Taylor Jr., Chief Administrative Officer John D. Lister, and dedicated clinical leaders including Chief Medical Officer of Oncology Dr. Ethan Dmitrovsky and VP of Medical Affairs Dr. Allen Chen. According to independent workforce intelligence data from Revelio Labs, BillionToOne employs approximately 749 personnel worldwide as of March 2026, representing an 87.6% increase from 399 employees in 2023. Although earlier press releases in early 2025 noted a milestone of exceeding 500 employees with plans to add 100 staff, external intelligence tracks a workforce heavily concentrated in North America (98.2%), with 38.1% in Finance and Operations, 34.6% in Engineering, and 27.4% in Sales and Marketing."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-traction-and-diligence-posture"
    title: "Capitalization, Commercial Scale, and Diligence Posture"
    body: "Prior to its November 2025 initial public offering, BillionToOne raised over $400 million in total capital across multiple venture equity financings and non-dilutive credit facilities. Notable private funding milestones include a $15 million Series A in 2020, subsequent growth rounds, a $130 million Series D led by Premji Invest in June 2024 at a $1.25 billion valuation, and a $140 million debt financing facility led by Oberland Capital in September 2024. In the first quarter of 2026, total revenue reached $108.4 million (an 84% year-over-year increase from $59.0 million in Q1 2025), driven by $96.5 million in prenatal clinical testing revenue and $10.7 million in oncology revenue across 188,000 delivered tests. The company achieved GAAP income from operations of $17.8 million with a 73% gross margin and raised its full-year 2026 revenue guidance to $450 million to $465 million. Critical diligence items include monitoring employee sentiment shifts amid rapid scaling, ongoing patent and commercial litigation, and the durability of contracted payer lives."
    claimRefs:
      - "CO008"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
