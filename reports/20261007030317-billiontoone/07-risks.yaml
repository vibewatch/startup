callouts:
  - calloutType: "risk"
    title: "Prenatal Screening Liability Precedent"
    body: "The denial of BillionToOne's motion to dismiss in Swieczkowski v. BillionToOne establishes that clinicians relying on promotional NIPT sensitivity claims without receiving full multi-page disclaimer materials does not insulate the testing laboratory under Illinois consumer fraud law. If certified or expanded, claims challenging prenatal screening false-negative communication could create material headline and damages exposure."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "risk"
    title: "Sole-Source Sequencing Bottleneck"
    body: "With key next-generation sequencers and proprietary chemistry sourced from a limited number of specialized instrumentation vendors, replacing an upstream partner requires an estimated one to nine months and comprehensive test revalidation, leaving continuous clinical lab throughput vulnerable to vendor-level supply disruptions."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
