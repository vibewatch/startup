callouts:
  - calloutType: "insight"
    title: "The Strategic Significance of Epic Aura Workflow Integration"
    body: "Securing integration with Epic's Aura diagnostics suite represents a substantial competitive advantage in molecular diagnostics. Traditional specialized laboratory tests frequently suffer from significant requisition friction, requiring clinicians to navigate manual paper requisitions or disjointed third-party portals. By embedding UNITY Complete and Northstar order placement directly into standard clinical workflows and returning discrete data into patient charts, BillionToOne significantly lowers ordering friction across major health systems and community practices."
    claimRefs:
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "Persistent Product Concentration and Incumbent Competitive Pressure"
    body: "With over 90% of 2025 revenue and 89% of Q1 2026 revenue generated by prenatal testing, BillionToOne remains vulnerable to prenatal reimbursement dynamics and competitive countermoves by well-capitalized incumbents like Natera. Long-term commercial durability requires sustaining prenatal market share gains while successfully scaling Northstar liquid biopsy adoption."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU013"
