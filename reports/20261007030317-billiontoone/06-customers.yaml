chapter:
  number: 6
  title: "Customers"
  summary: "BillionToOne's commercial adoption is anchored in maternal-fetal and OB-GYN clinical screening, scaling prenatal test volume to 188,000 delivered units in Q1 2026 with $96.5 million in segment revenue. Commercial durability depends on in-network payer contracts covering roughly 300 million contracted lives alongside clinical EHR distribution via Epic, while high historical revenue concentration in prenatal testing and intensifying competition from established incumbents remain critical diligence factors."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Segmentation and Payer-Provider Architecture"
    body: "BillionToOne operates a specialized dual-market commercial architecture spanning prenatal genetics and precision oncology, where the clinical test orderer and the economic payer are structurally decoupled. In prenatal diagnostics, the primary purchasing and ordering decision-makers are OB-GYN clinicians, maternal-fetal medicine specialists, and hospital-based clinical laboratory directors, while commercial health plans and Medicaid serve as the ultimate payers. In oncology, medical oncologists and oncology clinical trial sponsors represent the core ordering constituents for Northstar Select genomic profiling and Northstar Response therapy monitoring assays. Because patient out-of-pocket exposure directly influences physician ordering compliance and sample completion, commercial viability heavily hinges on broad in-network insurer contracts. By early 2026, BillionToOne expanded its in-network coverage footprint to approximately 300 million contracted lives across the United States, representing over 90% of insured individuals nationwide following successive agreements with major national payers including Anthem and UnitedHealthcare."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-volume-expansion"
    title: "Adoption Trajectory and Volume Scaling"
    body: "Commercial test utilization has expanded rapidly across BillionToOne's clinical laboratory operations. During the first quarter of 2026, the company accessioned 189,000 total tests and delivered 188,000 tests, reflecting a 44% year-over-year increase in delivered testing volume compared to 131,000 tests delivered in the first quarter of 2025. Sequential test delivery volume grew approximately 10% quarter-over-quarter in prenatal screening and approximately 25% quarter-over-quarter in oncology liquid biopsy. This volume expansion drove first-quarter 2026 total revenue to $108.4 million, representing 84% year-over-year top-line growth. Top-line revenue expansion outpaced delivered unit volume growth due to a 28% year-over-year increase in average selling price to $571 per test, supported by expanded carrier panel Medicaid reimbursement codes and favorable payer mix shifts despite seasonal first-quarter deductible resets. While oncology volume grew rapidly, total revenue remains heavily weighted toward prenatal testing, which generated $96.5 million of the $108.4 million total quarterly revenue."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "institutional-deployments-and-workflow-integration"
    title: "Institutional Deployments, Strategic Partnerships, and Workflow Integration"
    body: "To accelerate clinical adoption and streamline routine specimen procurement, BillionToOne has pursued direct workflow integration into enterprise electronic health record systems alongside institutional research partnerships. In December 2025, BillionToOne finalized an agreement with Epic Systems to integrate its prenatal and oncology testing portfolio into Epic's Aura diagnostics suite, enabling ambulatory and health system clinicians to order UNITY Complete and Northstar tests directly within native EHR workflows. Discrete diagnostic results return directly into Epic clinical records and the MyChart patient portal, mitigating ordering friction across community practices and maternal-fetal medicine clinics. In oncology, the company secured institutional validation through the selection of Northstar Select for the LC-SCRUM-TRY clinical study at Japan's National Cancer Center Hospital East, evaluating treatment-resistant solid tumors. These institutional integrations reduce administrative burden and provide clinical decision support at the point of care, though verified metrics detailing exact order percentages routed via Epic or live enterprise health system counts remain undisclosed."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "concentration-risks-and-competitive-durability"
    title: "Customer Concentration, Payer Friction, and Competitive Durability"
    body: "Despite rapid commercial scaling, BillionToOne exhibits significant revenue concentration in prenatal testing, which accounted for $277 million or 90.8% of its $305 million in total revenue during full-year 2025. While oncology testing expanded significantly to $10.7 million in Q1 2026, prenatal screening continues to represent the vast majority of cash collections. Furthermore, molecular diagnostics adoption faces structural payer and competitive hurdles. In prenatal testing, BillionToOne competes intensely against entrenched incumbents including Natera, Labcorp, and Myriad Genetics, all of which maintain extensive clinical sales forces and deep institutional relationships. Furthermore, although contracted lives reached 300 million, underlying test reimbursement remains vulnerable to payer coverage policies, medical necessity denials, and prior-authorization requirements across commercial and Medicaid plans. Diligence must monitor product-level contribution margins, true underlying ASP durability, and whether oncology liquid biopsy adoption can diversify the revenue base before prenatal growth moderates."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU013"
