chapter:
  number: 5
  title: "Product & Technology"
  summary: "BillionToOne pairs its proprietary Quantitative Counting Templates (QCT) single-molecule sequencing chemistry with high-throughput laboratory automation and a Django/Salesforce medical portal to commercialize prenatal screens and oncology liquid biopsies. The technology achieves single-molecule resolution and 0.01% tumor fraction sensitivity, though high clinical volume growth places ongoing pressure on automated liquid handling, bioinformatics compute, and third-party portal integrations."
sections:
  - id: "product-portfolio-and-workflows"
    title: "Diagnostic Product Portfolio and Clinical Workflows"
    body: "BillionToOne commercializes molecular diagnostic assays spanning reproductive health and precision oncology, centered on non-invasive analysis of cell-free DNA (cfDNA). In prenatal screening, its flagship Unity Complete screen provides personalized fetal risk assessments for single-gene recessive conditions—such as sickle cell disease, cystic fibrosis, and spinal muscular atrophy—alongside chromosomal aneuploidies from a single maternal blood draw as early as nine weeks of gestation without requiring a paternal blood sample. In May 2026, the company expanded its reproductive testing portfolio by launching Unity Confirm, a circulating fetal cell-based confirmation assay using proprietary Fetal Cell Capture technology to isolate intact fetal cells from maternal peripheral blood, providing diagnostic confirmation without the miscarriage risks associated with invasive chorionic villus sampling or amniocentesis. In precision oncology, the Northstar suite leverages single-molecule next-generation sequencing across distinct clinical indications: Northstar Select detects actionable somatic genomic alterations to guide therapy selection, Northstar Response quantifies changes in circulating tumor DNA down to 0.01% tumor fraction to monitor treatment response and predict immunotherapy outcomes, and Northstar Origin identifies tissue of origin for cancers of unknown primary. Across all offerings, the commercial workflow depends on an integrated healthcare web portal that coordinates clinical order intake, sample tracking, lab status communication, and Salesforce CRM data synchronization."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE011"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "qct-architecture-and-operating-model"
    title: "QCT Molecular Counting Architecture and Laboratory Operations"
    body: "The core technical differentiator powering BillionToOne's clinical tests is its patented Quantitative Counting Templates (QCT) molecular counting platform, executed via single-molecule next-generation sequencing (smNGS). Traditional cfDNA sequencing techniques amplify target DNA fragments through polymerase chain reaction (PCR) cycles, but non-uniform amplification kinetics create background noise that obscures rare variant signals below 0.1% to 1% allele frequency. BillionToOne bypasses this limitation through a four-stage molecular counting process: synthetic, traceable DNA fragments (QCTs) are spiked into the plasma sample at known molecular concentrations alongside unknown target fragments; target fragments and QCTs undergo competitive PCR amplification at identical reaction rates; post-sequencing readouts measure both synthetic QCT counts and endogenous fragments; and proprietary bioinformatics pipelines calculate an exact amplification multiplier to quantify absolute target DNA molecules present in the original sample. Operational execution occurs within high-complexity CLIA-certified and CAP-accredited clinical laboratories in Menlo Park and Union City, California. High-throughput automation relies on robotic liquid handlers such as Agilent Bravo, Hamilton STAR, and Beckman Coulter Biomek systems for automated sample accessioning, DNA extraction, library preparation, and reagent dispensing. As commercial sample volume scaled to 188,000 delivered tests in the first quarter of 2026, process engineering teams implemented statistical process control, Six Sigma methodologies, and automated error tracking to prevent throughput bottlenecks and maintain analytical turnaround times."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "software-infrastructure-and-governance"
    title: "Software Infrastructure, Security Controls, and Technical Risks"
    body: "BillionToOne's operational scalability and regulatory posture rely on custom cloud and portal infrastructure designed to handle protected health information (PHI) under strict HIPAA compliance rules. The outward-facing clinical portal, developed in partnership with DjangoStars, is built upon a Python/Django and Flask backend deployed on Amazon Web Services (AWS) infrastructure utilizing PostgreSQL relational databases. This portal automates medical data transfer between ordering obstetricians, oncologists, phlebotomy networks, and internal laboratory information systems (LIMS), eliminating manual transcription errors and automating Salesforce CRM updates. Enterprise security and compliance governance are maintained through a formal Trust Center powered by SafeBase, providing audit transparency into SOC 2 Type II controls, HIPAA safeguards, and third-party risk assessments. Key technical risks center on laboratory automation scaling, bioinformatics compute costs, and integration dependencies. Because smNGS generates extensive sequencing datasets per patient to count single molecules reliably, cloud data storage and pipeline compute represent significant operational expenses. Furthermore, any disruption in robotic liquid handling platforms, reagent supply chains for synthetic QCT oligos, or third-party CRM and EHR synchronization can introduce sample turnaround delays that directly threaten high-volume clinical laboratory operations."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE014"
      - "CE015"
      - "CE016"
