- id: cost-base-and-unit-economics
  title: Cost base and unit economics
  body: 'The strongest positive in CarDekho''s public financial profile is that loss intensity appears to be improving even while management keeps multiple growth vectors alive. Entrackr says consolidated losses narrowed to roughly Rs 266 crore in FY25 from about Rs 276 crore in FY24, and it separately notes that the group ended the year with about Rs 1,177 crore of net cash. Those are not the numbers of a company that has already solved every profitability question, but they do indicate a materially better balance than many private growth peers facing IPO pressure. The same source also says auto-classifieds segment profitability rose 60% and standalone revenue crossed Rs 1,000 crore, which implies the core Indian auto-commerce surface is healthier than the consolidated headline alone suggests.


    That improvement should still be interpreted carefully. Public sources disagree on the exact FY25 P&L framing, and the record does not provide a clean bridge among core classifieds, Rupyy, Southeast Asia, mobility, and insurance-related economics. We can say directionally that the company became stronger and leaner; we cannot yet say exactly where steady-state group margins land.'
