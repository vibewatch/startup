- id: public-market-readiness-and-gaps
  title: Public-market readiness and unresolved gaps
  body: 'The presence of public and quasi-public comparables means CarDekho cannot rely on private-market momentum alone if it enters the IPO window. CarTrade Tech already provides one local benchmark with disclosed filings, while global used-car comps show that scale is judged on margins, cash flow, and balance-sheet risk rather than on GMV-style storytelling. The retained record therefore points to a familiar late-stage pattern: investors may reward CarDekho for improved profitability and capital buffers, but they will still demand clearer segment reporting, cleaner treatment of adjacencies, and a stronger explanation of how much value belongs to core auto-commerce versus side businesses.


    Today, the biggest unresolved issues are disclosure gaps. The public record does not disclose contribution margins by city, attach economics for finance or insurance, cash conversion by business line, or the exact listed-perimeter treatment of InsuranceDekho and Southeast Asia. Those gaps do not erase the progress the company has made; they simply limit how precise investors should be when underwriting valuation, capital needs, or IPO timing.'
