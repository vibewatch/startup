    - QI025
  - id: GI002
    question: What revenue yield and loss profile does Rupyy generate on its Rs 16,000 crore disbursal base?
    impact: Finance throughput can look impressive while economics remain thin.
    nextStep: Request take rates, attach rates, approval quality, and default-loss data.
