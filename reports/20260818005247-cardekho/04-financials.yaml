chapter:
  number: 4
  title: Financials
  summary: CarDekho has reached meaningful scale—about Rs 2,795 crore of FY25 consolidated operating revenue on Entrackr's reading—while narrowing losses and reporting a second straight profitable year for its standalone core auto-classifieds and financing business. But the public record still looks more like a multi-line auto marketplace, finance, and adjacency story than a clean public-market earnings story, with segment margins, cash-flow quality, and the treatment of InsuranceDekho or Southeast Asia still only partially disclosed.
sections:
- id: revenue-and-mix
  title: Revenue model, scale, and mix
  body: 'CarDekho''s current financial story is no longer only that of a classifieds portal monetizing leads. The retained evidence shows a broader operating mix spanning auto classifieds, financing through Rupyy, international operations, and associated adjacencies. Entrackr''s FY25 coverage is the central source: consolidated operating revenue rose to about Rs 2,795 crore from roughly Rs 2,250 crore a year earlier, while the group''s press-release framing emphasized that the standalone core auto-classifieds and auto-financing business remained profitable for a second consecutive year. That mix matters because it means CarDekho should be evaluated neither as a pure inventory-heavy retailer nor as a capital-light software company. It is closer to a multi-product marketplace and distribution platform whose financial quality depends on monetizing audience reach into finance, insurance-adjacent, and partner-led transaction flows.


    Scale markers reinforce that reading. Rupyy facilitated about Rs 16,000 crore of loan disbursals in FY25, new-car financing nearly doubled, and the company says the platform now services more than 95% of India''s pin codes. Those metrics suggest real throughput and network reach, but they still do not fully disclose which business lines create the best unit economics.'
