- id: capital-needs-and-manda
  title: Capital needs, M&A, and adequacy
  body: 'CarDekho remains a capital-market story as much as an operating story. The retained source pack shows a sequence of financing and strategic-value markers: the 2021 $250 million round that took the company to unicorn status, the December 2024 $60 million raise for Southeast Asia expansion, and the 2025-2026 IPO framing around a Rs 13,000-15,000 crore target valuation. At the same time, the InsuranceDekho side of the group is moving toward more separate disclosure and financing logic, including its own investor materials and restructuring coverage. That matters because some of the perceived value around CarDekho rests on group optionality that may not fully sit inside the eventual listed perimeter.


    The abandoned CarTrade transaction is also financially relevant. It suggested strategic buyers saw material value in CarDekho''s auto-classifieds and related businesses, but the collapse of talks shows that price, structure, and control were not trivial to resolve. For underwriters, that is both a positive strategic signal and a warning that comparable-value benchmarks remain noisy.'
