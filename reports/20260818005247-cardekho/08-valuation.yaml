- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / path
  rows:
  - - Gross and contribution margins
    - No public margin bridge
    - Needed to justify comp multiple selection
    - Management / finance diligence
  - - Cash flow and working capital
    - No public runway or conversion-cycle view
    - Retail valuation depends on capital efficiency
    - Management / banker diligence
  - - GoMechanic pro forma
    - No public integration model
    - Main source of upside and downside in the current story
    - M&A / operations diligence
  - - Complaint rates and support SLAs
    - No denominator-backed quality metrics
    - Trust moat is central to valuation
    - Customer-ops diligence
  - - Cap table and preferences
    - No public preference-stack disclosure
    - Entry pricing depends on waterfall risk
    - Legal / investor-relations diligence
  notes: The highest-value next diligence steps are all company-specific rather than generic market questions.
