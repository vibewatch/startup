- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public status / scale
  - Why relevant
  - Limitation
  - Read-through for Spinny
  enumerationScope:
    coverage: exhaustive
    basis: Selected set of the most relevant public and Indian digital-auto comparables visible in the retained evidence pack.
  rows:
  - - Carvana
    - Public US used-car e-commerce leader
    - Best known online used-car retail comp
    - Much larger scale and disclosure
    - Public multiples should cap private exuberance
  - - CarMax
    - Public US incumbent
    - Shows lower-multiple, retail-like economics
    - Offline-heavy mix differs from Spinny
    - Useful floor for capital-intensity reality
  - - AUTO1 Group
    - Public European digital auto retail
    - Closer digital-retail model with filings
    - Different geography and mix
    - Good middle-ground comp
  - - CarTrade Tech
    - Public Indian digital auto platform
    - Most relevant Indian listed auto-digital comp
    - Lead-gen model lighter than Spinny
    - Shows value of traffic without full inventory risk
  - - Cars24 / CarDekho / Indian peers
    - Private late-stage peers
    - Same category and same IPO narrative
    - Private marks and disclosures less clean
    - Useful only as directional private benchmarks
  notes: The comp set mixes public and private anchors, but public comps should carry more weight in underwriting.
