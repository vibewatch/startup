company:
  name: CarDekho
chapter:
  number: 8
  title: Valuation
  summary: CarDekho looks worth tracking closely but not easy to underwrite aggressively at face value. Public evidence supports a company-level valuation anchor at or above the historical unicorn mark and a 2026 IPO ambition around Rs 13,000-15,000 crore, but the lack of IPO-grade disclosure on segment margins, listed-perimeter treatment, and adjacency economics keeps the stance at track with medium confidence and a fair-to-full read on valuation.
sections:
- id: recommendation-and-stance
  title: Recommendation, confidence, and valuation stance
  body: 'On public evidence, CarDekho looks like a company to track rather than a company to price blindly. The case for interest is real: meaningful revenue scale, a durable unicorn-era anchor, an active IPO path, and a category that is formalizing quickly. The case for restraint is equally real: the company remains private, key valuation drivers such as business-line margins and cash flow are undisclosed, and investors still need much clearer treatment of what belongs inside the eventual listed perimeter versus what sits in related adjacencies such as InsuranceDekho.


    That combination supports a medium-confidence, high-risk, fair-to-full valuation stance. There is enough franchise value to avoid an outright avoid rating, but not enough public evidence to issue an uncomplicated buy-equivalent posture. The right stance is price-sensitive and diligence-sensitive. Investors should care at least as much about missing evidence as about the headline company story.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV031
