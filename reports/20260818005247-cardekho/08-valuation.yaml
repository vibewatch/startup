  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Probability signal
  - Key risk
  rows:
  - - Bull
    - FY26 revenue meets / beats plan; integration works; margins improve
    - Premium to current mark; upside into IPO window
    - Possible but not yet evidenced
    - Integration or disclosure stumble
  - - Base
    - Growth remains strong; disclosures improve gradually; market window stays mixed
    - Valuation stays around current range
    - Most consistent with public evidence
    - Market multiples or support friction
  - - Bear
    - Customer/support issues persist; competition stays fierce; economics disappoint
    - Clear discount to unicorn-era anchor
    - Cannot be ruled out from current evidence
    - Public-market re-rating and brand damage
