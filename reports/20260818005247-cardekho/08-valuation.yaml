- id: exit-readiness-and-final-diligence
  title: Exit readiness, kill triggers, and final diligence asks
  body: 'CarDekho''s IPO route is plausible, but plausibility is not readiness. Public investors will want more than revenue growth and market narrative. They will want clarity on margins, cash flow, complaint or support economics, the exact treatment of InsuranceDekho and Southeast Asia, and whether CarTrade-style public comps imply a lower multiple ceiling than private storytelling does. That means the decisive diligence asks are all company-specific and operating-specific, not generic market-size questions.


    The thesis would break if a filing process revealed materially weaker segment economics than secondary reporting implies, if public-market comps rerated downward while CarDekho tried to hold a premium, or if investors concluded that too much of the broader group''s perceived value sits outside the listed perimeter. Conversely, a cleaner disclosure set on margins and perimeter treatment could upgrade the stance materially. Until then, the investment case remains interesting but unfinished. The burden of proof therefore sits on fresh filings, not on narrative optimism.'
