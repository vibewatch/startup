callouts:
- calloutType: strength
  title: Diversification is now a real operating fact, not only a story
  body: The retained source pack shows CarDekho monetizing not just discovery traffic but also financing, dealer relationships, shared mobility, and regional auto-financial services. That breadth is one reason the company could keep its core standalone business profitable even while the wider group still absorbed growth investments.
  claimRefs:
  - CO005
  - CO023
  - CO026
  - CO027
  - CO049
- calloutType: risk
  title: IPO readiness is credible but still conditional
  body: Public reporting supports an active IPO ambition, but it also shows deferred timing, failed consolidation talks, an insurance perimeter still being reworked, and missing governance disclosure. Those are solvable issues, but they mean a 2026 listing should be treated as a live plan rather than a completed transition.
  claimRefs:
  - CO030
  - CO031
  - CO033
  - CO035
  - CO047
  - CO048
