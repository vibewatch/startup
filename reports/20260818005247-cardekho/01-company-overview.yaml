company:
  name: CarDekho
chapter:
  number: 1
  title: Company Overview
  summary: CarDekho is a Jaipur-founded auto marketplace group operating under Girnar Software Pvt. Ltd. that has expanded from car research and classifieds into used-car transactions, auto finance, insurance adjacency, media, and mobility. The retained 2026 evidence supports a late-stage, IPO-oriented company with FY25 consolidated revenue of Rs 2,795 crore, a profitable standalone auto-classifieds and financing core, and a December 2024 Southeast Asia financing round, but it also shows real governance, structure, and profitability caveats around InsuranceDekho separation, deferred IPO timing, and inconsistent public funding tallies.
sections:
- id: identity-footprint-and-brand-architecture
  title: Identity, footprint, and brand architecture
  body: 'CarDekho''s core identity is now broader than the familiar Indian car-search portal brand. Official and high-reputation secondary sources align that the business is operated by Girnar Software Pvt. Ltd., was built by Amit Jain and Anurag Jain in Jaipur, and launched CarDekho in 2008 after the founders saw the lack of transparent auto discovery in India. Current official surfaces show a house-of-brands structure rather than a single-site business: CarDekho for cars, BikeDekho for two-wheelers, ZigWheels for research and reviews, rupyy for financing, Revv for mobility, Carrum for fleet management, and InsuranceDekho as a still-associated but separately evolving insurance business. The business model is also clearly multi-layered. The CarDekho homepage and used-cars inventory pages show new-car discovery, comparison, and listings depth, while the 2021 funding announcement explicitly described growth priorities in used-car transactions, financial services, and insurance. For later chapters,
    the right baseline is an integrated auto-commerce and auto-financial-services ecosystem whose discovery traffic, dealer integrations, financing rails, and content assets reinforce one another rather than a thin classifieds site alone.'
