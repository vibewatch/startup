- id: leadership-governance-and-legal-structure
  title: Leadership, governance visibility, and legal structure
  body: 'Public evidence makes the leadership bench more visible than the actual control stack. The careers leadership page identifies Amit Jain as Group Co-Founder and CEO, Anurag Jain as Group Co-Founder and COO, Umang Kumar as Co-Founder and CEO of CarDekho SEA, Mayank Gupta as CFO, Mayank Jain as CEO of Auto Classifieds, Namit Jain as Co-Founder and CEO of rupyy, Ankit Agarwal as Founder and CEO of InsuranceDekho, and Anupam Agarwal as Co-Founder and CEO of Revv. Tofler and Tracxn also make the legal-entity picture partly legible: Girnar Software Private Limited is the main private parent incorporated in December 2006 in Jaipur, while Tracxn and TheCompanyCheck show a wider entity stack including Girnar Finserv, Girnar Growth Ventures, and the newer Cardekho Autoverse vehicle formed in November 2025. Even so, governance disclosure remains incomplete by IPO-underwriting standards. Tracxn and Tofler surface partial director rosters, but CarDekho does not publicly provide a current shareholder-rights
    package, preference stack, or prospectus-level board committee map. The correct diligence read is that the company is clearly founder-led and legally established, but still substantially private in how much governance detail it reveals.'
