- id: scale-restructuring-and-ipo-path
  title: Scale markers, restructuring, and the 2026 IPO path
  body: 'The strongest current underwriting signals are operational scale and improving financial discipline, not a fully settled listing story. Entrackr''s FY25 reporting, citing the company''s own press release, gives the cleanest current numbers: Rs 2,795 crore of consolidated operating revenue, Rs 266 crore of losses excluding exceptional items and associate losses, Rs 1,177 crore of net cash, second-year standalone profitability in the core auto-classifieds and financing business, and roughly Rs 16,000 crore of Rupyy disbursements across vehicle categories. These are meaningful maturity markers for a late-stage private business. But the same evidence pack also shows why the IPO thesis remains conditional. 2025 Bloomberg-syndicated reporting said CarDekho had deferred earlier filing intentions while used-car peers cut costs and prepared restructuring work for public-market readiness. Moneycontrol and ETAuto add a sharper caution: CarDekho exited its used-car retail business in 2023 after
    sustained burn, leaned more heavily on higher-margin insurance and transaction-led services, and then explored—before abandoning—a November 2025 consolidation with CarTrade. IndianStartupNews later described a revived 2026 IPO plan at Rs 13,000-15,000 crore, but investors should treat that as a reported target rather than a cleared market price.'
