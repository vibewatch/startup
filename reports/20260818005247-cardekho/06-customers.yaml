chapter:
  number: 6
  title: Customers
  summary: CarDekho has enough official and independent evidence to support a broad customer and user franchise across car researchers, used-car buyers, sellers, loan seekers, and adjacent insurance or mobility users. The same source set also shows that post-sale support, paperwork, RC transfer, and partner-mediated workflows remain the most important friction points, meaning customer reach appears meaningful but service quality is not uniformly solved.
sections:
- id: customer-base-and-segments
  title: Customer base and core segments
  body: 'CarDekho is not a single-segment customer story. The retained pack points to at least five relevant customer groups: new-car researchers, used-car buyers, sellers or trade-in users, finance borrowers via Rupyy, and adjacent customers or partners routed through services such as Revv and InsuranceDekho. Official surfaces support that reading. The main site combines new and used-car discovery, the used-car catalogue evidences supply breadth, finance pages route users into loan workflows, and the careers or group material shows that the company operates a wider family of auto and adjacent brands. App-store and web-surrogate sources add another important clue: CarDekho maintains an active mobile customer surface, meaning the customer relationship is not only a lead passed from desktop search to a dealer.


    Segment-wise, the retained evidence points overwhelmingly to B2C and prosumer behavior rather than to a large enterprise-account base. Dealers, lenders, and insurers matter, but usually as supply or partner-side participants in a consumer journey. That keeps customer concentration tied more to city execution, support quality, and conversion economics than to a handful of named enterprise logos.'
