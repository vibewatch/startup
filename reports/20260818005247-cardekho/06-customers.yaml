- id: customer-proof-and-satisfaction
  title: Customer proof, satisfaction, and repeat usage
  body: 'Independent customer proof is mixed but real. The Android and iOS app surfaces, review aggregators, and complaint portals all show that many consumers use CarDekho as a research and transaction-support interface rather than as a passive content destination. Review summaries and app metrics are directionally favorable enough to support a meaningful consumer franchise, while the used-car inventory page and finance workflows show that buyers and sellers can progress well beyond passive browsing. Adjacent customer reach is also visible in the InsuranceDekho annual report and related coverage, which point to a large advisor and insurer network across thousands of pincodes.


    At the same time, the public proof set is far from uniformly positive. Ratings and review summaries are only partial proxies for satisfaction, and they do not provide clean repeat-purchase or retention cohorts. The customer-evidence takeaway is therefore constructive but qualified: CarDekho appears to have real user reach and partner distribution, but not enough disclosed cohort or service-quality data to claim durable superiority yet.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
