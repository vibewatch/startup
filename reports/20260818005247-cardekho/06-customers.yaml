- id: pain-points-and-adverse-signals
  title: Pain points and adverse signals
  body: 'The strongest recurring adverse pattern across retained review and complaint sources is not that customers cannot discover vehicles. It is that support, paperwork, RC transfer, or post-service responsiveness can break after the transaction should have felt complete. Consumer complaint sources show the same cluster of issues: delayed or problematic RC transfer, slow follow-up, reimbursement friction, or difficulty obtaining resolution after a service promise. Similar patterns appear on Revv-related complaint surfaces, which matters because CarDekho''s broader ecosystem thesis depends on adjacent services feeling additive rather than risky.


    That matters because a broad consumer ecosystem is judged most harshly when long-tail execution fails. If CarDekho wants to keep discovery trust high and cross-sell adjacent finance or mobility products, it must make the post-sale and post-booking experience as reliable as the pre-sale pitch.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU005
  figureRefs:
  - FU002
- id: expansion-logic-and-concentration
  title: Expansion logic and concentration considerations
  body: 'CarDekho''s expansion logic remains attractive because the market context is trust-deficit rich, financing-relevant, and still early in formalization. Redseer-like market framing and the mobility-intelligence evidence from related used-car research both support a customer base where research quality, financing help, and transaction trust matter a great deal. That is favorable for a discovery-and-distribution ecosystem. The challenge is that customer concentration can still appear in hidden ways even without enterprise contracts: inconsistent partner response, support bottlenecks, or weak cross-product handoffs can make growth more fragile than top-line traffic suggests.


    The evidence therefore supports a balanced customer view. CarDekho has meaningful consumer reach and enough independent proof to show real value creation, but expansion quality depends on whether the company can replicate a trustworthy experience consistently across buyer, seller, finance, and adjacent-service workflows at scale.'
