- id: operational-financial-and-dependency
  title: Operational, financial, and dependency risks
  body: 'Operationally, CarDekho depends on many moving parts: discovery traffic, dealer or seller response, financing and paperwork completion, support resolution, and adjacent-service execution. The more that model scales, the more coordination failures can surface. Complaint evidence suggests the weakest links often sit in paperwork, follow-up, or post-sale support rather than in the initial discovery experience. That is a real warning because scaling leads faster than back-office quality can erode trust.


    Financially and strategically, the category remains vulnerable to competitive discounting, public-market comparables, and cyclical consumer demand. Local public comp CarTrade and wider used-car-market evidence show that capital-market judgment tightens quickly when disclosure or operating clarity disappoint. Long-term technology change, especially EV penetration, adds a slower-burn risk by changing residual-value behavior and service complexity. This means operational slippage and market-pressure risks can reinforce each other rather than appearing as separate problems.'
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR016
