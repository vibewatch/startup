- id: mitigations-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: 'The mitigations implied by the evidence are clear even if management has not publicly disclosed all of them. Perimeter ambiguity around InsuranceDekho and Southeast Asia needs explicit reporting. Support and paperwork failure need measured resolution SLAs and city-level escalation controls. Competitive pressure from CarTrade and other peers needs a cleaner explanation of why CarDekho''s broad ecosystem earns sustainably rather than simply attracting traffic. And IPO preparation requires more disclosure, not just more revenue.


    A thesis-break would likely come from one of four events: a public filing process that exposes much weaker segment economics than private reporting implied, evidence that complaint or support failure rates are rising as volume grows, materially weaker strategic value for the core auto assets once InsuranceDekho is separated in investor minds, or a failed attempt to scale adjacencies such as Southeast Asia or mobility without corresponding return. Those are measurable enough to monitor in a refresh cycle.'
  claimRefs:
  - CR012
