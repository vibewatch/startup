  topStrengths:
    - FY25 证据显示公司已有真实经营规模：合并收入约 Rs 2,795 crore，独立核心业务连续第二年盈利，净现金约 Rs 1,177 crore。
    - CarDekho 不只是单一分类信息品牌；发现、融资、内容和东南亚可选空间都已具备分量，能支撑超出简单线索生成的战略价值。
    - Rupyy FY25 放款吞吐量约 Rs 16,000 crore，说明金融不是装饰性相邻业务，而是实质性变现引擎。
    - 公司已经跨过独角兽门槛，仍能吸引 IPO 和战略兴趣报道，说明平台在印度汽车科技里有实际分量。
  topRisks:
    - 分部利润率、现金流转化和精确贡献经济性仍未公开，投资者缺少高置信承销 IPO 区间所需披露。
    - InsuranceDekho 和其他相邻业务带来真实边界模糊：更大的集团故事，未必等同于公开市场投资者最终买到的资产。
    - CarTrade Tech 等上市可比公司可能大幅波动，并把可接受估值倍数压在私募市场叙事之下。
    - 进入公开市场时，客服、文件流程、合作方执行和盈利可持续性都比私募叙事轮更关键。
  unresolvedGaps:
    - 当前股权结构表、股份类别、清算优先权和投资者权利条款未公开。
    - 公开来源没有披露核心汽车、Rupyy、东南亚和相关实体之间的分部 EBITDA、现金流或贡献利润率拆分。
    - 公开证据尚未解决准确 IPO 边界，以及 InsuranceDekho 之后的处理方式。
    - 公开证据没有披露当前客户留存、经销商留存、复用情况或队列经济性。
    - 最终可接受估值区间仍对上市可比公司的实时走势敏感，尤其是 CarTrade Tech 和全球二手车零售商。
