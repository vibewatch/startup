summary:
  headline: CarDekho 是可信且有规模的汽车电商平台，也确实存在 2026 IPO 路径；但分部披露不完整、上市边界仍模糊，在拟议 Rs 13,000-15,000 crore 区间内，风险回报仍停留在观察档。
