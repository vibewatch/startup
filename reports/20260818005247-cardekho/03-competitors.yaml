  evidenceGaps:
  - id: GP001
    question: What percent of CarDekho used-car leads convert through adjacent finance products versus external partners?
    impact: Without attach-rate disclosure, the ecosystem cross-sell moat remains only partially proven.
    nextStep: Request product-level funnel data spanning discovery, finance approval, and repeat use.
    relatedQuestionRefs:
    - QP014
    - QP021
    - QP024
  - id: GP002
    question: How much customer overlap exists between CarDekho's discovery audience and its finance or insurance adjacencies?
    impact: If overlap is low, adjacent scale may not materially strengthen the marketplace moat.
    nextStep: Ask management for overlap studies, bundled-offer performance, and cohort retention data.
    relatedQuestionRefs:
    - QP025
    - QP021
  - id: GP003
    question: How much of CarDekho's used-car activity is marketplace traffic versus more standardized store-led or partner-led inventory?
    impact: The answer changes both trust assumptions and the right set of peer comparisons.
    nextStep: Request lead mix, store mix, and city-level close-rate disclosure.
    relatedQuestionRefs:
    - QP003
    - QP011
  - id: GP004
    question: What are CarDekho's business-line margins across classifieds, financing, and other adjacencies?
    impact: Competitive durability cannot be underwritten from reach metrics alone.
    nextStep: Seek segment EBITDA or contribution disclosures and compare them with listed peers.
    relatedQuestionRefs:
    - QP024
    - QP020
  - id: GP005
    question: How sticky are dealer and lender partnerships on CarDekho relative to CarTrade, CARS24, or Spinny?
    impact: Partner churn would weaken claims of durable ecosystem advantages.
    nextStep: Request cohort retention, renewal, and partner take-rate data.
    relatedQuestionRefs:
    - QP014
    - QP015
    - QP024
