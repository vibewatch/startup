  topStrengths:
    - >-
      FY25 evidence shows real operating scale: about Rs 2,795 crore of consolidated revenue, a second straight
      profitable year for the standalone core business, and roughly Rs 1,177 crore of net cash.
    - >-
      CarDekho is broader than a single classifieds brand, with meaningful discovery, financing, content, and Southeast
      Asia optionality that can support strategic value beyond simple lead generation.
    - >-
      Rupyy's roughly Rs 16,000 crore FY25 disbursal throughput suggests finance is a material monetization engine
      rather than a cosmetic adjacency.
    - >-
      The company has already crossed the unicorn threshold and still attracts IPO and strategic-interest coverage,
      indicating the platform matters in Indian auto-tech.
  topRisks:
    - >-
      Segment margins, cash-flow conversion, and exact contribution economics remain private, so investors still lack
      the disclosure needed to underwrite the IPO range with high confidence.
    - >-
      InsuranceDekho and other adjacencies create real perimeter ambiguity because the broader group story may not match
      what public-market investors ultimately buy.
    - >-
      Public comps such as CarTrade Tech can move materially and may cap acceptable valuation multiples below
      private-market storytelling.
    - >-
      Support, paperwork, partner execution, and profitability sustainability all matter more in a public-market
      transition than in a private narrative round.
  unresolvedGaps:
    - Current cap table, share classes, liquidation preferences, and investor-rights terms are not public.
    - >-
      Public sources do not provide segment-level EBITDA, cash-flow, or contribution margin splits across core auto,
      Rupyy, Southeast Asia, and related entities.
    - The exact IPO perimeter and post-InsuranceDekho treatment remain unresolved in public evidence.
    - Public evidence does not disclose current customer-retention, dealer-retention, repeat-usage, or cohort economics.
    - >-
      The final acceptable valuation range remains sensitive to live public-comp moves, especially CarTrade Tech and
      global used-car retailers.
