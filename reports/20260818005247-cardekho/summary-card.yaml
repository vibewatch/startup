summary:
  headline: >-
    CarDekho is a credible, scaled auto-commerce platform with a real 2026 IPO path, but incomplete segment disclosure
    and perimeter ambiguity keep the risk-reward in TRACK territory around the proposed Rs 13,000-15,000 crore range.
