evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Current cap table, share classes, preference terms, and investor-rights package across the parent and material
      subsidiaries.
    whyItMatters: >-
      Valuation downside, IPO overhang, and founder-control analysis depend on who owns what and what liquidation or
      consent rights survive into a public offering.
    diligencePath: >-
      Request the latest capitalization table, major shareholder schedule, ESOP pool detail, and key rights side letters
      from management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: ipo-perimeter
    missingEvidence: >-
      Final proposed IPO perimeter showing exactly which businesses, subsidiaries, and associate stakes sit inside the
      listed entity.
    whyItMatters: >-
      InsuranceDekho separation, SEA funding, and newer entities like Cardekho Autoverse make it easy to over-assume
      what public-market investors would actually be buying.
    diligencePath: >-
      Review draft red herring prospectus perimeter disclosures, restructuring steps, and associate-accounting treatment
      once filed.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: One reconciled lifetime funding number across equity, debt, parent, brand-level, and SEA financing rounds.
    whyItMatters: >-
      Public capital tallies diverge enough to cloud dilution, step-up history, and the current investor-return setup
      ahead of an OFS-heavy IPO.
    diligencePath: >-
      Reconcile official round announcements against management financing ledgers and reputable databases before using
      any single total-raised figure.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
