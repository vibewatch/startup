- id: buyer-user-payer-segmentation
  title: Buyer, user, payer, and adoption-path segmentation
  body: 'CarDekho’s reachable market is segmented less by vehicle category alone than by budget logic and workflow responsibility. First-time buyers are especially important: the Mobility Intelligence Report 2026 says 80-82% of used-car buyers are first-time car owners, while Autopunditz’s synthesis of the CARS24-Team-BHP report also points to first-time demand as a major driver. These buyers often need financing, confidence, and documentation support rather than only listings volume. Aspirational upgraders form another large cohort: they use used cars to access higher-specification vehicles, especially SUVs and automatics, without paying current new-car prices. Sellers and trade-in customers are distinct again, valuing faster liquidity and price discovery. Dealers sit on yet another side of the market, caring about inventory sourcing, financing lines, and turn speed. Lenders and insurers are payers in their own right because they monetize conversion, not only vehicle ownership. This segmentation
    matters because CarDekho spans research traffic, financing, and dealer tools; it can monetize different points in the journey even when it does not own the full balance-sheet retail transaction.'
