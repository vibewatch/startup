callouts:
- calloutType: insight
  title: CarDekho’s best market is not every used-car rupee
  body: The strongest evidence supports CarDekho where research traffic, financing, and trust infrastructure intersect. That is a narrower but more defensible market than simply claiming exposure to all passenger-vehicle commerce in India.
  claimRefs:
  - CM001
  - CM002
  - CM028
  - CM032
  - CM033
  - CM042
- calloutType: risk
  title: Market growth does not automatically mean platform profitability
  body: Several retained sources say the category can grow volumes while organized players still struggle with customer-acquisition, logistics, refurbishment, and liquidity pressure. CarDekho’s own 2023 retail exit is a reminder that large TAM does not erase execution risk.
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM038
  - CM041
