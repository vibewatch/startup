chapter:
  number: 2
  title: Market Analysis
  summary: CarDekho's real market is not all of Indian automotive GDP but the digitally mediated discovery, used-car, financing, and ownership-services pool where trust and conversion infrastructure matter. The retained 2026 evidence supports a large and growing India used-car market—roughly $30.8-40.4 billion in 2025 by published estimates, about 6 million units in FY26, and a 1.4 used-to-new ratio—but the source pack also preserves meaningful contradictions around organized-share definitions, formalization speed, and how much of that spend is actually reachable by profitable platforms like CarDekho.
sections:
- id: market-boundary-and-adjacent-spend
  title: Market boundary, included spend, and adjacent pools
  body: 'CarDekho should be analyzed inside a layered auto-commerce market, not inside total automotive manufacturing or all passenger-vehicle revenue. The narrowest layer is digital automotive discovery: car research, pricing, comparisons, content, dealer lead generation, and OEM advertising. The next layer is the used-car transaction market, where inventory sourcing, inspections, pricing, logistics, and documentation convert discovery into a sale. CarDekho then extends into attached financing, dealer credit, and insurance-related monetization through rupyy and broader group capabilities. That is a materially broader business than a pure classifieds site, but still much narrower than India’s total auto industry or all new-car revenue. Public market studies and official CarDekho surfaces support that framing. The used-cars pages show a wide inventory-led discovery product, while rupyy’s consumer and dealer-credit products show that financing is part of the monetizable workflow, not only
    an affiliate add-on. The right boundary therefore includes discovery, transaction enablement, and attached finance, but excludes OEM manufacturing economics, unrelated mobility fleets, and every offline transaction that never touches a platform trust layer.'
  claimRefs:
  - CM001
  - CM010
  - CM020
  - CM028
  - CM032
  - CM033
  - CM034
  - CM042
