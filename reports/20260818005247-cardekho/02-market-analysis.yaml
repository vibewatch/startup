- id: growth-drivers-constraints-and-cardekho-implications
  title: Growth drivers, adoption constraints, and implications for CarDekho
  body: 'The strongest growth drivers are affordability, financing accessibility, digital discovery, and faster vehicle replacement. New-car price inflation has widened the gap between used and new vehicles, while financing penetration, AI-assisted underwriting, and platform-lender partnerships are making ownership more reachable for budget-sensitive users. Scrappage incentives and end-of-life rules can also support faster replacement and formalization. But several constraints matter just as much. Trust remains the core structural problem: Redseer still describes around 80% of transactions as unorganized, and multiple sources say buyers continue to care about quality opacity, documentation, and refurbishment integrity. Profitability is another constraint, not merely a footnote. CRISIL-linked sources say organized players still face high customer-acquisition, logistics, and refurbishment costs and remain dependent on liquidity while operating toward breakeven. EV resale is a further emerging
    uncertainty because battery-health and residual-value benchmarks are still immature. For CarDekho, the implication is clear: its best market position is not to absorb all used-car inventory risk, but to sit where trust, financing, and conversion infrastructure can earn attractive economics without recreating the 2023 burn profile of balance-sheet-heavy retail.'
