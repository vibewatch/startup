  rows:
  - - Digital auto discovery
    - Research, comparisons, pricing tools, reviews, OEM lead generation, dealer leads
    - Vehicle manufacturing, wholesale distribution margins
    - Consumer shopper, OEM advertiser, dealer
    - Core top-of-funnel market where CarDekho already participates directly
  - - Used-car transaction marketplace
    - Listings, sourcing, inspections, logistics, paperwork, and transaction support for used cars
    - New-car OEM revenue and unrelated local offline deals with no platform layer
    - Buyer, seller, dealer
    - Important because it converts audience into monetizable transactions
  - - Used-car finance and dealer credit
    - Consumer used-car loans, refinance, dealer working-capital or inventory lines
    - Unsecured consumer credit unrelated to vehicles
    - Borrower, dealer, lender
    - Critical monetization layer via rupyy and lender integrations
  - - Insurance and ownership adjacencies
    - Insurance distribution, warranties, after-sales and ownership support linked to vehicle purchase
    - Standalone insurance lines unrelated to auto ownership
    - Buyer, insurer, platform
    - Commercially relevant but not always inside the same legal perimeter
  - - Southeast Asia auto-financial services
    - Used-auto finance, refinancing, dealer inventory funding, classifieds across SEA
    - India-only passenger-vehicle TAM math
    - Dealer, borrower, financier, platform partner
    - Strategic adjacency and growth option, but not part of India used-car TAM
  - - OEM manufacturing and all new-car revenue
    - Context only for supply creation and future used-car inventory
    - Direct inclusion inside CarDekho’s market boundary
    - OEM, distributor
    - Important background variable but not CarDekho’s core monetization pool
  notes: Boundary logic separates total automotive spend from the narrower layers where CarDekho can monetize demand, conversion, and financing infrastructure.
