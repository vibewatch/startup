  evidenceGaps:
  - type: missing-source
    severity: material
    topic: car-dekho-market-share
    missingEvidence: A current official CarDekho disclosure of used-car GMV, transaction count, take rate, or true national market share.
    whyItMatters: Without platform-specific throughput, SAM and SOM remain proxy-based and can easily overstate CarDekho’s real reach inside a large market.
    diligencePath: Use DRHP operating metrics or management investor materials once published.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: organized-share
    missingEvidence: One reconciled, like-for-like definition of organized versus unorganized share in India used cars.
    whyItMatters: Publisher disagreement is large enough to change any formalization-led market-share or margin thesis materially.
    diligencePath: Benchmark multiple definitions directly against transaction-level or channel-level field data before fixing a formalization assumption.
    relatedQuestionRefs:
    - QM005
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: City-level or cohort-level CAC, refurbishment cost, conversion, and finance-attach metrics for CarDekho.
    whyItMatters: The market can grow rapidly while destroying value if acquisition and fulfillment economics remain weak.
    diligencePath: Request city contribution margins, finance-attach rate, and lead-to-sale conversion by channel in diligence.
    relatedQuestionRefs:
    - QM017
    - QM025
    relatedTableRefs:
    - TM004
  - type: stale
    severity: minor
    topic: ecosystem-metrics
    missingEvidence: A fresh official 2026 update on dealer count, lender count, and OEM-partner scale for CarDekho’s India marketplace.
    whyItMatters: Some of the best public ecosystem statistics are older than the current run date and may no longer map to the present market footprint.
    diligencePath: Refresh against current investor presentation, DRHP, or management press release.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM001
  - type: missing-source
    severity: minor
    topic: sea-sam-separation
    missingEvidence: A formal disclosure separating India market contribution from Southeast Asia contribution in traffic, financing, and revenue.
    whyItMatters: Without geographic segmentation, there is a risk of attributing SEA growth signals to the India TAM or vice versa.
    diligencePath: Seek geographic revenue and volume splits in audited notes or future filing materials.
