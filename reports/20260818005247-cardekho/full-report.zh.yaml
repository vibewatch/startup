  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，CarDekho 看起来是一家应该观察，而不是盲目定价的公司。值得关注的理由真实存在：收入规模有意义，独角兽时期估值锚点具备耐久性，IPO
              路径仍活跃，品类也在快速正规化。克制的理由同样真实：公司仍是私营企业，业务线利润率和现金流等关键估值驱动未披露，投资人仍需要更清楚地处理最终上市边界里有什么、InsuranceDekho 等邻近业务里又有什么。


              这种组合支持一个中等置信度、高风险、合理到偏满的估值立场。公司有足够业务价值，不能直接给出回避评级；但公开证据还不足以给出简单的买入等价姿态。正确立场应对价格敏感、对尽调敏感。投资人至少应像关注公司标题故事一样，关注缺失证据。
