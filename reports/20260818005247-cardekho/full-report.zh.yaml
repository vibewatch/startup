        title: 路线图、依赖项与产品风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开路线图信号是生态延伸，而不是单一旗舰功能。BikeDekho、ZigWheels、Rupyy 和 Revv
              都显示，集团围绕核心汽车发现工作流不断增加相邻决策、融资或用车触点。战略上这说得通，因为汽车信任不是从车辆搜索开始、到搜索结束；它会延伸到融资、出行、服务解决和重复使用。


              同样的宽度也暴露产品风险。投诉门户显示，即便前端发现体验很强，文件、问题解决和售后支持仍可能破坏体验。这意味着 CarDekho
              最重要的依赖不只是内容发布和搜索界面，也包括经销商响应质量、融资伙伴、客户支持、文件工作流，以及 Revv 这类服务。产品成熟度应被判断为一套生态能力栈，而不是纯软件路线图。
