      - number: '6.2'
        title: 客户证据、满意度与复用
        blocks:
          - type: paragraph
            body: >-
              独立客户证据有好有坏，但真实存在。Android 和 iOS 应用触点、评论聚合器和投诉门户都显示，许多消费者把 CarDekho
              当作研究和交易支持界面，而不是被动内容目的地。评论摘要和应用指标在方向上足够有利，能支持一个有意义的消费者业务基础；二手车库存页和金融工作流也显示，买卖双方可以远远超出被动浏览。相邻客户触达也出现在
              InsuranceDekho 年报和相关报道中，这些材料指向覆盖数千个邮编区的大型顾问和保险公司网络。


              与此同时，公开证据集远非一致正面。评分和评论摘要只是满意度的部分替代指标，不能提供干净的复购或留存队列。因此，客户证据结论是建设性但有条件的：CarDekho
              看起来有真实用户触达和伙伴分发，但披露的队列或服务质量数据还不足以宣称持久优越。
