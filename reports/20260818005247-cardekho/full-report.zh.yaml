  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与相邻池子
        blocks:
          - type: paragraph
            body: >-
              CarDekho 应放在分层汽车电商市场中分析，而不是放进全部汽车制造或所有乘用车收入。最窄一层是数字汽车发现：汽车研究、定价、对比、内容、经销商线索生成和 OEM
              广告。下一层是二手车交易市场，库存获取、检测、定价、物流和文件处理把发现转成成交。CarDekho 随后通过 rupyy
              和集团更宽能力延伸到绑定融资、经销商信贷和保险相关变现。这个业务显著宽于纯分类信息网站，但仍远窄于印度全部汽车行业或所有新车收入。公开市场研究和 CarDekho
              官方触点支持这一框架。二手车页面展示了宽库存驱动的发现产品；rupyy 的消费者和经销商信贷产品则显示，融资是可变现工作流的一部分，不只是联盟导流附加项。因此，正确边界应包括发现、交易赋能和绑定金融，但排除
              OEM 制造经济、无关出行车队，以及所有从未触及平台信任层的线下交易。
