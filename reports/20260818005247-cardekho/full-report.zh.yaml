      - number: '6.3'
        title: 痛点与反向信号
        blocks:
          - type: paragraph
            body: >-
              保留评论和投诉来源中最强的反复反向模式，不是客户找不到车，而是交易本该完成后，支持、手续、RC 过户或服务后响应可能断裂。消费者投诉来源显示同一组问题：RC
              过户延误或出错、跟进缓慢、报销摩擦，或服务承诺后难以获得解决。Revv 相关投诉触点也出现类似模式；这很重要，因为 CarDekho 更广的生态逻辑需要相邻服务让用户觉得是加分，而不是风险。


              这一点重要，因为宽消费者生态在长尾执行失败时会被最严厉地评判。如果 CarDekho 想保持发现信任，并交叉销售相邻金融或出行产品，就必须让售后和预订后的体验，像售前主张一样可靠。
