      - number: '8.2'
        title: 当前估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              CarDekho 最有力的公开估值锚点，是 2021 年约 $1.2 billion 的独角兽轮，以及 2026 年 IPO 围绕约 Rs 13,000-15,000 crore 的表述。对照 FY25 约 Rs
              2,795 crore 收入，这个 IPO 区间在很多交易日隐含的收入倍数明显高于印度上市可比公司 CarTrade
              Tech，即使还没调整上市范围不确定性。重点不是说这个区间不可能——高增长私营资产常有战略或稀缺性溢价——而是这份溢价需要靠优于上市可比公司的经济性，或更宽的选择权来解释。


              可比公司怎么选很关键。CarTrade Tech 是印度流量和线索生成最相关的上市锚点。CarMax、Carvana 和 AUTO1
              提供更广的二手车和数字汽车零售参照，披露也更透明。上述上市可比公司应该给私募热度设上限，而不是被忽略。换句话说，CarDekho
              当前估值标记若作为战略性私募价值更容易辩护；若没有披露折价，就把它当作无须质疑的公开市场出清价，支撑要弱得多。
