  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与核心分层
        blocks:
          - type: paragraph
            body: >-
              CarDekho 不是单一客群故事。保留资料包指向至少五类相关客户：新车研究者、二手车买家、卖方或置换用户、通过 Rupyy 借款的金融用户，以及通过 Revv 和 InsuranceDekho
              等服务路由的相邻客户或伙伴。官方触点支持这一判断。主站结合新车和二手车发现，二手车目录证明供给宽度，金融页面把用户导入贷款工作流，招聘或集团材料显示公司运营着更宽的汽车及邻近品牌家族。应用商店和网页替代来源又提供一个重要线索：CarDekho
              维持着活跃的移动客户触点，意味着客户关系不只是从桌面搜索传给经销商的一条线索。


              按分层看，保留证据压倒性地指向 B2C
              和准专业消费者行为，而不是大型企业账户基础。经销商、贷款方和保险方很重要，但通常是消费者旅程中的供给或伙伴侧参与者。这让客户集中度更多绑定在城市执行、支持质量和转化经济性上，而不是少数具名企业客户标识。
