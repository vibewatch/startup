  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              CarDekho 的产品最好理解为一个多触点汽车电商和研究工作流，而不是单一消费者应用。公司把新车发现、二手车浏览、对比工具、路测、汽车视频、融资旅程和相邻服务放进一个品牌家族。最强的官方产品标记是
              CarDekho 主站、二手车目录、车型对比工具、路测和视频触点，以及把用户导入 Rupyy 产品的金融工作流。这些触点显示，产品设计离不开线索捕获、内容和伙伴分发，而不只是一个严格受控的库存承诺。


              产品组合也显然有分层。BikeDekho 把发现延伸到两轮车，ZigWheels 拓宽内容和区域触达，Revv
              增加订阅或租赁式出行服务。这让平台比通用市场更模块化，尽管公开来源仍主要通过面向客户的工作流，而不是工程文档，来描述大多数模块。因此，产品承诺既取决于面向消费者的软件，也同样取决于协调好的运营和伙伴流。
