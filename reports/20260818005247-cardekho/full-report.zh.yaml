      - number: '1.4'
        title: 规模信号、重组与 2026 年 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              当前最强的承销信号是运营规模和财务纪律改善，不是已经完全落定的上市故事。Entrackr 引述公司新闻稿的 FY25 报道给出最干净的当前数字：合并经营收入 Rs 2,795
              crore，剔除特殊项目和联营公司亏损后的亏损 Rs 266 crore，净现金 Rs 1,177 crore，核心汽车分类信息和金融业务连续第二年单体盈利，以及 Rupyy 跨车辆类别放款约 Rs 16,000
              crore。对一家后期私营公司而言，这些都是有意义的成熟信号。但同一证据包也说明 IPO 逻辑仍有条件。2025 年 Bloomberg 联合报道称，CarDekho
              曾推迟早先的申报意向，同时二手车同行削减成本、推进上市准备重组。Moneycontrol 和 ETAuto 给出更尖锐的提醒：CarDekho 因持续烧钱在 2023
              年退出二手车零售业务，更多依赖高毛利保险和交易驱动服务，并曾探索与 CarTrade 在 2025 年 11 月合并，后又放弃。IndianStartupNews 随后描述了估值 Rs 13,000-15,000
              crore 的 2026 年 IPO 重启计划，但投资人应把它视为据报道的目标，而不是市场已经接受的价格。
