      - number: '2.2'
        title: 规模测算视角与保留矛盾的必要性
        blocks:
          - type: paragraph
            body: >-
              公开资料包不支持一个唯一权威的印度二手车总可用市场（TAM）。它支持的是一个有边界的区间和几组结构性交叉校验。Mordor 将 2025 年市场估为 $36.39 billion、2026 年为 $41.74
              billion，IMARC 将 2025 年置于 $40.43 billion，GMI 对同一年给出 $30.8 billion。这些差异不小，不能在不承认方法漂移的情况下简单平均掉。更一致的是方向：FY26
              二手车销量应超过 6 million 辆，二手 / 新车比约 1.4，印度在该比率上仍落后成熟市场，未来正规化仍有空间。Redseer 又加入一个长期交易视角：到 FY31 零售交易量 9-10 million
              笔。对 CarDekho
              来说，可投资的解读是总可用市场（TAM）明显很大，但更近的可服务市场（SAM）是有组织、由信任中介、发现加金融的切片，而不是印度每一卢比二手车交易额。决定性矛盾在于有组织份额算法：有些出版方仍把市场描述成压倒性无组织，另一些已经显示有组织渠道占主导。这种分歧本身就是尽调事实。
