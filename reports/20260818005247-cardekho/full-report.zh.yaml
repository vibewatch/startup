  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的主要风险
        blocks:
          - type: paragraph
            body: >-
              CarDekho
              的风险画像由一个核心张力驱动：公司出售的是宽生态故事，而这个品类的公开市场投资人越来越想要更简单、更清晰、更可衡量的盈利故事。因此，边界清晰度、披露质量和伙伴中介执行，比它们在普通市场平台中看起来更重要。保留证据显示，公司最反复出现的强风险，不是消费者需求是否存在，而是多线汽车、金融、保险和邻近战略能否被阐述并执行得足够干净，足以进入公开市场。从这个意义上，CarDekho
              的宽度既是护城河，也是脆弱点。


              本章最重要的风险包括：IPO 时间和披露风险、InsuranceDekho 周围的分拆和边界复杂性、东南亚和相邻服务的执行风险、CarTrade 及其他已上市或准备 IPO
              对手的竞争压力，以及可能削弱信任的客户侧手续或支持失败。公司正瞄准公开市场，未解决的运营或结构问题会比纯私营成长故事承受更高惩罚。
