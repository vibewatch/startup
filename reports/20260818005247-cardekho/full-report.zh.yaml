chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与品牌架构
        blocks:
          - type: paragraph
            body: >-
              CarDekho 现在的核心身份，已经不只是外界熟悉的印度汽车搜索门户。官方资料和高信誉二手来源一致显示，业务由 Girnar Software Pvt. Ltd. 运营，Amit Jain 与 Anurag
              Jain 在 Jaipur 搭建，创始人看到印度缺少透明的汽车发现方式后，于 2008 年推出 CarDekho。当前官方触点呈现的是多品牌矩阵，而非单一网站生意：CarDekho 做汽车，BikeDekho
              做两轮车，ZigWheels 做研究和评测，rupyy 做融资，Revv 做出行，Carrum 做车队管理，InsuranceDekho 则仍有关联但在单独演进保险业务。商业模式也明显是多层的。CarDekho
              首页和二手车库存页展示新车发现、对比和深度挂牌；2021
              年融资公告则明确把增长重点放在二手车交易、金融服务和保险。后续章节应把它的基线定义为一个一体化汽车电商和汽车金融服务生态：发现流量、经销商整合、融资通道和内容资产相互强化，而不是一个薄薄的分类信息网站。
