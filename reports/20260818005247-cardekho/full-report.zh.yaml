      - number: '7.4'
        title: 缓释措施、监控指标与终止条件
        blocks:
          - type: paragraph
            body: >-
              证据暗示的缓释措施很清楚，即便管理层尚未全部公开披露。InsuranceDekho 和东南亚周围的边界不清，需要明确报告。支持和手续失败需要可衡量的解决 SLA 和城市级升级控制。来自 CarTrade
              和其他同业的竞争压力，需要更干净解释 CarDekho 宽生态为何能可持续赚钱，而不是只吸引流量。IPO 准备需要更多披露，不只是更多收入。


              投资逻辑破裂可能来自四类事件之一：公开申报过程暴露的分部经济性远弱于私下报道暗示；证据显示投诉或支持失败率随规模增长上升；一旦投资人把 InsuranceDekho
              单独看待，核心汽车资产的战略价值明显变弱；或东南亚、出行等相邻业务在没有相应回报的情况下扩张失败。这些都足够可衡量，可在下一轮刷新中监控。
