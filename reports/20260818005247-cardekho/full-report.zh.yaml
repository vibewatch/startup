      - number: '2.3'
        title: 买方、用户、付费方与采用路径分层
        blocks:
          - type: paragraph
            body: >-
              CarDekho 可触达市场的分层，与其说按车辆类别，不如说按预算逻辑和工作流责任。首次购车者尤其重要：Mobility Intelligence Report 2026 称，80-82%
              的二手车买家是首次拥有汽车，Autopunditz 对 CARS24-Team-BHP
              报告的综合也指向首次需求是主要驱动。这些买家往往需要融资、信心和文件支持，而不只是挂牌数量。向上升级的人群是另一大队列：他们借二手车买到配置更高的车辆，尤其是 SUV
              和自动挡，同时不必支付当前新车价格。卖方和置换客户又不同，他们看重更快流动性和价格发现。经销商位于市场另一侧，关心库存来源、融资额度和周转速度。贷款方和保险方本身也是付费方，因为它们变现的是转化，而不只是车辆所有权。这个分层重要，因为
              CarDekho 横跨研究流量、融资和经销商工具；即便不拥有完整的资产负债表零售交易，它也能在旅程不同节点变现。
