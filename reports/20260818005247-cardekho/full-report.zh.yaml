      - number: '3.4'
        title: 哪些变化会改写竞争判断
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争未解问题关乎经济性和结构，不只是功能。CarDekho
              可以在战略上比单一业务同业更宽，但如果过多流量变现为低收益线索、融资绑定弱于预期，或相邻业务消耗管理层注意力却不提高伙伴留存，仍可能跑输。CarTrade 2025
              年合并谈判破裂说明全行业都能看到战略价值，但也说明行业领导权还没有收敛到单一赢家。公开 IPO 报道和行业覆盖暗示，投资人更施压要求更精简、更盈利的模式，而不是不计成本增长。


              三项变化会最快改写竞争判断。第一，更清晰披露 CarDekho
              在媒体、分类信息、融资和任何库存驱动运营之间的结构，能显示生态逻辑是否真的复利。第二，更多经销商留存、金融绑定率以及与相邻业务客户重叠的证据，能说明交叉销售是真护城河还是只是相邻业务。第三，如果 OEM
              认证或公开市场竞争者拿出更强公开证据，证明它们能在不承担重度烧钱的情况下匹配数字便利性，CarDekho 的相对优势会被压缩。眼下，CarDekho 看起来战略上宽、商业上相关、竞争上受挑战，而不是竞争地位稳固。
