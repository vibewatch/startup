  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、规模与结构
        blocks:
          - type: paragraph
            body: >-
              CarDekho 当前财务故事不再只是分类信息门户变现线索。保留证据显示，运营结构更宽，覆盖汽车分类信息、通过 Rupyy 提供融资、国际业务和关联邻近业务。Entrackr 的 FY25
              报道是核心来源：合并经营收入从上一年约 Rs 2,250 crore 提升至约 Rs 2,795 crore；集团新闻稿口径强调，单体核心汽车分类信息和汽车金融业务连续第二年盈利。这个组合重要，因为
              CarDekho 既不应被当作纯库存重资产零售商，也不应被当作轻资本软件公司来评估。它更接近一个多产品市场和分发平台，其财务质量取决于能否把受众触达变现金融、保险相邻和伙伴驱动的交易流。


              规模指标强化了这一判断。Rupyy 在 FY25 促成约 Rs 16,000 crore 贷款发放，新车金融几乎翻倍；公司称平台现已服务印度超过 95%
              的邮编区。这些指标指向真实吞吐量和网络触达，但仍没有完全披露哪些业务线创造最佳单位经济模型。
