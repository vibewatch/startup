  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与类型
        blocks:
          - type: paragraph
            body: >-
              CarDekho 并不只在一个狭窄同业集合内竞争。保留来源包至少显示五类相关竞争者。第一类是 CARS24 和 Spinny 这样的全栈二手车零售平台，在检测、认证、融资、交付和交易支持上重叠最深。第二类是
              CarWale、OLX 以及 CarTrade 部分业务这样的流量驱动发现平台；它们不需要控制每个库存环节，因此能以更低资产强度聚合更多原始买卖意图。第三类是 Maruti Suzuki True Value
              这样的 OEM 认证存量玩家，它们以品牌背书信任、检测纪律和密集实体覆盖竞争。第四类是相邻金融和保险专门玩家，它们攻击的是 CarDekho 的变现层，而不是发现界面。第五类是 CarTrade Tech 和
              CarMax 这样的公开市场或资本市场可比公司，它们抬高了披露和效率标尺。


              这点重要，因为 CarDekho 的模式有意做成混合型。它的首页、二手车发现触点和金融邻近业务，把公司放在媒体驱动市场与闭环零售运营商之间。混合位置扩大变现选项，但也意味着 CarDekho
              必须抵御为更窄任务优化的竞争者：更深零售控制、更便宜流量、更强 OEM 信任，或更专注的保险 / 信贷焦点。
