            body: >-
              运营上，CarDekho
              依赖多个环节：发现流量、经销商或卖方响应、融资和手续完成、支持响应，以及相邻服务执行。模式规模越大，协同失败越容易浮出水面。投诉证据显示，最弱环节常在手续、跟进或售后支持，而不是初始发现体验。这是实质警告，因为线索扩张快于后台质量，会侵蚀信任。


              财务和战略上，该品类仍容易受到竞争性折扣、公开市场可比公司和周期性消费需求影响。本地公开可比 CarTrade 和更广二手车市场证据显示，一旦披露或运营清晰度令人失望，资本市场判断会迅速收紧。长期技术变化，尤其是
              EV 渗透，会通过改变残值行为和服务复杂度带来更慢燃的风险。这意味着运营滑坡和市场压力风险会互相强化，而不是作为彼此独立的问题出现。
