      - number: '2.4'
        title: 增长驱动、采用约束及对 CarDekho 的含义
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动是可负担性、融资可得性、数字发现和车辆更快置换。新车价格上涨拉大了二手车与新车的价差；融资渗透、AI
              辅助承保和平台与贷款方合作，也让预算敏感用户更容易拥有车辆。报废激励和寿命终止规则也能支持更快换车和正规化。但几项约束同样重要。信任仍是核心结构性问题：Redseer 仍将约 80%
              的交易描述为无组织，多项来源称买家持续关心质量不透明、文件和整备完整性。盈利能力是另一项约束，不只是脚注。CRISIL 相关来源称，有组织玩家仍面临高获客、物流和整备成本，并在走向盈亏平衡时依赖流动性。EV
              转售还是一个新兴不确定性，因为电池健康和残值基准仍不成熟。对 CarDekho
              来说，含义很清楚：它最好的市场位置，不是吸收全部二手车库存风险，而是站在信任、融资和转化基础设施能赚到有吸引力经济性的地方，同时不重建 2023 年资产负债表沉重零售的烧钱曲线。
