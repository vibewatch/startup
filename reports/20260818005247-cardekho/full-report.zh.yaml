      - number: '5.2'
        title: 工作流与运营架构
        blocks:
          - type: paragraph
            body: >-
              核心客户工作流从数字研究开始：对比车型、看视频、读路测、浏览新车和二手车库存，然后进入融资或相邻服务流。从这个意义上，CarDekho
              更像汽车决策的发现与分发操作系统，而不是纯分类信息门户。产品架构因此横跨内容生产、搜索与筛选、线索路由、卖方或经销商触点、融资和下游出行服务。


              这套架构也解释了为什么公开技术证据稀疏。CarDekho 暴露了丰富消费者触点，但保留资料包不包含公开 API
              文档、开源仓库、状态页或深入工程手册。最接近公开开发者信号的替代指标，是金融产品页面、服务列表，以及生态在 CarDekho、Rupyy、BikeDekho、ZigWheels 和 Revv
              之间路由用户的模块化方式。这让产品从工作流角度可读，但内部软件和伙伴集成架构仍大体不透明。
