      - number: '7.2'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              证据最直接的结构性风险集中在边界和治理。InsuranceDekho 有自己的投资人材料、年报和重组报道；公开报道也越来越把它讨论成一个准备 IPO
              或独立资本化的业务。这有助于厘清价值，但也制造风险：投资人可能把更大集团的实力，过多或过少归因于一个未必完整留在最终 CarDekho 上市边界内的业务。被放弃的 CarTrade
              谈判提供第二个结构性警告。战略兴趣存在，但拟议合并没有完成，说明控制权、范围和定价并不容易对齐。


              治理风险更宽。CarDekho 正接近 IPO 窗口，但公开记录仍缺少公开市场投资人通常期待的分部、董事会和控制权细节。再叠加相关邻近业务的复杂性，治理负担会进一步上升。
