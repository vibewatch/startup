      - number: '8.4'
        title: 退出准备度、终止触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              CarDekho 走 IPO 路线说得通，但说得通不等于已经准备好。公开市场投资人要的不只是收入增长和市场叙事。他们会要求公司说清利润率、现金流、客诉或客服支持经济性、InsuranceDekho
              和东南亚的确切处理方式，以及 CarTrade 式上市可比公司是否意味着倍数天花板低于私募故事。因此，决定性尽调问题全是公司和运营层面的具体问题，而不是泛泛的市场规模问题。


              如果申报过程显示分部经济性明显弱于二手资料暗示，如果公开市场可比公司估值下修而 CarDekho
              仍试图维持溢价，或者如果投资人认为更大集团的感知价值太多落在上市范围之外，投资逻辑就会破裂。反过来，若利润率和范围处理披露更干净，立场可能明显上调。在此之前，投资案仍有意思，但尚未完成。因此，举证责任落在新的申报文件上，而不是乐观叙事上。
