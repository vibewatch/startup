      - number: '3.2'
        title: 能力、定价与模式差异
        blocks:
          - type: paragraph
            body: >-
              CarDekho 相比直接二手车零售同业最强的差异化是宽度。官方触点显示集团横跨新车发现、二手车挂牌和更广汽车服务，而 CARS24 和 Spinny 给出的承诺更受交易控制。CARS24 强调 300
              点检测、固定定价、退货、经销商通道和售后用车服务。Spinny 强调 200 点检测、认证、质保和金融支持。CarDekho
              的公开产品叙事不同：它宣传大规模发现库存、认证车筛选、经销商或门店触点和金融邻近业务；但它的二手车体验天然更可变，因为并非每条线索都跑过一套统一的自有零售流程。


              CarTrade Tech 和 CarWale 位于光谱另一端。它们的公开材料强调受众规模、投资人级披露、二手车发布和伙伴生态，而不是一条紧密受控的检测到交付路径。OLX 保留了谈判密集的分类信息路线。True
              Value 等 OEM 认证项目则靠标准化和服务网络信任竞争。相关结论是，CarDekho 并不想做最窄的零售专家；它想把更宽的发现、融资和相邻服务宽度，转化为可防守的多产品汽车平台。
