        title: 公开市场准备度与未解缺口
        blocks:
          - type: paragraph
            body: >-
              公开和准公开可比公司存在，意味着如果 CarDekho 进入 IPO 窗口，就不能只靠私募市场动能。CarTrade Tech
              已经提供一个有披露文件的本地基准；全球二手车可比公司也显示，市场评判规模时看的是利润率、现金流和资产负债表风险，而不是 GMV 式故事。保留记录因此指向一个熟悉的后期模式：投资人可能因盈利改善和资本缓冲奖励
              CarDekho，但仍会要求更清楚的分部报告、更干净的邻近业务处理，以及更有力解释核心汽车电商相对相邻业务到底拥有多少价值。


              今天最大的未解问题是披露缺口。公开记录没有披露按城市的贡献利润率、金融或保险绑定经济性、各业务线现金转化，或 InsuranceDekho
              和东南亚在上市边界中的精确处理。这些缺口不会抹掉公司已取得的进展；它们只是限制投资人在承销估值、资本需求或 IPO 时间时能有多精确。
