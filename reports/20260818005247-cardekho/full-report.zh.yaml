      - number: '1.3'
        title: 融资历程、投资人地图与战略股东
        blocks:
          - type: paragraph
            body: >-
              CarDekho 的融资故事有两层：母集团长期在私募市场搭建，东南亚子公司则近期完成区域融资。最清晰的官方估值锚点仍是 2021 年 10 月，CarDekho 宣布 $250 million 的 IPO
              前融资轮，其中包括 $200 million Series E 股权和 $50 million 债务，把集团估值推至 $1.2 billion，也让它成为 Jaipur 第一家独角兽。该轮引入 LeapFrog
              Investments、Canyon Partners、Mirae Asset、Harbor Spring Capital，并获得 Sequoia India 和 Sunley House
              跟投。公共数据供应商暗示累计融资更深，但具体总额并不一致：Inc42 认为截至 2024 年 12 月 CarDekho 融资超过 $752 million，Tracxn 则显示 GirnarSOFT 约
              $620 million，当前估值 $1.16 billion。随后东南亚单元在 2024 年 12 月获得自己的外部验证，从 Navis Capital Partners 和 Dragon Fund 融资
              $60 million。这个区域融资轮重要，因为它表明外部资本仍在押注一个增长楔子；但它不能替代母公司层面的最新合并股权结构表和逐工具融资台账。
