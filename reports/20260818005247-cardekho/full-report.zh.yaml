      - number: '3.3'
        title: 分发能力、切换成本与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              印度汽车电商的分发能力分散在不同模式中，CarDekho 并不全部拥有。CarWale 宣称有超过 110,855 条二手车挂牌、超过 3.5 million 月度二手车买家。OLX 宣称有超过 311,966
              条二手车挂牌。Maruti Suzuki True Value 称其在 334 个城市有 652 家门店、超过 6 million 客户。CarTrade Tech 称 CarWale、BikeWale 和
              OLX India 各自突破 150 million 年度独立用户，显示流量驱动竞争者的规模优势；它们不需要 CarDekho 的精确业务组合。与此同时，CARS24 和 Spinny
              通过检测项目、退货、认证和用车服务，在受控信任交易上更直接竞争。


              CarDekho
              的护城河因此很宽，但不均匀。它取决于新车流量、二手车发现宽度、经销商关系、融资触达和相邻服务交叉销售，是否比更简单的单产品竞争者创造更多用户和伙伴留存。这些在生态层面是有意义的切换成本，但在单笔交易层面，弱于那些端到端拥有更多购车旅程的零售商。CarDekho
              在买家或伙伴看重对比深度、线索流和融资触达时最强；在买家优先要一个标准化检测承诺或一个 OEM 背书信任标识时最弱。
