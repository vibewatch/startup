            body: >-
              CarDekho 与其说只是运营故事，不如说同样是资本市场故事。保留来源包显示一串融资和战略价值标记：2021 年 $250 million 融资把公司推至独角兽，2024 年 12 月东南亚扩张融资 $60
              million，以及 2025-2026 年围绕 Rs 13,000-15,000 crore 目标估值的 IPO 叙事。与此同时，集团中的 InsuranceDekho
              侧正在走向更单独的披露和融资逻辑，包括自己的投资人材料和重组报道。这很重要，因为围绕 CarDekho 的部分感知价值来自集团可选性，而这些价值未必会完整装入最终上市边界。


              被放弃的 CarTrade 交易也有财务意义。它表明战略买方看到了 CarDekho
              汽车分类信息和相关业务的实质价值；但谈判破裂说明价格、结构和控制权并不容易解决。对承销商而言，这既是正面战略信号，也提醒可比价值基准仍很嘈杂。
