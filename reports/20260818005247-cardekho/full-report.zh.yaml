      - number: '8.3'
        title: 乐观、基准与悲观逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：CarDekho 守住强劲增长，证明核心汽车交易加 Rupyy 能盈利复合增长，避免 InsuranceDekho 的上市范围疑虑侵蚀股权故事，并带着比怀疑者预期更干净的披露进入 IPO
              窗口。在这种情景下，公司有理由守住甚至小幅抬高当前 IPO 区间。基准情景更保守：增长仍稳健，IPO 路径保持打开，但公开市场投资人仍要求披露和范围折价，估值大体被锁在拟议区间附近。


              悲观情景把证据集中已经可见的几个风险叠在一起：公开市场倍数压缩；若投资人心理上把 InsuranceDekho 与 CarDekho
              切开，战略价值外泄；以及申报文件坐实后，分部经济性弱于预期。在这种情况下，历史独角兽估值锚点会变成天花板，而不是地板。这些情景解释了为什么立场是观察而不是追高：上行空间存在，但结果分布仍很宽。
            claimRefs:
              - CV022
