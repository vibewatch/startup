      - number: '1.2'
        title: 领导层、治理可见度与法律结构
        blocks:
          - type: paragraph
            body: >-
              公开证据让领导班子比实际控制栈更清晰。招聘页面的领导层板块列出 Amit Jain 为集团联合创始人兼 CEO，Anurag Jain 为集团联合创始人兼 COO，Umang Kumar 为 CarDekho
              SEA 联合创始人兼 CEO，Mayank Gupta 为 CFO，Mayank Jain 为 Auto Classifieds CEO，Namit Jain 为 rupyy 联合创始人兼 CEO，Ankit
              Agarwal 为 InsuranceDekho 创始人兼 CEO，Anupam Agarwal 为 Revv 联合创始人兼 CEO。Tofler 和 Tracxn 也让法律实体图谱变得部分可读：Girnar
              Software Private Limited 是主要私营母公司，2006 年 12 月在 Jaipur 注册；Tracxn 和 TheCompanyCheck 显示更宽的实体栈，包括 Girnar
              Finserv、Girnar Growth Ventures，以及 2025 年 11 月成立的较新载体 Cardekho Autoverse。即便如此，以 IPO 承销标准看，治理披露仍不完整。Tracxn 和
              Tofler 露出部分董事名单，但 CarDekho 没有公开给出当前股东权利包、优先股堆叠或招股书级别的董事会委员会地图。正确的尽调判断是：公司显然由创始人主导、法律实体成立已久，但在治理细节披露上仍相当私密。
