            body: >-
              CarDekho 公开财务画像中最强积极信号，是亏损强度似乎在下降，同时管理层仍保留多条增长向量。Entrackr 称 FY25 合并亏损从 FY24 约 Rs 276 crore 收窄至约 Rs 266
              crore，并单独指出集团年末净现金约 Rs 1,177 crore。这些数字还不能说明公司已解决所有盈利问题，但确实显示出比许多承受 IPO 压力的私营成长同业更好的平衡。同一来源还称汽车分类信息分部盈利增长
              60%，单体收入突破 Rs 1,000 crore，意味着核心印度汽车电商触点比合并口径标题更健康。


              这种改善仍需谨慎解读。公开来源在 FY25 P&L
              的具体口径上并不一致，记录也没有给出一座干净的桥，把核心分类信息、Rupyy、东南亚、出行和保险相关经济性连接起来。我们可以方向性地说公司更强、更精简；但还不能准确说稳态集团利润率会落在哪里。
