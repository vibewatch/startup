          values:
            - 中
            - 升级个案上高
            - 低
            - 高
    approximationNotes: null
    claimRefs:
      - CU012
      - CU015
      - CU021
      - CU036
  - id: FU004
    title: 留存 / 复购队列（估计）
    type: cohort
    layout: standard
    summary: Spinny 未披露队列数据，这里按客户分群估计忠诚度区间。
    data:
      columns:
        - 第 1 年留存
        - 第 2 年留存
        - 第 3 年留存
      rows:
        - label: 推荐来源买家
          values:
            - value: 75
            - value: 55
            - value: 40
        - label: 普通零售买家
          values:
            - value: 65
            - value: 45
            - value: 30
        - label: 高端 / Spinny Max 买家
          values:
            - value: 70
            - value: 50
            - value: 35
        - label: 回流进行下一笔交易的卖家
          values:
            - value: 35
            - value: 20
            - value: 10
    approximationNotes: 公开队列数据缺失；数值为分析估计，锚定推荐强度、零散复购证据和典型消费者汽车复购行为。
    claimRefs:
      - CU032
      - CU031
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 本章最高影响风险的序数视图。
    data:
      columns:
        - 可能性：低
        - 可能性：中
        - 可能性：高
      rows:
        - label: 高影响
          values:
            - IPO 披露缺口
            - GoMechanic 整合
            - RC 过户 / 支持失效
        - label: 中等影响
          values:
            - EV 转型
            - 资本密集度
            - 城市执行不一致
        - label: 较低影响
          values:
            - 高端产品线不及预期
            - 宏观噪音
            - 评论渠道流失信号
    approximationNotes: 矩阵单元是基于留存证据的序数严重程度分组，不是定量 ERM 模型。
    claimRefs:
      - CR011
      - CR001
      - CR034
      - CR013
      - CR020
      - CR019
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 几项核心风险会迅速传导到信任、转化、利润率和估值。
    data:
      nodes:
        - id: paper
          label: 手续 / RC 失败
        - id: support
          label: 支持不满
        - id: trust
          label: 信任受损
        - id: conv
          label: 转化 / 推荐降低
        - id: margin
          label: 单位经济性恶化
        - id: value
          label: 估值下行
      edges:
        - from: paper
          to: trust
          label: 导致
        - from: support
          to: trust
          label: 导致
        - from: trust
          to: conv
          label: 降低
        - from: conv
          to: margin
          label: 削弱
        - from: margin
          to: value
          label: 压缩
    approximationNotes: null
    claimRefs:
      - CR001
      - CR004
      - CR038
      - CR022
      - CR035
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Spinny 的风险面由外部机构和内部运营共同塑造，所有环节都要协同运转。
    data:
      nodes:
        - id: spinny
          label: Spinny 交易 + 车主体验
        - id: rto
          label: RTO / NOC / 前车主流程
        - id: inspect
          label: 检测员 / QA 运营
        - id: finance
          label: 金融合作伙伴
        - id: service
          label: 服务网络 / GoMechanic
        - id: support
          label: 客户支持团队
        - id: market
          label: 竞争 / 宏观市场
      edges:
        - from: rto
          to: spinny
          label: 完成法律闭环
        - from: inspect
          to: spinny
          label: 保障质量
        - from: finance
          to: spinny
          label: 支撑可负担性
        - from: service
          to: spinny
          label: 延伸车主服务
        - from: support
          to: spinny
          label: 处理问题
        - from: market
          to: spinny
          label: 挤压利润率
    approximationNotes: null
    claimRefs:
      - CR008
      - CR012
      - CR028
      - CR037
      - CR018
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论沿着公司质量、证据质量和价格敏感性这条链条推出。
    data:
      nodes:
        - id: market
          label: 正规化大顺风
          detail: 品类仍有吸引力
          tone: positive
        - id: traction
          label: 真实规模和增长
          detail: FY25 收入和 FY26 展望有分量
          tone: positive
        - id: gaps
          label: 披露和整合缺口
          detail: 利润率、现金流和 GoMechanic 证据仍待补齐
          tone: warning
        - id: risk
          label: 高风险评级
          detail: 运营和治理问题仍然重要
          tone: warning
        - id: track
          label: 观察建议
          detail: 对价格和证据都敏感的立场
          tone: neutral
      edges:
        - from: market
          to: traction
          label: 支撑
        - from: traction
          to: gaps
          label: 但仍面对
        - from: gaps
          to: risk
          label: 造成
        - from: risk
          to: track
          label: 因此
    approximationNotes: null
    claimRefs:
      - CV024
      - CV009
      - CV010
      - CV026
      - CV003
      - CV001
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 把不同收入倍数假设套用到 Spinny FY26 收入展望后，得到示意性隐含企业价值。
    data:
      items:
        - label: 1.5x
          value: 1.08
        - label: 2.0x
          value: 1.44
        - label: 2.5x
          value: 1.8
        - label: 3.0x
          value: 2.16
        - label: 3.5x
          value: 2.52
    unit: USD B approx
    approximationNotes: 用粗略的 FY26 收入折算把 Rs 6,000 Cr 换算为 USD，仅用于示意性敏感性分析，不是精确 DCF。
    claimRefs:
      - CV010
      - CV020
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于已披露增长和未解决风险得出的公司层面可能结果区间。
    data:
      items:
        - label: 悲观情景
          low: 1
          base: 1.2
          high: 1.4
          unit: USD B
        - label: 基准情景
          low: 1.5
          base: 1.8
          high: 2.1
          unit: USD B
        - label: 乐观情景
          low: 2.1
          base: 2.4
          high: 2.8
          unit: USD B
        - label: 当前公开锚点
          low: 1.75
          base: 1.75
          high: 1.8
          unit: USD B
    approximationNotes: 区间综合公开收入规模、品类可比公司和私人市场不确定性；性质是分析区间，不是市场报价。
    claimRefs:
      - CV008
      - CV028
      - CV029
      - CV030
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的快照，概括 Spinny 与估值相关的优势和缺口。
    data:
      items:
        - label: 投资建议
          value: Track
          context: 公司有吸引力，但定价证据不完整
          tone: neutral
        - label: 风险评级
          value: High
          context: 运营和整合风险仍然重要
          tone: warning
        - label: 估值立场
          value: Fair-Stretched
          context: 当前估值标记站得住，但并不明显便宜
          tone: warning
        - label: FY25 收入
          value: 4657
          unit: INR Cr
          context: 私人公司已做到可观规模
          tone: positive
        - label: 最新公开估值锚点
          value: 1.75
          unit: USD B
          context: 仍是最接近、最干净的公开标记
          tone: neutral
        - label: 关键缺失证据
          value: Margins / cash flow
          context: 阻碍更强信念的主因
          tone: warning
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV009
      - CV005
      - CV039
