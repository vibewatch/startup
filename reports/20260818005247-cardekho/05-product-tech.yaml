chapter:
  number: 5
  title: Product & Technology
  summary: CarDekho's product is best understood as an ecosystem of discovery, comparison, financing, and adjacent mobility services rather than as one closed-loop used-car retail product. Public evidence supports high maturity in consumer-facing content, comparison, listings, and financing modules—plus clear extensions through BikeDekho, ZigWheels, and Revv—while also showing that deeper technical architecture, internal reliability tooling, and partner-system integration remain largely opaque from the outside.
sections:
- id: product-definition-and-modules
  title: Product definition and module map
  body: 'CarDekho''s product is best understood as a multi-surface auto-commerce and research workflow rather than a single consumer app. The company combines new-car discovery, used-car browsing, comparison tools, road tests, car videos, financing journeys, and adjacent services within one brand family. The strongest official product markers are the main CarDekho homepage, the used-cars catalogue, the compare-cars tool, the road-test and video surfaces, and the finance workflows that route users into Rupyy products. Those surfaces show that product design is inseparable from lead capture, content, and partner distribution rather than only from a tightly controlled inventory promise.


    The portfolio also clearly has a segmentation layer. BikeDekho extends discovery into two-wheelers, ZigWheels broadens content and regional reach, and Revv adds subscription or rental-like mobility services. This makes the platform more modular than a generic marketplace, even though public sources still describe most modules through customer-facing workflows rather than through engineering documentation. The product promise therefore depends on coordinated operations and partner flows as much as on consumer-facing software.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-and-operating-architecture
  title: Workflow and operating architecture
  body: 'The core customer workflow begins with digital research: compare cars, watch videos, read road tests, browse new-car and used-car inventory, and then move into financing or adjacent service flows. In that sense, CarDekho is closer to a discovery-and-distribution operating system for automotive decisions than to a pure classifieds portal. The product architecture therefore runs across content production, search and filtering, lead routing, seller or dealer touchpoints, financing, and downstream mobility services.


    This architecture also explains why public technical evidence is sparse. CarDekho exposes rich consumer surfaces, but the retained pack does not include public API docs, open-source repositories, status pages, or deep engineering handbooks. The closest public developer-signal proxies are the finance product pages, service listings, and the modular way the ecosystem routes users across CarDekho, Rupyy, BikeDekho, ZigWheels, and Revv. That makes the product legible from a workflow perspective while leaving the inner software and partner-integration architecture largely opaque.'
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
