- id: trust-quality-and-differentiation
  title: Trust, quality controls, and differentiation
  body: 'Product differentiation at CarDekho is built more on breadth, audience intent capture, and adjacent-service attachment than on one publicly documented algorithmic moat. The used-car catalogue, compare tools, road tests, and finance pathways help keep users inside one ecosystem from research through transaction support. That is a very different product logic from CARS24 or Spinny, which emphasize inspection depth, returns, and certification as the center of the proposition. CarDekho''s advantage is that it can monetize multiple user jobs across the auto journey even when the underlying used-car transaction is not fully standardized.


    Competitor comparison also clarifies the boundaries of differentiation. Where direct retail peers compete on controlled trust stacks, CarDekho competes on discovery breadth, comparison depth, and financial distribution. That makes the product broader but also more partner-dependent. Product strength therefore depends on content freshness, lead quality, dealer response, finance completion, and service follow-through—not only on user-interface design.'
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap-dependencies-and-risks
  title: Roadmap, dependencies, and product risks
  body: 'The clearest public roadmap signal is ecosystem extension rather than a single flagship feature. BikeDekho, ZigWheels, Rupyy, and Revv all show that the group keeps adding adjacent decision, financing, or ownership touchpoints around the core auto-discovery workflow. Strategically, that is sensible because automotive trust does not begin and end at vehicle search; it extends into financing, mobility, service resolution, and repeat usage.


    The same breadth also surfaces product risk. Complaint portals show that paperwork, issue resolution, and after-sale support can break the experience even when the front-end discovery experience is strong. That means CarDekho''s most important dependencies are not only content publishing and search interfaces but also dealer response quality, financing partners, customer support, documentation workflows, and services such as Revv. Product maturity should therefore be judged as an ecosystem capability stack, not as a pure software roadmap.'
  claimRefs:
  - CE030
  - CE031
  - CE032
