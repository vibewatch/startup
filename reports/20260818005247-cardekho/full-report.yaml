      - number: '1.3'
        title: Capital history, investor map, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              CarDekho's financing story has two layers: the parent group's long private-market buildout and the more
              recent regional financing at the Southeast Asia subsidiary. The clearest official valuation anchor remains
              October 2021, when CarDekho announced a $250 million pre-IPO round comprising $200 million of Series E
              equity plus $50 million of debt, taking the group to a $1.2 billion valuation and making it Jaipur's first
              unicorn. That round brought in LeapFrog Investments, Canyon Partners, Mirae Asset, Harbor Spring Capital,
              and follow-on backing from Sequoia India and Sunley House. Public data vendors suggest deeper cumulative
              funding, but they do not agree on the exact total: Inc42 puts CarDekho above $752 million funded through
              December 2024, while Tracxn shows GirnarSOFT at about $620 million and a $1.16 billion current valuation.
              The Southeast Asia unit then added its own external validation in December 2024, raising $60 million from
              Navis Capital Partners and Dragon Fund. That regional round matters because it shows outside capital still
              backing a growth wedge, but it does not replace the need for a current consolidated cap table and
              instrument-by-instrument financing ledger at the parent level.
