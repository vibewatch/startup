        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              CarDekho's product is best understood as a multi-surface auto-commerce and research workflow rather than a
              single consumer app. The company combines new-car discovery, used-car browsing, comparison tools, road
              tests, car videos, financing journeys, and adjacent services within one brand family. The strongest
              official product markers are the main CarDekho homepage, the used-cars catalogue, the compare-cars tool,
              the road-test and video surfaces, and the finance workflows that route users into Rupyy products. Those
              surfaces show that product design is inseparable from lead capture, content, and partner distribution
              rather than only from a tightly controlled inventory promise.


              The portfolio also clearly has a segmentation layer. BikeDekho extends discovery into two-wheelers,
              ZigWheels broadens content and regional reach, and Revv adds subscription or rental-like mobility
              services. This makes the platform more modular than a generic marketplace, even though public sources
              still describe most modules through customer-facing workflows rather than through engineering
              documentation. The product promise therefore depends on coordinated operations and partner flows as much
              as on consumer-facing software.
