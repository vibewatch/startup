              - CV010
              - CV020
              - CV031
      - number: '8.3'
        title: Bull, base, and bear logic
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: CarDekho preserves strong growth, shows that core auto-commerce plus
              Rupyy can compound profitably, keeps InsuranceDekho perimeter concerns from eroding the equity story, and
              enters the IPO window with cleaner disclosures than skeptics expect. In that world, the company can
              plausibly defend or modestly expand the current IPO range. The base case is more conservative: growth
              remains solid, the IPO path stays open, but public investors still require a disclosure and perimeter
              discount, leaving valuation broadly range-bound around the proposed zone.


              The bear case combines several risks already visible in the evidence set: public-market multiple
              compression, strategic-value leakage if investors mentally separate InsuranceDekho from CarDekho, and
              weaker-than-expected segment economics once filings harden. In that scenario, the historical unicorn
              anchor becomes a ceiling rather than a floor. These scenarios are why the stance is track rather than
              chase: the upside exists, but the spread of outcomes is still wide.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV028
              - CV029
              - CV030
