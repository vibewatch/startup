      - number: '3.3'
        title: Distribution power, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Distribution power in Indian auto commerce is fragmented across different models, and CarDekho does not
              own all of them. CarWale advertises more than 110,855 used-car listings and more than 3.5 million monthly
              used-car buyers. OLX advertises more than 311,966 used-car listings. Maruti Suzuki True Value says it has
              652 outlets across 334 cities and more than six million customers. CarTrade Tech says CarWale, BikeWale,
              and OLX India each crossed 150 million yearly unique users, demonstrating the scale advantage of
              traffic-led rivals that do not need CarDekho's exact business mix. Meanwhile, CARS24 and Spinny compete
              more directly on trust-controlled transactions through inspection programs, returns, certification, and
              ownership services.


              CarDekho's moat is therefore broad but not uniform. It depends on whether new-car traffic, used-car
              discovery breadth, dealer relationships, financing access, and adjacent-service cross-sell create more
              user and partner retention than a simpler single-product rival can offer. Those are meaningful switching
              costs at the ecosystem level, but they are weaker at the individual transaction level than a retailer that
              owns more of the car journey end to end. CarDekho is strongest where buyers or partners value comparison
              depth, lead flow, and financing access. It is weakest where buyers prioritize one standardized inspection
              promise or one OEM-backed trust badge.
