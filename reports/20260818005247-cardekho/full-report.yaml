            body: >-
              Product differentiation at CarDekho is built more on breadth, audience intent capture, and
              adjacent-service attachment than on one publicly documented algorithmic moat. The used-car catalogue,
              compare tools, road tests, and finance pathways help keep users inside one ecosystem from research through
              transaction support. That is a very different product logic from CARS24 or Spinny, which emphasize
