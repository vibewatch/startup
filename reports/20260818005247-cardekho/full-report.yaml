            body: >-
              The mitigations implied by the evidence are clear even if management has not publicly disclosed all of
              them. Perimeter ambiguity around InsuranceDekho and Southeast Asia needs explicit reporting. Support and
              paperwork failure need measured resolution SLAs and city-level escalation controls. Competitive pressure
              from CarTrade and other peers needs a cleaner explanation of why CarDekho's broad ecosystem earns
              sustainably rather than simply attracting traffic. And IPO preparation requires more disclosure, not just
              more revenue.


              A thesis-break would likely come from one of four events: a public filing process that exposes much weaker
              segment economics than private reporting implied, evidence that complaint or support failure rates are
              rising as volume grows, materially weaker strategic value for the core auto assets once InsuranceDekho is
              separated in investor minds, or a failed attempt to scale adjacencies such as Southeast Asia or mobility
              without corresponding return. Those are measurable enough to monitor in a refresh cycle.
            claimRefs:
              - CR012
              - CR014
              - CR023
              - CR026
              - CR029
              - CR030
              - CR031
              - CR038
              - CR040
          - type: table
            tableRef: TR005
            claimRefs:
              - CR001
              - CR009
              - CR035
              - CR022
              - CR034
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              On public evidence, CarDekho looks like a company to track rather than a company to price blindly. The
              case for interest is real: meaningful revenue scale, a durable unicorn-era anchor, an active IPO path, and
              a category that is formalizing quickly. The case for restraint is equally real: the company remains
              private, key valuation drivers such as business-line margins and cash flow are undisclosed, and investors
              still need much clearer treatment of what belongs inside the eventual listed perimeter versus what sits in
              related adjacencies such as InsuranceDekho.


              That combination supports a medium-confidence, high-risk, fair-to-full valuation stance. There is enough
              franchise value to avoid an outright avoid rating, but not enough public evidence to issue an
              uncomplicated buy-equivalent posture. The right stance is price-sensitive and diligence-sensitive.
              Investors should care at least as much about missing evidence as about the headline company story.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV031
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
