      - number: '3.4'
        title: What could change the competitive view
        blocks:
          - type: paragraph
            body: >-
              The most important competitive open questions are about economics and mix, not only features. CarDekho can
              look strategically broader than pure-play peers and still underperform if too much traffic monetizes into
              low-yield leads, if financing attachment is weaker than expected, or if adjacent businesses absorb
              management attention without increasing partner retention. The collapse of CarTrade's 2025 consolidation
              talks shows that strategic value is visible across the sector, but it also shows the category remains
              unsettled enough that leadership has not consolidated around a single winner. Public IPO reporting and
              sector coverage imply investor pressure for leaner, more profitable models rather than for growth at any
              cost.


              Three developments would change the competitive view fastest. First, clearer disclosure on CarDekho's mix
              between media, classifieds, financing, and any inventory-led operations would show whether the ecosystem
              thesis really compounds. Second, more evidence on dealer retention, finance attach rates, and customer
              overlap with adjacent businesses would show whether cross-sell is a real moat or just adjacency. Third,
              stronger public proof that OEM-certified or public-market rivals can match digital convenience without
              taking on heavy burn would compress CarDekho's relative advantage. For now, CarDekho looks strategically
              broad, commercially relevant, and competitively challenged rather than competitively secure.
