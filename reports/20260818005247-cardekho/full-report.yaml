              - CV009
              - CV005
              - CV039
      - number: '8.2'
        title: Current valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchors for CarDekho are the 2021 unicorn round at about $1.2 billion and
              the 2026 IPO framing around roughly Rs 13,000-15,000 crore. Against FY25 revenue of about Rs 2,795 crore,
              that IPO range implies a revenue multiple materially above listed Indian peer CarTrade Tech on many days,
              even before adjusting for perimeter uncertainty. The point is not that the range is impossible—high-growth
              private assets often carry strategic or scarcity premia—but that the premium needs to be justified by
              better economics or broader optionality than public comps provide.


              Comparable selection matters. CarTrade Tech is the most relevant Indian public anchor for traffic and lead
              generation. CarMax, Carvana, and AUTO1 provide broader used-car and digital auto retail reference points
              with more transparent disclosure. Those public comps should cap private exuberance, not be ignored. Put
              differently, the current CarDekho mark is easier to defend as a strategic private value than as an
              unquestioned public clearing price without a disclosure discount.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
