      - number: '3.2'
        title: Capability, pricing, and model differences
        blocks:
          - type: paragraph
            body: >-
              CarDekho's strongest differentiator versus direct used-car retail peers is breadth. Official surfaces show
              the group spans new-car discovery, used-car listings, and broader automotive services, while CARS24 and
              Spinny present much more transaction-controlled promises. CARS24 emphasizes a 300-point inspection, fixed
              pricing, returns, dealer rails, and post-sale ownership services. Spinny emphasizes a 200-point
              inspection, certification, warranty, and finance support. CarDekho's public product framing is different:
              it advertises large discovery inventory, certified-car filters, dealer or store touchpoints, and financial
              adjacencies, but its used-car experience is inherently more variable because not every lead runs through
              one uniform, owned-retail process.


              CarTrade Tech and CarWale sit on the other side of the spectrum. Their public materials emphasize audience
              scale, investor-grade disclosure, used-auto launches, and partner ecosystems rather than a tightly
              controlled inspection-to-delivery path. OLX preserves the negotiation-heavy classifieds route.
              OEM-certified programs such as True Value compete on standardization and service-network trust. The
              relevant conclusion is that CarDekho is not trying to be the narrowest retail specialist; it is trying to
              convert broader discovery, financing, and adjacent-service breadth into a defensible multi-product
              automotive platform.
