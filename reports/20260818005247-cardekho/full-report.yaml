  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks
        blocks:
          - type: paragraph
            body: >-
              CarDekho's risk profile is driven by one central tension: the company sells a broad ecosystem story in a
              category where public investors increasingly want simpler, clearer, and more measurable earnings stories.
              That makes perimeter clarity, disclosure quality, and partner-mediated execution more important than they
              might appear in a generic marketplace. The retained evidence shows that the company's strongest recurring
              risks are not around whether consumer demand exists, but around whether a multi-line auto, finance,
              insurance, and adjacency strategy can be articulated and executed cleanly enough for public markets. In
              that sense, CarDekho's breadth is both its moat and its fragility.


              The most material chapter-level risks are: IPO-timing and disclosure risk, separation and perimeter
              complexity around InsuranceDekho, execution risk in Southeast Asia and adjacent services, competitive
              pressure from CarTrade and other listed or IPO-bound rivals, and customer-facing paperwork or support
              failures that can undermine trust. Because the company is eyeing public markets, unresolved operational or
              structural issues carry a higher penalty than they would for a purely private growth story.
