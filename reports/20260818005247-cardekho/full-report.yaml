      - number: '2.2'
        title: Sizing lenses and the need to preserve contradictions
        blocks:
          - type: paragraph
            body: >-
              The public pack does not support a single canonical India used-car TAM. Instead it supports a bounded
              range and several structural cross-checks. Mordor values the 2025 market at $36.39 billion and 2026 at
              $41.74 billion, IMARC places 2025 at $40.43 billion, and GMI places the same year at $30.8 billion. Those
              are not small differences, and they should not be averaged away without acknowledging methodology drift.
              What is much more consistent is direction: used-car volumes should exceed 6 million units in FY26, the
              used-to-new ratio is about 1.4, and India still trails mature markets on that ratio, leaving headroom for
              future formalization. Redseer then adds a long-range transaction lens of 9-10 million retail transactions
              by FY31. For CarDekho, the investable reading is that TAM is plainly large, but the nearer-term SAM is the
              organized, trust-mediated, discovery-plus-finance slice rather than every used-car rupee transacted in
              India. The decisive contradiction is organized-share math: some publishers still describe the market as
              overwhelmingly unorganized, while others already show organized channels as dominant. That spread is
              itself a diligence fact.
