  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and archetypes
        blocks:
          - type: paragraph
            body: >-
              CarDekho does not compete inside only one narrow peer set. The retained source pack shows at least five
              relevant competitor classes. First are full-stack used-car retail platforms such as CARS24 and Spinny,
              which overlap most closely on inspection, certification, financing, delivery, and transaction support.
              Second are traffic-led discovery businesses such as CarWale, OLX, and parts of CarTrade, which can
              aggregate more raw buyer and seller intent at lower asset intensity because they do not need to control
              every inventory step. Third are OEM-certified incumbents such as Maruti Suzuki True Value, which compete
              on brand-backed trust, inspection discipline, and dense physical reach. Fourth are adjacent finance and
              insurance specialists that attack CarDekho's monetization layers rather than its discovery surface. Fifth
              are public-market or capital-marked comparables such as CarTrade Tech and CarMax, which raise the
              benchmark for disclosure and efficiency.


              This matters because CarDekho's model is intentionally hybrid. Its homepage, used-car discovery surfaces,
              and financing adjacencies place it between a media-led marketplace and a closed-loop retail operator. That
              hybrid position expands monetization options, but it also means CarDekho must defend itself against
              competitors optimized for narrower jobs: deeper retail control, cheaper traffic, stronger OEM trust, or
              more singular insurance or credit focus.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP027
