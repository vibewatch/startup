runDate: 2026-10-17
company:
  name: Scandit
chapter:
  number: 8
  title: Valuation
  summary: >-
    Scandit's retained public evidence still shows real product breadth,
    customer adoption, and workflow-ROI claims, but the latest corroborated
    financing mark in the assigned pool remains the February 2022 $150 million
    Series D at a valuation above $1 billion. Because the pool does not provide
    audited current ARR, cap-table terms, or a clean public pricing surface,
    the evidence supports a track / research-more stance rather than a buy call
    at an unspecified entry price.
sections:
  - id: recommendation-and-price-sensitivity
    title: Recommendation and price sensitivity
    body: >-
      The assigned evidence supports Scandit as a strategically relevant
      enterprise software asset, but not as a cleanly underwriteable investment
      at any current private-market price. Official pages still market 2,100+
      customers, 170 million+ active mobile devices, a broad smart-data-capture
      platform, and enterprise adoption across large retail, travel, and
      logistics cohorts, while current product pages continue to promote
      workflow ROI such as faster counting, faster restocking, and faster data
      entry. Those indicators matter because they make the company look exit
      relevant. The valuation problem is that the freshest corroborated
      financing mark in the retained evidence is still the February 2022 Series
      D above $1 billion, and nothing in the assigned pool closes the gap from
      that old mark to a present-day revenue multiple, dilution profile, or
      downside case. That combination argues for track / research more rather
      than buy.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-support-and-entry-discipline
    title: Valuation support and entry discipline
    body: >-
      Public valuation support is materially weaker than the product narrative.
      Forestay and Built In Boston both corroborate the February 2022 $150
      million Series D above $1 billion, and Built In adds that ARR had doubled
      since the 2020 Series C by that point. That history proves Scandit could
      command unicorn pricing in a different software market, but it does not
      prove that the same multiple survives in late 2026. The current pool also
      shows that public packaging data is noisy: SoftwareSuggest describes
      flexible quote-based pricing with usage discounts, while TechnologyCounter
      says Scandit does not offer trial access and lists APIs as unavailable,
      conflicting with Scandit's own current free-trial and demo-app language.
      When channel descriptions conflict and no retained source publishes
      numeric tiers, current price discovery is weak. Entry discipline therefore
      requires fresh ARR, retention, margin, and financing-term evidence before
      an investor can translate operational quality into an acceptable entry
      price.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-downside-triggers
    title: Scenarios and downside triggers
    body: >-
      The scenario range is necessarily qualitative because the assigned pool
      lacks the audited financial and cap-structure inputs that would support a
      numeric DCF, SaaS-multiple bridge, or downside waterfall. The bull case
      needs current ARR, retention, and margin proof to show that Scandit's
      deployment scale and product ROI still deserve a premium software
      valuation. The base case assumes the company remains strategically useful
      but that investors cannot translate that relevance into a current return
      case because the public mark is stale and the terms stack is opaque. The
      bear case is not business failure; it is multiple compression, a
      financing reset, or senior capital terms that absorb too much upside for
      new equity. Those downside triggers matter more than the quality of the
      technology alone.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-exit-readiness
    title: Final diligence asks and exit readiness
    body: >-
      Exit readiness is plausible but not yet investable on public evidence
      alone. Current official pages show enough customer breadth, vertical
      penetration, and workflow specificity to keep Scandit relevant to large
      strategics or a future public-software narrative, especially if the
      company can convert its installed footprint into higher-value workflows.
      The immediate blocker is not whether Scandit has a real product; it is
      whether a new investor can price the next round or secondary with
      confidence. Before underwriting, diligence should obtain the latest ARR,
      NRR, gross margin, burn or cash-generation profile, debt and preference
      terms, and a reconciled view of live packaging and trial policy. If those
      inputs are strong, the view can improve quickly; if they are weak or
      absent, the old unicorn mark becomes a ceiling rather than a floor.
    claimRefs: [CV001, CV003, CV006, CV011, CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric
      - Value
      - Decision implication
    rows:
      - ["Recommendation", "Track / research more", "Do not underwrite a buy until fresh ARR, cap-table, and financing evidence appears."]
      - ["Confidence", "Medium", "Operational proof is real, but price discovery is weak and the retained valuation mark is stale."]
      - ["Risk rating", "Medium", "Execution quality looks strong, but missing financing terms and stale price support increase underwriting risk."]
      - ["Valuation stance", "Stretched", "The latest corroborated public mark is still the February 2022 >$1B round."]
      - ["Target return / hold / exit", "Not supportable from public evidence", "Wait for audited SaaS metrics and current financing terms before sizing returns or exit timing."]
    notes: >-
      Recommendation terms are intentionally qualitative because the assigned
      pool lacks audited current ARR, margin, retention, and cap-structure
      data needed for a defensible numeric underwriting case.
    claimRefs: [CV001, CV003, CV007, CV013, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument type
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "Product and deployment proof is real: official pages still market 2,100+ customers, 170M+ active devices, and broad vertical penetration.", "Fresh audited ARR and renewal data could convert strategic relevance into premium-multiple support."]
      - ["Thesis", "Current workflow claims remain strong, including 20x faster inventory counting, 3x faster restocking, and 10x faster data entry in current product messaging.", "Independent realized-ROI validation or customer-verified adoption metrics would strengthen conviction."]
      - ["Anti-thesis", "The freshest corroborated financing mark is still the February 2022 >$1B Series D, so current entry pricing is stale relative to today's software market.", "A new primary round, credible secondary mark, or audited run-rate bridge would reduce this objection."]
      - ["Anti-thesis", "Third-party directories conflict on trial/API availability and no retained source publishes numeric pricing tiers, leaving public price discovery noisy.", "A reconciled buyer-facing pricing policy and live packaging disclosure would improve diligence confidence."]
    notes: >-
      The table separates supportable strategic upside from the evidence gaps
      that still block a price-sensitive investment call.
    claimRefs: [CV001, CV004, CV006, CV007, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Fresh audited ARR, retention, and margin data show that Scandit's current customer scale and workflow ROI still merit premium software pricing.", "Only pay a premium to the 2022 unicorn mark after current operating proof and clean financing terms appear.", "Growth, ROI realization, or exit appetite weakens before the new evidence arrives.", "Positive if Scandit discloses current ARR, renewal quality, and a clean cap table."]
      - ["Base", "The company remains strategically relevant, but the public evidence set stays heavy on product proof and light on current underwriting inputs.", "Remain on track and wait; the valuation cannot be bounded tightly enough for a buy decision.", "Time decay on the old mark and opaque terms keep expected returns too assumption-heavy.", "Most likely while no fresh equity mark or audited SaaS metrics are public."]
      - ["Bear", "Growth, pricing power, or exit conditions soften before a fresh financing event resets the valuation.", "Demand a significant discount to the 2022 mark or avoid entry because preference overhang and multiple compression could dominate common-equity outcomes.", "Down-round risk, structured capital seniority, or weaker commercialization evidence.", "Negative if new evidence shows softer adoption, weaker ROI, or a financing reset."]
    notes: >-
      The scenario range is qualitative because the assigned evidence pool does
      not contain the verified current financial disclosures required for a
      defensible numeric valuation range.
    claimRefs: [CV001, CV004, CV006, CV007, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision chain runs from current deployment proof and workflow ROI to
      stale valuation support and weak price discovery, ending in a track /
      research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Current deployment scale
          detail: "Official pages still market 2,100+ customers and 170M+ active mobile devices."
        - id: product-breadth
          label: Product breadth
          detail: "Scandit's current stack spans barcode, ID, label, and store-intelligence workflows."
        - id: roi-proof
          label: Workflow ROI claims
          detail: "Current product pages still cite 20x faster counting, 3x faster restocking, and 10x faster data entry."
        - id: stale-mark
          label: Stale financing mark
          detail: "The latest corroborated valuation evidence in the pool is still the February 2022 $150M Series D above $1B."
        - id: weak-discovery
          label: Weak price discovery
          detail: "Public channels do not provide audited current ARR, cap-table terms, or consistent packaging signals."
        - id: recommendation
          label: "Recommendation: track / research more"
          detail: "Wait for fresh financial and financing evidence before underwriting a buy case."
      edges:
        - from: scale
          to: product-breadth
          label: Supports category relevance
        - from: product-breadth
          to: roi-proof
          label: Adds monetization promise
        - from: roi-proof
          to: stale-mark
          label: Still needs financial translation
        - from: stale-mark
          to: weak-discovery
          label: Leaves current pricing unclear
        - from: weak-discovery
          to: recommendation
          label: Forces cautious entry discipline
    approximationNotes: null
    claimRefs: [CV001, CV002, CV004, CV006, CV007, CV013, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Track until the price becomes underwriteable
    body: >-
      Scandit looks strategically valuable, but the assigned public evidence
      does not justify a buy call without fresh ARR, retention, margin, and
      financing-term disclosure. The investment debate is now about entry price
      and downside protection, not whether the product is real.
    claimRefs: [CV001, CV003, CV007, CV014, CV015]
  - calloutType: risk
    title: The core blocker is valuation support, not product proof
    body: >-
      The chapter's most important diligence blocker is the absence of a fresh
      valuation bridge from the February 2022 unicorn round to late-2026
      operating reality. Without that bridge, strong product claims can still
      produce weak equity outcomes for a new investor.
    claimRefs: [CV004, CV006, CV007, CV013, CV014]
