  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current price book, minimum commits, average realized discounting, and contract metric by product family.
    whyItMatters: Without realized pricing, it is impossible to translate product adoption into revenue quality or compare ROI claims with monetization capture.
    diligencePath: Request current price book, sample order forms, and segmented ASP/discount data for direct and partner-led deals.
    relatedQuestionRefs:
    - QI002
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current ARR, revenue mix, gross margin, NRR/GRR, CAC, payback, and customer concentration.
    whyItMatters: These are the core underwriting variables for recurring-revenue durability and efficiency, and public ROI anecdotes do not substitute for them.
    diligencePath: Request board-level KPI pack or data-room extracts showing quarterly ARR bridge, retention, gross margin, and go-to-market efficiency by segment.
    relatedQuestionRefs:
    - QI005
    - QI007
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: capital
    missingEvidence: Current cash balance, burn, runway, debt facilities, covenant terms, and next-round planning assumptions.
    whyItMatters: The latest public funding event is from 2022, so present capital adequacy and refinancing dependency cannot be tested from the retained sources.
    diligencePath: Request latest monthly management accounts, treasury schedule, debt agreements, and financing-plan materials used by the board.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: minor
    topic: headcount-signal
    missingEvidence: A higher-confidence current headcount disclosure or filing-quality employee count.
    whyItMatters: StartupHub provides a directional employee signal, but not enough precision to infer present opex intensity or recent hiring pace with confidence.
