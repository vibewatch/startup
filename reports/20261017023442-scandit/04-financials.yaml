- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Public price/unit
  - List vs realized evidence
  - What it implies
  - Diligence ask
  rows:
  - - Core SDK / smart data capture platform
    - null
    - Official product pages show features and trial entry, but no public commercial rate card or minimum commit
    - Sales appear quote-led and enterprise-oriented rather than transparent self-serve SaaS
    - Request price book, minimum commit, discount bands, and renewal uplift history
  - - Scandit Express / evaluation path
    - 30-day free trial
    - Trial access is public; paid conversion terms, usage caps, and post-trial pricing are not
    - Low-friction evaluation exists, but it does not reveal realized ASP or gross margin
    - Request trial-to-paid conversion, paid seat/device metric, and implementation scope
  - - Customer-observed price positioning
    - null
    - Verified customer review says the product is premium-priced and licensing can be significant for smaller companies
    - Premium positioning may support ASP in enterprise accounts but can narrow downmarket affordability
    - Request win/loss data by segment, pricing objections, and competitive discounting patterns
  notes: Public evidence covers evaluation entry points and customer sentiment, not realized contract economics; null cells mean the retained sources did not disclose a price.
