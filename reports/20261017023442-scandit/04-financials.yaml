- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value/null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current ARR / revenue run rate
    - null
    - Low
    - Historical growth signals do not substitute for the current revenue base needed for underwriting
    - Request FY2024-FY2026 ARR, revenue bridge, and recurring vs non-recurring mix
  - - Gross margin
    - null
    - Low
    - Tests whether software economics dominate services, support, and deployment burden
    - Request gross margin by product family and services content
  - - CAC / payback / sales efficiency
    - null
    - Low
    - Determines how much external capital growth requires
    - Request CAC, payback, pipeline conversion, channel mix, and sales-cycle distribution
  - - Implementation / integration burden
    - Integration framed as easy; no median cycle disclosed
    - Medium
    - Long implementations can defer revenue recognition and increase services intensity
    - Request median implementation time, deployment resources, and customer-success staffing ratio
  - - Customer ROI proxy
    - 85% time saving on inventory tasks; fulfillment within existing labor hours
    - Medium
    - Shows customer willingness-to-pay logic, but not Scandit capture of that value
    - Request case-study economics tying customer ROI to realized pricing and retention
  - - Cash / burn / runway / debt
    - null
    - Low
    - Primary test of capital adequacy and next-round dependency
    - Request cash balance, burn, runway, debt facilities, covenant terms, and planned use of funds
  notes: Nulls mark unavailable private-company metrics; public ROI statements are value proxies, not vendor unit economics.
