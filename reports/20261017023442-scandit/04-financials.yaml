company:
  name: Scandit
chapter:
  number: 4
  title: Financials
  summary: Scandit clearly monetizes enterprise smart-data-capture software and workflow modules, but retained public evidence still does not disclose current ARR, gross margin, CAC/payback, or runway. The financial read-through is therefore strong product demand and value-based selling, paired with material underwriting opacity around revenue quality and capital adequacy.
sections:
- id: revenue-model-and-traction
  title: Revenue model and disclosed traction
  body: 'Retained official sources show Scandit selling an enterprise smart-data-capture stack rather than a single SKU: barcode scanning, ID scanning, label scanning, shelf intelligence, turnkey deployment, and developer-facing SDKs all sit inside the same platform. That packaging supports a software-license or subscription motion embedded into customer apps and devices, but not a public breakout of recurring software, services, or usage-based revenue. Public traction is meaningful on breadth: the homepage now claims more than 2,100 customers and more than 170 million active devices, while independent 2022 reporting already described more than 1,700 customers at the Series D. What remains missing is the number that matters most for underwriting today: current ARR or revenue run rate.'
  claimRefs:
  - CI001
  - CI002
  - CI005
  - CI006
  - CI009
  tableRefs:
  - TI001
  - TI002
- id: unit-economics-and-cost-drivers
  title: Unit economics and cost drivers
  body: Scandit’s public materials sell ROI in customer-operating terms, not vendor-financial terms. Retail and picking pages emphasize labor-hour savings, fewer errors, faster counting, and more profitable fulfillment, which is consistent with value-based enterprise sales and expansion inside large frontline workflows. Because deployment is framed as SDK, Web SDK, or turnkey software embedded into existing systems, the likely economic model is high gross-margin software moderated by implementation, support, customer success, and any services-heavy deployments. That inference is directionally useful, but it is still not a substitute for disclosed gross margin, CAC, payback, NRR, renewal cohorts, or customer concentration. The result is a chapter with strong demand proxies and weak public unit-economics disclosure.
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI010
  - CI011
  - CI013
  tableRefs:
  - TI003
  figureRefs:
  - FI001
- id: capital-adequacy-and-underwriting-gaps
  title: Capital adequacy and underwriting gaps
  body: 'The retained funding record is historical, not current. Dealroom and StartupHub both show $268 million raised, with the last public round a $150 million Series D at a $1.0 billion post-money valuation in February 2022; Built In adds that the proceeds were intended for R&D and Asian expansion. That chronology matters because there is no retained public disclosure here of current cash, burn, runway, debt, or working-capital needs, so there is no way to test whether the 2022 raise still covers present operating plans. Pricing opacity compounds the issue: one verified-customer review praises performance but calls the product premium-priced and potentially significant in licensing cost for smaller buyers. The forward verdict is therefore demand-positive but underwriting-incomplete until management shares current revenue quality, margin stack, and cash-efficiency data.'
  claimRefs:
  - CI004
  - CI007
  - CI008
  - CI012
  - CI014
