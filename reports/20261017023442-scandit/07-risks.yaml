chapter:
  number: 7
  title: "Risks"
  summary: "Scandit's highest public-source risks are a potential valuation/reset and capital-adequacy overhang after the last disclosed 2022 $150 million Series D at a $1 billion valuation, plus limited public disclosure on retention, concentration, and regulated deployment controls. Published mitigations exist—ISO 27001, on-device processing, rapid deployment tooling, and broad enterprise adoption—but most mitigation evidence in this pool is company-issued rather than independently performance-audited."
sections:
  - id: "severity-ranked-risk-stack"
    title: "Severity-ranked risk stack and kill criteria"
    body: |
      The most material underwriting risk is a reset between Scandit's last disclosed financing terms and what the business could clear in a current market. Independent sources in the assigned pool still anchor public valuation evidence to the February 2022 $150 million Series D at a $1 billion valuation, while the same pool does not disclose a newer equity round, cash balance, or audited retention metrics. That makes current capital adequacy, renewal durability, and customer concentration the most important unresolved diligence items before relying on the historical unicorn mark.

      The operating story is credible but broad. Scandit now spans barcode, label, ID, store-intelligence, age-verification, and in-store-picking workflows across many device and software environments, which raises execution and compliance surface area even as it expands the addressable workflow footprint. The thesis should be treated as impaired if diligence shows a flat/down round before renewed growth evidence, regulated identity or age-verification deployments stalling in priority markets, or customer concentration and renewal quality proving materially weaker than the public logo and case-study set implies.
    claimRefs: [CR003, CR004, CR005, CR006, CR009, CR013]
    figureRefs: [FR001]
  - id: "regulatory-privacy-and-product-scope"
    title: "Regulatory, privacy, and product-scope exposure"
    body: |
      Public materials in the retained pool show meaningful mitigation work: SoftwareOne's marketplace listing cites on-device processing, ISO 27001 certification, encrypted communication, MDM/EMM compatibility, and SLA-backed support, while Scandit's product pages show continued investment in workflow automation and device-side capture. Those controls help, but they do not close the diligence gap around jurisdiction-specific approvals, false-accept and false-reject performance for identity and age-verification flows, or independent incident-history validation.

      The risk is elevated because the product surface now reaches into more sensitive workflows. Scandit's homepage markets fake-detection for IDs and age-verified self-checkout, and the SDK 8.0 launch page extends support to visas, travel documents, and mobile driver's licenses. That broadens the set of regulated use cases and increases the cost of any compliance, accuracy, or policy-control shortfall. Before investing against those workflows, diligence should confirm legal deployment boundaries, customer complaint history, and whether any regulator, court, or external security assessor has documented exceptions that do not appear in the assigned evidence set.
    claimRefs: [CR002, CR006, CR007, CR008, CR009, CR011]
    tableRefs: [TR001, TR002]
  - id: "dependency-and-commercial-opacity"
    title: "Dependency and commercial-opacity risk"
    body: |
      The commercial picture mixes clear breadth with important missing denominators. Company-selected evidence and third-party directories support meaningful customer scale—2,100+ customers, 150+ million devices, and named deployments across retail, aviation, manufacturing, and logistics—but the retained public package does not disclose NRR, GRR, top-customer share, or any post-2022 financing update. That leaves a gap between adoption breadth and the durability metrics investors need to underwrite concentration, renewal, and downside protection.

      There is also ecosystem dependency risk embedded in the operating model. Scandit sells through partners such as SoftwareOne, supports a wide array of mobile and web frameworks, and advertises cloud, on-premises, and hybrid deployment modes. Those choices improve reach and reduce customer friction, but they also multiply release, support, and channel-management failure modes. The right diligence path is to request customer concentration cuts, partner contribution data, gross-retention cohorts, and current liquidity planning—not to assume the public scale claims are enough on their own.
    claimRefs: [CR001, CR003, CR004, CR007, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
