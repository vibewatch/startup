    claimRefs: [CU002, CU003, CU006, CU008, CU009, CU015, CU016]
callouts:
  - calloutType: strength
    title: Public installed-base proof is real, not just logo-wall marketing
    body: "The current Scandit homepage discloses 2,100+ customers and 170 million+ active mobile devices, while the products page attaches quantified outcomes to named accounts such as VF Corp, Staples Canada, and Stratix."
    claimRefs: [CU002, CU003, CU010, CU011, CU012]
  - calloutType: insight
    title: Customer adoption appears integration-heavy and enterprise-served
    body: "Official surfaces and company-authored marketplace copy repeatedly frame Scandit as software that plugs into existing workflows with engineering support, which points to a consultative enterprise motion rather than low-touch self-serve adoption."
    claimRefs: [CU006, CU008]
  - calloutType: risk
    title: Durability is still opaque despite strong deployment anecdotes
    body: "Public materials do not disclose renewal, churn, contract duration, or top-customer mix, and even basic trial accessibility is inconsistent across sources, so customer quality still needs direct diligence."
    claimRefs: [CU015, CU016]
