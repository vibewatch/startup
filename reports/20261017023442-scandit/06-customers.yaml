schemaVersion: report-v2
artifact: customers
slug: scandit
runDate: 2026-10-17
company:
  name: Scandit
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence still supports Scandit's position as an enterprise-focused smart data capture vendor with broad vertical reach, 2,100+ current customers, and 170 million+
    active devices, but most durable-adoption proof remains company or partner sourced. Named customer outcomes on current product pages are stronger than logo-only proof,
    while retention, contract duration, and concentration data remain undisclosed and keep durability underwriting incomplete.
sections:
  - id: customer-base-and-segments
    title: Customer base and segment mix are broad, but skew toward large enterprises
    body: >-
      Scandit's public customer footprint looks concentrated in large operational environments rather than SMB or self-serve software. Its own surfaces span retail, post and
      parcel, air travel, supply chain, and healthcare, while the current products page claims adoption within top-tier grocers, retailers, airline groups, and global brands.
      The homepage also discloses 2,100+ current customers and 170 million+ active mobile devices, which is meaningful installed-base proof even though the company does not
      break customers down by revenue band, geography, or top-account exposure.       Marketplace and partner surfaces reinforce that Scandit is sold into enterprise workflow stacks and deployed across a variety of devices, but they do not reveal what
      share of revenue comes from any one vertical, customer, or channel. The Pega marketplace copy is written in Scandit's voice, so it is treated as company-issued rather
      than independent customer validation.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU007]
    tableRefs: [TU001]
  - id: adoption-proof-and-deployment-evidence
    title: Public adoption proof is strongest where Scandit shows measurable workflow outcomes
    body: >-
      Scandit's best public customer proof goes beyond logos when the company ties deployments to operational outcomes. The products page attributes 100% omnichannel inventory
      accuracy to VF Corp, 18,500 saved associate hours across 20,000 weekly pricing checks to Staples Canada, and 50% faster shipment and delivery processing to Stratix.
      The retail solutions page adds workflow-level claims such as 85% time savings on inventory tasks and positions Scandit as software that embeds into existing store,
      associate, and customer apps without replacing core ERP, WMS, POS, OMS, or ecommerce systems.       Company-authored copy hosted on Pega's marketplace adds implementation-support detail and named references, while the smart data capture explainer shows the product also
      supports customer-facing flows such as mobile self-scanning and self-check-in.
    claimRefs: [CU006, CU008, CU009, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration-gaps
    title: Expansion logic is plausible, but public durability and concentration evidence is thin
    body: >-
      The evidence set supports a land-and-expand narrative: Scandit can be trialed, integrated into existing applications, deployed across worker and customer touchpoints, and
      then extended into broader store intelligence or multi-device workflows. What remains missing is the durability layer that investors normally need to underwrite customer
      quality. None of the assigned sources disclose NRR, GRR, churn, contract length, cohort behavior, customer concentration, or partner-channel concentration. Even basic
      procurement friction is not fully clean in public materials: the current products page advertises a free 30-day trial, while a 2026 software directory says Scandit does
      not offer trial access. That conflict is not thesis-breaking by itself, but it shows why customer durability still needs direct diligence rather than marketing-surface
      extrapolation.
    claimRefs: [CU004, CU006, CU008, CU015, CU016]
