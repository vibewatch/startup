evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-profitability
    missingEvidence: Audited FY2025 revenue or ARR, gross margin, retention, and profitability data.
    whyItMatters: >-
      The latest public ARR growth comment is anchored to the 2022 financing event, so current quality of revenue and
      operating leverage remain unverified.
    diligencePath: >-
      Request audited FY2024-FY2025 financial statements or a board-approved operating plan with ARR, GRR, NRR, and
      margin bridges.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, named co-founders, and any material leadership changes since the 2022 Series D.
    whyItMatters: >-
      The chapter can establish a founder-led technical origin and a named CEO, but not the full governance surface or
      succession depth.
    diligencePath: >-
      Request the current board observer list, executive leadership page, and a change log of senior hires or departures
      since 2022.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Debt facilities, credit lines, secondary sales, or liquidation-stack details.
    whyItMatters: >-
      Capital structure affects exit proceeds, runway quality, and dilution risk, but the assigned public pool only
      shows the latest named equity investors.
    diligencePath: Request the cap table, debt schedule, and any secondary transaction history from management or lead counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A reconciled company definition for active devices and scan-volume metrics across current marketing surfaces.
    whyItMatters: >-
      Inconsistent cover metrics can distort growth, product penetration, and valuation framing if diligence teams
      select the most favorable number without harmonization.
    diligencePath: >-
      Ask management to define active devices, explain the 150M versus 170M variance, and reconcile 50B annual scans
      versus 80B scans processed in 2025.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: A public or management-supported valuation marker newer than the February 2022 Series D.
    whyItMatters: >-
      The last disclosed valuation is more than four years old at the 2026 run date and may not reflect current growth,
      dilution, or market multiple compression.
    diligencePath: >-
      Request any 2024-2026 primary financing, tender, 409A, or board valuation materials and reconcile them to current
      revenue.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent market research or management analysis quantifying category spend, vertical TAM, serviceable accounts,
      pricing, and growth rates for camera-based enterprise smart data capture.
    whyItMatters: >-
      Adoption proxies establish use but cannot support market-share assumptions, revenue ceilings, or valuation growth
      cases.
    diligencePath: >-
      Request management's board-approved market model and triangulate it against independent vertical software budgets,
      device estates, procurement records, and public-company disclosures.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics-gap
    missingEvidence: >-
      Segment-level contracts, buyer titles, ACVs, payback periods, win-loss records, customer concentration, retention,
      and vertical revenue mix.
    whyItMatters: >-
      These data determine whether broad workflow relevance converts into repeatable budgets, efficient sales motion,
      and durable expansion.
    diligencePath: >-
      Review anonymized contracts and cohort data, then interview recent buyers in retail, logistics, travel, and
      healthcare about ownership, alternatives, deployment time, and realized ROI.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: named-peer-benchmarks
    missingEvidence: >-
      Named direct-competitor pages or independent benchmark results showing how Scandit performs versus specific rival
      SDKs or hardware vendors.
    whyItMatters: >-
      Moat durability and win-rate quality are hard to underwrite when the only retained comparison is an anonymized
      vendor-authored bakeoff.
    diligencePath: >-
      Request recent RFP shortlists, named bakeoff results, and third-party benchmark reports from management or
      customer references.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Current enterprise list prices, minimum contract values, discount ranges, and usage tiers for Scandit's paid
      products.
    whyItMatters: >-
      Pricing opacity limits direct comparison with hardware incumbents, workflow point tools, and other embeddable SDK
      alternatives.
    diligencePath: >-
      Obtain current pricing sheets, quote examples, and recent contract summaries by customer segment and deployment
      mode.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: stale
    severity: minor
    topic: independent-scale-refresh
    missingEvidence: >-
      A current independent 2025 or 2026 source confirming customer count, active-device footprint, or named
      large-enterprise share.
    whyItMatters: >-
      Most current scale evidence in the assigned pool is company-authored, while the strongest independent scale
      datapoint dates to 2022.
    diligencePath: >-
      Look for recent independent press, procurement records, or filings that confirm current customer and deployment
      scale.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current price book, minimum commits, average realized discounting, and contract metric by product family.
    whyItMatters: >-
      Without realized pricing, it is impossible to translate product adoption into revenue quality or compare ROI
      claims with monetization capture.
    diligencePath: Request current price book, sample order forms, and segmented ASP/discount data for direct and partner-led deals.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current ARR, revenue mix, gross margin, NRR/GRR, CAC, payback, and customer concentration.
    whyItMatters: >-
      These are the core underwriting variables for recurring-revenue durability and efficiency, and public ROI
      anecdotes do not substitute for them.
    diligencePath: >-
      Request board-level KPI pack or data-room extracts showing quarterly ARR bridge, retention, gross margin, and
      go-to-market efficiency by segment.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital
    missingEvidence: Current cash balance, burn, runway, debt facilities, covenant terms, and next-round planning assumptions.
    whyItMatters: >-
      The latest public funding event is from 2022, so present capital adequacy and refinancing dependency cannot be
      tested from the retained sources.
    diligencePath: >-
      Request latest monthly management accounts, treasury schedule, debt agreements, and financing-plan materials used
      by the board.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: headcount-signal
    missingEvidence: A higher-confidence current headcount disclosure or filing-quality employee count.
    whyItMatters: >-
      StartupHub provides a directional employee signal, but not enough precision to infer present opex intensity or
      recent hiring pace with confidence.
    diligencePath: >-
      Request current employee count by function and compare it with payroll expense or audited headcount disclosures if
      available.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: security-and-compliance-controls
    missingEvidence: >-
      Public SOC 2 or ISO certificates, privacy architecture notes, incident history, uptime commitments, and
      fraud-performance documentation for ID workflows.
    whyItMatters: >-
      Scandit sells into workflows that can touch inventory, identity, and retail loss-prevention decisions, so
      underwriting needs more than marketing-level control descriptions.
    diligencePath: >-
      Request the security overview, certification pack, DPA, incident log, and customer-facing uptime or reliability
      commitments from management.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: independent-performance-benchmarking
    missingEvidence: >-
      Third-party benchmark results or production KPI studies for difficult barcode conditions, duplicate-scan
      avoidance, and workflow-intelligence uplift.
    whyItMatters: >-
      Differentiation is central to the product story, but the assigned pool mainly contains company-curated examples
      and customer-review anecdotes rather than controlled benchmarks.
    diligencePath: >-
      Request the latest benchmark deck, customer before-and-after KPI studies, and named references that quantify
      performance in production.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: retention-and-renewal
    missingEvidence: Public retention evidence such as NRR, GRR, logo churn, renewal rates, contract length, or cohort performance.
    whyItMatters: Customer logos and workflow anecdotes do not establish durability or revenue quality without retention data.
    diligencePath: Request cohort, renewal, and contract-duration data by major product and customer segment from management.
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Customer concentration, top-account revenue share, and partner-channel contribution to bookings or revenue.
    whyItMatters: >-
      Enterprise cohort penetration can still mask meaningful dependence on a few large retailers, airlines, or channel
      partners.
    diligencePath: Ask for top-10 customer and top-partner concentration metrics, plus vertical mix by ARR or revenue.
    relatedQuestionRefs:
      - QU010
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A dated, complete list of production deployments and pilot-to-production conversion outcomes.
    whyItMatters: >-
      The public sample is enough to show real usage, but not enough to measure how representative named wins are across
      the full base.
    diligencePath: Request a referenceable customer roster with launch dates, workflow scope, and current status for top deployments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: trial-access
    missingEvidence: >-
      Direct confirmation of Scandit's current trial policy, including whether the 30-day trial is broadly available or
      segment-specific.
    whyItMatters: >-
      Conflicting trial information is a small but useful proxy for procurement friction and how self-serve the motion
      really is.
    diligencePath: >-
      Confirm live trial terms with Scandit's sales team and verify whether trial access varies by product, geography,
      or enterprise tier.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: litigation-and-incident-history
    missingEvidence: >-
      Independent court, regulator, status-page, or security-incident evidence covering litigation, enforcement, breach,
      and outage history.
    whyItMatters: >-
      Without independent adverse evidence, the chapter cannot distinguish clean history from a visibility gap on issues
      that could impair enterprise trust or regulated deployments.
    diligencePath: >-
      Run named searches across courts, regulators, breach trackers, and status archives; request management's
      litigation and incident schedule.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: customer-durability
    missingEvidence: NRR, GRR, churn, contract length, and top-customer or top-vertical concentration data.
    whyItMatters: >-
      Logo breadth and selected case studies do not show whether revenue is diversified, renewable, or exposed to a
      small set of accounts.
    diligencePath: Request cohort tables, top-10 customer concentration, contract-tenor mix, and renewal history by major vertical.
    relatedQuestionRefs:
      - QR007
