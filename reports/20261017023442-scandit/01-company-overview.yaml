company:
  name: "Scandit"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Scandit is a Zurich-founded smart data capture software company whose public materials position it around barcode, ID, label, and store-intelligence workflows on camera-equipped devices. The assigned source pool supports current company-claimed scale of 2,100+ customers and 150M-170M active devices, plus a last disclosed $150M Series D at a >$1B valuation in February 2022, but it does not support a current board roster, debt profile, or audited FY2025 revenue."
sections:
  - id: "identity-scale"
    title: "Identity, product scope, and disclosed scale"
    body: |-
      Scandit describes itself as a smart data capture platform that turns camera-equipped devices into enterprise barcode, ID, label, and store-intelligence tools. The official company and products pages consistently frame the business around software and SDK-led deployment rather than dedicated hardware sales, while Dealroom summarizes the monetization model as subscription access to SDKs and related services. The combination supports a view of Scandit as an enterprise software vendor selling workflow infrastructure into retail, logistics, healthcare, travel, and adjacent operational settings rather than a single-point barcode utility. [ClaimRefs: CO003, CO012, CO013]

      Public scale markers are meaningful but not fully internally consistent. The company page says Scandit reaches 150M+ active mobile devices, 2,100+ customers, and 50B+ scans per year, while the homepage cites 2,100+ current customers and 170M+ active mobile devices, and the current barcode brochure says the software is used on more than 170 million devices and processed 80 billion scans in 2025. These surfaces establish real scale and current commercial activity, but they also create a diligence task to reconcile device and scan-volume definitions before treating any one number as the canonical cover metric. [ClaimRefs: CO004, CO005, CO006, CO015]
    claimRefs: ["CO003", "CO004", "CO005", "CO006", "CO012", "CO013", "CO015"]
    tableRefs: ["TO001"]
  - id: "leadership-governance-footprint"
    title: "Leadership visibility, governance signals, and operating footprint"
    body: |-
      The assigned pool gives partial but useful leadership visibility. Scandit's official company page says the business was founded in 2009 by three researchers from MIT, ETH Zurich, and IBM Research, and independent sources in the pool name Samuel Mueller as CEO. That is enough to establish a technically grounded founding story and a still-visible founder-led operating narrative, but not enough to reconstruct the full current executive bench or board membership. In practical terms, the chapter can support founder-market fit and key-person concentration at the CEO level, but governance coverage remains incomplete. [ClaimRefs: CO001, CO009]

      Operating footprint is clearer than governance. The company page lists Zurich as global headquarters and names additional offices in London, Warsaw, Tampere, Boston, and Tokyo, while 2022 financing coverage ties Boston specifically to U.S. sales and marketing and says the new capital would help expand reach in Japan, Singapore, and South Korea. That combination supports a multinational go-to-market footprint, but the assigned pool does not show a current board roster, formal control structure, or debt providers. [ClaimRefs: CO002, CO007, CO011]
    claimRefs: ["CO001", "CO002", "CO007", "CO009", "CO011"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-history-and-milestones"
    title: "Funding history, milestone cadence, and visible limitations"
    body: |-
      The funding record in the assigned pool is concentrated but usable. Built In Boston reports that Scandit raised a $150M Series D in February 2022 at a valuation above $1B, led by Warburg Pincus with Atomico, Forestay Capital, G2VP, and others participating, while FundedIQ records $230M raised across two rounds on record, consisting of an $80M round in May 2020 and the $150M Series D in February 2022. Those sources anchor the latest disclosed valuation mark and establish that public capital formation has been quiet for more than four years, which matters because there is no newer public financing or tender marker in the assigned pool. [ClaimRefs: CO007, CO008]

      Milestones after the 2022 raise are still more product-and-scale oriented than financing oriented in the public pool. Official current materials point to more than 170 million devices, 80 billion scans processed in 2025, and continued product expansion around AI-assisted workflow capture. Scandit's in-store-picking page also identifies speed-versus-accuracy tradeoffs, mis-picks, refunds, congestion, and tight delivery windows as workflow risks, while positioning its technology as embedded directly into existing fulfillment apps. For diligence, that means the company appears strong on workflow execution tooling, yet investors still need separate evidence on data-system ownership, audited revenue, debt, and governance to underwrite current value. [ClaimRefs: CO006, CO010, CO011, CO016]
    claimRefs: ["CO006", "CO007", "CO008", "CO010", "CO011", "CO016"]
    figureRefs: ["FO001"]
