      - number: '1.3'
        title: 融资历史、里程碑节奏与可见局限
        blocks:
          - type: paragraph
            body: >-
              已分配资料中的融资记录集中但足够使用。Built In Boston 报道 Scandit 于 2022 年 2 月完成 $150M D 轮融资，估值超过 $1B，由 Warburg Pincus
              领投，Atomico、Forestay Capital、G2VP 等参与；FundedIQ 记录两轮累计融资 $230M，包括 2020 年 5 月的 $80M 和 2022 年 2 月的
              $150M。上述来源锚定了最近一次披露的估值，也说明公开融资已沉寂四年多；重要的是，已分配资料中没有更新的公开融资或要约收购信号。[ClaimRefs: CO007, CO008]

              2022 年融资后的公开里程碑仍偏向产品和规模，而非融资。当前官方材料指向超过 170 million 台设备、2025 年处理 80 billion 次扫描，以及围绕 AI
              辅助工作流采集的持续产品扩张。Scandit
              的门店拣货页面还列出速度与准确率的权衡、错拣、退款、拥堵和紧张交付窗口等工作流风险，同时强调技术直接嵌入现有履约应用。对尽调而言，公司在工作流执行工具上看起来较强，但要评估当前价值，投资人仍需单独核实数据系统所有权、经审计收入、债务和治理。[ClaimRefs:
              CO006, CO010, CO011, CO016]
