      - number: '1.2'
        title: 管理层可见度、治理信号与运营版图
        blocks:
          - type: paragraph
            body: >-
              已分配资料提供了不完整但有用的管理层信息。Scandit 官网称公司由来自 MIT、ETH Zurich 和 IBM Research 的三位研究人员于 2009 年创立，资料中的独立来源则将 Samuel
              Mueller 列为 CEO。这足以证明其技术背景扎实、仍带有明显的创始人主导叙事，但不足以还原完整的现任高管团队或董事会成员。就投资判断而言，这一章可以支持 CEO
              层面的创始人—市场匹配和关键人物集中度判断，但治理覆盖仍不完整。[ClaimRefs: CO001, CO009]

              运营版图比治理情况清晰。公司页面将苏黎世列为全球总部，并列出伦敦、华沙、坦佩雷、波士顿和东京办公室；2022
              年融资报道还指出波士顿办公室专注美国销售与市场营销，新资金将用于扩大日本、新加坡和韩国市场。由此可以确认其跨国获客版图，但已分配资料没有显示当前董事会名单、正式控制结构或债务提供方。[ClaimRefs:
              CO002, CO007, CO011]
