    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 新鲜的经审计 ARR、留存率和利润率数据表明，Scandit 当前的客户规模和工作流 ROI 仍足以支撑软件溢价。
        - 只有在当前运营证明和清晰的融资条款出现后，才为 2022 年独角兽估值支付溢价。
        - 新证据出现前，增长、ROI 实现或退出意愿走弱。
        - 如果 Scandit 披露当前 ARR、续约质量和清晰的股权结构表，则为正面信号。
      - - 基准
        - 公司仍具战略相关性，但公开证据集继续偏重产品证明，缺少当前投资判断所需的输入。
        - 继续跟踪并等待；估值无法收窄到足以作出买入决策的范围。
        - 旧估值标记随时间失效，条款不透明，使预期回报过度依赖假设。
        - 在没有新的股权估值标记或经审计 SaaS 指标公开时，这是最可能的基准情景。
      - - 悲观
        - 新融资事件重置估值前，增长、定价权或退出条件走弱。
        - 要求相对于 2022 年估值大幅折价，或避免进入，因为优先权悬置和倍数压缩可能主导普通股结果。
        - 下轮融资风险、结构化资本的优先级，或商业化证据走弱。
        - 如果新证据显示采用度下降、ROI 变弱或融资重置，则为负面信号。
    notes: 情景区间保持定性，因为分配证据池缺少构建可靠当前估值区间所需的经核实财务披露。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV013
      - CV014
      - CV015
