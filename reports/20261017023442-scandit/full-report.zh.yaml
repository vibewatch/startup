  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险栈与否决标准
        blocks:
          - type: paragraph
            body: >
              最重要的投资判断风险，是 Scandit 最近一次披露的融资条款与公司在当前市场能够承受的估值之间发生重置。已分配独立来源仍将公开估值证据锚定在 2022 年 2 月 $150 million D 轮、$1
              billion 估值；同一资料池没有披露更新的股权轮次、现金余额或经审计留存指标。因此，在依赖历史独角兽估值之前，当前资本充足性、续约持久性和客户集中度是最重要的未解尽调事项。

              运营故事可信，但覆盖面很广。Scandit
              目前跨越条码、标签、证件、门店智能、年龄验证和门店拣货工作流，覆盖多种设备与软件环境；这扩大了可服务工作流，也增加了执行和合规表面积。如果尽调发现，在重新证明增长前公司需要平轮或下轮融资，重点市场的受监管身份或年龄验证部署停滞，或客户集中度和续约质量明显弱于公开
              Logo 与案例集所暗示的水平，就应视为投资主题受损。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR013
