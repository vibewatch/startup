  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与已披露牵引力
        blocks:
          - type: paragraph
            body: >-
              留存官方来源显示，Scandit 销售的是企业智能数据采集技术栈，而非单一 SKU：条码、证件和标签扫描、货架智能、交钥匙部署以及面向开发者的 SDK
              都位于同一平台内。这种打包支持嵌入客户应用和设备的软件许可或订阅模式，但没有公开拆分经常性软件、服务或按用量计费收入。公开牵引力在覆盖面上很明显：首页目前称客户超过 2,100 家、活跃设备超过 1.7
              亿台，而独立的 2022 年报道在 D 轮时已称客户超过 1,700 家。当前最缺少、也是投资判断最关键的数字，是 ARR 或收入运行率。
