      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开材料对一线用户的识别比对经济买方更清楚。门店员工、拣货员、收货员、仓库员工、司机、客运服务团队和医护人员会使用该软件；运营、数字化、移动和应用团队很可能是买方，因为 Scandit
              嵌入这些团队的应用并连接现有后端。客户可以从 SDK、Web SDK、预构建组件或交钥匙应用开始，再扩展到多条码扫描、增强现实引导、货架智能和身份工作流。最新 SDK
              信息将产品从解码拓展到理解上下文的工作流自动化。准确付款方职位、采购路径、ACV、回本周期和各垂直收入贡献仍属于私有证据缺口。
