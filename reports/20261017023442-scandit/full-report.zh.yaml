      - number: '3.2'
        title: 差异化集中在覆盖面、部署杠杆与获客路径灵活性
        blocks:
          - type: paragraph
            body: >-
              Scandit 自有页面持续销售技术和商业灵活性的组合。产品覆盖条码、标签和证件扫描以及门店智能；宣传册还加入上下文扫描、AR 叠加、多条码采集，并支持超过 20,000
              种设备型号。商业上，公司把直销企业客户与系统集成商、免费试用入口、小团队按用量定价，以及从无代码 Express 到完全定制 SDK 集成的多种部署路径结合起来。这套组合让 Scandit
              更有底气主张“平台”定位，也解释了其为何可以同时争夺既有硬件更新预算和点状工作流工具预算。
