            body: >-
              留存融资记录是历史信息，而非当前信息。Dealroom 和 StartupHub 均显示累计融资 $268 million，最近一轮为 2022 年 2 月 $150 million D 轮，投后估值 $1.0
              billion；Built In 补充称资金计划用于研发和亚洲扩张。这个时间线很重要，因为这里没有当前现金、烧钱速度、现金跑道、债务或营运资金需求的公开披露，无法判断 2022
              年融资是否仍足以覆盖当前运营计划。定价不透明进一步加重问题：一则已验证客户评价称赞性能，却认为产品价格偏高，对小买方而言许可成本可能很重。因此，在管理层提供当前收入质量、利润结构和现金效率数据前，前景判断只能是需求偏正面、投资判断尚未完整。
