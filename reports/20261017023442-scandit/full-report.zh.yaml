              ARR 较 2020 年 C 轮翻倍。这段历史证明 Scandit 曾能在不同的软件市场获得独角兽定价，却不能证明同一倍数能延续到 2026
              年末。当前资料还显示公开包装和定价信息嘈杂：SoftwareSuggest 描述灵活的询价定价和用量折扣，TechnologyCounter 则称 Scandit 不提供试用、API 不可用，与 Scandit
              自己当前的免费试用和演示应用说法冲突。当渠道描述相互矛盾、留存来源又没有公布数字化价格档位时，当前价格发现能力很弱。因此，在投资人把运营质量换算成可接受入场价之前，必须获得最新
              ARR、留存、利润率和融资条款证据。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
