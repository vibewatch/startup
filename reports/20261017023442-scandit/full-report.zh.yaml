chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与已披露规模
        blocks:
          - type: paragraph
            body: >-
              Scandit 将自己定位为智能数据采集平台，把配备摄像头的设备变成企业级条码、证件、标签和门店智能工具。公司及产品官网始终强调软件和 SDK 驱动的部署，而不是销售专用硬件；Dealroom
              则将其变现模式概括为订阅获取 SDK 及相关服务。综合来看，Scandit 更像面向零售、物流、医疗、旅行及相邻运营场景销售工作流基础设施的企业软件厂商，而非单点条码工具。[ClaimRefs: CO003,
              CO012, CO013]

              公开规模指标意义重大，但彼此并不完全一致。公司页面称 Scandit 覆盖 150M+ 活跃移动设备、2,100+ 家客户、每年 50B+ 次扫描；首页则称当前客户数为 2,100+、活跃移动设备超过
              170M；最新条码宣传册称软件运行在超过 170 million 台设备上，并在 2025 年处理了 80 billion
              次扫描。这些信息证明其确有规模和当前商业活动，但在把某个数字作为封面核心指标前，仍需核对设备数和扫描量的定义。[ClaimRefs: CO004, CO005, CO006, CO015]
