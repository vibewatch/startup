      - number: '4.2'
        title: 单位经济与成本驱动
        blocks:
          - type: paragraph
            body: >-
              Scandit 的公开材料以客户运营指标销售 ROI，而不是以厂商财务指标销售。零售和拣货页面强调节省工时、减少错误、加快盘点和提高履约利润，这符合价值型企业销售以及大型一线工作流中的扩张逻辑。由于部署被描述为
              SDK、Web SDK
              或嵌入现有系统的交钥匙软件，其可能的经济模型是高毛利软件，但会受到实施、支持、客户成功和服务密集型部署的影响。这一推断有方向性价值，却不能替代已披露的毛利率、CAC、回本周期、NRR、续约群组或客户集中度。结果是需求代理指标强，但公开单位经济披露弱。
