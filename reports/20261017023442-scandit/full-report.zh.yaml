      - number: '3.3'
        title: 壁垒持久性看似合理，但比营销叙事更难验证
        blocks:
          - type: paragraph
            body: >-
              壁垒持久性的最强证据不只是扫描速度，还包括隐私立场、广泛设备支持、面向工作流的组件，以及无需推倒重来的客户系统嵌入能力。不过，公开证明比营销叙事薄弱。已分配资料中唯一明确的正面对比，是 Scandit 自称其
              Web SDK 击败约六家厂商，却未说明竞争者，也没有第三方基准测试。公开定价除了订阅表述、免费试用和面向小团队的按用量入口外仍不透明。最后，Scandit
              自己的零售材料承认无法直接修复库存记录，因此产品可以改善执行质量，但仍依赖客户提供的上游系统和流程纪律。
