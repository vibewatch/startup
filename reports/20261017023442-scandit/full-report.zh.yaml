          displayValue: Smartphones, tablets, wearables, fixed cameras, drones, and robots
          detail: 软件部署让可用硬件基础超越专用扫描器。
        - label: 嵌入企业应用
          displayValue: SDK, Web SDK, pre-built components, and turnkey app
          detail: 多种部署路径可以降低初始集成负担。
        - label: 引导式一线工作流
          displayValue: Counting, picking, receiving, and identity flows
          detail: 上下文和增强现实引导把价值从基础解码延伸出去。
        - label: 零售智能相邻领域
          displayValue: Shelf visibility and guided actions
          detail: 零售套餐把采集连接到库存和货架执行决策。
        - label: AI 工作流编排
          displayValue: Capture, interpret, and act
          detail: SDK 8.0 的信息把下一层扩展定位为上下文感知自动化。
    approximationNotes: 这是定性的可触达性层级，不是价值比例图、转化漏斗或美元计价的 TAM/SAM/SOM 模型。保留的来源没有提供这些层级可比的支出数值。
    claimRefs:
      - CM002
      - CM004
      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 这是以证据为基础的工作流广度与部署杠杆序数图，覆盖分配资料池中可见的主要替代方案类别。
    data:
      xAxis:
        label: 工作流广度（序数 1-5）
        min: 1
        max: 5
        lowLabel: Single workflow
        highLabel: Multi-workflow platform
        description: Ordinal score from source-backed product breadth and adjacent workflow coverage.
      yAxis:
        label: 部署杠杆（序数 1-5）
        min: 1
        max: 5
        lowLabel: Rip-and-replace / narrow path
        highLabel: Reuse existing apps, devices, and channels
        description: Ordinal score from source-backed deployment flexibility, GTM reach, and reuse of current systems.
      points:
        - label: Scandit
          x: 5
          'y': 5
          note: 在分配资料池中，保留范围最广，部署方式也最灵活。
        - label: 专用手持扫描器
          x: 2
          'y': 2
          note: 具有很强的现状扫描基准，但保留证据显示其智能设备复用能力较弱。
        - label: 其他扫描 SDK 厂商
          x: 3
          'y': 3
          note: 争夺同一个集成位置，但分配资料池中公开的具名同行细节很少。
        - label: 内部自建
          x: 3
          'y': 4
          note: 能高度控制并复用现有系统，但交付负担由买方承担。
        - label: 工作流点工具
          x: 2
          'y': 4
          note: 通常更容易针对单一用例部署，但范围窄于完整的智能数据采集平台。
        - label: 门店智能相邻方案
          x: 4
          'y': 3
          note: 随着 Scandit 从扫描扩展至平台和零售执行工作流，竞争重叠会增加。
    approximationNotes: 坐标轴是基于保留的产品范围和部署证据得出的序数评分，而非第三方基准测量。
    claimRefs:
      - CP005
      - CP009
      - CP010
      - CP011
      - CP013
      - CP014
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持一种与一线工作流 ROI 挂钩、由报价驱动的企业软件模式，但没有披露从使用量到毛利的转换关系。
    data:
      nodes:
        - label: 条码 / ID / 标签采集产品
        - label: 嵌入客户应用和智能设备
        - label: 工作流 ROI：节省人工、减少错误、加快履约
        - label: 企业合同 / 订阅变现
        - label: 续约 / 扩张取决于更广泛的工作流采用
        - label: 毛利取决于软件与服务的组合
      edges:
        - from: Barcode / ID / label capture products
          to: Embedded into customer apps and smart devices
          label: 部署模式
        - from: Embedded into customer apps and smart devices
          to: 'Workflow ROI: labor savings, fewer errors, faster fulfillment'
          label: 客户价值
        - from: 'Workflow ROI: labor savings, fewer errors, faster fulfillment'
          to: Enterprise contract / subscription monetization
          label: 基于价值销售
        - from: Enterprise contract / subscription monetization
          to: Renewal / expansion depends on broader workflow adoption
          label: 先落地再扩张路径
        - from: Renewal / expansion depends on broader workflow adoption
          to: Gross profit depends on software vs services mix
          label: 利润率结果
    approximationNotes: 这是基于公开套餐和 ROI 证据的商业模式桥接，不是披露收入或利润率的量化瀑布图。
    claimRefs:
      - CI001
      - CI002
      - CI010
      - CI011
  - id: FE001
    title: 公开证据支持的产品架构图
    type: stack
    summary: Scandit 的公开材料显示出一层层的技术栈：从采集输入，延伸到工作流解决方案和开发者赋能。
    data:
      layers:
        - label: 采集输入
          detail: 基于摄像头采集条码、标签文本、ID，以及货架或库存上下文。
          modules:
            - 条码值
            - 标签文本和有效期数据
            - ID 字段与核验线索
        - label: 边缘 SDK 界面
          detail: 企业采集通过软件组件交付，而不只依赖专用扫描器。
          modules:
            - Barcode Scanner SDK
            - Barcode Scanner SDK（网页端）
            - ID Scanner SDK
            - Express App
          outputs:
            - 嵌入式移动工作流
            - 基于浏览器的采集
        - label: 视觉 AI 引擎
          detail: 核心平台层根据实时采集上下文调整界面并自动执行操作。
          modules:
            - 上下文感知扫描
            - 抑制重复扫描
            - 读取受损条码文本
        - label: 工作流智能
          detail: 最近发布的功能把 Scandit 从扫描推向引导式任务执行。
          modules:
            - MatrixScan Pick
            - MatrixScan Count
            - Smart Label Capture
          outputs:
            - 屏幕任务引导
            - 分组计数流程
            - 自动提取
        - label: 解决方案封装
          detail: 零售和行业解决方案把采集与工作流逻辑封装进更窄的用例。
          modules:
            - 门店智能平台
            - Shelf Insights
            - Self-Checkout Loss Prevention
            - Age Verified Self-Checkout
        - label: 集成与运营
          detail: 部署灵活性取决于 API、预构建组件、文档和支持响应速度。
          modules:
            - 交钥匙应用
            - 预构建组件
            - 功能丰富的 API
            - 特定框架文档
          outputs:
            - 更快上线
            - 支持工单路径
            - 频繁更新文档
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，企业客户旅程可能从合作伙伴发现和试用开始，经过嵌入式工作流部署，最终扩展到相邻用例。
    data:
      items:
        - label: 发现合作伙伴或品类
          actor: 买方 / 数字化转型负责人
          channel: SAP 合作伙伴名录、Pega Marketplace 和 Scandit 自有品类页面
          touchpoints:
            - 合作伙伴名录把 Scandit 放进更广泛的企业工作流生态。
            - 早期公开证明在一线运营复杂的行业最强。
          tone: neutral
        - label: 试用与技术评估
          actor: IT、运营和实施团队
          channel: 演示应用、试用流程和专业工程支持
          touchpoints:
            - Pega 称，Scandit 的专业工程师会在试用、解决方案设计、集成和客户成功支持的每一步协助客户。
            - 产品页面宣传免费 30 天试用，但一个第三方目录与这一说法冲突。
          tone: opportunity
        - label: 集成进现有系统
          actor: 实施与应用负责人
          channel: SDK、Web SDK 或交钥匙应用部署
          touchpoints:
            - Scandit 称其能够嵌入现有的门店、员工和客户应用及设备。
            - 零售页面称其能够连接 ERP、WMS、POS、OMS 和电商平台，而无需改变核心架构。
          tone: positive
        - label: 一线员工上线
          actor: 店员、仓库员工、司机和现场团队
          channel: 库存、定价、发运和配送工作流
          touchpoints:
            - 公开成效证明强调员工生产力和运营准确性。
            - 具名案例包括 VF Corp、Staples Canada、Stratix 和 Rappi。
          tone: positive
        - label: 面向客户的工作流扩展
          actor: 购物者、乘客或终端客户
          channel: 移动自助扫描、自助值机和全渠道旅程
          touchpoints:
            - Scandit 的智能数据采集说明称，客户可以通过移动自助扫描或自助值机跳过排队。
            - 零售证明把产品连接到员工和客户应用，而不是仅限仓库扫描。
          tone: opportunity
        - label: 更广泛的企业覆盖
          actor: 客户负责人和高管赞助人
          channel: 更多设备、地区和相邻工作流
          touchpoints:
            - 官方页面称当前拥有 2,100+ 名客户和 170M+ 台活跃移动设备。
            - 公开来源支持扩张逻辑，但无法看清续约、NRR、GRR 或客户集中度。
          tone: risk
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU008
      - CU009
      - CU015
      - CU016
  - id: FR001
    title: Scandit 风险热力图
    type: matrix
    summary: 剩余投资判断风险在公开证据过时或由公司挑选、而非经过独立绩效验证的地方最高。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 剩余风险
      rows:
        - label: 融资重置 / 资本充足性不透明
          note: 保留证据中的最近一轮公开融资是 2022 年 2 月、估值 $1B。
          values:
            - label: 中
            - label: 高
            - label: 高
        - label: 受监管的 ID / 年龄核验合规
          note: 用例广度超出了保留的公开合规记录能够独立验证的范围。
          values:
            - label: 中
            - label: 高
            - label: 高
        - label: 运营面 / 发布复杂度
          note: 大量工作流、框架和部署方式增加了执行负担。
          values:
            - label: 高
            - label: 中
            - label: 中高
        - label: 客户集中度 / 留存不透明
          note: 存在规模证明，但保留资料池没有披露 NRR、GRR 和头部客户组合。
          values:
            - label: 中
            - label: 高
            - label: 高
        - label: 竞争强度
          note: Tracxn 列出 927 家活跃竞争者，其中 136 家获得融资、83 家已经退出。
          values:
            - label: 高
            - label: 中
            - label: 中高
        - label: 安全 / 事件可见性缺口
          note: 已公开的控制措施可见，但保留资料缺少独立的事件历史证据。
          values:
            - label: 中
            - label: 中高
            - label: 中高
    approximationNotes: 基于保留来源证据强度的序数热力图，不是统计损失模型。
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR009
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链从当前部署证明和工作流 ROI 出发，经过过时的估值支持和较弱的价格发现，最终得出跟踪 / 继续研究的建议。
    data:
      nodes:
        - id: scale
          label: 当前部署规模
          detail: 官方页面仍宣传 2,100+ 名客户和 170M+ 台活跃移动设备。
        - id: product-breadth
          label: 产品广度
          detail: Scandit 当前技术栈覆盖条码、ID、标签和门店智能工作流。
        - id: roi-proof
          label: 工作流 ROI 宣称
          detail: 当前产品页面仍称盘点速度提升 20 倍、补货速度提升 3 倍、数据录入速度提升 10 倍。
        - id: stale-mark
          label: 过时的融资估值标记
          detail: 资料池中最近得到交叉验证的估值证据仍是 2022 年 2 月、$150M D 轮且估值超过 $1B。
        - id: weak-discovery
          label: 价格发现较弱
          detail: 公开渠道没有提供经审计的当前 ARR、股权结构条款或一致的套餐信号。
        - id: recommendation
          label: 建议：跟踪 / 继续研究
          detail: 在据此判断买入前，等待新的财务和融资证据。
      edges:
        - from: scale
          to: product-breadth
          label: 支持品类相关性
        - from: product-breadth
          to: roi-proof
          label: 增加变现潜力
        - from: roi-proof
          to: stale-mark
          label: 仍需财务转化
        - from: stale-mark
          to: weak-discovery
          label: 当前定价仍不清晰
        - from: weak-discovery
          to: recommendation
          label: 要求谨慎的进入纪律
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV013
      - CV014
      - CV015
