  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局横跨硬件、可嵌入软件与内部开发
        blocks:
          - type: paragraph
            body: >-
              已分配证据显示，竞争集合远不止“其他条码扫描器”。Scandit
              被定位为纯软件智能数据采集层，把现有智能手机、平板和其他摄像头设备变成企业采集工具；因此，当客户已有移动工作流时，它既直接面对作为现状的专用手持扫描器，也面对其他可嵌入扫描 SDK
              厂商。证据还暗示一个持续存在的内部开发替代方案：Scandit 专门向已有自有应用的企业销售 SDK、预构建组件和无代码入口，采购方可以选择购买、嵌入竞争
              SDK，或在内部扩展现有应用逻辑。其真实同业群因此混合了直接软件竞争者、现有硬件和更窄的工作流工具，而不是一个边界清晰的厂商类别。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP013
