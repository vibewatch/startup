              - CV014
      - number: '8.3'
        title: 情景与下行触发点
        blocks:
          - type: paragraph
            body: >-
              由于已分配资料缺少支持数字 DCF、SaaS 倍数桥接或下行瀑布图所需的经审计财务和资本结构输入，情景范围只能定性描述。乐观情景需要当前 ARR、留存和利润率证明，说明 Scandit 的部署规模与产品 ROI
              仍值得溢价软件估值。基准情景假设公司仍具战略价值，但由于公开估值陈旧、条款结构不透明，投资人无法把这种相关性转化为当前回报判断。悲观情景不是业务失败，而是倍数压缩、融资重置，或优先级资本条款吸收新股权投资人过多上行空间。这些下行触发点比技术质量本身更重要。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 最终尽调要求与退出准备度
        blocks:
          - type: paragraph
            body: >-
              退出准备度看似可行，但仅凭公开证据尚不足以投资。当前官方页面展示了足够的客户广度、垂直渗透和工作流具体性，足以让 Scandit
              继续成为大型战略买家或未来公开软件叙事的相关标的，尤其是在公司能把装机基础转化为更高价值工作流的情况下。眼前的阻碍不是 Scandit
              有没有真实产品，而是新投资人能否有把握地为下一轮或老股交易定价。投资判断前应取得最新
              ARR、NRR、毛利率、烧钱或现金生成状况、债务与优先权条款，以及经核对的当前产品包装和试用政策。如果这些输入强，判断可以迅速改善；如果输入弱或缺失，旧独角兽估值就会成为上限而非底线。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 等待价格变得可作投资判断
            body: Scandit 看起来具有战略价值，但在没有最新 ARR、留存、利润率和融资条款披露前，已分配公开证据不足以支持买入。投资争论的核心已是入场价格和下行保护，而不是产品是否真实。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV014
              - CV015
          - type: callout
            title: 核心阻碍是估值依据，而非产品证明
            body: 本章最重要的尽调阻碍，是缺少从 2022 年 2 月独角兽融资到 2026 年末运营现实的最新估值桥接。没有这座桥，强产品说法仍可能给新投资人带来疲弱的股权回报。
            calloutType: risk
            claimRefs:
              - CV004
