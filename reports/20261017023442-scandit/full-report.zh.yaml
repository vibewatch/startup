        blocks:
          - type: paragraph
            body: >
              留存资料中的公开材料显示公司已采取有意义的缓解措施：SoftwareOne 市场页面提到设备端处理、ISO 27001 认证、加密通信、MDM/EMM 兼容性及 SLA 支持；Scandit
              产品页则显示其持续投入工作流自动化和设备端采集。这些控制有帮助，但没有弥合司法辖区审批、身份与年龄验证流程的误接受和误拒绝表现，以及独立事故历史核验方面的尽调缺口。

              风险之所以升高，是因为产品已进入更敏感的工作流。Scandit 首页营销证件防伪检测和经过年龄验证的自助结账，SDK 8.0
              发布页又扩展到签证、旅行证件和移动驾驶证。这扩大了受监管用例范围，也提高了合规、准确率或政策控制不足的代价。在围绕这些工作流投资前，尽调应确认法律部署边界、客户投诉历史，以及监管机构、法院或外部安全评估方是否记录了已分配证据集未出现的例外。
