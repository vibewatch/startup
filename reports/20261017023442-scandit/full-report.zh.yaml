      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求由摄像头设备装机基础、一线工作数字化压力、提高劳动效率的目标，以及无需替换核心架构即可增加采集能力所支撑。Built In 报道称，2020 年 C 轮至 2022 年 D 轮期间 ARR
              翻倍，并将部分加速归因于疫情期间全国性医疗组织的需求；这是需求冲击的历史证据，不是当前增速。产品向上下文扫描、标签提取、引导拣货和身份验证扩展，可能提高单客户钱包份额，但采用仍取决于集成、信任、工作流 ROI
              和预算归属。在缺少独立品类规模或已披露细分经济数据时，估值应基于客户群组和用例经济性，而不是泛化的计算机视觉 TAM。
            claimRefs:
              - CM008
              - CM009
              - CM010
