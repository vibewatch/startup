  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Scandit 面向的类别是配备摄像头设备上的企业智能数据采集：把条码、标签、文字、物体和身份采集嵌入运营应用。边界包括采集软件、相关工作流引导和门店智能功能，但不包括采集数据流入的
              ERP、WMS、POS、OMS、电商、运输和临床系统。官方及第三方描述反复将产品置于零售、物流、运输、制造、供应链和医疗工作流中。实际替代方案包括专用扫描器、人工录入和内部开发的摄像头扫描组件。因此，Scandit
              的市场逻辑取决于替换或增强这些采集方式，而不是把底层记录系统的更大规模支出也算进来。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模判断
        blocks:
          - type: paragraph
            body: >-
              留存证据支持采用代理指标，不支持传统的支出法市场模型。Scandit 当前首页显示客户超过 2,100 家、活跃移动设备超过 170 million 台、每年条码扫描 80 billion
              次；产品页面声称其已被全球前十品牌中的六家、美国前十杂货零售商中的七家、欧洲前五零售商中的三家及欧洲前五航空集团中的三家采用。这些指标说明部署广度和工作流强度，但分母不可比，也没有一个指标能证明品类收入、市场份额、合同金额或增速。估值模型应把它们视为采用证明，同时明确保留美元口径
              TAM、SAM、SOM 和细分市场 CAGR 的不确定性。
            claimRefs:
