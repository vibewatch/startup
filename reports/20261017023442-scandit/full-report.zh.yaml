    columns:
      - 论点类型
      - 论点
      - 什么会改变判断
    rows:
      - - 投资论点
        - 产品和部署证明真实存在：官方页面仍宣传 2,100+ 名客户、170M+ 活跃设备，以及广泛的垂直行业渗透。
        - 新鲜的经审计 ARR 和续约数据，可能把战略相关性转化为支撑溢价倍数的依据。
      - - 投资论点
        - 当前工作流成效宣传仍然强劲，包括当前产品信息中所称的盘点速度提升 20 倍、补货速度提升 3 倍，以及数据录入速度提升 10 倍。
        - 独立的实际 ROI 验证或客户核实的采用指标，会增强投资信心。
      - - 反论点
        - 最近得到交叉验证的融资标记仍是 2022 年 2 月、超过 $1B 的 D 轮融资，因此相对于今天的软件市场，当前进入价格已经过时。
        - 新的首轮融资、可信的二级市场估值或经审计的运行率桥接，会减轻这一异议。
      - - 反论点
        - 第三方目录对试用 / API 是否可用存在冲突，且保留的来源没有公布数字化定价层级，使公开价格发现噪声很大。
        - 统一的面向买方定价政策和实时套餐披露，会提高尽调信心。
    notes: 该表把有依据的战略上行空间与仍阻碍价格敏感型投资决策的证据缺口分开。
