callouts:
  - calloutType: "strength"
    title: "Scandit's strongest edge is deployment flexibility across buyer types"
    body: >-
      The assigned pool consistently shows Scandit competing as a software layer that can enter through enterprise sales,
      system integrators, or developer-led trials while still offering no-code and pre-built deployment paths.
    claimRefs: ["CP004", "CP005", "CP008", "CP009"]
  - calloutType: "risk"
    title: "Public moat proof is thinner than the product story"
    body: >-
      Public evidence supports Scandit's breadth, but named-peer benchmarks, list pricing, and independent win-loss data
      are not disclosed in the retained pool, so moat claims remain directionally plausible rather than fully validated.
    claimRefs: ["CP012", "CP014"]
