      - number: '1.2'
        title: Leadership visibility, governance signals, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The assigned pool gives partial but useful leadership visibility. Scandit's official company page says the
              business was founded in 2009 by three researchers from MIT, ETH Zurich, and IBM Research, and independent
              sources in the pool name Samuel Mueller as CEO. That is enough to establish a technically grounded
              founding story and a still-visible founder-led operating narrative, but not enough to reconstruct the full
              current executive bench or board membership. In practical terms, the chapter can support founder-market
              fit and key-person concentration at the CEO level, but governance coverage remains incomplete. [ClaimRefs:
              CO001, CO009]


              Operating footprint is clearer than governance. The company page lists Zurich as global headquarters and
              names additional offices in London, Warsaw, Tampere, Boston, and Tokyo, while 2022 financing coverage ties
              Boston specifically to U.S. sales and marketing and says the new capital would help expand reach in Japan,
              Singapore, and South Korea. That combination supports a multinational go-to-market footprint, but the
              assigned pool does not show a current board roster, formal control structure, or debt providers.
              [ClaimRefs: CO002, CO007, CO011]
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
