      - number: '6.2'
        title: Public adoption proof is strongest where Scandit shows measurable workflow outcomes
        blocks:
          - type: paragraph
            body: >-
              Scandit's best public customer proof goes beyond logos when the company ties deployments to operational
              outcomes. The products page attributes 100% omnichannel inventory accuracy to VF Corp, 18,500 saved
              associate hours across 20,000 weekly pricing checks to Staples Canada, and 50% faster shipment and
              delivery processing to Stratix. The retail solutions page adds workflow-level claims such as 85% time
              savings on inventory tasks and positions Scandit as software that embeds into existing store, associate,
              and customer apps without replacing core ERP, WMS, POS, OMS, or ecommerce systems.       Company-authored
              copy hosted on Pega's marketplace adds implementation-support detail and named references, while the smart
              data capture explainer shows the product also supports customer-facing flows such as mobile self-scanning
              and self-check-in.
