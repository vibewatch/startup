            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Valuation support and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public valuation support is materially weaker than the product narrative. Forestay and Built In Boston
              both corroborate the February 2022 $150 million Series D above $1 billion, and Built In adds that ARR had
              doubled since the 2020 Series C by that point. That history proves Scandit could command unicorn pricing
              in a different software market, but it does not prove that the same multiple survives in late 2026. The
              current pool also shows that public packaging data is noisy: SoftwareSuggest describes flexible
              quote-based pricing with usage discounts, while TechnologyCounter says Scandit does not offer trial access
              and lists APIs as unavailable, conflicting with Scandit's own current free-trial and demo-app language.
              When channel descriptions conflict and no retained source publishes numeric tiers, current price discovery
              is weak. Entry discipline therefore requires fresh ARR, retention, margin, and financing-term evidence
              before an investor can translate operational quality into an acceptable entry price.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The scenario range is necessarily qualitative because the assigned pool lacks the audited financial and
              cap-structure inputs that would support a numeric DCF, SaaS-multiple bridge, or downside waterfall. The
              bull case needs current ARR, retention, and margin proof to show that Scandit's deployment scale and
              product ROI still deserve a premium software valuation. The base case assumes the company remains
              strategically useful but that investors cannot translate that relevance into a current return case because
              the public mark is stale and the terms stack is opaque. The bear case is not business failure; it is
              multiple compression, a financing reset, or senior capital terms that absorb too much upside for new
              equity. Those downside triggers matter more than the quality of the technology alone.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Final diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but not yet investable on public evidence alone. Current official pages show
              enough customer breadth, vertical penetration, and workflow specificity to keep Scandit relevant to large
              strategics or a future public-software narrative, especially if the company can convert its installed
              footprint into higher-value workflows. The immediate blocker is not whether Scandit has a real product; it
              is whether a new investor can price the next round or secondary with confidence. Before underwriting,
              diligence should obtain the latest ARR, NRR, gross margin, burn or cash-generation profile, debt and
              preference terms, and a reconciled view of live packaging and trial policy. If those inputs are strong,
              the view can improve quickly; if they are weak or absent, the old unicorn mark becomes a ceiling rather
              than a floor.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until the price becomes underwriteable
            body: >-
              Scandit looks strategically valuable, but the assigned public evidence does not justify a buy call without
              fresh ARR, retention, margin, and financing-term disclosure. The investment debate is now about entry
              price and downside protection, not whether the product is real.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV014
              - CV015
          - type: callout
            title: The core blocker is valuation support, not product proof
            body: >-
              The chapter's most important diligence blocker is the absence of a fresh valuation bridge from the
              February 2022 unicorn round to late-2026 operating reality. Without that bridge, strong product claims can
              still produce weak equity outcomes for a new investor.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV013
              - CV014
