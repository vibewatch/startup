              - CM014
              - CM015
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public materials identify frontline users more clearly than economic buyers. Store associates, pickers,
              receivers, warehouse staff, drivers, passenger-service teams, and healthcare workers interact with the
              software; operational, digital, mobility, and application teams are the likely buying constituencies
              because Scandit is embedded in their applications and connected to existing back ends. Adoption can begin
              through an SDK, Web SDK, pre-built component, or turnkey application, then expand into multi-barcode
              scanning, augmented-reality guidance, shelf intelligence, and identity workflows. The latest SDK messaging
              broadens the proposition from decoding into context-aware workflow automation. Exact payer titles,
              procurement paths, ACVs, payback periods, and vertical revenue contributions remain private-evidence gaps.
            claimRefs:
              - CM004
              - CM005
