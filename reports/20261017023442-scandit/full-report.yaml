  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              Retained official sources show Scandit selling an enterprise smart-data-capture stack rather than a single
              SKU: barcode scanning, ID scanning, label scanning, shelf intelligence, turnkey deployment, and
              developer-facing SDKs all sit inside the same platform. That packaging supports a software-license or
              subscription motion embedded into customer apps and devices, but not a public breakout of recurring
              software, services, or usage-based revenue. Public traction is meaningful on breadth: the homepage now
              claims more than 2,100 customers and more than 170 million active devices, while independent 2022
              reporting already described more than 1,700 customers at the Series D. What remains missing is the number
              that matters most for underwriting today: current ARR or revenue run rate.
