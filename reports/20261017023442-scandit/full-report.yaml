          The freshest corroborated financing mark is still the February 2022 >$1B Series D, so current entry pricing is
          stale relative to today's software market.
        - A new primary round, credible secondary mark, or audited run-rate bridge would reduce this objection.
      - - Anti-thesis
        - >-
          Third-party directories conflict on trial/API availability and no retained source publishes numeric pricing
          tiers, leaving public price discovery noisy.
        - A reconciled buyer-facing pricing policy and live packaging disclosure would improve diligence confidence.
    notes: >-
      The table separates supportable strategic upside from the evidence gaps that still block a price-sensitive
      investment call.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Fresh audited ARR, retention, and margin data show that Scandit's current customer scale and workflow ROI
          still merit premium software pricing.
        - Only pay a premium to the 2022 unicorn mark after current operating proof and clean financing terms appear.
        - Growth, ROI realization, or exit appetite weakens before the new evidence arrives.
        - Positive if Scandit discloses current ARR, renewal quality, and a clean cap table.
      - - Base
        - >-
          The company remains strategically relevant, but the public evidence set stays heavy on product proof and light
          on current underwriting inputs.
        - Remain on track and wait; the valuation cannot be bounded tightly enough for a buy decision.
        - Time decay on the old mark and opaque terms keep expected returns too assumption-heavy.
        - Most likely while no fresh equity mark or audited SaaS metrics are public.
      - - Bear
        - Growth, pricing power, or exit conditions soften before a fresh financing event resets the valuation.
        - >-
          Demand a significant discount to the 2022 mark or avoid entry because preference overhang and multiple
          compression could dominate common-equity outcomes.
        - Down-round risk, structured capital seniority, or weaker commercialization evidence.
        - Negative if new evidence shows softer adoption, weaker ROI, or a financing reset.
    notes: >-
      The scenario range is qualitative because the assigned evidence pool does not contain the verified current
      financial disclosures required for a defensible numeric valuation range.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV013
      - CV014
      - CV015
