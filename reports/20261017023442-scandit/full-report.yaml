  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segment mix are broad, but skew toward large enterprises
        blocks:
          - type: paragraph
            body: >-
              Scandit's public customer footprint looks concentrated in large operational environments rather than SMB
              or self-serve software. Its own surfaces span retail, post and parcel, air travel, supply chain, and
              healthcare, while the current products page claims adoption within top-tier grocers, retailers, airline
              groups, and global brands. The homepage also discloses 2,100+ current customers and 170 million+ active
              mobile devices, which is meaningful installed-base proof even though the company does not break customers
              down by revenue band, geography, or top-account exposure.       Marketplace and partner surfaces reinforce
              that Scandit is sold into enterprise workflow stacks and deployed across a variety of devices, but they do
              not reveal what share of revenue comes from any one vertical, customer, or channel. The Pega marketplace
              copy is written in Scandit's voice, so it is treated as company-issued rather than independent customer
              validation.
