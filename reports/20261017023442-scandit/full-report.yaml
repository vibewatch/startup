  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans hardware, embeddable software, and internal build
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a broader competitive set than "other barcode scanners." Scandit is
              positioned as a software-only smart data capture layer that turns existing smartphones, tablets, and other
              camera-equipped devices into enterprise capture tools, which puts it directly against dedicated handheld
              scanners as the status quo and against other embeddable scanning SDK vendors when buyers already own
              mobile workflows. The same evidence also implies a persistent internal-build substitute: Scandit sells
              SDKs, pre-built components, and no-code entry modes specifically to enterprises that already operate their
              own apps, so procurement can choose to buy, embed a rival SDK, or extend existing app logic internally.
              That means Scandit's real peer group mixes direct software competitors, incumbent hardware, and narrower
              workflow tools instead of a single clean vendor category.
            claimRefs:
