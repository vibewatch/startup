          note: Use-case breadth exceeds what the retained public compliance record independently validates.
          values:
            - label: Medium
            - label: High
            - label: High
        - label: Operational surface / release complexity
          note: Many workflows, frameworks, and deployment modes increase execution burden.
          values:
            - label: High
            - label: Medium-High
            - label: Medium-High
        - label: Customer concentration / retention opacity
