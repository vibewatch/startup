      - number: '1.3'
        title: Funding history, milestone cadence, and visible limitations
        blocks:
          - type: paragraph
            body: >-
              The funding record in the assigned pool is concentrated but usable. Built In Boston reports that Scandit
              raised a $150M Series D in February 2022 at a valuation above $1B, led by Warburg Pincus with Atomico,
              Forestay Capital, G2VP, and others participating, while FundedIQ records $230M raised across two rounds on
              record, consisting of an $80M round in May 2020 and the $150M Series D in February 2022. Those sources
              anchor the latest disclosed valuation mark and establish that public capital formation has been quiet for
              more than four years, which matters because there is no newer public financing or tender marker in the
              assigned pool. [ClaimRefs: CO007, CO008]


              Milestones after the 2022 raise are still more product-and-scale oriented than financing oriented in the
              public pool. Official current materials point to more than 170 million devices, 80 billion scans processed
              in 2025, and continued product expansion around AI-assisted workflow capture. Scandit's in-store-picking
              page also identifies speed-versus-accuracy tradeoffs, mis-picks, refunds, congestion, and tight delivery
              windows as workflow risks, while positioning its technology as embedded directly into existing fulfillment
              apps. For diligence, that means the company appears strong on workflow execution tooling, yet investors
              still need separate evidence on data-system ownership, audited revenue, debt, and governance to underwrite
              current value. [ClaimRefs: CO006, CO010, CO011, CO016]
            claimRefs:
