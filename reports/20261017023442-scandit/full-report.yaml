        title: Unit economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Scandit’s public materials sell ROI in customer-operating terms, not vendor-financial terms. Retail and
              picking pages emphasize labor-hour savings, fewer errors, faster counting, and more profitable
              fulfillment, which is consistent with value-based enterprise sales and expansion inside large frontline
              workflows. Because deployment is framed as SDK, Web SDK, or turnkey software embedded into existing
              systems, the likely economic model is high gross-margin software moderated by implementation, support,
              customer success, and any services-heavy deployments. That inference is directionally useful, but it is
              still not a substitute for disclosed gross margin, CAC, payback, NRR, renewal cohorts, or customer
              concentration. The result is a chapter with strong demand proxies and weak public unit-economics
              disclosure.
