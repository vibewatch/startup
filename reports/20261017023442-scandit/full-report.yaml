  - id: FM001
    title: Addressability expansion ladder
    type: pyramid
    summary: A qualitative hierarchy of the use-case layers through which Scandit can expand from capture into workflow value.
    data:
      items:
        - label: Camera-based capture core
          displayValue: Barcodes, labels, text, IDs, and objects
          detail: The broad technical boundary supported by official and third-party descriptions.
        - label: Existing-device deployment
          displayValue: Smartphones, tablets, wearables, fixed cameras, drones, and robots
          detail: Software deployment widens the usable hardware base beyond dedicated scanners.
        - label: Embedded enterprise applications
          displayValue: SDK, Web SDK, pre-built components, and turnkey app
          detail: Multiple deployment paths can reduce the initial integration burden.
        - label: Guided frontline workflows
          displayValue: Counting, picking, receiving, and identity flows
          detail: Context and augmented-reality guidance move value beyond basic decoding.
        - label: Retail intelligence adjacency
          displayValue: Shelf visibility and guided actions
          detail: Retail packaging links capture to inventory and shelf-execution decisions.
        - label: AI workflow orchestration
          displayValue: Capture, interpret, and act
          detail: SDK 8.0 messaging frames the next expansion layer as context-aware automation.
    approximationNotes: >-
      This is a qualitative addressability hierarchy, not a value-proportional chart, conversion funnel, or dollar
      TAM/SAM/SOM model. No retained source supplies comparable spend values for these layers.
    claimRefs:
      - CM002
      - CM004
      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal map of workflow breadth versus deployment leverage across the main alternative classes
      visible in the assigned pool.
    data:
      xAxis:
        label: Workflow breadth (ordinal 1-5)
        min: 1
        max: 5
        lowLabel: Single workflow
        highLabel: Multi-workflow platform
        description: Ordinal score from source-backed product breadth and adjacent workflow coverage.
      yAxis:
        label: Deployment leverage (ordinal 1-5)
        min: 1
        max: 5
        lowLabel: Rip-and-replace / narrow path
        highLabel: Reuse existing apps, devices, and channels
        description: Ordinal score from source-backed deployment flexibility, GTM reach, and reuse of current systems.
      points:
        - label: Scandit
          x: 5
          'y': 5
          note: Broadest retained scope and the most flexible deployment modes in the assigned pool.
        - label: Dedicated handheld scanners
          x: 2
          'y': 2
          note: Strong status-quo scanning baseline, but weaker smart-device reuse in the retained evidence.
        - label: Other scanning SDK vendors
          x: 3
          'y': 3
          note: Compete for the same integration slot, but public named-peer detail is thin in the assigned pool.
        - label: Internal build
          x: 3
          'y': 4
          note: High control and reuse of current systems, but the buyer carries delivery burden.
        - label: Workflow point tools
          x: 2
          'y': 4
          note: Often easier to deploy for one use case, but narrower than a full smart-data-capture platform.
        - label: Store-intelligence adjacencies
          x: 4
          'y': 3
          note: Competitive overlap rises as Scandit expands from scanning into platform and retail execution workflows.
    approximationNotes: >-
      Axes are ordinal, evidence-backed scores derived from retained product-scope and deployment evidence, not
      third-party benchmark measurements.
    claimRefs:
