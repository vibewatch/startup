chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Scandit describes itself as a smart data capture platform that turns camera-equipped devices into
              enterprise barcode, ID, label, and store-intelligence tools. The official company and products pages
              consistently frame the business around software and SDK-led deployment rather than dedicated hardware
              sales, while Dealroom summarizes the monetization model as subscription access to SDKs and related
              services. The combination supports a view of Scandit as an enterprise software vendor selling workflow
              infrastructure into retail, logistics, healthcare, travel, and adjacent operational settings rather than a
              single-point barcode utility. [ClaimRefs: CO003, CO012, CO013]


              Public scale markers are meaningful but not fully internally consistent. The company page says Scandit
              reaches 150M+ active mobile devices, 2,100+ customers, and 50B+ scans per year, while the homepage cites
              2,100+ current customers and 170M+ active mobile devices, and the current barcode brochure says the
              software is used on more than 170 million devices and processed 80 billion scans in 2025. These surfaces
              establish real scale and current commercial activity, but they also create a diligence task to reconcile
              device and scan-volume definitions before treating any one number as the canonical cover metric.
              [ClaimRefs: CO004, CO005, CO006, CO015]
            claimRefs:
