  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests an enterprise journey from partner discovery and trial to embedded workflow deployment
      and adjacent-use-case expansion.
    data:
      items:
        - label: Partner or category discovery
          actor: Buyer / digital transformation lead
          channel: SAP partner listing, Pega Marketplace, and Scandit's own category pages
          touchpoints:
            - Partner listings position Scandit inside broader enterprise workflow ecosystems.
            - Early public proof is strongest in industries with complex frontline operations.
          tone: neutral
        - label: Trial and technical evaluation
          actor: IT, operations, and implementation teams
          channel: Demo apps, trial motions, and specialist engineering support
          touchpoints:
            - >-
              Pega says Scandit's specialist engineers assist customers at every step with trials, solution design,
              integration, and customer success support.
            - >-
              The products page advertises a free 30-day trial, although one third-party directory conflicts with that
              claim.
          tone: opportunity
        - label: Integration into existing systems
          actor: Implementation and app owners
          channel: SDK, Web SDK, or turnkey app deployment
          touchpoints:
            - Scandit says it embeds into existing store, associate, and customer apps and devices.
            - >-
              The retail page says it connects to ERP, WMS, POS, OMS, and ecommerce platforms without changing core
              architecture.
          tone: positive
        - label: Frontline worker rollout
          actor: Associates, warehouse staff, drivers, and field teams
          channel: Inventory, pricing, shipment, and delivery workflows
          touchpoints:
            - Public outcome proof emphasizes worker productivity and operational accuracy.
            - Named examples include VF Corp, Staples Canada, Stratix, and Rappi.
          tone: positive
        - label: Customer-facing workflow expansion
          actor: Shoppers, passengers, or end customers
          channel: Mobile self-scanning, self-check-in, and omnichannel journeys
          touchpoints:
            - >-
              Scandit's smart data capture explainer says customers can skip queues via mobile self-scanning or
              self-check in.
            - Retail proof links the product to associate and customer apps rather than warehouse-only scanning.
          tone: opportunity
        - label: Broader enterprise footprint
          actor: Account owner and executive sponsor
          channel: Additional devices, geographies, and adjacent workflows
          touchpoints:
            - Official pages cite 2,100+ current customers and 170 million+ active mobile devices.
            - Public sources support expansion logic, but not renewal, NRR, GRR, or concentration visibility.
          tone: risk
    claimRefs:
