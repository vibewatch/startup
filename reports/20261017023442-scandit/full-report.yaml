  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Scandit's addressable category is enterprise smart data capture on camera-equipped devices: barcode,
              label, text, object, and identity capture embedded in operational applications. The boundary includes
              capture software, associated workflow guidance, and store-intelligence features, but excludes the ERP,
              WMS, POS, OMS, e-commerce, transportation, and clinical systems into which capture data flows. Official
              and third-party descriptions repeatedly place the product in retail, logistics, transport, manufacturing,
              supply-chain, and healthcare workflows. The practical substitutes are dedicated scanners, manual entry,
              and internally developed camera-scanning components. Scandit's market case therefore depends on replacing
              or augmenting those capture methods without claiming the much larger spend on underlying systems of
              record.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports adoption proxies, not a conventional spend-based market model. Scandit's
              current homepage reports more than 2,100 customers, more than 170 million active mobile devices, and 80
              billion barcode scans per year. Its product page also claims adoption among six of the top ten global
              brands, seven of the top ten US grocers, three of the top five European retailers, and three of the top
              five European airline groups. These measures show deployed breadth and workflow intensity, but their
              denominators are not comparable and none establishes category revenue, market share, contract value, or
              growth rate. A valuation model should treat them as proof of adoption while leaving dollar TAM, SAM, SOM,
              and segment CAGR explicitly unresolved.
            claimRefs:
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
