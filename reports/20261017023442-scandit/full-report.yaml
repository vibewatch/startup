      - number: '3.3'
        title: Moat durability is plausible but harder to verify than the marketing suggests
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence for durability is not just raw scan speed but the combination of privacy posture,
              broad device support, workflow-specific components, and the ability to embed into customer systems without
              a rip-and-replace rollout. Even so, the public proof is thinner than the marketing. In the assigned pool,
              the only explicit head-to-head comparison is Scandit's own statement that its Web SDK beat about six
              vendors, without naming those rivals or showing a third-party benchmark. Public pricing also remains
              opaque beyond subscription language, a free trial, and usage-based entry for smaller teams. Finally,
              Scandit's own retail material concedes that it cannot fix inventory records directly, which means the
              product can improve execution quality while still depending on upstream systems and process discipline the
              customer must supply.
