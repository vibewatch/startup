      - number: '6.3'
        title: Expansion logic is plausible, but public durability and concentration evidence is thin
        blocks:
          - type: paragraph
            body: >-
              The evidence set supports a land-and-expand narrative: Scandit can be trialed, integrated into existing
              applications, deployed across worker and customer touchpoints, and then extended into broader store
              intelligence or multi-device workflows. What remains missing is the durability layer that investors
              normally need to underwrite customer quality. None of the assigned sources disclose NRR, GRR, churn,
              contract length, cohort behavior, customer concentration, or partner-channel concentration. Even basic
              procurement friction is not fully clean in public materials: the current products page advertises a free
              30-day trial, while a 2026 software directory says Scandit does not offer trial access. That conflict is
              not thesis-breaking by itself, but it shows why customer durability still needs direct diligence rather
              than marketing-surface extrapolation.
            claimRefs:
              - CU004
              - CU006
              - CU008
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public installed-base proof is real, not just logo-wall marketing
            body: >-
              The current Scandit homepage discloses 2,100+ customers and 170 million+ active mobile devices, while the
              products page attaches quantified outcomes to named accounts such as VF Corp, Staples Canada, and Stratix.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU010
              - CU011
              - CU012
          - type: callout
            title: Customer adoption appears integration-heavy and enterprise-served
            body: >-
              Official surfaces and company-authored marketplace copy repeatedly frame Scandit as software that plugs
              into existing workflows with engineering support, which points to a consultative enterprise motion rather
              than low-touch self-serve adoption.
            calloutType: insight
            claimRefs:
              - CU006
              - CU008
          - type: callout
            title: Durability is still opaque despite strong deployment anecdotes
            body: >-
              Public materials do not disclose renewal, churn, contract duration, or top-customer mix, and even basic
              trial accessibility is inconsistent across sources, so customer quality still needs direct diligence.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack and kill criteria
        blocks:
          - type: paragraph
            body: >
              The most material underwriting risk is a reset between Scandit's last disclosed financing terms and what
              the business could clear in a current market. Independent sources in the assigned pool still anchor public
              valuation evidence to the February 2022 $150 million Series D at a $1 billion valuation, while the same
              pool does not disclose a newer equity round, cash balance, or audited retention metrics. That makes
              current capital adequacy, renewal durability, and customer concentration the most important unresolved
              diligence items before relying on the historical unicorn mark.


              The operating story is credible but broad. Scandit now spans barcode, label, ID, store-intelligence,
              age-verification, and in-store-picking workflows across many device and software environments, which
              raises execution and compliance surface area even as it expands the addressable workflow footprint. The
              thesis should be treated as impaired if diligence shows a flat/down round before renewed growth evidence,
              regulated identity or age-verification deployments stalling in priority markets, or customer concentration
              and renewal quality proving materially weaker than the public logo and case-study set implies.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR009
              - CR013
      - number: '7.2'
        title: Regulatory, privacy, and product-scope exposure
        blocks:
          - type: paragraph
            body: >
              Public materials in the retained pool show meaningful mitigation work: SoftwareOne's marketplace listing
              cites on-device processing, ISO 27001 certification, encrypted communication, MDM/EMM compatibility, and
              SLA-backed support, while Scandit's product pages show continued investment in workflow automation and
              device-side capture. Those controls help, but they do not close the diligence gap around
              jurisdiction-specific approvals, false-accept and false-reject performance for identity and
              age-verification flows, or independent incident-history validation.


              The risk is elevated because the product surface now reaches into more sensitive workflows. Scandit's
              homepage markets fake-detection for IDs and age-verified self-checkout, and the SDK 8.0 launch page
              extends support to visas, travel documents, and mobile driver's licenses. That broadens the set of
              regulated use cases and increases the cost of any compliance, accuracy, or policy-control shortfall.
              Before investing against those workflows, diligence should confirm legal deployment boundaries, customer
              complaint history, and whether any regulator, court, or external security assessor has documented
              exceptions that do not appear in the assigned evidence set.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Dependency and commercial-opacity risk
        blocks:
          - type: paragraph
            body: >
              The commercial picture mixes clear breadth with important missing denominators. Company-selected evidence
              and third-party directories support meaningful customer scale—2,100+ customers, 150+ million devices, and
              named deployments across retail, aviation, manufacturing, and logistics—but the retained public package
              does not disclose NRR, GRR, top-customer share, or any post-2022 financing update. That leaves a gap
              between adoption breadth and the durability metrics investors need to underwrite concentration, renewal,
              and downside protection.


              There is also ecosystem dependency risk embedded in the operating model. Scandit sells through partners
              such as SoftwareOne, supports a wide array of mobile and web frameworks, and advertises cloud,
              on-premises, and hybrid deployment modes. Those choices improve reach and reduce customer friction, but
              they also multiply release, support, and channel-management failure modes. The right diligence path is to
              request customer concentration cuts, partner contribution data, gross-retention cohorts, and current
              liquidity planning—not to assume the public scale claims are enough on their own.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Treat the underwriting case as broken if Scandit needs a flat or down round before it can disclose renewed
              growth, retention, and concentration proof that supports the 2022 unicorn mark.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR013
          - type: callout
            title: Mitigations are visible, but largely company-issued
            body: >-
              Scandit publishes meaningful control signals—ISO 27001, on-device processing, encrypted communication,
              rapid deployment tooling, and prebuilt UI—but the retained package still lacks independent uptime,
              incident, and renewal evidence.
            calloutType: insight
            claimRefs:
              - CR002
              - CR008
              - CR013
          - type: callout
            title: Best next diligence steps
            body: >-
              Request a current financing and liquidity update, customer concentration and cohort-retention cuts, and a
              compliance pack for ID, age-verification, and data-protection workflows before underwriting a
              price-sensitive recommendation.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports Scandit as a strategically relevant enterprise software asset, but not as a
              cleanly underwriteable investment at any current private-market price. Official pages still market 2,100+
              customers, 170 million+ active mobile devices, a broad smart-data-capture platform, and enterprise
              adoption across large retail, travel, and logistics cohorts, while current product pages continue to
              promote workflow ROI such as faster counting, faster restocking, and faster data entry. Those indicators
              matter because they make the company look exit relevant. The valuation problem is that the freshest
              corroborated financing mark in the retained evidence is still the February 2022 Series D above $1 billion,
              and nothing in the assigned pool closes the gap from that old mark to a present-day revenue multiple,
              dilution profile, or downside case. That combination argues for track / research more rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
