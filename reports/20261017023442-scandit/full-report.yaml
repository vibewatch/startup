      - number: '4.3'
        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The retained funding record is historical, not current. Dealroom and StartupHub both show $268 million
              raised, with the last public round a $150 million Series D at a $1.0 billion post-money valuation in
              February 2022; Built In adds that the proceeds were intended for R&D and Asian expansion. That chronology
              matters because there is no retained public disclosure here of current cash, burn, runway, debt, or
              working-capital needs, so there is no way to test whether the 2022 raise still covers present operating
              plans. Pricing opacity compounds the issue: one verified-customer review praises performance but calls the
              product premium-priced and potentially significant in licensing cost for smaller buyers. The forward
              verdict is therefore demand-positive but underwriting-incomplete until management shares current revenue
              quality, margin stack, and cash-efficiency data.
