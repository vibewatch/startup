  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              Scandit's public product surface is broader than a single barcode SDK. Across its home, products, and
              experience pages, the company presents Smart Data Capture as a stack that covers barcode scanning, label
              scanning, ID scanning, and store intelligence, then packages those capabilities into both reusable
              components and workflow-specific retail solutions. The practical underwriting implication is that buyers
              can purchase either a core capture capability or a more opinionated workflow layer such as self-checkout
              loss prevention, shelf intelligence, or the Express App. That breadth supports multi-department expansion
              inside a customer, but it also means diligence should separate mature shipping modules from newer solution
              wrappers and validate which metrics come from reusable platform features versus company-curated case
              examples.
