      - number: '5.4'
        title: Technical underwriting risks and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The main public risks are not whether Scandit has a product, but whether the product's headline
              performance and governance claims hold under customer-specific conditions. G2 reviews introduce two
              implementation caveats: extremely fast scan behavior can require UX controls to avoid unintended captures,
              and licensing may be harder to justify for smaller deployments. Official pages also emphasize outcome
              examples and AI-enabled features more than they document third-party security controls, uptime
              commitments, privacy architecture, or independently run accuracy benchmarks. For diligence, that shifts
              the burden onto management to provide benchmark packs, security certifications, incident history, and
              reference calls that confirm the workflow gains survive beyond curated case examples.
