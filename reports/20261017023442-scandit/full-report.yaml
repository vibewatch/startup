      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by the installed base of camera-equipped devices, pressure to digitize frontline work,
              labor-efficiency goals, and the ability to add capture without replacing core architecture. Built In
              reported that annual recurring revenue doubled between the 2020 Series C and the 2022 Series D, while
              attributing part of that acceleration to pandemic-era demand from national health organizations; that is
              historical evidence of a demand shock, not a current growth rate. Product expansion into contextual
              scanning, label extraction, guided picking, and identity verification can enlarge wallet share, but
              adoption still depends on integration, trust, workflow-specific ROI, and budget ownership. Without
              independent category sizing or disclosed segment economics, valuation should be underwritten from customer
              cohorts and use-case economics rather than a generic computer-vision TAM.
            claimRefs:
              - CM008
              - CM009
              - CM010
