chapter:
  number: 2
  title: Market Analysis
  summary: Scandit addresses enterprise smart-data-capture workflows rather than the full software stacks around them, with retail, logistics, transport, supply chain, and healthcare as the clearest verticals. Current company-reported reach supports adoption, but the assigned evidence does not disclose a defensible dollar TAM, SAM, SOM, category CAGR, vertical revenue mix, or buyer-level economics.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Scandit's addressable category is enterprise smart data capture on camera-equipped devices:
      barcode, label, text, object, and identity capture embedded in operational applications. The
      boundary includes capture software, associated workflow guidance, and store-intelligence
      features, but excludes the ERP, WMS, POS, OMS, e-commerce, transportation, and clinical
      systems into which capture data flows. Official and third-party descriptions repeatedly place
      the product in retail, logistics, transport, manufacturing, supply-chain, and healthcare
      workflows. The practical substitutes are dedicated scanners, manual entry, and internally
      developed camera-scanning components. Scandit's market case therefore depends on replacing
      or augmenting those capture methods without claiming the much larger spend on underlying
      systems of record.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM012
    tableRefs:
      - TM001
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The retained evidence supports adoption proxies, not a conventional spend-based market model.
      Scandit's current homepage reports more than 2,100 customers, more than 170 million active
      mobile devices, and 80 billion barcode scans per year. Its product page also claims adoption
      among six of the top ten global brands, seven of the top ten US grocers, three of the top five
      European retailers, and three of the top five European airline groups. These measures show
      deployed breadth and workflow intensity, but their denominators are not comparable and none
      establishes category revenue, market share, contract value, or growth rate. A valuation model
      should treat them as proof of adoption while leaving dollar TAM, SAM, SOM, and segment CAGR
      explicitly unresolved.
    claimRefs:
      - CM006
      - CM007
      - CM014
      - CM015
    tableRefs:
      - TM002
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      Public materials identify frontline users more clearly than economic buyers. Store associates,
      pickers, receivers, warehouse staff, drivers, passenger-service teams, and healthcare workers
      interact with the software; operational, digital, mobility, and application teams are the
      likely buying constituencies because Scandit is embedded in their applications and connected
      to existing back ends. Adoption can begin through an SDK, Web SDK, pre-built component, or
      turnkey application, then expand into multi-barcode scanning, augmented-reality guidance,
      shelf intelligence, and identity workflows. The latest SDK messaging broadens the proposition
      from decoding into context-aware workflow automation. Exact payer titles, procurement paths,
      ACVs, payback periods, and vertical revenue contributions remain private-evidence gaps.
    claimRefs:
      - CM004
      - CM005
      - CM011
      - CM013
      - CM016
    tableRefs:
      - TM003
    figureRefs:
      - FM001
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Demand is supported by the installed base of camera-equipped devices, pressure to digitize
      frontline work, labor-efficiency goals, and the ability to add capture without replacing core
      architecture. Built In reported that annual recurring revenue doubled between the 2020 Series
      C and the 2022 Series D, while attributing part of that acceleration to pandemic-era demand
      from national health organizations; that is historical evidence of a demand shock, not a
      current growth rate. Product expansion into contextual scanning, label extraction, guided
      picking, and identity verification can enlarge wallet share, but adoption still depends on
      integration, trust, workflow-specific ROI, and budget ownership. Without independent category
      sizing or disclosed segment economics, valuation should be underwritten from customer cohorts
      and use-case economics rather than a generic computer-vision TAM.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011
      - CM014
      - CM016
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer/payer
      - Relevance
    rows:
      - - Retail store operations
        - Mobile barcode, label, shelf, inventory, picking, and self-checkout capture workflows.
        - Core POS, ERP, OMS, e-commerce, and merchandising-system spend.
        - Retail operations, digital, or store-application organization; exact payer title undisclosed.
        - The assigned evidence provides the broadest workflow and outcome detail for this segment.
      - - Post, parcel, and logistics
        - Parcel identification, loading, delivery, tracking, and mobile-worker capture.
        - Transportation management, routing, and fleet-system spend unrelated to capture.
        - Carrier operations or mobility organization; exact payer title undisclosed.
        - High scan frequency makes accuracy, device flexibility, and throughput economically relevant.
      - - Supply chain and manufacturing
        - Receiving, inventory, counting, asset tracking, and warehouse capture inside operational apps.
        - WMS, manufacturing execution, robotics, and general automation platforms.
        - Warehouse, supply-chain, or application owner; exact payer title undisclosed.
        - Existing-device deployment can supplement or displace dedicated scanning hardware.
      - - Air travel and identity workflows
        - Travel-document, passenger, and identity capture embedded in branded workflows.
        - Reservation, airport-operations, and broad identity-infrastructure spend.
        - Passenger-experience, digital, or operations team; exact payer title undisclosed.
        - Identity support extends the category beyond conventional barcode workflows.
      - - Healthcare and compliance-sensitive capture
        - Medication, specimen, patient, and identity capture where on-device processing is useful.
        - Clinical records and other core healthcare software.
        - Clinical operations or digital team; exact payer title undisclosed.
        - Privacy and error-reduction needs can support adoption, but public buyer economics are absent.
    notes: >-
      Qualitative boundary based on retained official and third-party descriptions; included spend
      covers capture and adjacent workflow guidance, while excluded spend identifies larger systems
      that the sources describe as connected infrastructure rather than Scandit revenue.
    claimRefs:
