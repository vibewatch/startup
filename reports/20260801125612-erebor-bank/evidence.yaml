  - type: private-evidence-only
    severity: material
    topic: customer-switching
    missingEvidence: Actual conversion and retention data when startups move primary balances from rivals to Erebor.
    whyItMatters: Competitive position depends on whether customers will consolidate or continue to multi-home.
    diligencePath: Review pipeline funnel data, expansion patterns, and customer interviews.
    relatedQuestionRefs:
      - QP014
      - QP021
      - QP025
    relatedTableRefs:
      - TP004
  - type: stale
    severity: material
    topic: charter-race
    missingEvidence: Updated status of Mercury’s and other fintechs’ charter efforts after mid-2026.
    whyItMatters: Erebor’s charter-status moat could narrow quickly if rival fintechs close the regulatory gap.
    diligencePath: Refresh OCC / FDIC charter and industrial-bank tracking before final IC judgment.
    relatedQuestionRefs:
      - QP009
      - QP020
    relatedTableRefs:
