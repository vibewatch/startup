companyProfile:
  summary: Erebor Bank is a newly chartered national bank founded in 2025 and headquartered in Columbus, Ohio, positioned as a digital-first bank for the innovation economy after the collapse of Silicon Valley Bank. Public sources show that the company launched with substantial capital, obtained FDIC approval and a national charter, and quickly attracted reported deposit and customer growth from crypto, AI, defense, and adjacent frontier sectors. The same public record also shows unusually high controversy for such a young bank, including political scrutiny, sanctions-related questions, and limited disclosure on core banking metrics.
  foundedDate: '2025-01-01'
  founders:
    - name: Palmer Luckey
      role: Founder / board-level public face
      background: Oculus founder and Anduril co-founder whose network and reputation are central to Erebor's public launch narrative.
      claimRefs: [CO007, CO008, CO010, CO011]
    - name: Owen Rapaport
      role: Co-CEO
      background: Named in public reporting and founding materials as one of the operating leaders behind Erebor's bank build-out.
      claimRefs: [CO008, CO009]
    - name: Jacob Hirshman
      role: Co-CEO
      background: Named in public reporting and founding materials as a co-CEO helping lead the bank's early operating and regulatory push.
      claimRefs: [CO008, CO009]
  foundingLocation: Columbus, Ohio, USA
  headquarters: Columbus, Ohio, USA
  productSummary: National-bank deposit accounts, treasury management, payments, stablecoin-linked settlement access, and frontier-sector lending products aimed at innovation-economy clients.
  customerFocus: Crypto companies, AI startups, defense contractors, venture-backed operators, and related frontier-sector treasury teams underserved by traditional banks.
  businessModel: Bank-led monetization through deposits, treasury and payment services, and eventually specialty lending and collateralized credit, with stablecoin-linked money movement as a strategic differentiator.
  stage: private, de novo national bank
  fundingStatus: December 2025 financing was reported around a $4.35B post-money valuation with substantial capital raised; July 2026 reporting said Erebor was discussing new financing at roughly an $8B valuation, but public terms are not available.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO008, CO009, CO011, CO013, CO014, CO015, CO018, CO019, CO025, CO026, CV004, CV005]

summary:
  headline: 'Research-more: Erebor may become a valuable frontier-sector banking franchise, but current public evidence does not yet justify underwriting the reported $8B valuation talk without deeper diligence and better price discipline.'
  overallScore: 5.9
