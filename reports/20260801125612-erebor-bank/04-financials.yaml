- id: proxy-benchmarks-and-valuation-readthrough
  title: Proxy benchmarks and valuation read-through
  body: 'Because Erebor’s own earnings are undisclosed, public proxy institutions are useful guardrails. Mercury represents the premium private startup-banking platform case: meaningful revenue scale, large customer count, and a 2026 valuation of $5.2 billion. Lead Bank represents a smaller but still valuable regulated-infrastructure bank. Customers Bancorp provides a public regional-bank frame with roughly $2.66 billion of market cap and more than $800 million of trailing revenue, while SoFi provides a higher-multiple digital-finance benchmark with over $21 billion of market value and quarterly revenue above $1.2 billion. None of those peers is directly comparable, but together they show what investors are implicitly paying for when they discuss Erebor at $8 billion or above: not disclosed current earnings, but the belief that a real charter plus extreme early growth can convert into durable software-like and bank-like economics simultaneously. That is possible, but the current evidence
    makes it an option value story more than a proved earnings story.'
