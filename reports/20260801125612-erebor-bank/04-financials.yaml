- id: economic-engine-and-revenue-mix
  title: Economic engine and revenue mix
  body: 'The likely earnings engine is best understood as a hybrid rather than as a simple bank spread business. FDIC and Senate materials show a genuine deposit-and-lending institution, while investor and partner materials show ambitions around stablecoin operations, AI-equipment finance, contract-backed loans, and nontraditional collateral. Public reporting suggests crypto-backed lending demand has been lower than initially expected, which shifts near-term importance toward deposits, treasury movement, and payment workflows. That may actually be healthier at this stage. Stablecoin-linked services and payments float can deepen customer relationships without immediately taking the highest-risk credit exposures. The trade-off is margin: if Erebor keeps a conservative liquidity posture and slow-rolls specialty lending, early economics may look safer but less obviously profitable than the narrative implies. Without filed statements, the main conclusion is directional: this is a live banking
    model, but the exact balance among NII, fees, and credit spreads is still opaque.'
  claimRefs:
  - CI006
  - CI007
