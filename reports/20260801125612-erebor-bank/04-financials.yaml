- id: TI005
  title: Priority private diligence pack
  columns:
  - Workstream
  - Must-have document
  - Why it matters
  - Blocking risk if absent
  rows:
  - - Deposit quality
    - Concentration report, uninsured deposit split, and pricing ladder
    - Shows whether growth is sticky and diversification is real
    - A hot, concentrated deposit base can reverse quickly.
  - - Credit book
    - Product-level balances, yields, delinquencies, reserves, and collateral policy
    - Determines whether specialty lending is accretive or dangerous
    - Attractive spreads can hide immature risk controls.
  - - Treasury and ALM
    - Securities book, duration, liquidity ladder, and stress testing
    - Validates the promised conservative launch posture
    - Rapid deposit growth can outpace asset-allocation discipline.
  - - Payments economics
    - Volume, pricing, fraud loss, AML cost, and customer retention by product
    - Tests whether the payments thesis can scale profitably
    - Fee narratives are easy to overstate without unit economics.
  - - Capital stack
    - Cap table, regulatory capital treatment, and fundraising terms
    - Clarifies how much loss absorption and dilution capacity exists
    - Headline valuation talk can obscure actual common equity value.
  notes: This is the minimum diligence package needed before treating Erebor as more than a scenario-based financial model.
