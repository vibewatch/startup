- id: milestones-and-adverse-context
  title: Milestones and adverse context
  body: 'Erebor’s milestone story is unusually compressed. The filing and memo trail suggest a June 2025 application, conditional approval in October 2025, FDIC insurance in December 2025, and live operations by February 2026. That speed is central to the upside narrative because it let the bank launch into a still-open post-SVB gap with strong capital and a frontier-technology brand. It is also central to the downside case. Senate letters, Yahoo Finance, and The Week all preserve an adverse thread: the fundraising memo explicitly connected expected approval speed to political access, and lawmakers publicly questioned whether the charter and insurance processes were influenced by relationships rather than only by supervisory merit. The same period also produced ambitious product claims—from stablecoin clearing to venture debt and GPU-backed lending—that are still ahead of the public operating record. The result is a chapter-one verdict that is credible but unfinished: Erebor has crossed
    the threshold from idea to regulated institution, yet much of what makes it exciting also makes it harder to diligence cleanly.'
