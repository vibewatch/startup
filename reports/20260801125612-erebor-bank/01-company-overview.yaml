  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count, team by function, and hiring plan.
    whyItMatters: Headcount is a core scale signal for a de novo bank and helps judge operating leverage, compliance staffing, and execution capacity.
    diligencePath: Request an org chart, current headcount by function, and 12-month hiring plan from management.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, NIM / fee mix, credit marks, and early profitability bridge.
    whyItMatters: Deposits and customer counts alone do not prove unit economics, loss profile, or the sustainability of the proposed valuation.
    diligencePath: Obtain board materials or monthly operating metrics covering deposits, loan book composition, fee income, and early profitability.
    relatedQuestionRefs:
