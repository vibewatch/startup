company:
  name: Erebor Bank
chapter:
  number: 1
  title: Company Overview
  summary: Erebor is a real but very early national bank built around frontier-sector clients and stablecoin-enabled transaction rails. Public evidence supports the charter, FDIC insurance, launch capital, investor syndicate, and unusually rapid deposit growth, but the same record also shows meaningful political scrutiny, thin operating disclosure, and a product roadmap that is still broader than its publicly proven execution.
sections:
- id: identity-and-operating-intent
  title: Identity and operating intent
  body: 'Erebor Bank is now clearly more than a concept deck. Regulatory records, FDIC approval materials, and independent launch coverage all place the bank in Columbus, Ohio as a newly chartered national bank built for businesses and high-balance individuals in technology-adjacent sectors that legacy banks have often treated as awkward or risky. The stable thread across official, partner, and independent sources is not mass-market retail banking but a digital-first infrastructure bank for companies operating in crypto, defense, artificial intelligence, manufacturing, payments, and investment workflows. That positioning matters because Erebor is explicitly trying to solve a post-SVB problem: frontier-sector founders want a single banking counterparty that can combine deposits, lending, payments, and digital-asset workflows under one regulated roof. The bank’s early narrative therefore hinges on being a specialist institution with a narrower customer target but a broader willingness to underwrite
    nontraditional collateral and always-on money movement.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO018
  - CO021
  - CO032
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-governance-and-leadership
  title: Founders, governance, and leadership
  body: 'The public record shows a founder set and governance surface that are strategically strong but also unusually concentrated. Palmer Luckey is the emblematic figure even though reporting says he is not running day-to-day operations. The memo and multiple news sources identify a broader operating team with Jacob Hirshman and Owen Rapaport as co-CEOs, Mike Hagedorn as president, and additional risk, finance, and credit leadership behind them. That blend of crypto, banking, and compliance backgrounds fits the product ambition: the bank wants to look equally credible to stablecoin operators, defense contractors, and bank regulators. Still, the governance story is not yet fully transparent. Public materials do not meaningfully disclose board composition beyond Luckey and one or two investor signals, nor do they explain control rights, committee structure, or succession depth. That leaves key-person dependence high. Even without an operating title, Luckey’s network, reputation, and political
    visibility remain central to customer acquisition, fundraising, and public perception.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO027
  - CO032
  tableRefs:
  - TO002
  - TO003
  figureRefs:
  - FO003
- id: capital-investors-and-early-scale
  title: Capital, investors, and early scale
  body: Capital formation is one of the clearest positives in the public evidence set, but it also contains the most visible contradictions. Independent launch coverage cited roughly $635 million of opening capital, while Haun Ventures described $625 million of committed capital plus a comparable depositor pipeline. By late 2025 and mid-2026, third-party sources converged around a December 2025 financing at a $4.35 billion valuation and a July 2026 fundraising discussion at $8 billion or more. The same July reporting claimed deposits rose from $1.1 billion to $4.05 billion within a quarter and that nearly 400 customers were added over the same period. Those are serious early traction signals for a de novo bank, especially one that is targeting demanding sectors. But none of the public sources provide a bank-style disclosure bridge from deposits to revenue, net interest income, losses, or customer concentration. Investors therefore have enough evidence to believe Erebor found real market
    demand, but not enough evidence to underwrite the quality or durability of that demand at the proposed valuation.
  claimRefs:
  - CO004
  - CO005
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
