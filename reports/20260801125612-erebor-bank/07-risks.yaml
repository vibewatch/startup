- id: mitigations-triggers-and-kill-criteria
  title: Mitigations, triggers, and kill criteria
  body: The encouraging part of the risk picture is that the main mitigations are legible. Erebor really does have a charter. FDIC insurance really was approved. Public materials really do point to a conservative launch posture. That means this is not an imaginary bank improvising outside the system. The problem is that those mitigations are only first-layer defenses. They reduce some forms of risk while leaving governance, sanctions, dependency, and execution risk very much alive. For diligence, the right approach is to define explicit triggers. Any regulator-driven narrowing of digital-asset activities, any compliance issue in sensitive corridors, any meaningful partner instability, or any deviation from the claimed conservative balance-sheet stance should immediately change the underwriting stance. Likewise, an inability to produce credible private evidence of controls, staffing depth, and concentration discipline should be treated as a decision-changing failure, not as a minor documentation
    gap. That makes governance depth, documentation quality, and control repeatability unusually material to downside protection.
