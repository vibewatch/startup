- id: partner-dependency-and-market-risk
  title: Partner, dependency, and market risk
  body: Erebor’s differentiated product thesis relies on external systems that it does not fully control. Stablecoin issuers, settlement networks, banking regulators, and external payment rails all shape the product surface. Sui and reserve-backed digital-dollar models help make the offering possible, but they also create dependency risk. If a key network, issuer, or supervisory interpretation changes, the customer promise can narrow quickly. Competitive context matters too. Cross River and JPMorgan Kinexys already offer adjacent versions of fast, interoperable money movement with stronger operating maturity and lower perception risk. That means Erebor must not only build a novel stack; it must keep enough control over critical dependencies to stop rivals or policy shifts from collapsing the differentiated layer back into plain banking. Dependency risk here is therefore both operational and strategic.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR022
  - CR025
  - CR026
