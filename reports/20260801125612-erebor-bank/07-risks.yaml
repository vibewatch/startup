  claims:
  - id: CR001
    statement: Political and regulatory scrutiny is the defining current risk because Senate letters explicitly question whether Erebor’s charter and deposit-insurance approvals were influenced by political connections.
    type: observed
    topic: regulatory-risk
    sourceRefs:
    - SR001
    - SR002
    - SR016
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
    - QR017
  - id: CR002
    statement: The fundraising memo language about political connectivity is especially damaging because it creates governance, disclosure, and regulatory-perception risk even if no formal wrongdoing is ultimately proven.
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR016
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR017
  - id: CR003
    statement: 'De novo-bank supervision also constrains the company: launch coverage states Erebor must maintain a minimum 12% Tier 1 leverage ratio in its first three years.'
    type: observed
    topic: regulatory-risk
    sourceRefs:
    - SR019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR024
  - id: CR004
    statement: 'The charter remains a strength and a risk simultaneously: it enables product differentiation, but it also keeps Erebor under close supervisory attention at a politically charged moment.'
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR015
    - SR019
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR024
  - id: CR005
    statement: A Venezuela-related risk is now visible because The Block reported a non-binding LOI with Banco de Venezuela and Startups Latam described subaccounts and correspondent-style flows.
    type: third-party-reported
    topic: sanctions-risk
    sourceRefs:
    - SR017
    - SR010
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR003
  - id: CR006
    statement: OFAC’s Venezuela sanctions framework means any corridor strategy touching that market sits under an especially high compliance burden.
    type: observed
    topic: sanctions-risk
    sourceRefs:
    - SR009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR018
  - id: CR007
    statement: Even if no prohibited activity occurs, merely pursuing sensitive corridors can intensify supervisory, reputational, and partner risk.
    type: inferred
    topic: sanctions-risk
    sourceRefs:
    - SR009
    - SR017
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR014
  - id: CR008
    statement: The stablecoin strategy creates integrity and compliance risk because BIS argues stablecoins fail core tests of singleness, elasticity, and integrity if treated as system backbones.
    type: observed
    topic: stablecoin-risk
    sourceRefs:
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR018
  - id: CR009
    statement: That does not mean Erebor cannot offer stablecoin-linked services; it means the product has to be tightly subordinated to banking-grade controls and clear reserve logic.
    type: inferred
    topic: stablecoin-risk
    sourceRefs:
    - SR012
    - SR022
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR018
    - QR023
  - id: CR010
    statement: Policy risk remains real because Congress is still defining custody, banking-institution, and stablecoin treatment boundaries in the CLARITY Act framework.
    type: observed
    topic: policy-risk
    sourceRefs:
    - SR013
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR007
  - id: CR011
    statement: 'Balance-sheet concentration is another core risk: rapid deposit growth from specialized sectors can create the same kind of correlated funding fragility that made SVB vulnerable, even if the asset mix differs.'
    type: inferred
    topic: balance-sheet-risk
    sourceRefs:
    - SR014
    - SR017
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
    - QR013
    - QR020
  - id: CR012
    statement: Haun’s stated 60% liquid-asset posture and Banking Dive’s leverage-ratio note are the clearest visible mitigations against that risk.
    type: observed
    topic: balance-sheet-risk
    sourceRefs:
    - SR018
    - SR019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR019
    - QR023
  - id: CR013
    statement: Fast growth itself is risky because asset-allocation discipline, compliance staffing, and control environments can lag headline customer or deposit expansion.
    type: inferred
    topic: balance-sheet-risk
    sourceRefs:
    - SR017
    - SR024
    - SR014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR020
  - id: CR014
    statement: Operationally, Erebor is a digital-only de novo bank with a small public employee base, which raises execution risk around staffing depth, controls, and incident response.
    type: inferred
    topic: operational-risk
    sourceRefs:
    - SR005
    - SR019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
    - QR008
  - id: CR015
    statement: A small or still-forming team is not fatal, but it does increase key-person and bandwidth risk in a heavily regulated operating environment.
    type: inferred
    topic: people-risk
    sourceRefs:
    - SR005
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR016
    statement: Dependency risk is meaningful because Erebor’s product promise appears to rely on external stablecoin, network, and partner infrastructure such as Sui and reserve-backed digital dollars.
    type: observed
    topic: dependency-risk
    sourceRefs:
    - SR021
    - SR022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR021
  - id: CR017
    statement: Comparable providers such as Cross River and Kinexys remind investors that counterparties and large institutions already operate adjacent rails with greater operational maturity.
    type: inferred
    topic: competitive-risk
    sourceRefs:
    - SR020
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
  - id: CR018
    statement: 'That creates both competitive risk and concentration risk: if a key external rail, issuer, or network becomes constrained, Erebor’s differentiated product surface could narrow quickly.'
    type: inferred
    topic: dependency-risk
    sourceRefs:
    - SR021
    - SR022
    - SR020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR021
  - id: CR019
    statement: Reputation risk cuts across regulators and customers at once. The Week’s framing of Erebor as a politically coded bank could repel some neutral enterprise buyers and intensify oversight optics.
    type: observed
    topic: reputation-risk
    sourceRefs:
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR014
  - id: CR020
    statement: At the same time, political proximity may attract some aligned customers or investors, which makes brand effects asymmetric rather than uniformly negative.
    type: inferred
    topic: reputation-risk
    sourceRefs:
    - SR011
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR014
  - id: CR021
    statement: The “low-risk bank doing normal banking things” framing is only partly credible publicly because the same sources that stress conservatism also describe unusual collateral, stablecoins, and sensitive sectors.
    type: inferred
    topic: framing-risk
    sourceRefs:
    - SR005
    - SR016
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR023
  - id: CR022
    statement: Competitive market-structure risk persists because Mercury, Cross River, JPMorgan, and other providers can compete for the same startup and crypto-adjacent clients with better-known operating surfaces.
    type: inferred
    topic: competitive-risk
    sourceRefs:
    - SR020
    - SR023
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
  - id: CR023
    statement: 'People and governance risk also extend to board and founder influence: Luckey remains central to the narrative even without an operating role.'
    type: inferred
    topic: people-risk
    sourceRefs:
    - SR019
    - SR005
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR024
    statement: Mitigation signals that are genuinely visible today include real chartered status, FDIC insurance, conservative liquidity claims, and de novo supervisory constraints.
    type: observed
    topic: mitigations
    sourceRefs:
    - SR015
    - SR018
    - SR019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR019
  - id: CR025
    statement: But the public record still lacks detailed control evidence around AML tooling, sanctions screening, incident management, audit, and third-party oversight.
    type: observed
    topic: control-gap
    sourceRefs:
    - SR009
    - SR021
    - SR022
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR022
  - id: CR026
    statement: A straightforward monitorable trigger would be any regulator-driven limit on digital-asset activity, partner exits, or failure to maintain the promised conservative balance-sheet posture.
    type: inferred
    topic: triggers
    sourceRefs:
    - SR013
    - SR019
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR027
    statement: Another trigger would be growth that remains deposit-heavy without corresponding evidence of diversified customers, repeat treasury usage, or low-loss lending expansion.
    type: inferred
    topic: triggers
    sourceRefs:
    - SR017
    - SR014
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR028
    statement: A realistic kill criterion would be evidence that the political-network thesis influenced approval improperly or that supervisors materially curtail the bank’s strategy as a result.
    type: inferred
    topic: kill-criteria
    sourceRefs:
    - SR001
    - SR002
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
  - id: CR029
    statement: Another kill criterion would be any sanctions or AML lapse tied to high-risk corridors or stablecoin-linked flows.
    type: inferred
    topic: kill-criteria
    sourceRefs:
    - SR009
    - SR010
    - SR017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
  - id: CR030
    statement: Because Erebor targets concentrated frontier sectors, almost every other risk—credit, deposits, customer concentration, reputation, and regulation—can compound rather than stay isolated.
    type: inferred
    topic: concentration-risk
    sourceRefs:
    - SR015
    - SR008
    - SR014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
  - id: CR031
    statement: The risk posture is therefore investable only if an investor gets private evidence that governance, controls, and asset-liability discipline are stronger than the public record suggests.
    type: inferred
    topic: overall-view
    sourceRefs:
