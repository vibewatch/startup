- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / political risk
    - Supervisor concern or formal inquiry broadens materially
    - Document request escalates into activity limits or findings
    - Pause underwriting and re-rate recommendation.
  - - Sanctions risk
    - Sensitive-corridor strategy advances without visible controls
    - Any live flow or contract in a high-risk corridor absent strong policy proof
    - Treat as red flag and require immediate explanation.
  - - Balance-sheet risk
    - Deposit growth outpaces conservative posture
    - Liquidity share falls materially or sector concentration rises sharply
    - Reduce confidence in sustainability.
  - - Dependency risk
    - Partner or network instability emerges
    - Rail outage, partner exit, or issuer access problem
    - Haircut product-thesis premium.
  - - Control / staffing risk
    - Management cannot evidence depth
    - No credible private control package or thin compliance bench
    - Treat as kill criterion for new capital.
  notes: These triggers are designed to change the investment view, not simply to populate a watchlist.
