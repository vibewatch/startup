      - number: '1.2'
        title: Founders, governance, and leadership
        blocks:
          - type: paragraph
            body: >-
              The public record shows a founder set and governance surface that are strategically strong but also
              unusually concentrated. Palmer Luckey is the emblematic figure even though reporting says he is not
              running day-to-day operations. The memo and multiple news sources identify a broader operating team with
              Jacob Hirshman and Owen Rapaport as co-CEOs, Mike Hagedorn as president, and additional risk, finance, and
              credit leadership behind them. That blend of crypto, banking, and compliance backgrounds fits the product
              ambition: the bank wants to look equally credible to stablecoin operators, defense contractors, and bank
              regulators. Still, the governance story is not yet fully transparent. Public materials do not meaningfully
              disclose board composition beyond Luckey and one or two investor signals, nor do they explain control
              rights, committee structure, or succession depth. That leaves key-person dependence high. Even without an
              operating title, Luckey’s network, reputation, and political visibility remain central to customer
              acquisition, fundraising, and public perception.
