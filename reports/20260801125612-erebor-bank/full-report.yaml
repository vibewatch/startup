      - number: '3.4'
        title: Moat durability and adverse read
        blocks:
          - type: paragraph
            body: >-
              The adverse competitive read is straightforward. Mercury is already scaled and trying to become a bank;
              JPMorgan already has the trust and relationship density; Cross River and Lead Bank already understand
              sponsor-bank distribution; Circle, Coinbase, and Anchorage already own pieces of the stablecoin and
              institutional-digital-asset stack. If customers prefer modular procurement, Erebor risks becoming only a
              premium niche bank for a narrow cohort of founder-led accounts. The bull case is equally clear. If buyers
              actually value one regulated provider that can blend deposits, credit, sector-specific underwriting, and
              on-chain money movement, then Erebor’s integrated thesis is more defensible than any one competitor
              category. Public evidence is not enough to settle that question today. It is enough to say that moat
              durability will depend less on novelty than on whether Erebor can make the integrated answer visibly
              easier, safer, more compliant, more operationally simple for treasury teams, and more economically
              relevant than stitching together several strong alternatives for sophisticated treasury buyers globally.
