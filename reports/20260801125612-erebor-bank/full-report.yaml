      - number: '3.3'
        title: Capability, trust, and distribution
        blocks:
          - type: paragraph
            body: >-
              Competitive position in this market is shaped by three interacting variables: product breadth, trust
              posture, and distribution channel. Fintech stacks score well on workflow design, cards, approvals, and
              integrations, but they often rely on partner-bank structures. Sponsor banks and incumbents score better on
              regulated depth and existing transaction rails. Digital-asset specialists win on crypto-native liquidity
              and infrastructure credibility. Erebor’s differentiation is strongest where those categories intersect:
              regulated banking for frontier-sector clients that also want unusual underwriting and live
              stablecoin-adjacent movement. Public evidence suggests that no competitor cleanly offers the exact same
              combination today. But it also suggests customers do not need one vendor to offer everything. Multi-homing
              is easy: a startup can use a fintech front end, a megabank treasury relationship, and a stablecoin
              provider simultaneously. That means Erebor’s real moat must come from service integration and trust, not
              from any single feature claim.
