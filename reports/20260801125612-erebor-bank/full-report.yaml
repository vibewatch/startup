            body: >-
              Erebor’s differentiated product thesis relies on external systems that it does not fully control.
              Stablecoin issuers, settlement networks, banking regulators, and external payment rails all shape the
              product surface. Sui and reserve-backed digital-dollar models help make the offering possible, but they
              also create dependency risk. If a key network, issuer, or supervisory interpretation changes, the customer
              promise can narrow quickly. Competitive context matters too. Cross River and JPMorgan Kinexys already
