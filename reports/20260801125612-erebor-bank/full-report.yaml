  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: What is publicly visible
        blocks:
          - type: paragraph
            body: >-
              Erebor has not yet published a conventional investor-grade set of financial statements, so the most
              reliable public financial signals come from a handful of regulatory, investor, and reported-data points.
              Those signals are still meaningful. Public sources support a launch-capital band around $625 million to
              $635 million, a very rapid move from roughly $1.1 billion of deposits at March-end to about $4.05 billion
              by early July 2026, and management-linked commentary that the bank expects profitability by year-end.
              Together, those facts establish that Erebor is not just a concept bank. It already has enough real funding
              and customer traction to be managing live balance-sheet scale. But they do not tell investors how much of
              the deposit base is concentrated, how much is interest sensitive, or how much of the earnings path comes
              from safe treasury deployment versus riskier specialty credit.
