      - number: '5.3'
        title: Trust controls and policy bounds
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance are not side constraints in this product; they are the product boundary. Publicly
              visible controls include national-bank status, FDIC insurance, and the repeated claim that Erebor wants to
              be a heavily regulated stablecoin-linked bank rather than a workaround to banking rules. That is the
              bullish read. The adverse read comes from BIS and the still-moving U.S. policy surface. BIS argues
              stablecoins fail core monetary-system tests if treated as the backbone rather than as a supervised
              adjunct. Congress is still working through digital-asset custody and stablecoin treatment questions. OFAC
              sanctions make certain correspondent or cross-border ideas especially sensitive. The result is that
              Erebor’s product can work only if it keeps translating frontier-speed money movement back into
              banking-grade controls. Public sources do not yet show the depth of AML tooling, auditability, developer
              guardrails, or resilience processes that enterprise treasury teams would normally want to see before
