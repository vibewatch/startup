        title: Concentration and reputation risks
        blocks:
          - type: paragraph
            body: >-
              Customer concentration is the central unresolved risk in this chapter. Erebor serves categories that can
              be lucrative but correlated: venture-backed AI companies, defense-tech builders, crypto firms, and
              businesses needing unusual banking access. Those segments are exposed to policy shifts, funding cycles,
              and reputation spillovers that do not hit normal commercial-banking customers in the same way. The Week’s
              critique also highlights a more unusual go-to-market risk: if Erebor becomes too legible as a
              political-network bank, some prospective customers may avoid it even if the product is attractive. Others
              may be drawn to it for exactly the same reason. That asymmetry makes customer acquisition harder to
              forecast. The most defensible current read is therefore balanced. Erebor has clearly found real demand in
              underserved segments, but the market still lacks the data needed to distinguish healthy specialization
              from concentrated exposure. Private diligence needs to close that gap before anyone treats the current
