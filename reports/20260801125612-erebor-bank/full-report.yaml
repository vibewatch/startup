  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peers
        blocks:
          - type: paragraph
            body: >-
              The closest day-to-day substitutes for Erebor are not necessarily other de novo national banks. They are
              the platforms founders and finance teams already use to hold operating cash, issue cards, manage
              approvals, and move money: Mercury, Brex, Ramp, and Bluevine. These players teach the market to expect
              fast onboarding, software-led controls, and consumer-grade product ergonomics. That matters because many
              customers will judge Erebor’s front-end experience against those firms long before they judge its charter
              status. Publicly, Mercury appears strongest on startup mindshare and customer scale, Brex on the
              all-in-one finance stack, and Ramp on software-led spend automation with embedded checking. Bluevine is
              the simpler SMB-oriented edge case: less frontier-tech specialization, but still a relevant benchmark for
              how digital banking convenience can be packaged. Erebor therefore enters a field where user expectations
              are already set by fintechs even if the underlying balance-sheet and regulatory structures differ
              materially.
            claimRefs:
