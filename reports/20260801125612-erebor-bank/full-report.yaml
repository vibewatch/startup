chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating intent
        blocks:
          - type: paragraph
            body: >-
              Erebor Bank is now clearly more than a concept deck. Regulatory records, FDIC approval materials, and
              independent launch coverage all place the bank in Columbus, Ohio as a newly chartered national bank built
              for businesses and high-balance individuals in technology-adjacent sectors that legacy banks have often
              treated as awkward or risky. The stable thread across official, partner, and independent sources is not
              mass-market retail banking but a digital-first infrastructure bank for companies operating in crypto,
              defense, artificial intelligence, manufacturing, payments, and investment workflows. That positioning
              matters because Erebor is explicitly trying to solve a post-SVB problem: frontier-sector founders want a
              single banking counterparty that can combine deposits, lending, payments, and digital-asset workflows
              under one regulated roof. The bank’s early narrative therefore hinges on being a specialist institution
              with a narrower customer target but a broader willingness to underwrite nontraditional collateral and
              always-on money movement.
