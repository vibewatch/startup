      - number: '6.3'
        title: Retention, expansion, and stickiness
        blocks:
          - type: paragraph
            body: >-
              What matters next is not whether Erebor can acquire initial accounts, but whether those accounts become
              sticky operating relationships. Publicly, that is hard to judge. No cohort data, NRR, churn, segment
              retention, satisfaction, or product attachment disclosures are available. Still, the available evidence
              suggests a plausible expansion loop. A customer could open an operating account to replace or diversify an
              SVB-like relationship, begin moving money through stablecoin-linked rails, and then add specialty credit
              or more complex treasury workflows if service and compliance hold up. That sort of product attachment
              would make the relationship meaningfully harder to replace. The counterargument is equally important:
              deposits alone do not prove quality, and a few large balances can create impressive aggregate growth
              without durable product stickiness. Until Erebor shows customer mix, repeat usage, and cross-sell depth,
              the customer-quality story should remain promising but provisional.
