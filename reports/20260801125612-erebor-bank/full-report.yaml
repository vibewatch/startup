      - number: '3.2'
        title: Sponsor-bank, stablecoin, and incumbent competition
        blocks:
          - type: paragraph
            body: >-
              A second layer of competition comes from banks and infrastructure providers that already sit closer to the
              regulated rails Erebor wants to own. Cross River and Lead Bank show how sponsor banks can combine
              accounts, cards, lending, and increasingly stablecoin-aware payments for fintechs and enterprise
              platforms. Customers Bank is a more traditional incumbent substitute with visible startup and VC-fund
              messaging. Above them sits JPMorgan, which no longer competes only as a plain commercial bank; Kinexys
              shows how a megabank can offer always-on programmable-money infrastructure inside an existing
              institutional relationship. At the digital-asset edge, Circle, Coinbase, and Anchorage compete for the
              most strategic part of Erebor’s long-term story: being the trusted, regulated bridge between bank money
              and stablecoin rails. Erebor’s challenge is that these players do not need to replicate its whole model to
              weaken its wedge; they only need to own the part of the customer workflow that matters most.
