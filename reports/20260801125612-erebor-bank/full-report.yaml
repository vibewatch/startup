  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and sanctions risk
        blocks:
          - type: paragraph
            body: >-
              The most serious current risk is not competition or even margin volatility; it is whether Erebor can
              operate a politically scrutinized, stablecoin-linked, frontier-sector bank without creating a regulatory
              event. Senate letters and the leaked fundraising memo do not prove misconduct, but they do create a
              lasting governance and perception problem. They tell supervisors, counterparties, and investors exactly
              where to look for weakness: charter legitimacy, disclosure quality, political influence, and policy
              favoritism. That risk is compounded by Venezuela-related reporting. Whether or not the reported corridor
              initiatives become material, they force Erebor into one of the most sensitive sanctions contexts
              available. Add the unsettled stablecoin policy surface, and the legal risk becomes multi-layered: approval
              process risk, BSA/AML risk, sanctions risk, and digital-asset rulemaking risk all interact. This is why
              the bank’s regulatory story should be treated as an open operating variable rather than as a solved
              precondition. The risk is as much about supervisory patience and narrative credibility as it is about
              formal law.
