      - number: '4.4'
        title: Main blind spots and diligence demands
        blocks:
          - type: paragraph
            body: >-
              The missing data matters as much as the visible data. Public sources do not show uninsured-deposit
              exposure, top-customer concentration, loan-book composition, reserve levels, nonperforming assets,
              charge-offs, cost of deposits, net interest margin, fee take rates, or efficiency ratio. Those are not
              academic details for a frontier-sector bank. They are the difference between a fast-scaling, low-loss
              infrastructure institution and a volatile niche lender with attractive branding. This is especially true
              because Erebor’s target sectors can be correlated to venture sentiment, crypto policy, defense procurement
              cycles, or specialized hardware demand. The right diligence posture is therefore conservative. Treat the
              deposit growth and charter as real positives, treat the profitability talk as provisional, and require
              asset-level transparency before underwriting any precise margin or valuation conclusion. Investors should
              also insist on management explanations for any large swings in deposit pricing, liquidity mix, or credit
              mix during the first year of operations. Erebor’s public financial signal is stronger than its public
              disclosure, and that gap is the central analytical fact of this chapter.
