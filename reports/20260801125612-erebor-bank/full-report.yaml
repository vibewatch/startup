            body: >-
              SVB remains the cautionary frame for reading Erebor’s non-legal risks. Not because Erebor is obviously
              repeating SVB’s specific mistakes, but because it is also a specialized bank serving correlated sectors
              with potentially fast-moving deposits and reputation-sensitive customers. The visible mitigants are
              meaningful: a 12% leverage constraint during the de novo period and investor claims about a very liquid
              initial balance sheet. Still, those mitigants have to survive growth. If deposits scale faster than
              controls, if lending expands before underwriting discipline is proven, or if a small team is stretched
              across charter compliance, product launches, and controversial customer segments, execution risk can
              become the real failure mode. OCBJ’s note of a modest public employee footprint adds to that concern. In
              short, Erebor may fail through ordinary bank misexecution even if the macro and policy environment stay
              supportive. The bank also has very little public room for error because each misstep would likely be read
