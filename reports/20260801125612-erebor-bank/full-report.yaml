  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The right way to frame Erebor’s market is not generic fintech or all commercial banking. Public materials
              place the bank inside a more specialized slice of the economy: companies, funds, and principals operating
              in virtual currency, AI, defense, advanced manufacturing, and adjacent payments or investment workflows
              that need a bank comfortable with always-on treasury movement and nonstandard collateral. That boundary
              matters because it excludes ordinary consumer deposits and most plain-vanilla small-business banking,
              while also distinguishing Erebor from pure crypto custody or sponsor-bank middleware. After SVB, buyers in
              this market learned that a startup-friendly institution can create real value when it understands
              venture-backed balance sheets and fast-moving treasuries. They also learned that specialization can become
              fragility. That is why the market today is defined by two simultaneous needs: a bank that understands
              frontier assets and a balance sheet that customers trust not to fail under correlated stress. Erebor’s
              target market exists, but it is not broad, homogeneous, or easily measured by a single top-down figure.
            claimRefs:
