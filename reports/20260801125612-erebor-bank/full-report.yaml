  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The central valuation question is not whether Erebor is interesting. It clearly is. The company has a real
              charter, real insured-deposit approval, real early customer and deposit momentum, and a differentiated
              target market spanning crypto, AI, and defense. The harder question is whether those positives justify the
              July 2026 talk of an $8 billion valuation. On the public evidence alone, that answer is no. The disclosed
              proof set is still too narrow. Investors can see top-line traction and fundraising enthusiasm, but they
              cannot yet see the ingredients that determine whether this is a durable compounding bank or an expensive,
              narrative-driven edge case: deposit concentration, uninsured mix, margin structure, loss expectations, fee
              take rates, control depth, and cap-table terms. That means the correct recommendation is price-sensitive
              rather than company-dismissive. Erebor is investable only after much deeper diligence or at a materially
              better entry. At the reported talk level, valuation support looks stretched relative to disclosure
              quality.
