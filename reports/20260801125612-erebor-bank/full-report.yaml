      - number: '1.3'
        title: Capital, investors, and early scale
        blocks:
          - type: paragraph
            body: >-
              Capital formation is one of the clearest positives in the public evidence set, but it also contains the
              most visible contradictions. Independent launch coverage cited roughly $635 million of opening capital,
              while Haun Ventures described $625 million of committed capital plus a comparable depositor pipeline. By
              late 2025 and mid-2026, third-party sources converged around a December 2025 financing at a $4.35 billion
              valuation and a July 2026 fundraising discussion at $8 billion or more. The same July reporting claimed
              deposits rose from $1.1 billion to $4.05 billion within a quarter and that nearly 400 customers were added
              over the same period. Those are serious early traction signals for a de novo bank, especially one that is
              targeting demanding sectors. But none of the public sources provide a bank-style disclosure bridge from
              deposits to revenue, net interest income, losses, or customer concentration. Investors therefore have
              enough evidence to believe Erebor found real market demand, but not enough evidence to underwrite the
              quality or durability of that demand at the proposed valuation.
