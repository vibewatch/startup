companyProfile:
  summary: >-
    Erebor Bank is a newly chartered national bank founded in 2025 and headquartered in Columbus, Ohio, positioned as a
    digital-first bank for the innovation economy after the collapse of Silicon Valley Bank. Public sources show that
    the company launched with substantial capital, obtained FDIC approval and a national charter, and quickly attracted
    reported deposit and customer growth from crypto, AI, defense, and adjacent frontier sectors. The same public record
    also shows unusually high controversy for such a young bank, including political scrutiny, sanctions-related
    questions, and limited disclosure on core banking metrics.
