- id: adoption-trajectory-and-proof
  title: Adoption trajectory and proof
  body: 'Public adoption signals are real but still coarse. The headline numbers are the fastest available evidence: deposits reportedly climbed from $1.1 billion to $4.05 billion in about one quarter, while customer count reportedly expanded by roughly 400 over the same period. Those figures imply that customers were not merely curious; they were willing to move meaningful balances. Public proof on who those customers are is thinner. The best direct evidence today is Sui’s statement that Erebor customers already have stablecoin deposits and withdrawals available. Banking Dive adds helpful but still partial launch-color: prospective clients included firms building AI-powered factories and an aerospace company making pharmaceuticals in low gravity. Together, those proofs support the argument that Erebor is winning at least some real frontier-economy relationships. They do not yet provide the sort of logo-rich enterprise proof or segment-level customer mix that would make the adoption story
    easy to underwrite quantitatively.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU014
  - CU015
  - CU016
  - CU017
  - CU026
