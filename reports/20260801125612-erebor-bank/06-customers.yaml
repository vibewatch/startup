  - FU003
- id: retention-expansion-and-stickiness
  title: Retention, expansion, and stickiness
  body: 'What matters next is not whether Erebor can acquire initial accounts, but whether those accounts become sticky operating relationships. Publicly, that is hard to judge. No cohort data, NRR, churn, segment retention, satisfaction, or product attachment disclosures are available. Still, the available evidence suggests a plausible expansion loop. A customer could open an operating account to replace or diversify an SVB-like relationship, begin moving money through stablecoin-linked rails, and then add specialty credit or more complex treasury workflows if service and compliance hold up. That sort of product attachment would make the relationship meaningfully harder to replace. The counterargument is equally important: deposits alone do not prove quality, and a few large balances can create impressive aggregate growth without durable product stickiness. Until Erebor shows customer mix, repeat usage, and cross-sell depth, the customer-quality story should remain promising but provisional.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU027
  - CU028
  - CU031
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-and-reputation-risks
  title: Concentration and reputation risks
  body: 'Customer concentration is the central unresolved risk in this chapter. Erebor serves categories that can be lucrative but correlated: venture-backed AI companies, defense-tech builders, crypto firms, and businesses needing unusual banking access. Those segments are exposed to policy shifts, funding cycles, and reputation spillovers that do not hit normal commercial-banking customers in the same way. The Week’s critique also highlights a more unusual go-to-market risk: if Erebor becomes too legible as a political-network bank, some prospective customers may avoid it even if the product is attractive. Others may be drawn to it for exactly the same reason. That asymmetry makes customer acquisition harder to forecast. The most defensible current read is therefore balanced. Erebor has clearly found real demand in underserved segments, but the market still lacks the data needed to distinguish healthy specialization from concentrated exposure. Private diligence needs to close that gap
    before anyone treats the current growth curve as proof of durable customer quality at scale sustainably.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
