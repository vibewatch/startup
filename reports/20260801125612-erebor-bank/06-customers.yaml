    - Named customer list absent.
  - - Defense-tech and dual-use firms
    - Founders, CFOs, procurement-linked operators
    - Operating banking plus specialized underwriting
    - Defense funding boom expands pipeline
    - Strategically differentiated segment for Erebor
    - Policy and reputation sensitivity.
  - - VC funds, investors, and HNW principals
    - Fund managers and principals
    - Cash management, investment flows, associated personal banking
    - Implied by SVB replacement thesis
    - Can deepen relationship density
    - Little direct public proof.
  - - Hard-to-bank frontier operators
    - Mixed
    - Need for a specialist bank that understands unusual collateral or compliance complexity
    - Supported by memo and launch framing
    - High willingness-to-pay if service works
    - Could also heighten concentration risk.
