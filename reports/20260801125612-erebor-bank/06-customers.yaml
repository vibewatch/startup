chapter:
  number: 6
  title: Customers
  summary: Erebor has credible early customer traction but thin customer disclosure. Public evidence supports frontier-sector targeting, fast deposit-backed adoption, hundreds of new customers in a short period, and at least one live stablecoin-related workflow. It does not yet support precise claims about customer quality, retention, or concentration.
sections:
- id: segments-and-demand-drivers
  title: Segments and demand drivers
  body: Erebor’s customer thesis is unusually explicit. It is not trying to be a general small-business bank or a consumer fintech. Regulatory filings and launch coverage show a focused pursuit of businesses and principals in crypto, payments, investment, AI, defense, manufacturing, and adjacent frontier sectors that many incumbents either underwrite poorly or avoid altogether. That framing matters because it narrows the addressable customer set while increasing willingness-to-pay if the product really solves hard treasury or financing problems. Macro conditions help. AI funding reached extraordinary levels in 2026, defense-tech financing also hit record highs, and venture lenders say borrowers with scale and revenue quality are again using debt strategically. Erebor is therefore fishing in customer pools that are economically meaningful and operationally demanding. The open question is not whether those pools exist, but whether Erebor can turn niche-fit demand into durable banking relationships
    before larger incumbents or better-documented fintechs absorb the same buyers.
  claimRefs:
  - CU001
  - CU002
  - CU008
  - CU009
  - CU010
