      - number: '2.4'
        title: 约束、矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              让市场有意思的同一组证据，也限制了过度自信的测算。AI
              融资是真实的，但集中在超大轮次，无法整齐映射成分散、可银行化的客户群。稳定币市值很大，但其中相当一部分仍是交易和储备结构，而不是一家银行能捕捉的准确支付或存款余额。Venture debt
              规模提供有用背景，却更多说明贷款方胃口和融资结构，而不是一家新银行可触达的信贷账本。最重要的是，监管本身就是市场的一部分，不是背景条件。联邦政策、市场结构立法和围绕数字资产的监管预期，都可能迅速扩大或收缩
              Erebor 的机会面。公开数据因此支持这样的章节判断：市场真实、时点合适，部分细分结构性服务不足；但 Erebor 真正可服务市场和最终份额仍未解决。这种不确定性应该保留下来，而不是用一张巨大 TAM
              幻灯片盖过去。
