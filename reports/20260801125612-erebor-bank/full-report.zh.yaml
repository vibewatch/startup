    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 当前证据
      - 改变观点的因素
    rows:
      - - 真实银行，定位稀缺
        - 银行牌照、FDIC 批准、前沿行业聚焦和存款动能都有公开证据支撑。
        - 如果尽调显示控制薄弱，或存款集中、对利率敏感，这个论点会迅速变弱。
      - - 银行 + 稳定币桥接一体化，可能配得上溢价
        - Sui 支持和备忘录措辞显示，Erebor 想做差异化的资金管理和结算。
        - 需要证明稳定币相关服务有实质规模、合规且有粘性，而不只是叙事。
      - - 早期高速增长可能继续滚动
        - 据报道，存款约从 $1.1B 增至 $4.05B，三个月内新增客户约 400 个。
        - 需要留存、定价和构成数据，证明增长可持续，而非靠促销拉动或高度集中。
      - - 高溢价倍数可能有理由
        - Mercury 等金融科技相邻业务表明，银行基础设施可以拿到高溢价私募定价。
        - 需要证据证明 Erebor 的经济性会向这些溢价案例靠拢，而不是落回普通银行回报。
      - - 公开证据仍不完整
        - 核心承销指标、损失率、利润率和股权结构条款均未公开披露。
        - 如果完整数据室拿出运营和融资证据，建议可能上调。
      - - 监管和治理阴影可能压缩价值
        - 参议院审查和政治批评形成一层阴影，与产品质量本身无关。
        - 监管姿态平静，加上合规和治理尽调证据扎实，可以降低这项折价。
    notes: 本表刻意把公司质量之争与价格和证据之争拆开。
