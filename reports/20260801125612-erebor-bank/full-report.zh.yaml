            body: >-
              公开采用信号真实，但仍粗糙。标题数字是最快能看到的证据：存款据报在约一个季度内从 $1.1B 升至 $4.05B，客户数同期据报增加约
              400。这些数字说明客户不只是好奇，而是愿意迁移有意义的余额。关于客户是谁，公开证据薄得多。今天最直接的证据是 Sui 表示 Erebor 客户已经可以使用稳定币存入和提取。Banking Dive
              提供了有帮助但仍局部的启动侧写：潜在客户包括建设 AI-powered 工厂的公司，以及一家在低重力环境中制造药品的航空航天公司。合起来看，这些证据支持 Erebor
              至少赢下一些真实前沿经济关系。但它们还没有给出 logo 丰富的企业级证明，也没有给出按细分拆开的客户组合，无法让采用故事轻松完成量化承保。
