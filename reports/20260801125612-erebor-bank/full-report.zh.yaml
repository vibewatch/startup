  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接同类
        blocks:
          - type: paragraph
            body: >-
              Erebor 最接近日常替代品的不一定是其他新设全国性银行，而是创始人和财务团队已经用来存放运营现金、发卡、管理审批和转账的平台：Mercury、Brex、Ramp 和
              Bluevine。这些玩家已经教会市场期待快速 onboarding、软件驱动控制和消费级产品手感。重要的是，许多客户在判断 Erebor
              的牌照状态之前，就会先拿它的前端体验和这些公司相比。公开看，Mercury 在初创公司心智和客户规模上最强，Brex 强在一体化财务栈，Ramp 强在软件驱动的支出自动化和嵌入式支票账户。Bluevine 是更偏
              SMB 的简单边界案例：前沿科技专业化较弱，但仍是数字银行便利性如何包装的有用基准。因此，Erebor 进入的是一个用户预期已经被 fintech 设定的赛场，哪怕底层资产负债表和监管结构存在实质差异。
