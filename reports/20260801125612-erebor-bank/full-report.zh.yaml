companyProfile:
  summary: >-
    Erebor Bank 是一家 2025 年成立、总部位于俄亥俄州 Columbus 的新获牌全国性银行。Silicon Valley Bank
    倒下之后，它把自己定位成服务创新经济的数字优先银行。公开来源显示，公司带着大量资本启动，拿到 FDIC 批准和全国性银行牌照，并很快从
    crypto、AI、防务及相邻前沿行业获得披露的存款和客户增长。同一份公开记录也显示，这家年轻银行承受了异常高的争议度，包括政治审视、制裁相关问题，以及核心银行指标披露有限。
