              可能只会成为一小群创始人主导账户的高端利基银行。牛市情景同样清楚：如果买方确实看重一个受监管提供商，能把存款、信贷、行业特定承保和链上资金流转揉在一起，Erebor
              的一体化论点就比任何单一竞争者类别更站得住脚。公开证据今天还不能回答这个问题。但它足以说明，护城河耐久度更多取决于 Erebor
