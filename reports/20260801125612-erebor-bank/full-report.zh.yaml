      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Erebor
              市场里的买方多数不是零售用户，而是财务决策者。创始人可能推动建立关系，但日常用户是财务主管、CFO、司库和运营人员，他们处理工资、供应商电汇、FX、稳定币结算和抵押借款。付款方通常是公司资金账户、基金载体或高余额个人账户。这样的结构让采用路径比典型
              fintech 注册复杂得多。初创公司可以很快开一个消费账户，但把主要运营余额、信贷额度、资金控制和链上资金流转迁到一家新银行，需要信任和流程变更。专业银行真正的切入口出现在客户遇到大银行或通用 fintech
              难以干净解决的问题时：GPU 抵押借款、crypto 与法币之间的资金运作，或 sponsor-bank 技术栈仍当成边缘行为的前沿行业承保需求。这让市场有吸引力，但也意味着 Erebor
              的增长取决于关系深度，而不是账户数量本身。
