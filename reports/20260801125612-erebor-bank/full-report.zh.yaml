        - 有用的受监管基础设施银行参考点。
        - 牌照语境不同，前沿叙事更窄。
      - - Customers Bancorp
        - 公开市值
        - $2.66B 市值
        - 展示披露充分、有真实收入可读性的银行价值。
        - 传统上市银行；成熟得多，受叙事驱动也少得多。
      - - SoFi
        - 公开市值 / 收入
        - $21.04B 市值；2026 年 Q2 收入 $1.2B；有公开收入历史
        - 展示规模化数字金融叙事如何支撑大市值。
        - SoFi 产品广度远大得多，且披露完全公开。
      - - Coinbase
        - 公开市值 / 收入
        - $38.53B 市值；有公开收入历史
        - 可用于衡量规模化、加密相邻的受监管金融基础设施。
        - 交易所模式和周期性与商业银行差异很大。
      - - Robinhood / PayPal
        - 公开市值 / 收入
        - Robinhood 市值 $77.81B；PayPal 市值 $49.31B；二者都有长期收入历史
        - 说明高端上市金融科技股权价值需要更多披露和消费者规模支撑。
        - 消费者金融科技和支付业务作为 Erebor 银行主导细分生态的可比对象并不完美。
    notes: 这组可比对象不是为了主张一一可比，而是说明市场已经在哪里给出溢价，以及这种溢价通常需要什么披露水平。
