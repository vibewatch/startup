      - number: '7.3'
        title: 合作伙伴、依赖与市场风险
        blocks:
          - type: paragraph
            body: >-
              Erebor 的差异化产品论点依赖它无法完全控制的外部系统。稳定币发行方、结算网络、银行监管者和外部支付 rails 都会塑造产品触面。Sui
              和储备支持的数字美元模型让产品成为可能，但也带来依赖风险。如果关键网络、发行方或监管解释发生变化，客户承诺可能迅速变窄。竞争语境也重要。Cross River 和 JPMorgan Kinexys
              已经提供快速、可互操作资金流转的相邻版本，运营成熟度更强，感知风险更低。这意味着 Erebor
              不只要搭出一套新颖栈，还必须对关键依赖保持足够控制，避免竞争对手或政策变化把差异化层压回普通银行业务。因此，这里的依赖风险既是运营风险，也是战略风险。
