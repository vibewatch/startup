        blocks:
          - type: paragraph
            body: >-
              Erebor 尚未发布一套传统投资级财务报表，因此最可靠的公开财务信号来自少数监管、投资者和报道数据点。它们仍然有意义。公开来源支持 $625M–$635M 左右的启动资本区间，存款从 3 月底约 $1.1B
              快速升至 2026 年 7 月初约 $4.05B；管理层相关评论还称银行预期年底前盈利。合起来看，这些事实说明 Erebor
              不只是概念银行。它已经有足够真实资金和客户牵引力，开始管理线上资产负债表规模。但这些事实没有告诉投资者：存款基础有多集中、对利率有多敏感，盈利路径有多少来自安全的资金部署，又有多少来自风险更高的专业信贷。
