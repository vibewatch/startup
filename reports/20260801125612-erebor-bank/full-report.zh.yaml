  - id: TI005
    title: 优先私下尽调包
    columns:
      - 工作流
      - 必备文件
      - 为什么重要
      - 缺失时的阻断风险
    rows:
      - - 存款质量
        - 集中度报告、未保险存款拆分和定价阶梯
        - 说明增长是否有粘性，以及多元化是否真实
        - 热钱型、集中的存款基础可能很快逆转。
      - - 信贷账簿
        - 按产品划分的余额、收益率、逾期、准备金和抵押品政策
        - 判断专项贷款是在增厚收益，还是带来危险
        - 有吸引力的利差可能掩盖不成熟的风控。
      - - 财资和 ALM
        - 证券账簿、久期、流动性阶梯和压力测试
        - 验证公司承诺的保守启动姿态
        - 存款快速增长可能跑在资产配置纪律前面。
      - - 支付经济性
        - 按产品划分的交易量、定价、欺诈损失、AML 成本和客户留存
        - 测试支付论点能否盈利扩张
        - 缺少单位经济性，费用叙事很容易被夸大。
      - - 资本栈
        - 股权结构表、监管资本处理和融资条款
        - 厘清有多少损失吸收和稀释承受能力
        - 头部估值传闻可能掩盖普通股真实价值。
    notes: 在把 Erebor 视为不止一个情景化财务模型之前，这是所需的最低尽调包。
