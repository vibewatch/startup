      - number: '6.4'
        title: 集中度与声誉风险
        blocks:
          - type: paragraph
            body: >-
              客户集中度是本章最核心的未解风险。Erebor 服务的类别可能利润丰厚，但相关性也高：VC 支持的 AI 公司、防务科技建设者、crypto
              公司，以及需要非常规银行通道的企业。这些细分暴露在政策变化、融资周期和声誉外溢中，冲击方式不同于普通商业银行客户。The Week 的批评还指出了一个更不寻常的 go-to-market 风险：如果 Erebor
              太容易被读成一家政治网络银行，即便产品有吸引力，一些潜在客户也可能避开它。另一些客户可能恰恰因此被吸引。这样的非对称性让获客更难预测。因此，目前最站得住脚的判断应保持平衡。Erebor
              显然在服务不足细分里找到了真实需求，但市场仍缺少必要数据，无法区分健康专业化和集中敞口。私人尽调需要补上这个缺口，才能把当前增长曲线当作客户质量可规模化、可持续的证明。
