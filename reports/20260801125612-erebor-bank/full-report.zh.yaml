      - number: '7.2'
        title: 资产负债表、运营与人员风险
        blocks:
          - type: paragraph
            body: >-
              SVB 仍是理解 Erebor 非法律风险的警示框架。不是因为 Erebor 明显在重复 SVB
              的具体错误，而是因为它同样是一家服务相关行业的专业银行，存款可能快速流动，客户又对声誉敏感。可见缓释因素有意义：新设银行阶段 12%
              杠杆约束，以及投资者声称初始资产负债表流动性很强。不过，这些缓释因素必须经受增长考验。如果存款扩张快于控制体系，如果承保纪律尚未证明就扩大贷款，或如果小团队同时承担牌照合规、产品发布和争议客户细分，执行风险可能成为真正的失效模式。OCBJ
              关于公开员工足迹有限的描述加重了这一担忧。简言之，即便宏观和政策环境保持支持，Erebor 也可能因普通银行执行失误而失败。银行公开容错空间也很小，因为每一次失误都很可能同时被放进银行风险和 crypto
              政治两套镜头里解读。
