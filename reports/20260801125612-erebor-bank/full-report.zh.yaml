        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              情景框架比虚假的精确更诚实。基准情景假设 Erebor 保住相当一部分存款增长，避开监管事件，在尽调中证明基本控制，并从存款和资金服务逐步扩展到更高价值的贷款或支付收入。在这条路径下，略高于 2025 年 12
              月标记的估值可以成立，但公开记录仍很难支撑完整的 $8B
              报道水平。牛市情景需要几件事同时走对：存款质量保持强劲、客户保持粘性、支付和稳定币服务变成真实费用引擎，监管姿态继续支持。熊市情景不需要崩盘；只要增长不够持久、利润率更薄，或尽调暴露控制、集中度或条款结构问题即可。可比上市公司只能作为护栏，但这些护栏仍重要。Erebor
