  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 监管收窄
        - 任何有实质影响的监管或立法变化，限制 Erebor 用例中的稳定币、跨境或高敏感度银行活动。
        - 压缩增长叙事和收费上行空间，同时抬高合规成本。
        - 除非价格重置且替代经济性清楚，否则转为回避。
      - - 存款质量不及预期
        - 尽调显示头部客户集中、余额不稳定，或利率敏感度高。
        - 削弱当前规模体现持久业务质量的主张。
        - 大幅下调基准估值，并要求新的下行保护。
      - - 变现疲弱
        - 资金管理和稳定币使用真实存在，但费率抽成或交叉销售经济性很差。
        - 叙事从高溢价基础设施银行，变成低回报细分银行。
        - 下调至小型银行式锚点区间。
      - - 控制或制裁问题
        - AML、制裁或治理流程薄弱的证据。
        - 把下行风险抬到生死线，并损害牌照价值。
        - 无论本轮融资怎么包装，都应回避。
      - - 惩罚性融资条款
        - 优先权、棘轮或交易结构把下行损失严重压到新投资人身上。
        - 条款错了，好公司也会变成坏证券。
        - 除非结构清理干净或价格给足补偿，否则不投。
    notes: 每个触发点之所以入选，是因为它会同时改变估值和承销本轮的意愿，而不只是影响后续监控的舒适度。
    claimRefs:
      - CV017
      - CV020
      - CV032
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV041
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 存款构成
        - 未保险占比、客户集中度、平均留存期和头部账户波动
        - 决定当前规模是否值得给出特许经营溢价。
        - 管理层 + 资金分析资料室。
      - - 经济性
        - NIM、手续费收入结构、定价、CAC、服务成本和盈利桥接
        - 区分有吸引力的增长和低质量的资产负债表扩张。
        - 财务团队和董事会材料。
      - - 信贷与资产结构
        - 贷款类别、承销政策、抵押品规则和早期表现
        - 用来判断未来收益率是否夹带隐性损失风险。
        - 首席信贷官材料。
      - - AML / 制裁控制
        - 监测架构、走廊政策、人员配置、升级处理和审计
        - 关键在于，前沿行业和跨境野心会放大下行风险。
        - 合规团队 + 外部律师。
      - - 治理与监管往来
        - 董事会控制、审查员反馈、整改事项和批准条件
        - 用来正确定价政治和监管压力。
        - 董事会秘书 / 法务。
      - - 当前轮融资条款
        - 价格、优先权、清算顺位、信息权和反稀释
        - 如果证券定价错误或结构过重，强公司也可能是弱投资。
        - 律师 + 融资文件。
    notes: 这些问题按决策杠杆筛选。每一项都可能实质性改变建议、风险评级或可接受入场价格。
    claimRefs:
      - CV005
      - CV008
      - CV018
      - CV036
      - CV037
      - CV039
      - CV040
      - CV042
