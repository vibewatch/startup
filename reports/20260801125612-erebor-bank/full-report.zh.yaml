      - number: '2.2'
        title: 规模测算视角与增长驱动
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的市场规模测算，是使用多个公开视角，各自捕捉 Erebor 机会的一部分。2026 年上半年，北美初创融资冲到异常高位，AI
              推动了历史上高度集中的资本周期，也把更多资金推向少数大型基础设施和前沿科技公司。Defense-tech VC 融资同样激增，venture debt 也在 2025
              年创下纪录基数，为非稀释信贷需求提供参照。与此同时，稳定币明显变成更大的支付和资金管理类别；到 2026 年中，市场规模估计集中在低 $300B
              区间，偏支付的分析师也认为企业采用正从投机走向真实运营工作流。单独看，这些视角没有一个就是 Erebor 的 SAM。但合在一起，它们解释了为什么一家面向 AI、防务、crypto
              和跨境资金管理的专业银行，拥有可信的需求底层。
