      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              牛市情景是连贯的。Erebor
              可能成为少见机构：同时拥有全国性银行牌照、创始人驱动的前沿品牌、稳定币相邻资金流转能力，并能为传统银行常觉得太有争议或运营上太奇怪的客户提供专业承保。如果这个组合带来粘性运营存款、支付量，并最终带来有吸引力的专业信贷，溢价估值就可能说得通，因为公司会站在软件式分销和银行式资产负债表变现的交叉点。反向论点也同样连贯。公开证据仍更像早期期权价值，而不是成熟盈利能力。让
              Erebor 兴奋的特征本身也制造风险：监管敏感性、制裁复杂度、政治审视、对敏感客户细分的依赖，以及核心银行指标上的公开证据不足。只有 Erebor
              证明快速存款增长质量高、可持久、可变现，并且不会带来监管或信贷意外，溢价才合理。在此之前，故事跑在已披露经济性前面。
