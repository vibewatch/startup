        title: 客户分层与需求驱动
        blocks:
          - type: paragraph
            body: >-
              Erebor 的客户论点异常明确。它不想做普通小企业银行，也不是消费者 fintech。监管申报和启动报道显示，它集中追逐 crypto、支付、投资、AI、防务、制造及相邻前沿行业中的企业和个人；许多
              incumbents 要么承保不好，要么干脆避开。这个框架重要，因为它缩窄了可触达客户集，但如果产品确实解决棘手的资金管理或融资问题，也会提高付费意愿。宏观条件有帮助。2026 年 AI
              融资达到异常水平，defense-tech 融资也创下新高，venture lenders 表示，具备规模和收入质量的借款人又在战略性使用债务。因此，Erebor
              在经济意义明确、运营要求高的客户池里捕鱼。开放问题不是这些池子是否存在，而是 Erebor 能否在大型 incumbents 或文档更完整的 fintech 吸收同一批买方之前，把利基匹配需求转化为持久银行关系。
