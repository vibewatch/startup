chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营意图
        blocks:
          - type: paragraph
            body: >-
              Erebor Bank 现在显然不只是概念 deck。监管记录、FDIC 批准材料和独立启动报道，都把它定位在俄亥俄州
              Columbus：一家新获牌全国性银行，服务技术相邻行业里的企业和高余额个人，而传统银行往往觉得这些客户难处理或风险高。官方、合作伙伴和独立来源里的稳定主线，不是大众零售银行，而是一家面向
              crypto、防务、人工智能、制造、支付和投资工作流的数字优先基础设施银行。这个定位重要，因为 Erebor 明确要解决 SVB
              之后的问题：前沿行业创始人想要一个银行交易对手，在同一监管屋檐下同时承接存款、贷款、支付和数字资产流程。因此，银行的早期叙事押在“专业机构”上——目标客户更窄，但更愿意承保非传统抵押品，也更愿意支持全天候资金流转。
