      - number: '3.3'
        title: 能力、信任与分销
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争位置由三个变量相互塑造：产品宽度、信任姿态和分销渠道。Fintech 技术栈在工作流设计、卡、审批和集成上得分高，但往往依赖 partner-bank 结构。Sponsor banks 和
              incumbents 在监管深度和既有交易轨道上更强。数字资产专家赢在 crypto-native 流动性和基础设施可信度。Erebor
              的差异化在这些类别交汇处最强：为前沿行业客户提供受监管银行服务，同时提供非常规承保和实时稳定币相邻资金流转。公开证据显示，今天没有竞争者干净提供完全相同的组合。但证据也显示，客户并不需要一个供应商提供所有东西。多栖很容易：一家初创公司可以同时使用一个
              fintech 前端、一家大型银行资金关系和一个稳定币提供商。这意味着 Erebor 真正的护城河必须来自服务集成和信任，而不是任何单点功能主张。
