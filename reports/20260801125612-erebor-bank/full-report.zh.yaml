      - number: '3.2'
        title: Sponsor-bank、稳定币与既有银行竞争
        blocks:
          - type: paragraph
            body: >-
              第二层竞争来自已经更贴近 Erebor 想拥有的受监管资金轨道的银行和基础设施提供商。Cross River 和 Lead Bank 展示了 sponsor banks 如何为 fintech
              和企业平台组合账户、卡、贷款，以及越来越有稳定币意识的支付。Customers Bank 是更传统的 incumbent 替代品，并且有可见的初创公司和 VC 基金叙事。更上层是
              JPMorgan，它已不再只是普通商业银行；Kinexys 展示了大型银行如何在既有机构关系内提供全天候 programmable-money 基础设施。在数字资产边缘，Circle、Coinbase 和
              Anchorage 争夺的是 Erebor 长期故事里最战略的一段：成为银行货币和稳定币 rails 之间可信、受监管的桥。Erebor 的难点在于，这些玩家不需要复制它的完整模式也能削弱它的
              wedge；它们只要拿下客户工作流里最关键的部分即可。
