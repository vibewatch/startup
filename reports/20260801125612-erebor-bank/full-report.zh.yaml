      - number: '8.4'
        title: 最终尽调要求与否决触发项
        blocks:
          - type: paragraph
            body: >-
              实践含义很直接。Erebor
              应继续留在名单上，但不能自动通过。接受高端私募价格前，投资者应要求一个范围紧凑的尽调资料室，把目前在黑箱里支撑估值的大部分变量解释清楚。优先问题包括存款构成、头部客户集中度、客户留存和定价、资产组合、专业信贷管线、承保政策、流动性管理、AML
              和制裁控制，以及任何当前轮次的真实融资条款。几个否决触发项也很清楚：监管收窄稳定币或跨境活动、证据显示近期存款增长集中或对利率敏感、经济性显著弱于叙事暗示，或激进优先权把下行转嫁给新钱，都会实质削弱投资案例。公司仍可能变得有价值，因此正确立场是继续研究，而不是回避。价格已经激进，因此估值立场仍是偏高，直到证据追上来。
