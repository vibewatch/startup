            body: >-
              最合理的理解是：Erebor 的架构先是银行核心，其次才是可编程 rails。牌照和 FDIC 批准锚定受监管存款和贷款。稳定币功能围绕银行核心展开，作为资金管理和支付层，而不是替代银行核心。Sui
              的机构材料有助于解释这一层想支持什么：实时结算、可编程资产流转，以及面向机构的低摩擦流动性操作。Circle、Cross River、Coinbase Institutional、Anchorage 和
              Kinexys 展示了市场上已经存在的相邻基础模块：可赎回稳定币、法币与链上资金流转、托管、代币化存款和全天候结算。Erebor 似乎在把这些基础模块组装成一个面向前沿行业企业的客户工作流。一个合理旅程从存款
              onboarding 开始，增加支付连接和稳定币进出，再扩展到专业贷款或更复杂的资金操作。最终变成可重复的软件产品，还是仍停留在关系驱动的银行服务，目前还不清楚。
