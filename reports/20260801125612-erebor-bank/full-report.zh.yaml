      - number: '6.3'
        title: 留存、扩展与粘性
        blocks:
          - type: paragraph
            body: >-
              接下来关键的不是 Erebor 能否获取初始账户，而是这些账户能否变成粘性的运营关系。公开层面很难判断。没有 cohort
              数据、NRR、流失率、细分留存、满意度或产品绑定披露。不过，现有证据指向一个可信的扩展循环。客户可能先开运营账户，用来替代或分散 SVB 式关系；再开始通过稳定币相关 rails
              转账；如果服务和合规撑得住，再增加专业信贷或更复杂的资金工作流。这样的产品绑定会让关系更难替换。反方同样重要：存款本身不证明质量，少数大余额也能制造亮眼的总量增长，却没有持久产品粘性。Erebor
              展示客户组合、重复使用和交叉销售深度之前，客户质量故事应保持有前景但临时。
