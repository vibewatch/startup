  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与制裁风险
        blocks:
          - type: paragraph
            body: >-
              当前最严重的风险不是竞争，甚至不是利润率波动，而是 Erebor
              能否在政治审视之下运营一家稳定币相关、服务前沿行业的银行，同时不引发监管事件。参议院信函和泄露融资备忘录不能证明不当行为，但它们制造了持久的治理和感知问题，也明确告诉监管者、交易对手和投资者该去哪里找弱点：牌照合法性、披露质量、政治影响和政策偏袒。Venezuela
              相关报道又放大了这项风险。无论报道中的 corridor 计划是否变得重要，它们都把 Erebor 推入最敏感的制裁语境之一。再加上尚未稳定的稳定币政策面，法律风险变成多层结构：审批流程风险、BSA/AML
              风险、制裁风险和数字资产规则制定风险相互作用。因此，银行的监管故事应被视为一个开放的运营变量，而不是已经解决的前置条件。风险既关乎监管耐心和叙事可信度，也关乎成文法律。
