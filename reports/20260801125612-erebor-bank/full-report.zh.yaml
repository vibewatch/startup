  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Erebor 是否有意思。它显然有。公司有真实牌照、真实的受保险存款批准、真实早期客户和存款动能，也有横跨 crypto、AI 和防务的差异化目标市场。更难的问题是，这些正面因素能否支撑
              2026 年 7 月所讨论的 $8B
              估值。仅看公开证据，答案是否定的。已披露证据集仍然太窄。投资者能看到顶线牵引力和融资热度，但看不到决定它究竟是持久复利型银行，还是昂贵叙事驱动边缘案例的关键材料：存款集中度、未保险占比、利润率结构、损失预期、费用抽成率、控制深度和
              cap table 条款。因此，正确建议应是对价格敏感，而不是否定公司。只有在更深尽调之后，或在明显更好的入场价格下，Erebor 才值得投资。在报道中的讨论估值水平上，估值支撑相对披露质量显得偏紧。
