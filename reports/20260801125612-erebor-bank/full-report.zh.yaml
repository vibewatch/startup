  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              理解 Erebor 的市场，不能把它框成泛 fintech
              或整个商业银行业。公开材料把银行放在经济中的更专业切片里：经营虚拟货币、AI、防务、先进制造，以及相邻支付或投资工作流的公司、基金和个人。这些客户需要一家银行，既能接受全天候资金调拨，也能理解非标准抵押品。这个边界重要，因为它排除了普通消费者存款和大多数标准小企业银行业务，也把
              Erebor 和纯 crypto 托管或 sponsor-bank 中间件区分开。SVB 之后，这个市场里的买方学到：一家对初创公司友好的机构，如果理解 VC
              支持资产负债表和快速流动的资金，确实能创造价值。他们也学到，专业化可能变成脆弱性。因此，今天的市场由两个需求同时定义：一家理解前沿资产的银行，以及一张客户相信能扛住相关性压力的资产负债表。Erebor
              的目标市场确实存在，但它并不宽、不均质，也不容易用单一自上而下数字衡量。
