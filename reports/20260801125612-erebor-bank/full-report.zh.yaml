            body: >-
              缺失数据和可见数据一样重要。公开来源没有显示未保险存款敞口、头部客户集中度、贷款账本构成、准备金水平、不良资产、核销、存款成本、净息差、费用抽成率或效率比。对一家前沿行业银行来说，这些不是学术细节。它们决定
              Erebor 是一家高速扩张、低损失的基础设施机构，还是一个品牌诱人的波动性利基贷款人。Erebor 目标行业可能与 VC 情绪、crypto
              政策、防务采购周期或专用硬件需求同向波动，这一点让上述问题更关键。因此，正确的尽调姿态应当保守：把存款增长和牌照视为真实正面项，把盈利说法视为临时判断，并在承保任何精确利润率或估值结论前要求资产级透明度。投资者还应要求管理层解释运营第一年内存款定价、流动性组合或信贷组合的任何大幅波动。Erebor
