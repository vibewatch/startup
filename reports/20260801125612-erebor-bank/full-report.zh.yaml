        blocks:
          - type: paragraph
            body: >-
              公开产品轮廓比利基 crypto 账户更宽，但又窄于一套文档完整的企业平台。FDIC
              材料和参议院备忘录清楚显示，这是一家围绕存款、贷款和服务运转的银行。投资者和启动报道加入了更具体的野心：以非常规抵押品支持的信用额度、AI 芯片或设备融资、全天候稳定币资金流转，以及为
              crypto、AI、防务和制造企业提供运营账户。Sui 称稳定币存入和提取已经向 Erebor
              客户上线，这是证明这套栈不只是叙事的最强证据。它重要，因为至少把产品的一部分放到了接近生产环境的位置。但它也暴露了文档缺口：除了这个证明点，Erebor 自己网站几乎没有说明
              onboarding、API、用户权限、交易量、服务等级或产品包装。因此，当前公开触面可信，但仍不完整。
