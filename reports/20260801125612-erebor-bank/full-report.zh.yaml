      - - 乐观
        - 存款在当前水平以上保持粘性，支付 / 稳定币收入落地，专业贷款扩张且不出损失，监管姿态保持建设性。
        - 如果 Erebor 证明自己既有软件式增长、又有银行式经济性，且没有条款包袱，$9B-$12B 可以讲得通。
        - 监管冲击、制裁暴露或变现疲弱会击穿案例。
        - 可能成立，但需要多项尽调给出正向确认。
      - - 基准
        - 存款增长部分留存，经济性逐步改善，控制体系足够，且没有重大监管事件。
        - 按当前公开证据，$5.5B-$7.5B 比报道中的 $8B 讨论更站得住。
        - 仍对利润率质量、集中度和股权结构敏感。
        - 这是当前公开证据下最合理的路径。
      - - 悲观
        - 增长放缓，存款被证明集中或对利率敏感，或尽调发现控制 / 条款问题。
        - $2.5B-$4.5B 变得合理，更接近小型受监管基础设施和银行式锚点。
        - 降估值融资风险、优先权包袱或政策收紧。
        - 如果当前牵引质量低于宣传，这一路径就合理。
    notes: 区间是参考股权价值，不是管理层指引，也不是基于非公开表述的模型输出。
    claimRefs:
