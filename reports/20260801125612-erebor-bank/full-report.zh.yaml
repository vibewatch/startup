        blocks:
          - type: paragraph
            body: >-
              风险图景中鼓舞人的部分在于，主要缓释因素看得见。Erebor 确实有牌照。FDIC
              保险确实获批。公开材料也确实指向保守的启动姿态。这意味着它不是一家在体系外即兴发挥的想象银行。问题在于，这些缓释因素只是第一层防线。它们降低了一些风险，却让治理、制裁、依赖和执行风险仍然活跃。尽调时，正确做法是定义明确触发项。任何监管推动的数字资产活动收窄、敏感
              corridor
              中的合规问题、任何有意义的合作伙伴不稳定，或任何偏离所声称保守资产负债表姿态的情况，都应立即改变承保立场。同样，如果无法拿出可信的私人证据证明控制体系、人员深度和集中度纪律，也应被视为足以改变决策的失败，而不是小的文档缺口。因此，治理深度、文档质量和控制可重复性，对下行保护异常重要。
