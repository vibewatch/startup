      - number: '1.3'
        title: 资本、投资者与早期规模
        blocks:
          - type: paragraph
            body: >-
              资本形成是公开证据里最清晰的正面项之一，但也包含最显眼的矛盾。独立启动报道引用约 $635M 初始资本，Haun Ventures 则描述为 $625M 承诺资本，加上一条规模相近的潜在存款客户管线。到 2025
              年底和 2026 年中，第三方来源大致收敛：2025 年 12 月融资估值 $4.35B，2026 年 7 月正在讨论 $8B 或更高估值。同一篇 7 月报道还称，存款在一个季度内从 $1.1B 升至
              $4.05B，期间新增近 400
              名客户。对一家新设银行来说，这些都是很强的早期牵引力，尤其是在它瞄准高要求行业的前提下。但没有公开来源给出银行式桥接，把存款连接到收入、净利息收入、亏损或客户集中度。投资者因此有足够证据相信 Erebor
              找到了真实市场需求，却还没有足够证据按拟议估值承保这类需求的质量和持久性。
