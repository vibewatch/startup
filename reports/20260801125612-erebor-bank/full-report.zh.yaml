        title: 信任控制与政策边界
        blocks:
          - type: paragraph
            body: >-
              信任和合规不是这个产品的旁支约束，而是产品边界。公开可见控制包括全国性银行身份、FDIC 保险，以及 Erebor 反复强调自己要做一家重监管的稳定币相关银行，而不是绕开银行规则的通道。这是正向解读。反向解读来自
              BIS 和仍在变化的美国政策面。BIS 认为，如果把稳定币当成骨干而不是受监管的附属层，它们无法通过核心货币体系测试。美国国会仍在处理数字资产托管和稳定币待遇问题。OFAC
              制裁让某些代理行或跨境构想尤其敏感。结果是，Erebor 的产品只有在持续把前沿速度的资金流转翻译回银行级控制时才能成立。公开来源还没有显示 AML
              工具、可审计性、开发者护栏或韧性流程的深度，而企业资金团队在把大额运营余额交给这套栈前，通常会要求看到这些。
