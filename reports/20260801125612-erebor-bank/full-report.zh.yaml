        blocks:
          - type: paragraph
            body: >-
              公开记录呈现出一组战略上很强、但也异常集中的创始人与治理表面。Palmer Luckey 是标志性人物，尽管报道称他不负责日常运营。备忘录和多家新闻来源勾勒出更完整的运营团队：Jacob Hirshman 和
              Owen Rapaport 任联席 CEO，Mike Hagedorn 任总裁，背后还有风险、财务和信贷负责人。这种
              crypto、银行和合规背景的组合，符合产品野心：银行希望在稳定币运营方、防务承包商和银行监管者面前都显得可信。不过，治理故事还没有完全透明。公开材料除了 Luckey
              和一两个投资者信号外，几乎没有披露董事会构成，也没有解释控制权、委员会结构或继任深度。关键人物依赖因此偏高。即便没有运营头衔，Luckey 的人脉、声誉和政治可见度仍然主导获客、融资和公众认知。
