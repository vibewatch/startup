            body: >-
              最可能的盈利引擎不是简单银行息差，而是混合模型。FDIC 和参议院材料显示，它确实是一家存贷机构；投资者和合作伙伴材料则显示，它还想做稳定币运营、AI
              设备融资、合同支持贷款和非传统抵押品。公开报道称，crypto 抵押贷款需求低于最初预期，这会把短期重点转向存款、资金流转和支付工作流。现阶段这未必是坏事。稳定币相关服务和支付 float
              可以加深客户关系，不必立刻承担最高风险的信用暴露。代价是利润率：如果 Erebor
              保持保守流动性姿态，并放慢专业贷款节奏，早期经济性可能更安全，但盈利性不如叙事暗示得那样明显。没有已提交报表，主要结论只能是方向性的：这是一个已经运行的银行模型，但 NII、费用和信用利差之间的精确权重仍不透明。
