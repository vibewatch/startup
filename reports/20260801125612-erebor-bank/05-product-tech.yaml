- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Bank charter and insured deposit layer
    - Anchor regulated balances and product trust
    - OCC / FDIC posture
    - Policy or supervisory friction can constrain roadmap.
  - - Stablecoin issuer layer
    - Provide redeemable digital-dollar asset
    - Circle or similar issuer standard
    - Reserve transparency and issuer concentration matter.
  - - Settlement network layer
    - Enable fast, programmable movement
    - Sui and other on-chain networks
    - Network, smart-contract, or operational dependency.
  - - Treasury orchestration layer
    - Connect users, permissions, ledgers, and reporting
    - Internal software plus APIs
    - Hard to assess because first-party documentation is sparse.
  - - Compliance and sanctions layer
    - Screen flows and preserve bank-grade controls
    - AML tooling, OFAC processes, audit trails
    - Weak controls would break product trust quickly.
  - - Specialty underwriting layer
    - Price nonstandard loans and collateral
    - Human credit teams plus sector knowledge
    - Execution quality rather than code alone may dominate outcomes.
  notes: The architecture is reconstructed from external proof points, not from Erebor-published system diagrams.
