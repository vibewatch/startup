- id: architecture-and-workflow
  title: Architecture and workflow
  body: 'The best reading of Erebor’s architecture is bank core first, programmable rails second. The charter and FDIC approval anchor regulated deposits and lending. Stablecoin functionality sits around that bank core as a treasury and payment layer rather than as a substitute for it. Sui’s institutional materials help explain what that layer is trying to enable: real-time settlement, programmable asset movement, and lower-friction liquidity operations for institutions. Circle, Cross River, Coinbase Institutional, Anchorage, and Kinexys show the adjacent primitives already available in the market: redeemable stablecoins, fiat and on-chain movement, custody, tokenized deposits, and always-on settlement. Erebor appears to be assembling those primitives into one customer workflow for frontier-sector businesses. A plausible journey starts with deposit onboarding, adds payment connectivity and stablecoin in/out, then expands into specialist lending or more complex treasury operations. Whether
    that becomes a repeatable software product or remains a relationship-driven banking service is still unclear.'
