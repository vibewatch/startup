company:
  name: Erebor Bank
chapter:
  number: 5
  title: Product & Tech
  summary: 'Erebor’s product thesis is coherent: pair a real bank charter with software-native treasury workflows, specialty credit, and stablecoin-enabled money movement for frontier-sector clients. The problem is not the ambition. It is the documentation. Public evidence proves some live payment functionality and a credible architecture direction, but much of the deeper product surface remains described indirectly through partners, investors, and reporting rather than through first-party technical disclosure.'
sections:
- id: product-scope-and-live-surface
  title: Product scope and live surface
  body: 'The public product outline is broader than a niche crypto account and narrower than a fully documented enterprise platform. FDIC materials and the Senate memo clearly show a bank centered on deposits, lending, and services. Investor and launch coverage add more specific ambition: lines of credit backed by unusual collateral, AI chip or equipment finance, always-on stablecoin movement, and operating accounts for crypto, AI, defense, and manufacturing firms. The strongest proof that this stack is more than narrative is Sui’s statement that stablecoin deposits and withdrawals are already live for Erebor customers. That matters because it places at least one piece of the product in production-adjacent territory. But it also reveals the documentation gap: beyond that proof point, Erebor’s own website says almost nothing about onboarding, APIs, user permissions, volumes, service levels, or product packaging. The current public surface is therefore credible but still incomplete.'
