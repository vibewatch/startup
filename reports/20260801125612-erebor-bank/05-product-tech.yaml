- id: roadmap-and-main-gaps
  title: Roadmap and main gaps
  body: 'The visible roadmap seems to run from charter and deposit launch, to live stablecoin-adjacent movement, to broader specialty-credit and cross-border operating use cases. That progression is rational because it builds trust and operating data before taking maximum underwriting or jurisdictional complexity. It is also where the current evidence thins out. Public proof is weak for cards, GPU lending at scale, crypto-backed credit, developer platform maturity, production-scale cross-border treasury, and the economics of the stablecoin layer itself. Comparable infrastructure providers demonstrate what customers will eventually expect: modular APIs, instant money movement, insured balances, compliance controls, reporting, and clear operational SLAs. Erebor may be able to deliver that stack, but the current public materials do not yet prove it. Buyers would still need demonstrations, reference calls, and integration evidence before treating the platform as fully enterprise-ready. The product-tech case is therefore investable as a direction and a systems thesis, not yet as a fully documented software-and-banking platform
    with measurable production breadth.'
