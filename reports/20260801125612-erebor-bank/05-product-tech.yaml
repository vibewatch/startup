- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Erebor solution
  - Measurable benefit
  - Limitation
  rows:
  - - Move dollars globally outside bank hours
    - ACH / wire windows, fragmented off-ramps
    - Stablecoin-linked deposits and withdrawals plus bank relationship
    - 24/7 movement and faster treasury operations
    - Scale and production usage are undisclosed.
  - - Hold operating cash with a bank that understands frontier sectors
    - Legacy banks may hesitate on crypto, defense, or unusual collateral
    - Sector-specific bank with lending and payments under one roof
    - Fewer counterparties and better underwriting fit
    - Concentration and policy scrutiny can worry buyers.
  - - Finance hardware or specialized growth needs
    - Traditional lenders may misprice GPUs or nonstandard assets
    - Specialty credit ambition for AI chips, contract-backed loans, or private-securities collateral
    - Potentially faster access to capital
    - Public proof of scale is still thin.
  - - Bridge fiat and digital-dollar workflows
    - Separate crypto providers, payment vendors, and banks
    - Integrated regulated bank plus digital-dollar interfaces
    - Lower reconciliation and compliance complexity if executed well
    - Depends heavily on external networks and controls.
  notes: Benefits are directional hypotheses derived from the product posture, not company-reported KPI outputs.
