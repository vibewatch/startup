- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - National-bank status is enough to differentiate
    - Mercury and other fintechs are pursuing charters; incumbents already have them
    - High
    - Track rival charter progress and whether Erebor’s direct-bank advantages remain visible.
  - - Stablecoin rails create a unique wedge
    - Cross River, Circle, Coinbase, Anchorage, and Kinexys already operate on adjacent rails
    - High
    - Prove why Erebor’s integrated stack solves a harder customer problem.
  - - Sector focus creates trust
    - Niche focus can also cap scale and increase concentration risk
    - High
    - Show diversified customer acquisition beyond founder-affiliated circles.
  - - Integrated product set beats modular stacks
    - Customers can multi-home across bank, fintech, and crypto providers
    - High
    - Demonstrate lower operational friction and better economics from single-provider adoption.
  - - Post-SVB demand guarantees share gain
    - Megabanks and fintechs have already absorbed much of the replacement demand
    - Medium
    - Provide win/loss data that isolates Erebor’s actual competitive take rate.
  notes: 'The competitive risk is combinational rather than one-for-one: several strong alternatives can jointly compress Erebor’s moat.'
