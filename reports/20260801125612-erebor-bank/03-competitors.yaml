- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Public pricing / packaging cue
  - Included capabilities
  - Unknowns
  - Implication
  rows:
  - - Mercury
    - Banking plus workflow software; no simple public all-in price on source used
    - Accounts, cards, workflows, AI tooling
    - Realized pricing and unit economics
    - Competes more on workflow value than posted rates.
  - - Brex
    - Business account and finance stack messaging
    - Accounts, cards, approvals, invoicing
    - Realized economics, contract structure
    - Bundled finance stack can reduce switching appetite.
  - - Ramp
    - Checking paired with spend software
    - Checking, cards, approval controls, automation
    - Deposit pricing, margin, relationship depth
    - Software-led convenience is a real competitive force.
  - - Cross River
    - Infrastructure-bank packaging
    - Accounts, payments, cards, on/off ramp, stablecoins
    - End-customer pricing by partner
    - Distribution through platforms can outscale direct sales.
  - - Circle / Coinbase
    - API / network style packaging
    - Stablecoins, global payments, institutional crypto rails
    - Banking-adjacent economics and full-wallet capture
    - Can peel away the highest-value payment layer without replacing the bank relationship.
