    - Startups, tech, expanding beyond tech
    - Strong startup UX, software-led finance workflow
    - Not yet a live chartered bank.
  - - Brex
    - Fintech finance stack
    - Private scale undisclosed on public product page
    - Startups and modern finance teams
    - Cards, controls, and business account in one stack
    - Partner-bank structure rather than its own charter.
  - - Ramp
    - Spend-management + checking platform
    - Private scale undisclosed on public page
    - SMBs and finance teams
    - Strong approval and spend automation workflow
    - Less differentiated on frontier-sector underwriting.
  - - Cross River
    - Sponsor bank / fintech infrastructure bank
    - Scaled bank infrastructure platform
    - Fintechs, enterprises, crypto-native payments
    - Stablecoin-linked payments, accounts, cards, APIs
    - B2B infrastructure brand is stronger than direct startup brand.
  - - Lead Bank
    - Sponsor bank / BaaS bank
    - Private bank; platform orientation
    - Fintech and embedded-finance programs
    - Flexible bank infrastructure and FDIC-insured account issuance
    - Less visible direct founder brand.
  - - Customers Bank
    - Commercial bank incumbent
    - Operating bank with startup & VC fund messaging
    - Startups, VC funds, commercial clients
    - Debt and deposits within a real bank
    - Less crypto-native or 24/7 narrative.
  - - JPMorgan / Kinexys
    - Megabank incumbent
    - ~12k startup clients in CNBC; global transaction scale
    - Startups, enterprises, institutions
    - Trust, relationship density, programmable-money rails
    - May still be slower or narrower for edge underwriting cases.
  - - Circle / Coinbase / Anchorage
    - Stablecoin and digital-asset infrastructure
    - Institutional digital-asset platforms
    - Crypto-native firms, institutions, enterprises
    - Strong stablecoin / custody / institutional rails
    - Not full substitutes for all commercial-bank workflows.
