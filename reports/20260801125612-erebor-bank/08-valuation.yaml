- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Mercury
    - Private valuation / reported revenue
    - $5.2B valuation; reported ~$650M annualized revenue
    - Closest startup-banking premium case for founder/finance workflow demand.
    - Not a directly comparable live national-bank balance sheet.
  - - Lead Bank
    - Private valuation
    - $1.47B valuation
    - Useful regulated-infrastructure bank reference point.
    - Different charter context and narrower frontier narrative.
  - - Customers Bancorp
    - Public market cap
    - $2.66B market cap
    - Shows disclosed bank value with real revenue legibility.
    - Conventional public bank; much more mature and less narrative-driven.
  - - SoFi
    - Public market cap / revenue
    - $21.04B market cap; $1.2B Q2 2026 revenue; public revenue history available
    - Shows how scaled digital-finance narratives can support large market caps.
    - SoFi has far broader product breadth and full public disclosure.
  - - Coinbase
    - Public market cap / revenue
    - $38.53B market cap; public revenue history available
    - Useful for valuing crypto-adjacent regulated financial infrastructure at scale.
    - Exchange model and cyclicality differ sharply from commercial banking.
  - - Robinhood / PayPal
    - Public market cap / revenue
    - Robinhood $77.81B market cap; PayPal $49.31B market cap; both have long revenue histories
    - Illustrates upper-end public fintech equity values with far more disclosure and consumer scale.
    - Consumer fintech and payments are imperfect comps for Erebor’s bank-led niche.
  notes: The purpose of the comp set is not to claim one-for-one comparability. It is to show where the market already grants premium value and what level of disclosure usually accompanies it.
