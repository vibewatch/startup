- id: final-diligence-asks-and-kill-triggers
  title: Final diligence asks and kill triggers
  body: The practical implication is straightforward. Erebor should remain on the list, but not on autopilot. Before accepting a premium private price, an investor should demand a tightly scoped diligence room that resolves the variables currently doing most of the valuation work in the dark. The priority asks are deposit composition, top-customer concentration, customer retention and pricing, asset mix, specialty-credit pipeline, underwriting policy, liquidity management, AML and sanctions controls, and the real financing terms of any current round. Several kill triggers are equally clear. A regulatory narrowing of stablecoin or cross-border activity, evidence that recent deposit growth is concentrated or rate-sensitive, meaningfully weaker economics than implied by the narrative, or aggressive preferences that shift downside onto new money would all materially worsen the investment case. Because the company may still become valuable, the right stance is research-more rather than avoid.
    Because price is already ambitious, the valuation stance remains stretched until evidence catches up.
