- id: thesis-versus-anti-thesis
  title: Thesis versus anti-thesis
  body: 'The bull case is coherent. Erebor could become the rare institution that combines a national-bank charter, founder-led frontier brand, stablecoin-adjacent treasury movement, and specialty underwriting for customers that traditional banks often treat as too controversial or too operationally odd. If that combination produces sticky operating deposits, payments volume, and eventually attractive specialty credit, then a premium valuation can make sense because the company would sit at the intersection of software-like distribution and bank-like balance-sheet monetization. The anti-thesis is just as coherent. Public evidence still looks more like early option value than like mature earning power. The very features that make Erebor exciting also create risk: regulatory sensitivity, sanctions complexity, political scrutiny, dependence on sensitive customer segments, and thin public evidence on core bank metrics. A premium is deserved only if Erebor can prove that fast deposit growth is
    high-quality, durable, and monetizable without producing a regulatory or credit surprise. Until then, the story outruns the disclosed economics.'
  claimRefs:
  - CV012
  - CV013
