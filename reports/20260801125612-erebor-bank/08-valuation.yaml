  evidenceGaps:
  - id: QV031
    description: Current round price, share class, preferences, and anti-dilution terms are not public.
    impact: Without terms, a good company can still be a poor security for new money.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV030
  - id: QV032
    description: Public sources do not show deposit concentration, uninsured share, or retention by cohort.
    impact: These variables heavily determine whether current scale deserves premium franchise valuation.
  - id: QV033
    description: Public evidence does not disclose asset mix, reserve posture, or early credit performance in detail.
    impact: Valuation cannot confidently capitalize earnings quality without these facts.
  - id: QV034
    description: There is no public investor-grade bridge from deposit growth to fee revenue, NIM, or profitability durability.
    impact: This blocks high-confidence scenario weighting.
  - id: QV035
    description: Supervisory correspondence, remediation items, and AML/sanctions-control depth remain private.
    impact: Residual risk discount may be materially too low or too high without private evidence.
    relatedQuestionRefs:
    - QV020
