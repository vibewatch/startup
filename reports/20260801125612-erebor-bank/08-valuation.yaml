- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Deposits stay sticky above current levels, payments/stablecoin revenue becomes real, specialty lending scales without losses, and regulatory posture stays constructive.
    - $9B-$12B can be argued if Erebor proves software-like growth plus bank-like economics and no term overhang.
    - Regulatory shock, sanctions exposure, or weak monetization break the case.
    - Possible but requires multiple positive diligence confirmations.
  - - Base
    - Deposit growth partly sticks, economics improve gradually, controls are adequate, and no major regulatory event occurs.
    - $5.5B-$7.5B looks more defensible than the reported $8B talk on current public evidence.
    - Still sensitive to margin quality, concentration, and cap-table structure.
    - Most reasonable public-evidence path today.
  - - Bear
    - Growth decelerates, deposits prove concentrated or rate-sensitive, or diligence surfaces control/term issues.
    - $2.5B-$4.5B becomes plausible, closer to smaller regulated-infrastructure and bank-style anchors.
    - Down-round risk, preference overhang, or policy tightening.
    - Plausible if current traction is lower-quality than advertised.
  notes: Ranges are reference equity values, not management guidance or model outputs from nonpublic statements.
