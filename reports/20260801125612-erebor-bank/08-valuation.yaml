- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence today
  - What would change the view
  rows:
  - - Real bank with rare positioning
    - Charter, FDIC approval, frontier-sector focus, and deposit momentum are all supported publicly.
    - If diligence shows weak controls or concentrated/rate-sensitive deposits, this argument weakens quickly.
  - - Integrated bank + stablecoin bridge could deserve a premium
    - Sui support and memo language indicate a differentiated treasury and settlement ambition.
    - Need proof that stablecoin-linked services are material, compliant, and sticky rather than mostly narrative.
  - - Fast early growth could compound
    - Reported deposits rose from about $1.1B to $4.05B while customer adds reportedly reached about 400 in three months.
    - Need retention, pricing, and composition data to show the growth is durable and not promotional or concentrated.
  - - Premium multiple may be justified
    - Mercury and other fintech-adjacent franchises show that banking infrastructure can command premium private pricing.
    - Need evidence that Erebor’s economics can converge toward those premium cases rather than toward ordinary bank returns.
  - - Public evidence is still incomplete
    - Core underwriting metrics, loss rates, margin, and cap-table terms are not publicly disclosed.
    - A full data room with operating and financing evidence could move recommendation upward.
  - - Regulatory and governance overhang can compress value
    - Senate scrutiny and political criticism create an overhang separate from pure product quality.
    - A quiet supervisory posture and strong diligence evidence on compliance and governance would reduce this discount.
  notes: This table intentionally separates the company-quality debate from the price-and-proof debate.
