- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory narrowing
    - Any meaningful supervisory or legislative change that restricts stablecoin, cross-border, or high-sensitivity banking activity for Erebor’s use cases.
    - Compresses growth narrative and fee optionality while raising compliance cost.
    - Move to avoid unless price resets and alternative economics are clear.
  - - Deposit-quality disappointment
    - Diligence shows top-customer concentration, unstable balances, or high rate sensitivity.
    - Undermines the claim that current scale reflects durable franchise quality.
    - Cut base-case valuation materially and require new downside protections.
  - - Weak monetization
    - Treasury and stablecoin usage is real but fee take rates or cross-sell economics are poor.
    - Converts narrative from premium infrastructure bank to lower-return niche bank.
    - Downgrade toward smaller bank-style anchor set.
  - - Control or sanctions issue
    - Evidence of weak AML, sanctions, or governance processes.
    - Raises existential downside and damages charter value.
    - Avoid irrespective of round marketing.
  - - Punitive financing terms
    - Preferences, ratchets, or structure heavily skew downside against new investors.
    - Even a good company can be a bad security at the wrong terms.
    - Stay out unless structure is cleaned up or price compensates.
  notes: Each trigger is chosen because it would alter both value and willingness to underwrite the round, not merely affect monitoring comfort.
  claimRefs:
  - CV017
  - CV020
  - CV032
  - CV034
  - CV035
  - CV036
  - CV037
  - CV038
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Deposit composition
    - Uninsured share, customer concentration, average tenure, and top-account volatility
    - Determines whether current scale deserves premium franchise value.
    - Management + treasury analytics room.
  - - Economics
    - NIM, fee revenue mix, pricing, CAC, servicing cost, and profitability bridge
    - Separates compelling growth from low-quality balance-sheet expansion.
    - Finance team and board materials.
  - - Credit and asset mix
    - Loan categories, underwriting policy, collateral rules, and early performance
    - Required to judge whether future yield comes with hidden loss risk.
    - Chief credit officer materials.
  - - AML / sanctions controls
    - Monitoring architecture, corridor policy, staffing, escalation, and audits
    - Material because frontier sectors and cross-border ambitions magnify downside.
    - Compliance team + external counsel.
  - - Governance and supervisory correspondence
    - Board controls, examiner feedback, remediation items, and approval conditions
    - Needed to price political and regulatory overhang correctly.
    - Board secretary / legal.
  - - Current round terms
    - Price, preferences, liquidation stack, information rights, and anti-dilution
    - A strong company can still be a weak investment if the security is mispriced or overstructured.
    - Counsel + financing documents.
  notes: These asks are selected for decision leverage. Each one can materially move recommendation, risk rating, or the acceptable entry price.
