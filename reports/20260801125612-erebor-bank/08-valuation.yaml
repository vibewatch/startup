- id: scenario-and-comparable-frame
  title: Scenario and comparable frame
  body: 'A scenario framework is more honest than false precision. The base case assumes that Erebor keeps a meaningful share of its deposit gains, avoids a regulatory event, proves basic controls in diligence, and gradually expands from deposits and treasury services toward higher-value lending or payment revenue. Under that path, a valuation somewhat above the December 2025 mark is plausible, but the public record still struggles to defend the full reported $8 billion level. The bull case requires several things to go right together: deposit quality stays strong, customers remain sticky, payments and stablecoin services become real fee engines, and regulatory posture stays supportive. The bear case does not require collapse; it only requires that growth prove less durable, margins prove thinner, or diligence surface control, concentration, or term-structure concerns. Comparable public companies are useful only as guardrails, but those guardrails still matter. Erebor is being discussed
    at a valuation above Mercury and far above smaller regulated bank or sponsor-bank reference points despite much thinner disclosure.'
  claimRefs:
