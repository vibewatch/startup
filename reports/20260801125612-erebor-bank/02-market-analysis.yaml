- id: sizing-lenses-and-growth-drivers
  title: Sizing lenses and growth drivers
  body: The most defensible market-sizing approach is to use several public lenses that each capture part of Erebor’s opportunity. North American startup funding hit extraordinary highs in the first half of 2026, with AI driving a historically concentrated capital cycle and pushing ever more money into a small number of large infrastructure and frontier-technology companies. Defense-tech venture funding also surged, while venture debt reached a record 2025 base that informs demand for non-dilutive credit. At the same time, stablecoins became a meaningfully larger payment and treasury category, with mid-2026 market-size estimates clustering in the low-300-billion-dollar range and payment-focused analysts arguing that corporate adoption is moving beyond speculation into real operational workflows. None of those lenses is a SAM for Erebor by itself. But together they show why a specialist bank aimed at AI, defense, crypto, and cross-border treasury has a plausible demand substrate.
  claimRefs:
  - CM008
