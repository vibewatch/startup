  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: true-sam
    missingEvidence: Management-level segmentation of addressable deposits, payment volume, and credit demand by target sector and customer size.
    whyItMatters: Public venture, defense, and stablecoin figures are only top-down proxies and do not show how much of the market a new specialist bank can realistically serve.
    diligencePath: Request internal market-segmentation, pipeline, and conversion assumptions used in Erebor’s board or fundraising materials.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: stablecoin-sizing
    missingEvidence: One consistent, regulator-grade measure of stablecoin payment flows that separates trading, reserves, and real-economy payments.
    whyItMatters: Market-cap figures and payment-flow estimates are directionally useful but not interchangeable, and careless mixing can overstate opportunity.
    diligencePath: Request bank or network data on corporate stablecoin payment volumes by use case.
    relatedQuestionRefs:
    - QM019
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-behavior
    missingEvidence: Real conversion data on how often frontier-sector companies move their primary banking relationship versus only adding a treasury or payments tool.
    whyItMatters: Relationship-switching friction is central to Erebor’s go-to-market reality but cannot be inferred from venture funding headlines.
    diligencePath: Obtain pipeline funnel metrics, win/loss analysis, and expected average balances by segment.
    relatedQuestionRefs:
    - QM011
    - QM024
    relatedTableRefs:
    - TM003
  - type: stale
    severity: material
    topic: regulatory-surface
    missingEvidence: Current supervisory view on stablecoin clearing, crypto collateral, and correspondent structures relevant to Erebor’s product roadmap.
    whyItMatters: Policy is still moving in 2026, so product-market opportunity depends in part on the latest supervisory posture.
    diligencePath: Update the legal and regulatory memo with current OCC, FDIC, FINRA, and legislative developments before underwriting the market thesis.
    relatedQuestionRefs:
    - QM016
    - QM023
    relatedTableRefs:
    - TM004
  - type: enumeration-incomplete
    severity: minor
    topic: segment-coverage
    missingEvidence: Exhaustive public map of all subsegments Erebor may serve inside funds, broker-dealers, trading firms, and international companies.
    whyItMatters: The public market map is enough for thesis framing but not exhaustive enough for deep segmentation.
    diligencePath: Request customer and prospect segmentation from management or CRM exports by sector and use case.
    relatedQuestionRefs:
    - QM009
    - QM025
    relatedTableRefs:
    - TM003
