- id: constraints-contradictions-and-gaps
  title: Constraints, contradictions, and diligence gaps
  body: The same evidence that makes the market interesting also limits overconfident sizing. AI funding is real, but it is concentrated into mega-rounds that do not map neatly into a diversified bankable client base. Stablecoin market cap is large, but much of it still reflects trading and reserve structures rather than the exact payment or deposit balances a bank can capture. Venture debt volumes are useful context, yet they say more about lender appetite and financing structure than about one new bank’s reachable credit book. Most importantly, regulation remains part of the market itself, not a background condition. Federal policy, market-structure legislation, and supervisory expectations around digital assets can expand or shrink Erebor’s opportunity surface quickly. Public data therefore supports a chapter judgment that the market is real, timely, and structurally underserved in some niches, while leaving Erebor’s true serviceable market and ultimate share unresolved. That uncertainty
    should be preserved rather than papered over with a single giant TAM slide.
