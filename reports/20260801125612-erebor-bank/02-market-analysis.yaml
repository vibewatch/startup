tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Frontier-sector operating banking
    - Primary operating deposits, treasury, payments, insured cash, risk controls
    - Mass-market retail deposits and generic SMB checking
    - Founders, CFOs, treasurers
    - Core market for Erebor.
  - - Specialized startup credit
    - Venture debt, capital-call lines, asset-backed lending against GPUs or crypto
    - Conventional mortgages, unsecured consumer credit
    - Finance teams, funds, high-balance principals
    - Important for differentiation, not likely the initial volume driver.
  - - Stablecoin-enabled treasury and payments
    - Fiat on/off ramps, settlement, treasury movement, cross-border corporate flows
    - Speculative token trading by retail users
    - Treasury teams, payment firms, crypto-native ops teams
    - Critical wedge for 24/7 positioning.
  - - Defense / advanced-manufacturing banking
    - Contract-linked deposits, equipment financing, supplier payments
    - Traditional defense primes’ broad relationship-banking wallets
    - CFOs, procurement-finance teams
    - Useful niche where legacy underwriting can be slow.
  - - Funds and market infrastructure
    - Operating accounts, subscription lines, escrow / collateral workflows
    - General retail wealth management
    - Funds, broker-dealers, proprietary trading firms
    - Adjacency that can deepen balances and fee income.
  notes: Defines the opportunity by banking workflow, not by a generic fintech headline market.
