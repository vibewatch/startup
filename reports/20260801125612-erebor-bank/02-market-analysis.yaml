- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI mega-round cycle
    - Positive but concentrated
    - Near term
    - Creates large treasury and vendor-payment needs, but among a narrow set of firms
    - How many AI clients are outside the top few mega-round names?
  - - Defense-tech funding surge
    - Positive
    - Near term
    - Supports specialized underwriting and contract-linked banking demand
    - How much of the demand becomes recurring operating balances?
  - - Stablecoin adoption in corporate payments
    - Positive
    - Near to medium term
    - Strengthens the 24/7 settlement wedge
    - What portion of flow is real-economy payments versus trading or reserve balances?
  - - Post-SVB switching demand
    - Positive
    - Current
    - Creates willingness to reconsider primary banking relationships
    - How sticky are the new relationships once megabanks improve service?
  - - Regulatory flux around digital assets
    - Negative / volatile
    - Current
    - Can expand or shrink the product surface quickly
    - What exact product lines rely on current policy posture?
  - - Concentration and trust risk
    - Negative
    - Persistent
    - Specialized banks can grow fast but also lose deposits in correlated fashion
    - What is the target mix of deposits and sector exposures?
  notes: Pairs growth vectors with the constraints that can keep a large headline market from becoming a real bankable opportunity.
