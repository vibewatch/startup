- id: buyers-users-payers-and-adoption
  title: Buyers, users, payers, and adoption path
  body: 'The buyers in Erebor’s market are mostly not retail users; they are finance decision-makers. Founders may champion a relationship, but the daily users are controllers, CFOs, treasurers, and operations staff moving payroll, vendor wires, FX, stablecoin settlements, and collateralized borrowing. The payer is usually the company treasury, fund vehicle, or high-balance principal account. That structure makes adoption path more complex than a typical fintech signup. A startup can open a spend account quickly, but moving primary operating balances, credit facilities, treasury controls, and on-chain money movement to a new bank takes trust and process change. The real wedge for a specialist bank appears when the customer has a problem that a megabank or generic fintech will not solve cleanly: GPU-backed borrowing, crypto-to-fiat treasury operations, or a frontier-sector underwriting need that sponsor-bank stacks still treat as edge-case behavior. This makes the market attractive, but it
    also means Erebor’s growth depends on relationship depth rather than sheer account count.'
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
