  topStrengths:
    - Real national-bank charter and FDIC approval create authentic regulatory legitimacy.
    - Reported deposit growth from about $1.1B to $4.05B suggests unusual early market pull.
    - Clear positioning for crypto, AI, defense, and other frontier clients addresses a real post-SVB gap.
    - >-
      Stablecoin-linked treasury and payment ambitions could create differentiated value if compliant and well
      monetized.
    - Strong investor and founder network can accelerate distribution, talent access, and early credibility.
  topRisks:
    - >-
      Public evidence is still too thin on deposit quality, economics, asset mix, and controls for a premium private
      underwriting call.
    - Political scrutiny, sanctions sensitivity, and regulatory overhang could compress value quickly.
    - Deposit momentum may prove concentrated, rate-sensitive, or less durable than headlines imply.
    - The valuation narrative appears to be running ahead of disclosed financial proof.
    - Current financing terms, preferences, and downside protections are not publicly known.
  unresolvedGaps:
    - Deposit concentration, uninsured share, and retention by cohort are not publicly disclosed.
    - Asset mix, underwriting standards, and early credit performance remain largely opaque.
    - >-
      Public sources do not show a clean bridge from deposit growth to durable revenue, margin, or profitability
      quality.
    - Supervisory correspondence, remediation items, and AML/sanctions-control depth remain private.
    - Current round price, preferences, and anti-dilution structure are not publicly available.
