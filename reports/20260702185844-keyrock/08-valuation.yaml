- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - The round closes cleanly, MiCA/FCA access converts into institutional mandates, AWM and onchain products monetize, and centralized trading activity recovers.
    - $1.4B-$2.2B; upside needs both revenue-quality improvement and cleaner structure than the public record currently shows.
    - Would require audited financials, disclosed terms, and visible recurring revenues from new adjacencies.
    - No proof of monetized adjacencies or continued volume softness.
  - - Base
    - Keyrock continues to grow, but public opacity persists and new adjacencies are still early.
    - $0.9B-$1.3B; the current mark can be roughly fair only if underlying economics are decent and terms are not punitive.
    - Fresh private comps support unicorn pricing, but not a premium buy call.
    - Financials remain opaque or terms are more investor-protective than headline valuation suggests.
  - - Bear
    - Volumes stay soft, the close comes with preference-heavy terms, or BlockFills and regulatory execution add friction.
    - $0.45B-$0.8B; common-equity value compresses sharply if the market-making core is weaker than the narrative or if structure is adverse.
    - Sector regulatory action and 2026 volume weakness already show credible downside pathways.
    - Current revenue power disappoints, or legal and integration issues surface.
  notes: Scenario bands are equity-value ranges anchored to fresh private marks, public analog discipline, and explicit operating assumptions, not to an unsupported DCF.
