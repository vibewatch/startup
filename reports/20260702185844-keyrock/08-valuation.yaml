- id: final-diligence-asks-and-thesis-breaks
  title: Final diligence asks and thesis-break triggers
  body: 'The diligence path is straightforward: replace narrative breadth with economic proof. Management should be asked for audited 2025 and year-to-date 2026 financials, service-line revenue mix, gross margin, counterparty concentration, trading-capital usage, and a full post-Series-C cap table including any preference stack. The committee also needs evidence that the new adjacencies are commercial rather than aspirational: AUM and fee schedules for asset management, client adoption and economics for onchain products, and the liabilities, integration roadmap, and retained clients associated with BlockFills. The investment should be repriced or killed if current revenue power is materially weaker than the unicorn narrative, if the round includes aggressive downside protections for insiders or new money, or if regulatory or counterparty controls fall short of institutional expectations. Conversely, the stance could improve if audited economics, diversified clients, and clean terms prove
    that Keyrock is becoming a durable infrastructure business rather than a volume-dependent liquidity desk with optional adjacencies.'
