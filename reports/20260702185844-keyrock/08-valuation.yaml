- id: financing-structure-and-exit-readiness
  title: Financing structure, structure risk, and exit readiness
  body: The current financing context improves confidence in Keyrock's strategic relevance but not in investor economics. The company says the new money will reinforce the balance sheet and fund acquisitions, and the BlockFills purchase shows management is already using that optionality to consolidate distressed assets. That can be opportunistic and value accretive, yet it also raises integration risk because BlockFills entered Chapter 11 with liabilities that exceeded assets by a wide margin. The larger issue is structure opacity. Public evidence does not identify the exact amount closed, any secondary component, liquidation preferences, anti-dilution protections, or board rights. Those missing terms matter more than the headline valuation because they determine whether common-equity upside is actually investable. Exit readiness is similarly unproven. No retained public source showed an IPO filing, banker mandate, or sale process. The prudent reading is that Keyrock is financing for expansion,
    not signaling a near-term liquidity event.
