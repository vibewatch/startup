- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: regulated institutional bridge'
    - MiCA and FCA progress support a more institutionally legible platform than many crypto-native peers.
    - Move more positive if passported revenue and UK client wins are disclosed.
  - - 'Thesis: broad product stack'
    - Market making, OTC, options, onchain liquidity, and asset management widen monetization paths.
    - Need segment revenue to prove breadth is monetized rather than merchandised.
  - - 'Thesis: expansion beyond spread capture'
    - Turing and fija extend Keyrock into asset management and onchain infrastructure.
    - Upgrade if AUM, fee rates, and onchain client adoption are disclosed.
  - - 'Thesis: fresh strategic validation'
    - SC Ventures and Ripple backing confirm external confidence during a softer funding environment.
    - Confidence increases if the round closes cleanly near the upper size expectation.
  - - 'Anti-thesis: valuation opacity'
    - Exact closed proceeds, share price, preferences, and board rights are still undisclosed.
    - Upgrade only after full financing documents are reviewed.
  - - 'Anti-thesis: market-volume dependence'
    - February and Q1 2026 centralized volumes were down, which can compress a market maker's revenue power.
    - Risk falls if management proves more recurring fee revenue or low volume elasticity.
  - - 'Anti-thesis: counterparty and solvency risk'
    - Keyrock's own risk disclosure highlights unsecured-claim and loss-allocation risk.
    - Require control evidence, balance-sheet proof, and clean legal protections.
  - - 'Anti-thesis: execution risk from distressed M&A'
    - BlockFills adds assets and client access, but bankruptcy integration can absorb management bandwidth and carry liabilities.
    - Comfort improves only after client retention and liability ring-fencing are documented.
  notes: Rows pair the best underwriting reasons with the strongest price-sensitive counterarguments so the recommendation does not drift into a generic quality score.
