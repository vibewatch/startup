tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision item
  - Current stance
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Strategic relevance is credible, but price support is weaker than company-quality signals because current financials and terms are undisclosed.
    - Diligence now, but do not underwrite the headline mark as a buy.
  - - Confidence
    - medium
    - The round, regulatory progress, and comp frame are real, yet revenue and cap-table disclosure are missing.
    - Use broad ranges and avoid precise multiple math.
  - - Risk rating
    - high
    - Market-volume sensitivity, structure opacity, counterparty/solvency caveats, and acquisition integration risk remain material.
    - Require explicit kill triggers and downside protections.
  - - Valuation stance
    - stretched
    - The price is plausible versus fresh private comps, but public evidence does not yet prove enough earnings quality or term cleanliness to call it fair.
    - Prefer discount or stronger terms before upgrading the view.
  - - Entry discipline
    - price-sensitive only
    - A clean close, audited economics, and disclosed preferences are required before moving from research-more to buy.
    - Reject narrative-only underwriting.
  - - Return posture
    - option value, not core underwrite
    - Upside depends on MiCA/FCA-led monetization, AWM scale, and onchain expansion proving durable fee revenue.
    - Treat upside as conditional rather than bankable.
  notes: Recommendation is intentionally price-sensitive; absent financial and structural disclosure, the valuation call stays range-based rather than formulaic.
