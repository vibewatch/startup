- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Publicly observable 2020-2026 private marks and public market-structure analogs relevant to crypto liquidity infrastructure as of the 2026 run date, not a full banker comp set.
  columns:
  - Comparable
  - Metric / mark
  - Relevance to Keyrock
  - Limitation
  rows:
  - - Keyrock
    - 2026 Series C at $1.1B headline valuation; rolling close and undisclosed exact amount.
    - Direct underwriting object and freshest private mark.
    - No public financials or full term sheet.
  - - GSR
    - May 2026 strategic investment above $1B; first external strategic shareholder.
    - Closest fresh private comp for institutional crypto-liquidity infrastructure.
    - Current revenue, round size, and terms are also mostly private.
  - - Wintermute
    - 2021 $20M Series B; scaled liquidity across almost 50 exchanges.
    - Validates that scale in crypto market making can attract venture capital and RFQ/OTC expansion.
    - No disclosed valuation and pre-FTX cycle vintage.
  - - B2C2 / SBI
    - Strategic-bank acquisition and OTC volumes reportedly quadrupling after integration.
    - Shows strategic-buyer value for institutional liquidity rails.
    - Acquisition economics and current standalone valuation are not public.
  - - Amber Group
    - 2022 $200M Series B+ at $3B valuation.
    - Upper-cycle reference for a broader digital-asset platform.
    - Older bull-cycle mark with a wider consumer and platform mix.
  - - HashKey Group
    - 2024 Series A of nearly $100M at >$1.2B pre-money.
    - Supports unicorn pricing for regulated digital-asset infrastructure in Asia.
    - Exchange and regulated-financial-services mix differs from Keyrock.
  - - Flow Traders
    - 2025 total income €480.5M and net profit €133.6M in a public liquidity business.
    - Useful profitability and capital-intensity analog for listed liquidity provision.
    - Primarily an ETP and broader market-making firm, not a pure crypto desk.
  - - Virtu Financial
    - Public market value about $3.54B and explicit market-making risk factors.
    - Anchors how public markets price diversified electronic market-making risk.
    - Much larger, audited, and multi-asset versus Keyrock.
  - - Coinbase / Nasdaq / CME
    - Public market caps of roughly $43.6B, $47.9B, and $98.9B respectively.
    - Frame ceiling value for disclosed market-structure and exchange franchises.
    - Too broad to imply a direct private multiple for Keyrock.
  - - 2026 volume backdrop
    - February centralized volume fell 2.41%; Q1 exchange volume fell 32% QoQ.
    - Explains why private liquidity valuations need a cyclical discount.
    - Exchange volume is not the same as Keyrock revenue.
  notes: Comparable values are heterogeneous and intentionally not collapsed into a single revenue multiple because Keyrock does not disclose the denominator required for that math.
