  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-c-terms
    missingEvidence: Signed term sheet, cap table, liquidation waterfall, anti-dilution, and any secondary component for the Series C.
    whyItMatters: Without the security terms, headline valuation cannot be translated into actual downside protection or common-equity upside.
    diligencePath: Request final financing documents and model investor returns through the post-close cap table.
    relatedQuestionRefs:
    - QV006
    - QV033
    relatedTableRefs:
    - TV005
    - TV007
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Audited 2025 and year-to-date 2026 revenue, gross margin, EBITDA, cash, debt, and trading-capital usage.
    whyItMatters: The valuation call depends on whether Keyrock is a profitable infrastructure business or primarily a volume-sensitive trading desk.
    diligencePath: Review audited accounts, management accounts, and treasury or risk packs with finance leadership.
    relatedQuestionRefs:
    - QV009
    - QV034
    relatedTableRefs:
    - TV001
    - TV007
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top customer, venue, and counterparty concentration plus retention and credit exposure data.
    whyItMatters: Scale signals are less valuable if revenue or collateral is concentrated in a small set of accounts.
    diligencePath: Request customer-cohort data, concentration schedules, and anonymized counterparty exposure reports.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV007
  - type: missing-source
    severity: material
    topic: awm-and-onchain-monetization
    missingEvidence: AUM, fee schedules, client adoption, and product-level revenue for AWM and onchain offerings.
    whyItMatters: These adjacencies are the main reason to pay a premium above a pure market-making valuation, yet public evidence does not show economics.
    diligencePath: Review product P&Ls, client wins, and pipeline conversion for Turing and fija-linked offerings.
    relatedQuestionRefs:
    - QV010
    - QV032
    relatedTableRefs:
    - TV002
    - TV007
  - type: missing-source
    severity: material
    topic: blockfills-integration
    missingEvidence: Assumed liabilities, retained clients, integration timeline, and synergy or capital requirements for BlockFills.
    whyItMatters: Distressed M&A can either add accretive scale or import hidden liabilities and execution drag.
    diligencePath: Review bankruptcy purchase agreement, liability schedule, and post-close integration dashboard.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV006
    - TV007
  - type: missing-source
