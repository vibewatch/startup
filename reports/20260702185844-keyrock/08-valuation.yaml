- id: comparable-frame-and-market-structure-analogs
  title: Comparable frame and market-structure analogs
  body: 'The comp set supports range-setting, not false precision. The closest fresh private anchor is GSR: CoinDesk and SC Ventures both place GSR above a $1 billion valuation in May 2026, which validates that institutional crypto-liquidity firms can still attract unicorn pricing when a strategic bank buyer is involved. Amber''s 2022 $3 billion round and HashKey''s 2024 $1.2 billion-plus pre-money show where better market windows or exchange-adjacent ecosystems have cleared historically, but those are cycle- and model-specific. Wintermute and B2C2 help more with model shape than with exact price, because Wintermute disclosed a $20 million Series B without a valuation while B2C2 demonstrates strategic-buyer value through SBI ownership and volume lift. Public analogs such as Flow Traders, Virtu, CME, Coinbase, and Nasdaq matter for discipline: they show that scaled liquidity and market-structure businesses can be valuable, but they are also far larger, audited, and structurally broader than
    Keyrock. That difference argues for a cautious private-market discount, not for copying public multiples.'
