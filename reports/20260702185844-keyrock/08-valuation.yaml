- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current financials
    - Audited 2025 and year-to-date 2026 revenue, gross margin, EBITDA, cash, debt, and trading capital.
    - Determines whether the unicorn mark is supported by real earning power.
    - CFO data room and auditor call.
  - - Cap table and terms
    - Share price, liquidation preferences, anti-dilution, board rights, side letters, and any secondary component.
    - Transforms headline valuation into actual investor economics.
    - Legal review of financing documents.
  - - Revenue quality
    - Service-line mix across market making, OTC, options, onchain, AWM, and any advisory revenue.
    - Separates durable fee streams from volume-dependent trading income.
    - Quarterly segment bridge and management-account review.
  - - Customer concentration
    - Top customers, venue mix, retention, and credit exposure.
    - A concentrated book can make scale signals misleading.
    - Counterparty concentration pack and anonymized customer cohort data.
  - - Regulatory economics
    - Capital, compliance, and entity requirements under MiCA, FCA, and related jurisdictions.
    - Shows whether regulatory progress adds margin or just fixed cost.
    - General counsel and compliance review by jurisdiction.
  - - AWM / onchain monetization
    - AUM, fee schedules, vault economics, and client adoption for Turing and fija-related products.
    - Validates the premium thesis beyond spread capture.
    - Product P&L and client reference calls.
  - - BlockFills integration
    - Retained clients, assumed liabilities, integration timeline, and synergy targets.
    - Determines whether distressed M&A is accretive or distracting.
    - Acquisition integration memo and liability schedule.
  - - Exit readiness
    - Board readiness, audit maturity, banker feedback, and realistic IPO or strategic-sale timeline.
    - Sets required return and holding-period assumptions.
    - Board materials, banker calls, and governance review.
  notes: These asks are the minimum evidence package required before the recommendation can move from research-more toward buy.
