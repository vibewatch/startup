- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue reset
    - Current 2025/2026 revenue power is materially below what a $1.1B mark implies.
    - Breaks the bull and base cases because breadth would not translate into monetization.
    - Reprice sharply or move to avoid.
  - - Preference overhang
    - New money or insiders hold senior liquidation, ratchet, or heavy anti-dilution protections.
    - Headline valuation would overstate common-equity upside.
    - Re-underwrite through the waterfall or pass.
  - - Adjacency non-monetization
    - AWM and onchain products remain low-revenue despite the Turing and fija deals.
    - Collapses the thesis that Keyrock is moving beyond pure spread capture.
    - Strip out premium and use a harsher market-maker discount.
  - - Volume slump
    - Centralized-exchange activity stays weak without offsetting fee revenue.
    - Pressures trading income and compresses fair value.
    - Underwrite the bear case until volumes or fee mix improve.
  - - Control or solvency issue
    - Risk controls, capital, or legal protections do not satisfy institutional diligence.
    - Confirms the risk-disclosure concerns as practical rather than theoretical.
    - Do not invest until remediated and repriced.
  - - Regulatory setback
    - Expanded activities are constrained by regulators or additional market-making scrutiny emerges.
    - Reduces option value and raises compliance costs.
    - Pause investment until perimeter and economics are clear.
  - - BlockFills integration failure
    - Client retention, liabilities, or technology integration turn adverse.
    - Adds complexity without improving earnings quality.
    - Treat acquisition strategy as a negative rather than a premium driver.
  notes: Triggers are set before management meetings so the recommendation remains disciplined if narrative momentum improves.
