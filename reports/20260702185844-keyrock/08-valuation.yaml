- id: TV005
  title: Financing / valuation context table
  columns:
  - Issue
  - Public evidence
  - Valuation implication
  - Caveat
  rows:
  - - Headline mark
    - $1.1B valuation announced on March 31, 2026.
    - Places Keyrock in the fresh unicorn tier for private crypto-liquidity firms.
    - Headline value is not the same as common-equity value.
  - - Round status
    - Officially a rolling close and not fully closed at announcement.
    - The ultimate capitalization and pricing context were still moving.
    - Creates uncertainty on final proceeds and ownership dilution.
  - - Round size
    - The Block said the total could reach $100M, but the company declined to specify the amount already raised.
    - Potentially meaningful balance-sheet reinforcement if the upper end closes.
    - No public confirmation that the full amount was completed.
  - - Use of proceeds
    - Balance-sheet strengthening, service expansion, and acquisitions were explicit uses.
    - Supports growth and option value rather than near-term liquidity.
    - Does not prove return on invested capital.
  - - Regulatory option value
    - MiCA and FCA progress improve institutional access and credibility.
    - Can justify a premium to unregulated peers if monetized.
    - The commercial conversion rate of regulation into revenue is still undisclosed.
  - - Structure opacity
    - No public share price, liquidation preference, anti-dilution, or board-right details were identified.
    - These unknowns can change real investor returns more than the headline post-money.
    - Requires direct term-sheet and cap-table review.
  notes: This table separates what is publicly known about the round from the structural items that still prevent a full underwriting.
