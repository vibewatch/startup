- id: capability-and-regulatory-comparison
  title: Capability breadth and regulatory posture
  body: Keyrock's public surface is unusually broad for a crypto-native liquidity firm. Its current official stack spans market making, OTC, onchain liquidity, options, and a new asset-and-wealth-management arm. The 2025 FCA registration and 2026 MiCA licence matter because they turn that breadth into a more institutionally legible story across the UK and EU, rather than leaving it as a pure crypto-native distribution play. Direct peers each own different strengths. GSR has a strong institutional OTC and licensing story with MAS and FCA touchpoints. B2C2 adds SBI ownership, a long-running derivatives and funding product set, and explicit institutional-only positioning. Cumberland layers DRW's multi-asset pedigree on top of deep OTC and derivatives capability. Wintermute remains broad across CeFi, OTC, and DeFi, but its own legal language is more explicit than Keyrock's about the limits of customer protections. Flow Traders, Jane Street, Virtu, and Citadel have stronger public-company or
    large-incumbent trust signals, but the retained public set points them more toward listed-product, ETF, or general liquidity relevance than toward the exact token-issuer and protocol support bundle Keyrock markets. The resulting comparison favors Keyrock when a buyer wants one provider that can bridge centralized venues, decentralized venues, and treasury or asset-management adjacency under a Europe-first regulatory narrative.
