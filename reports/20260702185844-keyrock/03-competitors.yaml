- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Regulated Europe-first posture
    - Peers can add licences or partner with regulated entities
    - Medium
    - Validate how much FCA and MiCA status changes actual customer win rates and counterparty eligibility
  - - Cross-venue breadth across CEX, OTC, and DEX
    - Breadth can be copied by larger or better-capitalized rivals over time
    - High
    - Request cohort data showing that breadth improves retention or share of wallet, not just brochure coverage
  - - Venue and market coverage
    - Exchanges and token issuers can multi-home across several market makers
    - High
    - Ask for concentration by venue, token, and top clients plus renewal or replacement history
  - - New asset-management adjacency
    - The extension may increase stickiness, but it is also new and unproven
    - Medium
    - Verify AUM, strategy uptake, and whether AWM drives cross-sell into liquidity or treasury mandates
  - - Trust after 2022–2026 failures
    - Category-wide incident history can push buyers toward public-company or bank-backed names
    - High
    - Review controls, insurance, incident history, custody flows, and regulatory exam or audit evidence
  - - DeFi and internal-build substitutes
    - AMMs and internal desks can solve some liquidity needs without an external market maker
    - Medium
    - Segment which customer jobs require bespoke human/credit workflow versus capital-efficient self-service alternatives
  notes: Severity is a competitive-underwriting judgment from retained evidence, not a quantified probability model.
