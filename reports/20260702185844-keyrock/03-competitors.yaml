tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Keyrock
    - Direct crypto-native peer
    - $72M Series B in 2022; official and third-party 2026 materials point to Series C at ~$1.1B valuation
    - Token issuers, exchanges, funds, institutions needing CEX+DEX+OTC support
    - Broad scope across market making, OTC, onchain liquidity, options, and new asset management with FCA and MiCA progress
    - Public pricing, win rates, and realized customer retention remain undisclosed
  - - GSR
    - Direct crypto-native peer
    - 10+ years in crypto; MAS MPI and UK FCA registration signals institutional scaling
    - Token issuers, exchanges, institutions, fintechs, asset managers
    - Very broad OTC stack with 200+ assets, 25 fiat currencies, and structured-derivatives capability
    - Less public evidence than Keyrock on onchain-liquidity operations or explicit EU licensing depth
  - - Wintermute
    - Direct crypto-native peer
    - $20M Series B in 2021; historical scale across almost 50 venues
    - Institutions and counterparties needing CeFi, OTC, and DeFi liquidity
    - Strong crypto-native breadth and historical spread-led pricing model
    - Official legal language is explicit that customers may not receive typical regulated protections; public hack history raises diligence burden
  - - B2C2 / SBI
    - Parent-backed direct peer
    - SBI-owned since 2020; institutional products across spot, CFDs/options, and funding
    - Banks, brokers, funds, exchanges, and professional counterparties
    - Bank-affiliated trust signal plus derivatives and funding breadth
    - Public retained set is still thin on token-issuer or protocol-level services versus Keyrock
  - - Cumberland / DRW
    - Trading-incumbent direct peer
    - Backed by DRW, with digital-asset liquidity since 2014 and 30+ years of parent trading experience
    - Institutions needing OTC, options, futures, basis, and no-prefunding workflows
    - Very strong principal-liquidity and derivatives packaging
    - US legal history with the SEC remains part of the diligence file even after dismissal
  - - Flow Traders
    - Adjacent incumbent / listed-product specialist
    - Public annual report; 630+ professionals and diversified digital-assets operation
    - Institutional and ETP-related liquidity workflows
    - Public-company reporting and strong ETP bridge credibility
    - Retained set is stronger on listed/ETP crypto than on token-issuer market making
  - - Jump Crypto
    - Adjacent builder / trading substitute
    - Large trading-and-infrastructure footprint; regulatory scar from Tai Mo Shan settlement
    - Protocols, infrastructure ecosystems, and high-end trading counterparties
    - Converts trading constraints into protocol and infrastructure builds like Pyth and Firedancer
    - Not a clean like-for-like outsourced OTC vendor; trust questions persist after Terra/UST
  - - Auros
    - Direct token-project and liquidity peer
    - Restructured successfully after FTX shock; current offering spans incubation to institutional expansion
    - Token projects needing launch, liquidity strategy, OTC, DeFi, and exchange support
    - Explicit end-to-end token lifecycle coverage and KPI-based liquidity language
    - Post-FTX restructuring history will matter to conservative counterparties
  - - Amber / HashKey
    - APAC-adjacent peer class
    - Amber raised post-FTX capital; HashKey raised nearly $100M at >$1.2B pre and holds HK licensing credentials
    - APAC institutions, HNW or wealth channels, and licensed exchange ecosystems
    - Amber adds scale in quoted markets and CeFi/DeFi reach; HashKey adds licensed exchange and compliance-first ecosystem depth
    - The class is less cleanly like-for-like than Keyrock because it mixes liquidity, wealth, and exchange infrastructure
  - - Jane Street / Virtu / Citadel
    - Incumbent cross-asset substitute class
    - Massive cross-asset liquidity balance sheets and client reach
    - Institutions, ETPs, principal-liquidity, and spread-sensitive flow
    - Can compress spreads and absorb flow through broader market-making franchises
    - Retained public set offers limited direct proof of issuer-paid token market-making mandates
  notes: Rows use public evidence only and intentionally preserve unknown realized spreads, active customer counts, and private P&L.
