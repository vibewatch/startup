- id: moat-durability-and-trust-after-failures
  title: Moat durability, substitutes, and trust after 2022–2026 failures
  body: 'Keyrock''s moat looks strongest where several advantages are bundled together: venue connectivity, onchain-liquidity tooling, regulated European access, token-issuer familiarity, and the new ability to extend from liquidity provision into asset-management workflows. Those benefits are meaningful, but they are not untouchable. DeFi concentrated-liquidity pools can solve part of the depth problem without a traditional market-maker contract. Large incumbents such as Jane Street, Virtu, Flow Traders, and Citadel can pressure spreads or absorb institutional flow in adjacent listed-product or principal-liquidity channels. Internal execution remains viable for sophisticated buyers willing to own 24/7 market risk and compliance themselves. Trust also matters more after the industry''s 2022–2026 shocks. Wintermute''s DeFi hack, Tai Mo Shan''s Terra settlement inside the Jump orbit, Auros''s FTX-era restructuring, and Amber''s FTX-related recap all remind counterparties that operational resilience
    and legal posture are competitive variables, not back-office details. The best-supported underwriting view is therefore balanced: Keyrock has a credible differentiation wedge in regulated breadth and cross-venue execution, but its moat is moderate because pricing is opaque, market-making can commoditize, and several substitute classes can attack the job from different angles.'
