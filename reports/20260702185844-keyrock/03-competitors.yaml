- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider / substitute
  - public price or contract signal
  - included capabilities evidenced
  - unknowns preserved
  - implication
  rows:
  - - Keyrock
    - No public spread or retainer card found
    - OTC, market making, onchain liquidity, options, asset management
    - Realized spreads, issuer-retainer structures, and rebates unknown
    - Keyrock sells breadth and regulated execution rather than transparent list pricing
  - - Wintermute
    - 2021 source said no OTC fees; economics likely spread-led
    - CeFi, OTC, DeFi, planned RFQ and derivatives expansion
    - Current realized pricing and 2026 commercial terms unknown
    - Can compete aggressively on flow capture without publishing a durable list-rate card
  - - GSR
    - Minimum trade value public; price card not public
    - 200+ assets, 25 fiat, OTC UI/API, structured derivatives
    - Realized spreads, credit terms, and rebates unknown
    - Breadth is visible; economics remain negotiated
  - - B2C2
    - No public list spread found
    - Spot, CFDs/options, funding, GUI/API, 75+ currencies
    - Loan economics, option premiums, and client-specific pricing unknown
    - Packaging breadth may matter more than list pricing for institutions
  - - Cumberland
    - Explicitly says no fees; principal price embeds economics
    - Spot, options, futures, NDFs, post-trade settlement, multiple access channels
    - Exact spread construction and client-by-client economics unknown
    - Useful proof that principal desks can compete on all-in price rather than fee line items
  - - Amber
    - Claims transparent and competitively priced offerings
    - Market making, advisory, issuance support, CeFi/DeFi liquidity
    - No public schedule for spreads, retainers, or incentives
    - Suggests commercial competition, but not enough to benchmark Keyrock numerically
  - - DeFi LPs / AMMs
    - Protocol fee tiers are public, but LP economics vary by range and inventory risk
    - Concentrated liquidity can deepen trading around target price bands
    - Impermanent-loss burden, rebalancing labor, and protocol-specific cost vary widely
    - A substitute for some pairs, but not a full replacement for negotiated OTC and issuer support
  - - Internal build / exchange-direct
    - No public price card; economics internalized
    - Custom execution logic, inventory management, and direct venue relationships
    - Staffing, capital, surveillance, and 24/7 operational cost private
    - Viable only when a buyer can justify building its own liquidity stack
  notes: The table preserves unknown realized economics rather than inventing comparable spreads; the public record is strongest on packaging, not on negotiated price.
