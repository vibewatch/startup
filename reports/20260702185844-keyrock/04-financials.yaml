- id: traction-and-unit-economics-proxies
  title: Public traction and unit-economics proxies
  body: 'Keyrock offers more public scale evidence than public financial evidence. Official materials show a business that moved from more than 100 employees in 2022 to 170 in mid-2025, 190 by the asset-management launch, and 220 by the 2026 Series C. The company also says it operates across more than 85 exchanges and 1,400 markets, while the OTC business now advertises 10K+ daily OTC trades. Series B materials add a commercially important signal: Keyrock said trading volume tripled even while the broader market fell by 50 percent. Those datapoints support a view that the company has real volume, partner breadth, and product expansion momentum. But none of them is the same as revenue quality. There is still no public ARR, revenue run rate, gross margin, CAC payback, NRR, churn, or realized take-rate disclosure. To bridge that gap, the best available proxies come from public market-making comparables such as Virtu and Flow Traders, which show the same basic pattern: thin per-trade economics,
    dependence on scale and automation, and meaningful fixed costs in data, compensation, financing, and infrastructure.'
