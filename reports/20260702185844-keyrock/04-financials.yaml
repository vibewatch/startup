tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Market making
    - Algorithmic liquidity provision that tightens spreads and optimizes order books across venues
    - Spread capture, rebates, and retainers
    - Clearly core and long-standing; marketed across 85+ exchanges
    - Potentially high-quality if diversified, but realized economics are undisclosed
    - Provide partner contract archetypes, retained spreads, and exchange-rebate policy
  - - OTC trading
    - Principal trading relationship with execution, liquidity, and settlement bundled together
    - Quoted spread / principal mark-up
    - Live 24/7 with 10K+ OTC trades daily and wider fiat coverage
    - Likely higher-ticket and relationship-driven, but mark-up economics are opaque
    - Provide average ticket size, gross spread capture, and settlement-cost allocation
  - - Options desk
    - Custom call and put structures for hedging, treasury, yield enhancement, and payoff diversification
    - Structured-premium and risk-transfer revenue
    - Live since 2023 with institutional customization
    - Can be attractive if risk is hedged well, but inventory and capital usage are unknown
    - Provide premium revenue, hedge-cost policy, and capital-at-risk by structure
  - - Onchain liquidity
    - DEX liquidity placement and active slippage management for protocols
    - Liquidity-management fee, incentives, and strategy overlays
    - Live with TVL and execution-quality language but no fee card
    - Could blend service fees with inventory-like capital usage
    - Provide fee formula, incentive-sharing, and capital committed per program
  - - Ecosystem development / validator services
    - Strategic liquidity, technical support, validator operations, and ecosystem growth support
    - Retainer, milestone fee, validator rewards, or bundled commercial package
    - Publicly merchandised as a unified partnership layer
    - Adds services diversification but may be labor intensive
    - Separate recurring retainers from one-off engineering or grant-linked work
  - - Asset & Wealth Management
    - Absolute Alpha and Smart Beta strategies launched after Turing acquisition
    - Management fee, performance fee, or fund economics
    - Product set is public, economics are not
    - Potentially more recurring, but fee realization and AUM remain undisclosed
    - Provide AUM, fee schedule, redemption terms, and performance-fee design
  notes: Rows capture the monetization lanes visible from official materials; they do not imply disclosed revenue mix or realized contribution margin.
  enumerationScope:
    coverage: partial
    basis: This table enumerates the revenue streams publicly visible in reviewed official materials as of 2026-07-02 rather than a management-certified revenue waterfall.
