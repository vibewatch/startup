company:
  name: Keyrock
chapter:
  number: 4
  title: Financials
  summary: 'Keyrock''s public record supports a multi-line digital-asset market-infrastructure business—market making, OTC, options, onchain liquidity, ecosystem services, and now asset management—but it does not disclose the core revenue, margin, cash, or runway metrics needed for full underwriting. The strongest evidence is on financing trajectory and strategic intent: a $1.1 billion Series C led by SC Ventures in March 2026, earlier disclosed 2020 and 2022 rounds, and acquisitions aimed at balance-sheet strength and product expansion. Comparable market-maker filings suggest the model is likely capital, data, compensation, and compliance intensive, so the missing Keyrock-specific financial statements are the chapter''s main diligence blocker.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: 'Keyrock''s public file supports a diversified trading-and-infrastructure revenue model rather than a single spread-capture story. The core engine is still market making: Keyrock says it aggregates data from more than 85 exchanges, optimizes order books, tightens spreads, and provides analytics to partners. But the revenue stack now extends well beyond that base. OTC trading is positioned as a bespoke principal-trading relationship with settlement bundled into the service; the options desk sells custom structures for hedging, treasury management, and yield enhancement; onchain liquidity and ecosystem-development work add strategic-liquidity, validator, and technical-support lanes; and the 2025 asset-and-wealth-management launch adds fund-like products such as Absolute Alpha and Smart Beta. What remains missing is realized pricing. Keyrock markets every major service as tailored, and the reviewed site does not publish fee cards, spread-share formulas, management-fee schedules, or
    revenue-recognition policy. The right financial reading is therefore that monetization breadth is credible and improving, but the actual conversion from service breadth into revenue quality still depends on contract-level diligence.'
