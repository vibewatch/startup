- id: TI004
  title: Capital adequacy table
  columns:
  - Capital / liquidity item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Belgian stated capital
    - €1.383m stated capital on CBE registry
    - Medium
    - Useful legal-capital datapoint, but not cash on hand or regulatory surplus
    - Provide current unrestricted cash, regulatory capital, and entity-level excess capital
  - - Series B financing
    - US$72m disclosed in 2022
    - High
    - Sets a lower bound on historical external capital and shows prior access to growth funding
    - Provide remaining proceeds by year-end and how much funded licenses versus trading capital
  - - Series C terms
    - US$1.1bn valuation; rolling-close structure; amount not disclosed in official release
    - High
    - Important for balance-sheet support, but not enough to size current liquidity
    - Provide gross proceeds, close schedule, investor mix, and net proceeds after fees
  - - Use of funds
    - Balance-sheet strengthening, service expansion, and acquisitions
    - High
    - Signals capital is being allocated to growth and M&A, not only operating runway
    - Provide use-of-funds bridge by trading capital, hiring, compliance, and acquisitions
  - - Regulatory build-out
    - FCA, Swiss/VQF, and MiCA approvals expanded the footprint in 2024-2026
    - Medium
    - Licensing can consume legal spend, compliance staffing, and regulated-capital buffers
    - Provide annual regulatory OPEX and capital requirements by entity
  - - Acquisition burden
    - Turing acquisition in 2025 and Fija acquisition in 2026 broadened the stack
    - Medium
    - M&A may improve product breadth but can absorb cash and management bandwidth
    - Provide acquisition consideration, earn-outs, and integration-cost bridge
  - - Cash on hand
    - null
    - Low
    - Without cash the public file cannot support a runway view
    - Provide unrestricted cash, restricted cash, and liquid collateral by entity
  - - Monthly burn / runway
    - null
    - Low
    - Required to assess financing dependency and downside resilience
    - Provide monthly burn, expected runway, and management stress-case assumptions
  - - Debt / credit facilities
    - No Keyrock debt or credit-facility terms disclosed publicly
    - Low
    - Important because trading businesses often supplement equity with facilities
    - Provide all credit lines, covenants, prime-broker terms, and collateral requirements
  notes: The table separates legal-capital disclosures from true liquidity. Blank rows reflect the absence of public cash, burn, and debt data rather than missing author work.
