- id: cost-structure-capital-adequacy-and-regulatory-burden
  title: Cost structure, capital adequacy, and financing dependency
  body: 'The cost stack that matters for underwriting is visible only in fragments, but the fragments are revealing. Keyrock''s own legal, AML, and risk disclosures show ongoing spend on MLRO coverage, KYC and sanctions tooling, suspicious-activity reporting, training, and multi-entity governance. Swiss, UK, and MiCA approvals show that regulatory expansion is not peripheral; it is a core operating requirement for the company''s institutional strategy. Public market-maker filings show what that usually means financially: large brokerage and clearing outlays, expensive communication and data infrastructure, compensation-heavy trading teams, financing costs, and sizable balance-sheet usage. Flow Traders also shows how scaled market makers can need dedicated credit facilities to expand trading capital. For Keyrock specifically, the strongest capital signal is the 2026 Series C narrative: the company says the raise is for balance-sheet strengthening, service expansion, and acquisitions. What
    the public file does not disclose is the current cash bridge behind that strategy. The Belgian registry shows legal share capital and a 30 June year-end, but not usable liquidity. The NBB annual-accounts portal was also JS-dependent in this run, leaving the chapter without extractable filed statements for direct margin or runway analysis.'
