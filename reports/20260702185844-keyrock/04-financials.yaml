- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue and ARR by service line
    - Without stream-level revenue the market-making, OTC, options, and AWM mix cannot be valued or stress-tested
    - Request monthly revenue by stream for the last 24 months plus recognition policy
  - - Gross margin by stream
    - Margin quality is the core question for a trading-plus-services business
    - Request gross margin bridge with direct trading, venue, clearing, financing, compliance, and support costs
  - - Cash, burn, and runway
    - The public file cannot support a liquidity or survival view in a drawdown
    - Request current cash balance, monthly burn, runway, and downside liquidity plan
  - - Debt, credit, and collateral terms
    - Prime-broker lines or credit facilities can materially change capital adequacy
    - Request all debt schedules, covenants, borrowing bases, and collateral requirements
  - - Realized pricing and customer economics
    - Bespoke pricing is visible, but realized take rates and payback are not
    - Request sample contracts, average spread / premium capture, ACV, and CAC payback by segment
  - - Customer concentration and retention
    - Revenue durability cannot be judged without concentration and cohort behavior
    - Request top-10 customer concentration, logo retention, NRR, and churn reasons
  - - Extractable annual accounts
    - The NBB filing portal was JS-dependent during this run, leaving local filed statements unreadable
    - Retrieve annual-account PDFs or exports directly from the data room or a browser-assisted registry workflow
  notes: These are the highest-value blockers to a true underwriting model; none can be cleared by more marketing or valuation coverage alone.
  enumerationScope:
    coverage: partial
    basis: The rows list the highest-impact public financial gaps for underwriting, not every conceivable diligence request across the broader operating model.
