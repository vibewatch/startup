  evidenceGaps:
  - type: missing-source
    severity: material
    topic: series-c-proceeds
    missingEvidence: The final closed dollar amount of the rolling Series C round and any later close participants beyond the publicly named leads.
    whyItMatters: Without the final gross proceeds the chapter cannot state lifetime capital raised or infer how much fresh liquidity is actually available for balance-sheet support and acquisitions.
    diligencePath: Request the final closing memo, cap-table update, or board materials showing gross and net Series C proceeds by close date.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Monthly and trailing-12-month revenue by stream plus revenue-recognition policy for market making, OTC, options, onchain, and asset-management activities.
    whyItMatters: Without stream-level revenue the chapter cannot test revenue quality, concentration, or the extent to which newer businesses are diluting or improving economics.
    diligencePath: Request a management revenue bridge and sample customer contracts covering each major service line.
    relatedQuestionRefs:
    - QI019
    - QI026
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current unrestricted cash, restricted cash, monthly burn, runway, and any internal liquidity stress scenarios.
    whyItMatters: Runway is the central blocker to underwriting capital adequacy and next-round dependency.
    diligencePath: Request treasury reports, board materials, or monthly management accounts covering liquidity and cash burn.
    relatedQuestionRefs:
    - QI020
    - QI025
    - QI028
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-regulatory-capital
    missingEvidence: Prime-broker lines, revolving facilities, collateral arrangements, entity-level regulatory-capital requirements, and covenant packages.
    whyItMatters: Trading businesses can appear equity-rich while still being constrained by collateral haircuts, borrowing bases, or regulated-capital floors.
    diligencePath: Request the debt schedule, credit agreements, prime-broker terms, and entity-by-entity regulatory-capital calculations.
    relatedQuestionRefs:
    - QI017
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
  - type: access-blocked
    severity: material
    topic: annual-accounts-access
    missingEvidence: Extractable annual-account statements from the National Bank of Belgium consultation portal or PDF exports of the filed accounts.
    whyItMatters: Direct filed statements could materially improve confidence on revenue, profit, and balance-sheet items for the Belgian entity.
    diligencePath: Retrieve the accounts through a browser-assisted registry session or obtain PDFs directly from management or counsel.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Customer concentration, NRR, churn, ACV, realized spread or premium capture, and segment-level payback by channel.
    whyItMatters: These are the inputs needed to distinguish a durable institutional franchise from a volume-rich but economically thin trading business.
    diligencePath: Request cohort analyses, concentration schedules, and representative contract pricing from the data room.
    relatedQuestionRefs:
    - QI007
    - QI027
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
