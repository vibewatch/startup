- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / service
  - Public pricing signal
  - List vs. realized pricing
  - Discounts / unknowns
  - Source-backed implication
  rows:
  - - Market making
    - No public fee card
    - No list pricing disclosed
    - Retainer terms, spread sharing, and venue economics are undisclosed
    - Commercial model is partnership-based, but price realization is opaque
  - - OTC trading
    - Bespoke quote based on size, timing, and settlement
    - Realized only
    - No public mark-up, minimum size, or balance-sheet charge disclosure
    - Revenue likely flexes with flow quality and capital usage, not a fixed catalog fee
  - - Options desk
    - Custom premium quote by strike and maturity
    - Realized only
    - No public premium schedule or hedge-cost disclosure
    - Pricing power likely depends on structuring complexity and risk warehousing
  - - Onchain liquidity
    - No public fee card; service framed around slippage targets and TVL support
    - No list pricing disclosed
    - Capital commitment, incentive sharing, and rebalance costs are unknown
    - Economics may combine fees with protocol incentives and inventory risk
  - - Ecosystem development / validator services
    - No public fee card
    - No list pricing disclosed
    - Retainers, milestone fees, and validator reward sharing are undisclosed
    - This lane could diversify revenue but may also dilute software-like margins
  - - Asset & Wealth Management
    - Products are public; fee schedule is not
    - No list pricing disclosed
    - Management fee, performance fee, hurdle, and redemption terms are unknown
    - The product broadens monetization but cannot yet be modeled financially
  notes: The public evidence supports negotiated, quote-based, or mandate-based pricing across every major service line; no reviewed source exposes realized contracts.
