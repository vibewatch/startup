- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue / ARR
    - null
    - Low
    - Core scale indicator is not publicly disclosed for Keyrock
    - Provide current ARR, trailing-12-month revenue, and growth by service line
  - - Gross margin
    - null
    - Low
    - Needed to judge whether the mix behaves like software, trading principal, or services
    - Provide gross margin by market making, OTC, options, onchain, and AWM
  - - CAC payback
    - null
    - Low
    - Institutional go-to-market efficiency cannot be inferred from headcount alone
    - Provide sales and marketing spend, sourced pipeline, and payback by channel
  - - NRR / churn
    - null
    - Low
    - Without retention data the durability of revenue is still unknown
    - Provide logo retention, NRR, and revenue concentration by top customers
  - - Volume / activity proxy
    - Threefold trading-volume growth in the Series B period while the market shrank 50%
    - Medium
    - Shows traction even in a down market, but not monetization per unit
    - Provide revenue per venue, per market, and per client cohort
  - - Scale proxy
    - 85+ exchanges, 1,400 markets, and 10K+ daily OTC trades
    - Medium
    - Breadth can support efficient monetization if flow is diversified
    - Provide revenue split by venue class and OTC versus exchange flow
  - - Pricing-power proxy
    - Bespoke OTC and custom options pricing, no public list rates
    - Medium
    - Suggests room for negotiated economics but makes public benchmarking impossible
    - Provide average spread / premium capture and discount policy
  - - Comparable spread economics
    - Virtu says market-making profits come from large volumes and small bid-ask spreads
    - High
    - Indicates that scale and automation likely matter more than rich per-trade take rates
    - Provide Keyrock's own gross spread capture and hedge-cost bridge
  - - Comparable fixed-cost burden
    - Virtu and Flow Traders show heavy data, compensation, financing, and trading-capital needs
    - High
    - Supports a capital-intensive reading of Keyrock even without company disclosures
    - Provide Keyrock P&L by compensation, data/connectivity, financing, and compliance line
  notes: Nulls are genuine public-data gaps; the non-null rows are proxies from Keyrock disclosures and public market-maker comparables rather than Keyrock's own audited unit economics.
