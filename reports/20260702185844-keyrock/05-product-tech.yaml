- id: operating-architecture-and-delivery-model
  title: How the operating model appears to work
  body: 'Public evidence supports an operating model built around shared connectivity, pricing logic, and execution infrastructure rather than disconnected product silos. Market making is described as a unified trading layer aggregating price and liquidity data from more than 85 exchanges; the OTC desk then builds on that coverage with API execution, proprietary liquidity, and 10K-plus daily trade flow. The options surface points to the same core architecture: real-time liquidity monitoring for pricing, broad venue access, and customised structures for hedging or treasury objectives. Onchain liquidity extends the model onto DEX venues, where Keyrock says it actively manages to user-defined slippage boundaries and uses proprietary tooling to keep liquidity sustainable. Hiring signals reinforce that this is not just marketing copy. The options-engineering roles describe a Rust-native systematic options platform with automated quoting, execution, pricing, and risk controls, while the senior-data-engineer
    role describes a central data platform that normalises market, trading, and portfolio data, computes cross-exchange analytics, and treats observability, self-healing, and data quality as first-class requirements. The Deutsche Bank partnership adds another visible layer: institutional FX and payment rails for faster multi-currency settlement.'
