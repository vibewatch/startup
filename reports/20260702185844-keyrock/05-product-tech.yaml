- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Multi-venue market-data layer
    - Aggregates prices and liquidity from 85+ exchanges into a unified view for quoting and routing
    - Exchange connectivity, clean market data, normalization logic
    - Bad or stale venue data would distort books, OTC routes, and options pricing.
  - - Market-making algorithms
    - Optimise order books, monitor price discrepancies, and maintain 24/7 quoting
    - Low-latency execution, venue health, inventory discipline
    - Without disclosed hedging logic, outside reviewers cannot test risk-adjusted performance.
  - - OTC execution and settlement layer
    - Combines traders, API execution, liquidity, settlement, and route selection
    - Counterparty onboarding, API reliability, payment rails, and compliance checks
    - Throughput claims are public, but operational resilience and exception handling are not.
  - - Options pricing and execution stack
    - Rust-native platform for automated quoting, execution, pricing, and risk-control workflows
    - Volatility models, market-data workflows, low-latency systems, exchange connectivity
    - No public model-governance or collateral-management detail is available.
  - - Onchain LP and vault layer
    - Manages DEX liquidity, slippage bounds, impermanent-loss tradeoffs, and fija vault infrastructure
    - Protocol integrations, smart contracts, wallet permissions, and liquidity capital
    - Smart-contract and front-end risks are acknowledged, but public technical assurance is thin.
  - - Data platform and analytics
    - Normalises market, trading, and portfolio data; computes spreads, VWAP-at-depth, and microstructure analytics
    - Streaming stack, time-series stores, lakehouse design, observability, data contracts
    - Feed failures or schema drift would directly degrade execution and risk monitoring.
  - - Settlement and FX rails
    - Deutsche Bank adds multi-currency accounts and FX services for OTC and market-making operations
    - Banking partner availability, regional regulation, treasury workflows
    - A banking dependency introduces partner concentration and service-continuity risk.
  - - Control and regulatory layer
    - MiCA, FCA, AML/CFT, privacy, and disclosure controls shape who can be onboarded and where services can scale
    - Entity structure, jurisdictional approvals, monitoring, sanctions, and legal updates
    - Regulatory posture is a strength, but also a core operating dependency for European growth.
  notes: Architecture rows combine explicit public statements with cautious inference from hiring signals; they do not imply full public documentation for each internal subsystem.
