- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - MiCA licence
    - Publicly announced in June 2026
    - EU passporting through Keyrock FR SAS with explicit security/transparency language
    - Need direct licence terms, activity scope, and supervisory reporting expectations.
  - - FCA registration
    - Publicly announced in June 2025
    - Supports UK institutional market-making and OTC activity
    - Need register extract and exact permitted or excluded activities.
  - - AML/CFT framework
    - Public and explicit
    - Client identification, due diligence, sanctions screening, suspicious-activity reporting, termination rights
    - No public detail on monitoring tooling, escalation thresholds, or audit cadence.
  - - Privacy & complaint notice
    - Public and detailed
    - Operational, regulatory, reporting, candidate, and client data processing with formal rights path
    - No public mapping of product telemetry retention or region-by-region transfer controls.
  - - Risk disclosure / solvency language
    - Public and unusually explicit
    - Third-party failure, smart-contract, regulatory, and unsecured-credit exposure are all acknowledged
    - This is disclosure, not the same as evidence of mitigation or insurance.
  - - Institutional reporting / transparency promise
    - Public but high level
    - Market-making page promises insights and statistics on demand; OTC and MiCA copy emphasize transparency
    - No sample dashboards, SLA terms, uptime history, or status page are public.
  - - Security assurance artefacts
    - Not retained publicly in this corpus
    - Would normally include SOC, ISO, pen tests, incident history, or trust-center material
    - Major diligence gap for a firm promising institutional-grade execution.
  notes: The public trust surface is stronger on regulation and risk disclosure than on independent assurance artifacts or operational telemetry.
