- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Keyrock solution
  - Measurable benefit
  - Limitation
  rows:
  - - Improve exchange liquidity for a listed asset
    - Venue or issuer manages fragmented books and weak two-way depth
    - Algorithmic market making with unified quotes across 85+ exchanges
    - Tighter spreads, deeper books, and 24/7 pricing with trading insights on demand
    - No public fill-rate or spread-improvement benchmark by client cohort.
  - - Execute institutional block trades
    - Counterparty must source liquidity, route, and settle across several venues
    - OTC desk combines traders, proprietary liquidity, API execution, and settlement in one relationship
    - 10K+ daily OTC trades claimed with lower operational overhead
    - No public sample of post-trade reporting, limits, or counterparty onboarding SLAs.
  - - Hedge treasury or enhance yield with options
    - Institution needs bespoke terms rather than listed vanilla contracts
    - Custom options with any strike and maturity for hedging, yield, treasury, or payoff diversification
    - 24/7 settlement language and real-time liquidity-based pricing inputs
    - No public disclosure of margining, collateral, or model-governance process.
  - - Launch or stabilize an onchain market
    - Protocol struggles with slippage, shallow TVL, and fragmented DEX activity
    - Data-led DEX liquidity strategy with slippage-bound management and active LP operations
    - Claimed lower execution costs, deeper liquidity, and lower impermanent loss
    - No chain-specific performance or smart-contract assurance metrics are public.
  - - Grow an ecosystem beyond liquidity alone
    - Foundation needs treasury alignment, technical guidance, and decentralisation support
    - Strategic liquidity, engineering support, validator-node setup, and reward-channel design
    - Faster early liquidity formation and stronger network participation incentives
    - Public proof of long-term production support is still thin.
  - - Offer algorithmic digital-asset exposure
    - Allocator wants institutional strategies rather than self-directed trading
    - Absolute Alpha and Smart Beta funds plus quant-led asset-management division
    - Risk-adjusted and drawdown-aware positioning are core marketing hooks
    - No audited returns, fees, or AUM disclosures are public.
  - - Accelerate multi-currency settlement for global flow
    - Liquidity provider faces FX and settlement friction across regions
    - Deutsche Bank multi-currency accounts and integrated FX support OTC and market-making operations
    - Improved settlement times across EMEA, APAC, and LATAM are the stated outcome
    - Need operational evidence of actual bank-rail usage and outage handling.
  notes: Benefits are kept to source-backed language; rows separate public workflow claims from the still-private operating evidence needed for underwriting.
