chapter:
  number: 5
  title: Product & Technology
  summary: 'Keyrock''s public product surface supports a real multi-line digital-asset infrastructure business: algorithmic market making, API-enabled OTC, custom options, onchain liquidity, ecosystem support, and a newer quant asset-management arm are all evidenced by official service pages, acquisitions, regulatory announcements, and engineering hiring. The strongest technical signals are multi-venue connectivity, a Rust-native options stack, and a modern data platform, while the biggest gaps are still first-party API / status transparency, execution-quality metrics, and private risk-control detail.'
sections:
- id: product-scope-and-module-map
  title: What Keyrock actually delivers
  body: 'Keyrock no longer presents itself as a single spread-capture market maker. The official surface now reads like a modular digital-asset liquidity stack: exchange market making, OTC block trading, custom options, onchain liquidity, ecosystem development, and a newer asset-and-wealth-management arm all appear as distinct offers. That breadth matters because the same buyer can approach Keyrock as a token issuer needing launch liquidity, an exchange needing tighter books, an institution needing OTC execution and FX rails, or an allocator seeking quantified exposure and hedging tools. The module map is also more concrete than generic crypto-finance marketing. Each public service page describes a specific workflow outcome—order-book optimisation, API-driven OTC execution, custom strike-and-maturity options, DEX slippage management, validator-node support, or algorithmic wealth strategies. The strategic extension path is equally explicit: the Turing acquisition added a regulated fund-management
    shell and systematic strategies, while fija added vault technology and onchain distribution infrastructure. The result is a credible full-service product thesis, albeit one still backed more by company-authored descriptions than by customer-level production metrics.'
