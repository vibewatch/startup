tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Exchange market making
    - Token issuers, exchanges, institutional venues
    - Core / scaled
    - 85+ exchange aggregation, 24/7 pricing, on-demand insights, transparent book-management pitch
    - Need independent execution-quality and market-share data by venue.
  - - OTC trading desk
    - Institutions, treasury teams, qualified counterparties
    - Core / scaled
    - Single relationship for liquidity, execution, settlement, API flow, and 10K+ daily trade claim
    - Need counterparty list, custody flows, and post-trade reporting samples.
  - - Options desk
    - Institutions, token foundations, treasury managers
    - Maturing but specialized
    - Custom strikes/maturities, treasury and hedging use cases, dedicated Rust-native engineering roles
    - Need production volumes, margining process, and clearing or settlement architecture.
  - - Onchain liquidity
    - Protocols, token issuers, DEX ecosystems
    - Scaled / growing
    - Data-led DEX strategy, slippage-bound management, impermanent-loss reduction pitch, 1,400+ managed markets claim
    - Need chain-by-chain coverage, smart-contract controls, and actual TVL retention data.
  - - Ecosystem development
    - Foundations, L1/L2 teams, early ecosystems
    - Maturing / differentiated
    - Strategic liquidity plus technical guidance, bottleneck fixing, validator-node operations, and treasury alignment
    - Need named deployments and proof of engineering involvement beyond marketing.
  - - Asset & wealth management
    - Institutions and private investors
    - Newer line / institutionalizing
    - Absolute Alpha and Smart Beta strategies plus Turing AIFM structure and quant unit
    - Need audited track records, fund terms, and strategy capacity limits.
  - - Onchain distribution / vault infrastructure
    - Investors using onchain strategies
    - Emerging but strategically important
    - fija vault technology internalized to simplify backend of onchain strategies and widen distribution
    - Need technical docs on vault design, permissions, and failure handling.
  notes: Module statuses reflect the amount of retained public evidence, not an internal revenue ranking or attach-rate view.
