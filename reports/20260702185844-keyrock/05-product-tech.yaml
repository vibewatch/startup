  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-api-and-status-surface
    missingEvidence: First-party API reference, onboarding guide, sandbox or test-environment material, and a public status / incident-history surface.
    whyItMatters: Institutional trading infrastructure is hard to diligence without clear integration, support, and reliability documentation.
    diligencePath: Request client onboarding packs, API specs, status-history exports, and a sample production support workflow from the product and engineering teams.
    relatedQuestionRefs:
    - QE015
    - QE021
    - QE024
  - type: private-evidence-only
    severity: blocking
    topic: execution-quality-metrics
    missingEvidence: Venue-level spread-improvement data, fill-quality metrics, OTC rejection / exception rates, and module-level client usage by product line.
    whyItMatters: Keyrock's differentiation rests on execution quality and breadth, but public materials do not quantify the outcomes that matter most to underwriting.
    diligencePath: Request KPI dashboards, monthly service reviews, and customer-level case studies segmented by market making, OTC, options, and onchain liquidity.
    relatedQuestionRefs:
    - QE003
    - QE006
    - QE025
  - type: private-evidence-only
    severity: material
    topic: risk-capital-and-hedging
    missingEvidence: Inventory limits, hedging rules, collateral and margin processes, custody topology, and counterparty exposure framework.
    whyItMatters: The business takes direct market and operational risk across OTC, options, and onchain products, so balance-sheet controls materially affect downside protection.
    diligencePath: Request the risk-policy pack, treasury / collateral procedures, counterparty matrix, and evidence of board or risk-committee review cadence.
    relatedQuestionRefs:
    - QE005
    - QE013
    - QE020
    - QE025
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Independent security assurance artifacts such as SOC 2, ISO 27001, penetration-test summaries, BCP/DR policy, and incident postmortems.
    whyItMatters: Regulatory posture is helpful but does not substitute for operational-security evidence in a 24/7 trading infrastructure business.
    diligencePath: Request the trust-center package, latest audits or assessments, penetration-test summaries, and incident-response runbooks.
    relatedQuestionRefs:
    - QE018
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-adoption-and-performance
    missingEvidence: Product-line revenue mix, client counts by module, options volume, AWM AUM, onchain TVL retention, and ecosystem-support conversion metrics.
    whyItMatters: The product map is broad, but investors need to know which modules are actually commercial at scale and which are still adjacency bets.
    diligencePath: Request product P&Ls, pipeline / customer concentration by module, strategy AUM and performance summaries, and cohort data for onchain programs.
