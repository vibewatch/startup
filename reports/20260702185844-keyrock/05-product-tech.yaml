- id: roadmap-maturity-and-technical-verdict
  title: Roadmap, maturity, and technical verdict
  body: 'The 2024-2026 trail shows a business expanding from spot-liquidity roots into adjacent infrastructure rather than randomly accumulating products. Deutsche Bank added transactional FX support in late 2024; 2025 brought FCA registration and the formal launch of asset and wealth management via Turing Capital; February 2026 brought fija vault technology for onchain distribution; March 2026 added Finery Markets quote-stream connectivity and growth capital from SC Ventures; April 2026 showed Keyrock using Ethereum tokenized debt for its own financing; and June 2026 added MiCA passporting. That sequence makes the product story more believable: connectivity, regulation, treasury rails, onchain tooling, and quant talent all move in the same direction. Differentiation appears strongest in three places: European regulatory posture, the breadth of liquidity modalities under one roof, and the visible quantitative-engineering stack around Rust, low-latency trading, and data infrastructure. The
    main caveat is evidence asymmetry. Public materials make the architecture and ambition plausible, but they do not yet disclose module-level adoption, execution-quality KPIs, hedging methodology, or deeper assurance artefacts. The technical verdict is therefore positive on scope and infrastructure maturity, but still conditional on private diligence into controls, client outcomes, and balance-sheet risk management.'
