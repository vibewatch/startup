- id: trust-controls-and-explicit-gaps
  title: Trust, security, privacy, and compliance surface
  body: 'Keyrock’s public control surface is stronger on regulatory posture and risk disclosure than on classic SaaS trust-center depth. On the positive side, the firm publishes an AML/CFT framework that explicitly covers client verification, due diligence, sanctions screening, suspicious-activity reporting, and termination rights; it also publishes a privacy notice that frames data handling under EU privacy law and spells out complaint and rights processes. The regulatory story is unusually important for this category and relatively well evidenced: FCA registration supports UK institutional market-making and OTC activity, while the June 2026 MiCA licence through the French entity gives the group a cleaner EU passporting path than most private crypto-liquidity peers can show publicly. The risk-disclosure surface is also candid. Keyrock warns about third-party exchange and DeFi failures, smart-contract bugs, front-end compromise, regulatory seizure, and even Keyrock insolvency with unsecured-credit
    exposure. The downside is that this surface stops short of full trust-center transparency. The retained public corpus does not expose first-party API documentation, sandbox details, status pages, incident history, or certification evidence such as SOC 2 or ISO 27001. For a firm promising institutional-grade execution, those missing layers remain a real diligence gap.'
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE033
