  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-making-revenue-pool
    missingEvidence: Audited revenue split across token mandates, exchange-liquidity programs, OTC/options, and
      infrastructure or data services.
    whyItMatters: Without a revenue bridge, adjacent capital pools cannot be converted into a defensible SOM or
      valuation case.
    diligencePath: Request a management data-room schedule showing gross revenue, gross profit, and renewal rates
      by product line and client segment.
    relatedQuestionRefs:
    - QM010
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: capital-efficiency
    missingEvidence: Desk-level inventory turnover, hedge costs, rebate capture, capital usage, and risk limits
      by venue and asset class.
    whyItMatters: Capital intensity determines whether market-growth narratives translate into attractive unit economics.
    diligencePath: Request venue-level P&L bridges, inventory reports, and treasury or risk-policy materials for
      the trading business.
    relatedQuestionRefs:
    - QM017
    - QM021
  - type: private-evidence-only
    severity: material
    topic: client-concentration
    missingEvidence: Customer concentration and contract structure across exchanges, foundations, ETF or treasury-product
      sponsors, and protocols.
    whyItMatters: A concentrated client base could make market share look stronger than it is and raise renewal
      or counterparty risk.
    diligencePath: Request top-20 client gross-profit mix, term length, churn history, and any performance-linked
      pricing terms.
    relatedQuestionRefs:
    - QM011
    - QM012
    - QM014
  - type: conflicting-data
    severity: minor
    topic: current-rwa-sizing
    missingEvidence: A normalized bridge explaining the date, asset-class, and inclusion differences across CoinGecko,
      Cointelegraph or DeFiLlama, a16z, and RWA.xyz measures.
    whyItMatters: Preserving contradictory public estimates is better than false precision, but valuation work still
      needs a harmonized bridge.
    diligencePath: Rebuild the current RWA market from product-level balances and normalize by observation date,
      included instruments, and whether derivatives are counted.
    relatedQuestionRefs:
    - QM008
    - QM025
    relatedTableRefs:
    - TM002
