- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Institutional ETP adoption and treasury-style wrappers
    - Driver
    - Current
    - Regulated wrappers enlarge the pool of institutions that need underlying liquidity, hedging, and price discovery.
    - Quantify revenue that depends on ETF, treasury-product, or other wrapper-related flow rather than retail token
      flow.
  - - Stablecoin scale and settlement utility
    - Driver
    - Current to medium term
    - A larger onchain cash leg increases demand for routing, collateral, and two-sided liquidity across venues.
    - Request stablecoin-pair volume mix, settlement-chain mix, and revenue contribution from cash-leg routing.
  - - Tokenized RWA and Treasury growth
    - Driver
    - Current
    - More tokenized funds and treasuries create new products that need secondary liquidity and market-access support.
    - Request pipeline of tokenized-asset clients and the economic model used for treasury-product mandates.
  - - DEX share gains and onchain migration
    - Driver
    - Current to medium term
    - More spot and derivatives activity on DEXs creates demand for cross-venue and onchain liquidity operations.
    - Measure revenue and capital committed to DEX liquidity versus centralized venues.
  - - MiCA/CASP authorization and market-abuse controls
    - Constraint and driver
    - Current
    - Regulatory clarity helps scaling, but compliance, recordkeeping, governance, and conduct requirements raise
      fixed costs.
    - Map each service line to MiCA, MiFID, U.S. securities, and commodity-rule treatment by jurisdiction.
  - - Capital intensity and inventory risk
    - Constraint
    - Persistent
    - Market makers must commit balance sheet, hedge volatility, and manage funding, so not all adjacent capital
      pools monetize equally.
    - Request inventory turnover, venue-level risk limits, and capital usage by asset class.
  - - Counterparty, venue, and trust risk
    - Constraint
    - Persistent
    - Exchange failures, non-compliant venues, and uneven venue quality limit where institutional flow can safely
      concentrate.
    - Review top-20 venue exposures, collateral policy, and any concentration caps by venue or counterparty.
  - - Public fee-pool opacity
    - Constraint
    - Current
    - Without contract pricing, spread capture, and rebate data, TAM can be narrated but SOM cannot be defended.
    - Request revenue split by token mandates, exchange programs, OTC/options, and institutional infrastructure
      clients.
  notes: Driver timing and implications are analytical synthesis based on cited sources. Diligence asks identify
    the private data needed to convert public market structure into investable economics.
