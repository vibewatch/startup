runDate: '2026-07-02'
company:
  name: Keyrock
chapter:
  number: 2
  title: Market Analysis
  summary: 'Keyrock operates in a narrower and more investable market than headline crypto market cap implies: digital-asset
    liquidity provision across exchanges, token issuers, OTC/options, and onchain venues, supported by institutional
    trading infrastructure. Public sources show enormous adjacent capital pools in crypto ETFs, stablecoins, and
    tokenized RWAs, but they do not isolate the global revenue pool for market-making mandates, so TAM must be framed
    as a constrained bridge from market structure rather than a single headline figure.'
sections:
- id: market-boundary
  title: 'Market boundary: paid liquidity infrastructure, not all of crypto'
  body: 'The right market boundary for Keyrock is not ''all crypto'' and not just generic exchange trading volume.
    It is the paid infrastructure that keeps digital assets tradable across centralized and decentralized venues:
    exchange market making, token-liquidity mandates, OTC and options support, execution-quality data, and the routing,
    hedging, and inventory management required to keep prices continuous. Keyrock''s own positioning spans market
    making, options, OTC, and DEX liquidity across centralized and decentralized venues, which is much narrower
    than the total crypto economy but broader than a single token-launch service. CoinDesk Data''s order-book and
    trade-data materials explain why this market exists: liquidity is dispersed across many exchanges, best execution
    is hard, and markets run 24/7 with higher volatility than traditional assets. Included spend therefore sits
    where a buyer is paying for tighter spreads, deeper books, more reliable execution, launch support, or institutional-grade
    market access. Excluded spend includes passive token holdings, custody balances, wallet software, mining, and
    most tokenized or stablecoin balances that never require outsourced secondary-market support. That distinction
    matters because crypto headlines quote trillions in market cap, but market makers monetize turnover, fragmentation,
    and risk warehousing rather than idle balances.'
