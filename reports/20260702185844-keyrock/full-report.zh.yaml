      - number: '5.3'
        title: 信任、安全、隐私与合规面
        blocks:
          - type: paragraph
            body: >-
              Keyrock 的公开控制面在监管姿态和风险披露上强于经典 SaaS 信任中心深度。积极一面是，公司发布了 AML/CFT 框架，明确覆盖客户验证、尽职调查、制裁筛查、可疑活动报告和终止权；公司也发布隐私通知，用
              EU 隐私法框定数据处理，并写明投诉和权利流程。监管故事对这一品类异常重要，且证据相对充分：FCA 注册支持 UK 机构做市和 OTC 活动；2026 年 6 月通过法国实体获得 MiCA
              牌照，使集团拥有比多数私有加密流动性同业更清晰的 EU 通行路径。风险披露面也坦率。Keyrock 警告第三方交易所和 DeFi 失败、智能合约漏洞、前端被攻陷、监管扣押，甚至 Keyrock
              破产导致无担保信用敞口。缺点是，这个披露面仍不到完整信任中心透明度。留存公开语料没有展示第一方 API 文档、沙盒细节、状态页、事故历史，也没有 SOC 2 或 ISO 27001
              等认证证据。对于一家承诺机构级执行的公司，这些缺失层仍是真实尽调缺口。
