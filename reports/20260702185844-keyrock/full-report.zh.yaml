  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：付费流动性基础设施，不是整个加密市场
        blocks:
          - type: paragraph
            body: >-
              Keyrock 的正确市场边界不是“整个加密市场”，也不只是泛化的交易所成交量，而是让数字资产在中心化和去中心化交易场所持续可交易的付费基础设施：交易所做市、代币流动性委托、OTC
              和期权支持、执行质量数据，以及维持价格连续所需的路由、对冲和库存管理。Keyrock 自身定位覆盖中心化和去中心化交易场所中的做市、期权、OTC 和 DEX
              流动性，这比整个加密经济窄得多，但比单一代币发行服务更宽。CoinDesk Data 的订单簿和交易数据材料解释了这个市场为何存在：流动性分散在许多交易所，最佳执行很难，市场 24/7
              运转且波动高于传统资产。因此，被纳入的支出落在买方愿意为更窄价差、更深订单簿、更可靠执行、发行支持或机构级市场准入付费的地方。被排除的支出包括被动代币持有、托管余额、钱包软件、挖矿，以及大多数从不需要外包二级市场支持的代币化或稳定币余额。这个区分很重要，因为加密标题常引用数万亿美元市值，但做市商变现的是换手、碎片化和风险库存，而不是闲置余额。
