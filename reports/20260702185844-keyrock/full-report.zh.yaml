        - a16z 称供应量现已超过 USD 300B
        - 使用 CoinGecko、DeFiLlama 和 a16z 得出的当前仪表盘区间。
        - 中
        - 结算 / 抵押品代理，而不是直接外包流动性收入。
      - - DEX 活动视角
        - 2026 当前
        - 链上交易场所
        - 30 天 DEX 交易量 USD 193.153B；DEX 占现货交易量近五分之一
        - DEX 份额明显高于以往周期
        - DeFiLlama 交易量快照，加上 a16z 的现货份额口径。
        - 中
        - 周转代理指标；不等同于做市商收入。
      - - 受监管加密 ETP 渠道
        - 2025-2026 当前
        - Bitcoin 和 Ethereum 交易所交易产品
        - USD 175B 持仓；USD 61.8B 累计 BTC+ETH 净流入
        - a16z 称 ETP 持仓同比增长 169%
        - a16z 持仓估算，加上 Farside 累计资金流表。
        - 中
        - 持仓和累计资金流彼此相关，但不是同一口径。
      - - 代币化 RWA 桥接市场
        - 2026 当前
        - 链上代币化真实世界资产
        - USD 19.3B 至 USD 30B
        - CoinGecko 称代币化 RWA 自 2025 年以来增长超 3 倍
        - CoinGecko、Cointelegraph/DeFiLlama 和 a16z 的公开估算彼此冲突。
        - 中
        - 定义和观察日期不同，因此数字不能直接互换。
      - - 代币化美债旗舰产品
        - 2026 当前
        - 精选机构美债产品
        - 每个旗舰产品 USD 1.59B 至 USD 3.11B
        - 2026 年 2 月，美债产品全市场突破 USD 10B
        - RWA.xyz 披露 USYC、BUIDL、USDY 和 BENJI 的产品级余额。
        - 中
        - 产品余额显示关键节点的深度，不代表做市商总收入。
      - - Keyrock 类提供商的实用 SOM
        - 2026-2028
        - 付费流动性委托和机构交易工作流
        - 公开资料无法支撑
        - Unknown
        - 需要合同定价、价差捕获、返佣、资本周转和客户集中度数据。
        - 低
        - 公开资料无法拆出留用费、价差和激励计划对应的实际收入池。
    notes: 所有数值均为 USD。本表刻意区分资本池、周转池和产品余额，因为把三者合并成一个 TAM 会高估可触达规模。
