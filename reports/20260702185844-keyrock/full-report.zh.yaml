              生态扩张故事——其余记录更多依赖广度指标或合作伙伴 Logo。CoinDesk 的 BlockFills 报道暗示 Keyrock
              可能通过收购机构客户网络来扩大触达，但由于卖方已经破产，这不应被混同为有机留存或干净的客户热爱。正确结论是：生产使用真实，扩张逻辑可信，受监管分销重要；缺失层仍是账户级耐久性和集中度披露。[CU040]
