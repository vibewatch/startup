  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 交易所流动性服务
        - 为已上市数字资产提供持续报价、价差管理、库存平衡、路由和交易场所覆盖。
        - 被动持仓、仅托管余额和未交易代币库存。
        - 交易所、经纪商、电子交易场所和大型代币发行方。
        - 核心市场，因为碎片化和最佳执行问题正是专业做市商收费的地方。
      - - 代币流动性与发行启动委托
        - 面向新发行或交易稀薄代币的上市支持、金库支持的流动性项目、二级市场支持和交易场所铺开。
        - 一级发行顾问、代币法律架构或通用营销支出。
        - 基金会、DAO、金库、代币发行方和生态基金。
        - 重要切入口，因为代币持续增多，不断带来新的流动性上线工作。
      - - OTC、期权与机构风险转移
        - 大宗执行、对冲、期权支持，以及围绕高波动资产的跨场所风险承接。
        - 只做多基金管理、被动 ETF 持仓，或没有执行能力的托管。
        - 机构、交易台、金库产品发起方和成熟持有人。
        - 有相关性，因为机构包装和金库产品需要底层流动性和对冲支持。
      - - 链上 / DEX 流动性基础设施
        - 在 DEX 部署流动性、支持金库产品交易、稳定币路由和链上价格发现。
        - 不触及交易或结算流动性的通用智能合约开发。
        - 协议、稳定币发行方、代币化资产发起方和链上金库。
        - 随着 DEX 份额、稳定币和代币化资产增长，相关性持续上升。
      - - 相邻但排除的池子
        - 仅作为背景或需求代理的市值、稳定币供应、ETF 资产和代币化余额。
        - 把所有加密资产价值都当作可直接服务收入。
        - 投资者、持有人、发行方和资金管理方。
        - 必须排除，否则 TAM 会把闲置余额资本化为流动性服务收入。
    notes: 纳入支出聚焦已付费的流动性结果；排除池子只是需求或资产负债表背景，不是直接外包做市收入。
    claimRefs:
