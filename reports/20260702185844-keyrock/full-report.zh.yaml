      - number: '2.2'
        title: 规模测算视角：相邻资金池很大，直接费池未公开披露
        blocks:
          - type: paragraph
            body: >-
              公开规模测算必须先从相邻资金池开始，再大幅收窄。最宽的视角是加密资产基数本身：CoinGecko 目前跟踪超过 16,000 种加密货币和近 1,500 家交易所，合计市值约 $2.21
              trillion。这是有用背景，但不是好的收入代理，因为其中大部分价值在任一时点并不向做市商付费。更紧的视角是结算和抵押层。CoinGecko、DeFiLlama 和 a16z 显示，稳定币规模约 $308
              billion 至 $312 billion；a16z 称稳定币处理了 $9 trillion 调整后年化交易量，并持有超过 $150 billion 美国国债。另一个机构视角是受监管包装产品需求：a16z 称
              Bitcoin 和 Ethereum 交易所交易产品持有超过 $175 billion；Farside 的日度表显示，截至 2026 年 7 月 2 日，美国现货 bitcoin ETF 累计净流入约 $50.9
              billion，现货 ether ETF 约 $10.9 billion。更窄的桥接市场是代币化 RWA：CoinGecko 报告 2026 年 Q1 末为 $19.3 billion，Cointelegraph
              引用 DeFiLlama 称 2026 年 3 月初为 $23.6 billion，a16z 则描述为约 $30 billion 市场。这些差异正是本章保留冲突估计、而不是假装存在一个干净 TAM 的原因。
