  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律阴影
        blocks:
          - type: paragraph
            body: >-
              Keyrock 已通过 Keyrock FR SAS 拿到 MiCA 牌照，并为英国机构做市和 OTC 活动取得 FCA
              注册，基线合法性风险明显下降；但这些进展没有消除监管风险，只是改变了风险形态。公开材料现在呈现的是一家试图在欧盟、英国和更多司法辖区扩张的公司，而它经营的业务紧贴
              AML、制裁、市场滥用、代币分类和交易场所监管等高压线。公开规则也在变得更明确。欧盟资金转移规则要求加密资产服务提供商在转账链路上传递付款方和收款方数据，标出混币器和部分自托管钱包互动等高风险资金流，并维持与限制性措施兼容的控制。与此同时，美国针对
              Binance 和 Bittrex 的执法说明，即便目标公司本身未被起诉，交易场所、代币和制裁问题也会外溢到交易对手。实际含义是，Keyrock
              的监管风险不只是是否持牌，而是公司能否把交易场所名单、客户簿、代币边界和结算轨道放进多个快速变化的监管体系里，不出一步导致客户下架、资产冻结或产品范围收窄的错。
