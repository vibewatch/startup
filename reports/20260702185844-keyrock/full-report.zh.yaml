  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发
    rows:
      - - 牛市
        - 本轮顺利交割，MiCA / FCA 准入转化为机构委托，AWM 和链上产品变现，中心化交易活动恢复。
        - $1.4B-$2.2B；上行需要收入质量改善，也需要比公开记录目前显示的结构更干净。
        - 需要审计财务、披露条款，以及来自新邻近业务的可见经常性收入。
        - 邻近业务尚未证明能变现，或成交量持续疲软。
      - - 基准
        - Keyrock 继续增长，但公开不透明仍在，新邻近业务仍处早期。
        - $0.9B-$1.3B；只有底层经济性不错且条款不苛刻，当前估值才可能大体公允。
        - 近期私募可比交易支持独角兽定价，但不足以给出溢价买入结论。
        - 财务仍不透明，或条款比名义估值暗示的更保护投资人。
      - - 熊市
        - 成交量持续疲软，交割附带重优先权条款，或 BlockFills 与监管执行带来摩擦。
        - $0.45B-$0.8B；如果做市核心弱于叙事，或结构不利，普通股价值会急剧压缩。
        - 行业监管行动和 2026 年成交量疲弱已经给出可信的下行路径。
        - 当前收入能力低于预期，或法律与整合问题浮现。
    notes: 场景区间是股权价值范围，锚定近期私募估值、上市可比公司的估值约束和明确经营假设，而不是没有支撑的 DCF。
