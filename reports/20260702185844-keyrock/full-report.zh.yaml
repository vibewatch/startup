      - number: '1.4'
        title: 里程碑、监管与负面证据
        blocks:
          - type: paragraph
            body: >-
              Keyrock 的公开里程碑线索连贯，也为后续章节提供了稳定时间轴。2017 年创立、2020 年为基础设施和牌照融资之后，公司在 2022 年拿下大额 Series B，并在 2023 年至 2026
              年中扩大产品范围、监管覆盖和地域触达。这些里程碑的特殊之处在于，监管和产品扩张经常同步推进：France 与 Liechtenstein 注册早于 MiCA，美国和 Brazil
              实体设立紧随产品与机构销售扩张，Turing Capital 和 fija 两项收购都补上了经典做市之外的能力。到 2026 年 6 月，通过 Keyrock FR SAS 获得 MiCA
              牌照，使公司拥有比大多数私有加密流动性同业更清晰的 EU 扩张故事。


              负面证据比增长叙事更薄，但并非没有。最强的留存负面来源是 Keyrock 自己的风险披露声明，其中罕见地直说全额损失场景、第三方失败、监管扣押，以及对公司的无担保信用敞口。CoinDesk 也报道过
              Keyrock 计划收购破产的 BlockFills，这不是 Keyrock 自身的负面事件，但把公司放在了困境资产语境中。除此之外，截至本次运行日期，留存公开来源没有发现针对 Keyrock
              的独立执法行动、诉讼文件或裁员事件。这意味着主要尽调担忧不是明显的公开爆雷，而是独角兽阶段叙事与治理、收入、客户和精确融资条款披露偏薄之间的不匹配。
