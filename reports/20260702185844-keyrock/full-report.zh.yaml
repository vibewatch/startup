  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Keyrock 值得继续研究，而不是在 2026 年 3 月头条价格上直接买入。正面证据确实存在：公司和 SC Ventures 都确认了 $1.1 billion 的 Series
              C，业务现已覆盖做市、OTC、期权、链上流动性和资产管理，运营足迹达到 37 个国家、85 个交易场所、220
              名员工。对一家私有加密流动性平台来说，这些是可信的后期规模信号。问题不是公司是否重要，而是承保纪律。该轮仍是滚动交割，公司不披露已经募集的金额，The Block 给出的唯一公开规模线索是未来数月融资额可能达到
              $100 million。公开来源仍未披露收入、盈利能力、利润率、集中度，或决定真实投资者经济性的证券条款。在 $1.1 billion 估值上，价格或许说得通，但证据仍太薄，支撑不了买入判断。
