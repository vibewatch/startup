      - number: '3.2'
        title: 能力广度与监管姿态
        blocks:
          - type: paragraph
            body: >-
              对一家加密原生流动性公司而言，Keyrock 的公开产品面异常宽。当前官方服务栈覆盖做市、OTC、链上流动性、期权，以及新的资产与财富管理部门。2025 年 FCA 注册和 2026 年 MiCA
              牌照很重要，因为它们把这种广度转化为在 UK 和 EU 更容易被机构理解的故事，而不是停留在纯加密原生分销打法。直接同业各有强项。GSR 具备较强的机构 OTC 和牌照故事，并有 MAS 与 FCA
              触点。B2C2 叠加 SBI 所有权、长期运行的衍生品和融资产品线，以及明确的机构专属定位。Cumberland 把 DRW 的多资产资历叠加在深厚 OTC 和衍生品能力之上。Wintermute 在
              CeFi、OTC 和 DeFi 上仍然宽，但其法律语言比 Keyrock 更明确地说明客户保护的边界。Flow Traders、Jane Street、Virtu 和 Citadel
              有更强的上市公司或大型既有机构信任信号，但留存公开材料更多指向上市产品、ETF 或一般流动性相关性，而不是 Keyrock
              所营销的精确代币发行方和协议支持组合。由此形成的比较是：当买方想要一个供应商，用欧洲优先的监管叙事把中心化场所、去中心化场所，以及金库或资产管理邻接能力连起来时，Keyrock 更占优。
