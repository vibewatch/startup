              Keyrock
              的客户画像很宽，但没有被深入枚举。官方页面展示六个商业入口——做市、OTC、期权、资产管理、链上流动性和生态发展——而不是单一产品线。合在一起，这些入口至少暗示五个反复出现的分层：交易场所运营方、机构交易对手方和经纪商、代币发行方或
              DeFi 协议、市场结构提供商，以及资产配置方。分层组合很重要，因为它意味着公司把基础设施同时卖给交易场所和资本配置方，而不是依赖一个狭窄买方原型。[CU001] [CU002] [CU003] [CU004]
