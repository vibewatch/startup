  - id: TV005
    title: 融资 / 估值背景表
    columns:
      - 议题
      - 公开证据
      - 估值含义
      - 注意事项
    rows:
      - - 名义估值
        - 2026 年 3 月 31 日宣布 $1.1B 估值。
        - 让 Keyrock 进入私募加密流动性公司的近期独角兽阵营。
        - 名义价值不等同于普通股价值。
      - - 轮次状态
        - 官方称为滚动交割，宣布时尚未完全交割。
        - 最终资本结构和定价背景仍在变化。
        - 带来最终募资额和所有权稀释的不确定性。
      - - 轮次规模
        - The Block 称总额可能达到 $100M，但公司拒绝说明已募集金额。
        - 如果上限交割，可能显著增强资产负债表。
        - 没有公开确认全额已经完成。
      - - 资金用途
        - 明确用途包括强化资产负债表、扩大服务和收购。
        - 支撑增长和期权价值，而不是短期流动性。
        - 不能证明投入资本回报。
      - - 监管期权价值
        - MiCA 和 FCA 进展提升机构准入和可信度。
        - 如果变现，可以支撑相对无监管同业的溢价。
        - 监管转化为收入的商业转化率仍未披露。
      - - 结构不透明
        - 未识别到公开股价、清算优先权、反稀释或董事会权利细节。
        - 这些未知项对真实投资人回报的影响可能超过名义投后估值。
        - 需要直接审阅条款清单和股权结构表。
    notes: 本表把轮次的公开已知信息，与仍妨碍完整承销的结构性事项拆开。
