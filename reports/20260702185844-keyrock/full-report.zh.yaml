  - id: TV006
    title: 论点破裂与否决触发表
    columns:
      - 触发因素
      - 门槛或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入重估
        - 当前 2025/2026 年收入能力明显低于 $1.1B 估值所暗示的水平。
        - 打破牛市和基准情形，因为业务广度没有转化成变现。
        - 大幅重定价，或转为回避。
      - - 优先权悬顶
        - 新资金或内部人持有高级清算权、棘轮或重度反稀释保护。
        - 名义估值会夸大普通股上行。
        - 按分配瀑布重新承销，或放弃。
      - - 邻近业务未变现
        - 尽管收购了 Turing 和 fija，AWM 与链上产品仍是低收入。
        - 击穿 Keyrock 正在摆脱纯价差收入的论点。
        - 去掉溢价，采用更严厉的做市商折价。
      - - 成交量低迷
        - 中心化交易所活动持续疲弱，且没有费用收入抵消。
        - 压制交易收入并压缩公允价值。
        - 在成交量或费用结构改善前，按熊市情形承销。
      - - 控制或偿付问题
        - 风控、资本或法律保护无法满足机构尽调。
        - 证明风险披露中的担忧已经从理论变成实际问题。
        - 修复并重新定价前不投资。
      - - 监管挫折
        - 扩展业务受监管机构限制，或出现更多做市审查。
        - 降低期权价值，并抬高合规成本。
        - 暂停投资，直到业务边界和经济性清晰。
      - - BlockFills 整合失败
        - 客户留存、负债或技术整合转差。
        - 增加复杂度，却不改善盈利质量。
        - 把收购策略视为负面，而不是溢价驱动因素。
    notes: 触发因素在管理层会议前设定，因此即便叙事动能改善，投资建议仍能保持纪律。
