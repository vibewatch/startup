              的同时，交易量增长到三倍。这些数据点支持一个判断：公司确有真实交易量、伙伴广度和产品扩张动能。但它们都不等于收入质量。公开资料仍没有 ARR、年化收入、毛利率、CAC
              回收期、NRR、流失率或已实现抽成率披露。要弥合这个缺口，目前最好的代理来自 Virtu 和 Flow Traders
