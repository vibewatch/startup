        - 提供平均单票规模、毛点差留存和结算成本分摊
      - - 期权台
        - 为对冲、财库、收益增强和收益结构多元化定制看涨 / 看跌结构
        - 结构化权利金和风险转移收入
        - 2023 年上线，可按机构需求定制
        - 若对冲得当，吸引力不错，但库存和资本占用未知
        - 提供权利金收入、对冲成本政策和按结构拆分的风险资本
      - - 链上流动性
        - 为协议配置 DEX 流动性并主动管理滑点
        - 流动性管理费、激励和策略叠加
        - 已上线，公开材料提及 TVL 和执行质量，但没有费率表
        - 可能把服务费与类似库存的资本占用混在一起
        - 提供费率公式、激励分成和每个项目投入的资本
      - - 生态发展 / 验证者服务
        - 战略流动性、技术支持、验证者运营和生态增长支持
        - 固定服务费、里程碑费用、验证者奖励或打包商业方案
        - 对外包装成统一合作层
        - 增加服务多元化，但可能吃人力
        - 将经常性固定服务费与一次性工程或 grant 绑定工作拆开
      - - 资产与财富管理
        - 收购 Turing 后推出 Absolute Alpha 和 Smart Beta 策略
        - 管理费、业绩报酬或基金经济性
        - 产品组合公开，经济性未披露
        - 可能更具经常性，但费率兑现和 AUM 仍未披露
        - 提供 AUM、费率表、赎回条款和业绩报酬设计
    notes: 各行只捕捉官方材料可见的变现通道；并不意味着公司披露了收入结构或实际贡献利润率。
