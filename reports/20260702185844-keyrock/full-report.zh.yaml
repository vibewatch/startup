  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 证据支持
      - 改变观点的条件
    rows:
      - - 正方：受监管的机构桥梁
        - MiCA 和 FCA 进展说明，相比许多加密原生同行，Keyrock 的平台更容易被机构看懂。
        - 若披露欧盟通行带来的收入和英国客户赢单，可上调判断。
      - - 正向论点：产品栈够宽
        - 做市、OTC、期权、链上流动性和资产管理拓宽了变现路径。
        - 需要分部收入证明广度已经变现，而不是只停留在产品陈列。
      - - 正向论点：不止赚价差
        - Turing 和 fija 把 Keyrock 延伸到资产管理和链上基础设施。
        - 若披露 AUM、费率和链上客户采用情况，可上调判断。
      - - 正向论点：新的战略背书
        - 在融资环境偏弱时，SC Ventures 和 Ripple 的支持确认了外部信心。
        - 如果本轮能按接近规模预期上限顺利交割，信心会提高。
      - - 反向论点：估值不透明
        - 实际交割金额、股价、优先权和董事会权利仍未披露。
        - 只有审阅完整融资文件后才能上调。
      - - 反向论点：依赖市场成交量
        - 2026 年 2 月和 Q1 中心化交易量下滑，可能压缩做市商的收入能力。
        - 若管理层证明有更多经常性费用收入，或低成交量弹性，风险会下降。
      - - 反向论点：交易对手与偿付风险
        - Keyrock 自身风险披露强调了无担保债权和损失分摊风险。
        - 需要控制证据、资产负债表证明和清晰的法律保护。
      - - 反向论点：困境 M&A 的执行风险
        - BlockFills 带来资产和客户入口，但破产整合会占用管理层带宽，并可能带来负债。
        - 只有客户留存和负债隔离得到书面证明后，风险接受度才会提高。
    notes: 各行把最强的承销理由和最有价格敏感性的反向论点配对，避免建议滑成泛泛的质量评分。
    claimRefs:
