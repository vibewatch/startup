      - number: '5.4'
        title: 路线图、成熟度与技术结论
        blocks:
          - type: paragraph
            body: >-
              2024-2026 年轨迹显示，公司是从现货流动性根基向相邻基础设施扩张，而不是随机堆产品。Deutsche Bank 在 2024 年末增加了交易型 FX 支持；2025 年带来 FCA 注册，并通过
              Turing Capital 正式推出资产与财富管理；2026 年 2 月带来用于链上分发的 fija vault 技术；2026 年 3 月增加 Finery Markets 报价流连接和 SC
              Ventures 增长资本；2026 年 4 月显示 Keyrock 用 Ethereum 代币化债务为自身融资；2026 年 6 月增加 MiCA
              通行。这个顺序让产品故事更可信：连接能力、监管、金库通道、链上工具和量化人才都朝同一方向推进。差异化在三处最强：欧洲监管姿态、一站式覆盖多种流动性形态，以及围绕
              Rust、低延迟交易和数据基础设施的可见量化工程栈。主要保留意见是证据不对称。公开材料让架构和野心显得可信，但尚未披露模块级采用、执行质量
              KPI、对冲方法或更深保证材料。因此，技术结论对范围和基础设施成熟度是正面的，但仍取决于对控制、客户结果和资产负债表风险管理的私下尽调。
