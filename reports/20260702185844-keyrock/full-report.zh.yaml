  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Keyrock 的公开档案支持一个多元化交易与基础设施收入模式，而不是单一价差获取故事。核心引擎仍是做市：Keyrock 称其从 85+
              家交易所聚合数据，优化订单簿、收窄价差，并向合作伙伴提供分析。但收入栈已远超这个基础。OTC
              交易被定位成一种定制化自营交易关系，结算被打包进服务；期权台销售用于对冲、金库管理和收益增强的定制结构；链上流动性和生态发展工作增加了战略流动性、验证者和技术支持通道；2025 年资产与财富管理发布又加入
              Absolute Alpha、Smart Beta 等类基金产品。缺口仍是已实现定价。Keyrock
              把每项主要服务都营销为定制化，已审阅网站没有发布费率卡、价差分成公式、管理费表或收入确认政策。因此，正确的财务解读是：变现广度可信且在改善，但服务广度能否真正转化为收入质量，仍取决于合约层面的尽调。
