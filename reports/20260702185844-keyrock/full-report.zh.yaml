  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 提供商 / 替代方
      - 公开价格或合同信号
      - 已有证据支持的内含能力
      - 保留的未知项
      - 含义
    rows:
      - - Keyrock
        - 未找到公开价差或留用费价目表
        - OTC、做市、链上流动性、期权、资产管理
        - 实际点差、发行方固定服务费结构和返佣未知
        - Keyrock 卖的是覆盖广度和受监管执行能力，不是透明标价
      - - Wintermute
        - 2021 年来源称 OTC 不收费；经济性可能主要靠点差
        - CeFi、OTC、DeFi，并计划扩展 RFQ 和衍生品
        - 当前实际定价和 2026 年商业条款未知
        - 即使不发布长期有效的价目表，也能激进争夺订单流
      - - GSR
        - 最低交易额公开；价目表未公开
        - 200+ 种资产、25 种法币、OTC UI/API、结构化衍生品
        - 实际点差、信用条款和返佣未知
        - 覆盖广度可见；经济性仍靠谈判
      - - B2C2
        - 未发现公开标价点差
        - 现货、CFD / 期权、融资、GUI/API、75+ 种货币
        - 借贷经济性、期权权利金和客户定制定价未知
        - 对机构而言，打包广度可能比标价更重要
      - - Cumberland
        - 明确称不收费；本金成交价内嵌经济性
        - 现货、期权、期货、NDF、交易后结算、多种接入渠道
        - 具体点差构成和逐客户经济性未知
        - 证明本金交易台可凭全包价竞争，而不是靠费用行项目
      - - Amber
        - 声称产品透明且定价具竞争力
        - 做市、顾问、发行支持、CeFi/DeFi 流动性
        - 无公开点差、固定服务费或激励费率表
        - 显示商业竞争存在，但不足以对 Keyrock 做数字化基准
      - - DeFi LP / AMM
        - 协议费率档位公开，但 LP 经济性会随区间和库存风险变化
        - 集中流动性能加深目标价格区间附近的交易深度
        - 无常损失负担、再平衡人力和协议特定成本差异很大
        - 可替代部分交易对，但不能完全替代谈判式 OTC 和发行方支持
      - - 自建 / 直连交易所
        - 无公开价目表；经济性内部化
