      - number: '2.4'
        title: 增长驱动、约束与未解的规模缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动已能在公开数据中看到。机构包装产品需求是真实的，不是假设：ETP 持仓规模大，稳定币已经主流化，代币化 RWA 和 RWA-perp 交易量快速复合增长。DEX 份额明显高于几年前；24/7
              市场结构也意味着交易者、发行方和金库需要连续流动性，而不是只在交易时段获得支持。同时，监管有双面性。MiCA 为欧洲加密资产服务和跨境扩张提供了可用框架，但 FSMA 的 CASP
              摘要明确显示，授权、行为规范、资本或保险、治理和市场滥用控制都会抬高固定成本。BIS 和 IMF
              对代币化长期潜力持建设性态度，但两者都强调健全的市场设计、货币锚和治理仍然重要。约束仍是结构性的：资本强度、库存风险、交易对手筛选、交易场所信任，以及交易所质量不均，不会因为资产类别变大而消失。SEC 的现货
              Bitcoin ETP 声明明确警告，许多加密平台仍不合规且存在利益冲突；CoinDesk
              的交易所基准也显示，相对于可选交易场所数量，顶级场所质量仍然稀缺。最终尽调警示是经济性的，不是叙事性的：公开来源量化了相邻资金池，但没有披露费池、价差经济性、客户集中度或资本周转，因而无法把这些资金池转化成
              Keyrock 可防守的 SOM。
