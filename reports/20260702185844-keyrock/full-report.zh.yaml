        title: 集中度、监管摩擦与下行证据
        blocks:
          - type: paragraph
            body: >-
              本章的下行证据少在公开流失事件，多在交易对手、入驻和披露风险。Keyrock 自身风险披露异常直接：客户和交易对手方承担第三方失败、监管行动和 Keyrock
              偿付能力风险，且可能最终成为无担保债权人。其条款还要求 AML 和 KYC 文件，并承认另有交易所条款，这意味着机构入驻在法律和运营上都很重。FCA 和 MiCA
              批准对此有帮助，但它们是采购促成因素，不是客户签约后黏性的证明。[CU036] [CU037] [CU038] [CU039]


