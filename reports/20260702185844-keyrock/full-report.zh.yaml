      - number: '7.2'
        title: 24/7 运维与控制面
        blocks:
          - type: paragraph
            body: >-
              第二组风险是运营风险。Keyrock 已不只是宣称通用的加密流动性能力；它公开营销的是在 85 个以上交易所 24/7 做市、在同一关系下完成 OTC 执行和结算、由其直接担任交易对手的期权结构，以及带滑点目标和
              TVL
              目标的活跃链上流动性管理。这样的广度拉宽了控制面，错误会迅速传导：交易场所宕机、行情数据损坏、结算失败、期权账簿对冲过度或不足、智能合约漏洞、稳定币中断，或滑点管理失灵，都可能在人为复核周期捕捉前触达客户。Keyrock
              自身风险披露罕见地直白：客户承担第三方失败风险、智能合约风险，甚至在 Keyrock 或提供商资不抵债时承担无担保信用敞口。公开缓释因素方向上是正面的——算法化风险管理、24/7
              值守和监管优先姿态——但公开记录仍没有展示事故历史、熔断阈值、结算失败率、对账控制或交易后损失指标。因此，剩余问题不是公司是否懂风险词汇，而是看不见的控制基础设施能否像看得见的交易场所和产品足迹一样快地扩张。
