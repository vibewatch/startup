      - number: '7.3'
        title: 依赖与交易对手集中度
        blocks:
          - type: paragraph
            body: >-
              Keyrock 最新公开里程碑也暴露了增长叙事有多依赖伙伴。Deutsche Bank 关系通过多币种账户、集成外汇服务和近实时结算改善法币和外汇运营，这确实缓释了全球 OTC
              和做市活动的风险。但缓释项也可能变成集中点：结算、外汇和账户基础设施越多集中到少数银行轨道，运营韧性越取决于第三方的风险偏好、合规姿态、正常运行时间，以及对加密客户的司法辖区容忍度。交易所和稳定币依赖也是同样逻辑。执法或去风险化会削弱交易场所准入；Circle
              和 Tether 也都保留封锁地址、冻结余额、延迟赎回，或撤回对链和分叉支持的法律权利。在此之上，Keyrock 正把 Turing Capital、fija 和计划收购的 BlockFills
              层层接进运营栈。这些动作能带来客户、策略、交易场所和基金结构，但也会从核心引擎之外导入整合、法律和交易对手复杂性。因此，公开依赖图谱比简单的交易所清单更宽，也更微妙：Keyrock
              越来越依赖其无法完全控制的银行、发行方、交易场所和被收购平台。
