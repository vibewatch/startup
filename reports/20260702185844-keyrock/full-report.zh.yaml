      - number: '8.4'
        title: 融资结构、结构风险与退出准备度
        blocks:
          - type: paragraph
            body: >-
              当前融资背景提升了 Keyrock 战略相关性的可信度，但没有提升投资者经济性的清晰度。公司称新资金将强化资产负债表并支持收购，BlockFills
              交易说明管理层已经在用这份选择权整合困境资产。这可能抓住机会并增厚价值，但也抬高了整合风险，因为 BlockFills 进入 Chapter 11
              时负债大幅超过资产。更大的问题是结构不透明。公开证据没有说明准确已交割金额、是否包含老股、清算优先权、反稀释保护或董事会权利。这些缺失条款比头条估值更重要，因为它们决定普通股上行空间是否真的可投。退出准备同样未经证明。留存公开来源没有显示
              IPO 申报、投行委任或出售流程。审慎解读是，Keyrock 正在为扩张融资，而不是发出近期流动性事件信号。
