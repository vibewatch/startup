        - 未公开按客户群划分的成交率或点差改善基准。
      - - 执行机构大宗交易
        - 交易对手必须跨多个场所寻找流动性、路由并结算
        - OTC 柜台把交易员、自有流动性、API 执行和结算整合到同一合作关系中
        - 宣称每日 10K+ 笔 OTC 交易，并降低运营开销
        - 未公开交易后报告、限额或交易对手接入 SLA 样本。
      - - 用期权对冲资金库或提高收益
        - 机构需要定制条款，而不是上市标准期权合约
        - 定制期权可选择任意行权价和到期日，用于对冲、收益、资金库或收益结构多元化
        - 24/7 结算表述，以及基于实时流动性的定价输入
        - 未公开保证金、抵押品或模型治理流程。
      - - 启动或稳定链上市场
        - 协议面临滑点、TVL 浅和 DEX 活动分散问题
        - 数据驱动的 DEX 流动性策略，配合滑点边界管理和主动 LP 运营
        - 宣称执行成本更低、流动性更深、无常损失更低
        - 未公开具体链上的表现或智能合约保证指标。
      - - 让生态增长不只靠流动性
        - 基金会需要资金库协同、技术指导和去中心化支持
        - 战略流动性、工程支持、验证者节点搭建和奖励渠道设计
        - 更快形成早期流动性，并强化网络参与激励
        - 长期生产级支持的公开证据仍然不足。
      - - 提供算法化数字资产敞口
        - 配置方要的是机构级策略，而不是自助交易
        - Absolute Alpha 和 Smart Beta 基金，加上量化主导的资产管理部门
        - 风险调整后收益和回撤控制是核心营销抓手
        - 未公开经审计收益、费用或 AUM 披露。
      - - 为全球资金流加速多币种结算
        - 流动性提供商跨区域面临 FX 和结算摩擦
        - Deutsche Bank 多币种账户和集成 FX 支持 OTC 与做市业务
        - 公司称 EMEA、APAC 和 LATAM 的结算时间得到改善
        - 需要实际使用银行通道及处理中断的运营证据。
    notes: 收益仅使用来源支持表述；各行把公开工作流主张与承销仍需的私有运营证据分开。
