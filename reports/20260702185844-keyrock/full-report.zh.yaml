  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 机构采用 ETP 和美债式包装产品
        - 驱动因素
        - 当前
        - 受监管包装产品扩大了需要底层流动性、对冲和价格发现的机构池。
        - 量化依赖 ETF、美债产品或其他包装产品资金流的收入，而不是零售代币资金流。
      - - 稳定币规模和结算用途
        - 驱动因素
        - 当前至中期
        - 链上现金腿做大后，跨场所路由、抵押品和双边流动性的需求会上升。
        - 要求提供稳定币交易对成交量结构、结算链结构，以及现金腿路由贡献的收入。
      - - 代币化 RWA 和美债增长
        - 驱动因素
        - 当前
        - 更多代币化基金和美债会催生新产品，需要二级流动性和市场接入支持。
        - 要求提供代币化资产客户管线，以及美债产品委托采用的经济模型。
      - - DEX 份额提升和链上迁移
        - 驱动因素
        - 当前至中期
        - DEX 上现货和衍生活动增加后，跨场所和链上流动性运营需求会增加。
        - 衡量 DEX 流动性相对中心化场所的收入和投入资本。
      - - MiCA/CASP 授权和市场滥用控制
        - 约束与驱动因素
        - 当前
        - 监管清晰度有利于扩张，但合规、记录留存、治理和行为要求会推高固定成本。
        - 按司法辖区，把每条服务线对应到 MiCA、MiFID、美国证券法和大宗商品规则处理。
      - - 资本强度和库存风险
        - 约束
        - 持续
        - 做市商必须投入资产负债表、对冲波动并管理融资，因此并非所有相邻资本池都能同等变现。
        - 要求按资产类别提供库存周转、场所级风险限额和资本使用。
      - - 交易对手、场所和信任风险
        - 约束
        - 持续
        - 交易所倒闭、不合规场所和参差不齐的场所质量，会限制机构资金流可以安全集中的位置。
        - 审查前 20 大场所敞口、抵押品政策，以及按场所或交易对手设置的集中度上限。
      - - 公开费用池不透明
        - 约束
        - 当前
        - 没有合同定价、价差捕获和返佣数据，TAM 还能讲，SOM 却无法站住脚。
        - 要求按代币委托、交易所计划、OTC/期权和机构基础设施客户拆分收入。
    notes: 驱动因素的时点和影响，是对引用来源的分析综合。尽调问题标出把公开市场结构转成可投资经济性所需的私有数据。
