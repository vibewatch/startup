      - number: '3.3'
        title: 定价、打包与切换成本
        blocks:
          - type: paragraph
            body: >-
              定价是公开记录最弱的地方，而这种弱本身就是竞争发现。Keyrock 留存官方材料大量谈深度、定制执行、透明度和监管优先执行，但不公布价差、固定服务费或返佣结构。这在整个品类中很常见。GSR
              披露广度和最低交易规模，不披露已实现经济性。B2C2 披露产品打包，不披露按客户定制的价差。Cumberland 是留存样本中最清楚的例外，因为它明确表示不收费，而是把经济性嵌入自营定价。Wintermute
              2021 年融资稿也把 OTC 描述为不收费、由价差驱动的执行。Amber
              声称价格有竞争力，但不披露实际价目表。这意味着买方可能通过谈判经济性、信用、入驻摩擦、法律条款和执行质量来选择或切换供应商，而不是通过公开标价表比较。公开产品设计仍暗示切换成本中等，而非很高。Keyrock、GSR、B2C2
              和 Cumberland 都宣传 API、电子化或交易台式工作流，使多供应商并行具备可行性。真正拖慢切换的不是可见的专有锁定层，而是 KYC、交易对手限额、结算信心、信用，以及同时运行过多流动性关系的运营成本。
