  - id: TV001
    title: 建议摘要表
    columns:
      - 决策项
      - 当前立场
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 战略相关性可信，但当前财务和条款未披露，价格支撑弱于公司质量信号。
        - 现在尽调，但不要把名义估值按买入情形写入投资假设。
      - - 置信度
        - 中
        - 轮次、监管进展和可比估值框架都真实，但收入和股权结构表披露缺失。
        - 使用宽区间，避免精确倍数计算。
      - - 风险评级
        - 高
        - 市场成交量敏感性、结构不透明、交易对手 / 偿付能力保留事项，以及收购整合风险仍然重要。
        - 要求明确否决触发器和下行保护。
      - - 估值立场
        - 偏贵
        - 相比新近私人市场可比项，该价格说得通；但公开证据还不足以证明盈利质量或条款干净到可称公允。
        - 升级观点前，优先要求折价或更强条款。
      - - 进入纪律
        - 仅在价格敏感时
        - 只有干净交割、经审计经济数据和已披露优先条款到位后，才可从继续研究转向买入。
        - 拒绝只靠叙事写投资假设。
      - - 回报姿态
        - 期权价值，不是核心投资假设
        - 上行取决于 MiCA / FCA 驱动的货币化、AWM 规模，以及链上扩张能否证明持续性费用收入。
        - 将上行视为有条件，而不是可直接兑现。
    notes: 建议刻意保持价格敏感；缺少财务和结构披露时，估值判断仍应基于区间，而不是公式。
