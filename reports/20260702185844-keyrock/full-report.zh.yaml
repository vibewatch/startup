      - number: '7.4'
        title: 财务模型、人员与投资逻辑破裂标准
        blocks:
          - type: paragraph
            body: >-
              财务和执行风险最好概括为承保不透明叠加模型广度。Keyrock 自己的 Series C
              材料称，资金将用于强化资产负债表、扩展服务和支持收购。这个信号有用，因为它确认公司自己把资本，而不只是代码，视为战略基础设施。但同一批公开材料仍未披露把叙事转成损失模型所需的指标：准确已交割融资额、经审计收入、价差捕获、库存上限、客户集中度、稳定币组合、结算失败率，以及各服务线的风险资本都不在留存记录中。人员图景也类似。活跃的合规和多城市招聘显示公司在投入控制职能，但公开证据仍无法判断独立模型验证、资金管理监督、收购后整合管理和全球接力式事故响应是否配到了平台现在需要的水位。公开市场上的类似做市商把剩余敞口说得很清楚：交易收入可能对波动率、价差、库存、宕机和交易对手违约高度敏感。对投资者而言，Keyrock
              投资逻辑只有在持牌转化为干净执行、收购保持受控、管理层足够快地弥合公开披露缺口以支撑独角兽阶段承保负担时，才应继续成立。
