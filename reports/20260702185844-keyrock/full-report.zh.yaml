      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              商业市场分成两个主要切口：交易所流动性服务和代币流动性服务；机构包装产品如今形成第三个催化因素。代币发行方和基金会通常为发行期和持续流动性买单，因为它们需要更窄价差、更深订单簿、交易场所覆盖，以及在自然订单流自我维持之前围绕上币的支持。中心化交易所、经纪商和执行场所购买流动性数据、路由智能和市场质量支持，因为碎片化订单簿让最佳执行和场所选择并不简单。资产管理人、ETF
              发起方、稳定币发行方和代币化国债平台，在产品需要底层报价、对冲和可靠二级市场深度来放大分发时，会成为付款方。链上协议和 DEX
              生态也是重要用户，因为更多结算、抵押和价格发现如今发生在链上，而不只是在中心化场所。运营用户通常是交易台、财资团队、风险经理、上币团队，以及市场结构或数据团队；经济买方更多是基金会金库、交易所管理层、产品发起方或机构分销负责人。这个分层很关键，因为
              Keyrock 这类供应商不是把“流动性”卖给一个单一买方，而是向多个付款方类别销售库存承诺、连接能力、执行质量和市场准入支持的不同组合，且各类付款方的采用触发点不同。
