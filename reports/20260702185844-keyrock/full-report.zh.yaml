        - 吞吐量说法已公开，但运营韧性和异常处理没有公开。
      - - 期权定价与执行栈
        - Rust 原生平台，支撑自动报价、执行、定价和风控工作流
        - 波动率模型、市场数据工作流、低延迟系统、交易所连接
        - 未公开模型治理或抵押品管理细节。
      - - 链上 LP 与金库层
        - 管理 DEX 流动性、滑点边界、无常损失权衡和 fija 金库基础设施
        - 协议集成、智能合约、钱包权限和流动性资金
        - 公司承认智能合约和前端风险，但公开技术保证薄弱。
      - - 数据平台与分析
        - 标准化市场、交易和组合数据；计算点差、深度 VWAP 和微观结构分析
        - 流式处理栈、时序存储、湖仓设计、可观测性、数据契约
        - 数据源故障或数据模式漂移会直接削弱执行和风险监控。
      - - 结算和 FX 通道
        - Deutsche Bank 为 OTC 和做市业务加入多币种账户与 FX 服务
        - 银行伙伴可用性、区域监管、资金库工作流
        - 银行依赖带来伙伴集中和服务连续性风险。
      - - 控制与监管层
        - MiCA、FCA、AML/CFT、隐私和披露控制决定哪些客户能接入，以及服务能在哪些地区扩张
        - 实体结构、司法辖区批准、监控、制裁和法律更新
        - 监管姿态是优势，也是欧洲增长的核心运营依赖。
