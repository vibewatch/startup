        title: 投资逻辑、反向逻辑与情景推演
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是 Keyrock 正从纯加密做市商走向受监管的数字资产基础设施平台。支撑证据具体：Turing Capital 带来了资产与财富管理部门，fija 扩展了链上分发，MiCA 和 FCA
              进展提升了机构可信度和可服务地域。如果这些动作转化为持续客户委托，而不是一次性战略公告，收入组合质量可能提升。反向逻辑同样重要。Keyrock
              自身风险披露提醒交易对手，破产债权可能列为无担保，数字资产损失也可能无法获得补偿。2026 年初市场背景也转弱，2 月和 Q1
              的中心化交易量均下降；这很关键，因为做市收入通常对交易量和波动率敏感。因此必须做情景推演。乐观情景取决于相邻业务变现和结构更干净；基准情景把 $1.1 billion
              视为合理但证据不足；悲观情景反映交易量压力、隐藏条款，或收购和监管挫折。
