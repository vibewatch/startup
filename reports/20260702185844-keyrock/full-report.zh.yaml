chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Keyrock 的公开身份在官网、公司简介和 2026 年融资材料中相互一致：这是一家源自 Brussels
              的数字资产投资集团，核心是提供流动性和市场基础设施，而不是单点加密经纪商。官方服务栈已覆盖做市、OTC、期权交易、资产与财富管理，以及生态或链上支持。这个广度很关键，因为公司不再只推一个赚取价差的做市引擎；它把自己定位成多条线的基础设施提供商，为需要执行、流动性和策略的一站式机构和代币项目服务。


              公开定位也反复强调传统金融正在走向代币化市场，而 Keyrock 是这场迁移的桥梁。公司多次把自身角色表述为帮助机构更有信心地进入数字资产；2026 年 Series C 材料则称 Keyrock
              提供面向数字资产市场重构的金融专业能力。Brussels 根基、私有公司 Series C 阶段、自称多服务平台，合在一起构成一个后期但仍未上市的画像。缺口在商业透明度：已审阅公开材料没有披露收入、ARR
              或客户数，因此商业模式故事的证据远强于变现画像。
