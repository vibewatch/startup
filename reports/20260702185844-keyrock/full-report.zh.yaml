      - number: '4.4'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              财务结论方向正面，但仍受可投资判断材料不足约束。Keyrock 显然不止一条变现通道，正在增加受监管产品广度，也在艰难的数字资产周期中持续获得投资人支持。2026 年 Series C 估值 $1.1
              billion，加上 2025 年 Turing 和 2026 年 Fija
              交易，显示公司在用资本同时扩大服务和监管触达。这是强项逻辑。卡点也同样清楚：公开资料仍看不到按业务线拆分的收入、毛利率、烧钱、资金续航、债务、集中度或留存；即便是精确的 Series C
              美元金额，官方发布也未披露。可比公司申报文件暗示资本和固定成本负担可能不轻，但它们不能替代 Keyrock
              自身经审计数字。尽调优先级不是再找一篇估值标题文章，而是拿到现金、收入结构、各服务线利润率，以及扩张中集团结构的监管资本需求证据。在这些证据出现前，Keyrock
              只能获得中等置信度的财务评估，而不是证据完整、可直接下判断的财务结论。
