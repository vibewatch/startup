      - number: '1.3'
        title: 融资历史、规模信号与足迹
        blocks:
          - type: paragraph
            body: >-
              Keyrock 的融资历史方向清楚，但精确累计金额并不清楚。留存记录显示，公司在 2020 年 10 月获得 EUR 4.3 million 融资，2022 年 11 月完成 $72 million Series
              B，并在 2026 年 3 月完成由 SC Ventures 领投、Ripple 继续支持、公布估值 $1.1 billion 的 Series C。主要警示在于，2026
              年融资被宣布为滚动交割。官方材料从未披露公告当日实际到账金额；Tech.eu 报道该轮到 2026 年 6 月可能达到 $100 million。Tracxn 给出五轮累计融资 $79.4 million
              的估计，但这是第三方数字，无法与仍未完全关闭的 Series C 叙事干净对上，因此应把它视作低置信度占位，而不是权威累计金额。


              规模信号强于收入信号。官方 2026 年材料反复称团队 220 人左右或 220+，覆盖 37 个国家；Tracxn 列示 2026 年 3 月员工数为 223。足迹一部分可由
              Brussels、London、Paris 和 Seychelles 的具名地址验证，一部分来自指向 U.S.、Brazil、France、Liechtenstein 和 Switzerland
              的扩张与监管帖子。招聘页面也显示 Zurich、New York、London 和 Brussels 有在招岗位。这足以判断 Keyrock
              确实是多司法辖区运营，但不足以画出完整办公室网络或按法律实体拆分员工。收入、ARR 和客户数仍未出现在已审阅公开语料中，因此公开规模主要靠地域、招聘和产品广度表达，而不是靠披露的经济性。
