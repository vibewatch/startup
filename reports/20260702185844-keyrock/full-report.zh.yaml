      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              留存资料充分支持 Kevin de Patoul、Jeremy de Groodt 和 Juan David Mendieta 这组创始人。Kevin
              仍是融资、监管和扩张公告中的核心公开发声者，这既强化了创始人延续性，也带来一定关键人集中度。公开履历也足以看清领导层的职能覆盖：Eric Beckwith 被列为 CIO，Francesco Adiliberti
              为 COO，Stef Wynendaele 在 2026 年晋升后担任现任 CCO。更早的公告还显示，Keyrock 正在把领导层扩展到创始人之外，包括 Robert Valdes-Rodriguez
              的商业领导角色，以及 Adiliberti 在担任独立董事后的运营职责。


              治理披露明显薄于领导层披露。公司发布了 AML/CFT 框架，列出控制职能；风险披露声明也明确提醒交易对手方注意资产损失、第三方失败、监管行动和 Keyrock
              偿付能力风险。这能证明公司没有隐藏合规和交易对手风险语言。但同一公开记录没有披露完整的现任董事会名单、委员会结构，也没有披露 Series C 后的投资人控制条款。提示中给出的创始人姓名 Juan David
              Perez 也没有得到留存记录支持；已审阅的官方和档案来源一致把 Juan David Mendieta 识别为 CSO 联合创始人。
