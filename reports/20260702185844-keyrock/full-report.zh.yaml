  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              不能用一个竞争对手或一个狭窄产品面来给 Keyrock 做基准。最相关的直接同业，是把交易所做市与机构 OTC 或代币发行方支持结合起来的加密原生公司：GSR、Wintermute、B2C2、Cumberland
              DRW、Auros，以及较弱程度上的 Amber 和 HashKey。这些公司至少在代币发行方、交易所、基金或机构看重的一项核心任务上与 Keyrock
              重叠：让订单簿保持紧密，低调搬动库存，提供信用或执行工作流，并帮助交易对手方从中心化场所跨到去中心化场所。第二类是相邻但强大的既有机构，如 Flow Traders、Jane Street、Virtu 和
              Citadel
              Securities。公开证据不能把它们视作留存的完全同类代币发行方做市商，但显示它们能够压缩价差、中介上市加密产品，并以更强资产负债表或报告可信度吸收机构流量。第三类不是供应商，而是替代品：链上集中流动性池、交易所直接流动性计划，以及成熟交易所或基金自建的内部执行团队。因此，对
              Keyrock 来说，真正问题不是另一家公司能否报双边价格，而是哪一类玩家能把信任、广度和工作流深度组合到买方难以替换的程度。
