              投资判断最需要的成本栈只露出碎片，但这些碎片很有信息量。Keyrock 自身法律、AML 和风险披露显示，公司持续投入 MLRO 覆盖、KYC 与制裁工具、可疑活动报告、培训和多实体治理。Swiss、UK 与
              MiCA
              批准显示，监管扩张不是边缘事项，而是公司机构战略的核心运营要求。公开做市商申报文件展示了这通常意味着什么财务形态：大额经纪和清算支出、昂贵通信和数据基础设施、薪酬占比高的交易团队、融资成本，以及可观的资产负债表占用。Flow
              Traders 还显示，规模化做市商可能需要专用信贷额度来扩大交易资本。对 Keyrock 而言，最强资本信号是 2026 年 Series C
              叙事：公司称融资用于增强资产负债表、扩展服务和收购。公开档案没有披露的是，支撑这一战略的当前现金桥。Belgian registry 显示法定股本和 6 月 30 日财年末，但不是可用流动性。NBB
              年度账户门户在本次运行中也依赖 JS，导致本章无法提取已提交报表来直接分析利润率或资金续航。
