  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly observable 2020-2026 private marks and public market-structure analogs relevant to crypto liquidity
        infrastructure as of the 2026 run date, not a full banker comp set.
    columns:
      - 可比对象
      - 指标 / 估值标记
      - 与 Keyrock 的相关性
      - 局限
    rows:
      - - Keyrock
        - 2026 年 Series C 轮，名义估值 $1.1B；滚动交割，确切金额未披露。
        - 直接承销对象，也是最新的私募估值标记。
        - 没有公开财务或完整条款清单。
      - - GSR
        - 2026 年 5 月战略投资，估值高于 $1B；首个外部战略股东。
        - 最接近的近期私募可比对象，定位机构加密流动性基础设施。
        - 当前收入、轮次规模和条款也大多未公开。
      - - Wintermute
        - 2021 年 $20M Series B；在近 50 家交易所提供规模化流动性。
        - 证明加密做市的规模可以吸引风险资本，并支撑 RFQ / OTC 扩张。
        - 未披露估值，且属于 FTX 前周期。
      - - B2C2 / SBI
        - 战略银行收购，整合后 OTC 成交量据报扩大约四倍。
        - 显示机构流动性轨道对战略买家的价值。
        - 收购经济性和当前独立估值未公开。
      - - Amber Group
        - 2022 年 $200M Series B+，估值 $3B。
        - 更宽数字资产平台在上行周期的参照。
        - 较早的牛市周期估值，消费者和平台业务组合更宽。
      - - HashKey Group
        - 2024 年 Series A 轮近 $100M，投前估值 >$1.2B。
        - 支持亚洲受监管数字资产基础设施的独角兽定价。
        - 交易所和受监管金融服务的组合与 Keyrock 不同。
      - - Flow Traders
        - 2025 年总收入 €480.5M，净利润 €133.6M，属于上市流动性业务。
        - 可作为上市流动性供给商在盈利能力和资本强度上的类比。
        - 主要是 ETP 和更广义做市公司，不是纯加密交易台。
      - - Virtu Financial
        - 公开市值约 $3.54B，并明确披露做市风险因素。
        - 锚定公开市场如何给多元化电子做市风险定价。
        - 相比 Keyrock，规模大得多，经过审计且覆盖多资产。
      - - Coinbase / Nasdaq / CME
        - 公开市值分别约 $43.6B、$47.9B 和 $98.9B。
        - 为已披露的市场结构和交易所业务框定估值天花板。
        - 业务太宽，不能直接推导 Keyrock 的私募倍数。
      - - 2026 年成交量背景
        - 2 月中心化成交量下降 2.41%；Q1 交易所成交量环比下降 32%。
        - 解释为什么私募流动性估值需要周期性折价。
        - 交易所成交量不等同于 Keyrock 收入。
    notes: 可比估值口径差异很大，且刻意没有压缩成单一收入倍数，因为 Keyrock 没有披露做这项计算所需的分母。
