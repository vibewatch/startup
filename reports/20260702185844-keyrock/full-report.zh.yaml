  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Keyrock
        - 直接加密原生同业
        - 2022 年 $72M Series B；官方和第三方 2026 年材料指向估值约 $1.1B 的 Series C
        - 代币发行方、交易所、基金、需要 CEX+DEX+OTC 支持的机构
        - 业务覆盖做市、OTC、链上流动性、期权和新资产管理，且 FCA 与 MiCA 有进展
        - 公开资料未披露定价、胜率和已实现客户留存率
      - - GSR
        - 直接加密原生同业
        - 加密领域 10+ 年；MAS MPI 和英国 FCA 注册释放机构化扩张信号
        - 代币发行方、交易所、机构、金融科技公司、资产管理人
        - OTC 栈很宽，覆盖 200+ 资产、25 种法币，并具备结构化衍生品能力
        - 相比 Keyrock，公开资料中链上流动性运营或明确 EU 牌照深度证据较少
      - - Wintermute
        - 直接加密原生同业
        - 2021 年 $20M Series B；历史上覆盖近 50 个场所
        - 需要 CeFi、OTC 和 DeFi 流动性的机构和交易对手
        - 加密原生覆盖很强，历史上采用价差驱动的定价模式
        - 官方法律措辞明确表示客户可能无法获得典型受监管保护；公开黑客事件史提高了尽调负担
      - - B2C2 / SBI
        - 母公司支持的直接同业
        - 2020 年起由 SBI 持有；机构产品覆盖现货、CFD/期权和融资
        - 银行、经纪商、基金、交易所和专业交易对手
        - 银行关联带来信任信号，且衍生品和融资覆盖较宽
        - 留存公开材料在代币发行方或协议级服务上仍比 Keyrock 薄
      - - Cumberland / DRW
        - 交易老牌直接同业
        - 由 DRW 支持，自 2014 年提供数字资产流动性，母公司有 30+ 年交易经验
        - 需要 OTC、期权、期货、基差和免预融资工作流的机构
        - 本金流动性和衍生品打包能力很强
        - 即便案件已驳回，与美国 SEC 的法律交锋史仍在尽调文件中
      - - Flow Traders
        - 相邻老牌 / 上市产品专家
        - 公开年报；630+ 名专业人员和多元化数字资产业务
        - 机构和 ETP 流动性工作流
        - 上市公司报告与强 ETP 桥接可信度
        - 留存材料在上市 / ETP 加密业务上更强，在代币发行方做市上较弱
      - - Jump Crypto
        - 相邻建设者 / 交易替代方
        - 交易和基础设施足迹庞大；Tai Mo Shan 和解留下监管伤痕
        - 协议、基础设施生态和高端交易对手
        - 把交易约束转化为 Pyth 和 Firedancer 等协议与基础设施建设
        - 不是可直接类比的外包 OTC 供应商；Terra/UST 之后信任问题仍在
      - - Auros
        - 直接代币项目和流动性同业
        - FTX 冲击后成功重组；当前服务从孵化延伸到机构扩张
        - 需要发行、流动性策略、OTC、DeFi 和交易所支持的代币项目
        - 明确覆盖端到端代币生命周期，并使用 KPI 驱动的流动性表述
        - FTX 后重组历史会影响保守交易对手
      - - Amber / HashKey
        - APAC 相邻同业类别
        - Amber 在 FTX 后融资；HashKey 以投前估值 >$1.2B 融资近 $100M，并持有香港牌照资质
        - APAC 机构、高净值或财富渠道，以及持牌交易所生态
        - Amber 增加报价市场规模和 CeFi/DeFi 触达；HashKey 增加持牌交易所和合规优先生态深度
        - 这一类别不如 Keyrock 那样干净可比，因为它混合了流动性、财富和交易所基础设施
      - - Jane Street / Virtu / Citadel
        - 老牌跨资产替代类别
        - 庞大的跨资产流动性资产负债表和客户触达
        - 机构、ETP、本金流动性和价差敏感型资金流
        - 可通过更广泛的做市业务压缩价差并吸收资金流
        - 留存公开材料对发行方付费代币做市委托的直接证明有限
    notes: 各行只使用公开证据，并刻意保留未知的已实现价差、活跃客户数和私有 P&L。
