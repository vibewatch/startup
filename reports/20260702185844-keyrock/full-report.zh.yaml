  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前财务
        - 2025 年审计收入，以及 2026 年迄今收入、毛利率、EBITDA、现金、债务和交易资本。
        - 判断独角兽估值是否有真实盈利能力支撑。
        - CFO 数据室和审计师电话会议。
      - - 股权结构和条款
        - 股价、清算优先权、反稀释、董事会权利、附函，以及任何老股转让部分。
        - 把名义估值转化为实际投资人经济性。
        - 融资文件法律审阅。
      - - 收入质量
        - 做市、OTC、期权、链上、AWM 和任何顾问收入的服务线组合。
        - 区分耐久费用流和依赖成交量的交易收入。
        - 季度分部桥接和管理账审阅。
      - - 客户集中度
        - 头部客户、交易场所组合、留存和信用敞口。
        - 集中的客户账本可能让规模信号失真。
        - 交易对手集中度资料包和匿名客户分群数据。
      - - 监管经济性
        - MiCA、FCA 及其他适用司法辖区下的资本、合规和实体要求。
        - 判断监管进展是在增加利润率，还是只增加固定成本。
        - 总法律顾问与合规团队按司法辖区审阅。
      - - AWM / 链上变现
        - 围绕 Turing 和 fija 的产品 AUM、费率表、金库经济性和客户采用情况。
        - 验证超出赚价差的溢价论点。
        - 产品 P&L 和客户访谈。
      - - BlockFills 整合
        - 留存客户、承接负债、整合时间表和协同目标。
        - 判断困境 M&A 是增厚收益，还是分散精力。
        - 收购整合备忘录和负债清单。
      - - 退出准备度
        - 董事会准备度、审计成熟度、投行反馈，以及现实的 IPO 或战略出售时间线。
        - 设定所需回报和持有期假设。
        - 董事会材料、投行电话和治理审阅。
    notes: 这些问题构成最低证据包；没有这套证据，建议不能从继续研究推进到买入。
    claimRefs:
      - CV047
      - CV048
      - CV052
      - CV053
      - CV059
      - CV060
