            body: >-
              具名证据是真实的，但集中在少数合作伙伴或渠道披露中。Finery Markets 给出最干净的生产证据：它公开称 Keyrock 以 Quote Streams
              机制中的流动性提供方身份加入，并明确把这段关系连接到机构交易对手方、加密和稳定币交易对，以及一个覆盖 40 个国家 150+ 家机构参与者的网络。Zodia Markets 和 Elwood
              提供了另一个强生产级案例，因为它们的公告把 Keyrock 描述为机构执行工作流中的流动性层，并明确称该集成降低了客户入驻摩擦。Deutsche Bank
              不是客户证据，但仍是有意义的运营证据，因为它显示银行通道和 FX 支持直接连接到 Keyrock 的 OTC 与做市工作流。[CU013] [CU014] [CU015] [CU016] [CU017]
              [CU018] [CU019]


              相比之下，发行方和交易场所层更浅。留存 AUSD 证据显示 Keyrock 公开宣布支持 Agora 的稳定币，Agora 也把 AUSD
              描述为机构级，但这段关系是通过社交媒体帖子的聚合报道可见，而不是通过留存的一手新闻稿可见。同样，Keyrock 的链上流动性页面点名 Okcoin、Kraken 和 Bitfinex
              为合作伙伴，却不给日期、范围或可衡量结果。净判断是：公开记录证明了关系广度，多于证明逐客户案例研究的深度。[CU020] [CU021] [CU022] [CU023] [CU024] [CU025]
