        title: 可比框架与市场结构类比
        blocks:
          - type: paragraph
            body: >-
              可比公司集合用于划定区间，而不是制造虚假精度。最近且最接近的私有锚点是 GSR：CoinDesk 和 SC Ventures 都称 GSR 在 2026 年 5 月估值超过 $1
              billion，验证了当战略银行买家参与时，机构加密流动性公司仍能拿到独角兽定价。Amber 2022 年 $3 billion 融资和 HashKey 2024 年超过 $1.2 billion
              的投前估值显示，在更好的市场窗口或交易所邻近生态里，历史上可以清算到怎样的价格，但这些锚点受周期和模型约束。Wintermute 和 B2C2 对判断模型形态更有帮助，对精确定价帮助较小，因为
              Wintermute 披露的是未附估值的 $20 million Series B，而 B2C2 通过 SBI 所有权和交易量提升证明战略买家价值。Flow Traders、Virtu、CME、Coinbase
              和 Nasdaq 等公开类比提供的是纪律：它们说明规模化流动性和市场结构业务可以很值钱，但这些公司也比 Keyrock 大得多、经过审计，结构也更宽。这个差异支持谨慎的私募市场折扣，而不是照搬公开市场倍数。
