  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Keyrock 实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Keyrock 不再把自己呈现为单一价差获取型做市商。官方产品面如今更像模块化数字资产流动性栈：交易所做市、OTC
              大宗交易、定制期权、链上流动性、生态发展，以及较新的资产与财富管理部门，都作为独立产品出现。这个广度很重要，因为同一买方可以把 Keyrock
              当作发行代币时需要流动性的代币发行方服务商、需要更紧订单簿的交易所服务商、需要 OTC 执行和 FX
              通道的机构服务商，或需要量化敞口与对冲工具的配置方服务商。模块地图也比泛化加密金融营销更具体。每个公开服务页都描述了具体工作流结果——订单簿优化、API 驱动 OTC 执行、定制执行价和到期日的期权、DEX
              滑点管理、验证者节点支持，或算法财富策略。战略延展路径同样明确：收购 Turing 增加了受监管基金管理壳和系统化策略，fija 则增加了 vault
              技术和链上分发基础设施。结果是一个可信的全服务产品论点，尽管它仍更多由公司自写描述支撑，而非客户层面的生产指标。
