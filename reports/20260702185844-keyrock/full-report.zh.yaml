    rows:
      - - 做市
        - 用算法提供流动性，在多个场所收窄点差、优化订单簿
        - 点差收入、返佣和固定服务费
        - 显然是长期核心业务；公开宣传覆盖 85+ 家交易所
        - 若足够分散，质量可能较高，但实际经济性未披露
        - 提供合作伙伴合同范式、留存点差和交易所返佣政策
      - - OTC 交易
        - 以本金交易关系打包执行、流动性和结算
        - 报价点差 / 本金加价
        - 24/7 运转，日均 OTC 交易 10K+ 笔，法币覆盖更广
