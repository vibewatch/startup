      - number: '6.3'
        title: 重复使用、先落地再扩张与耐久性代理
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据大量依赖代理。最干净的重复使用信号是运营性的：Keyrock 称每日执行超过 10,000 笔 OTC
              交易，这暗示持续流量关系，而不是零散试点，但它仍是公司自称的活动指标，不是经审计留存数据。更广的商业故事也指向交叉销售。Keyrock
              反复营销其在做市、OTC、期权、资产管理和生态发展上的定制支持，暗示一段关系可以始于流动性供给，随后扩展到 FX 支持的结算、期权、验证者工作，或面向资产配置方的纯多头和绝对 Alpha 产品。[CU027]
              [CU028] [CU032] [CU033]


              fija 线索是公开先落地再扩张的最强例子。Keyrock 先在 2023 年加速器中选中 fija，随后投资并与其合作，最终在 2026 年收购 fija，把其基础设施纳入 Keyrock
              核心链上栈。这个演进显示，Keyrock 能把生态关系转化为分发和产品扩张资产。但即便这项证据，也说明的是关系深度和产品扩张，而不是披露的续约数学。没有留存公开来源提供 Finery、Zodia、AUSD
