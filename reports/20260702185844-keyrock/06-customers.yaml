- id: named-proof-and-channel-quality
  title: Named proof, production quality, and channel evidence
  body: 'Named proof is real, but it is concentrated in a handful of partner or channel disclosures. Finery Markets gives the cleanest production proof: it publicly says Keyrock joined as a liquidity provider in the Quote Streams regime and explicitly ties the relationship to institutional counterparties, crypto and stablecoin pairs, and a network that reaches 150-plus institutional participants across 40 countries. Zodia Markets and Elwood provide another strong production-grade example because their release describes Keyrock as the liquidity layer inside an institutional execution workflow and explicitly says the integration reduces onboarding friction for clients. Deutsche Bank is not customer proof, but it is still meaningful operating proof because it shows banking rails and FX support tied directly to Keyrock’s OTC and market-making workflows. [CU013] [CU014] [CU015] [CU016] [CU017] [CU018] [CU019]


    By contrast, the issuer and venue layers are shallower. The retained AUSD evidence shows Keyrock publicly announcing support for Agora’s stablecoin and Agora describing AUSD as institutional grade, but the relationship is visible through syndicated coverage of a social-media post rather than a retained first-party newsroom release. Likewise, Keyrock’s onchain-liquidity page names Okcoin, Kraken, and Bitfinex as partners, yet gives no dates, scope, or measurable outcomes. Net: the public record proves more breadth of relationships than deep customer-by-customer case-study quality. [CU020] [CU021] [CU022] [CU023] [CU024] [CU025] [CU026]'
