- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Cross-sell breadth
    - Public pages market one relationship across market making, OTC, options, onchain, ecosystem work, and asset management
    - Supports higher wallet share per account if relationships are real and durable
    - Request attach rates by product and expansion revenue by cohort
  - - Regulatory procurement unlock
    - FCA and MiCA materials explicitly tie licenses to institutional clients and counterparties
    - Can shorten procurement cycles with regulated institutions
    - Request pipeline conversion before and after each license milestone
  - - Channel-led distribution
    - Finery and Zodia/Elwood integrate Keyrock liquidity into institutional workflows
    - Scales reach faster than one-by-one venue onboarding
    - Request revenue share, exclusivity, and overlap across distribution channels
  - - Named-proof concentration
    - The strongest public proofs center on Finery, Zodia/Elwood, AUSD, Deutsche Bank, and the fija/Turing expansion stories
    - Could imply dependence on a small number of flagship relationships in the public narrative
    - Request top-10 customer revenue concentration and churn history
  - - Onboarding / KYC / legal friction
    - Terms and risk documents require documentation, accept third-party dependency, and reference separate exchange terms
    - Can slow sales cycles and create operational drag
    - Request average onboarding time, legal redlines, and compliance staffing by region
  - - Counterparty and solvency exposure
    - Risk disclosure says clients may face third-party failures, regulatory seizures, and unsecured-credit exposure to Keyrock
    - Loss events could damage retention and reputation across multiple segments
    - Request custody model, insurance, collateral practices, and stress-event playbooks
  - - Distressed M&A expansion
    - BlockFills network access comes from a bankrupt target
    - May bring reach, but also integration complexity and weaker inherited customer quality
    - Request post-close conversion, overlap, and retention metrics for acquired accounts
  notes: 'The table mixes upside expansion levers with downside concentration and procurement risks because the public evidence set makes them inseparable: most growth proofs are channel or regulatory in nature.'
