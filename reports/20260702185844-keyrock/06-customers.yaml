  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-concentration
    missingEvidence: Current paying-customer count plus revenue concentration by top 5 and top 10 accounts across venues, OTC, issuer/protocol, and asset-management segments.
    whyItMatters: Breadth metrics can mask dependence on a few flagship relationships, which changes revenue durability and downside risk.
    diligencePath: Request a customer-concentration table from management with logo count, revenue share, geography, and tenure by major service line.
    relatedQuestionRefs:
    - QU014
    - QU020
    relatedTableRefs:
    - TU002
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, and renewal rates by service line and by top institutional accounts.
    whyItMatters: Without retention metrics, public customer proof can establish adoption but cannot underwrite durability or expansion quality.
    diligencePath: Request cohort retention data for the last eight quarters, broken out across market making, OTC, onchain, and asset management.
    relatedQuestionRefs:
    - QU015
    - QU016
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: named-exchange-and-issuer-case-studies
    missingEvidence: First-party customer or issuer case studies from named exchanges, protocols, or issuers describing why they hired Keyrock and what changed after go-live.
    whyItMatters: Logo surfaces and syndicated quotations are weaker than customer-owned deployment narratives for proving commercial quality.
    diligencePath: Ask management for reference calls or customer-authored case studies covering at least one venue, one issuer, and one protocol relationship.
    relatedQuestionRefs:
    - QU007
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: service-line-revenue-mix
    missingEvidence: Revenue mix and gross margin by market making, OTC, onchain liquidity, options, and asset management.
    whyItMatters: Cross-sell claims are only valuable if newer product lines produce durable, incremental economics rather than narrative breadth alone.
    diligencePath: Request management revenue bridge showing growth by service line for 2024, 2025, and 2026 year-to-date.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: market-count-methodology
    missingEvidence: A single disclosed methodology reconciling 400-plus markets in the 2024 OTC post with 1,300-plus and 1,400-plus claims in 2026 materials.
    whyItMatters: The direction of growth is clear, but the exact counting basis matters if investors want to use market-count growth as a KPI.
    diligencePath: Ask management how it defines a market, whether derivatives count, and which data set underlies each published figure.
    relatedQuestionRefs:
    - QU003
    - QU004
    relatedTableRefs:
    - TU002
