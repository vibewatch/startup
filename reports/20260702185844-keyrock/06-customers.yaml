- id: concentration-regulatory-friction-and-downside
  title: Concentration, regulatory friction, and downside evidence
  body: 'The downside evidence in this chapter is less about public churn events and more about counterparty, onboarding, and disclosure risk. Keyrock’s own risk disclosure is unusually direct: clients and counterparties bear third-party failure, regulatory action, and Keyrock solvency risk, and may end up as unsecured creditors. Its terms also require AML and KYC documentation and acknowledge separate exchange terms, which means institutional onboarding is legally and operationally heavy. FCA and MiCA approvals help on that front, but they are procurement enablers rather than proof that customers are sticky once signed. [CU036] [CU037] [CU038] [CU039]


    Concentration risk is also unresolved. The strongest named proofs sit in a relatively small public set—Finery, Zodia and Elwood, Deutsche Bank, Agora, and the fija/Turing ecosystem expansion stories—while the rest of the record leans on breadth metrics or partner logos. CoinDesk’s BlockFills coverage suggests Keyrock may expand reach through an acquired institutional client network, but because the seller was bankrupt that should not be confused with organic retention or clean customer love. The right conclusion is that production usage is real, expansion logic is credible, and regulated distribution matters; the missing layer is still account-level durability and concentration disclosure. [CU040] [CU041] [CU042] [CU043] [CU044] [CU045] [CU046] [CU048]'
