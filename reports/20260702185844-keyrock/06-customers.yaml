artifact: customers
slug: keyrock
runDate: '2026-07-02'
company:
  name: Keyrock
chapter:
  number: 6
  title: Customers
  summary: 'Keyrock’s public customer evidence is strongest on real production channel relationships and breadth proxies—85-plus venues, 1,300-plus markets, 10K-plus daily OTC trades, and named institutional integrations with Finery Markets and Zodia-Elwood. The weak point is durability: public sources still do not disclose customer count, retention, contract tenure, or concentration, so the chapter can prove adoption and expansion logic more confidently than recurring revenue quality.'
sections:
- id: segments-and-adoption-surfaces
  title: Customer segments and adoption surfaces
  body: 'Keyrock’s customer picture is broad but not deeply enumerated. Official pages show six commercial surfaces—market making, OTC, options, asset management, onchain liquidity, and ecosystem development—rather than a single product line. Taken together, those surfaces imply at least five recurring segment buckets: venue operators, institutional counterparties and brokers, token issuers or DeFi protocols, market-structure providers, and asset allocators. The segment mix matters because it means the company is selling infrastructure into both trading venues and capital allocators instead of depending on one narrow buyer archetype. [CU001] [CU002] [CU003] [CU004] [CU005] [CU006] [CU007] [CU008]


    The strongest public adoption proxies are breadth metrics rather than customer-count disclosures. 2026 official and partner materials repeatedly place Keyrock above 85 venues, around 1,300 to 1,400 markets, and about 220 people across 37 countries, while a 2024 OTC expansion post had described 85 exchanges and 400-plus markets. That trajectory supports a real expansion story across venues and geographies, but it still says more about commercial surface area than about account count or revenue concentration. [CU009] [CU010] [CU011] [CU012]'
