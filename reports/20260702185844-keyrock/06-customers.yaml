- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: The typical public journey starts with a liquidity or market-structure need, moves through compliance and integration, and only rarely exposes renewal economics.
  approximationNotes: This journey map is synthesized from public service pages and named partner releases; it is not a disclosed CRM funnel.
  data:
    items:
    - label: Liquidity gap appears
      note: A venue, issuer, protocol, or institutional desk needs tighter spreads, deeper depth, or better execution.
    - label: Compliance and scope review
      note: KYC, legal terms, counterparty setup, and regulatory fit are established before go-live.
    - label: Service integration
      note: Keyrock plugs in via market making, OTC routing, onchain liquidity, or asset-management structures.
    - label: Operational go-live
      note: The relationship moves into live pricing, execution, liquidity management, or portfolio operations.
    - label: Cross-sell / channel expansion
      note: Some relationships widen into FX, options, validator support, asset management, or larger venue distribution.
    - label: Renewal visibility test
      note: Public evidence usually stops before revealing contract duration, concentration, or retention outcomes.
