- id: durability-repeat-usage-and-land-expand
  title: Repeat usage, land-and-expand, and durability proxies
  body: 'Public durability evidence is proxy-heavy. The cleanest repeat-usage signal is operational: Keyrock says it executes more than 10,000 OTC trades daily, which implies ongoing flow relationships rather than sporadic pilots, but it is still a company-claimed activity metric rather than audited retention data. The broader commercial story also points to cross-sell. Keyrock repeatedly markets tailored support across market making, OTC, options, asset management, and ecosystem development, suggesting that a relationship can begin with liquidity provision and later widen into FX-enabled settlement, options, validator work, or long-only and absolute-alpha products for asset allocators. [CU027] [CU028] [CU032] [CU033]


    The fija arc is the strongest public land-and-expand example. Keyrock first selected fija in the 2023 accelerator, then funded and partnered with it, and finally acquired it in 2026 to bring its infrastructure inside Keyrock’s core onchain stack. That progression shows Keyrock can turn an ecosystem relationship into a distribution and product-expansion asset. But even that proof is about relationship depth and product expansion, not about disclosed renewal math. No retained public source gives customer count, NRR, churn, contract duration, or cohort renewal data for Finery, Zodia, AUSD, or any other named relationship. [CU029] [CU030] [CU031] [CU034] [CU035] [CU047]'
  claimRefs:
  - CU027
  - CU028
  - CU029
  - CU030
