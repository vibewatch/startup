tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public scale / proof
  - Strategic value
  - Main gap
  rows:
  - - Venue operators / exchange books
    - Exchange or venue operator buys; traders and treasury teams use; commercial payer undisclosed
    - Order-book depth, price alignment, market stability
    - '>85 venues and >1,300 markets in 2026 materials; exchange aggregation on market-making page'
    - Core venue-distribution base for liquidity services
    - No public venue-by-venue revenue mix or contract tenure
  - - Institutional OTC counterparties and brokers
    - Qualified counterparties buy; trading desks and treasury teams use; payer is the institution
    - Bespoke OTC execution, settlement, and routing
    - 10K+ OTC trades daily; Deutsche Bank FX and multi-currency support; FCA registration for UK clients
    - Recurring flow business with room for cross-border growth
    - No disclosed customer count, average ticket size, or renewal data
  - - Token issuers / stablecoin teams
    - Issuer or treasury sponsor buys; end users and market participants benefit; payer likely project treasury
    - Launch and maintain secondary-market liquidity
    - Agora AUSD support claim; market-making page promises stronger liquidity and adoption
    - Issuer relationships can create high-visibility flagship mandates
    - AUSD proof is medium-confidence and lacks disclosed volumes
  - - DeFi protocols / ecosystems
    - Protocol foundation or DAO-like operating team buys; traders and TVL providers use; payer is treasury or ecosystem budget
    - TVL attraction, slippage management, validator support, operational feedback
    - Onchain-liquidity and ecosystem-development pages; tens of billions of supported volume across major networks
    - Deepens exposure to onchain growth and land-and-expand services
    - Named protocol case studies remain thin in the retained public record
  - - Market-structure providers / liquidity hubs
    - ECN, execution, or liquidity-hub operator buys; institutional clients use; payer likely infrastructure platform
    - Embed Keyrock liquidity into institutional workflows
    - Finery Quote Streams relationship; Zodia–Elwood–Keyrock integration
    - Scales distribution through channels instead of one-by-one venue onboarding
    - Channel economics, exclusivity, and client overlap are undisclosed
  - - Institutional asset allocators / private investors
    - Institutional client or private investor allocates; portfolio managers and advisers use; payer is investor or managed account
    - Absolute alpha, smart beta, portfolio management, tokenized debt rails
    - Asset & Wealth Management launch, fund pages, and Sygnum/Obligate bond issuance
    - Broadens wallet share beyond execution-only services
    - Public materials do not disclose AUM by customer, mandates, or retention
  notes: Segmentation is inferred from public service pages and named counterparties; it maps observable commercial surfaces rather than disclosed revenue segmentation.
