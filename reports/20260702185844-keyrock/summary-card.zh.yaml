  topStrengths:
    - MiCA 牌照和 FCA 注册带来监管进展，提升了机构可信度。
    - 产品宽度已覆盖做市、OTC、期权、链上流动性、生态系统服务和资产管理。
    - SC Ventures 的战略背书，加上银行和交易场所集成，说明 Keyrock 确实切入了市场结构层。
    - 业务触达 85+ 交易场所、37 个国家，员工约 220 人；以一家私营加密流动性公司衡量，规模已经不小。
  topRisks:
    - 当前收入、盈利能力、集中度和股权结构条款未公开披露。
    - Series C 滚动交割叠加未披露的优先权，可能让 $1.1B 头部估值误导新投资人。
    - 业务仍暴露在加密市场交易量周期、点差压缩，以及交易对手或交易场所失效风险下。
    - 多司法辖区监管义务和 24/7 运营复杂度，抬高了控制和合规风险。
    - 新产品尚未证明可持续变现之前，收购和相邻业务扩张可能增加执行风险。
  unresolvedGaps:
    - 经审计的 2025 年和 2026 年至今财务数据，包括按服务线拆分的收入和毛利率。
    - Series C 已交割的准确募资额、投资人权利、清算优先权，以及是否包含老股交易。
    - 交易所、OTC 和协议侧的客户集中度、留存，以及头部交易对手敞口。
    - 风险资本、流动性缓冲，以及在严重市场和交易对手冲击下的压力表现。
