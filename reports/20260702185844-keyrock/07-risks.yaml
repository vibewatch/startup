  - id: financial-model-people-and-thesis-breakers
    title: Financial model, people, and thesis-break criteria
    body: >-
      The financial and execution risks are best framed as underwriting opacity plus model breadth.
      Keyrock's own Series C materials say the capital is meant to strengthen the balance sheet,
      expand services, and fund acquisitions. That is a useful signal because it confirms the
      company itself views capital, not just code, as strategic infrastructure. But the same public
      corpus still withholds the metrics needed to translate that narrative into a loss model: exact
      closed proceeds, audited revenue, spread capture, inventory limits, customer concentration,
      stablecoin mix, failed-settlement rates, and service-line capital at risk are all absent from
      the reviewed record. The people picture has a similar shape. Active compliance and multi-city
      hiring indicate the firm is investing in control functions, yet public evidence still leaves
      open whether independent model validation, treasury oversight, post-acquisition integration
      management, and follow-the-sun incident response are staffed at the level the platform now
      requires. Analogous public market makers make the residual exposure clear: trading income can
      be highly sensitive to volatility, spreads, inventories, outages, and counterparty defaults.
      For investors, that means the Keyrock thesis should stay alive only while licensing converts
      into clean execution, acquisitions remain controlled, and management closes the public
      disclosure gap fast enough to support a unicorn-stage underwriting burden.
    claimRefs:
