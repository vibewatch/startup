  - id: twenty-four-seven-operations-and-control-surface
    title: 24/7 operations and control surface
    body: >-
      The second risk cluster is operational. Keyrock is no longer just claiming generic
      crypto-liquidity expertise; it publicly markets 24/7 market making across more than 85
      exchanges, OTC execution and settlement in one relationship, options structures where it is
      the direct counterparty, and active onchain liquidity management with slippage targets and TVL
      objectives. That breadth creates a wide control surface in which errors can propagate quickly:
      venue outages, corrupted market data, failed settlement, over-hedged or under-hedged options
      books, smart-contract exploits, stablecoin disruptions, or slippage-management failures can
      all reach clients before a human review cycle catches them. Keyrock's own risk disclosure is
      unusually explicit that clients bear third-party failure risk, smart-contract risk, and even
      unsecured-credit exposure if Keyrock or a provider becomes insolvent. The public mitigants are
      directionally positive—algorithmic risk management, 24/7 staffing, and a regulation-first
      posture—but the public record still does not show incident history, kill-switch thresholds,
      failed-settlement rates, reconciliation controls, or post-trade loss metrics. That means the
      residual question is not whether the company understands the risk vocabulary. It is whether
      the invisible control infrastructure is scaling as fast as the visible venue and product
      footprint.
    claimRefs:
      - CR008
      - CR009
