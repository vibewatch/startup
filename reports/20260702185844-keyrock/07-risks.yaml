  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk cluster
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Regulatory scaling risk
        - MiCA passporting / permission evidence
        - No clear public evidence of passported-country coverage, service scope, or resolved Liechtenstein review by the next refresh cycle
        - Treat EU scaling upside as delayed and haircut growth assumptions
      - - Venue / counterparty enforcement risk
        - Exchange, token, or client offboarding events
        - Any regulator, bank, or venue action that forces Keyrock to suspend a major asset, venue, or client cohort
        - Reduce confidence immediately and reassess concentration and legal perimeter
      - - Settlement rail risk
        - Bank or stablecoin interruption
        - More than one material freeze, redemption delay, or failed-settlement incident on a core rail within a quarter
        - Assume working-capital friction is structural and widen downside scenarios
      - - 24/7 trading control risk
        - Operational-loss or outage indicators
        - Repeated unexplained slippage spikes, kill-switch activations, erroneous trades, or prolonged venue-routing disruptions
        - Move the case from growth underwriting to containment and incident-review mode
      - - Acquisition / integration risk
        - Post-close control slippage
        - Inherited liabilities widen, client retention falters, or integration milestones slip across Turing, fija, or BlockFills
        - Pause credit for expansion synergies until control evidence catches up
      - - Disclosure-gap risk
        - Financial and concentration evidence
        - No audited revenue, capital-at-risk, concentration, or stablecoin / venue-mix disclosure after the Series C final-close period
        - Do not underwrite to a unicorn narrative on public evidence alone
    notes: >-
      The thresholds are intentionally monitorable rather than abstract; the public record supports
      trigger-based risk management better than a point-estimate loss model.
