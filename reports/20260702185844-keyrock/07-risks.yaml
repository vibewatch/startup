  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: concentration-and-capital-at-risk
      missingEvidence: Exact customer concentration, venue concentration, service-line capital-at-risk, inventory limits, and VaR / stress metrics by business line.
      whyItMatters: Without these numbers, the risk chapter can rank issues and define triggers, but it cannot translate them into a grounded probability-weighted loss model.
      diligencePath: Request audited risk packs, concentration reports, treasury / VaR dashboards, and limit frameworks by market making, OTC, options, AWM, and onchain activities.
      relatedQuestionRefs:
        - QR027
        - QR032
      relatedTableRefs:
        - TR004
        - TR005
    - type: missing-source
      severity: material
      topic: regulatory-entity-mapping
      missingEvidence: Exact MiCA-passported countries and services, plus final status of the Liechtenstein filing and any service restrictions by legal entity.
      whyItMatters: The public record shows licensing momentum but not the full jurisdiction-by-product map that would determine where regulatory friction can still break the scaling story.
      diligencePath: Obtain regulator confirmations, entity-by-entity permissions, passport notifications, and legal memos mapping every service line to a supervising authority.
      relatedQuestionRefs:
        - QR033
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: incident-history-and-controls
      missingEvidence: Historical outage logs, failed-settlement rates, kill-switch activations, error budgets, reconciliation metrics, and post-incident remediation summaries.
      whyItMatters: The company publicly describes a large 24/7 operating surface, but not the evidence needed to judge whether controls are scaling with that surface.
      diligencePath: Request incident-review packs, operational KPI dashboards, venue-routing exception reports, and independent controls testing.
      relatedQuestionRefs:
        - QR029
        - QR034
      relatedTableRefs:
        - TR002
        - TR005
    - type: private-evidence-only
      severity: material
      topic: stablecoin-and-settlement-mix
      missingEvidence: Stablecoin issuer mix, chain mix, custody mapping, and contingency waterfalls for bank, chain, or issuer freezes.
      whyItMatters: Public legal terms from Circle and Tether show real freeze and downtime rights, but Keyrock's own exposure to those rails is not visible.
      diligencePath: Request treasury policy, issuer limits, settlement-rail concentration by flow, and emergency substitution playbooks.
      relatedQuestionRefs:
        - QR019
        - QR030
        - QR032
      relatedTableRefs:
        - TR003
        - TR005
    - type: private-evidence-only
      severity: minor
      topic: acquisition-integration-kpis
      missingEvidence: Day-100 integration plans, inherited-liability ring-fencing, client-retention KPIs, and control attestations for Turing, fija, and BlockFills.
      whyItMatters: Keyrock is broadening the business through acquisitions, but public evidence does not yet show whether those additions are reducing or increasing residual operational and legal risk.
      diligencePath: Request integration-office cadence, legal due-diligence summaries, capital allocations, and post-close control ownership for each acquired asset.
      relatedQuestionRefs:
        - QR022
        - QR023
        - QR024
        - QR025
      relatedTableRefs:
        - TR003
        - TR004
