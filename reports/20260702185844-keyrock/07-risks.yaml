    rows:
      - - MiCA passporting and activity-perimeter execution
        - EU / France
        - Licensed through Keyrock FR SAS in June 2026; passporting is part of the expansion story,
          but exact country-by-country notifications are not public here
        - Medium
        - Critical
        - MiCA licence, FCA registration, AML framework, stated security and transparency posture
        - Obtain exact passported services, host states, and any activity restrictions before
          underwriting EU scale
      - - Travel Rule, AML, and sanctions traceability burden
        - EU plus cross-border client and venue flows
        - EU rules now require originator / beneficiary data handling, enhanced due diligence for
          some high-risk transfers, and internal restrictive-measures controls
        - High
        - High
        - MLRO, KYC, sanctions screening, suspicious-activity reporting, instruction-refusal rights
        - Request alert volumes, false-positive rates, sanctions escalation playbooks, and
          independent testing results
      - - U.S. enforcement spillover and token-classification risk
        - Venue roster, listed assets, and U.S.-touching client activity
        - SEC, CFTC, OFAC, and FinCEN actions against major exchanges show customer-asset,
          securities, derivatives, AML, and sanctions failures can quickly become platform-wide
          issues
        - Medium
        - Critical
        - Regulation-first messaging, entity strategy, and refusal rights in risk terms
        - Demand venue-due-diligence standards, restricted-token policy, and U.S.-nexus escalation
          criteria
      - - Stablecoin and issuer-control legal risk
        - Global settlement rails
        - Circle and Tether both reserve rights to block, freeze, suspend, or limit services under
          legal, compliance, fork, or security scenarios
        - Medium
        - High
        - Multi-jurisdiction licensing and Deutsche Bank fiat/FX rails offer partial alternatives
        - Request issuer concentration by flow, redemption contingency plans, and legal review of
          freeze / forfeiture scenarios
      - - Product-scope creep across AWM, OTC, options, and onchain
        - Cross-product regulatory perimeter
        - AWM expansion, options, and onchain products widen the set of services that may need
          jurisdiction-specific permissions and conduct controls
        - Medium
        - High
        - Turing acquisition, Liechtenstein filing under review, MiCA expansion narrative
        - Map each service line to the legal entity, licence, and jurisdiction that carries it
    notes: >-
      Rows rank the highest-signal legal and regulatory exposures visible from public materials;
      several lines remain partially mitigated because exact product-by-entity permissions are not
      yet fully public.
