chapter:
  number: 7
  title: Risks
  summary: >-
    Keyrock's strongest public de-risking signals are regulatory and infrastructural—MiCA licensing,
    FCA registration, a published AML framework, and a Deutsche Bank settlement partnership—but the
    highest residual risks still cluster around multi-jurisdiction compliance, 24/7 control quality,
    external dependency concentration, and thin public disclosure on capital-at-risk. The public record
    supports a trigger-based risk view rather than a fully underwritten loss model: the company looks
    increasingly institutional, yet still depends on venues, banks, stablecoin issuers, and acquired
    businesses that can fail or reprice faster than the public evidence set can explain.
sections:
  - id: regulatory-and-legal-overhang
    title: Regulatory and legal overhang
    body: >-
      Keyrock has clearly reduced baseline legitimacy risk by securing a MiCA licence through Keyrock
      FR SAS and obtaining FCA registration for UK institutional market-making and OTC activity, but
      those wins do not remove regulatory risk; they change its shape. Public materials now show a
      company trying to scale across the EU, the UK, and additional jurisdictions while running
      activities that sit close to AML, sanctions, market-abuse, token-classification, and
      venue-supervision fault lines. The public rulebook is also becoming more explicit. The EU
      travel-rule regime requires crypto-asset service providers to pass originator and beneficiary
      data through the transfer chain, highlight higher-risk flows such as mixers and some
      self-hosted-wallet interactions, and maintain controls that are compatible with restrictive
      measures. At the same time, U.S. enforcement against Binance and Bittrex shows how venue,
      token, and sanctions failures can spill across counterparties even when the target company is
      not itself charged. The practical implication is that Keyrock's regulatory risk is not just
      whether it is licensed; it is whether the firm can keep its venue roster, client book, token
      perimeter, and settlement rails inside multiple fast-moving supervisory regimes without a
      misstep that forces offboarding, freezes assets, or narrows product scope.
    claimRefs:
