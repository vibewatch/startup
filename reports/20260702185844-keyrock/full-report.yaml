      - number: '2.2'
        title: 'Sizing lenses: adjacent capital pools are large, direct fee pools are not publicly disclosed'
        blocks:
          - type: paragraph
            body: >-
              Public sizing has to start with adjacent capital pools and then narrow aggressively. The broadest lens is
              the crypto asset base itself: CoinGecko currently tracks roughly $2.21 trillion of market cap across more
              than 16,000 cryptocurrencies and almost 1,500 exchanges. That is useful context but a poor revenue proxy
              because most of that value is not paying a market maker at any given moment. A tighter lens is the
              settlement and collateral layer. Stablecoins now sit around $308 billion to $312 billion across CoinGecko,
              DeFiLlama, and a16z, while a16z says stablecoins processed $9 trillion of adjusted annual volume and hold
              more than $150 billion in U.S. Treasuries. Another institutional lens is regulated wrapper demand: a16z
              says over $175 billion sits in Bitcoin and Ethereum exchange-traded products, while Farside's daily tables
              show cumulative net inflows of about $50.9 billion for U.S. spot bitcoin ETFs and $10.9 billion for spot
              ether ETFs through 2 July 2026. A still narrower bridge market is tokenized RWAs, where CoinGecko reports
              $19.3 billion at end-Q1 2026, Cointelegraph cites $23.6 billion in early March 2026 using DeFiLlama, and
              a16z describes a roughly $30 billion market. Those differences are exactly why this chapter preserves
              conflicting estimates instead of pretending there is one clean TAM.
