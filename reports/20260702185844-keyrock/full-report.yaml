  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Exchange-liquidity services
        - >-
          Continuous quoting, spread management, inventory balancing, routing, and venue coverage for listed digital
          assets.
        - Passive holdings, custody-only balances, and untraded token inventory.
        - Exchanges, brokers, electronic trading venues, and large token issuers.
        - Core market because fragmentation and best-execution problems are where professional market makers get paid.
      - - Token-liquidity and launch mandates
        - >-
          Listing support, treasury-backed liquidity programs, secondary-market support, and venue rollout for newly
          issued or thinly traded tokens.
        - Primary issuance advisory, token legal structuring, or generic marketing spend.
        - Foundations, DAOs, treasuries, token issuers, and ecosystem funds.
        - Important wedge because token proliferation continually creates new liquidity onboarding work.
      - - OTC, options, and institutional risk transfer
        - Block execution, hedging, options support, and cross-venue risk warehousing around volatile assets.
        - Long-only fund management, passive ETF holdings, or custody without execution.
        - Institutions, trading desks, treasury-product sponsors, and sophisticated holders.
        - Relevant because institutional wrappers and treasury products need underlying liquidity and hedging support.
      - - Onchain / DEX liquidity infrastructure
        - >-
          Liquidity deployment on DEXs, treasury-product trading support, stablecoin routing, and onchain
          price-discovery support.
        - General smart-contract development that does not touch trading or settlement liquidity.
        - Protocols, stablecoin issuers, tokenized-asset sponsors, and onchain treasuries.
        - Increasingly relevant as DEX share, stablecoins, and tokenized assets grow.
      - - Adjacent but excluded pools
        - Market cap, stablecoin supply, ETF assets, and tokenized balances used only as context or demand proxies.
        - Treating all crypto asset value as direct serviceable revenue.
        - Investors, holders, issuers, and treasury managers.
        - Necessary exclusion so TAM does not capitalize idle balances as if they were liquidity-service revenue.
    notes: >-
      Included spend focuses on paid liquidity outcomes; excluded pools are demand or balance-sheet context rather than
      direct outsourced market-making revenue.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM037
      - CM038
      - CM039
