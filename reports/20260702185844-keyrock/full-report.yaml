              asked for audited 2025 and year-to-date 2026 financials, service-line revenue mix, gross margin,
              counterparty concentration, trading-capital usage, and a full post-Series-C cap table including any
              preference stack. The committee also needs evidence that the new adjacencies are commercial rather than
