              tokenized debt for its own financing; and June 2026 added MiCA passporting. That sequence makes the
              product story more believable: connectivity, regulation, treasury rails, onchain tooling, and quant talent
              all move in the same direction. Differentiation appears strongest in three places: European regulatory
              posture, the breadth of liquidity modalities under one roof, and the visible quantitative-engineering
              stack around Rust, low-latency trading, and data infrastructure. The main caveat is evidence asymmetry.
