            body: >-
              The comp set supports range-setting, not false precision. The closest fresh private anchor is GSR:
              CoinDesk and SC Ventures both place GSR above a $1 billion valuation in May 2026, which validates that
              institutional crypto-liquidity firms can still attract unicorn pricing when a strategic bank buyer is
              involved. Amber's 2022 $3 billion round and HashKey's 2024 $1.2 billion-plus pre-money show where better
              market windows or exchange-adjacent ecosystems have cleared historically, but those are cycle- and
              model-specific. Wintermute and B2C2 help more with model shape than with exact price, because Wintermute
