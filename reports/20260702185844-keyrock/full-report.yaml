      - number: '2.4'
        title: Growth drivers, constraints, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are now visible in public data. Institutional wrapper demand is real, not
              hypothetical: ETP holdings are large, stablecoins are mainstream, and tokenized RWA and RWA-perp volumes
              are compounding quickly. DEX share is materially higher than a few years ago, and 24/7 market structure
              means traders, issuers, and treasuries need continuous liquidity rather than market-hours-only support. At
              the same time, regulation cuts both ways. MiCA gives Europe a usable framework for crypto-asset services
              and cross-border scaling, but the FSMA's CASP summary makes clear that authorization, conduct, capital or
              insurance, governance, and market-abuse controls raise fixed costs. BIS and IMF are constructive on
              tokenization's long-run potential, yet both stress that sound market design, monetary anchors, and
              governance still matter. Constraints remain structural: capital intensity, inventory risk, counterparty
              selection, venue trust, and heterogeneous exchange quality do not disappear just because the asset class
              is bigger. The SEC's spot-Bitcoin ETP statement explicitly warned that many crypto platforms remain
              non-compliant and conflict-prone, while CoinDesk's exchange benchmark shows top-tier venue quality is
              still scarce relative to the number of venues available. The final diligence warning is economic, not
              narrative: public sources quantify adjacent capital pools, but they do not disclose the fee pool, spread
              economics, client concentration, or capital turns that would convert those pools into a defendable SOM for
              Keyrock.
