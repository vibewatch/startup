  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal overhang
        blocks:
          - type: paragraph
            body: >-
              Keyrock has clearly reduced baseline legitimacy risk by securing a MiCA licence through Keyrock FR SAS and
              obtaining FCA registration for UK institutional market-making and OTC activity, but those wins do not
              remove regulatory risk; they change its shape. Public materials now show a company trying to scale across
              the EU, the UK, and additional jurisdictions while running activities that sit close to AML, sanctions,
              market-abuse, token-classification, and venue-supervision fault lines. The public rulebook is also
              becoming more explicit. The EU travel-rule regime requires crypto-asset service providers to pass
              originator and beneficiary data through the transfer chain, highlight higher-risk flows such as mixers and
              some self-hosted-wallet interactions, and maintain controls that are compatible with restrictive measures.
              At the same time, U.S. enforcement against Binance and Bittrex shows how venue, token, and sanctions
              failures can spill across counterparties even when the target company is not itself charged. The practical
              implication is that Keyrock's regulatory risk is not just whether it is licensed; it is whether the firm
              can keep its venue roster, client book, token perimeter, and settlement rails inside multiple fast-moving
              supervisory regimes without a misstep that forces offboarding, freezes assets, or narrows product scope.
