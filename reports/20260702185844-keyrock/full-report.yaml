  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Keyrock's public file supports a diversified trading-and-infrastructure revenue model rather than a single
              spread-capture story. The core engine is still market making: Keyrock says it aggregates data from more
              than 85 exchanges, optimizes order books, tightens spreads, and provides analytics to partners. But the
              revenue stack now extends well beyond that base. OTC trading is positioned as a bespoke principal-trading
              relationship with settlement bundled into the service; the options desk sells custom structures for
              hedging, treasury management, and yield enhancement; onchain liquidity and ecosystem-development work add
              strategic-liquidity, validator, and technical-support lanes; and the 2025 asset-and-wealth-management
              launch adds fund-like products such as Absolute Alpha and Smart Beta. What remains missing is realized
              pricing. Keyrock markets every major service as tailored, and the reviewed site does not publish fee
              cards, spread-share formulas, management-fee schedules, or revenue-recognition policy. The right financial
              reading is therefore that monetization breadth is credible and improving, but the actual conversion from
              service breadth into revenue quality still depends on contract-level diligence.
