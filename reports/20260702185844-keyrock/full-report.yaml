    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from credible scale and regulation signals to a research-more call because economics and
      structure remain undisclosed.
    data:
      nodes:
        - id: n1
          label: Fresh $1.1B Series C
          detail: Strategic validation from SC Ventures and Ripple
        - id: n2
          label: Scale proof
          detail: 220 employees, 37 countries, 85 venues, broad product stack
        - id: n3
          label: Regulatory and adjacency upside
          detail: MiCA, FCA, Turing, and fija add option value
        - id: n4
          label: Opaque economics
          detail: Revenue, margin, concentration, and cap-table terms are private
        - id: n5
          label: Market and execution risk
          detail: Volumes cooled and BlockFills adds integration risk
        - id: n6
          label: 'Decision: research-more'
          detail: Do not buy the headline mark without private diligence
      edges:
        - from: n1
          to: n6
          label: validation helps but does not solve price risk
        - from: n2
