              SBI ownership and volume lift. Public analogs such as Flow Traders, Virtu, CME, Coinbase, and Nasdaq
              matter for discipline: they show that scaled liquidity and market-structure businesses can be valuable,
              but they are also far larger, audited, and structurally broader than Keyrock. That difference argues for a
