              has more than one monetization lane, is adding regulated product breadth, and has kept winning investor
              support through a difficult digital-assets cycle. The 2026 Series C at a $1.1 billion valuation, plus the
              2025 Turing and 2026 Fija transactions, shows a company using capital to widen both services and
              regulatory reach. That is the strength case. The blocker case is just as clear: there is still no public
              view into revenue by stream, gross margin, burn, runway, debt, concentration, or retention; even the
              precise Series C dollar amount remains undisclosed in the official release. Comparable filings suggest a
              meaningful capital-and-fixed-cost burden is likely, but they cannot substitute for Keyrock's own audited
              numbers. For diligence purposes, the priority is not another headline valuation article. It is direct
              evidence on cash, revenue mix, margin by service line, and the regulatory-capital demands of the expanding
