      - number: '8.2'
        title: Thesis, anti-thesis, and scenario logic
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Keyrock is moving from a pure crypto market maker toward a regulated digital-asset
              infrastructure platform. The evidence behind that thesis is concrete: Turing Capital created an
              asset-and-wealth-management division, fija broadened onchain distribution, and MiCA plus FCA progress
              improve institutional credibility and addressable geography. Those moves could raise the quality of the
              revenue mix if they turn into recurring client mandates rather than one-off strategic announcements. The
              anti-thesis is equally important. Keyrock's own risk disclosures remind counterparties that insolvency
              claims can rank unsecured and that digital-asset losses may not be compensable. Market backdrop also
              softened in early 2026, with centralized volumes down in both February and Q1, which matters because
              market-making revenue is usually volume and volatility sensitive. That combination makes scenario work
              essential. The bull case depends on monetized adjacencies and cleaner structure, the base case treats $1.1
              billion as fair but under-supported, and the bear case reflects volume pressure, hidden terms, or
              acquisition and regulatory setbacks.
