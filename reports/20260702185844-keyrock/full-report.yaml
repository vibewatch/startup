      - number: '3.3'
        title: Pricing, packaging, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Pricing is where the public record gets weakest, and that weakness is itself a competitive finding.
              Keyrock's retained official materials speak extensively about depth, bespoke execution, transparency, and
              regulation-first execution, but they do not publish spreads, retainers, or rebate structures. That is
              common across the category. GSR discloses breadth and minimum trade size, not realized economics. B2C2
              discloses product packaging but not client-specific spreads. Cumberland is the clearest exception in the
              retained set because it explicitly says it charges no fees and instead bakes economics into principal
              pricing. Wintermute's 2021 funding release similarly framed OTC as no-fee, spread-led execution. Amber
              claims competitive pricing, but not the actual price card. This means buyers likely select and switch
              providers through negotiated economics, credit, onboarding friction, legal terms, and execution quality
              rather than through a public list-price comparison. Public product design still implies moderate rather
              than high switching cost. Keyrock, GSR, B2C2, and Cumberland all advertise API, electronic, or desk-style
              workflows that make multi-homing plausible. What slows switching is not a visible proprietary lock-in
              layer; it is KYC, counterparty limits, settlement confidence, credit, and the operational cost of running
              too many liquidity relationships at once.
