      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The commercial market splits into two primary wedges: exchange-liquidity services and token-liquidity
              services, with institutional wrappers now forming a third catalyst. Token issuers and foundations
              typically fund launch-phase and ongoing liquidity because they need tighter spreads, deeper order books,
              venue coverage, and support around listings before organic order flow is self-sustaining. Centralized
              exchanges, brokers, and execution venues buy liquidity data, routing intelligence, and market-quality
              support because fragmented books make best execution and venue selection non-trivial. Asset managers, ETF
              sponsors, stablecoin issuers, and tokenized-treasury platforms become payers when their products require
              underlying quoting, hedging, and reliable secondary-market depth to scale distribution. Onchain protocols
              and DEX ecosystems are also meaningful users because more settlement, collateral, and price discovery now
              occur onchain rather than solely on centralized venues. The operational users are usually trading desks,
              treasury teams, risk managers, listing teams, and market-structure or data teams; the economic buyer is
              more often the foundation treasury, exchange management, product sponsor, or institutional distribution
              lead. This segmentation matters because Keyrock-like providers are not simply selling 'liquidity' to one
              monolithic buyer. They are selling differentiated combinations of inventory commitment, connectivity,
              execution quality, and market-access support to several payer classes whose adoption triggers differ.
