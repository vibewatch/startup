  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Keyrock merits a research-more recommendation rather than a buy at the March 2026 headline price. The
              positive evidence is real: the company and SC Ventures both confirm a $1.1 billion Series C, the business
              now spans market making, OTC, options, onchain liquidity, and asset management, and the operating
              footprint has reached 220 employees across 37 countries and 85 venues. Those are credible late-stage scale
              signals for a private crypto-liquidity platform. The problem is not company relevance; it is underwriting
              discipline. The round remains a rolling close, the company would not disclose the amount already raised,
              and the only public sizing guide from The Block is that proceeds could reach $100 million over the coming
              months. Public sources still do not reveal revenue, profitability, margin, concentration, or the security
              terms that determine real investor economics. At $1.1 billion, the price may be plausible, but the
              evidence is still too thin for a buy call.
