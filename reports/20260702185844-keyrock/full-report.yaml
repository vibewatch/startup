companyProfile:
  summary: >-
    Keyrock was founded in Brussels in 2017 and has grown from a crypto market-making specialist into a broader
    digital-asset infrastructure platform. Public 2026 materials support a business that now spans market making, OTC
    trading, options, onchain liquidity, ecosystem development, and asset and wealth management; operates across 85+
    venues and 37 countries; and employs about 220 people. Strategic credibility improved further with FCA registration,
    a MiCA licence through Keyrock FR SAS, a Deutsche Bank settlement partnership, and a March 2026 Series C led by SC
    Ventures at a $1.1B valuation. The investment case is strategically interesting, but the public file remains
    materially incomplete on economics, round structure, and downside protections.
