      - number: '1.3'
        title: Funding history, scale signals, and footprint
        blocks:
          - type: paragraph
            body: >-
              Keyrock's financing history is directionally clear even though the exact lifetime total is not. The
              retained record shows a EUR 4.3 million financing in October 2020, a $72 million Series B in November
              2022, and a March 2026 Series C led by SC Ventures with continued support from Ripple at an announced $1.1
              billion valuation. The major caution is that the 2026 round was announced as a rolling close. Official
              materials never disclosed how much cash had actually closed on announcement day, while Tech.eu reported
              the round could reach $100 million by June 2026. Tracxn offers a $79.4 million lifetime-funding estimate
              across five rounds, but that figure is third-party and does not reconcile cleanly to the still-open Series
              C narrative, so it should be treated as a low-confidence placeholder rather than a canonical total.


              Scale signals are stronger than revenue signals. Official 2026 materials repeatedly describe a 220-strong
              or 220+ team operating across 37 countries, while Tracxn lists 223 employees as of March 2026. The
              footprint is partly verifiable through named addresses in Brussels, London, Paris, and Seychelles, and
              partly through expansion and regulatory posts pointing to the U.S., Brazil, France, Liechtenstein, and
              Switzerland. Careers pages also show live hiring in Zurich, New York, London, and Brussels. That is enough
              to conclude Keyrock is genuinely multi-jurisdictional, but not enough to map the full office network or
              employee distribution by legal entity. Revenue, ARR, and customer count remain absent from the reviewed
              public corpus, so public scale is being signaled primarily through geography, hiring, and product breadth
              rather than disclosed economics.
