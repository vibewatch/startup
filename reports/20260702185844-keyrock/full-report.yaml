      - number: '7.3'
        title: Dependency and counterparty concentration
        blocks:
          - type: paragraph
            body: >-
              Keyrock's newest public milestones also reveal how much of its growth case is partner-mediated. The
              Deutsche Bank relationship improves fiat and FX operations with multi-currency accounts, integrated FX
              services, and near-instant settlement, which is a real mitigation for global OTC and market-making
              activity. But a mitigation can also be a concentration point: when more settlement, FX, and account
              infrastructure is consolidated into a smaller set of banking rails, operational resilience depends on a
              third party's risk appetite, compliance posture, uptime, and jurisdictional tolerance for crypto clients.
              The same logic applies to exchange and stablecoin dependencies. Venue access can be impaired by
              enforcement or de-risking, while Circle and Tether both reserve legal rights to block addresses, freeze
              balances, delay redemptions, or withdraw support from chains and forks. On top of that, Keyrock is
              layering acquisitions and adjacencies—Turing Capital, fija, and the planned BlockFills purchase—into the
              operating stack. Those moves can add clients, strategies, venues, and fund structures, but they also
              import integration, legal, and counterparty complexity from outside the core engine. The public dependency
              picture is therefore broader and more nuanced than a simple exchange list: Keyrock increasingly depends on
              banks, issuers, venues, and acquired platforms that it does not fully control.
