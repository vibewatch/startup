  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Keyrock should not be benchmarked against one rival or one narrow product surface. The most relevant
              direct peer set is crypto-native firms that combine exchange market making with institutional OTC or
              token-issuer support: GSR, Wintermute, B2C2, Cumberland DRW, Auros, and to a lesser extent Amber and
              HashKey. Those firms overlap with Keyrock on at least one of the core jobs that matter to token issuers,
              exchanges, funds, or institutions: keep order books tight, move inventory discreetly, provide credit or
              execution workflow, and help counterparties cross from centralized to decentralized venues. A second class
              consists of adjacent but powerful incumbents such as Flow Traders, Jane Street, Virtu, and Citadel
              Securities. Public evidence does not make them retained like-for-like token-issuer market makers, but it
              does show that they can compress spreads, intermediate listed crypto products, and absorb institutional
              flow with stronger balance-sheet or reporting credibility. A third class consists of substitutes rather
              than vendors: onchain concentrated-liquidity pools, exchange-direct liquidity programs, and internal
              execution teams built by sophisticated exchanges or funds. For Keyrock, the real question is therefore not
              whether another firm can quote two-way prices, but which class combines trust, breadth, and workflow depth
              in a way that is hard for buyers to replace.
