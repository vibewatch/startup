- id: milestone-trajectory-and-risk
  title: Milestones, regulation, and adverse evidence
  body: >-
    Keyrock's public milestone arc is coherent and gives later chapters a stable chronology of record. After 2017 founding and a 2020 financing to fund infrastructure and licensing, the company used 2022 to secure a large Series B and then used 2023 through mid-2026 to broaden product scope, regulatory coverage, and geographic reach. The milestones are notable for how often regulation and product expansion move together: France and Liechtenstein registrations preceded MiCA, the U.S. and Brazil entity launches followed product and institutional-sales expansion, and the Turing Capital and fija acquisitions both added capabilities beyond classic market making. By June 2026, the MiCA licence through Keyrock FR SAS gave the company a cleaner EU scaling story than most private crypto-liquidity peers can show publicly.


    Adverse evidence is thinner than the growth narrative, but it is not absent. The strongest retained adverse source is Keyrock's own risk-disclosure statement, which is unusually explicit about total-loss scenarios, third-party failures, regulatory seizures, and unsecured-credit exposure to the firm. CoinDesk also reported a planned acquisition of bankrupt BlockFills, which is not an adverse event on Keyrock itself but does place the company in a distressed-asset context. Outside those items, the retained public sources did not surface a discrete enforcement action, litigation filing, or layoff event specific to Keyrock by run date. That means the major diligence concern is not an obvious public blow-up; it is the mismatch between a unicorn-stage narrative and relatively thin public disclosure on governance, revenues, customers, and exact financing terms.
