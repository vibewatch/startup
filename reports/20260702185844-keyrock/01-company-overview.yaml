company:
  name: Keyrock
chapter:
  number: 1
  title: Company Overview
  summary: Keyrock is a Brussels-founded digital-asset investment group that has expanded from market making into OTC, options, regulated asset management, and ecosystem services while building a 220+ person footprint across 37 countries. Official and third-party 2026 sources align on a March 2026 Series C led by SC Ventures at about a $1.1 billion valuation, but exact round size, lifetime capital raised, revenue, customer count, and full board disclosure remain publicly incomplete.
sections:
- id: identity-and-positioning
  title: Identity, headquarters, and business model
  body: >-
    Keyrock's public identity is internally consistent across its homepage, company profile, and 2026 financing materials: it is a Brussels-founded digital-asset investment group built to provide liquidity and market infrastructure rather than a single-point crypto broker. The official service stack now spans market making, OTC, options trading, asset and wealth management, and ecosystem or onchain support. That breadth matters because it shows the company is no longer pitching only a spread-capture market-making engine; it is positioning itself as a multi-line infrastructure provider for institutions and token projects that need execution, liquidity, and strategy under one roof.


    Public positioning also leans heavily on the idea that traditional finance is moving toward tokenized markets and that Keyrock is the bridge for that transition. The company repeatedly frames its role as helping institutions navigate digital assets with confidence, and the 2026 Series C materials describe Keyrock as providing financial expertise structured for digital-asset markets. The combination of Brussels roots, a private Series C stage, and a self-described multi-service platform supports a late-stage-but-still-private profile. What remains missing is commercial transparency: reviewed public materials do not disclose revenue, ARR, or customer count, so the business-model story is much better evidenced than the monetization profile.
