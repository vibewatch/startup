- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: >-
    The retained founder set is well supported for Kevin de Patoul, Jeremy de Groodt, and Juan David Mendieta. Kevin remains the central public spokesperson across financing, regulation, and expansion announcements, which reinforces both founder continuity and some key-person concentration. Public biographies also make the leadership bench legible enough to see functional coverage: Eric Beckwith is presented as CIO, Francesco Adiliberti as COO, and Stef Wynendaele as the current CCO after a 2026 promotion. Earlier releases also show Keyrock broadening leadership beyond the founders, including Robert Valdes-Rodriguez in commercial leadership and Adiliberti in operations after his earlier role as an independent board member.


    Governance disclosure is materially thinner than leadership disclosure. The company publishes an AML/CFT framework with named control functions and a risk-disclosure statement that explicitly warns counterparties about asset loss, third-party failures, regulatory action, and Keyrock solvency risk. That is useful evidence that compliance and counterparty-risk language are not being hidden. But the same public record does not disclose a full current board roster, committee structure, or investor control terms following the Series C. The prompt-supplied founder name Juan David Perez is also not supported by the retained record; the reviewed official and profile sources consistently identify Juan David Mendieta in the CSO co-founder role.
