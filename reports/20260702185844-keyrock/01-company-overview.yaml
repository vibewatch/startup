  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-control-rights
    missingEvidence: A current board roster, committee structure, observer rights, and investor control terms are not public in retained sources.
    whyItMatters: Governance visibility matters for assessing oversight quality, founder dependence, and downside protections after the Series C.
    diligencePath: Request the latest board deck, cap table, investor rights agreement summary, and governance org chart from management.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: series-c-size-and-capital-raised
    missingEvidence: Exact Series C proceeds to date, final close timing, any secondaries, and a reconciled lifetime-capital figure are not publicly disclosed.
    whyItMatters: The magnitude and structure of the 2026 round shape dilution, runway, and whether the unicorn valuation is backed by primary cash or a partially open process.
    diligencePath: Request the signed financing summary, post-money cap table, and round waterfall showing primary versus any secondary proceeds.
    relatedQuestionRefs:
    - QO016
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-customers
    missingEvidence: No retained public source disclosed revenue, ARR, customer count, or concentration metrics.
    whyItMatters: Without commercial metrics, investors cannot calibrate whether the $1.1 billion valuation reflects durable earnings power or primarily narrative and market position.
    diligencePath: Request audited or management financials, customer cohort summaries, top-customer concentration, and recurring-revenue definitions.
    relatedQuestionRefs:
    - QO019
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: footprint-by-jurisdiction
    missingEvidence: Public sources show several entities, addresses, and hiring locations, but not a complete office list or headcount by country.
    whyItMatters: Jurisdictional footprint affects regulatory cost, management complexity, and the real operating leverage behind the 37-country claim.
    diligencePath: Request a legal-entity register and employee-by-country snapshot tied to licensed activities.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
    - TO004
  - type: access-blocked
    severity: minor
    topic: blocked-third-party-profiles
    missingEvidence: LinkedIn and Crunchbase company pages were fetched but remained rate-limited or JavaScript blocked during this run.
    whyItMatters: Those pages could have offered extra external triangulation on employee-band and funding-summary metadata, even if not primary evidence.
    diligencePath: Re-run those URLs from an authorized browser session or obtain screenshots with timestamps for the diligence file.
    relatedQuestionRefs:
    - QO017
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
