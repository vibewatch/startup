  topStrengths:
    - Regulatory progress via MiCA licensing and FCA registration improves institutional credibility.
    - >-
      Product breadth now spans market making, OTC, options, onchain liquidity, ecosystem services, and asset
      management.
    - Strategic backing from SC Ventures plus banking and venue integrations suggests real market-structure relevance.
    - >-
      Global operating reach across 85+ venues, 37 countries, and roughly 220 employees indicates meaningful scale for a
      private crypto-liquidity firm.
  topRisks:
    - Current revenue, profitability, concentration, and cap-table terms are not publicly disclosed.
    - >-
      A rolling-close Series C and hidden preferences can make the headline $1.1B valuation misleading for new
      investors.
    - >-
      The business remains exposed to crypto-market volume cycles, spread compression, and counterparty or venue
      failures.
    - Multi-jurisdiction regulatory obligations and 24/7 operational complexity raise control and compliance risk.
    - Acquisition and adjacency expansion may add execution risk before newer products prove durable monetization.
  unresolvedGaps:
    - Audited 2025 and year-to-date 2026 financials, including revenue by service line and gross margin.
    - Exact Series C proceeds closed, investor rights, liquidation preferences, and any secondary component.
    - Customer concentration, retention, and top-counterparty exposure across exchanges, OTC, and protocols.
    - Capital-at-risk, liquidity buffers, and stress performance under severe market and counterparty shocks.
