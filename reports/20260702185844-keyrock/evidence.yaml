evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-control-rights
    missingEvidence: >-
      A current board roster, committee structure, observer rights, and investor control terms are not public in
      retained sources.
    whyItMatters: >-
      Governance visibility matters for assessing oversight quality, founder dependence, and downside protections after
      the Series C.
    diligencePath: >-
      Request the latest board deck, cap table, investor rights agreement summary, and governance org chart from
      management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: series-c-size-and-capital-raised
    missingEvidence: >-
      Exact Series C proceeds to date, final close timing, any secondaries, and a reconciled lifetime-capital figure are
      not publicly disclosed.
    whyItMatters: >-
      The magnitude and structure of the 2026 round shape dilution, runway, and whether the unicorn valuation is backed
      by primary cash or a partially open process.
    diligencePath: >-
      Request the signed financing summary, post-money cap table, and round waterfall showing primary versus any
      secondary proceeds.
    relatedQuestionRefs:
      - QO016
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-customers
    missingEvidence: No retained public source disclosed revenue, ARR, customer count, or concentration metrics.
    whyItMatters: >-
      Without commercial metrics, investors cannot calibrate whether the $1.1 billion valuation reflects durable
      earnings power or primarily narrative and market position.
    diligencePath: >-
      Request audited or management financials, customer cohort summaries, top-customer concentration, and
      recurring-revenue definitions.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: footprint-by-jurisdiction
    missingEvidence: >-
      Public sources show several entities, addresses, and hiring locations, but not a complete office list or headcount
      by country.
    whyItMatters: >-
      Jurisdictional footprint affects regulatory cost, management complexity, and the real operating leverage behind
      the 37-country claim.
    diligencePath: Request a legal-entity register and employee-by-country snapshot tied to licensed activities.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO004
  - type: access-blocked
    severity: minor
    topic: blocked-third-party-profiles
    missingEvidence: >-
      LinkedIn and Crunchbase company pages were fetched but remained rate-limited or JavaScript blocked during this
      run.
    whyItMatters: >-
      Those pages could have offered extra external triangulation on employee-band and funding-summary metadata, even if
      not primary evidence.
    diligencePath: Re-run those URLs from an authorized browser session or obtain screenshots with timestamps for the diligence file.
    relatedQuestionRefs:
      - QO017
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-making-revenue-pool
    missingEvidence: >-
      Audited revenue split across token mandates, exchange-liquidity programs, OTC/options, and infrastructure or data
      services.
    whyItMatters: Without a revenue bridge, adjacent capital pools cannot be converted into a defensible SOM or valuation case.
    diligencePath: >-
      Request a management data-room schedule showing gross revenue, gross profit, and renewal rates by product line and
      client segment.
    relatedQuestionRefs:
      - QM010
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: capital-efficiency
    missingEvidence: >-
      Desk-level inventory turnover, hedge costs, rebate capture, capital usage, and risk limits by venue and asset
      class.
    whyItMatters: Capital intensity determines whether market-growth narratives translate into attractive unit economics.
    diligencePath: >-
      Request venue-level P&L bridges, inventory reports, and treasury or risk-policy materials for the trading
      business.
    relatedQuestionRefs:
      - QM017
      - QM021
  - type: private-evidence-only
    severity: material
    topic: client-concentration
    missingEvidence: >-
      Customer concentration and contract structure across exchanges, foundations, ETF or treasury-product sponsors, and
      protocols.
    whyItMatters: >-
      A concentrated client base could make market share look stronger than it is and raise renewal or counterparty
      risk.
    diligencePath: Request top-20 client gross-profit mix, term length, churn history, and any performance-linked pricing terms.
    relatedQuestionRefs:
      - QM011
      - QM012
      - QM014
  - type: conflicting-data
    severity: minor
    topic: current-rwa-sizing
    missingEvidence: >-
      A normalized bridge explaining the date, asset-class, and inclusion differences across CoinGecko, Cointelegraph or
      DeFiLlama, a16z, and RWA.xyz measures.
    whyItMatters: >-
      Preserving contradictory public estimates is better than false precision, but valuation work still needs a
      harmonized bridge.
    diligencePath: >-
      Rebuild the current RWA market from product-level balances and normalize by observation date, included
      instruments, and whether derivatives are counted.
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing opacity
    missingEvidence: Realized spreads, token-loan economics, retainers, rebates, and credit terms across Keyrock and direct peers.
    whyItMatters: >-
      The public record is strong on capability breadth but weak on the actual economics that determine switching
      behavior and margin durability.
    diligencePath: >-
      Request anonymized client term sheets, sample issuer contracts, and spread or rebate reports by venue and client
      type.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer stickiness
    missingEvidence: >-
      Renewal rates, wallet share, venue concentration, and win-loss data showing whether Keyrock’s breadth converts
      into retention.
    whyItMatters: >-
      Without customer-level evidence, the chapter can describe breadth and regulation but cannot fully underwrite moat
      durability.
    diligencePath: >-
      Request top-customer concentration, renewal history, venue concentration, and case studies showing cross-sell from
      market making into OTC or asset management.
  - type: missing-source
    severity: minor
    topic: exchange direct economics
    missingEvidence: >-
      Accessible official exchange liquidity-program economics that can be compared directly with third-party
      market-maker mandates.
    whyItMatters: >-
      Exchange-direct and internalized liquidity are real substitutes, but the retained public evidence is stronger on
      their existence than on their commercial economics.
    diligencePath: >-
      Collect current exchange LP or market-maker program terms from the specific venues that matter most to Keyrock
      clients.
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: series-c-proceeds
    missingEvidence: >-
      The final closed dollar amount of the rolling Series C round and any later close participants beyond the publicly
      named leads.
    whyItMatters: >-
      Without the final gross proceeds the chapter cannot state lifetime capital raised or infer how much fresh
      liquidity is actually available for balance-sheet support and acquisitions.
    diligencePath: >-
      Request the final closing memo, cap-table update, or board materials showing gross and net Series C proceeds by
      close date.
    relatedQuestionRefs:
      - QI013
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Monthly and trailing-12-month revenue by stream plus revenue-recognition policy for market making, OTC, options,
      onchain, and asset-management activities.
    whyItMatters: >-
      Without stream-level revenue the chapter cannot test revenue quality, concentration, or the extent to which newer
      businesses are diluting or improving economics.
    diligencePath: Request a management revenue bridge and sample customer contracts covering each major service line.
    relatedQuestionRefs:
      - QI019
      - QI026
      - QI027
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current unrestricted cash, restricted cash, monthly burn, runway, and any internal liquidity stress scenarios.
    whyItMatters: Runway is the central blocker to underwriting capital adequacy and next-round dependency.
    diligencePath: Request treasury reports, board materials, or monthly management accounts covering liquidity and cash burn.
    relatedQuestionRefs:
      - QI020
      - QI025
      - QI028
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-regulatory-capital
    missingEvidence: >-
      Prime-broker lines, revolving facilities, collateral arrangements, entity-level regulatory-capital requirements,
      and covenant packages.
    whyItMatters: >-
      Trading businesses can appear equity-rich while still being constrained by collateral haircuts, borrowing bases,
      or regulated-capital floors.
    diligencePath: >-
      Request the debt schedule, credit agreements, prime-broker terms, and entity-by-entity regulatory-capital
      calculations.
    relatedQuestionRefs:
      - QI017
      - QI024
      - QI025
    relatedTableRefs:
      - TI004
  - type: access-blocked
    severity: material
    topic: annual-accounts-access
    missingEvidence: >-
      Extractable annual-account statements from the National Bank of Belgium consultation portal or PDF exports of the
      filed accounts.
    whyItMatters: >-
      Direct filed statements could materially improve confidence on revenue, profit, and balance-sheet items for the
      Belgian entity.
    diligencePath: >-
      Retrieve the accounts through a browser-assisted registry session or obtain PDFs directly from management or
      counsel.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Customer concentration, NRR, churn, ACV, realized spread or premium capture, and segment-level payback by channel.
    whyItMatters: >-
      These are the inputs needed to distinguish a durable institutional franchise from a volume-rich but economically
      thin trading business.
