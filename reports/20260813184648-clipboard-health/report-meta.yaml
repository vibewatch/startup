companyProfile:
  summary: Clipboard Health is a San Francisco-based healthcare staffing marketplace founded in 2016 by Wei Deng. Its product connects healthcare facilities with local clinicians who browse and book open shifts through a mobile workflow, with especially strong public proof in long-term care, hospice and home health. The company reached a disclosed $1.3 billion post-money valuation in its February 2022 Series C and now shows meaningful public scale signals, but official sources describe clinicians as independent contractors, making labor-model durability a central diligence issue.
  foundedDate: '2016-01-01'
  founders:
    - name: Wei Deng
      role: Founder
      background: Publicly identified founder of Clipboard Health.
      claimRefs: [CO003]
  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: Two-sided staffing marketplace that lets facilities post shifts and lets clinicians discover, instantly book, complete and get paid for those shifts through a mobile-first workflow, with identity verification, location-aware matching and support services layered in.
  customerFocus: Long-term care, home health and hospice, hospitals, and adjacent healthcare settings needing rapid contingent staffing coverage.
  businessModel: Facilities pay Clipboard for filled shifts while clinicians use the app to access flexible work; public materials indicate the clinician side operates under an independent-contractor model.
  stage: Late-stage private / unicorn
  fundingStatus: Series B of $50M in 2021 led by IVP followed by a $30M Series C that closed in February 2022 led by Sequoia Capital at a $1.3B post-money valuation; public sources say total financing exceeded $90M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO006, CO024, CO025, CO026]
summary:
  headline: Clipboard Health has built a large and operationally credible healthcare staffing marketplace, but public evidence still leaves too much uncertainty on revenue quality, retention and contractor-model resilience to recommend underwriting the old unicorn mark aggressively.
