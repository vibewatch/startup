  topStrengths:
    - Real marketplace scale with 6,500+ workplaces, 9M+ shifts covered, and 125,000+ workers earning $1,000+ on the platform.
    - Strongest public customer proof in post-acute settings, where case studies cite faster fill times, repeat clinicians, geographic expansion and lower admin burden.
    - Multiple public indicators of profitable growth, including Business Wire's 2022 profitability description and later company messaging that it has been profitable for years.
    - Mobile-first product workflow with instant booking, fast payout, biometrics, location-aware operations and 24/7 support infrastructure.
    - Public growth history and a 2022 $1.3B financing indicate investors once saw genuine category leadership potential.
  topRisks:
    - Official sources describe clinicians as independent contractors, creating material worker-classification and wage-hour risk.
    - "Public financial visibility is weak: the key $313.7M 2024 ARR figure comes from a low-confidence tracker rather than audited company disclosure."
    - Worker complaints around support, payouts and dispute handling raise supply-side trust and operational-quality concerns.
    - Privacy and biometric workflows create sensitive compliance exposure across HIPAA-adjacent, California privacy and BIPA-style regimes.
    - Public comp analysis suggests the old unicorn mark already embeds a large premium over current healthcare staffing and labor-marketplace multiples.
  unresolvedGaps:
    - Audited 2024-2026 revenue, gross margin, cash flow and working-capital data.
    - Facility retention, repeat-booking, churn and concentration metrics by segment and geography.
    - State-by-state legal analysis, claims history and reserve posture for the contractor model.
    - Incident rates, support SLAs, payout-dispute resolution data and biometric verification accuracy metrics.
    - A fuller valuation model using enterprise value, forward growth and margin-adjusted peer buckets.
