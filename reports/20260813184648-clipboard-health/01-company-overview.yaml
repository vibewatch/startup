callouts:
  - calloutType: strength
    title: Real operating scale is visible in official customer-facing pages
    body: >-
      Unlike many private marketplaces that hide behind generic claims, Clipboard publishes clear
      top-of-funnel and operating proof points such as workplaces served, shifts covered, fill rates,
      repeat-booking rates and customer case studies. That improves diligence quality even though the
      company still withholds audited financials.
    claimRefs: [CO010, CO011, CO016, CO017, CO034, CO035, CO036, CO037]
  - calloutType: risk
    title: Governance and labor-structure opacity remain material overview issues
    body: >-
      The public site is clear that clinicians use Clipboard as independent contractors, but it is not
      equally clear about board composition, exact current headcount, lifetime capital structure or
      how labor classification is managed across states. Those omissions make later financial and risk
      judgments heavily dependent on third-party and litigation sources.
    claimRefs: [CO006, CO014, CO022, CO030, CO038]
