company:
  name: Clipboard Health
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Clipboard Health is a San Francisco-founded healthcare staffing marketplace that has broadened
    into long-term care, home health, hospice, hospitals and dental staffing. Official pages show
    strong operating scale — 6,500+ workplaces, 9 million shifts covered and 125,000 workers who
    earned more than $1,000 — while public financing and revenue disclosure remain uneven: the
    company confirmed a $50M Series B and $30M Series C at a $1.3B valuation, but lifetime funding,
    current headcount, profitability depth and audited 2024 ARR are still not fully transparent.
sections:
  - id: identity-and-business-model
    title: Identity, headquarters and business model
    body: >-
      Clipboard Health operates an app-based healthcare labor marketplace that lets facilities post
      open shifts and lets healthcare professionals browse and instantly book them. Public company,
      legal and marketplace pages consistently describe the product as a two-sided platform rather
      than a traditional agency branch network. The business is now branded through clipboardworks.com,
      but the legal and marketing materials still tie back to Clipboard Health and Twomagnets LLC.
      The company was founded in 2016, is described by Y Combinator and Tracxn as San
      Francisco-based, and says its mission is to “uplift as many communities as possible” by
      connecting people with care. The current official FAQ and terms matter strategically: they say
      professionals use Clipboard as independent contractors, not as W-2 employees, and facilities
      pay transparent hourly rates plus selected premiums such as holiday pay or agreed differentials.
      That structure supports speed and flexibility, but it also means the platform's compliance and
      worker-classification posture is a core diligence issue rather than a solved differentiator.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO038]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: scale-and-segment-focus
    title: Scale, segment focus and operational footprint
    body: >-
      Clipboard's own pages present a business that is already operating at national scale, although
      exact point estimates vary by page and should be treated as company-claimed. The homepage says
      more than 6,500 workplaces and 1 million workers across the United States use Clipboard, while
      the About page says the platform has covered 9 million shifts, served 6,500 communities and
      enabled 125,000 workers to earn more than $1,000. Y Combinator describes Clipboard as the
      leader in long-term-care staffing that is rapidly expanding into home health, hospitals and
      more, and the segment pages reinforce that message with category-specific operating metrics:
      the long-term-care page says 4.9K facilities rely on Clipboard and 5 million shifts were posted
      in 2025, while the home-health and hospice page says more than 50% of shifts are filled within
      two hours and 11,000 patients have been cared for. The precision of worker-network figures is
      inconsistent across pages, but the directional story is clear: Clipboard has achieved broad
      supply density and uses repeat-booking and speed claims as the center of its value proposition.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO034, CO035, CO036, CO037]
    tableRefs: [TO002]
    figureRefs: [FO001]
  - id: leadership-governance-and-capital
    title: Founder story, leadership opacity and capital history
    body: >-
      Founder Wei Deng remains the central public face of the company. Her founder note on the About
      page frames Clipboard as a mission-led company built to lift families with limited resources,
      and a Y Combinator interview recounts the company's multiple pre-product pivots before landing
      on healthcare staffing. Leadership visibility beyond Deng is uneven. The public careers page
      shows “Bo” as co-CEO and lists Warren as chief financial and business officer, but the company
      does not publish a full executive roster, board composition or independent-director detail on
      its main website. That governance opacity stands in contrast to the relative clarity of the 2022
      financing milestone: Clipboard confirmed an IVP-led $50 million Series B in 2021, a Sequoia-led
      $30 million Series C that closed in February 2022, and a $1.3 billion post-money valuation.
      Business Wire described the company as profitable in 2022 and said it had achieved 25x gross
      revenue growth over the preceding 18 months. A later company blog meta description says
      Clipboard has been profitable for years, but there is no audited public income statement,
      and third-party trackers disagree modestly on lifetime capital raised and 2024 ARR.
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033]
    tableRefs: [TO003, TO005]
  - id: milestones-and-verdict
    title: Milestones, evidence quality and overview verdict
    body: >-
      The most important milestones visible in public evidence are the 2016 founding, repeated model
      pivots before product-market fit, rapid pandemic-era growth, the unannounced 2021 Series B, the
      February 2022 Series C at a $1.3 billion valuation, and the post-2022 expansion from long-term
      care into adjacent settings such as home health, hospitals and dental staffing. Customer stories
      show how that expansion is being packaged for facilities: The Vineyards says Clipboard reduced
      time-to-fill to one hour and converted three marketplace workers into full-time hires; Quiet
      Embrace says 90% of shifts are staffed by repeat clinicians; Starlight says it expanded from one
      county to six and added five patients in two months; Holistic Care says Clipboard-supported
      coverage expansion drove 25% revenue growth and 40-plus new cases. Together these sources support
      the view that Clipboard is more than a pre-scale gig app. At the same time, the chapter's
      evidence base is still incomplete on audited revenue, exact current headcount, formal governance,
      and whether the independent-contractor model creates latent labor risk that could offset the
      marketplace's speed advantages.
    claimRefs: [CO023, CO024, CO025, CO030, CO031, CO032, CO034, CO035, CO036, CO037]
    tableRefs: [TO004]
    figureRefs: [FO002]
