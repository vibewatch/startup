  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: classification-defense
      missingEvidence: Internal legal analysis, state-by-state classification memos, arbitration history and any active or threatened labor disputes.
      whyItMatters: The contractor model is the core public risk and cannot be underwritten from marketing and regulator guidance alone.
      diligencePath: Request outside-counsel memos, claims history, reserves and state heat maps.
      relatedQuestionRefs: [QR001, QR002, QR003, QR020]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: incident-and-complaint-metrics
      missingEvidence: Safety incident counts, severity rates, support SLAs, payout dispute metrics and root-cause analyses.
      whyItMatters: Public anecdotes show risk themes but not frequency or whether controls are improving.
      diligencePath: Review trust-and-safety dashboards, QA reviews and complaint-resolution trend lines.
      relatedQuestionRefs: [QR006, QR007, QR008, QR022]
    - type: private-evidence-only
      severity: material
      topic: privacy-and-security-controls
      missingEvidence: Security audits, biometric vendor agreements, retention/deletion evidence, penetration tests and privacy-incident history.
      whyItMatters: Sensitive-data compliance risk is visible publicly but control maturity is not.
      diligencePath: Request security package, privacy program materials and vendor-management files.
      relatedQuestionRefs: [QR011, QR012, QR013, QR014, QR015]
    - type: private-evidence-only
      severity: minor
      topic: policy-concentration
      missingEvidence: Revenue and operations exposure by state, segment and regulatory regime.
      whyItMatters: Policy shocks are more dangerous if the business is concentrated where enforcement or rule changes are most adverse.
      diligencePath: Map GMV, facilities and active workers by jurisdiction against active policy changes.
      relatedQuestionRefs: [QR016, QR021]
