evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-governance
    missingEvidence: Exact board composition, independent-director count, investor rights and governance committees.
    whyItMatters: Governance quality affects minority-investor protection, founder oversight and litigation response capacity.
    diligencePath: Request the current board list, charter documents, voting agreements and side letters from the data room.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
      - TO005
  - type: stale
    severity: material
    topic: revenue-verification
    missingEvidence: Audited 2024 revenue, ARR and profitability bridge instead of tracker-based summaries.
    whyItMatters: >-
      Later financial and valuation conclusions hinge on whether the reported $313.7M figure is real, recurring and
      profitable.
    diligencePath: Request audited financial statements, management accounts and cohort-level revenue by facility type.
    relatedQuestionRefs:
      - QO021
  - type: conflicting-data
    severity: minor
    topic: funding-totals
    missingEvidence: Reconciled lifetime-funding figure across company statements and trackers.
    whyItMatters: The difference between $90M+, $91.9M and $94.1M is not thesis-breaking, but it signals cap-table opacity.
    diligencePath: Obtain the cap table and round-by-round financing schedule from counsel or finance.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO004
      - TO005
  - type: conflicting-data
    severity: minor
    topic: worker-network-size
    missingEvidence: A reconciled definition for worker-network size across homepage, segment pages and active-worker cohorts.
    whyItMatters: >-
      Marketplace liquidity is central to the thesis, but official pages appear to mix registered workers with active
      supply.
    diligencePath: Request active-worker, credentialed-worker and repeat-worker cohort definitions by trailing month.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: Exact facility markup, gross margin and role-by-role pricing waterfall.
    whyItMatters: >-
      The business model is visible qualitatively, but unit economics cannot be underwritten from public pricing pages
      alone.
    diligencePath: Request standard rate cards, facility invoicing examples and contribution-margin analysis by segment.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: tam-precision
    missingEvidence: A reconciled, bottom-up SAM and SOM model for Clipboard by segment and geography.
    whyItMatters: Open-access market reports disagree materially on 2026 size and do not isolate Clipboard's served niches.
    diligencePath: >-
      Request internal GMV, active-facility counts and shift volume split by long-term care, home health, hospital and
      dental cohorts.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Revenue and shift mix by care setting, geography and customer size.
    whyItMatters: >-
      The investment case depends on whether Clipboard is really concentrated in attractive repeat local staffing
      pockets.
    diligencePath: Request monthly segment revenue, margin and customer-retention dashboards by vertical.
    relatedQuestionRefs:
      - QM004
      - QM019
      - QM020
      - QM021
  - type: stale
    severity: minor
    topic: travel-vs-local-spend
    missingEvidence: A fresh 2026 public benchmark that splits per diem local staffing from travel-nurse spend more cleanly.
    whyItMatters: >-
      Broad healthcare-staffing TAM figures can overstate Clipboard's addressable market if they lean too heavily on
      travel-nursing categories.
    diligencePath: >-
      Pull SIA or hospital-system procurement benchmarks that disaggregate local per-diem, float-pool and travel
      categories.
    relatedQuestionRefs:
      - QM002
      - QM013
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Internal data on who signs contracts, who posts shifts and who approves spend at the account level.
    whyItMatters: >-
      Buyer mapping influences sales-cycle length, upsell potential and defensibility versus MSP or internal float-pool
      alternatives.
    diligencePath: Request CRM and account-implementation data for the top 100 accounts.
    relatedQuestionRefs:
      - QM015
      - QM017
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Account-level win/loss data versus ShiftMed, CareRev, Aya, AMN and local agencies.
    whyItMatters: Public positioning shows who matters, but not where Clipboard actually wins or loses by segment and customer size.
    diligencePath: Request CRM win/loss codes, competitor tags and post-mortem notes for the last 12 months.
    relatedQuestionRefs:
      - QP001
      - QP014
      - QP025
  - type: private-evidence-only
    severity: material
    topic: retention-and-multi-homing
    missingEvidence: Facility retention, worker multi-app usage and repeat-booking cohort data.
    whyItMatters: Competitive durability depends on real switching costs and repeat behavior, not on case-study anecdotes.
    diligencePath: Request facility cohort retention, repeat-worker rates and off-platform conversion analysis.
    relatedQuestionRefs:
      - QP016
      - QP017
      - QP018
      - QP024
  - type: private-evidence-only
    severity: material
    topic: compliance-win-rate
    missingEvidence: Proof that Clipboard's contractor model does not reduce close rates or trigger unusual compliance objections.
    whyItMatters: ShiftMed's W-2 story could be a meaningful sales advantage if risk-sensitive buyers screen out contractor models.
    diligencePath: Review sales-objection logs, legal redlines and account losses attributed to worker classification.
    relatedQuestionRefs:
      - QP013
      - QP021
  - type: missing-source
    severity: minor
    topic: dental-competition
    missingEvidence: Better public direct evidence on dental-specific marketplace rivals versus Clipboard.
    whyItMatters: >-
