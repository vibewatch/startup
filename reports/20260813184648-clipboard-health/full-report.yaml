      - number: '3.2'
        title: Delivery model, classification and scale comparison
        blocks:
          - type: paragraph
            body: >-
              The most important competitive split is worker model. Clipboard's current FAQ and terms say the platform
              uses independent contractors. ShiftMed's homepage explicitly highlights local W-2 nurses, a positioning
              choice that can resonate with hospital and nursing-home buyers that want less classification ambiguity.
              CareRev appears to be marketplace-first and commitment-light, which puts it close to Clipboard on user
              experience even if its exact employment structure is not as prominently marketed. Trusted emphasizes the
              broader staffing and scheduling lifecycle, and Aya and AMN go further still into enterprise workflow, MSP
              and labor-management services. Scale also matters. Clipboard's public site shows 6,500+ workplaces, 9
              million shifts covered and 1 million workers, which is meaningful startup-scale density. But AMN says it
              supports 10,000+ clients and 2,000,000+ clinicians nationwide, while public-company data and filings show
              multibillion-dollar revenue bases and capital-market access that Clipboard lacks. In other words,
              Clipboard does not win on breadth or balance-sheet heft; it wins only where simplicity and speed matter
              more than enterprise process breadth.
