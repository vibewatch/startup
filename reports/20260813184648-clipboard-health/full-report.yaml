      - number: '3.3'
        title: Switching costs, multi-homing and moat durability
        blocks:
          - type: paragraph
            body: >-
              Competition is intense because both sides of the marketplace can multi-home. Clinicians can keep multiple
              apps on their phones, and facilities can route open shifts across internal float pools, agencies,
              ShiftMed, CareRev, Aya, AMN, People Powered-like local brokers or direct recruitment. That makes hard
              technological moats difficult. Clipboard's best moat candidate is local density inside messy,
              under-digitized staffing categories where fast response and repeat-worker trust are more important than
              enterprise reporting dashboards. Official case studies suggest some real continuity: Quiet Embrace says
              90% of shifts are staffed by repeat clinicians, and The Vineyards says Clipboard can fill shifts in an
              hour and also serve as a funnel for permanent hires. But those strengths are still behavioral, not
              contractual. Aya and AMN likely have the upper hand in procurement-led enterprise deals; ShiftMed has a
              stronger compliance story via W-2 labor; and CareRev's product model looks sufficiently similar that
              commoditization risk is real unless Clipboard's local fill rates and repeat-booking economics are
              materially better in its strongest segments.
