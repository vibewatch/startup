  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and functional modules
        blocks:
          - type: paragraph
            body: >-
              Clipboard's core product is a two-sided workflow connecting facilities that need coverage with
              professionals who want flexible local work. The public site and worker-app listings describe a consistent
              flow: facilities create shifts by role, date and time; qualified workers discover and book shifts
              instantly with no approval loop; Clipboard handles scheduling, documentation and payment; and facilities
              can invite reliable workers back for continuity. The product is clearly optimized for immediacy rather
              than long implementation cycles. App-store descriptions emphasize fast onboarding, flexible scheduling,
              instant pay, AM/PM/overnight shift discovery and control over where and when to work. Segment pages show
              the same workflow being repackaged into vertical modules for long-term care, home health and hospice,
              hospitals and dental. That suggests the product strategy is not distinct codebases by vertical but a
              common marketplace core with care- setting-specific trust, credential and staffing language layered on
              top.
