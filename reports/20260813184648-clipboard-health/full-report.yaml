            body: >-
              For a healthcare staffing marketplace, trust and compliance are as much product features as the booking
              interface. Clipboard's privacy policy says it can operate as a HIPAA business associate when facilities
              use the service to process protected health information. Its California notice says many important app
              features require Always and Precise Location permissions, and its biometric policy says Twomagnets uses
              facial-recognition technology and faceprints to verify professional identity under policies aligned with
              BIPA and Colorado privacy law. The site also discloses a California opt-out flow for information that
              could be treated as a sale under CCPA/CPRA and a 24/7 support promise. Taken together, these documents
              show a product built on identity, geolocation and documentation workflows that are operationally serious.
              The gap is that public materials still do not describe security certifications, uptime commitments,
              false-positive rates in biometric checks or dispute-resolution metrics at the level an enterprise
