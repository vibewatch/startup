        title: Milestones, evidence quality and overview verdict
        blocks:
          - type: paragraph
            body: >-
              The most important milestones visible in public evidence are the 2016 founding, repeated model pivots
              before product-market fit, rapid pandemic-era growth, the unannounced 2021 Series B, the February 2022
              Series C at a $1.3 billion valuation, and the post-2022 expansion from long-term care into adjacent
              settings such as home health, hospitals and dental staffing. Customer stories show how that expansion is
              being packaged for facilities: The Vineyards says Clipboard reduced time-to-fill to one hour and converted
              three marketplace workers into full-time hires; Quiet Embrace says 90% of shifts are staffed by repeat
              clinicians; Starlight says it expanded from one county to six and added five patients in two months;
              Holistic Care says Clipboard-supported coverage expansion drove 25% revenue growth and 40-plus new cases.
              Together these sources support the view that Clipboard is more than a pre-scale gig app. At the same time,
              the chapter's evidence base is still incomplete on audited revenue, exact current headcount, formal
              governance, and whether the independent-contractor model creates latent labor risk that could offset the
