      - number: '2.3'
        title: Buyer, user and payer segmentation plus adoption path
        blocks:
          - type: paragraph
            body: >-
              Clipboard's market mechanics are straightforward but sticky. The user is the clinician or aide who wants
              flexible local shifts and fast payment; the buyer is the facility operator, staffing coordinator, DON,
              unit manager or home-health scheduler; and the payer is ultimately the provider organization whose labor
              budget absorbs the shift cost and any premium paid for speed, holidays or differential coverage. Adoption
              is strongest where open shifts cause immediate operational pain — call-offs in nursing homes,
              census-driven visit demand in home health, overtime pressure in hospitals, or hygiene backlogs in dental
              offices. Official customer stories and segment pages suggest buyers care about three outcomes more than
              anything else: speed to fill, repeat-worker continuity and the ability to expand service area or census
              without hiring fixed full-time staff first. These are attractive use cases for a local marketplace, but
              they also create adoption constraints: facilities need confidence in credentials, continuity, HIPAA
              handling and labor classification, and some systems may prefer MSP vendors or internal float pools once
              they reach sufficient scale.
