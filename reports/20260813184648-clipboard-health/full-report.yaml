      - number: '4.5'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The public record supports a cautiously positive financial read with a large transparency discount.
              Clipboard looks more mature than an early-stage staffing app: pricing is real, scale is real, customers
              cite operational ROI, and the company has repeatedly been described as profitable. But almost every
              diligence question that matters for underwriting — take rate, gross margin, contribution margin by
              segment, bad-debt risk, worker-payment float, cash on hand, burn and cohort retention — is still private.
              That combination should keep investors from over-reading the headline ARR figure. The right next step is
              not a narrative debate about whether the business is “good” or “bad,” but a request for audited statements
              and cohort economics that can confirm whether Clipboard is a durable, profitable marketplace or just an
              efficiently run but still cyclical staffing intermediary.
