      - number: '1.2'
        title: Scale, segment focus and operational footprint
        blocks:
          - type: paragraph
            body: >-
              Clipboard's own pages present a business that is already operating at national scale, although exact point
              estimates vary by page and should be treated as company-claimed. The homepage says more than 6,500
              workplaces and 1 million workers across the United States use Clipboard, while the About page says the
              platform has covered 9 million shifts, served 6,500 communities and enabled 125,000 workers to earn more
              than $1,000. Y Combinator describes Clipboard as the leader in long-term-care staffing that is rapidly
              expanding into home health, hospitals and more, and the segment pages reinforce that message with
              category-specific operating metrics: the long-term-care page says 4.9K facilities rely on Clipboard and 5
              million shifts were posted in 2025, while the home-health and hospice page says more than 50% of shifts
              are filled within two hours and 11,000 patients have been cared for. The precision of worker-network
              figures is inconsistent across pages, but the directional story is clear: Clipboard has achieved broad
              supply density and uses repeat-booking and speed claims as the center of its value proposition.
