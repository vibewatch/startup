  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The starting point is simple but imperfect. Clipboard announced a $1.3 billion post-money valuation in its
              2022 Series C and Business Wire described the company as profitable, app-based and up 25x in gross revenue
              over the prior 18 months. TechCrunch likewise described the combined Series B and C as $80 million in
              financing. The most specific newer revenue datapoint available in the fetched corpus is GetLatka's 2024
              figure of $313.7 million, but that source is a low-confidence tracker rather than an audited filing.
              Clipboard's AI blog meta description separately suggests the company has been profitable for years, which
              points in a favorable direction but still does not replace board-quality financials. On that basis,
              valuation work has to rely on scenario analysis rather than a single clean comp multiple. The right read
              is not that the $313.7 million number is false; it is that investors should treat it as a provisional
              input that materially affects every downstream conclusion and widens the fair-value range materially for
              investors today.
            claimRefs:
              - CV001
              - CV002
