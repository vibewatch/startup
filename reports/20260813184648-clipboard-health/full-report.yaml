      - number: '2.4'
        title: Market verdict and sizing conclusion
        blocks:
          - type: paragraph
            body: >-
              Market quality is better than the recent travel-nurse headlines imply, but it is uneven by segment.
              Healthcare Business Today's 2026 outlook says the broader healthcare staffing market is returning to
              slight growth after contraction, while travel nursing in particular suffered a 36% revenue drop in 2024
              and is only stabilizing. That dynamic is actually helpful for Clipboard's niche if the company is truly
              concentrated in local, repeatable shift coverage rather than in premium travel contracts. The best public
              evidence supports a focused market thesis: there is a large national labor shortfall, a durable regulatory
              and cost tailwind in long-term care, and a facility buyer base that values flexible same-day coverage. The
              weak point is precision. Open data does not let us cleanly separate Clipboard's true SAM across long-term
              care, home health, hospital per diem and dental, or quantify how much of the company's current throughput
              comes from each segment. Market underwriting therefore should emphasize proven operating density and
              expansion economics over any single third-party TAM figure.
            claimRefs:
