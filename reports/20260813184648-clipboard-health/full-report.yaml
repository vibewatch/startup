      - number: '4.2'
        title: Public traction, revenue scale and quality of evidence
        blocks:
          - type: paragraph
            body: >-
              There are only three public datapoints that speak directly to Clipboard's revenue quality. First, Business
              Wire and TechCrunch both described the business as profitable when it announced the 2022 Series C, and
              Business Wire said gross revenue had grown 25x over the prior 18 months. Second, the meta description of
              Clipboard's 2026 "AI at Clipboard" post says the company has been profitable for years, which supports the
              idea of sustained profitability but is still marketing copy rather than audited disclosure. Third,
              GetLatka reports that Clipboard reached $313.7M of 2024 ARR or revenue, last updated in late November
              2025. If that figure is directionally right, Clipboard has already crossed into serious scale for a
              marketplace that has raised only around $90M-plus. But the evidence quality is weak: there is no audited
              income statement, no deferred- revenue or cohort disclosure, no gross margin and no segmentation by
              long-term care, home health, hospital or dental. The right interpretation is not that the number is false,
              but that it remains insufficiently verified for precision modeling.
