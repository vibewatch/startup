      - number: '4.4'
        title: Public-comp context and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public staffing comparables highlight how hard it is to value Clipboard as if it were software. AMN's
              investor site reported Q2 2026 revenue of $673M and adjusted EBITDA of $73M, while Yahoo Finance shows
              annual revenue levels above $3.4B on its current AMN income-statement page. Cross Country Healthcare's
              public data tell an equally important story: revenue peaked at roughly $2.803B in 2022 and then fell to
              about $1.054B in 2025, while its market cap was only about $0.42B in August 2026. Healthcare Business
              Today says the broader staffing market is only returning to slight growth in 2026 after a 36%
              travel-nursing revenue drop in 2024. For Clipboard, that means two things. First, a local marketplace with
              strong repeat usage may be more resilient than a travel-heavy agency. Second, public comps still remind
              investors that staffing is cyclical, service-heavy and rarely rewarded with software-like revenue
              multiples unless the model proves structurally superior. Capital adequacy is likewise hard to judge: more
              than $90M of financing and repeated profitability claims sound reassuring, but without current cash, burn
              or working-capital disclosure, financing dependency cannot be cleared.
