      - number: '8.2'
        title: Public comparable-company framework
        blocks:
          - type: paragraph
            body: >-
              Clipboard should not be valued against pure software or pure staffing alone. A blended comp set makes more
              sense: healthcare staffing incumbents capture labor-intensity and cyclicality, while labor marketplaces
              capture software-layer scalability and network effects. On the staffing side, AMN and Cross Country both
              trade on very modest revenue multiples when current market capitalizations are compared with recent
              revenue run rates. On the marketplace side, Upwork and Fiverr command somewhat higher multiples, but still
              far below Clipboard's implied 4.1x mark if the 2024 ARR figure is used. This gap does not automatically
              make Clipboard overvalued because private companies can deserve a premium for faster growth, concentrated
              ownership, lower float pressure or cleaner profitability. But it does mean the company must earn that
              premium with private evidence. Public comps alone do not support assuming that a 2026 mark should
              naturally step up from the 2022 unicorn valuation.
            claimRefs:
              - CV011
              - CV012
