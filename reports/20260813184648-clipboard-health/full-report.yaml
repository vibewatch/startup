      - number: '3.4'
        title: Competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The market is crowded but not hopelessly undifferentiated. Clipboard's best public comparative story is
              that it sits between CareRev's low-friction marketplace model and ShiftMed's utility in local staffing,
              while serving operationally painful segments such as long-term care and home health where fast local
              coverage matters. The bad news is that the current official contractor model means the company cannot
              claim a clean compliance advantage over W-2 rivals, and it has far less public scale transparency than
              AMN, Aya or public staffing companies. Competitive success therefore depends on operational density rather
              than on abstract software superiority. If Clipboard's repeat-worker, time-to-fill and facility-retention
              metrics are truly superior in its core segments, it can defend a durable niche. If not, the feature set
              looks replicable and the marketplace may be trapped between stronger compliance-first startups and broader
              incumbents.
