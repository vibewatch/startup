chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters and business model
        blocks:
          - type: paragraph
            body: >-
              Clipboard Health operates an app-based healthcare labor marketplace that lets facilities post open shifts
              and lets healthcare professionals browse and instantly book them. Public company, legal and marketplace
              pages consistently describe the product as a two-sided platform rather than a traditional agency branch
              network. The business is now branded through clipboardworks.com, but the legal and marketing materials
              still tie back to Clipboard Health and Twomagnets LLC. The company was founded in 2016, is described by Y
              Combinator and Tracxn as San Francisco-based, and says its mission is to “uplift as many communities as
              possible” by connecting people with care. The current official FAQ and terms matter strategically: they
              say professionals use Clipboard as independent contractors, not as W-2 employees, and facilities pay
              transparent hourly rates plus selected premiums such as holiday pay or agreed differentials. That
              structure supports speed and flexibility, but it also means the platform's compliance and
              worker-classification posture is a core diligence issue rather than a solved differentiator.
