      - number: '8.4'
        title: Valuation verdict
        blocks:
          - type: paragraph
            body: >-
              The most defensible conclusion is that Clipboard may still be a high-quality private asset, but the burden
              of proof now sits squarely on private diligence. Public evidence supports a company with real scale,
              marketplace liquidity and a history of profitable growth, yet it also shows material exposure to
              contractor-model, support-quality and compliance risks. Compared with public healthcare staffing and
              marketplace names, the old unicorn mark already embeds a large premium. That premium could be justified if
              Clipboard truly has more than $300 million of durable ARR, strong margins, healthy retention, and legal
              insulation around its labor model. Without those proofs, investors should frame the prior $1.3 billion
              valuation as a ceiling that requires bull-case assumptions, not as the default clearing price for a new
              round. In other words, growth alone is not enough; investors need evidence that the growth is durable
              after legal, retention and margin adjustments.
