            body: >-
              Clipboard's cost structure is not public, but the operating model reveals the main cost centers.
              Facilities expect fast fill, 24/7 support, documentation handling, worker credentialing, payment rails and
              replacement coverage when a clinician cancels. The support page says the support team is available 24/7,
              and the solutions pages promise replacements and high fill rates. The worker experience side shows why
              this matters financially: instant pay and low-friction booking help attract supply, but they also imply
              capital movement, fraud controls and customer-service costs. Worker complaints on JustUseApp about pay
              corrections and weak support suggest that service intensity is not theoretical. Financially, the
              contractor model likely lowers direct payroll and benefit burden relative to W-2 pools, but it does not
              eliminate operational expense; instead it shifts the pressure into marketplace support, payment accuracy,
