              - CV022
      - number: '8.3'
        title: Scenario underwriting
        blocks:
          - type: paragraph
            body: >-
              Scenario valuation is therefore the cleanest public approach. If Clipboard's revenue base is closer to
              $250 million than $313.7 million, the old $1.3 billion mark implies roughly 5.2x revenue; if the revenue
              base is around $350 million, the same mark implies about 3.7x. Those levels remain rich relative to public
              comps, but they are more understandable if management can prove strong repeat-book behavior, real
              profitability, high fill-quality, good working-capital dynamics and manageable legal exposure. A
              reasonable public-only framework is to give Clipboard a premium to staffing peers because it operates a
              two-sided digital marketplace, but a discount to peak private-market exuberance because revenue quality
              and legal durability are not publicly verified. That logic points to a base-case range below the 2022
              mark, with upside back toward the unicorn level only if private diligence validates both the revenue
              figure and the moat.
            claimRefs:
              - CV023
