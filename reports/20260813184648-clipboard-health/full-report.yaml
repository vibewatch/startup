  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Clipboard's public pricing materials point to a usage-based marketplace model rather than a recurring
              software subscription. The pricing page says each role type has a standard hourly rate and that facilities
              only pay more when they opt into items such as holiday pay, agreed shift differentials or higher-rate
              replacements after cancellations. The worker side is designed for liquidity: the app and worker pages
              emphasize instant shift booking, instant pay for a fee and payment within a few days for free. Put
              together, the financial logic appears to be a spread or service-margin model layered onto hourly staffing
              transactions, with monetization driven by successful shift volume, pricing discipline and repeat usage
              instead of seat-based SaaS contracts. Because the company does not publish a rate card with worker pay on
              one side and facility bill rates on the other, its exact take rate remains unknown. That missing bridge is
              the central gap between a promising marketplace story and a financeable unit-economics story.
            claimRefs:
