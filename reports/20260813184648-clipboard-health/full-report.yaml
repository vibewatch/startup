      - number: '1.3'
        title: Founder story, leadership opacity and capital history
        blocks:
          - type: paragraph
            body: >-
              Founder Wei Deng remains the central public face of the company. Her founder note on the About page frames
              Clipboard as a mission-led company built to lift families with limited resources, and a Y Combinator
              interview recounts the company's multiple pre-product pivots before landing on healthcare staffing.
              Leadership visibility beyond Deng is uneven. The public careers page shows “Bo” as co-CEO and lists Warren
              as chief financial and business officer, but the company does not publish a full executive roster, board
              composition or independent-director detail on its main website. That governance opacity stands in contrast
              to the relative clarity of the 2022 financing milestone: Clipboard confirmed an IVP-led $50 million Series
              B in 2021, a Sequoia-led $30 million Series C that closed in February 2022, and a $1.3 billion post-money
              valuation. Business Wire described the company as profitable in 2022 and said it had achieved 25x gross
              revenue growth over the preceding 18 months. A later company blog meta description says Clipboard has been
              profitable for years, but there is no audited public income statement, and third-party trackers disagree
              modestly on lifetime capital raised and 2024 ARR.
