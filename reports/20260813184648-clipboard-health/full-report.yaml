  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer map, buyer and beneficiary structure
        blocks:
          - type: paragraph
            body: >-
              Clipboard's customer structure is more complex than a normal B2B SaaS account list. Facilities are the
              direct economic buyers because they post shifts and pay for filled labor. Clinicians are the daily product
              users because they discover, book and work those shifts through the app. Patients and residents are
              downstream beneficiaries because staffing continuity determines care quality and access. Public pages show
              the company serving long-term care, home health and hospice, hospitals and dental, but the density of
              customer-proof content is strongest in post-acute and community-based settings. That matters because the
              value proposition in those environments is immediate and operational: fill open coverage quickly, reduce
              administrative scramble and preserve continuity. The website's scale claims — more than 6,500 workplaces,
              more than 9 million shifts covered and 125,000 workers earning over $1,000 on the platform — indicate that
              this is not a pilot customer base. Even so, public materials do not disclose concentration by segment,
              enterprise contract lengths or retention cohorts, so the customer picture is best read as broad
              marketplace penetration with incomplete revenue-quality visibility.
