  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape archetypes and closest peers
        blocks:
          - type: paragraph
            body: >-
              Clipboard should not be compared only to other startup marketplaces. The relevant landscape runs from
              local self-serve shift apps to national enterprise workforce-management incumbents. The closest workflow
              analogue is CareRev, whose FAQ likewise describes a mobile marketplace where facilities post open per diem
              shifts and local clinicians choose only the shifts they want. ShiftMed competes at the local on-demand end
              too, but its pitch is different: a technology platform built around local W-2 nurses and cost savings
              versus premium contract labor. Trusted sits nearer the travel and contract lifecycle side, marketing
              AI-driven decisions and mobile self-serve matching for clinicians across all 50 states. Aya and AMN are
              broader incumbents: Aya frames itself as an advanced healthcare workforce-management platform with MSP and
              AI planning layers, while AMN markets itself as a 40-year staffing leader with millions of clinicians and
              thousands of clients. Clipboard therefore lives in a crowded competitive wedge: more nimble and
              productized than incumbents, but with less compliance and enterprise depth.
