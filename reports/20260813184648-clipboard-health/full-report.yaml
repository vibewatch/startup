  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and practical serviceable market
        blocks:
          - type: paragraph
            body: >-
              The broadest public market definitions place Clipboard in the U.S. healthcare staffing market, but that
              headline bucket overstates the market the company can actually serve today. Open-access market researchers
              estimate the U.S. healthcare staffing market at roughly $23.6B to $26.3B in 2026, with growth into the
              low-$30B or high-$40B range over the next decade depending on model assumptions. Those estimates span
              travel nursing, per diem nursing, locum tenens, allied health and other segments, and therefore include
              categories where Clipboard has little visible presence. Clipboard's own site and Y Combinator profile
              point to a narrower, more credible serviceable market: long-term care, home health and hospice, hospitals
              and dental staffing, with the deepest operating proof still concentrated in long-term care and home-based
              care. For diligence, that means TAM should be treated as directional context; the real underwriting
              question is whether the company can keep compounding share inside flexible local staffing niches where
              facility buyers need speed, repeat coverage and lower coordination overhead rather than high-end
              travel-nurse programs or full managed-service-provider contracts.
