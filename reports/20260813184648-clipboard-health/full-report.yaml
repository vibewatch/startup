  headquarters: San Francisco, California
  productSummary: >-
    Two-sided staffing marketplace that lets facilities post shifts and lets clinicians discover, instantly book,
    complete and get paid for those shifts through a mobile-first workflow, with identity verification, location-aware
    matching and support services layered in.
  customerFocus: >-
    Long-term care, home health and hospice, hospitals, and adjacent healthcare settings needing rapid contingent
    staffing coverage.
  businessModel: >-
    Facilities pay Clipboard for filled shifts while clinicians use the app to access flexible work; public materials
