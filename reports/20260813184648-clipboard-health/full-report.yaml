  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Labor classification and wage-hour exposure
        blocks:
          - type: paragraph
            body: >-
              Clipboard's largest public risk is the legal durability of its contractor model. The company's FAQ, worker
              education pages and biometric policy all describe clinicians as independent professionals or contractors
              rather than employees. That matters because both IRS and Department of Labor guidance say classification
              is not a label a company chooses unilaterally; it depends on the underlying facts, including control,
              independence and the economic reality of the work relationship. The DOL's 2024 rulemaking and current
              guidance frame misclassification as a serious problem that can deprive workers of wage-and-hour
              protections. Healthcare-specific commentary adds that providers and intermediaries using 1099 labor face
              heightened scrutiny. Clipboard may ultimately fit the lawful contractor side of the line in some use
              cases, but public evidence alone is not enough to prove that. Because the business model depends on
              large-scale contingent supply, an adverse regulatory or litigation outcome on classification could
              pressure gross margins, payroll taxes, benefits economics, and facility-side pricing all at once.
            claimRefs:
