companyProfile:
  summary: >-
    Clipboard Health is a San Francisco-based healthcare staffing marketplace founded in 2016 by Wei Deng. Its product
    connects healthcare facilities with local clinicians who browse and book open shifts through a mobile workflow, with
    especially strong public proof in long-term care, hospice and home health. The company reached a disclosed $1.3
    billion post-money valuation in its February 2022 Series C and now shows meaningful public scale signals, but
    official sources describe clinicians as independent contractors, making labor-model durability a central diligence
    issue.
  foundedDate: '2016-01-01'
  founders:
    - name: Wei Deng
