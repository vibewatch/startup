      - number: '2.2'
        title: Workforce shortage, cost pressure and regulatory demand drivers
        blocks:
          - type: paragraph
            body: >-
              The strongest structural demand driver for Clipboard is not abstract digitization but persistent clinical
              labor scarcity. ANA says the U.S. has 4.3 million registered nurses, but HRSA's December 2025 projections
              still show an 8% RN shortage in 2028 and a nearly 246,000 LPN shortfall by 2038, with non-metro areas
              bearing disproportionate stress. AHCA's 2024 nursing home survey shows how that stress translates into
              Clipboard's core end market: 99% of nursing homes report open jobs, 89% are hiring RNs and 72% remain
              below pre-pandemic staffing levels. Meanwhile AHA says labor now represents 56% of hospital costs and
              advertised RN salaries have risen 26.6% faster than inflation over the prior four years, making
              last-minute coverage and local float capacity economically attractive even after the post-pandemic
              travel-nurse unwind. CMS's 2024 final minimum-staffing rule adds another force multiplier in long-term
              care by codifying a 3.48-hours-per-resident-day standard that includes 0.55 RN hours and 2.45 nurse-aide
              hours. That rule does not hand Clipboard demand automatically, but it deepens the structural need for
              faster local staffing supply in the exact segment where Clipboard already claims scale.
