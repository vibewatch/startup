  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: tam-precision
      missingEvidence: A reconciled, bottom-up SAM and SOM model for Clipboard by segment and geography.
      whyItMatters: Open-access market reports disagree materially on 2026 size and do not isolate Clipboard's served niches.
      diligencePath: Request internal GMV, active-facility counts and shift volume split by long-term care, home health, hospital and dental cohorts.
      relatedQuestionRefs: [QM024]
    - type: private-evidence-only
      severity: material
      topic: segment-mix
      missingEvidence: Revenue and shift mix by care setting, geography and customer size.
      whyItMatters: The investment case depends on whether Clipboard is really concentrated in attractive repeat local staffing pockets.
      diligencePath: Request monthly segment revenue, margin and customer-retention dashboards by vertical.
      relatedQuestionRefs: [QM004, QM019, QM020, QM021]
    - type: stale
      severity: minor
      topic: travel-vs-local-spend
      missingEvidence: A fresh 2026 public benchmark that splits per diem local staffing from travel-nurse spend more cleanly.
      whyItMatters: Broad healthcare-staffing TAM figures can overstate Clipboard's addressable market if they lean too heavily on travel-nursing categories.
      diligencePath: Pull SIA or hospital-system procurement benchmarks that disaggregate local per-diem, float-pool and travel categories.
      relatedQuestionRefs: [QM002, QM013]
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: Internal data on who signs contracts, who posts shifts and who approves spend at the account level.
      whyItMatters: Buyer mapping influences sales-cycle length, upsell potential and defensibility versus MSP or internal float-pool alternatives.
      diligencePath: Request CRM and account-implementation data for the top 100 accounts.
      relatedQuestionRefs: [QM015, QM017]
