slug: clipboard-health
runDate: "2026-08-13"
company:
  name: Clipboard Health
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Clipboard Health sits inside a large but noisy healthcare staffing market where publicly available
    TAM estimates range from about $23.6B to $26.3B for the U.S. in 2026 and broader staffing spend
    is expected to recover to roughly $40.2B after travel-nurse normalization. The company's most
    defensible serviceable market is not all healthcare staffing but the labor-constrained settings it
    already serves — especially long-term care, home health/hospice and last-minute hospital shift
    coverage — where workforce shortages, CMS staffing mandates and labor-cost pressure keep flexible
    local staffing demand structurally high.
sections:
  - id: market-boundary
    title: Market boundary and practical serviceable market
    body: >-
      The broadest public market definitions place Clipboard in the U.S. healthcare staffing market,
      but that headline bucket overstates the market the company can actually serve today. Open-access
      market researchers estimate the U.S. healthcare staffing market at roughly $23.6B to $26.3B in
      2026, with growth into the low-$30B or high-$40B range over the next decade depending on model
      assumptions. Those estimates span travel nursing, per diem nursing, locum tenens, allied health
      and other segments, and therefore include categories where Clipboard has little visible presence.
      Clipboard's own site and Y Combinator profile point to a narrower, more credible serviceable
      market: long-term care, home health and hospice, hospitals and dental staffing, with the deepest
      operating proof still concentrated in long-term care and home-based care. For diligence, that
      means TAM should be treated as directional context; the real underwriting question is whether the
      company can keep compounding share inside flexible local staffing niches where facility buyers
      need speed, repeat coverage and lower coordination overhead rather than high-end travel-nurse
      programs or full managed-service-provider contracts.
    claimRefs: [CM001, CM002, CM003, CM016, CM017, CM018, CM019, CM026, CM031, CM032]
    tableRefs: [TM001, TM002]
    figureRefs: [FM001, FM002]
  - id: demand-drivers
    title: Workforce shortage, cost pressure and regulatory demand drivers
    body: >-
      The strongest structural demand driver for Clipboard is not abstract digitization but persistent
      clinical labor scarcity. ANA says the U.S. has 4.3 million registered nurses, but HRSA's
      December 2025 projections still show an 8% RN shortage in 2028 and a nearly 246,000 LPN
      shortfall by 2038, with non-metro areas bearing disproportionate stress. AHCA's 2024 nursing
      home survey shows how that stress translates into Clipboard's core end market: 99% of nursing
      homes report open jobs, 89% are hiring RNs and 72% remain below pre-pandemic staffing levels.
      Meanwhile AHA says labor now represents 56% of hospital costs and advertised RN salaries have
      risen 26.6% faster than inflation over the prior four years, making last-minute coverage and
      local float capacity economically attractive even after the post-pandemic travel-nurse unwind.
      CMS's 2024 final minimum-staffing rule adds another force multiplier in long-term care by
      codifying a 3.48-hours-per-resident-day standard that includes 0.55 RN hours and 2.45 nurse-aide
      hours. That rule does not hand Clipboard demand automatically, but it deepens the structural need
      for faster local staffing supply in the exact segment where Clipboard already claims scale.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM027, CM037]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: buyer-user-payer-and-adoption
    title: Buyer, user and payer segmentation plus adoption path
    body: >-
      Clipboard's market mechanics are straightforward but sticky. The user is the clinician or aide
      who wants flexible local shifts and fast payment; the buyer is the facility operator, staffing
      coordinator, DON, unit manager or home-health scheduler; and the payer is ultimately the
      provider organization whose labor budget absorbs the shift cost and any premium paid for speed,
      holidays or differential coverage. Adoption is strongest where open shifts cause immediate
      operational pain — call-offs in nursing homes, census-driven visit demand in home health,
      overtime pressure in hospitals, or hygiene backlogs in dental offices. Official customer stories
      and segment pages suggest buyers care about three outcomes more than anything else: speed to
      fill, repeat-worker continuity and the ability to expand service area or census without hiring
      fixed full-time staff first. These are attractive use cases for a local marketplace, but they
      also create adoption constraints: facilities need confidence in credentials, continuity, HIPAA
      handling and labor classification, and some systems may prefer MSP vendors or internal float pools
      once they reach sufficient scale.
    claimRefs: [CM015, CM020, CM021, CM022, CM028, CM029, CM030, CM033, CM034, CM035, CM038]
    tableRefs: [TM004]
    figureRefs: [FM004]
  - id: market-verdict
    title: Market verdict and sizing conclusion
    body: >-
      Market quality is better than the recent travel-nurse headlines imply, but it is uneven by
      segment. Healthcare Business Today's 2026 outlook says the broader healthcare staffing market is
      returning to slight growth after contraction, while travel nursing in particular suffered a 36%
      revenue drop in 2024 and is only stabilizing. That dynamic is actually helpful for Clipboard's
      niche if the company is truly concentrated in local, repeatable shift coverage rather than in
      premium travel contracts. The best public evidence supports a focused market thesis: there is a
      large national labor shortfall, a durable regulatory and cost tailwind in long-term care, and a
      facility buyer base that values flexible same-day coverage. The weak point is precision. Open
      data does not let us cleanly separate Clipboard's true SAM across long-term care, home health,
      hospital per diem and dental, or quantify how much of the company's current throughput comes from
      each segment. Market underwriting therefore should emphasize proven operating density and
      expansion economics over any single third-party TAM figure.
    claimRefs: [CM001, CM002, CM003, CM023, CM024, CM025, CM026, CM031, CM037]
