      - [Coherent Market Insights, "$23.63B", 2033, Coherent, "Lower starting point and slower CAGR than Precedence"]
      - [Healthcare Business Today / SIA spend outlook, "$40.2B", 2026, "SIA via Healthcare Business Today", "Spend-oriented lens across the broader healthcare staffing market"]
      - [Clipboard practical SAM, "Narrower than headline TAM", 2026, Clipboard plus public segment pages, "Current proof is strongest in LTC, home health and urgent local hospital shifts"]
    notes: "Third-party market reports disagree materially, so these figures should be used as boundary lenses rather than as a single canonical TAM."
    claimRefs: [CM001, CM002, CM003, CM023, CM031]
  - id: TM002
    title: Serviceable segment boundary table
    columns: [Segment, Public demand signal, Clipboard evidence, Practical fit]
    rows:
      - [Long-term care, "99% of nursing homes have open jobs", "4.9K facilities rely on Clipboard; 5M shifts posted in 2025", Strong]
      - [Home health & hospice, "Aging population and visit-based care expansion", "11K patients cared for; 50%+ shifts filled within 2 hours", Strong]
      - [Hospitals, "Labor is 56% of hospital costs; RN wages outpace inflation", "Clipboard markets last-minute or long-term hospital coverage", Moderate]
      - [Dental staffing, "Smaller but operationally similar same-day shift pain", "Clipboard has explicit dental solution pages", Moderate]
      - [Travel nursing / MSP, "Large spend pool but post-pandemic normalization and vendor complexity", "No strong public evidence Clipboard owns this segment", Weak]
    notes: "This is a serviceable-market boundary table, not a claim that Clipboard already has scale in every listed segment."
    claimRefs: [CM008, CM013, CM016, CM017, CM018, CM019, CM023, CM032]
  - id: TM003
    title: Demand-driver and constraint matrix
    columns: [Driver or constraint, Evidence, Direction, Why it matters]
    rows:
      - [RN and LPN shortages, "HRSA projects RN and LPN shortfalls into the 2030s", Positive, "Sustains facility need for flexible capacity"]
      - [Nursing-home vacancies, "AHCA shows 99% open jobs and 72% below pre-pandemic staffing", Positive, "Supports LTC demand concentration"]
      - [CMS minimum staffing rule, "3.48 HPRD with RN and aide minimums", Positive, "Raises compliance floor for LTC operators"]
      - [Hospital labor inflation, "AHA says labor is 56% of cost and RN salaries outpace inflation", Positive, "Makes local shift flexibility valuable"]
      - [Travel-nurse normalization, "2024 travel-nursing revenue fell 36% per SIA summary", Mixed, "Hurts premium agency spend but can help local-per-diem substitutes"]
      - [Contractor classification scrutiny, "DOL and IRS continue to refine worker-classification tests", Negative, "Can slow adoption or raise compliance cost"]
    notes: "Pairs structural tailwinds with the most credible public counterweights instead of assuming every shortage benefits Clipboard equally."
    claimRefs: [CM006, CM007, CM008, CM010, CM011, CM012, CM013, CM014, CM023, CM024, CM028, CM029, CM037]
  - id: TM004
    title: Buyer, user and payer map
    columns: [Role, Who it is, Primary objective, Adoption gate]
    rows:
      - [User, "RN/LPN/CNA or other clinician", "Flexible local work and fast pay", "Credentials, support quality and reliable payment"]
      - [Buyer, "DON, staffing coordinator, unit manager, scheduler", "Fill shifts fast and reduce overtime/admin burden", "Confidence in credentials and fill-rate reliability"]
      - [Payer, "Facility or provider organization", "Control labor cost and preserve census/care continuity", "Budget, compliance and repeat-booking economics"]
      - [Influencer, "Compliance/legal/HR", "Avoid worker-misclassification, privacy or documentation risk", "Contractor model, HIPAA and policy fit"]
    notes: "Separates end-user flexibility from institutional budget ownership because marketplaces often win users before winning enterprise comfort."
    claimRefs: [CM020, CM021, CM028, CM029, CM030, CM033, CM034, CM038]
