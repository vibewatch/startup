  - id: FM004
    title: Adoption path from open shift to repeat usage
    type: flow
    layout: standard
    summary: Adoption happens when a painful staffing gap turns into a repeat-booking habit that lowers administrative friction.
    data:
      nodes:
        - id: shortage
          label: Open shift or census-driven need
        - id: buyer
          label: Scheduler or DON seeks fast local coverage
        - id: marketplace
          label: Clipboard distributes shift to supply pool
        - id: fill
          label: Rapid fill and documentation workflow
        - id: repeat
          label: Repeat clinician invited back
        - id: expansion
          label: Better continuity or broader service area
      edges:
        - from: shortage
          to: buyer
        - from: buyer
          to: marketplace
        - from: marketplace
          to: fill
        - from: fill
          to: repeat
        - from: repeat
          to: expansion
        - from: expansion
          to: buyer
    approximationNotes: "Qualitative adoption loop synthesized from official customer stories and solutions pages."
    claimRefs: [CM020, CM021, CM033, CM034, CM035, CM038]
