    title: Comparable valuation table
    enumerationScope:
      coverage: sample
      basis: This comp set samples representative public healthcare staffing and labor-marketplace names that bracket Clipboard's hybrid model rather than claiming to exhaust the entire peer universe.
    columns: [Company, Business archetype, Revenue input, Market cap input, Approx. revenue multiple]
    rows:
      - [AMN Healthcare, Healthcare staffing / talent solutions, "$673M Q2 2026 revenue annualized to ~$2.69B", "$1.33B", "~0.49x"]
      - [Cross Country Healthcare, Healthcare staffing, "$241.1M Q1 2026 revenue annualized to ~$0.96B", "$0.42B", "~0.44x"]
      - [Upwork, Digital labor marketplace, "$195.5M Q1 2026 revenue annualized to ~$0.78B", "$1.08B", "~1.38x"]
      - [Fiverr, Digital labor marketplace, "$430.9M FY2025 revenue", "$0.32B", "~0.74x"]
    notes: "Uses current market-cap pages and the most recent accessible revenue datapoints from press releases or company IR materials."
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018]
  - id: TV004
    title: Scenario valuation framework table
    columns: [Scenario, Revenue base, Multiple range, Implied valuation, Conditions]
    rows:
      - [Bear, "$250M", "1.5x-2.0x", "$375M-$500M", "ARR weaker than tracker, legal risk heavy, growth slowing"]
      - [Base, "$300M-$325M", "2.0x-3.0x", "$600M-$975M", "Solid growth and profitability but mixed quality/risk"]
      - [Bull, "$325M-$350M+", "3.0x-3.5x", "$975M-$1.225B", "Strong retention, margins, legal defensibility and moat proof"]
    notes: "Ranges reflect a premium to public comps but a discount to assuming every private bull-case input is already proven."
    claimRefs: [CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031]
  - id: TV005
    title: Valuation decision table
    columns: [Question, Public answer, Confidence, Implication]
    rows:
      - [Is Clipboard clearly worth more than $1.3B today from public evidence alone?, No, Medium, "Would need private proof to underwrite"]
      - [Is the 2022 unicorn valuation obviously absurd if ARR is real?, No, Medium, "4.1x is rich but not impossible for a profitable growth asset"]
      - [Should a new investor pay the old mark without more data?, No, High, "Demand retention, margin and legal diligence first"]
      - [What would justify the top end?, "Verified ARR, strong margins, durable cohorts", Medium, "Supports bull case near prior mark"]
    notes: "This is a public-information underwriting view, not a formal fairness opinion."
    claimRefs: [CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
  - id: TV006
    title: Premium support versus discount factor table
    columns: [Factor, Direction, Public evidence, Valuation impact]
    rows:
      - [Marketplace workflow and scale, Positive, "Millions of shifts and broad worker/facility network claims", "Supports premium to staffing comps"]
      - [Reported profitability, Positive, "Business Wire and AI blog point to profitability", "Supports downside resilience if verified"]
      - [Unverified revenue precision, Negative, "GetLatka is a tracker rather than an audited filing", "Caps conviction on full-mark pricing"]
      - [Labor-model and policy risk, Negative, "Gig-nursing scrutiny and contractor-model questions remain active", "Justifies valuation discount"]
      - [Public-market multiple compression, Negative, "Relevant publics trade far below 4x revenue", "Argues against automatic step-up"]
    notes: "Summarizes the push-pull between factors that support a premium and factors that constrain it."
    claimRefs: [CV002, CV004, CV005, CV025, CV028, CV029, CV031, CV042]
figures:
