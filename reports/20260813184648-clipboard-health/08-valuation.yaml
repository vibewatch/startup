runDate: "2026-08-13"
company:
  name: Clipboard Health
chapter:
  number: 8
  title: Valuation
  summary: >-
    Clipboard Health's last disclosed private mark — $1.3 billion post-money in 2022 — can still be
    explained by rapid growth, marketplace optionality and reported profitability, but the current public
    evidence does not fully support paying above that mark without fresh private data. Using GetLatka's
    low-confidence 2024 ARR estimate of $313.7 million implies roughly 4.1x ARR at the 2022 unicorn
    valuation. That is materially above the current public trading range of selected healthcare staffing
    and labor-marketplace comps, where approximate market-cap-to-revenue ratios cluster closer to 0.4x to
    1.4x. Clipboard therefore screens as a premium asset whose valuation case depends heavily on whether
    management can privately substantiate superior growth durability, retention, margin quality and legal
    resilience. Without that evidence, a fresh 2026 valuation anchor should be below or only near the
    prior unicorn mark rather than confidently above it.
sections:
  - id: anchor-and-input-quality
    title: Valuation anchor and evidence quality
    body: >-
      The starting point is simple but imperfect. Clipboard announced a $1.3 billion post-money valuation
      in its 2022 Series C and Business Wire described the company as profitable, app-based and up 25x in
      gross revenue over the prior 18 months. TechCrunch likewise described the combined Series B and C as
      $80 million in financing. The most specific newer revenue datapoint available in the fetched corpus is
      GetLatka's 2024 figure of $313.7 million, but that source is a low-confidence tracker rather than an
      audited filing. Clipboard's AI blog meta description separately suggests the company has been
      profitable for years, which points in a favorable direction but still does not replace board-quality
      financials. On that basis, valuation work has to rely on scenario analysis rather than a single clean
      comp multiple. The right read is not that the $313.7 million number is false; it is that investors
      should treat it as a provisional input that materially affects every downstream conclusion and widens
      the fair-value range materially for investors today.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: comp-framework
    title: Public comparable-company framework
    body: >-
      Clipboard should not be valued against pure software or pure staffing alone. A blended comp set makes
      more sense: healthcare staffing incumbents capture labor-intensity and cyclicality, while labor
      marketplaces capture software-layer scalability and network effects. On the staffing side, AMN and
      Cross Country both trade on very modest revenue multiples when current market capitalizations are
      compared with recent revenue run rates. On the marketplace side, Upwork and Fiverr command somewhat
      higher multiples, but still far below Clipboard's implied 4.1x mark if the 2024 ARR figure is used.
      This gap does not automatically make Clipboard overvalued because private companies can deserve a
      premium for faster growth, concentrated ownership, lower float pressure or cleaner profitability.
      But it does mean the company must earn that premium with private evidence. Public comps alone do not
      support assuming that a 2026 mark should naturally step up from the 2022 unicorn valuation.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV022]
    tableRefs: [TV003]
    figureRefs: [FV002, FV003]
  - id: scenario-underwriting
    title: Scenario underwriting
    body: >-
      Scenario valuation is therefore the cleanest public approach. If Clipboard's revenue base is closer to
      $250 million than $313.7 million, the old $1.3 billion mark implies roughly 5.2x revenue; if the
      revenue base is around $350 million, the same mark implies about 3.7x. Those levels remain rich
      relative to public comps, but they are more understandable if management can prove strong repeat-book
      behavior, real profitability, high fill-quality, good working-capital dynamics and manageable legal
      exposure. A reasonable public-only framework is to give Clipboard a premium to staffing peers because
      it operates a two-sided digital marketplace, but a discount to peak private-market exuberance because
      revenue quality and legal durability are not publicly verified. That logic points to a base-case range
      below the 2022 mark, with upside back toward the unicorn level only if private diligence validates
      both the revenue figure and the moat.
    claimRefs: [CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV032]
    tableRefs: [TV004]
    figureRefs: [FV004]
  - id: valuation-verdict
    title: Valuation verdict
    body: >-
      The most defensible conclusion is that Clipboard may still be a high-quality private asset, but the
      burden of proof now sits squarely on private diligence. Public evidence supports a company with real
      scale, marketplace liquidity and a history of profitable growth, yet it also shows material exposure
      to contractor-model, support-quality and compliance risks. Compared with public healthcare staffing
      and marketplace names, the old unicorn mark already embeds a large premium. That premium could be
      justified if Clipboard truly has more than $300 million of durable ARR, strong margins, healthy
      retention, and legal insulation around its labor model. Without those proofs, investors should frame
      the prior $1.3 billion valuation as a ceiling that requires bull-case assumptions, not as the default
      clearing price for a new round. In other words, growth alone is not enough; investors need evidence
      that the growth is durable after legal, retention and margin adjustments.
    claimRefs: [CV006, CV009, CV018, CV027, CV031, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040, CV042]
    tableRefs: [TV005, TV006]
    figureRefs: []
