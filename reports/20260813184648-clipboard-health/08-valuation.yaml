  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-verification
      missingEvidence: Audited or board-approved revenue, ARR, gross margin and cash-flow data for 2024-2026.
      whyItMatters: The entire valuation exercise is sensitive to whether the public $313.7 million revenue estimate is directionally accurate.
      diligencePath: Request audited statements, monthly KPI packs and cohort bridge schedules.
      relatedQuestionRefs: [QV003, QV005, QV029]
    - type: private-evidence-only
      severity: material
      topic: quality-of-revenue
      missingEvidence: Net revenue retention, repeat-booking rates, worker reactivation, gross churn and customer concentration.
      whyItMatters: A premium multiple is only justified if growth is durable and efficiently retained.
      diligencePath: Review cohort dashboards by facility, worker and geography.
      relatedQuestionRefs: [QV017, QV018, QV027]
    - type: private-evidence-only
      severity: material
      topic: legal-and-margin-resilience
      missingEvidence: Contribution margin by cohort, compliance reserve levels, and scenario planning for contractor-model changes.
      whyItMatters: Legal and labor-model downside could compress margins fast enough to invalidate premium valuation logic.
      diligencePath: Request margin waterfalls and legal downside models.
      relatedQuestionRefs: [QV018, QV025, QV027]
    - type: conflicting-data
      severity: minor
      topic: public-comp-limitations
      missingEvidence: A consistent apples-to-apples comp framework with EV/revenue, growth rates and profitability alignment.
      whyItMatters: Market-cap-to-revenue shortcuts are useful for screening but cannot substitute for a full valuation model.
      diligencePath: Build a full comp sheet using enterprise value, forward revenue and margin-adjusted peer buckets.
      relatedQuestionRefs: [QV008, QV009, QV014]
      relatedTableRefs: [TV003]
