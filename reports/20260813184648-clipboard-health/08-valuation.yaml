        - label: Labor marketplaces
          values: [Medium, High, Medium]
        - label: Clipboard
          values: [High, Medium-high, High]
    approximationNotes: "Qualitative positioning map based on business-model traits rather than exact financial ratios."
    claimRefs: [CV019, CV020, CV021, CV022]
  - id: FV004
    title: Scenario valuation range
    type: flow
    layout: standard
    summary: The path back to the old unicorn valuation runs through proof, not assumption.
    data:
      nodes:
        - id: bear
          label: $375M-$500M
        - id: base
          label: $600M-$975M
        - id: bull
          label: $975M-$1.225B
        - id: above
          label: ">$1.3B requires exceptional proof"
      edges:
        - from: bear
          to: base
        - from: base
          to: bull
        - from: bull
          to: above
    approximationNotes: "Scenario ladder is judgmental and based on public evidence quality plus peer ranges."
    claimRefs: [CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV040]
