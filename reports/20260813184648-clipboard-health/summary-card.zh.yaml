  topStrengths:
    - 市场规模真实：覆盖 6,500+ 工作场所、9M+ 班次，且 125,000+ 工作者在平台收入超过 $1,000。
    - 最强公开客户证据来自后急性护理场景；案例显示补班更快、临床人员复用、地理扩张和行政负担下降。
    - 多个公开信号指向盈利增长，包括 Business Wire 2022 年对盈利的描述，以及公司后来称其已连续多年盈利。
    - 移动优先的产品工作流覆盖即时预订、快速付款、生物识别、位置感知运营和 24/7 支持基础设施。
    - 公开增长历史和 2022 年 $1.3B 融资说明，投资人曾看到真实的品类领导潜力。
  topRisks:
    - 官方资料把临床人员描述为独立承包商，带来重大的用工分类和工时工资风险。
    - 公开财务可见度弱：关键的 2024 年 ARR $313.7M 来自低置信度追踪器，而不是经审计的公司披露。
    - 工作者围绕支持、付款和纠纷处理的投诉，抬高了供给侧信任和运营质量疑问。
    - 隐私和生物识别工作流让公司暴露在 HIPAA 邻近、加州隐私和 BIPA 式制度的敏感合规风险下。
    - 公开可比分析显示，旧独角兽估值相对当前医疗用工和劳动力市场倍数已经包含较大溢价。
  unresolvedGaps:
    - 2024-2026 年经审计收入、毛利率、现金流和营运资本数据。
    - 按细分场景和地区拆分的机构留存、重复预订、流失和集中度指标。
    - 独立承包模式的逐州法律分析、索赔历史和准备金姿态。
    - 事故率、支持 SLA、付款纠纷解决数据和生物识别验证准确率指标。
    - 使用企业价值、前瞻增长和利润率调整同业分组的更完整估值模型。
