      - number: '3.2'
        title: 交付模式、分类与规模对比
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争分界是工作者模式。Clipboard 当前 FAQ 和条款称平台使用独立承包商。ShiftMed 首页明确突出本地 W-2
              护士，这一定位可能打动那些希望减少分类模糊性的医院和养老院买家。CareRev 看起来以市场优先、低承诺为主，因此在用户体验上接近 Clipboard，尽管其确切雇佣结构没有同样突出地营销。Trusted
              强调用工与排班的更广生命周期，Aya 与 AMN 则进一步深入企业流程、MSP 和劳动力管理服务。规模同样重要。Clipboard 公开网站显示 6,500+ 个工作场所、9 million 个已覆盖班次和 1
              million 名工作者，对创业公司而言是有意义的密度。但 AMN 称其在全国支持 10,000+ 个客户和 2,000,000+ 名临床人员，公开公司数据和文件还显示其有数十亿美元收入基础和资本市场通道，而
              Clipboard 没有。换句话说，Clipboard 不靠广度或资产负债表厚度取胜；它只能在简单性和速度比企业流程广度更重要的地方取胜。
