  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与实际可服务市场
        blocks:
          - type: paragraph
            body: >-
              最宽泛的公开市场定义会把 Clipboard 放进美国医疗用工市场，但这个标题级篮子夸大了公司今天真正能服务的市场。开放获取的市场研究机构估计，2026 年美国医疗用工市场约为 $23.6B 到
              $26.3B，未来十年会根据模型假设增长至低 $30B 或高 $40B 区间。这些估算覆盖旅行护士、日薪护士、临时代诊医生、专职医疗等细分，因此也包括 Clipboard 公开存在感很弱的类别。Clipboard
              自有网站和 Y Combinator 资料指向一个更窄也更可信的可服务市场：长期护理、居家医疗和临终关怀、医院与牙科用工，其中最深的运营证据仍集中在长期护理和居家护理。尽调时，TAM
              应被视作方向性背景；真正的承保问题是，公司能否在灵活本地用工利基中持续复合式拿份额。这些场景里的机构买家需要速度、重复覆盖和更低协调成本，而不是高端旅行护士项目或完整 MSP 合同。
