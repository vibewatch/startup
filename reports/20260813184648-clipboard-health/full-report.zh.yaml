            body: >-
              Clipboard Health 运营一个基于 app
              的医疗劳动力市场，让机构发布空缺班次，也让医疗专业人员浏览并即时预订班次。公司、法律和市场页面都稳定地把产品描述为双边平台，而不是传统中介门店网络。业务现在通过 clipboardworks.com
              品牌呈现，但法律和营销材料仍指向 Clipboard Health 与 Twomagnets LLC。公司成立于 2016 年，Y Combinator 和 Tracxn 均称其总部位于 San
              Francisco；公司称使命是通过把人和护理连接起来，「尽可能扶持更多社区」。当前官方 FAQ 和条款在战略上很关键：它们称专业人员以独立承包商身份使用 Clipboard，而不是 W-2
              雇员；机构支付透明时薪，并可叠加节假日工资或约定差额等保费。该结构支撑速度和灵活性，但也意味着平台的合规与劳动者分类姿态是核心尽调问题，而不是已经解决的差异化优势。
