      - number: '8.4'
        title: 估值结论
        blocks:
          - type: paragraph
            body: >-
              最能防守的结论是，Clipboard
              仍可能是一项高质量私营资产，但举证责任现在完全落在私有尽调上。公开证据支持公司拥有真实规模、市场流动性和盈利增长历史，但也显示承包商模式、支持质量和合规风险上有重大敞口。与上市医疗用工和市场平台公司相比，旧的独角兽标记已经包含很大溢价。如果
              Clipboard 确实拥有超过 $300 million 的持久 ARR、强利润率、健康留存，以及围绕劳动模式的法律隔离，这份溢价可以成立。没有这些证明，投资者应把此前 $1.3 billion
              估值视为需要牛市情景假设才能达到的上限，而不是新一轮融资的默认成交价。换句话说，单靠增长不够；投资者需要证据证明，在法律、留存和利润率调整后，增长仍然持久。
