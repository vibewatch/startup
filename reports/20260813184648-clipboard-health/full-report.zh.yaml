      - number: '2.4'
        title: 市场判断与规模结论
        blocks:
          - type: paragraph
            body: >-
              市场质量比近期旅行护士头条所暗示的更好，但各细分差异很大。Healthcare Business Today 的 2026 年展望称，更广泛的医疗用工市场在收缩后正恢复小幅增长，而旅行护士细分在 2024
              年收入下滑 36%，目前只是趋稳。如果 Clipboard
              确实集中在本地、可重复的班次覆盖，而不是高溢价旅行合同，这种动态反而有利于它的利基。最好的公开证据支持一个聚焦的市场论点：全国性劳动力缺口很大，长期护理有持久的监管与成本顺风，机构买家也重视灵活的当日覆盖。弱点在于精度。开放数据无法清晰拆出
              Clipboard 在长期护理、居家医疗、医院日薪和牙科中的真实 SAM，也无法量化公司当前吞吐量来自各细分的比例。因此，市场承保应强调已验证的运营密度和扩张经济性，而不是任何单一第三方 TAM 数字。
