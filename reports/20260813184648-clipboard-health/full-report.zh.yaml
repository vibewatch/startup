  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 劳动者分类与工资工时风险
        blocks:
          - type: paragraph
            body: >-
              Clipboard 最大的公开风险，是承包商模式的法律稳固性。公司的 FAQ、工作者教育页面和生物识别政策都把临床人员描述为独立专业人员或承包商，而不是雇员。这一点重要，因为 IRS 和 Department
              of Labor 指引都说明，分类不是公司单方面选择的标签；它取决于底层事实，包括控制、独立性和工作关系的经济现实。DOL 2024
              年规则制定和当前指引把错误分类定义为严重问题，可能剥夺工作者的工资与工时保护。医疗行业评论还补充，使用 1099 劳动力的服务方和中介会面临更高审查。Clipboard
              在某些用例中最终可能落在合法承包商一侧，但仅凭公开证据无法证明。由于商业模式依赖大规模临时供给，一旦分类上出现不利监管或诉讼结果，毛利率、工资税、福利经济性和机构端定价可能同时承压。
