        title: 上市可比背景与资本充足性
        blocks:
          - type: paragraph
            body: >-
              上市用工服务可比公司凸显了把 Clipboard 当软件估值有多难。AMN 投资者网站披露 2026 年 Q2 收入 $673M、调整后 EBITDA $73M，Yahoo Finance 当前 AMN
              损益表页面显示年收入高于 $3.4B。Cross Country Healthcare 的公开数据讲了同样重要的故事：收入在 2022 年约 $2.803B 见顶，随后到 2025 年降至约
              $1.054B；2026 年 8 月市值只有约 $0.42B。Healthcare Business Today 称，更广泛用工服务市场在 2024 年旅行护理收入下滑 36% 后，到 2026
              年才恢复小幅增长。对 Clipboard
              来说，这意味着两件事。第一，拥有强重复使用的本地市场平台，可能比旅行业务占比高的中介更有韧性。第二，上市可比公司仍提醒投资者：用工服务具周期性、服务重，除非模型证明结构性更优，否则很少获得软件式收入倍数。资本充足性同样难判断：超过
              $90M 的融资和反复盈利说法听起来让人安心，但没有当前现金、烧钱或营运资本披露，融资依赖无法排除。
