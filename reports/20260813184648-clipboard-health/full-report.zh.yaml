  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与证据质量
        blocks:
          - type: paragraph
            body: >-
              起点简单但不完美。Clipboard 在 2022 年 Series C 中宣布 $1.3 billion 投后估值，Business Wire 将公司描述为盈利、基于 app，且过去 18 个月总收入增长 25
              倍。TechCrunch 同样称 Series B 和 C 合计融资 $80 million。已抓取语料中最新且最具体的收入数据点，是 GetLatka 的 2024 年 $313.7 million
              数字，但该来源是低置信度追踪器，不是审计文件。Clipboard 的 AI
              博客元描述另称公司已盈利多年，方向上有利，但仍不能替代董事会质量的财务资料。在此基础上，估值工作必须依赖情景分析，而不是单一干净可比倍数。正确读法不是说 $313.7 million
              数字为假；而是投资者应把它视为临时输入，它会实质影响所有下游结论，并显著拉宽今天投资者面对的公允价值区间。
