  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局原型与最接近同行
        blocks:
          - type: paragraph
            body: >-
              Clipboard 不应只与其他创业型市场平台比较。相关格局从本地自助排班 app，一直延伸到全国性企业劳动力管理老牌公司。最接近的流程类比是 CareRev，其 FAQ
              同样描述了一个移动市场：机构发布开放日薪班次，本地临床人员只选择自己想接的班。ShiftMed 也在本地按需端竞争，但其主张不同：围绕本地 W-2 护士和相对高价合同劳动力的成本节约来搭建技术平台。Trusted
              更靠近旅行和合同生命周期一侧，面向全美 50 个州的临床人员营销 AI 驱动决策和移动自助匹配。Aya 和 AMN 则是更广的老牌公司：Aya 把自己定义为先进的医疗劳动力管理平台，叠加 MSP 和 AI
              规划层；AMN 则把自己营销为有 40 年历史、覆盖数百万临床人员和数千客户的用工服务领导者。因此，Clipboard 处在一个拥挤的竞争楔形区：比老牌公司更敏捷、更产品化，但合规和企业深度更弱。
