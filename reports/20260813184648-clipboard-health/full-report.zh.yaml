            body: >-
              公开记录支持一个谨慎正面的财务判断，但需要打上很大的透明度折扣。Clipboard 看起来比早期用工 app 更成熟：定价真实、规模真实、客户提到运营
              ROI，公司也多次被描述为盈利。但几乎所有承保最关键的问题——抽佣率、毛利率、按细分的贡献利润率、坏账风险、工作者付款浮存、账上现金、烧钱和分群留存——仍未公开。这个组合应阻止投资者过度解读标题 ARR
              数字。下一步不该是争论业务「好」还是「坏」的叙事，而是索取审计报表和分群经济性，以确认 Clipboard 是一个持久、盈利的市场平台，还是一个运营高效但仍具周期性的用工中介。
