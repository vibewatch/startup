          - type: paragraph
            body: >-
              公开差异化叙事在流程便利性上强，在深层技术披露上弱。Clipboard
              有说服力地营销快速本地填补、再次邀请带来的连续性、全国覆盖，以及工作者对流程的控制。它也显示信任与安全基础设施存在：生物识别、位置权限、受保护健康信息处理和持续支持。同样重要的是它没有展示的部分：没有公开解释排序或匹配逻辑，没有测量过的可靠性或正常运行时间历史，没有清晰
              API 或集成界面，也没有在已抓取材料中浮现 SOC 2、HITRUST 或 ISO 等企业安全工件。因此，产品技术尽调应把 Clipboard
              视为一个有真实工程规模的强运营平台，但还不能视为一个透明记录的软件护城河。如果公司确实拥有独特匹配或欺诈检测技术，当前公开记录看不见，这会限制外部投资者在没有管理层资料室支持时为软件溢价承保的激进程度。
