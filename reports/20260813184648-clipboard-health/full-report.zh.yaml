      - number: '6.4'
        title: 客户结论
        blocks:
          - type: paragraph
            body: >-
              公开客户证据支持一个正面但有条件的结论。Clipboard
              明确服务于碎片化、时间敏感的用工市场中的真实需求，买家看重覆盖速度，工作者看重灵活收入。最强证据来自临终关怀、居家医疗和长期护理，案例研究把产品与更快填补、更广地理覆盖、更多病例、护理连续性和更低行政负担相连。工作者端也通过应用商店列表和大规模评论足迹显示出清晰采用信号。不过，证据基础仍偏向公司筛选的成功案例和混合的第三方工作者轶事，而不是独立审计的客户留存或满意度数据集。因此，尽调应把
              Clipboard 的客户位置视为真实且已规模化，并可能在后急性期细分有强势地位；但在假设公开成功故事能干净外推到整个网络之前，应要求分群留存、重复预订、总流失、工作者供给质量和投诉解决数据。
