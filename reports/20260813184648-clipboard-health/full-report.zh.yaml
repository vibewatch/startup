              因此，情景估值是最干净的公开方法。如果 Clipboard 的收入基数更接近 $250 million 而不是 $313.7 million，旧的 $1.3 billion 标记意味着约 5.2x
              收入；如果收入基数约为 $350 million，同一标记约为
              3.7x。这些水平相对上市可比仍偏高，但如果管理层能证明强重复预订行为、真实盈利、高填补质量、良好营运资本动态和可管理法律敞口，就更容易理解。一个合理的仅公开资料框架，是因 Clipboard
              运营双边数字市场而给予其相对用工服务同行的溢价，但因收入质量和法律稳固性未被公开验证而相对私募市场高峰热度打折。该逻辑指向低于 2022
              年标记的基准情景区间；只有私有尽调同时验证收入数字和护城河，上行才会回到独角兽水平附近。
