              Clipboard 不应只按纯软件或纯用工服务估值。混合可比组更合理：医疗用工老牌公司捕捉劳动密集和周期性，劳动力市场平台捕捉软件层可扩展性和网络效应。用工服务一侧，把 AMN 和 Cross Country
              的当前市值与近期收入运行率比较，收入倍数都很低。市场平台一侧，Upwork 和 Fiverr 的倍数略高，但如果使用 2024 ARR 数字，仍远低于 Clipboard 隐含的 4.1x
              标记。这个差距不会自动说明 Clipboard 估值过高，因为私营公司可以因更快增长、集中所有权、较低流通压力或更干净的盈利能力获得溢价。但它确实意味着，公司必须用私有证据赚到这份溢价。仅靠公开可比公司，无法支持
              2026 年估值应自然高于 2022 年独角兽估值的假设。
