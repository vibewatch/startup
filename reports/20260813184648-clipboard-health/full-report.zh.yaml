        title: 产品流程与功能模块
        blocks:
          - type: paragraph
            body: >-
              Clipboard 的核心产品是一套双边流程，连接需要补位的机构和想要灵活本地工作的专业人员。公开网站和工作者 app
              列表描述的流程一致：机构按角色、日期和时间创建班次；合格工作者发现并即时预订，无需审批环节；Clipboard
              处理排班、文档和付款；机构可再次邀请可靠工作者以保持连续性。产品明显为即时性优化，而不是为漫长实施周期优化。应用商店描述强调快速入驻、灵活排班、即时付款、AM/PM/夜班发现，以及对工作地点和时间的控制。细分页面显示，同一流程被重新包装为长期护理、居家医疗和临终关怀、医院与牙科的垂直模块。这说明产品策略不是按垂直行业建立不同代码库，而是在共同的市场核心上，叠加特定护理场景的信任、资质和用工语言。
