            body: >-
              创始人 Wei Deng 仍是公司最核心的公开面孔。About 页上的创始人说明把 Clipboard 描述为一家使命驱动公司，旨在帮助资源有限的家庭；一篇 Y Combinator
              访谈回顾了公司在落地医疗用工前经历的多次产品前转向。Deng 之外的领导层可见度并不均衡。公开招聘页面显示 “Bo” 为联席 CEO，并列出 Warren
              为首席财务与商务官，但公司主站没有公布完整高管名册、董事会构成或独立董事细节。这种治理不透明，与 2022 年融资节点的相对清晰形成反差：Clipboard 确认 2021 年完成 IVP 领投的 $50
              million Series B，2022 年 2 月完成 Sequoia 领投的 $30 million Series C，投后估值 $1.3 billion。Business Wire 在 2022
