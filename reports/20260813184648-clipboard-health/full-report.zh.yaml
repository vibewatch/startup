      - number: '2.3'
        title: 买家、用户和付款方分层，以及采用路径
        blocks:
          - type: paragraph
            body: >-
              Clipboard
              的市场机制直接，但黏性不低。用户是想要灵活本地班次和快速付款的临床人员或护理助理；买家是机构运营方、排班协调员、DON、科室经理或居家医疗调度员；付款方最终是医疗服务组织，其劳动力预算承担班次成本，以及为速度、节假日或差异化覆盖支付的溢价。采用最强的场景，是空缺班次会立刻造成运营痛点的地方——养老院临时请假、居家医疗中随患者量变化的上门需求、医院加班压力，或牙科诊所的卫生积压。官方客户故事和细分页面显示，买家最在意三类结果：填补速度、重复工作者带来的连续性，以及无需先雇固定全职员工就能扩大服务区域或患者量。这些都是本地市场平台有吸引力的用例，但也带来采用约束：机构需要对资质、连续性、HIPAA
              处理和劳动者分类有信心；一些系统达到足够规模后，可能更偏好 MSP 供应商或内部机动池。
