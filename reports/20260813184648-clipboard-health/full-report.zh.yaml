              还称过去 18 个月总收入增长 25 倍。第二，Clipboard 2026 年 “AI at Clipboard”
              文章的元描述称公司已盈利多年，这支持持续盈利的说法，但仍是营销文案，不是审计披露。第三，GetLatka 报告称 Clipboard 达到 $313.7M 的 2024 ARR 或收入，最后更新时间为 2025
              年 11 月下旬。如果该数字方向正确，Clipboard 已经进入严肃规模区间，而融资仅约
              $90M+。但证据质量较弱：没有审计损益表，没有递延收入或分群披露，没有毛利率，也没有按长期护理、居家医疗、医院或牙科分拆。正确解读不是认定数字为假，而是它仍不足以支撑精确建模。
