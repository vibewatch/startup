      - number: '6.3'
        title: 工作者端体验、满意度与投诉
        blocks:
          - type: paragraph
            body: >-
              工作者证据方向上正面，但明显混杂。Apple 和 Google
              应用商店列表营销快速入驻、自选排班、附近班次发现和快速提现，这与一个为重复消费者式使用而打造的产品一致，而不只是企业工作流。评论聚合器也捕捉到真实吸引力：JustUseApp
              摘录包括易于发现班次、没有工作压力、工资率好和日结等赞誉。但同一页面也记录了围绕支持响应、薪酬下调、争议处理，以及机构可在缺少可见申诉路径的情况下将临床人员列入 DNR
              的实质负面体验。这很重要，因为工作者信任是供给端留存问题，而不只是声誉噪音。Comparably
              提供了另一个角度：员工评价整体较正面，尤其是客户支持团队内部评价较好，可能意味着内部服务文化较强，但这些是员工评价，不是市场工作者 NPS。综合来看，Clipboard
              似乎有真实工作者需求和重复使用，但公开记录仍未说明在付款争议、取消和机构层面分歧等边缘场景中，体验能否保持稳定。
