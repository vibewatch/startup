        blocks:
          - type: paragraph
            body: >-
              Clipboard 的信任栈引入了第二个复杂合规面。隐私政策称，公司在部分流程中可作为 HIPAA 业务伙伴运营。California notice 称，许多重要 app 功能需要 “Always” 和
              “Precise Location” 权限，并涉及敏感个人信息。do-not-sell 页面称，某些共享可在 California 隐私法下构成出售；生物识别政策称，Clipboard
              使用面部特征模板做身份验证，并以支持 BIPA 和 Colorado 隐私合规为目标制定政策。这些披露好过沉默，但也确认 Clipboard 同时跨越多个敏感数据制度：劳动力身份、地理位置、广告 /
              隐私权利，以及医疗相邻信息。公开来源仍没有展示安全认证、已发布的审计摘要或生物识别错误率的量化披露，因此在审阅私有控制之前，投资者应假设存在有意义的合规执行风险。
