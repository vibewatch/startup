      - number: '7.2'
        title: 安全、支持与运营可靠性风险
        blocks:
          - type: paragraph
            body: >-
              即便分类模式经得住考验，下一层风险也是运营信任。Clipboard
              自有支持中心保留了工作者投诉和安全问题板块，包括如何报告安全事件的指引。这是审慎做法，但也说明安全投诉已经足够反复出现，值得设置专门流程。第三方工作者评论摘录提到支持薄弱、意外调薪、付款问题，以及机构对临床人员
              DNR 时追索路径有限。关于 gig-nursing 平台的外部报道，包括点名 Clipboard
              的故事，则提出了更广泛担忧：工作者进入陌生机构时，如果培训或后援不足，一旦出错会发生什么。单独看，这些来源都不能证明系统性失败，投诉网站也天然偏负面。但合在一起，它们显示市场可靠性不只是增长问题；它也是患者安全、工作者留存和声誉风险问题。对在护理环境中运营的用工平台来说，边缘故障处理是核心控制，不是后台细节。
