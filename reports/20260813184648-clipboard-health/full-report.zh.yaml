companyProfile:
  summary: >-
    Clipboard Health 是一家总部位于 San Francisco 的医疗用工市场，Wei Deng 于 2016
    年创立。产品把医疗机构与本地临床人员连接起来，临床人员可通过移动端浏览并预订空缺班次；公开证据尤其集中在长期护理、临终关怀和居家医疗。公司在 2022 年 2 月 Series C 中披露投后估值达 $1.3
    billion，目前已有显著公开规模信号，但官方来源把临床人员定义为独立承包商，因此劳动模式能否经得起法律检验，是尽调的核心问题。
