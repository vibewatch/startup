      - number: '3.3'
        title: 转换成本、多平台使用与护城河稳固性
        blocks:
          - type: paragraph
            body: >-
              竞争激烈，因为市场两端都可以多平台使用。临床人员可以在手机上保留多个 app，机构也可以把空缺班次分配给内部机动池、中介、ShiftMed、CareRev、Aya、AMN、People Powered
              这类本地经纪商或直接招聘。硬技术护城河因此很难建立。Clipboard
              最可能的护城河，是在杂乱、数字化不足的用工类别中形成本地密度；在那里，快速响应和重复工作者信任比企业报表仪表盘更重要。官方案例研究显示了一些真实连续性：Quiet Embrace 称 90%
              的班次由重复临床人员覆盖，The Vineyards 称 Clipboard 一小时内能补上班次，还能作为永久招聘漏斗。但这些优势仍是行为上的，不是合同上的。Aya 和 AMN
              在采购主导的企业交易中可能更占上风；ShiftMed 借 W-2 劳动力讲出更强合规故事；CareRev 的产品模式又足够相似，除非 Clipboard
              在最强细分中的本地填补率和重复预订经济性显著更好，否则商品化风险真实存在。
