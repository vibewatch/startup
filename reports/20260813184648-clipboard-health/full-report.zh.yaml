        title: 收入模式、定价与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Clipboard
              的公开定价材料指向按使用量收费的市场模式，而不是经常性软件订阅。定价页称，每类角色都有标准时薪，机构只有在选择节假日工资、约定班次差额或取消后的更高费率替换等项目时才支付更多。工作者端的设计服务于流动性：app
              和工作者页面强调即时预订班次、付费即时到账，以及免费情况下几天内付款。合在一起，财务逻辑看起来是在按小时用工交易上叠加价差或服务毛利，变现由成功班次数量、定价纪律和重复使用驱动，而不是按席位 SaaS
              合同驱动。由于公司没有公布一侧为工作者工资、另一侧为机构账单费率的价目表，精确抽佣率仍未知。缺失的这座桥，是一个有前景的市场故事与可融资单位经济模型之间的核心缺口。
