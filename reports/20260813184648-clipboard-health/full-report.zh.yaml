      - number: '2.2'
        title: 劳动力短缺、成本压力与监管需求驱动
        blocks:
          - type: paragraph
            body: >-
              Clipboard 最强的结构性需求驱动，不是抽象的数字化，而是持续的临床劳动力稀缺。ANA 称美国有 4.3 million 名注册护士，但 HRSA 2025 年 12 月预测仍显示，2028 年 RN 短缺
              8%，到 2038 年 LPN 缺口接近 246,000，非都市地区压力更重。AHCA 2024 年养老院调查说明了这种压力如何传导到 Clipboard 的核心终端市场：99% 的养老院报告有空缺岗位，89%
              正在招聘 RN，72% 仍低于疫情前用工水平。与此同时，AHA 称劳动力现在占医院成本的 56%，广告中的 RN 薪资在过去四年比通胀快
              26.6%，使临时补班和本地机动人力在经济上具备吸引力，即便疫情后旅行护士热潮已退。CMS 2024 年最终最低配员规则又给长期护理加了一层放大器：它把每住民每日 3.48 小时标准写入规则，其中包括 0.55
              小时 RN 和 2.45 小时护理助理。该规则不会自动把需求交给 Clipboard，但会加深更快本地用工供给的结构性需求，而这正是 Clipboard 已宣称具备规模的细分。
