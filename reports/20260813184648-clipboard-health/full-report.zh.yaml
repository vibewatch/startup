            body: >-
              最后一层风险，是政策漂移叠加扩张脆弱性。Nurse.org 对 AI Now 报告的总结认为，gig-nursing
              平台正在游说重塑用工规则，而算法定价、承包商身份和监控式管理可能招来更多州层面阻力。HealthPoint 2026 年概览把医疗劳动法描述为更复杂，而不是更简单，尤其是在隐私、AI
              和工资工时问题交叉时。Clipboard
              在后急性期的成功也可能形成集中度风险，一旦监管、报销或机构经济性转向不利，这些细分会受压。与此同时，如果不满供给削弱填补质量，或引发集体诉讼式叙事，混杂的工作者体验可能成为扩张约束。平衡结论是，只有当合规、事件响应和工作者经济性在营销层之下真正强健时，Clipboard
              的风险栈才可管理。公开记录尚未证明这种强度，因此审慎投资立场应把风险控制作为首要尽调工作流，而不是常规法律清单。
