      - number: '6.2'
        title: 机构端价值证明与黏性
        blocks:
          - type: paragraph
            body: >-
              Clipboard 官方案例研究提供了最清晰的证据，说明机构能获得可衡量价值。Holistic Care Hospice 称 Clipboard 帮其在六个月内把覆盖区域翻倍、带来 25% 收入增长、增加 40
              多个新病例，并每周节省超过五小时行政工作。Starlight Hospice 称其两个月新增五名患者，把用工覆盖从一个县扩至六个县，包括接触到讲西班牙语的护理人员，并每周节省超过十小时。Quiet Embrace
              称 Clipboard 平均不到四小时即可填补班次，且 90% 的班次由重复临床人员覆盖。The Vineyards 称填补时间从四小时降至一小时，并最终全职雇用了三名来自 Clipboard
              的专业人员。这些数据点说明，产品不只是填一次性缺口：它可以扩大服务半径、增加患者量、降低后台工作量、改善连续性，甚至创造招聘选择权。需要注意的是，四个故事都由公司筛选，因此高度相关，但并非完全独立。
