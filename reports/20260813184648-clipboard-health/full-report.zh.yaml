  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户地图、买家与受益人结构
        blocks:
          - type: paragraph
            body: >-
              Clipboard 的客户结构比普通 B2B SaaS 账户列表更复杂。机构是直接经济买家，因为它们发布班次并为已填补劳动力付费。临床人员是日常产品用户，因为他们通过 app
              发现、预订并完成这些班次。患者和住民是下游受益人，因为用工连续性决定护理质量和可及性。公开页面显示，公司服务长期护理、居家医疗和临终关怀、医院与牙科，但客户证据内容密度在后急性期和社区场景最强。这一点重要，因为这些环境中的价值主张直接且偏运营：快速填补空缺覆盖、减少行政抢救式协调，并保持连续性。网站的规模主张——超过
              6,500 个工作场所、超过 9 million 个已覆盖班次，以及 125,000 名工作者在平台赚到超过
              $1,000——说明这不是一个试点客户群。即便如此，公开材料没有披露按细分的集中度、企业合同期限或留存分群，因此客户图景最好理解为广泛的市场渗透，但收入质量可见度仍不完整。
