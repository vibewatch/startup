  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: Audited income statement, cash flow statement, balance sheet, gross margin and contribution margin by segment.
      whyItMatters: Without audited statements, the ARR figure and profitability claims cannot be translated into defensible valuation or capital-efficiency conclusions.
      diligencePath: Request audited financials, monthly management accounts and board materials covering revenue quality, margins and cash generation.
      relatedQuestionRefs: [QI005, QI007, QI022]
    - type: private-evidence-only
      severity: material
      topic: runway-and-liquidity
      missingEvidence: Cash on hand, burn, working-capital needs, payment-float structure and credit facilities.
      whyItMatters: A marketplace with instant pay and replacement guarantees can have hidden liquidity demands even if GAAP profitability is positive.
      diligencePath: Request treasury policy, cash balances, borrowing lines and worker-payment timing waterfalls.
      relatedQuestionRefs: [QI009, QI019, QI023]
    - type: private-evidence-only
      severity: material
      topic: cohort-economics
      missingEvidence: Net revenue retention, facility churn, worker retention and cohort contribution margins by care setting.
      whyItMatters: Revenue magnitude alone cannot show whether growth is durable or whether certain segments are loss-making.
      diligencePath: Review cohort dashboards by facility type, geography and vintage.
      relatedQuestionRefs: [QI020, QI024]
    - type: conflicting-data
      severity: minor
      topic: arr-verification
      missingEvidence: Independent corroboration for GetLatka's 2024 revenue figure.
      whyItMatters: The tracker gives a useful scale anchor, but relying on a single low-reputation secondary source is not enough for precision.
      diligencePath: Cross-check with audited financials, lender materials or board-approved KPI packs.
      relatedQuestionRefs: [QI002, QI005, QI018]
