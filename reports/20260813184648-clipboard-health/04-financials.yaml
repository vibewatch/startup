company:
  name: Clipboard Health
chapter:
  number: 4
  title: Financials
  summary: >-
    Clipboard Health's public financial picture is unusually mixed: official materials and 2022 press
    coverage describe a profitable marketplace with transparent hourly pricing and flexible payouts,
    while a third-party tracker reports $313.7M of 2024 ARR. But the company still does not publish
    audited revenue, take rate, gross margin, burn, runway or cohort economics, so the strongest
    public conclusion is that Clipboard likely has real scale and potentially positive unit economics,
    yet remains too opaque for a high-conviction financial underwriting without data-room access.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing and monetization logic
    body: >-
      Clipboard's public pricing materials point to a usage-based marketplace model rather than a
      recurring software subscription. The pricing page says each role type has a standard hourly rate
      and that facilities only pay more when they opt into items such as holiday pay, agreed shift
      differentials or higher-rate replacements after cancellations. The worker side is designed for
      liquidity: the app and worker pages emphasize instant shift booking, instant pay for a fee and
      payment within a few days for free. Put together, the financial logic appears to be a spread or
      service-margin model layered onto hourly staffing transactions, with monetization driven by
      successful shift volume, pricing discipline and repeat usage instead of seat-based SaaS contracts.
      Because the company does not publish a rate card with worker pay on one side and facility bill
      rates on the other, its exact take rate remains unknown. That missing bridge is the central gap
      between a promising marketplace story and a financeable unit-economics story.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI018, CI026, CI028, CI034]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: public-traction-and-revenue-quality
    title: Public traction, revenue scale and quality of evidence
    body: >-
      There are only three public datapoints that speak directly to Clipboard's revenue quality. First,
      Business Wire and TechCrunch both described the business as profitable when it announced the 2022
      Series C, and Business Wire said gross revenue had grown 25x over the prior 18 months. Second,
      the meta description of Clipboard's 2026 "AI at Clipboard" post says the company has been
      profitable for years, which supports the idea of sustained profitability but is still marketing
      copy rather than audited disclosure. Third, GetLatka reports that Clipboard reached $313.7M of
      2024 ARR or revenue, last updated in late November 2025. If that figure is directionally right,
      Clipboard has already crossed into serious scale for a marketplace that has raised only around
      $90M-plus. But the evidence quality is weak: there is no audited income statement, no deferred-
      revenue or cohort disclosure, no gross margin and no segmentation by long-term care, home
      health, hospital or dental. The right interpretation is not that the number is false, but that it
      remains insufficiently verified for precision modeling.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI029, CI030, CI036]
    tableRefs: [TI002, TI005]
    figureRefs: [FI002]
  - id: delivery-costs-and-operating-complexity
    title: Delivery costs, support burden and working-capital complexity
    body: >-
      Clipboard's cost structure is not public, but the operating model reveals the main cost centers.
      Facilities expect fast fill, 24/7 support, documentation handling, worker credentialing, payment
      rails and replacement coverage when a clinician cancels. The support page says the support team
      is available 24/7, and the solutions pages promise replacements and high fill rates. The worker
      experience side shows why this matters financially: instant pay and low-friction booking help
      attract supply, but they also imply capital movement, fraud controls and customer-service costs.
      Worker complaints on JustUseApp about pay corrections and weak support suggest that service
      intensity is not theoretical. Financially, the contractor model likely lowers direct payroll and
      benefit burden relative to W-2 pools, but it does not eliminate operational expense; instead it
      shifts the pressure into marketplace support, payment accuracy, trust-and-safety and legal risk.
    claimRefs: [CI003, CI005, CI015, CI016, CI017, CI018, CI032, CI034, CI037]
    tableRefs: [TI003]
    figureRefs: [FI003]
  - id: comp-context-and-capital-adequacy
    title: Public-comp context and capital adequacy
    body: >-
      Public staffing comparables highlight how hard it is to value Clipboard as if it were software.
      AMN's investor site reported Q2 2026 revenue of $673M and adjusted EBITDA of $73M, while Yahoo
      Finance shows annual revenue levels above $3.4B on its current AMN income-statement page. Cross
      Country Healthcare's public data tell an equally important story: revenue peaked at roughly
      $2.803B in 2022 and then fell to about $1.054B in 2025, while its market cap was only about
      $0.42B in August 2026. Healthcare Business Today says the broader staffing market is only
      returning to slight growth in 2026 after a 36% travel-nursing revenue drop in 2024. For
      Clipboard, that means two things. First, a local marketplace with strong repeat usage may be more
      resilient than a travel-heavy agency. Second, public comps still remind investors that staffing is
      cyclical, service-heavy and rarely rewarded with software-like revenue multiples unless the model
      proves structurally superior. Capital adequacy is likewise hard to judge: more than $90M of
      financing and repeated profitability claims sound reassuring, but without current cash, burn or
      working-capital disclosure, financing dependency cannot be cleared.
    claimRefs: [CI009, CI020, CI021, CI022, CI023, CI024, CI025, CI033, CI035]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The public record supports a cautiously positive financial read with a large transparency
      discount. Clipboard looks more mature than an early-stage staffing app: pricing is real, scale is
      real, customers cite operational ROI, and the company has repeatedly been described as profitable.
      But almost every diligence question that matters for underwriting — take rate, gross margin,
      contribution margin by segment, bad-debt risk, worker-payment float, cash on hand, burn and cohort
      retention — is still private. That combination should keep investors from over-reading the
      headline ARR figure. The right next step is not a narrative debate about whether the business is
      “good” or “bad,” but a request for audited statements and cohort economics that can confirm
      whether Clipboard is a durable, profitable marketplace or just an efficiently run but still
      cyclical staffing intermediary.
    claimRefs: [CI006, CI007, CI010, CI017, CI018, CI025, CI026, CI029, CI035]
