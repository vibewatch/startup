company:
  name: Clipboard Health
chapter:
  number: 6
  title: Customers
  summary: >-
    Clipboard Health serves a multi-sided customer system: healthcare facilities pay for coverage,
    clinicians use the product to find shifts and get paid, and patients or residents benefit when care
    continuity improves. Public evidence is strongest in post-acute settings — especially hospice,
    long-term care and other coverage-constrained facilities — where official case studies cite faster
    fill times, repeat-clinician usage, geographic expansion and reduced administrative burden. Worker-
    side evidence from app stores is broadly positive on flexibility and pay speed, but third-party
    review sites also surface recurring complaints about support, pay adjustments and dispute handling.
    The customer story is therefore attractive but mixed: there is strong proof of real usage and local
    value creation, but less independent evidence on enterprise account durability or worker satisfaction
    at scale.
sections:
  - id: customer-map
    title: Customer map, buyer and beneficiary structure
    body: >-
      Clipboard's customer structure is more complex than a normal B2B SaaS account list. Facilities are
      the direct economic buyers because they post shifts and pay for filled labor. Clinicians are the
      daily product users because they discover, book and work those shifts through the app. Patients and
      residents are downstream beneficiaries because staffing continuity determines care quality and access.
      Public pages show the company serving long-term care, home health and hospice, hospitals and dental,
      but the density of customer-proof content is strongest in post-acute and community-based settings.
      That matters because the value proposition in those environments is immediate and operational: fill
      open coverage quickly, reduce administrative scramble and preserve continuity. The website's scale
      claims — more than 6,500 workplaces, more than 9 million shifts covered and 125,000 workers earning
      over $1,000 on the platform — indicate that this is not a pilot customer base. Even so, public
      materials do not disclose concentration by segment, enterprise contract lengths or retention cohorts,
      so the customer picture is best read as broad marketplace penetration with incomplete revenue-quality
      visibility.
    claimRefs: [CF001, CF002, CF003, CF004, CF005, CF006, CF007, CF008, CF009, CF010]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]
  - id: facility-proof
    title: Facility-side proof of value and stickiness
    body: >-
      Clipboard's official case studies provide the clearest evidence that facilities derive measurable
      value. Holistic Care Hospice says Clipboard helped double its coverage area in six months, produce
      25% revenue growth, add more than 40 new cases and save more than five hours of administrative work
      each week. Starlight Hospice says it added five new patients in two months, expanded staffing from
      one county to six, including access to Spanish-speaking caregivers, and saved more than ten hours
      weekly. Quiet Embrace says Clipboard fills the average shift in under four hours and that 90% of
      shifts are staffed by repeat clinicians. The Vineyards says fill time fell to one hour from four,
      with three Clipboard-sourced professionals eventually hired full-time. Those data points suggest the
      product does more than plug one-off holes: it can expand service radius, increase patient volume,
      reduce back-office workload, improve continuity and even create recruiting optionality. The caveat is
      that all four stories are company-curated, so they are highly relevant but not fully independent.
    claimRefs: [CF011, CF012, CF013, CF014, CF015, CF016, CF017, CF018, CF019, CF020, CF021, CF022, CF023, CF010]
    tableRefs: [TU003]
    figureRefs: [FU002, FU003]
  - id: worker-experience
    title: Worker-side experience, satisfaction and complaints
    body: >-
      Worker evidence is directionally positive but clearly mixed. Apple and Google app-store listings
      market fast onboarding, self-selected scheduling, nearby-shift discovery and quick payout, which is
      consistent with a product built for repeat consumer-style use rather than enterprise workflow only.
      Review aggregators also capture genuine appeal: JustUseApp excerpts include praise such as easy shift
      discovery, no pressure to work, good pay rates and daily pay. But the same page records materially
      negative experiences around support responsiveness, pay reductions, dispute handling and facilities'
      ability to DNR clinicians without visible recourse. That matters because worker trust is a supply-
      side retention issue, not just a reputational nuisance. Comparably adds a different angle: employee
      reviews are broadly positive overall and especially positive within customer support, which may imply
      strong internal service culture, but those are employee reviews rather than marketplace worker NPS.
      Netting it out, Clipboard appears to have real worker demand and repeated usage, but the public
      record leaves open whether the experience remains consistently good during edge cases such as payout
      disputes, cancellations and facility-level disagreements.
    claimRefs: [CF024, CF025, CF026, CF027, CF028, CF029, CF030, CF031, CF032]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: customer-verdict
    title: Customer verdict
    body: >-
      Public customer evidence supports a positive but qualified conclusion. Clipboard clearly serves real
      demand in fragmented, time-sensitive staffing markets where buyers value coverage speed and workers
      value flexible earnings. The strongest proof sits in hospice, home health and long-term care, where
      case studies tie the product to faster fill, wider geographic reach, more cases, continuity of care
      and lower administrative burden. The worker side also shows clear adoption signals through app-store
      listings and large review footprints. However, the evidence base still skews toward company-selected
      wins and mixed third-party worker anecdotes rather than independently audited customer-retention or
      satisfaction datasets. Diligence should therefore view Clipboard's customer position as real and
      scaled, with likely post-acute segment strength, but should require cohort retention, repeat-booking,
      gross churn, worker-supply quality and complaint-resolution data before assuming the public success
      stories generalize cleanly across the full network.
    claimRefs: [CF006, CF010, CF018, CF019, CF021, CF024, CF027, CF029, CF033, CF034, CF035]
    tableRefs: [TU005]
    figureRefs: []
