    columns: [Signal type, Positive evidence, Negative evidence, Read-through]
    rows:
      - [App-store product copy, "Flexibility, shift choice, instant pay", "None in listing copy itself", "Strong acquisition message"]
      - [Review excerpts, "Easy shifts, no pressure, good pay, daily pay", "Support, payout and DNR complaints", "Real usage with painful edge cases"]
      - [Employee review proxy, "94% positive employee reviews; support team 99% positive", "Operations team has more constructive feedback", "May support service culture but not worker NPS"]
      - [App directories, "500K+ downloads and 5K+ reviews visible on mirrors", "Mirror data inherits store limitations", "Suggests meaningful mobile scale"]
    notes: "Worker satisfaction evidence is mixed and should not be over-read from marketing copy alone."
    claimRefs: [CF024, CF025, CF026, CF027, CF028, CF029, CF030, CF031, CF032]
  - id: TU005
    title: Customer diligence gap table
    columns: [Gap, Why it matters, Public status, Next diligence step]
    rows:
      - [Facility retention cohorts, "Need to know if usage is durable", "Not publicly disclosed", "Request logo churn and cohort retention"]
      - [Repeat-booking rates outside case studies, "Determines stickiness and continuity", "Only anecdotal/public-case evidence", "Request marketplace retention dashboards"]
      - [Worker complaint-resolution metrics, "Supply trust affects fill reliability", "Not publicly disclosed", "Request ticket SLA and payout dispute data"]
      - [Segment revenue mix, "Post-acute concentration affects risk", "Not publicly disclosed", "Request GMV and revenue split by care setting"]
      - [Enterprise account concentration, "Large customers could drive volatility", "Not publicly disclosed", "Request top-account exposure"]
    notes: "Customer scale is visible; customer quality and durability still require private operating data."
    claimRefs: [CF033, CF034, CF035]
