    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: Official stories list named customer examples and quantified outcomes, but the public corpus is still incomplete relative to the full customer base so this table is a sample of named proof points.
    columns: [Customer, Public metric, Outcome, What it suggests]
    rows:
      - [Holistic Care Hospice, "25% revenue growth", "40+ new cases and 5+ admin hours saved weekly", "Coverage can unlock growth"]
      - [Starlight Hospice, "5 new patients in 2 months", "Expanded from 1 county to 6 and saved 10+ hours weekly", "Marketplace improves reach and labor access"]
      - [Quiet Embrace Hospice, "Average shift filled in under 4 hours", "90% repeat clinicians across 3 counties", "Fast fill plus continuity"]
      - [The Vineyards, "1 hour fill time down from 4", "3 Clipboard workers hired full-time", "Value extends into recruiting pipeline"]
    notes: "Useful evidence of customer value, but every example is company-curated rather than independently audited."
    claimRefs: [CF011, CF012, CF013, CF014, CF015, CF016, CF017, CF018, CF019, CF020, CF021, CF022, CF023, CF010]
  - id: TU004
