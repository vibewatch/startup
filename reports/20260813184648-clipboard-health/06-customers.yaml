  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Facility logo retention, revenue retention, repeat-booking cohorts and worker reactivation curves.
      whyItMatters: Public stories show value creation, but investment conviction requires evidence that this value persists across the broader installed base.
      diligencePath: Request cohort dashboards by facility segment and worker tenure, plus gross and net churn data.
      relatedQuestionRefs: [QU019, QU023]
    - type: private-evidence-only
      severity: material
      topic: segment-mix
      missingEvidence: Revenue and GMV mix by care setting, geography and top accounts.
      whyItMatters: Post-acute strength may coexist with concentration risk that is invisible in headline customer counts.
      diligencePath: Request segment P&L views and top-20 account exposure.
      relatedQuestionRefs: [QU020, QU018]
    - type: private-evidence-only
      severity: material
      topic: complaint-resolution
      missingEvidence: Ticket SLA metrics, payout-dispute resolution rates and worker complaint severity distribution.
      whyItMatters: Supply-side trust can erode quickly if operational failures are common, even when top-line usage remains high.
      diligencePath: Review support dashboards, complaint taxonomies and post-incident remediation data.
      relatedQuestionRefs: [QU021, QU012]
    - type: conflicting-data
      severity: minor
      topic: evidence-balance
      missingEvidence: Independent customer references that either confirm or rebut the uniformly positive official case studies.
      whyItMatters: Curated success stories alone can overstate typical outcomes, while anonymous reviews can overstate edge-case frustration.
      diligencePath: Conduct reference calls across retained, churned and power-user accounts plus high-activity clinicians.
      relatedQuestionRefs: [QU024, QU025]
      relatedTableRefs: [TU003]
