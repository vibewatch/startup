summary:
  headline: >-
    Clipboard Health has built a large and operationally credible healthcare staffing marketplace, but public evidence
    still leaves too much uncertainty on revenue quality, retention and contractor-model resilience to recommend
    underwriting the old unicorn mark aggressively.
  overallScore: 6.3
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
