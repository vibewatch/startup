company:
  name: Clipboard Health
chapter:
  number: 3
  title: Competitors
  summary: >-
    Clipboard Health competes across several distinct models rather than in one clean peer set:
    self-serve local marketplaces such as CareRev, compliance-first local labor pools such as
    ShiftMed, AI-driven clinician marketplaces such as Trusted, and broad enterprise staffing suites
    such as Aya and AMN. Clipboard's edge appears strongest in fast local fill, repeat-booking and
    long-term-care/home-health density, but its official independent-contractor model is a strategic
    disadvantage against W-2 competitors when a facility buyer prioritizes labor-law risk transfer.
sections:
  - id: landscape-and-archetypes
    title: Landscape archetypes and closest peers
    body: >-
      Clipboard should not be compared only to other startup marketplaces. The relevant landscape runs
      from local self-serve shift apps to national enterprise workforce-management incumbents. The
      closest workflow analogue is CareRev, whose FAQ likewise describes a mobile marketplace where
      facilities post open per diem shifts and local clinicians choose only the shifts they want.
      ShiftMed competes at the local on-demand end too, but its pitch is different: a technology
      platform built around local W-2 nurses and cost savings versus premium contract labor. Trusted
      sits nearer the travel and contract lifecycle side, marketing AI-driven decisions and mobile
      self-serve matching for clinicians across all 50 states. Aya and AMN are broader incumbents:
      Aya frames itself as an advanced healthcare workforce-management platform with MSP and AI
      planning layers, while AMN markets itself as a 40-year staffing leader with millions of
      clinicians and thousands of clients. Clipboard therefore lives in a crowded competitive wedge:
      more nimble and productized than incumbents, but with less compliance and enterprise depth.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP011, CP013, CP014, CP015, CP016, CP026]
    tableRefs: [TP001, TP002]
    figureRefs: [FP001]
  - id: model-and-scale-comparison
    title: Delivery model, classification and scale comparison
    body: >-
      The most important competitive split is worker model. Clipboard's current FAQ and terms say the
      platform uses independent contractors. ShiftMed's homepage explicitly highlights local W-2 nurses,
      a positioning choice that can resonate with hospital and nursing-home buyers that want less
      classification ambiguity. CareRev appears to be marketplace-first and commitment-light, which
      puts it close to Clipboard on user experience even if its exact employment structure is not as
      prominently marketed. Trusted emphasizes the broader staffing and scheduling lifecycle, and Aya
      and AMN go further still into enterprise workflow, MSP and labor-management services. Scale also
      matters. Clipboard's public site shows 6,500+ workplaces, 9 million shifts covered and 1 million
      workers, which is meaningful startup-scale density. But AMN says it supports 10,000+ clients and
      2,000,000+ clinicians nationwide, while public-company data and filings show multibillion-dollar
      revenue bases and capital-market access that Clipboard lacks. In other words, Clipboard does not
      win on breadth or balance-sheet heft; it wins only where simplicity and speed matter more than
      enterprise process breadth.
    claimRefs: [CP001, CP002, CP003, CP007, CP008, CP009, CP010, CP011, CP017, CP020, CP023, CP024, CP025, CP032, CP034]
    tableRefs: [TP003]
    figureRefs: [FP002]
  - id: switching-costs-and-moat
    title: Switching costs, multi-homing and moat durability
    body: >-
      Competition is intense because both sides of the marketplace can multi-home. Clinicians can keep
      multiple apps on their phones, and facilities can route open shifts across internal float pools,
      agencies, ShiftMed, CareRev, Aya, AMN, People Powered-like local brokers or direct recruitment.
      That makes hard technological moats difficult. Clipboard's best moat candidate is local density
      inside messy, under-digitized staffing categories where fast response and repeat-worker trust are
      more important than enterprise reporting dashboards. Official case studies suggest some real
      continuity: Quiet Embrace says 90% of shifts are staffed by repeat clinicians, and The Vineyards
      says Clipboard can fill shifts in an hour and also serve as a funnel for permanent hires. But
      those strengths are still behavioral, not contractual. Aya and AMN likely have the upper hand in
      procurement-led enterprise deals; ShiftMed has a stronger compliance story via W-2 labor; and
      CareRev's product model looks sufficiently similar that commoditization risk is real unless
      Clipboard's local fill rates and repeat-booking economics are materially better in its strongest
      segments.
    claimRefs: [CP002, CP014, CP017, CP018, CP019, CP020, CP021, CP022, CP027, CP028, CP029, CP030, CP031, CP033, CP035]
    tableRefs: [TP004]
    figureRefs: [FP003]
  - id: competitor-verdict
    title: Competitive verdict
    body: >-
      The market is crowded but not hopelessly undifferentiated. Clipboard's best public comparative
      story is that it sits between CareRev's low-friction marketplace model and ShiftMed's utility in
      local staffing, while serving operationally painful segments such as long-term care and home
      health where fast local coverage matters. The bad news is that the current official contractor
      model means the company cannot claim a clean compliance advantage over W-2 rivals, and it has far
      less public scale transparency than AMN, Aya or public staffing companies. Competitive success
      therefore depends on operational density rather than on abstract software superiority. If
      Clipboard's repeat-worker, time-to-fill and facility-retention metrics are truly superior in its
      core segments, it can defend a durable niche. If not, the feature set looks replicable and the
      marketplace may be trapped between stronger compliance-first startups and broader incumbents.
    claimRefs: [CP002, CP011, CP018, CP019, CP020, CP031, CP033, CP034, CP035]
