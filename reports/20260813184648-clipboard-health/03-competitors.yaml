    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP017, CP025, CP032, CP034]
  - id: TP004
    title: Switching-cost and moat matrix
    columns: [Dimension, Clipboard Health, Stronger rival, Implication]
    rows:
      - [Worker classification comfort, "Independent-contractor model", ShiftMed, "Clipboard loses if buyer prioritizes labor-law risk transfer"]
      - [Urgent local fill speed, "Official pages stress same-day and repeat coverage", Clipboard, "Potential niche strength versus heavier incumbents"]
      - [Enterprise procurement / MSP, "Limited public evidence", Aya or AMN, "Clipboard likely loses large-system breadth contests"]
      - [Marketplace UX similarity, "Very similar to CareRev's marketplace workflow", CareRev, "High feature-level commoditization risk"]
      - [Public financial transparency, "Low", AMN or CCRN, "Harder for buyers and investors to benchmark durability"]
      - [Behavioral continuity moat, "Customer stories cite repeat clinicians and hires", Clipboard, "Useful if repeat rates are truly durable"]
    notes: "Moat assessment is behavioral and segment-specific, not a claim that Clipboard has a universal platform advantage."
    claimRefs: [CP014, CP017, CP018, CP019, CP020, CP027, CP028, CP029, CP030, CP031, CP034, CP035]
