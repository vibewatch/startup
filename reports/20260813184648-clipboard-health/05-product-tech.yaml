  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-and-security
      missingEvidence: Uptime history, incident logs, SLA terms and formal security artifacts such as SOC 2 or HITRUST.
      whyItMatters: Enterprise buyers need proof that trust controls are not only documented in policies but operated reliably at scale.
      diligencePath: Request security package, uptime dashboards, incident summaries and external audit reports.
      relatedQuestionRefs: [QE018, QE019]
    - type: private-evidence-only
      severity: material
      topic: matching-and-integrations
      missingEvidence: Matching/ranking logic, API or integration documentation and performance metrics.
      whyItMatters: Product defensibility and enterprise stickiness depend on how much of the workflow is genuinely automated and integrable.
      diligencePath: Request architecture docs, integration list, API references and matching-quality KPIs.
      relatedQuestionRefs: [QE011, QE023]
    - type: private-evidence-only
      severity: minor
      topic: biometric-performance
      missingEvidence: False-positive/false-negative rates and vendor/governance detail for facial verification.
      whyItMatters: Identity verification is central to patient safety and worker access, but public policy language does not prove operational quality.
      diligencePath: Review vendor contracts, QA metrics and dispute-resolution data for verification failures.
      relatedQuestionRefs: [QE008, QE022]
    - type: conflicting-data
      severity: minor
      topic: app-experience-gaps
      missingEvidence: A reconciled view between first-party product promises and third-party complaint rates.
      whyItMatters: Great marketplace design can still fail if payout, support or cancellation flows are brittle in practice.
      diligencePath: Compare app-store retention, support SLAs and complaint-resolution metrics with review sentiment.
      relatedQuestionRefs: [QE024]
