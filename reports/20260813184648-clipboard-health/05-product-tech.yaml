      - [AI attention, "AI at Clipboard post", "Shows product/engineering interest in AI", "No public model or performance data"]
      - [Programming with LLMs, "Programming assessment with an LLM post", "Indicates dev-tooling openness", "Not evidence of customer-facing moat"]
      - [Hiring discipline, "How We Hire at Clipboard", "Suggests operator-driven talent funnel", "No direct product KPI disclosed"]
    notes: "Technical blog metadata provides directional evidence of engineering maturity but limited system specifics."
    claimRefs: [CE024, CE025, CE026, CE027, CE028, CE029, CE030, CE031]
  - id: TE005
    title: Public product-gap table
    columns: [Gap, Why it matters, Public status, Diligence ask]
    rows:
      - [Matching logic transparency, "Determines fill quality and fairness", "Not publicly explained", "Request ranking, matching and fairness docs"]
      - [Security certification, "Enterprise trust requirement", "No SOC 2/HITRUST/ISO found in fetched sources", "Request security package"]
      - [Reliability / uptime, "Core operational resilience metric", "No public SLA or uptime history found", "Request incident and uptime logs"]
      - [Integration surface, "Affects enterprise adoption and workflow stickiness", "No public API/integration detail found", "Request product roadmap and integrations list"]
      - [Biometric performance, "False positives/negatives affect safety and access", "Policy discloses use but not performance", "Request verification QA metrics"]
    notes: "Missing public disclosure does not prove the capability is absent; it does mean product diligence cannot assume it exists."
    claimRefs: [CE021, CE022, CE023, CE033, CE034, CE035]
