      - [World-model capability, "Genie 2 is described as generating action-controllable playable 3D environments.", "Comparator capability, not Prague evidence.", "Obtain Prague technical report, demo protocol, and reproducible examples."]
      - [Model disclosure, "Sora discloses inputs, output limits, diffusion/transformer approach, and training-data categories.", "Disclosure benchmark only.", "Obtain Prague model card, data provenance, context limits, and evaluation results."]
      - [Developer surface, "Qwen's public Hugging Face organization lists models, datasets, spaces, and activity.", "A comparable public developer signal exists for Qwen, not Prague.", "Verify Prague repositories, package releases, model downloads, and contributor activity."]
    notes: "Rows separate Prague-specific evidence from competitor or ecosystem comparators; absence from the assigned pool is an evidence gap, not proof of nonexistence."
    claimRefs: [CE001, CE002, CE003, CE004]
  - id: TE002
    title: Technology and operating architecture
    columns: [Layer/process, Role illustrated by retained evidence, Prague status, Dependency or risk]
    rows:
      - [World representation, "Sora uses compressed latent video representations decomposed into spacetime patches.", "Not disclosed.", "Data scale, representation quality, and temporal consistency require primary proof."]
      - [Dynamics and control, "Genie 2 uses a transformer dynamics model with action-conditioned generation.", "Not disclosed.", "Action fidelity, horizon, latency, and failure recovery are unknown."]
      - [Simulation and evaluation, "The embodied-intelligence survey pairs physical simulators with world models for training and evaluation.", "Not disclosed.", "Sim-to-real transfer, benchmark selection, and environment coverage are unknown."]
      - [Agent harness, "Lin describes tools, sandboxes, feedback, and train-serve decoupling as core agentic infrastructure.", "Not disclosed.", "Tool isolation, reward hacking, observability, and operating cost are unknown."]
    notes: "This is a comparator architecture, not a claim that Prague uses these components; every Prague status is intentionally marked not disclosed."
    claimRefs: [CE005, CE006, CE007, CE008]
  - id: TE003
    title: Deployment and trust-control checklist
    columns: [Control area, Evidence-backed comparator, Prague status, Underwriting implication]
    rows:
      - [Evaluation, "Sora reports internal and external red-team work, including more than 15,000 generations tested.", "Not disclosed.", "Require test set, failure taxonomy, and independent evaluation results."]
      - [Content and misuse controls, "Sora describes filtering, moderation thresholds, age gating, and likeness-upload restrictions.", "Not disclosed.", "Require threat model, policy controls, and abuse-monitoring design."]
      - [Traceability, "Sora describes visible watermarks, reverse video search, and ongoing provenance research.", "Not disclosed.", "Require provenance, audit-log, and incident-response controls appropriate to the product."]
      - [Deployment reliability, "Genie 2 says examples maintain a consistent world for up to a minute, while the survey discusses generalization challenges.", "Not disclosed.", "Require latency, uptime, horizon, sim-to-real, and rollback targets."]
    notes: "Comparator controls are not assumed to transfer one-for-one to Prague; the table identifies evidence required before judging deployment readiness."
    claimRefs: [CE009, CE010, CE011, CE012]
