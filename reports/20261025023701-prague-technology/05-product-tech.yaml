chapter:
  number: 5
  title: Product & Technology
  summary: Prague Technology is described in the available refresh context as a Shanghai-based world-model and embodied-AI startup, but the assigned evidence pool contains no successful public Prague Technology product or technical URL. The surrounding technical evidence shows that world models require controllable simulation, multimodal modeling, agent environments, and explicit safety controls; Prague's implementation, deployment maturity, and differentiation therefore remain unverified.
sections:
  - id: product-definition
    title: Product definition and maturity
    body: >-
      The available company description characterizes Prague Technology as a world-model and
      embodied-AI startup, but the assigned successful fetches do not include a company
      homepage, product page, API, model card, repository, benchmark, customer deployment,
      or technical paper attributable to Prague Technology. That is a material diligence
      limitation rather than evidence that no product exists. Public comparators illustrate
      the range of what a mature technical disclosure looks like: Google DeepMind describes
      Genie 2 as a foundation world model that generates action-controllable, playable 3D
      environments from a single prompt image, while OpenAI's Sora system card specifies
      multimodal inputs, output limits, a diffusion/transformer design, training-data
      categories, evaluations, and deployment mitigations. Prague's customer workflow,
      product surface, supported modalities, model access, and measurable benefit cannot be
      verified against that baseline.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-and-differentiation
    title: Architecture, operating model, and differentiation
    body: >-
      The technical evidence points to a demanding architecture problem. Genie 2 describes
      autoregressive latent diffusion over video-derived latent frames, a transformer
      dynamics model, action conditioning, and a need to maintain world consistency across
      time. The embodied-intelligence survey frames physical simulators and world models as
      complementary components: simulation provides controlled training and evaluation, while
      world models support predictive planning and adaptation. Junyang Lin's discussion of
      agentic systems adds an operating-model constraint: the model is trained and evaluated
      with its environment or harness, including tools, sandboxes, feedback, and safeguards
      against reward hacking. None of the assigned sources establishes that Prague has built
      any particular stack, data pipeline, simulator, inference service, or proprietary
      feedback loop. Differentiation should consequently be underwritten only after primary
      technical materials and reproducible evaluations are obtained.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: trust-deployment-risks
    title: Deployment, reliability, and trust controls
    body: >-
      Product risk is elevated by the gap between compelling demonstrations and robust
      deployment. The survey identifies the sim-to-real and generalization problem as a
      central challenge for embodied intelligence. Sora's system card provides a concrete
      comparator for controls that a production generative system may need: external red
      teaming, content filtering, age gating, restrictions on likeness uploads, watermarking,
      reverse-search tooling, and iterative monitoring. These controls are not evidence that
      Prague faces the same exact misuse cases, but they show the level of operational detail
      required to assess a foundation model product. Public evidence in the assigned pool
      does not disclose Prague's reliability targets, incident history, privacy posture,
      security testing, export-control operating plan, evaluation suite, or support model.
      The investment case should therefore treat technical maturity and deployment readiness
      as open questions, not as inferred strengths from founder pedigree or sector momentum.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
