    notes: "The comparator and market rows are directional context, not proof of Prague Technology revenue, valuation, or market share."
    claimRefs: [CV003, CV005, CV006, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Differentiated world-model product; paid deployments; verified financing terms", "Upside is possible only after a milestone-backed price and observable revenue conversion", "Compute access, competition, execution", "Low-to-medium; requires several unverified conditions"]
      - [Base, "Technical progress continues; monetization remains early; financing is preference-heavy or opaque", "Track and seek staged entry; do not use the headline mark as fair value", "Dilution, delayed revenue, multiple compression", "Medium; consistent with current evidence gaps"]
      - [Bear, "No paid commercialization or financing evidence; open-model substitution and compute constraints persist", "Down-round, recapitalization, or loss of invested capital becomes plausible", "Commercial failure, financing overhang, talent loss", "Material downside; trigger if diligence fails"]
      - [Decision gate, "Primary documents and operating KPIs become available", "Re-rate only when price, dilution, and cash-flow drivers can be modeled", "False precision from narrative valuation", "Unresolved"]
    notes: "Scenario values are qualitative because the pool does not support a defensible USD valuation range, return target, or probability estimate."
    claimRefs: [CV010, CV011, CV012, CV013, CV016]

