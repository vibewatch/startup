company:
  name: Prague Technology
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a high-uncertainty track rather than a price-backed buy. The assigned pool contains useful market and comparator evidence, but no usable primary disclosure that independently confirms Prague Technology's current financing terms, valuation, revenue, or capitalization table.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: "Prague Technology should remain a track rather than a buy on the evidence available for this refresh. The company is associated with a high-credential world-model and embodied-AI thesis, but the pool does not provide a directly usable financing announcement, term sheet, audited financial statement, or cap-table disclosure for Prague Technology itself. That makes a price-sensitive recommendation impossible without false precision. The market context is supportive: China Daily reporting based on State Taxation Administration data says embodied-AI enterprise sales rose 22.4% year on year in January-May 2026 and industrial purchases of embodied-AI robots increased 2.3-fold, while the same report says 3,025 related enterprises existed as of May 2026. Those figures support market opportunity, not Prague Technology's share, margins, or conversion into cash flows. Marktechpost's account of Lin Junyang's transition from Qwen technical leadership toward agentic systems supports founder credibility and strategic relevance, but not enterprise value. The appropriate entry discipline is to require verified round size, price per share, preference stack, ownership, runway, product milestones, and evidence of paid deployment before underwriting a valuation or target return."
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and financing overhang
    body: "The investment thesis has two evidence-backed pillars and three material counters. First, the sector is expanding, with reported growth in Chinese embodied-AI sales and industrial adoption. Second, the founder's prior Qwen work is connected to a credible shift from static model reasoning toward agentic systems, including tool use and environment feedback. The anti-thesis is that market growth can coexist with severe selection and financing risk: Gasgoo reports a $455 million Pre-A round for competitor TARS, and says the capital is being used to develop proprietary models and recruit talent, illustrating the scale of capital required and the intensity of the comparator set. TheAI Rankings describes Qwen3.6 as an open-weight model under Apache 2.0 with free self-hosting, creating potential pricing and differentiation pressure for model-centric businesses. Forbes' reporting on tranched AI financings shows why a headline valuation can materially overstate a blended economic price and why employee or later-investor pricing can diverge from the first tranche. For Prague Technology, the missing financing documents are therefore not a clerical gap: they determine dilution, liquidation preference, cash available, and whether the reported or implied price is investable."
    claimRefs: [CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario framework and diligence triggers
    body: "A scenario range is more defensible than a point estimate because the assigned evidence does not establish revenue, ARR, customer count, gross margin, burn, or a confirmed round price. The bull case requires proof that Prague Technology converts founder and research credibility into a differentiated product, secures paid industrial or platform deployments, and retains enough compute access to iterate under export-control constraints. The base case assumes continued technical development and sector growth but delayed monetization, with a valuation that must be negotiated against milestone evidence rather than narrative scarcity. The bear case combines an unverified or preference-heavy financing price with weak commercialization, open-model substitution, compute constraints, or talent dilution; in that case the last round would not be a reliable mark and a down-round or recapitalization risk would be material. The decision should move from track to invest only after primary documents answer the financing questions and operating evidence supports a model-appropriate revenue or milestone framework. Exit readiness is currently low because no public evidence in this pool establishes liquidity, a strategic buyer process, or a credible exit window."
    claimRefs: [CV010, CV011, CV012, CV013]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence
    title: Final diligence asks and thesis-break triggers
    body: "The next diligence packet should include the signed financing documents, capitalization table on a fully diluted basis, option-pool treatment, liquidation and participation preferences, pro-rata rights, investor concentration, debt, and unrestricted cash. It should also include monthly management accounts, runway and burn reconciliation, revenue contracts, paid-pilot conversion, deployment reliability, compute procurement, export-control counsel, model evaluations against relevant open and closed alternatives, and a hiring and retention plan. The thesis breaks if the company cannot substantiate the claimed financing or valuation, if material proceeds are unavailable because of preference or escrow terms, if technical milestones repeatedly slip without paying customers, or if compute access prevents reproducible training and deployment. A valuation committee should use a staged entry with milestone-based release rather than relying on a headline mark. The public evidence supports the diligence path and a track recommendation; it does not support a precise target return, exit multiple, or investment price."
    claimRefs: [CV014, CV015, CV016]

