company:
  name: Prague Technology
chapter:
  number: 4
  title: Financials
  summary: Prague Technology has publicly disclosed neither operating revenue nor unit economics, while available reporting points to a large early financing and a capital-intensive world-model and embodied-AI strategy. The underwriting case therefore rests on financing durability, compute and deployment costs, and proof that future customer activity can become repeatable revenue rather than on demonstrated cash generation.
sections:
  - id: revenue-and-monetization
    title: Revenue model remains unproven
    body: >-
      Public evidence does not establish a current revenue stream, ARR, customer count, realized
      pricing, or revenue-recognition policy for Prague Technology. The available financing coverage
      describes the company as a new AI laboratory focused on world models and embodied intelligence,
      but does not identify a paid product, contract structure, or recurring customer obligation.
      Industry evidence shows several possible monetization layers rather than one validated model:
      model access, enterprise integration, deployment and maintenance, and potentially physical
      systems or partner economics. Those layers have different gross-margin and working-capital
      profiles. The prudent underwriting position is therefore “pre-revenue or undisclosed,” not
      zero revenue, and each scenario must keep company claims, third-party reports, and analyst
      estimates separate.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: go-to-market-and-cost-drivers
    title: Commercial path is tied to expensive deployment
    body: >-
      The most credible external market evidence points to a deployment-led ecosystem in which
      software, system integration, deployment, and maintenance are economically distinct. A
      State Taxation Administration data summary reported that January–May 2026 embodied-AI sales
      rose 22.4% year over year, while supporting information-system services revenue rose 1.9-fold;
      this supports a market mechanism, not Prague Technology traction. A separate WAIC account says
      the industry is moving from demonstrations toward production but that operational uptime and
      total cost of deployment were not disclosed for highlighted deployments. For Prague Technology,
      sales-cycle length, compute pass-through, integration labor, support burden, and customer
      concentration remain open. Until a customer contract or deployment cohort is disclosed, a
      high-value model API or enterprise license cannot be assumed to have software-like margins.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Financing is a runway input, not proof of cash available
    body: >-
      A Sina Finance report, relaying The Information, described a first financing of “数亿美元”
      and an approximately $2 billion post-money valuation, including reported $100 million
      investments from GaoRong and Sequoia China and a $20 million Tencent investment. Those are
      reported transaction terms, not a verified cash balance, unrestricted cash amount, or runway.
      The company’s compute strategy may require substantial recurring GPU, data, and engineering
      expenditure before product revenue is established. The Silicon Review also described proposed
      Chinese restrictions affecting advanced models, training data, algorithms, and semiconductor
      partnerships; because the measures were still under review in that article, the financial
      implication is scenario risk rather than a booked cost. Cash, burn, debt, committed compute,
      tranche conditions, and next-round triggers remain material diligence requests.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial case is investable only as a high-uncertainty option on future commercialization.
      Positive evidence includes reported access to substantial initial capital and a market with
      growing activity in embodied-AI sales and related services. Counterweights are more important
      for underwriting: no public revenue or margin proof, no disclosed customer cohort, no
      disclosed cash or burn, and exposure to compute and cross-border technology constraints.
      The reported valuation should not be translated into a revenue multiple because the denominator
      is unavailable. A financing headline also should not be treated as cash available without
      confirmation of tranche terms, closing status, restrictions, and post-close liquidity. The
      recommendation from this chapter is research-more: request a monthly management pack,
      capitalization table, signed commercial pipeline, compute commitments, and a bridge from
      customer activity to gross profit.
    claimRefs: [CI002, CI008, CI009, CI011, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Model or API access, "Usage or contract fees for model inference", "Requests, tokens, or contract", "Not publicly disclosed", "Unverified private metric", "Obtain price book, billed usage, discounts, and recognized revenue"]
      - [Enterprise integration, "Implementation around customer workflows", "Deployment or project", "Market mechanism only; Prague contract not disclosed", "Industry proxy", "Obtain signed contracts, cycle time, implementation labor, and acceptance terms"]
      - [Embodied-AI deployment, "System, model, or service deployed into operations", "Site, robot, or production cell", "No Prague deployment cohort disclosed", "Unverified private metric", "Obtain installed base, uptime, support cost, and customer references"]
      - [Support and maintenance, "Post-deployment information-system services", "Annual or service engagement", "Sector evidence exists; company value unavailable", "Third-party sector proxy", "Separate recurring support revenue from one-time integration"]
    notes: "Prague Technology-specific pricing and revenue are not publicly disclosed; sector rows are mechanisms and proxies, not company traction."
    claimRefs: [CI001, CI003, CI005, CI006, CI007]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Commercial layer, Price or contract basis, List vs realized, Discount/unknowns, Underwriting implication]
    rows:
      - [Model access, "No public list price located in assigned evidence", "Unavailable", "Usage, minimums, and cloud pass-through unknown", "Cannot estimate ARR or gross margin"]
      - [Enterprise license, "No public contract or license schedule", "Unavailable", "Term, renewal, and implementation allocation unknown", "Cannot model retention or sales efficiency"]
      - [Physical or operational deployment, "No public Prague unit price", "Unavailable", "Hardware, integration, and service allocation unknown", "Potentially lower margin and higher working capital"]
      - [Financing, "Reported first round of several hundred million dollars", "Transaction report, not revenue", "Exact amount, tranches, and restrictions require verification", "Funds runway diligence but does not create a revenue multiple"]
    notes: "The table distinguishes unavailable company pricing from a reported financing transaction; no realized customer price is inferred."
    claimRefs: [CI001, CI002, CI009, CI013]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue run rate, null, "Low / unavailable", "Determines whether valuation can be tested against operating scale", "Monthly recognized revenue and reconciliation to invoices"]
      - [Gross margin, null, "Low / unavailable", "Separates scalable model economics from compute and service intensity", "Cloud/GPU, data, support, and deployment cost bridge"]
      - [CAC and payback, null, "Low / unavailable", "Tests whether reported market opportunity converts efficiently", "Cohort-level acquisition spend, cycle, win rate, and payback"]
      - [Cash on hand and runway, null, "Low / unavailable", "Determines financing dependency and next-round timing", "Bank cash, restricted cash, monthly burn, committed spend, and debt"]
      - [Customer concentration, null, "Low / unavailable", "Measures downside from a small number of early deployments", "Top-customer revenue, backlog, renewal, and termination terms"]
    notes: "Null values mean the assigned public evidence did not disclose company-specific figures; they are diligence requests, not zero values."
    claimRefs: [CI001, CI004, CI008, CI011, CI012, CI014]
