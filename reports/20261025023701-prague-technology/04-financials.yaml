callouts:
  - calloutType: risk
    title: Capital adequacy is unverified
    body: Reported financing should be treated as a transaction signal, not as cash available or runway, until closing terms, restrictions, current cash, burn, and committed compute are supplied.
    claimRefs: [CI009, CI011, CI012]
  - calloutType: recommendation
    title: "Underwriting stance: research-more"
    body: Do not use a revenue multiple or assume software-like margins until Prague Technology provides revenue recognition, customer contracts, compute costs, and a cash-to-runway bridge.
    claimRefs: [CI001, CI004, CI013, CI014]
