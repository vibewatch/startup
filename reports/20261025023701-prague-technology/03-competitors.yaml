      - [TARS, "$455M Pre-A reported", "Robots, data suite, and industrial deployment", "Hardware-software-data integration", "Capital-intensive delivery and unverified commercial conversion"]
      - [Frontier neolabs, "Valuations and funding can be tranched", "Research-led capital formation", "Talent and compute access", "Headline valuation may not equal blended economic value"]
      - [Internal build, null, "Enterprise engineering and infrastructure", "Workflow and proprietary data control", "Hiring, compute, and maintenance burden"]
    notes: "Funding and valuation signals are not revenue, ARR, cash available, or customer traction. Null pricing means the assigned pool did not provide a comparable public price."
    claimRefs: [CP003, CP006, CP007, CP011, CP012, CP013]

