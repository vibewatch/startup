    title: "The key comparison is deployment posture"
    body: "Qwen demonstrates open-weight software distribution while TARS demonstrates a vertically integrated embodied route; Prague Technology's deployment posture is not yet evidenced."
    claimRefs: [CP006, CP008, CP014]
  - calloutType: risk
    title: "Funding headlines are a weak moat proxy"
    body: "Reported AI financing can combine tranches at different prices, so headline valuation comparisons should not be treated as comparable proof of competitive strength."
    claimRefs: [CP011, CP012, CP013]
  - calloutType: recommendation
    title: "Require a defined buyer job before underwriting differentiation"
    body: "Obtain a product specification, buyer, pricing unit, reference deployment, and workload benchmark before concluding that Prague Technology has a durable competitive advantage."
    claimRefs: [CP010, CP014]

