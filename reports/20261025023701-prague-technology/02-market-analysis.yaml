    notes: "Boundary is an analytical classification from the chapter evidence; category values are not additive market totals and company-specific inclusion is unverified."
    claimRefs: [CM001, CM002, CM003]
  - id: TM002
    title: Sizing and market-signal lenses
    columns: [Publisher, Year/period, Geography, Value or rate, Methodology, Confidence, Limitation]
    rows:
