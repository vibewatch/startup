artifact: market-analysis
slug: prague-technology
runDate: 2026-10-25
company:
  name: Prague Technology
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Prague Technology appears positioned at the intersection of Chinese embodied-AI
    infrastructure, agentic-model research, and industrial automation. The assigned
    evidence supports a rapidly expanding China market and clear technical adoption
    drivers, but it does not disclose a company-specific SAM, customer pipeline,
    pricing model, or product validation; sizing is therefore a set of bounded lenses,
    not a company forecast.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >
      This chapter treats the relevant market as software, models, data and
      deployment services that enable AI systems to perceive, reason, and act
      through physical machines, with industrial and research buyers as the primary
      demand base. It excludes general-purpose cloud AI, consumer robotics sold
      without an embodied-model or deployment layer, and the full revenue of
      hardware suppliers unless that revenue is specifically tied to embodied-AI
      systems. The boundary matters because the assigned evidence mixes model
      infrastructure with robot bodies and system integration: the State Taxation
      Administration data reported by China Daily separately identify robot bodies and
      complete machines, AI algorithms and software integration, and system
      integration and industry applications. A credible Prague Technology market
      case should therefore not add those categories into one undifferentiated TAM.
      An independent-reporting query also returned Prague City Tourism rather than
      evidence about the startup. That naming collision is a source-discovery false
      positive, and place-based tourism is explicitly outside the market boundary.
      Bridging China reports that Lin Junyang's venture is focused on world models
      and embodied intelligence, but the assigned evidence does not establish which
      product or deployment layer it will commercialize.
      The practical substitutes are conventional industrial automation, scripted
      perception and control stacks, human-operated teleoperation, and general
      language-model APIs that do not close the loop with a physical environment.
      The market is strategically attractive because agentic systems need tool
      servers, sandboxes, environment feedback, and train-serve decoupling, but the
      company-specific evidence does not establish which layer Prague Technology
      will monetize.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >
      The strongest quantitative lens is China embodied AI rather than a global
      world-model TAM. China Daily reports 3,025 existing China embodied-AI enterprises
      as of May 2026, 408 new companies in 2025, and January-May 2026 sector sales
      growth of 22.4% year over year. It also reports category growth of 30.1% for
      robot bodies and complete machines, 24.5% for AI algorithms and software
      integration, and 27.9% for system integration and industry applications.
      These are reported sales-growth indicators, not a market-size total and not
      Prague Technology revenue. A second lens is the funding market: Bridging
      China reports a roughly $2 billion post-money valuation for Lin Junyang's new
      AI lab; that is a financing signal, not demand or cash available to the
      company. A third lens is comparable
      technical supply: The AI Rankings describes Qwen 3.6 open weights as
      Apache-2.0 and self-hostable, with cited hosted prices of approximately
      $0.60 input and $3.60 output per million tokens for the 27B model. Open
      weights and low API prices can compress model-layer pricing while increasing
      the value of proprietary environments, integration, data, and reliability.
      No assigned source isolates Prague Technology's obtainable SAM or SOM, so any
      such figure remains a diligence gap.
    claimRefs: [CM004, CM005, CM006, CM007, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, adoption path, and constraints
    body: >
      The evidence points to industrial enterprises, system integrators, research
      organizations, and strategic technology investors as distinct buying or
      financing audiences. China Daily reports that purchases of embodied-AI robots by
      industrial enterprises rose 2.3-fold in January-May 2026 and that supporting
      information-system services revenue rose 1.9-fold, which supports an
      adoption path from pilot hardware and model evaluation to deployment,
      integration, and maintenance budgets. Gasgoo's report on TARS provides a
      concrete adjacent-company pattern: a large financing round was paired with
      robot hardware, a data-acquisition suite, a model, and industrial assembly
      milestones. That is not evidence that Prague Technology has equivalent
      products, but it shows the buyer problem is typically a system sale rather
      than a standalone model sale. The main constraints are proof of task
      success, integration with existing factory workflows, compute and data
      intensity, safety and reliability, switching costs, and the risk that open
      models make the base capability interchangeable. Forbes' reporting on
      staged AI financing also cautions that headline valuations can diverge from
      blended economics, so capital-market enthusiasm should not be used as a
      proxy for product-market fit.
    claimRefs: [CM008, CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: market-gaps
    title: Market diligence gaps and downside cases
    body: >
      The market is growing, but the evidence does not resolve whether Prague
      Technology owns a differentiated technical wedge or can reach paying users.
      Lin's published discussion, as reproduced by MarkTechPost, describes agentic
      thinking as sustained action in an environment and identifies tool choice,
      noisy observations, plan revision, and multi-turn coherence as requirements.
      It also identifies reward hacking, tool-server quality, and train-serve
      decoupling as infrastructure risks. Those constraints make deployment
      quality and environment access potential moats, while simultaneously raising
      implementation cost and failure risk. Qstheory's concentration data indicate
      nearly 90% of China's embodied-AI enterprises are concentrated in Guangdong,
      Beijing, Shanghai, Zhejiang, and Jiangsu; this may help ecosystem access but
      also implies dense competition for talent, capital, and industrial partners.
      The assigned pool does not provide verified Prague Technology customer
      commitments, product pricing, unit economics, deployment reliability,
      regulatory approvals, or a company-specific market share path. Those are
      material unresolved questions rather than assumptions to fill with the
      reported sector growth rates.
      The tourism result and the inaccessible China Daily allocation also show why
      search-result relevance and readable source text cannot be assumed merely from
      a successful HTTP response.
    claimRefs: [CM002, CM013, CM014, CM015]
