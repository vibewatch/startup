      - ["China Daily via Qiushi Theory", "2026 Jan-May", China, "Robot purchases by industrial enterprises 2.3x; supporting information services revenue 1.9x", "Reported tax-data operating indicators", medium, "No absolute spend base or company attribution"]
      - [Bridging China, 2026, "China AI financing", "Approx. $2B post-money valuation", "News account citing sources familiar with the financing", low, "Financing valuation, not demand, revenue, funding raised, or cash available"]
      - [The AI Rankings, 2026, Global model supply, "$0.60 input / $3.60 output per 1M tokens for Qwen3.6-27B", "Hosted-price comparison citing Artificial Analysis/OpenRouter", medium, "Comparator pricing; not Prague Technology pricing or margin"]
    notes: "Values preserve each source's metric, denominator, period, and uncertainty; no TAM, SAM, or SOM is computed from unlike measures."
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM016]
  - id: TM003
    title: Buyer and adoption map
    columns: [Segment, Buyer, User, Payer/budget owner, Workflow, Adoption trigger]
    rows:
      - [Industrial enterprise, "Factory innovation or operations", "Production and maintenance teams", "Plant or transformation budget", "Pilot, integration, monitored production task", "2.3-fold reported increase in robot purchases"]
      - [System integrator, "Solution architect or account team", "Deployment engineers and end customer", "Project or services budget", "Configure, deploy, maintain, and support", "Demand for integration and maintenance services"]
      - [AI lab or research organization, "Research lead", "Model and environment engineers", "R&D or strategic capital", "Train, evaluate, and iterate in controlled environments", "Need for tool use, feedback, and agentic evaluation"]
      - [Strategic investor or platform partner, "Corporate venture or ecosystem lead", "Portfolio or platform teams", "Investment, cloud, or channel budget", "Finance, distribute, or embed capability", "Strategic exposure to embodied-AI growth"]
    notes: "Buyer roles and workflows are evidence-constrained archetypes derived from reported adoption and system patterns; Prague Technology's actual customer list and budget ownership are undisclosed."
    claimRefs: [CM008, CM009, CM010, CM011, CM016]
