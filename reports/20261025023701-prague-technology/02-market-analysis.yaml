callouts:
  - calloutType: insight
    title: Growth is visible; capture is not
    body: "China embodied-AI indicators show expanding enterprise formation, sales, and industrial adoption, but the assigned evidence does not connect those aggregates to Prague Technology's product, pricing, or customers."
    claimRefs: [CM004, CM008, CM015]
  - calloutType: risk
    title: Open models raise the proof threshold
    body: "Self-hostable model supply and low hosted prices can reduce the value of an undifferentiated model layer, making proprietary environments, deployment reliability, and customer outcomes the central diligence tests."
    claimRefs: [CM007, CM011, CM013]
