chapter:
  number: 1
  title: Company Overview
  summary: Public evidence in the assigned pool does not independently establish Prague Technology's identity, operating footprint, capitalization, or leadership beyond contextual reporting about Junyang Lin and the embodied-AI market. The chapter therefore separates corroborated sector and founder-context facts from material company-specific disclosure gaps.
sections:
  - id: identity-and-operating-context
    title: Identity and operating context
    body: Prague Technology is described in the runtime brief as a Shanghai-based world-model and embodied-AI startup, but the assigned successful sources do not contain a direct company profile, official website, filing, or customer disclosure for that entity. The available independent material instead places Junyang Lin in the Qwen ecosystem and describes a transition from model training toward agentic systems. Marktechpost reports that Lin was Alibaba's Qwen technical lead, announced his departure on March 3, 2026, and now presents himself as an independent researcher. That is relevant founder-context evidence, not proof of Prague Technology's incorporation, headquarters, product release, or commercial status. A direct identity source remains necessary before later chapters reuse these fields as ground truth.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The evidence pool does not identify Prague Technology's full founding team, executives, directors, or governance arrangements. The strongest available leadership evidence concerns Lin's prior technical role rather than a current company appointment: Marktechpost says he was the technical lead of Alibaba's Qwen project and that he now lists himself as an independent researcher. The source also describes a technical agenda spanning reasoning, tool use, environments, and agents, which helps explain potential founder-market fit but cannot establish board control, employment, or key-person concentration inside Prague Technology. Leadership diligence should obtain incorporation records, an authoritative team page, cap-table or shareholder disclosures, and confirmation of any continuing Alibaba relationship.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestone evidence
    body: >-
      No assigned source verifies Prague Technology's funding round, valuation, revenue, customers, headcount, debt, or cash runway. Forbes documents a broader 2026 pattern in which AI companies can publicize headline valuations while raising in tranches at materially different prices; it reports that the blended valuation is often unreported. That source supports a diligence warning about interpreting any unverified headline valuation, not a Prague Technology financing fact. The China embodied-AI sector source reports 3,025 existing enterprises as of May 2026 and 408 new companies in 2025, while also reporting rapid sales growth; these are market-context metrics and must not be attributed to Prague Technology. The milestone timeline is consequently evidence-limited and should be expanded only with direct company or filing evidence.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
    figureRefs: [FO001]
