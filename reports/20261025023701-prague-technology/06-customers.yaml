chapter:
  number: 6
  title: Customers
  summary: Public evidence does not identify a Prague Technology customer, production deployment, pilot, retention metric, or expansion contract. Sector evidence indicates a growing Chinese embodied-AI buyer base, but the company-specific commercial funnel remains unverified and should be treated as pre-commercial until management supplies customer-level proof.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: |
      Public reporting describes embodied AI as serving industrial production, software and information-technology services, scientific research, robotics, and prospective healthcare or industrial applications. China-wide data show that industrial enterprises increased purchases of embodied-AI robots 2.3-fold in January–May 2026, while supporting information-system services revenue rose 1.9-fold; those are sector observations, not Prague Technology results. World-model coverage similarly describes the category as potentially useful for robotics, delivery, healthcare, industrial process control, and wearables, but does not name Prague Technology as a supplier or customer-facing vendor. The investable segmentation therefore remains a hypothesis: industrial and robotics buyers may be the eventual payer, technical teams may be the user, and integration or deployment partners may be the channel. No public source establishes which segment Prague Technology has converted.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: The available evidence supports category demand, not company adoption. State Taxation Administration data reported by China Daily show 3,025 embodied-AI-related enterprises as of May 2026, 22.4% year-over-year sector sales growth in January–May, and 2.3-fold growth in industrial-enterprise robot purchases. Those denominators cover the sector and cannot be converted into Prague Technology accounts, active users, utilization, revenue, retention, or renewal. Independent world-model reporting also warns that research-first companies can take years to reach commercial applications; TechCrunch quotes AMI Labs' CEO saying world models are not a typical startup that releases in three months and reaches revenue in six months. Prague Technology has no public cohort, churn, NRR, GRR, contract-length, or customer-count disclosure in this pool.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration
    body: |
      No assigned source names a Prague Technology customer, describes a Prague Technology pilot, or reports a production deployment, outcome, renewal, expansion, or concentration statistic. Comparable evidence shows what stronger proof would look like: Gasgoo reports that TARS's A1 robot received clear purchase intentions from clients across industries and European countries, while TechCrunch identifies Nabla as AMI Labs' first disclosed partner and says early models would be evaluated with real-world data. These are competitor examples and cannot be attributed to Prague Technology. The current customer case is consequently asymmetric: the market may be forming, but there is no company-specific proof of conversion or durability. Management should provide named references, signed contract status, deployment dates, usage or outcome metrics, and revenue concentration.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: diligence-implications
    title: Commercial diligence implications
    body: |
      The strongest positive signal is an expanding Chinese embodied-AI ecosystem with measurable industrial purchasing activity. The strongest negative signal is evidentiary: the assigned pool contains no Prague Technology customer proof, and the company-specific customer funnel cannot be separated into prospect, pilot, production, paid deployment, repeat purchase, or expansion. Competitive world-model coverage also indicates long commercialization timelines and high dependence on real-world evaluation. Until management provides a customer schedule and primary evidence, customer quality should not support a revenue estimate, a retention assumption, or a valuation premium. The key diligence test is whether at least three references can confirm paid production use, measurable outcomes, renewal or expansion intent, and the share of revenue represented by the largest accounts.
    claimRefs: [CU013, CU014, CU015]
    figureRefs: [FU001]
