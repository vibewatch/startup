              - CP006
              - CP008
              - CP011
              - CP014
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The strongest observable competitive distinction in the evidence is distribution and deployment posture,
              not benchmark superiority. Qwen 3.6 is described as Apache-2.0 open-weight software that can be
              downloaded, self-hosted, and used commercially, with text, image, and video inputs; its hosted pricing is
              reported separately from the free-weight option. TARS is described as a vertically integrated embodied
              platform with A-series wheeled robots, T-series bipedal robots, a data-acquisition suite, and an open
              dataset, while Gasgoo also reports purchase intentions from European clients without disclosing signed
              contracts or revenue. These are materially different buying propositions: software adoption, hosted
              inference, and physical-system deployment carry different integration, safety, and support burdens. Lin’s
              discussion of agentic thinking adds a technical constraint relevant to future entrants: agentic systems
              depend on tool servers, sandboxes, environment feedback, and reward-hacking resistance, rather than only a
              model checkpoint. Prague Technology cannot yet be scored on these dimensions because the pool contains no
              official technical documentation, pricing page, security posture, customer reference, or independent
              benchmark for it.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a difficult moat test. Open-weight releases can reduce software switching
              costs through self-hosting and permissive licensing, while vertical embodied competitors can bind
              customers through hardware, data collection, deployment, and maintenance. TARS’s reported financing and
              product breadth indicate access to substantial capital and an industrial ecosystem, but the source is a
              trade publication and does not independently verify all performance claims. Forbes provides an adverse
              market signal: headline valuations for pre-product AI labs can be shaped by tranched financing and may not
              equal a blended economic valuation, while employees and later investors can bear different risk. That does
              not establish a problem at Prague Technology, but it makes financing headline comparisons unreliable as a
              moat proxy. A durable position would need evidence of proprietary data, model performance on a defined
              workload, distribution or partner access, customer retention, safety certification, or a workflow that is
              costly to replace. None is documented in the assigned pool, so displacement and commoditization risk
              remain material diligence questions.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Competitive diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The next competitive diligence step is to force comparability around one buyer job and one deployment
              unit. Obtain Prague Technology’s first public product description, target buyer, pricing or contract
              model, reference deployment, model or robot capability metrics, and compute and data dependencies. Then
              compare it with open-weight self-hosting, hosted model APIs, incumbent enterprise suppliers, and embodied
              platforms on total cost, latency, integration effort, safety obligations, and switching cost. The current
              evidence can establish that alternatives are active and well funded, but it cannot establish Prague
              Technology’s relative price-performance, win rate, or customer pull. Any investment conclusion that treats
              a reported financing round, a benchmark score from another model, or a competitor’s product announcement
              as proof of Prague Technology differentiation would exceed the source record.
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The key comparison is deployment posture
            body: >-
              Qwen demonstrates open-weight software distribution while TARS demonstrates a vertically integrated
              embodied route; Prague Technology's deployment posture is not yet evidenced.
            calloutType: insight
            claimRefs:
              - CP006
              - CP008
              - CP014
          - type: callout
            title: Funding headlines are a weak moat proxy
            body: >-
              Reported AI financing can combine tranches at different prices, so headline valuation comparisons should
              not be treated as comparable proof of competitive strength.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP013
          - type: callout
            title: Require a defined buyer job before underwriting differentiation
            body: >-
              Obtain a product specification, buyer, pricing unit, reference deployment, and workload benchmark before
              concluding that Prague Technology has a durable competitive advantage.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model remains unproven
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish a current revenue stream, ARR, customer count, realized pricing, or
              revenue-recognition policy for Prague Technology. The available financing coverage describes the company
              as a new AI laboratory focused on world models and embodied intelligence, but does not identify a paid
              product, contract structure, or recurring customer obligation. Industry evidence shows several possible
              monetization layers rather than one validated model: model access, enterprise integration, deployment and
              maintenance, and potentially physical systems or partner economics. Those layers have different
              gross-margin and working-capital profiles. The prudent underwriting position is therefore “pre-revenue or
              undisclosed,” not zero revenue, and each scenario must keep company claims, third-party reports, and
              analyst estimates separate.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
