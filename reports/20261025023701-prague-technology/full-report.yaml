      - number: '4.2'
        title: Commercial path is tied to expensive deployment
        blocks:
          - type: paragraph
            body: >-
              The most credible external market evidence points to a deployment-led ecosystem in which software, system
              integration, deployment, and maintenance are economically distinct. A State Taxation Administration data
              summary reported that January–May 2026 embodied-AI sales rose 22.4% year over year, while supporting
              information-system services revenue rose 1.9-fold; this supports a market mechanism, not Prague Technology
              traction. A separate WAIC account says the industry is moving from demonstrations toward production but
              that operational uptime and total cost of deployment were not disclosed for highlighted deployments. For
              Prague Technology, sales-cycle length, compute pass-through, integration labor, support burden, and
              customer concentration remain open. Until a customer contract or deployment cohort is disclosed, a
              high-value model API or enterprise license cannot be assumed to have software-like margins.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
