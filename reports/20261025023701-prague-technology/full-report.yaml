  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and maturity
        blocks:
          - type: paragraph
            body: >-
              The available company description characterizes Prague Technology as a world-model and embodied-AI
              startup, but the assigned successful fetches do not include a company homepage, product page, API, model
              card, repository, benchmark, customer deployment, or technical paper attributable to Prague Technology.
              That is a material diligence limitation rather than evidence that no product exists. Public comparators
              illustrate the range of what a mature technical disclosure looks like: Google DeepMind describes Genie 2
              as a foundation world model that generates action-controllable, playable 3D environments from a single
              prompt image, while OpenAI's Sora system card specifies multimodal inputs, output limits, a
              diffusion/transformer design, training-data categories, evaluations, and deployment mitigations. Prague's
              customer workflow, product surface, supported modalities, model access, and measurable benefit cannot be
              verified against that baseline.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Architecture, operating model, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The technical evidence points to a demanding architecture problem. Genie 2 describes autoregressive latent
              diffusion over video-derived latent frames, a transformer dynamics model, action conditioning, and a need
              to maintain world consistency across time. The embodied-intelligence survey frames physical simulators and
              world models as complementary components: simulation provides controlled training and evaluation, while
              world models support predictive planning and adaptation. Junyang Lin's discussion of agentic systems adds
              an operating-model constraint: the model is trained and evaluated with its environment or harness,
              including tools, sandboxes, feedback, and safeguards against reward hacking. None of the assigned sources
              establishes that Prague has built any particular stack, data pipeline, simulator, inference service, or
              proprietary feedback loop. Differentiation should consequently be underwritten only after primary
              technical materials and reproducible evaluations are obtained.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
      - number: '5.3'
        title: Deployment, reliability, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Product risk is elevated by the gap between compelling demonstrations and robust deployment. The survey
              identifies the sim-to-real and generalization problem as a central challenge for embodied intelligence.
              Sora's system card provides a concrete comparator for controls that a production generative system may
              need: external red teaming, content filtering, age gating, restrictions on likeness uploads, watermarking,
              reverse-search tooling, and iterative monitoring. These controls are not evidence that Prague faces the
              same exact misuse cases, but they show the level of operational detail required to assess a foundation
              model product. Public evidence in the assigned pool does not disclose Prague's reliability targets,
              incident history, privacy posture, security testing, export-control operating plan, evaluation suite, or
              support model. The investment case should therefore treat technical maturity and deployment readiness as
              open questions, not as inferred strengths from founder pedigree or sector momentum.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical proof gap
            body: >-
              Prague Technology's product, architecture, evaluation results, deployment controls, and developer surface
              are not established by the assigned successful evidence pool.
            calloutType: risk
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE012
          - type: callout
            title: Underwriting implication
            body: >-
              The relevant diligence question is not whether world models are technically plausible, but whether Prague
              can demonstrate a differentiated, controllable, measurable, and deployable system with evidence that is
              specific to the company.
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >
              Public reporting describes embodied AI as serving industrial production, software and
              information-technology services, scientific research, robotics, and prospective healthcare or industrial
              applications. China-wide data show that industrial enterprises increased purchases of embodied-AI robots
              2.3-fold in January–May 2026, while supporting information-system services revenue rose 1.9-fold; those
              are sector observations, not Prague Technology results. World-model coverage similarly describes the
              category as potentially useful for robotics, delivery, healthcare, industrial process control, and
              wearables, but does not name Prague Technology as a supplier or customer-facing vendor. The investable
              segmentation therefore remains a hypothesis: industrial and robotics buyers may be the eventual payer,
              technical teams may be the user, and integration or deployment partners may be the channel. No public
              source establishes which segment Prague Technology has converted.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports category demand, not company adoption. State Taxation Administration data
              reported by China Daily show 3,025 embodied-AI-related enterprises as of May 2026, 22.4% year-over-year
              sector sales growth in January–May, and 2.3-fold growth in industrial-enterprise robot purchases. Those
              denominators cover the sector and cannot be converted into Prague Technology accounts, active users,
              utilization, revenue, retention, or renewal. Independent world-model reporting also warns that
              research-first companies can take years to reach commercial applications; TechCrunch quotes AMI Labs' CEO
              saying world models are not a typical startup that releases in three months and reaches revenue in six
              months. Prague Technology has no public cohort, churn, NRR, GRR, contract-length, or customer-count
              disclosure in this pool.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >
              No assigned source names a Prague Technology customer, describes a Prague Technology pilot, or reports a
              production deployment, outcome, renewal, expansion, or concentration statistic. Comparable evidence shows
              what stronger proof would look like: Gasgoo reports that TARS's A1 robot received clear purchase
              intentions from clients across industries and European countries, while TechCrunch identifies Nabla as AMI
              Labs' first disclosed partner and says early models would be evaluated with real-world data. These are
              competitor examples and cannot be attributed to Prague Technology. The current customer case is
              consequently asymmetric: the market may be forming, but there is no company-specific proof of conversion
              or durability. Management should provide named references, signed contract status, deployment dates, usage
              or outcome metrics, and revenue concentration.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Commercial diligence implications
        blocks:
          - type: paragraph
            body: >
              The strongest positive signal is an expanding Chinese embodied-AI ecosystem with measurable industrial
              purchasing activity. The strongest negative signal is evidentiary: the assigned pool contains no Prague
              Technology customer proof, and the company-specific customer funnel cannot be separated into prospect,
              pilot, production, paid deployment, repeat purchase, or expansion. Competitive world-model coverage also
              indicates long commercialization timelines and high dependence on real-world evaluation. Until management
              provides a customer schedule and primary evidence, customer quality should not support a revenue estimate,
              a retention assumption, or a valuation premium. The key diligence test is whether at least three
              references can confirm paid production use, measurable outcomes, renewal or expansion intent, and the
              share of revenue represented by the largest accounts.
            claimRefs:
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU009
              - CU012
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof gap
            body: >-
              No public source in the assigned pool establishes a Prague Technology customer, pilot, production
              deployment, retention metric, or expansion contract; treat customer traction as unverified rather than
              inferred from category growth.
            calloutType: risk
            claimRefs:
              - CU009
              - CU012
              - CU015
          - type: callout
            title: Category demand is not company adoption
            body: >-
              Chinese embodied-AI industrial purchases and sector sales are growing, but the reported populations and
              periods do not identify Prague Technology or establish its revenue, active accounts, or utilization.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risk is not a documented incident at Prague Technology; it is the absence of
              public evidence that a pre-product world-model company can convert founder credentials and sector momentum
              into repeatable deployments. Sector evidence shows both intense capital formation and an early-stage
              competitive field. PanDaily reports 503 China embodied-intelligence funding rounds totaling more than RMB
              96 billion between July 2025 and June 2026, while also noting that even a highly patented competitor had
              only 20 core invention patents out of 262. The combination raises the bar for technical moat, data access,
              and customer proof. A thesis break would be a failure to demonstrate a production deployment with
              measurable outcomes, or a financing event that leaves compute capacity and runway materially below the
              plan. Monitoring should therefore emphasize signed deployments, repeat usage, model-evaluation deltas,
              cash runway, and funding terms rather than headline round size.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR010
              - CR012
      - number: '7.2'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Publicly available evidence in the assigned pool does not confirm Prague Technology's licenses, litigation
              status, privacy controls, export-control permissions, or incident history. That is a material diligence
              gap, not evidence that no issue exists. The company-registry URL in the pool resolves to a login page, so
              ownership, registered capital, legal representatives, and court history remain unverified from that
              source. The sector context also creates cross-border compliance exposure: an embodied-AI platform may
              combine model weights, robotics hardware, customer operational data, and cloud or GPU dependencies. Before
              investment, counsel should verify the Chinese entity and affiliates, IP assignments, data-processing
              basis, model and robotics safety obligations, export-control screening, and any restrictions affecting
              overseas customers or suppliers. A thesis break is a regulator, court, or counterparty finding that blocks
              core data, compute, or deployment access.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational, technical, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating model is exposed to three linked dependencies. First, agentic systems need reliable
              environments and tool access: the reviewed technical discussion identifies reward hacking as a central
              risk once models gain real tool access and says that training and inference must be cleanly decoupled to
              avoid rollout bottlenecks. Second, large incumbents are entering embodied intelligence as infrastructure
              providers, and automotive supply chains can transfer sensors, actuators, decision systems, and data
              pipelines into robotics. This can accelerate the market while compressing differentiation. Third,
              early-stage AI financing can obscure effective valuation and employee or investor downside: Forbes
              describes tranched rounds in which the headline valuation can differ materially from the blended price.
              Prague Technology's public financing, runway, customer concentration, supplier commitments, and model-cost
              profile are not established by this pool. The practical kill criteria are failed safety or reliability
              evaluations, inability to secure compute on acceptable terms, loss of a critical partner, or a financing
              requirement before repeatable commercial evidence.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Required monitoring and diligence actions
        blocks:
          - type: paragraph
            body: >-
              The risk posture should remain high until management supplies primary evidence. The minimum package is a
              current cap table and financing instruments; a 24-month cash, compute, and hiring plan; named pilot and
              production customers with outcome metrics; a model and robotics safety case; incident and vulnerability
              disclosures; IP ownership records; and a map of cloud, GPU, data, manufacturing, and distribution
              dependencies. External monitoring should track new entrants and financing intensity, benchmark
              reproducibility, regulator or court records, security incidents, export-control changes, and any
              down-round or tranche disclosures. Because sector valuation sentiment can reverse quickly, an investment
              committee should not treat any headline valuation or funding total as cash available or fair value without
              primary documentation. The decision should be revisited only when the gaps are closed with dated,
              attributable evidence.
            claimRefs:
              - CR002
              - CR006
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary risk
            body: >-
              The public record supports a high-risk posture because product proof, mitigation maturity, legal posture,
              financing terms, and runway are not established; this is an evidence gap, not a claim of an incident.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR012
          - type: callout
            title: Monitoring assumption
            body: >-
              A lower-risk rating requires dated primary evidence of production use, safety controls, compute access,
              and financing capacity; sector growth alone is not a substitute.
            calloutType: assumption
            claimRefs:
              - CR002
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Prague Technology should remain a track rather than a buy on the evidence available for this refresh. The
              company is associated with a high-credential world-model and embodied-AI thesis, but the pool does not
              provide a directly usable financing announcement, term sheet, audited financial statement, or cap-table
              disclosure for Prague Technology itself. That makes a price-sensitive recommendation impossible without
              false precision. The market context is supportive: China Daily reporting based on State Taxation
              Administration data says embodied-AI enterprise sales rose 22.4% year on year in January-May 2026 and
              industrial purchases of embodied-AI robots increased 2.3-fold, while the same report says 3,025 related
              enterprises existed as of May 2026. Those figures support market opportunity, not Prague Technology's
              share, margins, or conversion into cash flows. Marktechpost's account of Lin Junyang's transition from
              Qwen technical leadership toward agentic systems supports founder credibility and strategic relevance, but
              not enterprise value. The appropriate entry discipline is to require verified round size, price per share,
              preference stack, ownership, runway, product milestones, and evidence of paid deployment before
              underwriting a valuation or target return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and financing overhang
        blocks:
          - type: paragraph
            body: >-
              The investment thesis has two evidence-backed pillars and three material counters. First, the sector is
              expanding, with reported growth in Chinese embodied-AI sales and industrial adoption. Second, the
              founder's prior Qwen work is connected to a credible shift from static model reasoning toward agentic
              systems, including tool use and environment feedback. The anti-thesis is that market growth can coexist
              with severe selection and financing risk: Gasgoo reports a $455 million Pre-A round for competitor TARS,
              and says the capital is being used to develop proprietary models and recruit talent, illustrating the
              scale of capital required and the intensity of the comparator set. TheAI Rankings describes Qwen3.6 as an
              open-weight model under Apache 2.0 with free self-hosting, creating potential pricing and differentiation
              pressure for model-centric businesses. Forbes' reporting on tranched AI financings shows why a headline
              valuation can materially overstate a blended economic price and why employee or later-investor pricing can
              diverge from the first tranche. For Prague Technology, the missing financing documents are therefore not a
              clerical gap: they determine dilution, liquidation preference, cash available, and whether the reported or
              implied price is investable.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario framework and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              A scenario range is more defensible than a point estimate because the assigned evidence does not establish
              revenue, ARR, customer count, gross margin, burn, or a confirmed round price. The bull case requires proof
              that Prague Technology converts founder and research credibility into a differentiated product, secures
              paid industrial or platform deployments, and retains enough compute access to iterate under export-control
              constraints. The base case assumes continued technical development and sector growth but delayed
              monetization, with a valuation that must be negotiated against milestone evidence rather than narrative
              scarcity. The bear case combines an unverified or preference-heavy financing price with weak
              commercialization, open-model substitution, compute constraints, or talent dilution; in that case the last
              round would not be a reliable mark and a down-round or recapitalization risk would be material. The
              decision should move from track to invest only after primary documents answer the financing questions and
              operating evidence supports a model-appropriate revenue or milestone framework. Exit readiness is
              currently low because no public evidence in this pool establishes liquidity, a strategic buyer process, or
              a credible exit window.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence packet should include the signed financing documents, capitalization table on a fully
              diluted basis, option-pool treatment, liquidation and participation preferences, pro-rata rights, investor
              concentration, debt, and unrestricted cash. It should also include monthly management accounts, runway and
              burn reconciliation, revenue contracts, paid-pilot conversion, deployment reliability, compute
              procurement, export-control counsel, model evaluations against relevant open and closed alternatives, and
              a hiring and retention plan. The thesis breaks if the company cannot substantiate the claimed financing or
              valuation, if material proceeds are unavailable because of preference or escrow terms, if technical
              milestones repeatedly slip without paying customers, or if compute access prevents reproducible training
              and deployment. A valuation committee should use a staged entry with milestone-based release rather than
              relying on a headline mark. The public evidence supports the diligence path and a track recommendation; it
              does not support a precise target return, exit multiple, or investment price.
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Track rather than buy. The assigned public evidence supports the opportunity and founder narrative, but it
              does not support a precise entry price, return target, or current valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat an inability to produce signed financing terms, a fully diluted cap table, and evidence of paid
              commercialization as a thesis-break event rather than filling the gap with a headline valuation.
            calloutType: risk
            claimRefs:
              - CV008
              - CV014
              - CV015
