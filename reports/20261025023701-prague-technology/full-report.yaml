              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Financing is a runway input, not proof of cash available
        blocks:
          - type: paragraph
            body: >-
              A Sina Finance report, relaying The Information, described a first financing of “数亿美元” and an
              approximately $2 billion post-money valuation, including reported $100 million investments from GaoRong
              and Sequoia China and a $20 million Tencent investment. Those are reported transaction terms, not a
              verified cash balance, unrestricted cash amount, or runway. The company’s compute strategy may require
              substantial recurring GPU, data, and engineering expenditure before product revenue is established. The
              Silicon Review also described proposed Chinese restrictions affecting advanced models, training data,
              algorithms, and semiconductor partnerships; because the measures were still under review in that article,
              the financial implication is scenario risk rather than a booked cost. Cash, burn, debt, committed compute,
              tranche conditions, and next-round triggers remain material diligence requests.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is investable only as a high-uncertainty option on future commercialization. Positive
              evidence includes reported access to substantial initial capital and a market with growing activity in
              embodied-AI sales and related services. Counterweights are more important for underwriting: no public
              revenue or margin proof, no disclosed customer cohort, no disclosed cash or burn, and exposure to compute
              and cross-border technology constraints. The reported valuation should not be translated into a revenue
              multiple because the denominator is unavailable. A financing headline also should not be treated as cash
              available without confirmation of tranche terms, closing status, restrictions, and post-close liquidity.
              The recommendation from this chapter is research-more: request a monthly management pack, capitalization
              table, signed commercial pipeline, compute commitments, and a bridge from customer activity to gross
              profit.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
